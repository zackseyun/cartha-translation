  text: He sets an end to darkness[a], and he searches out every limit, the stones of gloom and deep darkness.
translation:
  language: tl
  text: Nagtatakda siya ng hangganan sa kadiliman, at hanggang sa bawat sukdulan ay sinasaliksik niya ang bato ng pusikit na dilim at ng matinding kadiliman.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, ayon sa mas tradisyonal na salin, “ang bato ng pusikit na dilim at ng lilim ng kamatayan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: קֵץ שָׂם לַחֹשֶׁךְ
  choice: Naglalagay siya ng hangganan sa kadiliman
  rationale: Ang קֵץ ay maaaring ‘wakas’ o ‘hangganan.’ Sa konteksto ng pagmimina, malinaw at likas sa Tagalog ang pagtatakda ng hangganan sa dilim habang pinapasok ng minero ang ilalim ng lupa.
- source_word: וּלְכָל תַּכְלִית
  choice: hanggang sa pinakadulong hangganan
  rationale: Ang תַּכְלִית dito ay tumutukoy sa sukdulan o pinakamalayong hangganan, hindi sa moral na kasakdalan. Ipinahihiwatig ng parirala ang lubusang paggalugad.
- source_word: הוּא חוֹקֵר
  choice: sinasaliksik niya
  rationale: Ang חקר ay masusing paghahanap o paggalugad. Ang ‘sinasaliksik’ ay natural at nagpapanatili sa masusing diwa ng pandiwa.
- source_word: אֶבֶן
  choice: ang mga batong
  rationale: Bagaman isahan ang anyo, maaari itong unawain nang kolektibo. Ang maramihang ‘mga bato’ ay malinaw sa konteksto ng pagmimina.
- source_word: אֹפֶל
  choice: pusikit
  rationale: Tumutukoy ang אֹפֶל sa matindi o makapal na dilim. Naiiba ito sa karaniwang ‘kadiliman’ sa unang linya.
- source_word: וְצַלְמָוֶת
  choice: napakalalim na dilim
  rationale: Sa larawang pagmimina ng talata, ang צַלְמָוֶת ay ang sukdulang dilim sa ilalim ng lupa. Ang tradisyonal na pagbasa na may kaugnayan sa kamatayan ay inilalahad sa talababa.
theological_decisions:
- issue: Kahulugan ng צַלְמָוֶת
  choice: napakalalim na dilim
  alternative: lilim ng kamatayan
  rationale: Pinapaboran ng konteksto ng pagmimina ang sukdulang dilim sa ilalim ng lupa, ngunit tunay na posible at tradisyonal ang pagbasa na ‘lilim ng kamatayan’; kaya pinanatili ito sa talababa nang hindi ipinipilit sa pangunahing teksto.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang ‘siya’ dahil ang paksa sa konteksto ay ang taong nagmimina. Pinanatili ang matinding pag-uulit ng mga salitang tumutukoy sa dilim at ang ambiguidad ng צַלְמָוֶת sa talababa.
