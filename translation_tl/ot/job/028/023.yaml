  text: God understands its way[a], and he knows its place.
translation:
  language: tl
  text: Nauunawaan ng Diyos ang daan nito,[a] at alam niya ang kinaroroonan nito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “nito” ay tumutukoy sa karunungan. Pambabae ang gramatikal na anyo nito sa Hebreo; maaari ring unawain ang “daan nito” bilang daan patungo sa karunungan.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Ang Diyos
  rationale: Bagaman anyong maramihan ang pangngalan sa Hebreo, ang mga pandiwang isahan ay malinaw na tumutukoy sa iisang Diyos.
- source_word: הֵבִין
  choice: ang nakauunawa
  rationale: Ipinahahayag ng Hiphil ng בין ang pag-unawa o pagkilala. Ang kasalukuyang anyo ay angkop sa pangkalahatan at namamalaging kaalaman ng Diyos.
- source_word: דַּרְכָּהּ
  choice: sa daan patungo sa karunungan
  rationale: Maaaring literal na unawain bilang “daan nito,” ngunit sa konteksto ng paghahanap sa karunungan, likas sa Tagalog ang “daan patungo sa karunungan.” Pinananatili sa talababa ang mas literal na posibilidad.
- source_word: וְהוּא
  choice: at ... niya
  rationale: Ang hiwalay na panghalip sa Hebreo ay nagbibigay-diin sa Diyos. Sa Tagalog, naipahahayag ito nang natural sa tahasang “Ang Diyos ang” sa unang sugnay at sa “niya” sa ikalawa.
- source_word: יָדַע
  choice: alam
  rationale: Payak at likas na katumbas ng pandiwang “malaman,” na dito ay nagsasaad ng namamalaging kaalaman.
- source_word: אֶת מְקוֹמָהּ
  choice: ang kinaroroonan nito
  rationale: Ang מָקוֹם ay “lugar” o “kinaroroonan.” Ang “kinaroroonan nito” ay malinaw at natural para sa kinaroroonan ng karunungan.
theological_decisions:
- issue: Tinutukoy ng mga hulaping pambabae sa “daan nito” at “kinaroroonan nito”
  choice: Tumutukoy ang mga ito sa karunungan; ginamit ang “nito” sa Tagalog.
  alternative: Gawing lantad ang pagsasatao sa karunungan sa pamamagitan ng “kanyang daan ... kanyang kinaroroonan.”
  rationale: Pambabae ang gramatikal na anyo ng “karunungan” sa Hebreo, at may pagsasatao sa konteksto. Gayunman, walang kasariang gramatikal ang mga panghalip sa Tagalog, kaya pinananatili ng “nito” ang sanggunian nang hindi pinalalakas ang pagsasatao nang higit sa hinihingi ng teksto.
- issue: Kahulugan ng “daan ng karunungan”
  choice: “daan patungo sa karunungan,” bilang malamang na diwa sa konteksto ng paghahanap at kinaroroonan nito.
  alternative: “daan nito,” na maaaring mangahulugang landas o paraan ng karunungan.
  rationale: Ang Hebreong דֶּרֶךְ na may hulaping tumutukoy sa karunungan ay tunay na maaaring basahing “daan nito” o, ayon sa konteksto, “daan patungo rito.” Pinili sa teksto ang mas malinaw na kontekstuwal na diwa at itinala ang literal na alternatibo.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “nakauunawa” at “kinaroroonan” upang mapanatili ang makatang tono nang hindi nagiging lipas o teknikal.
