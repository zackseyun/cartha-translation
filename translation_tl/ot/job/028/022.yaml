  source_fidelity: 'Ang pangunahing kahulugan ay wastong naipapahayag: sina Abadon at Kamatayan ay nagsasalita at ang nalaman nila tungkol sa karunungan ay mula lamang sa ulat. Gayunman, ang “sa sarili naming mga tainga” ay nagdaragdag ng idiomatikong diin na wala sa Hebreo at hindi natural sa Filipino. Ang panghalip sa “tungkol dito” ay mas mabuting iugnay nang malinaw sa Karunungan, ang pambabaeng tinutukoy ng hulapi sa שִׁמְעָהּ.'
