  text: Abaddon and Death say[a], ‘With our ears we have heard a report of it.’
translation:
  language: tl
  text: 'Sina Abadon at Kamatayan ay nagsabi,


    “Sa aming pandinig,


    narinig namin ang ulat tungkol sa Karunungan.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Sinabi ng Pagkawasak at ng kamatayan, ‘Narinig namin ang sabi-sabi tungkol sa Karunungan.’”
    reason: Ipinakikita ang leksikal na alternatibo para sa אֲבַדּוֹן at שִׁמְעָהּ, pati ang di-personipikadong paraan ng pagbasa.
lexical_decisions:
- source_word: אֲבַדּוֹן
  choice: Abadon
  rationale: Tinumbasan bilang transliteradong pangalan o titulo dahil kasama ito ng personipikadong Kamatayan bilang nagsasalita. Pinananatili nito ang masining na puwersa ng Hebreo, samantalang inilalahad sa talababa ang kahulugang “Pagkawasak.”
- source_word: וָמָוֶת
  choice: at ng Kamatayan
  rationale: Ginamit ang malaking titik upang ipahiwatig ang personipikasyon sa tula, nang hindi nagpapasya kung isa itong literal na persona.
- source_word: אָמְרוּ
  choice: Sinabi
  rationale: Ang pandiwa ay nasa anyong perfect; natural at tapat sa Filipino ang pangnagdaang “sinabi.” Posible ang masiglang pangkasalukuyang pagbasa, ngunit hindi kailangang ipilit iyon sa salin.
- source_word: בְּאָזְנֵינוּ
  choice: Sa sarili naming mga tainga
  rationale: Pinananatili ang tahasang idyoma ng pagdinig sa pamamagitan ng mga tainga at binibigyang-diin na pandinig lamang, hindi tuwirang pagkakita o pag-aangkin, ang kanilang kaalaman.
- source_word: שָׁמַעְנוּ
  choice: narinig namin
  rationale: Ito ang likas na Filipino para sa perfect na pandiwa at malinaw na nagsasaad ng natanggap na kaalaman.
- source_word: שִׁמְעָהּ
  choice: ang balita tungkol dito
  rationale: Ang pangngalan ay maaaring mangahulugang balita, ulat, o sabi-sabi. Ang hulaping pambabae ay tumutukoy sa karunungan sa konteksto; ang “tungkol dito” ay nagpapanatili ng reperensiya nang hindi inuulit ang pangngalan.
theological_decisions:
- issue: Personipikasyon ng Abadon at Kamatayan
  choice: Ituring silang personipikadong mga tagapagsalita sa pangunahing teksto.
  alternative: Isalin ang אֲבַדּוֹן bilang abstraktong “Pagkawasak” at ang kamatayan bilang di-personal na konsepto.
  rationale: Inilalarawan ng talata ang dalawa na nagsasalita at nakaririnig. Ipinahihiwatig ng malaking titik ang poetikong personipikasyon ngunit hindi nito ginagawang tiyak na ontolohikal na persona ang mga ito.
- issue: Panahunan ng אָמְרוּ
  choice: Gamitin ang pangnagdaang “Sinabi.”
  alternative: Gamitin ang pangkasalukuyang “Sinasabi.”
  rationale: Ang Hebreo ay morphologically perfect, bagaman maaari itong maging masigla o gnomic sa tula. Pinananatili ng pangnagdaan ang lantad na anyo nang hindi inaalis ang posibilidad na ang pahayag ay may patuloy na bisa.
translation_notes:
  register: Makabagong Filipino na marangal at madaling maunawaan. Ang paghahati sa mga linya ay nagpapanatili ng anyong patula. Ginamit ang “Abadon,” ang karaniwang anyong Filipino ng transliterasyon, at iniwasan ang labis na teknikal o denominasyonal na wika.
