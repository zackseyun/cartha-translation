  terminology: Ang “Abadon” ay katanggap-tanggap na transliterasyon ng אֲבַדּוֹן, at ang malaking titik sa “Kamatayan” ay angkop na hudyat ng poetikong personipikasyon, hindi isang doktrinal na pagpapasya. “Ulat” ay malapit sa שִׁמְעָהּ; pinananatili sa talababa ang “Pagkawasak” at “sabi-sabi” bilang mga alternatibo.
