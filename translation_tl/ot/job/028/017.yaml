base_translation:
  language: en
  yaml_path: translation/ot/job/028/017.yaml
  text: Gold and glass cannot equal it[b][a], nor can its exchange be an article of fine gold.
translation:
  language: tl
  text: Hindi ito mapapantayan ng ginto at salamin[a], ni maipagpapalit sa isang kagamitang yari sa dalisay na ginto.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kristal” sa halip na “salamin.” Maaaring tumukoy ang salitang Hebreo sa isang malinaw at mamahaling materyal; mas malamang dito ang “salamin.”
    reason: lexical_alternative
  - marker: b
    text: O “ni maipagpapalit sa isang sisidlang yari sa dalisay na ginto.” Maaari ring mangahulugan ang salitang Hebreo ng “sisidlan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעַרְכֶנָּה
  choice: Hindi ito mapapantayan
  rationale: Ang pandiwang ערך ay tumutukoy rito sa paghahambing o pagtataya ng halaga. Ipinahahayag ng salin na ang karunungan, na tinutukoy ng hulaping pambabae, ay hindi maaabot ng halaga ng mga binanggit na materyal.
- source_word: זָהָב
  choice: ginto
  rationale: Ito ang tuwiran at karaniwang kahulugan ng salita sa konteksto.
- source_word: זְכוֹכִית
  choice: salamin
  rationale: Malamang na tumutukoy ito sa glass, isang mamahaling malinaw na materyal noong sinaunang panahon. Pinananatili sa talababa ang posibleng saling “kristal.”
- source_word: תְמוּרָתָהּ
  choice: maipagpapalit
  rationale: Nagpapahiwatig ang תְּמוּרָה ng kapalit o pagpapalitan. Likas sa Filipino ang pandiwang anyo at malinaw nitong pinananatili ang larawang pangkalakalan.
- source_word: כְּלִי פָז
  choice: isang kagamitang yari sa dalisay na ginto
  rationale: Malawak ang saklaw ng כְּלִי at maaaring tumukoy sa isang sisidlan, kagamitan, o ginawang bagay. Ang פָז ay pinong o dinalisay na ginto, hindi lamang pangkalahatang “ginto.”
