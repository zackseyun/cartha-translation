translation_notes:
  register: Makabago, marangal, at malinaw na Filipino. Ginamit ang balanseng anyong patula na “ni… o…” at pinanatili sa mga talababa ang tunay na kawalang-katiyakan sa pagkakakilanlan ng dalawang bato.
