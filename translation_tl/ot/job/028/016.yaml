  yaml_path: translation/ot/job/028/016.yaml
  text: It cannot be valued with the gold of Ophir[b][a], with precious onyx or sapphire.
translation:
  language: tl
  text: Hindi ito matutumbasan ng dalisay na ginto ng Ofir, ng mahalagang onise[a], o ng safiro[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “berilo”; hindi tiyak ang eksaktong pagkakakilanlan ng batong tinutukoy ng salitang Hebreo.
    reason: lexical_alternative
  - marker: b
    text: Posible ring “lapis lazuli,” ayon sa sinaunang pag-uuri ng mga bato sa halip na sa makabagong mineralohiya.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְסֻלֶּה
  choice: matutumbasan
  rationale: Sa konteksto ng paghahambing ng karunungan sa mahahalagang materyales, likas sa Filipino ang “matutumbasan” at pinananatili nito ang diwa ng pagtataya at paghahambing ng halaga.
- source_word: בְּכֶתֶם אוֹפִיר
  choice: ng dalisay na ginto ng Ofir
  rationale: Ang כֶּתֶם ay pinong o dalisay na ginto, at ang Ofir ang tanyag na pinagmulan nito. Ang “ng” ay natural kasunod ng “matutumbasan” sa Filipino.
- source_word: שֹׁהַם
  choice: onise
  rationale: Hindi tiyak ang eksaktong batong tinutukoy ng terminong Hebreo. Pinili ang tradisyonal at madaling makilalang “onise,” habang inilalahad sa talababa ang “berilo” bilang alternatibo.
- source_word: יָקָר
  choice: mahalagang
  rationale: Ipinahahayag nito ang pambihirang halaga ng bato at natural itong panuring sa modernong Filipino.
- source_word: סַפִּיר
  choice: Safiro
  rationale: Pinananatili ang tradisyonal na pangalan ng bato; gayunman, maaaring lapis lazuli ang tinutukoy ayon sa sinaunang pag-uuri, kaya inilagay ang posibilidad na iyon sa talababa.
