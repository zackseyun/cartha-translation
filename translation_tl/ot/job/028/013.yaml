translation_notes:
  register: Gumamit ng natural ngunit marangal at matulaing modernong Filipino. Ang “lupain ng mga buháy” ay sadyang nagpapanatili sa idyoma ng Hebreo; nilagyan ng tuldik ang “buháy” upang luminaw ang bigkas at kahulugan.
