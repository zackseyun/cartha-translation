  yaml_path: translation/ot/job/028/013.yaml
  text: Man does not know its worth[b][a], and it is not found in the land of the living.
translation:
  language: tl
  text: Hindi alam ng tao[b] ang halaga nito[a], at hindi ito matatagpuan sa lupain ng mga buháy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “tinatayang halaga nito” o “presyo nito.” Ang salitang Hebreo ay tumutukoy sa pagtataya o halaga.
    reason: lexical_alternative
  - marker: b
    text: Ang “tao” ay salin ng isang pangngalang Hebreo na nasa isahan at tumutukoy sa mortal na tao bilang kinatawan ng sangkatauhan.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱנוֹשׁ
  choice: tao
  rationale: Ang pangngalan ay tumutukoy sa isang taong mortal at ginagamit dito bilang kinatawan ng sangkatauhan. Likas at inklusibo sa modernong Filipino ang “tao,” habang napapanatili ang anyong isahan.
- source_word: יָדַע
  choice: nalalaman
  rationale: Nagsasaad ang qatal ng pangkalahatang katotohanan sa konteksto. Hindi idinagdag ang diwang “hindi kayang malaman,” sapagkat wala sa pandiwa ang tahasang modal na kawalan ng kakayahan.
- source_word: עֶרְכָּהּ
  choice: halaga nito
  rationale: Ang עֵרֶךְ ay maaaring tumukoy sa pagtataya, halaga, o presyo. Malawak at natural ang “halaga” at hindi nito nililimitahan ang diwa sa komersiyal na presyo.
- source_word: תִמָּצֵא
  choice: hindi ito matatagpuan
  rationale: Pinananatili ng pasibong anyo ang Niphal at iniiwasang idagdag ang mas mariing modal na “hindi kayang matagpuan.”
- source_word: בְּאֶרֶץ הַחַיִּים
  choice: sa lupain ng mga buháy
  rationale: Pinananatili nito ang Hebreong idyoma at ang matulaing rehistro para sa daigdig o saklaw ng buhay ng tao.
