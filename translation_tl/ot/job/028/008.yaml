  text: לֹֽא הִדְרִיכֻ֥/הוּ בְנֵי שָׁ֑חַץ לֹֽא עָדָ֖ה עָלָ֣י/ו שָֽׁחַל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/028/008.yaml
  text: The proud beasts have not trodden it[a]; the lion has not passed over it.
translation:
  language: tl
  text: Hindi ito tinahak ng mababangis na hayop[a]; hindi ito dinaanan ng leon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “mga anak ng kapalaluan.” Malamang na tumutukoy ang parirala sa mababangis na hayop, lalo na sa mga maninila.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִדְרִיכֻהוּ
  choice: natatapakan ... iyon
  rationale: Sa konteksto ng isang lihim na landas, ipinahihiwatig ng Hiphil ng דרך ang pagtahak o pag-apak sa daan, hindi ang abstraktong diwang ‘gumabay.’ Natural sa Filipino ang ‘natatapakan’ at malinaw na tumutukoy sa pagdaan sa landas.
- source_word: בְנֵי שָׁחַץ
  choice: mababangis na hayop
  rationale: Literal itong ‘mga anak ng kapalaluan,’ ngunit sa paralelismo sa שׁחל (‘leon’) malamang na tumutukoy sa mariringal o mababangis na hayop, lalo na sa mga maninila. Inilalahad sa talababa ang literal na anyo at pinananatili sa teksto ang likas na larawang-hayop.
- source_word: עָדָה עָלָיו
  choice: nadaraanan ... iyon
  rationale: Ang pandiwang may עַל ay nagsasaad ng pagdaan sa ibabaw o pagtawid. Ang ‘nadaraanan’ ay likas sa Filipino at kaagapay ng ‘natatapakan’ nang hindi nagdaragdag ng teolohikal na pahiwatig.
- source_word: שָׁחַל
  choice: leon
  rationale: Isang patulang katawagan ito para sa leon, na maaaring magpahiwatig ng lakas o kabangisan. Sapat at malinaw ang ‘leon’; naipahihiwatig na ng konteksto ang bagsik nito.
theological_decisions: []
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang ‘iyon’ bilang panghalip sa nakatagong landas mula sa konteksto, at pinanatili ang patulang paralelismo ng dalawang sugnay.
