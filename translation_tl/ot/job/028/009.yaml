lexical_decisions:
- source_word: בַּחַלָּמִישׁ
  choice: sa batong pingkian
  rationale: Ang חַלָּמִישׁ ay matigas na bato o flint. Pinananatili ng “batong pingkian” ang kongkretong larawan, habang ang “sa” ay nag-iiwan ng saklaw para sa kamay na inilalapat o itinutok sa matigas na bato sa pagmimina.
- source_word: שָׁלַח יָדוֹ
  choice: Iniuunat niya ang kanyang kamay
  rationale: Ang idyomang שׁלח יד ay tumutukoy sa pag-abot o paglalapat ng kamay upang kumilos sa isang bagay. Ang “iniu-unat” ay likas sa Filipino at mas malapit sa pandiwang larawan kaysa sa literal na “ipinapadala.”
- source_word: הָפַךְ
  choice: binabaligtad niya
  rationale: Ang הפך ay nangangahulugang baligtarin, itaob, o lubusang baguhin ang ayos. Sa konteksto ng paghuhukay, ipinahihiwatig nito ang marahas na pagbungkal sa mga bundok.
- source_word: מִשֹּׁרֶשׁ
  choice: mula sa ugat ng mga ito
  rationale: Pinananatili nito ang tahasang larawan ng singular na שֹׁרֶשׁ, na maaaring may kolektibong diwa kaugnay ng maramihang “mga bundok,” sa halip na palitan agad ng mas interpretatibong “pundasyon.”
- source_word: הָרִים
  choice: ang mga bundok
  rationale: Tuwirang katumbas ng הָרִים ang “mga bundok.” Ang pantukoy na “ang” ay angkop sa likas na daloy ng pangungusap sa Filipino.
