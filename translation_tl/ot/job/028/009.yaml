translation_notes:
  register: Makabago ngunit marangal na Filipino, na pinananatili ang matinding larawang patula ng pagmimina. Ginamit ang “batong pingkian” bilang madaling maunawaang katawagan sa flint; ipinaliwanag sa talababa ang mas malawak na kahulugang matigas na bato. Ang mga panandang talababa ay inilagay kaagad pagkatapos ng kaugnay na parirala.
