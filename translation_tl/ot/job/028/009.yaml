  text: Inilalapat niya ang kanyang kamay sa batong pingkian[a]; binabaligtad niya ang mga bundok mula sa kanilang mga ugat.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “laban sa batong pingkian” o “sa batong napakatigas.” Maaaring inilalarawan ng Hebreo ang paglalapat ng kamay sa matigas na bato habang nagmimina.
