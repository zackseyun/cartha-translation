  text: לֹא יֻתַּ֣ן סְג֣וֹר תַּחְתֶּ֑י/הָ וְ/לֹ֥א יִ֝שָּׁקֵ֗ל כֶּ֣סֶף מְחִירָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/028/015.yaml
  text: Fine gold cannot be given in exchange for it[c][b][a], nor can silver be weighed as its price.
translation:
  language: tl
  text: Hindi maaaring ibigay ang dalisay na ginto[a] bilang kapalit nito, ni maaaring timbangin ang pilak bilang kabayaran dito.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “pinong ginto.”
    reason: lexical_alternative
  - marker: b
    text: Noong sinaunang panahon, tinitimbang ang pilak upang ipambayad. Ipinakikita rito na hindi matutumbasan ng anumang halaga ang karunungan.
    reason: cultural_note
lexical_decisions:
- source_word: יֻתַּן
  choice: maaaring ibigay
  rationale: Ang pasibong anyo ng נתן, kasama ng לֹא, ay nagsasaad na hindi maaaring ialay o ipambayad ang ginto; pinananatili ng saling ito ang ginto bilang bagay na ibinibigay.
- source_word: סְגוֹר
  choice: dalisay na ginto
  rationale: Tumutukoy ang bihirang salitang ito sa pinino o piling ginto; natural at marangal sa modernong Filipino ang “dalisay na ginto.”
- source_word: תַּחְתֶּיהָ
  choice: bilang kapalit nito
  rationale: Ang תַּחַת dito ay nagpapahayag ng pagpapalit, hindi ng lokasyong “sa ilalim.” Ang “nito” ay tumutukoy sa karunungan mula sa naunang konteksto.
- source_word: יִשָּׁקֵל
  choice: maaaring timbangin
  rationale: Ang pasibong anyo ng שקל ay tumutukoy sa pagtitimbang ng pilak upang ipambayad, gaya ng sinaunang kaugalian; ang modal na “maaaring” ay kaagapay ng unang sugnay.
- source_word: כֶּסֶף
  choice: pilak
  rationale: Pinananatili ang kongkretong larawan ng pilak, bagaman ginagamit ito noon bilang salapi.
- source_word: מְחִירָהּ
  choice: bilang kabayaran dito
  rationale: Ang מְחִיר ay halaga o presyong ibinabayad. Mas natural dito sa Filipino ang “kabayaran” kaysa sa literal ngunit matigas na “presyo nito.”
theological_decisions:
- issue: Ang tinutukoy ng mga hulaping pambabae sa תַּחְתֶּיהָ at מְחִירָהּ
  choice: “nito/dito,” na tumutukoy sa karunungan ayon sa konteksto
  alternative: Ulitin nang tahasan ang “karunungan” sa talata
  rationale: Malinaw sa nakapaligid na konteksto na karunungan ang tinutukoy, ngunit ginagaya ng mga panghalip ang kaiklian ng Hebreo at hindi nagdaragdag ng salitang wala sa mismong talata.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Pinanatili ang parallelism ng dalawang sugnay at ang sinaunang larawang pangkalakalan. Inilagay ang mga panandang [a] at [b] sa pangunahing teksto sa mismong bahaging nililinaw ng bawat talababa.
