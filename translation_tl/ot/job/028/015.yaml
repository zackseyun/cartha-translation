  source_fidelity: 'Tapat ang salin sa Hebreo. Ang סְגוֹר ang siyang paksa ng unang pasibong sugnay: ang dalisay na ginto ang hindi maibibigay bilang kapalit ng tinutukoy na pambabaeng panghalip. Wasto rin ang ikalawang sugnay: ang pilak ay hindi matitimbang bilang kabayaran nito. Hindi inuulit ng teksto ang “karunungan,” kaya ang “nito/dito” ay angkop na pagpapanatili ng anyo at kaiklian ng pinagmulan.'
  naturalness: 'Natural at malinaw ang modernong Filipino: “Hindi maaaring ibigay ... ni maaaring timbangin ...” ay maayos na magkatambal na pagtanggi, at ang “bilang kapalit nito” at “bilang kabayaran dito” ay madaling unawain sa kontekstong panghalaga o pangkalakalan.'
