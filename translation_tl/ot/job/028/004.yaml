  yaml_path: translation/ot/job/028/004.yaml
  text: He breaks open a shaft away from where people dwell[a]; forgotten by the foot, they hang far from men[c][b], they sway.
translation:
  language: tl
  text: Bumubutas siya ng isang lagusan, malayo sa tinitirhan ng mga tao[a]; ang mga taong hindi napapansin ng mga naglalakad sa ibabaw[b] ay nakabitin nang malayo sa mga tao[c] at umiindayog.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Bumubutas siya ng agusan o bangin na malayo sa kinaroroonan ng isang dayuhan.” Mahirap unawain ang Hebreo, lalo na ang mga salitang נַחַל at גָּר. Dahil pagmimina ang paksa ng kabanata, marami ang umuunawa sa נַחַל bilang hukay, lagusan, o baras ng minahan.
    reason: alternative_reading
  - marker: b
    text: Sa literal, “nalimutan mula o ng paa.” Maaaring ang lugar o ang mga tao roon ay hindi napapansin o naaabot ng mga naglalakad sa ibabaw.
    reason: lexical_alternative
  - marker: c
    text: O “ibinababa” o “nakalaylay.” Maaaring ilarawan ng pandiwang Hebreo ang mga taong ibinababa o nakabitin sa mga lubid, marahil sa isang minahan.
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּרַץ
  choice: Humuhukay
  rationale: Ang pandiwa ay nangangahulugang bumutas o marahas na magbukas. Sa konteksto ng pagmimina, natural na ipinahahayag ito ng “humuhukay,” bagaman hindi nito lubos na inilalantad ang puwersa ng literal na “bumubutas.”
- source_word: נַחַל
  choice: minahan
  rationale: Karaniwan itong tumutukoy sa batis, bangin, o agusan, ngunit sa larawan ng pagmimina sa kabanata ay malamang na tumutukoy sa hukay o lagusan ng minahan. Ginamit ang mas madaling maunawaang “minahan,” at inilagay sa talababa ang literal na alternatibo.
- source_word: מֵעִם גָּר
  choice: malayo sa tinitirhan ng mga tao
  rationale: Mahirap ang parirala; ang גָּר ay maaaring “dayuhan” o “naninirahan.” Ipinahahayag ng salin ang malamang na lokatibong diwa nang hindi inilalagay sa pangunahing teksto ang alanganing literal na anyo.
- source_word: הַנִּשְׁכָּחִים מִנִּי רָגֶל
  choice: nakalilimutan ng mga naglalakad sa ibabaw
  rationale: Literal itong “mga nalimutan mula/ng paa.” Ipinananatili ang ideya ng pagiging hindi napapansin o naaabot ng karaniwang naglalakad, habang nililinaw ang larawan ng mga taong nasa ilalim ng lupa.
- source_word: דַּלּוּ
  choice: nakabitin
  rationale: Maaaring mangahulugang ibinaba, nakabitin, o nakalaylay. Ang “nakabitin” ay angkop sa malamang na larawan ng mga minero na sinusuportahan ng lubid.
- source_word: מֵאֱנוֹשׁ
  choice: malayo sa ibang tao
  rationale: Ang אֱנוֹשׁ ay tumutukoy sa mortal na tao o sangkatauhan. Dito, ipinahihiwatig ng parirala ang pagkakahiwalay ng mga minero sa ibang tao.
- source_word: נָעוּ
  choice: umiindayog
  rationale: Ang pandiwa ay maaaring mangahulugang gumalaw nang paroo't parito, mayanig, o sumuray. Sa larawan ng mga nakabitin na minero, “umiindayog” ang likas at matingkad na katumbas.
