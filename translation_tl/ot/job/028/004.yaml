  source_fidelity: 'Ang pangunahing larawan ng pagmimina ay naaayon sa mahirap na Hebreo at sa audit trail, ngunit ang “Humuhukay siya ng minahan” ay hindi tumpak na kolokasyon: ang נחל ay mas malapit sa isang binutas na lagusan/baras kaysa sa buong “minahan.” Ang pagdaragdag ng “mga minero” ay isang makatwirang pagbasa ngunit dapat iwasan sa pangunahing teksto dahil hindi tahasang binabanggit sa Hebreo.'
  naturalness: 'May bahagyang suliranin sa sintaks ng kasalukuyang teksto: ang “nakalilimutan” ay walang malinaw na tinutukoy bago biglang ipinasok ang “mga minero.” Ang rebisyon ay nagbibigay ng malinaw na daloy sa modernong Filipino nang hindi ginagawang sobrang teknikal ang talata.'
  terminology: Ginamit ang “lagusan” para sa kontekstuwal na pagbasa ng נחל nang hindi ipinapantay ito sa buong minahan. Pinanatili ang “nakabitin” at “umiindayog,” na parehong angkop sa maaaring larawan ng mga taong ibinababa o nakalaylay. Ang “mga tao” para sa אֱנוֹשׁ ay likas at pangkalahatan.
