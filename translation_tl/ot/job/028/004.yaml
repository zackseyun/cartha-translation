revisions:
- from: Humuhukay siya ng minahan na malayo sa tinitirhan ng mga tao[a]; nakalilimutan ng mga naglalakad sa ibabaw[b], ang mga minero ay nakabitin nang malayo sa ibang tao[c] at umiindayog.
  to: Bumubutas siya ng isang lagusan, malayo sa tinitirhan ng mga tao[a]; ang mga taong hindi napapansin ng mga naglalakad sa ibabaw[b] ay nakabitin nang malayo sa mga tao[c] at umiindayog.
  rationale: Pinalitan ang “minahan” ng “lagusan” upang mas tumpak na katawanin ang kontekstuwal ngunit pinagtatalunang kahulugan ng נחל. Inayos ang pangalawang sugnay upang maging malinaw sa Filipino ang paksa ng mga pandiwang pangmaramihan, habang hindi tahasang ipinipilit na ang mga ito ay “mga minero.” Iningatan ng mga talababa ang mga alternatibong pagbasa at ang kawalang-katiyakan ng talata.
