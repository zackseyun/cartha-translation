  - severity: medium
    issue: Ang “mga minero” ay tahasang idinagdag sa pangunahing teksto.
    rationale: Malakas ang kontekstuwal na batayan para sa mga minero, ngunit ang Hebreo ay gumagamit lamang ng mga pangmaramihang anyo at hindi pinapangalanan sila. Mas maingat na tukuyin sila bilang “mga taong” sa konstruksiyong dulot ng participle, o iwan ang espesipikong pagmimina sa talababa.
  - severity: low
    issue: Hindi ganap na malinaw ang ugnayan ng “nakalilimutan” sa kasunod na sugnay.
    rationale: Ang rebisyon ay gumagawa ng isang buong pangungusap kung saan ang mga hindi napapansin ay siya ring nakabitin at umiindayog.
