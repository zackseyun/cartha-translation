translation:
  language: tl
  text: Ngunit ang karunungan—saan ito nagmumula? At nasaan ang lugar ng pagkaunawa?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O, mas natural: “Saan nagmumula ang karunungan, at saan matatagpuan ang pagkaunawa?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַחָכְמָה
  choice: Ngunit ang karunungan
  rationale: Ang חָכְמָה ay “karunungan.” Sa konteksto, ang וְ ay nagsisilbing panandang panalungat sa muling pagbaling sa pangunahing tanong, kaya natural ang “Ngunit” sa Filipino.
- source_word: מֵאַיִן
  choice: saan ... nagmumula
  rationale: Ipinahahayag ng מִן + אַיִן ang pinagmulan, “mula saan.” Ang ayos na “saan ito nagmumula?” ay likas sa modernong Filipino at pinananatili ang diin sa pinagmulan.
- source_word: תָּבוֹא
  choice: ito nagmumula
  rationale: Ang Qal imperfect ng בוא ay maaaring magpahayag ng pangkalahatan o retorikal na kasalukuyan. Ang “nagmumula” ay mas natural dito kaysa sa hinaharap na “darating,” sapagkat ang tanong ay tungkol sa pinagmulan ng karunungan sa pangkalahatan.
- source_word: וְאֵי זֶה
  choice: At saan matatagpuan
  rationale: Ang parirala ay lokatibong tanong na “at saan?” Sa Filipino, ang “saan matatagpuan” ay malinaw at natural kapag sinusundan ng מְקוֹם, bagaman bahagyang ginagawang di-tuwiran ang literal na “nasaan ang lugar.”
- source_word: מְקוֹם
  choice: matatagpuan
  rationale: Literal na “lugar,” ngunit ang diwa ng “saan ang lugar ng...” ay natural na naipahahayag sa Filipino bilang “saan matatagpuan...” Ang mas pormal na anyo ay inilagay sa talababa upang mapanatili ang estruktura ng Hebreo.
- source_word: בִּינָה
  choice: pagkaunawa
  rationale: Ang בִּינָה ay pagkaunawa, kabatiran, o pagk discern. Pinili ang “pagkaunawa” dahil malinaw ito sa karaniwang mambabasa at mahusay na kapareha ng “karunungan” nang hindi pinakikitid ang kahulugan.
