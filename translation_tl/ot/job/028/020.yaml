translation_notes:
  register: Makabagong Filipino na marangal at madaling maunawaan. Pinanatili ang retorikal at patulang diin sa pinagmulan ng karunungan; iniwasan ang makalumang “mula saan baga” at ang teknikal na “lokasyon.”
