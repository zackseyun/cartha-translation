  yaml_path: translation/ot/job/028/014.yaml
  text: The deep says[a], ‘It is not in me,’ and the sea says, ‘It is not with me.’
translation:
  language: tl
  text: 'Sinasabi ng kalaliman, “Wala siya sa akin,”

    at sinasabi ng dagat, “Wala siya sa piling ko.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תְּהוֹם
  choice: kalaliman
  rationale: Tumutukoy ito sa napakalalim na katubigan. Likas at maikli ang “kalaliman,” at napananatili nito ang patulang pagtutulad sa “dagat.”
- source_word: אָמַר
  choice: sinasabi
  rationale: Bagaman anyong qatal ang pandiwa sa Hebreo, ang pangkasalukuyang “sinasabi” ay angkop sa masiglang pagsasatao sa tula at sa magkatulad na mga linya.
- source_word: לֹא בִי הִיא
  choice: Wala siya sa akin
  rationale: Ang pambabaeng panghalip na הִיא ay tumutukoy sa karunungan, na pambabae rin sa gramatika ng Hebreo. Ang “siya” ay natural sa Tagalog dahil personipikado ang karunungan; ipinahahayag ng “sa akin” ang בִי nang hindi pinapawi ang larawan.
- source_word: יָם
  choice: dagat
  rationale: Ito ang karaniwang kahulugan ng יָם at tuwirang nagpapanatili sa larawang Hebreo at sa paralelismo nito sa kalaliman.
- source_word: אֵין עִמָּדִי
  choice: Hindi ko siya kasama
  rationale: Ang parirala ay nagsasaad na wala ang karunungan sa piling o pag-aari ng nagsasalita. Natural sa modernong Tagalog ang “Hindi ko siya kasama” at pinananatili nito ang relational-spatial na larawan sa halip na gawing tahasang “wala sa akin.”
theological_decisions:
- issue: Pambabaeng panghalip para sa karunungan
  choice: Gamitin ang “siya” nang walang talababa.
  alternative: Gamitin ang “ito” o lagyan ng paliwanag na pambabae ang panghalip sa Hebreo.
  rationale: Sa Tagalog, walang kasariang gramatikal ang “siya,” ngunit natural itong tumutukoy sa personipikadong karunungan. Kaya napananatili ang pagsasatao nang hindi nangangailangan ng paliwanag na maaaring magmukhang may likas na kasariang pambabae ang abstraktong karunungan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang patulang paralelismo at pagsasatao, habang iniiba nang bahagya ang dalawang sugnay upang katawanin ang pagkakaiba ng בִי (“sa akin”) at עִמָּדִי (“kasama ko”).
