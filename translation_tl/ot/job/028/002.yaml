  source_fidelity: 'Tumpak na naipapahayag ang paralelismo ng Hebreo: ang bakal ay kinukuha mula sa עָפָר (“alabok/lupa”), at ang tanso ay nakukuha sa pamamagitan ng pagtunaw mula sa bato. Ang “kinukuha” ay maingat na katumbas ng pasibong יֻקָּח at hindi labis na nagsasaad ng pagmimina. Ang “tinutunaw” ay isang makatwirang kontekstuwal na pagsasalin ng יָצוּק sa talata tungkol sa pagkuha ng mga metal.'
