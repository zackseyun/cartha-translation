  text: בַּ֭רְזֶל מֵ/עָפָ֣ר יֻקָּ֑ח וְ֝/אֶ֗בֶן יָצ֥וּק נְחוּשָֽׁה׃
base_translation:
  language: en
  yaml_path: translation/ot/job/028/002.yaml
  text: Iron is taken from the dust[a], and copper is smelted from stone.
translation:
  language: tl
  text: 'Ang bakal ay kinukuha mula sa alabok,

    at ang tanso[a] ay tinutunaw mula sa bato.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “bronse.” Maaaring tumukoy ang salitang Hebreo sa tanso o bronse; “tanso” ang ginamit dito dahil pagmimina at pagkuha ng metal mula sa batong may mineral ang konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּרְזֶל
  choice: bakal
  rationale: Karaniwang kahulugan ng pangngalan sa Hebreo at likas na katumbas sa modernong Tagalog.
- source_word: מֵעָפָר
  choice: mula sa alabok
  rationale: Pinananatili ng “alabok” ang kongkretong larawang ποιetiko ng עָפָר, na maaari ring tumukoy sa maluwag na lupa.
- source_word: יֻקָּח
  choice: kinukuha
  rationale: Malapit ito sa literal na pasibong diwa ng לקח at hindi nito labis na tinutukoy ang paraan bilang pagmimina.
- source_word: וְאֶבֶן
  choice: mula sa bato
  rationale: Ang אֶבֶן ay “bato.” Inilapat sa ikalawang sugnay ang relasyong “mula sa” upang maging malinaw at natural sa Tagalog na ang metal ay nakukuha mula sa batong may mineral.
- source_word: יָצוּק
  choice: tinutunaw
  rationale: Sa konteksto ng pagmimina at metalurhiya, ipinahihiwatig ng יצק ang pagkuha ng metal mula sa mineral sa pamamagitan ng pagtunaw; mas natural ang “tinutunaw” kaysa sa literal na “ibinubuhos.”
- source_word: נְחוּשָׁה
  choice: tanso
  rationale: Maaaring tumukoy ang terminong Hebreo sa copper o bronze. Sa konteksto ng pagkuha ng metal mula sa bato, mas angkop ang copper, na karaniwang tinatawag na “tanso” sa Tagalog.
