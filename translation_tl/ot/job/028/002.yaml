  register: Modernong Filipino Tagalog na payak ngunit marangal. Pinanatili ang paralelismong ποιetiko at ang konkretong “alabok” at “bato,” habang ginawang natural ang paglalarawan sa pagkuha at pagtunaw ng metal.
