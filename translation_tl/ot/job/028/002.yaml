  terminology: Wasto ang “bakal,” “alabok,” “bato,” at “tanso.” Maingat ding pinananatili ng talababa ang leksikal na posibilidad na “bronse,” nang hindi ipinipilit ang isang kahulugang lampas sa kontekstong pagmimina at pagkuha mula sa mineral na bato.
