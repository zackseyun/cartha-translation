  text: But where can wisdom be found[a], and where is the place of understanding?
translation:
  language: tl
  text: Ngunit saan matatagpuan ang karunungan[a], at nasaan ang lugar ng pag-unawa?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “Mula saan matatagpuan ang karunungan?”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַחָכְמָה
  choice: Ngunit ... ang karunungan
  rationale: Ang וְ ay minarkahan bilang retorikal na pagliko mula sa naunang paglalarawan ng pagmimina tungo sa tanong tungkol sa karunungan. Natural sa Filipino ang tiyak na anyong “ang karunungan.”
- source_word: מֵאַיִן
  choice: saan
  rationale: Literal itong “mula saan,” na maaaring tumukoy sa pinagmumulan. Sa tambalang “saan matatagpuan,” natural ang Filipino habang inilalagay sa talababa ang mas literal na anyo.
- source_word: תִּמָּצֵא
  choice: matatagpuan
  rationale: Ang Niphal imperfect ng מצא ay pasibong “matatagpuan.” Sa retorikal na tanong, sapat ang aspektong prospektibo/potensiyal nang hindi tahasang dinaragdagan ng “maaaring.”
- source_word: וְאֵי זֶה
  choice: at nasaan
  rationale: Ang idyomatikong tanong ay natural na isinasalin bilang “at nasaan”; hindi kailangang ilipat nang literal ang demonstratibong זֶה.
- source_word: מְקוֹם
  choice: ang dako
  rationale: Ang “dako” ay dignified ngunit malinaw na katumbas ng lugar, at angkop sa patulang tanong tungkol sa kinaroroonan o pinagmumulan.
- source_word: בִּינָה
  choice: pagkaunawa
  rationale: Pinananatili ng “pagkaunawa” ang karaniwang bokabularyo ng karunungan at ang pagkakaiba nito sa “karunungan,” habang nananatiling natural sa modernong Filipino.
