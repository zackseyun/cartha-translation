  yaml_path: translation/ot/job/028/024.yaml
  text: For he looks to the ends of the earth[b][a]; he sees under all the heavens.
translation:
  language: tl
  text: Sapagkat tumatanaw siya hanggang sa mga dulo ng lupa[a]; nakikita niya ang nasa ilalim ng lahat ng mga langit[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang pinakamalalayong bahagi ng lupa.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “sa ilalim ng lahat ng mga langit”; maramihan ang salitang “langit.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikilala nito ang dahilan ng naunang pahayag tungkol sa kaalaman ng Diyos sa karunungan.
- source_word: הוּא
  choice: niya
  rationale: Tumutukoy ang panghalip sa Diyos ayon sa konteksto; hindi na kailangang idagdag ang pangalang hindi tahasang nasa talata.
- source_word: לִקְצוֹת הָאָרֶץ
  choice: ang mga dulo ng lupa
  rationale: Likas at marangal na katumbas ito ng pinakamalalayong hangganan ng daigdig, habang pinananatili ang larawan ng Hebreo.
- source_word: יַבִּיט
  choice: nakikita
  rationale: Ipinahihiwatig ng Hiphil ng נבט ang sadyang pagtunghay o pagtingin; ang 'nakikita' ay natural sa Filipino at ang saklaw ay malinaw na sa parirala.
- source_word: תַּחַת כָּל הַשָּׁמַיִם
  choice: ang lahat ng nasa silong ng buong kalangitan
  rationale: Pinananatili ng 'nasa silong' ang larawang pansaklaw ng תַּחַת, at malinaw na ipinahahayag ng 'lahat' at 'buong kalangitan' ang ganap na saklaw.
- source_word: יִרְאֶה
  choice: nakikita niya
  rationale: Karaniwang pandiwa itong nangangahulugang 'makakita'; ang pag-uulit ay nagpapanatili sa paralelismo ng Hebreo.
theological_decisions:
- issue: Ang tinutukoy ng panghalip na הוּא
  choice: Ang Diyos ang simuno, ayon sa kagyat na konteksto.
  alternative: Iwanang ganap na di-tiyak ang tinutukoy ng panghalip.
  rationale: Sa konteksto ng Job 28, ang nakaaalam sa kinaroroonan ng karunungan at nakakakita sa buong sangnilikha ay ang Diyos; pagkilala ito sa reperente ng panghalip, hindi pagdaragdag ng doktrina.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang dalawang magkatulad na sugnay at ang malawak na larawang heograpiko-kosmiko ng Hebreo; inilagay ang bawat panandang talababa sa pangunahing teksto.
