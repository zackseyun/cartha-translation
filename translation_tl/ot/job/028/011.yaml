  text: He dams up the sources of the rivers[a], and brings what is hidden out to the light.
translation:
  language: tl
  text: Pinipigilan niya ang mga tagas mula sa mga ilog[a], at inilalabas niya sa liwanag ang anumang nakatago.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring, “Pinipigilan niya ang mga bukal ng mga ilog.” Bihira ang salitang Hebreo at maaari itong magpahiwatig ng pag-iyak, pagtulo, o pagtagas ng tubig.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִבְּכִי
  choice: ang pagtagas ng
  rationale: Bihira at mahirap tiyakin ang salitang ito, na kaugnay ng ideya ng “pag-iyak” o pagtulo. Sa konteksto ng pagmimina at pagkontrol sa tubig, ang “pagtagas” ay likas sa modernong Tagalog at pinananatili ang larawan ng tubig na tumatagas o tumutulo.
- source_word: נְהָרוֹת
  choice: mga ilog
  rationale: Karaniwang kahulugan nito ang mga ilog o batis. Pinili ang “mga ilog” bilang tuwirang katumbas, habang nananatiling angkop sa larawan ng mga daluyan ng tubig.
- source_word: חִבֵּשׁ
  choice: Hinaharangan niya
  rationale: Ang pandiwa ay may diwang pagtali, pagpigil, o pagsasara. Sa konteksto ng pagkontrol sa tubig, malinaw at natural ang “hinaharangan.”
- source_word: תַּעֲלֻמָהּ
  choice: ang nakatago
  rationale: 'Malawak ang tinutukoy ng pangngalan: anumang nakakubli o nakatago. Hindi ito nilimitahan sa kayamanan o mineral upang mapanatili ang saklaw ng Hebreo.'
- source_word: יֹצִא אוֹר
  choice: inilalantad niya
  rationale: Literal na ipinapahayag ng parirala ang pagpapalabas tungo sa liwanag. Ang “inilalantad” ay natural na idyomatikong Tagalog at malinaw na nagpapanatili sa pagsalungat ng pagkakatago at pagkakahayag.
