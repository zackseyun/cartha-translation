  naturalness: Natural at marangal ang rebisyon sa modernong Filipino Tagalog. Ang “inilalabas niya sa liwanag” ay tuwiran ngunit idyomatiko, at malinaw na katapat ng sanhiang “brings out ... to light.”
  terminology: Pinanatili ang “mga ilog” para sa נְהָרוֹת at ang malawak na “anumang nakatago” para sa תַּעֲלֻמָהּ. Hindi ipinagpapalagay na mineral o kayamanan ang nakatago. Inilalahad ng talababa ang alternatibong “mga bukal” at ang imahen ng pag-iyak/pagtulo nang hindi inaangking tiyak ang pinagtatalunang salita.
