translation_notes:
  register: Modernong Filipino Tagalog na maikli, marangal, at madaling maunawaan. Pinanatili ang di-tiyak na kahulugan ng bihirang terminong Hebreo sa pamamagitan ng talababa, at iniwasang tukuyin ang “nakatago” bilang isang partikular na mineral o kayamanan.
