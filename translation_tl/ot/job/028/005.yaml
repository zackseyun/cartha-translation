  text: As for the earth[a], from it bread comes out, but underneath it is turned up as by fire.
translation:
  language: tl
  text: Sa lupa nanggagaling ang tinapay, ngunit ang nasa ilalim nito ay nababaligtad na parang sa apoy.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “ngunit ang nasa ilalim nito ay nababaligtad na parang apoy.” Maaaring ilarawan ng paghahambing sa Hebreo ang paraan (“parang sa apoy”) o ang pagkakatulad lamang (“parang apoy”).'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶרֶץ
  choice: lupa
  rationale: Tumutukoy sa lupa bilang ibabaw na pinagmumulan ng pagkain at bilang bahaging may ilalim na hinuhukay; mas angkop ito rito kaysa sa teritoryal na “lupain.”
- source_word: מִמֶּנָּה
  choice: nanggagaling
  rationale: Ipinapahayag ang paglabas o pagmumula mula sa lupa sa natural na modernong Tagalog.
- source_word: יֵצֵא
  choice: nanggagaling
  rationale: Pinananatili ang diwa ng “lumalabas/nagmumula” nang hindi ipinapalagay na ang tinapay mismo ay literal na tumutubo.
- source_word: לָחֶם
  choice: tinapay
  rationale: Pinananatili ang kongkretong salita ng Hebreo, na maaari ring kumatawan sa pangunahing pagkain, sa halip na palawakin agad bilang “pagkain.”
- source_word: וְתַחְתֶּיהָ
  choice: ngunit ang nasa ilalim nito
  rationale: Ginawang tahasan ang kaibahan ng mabungang ibabaw at ng ginugulong ilalim, habang pinananatili ang reperensiya sa lupa.
- source_word: נֶהְפַּךְ
  choice: binabaligtad
  rationale: Inihahatid ang pasibong diwa ng Niphal at ang larawan ng lupa sa ilalim na binabaligtad o ginugulo sa pagmimina.
- source_word: כְּמוֹ אֵשׁ
  choice: na parang sa pamamagitan ng apoy
  rationale: Ipinakikita ang posibleng paghahambing sa paraan o epekto ng apoy, ngunit nilalagyan ng talababa dahil maaari rin itong simpleng mangahulugang “parang apoy.”
