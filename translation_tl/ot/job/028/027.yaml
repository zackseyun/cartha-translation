  text: Then he saw it and declared it; he established it[a], and also searched it out.
translation:
  language: tl
  text: Nang magkagayon, nakita niya ito at ipinahayag niya ito; itinatag niya ito at siniyasat din niya ito.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָז
  choice: Nang magkagayon
  rationale: Minamarkahan nito ang pagkakasunod-sunod sa patulang paglalarawan. Likas sa makabagong Filipino ang “Nang magkagayon” at napapanatili nito ang ugnayang temporal.
- source_word: רָאָהּ
  choice: nakita niya ito
  rationale: Ang ראה ay konkretong pandiwang “makita,” at ang hulaping pambabae ay tumutukoy sa karunungan sa naunang konteksto. Ang “ito” ay nagpapanatili sa panghalip nang hindi nagdaragdag ng personipikasyong hindi tahasang nakasaad sa Filipino.
- source_word: וַיְסַפְּרָהּ
  choice: ipinahayag
  rationale: Maaaring mangahulugan ang ספר ng pagbilang, pagsasalaysay, o pagpapahayag. Ang “ipinahayag” ay angkop sa daloy ng talata, habang inilalahad sa talababa ang tunay na lawak ng kahulugan.
- source_word: הֱכִינָהּ
  choice: itinatag niya ito
  rationale: Sa Hiphil, ang כון ay karaniwang nangangahulugang magtatag, magpatibay, o maglagay sa ayos. Ang “itinatag” ay marangal at likas, at inilalarawan ang karunungan bilang tiniyak o inayos ng Diyos.
- source_word: וְגַם
  choice: at ... din
  rationale: Ang hulma na “at ... din” ay natural sa Filipino at pinananatili ang pandagdag na diin ng parirala.
- source_word: חֲקָרָהּ
  choice: siniyasat
  rationale: Ipinahihiwatig ng חקר ang masinsinang pagsaliksik o pagsusuri. Pinananatili ng “siniyasat” ang masusing lakas ng pandiwa at ang tensiyong patula ng Diyos na nagsisiyasat sa karunungan.
theological_decisions:
- issue: Tinutukoy ng mga hulaping pambabae
  choice: Ang lahat ng hulaping pambabae ay isinalin bilang “ito” at inuunawang tumutukoy sa karunungan sa agarang konteksto.
  alternative: Maaaring unawain nang mas abstrakto na ang tinutukoy ay ang sukat o pagkakaayos ng karunungan.
  rationale: Karunungan ang pambabaeng pangngalan sa naunang konteksto at siya ang tuwirang layon ng apat na pandiwa. Hindi ginawang “siya” ang panghalip upang hindi higit na palakasin sa Filipino ang personipikasyon kaysa sa hinihingi ng anyong Hebreo.
translation_notes:
  register: Makabago, marangal, at patulang Filipino. Ginamit ang payak na magkakasunod na pandiwa upang mapanatili ang maikli at maindayog na estruktura ng Hebreo; ang talababa ay ikinabit sa “ipinahayag,” na siyang salitang may leksikal na kalabuan.
