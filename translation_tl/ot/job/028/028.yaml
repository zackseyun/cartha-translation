base_translation:
  language: en
  yaml_path: translation/ot/job/028/028.yaml
  text: And he said to man[a], ‘Behold, the fear of the Lord—that is wisdom, and to turn away from evil is understanding.’
translation:
  language: tl
  text: At sinabi niya sa tao[a], “Narito, ang pagkatakot sa Panginoon—iyon ang karunungan, at ang pagtalikod sa kasamaan ay pagkaunawa.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa sangkatauhan.” Ang Hebreong אָדָם ay pang-isahang “tao” na kumakatawan sa buong sangkatauhan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: At sinabi niya
  rationale: Pinananatili nito ang ugnayang pasalaysay ng wayyiqtol nang hindi ipinapalagay ang isang mas tiyak na pagkakasunod-sunod sa panahon.
- source_word: לָאָדָם
  choice: sa tao
  rationale: Ang אָדָם ay pang-isahang anyo ngunit kumakatawan dito sa buong sangkatauhan. Likas sa Filipino ang “tao” bilang pangkalahatang katawagan, habang inilalagay sa talababa ang mas tahasang kolektibong salin.
- source_word: הֵן
  choice: Narito
  rationale: Ipinakikita nito ang pantawag-pansing at maringal na diin ng Hebreong kataga sa pangwakas na pahayag.
- source_word: יִרְאַת אֲדֹנָי
  choice: ang pagkatakot sa Panginoon
  rationale: Pinananatili ang buong bigat ng יִרְאָה bilang takot na may pagpipitagan at pagkamangha, sa halip na paliitin ito sa “paggalang” lamang.
- source_word: אֲדֹנָי
  choice: Panginoon
  rationale: Ang אֲדֹנָי ay titulong banal at likas na isinasalin sa modernong Tagalog bilang “Panginoon.”
- source_word: הִיא
  choice: iyon ang
  rationale: 'Tahasan nitong ipinahahayag ang may-diin na pagtutumbas sa Hebreo: ang pagkatakot sa Panginoon—iyon ang karunungan.'
- source_word: חָכְמָה
  choice: karunungan
  rationale: Ito ang karaniwang at angkop na salin ng pangunahing katawagan sa panitikang karunungan.
- source_word: וְסוּר
  choice: at ang pagtalikod
  rationale: Inilalahad nito bilang kapantay na paksa ang sinasadyang paglayo o pagtalikod, ayon sa infinitibong Hebreo.
- source_word: מֵרָע
  choice: sa kasamaan
  rationale: Sa kontekstong ito, moral na kasamaan ang tinutukoy ng רָע, hindi lamang pinsala o kapahamakan.
- source_word: בִּינָה
  choice: pagkaunawa
  rationale: Ang “pagkaunawa” ay dignificado at malinaw na katumbas ng בִּינָה, at maayos na kapares ng “karunungan.”
theological_decisions:
- issue: Pagsasalin sa pangkalahatang אָדָם
  choice: tao
  alternative: sangkatauhan
  rationale: Bagaman pang-isahan ang anyong Hebreo, kumakatawan ito sa lahat ng tao. Pinananatili ng “tao” ang anyo at kinatawang diwa ng pinagmulan nang natural sa Filipino; nililinaw sa talababa ang kolektibong kahulugan.
- issue: Saklaw ng יִרְאַת אֲדֹנָי
  choice: pagkatakot sa Panginoon
  alternative: pagpipitagan sa Panginoon
  rationale: Hindi dapat pahinain ang יִרְאָה tungo sa paggalang lamang. Ang “pagkatakot” ay nagpapanatili sa teolohikal na tensiyon ng takot, pagkamangha, at pagpipitagan.
translation_notes:
  register: Makabago ngunit maringal na Filipino. Ginamit ang “Narito” upang mapanatili ang solemneng diin, at ang balanseng anyo ng dalawang sugnay upang maipakita ang paralelismo ng tulang Hebreo.
