  source_fidelity: 'Tumpak na naipapahayag ng salin ang Hebreong pahayag: ang kinatawang pang-isahang אָדָם, ang pantawag-pansing הֵן, ang may-diin na pagtutumbas sa הִיא, at ang magkatuwang na pahayag tungkol sa karunungan at pagkaunawa. Ang “pagkatakot sa Panginoon” ay hindi pinahina tungo sa simpleng paggalang, at ang “kasamaan” ay angkop sa moral na diwa ng רָע sa kontekstong ito.'
