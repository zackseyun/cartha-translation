translation_notes:
  register: Modernong Filipino na natural ngunit marangal ang himig. Ang “Tunay na” ay nagpapanatili sa diin ng pambungad; ang “dinadalisay” ay madaling maunawaan at hindi labis na teknikal. Inilagay ang bawat talababa kaagad sa kaugnay na salita o parirala.
