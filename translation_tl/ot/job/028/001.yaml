base_translation:
  language: en
  yaml_path: translation/ot/job/028/001.yaml
  text: Surely there is a mine for silver[b][a], and a place where they refine gold.
translation:
  language: tl
  text: Tunay na may minahan ng pilak[a], at may lugar kung saan dinadalisay ang ginto.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pinagmumulan ng pilak.” Ang salitang Hebreo ay maaaring tumukoy sa pinagmumulan o lugar na pinanggagalingan; “minahan” ang ginamit dahil pagmimina at pagkuha ng metal ang konteksto.
    reason: lexical_alternative
  - marker: b
    text: O “kung saan tinutunaw ang ginto.” Ang pandiwang Hebreo ay maaaring tumukoy sa pagdadalisay o sa pagtunaw ng mahalagang metal.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Tunay na
  rationale: Ginamit dito bilang panandang nagbibigay-diin sa pambungad ng tulang pagninilay, hindi bilang payak na sanhi.
- source_word: יֵשׁ
  choice: may
  rationale: Likas at karaniwang katumbas sa Filipino ng Hebreong panandang nagsasaad ng pag-iral.
- source_word: לַכֶּסֶף מוֹצָא
  choice: may minahan ng pilak
  rationale: Ang מוֹצָא ay literal na pinagmumulan o lugar na pinanggagalingan; sa konteksto ng pagmimina sa Job 28, malinaw at natural ang “minahan,” habang inilalagay sa talababa ang mas malawak na kahulugan.
- source_word: וּמָקוֹם לַזָּהָב
  choice: at may lugar ... ang ginto
  rationale: Pinananatili ang magkatugmang estruktura ng dalawang sugnay at ang kaugnayan ng lugar sa ginto.
- source_word: יָזֹקּוּ
  choice: kung saan dinadalisay
  rationale: Ang pandiwa ay maaaring tumukoy sa pagdadalisay o pagtunaw/pagsmelter ng metal. Ang pasibong di-tiyak na anyo sa Filipino ay natural na kumakatawan sa di-tiyak na maramihang tagaganap ng Hebreo.
