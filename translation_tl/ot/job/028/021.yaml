  yaml_path: translation/ot/job/028/021.yaml
  text: It is hidden from the eyes of every living thing[a], and concealed from the birds of the heavens.
translation:
  language: tl
  text: Nakatago ito sa paningin ng bawat nilalang na buháy, at lingid sa mga ibon sa himpapawid.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְנֶעֶלְמָה
  choice: Nakatago ito
  rationale: Ang Niphal perfect na pambabae ay tumutukoy sa karunungan mula sa konteksto. Likas sa Tagalog ang paglalagay ng “ito,” at pinananatili ng “nakatago” ang pasibo at resultang kalagayan nang hindi labis na itinatakda ang aspekto.
- source_word: מֵעֵינֵי
  choice: sa paningin ng
  rationale: Ang Hebreong idyomang literal na “mula sa mga mata ng” ay mas natural at malinaw sa modernong Tagalog bilang “sa paningin ng,” habang nananatili ang diwang hindi ito nakikita.
- source_word: כָל חָי
  choice: bawat nilalang na buháy
  rationale: Pinananatili nito ang malawak at pangkalahatang saklaw ng parirala, hindi lamang mga tao. Ginamit ang tuldik sa “buháy” upang malinaw na tumukoy sa pagiging may buhay.
- source_word: וּמֵעוֹף הַשָּׁמַיִם
  choice: at sa mga ibon sa langit
  rationale: Sa kontekstong patula, ang עוֹף ay likas na isinasaling “mga ibon.” Ang “sa langit” ay karaniwang modernong Tagalog para sa Hebreong “ng mga langit” at angkop sa mga ibong lumilipad sa himpapawid.
- source_word: נִסְתָּרָה
  choice: nakakubli
  rationale: Pinananatili ng “nakakubli” ang pasibo/resultang diwa at ang paralelismo, habang iniiwasan ang eksaktong pag-uulit ng “nakatago.”
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na marangal at patula ngunit madaling maunawaan. Pinanatili ang dalawang magkatulad na pahayag na “nakatago” at “nakakubli,” gayundin ang pangkalahatang saklaw ng כָל חָי. Walang footnote dahil hindi kailangan sa Tagalog ang alternatibong “sky/heavens”; natural na nasasaklaw ng “langit” ang larawan ng Hebreo.
