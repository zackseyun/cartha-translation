translation_notes:
  register: Modernong Filipino na malinaw ngunit marangal at makata. Pinanatili ang paralelismo ng dalawang linya at ang larawang “mata ng lawin.” Ang marker na [a] ay inilagay pagkatapos ng salitang kaugnay ng talababa.
