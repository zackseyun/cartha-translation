  text: A path no bird of prey knows[a], and the eye of the falcon has not seen it.
translation:
  language: tl
  text: 'May landas na hindi alam ng ibong mandaragit,

    at hindi nakita ng mata ng lawin.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “banog.” Isang ibong mandaragit ang tinutukoy ng Hebreo, ngunit hindi tiyak ang eksaktong uri.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָתִיב
  choice: landas
  rationale: Tumutukoy sa daan o bakas; ang “landas” ay likas at marangal sa makatang konteksto ng isang nakatagong ruta.
- source_word: לֹא יְדָעוֹ
  choice: hindi alam
  rationale: Ang pandiwa ay nangangahulugang “hindi nito alam.” Pinananatili ng payak na parirala ang tuwirang diwa at ang pagtutulad sa ikalawang linya.
- source_word: עָיִט
  choice: ibong mandaragit
  rationale: Pangkalahatang tawag ito sa ibong naninila, hindi tiyak na espesye; iniiwasan ng salin ang di-makatwirang pagpapakitid sa isang uri.
- source_word: וְלֹא שְׁזָפַתּוּ
  choice: hindi pa namamasdan
  rationale: Ang שׁזף ay maaaring mangahulugang makakita, makatanaw, o mapagmasdan. Ang “namamasdan” ay natural sa Filipino at angkop sa makatang larawan ng matalas na paningin.
- source_word: עֵין
  choice: mata ng
  rationale: Pinananatili ang literal at makatang larawang “mata ng” sa halip na gawing abstraktong “paningin.”
- source_word: אַיָּה
  choice: lawin
  rationale: Tumutukoy sa isang ibong mandaragit, ngunit hindi tiyak ang eksaktong espesye. Pamilyar at natural sa Filipino ang “lawin,” habang inilalahad sa talababa ang kawalang-katiyakan.
