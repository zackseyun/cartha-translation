  text: The topaz of Cush cannot equal it[a]; it cannot be valued in pure gold.
translation:
  language: tl
  text: Hindi ito mapapantayan ng topas ng Cush[a]; hindi matataya ang halaga nito sa dalisay na ginto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “krisolito ng Cush” o “peridot ng Cush”; hindi tiyak ang eksaktong uri ng batong tinutukoy ng salitang Hebreo.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעַרְכֶנָּה
  choice: Hindi ito mapapantayan
  rationale: Ipinapahayag ng ערך ang paghahambing sa halaga o antas. Likas sa modernong Filipino ang “mapapantayan,” at ang “ito” ay tumutukoy sa karunungan sa konteksto.
- source_word: פִּטְדַת כּוּשׁ
  choice: topas mula sa Cush
  rationale: Isang mahalagang bato ang פִּטְדָה, ngunit hindi tiyak ang eksaktong mineral. Pinanatili ang tradisyonal at kilalang “topas,” habang inilagay sa talababa ang ibang maaaring pagkakakilanlan. Isinalin ang ugnayang heograpikal bilang “mula sa Cush.”
- source_word: בְּכֶתֶם טָהוֹר
  choice: ng dalisay na ginto
  rationale: Ang כֶּתֶם ay pinong ginto, at idinaragdag ng טָהוֹר ang diwang dalisay. Kasama ng pandiwang tumutukoy sa pagtataya, natural sa Filipino ang “matutumbasan ng dalisay na ginto.”
- source_word: תְסֻלֶּה
  choice: hindi ito matutumbasan
  rationale: Sa konteksto, tumutukoy ang pandiwa sa pagtataya o paglalagay ng katumbas na halaga, hindi lamang sa literal na pagtitimbang. Ang “matutumbasan” ay nagpapanatili sa paralelismo at sa diwang walang maihahambing na presyo ang karunungan.
