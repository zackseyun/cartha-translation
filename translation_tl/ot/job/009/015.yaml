  source_fidelity: 'Tumpak ang salin sa Hebreo: ang concessive na “Kahit,” ang pagiging nasa katuwiran (צָדַקְתִּי), ang pagtangging sumagot, at ang pagsusumamo sa sariling hukom ay lahat naipahayag. Ang “magmamakaawa” ay angkop na salin ng אֶתְחַנָּן at likas na nagpapahiwatig ng pagsusumamo para sa awa o pabor, nang hindi kinakailangang magdagdag ng tahasang bagay na wala sa Hebreo.'
