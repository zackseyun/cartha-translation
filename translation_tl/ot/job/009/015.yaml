base_translation:
  language: en
  yaml_path: translation/ot/job/009/015.yaml
  text: Even if I were in the right, I would not answer; I would plead for mercy from my judge.
translation:
  language: tl
  text: Kahit nasa katuwiran ako, hindi ako sasagot; magmamakaawa ako sa aking hukom.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: צָדַקְתִּי
  choice: nasa katuwiran ako
  rationale: Ipinahahayag ang pagiging nasa tama o may matuwid na panig sa usapin, nang hindi pinalalabis bilang ganap na kawalang-kasalanan.
- source_word: לֹא אֶעֱנֶה
  choice: hindi ako sasagot
  rationale: Pinananatili ang tuwirang kahulugan ng pandiwa at ang posibleng kontekstong panghukuman.
- source_word: לִמְשֹׁפְטִי
  choice: sa aking hukom
  rationale: Ang anyo ay tumutukoy sa humahatol kay Job; likas at malinaw sa Tagalog ang “aking hukom.”
- source_word: אֶתְחַנָּן
  choice: magmamakaawa ako
  rationale: Isinasalin ang hitpael na nagpapahiwatig ng marubdob na pagsusumamo para sa awa o pabor.
theological_decisions:
- issue: Ang pahayag ni Job tungkol sa pagiging matuwid at sa pagharap sa hukom
  choice: 'Pinanatili ang tensiyon: kahit nasa katuwiran si Job, hindi siya sasagot kundi magmamakaawa.'
  alternative: Ipaliwanag na hindi talaga matuwid si Job o tukuying tahasan na Diyos ang “hukom.”
  rationale: Hindi nilulutas ng talata ang tensiyon at hindi tahasang binabanggit sa mismong sugnay ang Diyos; kaya iniiwasang magdagdag ng interpretasyong doktrinal.
translation_notes:
  register: Modernong Filipino Tagalog na maikli, marangal, at madaling maunawaan. Ginamit ang “nasa katuwiran” upang mapanatili ang panghukuman at moral na diwa, at “magmamakaawa” para sa matinding pagsusumamo.
