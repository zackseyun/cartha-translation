id: JOB.9.28
reference: Job 9:28
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: יָגֹ֥רְתִּי כָל עַצְּבֹתָ֑/י יָ֝דַ֗עְתִּי כִּי לֹ֥א תְנַקֵּֽ/נִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/009/028.yaml
  text: I am afraid of all my pains[b][a]; I know that you will not acquit me.
translation:
  language: tl
  text: Natatakot ako sa lahat ng aking pagdurusa[a]; alam kong hindi mo ako pawawalang-sala[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “lahat ng aking mga kirot,” “lahat ng aking dalamhati,” o “lahat ng aking suliranin.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “hindi mo ako ituturing na walang sala” o “hindi mo ako hahayaang hindi maparusahan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יָגֹרְתִּי
  choice: Natatakot ako
  rationale: Ang Qal perfect 1cs ng גור ay nagpapahayag ng takot o pangamba; natural sa Filipino ang pangkasalukuyang stative na “Natatakot ako.”
- source_word: כָל
  choice: lahat ng
  rationale: Tuwirang pinananatili ang pangkalahatang panukat.
- source_word: עַצְּבֹתָי
  choice: aking pagdurusa
  rationale: Maaaring tumukoy ang salita sa mga kirot, dalamhati, o suliranin. Sinasaklaw ng “pagdurusa” ang pisikal at emosyonal na hirap ni Job nang hindi nililimitahan sa isa lamang.
- source_word: יָדַעְתִּי
  choice: alam ko
  rationale: Ang Qal perfect 1cs ng ידע ay may stative na diwa rito at natural na isinasalin sa pangkasalukuyan.
- source_word: כִּי
  choice: -ng
  rationale: Ipinakikilala nito ang nilalaman ng nalalaman ni Job; ang pang-angkop sa “alam ko” ang likas na anyo sa Filipino.
- source_word: לֹא
  choice: hindi
  rationale: Karaniwang pananggi.
- source_word: תְנַקֵּנִי
  choice: mo ako pawawalang-sala
  rationale: Ang Piel ng נקה ay maaaring mangahulugang ipahayag na walang sala, pawalang-sala, o huwag hayaang hindi maparusahan. Pinananatili ng “pawawalang-sala” ang legal na himig ng pakikipagtalo ni Job.
theological_decisions:
- issue: Legal na diwa ng נקה sa pakikipag-usap ni Job sa Diyos
  choice: hindi mo ako pawawalang-sala
  alternative: hindi mo ako ituturing na walang sala; hindi mo ako hahayaang hindi maparusahan
  rationale: Pinananatili ng salin ang paniniwala ni Job na hindi siya ipahahayag ng Diyos na malinis sa paghatol, nang hindi nilulutas ang tensiyong teolohikal o nagdaragdag ng doktrinang wala sa talata.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “pagdurusa” upang mapanatili ang lawak ng עַצְּבֹתָי, at “pawawalang-sala” upang maipakita ang legal na himig ng נקה.
