  text: who made the Bear[a], Orion, and the Pleiades[c][b], and the chambers of the south.
translation:
  language: tl
  text: 'na gumawa[a] ng Oso[b], Orion, at Pleyades,

    at ng mga silid ng timog[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “na gumagawa.” Maaaring magpahiwatig ang pandiwaring Hebreo ng patuloy na pagkilos o ng isang gawaing natapos na.
    reason: lexical_alternative
  - marker: b
    text: Ang “Oso” ay salin ng Hebreong pangalan ng isang konstelasyon. Sa ilang matatandang salin, “Arcturus” ang ginamit.
    reason: alternative_reading
  - marker: c
    text: Ang “mga silid ng timog” ay malamang na isang matalinghagang pagtukoy sa mga tagong dako o mga konstelasyon sa katimugang langit.
    reason: cultural_note
lexical_decisions:
- source_word: עֹשֶׂה
  choice: na gumawa
  rationale: Ang Qal participle ay naglalarawan sa Diyos bilang gumagawa at nagpapatuloy sa paglalarawan mula sa naunang talata. Ang “na gumawa” ay natural sa Filipino bilang pagtukoy sa kaniyang paglalang, habang inilalahad sa talababa ang maaari ring kasalukuyang diwa.
- source_word: עָשׁ
  choice: Oso
  rationale: Pangalan ito ng isang konstelasyon. Pinananatili ng “Oso” ang malamang na kahulugan nang hindi ito labis na tinutukoy bilang “Dakilang Oso” o bilang partikular na bituing Arcturus.
- source_word: כְּסִיל
  choice: Orion
  rationale: Sa kontekstong astronomikal, karaniwang kinikilalang ito ang konstelasyong Orion; ang nakagawiang modernong pangalan ang pinakamalinaw sa mga mambabasa.
- source_word: כִימָה
  choice: Pleyades
  rationale: Karaniwang kinikilalang ito ang kumpol ng mga bituing Pleiades; “Pleyades” ang natural na anyong Filipino ng pangalan.
- source_word: חַדְרֵי תֵמָן
  choice: mga silid ng timog
  rationale: Literal itong “mga silid/panloob na silid ng timog.” Pinananatili ng salin ang matalinghagang larawan at hindi tahasang nilulutas kung tumutukoy ito sa mga tagong dako o mga konstelasyon sa katimugang langit.
