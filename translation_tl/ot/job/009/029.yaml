base_translation:
  language: en
  yaml_path: translation/ot/job/009/029.yaml
  text: I will be condemned[a]; why then should I labor in vain?
translation:
  language: tl
  text: Ako ay hahatulang may sala[a]; kung gayon, bakit pa ako magpapakapagod nang walang saysay?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Ako ay magiging masama.” Ang pandiwang Hebreo ay maaaring tumukoy sa pagiging masama o sa paghatol na ang isang tao ay may sala.
    reason: alternative_reading
lexical_decisions:
- source_word: אָנֹכִי
  choice: Ako
  rationale: Ang hiwalay na panghalip na unang panauhan ay nagbibigay-diin sa nagsasalita; pinananatili ito sa tahasang “Ako.”
- source_word: אֶרְשָׁע
  choice: ay hahatulang may sala
  rationale: Ang Qal ng רשע ay maaaring mangahulugang “maging masama” o, sa kontekstong panghukuman, “hatulang may sala.” Ang konteksto ng Job 9 ay nakatuon sa kawalan ni Job ng kakayahang mapatunayang matuwid sa harap ng Diyos, kaya ang panghukuman na diwa ang pinakamalamang, habang inilalagay sa talababa ang tunay na alternatibo.
- source_word: לָמָה זֶּה
  choice: kaya bakit pa
  rationale: 'Ang idyomang patanong ay may inferensiyal na puwersa: “kung gayon, bakit pa?” Natural itong naipahahayag sa Filipino bilang “kaya bakit pa.”'
- source_word: הֶבֶל
  choice: nang walang saysay
  rationale: Dito, ang הבל ay tumutukoy sa kawalang-kabuluhan o pagkabigo ng pagsisikap, hindi lamang sa literal na “singaw.”
- source_word: אִיגָע
  choice: ako magpapakapagod
  rationale: Ang יגע ay nagpapahiwatig ng pagpapagal at pagkapagod. Ang “magpapakapagod” ay natural sa retorikal na tanong at naipakikita ang bigat ng walang-bungang pagsisikap.
theological_decisions:
- issue: Panghukuman o moral na diwa ng רשע
  choice: “hahatulang may sala”
  alternative: “magiging masama”
  rationale: Mas angkop sa agarang konteksto ang panghukuman na diwa, sapagkat pinag-uusapan ni Job ang hindi niya mapatutunayang kawalang-sala sa harap ng Diyos. Gayunman, hindi ganap na inaalis ng Hebreo ang moral o deskriptibong pagbasa, kaya pinananatili iyon sa talababa.
translation_notes:
  register: Makabagong, dignificado, at madaling maunawaang Filipino. Ginamit ang “hahatulang may sala” sa halip na mas teknikal na “kondemdado,” at “magpapakapagod nang walang saysay” upang likas na maipahayag ang retorikal na tanong at ang diwa ng walang-bungang pagpapagal.
