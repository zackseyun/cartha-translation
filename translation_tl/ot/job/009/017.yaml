lexical_decisions:
- source_word: אֲשֶׁר
  choice: na
  rationale: Pang-ugnay na panghalip ito na nagpapatuloy sa paglalarawan sa Diyos mula sa naunang konteksto; natural sa Tagalog ang “na” sa ganitong sugnay.
- source_word: בִּשְׂעָרָה
  choice: sa gitna ng bagyo
  rationale: Ang שְׂעָרָה ay bagyo o unos, at maaaring ipahayag ng ב ang kalagayan o kasangkapan. Pinananatili ng “sa gitna ng bagyo” ang matingkad na larawan nang hindi lubusang isinasara ang ibang pagbasa.
- source_word: יְשׁוּפֵנִי
  choice: dumudurog sa akin
  rationale: Bihira at nakadepende sa konteksto ang pandiwang שׁוף. Ang matinding pananakit ang pinakamalamang dito dahil katambal nito ang pagdami ng mga sugat.
- source_word: וְהִרְבָּה
  choice: at nagpaparami
  rationale: Ang Hiphil ng רבה ay nangangahulugang paramihin o dagdagan; tuwiran nitong pinananatili ang anyo at tindi ng Hebreong tula.
- source_word: פְצָעַי
  choice: aking mga sugat
  rationale: Ang פצע ay sugat o pinsala; “mga sugat” ang pinakatuwiran at likas na salin sa kontekstong patula.
- source_word: חִנָּם
  choice: nang walang dahilan
  rationale: Ipinahahayag ng חִנָּם ang pagiging walang sanhi o batayan. Ang “nang walang dahilan” ay natural sa modernong Tagalog at pinananatili ang bigat ng protesta ni Job.
theological_decisions:
- issue: Kung ipinahihiwatig ng חִנָּם ang ganap na kawalang-sala ni Job o ang kaniyang pahayag na hindi nararapat ang kaniyang pagdurusa
  choice: nang walang dahilan
  alternative: nang hindi ko ito karapat-dapat; nang walang kabuluhan
  rationale: Tuwirang pinananatili ng salin ang mariing reklamo ni Job nang hindi ito pinahihina o nilulutas ang tensiyon tungkol sa katarungan ng Diyos.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog. Pinananatili ang patulang tindi at ang teolohikal na tensiyon ng reklamo ni Job; inilalahad sa mga talababa ang tunay na leksikal na kalabuan.
