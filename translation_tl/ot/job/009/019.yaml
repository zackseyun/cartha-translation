  yaml_path: translation/ot/job/009/019.yaml
  text: If it is a matter of strength[a], behold, he is mighty; and if of justice[b], who can summon him?
translation:
  language: tl
  text: Kung lakas ang pag-uusapan, masdan, siya ay makapangyarihan; at kung paghatol naman ang pag-uusapan, sino ang makapagpapatawag sa akin?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “sino ang makapagpapatawag sa akin?” Mahirap unawain ang parirala. Dahil sa legal na konteksto, inuunawa ito ng iba bilang “sino ang makapagpapatawag sa kanya?”
    reason: alternative_reading
lexical_decisions:
- source_word: לְכֹחַ
  choice: kung lakas ang pag-uusapan
  rationale: Ipinapakita ng לְ ang larangang tinutukoy—“kung tungkol sa lakas”—sa natural na modernong Tagalog.
- source_word: אַמִּיץ
  choice: makapangyarihan
  rationale: Ipinahahayag nito ang nangingibabaw na lakas nang hindi inuulit lamang ang salitang “lakas.”
- source_word: הִנֵּה
  choice: masdan
  rationale: Pinananatili ang mariing pantawag-pansin at marangal na himig ng Hebreo.
- source_word: לְמִשְׁפָּט
  choice: kung paghatol
  rationale: Pinananatili ang legal na larawang mahalaga sa konteksto; maaari rin itong tumukoy sa katarungan o isang usaping legal.
- source_word: יוֹעִידֵנִי
  choice: makapagpapatawag sa akin
  rationale: Ang anyong Hebreo ay may hulaping unang panauhang layon (“ako”) at sa kontekstong legal ay maaaring mangahulugang magtakda o magpatawag para sa pagdinig.
theological_decisions:
- issue: Ang legal na larawan sa hamon ni Job tungkol sa Diyos
  choice: Pinanatili ang pananalita ng hukuman at ang tahasang “sa akin” ng tekstong Masoretiko.
  alternative: “Sino ang makapagpapatawag sa kanya?” ayon sa daloy ng konteksto na walang makapaghaharap sa Diyos sa hukuman.
  rationale: Hindi dapat pahupain ang tensiyon ng pahayag ni Job. Dahil tahasang unang panauhan ang hulapi sa Hebreo ngunit may kontekstuwal na dahilan para sa ikatlong panauhan, inilagay sa pangunahing teksto ang anyong Hebreo at iniulat sa talababa ang alternatibo.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit malinaw. Ginamit ang “masdan” upang mapanatili ang retorikal na diin, at ang “pag-uusapan” upang natural na maipahayag ang kategoryang ipinakikilala ng לְ.
