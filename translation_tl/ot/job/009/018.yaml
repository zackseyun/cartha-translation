translation:
  language: tl
  text: Hindi niya ako hinahayaang makabawi ng hininga[a], sapagkat pinupuno niya ako ng kapaitan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “makahinga muli”; literal, “hindi niya ako pinahihintulutang ibalik ang aking hininga/espiritu.”
