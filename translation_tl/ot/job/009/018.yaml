    reason: lexical_alternative
lexical_decisions:
- source_word: יִתְּנֵנִי
  choice: hinahayaang
  rationale: Ang נתן na sinusundan ng pawatas ay may idyomatikong diwang ‘magpahintulot.’ Likas sa makabagong Tagalog ang ‘hindi niya ako hinahayaang’ at hindi nito pinananatili ang alanganing literal na ‘binibigyan.’
- source_word: הָשֵׁב רוּחִי
  choice: makabawi ng hininga
  rationale: Ang parirala ay literal na tumutukoy sa pagpapanumbalik ng hininga o espiritu. Sa konteksto ng walang tigil na paghihirap ni Job, ang ‘makabawi ng hininga’ ay natural na idyomang Tagalog para sa pagkakaroon ng sandaling makahinga at makapanumbalik ng lakas.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala rito ng כִּי ang dahilan ng naunang pahayag. Ang ‘sapagkat’ ay malinaw, marangal, at angkop sa patulang rehistro.
- source_word: יַשְׂבִּיעַנִי
  choice: pinupuno niya ako
  rationale: Ang Hiphil ng שבע ay nangangahulugang ‘punuin’ o ‘pasaganahin hanggang mabusog.’ Sa negatibong kontekstong ito, malinaw na naihahayag ng ‘pinupuno niya ako’ ang labis at mapaniil na karanasan nang hindi nagmumungkahi ng positibong kasiyahan.
- source_word: מַמְּרֹרִים
  choice: ng kapaitan
  rationale: Ang anyong maramihan ay maaaring tumukoy sa mga mapapait na bagay o karanasan. Natural sa Tagalog ang abstraktong ‘kapaitan,’ habang pinananatili sa talababa ang mas literal na posibilidad.
theological_decisions: []
translation_notes:
  register: Makabago at dignified na Filipino ang ginamit. Pinili ang likas na idyomang “makabawi ng hininga,” habang itinala sa talababa ang literal na saklaw ng רוּחַ bilang hininga o espiritu. Napanatili rin ang sanhi sa pamamagitan ng “sapagkat” at ang talinghaga ng pagkapuno sa kapaitan.
