  yaml_path: translation/ot/job/009/031.yaml
  text: then you would plunge me into the pit[b][a], and my own clothes would abhor me.
translation:
  language: tl
  text: kung magkagayon, ilulubog mo ako sa hukay[a], at kasusuklaman ako ng sarili kong mga damit.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa kanal.” Ang salitang Hebreo ay maaari ring mangahulugang “hukay,” “kanal,” o, sa ilang konteksto, “pagkawasak.”
    reason: lexical_alternative
  - marker: b
    text: O “at kasusuklaman ako ng aking mga kasuutan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: kung magkagayon
  rationale: Ipinagpapatuloy nito ang bunga ng ipinapalagay na paghuhugas sa naunang talata; natural sa Filipino ang kondisyunal at sunod-sunod na diwa.
- source_word: בַּשַּׁחַת
  choice: sa hukay
  rationale: Maaaring tumukoy ang שַׁחַת sa hukay, kanal, o pagkawasak. Pinananatili ng “hukay” ang kongkretong larawan nang hindi nililimitahan sa abstraktong pagkawasak.
- source_word: תִּטְבְּלֵנִי
  choice: ilulubog mo ako
  rationale: Ang טבל ay paglubog o paglublob. Malinaw at natural ang “ilulubog” at pinananatili nito ang tuwirang pagkilos ng kausap kay Job.
- source_word: וְתִעֲבוּנִי
  choice: kasusuklaman ako
  rationale: Malakas na pagkasuklam ang ipinahahayag ng תעב; ang anyong maramihan ng pandiwa ay tumutugma sa kasunod na “mga damit.”
- source_word: שַׂלְמוֹתַי
  choice: sarili kong mga damit
  rationale: Tumutukoy ito sa mga kasuutan ni Job. Itinatampok ng “sarili kong” ang kabalintunaang maging ang mga bagay na pinakamalapit sa kaniya ay masusuklam sa kaniya.
theological_decisions:
- issue: Ang gumagawa ng kilos ayon sa mga pandiwang nasa ikalawang panauhan
  choice: 'Tuwirang kinakausap ni Job ang Diyos: “ilulubog mo ako.”'
  alternative: 'Di-tiyak o pangyayaring pagbasa: mapupunta lamang si Job sa hukay.'
  rationale: Ang pandiwa ay ikalawang panauhang panlalaking isahan at nagpapatuloy sa tuwirang pakikipag-usap ni Job sa Diyos. Hindi pinalalambot ang tensiyong teolohikal ng kaniyang reklamo.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang matinding larawan ng paglubog at ang personipikasyon ng mga damit, pati ang tuwirang pananagutan ng kausap sa pandiwa.
