  source_fidelity: 'Tapat ang salin sa Hebreo: ang אָז ay naipahahayag bilang bunga ng hypotetikal na paglilinis sa naunang talata; ang ikalawang panauhang pandiwa ay nananatiling tuwirang nakausap sa Diyos; ang larawan ng paglulubog sa שַׁחַת ay napananatili; at ang mga damit ay wastong ginawang paksa ng maramihang pandiwang “kasusuklaman.”'
