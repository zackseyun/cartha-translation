  yaml_path: translation/ot/job/009/032.yaml
  text: For he is not a man like me[a], that I should answer him, that we should come together in court.
translation:
  language: tl
  text: Sapagkat hindi siya taong tulad ko, na maaari ko siyang sagutin at magkasama kaming humarap sa hukuman.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “at magkasama kaming humarap para sa paghatol.”
    reason: Pinananatili nito ang mas abstraktong posibleng kahulugan ng מִשְׁפָּט bilang “paghatol,” sa halip na ang kongkretong tagpuang “hukuman.”
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikita nitong ang talata ay paliwanag sa naunang hinaing ni Job at pinananatili ang ugnayang pangangatwiran.
- source_word: לֹא אִישׁ כָּמֹנִי
  choice: hindi siya taong tulad ko
  rationale: Ang אִישׁ dito ay tumutukoy sa tao bilang kaibahan ng Diyos. Likas sa modernong Tagalog ang “tao,” at hindi nito kinakailangang tukuyin ang kasarian kahit panlalaking isahan ang anyong Hebreo.
- source_word: אֶעֱנֶנּוּ
  choice: upang masagot ko siya
  rationale: Ang ענה ay “sumagot” o “tumugon”; sa kontekstong legal, ipinahihiwatig nito ang pagsagot sa kabilang panig sa isang usapin.
- source_word: נָבוֹא יַחְדָּו
  choice: magkasama kaming humarap
  rationale: Ang unang panauhang maramihan ay sumasaklaw kay Job at sa Diyos. Ang “magkasama kaming humarap” ay likas na Filipino at malinaw na naghuhudyat ng kapwa pagharap sa isang legal na tagpuan.
- source_word: בַּמִּשְׁפָּט
  choice: sa hukuman
  rationale: Maaaring mangahulugan ang מִשְׁפָּט ng paghatol, katarungan, o usaping legal. Sa larawang paglilitis ng konteksto, malinaw at natural na naihahatid ng “sa hukuman” ang kongkretong diwa.
theological_decisions:
- issue: Larawang legal sa pagitan ni Job at ng Diyos
  choice: Inilarawan ang imposible para kay Job na humarap sa Diyos na parang kapantay na kabilang panig sa hukuman.
  alternative: Isalin nang mas abstrakto bilang “magkasama kaming humarap para sa paghatol.”
  rationale: Legal ang konteksto ng מִשְׁפָּט, ngunit hindi dapat palawakin ang sinabi tungo sa isang tiyak na doktrina. Pinananatili ng salin ang tensiyon sa hinaing ni Job nang hindi ipinapakahulugang tunay na magkapantay sila ng Diyos.
- issue: Kasarian sa אִישׁ
  choice: Gamitin ang “tao.”
  alternative: Gamitin ang “lalaki.”
  rationale: Bagaman panlalaking isahan ang אִישׁ at lalaki si Job, ang mahalagang paghahambing dito ay ang Diyos laban sa isang tao. Sa Tagalog, “tao” ang pinakatumpak at likas na katumbas nang hindi binubura ang personal na “tulad ko.”
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “siya” para sa Diyos ayon sa konteksto at ang “hukuman” upang malinaw na maipahayag ang legal na talinghaga nang hindi nagdaragdag ng denominasyonal na pagpapakahulugan.
