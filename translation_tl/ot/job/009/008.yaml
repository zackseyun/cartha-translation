  text: 'Siya lamang ang nag-uunat ng kalangitan

    at tumatapak sa mga kaitaasan ng dagat.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “lumalakad sa mga alon ng dagat.”
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹטֶה
  choice: nag-uunat
  rationale: Ang Qal participle ay naglalarawan ng patuloy o katangiang pagkilos na pag-uunat o paglalatag; natural sa makabagong Tagalog ang “nag-uunat” at pinananatili nito ang masiglang larawang patula.
- source_word: שָׁמַיִם
  choice: ang kalangitan
  rationale: Sa kontekstong patula at kosmolohikal, ang “kalangitan” ay mas malawak kaysa sa karaniwang “langit” bilang nakikitang himpapawid at likas sa modernong Tagalog.
- source_word: לְבַדּוֹ
  choice: Siya lamang
  rationale: Binibigyang-diin nito na walang kasamang gumagawa o tumutulong sa Diyos; ang “Siya lamang” ay malinaw at mariin.
- source_word: וְדוֹרֵךְ
  choice: at tumatapak
  rationale: Ang דרך ay maaaring mangahulugang tumapak o lumakad sa ibabaw. Pinananatili ng “tumatapak” ang pisikal na talinghaga nang hindi ipinahihiwatig ang mapanirang pagyurak.
- source_word: עַל
  choice: sa
  rationale: Ang “sa” ang natural na panandang Tagalog para sa pag-apak o paglakad sa ibabaw ng isang bagay.
- source_word: בָּמֳתֵי
  choice: matataas na bahagi
  rationale: Pangunahing kahulugan ng במה ang taas o mataas na dako. Pinananatili ng parirala ang anyong matalinghaga sa pangunahing teksto, sa halip na agad itong ipakahulugang “mga alon.”
- source_word: יָם
  choice: dagat
  rationale: Tumutugma ang isahang “dagat” sa Hebreo at sa malawak na larawang kosmiko ng talata.
theological_decisions:
- issue: Matalinghagang paglalarawan sa paghahari ng Diyos sa sangnilikha
  choice: Panatilihin ang paglalarawan na Siya lamang ang nag-uunat ng kalangitan at tumatapak sa matataas na bahagi ng dagat.
  alternative: Isalin nang higit na interpretatibo bilang “lumalakad sa mga alon ng dagat.”
  rationale: Ipinahahayag ng talata ang natatanging kapangyarihan ng Diyos sa maringal na wikang patula. Pinananatili ng salin ang tunay na larawan at hindi ito nililimitahan sa isang paliwanag o dinaragdagan ng doktrinang wala sa teksto.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog. Ginamit ang “kalangitan” para sa patulang saklaw ng שָׁמַיִם at pinanatili sa pangunahing teksto ang di-karaniwang larawang “matataas na bahagi ng dagat,” habang inilagay sa talababa ang mas interpretatibong “mga alon.”
