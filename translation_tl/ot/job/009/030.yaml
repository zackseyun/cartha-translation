  terminology: Ang “lihiya” ay angkop para sa בֹּר bilang alkalinong panlinis. Ang “mga kamay” ay natural na katumbas ng literal na “mga palad” sa kontekstong ito. Pinananatili ng talababa ang mas malawak ngunit hindi gaanong tiyak na alternatibong “sabon.”
