lexical_decisions:
- source_word: אִם
  choice: Kung
  rationale: Tuwirang panandang kondisyon na nagpapanatili sa hipotetikal na takbo ng pangangatwiran ni Job.
- source_word: הִתְרָחַצְתִּי
  choice: hugasan ko ang aking sarili
  rationale: Ipinapanatili ang pasariling diwa ng Hitpael at natural itong nauunawaan sa modernong Filipino.
- source_word: במו שָׁלֶג
  choice: ng niyebe
  rationale: Inilalahad ang niyebe bilang gamit sa paghuhugas nang hindi idinaragdag ang interpretasyong ‘tubig mula sa niyebe.’
- source_word: וַהֲזִכּוֹתִי
  choice: at linisin
  rationale: Ang Hiphil ng זכה ay nangangahulugang gawing malinis o dalisay; ang ‘linisin’ ay natural at angkop sa paralelismo.
- source_word: בְּבֹר
  choice: ng lihiya
  rationale: Tumutukoy ito sa isang alkalinong sangkap na panlinis; mas tiyak ang ‘lihiya’ kaysa sa karaniwang modernong ‘sabon.’
- source_word: כַּפָּי
  choice: aking mga kamay
  rationale: Bagaman literal na ‘aking mga palad,’ mas natural ang ‘aking mga kamay’ sa konteksto ng paglilinis.
