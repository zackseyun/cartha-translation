  source_fidelity: Ang draft ay wastong naipapahayag ang hipotetikal na kondisyon, ang reflexive na paghuhugas, at ang paglilinis ng mga kamay sa pamamagitan ng בֹּר. Gayunman, ang “hugasan ... ng niyebe” ay maaaring mabasa sa Filipino bilang pag-aalis ng niyebe mula sa sarili, sa halip na paggamit ng niyebe bilang panlinis. Mas malinaw ang instrumental na “gamit ang niyebe,” nang hindi idinadagdag ang ideyang tunaw na niyebe o tubig-niyebe.
