  terminology: Ang “mga walang sala” ay angkop para sa נְקִיִּם. Ang “hagupit” at “tinutuya” ay matitibay at angkop sa rehistrong patula-karunungan ng Job. Hindi ipinipilit ng salin ang isang doktrinal na pagkakakilanlan para sa di-tahasang paksa ng pandiwa.
