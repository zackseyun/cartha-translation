id: JOB.9.23
reference: Job 9:23
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: אִם שׁ֭וֹט יָמִ֣ית פִּתְאֹ֑ם לְ/מַסַּ֖ת נְקִיִּ֣ם יִלְעָֽג־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/009/023.yaml
  text: If a scourge kills suddenly[a], he mocks the calamity of the innocent.
translation:
  language: tl
  text: Kung biglang pumapatay ang isang hagupit, tinutuya niya ang pagkalugmok ng mga walang sala.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang pagsubok sa mga walang sala” o “ang panghihina ng mga walang sala.” Ang Hebreong pangngalan ay maaaring tumukoy sa pagsubok o sa pagkatunaw, pagbagsak, at panghihina.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Kung
  rationale: Pinananatili ang tuwirang kondisyunal o hipotetikal na diwa ng Hebreong pangatnig, sa halip na gawing mas tiyak na pangyayaring inuulit sa pamamagitan ng “Kapag.”
- source_word: שׁוֹט
  choice: isang hagupit
  rationale: Ang salita ay maaaring tumukoy sa latigo o sa mapaminsalang salot. Ang “hagupit” ay natural sa Filipino at napapanatili ang konkretong larawan at ang metaporikal na diwa ng malawakang kapahamakan.
- source_word: יָמִית
  choice: pumapatay
  rationale: Ang Hiphil ng מות ay nangangahulugang magdulot ng kamatayan o pumatay; malinaw at kasalukuyang Filipino ang “pumapatay.”
- source_word: פִּתְאֹם
  choice: biglang
  rationale: Tumpak at natural na katumbas ng pang-abay na “suddenly.”
- source_word: לְמַסַּת
  choice: ang pagkalugmok
  rationale: Ipinahahayag nito ang posibleng diwa ng pagkatunaw, pagbagsak, o panghihina sa ilalim ng pagdurusa nang hindi lamang inilalarawan ang panloob na damdamin. Dahil maaari rin itong maunawaan bilang pagsubok, inilagay ang alternatibo sa talababa.
- source_word: נְקִיִּם
  choice: mga walang sala
  rationale: Natural na Filipino para sa mga taong malaya sa pagkakasala o hindi nararapat dumanas ng parusa.
- source_word: יִלְעָג
  choice: tinutuya niya
  rationale: Pinananatili ang matalim na diwa ng panunuya o paghamak at ang pang-isahang paksa na hindi tahasang pinangalanan sa Hebreo.
theological_decisions:
- issue: Ang paksa ng “tinutuya niya”
  choice: Ginamit ang hindi tahasang tinutukoy na “niya,” na sa konteksto ay maaaring tumukoy sa Diyos
  alternative: Maaaring personipikasyon ang hagupit bilang siyang nanunuya, o maaaring di-tiyak ang gumagawa ng kilos
  rationale: Hindi tahasang pinangalanan ng Hebreo ang paksa. Pinananatili ng “niya” ang gramatikal at teolohikal na tensiyon ng paratang ni Job nang hindi idinaragdag ang pangalang “Diyos” sa mismong talata.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinili ang “hagupit” upang mapanatili ang larawan ng latigo at ang mas malawak na diwa ng salot; iniwasang gawing tahasan ang Diyos bilang paksa dahil hindi siya pinangalanan sa Hebreo.
