  source_fidelity: 'Tapat ang salin sa Hebreo: ang “Kung,” “biglang,” “pumapatay,” at “tinutuya niya” ay maayos na tumutugon sa kondisyunal na pahayag, biglaang pagpatay, at panunuya. Ang “hagupit” ay pinananatili ang konkretong larawan ng שׁוֹט at maaari ring umabot sa metaporikal na kapahamakang saklaw nito. Ang “pagkalugmok” ay isang ligtas na pangunahing pagpili para sa pinagtatalunang לְמַסַּת, habang maayos na itinatala ng talababa ang alternatibong ‘pagsubok’ at ang larawang panghihina/pagkatunaw.'
