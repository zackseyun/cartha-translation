base_translation:
  language: en
  yaml_path: translation/ot/job/009/024.yaml
  text: The earth is given into the hand of the wicked[a]; he covers the faces of its judges. If not[b], then who is it?
translation:
  language: tl
  text: 'Ang daigdig ay ibinigay sa kamay ng masama[a];

    tinatakpan niya[b] ang mga mukha ng mga hukom nito.

    Kung hindi, sino nga?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Ang lupain ay ibinigay sa kamay ng isang masamang tao.” Ang Hebreong אֶרֶץ ay maaaring mangahulugang “daigdig” o “lupain,” at ang רָשָׁע ay maaaring tumukoy sa isang “masamang tao” o sa “masama” sa pangkalahatan.
    reason: lexical_alternative
  - marker: b
    text: Hindi tahasang binabanggit sa Hebreo kung sino ang simuno ng “tinatakpan niya.” Maaaring tumukoy ito sa Diyos, sa masamang pinuno, o sa isang di-tiyak na gumagawa ng kilos.
    reason: alternative_reading
lexical_decisions:
- source_word: אֶרֶץ
  choice: Ang daigdig
  rationale: Maaaring tumukoy ang אֶרֶץ sa buong daigdig o sa isang lupain. Sa malawak na paglalarawan ni Job sa umiiral na kawalang-katarungan, ang “daigdig” ang pinakamainam, habang inilalagay sa talababa ang “lupain” bilang tunay na posibilidad.
- source_word: נִתְּנָה
  choice: ay ibinigay
  rationale: Ang Niphal perfect ng נתן ay pasibo. Ang “ay ibinigay” ay malinaw at maaaring magpahiwatig ng kalagayang bunga ng naganap na pagbibigay.
- source_word: בְיַד
  choice: sa kamay ng
  rationale: Pinananatili nito ang kongkretong Hebreong idyoma para sa pagkakalagay sa kapangyarihan o pamamahala ng iba.
- source_word: רָשָׁע
  choice: ang masama
  rationale: Ang pang-isahang anyo ay maaaring tumukoy sa isang masamang tao o gamitin sa pangkalahatang diwa. Pinananatili ng “ang masama” ang kaiklian at saklaw ng Hebreo nang hindi agad nililimitahan sa isang tiyak na pinuno.
- source_word: פְּנֵי שֹׁפְטֶיהָ
  choice: ang mga mukha ng mga hukom nito
  rationale: Tuwirang pinananatili ang larawan ng “mga mukha” at ang kahulugan ng שֹׁפְטִים bilang “mga hukom.” Ang “nito” ay tumutukoy sa daigdig.
- source_word: יְכַסֶּה
  choice: tinatakpan niya
  rationale: Ang Piel imperfect na panlalaking pang-isahan ay aktibong “tinatakpan niya.” Hindi pinapangalanan ng salin kung sino ang “niya,” kaya nananatili ang kalabuan ng Hebreo.
- source_word: אִם לֹא אֵפוֹא מִי הוּא
  choice: Kung hindi, sino nga?
  rationale: Maikli at likas itong hamong retorikal. Ipinahihiwatig ng “nga” ang diin ng אֵפוֹא nang hindi nagdaragdag ng tiyak na tinutukoy na wala sa Hebreo.
theological_decisions:
- issue: Pagkakakilanlan ng di-binanggit na simuno ng “tinatakpan niya” at ng tinutukoy sa retorikal na tanong
  choice: Hindi tahasang kinilala ang simuno; nananatiling bukas kung sino ang tinutukoy ng “niya.”
  alternative: Tahasang tukuyin ang Diyos, ang masamang pinuno, o gawing balintiyak ang pangungusap.
  rationale: Bagaman maaaring ipahiwatig ng konteksto na ang Diyos ang sukdulang tinutukoy ni Job, hindi tahasang binabanggit ng Hebreo ang simuno ng יְכַסֶּה. Pinananatili ng salin ang teolohikal na tensiyon sa halip na lutasin ito.
translation_notes:
  register: Makabagong Filipino na marangal ngunit madaling maunawaan. Pinanatili ang matitingkad na larawang “kamay” at “mga mukha,” gayundin ang maikli at mariing hulíng tanong ng tulang Hebreo.
