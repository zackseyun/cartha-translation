base_translation:
  language: en
  yaml_path: translation/ot/job/009/034.yaml
  text: Let him remove his rod from upon me[a], and let not his terror frighten me.
translation:
  language: tl
  text: Alisin sana niya sa ibabaw ko ang kanyang pamalo[a], at huwag sana akong sindakin ng kanyang sindak.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Ilayo sana niya sa akin ang kanyang pamalo, at huwag sana akong takutin ng kanyang sindak.”
    reason: Ipinakikita ang mas payak na salin ng יָסֵר מֵעָלַי at ang alternatibong pandiwa para sa תְּבַעֲתַנִּי, habang pinananatili ang אֵמָתוֹ bilang “kanyang sindak.”
lexical_decisions:
- source_word: יָסֵר
  choice: Alisin sana niya
  rationale: Ang Hiphil na anyong jussive ay nagpapahayag ng hiling ni Job; likas sa modernong Tagalog ang “sana” upang mapanatili ang puwersang bolitibo.
- source_word: מֵעָלַי
  choice: sa ibabaw ko
  rationale: Pinananatili nito ang literal na larawan ng pamalong nakapatong o mabigat na nakadagan kay Job, sa halip na gawing payak lamang na “mula sa akin.”
- source_word: שִׁבְטוֹ
  choice: ang kanyang pamalo
  rationale: Sa konteksto ng pagdurusa, ang שֵׁבֶט ay pinakamalinaw bilang kasangkapang pamalo o paghampas, hindi bilang setro ng paghahari.
- source_word: וְאֵמָתוֹ
  choice: ang kanyang matinding presensya
  rationale: Ang אֵימָה ay takot o sindak na dulot niya. Iniiwasan ng pariralang ito ang alanganing “kanyang sindak” habang ipinahahayag ang nakapanghihilakbot na epekto ng kanyang pagharap o kapangyarihan; nililinaw sa talababa ang mas literal na anyo.
- source_word: אַל
  choice: huwag sana
  rationale: Ipinahahayag ng אַל kasama ng kasunod na pandiwa ang negatibong hiling; natural at marangal sa Tagalog ang “huwag sana.”
- source_word: תְּבַעֲתַנִּי
  choice: akong sindakin
  rationale: Tumpak na naihahatid ng “sindakin” ang matinding pagkatakot na ipinahihiwatig ng בעת at ang tuwirang layong unang panauhan.
theological_decisions:
- issue: Tinutukoy ng mga panghalip na ikatlong panauhan
  choice: Hindi tuwirang tinutukoy si Diyos bilang “niya/kanyang.”
  alternative: 'Tuwirang kausapin ang Diyos bilang “mo/iyong”: “Alisin mo ang iyong pamalo sa ibabaw ko…”'
  rationale: Ikatlong panauhang isahan ang pandiwa at mga hulapi sa Hebreo. Pinananatili ito upang hindi pakinisin ang paglipat-lipat ng paraan ng pagsasalita ni Job tungkol sa Diyos.
- issue: Kahulugan ng אֵימָה bilang takot na inuugnay sa Diyos
  choice: “kanyang matinding presensya,” na tumutukoy sa nakasisindak na epekto ng Diyos kay Job
  alternative: “kanyang sindak” o “takot sa kanya”
  rationale: Pinananatili ang teolohikal na tensiyon na ang mismong pagharap o kapangyarihan ng Diyos ay nakapangingilabot kay Job, nang hindi ipinapalagay na ang takot ay hiwalay na bagay o na likas na nakatatakot ang moral na katangian ng Diyos.
translation_notes:
  register: Makabagong Filipino na may marangal at bahagyang patulang himig. Ginamit ang “sana” upang malinaw na maipahayag ang hiling, at pinanatili ang ikatlong panauhan ng Hebreo.
