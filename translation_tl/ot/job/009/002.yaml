id: JOB.9.2
reference: Job 9:2
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: אָ֭מְנָם יָדַ֣עְתִּי כִי כֵ֑ן וּ/מַה יִּצְדַּ֖ק אֱנ֣וֹשׁ עִם אֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/009/002.yaml
  text: Truly[a], I know that it is so[b]; but how can a man be righteous before God?
translation:
  language: tl
  text: Tunay, alam kong gayon nga; ngunit paano magiging matuwid[a] ang isang tao[b] sa harap ng Diyos?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mapatutunayang nasa tama.” Maaaring tumukoy ang pandiwang Hebreo sa pagiging matuwid o sa pagiging nasa tama sa isang usapin.
    reason: lexical_alternative
  - marker: b
    text: Ang salitang Hebreo ay ’enosh, na tumutukoy sa tao bilang mahina at mortal; maaari ring isaling “isang mortal.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אָמְנָם
  choice: Tunay
  rationale: Ipinahahayag nito ang mariing pagsang-ayon ni Job sa naunang sinabi; likas at marangal sa makabagong Filipino ang “Tunay.”
- source_word: יָדַעְתִּי
  choice: alam ko
  rationale: Bagaman anyong ganap ang pandiwa sa Hebreo, kalagayang tiyak at patuloy ang ipinahahayag nito, kaya ang kasalukuyang “alam ko” ang natural na katumbas.
- source_word: כִי כֵן
  choice: kong gayon nga
  rationale: Pinagtitibay nito na totoo ang naunang pahayag. Ang “gayon nga” ay likas na Filipino at pinananatili ang mariing pagpapatunay.
- source_word: וּמַה
  choice: ngunit paano
  rationale: Ang waw at pananong ay nagpapahiwatig dito ng paglipat mula sa pagsang-ayon tungo sa isang salungat at masusing tanong, hindi lamang payak na pag-uugnay.
- source_word: יִצְדַּק
  choice: magiging matuwid
  rationale: Ang Qal ng צדק ay maaaring mangahulugang maging matuwid o nasa tama. Pinananatili ng “magiging matuwid” ang malawak na diwa nang hindi agad nililimitahan sa isang tiyak na doktrinang legal.
- source_word: אֱנוֹשׁ
  choice: isang tao
  rationale: Tumutukoy ang אֱנוֹשׁ sa tao bilang mahina at mortal. Natural sa pangunahing teksto ang “isang tao,” habang nililinaw sa talababa ang natatanging himig ng salitang Hebreo.
- source_word: עִם אֵל
  choice: sa harap ng Diyos
  rationale: Literal itong “kasama ng Diyos,” ngunit sa konteksto ng pagiging matuwid o nasa tama, natural na ipinahahayag ng “sa harap ng Diyos” ang pagtayo ng tao kaugnay ng paghatol ng Diyos.
theological_decisions:
- issue: Ang legal o moral na himig ng pagiging matuwid ng tao kaugnay ng Diyos
  choice: paano magiging matuwid … sa harap ng Diyos?
  alternative: paano mapatutunayang nasa tama … sa harap ng Diyos?
  rationale: Maaaring magkaroon ng legal na himig ang pandiwang Hebreo, ngunit hindi tinutukoy ng talata ang isang mas huling doktrinal na paraan ng pagpapawalang-sala. Pinananatili ng “magiging matuwid” ang tanong at tensiyong teolohikal nang hindi ito ipinapasiya para sa mambabasa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang payak na ayos ng pangungusap upang mapanatili ang mariing pagsang-ayon at kasunod na retorikal na tanong ni Job. Ang “Diyos” ay ginamit para sa אֵל nang walang idinagdag na denominasyonal na pagpapakahulugan.
