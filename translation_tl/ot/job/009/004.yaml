  text: He is wise in heart and mighty in strength[a]; who has hardened himself against him and prospered?
translation:
  language: tl
  text: Siya ay matalino at makapangyarihan; sino ang nagmatigas laban sa kanya at nakaligtas nang walang pinsala?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “umunlad.” Ang pandiwang Hebreo ay maaari ring mangahulugang makalabas na buo o payapa.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲכַם לֵבָב
  choice: marunong sa puso
  rationale: Pinananatili nito ang larawang Hebreo ng puso bilang sentro ng pag-iisip at pagpapasya, sa halip na gawing simpleng “marunong” lamang.
- source_word: וְאַמִּיץ כֹּחַ
  choice: at makapangyarihan sa lakas
  rationale: Ipinapahayag nito ang mariing tambalan ng lakas at kapangyarihan sa Hebreo habang nananatiling marangal at patula sa Filipino.
- source_word: מִי
  choice: sino
  rationale: Natural na nagpapakilala ito ng retorikal na tanong.
- source_word: הִקְשָׁה
  choice: nagmatigas
  rationale: Ipinahihiwatig ng Hiphil ng קשׁה sa kontekstong ito ang sadyang pagpapatigas o matigas na paglaban; natural na naihahatid ito ng “nagmatigas.”
- source_word: אֵלָיו
  choice: laban sa kanya
  rationale: Sa idyomang ito, ipinakikita ng pang-ukol ang pagsalungat, hindi lamang direksiyon.
- source_word: וַיִּשְׁלָם
  choice: at nanatiling ligtas
  rationale: Ang pandiwang mula sa שלם ay maaaring tumukoy sa paglabas na buo, hindi napinsala, o nasa mabuting kalagayan. Ang “nanatiling ligtas” ay malinaw at angkop sa retorikal na tanong.
theological_decisions:
- issue: Di-hayag na simuno sa pasimula ng talata
  choice: “Siya” ang ginamit at tumutukoy sa Diyos ayon sa konteksto.
  alternative: Ulitin ang “Diyos” bilang tahasang simuno.
  rationale: Walang tahasang simuno sa unang mga panaguri sa Hebreo, ngunit malinaw na Diyos ang tinutukoy sa nakapaligid na pahayag ni Job. Hindi inuulit ang “Diyos” upang hindi magdagdag nang higit sa kailangan.
- issue: Bunga ng pagmamatigas laban sa Diyos
  choice: nanatiling ligtas
  alternative: umunlad; nakaligtas nang walang pinsala; nagkaroon ng kapayapaan
  rationale: Pinananatili ng salin at talababa ang lawak ng שלם nang hindi ito nililimitahan sa materyal na pag-unlad o sa isang tiyak na doktrinal na pagbasa.
translation_notes:
  register: Makabago ngunit marangal na Filipino, na may bahagyang patulang ayos. Pinanatili ang larawang “sa puso” at ang mariing pahayag tungkol sa lakas, habang ginawang natural ang retorikal na tanong.
