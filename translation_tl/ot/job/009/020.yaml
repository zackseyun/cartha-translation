  text: If I am in the right[a], my own mouth would condemn me; though I am blameless, it would prove me crooked.
translation:
  language: tl
  text: 'Kung nasa tama ako, hahatulan ako ng sarili kong bibig;

    kahit wala akong kapintasan, ipakikita nitong baluktot ako.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “Kahit wala akong kapintasan, ipakikita niyang baluktot ako,” kung ang Diyos ang ipinahihiwatig na simuno sa ikalawang sugnay.'
    reason: alternative_reading
lexical_decisions:
- source_word: אִם אֶצְדָּק
  choice: Kung ako man ay nasa tama
  rationale: 'Ang אִם ay maaaring magpahiwatig ng kondisyon o pagpapalagay; ang “kung ... man” ay natural sa Filipino at naipahihiwatig ang mapagbigay na pagpapalagay ni Job. Ang Qal na אֶצְדָּק ay forensic: “nasa tama,” hindi causative na “ipawalang-sala ko ang sarili ko.”'
- source_word: פִּי
  choice: sarili kong bibig
  rationale: Literal na “aking bibig.” Idinagdag ang “sarili” upang maipakita ang kabalintunaang ang mismong pananalita ni Job ang magiging laban sa kaniya.
- source_word: יַרְשִׁיעֵנִי
  choice: hahatulan ako
  rationale: Ang Hiphil ng רשע sa kontekstong forensic ay nangangahulugang magpahayag na may-sala o humatol. Ang “hahatulan ako” ay malinaw at likas sa modernong Filipino.
- source_word: תָּם אָנִי
  choice: kung ako man ay walang kapintasan
  rationale: Sa Job, ang תָּם ay tumutukoy sa integridad o kawalang-mapipintas, hindi kinakailangang ganap na kawalang-kasalanan. Pinananatili ng “walang kapintasan” ang saklaw na ito.
- source_word: וַיַּעְקְשֵׁנִי
  choice: ipakikita nitong baluktot ako
  rationale: Mula sa עקשׁ, “maging baluktot/liko.” Ang “ipakikita ... na baluktot” ay naghahatid ng resultative o forensic na diwa nang hindi ipinahihiwatig na literal na ginawa siyang masama. Ang “nito” ay tumutukoy sa “sarili kong bibig,” ayon sa malamang na pagpapatuloy ng simuno.
theological_decisions:
- issue: Simuno ng וַיַּעְקְשֵׁנִי
  choice: 'Ang “sarili kong bibig” ang ipinagpapatuloy na simuno: “ipakikita nitong baluktot ako.”'
  alternative: 'Maaaring ang Diyos ang di-binanggit na simuno: “ipakikita niya na baluktot ako” o “gagawin niya akong baluktot.”'
  rationale: 'Pinapaboran ng paralelismo ang iisang simuno sa dalawang sugnay: ang bibig ni Job ang hahatol at magpapakitang baluktot siya. Gayunman, hindi tahasang nakasaad ang simuno sa ikalawang sugnay, kaya pinananatili sa talababa ang tunay na alternatibo at ang teolohikal na tensiyon.'
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “nasa tama” para sa forensic na diwa at ang “baluktot” upang mapanatili ang matalinghagang salungatan sa “walang kapintasan.”
