  yaml_path: translation/ot/job/009/033.yaml
  text: There is no arbiter between us[a], who might lay his hand on us both.
translation:
  language: tl
  text: Walang tagahatol sa pagitan namin[a] na maaaring magpatong ng kaniyang kamay sa aming dalawa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “tagapamagitan.” Ang salitang Hebreo ay maaaring tumukoy sa isang taong humahatol o namamagitan sa dalawang panig na may pagtatalo.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא יֵשׁ
  choice: Walang
  rationale: Likas at tuwirang ipinapahayag ng salitang ito sa Tagalog ang kawalan ng isang taong gaganap sa tungkuling tinutukoy.
- source_word: בֵּינֵינוּ
  choice: sa amin
  rationale: Kasunod ng “tagapamagitan,” natural sa modernong Tagalog ang “sa amin” upang tukuyin ang dalawang panig; ang diwang “between us” ay taglay na ng mismong salitang “tagapamagitan.”
- source_word: מוֹכִיחַ
  choice: tagapamagitan
  rationale: Sa kontekstong legal ng pagtatalo, tumutukoy ito sa ikatlong taong namamagitan at maaaring humatol o magpasya. Mas madaling maunawaan ng karaniwang mambabasa ang “tagapamagitan” kaysa sa teknikal na “tagahatol,” habang ipinapaliwanag sa talababa ang saklaw nito.
- source_word: יָשֵׁת
  choice: maaaring magpatong
  rationale: Pinananatili nito ang potensiyal o hinahangad na kilos ng anyong Hebreo, hindi isang aktuwal nang nagaganap na pagkilos.
- source_word: יָדוֹ
  choice: kanyang kamay
  rationale: Pinananatili ang kongkretong larawan ng kamay sa halip na palitan ito ng interpretasyong “awtoridad” o “kapangyarihan.”
- source_word: עַל שְׁנֵינוּ
  choice: sa aming dalawa
  rationale: Malinaw nitong ipinakikitang kapuwa saklaw ng kilos ang dalawang panig sa pagtatalo.
theological_decisions:
- issue: Kung gagamit ng katawagang maaaring basahin bilang tiyak na pahiwatig kay Cristo para sa מוֹכִיחַ
  choice: tagapamagitan, na nililinaw sa talababa bilang maaari ring tagahatol sa isang pagtatalo
  alternative: tagahatol; tagapamagitan lamang sa mas makitid na teolohikal na diwa
  rationale: Ang agarang konteksto ay ang hangarin ni Job para sa isang ikatlong panig sa usapin nila ng Diyos. Hindi dapat ipasok sa talata ang isang ganap na kristolohikal na pagpapakahulugan, ngunit hindi rin dapat alisin ang tunay na saklaw ng salitang Hebreo.
translation_notes:
  register: Modernong Filipino Tagalog na simple ngunit marangal. Ginamit ang “tagapamagitan” dahil natural at madaling maunawaan, habang pinanatili sa talababa ang legal na diwang “tagahatol.” Ang “magpatong ng kanyang kamay” ay sadyang literal upang mapanatili ang larawan at hindi agad ipakahulugan ang sagisag nito.
