  text: na nagsasabi sa araw[b], “Huwag kang sumikat,”[a] at tinatatakan ang mga bituin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas literal, “at hindi ito sumisikat.” Maaaring ipahayag ng Hebreo ang utos na sinabi sa araw o ang naging bunga ng salita ng Diyos.
    reason: lexical_alternative
  - marker: b
