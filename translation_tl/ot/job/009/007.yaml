    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֹמֵר
  choice: na nagsasabi
  rationale: Ang participle ay nagpapatuloy sa paglalarawan sa Diyos mula sa naunang konteksto. Likas sa Tagalog ang pang-ugnay na “na” sa ganitong tuloy-tuloy na pangungusap.
- source_word: לַחֶרֶס
  choice: sa araw
  rationale: Sa kontekstong patula, kasama ng “sumikat” at “mga bituin,” ang חֶרֶס ay tumutukoy sa araw, hindi sa luwad o palayok.
- source_word: וְלֹא יִזְרָח
  choice: “Huwag kang sumikat,”
  rationale: Malamang na inihahayag ng imperfect ang nilalaman ng utos sa araw. Pinananatili ng “kang” ang matingkad na pagsasatao sa araw, habang itinatala sa talababa ang posibleng pagbasa bilang resulta.
- source_word: וּבְעַד
  choice: at
  rationale: Kasama ng יַחְתֹּם, nakikibahagi ang pang-ukol sa larawang pagsasara o pagtatak. Hindi kailangang tumbasan nang hiwalay sa Tagalog upang maging malinaw at natural ang parirala.
- source_word: כּוֹכָבִים
  choice: mga bituin
  rationale: Tuwirang katumbas ng pangmaramihang pangngalan; hindi kailangan ang tiyak na pananda sa Tagalog.
- source_word: יַחְתֹּם
  choice: nagtatak
  rationale: Pinananatili nito ang pangunahing larawan ng חתם na paglalagay ng tatak upang isara o hadlangan ang paglitaw ng mga bituin.
theological_decisions:
- issue: Kung utos ba o resulta ang וְלֹא יִזְרָח
  choice: 'Iniharap sa pangunahing teksto bilang utos: “Huwag kang sumikat.”'
  alternative: “at hindi ito sumisikat”
  rationale: Maaaring ipahayag ng Hebreo ang sinabi sa araw o ang naging bunga ng salita ng Diyos. Mas matingkad ang pagbasa bilang utos, ngunit hindi dapat alisin ang tunay na gramatikal na kalabuan, kaya inilagay ang alternatibo sa talababa.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog. Ginamit ang “sumikat” bilang karaniwang pandiwa para sa pagsikat ng araw at “nagtatak” upang mapanatili ang kongkretong larawang patula ng Hebreo.
