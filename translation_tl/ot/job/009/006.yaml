translation:
  language: tl
  text: 'Siya na nagpapayanig sa lupa mula sa kinalalagyan nito,

    at nanginginig ang mga haligi nito.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nangingatog” o “nanginginig nang marahas.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּרְגִּיז
  choice: niya na yumanig
  rationale: Ang Hiphil participle ng רגז ay may sanhiang diwa. Ang “niya na yumanig” ay natural na kaugnay ng naunang paglalarawan sa Diyos at pinananatili ang puwersa ng kilos.
- source_word: אֶרֶץ
  choice: sa lupa
  rationale: Sa kosmikong konteksto, tumutukoy ito sa buong lupa, hindi lamang sa isang lupain.
- source_word: מִמְּקוֹמָהּ
  choice: mula sa kinalalagyan nito
  rationale: Tuwirang pinananatili ang larawan ng lupa na naaalis o nayayanig mula sa sarili nitong lugar.
- source_word: וְעַמּוּדֶיהָ
  choice: at ang mga haligi nito
  rationale: Pinananatili ng “mga haligi” ang kongkretong makatang larawang kosmolohiko ng עמוד, sa halip na bigyang-kahulugang “mga pundasyon.”
- source_word: יִתְפַלָּצוּן
  choice: nanginginig
  rationale: Ipinahahayag nito ang marahas na panginginig nang hindi ginagawang emosyonal o sikolohikal ang larawan.
theological_decisions:
- issue: Kosmolohikong larawan ng mga haligi ng lupa
  choice: Panatilihin nang literal ang makatang larawan bilang “mga haligi nito.”
  alternative: Isalin bilang “mga pundasyon nito” upang iangkop sa makabagong pagkaunawa.
  rationale: Ang talata ay gumagamit ng sinaunang makatang larawang kosmolohiko. Dapat panatilihin ang larawan ng Hebreo sa halip na gawing makabago o alisin ang tensiyon nito.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “kinalalagyan” para sa natural ngunit tumpak na paglalarawan, at pinanatili ang “mga haligi” bilang makatang imahen. Ang panimulang “niya na” ay umaasa sa sintaktikong pagpapatuloy mula sa naunang talata, gaya ng participial clause sa Hebreo.
