  text: Look[a], if he snatches away, who can turn him back? Who can say to him[b], ‘What are you doing?’
translation:
  language: tl
  text: Narito, kung siya’y humablot[a], sino ang makapagpapabalik sa kanya?[b] Sino ang makapagsasabi sa kanya, “Ano ang ginagawa mo?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “dumakma” o “tumangay.” Ipinahihiwatig ng pandiwang Hebreo ang biglaan at puwersahang pagkuha.
    reason: lexical_alternative
  - marker: b
    text: 'Sa literal, “sino ang magpapabalik sa kanya?” Maaari ring isalin: “sino ang makapagpapa-atras sa kanya?”'
