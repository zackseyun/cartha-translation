lexical_decisions:
- source_word: הֵן
  choice: Narito
  rationale: Ginagamit bilang mariing panawag-pansin. Pinananatili ng “Narito” ang bigat ng pahayag nang hindi ito ginagawang paliwanag lamang.
- source_word: יַחְתֹּף
  choice: mang-agaw
  rationale: Ang חטף ay tumutukoy sa biglaan at puwersahang pagkuha. Likas sa Filipino ang “mang-agaw” at naipahihiwatig nito kapwa ang puwersa at pag-aalis.
- source_word: יְשִׁיבֶנּוּ
  choice: makapagpapabalik sa kanya
  rationale: Ang Hiphil ng שוב ay nangangahulugang magpangyaring bumalik o magpabalik. Pinananatili ng salin ang personal na hulaping panlalaki at ang larawan ng pagtatangkang baligtarin o pahintuin ang kilos ng Diyos.
- source_word: מִי
  choice: sino ang makapag-
  rationale: Retorikal ang tanong at nagpapahiwatig ng kawalan ng kakayahan. Likas na naihahayag ito sa Filipino sa pamamagitan ng “sino ang makapag-”.
- source_word: יֹאמַר אֵלָיו
  choice: makapagsasabi sa kanya
  rationale: Tuwirang isinasalin ang pagsasalita sa Diyos nang walang idinagdag na paliwanag gaya ng “bilang pagtutol.”
- source_word: מַה תַּעֲשֶׂה
  choice: Ano ang ginagawa mo?
  rationale: Sa konteksto ng isang tuwirang pagtutol o paghamon, natural na ipinapahayag ng kasalukuyang aspekto sa Filipino ang diwa ng Hebreong imperfect.
theological_decisions:
- issue: Tinutukoy ng mga panghalip na panlalaking isahan
  choice: 'Isinalin ang mga panghalip bilang personal na tumutukoy sa Diyos: “siya … sa kanya.”'
  alternative: 'Maaaring unawain ang hulapi sa יְשִׁיבֶנּוּ bilang tumutukoy sa bagay na inagaw: “sino ang makapagbabalik niyon?”'
  rationale: Sa konteksto, inilalarawan ni Job ang di-mapipigil na pagkilos ng Diyos. Ang kasunod na “makapagsasabi sa kanya” ay malinaw ding tumutukoy sa Diyos, kaya mas maayos ang daloy kung ang naunang panghalip ay personal din, habang kinikilala na maaaring pagtalunan ang reperente nito.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “Narito” bilang mariing panawag-pansin, samantalang pinanatiling tuwiran at madaling maunawaan ang dalawang retorikal na tanong.
