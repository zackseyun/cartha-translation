  yaml_path: translation/ot/job/009/011.yaml
  text: Look[a], he passes by me, and I do not see him; he moves on[c][b], and I do not perceive him.
translation:
  language: tl
  text: Narito[a], dumaraan siya sa tabi ko, at hindi ko siya nakikita; lumalampas siya, at hindi ko siya natatalos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Tingnan” o “Tunay ngang.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “hindi ko siya nauunawaan”; ang salitang Hebreo ay maaaring tumukoy sa pagtalos o pag-unawa.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Narito
  rationale: Nagpapakilala ito ng mariing pagmamasid. Ang “Narito” ay marangal at malinaw sa modernong Filipino, at pinananatili ang biglaang pagtawag-pansin ng Hebreo.
- source_word: יַעֲבֹר עָלַי
  choice: dumaraan siya sa tabi ko
  rationale: Ang עבר na kasama ang על ay naglalarawan dito ng pagdaan kaugnay ng nagsasalita. Ipinahahayag ng “sa tabi ko” ang malapit na pagdaan nang hindi ipinahihiwatig na tinatapakan o literal na dumaraan sa ibabaw niya.
- source_word: וְלֹא אֶרְאֶה
  choice: ngunit hindi ko siya nakikita
  rationale: Tuwirang isinasalin ang negatibong anyo ng ראה. Hindi idinagdag ang diwa ng kawalan ng kakayahan na maaaring ipahiwatig ng “hindi ko kayang makita.”
- source_word: וְיַחֲלֹף
  choice: nagpapatuloy siya
  rationale: Ang חלף ay maaaring tumukoy sa pagdaan o pagpapatuloy. Bahagyang iniiba ng “nagpapatuloy” ang ikalawang pandiwa habang pinananatili ang parallel na kilos.
- source_word: וְלֹא אָבִין לוֹ
  choice: ngunit hindi ko siya namamalayan
  rationale: Ang בין ay maaaring mangahulugang umunawa o makilala sa pamamagitan ng pagdama. Sa konteksto ng di-nakikitang pagdaan, natural na ipinahahayag ng “namamalayan” ang kawalan ng pagkilala o pagdama, habang inilalagay sa talababa ang posibleng diwang “nauunawaan.”
theological_decisions:
- issue: Tinutukoy ng ikatlong panauhang paksa at mga panghalip
  choice: Tumutukoy ang “siya” sa Diyos nang hindi idinaragdag ang pangalang “Diyos” sa talata.
  alternative: Maaaring unawain bilang di-tiyak na “may isang dumaraan.”
  rationale: Sa agarang konteksto ng Job 9:10–12, ang inilalarawan ni Job ay ang di-maarok na pagkilos ng Diyos. Pinananatili ng panghalip ang personal na pagtukoy nang hindi nagdaragdag ng titulong wala sa mismong talata.
translation_notes:
  register: Makabago, dignified, at madaling maunawaang Filipino. Ginamit ang “Narito” bilang mariing panawag-pansin, at “namamalayan” upang natural na ilarawan ang di-pagkilala sa presensiya o pagkilos ng Diyos nang hindi isinasara ang posibilidad ng diwang “nauunawaan.”
