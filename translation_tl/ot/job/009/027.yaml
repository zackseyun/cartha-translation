translation_notes:
  register: Makabagong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “daing” upang tumugma sa konteksto ng panaghoy, at isinalin nang idyomatiko ang paglalarawan sa mukha nang hindi inaalis ang orihinal na larawang-diwa.
