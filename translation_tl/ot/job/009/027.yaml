base_translation:
  language: en
  yaml_path: translation/ot/job/009/027.yaml
  text: If I say[a], ‘I will forget my complaint[b]; I will put aside my sad face and be cheerful,’
translation:
  language: tl
  text: Kung sasabihin ko, “Kakalimutan ko ang aking daing[a]; aalisin ko ang lungkot sa aking mukha at sisigla ako,”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “pagninilay” o “sariling saloobin.” Ang salitang Hebreo ay maaaring tumukoy sa panloob na pagsasalita, pagninilay, o hinaing; sa kontekstong ito ng panaghoy, ang “daing” ang higit na angkop.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “iiwan ko ang aking mukha at sisigla.” Isa itong idyoma para sa pag-aalis ng malungkot na anyo at pagsisikap na magmukhang masigla.
    reason: cultural_note
lexical_decisions:
- source_word: אִם אָמְרִי
  choice: Kung sasabihin ko
  rationale: Ipinahahayag nito ang isang ipinalalagay na pasiya ni Job. Likas sa modernong Tagalog ang kondisyunal na anyong “kung sasabihin ko.”
- source_word: אֶשְׁכְּחָה
  choice: Kakalimutan ko
  rationale: Pinananatili ang tuwirang pagpapahayag ng balak o pasiya sa unang panauhan.
- source_word: שִׂיחִי
  choice: ang aking daing
  rationale: Maaaring tumukoy ang salita sa pagninilay, panloob na pagsasalita, o reklamo; sa konteksto ng panaghoy ni Job, natural at angkop ang “daing.”
- source_word: אֶעֶזְבָה פָנַי
  choice: aalisin ko ang lungkot sa aking mukha
  rationale: Literal na may diwang “iiwan ko ang aking mukha,” ngunit idyomatiko itong tumutukoy sa pag-aalis ng malungkot na anyo. Iniiwasan ng salin ang di-natural na literalismo habang pinananatili ang larawan ng mukha.
- source_word: וְאַבְלִיגָה
  choice: at sisigla ako
  rationale: Ang bihirang pandiwa ay nagpapahiwatig ng pagluwag ng dalamhati o pagliwanag ng anyo. Ang “sisigla” ay natural at hindi labis na nagpapahiwatig ng tunay at ganap na kagalakan.
