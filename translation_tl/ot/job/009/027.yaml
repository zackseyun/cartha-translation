  source_fidelity: 'Tapat ang salin sa kondisyunal na pahayag ni Job at sa kanyang ipinapalagay na pasiya: kalimutan ang kanyang daing, isantabi ang malungkot na anyo, at magpakasigla. Ang “aalisin ko ang lungkot sa aking mukha” ay isang malinaw at katanggap-tanggap na idyomatikong paglalahad ng Hebreong “iiwan ko ang aking mukha.”'
