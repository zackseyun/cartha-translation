  yaml_path: translation/ot/job/009/005.yaml
  text: He removes mountains[a], and they do not know it[c][b], when he overturns them in his anger.
translation:
  language: tl
  text: Siya ang nag-aalis ng mga bundok[a], at hindi nila namamalayan[b] kapag ibinabaligtad niya ang mga ito sa kanyang galit.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nagpapalipat ng mga bundok.” Ang pandiwang Hebreo ay maaaring tumukoy sa pagpapakilos ng isang bagay mula sa kinalalagyan nito.
    reason: lexical_alternative
  - marker: b
    text: Sa patulang paglalarawan, tinatrato ang mga bundok na wari’y may kakayahang makaalam, ngunit hindi nila namamalayan ang pagbabaligtad sa kanila ng Diyos.
    reason: cultural_note
  - marker: c
    text: O “sa kanyang poot.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּעְתִּיק
  choice: nag-aalis
  rationale: Ang Hiphil participle ng עתק ay nagpapahayag ng pagpapakilos o pag-aalis ng isang bagay mula sa kinalalagyan nito. Likas sa modernong Tagalog ang “nag-aalis” at angkop ito sa paglalarawan ng kapangyarihang nagpapaguho o nagpapalipat sa mga bundok.
- source_word: הָרִים
  choice: mga bundok
  rationale: Karaniwang katumbas ito ng pangmaramihang הָרִים.
- source_word: וְלֹא יָדָעוּ
  choice: at hindi nila namamalayan
  rationale: Pinananatili nito ang pangmaramihang paksa at ang patulang pagsasatao sa mga bundok, habang natural ang pagkakasabi sa Tagalog.
- source_word: אֲשֶׁר
  choice: kapag
  rationale: Sa konteksto, ipinapakilala nito ang pangyayaring hindi namamalayan ng mga bundok—ang pagbabaligtad sa kanila. Ang “kapag” ay malinaw na naghahatid ng temporal o sirkumstansiyal na diwa.
- source_word: הֲפָכָם
  choice: ibinabaligtad niya ang mga ito
  rationale: Ang הפך ay nangangahulugang bumaligtad o magbaligtad. Tahasang kinakatawan ng “ang mga ito” ang panghalip na hulaping tumutukoy sa mga bundok.
- source_word: בְּאַפּוֹ
  choice: sa kanyang galit
  rationale: Ang אַף ay literal na “ilong” ngunit idyomatikong tumutukoy sa galit. Malinaw at dignified sa modernong Tagalog ang “sa kanyang galit,” habang nananatiling posible ang mas matinding “poot.”
