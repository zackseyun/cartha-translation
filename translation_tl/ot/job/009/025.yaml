base_translation:
  language: en
  yaml_path: translation/ot/job/009/025.yaml
  text: My days are swifter than a runner[a]; they flee away; they do not see good.
translation:
  language: tl
  text: Ang mga araw ko ay mas mabilis kaysa sa isang mananakbo; tumatakas ang mga ito at hindi nakararanas ng kabutihan[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kasaganaan” o “kaginhawahan” sa halip na “kabutihan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יָמַי
  choice: ang mga araw ko
  rationale: Pinananatili ang payak na idyomang Hebreo para sa mga araw ng buhay ni Job.
- source_word: קַלוּ
  choice: mas mabilis
  rationale: Sa paghahambing sa isang mananakbo, ang diwang 'magaan/mabilis' ay likas na tumutukoy sa bilis.
- source_word: מִנִּי רָץ
  choice: kaysa isang mananakbo
  rationale: Ang pang-ukol ay naghahayag ng paghahambing, at ang רָץ ay likas na tumutukoy sa isang taong tumatakbo.
- source_word: בָּרְחוּ
  choice: tumatakas ang mga ito
  rationale: Pinananatili ang matingkad na larawan ng mga araw na mabilis na lumalayo na parang tumatakas.
- source_word: לֹא רָאוּ
  choice: hindi nakararanas
  rationale: Ang literal na 'hindi nakakakita' ay isang idyoma para sa hindi pagdanas; ang salin ay natural sa Filipino habang pinananatili ang diwa.
- source_word: טוֹבָה
  choice: kabutihan
  rationale: Malawak ang saklaw ng salita at maaaring tumukoy sa mabuti, kasaganaan, o kaginhawahan; hindi ito nilimitahan sa isang partikular na uri ng pagpapala.
theological_decisions: []
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Hindi nagdagdag ng panandang katumbas ng 'ngayon' dahil walang tahasang salitang gayon sa Hebreo. Inilipat ang talababa sa 'kabutihan,' ang salitang aktuwal na may leksikal na mga alternatibo.
