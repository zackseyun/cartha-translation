id: JOB.9.22
reference: Job 9:22
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: אַחַ֗ת הִ֥יא עַל כֵּ֥ן אָמַ֑רְתִּי תָּ֥ם וְ֝/רָשָׁ֗ע ה֣וּא מְכַלֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/009/022.yaml
  text: It is all one[a]; therefore I say[b], ‘He destroys both the blameless and the wicked.’
translation:
  language: tl
  text: Pareho lang ang lahat; kaya sinasabi ko[a], “Nililipol niya kapuwa ang taong walang kapintasan at ang taong masama.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sinabi ko.” Maaaring ipahayag ng Hebrew perfect dito ang kasalukuyan o ang nakaraang pahayag, depende sa konteksto.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “Nililipol nito kapuwa ang taong walang kapintasan at ang taong masama,” kung uunawain ang paksa nang mas impersonal.
    reason: alternative_reading
lexical_decisions:
- source_word: אַחַת הִיא
  choice: Pareho lang ang lahat
  rationale: Idyoma itong nagsasaad na walang praktikal na pagkakaiba sa kinahihinatnan, hindi lamang ng bilang na ‘isa.’ Natural sa makabagong Tagalog ang ‘pareho lang’ at pinananatili nito ang mapait na pahayag ni Job.
- source_word: עַל כֵּן
  choice: kaya
  rationale: Malinaw at likas na ipinapakita ng ‘kaya’ ang lohikal na kongklusyon mula sa naunang pahayag.
- source_word: אָמַרְתִּי
  choice: sinasabi ko
  rationale: Bagaman nasa perfect ang pandiwang Hebreo, maaari itong magpakilala rito ng kasalukuyang ipinahahayag na kongklusyon ni Job. Nasa talababa ang posibleng nakaraang pagbasa.
- source_word: תָּם
  choice: ang taong walang kapintasan
  rationale: Tumutukoy ito sa taong may integridad o matuwid na pagkatao, hindi sa isang taong ganap na walang kasalanan.
- source_word: רָשָׁע
  choice: ang taong masama
  rationale: Karaniwang tawag ito sa taong may moral na kasamaan o pagkakasala at malinaw na katapat ng ‘taong walang kapintasan.’
- source_word: הוּא מְכַלֶּה
  choice: Nililipol niya
  rationale: Ang panlalaking panghalip at pandiwaring Hebreo ay pinakanatural na tumutukoy sa Diyos sa konteksto ng Job 9. Ipinahahayag ng ‘nililipol’ ang matinding diwa ng pagwawakas o pagwasak.
theological_decisions:
- issue: Ang di-tahasang tinutukoy ng ‘niya’
  choice: Personal na paksa ang ginamit, na tumutukoy sa Diyos sa pananalita ni Job.
  alternative: 'Maaaring unawain nang mas impersonal: ‘Nililipol nito…’'
  rationale: Nasa konteksto ang kapangyarihan at pamamahala ng Diyos, kaya siya ang pinakanatural na paksa. Hindi pinalalambot ng salin ang matinding reklamo ni Job, ngunit inilalagay sa talababa ang mas impersonal na posibilidad.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang ‘pareho lang’ upang natural na maipahayag ang idyomang Hebreo, at inulit ang ‘ang taong’ upang luminaw ang magkatapat na uri ng tao.
