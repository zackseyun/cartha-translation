translation:
  language: tl
  text: Kung magkagayon, magsasalita ako at hindi ako matatakot sa kanya, sapagkat hindi ganito ang lagay ko.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sapagkat hindi ganito ang aking kalagayan”; mas literal, “sapagkat hindi ako ganito sa aking sarili.” Eliptikal ang huling sugnay sa Hebreo.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַדַבְּרָה
  choice: Kung magkagayon, magsasalita ako
  rationale: Ang anyong cohortative/imperfect na unang panauhan ay nagpapahayag ng balak o maaaring gawin ni Job. Ipinakikita ng “Kung magkagayon” ang kaugnayan nito sa hinihiling niya sa naunang talata.
- source_word: וְלֹא אִירָאֶנּוּ
  choice: at hindi matatakot sa kanya
  rationale: Tuwirang isinasalin ang pang-ugnay, pagtanggi, pandiwang ירא, at panlalaking panghalip na hulapi nang natural sa makabagong Tagalog.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala nito ang dahilan o paliwanag para sa naunang pahayag.
- source_word: לֹא כֵן
  choice: hindi ganito
  rationale: Pinananatili nito ang di-tiyak na paghahambing ng parirala nang hindi dinaragdagan ang hindi tahasang sinabi sa Hebreo.
- source_word: אָנֹכִי עִמָּדִי
  choice: ang kalagayan ko sa aking sarili
  rationale: Ang literal na anyo ay humigit-kumulang “ako sa piling/kasama ng aking sarili.” Ang saling ito ay nananatiling sadyang hindi lubos na tiyak ngunit mas nauunawaan sa Tagalog.
theological_decisions:
- issue: 'Malabong huling sugnay: כִּי לֹא כֵן אָנֹכִי עִמָּדִי'
  choice: sapagkat hindi ganito ang kalagayan ko sa aking sarili
  alternative: sapagkat hindi ganito ang kalagayan ko; sapagkat hindi ako ganito sa ganang sarili ko
  rationale: Pahapyaw at eliptikal ang Hebreo. Hindi tinutukoy ng salin kung ang tinutukoy ay panloob na kalagayan ni Job, ang kasalukuyang sitwasyon niya, o ang katayuan niya sa harap ng Diyos; pinananatili ng talababa ang tunay na kalabuan.
translation_notes:
  register: Makabago at marangal na Tagalog. Ginamit ang “Kung magkagayon” upang likas na maipakita ang kondisyunal na ugnayan sa naunang konteksto, habang pinanatiling bahagyang eliptikal ang huling sugnay.
