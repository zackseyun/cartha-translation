  text: I am blameless[a]; I do not know myself; I despise my life.
translation:
  language: tl
  text: Ako'y walang kapintasan; hindi ko kilala ang sarili ko[a]; kinamumuhian ko ang buhay ko.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “hindi ko alam ang aking kaluluwa/sarili.” Mas malawak ang kahulugan ng Hebreong nefesh: sarili, kaluluwa, o buhay.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּם
  choice: walang kapintasan
  rationale: Ipinahahayag nito ang pagiging buo sa integridad o walang maiparatang na kasalanan sa usaping tinatalakay, gaya ng karaniwang gamit sa Job, nang hindi kinakailangang mangahulugang ganap na walang anumang kasalanan.
- source_word: אָנִי
  choice: Ako'y
  rationale: Pinanatili ang tahasang panghalip na unang panauhan upang maipakita ang diin ng Hebreo.
- source_word: לֹא אֵדַע
  choice: hindi ko kilala
  rationale: Pinananatili ang pangunahing diwa ng יָדַע na ‘kilalanin/alamin’ at ang matalim na kalabuan ng pahayag, sa halip na ipakahulugan agad bilang ‘wala akong pakialam.’
- source_word: נַפְשִׁי
  choice: ang sarili ko
  rationale: Sa kontekstong ito, ang נֶפֶשׁ ay tumutukoy sa sarili o sariling buhay. Ang ‘sarili ko’ ang pinakanatural sa modernong Tagalog, habang inilalahad sa talababa ang mas malawak na saklaw ng salita.
- source_word: אֶמְאַס
  choice: kinamumuhian ko
  rationale: Ang מָאַס ay maaaring mangahulugang itakwil, hamakin, o kasuklaman. Ang ‘kinamumuhian’ ay natural sa Tagalog kasama ng ‘buhay ko’ at angkop sa matinding damdamin ni Job.
- source_word: חַיָּי
  choice: ang buhay ko
  rationale: Tuwirang tumutukoy sa sariling buhay o pag-iral ni Job; ito ang malinaw at natural na katumbas sa Tagalog.
theological_decisions:
- issue: Saklaw ng pahayag ni Job na תָּם siya
  choice: walang kapintasan
  alternative: ganap na walang kasalanan
  rationale: Hindi pinalabis ang pahayag upang maging isang doktrina ng ganap na kawalang-kasalanan; pinanatili ang kahulugan ng integridad o kawalang-sala sa konteksto ng pagtatalo.
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran at marangal. Ginamit ang mas natural na ‘sarili ko’ at ‘buhay ko’ kaysa sa mas pormal na ‘aking sarili’ at ‘aking buhay,’ habang pinanatili ang maikli at matalim na ayos ng Hebreo.
