  text: God does not turn back his anger; beneath him the helpers of Rahab crouch.
translation:
  language: tl
  text: 'Hindi iniuurong ng Diyos ang kanyang galit;

    sa ilalim niya ay nakayuko ang mga tagatulong ni Rahab.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “Rahab” dito ay isang patulang pangalan na maaaring tumukoy sa isang sinaunang halimaw ng kaguluhan; sa ibang bahagi ng Kasulatan, ginagamit din itong sagisag ng Ehipto.
    reason: Nililinaw ang hindi pamilyar na pangalang Hebreo habang pinananatili ang higit sa isang posibleng sanggunian nito.
lexical_decisions:
- source_word: לֹא יָשִׁיב אַפּוֹ
  choice: Hindi pinipigil ... ang kanyang galit
  rationale: Ang יָשִׁיב ay literal na ‘ibalik’ ngunit sa pariralang ito ay tumutukoy sa hindi pagpapaurong o pagpigil ng galit. Likas sa modernong Tagalog ang ‘hindi pinipigil’ nang hindi pinapahina ang diwa.
- source_word: תַּחְתָּיו
  choice: sa ilalim niya
  rationale: Pinananatili ang kongkreto at makapangyarihang larawang spatial ng Hebreo.
- source_word: שָׁחֲחוּ
  choice: yumuyukod
  rationale: Ipinahahayag ang pagyuko o pagpapakababa sa pagkatalo at pagpapasakop; hindi dinaragdagan ang teksto ng tiyak na kilos gaya ng pagsamba.
- source_word: עֹזְרֵי רָהַב
  choice: ang mga katulong ni Rahab
  rationale: Pinananatili ang pangalang Rahab at ang sadyang mitiko o patulang pahiwatig nito, sa halip na ipalit ang isang interpretasyong gaya ng ‘mga puwersa ng kaguluhan.’
theological_decisions:
- issue: Ang galit ng Diyos
  choice: Hindi pinipigil ng Diyos ang kanyang galit
  alternative: Hindi iniuurong ng Diyos ang kanyang galit
  rationale: Pinananatili ang matinding pahayag ni Job tungkol sa soberanong galit ng Diyos nang hindi ito nilalagyan ng paliwanag o teolohikal na pagpapalambot.
- issue: Pagkakakilanlan ni Rahab
  choice: Panatilihin bilang pangalang ‘Rahab’ na may talababa
  alternative: Isalin bilang ‘halimaw ng kaguluhan’ o iugnay agad sa Ehipto
  rationale: Maaaring tumukoy ang patulang pangalan sa sinaunang larawan ng isang halimaw ng kaguluhan at ginagamit din sa ibang teksto bilang sagisag ng Ehipto. Ang transliterasyon ay nagpapanatili sa tunay na kalabuan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Pinanatili ang maikli at matinding paralelismo ng tulang Hebreo, pati ang larawang ‘sa ilalim niya.’
