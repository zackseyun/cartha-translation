translation:
  language: tl
  text: Siya ang gumagawa ng mga dakilang bagay na di-masaliksik[a], at ng mga kababalaghang di-mabilang[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “hindi lubos na masaliksik.” Ipinahihiwatig ng idyomang Hebreo na hindi lubos na masusuri o mauunawaan ang kaniyang mga dakilang gawa.
    reason: lexical_alternative
  - marker: b
    text: O “walang bilang.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹשֶׂה
  choice: Siya ang gumagawa
  rationale: Ang Qal participle ay naglalarawan sa Diyos na tinutukoy sa naunang konteksto. Likas sa makabagong Tagalog ang “Siya ang gumagawa” at napananatili nito ang tuloy-tuloy na paglalarawan sa kaniyang pagkilos.
- source_word: גְדֹלוֹת
  choice: mga dakilang bagay
  rationale: Ang pang-uring pambabae na maramihan ay ginagamit bilang pangngalan. Hindi nililimitahan ng “mga dakilang bagay” ang kahulugan sa isang partikular na uri ng gawa.
- source_word: עַד אֵין חֵקֶר
  choice: di-masaliksik
  rationale: Ipinahihiwatig ng idyoma na ang mga dakilang ginagawa ng Diyos ay hindi lubos na masusuri o maarok. Maikli at natural ang “di-masaliksik” habang pinananatili ang larawan ng pagsisiyasat.
- source_word: וְנִפְלָאוֹת
  choice: at ng mga kababalaghan
  rationale: Ang נִפְלָאוֹת ay tumutukoy sa pambihira at kagila-gilalas na mga gawa. Ang “mga kababalaghan” ang karaniwang marangal na katumbas sa Tagalog.
- source_word: עַד אֵין מִסְפָּר
  choice: di-mabilang
  rationale: Ipinahahayag ng parirala na hindi matutukoy ang dami. Natural sa Tagalog ang “di-mabilang” at tumutugma sa paralelismong “di-masaliksik.”
