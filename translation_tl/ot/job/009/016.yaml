  text: אִם קָרָ֥אתִי וַֽ/יַּעֲנֵ֑/נִי לֹֽא אַ֝אֲמִ֗ין כִּֽי יַאֲזִ֥ין קוֹלִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/009/016.yaml
  text: If I called and he answered me[a], I would not believe that he was listening to my voice.
translation:
  language: tl
  text: Kung tumawag ako at sinagot niya ako[a], hindi ako maniniwalang nakikinig siya sa tinig ko.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Kung dumaing ako at sinagot niya ako, hindi ako maniniwalang pinakinggan niya ang tinig ko.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Kung
  rationale: Ipinakikilala nito ang isang kondisyonal o hipotetikal na pangyayari; hindi ito ginawang temporal na “kapag.”
- source_word: קָרָאתִי
  choice: tumawag ako
  rationale: Likas at malawak na katumbas ng קרא; pinananatili nito ang posibilidad ng pagtawag o pagdaing nang hindi dinaragdagan ang tindi ng damdamin.
- source_word: וַיַּעֲנֵנִי
  choice: sinagot niya ako
  rationale: Tuwiran at natural na salin ng pandiwang nangangahulugang sumagot o tumugon.
- source_word: לֹא אַאֲמִין
  choice: hindi ako maniniwala
  rationale: Ang anyong panghinaharap sa kondisyong ito ay likas na naghahayag ng hipotetikal na di-paniniwala sa Filipino.
- source_word: כִּי
  choice: na
  rationale: Ipinakikilala nito ang nilalaman ng hindi paniniwala, hindi isang sanhi.
- source_word: יַאֲזִין
  choice: nakikinig siya
  rationale: Ipinapahayag ng אזן ang pagbibigay-pansin o masusing pakikinig, hindi lamang ang basta pagkarinig.
- source_word: קוֹלִי
  choice: sa tinig ko
  rationale: Pinananatili ang kongkretong leksikal na larawan ng “aking tinig” sa halip na ipakahulugang “aking daing” o “aking pakiusap.”
theological_decisions:
- issue: Paglalarawan sa sinabi ni Job tungkol sa tugon ng Diyos
  choice: Inilalarawan ang pansariling di-paniniwala ni Job na talagang nakikinig ang Diyos kahit sagutin siya nito.
  alternative: Gawing tahasang pagtanggi na nakikinig ang Diyos kailanman, o gawing simpleng pagkagulat lamang ang sinabi.
  rationale: 'Pinananatili ng Hebreo ang hipotetikal at eksistensiyal na tensiyon: hindi nito itinatatag bilang doktrina na hindi kailanman nakikinig ang Diyos, ngunit hindi rin nito pinahihina ang matinding pag-aalinlangan ni Job.'
translation_notes:
  register: Makabago, dignificado, at madaling maunawaang Filipino. Ginamit ang “tinig” upang mapanatili ang literal na larawan, at “nakikinig” upang maipahiwatig ang aktibong pagbibigay-pansin.
