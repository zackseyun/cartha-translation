translation_notes:
  register: 'Makabagong, malinaw, at marangal na Filipino. Ginamit ang “mga iyon” upang tumukoy sa “mga araw ko” sa naunang talata nang hindi inuulit ang pariralang wala sa Hebreo. Pinanatili ang dalawang mabilis na larawang patula: magaan na bangkang dumaraan at agilang dumadagit.'
