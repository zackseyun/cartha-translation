  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חָלְפוּ
  choice: Dumaraan
  rationale: Ipinahahayag ang mabilis na paglipas ng mga araw ni Job sa kasalukuyang paglalarawan, alinsunod sa konteksto ng talata 25.
- source_word: אֳנִיּוֹת אֵבֶה
  choice: mga bangkang yari sa tambo
  rationale: Ang אֵבֶה ay bihira at malamang tumutukoy sa tambo o papirus; ang mas pangkalahatang “tambo” ay natural sa Tagalog at hindi labis na nagpapakipot sa di-tiyak na katawagan.
- source_word: כְנֶשֶׁר
  choice: gaya ng agila
  rationale: Karaniwang katumbas ng נֶשֶׁר sa kontekstong naglalarawan ng ibong mandaragit na mabilis sumalakay.
- source_word: יָטוּשׂ עֲלֵי אֹכֶל
  choice: dumadagit sa pagkain
  rationale: Ipinananatili ang larawan ng mabilis na pagsalakay ng ibong mandaragit patungo sa makakain nito; ang “pagkain” ay tuwirang katumbas ng אֹכֶל.
