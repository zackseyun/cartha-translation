    rationale: Ang parirala ay maaaring mangahulugang dumadagit ang agila ng pagkain na mayroon na, samantalang ang Hebreo ay naglalarawan ng agilang mabilis na sumusugod o dumadagit sa biktima.
  - severity: low
    issue: '"mga iyon" bilang paksa'
    rationale: Bagaman maaaring tumukoy sa "mga araw ko" ng naunang talata, hindi ito likas na pagpapatuloy sa modernong Filipino; mas maayos ang "sila".
