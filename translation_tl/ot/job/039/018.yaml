  text: When she lifts herself up on high[b][a], she laughs at the horse and its rider.
translation:
  language: tl
  text: Kapag pumapaitaas siya[a], pinagtatawanan niya[b] ang kabayo at ang mangangabayo nito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “kapag inilaladlad niya ang kanyang mga pakpak sa itaas” o “kapag pumapagaspas siyang paitaas.” Malamang na tumutukoy ang pandiwang Hebreo sa pag-angat, ngunit pinagtatalunan ang eksaktong diwa nito.
    reason: lexical_alternative
  - marker: b
    text: Ang “pinagtatawanan” ay maaari ring mangahulugang “kinukutya” o “hinahamak.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּעֵת
  choice: Kapag
  rationale: Ipinahahayag nito ang panahong o pagkakataong nagaganap ang kilos; natural sa modernong Tagalog ang “Kapag” sa ganitong pangungusap.
- source_word: בַּמָּרוֹם
  choice: sa kaitaasan
  rationale: Pinananatili nito ang larawang patungo o nasa mataas na dako nang hindi tiyak na sinasabing ganap na lumilipad ang ibon.
- source_word: תַּמְרִיא
  choice: itinataas niya ang sarili niya
  rationale: Ipinapakita ng anyong Hiphil ang pag-angat niya sa sarili. Hindi ginamit ang mas tiyak na “pumapailanlang” upang hindi lampasan ang hindi tiyak na kahulugan ng pandiwa at ang larawang zoolohikal.
- source_word: תִּשְׂחַק
  choice: pinagtatawanan niya
  rationale: Ang שׂחק na may ל ay maaaring tumukoy sa mapanghamak na pagtawa; malinaw at buhay sa Tagalog ang “pinagtatawanan” habang naiiwan sa talababa ang mas tahasang “hinahamak.”
- source_word: לַסּוּס
  choice: ang kabayo
  rationale: Ang may artikulong pangngalang isahan ay ginagamit bilang pangkalahatang pagtukoy sa kabayo.
- source_word: וּלְרֹכְבוֹ
  choice: at ang sakay nito
  rationale: Ang hulaping panghalip ay pinakamalamang na tumutukoy sa kabayo; malinaw na iniuugnay ng “nito” ang sakay sa kabayo.
