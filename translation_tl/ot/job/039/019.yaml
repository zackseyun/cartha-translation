  source_fidelity: 'Tumpak ang pangunahing pag-unawa sa Hebreo: dalawang retorikal na tanong ang tumutukoy sa pagbibigay ng lakas sa kabayo at sa paglalagay ng kiling sa leeg nito. Gayunman, ang hulmang “Ikaw ba ang ...” ay maaaring magdagdag ng diin na eksklusibo (“ikaw ba ang siyang...”) na hindi kailangang ipahayag sa Filipino, at ang “nagbibihis sa leeg nito ng kiling” ay hindi ang pinakanatural na balangkas para sa Hiphil na “damitan/bihisan.”'
  naturalness: Mas likas at malinaw ang “Nagbibigay ka ba...” at “Binibihisan mo ba ng kiling ang leeg nito?” Pinananatili nito ang magkahanay na retorikal na tanong at ang matalinghagang larawan ng kiling bilang kasuotang inilalagay sa leeg.
  terminology: Ang “kabayo,” “lakas,” “leeg,” at “kiling” ay wasto at modernong Filipino. Ang talababa tungkol sa alternatibong “kulog” ay angkop, ngunit mas maayos ang payak na pananalitang “O, marahil” at “tradisyon ng pagbibigay-kahulugan.”
  issues:
