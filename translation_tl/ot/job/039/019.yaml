translation:
  language: tl
  text: Nagbibigay ka ba ng lakas sa kabayo? Binibihisan mo ba ng kiling ang leeg nito?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, marahil, “kulog,” ayon sa isang mas matandang tradisyon ng pagbibigay-kahulugan sa רַעְמָה. Isinalin itong “kiling” dahil ang larawan ay ng pagbibihis sa leeg ng kabayo.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתִתֵּן
  choice: Ikaw ba ang nagbibigay
  rationale: Ang panandang patanong at pandiwang nasa ikalawang panauhang panlalaki ay bumubuo ng retorikal na tanong kay Job. Likas sa Filipino ang hulma na “Ikaw ba ang nagbibigay,” at malinaw nitong itinatampok ang tuwirang hamon.
- source_word: לַסּוּס
  choice: sa kabayo
  rationale: May tiyak na pantukoy ang pangngalang Hebreo, ngunit ginagamit ito rito bilang pangkalahatang pagtukoy sa kabayo bilang uri. Ang “sa kabayo” ang likas na katumbas sa Filipino.
- source_word: גְּבוּרָה
  choice: lakas
  rationale: Ang salita ay maaaring mangahulugang lakas, kapangyarihan, o kagitingan. Sa paglalarawan sa pisikal na sigla ng kabayo, “lakas” ang pinakamalinaw at pinakanatural.
- source_word: הֲתַלְבִּישׁ
  choice: Ikaw ba ang nagbibihis
  rationale: Ang Hiphil ng לבש ay nangangahulugang magbihis o magdamit sa iba. Pinananatili ng “nagbibihis” ang matingkad na talinghaga ng paglalagay ng kiling na tila kasuutan sa leeg.
- source_word: צַוָּארוֹ
  choice: sa leeg nito
  rationale: Ang hulaping panlalaking isahan ay tumutukoy sa kabayo. Ang “nito” ay natural sa Filipino at hindi nagpapahiwatig na tiyak na lalaking kabayo ang tinutukoy.
- source_word: רַעְמָה
  choice: kiling
  rationale: Sa konteksto ng leeg ng kabayo at ng talinghagang pagbibihis, malamang na tumutukoy ang salita sa kiling. Gayunman, pinananatili sa talababa ang mas matandang pagbasa na “kulog” dahil may tunay na leksikal na kalabuan.
