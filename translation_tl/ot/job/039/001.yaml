  yaml_path: translation/ot/job/039/001.yaml
  text: Do you know the time when the mountain goats give birth? Do you watch over the deer in labor?[a][b][c]
translation:
  language: tl
  text: Alam mo ba kung kailan nanganganak ang mga kambing-gubat sa mababatong kabundukan[a]? Pinagmamasdan[c] mo ba ang mga usang babae[b] habang nanghihilab?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga ligaw na kambing sa mga bato”; tumutukoy ang Hebreo sa mailap na mga kambing na naninirahan sa mababatong kabundukan, marahil ay mga ibex.
    reason: lexical_alternative
  - marker: b
    text: O “mga babaeng usa.”
    reason: lexical_alternative
  - marker: c
    text: Maaari ring isalin na “Binabantayan mo ba” o “Minamasdan mo ba nang mabuti.” Ang pandiwa ay maaaring mangahulugang magmasid o magbantay.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲיָדַעְתָּ
  choice: Alam mo ba
  rationale: Likas na ipinahahayag nito sa Filipino ang retorikal na tanong na binubuo ng pantanong na הֲ at ng pandiwang ידע.
- source_word: עֵת לֶדֶת
  choice: kung kailan nanganganak
  rationale: Ginagawang likas na sugnay na panahunan sa Filipino ang literal na diwang ‘ang panahon ng panganganak,’ nang hindi nililimitahan kung ito ay tiyak na sandali o kapanahunan.
- source_word: יַעֲלֵי סָלַע
  choice: mga kambing-gubat sa batuhan
  rationale: Pinananatili ang dalawang sangkap ng Hebreo—mailap na hayop na kawangis ng kambing at ang mabatong tirahan nito—nang hindi tiyakang kinikilalang ibex ang uri.
- source_word: חֹלֵל
  choice: habang naghihilab sa panganganak
  rationale: Ipinahahayag ang paghilab o paghihirap na kaugnay ng panganganak, sa halip na basta sabihing ‘nanganganak’ lamang.
- source_word: אַיָּלוֹת
  choice: mga usang babae
  rationale: Tiyak na tumutukoy ang anyong Hebreo sa mga babaeng usa; malinaw at pangkasalukuyan ang pariralang Filipino.
- source_word: תִּשְׁמֹר
  choice: Minamasdan mo ba
  rationale: Sa konteksto, ang שׁמר ay maaaring mangahulugang magmasid o magbantay. Ang ‘minamasdan’ ay hindi agad nagpapahiwatig ng pag-iingat o pagkalinga, habang pinananatili sa talababa ang alternatibo.
