  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kambing-gubat sa batuhan” upang mapanatili ang larawan ng Hebreo nang hindi gumamit ng di-pamilyar na katawagang zoolohikal; ang “naghihilab sa panganganak” ay nagpapahayag ng hirap ng pagle-labor sa likas na paraan.
