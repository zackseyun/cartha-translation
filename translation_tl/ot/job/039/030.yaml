  yaml_path: translation/ot/job/039/030.yaml
  text: Its young ones suck up blood[a], and where the slain are[b], there it is.
translation:
  language: tl
  text: Sinisipsip ng mga inakay nito ang dugo[a]; at kung nasaan ang mga napatay[b], naroon ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Nilalagok ng mga inakay nito ang dugo” o “Dinidilaan ng mga inakay nito ang dugo.” Matingkad ang pandiwang Hebreo at maaaring magpahiwatig ng pagsipsip, paglagok, o pagdila.
    reason: lexical_alternative
  - marker: b
    text: O “kung nasaan ang mga bangkay.” Ang Hebreo ay nagsasabing “mga napatay,” na nagdidiin sa marahas na pagkamatay.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶפְרֹחָיו
  choice: mga inakay nito
  rationale: Tumutukoy sa mga anak ng ibong mandaragit sa konteksto. Ang “mga inakay” ay likas sa Filipino at hindi labis na nagtatakda kung bagong pisa o nakalilipad na ang mga ito.
- source_word: יְעַלְעוּ
  choice: sinisipsip
  rationale: Pinananatili ang matingkad at marahas na larawan ng sabik na pagsipsip o paglagok ng dugo; ang alternatibong saklaw ng pandiwa ay inilagay sa talababa.
- source_word: דָם
  choice: dugo
  rationale: Tuwiran at karaniwang katumbas, nang hindi pinapalambot ang larawan.
- source_word: וּבַאֲשֶׁר
  choice: at kung nasaan
  rationale: Likas na Filipino para sa pariralang panlunan, habang pinananatili ang tuwirang ugnayan ng dalawang sugnay.
- source_word: חֲלָלִים
  choice: mga napatay
  rationale: Pinananatili ang diwa ng marahas na pagkamatay sa halip na tumukoy lamang sa mga bangkay.
- source_word: שָׁם הוּא
  choice: naroon ito
  rationale: Ang panghalip ay tumutukoy sa ibong inilalarawan; ang “ito” ay angkop sa pangkalahatang paglalarawan sa isang hayop, at ang kasalukuyang anyo ay umaayon sa tulang Hebreo.
