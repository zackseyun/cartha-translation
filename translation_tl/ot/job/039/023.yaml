translation:
  language: tl
  text: Sa kanya'y kumakalansing ang lalagyan ng palaso[a], pati ang kumikislap na sibat at suligi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “Sa ibabaw niya'y kumakalansing” o “Laban sa kanya'y kumakalansing.” Ang pang-ukol at pandiwa sa Hebreo ay maaaring magpahiwatig ng bahagyang magkaibang ugnayang panlunan at tunog.
    reason: lexical_alternative
  - marker: b
    text: Literal na, “ang liyab/talim ng sibat at suligi,” isang makatang paglalarawan sa kanilang kumikislap na ningning.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלָיו
  choice: sa ibabaw niya
  rationale: Pinananatili nito ang larawang pansaklaw ng עַל nang hindi ipinapalagay kung ang mga sandata ay nasa ibabaw lamang ng kabayo o tuwirang humahampas laban dito.
- source_word: תִּרְנֶה
  choice: kumakalansing
  rationale: Ipinahahayag ng pandiwa ang matinis at paulit-ulit na tunog ng kagamitang pandigma; natural sa Filipino ang “kumakalansing” para sa mga sandata o sisidlang umuuga.
- source_word: אַשְׁפָּה
  choice: lalagyan ng mga palaso
  rationale: Ito ang malinaw at karaniwang maunawaang katumbas sa modernong Filipino ng sisidlang pinaglalagyan ng mga palaso.
- source_word: לַהַב
  choice: kumikislap
  rationale: Ang literal na “liyab/talim” ay makatang larawan ng ningning ng sandata; ipinapahayag ng “kumikislap” ang larawang iyon sa natural na Filipino.
- source_word: חֲנִית
  choice: sibat
  rationale: Karaniwang malawak na katumbas ito ng sandatang pantusok na tinutukoy ng חֲנִית.
- source_word: כִידוֹן
  choice: suligi
  rationale: Pinananatili ng “suligi” ang pagkakaiba nito sa mas pangkalahatang “sibat” at tumutukoy sa mas magaan na sandatang maaaring ihagis.
theological_decisions: []
translation_notes:
  register: Makabago at marangal na Filipino ang ginamit. Ang “lalagyan ng mga palaso” ay mas madaling maunawaan ng karaniwang mambabasa kaysa sa teknikal o bihirang katawagan, samantalang ang “suligi” ay nagpapanatili sa pagkakaiba ng dalawang sandata. Ginamit ang “pati” upang natural na iugnay ang magkakasunod na kagamitang pandigma nang hindi pinapawi ang siksik na anyong patula ng Hebreo.
