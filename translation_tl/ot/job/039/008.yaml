  yaml_path: translation/ot/job/039/008.yaml
  text: He explores the mountains for his pasture[b][a], and he searches after every green thing.
translation:
  language: tl
  text: Nililibot niya ang mga bundok na kanyang pastulan[a], at hinahanap niya ang bawat luntiang halaman.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “Gumagala siya sa mga bundok upang humanap ng pastulan.”
    reason: lexical_alternative
  - marker: b
    text: Ang “luntiang halaman” ay tumutukoy sa sariwang berdeng pananim o usbong.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְתוּר
  choice: Nililibot
  rationale: Ang Qal na תור ay tumutukoy sa paggalugad o malayang paggala upang maghanap. Ang “nililibot” ay natural sa konteksto ng mailap na asnong naghahanap ng makakain.
- source_word: הָרִים
  choice: ang mga bundok
  rationale: Tuwirang katumbas ito ng pangmaramihang הָרִים na may pantukoy.
- source_word: מִרְעֵהוּ
  choice: na kanyang pastulan
  rationale: Ang מִרְעֶה ay pastulan o lugar ng panginginain, at ang hulaping panlalaking isahan ay tumutukoy sa hayop. Pinananatili ng parirala ang siksik na ugnayan ng mga bundok at ng pastulan sa Hebreo nang hindi labis na nililinaw ito.
- source_word: וְאַחַר
  choice: at ... hinahanap
  rationale: Sa pagsama sa sumusunod na pandiwa, ipinahihiwatig ng אַחַר ang paghahabol o aktibong paghahanap. Natural itong naipapahayag sa Filipino sa loob ng pandiwang “hinahanap.”
- source_word: כָּל
  choice: bawat
  rationale: 'Ginagamit dito ang כָּל sa diwang distributibo: anumang sariwang halamang matatagpuan.'
- source_word: יָרוֹק
  choice: luntiang halaman
  rationale: Ang יָרוֹק ay literal na “luntian” at sa kontekstong ito ay tumutukoy sa sariwang berdeng pananim o usbong. Mas natural at malinaw ang “luntiang halaman” kaysa “bawat luntiang bagay.”
- source_word: יִדְרֹשׁ
  choice: hinahanap
  rationale: Ang דרשׁ sa Qal ay nangangahulugang humanap o magsikap na matagpuan; ang “hinahanap” ay angkop sa aktibong paghahanap ng pagkain.
