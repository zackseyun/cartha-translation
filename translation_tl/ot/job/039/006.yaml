  text: to whom I have given the desert for his house[a], and the salt land for his dwelling place[c][b],
translation:
  language: tl
  text: 'na binigyan ko ng ilang bilang tahanan,

    at ng maalat na lupain bilang mga tirahan niya.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kapatagang maalat” o “tigang na lupaing maalat” para sa “maalat na lupain” (מְלֵחָה).
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר
  choice: na siyang
  rationale: Iniuugnay ng panghalip na panrelative ang talata sa mailap na asno sa naunang talata; natural sa Filipino ang “na siyang” sa pagpapatuloy ng pangungusap.
- source_word: שַׂמְתִּי
  choice: binigyan ko
  rationale: Bagaman pangunahing nangangahulugang “inilagay” o “itinalaga,” ipinapahayag dito ng pandiwa ang pagkakaloob o pagtatalaga ng Diyos ng tirahan.
- source_word: עֲרָבָה
  choice: ilang
  rationale: Tumutukoy ito sa tigang at malawak na lupaing di-sinasaka. Ang “ilang” ay malinaw, makata, at karaniwang nauunawaan sa modernong Filipino; maaari ring isalin na “disyerto” o “tigang na kapatagan.”
- source_word: בֵיתוֹ
  choice: bilang tahanan
  rationale: Literal na “bahay niya.” Ang “bilang tahanan” ay likas sa Filipino at pinananatili ang larawang ang ilang ang ipinagkaloob na tahanan nito.
- source_word: וּמִשְׁכְּנוֹתָיו
  choice: at ... bilang mga tirahan niya
  rationale: Pinanatili ang maramihang anyo ng Hebreo sa “mga tirahan,” yamang natural naman ito sa Filipino at hindi kailangang ipakahulugang pang-isahan.
- source_word: מְלֵחָה
  choice: maalat na lupain
  rationale: Tumutukoy sa tigang na lupaing hitik sa asin. Ang “maalat na lupain” ay malinaw at hindi labis na nagpapakitid sa kahulugan tungo lamang sa isang salt flat.
theological_decisions: []
translation_notes:
  register: Makabagong Filipino na may marangal at makatang himig. Pinanatili ang paralelismo ng “tahanan” at “mga tirahan,” pati ang maramihang anyo ng Hebreong מִשְׁכְּנוֹתָיו. Ang talata ay isang pagpapatuloy ng tanong sa Job 39:5, kaya nagsisimula ito sa “na siyang.”
