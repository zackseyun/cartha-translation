translation_notes:
  register: Makabago, marangal, at patula ngunit madaling maunawaan. Pinanatili ang kongkretong talinghagang “ngipin ng batuhan,” na nilinaw sa talababa, at iniwasang gawing tahasang paliwanag ang larawang “tanggulan.”
