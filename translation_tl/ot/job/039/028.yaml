  text: He dwells on the cliff and spends the night there[c][b][a], on the tooth of the crag and the stronghold.
translation:
  language: tl
  text: Naninirahan siya sa bangin at doon nagpapalipas ng gabi[a], sa ngipin ng bato[b] at sa kuta[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “at doon tumutuloy” o “at doon namamalagi nang magdamag.”
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “sa ngipin ng bato”—isang Hebreong larawan para sa matulis at nakausling bahagi o taluktok ng bato.
    reason: cultural_note
  - marker: c
    text: Maaari ring “tanggulan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: סֶלַע
  choice: bangin
  rationale: Sa unang paglitaw, tumutukoy ito sa matarik at mabatong lugar na angkop na tirahan ng agila. Likas at malinaw sa modernong Filipino ang “bangin.”
- source_word: יִשְׁכֹּן
  choice: naninirahan
  rationale: Pinananatili nito ang diwa ng palagian o nakagawiang paninirahan, hindi lamang pansamantalang paglagi.
- source_word: וְיִתְלֹנָן
  choice: at doon nagpapalipas ng gabi
  rationale: Ipinahahayag nito ang temporal na diwa ng pandiwang לון/לין—ang pagtuloy o pananatili nang magdamag. Idinagdag ang “doon” bilang likas na pagtukoy sa naunang lugar.
- source_word: עַל
  choice: sa
  rationale: Likas na panandang Filipino para sa lokasyon; sa kontekstong ito, katumbas ito ng “on/upon.”
- source_word: שֶׁן סֶלַע
  choice: sa ngipin ng batuhan
  rationale: Pinananatili ang matingkad na Hebreong larawan ng “ngipin” bilang matulis at nakausling bahagi ng mabatong dalisdis, sa halip na agad itong gawing “tuktok” o “gilid.”
- source_word: סֶלַע
  choice: batuhan
  rationale: Sa ikalawang paglitaw, ang “batuhan” ay nagpapanatili sa mabatong larawan at umiiwas sa paulit-ulit na “bangin,” habang umaangkop sa pariralang “ngipin ng batuhan.”
- source_word: וּמְצוּדָה
  choice: at sa tanggulan
  rationale: Ang מְצוּדָה ay maaaring tumukoy sa tanggulan o kuta. Dito, matalinghaga nitong inilalarawan ang ligtas at mahirap marating na mabatong kanlungan.
