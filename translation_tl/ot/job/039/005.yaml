  text: Who has let the wild donkey go free? Who has untied the bonds of the swift donkey?[a]
translation:
  language: tl
  text: Sino ang nagpalaya sa ligaw na asno? Sino ang nagluwag ng mga tali ng asnong-gubat?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Sino ang nagluwag ng mga tali ng ligaw na asno?” Ang Hebreong עָרוֹד ay maaari ring unawain bilang isa pang katawagan sa ligaw na asno; isinasalin din ito ng ilan bilang “onager.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי
  choice: Sino
  rationale: Pananong na panghalip na nagpapakilala sa retorikal na tanong ng Diyos.
- source_word: שִׁלַּח ... חָפְשִׁי
  choice: nagpalaya
  rationale: Likas at maikli sa Tagalog; pinagsasama nito ang diwa ng pagpapakawala at ng pagiging malaya.
- source_word: פֶּרֶא
  choice: mailap na asno
  rationale: Tumutukoy sa asnong hindi napaamo; malinaw sa karaniwang mambabasa ang 'mailap' at naipahihiwatig nito ang pamumuhay sa ilang.
- source_word: וּמֹסְרוֹת
  choice: mga tali
  rationale: Konkretong tawag sa mga panali o panggapos, at natural sa kasunod na pandiwang 'nagkalag.'
- source_word: עָרוֹד
  choice: asnong-gubat
  rationale: Isa pang katawagan sa ligaw na asno. Pinananatili nitong magkaiba ang dalawang salitang Hebreo nang hindi nagdaragdag ng hindi tiyak na katangiang gaya ng bilis.
- source_word: פִתֵּחַ
  choice: nagkalag
  rationale: Sa konteksto ng mga tali, nangangahulugan itong nagluwag o nagtanggal ng pagkakatali; ang 'nagkalag' ay natural at tiyak.
theological_decisions:
- issue: Pagkakakilanlan ng gumawa sa dalawang retorikal na tanong
  choice: Pinanatili ang 'Sino' nang walang tahasang sagot.
  alternative: Idagdag na ang Diyos ang nagpalaya at nagkalag.
  rationale: Ipinahihiwatig ng konteksto na ang Diyos ang sagot, ngunit hindi ito tahasang sinasabi sa mismong talata; pinananatili ng salin ang retorikal na puwersa ng Hebreo.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang 'asnong-gubat' upang katawanin ang ikalawang katawagang Hebreo nang hindi ipagpalagay na bilis ang tiyak na diin nito; ipinapaliwanag sa talababa ang mas pangkalahatang alternatibo.
