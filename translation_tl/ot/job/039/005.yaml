  naturalness: Mas natural at malinaw sa modernong Filipino ang “Sino ang nagluwag ng mga tali ng asnong-gubat?” kaysa “Sino ang nagkalag sa mga tali ng asnong-gubat?” Ang “asnong-gubat” ay nananatiling katanggap-tanggap na panumbas sa ikalawang, kaugnay na katawagang Hebreo.
  terminology: Pinananatili ang pagkakaiba sa pangunahing teksto sa pagitan ng “ligaw na asno” at “asnong-gubat,” nang hindi ipinipilit na ang עָרוֹד ay nangangahulugang “mabilis.” Ipinapaliwanag ng talababa na maaari rin itong unawain nang mas pangkalahatan bilang ligaw na asno.
