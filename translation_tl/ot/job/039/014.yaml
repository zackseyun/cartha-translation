translation:
  language: tl
  text: Sapagkat iniiwan niya sa lupa ang kanyang mga itlog[a] at iniinit niya ang mga iyon sa alabok.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pinababayaan niya sa lupa ang kanyang mga itlog.” Maaaring mas matindi kaysa sa simpleng “iniiwan” ang pandiwang Hebreo, ngunit ipinahihiwatig ng kasunod na linya na ang mga itlog ay nasa lupa at pinaiinit niya ang mga iyon, hindi lubusang pinabayaan.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikita ang paliwanag o sanhi na kaugnay ng naunang paglalarawan sa babaeng avestruz.
- source_word: תַעֲזֹב
  choice: iniiwan
  rationale: Likas at tuwirang katumbas ito sa konteksto. Maaari ring mangahulugang “pinababayaan” ang pandiwang Hebreo, ngunit hindi kailangang ipahiwatig na lubusan na niyang tinalikuran ang mga itlog.
- source_word: לָאָרֶץ
  choice: sa lupa
  rationale: Pinananatili ang konkretong larawan ng mga itlog na naiwan sa ibabaw ng lupa at maayos itong kaagapay ng kasunod na “sa alabok.”
- source_word: בֵּצֶיהָ
  choice: ang kanyang mga itlog
  rationale: Tuwirang isinasalin ang pangngalang maramihan na may hulaping pambabaeng pangatlong panauhan.
- source_word: וְעַל עָפָר
  choice: sa alabok
  rationale: Ang “alabok” ay tumpak sa עָפָר at nagpapanatili ng marangal at makatang himig ng talata.
- source_word: תְּחַמֵּם
  choice: pinaiinit niya ang mga iyon
  rationale: Tuwirang ipinahahayag ang Piel na “gawing mainit.” Ang “mga iyon” ay likas na tumutukoy sa mga itlog nang hindi gumagamit ng mas teknikal at mapagpasyang salitang “nililimliman.”
