  yaml_path: translation/ot/job/039/021.yaml
  text: It paws in the valley and rejoices in its strength[b][a]; it goes out to meet the weapons.
translation:
  language: tl
  text: Kinakahig nito ang lupa sa lambak[a] at nagagalak sa taglay nitong lakas; lumalabas ito upang salubungin ang mga sandata[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “naghuhukay sa lambak” o “kinakahig ang lupa sa lambak.” Literal na “humukay” ang pandiwang Hebreo, ngunit dito ay tumutukoy ito sa pagkahig ng kabayo sa lupa gamit ang mga paa nito.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “ang labanan.” Ang pangngalang Hebreo ay maaaring tumukoy sa mga sandata bilang isang kabuuan at, sa mas malawak na diwa, sa armadong labanan mismo.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַחְפְּרוּ
  choice: Kinakahig nito ang lupa
  rationale: Ang חפר ay literal na “humukay,” ngunit sa konteksto ng kabayong pandigma, inilalarawan nito ang pagkahig o pagkayod ng paa sa lupa. Likas at malinaw sa Filipino ang “kinakahig nito ang lupa” habang pinananatili ang kongkretong kilos.
- source_word: בָעֵמֶק
  choice: sa lambak
  rationale: Ang עֵמֶק ay karaniwang tumutukoy sa lambak o mababang lupain; “sa lambak” ang tuwirang katumbas.
- source_word: וְיָשִׂישׂ
  choice: at nagagalak
  rationale: Ipinapahayag ng שׂושׂ ang matinding galak o pagbubunyi. Dignified at madaling maunawaan ang “nagagalak.”
- source_word: בְּכֹחַ
  choice: sa taglay nitong lakas
  rationale: Nililinaw nito sa natural na Filipino na ang lakas ay taglay ng kabayo, habang pinananatili ang diwa ng pagkalugod nito sa sariling lakas.
- source_word: יֵצֵא
  choice: lumalabas ito
  rationale: Tuwirang isinasalin ang karaniwang kahulugan ng יצא nang hindi idinaragdag ang mas interpretatibong “sumasalakay.”
- source_word: לִקְרַאת
  choice: upang salubungin
  rationale: Ang לקראת ay nagsasaad ng paglabas patungo sa isang makakaharap. Ang “salubungin” ay natural at angkop sa konteksto.
- source_word: נָשֶׁק
  choice: ang mga sandata
  rationale: Ang נֶשֶׁק ay maaaring tumukoy sa mga sandata o kagamitang pandigma, at sa pagpapalawak ay sa labanan. Pinananatili ng “mga sandata” ang kongkretong larawan.
