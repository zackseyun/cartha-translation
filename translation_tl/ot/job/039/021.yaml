translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “kinakahig nito ang lupa” upang maging malinaw ang kilos ng kabayo; iniwasan ang mas matinding “sumasalakay” dahil hindi iyon tahasang nasa pandiwang Hebreo. Inilagay ang mga talababa sa mga salitang aktuwal na tinutukoy ng bawat alternatibo.
