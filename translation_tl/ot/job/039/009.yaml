translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Ginamit ang “ito” sa ikalawang pangungusap upang hindi magtakda ng kasariang hindi ipinahahayag ng anyong Hebreo, at pinanatili ang magkatambal na retorikal na mga tanong.
