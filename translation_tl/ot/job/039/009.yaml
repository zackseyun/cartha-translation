  yaml_path: translation/ot/job/039/009.yaml
  text: Will the wild ox be willing to serve you? Will he spend the night at your feeding trough?[a][b]
translation:
  language: tl
  text: Papayag ba ang mailap na bakang-gubat[b] na maglingkod sa iyo? Magpapalipas ba ito ng gabi sa iyong sabsaban[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pakainan mo.” Ang salitang Hebreo ay tumutukoy sa sisidlan o lugar na kainan ng mga hayop.
    reason: lexical_alternative
  - marker: b
    text: O “mailap na toro” o “aurochs.” Hindi tiyak kung anong hayop ang tinutukoy ng salitang Hebreo.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲיֹאבֶה
  choice: Papayag ba
  rationale: Ipinapanatili nito ang diwa ng kusang pagpayag o pagsang-ayon, hindi lamang ang kakayahang gawin ang isang bagay.
- source_word: רֵּים
  choice: mailap na baka
  rationale: Hindi tiyak ang eksaktong hayop. Ang pariralang ito ay malinaw sa karaniwang mambabasa at ipinahihiwatig na isa itong hindi napaamong uri ng baka, nang hindi labis na tinutukoy ang espesye.
- source_word: עָבְדֶךָ
  choice: maglingkod sa iyo
  rationale: Tuwirang inilalarawan ang paglilingkod o paggawa para sa isang amo at pinananatili ang retorikal na paghahambing sa maamong hayop na pantrabaho.
- source_word: אִם
  choice: Magpapalipas ba
  rationale: Sa paralelismong patula, nagpapasimula ito ng ikalawang retorikal na tanong; natural sa Tagalog ang muling paggamit ng hulma ng tanong.
- source_word: יָלִין
  choice: magpapalipas ... ng gabi
  rationale: Likas at kasalukuyang paraan ito upang ipahayag ang pananatili o pagtuloy nang magdamag.
- source_word: עַל
  choice: sa
  rationale: Sa kontekstong lokatibo ng pakainan, ang “sa” ang pinakanatural na katumbas sa Tagalog.
- source_word: אֲבוּסֶךָ
  choice: iyong pakainan
  rationale: Tumutukoy ito sa sisidlan o lugar na kainan ng hayop. Ang “pakainan” ay malinaw at hindi arkaiko; ipinaliliwanag sa talababa ang mas kongkretong alternatibo.
