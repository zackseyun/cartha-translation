  yaml_path: translation/ot/job/039/004.yaml
  text: Their young ones become strong[a]; they grow up in the open field; they go out and do not return to them.
translation:
  language: tl
  text: Lumalakas ang kanilang mga anak; lumalaki sila sa kaparangan[a]; umaalis sila at hindi bumabalik sa kanila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa ilang” o “sa bukas na lupain.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יַחְלְמוּ
  choice: Lumalakas
  rationale: Ipinahihiwatig ng pandiwa rito ang pisikal na paglakas at pagiging malusog ng mga anak ng hayop. Likas at malinaw sa modernong Tagalog ang “lumalakas.”
- source_word: בְנֵיהֶם
  choice: ang kanilang mga anak
  rationale: Bagaman maaari itong literal na tumukoy sa “mga anak na lalaki,” pangkalahatan ang tinutukoy sa konteksto ng mga hayop, kaya hindi nililimitahan sa kasarian ang salin.
- source_word: יִרְבּוּ
  choice: lumalaki sila
  rationale: Maaaring mangahulugang “dumami” ang pandiwa, ngunit sa paralelismo rito ay mas malamang na inilalarawan nito ang paglaki o paghinog ng mga anak. Pinananatili ng “lumalaki” ang diwang iyon nang hindi dinaragdagan ang teksto.
- source_word: בַבָּר
  choice: sa kaparangan
  rationale: Tumutukoy ito sa bukas at hindi sinasakang lupain. Ang “kaparangan” ay marangal at madaling maunawaang katumbas; inilalagay sa talababa ang iba pang lehitimong pagbasa.
- source_word: יָצְאוּ
  choice: umaalis sila
  rationale: Malinaw na ipinapahayag ang paglayo ng mga anak ng hayop nang hindi ipinapalagay ang eksaktong destinasyon nila.
- source_word: וְלֹא שָׁבוּ לָמוֹ
  choice: at hindi na bumabalik sa kanila
  rationale: Pinananatili ang panghalip na “sa kanila” gaya ng Hebreo, sa halip na tahasang tukuyin ang mga ina. Ang “na” ay natural sa Tagalog para sa pag-alis na sinusundan ng hindi pagbabalik, nang hindi idinaragdag ang tahasang “kailanman.”
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na simple, marangal, at angkop sa patulang paglalarawan. Pinanatili ang tatlong magkakasunod na kilos—paglakas, paglaki, at pag-alis—at ang panghalip na “sa kanila” upang hindi labis na tukuyin ang reperente.
