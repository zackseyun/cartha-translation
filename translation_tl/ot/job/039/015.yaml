  text: and she forgets that a foot may crush them[b][a], and a wild animal may trample them.
translation:
  language: tl
  text: At nalilimutan niya na maaaring durugin ng isang paa ang mga iyon[a], at maaaring yurakan ng isang hayop sa parang ang mga iyon[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “durugin siya/iyon ng isang paa … yurakan siya/iyon.” Pambabaeng isahan ang hulapi sa Hebreo, ngunit malamang na kolektibo itong tumutukoy sa mga itlog o sisiw na naiwan.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “isang mailap na hayop.” Sa literal, ang pariralang Hebreo ay “hayop ng parang/bukid,” na tumutukoy sa hayop na nabubuhay sa bukas na lupain.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּשְׁכַּח
  choice: At nalilimutan niya
  rationale: Ang Qal wayyiqtol na pambabaeng isahan ay nagpapatuloy sa masiglang paglalarawan sa babaeng avestruz; ang pangkasalukuyang “nalilimutan” ay natural sa daloy ng tulang Filipino.
- source_word: כִּי
  choice: na
  rationale: Ipinakikilala rito ng כִּי ang nilalaman ng nalilimutan, hindi ang dahilan nito.
- source_word: רֶגֶל
  choice: isang paa
  rationale: 'Isahan ang kongkretong larawan at di-tiyak ang diwa: anumang paa ay maaaring makatapak at makadurog.'
- source_word: תְּזוּרֶהָ
  choice: maaaring durugin ... ang mga iyon
  rationale: Sa kontekstong ito, tumutukoy ang pandiwa sa pinsalang dulot ng pagtapak. Ang pambabaeng isahang hulapi ay likas na isinalin sa maramihang “mga iyon” dahil malamang na kolektibong tumutukoy ito sa mga itlog o sisiw na naiwan.
- source_word: וְחַיַּת הַשָּׂדֶה
  choice: at ... isang hayop sa parang
  rationale: Pinananatili nito ang konkretong Hebreong pariralang “hayop ng parang/bukid” nang hindi ipinapalagay na likas itong mabangis.
- source_word: תְּדוּשֶׁהָ
  choice: maaaring yurakan
  rationale: Ang דושׁ ay nangangahulugang tumapak o yumurak; ang “yurakan” ay natural at kaagapay ng “durugin” sa naunang sugnay.
