translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang masiglang pangkasalukuyang paglalarawan at ang konkretong larawan ng paa at hayop sa parang; iniwasan ang “mabangis” sa pangunahing teksto upang hindi magdagdag ng katangiang hindi tahasang nasa Hebreo.
