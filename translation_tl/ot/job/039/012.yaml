  yaml_path: translation/ot/job/039/012.yaml
  text: Will you trust him that he will bring back your seed and gather it to your threshing floor?[a]
translation:
  language: tl
  text: Magtitiwala ka ba sa kanya na iuuwi niya ang iyong ani[a] at titipunin iyon sa iyong giikan?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “iyong binhi”; sa kontekstong ito, malamang na tumutukoy ito sa inaning butil o ani na dinadala mula sa bukid.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתַאֲמִין
  choice: Magtitiwala ka ba
  rationale: Ang Hiphil ng אמן ay tumutukoy rito sa praktikal na pag-asa o pagtitiwala sa mabangis na baka, hindi lamang sa paniniwala.
- source_word: בּוֹ
  choice: sa kanya
  rationale: Ang panlalaking isahang hulapi ay tumutukoy sa mabangis na baka; natural sa Tagalog ang “sa kanya” para sa hayop na tuwirang kinakausap o tinutukoy.
- source_word: כִּי
  choice: na
  rationale: Ipinakikilala nito ang nilalaman ng pagtitiwala—na gagawin ng hayop ang mga sumusunod.
- source_word: יָשׁוּב
  choice: iuuwi niya
  rationale: Bagaman karaniwang nangangahulugang “bumalik” ang שׁוב, mayroon itong layon dito; ipinahihiwatig ng kontekstong pansakahan ang pagdadala pabalik mula sa bukid.
- source_word: זַרְעֶךָ
  choice: ang iyong ani
  rationale: Literal na “iyong binhi,” ngunit sa kontekstong ito ay metonimikong tumutukoy sa bunga o butil na inani. Mas natural at malinaw sa modernong Tagalog ang “ani,” habang itinatala sa talababa ang literal na anyo.
- source_word: גָרְנְךָ
  choice: iyong giikan
  rationale: Ang גֹּרֶן ay lugar na pinaggigiikan, hindi kamalig o imbakan; “giikan” ang tiyak at likas na katumbas.
- source_word: יֶאֱסֹף
  choice: titipunin iyon sa
  rationale: Ang אָסַף ay “tipunin” o “ipunin.” Ang “iyon” ay tumutukoy sa ani, at natural na ipinahahayag ng “sa” ang hantungan na giikan.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang retorikal na tanong at ang larawan ng gawaing pansakahan; ginamit ang “ani” sa teksto para sa likas na daloy, kalakip ang literal na “binhi” sa talababa.
