translation_notes:
  register: Makabago at dignified na Filipino, na may malinaw na anyong patula. Ginamit ang “tambuli” para sa shofar at pinanatili ang kongkretong imahen na naaamoy ng kabayo ang labanan. Ang tunay na kalabuan ng תְרוּעָה bilang sigaw o hudyat na tunog ay hindi nilutas nang tahimik kundi inilagay sa talababa.
