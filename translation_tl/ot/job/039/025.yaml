base_translation:
  language: en
  yaml_path: translation/ot/job/039/025.yaml
  text: At the blast of the trumpet he says[a], ‘Aha!’ From far away he smells the battle[c][b], the thunder of commanders and the war cry.
translation:
  language: tl
  text: Tuwing tumutunog ang tambuli[a], sinasabi niya, “Aha!”[b] Mula sa malayo ay naaamoy niya ang labanan—ang dagundong ng mga kumander at ang sigaw ng pakikidigma.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Sa pag-ihip ng tambuli.” Ang idyomang Hebreo ay tumutukoy sa pagkakataong tumutunog ang tambuli.
    reason: lexical_alternative
  - marker: b
    text: Ang “Aha!” ay bulalas ng sabik na pananabik at inilalarawan ang kahandaan ng kabayo sa labanan.
    reason: cultural_note
  - marker: c
    text: Maaari ring “ang kulog ng mga kumander at ang hiyawan” o “ang dagundong ng mga kumander at ang hudyat ng tambuli.” Ang salitang isinaling “dagundong” ay literal na “kulog,” at ang isinaling “sigaw ng pakikidigma” ay maaari ring tumukoy sa hiyawan o tunog na hudyat.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּדֵי שֹׁפָר
  choice: Sa tunog ng tambuli
  rationale: Ang idyoma ay tumutukoy sa pagkakataong tumutunog ang shofar. Likas sa Filipino ang “sa tunog ng tambuli” at hindi nito nililimitahan ang tunog sa isang partikular na uri ng pag-ihip.
- source_word: שֹׁפָר
  choice: tambuli
  rationale: Tumutukoy ito sa sungay na ginagamit bilang hudyat. Ang “tambuli” ay malinaw at marangal na salitang Filipino para sa ganitong instrumentong pantawag o pandigma.
- source_word: יֹאמַר
  choice: sinasabi niya
  rationale: Pinananatili ang karaniwang kahulugang “sabihin” at ang matingkad na pagsasatao sa kabayong pandigma, nang hindi dinaragdagan ng diwa ng pagsigaw.
- source_word: הֶאָח
  choice: Aha!
  rationale: Isang bulalas ng sabik at masiglang pananabik. Ang “Aha!” ay maikli at pinananatili ang anyo at sigla ng Hebreo.
- source_word: וּמֵרָחוֹק
  choice: Kahit mula sa malayo
  rationale: Malinaw na ipinahihiwatig ang distansiya; ang “kahit” ay likas na nagpapakita na naaamoy pa rin ng kabayo ang labanan sa kabila ng layo.
- source_word: יָרִיחַ
  choice: naaamoy niya
  rationale: Pinananatili ang kongkretong larawan ng pandamang pang-amoy sa Hiphil ng ריח, sa natural na modernong Filipino.
- source_word: מִלְחָמָה
  choice: ang labanan
  rationale: Ang pangngalan ay maaaring tumukoy sa digmaan o labanan; sa agarang tagpo ng kabayong pandigma, “labanan” ang pinakalikas.
- source_word: רַעַם
  choice: ang dagundong
  rationale: Ang literal na larawan ay kulog ngunit metaporikong tumutukoy sa malakas na ingay sa digmaan. Pinananatili ng “dagundong” ang lakas ng imahen sa natural na Filipino.
- source_word: שָׂרִים
  choice: mga pinuno
  rationale: Sa kontekstong militar, tumutukoy ito sa mga namumuno sa hukbo. Ang “mga pinuno” ay hindi labis na espesipiko at pinananatili ang saklaw ng salitang Hebreo.
- source_word: וּתְרוּעָה
  choice: at ang sigaw ng pakikidigma
  rationale: Maaaring mangahulugan ng sigaw o hudyat na tunog. Sa kaagapay na dagundong ng mga pinuno, ang sigaw sa labanan ang malamang na diwa, habang inilalahad sa talababa ang alternatibo.
