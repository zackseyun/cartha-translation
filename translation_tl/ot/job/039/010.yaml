base_translation:
  language: en
  yaml_path: translation/ot/job/039/010.yaml
  text: Will you bind the wild ox in the furrow with its rope[b][a], or will it harrow the valleys behind you?
translation:
  language: tl
  text: Matatali mo ba sa tudling ang mailap na baka[a] gamit ang lubid nito, o susuyurin[b] ba nito ang mga lambak sa likuran mo?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “aurochs” o “mailap na toro.” Ang salitang Hebreo na רֵים ay tumutukoy sa isang malakas at mailap na bovine, hindi sa kathang-isip na “unicorn” sa ilang matatandang salin.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “aararuhin” o “papatagin.” Malamang na mas tiyak na tumutukoy ang pandiwang Hebreo sa pagsuyod o pagpapantay ng lupang binungkal.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתִקְשָׁר
  choice: Matatali mo ba
  rationale: Ang קשׁר ay nangangahulugang itali o igapos. Ang anyong tanong ay nagpapanatili sa retorikal na hamon kung kaya ba itong pasunurin ng tao.
- source_word: רֵים
  choice: mailap na baka
  rationale: Tumutukoy ang רֵים sa isang malakas at mailap na uri ng bovine. Malinaw sa karaniwang mambabasang Filipino ang “mailap na baka,” samantalang inilalahad sa talababa ang mas tiyak na mga katawagan.
- source_word: בְּתֶלֶם
  choice: sa tudling
  rationale: Ang תֶּלֶם ay tudling na nalikha sa pag-aararo; likas sa Filipino ang “sa tudling” para sa kinalalagyan o dinaraanan ng hayop na ginagamit sa bukid.
- source_word: עֲבֹתוֹ
  choice: gamit ang lubid nito
  rationale: Ang עֲבוֹת ay makapal na tali o lubid. Pinananatili ng “lubid nito” ang hulaping panlalaking isahan na tumutukoy sa mailap na baka.
- source_word: אִם
  choice: o
  rationale: Dito, ipinakikilala ng אִם ang ikalawang bahagi ng magkatulad na retorikal na tanong, hindi isang karaniwang kondisyong “kung.”
- source_word: יְשַׂדֵּד
  choice: susuyurin
  rationale: Sa kontekstong pansakahan, tumutukoy ang pandiwa sa muling pagtrabaho, pagdurog, o pagpapantay ng lupa matapos araruhin. Ang “susuyurin” ang pinakamalapit na likas na terminong pansakahan at iniiba ito sa unang pag-aararo.
- source_word: עֲמָקִים
  choice: ang mga lambak
  rationale: Ang karaniwang kahulugan ng עֲמָקִים ay mga lambak o mabababang lugar. Pinananatili ang tuwirang larawang heograpikal sa halip na gawing pangkalahatang “mga bukid.”
- source_word: אַחֲרֶיךָ
  choice: sa likuran mo
  rationale: Tuwirang ipinahahayag nito na nasa likuran ng nagtatrabaho ang hayop habang ginagabayan ito.
theological_decisions: []
translation_notes:
  register: Makabago at dignified na Filipino ang ginamit. Pinili ang karaniwang salitang “mailap na baka” sa pangunahing teksto para madaling maunawaan, at inilagay sa talababa ang mas teknikal na “aurochs.” Ang “susuyurin” ay terminong pansakahan na nagpapanatili sa pagkakaiba ng pagsuyod at pag-aararo.
