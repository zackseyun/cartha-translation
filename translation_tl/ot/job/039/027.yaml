  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “pumapailanlang” upang mapanatili ang matayog na larawang patula, at ang “gumagawa ng pugad nito sa kaitaasan” upang natural na maipahayag ang mataas na kinalalagyan ng pugad.
