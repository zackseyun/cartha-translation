  text: Sa utos mo ba pumapailanlang ang agila at itinatayo ang pugad nito sa mataas na lugar?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “lumilipad nang mataas” sa halip na “pumapailanlang.”
    reason: lexical_alternative
  - marker: b
    text: Ang “agila” ay maaari ring tumukoy nang mas malawak sa isang malaking ibong mandaragit, marahil pati sa buwitre sa ilang konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: ba
  rationale: Sa konteksto, ipinakikilala nito ang isang retorikal na tanong; natural itong ipinahahayag sa Tagalog sa pamamagitan ng pang-angkop na patanong na “ba.”
- source_word: עַל־פִּיךָ
  choice: sa utos mo
  rationale: Literal na “sa iyong bibig,” ngunit isang idyoma ito para sa utos o salita ng isang tao. Malinaw at likas sa modernong Tagalog ang “sa utos mo.”
- source_word: יַגְבִּיהַּ
  choice: pumapailanlang
  rationale: Ang Hiphil ng גבה ay nagpapahayag ng pag-angat o pagpunta sa mataas. Sa agila bilang simuno, ang “pumapailanlang” ay natural at pinananatili ang larawan ng mataas na paglipad.
- source_word: נָשֶׁר
  choice: agila
  rationale: Ito ang karaniwan at angkop na salin sa larawang makata ng ibong lumilipad at namumugad sa mataas, bagaman maaari ring masaklaw ng salita ang ibang malalaking ibong mandaragit.
- source_word: וְכִי
  choice: at
  rationale: Iniuugnay nito ang ikalawang sugnay sa una bilang bahagi ng iisang retorikal na tanong.
- source_word: יָרִים קִנּוֹ
  choice: gumagawa ng pugad nito sa kaitaasan
  rationale: Bagaman literal na “itinataas ang pugad nito,” ang parirala ay tumutukoy sa paglalagay o paggawa ng pugad sa mataas na lugar. Iniiwasan ng saling ito ang di-natural na impresyong pisikal na binubuhat ang pugad.
