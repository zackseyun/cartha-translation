  yaml_path: translation/ot/job/039/022.yaml
  text: He laughs at fear and is not dismayed[b][a], and he does not turn back from the sword.
translation:
  language: tl
  text: Tinatawanan niya ang takot at hindi siya nasisindak,[a] at hindi siya umuurong sa harap ng tabak.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “hindi siya pinanghihinaan ng loob.”
    reason: lexical_alternative
  - marker: b
    text: O “hindi siya tumatalikod dahil sa tabak.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׂחַק
  choice: Pinagtatawanan
  rationale: 'Tuwirang pinananatili ang matingkad na larawan ng Hebreong שׂחק: ang kabayo ay tumatawa sa takot, na may posibleng pahiwatig din ng paghamak.'
- source_word: לְפַחַד
  choice: ang takot
  rationale: Ang פחד ay tumutukoy sa takot, pangamba, o sindak. Ang “takot” ay malinaw at hindi nagpapalabis sa tindi ng salita.
- source_word: יֵחָת
  choice: hindi siya nasisindak
  rationale: Sa Niphal, ang חתת ay maaaring mangahulugang masiraan ng loob, masindak, o mabagabag. Ang “nasisindak” ay natural sa konteksto ng tapang sa labanan at hindi labis na literal.
- source_word: יָשׁוּב
  choice: hindi siya umuurong
  rationale: Bagaman literal na “bumabalik/tumatalikod,” sa kontekstong pandigma ang שׁוב ay likas na tumutukoy sa pag-urong. Ang “umuurong” ay malinaw sa modernong Filipino.
- source_word: מִפְּנֵי
  choice: sa harap ng
  rationale: Ang idyomang מִפְּנֵי ay maaaring “mula sa harap ng,” “sa harap ng,” o “dahil sa.” Dito, ipinakikita nito ang hindi pag-atras kapag kaharap ang banta.
- source_word: חָרֶב
  choice: tabak
  rationale: Ang חרב ay isahang “tabak,” na maaaring kumatawan sa sandata o panganib ng labanan. Pinananatili ng “tabak” ang kongkretong larawan.
