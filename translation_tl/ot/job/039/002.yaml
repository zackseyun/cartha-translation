  text: Do you count the months they fulfill[a], and do you know the time when they give birth?
translation:
  language: tl
  text: Binibilang mo ba ang mga buwan hanggang sa malubos ang kanilang pagdadalang-tao[a], at alam mo ba kung kailan sila manganganak?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “ang mga buwang kanilang nilulubos.” Aktibo ang pandiwa sa Hebreo; tumutukoy ito sa pag-abot sa ganap na panahon ng pagdadalang-tao.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּסְפֹּר
  choice: Binibilang mo ba
  rationale: Ang Qal imperfect na ikalawang panauhang panlalaki ay bahagi ng retorikal na pagtatanong ng Diyos. Ang kasalukuyang anyong “Binibilang mo ba” ang natural sa Filipino at hindi ito ginagawang tanong tungkol lamang sa kakayahan.
- source_word: יְרָחִים
  choice: ang mga buwan
  rationale: Tuwirang tumutukoy sa mga buwan ng pagdadalang-tao; hindi kailangang gawing mas tahasang “mga buwang lunar.”
- source_word: תְּמַלֶּאנָה
  choice: hanggang sa malubos ang kanilang pagbubuntis
  rationale: Ang Piel imperfect na pambabaeng maramihan ay literal na aktibo, “kanilang nilulubos [ang mga buwan],” ngunit ang diwa ay ang pag-abot sa ganap na haba ng pagdadalang-tao. Ang saling ito ay likas sa modernong Filipino; inilalahad sa talababa ang anyong literal.
- source_word: וְיָדַעְתָּ
  choice: at alam mo ba
  rationale: Pinananatili ang pang-ugnay at ang kasunod na retorikal na tanong sa natural na Filipino.
- source_word: עֵת
  choice: kung kailan
  rationale: Ang temporal na sugnay ay natural na katumbas ng “ang panahon/oras” sa tanong, nang hindi ipinapasok ang mas interpretibong diwang “itinakdang panahon.”
- source_word: לִדְתָּנָה
  choice: sila manganganak
  rationale: Ang infinitive construct na may pambabaeng maramihang hulapi ay tumutukoy sa kanilang panganganak; malinaw at karaniwan ang pandiwang anyo sa Filipino.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “pagbubuntis” upang likas na maipahayag ang idyomatikong diwa ng pagkumpleto ng mga buwan, habang pinananatili sa talababa ang aktibong anyo ng Hebreo.
