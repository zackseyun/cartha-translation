- from: Mula roon ay tinatanaw nito ang pagkain; nakikita iyon ng mga mata nito mula sa malayo.[a]
  to: Mula roon ay naghahanap ito ng pagkain[a]; mula sa malayo ay tumitingin ang mga mata nito.
