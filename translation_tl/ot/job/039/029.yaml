translation:
  language: tl
  text: Mula roon ay naghahanap ito ng pagkain[a]; mula sa malayo ay tumitingin ang mga mata nito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Mula roon ay tinatanaw nito ang pagkain; mula sa malayo ay tumitingin ang mga mata nito.” Maaari ring unawain ang Hebreo bilang pagbibigay-diin sa kakayahan nitong makita ang pagkain mula sa malayo.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשָּׁם
  choice: Mula roon
  rationale: Tumutukoy ito sa mataas na lugar na pinagmamasdan ng agila at natural na katumbas ng locative phrase sa Hebreo.
- source_word: חָפַר
  choice: tinatanaw
  rationale: Bagaman karaniwang nangangahulugang “humukay,” sa konteksto ng agilang naghahanap ng makakain, ipinahihiwatig nito ang masusing paghahanap sa pamamagitan ng paningin. Ang “tinatanaw” ay likas sa Filipino at angkop sa tanaw mula sa mataas at malayong lugar.
- source_word: אֹכֶל
  choice: pagkain
  rationale: Pinananatili ang malawak na kahulugan ng pangngalan; maaaring tukuyin nito ang mas tiyak na “masisila,” ngunit hindi iyon tahasang sinasabi ng salita.
- source_word: לְמֵרָחוֹק
  choice: mula sa malayo
  rationale: Malinaw at natural nitong ipinahahayag ang malaking distansiya ng pagtingin.
- source_word: עֵינָיו
  choice: mga mata nito
  rationale: Pinananatili ang tahasang maramihang pangngalan at ang konkretong larawan ng matalas na paningin ng agila.
- source_word: יַבִּיטוּ
  choice: nakikita
  rationale: Ang Hiphil ng נבט ay nagpapahayag ng nakatuon o masusing pagtingin. Sa ugnayan nito sa bagay na hinahanap, natural sa Filipino ang “nakikita,” habang ang alternatibong “tumitingin” ay mas pormal na tumutugma sa pandiwa.
