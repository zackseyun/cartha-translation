  text: Is it by your understanding that the hawk soars[a], spreading its wings toward the south?
translation:
  language: tl
  text: Sa pamamagitan ba ng iyong pang-unawa kaya pumapailanlang ang lawin[a] at inilaladlad nito ang mga pakpak patimog?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “palkon”; ang Hebreong נֵץ ay maaaring tumukoy nang mas malawak sa ganitong uri ng ibong mandaragit.
