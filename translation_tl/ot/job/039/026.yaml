lexical_decisions:
- source_word: הֲמִבִּינָתְךָ
  choice: Sa pamamagitan ba ng iyong pang-unawa
  rationale: Ipinahahayag ang tanong kung ang paglipad ng ibon ay nangyayari sa pamamagitan ng pagkaunawa o pagk discern ni Job; tuwirang katumbas ng בִּינָה ang “pang-unawa.”
- source_word: יַאֲבֶר
  choice: pumapailanlang
  rationale: Ang anyong Hiphil ng אבר ay tumutukoy sa pag-angat o paglipad ng ibon; natural na inilalarawan ng “pumapailanlang” ang mataas at maaliwalas na paglipad.
- source_word: נֵץ
  choice: lawin
  rationale: Tumutukoy ang נֵץ sa isang ibong mandaragit na kauri ng hawk o falcon. Karaniwan at hindi labis na espesipiko ang “lawin” sa Filipino.
- source_word: יִפְרֹשׂ
  choice: ibinubuka
  rationale: Ang פרשׂ ay “magladlad” o “magbuka.” Ang “ibinubuka” ay likas na gamit para sa mga pakpak habang lumilipad.
- source_word: כְּנָפוֹ
  choice: ang mga pakpak nito
  rationale: Bagaman isahan ang anyong Hebreo at maaaring kolektibo, mas natural sa Filipino ang maramihang “mga pakpak”; pinananatili ng “nito” ang makabagong pagtukoy sa hayop.
- source_word: לְתֵימָן
  choice: patimog
  rationale: Ipinahahayag nang maikli at natural ang direksiyon patungo sa timog na tinutukoy ng לְ.
