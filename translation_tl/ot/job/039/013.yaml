  text: The wings of the ostrich flap joyfully—are they the pinions and plumage of the stork?[a]
translation:
  language: tl
  text: Masayang ipinapagaspas ng avestruz ang mga pakpak nito—ngunit maihahambing ba ang mga iyon sa mga bagwis at balahibo ng tagak?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Ipinapagaspas nang buong pagmamalaki ng avestruz ang pakpak nito, ngunit iyon ba ay bagwis at balahibo ng tagak?” Mahirap unawain ang Hebreo at iba-iba ang naging pagpapakahulugan dito.'
    reason: alternative_reading
lexical_decisions:
- source_word: כְּנַף
  choice: mga pakpak
  rationale: Isinaad sa maramihan ang kolektibong isahan sa Hebreo upang maging natural sa Tagalog at tumukoy sa magkapares na pakpak.
- source_word: רְנָנִים
  choice: ng avestruz
  rationale: Sa konteksto ng talakayan tungkol sa mga hayop at ng kasunod na mga talata, tumutukoy ang anyo sa avestruz, bagaman maaari itong literal na iugnay sa pag-iyak o paghiyaw.
- source_word: נֶעֱלָסָה
  choice: Masayang ipinapagaspas
  rationale: Pinagsasama nito ang masiglang galaw ng mga pakpak at ang diwa ng tuwa o pagmamalaki na nasa pandiwang Hebreo.
- source_word: אִם
  choice: ngunit maihahambing ba
  rationale: Ginawang retorikal na tanong ang eliptikong paghahambing; ipinahihiwatig ng 'ngunit' ang kaibahan nang hindi inaalis ang tanong.
- source_word: אֶבְרָה
  choice: mga bagwis
  rationale: Ang salita ay tumutukoy sa pakpak o sa mahahabang balahibo ng pakpak; pinananatili ng 'bagwis' ang tiyak at patulang diwa.
- source_word: חֲסִידָה
  choice: tagak
  rationale: Pangalan ito rito ng ibong stork, hindi ng katangiang 'tapat' o 'mabait.' Ang 'tagak' ang karaniwang natural na katumbas sa Filipino.
- source_word: וְנֹצָה
  choice: at balahibo
  rationale: Tuwirang ipinapahayag ang plumage o mga balahibo sa malinaw at likas na Filipino.
theological_decisions:
- issue: Ugnayan ng ikalawang sugnay sa unang sugnay
  choice: 'Retorikal na paghahambing: ''ngunit maihahambing ba ... sa tagak?'''
  alternative: 'Tuwirang pagkakakilanlan o paghahambing: ''mga bagwis at balahibo ba iyon ng tagak?'''
  rationale: Napakahirap at eliptiko ng Hebreo. Pinananatili ng retorikal na tanong ang paghahambing at tensiyon nang hindi ipinapalagay na literal na tinatawag na mga pakpak ng tagak ang sa avestruz.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang karaniwang 'avestruz' at 'tagak,' habang pinanatili ang patulang 'bagwis.' Ang hulma ng tanong at talababa ay sadyang nagpapanatili sa tunay na kalabuan ng tekstong Hebreo.
