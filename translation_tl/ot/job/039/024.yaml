  text: With fierceness and rage he devours the ground[b][a], and he cannot stand still at the sound of the trumpet.
translation:
  language: tl
  text: Sa matinding bagsik at galit, nilalamon nito ang lupa[a]; hindi ito mapakali sa tunog ng trumpeta.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “nilulunok ang lupa”—isang matingkad na larawan ng bilis at pananabik ng kabayo sa pagsugod.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin, “hindi nito mapigil ang sarili kapag tumunog ang trumpeta.” Sa mas literal na gamit, ang pandiwa ay madalas mangahulugang “maniwala.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּרַעַשׁ
  choice: Sa matinding bagsik
  rationale: Maaaring tumukoy ang רַעַשׁ sa pagyanig, kaguluhan, o marahas na pagkilos. Sa paglalarawan sa kabayong pandigma, ipinahahayag ng “matinding bagsik” ang puwersa at marahas na sigla ng pagsugod nang hindi ito ginagawang literal na lindol o panginginig.
- source_word: וְרֹגֶז
  choice: at galit
  rationale: Ang רֹגֶז ay maaaring mangahulugang pagkabalisa, panginginig, o matinding galit. Kasabay ng רַעַשׁ, pinatitingkad nito ang nag-aalab na sigla ng kabayo; natural at malinaw sa Filipino ang “galit.”
- source_word: יְגַמֶּא
  choice: nilalamon
  rationale: Ang pandiwang גמא ay literal na “lumunok” o “lumagok.” Pinananatili ng “nilalamon” ang matapang na larawang tila inuubos ng mabilis na kabayo ang lupang tinatakbo nito.
- source_word: אָרֶץ
  choice: ang lupa
  rationale: Sa konteksto, tumutukoy ito sa lupang tinatakbo ng kabayo, hindi sa buong daigdig o sa isang nasasakupang lupain.
- source_word: וְלֹא יַאֲמִין
  choice: hindi ito mapakali
  rationale: Bagaman karaniwang kaugnay ng “maniwala” ang אמן sa Hiphil, sa kontekstong ito maaari itong idiomatikong tumukoy sa hindi pananatiling panatag o hindi pagpipigil. Ang “hindi ito mapakali” ay malinaw na naglalarawan sa pananabik ng kabayo sa hudyat ng labanan habang inilalagay sa talababa ang tunay na leksikal na kalabuan.
- source_word: כִּי
  choice: sa
  rationale: Sa pariralang ito, iniuugnay ng כִּי ang reaksiyon ng kabayo sa pagkarinig sa trumpeta. Ang “sa tunog” ay natural na Filipino at malapit sa ugnayang ipinahahayag ng konteksto.
- source_word: קוֹל שׁוֹפָר
  choice: tunog ng trumpeta
  rationale: Ang שׁוֹפָר ay tambuli o trumpetang ginagamit bilang hudyat, lalo na sa digmaan. Ang “trumpeta” ay madaling maunawaan sa modernong Filipino, at pinananatili ng buong parirala ang diin ng Hebreo sa tunog.
theological_decisions: []
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “nito/ito” para sa kabayo sapagkat walang gramatikal na kasarian sa Filipino. Pinanatili ang masiglang metapora ng paglunok sa lupa at inilahad sa talababa ang kalabuan ng וְלֹא יַאֲמִין.
