  yaml_path: translation/ot/job/039/011.yaml
  text: Will you trust him because his strength is great[a], and leave your labor to him?
translation:
  language: tl
  text: Magtitiwala ka ba sa kanya dahil napakalakas niya, at ipauubaya mo ba sa kanya ang iyong pinaghirapan[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “iyong pagpapagal” o “iyong ani”; maaaring tumukoy ang salitang Hebreo sa paggawa mismo o sa bungang nalilikha nito.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתִבְטַח
  choice: Magtitiwala ka ba
  rationale: Ang Qal imperfect na may panandang patanong ay bumubuo ng retorikal na tanong. Likas at tuwiran sa modernong Tagalog ang “magtitiwala ka ba.”
- source_word: בּוֹ
  choice: sa kanya
  rationale: Ang hulaping panlalaking isahan ay tumutukoy sa mailap na baka sa konteksto; “sa kanya” ang karaniwang katuwang ng “magtitiwala” sa Tagalog.
- source_word: כִּי
  choice: dahil
  rationale: Ipinapahayag dito ang dahilan o batayan ng ipinapalagay na pagtitiwala.
- source_word: רַב כֹּחוֹ
  choice: napakalakas niya
  rationale: Ipinahahayag ng רַב ang tindi o laki ng כֹּחַ. Ang pang-uri na “napakalakas” ay natural sa konteksto ng lakas ng hayop at hindi nagpapahiwatig ng mas abstraktong kapangyarihan.
- source_word: וְתַעֲזֹב
  choice: at ipauubaya mo ba
  rationale: Ang עזב ay pangunahing nangangahulugang iwan o pabayaan. Sa konteksto ng gawaing ipinagkakatiwala sa hayop, malinaw na naihahatid ng “ipauubaya” ang pag-iwan ng pananagutan dito nang hindi labis na nilalayo ang diwa.
- source_word: אֵלָיו
  choice: sa kanya
  rationale: Ipinapakita ng אֶל na ang gawain o bunga nito ay ipinauubaya sa hayop.
- source_word: יְגִיעֶךָ
  choice: ang iyong pinaghirapan[a]
  rationale: Maaaring tumukoy ang יְגִיעַ sa pagpapagal mismo o sa bungang nakamit sa pagpapagal. Bahagyang napapanatili ng “pinaghirapan” ang dalawang posibilidad, habang inilalahad sa talababa ang saklaw ng kahulugan.
theological_decisions: []
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog. Pinanatili ang anyo ng retorikal na tanong at ang bahagyang kalabuan ng יְגִיעַ sa pamamagitan ng “pinaghirapan” at talababa.
