  yaml_path: translation/ot/job/039/007.yaml
  text: He laughs at the tumult of the city[b][a]; he does not hear the shouts of the driver.
translation:
  language: tl
  text: Tinatawanan niya ang maingay na kaguluhan ng lungsod[a]; hindi niya naririnig ang mga sigaw ng tagapagtaboy[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ingay ng lungsod.”
    reason: lexical_alternative
  - marker: b
    text: O “tagapagpagawa” o “tagapangasiwa.” Ang salitang Hebreo ay maaaring tumukoy nang mas malawak sa isang taong nagtataboy o sapilitang nagpapagawa.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׂחַק
  choice: Tinatawanan niya
  rationale: Tuwirang ipinapahayag ng Qal imperfect ng שׂחק ang mapanghamong pagtawa ng mailap na asno sa ingay ng lungsod. Iniiwasan ng salin ang mas interpretatibong “nililibak” o “hinahamak.”
- source_word: לַהֲמוֹן
  choice: ang maingay na kaguluhan ng
  rationale: Maaaring tumukoy ang הָמוֹן sa ingay, ugong, o magulong pagkilos. Ang “maingay na kaguluhan” ay likas sa modernong Filipino at napapanatili ang dalawang diwa ng tunog at abalang pagkilos.
- source_word: קִרְיָה
  choice: lungsod
  rationale: Karaniwang tumutukoy ang קִרְיָה sa lungsod o bayan; ang “lungsod” ay malinaw na kaibahan ng ilang sa konteksto.
- source_word: תְּשֻׁאוֹת
  choice: mga sigaw
  rationale: Ang pangmaramihang pangngalan ay tumutukoy sa malalakas na sigaw o hiyaw. Ang “mga sigaw” ang pinakanatural at tuwirang salin.
- source_word: נֹגֵשׂ
  choice: tagapagtaboy
  rationale: Maaaring tumukoy ang נֹגֵשׂ sa taong nagtutulak, nagpapagawa, o naniningil ng sapilitang gawain. Sa konteksto ng hayop, ang “tagapagtaboy” ang pinakamalapit nang hindi ipinapasok ang mas tiyak na larawan ng isang opisyal na tagapagpagawa.
- source_word: לֹא יִשְׁמָע
  choice: hindi niya naririnig
  rationale: Pinananatili nito ang payak na kahulugan ng pandiwang שׁמע. Bagaman maaaring ipinahihiwatig ng konteksto na hindi niya pinapansin ang mga sigaw, hindi iyon tahasang idinaragdag sa teksto.
