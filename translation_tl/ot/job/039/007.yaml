translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “maingay na kaguluhan” upang maipaloob ang saklaw ng הָמוֹן, at ang “tagapagtaboy” upang umangkop sa agarang larawan ng mailap na asno habang pinananatili sa talababa ang mas malawak na kahulugan ng נֹגֵשׂ.
