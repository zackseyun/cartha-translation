  text: She treats her young harshly[a], as if they were not hers; her labor is in vain, without fear.
translation:
  language: tl
  text: Malupit ang pakikitungo niya sa kanyang mga inakay[a], na para bang hindi kanya ang mga ito; nasasayang ang kanyang pagpapagal, ngunit wala siyang takot.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O mas literal, “Pinatitigas niya ang kanyang mga anak na tila hindi kanya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הִקְשִׁיחַ
  choice: Malupit ang pakikitungo
  rationale: Ang Hiphil ng קשׁח ay maaaring magpahiwatig ng pagpapatigas o malupit na pakikitungo. Sa konteksto ng avestrus at ng mga inakay nito, natural at malinaw sa Filipino ang pariralang ito, habang itinatala sa talababa ang mas literal na larawan.
- source_word: בָּנֶיהָ
  choice: kanyang mga inakay
  rationale: Bagaman literal na “mga anak” o “mga anak na lalaki,” ang “mga inakay” ang likas na katumbas sa konteksto ng isang ibon.
- source_word: לְלֹא לָהּ
  choice: na para bang hindi kanya ang mga ito
  rationale: Inilalahad nito nang malinaw ang eliptikong Hebreong “na hindi kanya,” at pinananatili ang diwa ng pagtrato sa mga inakay na tila hindi niya pag-aari.
- source_word: לְרִיק יְגִיעָהּ
  choice: mauwi sa wala ang kanyang pagpapagal
  rationale: Ang לְרִיק ay kawalang-bunga o pagkawalang-saysay, at ang יְגִיעָהּ ay kanyang pagod o pagpapagal. Ang pagkakasabing ito ay natural sa Filipino at pinananatili ang ideya ng nasayang na pagsisikap.
- source_word: בְּלִי פָחַד
  choice: hindi niya kinatatakutan
  rationale: Literal itong “nang walang takot.” Ang pandiwang anyo sa Filipino ay malinaw na nag-uugnay sa kawalan ng takot sa posibilidad na masayang ang kanyang pagpapagal, gaya ng sintaks ng taludtod.
