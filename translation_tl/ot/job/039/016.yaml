  naturalness: Natural at marangal ang “Malupit ang pakikitungo niya” at “mga inakay.” Ang binagong ikalawang sugnay ay mas tuwirang Filipino at mas malapit sa maigsi, mapagkahanay na estruktura ng Hebreo.
