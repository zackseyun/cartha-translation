translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “inakay” para sa kontekstong zoolohikal at “pagpapagal” para mapanatili ang bigat ng יְגִיעָהּ. Iniwasan ang sobrang kolokyal na pananalita at pinanatili sa talababa ang di-karaniwang literal na larawan ng Hebreo.
