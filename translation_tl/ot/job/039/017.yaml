lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikilala nito ang dahilan ng kilos ng babaeng avestruz sa naunang konteksto at pinananatili ang malinaw na ugnayang sanhi.
- source_word: הִשָּׁהּ
  choice: ipinagkait sa kanya
  rationale: Ipinahahayag ng Hiphil na anyo na ang karunungan ay ginawang wala sa kanya. Likas sa Tagalog ang “ipinagkait” at pinananatili nito ang tahasang pagkilos ng Diyos, habang inilalagay sa talababa ang tunay na alternatibong “ipinalimot.”
- source_word: אֱלוֹהַּ
  choice: Diyos
  rationale: Karaniwang salin ng pang-isahang katawagan sa Diyos sa Job; walang batayan sa konteksto upang palawakin ito bilang “Diyos na Makapangyarihan sa lahat.”
- source_word: חָכְמָה
  choice: karunungan
  rationale: Tumutukoy sa karunungan o wastong pagpapasiya; “karunungan” ang tuwiran at angkop na katumbas sa konteksto.
- source_word: וְלֹא
  choice: at hindi
  rationale: Tuwirang pinananatili ang pang-ugnay at pagtanggi ng Hebreo.
- source_word: חָלַק לָהּ
  choice: hindi siya binigyan ng bahagi sa
  rationale: Pinananatili ng pariralang ito ang pangunahing diwa ng חָלַק na paghahati o paglalaan, sa halip na payak na “hindi binigyan.”
- source_word: בַּבִּינָה
  choice: pagkaunawa
  rationale: Ang “pagkaunawa” ay likas na katumbas ng בִּינָה at nananatiling naiiba ngunit kaugnay ng “karunungan.”
theological_decisions:
- issue: Ang pagkilos ng Diyos kaugnay ng kawalan ng karunungan ng avestruz
  choice: 'Tahasan ang Diyos bilang kumikilos: “ipinagkait sa kanya ng Diyos” at “hindi siya binigyan.”'
  alternative: Palambutin ang pahayag bilang “wala siyang karunungan,” nang hindi tuwirang binabanggit ang pagkilos ng Diyos.
  rationale: Tahasan sa Hebreo ang אֱלוֹהַּ bilang simuno. Pinananatili ng salin ang teolohikal na tensiyon at hindi pinahihina ang tuwirang pag-uugnay ng teksto sa pagkilos ng Diyos.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “ipinagkait” para sa natural na causative expression at ang “binigyan ng bahagi” upang mapanatili ang distributibong larawan ng Hebreo nang hindi nagiging labis na teknikal.
