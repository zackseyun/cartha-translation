translation:
  language: tl
  text: Sapagkat ipinagkait sa kanya ng Diyos ang karunungan[a], at hindi siya binigyan ng bahagi sa pagkaunawa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ipinalimot sa kanya ng Diyos ang karunungan” o “ginawa ng Diyos na mawalan siya ng karunungan.”
