translation:
  language: tl
  text: Kaya mo ba siyang palundagin gaya ng balang? Ang maringal niyang pagsinghal ay nakapangingilabot.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Kaya mo ba siyang payanigin gaya ng balang?” Ang pandiwang Hebreo ay maaaring mangahulugang magpayanig o magpakilos nang marahas. Ipinapalagay ng ilan na ang larawan ay nagbibigay-diin din sa ugong o tunog, hindi lamang sa galaw.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתַרְעִישֶׁנּוּ
  choice: Mapapalundag mo ba siya
  rationale: Ang Hiphil ng רעשׁ ay maaaring tumukoy sa pagpapayanig, pagpapakilos nang marahas, o pagpapatalon. Sa paglalarawan sa kabayong pandigma at sa paghahambing sa balang, malinaw at natural sa Filipino ang bigla at malakas na paglundag, habang inilalahad sa talababa ang ibang posibleng diwa.
- source_word: כָּאַרְבֶּה
  choice: na gaya ng balang
  rationale: Pinananatili ang tahasang paghahambing sa balang; ang pang-isahang anyo ay maaaring kumatawan sa uri nito.
- source_word: הוֹד
  choice: maringal
  rationale: Ang הוֹד ay karaniwang nangangahulugang karilagan, kadakilaan, o maringal na anyo. Ginawang pang-uri ang diwa upang maging natural ang sugnay sa Filipino nang hindi mawala ang mataas na himig.
- source_word: נַחְרוֹ
  choice: niyang pagsinghal
  rationale: Tumutukoy ito sa malakas na pagbuga o pagsinghal sa mga butas ng ilong. Ang “pagsinghal” ay angkop sa kabayo at higit na tiyak kaysa “paghalinghing.”
- source_word: אֵימָה
  choice: nakapangingilabot
  rationale: Ang pangngalan ay nangangahulugang sindak o pangilabot. Ang predikatibong “nakapangingilabot” ay natural sa Filipino at pinananatili ang matinding epekto ng Hebreo.
