  yaml_path: translation/ot/job/039/003.yaml
  text: They crouch down[a], they bring forth their young[b]; they cast off their labor pains.
translation:
  language: tl
  text: Lumuluhod sila[a] at iniluluwal ang kanilang mga anak; nawawalan sila ng kanilang mga kirot ng panganganak.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “yumuyuko sila” o “nakaluhod silang yumuyuko.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, literal na “ipinapadala nila ang kanilang mga kirot,” isang matalinghagang paraan ng pagsasabing sila’y nagiging malaya mula sa kirot ng panganganak.
    reason: translation_clarity
lexical_decisions:
- source_word: תִּכְרַעְנָה
  choice: Yumuyuko sila
  rationale: Ang כרע ay tumutukoy sa pagbaba o pagyuko ng katawan. Sa konteksto ng panganganak ng mga hayop, natural ang “yumuyuko,” habang pinananatili ang mas malawak na diwa kaysa sa mas tiyak na “lumuluhod.”
- source_word: יַלְדֵיהֶן
  choice: ang kanilang mga anak
  rationale: Ang nominal na anyo mula sa ילד ay tumutukoy sa mga isinilang. Sa Filipino, malinaw at natural ang “mga anak” kahit mga hayop ang tinutukoy.
- source_word: תְּפַלַּחְנָה
  choice: iniluluwal
  rationale: Sa kontekstong ito, inilalarawan ng pandiwa ang paglalabas o pagsisilang sa mga anak. Ang “iniluluwal” ay malinaw, matulain, at angkop sa marangal na rehistro.
- source_word: חֶבְלֵיהֶם
  choice: ang mga kirot ng panganganak
  rationale: Bagaman maaaring tumukoy ang חבל sa mga lubid o tali sa ibang konteksto, ang larawan ng pagsisilang dito ay malinaw na nangangailangan ng diwang “mga kirot ng panganganak.”
- source_word: תְּשַׁלַּחְנָה
  choice: pinawawalan nila
  rationale: Ang שלח ay may pangunahing diwang magpaalis, magpalaya, o magpakawala. Pinananatili ng “pinawawalan nila” ang aktibong talinghaga ng Hebreo nang hindi ito ginagawang simpleng “nawawala.”
theological_decisions: []
translation_notes:
  register: Makabago at dignified na Filipino na may bahagyang matulaing himig. Pinanatili ang aktibong larawan ng Hebreo sa “pinawawalan nila” sa halip na ipaliwanag lamang na nawawala ang mga kirot.
