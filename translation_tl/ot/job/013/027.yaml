  text: You put my feet in the stocks[a], and you watch all my paths; you mark out the soles of my feet.
translation:
  language: tl
  text: Ipinapasok mo ang mga paa ko sa pang-ipit sa paa, at binabantayan mo ang lahat ng landas ko; minamarkahan mo ang mga talampakan ko.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “gumuguhit ka ng hangganan sa palibot ng mga talampakan ko.”
    reason: Pinananatili ng alternatibo ang posibleng diwa ng pandiwa bilang pagguhit o pag-ukit ng hangganan sa paligid ng mga paa.
lexical_decisions:
- source_word: וְתָשֵׂם
  choice: Inilalagay mo
  rationale: Ang שׂים ay karaniwang nangangahulugang ilagay o ipuwesto. Ang aspektong Hebreo rito ay likas na naihahayag sa kasalukuyang paglalarawan na “inilalagay mo.”
- source_word: בַּסַּד
  choice: sa pangawan
  rationale: Ang סַד ay isang kasangkapang pumipigil sa mga paa, gaya ng stocks. Ang “pangawan” ay maikli at marangal na salitang Filipino para sa ganitong panggapos, at pinananatili nito ang larawan ng pagkakakulong.
- source_word: וְתִשְׁמוֹר
  choice: binabantayan mo
  rationale: Maaaring mangahulugan ang שׁמר ng ingatan, bantayan, o masusing obserbahan. Sa reklamo ni Job, ang “binabantayan” ay nagpapahiwatig ng mahigpit na pagmamatyag nang hindi nagdaragdag ng interpretasyon.
- source_word: כָּל אָרְחוֹתָי
  choice: ang lahat ng landas ko
  rationale: Ang אֹרַח ay landas o paraan ng pamumuhay. Pinananatili ng “mga landas” ang konkretong larawan at ang posibleng mas malawak na kahulugan nito.
- source_word: עַל שָׁרְשֵׁי רַגְלַי
  choice: ang mga talampakan ko
  rationale: Bagaman karaniwang “ugat” ang שֹׁרֶשׁ, sa pariralang ito tumutukoy ito sa ilalim o pinakabase ng mga paa. Ang “mga talampakan” ang malinaw at natural na katumbas sa Filipino.
- source_word: תִּתְחַקֶּה
  choice: minamarkahan mo
  rationale: Ang anyo ng חקה ay maaaring tumukoy sa pag-ukit, pagmamarka, o pagguhit ng hangganan. Pinananatili ng “minamarkahan” ang sentrong larawan habang iniiwasang tukuyin nang labis kung marka ba ito sa talampakan o guhit sa paligid nito.
