translation_notes:
  register: Makabago ngunit marangal ang wika. Ginamit ang “pangawan” bilang maikli at angkop na tawag sa kasangkapang pumipigil sa mga paa; ang kalapit na pariralang “ang mga paa ko” ay nagpapalinaw sa kahulugan nito. Inilagay ang talababa sa huling sugnay, kung saan naroon ang tunay na leksikal at imaheng ambiguwidad.
