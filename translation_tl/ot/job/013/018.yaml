  text: הִנֵּה נָ֭א עָרַ֣כְתִּי מִשְׁפָּ֑ט יָ֝דַ֗עְתִּי כִּֽי אֲנִ֥י אֶצְדָּֽק־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/013/018.yaml
  text: See now[a], I have prepared my case; I know that I will be vindicated.
translation:
  language: tl
  text: Narito, naihanda ko na ang aking usapin; alam kong mapatutunayang nasa tama ako.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה נָא
  choice: Narito
  rationale: Pinagsasama nito ang pantawag-pansin at diin ng dalawang kataga sa isang natural at marangal na pananalitang Filipino.
- source_word: עָרַכְתִּי
  choice: naihanda ko na
  rationale: Sa kontekstong legal, ipinahihiwatig ng pandiwa ang maayos na paghahanda at pagsasaayos ng ihaharap na argumento.
- source_word: מִשְׁפָּט
  choice: ang aking usapin
  rationale: Tumutukoy ito rito sa kasong o usaping ihaharap ni Job. Likas sa Filipino ang 'aking usapin' at napapanatili nito ang legal na larawan nang hindi nagiging teknikal.
- source_word: יָדַעְתִּי
  choice: alam ko
  rationale: Ipinahahayag ng anyong Hebreo ang tiyak at matatag na kaalaman ni Job sa kasalukuyan.
- source_word: כִּי
  choice: na
  rationale: Ipinakikilala nito ang nilalaman ng nalalaman ni Job.
- source_word: אֲנִי אֶצְדָּק
  choice: mapatutunayang nasa tama ako
  rationale: Ipinahahayag nito ang forensikong diwa ng pagkilalang tama ang panig ni Job, habang pinananatili ang diin sa tahasang panghalip na אֲנִי.
theological_decisions:
- issue: Ang forensikong diwa ng pahayag ni Job
  choice: mapatutunayang nasa tama ako
  alternative: pawawalang-sala ako; ituturing akong matuwid
  rationale: Ang צדק ay nasa konteksto ng paglilitis at tumutukoy sa pagkilalang tama ang panig ng isang tao. Iniiwasan ng salin ang di-kinakailangang pag-angkat ng mas huling doktrinal na kahulugan ng 'pag-aaring-ganap,' ngunit hindi nito inaalis ang legal na puwersa ng pahayag.
translation_notes:
  register: Makabago, dignified, at madaling maunawaang Filipino. Ginamit ang 'Narito' bilang mariing pantawag-pansin at ang 'usapin' upang maipahiwatig ang legal na konteksto nang hindi masyadong teknikal.
