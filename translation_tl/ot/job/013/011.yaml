  naturalness: Marangal at modernong Tagalog ang unang sugnay. Ang pagpapalit ng 'lalagpak' ng 'babagsak' ay nagiging likás at malinaw ang ikalawang sugnay nang hindi nawawala ang imahen ng Hebreo.
  terminology: Ang 'karingalan' ay angkop para sa שְׂאֵתוֹ sa konteksto ng kadakilaan/majesty. Ang 'sindak' ay angkop para sa matinding פחד at mas maikli at matimbang kaysa 'pangamba' sa paralelismong ito.
