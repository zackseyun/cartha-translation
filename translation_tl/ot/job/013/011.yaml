translation_notes:
  register: Makabagong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “sisindakin” upang mapanatili ang tindi ng pandiwang Hebreo, at “lalagpak” upang maingatan ang larawang literal na “babagsak sa inyo.”
