lexical_decisions:
- source_word: הֲלֹא
  choice: Hindi ba
  rationale: Nananatili ang retorikal na tanong na umaasang sasang-ayon ang kausap.
- source_word: שְׂאֵתוֹ
  choice: kanyang karingalan
  rationale: Ipinahahayag ang mataas na kalagayan, dignidad, o kadakilaan ng Diyos sa natural at marangal na Tagalog.
- source_word: תְּבַעֵת
  choice: sisindakin
  rationale: Malakas na pandiwang nagsasaad ng pagdudulot ng matinding takot, ayon sa Piel ng בעת.
- source_word: אֶתְכֶם
  choice: kayo
  rationale: Tuwirang katumbas ng panghalip na ikalawang panauhang maramihan.
- source_word: וּפַחְדּוֹ
  choice: ang pangamba sa kanya
  rationale: Natural sa Tagalog at pinananatiling posible na tumutukoy ito sa takot na kanyang idinudulot, nang hindi labis na nilulutas ang ugnayang ipinahihiwatig ng hulaping paari.
- source_word: יִפֹּל עֲלֵיכֶם
  choice: lalagpak sa inyo
  rationale: Pinananatili ang matingkad na larawan ng takot na bumabagsak at nananaig sa mga kausap.
