translation:
  language: tl
  text: Tiyak na sasawayin niya kayo kung palihim kayong magpapakita ng pagkiling[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “mag-angat ng mga mukha,” isang idyomang Hebreo na nangangahulugang magpakita ng pagkiling o pagtatangi.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹכֵחַ יוֹכִיחַ
  choice: Tiyak na sasawayin
  rationale: Ang infinitive absolute na kasunod ng pandiwa mula sa יכח ay nagbibigay-diin sa katiyakan ng pagsaway. Ang “sasawayin” ay natural sa Filipino at pinananatili ang diwang pagbatikos o pagsaway sa maling asal.
- source_word: אֶתְכֶם
  choice: kayo
  rationale: Pangalawang panauhang panlalaki na maramihan ito at tumutukoy sa mga kaibigan ni Job.
- source_word: אִם
  choice: kung
  rationale: Pinananatili ng “kung” ang tunay na kondisyunal na anyo ng babala at hindi ipinapalagay na tiyak nang ginawa nila ito.
- source_word: בַּסֵּתֶר
  choice: palihim
  rationale: Likas na pang-abay sa Filipino ang “palihim” para sa pagkilos nang lingid o hindi lantad.
- source_word: פָּנִים תִּשָּׂאוּן
  choice: kayong magtatangi
  rationale: Ang literal na “mag-angat ng mga mukha” ay idyomang Hebreo para sa pagkiling o pagtatangi sa mga tao. Malinaw na ipinahahayag ng “magtatangi” ang etikal at panghukom na diwa nito.
theological_decisions:
- issue: Pagpapakahulugan sa idyomang נשׂא פנים
  choice: magtatangi
  alternative: magpapakita ng pagkiling; magbibigay ng natatanging pabor
  rationale: Tumutukoy ang idyoma sa pagkiling batay sa kung sino ang tao, lalo na sa kontekstong panghukom. Hindi ito isinalin nang literal upang maging malinaw, ngunit ipinaliwanag sa talababa ang larawang Hebreo.
- issue: Tinutukoy ng panghalip na “niya”
  choice: Pinanatiling “niya” sa talata
  alternative: “ng Diyos”
  rationale: Panghalip ang nasa Hebreo at malinaw sa konteksto na Diyos ang tinutukoy. Ang pagpapanatili ng panghalip ay umiiwas sa pagdaragdag ng pangngalang wala sa talata.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “tiyak na” upang katawanin ang mariing anyong Hebreo, at “palihim kayong magtatangi” para sa natural na daloy habang pinananatili ang kondisyon at ang diwa ng lihim na pagkiling.
