  text: כִּֽי תִכְתֹּ֣ב עָלַ֣/י מְרֹר֑וֹת וְ֝/תוֹרִישֵׁ֗/נִי עֲוֺנ֥וֹת נְעוּרָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/013/026.yaml
  text: For you write bitter things against me and make me inherit the iniquities of my youth[a][b].
translation:
  language: tl
  text: Sapagkat sumusulat ka ng mapapait na bagay laban sa akin[a], at ipinamamana mo sa akin ang mga kasalanan ng aking kabataan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “nagtatakda ka ng mapapait na bagay laban sa akin.” Literal sa Hebreo: “sumusulat ka ng mapapait na bagay laban sa akin.”'
    reason: lexical_alternative
  - marker: b
    text: O “ipinapasan mo sa akin ang sala” o “ang kaparusahan” dahil sa mga kasalanan ng aking kabataan. Ang salitang Hebreo ay maaaring tumukoy sa kasalanan, sa sala, o sa bunga nito.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikilala nito ang paliwanag ni Job sa naunang sinabi niya at natural na nag-uugnay sa daloy ng pangangatwiran.
- source_word: תִכְתֹּב עָלַי
  choice: sumusulat ka ... laban sa akin
  rationale: Pinananatili ang literal na larawan ng כתב, “sumulat,” at ang adversatibong diwa ng עַל; hindi nito nililimitahan ang kahulugan sa pormal na hatol lamang.
- source_word: מְרֹרוֹת
  choice: mapapait na bagay
  rationale: Natural sa modernong Filipino at pinananatiling bukas kung ang tinutukoy ay mga paratang, pasiya, o masasakit na bagay na itinakda laban kay Job.
- source_word: וְתוֹרִישֵׁנִי
  choice: ipinamamana mo sa akin
  rationale: Ipinahahayag ang causative na diwa ng Hiphil ng ירשׁ—ginagawang tumanggap o magmay-ari bilang mana—habang pinananatili ang metapora ng pamana.
- source_word: עֲוֺנוֹת
  choice: mga kasalanan
  rationale: Karaniwang salitang Filipino para sa moral na kamalian; maaaring saklawin ng konteksto ang kaakibat na sala o kaparusahan nang hindi iyon isinasara sa pangunahing teksto.
- source_word: נְעוּרָי
  choice: ng aking kabataan
  rationale: Tuwirang katumbas ng construct phrase na tumutukoy sa mga kasalanang nauugnay sa panahon ng kabataan ni Job.
theological_decisions:
- issue: Saklaw ng kahulugan ng עֲוֺנוֹת
  choice: mga kasalanan ng kabataan, na may posibleng pahiwatig ng sala o bunga ng mga ito
  alternative: ang sala o kaparusahan dahil sa mga kasalanan ng aking kabataan
  rationale: Maaaring tumukoy ang עָוֹן sa kasalanan, sala, o bunga/kaparusahan nito. Hindi nililinaw ng talata kung alin lamang ang ibig sabihin, kaya pinananatili ng pangunahing teksto ang malawak na moral na termino at inilalahad sa talababa ang ibang posibilidad.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang mga metaporang “sumusulat” at “ipinamamana” upang maingatan ang larawan at tunay na kalabuan ng Hebreo; ipinaliwanag sa mga talababa ang mas interpretatibong mga alternatibo.
