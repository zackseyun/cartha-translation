base_translation:
  language: en
  yaml_path: translation/ot/job/013/023.yaml
  text: How many are my iniquities and sins? Make my transgression and my sin known to me[a][b].
translation:
  language: tl
  text: Ilan ang aking mga kasamaan at mga kasalanan? Ipaalam mo sa akin ang aking pagsuway at ang aking kasalanan.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na, “Gaano kalaki ang aking mga kasamaan at mga kasalanan?” Ang salitang Hebreo ay maaaring magtanong tungkol sa lawak o tindi, hindi lamang sa bilang.
    reason: lexical_alternative
  - marker: b
    text: Ang “pagsuway” ay salin ng פֶּשַׁע (pesha), na maaari ring mangahulugang “paghihimagsik.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּמָּה לִי
  choice: Ilan ang aking
  rationale: Ang tanong ay maaaring tumukoy sa bilang o lawak. Pinananatili ng “Ilan ang aking” ang tuwirang diwang dami, na angkop sa kasunod na mga pangngalang maramihan.
- source_word: עֲוֺנוֹת
  choice: mga kasamaan
  rationale: Ipinahahayag nito ang mabigat na moral na diwa ng עָוֹן at nananatiling malinaw at natural sa makabagong Filipino.
- source_word: וְחַטָּאוֹת
  choice: at mga kasalanan
  rationale: Ang “mga kasalanan” ay tuwiran at malinaw na katumbas ng pangmaramihang חַטָּאת.
- source_word: פִּשְׁעִי
  choice: ang aking pagsuway
  rationale: Ang פֶּשַׁע ay sinadyang paglabag na maaaring may diwa ng paghihimagsik. Ang “pagsuway” ay natural at hindi labis na nagpapakitid sa kahulugan.
- source_word: וְחַטָּאתִי
  choice: at ang aking kasalanan
  rationale: Pinananatili ng “kasalanan” ang payak na kahulugan at ang ugnayang leksikal nito sa naunang חַטָּאוֹת.
- source_word: הֹדִיעֵנִי
  choice: Ipaalam mo sa akin
  rationale: 'Sinasalamin nito ang causative na anyo ng ידע: ipabatid o gawing alam sa nagsasalita.'
