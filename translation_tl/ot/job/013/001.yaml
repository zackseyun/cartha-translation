  text: הֶן כֹּ֭ל רָאֲתָ֣ה עֵינִ֑/י שָֽׁמְעָ֥ה אָ֝זְנִ֗/י וַ/תָּ֥בֶן לָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/013/001.yaml
  text: Look[a], my eye has seen all this; my ear has heard and understood it.
translation:
  language: tl
  text: Narito[a], nakita ng aking mata ang lahat ng ito; narinig ng aking tainga at naunawaan ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Tunay nga.” Ang Hebreong salita ay mariing panawag-pansin.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶן
  choice: Narito
  rationale: Isang mariing panawag-pansin ang הֶן. Ang “Narito” ay marangal at malinaw sa modernong Filipino, habang pinananatili ang deiktikong diin ng Hebreo.
- source_word: כֹּל
  choice: ang lahat ng ito
  rationale: Bagaman literal na “lahat,” tumutukoy ito sa kabuuan ng mga bagay na pinag-uusapan. Likas sa Filipino ang “ang lahat ng ito” bilang layon ng “nakita.”
- source_word: רָאֲתָה עֵינִי
  choice: nakita ng aking mata
  rationale: Pinanatili ang tahasang “aking mata” upang maipakita ang matingkad na estilo at paralelismo ng Hebreo.
- source_word: שָׁמְעָה אָזְנִי
  choice: narinig ng aking tainga
  rationale: Pinanatili ang “aking tainga” bilang katapat ng “aking mata” at bilang salamin ng singular na bahagi-ng-katawan sa Hebreo.
- source_word: וַתָּבֶן לָהּ
  choice: at naunawaan ito
  rationale: Ang בין ay nangangahulugang umunawa o kumilatis. Ang pambabaeng pandiwa ay likas na nagpapatuloy sa pinakamalapit na pambabaeng paksa, “aking tainga”; ang idiomatikong לָהּ ay ipinahayag nang natural bilang pag-unawa sa narinig.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang paralelismong “aking mata / aking tainga” ng Hebreo, ngunit isinalin nang idiomatiko ang mahirap na pariralang וַתָּבֶן לָהּ.
