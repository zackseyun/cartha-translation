lexical_decisions:
- source_word: אַךְ
  choice: lamang
  rationale: Ipinahahayag dito ng אַךְ ang isang paglilimita sa pakiusap ni Job; likas na naihahatid ito ng “lamang” sa Filipino.
- source_word: שְׁתַּיִם
  choice: dalawang bagay
  rationale: Walang tahasang pangngalan sa Hebreo, kaya idinagdag ang “bagay” upang maging malinaw at natural sa Filipino habang pinananatili ang bilang na dalawa.
- source_word: אַל תַּעַשׂ עִמָּדִי
  choice: huwag mong gawin sa akin
  rationale: Sa konteksto, hinihiling ni Job na huwag gawin sa kaniya ng Diyos ang dalawang kilos na babanggitin niya; malinaw at tuwiran ang pariralang ito.
- source_word: אָז
  choice: sa gayon
  rationale: Ipinakikita ng אָז ang magiging bunga kapag pinagbigyan ang pakiusap; ang “sa gayon” ay natural na naghahayag ng ugnayang iyon.
- source_word: מִפָּנֶיךָ
  choice: mula sa iyong harapan
  rationale: Pinananatili nito ang larawan ng “mukha/harap” sa Hebreo habang naihahatid din ang kahulugang pagiging nasa presensya ng Diyos.
- source_word: לֹא אֶסָּתֵר
  choice: hindi ako magtatago
  rationale: 'Ang Niphal ng סתר ay inuunawang reflexive o intransitive rito: hindi magtatago o uurong si Job kung ipagkakaloob ang kaniyang pakiusap.'
