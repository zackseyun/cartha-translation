  - severity: low
    issue: Medyo di-idiomatiko ang “magtatago mula sa iyong harapan.”
    rationale: Ang “magtatago sa harap mo” ay mas likas sa Tagalog at sapat na naghahatid ng Hebreong idiom na “mula sa iyong mukha/harap,” samantalang pinananatili ang metapora.
