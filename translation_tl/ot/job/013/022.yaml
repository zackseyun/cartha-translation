  yaml_path: translation/ot/job/013/022.yaml
  text: Then call[a], and I will answer; or let me speak, and you reply to me.
translation:
  language: tl
  text: Tumawag ka[a], at sasagot ako; o ako ang magsalita, at sagutin mo ako.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas literal, “At tumawag ka, at sasagot ako; o magsasalita ako, at sagutin mo ako.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּקְרָא
  choice: Kung gayon, tumawag ka
  rationale: Ang Qal imperative na 2ms ng קרא ay unang pagpipilian sa hamon ni Job sa Diyos. Ipinahihiwatig ng “Kung gayon” ang pagkakasunod at kondisyon sa konteksto, samantalang pinananatili ng “tumawag ka” ang tuwirang pautos.
- source_word: וְאָנֹכִי
  choice: at ... ako
  rationale: Ang malayang panghalip na 1cs ay nagbibigay-diin sa nagsasalita. Natural na naipahahayag ito sa Filipino sa lantad na “ako” pagkatapos ng pandiwang “sasagot.”
- source_word: אֶעֱנֶה
  choice: sasagot ako
  rationale: 'Ang Qal imperfect na 1cs ng ענה ay tumutukoy sa pagtugon. Ang anyong panghinaharap ay angkop sa kapalitang iminungkahi: kapag tumawag ang Diyos, sasagot si Job.'
- source_word: אוֹ
  choice: o
  rationale: Payak na pangatnig na nagbubukas ng ikalawang posibleng ayos ng pag-uusap.
- source_word: אֲדַבֵּר
  choice: magsasalita ako
  rationale: Ang Piel imperfect na 1cs ng דבר ay pormal na nagsasaad ng pagsasalita. Ang “magsasalita ako” ay tuwirang nagpapanatili sa anyo at malinaw na naghaharap ng alternatibong kaayusan.
- source_word: וַהֲשִׁיבֵנִי
  choice: at sagutin mo ako
  rationale: Ang Hiphil imperative na 2ms na may hulaping 1cs mula sa שוב ay nangangahulugang tumugon o sumagot sa nagsasalita. Ang “sagutin mo ako” ay natural at pinananatili ang pautos na anyo.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang tuwirang tono ng hamon at ang dalawang alternatibong ayos ng pag-uusap nang hindi nilulutas nang labis ang puwersa ng panandang וּ sa simula.
