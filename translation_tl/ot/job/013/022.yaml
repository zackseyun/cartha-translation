- from: Kung gayon, tumawag ka[a], at sasagot ako; o magsasalita ako, at sagutin mo ako.
  to: Tumawag ka[a], at sasagot ako; o ako ang magsalita, at sagutin mo ako.
  rationale: Inalis ang “Kung gayon” upang hindi magdagdag ng inferensiyang hindi tahasang nasa Hebreo. Ang “o ako ang magsalita” ay natural na Filipino para sa ikalawang alternatibong hamon at pinananatili ang bukas na puwersa ng imperfect na אֲדַבֵּר. Inayos ang talababa upang magbigay ng tunay na mas pormal na alternatibo.
