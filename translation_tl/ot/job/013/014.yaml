translation:
  language: tl
  text: Bakit ko ilalagay ang aking laman sa pagitan ng aking mga ngipin[a] at ilalagay ang aking buhay sa aking palad?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Bakit ko hahawakan ang aking laman gamit ang aking mga ngipin?” Mahirap at idyomatiko ang pananalitang Hebreo; ipinahihiwatig nito ang mapanganib na pagsuong na halos walang pakundangan sa sariling kaligtasan.
    reason: lexical_alternative
  - marker: b
    text: O, “ang aking kaluluwa.” Ang Hebreong nefesh ay maaaring mangahulugang “buhay,” “kaluluwa,” o “sarili”; dito, ang “buhay” ang higit na angkop sa diwa ng pagsuong sa panganib.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל מָה
  choice: Bakit ko
  rationale: Ipinahahayag nito ang retorikal na tanong tungkol sa dahilan o layunin; natural sa modernong Tagalog ang “Bakit ko.”
- source_word: אֶשָּׂא
  choice: dadalhin
  rationale: Ang נשׂא ay maaaring mangahulugang “buhatin” o “dalhin.” Pinananatili ng “dadalhin” ang kongkretong larawan at umaangkop sa tanong.
- source_word: בְשָׂרִי
  choice: ang aking laman
  rationale: Literal na “laman” ang בשר; pinananatili ito dahil matingkad at sadyang mahirap ang Hebreong larawan.
- source_word: בְשִׁנָּי
  choice: sa aking mga ngipin
  rationale: Isinasalin ang ב bilang “sa” upang mapanatili ang larawang ang laman ay nasa mga ngipin, habang kinikilala sa talababa na mahirap at idyomatiko ang parirala.
- source_word: וְנַפְשִׁי
  choice: ang aking buhay
  rationale: Maaaring tumukoy ang נפש sa buhay, kaluluwa, o sarili. Sa konteksto ng pagsuong sa panganib, “buhay” ang pinakamalinaw na katumbas.
- source_word: אָשִׂים
  choice: ilalagay
  rationale: Karaniwang kahulugan ng שׂים ang “ilagay,” at natural ito sa kasunod na larawan.
- source_word: בְכַפִּי
  choice: sa aking palad
  rationale: Mas tiyak na “palad” ang כף. Pinananatili nito ang pisikal na larawan at nauunawaan pa rin bilang paglalagay ng buhay sa panganib.
