  text: Will you terrify a windblown leaf[b][a], and pursue dry chaff?
translation:
  language: tl
  text: Sisindakin mo ba ang dahong tinatangay ng hangin[a], at hahabulin ang tuyong dayami[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “tatakutin” o “pagmalupitan.” Ang pandiwang Hebreo ay maaaring mangahulugang magdulot ng takot o sindak at, sa kontekstong ito, maaari ring magpahiwatig ng marahas na pagtrato.
    reason: lexical_alternative
  - marker: b
    text: Ang “dayami” ay maaari ring isaling “ipa” o “pinaggapasan.” Tumutukoy ang salitang Hebreo sa tuyong labi ng halaman, na nagdidiin sa kahinaan at kawalang-halaga nito sa paghahambing.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶעָלֶה
  choice: ang dahon
  rationale: Ang עָלֶה ay karaniwang nangangahulugang “dahon”; ang isahan ay nagpapanatili sa tiyak at marupok na larawang patula.
- source_word: נִדָּף
  choice: tinatangay ng hangin
  rationale: Ang anyo mula sa נדף ay naglalarawan ng bagay na itinutulak o ipinapadpad ng hangin. Likas at malinaw sa modernong Filipino ang “tinatangay ng hangin.”
- source_word: תַּעֲרוֹץ
  choice: sisindakin
  rationale: Ang ערץ ay maaaring tumukoy sa pagdudulot ng sindak o matinding takot. Pinananatili ng “sisindakin” ang lakas ng pandiwa at ang retorikal na hinaing.
- source_word: וְאֶת
  choice: at
  rationale: Ipinakikilala ng pang-ugnay ang ikalawang kapantay na larawan; hindi kailangang tahasang katawanin sa Filipino ang pananda ng layon.
- source_word: קַשׁ
  choice: dayami
  rationale: Ang קַשׁ ay maaaring mangahulugang dayami, pinaggapasan, o ipa. Ang “dayami” ay karaniwan at madaling maunawaang katawagan sa tuyong labi ng halaman, habang iniiwan sa talababa ang ibang posibilidad.
- source_word: יָבֵשׁ
  choice: tuyong
  rationale: Tuwirang inilalarawan ng יָבֵשׁ ang dayami bilang tuyo at lalo nitong itinatampok ang kahinaan nito.
- source_word: תִּרְדֹּף
  choice: hahabulin
  rationale: Ang רדף ay nangangahulugang humabol o tumugis. Ang “hahabulin” ay natural sa Filipino at nagpapanatili sa larawan ng agresibong paghabol.
