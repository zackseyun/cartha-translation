translation_notes:
  register: Makabago, dignificado, at patulang Filipino. Pinanatili ang iisang retorikal na tanong at ang magkat parallel na larawan ng isang dahong tangay ng hangin at tuyong dayami. Ginamit ang “mo ba” upang malinaw na maipahayag ang ikalawang panauhang retorikal nang hindi tinutukoy sa talata ang kausap.
