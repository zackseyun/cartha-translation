  text: Why do you hide your face and count me as your enemy?[a]
translation:
  language: tl
  text: Bakit mo ikinukubli ang iyong mukha at itinuturing akong kaaway mo?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ibinibilang akong isang kaaway sa iyo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לָמָה
  choice: Bakit
  rationale: Likas at tuwirang katumbas sa modernong Tagalog ng pananong tungkol sa dahilan.
- source_word: פָנֶיךָ
  choice: ang iyong mukha
  rationale: Pinananatili ang kongkretong biblikal na larawan ng mukha, na maaari ring magpahiwatig ng presensiya o pagsang-ayon.
- source_word: תַסְתִּיר
  choice: mo ikinukubli
  rationale: Tumpak na ipinapahayag ang Hiphil ng סתר na ‘itago/ikubli’; ang ‘ikinukubli’ ay marangal at natural sa kontekstong patula.
- source_word: וְתַחְשְׁבֵנִי
  choice: at itinuturing akong
  rationale: Ang חשב ay nangangahulugang isipin, ibilang, o ituring. Natural sa Tagalog ang ‘ituring na’ sa predikatibong kayarian.
- source_word: לְאוֹיֵב
  choice: kaaway
  rationale: 'Ang לְ ay nagmamarka rito ng predikatibong kaganapan: ituring ang nagsasalita bilang isang kaaway.'
- source_word: לָךְ
  choice: mo
  rationale: Bagaman pormal na ‘sa iyo/para sa iyo,’ relasyon o pag-aari ang diwa sa kayariang ito; malinaw itong naipapahayag ng ‘kaaway mo.’
theological_decisions:
- issue: Antropomorpikong pananalita tungkol sa Diyos sa ‘ikinukubli ang iyong mukha’
  choice: Panatilihin ang kongkretong pahayag na ‘ikinukubli ang iyong mukha.’
  alternative: ‘inilalayo mo ang iyong presensiya’ o ‘tumatalikod ka sa akin’
  rationale: Ang Hebreo ay gumagamit ng karaniwang biblikal na larawan ng mukha ng Diyos para sa kaniyang presensiya o pagsang-ayon. Ang pagpapanatili rito ay nag-iingat sa talinghaga at hindi tahimik na nagpapakahulugan nang higit sa teksto.
- issue: Ugnayan ng ‘kaaway’ at לָךְ
  choice: ‘kaaway mo’
  alternative: ‘isang kaaway sa iyo’
  rationale: Parehong posible ang diwang predikatibo at relasyonal. Ang ‘kaaway mo’ ang natural na Tagalog at malinaw na ipinahahayag na itinuturing ni Job na itinuring siya ng Diyos bilang kaaway.
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran, marangal, at patula. Pinanatili ang biblikal na idyomang ‘ikinukubli ang iyong mukha’; ginamit ang ‘itinuturing’ upang maging natural ang חשב sa Tagalog habang inilalagay sa talababa ang mas literal na alternatibong ‘ibinibilang.’
