base_translation:
  language: en
  yaml_path: translation/ot/job/013/013.yaml
  text: Be silent before me[a], and let me speak; then let come upon me what may.
translation:
  language: tl
  text: Tumahimik kayo at hayaan ninyo akong magsalita; pagkatapos, mangyari na sa akin ang anumang mangyari.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַחֲרִישׁוּ
  choice: Tumahimik kayo
  rationale: Ang Hiphil imperative na maramihan ay tuwirang utos sa mga kausap ni Job na tumigil sa pagsasalita; natural at mariin ang “Tumahimik kayo” sa modernong Filipino.
- source_word: מִמֶּנִּי
  choice: at hayaan ninyo akong
  rationale: Literal itong “mula sa akin,” ngunit kasama ng utos na tumahimik ay ipinahihiwatig nitong huwag siyang hadlangan at bigyan siyang magsalita. Isinasama ng salin ang relasyonal na diwa sa natural na Filipino.
- source_word: וַאֲדַבְּרָה אָנִי
  choice: magsalita
  rationale: Ang cohortative ay nagpapahayag ng pagnanais o matibay na pasiya ni Job. Ang “hayaan ninyo akong magsalita” ay nagpapanatili nito, habang ang “akong” ay nagbibigay ng diin ng hiwalay na panghalip na אָנִי.
- source_word: וְיַעֲבֹר עָלַי
  choice: pagkatapos, mangyari na sa akin
  rationale: Literal na inilalarawan ng עבר + על ang anumang daraan o darating kay Job. Sa Filipino, malinaw na naihahayag ng “mangyari na sa akin” ang mapagpasiyang pagtanggap sa anumang kahihinatnan at ang jussive na puwersa.
- source_word: מָה
  choice: ang anumang mangyari
  rationale: 'Indefinite ang מָה rito: anumang maaaring dumating o maganap. Ang pariralang ito ay natural sa Filipino at hindi tinutukoy kung ano ang kahihinatnan.'
theological_decisions: []
translation_notes:
  register: Makabago, dignificado, at tuwirang Filipino. Pinanatili ang mariing utos ni Job at ang kanyang pagtanggap sa hindi tiyak na kahihinatnan, nang hindi ginagawang mas tiyak ang sadyang malabong מָה.
