  terminology: Wasto at magkakatugma ang “Diyos,” “kawalang-katarungan,” at “panlilinlang.” Hindi ipinapasok ng teksto ang isang doktrinal na pagbasa; ang mas tiyak na ideyang pagtatanggol sa Diyos ay wastong inilalagay lamang sa talababa bilang kontekstuwal na pagpapaliwanag.
