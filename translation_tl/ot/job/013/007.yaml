  yaml_path: translation/ot/job/013/007.yaml
  text: Will you speak injustice for God[a], and deceit for him?
translation:
  language: tl
  text: Magsasalita ba kayo ng kawalang-katarungan para sa Diyos[a], at ng panlilinlang para sa kanya?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “upang ipagtanggol ang Diyos” o “sa Diyos”; gayundin, maaaring unawain ang “para sa kanya” sa ikalawang bahagi bilang “upang ipagtanggol siya” o “sa kanya.” Maaaring unawain sa higit sa isang paraan ang pang-ukol sa Hebreo, bagaman ipinahihiwatig ng konteksto na nagsasalita sila upang ipagtanggol ang Diyos.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלְאֵל
  choice: para sa Diyos
  rationale: Maaaring ipahiwatig ng ל ang kapakinabangan, kaugnayan, o pagkatawan. Sa konteksto, sinasaway ni Job ang mga kaibigan niya dahil nagsasalita sila nang mali upang ipagtanggol ang Diyos. Pinananatili rin ng “para sa Diyos” ang ikli at tunay na kalabuan ng Hebreo.
- source_word: תְּדַבְּרוּ
  choice: Magsasalita ba kayo
  rationale: Ang imperpektibo sa retorikal na tanong ay likas na naihahayag sa Filipino sa anyong “Magsasalita ba kayo,” na nagpapanatili sa hamon at pagsaway.
- source_word: עַוְלָה
  choice: kawalang-katarungan
  rationale: Saklaw ng salita ang kawalang-katarungan, kamalian, at kasamaan. Ang “kawalang-katarungan” ay nagpapanatili sa etikal at panghukumang bigat nito at hindi inuulit ang diwa ng kasunod na “panlilinlang.”
- source_word: וְלוֹ
  choice: para sa kanya
  rationale: Tumutukoy ang panghalip sa Diyos at kaagapay ng “para sa Diyos.” Pinananatili ng salin ang posibilidad na ang pagsasalita ay para sa kapakanan o pagtatanggol niya.
- source_word: רְמִיָּה
  choice: panlilinlang
  rationale: Ang salita ay tumutukoy sa pandaraya o mapanlinlang na pananalita. Ang “panlilinlang” ay angkop sa abstraktong pangngalan at mas malawak kaysa “kasinungalingan.”
theological_decisions:
- issue: Kung inaakusahan ni Job ang mga kaibigan niya na nagsasalita upang ipagtanggol ang Diyos o nagsasalita lamang sa Diyos
  choice: Inilalarawan ni Job na nagsasalita sila nang di-makatarungan para sa Diyos, malamang bilang pagtatanggol sa kanya
  alternative: Nagsasalita sila ng kawalang-katarungan sa Diyos
  rationale: Ipinahihiwatig ng Job 13:4 at 13:8 na gumaganap silang mga tagapagtanggol na kumakampi sa Diyos. Gayunman, hindi ganap na nilulutas ng salin ang saklaw ng pang-ukol, kaya ipinaliliwanag sa talababa ang ibang posibilidad.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Pinanatili ang retorikal na tanong, ang magkatugmang estruktura ng dalawang bahagi, at ang abstraktong bigat ng “kawalang-katarungan” at “panlilinlang.”
