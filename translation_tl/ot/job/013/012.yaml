translation:
  language: tl
  text: Ang inyong mga kasabihan ay mga salawikain ng abo[a]; ang inyong mga tanggulan ay mga tanggulang yari sa luwad.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Ang inyong mga alaala ay mga salawikain ng abo; ang inyong mga likod ay mga likod na luwad.” Siksik ang Hebreo at mahirap tiyakin ang huling parirala; ang “mga tanggulan” ay pagbasa ayon sa konteksto sa inuulit na pangngalan.'
    reason: alternative_reading
lexical_decisions:
- source_word: זִכְרֹנֵיכֶם
  choice: inyong mga kasabihan
  rationale: Ang salita ay karaniwang kaugnay ng pag-alaala o alaala, ngunit sa konteksto ay tumutukoy sa mga pahayag na inihaharap ng mga kaibigan ni Job bilang karunungang dapat tandaan. Likas at malinaw sa modernong Tagalog ang “mga kasabihan” nang hindi labis na nililinaw ang talinghaga.
- source_word: מִשְׁלֵי
  choice: mga salawikain ng
  rationale: Ang מָשָׁל ay maaaring mangahulugang salawikain, kasabihan, o paghahambing. Pinananatili ng “mga salawikain ng abo” ang siksik na nominal na talinghaga at ang himig ng panitikang karunungan.
- source_word: אֵפֶר
  choice: abo
  rationale: “Abo” ang karaniwang kahulugan at angkop sa larawan ng kawalang-halaga at karupukan.
- source_word: לְגַבֵּי
  choice: ay
  rationale: Napakasiksik at mahirap ang pariralang Hebreo. Ginamit ang pangawing na “ay” upang maipahayag sa natural na Tagalog ang paghahambing o pagtutumbas nang hindi pinalalawak ang diwa.
- source_word: חֹמֶר
  choice: luwad
  rationale: Ang חֹמֶר ay tumutukoy sa luwad, putik, o materyal na parang argamasa. Ang “luwad” ay malinaw at pinananatili ang larawan ng marupok na pananggalang.
- source_word: גַּבֵּיכֶם
  choice: inyong mga tanggulan
  rationale: Bagaman literal na maaaring tumukoy ang גַּב sa likod o nakaangat na ibabaw, sa kontekstong ito ay malamang na matalinghagang tumutukoy sa mga pananggalang o posisyong pandepensa. Ang “mga tanggulan” ay angkop sa dignidad ng tula at sa paralelismo.
