translation_notes:
  register: Makabagong Filipino na may dignidad at maikling anyong patula. Pinanatili ang magkatambal na paghahambing at ang progresibong pagkasira. Ginamit ang “siya” ayon sa tekstong Hebreo, na maaaring tumukoy sa nagsasalita ayon sa konteksto; hindi tahasang nilutas ang paglipat ng panauhan.
