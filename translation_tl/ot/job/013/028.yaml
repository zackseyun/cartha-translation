translation:
  language: tl
  text: At siya'y unti-unting nasisira gaya ng kabulukan, gaya ng damit na kinain ng gamugamo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “At siya ay naaagnas gaya ng kabulukan, gaya ng damit na kinain ng isang gamugamo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוּא
  choice: Samantalang siya'y
  rationale: Ipinagpapatuloy ng panghalip ang tinutukoy sa konteksto; natural na inuugnay ng “samantalang” ang larawang ito sa naunang pahayag, habang pinananatili sa talababa ang mas literal na “at siya.”
- source_word: כְּרָקָב
  choice: gaya ng kabulukan
  rationale: Ang רָקָב ay tumutukoy sa kabulukan o pagkabulok. Pinananatili ng abstraktong “kabulukan” ang siksik at bahagyang di-karaniwang larawan ng Hebreo.
- source_word: יִבְלֶה
  choice: nalulusaw na
  rationale: Ang בלה ay nangangahulugang maubos, masira, o maluma. Sa larawan ng kabulukan at sa konteksto ng naghihinang tao, ang “nalulusaw” ay nagpapahayag ng unti-unting pagkasira nang natural sa Filipino.
- source_word: כְּבֶגֶד
  choice: gaya ng damit
  rationale: Ang בֶּגֶד ay pangkalahatang tawag sa kasuutan. Ang “damit” ay karaniwan, malinaw, at pinananatili ang isahan.
- source_word: אֲכָלוֹ
  choice: na kinain ng
  rationale: Ang anyo mula sa אכל na may hulaping tumutukoy sa damit ay literal na naglalarawan dito bilang kinain o inubos; likas sa Filipino ang pasibong “kinain ng.”
- source_word: עָשׁ
  choice: bukbok
  rationale: Ang עָשׁ ay gamugamong sumisira sa damit. Sa modernong Filipino, ang “bukbok” ay madaling maunawaang katawagan sa insektong ngumangatngat at sumisira ng tela, kahit mas malawak ang gamit nito kaysa sa tiyak na cloth moth.
