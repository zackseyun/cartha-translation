  yaml_path: translation/ot/job/013/002.yaml
  text: What you know[a], I also know; I am not inferior to you.
translation:
  language: tl
  text: Kung ano ang nalalaman ninyo, alam ko rin; hindi ako mas mababa sa inyo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, hindi ako nahuhuli sa inyo.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּדַעְתְּכֶם
  choice: Kung ano ang nalalaman ninyo
  rationale: Ipinahahayag ng כְּ kasama ng דַּעַת at hulaping pangmaramihang ikalawang panauhan ang paghahambing ng kaalaman ni Job sa kaalaman ng kaniyang mga kausap. Likas sa modernong Tagalog ang “kung ano ang nalalaman ninyo” at malinaw itong tumutugma sa kasunod na “alam ko rin.”
- source_word: יָדַעְתִּי
  choice: alam ko
  rationale: 'Bagaman anyong ganap ang pandiwa sa Hebreo, statibo at pangkasalukuyan ang diwa nito sa paghahambing na ito: taglay rin ni Job ang kaalamang tinutukoy.'
- source_word: גַם אָנִי
  choice: ako rin
  rationale: Binibigyang-diin ng parirala na taglay rin ni Job ang kaalamang taglay ng kaniyang mga kausap. Ang “ako rin” ang natural at tuwirang katumbas sa Tagalog.
- source_word: לֹא נֹפֵל אָנֹכִי מִכֶּם
  choice: hindi ako mas mababa sa inyo
  rationale: Ang participleng נֹפֵל na may מִן ay nagpapahayag ng pagiging mas mababa o pagkukulang kung ihahambing sa iba. Pinananatili ng salin ang pangkalahatang paghahambing nang hindi tahasang nililimitahan iyon sa talino lamang.
- source_word: אָנֹכִי
  choice: ako
  rationale: Ang hiwalay na panghalip ay nagbibigay-diin sa sarili ni Job. Sapat na naihahatid ito ng tahasang “ako” sa sugnay.
