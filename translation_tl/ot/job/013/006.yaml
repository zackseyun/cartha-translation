translation:
  language: tl
  text: Pakiusap, pakinggan ninyo ang aking pangangatwiran[a], at makinig kayo sa mga pagtatalo ng aking mga labi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “aking pagsaway” o “aking katuwiran”; ang salitang Hebreo ay maaaring tumukoy sa pagtutuwid, pagsaway, o isang makatuwirang pangangatwiran na inihaharap.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “mga ipinaglalaban ng aking mga labi” o “mga pakiusap ng aking mga labi”; ang pananalitang Hebreo ay maaaring tumukoy sa mga pagtatalo, pagtatalong usapin, o mga pahayag na inihaharap sa isang kaso.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ נָא
  choice: Pakinggan ninyo, pakiusap
  rationale: Ang maramihang pautos na שִׁמְעוּ ay tuwirang panawagan sa mga kausap ni Job, at ang נָא ay nagpapalumanay dito bilang pakiusap.
- source_word: תוֹכַחְתִּי
  choice: ang aking pangangatwiran
  rationale: Maaaring tumukoy ang תוכחת sa pagsaway, pagtutuwid, o isang katuwirang inihaharap. Sa kontekstong tila paglilitis, malinaw at likas ang “pangangatwiran” habang hindi ito nililimitahan sa moral na pagsaway.
- source_word: וְרִבוֹת
  choice: mga paglalahad
  rationale: Ang ריבות ay may diwa ng pagtatalo, usapin, o pagtatanggol sa isang kaso. Ipinahihiwatig ng “mga paglalahad” ang mga katuwirang binibigkas ni Job nang hindi nagpapasok ng labis na teknikal na terminong legal.
- source_word: שְׂפָתַי
  choice: ng aking mga labi
  rationale: Pinananatili ang kongkretong larawang Hebreo na “aking mga labi” sa halip na gawing payak na “aking mga salita.”
- source_word: הַקְשִׁיבוּ
  choice: makinig kayo
  rationale: Ipinahahayag ng pandiwa ang masusing pagbibigay-pansin at pinananatili ang paralelismo sa “Pakinggan ninyo.”
