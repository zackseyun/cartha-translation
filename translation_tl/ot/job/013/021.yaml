  yaml_path: translation/ot/job/013/021.yaml
  text: Withdraw your hand far from me[b][a], and do not let your dread terrify me.
translation:
  language: tl
  text: Alisin mo sa ibabaw ko ang iyong kamay,[a] at huwag akong sindakin ng iyong sindak.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Ilayo mo sa akin ang iyong kamay.”
    reason: lexical_alternative
  - marker: b
    text: O “iyong kilabot.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּפְּךָ
  choice: iyong kamay
  rationale: Bagaman ang כַּף ay maaaring tumukoy sa palad, ang “kamay” ang likas na katumbas sa Filipino at pinananatili nito ang kongkretong larawan ng pagkilos o pagdiin ng Diyos.
- source_word: מֵעָלַי הַרְחַק
  choice: Ilayo mo sa akin
  rationale: Ang Hiphil na pautos ng רחק ay nangangahulugang “gawing malayo” o “ilayo,” at ang מֵעָלַי ay nagpapahiwatig ng pag-aalis mula sa ibabaw o pagkakapatong kay Job. Likas sa Filipino ang “ilayo mo sa akin” nang hindi nawawala ang pautos at larawan.
- source_word: אֵמָתְךָ
  choice: iyong kilabot
  rationale: Ang אֵימָה ay matinding takot, sindak, o kilabot. Ang “iyong kilabot” ay nagpapanatili sa ikalawang panauhang panlapi at sa nakatatakot na epekto na iniuugnay sa Diyos, nang hindi ito ginagawang simpleng pansariling damdamin lamang ni Job.
- source_word: אַל תְּבַעֲתַנִּי
  choice: huwag akong sindakin
  rationale: Ang אַל ay pagbabawal, at ang בעת ay “manindak, manakot, o manggulat.” Ang “huwag akong sindakin” ay malinaw, tuwiran, at angkop sa masidhing pananalita ni Job.
theological_decisions:
- issue: Antropomorpikong paglalarawan sa “iyong kamay”
  choice: Panatilihin nang literal ang “iyong kamay.”
  alternative: iyong kapangyarihan; iyong pagpapahirap
  rationale: Kongkretong larawan ng kamay ang ginamit sa Hebreo. Ang literal na salin ay nagpapanatili sa talinghaga at hindi nagpapasiya kung kapangyarihan, pagpapahirap, paghatol, o disiplina ang tiyak na tinutukoy.
- issue: Kaugnayan ng “iyong kilabot” sa Diyos
  choice: Panatilihin ang anyong “iyong kilabot.”
  alternative: takot ko sa iyo; sindak na dulot mo
  rationale: Maaaring ipahiwatig ng parirala ang nakatatakot na presensiya o epektong nagmumula sa Diyos. Hindi ito nilinaw nang higit sa Hebreo upang mapanatili ang tunay na saklaw at tensiyon ng pahayag.
translation_notes:
  register: Makabago, tuwiran, at marangal na Filipino. Ginamit ang “ilayo” at “sindakin” bilang karaniwang mauunawaang mga salita, habang ang “kilabot” ay nagpapanatili sa matinding ποιetikong bigat ng talata.
