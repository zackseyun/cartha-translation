  yaml_path: translation/ot/job/013/009.yaml
  text: Will it be good when he examines you? Or will you mock him as one mocks a man?[a][b]
translation:
  language: tl
  text: Mabuti ba sa inyo kapag siyasatin niya kayo? O gaya ba ng panlilinlang sa isang tao, lilinlangin ninyo siya?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “lilibakin” o “paglalaruan”; ang pandiwang Hebreo ay maaaring mangahulugang manlinlang, manlibak, o gawing katatawanan ang isang tao.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “isang tao”; maaari rin itong magbigay-diin sa isang mortal na tao.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲטוֹב
  choice: Mabuti kaya ang kalalabasan
  rationale: Ang הֲ ay naghuhudyat ng retorikal na tanong, at ang טוֹב ay tumutukoy rito sa magiging mabuting resulta o kapakanan sa harap ng pagsusuri ng Diyos. Ginagawang malinaw ng 'ang kalalabasan' ang pasulong na puwersa nang hindi binabago ang diwa.
- source_word: כִּי
  choice: kapag
  rationale: Ipinakikilala ng כִּי ang kalagayang pangyayari kung kailan masusubok kung magiging mabuti ang resulta; natural sa modernong Tagalog ang 'kapag'.
- source_word: יַחְקֹר
  choice: sinuri
  rationale: Ang חקר ay masusing pagsisiyasat o pagsusuri. Ang 'sinuri' ay natural at nagpapanatili sa diwa ng masusing pagbusisi.
- source_word: אֶתְכֶם
  choice: kayo
  rationale: Ikalawang panauhang panlalaking maramihan ang hulapi; malinaw na maramihan ang 'kayo' sa Tagalog.
- source_word: אִם
  choice: O
  rationale: Sa magkatambal na mga retorikal na tanong, ipinakikilala ng אִם ang ikalawang posibilidad; pinakamadulas sa Tagalog ang 'O'.
- source_word: כְּהָתֵל
  choice: gaya ng panlilinlang
  rationale: Ang התל ay maaaring mangahulugang manlinlang, manlibak, o paglaruan ang isang tao. Pinili ang 'panlilinlang' dahil malinaw nitong ipinahihiwatig ang maling pag-aakalang maaaring tratuhin ang Diyos na gaya ng isang taong kayang dayain, habang itinatala sa talababa ang ibang lehitimong kahulugan.
- source_word: בֶּאֱנוֹשׁ
  choice: sa isang tao
  rationale: Ang אֱנוֹשׁ ay tumutukoy sa taong marupok o mortal. Natural ang 'isang tao' sa pangungusap, at nililinaw ng talababa ang pagkakaiba ng karaniwang mortal na tao at ng Diyos.
- source_word: תְּהָתֵלּוּ בוֹ
  choice: malilinlang ba ninyo siya
  rationale: Ang pandiwa ay ikalawang panauhang maramihan at ang בּוֹ ay tumutukoy sa pinatutungkulan ng kilos. Pinananatili ng tanong ang hamon ni Job kung magagawa ba nilang dayain ang Diyos.
theological_decisions:
- issue: Tinutukoy ng mga panghalip na ikatlong panauhang isahan
  choice: Ang mga panghalip ay tumutukoy sa Diyos, ngunit nananatiling panghalip sa salin.
  alternative: Isang hindi tinukoy na tagasuri o hukom.
  rationale: Sa Job 13:7–11, binabalaan ni Job ang mga kasamahan niyang nagsasalita nang may pagkiling para sa Diyos na sila ay sisiyasatin niya. Hindi kailangang ipalit ang pangalang 'Diyos' sa mga panghalip sapagkat malinaw ito sa konteksto at mas tapat sa anyo ng Hebreo.
translation_notes:
  register: Makabago, tuwiran, at marangal na Tagalog. Ginamit ang 'Mabuti kaya ang kalalabasan' upang maging natural ang eliptikong retorikal na tanong, at ang 'ninyo/kayo' upang mapanatili ang maramihang kausap. Ang dalawang talababa ay kapuwa may katugmang marker sa pangunahing teksto.
