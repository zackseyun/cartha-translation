    rationale: Ang pahayag na “hindi maaaring tratuhin ang Diyos na gaya lamang ng tao” ay isang contextual na pagpapaliwanag, hindi lexical alternative. Sapat na itala ang literal na “isang tao” at ang posibleng diin sa mortalidad.
