  text: But I would speak to the Almighty[a], and I desire to argue with God.
translation:
  language: tl
  text: Ngunit ako’y magsasalita sa Makapangyarihan-sa-lahat, at nais kong makipatuwiran[a] sa Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “makipagtalo sa Diyos” o “iharap ang aking usapin sa Diyos.” Ang pandiwang Hebreo ay maaaring mangahulugang mangatuwiran, makipagtalo, magpatunay, o maglahad ng usapin sa paraang panghukuman.
    reason: lexical_alternative
lexical_decisions:
- source_word: אוּלָם
  choice: Ngunit
  rationale: Nagpapahayag ng mariing pagsalungat sa naunang pagsaway ni Job sa kanyang mga kaibigan.
- source_word: אֲנִי
  choice: ako
  rationale: Pinananatili ang hayag at madiing panghalip ng Hebreo; ang ayos na “Ngunit ako” ay likas at may diin sa Tagalog.
- source_word: אֶל שַׁדַּי אֲדַבֵּר
  choice: sa Makapangyarihan-sa-lahat ay magsasalita
  rationale: Ang “sa” ay naghahayag ng tuwirang pakikipag-usap, at ang “magsasalita” ay angkop sa intensiyon o pasiya ng imperfect. Isinalin ang titulong שַׁדַּי sa karaniwang kahulugang “Makapangyarihan-sa-lahat.”
- source_word: וְהוֹכֵחַ אֶל אֵל
  choice: makipatuwiran sa Diyos
  rationale: Ang Hiphil ng יכח ay maaaring tumukoy sa pakikipagtalo, pangangatwiran, o paglalahad ng usapin sa paraang panghukuman. Ang “makipatuwiran” ay natural at marangal habang hindi tahasang nagdaragdag ng “aking usapin,” na wala sa teksto.
- source_word: אֶחְפָּץ
  choice: nais ko
  rationale: Malinaw na naghahayag ng matibay na kagustuhan o layunin nang hindi ipinahihiwatig na kinagigiliwan ni Job ang pakikipagtalo.
theological_decisions:
- issue: Magkaibang katawagang שַׁדַּי at אֵל para sa Diyos
  choice: “Makapangyarihan-sa-lahat” at “Diyos”
  alternative: “Shaddai” at “Diyos,” o pag-iisang katawagan sa dalawa
  rationale: Pinananatili ang pagkakaiba ng dalawang katawagang Hebreo sa magkatulad na mga sugnay, habang isinasalin ang titulo sa halip na baybayin lamang ito.
- issue: Forensikong diwa ng וְהוֹכֵחַ
  choice: “makipatuwiran sa Diyos” na may talababa
  alternative: “makipagtalo sa Diyos” o “iharap ang aking usapin sa Diyos”
  rationale: Pinananatili ng pangunahing teksto ang lawak at tensiyon ng pandiwa; inilalahad sa talababa ang mas mariin at panghukuman nitong mga posibleng diwa nang hindi tahimik na pumipili ng isa lamang.
translation_notes:
  register: Makabago ngunit marangal na Tagalog. Ginamit ang inversion sa unang sugnay upang mapanatili ang diin sa “ako” at sa Diyos bilang tuwirang kinakausap. Ang “makipatuwiran” ay madaling maunawaan ngunit hindi nagpapahina sa hamon ng pananalita ni Job, na nililinaw pa ng talababa.
