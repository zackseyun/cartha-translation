  text: If only you would keep completely silent[a], and it would count as wisdom for you.
translation:
  language: tl
  text: Kung mananahimik lamang sana kayo nang lubusan, magiging karunungan iyon para sa inyo[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Sana’y manahimik kayo nang lubusan; magiging karunungan iyon para sa inyo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי יִתֵּן
  choice: Kung … na lamang sana
  rationale: Ang idyomang Hebreo ay nagpapahayag ng matinding hangarin, hindi literal na tanong. Likas sa modernong Tagalog ang “Kung … na lamang sana” para sa ganitong diwa.
- source_word: הַחֲרֵשׁ תַּחֲרִישׁוּן
  choice: lubusan … kayong manahimik
  rationale: Ang infinitive absolute na kasunod ng pandiwang mula sa parehong ugat ay nagbibigay-diin sa pananahimik; ipinahahayag ito ng “lubusan” nang malinaw at natural.
- source_word: וּתְהִי לָכֶם לְחָכְמָה
  choice: iyon na ang magiging karunungan ninyo
  rationale: Ang “iyon” ay tumutukoy sa kanilang lubusang pananahimik. Pinananatili ng salin ang tuwirang pag-uugnay nito sa karunungan, habang ang “ninyo” ay natural na nagsasaad ng kaugnayang ipinapahayag ng לָכֶם.
