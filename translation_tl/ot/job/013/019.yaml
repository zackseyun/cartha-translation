  yaml_path: translation/ot/job/013/019.yaml
  text: Who is it that will contend with me? For then I would be silent and die[a].
translation:
  language: tl
  text: Sino ang makikipagtalo sa akin? Kung gayon, tatahimik ako at mamamatay.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Sapagkat ngayon ay tatahimik ako at mamamatay.” Karaniwang nangangahulugang “ngayon” ang salitang Hebreo, ngunit nauunawaan ito ng marami rito bilang “kung gayon” ayon sa argumento ni Job.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי הוּא
  choice: Sino
  rationale: Sa modernong Tagalog, likas nang naipahihiwatig ng “Sino” ang mariing retorikal na tanong; magiging mabigat at di-likas ang literal na “Sino siya.”
- source_word: יָרִיב
  choice: makikipagtalo
  rationale: Ipinapahayag nito ang pakikipagtunggali sa argumento o usapin at pinananatili ang posibleng legal na himig ng ריב nang hindi ito nililimitahan sa isang pormal na paglilitis.
- source_word: עִמָּדִי
  choice: sa akin
  rationale: Likas na katambal ito ng “makikipagtalo” sa Tagalog at malinaw na naghahatid ng adversaryal na pakikiharap.
- source_word: כִּי
  choice: Kung gayon
  rationale: 'Kasama ng עַתָּה, inuunawa ito bilang pagpapahayag ng bunga ng hamon ni Job: kung may makikipagtalo sa kaniya, tatahimik siya at mamamatay.'
- source_word: עַתָּה
  choice: gayon
  rationale: Bagaman karaniwang nangangahulugang “ngayon,” maaari itong maunawaan dito bilang “kung gayon” ayon sa daloy ng argumento; pinananatili sa talababa ang literal na alternatibo.
- source_word: אַחֲרִישׁ
  choice: tatahimik ako
  rationale: Natural at tuwirang salin ito ng pagiging o pananatiling tahimik, na angkop sa ipinahihiwatig na bunga sa konteksto.
- source_word: וְאֶגְוָע
  choice: at mamamatay
  rationale: Malinaw at marangal na salin ito ng pandiwang tumutukoy sa pagpanaw o pagkamatay, habang pinananatili ang mariing bagsak ng pahayag.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “makikipagtalo” upang mapanatili ang adversaryal at posibleng legal na himig nang hindi nagiging teknikal; inilagay sa talababa ang tunay na kalabuan ng עַתָּה.
