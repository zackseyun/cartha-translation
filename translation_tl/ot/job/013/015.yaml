  text: Patayin man niya ako[a], hindi ako maghihintay; ngunit ipagtatanggol ko sa harap niya ang aking mga ginagawa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tradisyonal na salin: “Patayin man niya ako, gayunma’y sa kanya ako aasa.” Batay ito sa alternatibong pagbasa ng Hebreo.'
    reason: alternative_reading
lexical_decisions:
- source_word: הֵן
  choice: man
  rationale: Sa kayariang “Patayin man niya ako,” likas na naipahahayag sa modernong Tagalog ang concessive na diwa ng הֵן sa kontekstong ito.
- source_word: יִקְטְלֵנִי
  choice: Patayin niya ako
  rationale: Tuwirang ipinapahayag ang kahulugang ‘patayin’ ng קטל, habang nananatiling marangal at mabigat ang tono.
- source_word: לֹא אֲיַחֵל
  choice: hindi na ako aasa
  rationale: Sinusunod ang negasyong לֹא ng tekstong Masoretiko. Ang ‘aasa’ ang natural na salin ng יחל dito at hindi ipinapasok sa pangunahing teksto ang alternatibong pagbasa na לוֹ, ‘sa kanya.’
- source_word: אַךְ
  choice: gayunman
  rationale: 'Malinaw na minamarkahan ang pagsalungat: kahit wala nang pag-asa, ihaharap pa rin ni Job ang kanyang panig.'
- source_word: דְּרָכַי
  choice: ang aking mga lakad
  rationale: Pinananatili ang konkretong talinghaga ng Hebreong ‘mga daan/lakad,’ na tumutukoy sa asal at pamumuhay ni Job.
- source_word: אֶל־פָּנָיו
  choice: sa harap niya
  rationale: Likas at tapat na katumbas ng ‘sa kanyang mukha/presensiya,’ na nagpapahiwatig ng tuwirang pagharap.
- source_word: אוֹכִיחַ
  choice: ipagtatanggol ko
  rationale: Sa legal at mapagtalong konteksto ng Job, ipinahahayag nito ang paghaharap at pagtatanggol ng sariling usapin o pamumuhay.
theological_decisions:
- issue: Kung susundin ang tekstong Masoretiko na may לֹא (‘hindi’) o ang tradisyonal na pagbasa na לוֹ (‘sa kanya’).
  choice: “hindi na ako aasa” ayon sa nakasulat na tekstong Masoretiko
  alternative: “gayunma’y sa kanya ako aasa” ayon sa tradisyonal na alternatibong pagbasa
  rationale: Ang ibinigay na Hebreo ay may לֹא, ‘hindi,’ kaya ito ang sinusunod sa pangunahing teksto. Mahalaga at matagal nang ginagamit ang alternatibong pagbasa, kaya inilalahad ito sa talababa nang hindi pinapawi ang tunay na suliraning tekstuwal.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “Patayin man” para sa likas na concessive na ayos, at pinanatili ang “mga lakad” upang hindi mawala ang Hebreong larawan at ang bahagyang kaluwagan ng kahulugan nito.
