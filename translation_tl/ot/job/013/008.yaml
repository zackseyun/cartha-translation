  text: Will you show partiality for him? Will you contend for God?[a][b]
translation:
  language: tl
  text: Magpapakita ba kayo ng pagtatangi sa kanya?[a] Makikipagtalo ba kayo para sa Diyos?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal na, “Itataas ba ninyo ang kanyang mukha?”—isang idyomang Hebreo na nangangahulugang magpakita ng pagtatangi o pagkiling sa isang tao.
    reason: lexical_alternative
  - marker: b
    text: O “Ipagtatanggol ba ninyo ang Diyos?”
    reason: alternative_reading
lexical_decisions:
- source_word: הֲפָנָיו תִּשָּׂאוּן
  choice: Kakampihan ba ninyo siya
  rationale: Ang literal na larawan ay ‘itataas ba ninyo ang kanyang mukha,’ ngunit ang pariralang Hebreo ay isang idyoma para sa pagkiling o pagpapakita ng pagtatangi. Ang ‘kakampihan’ ay natural sa modernong Filipino at akma sa konteksto ng pagtatalo.
- source_word: אִם
  choice: ikalawang tanong na walang tahasang katumbas na salita
  rationale: Ipinakikilala nito rito ang ikalawang retorikal na tanong. Naipahahayag nang natural sa Filipino ang puwersa nito sa pamamagitan ng hiwalay na tanong; maaari rin itong unawain bilang ‘o.’
- source_word: לָאֵל
  choice: para sa Diyos
  rationale: Ang ל ay nagpapahiwatig ng panig o kapakanan ng isang tao sa kontekstong forensic, at ang אֵל ay tumutukoy sa Diyos.
- source_word: תְּרִיבוּן
  choice: Makikipagtalo ba kayo
  rationale: Ang ריב ay may diwang legal o adversarial na pakikipagtalo. Pinananatili ng ‘makikipagtalo’ ang lawak nito nang hindi nililimitahan sa pormal na pagtatanggol sa hukuman.
theological_decisions:
- issue: Kung inaakusahan ni Job ang kanyang mga kaibigan ng may-kinikilingang pagtatanggol sa Diyos
  choice: Dalawang retorikal na tanong na tumutuligsa sa pagkampi nila sa Diyos at pakikipagtalo para sa kanya
  alternative: Maaaring isalin nang mas literal ang una bilang ‘Itataas ba ninyo ang kanyang mukha?’ at ang ikalawa bilang ‘Ipagtatanggol ba ninyo ang Diyos?’
  rationale: Ipinahihiwatig ng idyomang Hebreo at ng konteksto na hindi lamang nila sinisikap ipaliwanag ang Diyos kundi kumikiling sila sa kanya sa kanilang pakikipagtalo kay Job. Hindi nito hinahatulan ang lahat ng pagtatanggol sa Diyos; ang tinutuligsa ay ang may-pagtatanging pangangatwiran.
translation_notes:
  register: Modernong Filipino na tuwiran ngunit marangal. Ginamit ang ‘ninyo’ dahil maramihan ang mga pandiwa sa Hebreo. Ang ‘kakampihan’ ay mas likas kaysa ‘magpapakita ng pagtatangi para sa kanya,’ samantalang nililinaw ng talababa ang literal na idyoma.
