  text: 'Makinig kayong mabuti sa aking salita,

    at pakinggan ninyo ang aking pahayag.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שִׁמְעוּ שָׁמוֹעַ
  choice: Makinig kayong mabuti
  rationale: Ang pandiwang may kasamang infinitive absolute ay nagbibigay-diin sa utos. Likas sa modernong Tagalog ang “makinig kayong mabuti” at malinaw nitong naihahatid ang mariing panawagan.
- source_word: מִלָּתִי
  choice: aking salita
  rationale: Ang מִלָּה ay maaaring tumukoy sa salita o pananalita. Pinananatili ng “aking salita” ang anyong isahan at ang tuwiran at maringal na himig ng pakiusap ni Job.
- source_word: וַאֲחֲוָתִי
  choice: aking pahayag
  rationale: Ang pangngalan ay tumutukoy sa bagay na ipinahahayag o inilalahad. Ang “aking pahayag” ay natural at sapat na pormal, nang hindi nililimitahan ang kahulugan sa isang interpretatibong “paliwanag.”
- source_word: בְּאָזְנֵיכֶם
  choice: pakinggan ninyo
  rationale: Literal itong “sa inyong mga tainga,” ngunit ang gayong anyo ay hindi likas sa kasalukuyang Tagalog. Ang pag-uulit ng “pakinggan ninyo” ay naghahatid ng kahulugang papasukin nila sa kanilang pandinig ang pahayag at pinananatili ang paralelismo.
