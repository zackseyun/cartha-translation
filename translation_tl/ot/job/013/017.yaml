translation_notes:
  register: Modernong Filipino Tagalog na tuwiran, marangal, at madaling maunawaan. Ginamit ang paralelismong “Makinig… pakinggan” upang katawanin ang dalawang magkakaugnay na sugnay ng Hebreo nang hindi gumagamit ng alanganing literalismong “sa inyong mga tainga.”
