  text: Ngunit kayo ay mga nagtatapal ng kasinungalingan; kayong lahat ay mga manggagamot na walang silbi.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga nagpapahid ng kabulaanan” o “mga gumagawa-gawa ng kasinungalingan.” Ang pandiwang Hebreo ay maaaring maglarawan ng pagpapahid o pagtatapal sa ibabaw, kaya ipinahihiwatig na tinatakpan nila ng kasinungalingan ang tunay na kalagayan.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “mga manggagamot na walang halaga.” Inilalarawan sila ng Hebreo bilang mga tagapagpagaling na walang pakinabang. Posible ngunit di-gaanong malamang dito ang pakahulugang “mga manggagamot ng diyus-diyosan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאוּלָם
  choice: Ngunit
  rationale: Nagpapahayag ng matinding pagsalungat sa naunang sinabi at angkop sa marangal ngunit likas na modernong Tagalog.
- source_word: אַתֶּם
  choice: kayo
  rationale: Tahasang tumutukoy sa maramihang kausap ni Job; pinalalakas ng כֻּלְּכֶם bilang “kayong lahat.”
- source_word: טֹפְלֵי
  choice: mga nagtatapal ng
  rationale: Pinananatili ang konkretong larawan ng pagpapahid o pagtatapal sa ibabaw, sa halip na agad itong gawing mas interpretibong “mga gumagawa-gawa.”
- source_word: שָׁקֶר
