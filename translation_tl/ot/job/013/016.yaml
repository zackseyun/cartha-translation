  text: Ito rin ang magiging kaligtasan ko[a], sapagkat walang taong walang pitagan sa Diyos[b] ang makalalapit sa kanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pagliligtas” o “pagpapatunay ng pagiging matuwid.”
