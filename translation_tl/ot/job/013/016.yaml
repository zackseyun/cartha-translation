  - marker: b
    text: Ang salitang Hebreo ay maaari ring isaling “taong lapastangan” o “mapagkunwari.” Tumutukoy ito sa taong walang pitagan sa Diyos, hindi lamang sa taong hindi tapat sa sinasabi niya.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם הוּא
  choice: Ito rin
  rationale: Pinananatili ang pandagdag na diin ng גַּם at nauunawaan ang הוּא bilang tumutukoy sa naunang kalagayan o sinabi ni Job, hindi bilang personal na panghalip.
- source_word: לִי לִישׁוּעָה
  choice: ang magiging kaligtasan ko
  rationale: Likas sa Filipino at tapat sa diwang pakinabang o pag-aari ng לִי; ang יְשׁוּעָה ay may saklaw na kaligtasan, pagliligtas, at pagpapatunay na matuwid.
- source_word: כִּי
  choice: sapagkat
  rationale: Malinaw na ipinakikita ang paliwanag o batayan ng naunang pahayag sa isang marangal ngunit kasalukuyang rehistro.
- source_word: חָנֵף
  choice: taong hindi kumikilala sa Diyos
  rationale: Ipinahahayag ang relihiyoso at moral na diwa ng salitang Hebreo—isang lapastangan o walang pitagan sa Diyos—sa halip na paliitin ito sa karaniwang kahulugan ng 'mapagkunwari.'
- source_word: לְפָנָיו
  choice: sa harap niya
  rationale: Pinananatili ang karaniwang idyomang Hebreo para sa pagharap o pagpasok sa presensiya ng isang tao, nang hindi dinaragdagan ang tahasang pangalan ng Diyos sa teksto.
- source_word: יָבוֹא
  choice: makalalapit
  rationale: Sa konteksto, hindi lamang pisikal na pagdating ang tinutukoy kundi ang pagharap o pagkakaroon ng pagpasok sa presensiya; ang 'makalalapit' ay natural na nagpapahiwatig ng posibilidad o pahintulot.
theological_decisions:
- issue: Tinutukoy ng panghalip sa לְפָנָיו
  choice: '''niya,'' na sa konteksto ay tumutukoy sa Diyos'
  alternative: Isang mas pangkalahatang taong hinaharap ni Job
  rationale: Ang usapan ay tungkol sa pagharap ni Job sa Diyos at sa inaasahan niyang kinalabasan, ngunit pinananatili sa salin ang panghalip sa halip na palitan ito ng tahasang 'Diyos.'
- issue: Diwa ng יְשׁוּעָה sa pahayag ni Job
  choice: kaligtasan, na maaaring sumaklaw sa pagliligtas o pagpapatunay na matuwid
  alternative: pagliligtas; pagpapatunay na matuwid
  rationale: Pinananatili ng 'kaligtasan' ang malawak at maringal na diwa ng salita, habang kinikilala sa talababa ang posibleng hudisyal na diin sa konteksto ng pagtatanggol ni Job.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang 'makalalapit sa harap niya' upang maging natural ang idyoma habang pinananatili ang konsepto ng pagharap sa presensiya ng Diyos. Ang lahat ng marker ng talababa ay nasa pangunahing teksto.
