  yaml_path: translation/ot/job/007/012.yaml
  text: Am I the sea[a], or a sea monster[b], that you set a guard over me?
translation:
  language: tl
  text: Ako ba ang dagat o isang dambuhalang nilalang sa dagat[a], kaya mo ako nilalagyan ng bantay[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “dragon” o “ahas.” Ang Hebreong tannin ay tumutukoy sa isang malaking nakatatakot na nilalang at madalas gamitin sa mga paglalarawan ng dagat at kaguluhan.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “nagtatalaga ka ng bantay upang magbantay sa akin” o “nagmamatyag ka sa akin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲיָם
  choice: Ako ba ang dagat
  rationale: Tuwirang pinananatili ang retorikal na tanong at ang larawang ποιetiko ng dagat bilang puwersang kailangang pigilan.
- source_word: אִם
  choice: o
  rationale: Ginagamit dito ang אִם bilang panghiwalay sa dalawang posibilidad sa magkatambal na retorikal na tanong.
- source_word: תַּנִּין
  choice: isang dambuhalang nilalang sa dagat
  rationale: Maaaring tumukoy ang תַּנִּין sa isang malaking nakatatakot na nilalang, dragon, o ahas. Sa pagkakatambal nito sa dagat, malinaw at likas sa modernong Tagalog ang piniling salin nang hindi nagpapasok ng tiyak na mitolohikal na pagkakakilanlan.
- source_word: כִּי
  choice: kaya
  rationale: 'Ipinakikita ng sugnay ang ipinagtatakang bunga o dahilan ng paghahambing: itinuturing si Job na waring isang panganib na kailangang bantayan.'
- source_word: תָשִׂים
  choice: naglalagay ka
  rationale: Ang pandiwang שׂים ay nangangahulugang maglagay o magtalaga; ang kasalukuyang anyo ay natural sa reklamo ni Job tungkol sa patuloy na pagbabantay sa kaniya.
- source_word: עָלַי מִשְׁמָר
  choice: ng bantay sa akin
  rationale: Pinananatili nito ang diwa ng ipinataw na pagbabantay, pagmamatyag, o pagpigil kay Job.
theological_decisions:
- issue: Larawan ng תַּנִּין sa wikang ποιetiko tungkol sa dagat at kaguluhan
  choice: dambuhalang nilalang sa dagat
  alternative: dragon; ahas; dambuhala
  rationale: Pinananatili ang sinaunang larawang ποιetiko ng isang mapanganib na nilalang sa dagat nang hindi nagpapalagay ng isang ganap na sistemang mitolohikal na hindi tahasang sinasabi ng talata. Nananatili rin ang tensiyon sa reklamo ni Job na para siyang isang banta na dapat pigilan ng Diyos.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “dambuhalang nilalang sa dagat” upang maging malinaw sa karaniwang mambabasa habang pinananatili sa talababa ang tunay na lawak ng kahulugan ng tannin. Ang ayos na “Ako ba ang dagat” ay nagpapanatili sa diin ng hayag na panghalip na אֲנִי.
