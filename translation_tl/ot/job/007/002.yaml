  text: Like a servant who longs for shade[a], and like a hired worker who waits for his wages[c][b],
translation:
  language: tl
  text: 'Gaya ng alipin na nananabik sa lilim,[a]

    at gaya ng upahang manggagawa na naghihintay sa kaniyang sahod,[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “anino.” Ang tinutukoy rito ay ang ginhawa mula sa init.
    reason: lexical_alternative
  - marker: b
    text: O “kabayaran sa kaniyang paggawa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּ/עֶבֶד
  choice: Gaya ng alipin
  rationale: Maaaring tumukoy ang עֶבֶד sa alipin o lingkod. Pinili ang “alipin” upang mapanatili ang bigat ng kalagayang nakatali at hirap sa paggawa na ipinahihiwatig ng paghahambing.
- source_word: יִשְׁאַף
  choice: na nananabik
  rationale: Ipinahahayag ng שׁאף ang matinding pagnanais, kung minsan ay parang paghahabol ng hininga. Likas sa modernong Tagalog ang “nananabik” at naipakikita nito ang taimtim na paghahangad.
- source_word: צֵל
  choice: sa lilim
  rationale: Bagaman literal ding maaaring “anino,” tumutukoy rito ang צֵל sa ginhawang dulot ng lilim mula sa init habang nagtatrabaho.
- source_word: וּ/כְ/שָׂכִיר
  choice: at gaya ng upahang manggagawa
  rationale: Ang שָׂכִיר ay isang taong inupahan upang magtrabaho kapalit ng bayad. Pinananatili ng “upahang manggagawa” ang ekonomikong diwa nang malinaw at likas sa Tagalog.
- source_word: יְקַוֶּה
  choice: na naghihintay
  rationale: Maaaring mangahulugan ang קוה ng maghintay o umasa. Dahil kabayaran sa paggawa ang hinihintay, “naghihintay” ang tuwirang pagpili habang nananatili ang diwa ng pananabik.
- source_word: פָעֳל/וֹ
  choice: sa kaniyang sahod
  rationale: Bagaman maaaring tumukoy ang פעל sa gawa o bunga ng paggawa, sa kaugnayan nito sa upahang manggagawa ay natural itong tumutukoy sa kabayarang nararapat sa kaniya.
