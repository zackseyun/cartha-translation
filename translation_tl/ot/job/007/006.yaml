  naturalness: Hindi natural ang "higit na mabilis kaysa panghabi" dahil kulang ang karaniwang pang-ugnay na "sa" at hindi idiomatiko ang "panghabi" sa tungkuling ito. Mas payak at makabagong Filipino ang "Mas mabilis lumipas ang mga araw ko kaysa sa suliran ng manghahabi."
  terminology: Ang "suliran" ay ang pinakapraktikal na katumbas ng shuttle sa larawan ng talata. Iniiwasan ng talababa ang labis na katiyakan sa pamamagitan ng pagsasabing maaari itong unawain nang mas malawakan bilang kasangkapang panghabi. Ang "walang pag-asa" ay angkop na salin ng בְּאֶפֶס תִּקְוָה.
