  text: My days are swifter than a weaver’s shuttle[b][a]; they come to an end without hope.
translation:
  language: tl
  text: Mas mabilis lumipas ang mga araw ko kaysa sa suliran ng manghahabi[a]; nagwawakas ang mga ito nang walang pag-asa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaaring tumukoy ang salitang Hebreo nang mas malawakan sa kasangkapang panghabi o sa habihan; ang “suliran” ay tumutugma sa larawan ng mabilis na paggalaw.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָמַי
  choice: Ang mga araw ko
  rationale: Tuwirang pinananatili ang pangmaramihang 'mga araw ko,' na tumutukoy sa maikling buhay ni Job ayon sa araw-araw niyang karanasan.
- source_word: קַלּוּ
  choice: ay higit na mabilis
  rationale: Ipinahahayag ang paghahambing at ang diwang 'mabilis' ng pandiwang קלל, kasabay ng pagpapanatili sa payak na kayarian ng Hebreo.
- source_word: מִנִּי אָרֶג
  choice: kaysa panghabi
  rationale: Ang אֹרֶג ay maaaring tumukoy sa kasangkapan sa paghahabi. Ang pangkalahatang 'panghabi' ay nagpapanatili sa tunay na leksikal na lawak nang hindi tiyak na itinuturing itong shuttle o ang buong habihan.
- source_word: וַיִּכְלוּ
  choice: nagwawakas ang mga ito
  rationale: Malinaw na ipinahahayag ang kahulugan ng כלה na matapos o sumapit sa wakas; ang 'mga ito' ay bumabalik sa mga araw ni Job.
- source_word: בְּאֶפֶס תִּקְוָה
  choice: nang walang pag-asa
  rationale: Natural at maikli itong katumbas ng pariralang nagsasaad ng ganap na kawalan ng pag-asa.
