  text: Kapag sinasabi ko[a], “Aaliwin ako ng aking kama; papasanin ng aking higaan ang aking hinaing[b],”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Sapagkat sinabi ko” o “Kung sinabi ko.” Higit sa isang paraan ang posibleng pagbasa sa Hebreong כִּי rito; ang “Kapag sinasabi ko” ang pinakamainam sa agarang konteksto at sa pagdaloy patungo sa susunod na talata.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “pagmumuni” o “pagbubulay” sa halip na “hinaing.” Ang Hebreong שִׂיחַ ay maaaring tumukoy sa mapagnilay na pag-iisip o sa pananalitang nagdadalamhati; sa konteksto ng pagdurusa ni Job, malamang na “hinaing” ang diwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kapag
  rationale: Maaaring panahunan, sanhi, o kondisyonal ang כִּי. Sa daloy patungo sa susunod na talata, likas na ipinakikilala rito ang pagkakataong umaasa si Job na makapagpapahinga siya.
- source_word: אָמַרְתִּי
  choice: sinasabi ko
  rationale: Bagaman ganap na aspekto ang anyong Hebreo at maaaring isaling “sinabi ko,” ipinahihiwatig ng konteksto ang paulit-ulit o kasalukuyang pagsasabi ni Job sa sarili; natural ito sa modernong Tagalog.
- source_word: תְּנַחֲמֵנִי
  choice: Aaliwin ako
  rationale: Ang Piel ng נחם ay nangangahulugang umaliw o magbigay-ginhawa. Pinananatili ng “aaliwin” ang personal at emosyonal na diwa.
- source_word: עַרְשִׂי
  choice: aking kama
  rationale: Ang עֶרֶשׂ ay kama o higaan. “Kama” ang malinaw at karaniwang salita, at naihihiwalay ito sa kasunod na halos kasingkahulugan.
- source_word: יִשָּׂא
  choice: papasanin
  rationale: Ang נשׂא ay may pangunahing diwang magbuhat, magdala, o pumasan. Pinananatili ng “papasanin” ang larawan ng higaan na tumutulong magdala ng bigat ng dalamhati, sa halip na tahasang ipaliwanag itong “pagagaanin.”
- source_word: בְשִׂיחִי
  choice: ang aking hinaing
  rationale: Ang שִׂיחַ ay maaaring pagmumuni, pagbulong, o pananalitang may pagdaing. Sa konteksto ng pagdurusa ni Job, “hinaing” ang pinakanatural, habang itinatala sa talababa ang tunay na lawak ng kahulugan.
- source_word: מִשְׁכָּבִי
  choice: aking higaan
  rationale: Ang מִשְׁכָּב ay lugar na hinihigaan. Ginamit ang “higaan” upang mapanatili ang makatang paralelismo at bahagyang pagkakaiba sa “kama.”
