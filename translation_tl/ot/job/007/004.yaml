  yaml_path: translation/ot/job/007/004.yaml
  text: When I lie down[a], I say, ‘When will I arise?’ But the evening drags on[c][b], and I am full of tossing until dawn.
translation:
  language: tl
  text: Kapag nahihiga ako[a], sinasabi ko, “Kailan kaya ako babangon?” Ngunit kaybagal lumipas ang gabi[b], at sawa na ako sa kapipihit hanggang magbukang-liwayway[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “Kung nahihiga ako.” Maaaring kondisyonal ang salitang Hebreo, ngunit malamang na tumutukoy ito rito sa isang paulit-ulit na kalagayan: “Kapag nahihiga ako.”'
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “at sinusukat ang takipsilim/gabi.” Ang diwa ay tila napakabagal lumipas at napakahaba ng gabi.
    reason: lexical_alternative
  - marker: c
    text: Ang salitang Hebreo ay maaaring mangahulugang “takipsilim” at dito ay malamang na tumutukoy sa takipsilim sa umaga, samakatuwid ay bukang-liwayway.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Kapag
  rationale: Bagaman karaniwang kondisyonal ang אִם (“kung”), maaari itong magpakilala rito ng paulit-ulit na pangyayari. Ang “Kapag” ay likas na nagpapahayag ng gabi-gabing karanasan ni Job.
- source_word: שָׁכַבְתִּי
  choice: nahihiga ako
  rationale: Ang anyong qatal ay nauunawaan dito bilang habitual o iterative, hindi bilang minsanang kilos sa nakaraan.
- source_word: וְאָמַרְתִּי
  choice: sinasabi ko
  rationale: Ang aspektong habitual ay pinanatili upang tumugma sa paulit-ulit na paghiga at pagdaing ni Job.
- source_word: מָתַי אָקוּם
  choice: Kailan kaya ako babangon?
  rationale: Ang “babangon” ay natural na katumbas ng קום sa konteksto ng paghihintay na matapos ang gabi; ipinahihiwatig ng “kaya” ang balisang pananabik nang hindi dinaragdagan ang diwa.
- source_word: וּמִדַּד עָרֶב
  choice: Ngunit napakahaba ng gabi
  rationale: Literal na may larawan ng “pagsukat” o pag-uunat sa עָרֶב. Sa Filipino, ang “napakahaba ng gabi” ay natural na naghahatid ng pakiramdam na napakabagal lumipas ng panahon, bagaman literal na “gabi” ay “takipsilim/gabing panahon.”
- source_word: וְשָׂבַעְתִּי
  choice: sawa na ako sa
  rationale: Ang שבע ay literal na pagiging busog o punô. Sa negatibong konteksto, likas sa Filipino ang “sawa na ako sa,” na nagpapahayag na labis na ang dinaranas.
- source_word: נְדֻדִים
  choice: kapipihit
  rationale: Tumutukoy ang pangngalan sa di-mapakaling paggalaw o pagpapaikot-ikot habang nakahiga. Ang “kapipihit” ay malinaw at karaniwang Filipino para sa pisikal na balisa sa higaan.
- source_word: עֲדֵי נָשֶׁף
  choice: hanggang magbukang-liwayway
  rationale: Maaaring mangahulugan ang נָשֶׁף ng takipsilim sa umaga o gabi. Dito, dahil sa paghihintay na bumangon matapos ang magdamag, pinakamalamang na bukang-liwayway ang tinutukoy.
