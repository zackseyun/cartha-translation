  source_fidelity: 'Tapat ang salin sa pangunahing imahen ng Hebreo: ang laman ay nababalutan ng mga uod at namuong alikabok/dumi, at ang balat ay dumaraan sa pansamantalang paninigas o pagsasara bago muling pumutok. Ang hindi tiyak na diwa ng huling dalawang pandiwa ay hindi pinalalabis at maayos na isinasaad sa talababa.'
