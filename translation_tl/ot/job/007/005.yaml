base_translation:
  language: en
  yaml_path: translation/ot/job/007/005.yaml
  text: My flesh is clothed with worms and clods of dust; my skin hardens[a], then breaks out again.
translation:
  language: tl
  text: Ang aking laman ay nababalutan ng mga uod at namuong alabok; ang aking balat ay naninigas[a] at muling pumuputok.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nagsasara at muling nagnanaknak.” Mahirap tiyakin ang kahulugan ng huling dalawang pandiwang Hebreo. Malamang na inilalarawan ng linya ang balat na pansamantalang nagsasara o tumitigas at pagkatapos ay muling bumubuka.
    reason: alternative_reading
lexical_decisions:
- source_word: לָבַשׁ
  choice: nababalutan
  rationale: Pinananatili nito ang matingkad na larawan ng literal na ‘pagbibihis’ habang natural na ipinahahayag sa Filipino na ang laman ay natatakpan ng mga uod at namuong alabok.
- source_word: בְּשָׂרִי
  choice: aking laman
  rationale: Tuwirang katumbas ito ng salitang Hebreo at pinananatili ang pisikal at masidhing paglalarawan sa karamdaman ni Job.
- source_word: רִמָּה
  choice: mga uod
  rationale: Ang pangngalan ay tumutukoy sa mga uod o larbang kaugnay ng pagkabulok; mas malawak at hindi labis na tiyak ang ‘mga uod’ kaysa ‘mga maggot.’
- source_word: גיש עפר
  choice: namuong alabok
  rationale: Bihira at mahirap ang unang salita, ngunit malamang na tumutukoy sa namuong tipak o makapal na latak; ipinapakita ng parirala ang alabok o dumi na kumapit at namuo sa balat.
- source_word: עוֹרִי
  choice: aking balat
  rationale: Ito ang karaniwan at tuwirang kahulugan ng salitang Hebreo.
- source_word: רָגַע
  choice: naninigas
  rationale: Sa konteksto, maaaring ilarawan ng mahirap na pandiwa ang balat na pansamantalang naninigas o nagsasara; pinananatili ng ‘naninigas’ ang konkretong larawan nang hindi ganap na ipinapalagay na gumagaling ito.
- source_word: וַיִּמָּאֵס
  choice: muling pumuputok
  rationale: Bagaman maaari itong maiugnay sa pagiging kasuklam-suklam o pagkabulok, sa konteksto ng sugat sa balat ay malamang na inilalarawan nito ang muling pagputok o pagbuka ng balat.
