  register: Modernong Filipino na natural at marangal. Pinanatili ang paralelismo ng dalawang sugnay at ang pakiramdam na ang pagdurusa ay isang bahaging inilaan kay Job, nang hindi tinutukoy kung sino ang tahasang naglaan nito.
