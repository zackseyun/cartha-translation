  text: כֵּ֤ן הָנְחַ֣לְתִּי לִ֭/י יַרְחֵי שָׁ֑וְא וְ/לֵיל֥וֹת עָ֝מָ֗ל מִנּוּ לִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/007/003.yaml
  text: So I have been allotted months of emptiness[b][a], and nights of misery have been assigned to me.
translation:
  language: tl
  text: Gayon nga, mga buwang walang kabuluhan ang inilaan sa akin,[a] at mga gabi ng paghihirap ang itinakda para sa akin.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga buwan ng kawalang-saysay” o “mga buwan na walang pakinabang.”
    reason: lexical_alternative
  - marker: b
    text: O “mga gabi ng pagpapagal,” “mga gabi ng kaguluhan,” o “mga gabi ng kapighatian.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כֵּן
  choice: Gayon nga
  rationale: Ipinahihiwatig ang paghahambing at kongklusyon mula sa naunang talata sa natural ngunit marangal na Filipino.
- source_word: הָנְחַ֣לְתִּי לִי
  choice: ang inilaan sa akin
  rationale: Ang Hoph‘al na anyo ay tumutukoy kay Job bilang tumanggap ng bahaging ipinataw o ibinigay sa kaniya, hindi bilang aktibong nagmay-ari nito.
- source_word: יַרְחֵי שָׁוְא
  choice: mga buwang walang kabuluhan
  rationale: Pinananatili ang diwa ng שָׁוְא bilang kawalan ng saysay, kabuluhan, o pakinabang sa mahabang panahon ng pagdurusa.
- source_word: וְלֵילוֹת עָמָל
  choice: at mga gabi ng paghihirap
  rationale: Sa konteksto ng panaghoy ni Job, ang עָמָל ay tumutukoy sa masakit na hirap o dalamhati, bagaman maaari rin itong mangahulugang pagpapagal o kapighatian.
- source_word: מִנּוּ לִי
  choice: ang itinakda para sa akin
  rationale: Ang pasibong pandiwang maramihan ay nagsasaad na ang mga gabi ay itinalaga o ibinahagi kay Job.
