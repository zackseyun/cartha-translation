translation:
  language: tl
  text: Hindi na ako matatanaw ng mata ng nakakakita sa akin[a]; kapag tumingin sa akin ang iyong mga mata, wala na ako[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Hindi na ako makikita ng matang nakakakita sa akin.”
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “ang iyong mga mata ay nasa akin, at wala ako”—isang idyomang nagsasaad na kapag hinanap ako, wala na ako.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְשׁוּרֵנִי
  choice: matatanaw ako
  rationale: Ang שׁור ay tumutukoy sa pagtingin o pagmamasid. Pinananatili ng “matatanaw” ang biswal at bahagyang makatang diin, habang natural sa makabagong Tagalog; ang imperpektibo na may pagtanggi ay inuunawang tumutukoy sa nalalapit na hinaharap.
- source_word: עֵין רֹאִי
  choice: mata ng nakakakita sa akin
  rationale: Pinananatili nito ang konkretong larawang Hebreo at ang construct phrase na literal na tumutukoy sa mata ng taong nakakakita kay Job.
- source_word: לֹא
  choice: hindi na
  rationale: Bagaman payak na pagtanggi ang לֹא, ipinahihiwatig ng konteksto ang pagtatapos ng dating pagkakita kay Job; natural na naipapahayag ito ng “hindi na.”
- source_word: עֵינֶיךָ בִּי
  choice: mapapako sa akin ang iyong mga mata
  rationale: Nananatili ang maramihang “mga mata” at ang direksiyon ng tingin. Ang “mapapako sa akin” ay likas na Tagalog para sa matamang pagtutok ng tingin, hindi literal na pagpapako.
- source_word: וְאֵינֶנִּי
  choice: ngunit wala na ako
  rationale: Ang literal na “at ako ay wala” ay idyomatikong tumutukoy sa pagkawala o kamatayan. Ang “wala na ako” ay maikli, natural, at pinananatili ang bigat at kaunting ambiguidad ng Hebreo.
theological_decisions:
- issue: Ang tinutukoy ng “iyong mga mata”
  choice: Direktang pananalita sa Diyos, nang hindi idinaragdag ang pangalang “Diyos”
  alternative: Pangkalahatang pagtukoy sa sinumang tumitingin
  rationale: Sa malapit na konteksto, Diyos ang direktang kinakausap ni Job. Gayunman, hindi tahasang binabanggit ang pangalan sa talata, kaya hindi ito idinagdag sa salin.
translation_notes:
  register: Makabagong Filipino Tagalog na marangal at makata ngunit madaling maunawaan. Pinanatili ang konkretong larawan ng “mata/mga mata,” ang tuwirang pakikipag-usap, at ang maigting na pahayag na “wala na ako,” nang hindi nililinaw nang higit sa Hebreo kung pagkawala o kamatayan ang eksaktong diin.
