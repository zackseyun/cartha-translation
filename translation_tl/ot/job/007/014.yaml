translation:
  language: tl
  text: Kaya tinatakot mo ako sa mga panaginip at sinisindak mo ako sa mga pangitain.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “at tinatakot mo ako sa mga panaginip, at mula sa mga pangitain ay sinisindak mo ako.” Ang mga pang-ukol sa Hebreo ay mas pormal na maisasaling “sa/pamamagitan ng” at “mula sa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ
  choice: saka
  rationale: Iniuugnay nito ang talata sa naunang sinabi ni Job at ipinahihiwatig ang kasunod na nangyayari; mas malinaw rito ang “saka” kaysa payak na “at.”
- source_word: חִתַּתַּנִי
  choice: tinatakot mo ako
  rationale: Ang Piel ng חתת na may hulaping unang panauhan ay tumutukoy sa matinding pagkatakot o panghihilakbot. Likas sa modernong Filipino ang “tinatakot mo ako” at hindi nito ipinapalagay ang literal na pagdurog.
- source_word: בַחֲלֹמוֹת
  choice: sa mga panaginip
  rationale: Maaaring ipahayag ng ב ang kinasasangkutan o paraang ginagamit. Pinananatili ng “sa mga panaginip” ang bahagyang kalabuan kung ang takot ay nangyayari sa panaginip o dulot nito.
- source_word: וּמֵחֶזְיֹנוֹת
  choice: at ... sa mga pangitain
  rationale: Ang מן ay maaaring magpahiwatig ng pinagmulan o paraan. Natural sa Filipino ang “sa mga pangitain,” habang inilalahad sa talababa ang mas pormal na “mula sa.”
- source_word: תְּבַעֲתַנִּי
  choice: sinisindak mo ako
  rationale: Ang Piel ng בעת ay nagpapahayag ng bigla o matinding sindak. Ang “sinisindak” ay angkop na katapat ng unang pandiwa at pinananatili ang masidhing paralelismo nang hindi inuulit ang “tinatakot.”
