  source_fidelity: Tumpak ang salin sa Hebreo. Ang מָאַסְתִּי ay may di-tahasang layon; ang “Kinasusuklaman ko ang buhay ko” ay isang makatuwirang paglilinaw mula sa konteksto at malinaw na tinatala ng talababa. Wasto ring naipahayag ang “hindi ako mabubuhay magpakailanman,” ang pautos na “Lubayan mo ako,” at ang metaporang הֶבֶל bilang “isang hininga.”
  naturalness: Natural at marangal ang makabagong Filipino. Ang “Lubayan mo ako” ay maikli at angkop sa panaghoy ni Job, at ang “ang mga araw ko ay isang hininga” ay malinaw na nakapapanatili ng matalinghagang pananalita.
