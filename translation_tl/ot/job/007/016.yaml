id: JOB.7.16
reference: Job 7:16
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: מָ֭אַסְתִּי לֹא לְ/עֹלָ֣ם אֶֽחְיֶ֑ה חֲדַ֥ל מִ֝מֶּ֗/נִּי כִּי הֶ֥בֶל יָמָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/007/016.yaml
  text: I despise my life[a]; I will not live forever. Leave me alone[b], for my days are a breath.
translation:
  language: tl
  text: Kinasusuklaman ko ang buhay ko[a]; hindi ako mabubuhay magpakailanman. Lubayan mo ako, sapagkat ang mga araw ko ay isang hininga[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Kinasusuklaman ko ito” o “Itinatakwil ko ito.” Walang tahasang layon ang pandiwa sa Hebreo; ipinahihiwatig dito na ang tinutukoy ay ang buhay ni Job.
    reason: lexical_alternative
  - marker: b
    text: Ang salitang Hebreo ay maaari ring isaling “singaw,” na nagdiriin sa ikli at pagiging panandalian ng buhay.
    reason: lexical_alternative
lexical_decisions:
- source_word: מָאַסְתִּי
  choice: Kinasusuklaman ko ang buhay ko
  rationale: Ang pandiwang מָאַס ay maaaring mangahulugang ‘itakwil,’ ‘hamakin,’ o ‘kasuklaman.’ Walang tahasang layon sa Hebreo, ngunit ipinahihiwatig ng konteksto ang buhay ni Job. Ang ‘kinasusuklaman’ ay nagpapanatili sa tindi ng kaniyang pag-ayaw, habang nililinaw ng talababa na idinagdag lamang ang layon.
- source_word: לֹא לְעֹלָם אֶחְיֶה
  choice: hindi ako mabubuhay magpakailanman
  rationale: Tuwirang ipinapahayag nito ang pagkaunawa ni Job na hindi walang hanggan ang kaniyang buhay, nang hindi ito ginagawang tahasang kahilingan na mamatay.
- source_word: חֲדַל מִמֶּנִּי
  choice: Lubayan mo ako
  rationale: Ang pautos na חֲדַל kasama ng מִמֶּנִּי ay likas na maisasalin bilang pakiusap na tumigil at pabayaan siya. Ang ‘lubayan’ ay maikli, dignificado, at malinaw sa makabagong Filipino.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala nito ang dahilan ng pakiusap ni Job.
- source_word: הֶבֶל
  choice: isang hininga
  rationale: Ang הֶבֶל ay tumutukoy sa hininga o singaw at, sa talatang ito, sa ikli at pagiging panandalian ng buhay. Ang ‘hininga’ ay kongkreto at nagpapanatili sa larawang Hebreo.
- source_word: יָמָי
  choice: ang mga araw ko
  rationale: Tuwirang tumutukoy ito sa mga araw ng buhay ni Job.
theological_decisions: []
translation_notes:
  register: Makabagong Filipino na natural ngunit marangal ang himig. Pinanatili ang matinding panaghoy ni Job at ang larawang ‘hininga,’ habang inilagay sa talababa ang hindi tahasang layon ng unang pandiwa at ang alternatibong ‘singaw.’
