  text: גַּם אֲנִי֮ לֹ֤א אֶחֱשָׂ֫ךְ פִּ֥/י אֲֽ֭דַבְּרָה בְּ/צַ֣ר רוּחִ֑/י אָ֝שִׂ֗יחָה בְּ/מַ֣ר נַפְשִֽׁ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/007/011.yaml
  text: I also will not restrain my mouth[a]; I will speak in the distress of my spirit[c][b]; I will complain in the bitterness of my soul.
translation:
  language: tl
  text: Ako rin ay hindi pipigilan ang aking bibig[a]; magsasalita ako sa kagipitan ng aking espiritu; maghihimutok ako[b] sa kapaitan ng aking kaluluwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Hindi ko pipigilan ang aking bibig.” Idyoma itong Hebreo para sa hindi pagpigil sa pagsasalita.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “magsasalita ako,” “mananaghoy ako,” o “magbubulay ako.” Malawak ang saklaw ng pandiwang Hebreo, ngunit sa konteksto ay may diwa ito ng mapait na paghihimutok o pagdaing.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: rin
  rationale: Pinananatili ang karaniwang pandagdag na diwa ng גַּם nang hindi ito ginagawang tahasang panandang sanhi gaya ng “kaya.”
- source_word: לֹא אֶחֱשָׂךְ פִּי
  choice: Hindi ko pipigilan ang aking bibig
  rationale: Pinananatili ang larawang Hebreo ng hindi pagpigil sa bibig, habang malinaw sa Tagalog na hindi pipigilin ni Job ang kanyang pagsasalita.
- source_word: אֲדַבְּרָה
  choice: magsasalita ako
  rationale: Ipinahahayag ng anyo ng pandiwa ang pasiya o layunin ni Job na magsalita.
- source_word: בְּצַר רוּחִי
  choice: sa paghihirap ng aking espiritu
  rationale: Ang צַר ay nagpapahiwatig ng kagipitan, paghihirap, o matinding dalamhati. Ang “espiritu” ay tuwirang kumakatawan sa רוּחַ rito bilang panloob na buhay ni Job.
- source_word: אָשִׂיחָה
  choice: dadaing ako
  rationale: Maaaring tumukoy ang שׂיח sa pagninilay, pagsasalita, pagrereklamo, o panaghoy. Sa konteksto ng mapait na pagdurusa ni Job, likas na ipinahahayag ng “dadaing” ang mapaghimutok na pananalita nang hindi labis na pinatitindi ito.
- source_word: בְּמַר נַפְשִׁי
  choice: sa kapaitan ng aking kaluluwa
  rationale: Pinananatili ang kongkretong “kapaitan” ng מַר at ang makatang katawagang “kaluluwa” para sa נֶפֶשׁ.
theological_decisions:
- issue: Ang magkatabing katawagang רוּחַ at נֶפֶשׁ sa tulang Hebreo
  choice: Isinalin nang magkahiwalay bilang “espiritu” at “kaluluwa.”
  alternative: Gamitin ang “kalooban” at “buong pagkatao,” o iisang salita para sa dalawa.
  rationale: Gumagamit ang talata ng dalawang magkaibang salitang Hebreo na magkatugma sa tula. Ang pagpapanatili sa pagkakaiba ng mga ito ay hindi nagpapataw ng isang teknikal na doktrina tungkol sa mga bahagi ng tao.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Pinanatili ang matalinghagang “bibig,” gayundin ang magkatulad ngunit hindi lubos na magkaparehong “espiritu” at “kaluluwa.” Ginamit ang “paghihirap” bilang malinaw na pangkaraniwang katumbas ng matinding kagipitan, at “dadaing” para sa pananalitang nagmumula sa pagdurusa.
