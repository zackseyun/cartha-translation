  to: Bakit hindi mo pinatatawad ang pagsuway ko at inaalis ang pagkakasala ko?[a] Sapagkat ngayo’y hihimlay ako sa alabok; masikap mo akong hahanapin,[b] ngunit wala na ako.
  rationale: Inayos ang pananalita ng unang tanong para sa likas na Tagalog at mas malinaw na pagmamarka ng aspektong di-ganap. Pinalitan ang “kasamaan ko” ng “pagkakasala ko” upang mas tumpak na katawanin ang עָוֹן sa personal na paralelismo nito sa “pagsuway ko.” Nilinaw ang talababa [a] upang maipagkaiba ang literal na larawan ng mga pandiwa at ang idyomatikong kahulugan nito. Napanatili ang mga talinghaga ng alabok at pagkawala, pati ang mga umiiral na anchor ng talababa.
