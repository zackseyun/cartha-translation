    issue: 'Di-likas at malabong anyo ng unang pandiwa: “Bakit hindi mo patawarin ...”'
    rationale: Ang Hebreong תִשָּׂא ay di-ganap na pandiwa sa tanong. Sa Tagalog, ang “Bakit hindi mo pinatatawad ...?” ang natural na pahayag ng “Why do you not pardon/forgive?”; ang “hindi mo patawarin” ay maaaring magmukhang putol o pautos.
  - severity: medium
    issue: Ang “kasamaan” ay kulang sa tiyak na ugnayan sa personal na pagkakasala sa עָוֹנִי.
    rationale: Maaaring mangahulugan ang עָוֹן ng pagkakasala, guilt, o iniquity. Sa kontekstong “aking,” at katabi ng “aking pagsuway,” ang “pagkakasala ko” ay mas tumpak at likas, samantalang nananatiling naiiba sa “pagsuway ko.”
  - severity: low
    issue: Hindi mahigpit na literal ang paglalarawan ng unang pandiwa sa talababa [a].
    rationale: Ang literal na kahulugan ng נשא ay “buhatin/dalhin,” hindi “alisin.” Maaaring ilahad ang pagpapatawad/pag-aalis bilang idyomatikong diwa, ngunit dapat ihiwalay iyon sa literal na larawan.
