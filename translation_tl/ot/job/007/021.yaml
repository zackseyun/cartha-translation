base_translation:
  language: en
  yaml_path: translation/ot/job/007/021.yaml
  text: Why do you not pardon my transgression and take away my iniquity? For now I will lie down in the dust[a]; you will seek me diligently[b], but I will be gone.
translation:
  language: tl
  text: Bakit hindi mo pinatatawad ang pagsuway ko at inaalis ang pagkakasala ko?[a] Sapagkat ngayo’y hihimlay ako sa alabok; masikap mo akong hahanapin,[b] ngunit wala na ako.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literal na larawan ng mga pandiwang Hebreo: ‘buhatin/dalhin ang pagsuway ko at paraanin/palampasin ang pagkakasala ko.’ Sa gamit na ito, kapwa idyoma ang mga ito para sa pagpapatawad o pag-aalis ng pagkakasala.'
    reason: lexical_alternative
  - marker: b
    text: Maaari ring ‘hahanapin mo ako nang maaga.’ Ang pandiwang Hebreo ay maaaring may diwa ng paghahanap sa madaling-araw, ngunit dito ay malamang na tumutukoy sa masikap o taimtim na paghahanap.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִשָּׂא
  choice: patawarin
  rationale: Ang נׂשא ay literal na ‘buhatin/dalhin,’ ngunit kapag kasalanan ang layon, idyoma ito para sa pagpapatawad o pag-aalis ng pananagutan.
- source_word: פִשְׁעִי
  choice: ang pagsuway ko
  rationale: Ang פשע ay tumutukoy sa paglabag o paghihimagsik. Ang ‘pagsuway’ ay natural sa makabagong Tagalog at nananatiling mas mabigat kaysa sa pangkalahatang ‘kasalanan.’
- source_word: וְתַעֲבִיר
  choice: at alisin
  rationale: Ang Hiphil ng עבר ay maaaring mangahulugang ‘paraanin,’ ‘palampasin,’ o ‘alisin.’ Sa עון bilang layon, malinaw na ipinahihiwatig dito ang pag-aalis ng kasamaan o pananagutan.
- source_word: עֲוֺנִי
  choice: ang kasamaan ko
  rationale: Ang עון ay maaaring tumukoy sa kasamaan, pagkakasala, o pananagutan. Pinananatili ng ‘kasamaan’ ang kaibhan nito sa פשע nang hindi nililimitahan ang kahulugan sa damdamin ng pagkakasala.
- source_word: כִּי עַתָּה
  choice: Sapagkat ngayo’y
  rationale: Ipinakikilala ng parirala ang dahilan na nakabatay sa nalalapit na kamatayan ni Job, habang pinananatili ang temporal na diin ng ‘ngayon.’
- source_word: לֶעָפָר אֶשְׁכָּב
  choice: hihimlay ako sa alabok
  rationale: Pinananatili nito ang kongkretong larawang patula ng kamatayan at paglilibing sa halip na tuwirang ipakahulugang ‘mamamatay ako.’
- source_word: וְשִׁחֲרְתַּנִי
  choice: buong sikap mo akong hahanapin
  rationale: Ang שחר sa Piel ay maaaring mangahulugang maghanap nang maaga o maghanap nang masikap. Sa konteksto, mas natural ang masikap at taimtim na paghahanap.
- source_word: וְאֵינֶנִּי
  choice: ngunit wala na ako
  rationale: Literal itong ‘at wala ako.’ Ang ‘ngunit wala na ako’ ay natural na Tagalog na nagpapanatili sa mariing pahiwatig ng pagkawala o kamatayan.
theological_decisions:
- issue: Pagpapanatiling magkaiba ng dalawang katawagan sa kasalanan
  choice: ‘pagsuway’ para sa פשע at ‘kasamaan’ para sa עון
  alternative: Gamitin ang ‘kasalanan’ para sa dalawang salita
  rationale: Magkaugnay ngunit magkaiba ang dalawang salitang Hebreo. Pinananatili ng salin ang kanilang pagkakaiba at ang paralelismong patula nang hindi ipinapasok ang isang tiyak na sistemang teolohikal.
- issue: Larawan ng kamatayan sa לֶעָפָר אֶשְׁכָּב
  choice: Panatilihin ang ‘hihimlay ako sa alabok’
  alternative: Isaling tuwiran bilang ‘mamamatay ako’
  rationale: Ang orihinal ay gumagamit ng larawan ng alabok, mortalidad, at paglilibing. Ang pagpapanatili rito ay nagbibigay-daan sa mambabasa na maranasan ang puwersang patula at teolohikal ng teksto.
- issue: Panahunan ng וְאֵינֶנִּי sa kontekstong tumutukoy sa hinaharap
  choice: ‘ngunit wala na ako’
  alternative: ‘ngunit hindi na ako iiral’ o ‘ngunit ako’y lilipas na’
  rationale: Bagaman anyong pangkasalukuyan ang Hebreo, nasa hanay ito ng mga pahayag tungkol sa nalalapit na kamatayan. Ang likas na Tagalog na ‘wala na ako’ ay sadyang nagpapanatili ng maigsi at bahagyang bukas na pahayag.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang ‘ngayo’y’ at ‘hihimlay’ upang mapanatili ang tonong patula nang hindi nagiging lipas o mahirap unawain. Inilipat ang talang [a] sa sugnay na tinatalakay nito sa halip na ikabit sa ‘alabok.’
