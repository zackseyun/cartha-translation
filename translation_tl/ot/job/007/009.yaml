  yaml_path: translation/ot/job/007/009.yaml
  text: As a cloud fades away and vanishes[a], so the one who goes down to Sheol does not come up.
translation:
  language: tl
  text: Kung paanong naglalaho at nawawala ang ulap, gayon din, ang bumababa sa Sheol[a] ay hindi umaahon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “libingan” o “daigdig ng mga patay.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּלָה
  choice: naglalaho
  rationale: Ipinapahayag ng pandiwa ang pagkaubos o pagdating sa wakas; sa ulap bilang simuno, likas na inilalarawan ng “naglalaho” ang unti-unting pagkawala nito.
- source_word: עָנָן
  choice: ulap
  rationale: Tuwirang kahulugan ng pangngalan at mahalagang larawan sa paghahambing.
- source_word: וַיֵּלַךְ
  choice: at nawawala
  rationale: Literal na “at umaalis,” ngunit kaugnay ng ulap at כָּלָה, ang diwa ay tuluyang pagkawala; natural ito sa makabagong Tagalog.
- source_word: כֵּן
  choice: gayon
  rationale: Malinaw at marangal na panandang nag-uugnay sa larawan ng ulap at sa kalagayan ng bumababa sa Sheol.
- source_word: יוֹרֵד
  choice: ang bumababa
  rationale: Pinananatili ang substantibong gamit ng participle at ang patayong larawang kaagapay ng “umaahon.”
- source_word: שְׁאוֹל
  choice: Sheol
  rationale: Pinananatili ang terminong Hebreo upang hindi paliitin ang kahulugan tungo lamang sa libingan o ipakahulugan nang lubos bilang daigdig ng mga patay.
- source_word: לֹא יַעֲלֶה
  choice: hindi na umaahon
  rationale: Pinananatili ang patayong larawan na kasalungat ng “bumababa.” Ang “na” ay natural sa Tagalog para sa kontekstuwal na diwa ng hindi pagbabalik, nang hindi nagdaragdag ng sistematikong pahayag tungkol sa muling pagkabuhay.
theological_decisions:
- issue: Pagpapakahulugan sa שְׁאוֹל
  choice: Sheol
  alternative: libingan; daigdig ng mga patay
  rationale: Maaaring tumukoy ang salita sa libingan o sa kinaroroonan ng mga patay. Ang transliterasyong “Sheol” ay nagpapanatili sa lawak at tensiyon ng konseptong Hebreo at hindi ginagawang mas tiyak ang sinasabi ng talata kaysa sa orihinal.
- issue: Saklaw ng “hindi umaahon”
  choice: Inihayag bilang obserbasyon ni Job sa pagiging pinal ng kamatayan mula sa pananaw ng tao
  alternative: Basahin bilang ganap na pagtanggi sa anumang muling pagkabuhay
  rationale: Hindi dapat palawakin ang linyang patula tungo sa isang kumpletong doktrinal na pahayag. Pinananatili ng salin ang mariing pananalita at ang tensiyon nito nang hindi tahimik na nilulutas ang mas malawak na usaping teolohikal.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Kung paanong … gayon” upang natural na maipahayag ang paghahambing, at pinanatili ang Sheol bilang mahalagang terminong Hebreo.
