  yaml_path: translation/ot/job/007/010.yaml
  text: He does not return again to his house[a], and his place does not know him anymore.
translation:
  language: tl
  text: 'Hindi na siya babalik sa kanyang bahay,

    at hindi na siya kikilalanin ng kanyang lugar.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “at hindi na siya makikilala ng kanyang lugar.” Ang pandiwang Hebreo ay maaaring tumukoy sa pagkilala o sa pagkilala sa kanya bilang taong dating naroon.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשׁוּב
  choice: babalik
  rationale: Karaniwang kahulugan ng שׁוב ang bumalik; ang aspektong di-ganap sa ilalim ng pagtanggi ay likas na naipapahayag sa Filipino bilang “hindi na ... babalik.”
- source_word: עוֹד (unang paglitaw)
  choice: hindi na
  rationale: Kasama ng לֹא, ipinahihiwatig nito na hindi na muling mangyayari ang pagbabalik. Sa Filipino, sapat at natural ang “hindi na babalik,” nang hindi kailangang ulitin ang diwang “muli.”
- source_word: לְבֵיתוֹ
  choice: sa kanyang bahay
  rationale: Pinananatili ng “bahay” ang kongkretong larawan ng בַּיִת at ang direksiyon ng לְ.
- source_word: יַכִּירֶנּוּ
  choice: makikilala siya
  rationale: Ang Hiphil ng נכר ay maaaring mangahulugang kumilala o makilala. Ang “makikilala” ay nagpapanatili sa personipikasyon ng lugar at sa diwang hindi na nito siya kikilalanin bilang dating naroon.
- source_word: עוֹד (ikalawang paglitaw)
  choice: hindi na
  rationale: 'Sa ilalim ng pagtanggi, natural nitong ipinahahayag ang permanenteng pagkawala: “hindi na.”'
- source_word: מְקֹמוֹ
  choice: kanyang lugar
  rationale: Literal at maikli ang “kanyang lugar,” at pinananatili nito ang makatang personipikasyon at ang posibleng pagtukoy sa dating puwesto o kinaroroonan niya.
