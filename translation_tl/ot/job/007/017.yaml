  yaml_path: translation/ot/job/007/017.yaml
  text: What is man[a], that you make so much of him[b], and that you set your heart on him?
translation:
  language: tl
  text: Ano ba ang tao,[a] na lubos mong pinahahalagahan at itinutuon mo sa kanya ang iyong puso?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Hebreo ay tumutukoy sa mortal at marupok na tao bilang kinatawan ng sangkatauhan. Maaari ring isalin ang “lubos mong pinahahalagahan” bilang “dinadakila mo siya” o “ginagawa mo siyang dakila.” Ihambing sa Awit 8:4.
    reason: lexical_alternative_and_cross_reference
lexical_decisions:
- source_word: מָה
  choice: Ano ba
  rationale: Likas na pambungad sa isang retorikal na tanong sa modernong Tagalog; ipinahihiwatig ng “ba” ang nagtatanong at nababagabag na tono ni Job.
- source_word: אֱנוֹשׁ
  choice: ang tao
  rationale: Pinananatili ang isahang kumakatawan sa sangkatauhan at ang diwa ng pagiging mortal at marupok, nang hindi ginagawang maramihan.
- source_word: כִּי
  choice: at
  rationale: Sa Tagalog, natural na naiuugnay ng “at” ang retorikal na tanong sa kasunod na dahilan ng pagtataka; hindi kailangang ulitin ang isang katumbas ng Ingles na “that.”
- source_word: תְגַדְּלֶנּוּ
  choice: pinahahalagahan mo siya nang gayon
  rationale: Ang Piel ng גדל ay maaaring mangahulugang gawing dakila o ituring na mahalaga. Ang salin ay malinaw sa konteksto ng matinding pansin ng Diyos ngunit hindi inaalis ang alternatibong leksikal.
- source_word: וְכִי
  choice: at
  rationale: Pinananatili ang paralelismo at maayos na pinagdurugtong ang ikalawang sugnay.
- source_word: תָשִׁית אֵלָיו לִבֶּךָ
  choice: itinutuon mo sa kanya ang iyong puso
  rationale: Pinananatili ang konkretong larawan ng paglalagak o pagtutuon ng puso sa isang tao, kasama ang antropomorpikong wika ng Hebreo.
theological_decisions:
- issue: Isahang kumakatawan sa sangkatauhan sa אֱנוֹשׁ
  choice: ang tao
  alternative: ang isang mortal; ang sangkatauhan
  rationale: Ang “ang tao” ay natural sa Tagalog bilang isahang kumakatawan sa lahat ng tao at pinananatili ang ugnayang pampanitikan sa Awit 8:4, habang ang konteksto at talababa ay nagpapakita ng mortal na kahinaan.
- issue: Antropomorpikong paglalarawan sa malasakit o pansin ng Diyos
  choice: itinutuon mo sa kanya ang iyong puso
  alternative: binibigyan mo siya ng pansin; itinutuon mo sa kanya ang iyong isip
  rationale: Hindi ginagawang abstrakto ang לֵב. Pinananatili ang teolohikal at makatang tensiyon ng Diyos na naglalagak ng kaniyang “puso” sa tao, na sa konteksto ni Job ay maaaring madama bilang mabigat na pagsubaybay, hindi lamang magiliw na malasakit.
- issue: Ambiguidad ng תְגַדְּלֶנּוּ
  choice: pinahahalagahan mo siya nang gayon
  alternative: dinadakila mo siya; ginagawa mo siyang dakila
  rationale: Ipinahahayag ng pangunahing salin ang pagbibigay ng malaking halaga o pansin, ngunit inilalagay sa talababa ang mas literal na mga posibilidad upang hindi ipirmi ang isang pakahulugan lamang.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog. Ginamit ang “Ano ba” upang maipakita ang retorikal at nababagabag na tono ni Job. Pinanatili ang “puso” at ang isahang “tao” upang mapangalagaan ang makatang larawan, kinatawang anyo, at tunay na tensiyon ng talata.
