translation:
  language: tl
  text: Hindi ba ang tao ay may mabigat na paglilingkod sa lupa[a], at ang kanyang mga araw ay tulad ng mga araw ng isang upahang manggagawa?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Hindi ba may tungkuling militar ang tao sa lupa?” Ang salitang Hebreo na צָבָא ay maaaring mangahulugang paglilingkod sa hukbo o pakikidigma, ngunit dito ay malamang na mas malawak itong tumutukoy sa mabigat na panahon ng paglilingkod o pagpapagal, gaya ng ipinahihiwatig ng paghahambing sa mga araw ng isang upahang manggagawa.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: Hindi ba ...?
  rationale: Pinananatili ang anyong retorikal na tanong na umaasang sasang-ayon ang kausap.
- source_word: צָבָא
  choice: mabigat na paglilingkod
  rationale: Maaaring tumukoy sa pakikidigma o paglilingkod na sapilitan at mabigat. Ipinahihiwatig ng paghahambing sa upahang manggagawa ang isang mahirap at takdang panahon ng paggawa.
- source_word: אֱנוֹשׁ
  choice: tao
  rationale: Likas at pangkalahatang katawagan sa sangkatauhan sa Filipino; pinananatili ng konteksto ang diwa ng marupok na mortal na tao.
- source_word: עַל־אָרֶץ
  choice: sa lupa
  rationale: Tuwirang locative na pahayag tungkol sa kalagayan ng tao sa daigdig, hindi sa isang partikular na lupain.
- source_word: וְכִימֵי ... יָמָיו
  choice: at hindi ba ang kanyang mga araw ay tulad ng sa
  rationale: Bahagyang pinalawak para maging likas ang ikalawang bahagi ng retorikal na tanong habang pinananatili ang paghahambing ng mga araw.
- source_word: שָׂכִיר
  choice: isang upahang manggagawa
  rationale: Malinaw at makabagong tawag sa manggagawang naglilingkod kapalit ng sahod, nang walang lumang o mapanirang himig.
