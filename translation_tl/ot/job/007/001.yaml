  register: Modernong Filipino na dignified at madaling maunawaan. Ginamit ang “nakatalaga” upang ipahayag ang ipinataw o itinakdang katangian ng paglilingkod, habang inilagay sa talababa ang tunay na kahulugang militar ng צָבָא.
