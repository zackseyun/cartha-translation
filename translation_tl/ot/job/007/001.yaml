revisions:
- from: Hindi ba mabigat na paglilingkod ang nakatalaga sa tao sa lupa[a], at hindi ba ang kanyang mga araw ay tulad ng sa isang upahang manggagawa?
  to: Hindi ba ang tao ay may mabigat na paglilingkod sa lupa[a], at ang kanyang mga araw ay tulad ng mga araw ng isang upahang manggagawa?
  rationale: Inalis ang “nakatalaga” upang hindi magdagdag ng mas tahasang diwa ng pagpapataw kaysa sa nasa Hebreo. Ginawang hayag ang “mga araw” sa paghahambing at pinakinis ang alternatibong salin sa talababa, habang pinananatili ang pangunahing diwa at ang leksikal na kalabuan ng צָבָא.
  reviewer_model: gpt-5.6-terra
