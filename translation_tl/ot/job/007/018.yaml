  text: וַ/תִּפְקְדֶ֥/נּוּ לִ/בְקָרִ֑ים לִ֝/רְגָעִ֗ים תִּבְחָנֶֽ/נּוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/007/018.yaml
  text: that you attend to him every morning[b][a], and test him every moment?
translation:
  language: tl
  text: na dinadalaw mo siya tuwing umaga[a], at sinusuri mo siya sa bawat sandali?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “binibigyang-pansin mo siya tuwing umaga.” Ang pandiwang Hebreo ay maaari ring mangahulugang “dalawin,” “asikasuhin,” o “pagtuunan ng pansin.”
    reason: lexical_alternative
  - marker: b
    text: O “sinusubok mo siya sa bawat sandali.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּפְקְדֶנּוּ
  choice: dinadalaw mo siya
  rationale: Malawak ang saklaw ng פקד at maaaring mangahulugang dumalaw, magbigay-pansin, o magsiyasat. Ang “dinadalaw” ay likas sa Tagalog at napananatili ang ambiguwidad kung ang pagdalaw ay pangangalaga o mabigat na pagbabantay; nililinaw ng konteksto ng reklamo ni Job ang negatibong himig.
- source_word: לִבְקָרִים
  choice: tuwing umaga
  rationale: Ipinahahayag ng anyong maramihan kasama ng ל ang paulit-ulit na panahon. Ang “tuwing umaga” ay natural at tumpak sa modernong Tagalog.
- source_word: לִרְגָעִים
  choice: sa bawat sandali
  rationale: Ang רְגָעִים ay maiikling sandali o saglit. Pinananatili ng “sa bawat sandali” ang diwa ng walang-patid na pag-uulit.
- source_word: תִּבְחָנֶנּוּ
  choice: sinusuri mo siya
  rationale: Ang בחן ay pagsubok o masusing pagsusuri upang mapatunayan ang isang bagay. Ang “sinusuri” ay akma sa konteksto ng patuloy na mapanuring pagbabantay at hindi agad nagdaragdag ng ideya ng tukso.
- source_word: ־נּוּ
  choice: siya
  rationale: Ang panlaping panghalip ay panlalaking isahan at tumutukoy sa tao sa naunang talata. Natural sa Tagalog ang “siya” at hindi kailangang markahan ang kasarian.
theological_decisions:
- issue: Himig ng pagmamasid ng Diyos
  choice: Ilarawan ang kilos ng Diyos bilang patuloy at masusing pagdalaw/pagsusuri na mabigat sa pananaw ni Job.
  alternative: Ilarawan ito bilang lubos na mapagkalingang pagdalaw.
  rationale: Sa reklamo ni Job, ang patuloy na pansin ng Diyos ay ipinakikitang pabigat, hindi simpleng kaaliwan. Gayunman, pinananatili ng “dinadalaw” ang leksikal na ambiguwidad ng פקד sa halip na lubusang limitahan ito sa mapanupil na pagbabantay.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Ginamit ang “dinadalaw” upang panatilihin ang lawak ng Hebreong פקד, at “sinusuri” upang ihatid ang masusing pagsisiyasat nang hindi pinapahina ang mapait na retorika ni Job.
