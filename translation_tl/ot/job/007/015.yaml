translation:
  language: tl
  text: Kaya pinipili ng aking kaluluwa ang pagkasakal[a], ang kamatayan kaysa sa aking mga buto.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “pagkabulunan” o “pagkapigil ng hininga.”
    reason: lexical_alternative
  - marker: b
    text: 'Literal, “kamatayan mula sa aking mga buto.” Maaaring pahambing ang gamit ng “mula sa” rito: mas pinipili niya ang kamatayan kaysa sa patuloy na pag-iral sa kaniyang naghihirap na katawan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּבְחַר
  choice: pinipili
  rationale: Ang pandiwang בחר ay nangangahulugang “pumili.” Ang aspektong pandiwa at daloy ng tula ay maaaring katawanin ng pangkasalukuyang “pinipili,” habang nananatiling posible ang “pipiliin” ayon sa konteksto.
- source_word: מַחֲנָק
  choice: pagkasakal
  rationale: Tumutukoy ang pangngalan sa pagsakal, pagkabulunan, o pagkawala ng hininga. Pinananatili ng “pagkasakal” ang tahasan at marahas na larawan ng Hebreo.
- source_word: נַפְשִׁי
  choice: aking kaluluwa
  rationale: Maaaring tumukoy ang נֶפֶשׁ sa kaluluwa, sarili, o buhay. Pinananatili rito ang Hebreong paraan ng pagsasalita at ang matinding personal na himig, nang hindi itinatago ang posibleng kahulugang “ako” o “aking buhay.”
- source_word: מָוֶת
  choice: kamatayan
  rationale: Karaniwan at tuwirang katumbas ng מָוֶת.
- source_word: מֵעַצְמוֹתָי
  choice: kaysa sa aking mga buto
  rationale: 'Literal itong “mula sa aking mga buto,” ngunit malamang na paghahambing ang gamit ng מִן dito: mas pinipili ni Job ang kamatayan kaysa sa patuloy na pag-iral sa kaniyang naghihirap na katawan. Pinanatili ang larawang “mga buto” sa halip na gawing “katawan.”'
