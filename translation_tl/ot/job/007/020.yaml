base_translation:
  language: en
  yaml_path: translation/ot/job/007/020.yaml
  text: If I have sinned[a], what can I do to you, watcher of mankind? Why have you made me your target[c][b], so that I have become a burden to myself?
translation:
  language: tl
  text: Kung nagkasala man ako,[a] ano ang magagawa ko sa iyo, ikaw na tagapagmasid sa sangkatauhan? Bakit mo ako ginawang puntirya mo,[b] kaya naging pabigat ako sa sarili ko?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa literal: “Nagkasala ako.” Maaaring unawain ang pahayag bilang retorikal na pagpapalagay sa kontekstong ito.'
    reason: discourse_ambiguity
  - marker: b
    text: 'Maaari ring isalin: “ginawang isang puntirya para sa iyo.”'
    reason: lexical_alternative
  - marker: c
    text: 'Hebreo: “pabigat sa sarili ko.” Ang ilang sinaunang salin ay nagpapahiwatig ng “pabigat sa iyo.”'
    reason: alternative_reading
lexical_decisions:
- source_word: חָטָאתִי
  choice: Kung nagkasala man ako
  rationale: Ang anyo ay ganap na unang panauhang isahan, literal na “Nagkasala ako.” Gayunman, sa konteksto ng retorikal na pagtutol ni Job, ipinahihiwatig ng “kung… man” ang mapagpalagay na pag-amin nang hindi ito ginagawang tahasang pagtatapat.
- source_word: מָה אֶפְעַל לָךְ
  choice: ano ang magagawa ko sa iyo
  rationale: 'Likas sa Filipino at pinananatili ang retorikal na diwa: ano nga ba ang magagawa ni Job na makaaapekto sa Diyos?'
- source_word: נֹצֵר הָאָדָם
  choice: Tagapagmasid sa sangkatauhan
  rationale: Maaaring mangahulugan ang נֹצֵר ng nagbabantay, nag-iingat, o nagmamasid. Sa reklamo ni Job, pinananatili ng “Tagapagmasid” ang tensiyon sa pagitan ng mapag-ingat na pagbabantay at masusing pagmamatyag. Ang הָאָדָם ay pangkalahatang katawagan sa sangkatauhan.
- source_word: לָמָה שַׂמְתַּנִי לְמִפְגָּע לָךְ
  choice: Bakit mo ako ginawang puntirya mo
  rationale: Ang מִפְגָּע ay maaaring tumukoy sa bagay na sinasalubong o tinatamaan. Ang “puntirya” ay malinaw at natural sa Filipino, at ang לָךְ ay likas na naipahayag sa “mo.”
- source_word: וָאֶהְיֶה עָלַי לְמַשָּׂא
  choice: kaya naging pabigat ako sa sarili ko
  rationale: Ang Masoretikong עָלַי ay pinakanatural na nangangahulugang “sa sarili ko” o “sa ibabaw ko.” Pinananatili ito bilang mas mahirap ngunit matibay na pagbasa; inilagay sa talababa ang pagbasa ng ilang sinaunang salin.
theological_decisions:
- issue: Kung tahasang pagtatapat ba o retorikal na pagpapalagay ang חָטָאתִי
  choice: Kung nagkasala man ako
  alternative: Nagkasala ako
  rationale: Hindi binabago ang ideya ng pagkakasala, ngunit inililitaw ang mapagpalagay at mapangatuwirang puwersa ng pahayag sa konteksto ng reklamo ni Job.
- issue: Saklaw ng הָאָדָם
  choice: sangkatauhan
  alternative: tao
  rationale: Pangkalahatan ang isahang Hebreo at tumutukoy sa sangkatauhan, hindi lamang sa isang lalaki. Natural at hindi eksklusibo ang “sangkatauhan” sa modernong Filipino.
- issue: Tinutukoy ng panghalip sa huling parirala
  choice: sa sarili ko
  alternative: sa iyo
  rationale: “Sa sarili ko” ang pagbasa ng Masoretikong teksto. Ang “sa iyo” ay nasasalamin sa ilang sinaunang salin ngunit hindi dapat ipalit nang walang pahiwatig sa pangunahing teksto.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “Tagapagmasid” upang mapanatili ang dobleng diwa ng pag-iingat at masusing pagmamatyag, at “puntirya” bilang karaniwan at malinaw na salita. Nasa pangunahing teksto ang lahat ng marker na [a], [b], at [c].
