  verdict: revise
  source_fidelity: 'Ang draft ay pangkalahatang tapat sa Hebreo: naipapahayag ang temporal na panaghoy, ang paghiling na alisin ang titig, ang pag-iwan/pagluwag, at ang idyoma ng paglunok ng laway. Gayunman, ang “bago mo ilayo” ay mas madaling marinig bilang pag-asam sa isang positibong kilos sa hinaharap kaysa bilang tuwirang pagpapatuloy ng negadong tanong sa Hebreo. Mas malinaw na panatilihin ang “hindi mo aalisin.”'
  naturalness: Marangal at natural ang rehistro, ngunit mas tuwiran at mas natural sa modernong Filipino ang “Hanggang kailan mo hindi aalisin ang iyong tingin sa akin” kaysa “Gaano pa katagal bago mo ilayo sa akin ang iyong tingin.” Ang “ang laway ko” ay mas idiomatiko kaysa “ang sarili kong laway” nang hindi nawawala ang kahulugang posesibo.
  terminology: Wasto ang “tingin,” “pababayaan,” at “laway.” Ang “pababayaan” ay akmang katumbas sa kontekstong ito ng paghiling na tigilan o lubayan siya, nang hindi nagdaragdag ng doktrinal na pagbasa.
