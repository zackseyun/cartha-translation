lexical_decisions:
- source_word: כַּמָּה
  choice: Gaano pa katagal
  rationale: Sa konteksto ng panaghoy, nagpapahayag ito ng reklamong temporal; natural sa makabagong Tagalog ang “Gaano pa katagal.”
- source_word: תִשְׁעֶה מִמֶּנִּי
  choice: bago mo ilayo sa akin ang iyong tingin
  rationale: Ang pandiwa ay tumutukoy sa pagbaling o pagtuon ng tingin. Hinihiling ni Job na ihinto ng Diyos ang masusing pagmamasid sa kaniya; pinananatili ng salin ang larawang ito.
- source_word: תַרְפֵּנִי
  choice: pabayaan ako
  rationale: Ang Hiphil ng רפה ay may diwang magluwag, bumitaw, o tumigil. Ang “pabayaan ako” ay natural at tumutugma sa pakiusap na bigyan siya ng sandaling pahinga.
- source_word: עַד
  choice: kahit hanggang sa
  rationale: Itinatakda nito ang hangganan ng napakaikling pahingang hinihingi ni Job; idinagdag ang “kahit” upang maging natural ang retorikal na tanong sa Tagalog nang hindi binabago ang diwa.
- source_word: בִּלְעִי רֻקִּי
  choice: malunok ko ang sarili kong laway
  rationale: Pinananatili nito ang kongkreto at matapang na idyoma ng Hebreo para sa napakaikling sandali. Mas natural sa Tagalog ang “laway” kaysa sa teknikal na “saliva.”
