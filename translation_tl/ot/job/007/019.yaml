  - severity: low
    issue: Iisang talababa ang nakapuwesto lamang sa “tingin” ngunit nagpapaliwanag din sa hulíng idyoma.
    rationale: Mas malinaw ang mga sanggunian kung magkahiwalay ang talababa para sa leksikal na alternatibo ng “tingin” at para sa idyoma ng “paglunok ng laway.”
