- from: Gaano pa katagal bago mo ilayo sa akin ang iyong tingin[a] at pabayaan ako kahit hanggang sa malunok ko ang sarili kong laway?
  to: Hanggang kailan mo hindi aalisin ang iyong tingin sa akin[a] at hindi mo ako pababayaan kahit hanggang sa malunok ko ang laway ko[b]?
  rationale: Inayos ang unang sugnay upang tuwirang maipakita ang negadong retorikal na tanong ng Hebreo. Pinasimple ang pagpapahayag ng posesibong “laway” sa natural na Filipino. Pinaghiwalay ang mga talababa upang ang bawat isa ay malinaw na nakaangkla sa salitang o idyomang ipinapaliwanag nito.
