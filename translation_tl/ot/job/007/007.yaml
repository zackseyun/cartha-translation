source:
  edition: WLC
  text: זְ֭כֹר כִּי ר֣וּחַ חַיָּ֑/י לֹא תָשׁ֥וּב עֵ֝ינִ֗/י לִ/רְא֥וֹת טֽוֹב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/007/007.yaml
  text: Remember that my life is a breath[b][a]; my eye will not return to see good.
translation:
  language: tl
  text: Alalahanin mong ang buhay ko ay hininga[a]; hindi na muling makakakita ng mabuti ang mata ko.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “hangin.” Ang Hebreong רוּחַ ay maaaring mangahulugang “hininga,” “hangin,” o “espiritu”; dito, inilalarawan nito ang mabilis na paglipas ng buhay.
    reason: lexical_alternative
  - marker: b
    text: O “hindi na muling makararanas ng kaginhawahan o kasaganaan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: זְכֹר
  choice: Alalahanin mo
  rationale: Tuwirang pautos na panlalaking isahan na nakatuon sa Diyos sa konteksto. Likas sa modernong Tagalog ang “Alalahanin mo” at nananatili ang lakas ng pakiusap.
- source_word: כִּי
  choice: -ng / na
  rationale: Ipinakikilala nito ang nilalaman ng dapat alalahanin; likas itong naipapahayag sa Tagalog sa pamamagitan ng pang-angkop sa “Alalahanin mong.”
- source_word: רוּחַ
  choice: hininga
  rationale: Maaaring mangahulugang “hininga,” “hangin,” o “espiritu.” Sa panaghoy na ito, ang “hininga” ang pinakamalinaw na naghahayag ng ikli at paglipas ng buhay nang hindi ipinapasok ang diwang antropolohikal ng “espiritu.”
- source_word: חַיָּי
  choice: ang buhay ko
  rationale: Natural at malinaw na katumbas ng anyong may hulaping unang panauhang isahan.
- source_word: לֹא תָשׁוּב
  choice: hindi na muling
  rationale: Kasama ng “makakakita,” ipinahahayag nito na hindi na babalik o mauulit ang pagkakita. Mas natural sa Tagalog ang “hindi na muling makakakita” kaysa sa literal na “hindi babalik upang makakita.”
- source_word: עֵינִי
  choice: ang mata ko
  rationale: Pinananatili ang isahang bilang ng Hebreo at ang makatang tayutay nito.
- source_word: לִרְאוֹת
  choice: makakakita
  rationale: Ang diwang “upang makakita” ay natural na naisasama sa Tagalog na pandiwang panghinaharap na “makakakita.”
- source_word: טוֹב
  choice: mabuti
  rationale: Pinananatili ang lawak ng kahulugan ng Hebreong salita, na maaaring tumukoy sa kabutihan, kaginhawahan, o kasaganaan.
theological_decisions:
- issue: Kung literal na pagkakita o pagdanas ng kabutihan ang tinutukoy
  choice: Pinanatili sa pangunahing teksto ang “makakakita ng mabuti.”
  alternative: “makararanas pa ng kaginhawahan/kasaganaan”
  rationale: Ang Hebreo ay gumagamit ng “mata” at “makakita,” ngunit ang parirala ay maaari ring tumukoy sa pagdanas ng kagalingan. Pinananatili ng salin ang kongkretong larawan at inilalahad sa talababa ang posibleng idyomatikong diwa.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang isahang “mata” at ang malawak na “mabuti,” habang ginawang natural ang Hebreong pariralang “hindi babalik ang mata ko upang makakita” bilang “hindi na muling makakakita ... ang mata ko.”
