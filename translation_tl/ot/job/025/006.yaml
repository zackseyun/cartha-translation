  text: אַ֭ף כִּֽי אֱנ֣וֹשׁ רִמָּ֑ה וּ/בֶן אָ֝דָ֗ם תּוֹלֵעָֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/job/025/006.yaml
  text: how much less man[a], who is a maggot, and the son of man[b], who is a worm!
translation:
  language: tl
  text: Gaano pa kaya ang tao[a], na isang uod, at ang anak ng tao[b], na isang bulati!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “taong mortal”; madalas idiin ng salitang Hebreo ang kahinaan at pagiging mortal ng tao.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “anak ng tao”; isang patulang tawag ito sa isang tao rito, hindi isang mesiyanikong titulo.
    reason: cultural_note
lexical_decisions:
- source_word: אַף כִּי
  choice: Gaano pa kaya
  rationale: Ipinagpapatuloy ng idyoma ang pangangatwirang mula sa mas matindi tungo sa mas mababa sa naunang talata. Likas sa Filipino ang “Gaano pa kaya” at pinananatili nito ang nakabitin na anyong patula ng Hebreo, na umaasa sa naunang pahayag.
- source_word: אֱנוֹשׁ
  choice: tao
  rationale: Tumutukoy ito sa tao bilang mahina at mortal. Ang “tao” ay payak at likas, habang inilalahad sa talababa ang posibleng mas tahasang “taong mortal.”
- source_word: רִמָּה
  choice: uod
  rationale: Karaniwang tumutukoy ang salita sa uod na kaugnay ng pagkabulok. “Uod” ang pinakanatural na katumbas sa Filipino at inihihiwalay ito rito sa kasunod na תּוֹלֵעָה.
- source_word: בֶן אָדָם
  choice: ang anak ng tao
  rationale: Pinananatili ng literal na anyo ang paralelismong patula at himig ng Hebreo. Sa kontekstong ito, karaniwang tao ang ibig sabihin, hindi isang titulo.
- source_word: תּוֹלֵעָה
  choice: bulati
  rationale: Mas malawak itong katawagan para sa worm. Ginamit ang “bulati” upang mapanatili ang pagkakaiba nito sa רִמָּה na isinaling “uod,” bagaman magkalapit ang saklaw ng dalawang salitang Filipino.
theological_decisions:
- issue: Kung ang “anak ng tao” ay isang mesiyanikong titulo
  choice: Idyomang patula para sa isang tao
  alternative: Mesiyanikong titulo
  rationale: Nakaparis ang בֶן אָדָם sa אֱנוֹשׁ at kapwa inilalarawan ang kahinaan ng tao. Walang batayan sa kontekstong ito upang gawin itong natatanging titulo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang maigsi at matinding paralelismo ng tulang Hebreo, pati ang dalawang magkaibang katawagan para sa nilalang na parang uod.
