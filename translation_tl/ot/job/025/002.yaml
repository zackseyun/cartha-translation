  text: Dominion and dread are with him[b][a]; he makes peace in his heights.
translation:
  language: tl
  text: Nasa kanya ang paghahari at panghihilakbot[a]; siya ang gumagawa ng kapayapaan sa kanyang matataas na dako[b].
  philosophy: optimal-equivalence
  footnotes:
