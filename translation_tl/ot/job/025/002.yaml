    reason: lexical_alternative
lexical_decisions:
- source_word: הַמְשֵׁל
  choice: ang paghahari
  rationale: Ang pangngalan mula sa משל ay tumutukoy sa pamamahala o kapangyarihang maghari. Likas sa modernong Tagalog ang “paghahari” at napapanatili nito ang abstraktong diwa ng Hebreo.
- source_word: וָפַחַד
  choice: at panghihilakbot
  rationale: Ang פחד ay maaaring mangahulugang takot, sindak, o panghihilakbot. Ang “panghihilakbot” ay nagpapahayag ng matinding takot na dulot ng dakilang kapangyarihan nang hindi agad ipinapakahulugang simpleng paggalang.
- source_word: עִמּוֹ
  choice: Nasa kanya
  rationale: Literal itong “kasama/nasa kanya.” Sa sugnay na walang hayag na pandiwa, pinananatili ng “nasa kanya” ang attendant o locative na larawan at hindi tahasang nilulutas bilang pag-aari lamang.
- source_word: עֹשֶׂה
  choice: lumilikha siya
  rationale: Ang participle ng עשה ay nagsasaad ng katangian o patuloy na gawain. Ang “lumilikha” ay natural sa pariralang “lumilikha ng kapayapaan” at hindi kasing-interpretatibo ng “nagtatatag.”
- source_word: שָׁלוֹם
  choice: kapayapaan
  rationale: Saklaw ng שׁלום ang kapayapaan, kabuuan, at kaayusan. “Kapayapaan” ang pinakanatural na pangunahing katumbas at angkop sa kosmikong konteksto.
- source_word: בִּמְרוֹמָיו
  choice: sa kanyang matataas na dako
  rationale: Ang מרום ay taas o mataas na lugar. Pinananatili ng “matataas na dako” ang maramihan at matayog na larawang patula nang hindi pinakikitid ang kahulugan tungo lamang sa “kalangitan.”
theological_decisions:
- issue: Kalikasan ng pambungad na sugnay
  choice: Ang paghahari at panghihilakbot ay nasa kanya
  alternative: Sa kanya ang paghahari at panghihilakbot / pag-aari niya ang mga ito
  rationale: Maaaring unawain ang Hebreong sugnay na walang pandiwa bilang attendant o locative (“nasa/kasama niya”) o bilang pag-aari (“sa kanya”). Pinananatili ng pangunahing salin ang mas lantad na larawan ng עִמּוֹ, habang inilalagay sa talababa ang posibleng possessive na diwa.
translation_notes:
  register: Makabago ngunit marangal at patulang Tagalog. Pinanatili ang maigsi at balanseng estruktura ng Hebreo, pati ang kalabuan ng עִמּוֹ at ang matayog na larawang ipinahihiwatig ng בִּמְרוֹמָיו.
