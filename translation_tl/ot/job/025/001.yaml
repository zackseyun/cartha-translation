  text: 'Sumagot si Bildad na Suhita at sinabi niya:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַן
  choice: Sumagot
  rationale: Sa pormulang pambungad ng usapan, ang ענה ay likas na isinasaling “sumagot”; pinananatili nito ang diyalogong daloy ng teksto.
- source_word: בִּלְדַּד
  choice: Bildad
  rationale: Isinalin sa baybay na karaniwang ginagamit sa Filipino para sa pangalang pantangi.
- source_word: הַשֻּׁחִי
  choice: na Suhita
  rationale: Ipinahahayag ng katawagang gentiliko ang angkan o pinagmulan ni Bildad. Ang “Suhita” ay natural na anyong Filipino ng tradisyonal na Shuhite.
- source_word: וַיֹּאמַר
  choice: at sinabi niya
  rationale: Ang אמר sa karaniwang pormulang pasalaysay ay “sinabi.” Pinanatili ang ikalawang pandiwa sa Hebreong “sumagot … at sinabi,” sa halip na paikliin bilang “na nagsasabi.”
- source_word: וַיַּעַן ... וַיֹּאמַר
  choice: Sumagot ... at sinabi niya
  rationale: Pinananatili ang pormal at paulit-ulit na Hebreong pambungad sa pagsasalita, habang natural pa rin ang ayos sa modernong Filipino.
