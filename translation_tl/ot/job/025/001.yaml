  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang pormulang Hebreo na may dalawang pandiwa, kahit maaari itong paikliin sa mas karaniwang “sumagot,” upang katawanin ang anyo ng pinagmulan.
