  text: וּ/מַה יִּצְדַּ֣ק אֱנ֣וֹשׁ עִם אֵ֑ל וּ/מַה יִּ֝זְכֶּ֗ה יְל֣וּד אִשָּֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/025/004.yaml
  text: So how can man be righteous before God? And how can one born of woman be pure?[a][b]
translation:
  language: tl
  text: Kaya paano magiging matuwid ang tao sa harap ng Diyos?[a] At paano magiging dalisay ang isinilang ng babae?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kasama ng Diyos.” Literal sa Hebreo ang “kasama ng Diyos,” ngunit maaari itong tumukoy sa katayuan ng isang tao sa harap niya.
    reason: lexical_alternative
  - marker: b
    text: O “malinis” o “walang-sala.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמַה
  choice: Kaya paano
  rationale: Ang pang-ugnay at pananong ay nagpapakilala ng retorikal na tanong na nakaugnay sa naunang pahayag. Likas sa modernong Tagalog ang “Kaya paano” sa kontekstong ito.
- source_word: יִצְדַּק
  choice: magiging matuwid
  rationale: Ang Qal ng צדק ay tumutukoy sa pagiging matuwid o nasa tama. Pinananatili ng “magiging matuwid” ang kalagayang inilalarawan nang hindi labis na nililimitahan ito sa teknikal na ideya ng pagpapawalang-sala.
- source_word: אֱנוֹשׁ
  choice: ang tao
  rationale: Tumutukoy ang אֱנוֹשׁ sa mortal at marupok na tao. Natural at pangkalahatan sa Tagalog ang “ang tao,” habang ang konteksto ang nagpapahiwatig ng kahinaan ng sangkatauhan.
- source_word: עִם אֵל
  choice: sa harap ng Diyos
  rationale: Literal na “kasama ng Diyos,” ngunit sa tanong tungkol sa katuwiran, ang parirala ay tumutukoy sa katayuan ng tao kaugnay ng Diyos. Natural sa Tagalog ang “sa harap ng Diyos,” at hindi nito labis na tinutukoy kung paghuhukom o paghahambing ang diin.
- source_word: יִזְכֶּה
  choice: magiging dalisay
  rationale: Ang זכה sa Qal ay nangangahulugang maging malinis o dalisay, at maaari ring magpahiwatig ng kawalang-sala. Ang “dalisay” ay natural na kaagapay ng “matuwid” at pinananatili ang moral at ritwal na lawak ng salita.
- source_word: יְלוּד אִשָּׁה
  choice: ang isinilang ng babae
  rationale: Ang idyoma ay tumutukoy sa sinumang tao bilang mortal na nilalang. Pinananatili ng salin ang konkretong larawan at pangkalahatang saklaw nang hindi nagdaragdag ng “anak na lalaki.”
theological_decisions:
- issue: Pangkalahatang katawagan para sa sangkatauhan
  choice: ang tao … ang isinilang ng babae
  alternative: ang mortal … ang sinumang isinilang ng babae
  rationale: Ang mga anyong isahan sa Hebreo ay kumakatawan sa sangkatauhan sa pangkalahatan. Likas at inklusibo sa modernong Tagalog ang “ang tao,” at pinananatili ng ikalawang parirala ang orihinal na idyoma.
- issue: Relasyonal o panghukuman na diwa ng katayuan ng tao kaugnay ng Diyos
  choice: sa harap ng Diyos
  alternative: kasama ng Diyos
  rationale: Bagaman literal na “kasama ng Diyos” ang pang-ukol, itinatanong ng talata kung paano maituturing na matuwid ang tao kaugnay ng Diyos. Inilalahad ng “sa harap ng Diyos” ang posibleng panghukuman na diwa nang hindi ginagawang tiyak ang isang mas makitid na doktrina.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang balanseng paralelismo ng “magiging matuwid” at “magiging dalisay,” at pinanatili sa mga talababa ang mahahalagang alternatibong kahulugan.
