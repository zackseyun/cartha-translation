  text: Is there any number to his troops? And upon whom does his light not rise?[a][b][c]
translation:
  language: tl
  text: May bilang ba ang kanyang mga hukbo?[a] At kanino hindi sumisikat ang kanyang liwanag?[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “kanyang mga pulutong” o “kanyang mga pangkat ng mandirigma.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “At kanino hindi lumilitaw ang kanyang liwanag?”
    reason: lexical_alternative
  - marker: c
    text: Ang “kanyang liwanag” ay maaaring tumukoy sa liwanag na mula sa Diyos, sa kanyang kaningningan, o sa lawak ng naaabot niya; hindi ito higit na nililinaw ng Hebreo.
    reason: alternative_reading
lexical_decisions:
- source_word: הֲיֵשׁ מִסְפָּר
  choice: May bilang ba
  rationale: Natural na tanong na eksistensiyal sa Filipino; pinananatili ang tuwirang diwa ng ‘mayroon bang bilang/bilangin.’
- source_word: לִגְדוּדָיו
  choice: ang kanyang mga hukbo
  rationale: Ang גְּדוּד ay maaaring tumukoy sa mga pangkat ng mandirigma, hukbo, o pulutong. Ang ‘mga hukbo’ ay malinaw at angkop sa marangal na rehistro ng paglalarawan sa kapangyarihan ng Diyos.
- source_word: וְעַל־מִי
  choice: At kanino
  rationale: Idyomatikong Filipino para sa literal na ‘at sa/ibabaw kanino,’ nang hindi pinabibigat ang pangungusap.
- source_word: לֹא יָקוּם
  choice: hindi sumisikat
  rationale: Ang קוּם ay ‘bumangon/tumindig’; kapag liwanag ang simuno, natural sa Filipino ang ‘sumisikat,’ bagaman maaari ring isaling ‘lumilitaw’ o ‘bumabangon.’
- source_word: אוֹרֵהוּ
  choice: ang kanyang liwanag
  rationale: Tuwirang pinananatili ang ‘liwanag’ at ang panghalip na panlalaki, nang hindi nililimitahan kung ito ay literal na liwanag, kaningningan, o sagisag ng abot ng Diyos.
theological_decisions:
- issue: Tinutukoy ng mga hulaping panlalaki sa ‘kanyang mga hukbo’ at ‘kanyang liwanag’
  choice: Pinanatili ang ‘kanyang,’ na sa konteksto ay tumutukoy sa Diyos.
  alternative: Tahasang sabihing ‘mga hukbo ng Diyos’ at ‘liwanag ng Diyos.’
  rationale: Ang naunang talata ay tungkol sa paghahari at kapangyarihan ng Diyos, ngunit mas tapat sa Hebreo na panatilihin ang panghalip kaysa palitan ito ng tahasang pangngalan.
- issue: Kahulugan ng ‘kanyang liwanag’
  choice: Pinanatiling malawak at hindi tinukoy ang ‘liwanag.’
  alternative: Tukuyin ito bilang sikat ng araw, banal na kaningningan, o pagpapala ng Diyos.
  rationale: Hindi nililinaw ng Hebreo kung pisikal o matalinghaga ang liwanag; kaya hindi dapat tahimik na paliitin ang kahulugan nito.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang ‘hukbo’ at ‘liwanag’ upang mapanatili ang matayog na larawan, habang ang ayos ng tanong ay ginawang natural sa Tagalog.
