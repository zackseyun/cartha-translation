  source_fidelity: 'Tumpak na naihahatid ang Hebreong diin: ang הֵן ay mariing panawag-pansin, ang עַד ay pasidhi na “kahit,” ang buwan ay “hindi nagliliwanag,” at ang mga bituin ay “hindi dalisay” sa pananaw ng tinutukoy na lalaki, na sa konteksto ay Diyos. Hindi nito pinipilit ang kalabuan ng לֹא זַכּוּ sa iisang literal na pisikal na kahulugan; ang mga makatwirang alternatibo ay nasa talababa.'
  naturalness: Ang “Masdan, kahit ang buwan ay hindi nagliliwanag” ay malinaw, makabago, at angkop sa matayog na patulang rehistro. Ang “sa kanyang paningin” ay likas na Tagalog para sa Hebreong idyoma ng pagtataya.
  terminology: Ang “dalisay” ay angkop para sa זַכּוּ sa kontekstong ito at hindi nagpapataw ng partikular na doktrinang pakahulugan. Ang “buwan,” “mga bituin,” at “kanyang paningin” ay pare-pareho at malinaw. Maayos ding nakapreserba sa mga talababa ang “malinis” at “maningning” bilang mga leksikal na posibilidad.
