id: JOB.25.5
reference: Job 25:5
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: הֵ֣ן עַד יָ֭רֵחַ וְ/לֹ֣א יַאֲהִ֑יל וְ֝/כוֹכָבִ֗ים לֹא זַכּ֥וּ בְ/עֵינָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/025/005.yaml
  text: Behold[a], even the moon does not shine[b], and the stars are not pure in his eyes.
translation:
  language: tl
  text: Masdan, kahit ang buwan ay hindi nagliliwanag[a], at ang mga bituin ay hindi dalisay sa kanyang paningin.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “hindi maningning” o “hindi nagbibigay-liwanag.”
    reason: lexical_alternative
  - marker: b
    text: O “hindi malinis”; maaari ring “hindi maningning” sa kanyang paningin.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Masdan
  rationale: Nagbibigay ito ng mariing panawag-pansin at nagpapanatili ng marangal at patulang himig nang hindi gumagamit ng lipas na pananalita.
- source_word: עַד
  choice: kahit
  rationale: Sa pariralang ito, nagpapasidhi ito sa tinutukoy na pangngalan—‘kahit ang buwan’—sa halip na magpahayag ng layo o panahon.
- source_word: יָרֵחַ
  choice: ang buwan
  rationale: Tuwirang tumutukoy sa buwan bilang bagay sa kalangitan.
- source_word: לֹא יַאֲהִיל
  choice: hindi nagliliwanag
  rationale: Natural sa makabagong Tagalog at malinaw na naghahatid ng diwa ng pagbibigay-liwanag o pagningning; pinananatili sa talababa ang posibleng paglalarawang ‘hindi maningning.’
- source_word: וְכוֹכָבִים
  choice: at ang mga bituin
  rationale: Tuwirang ipinagpapatuloy ang magkaugnay na larawang makalangit.
- source_word: לֹא זַכּוּ
  choice: hindi dalisay
  rationale: Pinananatili ang pangunahing diwa ng kadalisayan sa konteksto ng pagsusuri sa harap ng Diyos, habang inilalagay sa talababa ang mga posibleng diwang ‘malinis’ at ‘maningning.’
- source_word: בְעֵינָיו
  choice: sa kanyang paningin
  rationale: Likas na idyomang Tagalog para sa pagtataya mula sa pananaw ng isang tao at malinaw na tumutukoy sa pagsusuri ng Diyos sa konteksto.
theological_decisions:
- issue: Tinutukoy ng hulaping ikatlong panauhang panlalaki sa בְעֵינָיו
  choice: Ang ‘kanyang’ ay tumutukoy sa Diyos.
  alternative: Maaaring tumukoy sa isang di-tiyak na tagamasid sa patulang pangangatwiran.
  rationale: Sa Job 25:2–6, ang sinasabi ni Bildad ay tungkol sa kadakilaan ng Diyos at sa kakulangan ng nilalang sa harap niya; kaya ang Diyos ang pinakalikas na tinutukoy. Hindi na idinagdag ang pangalang ‘Diyos’ sa mismong talata upang mapanatili ang anyo ng Hebreo.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog na may patulang himig. Ginamit ang ‘Masdan’ bilang mariing panawag-pansin, at pinanatili sa mga talababa ang tunay na leksikal na kalabuan ng mga pandiwa at paglalarawan.
