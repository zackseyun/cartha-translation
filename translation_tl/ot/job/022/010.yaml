  text: Therefore snares are all around you[a], and sudden terror terrifies you.
translation:
  language: tl
  text: 'Kaya napalilibutan ka ng mga bitag,

    at bigla kang sinisindak ng takot.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עַל כֵּן
  choice: Kaya
  rationale: Naghahayag ito ng bunga o konklusyon mula sa naunang paratang; natural at tuwiran ang “Kaya” sa makabagong Tagalog.
- source_word: סְבִיבוֹתֶיךָ
  choice: napalilibutan ka
  rationale: Ipinahahayag ang kalagayang ang mga panganib ay nasa buong paligid ng kausap; ang anyong ito ay natural kasama ng “mga bitag.”
- source_word: פַחִים
  choice: mga bitag
  rationale: Ang פח ay patibong o bitag. Karaniwan at malinaw ang “mga bitag” habang pinananatili ang matalinghagang panganib.
- source_word: וִיבַהֶלְךָ
  choice: sinisindak ka
  rationale: Ang בהל ay mang-gulat, manindak, o magdala sa pagkataranta. Tuwirang pandiwa ang “sinisindak” at pinananatili ang matinding epekto ng takot.
- source_word: פַּחַד
  choice: takot
  rationale: Maaaring mangahulugang takot, sindak, o pangamba. Ang “takot” ay malawak at karaniwang salita, samantalang ang tindi ay naipahahayag na ng pandiwang “sinisindak.”
- source_word: פִּתְאֹם
  choice: bigla
  rationale: Pinananatili ang pang-abay na diwa ng biglaang pagdating ng takot at ang mariing ayos ng ikalawang sugnay.
