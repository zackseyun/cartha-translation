  yaml_path: translation/ot/job/022/021.yaml
  text: Come to terms with him, please, and be at peace; by this good will come to you.
translation:
  language: tl
  text: Makipagkasundo ka na sa kanya at mamuhay nang payapa; sa ganitong paraan, darating sa iyo ang mabuti.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַסְכֶּן
  choice: Makipagkasundo
  rationale: Ang pandiwa ay maaaring tumukoy sa pagiging pamilyar o pagkakaroon ng maayos na pakikitungo sa isang tao; sa konteksto ng panawagang manumbalik sa Diyos, natural na naihahatid ng “makipagkasundo” ang diwa nang hindi tahasang pinapalitan ang panghalip ng “Diyos.”
- source_word: נָא
  choice: na
  rationale: Ginagamit ang modernong Tagalog na “na” upang ipahayag ang mapakiusap at mapanghikayat na puwersa ng particle, sa halip na gawing matigas na utos ang pangungusap.
- source_word: וּשְׁלם
  choice: at mamuhay nang payapa
  rationale: Ipinapahayag nito ang utos na maging payapa o nasa kapayapaan sa natural na Tagalog.
- source_word: בָּהֶם
  choice: sa ganitong paraan
  rationale: Literal itong pangmaramihang “sa pamamagitan ng mga ito/sa mga ito,” na malamang na tumutukoy sa naunang mga panawagan. Ang idiomatikong salin ay nagpapanatili ng ugnayang instrumental nang hindi lumilikha ng malabong panghalip sa Tagalog.
- source_word: תְּבוֹאַתְךָ טוֹבָה
  choice: darating sa iyo ang mabuti
  rationale: Pinananatili ang payak na ayos at malawak na kahulugan ng “mabuti,” sa halip na tukuyin ito bilang materyal na pagpapala o ibang mas makitid na konsepto.
theological_decisions:
- issue: Ang tinutukoy ng panghalip na עִמּוֹ
  choice: sa kanya
  alternative: sa Diyos
  rationale: Bagaman Diyos ang malamang na tinutukoy sa konteksto, pinananatili ng salin ang panghalip ng tekstong Hebreo at hindi tahasang nilulutas ang reperensiya nito.
- issue: Ugnayan ng pagsunod at pagdating ng mabuti
  choice: sa ganitong paraan, darating sa iyo ang mabuti
  alternative: dahil dito, pagpapalain ka
  rationale: Pinananatili ang pahayag ni Elifaz bilang payo at pangako sa loob ng kaniyang talumpati, nang hindi pinalalakas ito bilang pangkalahatang doktrina ng materyal na gantimpala.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “makipagkasundo” at “mamuhay nang payapa” upang maging natural sa karaniwang mambabasa habang pinananatili ang mapakiusap na tono at ang panghalip ng orihinal.
