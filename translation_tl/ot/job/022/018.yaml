  text: Yet he filled their houses with good things[b][a], but the counsel of the wicked is far from me.
translation:
  language: tl
  text: Gayunman, pinuno niya ng mabubuting bagay ang kanilang mga bahay[a], ngunit malayo sa akin ang payo ng masasama.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, sa di-gaanong literal na salin, “ng kasaganaan.” Ang Hebreo ay nagsasabing “ng mabuti,” na malamang ay tumutukoy sa mabubuting bagay o mga pakinabang.
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring isalin, “Nawa’y malayo sa akin ang payo ng masasama.” Gayunman, mas tuwirang mababasa ang Hebreo bilang isang pahayag: “malayo sa akin ang payo ng masasama.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהוּא
  choice: Gayunman, … niya
  rationale: Ipinahihiwatig ng pangatnig at tahasang panghalip ang pagsalungat sa saloobin ng masasama sa naunang konteksto. Likas sa Filipino ang “Gayunman,” habang ang “niya” ay tumutukoy sa Diyos.
- source_word: מִלֵּא
  choice: pinuno
  rationale: Tuwirang katumbas ng pandiwang “punuin”; ang aspektong naganap ay angkop sa makatang paglalahad.
- source_word: בָתֵּיהֶם
  choice: ang kanilang mga bahay
  rationale: Pinananatili ang konkretong larawan ng Hebreong “kanilang mga bahay,” sa halip na gawing mas interpretatibong “mga sambahayan” o “mga tahanan.”
- source_word: טוֹב
  choice: ng mabubuting bagay
  rationale: Ang “mabuti” ay ginagamit dito bilang pangngalan. Mas natural sa Filipino ang “mabubuting bagay,” samantalang ang “kasaganaan” ay posible ngunit mas interpretatibo.
- source_word: וַעֲצַת
  choice: ngunit … ang payo
  rationale: Ginawang pasalungat ang pangatnig dahil inilalayo ng ikalawang hati ang nagsasalita sa pananaw ng masasama. Saklaw ng “payo” ang diwa ng עֵצָה nang hindi ito nililimitahan sa isang lihim na balak.
- source_word: רְשָׁעִים
  choice: ng masasama
  rationale: Natural at karaniwang pangngalang gamit sa Filipino para sa maramihang pang-uring Hebreo na tumutukoy sa masasamang tao.
- source_word: רָחֲקָה מֶנִּי
  choice: malayo sa akin
  rationale: Pinananatili bilang pahayag ng paglayo o hindi pakikiisa. Ang Hebreo ay qatal, hindi pautos o jussive, kaya hindi ito isinaling bilang isang kahilingan.
theological_decisions:
- issue: Paninindigan ng nagsasalita sa huling hati ng talata
  choice: “malayo sa akin ang payo ng masasama” bilang tuwirang pahayag
  alternative: “Nawa’y malayo sa akin ang payo ng masasama” bilang hangarin o kahilingan
  rationale: Ang anyong qatal na רָחֲקָה ay mas tuwirang nagsasaad na ang payo ay malayo sa nagsasalita. Pinananatili nito ang pahayag ng hindi pakikiisa nang hindi nagdaragdag ng panalanging himig.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang konkretong “mga bahay” at ang kaigtingan ng pagsalungat sa dalawang hati. Ginamit ang “payo” sa halip na mas teknikal na “panukala,” at iniwasan ang denominasyonal o sobrang interpretatibong pananalita.
