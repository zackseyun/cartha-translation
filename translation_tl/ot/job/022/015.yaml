translation:
  language: tl
  text: Susundin mo ba ang sinaunang landas[a] na tinahak ng masasamang tao?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “landas noong unang panahon” o “napakatandang landas.” Ang ekspresyong Hebreo ay tumutukoy sa landas na matagal nang sinusundan noon, hindi naman kinakailangang sa landas na walang hanggan.
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring “masasamang tao,” “mga taong gumagawa ng kasamaan,” o “mga taong makasalanan.” Literal sa Hebreo: “mga tao ng kasamaan.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַאֹרַח
  choice: landas
  rationale: Ang אֹרַח ay daan o landas, at madalas na talinghaga para sa paraan ng pamumuhay. Pinananatili ng “landas” ang larawang ito sa natural na Filipino.
- source_word: עוֹלָם
  choice: matandang
  rationale: Sa pariralang ito, tumutukoy ang עוֹלָם sa isang landas na matagal nang sinusundan mula pa noong una, hindi kinakailangang walang hanggan.
- source_word: תִּשְׁמֹר
  choice: mananatili ka ba sa
  rationale: Bagaman ang literal na diwa ng שׁמר ay “ingatan” o “sundin,” kapag landas ang layon ay tumutukoy ito sa patuloy na pagsunod o pananatili sa isang paraan ng pamumuhay.
- source_word: אֲשֶׁר
  choice: na
  rationale: Natural na pang-ugnay sa Filipino para ipakilala ang sugnay na naglalarawan sa landas.
- source_word: דָּרְכוּ
  choice: tinahak
  rationale: Ang pandiwang דרך ay may konkretong diwang pagtapak o paglakad sa isang daan. Pinananatili ng “tinahak” ang larawan ng landas at ang natapos na pagkilos ng mga taong tinutukoy.
- source_word: מְתֵי אָוֶן
  choice: masasamang tao
  rationale: Ang parirala ay literal na “mga taong may kasamaan.” Sa konteksto, malinaw at natural na naipapahayag ng “masasamang tao” ang moral na diwa ng אָוֶן.
