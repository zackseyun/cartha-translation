  text: For then you will delight yourself in the Almighty[b][a], and lift up your face to God.
translation:
  language: tl
  text: Sapagkat kung magkagayon, malulugod ka sa Makapangyarihan[a], at itataas mo ang iyong mukha sa Diyos.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “makasusumpong ka ng kasiyahan sa Makapangyarihan.”
    reason: lexical_alternative
  - marker: b
    text: Ang “itaas ang iyong mukha sa Diyos” ay isang idyomang maaaring magpahiwatig ng pagtitiwalang lumapit, pagbabalik ng lingap, o matapang na pananalangin.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי אָז
  choice: Sapagkat kung magkagayon
  rationale: Ipinahahayag ang bunga o kinahinatnan ng naunang panawagan, habang pinananatili ang ugnayang lohikal at temporal ng dalawang salitang Hebreo.
- source_word: עַל שַׁדַּי
  choice: sa Makapangyarihan
  rationale: Ang עַל kasama ng pandiwang התענג ay tumutukoy sa pinagmumulan o layon ng kagalakan. Isinalin ang titulong שַׁדַּי sa karaniwang malinaw na katumbas nito sa Filipino.
- source_word: תִּתְעַנָּג
  choice: magagalak ka
  rationale: Likas at marangal na Filipino para sa Hitpael na nagsasaad ng personal na pagkagalak o pagkalugod; hindi pilit na ginagaya ang anyong reflexive ng Hebreo.
- source_word: וְתִשָּׂא
  choice: at itataas mo
  rationale: Pinananatili ang konkretong larawan ng pandiwang נשׂא, ‘itaas,’ sa halip na ipaliwanag agad ang ipinahihiwatig nitong pagtitiwala o pananalangin.
- source_word: אֶל אֱלוֹהַּ
  choice: sa Diyos
  rationale: Ang אֶל ay nagsasaad ng direksiyon patungo sa Diyos, at ang אֱלוֹהַּ ay payak na tumutukoy sa Diyos nang walang karagdagang titulong wala sa Hebreo.
- source_word: פָּנֶיךָ
  choice: ang iyong mukha
  rationale: Pinananatili ang literal at makatang larawan ng mukha upang hindi paliitin ang saklaw ng idyoma.
theological_decisions:
- issue: Kahulugan ng idyomang ‘itaas ang mukha sa Diyos’
  choice: Panatilihin ang konkretong idyoma
  alternative: ‘lalapit ka sa Diyos nang may tiwala,’ ‘mananalangin ka sa Diyos nang buong tapang,’ o ‘titingala ka sa Diyos’
  rationale: Maaaring magpahiwatig ang parirala ng pagtitiwala, muling pagtanggap, o matapang na paglapit sa Diyos. Ang pagpapanatili sa larawan ay umiiwas sa pagpili ng iisang kahulugan lamang.
translation_notes:
  register: Makabago at dignidad na Filipino na madaling maunawaan. Ginamit ang “kung magkagayon” upang likas na maipahayag ang bunga ng naunang kondisyon, at pinanatili ang makatang larawan ng pagtataas ng mukha.
