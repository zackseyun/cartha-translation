base_translation:
  language: en
  yaml_path: translation/ot/job/022/023.yaml
  text: If you return to the Almighty[a], you will be restored; if you put unrighteousness far from your tent[b],
translation:
  language: tl
  text: Kung manunumbalik ka sa Makapangyarihan sa Lahat, muli kang itatatag[a]; kung ilalayo mo ang kawalang-katarungan mula sa iyong tolda[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal na, “itatayo ka.” Maaari ring isalin na “muli kang itatatag” o “muli kang itatayo.” Ginagamit ang larawan ng pagtatayo bilang talinghaga ng pagpapanumbalik o muling pagtatatag.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “maling gawain,” “kawalang-matuwid,” o “kasamaan.” Ang “tolda” ay maaari ring tumukoy sa tahanan o sambahayan.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Kung
  rationale: Malinaw na nagpapakilala ng kondisyon at likas sa modernong Tagalog.
- source_word: תָּשׁוּב
  choice: manunumbalik ka
  rationale: Pinananatili ang batayang diwa ng שוב na pagbalik nang hindi ito agad pinapakahulugang eksklusibo bilang pagsisisi.
- source_word: עַד שַׁדַּי
  choice: sa Makapangyarihan sa Lahat
  rationale: Ipinahahayag ang pagkilos o pagbaling patungo sa Diyos at isinasalin ang titulong שַׁדַּי sa karaniwan at marangal na Filipino.
- source_word: תִּבָּנֶה
  choice: muli kang itatatag
  rationale: Ang Niphal ng בנה ay literal na 'itatayo' o 'muling itatayo'; sa konteksto, ang 'muling itatatag' ay natural na naghahatid ng diwa ng pagpapanumbalik habang pinananatili ang pasibong talinghaga.
- source_word: תַּרְחִיק
  choice: ilalayo mo
  rationale: 'Pinananatili ang causative na diwa: gagawin ng kausap na mapalayo ang tinutukoy na kasamaan.'
- source_word: עַוְלָה
  choice: kasamaan
  rationale: Malawak at natural na katumbas para sa moral na mali, kawalang-katarungan, o masamang gawain; hindi nito nililimitahan ang salita sa isang uri lamang ng paglabag.
- source_word: מֵאָהֳלֶךָ
  choice: sa iyong tolda
  rationale: Pinananatili ang literal na larawan ng tolda, na maaari ring tumukoy sa tahanan o sambahayan.
theological_decisions:
- issue: Kung literal o interpretatibo ang pagsasalin sa talinghaga ng pagiging 'itinayo'
  choice: muli kang itatatag
  alternative: muli kang itatayo; papanumbalikin ka
  rationale: Nananatili ang larawan ng pagtatatag at ang pasibong anyo, ngunit malinaw sa modernong mambabasa na pagpapanumbalik o muling pagpapatatag ang tinutukoy.
- issue: Kung ang שוב ay isasaling 'manumbalik' o 'magsisi'
  choice: manunumbalik
  alternative: magsisisi; babalik
  rationale: Ang 'manumbalik' ay tapat sa pangunahing kahulugang bumalik o muling lumapit at hindi tahimik na nagpapasok ng mas makitid na teolohikal na pagpapakahulugan.
- issue: Ugnayan ng ikalawang sugnay sa kondisyon
  choice: pinanatili bilang ikalawang sugnay na may 'kung'
  alternative: utos na 'ilayo mo ang kasamaan'
  rationale: Maaaring unawain ang anyong Hebreo bilang pagpapatuloy ng kondisyon o bilang utos. Pinili ang kondisyunal na pagbasa ayon sa sintaks at konteksto, habang itinatala ang alternatibo sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “manunumbalik” upang panatilihin ang diwa ng pagbabalik sa Diyos, at “tolda” upang mapanatili ang kongkretong larawang Hebreo. Ang bantas na kuwit sa dulo ay pinanatili dahil nagpapatuloy ang pangungusap sa kasunod na talata.
