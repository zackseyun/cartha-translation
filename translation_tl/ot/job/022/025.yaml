  text: then the Almighty will be your gold[a], and choice silver for you.
translation:
  language: tl
  text: Kung magkagayon, ang Makapangyarihan sa Lahat ang magiging ginto mo[a], at piling pilak para sa iyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Kung magkagayon, ang Makapangyarihan sa Lahat ang magiging kayamanan mo, at magkakaroon ka ng saganang pilak.” Mahirap tiyakin ang mga salitang Hebreo para sa “ginto” at sa panuring sa “pilak”; maaaring idiin ng mga ito ang kayamanang ibinibigay ng Diyos sa halip na ang Diyos mismo bilang kayamanan.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה
  choice: Kung magkagayon, ... ang magiging
  rationale: Ipinahahayag ng waw + qatal sa konteksto ang bunga ng naunang panawagan ni Elifaz. Likas sa modernong Tagalog ang “Kung magkagayon” bilang panandang bunga nang hindi inuulit ang buong kondisyon.
- source_word: שַׁדַּי
  choice: ang Makapangyarihan sa Lahat
  rationale: Isinasalin ang titulong Shaddai sa karaniwan, malinaw, at marangal na katawagan sa Diyos.
- source_word: בְּצָרֶיךָ
  choice: ginto mo
  rationale: Mahirap ang pangngalang בֶּצֶר, ngunit dahil katambal nito ang “pilak,” malamang na tumutukoy ito sa mahalagang metal o kayamanan, lalo na sa ginto. Pinananatili ng “ginto mo” ang matinding metapora na ang Makapangyarihan sa Lahat mismo ang kayamanan ni Job.
- source_word: וְכֶסֶף
  choice: at ... pilak
  rationale: Pinananatili ang ikalawang bahagi ng paralelismong patula; nauunawaan mula sa unang sugnay ang pandiwang “magiging.”
- source_word: תּוֹעָפוֹת
  choice: piling
  rationale: Bihira at di-tiyak ang salitang ito; maaaring ipahiwatig nito ang mataas na uri o kasaganaan. Ang “piling” ay natural na panuring sa pilak at hindi labis na nagpapasya sa isang tiyak na pakahulugan.
- source_word: לָךְ
  choice: para sa iyo
  rationale: Malinaw na ipinapakita ang datibong diwa ng personal na pakinabang habang nananatiling natural sa Tagalog.
theological_decisions:
- issue: Kung ang pangako ay tumutukoy sa Diyos bilang tunay na kayamanan o sa materyal na kayamanang ibibigay niya
  choice: Inilalarawan sa pangunahing teksto ang Makapangyarihan sa Lahat mismo bilang ginto ni Job.
  alternative: Maaaring ang ibig sabihin ay ang Makapangyarihan sa Lahat ang magkakaloob kay Job ng ginto at saganang pilak.
  rationale: Maaaring suportahan ng balangkas ng Hebreong tula ang dalawang pagbasa. Pinananatili ng pangunahing teksto ang tuwirang metapora, samantalang inilalahad sa talababa ang pagbasa tungkol sa materyal na pagkakaloob upang hindi patahimikin ang tunay na kalabuan at tensiyong teolohikal.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang maikli at matinding paralelismong patula, at iniwasan ang mga salitang masyadong teknikal gaya ng “mineral” o “mina.”
