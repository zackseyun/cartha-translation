  text: 'Then Eliphaz the Temanite answered and said:'
translation:
  language: tl
  text: 'Sumagot si Elifaz na taga-Teman at nagsabi:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַן
  choice: Sumagot
  rationale: Ang pandiwang ענה sa anyong pasalaysay ay karaniwang nagpapakilala ng tugon sa isang pag-uusap. Likas at tuwiran sa modernong Tagalog ang “Sumagot.”
- source_word: אֱלִיפַז
  choice: Elifaz
  rationale: Isinatinig ang pangalang pantangi ayon sa karaniwang baybay sa Tagalog.
- source_word: הַתֵּמָנִי
  choice: na Temanita
  rationale: Ang pang-uring gentiliko ay isinalin sa maikli at likas na anyong Tagalog na tumutukoy sa taong mula sa Teman.
- source_word: וַיֹּאמַר
  choice: at sinabi
  rationale: Ang אמר ay karaniwang pandiwa ng pagsasalita. Pinananatili ng “at sinabi” ang pormulang Hebreo na “sumagot at sinabi,” kahit may bahagyang pag-uulit sa Tagalog.
- source_word: וַ
  choice: at
  rationale: Ang waw ay nag-uugnay at nagpapatuloy sa salaysay. Hindi na kailangang isalin ang unang waw bilang “Pagkatapos” dahil malinaw na sa “Sumagot” ang pagpapatuloy ng diyalogo; ang waw bago וַיֹּאמַר ay likas na “at.”
