  yaml_path: translation/ot/job/022/028.yaml
  text: You will decree a matter[a], and it will be established for you, and light will shine on your ways.
translation:
  language: tl
  text: Magtatakda ka ng isang bagay[a], at ito ay mapagtitibay para sa iyo; sisikat ang liwanag sa iyong mga landas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Magtatakda ka ng isang salita, at ito ay mananatiling may bisa para sa iyo.”
    reason: Ipinakikita nito ang leksikal na alternatibong “salita” para sa אֹמֶר at ang kahulugang “tatayo/mananatiling may bisa” para sa יָקָם, habang pinananatili ang puwersa ng תִגְזַר bilang matibay na pagtatakda.
lexical_decisions:
- source_word: תִגְזַר
  choice: magtatakda ka
  rationale: Ang גזר ay maaaring tumukoy sa pagpapasiya, pagtatakda, o pag-uutos. Ang “magtatakda” ay malapit sa lakas ng isang matibay na pasiya ngunit hindi nagdaragdag ng pahiwatig na ang nagsasalita ay may maharlikang kapangyarihan.
- source_word: אֹמֶר
  choice: isang bagay
  rationale: Bagaman karaniwang nangangahulugang “salita” o “sinabi,” sa pariralang ito tumutukoy ito sa bagay na ipinasiya o itinakda. Pinananatili sa talababa ang mas literal na posibilidad.
- source_word: יָקָם
  choice: mapagtitibay
  rationale: Ang קום ay literal na “tumayo” at maaari ring mangahulugang manatiling may bisa o maitatag. Ang “mapagtitibay” ay nagpapahayag ng resultang ito nang hindi tahasang nagdaragdag kung sino ang kikilos.
- source_word: לָךְ
  choice: para sa iyo
  rationale: Tuwirang pinananatili ang ugnayan o kapakinabangang ipinahihiwatig ng pang-ukol ל.
- source_word: דְּרָכֶיךָ
  choice: iyong mga landas
  rationale: Pinananatili ng “mga landas” ang talinghaga para sa takbo o paraan ng pamumuhay at ang larawang nililiwanagan ang dinaraanan.
- source_word: נָגַהּ אֹור
  choice: sisikat ang liwanag
  rationale: Likas at malinaw na Filipino ito para sa pagliwanag o pagningning ng liwanag, at pinananatili nito ang patulang larawan.
theological_decisions:
- issue: Likas ng pangako sa pananalita ni Elifaz
  choice: Isinalin bilang tiyak na pahayag ng inaasahang mangyayari ayon sa pananalita ni Elifaz, nang hindi ito pinatitindi bilang isang ganap at walang-pasubaling pangako ng Diyos.
  alternative: Maaaring palakasin bilang ganap na garantiya ng tagumpay o pahinain bilang posibilidad lamang.
  rationale: Ang talata ay bahagi ng payo at pangangatwiran ni Elifaz, na hindi kinakailangang kumatawan sa pangwakas na hatol ng aklat. Dapat panatilihin ng salin ang kumpiyansa ng kanyang pahayag at ang mas malawak na teolohikal na tensiyon ng Job.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang patulang larawan ng liwanag at mga landas, habang iniwasan ang napakapormal na “mag-uutos” o “magdedekreto,” na maaaring magpahiwatig ng kapangyarihang maharlika na hindi kailangang ipakahulugan dito.
