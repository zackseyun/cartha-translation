lexical_decisions:
- source_word: אֲשֶׁר
  choice: na
  rationale: Pang-ugnay na panumbalik sa masasamang tao sa naunang konteksto; likas sa Filipino ang “na” sa pagpapatuloy ng paglalarawan.
- source_word: קֻמְּטוּ
  choice: inagaw
  rationale: Ipinahihiwatig ng pasibong anyo ang biglaan at sapilitang pag-aalis. Pinananatili ng “inagaw” ang puwersang ito nang hindi ipinapalagay ang mas tiyak ngunit αligtas na larawang “kumulubot” o “pinutol.”
- source_word: וְלֹא עֵת
  choice: bago dumating ang kanilang panahon
  rationale: Natural na Filipino para sa wakas na dumating nang wala sa takdang panahon; ipinahahayag ang pagiging napaaga nang hindi dinaragdagan ang Hebreo.
- source_word: נָהָר
  choice: ilog
  rationale: Karaniwang kahulugan ng salita at pinananatili ang kongkretong larawan; ang “baha” ay mas mapagpasyang interpretasyon.
- source_word: יוּצַק
  choice: tinangay
  rationale: Bagaman kaugnay ng pagbubuhos ang pandiwa, ang pinagsamang larawan ng ilog at pundasyon ay nagpapahiwatig ng pag-apaw o pag-anod. Ang “tinangay” ay natural at malinaw habang ang mas literal na pagbasa ay inilalagay sa talababa.
- source_word: יְסוֹדָם
  choice: kanilang pundasyon
  rationale: Tuwirang katumbas ng pangngalang isahan na may hulaping pangmaramihang taglay; ang “pundasyon” ay angkop sa larawan ng ganap na pagbagsak.
theological_decisions:
- issue: Saklaw ng larawan ng paghatol sa pamamagitan ng tubig
  choice: Panatilihin ang paglalarawan sa napaagang pagkapuksa at sa pundasyong tinangay ng ilog, nang hindi tinutukoy kung literal na kasaysayan o metapora ito.
  alternative: Tahasang tukuyin ito bilang salinlahing namatay sa Baha, o bilang pangkalahatang metapora lamang ng biglaang paghatol.
  rationale: Maaaring pahiwatig ito sa salinlahi ng Baha, ngunit hindi ipinipilit ng Hebreo ang gayong pagtukoy. Pinananatili ng salin ang tunay na kalabuan at teolohikal na tensiyon.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang patulang larawan at ang kalabuan ng Hebreo; iniwasan ang labis na pagpapaliwanag sa pangunahing teksto.
