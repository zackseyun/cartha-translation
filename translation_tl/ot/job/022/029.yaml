base_translation:
  language: en
  yaml_path: translation/ot/job/022/029.yaml
  text: For when they are brought low[a], you say[b], ‘Lift them up!’ and he saves the one with downcast eyes.
translation:
  language: tl
  text: Kapag ibinaba ka nila[a], sasabihin mo, “May pag-angat!” At ililigtas niya ang may nakayukong mga mata[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaaring isalin: “Kapag ibinagsak ka nila, sasabihin mo, ‘May pag-angat!’” Eliptikal ang Hebreong sugnay: hindi tahasang nakasaad ang layong “ikaw.”'
    reason: alternative_reading
  - marker: b
    text: Sa literal, “mababa o nakayuko ang mga mata”; maaaring tumukoy sa taong mapagpakumbaba o nanlulumo.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat kapag
  rationale: Pinagsasama nito ang sanhi at pangyayaring ipinahihiwatig ng pang-ugnay sa konteksto, nang hindi nililimitahan ito sa isang purong sanhi o panahon lamang.
- source_word: הִשְׁפִּילוּ
  choice: ibinababa sila
  rationale: Ipinahahayag ng anyong maramihan ang kalagayan ng mga taong ginawang mababa o ibinagsak. Hindi ito isinaling kusang pagpapakumbaba dahil mas malamang na panlabas na pagpapababa ang tinutukoy.
- source_word: וַתֹּאמֶר
  choice: sasabihin mo
  rationale: Ang kausap ay isahan, at ang aspektong panghinaharap ay angkop sa konteksto ng pangako at bunga sa mga naunang talata.
- source_word: גֵּוָה
  choice: May pag-angat!
  rationale: Ang pangngalan ay eliptikal at maaaring tumukoy sa kataasan o pag-angat. Pinananatili ng pahayag ang anyong pangngalan at ang pagsalungat nito sa pagiging ibinaba, nang hindi nagdaragdag ng tahasang layon sa isang pautos.
- source_word: וְשַׁח עֵינַיִם
  choice: ang taong nakayuko ang mga mata
  rationale: Pinananatili nito ang kongkretong larawan ng Hebreong pariralang ‘mababa/nakayuko ang mga mata,’ na maaaring magpahiwatig ng mapagpakumbaba o nanlulumo.
- source_word: יוֹשִׁעַ
  choice: ililigtas niya
  rationale: Mula sa pandiwang ישׁע, na nangangahulugang magligtas o magpalaya. Ang panghalip na ‘niya’ ay nagpapanatili sa hindi tahasang pinangalanang paksa ng Hebreo.
theological_decisions:
- issue: Paksa ng יוֹשִׁעַ
  choice: Pinanatiling di-tahasang pinangalanan sa ‘ililigtas niya,’ na sa konteksto ay tumutukoy sa Diyos.
  alternative: Tahasan itong gawing ‘ililigtas ng Diyos,’ o unawaing di-tiyak ang paksa.
  rationale: Nasa ikatlong panauhang panlalaking isahan ang pandiwa, ngunit walang tahasang pangngalang paksa. Hindi idinagdag ang ‘Diyos’ upang mapanatili ang kaiklian at pahiwatig ng Hebreo.
- issue: Kahulugan ng גֵּוָה sa mahirap at eliptikal na sugnay
  choice: 'Isinaling positibong pahayag ng pagbabalik sa mataas na kalagayan: ‘May pag-angat!’'
  alternative: ‘Itaas sila!’; ‘Pagmamataas’; o ‘Ako ay itinaas.’
  rationale: Ang agarang pagsalungat sa pagiging ibinaba ay pumapabor sa diwa ng pag-angat, ngunit pinananatili ng salin at talababa ang tunay na hirap at kalabuan ng pangngalan.
translation_notes:
  register: Makabago at marangal na Filipino ang ginamit. Pinanatili ang matalinghagang larawan ng nakayukong mga mata at ang eliptikal na pahayag na ‘May pag-angat!’ sa halip na lubusang ipaliwanag ang mahirap na Hebreo.
