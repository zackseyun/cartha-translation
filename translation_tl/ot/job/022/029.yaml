    issue: Mali ang panauhan at gampanin sa “kapag ibinababa sila.”
    rationale: Ginagawa nitong ang plural ang pinabababa, samantalang ang anyong Hebreo ay mas tuwirang “ibinaba nila [ikaw],” na may plural na gumagawa at ipinahihiwatig na isahang layon mula sa kausap ng talata.
  - severity: medium
    issue: Hindi tugma ang unang talababa sa rebisadong pagbasa ng Hebreo.
    rationale: Ang kasalukuyang talababa ay inuulit ang pagbasa na “sila ay ibinagsak,” kaya kailangan itong iayon sa plural na gumagawa at ipinahihiwatig na “ikaw” na layon.
  - severity: low
    issue: Medyo hindi likas ang “taong nakayuko ang mga mata.”
    rationale: Ang “ang may nakayukong mga mata” ay nagpapanatili ng larawan ng Hebreo at mas likas na Filipino.
