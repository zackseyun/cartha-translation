  source_fidelity: Kailangang itama ang unang sugnay. Ang הִשְׁפִּילוּ ay Hiphil na pangmaramihang anyo, na natural na nangangahulugang “ibinaba nila [ikaw]”; hindi tahasang “sila ay ibinaba.” Ang di-tahasang layon na ikalawang panauhang isahan ay umaayon sa kasunod na וַתֹּאמֶר, “sasabihin mo.” Pinananatili ng “May pag-angat!” ang eliptikal at pinagtatalunang גֵּוָה nang hindi inaangking ito ay isang ganap na pautos.
  naturalness: Mas natural sa modernong Filipino ang “Kapag ibinaba ka nila” kaysa “kapag ibinababa sila,” at ang “ang may nakayukong mga mata” ay mas maayos kaysa “ang taong nakayuko ang mga mata.”
  terminology: Ang “pag-angat” ay angkop para sa positibong pagbabaligtad ng pagiging ibinaba. Ang “ililigtas niya” ay wastong pinananatiling may di-tahasang paksa at hindi nagdaragdag ng pangalang wala sa Hebreo.
  issues:
