  text: Yet you say[b][a], ‘What does God know? Can he judge through thick darkness?’
translation:
  language: tl
  text: Ngunit sinasabi mo, “Ano ba ang alam ng Diyos? Makakahatol ba siya sa kabila ng makapal na dilim?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Humahatol ba siya sa kabila ng makapal na dilim?” o “Hahatol ba siya sa kabila ng makapal na dilim?” Ang anyo ng pandiwang Hebreo ay maaaring tumukoy sa kakayahan, kasalukuyang kilos, o kilos sa hinaharap. Ang “makapal na dilim” ay maaari ring isaling “madilim na ulap.”'
    reason: alternative_reading_and_lexical_alternative
lexical_decisions:
- source_word: וְאָמַרְתָּ
  choice: Ngunit sinasabi mo
  rationale: Ang waw at ikalawang panauhang panlalaking isahan na perfect ay naghaharap ng paratang o pagsipi sa sinasabi ni Job. Likas sa modernong Tagalog ang pangkasalukuyang “sinasabi mo,” at ipinahihiwatig ng “Ngunit” ang pagsalungat sa konteksto.
- source_word: מַה
  choice: Ano ba
  rationale: Ang patanong na panghalip ay tuwirang nagtatanong kung ano ang nalalaman ng Diyos. Ang “ba” ay nagbibigay ng likas na anyong retorikal nang hindi binabago ang kahulugan.
- source_word: יָדַע
  choice: ang alam
  rationale: Ipinapahayag nito ang kaalaman o pagkabatid. Ang idyomatikong “Ano ba ang alam ng Diyos?” ay malinaw at tapat sa maikli at mapanghamong tanong ng Hebreo.
- source_word: אֵל
  choice: Diyos
  rationale: Karaniwang titulo o katawagan ito sa Diyos; ang “Diyos” ang natural at hindi sektaryong salin sa Tagalog.
- source_word: הַבְעַד
  choice: sa kabila ng
  rationale: Ipinahihiwatig ng pang-ukol ang isang nakaharang o namamagitang bagay. Sa Tagalog, natural na ipinapakita ng “sa kabila ng” na ang makapal na kadiliman ay waring humahadlang sa paghatol.
- source_word: עֲרָפֶל
  choice: makapal na kadiliman
  rationale: Tumutukoy ito sa siksik na dilim, madilim na ulap, o panglaw. Pinananatili ng “makapal na kadiliman” ang bigat at larawang may nakahahadlang na dilim.
- source_word: יִשְׁפּוֹט
  choice: Makakahatol ba siya
  rationale: Ang imperfect sa retorikal na tanong ay maaaring tumukoy sa kakayahan, kasalukuyang kilos, o hinaharap. Ang “Makakahatol ba” ay natural na nagpapahayag ng pag-aalinlangan sa kakayahang humatol, habang itinatala sa talababa ang ibang posibleng pagbasa.
theological_decisions:
- issue: Kung ang יִשְׁפּוֹט ay ipapakahulugang kakayahan o payak na kasalukuyan/hinaharap na kilos
  choice: Makakahatol ba siya sa kabila ng makapal na kadiliman?
  alternative: Humahatol ba siya sa kabila ng makapal na kadiliman? / Hahatol ba siya sa kabila ng makapal na kadiliman?
  rationale: Sa konteksto, inilalarawan ni Elifaz ang sinasabing pag-aalinlangan na nakikita at napamamahalaan ng Diyos ang mga gawain ng tao. Likas na naipapahayag ng “Makakahatol ba” ang pahiwatig na ito, ngunit hindi ibinubukod ang simpleng kasalukuyan o hinaharap na pagbasa ng imperfect; kaya inilalahad ang mga iyon sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na dignified ngunit madaling maunawaan. Pinili ang tuwiran at retorikal na “Ano ba ang alam ng Diyos?” at iniwasan ang arkaiko o labis na teknikal na pananalita. Pinagsama sa isang talababa ang tunay na gramatikal at leksikal na mga alternatibo; ang marker na [a] ay nasa pangunahing teksto.
