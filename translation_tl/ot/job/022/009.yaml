  yaml_path: translation/ot/job/022/009.yaml
  text: You sent widows away empty[c][b][a], and the arms of orphans were crushed.
translation:
  language: tl
  text: Pinaalis mong walang dala ang mga biyuda[a], at dinurog ang mga bisig ng mga ulila[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “walang anumang natanggap.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “mga bisig ng mga ulila.” Ang “mga bisig” ay maaari ring tumukoy sa kanilang lakas o kapangyarihan; ang “mga ulila” ay maaari ring isaling “mga batang walang ama.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַלְמָנוֹת
  choice: mga biyuda
  rationale: Karaniwang makabagong katawagan sa mga babaeng namatayan ng asawa at pinananatili ang diin sa kanilang kahinaan sa lipunan.
- source_word: שִׁלַּחְתָּ
  choice: pinaalis mo
  rationale: Ipinahahayag ng Piel ng שלח ang pagpapaalis o pagtataboy; natural sa Filipino ang “pinaalis mo” sa kontekstong paratang.
- source_word: רֵיקָם
  choice: walang dala
  rationale: Ipinahahayag ang adberbiyal na diwang “walang anuman” o “walang nakamit,” na tumutugma sa idiomatikong Filipino.
- source_word: זְרֹעוֹת
  choice: mga bisig
  rationale: Pinananatili ang kongkretong larawan ng Hebreo habang hinahayaang magpahiwatig din ito ng lakas o kapangyarihan.
- source_word: יְתֹמִים
  choice: mga ulila
  rationale: Natural at dignified na katawagan sa mga batang nawalan ng magulang; sa kontekstong Hebreo, maaaring partikular na tumukoy sa mga batang walang ama.
- source_word: יְדֻכָּא
  choice: dinurog
  rationale: Matinding pasibong diwa ng דכא, “durugin” o “baliin.” Sa Filipino, hindi kailangang markahan sa pandiwa ang pagkakaibang singular/plural.
