base_translation:
  language: en
  yaml_path: translation/ot/job/022/019.yaml
  text: The righteous see and rejoice[a], and the innocent mock them.
translation:
  language: tl
  text: Nakikita ng mga matuwid at nagagalak sila; nililibak ng walang sala ang mga iyon.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יִרְאוּ
  choice: Nakikita ito
  rationale: Ang Qal imperfect ng ראה ay tumutukoy sa pagkakita o pagsaksi sa sinapit ng masasama sa konteksto. Idinagdag ang “ito” bilang likas na layon sa Filipino, nang hindi tahasang tinutukoy kung ano iyon.
- source_word: צַדִּיקִים
  choice: mga matuwid
  rationale: Pangmaramihang pang-uri na ginagamit bilang pangngalan; ang “mga matuwid” ay natural at pinananatili ang moral na kategorya ng Hebreo.
- source_word: וְיִשְׂמָחוּ
  choice: at nagagalak sila
  rationale: Ang שׂמח ay nagpapahayag ng kagalakan. Nilinaw ang simuno sa ikalawang sugnay para sa likas at malinaw na Filipino.
- source_word: וְנָקִי
  choice: taong walang sala
  rationale: Isahang pang-uri na ginamit bilang pangngalan at maaaring kumatawan sa isang uri ng tao. Ang “taong walang sala” ay malinaw at dignidadong katumbas.
- source_word: יִלְעַג
  choice: kinukutya
  rationale: Ang לעג ay tumutukoy sa mapanlibak na pagtawa o panunuya; malinaw na naihahatid ng “kinukutya” ang diwang mapanlait.
- source_word: לָמוֹ
  choice: sila
  rationale: Ang panghalip ay tumutukoy, ayon sa konteksto, sa mga masamang taong bumagsak. Pinanatili itong panghalip upang hindi magdagdag ng tahasang paliwanag sa teksto.
theological_decisions:
- issue: Tinutukoy ng mga panghalip ayon sa konteksto
  choice: Ang “ito” ay ang nasaksihang pagbagsak, at ang “sila” ay ang masasamang binanggit sa nakapaligid na konteksto.
  alternative: Isang pangkalahatang pahayag tungkol sa galak ng mga matuwid kapag nasasaksihan nila ang hatol ng Diyos.
  rationale: Ipinahihiwatig ng Job 22:17–18 ang pagbagsak ng masasama. Gayunman, panghalip lamang ang pinanatili sa pangunahing teksto upang hindi gawing tahasan ang isang referent na implicit sa Hebreo.
- issue: Pagkakaiba ng pangmaramihang “mga matuwid” at isahang נָקִי
  choice: 'Pinanatiling pangmaramihan ang una at generic na isahan ang ikalawa: “ang taong walang sala.”'
  alternative: 'Gawing pangmaramihan ang dalawa: “ang mga walang sala.”'
  rationale: Pinananatili ng pagpili ang bilang sa Hebreo at ang paralelismong may bahagyang pagkakaiba.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “nagagalak” at “kinukutya” upang mapanatili ang matimbang na himig ng tulang karunungan nang hindi nagiging lipas o labis na teknikal.
