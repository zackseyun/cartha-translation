  yaml_path: translation/ot/job/022/002.yaml
  text: Can a man be of use to God? Surely he who is wise is of use to himself[a].
translation:
  language: tl
  text: Maaari bang magdulot ng pakinabang sa Diyos ang isang tao? Tunay na ang taong may unawa ay sa sarili niya nakikinabang[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “May pakinabang ba sa Diyos ang isang tao? Sapagkat ang taong may unawa ay sa sarili niya nagdudulot ng pakinabang.”
    reason: Ipinakikita ang alternatibong pag-unawa sa כִּי bilang “sapagkat” at ang mas mahigpit na pag-uulit ng pandiwang סכן sa dalawang sugnay.
lexical_decisions:
- source_word: הַלְאֵל
  choice: Maaari bang ... sa Diyos?
  rationale: Pinananatili nito ang retorikal na tanong at malinaw na inilalahad ang Diyos bilang pinag-uukulan ng maaaring pakinabang.
- source_word: יִסְכָּן
  choice: magdulot ng pakinabang
  rationale: Ang סכן ay tumutukoy rito sa pagiging kapaki-pakinabang o sa pagbibigay ng pakinabang. Mas malinaw sa modernong Tagalog ang pariralang ito kaysa sa komersiyal na tunog ng “magbigay ng tubo.”
- source_word: גָּבֶר
  choice: isang tao
  rationale: Bagaman panlalaking pangngalan ang anyong Hebreo, pangkalahatan ang gamit nito rito para sa isang taong kinatawan ng sangkatauhan; natural at tumpak sa Tagalog ang “isang tao.”
- source_word: כִּי
  choice: Tunay na
  rationale: Ipinahahayag nito ang madiin o nagpapaliwanag na puwersa ng כִּי nang hindi ginagawang tiyak ang isang ugnayang maaaring unawain bilang “sapagkat.”
- source_word: יִסְכֹּן
  choice: nakikinabang
  rationale: Pinananatili ang parehong semantikong ideya ng סכן, ngunit gumagamit ng likas na pandiwang Tagalog ayon sa balangkas ng ikalawang sugnay.
- source_word: עָלֵימוֹ
  choice: sa sarili niya
  rationale: Ipinahahayag nito ang pakinabang na nauukol o bumabalik sa mismong taong may unawa.
- source_word: מַשְׂכִּיל
  choice: ang taong may unawa
  rationale: Sinasaklaw nito ang taong may kabatiran at kumikilos nang may karunungan, habang nananatiling malinaw at marangal sa kasalukuyang Tagalog.
theological_decisions:
- issue: Kung ipinahihiwatig ng talata na makapagdaragdag ang tao ng pakinabang sa Diyos
  choice: Inihaharap ang unang sugnay bilang retorikal na tanong, at ang ikalawa bilang pahayag na ang pakinabang ng taong may unawa ay nauukol sa sarili niya.
  alternative: Maaaring unawain ang ikalawang sugnay bilang mas pangkalahatang pahayag lamang na nakikinabang ang taong may unawa, nang hindi mariing itinatambis iyon sa Diyos.
  rationale: Pinananatili ng salin ang pagtutumbas ng Diyos at ng sarili ng tao sa Hebreong paralelismo, ngunit hindi ito pinalalawak tungo sa isang mas malawak na doktrinang hindi tahasang sinasabi ng talata.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “isang tao” sa pangkalahatang diwa at iniwasan ang sobrang komersiyal na “tubo.”
