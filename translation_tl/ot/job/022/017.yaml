  text: who said to God, ‘Depart from us,’ and, ‘What can the Almighty do to them?’
translation:
  language: tl
  text: na nagsabi sa Diyos, “Lumayo ka sa amin,” at “Ano ang magagawa ng Makapangyarihan sa kanila?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: סוּר מִמֶּנּוּ
  choice: Lumayo ka sa amin
  rationale: Tuwirang ipinahahayag ang utos na lumayo o umalis, habang pinananatili ang ikalawang panauhan at ang ‘sa amin.’
- source_word: שַׁדַּי
  choice: ang Makapangyarihan
  rationale: Karaniwan at marangal na katumbas sa Tagalog ng banal na titulong Shaddai sa kontekstong ito.
- source_word: יִפְעַל ... לָמוֹ
  choice: magagawa ... para sa kanila
  rationale: Ang פעל ay tumutukoy sa paggawa o pagkilos, at ang לָמוֹ ay ikatlong panauhang maramihan, ‘para sa kanila.’ Pinananatili nito ang anyo ng tekstong Hebreo sa halip na gawing ‘para sa amin.’
theological_decisions:
- issue: Pagbabago ng panauhan sa loob ng iniulat na pananalita
  choice: para sa kanila
  alternative: para sa amin
  rationale: Malinaw na ikatlong panauhang maramihan ang לָמוֹ sa WLC. Bagaman maaaring asahang ‘para sa amin’ ayon sa tuwirang sipi at sa kahawig na pahayag sa Job 21:14–15, hindi tahimik na itinuwid ang tensiyon ng tekstong Hebreo.
- issue: Diwa ng ugnayang ipinahihiwatig ng לָמוֹ
  choice: para sa kanila
  alternative: sa kanila
  rationale: Sa pariralang יפעל למו, natural na nagpapahiwatig ang ל ng benepaktibong ‘para sa kanila.’ Iniiwasan nitong ipakahulugan nang walang sapat na batayan na ang kilos ay laban sa kanila.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang matalim na tono ng mapanghamong mga sipi at ang tunay na paglipat mula ‘amin’ tungo sa ‘kanila.’
