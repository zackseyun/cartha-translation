  source_fidelity: 'Tumpak ang mga pangunahing leksikal na pagpili: tubig, pagod, tinapay, at pagkakait. Gayunman, ang kasalukuyang ayos na “Hindi mo ... , at pinagkaitan mo ...” ay maaaring magmukhang positibong pahayag ang ikalawang sugnay sa Filipino, kahit saklaw ito ng iisang Hebreong pagtanggi. Dapat na malinaw na saklaw ng pagtanggi ang kapwa paratang.'
