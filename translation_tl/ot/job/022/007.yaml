  yaml_path: translation/ot/job/022/007.yaml
  text: You gave no water to the weary to drink[a], and from the hungry you withheld bread.
translation:
  language: tl
  text: Hindi mo binigyan ng maiinom na tubig ang taong pagod, ni ipinagkait mo ang tinapay sa nagugutom.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Hebreong “tinapay” ay maaari ring tumukoy nang mas malawak sa “pagkain,” ngunit pinanatili sa pangunahing teksto ang kongkretong salitang ginamit sa orihinal.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא
  choice: Hindi
  rationale: Tuwirang pagtanggi sa unang paratang; likas sa Filipino ang konstruksiyong “Hindi mo pinainom.”
- source_word: מַיִם
  choice: tubig
  rationale: Karaniwang pangngalang tumutukoy sa tubig.
- source_word: עָיֵף
  choice: ang pagod
  rationale: Ang pang-uri ay ginagamit bilang pangngalan para sa sinumang pagod o nanghihina; pinananatili ang pangkalahatang diwa ng Hebreo.
- source_word: תַּשְׁקֶה
  choice: pinainom
  rationale: Ang Hiphil ng שׁקה ay nangangahulugang magbigay ng maiinom o painumin; “pinainom ng tubig” ang natural na causative na anyo sa Filipino.
- source_word: וּמֵרָעֵב
  choice: at ... ang nagugutom
  rationale: Ang מִן kasama ng רָעֵב ay tumutukoy sa taong gutom. Sa Filipino, ang ugnayang “from” ay likas na naipahahayag sa pandiwang “pinagkaitan,” kaya hindi na kailangang isalin nang hiwalay.
- source_word: תִּמְנַע
  choice: pinagkaitan
  rationale: Ipinahahayag nito ang sadyang hindi pagbibigay o pagkakait ng kinakailangang bagay at akma sa moral na paratang.
- source_word: לָחֶם
  choice: tinapay
  rationale: Pinananatili ang kongkretong salitang ginamit sa Hebreo, bagaman maaari rin itong tumukoy nang mas malawak sa pagkain.
