  terminology: Ang “Ofir” at “ginto ng Ofir” ay angkop. Pinanatili ang “ginto,” na may talababa sa “mineral na ginto”/mahalagang metal. Ang “mga tuyong ilog” ay angkop na pangunahing salin para sa mga wadi; ipinaliliwanag ng talababa ang pana-panahong pagdaloy ng tubig.
