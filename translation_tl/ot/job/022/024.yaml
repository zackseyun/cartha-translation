  yaml_path: translation/ot/job/022/024.yaml
  text: and lay gold in the dust[a], and the gold of Ophir among the stones of the wadis[c][b],
translation:
  language: tl
  text: At ilagay mo sa alikabok ang ginto[a], at ang ginto ng Ofir[b] sa mga batuhan ng mga tuyong ilog[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mineral na ginto.” Ang salitang Hebreo ay maaaring tumukoy sa mahalagang metal o ore, hindi lamang sa dinalisay na ginto.
    reason: lexical_alternative
  - marker: b
    text: Ang Ofir ay isang lugar na bantog sa mainam na ginto; kaya ang ipinahihiwatig dito ay “ang ginto ng Ofir.”
    reason: cultural_note
  - marker: c
    text: Ang “mga tuyong ilog” ay mga pana-panahong daluyan ng tubig (wadi) na maaaring rumagasa ang tubig kapag tag-ulan; maaari ring isaling “mga agusan” o “mga torrent-bed.”
    reason: cultural_note
lexical_decisions:
- source_word: וְשִׁית
  choice: At ilagay mo
  rationale: Ang שׁית ay nangangahulugang maglagay o maglapag. Pinananatili ng “ilagay” ang payak na larawan at hindi nito tahasang nilulutas kung itinatakwil o basta inilalapag ang kayamanan.
- source_word: עַל עָפָר
  choice: sa alabok
  rationale: Bagaman karaniwang “sa ibabaw ng” ang עַל, likas sa Filipino ang “sa alabok” para sa isang bagay na inilalapag sa lupa, habang napapanatili ang kongkretong larawang patula.
- source_word: בָּצֶר
  choice: ang ginto
  rationale: Sa kontekstong kahilera ng Ofir, tumutukoy ang bihirang salitang בָּצֶר sa mahalagang metal, malamang na ginto o gintong mineral. “Ginto” ang pinakamalinaw sa pangunahing teksto, at nasa talababa ang leksikal na alternatibo.
- source_word: וּבְצוּר נְחָלִים
  choice: sa gitna ng mga bato sa mga batis
  rationale: Ang צוּר ay bato o batuhan, at ang נְחָלִים ay mga batis, agusan, o pana-panahong ilog. Ang parirala ay isinaayos sa natural na Filipino nang hindi inaalis ang mabatong larawan.
- source_word: אוֹפִיר
  choice: ang ginto ng Ofir
  rationale: Pangalan ng lugar ang Ofir at kilala ito sa mainam na ginto. Ginawang tahas ang ipinahihiwatig na “ginto” upang luminaw ang pagtutulad sa unang hati ng taludtod.
theological_decisions:
- issue: Diwa ng paglalagay ng ginto sa konteksto ng pangangaral ni Elifaz
  choice: Gumamit ng neutral na “ilagay” habang hinahayaan ang konteksto na magpahiwatig ng pagtalikod sa pagtitiwala sa kayamanan.
  alternative: Isalin bilang “itapon,” na tahasang nagpapakahulugang itinatakwil ang kayamanan.
  rationale: Sinusuportahan ng kasunod na taludtod ang diwang magiging tunay na kayamanan ang Makapangyarihan, ngunit ang mismong pandiwang Hebreo ay “ilagay,” hindi “itapon.” Pinananatili ng salin ang tunay na tensiyon sa pagitan ng literal na kilos at ng kontekstuwal na pahiwatig.
translation_notes:
  register: Makabago at marangal na Filipino na madaling maunawaan. Pinili ang payak na “ilagay” sa halip na “itapon” upang hindi lampasan ang lakas ng pandiwang Hebreo, at ipinaliwanag sa mga talababa ang bihirang terminong pangmetal, ang Ofir, at ang heograpikong diwa ng נְחָלִים.
