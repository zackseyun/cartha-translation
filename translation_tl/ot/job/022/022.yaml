  text: קַח נָ֣א מִ/פִּ֣י/ו תּוֹרָ֑ה וְ/שִׂ֥ים אֲ֝מָרָ֗י/ו בִּ/לְבָבֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/022/022.yaml
  text: Please[a], receive instruction from his mouth, and lay up his words in your heart.
translation:
  language: tl
  text: Tanggapin mo sana ang turo[a] mula sa kanyang bibig, at ilagay mo sa iyong puso ang kanyang mga salita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring “kautusan,” “aral,” o “tagubilin” (Hebreo: torah).'
    reason: lexical_alternative
lexical_decisions:
- source_word: קַח
  choice: Tanggapin mo
  rationale: Bagaman literal na “kunin,” sa pariralang tumutukoy sa pagtanggap ng turo, likas at tumpak sa Filipino ang “tanggapin.”
- source_word: נָא
  choice: sana
  rationale: Ipinahahayag ng kataga ang pakiusap o mariing panghihikayat, hindi pangunahin ang panahong “ngayon.”
- source_word: מִפִּיו
  choice: mula sa kanyang bibig
  rationale: Pinananatili ang hayag at matingkad na larawan ng Hebreo sa halip na paikliin lamang bilang “mula sa kanya.”
- source_word: תּוֹרָה
  choice: turo
  rationale: Sa konteksto ng karunungan sa Job, tumutukoy ito sa makapangyarihang pagtuturo o tagubilin at hindi kinakailangang sa Kautusang Mosaiko.
- source_word: וְשִׂים
  choice: ilagay mo
  rationale: Direktang pinananatili ang metapora ng paglalagay ng mga salita sa puso; natural din ito sa modernong Filipino.
- source_word: אֲמָרָיו
  choice: ang kanyang mga salita
  rationale: Payak at tapat na salin ng pangmaramihang pangngalan, na angkop sa bigat ng pahayag.
- source_word: בִּלְבָבֶךָ
  choice: sa iyong puso
  rationale: Pinananatili ang idyomang Hebreo kung saan ang puso ang kaloob-loobang luklukan ng isip at kalooban.
theological_decisions:
- issue: Kahulugan ng תּוֹרָה sa isang talumpati ng karunungan
  choice: turo
  alternative: kautusan; aral; tagubilin
  rationale: Hindi nililimitahan ng konteksto ang salita sa Kautusang Mosaiko. Ang “turo” ay nagpapanatili sa awtoridad ng sinasabi habang iniiwasang magpasok ng isang tiyak na kontekstong tipan na hindi hinihingi ng talata.
- issue: Pagkakakilanlan ng tinutukoy ng panghalip na “kanyang”
  choice: Pinanatiling panghalip na walang idinagdag na pangalan o malaking titik
  alternative: Tukuyin nang tahasan bilang Diyos o gamitin ang “Kanyang”
  rationale: Bagaman tumutukoy sa Diyos ang daloy ng talumpati, panghalip lamang ang nasa Hebreo. Pinananatili ng salin ang anyo at hindi nagdaragdag ng interpretatibong pagtukoy.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “sana” upang natural na maipahayag ang pakiusap, at pinanatili ang mga larawang “mula sa kanyang bibig” at “sa iyong puso.”
