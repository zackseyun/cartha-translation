  yaml_path: translation/ot/job/022/008.yaml
  text: But the land belonged to the strong man[b][a], and the favored man lived in it.
translation:
  language: tl
  text: Ngunit ang lupain ay pag-aari ng taong makapangyarihan[a], at doon nanirahan ang taong kinikilingan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal na “taong may bisig,” isang idyoma para sa taong malakas o makapangyarihan.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “taong pinararangalan” o “taong pinapaboran.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ
  choice: Ngunit ang ... taong
  rationale: Ang אִישׁ ay ‘tao/lalaki.’ Isinalin ang pang-ugnay na וְ bilang ‘Ngunit’ upang ipakita ang pagsalungat sa sinapit ng mahihina sa konteksto at sa pribilehiyo ng makapangyarihan dito.
- source_word: זְרוֹעַ
  choice: makapangyarihan
  rationale: Literal itong ‘bisig,’ ngunit ang pariralang אִישׁ זְרוֹעַ ay idyoma para sa taong may lakas o kapangyarihan. Mas natural sa modernong Tagalog ang ‘taong makapangyarihan.’
- source_word: לוֹ הָאָרֶץ
  choice: ang lupain ay pag-aari ng
  rationale: 'Ang לְ na may panghalip at הָאָרֶץ ay nagpapahayag ng pag-aari o pagkontrol: ‘sa kaniya ang lupain.’ Malinaw at natural na ipinahahayag ito ng ‘ay pag-aari ng.’'
- source_word: וּנְשׂוּא פָנִים
  choice: ang taong kinikilingan
  rationale: Literal na ‘itinaas ang mukha,’ isang idyomang maaaring tumukoy sa taong pinapaboran, pinararangalan, o tinatrato nang may pagkiling. Pinananatili ng ‘kinikilingan’ ang diwa ng pribilehiyong panlipunan sa konteksto.
- source_word: יֵשֶׁב בָּהּ
  choice: doon nanirahan
  rationale: Ang יָשַׁב ay maaaring mangahulugang umupo, manirahan, o tumira. Ang ‘doon nanirahan’ ay malinaw na tumutukoy sa paninirahan sa lupain at natural sa Tagalog.
theological_decisions:
- issue: Diwa ng נְשׂוּא פָנִים
  choice: kinikilingan
  alternative: pinararangalan / pinapaboran
  rationale: Hindi tiyak sa idyoma lamang kung marangal na paggalang o di-makatarungang pagtatangi ang tinutukoy. Dahil paratang ang konteksto at ikinukumpara ito sa pagtrato sa mahihina, ‘kinikilingan’ ang angkop, habang inilalagay sa talababa ang iba pang tunay na posibilidad.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang ‘lupain’ sa halip na ‘lupa’ upang tumukoy sa teritoryo o ari-arian, at ‘nanirahan’ sa halip na mas lumang ‘tumahan.’
