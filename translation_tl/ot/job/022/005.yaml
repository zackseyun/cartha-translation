  text: הֲ/לֹ֣א רָעָֽתְ/ךָ֣ רַבָּ֑ה וְ/אֵֽין קֵ֝֗ץ לַ/עֲוֺנֹתֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/022/005.yaml
  text: Is not your evil abundant[b][a], and there is no end to your iniquities?
translation:
  language: tl
  text: Hindi ba malaki ang iyong kasamaan[a], at walang katapusan ang iyong mga kasalanan[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kasamaan ng iyong asal.” Sa ibang konteksto, ang salitang Hebreo ay maaari ring mangahulugang “kapahamakan,” ngunit dito ay moral na kasamaan ang ipinahihiwatig ng katambal na “iyong mga kasalanan.”
    reason: lexical_alternative
  - marker: b
    text: O “at walang hangganan ang iyong mga kasalanan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: Hindi ba
  rationale: Pinananatili nito ang anyong patanong na retorikal at ang maparatang na himig; inaasahan ng nagsasalita ang sagot na oo.
- source_word: רָעָתְךָ
  choice: iyong kasamaan
  rationale: Bagaman maaari ring tumukoy ang רעה sa kapahamakan, ang pagkakatambal nito sa ‘iyong mga kasalanan’ ay nagpapakitang moral na kasamaan ang tinutukoy rito.
- source_word: רַבָּה
  choice: malaki
  rationale: Tuwirang ipinapahayag nito ang laki o tindi ng kasamaan nang hindi nagdaragdag ng antas na hindi tahasang nasa Hebreo.
- source_word: וְאֵין קֵץ
  choice: at walang katapusan
  rationale: Natural na katumbas sa Filipino ng idyomang Hebreo na nagsasaad na walang wakas o limitasyon.
- source_word: לַעֲוֺנֹתֶיךָ
  choice: ang iyong mga kasalanan
  rationale: Malinaw at natural ito sa makabagong Filipino at pinananatili ang mabigat na moral na paratang ng עון, na maaari ring maglaman ng diwa ng kasamaan o pagkakasala.
theological_decisions:
- issue: Moral na kasamaan o kapahamakan sa רָעָתְךָ
  choice: moral na kasamaan
  alternative: kapahamakan o kasawian
  rationale: Ang paralelismo sa ‘iyong mga kasalanan’ ay nagpapakitang inaakusahan ni Elifaz si Job ng masamang asal, hindi lamang inilalarawan ang kanyang dinaranas na kasawian.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang retorikal na tanong at ang mariing paratang ni Elifaz, habang iniwasan ang salitang masyadong teknikal o nakatali sa isang tradisyong teolohikal.
