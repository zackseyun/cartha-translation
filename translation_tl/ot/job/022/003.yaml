  to: May kasiyahan ba ang Makapangyarihan sa Lahat kung ikaw ay matuwid,[a] o may pakinabang ba siya kung ginagawa mong walang kapintasan ang iyong mga landas?[b]
  rationale: Pinalitan ang "galak" ng "kasiyahan" bilang pangunahing katumbas ng חֵפֶץ, habang pinanatili ang "galak" bilang leksikal na alternatibo. Inayos ang unang tanong para sa mas likas na daloy, at pinalitan ang "mga lakad" ng "mga landas" upang mapanatili ang metapora ng Hebreo sa mas idiomatikong Filipino. Hindi binago ang retorikal na puwersa o ang pananaw ni Elifaz na walang pakinabang ang Makapangyarihan sa Lahat mula sa katuwiran ng tao.
