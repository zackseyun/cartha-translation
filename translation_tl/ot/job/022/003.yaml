  yaml_path: translation/ot/job/022/003.yaml
  text: Is it any pleasure to the Almighty that you are righteous[b][a], or any gain that you make your ways blameless?
translation:
  language: tl
  text: May kasiyahan ba ang Makapangyarihan sa Lahat kung ikaw ay matuwid,[a] o may pakinabang ba siya kung ginagawa mong walang kapintasan ang iyong mga landas?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “galak.”
    reason: lexical_alternative
  - marker: b
    text: O “pamumuhay” para sa “mga landas.”
    reason: metaphor_clarification
lexical_decisions:
- source_word: הַחֵפֶץ לְשַׁדַּי
  choice: May galak ba ang Makapangyarihan sa lahat
  rationale: Ang חֵפֶץ ay maaaring tumukoy sa galak, kasiyahan, o nais. Ang “may galak ba” ay natural sa Filipino at pinananatili ang retorikal na tanong; ang לְ ay nauunawaan bilang kaugnayan sa Makapangyarihan sa lahat.
- source_word: כִּי תִצְדָּק
  choice: kung matuwid ka
  rationale: Ang Qal na צדק ay pinakamaayos unawain dito bilang pagiging matuwid o nasa tama, hindi bilang pagbibigay-katwiran sa sarili.
- source_word: וְאִם בֶּצַע
  choice: o may pakinabang ba sa kanya
  rationale: Sa magkatulad na retorikal na mga tanong, ang וְאִם ay natural na “o.” Ang בֶּצַע ay pakinabang o tubo; idinagdag ang “sa kanya” upang luminaw sa Filipino ang di-tahasang tumatanggap ng pakinabang, na siya ring שַׁדַּי sa unang sugnay.
- source_word: כִּי תַתֵּם דְּרָכֶיךָ
  choice: kung ginagawa mong walang kapintasan ang iyong mga lakad
  rationale: Ang Hiphil ng תמם ay causative, kaya pinanatili ang “ginagawa mong.” Ang “walang kapintasan” ay naghahayag ng moral na kabuuan o integridad, at ang “mga lakad” ay nagpapanatili sa metapora ng דֶּרֶךְ.
theological_decisions:
- issue: Kung ipinahihiwatig ng talata na likas na nakikinabang ang Diyos sa katuwiran ng tao
  choice: Pinanatili ang matinding retorikal na pahayag ni Elifaz na walang pakinabang sa Makapangyarihan sa lahat mula sa pagiging matuwid ni Job.
  alternative: Maaaring palambutin bilang pahayag lamang na hindi nangangailangan ang Diyos ng katuwiran ng tao, nang hindi itinatanggi ang kanyang galak dito.
  rationale: Ang mga salitang חֵפֶץ at בֶּצַע ay bumubuo ng mga retorikal na tanong tungkol sa galak at pakinabang. Hindi nilutas ng salin ang tensiyon sa ibang mga tekstong nagsasabing nalulugod ang Diyos sa katuwiran; malinaw na pananalita ito ni Elifaz sa loob ng aklat.
translation_notes:
  register: Makabago at marangal na Filipino na madaling maunawaan. Pinanatili ang paralelismo ng dalawang retorikal na tanong at ang metapora ng “mga lakad,” habang ginawang tahas ang “sa kanya” sa ikalawang sugnay para sa likas na daloy sa Filipino.
