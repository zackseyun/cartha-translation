base_translation:
  language: en
  yaml_path: translation/ot/job/022/030.yaml
  text: He delivers even one who is not innocent[b][a], and he will be delivered through the cleanness of your hands.
translation:
  language: tl
  text: Inililigtas niya kahit ang taong hindi inosente[a], at maliligtas siya sa pamamagitan ng kalinisan ng iyong mga kamay[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Inililigtas niya ang taong inosente.” Mahirap unawain ang Hebreo sa unang sugnay, at may ibang pagbasa sa parirala.
    reason: alternative_reading
  - marker: b
    text: Ang “kalinisan ng iyong mga kamay” ay isang idyoma para sa kawalang-sala o moral na kadalisayan.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְמַלֵּט
  choice: Inililigtas
  rationale: Ang Piel ng מלט ay nagpapahayag ng pagliligtas o pagpapaligtas sa isang tao mula sa panganib; natural at tuwiran sa Filipino ang “inililigtas.”
- source_word: אִי נָקִי
  choice: maging ang taong hindi inosente
  rationale: Mahirap ang pariralang Hebreo. Sinusunod ng salin ang tradisyonal na pag-unawa sa אִי bilang may negatibong diwa, habang ipinahihiwatig ng “maging” na umaabot ang pagliligtas kahit sa hindi inosente.
- source_word: נָקִי
  choice: inosente
  rationale: Tumutukoy ang נָקִי sa pagiging walang sala o malaya sa pananagutan; malinaw sa karaniwang Filipino ang “inosente” at napapanatili nito ang moral at hudisyal na diwa.
- source_word: וְנִמְלַט
  choice: at maliligtas ito
  rationale: Ang Niphal ng מלט ay maaaring mangahulugang “maligtas” o “makatakas.” Pinananatili ng “maliligtas” ang paralelismo sa unang sugnay; ang “ito” ay tumutukoy sa taong nabanggit nang hindi itinatakda ang kasarian.
- source_word: בְּבֹר
  choice: sa pamamagitan ng kalinisan
  rationale: 'Ang בֹּר dito ay nauunawaan bilang kalinisan o kadalisayan, at ang pang-ukol ay instrumental: ang kalinisan ang paraang kaugnay ng pagliligtas.'
- source_word: כַּפֶּיךָ
  choice: ng iyong mga kamay
  rationale: Bagaman literal na maaaring tumukoy sa mga palad, ang natural na katumbas ng idyomang Hebreo ay “mga kamay,” na sumasagisag sa asal o gawa ng isang tao.
theological_decisions:
- issue: Kahulugan ng unang sugnay
  choice: Inililigtas ng Diyos maging ang taong hindi inosente.
  alternative: Inililigtas niya ang taong inosente.
  rationale: Napakahirap ng sintaks ng Hebreo. Sinusunod ng pangunahing salin ang tradisyonal na pagbasa sa אִי bilang may negatibong diwa at iniuugnay ito sa ikalawang sugnay, kung saan ang taong iyon ay naliligtas sa pamamagitan ng kalinisan ng mga kamay ng kausap. Inilalahad sa talababa ang mahalagang alternatibo upang mapanatili ang tunay na kalabuan at hindi palakasin nang lampas sa teksto ang anumang doktrina tungkol sa pamamagitan ng isang tao.
translation_notes:
  register: Makabagong Filipino na marangal ngunit madaling maunawaan. Pinanatili ang larawan ng “kalinisan ng mga kamay” dahil malinaw ito sa konteksto at mahalaga sa paralelismo, saka ipinaliwanag sa talababa. Ginamit ang “ito” sa halip na panghalip na may kasarian upang hindi magdagdag ng impormasyong wala sa Hebreo.
