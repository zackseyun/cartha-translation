  text: Is it because of your fear of him that he reproves you and enters into judgment with you?[a][b][c]
translation:
  language: tl
  text: Dahil ba sa takot mo sa kanya[a] kaya ka niya sinasaway[b] at nakikipaglitis sa iyo?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “dahil may takot ka sa kanya” o “dahil iginagalang mo siya.” Sa Hebreo, literal na “dahil sa iyong takot.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “sinisita ka” o “itinutuwid ka.”
    reason: lexical_alternative
  - marker: c
    text: Sa Hebreo, literal na “dumarating siyang kasama mo sa paglilitis.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲמִיִּרְאָתְךָ
  choice: Dahil ba sa pagkatakot mo sa kanya
  rationale: Ipinapanatili ang patanong at sanhi na puwersa ng הֲמִן at ang karaniwang kahulugan ng יִרְאָה bilang “takot” o “paggalang.” Nilinaw ng “sa kanya” ang ipinahihiwatig na layon—ang Diyos—ayon sa konteksto.
- source_word: יֹכִיחֶךָ
  choice: kaya ka niya sinasaway
  rationale: Ang “sinasaway” ay likas sa modernong Tagalog at naipapahayag ang moral na pagsita ng Hiphil ng יכח nang hindi inaalis ang legal na himig na pinatitibay ng kasunod na parirala.
- source_word: יָבֹא עִמְּךָ בַּמִּשְׁפָּט
  choice: nakikipaglitis sa iyo
  rationale: Isinasalin nito sa natural na Tagalog ang idyomang literal na “pumapasok/sumasama sa iyo sa paghatol,” habang pinananatili ang diwang legal at ang pagiging magkatunggali ng mga panig.
- source_word: מִּשְׁפָּט
  choice: paglilitis
  rationale: Sa pariralang ito, tumutukoy ang salita sa legal na pagdinig o usapin, hindi lamang sa abstraktong katarungan o sa huling pasiya.
theological_decisions:
- issue: Ang ipinahihiwatig na layon ng “iyong takot”
  choice: 'Ginawang malinaw na ang takot ay nakatuon sa Diyos: “pagkatakot mo sa kanya.”'
  alternative: 'Panatilihing walang tahasang layon: “dahil sa pagkatakot mo.”'
  rationale: Ang Diyos ang tinutukoy na kumikilos sa konteksto. Nililinaw lamang ng “sa kanya” ang elipsis sa Hebreo at hindi nagdaragdag ng bagong teolohikal na pahayag.
- issue: Puwersa ng tanong ni Elifaz
  choice: Isang retorikal na tanong na inaasahang sasagutin ng “hindi.”
  alternative: Isang neutral na tanong na walang malinaw na inaasahang sagot.
  rationale: Ipinahihiwatig ng panandang patanong sa Hebreo at ng konteksto ang ironikong pagtanggi ni Elifaz na hinahatulan ng Diyos si Job dahil sa pagkatakot nito sa Diyos. Pinananatili ng salin ang retorikal na puwersa nang walang dagdag na paliwanag sa talata.
translation_notes:
  register: Modernong Filipino Tagalog na dignified ngunit madaling maunawaan. Ginamit ang “nakikipaglitis” upang maipahayag nang maikli at natural ang legal at adversarial na diwa ng idyomang Hebreo; iniwasan ang “dinadala ka sa hukuman” sapagkat gagawin nitong causative ang kilos.
