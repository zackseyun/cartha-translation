  text: אִם לֹ֣א נִכְחַ֣ד קִימָ֑/נוּ וְ֝/יִתְרָ֗/ם אָ֣כְלָה אֵֽשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/022/020.yaml
  text: Surely our adversaries have been cut off[b][a], and fire has consumed what was left of them.
translation:
  language: tl
  text: “Tiyak na nilipol ang mga kalaban natin[a], at tinupok ng apoy ang nalabi sa kanila[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mahirap unawain ang Hebreong קִימָנוּ. Maaaring mangahulugan itong “mga kalaban natin,” gaya sa pangunahing teksto, o marahil ay “ating ari-arian” o “ating kayamanan.”
    reason: alternative_reading
  - marker: b
    text: O “ang kanilang nalabi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם לֹא
  choice: Tiyak na
  rationale: Ginamit ang parirala bilang mariing pagpapatunay, hindi bilang tunay na kondisyon. Likas sa modernong Filipino ang “Tiyak na” para sa diin nito.
- source_word: נִכְחַד
  choice: nilipol
  rationale: Ipinahahayag ng Niphal ang pagkawasak o pagkapawi ng tinutukoy. Malinaw at mariing naihahatid ng “nilipol” ang resultang ito.
- source_word: קִימָנוּ
  choice: ang mga kalaban natin
  rationale: Mahirap at pinagtatalunan ang anyong Hebreo. Sa konteksto at sa pagkakatulad nito sa kasunod na sugnay tungkol sa kanilang nalabi, ang “mga kalaban natin” ang pinakamalinaw na pagbasa, ngunit pinanatili sa talababa ang tunay na ibang posibilidad.
- source_word: וְיִתְרָם
  choice: ang nalabi sa kanila
  rationale: Karaniwang tumutukoy ang יֶתֶר sa anumang natira o nalabi. Natural sa Filipino ang pariralang ito at malinaw na inuugnay ang hulapi sa grupong nilipol.
- source_word: אָכְלָה אֵשׁ
  choice: tinupok ng apoy
  rationale: Ang apoy bilang lumalamon o umuubos ay karaniwang larawang Hebreo. Ang “tinupok ng apoy” ay natural, matingkad, at tapat sa ganap na pagkawasak na ipinahihiwatig.
