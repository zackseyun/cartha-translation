  yaml_path: translation/ot/job/022/014.yaml
  text: Clouds are a covering for him[a], so that he does not see; and he walks on the vault of heaven.
translation:
  language: tl
  text: Ang makakapal na ulap ay tabing sa kanya[a], at hindi siya nakakakita; naglalakad siya sa ibabaw ng arko ng kalangitan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O: “Ang makakapal na ulap ay tabing sa kanya, kaya hindi siya nakakakita; naglalakad siya sa ibabaw ng bilog ng kalangitan.”'
    reason: Pinananatili ang posibleng bungang diwa ng וְ at ang leksikal na alternatibong “bilog” para sa חוּג.
lexical_decisions:
- source_word: עָבִים
  choice: makakapal na ulap
  rationale: Ang pangmaramihang pangngalan ay tumutukoy sa mga ulap, lalo na sa masisinsing ulap na nakahahadlang sa paningin. Likas at malinaw sa Filipino ang “makakapal na ulap.”
- source_word: סֵתֶר
  choice: pantakip
  rationale: Ipinahihiwatig ng salita ang pagtatakip o pagkukubli. Sa kontekstong ito, ang “pantakip” ay kongkreto at angkop sa larawang ang mga ulap ang humahadlang sa paningin.
- source_word: לוֹ
  choice: sa kanya
  rationale: Pinananatili ang panghalip sa halip na tahasang ilagay ang “Diyos,” upang manatili ang daloy at di-tahasang paksa ng Hebreo.
- source_word: וְלֹא יִרְאֶה
  choice: kaya hindi siya nakakakita
  rationale: Ang pang-ugnay ay maaaring simpleng “at” o magpahiwatig ng bunga. Ang “kaya” ay natural sa Filipino at ipinakikitang ang hindi pagkakita ang sinasabing bunga ng pagtatakip ng mga ulap.
- source_word: חוּג
  choice: arko
  rationale: Maaaring tumukoy ang חוּג sa bilog o sa balantok na lawak. Ang “arko ng kalangitan” ay naghahatid ng larawan ng nakabalantok na langit nang hindi nagpapasok ng teknikal na paliwanag sa kosmolohiya.
- source_word: שָׁמַיִם
  choice: kalangitan
  rationale: Ang “kalangitan” ay natural, marangal, at angkop sa pariralang “arko ng kalangitan.”
- source_word: יִתְהַלָּךְ
  choice: naglalakad
  rationale: Ang anyo ng pandiwa ay naglalarawan ng paglakad o pagkilos sa palibot. Ang “naglalakad” ay tuwiran at pinananatili ang malinaw na larawan ng talata.
theological_decisions:
- issue: Pananaw ng nagsasalita at ang di-tahasang paksa
  choice: Pinanatili ang “siya” bilang pagtukoy sa Diyos sa paratang na iniuugnay ni Elifaz sa masama.
  alternative: Tahasang sabihing “Diyos” o basahin ito bilang neutral na pahayag tungkol sa pagiging dakila at mataas ng Diyos.
  rationale: Sa Job 22:13–14, ipinagpapatuloy ni Elifaz ang sinasabi niyang palagay ng masama tungkol sa Diyos. Hindi idinaragdag ang pangalang “Diyos” sapagkat panghalip lamang ang nasa Hebreo, kaya napapanatili ang pananaw at tensiyon ng konteksto.
- issue: Ugnayan ng pagtatakip at hindi pagkakita
  choice: Ginamit ang “kaya” upang ipahayag ang posibleng bungang diwa.
  alternative: “At hindi siya nakakakita,” bilang payak na magkatugmang sugnay.
  rationale: Pinahihintulutan ng Hebreo ang kapuwa pagbasa. Mas natural sa pangunahing tekstong Filipino ang bungang diwa, habang itinatala sa talababa ang mas literal na koordinasyon.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Pinanatili ang matalinghagang larawan ng ulap, paglakad, at nakabalantok na kalangitan, habang iniwasan ang sobrang teknikal o makalumang pananalita.
