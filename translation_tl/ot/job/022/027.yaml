  text: תַּעְתִּ֣יר אֵ֭לָי/ו וְ/יִשְׁמָעֶ֑/ךָּ וּ/נְדָרֶ֥י/ךָ תְשַׁלֵּֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/job/022/027.yaml
  text: You will pray to him[a], and he will hear you, and you will fulfill your vows.
translation:
  language: tl
  text: Mananalangin ka sa kanya, at pakikinggan ka niya, at tutuparin mo ang iyong mga panata.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “babayaran mo ang iyong mga panata.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּעְתִּיר
  choice: Mananalangin ka
  rationale: Ang Hiphil ng עתר ay tumutukoy sa taimtim na pagdalangin o pagsusumamo. Likas at malinaw sa modernong Tagalog ang “mananalangin,” at pinananatili nito ang diwang paghiling sa Diyos.
- source_word: אֵלָיו
  choice: sa kanya
  rationale: Literal itong “sa kanya.” Malinaw sa konteksto na Diyos ang tinutukoy, kaya hindi kailangang ulitin ang pangalang “Diyos.”
- source_word: וְיִשְׁמָעֶךָּ
  choice: at pakikinggan ka niya
  rationale: Ang שׁמע ay maaaring mangahulugang makarinig o makinig. Sa konteksto ng panalangin, mas natural ang “pakikinggan” at hindi nito labis na isinasalin bilang tiyak na “sasagutin.”
- source_word: וּנְדָרֶיךָ
  choice: ang iyong mga panata
  rationale: Ang נֶדֶר ay panatang ginawa sa Diyos. Pinananatili ng “mga panata” ang pangkalahatang kahulugan nang hindi nagdaragdag ng tiyak na ideya ng handog.
- source_word: תְשַׁלֵּם
  choice: tutuparin mo
  rationale: Kapag ginamit kasama ng mga panata, ang Piel ng שלם ay nangangahulugang bayaran o tuparin ang ipinangako. Ang “tutuparin” ang malinaw at likas na katumbas sa modernong Tagalog.
theological_decisions:
- issue: Kung isasalin nang literal na “babayaran mo ang iyong mga panata” o idyomatikong “tutuparin mo ang iyong mga panata” ang huling sugnay
  choice: tutuparin mo ang iyong mga panata
  alternative: babayaran mo ang iyong mga panata
  rationale: Tumutukoy ang Hebreong idyoma sa pagsasagawa ng ipinangako sa Diyos. Iniiwasan ng “tutuparin” ang maling impresyong pangunahing salapi ang tinutukoy, habang pinananatili ang pananagutang kaugnay ng panata.
translation_notes:
  register: Modernong Filipino Tagalog na natural, marangal, at madaling maunawaan. Ginamit ang “pakikinggan” sa halip na “diringgin” upang maiwasan ang mas lumang rehistro, at “panata” upang mapanatili ang relihiyosong diwa ng נֶדֶר.
