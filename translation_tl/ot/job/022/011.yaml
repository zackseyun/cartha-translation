  register: Makabagong Filipino na payak ngunit marangal ang himig. Pinanatili ang maigsi at matinding anyo ng tulang Hebreo; ginamit ang “kadiliman” sa halip na mas impormal na “dilim” upang umangkop sa dignidad ng konteksto.
