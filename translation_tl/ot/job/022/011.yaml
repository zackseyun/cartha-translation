  text: or darkness[a], so that you cannot see, and an abundance of waters covers you.
translation:
  language: tl
  text: 'o kadiliman kaya hindi ka makakita,

    at tatakpan ka ng napakaraming tubig.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “at tatakpan ka ng umaapaw na tubig” o “at tatabunan ka ng baha.” Maaaring ipahiwatig ng salitang Hebreo ang pag-apaw, ngunit pinananatili sa teksto ang mas malawak na diwang “napakaraming tubig.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹ
  choice: o
  rationale: Pinananatili nito ang maikli at tuwirang pang-ugnay na naghaharap ng isa pang posibleng kapahamakan sa paglalarawan ni Elifaz.
- source_word: חֹשֶׁךְ
  choice: kadiliman
  rationale: Tuwiran nitong ipinapahayag ang literal o matalinghagang dilim at ang kasunod na kawalan ng kakayahang makakita.
- source_word: לֹא תִרְאֶה
  choice: kaya hindi ka makakita
  rationale: Literal itong “hindi ka makakakita.” Idinagdag ang “kaya” upang maging natural sa Filipino ang ugnayang bunga sa pagitan ng kadiliman at hindi pagkakita, nang hindi binabago ang larawan.
- source_word: וְשִׁפְעַת
  choice: at napakaraming
  rationale: Ang שִׁפְעָה ay maaaring mangahulugang kasaganaan o pag-apaw. Ang “napakaraming” ay nagpapanatili sa malawak na diwa at hindi agad nililimitahan ang larawan sa isang tiyak na baha.
- source_word: מַיִם
  choice: tubig
  rationale: Bagaman anyong maramihan ang salitang Hebreo, karaniwang pangngalang di-mabilang ang “tubig” sa natural na Filipino at ang dami ay malinaw na sa “napakaraming.”
- source_word: תְּכַסֶּךָּ
  choice: tatakpan ka
  rationale: Tuwiran nitong pinananatili ang larawan ng pandiwang “takpan”; ang “lulunurin” o “dadaigin” ay magdaragdag ng pagpapakahulugang hindi tahasang nakasaad.
