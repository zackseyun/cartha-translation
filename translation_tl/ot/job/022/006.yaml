  text: For you took pledges from your brothers for no reason[b][a], and stripped the clothing from the naked.
translation:
  language: tl
  text: Sapagkat kumuha ka ng sangla mula sa iyong mga kapatid[b] nang walang dahilan,[a] at inalisan mo ng damit ang mga hubad.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “sinamsam mo ang panagot mula sa iyong mga kapatid nang walang sapat na dahilan.”
    reason: lexical_alternative
  - marker: b
    text: Ang “mga kapatid” ay maaari ring tumukoy nang mas malawak sa mga kapuwa miyembro ng pamayanan, hindi lamang sa mga kapatid sa dugo.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikilala nito ang paratang ni Elifaz bilang paliwanag o batayan ng naunang sinabi, kaya malinaw na naiuugnay ang talata sa daloy ng pananalita.
- source_word: תַחְבֹּל
  choice: kumuha ka ng sangla
  rationale: Ang pandiwang חבל ay tumutukoy rito sa pagkuha ng isang bagay bilang sangla o panagot sa utang. Likas at malinaw sa modernong Tagalog ang pariralang ito.
- source_word: אַחֶיךָ
  choice: iyong mga kapatid
  rationale: Pinananatili nito ang literal na panlalaking maramihang anyo ng Hebreo, habang ipinapaliwanag sa talababa na maaari itong tumukoy sa mas malawak na kapuwa miyembro ng pamayanan.
- source_word: חִנָּם
  choice: nang walang dahilan
  rationale: Ipinahahayag nito na walang makatarungang batayan ang ginawa, hindi lamang na walang ibinayad.
- source_word: וּבִגְדֵי
  choice: ng damit
  rationale: Ang בגד ay kasuotan o damit. Natural sa Tagalog ang kolektibong pangngalang “damit” sa kontekstong ito.
- source_word: עֲרוּמִּים
  choice: ang mga hubad
  rationale: 'Pinananatili ng tuwirang salin ang matinding kabalintunaan ng Hebreo: maging ang mga hubad o halos walang saplot ay inalisan pa ng damit.'
- source_word: תַּפְשִׁיט
  choice: hinubaran mo
  rationale: Ang Hiphil ng פשט ay nangangahulugang alisin o ipahubad ang kasuotan. Direkta at karaniwan sa Tagalog ang “hinubaran mo.”
