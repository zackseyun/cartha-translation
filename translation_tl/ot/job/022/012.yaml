id: JOB.22.12
reference: Job 22:12
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: הֲֽ/לֹא אֱ֭לוֹהַּ גֹּ֣בַהּ שָׁמָ֑יִם וּ/רְאֵ֤ה רֹ֖אשׁ כּוֹכָבִ֣ים כִּי רָֽמּוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/022/012.yaml
  text: Is not God in the height of heaven? And see the highest stars[b][a], how lofty they are.
translation:
  language: tl
  text: Hindi ba ang Diyos ay nasa kaitaasan ng langit[a]? At tingnan mo ang pinakamataas na mga bituin[b]—kung gaano kataas ang mga iyon!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa mga kaitaasan ng langit.” Literal sa Hebreo, “taas ng langit.”
    reason: lexical_alternative
  - marker: b
    text: Literal, “ang ulo” o “tuktok ng mga bituin”; ang diwa ay “ang pinakamataas na mga bituin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: Hindi ba
  rationale: Nagpapakilala ito ng retorikal na tanong na umaasang sasang-ayon ang kausap; likas at malinaw ito sa modernong Tagalog.
- source_word: אֱלוֹהַּ
  choice: ang Diyos
  rationale: Karaniwang katumbas ng pang-isahang katawagan sa Diyos, nang walang idinaragdag na katangian na wala sa salitang Hebreo.
- source_word: גֹּבַהּ שָׁמָיִם
  choice: nasa kaitaasan ng langit
  rationale: Pinananatili ang larawang tumutukoy sa lokasyon at taas. Idinagdag ang likas na Tagalog na pang-ugnay na “nasa,” bagaman walang tahasang pang-ukol sa Hebreo.
- source_word: וּרְאֵה
  choice: At tingnan mo
  rationale: Pinananatili kapwa ang pangatnig at ang pautos; higit na natural sa Tagalog ang “tingnan mo” sa ganitong panawagang magmasid.
- source_word: רֹאשׁ כּוֹכָבִים
  choice: ang pinakamataas na mga bituin
  rationale: Ang רֹאשׁ ay literal na “ulo/tuktok,” ngunit dito ay idyomatikong tumutukoy sa pinakamataas na bahagi o mga bituin; iniiwasan ng salin ang di-likas na “ulo ng mga bituin.”
- source_word: כִּי
  choice: kung gaano
  rationale: Sa kontekstong ito, ipinakikilala nito ang isang padamdam na pagmamasid sa taas ng mga bituin, hindi isang malinaw na sugnay na sanhi.
- source_word: רָמּוּ
  choice: kataas ang mga iyon
  rationale: Ipinahahayag ang pisikal na kataasan ng mga bituin. Ang “mataas” ay mas angkop dito kaysa “dakila” o “itinaas,” na maaaring magpahiwatig ng karangalan.
theological_decisions:
- issue: Kung ang tanong ay dapat palawakin bilang isang aral tungkol sa pagiging malayo o transendente ng Diyos
  choice: Panatilihin itong tuwirang retorikal na tanong na gumagamit ng larawang panlugar.
  alternative: Palawakin ang salin upang tahasang sabihing malayo ang Diyos o upang ilahad ang ipinahihiwatig na puna ni Elifaz kay Job.
  rationale: Ang talata ay bahagi ng pananalita ni Elifaz, ngunit ang mismong Hebreo ay naglalarawan lamang sa kaitaasan ng Diyos at sa taas ng mga bituin. Hindi dapat idagdag sa salin ang isang teolohikal na konklusyong hindi tahasang sinabi.
translation_notes:
  register: Makabago at marangal na Tagalog na madaling maunawaan. Pinanatili ang retorikal na tanong, ang pautos na pagmamasid, at ang matayog na larawang patula nang hindi ginagawang labis na archaic ang pananalita.
