  text: Like a wide breach they come[a]; amid the crash they roll on.
translation:
  language: tl
  text: Parang malawak na siwang, dumarating sila[a]; sa gitna ng pagkawasak ay gumugulong sila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Parang dumaraan sila sa malawak na siwang; sa ilalim ng pagkawasak ay gumugulong sila.”
    reason: Pinananatili ang posibleng pagbasa na ang כְּ ay maaaring iugnay sa pagdaan sa pamamagitan ng siwang at na ang תַּחַת ay may mas literal na diwang “sa ilalim ng.”
lexical_decisions:
- source_word: כְּ/פֶרֶץ רָחָב
  choice: Parang maluwang na butas sa pader
  rationale: Ang כְּ ay naghuhudyat ng paghahambing, at ang פֶרֶץ רָחָב ay isang malawak na siwang o butas na nabuksan sa pader. Nilinaw ang pader upang maging likas at madaling maunawaan sa Tagalog habang pinananatili ang larawan ng paglusob.
- source_word: יֶאֱתָיוּ
  choice: dumarating sila
  rationale: Tuwirang ipinahahayag ang pagdating o pagsulong ng karamihan; pinananatili ng aspektong pangkasalukuyan ang masiglang galaw ng tula.
- source_word: תַּחַת
  choice: sa gitna ng
  rationale: Bagaman karaniwang nangangahulugang 'sa ilalim ng,' maaari itong tumukoy rito sa kalagayan o kapaligiran ng mapaminsalang pagbagsak. Inilalagay sa talababa ang mas literal na alternatibo.
- source_word: שֹׁאָה
  choice: pagbagsak
  rationale: Maaaring tumukoy ang salita sa biglaang kapahamakan, pagkawasak, o ugong ng pagbagsak. Ang 'pagbagsak' ay umaayon sa larawan ng pader na nabutas at sa rumaragasang kilos ng mga sumasalakay.
- source_word: הִתְגַּלְגָּלוּ
  choice: gumugulong silang pasulong
  rationale: 'Pinananatili ang dinamiko at bahagyang reflexive na larawan ng hitpael ng גלל: tila gumugulong o rumaragasa silang tuloy-tuloy.'
