- from: Parang maluwang na butas sa pader, dumarating sila[a]; sa gitna ng pagbagsak, gumugulong silang pasulong.
  to: Parang malawak na siwang, dumarating sila[a]; sa gitna ng pagkawasak ay gumugulong sila.
  rationale: Pinalitan ang “maluwang na butas sa pader” ng “malawak na siwang” upang manatiling malapit sa פֶּרֶץ רָחָב nang walang idinagdag na bagay. Pinalitan ang “pagbagsak” ng “pagkawasak” upang masaklaw ang semantikong lawak ng שֹׁאָה. Pinanatili ang “gumugulong sila,” na sumasalamin sa masigla at reflexive na galaw ng הִתְגַּלְגָּלוּ, at pinanatili ang alternatibong pagbasa sa talababa.
