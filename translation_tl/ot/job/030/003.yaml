translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “salat,” “nangayayat,” at “pagkatiwangwang” upang panatilihin ang matinding makatang larawan nang manatiling madaling maunawaan. Hayagang inilagay sa mga talababa ang tunay na kawalang-katiyakan ng mga bihirang salitang Hebreo.
