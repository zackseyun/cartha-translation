  yaml_path: translation/ot/job/030/003.yaml
  text: Through want and hunger they are gaunt[b][a], gnawing the dry ground in the night of desolation and waste.
translation:
  language: tl
  text: Dahil sa kakulangan at gutom, payat na payat sila[a]; kinakayod nila ang tuyong lupa sa gabi[b], sa gitna ng pagkawasak at pagkatiwangwang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Sa kakulangan at gutom, sila ay lantang-lanta; kinakayod nila ang tigang na lupain.” Bihira at mahirap tiyakin ang ilang salita sa talatang ito, lalo na ang isinaling “payat na payat” at “kinakayod.” Ang pandiwang isinaling “kinakayod” ay inuunawa rin ng ilan na may diwang paglikas o pagtakas tungo sa tuyong lupain.'
    reason: lexical_alternative
  - marker: b
    text: Ang salitang Hebreo ay karaniwang nangangahulugang “kahapon” at maaari ring tumukoy sa nagdaang gabi; dito ay isinaling mas malawak na “sa gabi” ayon sa makatang konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּחֶסֶר וּבְכָפָן
  choice: Dahil sa salat at gutom
  rationale: Ipinahahayag ng mga pariralang may בְּ ang kalagayan o sanhi ng matinding paghihikahos. Ang “salat” at “gutom” ay likas at marangal na Filipino at pinananatili ang magkatambal na diwa.
- source_word: גַּלְמוּד
  choice: nangayayat sila
  rationale: Bihira at mahirap tiyakin ang salita; sa konteksto, malamang na inilalarawan nito ang pagkatuyo o matinding kapayatan dahil sa kakulangan. Ang “nangayayat” ay malinaw at hindi labis na teknikal.
- source_word: הָעֹרְקִים
  choice: kinakayod nila
  rationale: Bihira at pinagtatalunang anyo ito. Sa konteksto ng paghahanap ng makakain sa tigang na lupain, ang “kinakayod” ay nagpapakita ng desperadong paghahalungkat nang hindi ipinipilit ang mas tiyak na larawang “nginangatngat.”
- source_word: צִיָּה
  choice: ang tuyong lupa
  rationale: Tumutukoy ang צִיָּה sa tigang o tuyong lupain. Pinananatili ng salin ang kongkretong larawan.
- source_word: אֶמֶשׁ
  choice: sa gabi
  rationale: Karaniwang nangangahulugang “kahapon” o “kagabi,” ngunit maaaring unawain dito bilang pagtukoy sa gabi. Ang mas malawak na “sa gabi” ay umaangkop sa makatang tagpo habang inilalahad sa talababa ang kawalang-katiyakan.
- source_word: שׁוֹאָה וּמְשֹׁאָה
  choice: sa gitna ng pagkawasak at pagkatiwangwang
  rationale: Ang magkatambal na mga salita ay nagpapatingkad sa ganap na pagkaguho at pagkatiwangwang ng pook. Pinananatili ng salin ang paralelismo at malagim na himig.
