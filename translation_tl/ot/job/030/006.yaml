  text: In the gullies of the wadis they dwell[b][a], in holes of the dust and among the rocks.
translation:
  language: tl
  text: Sa mga bangin ng mga daluyan ng tubig sila naninirahan,[a] sa mga butas sa alikabok at sa mga batong bangin.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Sa mga bangin ng mga pana-panahong daluyan ng tubig sila naninirahan.” Ang salitang Hebreo na נְחָלִים ay maaaring tumukoy sa mga wadi, mga daluyan ng agos, o mga lambak, ayon sa konteksto.
    reason: lexical_alternative
  - marker: b
    text: O “sa mga butas sa lupa at sa mga batuhang talampas.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּעֲרוּץ
  choice: Sa mga bangin
  rationale: Ang עָרוּץ ay tumutukoy sa hiwa o malalim na lagusan na karaniwang inuukit ng rumaragasang tubig. Likas at malinaw sa Filipino ang “mga bangin” para sa ganitong mababang, mabatong lugar.
- source_word: נְחָלִים
  choice: ng tuyong mga batis
  rationale: Ang נַחַל ay maaaring tumukoy sa lambak, pana-panahong daluyan ng tubig, o wadi. Ipinahihiwatig ng “tuyong mga batis” ang karaniwang tuyong daluyan nang hindi gumagamit ng di-pamilyar na salitang “wadi.”
- source_word: לִשְׁכֹּן
  choice: sila naninirahan
  rationale: Bagaman infinitive construct ang anyo, idiomatiko itong nagpapahayag dito ng paninirahan ng mga taong tinutukoy sa naunang konteksto. Ang “naninirahan” ay dignified at natural.
- source_word: חֹרֵי
  choice: mga butas
  rationale: Ang חוֹר ay butas o hungkag na puwang. Pinananatili ng “mga butas” ang marahas at abang larawan; ang “mga yungib” ay maaaring magpahiwatig ng mas malaking kanlungan.
- source_word: עָפָר
  choice: lupa
  rationale: Ang עָפָר ay maaaring alikabok, maluwag na lupa, o mismong lupa. Sa pariralang “mga butas sa lupa,” mas natural sa Filipino ang “lupa” kaysa “alikabok,” habang nananatili ang larawan ng paghuhukay o hungkag na tirahan.
- source_word: וְכֵפִים
  choice: at sa gitna ng mga bato
  rationale: Ang כֵּפִים ay mga bato o batuhang bangin. Ginagawang tahas ng “sa gitna ng mga bato” ang ipinahihiwatig na lokatibong kaugnayan at likas itong katambal ng naunang parirala.
