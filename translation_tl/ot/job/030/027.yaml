  text: My inward parts boil and do not rest[a]; days of affliction confront me.
translation:
  language: tl
  text: Kumukulo ang aking mga laman-loob at hindi mapalagay[a]; sumasalubong sa akin ang mga araw ng paghihirap.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Nag-aalab ang aking kaloob-looban at hindi humuhupa; dumarating sa akin ang mga araw ng pagdurusa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵעַי
  choice: aking mga laman-loob
  rationale: Tumutukoy ang מֵעֶה sa mga panloob na bahagi ng katawan at, sa tula, sa kaibuturan ng damdamin. Pinananatili ng “mga laman-loob” ang matindi at pisikal na larawan nang hindi ito pinapalitan ng mas mapagpaliwanag na “puso” o “kalooban.”
- source_word: רֻתְּחוּ
  choice: kumukulo
  rationale: Ang pandiwang רתח ay naglalarawan ng pagkulo o matinding pag-alab. Ang “kumukulo” ay tuwiran at malinaw, at pinananatili ang larawang pisikal ng matinding kaguluhan sa loob.
- source_word: וְלֹא דָמּוּ
  choice: at hindi mapalagay
  rationale: Maaaring mangahulugan ang דמם na tumahimik, manatiling payapa, o tumigil. Sa konteksto ng kumukulong mga laman-loob, likas na ipinahahayag ng “hindi mapalagay” ang patuloy na pagkabalisa, habang kinikilala sa talababa ang alternatibong diwa ng hindi paghupa.
- source_word: קִדְּמֻנִי
  choice: sumasalubong sa akin
  rationale: Ang קדם dito ay may diwang pagdating upang salubungin o harapin ang isang tao. Pinananatili ng “sumasalubong sa akin” ang pagsasatao sa mga araw ng paghihirap at ang bahagyang kalabuan kung ang mga ito ay basta dumarating o mistulang humaharap nang may panganib.
- source_word: יְמֵי עֹנִי
  choice: mga araw ng paghihirap
  rationale: Maaaring tumukoy ang עֹנִי sa paghihirap, pagdurusa, kaabahan, o kahirapan. Sa panaghoy ni Job, mas malawak na pagdurusa ang tinutukoy kaysa sa kakulangan sa kabuhayan lamang.
