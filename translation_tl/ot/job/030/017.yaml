  naturalness: Hindi likas ang “binubutas ang mga buto ko sa loob ko,” dahil ang pagkakalagay ng pariralang “sa loob ko” ay nakalilito at tila kalabisan. Mas malinaw at mas patula ang “ang mga buto ko'y binubutas sa loob ko.” Ang “hindi humihimlay” ay katanggap-tanggap na matulaing personipikasyon at pinananatili ang larawan ng Hebreong “hindi humihiga.”
  terminology: “Mga litid” ang higit na maingat na pangunahing salin para sa terminong maaaring tumukoy sa mga hibla o daluyan ng katawan; inilalagay ang “mga ugat” at ang metonimikong “mga kirot” bilang mga posibilidad sa talababa. Walang isyung teolohikal o pangalang pantangi.
