  text: At night my bones are pierced in me[b][a], and my gnawing pains do not lie down.
translation:
  language: tl
  text: Sa gabi, ang mga buto ko'y binubutas sa loob ko[a], at ang mga litid ko[b] ay hindi humihimlay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “binubutas mula sa ibabaw ko.” Mahirap ang pagkakabuo ng Hebreo; maaari ring unawain ang pandiwa sa mas malawak na diwang “nginangatngat.”
    reason: lexical_alternative
  - marker: b
    text: O “mga ugat ko.” Pambihira ang salitang Hebreo at maaaring tumukoy sa mga hibla o daluyan sa katawan, o, sa pinalawak na diwa, sa mga kirot na patuloy na ngumangatngat.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַיְלָה
  choice: Sa gabi
  rationale: Likas na panandang pamanahon sa modernong Tagalog at malinaw na tumutukoy sa nangyayari tuwing gabi.
- source_word: עֲצָמַי
  choice: ang mga buto ko
  rationale: Pinananatili ang tahasan at kongkretong larawan ng matinding paghihirap sa katawan.
- source_word: נִקַּר
  choice: binubutas
  rationale: Ipinahahayag ang pangunahing diwa ng pandiwang נקר, ang pagbutas o pag-ukit nang malalim, at pinananatili ang marahas na larawang patula.
- source_word: מֵעָלָי
  choice: sa loob ko
  rationale: Mahirap at di-likas isalin nang literal ang parirala; sa konteksto, ipinahahayag nito ang pagdurusang nararanasan sa mismong katawan. Inilalahad sa talababa ang suliraning tekstuwal.
- source_word: וְעֹרְקַי
  choice: at ang mga ugat ko
  rationale: Ang pambihirang pangngalan ay malamang na tumutukoy sa mga daluyan o hibla sa katawan. Ang “mga ugat” ay kongkreto, madaling maunawaan, at hindi agad nagpapasya na metonimikong tumutukoy ito sa mga kirot.
- source_word: לֹא יִשְׁכָּבוּן
  choice: ay hindi humihimlay
  rationale: Pinananatili ang literal na larawang “hindi nahihiga” bilang personipikasyon ng mga ugat o kirot na hindi kailanman tumatahimik o nagpapahinga.
