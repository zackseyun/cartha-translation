  yaml_path: translation/ot/job/030/021.yaml
  text: You have turned cruel to me[b][a]; with the might of your hand you oppose me.
translation:
  language: tl
  text: Naging malupit ka sa akin[a]; sa lakas ng iyong kamay, kinakalaban mo ako[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Wala kang awa sa akin.”
    reason: lexical_alternative
  - marker: b
    text: O “inuusig mo ako” o “sinasalakay mo ako.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תֵּהָפֵךְ
  choice: Naging
  rationale: Ipinahahayag ng Niphal ng הפך ang pagbabago ng kalagayan. Likas sa modernong Tagalog ang “naging” at hindi nito labis na tinutukoy kung pasibo o pasarili ang anyo.
- source_word: לְאַכְזָר
  choice: malupit
  rationale: Tuwirang ipinahahayag ng אַכְזָר ang kalupitan o kawalan ng awa. Ang “malupit” ay malinaw, dignificado, at natural bilang panaguri.
- source_word: לִי
  choice: sa akin
  rationale: Pinananatili nito ang ugnayan o direksiyon ng לְ nang hindi dinaragdagan ang pahayag ng mas tahasang “laban sa akin” sa unang linya.
- source_word: בְּעֹצֶם
  choice: sa lakas ng
  rationale: Ang עֹצֶם ay tumutukoy sa lakas o kapangyarihan, at ang “sa lakas ng” ay natural na nagpapahayag ng instrumental na gamit ng בְּ.
- source_word: יָדְךָ
  choice: iyong kamay
  rationale: Pinananatili ang konkretong larawan ng kamay sa halip na ipakahulugang “kapangyarihan,” sapagkat malinaw at mahalaga ang antropomorpikong larawan.
- source_word: תִשְׂטְמֵנִי
  choice: kinakalaban mo ako
  rationale: Ang שׂטם ay maaaring magpahayag ng pagkapoot, pagkontra, o mapanlabang pagkilos. Ang “kinakalaban” ay nagpapanatili sa aktibong poot ng konteksto nang hindi ipinapalagay ang matagal na pagtugis na maaaring ipahiwatig ng “inuusig.”
theological_decisions:
- issue: Antropomorpikong paglalarawan sa pagkilos ng Diyos
  choice: Pinanatili ang tuwirang paratang sa ikalawang panauhan at ang larawang “iyong kamay.”
  alternative: Palambutin bilang “ang iyong kapangyarihan ay laban sa akin.”
  rationale: Ang panaghoy ni Job ay sadyang matindi at tuwirang nakikipagtalo sa Diyos. Dapat panatilihin ang tensiyong teolohikal sa halip na pagaanin ang kanyang paratang.
- issue: Antas ng poot sa תִשְׂטְמֵנִי
  choice: kinakalaban mo ako
  alternative: inuusig mo ako; sinasalakay mo ako; kinapopootan mo ako
  rationale: Pinananatili ng “kinakalaban” ang malawak na diwa ng aktibong pagkapoot o pagkontra. Hindi nito nililimitahan ang pandiwa sa panloob na damdamin lamang o sa isang tiyak na uri ng pag-atake.
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran, marangal, at madaling maunawaan. Pinanatili ang matinding himig ng panaghoy at ang parallelism ng dalawang sugnay.
