  text: I have become a brother to jackals[a], and a companion to ostriches.
translation:
  language: tl
  text: 'Naging kapatid ako ng mga chakal,

    at kasama ng mga avestrus.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “mga anak na babae ng ostrich,” isang Hebreong ekspresyon na tumutukoy sa mga avestrus.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָח
  choice: kapatid
  rationale: Pinananatili ang tuwirang talinghaga ng Hebreong ‘kapatid,’ na nagpapahayag ng malapit na pagkakaugnay ni Job sa mga nilalang ng ilang.
- source_word: הָיִיתִי
  choice: naging
  rationale: Ang aspektong perpektibo ng pandiwa ay likas na naipahahayag sa Filipino bilang pagbabagong humantong sa kalagayang inilalarawan ni Job.
- source_word: לְתַנִּים
  choice: ng mga chakal
  rationale: Sa tulang naglalarawan ng ilang at pagkawasak, malamang na mga chakal ang tinutukoy ng תַנִּים. Ang ‘ng’ ay likas na kaakibat ng ‘kapatid’ sa Filipino.
- source_word: וְרֵעַ
  choice: at kasama
  rationale: Ang ‘kasama’ ay angkop sa kahulugang kaibigan o kasamahan at pinananatili ang paralelismo sa ‘kapatid’ nang hindi nagdaragdag ng antas ng emosyonal na pagiging matalik.
- source_word: לִבְנוֹת יַעֲנָה
  choice: ng mga avestrus
  rationale: Ang literal na ‘mga anak na babae ng avestrus’ ay isang Hebreong ekspresyon para sa mga avestrus; ang likas na Filipino ay gumagamit lamang ng pangngalang maramihan.
