translation_notes:
  register: Makabago at marangal na Filipino, na may payak na paralelismong patula. Ginamit ang tiyak na katawagang ‘chakal’ sa halip na mas malawak na ‘asong-gubat,’ at ‘avestrus’ bilang karaniwang salitang Filipino.
