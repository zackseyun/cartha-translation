translation:
  language: tl
  text: Tiyak na walang sinumang mag-uunat ng kamay laban sa isang guho[a], kung sa kanyang kapahamakan ay may sigaw para sa tulong.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O kaya: “Tiyak na walang sinumang mag-uunat ng kamay sa isang bunton ng mga guho; kung sa kanyang kapahamakan ay may sigaw para sa tulong.” Mahirap unawain ang Hebreo ng talatang ito, lalo na ang mga katagang isinaling “laban sa isang guho” at ang malabong anyong maaaring mangahulugang “sa kanila” o “mula sa kanila.”'
    reason: alternative_reading
lexical_decisions:
- source_word: אַךְ
  choice: Tiyak na
  rationale: Ginamit bilang katagang paniniyak na nagpapakilala sa pahayag ni Job, hindi bilang panrestrictang “lamang” o panalungat na “ngunit.”
- source_word: בְּעִי
  choice: laban sa isang guho
  rationale: Mahirap at bihira ang anyo ng salita, ngunit malamang na tumutukoy sa guho o bunton ng mga guho. Kasama ng idyomang “iunat ang kamay,” ipinahihiwatig ng “laban sa” ang pagkilos na nakapipinsala, habang pinananatili ang maikling larawan ng Hebreo.
- source_word: יִשְׁלַח יָד
  choice: nag-uunat ng kamay
  rationale: Pinananatili ang karaniwang larawang Hebreo at, sa pamamagitan ng “laban sa,” naihahayag ang posibleng mapaminsalang diwa nang hindi ito ginagawang tahasang “sinasalakay.”
- source_word: אִם
  choice: kung
  rationale: Pinananatili ang kondisyunal na kataga at ang hindi tiyak na ugnayan ng dalawang sugnay sa mahirap na talatang ito.
- source_word: בְּפִידוֹ
  choice: sa kanyang kapahamakan
  rationale: Ang פיד ay tumutukoy sa sakuna o kapahamakan; pinananatili ng salin ang pang-ukol at panlalaking panghalip ng Hebreo.
- source_word: לָהֶן
  choice: hindi tahasang isinalin sa pangunahing teksto
  rationale: Malabo ang anyo at tungkulin nito sa konteksto; maaaring unawaing “sa kanila,” “mula sa kanila,” o may kaugnayan sa naunang kalagayan. Ang pagsingit ng tiyak na relasyon sa pangunahing teksto ay labis na lulutas sa tunay na kalabuan.
- source_word: שׁוּעַ
  choice: sigaw para sa tulong
  rationale: Tumutukoy sa sigaw ng isang nasa kagipitan na humihingi ng saklolo; malinaw at likas ito sa modernong Tagalog.
