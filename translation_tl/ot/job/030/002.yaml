  - severity: medium
    issue: Hindi angkop ang “kasibulan” bilang lexical alternative sa talababa
    rationale: Ang kasibulan ay karaniwang ‘youth’ o panahon ng pag-usbong, samantalang ang ibinibigay na alternatibong pagbasa ay mature prime/full strength. Ang “kapanahunan ng kalakasan” ay mas tumpak at hindi nagpapataw ng isang tiyak na interpretasyon sa bihirang salita.
