  text: Maging ang lakas ng kanilang mga kamay—ano naman ang silbi niyon sa akin? Naglaho na ang kanilang sigla.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “naglaho na ang kanilang kapanahunan ng kalakasan,” kung ang bihirang salitang Hebreo ay tumutukoy sa ganap na gulang o lubos na lakas.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: Maging
  rationale: Ipinahahayag ang mariing pagdaragdag sa mapanghamak na pangangatwiran ni Job; natural sa Filipino ang “Maging ang…” sa ganitong ayos.
- source_word: כֹּחַ
  choice: lakas
  rationale: Tumutukoy sa pisikal na kakayahan o pakinabang sa paggawa.
- source_word: יְדֵיהֶם
  choice: kanilang mga kamay
  rationale: Pinananatili ang kongkretong larawang Hebreo, kung saan ang mga kamay ay kumakatawan din sa kakayahang gumawa.
- source_word: לָמָה לִּי
  choice: ano iyon sa akin?
  rationale: Pinananatili ang retorikal at mapagwalang-bahalang himig nang hindi lubusang ipinapaliwanag bilang “ano ang pakinabang nito sa akin?”
- source_word: עָלֵימוֹ
  choice: kanilang
  rationale: Iniuugnay sa kasunod na bihirang pangngalan upang likas na maipahayag ang diwang tumutukoy sa sigla o kasibulan nila.
- source_word: אָבַד
  choice: Naglaho na
  rationale: Ipinahahayag ang ganap na pagkawala sa natural na modernong Filipino; ang “napahamak” ay maaaring magpahiwatig na ang mga tao mismo ang namatay.
- source_word: כָּלַח
  choice: sigla
  rationale: Ang bihirang salitang ito ay malamang na tumutukoy sa lakas ng ganap na gulang o kasibulan; maikli at natural ang “sigla,” habang inilalagay sa talababa ang tunay na leksikal na alternatibo.
