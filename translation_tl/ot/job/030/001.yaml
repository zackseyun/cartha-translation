  text: But now those younger than I laugh at me[a], whose fathers I refused to set with the dogs of my flock.
translation:
  language: tl
  text: Ngunit ngayo’y pinagtatawanan ako ng mga mas bata sa akin—mga taong ang mga ama ay tumanggi akong ilagay kasama ng mga aso ng aking kawan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “kasama ng mga asong nagbabantay sa aking mga tupa.” Mas literal sa Hebreo, “kasama ng mga aso ng aking kawan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Ngunit ngayo’y
  rationale: Ipinahihiwatig ng parirala ang matinding pagsalungat sa dating karangalang inilarawan ni Job sa naunang kabanata.
- source_word: שָׂחֲקוּ עָלַי
  choice: pinagtatawanan ako
  rationale: Pinananatili nito ang konkretong larawan ng pagtawa na, sa konteksto at sa gamit ng עַל, ay nagpapahayag ng panunuya at paghamak kay Job.
- source_word: צְעִירִים מִמֶּנִּי לְיָמִים
  choice: mga mas bata sa akin
  rationale: Ang literal na pagtukoy sa pagiging mas kaunti ang mga araw ay isang idyoma tungkol sa edad; likas itong ipinapahayag sa Filipino bilang mas bata sa akin.
- source_word: אֲשֶׁר מָאַסְתִּי אֲבוֹתָם
  choice: mga taong ang mga ama’y tinanggihan ko
  rationale: Ang מָאַס ay nagpapahiwatig ng pagtanggi o paghamak. Ang “tinanggihan” ay nagpapanatili sa diwa nang hindi dinaragdagan ang tindi nito, at malinaw na ang tinutukoy ay ang mga ama ng mga nakababatang nanunuya.
- source_word: לָשִׁית
  choice: isama
  rationale: Bagaman literal na “ilagay,” mas likas sa Filipino ang “isama” kasunod ng עִם (“kasama/ng”) at pinananatili nito ang konkretong paghahambing.
- source_word: עִם כַּלְבֵי צֹאנִי
  choice: sa mga aso ng aking kawan
  rationale: Malapit ito sa literal na Hebreong “kasama ng mga aso ng aking kawan” at hindi nito nililimitahan ang kahulugan sa sheepdogs, bagaman malamang na mga asong tagapagbantay ang tinutukoy.
