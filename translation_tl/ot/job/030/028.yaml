  text: I go about darkened[a], but not by the sun[b]; I stand up in the assembly and cry for help.
translation:
  language: tl
  text: Naglalakad ako, madilim ang aking anyo[a], ngunit hindi dahil sa araw[b]; tumatayo ako sa kapulungan at sumisigaw para humingi ng saklolo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nagluluksa” o “maitim ang anyo.” Ang salitang Hebreo ay maaaring maglarawan kapuwa ng dalamhati at ng madilim o maitim na anyo.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “hindi sa araw.” Ang diwa ay hindi araw o init nito ang sanhi ng kanyang madilim o maitim na anyo.
    reason: lexical_alternative
lexical_decisions:
- source_word: קֹדֵר
  choice: nangingitim
  rationale: Maaaring tumukoy ang pandiwaring Hebreo sa pagiging madilim o nangingitim at maaari rin itong magpahiwatig ng pagluluksa. Pinananatili ng “nangingitim” ang nakikitang larawan nang hindi inaalis ang pahiwatig ng matinding dalamhati.
- source_word: הִלַּכְתִּי
  choice: Naglalakad ako
  rationale: Sa makatang panaghoy, inilalarawan nito ang patuloy na kalagayan at pagkilos ni Job; ang pangkasalukuyang anyo ay likas sa Filipino at nagpapanatili ng buhay na himig ng pahayag.
- source_word: בְּלֹא חַמָּה
  choice: ngunit hindi dahil sa araw
  rationale: Literal itong “hindi sa/pamamagitan ng araw.” Ipinahihiwatig ng konteksto na ang pangingitim niya ay hindi bunga ng araw, kaya nililinaw ng “dahil sa” ang malamang na ugnayang sanhi habang itinatala sa talababa ang literal na anyo.
- source_word: קַמְתִּי
  choice: tumitindig ako
  rationale: Ipinakikita nito ang pampublikong pagkilos ni Job sa gitna ng nagkakatipong mga tao. Ang “tumitindig” ay marangal at natural sa kontekstong ito.
- source_word: בַקָּהָל
  choice: sa kapulungan
  rationale: Ang קהל ay isang nagkakatipong pangkat. Malawak at tumpak ang “kapulungan” at hindi ito nag-aangkat ng tiyak na kahulugang pangdenominasyon.
- source_word: אֲשַׁוֵּעַ
  choice: sumisigaw para humingi ng saklolo
  rationale: Ang ugat na שוע ay nagpapahayag ng desperadong paghingi ng tulong. Tahasang ipinakikita ng salin ang layunin ng sigaw at ang tindi ng panaghoy.
