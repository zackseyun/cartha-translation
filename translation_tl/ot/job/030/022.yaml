  yaml_path: translation/ot/job/030/022.yaml
  text: You lift me up to the wind[a]; you make me ride on it[b], and you toss me about in the storm.
translation:
  language: tl
  text: Itinataas mo ako tungo sa hangin[a]; pinasasakay mo ako sa hangin, at nilulusaw mo ako sa unos.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “Itinataas mo ako sa hangin at pinasasakay mo ako rito.”'
    reason: lexical_alternative
  - marker: b
    text: 'Mahirap tiyakin ang huling salita sa Hebreo. Maaaring tumukoy ito sa unos, dumadagundong na kaguluhan, o kapahamakan. Maaari ring isalin ang huling bahagi: “ipinapahagis-hagis mo ako sa unos,” o “nilulusaw mo ako hanggang sa kapahamakan.”'
    reason: alternative_reading
lexical_decisions:
- source_word: תִּשָּׂאֵנִי
  choice: Itinataas mo ako
  rationale: Ang נשׂא ay maaaring mangahulugang ‘itaas,’ ‘buhatin,’ o ‘dalhin.’ Pinananatili ng ‘itinataas’ ang kongkretong larawan ng pag-angat at ang tuwirang pakikipag-usap ng nagsasalita sa Diyos.
- source_word: אֶל רוּחַ
  choice: sa hangin
  rationale: Maaaring mangahulugan ang רוּחַ na ‘hangin,’ ‘hininga,’ o ‘espiritu.’ Dahil sa larawan ng marahas na unos sa konteksto, ‘hangin’ ang pinakaangkop. Ang ‘sa hangin’ ay likas sa Filipino at maaari ring unawaing pag-angat sa pamamagitan o tungo sa hangin.
- source_word: תַּרְכִּיבֵנִי
  choice: pinasasakay mo ako rito
  rationale: Ang Hiphil ng רכב ay ‘pasakayin’ o ‘pagawing sumakay.’ Ang ‘rito’ ay tumutukoy sa hangin at ginagawang malinaw sa Filipino ang ipinahihiwatig na sinasakyan.
- source_word: וּתְמֹגְגֵנִי
  choice: nilulusaw mo ako
  rationale: Mula sa מוג, na karaniwang may diwang ‘matunaw,’ ‘malusaw,’ o ‘manghina.’ Pinananatili ng ‘nilulusaw’ ang matinding larawang wari’y winawasak o binubuwag ang pagkatao ni Job, sa halip na palitan ito ng mas tiyak ngunit di-gaanong tuwirang ‘ipinapaghagisan.’
- source_word: תשוה
  choice: sa unos
  rationale: Napakahirap at αng anyo at kahulugan ng huling salitang Hebreo. Ang ‘sa unos’ ay umaayon sa larawan ng hangin at mapanirang kaguluhan, ngunit minamarkahan sa talababa ang tunay na kawalang-katiyakan.
theological_decisions:
- issue: Ang Diyos ang tuwirang gumagawa ng mga kilos sa taludtod
  choice: 'Pinanatili ang ikalawang panauhang isahan: ‘mo’'
  alternative: Gawing di-tuwiran o impersonal ang pagkilos
  rationale: Tuwirang kinakausap ni Job ang Diyos sa Hebreo. Hindi pinalalambot ng salin ang tensiyong teolohikal ng kanyang panaghoy.
- issue: Kahulugan ng וּתְמֹגְגֵנִי at תשוה
  choice: ‘nilulusaw mo ako sa unos’ na may talababa tungkol sa kawalang-katiyakan
  alternative: ‘ipinapaghagisan mo ako sa bagyo’ o ‘dinadala mo ako sa kapahamakan’
  rationale: Pinananatili ng pangunahing salin ang karaniwang kahulugan ng מוג habang hindi ikinukubli ng talababa ang hirap ng pangwakas na salita at ang ibang posibleng pagbasa.
translation_notes:
  register: Makabagong Filipino na marangal at patula, ngunit madaling maunawaan. Ginamit ang ‘unos’ upang tumugma sa matinding larawang patula; pinanatili ang ‘nilulusaw’ dahil mas malapit ito sa leksikal na diwa ng Hebreo. Ang lahat ng marker na [a] at [b] ay nasa pangunahing teksto.
