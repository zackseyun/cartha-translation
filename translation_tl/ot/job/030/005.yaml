  source_fidelity: Kailangang palitan ang “mula sa gitna” ng “mula sa bangin.” Sa kontekstong ito ng Job 30, ang גֵּו ay mas malamang na tumutukoy sa isang bangin, gulod, o lambak kaysa sa “gitna.” Napananatili ng di-tiyak na “may sumisigaw” ang hindi tinukoy na paksa ng pandiwang Hebreo. Ang “laban sa kanila” ay isang katanggap-tanggap na pagpapahayag ng pagalit na direksiyon ng sigaw.
  naturalness: Likas at malinaw ang binagong Filipino. Ang “na para bang sa isang magnanakaw” ay mas maikli at idiomatiko kaysa “na gaya ng pagsigaw laban sa isang magnanakaw,” habang pinananatili ang ipinahihiwatig na kilos sa paghahambing.
  terminology: Ang “bangin” ang pinakamalapit na modernong Filipino para sa heograpikong larawan ng ravine/gorge. Ang “itinataboy” ay angkop para sa sapilitang pagpapalayas. Ang “magnanakaw” ay wastong katumbas ng גַּנָּב.
