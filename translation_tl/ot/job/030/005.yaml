  text: They are driven out from the midst[b][a]; they shout after them as after a thief.
translation:
  language: tl
  text: Itinataboy sila mula sa bangin[a]; may sumisigaw laban sa kanila na para bang sa isang magnanakaw.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mula sa lambak,” “mula sa gulod,” o “mula sa kaloob-looban.”
    reason: lexical_alternative
  - marker: b
    text: O, “sumisigaw sila laban sa kanila na parang laban sa isang magnanakaw.” Hindi tahasang tinutukoy sa Hebreo kung sino ang sumisigaw.
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: מִן־גֵּו
  choice: mula sa gitna
  rationale: Ang מִן ay nagpapahiwatig ng pinagmulan o paghihiwalay, at ang גֵּו ay maaaring tumukoy sa gitna o kaloob-looban. Pinananatili ng “mula sa gitna” ang maikli at hindi ganap na tiyak na pahayag ng Hebreo.
- source_word: יְגֹרָשׁוּ
  choice: itinataboy sila
  rationale: Ang pandiwa ay nagsasaad ng sapilitang pagpapalayas. Ang anyong balintiyak sa Filipino ay nagpapanatili ng diin sa dinaranas nila.
- source_word: יָרִיעוּ
  choice: may sumisigaw
  rationale: Ang pandiwa ay nangangahulugang magtaas ng sigaw. Hindi malinaw sa konteksto kung sino ang gumagawa nito, kaya ang di-tiyak na “may” ay natural sa Filipino at hindi nagdaragdag ng tiyak na paksa.
- source_word: עָלֵימוֹ
  choice: laban sa kanila
  rationale: Sa kontekstong ito, ang עַל ay nagpapahiwatig ng pagalit na direksiyon ng sigaw. Malinaw ito sa Filipino nang hindi ipinapalagay na literal na hinahabol sila.
- source_word: כַּגַּנָּב
  choice: na gaya ng pagsigaw laban sa isang magnanakaw
  rationale: Ipinahihiwatig ng paghahambing ang sigaw na ibinabaling sa isang magnanakaw. Nilinaw ang elipsis upang maging likas sa Filipino habang pinananatili ang paghahambing.
