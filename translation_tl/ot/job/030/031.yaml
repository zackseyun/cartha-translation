  yaml_path: translation/ot/job/030/031.yaml
  text: So my lyre has become mourning[b][a], and my pipe the sound of those who weep.
translation:
  language: tl
  text: 'Kaya ang aking lira[a] ay naging pagluluksa,

    at ang aking plawta[b] ay naging tunog ng mga umiiyak.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “alpa.” Ang salitang Hebreo na כִּנּוֹר ay maaaring tumukoy sa lira o sa isang instrumentong de-kuwerdas na kahawig ng alpa.
    reason: lexical_alternative
  - marker: b
    text: O “instrumentong hinihipan.” Ang salitang Hebreo na עוּגָב ay tumutukoy sa isang instrumentong hinihipan, ngunit hindi tiyak ang eksaktong anyo nito.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: ay naging
  rationale: Ipinahahayag nito ang pagbabagong nagbunga ng kasalukuyang kalagayan ni Job; natural sa Filipino ang “ay naging” at hindi nito dinaragdagan ang diwa.
- source_word: לְאֵבֶל
  choice: panaghoy
  rationale: Ang אֵבֶל ay tumutukoy sa pagluluksa o pagpapahayag ng matinding dalamhati. Ang “panaghoy” ay angkop sa makatang paglalarawan sa musikang napalitan ng pag-iyak.
- source_word: כִּנֹּרִי
  choice: aking lira
  rationale: Ang כִּנּוֹר ay sinaunang instrumentong de-kuwerdas na maaaring ilarawang lira o alpa. Pinili ang “lira” upang maiwasan ang larawan ng makabagong malaking alpa, habang inilalahad sa talababa ang tunay na leksikal na kalabuan.
- source_word: וְעֻגָבִי
  choice: aking plawta
  rationale: Ang עוּגָב ay isang instrumentong hinihipan, ngunit hindi tiyak ang eksaktong anyo nito. Ang “plawta” ay malinaw at likas sa makabagong Filipino; binabanggit sa talababa ang kawalang-katiyakan.
- source_word: לְקוֹל
  choice: ay naging tinig ng
  rationale: Maaaring mangahulugan ang קוֹל ng “tinig” o “tunog.” Sa pariralang kasama ang mga umiiyak, mas natural at makata ang “tinig,” at iniuugnay nito ang instrumento sa mismong pag-iyak nang hindi nilulutas nang labis ang metapora.
- source_word: בֹּכִים
  choice: mga umiiyak
  rationale: Ang participle ay tumutukoy sa mga taong aktuwal na umiiyak. Tuwiran at likas sa Filipino ang “mga umiiyak.”
