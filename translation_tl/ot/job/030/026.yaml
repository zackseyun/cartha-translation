  text: For I hoped for good[a], but evil came; I waited for light, but darkness came.
translation:
  language: tl
  text: Sapagkat inasahan kong darating ang mabuti, ngunit kapahamakan[a] ang dumating; naghintay ako ng liwanag, ngunit kadiliman ang dumating.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “masama.” Ang salitang Hebreo rito ay malamang na tumutukoy sa kapahamakan o kasawiang sinapit, hindi sa moral na kasamaan.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikita ang paliwanag o dahilan sa pagpapatuloy ng panaghoy ni Job.
- source_word: טוֹב
  choice: mabuti
  rationale: Ginamit bilang pangngalang diwa para sa anumang kapaki-pakinabang o kanais-nais; pinananatili rin nito ang malawak na pagtutol sa רָע.
- source_word: קִוִּיתִי
  choice: umasa ako
  rationale: Naghahayag ng may-pag-asang paghihintay o inaasahan.
- source_word: וַיָּבֹא
  choice: ang dumating
  rationale: Pinananatili ang payak at makapangyarihang pag-uulit ng pandiwa sa dalawang sugnay.
- source_word: רָע
  choice: kasamaan
  rationale: Tuwirang katapat ng mabuti at pinananatili ang lawak ng Hebreo, bagaman sa konteksto ay malamang na tumutukoy sa kapahamakan o masamang sinapit, hindi sa moral na kasamaan.
- source_word: אֲיַחֲלָה
  choice: naghintay ako
  rationale: Ipinahahayag ang matiyaga at may-pag-asang paghihintay habang iniiwasan ang eksaktong pag-uulit ng unang pandiwa.
- source_word: לְאוֹר
  choice: sa liwanag
  rationale: Pinananatili ang konkretong larawan at ang posibleng metaporikal na diwa nito sa halip na ipakahulugang 'ginhawa.'
- source_word: אֹפֶל
  choice: kadiliman
  rationale: Natural na kasalungat ng liwanag at sapat na nagpapahayag ng matinding dilim o pangungulimlim.
theological_decisions:
- issue: Ang diwa ng רָע
  choice: Kasamaan sa pangunahing teksto, na may talababa tungkol sa kapahamakan o masamang sinapit
  alternative: Kapahamakan o sakuna sa pangunahing teksto
  rationale: Pinananatili nito ang matalim at malawak na pagtutol sa 'mabuti' nang hindi ipinipilit na moral na kasamaan ang tinutukoy; nililinaw ng talababa ang malamang na kontekstuwal na diwa.
translation_notes:
  register: Makabagong Filipino na marangal at madaling maunawaan. Pinanatili ang magkatimbang na kayarian, ang pag-uulit ng 'dumating,' at ang mga pagtutol na mabuti/kasamaan at liwanag/kadiliman.
