  yaml_path: translation/ot/job/030/013.yaml
  text: They tear up my path for my ruin[b][a]; they profit from it—there is no helper for them.
translation:
  language: tl
  text: Sinisira nila ang aking landas upang ipahamak ako; isinusulong nila ang kapahamakan ko[a]—walang tumutulong sa kanila.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nakikinabang sila rito” o “tinutulungan nilang maisulong ito.” Ang pandiwang Hebreo ay maaaring tumukoy sa pagiging kapaki-pakinabang o sa pagsusulong ng isang bagay—malamang, sa kontekstong ito, ang kapahamakan ni Job.
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring “wala silang katulong.” Maikli at hindi ganap na tiyak ang huling sugnay sa Hebreo: maaaring ibig sabihin ay kumikilos sila nang walang tumutulong sa kanila, o wala silang katulong.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נָתְסוּ
  choice: Sinisira
  rationale: Ang pandiwa ay tumutukoy sa paggiba o pagwasak. Likas sa Filipino ang “sinisira” para sa marahas na pagwasak sa isang landas nang hindi labis na nililimitahan ang larawan.
- source_word: נְתִיבָתִי
  choice: ang aking landas
  rationale: Tumutukoy ang נְתִיבָה sa landas o daanan. Pinananatili ng “aking landas” ang kongkretong larawan at ang posibleng metapora para sa takbo ng buhay ni Job.
- source_word: לְהַוָּתִי
  choice: upang ipahamak ako
  rationale: Ang הַוָּה ay maaaring mangahulugang kapahamakan, pagkawasak, o sakuna. Ipinahahayag ng pariralang ito ang nakapipinsalang direksiyon o layunin ng kilos sa natural na Filipino.
- source_word: יֹעִילוּ
  choice: isinusulong nila ang kapahamakan ko
  rationale: Ang Hiphil ng יעל ay maaaring mangahulugang maging kapaki-pakinabang o isulong ang isang bagay. Dahil walang hayag na layon, inuugnay ng salin ang pandiwa sa naunang “kapahamakan” habang inilalagay sa talababa ang leksikal na kalabuan.
- source_word: לֹא עֹזֵר לָמוֹ
  choice: walang tumutulong sa kanila
  rationale: Pinananatili nito ang maikli at eliptikong anyo ng Hebreo. Maaari itong mangahulugang kumikilos sila nang walang tumutulong o na wala silang katulong; kapwa posibilidad ay binabanggit sa talababa.
