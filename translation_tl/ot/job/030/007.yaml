lexical_decisions:
- source_word: בֵּין
  choice: sa gitna ng
  rationale: Sa kasunod na pangmaramihang pangngalan, likas sa modernong Tagalog ang “sa gitna ng” upang ipahayag ang kinaroroonan sa loob o pagitan ng maraming palumpong.
- source_word: שִׂיחִים
  choice: mga palumpong
  rationale: Tumutukoy ito sa mabababang halamang makahoy o scrub; malinaw at dignified ang “mga palumpong” nang hindi ipinapalagay na masukal ang mga ito.
- source_word: יִנְהָקוּ
  choice: umaatungal sila
  rationale: Ang pandiwa נהק ay karaniwang tumutukoy sa ingay ng asno. Pinananatili ng “umaatungal” ang matindi at parang-hayop na larawan, bagaman walang iisang karaniwang pandiwang Tagalog na eksaktong katumbas ng pag-iingay ng asno.
- source_word: תַּחַת
  choice: sa ilalim ng
  rationale: Tuwirang katumbas ito ng panandang pook at natural sa Tagalog.
- source_word: חָרוּל
  choice: mga halamang matinik
  rationale: Hindi tiyak ang eksaktong halamang tinutukoy. Iniiwasan ng pangkalahatang salin ang maling pagtukoy sa isang espesipikong uri habang pinananatili ang larawan ng ligaw at di-kaaya-ayang halaman.
- source_word: יְסֻפָּחוּ
  choice: nagsisiksikan sila
  rationale: Ang anyong pasibo/intensibo ay nagpapahiwatig ng pagkakatipon o pagkakadikit-dikit. Natural na inilalarawan ng “nagsisiksikan” ang kanilang pagdidikit-dikit sa silungan, habang kinikilala sa talababa ang iba pang posibleng diwa.
