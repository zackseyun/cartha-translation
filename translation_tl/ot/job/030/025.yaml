  text: Did I not weep for the one whose day was hard? Was not my soul grieved for the poor?[a]
translation:
  language: tl
  text: Hindi ba ako umiyak para sa taong dumanas ng mahirap na araw? Hindi ba nagdalamhati ang kaluluwa ko para sa dukha?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin ang unang pangungusap na “Hindi ba ako umiyak para sa taong nasa panahon ng paghihirap?” Literal na tumutukoy ang Hebreo sa “taong may mabigat na araw” o “taong may mahirap na araw.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם לֹא
  choice: Hindi ba ako
  rationale: Ginawang retorikal na tanong, gaya ng hinihingi ng konteksto ng pagtatanggol ni Job sa sarili, sa halip na payak na kondisyunal.
- source_word: בָכִיתִי
  choice: umiyak
  rationale: Natural at kasalukuyang Filipino para sa pagluha dahil sa matinding habag o dalamhati, habang pinananatili ang emosyonal na bigat.
- source_word: לִקְשֵׁה יוֹם
  choice: para sa taong dumanas ng mahirap na araw
  rationale: Pinananatili ang larawan ng Hebreo na ‘mahirap/mabigat na araw’ at nililinaw na tumutukoy ito sa taong nasa panahon ng paghihirap.
- source_word: עָגְמָה
  choice: nagdalamhati
  rationale: Ipinahahayag ang malalim na pagkalungkot o pagdurusa ng kalooban at angkop sa makatang paralelismo sa pag-iyak.
- source_word: נַפְשִׁי
  choice: ang kaluluwa ko
  rationale: Pinananatili ang makatang pananalita ng Hebreo tungkol sa panloob na sarili ni Job nang hindi ito nililimitahan sa isang teknikal na doktrina ng kaluluwa.
- source_word: לָאֶבְיוֹן
  choice: para sa dukha
  rationale: Ang ‘dukha’ ay maikli, marangal, at angkop sa taong salat o nangangailangan; pinananatili rin nito ang makatang rehistro.
theological_decisions:
- issue: Antropolohikal na diwa ng נַפְשִׁי
  choice: ang kaluluwa ko
  alternative: ako / ang kalooban ko
  rationale: Pinananatili ang makatang paglalarawan sa panloob na sarili ni Job, ngunit hindi ipinapakahulugan na ang talata ay nagtuturo ng isang teknikal na paghihiwalay ng katawan at kaluluwa.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal at makata. Ginamit ang ‘mahirap na araw’ upang mapanatili ang konkretong larawan ng Hebreo, at ang ‘dukha’ at ‘kaluluwa ko’ upang mapanatili ang maikli at makatang paralelismo.
