  source_fidelity: 'Ang pangunahing diwa ay naipapahayag nang tapat: isang hinahamak na pangkat ang lumalaban kay Job, ginagambala ang kaniyang mga paa, at gumagawa ng mapanirang mga landas laban sa kaniya. Gayunman, ang “mga landas tungo sa kapahamakan” ay binabago ang ugnayan sa Hebreong אָרְחוֹת אֵידָם: ang hulaping -ם ay “kanila,” hindi tuwirang “tungo sa.” Dapat mapanatili ang mahirap at bahagyang malabong “mga landas ng kanilang kapahamakan.”'
  naturalness: Natural at marangal ang karamihan ng Filipino. Ang “gumagawa sila laban sa akin ng mga landas ng kanilang kapahamakan” ay bahagyang pormal ngunit malinaw at angkop sa matalinghagang pananalita ng Job. Ang “itinataboy nila ang aking mga paa” ay sinadyang kakaiba, gaya ng mahirap na Hebreong idyoma, at naipapaliwanag nang sapat sa talababa.
  terminology: Ang “isang pangkat ng mga hamak” ay maingat na katumbas ng mapanghamak na kolektibong פִּרְחַח nang hindi nagpapataw ng tiyak na pagkakakilanlan. Ang “kapahamakan” ay angkop para sa אֵיד. Inayos ang talababa sa huling parirala upang panatilihin ang “kanilang” ng Hebreo.
