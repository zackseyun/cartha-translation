  text: On my right, a brood rises up[a]; they send my feet away[c][b], and they build up against me their paths of disaster.
translation:
  language: tl
  text: Sa kanan ko ay bumabangon ang isang pangkat ng mga hamak[a]; itinataboy nila ang aking mga paa[b], at gumagawa sila laban sa akin ng mga landas ng kanilang kapahamakan[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “isang magulong pangkat.” Bihira ang salitang Hebreo at tumutukoy sa isang hinahamak o magulong grupo.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “ipinapaalis nila ang aking mga paa.” Maaaring ang diwa ay inililihis nila ang kanyang mga hakbang o sinisikap siyang patisurin.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “itinambak nila laban sa akin ang mga landas ng kanilang kapahamakan.” Nananatili sa Hebreo ang mapanlabang larawan ng pagtatambak o paggawa ng daan.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל יָמִין
  choice: Sa kanan ko
  rationale: Pinananatili ang larawang panlunan at ang konteksto ng mga kaaway na pumupuwesto sa kanan ni Job.
- source_word: פִּרְחַח
  choice: isang pangkat ng mga hamak
  rationale: Bihira at kolektibo ang salitang Hebreo, at may mapanghamak na himig. Malinaw sa modernong Filipino ang salin nang hindi nagpapasok ng mas tiyak na pagkakakilanlan kaysa sa pinagmulan.
- source_word: יָקוּמוּ
  choice: bumabangon
  rationale: Ipinahihiwatig ng קום ang pagbangon o pagtindig nang may pagkapoot laban kay Job.
- source_word: רַגְלַי שִׁלֵּחוּ
  choice: itinataboy nila ang aking mga paa
  rationale: Mahirap ang parirala at literal na tumutukoy sa 'pagpapaalis' sa mga paa. Pinananatili ng salin ang kakaibang larawan habang ipinahihiwatig ang sapilitang pagpapaalis o pagkawala ng tuntungan.
- source_word: וַיָּסֹלּוּ
  choice: gumagawa
  rationale: Ang סלל ay ginagamit sa pagtatambak o paggawa ng daan. Natural sa Filipino ang 'gumagawa ... ng mga landas' at napananatili nito ang metapora ng paggawa ng daan.
- source_word: עָלַי
  choice: laban sa akin
  rationale: Ang konteksto ay malinaw na mapanlaban, kaya higit na angkop ito kaysa sa payak na panlunang 'sa ibabaw ko.'
- source_word: אָרְחוֹת אֵידָם
  choice: mga landas tungo sa kapahamakan
  rationale: Pinananatili ang larawan ng mga landas at ang matinding diwa ng אֵיד bilang kapahamakan o pagkawasak. Ang 'tungo sa' ay natural na nagpapakita ng mapaminsalang hantungan nang hindi lubusang nilulutas ang mahirap na ugnayan ng hulaping 'kanila.'
