  text: My skin turns black and falls from me[b][a], and my bones burn with heat.
translation:
  language: tl
  text: "Umiitim ang balat ko sa aking katawan[a],\n at nag-aapoy ang mga buto ko dahil sa init.[b]"
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Umiitim ang balat ko mula sa ibabaw ko.” Maaaring ilarawan ng Hebreong pananalita ang balat na nangingitim at natutuklap, o nananatiling nakalaylay at maitim sa katawan.
    reason: lexical_alternative
  - marker: b
    text: O, “nag-aapoy ang mga buto ko dahil sa lagnat.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עוֹרִי
  choice: ang balat ko
  rationale: Ang עוֹר ay karaniwang tumutukoy sa balat o hide; sa konteksto ng tao, natural at malinaw ang “balat ko.”
- source_word: שָׁחַר
  choice: nangingitim
  rationale: Ipinahihiwatig ng pandiwa rito ang pagdidilim o pag-itim. Pinananatili ng “nangingitim” ang progresibo at matinding larawan ng karamdaman.
- source_word: מֵעָלָי
  choice: at nalalaglag mula sa akin
  rationale: Literal itong “mula sa ibabaw ko.” Sa konteksto ng balat na may sakit, malamang na inilalarawan nito ang balat na nangingitim at natatanggal o nakalaylay; malinaw ang pangunahing salin ngunit inilalahad sa talababa ang literal at mas malabong pagbasa.
- source_word: וְעַצְמִי
  choice: ang aking mga buto
  rationale: Bagaman anyong isahan ang עֶצֶם, maaari itong gamiting kolektibo. Mas natural sa Filipino ang “mga buto” para sa buong katawan.
- source_word: חָרָה
  choice: nag-aapoy
  rationale: Ang חרה ay may diwang pagliyab, pag-init, o pag-alab. Napananatili ng “nag-aapoy” ang matingkad na metapora ng Hebreo.
- source_word: מִנִּי חֹרֶב
  choice: sa init
  rationale: Ang חֹרֶב ay tumutukoy sa init o pagkatuyo, at ang מִנִּי ay nagsasaad dito ng sanhi o kalagayang kaakibat. “Sa init” ang pinakaligtas at pinakamalawak na salin; posibleng “lagnat” ang tinutukoy ngunit mas interpretatibo iyon.
