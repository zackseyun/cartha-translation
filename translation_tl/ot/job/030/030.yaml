translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang matinding larawang pandama ng Hebreo, habang inilagay sa mga talababa ang tunay na kalabuan ng מֵעָלָי at ang posibleng kahulugang “lagnat” ng חֹרֶב sa kontekstong ito.
