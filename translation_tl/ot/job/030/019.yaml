  text: הֹרָ֥/נִי לַ/חֹ֑מֶר וָ֝/אֶתְמַשֵּׁ֗ל כֶּ/עָפָ֥ר וָ/אֵֽפֶר׃
base_translation:
  language: en
  yaml_path: translation/ot/job/030/019.yaml
  text: He has thrown me into the mire[b][a], and I have become like dust and ashes.
translation:
  language: tl
  text: Inihagis niya ako sa putik,[a] at ako'y naging tulad ng alabok at abo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa burak” o “sa luwad.” Ang salitang Hebreo ay maaaring tumukoy sa luwad, putik, o burak.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “at itinulad ako sa alabok at abo.”
    reason: alternative_reading
lexical_decisions:
- source_word: הֹרָנִי
  choice: Inihagis niya ako
  rationale: Ang anyong Hiphil na may hulaping unang panauhan ay nagpapahayag ng marahas na pagpapabagsak o paghahagis. Likas at malinaw sa modernong Tagalog ang “inihagis niya ako.”
- source_word: לַחֹמֶר
  choice: sa putik
  rationale: Maaaring tumukoy ang חֹמֶר sa luwad, burak, o putik. Sa konteksto ng paghamak at pagpapababa kay Job, ang “putik” ay malinaw at natural, habang pinananatili ang maruming imahen.
- source_word: וָאֶתְמַשֵּׁל
  choice: ako'y naging tulad
  rationale: Ang pandiwa ay maaaring mangahulugang “naging tulad” o “itinulad.” Pinananatili ng salin ang resultang kalagayan at ang paghahambing na ipinahihiwatig ng kasunod na כ.
- source_word: כֶּעָפָר
  choice: tulad ng alabok
  rationale: Tuwirang pinananatili ang paghahambing at ang biblikal na larawan ng karupukan, kamatayan, at pagpapakababa.
- source_word: וָאֵפֶר
  choice: at abo
  rationale: Ang “alabok at abo” ay natural na pares sa Tagalog at pinananatili ang pagkakaugnay nito sa iba pang biblikal na paggamit.
theological_decisions:
- issue: Di-tahasang simuno ng pandiwang ikatlong panauhang panlalaki na isahan
  choice: Gawing tahas bilang “niya,” na tumutukoy sa Diyos ayon sa konteksto
  alternative: Gumamit ng balintiyak na “Inihagis ako” nang hindi tinutukoy ang gumagawa
  rationale: Sa takbo ng pananalita ni Job, ang di-tahasang simuno ay ang Diyos. Ipinahihiwatig ito ng konteksto at anyong pandiwa, hindi ng isang denominasyonal na pagpapakahulugan.
- issue: Tinig at diwa ng וָאֶתְמַשֵּׁל
  choice: “ako'y naging tulad”
  alternative: “itinulad ako” o “itinuring akong tulad”
  rationale: May reflexive/passive-like na puwersa ang anyo. Pinananatili sa pangunahing teksto ang natural na resultang diwa, habang inilalahad sa talababa ang lehitimong alternatibo.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “putik” sa halip na mas pampanitikang “burak” para sa karaniwang mambabasa; pinanatili ang maikli at matinding himig ng panaghoy.
