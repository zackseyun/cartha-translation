  yaml_path: translation/ot/job/030/023.yaml
  text: For I know that you will bring me to death[b][a], and to the house appointed for every living one.
translation:
  language: tl
  text: Sapagkat alam kong ibabalik mo ako sa kamatayan[a], sa bahay na itinakda para sa lahat ng nabubuhay[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “dadalhin mo ako sa kamatayan.” Ang pandiwa ay may causative na diwang “ipababalik” o “ibabalik.”
    reason: lexical_alternative
  - marker: b
    text: Ang “bahay na itinakda para sa lahat ng nabubuhay” ay maaaring patulang tumukoy sa libingan o sa Sheol bilang hantungan ng lahat ng tao.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikita ang paliwanag o batayan ng naunang hinaing ni Job nang hindi dinaragdagan ang diin.
- source_word: יָדַעְתִּי
  choice: alam ko
  rationale: Ang Qal perfect na may stative na diwa ay likas na ipinahahayag sa modernong Tagalog bilang tiyak at kasalukuyang kaalaman.
- source_word: מָוֶת
  choice: kamatayan
  rationale: Tuwirang tumutukoy ang pangngalan sa kamatayan; hindi nito tahasang pinapangalanan ang Sheol.
- source_word: תְּשִׁיבֵנִי
  choice: ibabalik mo ako
  rationale: Pinananatili ang causative na diwa ng Hiphil ng שוב, ‘pangyaring bumalik’ o ‘ibalik,’ kahit maaaring idiomatikong unawain bilang ‘dadalhin.’
- source_word: וּבֵית מוֹעֵד
  choice: sa bahay na itinakda
  rationale: Ipinagpapatuloy ng parirala ang patutunguhan sa unang sugnay. Ang מוֹעֵד ay maaaring tumukoy sa itinakdang panahon o lugar; sa pagkakaugnay nito sa ‘bahay,’ natural ang ‘bahay na itinakda.’
- source_word: לְכָל חָי
  choice: para sa bawat nabubuhay
  rationale: Pinananatili ang literal na isahang kolektibong anyo at ang saklaw na pangkalahatan.
theological_decisions:
- issue: Larawan ng kamatayan bilang pangkalahatang hantungan
  choice: Isinalin ang kamatayan bilang hantungan ng bawat nabubuhay at inilarawan bilang ‘bahay na itinakda.’
  alternative: Tahasang tukuyin ang bahay bilang libingan o Sheol.
  rationale: Hindi pinapangalanan ng Hebreo ang Sheol. Pinananatili ng salin ang patulang larawan at ang tunay na kalabuan nang hindi nagdaragdag ng mas tiyak na doktrina tungkol sa kabilang-buhay.
- issue: Diwa ng ‘pagbabalik’ sa kamatayan
  choice: ibabalik mo ako sa kamatayan
  alternative: dadalhin mo ako sa kamatayan
  rationale: Pinananatili ng pangunahing salin ang leksikal na diwa ng causative ng שוב. Inilalagay sa talababa ang mas idiomatikong pagbasa dahil hindi kailangang ipahiwatig ng konteksto ang literal na naunang pag-iral sa kamatayan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang patulang ‘bahay’ at ang pambalarilang ikalawang panauhan para sa Diyos, nang hindi tahasang idinaragdag ang pangalang ‘Diyos.’
