  source_fidelity: 'Tapat ang salin sa Hebreo: ang matinding pagdaing kay Diyos, ang hindi pagtugon, ang pagtayo ni Job, at ang masusing pagmamasid sa kanya ay lahat naipapahayag. Ang kasalukuyang aspekto sa pangunahing teksto ay isang katanggap-tanggap na masiglang pagbasa, habang pinananatili ng talababa ang posibleng nakalipas na pagbasa.'
