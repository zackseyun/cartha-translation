  text: I cry out to you[a], but you do not answer me; I stand, and you only look at me.
translation:
  language: tl
  text: Dumadaing ako sa iyo, ngunit hindi mo ako sinasagot; nakatayo ako, at pinagmamasdan mo lamang ako.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Tumayo ako, at pinagmasdan mo akong mabuti.” Maaaring unawain ang Hebreo bilang tumutukoy sa nakalipas, at ang pandiwa ay maaari ring magpahiwatig ng masusing pagtingin o pagsasaalang-alang.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשַׁוַּע
  choice: Dumadaing ako
  rationale: Ang Piel ng שׁוע ay isang matindi at desperadong paghingi ng tulong. Likas at marangal sa Filipino ang “dumadaing” at hindi nito labis na tinutukoy ang hinihinging tugon.
- source_word: אֵלֶיךָ
  choice: sa iyo
  rationale: Ang אֶל na may hulaping ikalawang panauhang panlalaki ay natural na isinasaling “sa iyo” sa konteksto ng tuwirang pakikipag-usap sa Diyos.
- source_word: וְלֹא תַעֲנֵנִי
  choice: ngunit hindi mo ako sinasagot
  rationale: Karaniwang nangangahulugang “sumagot” o “tumugon” ang Qal ng ענה. Ipinakikita ng “ngunit” ang malinaw na pagsalungat sa pagdaing nang hindi dinaragdagan ang sinabi ng Hebreo.
- source_word: עָמַדְתִּי
  choice: nakatayo ako
  rationale: Bagaman perfect ang anyong Hebreo at maaari ring tumukoy sa nakalipas, maaaring magsaad rito ang sugnay ng kasalukuyan o nagpapatuloy na kalagayan ni Job. Ang “nakatayo ako” ay nagpapanatili ng masiglang reklamo sa kasalukuyan.
- source_word: וַתִּתְבֹּנֶן
  choice: pinagmamasdan mo lamang
  rationale: Ang התבונן ay maaaring mangahulugang tumingin nang mabuti, magmasid, o magsaalang-alang. Ang “pinagmamasdan” ay nagpapahayag ng masusing pagtingin; ang “lamang” ay naghahayag ng ipinahihiwatig na kaibahan sa hindi pagsagot, gaya ng konteksto ng panaghoy.
- source_word: בִּי
  choice: ako
  rationale: Sa Filipino, tuwirang layon ang natural na gamit kasunod ng “pinagmamasdan,” kaya hindi na kailangang isalin nang hiwalay ang pang-ukol.
theological_decisions:
- issue: Kung palalakasin ang paratang tungkol sa hindi pagtugon ng Diyos
  choice: Panatilihin ang reklamo na hindi sinasagot ang panalangin at na pinagmamasdan lamang si Job
  alternative: “Hindi mo ako inililigtas” o “hindi mo ako pinapansin”
  rationale: Tahasan sa Hebreo ang hindi pagsagot at ang pagmamasid, ngunit hindi nito tahasang sinasabing tumatangging magligtas o lubusang hindi pumapansin ang Diyos. Pinananatili ng salin ang bigat at tensiyong teolohikal nang walang dagdag na paratang.
- issue: Panahunan ng עָמַדְתִּי at וַתִּתְבֹּנֶן
  choice: Gamitin ang masiglang kasalukuyang diwa sa pangunahing teksto
  alternative: “Tumayo ako, at pinagmasdan mo akong mabuti”
  rationale: Pinahihintulutan ng daloy ng panaghoy ang kasalukuyan o nagpapatuloy na paglalarawan, ngunit tunay ding posible ang pagbasa sa nakalipas. Inilalahad ang alternatibo sa talababa upang hindi mawala ang kalabuan.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Pinili ang “dumadaing” para sa matinding panawagan at “pinagmamasdan” para sa masusing pagtingin. Iniwasan ang mas interpretibong “hindi mo ako inililigtas” at “binabalewala mo ako.”
