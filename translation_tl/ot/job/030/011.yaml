  text: Because he has loosened his cord and afflicted me[b][a], they have cast off restraint before me.
translation:
  language: tl
  text: Sapagkat kinalagan niya ang kaniyang panali at pinahirapan niya ako,[a] at isinantabi nila ang pagpipigil sa harap ko.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Sapagkat kinalagan niya ang kaniyang bagting ng pana at pinahirapan niya ako.” Maaaring mas tiyak na tumukoy sa bagting ng pana ang salitang Hebreo kaysa sa pangkalahatang panali.'
    reason: lexical_alternative
  - marker: b
    text: 'Literal na: “Pinakawalan nila ang renda sa harap ko,” ibig sabihin, isinantabi nila ang anumang pagpipigil sa aking harapan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinahahayag nito ang dahilan ng pangungutya at paglusob na inilalarawan sa konteksto.
- source_word: יִתְרוֹ
  choice: ang kaniyang panali
  rationale: Maaaring tumukoy ang salitang Hebreo sa panali o, nang mas tiyak, sa bagting ng pana. Pinananatili ng “panali” ang talinghaga nang hindi labis na tinutukoy ang uri nito.
- source_word: פִּתַּח
  choice: kinalagan
  rationale: Kapag panali ang layon, likas nitong ipinahahayag ang pagluwag o pagkakalag, hindi lamang ang pagbubukas.
- source_word: וַיְעַנֵּנִי
  choice: at pinahirapan niya ako
  rationale: Mula ito sa ענה na nangangahulugang pahirapan o ibaba, hindi sa kaparehong anyong nangangahulugang sumagot. Ang “pinahirapan” ay angkop sa pagdurusa ni Job.
- source_word: וְרֶסֶן
  choice: ang pagpipigil
  rationale: Literal itong renda o preno, ngunit sa parirala ay larawan ito ng pagpipigil na inaalis. Ang salin ay naghahatid ng idyomatikong diwa, samantalang nasa talababa ang literal na larawan.
- source_word: מִפָּנַי
  choice: sa harap ko
  rationale: Tumutukoy ito sa hayagang pagkilos sa presensiya ni Job.
- source_word: שִׁלֵּחוּ
  choice: itinakwil nila
  rationale: Kasama ng larawan ng renda, nangangahulugan itong pakawalan o alisin ang pagpipigil. Ang “itinakwil” ay nagpapahayag ng sinasadyang pag-aalis ng anumang pagpipigil.
theological_decisions:
- issue: Ang tinutukoy ng panghalip na isahang “niya”
  choice: Pinanatili ang panghalip na “niya” nang hindi tahasang pinangalanan ang Diyos.
  alternative: “Kinalagan ng Diyos...”
  rationale: Bagaman malamang na Diyos ang tinutukoy sa konteksto, hindi siya tahasang pinangalanan sa tekstong Hebreo; pinananatili ng salin ang anyo at bahagyang kalabuan ng pinagmulan.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “kinalagan” upang natural na ilarawan ang pagluwag sa panali, at “itinakwil ang pagpipigil” upang maipahayag ang idyoma habang pinananatili sa talababa ang larawan ng renda.
