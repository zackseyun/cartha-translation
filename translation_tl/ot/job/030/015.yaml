  text: Terrors are turned upon me[a]; they pursue my nobility like the wind[b], and my salvation passes away like a cloud.
translation:
  language: tl
  text: Ang mga sindak ay ibinaling laban sa akin; tinutugis nila ang aking dangal[a] na gaya ng hangin, at lumilipas na parang ulap ang aking kaligtasan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “aking karangalan,” “aking marangal na katayuan,” o “aking kasaganaan.” Ang salitang Hebreo ay maaaring tumukoy sa isang mataas o marangal na kalagayan.
    reason: lexical_alternative
  - marker: b
    text: O “aking pagliligtas” o “aking mabuting kalagayan.” Maaaring tumukoy ang salitang Hebreo sa pagsagip o kaginhawahan, hindi lamang sa kaligtasan sa doktrinal na diwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָהְפַּךְ
  choice: ibinaling laban sa akin
  rationale: Ipinananatili ang pasibo/resultatibong diwa ng Hophal ng הפך at ang larawan ng mga sindak na itinutuon laban kay Job.
- source_word: בַּלָּהוֹת
  choice: mga sindak
  rationale: Natural at matindi ang “mga sindak” para sa biglaang mga kakilabutan o nakatatakot na bagay.
- source_word: תִּרְדֹּף
  choice: tinutugis ng mga ito
  rationale: Ang רדף ay “tumulis/tumugis” o “humabol.” Ang “ng mga ito” ay tumutukoy sa mga sindak bilang kolektibong gumagawa ng kilos.
- source_word: כָּרוּחַ
  choice: gaya ng hangin
  rationale: Pinananatili ang simili ng mabilis at di-mapigil na paghabol o paglalaho, na kaagapay ng larawan ng ulap sa kasunod na linya.
- source_word: נְדִבָתִי
  choice: aking dangal
  rationale: Sa konteksto ng pagkawala ng marangal na katayuan ni Job, malinaw at likas sa modernong Filipino ang “dangal,” habang inilalahad sa talababa ang iba pang posibleng kahulugan.
- source_word: וּכְעָב
  choice: parang ulap
  rationale: Direkta at natural na katumbas ng paghahambing sa isang ulap.
- source_word: עָבְרָה
  choice: lumilipas
  rationale: Ipinahahayag ang pagdaan at pagkawala habang pinananatili ang masiglang kasalukuyang aspekto ng tula.
- source_word: יְשֻׁעָתִי
  choice: aking kaligtasan
  rationale: Pinananatili ang karaniwang leksikal na kahulugan ng ישועה, ngunit nililinaw sa talababa na maaari rin itong tumukoy sa pagliligtas o mabuting kalagayan.
theological_decisions:
- issue: Maaaring labis na bigyang-kahulugang doktrinal ang יְשֻׁעָתִי
  choice: aking kaligtasan
  alternative: aking pagliligtas; aking mabuting kalagayan
  rationale: Maaaring tumukoy ang salita sa personal na pagsagip o kaginhawahan, hindi kinakailangang sa mas huling doktrinal na diwa ng kaligtasan. Pinananatili ng pangunahing teksto ang leksikal na ugnayan at inilalahad ng talababa ang lawak ng kahulugan.
- issue: Malabong eksaktong saklaw ng נְדִבָתִי
  choice: aking dangal
  alternative: aking karangalan; aking marangal na katayuan; aking kasaganaan
  rationale: Hindi tiyak kung pangunahing tinutukoy ang dangal, mataas na katayuan, o maunlad na kalagayan. Ang “dangal” ay maikli at akma sa konteksto, habang pinananatili sa talababa ang tunay na leksikal na kalabuan.
translation_notes:
  register: Makabago ngunit marangal na Filipino; pinananatili ang maigsi at matinding paralelismo ng tulang Hebreo. Ang mga kuwit sa “gaya ng hangin” ay tumutulong upang iugnay ang simili sa paraan ng pagtugis nang hindi nilulutas nang labis ang sintaktikong kalabuan.
