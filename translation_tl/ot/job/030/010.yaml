  text: They abhor me; they keep far from me[a], and they do not hold back spitting before my face.
translation:
  language: tl
  text: Kinasusuklaman nila ako at lumalayo sila sa akin; hindi nila pinipigil ang pagdura sa harap ko.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “hindi nila ipinagkakait ang dura mula sa harap ng aking mukha.” Ang Hebreong pahayag ay maaaring tumukoy sa pagdura sa harap ni Job o mismo sa kaniyang mukha bilang hayagang paghamak.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּעֲבוּנִי
  choice: Kinasusuklaman nila ako
  rationale: Ang pandiwang תעב ay nagpapahayag ng matinding pagkasuklam o pandidiri; pinananatili ng “kinasusuklaman” ang tindi nito sa natural at marangal na Filipino.
- source_word: רָחֲקוּ מֶנִּי
  choice: lumalayo sila sa akin
  rationale: Ang רחק ay tumutukoy sa pagiging o paglayo; malinaw na naihahatid ng parirala ang pisikal at panlipunang pag-iwas kay Job.
- source_word: וּמִפָּנַי
  choice: sa harap ko
  rationale: Ang מִפָּנַי ay literal na “mula/sa harap ng aking mukha/presensiya.” Pinananatili ng “sa harap ko” ang lokasyonal na larawan nang hindi higit na nililinaw kung tuwirang sa mukha ni Job tumama ang dura.
- source_word: לֹא חָשְׂכוּ
  choice: hindi sila nag-aatubiling
  rationale: Ang חשׂך ay nangangahulugang magpigil o magbawas. Sa kontekstong ito, natural na ipinahahayag ng “hindi nag-aatubili” ang kawalan nila ng pagpipigil sa hayagang pang-iinsulto.
- source_word: רֹק
  choice: dumura
  rationale: Bagaman pangngalan ang רֹק (“dura/laway”), ang pandiwang “dumura” ang likas na anyo sa Filipino at malinaw na naghahatid sa mapanghamak na kilos.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kinasusuklaman” upang mapanatili ang matinding damdamin ng Hebreo, at “sa harap ko” upang hindi lubusang lutasin ang posibleng saklaw ng מִפָּנַי. Inilagay ang talababa pagkatapos ng sugnay na tungkol sa pagdura, kung saan ito tuwirang nauugnay.
