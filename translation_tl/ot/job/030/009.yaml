  yaml_path: translation/ot/job/030/009.yaml
  text: And now I have become their song[b][a], and I am a byword to them.
translation:
  language: tl
  text: Ngunit ngayon, naging awit nila ako[a], at naging bukambibig nila ako.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mapanuyang awit nila.” Malamang na mapanlibak ang diwa ng “awit” sa kontekstong ito.
    reason: lexical_alternative
  - marker: b
    text: O “naging kasabihan nila ako” o “naging paksa ng kanilang usapan.” Ang salitang Hebreo ay maaaring tumukoy sa isang salita o kasabihang ginagamit tungkol sa isang tao—dito, bilang paghamak.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Ngunit ngayon
  rationale: Ipinahihiwatig ng parirala ang paglipat sa kasalukuyang kalagayan ni Job na salungat sa dati niyang katayuan. Likas sa Filipino ang “Ngunit ngayon” para maipakita ang kontrast na taglay ng konteksto.
- source_word: נְגִינָתָם
  choice: awit nila
  rationale: Ang נְגִינָה ay awit o tugtugin. Sa konteksto, si Job ang paksa ng awit na mapanlibak, ngunit pinanatili sa pangunahing teksto ang payak at tuwirang “awit nila,” habang nililinaw sa talababa ang maaaring mapanuyang diwa.
- source_word: הָיִיתִי
  choice: naging … ako
  rationale: Ipinakikita ng anyong perpekto ng היה ang pagbabagong humantong sa kasalukuyang kahihiyan ni Job. Ang “naging” ay natural at malinaw sa Filipino.
- source_word: וָאֱהִי לָהֶם לְמִלָּה
  choice: at naging bukambibig nila ako
  rationale: Ang מִלָּה ay literal na “salita” ngunit dito ay tumutukoy sa isang salitang o kasabihang inuugnay sa isang tao. Ang idyomang “bukambibig” ay likas sa modernong Filipino at ipinapakitang palagi siyang pinag-uusapan, samantalang ang mapanghamak na himig ay nagmumula sa konteksto.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “bukambibig” bilang natural na idyoma, ngunit pinanatili sa talababa ang mas literal na mga alternatibo at ang mapanghamak na diwa ng konteksto.
