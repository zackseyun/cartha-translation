  text: בְּֽנֵי נָ֭בָל גַּם בְּנֵ֣י בְלִי שֵׁ֑ם נִ֝כְּא֗וּ מִן הָ/אָֽרֶץ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/030/008.yaml
  text: Sons of fools[a], indeed sons without a name[c][b], they were scourged from the land.
translation:
  language: tl
  text: Mga anak ng mga hangal, oo, mga anak na walang pangalan[a], itinaboy sila mula sa lupain.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “mga anak na walang pangalan” ay idyomang Hebreo para sa mga taong walang katayuan o dangal.
    reason: cultural_note
  - marker: b
    text: O “hinagupit palabas ng lupain.” Bihira ang pandiwang Hebreo at maaaring tumukoy sa marahas na paghampas o pagpapaalis; mas pinapaboran ng konteksto ang diwang itinaboy.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי נָבָל
  choice: Mga anak ng mga hangal
  rationale: Pinananatili ang idyomang Hebreo na “mga anak ng” at ang moral at panlipunang bigat ng נָבָל, na hindi lamang tumutukoy sa kakulangan ng talino.
- source_word: גַּם
  choice: oo
  rationale: Dito ay nagbibigay-diin at nagdaragdag ang גַּם sa ikalawang paglalarawan; natural itong naipahahayag sa Tagalog sa pamamagitan ng “oo.”
- source_word: בְּנֵי בְלִי שֵׁם
  choice: mga anak na walang pangalan
  rationale: Pinananatili ang hayag na anyo ng idyomang Hebreo habang ipinauunawa sa talababa na tumutukoy ito sa mga taong walang katayuan o dangal.
- source_word: נִכְּאוּ
  choice: itinaboy
  rationale: Bihira at hindi tiyak ang pandiwa; maaari itong magpahiwatig ng paghampas o marahas na pagpapaalis. Dahil sinusundan ito ng “mula sa lupain,” pinili ang kontekstuwal na diwang pagpapaalis nang hindi ikinukubli ang alternatibo.
- source_word: מִן הָאָרֶץ
  choice: mula sa lupain
  rationale: Sa panlipunang konteksto, ang אֶרֶץ ay mas malamang na tumukoy sa lupain o pinaninirahang lugar kaysa sa buong daigdig.
