  verdict: approve
  source_fidelity: Tapat ang salin sa magkapares na mapanghamak na paglalarawan sa Hebreo at sa malabong pandiwang נִכְּאוּ. Ang “itinaboy sila mula sa lupain” ay isang makatuwirang kontekstuwal na pagbasa, habang maayos na inilalahad ng talababa ang marahas na alternatibong diwa nang hindi nagkukunwaring tiyak ang bihirang pandiwa.
  naturalness: Natural at marangal ang daloy sa makabagong Filipino. Ang resumptive na “sila” ay katanggap-tanggap at malinaw pagkatapos ng dalawang pariralang paksa. Ang “oo” ay maikling paraan upang ihatid ang pagbibigay-diin ng גַּם.
  terminology: Ang “mga anak ng mga hangal” at “mga anak na walang pangalan” ay angkop na nagpapanatili ng idyomatikong porma at ng matinding panlipunang paghamak ng teksto. Sapat at tumpak ang talababa sa “walang pangalan,” at ang “lupain” ay angkop para sa אֶרֶץ sa kontekstong ito.
