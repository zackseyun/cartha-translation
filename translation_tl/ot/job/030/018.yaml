  text: By great force my garment is disfigured[b][a]; like the collar of my tunic it binds me.
translation:
  language: tl
  text: Sa matinding lakas, nagbabago ang anyo ng aking damit[a]; gaya ng bukasan ng aking tunika, binibigkisan ako nito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nagbabago ang aking damit,” “nasira ang anyo ng aking damit,” o marahil “dinadakma niya ang aking damit.” Mahirap unawain ang pandiwang Hebreo. Karaniwang ipinapakahulugan ang taludtod na inilalarawan ang paghihirap ni Job na bumabaluktot o bumibigkis sa kaniya na parang kasuutan.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּרָב כֹּחַ
  choice: Sa matinding puwersa
  rationale: Instrumental o pang-abay ang parirala at nagpapahayag ng matinding lakas na sanhi o paraan ng kilos.
- source_word: יִתְחַפֵּשׂ
  choice: nag-iba ang anyo
  rationale: Mahirap at pinagtatalunan ang pandiwa rito. Pinananatili ng saling ito ang pangunahing diwa ng pagbabago o pagkasira ng anyo nang hindi ito ipinapakahulugang tiyak na simpleng pagbabago lamang o pagdakma.
- source_word: לְבוּשִׁי
  choice: aking damit
  rationale: Pangkalahatang katawagan ito sa kasuutan; pinananatili ang isahan at ang paralelismo sa tunika.
- source_word: כְּפִי
  choice: gaya ng bukasan ng
  rationale: Literal itong tumutukoy sa bibig o bukasan. Sa konteksto ng kasuutan, ang bukasan sa leeg ang larawan, ngunit mas maingat ang “bukasan” kaysa sa mas tiyak na “kuwelyo.”
- source_word: כֻתָּנְתִּי
  choice: aking tunika
  rationale: Tumutukoy ito sa kasuotang tunika; malinaw at kinikilalang katawagan sa modernong Filipino.
- source_word: יַאַזְרֵנִי
  choice: mahigpit akong binibigkisan nito
  rationale: Ang ugat ay nangangahulugang magbigkis o pumalibot. Ipinahihiwatig ng konteksto ang mahigpit na pagsakal o pagpisil ng kasuutan.
