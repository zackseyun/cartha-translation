translation:
  language: tl
  text: At ngayon, bumubuhos sa loob ko ang aking kaluluwa[a]; dinadakma ako ng mga araw ng pagdurusa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “bumubuhos sa akin ang aking kaluluwa.” Literal na “sa ibabaw ko/sa akin” ang Hebreong pang-ukol, ngunit malamang na inilalarawan ng pahayag ang panloob na panghihina.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: At ngayon
  rationale: Pinananatili ang temporal na pang-ugnay at ang paglipat sa kasalukuyang kalagayan ni Job nang hindi tahasang ginagawang pasalungat na “Ngunit ngayon.”
- source_word: עָלַי
  choice: sa loob ko
  rationale: Literal itong “sa ibabaw/sa akin,” ngunit sa idyomang kasama ng נפשי at “ibinubuhos,” natural na ipinahahayag ng “sa loob ko” ang panloob na panghihina. Inilalagay sa talababa ang mas literal na anyo upang mapanatili ang tunay na alternatibo.
- source_word: תִּשְׁתַּפֵּךְ
  choice: ibinubuhos
  rationale: Pinananatili ang metapora ng pagbubuhos at pagkaubos na nasa pandiwang שפך; ang anyong pasibo ay natural sa Filipino at tumutugma sa patuloy na kalagayang inilalarawan.
- source_word: נַפְשִׁי
  choice: ang kaluluwa ko
  rationale: Pinananatili ang makatang lalim ng נפש bilang panloob na sarili o buhay, nang hindi ito nililimitahan sa pisikal na buhay lamang.
- source_word: יֹאחֲזוּנִי
  choice: sinasakmal ako
  rationale: Matingkad na inilalarawan ang mahigpit na pagdakma ng אחז at ang personipikasyon ng mga araw ng pagdurusa.
- source_word: יְמֵי עֹנִי
  choice: mga araw ng pagdurusa
  rationale: Ang construct phrase ay natural na isinasalin sa ganitong anyo; ang “pagdurusa” ay sumasaklaw sa paghihirap at kaapihan sa konteksto at hindi ito pinakikitid sa kahirapang materyal.
