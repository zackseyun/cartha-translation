  text: Both the gray-haired and the aged are among us[a], older in days than your father.
translation:
  language: tl
  text: Kasama namin kapwa ang mga ubanin at ang mga lubhang matatanda, na mas matatanda kaysa sa iyong ama.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “higit na dakila o makapangyarihan kaysa sa iyong ama sa mga araw”; sa kontekstong ito, ang diwa ay “mas matanda kaysa sa iyong ama.”
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם ... גַּם
  choice: kapwa ... at
  rationale: Ipinahahayag ng inuulit na גַּם ang magkatambal na pagbibigay-diin; natural itong naihahatid sa Filipino ng “kapwa ... at.”
- source_word: שָׂב
  choice: mga ubanin
  rationale: Pinananatili nito ang kongkretong larawan ng uban bilang tanda ng katandaan, sa halip na gawing pangkalahatang “matanda” lamang.
- source_word: יָשִׁישׁ
  choice: matatanda
  rationale: Tumutukoy ito sa mga taong lubhang may edad at pinananatili ang bahagyang pagkakaiba nito sa “mga ubanin” sa magkatulad na parirala.
- source_word: בָּנוּ
  choice: kasama namin
  rationale: 'Ang בְּ na may hulaping unang panauhang maramihan ay panlipunan o lokatibo rito: ang mga nakatatanda ay kabilang sa pangkat o tradisyong kinakatawan ni Elifaz.'
- source_word: כַּבִּיר
  choice: higit pang matanda
  rationale: Bagaman karaniwang nangangahulugang “dakila” o “makapangyarihan,” ang paghahambing na may מִן at ang kasunod na “mga araw” ay tumutukoy rito sa higit na katandaan.
- source_word: מֵאָבִיךָ יָמִים
  choice: kaysa sa iyong ama
  rationale: Ang literal na “higit/dakila sa iyong ama sa mga araw” ay isang paghahambing ng edad; natural na isinasaad sa Filipino bilang “higit pang matanda kaysa sa iyong ama.”
theological_decisions: []
translation_notes:
  register: Makabagong, marangal, at madaling maunawaang Filipino. Ginamit ang “mga ubanin” upang mapanatili ang imahen ng שָׂב at “matatanda” para sa יָשִׁישׁ. Inilagay ang pananda ng talababa sa hulihan ng kaugnay na paghahambing.
