- from: Kasama namin kapwa ang mga ubanin at ang matatandang higit pang matanda kaysa sa iyong ama.[a]
  to: Kasama namin kapwa ang mga ubanin at ang mga lubhang matatanda, na mas matatanda kaysa sa iyong ama.[a]
