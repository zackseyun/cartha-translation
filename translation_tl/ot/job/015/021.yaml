translation:
  language: tl
  text: May tunog ng mga kakilabutan sa kanyang mga tainga; sa kasaganaan[a], dumarating sa kanya ang mananalanta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa kapayapaan” o “sa katiwasayan”; ang Hebreong שָׁלוֹם ay maaaring tumukoy sa kapayapaan, mabuting kalagayan, kaligtasan, o kasaganaan.
    reason: lexical_alternative
lexical_decisions:
- source_word: קוֹל
  choice: tunog
  rationale: Karaniwang nangangahulugang ‘tunog’ o ‘tinig’ ang קוֹל. Dahil kaugnay ito rito ng פְּחָדִים at hindi ng binigkas na pananalita, mas angkop ang ‘tunog.’
- source_word: פְּחָדִים
  choice: mga kakilabutan
  rationale: Pinananatili ng maramihang ‘mga kakilabutan’ ang matindi at maramihang larawan ng mga bagay o babalang nakapangingilabot, sa halip na gawing panloob na damdamin lamang ang salita.
- source_word: בְּאָזְנָיו
  choice: nasa kanyang pandinig
  rationale: Literal itong ‘nasa kanyang mga tainga.’ Ang ‘nasa kanyang pandinig’ ay natural sa modernong Filipino at hindi nagdaragdag ng ideyang gaya ng ‘umualingawngaw’ na wala sa Hebreo.
- source_word: בַּשָּׁלוֹם
  choice: sa gitna ng kasaganaan
  rationale: Maaaring tumukoy ang שָׁלוֹם sa kapayapaan, kaligtasan, kaginhawahan, o maunlad na kalagayan. Pinili ang ‘kasaganaan’ bilang malinaw na paglalarawan ng mabuting kalagayang biglang ginagambala, habang inilalahad sa talababa ang ibang tunay na posibilidad.
- source_word: שׁוֹדֵד
  choice: ang mananalanta
  rationale: Ang participle ay tumutukoy sa taong naninira, nananalanta, o nandarambong. Malinaw at likas sa Filipino ang ‘mananalanta’ at hindi nito nililimitahan ang kahulugan sa pagnanakaw lamang.
- source_word: יְבוֹאֶנּוּ
  choice: dumarating sa kanya
  rationale: Ang pandiwa na may panlalaking isahang layon ay literal na nagsasaad na ang mananalanta ay ‘dumarating sa kanya.’ Pinananatili ng kasalukuyang anyo ang masidhing pangkalahatang paglalarawan ng tulang Hebreo nang hindi pinipilit ang eksaktong panahong hinaharap.
