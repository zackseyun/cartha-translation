  yaml_path: translation/ot/job/015/032.yaml
  text: It will be paid in full before his time[b][a], and his branch will not stay green.
translation:
  language: tl
  text: Bago sumapit ang kanyang panahon, malulubos[a] ang kanyang kabayaran, at hindi mananatiling luntian ang kanyang sanga[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “ito ay mapupuno” o “malulubos.” Hindi tahasang pinangalanan sa Hebreo ang simuno; maaaring tumukoy ito sa kanyang kabayaran o ganti sa naunang talata. Pinagtatalunan ang eksaktong diwa ng pandiwang Hebreo rito.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “kanyang palapa” o “kanyang usbong sa tuktok.” Ang salitang Hebreo ay tumutukoy sa bahaging tulad ng sanga ng isang puno o halaman.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּלֹא יוֹמוֹ
  choice: bago dumating ang kanyang panahon
  rationale: Ang literal na diwa ay “hindi sa kanyang araw.” Ipinahahayag ng likas na pariralang Filipino ang napaagang pagsapit ng kapahamakan nang hindi nililimitahan ang יוֹם sa isang literal na araw.
- source_word: תִּמָּלֵא
  choice: lubos siyang gagantihan
  rationale: Ang Niphal ng מלא ay literal na “mapupuno” o “malulubos.” Sa ugnay nito sa naunang תמורתו (“kanyang ganti/kabayaran,” tal. 31), ipinahihiwatig na sasapit nang lubos ang nararapat sa kanya. Iniiwasan ng “gagantihan” ang di-kinakailangang larawang pinansiyal ng “babayaran,” habang pinananatili ng talababa ang tunay na kalabuan ng pandiwa.
- source_word: כִפָּתוֹ
  choice: kanyang sanga
  rationale: Tumutukoy ang salita sa bahaging tulad ng sanga, palapa, o usbong sa tuktok. Ang pangkalahatang “sanga” ay malinaw at nagpapanatili sa larawang halaman nang hindi nagpapalagay na tiyak na palma ito.
- source_word: לֹא רַעֲנָנָה
  choice: hindi mananatiling luntian
  rationale: Ang רענן ay nagpapahiwatig ng pagiging sariwa, luntian, o mayabong ng halaman. Pinananatili ng “luntian” ang kongkretong larawang botanikal, at likas sa Filipino ang “mananatiling” sa pahayag tungkol sa napaagang pagkalanta.
theological_decisions:
- issue: Ang ipinahihiwatig na simuno at diwa ng תִּמָּלֵא
  choice: Isinalin bilang “lubos siyang gagantihan,” ayon sa konteksto ng ganti sa talata 31.
  alternative: “Malulubos ito” o “mapupuno ito.”
  rationale: Hindi tahasang inuulit ng Hebreo ang simuno, at maaaring iugnay ang pambabaeng anyo ng pandiwa sa “kanyang ganti/kabayaran” sa naunang talata. Ipinakikita ng talababa ang literal na anyo at ang posibleng ibang pagbasa upang hindi ituring na tiyak ang kontekstuwal na pagpapakahulugan.
translation_notes:
  register: Makabago at marangal na Filipino, na may malinaw na larawang halaman. Ginamit ang “panahon” sa halip na literal na “araw” upang likas na maipahayag ang napaagang kapahamakan; pinanatili sa mga talababa ang leksikal at sintaktikong kalabuan.
