  source_fidelity: Tapat ang pangunahing salin sa Hebreo. Ang “Nanirahan siya” ay wastong salin ng וַיִּשְׁכּוֹן; ang “mga wasak na lungsod” ay maayos para sa עָרִים נִכְחָדוֹת; at natural na naipahahayag ng “mga bahay na walang naninirahan” ang siksik at hindi ganap na tiyak na בָּתִּים לֹא יֵשְׁבוּ לָמוֹ. Ang “na nakatalagang maging mga bunton ng guho” ay angkop para sa אֲשֶׁר הִתְעַתְּדוּ לְגַלִּים at hindi nagpapataw ng tiyak na tagapagtalaga.
