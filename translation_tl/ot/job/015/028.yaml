  terminology: Ang “wasak,” “naninirahan,” “nakatalagang,” at “bunton ng guho” ay magkakatugma sa rehistro ng Job at tumpak sa mga pangunahing salitang Hebreo. Wasto ring pinananatili ng talababa ang alternatibong pagbasa ng gitnang sugnay.
