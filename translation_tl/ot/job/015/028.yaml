  text: וַ/יִּשְׁכּ֤וֹן עָ֘רִ֤ים נִכְחָד֗וֹת בָּ֭תִּים לֹא יֵ֣שְׁבוּ לָ֑/מוֹ אֲשֶׁ֖ר הִתְעַתְּד֣וּ לְ/גַלִּֽים׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/015/028.yaml
  text: He has lived in ruined cities[a], in houses where no one dwells, which were destined to become heaps.
translation:
  language: tl
  text: 'Nanirahan siya sa mga wasak na lungsod[a],

    sa mga bahay na walang naninirahan,

    na nakatalagang maging mga bunton ng guho.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Tumira siya sa mga winasak na lungsod, sa mga bahay na hindi nila tinitirhan, na inihanda upang maging mga bunton.” Siksik ang Hebreo sa talatang ito at maaari itong isalin sa ilang magkakalapit na paraan, lalo na ang gitnang sugnay.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁכּוֹן
  choice: Nanirahan siya
  rationale: Ang pandiwang שכן ay nangangahulugang “manirahan” o “tumahan.” Ang “nanirahan” ay natural sa modernong Filipino at nananatiling malapit sa anyong pasalaysay ng Hebreo.
- source_word: עָרִים נִכְחָדוֹת
  choice: mga wasak na lungsod
  rationale: Ang נִכְחָדוֹת ay naglalarawan ng mga lugar na winasak o pinawi. Ipinahahayag ng “wasak na lungsod” ang kalagayan ng pagkaguho at umaayon sa kasunod na larawan ng mga bahay na iniwan at mga bunton ng guho.
- source_word: בָּתִּים לֹא יֵשְׁבוּ לָמוֹ
  choice: mga bahay na walang naninirahan
  rationale: Siksik at mahirap ang pariralang Hebreo, lalo na ang hulaping לָמוֹ. Ang salin ay likas na naglalarawan sa mga bahay bilang walang nakatira, nang hindi ipinipilit sa pangunahing teksto ang hindi tiyak na tinutukoy ng panghalip.
- source_word: אֲשֶׁר הִתְעַתְּדוּ
  choice: na nakatalagang
  rationale: Ang Hitpael ng עתד ay maaaring mangahulugang “inihanda,” “itinalaga,” o “itinadhana.” Ang “nakatalagang” ay nagpapanatili sa ideya na ang mga ito ay nakalaan sa isang tiyak na kahihinatnan nang hindi tahasang tinutukoy kung sino ang nagtakda nito.
- source_word: לְגַלִּים
  choice: maging mga bunton ng guho
  rationale: Ang גַּלִּים ay tumutukoy sa mga bunton, lalo na ng mga bato o labi ng mga guho. Nililinaw ng parirala ang resultang ipinahihiwatig ng לְ habang nananatiling buhay at madaling maunawaan ang larawan.
theological_decisions: []
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang tatlong magkakaugnay na larawan—mga wasak na lungsod, mga bahay na walang nakatira, at mga bunton ng guho—habang inilalagay sa talababa ang tunay na kalabuan ng gitnang sugnay.
