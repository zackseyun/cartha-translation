  text: מָֽה אֱנ֥וֹשׁ כִּֽי יִזְכֶּ֑ה וְ/כִֽי יִ֝צְדַּ֗ק יְל֣וּד אִשָּֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/015/014.yaml
  text: What is man[a], that he should be pure, or one born of a woman[c][b], that he should be righteous?
translation:
  language: tl
  text: Ano ang tao[a] upang siya'y maging dalisay[b], o ang ipinanganak ng babae upang siya'y maging matuwid[c]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “tao” rito ay tumutukoy sa sangkatauhan sa pangkalahatan, lalo na sa pagiging marupok at mortal nito.
    reason: lexical_alternative
  - marker: b
    text: O “malinis.” Maaaring tumukoy ang salitang Hebreo sa kalinisan o kadalisayan sa moral na diwa.
    reason: lexical_alternative
  - marker: c
    text: O “nasa tama” o “mapatunayang matuwid.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מָה אֱנוֹשׁ
  choice: Ano ang tao
  rationale: Pinananatili ang retorikal na tanong at ang pangkalahatang pagtukoy ng אֱנוֹשׁ sa marupok at mortal na sangkatauhan.
- source_word: כִּי יִזְכֶּה
  choice: upang siya'y maging dalisay
  rationale: Ang זכה sa Qal ay tumutukoy sa pagiging malinis o dalisay, kabilang ang moral na diwa; natural na naihahayag ng “maging dalisay” ang kahulugan sa kontekstong ito.
- source_word: וְכִי
  choice: o
  rationale: Bagaman karaniwang “at” ang וְ, ipinakikilala rito ang ikalawang katumbas na tanong sa paralelismong patula; mas natural sa Filipino ang “o.”
- source_word: יִצְדַּק
  choice: siya'y maging matuwid
  rationale: Pinananatili ang malawak na kahulugan ng צדק bilang pagiging matuwid o nasa tama, nang hindi ito nililimitahan sa teknikal na wikang forensic.
- source_word: יְלוּד אִשָּׁה
  choice: ang ipinanganak ng babae
  rationale: Tuwirang pinananatili ang Hebreong idyoma para sa isang taong mortal at mahina, habang natural pa rin sa makabagong Filipino.
theological_decisions:
- issue: Saklaw ng אֱנוֹשׁ at יְלוּד אִשָּׁה
  choice: Ang pang-isahang “tao” at “ipinanganak ng babae” ay kumakatawan sa sangkatauhan sa pangkalahatan.
  alternative: “Sinumang tao” o “isang nilalang na tao” bilang hayagang panlahatang pananalita.
  rationale: Pang-isahan ang anyong Hebreo ngunit pangkalahatan ang saklaw. Pinananatili ng salin ang kinatawang pang-isahan at ang paralelismong patula.
- issue: Moral o forensic na diwa ng יִצְדַּק
  choice: “maging matuwid”
  alternative: “mapatunayang matuwid” o “malagay sa tama”
  rationale: Hindi nilulutas ng konteksto ang salita bilang isang teknikal na doktrina ng pagpapawalang-sala. Ang “maging matuwid” ay nagpapanatili sa mas malawak na moral at evaluative na diwa.
translation_notes:
  register: Makabago, dignificado, at madaling maunawaang Filipino. Ginamit ang pinaikling “siya’y” upang mapanatili ang maikli at patulang ritmo; pinanatili rin ang dalawang magkatumbas na retorikal na tanong.
