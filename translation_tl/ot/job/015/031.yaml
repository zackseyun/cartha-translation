  yaml_path: translation/ot/job/015/031.yaml
  text: Let him not trust in emptiness[a], deceiving himself[c][b], for emptiness will be his recompense.
translation:
  language: tl
  text: Huwag siyang magtiwala sa walang kabuluhan habang siya’y naliligaw,[a] sapagkat walang kabuluhan ang magiging kapalit niya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “habang siya’y naililigaw” o “habang siya’y nadadaya.” Ang Hebreong נִתְעָה ay maaaring mangahulugang naliligaw, naililigaw, o nadadaya; hindi nito tahasang sinasabing kusang dinadaya ng tao ang sarili.
    reason: lexical_alternative
  - marker: b
    text: Ang “walang kabuluhan” ay salin ng שָׁוְא, na maaari ring mangahulugang “kawalang-saysay,” “kasinungalingan,” o “walang halaga.” Inuulit sa Hebreo ang parehong salita sa dalawang bahagi ng talata.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל יַאֲמֵן
  choice: Huwag siyang magtiwala
  rationale: Ang אַל na sinusundan ng imperfect ay naghahayag ng babala o pagbabawal, at ang Hiphil ng אמן ay tumutukoy sa paglalagak ng tiwala.
- source_word: בַשָּׁוְא / שָׁוְא
  choice: sa walang kabuluhan / walang kabuluhan
  rationale: Saklaw ng שָׁוְא ang kawalan ng saysay, kabuluhan, o katotohanan. Pinananatili ang pag-uulit ng salitang Hebreo upang maingatan ang puwersang patula.
- source_word: נִתְעָה
  choice: na inililigaw ang sarili
  rationale: Ang Niphal ng תעה ay maaaring mangahulugang naliligaw, naililigaw, o nadadaya. Ipinahihiwatig ng parirala rito ang pagkakaligaw ng taong nagtitiwala sa walang kabuluhan, ngunit hindi lubusang inaalis ang ambiguwidad ng anyong Hebreo.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala nito ang dahilan ng naunang babala.
- source_word: תִּהְיֶה תְמוּרָתוֹ
  choice: ang matatanggap niyang kapalit
  rationale: Ang תְּמוּרָה ay maaaring tumukoy sa kapalit, palit, o natatanggap bilang balik. Natural sa modernong Tagalog ang pariralang ito at pinananatili nito ang larawan ng isang kapalit o balik.
theological_decisions:
- issue: Kung sinasadya ba ng tao ang pandaraya sa sarili o siya ay naliligaw/naililigaw
  choice: na inililigaw ang sarili
  alternative: habang siya'y naliligaw; na nadadaya
  rationale: Hindi tahasang nilulutas ng Hebreong Niphal ang antas ng sariling pagkilos o panlabas na pagkaligaw. Ang salin ay nagpapakita ng kaugnayan sa sarili ngunit nililinaw sa talababa ang tunay na alternatibo.
translation_notes:
  register: Makabago at marangal na Filipino, na may tuwirang babala at pinananatiling pag-uulit ng pangunahing salitang Hebreo. Ginamit ang “matatanggap niyang kapalit” sa halip na mas teknikal o lumang “kabayaran” upang mapanatili ang diwa ng תְּמוּרָה bilang kapalit o balik.
