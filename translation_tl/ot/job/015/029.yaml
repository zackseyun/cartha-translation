translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang pang-isahang panghalip ayon sa agarang konteksto, habang pinanatili sa talababa ang tunay na leksikal at matalinghagang kalabuan ng huling sugnay.
