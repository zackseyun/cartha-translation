  yaml_path: translation/ot/job/015/029.yaml
  text: He will not become rich[a], and his wealth will not endure[b], and his produce will not bend down to the earth.
translation:
  language: tl
  text: Hindi siya yayaman, at hindi mananatili ang kanyang kayamanan; ang kanyang ani[a] ay hindi yuyuko patungo sa lupa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga pag-aari niya,” “kinita niya,” o “kasaganaan niya.” Bihira at hindi tiyak ang salitang Hebreo.
    reason: lexical_alternative
  - marker: b
    text: 'Maaaring inilalarawan ng huling sugnay ang mga sanga o ani na hindi yumuyuko patungo sa lupa dahil sa bigat ng saganang bunga. Nauunawaan naman ito ng iba sa mas pangkalahatang diwa: hindi lalawak sa lupain ang kanyang mga pag-aari.'
    reason: alternative_reading
lexical_decisions:
- source_word: יֶעְשַׁר
  choice: yayaman
  rationale: Ang Qal ng עשר ay nagsasaad ng pagiging o pagyaman, kaya likas at pandiwang-pandiwa ang “yayaman” sa Filipino.
- source_word: יָקוּם
  choice: mananatili
  rationale: Literal itong “tatayo,” ngunit kapag ang paksa ay kayamanan, ang diwa ay hindi ito magtatagal o mananatiling matatag.
- source_word: חֵילוֹ
  choice: ang kanyang kayamanan
  rationale: Maaaring tumukoy ang חַיִל sa lakas, yaman, o mga pag-aari; sa konteksto ng kasaganaan, pinakamalinaw ang “kayamanan.”
- source_word: יִטֶּה
  choice: yuyuko hanggang sa lupa
  rationale: Saklaw ng נטה ang pagtagilid, pag-unat, o pagyuko. Pinananatili ng salin ang kongkretong larawan ng ani o mga sangang yumuyuko dahil sa bigat ng kasaganaan.
- source_word: מִנְלָם
  choice: ang kanyang ani
  rationale: Bihira at hindi tiyak ang anyo. Ang “ani” ay umaangkop sa larawang pagyuko hanggang lupa, ngunit inilalahad sa talababa ang ibang posibleng kahulugan.
