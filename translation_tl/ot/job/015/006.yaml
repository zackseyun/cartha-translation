  yaml_path: translation/ot/job/015/006.yaml
  text: Your own mouth condemns you[a], and not I; your own lips testify against you.
translation:
  language: tl
  text: Ang sarili mong bibig ang humahatol sa iyo, hindi ako; ang sarili mong mga labi ang nagpapatotoo laban sa iyo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sumasagot laban sa iyo.” Mas literal na maaaring mangahulugang “sumagot” ang pandiwang Hebreo, ngunit dito ay malamang na tumutukoy ito sa pagbibigay ng patotoo.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַרְשִׁיעֲךָ
  choice: humahatol sa iyo
  rationale: Ang Hiphil ng רשע ay nangangahulugang magpahayag na may sala o humatol laban sa isang tao. Likas sa Filipino ang “humahatol sa iyo” at pinananatili nito ang legal na himig nang hindi idinaragdag ang mas tiyak na “pinatutunayang masama ka.”
- source_word: פִיךָ
  choice: ang sarili mong bibig
  rationale: 'Literal itong “ang bibig mo.” Ipinahihiwatig ng “sarili mong” ang diin ng konteksto: ang mismong pananalita ni Job ang humahatol sa kaniya.'
- source_word: וְלֹא אָנִי
  choice: hindi ako
  rationale: Pinananatili ang tuwirang pagsalungat sa naunang sugnay. Hindi na kailangang ulitin ang pandiwa sa Filipino.
- source_word: וּשְׂפָתֶיךָ
  choice: ang sarili mong mga labi
  rationale: Literal itong “ang mga labi mo.” Ang “sarili mong” ay nagbibigay ng likas na paralelismo sa “sarili mong bibig” at nagdiriin sa sariling pananalita ni Job.
- source_word: יַעֲנוּ
  choice: nagpapatotoo
  rationale: 'Bagaman karaniwang nangangahulugang “sumagot” ang ענה, sa kontekstong ito ay may legal na pahiwatig: ang mga labi ni Job ay tila mga saksing nagsasalita laban sa kaniya.'
- source_word: בָךְ
  choice: laban sa iyo
  rationale: Kasama ng legal na diwa ng יַעֲנוּ, malinaw na ipinahahayag ng “laban sa iyo” na ang sariling mga salita ni Job ang nagsisilbing patotoo laban sa kaniya.
theological_decisions: []
