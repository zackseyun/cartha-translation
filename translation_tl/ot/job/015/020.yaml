  yaml_path: translation/ot/job/015/020.yaml
  text: All the days of the wicked man he writhes[c][b][a], and a number of years are stored up for the ruthless.
translation:
  language: tl
  text: Sa lahat ng araw niya, ang taong masama ay namimilipit[a], at may bilang ng mga taon na nakalaan[b] para sa taong malupit[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “naghihirap” o “nanginginig sa matinding hirap.” Ang pandiwang Hebreo ay maaaring maglarawan ng pamimilipit, panginginig, o paghihirap na gaya ng paghilab sa panganganak.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “nakaimbak” o “nakatago.” Ang Hebreo ay maaaring tumukoy sa mga taon na itinabi o inilaan.
    reason: lexical_alternative
  - marker: c
    text: Ang “taong masama” at “taong malupit” ay kapwa nasa panlalaking isahan sa Hebreo at naglalarawan sa gayong tao bilang isang uri.
    reason: cultural_note
lexical_decisions:
- source_word: כָּל יְמֵי רָשָׁע
  choice: Sa lahat ng araw niya, ang taong masama
  rationale: Ipinahahayag ang kabuuan ng panahon at pinananatili ang isahang taong masama bilang kinatawan ng isang uri; ang “niya” ay natural na Tagalog na tumutukoy sa mga araw ng taong masama.
- source_word: הוּא מִתְחוֹלֵל
  choice: ay namimilipit sa hirap
  rationale: Ang tuloy-tuloy na anyo ng pandiwa ay naglalarawan ng patuloy na pamimilipit o matinding paghihirap. Pinananatili ng “namimilipit” ang masidhing larawan nang hindi nililimitahan ito sa pisikal na sakit lamang.
- source_word: וּמִסְפַּר שָׁנִים
  choice: at may takdang bilang ng mga taon
  rationale: Ipinahihiwatig ng parirala ang isang tiyak ngunit hindi binanggit na dami ng mga taon; mas malinaw ito sa modernong Tagalog kaysa sa literal na “isang bilang ng mga taon.”
- source_word: נִצְפְּנוּ
  choice: nakalaan
  rationale: Maaaring mangahulugan ang Niphal ng צפן na itinago, inimbak, o inilaan. Ang “nakalaan” ay natural sa konteksto ngunit hindi inaalis ang alternatibong larawang “nakaimbak” o “nakatago.”
- source_word: לֶעָרִיץ
  choice: para sa taong malupit
  rationale: Tinutukoy ng עָרִיץ ang isang marahas, mapaniil, o walang-awang tao. Ang “taong malupit” ay malinaw at malawak, at hindi ito nagpapalagay na isang pinunong politikal ang tinutukoy.
theological_decisions:
- issue: Kung ang ikalawang linya ay tumutukoy sa mga taong inilaan sa malupit o sa limitadong bilang ng kaniyang mga taon
  choice: Pinanatili ang pahayag na may takdang bilang ng mga taong nakalaan para sa taong malupit.
  alternative: Limitado ang bilang ng mga taon ng taong malupit.
  rationale: Hindi tahasang sinasabi ng Hebreo kung ang diin ay sa paglalaan/pagtatago ng mga taon o sa pagiging limitado ng haba ng buhay. Pinananatili ng salin ang metapora at hindi ipinapasok sa pangunahing teksto ang interpretasyong “limitado.”
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “taong masama” at “taong malupit” upang mapanatili ang isahang kinatawang anyo ng Hebreo. Inayos ang pagkakasunod ng mga talababa ayon sa paglitaw ng mga pananda sa teksto.
