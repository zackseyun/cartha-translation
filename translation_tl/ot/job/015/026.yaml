  text: He rushes at him with his neck[a], with the thick bosses of his shields.
translation:
  language: tl
  text: Sumusugod siya laban sa Kanya nang nakaunat ang leeg,[a] taglay ang makakapal na umbok ng kanyang mga kalasag.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nakausli ang leeg.” Literal na “may leeg.” Masidhi at siksik ang larawan sa Hebreo; malamang na inilalarawan nito ang mapanghamong pagsugod.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָרוּץ
  choice: Sumasalakay
  rationale: Ang רוץ ay literal na ‘tumakbo,’ ngunit sa malinaw na konteksto ng paglusob, ipinahahayag ng ‘sumasalakay’ ang mabilis at mapusok na pagkilos nang hindi kinakailangang gawing teknikal na katawagang militar.
- source_word: אֵלָיו
  choice: sa Kanya
  rationale: Sa kontekstong mapanlaban, ang אֶל ay tumutukoy sa direksiyon ng pagsalakay. Ginamit ang malaking titik upang malinaw na ang tinutukoy sa konteksto ay ang Diyos, bagaman walang ganitong pagkakaiba ng titik sa Hebreo.
- source_word: בְּצַוָּאר
  choice: nang nakatungo ang leeg
  rationale: Literal itong ‘sa/pamamagitan ng leeg.’ Ang ‘nakatungo ang leeg’ ay likas na Filipino para sa anyo ng taong sumusugod nang una ang leeg o ulo, ngunit nananatiling bahagyang di-tiyak ang siksik na larawang Hebreo.
- source_word: בַּעֲבִי גַּבֵּי
  choice: gamit ang makakapal na umbok
  rationale: Ang עֳבִי ay kapal at ang גַּבֵּי, kaugnay ng mga kalasag, ay tumutukoy sa nakaumbok o nakausling mga bahagi nito. Mas madaling maunawaan ng karaniwang mambabasa ang ‘makakapal na umbok’ kaysa sa teknikal na terminong pandigma.
- source_word: מָגִנָּיו
  choice: kanyang mga kalasag
  rationale: Ang anyo ay tahasang maramihan at may hulaping ikatlong panauhang panlalaki, kaya pinanatili ang ‘kanyang mga kalasag’ sa halip na gawing isahan.
theological_decisions:
- issue: Referent of אֵלָיו
  choice: Kanya, na tumutukoy sa Diyos
  alternative: kanya, nang walang pagpapalinaw sa malaking titik
  rationale: Sa daloy ng Job 15:25–26, ang taong masama ang sumusugod laban sa Makapangyarihan. Ang malaking titik ay tumutulong sa modernong mambabasang Filipino, ngunit hindi nagdaragdag ng pangalang wala sa talata.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang maramihang ‘mga kalasag’ at ang kongkretong larawan ng leeg at mga umbok, habang inilagay sa talababa ang pangunahing alternatibong pagbasa.
