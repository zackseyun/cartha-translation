  text: נֹ֘דֵ֤ד ה֣וּא לַ/לֶּ֣חֶם אַיֵּ֑ה יָדַ֓ע כִּֽי נָכ֖וֹן בְּ/יָד֣/וֹ יֽוֹם חֹֽשֶׁךְ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/015/023.yaml
  text: He wanders about for bread[a], saying[b], ‘Where is it?’ He knows that a day of darkness is ready at hand for him.
translation:
  language: tl
  text: Nagpapalaboy-laboy siya sa paghahanap ng tinapay[a], na sinasabi, “Nasaan iyon?” Alam niyang nakaabang sa kanya[b] ang isang araw ng kadiliman.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Hebreo para sa “tinapay” ay maaari ring mangahulugang pagkain sa pangkalahatan.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “ang araw ng kadiliman ay nakahanda sa kamay niya.” Malamang na nangangahulugan itong malapit nang sumapit sa kanya ang araw ng kadiliman.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹדֵד
  choice: nagpapalaboy-laboy
  rationale: Ipinahahayag ng Qal participle ang patuloy at hindi mapalagay na paglalagalag. Hindi nito ipinapalagay na siya ay isang ipinatapon o takas.
- source_word: לַלֶּחֶם
  choice: sa paghahanap ng tinapay
  rationale: Ang לֶחֶם ay literal na “tinapay” ngunit maaari ring tumukoy sa pagkain sa pangkalahatan. Pinanatili ang kongkretong larawan habang nilinaw ng “sa paghahanap” ang layon ng paglalagalag.
- source_word: אַיֵּה
  choice: Nasaan iyon?
  rationale: Ang salitang pananong ay “nasaan?” Ang “iyon” ay likas na tumutukoy pabalik sa tinapay o pagkain at nagbibigay ng kumpletong pahayag sa modernong Tagalog.
- source_word: יָדַע
  choice: Alam niya
  rationale: Tuwirang katumbas ito ng pandiwang nagpapahayag ng tiyak o matatag na pagkaalam.
- source_word: נָכוֹן
  choice: nakaabang
  rationale: Ang anyo ay nagsasaad ng isang bagay na nakahanda o nakatalaga. Sa konteksto, likas na ipinahahayag ng “nakaabang” ang nalalapit na kapahamakan nang hindi dinaragdagan ang tiyak na sanhi nito.
- source_word: בְּיָדוֹ
  choice: sa kanya
  rationale: Literal itong “sa kamay niya,” ngunit malamang na idyoma para sa isang bagay na malapit nang sumapit sa kanya. Iniiwasan ng pangunahing teksto ang maling pahiwatig na kontrolado niya ang araw ng kadiliman.
- source_word: יוֹם חֹשֶׁךְ
  choice: isang araw ng kadiliman
  rationale: Pinananatili nito ang larawang Hebreo ng isang araw na inilalarawan ng kadiliman, sa halip na tahasang ipakahulugan iyon bilang kapahamakan, paghuhukom, o kamatayan.
theological_decisions:
- issue: Metaporikal na puwersa ng “araw ng kadiliman”
  choice: isang araw ng kadiliman
  alternative: isang araw ng kapahamakan; araw ng paghuhukom
  rationale: Ipinahihiwatig ng konteksto ang nalalapit na sakuna para sa masama, ngunit hindi tahasang tinutukoy ng parirala kung ito ay kapahamakan, kamatayan, o banal na paghuhukom. Pinanatili ang larawan at teolohikal na tensiyon.
- issue: Kahulugan ng “sa kamay niya”
  choice: nakaabang sa kanya
  alternative: nakahanda sa kamay niya
  rationale: Maaaring maunawaan ang literal na Tagalog na para bang hawak o kontrolado niya ang araw. Ipinahahayag ng napiling salin ang malamang na diwang malapit na itong sumapit, habang itinatala sa talababa ang literal na anyo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ang “nagpapalaboy-laboy” ay nagpapakita ng patuloy at balisang paghahanap; ang “nakaabang sa kanya” ay natural na idyoma para sa nalalapit na banta. Ginamit ang “na sinasabi” bilang kaunting paglilinaw sa putol na tanong ng Hebreo, nang hindi binabago ang tinutukoy nito.
