  text: To them alone the land was given[b][a], and no stranger passed among them.
translation:
  language: tl
  text: Sa kanila lamang ibinigay ang lupain[a], at walang dayuhang dumaan sa gitna nila.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “lupa” o “daigdig.” Maaaring mangahulugan ang Hebreong אֶרֶץ ng alinman sa mga ito; pinili rito ang “lupain” dahil tumutukoy ang talata sa teritoryong natatanging ibinigay sa isang pangkat at hindi dinaanan ng mga dayuhan.
    reason: lexical_alternative
  - marker: b
    text: O “at walang dayuhang dumaan sa kanilang kalagitnaan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לָהֶם לְבַדָּם
  choice: sa kanila lamang
  rationale: 'Pinagsasama ng parirala ang tumatanggap at ang diwang eksklusibo: sa kanila, at wala nang iba. Likas ito sa modernong Tagalog at pinananatili ang diin ng Hebreo.'
- source_word: נִתְּנָה
  choice: ibinigay
  rationale: Ang anyong Nifal ay pasibo; malinaw na pinananatili ng “ibinigay” ang tinig at payak na kahulugan ng pandiwa.
- source_word: הָאָרֶץ
  choice: ang lupain
  rationale: Maaaring tumukoy ang אֶרֶץ sa lupa o daigdig, ngunit mas angkop dito ang “lupain” dahil sa konteksto ng teritoryong ibinigay sa isang pangkat at hindi dinaanan ng mga tagalabas.
- source_word: זָר
  choice: dayuhan
  rationale: Tumutukoy ito sa isang taong hindi kabilang sa pangkat. Ang “dayuhan” ay natural at marangal, nang hindi labis na nililimitahan ang kahulugan sa tiyak na lahi o bansa.
- source_word: עָבַר בְּתוֹכָם
  choice: dumaan sa gitna nila
  rationale: Pinananatili nito kapwa ang kilos ng pagdaan at ang lokatibong diwa ng pagiging nasa kanilang gitna.
theological_decisions: []
translation_notes:
  register: Gumamit ng modernong Filipino Tagalog na payak ngunit marangal. Ang ayos na “Sa kanila lamang ibinigay” ay nagpapanatili sa diin ng Hebreo sa eksklusibong tumanggap, samantalang ang “sa gitna nila” ay bahagyang mas pormal at patula kaysa “kasama nila,” na angkop sa pananalita sa Job.
