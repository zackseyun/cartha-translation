  source_fidelity: Tapat ang salin sa dalawang magkatulad na retorikal na tanong sa Hebreo. Ang “nalalaman mo” at “nauunawaan mo” ay wastong katumbas ng ידע at בין sa kontekstong ito. Ang “na wala sa amin” ay pinananatili ang bukás na, bahagyang matalinghagang “hindi kasama/nasa amin” ng וְלֹא עִמָּנוּ הוּא nang hindi nagdaragdag ng paliwanag.
  naturalness: Malinaw, natural, at marangal ang modernong Filipino. Maayos ang parallelismo ng dalawang tanong. Ang “wala sa amin” ay bahagyang mas literal kaysa “hindi namin taglay,” ngunit nauunawaan at angkop sa retorikal na hamon ni Elifaz.
  terminology: Wasto at pare-pareho ang paggamit ng “nalalaman” para sa kaalaman at “nauunawaan” para sa pag-unawa. Wala itong problemang teolohikal o pangalang nangangailangan ng pagbabago. Ang talababa ay nagbibigay ng lehitimong alternatibong pagpapahayag nang hindi ipinipilit ang isa lamang na pagbasa.
