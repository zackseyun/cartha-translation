  text: What do you know that we do not know? What do you understand that is not with us?[a]
translation:
  language: tl
  text: Ano ang nalalaman mo na hindi namin nalalaman? Ano ang nauunawaan mo na wala sa amin?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O, “na hindi namin taglay.” Literal sa Hebreo: “at hindi ito kasama namin.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה
  choice: Ano
  rationale: Ang panghalip na pananong ay nagpapasimula ng maikli at retorikal na tanong; likas at tuwiran sa Tagalog ang “Ano.”
- source_word: יָדַעְתָּ
  choice: ang nalalaman mo
  rationale: Bagaman anyong perfect ang pandiwa, pangkasalukuyan ang diwa nito sa retorikal na tanong. Ang “nalalaman mo” ay natural na katumbas ng kaalaman sa kontekstong ito.
- source_word: וְלֹא נֵדָע
  choice: na hindi namin nalalaman
  rationale: Ipinahahayag nito ang tuwirang paghahambing sa nalalaman ni Job at ng mga kausap niya. Ginagawang natural ng “na” ang ugnayan ng mga sugnay nang hindi binabago ang diwa.
- source_word: תָּבִין
  choice: Ano ang nauunawaan mo
  rationale: Ang בין ay tumutukoy sa pag-unawa o pagkilala. Pinakamalinaw sa karaniwang modernong Tagalog ang “nauunawaan.”
- source_word: וְלֹא עִמָּנוּ הוּא
  choice: na wala sa amin
  rationale: Pinananatili nito ang literal na larawang “hindi ito kasama/nasa amin” habang natural na ipinahihiwatig sa Tagalog na hindi taglay ng mga kausap ang naturang pagkaunawa.
