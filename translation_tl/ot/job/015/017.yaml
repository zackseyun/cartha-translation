  text: I will tell you; listen to me. What I have seen[a], I will recount—
translation:
  language: tl
  text: Sasabihin ko sa iyo; makinig ka sa akin. Ang nakita ko[a] ay isasalaysay ko—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Ipapakita ko sa iyo; makinig ka sa akin; at ito ang nakita ko, at isasalaysay ko.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲחַוְךָ
  choice: Sasabihin ko sa iyo
  rationale: Ang Piel ng חוה ay nagpapakilala sa sasabihin ni Elifaz. Likas sa modernong Tagalog ang “sasabihin ko sa iyo” at hindi nito ipinahihiwatig na may literal na bagay na ipapakita.
- source_word: שְׁמַע לִי
  choice: makinig ka sa akin
  rationale: Ang pautos na may לִי ay panawagan sa masusing pakikinig; malinaw at natural ito sa kasalukuyang Tagalog.
- source_word: וְזֶה
  choice: Ang
  rationale: Bagaman pormal na “at ito,” ginagamit ng parirala ang demonstratibo upang ipakilala ang nilalaman ng susunod na sugnay. Ang “Ang nakita ko” ay natural sa Tagalog habang pinananatili ang tungkuling iyon.
- source_word: חָזִיתִי
  choice: nakita ko
  rationale: Ipinahahayag ng perfect ang personal na pagmamasid na inaangkin ni Elifaz. Pinananatili ng “nakita ko” ang tuwirang diwa nang hindi dinaragdagan ang kahulugan.
- source_word: וַאֲסַפֵּרָה
  choice: ay isasalaysay ko
  rationale: Ang anyong cohortative ay nagpapahayag ng layuning ilahad ang naobserbahan. Mas tiyak ang “isasalaysay” kaysa sa pangkalahatang “sasabihin” at iniiwasan ang di-kailangang pag-uulit.
