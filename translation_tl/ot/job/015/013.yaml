source:
  edition: WLC
  text: כִּֽי תָשִׁ֣יב אֶל אֵ֣ל רוּחֶ֑/ךָ וְ/הֹצֵ֖אתָ מִ/פִּ֣י/ךָ מִלִּֽין־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/015/013.yaml
  text: that you turn your spirit against God and bring words out of your mouth?[a]
translation:
  language: tl
  text: na ibinabaling mo ang iyong espiritu laban sa Diyos[a] at naglalabas ka ng mga salita mula sa iyong bibig?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “patungo sa Diyos.” Literal na “sa/patungo sa Diyos” ang Hebreo; ginamit sa pangunahing teksto ang “laban sa Diyos” dahil nagpapahiwatig ng pagsalungat ang maparatang na konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: na
  rationale: Ipinakikilala nito ang nilalaman ng paratang na kaugnay ng tanong sa naunang talata; likas sa Filipino ang pang-ugnay na “na” sa nagpapatuloy na pangungusap.
- source_word: תָשִׁיב
  choice: ibinabaling mo
  rationale: Ang Hiphil ng שׁוב ay maaaring mangahulugang magpabalik, magbaling, o magtuon. Dito, ang “ibinabaling” ay tumutukoy sa direksiyon ng panloob na disposisyon ni Job.
- source_word: אֶל אֵל
  choice: laban sa Diyos
  rationale: Karaniwang nangangahulugan ang אֶל na “sa/patungo sa,” ngunit sa maparatang na konteksto ay ipinahihiwatig ang pagsalungat. Inilagay sa talababa ang mas literal na posibilidad upang mapanatili ang tunay na leksikal na kalabuan.
- source_word: רוּחֶךָ
  choice: ang iyong espiritu
  rationale: Maaaring tumukoy ang רוּחַ sa hangin, hininga, espiritu, o disposisyon. Ang “espiritu” ay nagpapanatili sa malawak na diwa ng panloob na pagkatao nang hindi ito nililimitahan sa “galit” o “init ng ulo.”
- source_word: וְהֹצֵאתָ
  choice: at naglalabas ka
  rationale: Pinananatili nito ang kongkretong larawan ng Hiphil ng יצא—ang pagpapalabas ng mga salita mula sa bibig—sa natural na kasalukuyang anyo sa Filipino.
- source_word: מִפִּיךָ
  choice: mula sa iyong bibig
  rationale: Malinaw nitong ipinahahayag ang pinagmumulan na tinutukoy ng מִן at pinananatili ang larawan ng teksto.
- source_word: מִלִּין
  choice: mga salita
  rationale: Ito ang tuwiran at likas na salin ng Aramaizing na pangmaramihang anyo na nangangahulugang mga salita o pahayag.
theological_decisions:
- issue: Kung ang espiritu ni Job ay nakatuon lamang sa Diyos o nakikipagsalungatan sa Diyos
  choice: laban sa Diyos
  alternative: patungo sa Diyos
  rationale: Ipinahihiwatig ng maparatang na konteksto ang pagsalungat, ngunit hindi ganap na inaalis ng Hebreo ang literal na diwang “patungo sa”; kaya tahasang itinala ang alternatibo sa talababa.
translation_notes:
  register: Makabago at marangal na Filipino, na pinananatili ang retorikal na tanong at ang kongkretong larawan ng espiritung ibinabaling at mga salitang lumalabas sa bibig. Ang pambungad na “na” ay sadyang nagdurugtong sa tanong ng naunang talata.
