  text: For the company of the godless is barren[b][a], and fire consumes the tents of bribery.
translation:
  language: tl
  text: Sapagkat ang pangkat ng mga di-makadiyos[a] ay walang bunga, at nilalamon ng apoy ang mga tolda ng suhol.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang pangkat ng mapagkunwari.” Ang Hebreong חָנֵף ay maaaring mangahulugang “mapagkunwari,” ngunit sa Job ay madalas itong may mas malawak na diwang “di-makadiyos” o “lapastangan.”
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “mga tolda ng suhol.” Tumutukoy ang parirala sa mga tirahang minarkahan ng tiwaling pakinabang.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Nagbibigay ito ng dahilan o paliwanag kaugnay ng naunang pahayag at likas ang ganitong ugnayan sa modernong Tagalog.
- source_word: עֲדַת
  choice: ang pangkat ng
  rationale: Tumutukoy ito sa isang nagkakatipong grupo o komunidad. Ang “pangkat” ay malinaw at hindi nagdadala ng di-kinakailangang konotasyong pansimbahan.
- source_word: חָנֵף
  choice: mga di-makadiyos
  rationale: Sa Job, karaniwan itong may malawak na diwang moral at panrelihiyon na “lapastangan” o “di-makadiyos,” hindi lamang taong mapagkunwari. Ginawang maramihan sa Tagalog upang maging natural kasunod ng kolektibong “pangkat.”
- source_word: גַּלְמוּד
  choice: walang bunga
  rationale: Ipinahihiwatig ng pang-uri ang pagiging baog, hubad, o hindi namumunga. Pinananatili ng “walang bunga” ang talinghaga at natural itong ilapat sa isang pangkat.
- source_word: וְאֵשׁ
  choice: at ... ng apoy
  rationale: Payak na pinag-uugnay ng waw ang ikalawang sugnay; napanatili ang apoy bilang lantad na simuno ng kilos sa ayos na natural sa Tagalog.
- source_word: אָכְלָה
  choice: nilalamon
  rationale: Literal itong “kinain,” ngunit sa apoy ay likas ang “nilalamon.” Ang aspektong nagaganap ay angkop sa pangkalahatang katotohanang ipinahahayag sa karunungang panitikan.
- source_word: אָהֳלֵי
  choice: ang mga toldang
  rationale: Pinananatili ang kongkretong larawan at sinaunang kaligiran sa halip na gawing pangkalahatang “mga tahanan.”
- source_word: שֹׁחַד
  choice: mula sa suhol
  rationale: Ang pangngalan ay “suhol” o “panunuhol.” Ipinahihiwatig ng pariralang konstrukto na ang mga tirahan ay kaugnay o bunga ng tiwaling pakinabang, nang hindi tahasang nagdaragdag ng mga tumatanggap ng suhol.
