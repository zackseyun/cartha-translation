lexical_decisions:
- source_word: וַיַּעַן
  choice: sumagot
  rationale: Ang pandiwang ענה sa pormulang pasalaysay ay nagpapakilala ng tugon sa naunang pananalita; natural at tapat sa Filipino ang “sumagot.”
- source_word: אֱלִיפַז
  choice: Elifaz
  rationale: Isinalin sa karaniwang anyong ginagamit sa Filipino ang personal na pangalan.
- source_word: הַתֵּימָנִי
  choice: na Temanita
  rationale: Ang pang-uring gentiliko ay tumutukoy sa pinagmulan o kaugnayan niya sa Teman; pinananatili ng “Temanita” ang maikli at pantanging katawagan ng Hebreo.
- source_word: וַיֹּאמַר
  choice: at sinabi
  rationale: Pinananatili ang ikalawang pandiwa sa Hebreong pormulang “sumagot ... at sinabi” sa halip na alisin bilang pag-uulit.
- source_word: וַ
  choice: Pagkatapos ay
  rationale: Ipinahahayag nito ang pagsulong ng salaysay at ang pagkakasunod ng mga nagsasalita sa natural na makabagong Filipino.
