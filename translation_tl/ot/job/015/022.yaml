  text: לֹא יַאֲמִ֣ין שׁ֭וּב מִנִּי חֹ֑שֶׁךְ ו/צפו ה֣וּא אֱלֵי חָֽרֶב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/015/022.yaml
  text: He does not expect to return from darkness[a], and he is destined for the sword.
translation:
  language: tl
  text: Hindi niya inaasahang makabalik mula sa kadiliman, at siya ay nakalaan sa tabak.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “binabantayan ng tabak” o “hinihintay ng tabak.” Mahirap tiyakin ang kahulugan ng pandiwang Hebreo; malamang na ipinahihiwatig ng linya ang nakaambang marahas na kamatayan o paghatol.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא יַאֲמִין
  choice: Hindi niya inaasahan
  rationale: Ang Hiphil ng אמן sa kontekstong ito ay tumutukoy sa pag-asang mangyayari ang isang bagay, hindi sa pananampalataya o pagtitiwala.
- source_word: שׁוּב
  choice: makabalik
  rationale: Ipinahahayag ng infinitive ang nilalaman ng inaasahan; natural sa Filipino ang aspektong potensiyal na “makabalik.”
- source_word: מִנִּי חֹשֶׁךְ
  choice: mula sa kadiliman
  rationale: Pinananatili ang larawan ng paglabas mula sa kadiliman bilang kalagayan ng kapahamakan o dalamhati.
- source_word: וְצָפוּ הוּא אֱלֵי חָרֶב
  choice: at siya ay nakalaan sa tabak
  rationale: Mahirap at maaaring iba-iba ang pagbasa sa צפו. Ang “nakalaan” ay natural na Filipino at naghahatid ng nakaambang marahas na wakas, habang inilalahad sa talababa ang leksikal na kalabuan.
- source_word: חָרֶב
  choice: tabak
  rationale: Ang “tabak” ay dignidad at pamilyar na biblikal na larawan para sa marahas na kamatayan o paghatol.
theological_decisions:
- issue: Kung ang ikalawang sugnay ay tiyak na pagtatalaga o larawan ng nakaambang panganib
  choice: nakalaan sa tabak
  alternative: binabantayan ng tabak / hinihintay ng tabak
  rationale: Pinili ang natural na pangunahing salin nang hindi ginagawang tahasang doktrina ng predestinasyon; pinananatili sa talababa ang tunay na hirap at mga posibleng pakahulugan ng Hebreo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kadiliman” at “tabak” upang mapanatili ang matinding larawang patula ng Hebreo; ang estruktura ay natural sa karaniwang mambabasa nang hindi pinapawi ang kalabuan ng ikalawang sugnay.
