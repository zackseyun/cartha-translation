translation:
  language: tl
  text: Sapagkat tinakpan niya ng kanyang taba ang kanyang mukha[a], at nag-ipon siya ng taba sa kanyang mga tagiliran.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Sapagkat tinakpan niya ng taba ang kanyang mukha, at nagkaroon siya ng mga tupi ng taba sa kanyang mga tagiliran.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikilala nito ang paliwanag o dahilan ng naunang paglalarawan; likas at marangal ang “Sapagkat” sa kontekstong patula.
- source_word: כִסָּה
  choice: tinakpan
  rationale: Tuwirang pinananatili ang kahulugang “takpan” at ang aspektong ganap ng pandiwa sa salaysay.
- source_word: פָנָיו
  choice: ang kanyang mukha
  rationale: Ang kongkretong “mukha” ang pinakaangkop sa kaagapay na larawang tumutukoy sa katawan.
- source_word: בְּחֶלְבּוֹ
  choice: ng sarili niyang taba
  rationale: Pinananatili ang kongkretong larawan ng taba at nililinaw ng “sarili niyang” ang hulaping panghalip sa Hebreo.
- source_word: וַיַּעַשׂ
  choice: pinataba
  rationale: Sa pagsama sa bihirang pangngalang פִּימָה, natural na Filipino ang “pinataba” para sa paggawa o pagbuo ng kapal ng taba, nang hindi nawawala ang pisikal na larawan.
- source_word: פִּימָה
  choice: taba
  rationale: Ang bihirang salita ay tumutukoy sa katabaan o makapal na naipong taba; “taba” ang malinaw at natural na katumbas sa pangunahing teksto.
- source_word: עֲלֵי
  choice: sa
  rationale: Karaniwang panandang lokatibo sa Filipino para sa taba na nasa bahagi ng katawan.
- source_word: כָסֶל
  choice: kanyang mga tagiliran
  rationale: Ang כֶּסֶל ay maaaring tumukoy sa balakang, baywang, o mga tagiliran; “mga tagiliran” ang natural at angkop sa larawan ng namuong taba.
