  verdict: revise
  source_fidelity: 'Ang unang bahagi ay tapat sa Hebreong larawan: ang mukha ay natatakpan ng sariling taba. Sa ikalawang bahagi, ang draft na “pinataba ang kanyang mga tagiliran” ay maaaring magpahiwatig na may ibang taong pinataba niya ang mga tagiliran, at hindi nito gaanong malinaw na naipon o nabuo ang taba sa kaniyang sariling tagiliran. Ang bihirang פִּימָה ay tumutukoy sa kapal o mga tipon/tupi ng taba; dapat panatilihin ang kongkretong imahen nang hindi labis na pinipili ang isang tiyak na anatomiya.'
  naturalness: Natural ang “Sapagkat” sa marangal na patulang Filipino. Mas malinaw at likas ang “nag-ipon siya ng taba sa kanyang mga tagiliran” kaysa “pinataba ang kanyang mga tagiliran,” habang nananatiling matalinghaga at tuwiran ang paglalarawan.
  terminology: Ang “taba,” “mukha,” at “mga tagiliran” ay angkop na modernong Filipino at maingat na katumbas ng חֶלֶב, פָּנָיו, at כָסֶל. Hindi kailangan ang “sarili niyang,” sapagkat sapat na ang “kanyang taba” upang ipahayag ang panghalip na nasa Hebreo.
