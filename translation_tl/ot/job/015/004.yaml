  text: Indeed[c][b][a], you annul the fear of God and diminish meditation before God.
translation:
  language: tl
  text: Tunay nga, pinawawalang-saysay[a] mo ang pagkatakot[b], at binabawasan mo ang pagninilay[c] sa harap ng Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sinisira mo ang bisa” o “pinahihina mo.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “pagkatakot.” Sa konteksto, maaari itong tumukoy sa pagkatakot sa Diyos o pagpipitagan sa kanya.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “panalangin,” “debosyon,” “paghihinagpis,” o “mapagnilay na pananalita.” Malawak ang kahulugan ng salitang Hebreo at maaari itong tumukoy sa mapagnilay o mapanalanging pagsasalita.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַף
  choice: Tunay nga
  rationale: Ginamit dito bilang katagang nagbibigay-diin sa paratang ni Elifaz, hindi lamang bilang pang-ugnay.
- source_word: אַתָּה
  choice: mo
  rationale: Ang ikalawang panauhang panlalaking isahan ay likas na ipinahahayag sa Filipino sa panghalip na nakakabit sa pandiwa; ang diin ay tinutulungan ng “Tunay nga.”
- source_word: תָּפֵר
  choice: pinawawalang-saysay
  rationale: Ang Hiphil ng פרר ay nangangahulugang sirain, pawalang-bisa, o gawing hindi mabisa. Ipinahahayag ng salin ang sanhiang diwa at talim ng paratang nang natural sa Filipino.
- source_word: יִרְאָה
  choice: ang pagkatakot sa Diyos
  rationale: Ang pangngalan ay maaaring tumukoy sa takot o pagpipitagan. Sa konteksto at sa paralelismo sa “sa harap ng Diyos,” relihiyosong pagkatakot ang tinutukoy; idinagdag ang “sa Diyos” para luminaw ang tinutukoy habang itinatala sa talababa na hindi ito tahasang inuulit sa Hebreo.
- source_word: וְתִגְרַע
  choice: at binabawasan mo
  rationale: Ang Qal ng גרע ay “bawasan,” “paliitin,” o “ipagkait.” Pinananatili ng “binabawasan” ang payak at malawak na diwa ng pandiwa.
- source_word: שִׂיחָה
  choice: pagninilay
  rationale: Maaaring tumukoy ang salita sa pagninilay, mapanalanging pananalita, panalangin, o paghihinagpis. Ang “pagninilay” ay nagpapanatili ng lawak nito nang hindi agad nililimitahan sa pormal na panalangin.
- source_word: לִפְנֵי אֵל
  choice: sa harap ng Diyos
  rationale: Tuwirang ipinapahayag nito ang pagiging nasa harapan o presensiya ng Diyos at natural itong pakinggan sa makabagong Filipino.
theological_decisions:
- issue: Relihiyosong diwa ng יִרְאָה
  choice: pagkatakot sa Diyos
  alternative: pagkatakot; pagpipitagan
  rationale: Ang paratang ay tungkol sa epekto ni Job sa kabanalan o debosyon, hindi sa karaniwang takot lamang. Pinananatili ng “pagkatakot sa Diyos” ang mahalagang biblikal na konsepto nang hindi ito ginagawang isa lamang damdamin.
- issue: Diwa ng שִׂיחָה kaugnay ng Diyos
  choice: pagninilay
  alternative: panalangin; debosyon; paghihinagpis; mapagnilay na pananalita
  rationale: Malawak ang saklaw ng salitang Hebreo. Pinananatili ng “pagninilay” ang tunay na kalabuan; inilalahad sa talababa ang mga posibleng diwang panalangin at paghihinagpis.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinili ang “pinawawalang-saysay” upang mapanatili ang talim ng paratang, at “pagninilay” upang hindi makitid na lutasin ang malawak na kahulugan ng שִׂיחָה.
