  text: because he has stretched out his hand against God[a], and has shown himself mighty against the Almighty.
translation:
  language: tl
  text: Sapagkat iniunat niya ang kanyang kamay laban sa Diyos[a] at nagpapakalakas laban sa Makapangyarihan sa Lahat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Sapagkat iniunat niya ang kanyang kamay tungo sa Diyos at nagpapakalakas laban sa Makapangyarihan sa Lahat.”
    reason: Pinananatili ang posibleng mas literal na kahulugan ng אֶל bilang “tungo sa,” samantalang ang “laban sa” sa pangunahing teksto ay nagpapahayag ng mapanghamong diwa sa konteksto.
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikita nito na ang talata ang nagbibigay ng dahilan sa kapahamakang inilalarawan sa konteksto; likas at marangal din ito sa tulang Filipino.
- source_word: נָטָה
  choice: iniunat
  rationale: Pinananatili nito ang kongkretong larawan ng pag-uunat ng kamay sa Hebreo.
- source_word: אֶל
  choice: laban sa
  rationale: Bagaman karaniwang nangangahulugang “tungo sa,” malinaw na pagsalungat sa Diyos ang diwa sa kontekstong ito, kaya “laban sa” ang likas na katumbas sa Filipino.
- source_word: אֵל
  choice: Diyos
  rationale: Karaniwang titulong tumutukoy sa Diyos at pinananatiling naiiba sa titulong שַׁדַּי sa kasunod na hanay.
- source_word: יָדוֹ
  choice: ang kanyang kamay
  rationale: Tuwirang pinananatili ang isahang anyo at ang Hebreong idyoma ng mapanghamong pagkilos.
- source_word: שַׁדַּי
  choice: ang Makapangyarihan sa Lahat
  rationale: Isinasalin ang banal na titulo sa malinaw at kinikilalang katumbas sa modernong Filipino sa halip na transliterahin ito.
- source_word: יִתְגַּבָּר
  choice: nagpakalakas
  rationale: Pinananatili ang reflexive na diwa ng pagpapalakas o pagpapakitang malakas, pati ang kabalintunaan ng pagtatangkang lumakas laban sa Makapangyarihan sa Lahat.
theological_decisions:
- issue: Magkatabing banal na titulo sa paralelismo
  choice: Diyos / ang Makapangyarihan sa Lahat
  alternative: Diyos / Shaddai
  rationale: Isinasalin ang dalawang titulo habang pinananatili ang pagkakaiba ng mga ito at ang paralelismo ng tulang Hebreo.
- issue: Direksiyon o pagsalungat sa Diyos
  choice: laban sa Diyos
  alternative: tungo sa Diyos
  rationale: Ipinahihiwatig ng konteksto ang mapanghamong pagsalungat, ngunit inilalagay sa talababa ang mas literal na direksiyonal na pagbasa upang mapanatili ang tunay na saklaw ng אֶל.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang kongkretong larawang “iniunat ... ang kamay” at ang ironikong pag-uugnay ng “nagpakalakas” sa titulong “Makapangyarihan sa Lahat.”
