  source_fidelity: Ang pangunahing pagkakasunod ng Hebreo—paglilihi/pagbubuntis, panganganak, at paghahanda sa sinapupunan—ay napanatili, gayundin ang maramihang pangkalahatang simuno. Gayunman, ang “naglilihi” sa makabagong Filipino ay karaniwang tumutukoy sa mga pagnanasa o kakaibang reaksyon ng nagdadalang-tao, hindi sa paglihi o pagbubuntis mismo. Kaya hindi nito ligtas na naihahatid ang הָרֹה.
  naturalness: Natural at marangal ang iba pang mga parirala. Mas malinaw at mas tumpak sa makabagong Filipino ang “nagbubuntis sila ng kapahamakan” para sa sinadyang metaporang paglihi ng עָמָל.
  terminology: Ang “kasamaan,” “sinapupunan,” at “pandaraya” ay angkop na mga katumbas ng אָוֶן, בֶּטֶן, at מִרְמָה sa kontekstong ito. Ang “kapahamakan” ay mas malapit sa masamang bunga/pinsala ng עָמָל kaysa “kaguluhan,” na mas madaling unawain bilang kaayusang magulo o pagkakagulo.
  issues:
