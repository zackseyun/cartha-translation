- from: Naglilihi sila ng kaguluhan at nagsisilang ng kasamaan[a]; ang kanilang sinapupunan ay naghahanda ng pandaraya.
  to: Nagbubuntis sila ng kapahamakan at nagsisilang ng kasamaan[a]; ang kanilang sinapupunan ay naghahanda ng pandaraya.
  rationale: Pinalitan ang “naglilihi” ng “nagbubuntis” upang maihatid nang malinaw ang Qal participle ng הרה sa modernong Filipino at mapanatili ang metaporang pagbubuntis at panganganak. Pinalitan din ang “kaguluhan” ng “kapahamakan” bilang mas angkop na pangkontekstong katumbas ng עָמָל. Hindi binago ang pagtalima sa maramihang pangkalahatang simuno, ang talinghaga ng sinapupunan, o ang ambiguity ng אָוֶן sa talababa.
