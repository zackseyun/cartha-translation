    issue: Ang “naglilihi sila ng kaguluhan” ay hindi tumpak at di-likas sa makabagong Filipino.
    rationale: Karaniwang kahulugan ng maglihi ngayon ay magkaroon ng pagnanasa o sensitibong reaksyon habang buntis; hindi ito ang tuwirang katumbas ng “conceive/be pregnant.” Maaari nitong ilihis ang larawan ng Hebreo.
  - severity: low
    issue: Ang “kaguluhan” ay hindi ang pinakamalinaw na katumbas ng עָמָל sa talinghagang moral na ito.
    rationale: Maaaring magpahiwatig ang עָמָל ng kapinsalaan, paghihirap, o masamang gawa. Ang “kapahamakan” ay mas malinaw na nakapipinsalang bunga at tumutugma sa daloy tungo sa kasamaan at pandaraya.
  revised_text: Nagbubuntis sila ng kapahamakan at nagsisilang ng kasamaan[a]; ang kanilang sinapupunan ay naghahanda ng pandaraya.
