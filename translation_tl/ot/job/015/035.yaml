  text: They conceive trouble and give birth to wickedness[a]; their womb prepares deceit.
translation:
  language: tl
  text: Nagbubuntis sila ng kapahamakan at nagsisilang ng kasamaan[a]; ang kanilang sinapupunan ay naghahanda ng pandaraya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Nagdadalang-tao sila ng kapahamakan at nanganganak ng kalikuan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרֹה
  choice: naglilihi
  rationale: Ang Qal participle ng הרה ay tumutukoy sa pagdadalantao o paglilihi. Pinananatili ng “naglilihi” ang matalinghagang pagkakasunod mula sa pagbubuntis tungo sa panganganak.
- source_word: עָמָל
  choice: kaguluhan
  rationale: Sa panitikang karunungan, ang עָמָל ay maaaring tumukoy sa kaguluhan, kapahamakan, o nakapipinsalang gawain, hindi lamang sa karaniwang pagpapagal.
- source_word: וְיָלֹד
  choice: nagsisilang
  rationale: Ang pandiwang ילד ay tahasang bahagi ng larawang panganganak; natural at marangal sa Filipino ang “nagsisilang.”
- source_word: אָוֶן
  choice: kasamaan
  rationale: Maaaring mangahulugan ang אָוֶן ng kasamaan, kalikuan, o kapahamakan. Dito, ang “kasamaan” ay nagpapahayag ng moral na diin at umaayon sa kasunod na pandaraya.
- source_word: וּבִטְנָם
  choice: ang kanilang sinapupunan
  rationale: Bagaman maaari ring mangahulugang tiyan ang בטן, “sinapupunan” ang pinakamalinaw dahil nagpapatuloy ang talinghaga ng paglilihi at panganganak. Ang hulaping maramihan ay isinalin bilang “kanilang.”
- source_word: תָּכִין
  choice: naghahanda
  rationale: Ang Hiphil ng כון ay karaniwang nangangahulugang naghahanda, ginagawang handa, o nagtatatag. Pinananatili ng “naghahanda” ang ideya ng paghubog sa loob.
- source_word: מִרְמָה
  choice: pandaraya
  rationale: Ang מִרְמָה ay tumutukoy sa panlilinlang, pandaraya, o pagtataksil. Ang “pandaraya” ay maikli, natural, at may malinaw na moral na bigat.
theological_decisions:
- issue: Bilang at kasarian ng ipinahihiwatig na simuno
  choice: 'Maramihang pangkalahatan: “sila ... kanilang”'
  alternative: 'Isahang kinatawan: “siya ... kanyang” o “ang tao ... kanyang”'
  rationale: Isahan ang anyo ng participle, ngunit maramihan ang hulapi sa “kanilang sinapupunan,” at inilalarawan sa konteksto ang masasama bilang isang uri. Pinananatili ng maramihang pangkalahatan ang saklaw nang hindi lumilikha ng di-likas na paglipat ng bilang sa Filipino.
translation_notes:
  register: Makabagong Filipino na natural ngunit marangal. Pinanatili ang matinding talinghaga ng paglilihi, panganganak, at sinapupunan, pati ang kolektibong maramihang pagtukoy sa masasama.
