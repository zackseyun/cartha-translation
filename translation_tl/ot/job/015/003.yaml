  text: Should he argue with useless words[a], or with speech that does no good?
translation:
  language: tl
  text: Makikipagtalo ba siya sa pamamagitan ng pananalitang walang pakinabang,[a] o ng mga salitang walang naidudulot na mabuti?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Mangatuwiran ba siya sa usapang hindi kapaki-pakinabang at sa mga salitang hindi nakabubuti?”
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹכֵחַ
  choice: Makikipagtalo
  rationale: Ang Hiphil participle ng יכח ay maaaring mangahulugang makipagtalo, mangatuwiran, o sumaway. Sa konteksto ng pagtatalo nina Job at ng kaniyang mga kaibigan, ang “makikipagtalo” ay natural at hindi labis na nagpapahiwatig ng pormal na paglilitis.
- source_word: בְּדָבָר לֹא יִסְכּוֹן
  choice: gamit ang pananalitang walang pakinabang
  rationale: Dito, ang דָבָר ay tumutukoy sa pananalita, at ang סכן ay nagpapahayag ng pagiging kapaki-pakinabang. Pinananatili ng parirala ang ideya ng usapang hindi nakabubuti nang hindi ginagawang lubhang literal ang ayos ng Hebreo.
- source_word: וּמִלִּים
  choice: o ang mga salitang
  rationale: Ang מִלִּים ay “mga salita.” Isinalin ang pang-ugnay bilang “o” upang maging natural ang magkatugmang bahagi ng retorikal na tanong.
- source_word: לֹא יוֹעִיל בָּם
  choice: walang naidudulot na mabuti
  rationale: Ang יועיל ay nangangahulugang magbigay ng pakinabang o kabutihan, at ang בם ay malamang na tumutukoy sa mga salita. Ang salin ay malinaw at likas sa modernong Tagalog.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na may marangal ngunit madaling maunawaang himig. Pinanatili ang retorikal na tanong at ang magkatulad na diwa ng dalawang linya, habang iniiba nang bahagya ang “pananalita” at “mga salita” upang maging natural.
