  text: Should a wise man answer with windy knowledge[a], and fill his belly with the east wind?
translation:
  language: tl
  text: Dapat bang sumagot ang isang marunong na tao nang may kaalamang gaya ng hangin[a], at punuin niya ang kanyang tiyan ng hangin mula sa silangan?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kaalaman ng hangin,” ibig sabihin, kaalamang hungkag o walang kabuluhan.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶחָכָם
  choice: isang taong marunong
  rationale: Ang pantanong na הֲ kasama ng חָכָם ay bumubuo ng retorikal na tanong. Ginamit ang likas at pangkalahatang pariralang Filipino na hindi tumutukoy sa isang partikular na tao.
- source_word: יַעֲנֶה
  choice: Dapat bang sumagot
  rationale: Ang imperfect sa retorikal na tanong ay nagpapahiwatig ng nararapat o inaasahang asal, kaya ang “Dapat bang” ay nagpapanatili sa mapanuyang pagsaway.
- source_word: דַעַת רוּחַ
  choice: kaalamang parang hangin
  rationale: Ang construct phrase ay literal na “kaalaman ng hangin/espiritu.” Sa konteksto, ang רוּחַ ay tumutukoy sa hanging sagisag ng hungkag o walang-lamang kaalaman; pinananatili ng salin ang metapora nang natural sa Filipino.
- source_word: וִימַלֵּא
  choice: at punuin
  rationale: Ipinagpapatuloy ng pandiwa ang retorikal na tanong at pinananatili ang tuwirang larawan ng pagpuno.
- source_word: קָדִים
  choice: hanging silangan
  rationale: Ang קָדִים ay ang hanging nagmumula sa silangan, na madalas ilarawang mainit, marahas, o mapaminsala. Pinanatili ang kongkretong larawan nang hindi idinaragdag sa pangunahing teksto ang mga katangiang ipinahihiwatig lamang ng konteksto.
- source_word: בִּטְנוֹ
  choice: kanyang tiyan
  rationale: Ang בֶּטֶן ay literal na “tiyan.” Pinananatili nito ang matingkad na larawang ang loob ng tao ay pinupuno ng hangin.
