  yaml_path: translation/ot/job/015/007.yaml
  text: Were you born as the first man[a], and were you brought forth before the hills?
translation:
  language: tl
  text: 'Ikaw ba’y ipinanganak bilang unang tao,[a]

    at iniluwal bago pa ang mga burol?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Ikaw ba’y isinilang bilang si Adan, ang unang tao?” Sinasabi ng Hebreo na “ang unang tao” at maaaring nagpapahiwatig kay Adan nang hindi tahasang ginagamit ang pangalan bilang pangalang pantangi.
    reason: alternative_reading
lexical_decisions:
- source_word: הֲ/רִאישׁוֹן אָדָם
  choice: ang unang taong
  rationale: Ang הֲ ay pananda ng retorikal na tanong, at ang רִאשׁוֹן אָדָם ay likas na maisasalin bilang “ang unang tao.” Pinananatili nito ang pagkakasunod sa panahon nang hindi tahasang ginagawang pangalang pantangi ang אָדָם.
- source_word: תִּוָּלֵד
  choice: ipinanganak
  rationale: Ang Niphal ng ילד ay karaniwang nangangahulugang “ipanganak”; natural at tuwiran ito sa modernong Tagalog.
- source_word: וְ/לִ/פְנֵי
  choice: at ... bago pa
  rationale: Ipinahihiwatig ng parirala ang ikalawang magkaugnay na tanong at ang pagiging nauna sa panahon. Ang “bago pa” ay natural at may angkop na diin sa Tagalog.
- source_word: גְבָעוֹת
  choice: mga burol
  rationale: Tuwirang katumbas ito ng pangmaramihang גְבָעוֹת at pinananatili ang sinaunang larawang heograpiko ng tula.
- source_word: חוֹלָלְתָּ
  choice: iniluwal ka
  rationale: Ang pandiwa ay gumagamit ng larawan ng panganganak o paglalabas mula sa sinapupunan. Naiiba ang “iniluwal” sa naunang “ipinanganak” habang pinananatili ang paralelismo at birth imagery.
theological_decisions:
- issue: Kung ang אָדָם ay pangalang pantanging “Adan” o pangkalahatang “tao”
  choice: Pangkalahatang “tao” sa pariralang “ang unang tao”
  alternative: “Adan, ang unang tao”
  rationale: Bagaman maaaring magpahiwatig kay Adan ang parirala, hindi tahasang minamarkahan ng Hebreo rito ang אָדָם bilang pangalang pantangi. Pinananatili ng pangunahing salin ang tunay na kalabuan at hindi nito nililimitahan ang kahulugan nang higit sa pinagmulan.
translation_notes:
  register: 'Makabago, malinaw, at marangal na Tagalog. Pinanatili ang dalawang magkatugmang retorikal na tanong at ang magkaibang salitang may larawan ng pagsilang: “ipinanganak” at “iniluwal.”'
