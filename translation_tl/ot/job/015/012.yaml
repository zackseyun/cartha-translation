  naturalness: Mas natural at malinaw sa makabagong Filipino ang “Bakit ka tinatangay ng puso mo?” kaysa “Bakit ka ipinadadala ng puso mo?” Ang “kumikislap ang iyong mga mata” ay maayos na literal-singaw na paglalarawan para sa pangunahing pagpiling ‘flash.’
