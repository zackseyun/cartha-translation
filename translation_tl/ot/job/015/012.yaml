translation_notes:
  register: Makabago at marangal na Filipino. Ginamit ang “ipinadadala ng puso” upang mapanatili ang Hebreong personipikasyon nang hindi maging labis na literal, at nilagyan ng talababa ang tunay na leksikal na kawalang-katiyakan sa kilos ng mga mata.
