  text: Why does your heart carry you away[a], and why do your eyes flash?
translation:
  language: tl
  text: Bakit ka tinatangay ng puso mo, at bakit kumikislap ang iyong mga mata?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring mangahulugang “kumukurap,” “sumesenyas,” o marahil ay “umiikot” ang iyong mga mata; bihira ang pandiwang Hebreo at hindi tiyak ang eksaktong kahulugan nito.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה
  choice: Bakit
  rationale: Bagaman literal na “ano,” ginagamit ito rito bilang retorikal na tanong tungkol sa sanhi o motibo; natural sa Tagalog ang “bakit.”
- source_word: יִקָּחֲךָ
  choice: ka ipinadadala
  rationale: Ang לקח ay “kumuha,” ngunit puso ang simuno at ang kausap ang layon. Ipinahihiwatig ng idyoma na ang sariling kalooban ang tumatangay o nag-uudyok sa tao; pinananatili ng “ipinadadala” ang larawan nang natural sa Tagalog.
- source_word: לִבֶּךָ
  choice: puso mo
  rationale: Tumutukoy ang “puso” sa panloob na pagkatao, kabilang ang isip, damdamin, at kalooban. Malinaw at natural ang literal na larawan sa Tagalog.
- source_word: וּמַה
  choice: at bakit
  rationale: Tulad ng unang מַה, retorikal itong nagtatanong tungkol sa dahilan; isinasalin ang וּ bilang “at.”
- source_word: יִרְזְמוּן
  choice: nagniningas
  rationale: Bihira at hindi tiyak ang eksaktong diwa ng pandiwa. Ang “nagniningas” ay naghahatid ng matindi o mapanghamong tingin habang pinananatili ang buhay na paglalarawan sa mga mata; inilalahad sa talababa ang ibang posibleng kahulugan.
- source_word: עֵינֶיךָ
  choice: iyong mga mata
  rationale: Natural ang literal na salin at pinananatili nito ang pisikal na larawang ginamit sa pagsaway.
