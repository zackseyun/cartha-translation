base_translation:
  language: en
  yaml_path: translation/ot/job/015/005.yaml
  text: For your iniquity teaches your mouth[b][a], and you choose the tongue of the crafty.
translation:
  language: tl
  text: 'Sapagkat tinuturuan ng iyong kasamaan ang iyong bibig,[a]

    at pinipili mo ang pananalita ng mga tuso.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang iyong pagkakasala ang nagtuturo sa iyong bibig.” Ang salitang Hebreo ay maaaring tumukoy sa kasamaan, pagkakasala, o pananagutan dahil sa kasalanan.
    reason: lexical_alternative
  - marker: b
    text: O “pananalita ng mga maparaan” o “wika ng mga mapanlinlang.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikilala nito ang batayan ng paratang ni Elifaz at natural na nag-uugnay sa naunang pangungusap.
- source_word: יְאַלֵּף
  choice: tinuturuan
  rationale: Pinananatili ang diwang Piel na ‘magturo’ o ‘magsanay’ at ang pagsasatao sa kasamaan bilang nagtuturo sa bibig ni Job.
- source_word: עֲוֺנְךָ
  choice: iyong kasamaan
  rationale: Ipinahahayag ang moral na kamalian na humuhubog sa pagsasalita; hindi nito nililimitahan ang salita sa damdamin o legal na kalagayan ng pagkakasala.
- source_word: פִיךָ
  choice: iyong bibig
  rationale: Pinananatili ang konkretong larawang Hebreo at likas itong tumutukoy sa pagsasalita sa Filipino.
- source_word: וְתִבְחַר
  choice: at pinipili mo
  rationale: Tuwirang isinasalin ang aktibong pagpili at pinananatili ang tahasang paratang sa ikalawang panauhan.
- source_word: לְשׁוֹן
  choice: pananalita
  rationale: Sa Filipino, mas natural ang ‘pananalita’ kaysa literal na ‘dila’ para sa paraan o wikang ginagamit sa pagsasalita, habang nananatili ang parallelismo sa ‘bibig.’
- source_word: עֲרוּמִים
  choice: mga tuso
  rationale: Ang konteksto ng paratang ay nangangailangan ng negatibong diwa ng pagiging maparaan o mapanlinlang, bagaman maaaring maging positibo ang salitang Hebreo sa ibang konteksto.
theological_decisions:
- issue: Moral na diwa ng עָוֹן sa paratang
  choice: iyong kasamaan
  alternative: iyong pagkakasala
  rationale: Ipinakikita rito ang moral na kabulukan bilang pinagmumulan ng pananalita ni Job ayon sa paratang ni Elifaz. Ang ‘kasamaan’ ay nagpapanatili ng matinding etikal na diwa, samantalang maaaring tukuyin ng ‘pagkakasala’ ang kasalanan o ang pagiging may-sala.
- issue: Ambiguwidad ng עֲרוּמִים
  choice: mga tuso
  alternative: mga maparaan / mga mapanlinlang
  rationale: May saklaw ang salitang Hebreo mula sa pagiging matalino o maparaan hanggang sa pagiging tuso. Dahil paratang ang konteksto, negatibo ang pangunahing salin, ngunit itinatala ang ibang posibleng himig.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang ‘pananalita’ sa halip na literal na ‘dila’ upang maging natural, at pinanatili ang ‘bibig’ upang mailarawan ang personipikasyon at poetic parallelism ng Hebreo.
