base_translation:
  language: en
  yaml_path: translation/ot/job/015/033.yaml
  text: He will shake off his unripe grapes like a vine[b][a], and cast off his blossom like an olive tree.
translation:
  language: tl
  text: Gaya ng punong ubas, tatanggalin niya ang kaniyang mga hilaw na ubas[a], at gaya ng punong olibo, ilalaglag niya ang kaniyang mga bulaklak.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sasamsamin niya ang kaniyang mga hilaw na ubas.” Karaniwang may mas marahas na diwa ang pandiwang Hebreo, gaya ng pananamsam o sapilitang pag-aalis; dito, ipinapakita ng larawang pang-agrikultura ang maagang pagkawala ng bunga.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַחְמֹס
  choice: tatanggalin
  rationale: Bagaman madalas na may diwang marahas o mapanamsam ang pandiwa, sa larawang pang-agrikultura rito ay tumutukoy ito sa sapilitang o maagang pag-aalis ng bungang hindi pa hinog. Pinananatili ng “tatanggalin” ang aktibong kilos nang hindi ginagawang abstrakto ang larawan.
- source_word: כַּגֶּפֶן
  choice: gaya ng punong ubas
  rationale: Likas at malinaw na tawag sa halamang ubas sa modernong Filipino, at pinananatili ang paghahambing na may כְּ.
- source_word: בִּסְרוֹ
  choice: ang kaniyang mga hilaw na ubas
  rationale: Ang בֹּסֶר ay mga ubas na hindi pa hinog. Ang “hilaw na ubas” ang pinakatuwirang karaniwang katumbas, at pinananatili ang panlalaking panghalip na tumutukoy sa taong inilalarawan.
- source_word: וְיַשְׁלֵךְ
  choice: at ilalaglag niya
  rationale: Ang Hiphil ng שלך ay aktibong ‘maghagis’ o ‘magpaalis.’ Sa konteksto ng mga bulaklak ng puno, natural sa Filipino ang “ilalaglag,” habang nananatili ang aktibong larawan ng maagang pagkawala.
- source_word: כַּזַּיִת
  choice: gaya ng punong olibo
  rationale: Sa paghahambing tungkol sa pagkalaglag ng bulaklak, malinaw na puno ang tinutukoy ng זית, kaya tahasang isinalin na “punong olibo.”
- source_word: נִצָּתוֹ
  choice: ang kaniyang mga bulaklak
  rationale: Ang pangngalan ay tumutukoy sa bulaklak o pamumulaklak ng halaman. Ang “mga bulaklak” ay natural at madaling maunawaan sa Filipino at angkop sa punong olibo.
theological_decisions: []
translation_notes:
  register: Makabagong Filipino na marangal at madaling maunawaan. Ginamit ang “kaniyang” upang malinaw na panatilihin ang personipikasyon at mga hulaping panghalip sa Hebreo. Ang ayos ng dalawang paghahambing ay bahagyang inayos para maging natural sa Filipino ngunit pinanatili ang paralelismo.
