base_translation:
  language: en
  yaml_path: translation/ot/job/015/024.yaml
  text: Distress and anguish terrify him[a]; they overpower him like a king ready for battle.
translation:
  language: tl
  text: Sinisindak siya ng kagipitan at matinding hirap; dinadaig siya ng mga ito gaya ng isang haring handa sa pagsalakay.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “handa sa labanan.” Bihira ang salitang Hebreo at maaaring tumukoy nang mas tiyak sa isang armadong pagsalakay o pag-atake.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְבַעֲתֻהוּ
  choice: Sinisindak siya
  rationale: Ipinahahayag ng Piel ang matinding pagsasanhi ng takot; natural at malakas sa modernong Tagalog ang “sinisindak.”
- source_word: צַר
  choice: kagipitan
  rationale: Tumutukoy sa makitid o mabigat na kalagayan, problema, at distress; ang “kagipitan” ay malinaw at akma sa pares na patula.
- source_word: מְצוּקָה
  choice: matinding hirap
  rationale: Nagsasaad ito ng matinding pressure, constraint, o anguish. Iniiwasan ng parirala ang di-natural na pag-uulit sa “kagipitan” habang pinananatili ang tindi.
- source_word: תִּתְקְפֵהוּ
  choice: dinadaig siya ng mga ito
  rationale: Ang pandiwa ay may diwang mananaig o mananaig nang may lakas. Bagaman pambabaeng isahan ang anyo nito, malinaw na ibinabalik ng konteksto ang diwa sa pinagsamang “kagipitan at matinding hirap”; nililinaw ito ng “mga ito.”
- source_word: כְּמֶלֶךְ
  choice: gaya ng isang hari
  rationale: Tuwirang pinananatili ang paghahambing at natural ang anyo sa Tagalog.
- source_word: עָתִיד
  choice: handa
  rationale: Sa konteksto, nangangahulugan itong nakahanda o nakaposisyon para sa susunod na pagkilos.
- source_word: לַכִּידוֹר
  choice: sa pagsalakay
  rationale: Bihira at hindi tiyak ang כידור, ngunit malamang na tumutukoy sa isang armadong pagsalakay o pakikipaglaban. Pinipili ng “pagsalakay” ang mas tiyak na posibleng diwang militar habang inilalahad sa talababa ang mas malawak na alternatibo.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Pinanatili ang matinding personipikasyon ng kagipitan at hirap, gayundin ang militar na paghahambing. Ang talababa ay nakakabit sa pariralang may bihira at hindi tiyak na salitang Hebreo.
