  yaml_path: translation/ot/job/015/008.yaml
  text: Have you listened in the council of God[a], and restricted wisdom to yourself?
translation:
  language: tl
  text: Nakinig ka ba sa kapulungan ng Diyos[a], at itinatangi mo ba para lamang sa sarili mo ang karunungan?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa lihim ng Diyos” o “sa lihim na pagsasanggunian ng Diyos.” Ang salitang Hebreo na סוֹד ay maaaring tumukoy sa isang pribadong kapulungan, malapit na lupon, o lihim na pag-uusap.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַ/בְ/סוֹד
  choice: sa kapulungan
  rationale: Ang סוֹד ay maaaring tumukoy sa isang pribado o malapit na lupon na nag-uusap at nagpapasya. Ang “kapulungan” ay nagpapanatili sa larawan ng pribilehiyadong pakikibahagi sa banal na pagpupulong, habang inilalahad sa talababa ang saklaw na “lihim” o “lihim na pagpupulong/pagsasanggunian.”
- source_word: אֱלוֹהַ
  choice: Diyos
  rationale: Karaniwan at likas na katumbas sa modernong Tagalog ng pang-isahang katawagan para sa Diyos na madalas gamitin sa Job.
- source_word: תִּשְׁמָע
  choice: Nakinig ka ba
  rationale: Maaaring mangahulugang “marinig” o “makinig” ang שׁמע. Sa konteksto ng isang kapulungan, mas malinaw na ipinahihiwatig ng “nakinig” ang sinasadyang pakikinig sa usapan.
- source_word: וְ/תִגְרַע אֵלֶיךָ חָכְמָה
  choice: at sa sarili mo lamang ba ang karunungan
  rationale: Ang גרע ay may diwang bawasan, ipagkait, o limitahan. Ang idyomatikong tanong sa Tagalog ay nagpapahayag ng eksklusibong pag-angkin o paglilimita ng karunungan sa kausap, nang hindi gumagamit ng mabigat at di-likas na pariralang “nililimitahan mo sa sarili mo.”
- source_word: חָכְמָה
  choice: karunungan
  rationale: Ito ang karaniwan at marangal na katumbas ng חָכְמָה, na rito ay tumutukoy sa karunungan o malalim na pagkaunawa sa pangkalahatan.
theological_decisions:
- issue: Kahulugan ng banal na סוֹד sa retorika ng Job
  choice: kapulungan ng Diyos
  alternative: lihim ng Diyos; lihim na pagsasanggunian ng Diyos
  rationale: Kinukutya ng tanong ang palagay na may natatanging pakikinig o pakikibahagi si Job sa panloob na usapan ng Diyos. Pinananatili ng “kapulungan” ang posibleng larawan ng isang banal na lupon, samantalang pinananatili ng talababa ang tunay na leksikal na kalabuan.
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran, marangal, at madaling maunawaan. Ginamit ang “sa sarili mo lamang ba ang karunungan” bilang natural na retorikal na tanong upang maipahayag ang eksklusibong paglilimita ng karunungan nang hindi pinapawi ang mapanuyang tono ni Elifaz.
