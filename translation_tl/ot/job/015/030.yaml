base_translation:
  language: en
  yaml_path: translation/ot/job/015/030.yaml
  text: He will not depart from darkness[a]; a flame will dry up his shoots[b], and by the breath of his mouth he will pass away.
translation:
  language: tl
  text: Hindi siya makaaalis sa kadiliman; tutuyuin ng liyab ang kanyang mga usbong,[a] at lilipas siya sa pamamagitan ng hininga ng kanyang bibig.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ang “mga usbong” ay larawan mula sa halaman: ang masamang tao ay inihahambing sa halamang ang sariwang tubo ay napapaso at natutuyo.'
    reason: cultural_note
  - marker: b
    text: Maaari ring unawain na lilipas siya “sa pamamagitan ng hininga ng bibig ng Diyos,” kung ang “kanyang” ay tumutukoy sa Diyos at hindi sa masamang tao.
    reason: alternative_reading
lexical_decisions:
- source_word: יָסוּר ... מִנִּי חֹשֶׁךְ
  choice: Hindi siya makaaalis sa kadiliman
  rationale: Ang סור na may מן ay nagpapahiwatig ng paglayo o pag-alis mula sa isang bagay. Ang “makaaalis” ay likas sa modernong Tagalog at ipinahihiwatig na hindi siya makaliligtas sa kadiliman o kapahamakan nang hindi ginagawang tahasang “makatakas” ang diwa.
- source_word: יֹנַקְתּוֹ
  choice: ang kanyang mga usbong
  rationale: Ang pangngalan ay tumutukoy sa sariwang usbong o suwi ng halaman. Pinananatili ng “mga usbong” ang larawang ang masama ay gaya ng halamang ang bagong tubo ay natutuyo.
- source_word: תְּיַבֵּשׁ שַׁלְהָבֶת
  choice: tutuyuin ng liyab
  rationale: Ang Piel ng יבש ay “tuyuin” o “palalantahin,” at ang שַׁלְהָבֶת ay liyab. Ang parirala ay malinaw at pinananatili ang larawan ng nakapapasong pagkawasak.
- source_word: וְיָסוּר
  choice: at lilipas siya
  rationale: Bagaman maaari itong literal na sabihing “aalis siya,” sa konteksto ay tumutukoy ito sa pagkawala o pagpanaw ng masamang tao. Ang “lilipas” ay natural ngunit hindi labis na nagpapaliwanag kung kamatayan o pag-aalis ang eksaktong tinutukoy.
- source_word: בְּרוּחַ פִּיו
  choice: sa hininga ng kanyang bibig
  rationale: Maaaring mangahulugan ang רוּחַ ng hininga, hangin, o espiritu. Kasama ng “bibig,” ang “hininga” ang pinakakongkretong kahulugan at pinananatili ang maaaring pahiwatig ng mapaminsalang bugso o salita.
- source_word: פִּיו
  choice: kanyang bibig
  rationale: Ang hulaping panlalaking isahan ay pinakamalapit na tumutukoy sa masamang taong inilalarawan. Gayunman, hindi tahasang tinutukoy ng Hebreo kung kanino ang bibig, kaya hindi nilagyan ng “sarili niyang,” at itinala sa talababa ang posibleng pagtukoy sa Diyos.
theological_decisions:
- issue: Ang tinutukoy ng “kanyang bibig” sa huling sugnay
  choice: Bibig ng masamang tao ang pinakamalapit na reperente sa balarila
  alternative: Bibig ng Diyos, anupat ang masamang tao ay lilipas dahil sa hininga ng bibig ng Diyos
  rationale: Patuloy na masamang tao ang panlalaking isahang paksa sa agarang konteksto, kaya iyon ang likas na pagbasa. Ngunit maaaring maglarawan ng hatol ng Diyos ang “hininga ng kanyang bibig”; pinananatili sa talababa ang teolohikal at sintaktikong tensiyon.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “makaaalis,” “liyab,” “mga usbong,” at “lilipas” upang mapanatili ang paralelismo at larawang patula nang hindi nagiging lipas o teknikal ang pananalita.
