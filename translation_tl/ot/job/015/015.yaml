  source_fidelity: 'Tapat ang salin sa Hebreo: naipapahayag ng “Masdan” ang mariing pantawag na הֵן; ang “hindi siya nagtitiwala kahit sa kanyang mga banal” ay tumutugon sa לֹא יַאֲמִין בִּקְדֹשָׁיו; at ang huling sugnay ay maayos na naghahatid ng larawan ng mga langit na hindi dalisay sa kanyang pagsusuri. Hindi nito labis na tinutukoy ang kahulugan ng “mga banal.”'
  naturalness: Natural at marangal ang daloy sa makabagong Filipino. Ang “kalangitan” ay katanggap-tanggap na kolektibong katumbas ng Hebreong pangmaramihang “mga langit,” at ang “sa kanyang paningin” ay malinaw at idiomatiko.
