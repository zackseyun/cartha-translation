id: JOB.15.15
reference: Job 15:15
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: הֵ֣ן ב/קדש/ו לֹ֣א יַאֲמִ֑ין וְ֝/שָׁמַ֗יִם לֹא זַכּ֥וּ בְ/עֵינָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/015/015.yaml
  text: Look[a], he puts no trust even in his holy ones, and the heavens are not pure in his eyes.
translation:
  language: tl
  text: Masdan[a], hindi siya nagtitiwala kahit sa kanyang mga banal, at ang kalangitan ay hindi dalisay sa kanyang paningin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Tunay nga.” Ang “kanyang mga banal” ay malamang na tumutukoy rito sa mga banal na nilalang sa langit.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Masdan
  rationale: Panawag ito ng mariing pansin. Ang “Masdan” ay marangal at malinaw sa makabagong Filipino nang hindi kasing-arkaiko ng ibang posibleng anyo.
- source_word: בִּקְדֹשָׁיו
  choice: sa kanyang mga banal
  rationale: Tuwirang pinananatili ang diwa ng “kanyang mga banal” at hindi tahasang nililimitahan sa mga anghel o sa mga banal na tao.
- source_word: לֹא יַאֲמִין
  choice: hindi siya nagtitiwala
  rationale: Ang Hiphil ng אמן dito ay tumutukoy sa paglalagak ng tiwala o kumpiyansa; natural itong ipinahahayag sa Filipino bilang “nagtitiwala.”
- source_word: וְשָׁמַיִם
  choice: at ang kalangitan
  rationale: Ang “kalangitan” ay natural na kolektibong katumbas ng Hebreong pangmaramihan at pinananatili ang makatang paralelismo.
- source_word: לֹא זַכּוּ
  choice: ay hindi dalisay
  rationale: Sa konteksto, ang pandiwa ay nagsasaad ng kadalisayan o kalinisan, hindi pangunahing legal na kawalang-sala.
- source_word: בְּעֵינָיו
  choice: sa kanyang paningin
  rationale: Natural na idyomang Filipino ito para sa literal na “sa kanyang mga mata,” at malinaw na tumutukoy sa kanyang pagsusuri.
theological_decisions:
- issue: Ang tinutukoy ng “kanyang mga banal”
  choice: Pinanatili sa pangunahing teksto ang malawak na katawagang “mga banal,” habang ipinapaliwanag sa talababa na malamang na mga nilalang sa langit ang tinutukoy.
  alternative: Tahasang isalin bilang “mga anghel” o unawain bilang mga banal na tao.
  rationale: Ang paralelismo sa “kalangitan” ay nagpapahiwatig ng mga makalangit na nilalang, ngunit hindi tahasang sinasabi ng Hebreo na “mga anghel”; kaya pinananatili ang tunay na lawak ng salita.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang makatang paralelismo at ang hindi ganap na tiyak na tinutukoy ng “mga banal.”
