source:
  edition: WLC
  text: אַ֭ף כִּֽי נִתְעָ֥ב וְֽ/נֶאֱלָ֑ח אִישׁ שֹׁתֶ֖ה כַ/מַּ֣יִם עַוְלָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/015/016.yaml
  text: how much less a man who is detestable and corrupt[b][a], who drinks injustice like water!
translation:
  language: tl
  text: gaano pa kaya ang kasuklam-suklam at tiwaling[a] tao, na umiinom ng kawalang-katarungan[b] na parang tubig!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “marumi” o “nadungisan.” Ang Hebreong נֶאֱלָח ay isang pambihirang salita na tumutukoy sa pagiging marumi, mabaho, o tiwali.
    reason: lexical_alternative
  - marker: b
    text: O “kasamaan” o “paggawa ng mali.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַף כִּי
  choice: gaano pa kaya
  rationale: 'Sa konteksto, ipinagpapatuloy ng idyoma ang paghahambing mula sa naunang talata: kung hindi dalisay sa harap ng Diyos ang kalangitan, lalo nang hindi ang tao. Likas sa Tagalog ang “gaano pa kaya” para sa ganitong pangangatwiran.'
- source_word: נִתְעָב
  choice: kasuklam-suklam
  rationale: Pinananatili nito ang matinding diwa ng pagiging karima-rimarim o kasuklam-suklam.
- source_word: נֶאֱלָח
  choice: tiwali
  rationale: Ang pambihirang salitang Hebreo ay tumutukoy sa pagiging marumi, bulok, o nadungisan. Malinaw na ipinahahayag ng “tiwali” ang moral na kabulukan nang hindi ito nililimitahan sa pisikal na karumihan.
- source_word: אִישׁ
  choice: tao
  rationale: Bagaman panlalaking isahan ang anyong Hebreo, ginagamit ito rito bilang kinatawan ng tao sa pangkalahatan. Ang “tao” ay likas sa Tagalog at hindi nag-aalis sa isahang anyo.
- source_word: שֹׁתֶה
  choice: na umiinom
  rationale: Isinasalin ang participle bilang sugnay na naglalarawan, habang pinananatili ang diwa ng nakagawian o patuloy na kilos.
- source_word: כַמַּיִם
  choice: na parang tubig
  rationale: Direktang pinananatili ang pagtutulad na nagpapahiwatig ng kadalian at pagiging nakagawian.
- source_word: עַוְלָה
  choice: kawalang-katarungan
  rationale: Saklaw nito ang diwa ng mali, kasamaan, at di-makatarungang asal, at malinaw ito sa modernong Tagalog.
theological_decisions:
- issue: Kinatawang panlalaking pananalita
  choice: tao
  alternative: isang lalaki
  rationale: Ang אִישׁ ay panlalaking isahan ngunit gumaganap dito bilang kinatawan ng sangkatauhan. Sa modernong Tagalog, ang “tao” ang pinakanatural na katumbas at nananatiling isahan nang hindi nagpapahiwatig na mga lalaki lamang ang tinutukoy.
- issue: Moral na katawagang עַוְלָה
  choice: kawalang-katarungan
  alternative: kasamaan; paggawa ng mali
  rationale: Pinananatili ng salin ang bigat ng moral at panlipunang kamalian nang hindi nag-aangkat ng mas makitid o makalumang katawagang teolohikal.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang matinding retorika ni Elifaz at ang larawang pag-inom sa kasamaan na parang tubig. Ang simula ay sadyang nakaugnay sa naunang talata at maaaring basahin bilang bahagi ng nagpapatuloy na pangungusap.
