  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: אֲשֶׁר חֲכָמִ֥ים יַגִּ֑ידוּ וְ/לֹ֥א כִֽ֝חֲד֗וּ מֵ/אֲבוֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/015/018.yaml
  text: what wise men declare[a], and have not hidden from their fathers—
translation:
  language: tl
  text: ang ipinahahayag ng mga pantas[a] at hindi nila ikinubli mula sa kanilang mga ninuno—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “ang hindi ikinubli ng kanilang mga ninuno,” o “at wala silang ikinubling tinanggap mula sa kanilang mga ninuno.” Pinahihintulutan ng Hebreo ang higit sa isang pagkaunawa sa kaugnayan ng “ikinubli” at “kanilang mga ninuno.”'
    reason: alternative_reading
lexical_decisions:
- source_word: אֲשֶׁר
  choice: ang
  rationale: Ipinakikilala nito ang nilalaman ng naunang pahayag; natural sa Filipino ang pagbuo ng sugnay na may “ang” sa halip na piliting tumbasan nang hiwalay ang panghalip na kaugnay.
- source_word: חֲכָמִים
  choice: mga pantas
  rationale: Tumutukoy sa mga taong kinikilalang marunong at tagapag-ingat ng minanang karunungan. Dignified at angkop sa panitikang pangkarunungan ang “mga pantas.”
- source_word: יַגִּידוּ
  choice: ipinahahayag
  rationale: Ang Hiphil ng נגד ay nangangahulugang ipaalam o ihayag. Pinananatili ng “ipinahahayag” ang marangal na tono at ang diwa ng hayagang paghahatid ng karunungan.
- source_word: וְלֹא
  choice: at hindi nila
  rationale: Malinaw na inuugnay at itinatanggi ang kasunod na kilos; idinagdag ang “nila” upang maging natural at malinaw ang paksa sa Filipino.
- source_word: כִחֲדוּ
  choice: ikinubli
  rationale: Tumpak na ipinahahayag ang diwa ng pagtatago o pagkukubli nang hindi ipinapasok ang mas tiyak na kahulugang “itinanggi.”
- source_word: מֵאֲבוֹתָם
  choice: mula sa kanilang mga ninuno
  rationale: Ang “mula sa” ay nagpapanatili sa payak na anyo ng Hebreong מִן, samantalang ang “mga ninuno” ay natural na tumutukoy sa mga naunang salinlahi, hindi lamang sa kani-kanilang ama. Sinasadyang hindi lubusang nilulutas ng pangunahing teksto ang kaugnayan nito sa pandiwang “ikinubli.”
theological_decisions:
- issue: Ugnayan ng מֵאֲבוֹתָם sa כִחֲדוּ
  choice: hindi nila ikinubli mula sa kanilang mga ninuno
  alternative: hindi ikinubli ng kanilang mga ninuno; wala silang ikinubling tinanggap mula sa kanilang mga ninuno
  rationale: 'Maikli at maaaring buuin sa higit sa isang paraan ang Hebreo: maaaring ang mga ninuno ang pinagmulan ng tradisyon, ang mga taong hindi pinagkublihan, o ang paksa ng ikalawang pandiwa. Pinananatili ng pangunahing teksto ang pormal na kalabuan, at inilalahad sa talababa ang ibang posibleng pagbasa.'
translation_notes:
  register: Modernong Filipino na marangal at angkop sa panitikang pangkarunungan. Ginamit ang “mga pantas” at “ikinubli” upang mapanatili ang mataas ngunit madaling maunawaang tono. Nananatili ang gitling sa hulihan dahil nagpapatuloy ang pangungusap sa susunod na talata.
