  source_fidelity: 'Tapat ang salin sa Hebreo: naipapahayag ang pautos na may pakiusap (זְכָר נָא), ang nilalamang sugnay na ipinakikilala ng כִּי, ang paghahambing sa כַחֹמֶר, at ang Hiphil na diwa ng תְּשִׁיבֵנִי. Ang retorikal na tanong sa ikalawang sugnay ay isang katanggap-tanggap na kontekstuwal na pagbasa, at ang alternatibong pagbasa bilang pahayag ay wastong inilaan sa talababa.'
