source:
  edition: WLC
  text: זְכָר נָ֭א כִּי כַ/חֹ֣מֶר עֲשִׂיתָ֑/נִי וְֽ/אֶל עָפָ֥ר תְּשִׁיבֵֽ/נִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/010/009.yaml
  text: Remember[a], please, that you made me like clay[b], and will you return me to dust?
translation:
  language: tl
  text: Alalahanin mo sana na ginawa mo akong gaya ng luwad[a]; at ibabalik mo ba ako sa alabok?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “bilang luwad.” Paghahambing ang ekspresyon sa Hebreo, hindi tahasang “mula sa luwad,” bagaman malinaw nitong ipinapaalaala ang larawan ng paglikha.
    reason: lexical_alternative
  - marker: b
    text: O “at ibabalik mo ako sa alabok.” Maaaring basahin ang anyong Hebreo bilang pahayag o, ayon sa konteksto, bilang retorikal na tanong.
    reason: alternative_reading
lexical_decisions:
- source_word: זְכָר נָא
  choice: Alalahanin mo sana
  rationale: Ang pautos na זְכָר ay tuwirang nakatuon sa Diyos, at ang נָא ay pakiusap na nagpapalumanay rito. Likas sa makabagong Tagalog ang “sana” sa ganitong pagsusumamo.
- source_word: כִּי
  choice: na
  rationale: Ipinakikilala nito ang nilalaman ng hinihiling ni Job na alalahanin ng Diyos.
- source_word: כַחֹמֶר
  choice: gaya ng luwad
  rationale: Ang unlaping כ־ ay naghahayag ng paghahambing, kaya pinananatili ang diwang “gaya ng,” sa halip na gawing tahasang “mula sa luwad.”
- source_word: עֲשִׂיתָנִי
  choice: ginawa mo ako
  rationale: Ang עשה ay pangkalahatang pandiwang “gumawa.” Tumpak at natural ang “ginawa,” nang hindi pinaiigting ang larawan sa mas tiyak na “hinubog.”
- source_word: עָפָר
  choice: alabok
  rationale: Karaniwang katumbas ito ng עָפָר sa mga konteksto ng paglikha at kamatayan, at likas nitong ipinahihiwatig ang pagbabalik ng tao sa alabok.
- source_word: תְּשִׁיבֵנִי
  choice: ibabalik mo ba ako
  rationale: Ang Hiphil ng שוב ay “pangyarihing bumalik” o “ibalik.” Ginawang retorikal na tanong sa pangunahing teksto upang maipahayag ang puwersa ng panaghoy, habang itinatala sa talababa ang posibleng pagbasa bilang pahayag.
theological_decisions:
- issue: Kung ang ikalawang sugnay ay pahayag o retorikal na tanong
  choice: 'Retorikal na tanong: “at ibabalik mo ba ako sa alabok?”'
  alternative: 'Pahayag: “at ibabalik mo ako sa alabok.”'
  rationale: Walang tahasang panandang pananong sa Hebreo, kaya tunay na posible ang dalawang pagbasa. Sa konteksto ng pagsusumamo at pagtutol ni Job, mahusay na naipahahayag ng retorikal na tanong ang puwersa ng panaghoy, ngunit hindi dapat ikubli ang alternatibong pagbasa.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “sana” bilang natural na pakiusap at pinanatili ang matinding tuwirang pakikipag-usap ni Job sa Diyos. Inilagay ang mga pananda ng talababa sa mismong mga bahaging tinutukoy ng mga ito.
