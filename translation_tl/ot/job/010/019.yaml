  register: Makabagong, marangal, at madaling maunawaang Filipino. Ginamit ang “sana” upang ihatid ang kontra-katotohanang paghahangad ni Job nang hindi dinaragdagan o nilulutas ang teolohikal na tensiyon ng pahayag.
