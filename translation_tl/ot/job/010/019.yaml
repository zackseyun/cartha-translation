base_translation:
  language: en
  yaml_path: translation/ot/job/010/019.yaml
  text: I would have been as though I had not been[b][a]; from the womb I would have been carried to the grave.
translation:
  language: tl
  text: Para sana akong hindi kailanman umiral; mula sa sinapupunan ay dinala sana ako sa libingan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: Para sana akong
  rationale: Ipinapahayag ng paghahambing ang isang kalagayang hindi nangyari; natural na naihahatid ng “para sana akong” ang diwang kontra-katotohanan sa Filipino.
- source_word: לֹא הָיִיתִי אֶהְיֶה
  choice: hindi kailanman umiral
  rationale: Sa konteksto, ang magkasunod na anyo ng היה ay nagsasaad ng hinahangad ngunit hindi totoong kalagayan. Nililinaw ng “hindi kailanman umiral” ang diwa ng pagiging wari'y hindi nagkaroon ng pag-iral, habang ang “sana” ang naghahatid ng diwang hindi nangyari.
- source_word: מִבֶּטֶן
  choice: mula sa sinapupunan
  rationale: Pinananatili nito ang kongkretong larawan ng Hebreo at ang tuwirang ugnayan ng kapanganakan at kamatayan.
- source_word: לַקֶּבֶר
  choice: sa libingan
  rationale: Ang קֶבֶר ay libingan o lugar ng paglilibing, hindi Sheol bilang daigdig ng mga patay. Ang “libingan” ang natural at tumpak na katumbas.
- source_word: אוּבָל
  choice: dinala sana ako
  rationale: Ang Hophal ng יבל ay pasibong “dinala/inihatid.” Ang “dinala sana ako” ay likas sa Filipino at pinananatili ang larawan ng tuwirang pagdadala mula sa sinapupunan tungo sa libingan.
theological_decisions: []
