  source_fidelity: 'Tapat ang salin sa Hebreo: ang “Para sana akong hindi kailanman umiral” ay naihahatid ang kontra-katotohanang paghahambing ng כַּאֲשֶׁר לֹא הָיִיתִי אֶהְיֶה, at ang “mula sa sinapupunan ay dinala sana ako sa libingan” ay pinananatili ang larawan at pasibong diwa ng מִבֶּטֶן לַקֶּבֶר אוּבָל. Hindi nito ipinagpapalit ang קֶבֶר sa Sheol.'
