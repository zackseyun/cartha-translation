  text: Yet these things you hid in your heart[b][a]; I knew that this was with you.
translation:
  language: tl
  text: Ngunit itinago mo sa iyong puso ang mga bagay na ito[a]; alam kong nasa iyo ito.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “inimpok mo sa iyong puso ang mga bagay na ito.” Ang pandiwang Hebreo ay maaaring mangahulugang “itago,” “impukin,” o “panatilihing nakalaan.”
    reason: lexical_alternative
  - marker: b
    text: Ang “nasa iyo ito” ay maaari ring mangahulugang “ito ay nasa isip mo” o “bahagi ito ng iyong lihim na layunin.”
    reason: alternative_reading
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Ngunit ... ang mga bagay na ito
  rationale: Maaaring simpleng mangahulugang “at” ang וְ, ngunit ang konteksto ay lumilipat mula sa kabutihang binanggit sa naunang talata tungo sa nakatagong layunin; natural na ipinahahayag ng “ngunit” ang bahagyang pagsalungat nang hindi nilalabis ang pagpapakahulugan.
- source_word: צָפַנְתָּ
  choice: itinago mo
  rationale: Ang צפן ay maaaring mangahulugang itago, impukin, o ilaan. Ang “itinago mo” ay akma sa konteksto ng isang layuning hindi hayag, habang iniiwan sa talababa ang alternatibong diwa.
- source_word: בִלְבָבֶךָ
  choice: sa iyong puso
  rationale: Ang לֵבָב ay tumutukoy sa puso bilang kalooban, isip, o panloob na sarili. Pinananatili ng salin ang Hebreong talinghaga sa natural na Tagalog.
- source_word: יָדַעְתִּי
  choice: alam ko
  rationale: Bagaman anyong qatal ang pandiwa at maaaring isaling “nalaman ko” o “alam ko,” ang “alam ko” ang mas natural na pahayag sa Tagalog para sa katiyakang ipinahahayag ni Job sa kasalukuyang pananalita.
- source_word: כִּי
  choice: -ng
  rationale: Ipinakikilala ng כִּי ang nilalaman ng nalalaman ni Job. Sa Tagalog, natural itong ipinapahayag ng pang-angkop sa “alam kong.”
- source_word: זֹאת
  choice: ito
  rationale: Pinananatili ng isahang demonstratibo ang malabong kolektibong pagtukoy ng Hebreo sa nakatagong bagay o layuning nauna nang binanggit.
- source_word: עִמָּךְ
  choice: ay nasa iyo
  rationale: Literal itong “kasama mo,” ngunit sa Tagalog ang “nasa iyo” ay mas natural para sa isang bagay o layuning taglay ng Diyos, nang hindi tahasang nililimitahan ito sa isip o lihim na plano.
theological_decisions:
- issue: Ang likas at tinutukoy ng nakatagong layunin ng Diyos sa sinabi ni Job
  choice: Panatilihing malabo ang tinutukoy ng “ito” at ihayag ang reklamo ni Job tungkol sa isang bagay na itinago sa puso ng Diyos.
  alternative: Tukuyin ang “ito” bilang lihim na plano ng Diyos na pahirapan si Job, o bilang mga pagpapalang binanggit sa naunang talata.
  rationale: Hindi tahasang nililinaw ng Hebreo kung ano ang tinutukoy ng זֹאת. Pinananatili ng salin ang tensiyon sa reklamo ni Job at hindi nagdaragdag ng mas tiyak na doktrinal na paliwanag.
translation_notes:
  register: Makabago at marangal na Filipino; pinanatili ang matalinghagang “puso” at ang sadyang kalabuan ng “ito ay nasa iyo.”
