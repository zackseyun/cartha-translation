base_translation:
  language: en
  yaml_path: translation/ot/job/010/005.yaml
  text: Are your days like the days of man[b][a], or your years like the days of a mighty man?
translation:
  language: tl
  text: 'Ang mga araw mo ba ay gaya ng mga araw ng tao,[a]

    o ang mga taon mo ay gaya ng mga araw ng isang malakas na lalaki?[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “isang mortal.” Ang אֱנוֹשׁ ay maaaring magdiin sa kahinaan at pagiging mortal ng tao.
    reason: lexical_alternative
  - marker: b
    text: Ang גָבֶר ay maaari ring isalin na “lalaki” o “makapangyarihang lalaki.” Ginamit ang “malakas na lalaki” upang mapanatili ang pagkakaiba nito sa אֱנוֹשׁ sa unang linya.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲכִימֵי
  choice: Ang mga araw mo ba ay gaya ng mga araw ng
  rationale: Ipinahahayag ng pantanong na הֲ at paghahambing na כִּ ang isang retorikal na tanong. Likas sa modernong Tagalog ang hulma na “ba ay gaya ng.”
- source_word: אֱנוֹשׁ
  choice: tao
  rationale: Tumutukoy ito sa isang taong may hangganan at mahina bilang nilalang. Pinananatili ng “tao” ang malawak na kinatawang diwa, habang inilalahad sa talababa ang posibleng diin sa pagiging mortal.
- source_word: יָמֶיךָ
  choice: mga araw mo
  rationale: Tuwirang salin ng pangmaramihang pangngalan na may hulaping ikalawang panauhang panlalaki, na tumutukoy sa Diyos sa retorikal na tanong ni Job.
- source_word: אִם
  choice: o
  rationale: Sa paralelismong patula, ipinakikilala nito ang ikalawang paghahambing, hindi isang kondisyong sugnay.
- source_word: שְׁנוֹתֶיךָ
  choice: mga taon mo
  rationale: Tuwirang salin na katambal ng “mga araw mo” sa ikalawang linya.
- source_word: כִּימֵי
  choice: gaya ng mga araw ng
  rationale: Inuulit nito ang paghahambing ng unang linya at isinalin nang pareho upang mapanatili ang paralelismo.
- source_word: גָבֶר
  choice: isang malakas na lalaki
  rationale: Maaaring tumukoy ang גָבֶר sa isang lalaki na may diin sa lakas o sigla. Pinananatili ng saling ito ang pagkakaiba nito sa אֱנוֹשׁ nang hindi ito nililimitahan sa kahulugang “mandirigma.”
theological_decisions:
- issue: Ang paghahambing ng haba ng buhay ng Diyos sa buhay ng tao
  choice: Pinanatili bilang retorikal na tanong nang walang idinagdag na paliwanag
  alternative: Tahasan itong ipaliwanag bilang pagtanggi na may hangganan ang Diyos
  rationale: Ipinahihiwatig ng tanong ang kaibahan ng Diyos at ng taong may hangganan, ngunit hindi ito tahasang sinasagot sa talata; pinananatili ng salin ang anyo at tensiyon ng Hebreo.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang dalawang linyang paralelismo at ang retorikal na tanong; iniwasan ang lipas o labis na teknikal na pananalita.
