base_translation:
  language: en
  yaml_path: translation/ot/job/010/015.yaml
  text: If I am wicked[a], woe to me! Even if I am righteous, I cannot lift up my head, filled with disgrace and looking on my affliction.
translation:
  language: tl
  text: Kung ako’y masama, sa aba ko! Kahit matuwid ako, hindi ko maitataas ang aking ulo, puspos ng kahihiyan at tinitingnan ang aking paghihirap.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “at tingnan mo ang aking paghihirap” o “masdan ang aking paghihirap.” Mahirap ang pagkakabuo ng Hebreo rito; itinuturing ito ng ilan na tuwirang pakiusap ni Job sa Diyos sa halip na bahagi ng paglalarawan niya sa sarili.'
    reason: alternative_reading
lexical_decisions:
- source_word: אִם רָשַׁעְתִּי
  choice: Kung ako ay masama
  rationale: Pinananatili nito ang kondisyunal na panaghoy at ang moral na diwa ng רשע, kasabay ng pagkakatugma sa kasunod na 'matuwid.'
- source_word: אַלְלַי לִי
  choice: kaawa-awa ako
  rationale: Likas at makabagong sigaw ng panaghoy sa Filipino na naghahatid ng bigat ng 'sa aba ko' nang hindi masyadong makaluma.
- source_word: וְצָדַקְתִּי
  choice: Kahit matuwid ako
  rationale: Ipinahahayag ng 'kahit' ang konsesibong pagsalungat sa naunang sugnay; pinananatili ng 'matuwid' ang moral at hudisyal na saklaw ng צדק.
- source_word: לֹא אֶשָּׂא רֹאשִׁי
  choice: hindi ko maitataas ang aking ulo
  rationale: Inilalarawan ng idyoma ang kawalan ng kakayahang humarap nang may dangal o tiwala; natural ito sa Filipino at hindi ginagawang tahasang kusang pagtanggi ang pahayag.
- source_word: שְׂבַע קָלוֹן
  choice: puspos ako ng kahihiyan
  rationale: Ang שְׂבַע ay nagsasaad ng pagiging punô o lipos, at ang 'kahihiyan' ay malinaw na naghahatid ng pagkapahiya at pagkawala ng dangal sa publiko.
- source_word: וּרְאֵה עָנְיִי
  choice: at nakatitig sa aking paghihirap
  rationale: Pinananatili ang pandiwang diwa bilang pagpapatuloy ng kalagayan ni Job, habang hindi ganap na ikinukubli ang sintaktikong hirap ng Hebreo; ang alternatibong tuwirang pakiusap sa Diyos ay inilalagay sa talababa.
theological_decisions:
- issue: Pagpapakahulugan sa וּרְאֵה עָנְיִי
  choice: 'Pagpapatuloy ng paglalarawan ni Job sa sarili: ''at nakatitig sa aking paghihirap.'''
  alternative: 'Tuwirang pakiusap sa Diyos: ''at tingnan mo ang aking paghihirap,'' o padamdam na ''masdan ang aking paghihirap.'''
  rationale: Mahirap ang sintaks at maaaring ipakahulugan sa higit sa isang paraan. Ang pangunahing salin ay sumusunod sa daloy ng paglalarawan sa kalagayan ni Job, ngunit hayagang pinananatili sa talababa ang posibilidad ng biglang tuwirang pakiusap sa Diyos.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang 'kaawa-awa ako' sa halip na mas makalumang 'sa aba ko,' at pinanatili ang tensiyon at kalabuan ng huling parirala sa pamamagitan ng talababa.
