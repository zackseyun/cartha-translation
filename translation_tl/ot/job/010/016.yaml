  yaml_path: translation/ot/job/010/016.yaml
  text: If I lift myself up[a], you hunt me like a lion[b], and again you show yourself wonderful against me.
translation:
  language: tl
  text: Kung mag-angat man ako ng ulo[a], tinutugis mo ako na parang leon, at muli mong ipinakikitang kamangha-mangha ka laban sa akin.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mahirap at eliptikal ang Hebreo. Maaari rin itong unawain na “At kung ito’y tumataas” o “Kung ako’y itinataas.” Ang “ulo” ay ipinahihiwatig ng naunang konteksto.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin, “at muli kang kumikilos nang pambihira laban sa akin.” Ang Hebreo ay maaaring tumukoy sa pagpapakitang kamangha-mangha ang sarili o sa paggawa ng pambihirang bagay; dito ay nasa konteksto ito ng pagdurusa ni Job.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִגְאֶה
  choice: Kung ako'y magmataas
  rationale: Ang pandiwa ay nasa ikatlong panauhang panlalaki ngunit eliptikal ang Hebreo. Ipinahihiwatig ng konteksto ang unang panauhan at ang kondisyong diwa; pinananatili sa talababa ang tunay na kalabuan.
- source_word: כַּשַּׁחַל
  choice: na parang leon
  rationale: Ang שַׁחַל ay tumutukoy sa leon, na may pahiwatig ng lakas o bangis; hindi na kailangang dagdagan ng tahasang pang-uri.
- source_word: תְּצוּדֵנִי
  choice: tinutugis mo ako
  rationale: Ang צוד ay pangangaso o paghabol sa isang nilalang na parang biktima. Likas sa Filipino ang 'tinutugis' at malinaw nitong pinananatili ang mapanilang larawan.
- source_word: וְתָשֹׁב
  choice: at muli
  rationale: Bagaman literal na 'bumalik,' dito ay nagpapahiwatig ito ng inuulit na pagkilos.
- source_word: תִּתְפַּלָּא
  choice: gumagawa ng kamangha-mangha
  rationale: Ang hitpael ng פלא ay maaaring tumukoy sa pagpapakitang kamangha-mangha o paggawa ng pambihirang bagay. Pinananatili ng salin ang pambihirang pagkilos nang hindi ito ginagawang positibong papuri.
- source_word: בִי
  choice: laban sa akin
  rationale: Sa konteksto ng paghihirap at pag-uusig, ang בִי ay likas na nauunawaang pagkilos na nakatuon laban kay Job.
theological_decisions:
- issue: Ang פלא bilang paglalarawan sa pagkilos ng Diyos sa konteksto ng pagdurusa
  choice: gumagawa ng kamangha-mangha laban sa akin
  alternative: ipinapakita mong kamangha-mangha ka laban sa akin
  rationale: Pinananatili ang tensiyon sa pagitan ng pambihira at kahanga-hangang kapangyarihan ng Diyos at ng pagdama ni Job na iyon ay nakatuon laban sa kanya. Hindi ito nilulutas bilang positibong kababalaghan lamang o pinapapayak bilang marahas na pagsalakay.
translation_notes:
  register: Makabago at marangal na Filipino. Ginamit ang “ako'y” para sa bahagyang makatang himig ng Job, samantalang nananatiling malinaw sa karaniwang mambabasa. Ang “gumagawa ng kamangha-mangha laban sa akin” ay sadyang nagpapanatili sa di-pangkaraniwang tensiyon ng orihinal.
