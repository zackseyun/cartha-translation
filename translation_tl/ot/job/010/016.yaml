  naturalness: Mas natural sa makabagong Filipino ang “Kung mag-angat man ako ng ulo” kaysa “Kung ako’y magmataas,” at ang “ipinakikitang kamangha-mangha ka” ay mas idiomatiko at mas malapit sa reflexive force kaysa “gumagawa ng kamangha-mangha.”
  terminology: 'Pinanatili ang “leon,” “tinutugis,” at “laban sa akin.” Ang “kamangha-mangha” ay nananatiling may sinadyang tensiyon: paglalarawan ito ng pambihirang pagkilos ng Diyos sa loob ng reklamo ni Job, hindi simpleng positibong papuri.'
