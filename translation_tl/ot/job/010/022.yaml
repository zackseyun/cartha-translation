  text: a land of gloom[a], like deep darkness, of the shadow of death and without order, where it shines like deep darkness.
translation:
  language: tl
  text: 'isang lupain ng karimlan, gaya ng pusikit na dilim,

    ng lilim ng kamatayan[a] at walang kaayusan,

    at kumikislap na parang pusikit na dilim.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “malalim na anino.” Ang salitang Hebreo na צַלְמָוֶת ay maaaring tumukoy sa lilim na kaugnay ng kamatayan o, sa mas pangkalahatan, sa napakatinding dilim.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶרֶץ
  choice: lupain
  rationale: Inilalarawan dito ang isang dako o nasasakupan, kaya mas angkop ang “lupain” kaysa sa mas malawak na “lupa” o “daigdig.”
- source_word: עֵיפָתָה
  choice: ng karimlan
  rationale: Ipinahihiwatig ng salita ang matinding dilim o pangungulimlim. Dignified at likas sa konteksto ng tuloy-tuloy na larawan ng kadiliman ang “karimlan.”
- source_word: כְּמוֹ אֹפֶל
  choice: gaya ng pusikit na dilim
  rationale: Ang אֹפֶל ay tumutukoy sa makapal o napakatinding dilim. Pinananatili rin ang pag-uulit ng parirala sa hulihan ng talata.
- source_word: צַלְמָוֶת
  choice: lilim ng kamatayan
  rationale: Pinananatili nito ang posibleng kaugnayan sa kamatayan at ang matandang matalinghagang larawan, habang inilalahad sa talababa ang posibilidad na ang salita ay tumukoy lamang sa napakatinding dilim.
- source_word: וְלֹא סְדָרִים
  choice: at walang kaayusan
  rationale: Tuwirang ipinapahayag nito ang kawalan ng ayos o pagkakasunud-sunod at natural itong pakinggan sa makabagong Filipino.
- source_word: וַתֹּפַע
  choice: kung saan ang liwanag nito ay
  rationale: Ang pandiwa ay nangangahulugang “sumikat” o “magliwanag.” Ang pagkakabuo ay natural sa Filipino at pinananatili ang kabalintunaang maging ang liwanag ng lupaing iyon ay tila pusikit na dilim.
theological_decisions:
- issue: Kung ang צַלְמָוֶת ay tiyak na tumutukoy sa kamatayan o pangkalahatang napakatinding dilim
  choice: lilim ng kamatayan
  alternative: pusikit na dilim / malalim na anino
  rationale: Kapuwa posible ayon sa gamit at pagbuo ng salitang Hebreo. Pinanatili sa pangunahing teksto ang kaugnayan sa kamatayan, ngunit hindi ipinagkait ang mas pangkalahatang kahulugan sa talababa.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “karimlan” at “pusikit na dilim” upang maiba ang magkakaugnay na mga salitang Hebreo at mapanatili ang tumitinding larawan ng kadiliman. Ang huling linya ay sadyang nagpapanatili sa kabalintunaan ng liwanag na parang dilim.
