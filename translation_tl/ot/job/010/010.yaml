  text: Did you not pour me out like milk and curdle me like cheese?[a]
translation:
  language: tl
  text: Hindi mo ba ako ibinuhos na parang gatas at pinamuo na parang keso?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pinamuo na parang namuong gatas.” Ang salitang Hebreo ay maaaring isalin nang mas tiyak na “keso” o, sa mas malawak na kahulugan, bilang produktong gatas na namuo.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: Hindi ba't
  rationale: Naghuhudyat ng retorikal na tanong na umaasang sasang-ayon ang kausap; likas at tuwiran ito sa modernong Tagalog.
- source_word: כֶחָלָב
  choice: parang gatas
  rationale: Pinananatili ang paghahambing na ipinahihiwatig ng prefixed כ sa natural na Tagalog.
- source_word: תַּתִּיכֵנִי
  choice: ibinuhos mo ako
  rationale: Ang Hiphil ng נתך ay naglalarawan ng pagbubuhos ng likido; ang anyong pangnagdaan ay angkop sa paggunita ni Job sa paghubog sa kaniya.
- source_word: וְכַגְּבִנָּה
  choice: at ... na parang keso
  rationale: Pinananatili ang ikalawang paghahambing at ang payak na kahulugan ng גְּבִנָּה bilang keso.
- source_word: תַּקְפִּיאַנִי
  choice: pinamuo
  rationale: 'Ang Hiphil ng קפא ay causative: pinatigas o pinamuo. Ang ''pinamuo'' ay natural sa Tagalog para sa prosesong inilalarawan at hindi nangangailangan ng dagdag na layon.'
theological_decisions: []
translation_notes:
  register: Makabago, dignificado, at madaling maunawaang Tagalog. Pinanatili ang matingkad na metapora ng gatas na namumuo bilang keso at ang retorikal na tanong. Ginamit ang enclitic na “ba't” para sa likas na daloy nang hindi binabawasan ang diin.
