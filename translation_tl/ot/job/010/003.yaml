base_translation:
  language: en
  yaml_path: translation/ot/job/010/003.yaml
  text: Is it good for you that you oppress[a], that you despise the work of your hands, and shine upon the counsel of the wicked?
translation:
  language: tl
  text: Mabuti ba para sa iyo na mang-api ka, na hamakin mo ang gawa ng iyong mga kamay, at liwanagan mo ang balak ng masasama?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pagpakitaan mo ng pabor ang balak ng masasama.” Literal na tumutukoy ang pandiwang Hebreo sa pagsikat o pagliwanag, ngunit dito ay malamang na nagpapahiwatig ng pagsang-ayon o pabor.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲטוֹב לְךָ
  choice: Mabuti ba para sa iyo
  rationale: Pinananatili ang tuwirang retorikal na tanong at ang diwa ng pagiging mabuti o angkop para sa Diyos, sa halip na ipakahulugang agad na ‘nalulugod ka ba.’
- source_word: תַעֲשֹׁק
  choice: ikaw ay mang-api
  rationale: Ang pandiwa ay tumutukoy sa pang-aapi o paggawa ng kawalang-katarungan; malinaw at matindi ang ‘mang-api’ sa makabagong Tagalog.
- source_word: תִמְאַס
  choice: hamakin mo
  rationale: Ipinahahayag ng מָאַס ang pagtanggi na may paghamak; pinananatili ng ‘hamakin’ ang matinding pananalita ni Job.
- source_word: יְגִיעַ כַּפֶּיךָ
  choice: ang gawa ng iyong mga kamay
  rationale: Natural na tumutukoy sa nilikha o ginawa ng Diyos habang nananatiling malapit sa konkretong larawan ng Hebreo.
- source_word: עֲצַת רְשָׁעִים
  choice: ang balak ng masasama
  rationale: Maaaring mangahulugan ang עֵצָה ng payo, balak, o layunin. Sa konteksto, natural ang ‘balak’ at hindi nito ipinapalagay na payong ibinigay sa Diyos.
- source_word: הוֹפָעְתָּ
  choice: paliwanagan mo
  rationale: Pinananatili ang pangunahing larawang ‘sumikat/lumiwanag sa ibabaw’ ng Hiphil ng יָפַע, habang inilalagay sa talababa ang malamang na idyomatikong diwang pagpapakita ng pabor.
theological_decisions:
- issue: Tuwirang paratang ni Job laban sa Diyos
  choice: Pinanatili ang matalas na retorikal na tanong at ang mga pandiwang ‘mang-api’ at ‘hamakin.’
  alternative: ‘Magmistulang nang-aapi’ o iba pang paglambot sa paratang.
  rationale: Tuwiran at mapanghamon ang Hebreo. Ang paglambot dito ay mag-aalis sa tunay na tensiyong teolohikal ng panaghoy ni Job.
- issue: Metapora ng pagliwanag sa balak ng masasama
  choice: Pinanatili sa pangunahing teksto ang metaporang ‘paliwanagan.’
  alternative: ‘Pagpakitaan mo ng pabor ang balak ng masasama.’
  rationale: Ang literal na larawan ng pandiwa ay pagliwanag o pagsikat, ngunit sa konteksto ay maaari itong magpahiwatig ng pagsang-ayon o pabor; inilalahad ang interpretasyong iyon sa talababa nang hindi isinasara ang ambiguwidad.
translation_notes:
  register: Makabago ngunit marangal na Tagalog. Pinanatili ang tuwirang pakikipagtalo ni Job sa Diyos at ang metapora ng pagliwanag. Ang marker na [a] ay inilagay sa pangunahing teksto.
