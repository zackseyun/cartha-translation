  text: May mga mata ka bang gawa sa laman, o nakakakita ka ba gaya ng isang tao?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Hebreo na אֱנוֹשׁ ay pangkalahatang tawag sa isang tao at madalas na may pahiwatig ng pagiging mortal o mahina.
