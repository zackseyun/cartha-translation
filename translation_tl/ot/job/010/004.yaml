lexical_decisions:
- source_word: הַעֵינֵי בָשָׂר לָךְ
  choice: Ang mga mata mo ba ay mga mata ng laman
  rationale: Pinananatili ang konkretong larawang “mga mata ng laman” at ipinahahayag sa likas na anyong patanong sa Filipino ang Hebreong sugnay na walang hayag na pandiwa.
- source_word: אִם
  choice: o
  rationale: Ipinakikilala rito ng אִם ang ikalawang bahagi ng retorikal na tanong, hindi isang kondisyong “kung.”
- source_word: כִּרְאוֹת אֱנוֹשׁ תִּרְאֶה
  choice: o nakakakita ka ba gaya ng isang tao
  rationale: Isinasalin ang paghahambing na כִּרְאוֹת sa natural na “gaya ng,” habang pinananatili ng “nakakakita” ang ugnayan sa larawan ng mga mata.
- source_word: אֱנוֹשׁ
  choice: isang tao
  rationale: Ang pangngalan ay tumutukoy sa isang tao bilang kinatawan ng sangkatauhan at maaari ring magpahiwatig ng pagiging mortal o mahina; hindi idinagdag sa pangunahing teksto ang pahiwatig na iyon upang maiwasan ang labis na pagpapakahulugan.
theological_decisions:
- issue: Antropomorpikong paglalarawan sa paraan ng pagtingin ng Diyos
  choice: Panatilihin ang retorikal na paghahambing sa “mga mata ng laman” at pagkakita ng tao
  alternative: Ipaliwanag bilang “Humahatol ka ba ayon sa panlabas na anyo gaya ng tao?”
  rationale: Konkretong inihahambing ng Hebreo ang paningin ng Diyos sa paninging nakatali sa katawang-tao. Ang pagpapanatili sa larawan ay hindi agad nagpapasya kung ano ang buong implikasyong teolohikal nito.
- issue: Pangkalahatang isahan na אֱנוֹשׁ
  choice: isang tao
  alternative: sangkatauhan; mga mortal
  rationale: Pinananatili ng “isang tao” ang isahang anyo at pangkalahatang diwa nang hindi pinaiigting sa pangunahing teksto ang pahiwatig ng pagiging mortal.
translation_notes:
  register: Makabago at marangal na Filipino. Sadyang pinanatili ang bahagyang di-karaniwang larawang “mga mata ng laman” dahil mahalaga ito sa retorikal na paghahambing ng talata.
