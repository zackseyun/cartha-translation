  text: before I go—and do not return—to the land of darkness and deep shadow,[a]
translation:
  language: tl
  text: Bago ako pumunta sa lupain ng kadiliman at ng pusikit na dilim, na hindi ko na babalikan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, ayon sa tradisyonal na salin, “sa lupain ng kadiliman at ng anino ng kamatayan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּטֶרֶם
  choice: bago
  rationale: Likas na panandang pamanahon sa Filipino at tuwirang nagpapakilala sa sugnay na “bago ako pumunta.”
- source_word: אֵלֵךְ
  choice: ako pumunta
  rationale: Pinananatili ang payak na diwa ng הלך na “pumunta” nang hindi tahasang ginagawang “mamatay,” bagaman iyon ang ipinahihiwatig ng konteksto.
- source_word: וְלֹא אָשׁוּב
  choice: at hindi na bumalik
  rationale: Ang “bumalik” ang tuwirang katumbas ng שׁוב. Ang “na” ay natural sa Filipino para sa hindi na muling pagbabalik na ipinahihiwatig ng konteksto, nang hindi gumagamit ng mas mariing “kailanman.”
- source_word: אֶל
  choice: sa
  rationale: Karaniwang panandang patungo sa isang lugar sa pariralang “pumunta sa lupain.”
- source_word: אֶרֶץ
  choice: lupain
  rationale: Tumutukoy rito sa isang dako o kaharian, hindi sa buong mundo; ang “lupain” ay angkop sa marangal at patulang rehistro.
- source_word: חֹשֶׁךְ
  choice: kadiliman
  rationale: Tuwirang katumbas ng pangunahing kahulugang “darkness” at natural sa patulang Filipino.
- source_word: צַלְמָוֶת
  choice: pusikit na dilim
  rationale: Ipinahahayag ang matindi at malalim na dilim nang hindi sapilitang inilalagay ang “kamatayan” sa pangunahing teksto; ang tradisyonal na pagbasa ay inilalahad sa talababa.
theological_decisions:
- issue: Pagpapakahulugan sa צַלְמָוֶת sa konteksto ng kamatayan
  choice: pusikit na dilim
  alternative: anino ng kamatayan
  rationale: Maaaring tumukoy ang salitang Hebreo sa napakatinding dilim o, ayon sa tradisyonal na pagsusuri, sa “anino ng kamatayan.” Pinananatili ng pangunahing salin ang patulang parallelismo at hindi nilulutas nang palihim ang usaping leksikal; nasa talababa ang tradisyonal na alternatibo.
translation_notes:
  register: Makabago, marangal, at patulang Filipino. Pinanatili ang daloy ng Hebreo sa pamamagitan ng mga gitling, at iniwasang tahasang isalin ang pagpunta bilang kamatayan.
