  register: Makabago ngunit marangal na Tagalog. Pinanatili ang “kaluluwa” at “kapaitan” upang maingatan ang pag-uulit, metapora, at emosyonal na tindi ng Hebreo; ginamit ang “hinaing” at “kumawala” para sa natural at madaling maunawaang pagpapahayag.
