source:
  edition: WLC
  text: נָֽקְטָ֥ה נַפְשִׁ֗/י בְּ/חַ֫יָּ֥/י אֶֽעֶזְבָ֣ה עָלַ֣/י שִׂיחִ֑/י אֲ֝דַבְּרָה֗ בְּ/מַ֣ר נַפְשִֽׁ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/job/010/001.yaml
  text: My soul loathes my life[a]; I will give free course to my complaint[b]; I will speak in the bitterness of my soul.
translation:
  language: tl
  text: Kinasusuklaman ng aking kaluluwa ang aking buhay[a]. Hahayaan kong kumawala ang aking hinaing[b]; magsasalita ako sa kapaitan ng aking kaluluwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Pagod na ang aking kaluluwa sa aking buhay.” Maaaring magpahayag ang pandiwang Hebreo ng matinding pagkasawa o pagkapagod, gayundin ng pagkasuklam.
    reason: lexical_alternative
  - marker: b
    text: O “Hindi ko na pipigilin ang aking hinaing.” Ipinahihiwatig ng idyomang Hebreo na hindi na sasawatahin ni Job ang kanyang panaghoy.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָקְטָה
  choice: kinasusuklaman
  rationale: Ipinahahayag ng pandiwa ang matinding pagkayamot o pagkapagod na umaabot sa pagkasuklam. Pinananatili ng “kinasusuklaman” ang lakas ng damdamin, habang inilalahad sa talababa ang posibleng diwang “pagod na.”
- source_word: נַפְשִׁי
  choice: aking kaluluwa
  rationale: Tumutukoy rito ang נֶפֶשׁ sa panloob na sarili o buong buhay na persona ni Job. Pinananatili ang “kaluluwa” sa dalawang paglitaw upang mapanatili ang pag-uulit at tindi ng Hebreo.
- source_word: בְּחַיָּי
  choice: ang aking buhay
  rationale: Sa pariralang ito, ang buhay ni Job ang pinagtutuunan ng kanyang pagkasuklam. Ang “aking buhay” ang natural at malinaw na katumbas sa Tagalog.
- source_word: אֶעֶזְבָה
  choice: hahayaan kong kumawala
  rationale: Bagaman karaniwang nangangahulugang “iwan,” sa idyomang ito ipinahihiwatig nito ang hindi na pagpigil o pagsikil sa hinaing. Ang “hahayaan kong kumawala” ay nagpapanatili sa larawan ng pagpapalaya.
- source_word: שִׂיחִי
  choice: aking hinaing
  rationale: Sa konteksto ng panaghoy ni Job, ang salita ay tumutukoy sa malungkot at naghihinanakit na pagsasalita, hindi sa payak na pagbubulay. Natural sa Tagalog ang “hinaing.”
- source_word: אֲדַבְּרָה
  choice: magsasalita ako
  rationale: Ang anyong cohortative ay nagpapahayag ng matibay na pasiya; malinaw itong naihahatid ng “magsasalita ako.”
- source_word: בְּמַר נַפְשִׁי
  choice: sa kapaitan ng aking kaluluwa
  rationale: Pinananatili nito ang metapora at ang saklaw ng damdaming pinagmumulan o kinalalagyan ng pagsasalita ni Job, nang hindi nilulutas nang labis ang gamit ng pang-ukol.
