  text: na hinahanap mo ang aking pagkakasala at sinisiyasat mo ang aking kasalanan?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “sapagkat hinahanap mo ang aking pagkakasala at sinisiyasat mo ang aking kasalanan.”
    reason: Pinananatili ang posibleng paliwanag o sanhi na diwa ng כִּי.
lexical_decisions:
- source_word: כִּי
  choice: upang
  rationale: Sa konteksto, ipinagpapatuloy nito ang retorikal na tanong sa naunang talata at inilalahad ang layunin o nilalaman nito. Pinananatili ng “upang” ang ugnayang pasakop nang hindi ito tahasang ginagawang sanhi.
- source_word: תְבַקֵּשׁ
  choice: hanapin mo
  rationale: Ang piel ng בקש ay aktibong paghahanap. Likas sa modernong Tagalog ang “hanapin” at ang masusing diwa nito ay napalalakas ng kaagapay na “saliksikin.”
- source_word: לַעֲוֺנִי
  choice: ang aking kasamaan
  rationale: Maaaring tumukoy ang עָוֹן sa kasamaan, sala, o pananagutang dulot ng sala. Dito, moral na kamalian ang hinahanap, kaya pinananatili ng “kasamaan” ang etikong diwa nang hindi ipinapalagay na talagang nagkasala si Job.
- source_word: וּלְחַטָּאתִי
  choice: ang aking kasalanan
  rationale: Ang חַטָּאת ay likas na isinasaling “kasalanan” at kaagapay rito ng עָוֹן. Pinananatili ang dalawang katawagan nang hindi ipinipilit ang isang teknikal na pagkakaiba.
- source_word: תִדְרֹשׁ
  choice: saliksikin
  rationale: Ang דרש ay maaaring mangahulugang humanap, magsiyasat, o magsaliksik. Ang “saliksikin” ay nagpapahayag ng masusing paghahanap at angkop na kaagapay ng “hanapin.”
theological_decisions:
- issue: Ang magkaagapay na עָוֹן at חַטָּאת
  choice: “kasamaan” at “kasalanan,” nang hindi ipinahihiwatig na talagang may sala si Job
  alternative: “sala” at “kasalanan”
  rationale: 'Reklamo ni Job ang ipinahahayag ng talata: para bang naghahanap ang Diyos ng maipaparatang sa kaniya. Pinananatili ng salin ang tensiyong ito at hindi inuunahan ang hatol ng aklat tungkol sa kaniyang kalagayan.'
- issue: Ang gamit ng כִּי
  choice: 'Basahin bilang nagpapakilala ng layunin o nilalaman: “upang”'
  alternative: 'Basahin bilang panimula ng dahilan o paliwanag: “sapagkat”'
  rationale: Mas maayos na nagdurugtong ang “upang” sa retorikal na tanong ng talata 5, ngunit tunay na posible rin sa Hebreo ang paliwanag na “sapagkat,” kaya inilagay ito sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na payak ngunit marangal. Ang “hanapin” at “saliksikin” ay likas na magkatambal at nagpapakita ng masusing pagsisiyasat. Nasa dulo ang tandang pananong dahil bahagi ito ng retorikal na tanong na nagsimula sa naunang talata.
