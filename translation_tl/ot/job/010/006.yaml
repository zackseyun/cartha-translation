    issue: Masyadong pinatitibay ng “upang” ang layuning diwa ng כִּי.
    rationale: Posible ang layuning pagbasa, ngunit hindi ito dapat ipilit. Ang “na” ay mas nababagay sa Tagalog bilang pagpapatuloy ng naunang retorikal na tanong at mas maingat na pinananatili ang saklaw ng Hebreo.
  - severity: low
    issue: Medyo di-likas ang infinitive na “hanapin mo ... saliksikin” matapos ang “upang” sa retorikal na tanong na ipinagpapatuloy mula sa naunang talata.
    rationale: Ang anyong “hinahanap mo ... sinisiyasat mo” ay mas dumadaloy sa modernong Tagalog at naipahihiwatig ang patuloy o masusing pagkilos ng mga anyong di-ganap sa Hebreo.
