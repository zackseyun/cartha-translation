  yaml_path: translation/ot/job/010/014.yaml
  text: If I sin[a], you watch me[b], and you will not acquit me of my iniquity.
translation:
  language: tl
  text: Kung magkasala ako,[a] binabantayan mo ako,[b] at hindi mo ako papawalang-sala sa aking kasamaan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Kung nagkasala ako … hindi mo ako itinuturing na walang sala sa aking pagkakasala.”
    reason: lexical_alternative
  - marker: b
    text: Ang “binabantayan” dito ay tumutukoy sa masusing pagmamasid o pagsisiyasat, hindi sa mapagkalingang pag-iingat.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Kung
  rationale: Nagpapakilala ito ng kondisyong pahayag at pinananatili ang pagiging di-tiyak ng sinabi ni Job, sa halip na gawing tiyak na pangyayari sa pamamagitan ng “Kapag.”
- source_word: חָטָאתִי
  choice: magkasala ako
  rationale: Bagaman anyong perfect ang pandiwa sa Hebreo, natural sa Filipino ang “magkasala” sa ganitong pangkalahatan o posibleng kondisyon. Hindi nito nililimitahan ang sinabi sa iisang nakaraang gawa; ang perfective na pagbasa ay inilagay sa talababa.
- source_word: וּשְׁמַרְתָּנִי
  choice: binabantayan mo ako
  rationale: Ang שׁמר ay maaaring mangahulugang mag-ingat, magbantay, o magmasid. Sa konteksto ng pagsisiyasat sa kasalanan, ang “binabantayan” ay nagpapahiwatig ng masusing pagmamasid at hindi ng mapagkalingang pag-iingat.
- source_word: וּמֵעֲוֺנִי
  choice: sa aking kasamaan
  rationale: Ang עָוֹן ay maaaring tumukoy sa kasamaan, pagkakasala, pananagutan, o kaparusahan. Pinananatili ng “kasamaan” ang moral na diwa nang hindi ito lubusang nililimitahan sa legal na pananagutan o sa parusa.
- source_word: לֹא תְנַקֵּנִי
  choice: hindi mo ako pawawalang-sala
  rationale: Ang Piel ng נקה sa kontekstong legal ay nangangahulugang magpawalang-sala o ituring na walang sala. Ang “pawawalang-sala” ay angkop sa himig na panghukuman at hindi nagpapasok ng diwang ritwal na maaaring ipahiwatig ng “lilinisin.”
theological_decisions:
- issue: Legal na pagpapawalang-sala o ritwal na paglilinis sa נקה
  choice: 'Legal/panghukuman: “hindi mo ako pawawalang-sala”'
  alternative: 'Ritwal: “hindi mo ako lilinisin”; bunga ng parusa: “hindi mo ako hahayaang hindi maparusahan”'
  rationale: 'Ang reklamo ni Job ay may himig ng paglilitis: minamasdan ang posibleng pagkakasala at hindi siya pinawawalang-sala. Pinananatili ng saling legal ang tensiyon ng teksto nang hindi nagdaragdag ng doktrinang wala rito.'
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang natural na ayos ng pangungusap at bokabularyong madaling maunawaan, habang pinananatili ang kondisyong pahayag, ang himig ng masusing pagsisiyasat, at ang legal na diwa ng pagpapawalang-sala.
