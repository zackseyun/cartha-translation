translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “sinapupunan” upang mapanatili ang imahen ng Hebreo, at “sana” upang natural na maipahayag ang hinaing tungkol sa isang di-naganap na kalagayan.
