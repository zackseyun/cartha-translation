  yaml_path: translation/ot/job/010/018.yaml
  text: Why[a], then, did you bring me out from the womb? I should have died, and no eye would have seen me.
translation:
  language: tl
  text: Bakit mo pa ako inilabas sa sinapupunan? Namatay na sana ako, at walang matang nakakita sa akin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “Mamamatay sana ako, at walang matang makakakita sa akin.” Maaaring isalin nang mas pormal ang mga pandiwang Hebreo, ngunit mas pinapaboran ng konteksto ang diwang kontrapaktuwal.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָמָה
  choice: Bakit ... pa
  rationale: Ipinahihiwatig ng prefixed conjunction ang kaugnayan sa naunang hinaing; natural na naipapahayag ito sa Filipino sa pamamagitan ng “pa” nang hindi labis na dinaragdagan ang teksto.
- source_word: מֵרֶחֶם
  choice: sa sinapupunan
  rationale: Pinananatili ang kongkretong larawan ng pinagmulan sa kapanganakan; kasama ng “inilabas,” malinaw ang diwang “mula sa sinapupunan.”
- source_word: הֹצֵאתָנִי
  choice: mo ako inilabas
  rationale: Ang Hiphil ng יצא ay nagsasaad na pinangyari ng kausap ang paglabas ni Job, tumutukoy dito sa pagsilang, at pinananatili ang tuwirang pakikipag-usap sa Diyos.
- source_word: אֶגְוַע
  choice: Namatay na sana ako
  rationale: Ang imperpektibo ay nauunawaan sa konteksto bilang di-naganap na kinalabasang ninanais ni Job; natural itong ipinapahayag ng “sana” sa Filipino.
- source_word: וְעַיִן לֹא תִרְאֵנִי
  choice: at walang matang nakakita sa akin
  rationale: Ang “mata” ay metonimiya para sa sinumang makakakita. Ang anyong pangnagdaan ay umaayon sa kontrapaktuwal na pagkamatay bago pa siya makita.
