base_translation:
  language: en
  yaml_path: translation/ot/job/010/002.yaml
  text: I will say to God[a], ‘Do not condemn me[b]; let me know why you contend with me.’
translation:
  language: tl
  text: Sasabihin ko sa Diyos, “Huwag mo akong hatulang nagkasala[a]; ipaalam mo sa akin kung bakit ka nakikipagtalo sa akin[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ipahayag na nagkasala” o “ituring na masama”; may hudisyal na diwa ang pandiwang Hebreo.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “nagsasampa ka ng kaso laban sa akin” o “nakikipag-alitan ka sa akin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹמַר
  choice: Sasabihin ko
  rationale: Ang Qal imperfect na unang panauhang isahan ay maaaring magpahiwatig ng hinaharap o layunin. Sa daloy ng pananalita ni Job, natural itong nagpapakilala sa sasabihin niya sa Diyos.
- source_word: אֶל אֱלוֹהַּ
  choice: sa Diyos
  rationale: Ang אֱלוֹהַּ ay pang-isahang katawagan sa Diyos, at ang “sa Diyos” ang natural na katumbas sa modernong Tagalog.
- source_word: אַל תַּרְשִׁיעֵנִי
  choice: Huwag mo akong hatulang nagkasala
  rationale: Ang Hiphil ng רשע ay may hudisyal na diwang ‘ipahayag o hatulang nagkasala.’ Mas malinaw na naihahatid ng pariralang ito ang legal na pahiwatig kaysa sa payak na “huwag mo akong hatulan.”
- source_word: הוֹדִיעֵנִי
  choice: ipaalam mo sa akin
  rationale: Ang Hiphil imperative ng ידע ay nangangahulugang ipabatid o bigyang-alam; dignified at natural sa Tagalog ang “ipaalam mo sa akin.”
- source_word: עַל מַה
  choice: kung bakit
  rationale: Bagaman literal na ‘dahil sa ano’ o ‘tungkol sa ano,’ sa tanong na ito ay hinihingi ang dahilan o batayan.
- source_word: תְּרִיבֵנִי
  choice: ka nakikipagtalo sa akin
  rationale: Ang ריב ay maaaring mangahulugang makipagtalo, makipaglaban, o magsampa/magdala ng usapin. Pinananatili ng “nakikipagtalo” ang malawak na interpersonal at legal na pahiwatig nang hindi ito ginagawang lubhang teknikal.
theological_decisions:
- issue: Ang hudisyal na himig ng pagsusumamo ni Job sa Diyos
  choice: “hatulang nagkasala” at “nakikipagtalo sa akin”
  alternative: “ituring na masama” at “nagsasampa ng kaso laban sa akin”
  rationale: May wikang legal at tunggalian ang talata, ngunit hindi nito kailangang gawing ganap na teknikal na paglalarawan ng isang paglilitis ang pahayag. Pinananatili ng salin ang tensiyon ng pakikipag-usap ni Job sa Diyos sa paraang hudisyal nang hindi nagdaragdag ng isang sistematikong paliwanag tungkol sa paghatol ng Diyos.
translation_notes:
  register: Modernong Filipino Tagalog na natural, marangal, at madaling maunawaan. Ginamit ang “hatulang nagkasala” upang mapanatili ang hudisyal na diwa, samantalang ang “nakikipagtalo” ay sadyang hindi masyadong teknikal upang mapanatili ang lawak at tensiyon ng Hebreo.
