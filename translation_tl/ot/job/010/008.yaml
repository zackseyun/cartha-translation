  text: Your hands shaped me and made me[a], together all around[c][b]; yet you swallow me up.
translation:
  language: tl
  text: Ang iyong mga kamay ang humubog at gumawa sa akin[a], nang buo, sa lahat ng panig[b]; ngunit nilalamon mo ako[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “binuo” o “inanyuan.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “magkakasama, sa buong paligid,” na nagpapahiwatig ng paghubog sa buong pagkatao ni Job, sa bawat panig.
    reason: cultural_note
  - marker: c
    text: Maaari ring “ngunit nililipol mo ako.” Literal sa Hebreo ang “nilalamon mo ako,” isang matingkad na larawan ng pagwasak.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָדֶיךָ
  choice: iyong mga kamay
  rationale: Pinanatili ang pangmaramihang anyo at ang kongkretong larawan ng personal na pagkilos ng Diyos bilang Manlilikha.
- source_word: עִצְּבוּנִי
  choice: Hinubog ako
  rationale: Ang Piel ng עצב ay tumutukoy rito sa maingat na paghubog; natural sa Filipino ang “hinubog” at napapanatili nito ang larawan ng isang bihasang manggagawa.
- source_word: וַיַּעֲשׂוּנִי
  choice: at ginawa
  rationale: Ang עשה ay karaniwang “gumawa.” Kasabay ng “hinubog,” ipinahahayag nito ang ganap na paglikha kay Job nang hindi pinag-iisa ang dalawang pandiwa.
- source_word: יַחַד סָבִיב
  choice: nang buo at sa lahat ng panig
  rationale: Isinasalin ang mahirap at siksik na pariralang Hebreo sa paraang malinaw sa modernong Filipino, habang pinananatili ang diwa ng kabuuan at paghubog sa palibot o bawat panig.
- source_word: וַתְּבַלְּעֵנִי
  choice: gayunma’y nilalamon mo ako
  rationale: Pinanatili ang matingkad na metaporang “lumamon,” sa halip na gawing tahasang “lipulin.” Ipinakikita ng “gayunma’y” ang matalim na pagsalungat sa naunang paglikha, ayon sa konteksto.
theological_decisions:
- issue: Antropomorpikong paglalarawan sa paglikha ng Diyos
  choice: Pinanatili ang “iyong mga kamay” at ang magkaparis na pandiwang “hinubog” at “ginawa.”
  alternative: “Ikaw ang lumikha sa akin”
  rationale: Mahalaga sa panaghoy ni Job ang kongkreto at personal na larawan ng Diyos bilang maingat na manggagawa; mawawala ito sa isang pangkalahatang paraprasis.
- issue: Tensiyon sa pagitan ng paghubog ng Diyos at ng tila pagwasak niya
  choice: “gayunma’y nilalamon mo ako”
  alternative: “at ngayo’y nililipol mo ako”
  rationale: Pinananatili ang matalim na tensiyon at ang metapora ng Hebreo, nang hindi ipinapaliwanag o nilulutas ang reklamo ni Job.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “gayunma’y” upang panatilihin ang pormal at patulang himig ng panaghoy; pinanatili rin ang kongkretong metapora ng mga kamay at paglamon.
