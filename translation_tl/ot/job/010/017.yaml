  source_fidelity: 'Ang unang dalawang linya ay tapat sa Hebreo: napananatili ang muling paghaharap ng mga saksi/ebidensiya at ang pagpapatingkad ng galit. Ngunit ang “sunod-sunod na mga hukbo” ay hindi sapat na katumbas ng חֲלִיפוֹת וְצָבָא: isinasama nito ang dalawang pangngalan sa iisang ideya at nawawala ang pangunahing kahulugan ng חֲלִיפוֹת na “mga pagbabago/pagpapalit.” Ang צָבָא ay maaaring “mabigat na paglilingkod” o “pakikidigma,” kaya hindi dapat gawing “mga hukbo” lamang.'
  naturalness: Natural at marangal ang unang dalawang linya. Mas malinaw at mas tapat ang huling linya kung isasalin ang dalawang magkahiwalay na pangngalan bilang “sunod-sunod na pagbabago at mabigat na paglilingkod,” habang inilalagay sa talababa ang posibleng larawang pandigma.
  terminology: Wasto ang “mga saksi,” “ebidensiya,” at “galit.” Ang “mabigat na paglilingkod” ay isang maingat na salin ng צָבָא sa pangunahing teksto; pinananatili ng talababa ang alternatibong “pakikidigma.”
