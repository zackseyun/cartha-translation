  text: You renew your witnesses against me[a], and you increase your anger with me[b]; changes and hard service are with me.
translation:
  language: tl
  text: 'Muli kang naghaharap ng iyong mga saksi laban sa akin,[a]

    at lalo mong pinatitindi ang galit mo sa akin;

    sunod-sunod na pagbabago at mabigat na paglilingkod ang kasama ko.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga ebidensiya mo.” Ang salitang Hebreo ay maaaring tumukoy sa mga saksing nagpapatotoo o sa mga katibayang inihaharap laban kay Job.
    reason: lexical_alternative
  - marker: b
    text: O “mga pagbabago at pakikidigma ang kasama ko.” Ang mga salitang Hebreo ay maaari ring magpahiwatig ng magkakasunod na bugso ng pagsalakay o pakikidigma.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּחַדֵּשׁ
  choice: Muli kang naghaharap
  rationale: Ipinahihiwatig ng Piel ng חדש ang muling paggawa o pagpapanibago. Sa kontekstong panghukuman, likas sa Filipino ang “muli kang naghaharap,” at napananatili nito ang diwang panibagong pagdadala ng saksi o ebidensiya.
- source_word: עֵדֶיךָ
  choice: iyong mga saksi
  rationale: Ang pangmaramihang עֵד ay karaniwang tumutukoy sa mga saksi, ngunit maaari ring tumukoy sa mga patotoo o ebidensiya. Pinananatili ng “mga saksi” ang larawang panghukuman.
- source_word: נֶגְדִּי
  choice: laban sa akin
  rationale: Bagaman maaari itong literal na mangahulugang “sa harap ko,” malinaw na adversatibo ang gamit sa konteksto ng paratang.
- source_word: וְתֶרֶב
  choice: at lalo mong pinatitindi
  rationale: Ang anyo mula sa רבה ay nagpapahayag ng pagpaparami o pagpapalubha. Ang “pinatitindi” ay natural na katambal ng “galit” sa Filipino.
- source_word: כַּעַשְׂךָ
  choice: ang galit mo
  rationale: Maaaring mangahulugan ang כעס ng galit, pagkayamot, o poot. Ang “galit” ang pinakatuwiran at natural dito nang hindi dinaragdagan ang tindi ng salita.
- source_word: עִמָּדִי
  choice: sa akin
  rationale: Literal itong “kasama ko,” ngunit kapag iniugnay sa galit, ang idiomatikong Filipino ay “galit mo sa akin.”
- source_word: חֲלִיפוֹת וְצָבָא
  choice: sunod-sunod na mga hukbo
  rationale: Maaaring ilarawan ng חֲלִיפוֹת ang mga pagpapalit o magkakasunod na pangkat, at ang צָבָא ay hukbo, pakikidigma, o sapilitang paglilingkod. Ang salin ay nagpapanatili sa malamang na larawang militar ng mga pangkat na halinhinang dumarating.
- source_word: עִמִּי
  choice: laban sa akin
  rationale: Literal na “kasama ko,” ngunit ipinahihiwatig ng mapanlabang konteksto na ang mga hukbo ay nakahanay laban kay Job.
