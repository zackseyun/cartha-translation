translation_notes:
  register: Makabago at marangal na Filipino, na may malinaw na larawang panghukuman sa unang linya at militar sa huli. Ginamit ang “muli kang naghaharap” sa halip na literal ngunit di-likas na “pinaninibago mo,” at ipinaliwanag sa talababa ang tunay na leksikal na kalabuan ng huling parirala.
