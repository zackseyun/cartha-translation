base_translation:
  language: en
  yaml_path: translation/ot/job/010/012.yaml
  text: You have granted me life and steadfast love[b][a], and your care has preserved my spirit.
translation:
  language: tl
  text: 'Ipinagkaloob mo sa akin ang buhay at tapat na pag-ibig,

    at ang iyong pangangalaga[a] ang nag-ingat sa aking espiritu[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “pagdalaw” o “pagbabantay.”
    reason: lexical_alternative
  - marker: b
    text: O “hininga.”
    reason: lexical_alternative
lexical_decisions:
- source_word: חַיִּים
  choice: buhay
  rationale: Bagaman anyong maramihan sa Hebreo, karaniwan itong tumutukoy sa buhay bilang isang kabuuan; likas at malinaw sa Tagalog ang “buhay.”
- source_word: וָחֶסֶד
  choice: tapat na pag-ibig
  rationale: Ipinahahayag nito ang pag-ibig na may katapatan at matibay na kabutihang-loob, nang hindi ito nililimitahan sa “awa” lamang.
- source_word: עָשִׂיתָ עִמָּדִי
  choice: ipinagkaloob mo sa akin
  rationale: Ang literal na “ginawa mo sa akin/kasama ko” ay idyomatikong tumutukoy rito sa pagbibigay ng mga biyayang buhay at tapat na pag-ibig.
- source_word: וּפְקֻדָּתְךָ
  choice: iyong pangangalaga
  rationale: Sa konteksto ng pag-iingat sa buhay ni Job, malinaw nitong naihahatid ang mapagmatyag at mabuting pagkalinga ng Diyos, habang inilalagay sa talababa ang ibang posibleng kahulugan.
- source_word: שָׁמְרָה
  choice: nag-ingat
  rationale: Malapit ito sa pangunahing diwa ng pandiwang Hebreo na magbantay, magpanatili, o magpreserba.
- source_word: רוּחִי
  choice: aking espiritu
  rationale: Pinananatili nito ang lawak ng רוּחַ bilang panloob na buhay o espiritu, habang kinikilala sa talababa ang posibleng kahulugang “hininga.”
theological_decisions:
- issue: Diwa ng חֶסֶד kaugnay ng Diyos
  choice: tapat na pag-ibig
  alternative: kabutihang-loob; awa; matapat na pagmamahal
  rationale: Pinananatili ng “tapat na pag-ibig” ang katapatan at matibay na kabutihang-loob na taglay ng salita nang hindi nagdaragdag ng isang makitid na doktrinal na pakahulugan.
- issue: Diwa ng פְקֻדָּה
  choice: mabuting pangangalaga o mapagmatyag na pagbabantay
  alternative: pagdalaw; pagbabantay
  rationale: Ipinahihiwatig ng kasunod na pag-iingat sa espiritu ni Job ang mabuting pangangalaga, ngunit tunay na nananatiling posible ang mas literal na “pagdalaw” o “pagbabantay,” kaya inilagay ang mga ito sa talababa.
- issue: Saklaw ng רוּחַ
  choice: espiritu
  alternative: hininga
  rationale: Maaaring tumukoy ang salita sa espiritu o hininga. Hindi nilulutas nang lubusan ng konteksto ang pagkakaibang ito, kaya pinanatili ang alternatibo sa talababa.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “ipinagkaloob” upang likas na maipahayag ang pagbibigay ng Diyos, at pinanatili sa mga talababa ang tunay na leksikal na kalabuan ng פְקֻדָּה at רוּחַ.
