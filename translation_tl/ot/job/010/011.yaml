    issue: Hindi malinaw ang ugnayan ng “may mga buto at litid” sa pandiwang “hinabi.”
    rationale: Sa Tagalog, ang “hinabi mo akong may…” ay maaaring maglarawan lamang sa tumatanggap bilang taong may mga buto at litid. Hindi nito sapat na ipinababatid na ang mga buto at litid ang kaugnay na paraan o materyal sa makatang paglalarawan ng pagbuo.
