translation:
  language: tl
  text: 'Dinamtan mo ako ng balat at laman,

    at hinabi mo ako gamit ang mga buto at litid.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “binalot mo ako ng mga buto at litid.” Ang pandiwang Hebreo ay maaari ring mangahulugang takpan o palibutan.
    reason: lexical_alternative
lexical_decisions:
- source_word: עוֹר
  choice: balat
  rationale: Sa konteksto ng katawan ng tao, ang karaniwang at tiyak na katumbas ay “balat.”
- source_word: בָשָׂר
  choice: laman
  rationale: Pinananatili ng “laman” ang kongkretong larawan ng tisyu ng katawan at ang pagtutulad nito sa “balat.”
- source_word: תַּלְבִּישֵׁנִי
  choice: dinamtan mo ako
  rationale: Tuwirang pinananatili ng “dinamtan” ang talinghaga ng pagbibihis, ngunit marangal at likas pa rin ito sa makabagong Tagalog.
- source_word: בַעֲצָמוֹת
  choice: may mga buto
  rationale: Likas nitong ipinahihiwatig sa Tagalog na ang mga buto ay sangkap na ginamit sa pagbuo sa katawan; iniiwasan nito ang alanganing literal na “sa mga buto.”
- source_word: גִידִים
  choice: litid
  rationale: Ang “litid” ay karaniwang salitang Tagalog para sa nag-uugnay na matitibay na tisyu at hindi kasing-klinikal ng mas teknikal na mga katawagan.
- source_word: תְּסֹכְכֵנִי
  choice: hinabi mo ako
  rationale: Ipinahahayag ng “hinabi” ang masalimuot na pag-uugnay at pagbuo sa katawan, habang ang alternatibong diwang “binalot” ay pinananatili sa talababa.
theological_decisions:
- issue: Matalinghagang paglalarawan sa paghubog ng Diyos sa katawan ni Job
  choice: Inilalarawan ang pagbuo sa katawan sa pamamagitan ng mga talinghaga ng pagdadamit at paghahabi.
  alternative: Unawain ang ikalawang talinghaga bilang pagtatakip o pagpapalibot sa katawan ng mga buto at litid.
  rationale: Ang konteksto ay tungkol sa paghubog sa katawan ni Job. Pinananatili ng salin ang makatang paglalarawan nang hindi nagdaragdag ng doktrinang hindi tahasang sinasabi ng talata.
translation_notes:
  register: Makabago ngunit marangal na Tagalog. Ginamit ang “dinamtan” upang mapanatili ang talinghaga ng pagbibihis, at ang “hinabi” upang maging malinaw at makata ang paglalarawan sa pagkakabuo ng katawan.
