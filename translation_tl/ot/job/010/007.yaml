  text: עַֽל דַּ֭עְתְּ/ךָ כִּי לֹ֣א אֶרְשָׁ֑ע וְ/אֵ֖ין מִ/יָּדְ/ךָ֣ מַצִּֽיל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/010/007.yaml
  text: Though you know that I am not wicked[b][a], there is no one who can deliver from your hand.
translation:
  language: tl
  text: Bagaman alam mong hindi ako masama,[a] walang sinumang makapagliligtas mula sa iyong kamay.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “wala akong sala.” Literal na sinasabi ng Hebreo na “hindi masama,” na nagbibigay-diin sa pagtanggi ni Job na isa siyang taong masama, hindi sa pag-aangkin na wala siyang anumang kasalanan.
    reason: lexical_alternative
  - marker: b
    text: Ang “mula sa iyong kamay” ay isang Hebreong paraan ng pagsasabing nasa ilalim ng kapangyarihan o pamamahala ng isang tao.
    reason: cultural_note
lexical_decisions:
- source_word: עַל דַּעְתְּךָ
  choice: Bagaman alam mo
  rationale: Ang parirala ay tumutukoy sa nalalaman ng Diyos at may pasalungat na diwa sa konteksto. Likas sa modernong Tagalog ang “bagaman alam mo” at malinaw nitong naihahayag ang reklamo ni Job.
- source_word: כִּי
  choice: -ng
  rationale: Ipinakikilala ng כִּי ang nilalaman ng nalalaman ng Diyos. Sa Tagalog, likas itong ipinapahayag ng pang-angkop sa “alam mong.”
- source_word: לֹא אֶרְשָׁע
  choice: hindi ako masama
  rationale: Maaaring statibo ang Qal imperfect ng רשע rito. Pinananatili ng “hindi ako masama” ang pagtanggi ni Job na isa siyang taong masama, nang hindi ito ginagawang tahasang pag-aangkin ng ganap na kawalang-kasalanan.
- source_word: וְאֵין
  choice: walang sinuman
  rationale: Likas na ipinahahayag nito sa Tagalog ang ganap na pagtanggi sa pag-iral ng sinumang tagapagligtas.
- source_word: מִיָּדְךָ
  choice: mula sa iyong kamay
  rationale: Pinananatili nito ang Hebreong larawan ng “kamay” bilang kapangyarihan o pamamahala, sa halip na agad itong palitan ng interpretasyong “mula sa iyong kapangyarihan.”
- source_word: מַצִּיל
  choice: makapagliligtas
  rationale: Ang Hiphil participle ng נצל ay tumutukoy sa isang nagliligtas o sumasagip. Sa kayariang “walang sinumang,” natural na ipinahahayag ng “makapagliligtas” ang kawalan ng sinumang may kakayahang sumagip.
theological_decisions:
- issue: Ang pag-aangkin ni Job ng pagiging walang sala sa harap ng Diyos
  choice: Isinalin bilang “hindi ako masama,” isang pagtanggi na siya ay taong masama.
  alternative: “wala akong sala” o “hindi ako nagkasala”
  rationale: רשע ang ginamit ng Hebreo, na nakatuon sa pagiging masama, hindi isang tuwirang pag-aangkin ng ganap na kawalang-kasalanan. Pinananatili ng salin ang teolohikal na tensiyon sa reklamo ni Job.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “bagaman” upang panatilihin ang pasalungat na diwa, at ang literal na larawang “iyong kamay” upang mapanatili ang talinghaga ng tekstong Hebreo.
