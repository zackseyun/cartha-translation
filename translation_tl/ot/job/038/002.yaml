  text: Who is this who darkens counsel with words without knowledge?[a]
translation:
  language: tl
  text: Sino itong nagpapadilim sa payo sa pamamagitan ng mga salitang walang kaalaman?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “panukala” o “layunin” sa halip na “payo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי זֶה
  choice: Sino ito
  rationale: Pinananatili ng tanong na may kasamang demonstratibo ang mariin at mapanghamong tono ng Hebreo; ang anyong “Sino itong…” ay natural sa modernong Tagalog.
- source_word: מַחְשִׁיךְ
  choice: nagpapadilim
  rationale: Tuwirang pinananatili ang metapora ng paggawa sa isang bagay na madilim, sa halip na palitan ito ng mas interpretatibong “nagpapalabo.”
- source_word: עֵצָה
  choice: payo
  rationale: Maaaring tumukoy ang salita sa payo, panukala, o layunin. Pinananatili ng “payo” ang kaugnayan nito sa karunungan at pagpapasiya, habang inilalahad sa talababa ang iba pang tunay na posibilidad.
- source_word: בְמִלִּין
  choice: sa pamamagitan ng mga salita
  rationale: 'Ipinahahayag nito ang instrumental na gamit ng pang-ukol: ang mga salita ang paraang ginagamit sa pagpapadilim.'
- source_word: בְּלִי דָעַת
  choice: walang kaalaman
  rationale: Malapit ito sa literal na kahulugan at hindi nito pinapalitan ang “kaalaman” ng mas interpretatibong “pagkaunawa” o “kamangmangan.”
theological_decisions:
- issue: Kahulugan ng עֵצָה sa pagsasalita ng Diyos
  choice: payo
  alternative: panukala o layunin
  rationale: Maaaring saklawin ng salita kapwa ang matalinong pagpapasiya at ang layunin o plano ng Diyos. Hindi nilulutas ng salin ang tensiyong ito nang higit sa ipinahihintulot ng Hebreo; nakatala sa talababa ang mga alternatibo.
translation_notes:
  register: Makabago ngunit marangal na Tagalog. Sadyang pinanatili ang matapang na metaporang “nagpapadilim” at ang tuwirang pariralang “walang kaalaman.”
