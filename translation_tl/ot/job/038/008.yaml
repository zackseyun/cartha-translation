  yaml_path: translation/ot/job/038/008.yaml
  text: Or who shut in the sea with doors when it burst out from the womb[b][a],
translation:
  language: tl
  text: O sino ang ikinulong ang dagat gamit ang mga pinto nang bumulwak[a] ito palabas mula sa sinapupunan[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “rumagasa palabas”; ipinahihiwatig ng pandiwang Hebreo ang puwersahang paglabas.
    reason: lexical_alternative
  - marker: b
    text: Inilalarawan dito ang dagat na parang isang sanggol na lumalabas mula sa sinapupunan, bilang bahagi ng makatang larawan ng paglikha.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּסֶךְ
  choice: nagsara
  rationale: Ipinahahayag ng pandiwa ang pagpigil o pagkulong sa dagat. Ang “nagsara” ay likas sa Filipino kasabay ng larawan ng mga pinto at hindi ginagawang abstrakto ang taludtod.
- source_word: בִּדְלָתַיִם
  choice: gamit ang mga pinto
  rationale: Pinananatili nito ang instrumental na diwa ng pang-ukol at ang kongkretong larawang pang-arkitektura. Ang anyong dual ay natural na naihahayag sa Filipino bilang maramihang “mga pinto.”
- source_word: יָם
  choice: sa dagat
  rationale: Sa kontekstong kosmiko, tumutukoy ito sa dagat bilang kilalang bahagi ng nilikha; natural sa Filipino ang “sa dagat.”
- source_word: בְּגִיחוֹ
  choice: nang bumulwak ito
  rationale: Ang “bumulwak” ay malinaw at masiglang pandiwa para sa puwersahang paglabas, na pinananatili ang lakas ng Hebreong larawan.
- source_word: מֵרֶחֶם
  choice: mula sa sinapupunan
  rationale: Tuwirang pinananatili ang metapora ng pagsilang at ang paglalarawan sa dagat na parang sanggol.
- source_word: יֵצֵא
  choice: palabas
  rationale: Kasama ng “bumulwak,” ipinahahayag ng “palabas” ang tahasang ideya ng paglabas nang hindi lumilikha ng mabigat at di-likas na pag-uulit sa Filipino.
theological_decisions:
- issue: Makatang larawan ng paglikha sa dagat
  choice: Panatilihin ang larawan ng Diyos na nagsasara sa dagat sa pagsilang nito.
  alternative: Ipaliwanag lamang na nagtakda ang Diyos ng hangganan sa dagat o alisin ang larawan ng pagsilang.
  rationale: Inilalarawan ng Hebreo ang dagat bilang lumalabas mula sa sinapupunan at saka pinipigil sa pamamagitan ng mga pinto. Pinananatili ng salin ang makatang paglalangkap nang hindi ito ginagawang literal na pahayag na mitolohikal.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang tanong at ang matingkad na larawang patula; iniwasan ang sobrang literal na pag-uulit na magiging alanganin sa natural na Tagalog.
