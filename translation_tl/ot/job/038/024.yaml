  text: By what way is light divided[b][a], or the east wind scattered over the earth?
translation:
  language: tl
  text: Sa anong daan nahahati ang liwanag[b][a], o saan kumakalat ang hanging silangan sa ibabaw ng lupa?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Nasaan ang daan kung saan nahahati ang liwanag?” Maaaring unawain ang Hebreong patanong bilang pagtatanong tungkol sa kinaroroonan o sa paraan.
    reason: lexical_alternative
  - marker: b
    text: O “kidlat” sa halip na “liwanag.” Karaniwang nangangahulugang “liwanag” ang salitang Hebreo, ngunit inuunawa ito ng ilan bilang isang penomenong kaugnay ng bagyo sa kontekstong ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵי זֶה
  choice: Sa anong
  rationale: Kasama ng הַדֶּרֶךְ, maaari itong magtanong tungkol sa paraan o kinaroroonan. Ang “Sa anong daan” ay natural na nagpapanatili sa idyomang Hebreo at sa posibleng kahulugang paraan.
- source_word: הַדֶּרֶךְ
  choice: daan
  rationale: Karaniwang tumutukoy ang דֶּרֶךְ sa daan o landas. Ang “daan” ay malinaw, marangal, at angkop sa patulang tanong.
- source_word: יֵחָלֶק
  choice: nahahati
  rationale: Ang Niphal ng חלק ay may diwang pasibo o reflexive na “mahati/maipamahagi.” Pinananatili ng “nahahati” ang anyo at talinghaga nang hindi labis na nagpapaliwanag.
- source_word: אוֹר
  choice: liwanag
  rationale: “Liwanag” ang karaniwang kahulugan ng אוֹר. Bagaman maaaring ipakahulugan itong kidlat sa konteksto ng bagyo, hindi nililimitahan ng salin ang sadyang malawak na salita.
- source_word: יָפֵץ
  choice: ikinakalat
  rationale: Ang Hiphil ng פוץ ay nangangahulugang “ikalat” o “pang disperse.” Ang “ikinakalat” ay likas sa Filipino at nagpapakita ng kaagapay na kilos sa unang sugnay.
- source_word: קָדִים
  choice: hanging silangan
  rationale: Sa kontekstong meteorolohikal, karaniwang tumutukoy ang קָדִים sa hanging mula sa silangan, hindi lamang sa direksiyong silangan.
- source_word: עֲלֵי אָרֶץ
  choice: sa ibabaw ng lupa
  rationale: Ang parirala ay maaaring mangahulugang “sa ibabaw ng lupa/daigdig.” Pinananatili ng “sa ibabaw ng lupa” ang malawak na saklaw ng pahayag nang hindi pinipilit ang “lupain.”
