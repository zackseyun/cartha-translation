  yaml_path: translation/ot/job/038/015.yaml
  text: Their light is withheld from the wicked[b][a], and the uplifted arm is broken.
translation:
  language: tl
  text: Ipinagkakait sa masasama ang kanilang liwanag, at ang nakataas na bisig[b] ay binabali.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “babalìin ang nakataas na bisig.” Ang Hebreong imperfect ay maaaring unawain bilang hinaharap o bilang masiglang kasalukuyan.
    reason: lexical_alternative
  - marker: b
    text: Ang “bisig” dito ay malamang na sumasagisag sa lakas o kapangyarihan, lalo na sa kapangyarihang ginagamit sa karahasan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִמָּנַע
  choice: ipinagkakait
  rationale: Ang Niphal imperfect ng מנע ay nagsasaad na ang isang bagay ay ipinagkakait o hinahadlangan. Pinananatili ng pasibong anyo ang balangkas ng Hebreo.
- source_word: מֵרְשָׁעִים
  choice: sa masasama
  rationale: 'Ang מִן ay nagpapahayag ng pagkakait o paglalayo: hindi ipinauubaya sa masasamang tao ang liwanag. Likas at hindi nakatali sa kasarian ang “masasama.”'
- source_word: אוֹרָם
  choice: ang kanilang liwanag
  rationale: Tuwirang pinananatili ang hulaping panghalip na maramihan. Sa konteksto, ito ang liwanag na tinatamasa sana ng masasama ngunit ipinagkakait sa kanila ng bukang-liwayway.
- source_word: וּזְרוֹעַ
  choice: at ang ... bisig
  rationale: Ang זְרוֹעַ ay literal na “bisig” at maaari ring sumagisag sa lakas o kapangyarihan. Pinananatili sa pangunahing teksto ang kongkretong larawang pampanitikan.
- source_word: רָמָה
  choice: nakataas
  rationale: Ang anyo mula sa רום ay naglalarawan sa bisig bilang itinaas. Ang “nakataas” ay natural sa Filipino at hindi tahasang nagpapasiya kung ito ay tanda ng kapalaluan, pagbabanta, o marahas na kapangyarihan.
- source_word: תִּשָּׁבֵר
  choice: binabali
  rationale: Ang Niphal imperfect ng שבר ay maaaring unawain bilang masigla o pangkalahatang kasalukuyan sa tulang ito. Ang “binabali” ay pasibo sa diwa at angkop sa patuloy na paglalarawan ng epekto ng bukang-liwayway.
theological_decisions:
- issue: Panahunan/aspekto ng תִּשָּׁבֵר
  choice: binabali
  alternative: babalìin
  rationale: Maaaring magpahiwatig ang Hebreong imperfect ng masiglang kasalukuyan o ng hinaharap. Pinili ang kasalukuyang paglalarawan dahil kaayon ito ng konteksto, habang itinatala sa talababa ang tunay na alternatibo.
translation_notes:
  register: Modernong Filipino na may dignidad at malinaw na larawang patula. Ginamit ang “bisig” sa halip na “braso” upang mapanatili ang marangal na rehistro at ang simbolikong puwersa ng Hebreo. Inilagay ang mga pananda ng talababa sa mismong salitang o pariralang tinutukoy.
