  text: when the morning stars sang together[a], and all the sons of God shouted for joy?
translation:
  language: tl
  text: 'nang sabay-sabay na umawit ang mga bituin sa umaga,

    at naghiyawan sa tuwa ang lahat ng mga anak ng Diyos[a]?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “mga nilalang sa langit” o “mga anghel.” Sa Hebreo: “mga anak ng Diyos.”'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּ/רָן
  choice: nang ... umawit
  rationale: Ang ב na ikinabit sa infinitive construct ng רנן ay nagpapakilala rito ng sugnay na panahunan. Ipinahihiwatig ng רנן ang masigla at matagumpay na pag-awit o pagsigaw; ang “umawit” ay angkop sa paralelismo sa kasunod na masayang paghiyaw.
- source_word: יַחַד
  choice: sabay-sabay
  rationale: Ipinahihiwatig ng יַחַד ang sabayang pagkilos o pagkakaisa. Natural sa modernong Tagalog ang “sabay-sabay” at pinananatili nito ang kolektibong diwa.
- source_word: כּוֹכְבֵי בֹקֶר
  choice: mga bituin sa umaga
  rationale: Literal na “mga bituin ng umaga” ang pariralang construct. Mas natural sa Tagalog ang “mga bituin sa umaga” habang pinananatili ang matalinghagang larawan.
- source_word: וַ/יָּרִיעוּ
  choice: at naghiyawan sa tuwa
  rationale: Ang Hiphil ng רוע/ריע ay tumutukoy sa malakas na sama-samang pagsigaw, at madalas ay may masayang diwa. Nililinaw ng “sa tuwa” ang mapagdiwang na konteksto nang hindi labis na nagpapakahulugan.
- source_word: כָּל
  choice: lahat
  rationale: Tuwirang katumbas ng כָּל ang “lahat” at binibigyang-diin nito ang kabuuan ng pangkat.
- source_word: בְּנֵי אֱלֹהִים
  choice: mga anak ng Diyos
  rationale: Ito ang tuwirang anyo ng pariralang Hebreo. Bagaman malamang na tumutukoy ito sa mga nilalang sa makalangit na hukuman, pinananatili ng salin ang mismong pahayag ng Hebreo sa halip na agad itong ipakahulugang “mga anghel.”
theological_decisions:
- issue: Pagkakakilanlan ng בְּנֵי אֱלֹהִים
  choice: “mga anak ng Diyos” sa pangunahing teksto
  alternative: “mga nilalang sa langit,” “mga banal na nilalang,” o “mga anghel”
  rationale: Sa Job, malamang na tumutukoy ang parirala sa mga kabilang sa makalangit na hukuman. Gayunman, ang “mga anghel” ay isang interpretasyon na mas tiyak kaysa sa Hebreo. Pinananatili ng “mga anak ng Diyos” ang tunay na anyo at teolohikal na tensiyon ng pinagmulang teksto.
translation_notes:
  register: Makata ngunit malinaw at likas sa modernong Filipino. Ginamit ang “sabay-sabay na umawit” at “naghiyawan sa tuwa” upang mapanatili ang masiglang paralelismo ng dalawang linyang Hebreo. Inilagay ang talababa sa pariralang “mga anak ng Diyos,” na siyang tinutukoy ng alternatibong pagbasa.
