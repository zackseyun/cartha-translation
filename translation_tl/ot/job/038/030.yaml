  yaml_path: translation/ot/job/038/030.yaml
  text: The waters are hidden like stone[b][a], and the surface of the deep is frozen.
translation:
  language: tl
  text: Ang tubig ay tumitigas na parang bato[a], at ang ibabaw ng kalaliman[b] ay nagyeyelo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa mas literal na salin, “Ang tubig ay nagkukubli na parang bato.” Di-pangkaraniwan ang pandiwang Hebreo rito at malamang na inilalarawan nito ang tubig na nagiging matigas at nagyelong anyo.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “ang ibabaw ng kalaliman ay nagkakabigkis” o “namumuo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּאֶבֶן
  choice: na parang bato
  rationale: Ang כ־ ay naghahayag ng paghahambing, kaya pinanatili ang simili sa halip na sabihing literal na nagiging bato ang tubig.
- source_word: מַיִם
  choice: ang tubig
  rationale: Bagaman anyong maramihan sa Hebreo, karaniwan itong pangngalang di-mabilang; mas natural sa modernong Tagalog ang “ang tubig.”
- source_word: יִתְחַבָּאוּ
  choice: tumitigas
  rationale: Karaniwang nangangahulugang “nagtatago” ang pandiwa, ngunit sa piling ng “parang bato” at ng kaagapay na taludtod, ipinahihiwatig dito ang pag-urong o pamumuo ng tubig sa matigas at nagyelong kalagayan. Inilagay sa talababa ang mas literal na pagbasa.
- source_word: וּפְנֵי
  choice: at ... ang ibabaw ng
  rationale: Ang literal na “mukha ng” ay idyomatikong tumutukoy sa ibabaw kapag tubig o kalaliman ang tinutukoy.
- source_word: תְהוֹם
  choice: kalaliman
  rationale: Ang “kalaliman” ay natural at marangal na katumbas ng kosmikong matubig na kailaliman, nang hindi dinaragdagan ng di-tiyak na interpretasyon.
- source_word: יִתְלַכָּדוּ
  choice: nagyeyelo
  rationale: Ang salitang-ugat ay may diwang nahuhuli, napipigilan, o nagkakabigkis; sa konteksto ng lamig, malinaw na inilalarawan nito ang pagkapirmi ng ibabaw dahil sa pagyeyelo. Pinanatili sa talababa ang mas literal na mga posibilidad.
