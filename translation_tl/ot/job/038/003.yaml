  text: אֱזָר נָ֣א כְ/גֶ֣בֶר חֲלָצֶ֑י/ךָ וְ֝/אֶשְׁאָלְ/ךָ֗ וְ/הוֹדִיעֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/038/003.yaml
  text: Gird up your loins like a man[a]; I will question you[b], and you shall make it known to me.
translation:
  language: tl
  text: Humanda kang mabuti, tulad ng isang lalaki[a]; tatanungin kita, at ipaalam mo sa akin[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “bigkisan mo ang iyong baywang tulad ng isang lalaki.” Isa itong idyoma para sa matatag at buong-tapang na paghahanda; maaari ring isalin na “humanda kang tulad ng isang mandirigma.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “at ipaunawa mo sa akin.” Karaniwang isinasalin itong “at sagutin mo ako,” ngunit mas literal ang Hebreo na “ipaalam mo sa akin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱזָר נָא ... חֲלָצֶיךָ
  choice: Humanda kang mabuti
  rationale: Ang literal na larawan ay ang pagbibigkis ng baywang bilang paghahanda sa pagkilos. Ang natural na idyomang Filipino na “humanda kang mabuti” ay naghahatid ng mariin at determinadong paghahanda, habang inilalagay sa talababa ang kongkretong larawang Hebreo.
- source_word: כְגֶבֶר
  choice: tulad ng isang lalaki
  rationale: Ang גֶּבֶר ay tumutukoy sa isang lalaki at maaari ring magpahiwatig ng lakas o katapangan. Pinananatili ng salin ang panlalaking pagtukoy at ang paghahambing, nang hindi ito ginagawang pahayag tungkol sa nakahihigit na katayuan ng lalaki.
- source_word: וְאֶשְׁאָלְךָ
  choice: tatanungin kita
  rationale: Karaniwang nangangahulugang “magtanong” ang שׁאל. Ang anyong ito ay natural sa Filipino at akma sa sunod-sunod na hamon ng Diyos kay Job.
- source_word: וְהוֹדִיעֵנִי
  choice: at ipaalam mo sa akin
  rationale: Ang Hiphil ng ידע ay literal na “magpangyaring malaman” o “ipaalam.” Pinananatili nito ang mas tiyak na diwa ng Hebreo kaysa sa interpretatibong “sagutin mo ako.”
- source_word: נָא
  choice: mariing puwersa sa “mabuti” at sa pautos na pangungusap
  rationale: Dito, ang נָא ay nagbibigay ng diin o agarang hamon, hindi magalang na pakiusap. Sa Filipino, likas na naihahatid ito ng “humanda kang mabuti” sa halip na ng “pakiusap” o isang hiwalay na temporal na “ngayon.”
theological_decisions:
- issue: Panlalaking pananalita sa hamon ng Diyos
  choice: tulad ng isang lalaki
  alternative: tulad ng isang mandirigma / tulad ng isang malakas na tao
  rationale: Panlalaking pangngalan ang גֶּבֶר, kaya hindi ito ginawang neutral. Gayunman, idyoma ito ng matatag na kahandaan at hindi doktrina tungkol sa pagiging nakahihigit ng mga lalaki.
- issue: Utos na ipaalam sa Diyos
  choice: ipaalam mo sa akin
  alternative: sagutin mo ako
  rationale: 'Pinananatili ang retorikal na tensiyon ng literal na Hiphil: hinahamon ng Diyos si Job na magbigay ng kaalamang hinihingi sa kaniya. Hindi ito pinapahina sa karaniwang “sumagot,” ni ipinapakahulugang may kakulangan sa kaalaman ang Diyos.'
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Iniwasan ang lipas at hindi natural na “bigkisan ang mga balakang” sa pangunahing teksto, ngunit pinanatili ang kongkretong idyomang Hebreo sa talababa. Ang “lalaki” ay sinadyang panatilihin dahil tiyak na panlalaki ang salitang pinagmulan.
