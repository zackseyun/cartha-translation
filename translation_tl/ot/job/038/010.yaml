  text: nang itinakda ko ang hangganan nito at nilagyan ko ito ng mga trangka at mga pinto,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nang itakda ko rito ang aking utos.” Karaniwang nangangahulugang “binasag” ang pandiwang Hebreo, ngunit malamang na tumutukoy ito rito sa pagtatakda ng hangganan ng dagat.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶשְׁבֹּר
  choice: itinakda
  rationale: Bagaman karaniwang nangangahulugang “binasag” ang ugat na שׁבר, mahirap ang literal na diwang iyon dito. Sa konteksto, tumutukoy ang pandiwa sa pagtatakda ng hangganan ng dagat.
- source_word: עָלָיו
  choice: nito
  rationale: Ang hulaping panlalaki ay tumutukoy sa dagat sa naunang konteksto. Likas sa Filipino ang “hangganan nito” kaysa sa literal na “sa ibabaw nito.”
- source_word: חֻקִּי
  choice: ang hangganan
  rationale: Maaaring mangahulugan ang חֹק ng batas, utos, takdang bahagi, o itinakdang hangganan. Ang “hangganan” ang pinakamalinaw sa konteksto ng pagpigil sa dagat, habang nananatili ang diwa ng banal na pagtatakda.
- source_word: וָאָשִׂים
  choice: nilagyan ko ito
  rationale: Ipinahahayag nito ang paglalagay ng Diyos ng mga panhadlang. Mas natural sa Filipino ang “nilagyan ko ito” kasunod ng mga bagay na inilagay.
- source_word: בְּרִיחַ
  choice: mga halang
  rationale: Ang בְּרִיחַ ay halang o trangka na ginagamit upang isara ang pasukan. Ang “mga halang” ay nagpapanatili sa kongkretong larawang pang-arkitektura.
- source_word: וּדְלָתָיִם
  choice: mga pinto
  rationale: Ang anyong dual ay nagpapahiwatig ng magkapares na pinto, ngunit natural at sapat sa Filipino ang “mga pinto.”
theological_decisions:
- issue: Antropomorpikong paglalarawan sa pamamahala ng Diyos sa dagat
  choice: Pinanatili ang kongkretong larawan ng Diyos na nagtatakda ng hangganan at naglalagay ng mga halang at pinto.
  alternative: Gawing abstraktong pahayag lamang tungkol sa kapangyarihan ng Diyos sa kalikasan.
  rationale: Ipinakikita ng talata ang paghahari ng Diyos sa pamamagitan ng matingkad na larawang pang-arkitektura. Pinananatili nito ang puwersang patula ng Hebreo nang hindi nilulutas o pinapaplat ang larawan.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang patulang larawan ng dagat na kinokontrol sa pamamagitan ng hangganan, mga halang, at mga pinto.
