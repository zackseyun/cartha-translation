base_translation:
  language: en
  yaml_path: translation/ot/job/038/031.yaml
  text: Can you bind the chains of the Pleiades[c][b][a], or loosen the cords of Orion?
translation:
  language: tl
  text: Kaya mo bang itali ang mga tanikala[a][b] ng Pleyades, o kalagan ang mga tali ng Orion[c]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga bigkis” o “mga panali”; dalawang magkaugnay na larawan ng pagkakatali o pagkakaugnay ng mga bagay sa langit ang ginagamit sa Hebreo.
    reason: lexical_alternative
  - marker: b
    text: Sa ilang tradisyonal na salin, ang מַעֲדַנּוֹת ay isinasaling “matatamis na impluwensiya,” ngunit mas malamang na tumutukoy ang Hebreo sa mga bigkis, panali, o tanikala.
    reason: lexical_alternative
  - marker: c
    text: Malamang na ang konstelasyong Orion ang tinutukoy rito ng כְּסִיל; sa ibang konteksto, ang salita ay maaaring mangahulugang “hangal.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתְקַשֵּׁר
  choice: Kaya mo bang itali
  rationale: Ang pantanong na anyo at Piel imperfect na ikalawang panauhang panlalaki ay bumubuo ng retorikal na tanong tungkol sa kawalan ng kakayahan ng tao. Natural sa Filipino ang “Kaya mo bang itali” at pinananatili nito ang konkretong larawan ng pagbibigkis.
- source_word: מַעֲדַנּוֹת
  choice: mga tanikala
  rationale: Bihira ang pangngalang ito at maaaring tumukoy sa mga bigkis, panali, o magkakaugnay na kawing. Sa paralelismo nito sa מֹשְׁכוֹת, malinaw at kongkreto ang “mga tanikala,” habang inilalahad sa talababa ang tunay na leksikal na kalabuan.
- source_word: כִּימָה
  choice: Pleyades
  rationale: Sa kontekstong astronomiko, karaniwang kinikilala ang כִּימָה bilang kumpol ng bituing Pleiades. Ginamit ang nakasanayang anyong Filipino na “Pleyades.”
- source_word: מֹשְׁכוֹת
  choice: mga tali
  rationale: Tumutukoy ang salita sa mga bagay na ginagamit sa paghila o pagbigkis. Ang “mga tali” ay natural, konkreto, at umaayon sa larawang ipinaparis sa mga tanikala.
- source_word: כְּסִיל
  choice: Orion
  rationale: Bagaman maaaring mangahulugang “hangal” ang karaniwang pangngalan, ang pagkakaparis nito sa כִּימָה at ang konteksto ng mga konstelasyon ay matibay na sumusuporta sa pangalang Orion.
- source_word: תְּפַתֵּחַ
  choice: kalagan
  rationale: Literal na “buksan” ang pandiwa, ngunit kapag mga tali ang layon, ang idyomatikong diwa ay “kalagan” o “luwagan.” Ang “kalagan” ay malinaw na kabaligtaran ng “itali” at nagpapanatili sa pisikal na larawan.
