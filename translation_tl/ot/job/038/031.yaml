translation_notes:
  register: Makabago, dignificado, at madaling maunawaang Filipino. Ginamit ang “Kaya mo bang” upang likas na maipahayag ang retorikal na tanong, at pinanatili ang magkatapat na konkretong larawan ng pagtatali at pagkakalag. Ang mga pangalang astronomiko ay nasa karaniwang anyong Filipino.
