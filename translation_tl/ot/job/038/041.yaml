  yaml_path: translation/ot/job/038/041.yaml
  text: Who prepares its prey for the raven when its young cry out to God and wander about for lack of food?[a][b][c]
translation:
  language: tl
  text: Sino ang naghahanda ng masisila ng uwak[a] kapag ang mga inakay nito ay dumaraing sa Diyos[b] at gumagala dahil walang makain?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “naglalaan ng pagkain para sa uwak.” Ang pandiwang Hebreo ay maaaring mangahulugang “naghahanda” o “naglalaan,” at ang “masisila” ay maaari ring isaling mas pangkalahatan bilang “pagkain.”
    reason: lexical_alternative
  - marker: b
    text: O “sapagkat dumaraing sa Diyos ang mga inakay nito.” Ang pang-ugnay ay maaari ring unawaing nagsasaad ng sanhi (“sapagkat”) sa halip na panahon o kalagayan (“kapag”).
    reason: lexical_alternative
  - marker: c
    text: O “gumagala” o “naliligaw dahil walang makain.” Ang pandiwang Hebreo ay maaaring tumukoy sa paggala o pagkaligaw habang naghahanap ng pagkain.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי
  choice: Sino
  rationale: Pananong na panghalip na nagpapakilala ng retorikal na tanong sa pahayag ng Diyos.
- source_word: יָכִין
  choice: naghahanda
  rationale: Ang Hiphil ng כון ay maaaring mangahulugang naghahanda, naglalaan, o gumagawang handa; pinananatili ng “naghahanda” ang kongkretong diwa.
- source_word: לָעֹרֵב
  choice: ng uwak
  rationale: Ang isahang may pantukoy ay tumutukoy sa uwak bilang kinatawan ng uri nito. Sa likas na ayos ng Tagalog, ang “masisila ng uwak” ay nagpapahayag ng masisilbing pagkain para rito.
- source_word: צֵידוֹ
  choice: masisila ng uwak
  rationale: Ang ציד ay nahuling hayop, masisila, o pagkaing nakukuha sa pangangaso. Pinananatili ng “masisila” ang matingkad na larawang hayop sa halip na gawing pangkalahatang “pagkain.”
- source_word: כִּי
  choice: kapag
  rationale: Ipinakikita rito ang kalagayan o panahong nahahayag ang pangangailangan ng mga inakay; nananatiling posible ang pagbasa nitong sanhi, kaya inilalagay iyon sa talababa.
- source_word: ילדיו
  choice: mga inakay nito
  rationale: Tumutukoy sa mga anak ng uwak. Ang “mga inakay” ang karaniwan at tiyak na katawagan sa mga anak ng ibon.
- source_word: אֶל אֵל
  choice: sa Diyos
  rationale: Ang אֵל ay ginagamit dito bilang karaniwang katawagan sa Diyos, hindi bilang pangalang kailangang baybayin na “El.”
- source_word: יְשַׁוֵּעוּ
  choice: dumaraing
  rationale: Ang Piel ng שוע ay tumutukoy sa malakas na paghingi ng tulong. Natural sa Tagalog ang “dumaraing sa Diyos” at pinananatili nito ang matinding pangangailangan.
- source_word: יִתְעוּ
  choice: pagala-gala
  rationale: Ang Qal ng תעה ay maaaring mangahulugang gumagala o naliligaw. Sa konteksto ng mga gutom na inakay, ipinahihiwatig ng “pagala-gala” ang paghahanap nila ng pagkain nang hindi pinipiling tiyak ang ‘naliligaw.’
- source_word: לִבְלִי אֹכֶל
  choice: dahil walang makain
  rationale: Ipinahahayag ng parirala ang kawalan ng pagkain at ang kaugnayan nito sa kanilang paggala; malinaw at natural ito sa modernong Tagalog.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “masisila” upang mapanatili ang larawang pangangaso ng ציד, at “mga inakay” bilang natural na tawag sa mga anak ng uwak. Pinanatili sa mga talababa ang tunay na kalabuan ng כִּי at תעה.
