  text: Have you come to the springs of the sea[b][a], or walked in the recesses of the deep?
translation:
  language: tl
  text: Nakarating ka na ba sa mga bukal ng dagat[a], o lumakad ka na ba sa mga kaloob-loob na bahagi ng kalaliman[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga pinagmumulan ng dagat.”
    reason: lexical_alternative
  - marker: b
    text: O “sa pinakamalayong naaabot ng kalaliman” o “sa mga tagong bahagi ng kalaliman.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲבָאתָ
  choice: Nakarating ka na ba
  rationale: Ang Qal perfect na בוא sa tanong ay likas na ipinahahayag sa Filipino bilang “Nakarating ka na ba,” na nagdidiin sa pag-abot sa isang lugar.
- source_word: עַד
  choice: sa
  rationale: Kasama ng “nakarating,” natural na ipinapakita ng “sa” ang destinasyong naabot.
- source_word: נִבְכֵי
  choice: mga bukal
  rationale: Maaaring tumukoy ang salita sa mga pinagmumulan o bukal ng tubig. Pinananatili ng “mga bukal” ang kongkreto at mahiwagang larawan ng mga nakatagong pinagmumulan ng dagat.
- source_word: יָם
  choice: dagat
  rationale: Karaniwang pangngalan ito para sa dagat at hindi pantanging pangalan sa kontekstong ito.
- source_word: וּבְחֵקֶר
  choice: o ... sa mga kaloob-loobang bahagi
  rationale: Sa paralelong retorikal na tanong, natural ang “o.” Ang חֵקֶר ay maaaring magpahiwatig ng lugar na lubusang sinasaliksik o ng pinakamalalalim at pinakatagong bahagi; ipinahahayag ito ng “mga kaloob-loobang bahagi” nang hindi inuulit lamang ang ideya ng lalim.
- source_word: תְּהוֹם
  choice: kalaliman
  rationale: Ang “kalaliman” ay nagpapanatili sa matulaing diwa ng malalim at di-maabot na katubigan, nang hindi masyadong tinutukoy ito bilang isang teolohikal na “bangin” o “abyss.”
- source_word: הִתְהַלָּכְתָּ
  choice: nakapaglakad ka na ba
  rationale: Pinananatili nito ang metapora ng Hitpael ng הלך—ang paglalakad o paglibot sa isang lugar—at ang hamon ng tanong kay Job.
