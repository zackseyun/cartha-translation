translation_notes:
  register: Makabago ngunit marangal na Filipino. Iningatan ang dalawang magkatulad na retorikal na tanong at ang matulaing larawan ng pagpunta sa mga bahaging hindi maaabot ng tao. Ang mga panandang talababa [a] at [b] ay inilagay kaagad pagkatapos ng mga pariralang nililinaw.
