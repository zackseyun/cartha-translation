  text: Do you know the ordinances of the heavens? Can you establish their rule on the earth?[a]
translation:
  language: tl
  text: Alam mo ba ang mga tuntunin ng kalangitan? Maitatatag mo ba sa lupa ang pamamahala nito?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang paghahari nito” o “ang kapangyarihan nito” sa halip na “ang pamamahala nito.” Isahan ang hulapi sa Hebreo (“nito”), at malamang na tumutukoy ito sa kalangitan bilang isang kabuuan.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲיָדַעְתָּ
  choice: Alam mo ba
  rationale: Ang pantanong na הֲ kasama ng Qal perfect ng ידע ay likas na nagpapahayag dito ng tanong tungkol sa kasalukuyang kaalaman.
- source_word: חֻקּוֹת
  choice: mga tuntunin
  rationale: Ipinahihiwatig ng חֻקּוֹת ang mga itinakdang kaayusan o hangganan. Ang “mga tuntunin” ay malinaw at marangal, at hindi ito naglilimita sa diwa sa batas ng tao.
- source_word: שָׁמָיִם
  choice: kalangitan
  rationale: Ang “kalangitan” ay natural na kolektibong katawagan sa modernong Filipino at angkop sa mataas na rehistrong kosmiko.
- source_word: אִם
  choice: Maitatakda mo ba
  rationale: Nagsisimula ang אִם ng ikalawang tanong na kapantay ng una; ipinapahayag ng anyong may “ba” ang retorikal na hamon sa natural na Filipino.
- source_word: תָּשִׂים
  choice: maitatakda
  rationale: Bagaman pangunahing nangangahulugang “ilagay” o “itakda” ang שׂים, kasama ng מִשְׁטָרוֹ ay tumutukoy ito sa pagtatatag o pagpapairal ng pamamahala.
- source_word: מִשְׁטָרוֹ
  choice: ang pamamahala nito
  rationale: Ang מִשְׁטָר ay pamamahala, kapangyarihan, o paghahari. Pinananatili ng “nito” ang pormal na isahang hulapi sa Hebreo at natural itong tumutukoy sa kolektibong “kalangitan.”
- source_word: בָאָרֶץ
  choice: sa lupa
  rationale: Sa kontekstong ito, tumutukoy ang בָאָרֶץ sa daigdig o makalupang saklaw kung saan paiiralin ang pamamahala ng kalangitan.
theological_decisions:
- issue: Kalikasan ng kaayusan ng kalangitan
  choice: Inilalarawan ng talata ang mga nakatakdang tuntunin at pamamahala ng kalangitan sa nilikha nang hindi tahasang itinataguyod ang determinismong astrolohikal.
  alternative: Tumutukoy ang talata sa impluwensiya ng mga konstelasyon o mga bituin sa mga pangyayari sa lupa.
  rationale: Ang konteksto ay tungkol sa mga bituin at kalangitan, ngunit binibigyang-diin ng mga salitang Hebreo ang itinakdang kaayusan at pamamahala. Hindi dapat magdagdag ang salin ng tiyak na pag-angkin tungkol sa astrolohiya na hindi tahasang sinasabi ng teksto.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “kalangitan” bilang kolektibong pangngalan upang mapanatiling natural ang isahang “nito,” at iniwasan ang bokabularyong labis na legalistiko o tahasang astrolohikal.
