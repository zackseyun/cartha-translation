translation:
  language: tl
  text: kapag nakadapa sila sa kanilang mga lungga at nag-aabang sa kasukalan?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa kublihan” o “sa silungan” sa halip na “sa kasukalan.” Ang salitang Hebreo rito ay tumutukoy sa isang natatakpang lugar na angkop na taguan sa pananambang, hindi sa kubol na itinatayo para sa isang kapistahan.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: kapag
  rationale: Sa pagkakasunod-sunod ng mga retorikal na tanong, ipinakikilala nito ang kalagayan o panahong kaugnay ng pangangaso.
- source_word: יָשֹׁחוּ
  choice: nakadapa
  rationale: Ipinahihiwatig ng pandiwa ang pagpapakababa ng katawan sa posisyong ginagamit ng hayop sa pangangaso; mas likas dito ang “nakadapa” kaysa “nakayuko.”
- source_word: בַמְּעוֹנוֹת
  choice: sa kanilang mga lungga
  rationale: Ang pangmaramihang מְעוֹנוֹת ay tumutukoy sa mga tirahan o lungga ng mga leon. Idinagdag ang “kanilang” upang maging likas sa Tagalog at malinaw ang tinutukoy.
- source_word: יֵשְׁבוּ ... לְמוֹ אָרֶב
  choice: nag-aabang
  rationale: Bagaman karaniwang nangangahulugang “umupo/manatili” ang יֵשְׁבוּ, kasama ng pariralang לְמוֹ אָרֶב ay inilalarawan nito ang pagpuwesto upang manambang. Likas na ipinapahayag ito ng “nag-aabang.”
- source_word: בַסֻּכָּה
  choice: sa kasukalan
  rationale: Sa konteksto, ang סֻכָּה ay isang natatakpang taguan na angkop sa pananambang, malamang ay masukal na halamanan, hindi isang kubol na itinayo para sa kapistahan.
