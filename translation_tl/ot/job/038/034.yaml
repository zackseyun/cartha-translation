  yaml_path: translation/ot/job/038/034.yaml
  text: Can you raise your voice to the clouds[b][a], so that an abundance of water covers you?
translation:
  language: tl
  text: Kaya mo bang itaas ang iyong tinig sa ulap[a], upang matakpan ka ng napakaraming tubig[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa mga ulap” o “sa makapal na ulap.” Ang pangngalang Hebreo ay nasa anyong isahan at maaaring magdiin sa isang makapal na ulap na nagdadala ng ulan.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “at matakpan ka ng rumaragasang tubig.” Ang pariralang Hebreo ay maaaring magpahiwatig ng umaapaw na kasaganaan, at ang pang-ugnay ay maaari ring isaling “at” sa halip na “upang.”
    reason: lexical_and_syntactic_alternative
lexical_decisions:
- source_word: הֲתָרִים
  choice: Kaya mo bang lakasan
  rationale: Ang anyong Hiphil ng רוּם sa tanong ay humihingi ng kakayahang ‘itaas’ ang tinig. Ang ‘lakasan’ ang natural na katumbas sa modernong Tagalog para sa pagtaas ng tinig, habang nananatili ang hamong retorikal.
- source_word: לָעָב
  choice: patungo sa ulap
  rationale: Ang עָב ay maaaring tumukoy sa isang makapal at maulang ulap o sa kalipunan ng mga ulap. Pinanatili sa teksto ang anyong isahan ng Hebreo; inilagay sa talababa ang leksikal na saklaw.
- source_word: קוֹלֶךָ
  choice: iyong tinig
  rationale: Ang קוֹל ay karaniwang ‘tinig’ kapag tumutukoy sa pagsasalita o pagtawag. Ang ‘iyong tinig’ ay tuwiran, marangal, at likas sa Tagalog.
- source_word: וְשִׁפְעַת מַיִם
  choice: saganang tubig
  rationale: Ang שִׁפְעָה ay nagpapahiwatig ng kasaganaan, pag-apaw, o napakaraming dami. Ang ‘saganang tubig’ ay nagpapanatili sa diin sa dami nang hindi ipinapalagay na mapaminsalang baha ang tiyak na kahulugan.
- source_word: תְּכַסֶּךָּ
  choice: matakpan ka
  rationale: Ang Piel ng כסה na may hulaping ikalawang panauhang panlalaki ay nangangahulugang ‘takpan ka.’ Ang ‘matakpan ka’ ay tuwiran at maayos sa resultang sugnay.
theological_decisions:
- issue: Ugnayan ng dalawang sugnay
  choice: 'Isinalin ang וְ bilang nagpapahiwatig ng resulta: ‘upang matakpan ka.’'
  alternative: 'Maaaring basahin bilang payak na pag-uugnay: ‘at matakpan ka ng saganang tubig.’'
  rationale: Ang tanong ay bahagi ng hamon tungkol sa kakayahan ng tao na pamahalaan ang panahon. Ang ‘upang’ ay natural na naghahayag ng ipinahihiwatig na bunga ng pagtawag sa ulap, ngunit itinatala sa talababa ang posibleng koordinadong pagbasa upang hindi itago ang sintaktikong kalabuan.
translation_notes:
  register: Gumamit ng modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ang ‘lakasan ang iyong tinig’ ay mas likas kaysa sa literal na ‘itaas ang iyong tinig,’ samantalang pinananatili ng ‘patungo sa ulap’ ang direksiyon ng לָעָב. Iniwasan ang ‘utusan’ sapagkat bagaman maaaring ipinahihiwatig ng konteksto ang pag-uutos sa panahon, hindi ito hayagang nasa mga salita ng talata.
