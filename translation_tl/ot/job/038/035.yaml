base_translation:
  language: en
  yaml_path: translation/ot/job/038/035.yaml
  text: Can you send out lightnings so that they go and say to you[a], ‘Here we are’ ?
translation:
  language: tl
  text: Kaya mo bang suguin ang mga kidlat[a] upang humayo sila at sabihin sa iyo, “Narito kami”?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga kislap ng kidlat.” Maramihan ang salitang Hebreo at inilalarawan ang mga kidlat na parang masunuring mga mensahero.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתְשַׁלַּח
  choice: Kaya mo bang suguin
  rationale: Ang pantanong na הֲ kasama ng Hiphil imperfect na pandiwa ay isang retorikal na hamon kay Job tungkol sa kaniyang kakayahan. Pinananatili ng “Kaya mo bang” ang pahiwatig na ito, at ang “suguin” ay angkop sa larawang sumusunod na para bang masunuring mga mensahero ang mga kidlat.
- source_word: בְּרָקִים
  choice: mga kidlat
  rationale: Likas na ipinahahayag ng “mga” ang anyong maramihan ng Hebreo. Malinaw at karaniwan ang “kidlat” sa modernong Filipino at naihahanda nito ang personipikasyong sumusunod.
- source_word: וְיֵלֵכוּ
  choice: upang humayo sila
  rationale: Ipinakikita ng “upang” ang layunin o kinalabasan ng pagsusugo, samantalang pinananatili ng “humayo” ang makatang kilos ng mga kidlat bilang mga isinugong mensahero.
- source_word: וְיֹאמְרוּ
  choice: at sabihin
  rationale: 'Tuwirang pinananatili nito ang personipikasyon: ang mga kidlat ay hindi lamang humahayo kundi nagsasalita rin bilang tugon sa nag-utos.'
- source_word: לְךָ
  choice: sa iyo
  rationale: Ito ang tuwiran at likas na salin ng pang-isahang panghalip na tumutukoy kay Job.
- source_word: הִנֵּנוּ
  choice: Narito kami
  rationale: Ito ang natural na pahayag ng pagharap, kahandaan, at pagtugon sa isang utos sa modernong Filipino, nang hindi gumagamit ng makalumang pananalita.
theological_decisions:
- issue: Personipikasyon ng kidlat sa banal na pananalita
  choice: Pinanatiling humahayo at nagsasabing “Narito kami” ang mga kidlat.
  alternative: Ilarawan lamang ang mga kidlat bilang likas na pangyayaring nasa ilalim ng kapangyarihan ng Diyos, nang walang pananalita o kilos na parang tao.
  rationale: Malinaw na pinagkakalooban ng tekstong Hebreo ang mga kidlat ng pagkilos at pagsasalita upang itanghal ang ganap na kapangyarihan ng Diyos sa sangnilikha. Makatang personipikasyon ito at hindi pahayag na literal na may isip ang kidlat.
translation_notes:
  register: Modernong Filipino na malinaw ngunit marangal at makata. Ginamit ang “suguin” at “humayo” upang mapanatili ang larawan ng mga kidlat bilang mga mensaherong agad tumutugon sa utos, nang hindi nagiging labis na makaluma.
