base_translation:
  language: en
  yaml_path: translation/ot/job/038/029.yaml
  text: From whose womb did the ice come forth[a], and who gave birth to the frost of heaven?
translation:
  language: tl
  text: 'Kaninong sinapupunan lumabas ang yelo,

    at sino ang nagsilang sa hamog na nagyelo ng langit?[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “puting hamog na nagyelo ng langit.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִבֶּטֶן מִי
  choice: Mula sa sinong sinapupunan
  rationale: Pinananatili ng “sinapupunan” ang tahasang larawan ng panganganak, at likas sa makabagong Filipino ang ayos na “mula sa sinong sinapupunan.”
- source_word: יָצָא
  choice: nagmula
  rationale: Ipinahahayag nito ang paglabas o pinagmulan nang natural sa Filipino, habang ang kasunod na “nagsilang” ang nagpapatibay sa talinghaga ng kapanganakan.
- source_word: הַקָּרַח
  choice: ang yelo
  rationale: Tuwirang katumbas ng קֶרַח ang “yelo” at sinasalamin ng pantukoy na “ang” ang tiyak na anyo sa Hebreo.
- source_word: וּכְפֹר שָׁמַיִם
  choice: at ... ang hamog na nagyelo sa langit
  rationale: Ang כְּפוֹר ay frost o hoarfrost; mas malinaw sa karaniwang mambabasa ang “hamog na nagyelo.” Ang “sa langit” ay likas na Filipino para sa ugnayang ipinahahayag ng genitibong Hebreo nang hindi inaalis ang makalangit na larawan.
- source_word: מִי יְלָדוֹ
  choice: sino ang nagsilang
  rationale: Pinananatili ng “nagsilang” ang maternal na larawan ng ילד at ang personal na anyo ng tanong na מִי.
