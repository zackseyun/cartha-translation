translation:
  language: tl
  text: upang madala mo iyon sa hangganan nito,[a] at maunawaan mo ang mga landas patungo sa bahay nito?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “iyon” at “nito” ay tumutukoy sa iisang bagay na tinutukoy sa nakapaligid na konteksto—maaaring sa liwanag o sa dilim sa magkatambal na mga tanong sa Job 38:19–20.
    reason: cross_reference
  - marker: b
    text: 'Maaari ring isalin: “at makilala mo ang mga daan patungo sa tahanan nito?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: upang
  rationale: 'Sa konteksto ng retorikal na tanong, ipinakikita nito ang layunin o bunga: kung alam ni Job ang kinaroroonan, madadala niya roon ang tinutukoy.'
- source_word: תִקָּחֶנּוּ
  choice: madala mo iyon
  rationale: Ang לקח ay maaaring mangahulugang kunin, dalhin, o akayin. Ang modal na anyong “madala mo” ay angkop sa retorikal na tanong, at pinananatili ng “iyon” ang isahang panghalip na tumutukoy sa liwanag o dilim.
- source_word: אֶל גְּבוּלוֹ
  choice: sa hangganan nito
  rationale: Karaniwang tumutukoy ang גְּבוּל sa hangganan o takdang saklaw. Pinananatili ng “hangganan” ang larawang spatial nang hindi ito ginagawang politikal na teritoryo.
- source_word: וְכִי
  choice: at
  rationale: Iniuugnay nito ang ikalawang sugnay sa una. Hindi kailangang ulitin ang “upang” sa Tagalog sapagkat saklaw pa rin nito ang magkapantay na mga sugnay.
- source_word: תָבִין
  choice: maunawaan mo
  rationale: Ang בין ay nangangahulugang umunawa o kumilala nang may pagkilatis. Natural sa Tagalog ang “maunawaan” kaugnay ng pagkaalam sa mga landas.
- source_word: נְתִיבוֹת
  choice: mga landas
  rationale: Ang נְתִיבוֹת ay mga landas, daan, o bakas. Ang “mga landas” ay kongkreto at angkop sa matulaing larawan.
- source_word: בֵּיתוֹ
  choice: bahay nito
  rationale: Literal na “bahay” ang בַּיִת. Pinananatili nito ang personipikasyon na ang liwanag o dilim ay may sariling bahay.
theological_decisions:
- issue: Ang tinutukoy ng mga isahang panghalip
  choice: Panatilihing hindi tiyak kung liwanag o dilim ang tinutukoy
  alternative: Tukuyin nang tahasan ang liwanag o ang dilim
  rationale: Isahang panlalaki ang mga hulapi sa Hebreo, ngunit dahil sa magkatambal na tanong sa Job 38:19–20, maaaring tumukoy ang mga ito sa alinman sa liwanag o dilim. Hindi nilulutas ng salin ang tunay na kalabuan ng teksto.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang spatial na larawan ng “hangganan,” “mga landas,” at “bahay,” pati ang kalabuan kung liwanag o dilim ang tinutukoy.
