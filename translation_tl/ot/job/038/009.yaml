  text: nang gawin kong damit nito ang ulap, at lampin nito ang makapal na dilim.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּשׂוּמִי
  choice: nang gawin ko
  rationale: 'Ang ב na kasunod ng infinitive construct at hulaping unang panauhan ay temporal: “nang gawin/ilagay ko.” Likas sa Tagalog ang “nang gawin ko” at malinaw ang pagkilos ng Diyos.'
- source_word: עָנָן
  choice: ang ulap
  rationale: Karaniwang katumbas ng עָנָן; ginagamit bilang damit ng dagat sa talinghaga.
- source_word: לְבֻשׁוֹ
  choice: damit nito
  rationale: Ang לְבוּשׁ ay damit o kasuotan. Pinananatili ng “damit” ang tuwirang larawan at natural ito sa makabagong Tagalog; ang hulapi ay tumutukoy sa dagat sa konteksto.
- source_word: וַעֲרָפֶל
  choice: at ang makapal na dilim
  rationale: Ipinahihiwatig ng עֲרָפֶל ang siksik o matinding dilim, kadalasa’y kaugnay ng kalagayan ng himpapawid. Napananatili ng “makapal na dilim” ang bigat ng larawang patula.
- source_word: חֲתֻלָּתוֹ
  choice: lampin nito
  rationale: Ang salita ay kaugnay ng pagbabalot o paglalampin. Ang “lampin” ay maikli, natural, at malinaw na nagpapatuloy sa larawan ng dagat bilang bagong silang sa nakapaligid na konteksto.
