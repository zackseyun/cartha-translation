translation_notes:
  register: Modernong Filipino Tagalog na patula ngunit malinaw. Ginamit ang “pantatak” sa halip na “selyo” upang maging malinaw ang larawan ng ukit na idinidiin sa luwad. Pinanatili sa talababa ang gramatikal na kalabuan ng unang pandiwa at ng hindi pinangalanang plural na simuno.
