translation:
  language: tl
  text: Nagbabago ito na parang luwad sa ilalim ng pantatak[a], at tumitindig sila na parang kasuotan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “Umiikot ito na parang luwad sa ilalim ng pantatak,” o “Binabago ito na parang luwad sa ilalim ng pantatak.” Maaaring reflexive o passive ang pandiwang Hebreo.
    reason: lexical_alternative
  - marker: b
    text: Hindi tahasang binanggit sa Hebreo ang simuno ng pandiwang maramihan. Malamang na tumutukoy ito sa mga anyo o bahagi ng lupa na nagiging malinaw sa liwanag ng bukang-liwayway; maaari ring isalin nang mas interpretatibo, “at lumilitaw ang mga anyo nito na parang kasuotan.”
    reason: textual_ambiguity
lexical_decisions:
- source_word: תִּתְהַפֵּךְ
  choice: Nagbabago ito
  rationale: Ang Hitpael ng הפך ay maaaring magpahiwatig ng pag-ikot, pagbabago sa sarili, o pagiging binago. Ang “nagbabago” ay natural sa modernong Tagalog at hindi tiyak na nagpapasya kung reflexive o passive ang diwa.
- source_word: כְּחֹמֶר חוֹתָם
  choice: na parang luwad sa ilalim ng pantatak
  rationale: Ang חֹמֶר ay luwad, at ang חוֹתָם ay pantatak o selyo. Elliptical ang parirala; ipinahihiwatig nito ang luwad na nagkakaroon ng hugis kapag diniinan ng pantatak.
- source_word: וְיִתְיַצְּבוּ
  choice: lumilitaw ang mga anyo nito
  rationale: Literal na maaaring mangahulugang “tumitindig” o “humaharap” ang plural na pandiwa. Sa konteksto ng bukang-liwayway, ipinahahayag ng “lumilitaw” ang pagiging malinaw o kapansin-pansin, habang ang “mga anyo nito” ay ginagawang nauunawaan ang hindi tahasang plural na simuno nang minamarkahan itong interpretasyon.
- source_word: כְּמוֹ לְבוּשׁ
  choice: na parang kasuotan
  rationale: Ang לְבוּשׁ ay kasuotan. Pinananatili ng salin ang singular at ang matalinghagang paghahambing.
