  yaml_path: translation/ot/job/038/001.yaml
  text: Then Yahweh answered Job out of the whirlwind and said:[a]
translation:
  language: tl
  text: 'At sumagot si Yahweh kay Job mula sa unos[a] at sinabi:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “mula sa ipuipo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן
  choice: sumagot
  rationale: Karaniwang kahulugan ng ענה sa anyong pasalaysay na ito ang “sumagot”; pinananatili rin nito ang kaugnayan sa naunang mga sinabi ni Job.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinalin ang Tetragrammaton bilang personal na pangalang “Yahweh,” sa halip na palitan ito ng isang titulo.
- source_word: אֶת אִיּוֹב
  choice: kay Job
  rationale: Hindi bukod na isinasalin ang pananda ng tuwirang layon na אֶת. Ginagamit ang “kay Job,” na likas sa Tagalog kapag ang taong sinasagot ang layon ng pandiwa.
- source_word: מִן־הַסְּעָרָה
  choice: mula sa gitna ng unos
  rationale: Ang סְעָרָה ay isang marahas na unos o bagyo at maaari ring ilarawan bilang ipuipo. Ang “unos” ay malawak, natural, at hindi labis na nagtatakda sa tiyak na anyo ng bagyo; ipinahihiwatig ng “mula sa gitna” ang tinig na nagmumula sa loob nito.
- source_word: וַיֹּאמַר
  choice: Sinabi niya
  rationale: Tuwirang isinasalin ang kasunod na pandiwang אמר at inuulit ang diwa ng sunod-sunod na kilos nang hindi nagiging alanganin ang dalawang magkasunod na “at” sa Tagalog.
theological_decisions:
- issue: Paglalarawan sa banal na pangalan na יְהוָה
  choice: Yahweh
  alternative: Jehovah; ang PANGINOON
  rationale: Personal na pangalan ang tahasang nasa Hebreo. Pinananatili ng “Yahweh” ang pangalan sa halip na palitan ito ng titulong “ang PANGINOON.”
- issue: Tiyak na larawan ng סְעָרָה sa pagpapakita ng Diyos
  choice: unos
  alternative: ipuipo; malakas na bagyo
  rationale: Maaaring tumukoy ang salita sa marahas na bagyo, unos, o ipuipo. Hindi sapilitang nililimitahan ng talata ang larawan sa isang ipuipo, kaya “unos” ang nasa pangunahing teksto at inilalagay sa talababa ang mas tiyak na posibleng salin.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “unos” bilang madaling maunawaang salitang pampanitikan na angkop sa maringal na tagpo, habang iniwasan ang sobrang teknikal o sektaryong pananalita.
