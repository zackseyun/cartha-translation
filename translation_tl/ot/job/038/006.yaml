lexical_decisions:
- source_word: עַל מָה
  choice: Sa ibabaw ng ano
  rationale: Pinananatili nito ang tanong tungkol sa bagay na pinagsasaligan, pati ang konkretong larawang taglay ng pang-ukol na עַל.
- source_word: אֲדָנֶיהָ
  choice: ang mga patungan nito
  rationale: Ang אֶדֶן ay tumutukoy sa konkretong base, pedestal, o salukang pundasyon. Ang “mga patungan” ay likas sa modernong Filipino at hindi ginagawang abstrakto ang larawang panggusali.
- source_word: הָטְבָּעוּ
  choice: ibinaon
  rationale: Ang Hophal ng טָבַע ay nagpapahayag na ang mga patungan ay pinalubog o ibinaon. Ang “ibinaon” ay nagpapanatili sa diwang pasibo at sa matingkad na larawan ng pagkakabit nang malalim.
- source_word: אוֹ
  choice: o
  rationale: Payak na pangatnig na nag-uugnay sa dalawang retorikal na tanong.
- source_word: מִי
  choice: sino
  rationale: Tuwirang katumbas ng panghalip na pananong.
- source_word: יָרָה
  choice: naglatag
  rationale: Bagaman literal na maaaring mangahulugang naghagis o naghulog ang יָרָה, sa larawang pangkonstruksiyon ay tumutukoy ito sa paglalagay ng batong-panulok. Ang “naglatag” ay natural at angkop sa idyoma.
- source_word: אֶבֶן פִּנָּתָהּ
  choice: batong-panulok nito
  rationale: Pinananatili ng “batong-panulok” ang konkretong terminong panggusali at malinaw na inuugnay ng “nito” ang bato sa lupa na tinutukoy sa konteksto.
theological_decisions:
- issue: Larawang panggusali para sa paglalang sa lupa
  choice: Panatilihin ang mga patungan at batong-panulok bilang konkretong metapora.
  alternative: Isalin nang mas malaya bilang “Ano ang sumusuporta sa lupa?”
  rationale: Bahagi ito ng patulang pagtatanong ng Diyos kay Job. Ang pagpapanatili sa larawang panggusali ay tapat sa Hebreo at umiiwas sa pagpasok ng abstraktong paliwanag tungkol sa kosmolohiya.
translation_notes:
