translation:
  language: tl
  text: Naibunyag na ba sa iyo ang mga pintuan ng kamatayan, o nakita mo na ba ang mga pintuan ng matinding kadiliman[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “lilim ng kamatayan.” Tradisyonal na isinasalin sa ganitong paraan ang Hebreong צַלְמָוֶת, ngunit maaari rin itong tumukoy sa matinding kadiliman o panglaw sa mas pangkalahatang diwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲנִגְלוּ לְךָ
  choice: Naipakita na ba sa iyo
  rationale: 'Ang הֲ ay naghuhudyat ng retorikal na tanong, at ang Niphal perfect ng גלה ay may diwang pasibo: ang mga pintuan ay ipinakita o ibinunyag sa kausap. Likas sa modernong Tagalog ang “naipakita na ba sa iyo” at pinananatili nito ang tinutukoy na karanasang hindi taglay ni Job.'
- source_word: שַׁעֲרֵי מָוֶת
  choice: ang mga pintuan ng kamatayan
  rationale: Tuwirang pinananatili ang konkretong larawan ng mga pasukan sa nasasakupan ng kamatayan; ang pangmaramihang anyo ay kaayon ng Hebrew construct plural.
- source_word: וְשַׁעֲרֵי
  choice: o ... ang mga pintuan
  rationale: Bagaman karaniwang “at” ang וְ, gumaganap itong panugtong sa magkatambal na retorikal na mga tanong. Mas natural sa Tagalog ang “o” nang hindi binabago ang diwa ng parallelism.
- source_word: צַלְמָוֶת
  choice: matinding kadiliman
  rationale: Maaaring tumukoy ang צַלְמָוֶת sa napakalalim na dilim o panglaw, hindi lamang sa literal na kamatayan. Pinananatili ng “matinding kadiliman” ang nakatatakot at tila-daigdig-ng-mga-patay na larawan sa konteksto nang hindi labis na nililimitahan ang kahulugan.
- source_word: תִּרְאֶה
  choice: nakita mo na ba
  rationale: Ang Qal imperfect na ikalawang panlalaking isahan ay binigyang anyong tanong na ganap sa Tagalog upang umayon sa unang sugnay at itanong kung naranasan na ni Job na makita ang mga pintuang ito.
