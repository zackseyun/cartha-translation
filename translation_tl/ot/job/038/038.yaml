translation:
  language: tl
  text: kapag ang alabok ay tumitigas at nagiging isang matigas na masa[a], at ang mga tipak ng lupa ay nagdidikit-dikit?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kapag ang alabok ay ibinubuhos upang maging isang matigas na masa” / “kapag ang alabok ay tumitigas na gaya ng hinulmang metal.” Gumagamit ang Hebreo ng larawan ng pagbubuhos o paghuhulma upang ilarawan ang pagsiksik at pagtigas ng lupa.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּצֶקֶת
  choice: kapag ... tumitigas
  rationale: Sa konteksto, ipinakikilala ng anyo ang isang sugnay na panahunan. Bagaman may larawang kaugnay ng pagbubuhos o paghuhulma, ang diwa rito ay ang pagsiksik at pagtigas ng lupa.
- source_word: עָפָר
  choice: ang alabok
  rationale: Karaniwang tumutukoy ang עָפָר sa alabok o maluwag na lupa; pinananatili ng “alabok” ang payak at kongkretong larawan.
- source_word: לַמּוּצָק
  choice: nagiging isang buo
  rationale: Ipinahihiwatig ng salitang mula sa יצק ang bagay na ibinuhos o hinulma at naging solidong masa. Likas sa Filipino ang “nagiging isang buo” para sa resulta nang hindi labis na ipinapasok ang larawan ng metal.
- source_word: וּרְגָבִים
  choice: at ang mga tipak ng lupa
  rationale: Ang רְגָבִים ay mga namuong bukol o tipak ng lupa; malinaw at pangkaraniwan ang “mga tipak ng lupa.”
- source_word: יְדֻבָּקוּ
  choice: nagdidikit-dikit
  rationale: Ipinahahayag ng anyo na ang mga tipak ng lupa ay kumakapit sa isa’t isa. Natural at malinaw sa modernong Filipino ang “nagdidikit-dikit.”
