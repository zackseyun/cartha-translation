  text: upang hawakan nito ang mga dulo ng lupa[a], at maipagpag mula rito ang masasama[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga sulok ng lupa.” Literal sa Hebreo ang “mga pakpak/mga dulong bahagi ng lupa,” isang matalinghagang larawan ng mga pinakadulo nito.
    reason: lexical_alternative
  - marker: b
