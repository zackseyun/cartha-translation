lexical_decisions:
- source_word: לֶאֱחֹז
  choice: upang hawakan nito
  rationale: Ang infinitive construct na may ל ay nagpapahayag ng layunin o bunga kaugnay ng bukang-liwayway sa naunang talata. Pinananatili ng “hawakan” ang kongkretong larawan ng pagkapit nang hindi dinaragdagan ang tindi nito.
- source_word: בְּכַנְפוֹת
  choice: ang mga dulo
  rationale: Literal na “mga pakpak,” ngunit sa idyomang patula kasama ng הָאָרֶץ tumutukoy ito sa mga dulong bahagi o hangganan ng lupa. Likas at malinaw sa modernong Filipino ang “mga dulo.”
- source_word: הָאָרֶץ
  choice: ng lupa
  rationale: Kosmiko ang konteksto ng pananalita tungkol sa paglikha at bukang-liwayway, kaya tumutukoy ito sa buong lupa, hindi lamang sa isang lupain.
- source_word: וְיִנָּעֲרוּ
  choice: at mayanig
  rationale: Ang Niphal ng נער ay nagpapahiwatig na ang masasama ay niyayanig upang maalis. Pinananatili ng “mayanig” ang pasibong diwa at ang imahen ng pagpag, habang ang kasunod na “mula rito” ay naghahayag ng pag-aalis.
- source_word: רְשָׁעִים
  choice: ang masasama
  rationale: Tumutukoy ang substantibong pang-uri sa mga taong masama. Ang “ang masasama” ay maikli, karaniwan, at hindi nagdaragdag ng paliwanag.
- source_word: מִמֶּנָּה
  choice: mula rito
  rationale: Ang pambabaeng isahang hulapi ay tumutukoy pabalik sa lupa. Natural sa Filipino ang “mula rito” at pinananatili nito ang ideya ng pag-aalis mula sa lupa.
