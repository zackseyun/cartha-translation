  yaml_path: translation/ot/job/038/028.yaml
  text: Does the rain have a father[a], or who has begotten the drops of dew?
translation:
  language: tl
  text: May ama ba ang ulan, o sino ang naging ama ng mga patak ng hamog?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֲיֵשׁ לַמָּטָר
  choice: May ... ba ang ulan
  rationale: Ang הֲיֵשׁ ay bumubuo ng tanong na masasagot ng oo o hindi, at ang לַמָּטָר ay nagsasaad dito ng kaugnayang pag-aari. Likas sa modernong Tagalog ang hulma na “May ama ba ang ulan?”
- source_word: אָב
  choice: ama
  rationale: Pinananatili ng “ama” ang tahasang paternal na larawan at ang kaugnayan nito sa pagsilang sa kasunod na sugnay.
- source_word: אוֹ מִי
  choice: o sino
  rationale: Tuwirang pinananatili ang pang-ugnay na disjunctive at ang pananong na panghalip.
- source_word: הוֹלִיד
  choice: nagsilang
  rationale: Ang Hiphil ng ילד ay nangangahulugang mag-anak o magsilang. Ang “nagsilang” ay malinaw, marangal, at likas sa kasalukuyang Tagalog habang pinananatili ang larawang panganganak, nang hindi nililimitahan ang di-tiyak na “sino” sa isang kasarian.
- source_word: אֶגְלֵי טָל
  choice: mga patak ng hamog
  rationale: Tumpak at natural na katumbas ng construct phrase na tumutukoy sa magkakahiwalay na patak ng hamog.
theological_decisions:
- issue: Pagkatao ng pinagmulan ng ulan at hamog
  choice: Pinanatili ang mga larawang “ama” at “nagsilang” bilang retorikal na tanong.
  alternative: Isalin nang abstrakto bilang “pinagmulan” o “lumikha.”
  rationale: Hindi tahasang sinasabi ng Hebreo sa talatang ito ang sagot o ginagamit ang teknikal na katawagang “lumikha.” Ang konkretong metapora ng pagiging ama at pagsilang ay dapat manatili upang hindi maagang lutasin ang retorikal at teolohikal na diin.
translation_notes:
  register: Modernong Filipino Tagalog na payak ngunit marangal at patula. Pinanatili ang iisang pangungusap at ang “o” ng Hebreo. Walang footnote dahil walang makabuluhang leksikal o tekstuwal na alternatibong kailangang ilahad sa talatang ito.
