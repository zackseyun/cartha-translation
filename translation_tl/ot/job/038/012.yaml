  text: הְֽ֭/מִ/יָּמֶי/ךָ צִוִּ֣יתָ בֹּ֑קֶר ידעתה שחר מְקֹמֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/038/012.yaml
  text: Have you[a], in your days, commanded the morning[b], and caused the dawn to know its place?
translation:
  language: tl
  text: Kailanman ba sa buhay mo[a] ay inutusan mo ang umaga at ipinaalam sa bukang-liwayway ang lugar nito?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal na Hebreo, “mula sa iyong mga araw,” isang paraang tumutukoy sa anumang panahon mula nang magsimula ang buhay ng isang tao.
    reason: cultural_note
  - marker: b
    text: 'Ang pandiwang Hebreo ay causative: “pinangyaring malaman ng bukang-liwayway ang lugar nito.” Maaari ring isalin, “itinuro sa bukang-liwayway ang lugar nito.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲמִיָּמֶיךָ
  choice: Kailanman ba sa buhay mo
  rationale: Ang pariralang Hebreo na may מִן at “iyong mga araw” ay nagtatanong kung nagawa ito ni Job sa alinmang panahon ng kanyang buhay. Likas sa modernong Tagalog ang “kailanman ba sa buhay mo” habang pinananatili ang lawak ng tanong.
- source_word: צִוִּיתָ
  choice: inutusan mo
  rationale: Karaniwang kahulugan ng צוה ang mag-utos. Ang “inutusan” ay malinaw at nagpapanatili sa larawang ang umaga ay sakop ng makapangyarihang utos.
- source_word: בֹּקֶר
  choice: ang umaga
  rationale: Tumutukoy ito sa umaga bilang personipikadong bahagi ng kaayusan ng sangnilikha.
- source_word: יָדַעְתָּה
  choice: ipinaalam
  rationale: 'Ang anyong Hiphil ng ידע ay causative: pinangyayari na malaman ng bukang-liwayway ang lugar nito. Ang “ipinaalam” ay maikli, natural, at nagpapanatili sa causative na diwa.'
- source_word: שַׁחַר
  choice: bukang-liwayway
  rationale: Ang שחר ay bukang-liwayway o pagsikat ng araw. Pinananatili ng salitang ito ang makatang pagkakaiba nito sa בֹּקֶר, “umaga.”
- source_word: מְקוֹמוֹ
  choice: ang lugar nito
  rationale: Tuwirang kahulugan ng מקום ang “lugar.” Hindi idinagdag ang “itinakdang” sapagkat wala itong tahasang katumbas sa teksto.
theological_decisions: []
translation_notes:
  register: Makabago at marangal na Tagalog na angkop sa patulang hamon ng Diyos kay Job. Ginamit ang “bukang-liwayway” upang mapanatili ang paralelismo ngunit maiba ito sa “umaga”; pinanatili rin ang personipikasyon ng dalawang ito.
