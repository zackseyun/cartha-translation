  yaml_path: translation/ot/job/038/022.yaml
  text: Have you entered the storehouses of the snow[a], or have you seen the storehouses of the hail?
translation:
  language: tl
  text: Nakarating ka na ba sa mga imbakan ng niyebe,[a] o nakita mo na ba ang mga imbakan ng graniso?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga kabang-yaman ng niyebe ... mga kabang-yaman ng graniso.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲבָאתָ אֶל
  choice: Nakapunta ka na ba sa
  rationale: Ang interrogative na הֲ at perfect na anyo ng בוא ay bumubuo ng retorikal na tanong tungkol sa pagpunta sa isang lugar. Mas natural sa modernong Tagalog ang “nakapunta ... sa” kaysa “nakapasok ... sa,” habang pinananatili ang direksiyonal na diwa ng אֶל.
- source_word: אֹצְרוֹת
  choice: mga kamalig
  rationale: Ang אֹצָר ay imbakan, kamalig, o kabang-yaman. Ang “mga kamalig” ay malinaw at kongkretong larawan ng lugar na pinag-iimbakan ng niyebe at graniso; iniiwasan din nito ang pangunahing makapanalaping dating ng “mga kabang-yaman.”
- source_word: שָׁלֶג
  choice: niyebe
  rationale: Karaniwang modernong salin ng terminong tumutukoy sa snow.
- source_word: וְאֹצְרוֹת
  choice: o ... ang mga kamalig
  rationale: Bagaman karaniwang “at” ang וְ, dito ay pinag-uugnay nito ang dalawang magkatambal na bahagi ng iisang retorikal na tanong. Natural sa Tagalog ang “o” sa ganitong ayos.
- source_word: בָּרָד
  choice: graniso
  rationale: Karaniwang salitang Filipino para sa hail.
- source_word: תִּרְאֶה
  choice: nakita mo na ba
  rationale: Bagaman imperfect ang anyo, ang pandiwa ay kasabay ng naunang retorikal na tanong. Ang “nakita mo na ba” ay natural at pinananatili ang kaibahan ng pagpunta at pagkakita.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “kamalig” upang mapanatili ang kongkretong metapora ng mga nakalaang imbakan ng mga pangyayari sa panahon. Inilagay ang pananda [a] kaagad pagkatapos ng “niyebe” upang tumugma sa alternatibong leksikal na sumasaklaw sa parehong paglitaw ng אֹצְרוֹת.
