    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתֹצִיא
  choice: Mailalabas mo ba
  rationale: Ipinahahayag nito ang sanhi o pagpapalabas na diwa ng Hiphil ng יצא at ang retorikal na tanong tungkol sa kakayahang pamahalaan ang mga bagay sa langit.
- source_word: מַזָּרוֹת
  choice: Maz zarot
  rationale: Bihira at hindi tiyak ang katawagang astronomiko. Pinanatili sa transliterasyon upang hindi ito sapilitang tukuyin bilang mga konstelasyon o zodiac.
- source_word: בְּעִתּוֹ
  choice: sa kapanahunan nito
  rationale: Tumutukoy sa angkop na panahon ng paglitaw nito; natural sa Filipino at hindi nagdaragdag ng higit na katiyakan kaysa nasa Hebreo.
- source_word: וְעַיִשׁ
  choice: Ayish
  rationale: Hindi tiyak ang tinutukoy na bituin o konstelasyon. Ang transliterasyon ay umiiwas sa di-tiyak na pagkakakilanlan dito bilang Arcturus o ang Oso.
- source_word: עַל בָּנֶיהָ
  choice: kasama ang mga anak nito
  rationale: Pinananatili ang larawang pampamilya ng Hebreong ‘mga anak niya,’ na malamang na tumutukoy sa mga kasamang bituin. Walang kasariang panghalip sa Filipino, kaya ginamit ang ‘nito.’
- source_word: תַנְחֵם
  choice: mapapatnubayan mo ba
  rationale: Ang Hiphil ng נחה ay nangangahulugang umakay o pumatnubay. Ang ‘mapapatnubayan’ ay angkop sa larawan ng paggabay sa isang konstelasyon at nagpapanatili sa tanong tungkol sa kakayahan.
