  text: Mailalabas mo ba ang Mazzaroth[a] sa takdang panahon nito, o mapapatnubayan mo ba ang Ayish[b] kasama ang mga anak nito?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Mazzaroth ay isang bihira at hindi tiyak na katawagang astronomiko sa Hebreo; maaaring tumukoy ito sa mga konstelasyon o sa zodiac.
