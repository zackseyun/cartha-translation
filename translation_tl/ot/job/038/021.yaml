  yaml_path: translation/ot/job/038/021.yaml
  text: You know[a], for then you were born, and the number of your days is great!
translation:
  language: tl
  text: Alam mo nga, sapagkat isinilang ka na noon, at napakarami na ng iyong mga araw![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa literal: “at ang bilang ng iyong mga araw ay marami.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָדַעְתָּ
  choice: Alam mo nga
  rationale: Ang Qal perfect 2ms ay maaaring pormal na tumukoy sa nakaraan, ngunit sa mapanuyang tanong ng Diyos, ang kasalukuyang “Alam mo nga” ay likas na naghahatid ng retorikal na diin.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala nito ang mapanuyang paliwanag sa naunang tanong; pinananatili ng “sapagkat” ang ugnayang nagpapaliwanag.
- source_word: אָז
  choice: noon
  rationale: Tumutukoy ito sa panahong binanggit sa mga naunang talata, kaya mas natural sa Filipino ang “noon” kaysa “pagkatapos.”
- source_word: תִּוָּלֵד
  choice: isinilang ka na
  rationale: Ang Niphal imperfect 2ms ay ginagamit dito nang retorikal na may pagtukoy sa nakaraan; ipinahihiwatig ng “na” ang mapanuyang pag-aakalang buhay na si Job noon.
- source_word: וּמִסְפַּר יָמֶיךָ רַבִּים
  choice: at napakarami na ng iyong mga araw
  rationale: Natural na Filipino ito para sa literal na “at ang bilang ng iyong mga araw ay marami/dakila,” habang pinananatili ang ironiyang napakatanda na sana ni Job.
theological_decisions:
- issue: Ang mapanuyang pahayag tungkol sa kaalaman at edad ni Job
  choice: Alam mo nga ... isinilang ka na noon ... napakarami na ng iyong mga araw!
  alternative: Alam mo ba ... sapagkat isinilang ka noon?
  rationale: Pahayag, hindi tahasang tanong, ang anyong Hebreo. Pinananatili ang mapanuyang katiyakan nang hindi ito ginagawang karagdagang tanong o nilulutas ang retorikal na tensiyon.
translation_notes:
  register: Makabago at marangal na Filipino, na may malinaw na mapanuyang diin. Ginamit ang “sapagkat” upang panatilihin ang lohikal na ugnayan at ang “noon” para sa temporal na אָז.
