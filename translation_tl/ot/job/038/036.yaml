  text: Who has put wisdom in the inward parts[a], or who has given understanding to the mind?
translation:
  language: tl
  text: Sino ang naglagay ng karunungan sa kaloob-looban[a], o sino ang nagbigay ng pagkaunawa sa isip?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O maaaring: “Sino ang naglagay ng karunungan sa mga nakatagong bahagi, o sino ang nagbigay ng pagkaunawa sa tandang?” May mga nagpapakahulugan sa ikalawang katawagan bilang isang ibon—ayon sa kaugalian, “tandang,” at kung minsan ay “ibis”—sa halip na isip.'
    reason: alternative_reading
lexical_decisions:
- source_word: מִי
  choice: Sino
  rationale: Ang panghalip na pananong ay angkop sa retorikal na tanong ng Diyos.
- source_word: שָׁת
  choice: naglagay
  rationale: Likas na salin ng pandiwang nangangahulugang maglagay o magtakda, at kaagapay ng “nagbigay” sa ikalawang sugnay.
- source_word: בַּטֻּחוֹת
  choice: sa kaloob-looban
  rationale: Mahirap tiyakin ang eksaktong tinutukoy ng salita; ipinahihiwatig nito ang panloob o nakatagong bahagi. Pinananatili ng “kaloob-looban” ang matalinghagang diwang panloob nang hindi nakalilinlang sa sobrang literal na “mga bato.”
- source_word: חָכְמָה
  choice: karunungan
  rationale: Karaniwang katumbas na malinaw at marangal sa modernong Tagalog.
- source_word: אוֹ
  choice: o
  rationale: Tuwirang pangatnig na nag-uugnay sa magkatulad na mga sugnay.
- source_word: נָתַן
  choice: nagbigay
  rationale: Karaniwang salin sa kontekstong ito at natural na katambal ng “naglagay.”
- source_word: לַשֶּׂכְוִי
  choice: sa isip
  rationale: Lubhang pinagtatalunan ang pangngalan. Sinusuportahan ng paralelismo sa “kaloob-looban” at ng “karunungan/pagkaunawa” ang kahulugang panloob na kakayahan, ngunit inilalahad sa talababa ang posibleng pagtukoy sa isang ibon.
- source_word: בִינָה
  choice: pagkaunawa
  rationale: Natural na katumbas na pinananatili ang pagkakaiba nito sa “karunungan” at ang diwa ng pag-unawa o pagkilatis.
theological_decisions:
- issue: Pagpapakahulugan sa dalawang mahirap na katawagang maaaring tumukoy sa mga panloob na kakayahan o sa likas na kaalaman ng isang ibon
  choice: Inilalarawan ng talata ang paglalagay ng karunungan at pagkaunawa sa kaloob-looban at isip.
  alternative: Maaaring tumukoy ang talata sa pagbibigay ng likas na kaalaman sa tandang o ibis.
  rationale: Mas sinusuportahan ng paralelismo ng dalawang sugnay ang mga panloob na kakayahan, ngunit matagal nang kinikilalang posible ang pagbasa na tumutukoy sa ibon. Kaya pinanatili ang alternatibo sa talababa sa halip na tuluyang lutasin ang tunay na kalabuan.
translation_notes:
  register: Modernong Filipino Tagalog na natural, marangal, at madaling maunawaan. Ginamit ang “kaloob-looban” upang mapanatili ang panloob at bahagyang matalinghagang diwa ng unang mahirap na termino; inilagay sa talababa ang lehitimong alternatibong pagbasa.
