  yaml_path: translation/ot/job/038/011.yaml
  text: and I said[a], ‘You may come this far, and no farther; here your proud waves shall stop.’
translation:
  language: tl
  text: at sinabi ko, “Hanggang dito ka lamang darating at hindi na lalampas; dito mapipigil ang iyong mapagmataas na mga alon.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאֹמַר
  choice: at sinabi ko
  rationale: Ang Qal wayyiqtol na unang panauhang isahan ay nagpapatuloy sa salaysay ng ginawa ng Diyos; natural itong isalin bilang payak na nakaraang kilos.
- source_word: עַד פֹּה תָבוֹא
  choice: Hanggang dito ka lamang darating
  rationale: Pinananatili ang hangganang panlunan at ang tuwirang pakikipag-usap sa dagat; ang “lamang” ay nagpapalinaw sa itinakdang saklaw.
- source_word: וְלֹא תֹסִיף
  choice: at hindi na lalampas
  rationale: Bagaman literal na may diwang “hindi na magdaragdag/magpapatuloy,” sa konteksto ng hangganan ang “hindi na lalampas” ang natural at tumpak na Filipino.
- source_word: וּפֹא יָשִׁית
  choice: dito mapipigil
  rationale: Ang יָשִׁית ay literal na “ilalagay/itatakda,” ngunit dito ay tumutukoy sa puntong itinakda sa paghadlang sa mga alon. Ang pasibong “mapipigil” ay likas sa Filipino at hindi nagdaragdag ng tahasang simuno.
- source_word: בִּגְאוֹן גַּלֶּיךָ
  choice: ang iyong mapagmataas na mga alon
  rationale: Ang גאון ay maaaring tumukoy sa kapalaluan, kadakilaan, o mapagmataas na pag-alsa. Ang “mapagmataas” ay nagpapanatili sa personipikasyon at sa larawan ng umaalimbukay na mga alon.
theological_decisions:
- issue: Personipikasyon ng dagat sa ilalim ng utos ng Diyos
  choice: Pinanatili ang ikalawang panauhang pakikipag-usap sa dagat at ang wikang nagtatakda ng hangganan.
  alternative: Gawing ganap na di-personal ang dagat bilang puwersa lamang ng kalikasan.
  rationale: Tuwirang kinakausap ng Hebreo ang dagat bilang “ikaw.” Ang poetikong personipikasyong ito ay nagpapatingkad sa kapangyarihan ng Diyos sa sangnilikha nang hindi ginagawang hiwalay na diyos o karibal ang dagat.
- issue: Kahulugan ng יָשִׁית sa huling linya
  choice: Isinalin ayon sa kontekstuwal na diwang “mapipigil.”
  alternative: Mas literal na “ilalagay/itatakda” ang kapalaluan ng mga alon.
  rationale: 'May tunay na tensiyon sa sintaks at leksikon: literal na nangangahulugang “maglagay/magtakda” ang pandiwa, ngunit inilalarawan ng konteksto ang lugar kung saan hinahadlangan ang mga alon. Pinili ang malinaw na kontekstuwal na diwa nang hindi nagpasok ng tiyak na di-binanggit na tagaganap.'
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Pinanatili ang poetikong personipikasyon ng dagat. Ginamit ang “mapagmataas” sa halip na mas abstraktong “kapalaluan” upang natural na iugnay ang גאון sa “mga alon.”
