lexical_decisions:
- source_word: אֲשֶׁר
  choice: na
  rationale: Nagpapasimula ng sugnay na tumutukoy sa niyebe at graniso sa naunang talata; likas sa Filipino ang pang-ugnay na “na.”
- source_word: חָשַׂכְתִּי
  choice: inilaan ko
  rationale: Ipinahihiwatig ng pandiwa ang sadyang pagpigil o pagtatabi para sa gamit sa hinaharap. Ang “inilaan” ay natural at pinananatili ang layuning ito.
- source_word: לְעֶת צָר
  choice: para sa panahon ng kagipitan
  rationale: Ang לְ ay nagpapahayag ng layunin o itinakdang pagkakataon, at ang צָר ay tumutukoy sa kagipitan, hirap, o kapahamakan.
- source_word: לְיוֹם
  choice: para sa araw ng
  rationale: Pinananatili ang paralelismo sa “para sa panahon” at ang temporal na larawan ng Hebreo.
- source_word: קְרָב
  choice: labanan
  rationale: Karaniwan at malinaw na katumbas ng terminong militar para sa battle o combat.
- source_word: וּמִלְחָמָה
  choice: at digmaan
  rationale: Pinananatili ang magkatabing magkakaugnay na salitang militar sa Hebreo sa halip na pagsamahin ang mga ito.
theological_decisions:
- issue: Paggamit ng Diyos sa mga puwersa ng kalikasan sa larawan ng paghatol
  choice: Pinanatili ang tuwirang diwa na inilaan ng Diyos ang mga ito para sa panahon ng kagipitan at digmaan.
  alternative: Ituring ang pananalita bilang purong metapora lamang para sa pagkalinga o pamamahala ng Diyos, nang walang tunay na sangguniang militar.
  rationale: Tahasang binabanggit ng teksto ang “araw ng labanan at digmaan”; hindi ito dapat palambutin o ipaliwanag nang lampas sa sinasabi ng talata.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Isinama ang tandang pananong sapagkat nagpapatuloy ang tanong mula sa naunang talata sa konteksto ng Job 38:22–23.
