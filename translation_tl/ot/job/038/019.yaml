lexical_decisions:
- source_word: אֵי זֶה
  choice: Nasaan
  rationale: Ang pariralang patanong ay humihingi ng lokasyon o direksiyon. Likas sa modernong Tagalog ang “Nasaan” sa dalawang magkatimbang na tanong.
- source_word: הַדֶּרֶךְ
  choice: ang daan
  rationale: Pinananatili ng “daan” ang konkretong larawan ng isang rutang maaaring tahakin patungo sa kinaroroonan ng liwanag.
- source_word: יִשְׁכָּן
  choice: patungo sa tahanan
  rationale: Ang pandiwa ay nangangahulugang manahan o tumira. Ginawang pariralang patutunguhan upang maging natural ang ugnayan nito sa “daan,” habang pinananatili ang larawang may tirahan ang liwanag.
- source_word: אוֹר
  choice: liwanag
  rationale: Karaniwang katumbas na angkop sa kosmikong paghahambing sa dilim.
- source_word: וְחֹשֶׁךְ
  choice: at ... dilim
  rationale: Pinananatili ang payak na pangatnig at ang malinaw na pagtutulad ng liwanag at dilim.
- source_word: מְקוֹמוֹ
  choice: ang kinaroroonan ng dilim
  rationale: Ipinahahayag nito ang “lugar nito,” na ang hulaping panghalip ay tumutukoy sa dilim. Mas malinaw ito kaysa “lugar ng dilim,” na maaaring unawaing isang lugar lamang na madilim.
