  text: Where is the way to the dwelling of light[a], and where is the place of darkness,
translation:
  language: tl
  text: Nasaan ang daang patungo sa tahanan ng liwanag,[a] at nasaan ang kinaroroonan ng dilim?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O kaya, mas pormal, “Alin ang daan patungo sa lugar na tinitirhan ng liwanag, at ang dilim—nasaan ang lugar nito?”
