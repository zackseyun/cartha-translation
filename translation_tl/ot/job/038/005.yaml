  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang retorikal na tanong at ang metaporang pangkonstruksiyon; ginamit ang gitling na pahaba upang maihiwalay ang singit na “kung alam mo.”
