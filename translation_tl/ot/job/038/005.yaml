  yaml_path: translation/ot/job/038/005.yaml
  text: Who set its measurements[a], if you know, or who stretched a line upon it?
translation:
  language: tl
  text: Sino ang nagtakda ng mga sukat nito[a]—kung alam mo—o sino ang nag-unat ng panukat na pisi sa ibabaw nito?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga dimensiyon nito.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי
  choice: Sino
  rationale: Pananong na panghalip na naghaharap ng retorikal na tanong ng Diyos.
- source_word: שָׂם
  choice: nagtakda
  rationale: Ipinahihiwatig ng pandiwa ang pagtatakda o paglalagay ng mga sukat ng lupa; natural ang “nagtakda” sa larawang pangkonstruksiyon.
- source_word: מְמַדֶּיהָ
  choice: mga sukat nito
  rationale: Ang pambabaeng isahang hulapi ay tumutukoy sa lupa sa konteksto, at ang pangmaramihang pangngalan ay tumutukoy sa mga dimensiyon o sukat nito.
- source_word: כִּי תֵדָע
  choice: kung alam mo
  rationale: Pinananatili ang anyong kondisyonal at ang retorikal na diin nang hindi tahasang dinaragdagan ng interpretasyong “tiyak na alam mo.”
- source_word: אוֹ
  choice: o
  rationale: Payak na pangatnig na nagdurugtong sa magkatulad na mga tanong.
- source_word: נָטָה
  choice: nag-unat
  rationale: Sa konteksto ng pagtatayo at pagsukat, tumutukoy ito sa pag-uunat ng isang pisi o linya.
- source_word: עָלֶיהָ
  choice: sa ibabaw nito
  rationale: Pinananatili ang larawang spatial ng paglalatag o pag-uunat ng panukat sa lupa.
- source_word: קָּו
  choice: panukat na pisi
  rationale: Sa kontekstong pangkonstruksiyon, ang salita ay tumutukoy sa pisi o linyang ginagamit sa pagsukat; mas malinaw at natural sa Tagalog ang “panukat na pisi.”
