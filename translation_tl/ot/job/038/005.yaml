  source_fidelity: 'Tapat ang salin sa Hebreo: ang dalawang retorikal na tanong, ang mga sukat ng lupa, ang parentetikong “kung alam mo,” at ang larawan ng pag-uunat ng panukat na pisi ay nananatili. Ang “sa ibabaw nito” ay katanggap-tanggap na paglalapat ng עָלֶיהָ nang hindi nagdaragdag ng direksiyong wala sa teksto.'
