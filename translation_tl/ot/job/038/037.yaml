  text: Who can count the clouds with wisdom[a], or tip over the jars of the heavens?
translation:
  language: tl
  text: 'Sino ang makabibilang ng mga ulap nang may karunungan,

    at sino ang makapagtagilid ng mga sisidlan[a] ng langit?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga tapayan” o “mga sisidlang-balat.” Inilalarawan ng Hebreo ang mga sisidlan sa langit na wari’y naglalaman ng ulan.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי
  choice: Sino
  rationale: Ang panghalip na patanong ay nagpapakilala ng retorikal na tanong tungkol sa kakayahang taglay ng Diyos lamang; inulit ito sa ikalawang sugnay gaya sa Hebreo.
- source_word: יְסַפֵּר
  choice: makabibilang
  rationale: Ang piel ng ספר ay tumutukoy rito sa pagbibilang o pagtiyak sa bilang ng mga ulap. Ang anyong may “maka-” ay natural na naghahayag ng kakayahan sa retorikal na tanong.
- source_word: שְׁחָקִים
  choice: mga ulap
  rationale: Sa kontekstong patula at meteorolohikal, tumutukoy ito sa mga ulap sa kalangitan.
- source_word: בְּחָכְמָה
  choice: nang may karunungan
  rationale: Pinananatili nito ang ugnayang instrumental o pamamaraang ipinahihiwatig ng בְּ nang hindi nilulutas kung ang diin ay nasa paraan o katangiang kailangan sa pagbibilang.
- source_word: נִבְלֵי שָׁמַיִם
  choice: mga sisidlan ng langit
  rationale: Ang נבל ay sisidlan, tapayan, o sisidlang-balat. Pinananatili ng “mga sisidlan ng langit” ang kongkretong larawang patula nang hindi idinaragdag sa pangunahing teksto na tubig o ulan ang laman.
- source_word: יַשְׁכִּיב
  choice: makapagtatagilid
  rationale: Literal na nangangahulugang “makapagpahiga,” ngunit kapag sisidlan ang layon, likas itong tumutukoy sa pagtatagilid upang maibuhos ang laman. Pinananatili ng salin ang larawan ng mga sisidlan sa halip na tahasang sabihing “magbuhos.”
