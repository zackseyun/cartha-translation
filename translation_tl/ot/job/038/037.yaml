    issue: Hindi likas ang konstruksyong "makapagtatagilid sa mga sisidlan."
    rationale: Ang pandiwang may transitive na diwa rito ay higit na natural na sinusundan ng "ng" para sa layong itinatagilid. Ang "sa" ay maaaring magpahiwatig ng direksiyon o lokasyon, hindi ng tuwirang layon.
  - severity: low
    issue: Ang "pinagmumulan ng ulan" sa talababa ay mas tiyak kaysa sa imaheng Hebreo.
    rationale: Inilalarawan ng talinghaga ang mga sisidlan sa langit na wari'y naglalaman ng ulan; hindi tuwirang sinasabi ng teksto na ang mga ito ang pinagmumulan nito.
