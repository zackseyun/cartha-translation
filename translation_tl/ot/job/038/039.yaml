revisions:
- from: 'Ikaw ba ang nangangaso ng masisila para sa leon,[a]

    at bumubusog sa gutom ng mga batang leon?'
  to: 'Ikaw ba ang nanghuhuli ng biktima para sa leon,[a]


    at binubusog ang mga batang leon?'
  rationale: Pinalitan ang ‘masisila’ ng ‘biktima’ upang tuwirang maipahayag ang טָרֶף bilang prey. Inayos ang ikalawang linya sa likas na Filipino (‘binubusog ang mga batang leon’) habang pinananatili ang diwa ng pagpuno o pagbibigay-kasiyahan sa kanilang gutom. Napanatili ang kalabuan ng kasarian ng לָבִיא at ang umiiral na talababa.
