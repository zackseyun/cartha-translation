base_translation:
  language: en
  yaml_path: translation/ot/job/038/039.yaml
  text: Do you hunt prey for the lioness[a], and satisfy the appetite of the young lions,
translation:
  language: tl
  text: 'Ikaw ba ang nanghuhuli ng biktima para sa leon,[a]


    at binubusog ang mga batang leon?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “leonang babae.” Hindi tiyak sa salitang Hebreo rito kung lalaki o babae ang leon.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲ/תָצ֣וּד
  choice: Ikaw ba ang nangangaso
  rationale: Ang pantanong na הֲ at di-ganap na anyong Qal, ikalawang panauhang panlalaki, ng צוד ay bumubuo ng retorikal na tanong kay Job. Likas sa modernong Tagalog ang “Ikaw ba ang nangangaso” at malinaw nitong naipahihiwatig na Diyos ang tinutukoy na tagapaghanap ng pagkain.
- source_word: לְ/לָבִ֣יא
  choice: para sa leon
  rationale: Maaaring tumukoy ang לָבִיא sa leon na lalaki o babae. Bagaman posibleng “leonang babae” dahil sa kasunod na mga batang leon, hindi tiyak sa salitang Hebreo ang kasarian, kaya pinananatili ng “leon” ang tunay na kalabuan ng teksto. Isinalin ang לְ bilang “para sa.”
- source_word: טָ֑רֶף
  choice: masisila
  rationale: Ang טָרֶף ay hayop o lamang nahuli at nilalapa bilang pagkain. Ang “masisila” ay natural sa Tagalog at pinananatili ang larawan ng pangangaso, hindi lamang ang pangkalahatang ideya ng pagkain.
- source_word: וְ/חַיַּ֖ת
  choice: sa gutom
  rationale: Literal na nauugnay ang חַיַּת sa “buhay” o “sigla,” ngunit sa idyomang kasama ng מלא ay tumutukoy sa buhay na pangangailangan o gana ng mga batang leon. Ang “gutom” ang pinakanatural na pagpapahayag sa Tagalog, habang inilalahad sa talababa ang literal na larawan.
- source_word: כְּפִירִ֣ים
  choice: ng mga batang leon
  rationale: Ang כְּפִירִים ay mga batang leon. Mas malinaw at mas malapit ito sa saklaw ng salitang Hebreo kaysa “mga anak ng leon,” na maaaring magpahiwatig ng napakaliit na mga kuting lamang.
- source_word: תְּמַלֵּֽא
  choice: bumubusog
  rationale: Ang Piel na anyo ng מלא ay literal na “pumupuno.” Kapag iniugnay sa gutom, natural na optimal-equivalence sa Tagalog ang “bumubusog,” na pinananatili rin ang diwa ng pagpuno.
theological_decisions:
- issue: Ang kasarian ng לָבִיא
  choice: leon
  alternative: leonang babae
  rationale: Hindi tahasang itinatakda ng anyong Hebreo rito ang kasarian. Hindi ipinapasok sa salin ang palagay na maternal provisioning ang eksena, bagaman posible iyon sa konteksto.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang magkatugmang pandiwang “nangangaso” at “bumubusog” upang mapanatili ang retorikal na tanong at paralelismo ng Hebreo. Ang panghalip na “Ikaw” ay hayag para idiin ang tuwirang pagtatanong ng Diyos kay Job.
