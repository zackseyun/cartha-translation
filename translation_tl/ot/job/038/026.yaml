  text: to make it rain on a land where no man is[a], on a wilderness in which there is no human,
translation:
  language: tl
  text: upang paulanan ang lupaing walang sinumang lalaki,[a] ang ilang na walang tao roon,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “lupaing walang tao ... ilang na walang tao roon.” Magkaugnay ngunit magkaiba ang dalawang salitang Hebreo sa talata: אִישׁ (“lalaki”) at אָדָם (“tao, sangkatauhan”).'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְהַמְטִיר
  choice: upang paulanan
  rationale: Ang Hiphil infinitive ng מטר ay may diwang sanhi, “magpaulan” o “magpadala ng ulan.” Likas sa Filipino ang “paulanan,” at pinananatili nito ang causative na diwa.
- source_word: עַל אֶרֶץ
  choice: ang lupain
  rationale: Ang עַל ay nakapaloob na sa pandiwang “paulanan,” samantalang ang אֶרֶץ dito ay isang takdang bahagi ng lupa, hindi ang buong daigdig.
- source_word: לֹא אִישׁ
  choice: walang sinumang lalaki
  rationale: Pinananatili ng “lalaki” ang panlalaking anyo ng אִישׁ, habang ang “sinuman” ay nagpapahayag ng eksistensiyal na diwang walang naroroon.
- source_word: מִדְבָּר
  choice: ang ilang
  rationale: Ang מִדְבָּר ay karaniwang tumutukoy sa di-naninirahan at di-nilinang na ilang o kaparangan, hindi lamang sa mabuhanging disyerto.
- source_word: לֹא אָדָם בּוֹ
  choice: na walang tao roon
  rationale: Ang אָדָם ay generic na tao o sangkatauhan. Ang “tao” ay natural na katumbas sa Filipino at pinananatili ang kaibahan nito sa naunang אִישׁ; ang בּוֹ ay hayagang kinakatawan ng “roon.”
theological_decisions:
- issue: Pagkakaiba ng אִישׁ at אָדָם sa magkatulad na mga linya
  choice: “lalaki” para sa אִישׁ at “tao” para sa אָדָם
  alternative: “tao” sa parehong salita
  rationale: Pinananatili nito ang tunay na leksikal na pagkakaiba at ang generic na saklaw ng אָדָם nang hindi ginagawang magkapareho ang dalawang Hebreong termino.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “ilang” bilang maikli at patulang katumbas ng wilderness, at iniwasang ulitin ang pang-ukol dahil likas nang transitive ang “paulanan.”
