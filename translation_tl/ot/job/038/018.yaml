  rationale: Pinananatili ang retorikal na hamon at ang bahagyang kalabuan ng כֻלָּהּ nang hindi nagdaragdag ng isang tiyak na doktrinal na pagpapakahulugan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino; pinanatili ang dalawang retorikal na hamon at ang poetikong ideya ng lawak ng lupa.
