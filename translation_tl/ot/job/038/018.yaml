lexical_decisions:
- source_word: הִתְבֹּנַנְתָּ
  choice: Naunawaan mo na ba
  rationale: Ang pandiwa ay tumutukoy sa masusing pagkaunawa o pagkilala, hindi lamang sa simpleng pagtingin.
- source_word: עַד רַחֲבֵי אָרֶץ
  choice: ang buong lawak ng lupa
  rationale: Ipinahahayag ng parirala ang malalawak na sukat o hangganan ng lupa; natural sa modernong Tagalog ang “buong lawak.”
- source_word: הַגֵּד
  choice: Sabihin mo
  rationale: Tuwirang pautos na angkop sa hamon ng nagsasalita.
- source_word: כֻלָּהּ
  choice: ang lahat ng ito
  rationale: Ang hulaping pambabae ay maaaring tumukoy sa lupa o sa kabuuan ng paksang tinatalakay; pinananatili ng “lahat ng ito” ang saklaw nang hindi labis na nililinaw.
theological_decisions:
