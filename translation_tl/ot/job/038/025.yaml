  text: Who has cut a channel for the flood[a], or a path for the thunderbolt,
translation:
  language: tl
  text: Sino ang nag-ukit ng daluyan para sa rumaragasang tubig[a], at ng landas para sa kidlat na may kasamang kulog?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “para sa malakas na buhos ng ulan.” Sa literal: “para sa rumaragasang agos … para sa kidlat ng mga tunog/tinig.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: פִלַּג
  choice: humukay
  rationale: Ipinahihiwatig ng pandiwa ang paghahati o paghiwa upang makagawa ng daluyan. Sa Filipino, natural na inilalarawan ng “humukay ng lagusan” ang paggawa ng daanan para sa tubig.
- source_word: שֶּׁטֶף
  choice: rumaragasang tubig
  rationale: Maaaring tumukoy ang pangngalan sa baha, rumaragasang tubig, o malakas na buhos ng ulan. Pinananatili ng “rumaragasang tubig” ang galaw at puwersa nito nang hindi nililimitahan sa isang karaniwang baha lamang.
- source_word: תְּעָלָה
  choice: lagusan
  rationale: Tumutukoy ito sa hinukay o itinakdang daluyan ng tubig. Ang “lagusan” ay malinaw at natural sa matalinghagang paglalarawan, bagaman maaari ring isaling “kanal” o “daluyan.”
- source_word: דֶרֶךְ
  choice: landas
  rationale: Sa paralelismo sa lagusan ng tubig, inilalarawan nito ang itinakdang daraanan o ruta sa kalangitan.
- source_word: חֲזִיז
  choice: kidlat
  rationale: Ang bihirang salitang ito ay karaniwang nauunawaang kidlat o lintik. Ang “kidlat” ang pinakanatural na modernong Filipino at hindi labis na nagpapakahulugan sa anyo nito.
- source_word: קֹלוֹת
  choice: may kasamang kulog
  rationale: Literal itong “mga tinig/mga tunog,” ngunit sa konteksto ng bagyo ay tumutukoy sa kulog. Ang pariralang “kidlat na may kasamang kulog” ay nagpapanatili sa dalawang sangkap ng Hebreong ekspresyon sa natural na Filipino.
theological_decisions: []
translation_notes:
  register: Makabagong, marangal, at madaling maunawaang Filipino. Pinanatili ang patulang paralelismo ng lagusan para sa tubig at landas para sa kidlat, pati ang bahagyang di-tiyak na kahulugan ng שֶׁטֶף at ng bihirang חֲזִיז.
