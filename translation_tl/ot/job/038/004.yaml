  text: Where were you when I founded the earth? Tell me[a], if you know understanding.
translation:
  language: tl
  text: Nasaan ka nang itinatag ko ang lupa[a]? Sabihin mo sa akin kung nakauunawa ka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O kaya, “nang inilatag ko ang pundasyon ng lupa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵיפֹה
  choice: Nasaan
  rationale: Tuwirang pang-abay na pananong tungkol sa kinaroroonan; pinananatili nito ang hamon ng Diyos sa natural na Tagalog.
- source_word: הָיִיתָ
  choice: ka
  rationale: Ang Qal perfect na ikalawang panauhang panlalaki ay likas na naipahahayag sa pariralang “Nasaan ka nang…,” na malinaw na tumutukoy sa nakaraang pangyayari.
- source_word: בְּיָסְדִי
  choice: nang itinatag ko
  rationale: 'Ang ב na may infinitive construct at hulaping unang panauhan ay temporal: “nang itinatag ko.” Pinananatili ng “itinatag” ang larawang arkitektural ng יסד nang hindi ito pinalalawak.'
- source_word: אָרֶץ
  choice: ang lupa
  rationale: Sa konteksto ng paglikha sa sansinukob, tumutukoy ito sa lupa o daigdig, hindi sa isang lokal na lupain.
- source_word: הַגֵּד
  choice: Sabihin mo sa akin
  rationale: Ang pautos na anyo ng נגד ay humihinging magpahayag o magsabi. Likas sa Tagalog ang “Sabihin mo sa akin”; ang “sa akin” ay ipinahihiwatig ng nagsasalita at hindi hiwalay na nakasaad sa Hebreo.
- source_word: אִם
  choice: kung
  rationale: Nagpapakilala ito ng mapanghamong kondisyon at hindi kailangang gawing sanhi o katiyakan.
- source_word: יָדַעְתָּ בִינָה
  choice: nakauunawa ka
  rationale: Ang literal na “alam mo ang pagkaunawa” ay hindi likas sa Tagalog. Ang pandiwang “nakauunawa” ay malinaw na naghahatid ng pinagsamang diwa ng ידע at בינה habang pinananatili ang retorikal na hamon.
theological_decisions:
- issue: Larawan ng pagtatatag sa pahayag tungkol sa paglikha
  choice: “itinatag ko ang lupa”
  alternative: “inilagay ko ang pundasyon ng lupa”
  rationale: Ipinakikilala ng talata ang Diyos bilang nagtatag ng lupa. Pinananatili ng “itinatag” ang talinghagang arkitektural nang hindi nagdaragdag ng paliwanag o doktrinal na pagpapakahulugan.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang tuwiran at mapanghamong tono ng banal na pananalita. Inilagay ang tandang-talababa sa pariralang aktuwal na tinutukoy ng alternatibong salin.
