source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל הַ/שָּׂטָ֗ן הֲ/שַׂ֣מְתָּ לִבְּ/ךָ֮ אֶל עַבְדִּ֣/י אִיּוֹב֒ כִּי֩ אֵ֨ין כָּמֹ֜/הוּ בָּ/אָ֗רֶץ אִ֣ישׁ תָּ֧ם וְ/יָשָׁ֛ר יְרֵ֥א אֱלֹהִ֖ים וְ/סָ֣ר מֵ/רָ֑ע וְ/עֹדֶ֨/נּוּ֙ מַחֲזִ֣יק בְּ/תֻמָּת֔/וֹ וַ/תְּסִיתֵ֥/נִי ב֖/וֹ לְ/בַלְּע֥/וֹ חִנָּֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/002/003.yaml
  text: Then Yahweh said to the Accuser[a], “Have you set your heart on my servant Job? For there is no one like him on the earth, a blameless and upright man, one who fears God and turns away from evil. He still holds fast his integrity[d][c][b], though you incited me against him to destroy him for nothing.”
translation:
  language: tl
  text: At sinabi ni Yahweh sa Tagapagparatang[a], “Pinagtuunan mo ba ng pansin ang lingkod kong si Job[b]? Walang sinumang gaya niya sa buong lupa. Siya ay isang lalaking walang kapintasan at matuwid, may takot sa Diyos at lumalayo sa kasamaan. Mahigpit pa rin siyang nanghahawakan sa kaniyang integridad, bagaman inudyukan mo ako laban sa kaniya upang lamunin siya[c] nang walang dahilan[d].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebreo הַשָּׂטָן, “ang Tagapagparatang”; ayon sa tradisyon, “Satanas.”
    reason: alternative_reading
  - marker: b
    text: Sa literal, “Itinuon mo ba ang iyong puso sa lingkod kong si Job?”
    reason: lexical_alternative
  - marker: c
    text: Maaari ring isalin, “upang lipulin siya” o “upang ipahamak siya.” Sa literal na Hebreo, “upang lamunin siya.”
    reason: lexical_alternative
  - marker: d
    text: Ang “nang walang dahilan” ay maaari ring mangahulugang “nang walang kapalit” o “nang walang kabayaran,” at malamang na umaalingawngaw sa Job 1:9, kung saan itinatanong ng Tagapagparatang kung may takot ba si Job sa Diyos “nang walang kapalit.”
    reason: cross_reference
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang transliterasyon ng personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
- source_word: הַשָּׂטָן
  choice: ang Tagapagparatang
  rationale: Dahil may tiyak na pantukoy ang Hebreo, higit itong gumaganap bilang titulo o tungkulin kaysa bilang pangalang pantangi.
- source_word: הֲשַׂמְתָּ לִבְּךָ אֶל
  choice: Itinuon mo ba ang iyong puso sa
  rationale: Pinananatili ang tahasang larawan ng Hebreong ‘ilagay/ituon ang puso,’ habang ipinapaliwanag sa talababa ang likas na kahulugang ‘pagtuunan ng pansin.’
- source_word: עַבְדִּי
  choice: lingkod ko
  rationale: Ipinahahayag nito ang kaugnayan ni Job bilang naglilingkod at nabibilang sa Diyos nang hindi labis na itinatampok ang kahulugang alipin.
- source_word: אֵין כָּמֹהוּ בָּאָרֶץ
  choice: Walang sinumang gaya niya sa buong lupa
  rationale: Ang ‘buong lupa’ ay angkop sa malawak at makalangit na tagpo, bagaman maaari ring mangahulugan ang אֶרֶץ ng lupain.
- source_word: אִישׁ תָּם וְיָשָׁר
  choice: isang lalaking walang kapintasan at matuwid
  rationale: Ang ‘walang kapintasan’ ay tumutukoy sa buo at matapat na pagkatao, hindi kinakailangang ganap na kawalan ng kasalanan; tuwirang katumbas naman ng יָשָׁר ang ‘matuwid.’
- source_word: יְרֵא אֱלֹהִים
  choice: may takot sa Diyos
  rationale: Likas itong Filipino at pinananatili ang teolohikal na diwa ng mapitagang pagkatakot sa Diyos.
- source_word: וְסָר מֵרָע
  choice: lumalayo sa kasamaan
  rationale: Pinananatili nito ang larawang pagtalikod o paglayo na ipinahihiwatig ng pandiwang סור.
- source_word: וְעֹדֶנּוּ מַחֲזִיק בְּתֻמָּתוֹ
  choice: Mahigpit pa rin siyang nanghahawakan sa kaniyang integridad
  rationale: Ang ‘mahigpit na nanghahawakan’ ay naghahatid ng lakas ng מַחֲזִיק, at ang ‘integridad’ ay nagpapahayag ng kabuuan at katapatan ng pagkatao sa תֻמָּה.
- source_word: וַתְּסִיתֵנִי בוֹ
  choice: bagaman inudyukan mo ako laban sa kaniya
  rationale: Pinananatili ang tuwirang pahayag tungkol sa pagkilos ni Yahweh bilang tugon sa pang-uudyok, at ipinakikita ng ‘bagaman’ ang kaugnayang pasalungat sa patuloy na integridad ni Job.
- source_word: לְבַלְּעוֹ
  choice: upang lamunin siya
  rationale: Pinananatili ang matingkad na literal na metapora ng בלע sa halip na agad itong gawing ‘lipulin’ o ‘sirain.’
- source_word: חִנָּם
  choice: nang walang dahilan
  rationale: Natural itong Filipino para sa di-makatwirang pagkapinsala at pinananatili ang posibleng alingawngaw ng parehong salita sa Job 1:9.
theological_decisions:
- issue: Ang tuwirang pagkakasangkot ng Diyos sa pagdurusa ni Job
  choice: “inudyukan mo ako laban sa kaniya”
  alternative: “inudyukan mo akong pahintulutang mapinsala siya”
  rationale: Tuwirang iniuugnay ng Hebreo kay Yahweh ang pagkilos laban kay Job. Hindi ito pinalalambot upang mapanatili ang tensiyon ng salaysay hinggil sa banal na kapamahalaan at walang-dahilang pagdurusa.
- issue: Pagkakakilanlan ng הַשָּׂטָן
  choice: “ang Tagapagparatang” bilang titulo
  alternative: “Satanas” bilang pangalang pantangi
  rationale: Ipinahihiwatig ng tiyak na pantukoy sa Hebreo ang isang tungkulin sa tagpong ito; hindi nito paunang nilulutas ang ugnayan ng tauhan sa mas huling teolohikal na paggamit ng pangalang Satanas.
- issue: Kahulugan ng integridad ni Job
  choice: “integridad” bilang kabuuan at matuwid na pagkatao
  alternative: “kawalang-kasalanan”
  rationale: Hindi ipinapahayag ng תֻמָּה ang ganap na kawalan ng kasalanan; inilalarawan nito ang matatag at buong moral na pagkatao ni Job.
translation_notes:
  register: Makabago ngunit marangal na Filipino ang ginamit. Pinanatili ang pangalang Yahweh, ang titulong Tagapagparatang, ang larawang ‘ituon ang puso,’ at ang metaporang ‘lamunin’ upang hindi mapatag ang mahahalagang larawan at tensiyon ng Hebreo. Ginamit ang “kaniya” at iba pang pormal ngunit karaniwang anyo para sa angkop na rehistro ng salin ng Kasulatan.
