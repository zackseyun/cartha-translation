source:
  edition: WLC
  text: וַֽ/יִּשְׁמְע֞וּ שְׁלֹ֣שֶׁת רֵעֵ֣י אִיּ֗וֹב אֵ֣ת כָּל הָ/רָעָ֣ה הַ/זֹּאת֮ הַ/בָּ֣אָה עָלָי/ו֒ וַ/יָּבֹ֨אוּ֙ אִ֣ישׁ מִ/מְּקֹמ֔/וֹ אֱלִיפַ֤ז הַ/תֵּימָנִי֙ וּ/בִלְדַּ֣ד הַ/שּׁוּחִ֔י וְ/צוֹפַ֖ר הַ/נַּֽעֲמָתִ֑י וַ/יִּוָּעֲד֣וּ יַחְדָּ֔ו לָ/ב֥וֹא לָ/נֽוּד ל֖/וֹ וּֽ/לְ/נַחֲמֽ/וֹ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/002/011.yaml
  text: 'When Job’s three friends heard about all this trouble that had come upon him[a], they came each from his own place: Eliphaz the Temanite, Bildad the Shuhite, and Zophar the Naamathite[d][c][b]. They agreed together to come to sympathize with him and to comfort him.'
translation:
  language: tl
  text: 'Nang mabalitaan ng tatlong kaibigan ni Job ang lahat ng kapahamakang ito na dumating sa kanya[a], pumunta ang bawat isa mula sa kani-kanyang lugar: si Elifaz na Temanita, si Bildad na Suhita, at si Zofar na Naamatita. Nagkasundo silang pumunta upang makiramay[c] at umaliw sa kanya[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “lahat ng kalamidad na ito” o “lahat ng kasamaang ito.” Ang salitang Hebreo rito ay tumutukoy sa sakuna o kasawiang sumapit kay Job, hindi sa moral na kasamaang ginawa niya.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “nagtakda silang magkita” o “nagkasundo silang pumunta.” Ipinahihiwatig ng pandiwang Hebreo ang sinadya nilang pagsasaayos o pagkakasundo.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “makipagluksa sa kanya.” Ang pandiwang Hebreo ay maaaring tumukoy sa pagpapakita ng pakikiramay o pakikidalamhati sa isang nagdurusa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמְעוּ
  choice: Nang mabalitaan
  rationale: Likas na pasalaysay na Tagalog para sa pagkarinig nila ng balita; ipinahahayag ng “Nang” ang ugnayang temporal nang hindi nagdaragdag ng tahasang “ngayon.”
- source_word: שְׁלֹשֶׁת רֵעֵי אִיּוֹב
  choice: tatlong kaibigan ni Job
  rationale: Direkta at natural na pagpapahayag ng construct chain sa modernong Tagalog.
- source_word: כָּל הָרָעָה הַזֹּאת
  choice: lahat ng kapahamakang ito
  rationale: Sa konteksto, ang רָעָה ay kalamidad o masamang sinapit, hindi kasalanang ginawa ni Job. Pinananatili ng “kapahamakan” ang bigat ng magkakasunod niyang sakuna.
- source_word: הַבָּאָה עָלָיו
  choice: na dumating sa kanya
  rationale: Pinananatili ang larawang nasa Hebreo ng kapahamakang “dumating” kay Job.
- source_word: וַיָּבֹאוּ אִישׁ מִמְּקֹמוֹ
  choice: pumunta ang bawat isa mula sa kani-kanyang lugar
  rationale: Ang אִישׁ ay distributibo rito. Ang “kani-kanyang lugar” ay malinaw at natural sa Tagalog.
- source_word: הַתֵּימָנִי / הַשּׁוּחִי / הַנַּעֲמָתִי
  choice: Temanita / Suhita / Naamatita
  rationale: Isinalin bilang mga katawagang pangkat o pinagmulan sa paraang karaniwan sa mga pangalang biblikal sa Tagalog.
- source_word: וַיִּוָּעֲדוּ יַחְדָּו
  choice: Nagkasundo silang magtipon
  rationale: Ipinahahayag ang sinadyang pag-uugnayan o pagtatakda nilang magkita; hindi lamang isang di-sinasadyang pagkikita.
- source_word: לָנוּד לוֹ
  choice: makiramay
  rationale: Saklaw ng pandiwa ang pagpapakita ng pakikiramay o pagluluksa kasama ng nagdurusa, at naiiba ito sa kasunod na pag-aliw.
- source_word: וּלְנַחֲמוֹ
  choice: umaliw sa kanya
  rationale: Natural na katumbas ng נחם sa kontekstong ang layunin ay bigyan ng kaaliwan ang nagdurusa.
theological_decisions:
- issue: Kahulugan ng רָעָה kaugnay ni Job
  choice: kapahamakan
  alternative: kasamaan
  rationale: Tinutukoy rito ang sakuna o kasawiang sumapit kay Job, hindi ang moral na kasamaan na ginawa niya; iniiwasang magpahiwatig ng hatol sa kanyang pagkatao.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “kapahamakan” upang mapanatili ang bigat ng רָעָה, at pinag-iba ang “makiramay” at “umaliw” upang hindi pag-isahin ang dalawang magkaibang pandiwang Hebreo.
