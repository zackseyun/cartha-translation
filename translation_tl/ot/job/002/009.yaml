  naturalness: Mas natural at mas tiyak sa modernong Filipino ang “Pinanghahawakan mo pa rin ba ang iyong integridad?” Gayundin, ang “asawa niya” ay mas magaan kaysa “kanyang asawa” kasunod ng “sa kanya.”
  terminology: Ang “integridad” ay angkop na modernong Filipino at mas malapit sa saklaw ng תֻּמָּה rito kaysa “katapatan,” na maaaring mangahulugang faithfulness o loyalty. Nananatiling “Diyos” ang wastong katumbas ng אֱלֹהִים sa kontekstong ito.
