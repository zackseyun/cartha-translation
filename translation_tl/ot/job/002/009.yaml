  text: Then his wife said to him[a], “Are you still holding fast to your integrity? Bless God and die.”
translation:
  language: tl
  text: At sinabi sa kanya ng asawa niya, “Pinanghahawakan mo pa rin ba ang iyong integridad? Pagpalain mo ang Diyos[a] at mamatay ka.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “Pagpalain mo ang Diyos”; marami ang umuunawa sa “pagpalain” dito bilang magalang na eupemismo na ang ibig sabihin ay “sumpain.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Pagkatapos, sinabi
  rationale: Isinusulong ng waw-consecutive ang salaysay; natural sa makabagong Filipino ang “Pagkatapos” upang ipakita ang pagkakasunod-sunod.
- source_word: אִשְׁתּוֹ
  choice: ng kanyang asawa
  rationale: Tuwirang inilalarawan ang asawa ni Job nang hindi nagdaragdag ng pangalan o paliwanag.
- source_word: עֹדְךָ מַחֲזִיק
  choice: Nananatili ka pa rin ba
  rationale: Ipinahahayag ng עֹד ang pagpapatuloy, at ng participle מַחֲזִיק ang patuloy na mahigpit na panghahawak; sa Filipino, natural na naipahihiwatig ito ng “nananatili ... pa rin.”
- source_word: בְּתֻמָּתֶךָ
  choice: sa iyong katapatan
  rationale: Ang תֻּמָּה ay tumutukoy sa integridad, pagiging buo, o kawalang-kapintasan. Ang “katapatan” ay malinaw at marangal sa karaniwang Filipino at hindi nagpapahiwatig ng ganap na kawalan ng kasalanan.
- source_word: בָּרֵךְ
  choice: Pagpalain mo
  rationale: Literal na “pagpalain” ang pandiwang Hebrew. Pinananatili ito sa pangunahing teksto upang hindi tahimik na lutasin ang sinadyang tensiyon; ipinaliliwanag sa talababa ang malamang na eupemistikong kahulugan.
- source_word: אֱלֹהִים
  choice: ang Diyos
  rationale: Ang אֱלֹהִים dito ay karaniwang titulong pantukoy sa Diyos, hindi ang pangalang tipan na YHWH.
- source_word: וָמֻת
  choice: at mamatay ka
  rationale: Pinananatili ang payak at matinding pagkakaugnay ng dalawang pautos sa Hebrew.
theological_decisions:
- issue: Eupemistikong gamit ng “pagpalain” kaugnay ng Diyos
  choice: Panatilihin sa teksto ang literal na “Pagpalain mo ang Diyos at mamatay ka,” na may talababa tungkol sa malamang na kahulugang “Sumpain mo ang Diyos.”
  alternative: “Sumpain mo ang Diyos at mamatay ka.”
  rationale: בָּרֵךְ ang aktuwal na anyo ng tekstong Hebrew at literal itong nangangahulugang “pagpalain,” ngunit sa kontekstong ito ay malawak na nauunawaang magalang na eupemismo para sa kabaligtarang diwa. Pinananatili ng salin ang anyo at tensiyon ng pinagmulan habang malinaw na itinatala ang alternatibong pagkaunawa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “katapatan” bilang natural na katumbas ng integridad sa konteksto, at pinanatili ang literal na “Pagpalain” upang maingatan ang leksikal at teolohikal na tensiyon ng Hebrew.
