  text: And the LORD said to the Accuser, “Look, he is in your hand; only spare his life.”
translation:
  language: tl
  text: Sinabi ng PANGINOON sa Tagapag-akusa, “Narito, nasa iyong kamay siya; ngunit huwag mong kitilin ang kanyang buhay.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: PANGINOON
  rationale: Ginagamit ang kinaugaliang anyong malalaking titik bilang salin ng banal na pangalang YHWH.
- source_word: הַשָּׂטָן
  choice: Tagapag-akusa
  rationale: May pantukoy ang salitang Hebreo at sa tagpong ito ay tumutukoy sa tungkulin o titulo ng umaakusa, kaya hindi ito basta ginawang pangalang pantangi.
- source_word: הִנּוֹ
  choice: Narito
  rationale: Pinananatili ang pormulang pantawag-pansin ng Hebreo sa dignified at malinaw na Tagalog.
- source_word: בְיָדֶךָ
  choice: nasa iyong kamay
  rationale: Pinananatili ang konkretong idyomang Hebreo na nangangahulugang isinailalim siya sa kapangyarihan ng kausap.
- source_word: נַפְשׁוֹ
  choice: kanyang buhay
  rationale: Sa kontekstong ito, ang nephesh ay tumutukoy sa buhay ng tao, hindi sa isang hiwalay na di-materyal na 'kaluluwa'.
- source_word: שְׁמֹר
  choice: iligtas mo
  rationale: Sa negatibong hangganang ipinapataw sa Tagapag-akusa, natural nitong ipinahahayag ang utos na huwag kitilin kundi panatilihin ang buhay ni Job.
theological_decisions:
- issue: Pagkakakilanlan ng הַשָּׂטָן
  choice: Tagapag-akusa
  alternative: Satanas
  rationale: Pinananatili ang pantukoy at ang papel ng tauhan sa salaysay, nang hindi agad ipinapasok ang kalaunang paggamit bilang pangalang pantangi.
- issue: Kahulugan ng נֶפֶשׁ
  choice: buhay
  alternative: kaluluwa
  rationale: Ang ipinagbabawal dito ay ang pagkitil sa buhay ni Job; iniiwasan ng 'buhay' ang di-kinakailangang doktrinal na pagbasa sa antropolohiya.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Pinanatili ang matalinghagang “nasa iyong kamay” at ginamit ang “PANGINOON” para sa tetragrammaton.
