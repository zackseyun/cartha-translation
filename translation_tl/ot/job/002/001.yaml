base_translation:
  language: en
  yaml_path: translation/ot/job/002/001.yaml
  text: Again there was a day when the sons of God came to present themselves before Yahweh[b][a], and the Adversary also came among them to present himself before Yahweh.
translation:
  language: tl
  text: Muli, dumating ang araw nang ang mga anak ng Diyos[a] ay pumaroon upang humarap kay Yahweh. Dumating din ang Kalaban[b] sa gitna nila upang humarap kay Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “mga anak ng Diyos.” Maaaring tumukoy ito sa mga makalangit na nilalang o sa mga kasapi ng makalangit na kapulungan.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “Satanas.” May tiyak na pantukoy ang Hebreo—“ang satan”—kaya malamang na titulo ito rito na nangangahulugang “ang kalaban” o “ang tagaparatang.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי הַיּוֹם
  choice: Muling dumating ang isang araw
  rationale: Ipinahihiwatig ng “Muling” ang pag-uulit ng tagpo mula sa Job 1:6, habang pinananatili ng “dumating ang isang araw” ang Hebreong paraang pasalaysay.
- source_word: בְּנֵי הָאֱלֹהִים
  choice: mga anak ng Diyos
  rationale: Tuwirang pinananatili nito ang idyomang Hebreo at ang sadyang kalabuan kung ang tinutukoy ay mga makalangit na nilalang o mga kasapi ng makalangit na kapulungan.
- source_word: לְהִתְיַצֵּב עַל יְהוָה
  choice: upang humarap kay Yahweh
  rationale: Sa tagpong parang hukuman o maharlikang kapulungan, ang pandiwa ay tumutukoy sa pagharap at pagharap para maglingkod sa isang nakatataas. Likas sa modernong Tagalog ang “humarap” at hindi nito labis na ipinapaliwanag ang tagpo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos sa halip na palitan ito ng titulong “PANGINOON.”
- source_word: הַשָּׂטָן
  choice: ang Kalaban
  rationale: May pantukoy ang Hebreo, kaya mas malamang na titulo o tungkulin ito rito kaysa isang ganap nang pangalang pantangi. Sinasaklaw ng “Kalaban” ang batayang diwa ng שׂטן nang hindi ito nililimitahan sa “tagaparatang.”
- source_word: בְּתוֹכָם
  choice: na kasama nila
  rationale: Likas na Tagalog ito para sa pagdating niya sa gitna ng nagkakatipong pangkat at pinananatili ang diwa ng kaniyang pagiging kabilang sa pagtitipon.
theological_decisions:
- issue: Kung ang הַשָּׂטָן ay dapat isalin bilang pangalang pantangi o bilang titulo
  choice: ang Kalaban
  alternative: Satanas; ang Satanas; ang Tagaparatang
  rationale: Dahil may tiyak na pantukoy ang salitang Hebreo, pinananatili ng “ang Kalaban” ang tungkulin o titulong ipinahihiwatig ng anyo nito. Hindi nito ipinapasok nang mas matindi kaysa sa teksto ang kalaunang gamit dito bilang isang nakapirming pangalang pantangi.
- issue: Pagkakakilanlan ng בְּנֵי הָאֱלֹהִים
  choice: mga anak ng Diyos
  alternative: mga nilalang sa langit; mga makadiyos na nilalang
  rationale: Pinananatili ng literal na idyoma ang teolohikal na tensiyon at hindi ipinapasiya sa mismong salin kung sino ang mga nilalang na ito.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “pumaroon” upang ipahiwatig ang pagdating sa pormal na pagtitipon, ngunit “humarap” para sa natural at madaling maunawaang paglalarawan ng pagharap sa isang nakatataas. Hinati sa dalawang pangungusap upang maging malinaw ang parallel na pagdating ng Kalaban nang hindi binabago ang nilalaman.
