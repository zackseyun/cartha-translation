  text: וַ/יֵּצֵא֙ הַ/שָּׂטָ֔ן מֵ/אֵ֖ת פְּנֵ֣י יְהוָ֑ה וַ/יַּ֤ךְ אֶת אִיּוֹב֙ בִּ/שְׁחִ֣ין רָ֔ע מִ/כַּ֥ף רַגְל֖/וֹ עד קָדְקֳדֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/002/007.yaml
  text: So the Adversary went out from the presence of Yahweh and struck Job with painful sores from the sole of his foot to the crown of his head[a][b].
translation:
  language: tl
  text: Kaya umalis ang Tagaparatang[a] mula sa harapan ni Yahweh at sinaktan si Job ng malulubhang pigsa[b], mula sa talampakan ng kanyang paa hanggang sa tuktok ng kanyang ulo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “ang satan”; tradisyonal na isinasaling “Satanas.” May pantukoy ang salita rito at maaaring tumukoy sa titulong “ang Tagaparatang” o “ang Kalaban.”
    reason: alternative_reading
  - marker: b
    text: Maaari ring isalin na “matitinding sugat sa balat” o “napakasasakit na pigsa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשָּׂטָן
  choice: ang Tagaparatang
  rationale: May pantukoy ang salitang Hebreo at sa pambungad ng Job ay mas natural itong unawain bilang titulo o tungkulin. Ipinahihiwatig ng “Tagaparatang” ang pagkontra at pag-akusa nang hindi agad ginagawa itong tiyak na pangalang pantangi.
- source_word: מֵאֵת פְּנֵי יְהוָה
  choice: mula sa harapan ni Yahweh
  rationale: Ang pariralang tumutukoy sa mukha ay idyomatikong nagsasaad ng pagiging nasa harapan o presensiya ng isang tao. Pinananatili ang pangalang Yahweh para sa tetragrammaton.
- source_word: וַיַּךְ
  choice: sinaktan
  rationale: Tuwirang ipinahahayag ng pandiwa ang pananakit o paghampas. Ang “sinaktan” ay natural sa modernong Tagalog at angkop sa sakit na kasunod na binanggit.
- source_word: בִּשְׁחִין רָע
  choice: ng malulubhang pigsa
  rationale: Ang שְׁחִין ay tumutukoy sa namamagang sakit o mga bukol sa balat, karaniwang mga pigsa; ang רָע dito ay nagpapahiwatig ng tindi o lubhang masamang kalagayan, hindi ng moral na kasamaan.
- source_word: מִכַּף רַגְלוֹ
  choice: mula sa talampakan ng kanyang paa
  rationale: Kapag kaugnay ng paa, ang כַּף ay tumutukoy sa talampakan.
- source_word: עַד קָדְקֳדוֹ
  choice: hanggang sa tuktok ng kanyang ulo
  rationale: Ang קָדְקֹד ay tuktok o bumbunan ng ulo; malinaw na ipinakikita ng parirala ang lawak ng karamdaman sa buong katawan.
theological_decisions:
- issue: Pagpapakahulugan sa הַשָּׂטָן sa pambungad ng Job
  choice: ang Tagaparatang
  alternative: Satanas; ang Kalaban
  rationale: Dahil may tiyak na pantukoy ang Hebreo, pinananatili ng salin ang posibilidad na titulo o papel ito sa tagpong ito, sa halip na tahimik na ipalagay na isa na itong nakapirming pangalang pantangi. Inilalagay sa talababa ang tradisyonal na salin.
- issue: Paglilipat ng יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Tuwirang ginagamit ng talata ang banal na pangalang יְהוָה, kaya inililipat ito bilang Yahweh sa halip na palitan ng isang titulo.
translation_notes:
  register: Modernong Filipino Tagalog na may marangal ngunit payak na himig. Ginamit ang “Tagaparatang” bilang malinaw na titulo, “sinaktan” para sa tuwirang kilos, at “malulubhang pigsa” upang mapanatili ang larawang medikal nang hindi labis na nililimitahan ang eksaktong uri ng karamdaman.
