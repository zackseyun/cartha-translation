base_translation:
  language: en
  yaml_path: translation/ot/job/002/002.yaml
  text: And Yahweh said to the Accuser[a], “From where have you come?” And the Accuser answered Yahweh and said, “From roaming about on the earth and from walking around on it.”
translation:
  language: tl
  text: Sinabi ni Yahweh sa Tagapagparatang[a], “Saan ka nanggaling?” Sumagot ang Tagapagparatang kay Yahweh at sinabi, “Mula sa paggala-gala sa daigdig at sa paglalakad-lakad rito.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “ang satan”; malamang na titulo rito na nangangahulugang “ang tagapagparatang” o “ang kalaban,” at hindi kinakailangang pangalang pantangi.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang transliterasyon ng banal na pangalan sa halip na palitan ito ng isang titulo.
- source_word: הַשָּׂטָן
  choice: ang Tagapagparatang
  rationale: May tiyak na pantukoy ang Hebreo at tumutukoy dito sa isang tungkulin o titulo; malinaw na naihahatid ng “Tagapagparatang” ang kontekstong mapang-usig nang hindi agad ginagawa itong pangalang pantangi.
- source_word: אֵי מִזֶּה תָּבֹא
  choice: Saan ka nanggaling?
  rationale: Natural na modernong Tagalog ito para sa tanong tungkol sa pinanggalingan at sapat nitong naihahatid ang puwersa ng Hebreong idyoma.
- source_word: וַיַּעַן ... וַיֹּאמַר
  choice: Sumagot ... at sinabi
  rationale: Pinanatili ang dalawang pandiwang magkasunod sa estilong pasalaysay ng Hebreo, bagaman may bahagyang pag-uulit sa Tagalog.
- source_word: מִשֻּׁט בָּאָרֶץ
  choice: mula sa pagpapagala-gala sa buong daigdig
  rationale: Ipinahahayag ng שׁוט ang pagparoo't parito o malayang paggala; ang “sa buong daigdig” ay natural na naghahatid ng malawak na saklaw ng kilos sa kontekstong ito.
- source_word: וּמֵהִתְהַלֵּךְ בָּהּ
  choice: at sa paglalakad-lakad doon
  rationale: Napananatili ng inuulit na anyong “paglalakad-lakad” ang paulit-ulit na pagkilos na ipinahihiwatig ng hitpael, nang hindi nagdaragdag ng mas tiyak na ideya gaya ng pagpapatrolya.
theological_decisions:
- issue: Kung ang הַשָּׂטָן ay pangalang pantangi o titulo/tungkulin
  choice: ang Tagapagparatang
  alternative: si Satanas; ang Kalaban
  rationale: Ang tiyak na pantukoy sa Hebreo at ang papel nito sa tagpo ng makalangit na hukuman ay pumapabor sa pagbasa bilang titulo. Pinananatili nito ang pahiwatig ng teksto nang hindi ipinapasok nang tahasan ang mga pagpapalagay mula sa mas huling paggamit ng “Satanas” bilang pangalang pantangi.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “Yahweh” bilang personal na pangalan ng Diyos. Ang “Tagapagparatang” ay sinadyang gamiting titulo at nilagyan ng malaking titik para sa malinaw at tuloy-tuloy na pagtukoy sa tauhan, hindi upang ipasiya na isa itong pangalang pantangi.
