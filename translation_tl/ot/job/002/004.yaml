base_translation:
  language: en
  yaml_path: translation/ot/job/002/004.yaml
  text: Then the Adversary answered Yahweh and said[a], “Skin for skin! Indeed[c][b], all that a man has he will give for his life.”
translation:
  language: tl
  text: Sumagot ang Kalaban[a] kay Yahweh at sinabi, “Balat para sa balat![b] Ibibigay ng isang tao ang lahat ng mayroon siya para sa kanyang buhay.[c]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “si Satanas” o “ang tagapag-akusa.” Sa Hebreo, may pantukoy ang katawagan: “ang satan/kalaban.”'
    reason: alternative_reading
  - marker: b
    text: Ang “Balat para sa balat” ay isang maikling kasabihan na hindi tiyak ang eksaktong diwa. Malamang na ibig nitong sabihin na isusuko ng tao ang ibang bagay upang mailigtas ang sarili niyang buhay.
    reason: cultural_note
  - marker: c
    text: O “para sa kanyang sarili” o “para sa kanyang kaluluwa.” Sa kontekstong ito, “buhay” ang pinakamalamang na diwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשָּׂטָן
  choice: ang Kalaban
  rationale: May pantukoy ang Hebreo at gumaganap ang salita bilang titulo o katawagan sa tungkulin, hindi kailangang bilang pangalang pantangi. Likas sa Filipino ang “ang Kalaban” at pinananatili nito ang diwa ng pagsalungat.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat ang banal na pangalan sa anyong Yahweh upang mapanatili ang pagkakakilanlan nito sa tekstong Hebreo.
- source_word: עוֹר בְּעַד עוֹר
  choice: Balat para sa balat!
  rationale: Pinananatili ang maikli, matalinghaga, at sadyang hindi ganap na malinaw na anyo ng kasabihang Hebreo sa halip na ipasok sa pangunahing teksto ang isang tiyak na pagpapakahulugan.
- source_word: בְּעַד
  choice: para sa
  rationale: Sa dalawang gamit, ipinahihiwatig ng parirala ang kapalit o layuning mapangalagaan ang isang bagay. Ang “para sa” ay maikli at natural, habang hindi labis na nililinaw ang unang kasabihan.
- source_word: אִישׁ
  choice: isang tao
  rationale: Bagaman panlalaking isahan ang anyong Hebreo, pangkalahatang tao ang tinutukoy sa kasabihan; ang “isang tao” ang natural at tumpak na generic na pahayag sa modernong Filipino.
- source_word: נַפְשׁוֹ
  choice: kanyang buhay
  rationale: Sa konteksto, tumutukoy ang נֶפֶשׁ sa buhay na iniingatan, hindi partikular sa hiwalay na di-materyal na kaluluwa.
- source_word: וְכֹל אֲשֶׁר לָאִישׁ
  choice: ang lahat ng mayroon siya
  rationale: Likas na Filipino ito para sa Hebreong pahayag na tumutukoy sa lahat ng pag-aari ng tao.
- source_word: יִתֵּן
  choice: Ibibigay
  rationale: Ipinapahayag ng di-ganap na pandiwa ang pangkalahatang gagawin ng tao sa ganitong kalagayan; natural itong ihatid sa Filipino sa aspektong kontemplatibo.
theological_decisions:
- issue: Paglalarawan sa הַשָּׂטָן sa paunang salaysay ng Job
  choice: ang Kalaban
  alternative: si Satanas; ang tagapag-akusa
  rationale: Ang may-pantukoy na anyo sa Hebreo ay nagpapakitang katawagan ito sa papel o tungkulin ng tauhan. Hindi ipinapasok ng salin ang mas huling paggamit nito bilang pangalang pantangi, ngunit hindi rin nito itinatanggi ang gayong kanonikal na pagkakakilanlan.
- issue: Kahulugan ng נֶפֶשׁ
  choice: buhay
  alternative: sarili; kaluluwa
  rationale: Ang usapan ay tungkol sa pag-iingat ng sariling buhay sa harap ng pinsala sa katawan, kaya “buhay” ang pinakamalinaw na katumbas nang hindi nagdaragdag ng antropolohikal na doktrina.
translation_notes:
  register: Modernong Filipino na dignificado at madaling maunawaan. Pinanatili ang matalas at maikling anyo ng kasabihan. Inalis ang paulit-ulit na “at sinabi” dahil natural nang saklaw iyon ng “sumagot,” ngunit hindi binago ang nilalaman ng tugon. Ang mga marker [a], [b], at [c] ay nasa mismong pangunahing teksto.
