revisions:
- from: Ngunit sinabi niya sa kanya, “Nagsasalita kang gaya ng isa sa mga hangal na babae. Tatanggapin ba natin mula sa Diyos ang mabuti, ngunit hindi natin tatanggapin ang masama[a]?” Sa lahat ng ito, hindi nagkasala si Job sa sinabi ng kanyang mga labi.
  to: Ngunit sinabi niya sa kanya, “Nagsasalita kang gaya ng isa sa mga hangal na babae. Tatanggapin ba natin mula sa Diyos ang mabuti, at hindi ba natin tatanggapin ang masama[a]?” Sa lahat ng ito, hindi nagkasala si Job sa anumang pananalitang lumabas sa kanyang mga labi.
  rationale: Pinalitan ang adversatibong “ngunit” sa loob ng tanong ng “at hindi ba” upang masundan ang magkapares na retorikal na tanong sa Hebreo. Inayos ang huling sugnay upang maging likas na Filipino at manatiling hayag ang pagtukoy ng Hebreo sa “mga labi,” na naglilimita sa pahayag sa pananalita ni Job.
