base_translation:
  language: en
  yaml_path: translation/ot/job/002/010.yaml
  text: But he said to her[a], “You speak as one of the foolish women speaks. Shall we receive the good from God, and shall we not receive the bad?” In all this Job did not sin with his lips.
translation:
  language: tl
  text: Ngunit sinabi niya sa kanya, “Nagsasalita kang gaya ng isa sa mga hangal na babae. Tatanggapin ba natin mula sa Diyos ang mabuti, at hindi ba natin tatanggapin ang masama[a]?” Sa lahat ng ito, hindi nagkasala si Job sa anumang pananalitang lumabas sa kanyang mga labi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “kapahamakan” o “masamang kalagayan”; tradisyonal na “kasamaan.” Ang Hebreong רָע rito ay tumutukoy sa nakapipinsala o di-kanais-nais na kalagayan, bilang kasalungat ng “mabuti.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּדַבֵּר אַחַת הַנְּבָלוֹת תְּדַבֵּרִי
  choice: Nagsasalita kang gaya ng isa sa mga hangal na babae
  rationale: Ang נְבָלוֹת ay tumutukoy sa kahangalan na may moral at panrelihiyong bigat, hindi lamang sa kakulangan ng talino. Likas sa modernong Tagalog ang “hangal,” at ang “mga babae” ay malinaw na ipinahihiwatig ng anyong pambabae at ng konteksto.
- source_word: גַּם אֶת־הַטּוֹב נְקַבֵּל מֵאֵת הָאֱלֹהִים
  choice: Tatanggapin ba natin mula sa Diyos ang mabuti
  rationale: Isinalin ang imperfect bilang retorikal na tanong ayon sa kasunod na katambal na sugnay. Pinanatili ng “ang mabuti” ang malawak na kategorya ng mabubuting bagay o pagpapala.
- source_word: וְאֶת־הָרָע לֹא נְקַבֵּל
  choice: ngunit hindi natin tatanggapin ang masama
  rationale: Sa konteksto, ang רָע ay kasalungat ng mabuti at tumutukoy sa nakapipinsala o di-kanais-nais na kalagayan. Pinananatili ng “masama” ang tahasang pagsalungat sa “mabuti,” habang nililinaw sa talababa ang kontekstuwal na diwa nito.
- source_word: בְּכָל־זֹאת
  choice: Sa lahat ng ito
  rationale: Natural at tuwirang pananalita ito para sa buod at pagtataya ng tagapagsalaysay.
- source_word: לֹא חָטָא אִיּוֹב בִּשְׂפָתָיו
  choice: hindi nagkasala si Job sa sinabi ng kanyang mga labi
  rationale: Pinananatili nito ang larawan ng “mga labi” at ang tiyak na pagtukoy sa pananalita, ngunit mas natural sa Tagalog kaysa sa literal na “sa pamamagitan ng kanyang mga labi.”
theological_decisions:
- issue: Kahulugan ng הָרָע kaugnay ng Diyos
  choice: “ang masama,” na sa konteksto ay tumutukoy sa kapahamakan o di-kanais-nais na kalagayan
  alternative: “ang kapahamakan” o tradisyonal na “ang kasamaan”
  rationale: Ang talata ay naghahambing ng mabuti at masamang karanasan na tinatanggap ng tao mula sa Diyos. Hindi hinihingi ng Hebreo rito na unawain ang רָע bilang moral na kasamaan na ginagawa ng Diyos. Pinananatili sa pangunahing teksto ang leksikal na tensiyon at ipinapaliwanag sa talababa ang kontekstuwal na kahulugan.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “hangal” dahil taglay nito ang moral na bigat ng Hebreo, at pinanatili ang larawang “mga labi” upang hindi mawala ang tiyak na diin ng tagapagsalaysay sa pananalita ni Job.
