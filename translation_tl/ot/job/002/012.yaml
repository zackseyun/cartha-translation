revisions:
- from: Nang tanawin nila siya mula sa malayo[a], hindi nila siya nakilala. Nagtaas sila ng tinig at humagulgol. Pinunit ng bawat isa ang kanyang balabal, at naghagis sila ng alabok paitaas, sa ibabaw ng kanilang mga ulo.[b]
  to: Nang tumingin sila mula sa malayo[a], hindi nila siya nakilala. Nagtaas sila ng tinig at umiyak. Pinunit ng bawat isa ang kanyang balabal, at naghagis sila ng alabok paitaas, sa ibabaw ng kanilang mga ulo.[b]
  rationale: Pinalitan ang “humagulgol” ng “umiyak” upang huwag higitan ang saklaw ng pandiwang Hebreo. Pinalitan ang “tanawin nila siya” ng “tumingin sila” upang hindi magdagdag ng hayag na layon sa unang sugnay, samantalang nananatili ang malinaw na pagtukoy kay Job sa “hindi nila siya nakilala.” Ang iba pang mga detalye, kabilang ang distributibong “bawat isa,” ang “balabal,” at ang paghagis ng alabok paitaas sa ibabaw ng kanilang mga ulo, ay pinanatili.
