base_translation:
  language: en
  yaml_path: translation/ot/job/002/012.yaml
  text: And when they lifted up their eyes from a distance[a], they did not recognize him. Then they raised their voices and wept[b], and each man tore his robe and threw dust over his head toward the heavens.
translation:
  language: tl
  text: Nang tumingin sila mula sa malayo[a], hindi nila siya nakilala. Nagtaas sila ng tinig at umiyak. Pinunit ng bawat isa ang kanyang balabal, at naghagis sila ng alabok paitaas, sa ibabaw ng kanilang mga ulo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “itinaas nila ang kanilang mga mata mula sa malayo.”
    reason: hebrew_idiom
  - marker: b
    text: Ang paghagis ng alabok paitaas upang bumagsak ito sa kanilang mga ulo ay tanda ng matinding pagdadalamhati.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׂאוּ אֶת עֵינֵיהֶם
  choice: Nang tanawin nila siya
  rationale: Isinasalin nang natural sa modernong Tagalog ang idyomang Hebreo na literal na ‘itinaas nila ang kanilang mga mata.’ Ang ‘siya’ ay malinaw na tumutukoy kay Job mula sa kasunod na hulaping panghalip sa הִכִּירֻהוּ.
- source_word: מֵרָחוֹק
  choice: mula sa malayo
  rationale: Malinaw na ipinahahayag ang pisikal na distansiya at pinananatili ang karaniwang diwa ng pariralang Hebreo.
- source_word: וְלֹא הִכִּירֻהוּ
  choice: hindi nila siya nakilala
  rationale: Ang pandiwa ay tumutukoy sa hindi nila pagkilala kay Job dahil sa kanyang anyo, hindi sa kawalan ng dating pagkakakilala sa kanya.
- source_word: וַיִּשְׂאוּ קוֹלָם וַיִּבְכּוּ
  choice: Nagtaas sila ng tinig at humagulgol
  rationale: Pinananatili ang dalawang kilos—ang malakas na pagpapahayag ng dalamhati at ang pag-iyak—habang gumagamit ng dignified at nauunawaang Tagalog.
- source_word: וַיִּקְרְעוּ אִישׁ מְעִלוֹ
  choice: Pinunit ng bawat isa ang kanyang balabal
  rationale: Ang אִישׁ ay distributibo rito, kaya ‘bawat isa’; ang מְעִיל ay isang balabal o panlabas na kasuutan.
- source_word: וַיִּזְרְקוּ עָפָר עַל רָאשֵׁיהֶם הַשָּׁמָיְמָה
  choice: naghagis sila ng alabok paitaas, sa ibabaw ng kanilang mga ulo
  rationale: Pinananatili ang kilos ng paghagis ng alabok sa direksiyong paitaas at ang kaugnayan nito sa kanilang mga ulo, nang hindi labis na nilulutas ang bahagyang siksik na sintaks ng Hebreo.
