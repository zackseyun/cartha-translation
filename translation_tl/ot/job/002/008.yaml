  text: And he took a potsherd to scrape himself with while he was sitting among the ashes[a][b].
translation:
  language: tl
  text: Kumuha siya ng isang bubog ng palayok[a] upang kaskasin ang kanyang sarili gamit nito[b], habang nakaupo siya sa gitna ng mga abo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “isang piraso ng basag na palayok.”
    reason: lexical_alternative
  - marker: b
    text: O “upang kamutin ang kanyang sarili.” Maaari ring mangahulugang “kamutin” ang pandiwang Hebreo, ngunit mas angkop sa paggamit ng bubog ang “kaskasin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: Kumuha siya
  rationale: Isinusulong ng wayyiqtol ang salaysay; natural sa Tagalog ang payak na “Kumuha siya” nang hindi dinaragdagan ang ugnayang pandiskurso.
- source_word: לוֹ
  choice: Kumuha siya
  rationale: Hindi na tahasang isinalin ang datibong panghalip na “para sa kanyang sarili” sapagkat malinaw at mas natural sa Tagalog ang diwa sa pandiwang “kumuha” sa kontekstong ito.
- source_word: חֶרֶשׂ
  choice: isang bubog ng palayok
  rationale: Tumutukoy ito sa piraso ng basag na kagamitang luwad. Ang “bubog ng palayok” ay tiyak, malinaw, at likas sa makabagong Tagalog.
- source_word: לְהִתְגָּרֵד
  choice: upang ikaskas sa kanyang sarili
  rationale: Ang hitpael infinitive ay nagpapahayag ng kilos ni Job sa sarili niya. Ipinahihiwatig ng “ikaskas” ang paggamit sa matigas at magaspang na bubog, habang pinananatili sa talababa ang posibleng diwang “kamutin.”
- source_word: בּוֹ
  choice: ikaskas
  rationale: Ang panghalip na may pang-ukol ay instrumental at tumutukoy sa bubog. Sa Tagalog, likas na naisasama ang instrumentong diwa sa hulaping i- ng “ikaskas.”
- source_word: וְהוּא יֹשֵׁב
  choice: habang nakaupo siya
  rationale: Ipinapakita ng sugnay ang kasabay na kalagayan o postura ni Job habang ginagawa niya ang pagkaskas.
- source_word: בְּתוֹךְ הָאֵפֶר
  choice: sa gitna ng mga abo
  rationale: Pinananatili nito ang literal na larawang “nasa gitna” ng abo nang hindi ipinapalagay na tiyak na bunton ng abo ang tinutukoy.
