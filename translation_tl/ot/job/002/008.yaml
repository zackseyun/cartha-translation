  naturalness: 'Ang “Kumuha siya ng isang bubog ng palayok” at “habang nakaupo siya sa gitna ng mga abo” ay natural at angkop sa makabagong Filipino. Ang pangunahing ayos na kailangan ay ang pandiwang parirala: ang “ikaskas sa kanyang sarili” ay may nawawalang tuwirang layon sa karaniwang gamit, samantalang ang binagong parirala ay malinaw at likas.'
