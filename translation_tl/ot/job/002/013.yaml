base_translation:
  language: en
  yaml_path: translation/ot/job/002/013.yaml
  text: And they sat with him on the ground seven days and seven nights[a], and no one spoke a word to him, because they saw that his pain was very great.
translation:
  language: tl
  text: At umupo silang kasama niya sa lupa sa loob ng pitong araw at pitong gabi. Walang sinuman ang nagsalita sa kanya kahit isang salita, sapagkat nakita nilang napakatindi ng kanyang paghihirap.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “napakatindi ng kanyang sakit” o “napakatindi ng kanyang dalamhati.” Malawak ang saklaw ng salitang Hebreo at maaaring tumukoy sa pisikal na sakit at emosyonal na pagdurusa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשְׁבוּ
  choice: naupo
  rationale: Pinananatili ang konkretong kilos ng pag-upo, na angkop sa tagpo ng pagluluksa, sa halip na gawing mas malawak na ‘nanatili.’
- source_word: אִתּוֹ
  choice: kasama niya
  rationale: 'Likas na Filipino para sa tuwirang diwang komitatibo: pisikal na nakikiramay at naroroon ang mga kaibigan ni Job.'
- source_word: לָאָרֶץ
  choice: sa lupa
  rationale: Sa konteksto ng pag-upo bilang pagluluksa, tumutukoy ito sa mismong lupa o ground, hindi sa daigdig o lupain.
- source_word: שִׁבְעַת יָמִים וְשִׁבְעַת לֵילוֹת
  choice: nang pitong araw at pitong gabi
  rationale: Tapat at natural na paglalarawan ng buong panahon ng kanilang tahimik na pakikiramay.
- source_word: וְאֵין דֹּבֵר אֵלָיו דָּבָר
  choice: Walang sinuman ang nagsalita sa kanya kahit isang salita
  rationale: Ipinahahayag ang ganap na katahimikan at pinananatili ang diin ng Hebreong idyomang gumagamit ng ‘salita.’
- source_word: כִּי רָאוּ
  choice: sapagkat nakita nila
  rationale: Ang כִּי ay nagbibigay rito ng dahilan ng kanilang pananahimik; ang ‘sapagkat’ ay malinaw at marangal sa modernong Filipino.
- source_word: כִּי גָדַל הַכְּאֵב מְאֹד
  choice: napakatindi ng kanyang paghihirap
  rationale: Ang כְּאֵב ay maaaring tumukoy sa sakit, pagdurusa, o dalamhati. Ang ‘paghihirap’ ay natural at sapat na malawak upang masaklaw ang pisikal at emosyonal na dinaranas ni Job; ang napaka- ay nagpapahayag ng מְאֹד.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang ‘sa lupa’ at ‘kahit isang salita’ upang mapanatili ang konkretong larawan at diin ng Hebreo. Inilagay ang panandang [a] kaagad pagkatapos ng ‘paghihirap,’ ang salitang tinutukoy ng talababa.
