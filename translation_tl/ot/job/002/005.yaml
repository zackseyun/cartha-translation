  text: But stretch out your hand[a], please, and touch his bone and his flesh, and he will surely curse you to your face.
translation:
  language: tl
  text: Ngunit iunat mo nga ang iyong kamay at hipuin ang kaniyang buto at laman; tiyak na susumpain ka niya sa iyong harapan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “pagpapalain ka”; dito, nauunawaan ang pandiwa bilang eupemistikong pagpapahayag na nangangahulugang “susumpain ka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אוּלָם
  choice: Ngunit
  rationale: Malinaw na panalungat na nagbubukas sa tugon at hamon ni Satanas.
- source_word: שְׁלַח נָא יָדְךָ
  choice: iunat mo nga ang iyong kamay
  rationale: Ang idyomang Hebreo na literal na ‘ipadala ang iyong kamay’ ay tumutukoy sa pag-abot o pagkilos laban sa isang tao; ipinahihiwatig ng ‘nga’ ang pakiusap o pang-uudyok ng נָא.
- source_word: וְגַע
  choice: at galawin
  rationale: Pinananatili ang batayang diwa ng ‘humipo/gumalaw’ habang likas sa Filipino at hinahayaang ipahiwatig ng konteksto ang mapaminsalang pagkilos.
- source_word: אֶל עַצְמוֹ וְאֶל בְּשָׂרוֹ
  choice: ang kaniyang buto at laman
  rationale: Pinananatili ang kongkretong pares at kolektibong isahan sa Hebreo sa halip na gawing pangkalahatang ‘katawan.’
- source_word: אִם לֹא
  choice: tiyak na
  rationale: Sa pormulang ito ng mariing panunumpa o pagtiyak, hindi ito karaniwang kondisyon kundi isang matibay na pahayag.
- source_word: אֶל פָּנֶיךָ
  choice: nang harapan
  rationale: Natural na katumbas sa Filipino ng lantaran at tuwirang pagharap sa kausap.
- source_word: יְבָרֲכֶךָּ
  choice: susumpain ka niya
  rationale: Bagaman literal na ‘pagpapalain,’ ginagamit dito ang pandiwa bilang magalang na eupemismo para sa ‘susumpain,’ ayon sa malinaw na hamon ng konteksto.
theological_decisions:
- issue: Eupemistikong gamit ng ברך sa mga tagpo ng pagsubok kay Job
  choice: Isalin bilang ‘susumpain’ sa pangunahing teksto
  alternative: Isalin nang literal bilang ‘pagpapalain’ at ipaliwanag ang konteksto
  rationale: Ang hamon ay kung tatalikuran o lalapastanganin ni Job ang Diyos kapag nagdusa siya. Ang literal na ‘pagpapalain’ sa pangunahing teksto ay madaling makalito, kaya inilalagay sa talababa ang anyong literal upang mapanatili ang pagiging malinaw at nasusuri.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang kongkretong ‘buto at laman’ at ang mariing tono ng hamon nang hindi dinaragdagan ang teolohikal na kahulugan.
