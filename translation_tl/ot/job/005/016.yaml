  text: So there is hope for the poor[a], and injustice shuts its mouth.
translation:
  language: tl
  text: Kaya may pag-asa ang dukha, at tumitikom ang bibig ng kawalang-katarungan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kasamaan”; maaari ring isalin nang mas literal, “at pumikom ang bibig nito.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּהִי
  choice: nagkaroon
  rationale: Ang wayyiqtol ng היה ay naglalahad ng bungang kasunod ng naunang paglalarawan. Likas sa Filipino ang “nagkaroon ng pag-asa,” habang ipinahihiwatig ng “Kaya” ang ugnayang resultative.
- source_word: לַדַּל
  choice: ang dukha
  rationale: Ang דַּל ay maaaring tumukoy sa mahirap, mahina, o walang kapangyarihan sa lipunan. Saklaw ng “dukha” ang kahirapan at pagiging maralita o mahina, sa dignidad na angkop sa tulang karunungan.
- source_word: תִּקְוָה
  choice: pag-asa
  rationale: Karaniwang kahulugan nito ang pag-asa o inaasahan. “Pag-asa” ang malinaw at likas na katapat sa kontekstong ito.
- source_word: וְעֹלָתָה
  choice: kawalang-katarungan
  rationale: Ang עַוְלָה ay tumutukoy sa kawalang-katarungan, kasamaan, o maling gawa. Pinananatili ng “kawalang-katarungan” ang panlipunang kaibahan sa kalagayan ng dukha at ang pagsasatao sa ikalawang sugnay.
- source_word: קָפְצָה פִּיהָ
  choice: itinikom ... ang bibig nito
  rationale: Ang parirala ay literal na naglalarawan sa bibig ng kawalang-katarungan na nagsara o itinikom. Pinananatili ng salin ang matingkad na larawang Hebreo sa halip na palitan lamang ng “napatahimik.”
