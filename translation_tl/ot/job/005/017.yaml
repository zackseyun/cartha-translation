source:
  edition: WLC
  text: הִנֵּ֤ה אַשְׁרֵ֣י אֱ֭נוֹשׁ יוֹכִחֶ֣/נּֽוּ אֱל֑וֹהַּ וּ/מוּסַ֥ר שַׁ֝דַּ֗י אַל תִּמְאָֽס־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/005/017.yaml
  text: Behold[a], blessed is the man whom God reproves[e][d][c][b]; therefore do not despise the discipline of the Almighty.
translation:
  language: tl
  text: 'Narito: mapalad ang taong sinasaway ng Diyos[a]; kaya huwag mong hamakin ang pagdidisiplina ng Makapangyarihan sa Lahat.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “sinasaway” ay maaari ring isaling “itinutuwid” o “pinagsasabihan.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, Shaddai, na karaniwang isinasaling “Makapangyarihan sa Lahat.” Ang “pagdidisiplina” ay maaari ring tumukoy sa pagtutuwid o mapagturong pagsaway.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Tingnan mo
  rationale: Pinananatili ang puwersa ng panandang pantukoy-pansin na nagpapakilala sa isang mahalagang pahayag. Mas likas ito sa makabagong Filipino kaysa sa mas arkaikong “masdan.”
- source_word: אַשְׁרֵי
  choice: mapalad
  rationale: Ipinahahayag ng pormulang ito sa panitikang karunungan ang kanais-nais na kalagayan ng isang tao, hindi lamang ang damdaming masaya.
- source_word: אֱנוֹשׁ
  choice: ang tao
  rationale: Tumutukoy ito sa isang tao o mortal sa pangkalahatan. Likas na gender-inclusive sa Filipino ang “tao” at napapanatili nito ang pangkalahatang anyo ng kasabihan.
- source_word: יוֹכִחֶנּוּ
  choice: sinasaway
  rationale: Saklaw ng pandiwa ang mapagtuwid na pagsaway o pagwawasto. Ang “sinasaway” ay natural at pinananatili ang diin sa koreksiyong mula sa Diyos.
- source_word: אֱלוֹהַּ
  choice: Diyos
  rationale: Karaniwang salin ng titulong ito para sa Diyos sa aklat ng Job.
- source_word: וּמוּסַר
  choice: kaya ... ang pagdidisiplina
  rationale: Ang וְ ay nauunawaan dito bilang nag-uugnay sa naunang pagpapahayag ng pagiging mapalad at sa kasunod na payo. Ang מוּסָר ay formative at corrective na disiplina, kaya hindi ito nilimitahan sa parusa lamang.
- source_word: שַׁדַּי
  choice: ang Makapangyarihan sa Lahat
  rationale: Isinasalin ang banal na titulong Shaddai sa nakasanayang makahulugang katumbas sa Filipino.
- source_word: אַל־תִּמְאָס
  choice: huwag mong hamakin
  rationale: Ipinahahayag ng pandiwa ang paghamak o pagtanggi sa isang bagay na itinuturing na walang halaga; pinananatili ng “hamakin” ang matinding moral na puwersa nito.
theological_decisions:
- issue: Ang positibong paglalarawan sa pagsaway ng Diyos
  choice: mapalad ang taong sinasaway ng Diyos
  alternative: mapalad ang taong itinutuwid ng Diyos
  rationale: Pinananatili ng “sinasaway” ang kirot at bigat ng banal na pagsaway, samantalang inilalarawan pa rin ng buong talata na maaari itong maging kapaki-pakinabang na disiplina. Hindi nito awtomatikong ginagawang parusa ang bawat pagdurusa.
- issue: Ugnayan ng unang sugnay at ng utos
  choice: kaya
  alternative: at
  rationale: 'Bagaman karaniwang pang-ugnay ang וְ, sa konteksto ay may makatuwirang bunga ang ikalawang sugnay: dahil mapalad ang tumatanggap ng pagsaway ng Diyos, hindi dapat hamakin ang Kanyang pagdidisiplina. Ang “kaya” ay natural na nagpapakita ng ugnayang ito nang hindi dinaragdagan ang nilalaman.'
- issue: Pagsasalin sa שַׁדַּי
  choice: Makapangyarihan sa Lahat
  alternative: Shaddai
  rationale: Isinasalin ang titulo sa halip na transliterahin upang maunawaan agad ng karaniwang mambabasa, habang tinutukoy sa talababa ang Hebreong anyo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang karaniwang “tao” bilang pangkalahatang katawagan at iniwasan ang arkaikong pananalita. Ang ikalawang panauhang isahan na “mo/mong” ay tumutugma sa anyong isahan ng utos sa Hebreo.
