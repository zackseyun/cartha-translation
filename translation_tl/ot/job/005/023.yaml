translation_notes:
  register: Modernong Filipino na dignified at madaling maunawaan. Pinanatili ang poetikong larawan ng tipan sa mga bato at ang paralelismo nito sa mapayapang ugnayan sa mababangis na hayop; iniwasan ang sobrang pagpapaliwanag sa pangunahing teksto.
