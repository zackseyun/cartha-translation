base_translation:
  language: en
  yaml_path: translation/ot/job/005/023.yaml
  text: For you will have a covenant with the stones of the field[c][b][a], and the wild animals of the field will be at peace with you.
translation:
  language: tl
  text: Sapagkat magkakaroon ka ng tipan sa mga bato sa bukid[a], at ang mga ligaw na hayop sa bukid[b] ay makikipagpayapaan sa iyo[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga bato ng bukid.” Maaaring ipahiwatig ng parirala ang mga batong sagabal sa pagsasaka, ngunit tahasang pinananatili sa salin ang larawang Hebreo.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “mga hayop sa bukid” o “mga hayop sa parang.”
    reason: lexical_alternative
  - marker: c
    text: Sa mas literal na anyo, “nakipagpayapaan sa iyo” o “nakikipamuhay nang payapa sa iyo.” Inilalarawan ng Hebreo ang mapayapang ugnayan ng tao at ng mga ligaw na hayop.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikilala nito ang batayan o paliwanag sa naunang katiyakan at pinananatili ang lohikal na ugnayan.
- source_word: עִם אַבְנֵי הַשָּׂדֶה
  choice: sa mga bato sa bukid
  rationale: Ang “sa” ay natural sa pariralang Filipino na “magkaroon ng tipan sa,” habang tahasang pinananatili ng “mga bato sa bukid” ang matingkad na larawang Hebreo.
- source_word: בְרִיתֶךָ
  choice: magkakaroon ka ng tipan
  rationale: Walang hayag na pandiwa sa sugnay na Hebreo. Nagdaragdag ang salin ng pandiwang angkop sa kontekstong tumutukoy sa hinaharap nang hindi ipinapakahulugang higit sa isang ugnayang tipan.
- source_word: וְחַיַּת הַשָּׂדֶה
  choice: at ang mababangis na hayop sa bukid
  rationale: Sa pariralang ito, karaniwang tumutukoy ang חַיָּה sa mga hayop na ligaw. Malinaw at likas sa modernong Filipino ang “mababangis na hayop.”
- source_word: הָשְׁלְמָה לָךְ
  choice: ay makikipagpayapaan sa iyo
  rationale: Ipinahihiwatig ng anyong mula sa שׁלם ang paggawa ng kapayapaan o mapayapang pakikitungo. Ang hinaharap na anyo ay angkop sa konteksto ng pangakong katiyakan, samantalang ipinapaliwanag sa talababa ang anyo at iba pang posibleng salin.
