  text: הַ/נֹּתֵ֣ן מָ֭טָר עַל פְּנֵי אָ֑רֶץ וְ/שֹׁ֥לֵֽחַ מַ֝יִם עַל פְּנֵ֥י חוּצֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/005/010.yaml
  text: who gives rain on the face of the earth and sends water on the face of the fields[b][a],
translation:
  language: tl
  text: na nagbibigay ng ulan sa ibabaw ng lupa[a] at nagpapadala ng tubig sa ibabaw ng kaparangan[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “lupain.” Maaaring mangahulugan ang Hebreong אֶרֶץ ng “lupa/daigdig” o “lupain,” ayon sa konteksto.
    reason: lexical_alternative
  - marker: b
    text: O “mga lansangan” o “malalawak na pook sa labas.” Maaaring tumukoy ang Hebreong חוּצוֹת sa mga bukas na lugar, lansangan, o malawak na kapaligiran; sa kontekstong ito, mas angkop ang “kaparangan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנֹּתֵן
  choice: na nagbibigay
  rationale: Ang Qal participle na may pantukoy ay naglalarawan sa Diyos at nagpapatuloy sa naunang talata. Ang “na nagbibigay” ay likas na sugnay na panlarawan sa Filipino.
- source_word: מָטָר
  choice: ulan
  rationale: Karaniwang katawagan ito para sa ulan o presipitasyon; “ulan” ang malinaw at natural na katumbas.
- source_word: עַל־פְּנֵי אָרֶץ
  choice: sa ibabaw ng lupa
  rationale: Pinananatili ng “sa ibabaw” ang larawan ng Hebreong “sa mukha/ibabaw,” pati ang paralelismo sa ikalawang hati. Ang “lupa” ay maaaring tumukoy sa daigdig o sa lupain.
- source_word: וְשֹׁלֵחַ
  choice: at nagpapadala
  rationale: Ang kaparis na Qal participle ay isinalin bilang pandiwang nagpapatuloy sa unang sugnay at pinananatili ang ideya ng pagpapasapit o pagpapadala ng tubig.
- source_word: מַיִם
  choice: tubig
  rationale: Bagaman anyong maramihan sa Hebreo, karaniwang pangngalang di-mabilang ang kahulugan nito; natural sa Filipino ang “tubig.”
- source_word: עַל־פְּנֵי חוּצוֹת
  choice: sa ibabaw ng kaparangan
  rationale: Maaaring tumukoy ang חוּצוֹת sa mga lantad na lugar, lansangan, o malalawak na pook sa labas. Sa konteksto ng ulan at kalikasan, ang “kaparangan” ang angkop habang pinananatili ang malawak at bukas na larawan.
theological_decisions:
- issue: Saklaw ng אָרֶץ
  choice: lupa
  alternative: lupain
  rationale: Pangkalahatan ang paglalarawan sa pagkalinga ng Diyos sa pamamagitan ng ulan. Hindi nililimitahan ng “lupa” ang pahayag sa isang tiyak na teritoryo, ngunit itinatala sa talababa ang tunay na alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “na nagbibigay” upang ipakitang nagpapatuloy ang paglalarawan mula sa naunang talata. Pinanatili ang magkatulad na “sa ibabaw ng” upang maipakita ang paralelismo ng dalawang hati.
