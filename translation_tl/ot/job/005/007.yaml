  text: For man is born for trouble[a], and the sons of flame fly upward.
translation:
  language: tl
  text: 'Sapagkat ang tao ay isinilang para sa hirap,

    at ang mga anak ng apoy ay lumilipad paitaas.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O kaya, “at ang mga alipato ay lumilipad paitaas.” Sa literal na Hebreo, “ang mga anak ng apoy”; maaari rin itong unawain bilang “mga anak ni Reshef.” Karaniwang ipinapalagay na tumutukoy ang idyomang ito sa mga alipato.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Nagpapakilala ito ng paliwanag ni Elifaz at likas na nag-uugnay sa talata sa naunang pahayag.
- source_word: אָדָם
  choice: ang tao
  rationale: Pangkalahatang pantanging-isahan ang gamit ng pangngalan; ang “ang tao” ay likas sa modernong Tagalog bilang pagtukoy sa sangkatauhan sa pangkalahatan.
- source_word: לְעָמָל
  choice: sa hirap
  rationale: Maaaring tumukoy ang עָמָל sa pagpapagal, kaguluhan, o pagdurusa. Sapat ang lawak ng “hirap” upang masaklaw ang mabigat na kalagayan ng buhay nang hindi ito labis na binibigyang-kahulugan.
- source_word: יוּלָּד
  choice: ay ipinanganganak
  rationale: Ang anyong pasibo sa isang pangkalahatang kasabihan ay likas na isinasalin sa pangkasalukuyang pangkalahatang pahayag.
- source_word: וּבְנֵי רֶשֶׁף
  choice: at ang mga anak ng apoy
  rationale: Pinananatili nito ang di-pangkaraniwan at pinagtatalunang larawang Hebreo, na literal na maaaring “mga anak ng apoy/Reshef,” sa halip na agad itong ipakahulugang “mga alipato.”
- source_word: יַגְבִּיהוּ עוּף
  choice: ay lumilipad paitaas
  rationale: Magkasamang inilalarawan ng dalawang salitang Hebreo ang mataas o paitaas na paglipad; malinaw at natural itong naipahahayag sa Tagalog sa iisang parirala.
theological_decisions: []
translation_notes:
  register: Gumamit ng makabago ngunit marangal na Filipino. Pinanatili ang anyong kawikaan at ang kakaibang imahen ng Hebreo, habang inilagay sa talababa ang karaniwang interpretasyong “mga alipato.”
