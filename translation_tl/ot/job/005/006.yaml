  yaml_path: translation/ot/job/005/006.yaml
  text: For trouble does not come from the dust[a], nor does toil sprout from the ground.
translation:
  language: tl
  text: Sapagkat hindi nagmumula sa alabok ang hirap,[a] ni sumisibol mula sa lupa ang pagpapagal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Sapagkat ang kasamaan ay hindi nagmumula sa alabok, ni sumisibol mula sa lupa ang pagdurusa.” Ang mga salitang Hebreo ay maaari ring tumukoy sa moral na kasamaan o sa kapahamakan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikita ang paliwanag na kaugnay ng naunang pahayag at natural na pinananatili ang ugnayang pangangatwiran.
- source_word: יֵצֵא
  choice: nagmumula
  rationale: Ipinahahayag ang paglabas o paglitaw mula sa isang pinagmulan; mas likas sa Filipino ang “nagmumula” sa pariralang ito.
- source_word: מֵעָפָר
  choice: sa alabok
  rationale: Ang עָפָר ay karaniwang “alabok”; kasama ng “nagmumula,” natural na naipahahayag ng “sa alabok” ang pinagmulan.
- source_word: אָוֶן
  choice: hirap
  rationale: Maaaring tumukoy sa kasamaan, kapahamakan, o paghihirap. Sa konteksto ng Job at katambal ng עָמָל, ang “hirap” ay sapat na malawak at hindi agad nagpapasiya kung moral na kasamaan o dinanas na kapighatian ang ibig sabihin.
- source_word: וּמֵאֲדָמָה
  choice: ni ... sa lupa
  rationale: Ang אֲדָמָה ay lupa o lupang tinutubuan. Pinananatili ng “lupa” ang larawang pansakahan at ang paralelismo sa “alabok.”
- source_word: יִצְמַח
  choice: sumisibol
  rationale: Pandiwang ginagamit sa pagtubo ng halaman; malinaw nitong pinananatili ang metapora ng paglitaw mula sa lupa.
- source_word: עָמָל
  choice: pagpapagal
  rationale: Maaaring mangahulugan ng mabigat na paggawa, hirap, o pagdurusa. Ang “pagpapagal” ay nagpapanatili sa aspekto ng nakapapagod na paggawa at sa kaibahan nito sa mas malawak na “hirap.”
theological_decisions:
- issue: Saklaw ng kahulugan ng אָוֶן at עָמָל sa sinabi ni Elifaz
  choice: Inilalarawan ang hirap at pagpapagal bilang hindi kusang nagmumula sa lupa.
  alternative: Maaaring tumukoy ang mga salita sa kasamaan at pagdurusa, o sa kapahamakan at dalamhati.
  rationale: Pinananatili ng salin ang larawang pansakahan at ang pahayag ni Elifaz nang hindi idinaragdag ang mas tiyak na aral na lahat ng pagdurusa ay tuwirang bunga ng moral na kasalanan.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “hirap” at “pagpapagal” upang maging malinaw sa karaniwang mambabasa habang pinananatili sa talababa ang tunay na lawak ng mga terminong Hebreo.
