  yaml_path: translation/ot/job/005/025.yaml
  text: You will know that your offspring are many[b][a], and your descendants are like the grass of the earth.
translation:
  language: tl
  text: Malalaman mong marami ang iyong mga supling[a], at ang iyong mga inapo ay gaya ng damo sa lupa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “binhi mo”; ang salitang Hebreo na זַרְעֶךָ ay kolektibong katawagan para sa mga anak o salinlahi.
    reason: lexical_alternative
  - marker: b
    text: O, “damo sa daigdig.” Ang salitang Hebreo na אֶרֶץ ay maaaring mangahulugang “lupa,” “lupain,” o “daigdig,” ayon sa konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָדַעְתָּ
  choice: Malalaman mo
  rationale: Ang Qal perfect na may pang-ugnay ay may diwang panghinaharap o bunga sa kontekstong patula; natural sa makabagong Tagalog ang “Malalaman mo.”
- source_word: כִּי
  choice: -ng / na
  rationale: Ipinakikilala nito ang nilalaman ng malalaman. Ikinabit ito sa “Malalaman mo” bilang “Malalaman mong” para sa likas na daloy sa Tagalog.
- source_word: רַב
  choice: marami
  rationale: Tumutukoy ito sa kasaganaan o dami ng kolektibong זֶרַע, hindi sa pisikal na laki o kadakilaan.
- source_word: זַרְעֶךָ
  choice: iyong mga supling
  rationale: Bagaman literal na “binhi,” ang salita rito ay kolektibong tumutukoy sa mga anak o salinlahi. Malinaw at likas sa kasalukuyang Tagalog ang “mga supling.”
- source_word: וְצֶאֱצָאֶיךָ
  choice: at ang iyong mga inapo
  rationale: Tumutukoy sa mga nagmula sa isang tao o sa kaniyang salinlahi. Pinananatili ng “mga inapo” ang pagkakaiba nito sa naunang “mga supling” at ang paralelismo ng taludtod.
- source_word: כְּעֵשֶׂב
  choice: ay gaya ng damo
  rationale: Pinananatili ang tahasang paghahambing sa masaganang pananim at gumagamit ng natural na parirala sa Tagalog.
- source_word: הָאָרֶץ
  choice: sa lupa
  rationale: Maaaring mangahulugan ang אֶרֶץ ng lupa, lupain, o daigdig. Ang “damo sa lupa” ay likas sa Tagalog at angkop sa larawan ng laganap at masaganang damo, habang itinatala sa talababa ang alternatibo.
