translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “supling” at “inapo” upang mapanatili ang magkatulad ngunit hindi lubos na magkaparehong mga katawagan sa Hebreo. Ang mga panaguri ay inayos ayon sa likas na sintaks ng Tagalog nang hindi binabago ang katiyakan at larawang patula ng talata.
