  source_fidelity: 'Tapat ang salin sa dalawang magkakatulad na sugnay ng Hebreo: ang יוֹמָם ay naisalin bilang “Sa araw,” ang יְפַגְּשׁוּ חֹשֶׁךְ bilang “kadiliman ang kanilang nasasalubong,” at ang בַצָּהֳרָיִם יְמַשְׁשׁוּ ay “sa katanghaliang-tapat ay nangangapa sila.” Naipapahayag din ng “na para bang gabi” ang paghahambing na minamarkahan ng כְּ sa וְכַלַּיְלָה, nang hindi nagdaragdag ng interpretasyon.'
