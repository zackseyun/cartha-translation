  yaml_path: translation/ot/job/005/014.yaml
  text: By day they meet darkness[a], and at noon they grope as in the night.
translation:
  language: tl
  text: 'Sa araw ay kadiliman ang kanilang nasasalubong,

    at sa katanghaliang-tapat ay nangangapa sila na para bang gabi.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring “na parang gabi” o “gaya ng sa gabi.” May unlaping naghahayag ng paghahambing ang salitang Hebreo para sa “gabi”: nangangapa sila sa katanghaliang-tapat na waring gabi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹמָם
  choice: Sa araw
  rationale: Ginamit bilang pang-abay na panahunan, “sa araw” o “sa panahon ng araw,” at pinananatili ang tuwirang pagsalungat sa gabi at katanghaliang-tapat.
- source_word: יְפַגְּשׁוּ
  choice: nasasalubong
  rationale: Ang פגשׁ ay tumutukoy sa pagsalubong o pagharap sa isang bagay. Likas sa Filipino ang “kadiliman ang kanilang nasasalubong” at naipadarama nitong di-inaasahang kadiliman ang kanilang kinakaharap.
- source_word: חֹשֶׁךְ
  choice: kadiliman
  rationale: Karaniwang katumbas ng salitang Hebreo at pinananatili ang kapuwa literal at matalinghagang bisa nang hindi labis na binibigyang-kahulugan.
- source_word: וְכַלַּיְלָה
  choice: na para bang gabi
  rationale: Ang unlaping כְּ ay naghahayag ng paghahambing. Nililinaw ng parirala na nangangapa sila sa katanghaliang-tapat na waring gabi.
- source_word: יְמַשְׁשׁוּ
  choice: nangangapa
  rationale: Tumpak at natural na katumbas ng משׁשׁ, ang pagkapa upang matagpuan ang daan o bagay kapag hindi makakita.
- source_word: בַצָּהֳרָיִם
  choice: sa katanghaliang-tapat
  rationale: Tumutukoy sa tanghali, ang pinakamaliwanag na bahagi ng araw. Ang “katanghaliang-tapat” ay likas at matingkad sa Filipino at pinananatili ang kabalintunaan ng larawan.
