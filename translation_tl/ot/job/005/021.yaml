translation_notes:
  register: Gumamit ng moderno ngunit marangal na Filipino. Pinanatili ang metaporang “hagupit ng dila” at ang pasibong larawan ng pagkakubli, habang inayos ang pangungusap upang maging natural at malinaw sa karaniwang mambabasa.
