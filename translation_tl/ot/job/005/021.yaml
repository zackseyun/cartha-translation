  text: You will be hidden from the lash of the tongue[b][a], and you will not fear destruction when it comes.
translation:
  language: tl
  text: 'Maitatago ka mula sa hagupit ng dila[a],


    at hindi ka matatakot sa pagkawasak[b] kapag dumating iyon.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “hagupit ng dila,” isang metapora para sa mapanlait o mapanirang-puring pananalita.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin ang “pagkawasak” bilang “pananalanta” o “kapahamakan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשׁוֹט
  choice: sa hagupit
  rationale: Ang שׁוֹט ay literal na latigo o hagupit. Pinananatili ng “hagupit” ang matingkad na metapora ng mapanakit na pananalita.
- source_word: לָשׁוֹן
  choice: ng dila
  rationale: Ang לָשׁוֹן ay “dila” na ginagamit dito bilang metonimiya para sa pananalita. Pinananatili ang larawang Hebreo sa halip na gawing tahasang “pananalita.”
- source_word: תֵּחָבֵא
  choice: maikukubli ka
  rationale: Ang Niphal ng חבא ay nagpapahiwatig ng pagkakubli o pagtatago. Ang “maikukubli ka” ay malapit sa anyong pasibo ng Hebreo at hindi labis na nagpapaliwanag kung paano ibinibigay ang proteksiyon.
- source_word: וְלֹא תִירָא
  choice: at hindi ka matatakot
  rationale: Tuwirang ipinapahayag nito ang katiyakang nasa negatibong imperfect, sa natural na modernong Tagalog.
- source_word: מִשֹּׁד
  choice: sa pagkawasak
  rationale: Ang שֹׁד ay maaaring tumukoy sa marahas na pagkawasak, pananalanta, o kapahamakan. Malinaw at sapat na malawak ang “pagkawasak,” habang inilalahad sa talababa ang mga posibleng kahulugan.
- source_word: כִּי יָבֹוא
  choice: kapag dumating iyon
  rationale: Binibigyang-kahulugan ang כִּי bilang temporal dito. Ang “kapag dumating iyon” ay likas sa Tagalog at pinananatili ang tinutukoy na pagkawasak.
