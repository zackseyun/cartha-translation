id: JOB.5.4
reference: Job 5:4
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: יִרְחֲק֣וּ בָנָ֣י/ו מִ/יֶּ֑שַׁע וְ/יִֽדַּכְּא֥וּ בַ֝/שַּׁ֗עַר וְ/אֵ֣ין מַצִּֽיל׃
base_translation:
  language: en
  yaml_path: translation/ot/job/005/004.yaml
  text: His children are far from safety[a], and they are crushed in the gate[b], with no one to rescue them.
translation:
  language: tl
  text: Ang kanyang mga anak ay malayo sa kaligtasan[b]; dinudurog sila sa pintuang-bayan[a], at walang sinumang magligtas sa kanila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “pintuang-bayan” ang karaniwang lugar noon para sa paglilitis at paggawa ng mga pampublikong pasiya.
    reason: cultural_note
  - marker: b
    text: Maaari ring “malayo sa pagliligtas” o “malayo sa pagkaligtas.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרְחֲקוּ
  choice: ay malayo
  rationale: Ipinahahayag ng רחק ang kalagayang malayo o hiwalay. Ang “ay malayo” ay natural sa Filipino at pinananatili ang aspektong stative ng konteksto.
- source_word: בָנָיו
  choice: kanyang mga anak
  rationale: Maaaring tumukoy ang בנים sa mga anak na lalaki o sa mga anak sa pangkalahatan. Ang “mga anak” ay likas at hindi nagdaragdag ng diin sa kasarian na wala naman sa konteksto.
- source_word: מִיֶּשַׁע
  choice: sa kaligtasan
  rationale: Saklaw ng יֶשַׁע ang pagliligtas, kaligtasan, at pagkaligtas sa panganib. Dito, ang “kaligtasan” ay angkop sa praktikal na seguridad o pagliligtas at hindi kinakailangang tumukoy sa teknikal na doktrina ng kaligtasan.
- source_word: וְיִדַּכְּאוּ
  choice: dinudurog sila
  rationale: 'Malakas ang diwa ng דכא: durugin, wasakin, o supilin. Ang “dinudurog sila” ay nagpapanatili sa marahas na larawan at sa pasibong diwa ng Hebreo.'
- source_word: בַשַּׁעַר
  choice: sa pintuang-bayan
  rationale: Ang שַׁעַר ay pintuan ng lungsod o bayan, na karaniwang pook ng paglilitis at mga pampublikong pasiya. Nililinaw ng “pintuang-bayan” ang tinutukoy nang hindi isinasalin agad ang legal na implikasyon bilang tahasang paliwanag.
- source_word: וְאֵין מַצִּיל
  choice: at walang sinumang magligtas sa kanila
  rationale: 'Pinananatili nito ang eksistensiyal na diin ng אֵין kasama ng participle מַצִּיל: walang taong naroon na sasagip o magliligtas.'
theological_decisions:
- issue: Saklaw ng יֶשַׁע
  choice: kaligtasan
  alternative: pagliligtas; kaligtasang dulot ng pagsagip
  rationale: Hindi nililimitahan ang salita sa doktrinal na ‘salvation’; nananatiling bukas ang praktikal na diwa ng pagkaligtas o seguridad sa konteksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “pintuang-bayan” upang maging madaling maunawaan ang sinaunang tagpuan, habang ipinaliliwanag sa talababa ang legal at panlipunang gamit nito. Inayos ang mga marker upang tumapat sa nilalaman ng kani-kanilang talababa.
