- from: Ang kanyang ani ay kinakain ng nagugutom; kinukuha nila iyon kahit mula sa gitna ng mga tinik, at ang mga nauuhaw ay sabik na naghahangad sa kanilang kayamanan.[a]
  to: Ang kanyang ani ay kinakain ng nagugutom, at kinukuha rin ito ng nagugutom kahit mula sa gitna ng mga tinik; ang mga nauuhaw ay sabik na naghahangad sa kanilang kayamanan.[a]
  rationale: Pinalitan ang hindi nakatukoy na “nila” ng pag-uulit sa “ng nagugutom.” Pinananatili nito ang pangkalahatang isahang gamit ng Hebreo at nililinaw na ang kumukuha ng ani ay siya ring nagugutom, nang hindi binabago ang kahulugan o ang maingat na paggamot sa mahirap na huling sugnay.
