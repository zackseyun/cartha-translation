base_translation:
  language: en
  yaml_path: translation/ot/job/005/005.yaml
  text: The hungry eat his harvest[a], and take it even from among the thorns, and the thirsty pant after their wealth.
translation:
  language: tl
  text: Ang kanyang ani ay kinakain ng nagugutom, at kinukuha rin ito ng nagugutom kahit mula sa gitna ng mga tinik; ang mga nauuhaw ay sabik na naghahangad sa kanilang kayamanan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “at nilalamon ng isang silo o bitag ang kanilang kayamanan.” Mahirap unawain ang Hebreo sa huling sugnay; sinusunod ng pangunahing teksto ang karaniwang pagbasa na itinatambal ang “mga nauuhaw” sa “nagugutom.”
    reason: alternative_reading
lexical_decisions:
- source_word: קְצִירוֹ
  choice: kanyang ani
  rationale: Ang קָצִיר ay tumutukoy sa ani o inaning bunga; pinananatili ng “kanyang” ang panlalaking pang-isahang hulapi.
- source_word: רָעֵב
  choice: ang nagugutom
  rationale: Pang-uring ginagamit bilang pangngalan; natural ito sa Filipino at hindi labis na tinutukoy kung isa o pangkalahatang uri ang tinutukoy.
- source_word: וְאֶל מִצִּנִּים יִקָּחֵהוּ
  choice: kinukuha nila iyon kahit mula sa gitna ng mga tinik
  rationale: Pinananatili ang matingkad ngunit mahirap na larawang ang ani ay kinukuha maging mula sa matinik na lugar, nang hindi ipinapalagay na tiyak na bakod ang mga tinik.
- source_word: צִנִּים
  choice: mga tinik
  rationale: Ito ang pinakatuwirang kahulugan sa kontekstong agrikultural, bagaman may iba pang iminungkahing pakahulugan.
- source_word: וְשָׁאַף
  choice: sabik na naghahangad
  rationale: Ipinahahayag nito ang paghingal o masidhing pagnanasa na nasa pandiwa, sa natural na Filipino.
- source_word: צַמִּים
  choice: ang mga nauuhaw
  rationale: Sinusunod ang karaniwang pagbasa na kaagapay ng “nagugutom,” habang inilalahad sa talababa ang alternatibong pagbasa tungkol sa bitag o silo.
- source_word: חֵילָם
  choice: kanilang kayamanan
  rationale: Sa karunungang panitikan, ang חַיִל ay maaaring tumukoy sa yaman, ari-arian, o mga kabuhayang taglay; ang “kayamanan” ay akma sa pag-agaw ng mga pag-aari.
theological_decisions: []
translation_notes:
  register: Makabago at marangal na Filipino. Ginamit ang payak na bokabularyo at pinanatili ang mahirap na larawang Hebreo. Ang paglipat mula sa pang-isahang “nagugutom” tungo sa maramihang “nila” ay sumasalamin sa di-tiyak na pangkalahatang tinutukoy, ngunit maaaring basahin ang “kinukuha” bilang pagpapatuloy ng kolektibong tagaganap.
