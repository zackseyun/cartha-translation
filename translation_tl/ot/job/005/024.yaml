base_translation:
  language: en
  yaml_path: translation/ot/job/005/024.yaml
  text: You will know that your tent is at peace[a], and when you inspect your dwelling, you will not miss anything.
translation:
  language: tl
  text: Malalaman mong payapa ang iyong tolda, at kapag siniyasat mo ang iyong tahanan, wala kang makikitang kulang.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “hindi ka magkakasala.” Ang pandiwang Hebreo ay karaniwang nangangahulugang “magkasala,” ngunit maaari rin itong mangahulugang “sumala” o “magkulang”; sa kontekstong ito, malamang na ang diwa ay walang makikitang kulang o nawawala.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָדַעְתָּ
  choice: Malalaman mo
  rationale: Ang Qal perfect na may pang-ugnay ay may panghinaharap na diwa sa serye ng mga pangako; natural itong ipinahahayag sa Filipino bilang “Malalaman mo.”
- source_word: כִּי שָׁלוֹם אָהֳלֶךָ
  choice: na payapa ang iyong tolda
  rationale: Ang כִּי ay nagpapakilala sa nilalaman ng malalaman. Ang שָׁלוֹם ay sumasaklaw sa kapayapaan, kaligtasan, at maayos na kalagayan; pinananatili ng “payapa” ang pangunahing larawan nang hindi ito nililimitahan sa seguridad lamang. Ang “tolda” ay nagpapanatili sa sinaunang kongkretong larawan ng אָהֶל.
- source_word: וּפָקַדְתָּ
  choice: at kapag siniyasat mo
  rationale: Sa kontekstong ito, ang פקד ay tumutukoy sa pagdalaw o maingat na pagtingin at pagtutuos sa kalagayan ng sambahayan. Ipinahahayag ng “kapag siniyasat mo” ang natural na ugnayang temporal sa kasunod na sugnay.
- source_word: נָוְךָ
  choice: iyong tahanan
  rationale: Ang נָוֶה ay maaaring mangahulugang tirahan, tahanan, o pastulan. Kaagapay ng “tolda,” ang “tahanan” ay natural at marangal sa modernong Filipino at tumutukoy sa buong saklaw ng tirahan o sambahayan.
- source_word: וְלֹא תֶחֱטָא
  choice: wala kang makikitang kulang
  rationale: Bagaman karaniwang nangangahulugang “magkasala” ang חטא, maaari rin itong mangahulugang “sumala” o “magkulang.” Matapos siyasatin ang tahanan, ang di-moral na diwang walang makikitang nawawala o kulang ang pinakamalinaw sa konteksto.
theological_decisions:
- issue: Kahulugan ng וְלֹא תֶחֱטָא
  choice: wala kang makikitang kulang
  alternative: hindi ka magkakasala
  rationale: Ang agarang konteksto ay ang kapayapaan at pagiging buo ng sambahayan. Gayunman, dahil tunay na posible sa Hebreo ang moral na kahulugang “magkasala,” pinananatili iyon sa talababa sa halip na tuluyang alisin ang leksikal na tensiyon.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Pinanatili ang “tolda” bilang kongkretong sinaunang larawan, habang ginamit ang “tahanan” para sa mas malawak na saklaw ng נָוֶה. Ang “wala kang makikitang kulang” ay mas idyomatiko kaysa literal na “hindi ka sasala” at umaayon sa larawan ng pagsisiyasat.
