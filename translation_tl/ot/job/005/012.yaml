  text: He frustrates the schemes of the crafty, so that their hands accomplish no success.
translation:
  language: tl
  text: Binibigo niya ang mga pakana ng mga tuso, kaya walang anumang tagumpay na nakakamit ng kanilang mga kamay.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מֵפֵר
  choice: Binibigo
  rationale: Ipinahihiwatig ng Hiphil participle na pinawawalang-bisa o hinahadlangan ng Diyos ang mga balak; natural at tuwiran ang “binibigo” sa modernong Tagalog.
- source_word: מַחְשְׁבוֹת
  choice: mga pakana
  rationale: Sa kontekstong kaugnay ng עֲרוּמִים, tumutukoy ito sa mga planong may tusong layunin, kaya mas angkop ang “mga pakana” kaysa sa neutral na “mga kaisipan.”
- source_word: עֲרוּמִים
  choice: mga tuso
  rationale: Pinananatili nito ang negatibong diwa ng pagiging mautak at mapanlinlang sa konteksto.
- source_word: תּוּשִׁיָּה
  choice: tagumpay
  rationale: Malawak ang saklaw ng salita—maaaring kakayahan, mabisang karunungan, o matagumpay na kinalabasan. Sa sugnay na ito, malinaw at natural na ipinahahayag ng “tagumpay” ang ideya ng mabisang resulta nang labis na hindi nililimitahan ang kahulugan.
theological_decisions:
- issue: Ang Diyos bilang humahadlang sa mga pakana ng tuso
  choice: Tahasan ang Diyos na paksa sa “Binibigo niya,” ayon sa konteksto.
  alternative: 'Gawing impersonal: “Nabibigo ang mga pakana.”'
  rationale: Bagaman panghalip lamang ang nasa talata, ang naunang konteksto ang nagtuturo sa Diyos bilang gumagawa; pinananatili ng salin ang aktibong pagkilos niya nang walang idinaragdag na pangalang wala sa mismong talata.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Pinanatili ang konkretong Hebreong idyoma na “kanilang mga kamay,” habang ginawang natural ang ayos ng pangungusap.
