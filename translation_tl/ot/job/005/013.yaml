  text: He catches the wise in their craftiness[c][b][a], and the counsel of the twisted is hurried along.
translation:
  language: tl
  text: Hinuhuli niya ang marurunong sa sarili nilang katusuhan[a], at ang balak ng mga taong baluktot[b] ay minamadali.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa sarili nilang pagiging tuso” o “sa pamamagitan ng sarili nilang katusuhan.” Maaari ring tumukoy ang salitang Hebreo sa pagiging maingat o madiskarte sa ibang konteksto, ngunit negatibo ang diwa rito.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “mga mandaraya,” “mga liko,” o “mga paliku-liko.”
    reason: lexical_alternative
  - marker: c
    text: Sa mas literal na salin, “ay minamadali” o “ay itinutulak nang mabilis.” Maaaring ipahiwatig ng konteksto na ang kanilang balak ay napapahamak dahil sa pagmamadali, ngunit hindi ito tahasang sinasabi ng pandiwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹכֵד
  choice: Hinuhuli
  rationale: Ang Qal participle ay gumaganap bilang pandiwa at naglalarawan sa Diyos, batay sa konteksto. Pinananatili ng “hinuhuli” ang larawan ng pagsilo o pagdakip.
- source_word: חֲכָמִים
  choice: ang marurunong
  rationale: Pang-uring maramihan na ginamit bilang pangngalan. Ang “marurunong” ay natural sa Filipino at nagpapanatili sa kabalintunaan na ang itinuturing na marunong ang siyang nahuhuli.
- source_word: בְּעָרְמָם
  choice: sa sarili nilang katusuhan
  rationale: Bagaman maaaring tumukoy ang עָרְמָה sa katalinuhan o pagiging madiskarte, negatibo ang diwa rito. Ang “katusuhan” ay angkop sa mapanlinlang na talinong tinutukoy.
- source_word: וַעֲצַת
  choice: at ang balak
  rationale: Maaaring mangahulugan ang עֵצָה ng payo, panukala, o balak. Sa konteksto ng mga pakanang binibigo, mas natural ang “balak.”
- source_word: נִפְתָּלִים
  choice: ng mga liko ang isip
  rationale: Ang salita ay naglalarawan ng pagiging baluktot, paliku-liko, o mapanlinlang. Ang idyomang “liko ang isip” ay natural na moral na paglalarawan sa Filipino habang pinananatili ang talinghaga ng pagkabaluktot.
- source_word: נִמְהָרָה
  choice: ay minamadali tungo sa kabiguan
  rationale: Ang Niphal perfect ay nagpapahiwatig na ang balak ay itinutulak nang madalian. Idinagdag ang “tungo sa kabiguan” upang maipahayag sa natural na Filipino ang kontekstuwal na diwa ng padalus-dalos na pagkabigo, habang itinatala sa talababa ang mas pormal na alternatibo.
theological_decisions:
- issue: Hindi tahasang binanggit na simuno ng participle
  choice: Isinalin bilang “niya,” na tumutukoy sa Diyos mula sa nakapaligid na konteksto.
  alternative: Isang di-tiyak na simuno, gaya ng “may humuhuli.”
  rationale: Walang tahasang simuno sa Hebreo, ngunit ang Job 5:9–16 ay nagsasalaysay ng mga gawa ng Diyos. Kailangan ng natural na Filipino ang simuno, kaya ipinagpapatuloy ng “niya” ang simuno mula sa konteksto nang hindi nagdaragdag ng bagong teolohikal na pahayag.
- issue: Moral na kulay ng עָרְמָה at נִפְתָּלִים
  choice: 'Kapuwa isinalin nang may negatibong moral na diwa: “katusuhan” at “mga liko ang isip.”'
  alternative: Mas neutral na mga salin gaya ng “pagiging madiskarte” at “mga paliku-liko.”
  rationale: Ipinakikita ng paralelismo at konteksto na mga mapanlinlang na pakana ang binibigo, hindi simpleng talino o pagiging komplikado.
- issue: Diwa ng נִמְהָרָה
  choice: “minamadali tungo sa kabiguan”
  alternative: “minamadali” o “itinutulak nang mabilis”
  rationale: Pinananatili ng pangunahing salin ang pasibong kilos at nililinaw ang kontekstuwal na bunga, ngunit hindi ito ginagawang isang tiyak na teknikal o doktrinal na pahayag.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “marurunong,” “katusuhan,” at “balak” bilang madaling maunawaang mga salita. Ang “mga liko ang isip” ay isang likas na idyomang Filipino na nagpapanatili sa moral at metaporikal na puwersa ng Hebreo.
