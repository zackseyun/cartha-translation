translation_notes:
  register: Makabago ngunit marangal na Filipino, na may dalawang magkatimbang na linyang patula. Ang pambungad na “na” ay nagpapanatili sa ugnayang sintaktiko ng talata sa naunang konteksto. Lumilitaw sa pangunahing teksto ang lahat ng panandang talababa.
