    reason: lexical_alternative
lexical_decisions:
- source_word: עֹשֶׂה
  choice: na gumagawa
  rationale: Ang Qal participle ay naglalarawan sa Diyos sa pagpapatuloy ng naunang konteksto; natural sa Filipino ang sugnay na “na gumagawa.”
- source_word: גְדֹלוֹת
  choice: mga dakilang bagay
  rationale: Substantibal ang pangmaramihang pang-uri. Tuwiran at hindi labis na mapagpakahulugan ang “mga dakilang bagay.”
- source_word: וְאֵין חֵקֶר
  choice: na hindi masiyasat
  rationale: Ipinahihiwatig ng Hebreong parirala na walang ganap na pagsisiyasat o pagtarok sa mga ito. Pinananatili ng “hindi masiyasat” ang diwang iyon sa maikli at likas na Filipino.
- source_word: נִפְלָאוֹת
  choice: mga kababalaghan
  rationale: Tumutukoy ito sa mga pambihira at kamangha-manghang gawa; ang “mga kababalaghan” ay angkop sa marangal na panulaang biblikal.
- source_word: עַד אֵין מִסְפָּר
  choice: hindi mabilang
  rationale: Idyoma ito para sa di-mabilang na dami. Malinaw at natural ang “hindi mabilang,” at kaagapay nito ang unang linya.
