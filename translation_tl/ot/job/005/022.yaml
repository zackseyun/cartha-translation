base_translation:
  language: en
  yaml_path: translation/ot/job/005/022.yaml
  text: At destruction and famine you will laugh[a], and you will not fear the beasts of the earth.
translation:
  language: tl
  text: Tatawanan mo ang pagkawasak at taggutom, at hindi ka matatakot sa mababangis na hayop sa lupa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O: “at huwag kang matakot sa mababangis na hayop sa lupa.” Maaaring basahin ang anyong Hebreo bilang isang pagbabawal, bagaman sa kontekstong ito ay malamang na nagsisilbi itong katiyakan ng kaligtasan.'
    reason: alternative_reading
lexical_decisions:
- source_word: שֹׁד
  choice: pagkawasak
  rationale: Tumutukoy ang salita sa marahas na pagkawasak o matinding kapahamakan. Ang “pagkawasak” ay tuwiran at angkop na katambal ng “taggutom.”
- source_word: כָּפָן
  choice: taggutom
  rationale: Tumutukoy ito sa malawak at matinding kakulangan ng pagkain, hindi lamang sa personal na gutom.
- source_word: תִּשְׂחָק
  choice: tatawanan mo
  rationale: Pinananatili nito ang matingkad na larawan ng pagtawa sa harap ng panganib, na maaaring magpahiwatig ng kawalan ng takot nang hindi labis na ipinapaliwanag ang himig.
- source_word: מֵחַיַּת הָאָרֶץ
  choice: sa mababangis na hayop sa lupa
  rationale: Sa kontekstong ito, ang חַיָּה ay likas na tumutukoy sa mga hayop na mailap o mapanganib. Ang “sa lupa” ay nagpapanatili sa saklaw ng הָאָרֶץ nang hindi ginagawang di-likas ang Filipino.
- source_word: אַל תִּירָא
  choice: hindi ka matatakot
  rationale: Bagaman karaniwang naghahayag ng pagbabawal ang אַל na may imperfect, ang pagkakasunod-sunod ng mga pangako sa konteksto ay nagpapahintulot na unawain ito bilang katiyakan. Inilalahad sa talababa ang tunay na alternatibong pagbasa.
theological_decisions:
- issue: Lakas o tungkulin ng אַל תִּירָא sa konteksto
  choice: 'Katiyakan o pangako: “hindi ka matatakot”'
  alternative: 'Utos o pagbabawal: “huwag kang matakot”'
  rationale: Bahagi ang talata ng sunod-sunod na paglalarawan ng proteksiyon at pagpapala, kaya likas sa daloy ang pagbasa bilang katiyakan. Gayunman, tunay na posible sa balarilang Hebreo ang pagbabawal, kaya hindi ito ikinukubli at inilalagay sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang paralelismo ng dalawang uri ng kapahamakan at ang matalinghagang pagtawa sa harap ng mga ito. Inilagay ang pananda ng talababa sa sugnay na may aktuwal na alternatibong pagbasa.
