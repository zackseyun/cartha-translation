id: JOB.5.1
reference: Job 5:1
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: קְֽרָא נָ֭א הֲ/יֵ֣שׁ עוֹנֶ֑/ךָּ וְ/אֶל מִ֖י מִ/קְּדֹשִׁ֣ים תִּפְנֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/005/001.yaml
  text: Call now—is there anyone who will answer you? And to which of the holy ones will you turn?[a]
translation:
  language: tl
  text: Tumawag ka ngayon—mayroon bang sasagot sa iyo? At kanino sa mga banal ka babaling?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga santo” o “mga banal na nilalang.” Malamang na ang Hebreong “mga banal” ay tumutukoy rito sa mga nilalang sa langit.
    reason: lexical_alternative
lexical_decisions:
- source_word: קְרָא
  choice: Tumawag ka
  rationale: Pautos na anyo ng קרא. Ang “tumawag” ay tuwiran at natural, at hindi nito dinaragdagan ang tindi ng damdamin gaya ng maaaring ipahiwatig ng “sumigaw.”
- source_word: נָא
  choice: ngayon
  rationale: Sa mapanghamong konteksto ng pananalita ni Elifaz, ipinahihiwatig ng kataga ang paghimok o pagkaapurahan; mas angkop dito ang “ngayon” kaysa sa magalang na “pakiusap.”
- source_word: הֲיֵשׁ
  choice: mayroon bang
  rationale: Pinananatili nito ang eksistensiyal at retorikal na tanong ng Hebreo sa likas na Filipino.
- source_word: עוֹנֶךָ
  choice: sasagot sa iyo
  rationale: Ang anyo mula sa ענה ay tumutukoy sa isang sasagot sa kausap. Ginamit ang panghinaharap upang maging natural sa Filipino at mapanatili ang hamon ng tanong.
- source_word: וְאֶל־מִי
  choice: At kanino
  rationale: Natural na panimula ito sa ikalawang retorikal na tanong; ang kasunod na “sa mga banal” ang naglilinaw sa pangkat na tinutukoy.
- source_word: מִקְּדֹשִׁים
  choice: sa mga banal
  rationale: Ang maramihang pangngalang gamit ng קדושׁ ay literal na “mga banal.” Hindi tahasang nilalagyan sa pangunahing teksto ng salitang “anghel” upang mapanatili ang lawak ng katawagan sa Hebreo.
- source_word: תִּפְנֶה
  choice: ka babaling
  rationale: Pinananatili ng “babaling” ang metapora ng פנה, na sa konteksto ay maaaring magpahiwatig ng paglapit o paghingi ng tulong.
theological_decisions:
- issue: Pagkakakilanlan ng “mga banal” (מִקְּדֹשִׁים)
  choice: “mga banal” sa pangunahing teksto, na may talababa tungkol sa malamang na mga nilalang sa langit
  alternative: “mga santo” o “mga banal na nilalang”
  rationale: Malamang na tumutukoy ang konteksto ng Job sa mga nilalang sa langit, ngunit hindi ito tahasang ipinangalan ng Hebreo bilang mga anghel. Pinananatili ng salin ang tunay na lawak ng termino at iniiwasang magpasok ng mga doktrinal na kaugnayan ng “mga santo.”
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ang dalawang retorikal na tanong at ang metaporang “babaling” ay pinanatili; ang gitling-mahabang gitling ay naghihiwalay sa hamon at sa unang tanong.
