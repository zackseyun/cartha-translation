  text: Look, this is what we have searched out; it is so. Hear it, and you, know it for yourself.
translation:
  language: tl
  text: Narito, ito ang masusi naming siniyasat; gayon nga ito. Pakinggan mo ito, at ikaw naman, unawain mo ito para sa sarili mo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: Narito
  rationale: Pinananatili ang pantawag-pansing diin ng Hebreong interjection sa isang marangal at likas na anyong Tagalog.
- source_word: חֲקַרְנוּהָ
  choice: masusi naming siniyasat
  rationale: Ipinahahayag ang diwa ng masusing pagsasaliksik o pagsusuri, kasama ang unang panauhang maramihan ng pandiwa at ang layon nito.
- source_word: כֶּן הִיא
  choice: totoo nga ito
  rationale: Likas na Tagalog para sa matibay na pagpapatunay na ang bagay ay gayon nga, nang hindi dinaragdagan ang pahayag.
- source_word: שְׁמָעֶנָּה
  choice: Pakinggan mo ito
  rationale: Pinananatili ang pautos na anyo at ang pambabaeng panghalip na tumutukoy sa naunang bagay o aral.
- source_word: וְאַתָּה דַע לָךְ
  choice: at ikaw mismo, alamin mo ito para sa iyong sarili
  rationale: Pinananatili ang tahasang diin sa 'ikaw' at ang panawagang personal na kilalanin o tiyakin ang sinabi.
theological_decisions:
- issue: Antas ng pagpapatunay sa sinabi ni Elifaz
  choice: Isinalin bilang tuwirang pag-aangking 'totoo nga ito' mula sa bibig ng nagsasalita.
  alternative: Gawing pahayag ng tagapagsalaysay o pangkalahatang doktrina ang pagiging totoo nito.
  rationale: Ang talata ay pagtatapos ng pananalita ni Elifaz; hindi dapat ipahiwatig ng salin na hiwalay na pinagtitibay ng tagapagsalaysay ang lahat ng kaniyang argumento.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang 'Narito' para sa matinding pantawag-pansin at ang 'ikaw mismo' upang mapanatili ang diing nasa hiwalay na panghalip na וְאַתָּה.
