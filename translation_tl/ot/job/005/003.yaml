  text: I have seen a fool taking root[a], and suddenly I cursed his dwelling.
translation:
  language: tl
  text: Ako ay nakakita ng isang hangal na nag-uugat, at bigla kong isinumpa ang kanyang tahanan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring, “at bigla kong ipinahayag na isinumpa ang kanyang tahanan,” o “at bigla kong kinilalang nakatakda sa kapahamakan ang kanyang tahanan.” Maaaring tumukoy ang pandiwang Hebreo sa tuwirang pagsumpa o sa isang mapanghatol na pahayag tungkol sa tahanan o kapalaran nito.
    reason: alternative_reading
lexical_decisions:
- source_word: אֲנִי
  choice: Ako mismo
  rationale: Pinananatili ang tahasang panghalip at ang diin nito; natural sa Filipino ang “Ako mismo” upang maipakita ang emphatic na paksa.
- source_word: רָאִיתִי
  choice: ay nakakita
  rationale: Ipinahahayag ng ganap na pandiwa ang nasaksihang karanasan ng nagsasalita. Ang “nakakita” ay likas sa Filipino at hindi labis na tinutukoy kung minsanan o may patuloy na bisa ang karanasan.
- source_word: אֱוִיל
  choice: isang hangal
  rationale: Pinananatili ang kategoryang moral at pangkarunungan ng salitang Hebreo, hindi lamang ang ideya ng mababang talino.
- source_word: מַשְׁרִישׁ
  choice: na nag-uugat
  rationale: Pinananatili ang metapora ng pagpapatubo ng mga ugat, na nagpapahiwatig ng pagiging matatag o matibay ang pagkakalagay.
- source_word: וָאֶקּוֹב
  choice: at bigla kong isinumpa
  rationale: Ang “isinumpa” ang pinakatuwirang katumbas ng leksikal na diwa ng pandiwa; ang “at” ay tumutugma sa payak na pang-ugnay ng Hebreo, at iniugnay ang “bigla” sa kilos ayon sa pagkakasunod ng teksto.
- source_word: נָוֵהוּ
  choice: ang kanyang tahanan
  rationale: Ang “tahanan” ay natural at marangal na salin ng tirahan o tahanang saklaw ng נָוֶה nang hindi labis na nililimitahan ang larawan.
- source_word: פִתְאֹם
  choice: bigla
  rationale: Tuwirang ipinapahayag ang biglaan o kagyat na pangyayari at pinananatili ang abruptong daloy ng Hebreong tula.
theological_decisions:
- issue: Diwa ng tugon ng nagsasalita sa וָאֶקּוֹב
  choice: Sinabi ni Elifaz na siya mismo ang sumumpa sa tahanan ng hangal matapos niya itong makitang nag-uugat.
  alternative: Maaaring ipinahahayag lamang ni Elifaz na kinilala niyang isinumpa o nakatakda sa kapahamakan ang tahanan.
  rationale: Mas tuwirang sinusuportahan ng pandiwa ang aktuwal na pagbigkas ng sumpa, ngunit maaari rin itong unawain bilang mapanghatol na pahayag o pagkilala sa nalalapit na kapahamakan. Pinananatili sa talababa ang tunay na kalabuan nang hindi nagpapasok ng ideya tungkol sa mahiwagang bisa ng sumpa.
translation_notes:
  register: Modernong Filipino na dignified at madaling maunawaan. Ginamit ang “nag-uugat” upang mapanatili ang matingkad na metapora, at ang “Ako mismo” upang maipakita ang diin ng tahasang panghalip sa Hebreo. Inilagay ang panandang [a] pagkatapos ng sugnay na “isinumpa ang kanyang tahanan” sapagkat dito tumutukoy ang alternatibong pagbasa.
