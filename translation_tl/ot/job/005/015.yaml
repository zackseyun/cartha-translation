  yaml_path: translation/ot/job/005/015.yaml
  text: But he saves the needy from the sword of their mouth[a], and from the hand of the strong.
translation:
  language: tl
  text: Ngunit inililigtas niya ang nangangailangan mula sa tabak ng kanilang bibig[a] at mula sa kamay ng makapangyarihan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O kaya, “iniligtas niya ang nangangailangan mula sa tabak, mula sa kanilang bibig, at mula sa kamay ng makapangyarihan.” Siksik ang pagkakasabi sa Hebreo; maaaring ihiwalay ang “mula sa kanilang bibig” sa halip na iugnay ito sa “tabak ng kanilang bibig.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּשַׁע
  choice: inililigtas niya
  rationale: Ang pandiwang mula sa ישׁע ay nangangahulugang magligtas o sumagip. Bagaman maaaring tumukoy sa nagdaang kilos ang anyo, ang pangkasalukuyang “inililigtas” ay angkop sa pangkalahatang pahayag na patula sa pananalita ni Elifaz. Ang Diyos ang ipinahihiwatig na simuno ayon sa konteksto.
- source_word: מֵחֶרֶב
  choice: mula sa tabak
  rationale: Pinananatili ang konkretong larawan ng חֶרֶב, “tabak,” at ang diwa ng pagkaligtas o pagkahiwalay na ipinahahayag ng מִן.
- source_word: מִפִּיהֶם
  choice: ng bibig nila
  rationale: Sa pangunahing pagbasa, inuugnay ito sa “tabak” upang mapanatili ang matinding talinghaga ng mapanirang pananalita bilang tabak. Likas sa modernong Filipino ang “bibig nila,” at pinananatili nito ang kolektibong isahan ng Hebreo.
- source_word: וּמִיַּד
  choice: at mula sa kamay ng
  rationale: Pinananatili ang literal na “kamay,” na maaari ring magpahiwatig ng kapangyarihan o kontrol. Kaakma ito sa konkretong larawang “tabak.”
- source_word: חָזָק
  choice: malakas
  rationale: Ang pang-uri ay ginamit bilang pangngalan para sa isang taong malakas o makapangyarihan. Pinananatili ng “malakas” ang tuwirang kaibahan nito sa taong nangangailangan nang hindi dinaragdagan ang kahulugan.
- source_word: אֶבְיוֹן
  choice: ang nangangailangan
  rationale: Saklaw ng אֶבְיוֹן ang taong dukha o kapos at mahina sa lipunan. Malinaw at malawak ang “nangangailangan” at hindi nito nililimitahan ang salita sa kawalan lamang ng salapi.
theological_decisions:
- issue: Ang talinghagang “tabak ng bibig nila”
  choice: Pinanatili bilang larawan ng mapanirang pananalita.
  alternative: Basahin ang “mula sa bibig nila” bilang hiwalay na parirala kasunod ng “mula sa tabak.”
  rationale: Magkakatabi sa Hebreo ang “tabak” at “bibig,” kaya maaaring mabuo ang matingkad na talinghaga ng pananalitang parang tabak. Gayunman, siksik at hindi ganap na tiyak ang ugnayang sintaktiko, kaya itinatala sa talababa ang ibang posibleng pagbasa sa halip na tahimik na lutasin ang kalabuan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino ang ginamit. Pinanatili ang patulang mga larawang “tabak,” “bibig,” at “kamay,” pati ang tunay na kalabuan ng siksik na pariralang Hebreo sa pamamagitan ng talababa.
