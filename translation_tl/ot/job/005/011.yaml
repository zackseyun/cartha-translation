  text: upang itaas ang mga aba, at ang mga nagdadalamhati[a] ay itinataas tungo sa kaligtasan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang mga pinadilim” o “ang mga nalulumbay”; ang participle sa Hebreo ay naglalarawan ng dalamhati sa pamamagitan ng larawan ng kadiliman.
