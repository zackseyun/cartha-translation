lexical_decisions:
- source_word: לָשׂוּם
  choice: upang itaas
  rationale: Ang infinitive construct ng שׂוּם ay nagpapahayag ng layunin o bunga. Likas sa Filipino ang “upang itaas” at pinananatili nito ang larawan ng paglilipat mula sa mababang kalagayan tungo sa mataas.
- source_word: שְׁפָלִים
  choice: ang mga aba
  rationale: Tumutukoy ito sa mga mababa ang kalagayan o ibinaba. Saklaw ng “mga aba” ang panlipunan at pansariling paghihirap nang hindi ito nililimitahan sa moral na pagpapakumbaba.
- source_word: לְמָרוֹם
  choice: itaas
  rationale: Ang מָרוֹם ay taas o mataas na dako. Isinasama ng pariralang “itaas” ang malinaw na pagsalungat sa mababang kalagayan ng mga aba sa natural na Filipino.
- source_word: וְקֹדְרִים
  choice: ang mga nagdadalamhati
  rationale: Ang participle mula sa קדר ay maaaring maglarawan sa pagiging madilim, malungkot, o nagdadalamhati. Ang “mga nagdadalamhati” ang pinakamalinaw sa konteksto, habang pinananatili sa talababa ang talinghaga ng pagdidilim.
- source_word: שָׂגְבוּ
  choice: ay maiangat
  rationale: Ang pandiwa ay nagsasaad ng pagiging mataas, ligtas na nasa mataas na dako, o dinakila. Ang “maiangat” ay nagpapanatili sa resultative na diwa at sa paralelismo ng unang linya.
- source_word: יֶשַׁע
  choice: tungo sa kaligtasan
  rationale: Ang יֶשַׁע ay may malawak na saklaw na kinabibilangan ng pagliligtas, kaligtasan, at katiwasayan. Pinananatili ng “kaligtasan” ang lawak ng salita nang hindi ipinipilit ang isang mas huling sistematikong kahulugan.
theological_decisions:
- issue: Pagpapakahulugan sa יֶשַׁע sa konteksto ng karunungang panitikan
  choice: kaligtasan
  alternative: pagkaligtas o katiwasayan
  rationale: Pinananatili ng “kaligtasan” ang malawak na leksikal at teolohikal na diwa ng Hebreo, samantalang ipinakikita ng konteksto na kabilang dito ang kongkretong pagliligtas at pagiging ligtas.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang patulang paralelismo at ang kilos mula sa kababaan patungo sa kataasan, habang inilagay sa mga talababa ang tunay na leksikal na mga alternatibo.
