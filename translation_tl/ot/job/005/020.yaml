  yaml_path: translation/ot/job/005/020.yaml
  text: In famine he will redeem you from death[b][a], and in war from the power of the sword.
translation:
  language: tl
  text: Sa panahon ng taggutom, tutubusin ka niya mula sa kamatayan[a], at sa digmaan, mula sa kapangyarihan ng tabak[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “palalayain ka niya” o “ililigtas ka niya.” Ang pandiwang Hebreo ay tumutukoy sa pagtubos, pagpapalaya, o pagsagip.
    reason: lexical_alternative
  - marker: b
    text: Literal na “mula sa mga kamay ng tabak,” isang idyomang tumutukoy sa kapangyarihan ng tabak.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּרָעָב
  choice: Sa panahon ng taggutom
  rationale: Ang רָעָב ay maaaring tumukoy sa gutom o taggutom; dito, bilang malawakang kapahamakang kaagapay ng digmaan, mas angkop ang “taggutom.” Ipinahihiwatig ng בְּ ang kalagayan o panahon.
- source_word: פָּדְךָ
  choice: tutubusin ka niya
  rationale: Ang פדה ay nangangahulugang tubusin, palayain, o iligtas. Pinananatili ng “tutubusin” ang mas matimbang na diwa ng pagpapalaya nang hindi ipinapalagay na espirituwal na kaligtasan ang tahasang paksa.
- source_word: מִמָּוֶת
  choice: mula sa kamatayan
  rationale: Tuwirang ipinahahayag ng מִן ang pagliligtas palayo sa kamatayan; pinanatili ang pangngalang “kamatayan.”
- source_word: וּבְמִלְחָמָה
  choice: at sa digmaan
  rationale: Ang מִלְחָמָה ay digmaan o labanan. Ang “digmaan” ay natural na katambal ng malawakang sakunang “taggutom.”
- source_word: מִידֵי
  choice: mula sa kamay ng
  rationale: Literal na “mula sa mga kamay ng.” Pinanatili ang Hebreong personipikasyon at idyoma dahil nauunawaan sa Filipino ang “kamay” bilang kapangyarihan o saklaw ng nakamamatay na tabak.
- source_word: חָרֶב
  choice: tabak
  rationale: Ang חָרֶב ay karaniwang salitang Hebreo para sa tabak at dito'y kumakatawan din sa marahas na kamatayan sa digmaan.
theological_decisions:
- issue: Kahulugan ng פדה sa konteksto ng karunungang panitikan
  choice: tutubusin
  alternative: ililigtas / palalayain
  rationale: Pinananatili ng “tutubusin” ang mas malakas na diwa ng pagkalag o pagpapalaya sa Hebreo, ngunit hindi nito awtomatikong ginagawang pahayag tungkol sa walang-hanggang kaligtasan ang pangakong temporal sa talata.
translation_notes:
  register: Makabago at marangal na Filipino. Ginamit ang “taggutom,” “digmaan,” at “tabak” bilang malinaw at dignified na mga salitang biblikal. Pinanatili ang larawang “kamay ng tabak” upang mailapit ang anyo at personipikasyon ng Hebreo, na ipinaliliwanag sa talababa.
