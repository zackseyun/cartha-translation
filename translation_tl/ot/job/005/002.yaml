  yaml_path: translation/ot/job/005/002.yaml
  text: For vexation kills the fool[a], and jealousy puts the simple to death.
translation:
  language: tl
  text: 'Sapagkat pinapatay ng galit ang hangal,

    at pinapatay ng paninibugho[a] ang walang muwang.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “inggit.” Maaaring tumukoy ang salitang Hebreo sa inggit o paninibugho; dito, inilalarawan nito ang isang mapanirang damdamin.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikilala nito ang paliwanag ni Elifaz at likas na nag-uugnay sa pahayag sa naunang talata.
- source_word: לֶאֱוִיל
  choice: ang hangal
  rationale: Tumutukoy ang אֱוִיל sa taong hangal sa asal at pagpapasiya, hindi lamang sa taong kulang sa talino. Ang anyong may “ang” ay angkop sa pangkalahatang pahayag ng karunungan.
- source_word: יַהֲרָג
  choice: pinapatay
  rationale: Ang di-ganap na anyo ng הרג ay nagsasaad dito ng pangkalahatang katotohanan; malinaw at tuwiran ang “pinapatay.”
- source_word: כָּעַשׂ
  choice: galit
  rationale: Maaaring tumukoy ang כַּעַשׂ sa pagkayamot, pagkainis, o galit. Sa konteksto, ang “galit” ang pinakanatural na tawag sa mapanirang damdaming inilalarawan.
- source_word: וּפֹתֶה
  choice: ang walang muwang
  rationale: Ang פֹּתֶה ay isang taong walang karanasan at madaling mahikayat o malinlang. Pinananatili ng “walang muwang” ang diwang ito nang hindi nagpapahiwatig ng kapansanan sa pag-iisip.
- source_word: תָּמִית
  choice: pinapatay
  rationale: Causative ang anyo ng מות. Bagaman maaari itong isaling “nagiging sanhi ng kamatayan,” mas natural sa Filipino ang tuwirang “pinapatay,” na pinananatili rin ang paralelismo.
- source_word: קִנְאָה
  choice: paninibugho
  rationale: Sa paralelismo sa כַּעַשׂ, tumutukoy ito sa isang mapanirang damdamin. Pinananatili ng “paninibugho” ang pangunahing diwa, habang inilalagay sa talababa ang posible ring “inggit.”
