  text: For he causes pain[a], but he binds up; he shatters, but his hands heal.
translation:
  language: tl
  text: Sapagkat siya ang nagdudulot ng sakit ngunit nagbabalot din ng sugat; siya ang dumudurog, ngunit nagpapagaling ang kanyang kamay.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo, isahan ang “kanyang kamay,” ngunit maramihan ang anyo ng pandiwang “nagpapagaling.” Maaari ring isalin: “ngunit ang kanyang mga kamay ay nagpapagaling.”'
    reason: textual_grammar
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikita ang paliwanag o dahilan na kaugnay ng naunang pahayag, nang hindi labis na tinutukoy ang ugnayan.
- source_word: הוּא
  choice: siya ang
  rationale: Pinananatili ang diin ng nagsasariling panghalip sa Hebreo sa natural na paraang Filipino.
- source_word: יַכְאִיב
  choice: nagpapasakit
  rationale: Tuwirang inilalarawan ng causative na anyo ng כאב ang pagdudulot ng sakit, nang hindi dinaragdagan ng mas tiyak na larawang 'sumusugat.'
- source_word: וְיֶחְבָּשׁ
  choice: ngunit siya rin ang nagbabalot ng sugat
  rationale: Ang חבש ay tumutukoy sa pagbabalot o pagtatali ng sugat. Ginawang panalungat ang pang-ugnay dahil malinaw ang pagtatambis ng tula; ang 'rin' ay natural na nagpapatingkad sa iisang gumagawa ng kapwa kilos.
- source_word: יִמְחַץ
  choice: siya ang dumudurog
  rationale: Pinananatili ang matindi at marahas na puwersa ng מחץ at ang pagtutumbas nito sa kasunod na pagpapagaling.
- source_word: וְיָדוֹ
  choice: ngunit ang kanyang kamay
  rationale: Pinananatili ang tahasang isahang pangngalan ng tekstong Hebreo sa halip na tahimik itong gawing maramihan.
- source_word: תִּרְפֶּינָה
  choice: ay nagpapagaling
  rationale: Ang רפא ay tuwirang nangangahulugang magpagaling. Sa Filipino, hindi minamarkahan ng pandiwa ang bilang kaya naipananatili ang isahang 'kamay' habang hindi kinakailangang pakinisin ang di-pagkakatugma ng bilang sa Hebreo.
theological_decisions:
- issue: Ang Diyos ang gumagawa kapwa ng pagpapasakit at pagpapagaling
  choice: Tuwirang iniuugnay sa Diyos ang pagdudulot ng sakit, pagdurog, pagbabalot ng sugat, at pagpapagaling.
  alternative: Palambutin ang unang kilos bilang pagpapahintulot lamang sa sakit.
  rationale: Diyos ang tahasang simuno ng lahat ng kilos sa Hebreo. Pinananatili ng salin ang teolohikal na tensiyon sa halip na lutasin o pahinain ito.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang 'nagbabalot ng sugat' bilang likas na pagpapahayag ng paggamot, at pinanatili ang matinding pagtutumbas ng 'dumudurog' at 'nagpapagaling.'
