  text: You will come to the grave in full vigor[b][a], like a sheaf gathered up in its season.
translation:
  language: tl
  text: Darating ka sa libingan na taglay ang ganap na sigla[a], gaya ng bunton ng inaning butil na iniaahon sa takdang panahon nito.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa hinog na katandaan.” Bihira ang salitang Hebreo at maaaring tumukoy sa hustong gulang o ganap na yugto ng buhay.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “gaya ng salansan ng ani na iniaahon sa panahon nito.” Ang larawan ay tungkol sa inaning butil na tinitipon o iniaahon kapag handa na.
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּבוֹא אֱלֵי קָבֶר
  choice: Darating ka sa libingan
  rationale: Pinananatili ng “darating” ang tuwirang diwa ng Qal imperfect ng בוא at ang patutunguhang ipinahahayag ng אֱלֵי; ang “libingan” ang karaniwang kahulugan ng קבר.
- source_word: בְכֶלַח
  choice: na taglay ang ganap na sigla
  rationale: Bihira at pinagtatalunan ang כֶּלַח. Ipinahihiwatig nito ang ganap na lakas o hustong yugto ng buhay, ngunit maaari rin itong tumukoy sa hinog na katandaan. Pinananatili ng salin ang mas malawak na ideya nang hindi itinatakda lamang sa dami ng edad.
- source_word: כַּעֲלוֹת גָּדִישׁ
  choice: gaya ng bunton ng inaning butil na dinadala sa imbakan
  rationale: Ang גָּדִישׁ ay bunton o salansan ng nagapas na butil, hindi tiyak na isang bigkis lamang. Sa larawang pansakahan, ang עלה ay nauunawaang pagdadala o pag-aahon sa naaning butil; idinagdag ang “sa imbakan” upang maging malinaw at natural sa Filipino ang ipinahihiwatig na kilos.
- source_word: בְּעִתּוֹ
  choice: sa kapanahunan nito
  rationale: Ipinahahayag nito ang angkop o takdang panahon at pinananatili ang larawang kaugnay ng panahon ng pag-aani.
theological_decisions:
- issue: Kung ang כֶּלַח ay nangangahulugang katandaan o ganap na sigla
  choice: taglay ang ganap na sigla
  alternative: sa hinog na katandaan
  rationale: Hindi tiyak ang bihirang salitang Hebreo. Iniiwasan ng pangunahing salin na gawing tiyak ang napakahabang buhay, samantalang kinikilala sa talababa ang tradisyonal at posibleng pagbasa tungkol sa katandaan.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “bunton ng inaning butil” sa halip na “bigkis” upang mas tumpak na katawanin ang גָּדִישׁ, habang pinanatili ang malinaw na larawang pansakahan at ang pagtutulad sa pagdating ng kamatayan sa angkop na panahon.
