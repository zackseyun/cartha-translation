revisions:
- from: Sa anim na kagipitan ay ililigtas ka niya; maging sa pito[a], hindi ka sasalingin ng masama[b].
  to: Sa anim na kagipitan ay ililigtas ka niya; maging sa pito[a], walang masama ang sasapit sa iyo[b].
  rationale: Pinalitan ang hindi gaanong idiomatikong “hindi ka sasalingin ng masama” ng “walang masama ang sasapit sa iyo.” Iningatan ng rebisyong ito ang malawak at bahagyang matalinghagang pagpapahayag ng Hebreo, ang paksa ng ikalawang linya (רָע), at ang hindi tahasang pagbibigay-kahulugan rito bilang alinman lamang sa kasamaan o kapahamakan. Pinanatili ang mga bilang, ang di-binanggit ngunit kontekstuwal na simuno sa “niya,” at ang mga angkla ng talababa.
