  yaml_path: translation/ot/job/005/019.yaml
  text: In six troubles he will deliver you[a]; even in seven[b], no evil will touch you.
translation:
  language: tl
  text: Sa anim na kagipitan ay ililigtas ka niya; maging sa pito[a], walang masama ang sasapit sa iyo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “sa anim … maging sa pito” ay isang Hebreong paraang patula na nagpapahayag ng paulit-ulit o ganap na pagliligtas; hindi ito nangangahulugang hanggang pitong kagipitan lamang.
    reason: cultural_note
  - marker: b
    text: 'Maaari ring isalin: “walang pinsalang sasapit sa iyo” o “walang kapahamakang aabot sa iyo.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּ/שֵׁשׁ צָרוֹת
  choice: Sa anim na kagipitan
  rationale: Ang בְּ ay nagpapakilala ng kalagayan o bilang, kaya natural ang “sa.” Ang צָרוֹת ay malawak na tumutukoy sa mga kagipitan, paghihirap, o kapighatian; pinananatili ng “kagipitan” ang malawak na diwa at ang marangal na himig ng tula.
- source_word: יַצִּילֶךָּ
  choice: ililigtas ka niya
  rationale: Ang Hiphil ng נצל ay nangangahulugang magligtas o sumagip mula sa panganib. Ang “ililigtas” ay malinaw at likas sa modernong Tagalog, at hindi nito nililimitahan ang pagliligtas sa pisikal na panganib lamang.
- source_word: וּ/בְ/שֶׁבַע
  choice: maging sa pito
  rationale: Pinananatili nito ang anyong-bilang ng Hebreong paralelismong “anim… pito,” habang ipinahihiwatig ng “maging” ang papataas at nagpapatibay na diin ng ikalawang linya.
- source_word: לֹא יִגַּע בְּךָ
  choice: hindi ka sasalingin
  rationale: Ang נגע ay maaaring mangahulugang humipo, umabot, o sumapit. Ang “sasalingin” ay nagpapanatili sa larawang “humipo” at angkop sa dignidad ng tulang karunungan.
- source_word: רָע
  choice: ng masama
  rationale: Ang רָע ay maaaring tumukoy sa kasamaan, pinsala, o kapahamakan. Ang substantibong “masama” ay nagpapanatili sa lawak at tunay na kalabuan ng Hebreo sa halip na itakda agad ito bilang moral na kasamaan o pisikal na sakuna lamang.
theological_decisions:
- issue: Ang tinutukoy ng di-binanggit na simuno ng “ililigtas”
  choice: Pinanatili ang panghalip na “niya” sa halip na idagdag ang “Diyos.”
  alternative: “ililigtas ka ng Diyos”
  rationale: Malinaw sa konteksto na Diyos ang tinutukoy, ngunit walang tahasang pangngalan sa talata; iniiwasan ng panghalip ang pagdaragdag ng pangalang wala sa mismong teksto. Bagaman walang kasariang gramatikal ang “niya,” ito ang likas na katumbas sa Tagalog ng panghalip na hinihingi ng konteksto.
- issue: Kahulugan ng pormulang bilang na “anim… pito”
  choice: Pinanatili ang mga bilang at ginamit ang “maging” upang maipakita ang kasukdulan ng paralelismo.
  alternative: Ituring itong eksaktong limitasyon na pitong kagipitan lamang, o iparaprasang “sa lahat ng kagipitan.”
  rationale: Ang pormula ay karaniwang nagpapahayag ng paulit-ulit o ganap na saklaw, ngunit ang pagpapanatili sa mga bilang ay gumagalang sa anyong patula at hindi lubusang pinapawi ang posibleng literal na pakikinig dito.
- issue: Saklaw ng רָע
  choice: “masama,” na maaaring saklawin ang kasamaan, pinsala, at kapahamakan
  alternative: “kapahamakan” o “pinsala” lamang
  rationale: Sa konteksto, malamang na masamang sinasapit ang pangunahing diwa, ngunit mas malawak ang salitang Hebreo. Pinananatili ng salin ang teolohikal at leksikal na tensiyon sa halip na paliitin ito.
translation_notes:
  register: Modernong Filipino Tagalog na may marangal at bahagyang patulang himig. Ginamit ang “kagipitan” at “sasalingin” upang mapanatili ang lawak at larawan ng Hebreo nang hindi nagiging lipas o labis na teknikal. Ang bantas na tuldok-kuwit ay nagpapakita ng magkatapat at papataas na paralelismo ng dalawang hati.
