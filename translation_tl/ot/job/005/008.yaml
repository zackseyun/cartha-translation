base_translation:
  language: en
  yaml_path: translation/ot/job/005/008.yaml
  text: But as for me[a], I would seek God, and to God I would present my case.
translation:
  language: tl
  text: 'Ngunit ako, sa Diyos ako dudulog,

    at sa Diyos ko ihaharap ang aking usapin.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang aking bagay.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אוּלָם אֲנִי
  choice: Ngunit ako
  rationale: Pinananatili nito ang pagkontra ng אוּלָם at ang diin ng tahasang panghalip na אֲנִי nang hindi nagdaragdag ng kondisyong “kung ako ang nasa kalagayan mo,” na hindi hayagang nasa Hebreo.
- source_word: אֶדְרֹשׁ אֶל־אֵל
  choice: sa Diyos ako dudulog
  rationale: Sa kontekstong ito, ang דרשׁ na may אֶל ay tumutukoy sa paglapit sa Diyos upang humingi ng tulong o magsangguni. Likas sa modernong Tagalog ang “dudulog,” at naipahihiwatig nito ang panawagan nang hindi nililimitahan ang diwa sa simpleng paghahanap.
- source_word: אֵל / אֱלֹהִים
  choice: Diyos / Diyos
  rationale: Magkasingkahulugan ang dalawang katawagan sa makatang paralelismo ng talata. Ang parehong salin na “Diyos” ay hindi lumilikha ng pagkakaiba ng tinutukoy na wala naman sa teksto.
- source_word: אָשִׂים
  choice: ihaharap
  rationale: Bagaman literal na “ilalagay,” ang pandiwa kasama ng דִּבְרָתִי ay tumutukoy sa paglalahad o paghaharap ng isang bagay sa Diyos. Napananatili ng “ihaharap” ang pahiwatig ng pagsusumamo o pagdadala ng kaso.
- source_word: דִּבְרָתִי
  choice: aking usapin
  rationale: Maaaring mangahulugan ang salita ng bagay, usapin, dahilan, o kaso. Malinaw at hindi labis na legal ang “usapin,” at hindi nito ipinapalagay na reklamo ang inilalahad.
theological_decisions:
- issue: Pagpapakahulugan sa magkaparis na אֵל at אֱלֹהִים
  choice: Parehong isinalin na “Diyos”
  alternative: “Makapangyarihang Diyos” sa una at “Diyos” sa ikalawa
  rationale: Makatang paralelismo ang gamit, hindi isang malinaw na teolohikal na pagtatangi sa dalawang banal na katawagan.
- issue: Modalidad ng mga pandiwang אֶדְרֹשׁ at אָשִׂים
  choice: 'Isinalin bilang pasyang nakatuon sa gagawin: “dudulog” at “ihaharap”'
  alternative: Kondisyonal na “dudulog sana” at “ihaharap sana”
  rationale: Maaaring magpahiwatig ng payo o nais ang mga anyong yiqtol sa konteksto, ngunit walang tahasang kondisyong “kung ako ang nasa kalagayan mo” sa talata. Pinananatili ng hinaharap na anyo sa Tagalog ang payong may personal na diin nang hindi nagdaragdag ng kondisyon.
translation_notes:
  register: Modernong Filipino na marangal ngunit karaniwan. Ginamit ang “dudulog” para sa paglapit sa Diyos sa panalangin o pagsusumamo, at “usapin” upang mapanatili ang lawak ng דִּבְרָתִי. Inayos ang mga sugnay bilang dalawang linyang patula upang makita ang paralelismo.
