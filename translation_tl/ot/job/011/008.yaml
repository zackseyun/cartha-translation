  yaml_path: translation/ot/job/011/008.yaml
  text: It is higher than the heavens—what can you do? Deeper than Sheol—what can you know?[a]
translation:
  language: tl
  text: Mas mataas pa sa langit—ano ang kaya mong gawin? Mas malalim pa sa Sheol—ano ang kaya mong malaman?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “mas malalim pa sa libingan” o “mas malalim pa sa daigdig ng mga patay.” Sa Hebreo: Sheol.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גָּבְהֵי שָׁמַיִם
  choice: mas mataas pa sa langit
  rationale: Ang parirala ay tumutukoy sa sukdulang taas ng langit. Ginamit ang likas na paghahambing sa Filipino upang maipahayag ang diwa at mapanatili ang makatang pagtutulad.
- source_word: מַה
  choice: ano
  rationale: Tuwirang katumbas ito ng panghalip na pananong sa dalawang retorikal na tanong.
- source_word: תִּפְעָל
  choice: ano ang kaya mong gawin
  rationale: Ang Qal imperfect ng פעל ay may diwang kakayahan sa kontekstong ito; malinaw at natural itong naihahayag ng “kaya mong gawin.”
- source_word: עֲמֻקָּה
  choice: mas malalim pa
  rationale: Pinananatili ng pahambing na anyo ang balanseng paralelismo sa “mas mataas pa” sa unang taludtod.
- source_word: מִשְּׁאוֹל
  choice: sa Sheol
  rationale: Sa pariralang “mas malalim pa sa Sheol,” likas na ipinahihiwatig ng “sa” ang paghahambing sa Filipino. Pinanatili ang Sheol upang hindi ito paliitin sa pisikal na libingan lamang.
- source_word: תֵּדָע
  choice: ano ang kaya mong malaman
  rationale: Ang Qal imperfect ng ידע ay isang retorikal na tanong tungkol sa hangganan ng kakayahang makaalam ng tao, kaya ginamit ang “kaya mong malaman.”
theological_decisions:
- issue: Paglalarawan sa שְׁאוֹל
  choice: Sheol
  alternative: libingan; daigdig ng mga patay
  rationale: Sa talata, ang Sheol ang makatang larawan ng sukdulang kalaliman. Pinananatili ng transliterasyon ang mas malawak na konsepto ng Hebreo at iniiwasang itumbas lamang ito sa pisikal na libingan; inilalahad sa talababa ang mga posibleng katumbas.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang maikli at balanseng anyong patula ng dalawang taludtod, pati ang retorikal na diin sa limitasyon ng kakayahan ng tao.
