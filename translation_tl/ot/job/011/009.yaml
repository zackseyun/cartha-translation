  text: אֲרֻכָּ֣ה מֵ/אֶ֣רֶץ מִדָּ֑/הּ וּ֝/רְחָבָ֗ה מִנִּי יָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/011/009.yaml
  text: Its measure is longer than the earth and broader than the sea[a].
translation:
  language: tl
  text: Ang sukat nito ay mas mahaba kaysa sa lupa at mas malawak kaysa sa dagat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Ang saklaw nito ay mas mahaba kaysa sa lupa at mas malawak kaysa sa dagat.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲרֻכָּה
  choice: mas mahaba
  rationale: Ang pang-uri ay nasa paghahambing dahil sa kasunod na מִן; ang “mas mahaba kaysa” ang likas at tuwirang katumbas sa modernong Tagalog.
- source_word: מֵאֶרֶץ
  choice: kaysa sa lupa
  rationale: Ang מִן ay pananda ng paghahambing dito, hindi ng paghihiwalay. Ang “lupa” ay nagpapanatili sa malawak at kosmikong larawan na katambal ng “dagat.”
- source_word: מִדָּהּ
  choice: ang sukat nito
  rationale: Pinananatili ng “sukat” ang kongkretong diwa ng מִדָּה bilang sukat o dimensiyon, habang ang “nito” ay nagpapanatili sa pambabaeng isahang hulapi nang hindi tahasang nilulutas sa talatang ito ang tinutukoy nito.
- source_word: וּרְחָבָה
  choice: at mas malawak
  rationale: Kaagapay ito ng “mas mahaba” at nasa paghahambing din; mas natural ang “mas malawak” kaysa “mas malapad” para sa napakalaking saklaw na inihahambing sa dagat.
- source_word: מִנִּי יָם
  choice: kaysa sa dagat
  rationale: Ang מִנִּי ay patulang anyo ng comparative מִן, at ang יָם ay tuwirang “dagat”; pinananatili nito ang paralelismo sa “lupa.”
theological_decisions:
- issue: Ang tinutukoy ng hulaping 3fs sa מִדָּהּ
  choice: nito
  alternative: ng karunungan nito / ng karunungan ng Diyos
  rationale: Bagaman ipinahihiwatig ng konteksto ang di-maarok na karunungan o mga hiwaga ng Diyos, hindi ito tahasang inuulit sa talata. Ang “nito” ay nagpapanatili sa pagkakaugnay sa naunang talata at umiiwas sa pagdaragdag ng isang interpretasyong hindi lantad sa mismong pangungusap.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang balanseng patulang paghahambing ng “lupa” at “dagat,” gayundin ang bahagyang kalabuan ng panghalip na tumutukoy pabalik sa naunang konteksto.
