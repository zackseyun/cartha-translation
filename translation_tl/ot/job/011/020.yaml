base_translation:
  language: en
  yaml_path: translation/ot/job/011/020.yaml
  text: But the eyes of the wicked will fail[a], and refuge will perish from them, and their hope will be the breathing out of life.
translation:
  language: tl
  text: Ngunit manghihina ang mga mata ng masasama; mawawalan sila ng takas, at ang pag-asa nila ay ang pagbuga ng huling hininga.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang pag-asa nila ay ang pagbuga ng buhay.” Mahirap tiyakin ang kahulugan ng pariralang Hebreo; malamang na inilalarawan nito ang nalalagot na hininga o ang huling hininga ng isang namamatay.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵינֵי רְשָׁעִים תִּכְלֶינָה
  choice: manghihina ang mga mata ng masasama
  rationale: Pinananatili ang larawang Hebreo ng mga matang nauubos o nanghihina dahil sa bigong paghihintay. Likas sa Filipino ang “manghihina ang mga mata” at hindi nito labis na ipinapaliwanag ang idyoma.
- source_word: מָנוֹס אָבַד מִנְהֶם
  choice: mawawala sa kanila ang matatakasan
  rationale: Ang מָנוֹס ay maaaring tumukoy sa takas, paraan ng pagtakas, o kanlungan. Ang “matatakasan” ay natural at pinananatili ang diwa na wala na silang mapupuntahan o paraan upang makatakas; ang anyong panghinaharap ay naaayon sa kontekstong patula.
- source_word: תִקְוָתָם
  choice: ang pag-asa nila
  rationale: Karaniwan at tuwirang katumbas ng תִקְוָה, habang nananatiling bukas ang mapait na kabalintunaan ng sumusunod na parirala.
- source_word: מַפַּח נָפֶשׁ
  choice: ang pagbuga ng huling hininga
  rationale: Mahirap at matalinghaga ang pariralang Hebreo, na kaugnay ng pagbuga ng hininga o buhay. Ang salin ay malinaw sa makabagong Filipino, pinananatili ang larawan ng kamatayan, at hindi ito pinapantay lamang sa abstraktong “kawalan ng pag-asa.”
theological_decisions:
- issue: Kung ang huling parirala ay tumutukoy sa kamatayan o sa pangkalahatang kawalan ng pag-asa
  choice: Pinanatili ang kongkretong larawan ng pagbuga ng huling hininga.
  alternative: “Mawawalan sila ng pag-asa” o “kabiguan lamang ang kanilang pag-asa.”
  rationale: Mas malapit ang kongkretong larawan sa מַפַּח נָפֶשׁ at iniiwasang alisin ang tunay na leksikal at patulang tensiyon ng Hebreo.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang malinaw na balangkas na patula at pinanatili ang mga larawang “mga mata,” pagkawala ng matatakasan, at pagbuga ng hininga. Ang semicolon ay naghihiwalay sa magkakaugnay na hatol nang hindi ginagawang mabigat ang pangungusap.
