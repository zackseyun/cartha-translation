  yaml_path: translation/ot/job/011/010.yaml
  text: If he passes by and shuts someone in[a], and calls an assembly[b], then who can turn him back?
translation:
  language: tl
  text: Kung siya ay dadaan at magkukulong ng tao at magtitipon ng kapulungan[a], sino ang makapagpapabalik sa kanya?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “magtitipon ng kapulungan” ay maaari ring isaling “magtipon” o “magpulong,” at maaaring may pahiwatig na panghukuman.
    reason: lexical_alternative
  - marker: b
    text: O “sino ang makapagpapawalang-bisa nito?” Maaaring unawain ang Hebreo bilang pagpapabalik sa kumikilos (“sa kanya”) o, sa mas pangkalahatan, bilang pagpapawalang-bisa sa ginawa.
    reason: alternative_reading
lexical_decisions:
- source_word: אִם
  choice: Kung
  rationale: Pinananatili ang kondisyonal o hipotetikal na puwersa ng Hebreong pantukoy.
- source_word: יַחֲלֹף
  choice: siya ay dumaan
  rationale: Likas na salin ng pagkilos na ‘dumaan’ nang hindi ito binibigyan ng di-tiyak na mapanirang kahulugan.
- source_word: וְיַסְגִּיר
  choice: at may ikulong
  rationale: Ipinahahayag ang causative na diwang ‘magkulong’ habang hindi tinutukoy kung sino ang layon, gaya sa Hebreo.
- source_word: וְיַקְהִיל
  choice: at magtipon ng kapulungan
  rationale: Sinasalamin ang causative na ‘tipunin/pulungin’ at pinananatili ang posibleng pampubliko o panghukuman na pahiwatig.
- source_word: וּמִי
  choice: sino ang
  rationale: Natural na pambungad sa retorikal na tanong sa Filipino; malinaw na naipahihiwatig ng ayos ang bunga ng naunang kondisyon.
- source_word: יְשִׁיבֶנּוּ
  choice: makapagpapabalik sa kanya
  rationale: Pinananatili ang Hiphil na ‘magpangyaring bumalik’ at ang panlalaking isahang hulapi bilang personal na ‘sa kanya,’ nang hindi ganap na isinasara ang alternatibong pagtukoy sa ginawa.
theological_decisions:
- issue: Tinutukoy ng mga pandiwang panlalaking isahan at ng hulapi
  choice: Ang paksa ay ang Diyos, at personal na isinalin ang hulapi bilang ‘sa kanya.’
  alternative: 'Maaaring tumukoy ang hulapi sa ginawa: ‘sino ang makapagpapawalang-bisa nito?’'
  rationale: Sa mas malawak na konteksto, ang tinutukoy ay ang malayang pagkilos ng Diyos. Gayunman, tunay na posible ang mas abstraktong pagbasa, kaya inilagay ito sa talababa sa halip na tahimik na lutasin.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang ‘kapulungan’ upang mapanatili ang pampubliko at posibleng panghukumang kulay ng קהל; iniwasan ang sobrang teknikal o denominasyonal na pananalita.
