  - severity: low
    issue: Hindi magkakatugma ang aspekto ng mga pandiwa sa kondisyunal na sugnay.
    rationale: Ang “siya ay dumaan” ay naganap na aspekto, samantalang “magtipon” ay di-naganap. Ang “dadaan ... magkukulong ... magtitipon” ay mas maayos para sa retorikal na kondisyunal.
