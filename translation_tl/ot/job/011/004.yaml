  text: וַ֭/תֹּאמֶר זַ֣ךְ לִקְחִ֑/י וּ֝/בַ֗ר הָיִ֥יתִי בְ/עֵינֶֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/011/004.yaml
  text: For you say[a], ‘My teaching is pure, and I am clean in your eyes.’
translation:
  language: tl
  text: 'Sapagkat sinasabi mo,

    “Dalisay ang aking turo,[a]

    at malinis ako sa iyong paningin.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “aral ko,” “tagubilin ko,” o “pahayag ko.” Ang pangngalang Hebreo ay maaaring tumukoy sa tinanggap o inilahad ng isang tao bilang turo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: sinasabi mo
  rationale: Bagaman anyong wayyiqtol ang pandiwa at maaaring isaling nasa nakaraan, ang kasalukuyang panahunan ay likas sa Filipino para sa paratang ni Zofar tungkol sa ipinahahayag ni Job.
- source_word: זַךְ
  choice: dalisay
  rationale: Ipinahahayag nito ang pagiging puro o walang dungis ng sinasabing turo ni Job at naiiwasan ang pag-uulit sa kasunod na בַר.
- source_word: לִקְחִי
  choice: aking turo
  rationale: Ang לֶקַח ay maaaring tumukoy sa aral, turo, o diskursong tinanggap o inilahad; ang “turo” ay natural at malinaw sa konteksto.
- source_word: וּבַר
  choice: malinis
  rationale: Pinananatili nito ang kahulugang malinis o dalisay habang ipinakikita ang bahagyang pagkakaiba nito sa זַךְ na isinaling “dalisay.”
- source_word: הָיִיתִי
  choice: ako
  rationale: Bagaman perpektong anyo ng היה, ang ipinaparatang na pahayag ay tumutukoy sa kasalukuyang kalagayan; sa natural na Filipino, sapat ang panaguring “malinis ako.”
- source_word: בְעֵינֶיךָ
  choice: sa iyong paningin
  rationale: Natural na idyomang Filipino ito na nagpapanatili sa larawang Hebreo ng pagtatasa ayon sa paningin ng kausap.
theological_decisions:
- issue: Tinutukoy ng ikalawang panauhang isahan sa “sa iyong paningin”
  choice: Ang Diyos ang kinakausap sa siniping pahayag
  alternative: Ang kausap sa pangkalahatan ang tinutukoy
  rationale: Inilalarawan ni Zofar si Job na nag-aangking malinis sa harap ng Diyos. Pinananatili ng salin ang panghalip nang hindi nagdaragdag ng paliwanag sa mismong talata.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “dalisay” at “malinis” upang mapanatili ang magkaugnay ngunit hindi ganap na magkaparehong mga salitang Hebreo. Inilagay ang panandang [a] kaagad pagkatapos ng “turo,” na siyang salitang nililinaw ng talababa.
