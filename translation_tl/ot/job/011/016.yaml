translation:
  language: tl
  text: Sapagkat malilimutan mo ang iyong paghihirap; maaalaala mo ito gaya ng tubig na lumipas na.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “maaalaala mo ito gaya lamang ng tubig na lumipas na.” Inihahambing ng Hebreo ang dating paghihirap sa tubig na nakaraan na at wala na.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikilala nito ang dahilan o bunga ng naunang pangako; natural na ipinahahayag ng “Sapagkat” ang ugnayang iyon.
- source_word: אַתָּה
  choice: mo
  rationale: Ang ikalawang panauhang panlalaking isahan ay likas na naipahahayag sa Filipino sa panghalip na “mo”; hindi kailangang idagdag ang hiwalay na “ikaw.”
- source_word: עָמָל
  choice: paghihirap
  rationale: Saklaw nito ang dinanas na hirap, dalamhati, at kapighatian, nang hindi nililimitahan ang salita sa paggawa o pagod lamang.
- source_word: תִּשְׁכָּח
  choice: malilimutan
  rationale: Ang Qal imperfect na ikalawang panauhang isahan ay may panghinaharap na diwa sa konteksto.
- source_word: כְמַיִם
  choice: parang tubig
  rationale: Pinananatili ang paghahambing na minamarkahan ng כְ; mas natural sa modernong Tagalog ang kolektibong “tubig” kaysa “mga tubig.”
- source_word: עָבְרוּ
  choice: na dumaloy na
  rationale: Ipinahihiwatig nito ang tubig na nakaraan at wala na, habang pinananatili ang buhay na larawan ng pag-agos.
- source_word: תִזְכֹּר
  choice: maaalaala mo iyon
  rationale: Ang Qal imperfect ay isinaling may panghinaharap na diwa; ang “iyon” ay idinagdag bilang likas na pantukoy pabalik sa paghihirap, bagaman walang tahasang layon sa Hebreo.
