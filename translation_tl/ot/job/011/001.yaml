- source_word: צֹפַר
  choice: Zofar
  rationale: Isinatinig ang pangalang Hebreo sa anyong natural at madaling basahin sa modernong Filipino.
- source_word: הַנַּעֲמָתִי
  choice: na Naamita
  rationale: Ang pang-uri ay katawagang gentiliko na tumutukoy sa pinagmulan o kaugnayan ni Zofar sa Naama; pinananatili ng “Naamita” ang maikling anyo ng orihinal.
- source_word: וַיֹּאמַר
  choice: at sinabi
  rationale: Ang אמר sa karaniwang pormula ng pagpapakilala sa pagsasalita ay “sinabi.” Pinananatili ang dalawang pandiwa ng Hebreo—“sumagot” at “sinabi”—nang hindi nagiging labis na di-natural sa Filipino.
