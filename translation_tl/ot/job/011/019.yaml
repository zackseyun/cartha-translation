lexical_decisions:
- source_word: רָבַצְתָּ
  choice: Hihiga ka
  rationale: Tuwirang pinananatili ang larawan ng paghiga o pagpapahinga nang tiwasay, nang hindi ito nililimitahan sa pagtulog.
- source_word: וְאֵין מַחֲרִיד
  choice: at walang sinumang mananakot sa iyo
  rationale: Ipinapahayag ang kawalan ng taong magdudulot ng panginginig o takot; natural at malinaw ito sa modernong Tagalog.
- source_word: וְחִלּוּ פָנֶיךָ
  choice: lalapit upang hingin ang iyong kagandahang-loob
  rationale: Inihahatid ang idyomang Hebreo ng pagsusumamo sa harap ng isang tao upang makamit ang kaniyang pabor, habang pinananatili ang aktibong diwa ng paglapit at paghiling.
- source_word: רַבִּים
  choice: marami
  rationale: Payak at eksaktong katumbas ng pagtukoy sa malaking bilang ng mga tao.
