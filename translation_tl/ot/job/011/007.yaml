  text: Can you discover the depths of God? Can you find the limit of the Almighty?[a][b]
translation:
  language: tl
  text: Matutuklasan mo ba ang kalaliman ng Diyos?[a] Matatagpuan mo ba ang hangganan ng Makapangyarihan sa Lahat?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Matutuklasan mo ba ang masusing pagsisiyasat sa Diyos?” Ang Hebreong חֵקֶר ay maaaring tumukoy sa pagsisiyasat, masusing paghahanap, o sa bagay na sinisiyasat.
    reason: lexical_alternative
  - marker: b
    text: O “ang dulo,” “ang buong lawak,” o “ang kasakdalan” ng Makapangyarihan sa Lahat.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֵקֶר
  choice: ang kalaliman
  rationale: Maaaring tumukoy ang חֵקֶר sa pagsisiyasat o sa bagay na sinisiyasat. Sa retorikal na tanong, ipinahihiwatig nito ang kalalimang hindi lubos na maaabot ng pagsisiyasat ng tao.
- source_word: אֱלוֹהַ
  choice: ng Diyos
  rationale: Karaniwang salin ng pang-isahang katawagan sa Diyos sa Job at likas na kapantay ng שַׁדַּי sa ikalawang linya.
- source_word: תִּמְצָא
  choice: Matutuklasan mo ba
  rationale: Pangunahing kahulugan ng מצא ang ‘makatagpo’ o ‘makasumpong’; ang ‘matuklasan’ ay angkop sa unang linya dahil kaugnay ito ng masusing pagsisiyasat.
- source_word: אִם
  choice: ba
  rationale: Ipinakikilala rito ng אִם ang ikalawang retorikal na tanong, hindi isang pasubaling sugnay. Likas itong ipinahahayag sa Filipino sa pamamagitan ng ‘ba.’
- source_word: עַד תַּכְלִית
  choice: ang hangganan
  rationale: Magkasamang nagpapahayag ang עַד at תַּכְלִית ng sukdulang dulo, lawak, o hangganan na maaaring maabot.
- source_word: שַׁדַּי
  choice: Makapangyarihan sa Lahat
  rationale: Isinasalin ang banal na titulong שַׁדַּי sa karaniwan at malinaw na katawagang Filipino sa halip na tumbasan lamang ito ng transliterasyon.
- source_word: תִּמְצָא
  choice: Matatagpuan mo ba
  rationale: Pinananatili ang pangunahing diwa ng inuulit na pandiwang מצא, at natural ang ‘matatagpuan’ kasama ng ‘hangganan.’
theological_decisions:
- issue: Wikang tumutukoy sa kakayahan ng tao na maunawaan ang Diyos
  choice: Inilalahad ang dalawang tanong bilang retorikal na pahayag na hindi kayang saliksikin nang lubusan ng tao ang Diyos.
  alternative: Unawain ang talata bilang pagsasabing hindi maaaring magkaroon ang tao ng anumang tunay na pagkakilala sa Diyos.
  rationale: Binibigyang-diin ng Hebreo ang kawalan ng kakayahang maabot ang kalaliman o sukdulang hangganan ng Diyos, ngunit hindi nito tahasang itinatanggi ang lahat ng tunay na pagkakilala sa kaniya. Pinananatili ng salin ang tensiyong ito.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinananatili ang magkatulad na retorikal na tanong at ang bahagyang pagkakaiba ng ‘matutuklasan’ at ‘matatagpuan’ upang maipakita ang ugnayan ng pagsisiyasat at paghahanap sa Hebreo.
