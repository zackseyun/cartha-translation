base_translation:
  language: en
  yaml_path: translation/ot/job/011/005.yaml
  text: But if only God would speak and open his lips against you,[a]
translation:
  language: tl
  text: Ngunit sana'y magsalita ang Diyos at ibuka niya ang kanyang mga labi laban sa iyo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kasama mo” o “sa iyo.” Literal na “kasama” ang Hebreong pang-ukol, ngunit sa kontekstong ito ay malamang na may diwang pakikipagtunggali.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאוּלָם
  choice: Ngunit
  rationale: Nagpapakita ito ng mariing pagsalungat sa naunang sinabi ni Zofar, sa natural at marangal na modernong Tagalog.
- source_word: מִי יִתֵּן
  choice: sana'y
  rationale: Ang idyomang Hebreo ay nagpapahayag ng matinding paghahangad, hindi literal na tanong na 'sino ang magbibigay.'
- source_word: אֱלוֹהַּ
  choice: ang Diyos
  rationale: Ang pang-isahang katawagan sa Diyos ay tuwirang isinalin nang walang di-kinakailangang pagpapalawak.
- source_word: דַּבֵּר
  choice: magsalita
  rationale: Kasunod ng pormula ng paghahangad, likas itong basahin bilang kilos na hinihiling ni Zofar na gawin sana ng Diyos.
- source_word: וְיִפְתַּח
  choice: at ibuka niya
  rationale: Pinananatili ang kasunod at kaugnay na kilos at malinaw na tinutukoy ang Diyos bilang simuno.
- source_word: שְׂפָתָיו
  choice: ang kanyang mga labi
  rationale: Pinananatili ang tiyak at masidhing antropomorpikong larawan ng Hebreo sa halip na gawing pangkalahatang 'bibig' o simpleng 'magsalita.'
- source_word: עִמָּךְ
  choice: laban sa iyo
  rationale: Bagaman karaniwang literal na 'kasama mo,' ipinahihiwatig ng konteksto na nais ni Zofar na sagutin at salungatin ng Diyos si Job; inilalahad sa talababa ang tunay na leksikal na kalabuan.
theological_decisions:
- issue: Antropomorpikong paglalarawan sa Diyos na 'ibuka ... ang kanyang mga labi'
  choice: Tuwirang pinanatili ang larawan
  alternative: Paraprasahin bilang 'mangusap sa iyo'
  rationale: Ang katawagang may bahagi ng katawan ay karaniwang biblikal na paraan ng paglalarawan sa pagsasalita ng Diyos. Ang pagpapanatili nito ay tapat sa anyo ng teksto nang hindi nagtatakda ng doktrina tungkol sa pisikal na katawan ng Diyos.
- issue: Diwa ng עִמָּךְ sa konteksto
  choice: laban sa iyo
  alternative: kasama mo; sa iyo
  rationale: Mapagtunggali ang konteksto ng hangarin ni Zofar na sagutin ng Diyos ang mga pahayag ni Job. Gayunman, hindi lubusang inaalis ang literal at mas neutral na mga pagbasa, kaya nakatala ang mga iyon sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang pinaikling 'sana’y' para sa likas na pagpapahayag ng matinding paghahangad, at pinanatili ang matalinghagang 'mga labi' ng pinagmulang Hebreo.
