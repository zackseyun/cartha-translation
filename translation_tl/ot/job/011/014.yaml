base_translation:
  language: en
  yaml_path: translation/ot/job/011/014.yaml
  text: If iniquity is in your hand[a], put it far away[b], and do not let injustice dwell in your tents.
translation:
  language: tl
  text: Kung may kasamaan sa iyong kamay[a], ilayo mo ito, at huwag mong hayaang manahan ang kawalang-katarungan sa iyong mga tolda.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “sa iyong kamay” ay maaaring tumukoy sa kasamaang ginagawa mo o nasa ilalim ng iyong kapangyarihan.
    reason: idiom_note
  - marker: b
    text: Ang “mga tolda” ay tumutukoy rin sa tahanan o buhay ng sambahayan.
    reason: cultural_note
lexical_decisions:
- source_word: אִם
  choice: Kung may
  rationale: Ipinakikilala ng אִם ang isang kondisyon. Ang “Kung may” ay likas sa Filipino at naipahahayag ang ipinahihiwatig na pag-iral ng kasamaan sa kamay.
- source_word: אָוֶן
  choice: kasamaan
  rationale: Sa kontekstong ito ng moral na panawagan, tumutukoy ang אָוֶן sa masamang gawain o kalikuan. Malinaw at sapat ang lawak ng “kasamaan” nang hindi ito ginagawang teknikal na terminong teolohikal.
- source_word: בְּיָדְךָ
  choice: sa iyong kamay
  rationale: Pinananatili ang konkretong larawang Hebreo. Maaari itong tumukoy sa kasamaan na ginagawa, hawak, o nasa kapangyarihan ng isang tao, kaya ipinaliliwanag ang idyoma sa talababa sa halip na paliitin ang kahulugan sa pangunahing teksto.
- source_word: הַרְחִיקֵהוּ
  choice: ilayo mo ito
  rationale: Ang pautos na Hiphil ay humihiling ng aktibong pagpapalayo. Tumpak at natural sa Filipino ang “ilayo mo ito.”
- source_word: וְאַל תַּשְׁכֵּן
  choice: at huwag mong hayaang manahan
  rationale: Ipinahahayag nito ang pagbabawal na pahintulutang mamalagi ang kawalang-katarungan. Pinananatili ng “manahan” ang larawang kaugnay ng mga tolda.
- source_word: בְּאֹהָלֶיךָ
  choice: sa iyong mga tolda
  rationale: Maramihan ang anyong Hebreo. Pinananatili ng “mga tolda” ang sinaunang konkretong tagpuan habang maaari ring saklawin ang tahanan at sambahayan.
- source_word: עַוְלָה
  choice: kawalang-katarungan
  rationale: Ang עַוְלָה ay tumutukoy sa mali, baluktot, o di-makatarungang asal. Ang saling ito ay kaugnay ngunit hindi kapareho ng “kasamaan,” kaya napapanatili ang paralelismong patula.
theological_decisions:
- issue: Mga terminong moral sa paralelismong patula
  choice: Isalin ang אָוֶן bilang “kasamaan” at ang עַוְלָה bilang “kawalang-katarungan.”
  alternative: Gamitin ang iisang salita, gaya ng “kasamaan,” para sa dalawang terminong Hebreo.
  rationale: Magkalapit ang dalawang salita ngunit hindi kailangang ipalagay na teknikal na magkaiba. Ang magkaugnay na salin ay nagpapanatili sa pagkakaiba ng diksyon at sa paralelismo nang hindi nag-aangkat ng partikular na doktrina.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang mga konkretong larawang “kamay,” “manahan,” at “mga tolda,” habang nililinaw sa mga talababa ang idyomatiko at panlipunang saklaw ng mga ito.
