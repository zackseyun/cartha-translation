  text: And your lifetime will rise brighter than noon[a]; though there is darkness[c][b], it will become like the morning.
translation:
  language: tl
  text: At ang buhay mo[b] ay sisikat, mas maliwanag kaysa katanghaliang-tapat[a]; kahit may dilim[c], magiging tulad ito ng umaga.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “At ang buhay mo ay magiging mas maliwanag kaysa katanghaliang-tapat; ang dilim ay magiging tulad ng umaga.” May ilang masisiksik na matalinghagang pahayag sa Hebreo, lalo na sa ikalawang linya.
    reason: alternative_reading
  - marker: b
    text: Ang salitang Hebreo na isinaling “buhay” ay maaari ding tumukoy sa haba o takbo ng buhay o, sa mas malawak na diwa, sa makalupang pag-iral ng isang tao.
    reason: lexical_alternative
  - marker: c
    text: Hindi tiyak ang bihirang salitang Hebreo na isinaling “dilim”; maaari din itong unawain bilang “karimlan” o “kalabuan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִצָּהֳרַיִם
  choice: nang higit na maliwanag kaysa katanghaliang-tapat
  rationale: Maaaring gamitin ang מִן bilang paghahambing, kaya ang diwang ‘higit ... kaysa katanghaliang-tapat’ ang pinakaangkop sa larawan ng tumitinding liwanag. Idinagdag ang ‘maliwanag’ bilang likas na paglalahad sa Filipino ng ipinahihiwatig na paghahambing.
- source_word: יָקוּם
  choice: ay sisikat
  rationale: Karaniwang nangangahulugang ‘bumangon’ o ‘umangat’ ang קום. Sa talinghagang tumutukoy sa liwanag ng buhay, pinananatili ng ‘sisikat’ ang larawan ng pag-angat at pagliliwanag nang hindi nagiging pilit sa Filipino.
- source_word: חָלֶד
  choice: ang panahon ng iyong buhay
  rationale: Maaaring tumukoy ang חָלֶד sa haba o takbo ng buhay at sa makalupang pag-iral. Nililinaw ng pariralang ito ang aspektong temporal habang nananatiling natural sa Filipino.
- source_word: תָּעֻפָה
  choice: kahit may dilim
  rationale: Bihira at di-tiyak ang salitang ito, ngunit ang ‘dilim’ ang malamang na diwa dahil sa pagtutol nito sa ‘umaga.’ Ipinahahayag ng ‘kahit’ ang malamang na ugnayang mapagparaya ng masiksik na tulang Hebreo nang hindi ipinipilit na tuwirang nakasaad ang pang-ugnay.
- source_word: כַּבֹּקֶר
  choice: tulad ng umaga
  rationale: Tuwirang pinananatili nito ang pagtutulad na ipinahihiwatig ng כ at ang imahen ng umaga.
- source_word: תִּהְיֶה
  choice: magiging tulad ito
  rationale: Bagaman maaaring simpleng ‘magiging’ o ‘ay’ ang היה, natural na ipinahahayag rito ng ‘magiging’ ang pagbabago mula sa dilim tungo sa kalagayang tulad ng umaga.
