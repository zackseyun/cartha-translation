  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang patulang larawan ng pagsikat, katanghaliang-tapat, dilim, at umaga. Ang ‘kahit may dilim’ ay natural na nagpapahayag ng ipinahihiwatig na pagsalungat, samantalang ipinaliliwanag sa talababa ang pagiging masiksik at di-tiyak ng Hebreo.
