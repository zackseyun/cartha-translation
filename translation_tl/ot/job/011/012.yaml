  text: But an empty-headed man will gain understanding when a wild donkey’s colt is born a man[a][b].
translation:
  language: tl
  text: Ngunit magkakaroon ng unawa ang taong hungkag ang kaisipan[a] kapag ang anak ng mailap na asno ay maisilang na tao.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa mas literal na salin, “ang taong hungkag ay magkakaroon ng puso.” Ang “magkaroon ng puso” rito ay idyoma para sa pagkakaroon ng isip o unawa.
    reason: lexical_alternative
  - marker: b
    text: 'Malamang na mapanuya ang pahayag: magiging marunong ang taong walang unawa kapag ang anak ng mailap na asno ay maisilang na tao—isang bagay na imposible. Gayunman, maikli at mahirap unawain ang Hebreo.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְ
  choice: Ngunit
  rationale: Maaaring magpahayag ang pangatnig ng pagsalungat sa konteksto; ang “Ngunit” ay angkop sa mapanuya at kasabihang pahayag.
- source_word: אִישׁ נָבוּב
  choice: taong hungkag ang isip
  rationale: Ang נָבוּב ay literal na “hungkag” at matalinghagang tumutukoy sa taong walang wastong pag-iisip. Pinananatili ng salin ang larawan habang nililinaw ang tinutukoy nito.
- source_word: יִלָּבֵב
  choice: magkakaroon ng unawa
  rationale: Ang anyo mula sa לבב ay literal na maaaring unawaing “magkakaroon ng puso,” isang idyoma para sa pagkakaroon ng isip o unawa.
- source_word: עַיִר פֶּרֶא
  choice: bisiro ng mailap na asno
  rationale: Ang parirala ay tumutukoy sa batang mailap na asno. Ang “bisiro” ay maikli at likas na katawagan sa batang asno.
- source_word: אָדָם יִוָּלֵד
  choice: ipinanganak na tao
  rationale: Tuwirang pinananatili ang imposibleng larawan ng isang bisiro na ipinanganganak bilang tao, nang hindi dinaragdagan ang masaklaw na Hebreong pahayag.
theological_decisions:
- issue: Mapanuyang bisa ng kasabihan
  choice: 'Isinalin bilang paghahambing na nagpapahiwatig ng imposibilidad: magkakaroon ng unawa ang taong hungkag ang isip kapag ipinanganak na tao ang bisiro ng mailap na asno.'
  alternative: Maaaring basahin ang dalawang sugnay bilang magkatabing pahayag o bilang pag-asang maaaring tumalino ang mangmang.
  rationale: Maikli at mahirap ang Hebreo, ngunit malakas na ipinahihiwatig ng paralelismo ang mapanuyang paghahambing. Hindi idinagdag sa pangunahing teksto ang “lamang” upang hindi lubusang isara ang tunay na kalabuan.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “hungkag ang isip” upang mapanatili ang metapora ng Hebreo nang maging malinaw sa karaniwang mambabasa; iniwasan ang mas kolokyal at mapanlait na “walang laman ang ulo.”
