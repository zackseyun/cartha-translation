  yaml_path: translation/ot/job/011/003.yaml
  text: Will your empty talk make men keep silent[a], and when you mock, will no one shame you?
translation:
  language: tl
  text: Patatahimikin ba ng walang kabuluhan mong salita[a] ang mga tao? At kapag nanunuya ka, wala bang magpapahiya sa iyo?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga pagyayabang mo” o “walang saysay mong pagdadaldal.” Ang salitang Hebreo ay maaaring tumukoy sa hungkag, walang saysay, mayabang, o huwad na pananalita.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּדֶּיךָ
  choice: walang kabuluhan mong salita
  rationale: Ipinahahayag nito ang mapanghamak na diin ng בַּדִּים bilang hungkag o walang saysay na pananalita, habang hindi tahasang ipinapasiyang kasinungalingan ang sinasabi ni Job.
- source_word: מְתִים
  choice: mga tao
  rationale: Bagaman panlalaki ang anyong Hebreo, pangkalahatan ang tinutukoy sa konteksto; natural at tumpak sa modernong Filipino ang “mga tao.”
- source_word: יַחֲרִישׁו
  choice: patatahimikin
  rationale: 'Pinananatili ng pandiwang sanhi ang Hiphil na diwa: ang salita ni Job ang umano’y magpapatahimik sa iba.'
- source_word: וַתִּלְעַג
  choice: manunuya ka ba
  rationale: Ang לעג ay panunuya o paglibak. Ang anyong tanong ay natural na nagpapatuloy sa retorikal na hamon ng talata.
- source_word: מַכְלִם
  choice: magpapahiya sa iyo
  rationale: Pinananatili nito ang causative na diwa ng Hiphil participle ng כלם—ang magdulot ng hiya o kahihiyan—sa halip na gawing mas interpretibong “sawayin.”
