  text: Hindi ba sasagutin ang napakaraming salita, at mapatutunayang tama ang taong puro salita?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literal: “tao ng mga labi,” isang idyoma para sa taong nakikilala sa maraming pananalita.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲרֹב דְּבָרִים
  choice: ang napakaraming salita
  rationale: Ipinahahayag ng רֹב דְּבָרִים ang kasaganaan o dami ng sinasabi, na may pahiwatig ng labis na pananalita. Likas sa modernong Tagalog ang “napakaraming salita” at napananatili nito ang diin ng tanong.
- source_word: לֹא יֵעָנֶה
  choice: mananatiling walang sagot
  rationale: Ang Niphal ng ענה ay nangangahulugang “sagutin” sa anyong balintiyak. Ang “mananatiling walang sagot” ay malinaw at natural na katumbas sa retorikal na tanong.
- source_word: וְאִם
  choice: at … ba
  rationale: Sa paralelismong patula, nagpapakilala ito ng ikalawang retorikal na tanong. Napananatili ng “at” at ng hulaping pananong na “ba” ang ugnayan at puwersa nito.
- source_word: אִישׁ שְׂפָתַיִם
  choice: ang taong puro salita
  rationale: Literal itong “tao ng mga labi,” isang idyoma para sa taong nakikilala sa labis o hungkag na pananalita. Ang “taong puro salita” ay natural sa Tagalog at pinananatili ang mapanuring tono nang hindi dinaragdagan ang kahulugan.
- source_word: יִצְדָּק
  choice: mapatutunayang tama
  rationale: Sa kontekstong ito, ang Qal ng צדק ay tumutukoy sa pagpapakitang nasa tama ang isang tao. Iniiwasan ng saling ito ang posibleng di-angkop na teolohikal na pakahulugan ng “ariing-ganap” o ang mas makitid na legal na diwa ng “mapawalang-sala.”
theological_decisions:
- issue: Saklaw ng יִצְדָּק
  choice: mapatutunayang tama
  alternative: mapawawalang-sala / maituturing na matuwid
  rationale: Pinananatili ang evaluative o forensic na posibilidad ng pandiwa sa agarang pagtatalo, nang hindi ito ikinakabit sa mas huling teknikal na doktrina ng pag-aaring-ganap.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “mananatiling walang sagot” upang maging likas ang unang retorikal na tanong, at “taong puro salita” upang maipahayag ang Hebreong idyoma nang hindi nagiging kahoy o malabo.
