  text: For then you will lift up your face without blemish[b][a]; you will stand firm and will not fear.
translation:
  language: tl
  text: Sapagkat sa panahong iyon, itataas mo ang iyong mukha nang walang kapintasan[a]; magiging matatag ka[b] at hindi ka matatakot.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “itataas mo ang iyong ulo nang walang kahihiyan.” Literal na sinasabi sa Hebreo, “itataas mo ang iyong mukha nang walang kapintasan,” isang larawang nagpapahiwatig ng panunumbalik ng tiwala at paglaya sa kahihiyan.
    reason: lexical_alternative
  - marker: b
    text: O “magiging panatag ka” o “matibay ang pagkakatatag mo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אָז
  choice: Sapagkat sa panahong iyon
  rationale: Ipinakikita ng כִּי ang bunga ng naunang kondisyon, at ng אָז ang panahong darating bilang resulta nito.
- source_word: תִּשָּׂא פָנֶיךָ
  choice: maitataas mo ang iyong mukha
  rationale: Pinananatili ang Hebreong larawan ng pagtataas ng mukha, na nagpapahiwatig ng panunumbalik ng tiwala at paglaya sa kahihiyan.
- source_word: מִמּוּם
  choice: nang walang kapintasan
  rationale: Karaniwang tumutukoy ang מוּם sa kapintasan o depekto; dito ay matalinghagang inilalarawan ang pagiging malaya sa dungis. Pinananatili ng salin ang lexical na larawan sa halip na tahasang ipakahulugang 'walang kahihiyan.'
- source_word: מֻצָק
  choice: magiging matatag ka
  rationale: Ang anyong ito mula sa יצק ay naghahatid ng diwa ng katatagan, pagiging matibay, o pagkakatatag. Natural at malinaw sa modernong Tagalog ang 'magiging matatag ka.'
- source_word: וְלֹא תִירָא
  choice: at hindi matatakot
  rationale: Tuwirang ipinapahayag ang negatibong hinaharap ng ירא sa natural na Tagalog.
