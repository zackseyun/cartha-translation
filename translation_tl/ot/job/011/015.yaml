  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang poetikong larawan ng 'pagtataas ng mukha' at ang literal na 'walang kapintasan,' habang inilagay sa talababa ang mas interpretibong pagbasa. Ang mga panandang talababa ay inilagay kaagad pagkatapos ng mga pariralang tinutukoy ng mga ito.
