  source_fidelity: 'Ang pangunahing diwa ay tapat sa Hebreo: isang pagpapatuloy ng paghahangad na magsalita ang Diyos, ang mga lihim ng karunungan, ang mahirap na pahayag tungkol sa dobleng/may dalawang panig na tusiyyah, at ang paratang ni Zofar na hindi lubos na ipinataw ng Diyos ang nararapat kay Job. Gayunman, ang “tunay na karunungan” ay nagdaragdag ng diwang wala sa תּוּשִׁיָּה, at mas tumpak na gamitin ang isang katumbas na gaya ng “matibay na karunungan.”'
  naturalness: Mas natural sa makabagong Filipino ang “mga lihim ng karunungan,” “Kaya't alamin mo na,” at “bahagi ng iyong pagkakasala.” Nililinaw rin ng inayos na talababa ang literal na anyo nang hindi gumagawa ng hindi likas na pariralang “doble ukol sa.”
  terminology: Ang “Diyos,” “karunungan,” at “pagkakasala” ay angkop sa marangal ngunit modernong rehistro. Ang “mga lihim” ay maingat na salin ng mga nakatagong bagay at hindi nagpapahiwatig ng isang espesipikong doktrinal na kahulugan ng “hiwaga.”
