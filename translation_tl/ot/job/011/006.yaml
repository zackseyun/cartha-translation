  text: and would tell you the hidden things of wisdom[a], for sound wisdom has two sides. Know, then[c][b], that God has overlooked some of your iniquity.
translation:
  language: tl
  text: 'at ipahayag niya sa iyo ang mga lihim ng karunungan[a], sapagkat ang matibay na karunungan ay may dalawang panig[b]. Kaya''t alamin mo na: pinalampas ng Diyos ang bahagi ng iyong pagkakasala[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang mga nakatagong bagay ng karunungan.”
    reason: lexical_alternative
  - marker: b
    text: Literal, “sapagkat ito ay doble para sa matibay na karunungan.” Isang mahirap na idyoma ito na maaaring magpahiwatig na ang karunungan ay higit na masalimuot o maraming aspekto kaysa sa nakikita.
    reason: lexical_alternative
  - marker: c
    text: 'Mahirap unawain ang pandiwang Hebreo. Maaari ring isalin: “mas kaunti ang siningil sa iyo ng Diyos kaysa sa nararapat sa iyong pagkakasala,” o “kinalimutan ng Diyos ang bahagi ng iyong pagkakasala.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וְיַגֶּד
  choice: at ipahayag niya sa iyo
  rationale: Ang Hiphil ng נגד ay nangangahulugang ipahayag o ipaalam. Ipinagpapatuloy nito ang naunang pahayag na nagnanais na magsalita ang Diyos, kaya ang anyong ito ay angkop sa konteksto.
- source_word: תַּעֲלֻמוֹת חָכְמָה
  choice: ang mga hiwaga ng karunungan
  rationale: Ang תעלמות ay tumutukoy sa mga bagay na nakatago o lingid. Pinananatili ng “mga hiwaga” ang maramihang anyo at ang marangal na himig nang hindi labis na nagpapaliwanag.
- source_word: כִפְלַיִם לְתוּשִׁיָּה
  choice: ang tunay na karunungan ay may dalawang panig
  rationale: Literal na nagpapahiwatig ang כפליים ng pagiging dalawa o doble, samantalang ang תושיה ay isang masalimuot na terminong pangkarunungan. Ang “may dalawang panig” ay natural na naghahayag na higit na masalimuot ang karunungan kaysa sa nakikita, habang minamarkahan sa talababa ang literal na anyo.
- source_word: וְדַע
  choice: Kaya alamin mo
  rationale: Pinananatili nito ang pautos na diwa ng ידע at ang lohikal na kaugnayan nito sa naunang pahayag.
- source_word: יַשֶּׁה לְךָ
  choice: pinalampas ng Diyos
  rationale: Mahirap tiyakin ang eksaktong diwa ng pandiwa. Sa konteksto ng paratang ni Zofar, ipinahihiwatig nitong hindi lubos na siningil o pinarusahan ng Diyos si Job ayon sa kanyang kasamaan; ang alternatibong mas literal na “kinalimutan” ay inilalagay sa talababa.
- source_word: מֵעֲוֺנֶךָ
  choice: ang ilan sa iyong kasamaan
  rationale: Maaaring tumukoy ang עון sa kasamaan, pagkakasala, o pananagutang bunga nito. Ang מן ay inuunawang partitivo, kaya “ang ilan sa” ang malinaw at likas na salin.
theological_decisions:
- issue: Ang sinabi ni Zofar tungkol sa pakikitungo ng Diyos kay Job
  choice: Pinalampas ng Diyos ang ilan sa kasamaan ni Job
  alternative: Mas kaunti ang siningil ng Diyos kaysa sa nararapat sa pagkakasala ni Job; o kinalimutan ng Diyos ang ilan sa kanyang kasamaan
  rationale: Itinatanghal ito bilang paratang ni Zofar, hindi bilang tahasang pagsang-ayon ng tagapagsalaysay. Pinananatili ng talababa ang tunay na kahirapang leksikal ng pandiwang Hebreo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “hiwaga” at “tunay na karunungan” upang mapanatili ang estilong pampanitikan ng tulang pangkarunungan, habang ang “pinalampas” ay natural ngunit sinasamahan ng talababa dahil hindi tiyak ang pandiwang Hebreo.
