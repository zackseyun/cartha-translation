  text: Kung ihahanda mo ang iyong puso at iuunat mo ang iyong mga kamay sa kanya,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring, “iladlad mo ang iyong kamay sa kanya.” Isahan sa Hebreo ang pangngalang “palad,” ngunit karaniwang tumutukoy ang pananalita sa kilos ng panalanging nakaunat ang mga kamay.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Kung
  rationale: Nagsisimula ito ng kondisyonal na pahayag at pinananatili ang panawagan ni Zofar bilang kondisyon.
- source_word: אַתָּה
  choice: mo
  rationale: Ang ikalawang panauhang panlalaking isahan ay likas na ipinahahayag sa Filipino sa panghalip na enclitic na “mo”; hindi na kailangan ang hiwalay na “ikaw.”
- source_word: הֲכִינוֹתָ
  choice: ihahanda
  rationale: Ang Hiphil ng כון ay tumutukoy sa paggawa na handa, matatag, o wastong nakatuon. Ang “ihahanda” ay malinaw at hindi labis na nagpapakahulugan sa panloob na kilos.
- source_word: לִבֶּךָ
  choice: ang iyong puso
  rationale: Ang לֵב ay tumutukoy sa kalooban at buong panloob na pagkatao, kabilang ang isip at pagpapasya. Pinananatili ng “puso” ang larawang Hebreo.
- source_word: וּפָרַשְׂתָּ
  choice: at iuunat
  rationale: Ang פרשׂ ay nangangahulugang iladlad o iunat. Sa konteksto ng panalangin, natural sa Filipino ang “iunat ang mga kamay.”
- source_word: אֵלָיו
  choice: sa kanya
  rationale: Pinananatili nito ang panlalaking isahang panghalip at ang direksiyong patungo sa tinutukoy, nang hindi tahasang idinaragdag ang pangngalang “Diyos.”
- source_word: כַּפֶּךָ
  choice: ang iyong mga kamay
  rationale: Bagaman isahan ang pangngalang Hebreo na literal na “palad/kamay,” karaniwang tumutukoy ang parirala sa kilos ng panalanging nakaunat ang mga kamay. Ang maramihan ay mas natural sa Filipino; inilalahad sa talababa ang anyong isahan.
theological_decisions:
- issue: Tinutukoy ng panghalip sa אֵלָיו
  choice: Isinaling “sa kanya,” na sa konteksto ay tumutukoy sa Diyos.
  alternative: Tahasan itong isaling “sa Diyos.”
  rationale: Pinananatili ng salin ang panghalip ng Hebreo at iniiwasang magdagdag ng pangngalang wala sa mismong talata, habang malinaw pa rin ang tinutukoy mula sa konteksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “iyong” upang mapanatili ang dignidad ng patulang pananalita, habang ang ayos ng pangungusap ay nananatiling natural sa karaniwang mambabasa.
