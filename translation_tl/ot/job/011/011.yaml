source:
  edition: WLC
  text: כִּי ה֭וּא יָדַ֣ע מְתֵי שָׁ֑וְא וַ/יַּרְא אָ֝֗וֶן וְ/לֹ֣א יִתְבּוֹנָֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/011/011.yaml
  text: For he knows men of falsehood; when he sees wickedness[a], does he not take notice?
translation:
  language: tl
  text: 'Sapagkat kilala niya ang mga taong bulaan;

    kapag nakikita niya ang kasamaan,

    hindi ba niya iyon napapansin?[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O, “at hindi niya iyon pinapansin/isinaalang-alang.” Maaaring basahin ang pangwakas na sugnay sa Hebreo bilang payak na pagkakaila, ngunit higit na sinusuportahan ng konteksto ang retorikal na tanong: “hindi ba niya iyon napapansin?”'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikita ang batayan ng pahayag ni Zofar at likas sa marangal na modernong Tagalog.
- source_word: הוּא
  choice: niya
  rationale: Tumutukoy sa Diyos ayon sa konteksto; hindi kailangan ang di-karaniwang pagpapalaki ng panghalip.
- source_word: יָדַע
  choice: kilala
  rationale: Ang ganap na anyo ay nagsasaad dito ng palagian at tiyak na pagkakilala ng Diyos sa mga tao, kaya ang pangkasalukuyang diwa ang angkop.
- source_word: מְתֵי שָׁוְא
  choice: mga taong bulaan
  rationale: Pinananatili ang pagtukoy sa mga tao at ang moral na diwa ng שָׁוְא bilang kabulaanan o panlilinlang, nang hindi sila tuwirang tinatawag na walang halaga.
- source_word: וַיַּרְא
  choice: kapag nakikita niya
  rationale: Likas na naihahayag sa Tagalog ang temporal na ugnayan nito sa kasunod na retorikal na tanong.
- source_word: אָוֶן
  choice: kasamaan
  rationale: Saklaw nito ang moral na kasamaan o kabuktutan na pangunahing diwa ng salita sa konteksto.
- source_word: וְלֹא יִתְבּוֹנָן
  choice: hindi ba niya iyon napapansin?
  rationale: 'Ibinibigay bilang retorikal na tanong, na pinakamalinaw na kaayon ng argumento: nakikilala at nakikita ng Diyos ang kasamaan, kaya tiyak na pinapansin niya ito.'
theological_decisions:
- issue: Lakas ng pangwakas na sugnay וְלֹא יִתְבּוֹנָן
  choice: 'Retorikal na tanong: “hindi ba niya iyon napapansin?”'
  alternative: 'Payak na pagkakaila: “at hindi niya iyon pinapansin/isinaalang-alang.”'
  rationale: Posible sa gramatika ang payak na pagkakaila, ngunit mas angkop sa lohika ng sinabi ni Zofar ang retorikal na tanong. Pinananatili sa talababa ang tunay na alternatibong pagbasa sa Hebreo.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “bulaan” upang mapanatili ang moral na diwa ng kabulaanan nang hindi gawing sobrang teknikal ang pananalita; nanatiling lantad sa talababa ang ambiguwidad ng huling sugnay.
