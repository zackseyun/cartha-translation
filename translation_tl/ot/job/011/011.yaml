  source_fidelity: Tapat ang salin sa Hebreo. Ang “Sapagkat” ay angkop para sa כִּי; “kilala niya ang mga taong bulaan” ay maayos na naghahatid ng יָדַע מְתֵי־שָׁוְא; at “kasamaan” ay sapat na katumbas ng אָוֶן sa kontekstong moral. Ang “kapag nakikita niya” ay likas na paraan upang ipahayag ang ugnayan ng וַיַּרְא sa kasunod na sugnay. Wasto ring pinili ang retorikal na pagbasa ng huling sugnay, habang pinananatili sa talababa ang posible ngunit mahirap na payak na pagkakaila.
