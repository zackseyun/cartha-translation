translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “panatag” at “nang ligtas” upang maiwasan ang mabigat o di-likas na pag-uulit ng “ligtas,” habang pinananatili ang pagkakaiba ng dalawang anyo mula sa ugat na בטח.
