translation:
  language: tl
  text: At magiging panatag ka, sapagkat may pag-asa; titingnan mo ang paligid[a] at mahihiga ka nang ligtas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “maghuhukay ka”; ang pandiwang Hebreo ay literal na may kaugnayan sa paghuhukay, ngunit dito ay maaaring tumukoy sa pagtingin o paghahanda ng lugar bago humiga.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָטַחְתָּ
  choice: At panatag ka
  rationale: Ang anyo mula sa בטח ay nagpapahayag ng kalagayan ng pagtitiwala o katiwasayan. Ang “panatag” ay natural sa Filipino at angkop sa katiwasayang bunga ng pag-asa.
- source_word: כִּי יֵשׁ תִּקְוָה
  choice: sapagkat may pag-asa
  rationale: Pinananatili ng “sapagkat” ang ugnayang sanhi ng כִּי, at karaniwang katumbas ng תִּקְוָה ang “pag-asa.”
- source_word: וְחָפַרְתָּ
  choice: susuriin mo ang paligid
  rationale: Literal na kaugnay ng paghuhukay ang חפר, ngunit sa kontekstong ito maaari itong tumukoy sa pagtingin, pagsisiyasat, o paghahanda ng lugar bago humiga. Ang salin ay natural ngunit pinananatili sa talababa ang literal na posibilidad.
- source_word: לָבֶטַח
  choice: nang ligtas
  rationale: Ang pariralang ito ay tumutukoy sa katiwasayan. Ang “mahihiga ka nang ligtas” ay likas na Filipino at pinananatili ang larawan ng ligtas na pamamahinga.
- source_word: תִּשְׁכָּב
  choice: mahihiga ka
  rationale: Tuwirang pinananatili ang konkretong kahulugan ng שׁכב na “humiga,” sa halip na gawing mas interpretatibong “magpahinga.”
