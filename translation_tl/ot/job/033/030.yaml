translation:
  language: tl
  text: upang ibalik ang kanyang buhay[a] mula sa hukay[b], upang siya ay maliwanagan[c] ng liwanag ng buhay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “kanyang buhay” ay maaari ring isaling “sarili niya” o “kaluluwa niya.”
    reason: lexical_alternative
  - marker: b
    text: Ang “hukay” ay maaari ring tumukoy sa libingan o kapahamakan.
    reason: lexical_alternative
  - marker: c
    text: 'Siksik at patula ang Hebreo. Maaari ring isalin: “upang dalhin siya sa liwanag, sa liwanag ng buhay,” o “upang makita niya ang liwanag ng buhay.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְהָשִׁיב
  choice: upang ibalik
  rationale: Ang Hiphil infinitive ng שוב ay nagsasaad ng pagsasanhing makabalik. Pinananatili ng “ibalik” ang kongkretong diwa ng pagliligtas o pagpapanumbalik.
- source_word: נַפְשׁוֹ
  choice: ang buhay niya
  rationale: Ang נֶפֶשׁ ay maaaring tumukoy sa buhay, sarili, o kaluluwa. Sa konteksto ng pagliligtas mula sa hukay, natural sa modernong Tagalog ang “buhay niya” at malinaw nitong ipinahihiwatig ang pag-iwas sa kamatayan nang hindi itinatanggi ang mas malawak na saklaw ng salita.
- source_word: מִנִּי שָׁחַת
  choice: mula sa hukay
  rationale: Pinananatili ng “hukay” ang kongkretong larawang patula ng שַׁחַת at ang kaibahan nito sa “liwanag ng buhay.” Maaari rin itong magpahiwatig ng libingan o kapahamakan.
- source_word: לֵאוֹר
  choice: upang maliwanagan siya
  rationale: Siksik at eliptikal ang Hebreo. Ang pasakaling “upang maliwanagan siya” ay nagpapahayag ng layunin o bunga at pinananatili ang pag-uulit ng ugat na אור kasama ng sumunod na “liwanag.”
- source_word: בְּאוֹר הַחַיִּים
  choice: ng liwanag ng buhay
  rationale: Pinananatili ang maigsi at patulang pariralang “liwanag ng buhay.” Sa Tagalog, ang “maliwanagan ... ng liwanag” ay likas na mababasa bilang sanhi o paraan, habang nananatili ang posibleng ugnayang instrumental o associative ng בְּ.
