base_translation:
  language: en
  yaml_path: translation/ot/job/033/031.yaml
  text: Pay attention[a], Job; listen to me. Be silent[b], and I will speak.
translation:
  language: tl
  text: Makinig kang mabuti, Job; pakinggan mo ako. Manahimik ka[a], at magsasalita ako.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Manatili kang tahimik.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקְשֵׁב
  choice: Makinig kang mabuti
  rationale: Ang Hiphil imperative ng קשׁב ay humihiling ng masusing pakikinig. Likas sa modernong Filipino ang “makinig kang mabuti” at malinaw ang puwersa ng utos.
- source_word: אִיּוֹב
  choice: Job
  rationale: Ginamit ang nakasanayang anyo ng pangalang ito sa mga Bibliyang Filipino.
- source_word: שְׁמַע לִי
  choice: pakinggan mo ako
  rationale: Ang שׁמע na may ל ay tumutukoy sa pakikinig na nakatuon sa isang tao. Natural at tuwiran sa Filipino ang “pakinggan mo ako.”
- source_word: הַחֲרֵשׁ
  choice: Manahimik ka
  rationale: Ang pautos na anyo ng חרשׁ dito ay nangangahulugang huwag magsalita. Ang “manahimik ka” ay tuwiran, dignified, at angkop sa paghiling ni Elihu na huwag muna siyang gambalain.
- source_word: וְאָנֹכִי
  choice: at … ako
  rationale: Pinananatili ng “at” ang payak na ugnayan ng mga sugnay, samantalang ang hayag na “ako” ay nagdadala ng diin ng panghalip na אָנֹכִי.
- source_word: אֲדַבֵּר
  choice: magsasalita ako
  rationale: Ang Piel imperfect ng דבר ay nagpapahayag ng gagawin ni Elihu kasunod ng pananahimik ni Job. Malinaw at natural ang “magsasalita ako.”
theological_decisions: []
