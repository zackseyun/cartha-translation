  text: פָּדָ֣ה נפש/י מֵ/עֲבֹ֣ר בַּ/שָּׁ֑חַת ו/חית/י בָּ/א֥וֹר תִּרְאֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/job/033/028.yaml
  text: He has redeemed my soul from passing into the pit[b][a], and my life will look upon the light.
translation:
  language: tl
  text: Tinubos niya ang aking sarili mula sa pagtungo sa hukay[a][b], at ang aking buhay ay makakakita ng liwanag.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Tinubos niya ang aking buhay mula sa pagpasok sa hukay.”
    reason: lexical_alternative
  - marker: b
    text: Ang “hukay” ay karaniwang larawang Hebreo para sa kamatayan o libingan.
    reason: cultural_note
lexical_decisions:
- source_word: פָּדָה
  choice: Tinubos
  rationale: Pinananatili nito ang diwa ng pagliligtas o pagtubos mula sa panganib, nang hindi tahasang nagdaragdag ng kabayarang hindi binanggit sa talata.
- source_word: נַפְשִׁי
  choice: ang aking buhay
  rationale: Sa kontekstong ito, ang נֶפֶשׁ ay tumutukoy sa buhay o buong sarili. Mas natural ito sa modernong Tagalog kaysa “kaluluwa” kapag inililigtas mula sa pagpasok sa hukay.
- source_word: מֵעֲבֹר
  choice: upang hindi tumawid tungo sa
  rationale: Ipinapakita ng parirala ang pagpigil sa pagtawid o pagpasok, at pinananatili ang larawan ng paggalaw sa Hebreo.
- source_word: בַּשַּׁחַת
  choice: sa hukay
  rationale: Pinananatili ng “hukay” ang kongkretong talinghaga para sa kamatayan o libingan nang hindi agad pinapaliit ang saklaw nito sa isang interpretasyon.
- source_word: וְחַיָּתִי
  choice: at ... ang aking buhay
  rationale: Ang pangngalan ay tumutukoy sa buhay o nabubuhay na pag-iral. Ang pag-uulit ng “buhay” ay sumasalamin sa tula ng Hebreo, bagaman nagkakalapit ang kahulugan nito at ng נַפְשִׁי.
- source_word: בָּאוֹר
  choice: ang liwanag
  rationale: Pinananatili ang tiyak na anyo at ang pagsalungat ng liwanag ng buhay sa hukay ng kamatayan.
- source_word: תִּרְאֶה
  choice: makikita
  rationale: Ang di-ganap na anyo ay natural na mababasa bilang hinaharap dito; ang “makikita” ay malinaw at marangal na Tagalog para sa pagtanaw o pagdanas sa liwanag.
theological_decisions:
- issue: Ang tinutukoy na simuno ng pambungad na pandiwa
  choice: Tinubos niya ang aking buhay
  alternative: Tinubos ng Diyos ang aking buhay; Tinubos niya ako
  rationale: Walang hayag na simuno sa mismong linyang Hebreo. Ipinahihiwatig ng konteksto na Diyos ang tinutukoy, ngunit pinananatili ng “niya” ang pagiging di-hayag ng pangalan sa talata.
- issue: Ang kahulugan ng “hukay”
  choice: Pinanatili bilang larawan ng hukay na kaugnay ng kamatayan
  alternative: libingan; kapahamakan
  rationale: Hindi tahasang nilulutas ng salin kung literal na hukay, libingan, kamatayan, o kapahamakan ang buong saklaw ng larawan.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Pinanatili ang mala-tulang larawan ng pagtawid tungo sa hukay at pagkakita sa liwanag. Sadyang hindi pinangalanan ang Diyos bilang simuno dahil pahiwatig lamang ito sa konteksto, at hindi hayag sa talata.
