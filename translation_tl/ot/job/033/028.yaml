    issue: Baligtad ang simuno at layon sa “makikita ng aking buhay ang liwanag.”
    rationale: Ang Hebreong וחיתי באור תראה ay nagsasabing “ang aking buhay ay makakakita/titingin sa liwanag.” Sa kasalukuyang Tagalog, ang anyong “makikita ng aking buhay ang liwanag” ay karaniwang nangangahulugang ang liwanag ang makakakita sa aking buhay.
  - severity: low
    issue: Ang “upang hindi tumawid tungo sa hukay” ay mas maluwag at bahagyang di-kasing-idiomatiko kaysa sa direktang pagpapahayag ng pinagmulan ng pagliligtas.
    rationale: Ang מֵעֲבֹר ay “mula sa pagdaan/pagpasok.” Ang “mula sa pagtungo sa hukay” ay mas tuwirang Tagalog habang pinananatili ang kilos patungo sa hukay.
  revised_text: Tinubos niya ang aking sarili mula sa pagtungo sa hukay[a][b], at ang aking buhay ay makakakita ng liwanag.
