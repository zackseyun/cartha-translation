  source_fidelity: 'Ang pangunahing diwa ay wastong naihahatid: ang di-hayag na simuno ay tumutukoy sa Diyos sa konteksto, ang pagliligtas ay mula sa pagpasok sa hukay, at ang liwanag ay kabaligtaran ng kamatayan. Ngunit ang pangalawang sugnay na “makikita ng aking buhay ang liwanag” ay baligtad ang gampanin sa Tagalog: nangangahulugan ito na ang liwanag ang makakakita sa buhay, hindi na ang buhay ang makakakita sa liwanag.'
  naturalness: Natural at marangal ang rebisyon. Ang “aking sarili” at “aking buhay” ay nagbibigay ng sapat na poetikong pagkakaiba para sa נפשי at וחיתי nang hindi gumagamit ng di-natural na “kaluluwa” sa unang sugnay. Ang “makakakita ng liwanag” ay malinaw na aktibong pahayag.
  terminology: Ang “tinubos,” “hukay,” at “liwanag” ay angkop at pinananatili ang mga mahalagang larawan ng Hebreo. Hindi pinapangalanan ang Diyos sa talata mismo. Ang talababa tungkol sa “hukay” ay nananatiling maingat at hindi ipinipilit ang iisang pakahulugan.
