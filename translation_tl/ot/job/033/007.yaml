- source_word: עָלֶיךָ
  choice: sa iyo
  rationale: Natural na Filipino sa pariralang nagsasaad ng bigat na ipinapataw sa isang tao.
- source_word: יִכְבָּד
  choice: hindi bibigat
  rationale: Tuwirang pinananatili ang konkretong metapora ng pagiging mabigat at umaayon sa aspektong di-ganap ng pandiwa.
