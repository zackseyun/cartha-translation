  - severity: low
    issue: Nasa dulo ng pangungusap ang talababa kahit ang tinutukoy nito ay “kamay.”
    rationale: Mas malinaw na ilagay ang panandang talababa kaagad kasunod ng “kamay ko,” upang eksaktong maitugma ang tala sa salitang Hebreo na mahirap bigyang-kahulugan.
  - severity: low
