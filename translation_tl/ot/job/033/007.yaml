lexical_decisions:
- source_word: הִנֵּה
  choice: Tingnan mo
  rationale: Ginagamit bilang mariing pantawag-pansin na natural sa makabagong Filipino.
- source_word: אֵמָתִי
  choice: ang sindak sa akin
  rationale: Pinananatili ang diwa ng matinding takot na maiuugnay sa presensiya ni Elihu nang hindi ipinahihiwatig na siya mismo ang natatakot.
- source_word: תְבַעֲתֶךָ
