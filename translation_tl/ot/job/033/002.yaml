translation:
  language: tl
  text: Narito nga[a], ibinuka ko na ang aking bibig; nagsasalita ang aking dila sa aking ngalangala.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Tingnan mo nga” o “Narito, pakiusap.” Ang pangwakas na parirala sa Hebreo ay napakatingkad at medyo di-pangkaraniwan; maaari rin itong isaling “nagsasalita ang aking dila sa loob ng aking bibig.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה נָא
  choice: Narito
  rationale: Ang הִנֵּה ay pantawag-pansin, samantalang ang נָא ay nagbibigay-diin o bahagyang pakiusap. Likas sa makabagong Tagalog ang “Narito” bilang marangal na panawag-pansin; inilalahad sa talababa ang mas tahasang alternatibo.
- source_word: פָּתַחְתִּי פִי
  choice: ibinuka ko na ang aking bibig
  rationale: Pinananatili ang kongkretong idyomang Hebreo para sa pagsisimulang magsalita. Ipinahihiwatig ng “na” na naganap na ang pagbubuka at nagpapatuloy ang pagsasalita.
- source_word: דִּבְּרָה
  choice: nagsasalita
  rationale: Ang di-karaniwang anyong pandiwa ay inuunawang may “aking dila” bilang simuno. Ang aspektong imperpektibo ng Tagalog ay angkop sa pagsasalitang kasalukuyang nagaganap at hindi ipinipilit ang isang tiyak na panahunan na hindi malinaw sa anyo.
- source_word: לְשׁוֹנִי
  choice: ang aking dila
  rationale: Literal na pinananatili ang bahagi ng katawan na metonimiya para sa pagsasalita at katambal ng “aking bibig.”
- source_word: בְחִכִּי
  choice: sa aking ngalangala
  rationale: Ang חֵךְ ay tiyak na tumutukoy sa ngalangala o bubong ng bibig. Pinananatili ang matingkad at medyo di-pangkaraniwang larawan sa Hebreo sa halip na gawing pangkalahatang “sa aking bibig.”
theological_decisions: []
translation_notes:
  register: Makabago ngunit marangal na Tagalog. Pinanatili ang konkretong makatang larawan ng bibig, dila, at ngalangala, kahit bahagyang di-karaniwan ito sa natural na pananalita, sapagkat gayon din ang Hebreo.
