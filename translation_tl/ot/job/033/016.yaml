  text: then he opens the ears of men and seals their instruction[a].
translation:
  language: tl
  text: Nang magkagayon, binubuksan niya ang mga tainga ng mga tao at tinatatakan ang kanilang tagubilin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “at tinatatakan ang kanilang babala” o “at tinatatakan ang kanilang pagdidisiplina.” Maaari ring unawain: “at tinatatakan ang tagubilin para sa kanila.” Ang Hebreong מוּסָר ay maaaring mangahulugang tagubilin, pagsaway, pagdidisiplina, o babala.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: Sa gayon
  rationale: Minamarkahan nito ang kasunod na pagkilos ng Diyos sa konteksto ng pagsasalita niya sa panaginip at pangitain. Likas sa Filipino ang “Sa gayon” at naipapakita ang lohikal at temporal na daloy.
- source_word: יִגְלֶה אֹזֶן אֲנָשִׁים
  choice: binubuksan niya ang pandinig ng mga tao
  rationale: Literal na inilalantad o binubuksan ang tainga ng mga tao. Ang “binubuksan ang pandinig” ay natural na idyomang Filipino para sa pagbibigay-kakayahang makarinig at tumanggap, habang pinananatili ang larawan ng Hebreo.
- source_word: וּבְמֹסָרָם
  choice: ang tagubilin sa kanila
  rationale: Ang מוּסָר ay maaaring tumukoy sa tagubilin, pagsaway, pagdidisiplina, o babala. Ang “tagubilin” ay angkop sa konteksto ng mensaheng ibinibigay ng Diyos upang ilayo ang tao sa masama; isinalin ang hulaping 3mp bilang “sa kanila,” isang posibleng natural na pag-unawa sa di-karaniwang parirala.
- source_word: יַחְתֹּם
  choice: tinatatakan
  rationale: 'Pinananatili nito ang metapora ng חתם: ang mensahe ay itinatak, pinagtitibay, o ipinauukit sa tumatanggap.'
theological_decisions:
- issue: Kung ano ang eksaktong diwa ng מוּסָר at kaugnayan ng hulaping 3mp
  choice: “ang tagubilin sa kanila” sa teksto, na may mga alternatibo sa talababa
  alternative: “ang babala sa kanila,” “ang pagdidisiplina sa kanila,” o “ang kanilang tagubilin”
  rationale: Hindi tiyak kung ang diin ay nasa pagtuturo, pagsaway, babala, o pagdidisiplina, at maaaring unawain ang hulapi bilang nauukol sa kanila o nakatuon sa kanila. Hindi dapat gawing mas tiyak ang talata kaysa sa Hebreo.
translation_notes:
  register: Makabago at marangal na Filipino. Ginamit ang “mga tao” bilang likas na salin ng אֲנָשִׁים sa pangkalahatang pahayag tungkol sa sangkatauhan. Pinanatili ang metapora ng pagtatatak at nilinaw sa talababa ang tunay na leksikal at gramatikal na kalabuan.
