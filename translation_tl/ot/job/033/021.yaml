  yaml_path: translation/ot/job/033/021.yaml
  text: His flesh wastes away from sight[a], and his bones, once unseen, stick out.
translation:
  language: tl
  text: 'Ang kanyang laman ay unti-unting nawawala sa paningin,[a]

    at lumilitaw ang kanyang mga butong hindi dating nakikita.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Nauubos ang kanyang laman hanggang sa hindi na ito makita, at nalalantad ang kanyang mga butong hindi dating nakikita.” Maikli at medyo mahirap unawain ang Hebreo ng linyang ito, lalo na ang salitang isinaling “lumilitaw.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יִכֶל
  choice: Nangangalirang
  rationale: Ang Qal imperfect ng כלה ay naglalarawan ng patuloy na pagkaubos o pangangayayat ng laman dahil sa karamdaman; likas sa Filipino ang “nangangalirang” sa ganitong konteksto.
- source_word: בְּשָׂרוֹ
  choice: ang kanyang laman
  rationale: Pinananatili ang kongkretong larawan ng Hebrew na “laman,” sa halip na gawing mas pangkalahatang “katawan.”
- source_word: מֵרֹאִי
  choice: hanggang sa hindi na makita
  rationale: Ipinahahayag nito ang pagkawala ng laman mula sa paningin; mas malinaw at natural ito sa Filipino kaysa sa literal na “mula sa paningin.”
- source_word: וְשֻׁפִי
  choice: litaw na
  rationale: Mahirap at hindi tiyak ang anyong Hebrew. Sa konteksto, ipinakikita nitong naging lantad o prominenteng makita ang mga buto matapos mangayayat ang laman.
- source_word: עַצְמוֹתָיו
  choice: ang kanyang mga buto
  rationale: Tuwirang salin ng pangngalang maramihan na may hulaping ikatlong panauhang panlalaki.
- source_word: לֹא רֻאּוּ
  choice: dati’y hindi nakikita
  rationale: 'Pinananatili ang passive na diwa at ginagawang malinaw ang temporal na paghahambing: ang mga butong hindi nakikita noon ay litaw na ngayon.'
theological_decisions: []
translation_notes:
  register: Makabago at marangal na Filipino, na may malinaw na larawan ng matinding pangangayayat. Ginamit ang “nangangalirang” bilang karaniwang salitang tumutukoy sa unti-unting pagkaubos ng katawan dahil sa sakit; pinanatili sa talababa ang kahirapan at posibleng alternatibong pagbasa ng Hebrew.
