translation_notes:
  register: Makabago ngunit marangal na Tagalog. Pinanatili ang paralelismong “puso / mga salita” at “mga labi / kaalaman,” pati ang payak na ayos ng unang sugnay upang hindi magdagdag ng pandiwang gaya ng “nagmumula” o “nagpapahayag” na wala sa Hebreo.
