  yaml_path: translation/ot/job/033/003.yaml
  text: The uprightness of my heart is in my words[a], and my lips speak knowledge clearly.
translation:
  language: tl
  text: Ang katapatan ng aking puso ay nasa aking mga salita, at malinaw[a] na nagsasalita ng kaalaman ang aking mga labi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “dalisay na kaalaman ang binibigkas ng aking mga labi” o “tahasang sinasabi ng aking mga labi ang nalalaman nila.” Ang salitang Hebreo na isinaling “malinaw” ay maaari ring magpahiwatig ng kadalisayan o pagiging tahasan.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹשֶׁר
  choice: katapatan
  rationale: Tumutukoy ang pangngalan sa pagiging tuwid o marangal sa moral na diwa. Sa pahayag ni Elihu tungkol sa disposisyon ng kaniyang puso, likas sa modernong Tagalog ang “katapatan” at hindi nito ginagawang sobrang abstrakto ang larawan.
- source_word: לִבִּי
  choice: aking puso
  rationale: Pinananatili ang karaniwang Hebreong larawan para sa kalooban, pag-iisip, at panloob na pagkatao, gayundin ang pagtutugma nito sa “mga labi.”
- source_word: אֲמָרָי
  choice: aking mga salita
  rationale: Tuwirang tumutukoy ito sa mga sinasabi ni Elihu. Ang “mga salita” ay natural at nagpapanatili sa kongkretong anyo ng tula.
- source_word: וְדַעַת
  choice: kaalaman
  rationale: Pinananatili ang tuwirang kahulugan ng pangngalan bilang nilalaman o katangian ng sinasabi ng kaniyang mga labi.
- source_word: שְׂפָתַי
  choice: aking mga labi
  rationale: Pinananatili ang metonimiya ng Hebreo at ang makatang pagtutugma ng “puso” at “mga labi.”
- source_word: בָּרוּר
  choice: malinaw
  rationale: Maaaring magpahiwatig ang salita ng linaw, kadalisayan, o pagiging tahasan. Ang “malinaw” ang pinakaangkop sa agarang konteksto ng pagsasalita, habang inilalahad sa talababa ang tunay na leksikal na kalabuan.
- source_word: מִלֵּלוּ
  choice: nagsasalita
  rationale: Ang pandiwa ay nangangahulugang magsalita o bumigkas. Ang pangkasalukuyang anyo ay likas sa agarang pahayag ni Elihu at sa paglalarawan niya sa sarili niyang pananalita.
