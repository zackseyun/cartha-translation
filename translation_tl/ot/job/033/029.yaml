  yaml_path: translation/ot/job/033/029.yaml
  text: Look[a], God does all these things two or three times with a man,
translation:
  language: tl
  text: Tingnan mo, ginagawa ng Diyos ang lahat ng ito nang dalawa o tatlong ulit sa isang tao[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “sa isang lalaki.” Hebreo: “sa isang lalaki,” na ginagamit dito bilang kinatawang isahan para sa tao sa pangkalahatan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶן
  choice: Tingnan mo
  rationale: Pantawag-pansin ito na may mariing puwersa. Natural sa modernong Filipino ang “Tingnan mo” at angkop sa tuwirang pakikipag-usap ni Elihu kay Job.
- source_word: כָּל אֵלֶּה
  choice: lahat ng ito
  rationale: Tumutukoy ito pabalik sa iba't ibang pagkilos ng Diyos na kababanggit lamang. Sapat at natural sa Filipino ang “lahat ng ito” nang hindi nagdaragdag ng mas tiyak na pangngalan.
- source_word: יִפְעַל
  choice: ginagawa
  rationale: Ang pandiwang פעל ay tumutukoy sa pagsasagawa o paggawa. Ang “ginagawa” ay natural na katambal ng “lahat ng ito” at pinananatili ang pangkalahatang saklaw ng Hebreo.
- source_word: אֵל
  choice: Diyos
  rationale: Karaniwang katawagan ito sa Diyos sa kontekstong ito at hindi nangangailangan ng dagdag na titulong gaya ng “Makapangyarihan.”
- source_word: פַּעֲמַיִם שָׁלֹשׁ
  choice: dalawa o tatlong beses
  rationale: Ang literal na pagkakasunod na “makalawa, makaitlo” ay isang pahayag ng pag-uulit. Pinananatili ng “dalawa o tatlong beses” ang mga bilang at natural itong basahin sa Filipino.
- source_word: עִם
  choice: sa
  rationale: Sa pariralang Filipino na “ginagawa ... sa isang lalaki,” malinaw na ipinapahayag ng “sa” ang pakikitungo o pagkilos ng Diyos kaugnay ng taong iyon. Mas natural ito kaysa sa literal ngunit alanganing “kasama ng.”
- source_word: גָּבֶר
  choice: isang lalaki
  rationale: Ang גָּבֶר ay panlalaking pangngalang isahan na tumutukoy rito sa isang indibidwal bilang kinatawan ng tao sa pangkalahatan. Pinananatili sa pangunahing teksto ang anyong panlalaki ng pinagmulan, habang nililinaw sa talababa ang pangkalahatang saklaw.
theological_decisions:
- issue: Kinatawang panlalaking pananalita sa גָּבֶר
  choice: isang lalaki
  alternative: isang tao
  rationale: Panlalaking pangngalang isahan ang ginamit sa Hebreo, ngunit maaari itong kumatawan sa sinumang tao. Pinananatili ng pangunahing teksto ang anyo ng pinagmulan nang hindi ipinahihiwatig na sa mga lalaki lamang kumikilos ang Diyos; nililinaw ng talababa ang saklaw nito.
translation_notes:
  register: Modernong Filipino na tuwiran, marangal, at madaling maunawaan. Ang “Tingnan mo” ay nagpapanatili sa pantawag-pansing tono; ang hulíng kuwit ay pinanatili dahil nagpapatuloy ang pangungusap sa kasunod na talata.
