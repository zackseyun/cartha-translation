base_translation:
  language: en
  yaml_path: translation/ot/job/033/023.yaml
  text: If there is for him an angel[a], a mediator, one among a thousand, to declare to man his uprightness[b],
translation:
  language: tl
  text: Kung may isang anghel[a] para sa kanya, isang tagapamagitan, isa sa sanlibo, upang ipahayag sa tao kung ano ang matuwid para sa kanya[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “isang mensahero, isang tagapamagitan”; maaari ring “isang anghel, isang tagapagpaliwanag.”
    reason: lexical_alternative
  - marker: b
    text: O “ang kanyang katuwiran.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם יֵשׁ
  choice: Kung may
  rationale: Likas na Filipino para sa kondisyonal at eksistensiyal na parirala; pinananatili ang diwa ng isang maaaring kalagayan.
- source_word: עָלָיו
  choice: para sa kanya
  rationale: Ipinahihiwatig dito ang kaugnayan o pagkilos alang-alang sa tao, nang hindi labis na tinutukoy kung ito ay pagtatanggol o pamamagitan.
- source_word: מַלְאָךְ
  choice: anghel
  rationale: Maaaring mangahulugang mensahero o anghel ang salitang Hebreo, ngunit mas angkop sa konteksto ang makalangit na tagapamagitan; inilagay sa talababa ang tunay na alternatibo.
- source_word: מֵלִיץ
  choice: tagapamagitan
  rationale: Sinasaklaw nito ang papel ng isang namamagitan o nagsasalita para sa iba, habang pinananatili sa talababa ang posibleng diwang tagapagpaliwanag.
- source_word: אֶחָד מִנִּי אָלֶף
  choice: isa sa sanlibo
  rationale: Maikli at likas na katumbas na pinananatili ang larawan ng pambihirang pag-iral.
- source_word: לְהַגִּיד
  choice: upang ipahayag
  rationale: Malinaw na ipinakikita ang layunin at pinananatili ang marangal na tono ng pahayag.
- source_word: לְאָדָם
  choice: sa tao
  rationale: Ang tao rito ay isang indibidwal na tao; ang Filipino na “tao” ay natural at hindi nangangailangan ng paglalagay ng kasariang wala namang gramatikal na katumbas sa target na wika.
- source_word: יָשְׁרוֹ
  choice: ang kanyang katuwiran
  rationale: Pormal na pinananatili ang hulaping tumutukoy sa tao at ang diwa ng pagiging matuwid, habang inilalahad sa talababa ang mas idyomatikong posibilidad na “kung ano ang tama para sa kanya.”
theological_decisions:
- issue: Pagkakakilanlan at gawain ng מַלְאָךְ מֵלִיץ
  choice: Isinalin nang pangkalahatan bilang “isang anghel, isang tagapamagitan.”
  alternative: Isang taong mensahero o tagapagpaliwanag; o isang makalangit na tagapamagitan na may mas tiyak na teolohikal na pagkakakilanlan.
  rationale: Hindi tahasang kinikilala ng talata ang tauhan nang higit sa mga katawagang Hebreo. Hindi ito iniugnay sa isang partikular na doktrina o persona.
- issue: Kahulugan ng יָשְׁרוֹ
  choice: “ang kanyang katuwiran” sa pangunahing teksto
  alternative: “kung ano ang tama para sa kanya”
  rationale: Maaaring tumukoy ang parirala sa katuwiran ng tao o sa tamang bagay o landas para sa kanya. Pinananatili ng teksto at talababa ang dalawang posibilidad sa halip na lutasin ang kalabuan.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “sanlibo” upang mapanatili ang maikli at mataas na himig ng karunungang patula; hindi nilinaw nang higit sa Hebreo ang pagkakakilanlan ng anghel o ang saklaw ng “katuwiran.”
