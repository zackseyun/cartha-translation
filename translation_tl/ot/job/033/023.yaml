  source_fidelity: Tumpak na naipapasa ng draft ang kondisyunal na pahayag, ang anghel/mensahero na gumaganap bilang tagapamagitan o tagapagpaliwanag, at ang idiomang nagpapahiwatig ng pambihirang bilang. Gayunman, ang “ang kanyang katuwiran” ay mas madaling unawain sa modernong Filipino bilang personal na righteousness o pagiging-matuwid, samantalang ang יָשְׁרוֹ sa kontekstong ito ay maaari ring tumukoy sa nararapat o matuwid na landas para sa tao. Ang mas idyomatikong pangunahing salin, na may talababa para sa mas pormal na pagbasa, ay mas malinaw at nananatiling tapat sa kalabuan ng Hebreo.
  naturalness: Marangal at malinaw ang kabuuang register. Ang “Kung may isang anghel para sa kanya” at “isa sa sanlibo” ay natural sa kontekstong patula. Ang tanging kailangang ayusin ay ang pangwakas na parirala upang hindi magmukhang tiyak na pahayag tungkol sa sariling katuwiran ng tao.
  terminology: Ang “anghel,” “tagapamagitan,” at “mensahero” ay angkop at hindi nagpapataw ng tiyak na pagkakakilanlang teolohikal sa tauhan. Ang “matuwid” ay mas angkop kaysa “katuwiran” para sa praktikal o normatibong diwa ng יָשְׁרוֹ sa pangunahing teksto; pinananatili sa talababa ang “kanyang katuwiran” bilang mas pormal na alternatibo.
