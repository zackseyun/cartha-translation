  text: זַ֥ךְ אֲנִ֗י בְּֽלִ֫י פָ֥שַׁע חַ֥ף אָנֹכִ֑י וְ/לֹ֖א עָוֺ֣ן לִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/job/033/009.yaml
  text: ‘I am pure[a], without transgression; I am clean[b], and there is no iniquity in me.’
translation:
  language: tl
  text: ‘Ako ay dalisay, walang pagsuway; ako ay malinis[a], at walang kasamaan[b] sa akin.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “walang sala”; ang חַף ay maaaring tumukoy sa kalinisan o sa pagiging malaya sa sala.
    reason: lexical_alternative
  - marker: b
    text: O “pagkakasala” o “pananagutan dahil sa kasalanan”; ang עָוֺן ay maaaring mangahulugang kasamaan, pagkakasala, o pananagutan dahil sa kasalanan.
    reason: lexical_alternative
lexical_decisions:
- source_word: זַךְ
  choice: dalisay
  rationale: Likas at marangal na Filipino para sa moral na kadalisayan; pinananatili rin nitong naiiba ang unang pang-uri sa חַף.
- source_word: בְּלִי פָשַׁע
  choice: walang pagsalansang
  rationale: Ipinahahayag ng בְּלִי ang kawalan, at ang פֶּשַׁע ay may diwang moral-legal ng pagsuway o paghihimagsik; ang “pagsalansang” ay sapat na malawak nang hindi nililimitahan sa isang natatanging kontekstong tipanan.
- source_word: חַף
  choice: walang sala
  rationale: Ipinapahayag ang pagiging malinis o malaya sa pagkakasala sa natural na modernong Filipino, habang pinananatili ang juridikal na posibilidad ng salita.
- source_word: עָוֺן
  choice: kasamaan
  rationale: Pinananatili ang mabigat na moral na diwa ng salita nang hindi sapilitang pinipili kung ang tinutukoy ay masamang gawa o pananagutan; inilalagay sa talababa ang alternatibong “pagkakasala.”
- source_word: לִי
  choice: sa akin
  rationale: Natural na katumbas ng Hebreong literal na “sa akin” sa pahayag ng pag-aari o pagkakaugnay, at hindi nito labis na ginagawang panloob na katangian ang parirala.
theological_decisions:
- issue: Saklaw ng pag-aangkin ni Job ayon sa pagsipi ni Elihu
  choice: Tuwirang isalin bilang mariing pag-aangkin ng kadalisayan at kawalan ng sala.
  alternative: Palambutin bilang “itinuturing kong dalisay ang aking sarili,” o palakasin bilang tahasang doktrina ng ganap na kawalan ng anumang kasalanan.
  rationale: Ang Hebreo ay gumagamit ng tuwirang mga panaguring pang-uri at ganap na mga pagtanggi. Pinananatili ng salin ang tensiyong teolohikal nang hindi humahatol kung tama ang pag-aangkin ni Job.
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran, marangal, at madaling maunawaan. Pinanatili ang paralelismo at ang mariing pag-uulit ng “ako,” gayundin ang pagkakaiba ng זַךְ at חַף. Ang mga panandang [a] at [b] ay kapuwa nasa pangunahing teksto.
