  yaml_path: translation/ot/job/033/008.yaml
  text: 'Surely you have spoken in my hearing[a], and I have heard the sound of your words:'
translation:
  language: tl
  text: 'Tunay ngang nagsalita ka sa pandinig ko,[a]

    at narinig ko ang tunog ng iyong mga salita:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “sa aking mga tainga, at ang tunog ng mga salita ay naririnig ko.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Ngunit ... mismo
  rationale: Sa konteksto, binibigyang-diin ng particle ang katiyakan ng sinabi ni Elihu habang inililipat ang usapan sa mga salitang narinig niya kay Job. Pinananatili ng “ngunit” ang bahagyang pagsalungat sa naunang pahayag, habang ang “mismo” ang naghahatid ng emphatic na puwersa nang natural sa Filipino.
- source_word: אָמַרְתָּ
  choice: sinabi mo
  rationale: Ang qatal na ikalawang panauhang panlalaki ay tumutukoy sa naunang pagsasalita ni Job. Natural at tuwiran sa Filipino ang “sinabi mo.”
- source_word: בְאָזְנָי
  choice: sa pandinig ko
  rationale: Literal itong “sa aking mga tainga,” ngunit ang “sa pandinig ko” ay likas na idyomang Filipino at nananatiling malapit sa larawang pandinig ng Hebreo.
- source_word: וְקוֹל
  choice: at ... ang tinig
  rationale: Maaaring mangahulugang “tinig” o “tunog” ang קוֹל. Pinili ang “tinig” sapagkat tumutukoy ito sa aktuwal na pananalita ni Job at natural ang pariralang “tinig ng iyong mga salita,” bagaman sadyang pinananatili nito ang bahagyang makatang pag-uulit ng Hebreo.
- source_word: מִלִּין
  choice: iyong mga salita
  rationale: 'Ang anyong Aramaiko ay nangangahulugang “mga salita.” Idinagdag ang “iyong” mula sa malinaw na konteksto: mga salita ni Job ang inuulit ni Elihu.'
- source_word: אֶשְׁמָע
  choice: narinig ko
  rationale: Bagaman imperfect ang anyo, ang konteksto ay pag-uulat ni Elihu tungkol sa sinabi na ni Job. Ang naganap na “narinig ko” ay natural sa Filipino at hindi nangangailangang ipakahulugang kasalukuyan ang kilos.
