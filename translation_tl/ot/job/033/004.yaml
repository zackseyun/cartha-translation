id: JOB.33.4
reference: Job 33:4
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: רֽוּחַ אֵ֥ל עָשָׂ֑תְ/נִי וְ/נִשְׁמַ֖ת שַׁדַּ֣י תְּחַיֵּֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/033/004.yaml
  text: The Spirit of God has made me[a], and the breath of the Almighty gives me life.
translation:
  language: tl
  text: Ang Espiritu ng Diyos ang gumawa sa akin[a], at ang hininga ng Makapangyarihan sa lahat ang nagbibigay sa akin ng buhay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang hininga ng Diyos ang gumawa sa akin.” Ang salitang Hebreo na רוּחַ ay maaari ring mangahulugang “hininga” o “hangin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: רוּחַ
  choice: Espiritu
  rationale: Maaaring mangahulugang “espiritu,” “hininga,” o “hangin” ang רוּחַ. Sa pagkakaugnay nito sa Diyos at sa paralelismo sa “hininga ng Makapangyarihan sa lahat,” ang “Espiritu” ay angkop na pangunahing salin, habang inilalahad sa talababa ang tunay na alternatibong “hininga.”
- source_word: אֵל
  choice: Diyos
  rationale: Ginagamit dito ang אֵל bilang tawag sa Diyos at katapat ng שַׁדַּי sa ikalawang linya; natural at malinaw sa modernong Tagalog ang “Diyos.”
- source_word: עָשָׂתְנִי
  choice: gumawa sa akin
  rationale: Karaniwang nangangahulugang “gumawa” ang עשה. Pinananatili ng parirala ang payak na diwa ng pandiwa at ang paglikha kay Elihu nang hindi nagdaragdag ng mas tiyak na larawang gaya ng “humubog.”
- source_word: נִשְׁמַת
  choice: hininga
  rationale: Tumutukoy ang נְשָׁמָה sa hiningang nagbibigay-buhay. Pinananatili ng “hininga” ang larawang pangkalikhaan at ang paralelismo sa רוּחַ.
- source_word: שַׁדַּי
  choice: ang Makapangyarihan sa lahat
  rationale: Ito ang malinaw at nakaugaliang salin ng titulong שַׁדַּי sa Tagalog, sa halip na transliterasyong “Shaddai.”
- source_word: תְּחַיֵּנִי
  choice: nagbibigay sa akin ng buhay
  rationale: Ang causative na anyo ng חיה ay nagsasaad ng pagbibigay o pagpapanatili ng buhay. Ang saling ito ay natural at hindi nililimitahan ang kahulugan sa “pinananatili akong buhay” o “muling bumubuhay.”
theological_decisions:
- issue: Kung ang רוּחַ אֵל ay isasaling personal na “Espiritu ng Diyos” o di-personal na “hininga ng Diyos”
  choice: Espiritu ng Diyos
  alternative: hininga ng Diyos
  rationale: Ipinakikita ng paralelismo ang nagbibigay-buhay na pagkilos ng Diyos at gumagamit ito ng magkaibang salitang רוּחַ at נְשָׁמָה. Pinananatili ng “Espiritu” ang pagkakaibang iyon, samantalang kinikilala ng talababa na maaari ring mangahulugang “hininga” ang רוּחַ. Hindi ginagawang tahasang pahayag tungkol sa persona ang higit sa sinasabi ng taludtod.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang dalawang magkatapat na linya ng tulang Hebreo at ang pagkakaiba ng “Espiritu” at “hininga.”
