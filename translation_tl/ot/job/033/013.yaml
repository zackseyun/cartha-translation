  yaml_path: translation/ot/job/033/013.yaml
  text: Why do you contend against him, because he does not answer for all his words?
translation:
  language: tl
  text: Bakit ka nakikipagtalo sa kanya dahil hindi niya sinasagot ang lahat ng kanyang mga salita?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ayon sa pagbasa sa gilid ng tekstong Hebreo: “ang lahat ng iyong mga salita.” Ang nakasulat sa pangunahing teksto ay “ang lahat ng kanyang mga salita.”'
    reason: 'May ketiv-qere ang WLC: ang ketiv ay דְבָרָיו, samantalang ang qere ay דְבָרֶיךָ.'
lexical_decisions:
- source_word: מַדּוּעַ
  choice: Bakit
  rationale: Natural at tuwirang katumbas ng tanong na humihingi ng dahilan.
- source_word: אֵלָיו רִיבוֹתָ
  choice: ka nakikipagtalo sa kanya
  rationale: Ang ריב sa konstruksiyong ito ay tumutukoy sa pakikipagtalo o paghaharap ng usapin laban sa Diyos; pinananatili ng salin ang ikalawang panauhan at ang direksiyong 'sa kanya.'
- source_word: כִּי
  choice: dahil
  rationale: Ipinapahayag dito ang ibinibintang na dahilan ng pakikipagtalo, gaya ng pinakatuwirang pagbasa sa konteksto.
- source_word: כָל דְּבָרָיו
  choice: ang lahat ng kanyang mga salita
  rationale: Pinananatili ang anyong 'lahat ng kanyang mga salita,' bagaman may usaping tekstuwal sa hulaping panghalip.
- source_word: לֹא יַעֲנֶה
  choice: hindi niya sinasagot
  rationale: Ang imperfect na יענה ay natural na isinasaling pangkasalukuyang pangkalahatan; ang layon ay ang naunang 'mga salita.'
theological_decisions:
- issue: Ang tinutukoy ng 'kanya/niya' sa talata
  choice: Pinanatili ang mga panghalip nang hindi pinapalitan ng tahasang 'Diyos.'
  alternative: Bakit ka nakikipagtalo sa Diyos, dahil hindi niya sinasagot ang lahat ng iyong mga salita?
  rationale: Malinaw sa konteksto na Diyos ang tinutukoy, ngunit ang tekstong Hebreo ay gumagamit ng panghalip; ang pagpapanatili nito ay umiiwas sa hindi kailangang pagpapaliwanag sa mismong teksto.
- issue: Kung kanino ang 'mga salita'
  choice: kanyang mga salita
  alternative: iyong mga salita
  rationale: Sinusunod ng pangunahing tekstong Masoretiko/WLC ang ketiv na דְבָרָיו ('kanyang mga salita'), habang kinikilala sa talababa ang qere na דְבָרֶיךָ ('iyong mga salita'). Hindi nilulutas nang palihim ang tunay na tekstuwal na pagkakaiba.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “nakikipagtalo” sa halip na mas legalistikong “nakikipag-usap” o mas mabigat na “nakikipag-usapin,” upang madaling maunawaan habang nananatili ang diwa ng paghaharap o pagtatalo.
