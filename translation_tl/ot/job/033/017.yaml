  yaml_path: translation/ot/job/033/017.yaml
  text: to turn a man from his deed[a], and to cover pride from a strong man,
translation:
  language: tl
  text: upang ilayo ang tao sa kanyang gawa[a] at ikubli sa malakas na lalaki ang kapalaluan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas literal, “upang alisin sa tao ang kanyang gawa, at ikinukubli niya sa lalaki ang kapalaluan.” Siksik ang Hebreo, at maaaring unawain ang linya bilang paglalayo sa tao mula sa kanyang ginagawa o bilang pag-aalis mismo ng gawa sa kanya.
    reason: alternative_reading
lexical_decisions:
- source_word: לְהָסִיר
  choice: upang ilayo ... sa
  rationale: Ang Hiphil infinitive ng סור ay causative. Sa ugnayan nito sa אָדָם at מַעֲשֶׂה, natural na ipinahahayag ng “ilayo ang tao sa” ang pagpapatalikod sa isang gawain.
- source_word: אָדָם
  choice: ang tao
  rationale: Ang “tao” ay natural na panumbas sa modernong Filipino at hindi kinakailangang tukuyin ang kasarian, bagaman isahan ang tinutukoy rito.
- source_word: מַעֲשֶׂה
  choice: kanyang ginagawa
  rationale: Maaaring mangahulugang gawa, gawain, o kilos ang pangngalan. Ang “kanyang ginagawa” ay malinaw at natural habang ipinahihiwatig ang sariling pagkilos ng tao.
- source_word: וְגֵוָה
  choice: kapalaluan
  rationale: Tumutukoy ang גֵּוָה sa pagmamataas o kapalaluan. Ang “kapalaluan” ay dignified at may malinaw na negatibong moral na diwa.
- source_word: מִגֶּבֶר
  choice: sa lalaki
  rationale: Karaniwang tumutukoy ang גֶּבֶר sa isang lalaki, kung minsan ay may diin sa lakas. Pinananatili ng “lalaki” ang leksikal na pagkakaiba nito sa אָדָם nang hindi labis na ipinapasok ang ideya ng lakas.
- source_word: יְכַסֶּה
  choice: ikubli
  rationale: Literal na “takpan” ang pandiwa, ngunit sa konstruksiyong may מִן maaari itong magpahayag ng pagkukubli o pag-aalis sa paningin. Natural sa Filipino ang “ikubli sa lalaki” at napapanatili ang metapora nang hindi ganap na nilulutas ang sintaktikong siksik na pahayag.
theological_decisions:
- issue: Layunin ng babala ng Diyos at ang ugnayan ng tao sa kanyang gawa
  choice: Layunin nitong ilayo ang tao sa kanyang ginagawa at ikubli sa kanya ang kapalaluan.
  alternative: Alisin sa tao ang kanyang gawa, at tinatakpan niya ang kapalaluan mula sa lalaki.
  rationale: Siksik at hindi ganap na tiyak ang sintaks ng Hebreo. Kaayon ng Job 33:14–18 ang pagbasa na inilalayo ng Diyos ang tao sa mapanganib na pagkilos at kapalaluan, ngunit inilalahad sa talababa ang mas literal na posibilidad upang mapanatili ang tunay na kalabuan.
translation_notes:
  register: Modernong Filipino na dignified at madaling maunawaan. Ginamit ang “kapalaluan” para sa pormal ngunit pamilyar na biblikal na tono; pinanatili sa talababa ang sintaktiko at semantikong kalabuan ng Hebreo.
