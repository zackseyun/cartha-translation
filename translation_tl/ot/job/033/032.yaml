translation:
  language: tl
  text: Kung mayroon kang sasabihin, sagutin mo ako; magsalita ka, sapagkat nais kong patunayang nasa tama ka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ipagtanggol ka” o “ipahayag na nasa tama ka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם יֵשׁ מִלִּין
  choice: Kung mayroon kang sasabihin
  rationale: Ang literal na “kung may mga salita” ay hindi likas sa modernong Tagalog. Napananatili ng “mayroon kang sasabihin” ang kondisyong paanyaya at ang diwa ng pagkakaroon ng maihaharap na tugon.
- source_word: הֲשִׁיבֵנִי
  choice: sagutin mo ako
  rationale: Tuwiran at likas na katumbas ng pautos na nangangahulugang sumagot o tumugon.
- source_word: דַּבֵּר
  choice: magsalita ka
  rationale: Pinananatili ang hiwalay at mariing pautos ng Hebreo.
- source_word: כִּי חָפַצְתִּי
  choice: sapagkat nais kong
  rationale: Ipinahahayag ang dahilan at taimtim na hangarin ni Elihu sa natural ngunit marangal na Tagalog.
- source_word: צַדְּקֶךָ
  choice: patunayang nasa tama ka
  rationale: 'Ipinahahayag ang pandiwang diwa ng צדק sa konteksto: nais ni Elihu na maipakitang tama ang panig ni Job. Iniiwasan nito ang posibleng di-sinasadyang teknikal na kahulugan ng “ariing-ganap” o “ipawalang-sala.”'
theological_decisions:
- issue: Kahulugan ng צַדְּקֶךָ mula sa צדק
  choice: patunayang nasa tama ka
  alternative: ipagtanggol ang iyong katuwiran; ipahayag na tama ka
  rationale: Hindi ito tahasang pahayag tungkol sa doktrina ng pag-aaring-ganap sa harap ng Diyos. Sinasabi ni Elihu na nais niyang makitang tama si Job kung makasasagot ito. Pinananatili sa talababa ang maaaring diin sa pagtatanggol o pagpapahayag na tama ang isang tao.
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran, marangal, at madaling maunawaan. Ginamit ang “mayroon kang sasabihin” sa halip na literal na “may mga salita” upang maging likas ang pananalita, habang pinanatili ang dalawang magkasunod na pautos at ang hindi teknikal na diwa ng צדק.
