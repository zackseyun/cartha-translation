  yaml_path: translation/ot/job/033/014.yaml
  text: For God speaks in one way[a], and in two, though one does not perceive it.
translation:
  language: tl
  text: Sapagkat nagsasalita ang Diyos sa isang paraan,[a] at sa dalawang paraan, ngunit hindi ito napapansin ng tao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Sapagkat isang beses nagsasalita ang Diyos, at dalawang beses, ngunit hindi ito napapansin ng tao.” Ang mga bilang sa Hebreo ay maaaring tumukoy sa dalas (“isang beses … dalawang beses”) o sa paraan (“sa isang paraan … sa dalawang paraan”).
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Pinananatili ang paliwanag o sanhi na ipinahihiwatig ng pangatnig sa konteksto ng pangangatwiran ni Elihu.
- source_word: בְאַחַת ... וּבִשְׁתַּיִם
  choice: sa isang paraan ... at sa dalawang paraan
  rationale: 'Pinananatili ang magkatambal na mga bilang at ipinahahayag ang posibleng diwang tumutukoy sa paraan ng pakikipag-usap. Inilalagay sa talababa ang lehitimong pagbasa na tumutukoy sa dalas: “minsan ... makalawa.”'
- source_word: יְדַבֶּר
  choice: nagsasalita
  rationale: Ang anyong di-ganap ay inuunawa bilang pangkalahatan o nakagawiang kilos; natural itong naipahahayag sa kasalukuyang panahunan sa Filipino.
- source_word: אֵל
  choice: Diyos
  rationale: Tuwirang salin ng karaniwang banal na titulong El sa kontekstong ito, nang walang idinadagdag na ibang katangian.
- source_word: לֹא יְשׁוּרֶנָּה
  choice: hindi ito napapansin ng tao
  rationale: Ang שׁור ay maaaring mangahulugang tumingin, makakita, o makapansin. Ang “napapansin” ay angkop sa kabiguang makilala ang pakikipag-usap ng Diyos; ginagawang lantad ng “ng tao” ang di-binanggit ngunit pangkalahatang paksa ng pandiwa.
theological_decisions:
- issue: Ang di-binanggit na paksa sa huling sugnay
  choice: pangkalahatang tao, isinaling “ng tao”
  alternative: “hindi niya ito napapansin”
  rationale: Ang pandiwa ay ikatlong panauhang panlalaking isahan ngunit walang tahasang paksa. Ang “ng tao” ay malinaw at likas sa Filipino habang pinananatili ang pangkalahatang pagtukoy sa sinumang tao.
- issue: Kung ang mga bilang ay tumutukoy sa paraan o sa dalas
  choice: paraan sa pangunahing teksto
  alternative: “minsan ... makalawa”
  rationale: Parehong posible sa Hebreo. Ang pangunahing teksto ay sumusunod sa idiomatikong pagbasa tungkol sa iba’t ibang paraan ng pagsasalita ng Diyos, samantalang tahasang pinananatili sa talababa ang pagbasa tungkol sa paulit-ulit na pagkakataon.
translation_notes:
  register: Makabago at marangal na Filipino, na may payak na bokabularyong madaling maunawaan. Pinanatili ang bahagyang di-karaniwang pag-uulit ng “isang paraan… dalawang paraan” upang hindi ikubli ang estrukturang patula at tunay na kalabuan ng Hebreo.
