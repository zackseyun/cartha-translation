  naturalness: 'May ligtas na pagpapakinis sa alternatibong salin sa talababa: mas natural at kasalukuyang Filipino ang ''isang beses ... dalawang beses'' kaysa ''minsan ... makalawa.'' Ang pangunahing teksto ay nananatiling marangal at nauunawaan; ang bahagyang literal na ''sa isang paraan ... sa dalawang paraan'' ay katanggap-tanggap dahil sinasadya nitong ilantad ang paralelismong Hebreo.'
