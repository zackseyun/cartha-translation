  terminology: Ang “Diyos,” “mas dakila,” at “tao” ay angkop at matapat sa אֱלוֹהַ, יִרְבֶּה, at אֱנוֹשׁ. Hindi dapat palitan ang “tao” ng mas tiyak na “mortal” sa pangunahing teksto, sapagkat ang huli ay isang leksikal na posibilidad na mabuting ilagay sa talababa.
