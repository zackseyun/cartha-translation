  yaml_path: translation/ot/job/033/012.yaml
  text: Look[a], in this you are not right; I will answer you, for God is greater than man.
translation:
  language: tl
  text: Tingnan mo, hindi ka tama sa bagay na ito; sasagutin kita, sapagkat mas dakila ang Diyos kaysa sa tao[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “isang mortal.” Madalas na binibigyang-diin ng salitang Hebreo na אֱנוֹשׁ ang pagiging marupok at mortal ng tao.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶן
  choice: Narito
  rationale: Pantawag-pansin itong kataga na nagbibigay-diin sa kasunod na pahayag. Ang “Narito” ay marangal at malinaw sa makabagong Tagalog nang hindi dinaragdagan ang diwa.
- source_word: זֹאת
  choice: sa bagay na ito
  rationale: Tumutukoy ang panghalip sa usaping pinag-uusapan, kaya mas malinaw ang “sa bagay na ito” kaysa sa payak na “ito.”
- source_word: לֹא צָדַקְתָּ
  choice: hindi ka tama
  rationale: Sa konteksto, ang pandiwa ay tungkol sa pagiging nasa tama sa isang argumento, hindi isang malawak na pahayag tungkol sa moral na katuwiran.
- source_word: אֶעֱנֶךָּ
  choice: sasagutin kita
  rationale: Ang anyong imperfect na may hulaping ikalawang panauhang panlalaki ay natural na tumutukoy sa isasagot ni Elihu kay Job.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala ng pangatnig ang dahilan ng sagot ni Elihu. Tahasang pinananatili ng “sapagkat” ang ugnayang sanhi.
- source_word: יִרְבֶּה
  choice: mas dakila
  rationale: Kasama ng מִן, naghahayag ito ng paghahambing at pagiging higit, hindi ng pagdami sa bilang. Likas sa Tagalog ang “mas dakila.”
- source_word: אֱלוֹהַ
  choice: Diyos
  rationale: Ang isahang titulong banal ay tuwirang tumutukoy sa Diyos.
- source_word: מֵאֱנוֹשׁ
  choice: kaysa sa tao
  rationale: Pinananatili ng “tao” ang isahang panlahatang paghahambing sa Diyos, habang ang talababa ay nagsasaad ng diin ng salitang Hebreo sa pagiging mortal at marupok ng tao.
theological_decisions:
- issue: Pagpapakahulugan sa katawagang pantao na אֱנוֹשׁ
  choice: tao
  alternative: isang mortal
  rationale: Isahang panlahatan ang anyong Hebreo at inihahambing ang Diyos sa marupok na sangkatauhan. Ang “tao” ang pinakadirektang katumbas sa Tagalog, samantalang pinananatili sa talababa ang posibleng diin sa pagiging mortal.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang semicolon upang mapanatili ang mahigpit na ugnayan ng pagsaway at ng kasunod na sagot, at ang “sapagkat” upang hayagang katawanin ang paliwanag na ipinakikilala ng כִּי.
