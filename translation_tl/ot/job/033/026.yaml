  to: Dumadalangin siya sa Diyos[a], at tinatanggap siya ng Diyos; nakikita niya ang mukha ng Diyos[b] nang may sigaw ng kagalakan, at ibinabalik ng Diyos sa tao ang kanyang katuwiran[c].
  rationale: Pinalitan ang di-natural na “mukha nito” ng “mukha ng Diyos” upang maging malinaw at angkop ang pagtukoy sa Filipino. Pinanatili ng talababa ang katotohanang panghalip lamang ang nasa Hebreo, kaya hindi itinatanggi ang tekstuwal na kaiklian. Inayos din ang pariralang nagsasaad ng masayang sigaw upang mas malinaw na inilalarawan nito ang pagkakita ng tao.
