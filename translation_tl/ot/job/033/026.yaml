base_translation:
  language: en
  yaml_path: translation/ot/job/033/026.yaml
  text: He prays to God[a], and he accepts him; he sees his face with a shout of joy[c][b], and he restores to man his righteousness.
translation:
  language: tl
  text: Dumadalangin siya sa Diyos[a], at tinatanggap siya ng Diyos; nakikita niya ang mukha ng Diyos[b] nang may sigaw ng kagalakan, at ibinabalik ng Diyos sa tao ang kanyang katuwiran[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nagsusumamo siya sa Diyos.” Maaaring idiin ng pandiwang Hebreo ang taimtim na pakiusap sa panalangin.
    reason: lexical_alternative
  - marker: b
    text: Ibig sabihin, nakikita niya ang mukha ng Diyos; “ang mukha niya” lamang ang literal na sinasabi sa Hebreo.
    reason: alternative_reading
  - marker: c
    text: O “ang kanyang vindikasyon” o “ang kanyang wastong katayuan.” Maaaring tumukoy ang salitang Hebreo para sa “katuwiran” sa katayuang muling itinuwid sa harap ng Diyos.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֶעְתַּר
  choice: Dumadalangin
  rationale: Ang pandiwang עתר ay tumutukoy sa taimtim na pananalangin o pagsusumamo. Natural sa modernong Filipino ang “dumadalangin,” habang pinananatili sa talababa ang mas mariing diwang “nagsusumamo.”
- source_word: אֱלוֹהַּ
  choice: Diyos
  rationale: Ito ang tuwirang katumbas ng pang-isahang katawagang patula para sa Diyos; walang batayan dito upang idagdag ang “Makapangyarihan sa lahat.”
- source_word: וַיִּרְצֵהוּ
  choice: tinatanggap siya ng Diyos
  rationale: Ang רצה ay nagsasaad ng magiliw o kanais-nais na pagtanggap. Inulit ang “Diyos” upang malinaw ang salit-salit na paksa at layon ng mga panghalip sa Filipino.
- source_word: וַיַּרְא פָּנָיו
  choice: nakikita niya ang mukha nito
  rationale: Pinakamalamang na ang tao ang nakakakita sa mukha ng Diyos. Ang “nito” ay nagpapanatili sa panghalip ng Hebreo, samantalang nililinaw ng talababa ang tinutukoy nito.
- source_word: בִּתְרוּעָה
  choice: na may sigaw ng kagalakan
  rationale: Ang תְּרוּעָה ay isang malakas na sigaw, kadalasan ay masaya o matagumpay; kaya pinananatili kapuwa ang tinig at kagalakan.
- source_word: וַיָּשֶׁב
  choice: ibinabalik
  rationale: Ang anyong causative ng שוב dito ay nangangahulugang ipanumbalik o ibalik ang isang bagay sa tao.
- source_word: לֶאֱנוֹשׁ
  choice: sa tao
  rationale: Ang אֱנוֹשׁ ay tumutukoy sa mortal na tao o sangkatauhan. Ang “sa tao” ay natural at may dignidad sa kontekstong patula.
- source_word: צִדְקָתוֹ
  choice: ang kanyang katuwiran
  rationale: Ang “katuwiran” ang tuwirang katumbas ng צְדָקָה at pinananatili ang lawak ng kahulugan nito, kabilang ang wastong katayuan o vindikasyon, nang hindi nagpapasok ng isang tiyak na sistematikong doktrina.
theological_decisions:
- issue: Tinutukoy ng mga panghalip sa “tinatanggap siya; nakikita niya ang mukha nito”
  choice: Tinatanggap ng Diyos ang taong nananalangin, at nakikita ng tao ang mukha ng Diyos.
  alternative: Maaaring unawain sa antas ng balarila na Diyos ang nakakakita sa mukha ng tao, bagaman hindi ito gaanong angkop sa daloy at idyoma.
  rationale: Inilalarawan ng konteksto ang taong lumalapit sa Diyos at muling nagtatamo ng banal na lingap. Ang pagkakita sa mukha ng Diyos ay likas na larawan ng panunumbalik ng ugnayan, ngunit nililinaw sa talababa ang antecedent na hindi tahasang inuulit sa Hebreo.
- issue: Kahulugan ng “kanyang katuwiran”
  choice: Ang katuwiran o wastong katayuan ng tao ang ibinabalik sa kanya.
  alternative: Maaaring tumukoy ito sa kanyang vindikasyon; hindi rin tahasang nilulutas ng parirala ang mas malawak na teolohikal na tanong tungkol sa pinagmumulan ng katuwirang iyon.
  rationale: Pinakamalapit na tumutukoy sa tao ang hulaping panghalip. Pinananatili ng “kanyang katuwiran” ang mismong pananalita at tensiyong teolohikal nang hindi ipinipilit ang isang partikular na doktrina.
translation_notes:
  register: Modernong Filipino na may dignidad at bahagyang patulang daloy. Inulit ang “Diyos” sa dalawang sugnay upang maiwasan ang malabong salit-salit na panghalip sa Filipino, ngunit pinanatili ang “mukha nito” upang hindi lubusang burahin ang pagiging maigsi at bahagyang malabo ng Hebreo. Lahat ng talababa ay minarkahan sa pangunahing teksto.
