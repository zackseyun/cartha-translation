    rationale: Kapag direktang sumusunod sa “mukha ng Diyos,” maaari itong pansamantalang mabasa na naglalarawan sa mukha. Ang “nang may sigaw ng kagalakan” ay mas malinaw na paraan upang ilarawan ang paraan ng pagkakita.
