    rationale: Sa modernong Filipino, ang “nito” ay karaniwang di-pantao at demonstratibo ang dating. Hindi nito pinananatili ang kapaki-pakinabang na Hebreong kalabuan; sa halip, nagdudulot ito ng di-natural at posibleng nakalilitong pagtukoy. Maaaring pangalanan ang Diyos sa teksto at ipaliwanag sa talababa na “mukha niya” lamang ang Hebreo.
  - severity: low
