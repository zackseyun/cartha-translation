  source_fidelity: 'Tumpak ang pangunahing pag-unawa sa mga pandiwa at mga salit-salit na tinutukoy: ang tao ay taimtim na nananalangin sa Diyos, malugod siyang tinatanggap ng Diyos, nakikita ng tao ang mukha ng Diyos, at ibinabalik ng Diyos sa tao ang kanyang katuwiran. Gayunman, ang “mukha nito” ay hindi angkop na pantukoy sa Diyos sa Filipino at lumilikha ng hindi kinakailangang problema sa referent; maaaring linawin sa pangunahing teksto ang Diyos habang pinananatili sa talababa na panghalip lamang ang nasa Hebreo.'
  naturalness: Ang “mukha nito” ay hindi natural at maaaring magmukhang di-personal o walang paggalang kapag ang tinutukoy ay Diyos. Mas natural at malinaw ang “mukha ng Diyos.” Ang “nang may sigaw ng kagalakan” ay mas maayos na ikinakabit sa kilos ng pagkakita kaysa sa “mukha.”
  terminology: Ang “Diyos,” “dumadalangin,” at “katuwiran” ay angkop sa modernong Filipino Tagalog at maingat na pinananatili ang saklaw ng Hebreong צִדְקָתוֹ. Ang “vindikasyon” sa talababa ay katanggap-tanggap na terminong pampanitikan/pang-iskolar, na sinasamahan ng mas karaniwang “wastong katayuan.”
