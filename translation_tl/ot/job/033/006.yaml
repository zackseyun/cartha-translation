  text: הֵן אֲנִ֣י כְ/פִ֣י/ךָ לָ/אֵ֑ל מֵ֝/חֹ֗מֶר קֹרַ֥צְתִּי גַם אָֽנִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/033/006.yaml
  text: Look[a], I am like your mouthpiece before God[b]; I too was pinched off from clay.
translation:
  language: tl
  text: Narito[a], ako'y parang bibig mo sa harap ng Diyos[b]; ako man ay kinurot mula sa luwad[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, isang mariing pantawag-pansin na maaari ring isaling “Tingnan mo.”
    reason: lexical_alternative
  - marker: b
    text: Literal na, “ako ay gaya ng iyong bibig sa Diyos.” Maaaring mangahulugan ito ng “parang tagapagsalita mo sa harap ng Diyos,” “ayon sa nais mo sa harap ng Diyos,” o marahil “kapantay mo sa harap ng Diyos.” Siksik at pinagtatalunan ang pariralang Hebreo.
    reason: alternative_reading
  - marker: c
    text: Maaari ring isaling “hinubog mula sa luwad.” Ipinahihiwatig ng pandiwang Hebreo ang pagkurot o paghubog mula sa luwad.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Narito
  rationale: Pantawag-pansin na may diin; marangal at malinaw sa makabagong Filipino nang hindi lubhang lipas.
- source_word: כְפִיךָ לָאֵל
  choice: gaya ng bibig mo sa harap ng Diyos
  rationale: Pinananatili ang siksik at tunay na malabong larawan ng Hebreo, na literal na ‘gaya ng bibig mo sa/para sa Diyos,’ sa halip na tahasang ipasya na ‘tagapagsalita,’ ‘ayon sa nais mo,’ o ‘kapantay mo.’
- source_word: מֵחֹמֶר
  choice: mula sa luwad
  rationale: Ang חֹמֶר ay luwad o materyal na putik; ang ‘luwad’ ay angkop sa larawan ng pagkakahubog at sa magkatulad na pagiging nilalang nina Elihu at Job.
- source_word: קֹרַצְתִּי
  choice: kinurot mula
  rationale: Pinananatili ang kongkretong pandamang larawan ng pagkurot o pagpisil ng bahagi mula sa luwad, bagaman maaari rin itong unawaing mas pangkalahatang ‘hinubog.’
- source_word: גַם אֲנִי
  choice: ako man
  rationale: Likas na Filipino na nagpapakita ng diin sa pagkakatulad ni Elihu kay Job bilang tao.
theological_decisions:
- issue: Ang kaugnayan ni Elihu kay Job sa harap ng Diyos
  choice: Pinanatili sa teksto ang literal at malabong ‘gaya ng bibig mo sa harap ng Diyos.’
  alternative: ‘Ako ang iyong tagapagsalita sa harap ng Diyos,’ ‘ako ay ayon sa nais mo sa harap ng Diyos,’ o ‘ako ay kapantay mo sa harap ng Diyos.’
  rationale: Hindi ganap na nilulutas ng maikling pariralang Hebreo ang papel na inaangkin ni Elihu. Nililinaw ng ikalawang sugnay ang kanilang magkatulad na pagiging nilalang, ngunit hindi nito sapilitang pinatutunayan ang isang tiyak na kahulugang mediatoryo.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Sadyang pinanatili sa pangunahing teksto ang kakaiba at malabong metapora ng Hebreo; ang mga posibleng pakahulugan ay inilagay sa talababa. Ginamit ang ‘kinurot’ upang mapanatili ang pisikal na larawan, habang ibinigay ang mas likas na ‘hinubog’ bilang alternatibo.
