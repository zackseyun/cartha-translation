  text: בַּ/חֲל֤וֹם חֶזְי֬וֹן לַ֗יְלָה בִּ/נְפֹ֣ל תַּ֭רְדֵּמָה עַל אֲנָשִׁ֑ים בִּ֝/תְנוּמ֗וֹת עֲלֵ֣י מִשְׁכָּֽב׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/033/015.yaml
  text: In a dream[a], a vision of the night, when deep sleep falls on men, in slumbers on the bed,
translation:
  language: tl
  text: Sa panaginip, sa pangitain sa gabi, kapag dumarating ang mahimbing na tulog sa mga tao, sa mga sandali ng pag-idlip sa higaan,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּחֲלוֹם
  choice: Sa panaginip
  rationale: Likas na Tagalog para sa kalagayan o paraan kung saan dumarating ang pahayag; pinananatili rin ang pagtutumbas nito sa kasunod na “pangitain.”
- source_word: חֶזְיוֹן לַיְלָה
  choice: sa pangitain sa gabi
  rationale: Malapit sa literal na “pangitain ng gabi,” ngunit mas natural sa modernong Tagalog at hindi nilulutas kung ang gabi ay panahon o katangian ng pangitain.
- source_word: בִּנְפֹל
  choice: kapag nahuhulog
  rationale: Ang infinitive na may בְּ ay temporal; ang “kapag” ay malinaw, samantalang pinananatili ng “nahuhulog” ang larawang nasa Hebreo.
- source_word: תַּרְדֵּמָה
  choice: mahimbing na tulog
  rationale: Ipinahahayag ang napakalalim na pagtulog nang hindi ito binibigyang-kahulugang kawalan ng malay o ekstasis.
- source_word: עַל אֲנָשִׁים
  choice: ang mga tao
  rationale: Ang אֲנָשִׁים ay panlalaking anyo ngunit pangkalahatan ang tinutukoy sa konteksto. Sa Tagalog, natural at tumpak ang “mga tao,” yamang walang katumbas na pangkalahatang panlalaking katawagan na kapantay ng English “men.”
- source_word: בִּתְנוּמוֹת
  choice: habang umiidlip
  rationale: Natural na ipinapahayag ang kalagayan ng pagkakaidlip. Hindi likas sa Tagalog ang literal na maramihang “mga pag-idlip,” kaya hindi ipinilit ang bilang.
- source_word: עֲלֵי מִשְׁכָּב
  choice: sa higaan
  rationale: Tumutugma sa literal na kinaroroonan. Ang “higaan” ay mas malawak at mas malapit sa מִשְׁכָּב kaysa sa mas tiyak na “kama.”
theological_decisions:
- issue: Pangkalahatang saklaw ng אֲנָשִׁים
  choice: mga tao
  alternative: mga lalaki
  rationale: Bagaman panlalaking maramihan ang anyong Hebreo, pangkalahatan ang gamit nito rito. Ang “mga lalaki” sa modernong Tagalog ay maling magpapakitid sa kahulugan sa mga lalaking tao lamang.
translation_notes:
  register: Makata ngunit malinaw na modernong Filipino Tagalog. Pinanatili ang magkahanay na “panaginip / pangitain sa gabi” at ang larawan ng pagkahulog sa mahimbing na tulog. Ang talata ay bahagi ng pangungusap na nagpapatuloy sa kasunod na bersikulo, kaya nagtatapos sa kuwit.
