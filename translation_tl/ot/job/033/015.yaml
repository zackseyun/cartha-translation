  naturalness: Natural ang “Sa panaginip, sa pangitain sa gabi.” Mas malinaw at mas likas ang “kapag dumarating ang mahimbing na tulog sa mga tao.” Ang “sa mga sandali ng pag-idlip sa higaan” ay makata ngunit malinaw, at pinananatili ang pangmaramihang/paulit-ulit na dating ng תְּנוּמוֹת nang hindi gumagamit ng di-likas na “mga pag-idlip.”
  terminology: 'Ang “mga tao” ay wastong modernong Tagalog para sa pangkalahatang אֲנָשִׁים; hindi kailangang gumamit ng “mga lalaki,” na magiging mas makitid ang kahulugan. Ang “mahimbing na tulog” ay angkop para sa תַּרְדֵּמָה. Walang kinakailangang talababa: hindi minamarkahan ng kasarian ang “mga tao” sa Tagalog, kaya hindi kapaki-pakinabang ang footnote ng Ingles para sa target na wika.'
