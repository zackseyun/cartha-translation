  text: He puts my feet in the stocks[a]; he watches all my paths.
translation:
  language: tl
  text: 'Inilalagay niya ang mga paa ko sa pangawan;

    binabantayan niya ang lahat ng landas ko.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “iniingatan niya ang lahat ng landas ko.” Ang pandiwang Hebreo ay maaaring mangahulugang “bantayan” o “ingatan”; sa kontekstong ito, mas malamang na masusing pagsubaybay ang diwa kaysa mapagkalingang proteksiyon.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשֵׂם
  choice: Inilalagay
  rationale: Ang שׂים ay karaniwang nangangahulugang ilagay o ipuwesto. Natural sa modernong Tagalog ang “inilalagay” at pinananatili nito ang kongkretong larawan.
- source_word: בַּסַּד
  choice: sa pangawan
  rationale: Ang סַד ay isang kasangkapang pumipigil sa mga paa. Ang “pangawan” ang tiyak na katawagang Tagalog para sa ganitong kasangkapang pangbilanggo at pinananatili ang maparusang larawan.
- source_word: רַגְלָי
  choice: ang mga paa ko
  rationale: Ang anyong may hulaping unang panauhan ay tumutukoy sa mga paa ng nagsasalita; malinaw at natural ito sa Tagalog.
- source_word: יִשְׁמֹר
  choice: binabantayan
  rationale: Maaaring mangahulugan ang שׁמר ng bantayan, ingatan, o masusing obserbahan. Sa konteksto ng reklamo ni Job na para siyang itinuturing na kaaway, ang “binabantayan” ay nagpapahiwatig ng masusing pagmamatyag nang hindi tahasang nagdaragdag ng motibong wala sa salita.
- source_word: כָּל
  choice: ang lahat ng
  rationale: Tuwirang ipinapahayag nito ang kabuuang saklaw ng Hebreong quantifier.
- source_word: אָרְחֹתָי
  choice: landas ko
  rationale: Pinananatili ng “landas” ang metapora ng אֹרַח para sa mga hakbang o takbo ng buhay ng nagsasalita.
theological_decisions:
- issue: Kung ang ikalawang sugnay ay naglalarawan ng mapagkalingang pag-iingat o mapanuring pagbabantay ng Diyos
  choice: “binabantayan niya ang lahat ng landas ko,” na sa konteksto ay maaaring magpahiwatig ng masusing pagsubaybay
  alternative: “iniingatan niya ang lahat ng landas ko,” na maaaring magpahiwatig ng mapagkalingang proteksiyon
  rationale: Saklaw ng שׁמר ang parehong pagbabantay at pag-iingat. Dahil inuulit ni Elihu ang reklamo ni Job tungkol sa pagtrato sa kaniya bilang kaaway at sa pagpigil sa kaniyang mga paa, mas angkop sa konteksto ang pagbabantay bilang mapanuring pagsubaybay. Gayunman, pinananatili sa talababa ang tunay na leksikal na posibilidad ng pag-iingat.
translation_notes:
  register: Modernong, marangal, at madaling sundang Filipino. Ginamit ang “pangawan” dahil ito ang tiyak na katawagan sa kasangkapang pumipigil sa mga paa; ang estruktura ng dalawang magkatimbang na sugnay ay pinanatili. Inilagay ang talababa pagkatapos ng ikalawang sugnay sapagkat tumutukoy ito sa kahulugan ng יִשְׁמֹר.
