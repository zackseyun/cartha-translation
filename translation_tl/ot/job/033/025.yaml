  text: Mas magiging sariwa ang kanyang laman kaysa noong kabataan niya[a]; babalik siya sa mga araw ng kanyang kabataan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “magiging kasingsariwa ng laman ng isang bata ang kanyang laman,” o “magiging mas sariwa ang kanyang laman kaysa sa laman ng isang kabataan.” Bihira ang pandiwang Hebreo, at maaaring unawain sa bahagyang magkakaibang paraan ang paghahambing sa kabataan.
