  text: Kung wala kang sasabihin, makinig ka sa akin; manahimik ka, at ituturo ko sa iyo ang karunungan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִם אַיִן
  choice: Ngunit kung wala kang sasabihin
  rationale: Sa kaugnay na paanyaya sa naunang talata na magsalita si Job, ang maikling Hebreong kondisyon ay likas na tumutukoy sa kawalan ng maisasagot. Nilinaw ito sa Filipino upang maging buo at natural ang pangungusap nang hindi binabago ang kondisyon.
- source_word: שְׁמַע לִי
  choice: makinig ka sa akin
  rationale: Ang שׁמע na may ל ay humihingi ng sadyang pakikinig sa nagsasalita; ito ang pinakanatural na modernong Filipino.
- source_word: הַחֲרֵשׁ
  choice: manahimik ka
  rationale: Ang pautos na anyo ng חרש ay nananawagan ng katahimikan. Ang “manahimik ka” ay tuwiran, marangal, at natural.
- source_word: וַאֲאַלֶּפְךָ
  choice: at tuturuan kita
  rationale: Ang piel ng אלף ay nangangahulugang magturo o magbigay-aral. Ang pandiwang nasa aspektong di-ganap pagkatapos ng mga utos ay angkop isalin bilang kasunod na pangako.
- source_word: חָכְמָה
  choice: maging marunong
  rationale: Bagaman ang חָכְמָה ay literal na “karunungan,” ang konstruksyong “turuan ka ng karunungan” ay di-gaanong natural sa Filipino. Ang “tuturuan kitang maging marunong” ay malinaw na naghahatid ng nilalayong resulta habang pinananatili ang tema ng karunungan.
