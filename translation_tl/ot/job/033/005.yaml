  rationale: Natural na katumbas ng pariralang nagsasaad ng pagharap sa nagsasalita.
- source_word: הִתְיַצָּבָה
  choice: tumindig ka
  rationale: Pinananatili ang matatag at mapanghamong diwa ng Hitpael imperative ng יצב—ang pumuwesto o tumayo nang handang humarap.
