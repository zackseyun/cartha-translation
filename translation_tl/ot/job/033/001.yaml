  text: But now[a], Job, please hear my words, and listen to all my speech.
translation:
  language: tl
  text: Ngunit ngayon, Job, pakinggan mo, pakiusap, ang aking mga salita; makinig kang mabuti sa lahat ng aking sinasabi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאוּלָם
  choice: Ngunit ngayon
  rationale: Minamarkahan nito ang malinaw na paglipat sa pananalita ni Elihu; likas sa modernong Tagalog at pinananatili ang bahagyang pagsalungat at pansaling diwa.
- source_word: שְׁמַע נָא
  choice: pakinggan mo sana
  rationale: Ang pautos na שׁמע ay tumutukoy sa pakikinig, at ang נָא ay magalang na nagpapalambot sa pakiusap; likas na katumbas nito ang “sana” sa pangungusap.
- source_word: אִיּוֹב
  choice: Job
  rationale: Ginamit ang nakasanayang anyo ng pangalan sa Tagalog na Bibliya.
- source_word: מִלָּי
  choice: aking mga salita
  rationale: Tuwirang ipinapakita ang pangmaramihang pangngalan at hulaping unang panauhang isahan.
- source_word: וְכָל דְּבָרַי
  choice: at ... ang lahat ng aking sinasabi
  rationale: Pinananatili ang saklaw ng כָּל at ang halos magkasingkahulugang pag-uulit, ngunit iniiwasan ang matigas na “lahat ng aking mga salita.”
- source_word: הַאֲזִינָה
  choice: dinggin mo
  rationale: Ibinubukod ito sa unang pandiwa upang mapanatili ang paralelismo ng dalawang pandiwa ng pakikinig; ang “dinggin” ay dignified ngunit nauunawaan pa rin sa modernong Tagalog.
