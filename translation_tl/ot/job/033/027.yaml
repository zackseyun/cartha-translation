  text: He sings before men and says, ‘I have sinned and twisted what was right, and it was not repaid to me.’
translation:
  language: tl
  text: 'Umaawit[a] siya sa harap ng mga tao at sinasabi,


    “Nagkasala ako at binaluktot ko ang matuwid,

    ngunit hindi ako ginantihan ayon sa ginawa ko.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, Tinitingnan niya ang mga tao.
    reason: Ang bihirang pandiwang Hebreo ay maaaring unawain bilang “umaawit” o “tumitingin.”
  - marker: b
    text: O, ngunit hindi ito naging kapaki-pakinabang sa akin; maaari ring isalin, ngunit hindi ko natanggap ang nararapat sa akin.
    reason: Maaaring tumukoy ang Hebreong parirala sa kawalan ng pakinabang o sa hindi pagtanggap ng katumbas na ganti.
lexical_decisions:
- source_word: יָשֹׁר
  choice: Umaawit
  rationale: Ipinapahayag ang pandiwa bilang pag-awit sa harap ng iba, alinsunod sa posibleng kahulugan ng bihirang anyo at sa konteksto ng hayagang pagpapatotoo; inilagay sa talababa ang isa pang pangunahing pagbasa.
- source_word: יָשָׁר
  choice: ang matuwid
  rationale: Pinananatili ang moral na diwa ng ‘tuwid’ o ‘tama’ at ang paglalaro ng tunog sa naunang pandiwa hangga't natural sa Tagalog.
- source_word: הֶעֱוֵיתִי
  choice: binaluktot ko
  rationale: Tuwirang inilalarawan ang pagpapalihis o pagbaluktot sa kung ano ang matuwid.
- source_word: וְלֹא שָׁוָה לִי
  choice: ngunit hindi iyon iginanti sa akin
  rationale: Ipinapakita ang kontekstuwal na diwang hindi natanggap ng nagsasalita ang katumbas na ganti sa kanyang kasalanan, habang kinikilala sa talababa ang leksikal na ambiguwidad.
theological_decisions:
- issue: Kung ang huling sugnay ay tumutukoy sa awa o sa kawalan ng pakinabang ng kasalanan
  choice: Hindi iyon iginanti sa akin
  alternative: Hindi iyon naging kapaki-pakinabang sa akin
  rationale: Mas angkop sa kalapit na konteksto ng pagliligtas sa makasalanan ang diwang hindi siya ginantihan ayon sa kanyang ginawa, ngunit hindi isinasara ang alternatibong kahulugan ng Hebreo.
translation_notes:
  register: Makabago ngunit marangal na Filipino; pinanatili ang anyong patula at ang tuwirang pag-amin. Ginamit ang ‘matuwid’ sa halip na mas kolokyal na ‘tama’ upang mapanatili ang moral at patulang bigat ng Hebreo.
