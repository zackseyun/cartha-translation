    issue: Hindi idiomatiko at malabo ang “ngunit hindi iyon iginanti sa akin.”
    rationale: Hindi malinaw kung ano ang tinutukoy ng “iyon,” at ang “iginanti sa akin” ay maaaring marinig bilang paghihiganti para sa isang bagay sa halip na hindi pagpaparusa o pagganti ayon sa ginawa ng nagsasalita. Ang “hindi ako ginantihan ayon sa ginawa ko” ay nagbibigay ng parehong kontekstuwal na diwa nang mas malinaw.
  - severity: low
    issue: Ang pandiwang “nagsasabi” ay maaaring gawing “sinasabi” para sa mas maayos na kasabay na paglalarawan.
    rationale: Mas natural ang “Umaawit siya ... at sinasabi” bilang magkatuwang na paglalarawan sa kilos ng tauhan.
