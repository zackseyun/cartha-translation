  source_fidelity: 'Ang pangunahing diwa ay tapat sa Hebreo at sa English POB audit trail: hayagang pag-amin ng kasalanan, pagbaluktot sa matuwid, at hindi pagganti sa nagsasalita ayon sa ginawa niya. Gayunman, ang “hindi iyon iginanti sa akin” ay hindi natural at malabo ang tinutukoy na “iyon.” Ang “hindi ako ginantihan ayon sa ginawa ko” ay mas malinaw na naghahatid ng diwa ng וְלֹא שָׁוָה לִי nang hindi nagpapataw ng mas tiyak na doktrinal na paliwanag.'
  naturalness: Natural at marangal ang “Umaawit siya sa harap ng mga tao,” ngunit mas maayos ang paralelismo sa “at sinasabi.” Ang binagong huling linya ay mas idiomatiko sa modernong Filipino at malinaw na nananatiling tinig ng nagsisising nagsasalita.
  terminology: Ang “matuwid” at “binaluktot ko” ay angkop, malinaw, at may moral na bigat na katapat ng יָשָׁר at הֶעֱוֵיתִי. Pinanatili ang “umaawit” para sa pangunahing pagbasa ng יָשֹׁר, na may talababa para sa alternatibong pagbasa.
