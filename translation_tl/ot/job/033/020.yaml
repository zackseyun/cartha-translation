translation:
  language: tl
  text: Kaya ang kanyang buhay[a] ay nasusuklam sa tinapay, at ang kanyang kaluluwa ay nasusuklam sa kanais-nais na pagkain.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “ang kanyang buhay”; ayon sa konteksto, maaari rin itong tumukoy sa kanyang sarili o sa kanyang sigla.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “piling pagkain”; tumutukoy ang pariralang Hebreo sa pagkaing ninanais o kaakit-akit.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזִהֲמַתּוּ
  choice: Kaya nasusuklam
  rationale: Ang pandiwa ay nagpapahayag ng matinding pagkasuya o pagkasuklam. Ang וְ ay isinaling “Kaya” upang ipakita ang bunga ng kalagayang inilalarawan sa naunang talata.
- source_word: חַיָּתוֹ
  choice: ang kanyang buong pagkatao
  rationale: Literal itong kaugnay ng “kanyang buhay,” ngunit dito ay tumutukoy sa taong nabubuhay o sa sarili niya. Pinananatili ng “buong pagkatao” ang masaklaw at patulang diwa nang hindi ito nililimitahan sa gana lamang.
- source_word: לָחֶם
  choice: tinapay
  rationale: Ito ang karaniwang kahulugan ng salita at pinananatili nito ang kongkretong larawan at ang paghahanay nito sa mas malawak na “pagkain” sa ikalawang hati.
- source_word: נַפְשׁוֹ
  choice: ang kanyang kaluluwa
  rationale: Maaaring tumukoy ang נֶפֶשׁ sa kaluluwa, buhay, sarili, o gana. Pinanatili ang “kaluluwa” upang maingatan ang patulang antropolohikal na pananalita at ang paralelismo.
- source_word: מַאֲכַל
  choice: pagkain
  rationale: Pangkalahatang tawag ito sa kinakain; “pagkain” ang likas at sapat na malawak na katumbas sa Tagalog.
- source_word: תַּאֲוָה
  choice: kanais-nais
  rationale: Tumutukoy ito sa pagnanasa o sa bagay na ninanais. Sa pariralang ito, inilalarawan nito ang pagkaing karaniwang kaakit-akit o gustong kainin.
theological_decisions: []
translation_notes:
  register: Makabago at marangal na Filipino na nagpapanatili sa patulang paralelismo. Ginamit ang “buong pagkatao” upang maging malinaw sa karaniwang mambabasa habang inilalagay sa talababa ang mas literal at iba pang posibleng kahulugan. Ang “maging” ay nagpapahiwatig na pati ang pagkaing karaniwang kanais-nais ay kinasusuklaman, ayon sa paralelismo ng Hebreo.
