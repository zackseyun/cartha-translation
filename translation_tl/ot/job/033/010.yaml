base_translation:
  language: en
  yaml_path: translation/ot/job/033/010.yaml
  text: Look[a], he finds grounds for hostility against me; he counts me as his enemy.
translation:
  language: tl
  text: “Narito[a], nakasusumpong siya ng mga dahilan upang maging laban sa akin; itinuturing niya akong kaaway niya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Tingnan ninyo” o “Tunay nga.” Ang “mga dahilan upang maging laban sa akin” ay maaari ring isaling “mga pagkontra laban sa akin,” “mga pagkakataong kalabanin ako,” o marahil “mga reklamo laban sa akin.” Bihira ang salitang Hebreo at nakadepende sa konteksto ang kahulugan nito.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Tingnan mo
  rationale: Isang pantawag-pansin na may diin; natural ito sa makabagong Filipino at hindi kasing-arkaidiko ng “Narito.”
- source_word: תְּנוּאוֹת
  choice: mga dahilan upang labanan
  rationale: Bihira at nakadepende sa konteksto ang pangngalan. Ipinahihiwatig nito ang mga dahilan o pagkakataon para sa pagkontra o pagkapoot; pinananatili ng salin ang ugnayan nito sa pandiwang “hanapin” nang hindi labis na nililinaw ang kahulugan.
- source_word: עָלַי
  choice: ako
  rationale: Sa pariralang “upang labanan ako,” naipahahayag ang adversatibong diwa ng עַל laban sa nagsasalita.
- source_word: יִמְצָא
  choice: naghahanap siya
  rationale: Ang saligang kahulugan ay “makasumpong/makahanap.” Ang aspektong di-ganap ng anyong Hebreo ay likas na naihahayag dito sa “naghahanap,” nang hindi pinatitindi tungo sa “gumagawa-gawa.”
- source_word: יַחְשְׁבֵנִי
  choice: itinuturing niya ako
  rationale: Natural at malinaw na ipinahahayag nito ang kahulugang magbilang, magpalagay, o kumilala sa isang tao bilang nasa isang tiyak na kalagayan.
- source_word: לְאוֹיֵב לוֹ
  choice: bilang kaaway niya
  rationale: Ipinahahayag ng konstruksiyon ang papel o katayuang ibinibigay sa nagsasalita; sa natural na Filipino, “kaaway niya” ang pinakamaikli at malinaw.
theological_decisions:
- issue: Pananaw ng nagsasalita tungkol sa pakikitungo ng Diyos kay Job
  choice: Iulat ang paratang na naghahanap ang Diyos ng mga dahilan upang labanan si Job at itinuturing siyang kaaway, nang hindi sinasang-ayunan ang paratang.
  alternative: “gumagawa-gawa siya ng mga paratang laban sa akin”
  rationale: Iniuulat ng talata ang reklamo ni Job ayon kay Elihu. Pinananatili ang bigat at tensiyong teolohikal nito, ngunit hindi pinatitindi ang יִמְצָא upang sabihing gumagawa ang Diyos ng huwad na paratang.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “Tingnan mo” bilang likas na pantawag-pansin at “itinuturing” bilang malinaw na katumbas ng evaluative na pandiwa. Pinanatili sa talababa ang kawalang-katiyakan ng bihirang pangngalang Hebreo.
