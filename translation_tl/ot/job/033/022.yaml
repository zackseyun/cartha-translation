  yaml_path: translation/ot/job/033/022.yaml
  text: His soul draws near to the pit[b][a], and his life to those who bring death.
translation:
  language: tl
  text: Ang kanyang sarili ay lumalapit sa hukay[a], at ang kanyang buhay sa mga nagdadala ng kamatayan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “libingan” o “kapahamakan.”
    reason: lexical_alternative
  - marker: b
    text: O “sa mga patay” o “sa mga tagapagdulot ng kamatayan”; mahirap ang ekspresyong Hebreo at maaaring tumukoy sa mga ahente ng kamatayan o sa saklaw o kapangyarihan ng kamatayan.
    reason: alternative_reading
lexical_decisions:
- source_word: וַתִּקְרַב
  choice: ay papalapit
  rationale: Mula sa קרב, “lumapit.” Ang kasalukuyang/progresibong anyo ay natural sa paglalarawang patula ng unti-unting paglapit ng naghihirap sa kamatayan.
- source_word: לַשַּׁחַת
  choice: sa hukay
  rationale: Ang שַׁחַת ay maaaring tumukoy sa hukay, libingan, o kapahamakan. Pinananatili ng “hukay” ang kongkretong talinghaga at ang pahiwatig ng kamatayan.
- source_word: נַפְשׁוֹ
  choice: ang kanyang buhay
  rationale: Sa kontekstong ito, ang נֶפֶשׁ ay tumutukoy sa buhay o mismong persona, hindi kinakailangang sa isang teknikal na di-materyal na “kaluluwa.” Natural sa Filipino ang “buhay” habang papalapit sa hukay.
- source_word: וְחַיָּתוֹ
  choice: at ang kanyang hininga
  rationale: Ang חַיָּה/חַיּוּת dito ay buhay o puwersang-buhay. Ginamit ang “hininga” bilang likas na makatang paglalarawan ng nananatiling buhay at upang mapanatili ang pagkakaiba nito sa נַפְשׁוֹ, nang hindi nagtatakda ng teknikal na antropolohiya.
- source_word: לַמְמִתִים
  choice: sa mga nagdadala ng kamatayan
  rationale: Pinananatili nito ang posibleng aktibo o causative na diwa ng anyo—“mga nagpapakamatay/nagdudulot ng kamatayan”—nang hindi ipinapalagay na mga berdugo lamang ang tinutukoy. Ang mahirap na alternatibong pagbasa ay inilagay sa talababa.
theological_decisions:
- issue: Ugnayan ng נַפְשׁוֹ at וְחַיָּתוֹ sa paralelismo
  choice: Isinalin bilang “kanyang buhay” at “kanyang hininga,” bilang magkalapit na makatang katawagan sa buhay ng tao.
  alternative: “Kanyang kaluluwa” at “kanyang buhay,” na maaaring ipakahulugan bilang mahigpit na paghahati ng kaluluwa at katawan.
  rationale: Makatang paralelismo ang talata at hindi nito tahasang itinuturo ang isang teknikal na antropolohiya. Pinananatili ng salin ang bahagyang pagkakaiba ng dalawang termino nang hindi nagpapasok ng doktrinal na pagpapasiya.
- issue: Pagkakakilanlan ng לַמְמִתִים
  choice: “mga nagdadala ng kamatayan,” na pinananatili ang posibleng ahentibong diwa.
  alternative: “mga patay” o mga kapangyarihan/saklaw ng kamatayan.
  rationale: Mahirap at pinagtatalunan ang ekspresyong Hebreo. Hindi dapat tahimik na alisin ang pagiging malabo nito, kaya malinaw na itinatala sa talababa ang mga pangunahing alternatibo.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “hukay” upang mapanatili ang konkretong talinghaga. Ang “hininga” ay patulang katumbas ng buhay o puwersang-buhay at hindi teknikal na pahayag tungkol sa sangkap ng tao. Ang mga panandang talababa [a] at [b] ay kapwa nasa pangunahing teksto.
