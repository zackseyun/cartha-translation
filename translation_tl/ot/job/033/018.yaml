  text: Inililigtas niya ang kaluluwa ng tao mula sa hukay[a], at ang buhay nito mula sa pagkamatay sa sandata.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “libingan” o “kapahamakan.”
    reason: lexical_alternative
  - marker: b
    text: Ang salitang Hebreo ay maaaring mas tiyak na tumukoy sa isang palaso, sandatang inihahagis, o marahil ay tabak; ang diwa ng linya ay ang pagkaligtas mula sa marahas na kamatayan.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַחְשֹׂךְ
  choice: Inililigtas niya
  rationale: Ang Hiphil ng חשׂך ay nangangahulugang pinipigil o iniingatan ang isang tao mula sa kapahamakan. Sa konteksto ng pag-iwas sa kamatayan, likas na ipinahahayag ng “inililigtas” ang resultang diwa nang hindi nawawala ang paghadlang.
- source_word: נַפְשׁוֹ
  choice: ang kaluluwa nito
  rationale: Maaaring tumukoy ang נֶפֶשׁ sa kaluluwa, buhay, o buong pagkatao. Pinananatili ng “kaluluwa” ang matalinghagang anyo at ang pagkakatulad ngunit hindi ganap na pagkakapareho nito sa “buhay” sa ikalawang linya.
- source_word: מִנִּי שָׁחַת
  choice: mula sa hukay
  rationale: Ang שַׁחַת ay maaaring hukay, libingan, o kapahamakan. Ang “hukay” ay kongkreto at nagpapanatili sa larawang patula ng dako ng kamatayan.
- source_word: וְחַיָּתוֹ
  choice: at ang buhay nito
  rationale: Sa konteksto, ang חַיָּה ay tumutukoy sa buhay ng tao at kapantay sa tula ng נַפְשׁוֹ.
- source_word: מֵעֲבֹר בַּשָּׁלַח
  choice: mula sa pagkamatay sa sandata
  rationale: Bagaman literal na may diwang “pagdaan” ang עבר, sa ugnayang ito sa שׁלח ang parirala ay tumutukoy sa pagsapit ng marahas na kamatayan. Ang “pagkamatay sa sandata” ay natural sa Tagalog at pinananatiling malawak ang di-tiyak na uri ng sandata.
