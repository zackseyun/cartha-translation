translation_notes:
  register: Makabago at marangal na Filipino, na may malinaw na paralelismong patula. Ginamit ang “nito” sapagkat walang tahasang naunang pangngalan sa ibinigay na talata at mas natural itong tumukoy sa taong inililigtas kaysa sa paulit-ulit na “kanyang,” na maaaring magpalabo kung kanino ang buhay.
