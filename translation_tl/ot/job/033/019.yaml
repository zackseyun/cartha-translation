  text: He is also reproved with pain on his bed[a], and with continual strife in his bones,
translation:
  language: tl
  text: Itinutuwid din siya sa pamamagitan ng sakit sa kanyang higaan, at may walang tigil na paglalaban sa kanyang mga buto.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “at may matinding paglalaban sa kanyang mga buto.” Ang salitang Hebreo ay maaaring mangahulugang “namamalagi/walang tigil” o “malakas/matindi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוּכַח
  choice: Itinutuwid din siya
  rationale: Ang Hophal ng יכח ay nagpapahiwatig na ang tao ay itinutuwid o dinidisiplina. Pinananatili ng “itinutuwid” ang diwang mapagtuwid nang hindi ipinapalagay na ang pagdurusa ay parusang paghihiganti.
- source_word: בְּמַכְאוֹב
  choice: sa pamamagitan ng kirot
  rationale: Ang מַכְאוֹב ay kongkretong sakit o pagdurusa, at ang בְּ ay maaaring instrumental. Ang “kirot” ay natural sa konteksto ng pisikal na paghihirap.
- source_word: עַל מִשְׁכָּבוֹ
  choice: habang nakahiga sa kanyang higaan
  rationale: Ipinahihiwatig ng parirala ang pagdurusa ng isang taong nakaratay; mas natural ito sa modernong Tagalog kaysa sa literal na “sa ibabaw ng kanyang higaan.”
- source_word: וְרִיב עֲצָמָיו
  choice: at … ang matinding hapdi sa kanyang mga buto
  rationale: Literal na “alitan/labanan ng kanyang mga buto,” ngunit metaporikal itong tumutukoy sa matindi at panloob na pisikal na paghihirap. Ang “hapdi sa kanyang mga buto” ay malinaw at natural habang pinananatili ang larawan ng mga buto.
- source_word: אֵתָן
  choice: walang tigil
  rationale: Maaaring mangahulugan ang אֵתָן ng namamalagi o patuloy, o kaya’y malakas/matindi. Pinili ang temporal na diwa sa teksto at inilagay sa talababa ang leksikal na alternatibo.
theological_decisions:
- issue: Ang pagdurusa bilang kilos ng Diyos na nagtutuwid
  choice: Inilalarawan ang pagdurusa bilang paraan ng pagtutuwid nang hindi ito tahasang tinatawag na kaparusahan.
  alternative: Unawain ito bilang purong mapaghiganting parusa o bilang sakit na walang anumang banal na ahensiya.
  rationale: Sa pangangatwiran ni Elihu, nagsasalita at nagtutuwid ang Diyos sa pamamagitan ng paghihirap. Hindi nilulutas ng salin ang mas malawak na tensiyong teolohikal hinggil sa dahilan ng pagdurusa.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “higaan” at “mga buto” upang mapanatili ang kongkretong larawan, habang ang metaporikal na רִיב ay isinaling natural bilang “hapdi.”
