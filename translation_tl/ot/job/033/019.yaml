  terminology: “Sakit,” “higaan,” at “mga buto” ay karaniwan at angkop sa modernong Filipino Tagalog. Pinananatili ng “paglalaban” ang larawan ng רִיב nang hindi ipinipilit ang isang tiyak na medikal na paliwanag.
