  text: Lay your hand on him[a]; remember the battle—you will not do it again.
translation:
  language: tl
  text: Ipatong mo sa kanya ang iyong kamay; alalahanin mo ang labanan—huwag mo na itong ulitin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “huwag nang magdagdag.” Idyomatikong tumutukoy ito sa hindi na pag-uulit ng naturang pagtatangka.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׂים
  choice: Ipatong
  rationale: Ang pautos na anyo ng שׂים ay tumutukoy sa paglalagay ng kamay sa Leviatan; natural sa Filipino ang “ipatong ... ang iyong kamay” at nananatili ang tuwirang hamon.
- source_word: עָלָיו
  choice: sa kanya
  rationale: Ang עַל na may panlalaking isahang hulapi ay “sa ibabaw niya/sa kanya”; sa pariralang ito, pinakanatural ang “sa kanya.”
- source_word: כַּפֶּךָ
  choice: ang iyong kamay
  rationale: Maaaring literal na “palad,” ngunit tumutukoy rito sa buong kamay bilang ipinanghahawak o ipinananakit; “kamay” ang likas na katumbas sa Filipino.
- source_word: זְכֹר
  choice: alalahanin mo
  rationale: Pinananatili nito ang pautos at ang diwa ng pag-iingat sa isip sa mangyayaring pakikipaglaban.
- source_word: מִלְחָמָה
  choice: ang labanan
  rationale: Ang מִלְחָמָה ay labanan o digmaan; “labanan” ang angkop sa tiyak na sagupaan sa Leviatan.
- source_word: אַל תּוֹסַף
  choice: hindi mo na iyon uulitin
  rationale: 'Literal itong “huwag kang magdagdag,” ngunit idyomatikong nangangahulugang huwag nang ulitin ang tangkang tinutukoy. Ang pangungusap ay maaari ring marinig bilang tiyak na bunga o babala: hindi na niya ito uulitin.'
theological_decisions:
- issue: Puwersa ng אַל תּוֹסַף bilang pagbabawal o pahayag ng magiging bunga
  choice: hindi mo na iyon uulitin
  alternative: huwag mo na iyong ulitin
  rationale: Ang negatibong anyo ay pormal na maaaring basahing pagbabawal, ngunit sa konteksto ay mabisa rin bilang babala tungkol sa tiyak na bunga ng sagupaan. Pinananatili ng salin ang kontekstuwal na puwersang ito, habang itinatala sa talababa ang literal at alternatibong pagbasa.
translation_notes:
  register: Makabago ngunit marangal na Filipino; tuwiran ang mga pautos at malinaw ang larawan ng mapanganib na pagharap sa Leviatan. Inilagay ang [a] matapos ang sugnay na tinutukoy nito.
