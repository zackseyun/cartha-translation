  text: Hide them together in the dust[b][a]; bind their faces in the hidden place.
translation:
  language: tl
  text: Itago[a] mo silang magkakasama sa alikabok; talian mo ang kanilang mga mukha sa tagong lugar.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Ilibing mo silang magkakasama sa alikabok.” Ang pandiwang Hebreo ay maaaring mangahulugang “itago,” ngunit sa kontekstong ito ay maaari ring magpahiwatig ng paglilibing.
    reason: lexical_alternative
  - marker: b
    text: O “talian mo ang kanilang mga mukha nang palihim” o “sa pagkakakubli.” Mahirap unawain nang tiyak ang huling pariralang Hebreo; malamang na tumutukoy ito sa isang tagong lugar at inuulit ang larawan ng unang pandiwang “itago.”
    reason: alternative_reading
lexical_decisions:
- source_word: טָמְנֵם
  choice: Itago mo sila
  rationale: Ang טמן ay pangunahing nangangahulugang “itago” o “ikubli.” Pinananatili ng “itago” ang batayang diwa nang hindi tiyakang ipinapakahulugang paglilibing, bagaman maaaring iyon ang ipinahihiwatig ng konteksto.
- source_word: בֶּעָפָר
  choice: sa alabok
  rationale: Ang עָפָר ay karaniwang tumutukoy sa alabok o pinong lupa. Ang “alabok” ay angkop sa marangal na tulang wika at sa larawan ng kamatayan sa konteksto.
- source_word: יָחַד
  choice: magkakasama
  rationale: Ipinahahayag nito ang sama-samang pagtrato sa mga tinutukoy; natural sa Filipino ang “magkakasama” kasunod ng “sila.”
- source_word: פְּנֵיהֶם
  choice: ang kanilang mga mukha
  rationale: Tuwirang pinananatili ang kongkretong maramihang “kanilang mga mukha,” sa halip na gawing metaporikal na “kanilang pagkatao.”
- source_word: חֲבֹשׁ
  choice: talian mo
  rationale: Ang חבשׁ ay nangangahulugang magtali o magbigkis. Ang “talian mo” ay natural na pautos sa Filipino at pinananatili ang larawan ng pagpigil o paggapos.
- source_word: בַּטָּמוּן
  choice: sa tagong lugar
  rationale: Malamang na tumutukoy ito sa isang bagay o lugar na nakatago. Pinananatili ng “tagong lugar” ang kaugnayan nito sa unang pandiwang “itago” at hindi ito labis na ipinapakahulugang “kadiliman” o libingan.
