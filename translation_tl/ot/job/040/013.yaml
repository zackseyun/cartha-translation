translation_notes:
  register: Makabago ngunit marangal na Filipino, na may tuwirang pautos at pinananatiling konkretong makatang larawan. Ginamit ang “alabok” sa halip na “lupa” upang mapanatili ang ugnayan sa mortalidad, at nilagyan ng talababa ang tunay na leksikal at sintaktikong kalabuan.
