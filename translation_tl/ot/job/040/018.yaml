  text: 'Ang kanyang mga buto ay tulad ng mga tubo ng bronse[a];

    ang kanyang mga buto ay tulad ng isang baras na bakal.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga daluyan ng bronse.” Maaaring bigyang-diin ng אֲפִיקֵי נְחוּשָׁה ang mga daluyan o mahahabang matitibay na estruktura, hindi lamang mga tubo. Maaari ring unawain ang נְחוּשָׁה bilang tanso.
    reason: lexical_alternative
  - marker: b
    text: O “ang kanyang mga buto ay tulad ng isang hinulmang piraso ng bakal.” Ang גְּרָמָיו ay maaari ring isalin bilang “ang kanyang katawan/balatay,” at ang מְטִיל ay maaaring tumukoy sa metal na ibinuhos o hinulma.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲצָמָיו
  choice: kanyang mga buto
  rationale: Karaniwang tumutukoy ang עֶצֶם sa mga buto; ito ang tuwirang anatomikal na kahulugan at kaagapay ng גְּרָמָיו.
- source_word: אֲפִיקֵי
  choice: mga tubong
  rationale: Maaaring mangahulugan ang אֲפִיקִים ng mga daluyan o tubo. Sa paglalarawan sa mga buto, malinaw na naihahatid ng “mga tubo” ang larawan ng malalaki at matitibay na estruktura, habang pinananatili sa talababa ang “mga daluyan.”
- source_word: נְחוּשָׁה
  choice: tanso
  rationale: Ang נְחוּשָׁה ay maaaring tumukoy sa copper o bronze. “Tanso” ang natural at malawak na salitang Filipino para sa metal na nasa sinaunang matalinghagang paghahambing.
- source_word: גְּרָמָיו
  choice: kanyang mga biyas
  rationale: Bagaman maaaring mangahulugan ang גֶּרֶם na “buto,” ang “mga biyas” ay nagpapanatili sa pagkakaiba ng ikalawang taludtod at sa larawan ng lakas ng katawan nang hindi inuulit lamang ang unang parirala.
- source_word: כִּמְטִיל
  choice: parang mga baras na
  rationale: Ang מָטִיל ay isang bagay na hinulma o ibinuhos na metal. Sa konteksto, natural na ipinapahayag ng “mga baras” ang tigas at bigat ng larawan.
- source_word: בַּרְזֶל
  choice: bakal
  rationale: Ito ang karaniwang katumbas ng בַּרְזֶל at natural na kapareha ng tanso sa larawang metaliko.
