  text: Will he make a covenant with you[b][a], that you would take him as a servant forever?
translation:
  language: tl
  text: Makikipagtipan ba siya sa iyo[a], at kukunin mo ba siyang bilang alipin[b] magpakailanman?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “puputol ba siya ng tipan sa iyo,” isang karaniwang idyoma na nangangahulugang “makikipagtipan.”
    reason: lexical_alternative
  - marker: b
    text: Ang salitang Hebreo ay maaaring mangahulugang “lingkod” o “alipin.” Ginamit dito ang “alipin” dahil binibigyang-diin ng konteksto ang permanente at nakataling katayuan ng paglilingkod.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲיִכְרֹת בְּרִית
  choice: Makikipagtipan ba siya
  rationale: Ang כרת בְּרִית ay karaniwang idyomang Hebreo para sa paggawa o pagtatatag ng isang tipan. Ginamit ang “makikipagtipan” bilang natural at marangal na Filipino, at ipinahayag ng “ba” ang tanong na minamarkahan ng הֲ.
- source_word: עִמָּךְ
  choice: sa iyo
  rationale: Tuwirang katumbas ito ng pariralang nangangahulugang “with you” at angkop sa makabagong Filipino.
- source_word: תִּקָּחֶנּוּ
  choice: at kukunin mo siya
  rationale: Ang לקח ay “kunin,” at ang hulaping pantukoy ay tumutukoy sa panlalaking isahan, “siya.” Pinananatili ng “at” ang ugnayan ng dalawang sugnay nang hindi labis na itinatakda kung ito ay layunin o bunga ng tipan.
- source_word: לְעֶבֶד
  choice: bilang alipin
  rationale: Maaaring tumukoy ang עֶבֶד sa lingkod o alipin. Dahil sa kasunod na עוֹלָם at sa diwa ng permanenteng pagkakabihag sa konteksto, mas angkop dito ang “alipin.”
- source_word: עוֹלָם
  choice: habambuhay
  rationale: Sa kontekstong ito, ipinahihiwatig ng עוֹלָם ang permanenteng kalagayan sa buong buhay. Mas natural sa Filipino ang “habambuhay” kaysa sa mas absolutong “magpakailanman” kapag tao o hayop ang inilalarawang alipin.
