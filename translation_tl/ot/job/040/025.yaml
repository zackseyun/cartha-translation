  text: Can you draw out Leviathan with a fishhook[b][a], or press down his tongue with a rope?
translation:
  language: tl
  text: Mahihila mo ba si Leviatan gamit ang kawil, o maipapalubog mo ba ang dila niya gamit ang lubid?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mapapababa mo ba ang dila niya gamit ang lubid?” o “mapipigil mo ba pababa ang dila niya gamit ang lubid?” Mahirap tiyakin ang larawang ipinahihiwatig ng Hebreo; maaaring tumukoy ito sa pagsupil sa nilalang sa pamamagitan ng bibig nito.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּמְשֹׁךְ
  choice: mahihila
  rationale: Ang Qal imperfect na משׁך ay tumutukoy sa paghila; ang anyong may “ba” ay natural na naghahatid ng retorikal na tanong sa Filipino.
- source_word: לִוְיָתָן
  choice: Leviatan
  rationale: Isinalin bilang transliteradong pantanging katawagan, nang walang idinagdag na pantukoy dahil wala nito sa Hebreo.
- source_word: בְּחַכָּה
  choice: gamit ang kawil
  rationale: Ang חכה ay kawil na ginagamit sa pangingisda. Likas at malinaw sa modernong Filipino ang “kawil” sa kontekstong ito.
- source_word: וּבְחֶבֶל
  choice: nang lubid
  rationale: Ang חבל ay lubid o panali; pinili ang “lubid” bilang malinaw at kongkretong katumbas.
- source_word: תַּשְׁקִיעַ
  choice: maitatali ... ang dila niya
  rationale: Literal na nagpapahiwatig ang Hiphil ng שׁקע ng pagpapalubog o pagpapababa. Dahil mahirap at hindi tiyak ang larawan kasama ng lubid at dila, gumamit ang pangunahing teksto ng natural na paglalarawan sa pagsupil sa bibig, habang pinananatili sa talababa ang mas literal na mga posibilidad.
- source_word: לְשֹׁנוֹ
  choice: ang dila niya
  rationale: Tahasang “dila niya” ang Hebreo, kaya hindi ito pinalitan ng mas malawak na “bibig niya.”
