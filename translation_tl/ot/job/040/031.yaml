translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Pinanatili ang retorikal na tanong at ang paralelismong “balat ... ulo.” Ang “salapang” at “sibat na pangisda” ay madaling maunawaan ngunit hindi itinatago ng mga talababa ang leksikal na kawalang-katiyakan.
