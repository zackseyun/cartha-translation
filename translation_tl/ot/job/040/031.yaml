  yaml_path: translation/ot/job/040/031.yaml
  text: Can you fill his hide with harpoons[b][a], or his head with fishing spears?
translation:
  language: tl
  text: Mapupuno mo ba ng mga salapang[a] ang balat nito, o ng mga sibat na pangisda[b] ang ulo nito?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga bakal na may tinik,” o “mga kawit.” Bihira ang salitang Hebreo at maaaring tumukoy sa mas pangkalahatang matulis o may-tinik na kagamitang panghuli.
    reason: lexical_alternative
  - marker: b
    text: O “mga kawit na pangisda.” Hindi tiyak ang salitang Hebreo at maaaring tumukoy nang mas pangkalahatan sa isang kagamitang panghuli ng isda.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתְמַלֵּא
  choice: Mapupuno mo ba
  rationale: Ang pantanong na may Piel imperfect na ikalawang panauhang panlalaki ay isang retorikal na hamon. Likas sa modernong Tagalog ang “Mapupuno mo ba” at pinananatili nito ang larawan ng pagtadtad sa katawan ng mga sandata.
- source_word: בְשֻׂכּוֹת
  choice: ng mga salapang
  rationale: Bihira ang salitang Hebreo at malamang na tumutukoy sa matutulis o may-salubsob na kagamitang panghuli. Ang “mga salapang” ay angkop sa maramihang anyo at sa paralelismo ng kagamitang pantusok sa kasunod na taludtod.
- source_word: עוֹרוֹ
  choice: ang balat nito
  rationale: Ang “balat” ang tuwiran at natural na tawag sa panlabas na bahagi ng isang malaking hayop. Ginamit ang “nito” upang hindi ipilit sa Tagalog ang kasariang gramatikal ng Hebreo.
- source_word: וּבְצִלְצַל דָּגִים
  choice: o ng mga sibat na pangisda
  rationale: Literal itong kagamitang kaugnay ng isda. Ang “mga sibat na pangisda” ay nagpapanatili sa marahas na larawang kapantay ng mga salapang, habang kinikilala sa talababa na hindi tiyak ang bihirang termino.
- source_word: רֹאשׁוֹ
  choice: ang ulo nito
  rationale: Tuwirang salin na nagpapanatili sa paralelismo ng balat at ulo; ang “nito” ay natural para sa tinutukoy na nilalang.
