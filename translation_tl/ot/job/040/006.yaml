  text: וַ/יַּֽעַן יְהוָ֣ה אֶת אִ֭יּוֹב מנ סערה וַ/יֹּאמַֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/040/006.yaml
  text: Then Yahweh answered Job out of the storm and said:[a]
translation:
  language: tl
  text: Pagkatapos, sinagot ni Yahweh si Job mula sa bagyo at sinabi:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mula sa ipu-ipo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן
  choice: Pagkatapos, sinagot
  rationale: Isinusulong ng waw-consecutive ang salaysay, at likas sa modernong Filipino ang “Pagkatapos” upang ipakita ang pagkakasunod-sunod. Sa kontekstong ito, ang ענה ay nangangahulugang sumagot o tumugon.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang banal na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: אֶת אִיּוֹב
  choice: si Job
  rationale: Minamarkahan ng אֶת ang Job bilang tuwirang layon ng pandiwang “sinagot”; ang “sinagot ni Yahweh si Job” ay natural na ayos sa Filipino.
- source_word: מִן סְעָרָה
  choice: mula sa bagyo
  rationale: Ang סְעָרָה ay maaaring tumukoy sa bagyo, unos, o ipu-ipo. Malinaw at hindi labis na tiyak ang “bagyo,” samantalang inilalagay sa talababa ang lehitimong alternatibong “ipu-ipo.”
- source_word: וַיֹּאמַר
  choice: 'at sinabi:'
  rationale: Karaniwang pormula ito sa pagsisimula ng tuwirang pananalita; ipinahihiwatig ng tutuldok na susunod ang sinabi sa kasunod na talata.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Tuwirang ginagamit ng talata ang Tetragrammaton. Pinananatili ng “Yahweh” ang pangalan sa halip na palitan ito ng titulong “PANGINOON,” nang hindi nagdaragdag ng interpretasyong denominasyonal.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang payak na pormulang pasalaysay at ang posibleng saklaw ng סְעָרָה sa pamamagitan ng talababa.
