  yaml_path: translation/ot/job/040/017.yaml
  text: He makes his tail stiff like a cedar[a]; the sinews of his thighs are knit together.
translation:
  language: tl
  text: 'Pinatitigas niya ang kanyang buntot na parang punong sedro;

    magkakahabi ang mga litid ng kanyang mga hita.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang mga litid ng kanyang baywang,” o, mas tiyak, “ang mga kalamnan/litid ng kanyang mga ari”; hindi tiyak at pinagtatalunan ang salitang Hebreo.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַחְפֹּץ
  choice: Pinatitigas niya
  rationale: Sa pisikal na paglalarawan ng buntot at sa paghahambing nito sa sedro, ipinahihiwatig ng pandiwa ang pagiging matigas o matatag. Iniiwasan nito ang karaniwang kahulugang “nalulugod,” na hindi natural sa kontekstong ito.
- source_word: זְנָבוֹ
  choice: ang kanyang buntot
  rationale: Tuwirang salin ng pangngalan na may hulaping panlalaking isahan.
- source_word: כְמוֹ אָרֶז
  choice: na parang punong sedro
  rationale: Pinananatili ang tuwirang paghahambing at ang larawan ng isang malaki at matibay na punongkahoy; nilinaw ng “punong” na ang sedro rito ay puno.
- source_word: גִּידֵי
  choice: ang mga litid ng
  rationale: Ang גיד ay tumutukoy sa litid o tendon. Ang “mga litid” ay malinaw, natural, at angkop sa marangal na paglalarawan ng katawan.
- source_word: פחדו
  choice: kanyang mga hita
  rationale: Hindi tiyak ang kahulugan ng salitang Hebreo sa talatang ito. Ang “mga hita” ay malinaw at akma sa paglalarawan ng katawan, habang inilalahad sa talababa ang mga posibleng kahulugang “baywang” at “mga ari.”
- source_word: יְשֹׂרָגוּ
  choice: magkakahabi
  rationale: Ipinahahayag nito na ang mga litid ay mahigpit na magkakaugnay o magkakapilipit. Ang “magkakahabi” ay likas at matalinghagang Filipino na nagpapanatili sa puwersa ng tulang Hebreo.
