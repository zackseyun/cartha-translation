  yaml_path: translation/ot/job/040/023.yaml
  text: Look, if a river rages, he is not alarmed; he is confident even if the Jordan surges against his mouth.
translation:
  language: tl
  text: Tingnan mo, kahit rumagasa ang ilog, hindi ito nababagabag; panatag ito kahit bumubulwak ang Jordan patungo sa bibig nito.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֵן
  choice: Tingnan mo
  rationale: Isang natural at mariing panawag-pansin sa makabagong Tagalog.
- source_word: יַעֲשֹׁק נָהָר
  choice: rumagasa ang ilog
  rationale: Sa konteksto, inilalarawan ng parirala ang marahas o mapusok na pagdaloy ng ilog; mas natural ito kaysa sa literal na diwa ng pandiwang maaaring mangahulugang umapi o manalakay.
- source_word: לֹא יַחְפּוֹז
  choice: hindi ito natitinag
  rationale: Ipinahahayag ang kawalan ng takot o pagkataranta nang hindi ipinapalagay na tao ang nilalang.
- source_word: יִבְטַח
  choice: panatag ito
  rationale: Pinananatili ang diwa ng pagiging tiwala o ligtas sa harap ng rumaragasang tubig.
- source_word: יָגִיחַ
  choice: umapaw
  rationale: Ipinahahayag ang tubig na biglang bumubulwak o sumusulong; ang 'umapaw' ay malinaw at natural sa larawang ito.
- source_word: אֶל־פִּיהוּ
  choice: hanggang sa bibig nito
  rationale: Pinananatili ang kongkretong larawan at ang direksiyon ng tubig patungo sa bibig ng nilalang.
