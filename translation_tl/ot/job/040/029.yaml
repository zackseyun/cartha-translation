  source_fidelity: Tumpak na naihahatid ng draft ang dalawang retorikal na tanong, ang pakikipaglaro sa Leviatan na gaya ng sa ibon, at ang pagtali rito para sa mga kabataang babae. Gayunman, ang “na parang sa isang ibon” ay hindi likas na pagkakabuo sa Tagalog at bahagyang nakalalabo sa saklaw ng paghahambing.
