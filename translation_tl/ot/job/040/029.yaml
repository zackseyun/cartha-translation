  text: Will you play with him like a bird[b][a], or tie him up for your girls?
translation:
  language: tl
  text: Makikipaglaro ka ba sa kaniya gaya ng sa isang ibon, o tatalian mo ba siya para sa iyong mga dalaga?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga batang babae” o “mga kabataang babae.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתְשַׂחֶק
  choice: Makikipaglaro ka ba
  rationale: Ang Qal ng שׂחק na may בְּ ay tumutukoy sa pakikipaglaro o paglilibang kasama ang isang nilalang. Likas sa makabagong Tagalog ang “makikipaglaro” at nababagay sa larawang parang maamong alagang ibon.
- source_word: בּוֹ
  choice: sa kaniya
  rationale: Ang hulaping panghalip ay panlalaking isahan at tumutukoy sa Leviatan. Walang kasariang gramatikal ang “kaniya” sa Tagalog, ngunit malinaw nitong pinananatili ang personal na pagtukoy sa hayop.
- source_word: כַּצִּפּוֹר
  choice: na parang sa isang ibon
  rationale: Karaniwang salita ang צִפּוֹר para sa ibon, kadalasan ay maliit na ibon. Ang “parang sa isang ibon” ay malinaw na iniuugnay sa paraan ng pakikipaglaro at pinananatili ang paghahambing.
- source_word: וְתִקְשְׁרֶנּוּ
  choice: o tatalian mo siya
  rationale: Ang קשר ay nangangahulugang itali o bigkisin. Bagaman waw ang pang-ugnay sa Hebreo, ang “o” ay natural sa Tagalog para sa magkasunod na alternatibong retorikal na tanong.
- source_word: לְנַעֲרוֹתֶיךָ
  choice: para sa iyong mga dalaga
  rationale: Ang נַעֲרוֹת ay tumutukoy sa mga batang babae o kabataang babae. Dignificado at maikli ang “mga dalaga,” habang inilalahad sa talababa ang posibleng mas malawak na saklaw.
