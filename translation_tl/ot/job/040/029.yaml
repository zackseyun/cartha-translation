  terminology: Ang “kaniya/siya” ay katanggap-tanggap para sa panlalaking isahang panghalip na tumutukoy sa Leviatan, nang hindi ipinipilit ang kasariang gramatikal na wala sa Tagalog. Ang “mga dalaga” ay angkop na maigsi at dignipikadong salin ng נַעֲרוֹת; pinananatili ng talababa ang mas malalawak na posibilidad.
