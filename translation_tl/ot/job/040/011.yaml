  text: הָ֭פֵץ עֶבְר֣וֹת אַפֶּ֑/ךָ וּ/רְאֵ֥ה כָל גֵּ֝אֶ֗ה וְ/הַשְׁפִּילֵֽ/הוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/040/011.yaml
  text: Pour out the overflowings of your anger[c][b][a], and look on everyone who is proud and bring him low.
translation:
  language: tl
  text: Pakawalan mo ang mga bugso ng iyong galit,[a] at tingnan mo ang bawat palalo at ibaba mo siya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Ikalat mo ang nag-uumapaw mong poot.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הָפֵץ
  choice: Pakawalan mo
  rationale: Ang pautos na pandiwa ay tumutukoy sa marahas na pagpapalabas o pagpapangalat. Ang “pakawalan” ay natural na kaakibat ng “mga bugso ng galit” sa Filipino habang pinananatili ang puwersa ng larawan.
- source_word: עֶבְרוֹת אַפֶּךָ
  choice: ang mga bugso ng iyong galit
  rationale: Ang maramihang עֶבְרוֹת ay nagpapahiwatig ng rumaragasang mga bugso o pag-apaw ng poot; ang אַף ay karaniwang idyoma para sa galit, hindi literal na ilong.
- source_word: וּרְאֵה
  choice: at tingnan mo
  rationale: Pinananatili ang pautos at ang tuwirang pagtutuon ng pansin sa kasunod na layon.
- source_word: כָל גֵּאֶה
  choice: ang bawat palalo
  rationale: 'Ang pang-isahang pang-uri na ginamit bilang pangngalan ay distributibo: bawat taong palalo. Ang “bawat palalo” ay maikli at likas sa matayog na pananalita.'
- source_word: וְהַשְׁפִּילֵהוּ
  choice: at ibaba mo siya
  rationale: Ang Hiphil ng שׁפל ay literal na ‘gawing mababa.’ Pinananatili ng “ibaba mo siya” ang larawang kasalungat ng kapalaluan at ang pang-isahang panghalip na tumutukoy sa bawat isa.
