  source_fidelity: 'Tapat ang salin sa Hebreo: ang הָפֵץ ay naipahayag bilang utos na marahas na pagpapalabas (“Pakawalan mo”); ang maramihang עֶבְרוֹת ay “mga bugso”; ang אַפֶּךָ ay wastong idyomatikong “iyong galit”; at ang distributibong כָל גֵּאֶה kasama ng pang-isahang panghalip sa וְהַשְׁפִּילֵהוּ ay naingatan sa “bawat palalo ... siya.”'
  naturalness: Natural at malinaw ang modernong Filipino, habang nananatiling marangal at patula ang tono. Ang “tingnan mo ang bawat palalo at ibaba mo siya” ay tuwiran at mahusay na sumasalamin sa magkakaugnay na mga pautos sa Hebreo.
  terminology: Ang “galit,” “palalo,” at “ibaba mo siya” ay angkop na mga katawagan. Ang “mga bugso ng iyong galit” ay mabuting representasyon ng matinding maramihang larawan ng עֶבְרוֹת. Maayos ding nakaangkla ang isang talababa sa kaugnay na parirala.
