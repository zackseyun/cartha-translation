  yaml_path: translation/ot/job/040/021.yaml
  text: Under the lotus trees he lies down[a], in the shelter of the reeds and the marsh.
translation:
  language: tl
  text: Sa ilalim ng mga punong lotus, nakahiga siya[a], sa silungan ng mga tambo at latian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa ilalim ng mga punong nagbibigay-lilim.” Hindi tiyak ang eksaktong uri ng halamang tinutukoy ng salitang Hebreo; ang “mga punong lotus” ay batay sa karaniwang pagkakakilanlan nito ayon sa konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּחַת
  choice: Sa ilalim ng
  rationale: Likas na salin ng pang-ukol na tumutukoy sa kinalalagyan sa ibaba o lilim ng isang bagay.
- source_word: צֶאֱלִים
  choice: mga punong lotus
  rationale: Malamang na tumutukoy sa isang uri ng punong nagbibigay-lilim sa tabing-tubig, na karaniwang kinikilalang lotus; dahil hindi tiyak ang eksaktong uri, inilagay sa talababa ang alternatibo.
- source_word: יִשְׁכָּב
  choice: siya nahihimlay
  rationale: Ang Qal imperfect na panlalaking isahan ay naglalarawan ng nakagawian o matingkad na kasalukuyang paghiga ng hayop; ang “nahihimlay” ay natural at marangal sa paglalarawan ng pagpapahinga.
- source_word: בְּסֵתֶר
  choice: sa kublihan
  rationale: Ipinahihiwatig ng סֵתֶר ang taguan, panakip, o kanlungang nagkukubli; ang “kublihan” ay angkop sa masinsing halamanan.
- source_word: קָנֶה
  choice: mga tambo
  rationale: Bagaman anyong isahan sa Hebreo, maaari itong gamiting kolektibo; natural sa Filipino ang maramihang “mga tambo” para sa kumpol ng halamang nasa latian.
- source_word: וּבִצָּה
  choice: at latian
  rationale: Tumutukoy sa basang lupa o pook na malubog; ang “latian” ay malinaw at karaniwang salitang Filipino na angkop sa tirahang inilalarawan.
