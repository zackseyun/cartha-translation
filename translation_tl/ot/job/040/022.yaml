base_translation:
  language: en
  yaml_path: translation/ot/job/040/022.yaml
  text: The lotus trees cover him with their shade[b][a]; the willows of the brook surround him.
translation:
  language: tl
  text: Tinatakpan siya ng mga punong lotus ng kanilang lilim[a]; pinalilibutan siya ng mga willow sa tabi ng batis[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga punong nagbibigay-lilim.” Hindi tiyak ang eksaktong uri ng halamang tinutukoy ng צֶאֱלִים, bagaman tradisyonal itong isinasaling “mga punong lotus.”
    reason: lexical_alternative
  - marker: b
    text: O “mga poplar sa wadi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְסֻכֻּהוּ
  choice: Tinatakpan siya
  rationale: Tuwirang ipinapahayag ang pagkubli o pagtakip sa kaniya, habang ang kasunod na “lilim” ang naglilinaw sa larawan.
- source_word: צֶאֱלִים
  choice: mga punong lotus
  rationale: Pinananatili ang tradisyonal na katawagang botanikal, ngunit nilalagyan ng talababa dahil hindi tiyak ang eksaktong uri ng halaman.
- source_word: צִלֲלוֹ
  choice: ng kanilang lilim
  rationale: Ang “lilim” ang natural na salin sa konteksto ng mga punong nagbibigay ng kubli at lamig.
- source_word: יְסֻבּוּהוּ
  choice: pinalilibutan siya
  rationale: Tapat na inilalarawan ang pag-ikot o pagpalibot sa kaniya.
- source_word: עַרְבֵי נָחַל
  choice: mga willow sa tabi ng batis
  rationale: Ang “willow” ay malinaw at tradisyonal na pagkakakilanlan; ang “sa tabi ng batis” ay natural na Filipino para sa mga punong tumutubo sa pampang ng נחל, bagaman maaari rin itong tumukoy sa poplar at sa isang wadi.
