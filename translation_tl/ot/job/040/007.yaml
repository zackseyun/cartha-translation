  text: Gird up your loins like a man; I will question you[a], and you shall make it known to me.
translation:
  language: tl
  text: Bigkisan mo nga ang iyong baywang tulad ng isang lalaki[a]; tatanungin kita, at ipaalam mo sa akin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “maghanda ka tulad ng isang mandirigma.” Sa literal na Hebreo, “bigkisan mo nga ang iyong baywang tulad ng isang lalaki.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱזָר נָא
  choice: Bigkisan mo
  rationale: Pinananatili ng “bigkisan” ang konkretong larawan ng paghahanda sa Hebreong pandiwa. Hindi isinalin nang hiwalay ang נָא; ang diin nito sa agarang utos ay likas nang naihahatid ng pautos na anyo sa Filipino.
- source_word: כְגֶבֶר
  choice: na gaya ng isang lalaki
  rationale: Ang גֶּבֶר ay tumutukoy sa isang lalaki at maaari ring magpahiwatig ng lakas o katapangan. Pinananatili ng salin ang tahasang panlalaking pagtukoy nang hindi ipinapalagay na “mandirigma” ang tiyak na kahulugan.
- source_word: חֲלָצֶיךָ
  choice: ang iyong baywang
  rationale: Ang חֲלָצַיִם ay tumutukoy sa bahagi ng balakang o baywang. Ang “baywang” ay natural at marangal sa modernong Filipino habang pinananatili ang pisikal na idyoma.
- source_word: אֶשְׁאָלְךָ
  choice: tatanungin kita
  rationale: Tuwirang ipinapahayag nito ang pag-uusisa o paghamon na nakapaloob sa שאל sa kontekstong ito.
- source_word: וְהוֹדִיעֵנִי
  choice: at ipaalam mo sa akin
  rationale: Pinananatili nito ang causative na diwa ng Hiphil ng ידע, “ipaalam” o “magbigay-alam,” sa halip na gawing mas interpretatibong “sagutin mo ako.”
theological_decisions:
- issue: Panlalaking wika sa גֶּבֶר
  choice: na gaya ng isang lalaki
  alternative: na gaya ng isang mandirigma / magpakatatag ka
  rationale: Tuwirang kinakausap si Job sa panlalaking isahan. Pinananatili ang tunay na anyo at tensiyon ng teksto, samantalang inilalagay sa talababa ang posibleng diin sa lakas o katapangan.
translation_notes:
  register: Makabagong Filipino na marangal at madaling maunawaan. Pinanatili ang konkretong idyoma ng pagbibigkis sa baywang; iniwasan ang mas lumang “bigkisan mo ang iyong mga balakang” at ang sobrang interpretatibong “magpakatatag ka.”
