  yaml_path: translation/ot/job/040/008.yaml
  text: Would you even annul my justice? Would you condemn me so that you may be justified?[a]
translation:
  language: tl
  text: Talaga bang pawawalang-bisa mo ang aking katarungan?[a] Ipahahayag mo ba akong may sala upang mapatunayang ikaw ang nasa tama?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang aking hatol.” Ang Hebreong mishpati ay maaaring tumukoy sa hatol, katarungan, o legal na karapatan.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַאַף
  choice: Talaga bang
  rationale: Pinagsasama ng הֲ at אַף ang patanong at mariing pagkabigla. Likas sa modernong Tagalog ang “Talaga bang” para sa diin ng retorikal na tanong.
- source_word: תָּפֵר
  choice: pawawalang-bisa
  rationale: Ang Hiphil ng פרר ay tumutukoy sa pagpapawalang-saysay o pagpapawalang-bisa. Ang “pawawalang-bisa” ay malinaw at angkop sa kontekstong hudisyal.
- source_word: מִשְׁפָּטִי
  choice: aking katarungan
  rationale: Maaaring mangahulugan ang מִשְׁפָּט ng hatol, katarungan, o legal na karapatan. Sa konteksto, saklaw nito ang matuwid na pamamahala at paghatol ng Diyos; pinananatili sa talababa ang posibleng “aking hatol.”
- source_word: תַּרְשִׁיעֵנִי
  choice: Hahatulan mo ba akong nagkasala
  rationale: 'Ang Hiphil ng רשע ay forensic: ideklarang may sala o hatulan. Ang parirala ay natural sa Tagalog at malinaw na nagpapanatili sa tagpong hudisyal.'
- source_word: לְמַעַן
  choice: upang
  rationale: Ipinakikilala nito ang layunin o kinalabasan. Ang “upang” ay maikli, dignified, at malinaw.
- source_word: תִּצְדָּק
  choice: mapatunayang ikaw ang nasa tama
  rationale: Sa forensic na konteksto, ang Qal ng צדק ay ang mapakitang tama o mapawalang-sala. Iniiwasan ng saling ito ang di-kinakailangang doktrinal na pakahulugan ng “ariing-ganap” habang pinananatili ang legal na pagsalungat sa paghatol na nagkasala.
theological_decisions:
- issue: Forensic o pangkalahatang moral na wika
  choice: 'Pinanatili ang wikang hudisyal: “pawawalang-bisa,” “katarungan,” “hahatulan ... nagkasala,” at “mapatunayang ... nasa tama.”'
  alternative: “Sisiraan mo ba ang aking katuwiran ... gagawin mo ba akong mali para ikaw ang maging tama?”
  rationale: Malakas ang legal na larangan ng מִשְׁפָּט, רשע, at צדק. Pinananatili nito ang tensiyon ng hamon ng Diyos kay Job tungkol sa banal na katarungan.
- issue: Kahulugan ng מִשְׁפָּטִי
  choice: aking katarungan
  alternative: aking hatol
  rationale: Mas malawak na naipahahayag ng “katarungan” ang makatarungang paghatol at pamamahala ng Diyos sa konteksto, ngunit tunay na posibilidad ang “hatol” kaya inilagay ito sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal ang himig. Pinanatili ang dalawang matatalim na retorikal na tanong at ang hudisyal na pagtutunggali ng paghatol na nagkasala at pagpapatunay na nasa tama.
