lexical_decisions:
- source_word: וַיַּעַן
  choice: At sumagot
  rationale: Ang ענה sa pormulang pasalaysay na ito ay nangangahulugang “sumagot” o “tumugon.” Pinananatili ng “sumagot” ang ayos ng diyalogo at natural ito sa makabagong Tagalog.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinalin ang Tetragrammaton bilang personal na pangalang “Yahweh,” sa halip na palitan ito ng titulong “PANGINOON.”
- source_word: אֶת
  choice: '[hindi tuwirang isinalin]'
  rationale: Pananda ito ng tiyak na layon; ipinahahayag ng “kay Job” ang ugnayang kailangan sa natural na Tagalog.
- source_word: אִיּוֹב
  choice: Job
  rationale: Ginamit ang nakaugaliang anyo ng pangalan sa Tagalog na Bibliya.
- source_word: וַיֹּאמַר
  choice: at sinabi
  rationale: Ang אמר ay karaniwang pandiwang “sabihin.” Pinanatili ang ikalawang pandiwa sa pormulang Hebreo na “sumagot … at sinabi,” bagaman maaari itong paikliin sa mas malayang salin.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; ang PANGINOON
  rationale: Tuwirang ginagamit ng tekstong Hebreo ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalan at iniiwasang palitan ito ng isang titulo; binabanggit sa talababa ang lehitimong alternatibong anyo.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang bahagyang pormal na dobleng pormula ng Hebreo na “sumagot … at sinabi” upang maipakita ang parehong pandiwa sa pinagmulan.
