  text: And Yahweh answered Job and said:[a]
translation:
  language: tl
  text: At sumagot si Yahweh kay Job at sinabi:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: “YHWH”; maaari ring anyuhing “Jehovah.”'
