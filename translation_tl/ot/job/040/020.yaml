  yaml_path: translation/ot/job/040/020.yaml
  text: For the mountains bear food for him[b][a], and all the wild animals of the field play there.
translation:
  language: tl
  text: Sapagkat ang mga bundok ay nagbibigay sa kanya ng pagkain,[a] at naglalaro roon ang lahat ng maiilap na hayop sa parang.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nagbubunga para sa kanya ang mga bundok.”
    reason: lexical_alternative
  - marker: b
    text: 'Tradisyonal: “lahat ng hayop sa parang.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinahihiwatig dito ang paliwanag sa naunang paglalarawan sa paglalaan at tirahan ng Behemot.
- source_word: בּוּל
  choice: pagkain
  rationale: Ang salita ay tumutukoy sa ani o bunga ng lupa; sa konteksto, malinaw at natural na ipinahahayag ng “pagkain” ang ipinagkakaloob sa hayop.
- source_word: הָרִים
  choice: ang mga bundok
  rationale: Tuwirang katumbas ito ng tiyak na pangngalang tumutukoy sa bulubunduking lugar.
- source_word: יִשְׂאוּ לוֹ
  choice: ay nagbibigay sa kanya
  rationale: Kasama ng בּוּל, ipinahihiwatig ng pandiwa na ang mga bundok ay nagbubunga o naglalaan ng makakain; natural sa modernong Tagalog ang “nagbibigay.”
- source_word: וְכָל
  choice: at ... ang lahat
  rationale: Pinananatili nito ang pang-ugnay at ang kolektibong saklaw ng parirala.
- source_word: חַיַּת הַשָּׂדֶה
  choice: maiilap na hayop sa parang
  rationale: Tumutukoy ang parirala sa mga hayop na malaya sa lupain; ang “maiilap na hayop sa parang” ay malinaw, kasalukuyan, at hindi arkaiko.
- source_word: יְשַׂחֲקוּ
  choice: naglalaro
  rationale: Inihahayag ng Piel ng שׂחק ang masigla o mapaglarong pagkilos; “naglalaro” ang pinakanatural na katumbas.
- source_word: שָׁם
  choice: roon
  rationale: Lokatibong pang-abay ito na tumutukoy sa nabanggit na lugar sa mga bundok.
