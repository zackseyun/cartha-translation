  register: Modernong Filipino Tagalog na may marangal ngunit payak na himig. Ginamit ang “Sapagkat” upang mapanatili ang paliwanag na ugnayan sa naunang talata. Ang dalawang talababa ay minarkahan sa pangunahing teksto at pinananatili ang leksikal na mga alternatibo nang hindi nilulutas nang labis ang larawan ng Hebreo.
