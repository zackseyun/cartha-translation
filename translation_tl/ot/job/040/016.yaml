base_translation:
  language: en
  yaml_path: translation/ot/job/040/016.yaml
  text: Look now[a], his strength is in his loins[b], and his power in the muscles of his belly.
translation:
  language: tl
  text: Tingnan mo, ang lakas niya ay nasa kanyang mga balakang, at ang sigla niya[a] ay nasa mga kalamnan[b] ng kanyang tiyan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “lakas niya.” Magkalapit ang kahulugan ng dalawang salitang Hebreo na ginamit sa magkatugmang mga linya para sa pisikal na lakas.
    reason: lexical_alternative
  - marker: b
    text: O “mga litid.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה נָא
  choice: Tingnan mo
  rationale: Ang הִנֵּה ay tumatawag ng pansin, at ang נָא ay nagdaragdag ng agarang paghimok. Likas at tuwiran sa modernong Filipino ang “Tingnan mo,” nang hindi nagiging makaluma.
- source_word: כֹחוֹ
  choice: ang lakas niya
  rationale: Karaniwang tumutukoy ang כֹחַ sa pisikal na lakas o kakayahan; ang “lakas” ang pinakatuwirang salita sa paglalarawan sa katawan ng nilalang.
- source_word: בְמָתְנָיו
  choice: nasa kanyang mga balakang
  rationale: Ang מָתְנַיִם ay tumutukoy sa bahaging balakang/baywang. Malinaw sa karaniwang mambabasa ang “mga balakang” at pinananatili nito ang pisikal na larawan.
- source_word: וְאֹנוֹ
  choice: at ang sigla niya
  rationale: Ang אוֹן ay maaaring mangahulugang lakas, sigla, o kapangyarihang pisikal. Pinili ang “sigla” upang mapanatili ang bahagyang pagkakaiba ng magkatambal na כֹחַ at אוֹן nang hindi ipinahihiwatig na lubos na magkaiba ang kahulugan ng mga ito.
- source_word: בִּשְׁרִירֵי
  choice: nasa mga kalamnan
  rationale: Ang שְׁרִירִים ay tumutukoy sa mga kalamnan, litid, o matitigas na bahaging laman. “Mga kalamnan” ang pinakamalinaw at pinakanatural na makabagong katumbas.
- source_word: בִטְנוֹ
  choice: ng kanyang tiyan
  rationale: Sa kontekstong anatomikal, ang בֶּטֶן ay tumutukoy sa tiyan o puson. Ang “tiyan” ang tuwiran at karaniwang katawagan dito.
