  text: הִנֵּה נָ֣א בְ֭הֵמוֹת אֲשֶׁר עָשִׂ֣יתִי עִמָּ֑/ךְ חָ֝צִ֗יר כַּ/בָּקָ֥ר יֹאכֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/040/015.yaml
  text: Look now at Behemoth[a], which I made along with you; he eats grass like an ox.
translation:
  language: tl
  text: Tingnan mo ngayon ang Behemot[a], na nilikha ko kasabay mo; kumakain ito ng damo gaya ng baka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang hayop.” Maraming tagapagpaliwanag ang umuunawa sa “Behemot” bilang natatanging tawag sa isang partikular na dakilang nilalang; iniuugnay naman ito ng iba sa hipopotamo o sa ibang malaking hayop.
    reason: alternative_reading
lexical_decisions:
- source_word: הִנֵּה נָא
  choice: Tingnan mo ngayon
  rationale: Ang הִנֵּה ay pantawag-pansin at ang נָא rito ay nagbibigay ng agarang diin. Natural sa modernong Tagalog ang “Tingnan mo ngayon” habang pinananatili ang tuwirang utos.
- source_word: בְהֵמוֹת
  choice: Behemot
  rationale: Ginamit bilang natatanging tawag sa isang dakilang nilalang sa konteksto. Pinanatili ang transliterasyon upang hindi sapilitang tukuyin kung anong hayop ito.
- source_word: אֲשֶׁר עָשִׂיתִי עִמָּךְ
  choice: na ginawa ko ring gaya mo
  rationale: Ipinahihiwatig ng parirala na kapuwa ang Behemot at ang kausap ay mga nilalang na ginawa ng Diyos. Ang “rin” at “gaya mo” ay natural sa Tagalog at iniiwasan ang maling pahiwatig na tumulong ang kausap sa paggawa nito.
- source_word: חָצִיר
  choice: damo
  rationale: Ito ang malinaw at karaniwang katumbas ng damo o luntiang pananim sa kontekstong pagkain ng hayop.
- source_word: כַבָּקָר
  choice: gaya ng baka
  rationale: Ang בָּקָר ay maaaring tumukoy sa baka o mga hayop na bakahan bilang pangkat. Ang “baka” ay natural at sapat na malawak sa Tagalog.
- source_word: יֹאכֵל
  choice: kumakain ito
  rationale: Kasalukuyang/habituwal na kilos ang inilalarawan. Walang gramatikal na kasariang panghalip sa Tagalog na kailangang ipilit mula sa panlalaking anyo ng pandiwang Hebreo.
theological_decisions:
- issue: Pagkakakilanlan ng בְהֵמוֹת
  choice: Pinanatili bilang natatanging tawag na “Behemot.”
  alternative: Isalin bilang “ang hayop” o tukuyin bilang hipopotamo o ibang malaking hayop.
  rationale: Hindi tahasang kinikilala ng tekstong Hebreo ang nilalang bilang isang partikular na kilalang uri ng hayop. Pinananatili ng transliterasyon ang pampanitikang bigat at ang tunay na kawalang-katiyakan ng pagkakakilanlan nito.
- issue: Kahulugan ng עִמָּךְ kaugnay ng paglikha
  choice: Isinaling “ginawa ko ring gaya mo” upang idiin na kapuwa sila ginawa ng Diyos.
  alternative: “ginawa ko kasabay mo” o mas literal na “ginawa ko kasama mo.”
  rationale: Maaaring magpahiwatig ang עִמָּךְ ng pagkalikhang kasama o katulad ng kausap, ngunit ang literal na “kasama mo” sa Tagalog ay madaling mapagkamalang nakibahagi ang kausap sa paggawa. Ang piniling anyo ay malinaw ngunit hindi nagsasaad ng tiyak na kronolohiya.
translation_notes:
  register: Makabago, tuwiran, at marangal na Tagalog. Ginamit ang “ito” sa halip na panghalip na may kasarian, sapagkat iyon ang likas na gamit sa Filipino para sa hayop at hindi nito binabago ang reperensiya ng tekstong Hebreo.
