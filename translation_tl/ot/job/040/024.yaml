  text: Can one capture him before his eyes? Can one pierce his nose with snares?[a][b]
translation:
  language: tl
  text: May makahuhuli ba sa kanya sa harap ng kanyang mga mata? May makabubutas ba sa ilong niya gamit ang mga silo?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Kukunin ba siya sa harap ng kanyang mga mata? May bubutas ba sa ilong niya gamit ang mga bitag?” Maikli at mahirap unawain ang Hebreo; maaaring unawain ang mga pandiwa nang hindi gaanong pangkalahatan.
    reason: alternative_reading
  - marker: b
    text: Sa Hebreo, “gamit ang mga silo.” Sa ilang tradisyonal na salin, “mga kawit,” na mas madaling iugnay sa pagbubutas sa ilong; ngunit ang pangngalan ay karaniwang tumutukoy sa mga silo o bitag.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּעֵינָיו
  choice: habang nakatingin siya
  rationale: Ipinahahayag ng parirala na gagawin ang paghuli nang lantaran at habang nakikita ng nilalang; natural ito sa modernong Tagalog at hindi nagpapahiwatig na mga mata ang instrumento.
- source_word: יִקָּחֶנּוּ
  choice: Mahuhuli ba siya
  rationale: Bagaman pangunahing nangangahulugang “kunin” ang לקח, ang “hulihin” ang angkop na diwa sa konteksto ng panghuhuli sa isang hayop. Pinananatili ng tanong ang retorikal na hamon ng konteksto.
- source_word: בְּמוֹקְשִׁים
  choice: ng mga silo
  rationale: Karaniwang tumutukoy ang מוֹקֵשׁ sa silo o bitag, hindi tuwirang sa kawit. Pinananatili ng “mga silo” ang mahirap at tila di-karaniwang larawan ng Hebreo.
- source_word: יִנְקָב
  choice: Matutusok
  rationale: Ang נקב ay nangangahulugang tumusok o bumutas. Ang “matutusok” ay malinaw at likas sa Tagalog habang pinananatili ang marahas na pisikal na larawan.
- source_word: אָף
  choice: ilong
  rationale: Sa kontekstong ito, ang אַף ay konkretong bahagi ng katawan. Mas tuwiran at hindi labis na tiyak ang “ilong” kaysa “butas ng ilong.”
