translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang dalawang retorikal na tanong upang ipakita ang hamon ng talata. Hindi pinakinis ang di-karaniwang larawang “matutusok ... ng mga silo”; ipinaliwanag sa talababa ang posibleng “mga kawit” at ang pagiging mahirap ng Hebreo.
