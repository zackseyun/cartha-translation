  yaml_path: translation/ot/job/040/005.yaml
  text: I have spoken once[a], and I will not answer; twice, and I will add nothing more.
translation:
  language: tl
  text: Minsan na akong nagsalita[a], at hindi na ako sasagot; makalawa, at wala na akong idaragdag.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Minsan akong nagsalita, ngunit hindi ako sasagot; makalawa, ngunit hindi na ako magpapatuloy.” Ang Hebreong pananalitang “magdagdag” ay maaaring mangahulugang magpatuloy o umulit ng isang gawain.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחַת
  choice: Minsan
  rationale: Ginagamit na pang-abay ang pambabaeng bilang na “isa,” kaya likas na nangangahulugang “minsan” sa halip na literal na “isang bagay.”
- source_word: דִּבַּרְתִּי
  choice: na akong nagsalita
  rationale: Ang ganap na anyong unang panauhan ay tumutukoy sa nagawa nang pagsasalita ni Job na may kaugnayan sa kasalukuyan; likas itong naipahahayag sa Filipino sa “nagsalita na ako.”
- source_word: וְלֹא אֶעֱנֶה
  choice: at hindi na ako sasagot
  rationale: Ang ענה ay “sumagot” o “tumugon.” Pinananatili ng “at” ang payak na pag-uugnay ng Hebreo, samantalang nililinaw ng “hindi na” ang pasiya ni Job na huwag nang tumugon.
- source_word: וּשְׁתַּיִם
  choice: makalawa
  rationale: Ginagamit ding pang-abay ang bilang na “dalawa,” kaagapay ng “minsan”; ang “makalawa” ay maikli, dignificado, at likas sa kontekstong ito.
- source_word: וְלֹא אוֹסִיף
  choice: at wala na akong idaragdag
  rationale: Ang יסף sa Hiphil ay maaaring mangahulugang “magdagdag,” “magpatuloy,” o “umulit.” Pinananatili ng salin ang metapora ng pagdaragdag habang malinaw na tumutukoy sa hindi na pagpapatuloy sa pagsasalita.
