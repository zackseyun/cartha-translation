  register: Makabago at dignipikadong Filipino na madaling maunawaan. Pinanatili ang magkatugmang “minsan … makalawa” at ang Hebreong larawan ng “pagdaragdag,” nang hindi inaalis ang posibilidad na ang huling pandiwa ay tumutukoy sa pagpapatuloy o pag-uulit.
