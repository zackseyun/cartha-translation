  yaml_path: translation/ot/job/040/002.yaml
  text: Will one who contends with the Almighty correct him? Let the one who argues with God answer it[a][b].
translation:
  language: tl
  text: Itutuwid ba ng nakikipagtalo sa Makapangyarihan sa Lahat ang Diyos? Sumagot tungkol dito ang nakikipagtalo sa Diyos.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Sasawayin o tuturuan ba ng mapaghanap ng mali sa Makapangyarihan sa Lahat ang Diyos?” Pinagsasama ng Hebreo ang wika ng legal na pagtatalo at ng pagtutuwid.
    reason: lexical_alternative
  - marker: b
    text: O “sumagot tungkol sa bagay na ito” o “sumagot sa kanya.” Maaaring ang hulapi sa Hebreo ay tumukoy sa usaping iniharap sa halip na tuwiran sa Diyos.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲרֹב
  choice: nakikipagtalo
  rationale: Mula sa ריב, na tumutukoy sa pakikipagtalo o pakikipag-usap sa anyong paglilitis. Ang pandiwang anyo ay natural sa modernong Tagalog at pinananatili ang diwang legal at mapagtunggali.
- source_word: עִם
  choice: sa
  rationale: Bagaman literal na 'kasama/kasalo,' sa konteksto ng pagtatalo ay nagpapahiwatig ito ng pagsalungat. Ang 'nakikipagtalo sa' ang likas na pariralang Tagalog.
- source_word: שַׁדַּי
  choice: Makapangyarihan sa Lahat
  rationale: Isinasalin ang banal na titulong Shaddai sa kinikilalang kahulugan nito sa halip na baybayin lamang ang Hebreo.
- source_word: יִסּוֹר
  choice: itutuwid ... ang Diyos
  rationale: Ang יסר ay maaaring mangahulugang magdisiplina, magturo, sumaway, o magtuwid. Dito, ayon sa sintaks at paralelismo, ang taong nakikipagtalo ang ipinakikitang nagtatangkang magtuwid sa Diyos.
- source_word: מוֹכִיחַ
  choice: nakikipagtalo
  rationale: Ang יכח ay maaaring tumukoy sa pakikipangatwiran, pagsaway, o paglalahad ng kaso. Ang 'nakikipagtalo' ay malinaw at likas, habang ang mas malawak na saklaw ay inilalagay sa talababa.
- source_word: אֱלוֹהַּ
  choice: Diyos
  rationale: Karaniwang makatang anyong isahan para sa Diyos sa Job; walang dagdag na diin na kailangang ipasok.
- source_word: יַעֲנֶנָּה
  choice: sumagot tungkol dito
  rationale: Ang hulaping pambabaeng isahan ay malamang na tumutukoy sa usapin o paratang na iniharap, hindi tuwiran sa Diyos. Pinananatili ng 'tungkol dito' ang malamang na reperensiya nang hindi labis na nililinaw ang masinsing Hebreo.
theological_decisions:
- issue: Kung ang tao ba ang nagtatangkang magtuwid sa Diyos o ang tao ang tumatanggap ng pagtutuwid mula sa Diyos
  choice: Ang retorikal na tanong ay naglalarawan sa taong nakikipagtalo bilang nagtatangkang magtuwid sa Makapangyarihan sa Lahat.
  alternative: Ang nakikipagtalo sa Makapangyarihan sa Lahat ay dapat tumanggap ng pagtutuwid.
  rationale: Mas pinapaboran ng sintaks at paralelismo na ang taong nakikipagtalo ang simuno ng יִסּוֹר. Pinagtitibay ito ng ikalawang linya, na humihiling sa nakikipagtalo sa Diyos na sumagot.
translation_notes:
  register: Modernong Filipino Tagalog na dignified ngunit madaling maunawaan. Ginamit ang 'Makapangyarihan sa Lahat' bilang malinaw na salin ng Shaddai at pinanatili sa mga talababa ang legal-korektibong saklaw at ang kalabuan ng layon ng 'sumagot.'
