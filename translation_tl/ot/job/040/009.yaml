  text: Or do you have an arm like God’s[a], and can you thunder with a voice like his?
translation:
  language: tl
  text: O mayroon ka bang bisig na tulad ng bisig ng Diyos[a], at kaya mo bang magpakulog gamit ang tinig na gaya ng sa kanya?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, bagaman di-gaanong malamang, “tulad ng bisig ng isang diyos,” kung ang אֵל ay uunawain sa pangkalahatang diwa; mariing pinapaboran ng konteksto ang “Diyos.”
    reason: alternative_reading
lexical_decisions:
- source_word: וְאִם
  choice: O mayroon ka bang
  rationale: Sa nagpapatuloy na serye ng mga retorikal na hamon, natural na ipinahahayag ng “O” ang puwersang nag-uugnay at humahamon ng parirala.
- source_word: זְרוֹעַ
  choice: bisig
  rationale: Pinananatili ang kongkretong larawan ng bisig, na sagisag din ng lakas at kapangyarihan, sa halip na gawing tahasang “lakas.”
- source_word: כָּאֵל
  choice: na gaya ng sa Diyos
  rationale: 'Ang אֵל ay pinakamalamang na tumutukoy sa Diyos na nagsasalita sa konteksto. Ginagawang malinaw ng “sa Diyos” ang elipsis: isang bisig na gaya ng bisig ng Diyos.'
- source_word: לָךְ
  choice: mayroon ka bang
  rationale: Ang literal na “sa iyo” ay natural na isinasalin bilang pag-aari sa Filipino.
- source_word: וּבְקוֹל
  choice: at ... sa tinig
  rationale: Ipinahahayag ng “sa tinig” ang paraang ginagamit sa pagdagundong at maayos na inuugnay ang ikalawang hamon.
- source_word: כָּמֹהוּ
  choice: na gaya ng sa kanya
  rationale: Tumutukoy ang hulapi sa Diyos at inihahambing ang tinig ni Job sa tinig ng Diyos; pinananatili ng parirala ang ugnayang ito nang natural sa Filipino.
- source_word: תַרְעֵם
  choice: kaya mo bang dumagundong
  rationale: Ang Hiphil ng רעם ay nagpapahiwatig ng pagpapakulog o pagbigkas na parang kulog. Ang “dumagundong” ay natural at pinananatili ang larawan ng kulog at ang tanong tungkol sa kakayahan.
theological_decisions:
- issue: Ang tinutukoy ng אֵל sa paghahambing
  choice: Diyos
  alternative: isang diyos
  rationale: Sa agarang konteksto, ang Diyos ng Israel ang nagsasalita at inihahambing kay Job ang kanyang kapangyarihan at tinig. Gayunman, itinatala sa talababa ang gramatikal na posibleng ngunit di-gaanong malamang na pangkalahatang pagbasa.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang larawang “bisig” at ang tunog-kulog na “dumagundong,” habang iniwasan ang labis na literal na ayos na magiging malamya sa Tagalog.
