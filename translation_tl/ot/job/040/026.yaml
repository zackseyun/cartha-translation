  naturalness: Makabago at marangal ang kabuuang rehistro. Ang “Maipapasok mo ba ang lubid sa ilong niya?” ay mas natural at mas malinaw kaysa “Maisusuot mo ba ang isang lubid sa ilong niya?” sa kontekstong ito. Inayos rin ang ayos ng ikalawang sugnay upang mas natural ang daloy.
  terminology: Ang “lubid,” “kawit,” at “panga” ay angkop. Pinanatili ang mga talababa para sa reed/rush at cheek bilang leksikal na alternatibo. Nilinaw ang unang talababa nang hindi gumagamit ng hindi kinakailangang hiram na paglalarawan.
