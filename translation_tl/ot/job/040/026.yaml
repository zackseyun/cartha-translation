  register: Makabago at marangal na Filipino; pinanatili ang dalawang magkatugmang retorikal na tanong. Ginamit ang karaniwang “lubid,” “ilong,” “panga,” at “kawit,” habang inilalahad sa mga talababa ang mahahalagang leksikal na alternatibo.
