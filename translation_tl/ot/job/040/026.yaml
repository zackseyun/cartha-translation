  text: Can you put a rope through his nose[b][a], or pierce his jaw with a hook?
translation:
  language: tl
  text: Maipapasok mo ba ang lubid sa ilong niya[a], o mabubutas mo ba sa pamamagitan ng kawit ang panga niya[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “isang tambo sa ilong niya.” Ang salitang Hebreo ay literal na tumutukoy sa tambo o katulad na halaman, ngunit dito ay malamang na nangangahulugang lubid na yari rito.
    reason: lexical_alternative
  - marker: b
    text: O “pisngi niya” sa halip na “panga niya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתָשִׂים
  choice: Maisusuot mo ba
  rationale: Ang interrogative na הֲ at imperfect na תָשִׂים ay bumubuo ng retorikal na hamon tungkol sa kakayahan ni Job. Likas sa Filipino ang “Maisusuot mo ba” para sa pagpapadaan o pagkakabit ng lubid sa ilong.
- source_word: אַגְמוֹן
  choice: isang lubid
  rationale: Literal itong tambo o halamang-rush, ngunit sa konteksto ay malamang na lubid na yari sa naturang halaman at ginagamit sa pagpigil sa hayop. Ang “lubid” ang malinaw na functional equivalent.
- source_word: בְּאַפּוֹ
  choice: sa ilong niya
  rationale: Ang אַף ay ilong o butas ng ilong. Kasama ng pandiwang “isuot,” natural na ipinahihiwatig ng “sa ilong niya” ang pagpapadaan ng lubid rito nang hindi dinaragdagan ang detalye ng Hebreo.
- source_word: וּבְחוֹחַ
  choice: sa pamamagitan ng kawit
  rationale: Ang חוֹחַ ay maaaring tinik o kawit. Ang “kawit” ang pinakanaaangkop sa larawan ng pagbutas at pagpigil sa isang malaking hayop.
- source_word: תִּקּוֹב
  choice: mabubutas mo ba
  rationale: Ipinapahayag ng pandiwa ang pagbubutas o pagtagos. Pinananatili ng “mabubutas” ang retorikal na tanong at kongkretong larawan.
- source_word: לֶחֱיוֹ
  choice: ang panga niya
  rationale: Ang לְחִי ay maaaring panga o pisngi. Sa konteksto ng kawit na ginagamit sa pagpigil, “panga” ang mas malinaw na pangunahing salin, habang inilalagay sa talababa ang tunay na alternatibo.
