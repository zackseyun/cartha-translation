base_translation:
  language: en
  yaml_path: translation/ot/job/040/027.yaml
  text: Will he make many pleas to you[b][a], or will he speak soft words to you?
translation:
  language: tl
  text: Paulit-ulit ba siyang magsusumamo sa iyo[a], o magsasalita ba siya sa iyo ng malumanay na mga salita[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “makikiusap nang maraming ulit sa iyo.” Ang salitang Hebreo ay tumutukoy sa marubdob na paghingi ng pabor o awa.
    reason: lexical_alternative
  - marker: b
    text: O “banayad na mga salita.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲיַרְבֶּה
  choice: Paulit-ulit ba siyang
  rationale: Ipinahahayag ng Hiphil ng רבה ang pagpaparami. Kasama ng ‘magsusumamo,’ likas na ipinapahayag sa modernong Tagalog ng ‘paulit-ulit’ ang diwang maraming ulit na pagsusumamo; ang הֲ ay tinutumbasan ng tanong na ‘ba.’
- source_word: אֵלֶיךָ
  choice: sa iyo
  rationale: Ang אֶל na may hulaping ikalawang panauhang panlalaki at isahan ay nagpapahiwatig ng patutunguhan; natural itong ‘sa iyo’ sa Tagalog.
- source_word: תַּחֲנוּנִים
  choice: magsusumamo
  rationale: Ang pangngalan ay tumutukoy sa marubdob na paghingi ng pabor o awa. Ginawang pandiwa sa Tagalog upang makabuo ng malinaw at likas na pangungusap habang pinananatili ang diwa ng taimtim na pakiusap.
- source_word: אִם
  choice: o
  rationale: Sa magkatimbang na mga tanong dito, ipinakikilala ng אִם ang ikalawang posibilidad, kaya ‘o’ ang angkop kaysa kondisyunal na ‘kung.’
- source_word: יְדַבֵּר
  choice: magsasalita ba siya
  rationale: Ang Piel ng דבר ay karaniwang nangangahulugang ‘magsalita’; pinananatili rin ng anyong ito ang retorikal na tanong.
- source_word: רַכּוֹת
  choice: malumanay na mga salita
  rationale: Ang pambabaeng pangmaramihang pang-uri mula sa רך ay ginagamit bilang pangngalan at tumutukoy sa malumanay o banayad na pananalita. Nilinaw ang ipinahihiwatig na ‘mga salita’ nang hindi dinaragdagan ang diwa ng pambobola.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Ginamit ang ‘paulit-ulit’ upang idiomatikong maipahayag ang pagpaparami ng mga pagsusumamo, at pinanatili ang magkatimbang na retorikal na mga tanong.
