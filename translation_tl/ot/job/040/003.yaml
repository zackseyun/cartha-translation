lexical_decisions:
- source_word: וַיַּעַן
  choice: sumagot
  rationale: Ang Qal wayyiqtol ng ענה ay nagpapakilala sa tugon ni Job. Likas at marangal sa makabagong Tagalog ang “sumagot.”
- source_word: אִיּוֹב
  choice: Job
  rationale: Ginamit ang nakaugaliang anyo ng pangalang ito sa mga saling Tagalog.
- source_word: אֶת
  choice: '[hindi isinalin nang hiwalay]'
  rationale: Pananda ito ng tiyak na tuwirang layon sa Hebreo at walang hiwalay na katumbas sa Tagalog.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinumbasan ang Tetragrammaton bilang personal na pangalan ng Diyos, sa halip na palitan ito ng isang titulo.
- source_word: וַיֹּאמַר
  choice: at sinabi
  rationale: Ang Qal wayyiqtol ng אמר ay bahagi ng karaniwang pormulang Hebreo na “sumagot … at sinabi.” Pinanatili ang dalawang pandiwa upang maipakita ang kayarian ng pinagmulan.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; ang PANGINOON
  rationale: Personal na pangalan ang tahasang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang pangalan sa halip na palitan ito ng titulong “ang PANGINOON”; binabanggit sa talababa ang iba pang anyo.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang pormulang pansalita ng Hebreo na may dalawang pandiwa, kahit bahagya itong pormal sa Tagalog.
