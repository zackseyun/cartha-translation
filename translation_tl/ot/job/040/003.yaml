- from: Pagkatapos, sumagot si Job kay Yahweh at sinabi:[a]
  to: Pagkatapos ay sumagot si Job kay Yahweh at nagsabi:[a]
  rationale: Pinalitan ang “at sinabi” ng mas likas na “at nagsabi” nang hindi isinasantabi ang dobleng pandiwa ng Hebreo. Nilinaw ang talababa upang hindi nito tawaging alternatibo ang “Yahweh,” na ginagamit na sa pangunahing teksto, at upang maipakita nang wasto ang kaugnayan ng YHWH at ng tradisyonal na anyong “Jehovah.”
