    issue: Bahagyang hindi likas ang “at sinabi” bilang speech introducer.
    rationale: Mas idiomatiko sa modernong Tagalog ang “at nagsabi” bago ang tuwirang sipi, at pinananatili nito ang hiwalay na וַיֹּאמַר.
  - severity: low
    issue: Redundante at hindi ganap na malinaw ang talababa tungkol sa YHWH.
    rationale: Nasa pangunahing teksto na ang “Yahweh,” kaya hindi ito dapat ilahad lamang bilang alternatibo. Maaaring ipaliwanag ang YHWH bilang transliterasyon at banggitin ang “Jehovah” bilang tradisyonal na alternatibong anyo.
