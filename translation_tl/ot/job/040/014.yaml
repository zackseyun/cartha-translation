  yaml_path: translation/ot/job/040/014.yaml
  text: Then even I will praise you[a], because your right hand can save you.
translation:
  language: tl
  text: Kung magkagayon, pupurihin din kita, sapagkat maililigtas ka ng sarili mong kanang kamay.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “makapagligtas para sa iyong sarili”; may pang-ukol ang Hebreo na maaaring magpahiwatig ng kapakinabangan—“para sa iyo/para sa iyong sarili.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: Kung magkagayon, ... din
  rationale: Ipinagpapatuloy nito ang naunang hamon at ipinahihiwatig ang bunga kapag napatunayan ni Job na kaya niya iyon; pinananatili ng “din” ang diin ng גַם.
- source_word: אֲנִי
  choice: '[nakapaloob sa] pupurihin din kita'
  rationale: Likas sa Filipino na maipahayag sa anyong pandiwa ang unang panauhan; ang “din” at ang konteksto ang nagpapanatili sa diin na maging ang Diyos mismo ang pupuri.
- source_word: אוֹדְךָ
  choice: pupurihin kita
  rationale: Ang Hiphil ng ידה rito ay pagkilala sa pamamagitan ng papuri; ang “pupurihin” ay natural at akma sa mapagbigay-konsesyong konteksto.
- source_word: כִּי
  choice: sapagkat
  rationale: Malinaw nitong ipinakikilala ang dahilan ng naunang pahayag sa isang marangal ngunit kasalukuyang rehistro.
- source_word: תוֹשִׁיעַ
  choice: maililigtas
  rationale: Ang Hiphil ng ישׁע ay “magligtas/magligtas mula sa panganib.” Ang anyong may “mai-” ay nagpapahayag ng kakayahang pinatutunayan sa kondisyunal na hamon, hindi lamang ng hulang mangyayari.
- source_word: לְךָ
  choice: ka / para sa iyong sarili
  rationale: Sa pangunahing teksto, natural na layon ng “maililigtas” ang “ka”; ipinaliliwanag sa talababa ang posibleng diing kapakinabangan o reflexive na “para sa iyong sarili.”
- source_word: יְמִינְךָ
  choice: sarili mong kanang kamay
  rationale: Pinananatili ang kongkretong Hebreong larawan ng kanang kamay bilang lakas; nililinaw ng “sarili mong” na kay Job mismo ang kamay at kapangyarihang tinutukoy.
theological_decisions:
- issue: Antropomorpikong larawan ng kapangyarihan
  choice: maililigtas ka ng sarili mong kanang kamay
  alternative: maililigtas ka ng sarili mong lakas
  rationale: Pinananatili ang metaporang “kanang kamay” sa halip na palitan ito ng interpretasyong “lakas,” upang manatiling hayag ang orihinal na larawan.
- issue: Kakayahan o tiyak na pangyayari sa תוֹשִׁיעַ
  choice: maililigtas
  alternative: ililigtas
  rationale: Sa daloy ng kondisyunal na hamon, sinusubok ang kakayahan ni Job. Ang “maililigtas” ay mas natural na nagpapakita ng kakayahan nang hindi ginagawang simpleng prediksiyon ang pahayag.
- issue: Saklaw ng לְךָ
  choice: ka, na may talababa para sa “para sa iyong sarili”
  alternative: magligtas para sa iyong sarili
  rationale: Natural sa Filipino ang “maililigtas ka,” ngunit maaaring markahan ng לְךָ ang kapakinabangan o reflexive na diwa. Pinananatili sa talababa ang tunay na leksikal na alternatibo.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang larawang “kanang kamay,” habang ginamit ang natural na ayos na pandiwa bago ang tagaganap. Inilagay ang marker [a] kaagad pagkatapos ng sugnay na tinutukoy nito.
