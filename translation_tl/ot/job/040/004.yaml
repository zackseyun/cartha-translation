  yaml_path: translation/ot/job/040/004.yaml
  text: Look[a], I am insignificant; what can I answer you? I put my hand over my mouth.
translation:
  language: tl
  text: Narito[a], ako'y hamak; ano ang maitutugon ko sa iyo? Ipinatong ko ang aking kamay sa aking bibig.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Ako'y walang halaga”; ayon sa tradisyon, “Ako'y kasuklam-suklam.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Narito
  rationale: Ginagamit bilang pantawag-pansin na nagpapakilala sa biglang pagkilala ni Job; marangal at likas sa kasalukuyang salin-Bibliya nang hindi kasinluma ng ibang posibleng anyo.
- source_word: קַלֹּתִי
  choice: wala akong halaga
  rationale: Ang anyo mula sa קלל ay nagpapahiwatig ng pagiging maliit, hamak, o kakaunti ang halaga. Iniiwasan nito ang mas mabigat na moral na kahulugan ng 'masama' o 'kasuklam-suklam.'
- source_word: מָה אֲשִׁיבֶךָּ
  choice: ano ang maitutugon ko sa iyo?
  rationale: Pinananatili ang tuwirang tanong at ipinahihiwatig ng 'maitutugon' ang retorikal na kawalan ni Job ng maisasagot.
- source_word: יָדִי שַׂמְתִּי לְמוֹ פִי
  choice: Tinakpan ko ng kamay ang aking bibig
  rationale: Likas na idyomang Tagalog para sa literal na kilos ng paglalagay ng kamay sa ibabaw ng bibig, na nagpapahiwatig ng pananahimik.
theological_decisions:
- issue: Kung bibigyan ng moral na bigat ang paglalarawan ni Job sa sarili
  choice: wala akong halaga
  alternative: ako'y kasuklam-suklam; ako'y hamak
  rationale: Mas natural na tumutukoy ang Hebreo sa kaliitan o kawalang-halaga sa harap ng Diyos, hindi tahasang sa moral na kasamaan. Pinananatili nito ang pagpapakumbaba ni Job nang hindi dinaragdagan ang teolohikal na pahayag.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang 'maitutugon' para sa likas na retorikal na tanong, at ang kilos sa huling sugnay ay isinalin bilang karaniwang idyomang Tagalog.
