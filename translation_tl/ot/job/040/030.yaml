  source_fidelity: Tumpak sa pangkalahatan ang dalawang retorikal na tanong at ang komersiyal na pagbasa ng חַבָּרִים at כְּנַעֲנִים. Gayunman, ang "hahatiin ... sa mga negosyante" ay hindi sapat na naipapahayag ang בֵּין, na nangangahulugang pamamahagi sa loob o sa gitna ng isang pangkat.
  naturalness: Natural ang unang tanong, bagaman mas tuwiran ang "para sa kanya" sa diwa ng pakikipagtawaran hinggil sa pagkuha o pagbili sa nilalang. Hindi natural at bahagyang malabo sa modernong Filipino ang "Hahatiin ba nila siya sa mga negosyante?"; maaari itong mangahulugang paghahati sa mga negosyante bilang mga bagay na hinahati.
  terminology: Ang "mga mangangalakal" ay angkop para sa parehong komersiyal na pagbasa. Pinananatili ng talababa b ang literal na "mga Cananeo." Ang alternatibong talababa a ay dapat magpahiwatig ng pagdiriwang dahil sa kanya, hindi ng pagpipiging sa kanya bilang pagkain, sapagkat hindi tiyak ang mahirap na parirala.
