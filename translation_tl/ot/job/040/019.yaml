  naturalness: Mas natural sa makabagong Filipino ang “Tanging ang gumawa sa kanya ang makapaglalapit ng tabak niya” kaysa sa ayos na “ang gumawa sa kanya lamang.” Ang “tabak niya” ay likas at sinasadyang hindi tinutukoy nang tahasan kung kanino ang tabak.
