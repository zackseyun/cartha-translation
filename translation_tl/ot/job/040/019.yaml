  text: He is the first of the works of God[b][a]; only his Maker can bring near his sword.
translation:
  language: tl
  text: Siya ang pangunahin sa mga gawa ng Diyos[a]; tanging ang gumawa sa kanya ang makapaglalapit ng tabak niya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Siya ang una sa mga gawa ng Diyos,” o “Siya ang pangunahin sa mga daan ng Diyos.”
    reason: lexical_alternative
  - marker: b
    text: Mahirap unawain ang Hebreo sa huling sugnay. Maaari rin itong mangahulugang “tanging ang gumawa sa kanya ang makalalapit sa kanya na may tabak” o “binigyan siya ng gumawa sa kanya ng tabak.”
    reason: alternative_reading
lexical_decisions:
- source_word: רֵאשִׁית
  choice: pangunahin
  rationale: Sa konteksto ng Behemot, maaaring tumukoy ang salita sa kataasan ng ranggo o pangunguna, hindi lamang sa pagiging una ayon sa panahon. Likas sa Filipino ang “pangunahin” at hindi nito ipinipilit ang kronolohikal na diwa.
- source_word: דַּרְכֵי אֵל
  choice: sa mga gawa ng Diyos
  rationale: Bagaman literal na “mga daan ng Diyos,” sa konteksto ng paglalang ay tumutukoy ito sa mga kilos o gawa ng Diyos. Mas malinaw sa karaniwang mambabasa ang “mga gawa ng Diyos.”
- source_word: אֵל
  choice: Diyos
  rationale: Karaniwang titulong pantukoy sa Diyos ang אֵל dito, kaya ang payak at natural na salin ay “Diyos.”
- source_word: הָעֹשׂוֹ
  choice: ang gumawa sa kanya
  rationale: Tuwirang pinananatili nito ang anyong “ang isang gumawa sa kanya,” nang hindi nagpapasok ng dagdag na interpretasyon.
- source_word: יַגֵּשׁ
  choice: makapaglalapit
  rationale: Ang Hiphil ng נגשׁ ay karaniwang “maglapit” o “iharap.” Ginamit ang anyong may kakayahan upang maipahayag ang kontekstuwal na diin na ang gumawa lamang sa nilalang ang makagagawa nito, habang nananatiling malapit sa pandiwa.
- source_word: חַרְבּוֹ
  choice: tabak nito
  rationale: Ang hulaping panlalaking isahan ay literal na “kanyang tabak,” ngunit hindi tiyak kung ang tinutukoy ay tabak ng gumawa o ng nilalang. Ang “nito” ay inuugnay sa pinakamalapit na nilalang sa pangunahing pagbasa, habang ipinaliliwanag sa talababa ang ibang pagbasa.
theological_decisions:
- issue: Kahulugan ng mahirap na pangwakas na sugnay
  choice: ang gumawa sa kanya lamang ang makapaglalapit ng tabak nito
  alternative: ang gumawa sa kanya lamang ang makalalapit dito na may tabak; binigyan siya ng gumawa sa kanya ng tabak
  rationale: Napakasiksik at hindi tiyak ang sintaks ng Hebreo. Pinananatili ng pangunahing salin ang diwa ng “maglapit” at ang kalabuan ng pag-aari ng tabak hangga't maaari, samantalang inilalahad sa talababa ang dalawang pangunahing alternatibo nang hindi ginagawang tiyak ang alinman.
translation_notes:
  register: Makabagong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “pangunahin” upang likas na maipahayag ang posibleng primasiya ng רֵאשִׁית; inilagay kaagad ang bawat pananda ng talababa sa kaugnay na bahagi ng teksto.
