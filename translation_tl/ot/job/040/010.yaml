base_translation:
  language: en
  yaml_path: translation/ot/job/040/010.yaml
  text: Adorn yourself[a], please, with majesty and loftiness, and clothe yourself with splendor and honor.
translation:
  language: tl
  text: 'Palamutian mo nga ang iyong sarili[a] ng kadakilaan at kataasan,

    at bihisan mo ang iyong sarili ng karilagan at karangalan.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Palamutian mo ngayon ang iyong sarili ng pagmamataas at kataasan; bihisan mo ang iyong sarili ng kaluwalhatian at kamahalan.”
    reason: leksikal na alternatibo; pinananatili ang posibleng “ngayon” para sa נָא at ang ibang saklaw ng mga katawagang tumutukoy sa maringal na anyo.
lexical_decisions:
- source_word: עֲדֵה
  choice: Palamutian mo ang iyong sarili
  rationale: Tuwirang ipinahahayag ang utos na isuot sa sarili ang mga palamuti; natural din itong katambal ng “bihisan mo ang iyong sarili” sa ikalawang linya.
- source_word: נָא
  choice: nga
  rationale: Ang “nga” ay natural na panandang Filipino na nagbibigay-diin o himig ng paghiling/paghamon sa utos, nang hindi ito ginagawang magalang na pakiusap lamang.
- source_word: גָאוֹן
  choice: kadakilaan
  rationale: Sa hamon ng Diyos kay Job, tumutukoy ito sa maringal at mataas na kalagayan, hindi kinakailangang sa masamang pagmamataas.
- source_word: גֹּבַהּ
  choice: kataasan
  rationale: Pinananatili ang pangunahing larawan ng taas at ang kaugnay na diwa ng mataas na katayuan, nang hindi sapilitang nilalagyan ng negatibong kahulugan.
- source_word: הוֹד
  choice: karilagan
  rationale: Ipinahahayag ang nakikitang ningning at maringal na anyo, at naihihiwalay ang nuance nito sa “kadakilaan.”
- source_word: הָדָר
  choice: karangalan
  rationale: Ang salita ay maaaring tumukoy sa dangal, maringal na anyo, o kagandahan; ang “karangalan” ay angkop sa magkakaugnay na katangiang makahari sa taludtod.
- source_word: תִּלְבָּשׁ
  choice: bihisan mo ang iyong sarili
  rationale: Pinananatili ang tahasang metapora ng pananamit at ang pagpapatuloy ng puwersang pautos mula sa unang linya.
theological_decisions:
- issue: Kung ang גָאוֹן at גֹּבַהּ ay dapat unawain bilang masamang pagmamataas o bilang maringal na kadakilaan at kataasan
  choice: Ginamit ang “kadakilaan at kataasan,” na may positibo o neutral na diwa ng maringal na kapangyarihan.
  alternative: “Pagmamataas at kapalaluan,” na nagbibigay ng hayagang negatibong moral na diwa.
  rationale: Sa konteksto, hinahamon ng Diyos si Job na magtaglay ng maringal na anyo at kapangyarihang kaugnay ng banal na pamamahala. Ang paralelismo sa “karilagan at karangalan” ay pumapabor sa regal na diwa, bagaman maaaring magkaroon ng negatibong diwa ang mga salita sa ibang konteksto.
translation_notes:
  register: Makabagong Filipino na marangal at patula ngunit madaling maunawaan. Pinanatili ang dalawang magkatimbang na linya at ang metapora ng pagpapalamuti at pagbibihis. Ginamit ang “nga” upang natural na katawanin ang נָא sa hamong retorikal.
