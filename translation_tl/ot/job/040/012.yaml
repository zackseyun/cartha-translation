base_translation:
  language: en
  yaml_path: translation/ot/job/040/012.yaml
  text: Look on everyone who is proud[a], and humble him; and tread down the wicked where they stand.
translation:
  language: tl
  text: Tingnan mo ang bawat palalo at pababain mo siya; durugin mo ang masasama sa kinaroroonan nila.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa sarili nilang lugar.”
    reason: Pinananatili ang leksikal na alternatibo para sa תַּחְתָּם, na maaaring mangahulugang nasa kanilang lugar o kinaroroonan.
lexical_decisions:
- source_word: רְאֵה
  choice: Tingnan mo
  rationale: Ang pautos na anyo ng ראה ay humihiling kay Job na ituon ang pansin sa mga palalo bilang mga hahatulan.
- source_word: כָל גֵּאֶה
  choice: ang bawat palalo
  rationale: Ang כָל kasama ng pang-uring ginamit bilang pangngalan ay tumutukoy sa bawat taong palalo; maikli at likas ito sa modernong Tagalog.
- source_word: הַכְנִיעֵהוּ
  choice: ibaba mo siya
  rationale: Ang Hiphil na pautos ng כנע ay nangangahulugang pababain o dalhin sa mababang kalagayan ang palalo. Pinananatili ng salin ang konkretong larawan at ang kaibahan ng kapalaluan at pagpapababa.
- source_word: וַהֲדֹךְ
  choice: durugin mo
  rationale: Sa konteksto ng paghatol, ang pandiwa ay nagpapahiwatig ng marahas at ganap na paggapi; malinaw at tuwiran ang “durugin” nang hindi dinaragdagan ang diwa.
- source_word: רְשָׁעִים
  choice: ang masasama
  rationale: Karaniwang katawagan ito sa mga taong masama bilang isang moral na pangkat at natural sa modernong Tagalog.
- source_word: תַּחְתָּם
  choice: sa kinaroroonan nila
  rationale: Maaaring tumukoy ang תחתם sa kanilang lugar o mismong kinaroroonan. Pinananatili ng parirala ang lokatibong diwa nang hindi ipinapalagay na literal na nasa ilalim nila.
theological_decisions:
- issue: Kalikasan ng utos kay Job
  choice: Pinanatili ang tuwirang pautos bilang bahagi ng hamon ng Diyos kay Job.
  alternative: Gawing tahasang pasubali ang utos, o ipahiwatig na talagang binibigyan si Job ng kapangyarihang humatol.
  rationale: Sa konteksto, inilalahad ng Diyos ang mga gawa ng pamamahala at paghatol bilang hamon kay Job. Hindi dapat alisin ang lakas ng pautos, ngunit hindi rin dapat idagdag na aktuwal na ipinagkakaloob kay Job ang banal na awtoridad.
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran, marangal, at madaling maunawaan. Ginamit ang “palalo” upang mapanatili ang matinding moral na diwa ng גאה, at ang magkatugmang pautos na “ibaba” at “durugin” upang ihatid ang diin ng Hebreo.
