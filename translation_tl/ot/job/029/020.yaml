  text: My glory was ever fresh with me[b][a], and my bow was renewed in my hand.
translation:
  language: tl
  text: Ang aking karangalan ay nanatiling sariwa sa akin[a], at ang aking busog[b] ay patuloy na napapanibago sa aking kamay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “Ang aking karangalan ay bago sa akin.” Ang pang-uring Hebreo ay literal na “bago,” ngunit sa konteksto ay malamang na nangangahulugang patuloy na sariwa o hindi kumukupas.
    reason: lexical_alternative
  - marker: b
    text: Malamang na larawan ng lakas o sigla ang “busog,” ngunit pinananatili rito ang kongkretong larawan ng Hebreo.
    reason: cultural_note
lexical_decisions:
- source_word: כְּבוֹדִי
  choice: aking karangalan
  rationale: Maaaring tumukoy ang כָּבוֹד sa kaluwalhatian, karangalan, o dignidad. Sa konteksto ng dating katayuan ni Job sa lipunan, natural ang “karangalan” at hindi nito nililimitahan ang salita sa panlabas na ningning lamang.
- source_word: חָדָשׁ
  choice: laging nananatiling sariwa
  rationale: Literal itong “bago,” ngunit dito ay inilalarawan ang karangalan bilang hindi kumukupas at patuloy na sariwa. Pinananatili ng salin ang larawang “sariwa” habang ipinahihiwatig ang pagpapatuloy.
- source_word: עִמָּדִי
  choice: sa akin
  rationale: Pinananatili nito ang literal na diwang “kasama ko” at ipinahihiwatig na hindi humihiwalay kay Job ang kanyang karangalan.
- source_word: קַשְׁתִּי
  choice: aking busog
  rationale: Ang salita ay literal na “aking busog.” Maaaring sagisag ito ng lakas o sigla, ngunit pinananatili sa pangunahing teksto ang kongkretong larawan ng Hebreo.
- source_word: בְּיָדִי
  choice: sa aking kamay
  rationale: Direktang pinananatili ang lokatibong larawan ng busog na hawak at handang gamitin.
- source_word: תַחֲלִיף
  choice: patuloy na napapanibago
  rationale: Ang pandiwa mula sa חלף ay may diwa rito ng muling pagpapasariwa o pagpapanibago. Ang aspektong di-ganap ng pandiwa at ang paralelismo sa unang linya ay angkop na ipinahahayag ng “patuloy na napapanibago.”
