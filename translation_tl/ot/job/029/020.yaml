translation_notes:
  register: Makabagong Filipino na marangal at madaling maunawaan. Pinanatili ang mga konkretong larawang “sariwa,” “busog,” at “kamay,” habang ginawang natural ang pagpapahayag ng patuloy na kalagayan.
