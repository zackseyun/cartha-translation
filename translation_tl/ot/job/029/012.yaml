  text: For I delivered the poor who cried for help[a], and the fatherless who had no helper.
translation:
  language: tl
  text: Sapagkat sinasagip ko ang dukhang dumaraing, at ang ulila sa ama[a] na walang tumutulong sa kanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ulila.” Ang salitang Hebreo ay mas tiyak na tumutukoy sa isang walang ama, isang taong mahina ang katayuan sa lipunan.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikilala nito ang dahilan ng paggalang na tinanggap ni Job sa nakapaligid na konteksto.
- source_word: אֲמַלֵּט
  choice: inililigtas ko
  rationale: Ang Piel ng מלט ay nagpapahayag ng aktibong pagsagip o pagliligtas. Ang aspektong di-ganap ay angkop sa paulit-ulit na gawain ni Job na inaalala niya.
- source_word: עָנִי
  choice: ang dukha
  rationale: Tumutukoy ito sa isang mahirap o api; malinaw na ipinahahayag ng “dukha” ang kahinaan niya sa kontekstong panlipunan.
- source_word: מְשַׁוֵּעַ
  choice: sumisigaw para humingi ng tulong
  rationale: Pinananatili nito kapwa ang aktibong pagsigaw at ang layuning makahingi ng saklolo na ipinahihiwatig ng participle.
- source_word: יָתוֹם
  choice: ang ulila sa ama
  rationale: Mas tiyak itong tumutugma sa salitang Hebreo, na karaniwang tumutukoy sa isang nawalan ng ama at dahil dito ay mahina sa lipunan.
- source_word: וְלֹא עֹזֵר לוֹ
  choice: na walang tumutulong sa kanya
  rationale: Natural itong Tagalog at malinaw na inilalarawan ang ulila bilang walang sinumang nagbibigay ng tulong.
