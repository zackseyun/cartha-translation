  text: Then I said[a], ‘I will die in my nest, and I will multiply my days like the sand.’
translation:
  language: tl
  text: Noon ay sinabi ko, ‘Mamamatay ako sa aking pugad, at pararamihin ko ang aking mga araw na gaya ng buhangin.’[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O maaaring, “at pararamihin ko ang aking mga araw na gaya ng phoenix.” Itinuturing ng ilan na pangalan ng isang ibon ang salitang Hebreo na isinaling “buhangin” dito, ngunit mas malamang sa kontekstong ito ang “buhangin” at kaayon ito ng karaniwang larawang biblikal para sa napakaraming bilang.
    reason: alternative_reading
lexical_decisions:
- source_word: וָאֹמַר
  choice: Kaya sinabi ko
  rationale: Ipinagpapatuloy ng waw ang paggunita ni Job at ipinakikitang ito ang naging konklusyon niya batay sa dating katiwasayan; natural sa Filipino ang “Kaya sinabi ko.”
- source_word: עִם קִנִּי
  choice: sa aking pugad
  rationale: Bagaman karaniwang nangangahulugang “kasama” ang עִם, sa larawang ito ay tumutukoy ito sa pagkamatay sa sariling pugad. Pinananatili ng “pugad” ang matalinghagang larawan ng tahanan, seguridad, at kapanatagan.
- source_word: אֶגְוָע
  choice: Mamamatay ako
  rationale: Tuwirang ipinapahayag ng pandiwa ang pagkamatay; malinaw at likas sa modernong Filipino ang salin.
- source_word: וְכַחוֹל
  choice: na gaya ng buhangin
  rationale: Ang karaniwang kahulugan ng חוֹל ay “buhangin,” at ang larawan nito ay ang napakaraming bilang. May di-tiyak na alternatibong pagbasa bilang pangalan ng isang ibon, kaya inilagay iyon sa talababa.
- source_word: אַרְבֶּה יָמִים
  choice: pararamihin ko ang aking mga araw
  rationale: Pinananatili ng “pararamihin” ang causative na anyo ng רבה at ng “aking mga araw” ang idyomang tumutukoy sa mahabang buhay.
theological_decisions:
- issue: Kung ang חוֹל ay “buhangin” o pangalan ng ibong phoenix
  choice: buhangin
  alternative: phoenix
  rationale: “Buhangin” ang karaniwang leksikal na kahulugan at akma sa biblikal na larawan ng napakaraming bilang. Totoong umiiral ngunit di-tiyak ang pagbasa bilang ibon, kaya hindi ito isinara at iniulat sa talababa.
translation_notes:
  register: Makabagong Filipino na marangal at madaling maunawaan. Pinanatili ang poetikong “pugad” sa halip na gawing “tahanan,” at ang bahagyang biblikal na idyomang “aking mga araw” para sa haba ng buhay.
