  text: I broke the fangs of the unrighteous, and from his teeth I threw the prey.
translation:
  language: tl
  text: 'Binali ko ang mga pangil ng taong masama,

    at inihagis ko ang nasila mula sa kanyang mga ngipin.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאֲשַׁבְּרָה
  choice: Binali ko
  rationale: Tuwirang ipinapahayag ang ganap at marahas na pagkilos ng Hebreong שׁבר, at natural ito sa Filipino kapag pangil ang layon.
- source_word: מְתַלְּעוֹת
  choice: mga pangil
  rationale: Ang salita ay tumutukoy sa mga panga o matitinding ngipin; ang 'mga pangil' ang malinaw at matalinghagang katumbas sa larawan ng mandaragit.
- source_word: עַוָּל
  choice: taong liko
  rationale: Tinutukoy nito ang taong gumagawa ng kawalang-katarungan o kasamaan. Pinananatili ng 'taong liko' ang moral at hudisyal na diwa nang hindi nagdaragdag ng denominasyonal na pakahulugan.
- source_word: וּמִשִּׁנָּיו
  choice: at mula sa mga ngipin niya
  rationale: Pinananatili ang kongkretong larawan at ang panlalaking isahan ng tekstong Hebreo.
- source_word: אַשְׁלִיךְ
  choice: inagaw ko
  rationale: Bagaman karaniwang nangangahulugang 'ihagis' o 'itapon' ang pandiwa, sa kontekstong pagkuha ng nasila mula sa mga ngipin ay likas sa Filipino ang 'inagaw,' na naghahatid ng puwersahang pagliligtas nang hindi binabago ang kinalabasan.
- source_word: טָרֶף
  choice: ang nasila
  rationale: Maaaring tumukoy sa sinila o biktimang hawak ng mandaragit. Ang 'nasila' ay maikli at pinananatili ang talinghagang hayop.
theological_decisions:
- issue: Paglalarawan sa paghatol at pagliligtas ni Job
  choice: Pinanatili ang talinghaga ng pagbali sa pangil at pag-agaw sa nasila.
  alternative: Ipaliwanag nang tuwiran bilang pagpapahinto sa mapang-api at pagliligtas sa biktima.
  rationale: Ang orihinal ay gumagamit ng matinding larawang mandaragit. Hindi dapat palitan ng interpretatibong paliwanag ang mismong talinghaga.
- issue: Saklaw ng עַוָּל
  choice: taong liko
  alternative: masama / di-matuwid / mapang-api
  rationale: Ang konteksto ay may hudisyal at panlipunang kawalang-katarungan, ngunit hindi tahasang nililimitahan ng salita ang tao sa isang uri ng pang-aapi. Ang salin ay nag-iiwan ng sapat na lawak.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Gumamit ng malinaw na paralelismo at kongkretong talinghaga; walang idinagdag na paliwanag o footnote marker.
