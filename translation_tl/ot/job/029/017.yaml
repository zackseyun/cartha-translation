  terminology: Ang “mga pangil” at “nasila” ay angkop sa larawang mandaragit. Pinalitan ang “taong liko” ng “taong masama” upang masaklaw nang likas ang “di-matuwid/masamang tao” nang hindi nililimitahan ang kahulugan sa partikular na anyo ng pang-aapi.
