  source_fidelity: 'Tapat ang salin sa dalawang paralelong sugnay. Ang “Natahimik” ay wastong idyomatikong pagsasalin ng נֶחְבָּאוּ kapag ang “tinig” ang tinutukoy: ang mga tinig ay hindi na marinig. Napananatili rin ng “dumikit ang kanilang dila sa ngalangala” ang pisikal at makatang larawan ng Hebreo nang hindi dinadagdagan ang kahulugan.'
