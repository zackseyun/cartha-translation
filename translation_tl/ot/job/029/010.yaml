  yaml_path: translation/ot/job/029/010.yaml
  text: The voice of nobles was hushed[b][a], and their tongue stuck to the roof of their mouth.
translation:
  language: tl
  text: Natahimik ang tinig ng mga pinuno,[a] at dumikit ang kanilang dila sa ngalangala.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Hindi na narinig ang tinig ng mga pinuno.” Sa literal, “nagtago ang tinig ng mga pinuno.”
    reason: lexical_alternative
  - marker: b
    text: Ang pagdikit ng dila sa ngalangala ay larawang nagpapahiwatig ng hindi makapagsalita o hindi pagsasalita.
    reason: lexical_alternative
lexical_decisions:
- source_word: קוֹל
  choice: tinig
  rationale: Ang “tinig” ang likas na katumbas kapag tao ang nagsasalita at tumutukoy rito sa pananalitang hindi na narinig.
- source_word: נְגִידִים
  choice: mga pinuno
  rationale: Maaaring tumukoy ang salita sa mga prinsipe, maharlika, o namumuno. Ang “mga pinuno” ay malawak at natural, at hindi naglilimita sa konteksto sa monarkiya.
- source_word: נֶחְבָּאוּ
  choice: natahimik
  rationale: Pangunahing larawan ng pandiwa ang pagtatago o pagkawala sa pandinig; kapag “tinig” ang simuno, ipinahihiwatig nitong hindi na ito narinig. Pinananatili ng “natahimik” ang diwa sa natural na Tagalog.
- source_word: וּלְשׁוֹנָם
  choice: ang kanilang dila
  rationale: Pinananatili ang kolektibong isahan ng Hebreo, na natural din sa Tagalog sa pariralang “ang kanilang dila.”
- source_word: לְחִכָּם
  choice: sa ngalangala
  rationale: Ang חֵךְ ay tumutukoy sa palate o bubong ng bibig; “ngalangala” ang tiyak at maikling katumbas sa Tagalog.
- source_word: דָּבֵקָה
  choice: dumikit
  rationale: Tuwirang ipinapahayag ng pandiwa ang pagdikit o pagkapit ng dila sa ngalangala, isang makatang larawan ng hindi makapagsalita o ayaw magsalita.
