  yaml_path: translation/ot/job/029/022.yaml
  text: After my words they did not speak again[b][a], and my word dripped upon them.
translation:
  language: tl
  text: Pagkatapos kong magsalita, hindi na sila sumagot[a]; at ang salita ko ay pumatak sa kanila[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “hindi na sila nagsalita.” Maaari ring ipahiwatig ng pandiwang Hebreo na hindi na sila umulit o tumugon matapos magsalita si Job.
    reason: lexical_alternative
  - marker: b
    text: Literal na “ang salita ko ay pumatak sa kanila”—isang patulang larawan ng pananalitang dumarating sa mga tagapakinig na gaya ng mga patak.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֲרֵי דְבָרִי
  choice: Pagkatapos kong magsalita
  rationale: Likas sa makabagong Tagalog at malinaw na ipinahahayag ang panahong kasunod ng mga salita ni Job, bagaman hindi pinananatili ang literal na pangngalang maramihan.
- source_word: לֹא יִשְׁנוּ
  choice: hindi na sila sumagot
  rationale: Sa konteksto ng paghihintay ng mga tagapakinig sa pagsasalita ni Job, malamang na tumutukoy ito sa hindi na nila muling pagtugon; inilalahad sa talababa ang mas malawak na posibilidad na hindi na sila nagsalita.
- source_word: וְעָלֵימוֹ
  choice: sa kanila
  rationale: Karaniwang Tagalog na katumbas ng pang-ukol na עַל sa larawang ang salita ay pumapatak sa mga nakikinig.
- source_word: תִּטֹּף
  choice: pumatak
  rationale: Pinananatili ang matingkad na patulang larawan ng pagtulo o pagpatak sa halip na ipaliwanag ang epekto ng pananalita.
- source_word: מִלָּתִי
  choice: ang salita ko
  rationale: Pinananatili ang isahang anyo ng Hebreo at ang kaibhan nito sa naunang דְבָרִי.
