- from: Hinintay nila ako gaya ng paghihintay sa ulan, at ibinuka nila nang maluwang ang kanilang bibig para sa ulan sa huling bahagi ng panahon.[a]
  to: Kung paanong hinihintay ang ulan, gayon nila ako hinintay; ibinuka nila nang maluwang ang kanilang bibig para sa huling pana-panahong ulan.[a]
  rationale: Pinagaan ang paghahambing upang maging likas sa makabagong Filipino habang pinananatili ang tahasang “ako” at ang larawan ng paghihintay sa ulan. Pinalitan ang malabong “ulan sa huling bahagi ng panahon” ng terminong mas tumpak sa pana-panahong kahulugan ng מַלְקוֹשׁ; pinanatili sa talababa ang mga leksikal na alternatibo.
