  yaml_path: translation/ot/job/029/023.yaml
  text: They waited for me as for the rain[a], and they opened their mouths wide for the spring rain.
translation:
  language: tl
  text: Kung paanong hinihintay ang ulan, gayon nila ako hinintay; ibinuka nila nang maluwang ang kanilang bibig para sa huling pana-panahong ulan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “huling ulan,” “huling-siklong ulan,” o “ulan sa tagsibol.” Ang salitang Hebreo na מַלְקוֹשׁ ay tumutukoy sa huling pana-panahong ulan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִחֲלוּ
  choice: Hinintay nila
  rationale: Ang יחל ay nagpapahiwatig ng paghihintay na may pag-asa o pananabik. Ang “hinintay” ay likas sa Filipino at hindi nagdaragdag ng labis na damdaming wala sa tahasang anyo.
- source_word: כַמָּטָר
  choice: gaya ng paghihintay sa ulan
  rationale: Ipinahahayag ng כ ang paghahambing. Nilinaw sa Filipino ang ipinahihiwatig na paghihintay upang maging natural ang paghahambing nang hindi binabago ang larawan.
- source_word: לִי
  choice: ako
  rationale: Tahasang panghalip ang nasa Hebreo. Hindi ito pinalitan ng “aking salita” o “aking payo,” bagaman iyon ang ipinahihiwatig ng konteksto.
- source_word: וּפִיהֶם פָּעֲרוּ
  choice: at ibinuka nila nang maluwang ang kanilang bibig
  rationale: Ang פער ay nangangahulugang ibuka nang maluwang. Pinanatili ang konkretong larawang naghihintay na tumanggap ng ulan.
- source_word: לְמַלְקוֹשׁ
  choice: para sa ulan sa huling bahagi ng panahon
  rationale: Ang מַלְקוֹשׁ ay ang huling pana-panahong ulan sa siklong agrikultural. Mas malinaw ito sa pangkalahatang mambabasang Filipino kaysa sa literal ngunit maaaring malabong “huling ulan.”
theological_decisions: []
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang matalinghagang paghihintay sa ulan at ang tahasang “ako,” sa halip na ipaliwanag ito bilang salita o payo ni Job.
