translation:
  language: tl
  text: nang magliwanag ang kanyang ilawan sa ibabaw ng aking ulo, at sa kanyang liwanag ay lumakad ako sa kadiliman.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “at sa liwanag nito ay lumakad ako sa kadiliman.” Ang hulaping Hebreo sa “kanyang liwanag” ay maaaring tumukoy sa Diyos ayon sa konteksto o, sa mas agarang pagbasa, sa ilawan.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּהִלּוֹ נֵרוֹ
  choice: nang magliwanag ang kanyang ilawan
  rationale: Ang בְּ na kasunod ng infinitive construct ay temporal dito. Pinananatili ng “ilawan” ang kongkretong larawan ng נֵר, at ang hulaping panlalaki ay likas na tumutukoy sa Diyos ayon sa konteksto.
- source_word: עֲלֵי רֹאשִׁי
  choice: sa ibabaw ng aking ulo
  rationale: Tuwirang spatial ang parirala at natural sa modernong Filipino; ipinapakita nito ang ilawang nagbibigay-liwanag mula sa itaas.
- source_word: לְאוֹרוֹ
  choice: sa kanyang liwanag
  rationale: Ipinahahayag ng לְ ang paggabay o kalagayang dulot ng liwanag. Ang “kanyang” ay tumutukoy sa Diyos sa mas malawak na konteksto, bagaman maaari ring iugnay ang hulapi sa ilawan.
- source_word: אֵלֶךְ
  choice: lumakad ako
  rationale: Bagaman imperfect ang anyo, inilalarawan nito ang nakaraang karanasan ni Job sa mapagbalik-tanaw na konteksto.
- source_word: חֹשֶׁךְ
  choice: sa gitna ng kadiliman
  rationale: Walang tahasang pang-ukol sa Hebreo. Ang pariralang ito ay natural sa Filipino at pinananatili ang larawan ng paglakad habang napaliligiran ng dilim nang hindi labis na tinutukoy kung papasok o tatawid dito.
theological_decisions:
- issue: Tinutukoy ng mga hulaping 3ms sa “kanyang ilawan” at “kanyang liwanag”
  choice: Ang mga ito ay tumutukoy sa Diyos, na ang paglingap at paggabay ay ginugunita ni Job.
  alternative: Ang hulapi sa “liwanag nito” ay maaaring agarang tumukoy sa ilawan.
  rationale: Ang nakapaligid na konteksto ay tungkol sa pag-iingat at paglingap ng Diyos kay Job. Gayunman, dahil malapit ang “liwanag” sa “ilawan,” pinananatili sa talababa ang tunay na posibilidad ng ibang pagtukoy.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Pinanatili ang kongkretong “ilawan,” ang personal na pagtukoy sa Diyos, at ang kalabuan ng hulaping Hebreo sa pamamagitan ng talababa.
