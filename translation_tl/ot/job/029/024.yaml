  register: Makabago at marangal na Filipino ang ginamit. Ang “kapag” ay nagpapakita ng paulit-ulit o nakagawiang kilos sa pagbabalik-tanaw ni Job. Pinanatili ang imahen ng liwanag ng mukha, ngunit ginawang natural ang pandiwang kaugnay nito.
