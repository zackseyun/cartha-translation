translation:
  language: tl
  text: Ngumingiti ako sa kanila—hindi sila makapaniwala[a]; at hindi nila pinapawi ang liwanag ng aking mukha.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring, “Tumatawa ako sa kanila, at hindi sila naniniwala.” Maaaring ipinahihiwatig ng Hebreo ang kanilang pagkamangha sa kagandahang-loob o mapagpalang pagtingin ni Job.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “hindi nila pinababagsak ang liwanag ng aking mukha.” Ang “liwanag ng mukha” ay larawan ng maaliwalas o mapagpalang ekspresyon.
    reason: cultural_note
lexical_decisions:
- source_word: אֶשְׂחַק
  choice: ngumingiti ako
  rationale: Maaaring mangahulugan ang pandiwang שׂחק ng pagtawa o pagngiti. Sa konteksto ng marangal at magiliw na pakikitungo ni Job, mas likas ang “ngumingiti,” habang pinananatili sa talababa ang alternatibong “tumatawa.”
- source_word: אֲלֵהֶם
  choice: sa kanila
  rationale: Ipinahihiwatig ng pang-ukol na אֶל ang direksiyon ng ngiti patungo sa mga tao; “sa kanila” ang natural na katumbas sa Tagalog.
- source_word: לֹא יַאֲמִינוּ
  choice: hindi sila makapaniwala
  rationale: Literal itong “hindi sila naniniwala,” ngunit sa konteksto ay malamang na nagpapahayag ng kanilang pagkabigla o pagkamangha sa paborableng pagtingin ni Job. Ang “hindi makapaniwala” ay natural sa Tagalog at hindi ginagawang tahasang proposisyon ang kanilang hindi paniniwala.
- source_word: וְאוֹר פָּנַי
  choice: ang liwanag ng aking mukha
  rationale: Pinananatili nito ang konkretong larawang Hebreo para sa maaliwalas, magiliw, o paborableng ekspresyon.
- source_word: לֹא יַפִּילוּן
  choice: hindi nila napapawi
  rationale: Ang Hiphil ng נפל ay literal na “hindi nila pinababagsak.” Dahil liwanag ang layon, ipinahahayag ng “napapawi” sa natural na Tagalog ang pagkawala o paglabo ng maaliwalas na ekspresyon habang pinananatili ang metapora ng liwanag.
