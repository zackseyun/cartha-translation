translation_notes:
  register: Makabago ngunit marangal na Filipino ang ginamit. Ang mga pandiwang nasa aspektong imperpektibo—“pinipili,” “nauupo,” at “nananahan”—ay naghahayag ng nakagawiang kilos sa panahong ginugunita ni Job. Iniwasan ang sobrang militar na pagbasa sa גְּדוּד sa pangunahing teksto, ngunit inilagay ang mga alternatibo sa talababa.
