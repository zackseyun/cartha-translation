  text: I chose their way and sat as chief[a]; I dwelt like a king among the troops[c][b], like one who comforts mourners.
translation:
  language: tl
  text: Pinili ko ang kanilang landas at naupo ako bilang pinuno[a]; nanahan akong parang hari sa gitna ng isang pangkat[b], gaya ng isang umaaliw sa mga nagdadalamhati.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Pinili ko ang kanilang tatahaking landas at naupo ako sa pangunahing puwesto.” Maaaring tumukoy ang Hebreo sa pagpili o pagsang-ayon ni Job sa landas na dapat tahakin ng iba at pagkatapos ay sa pag-upo niya bilang kanilang pinuno.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “na parang hari sa gitna ng hukbo” o “sa isang pulutong.” Ang Hebreong גְּדוּד ay maaaring tumukoy sa hukbo, pulutong, o pangkat.
    reason: lexical_alternative
  - marker: c
    text: Mahirap unawain ang huling paghahambing. Maaaring ang ibig sabihin ng Hebreo ay “gaya ng isang umaaliw sa mga nagdadalamhati,” na nagdiriin sa papel ni Job bilang tagapag-aliw kahit nasa marangal siyang kalagayan.
    reason: textual_or_syntactic_difficulty
lexical_decisions:
- source_word: אֶבֲחַר דַּרְכָּם
  choice: Pinipili ko ang kanilang landas
  rationale: Ang Qal imperfect na אֶבֲחַר ay maaaring magpahayag ng nakagawiang kilos sa pagbabalik-tanaw ng Job 29. Ang “pinipili ko” ay likas sa Filipino para sa paulit-ulit na gawain noon at pinananatili ang diwa ng pagpili o pagpapasiya sa landas na tatahakin nila.
- source_word: וְאֵשֵׁב רֹאשׁ
  choice: at nauupo bilang pinuno
  rationale: Pinananatili ng “nauupo” ang kongkretong larawan ng ישב, samantalang ipinahahayag ng “bilang pinuno” ang idyomatikong kahulugan ng רֹאשׁ bilang nangungunang katayuan.
- source_word: וְאֶשְׁכּוֹן
  choice: nananahan ako
  rationale: Ang שכן ay nangangahulugang manahan o mamalagi. Ang “nananahan” ay angkop sa marangal na himig ng tula at hindi nito nililinaw nang labis kung pisikal na paninirahan o matatag na presensiya ang tinutukoy.
- source_word: כְּמֶלֶךְ
  choice: na parang hari
  rationale: Malinaw na pinananatili ng “parang” ang paghahambing na ipinahihiwatig ng prefiks na כ.
- source_word: בַּגְּדוּד
  choice: sa gitna ng isang pangkat
  rationale: Maaaring tumukoy ang גְּדוּד sa hukbo, pulutong, o pangkat. Pinili ang mas malawak na “pangkat” upang hindi agad ipasiya na militar ang eksena, habang ang “sa gitna” ay natural na paglalarawan sa prominenteng presensiya ng hari.
- source_word: כַּאֲשֶׁר אֲבֵלִים יְנַחֵם
  choice: gaya ng isang umaaliw sa mga nagdadalamhati
  rationale: Ginagawang malinaw ng “isang umaaliw” ang di-tahasang isahang paksa ng יְנַחֵם, habang tapat na isinasalin ang אֲבֵלִים bilang mga taong nagdadalamhati at ang Piel ng נחם bilang pag-aliw.
