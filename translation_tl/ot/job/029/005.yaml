  text: when the Almighty was still with me[a], and my young men were around me,
translation:
  language: tl
  text: 'noong kasama ko pa ang Makapangyarihan sa Lahat,

    at nasa paligid ko ang aking mga binata.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang aking mga tagapaglingkod.” Maaaring tumukoy ang Hebreong נְעָרַי sa “aking mga binata,” “aking mga tagapaglingkod,” o “aking mga utusan,” ayon sa konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּעוֹד
  choice: noong ... pa
  rationale: Ipinahahayag ng בְּעוֹד ang nagpapatuloy na kalagayan sa nakaraan na ngayo'y natapos na; likas itong naipapahayag sa Filipino sa hulmahang “noong ... pa.”
- source_word: שַׁדַּי
  choice: ang Makapangyarihan sa Lahat
  rationale: Isinalin ang banal na titulong שַׁדַּי sa malinaw at kinikilalang katawagan sa Filipino sa halip na tumbasan lamang ito bilang “Shaddai.”
- source_word: עִמָּדִי
  choice: kasama ko
  rationale: Tuwirang ipinahahayag nito ang presensya o pakikisama; mas natural dito ang “kasama ko” kaysa “nasa tabi ko.”
- source_word: סְבִיבוֹתַי
  choice: nasa paligid ko
  rationale: Pinananatili nito ang ideya ng mga taong nakapaligid kay Job sa natural na Filipino.
- source_word: נְעָרַי
  choice: aking mga binata
  rationale: Maaaring tumukoy ang נַעַר sa mga binata, tagapaglingkod, o mga utusan. Pinananatili ng “mga binata” ang pangunahing leksikal na diwa nang hindi tiyakang ipinapalagay ang kanilang katayuang panlipunan.
theological_decisions: []
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “noong ... pa” upang natural na maipakita ang masayang kalagayan sa nakaraan na inaalala ni Job. Inilagay ang pananda ng talababa pagkatapos ng pariralang may leksikal na alternatibo.
