  yaml_path: translation/ot/job/029/015.yaml
  text: I was eyes to the blind[a], and feet to the lame.
translation:
  language: tl
  text: Naging mga mata ako para sa bulag[a], at naging mga paa ako para sa pilay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, sa mas malayang pagpapahayag, “Para akong mga mata ng bulag at mga paa ng pilay.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵינַיִם
  choice: mga mata
  rationale: Pinananatili ang kongkretong talinghaga ng Hebreo, na tumutukoy sa paggabay at praktikal na pagtulong.
- source_word: הָיִיתִי
  choice: naging … ako
  rationale: Ang Qal perfect 1cs ng היה ay tumutukoy sa ginampanang papel ni Job noong nakaraan; natural sa Filipino ang “naging … ako.”
- source_word: לַעִוֵּר
  choice: para sa bulag
  rationale: Ang ל ay nagpapahiwatig ng kaugnayan o kapakinabangan. Ang pang-isahang “bulag” ay pinananatili upang huwag lampasan ang anyo ng Hebreo, bagaman maaari itong kumatawan sa isang uri ng tao.
- source_word: וְרַגְלַיִם
  choice: at naging mga paa
  rationale: Inulit ang “naging” sa Filipino para sa malinaw at natural na paralelismo habang pinananatili ang larawan ng pagbibigay ng kakayahang makakilos o suporta.
- source_word: לַפִּסֵּחַ
  choice: para sa pilay
  rationale: Ang “pilay” ay isang malinaw at karaniwang makabagong salitang Filipino para sa taong may kapansanan sa paglakad, nang hindi gumagamit ng mas mapanlait na katawagan.
- source_word: אָֽנִי
  choice: ako
  rationale: Ang malayang panghalip ay nagbibigay-diin sa paksa. Sa natural na Filipino, ang hulíng “ako” sa “naging … ako” ay sapat na nagpapahayag ng diin nang hindi nagdaragdag ng alanganing “ako mismo.”
