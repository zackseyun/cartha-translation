  text: They listened to me and waited[b][a], and they kept silent for my counsel.
translation:
  language: tl
  text: Nakinig sila sa akin at naghintay[a]; nanahimik sila sa harap ng payo ko.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “naghintay nang may pananabik.” Maaari ring magpahiwatig ang pandiwa ng pag-asa o masidhing paghihintay.
    reason: lexical_alternative
  - marker: b
    text: O, “nanahimik sila dahil sa payo ko.” Maaaring ilarawan ng huling parirala ang pananahimik nila bilang tugon sa payo ni Job.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִי
  choice: sa akin
  rationale: Tinutukoy ng pang-ukol na may panlaping unang panauhan si Job bilang taong pinakikinggan; likas sa Filipino ang “nakinig sa akin.”
- source_word: שָׁמְעוּ
  choice: nakinig
  rationale: Sa konteksto ng pagtanggap sa pananalita at payo ni Job, mas angkop ang aktibong pakikinig kaysa sa basta pagkarinig.
- source_word: וְיִחֵלּוּ
  choice: at naghintay
  rationale: Ang יחל ay nagpapahiwatig ng paghihintay na may pag-asa o pananabik. Pinananatili ng “naghintay” ang pangunahing diwa at ang pagkakat parallel nito sa pakikinig at pananahimik.
- source_word: וְיִדְּמוּ
  choice: nanatili silang tahimik
  rationale: Ang דמם dito ay tumutukoy sa pananahimik o pagiging hindi kumikibo. Ipinahihiwatig ng “nanatili” ang tuloy-tuloy at kusang pagpipigil habang hinihintay o tinatanggap ang payo.
- source_word: לְמוֹ
  choice: para sa
  rationale: Ang makatang anyong לְמוֹ ay gumaganap dito bilang pang-ukol na nag-uugnay ng kanilang pananahimik sa payo ni Job. Pinananatili ng “para sa” ang bukas na ugnayan nang hindi tiyakang ipinapakahulugang sanhi o tugon.
- source_word: עֲצָתִי
  choice: payo ko
  rationale: Sa konteksto ng karunungan, ang עֵצָה ay payo o patnubay mula sa iginagalang na tagapagsalita. Natural at marangal sa modernong Filipino ang “payo ko.”
theological_decisions: []
translation_notes:
  register: Gumamit ng natural at marangal na modernong Filipino. Pinanatili ang payak na tatluhang kilos—pakikinig, paghihintay, at pananahimik—at hindi nilutas nang sapilitan ang maluwag na ugnayan ng לְמוֹ sa “payo ko.”
