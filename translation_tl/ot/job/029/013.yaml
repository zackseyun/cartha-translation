  text: בִּרְכַּ֣ת אֹ֭בֵד עָלַ֣/י תָּבֹ֑א וְ/לֵ֖ב אַלְמָנָ֣ה אַרְנִֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/job/029/013.yaml
  text: The blessing of the perishing man came upon me[b][a], and I made the widow’s heart sing for joy.
translation:
  language: tl
  text: Dumating sa akin ang pagpapala ng taong napapahamak[a], at pinagalak ko ang puso ng balo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ng taong nasa bingit ng kapahamakan.” Ang salitang Hebreo ay maaaring tumukoy sa taong napapahamak, nawasak ang kalagayan, o malapit nang mamatay.
    reason: lexical_alternative
  - marker: b
    text: O “pinaawit ko sa galak ang puso ng balo” o “pinasigaw ko sa tuwa ang puso ng balo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּרְכַּת
  choice: ang pagpapala ng
  rationale: Ang anyong construct ng בְּרָכָה ay nagpapahayag ng ugnayang genitibo sa kasunod na participle; likas sa Filipino ang “pagpapala ng.”
- source_word: אֹבֵד
  choice: taong napapahamak
  rationale: Ang Qal participle ng אבד ay tumutukoy sa isang taong nasa kalagayan ng pagkapahamak, pagkawasak, o nalalapit na kamatayan. Hindi nililimitahan ng salin ang panganib sa kamatayan lamang.
- source_word: עָלַי תָּבֹא
  choice: Dumating sa akin
  rationale: Pinananatili nito ang larawan ng pagpapalang dumarating kay Job, habang natural ang ayos sa modernong Filipino. Ang imperfect ay binasang pangnagdaan dahil sa mapagbalik-tanaw na konteksto ng Job 29.
- source_word: לֵב אַלְמָנָה
  choice: puso ng balo
  rationale: Tuwirang pinananatili ang larawang Hebreo ng puso bilang kaloob-looban at sentro ng damdamin.
- source_word: אַרְנִן
  choice: pinagalak ko
  rationale: 'Ang Hiphil na unang panauhang isahan ng רנן ay may causative na diwa: si Job ang naging dahilan ng masayang pagtugon ng puso ng balo. Ang “pinagalak” ay natural at dignidad na Filipino, habang inilalahad sa talababa ang mas matinding larawan ng pag-awit o pagsigaw sa galak.'
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na natural at marangal. Pinanatili ang poetikong larawan ng pagpapalang dumarating kay Job at ng puso ng balo, habang iniwasang tukuyin nang labis kung kamatayan, karukhaan, o ibang kapahamakan ang kalagayan ng אֹבֵד.
