  text: The young men saw me and withdrew[a], and the aged rose and stood.
translation:
  language: tl
  text: Nang makita ako ng mga binata, umiwas sila[a]; at ang matatandang lalaki ay bumangon at tumayo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nagtago”; ang pandiwang Hebreo ay maaaring mangahulugang itago ang sarili. Dito, malamang na ipinahihiwatig nito ang magalang na pag-iwas sa harap ni Job.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאוּנִי
  choice: Kapag nakikita ako
  rationale: Ang ראה ay tuwirang nangangahulugang makita. Ginamit ang aspektong pangkaraniwan sa Filipino upang ilarawan ang paulit-ulit na asal na ginugunita ni Job sa konteksto.
- source_word: נְעָרִים
  choice: mga binata
  rationale: Tumutukoy ang panlalaking maramihan sa mga kabataang lalaki; likas at tiyak sa kasarian ang “mga binata” sa modernong Filipino.
- source_word: וְנֶחְבָּאוּ
  choice: sila'y umuurong
  rationale: Karaniwang nangangahulugan ang Niphal ng חבא na magtago, ngunit sa tagpong panlipunan ay ipinahihiwatig nito ang magalang na pag-iwas o pag-atras sa harap ni Job. Pinananatili sa talababa ang literal na alternatibo.
- source_word: וִישִׁישִׁים
  choice: ang matatandang lalaki
  rationale: Ang יְשִׁישִׁים ay mga lalaking matanda sa edad. Iniwasan ang “mga elder” o “matatanda” lamang upang hindi magpahiwatig ng isang opisyal na katungkulan.
- source_word: קָמוּ
  choice: bumabangon
  rationale: Inilalarawan ng קום ang unang kilos ng pagtayo bilang paggalang.
- source_word: עָמָדוּ
  choice: nananatiling nakatayo
  rationale: Kasunod ng קום, ipinakikita ng עמד na hindi lamang sila bumangon kundi nanatili silang nakatayo. Pinananatili nito ang dalawang magkaibang pandiwa ng Hebreo.
