  text: צֶ֣דֶק לָ֭בַשְׁתִּי וַ/יִּלְבָּשֵׁ֑/נִי כִּֽ/מְעִ֥יל וְ֝/צָנִ֗יף מִשְׁפָּטִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/job/029/014.yaml
  text: I put on righteousness[a], and it clothed me[b]; my justice was like a robe and a turban.
translation:
  language: tl
  text: 'Isinuot ko ang katuwiran[a], at dinamitan ako nito;

    ang aking katarungan ay gaya ng balabal at turbante.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “katarungan.” Ang salitang Hebreo na צֶדֶק ay maaaring mangahulugang “katuwiran” o “katarungan.”
    reason: lexical_alternative
  - marker: b
    text: Ang “turbante” rito ay telang ibinabalot sa ulo, bahagi ng larawan ng karangalan at pampublikong dignidad sa talata.
    reason: cultural_note
lexical_decisions:
- source_word: צֶדֶק
  choice: katuwiran
  rationale: Maaaring tumukoy ang צֶדֶק sa katuwiran o katarungan. Pinili ang “katuwiran” upang mapanatili ang moral na katangian nito at maiba sa מִשְׁפָּטִי sa ikalawang taludtod.
- source_word: לָבַשְׁתִּי
  choice: Isinuot ko
  rationale: Tuwirang ipinapahayag ng Qal na anyo ng לבש ang pagsusuot ng kasuutan at pinananatili ang aktibong metapora.
- source_word: וַיִּלְבָּשֵׁנִי
  choice: at dinamitan ako nito
  rationale: Inuulit ng Hebreo ang pandiwang לבש, ngunit ngayon ay ang katuwiran ang gumaganap at si Job ang tumatanggap. Pinananatili ng salin ang makatang pagbabaligtad na ito.
- source_word: כִּמְעִיל
  choice: gaya ng balabal
  rationale: Ang מְעִיל ay panlabas na kasuutan o roba. Ang “balabal” ay natural at marangal sa modernong Filipino.
- source_word: וְצָנִיף
  choice: at turbante
  rationale: Ang צָנִיף ay telang ibinabalot sa ulo. Ang “turbante” ang tuwirang katumbas, na nililinaw sa talababa upang idiin ang larawang kultural ng karangalan.
- source_word: מִשְׁפָּטִי
  choice: aking katarungan
  rationale: Maaaring mangahulugan ang מִשְׁפָּט ng paghatol, katarungan, o makatarungang pasiya. Sa konteksto, tumutukoy ito sa makatarungang asal at pangangasiwa ni Job.
