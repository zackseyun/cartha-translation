  yaml_path: translation/ot/job/029/011.yaml
  text: For when an ear heard[a], it called me blessed, and when an eye saw, it testified for me.
translation:
  language: tl
  text: Sapagkat ang taingang nakarinig ay nagpahayag na pinagpala ako, at ang matang nakakita ay nagpatotoo para sa akin.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikilala nito ang paliwanag sa dating karangalang tinatamasa ni Job at natural na nag-uugnay sa naunang pahayag.
- source_word: אֹזֶן שָׁמְעָה
  choice: ang taingang nakarinig
  rationale: Pinananatili ang isahang bahagi-ng-katawan na ginagamit sa pangkalahatang diwa para sa sinumang nakarinig tungkol kay Job.
- source_word: וַתְּאַשְּׁרֵנִי
  choice: ay nagpahayag na pinagpala ako
  rationale: Ipinahahayag ng pandiwa ang pagkilala o pagdedeklara na pinagpala ang isang tao; mas malinaw ito kaysa sa modernong diwa ng simpleng pagiging masaya.
- source_word: וְעַיִן רָאֲתָה
  choice: at ang matang nakakita
  rationale: Pinananatili ang maikli at magkatimbang na larawan ng pandinig at paningin sa dalawang sugnay.
- source_word: וַתְּעִידֵנִי
  choice: ay nagpatotoo para sa akin
  rationale: Ang pandiwa ay tumutukoy sa pagpapatotoo, at ipinahihiwatig ng konteksto na paborable kay Job ang patotoo.
