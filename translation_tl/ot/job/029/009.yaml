  source_fidelity: 'Tumpak na naihahatid ng salin ang dalawang magkahanay na kilos sa Hebreo: pinigil ng mga שָׂרִים ang kanilang pananalita, at inilagay/itinakip nila ang kamay sa bibig bilang hudyat ng pananahimik. Ang “mga pinuno” ay angkop para sa שָׂרִים at hindi labis na naglilimita sa kahulugang “mga prinsipe.”'
