  text: שָׂ֭רִים עָצְר֣וּ בְ/מִלִּ֑ים וְ֝/כַ֗ף יָשִׂ֥ימוּ לְ/פִי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/job/029/009.yaml
  text: Princes held back their words[a], and put their hand over their mouth.
translation:
  language: tl
  text: Pinigil ng mga pinuno ang kanilang mga salita[a], at itinakip nila ang kanilang kamay sa kanilang bibig.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pinigil ng mga taong may mataas na katungkulan ang pagsasalita.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂרִים
  choice: mga pinuno
  rationale: Tumutukoy ito sa mga taong may mataas na katungkulan o kapangyarihan. Natural at malawak ang “mga pinuno” sa modernong Filipino nang hindi nagpapahiwatig na sila ay mga anak ng hari.
- source_word: עָצְרוּ
  choice: pinigil
  rationale: Ipinapahayag ng pandiwa ang pagpipigil o hindi pagpapatuloy ng pagsasalita; tuwiran at natural ang “pinigil” kasama ng “kanilang mga salita.”
- source_word: בְמִלִּים
  choice: ang kanilang mga salita
  rationale: Literal itong may diwang “sa/patungkol sa mga salita,” ngunit sa konstruksyon kasama ng עָצְרוּ ay tumutukoy sa pagpigil sa pagsasalita. Idinagdag ang ipinahihiwatig na panghalip para sa likas na Filipino.
- source_word: וְכַף
  choice: ang kanilang kamay
  rationale: Bagaman maaaring tumukoy ang כַּף sa palad, “kamay” ang karaniwang tawag sa kilos ng pagtatakip sa bibig. Ang maramihang pag-aari ay hinango sa maramihang simuno.
- source_word: יָשִׂימוּ
  choice: itinakip nila
  rationale: Pangunahing kahulugan nito ang “ilagay,” ngunit ang “itinakip” ay natural na naghahayag sa Filipino ng paglalagay ng kamay sa bibig bilang tanda ng pananahimik.
- source_word: לְפִיהֶם
  choice: sa kanilang bibig
  rationale: Ang pang-ukol ay maaaring “sa” o “sa ibabaw ng”; kasama ng “itinakip,” sapat at likas ang “sa kanilang bibig.” Pinananatili ang kolektibong isahan ng Hebreo.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Pinanatili ang konkretong larawan ng pagpigil sa mga salita at pagtatakip ng kamay sa bibig; iniwasan ang “mga prinsipe” dahil maaari itong mapakahulugang mahigpit bilang mga anak ng hari.
