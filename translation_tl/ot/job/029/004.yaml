lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: gaya noong
  rationale: Pinananatili ang pahambing na diwa habang likas na ipinahahayag ang paggunita ni Job sa nakaraan.
- source_word: הָיִיתִי בִּימֵי חָרְפִּי
  choice: nasa kasibulan ako ng aking buhay
  rationale: Ipinahahayag ang panahon ng kalakasan, ganap na paglago, at kasaganaan; inilalagay sa talababa ang literal na larawang pana-panahon.
- source_word: בְּסוֹד אֱלוֹהַּ
  choice: ang matalik na pakikipag-usap ng Diyos
  rationale: Sinasalamin ang parehong pagiging malapit at kompidensiyal na payo o pakikipag-usap, nang hindi ito nililimitahan sa pagkakaibigan lamang o sa isang teknikal na uri ng pahayag.
- source_word: עֲלֵי אָהֳלִי
  choice: ay nasa ibabaw ng aking tolda
  rationale: Pinananatili ang konkretong larawan ng presensiya o lingap ng Diyos sa ibabaw ng tolda ni Job, sa halip na palitan agad ang tolda ng sambahayan.
theological_decisions:
- issue: Ang kahulugan ng dating ugnayan ni Job sa Diyos sa pariralang בְּסוֹד אֱלוֹהַּ
  choice: matalik na pakikipag-usap ng Diyos
  alternative: lihim na payo ng Diyos
  rationale: Pinananatili ng pangunahing salin ang relational at deliberative na mga pahiwatig ng סוֹד, nang hindi ipinapalagay na tumutukoy lamang ito sa mistikong paghahayag o karaniwang pakikipagkaibigan.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Pinanatili ang larawang “tolda” at ang bahagyang di-karaniwang larawang “nasa ibabaw” upang hindi mawala ang anyo at pahiwatig ng Hebreo. Ang talata ay itinuring na pagpapatuloy ng pangungusap mula sa naunang berso, kaya nagsisimula sa maliit na titik at nagtatapos sa kuwit.
