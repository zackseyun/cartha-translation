  terminology: Ginamit ang “kasiglaan” para sa dating panahon ng lakas at pag-unlad ni Job, nang hindi ginagawang “kabataan” ang metapora. Ginamit ang “matalik na pakikipagniig” bilang pangunahing salin ng סוֹד upang ipahiwatig ang malapit at kompidensiyal na ugnayan; pinananatili ng talababa ang alternatibong “lihim na payo.” Ang “Diyos” at “tolda” ay angkop at pare-pareho.
