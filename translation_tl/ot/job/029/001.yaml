  text: And Job continued, taking up his discourse, and said:[a]
translation:
  language: tl
  text: 'At nagpatuloy si Job sa pagbibigkas ng kanyang pahayag[a] at sinabi:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “kanyang kasabihan,” “kanyang talinghaga,” o “kanyang orakulo.” Malawak ang kahulugan ng salitang Hebreo na mashal; dito, ipinakikilala nito ang mahabang patulang pahayag ni Job.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּסֶף
  choice: nagpatuloy
  rationale: Ang יסף ay literal na “nagdagdag” at sa konstruksiyong ito ay nagpapahiwatig ng pagpapatuloy; natural itong naipahahayag sa Tagalog bilang “nagpatuloy.”
- source_word: אִיּוֹב
  choice: Job
  rationale: Ginamit ang karaniwang anyo ng pangalan sa makabagong saling Tagalog.
- source_word: שְׂאֵת
  choice: sa pagbibigkas
  rationale: Ang נשׂא ay “buhatin” o “dalhin,” ngunit sa idyomang נשׂא משל ay tumutukoy sa pagsisimula o pagbigkas ng isang patulang pahayag. Pinananatili ng “sa pagbibigkas” ang hiwalay na kilos nang hindi nagiging asiwa sa Tagalog.
- source_word: מְשָׁלוֹ
  choice: kanyang pahayag
  rationale: Malawak ang saklaw ng מָשָׁל—maaaring kasabihan, talinghaga, mapanuyang awit, orakulo, o mas mahabang diskurso. Sa konteksto, ipinakikilala nito ang mahabang patulang pananalita ni Job, kaya ang “pahayag” ang malinaw at hindi labis na makitid na katumbas.
- source_word: וַיֹּאמַר
  choice: at sinabi
  rationale: Tuwirang salin ng karaniwang anyong pasalaysay na nagpapakilala sa susunod na pananalita.
