  footnotes:
  - marker: a
    text: O “sa pintuan sa tabi ng bayan” o “sa pintuan ng lungsod.” Magkahiwalay na binabanggit sa Hebreo ang “pintuan” at ang pariralang nag-uugnay rito sa bayan o lungsod.
