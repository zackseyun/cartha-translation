lexical_decisions:
- source_word: בְּצֵאתִי
  choice: Kapag lumalabas ako
  rationale: Ang ב na kasunod ng infinitive construct ng יצא at hulaping unang panauhan ay temporal. Ang aspektong inuulit o nakagawian sa paglalarawan ni Job sa dati niyang buhay ay likas na naipapahayag ng “Kapag lumalabas ako.”
- source_word: שַׁעַר עֲלֵי קָרֶת
  choice: patungo sa pintuang-bayan
  rationale: Magkaugnay ang “pinto” at “bayan” sa parirala, at ang tinutukoy ay ang pampublikong lugar sa pasukan ng bayan. Ginagawang natural sa Tagalog ang ugnayan habang ang talababa ay nagpapanatili sa mas literal at hindi ganap na tiyak na pagbasa.
- source_word: בָּרְחוֹב
  choice: sa liwasan
  rationale: Ang רְחוֹב ay isang maluwang at bukás na pampublikong lugar, hindi lamang makitid na daan. Ang “liwasan” ang pinakamalinaw na makabagong katumbas sa kontekstong sibiko.
- source_word: אָכִין
  choice: inihahanda ko
  rationale: Ang Hiphil ng כון ay maaaring mangahulugang ihanda, ilagay, o itatag. Ang “inihahanda” ay angkop sa pagkuha ni Job ng kaniyang pampublikong puwesto nang hindi ipinahihiwatig na permanente niya itong itinatatag.
- source_word: מוֹשָׁבִי
  choice: ang aking upuan
  rationale: Sa konteksto ng pintuang-bayan at liwasan, tumutukoy ang מוֹשָׁב sa upuan o lugar ng pag-upo ni Job sa kapulungan, hindi sa tirahan.
