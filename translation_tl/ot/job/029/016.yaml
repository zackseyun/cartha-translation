translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Pinanatili ang talinghagang “ama” at ang legal-panlipunang diwa ng “usapin,” habang ang tunay na sintaktikong kalabuan ng ikalawang linya ay inilalahad sa talababa.
