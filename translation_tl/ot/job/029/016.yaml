  text: I was a father to the poor[a], and I investigated the case of one I did not know.
translation:
  language: tl
  text: 'Naging ama ako sa mga dukha,

    at siniyasat ko ang usaping hindi ko pa nalalaman.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “at siniyasat ko ang usapin ng taong hindi ko kilala.”
    reason: Maaaring unawain ang Hebreo bilang pagtukoy sa taong sangkot sa usapin na hindi pa dating kilala ni Job.
lexical_decisions:
- source_word: אָב
  choice: ama
  rationale: Pinananatili ng “ama” ang tuwirang talinghaga ng Hebreo para sa mapagkalinga at nagtatanggol na papel ni Job.
- source_word: אָנֹכִי
  choice: ako
  rationale: Ang nakahiwalay na panghalip ay nagbibigay-diin kay Job; kasama ng konteksto ng nakaraan, likas itong naipahayag sa “Naging ama ako.”
- source_word: לָאֶבְיוֹנִים
  choice: sa mga dukha
  rationale: Ang אֶבְיוֹן ay tumutukoy sa mga dukha o nangangailangan. Dignified at malinaw ang “mga dukha,” at akma ang “sa” sa pariralang “ama sa.”
- source_word: וְרִיב
  choice: at ... ang usapin
  rationale: Maaaring tumukoy ang רִיב sa alitan, demanda, o kasong pinagtatalunan. Sapat na malawak at natural ang “usapin” sa kontekstong nagsisiyasat si Job upang maitaguyod ang katarungan.
- source_word: לֹא יָדַעְתִּי
  choice: ng taong hindi ko kilala
  rationale: Maaaring unawain ang parirala bilang pagtukoy sa isang taong wala pang dating personal na ugnayan kay Job. Ginawang hayag ang ipinahihiwatig na tao upang maging natural sa Tagalog, habang inilalagay sa talababa ang mas tuwirang pag-uugnay nito sa “usapin.”
- source_word: אֶחְקְרֵהוּ
  choice: siniyasat ko
  rationale: Ipinahihiwatig ng חקר ang masusing paghahanap o pagsusuri. Malinaw at kasalukuyang gamit ang “siniyasat,” at ang hulaping panlalaki ay naiuugnay sa “usapin.”
