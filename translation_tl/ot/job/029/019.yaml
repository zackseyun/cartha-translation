  text: My roots were spread out to the waters[a], and dew stayed overnight on my branches.
translation:
  language: tl
  text: 'Ang mga ugat ko''y nakaunat patungo sa tubig,

    at ang hamog ay nanatili magdamag sa aking mga sanga.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O kaya, “sa aking ani.” Di-pangkaraniwan sa kontekstong ito ang salitang Hebreo; pinili ang “mga sanga” sapagkat mas likas itong kaayon ng larawan ng mga ugat at hamog.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁרְשִׁי
  choice: ang mga ugat ko
  rationale: Bagaman anyong isahan ang Hebreo, maaari itong tumukoy sa buong sistema ng ugat. Mas natural sa modernong Filipino ang maramihang “mga ugat” sa larawang ito.
- source_word: פָתוּחַ
  choice: nakalatag
  rationale: Ipinahihiwatig ng passive participle ang kalagayang nakabuka o nakaunat. Ang “nakalatag” ay natural na naglalarawan sa pag-abot ng mga ugat nang hindi dinaragdagan ang kahulugan.
- source_word: אֱלֵי מָיִם
  choice: tungo sa tubig
  rationale: Pinananatili ng “tungo sa” ang direksiyonal na diwa ng אֱלֵי. Bagaman maramihan ang anyo ng מָיִם sa Hebreo, kolektibo ang kahulugan nito at likas sa Filipino ang “tubig.”
- source_word: וְטַל
  choice: at ang hamog
  rationale: Tuwirang salin ng טַל sa malinaw at karaniwang Filipino.
- source_word: יָלִין
  choice: namamalagi magdamag
  rationale: Ang pandiwang לון ay nangangahulugang manatili o magpalipas ng gabi. Pinananatili ng parirala ang temporal na larawan ng hamog na nananatili sa buong magdamag.
- source_word: בִּקְצִירִי
  choice: sa aking mga sanga
  rationale: Karaniwang nangangahulugang “ani” ang קָצִיר, ngunit hindi iyon madaling umangkop sa hamog at sa larawang-halaman ng ugat. Ang “mga sanga” ay kumakatawan sa malamang na kontekstuwal na diwa ng tumubong bahagi ng halaman, habang inilalagay sa talababa ang mas literal na alternatibo.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino na may bahagyang makatang ayos. Ginamit ang “ko’y” para sa maayos na ritmo, ngunit iniwasan ang malalalim o lipas na salita.
