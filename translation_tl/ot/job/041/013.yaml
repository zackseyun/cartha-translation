  text: His breath kindles coals[a], and a flame comes out from his mouth.
translation:
  language: tl
  text: Ang hininga niya ay nagpapaliyab ng mga baga ng apoy[a], at may liyab na lumalabas mula sa kanyang bibig.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Ang kaluluwa niya ay nagpapaliyab ng mga baga ng apoy” o “Ang lalamunan niya ay nagpapaliyab ng mga baga ng apoy.” Ang salitang Hebreo na נֶפֶשׁ ay maaaring mangahulugang “kaluluwa,” “buhay,” o “lalamunan,” at sa kontekstong ito ay maaari ring tumukoy sa “hininga.”
    reason: lexical_alternative
lexical_decisions:
- source_word: נַפְשׁוֹ
  choice: ang hininga niya
  rationale: Bagaman karaniwang maaaring mangahulugang “kaluluwa” o “buhay” ang נֶפֶשׁ, maaari rin itong tumukoy sa lalamunan at, ayon sa konteksto, sa hininga. Dahil kaparis nito ang paglabas ng apoy mula sa bibig, “hininga” ang pinakamalinaw at likas na salin.
- source_word: גֶּחָלִים
  choice: mga baga
  rationale: Tumutukoy ito sa mga baga o nagbabagang uling. Ang “mga baga” ay maikli, natural, at hindi inuulit ang ideya ng pagliyab na nasa pandiwa.
- source_word: תְּלַהֵט
  choice: nagpapaliyab
  rationale: Ang Piel na anyo ng להט ay nagpapahayag ng pagsasanhi na magliyab o magningas. Pinananatili ng “nagpapaliyab” ang sanhiang diwa.
- source_word: וְלַהַב
  choice: at may apoy
  rationale: Ang לַהַב ay isahan at nangangahulugang apoy o liyab. Ang “may apoy na lumalabas” ay natural sa modernong Tagalog at pinananatili ang iisang larawan.
- source_word: מִפִּיו
  choice: sa bibig niya
  rationale: Kasama ng pandiwang “lumalabas,” likas sa Tagalog ang “lumalabas sa bibig niya” para sa ideyang mula sa kanyang bibig.
- source_word: יֵצֵא
  choice: lumalabas
  rationale: Ang pandiwa ay nangangahulugang lumabas. Ang aspektong imperpektibo ay angkop na isalin bilang “lumalabas” sa paglalarawan ng katangian o paulit-ulit na kilos.
theological_decisions: []
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “mga baga” para sa nagbabagang uling at “nagpapaliyab” upang mapanatili ang sanhiang lakas ng pandiwang Hebreo.
