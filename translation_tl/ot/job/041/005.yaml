  text: Who has stripped off the front of his garment? Who can come within his double bridle?[a]
translation:
  language: tl
  text: Sino ang nakapag-alis ng harapan ng kaniyang kasuutan? Sino ang makapapasok sa loob ng kaniyang dobleng renda?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Sino ang makapapasok sa tupi ng kaniyang renda?” Mahirap tiyakin ang kahulugan ng pananalitang Hebreo; maaaring metaporikal itong tumukoy sa bibig o mga panga ng Leviatan, o sa dobleng hanay ng mga ngipin nito.
    reason: lexical_alternative
lexical_decisions:
- source_word: גִלָּה
  choice: nakapag-alis
  rationale: Ang pandiwa ay nangangahulugang maglantad o mag-alis ng nakatakip. Sa retorikal na tanong, ipinahihiwatig ng “nakapag-alis” ang imposibilidad ng puwersahang pagtanggal nang hindi ginagawang tiyak kung balat, kaliskis, o ibang panlabas na takip ang tinutukoy.
- source_word: פְּנֵי לְבוּשׁוֹ
  choice: ang harapan ng kaniyang kasuutan
  rationale: Pinananatili nito ang kongkretong metapora ng Hebreong “mukha/harapan ng kaniyang kasuutan” at iniiwasang tahasang ipakahulugan bilang balat o kaliskis.
- source_word: בְּכֶפֶל
  choice: sa pagitan ng kaniyang dobleng
  rationale: Ang כֶּפֶל ay maaaring tumukoy sa pagkakadoble o tupi. Ang “sa pagitan” ay natural na nagpapahayag ng pagpasok sa dobleng bahagi habang pinananatili ang malabong larawan ng orihinal.
- source_word: רִסְנוֹ
  choice: renda
  rationale: Ang רֶסֶן ay karaniwang panupil sa bibig ng hayop, gaya ng renda o preno. Ang “renda” ay madaling maunawaan at pinananatili ang metaporikal na larawan, bagaman maaaring bibig, mga panga, o magkabilang hanay ng ngipin ang ipinahihiwatig.
- source_word: מִי יָבוֹא
  choice: Sino ang makapapasok
  rationale: Ang tanong na may di-ganap na pandiwa ay isang hamon na nagpapahiwatig ng kawalan ng kakayahan; natural itong naipahahayag sa Filipino sa pamamagitan ng “makapapasok.”
