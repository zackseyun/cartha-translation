  text: בְּֽ֭/צַוָּאר/וֹ יָלִ֣ין עֹ֑ז וּ֝/לְ/פָנָ֗י/ו תָּד֥וּץ דְּאָבָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/job/041/014.yaml
  text: In his neck strength lodges[a], and before him dismay leaps.
translation:
  language: tl
  text: 'Sa kaniyang leeg nananahan ang lakas,

    at sa unahan niya ay lumulukso ang panghihina ng loob.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “at sa unahan niya ay lumulukso ang sindak.” Bihira ang salitang Hebreo na דְּאָבָה, at sa tulang ito maaari itong mangahulugang panghihina ng loob, panlulumo, o sindak.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּצַוָּארוֹ
  choice: Sa kaniyang leeg
  rationale: Ang בְּ ay lokatibo rito, at pinananatili ng parirala ang larawan ng lakas na nananahan sa leeg niya.
- source_word: יָלִין
  choice: nananahan
  rationale: Ang literal na diwa ay ‘tumitigil o nagpapalipas ng gabi,’ ngunit metaporikal itong tumutukoy sa matatag na pananatili. Natural sa Filipino ang ‘nananahan’ at napapanatili nito ang personipikasyon.
- source_word: עֹז
  choice: lakas
  rationale: Tuwiran at natural na katumbas ng karaniwang pangngalan para sa lakas o kapangyarihan.
- source_word: וּלְפָנָיו
  choice: at sa unahan niya
  rationale: Ipinahahayag nito ang lokatibong idyoma na ‘sa harap niya’ o ‘nauuna sa kaniya,’ habang malinaw na ang inilalarawan ay gumagalaw sa kaniyang unahan.
- source_word: תָּדוּץ
  choice: lumulukso
  rationale: Ang bihirang pandiwa ay nagpapahiwatig ng paglukso o pagtalon. Pinananatili ng ‘lumulukso’ ang masiglang personipikasyon nang hindi nagdaragdag ng positibong himig ng ‘sumasayaw.’
- source_word: דְּאָבָה
  choice: panghihina ng loob
  rationale: Bihira ang pangngalan at maaaring tumukoy sa pagkasindak, panlulumo, o panghihina. Hindi labis na tinutukoy ng ‘panghihina ng loob’ ang kahulugan, kaya napapanatili ang lawak at tensiyong leksikal ng Hebreo.
theological_decisions: []
translation_notes:
  register: Makabagong Filipino na marangal at patula. Ginamit ang ‘kaniyang’ at ‘niya’ sa natural na paghahalili; pinanatili ang personipikasyon at ang bihirang bokabularyo ng Hebreo nang hindi pinapawi ang tunay na kalabuan.
