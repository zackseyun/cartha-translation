  text: His sneezings flash forth light[b][a], and his eyes are like the eyelids of dawn.
translation:
  language: tl
  text: Ang kanyang mga pagbahing ay nagpapasikat ng liwanag[a], at ang kanyang mga mata ay gaya ng mga talukap ng bukang-liwayway.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “Sa tuwing bumabahing siya, kumikislap ang liwanag.” Causative ang pandiwang Hebreo, na literal na nagpapahiwatig ng pagpapasikat ng liwanag, at napakapatalinghaga ng parirala.
    reason: lexical_alternative
  - marker: b
    text: Literal na “gaya ng mga talukap ng bukang-liwayway,” isang patulang larawang Hebreo para sa unang pagbukas ng liwanag sa pagsikat ng araw.
    reason: cultural_note
lexical_decisions:
- source_word: עֲטִישֹׁתָיו
  choice: kanyang pagbahing
  rationale: Ang pangngalan mula sa עטש ay tumutukoy sa pagbahing. Likas sa modernong Filipino ang kolektibong anyong “pagbahing” sa halip na piliting gawing maramihan.
- source_word: תָּהֶל אוֹר
  choice: kumikislap ang liwanag
  rationale: Ang pandiwang Hiphil ay nagpapahiwatig ng pagpapasikat o pagpapalabas ng liwanag. Pinananatili ng “kumikislap ang liwanag” ang matingkad at patulang larawan, bagaman hindi nito tahasang inilalabas ang buong causative na anyo.
- source_word: וְעֵינָיו
  choice: at ang kanyang mga mata
  rationale: Tuwirang salin ng pangatnig at pangngalang may hulaping panlalaking isahan.
- source_word: כְעַפְעַפֵּי שָׁחַר
  choice: gaya ng mga talukap ng bukang-liwayway
  rationale: Pinananatili ang literal at kakaibang larawang Hebreo ng mga “talukap” ng bukang-liwayway sa halip na palitan ito ng interpretatibong “mga unang sinag.”
