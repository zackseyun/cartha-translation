    reason: lexical_alternative
lexical_decisions:
- source_word: כְּקַשׁ
  choice: dayami
  rationale: Ang קַשׁ ay dayami o pinaggapasan; pinananatili ng “dayami” ang larawan ng isang bagay na magaan at hindi nakapipinsala sa Leviatan.
- source_word: נֶחְשְׁבוּ
  choice: Itinuturing niyang
  rationale: Ang pasibong anyo ng חשׁב ay literal na “itinuturing,” at ang idyomatikong Filipino ay malinaw na nagpapahayag na para sa Leviatan, ang sandata ay gaya lamang ng dayami.
- source_word: תוֹתָח
  choice: pamalo
  rationale: Bihira at hindi tiyak ang tinutukoy ng salita. Ang “pamalo” ay angkop sa konteksto ng mga sandata ngunit hindi labis na nagpapakiyak sa uri nito; inilalahad sa talababa ang ibang posibleng kahulugan.
- source_word: וְיִשְׂחַק
  choice: at pinagtatawanan niya
  rationale: Ang שׂחק ay “tumawa”; sa konteksto, ang pagtawa ng Leviatan sa sandata ay may diwang paghamak, na natural na naipahahayag ng “pinagtatawanan.”
- source_word: לְרַעַשׁ
  choice: ang kalansing
  rationale: Ang רַעַשׁ ay ingay, pagyanig, o pagkalansing. Sa isang sandatang ikinikilos o inihahagis, natural na Filipino ang “kalansing” at pinananatili nito ang pandinig na larawan.
- source_word: כִּידוֹן
  choice: sibat
  rationale: Ang כִּידוֹן ay sibat o sandatang tulad ng javelin. “Sibat” ang malinaw at karaniwang katawagan sa modernong Filipino nang hindi nagdaragdag ng di-tiyak na teknikal na detalye.
theological_decisions: []
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang matalinghagang paghahambing sa dayami at ang personipikadong pagtawa ng Leviatan. Isang talababa ang ginamit upang tapat na ihayag ang leksikal na kawalang-katiyakan ng תוֹתָח.
