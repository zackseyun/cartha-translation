translation:
  language: tl
  text: 'Itinuturing niyang dayami[b] ang pamalo[a],


    at pinagtatawanan niya ang kalansing ng sibat.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sandatang inihahagis.” Bihira ang salitang Hebreo at hindi tiyak ang eksaktong kahulugan nito.
