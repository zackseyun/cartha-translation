  yaml_path: translation/ot/job/041/024.yaml
  text: Behind him a path shines[b][a]; one would think the deep to be gray-haired.
translation:
  language: tl
  text: Sa likuran niya, kumikinang ang isang landas[a]; aakalain mong may uban ang kalaliman.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Pagkaraan niya, kumikinang ang isang landas.” Maaaring tumukoy ang Hebreo sa panahon (“pagkaraan niya”) o sa puwesto (“sa likuran niya”); mas pinapaboran ng konteksto ang bakas na naiiwan niya sa tubig.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “ang kalaliman tungo sa uban” o “bilang ubaning buhok.” Inilalarawan nito ang dagat na namumuti sa bula, na para bang may uban.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֲרָיו
  choice: Sa likuran niya
  rationale: Maaari itong tumukoy sa pagkakasunod sa panahon o sa puwesto. Sa paglalarawan sa bakas na naiiwan sa tubig, higit na angkop ang spatial na diwang “sa likuran niya.”
- source_word: יָאִיר
  choice: kumikinang
  rationale: Ipinahihiwatig ng pandiwa ang pagbibigay-liwanag o pagningning; dito, inilalarawan nito ang maputing ningning ng bakas sa tubig.
- source_word: נָתִיב
  choice: isang landas
  rationale: Ang salita ay tumutukoy sa landas o bakas. Pinananatili ng “landas” ang patulang larawan ng dinaraanan ng nilalang sa dagat.
- source_word: יַחְשֹׁב
  choice: aakalain mong
  rationale: Bagaman nasa ikatlong panauhang panlalaki ang anyo, maaari itong gamitin bilang pangkalahatang pahayag tungkol sa impresyon ng isang tumitingin. Likas sa modernong Tagalog ang “aakalain mong.”
- source_word: תְּהוֹם
  choice: ang kalaliman
  rationale: Tumutukoy ito sa malalalim na tubig. Pinananatili ng “kalaliman” ang maikli at patulang lakas ng Hebreo nang hindi labis na nililinaw bilang dagat o bangin.
- source_word: לְשֵׂיבָה
  choice: may uban
  rationale: Ang pangngalan ay maaaring mangahulugang uban, katandaan, o kaputian. Ang “may uban” ay malinaw na naghahatid ng larawang ang bumubulang kalaliman ay tila maputi dahil sa uban.
theological_decisions: []
translation_notes:
  register: Makabago ngunit marangal at patula ang wika. Ginamit ang “kalaliman” upang mapanatili ang matinding larawan ng Hebreo, at “may uban” upang maging likas at madaling maunawaan sa Tagalog ang metapora ng maputing bula.
