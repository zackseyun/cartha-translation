  text: At his rising the mighty are afraid; at the crashing they are beside themselves.
translation:
  language: tl
  text: Sa pagbangon niya, natatakot ang mga makapangyarihan; dahil sa pagwasak, nawawala sila sa sarili.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִשֵּׂתוֹ
  choice: Kapag bumangon siya
  rationale: Ipinapahayag ang sanhi o pagkakataon ng pagbangon/pagtindig ng nilalang, sa natural na Tagalog.
- source_word: אֵלִים
  choice: ang mga makapangyarihan
  rationale: Bagaman karaniwang nangangahulugang “mga diyos” ang אֵלִים, sa kontekstong ito ay tumutukoy ito sa mga malalakas o makapangyarihang nilalang; pinananatili ang diwa ng lakas nang hindi nagpapasok ng tiyak na pagkakakilanlan.
- source_word: מִשְּׁבָרִים
  choice: sa mga pagkalagapak
  rationale: Ang pangmaramihang anyo ay tumutukoy sa malalakas na pagbasag o pagbulusok; ang “mga pagkalagapak” ay nagpapanatili sa pandinig at marahas na larawan ng salita.
- source_word: יִתְחַטָּאוּ
  choice: nawawala sila sa sarili
  rationale: Ang pambihirang anyong ito ay inilalarawan sa konteksto bilang matinding pagkalito o pagkataranta. Ang idyomang Tagalog ay nagpapanatili sa lakas at bahagyang di-tiyak na kulay ng pahayag.
theological_decisions:
- issue: Pagkakakilanlan ng אֵלִים
  choice: mga makapangyarihan
  alternative: mga diyos
  rationale: Hindi tahasang nilulutas ng konteksto kung mga banal na nilalang o makapangyarihang nilalang ang tinutukoy. Ang saling “mga makapangyarihan” ay angkop sa reaksiyon ng takot at umiiwas sa di-kinakailangang doktrinal na pagtutukoy.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Pinanatili ang dalawang magkatimbang na sugnay at ang masidhing larawan ng takot at pagkawala sa sarili.
