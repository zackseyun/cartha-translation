lexical_decisions:
- source_word: גַּאֲוָה
  choice: ang ipinagmamalaki nito
  rationale: Ipinahahayag ang pangngalang “pagmamataas/karangalan” bilang likas na panaguring Tagalog, nang hindi ginagawang simpleng pang-uri lamang.
- source_word: אֲפִיקֵי מָגִנִּים
  choice: mga hanay ng mga kalasag
  rationale: Sa konteksto ng katawan ng Leviatan, ang אֲפִיקֵי ay tumutukoy sa nakaayos na mga hilera o hanay, at ang “mga kalasag” ay nagpapanatili sa metapora ng מָגִנִּים.
- source_word: סָגוּר חוֹתָם צָר
  choice: saradong mahigpit ang mga ito, na parang tinatakan
  rationale: Pinananatili ang larawan ng mahigpit na pagkakasara at ng tatak/selyo, habang ginagawang malinaw at natural ang napakasiksik na pariralang Hebreo.
