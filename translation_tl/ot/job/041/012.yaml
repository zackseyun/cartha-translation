  yaml_path: translation/ot/job/041/012.yaml
  text: Smoke goes out from his nostrils[b][a], like a boiling pot and burning rushes.
translation:
  language: tl
  text: 'Mula sa mga butas ng ilong nito ay lumalabas ang usok,


    gaya ng sa palayok na pinapaypayan ang apoy at sa mga tambo.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “gaya ng palayok na pinapaypayan at mga tambo.” Ang salitang Hebreo para sa “palayok” ay maaari ring tumukoy sa isang malaking kaldero. Maaaring tumukoy ang “mga tambo” sa mga tambo o halamang latian na ginagamit bilang panggatong, ngunit hindi ito tahasang sinasabi sa teksto.
    reason: lexical_alternative_and_cultural_note
lexical_decisions:
- source_word: מִנְּחִירָיו
  choice: Mula sa mga butas ng ilong nito
  rationale: Tuwirang inilalarawan ng נְחִירַיִם ang mga butas ng ilong; pinananatili ng salin ang matingkad na larawang pangkatawan at ang pang-ukol na מִן.
- source_word: יֵצֵא
  choice: lumalabas
  rationale: Ang anyong imperpektibo ng יצא ay naglalarawan dito ng karaniwang kilos; natural sa Filipino ang pangkasalukuyang “lumalabas.”
- source_word: עָשָׁן
  choice: usok
  rationale: Ito ang tuwiran at karaniwang katumbas ng עָשָׁן.
- source_word: כְּדוּד
  choice: gaya ng ... palayok
  rationale: Ang דּוּד ay sisidlang panluto, maaaring palayok o malaking kaldero; ang “palayok” ay malinaw at karaniwan sa modernong Filipino.
- source_word: נָפוּחַ
  choice: kumukulong
  rationale: Literal itong may diwang hinihipan o pinapaypayan. Sa larawan ng sisidlang nasa matinding apoy, ipinahahayag ng “kumukulong” ang resultang nakikita nang hindi gumagamit ng alanganing pariralang “hinipang palayok.”
- source_word: וְאַגְמֹן
  choice: at nagliliyab na mga tambo
  rationale: Ang אַגְמוֹן ay tambo o halamang latian. Sa konteksto, malamang na inilalarawan ang mga tambong ginagamit na panggatong; idinagdag ang “nagliliyab” upang maging malinaw at natural ang iisang imahen ng usok mula sa matinding apoy.
