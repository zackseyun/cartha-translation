  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “nito” sapagkat ang tinutukoy sa konteksto ay isang nilalang, at pinanatili ang masinsing ποιetikong paghahambing nang hindi ito inuugnay sa anumang natatanging doktrina.
