translation_notes:
  register: Makabago, dignified, at madaling maunawaang Filipino. Pinanatili ang maikling paralel na estruktura at ang ambiguidad kung ang diin ay nasa pagiging katulad o pagiging kapantay, gayundin ang saklaw ng “takot/sindak.”
