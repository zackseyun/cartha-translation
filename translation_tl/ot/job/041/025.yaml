  text: On earth there is none like him[b][a], one made without fear.
translation:
  language: tl
  text: Sa lupa ay walang katulad niya[a], isang nilikhang walang takot[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “walang kapantay niya.” Maaaring ipahayag ng salitang Hebreo rito ang pagkakatulad o pagiging kapantay.
    reason: lexical_alternative
  - marker: b
    text: O, “nilikha upang hindi masindak,” samakatuwid, nilikhang hindi nasisindak.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵין
  choice: walang
  rationale: Ang eksistensiyal na negatibo ay likas na naihahayag sa Tagalog sa pamamagitan ng “walang,” at pinananatili nito ang ganap na pagtanggi.
- source_word: עַל עָפָר
  choice: sa ibabaw ng lupa
  rationale: Bagaman literal na tumutukoy sa alabok o lupa, saklaw dito ang daigdig na tirahan ng mga nilalang; ang “sa ibabaw ng lupa” ay malinaw at marangal na Tagalog.
- source_word: מָשְׁלוֹ
  choice: katulad niya
  rationale: Sa konteksto, ipinahahayag ng salita ang pagkakatulad o pagiging kapantay, hindi pamamahala. Pinananatili sa talababa ang posibleng diwang “kapantay.”
- source_word: הֶעָשׂוּ
  choice: nilikhang
  rationale: Ang anyo ay may pasibo o impersonal na diwa ng pagiging ginawa. Ang “nilikhang” ay natural sa paglalarawan sa nilalang at hindi nagpapasok ng dagdag na tagaganap sa pangungusap.
- source_word: לִבְלִי
  choice: walang
  rationale: Ipinahahayag ng parirala ang kawalan ng bagay na sumusunod; “walang” ang pinakamaikli at likas na katumbas.
- source_word: חָת
  choice: takot
  rationale: Ang pangngalan ay tumutukoy sa sindak o panghihilakbot. Ang “takot” ay malinaw at malawak, habang inilalahad sa talababa ang mas matinding alternatibong “sindak.”
