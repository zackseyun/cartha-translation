base_translation:
  language: en
  yaml_path: translation/ot/job/041/004.yaml
  text: I will not keep silent about his limbs[a], or the account of his mighty strength and the grace of his proportions.
translation:
  language: tl
  text: Hindi ako mananahimik tungkol sa kanyang mga bahagi ng katawan[a], ni tungkol sa kanyang matinding lakas at sa ganda ng pagkakaayos ng kanyang anyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “kanyang mga sangkap.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֲרִישׁ
  choice: Hindi ako mananahimik
  rationale: Likas at tuwirang Filipino para sa Hiphil ng חרשׁ dito, at pinananatili ang pasiya ng nagsasalita na hindi tumigil sa pagsasalita.
- source_word: בַּדָּיו
  choice: kanyang mga bahagi ng katawan
  rationale: Ang בַּד ay maaaring tumukoy sa mga bahagi o sangkap ng katawan. Mas malinaw ito sa karaniwang mambabasa kaysa sa 'mga biyas,' na maaaring maging mas makitid ang kahulugan.
- source_word: דְבַר
  choice: tungkol sa
  rationale: Sa konstruksyong ito, ipinakikilala ng דְבַר ang paksang ilalarawan. Ang payak na 'tungkol sa' ay natural sa Filipino at hindi nagpapasok ng labis na espesipikong pagpapakahulugan.
- source_word: גְּבוּרוֹת
  choice: matinding lakas
  rationale: Bagaman maaaring mangahulugang makapangyarihang mga gawa o kapangyarihan, ang pisikal na paglalarawan sa Leviatan ay pumapabor sa diwang pambihirang lakas.
- source_word: חִין
  choice: ganda
  rationale: Dito ang חִין ay tumutukoy sa kaaya-aya o kahanga-hangang anyo; ang 'ganda' ay natural at malinaw sa modernong Filipino.
- source_word: עֶרְכּוֹ
  choice: pagkakaayos ng kanyang anyo
  rationale: Mula ito sa ugat na may diwa ng pag-aayos o paghahanay. Pinananatili ng parirala ang ideya ng maayos na kabuuang kayarian nang hindi nililimitahan ito sa matematikal na proporsiyon.
