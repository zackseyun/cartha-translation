  text: He looks on everything that is high[a]; he is king over all the sons of pride.
translation:
  language: tl
  text: Tinitingnan niya ang bawat bagay na matayog; siya ang hari ng lahat ng mga anak ng pagmamataas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “hari ng lahat ng mapagmataas”; sa literal, “hari ng lahat ng mga anak ng pagmamataas.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵת כָּל גָּבֹהַּ
  choice: ang lahat ng matayog
  rationale: Ang אֵת ay pananda ng tuwirang layon at hindi kailangang isalin nang hiwalay. Pinananatili ng “lahat ng matayog” ang kabuuang saklaw ng כָּל at ang literal na larawan ng taas sa גָּבֹהַּ, habang naiiwang posible ang pahiwatig na pagmamataas.
- source_word: יִרְאֶה
  choice: Tinitingnan
  rationale: Ang pandiwang ראה ay nangangahulugang “makita” o “tumingin.” Ang “tinitingnan” ay likas sa Filipino at nagpapahiwatig ng walang-takot na pagtanaw, nang hindi lalampas sa kahulugan ng pinagmulan.
- source_word: הוּא מֶלֶךְ
  choice: siya ang hari
  rationale: Pinananatili nito ang mariing panghalip na הוּא at ang tuwirang metaporang maharlika ng מֶלֶךְ.
- source_word: עַל כָּל
  choice: sa lahat ng
  rationale: Sa Filipino, ang “hari sa lahat ng” ay natural na nagpapahayag ng paghahari o pangingibabaw na tinutukoy ng עַל.
- source_word: בְּנֵי שָׁחַץ
  choice: mga anak ng pagmamataas
  rationale: Pinananatili ang literal at matalinghagang pariralang Hebreo. Ipinakikita ng talababa ang mas likas na posibleng kahulugang “mga mapagmataas” nang hindi nililimitahan kung anong uri ng mga nilalang o kapangyarihan ang tinutukoy.
theological_decisions:
- issue: Kahulugan ng “lahat ng anak ng pagmamataas”
  choice: Pinanatili bilang matalinghagang katawagan sa lahat ng nailalarawan ng pagmamataas, na pinaghaharian ng Leviatan.
  alternative: Espesipikong tumutukoy sa mababangis na hayop o sa mga kosmikong kapangyarihan.
  rationale: Hindi tinutukoy ng Hebreo ang isang tiyak na pangkat. Ang literal na matalinghagang pananalita at ang talababa ay nagpapanatili sa sadyang kalabuan at teolohikal na tensiyon.
translation_notes:
  register: Makabagong Filipino na may marangal at patulang himig. Ginamit ang “matayog” upang mapanatili kapwa ang konkretong larawan ng kataasan at ang posibleng pahiwatig ng kapalaluan; iniwasang tukuyin kung mga hayop, nilalang, o kosmikong kapangyarihan ang saklaw.
