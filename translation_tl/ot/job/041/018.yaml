  text: The sword that reaches him cannot stand[a]; nor can spear, dart[b], or javelin.
translation:
  language: tl
  text: Ang tabak na umabot sa kanya ay hindi makatatayo[a]; ni ang sibat, palaso[b], o suligi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Ang tabak na umabot sa kanya ay hindi makapananaig.” Literal na sinasabi sa Hebreo na ang tabak ay “hindi tatayo.”
    reason: lexical_alternative
  - marker: b
    text: Bihira at hindi tiyak ang mga salitang Hebreo na isinaling “palaso” at “suligi.” Maaaring tumukoy ang una sa isang sandatang pamukol o sa isang baras, at ang ikalawa naman sa baluting bakal o iba pang baluti.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַשִּׂיגֵהוּ
  choice: na umabot sa kanya
  rationale: Mula sa pandiwang nangangahulugang “umabot, maabutan, matamo.” Pinananatili nito ang diwang ang tabak ay nakararating laban sa kanya nang hindi ipinapalagay na nasugatan siya.
- source_word: חֶרֶב
  choice: ang tabak
  rationale: Karaniwang salita para sa tabak; ginagamit dito bilang pangkalahatang katawagan sa uring ito ng sandata.
- source_word: בְּלִי תָקוּם
  choice: ay hindi makapananaig
  rationale: Literal na sinasabi ng Hebreo na ang tabak ay “hindi tatayo.” Sa konteksto, ang diwa ay hindi ito makatatagal o magiging mabisa laban sa kanya. Ang literal na larawan ay iniingatan sa talababa.
- source_word: חֲנִית
  choice: sibat
  rationale: Likas at madaling maunawaang katumbas ng karaniwang sandatang pantusok.
- source_word: מַסָּע
  choice: palaso
  rationale: Bihira at hindi tiyak ang salita. Malamang na tumutukoy ito sa isang inihahagis o pinakakawalang sandata; ang “palaso” ay angkop sa talaan ng mga sandata, habang inilalahad sa talababa ang ibang posibilidad.
- source_word: וְשִׁרְיָה
  choice: o suligi
  rationale: Bagaman maaari ring mangahulugang baluti ang bihirang termino, mas angkop sa magkakasunod na pangalan ng sandata ang isang matulis na sandatang inihahagis. Pinananatili sa talababa ang leksikal na kawalang-katiyakan.
