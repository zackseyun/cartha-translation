translation_notes:
  register: Makabagong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “makapananaig” upang natural na ihatid ang kabiguan ng sandata, habang pinanatili sa talababa ang literal na larawang “hindi tatayo.” Ang “suligi” ay bahagyang pampanitikan ngunit malinaw sa konteksto at nakatutulong na maiba ito sa “sibat.”
