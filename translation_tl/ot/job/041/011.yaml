  text: From his mouth torches go out[a]; sparks of fire leap forth.
translation:
  language: tl
  text: Mula sa bibig nito ay lumalabas ang mga sulo; nagliliparan ang mga liyab ng apoy.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga tilamsik ng apoy” o, marahil, “mga nagliliyab na palaso”; bihira at hindi tiyak ang kahulugan ng salitang Hebreo.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִפִּיו
  choice: Mula sa bibig nito
  rationale: Likas sa modernong Filipino ang “mula sa bibig nito” para sa מִן + פֶּה na may panlalaking isahang hulapi. Ginamit ang “nito” dahil hayop ang tinutukoy at hindi kailangang ilipat sa Filipino ang gramatikal na kasariang panlalaki ng Hebreo.
- source_word: לַפִּידִים
  choice: mga sulo
  rationale: Karaniwang tumutukoy ang לַפִּידִים sa mga sulo o nagliliyab na piraso ng kahoy. Pinananatili ng “mga sulo” ang kongkretong larawan sa tula.
- source_word: יַהֲלֹכוּ
  choice: lumalabas
  rationale: Bagaman literal na may diwang “humayo/lumakad,” sa pariralang mula sa bibig at sa mga bagay na apoy ang paksa, likas na ipinahihiwatig nito ang paglabas.
- source_word: כִּידוֹדֵי אֵשׁ
  choice: mga liyab ng apoy
  rationale: Bihira at pinagtatalunan ang כִּידוֹדֵי. Sa parallelismong makata, inilalarawan nito ang maliliit o humahagibis na bugso ng apoy. Ang “mga liyab ng apoy” ay nagpapanatili ng larawan nang hindi ipinipilit ang tiyak na anyong sandata.
- source_word: יִתְמַלָּטוּ
  choice: nagliliparan
  rationale: Ang batayang diwa ay “makatakas/makawala,” ngunit dito ay masiglang pagbugso palabas ng apoy. Ipinahahayag ng “nagliliparan” ang mabilis at paulit-ulit na galaw na hinihingi ng maramihang paksa.
