  source_fidelity: 'Tumpak na naipapasa ng salin ang dalawang Hebreong nominal/metaporikong larawan: “mga pinto ng kaniyang mukha” para sa דַּלְתֵי פָנָיו at ang lagim na nakapalibot sa mga ngipin. Ang “Sino ang nakapagbukas” ay katanggap-tanggap na paglalapat ng retorikal na perfect ng פִתֵּחַ, nang hindi ipinipilit ang isang doktrinal o labis na interpretatibong pagbasa.'
