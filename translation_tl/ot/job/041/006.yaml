translation:
  language: tl
  text: Sino ang nakapagbukas ng mga pinto ng kaniyang mukha?[a] Sa palibot ng kaniyang mga ngipin ay lagim.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Sino ang makapagbubukas ng mga pinto ng kaniyang bibig?” Literal sa Hebreo, “mga pinto ng kaniyang mukha,” isang matalinghagang paglalarawan sa bibig o mga panga.
    reason: lexical_alternative
  - marker: b
    text: O “Sa palibot ng kaniyang mga ngipin ay sindak.”
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּלְתֵי
  choice: mga pinto
  rationale: Pinananatili ang literal at matingkad na metapora ng pangmaramihang anyong construct na ‘mga pinto’; ang ‘mga panga’ ay mas mapagpaliwanag kaysa sa mismong salita.
- source_word: פָנָיו
  choice: kaniyang mukha
  rationale: Ang karaniwang kahulugan ay ‘kaniyang mukha.’ Sa konteksto, tumutukoy ito sa bahaging kinaroroonan ng bibig, ngunit pinananatili sa pangunahing teksto ang larawang Hebreo.
- source_word: מִי
  choice: Sino
  rationale: Likas na salin ng panghalip na patanong na nagpapakilala ng retorikal na tanong.
- source_word: פִתֵּחַ
  choice: nakapagbukas
  rationale: Isinasalin ang ganap na kilos ng pandiwa at, sa retorikal na konteksto, likas na ipinahihiwatig ang kakayahang gawin iyon nang hindi tahasang ginagawang simpleng pangkasalukuyang ‘makapagbubukas.’
- source_word: סְבִיבוֹת
  choice: Sa palibot
  rationale: Natural na Filipino para sa nakapaligid na bahagi o paligid.
- source_word: שִׁנָּיו
  choice: kaniyang mga ngipin
  rationale: Tuwirang salin ng ‘mga ngipin’; ang ‘mga pangil’ ay magdaragdag ng kahulugang hindi tahasang nasa Hebreo.
- source_word: אֵימָה
  choice: lagim
  rationale: Ang ‘lagim’ ay maikli, marangal, at malakas na katumbas ng takot o sindak na dulot ng nakapangingilabot na anyo.
