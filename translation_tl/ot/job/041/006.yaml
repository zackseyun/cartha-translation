  terminology: Ang “mga pinto,” “mukha,” “mga ngipin,” at “lagim” ay angkop na katumbas ng mga pangunahing termino. Ang “lagim” ay may sapat na bigat para sa אֵימָה; ang alternatibong “sindak” ay wastong naitala. Wasto at malinaw ang ankla ng dalawang talababa.
