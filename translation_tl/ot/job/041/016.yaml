  yaml_path: translation/ot/job/041/016.yaml
  text: His heart is hard like a stone[a], hard like the lower millstone.
translation:
  language: tl
  text: Matigas na parang bato ang puso nito; matigas na parang batong pang-ilalim ng gilingan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “matibay na parang batong pang-ilalim ng gilingan.” Ang pandiwang Hebreo ay literal na kaugnay ng pagbubuhos o paghuhulma, kaya nagpapahiwatig ng pagiging buo, matibay, o matigas.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבּוֹ
  choice: ang puso nito
  rationale: Karaniwang tumutukoy ang לֵב sa puso bilang sentro ng kalooban at disposisyon. Ang “puso” ang pinakanatural at nagpapanatili sa konkretong larawan; ginamit ang “nito” para sa nilalang na inilalarawan.
- source_word: יָצוּק
  choice: matigas
  rationale: Ang pandiwang יצק ay literal na may diwang “ibuhos” o “ihulma,” ngunit dito ay naglalarawan ng isang bagay na naging buo, matibay, at matigas. Ang “matigas” ang malinaw na kahulugan sa paghahambing sa bato.
- source_word: כְּמוֹ אָבֶן
  choice: na parang bato
  rationale: Tuwirang pinananatili nito ang konkretong pagtutulad at natural ang daloy sa modernong Tagalog.
- source_word: וְיָצוּק
  choice: matigas
  rationale: Inulit ang parehong salita upang mapanatili ang paralelismo at diin ng tulang Hebreo.
- source_word: כְּפֶלַח תַּחְתִּית
  choice: na parang batong pang-ilalim ng gilingan
  rationale: Ang parirala ay tumutukoy sa mabigat at matigas na batong nasa ilalim ng gilingan. Mas malinaw sa karaniwang mambabasa ang “batong pang-ilalim ng gilingan” kaysa sa teknikal o di-likas na tambalan.
