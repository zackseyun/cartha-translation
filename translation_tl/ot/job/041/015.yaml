translation_notes:
  register: Makabagong Filipino na marangal at kongkreto ang paglalarawan. Ginamit ang “nito” dahil walang kasariang panghalip sa Filipino at ang tinutukoy ay ang nilalang sa konteksto. Pinanatili ang dalawang magkatimbang na sugnay ng tulang Hebreo.
