  terminology: Walang teolohikal na terminong kailangang isaayos. Ang “laman” ay wastong malapit na katumbas ng בשר. Pinanatili ang walang-kasariang pagtukoy sa nilalang; ang “sa kanya” ay likas na gamit sa Filipino para sa hayop o nilalang at mas tuwirang katumbas ng עָלָיו.
