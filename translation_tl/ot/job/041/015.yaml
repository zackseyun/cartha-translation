  text: The folds of his flesh cling together[a]; they are cast firm upon him and cannot be moved.
translation:
  language: tl
  text: Ang mga tiklop ng laman nito ay magkakadikit; ang mga ito’y matibay na nakalapat sa kanya[a] at hindi matitinag.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring, “matibay na nakapirmi sa kanya.” Gumagamit ang Hebreo ng larawan ng isang bagay na ibinuhos o hinulma upang maging matatag at di-matinag.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַפְּלֵי
  choice: mga tiklop
  rationale: Tumutukoy ang salita sa mga nakalaylay o nakatiklop na bahagi; ang “mga tiklop” ang pinakanatural sa paglalarawan ng laman ng nilalang.
- source_word: בְשָׂרוֹ
  choice: laman nito
  rationale: Pinananatili ang karaniwang kahulugan ng בשר na “laman,” sa halip na gawing mas interpretatibong “balat” o mas malawak na “katawan.”
- source_word: דָבֵקוּ
  choice: mahigpit na magkakadikit
  rationale: Ipinahahayag ng דבק ang mahigpit na pagdikit. Ang “magkakadikit” ay angkop sa maramihang simuno, at nililinaw ng “mahigpit” ang tibay ng pagkakadugtong.
- source_word: יָצוּק
  choice: nakahulma ... nang matatag
  rationale: Ipinahihiwatig ng anyong ito ang isang bagay na ibinuhos o hinulma at sa gayon ay naging matatag. Pinananatili ng “nakahulma” ang konkretong larawan habang natural sa Filipino.
- source_word: עָלָיו
  choice: sa katawan nito
  rationale: Ginawang tahasan ang tinutukoy ng panghalip upang maging malinaw at natural sa Filipino na ang mga tiklop ay matatag na nakahulma sa mismong nilalang.
- source_word: בַּל יִמּוֹט
  choice: hindi maigalaw
  rationale: Ang ποιetikong pagtanggi at Niphal ng מוט ay nagsasaad na hindi ito matitinag o magagalaw; “hindi maigalaw” ang tuwiran at malinaw na katumbas.
