translation:
  language: tl
  text: Tunay ngang mabibigo ang pag-asa niya[a]; hindi ba siya mapapabagsak sa mismong pagkakita pa lamang sa kanya?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “mapatutunayang walang batayan ang inaasahan niya,” o “mawawalan ng saysay ang kanyang pagtitiwala.” Maaaring idiin ng pandiwang Hebreo na ang pag-asa ay napatunayang mapanlinlang o nauwi sa kabiguan.
    reason: lexical_alternative
  - marker: b
    text: O, “hindi ba siya malulugmok sa mismong pagkakita sa kanya?”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Tunay nga
  rationale: Nagpapakilala ito ng mariin at pantawag-pansing pahayag. Mas natural sa marangal na makabagong Tagalog ang “Tunay nga” kaysa sa literal ngunit matigas na “Narito.”
- source_word: תֹּחַלְתּוֹ
  choice: ang pag-asa niya
  rationale: Ang pangngalan ay tumutukoy sa pag-asa o inaasahan. Pinananatili ng salin ang panghalip na nasa Hebreo at hindi tahasang tinutukoy kung sino ang umaasa.
- source_word: נִכְזָבָה
  choice: mabibigo
  rationale: Ang pandiwa ay nagsasaad na ang pag-asa ay mapatutunayang mapanlinlang, walang batayan, o bigo. Ang “mabibigo” ang pinakanatural na maikling katumbas sa Tagalog, habang inilalahad sa talababa ang iba pang himig ng salita.
- source_word: הֲגַם
  choice: hindi ba ... kahit
  rationale: Pinananatili ng “hindi ba” ang retorikal na tanong, at ng “kahit” ang nagpapatingkad na diwa ng partikula.
- source_word: אֶל מַרְאָיו
  choice: kahit sa makita lamang niya ito
  rationale: Inihahatid nito sa natural na Tagalog ang reaksiyong dulot ng mismong pagkakita sa nilalang. Ang “lamang” ay nagpapahayag ng diwang sapat na ang tanawin nito upang magpabagsak.
- source_word: יֻטָל
  choice: mapapabagsak
  rationale: Pinananatili nito ang balintiyak na anyo at ang ideya ng pagkahagis o pagkakalugmok, nang hindi tiyakang nililimitahan kung pisikal na pagbagsak o panlulupaypay sa takot ang tinutukoy.
