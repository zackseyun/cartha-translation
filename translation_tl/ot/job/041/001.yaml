translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog na angkop sa patulang pananalita. Pinanatili ang mga panghalip at ang retorikal na tanong ng Hebreo upang hindi dagdagan ang teksto ng isang tahasang tinukoy na tagahuli o upang hindi lutasin ang posibleng saklaw ng “mapapabagsak.”
