  yaml_path: translation/ot/job/041/008.yaml
  text: They press close[a], one to another, and no air can come between them.
translation:
  language: tl
  text: Dikit na dikit ang mga iyon sa isa’t isa, at walang hanging makakadaan sa pagitan ng mga iyon.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “at walang hangin o hiningang pumapasok sa pagitan ng mga iyon.” Ang Hebreong רוּחַ ay maaaring mangahulugang “hangin,” “bugso ng hangin,” o “hininga”; pisikal ang diwa rito.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶחָד ... בְּאֶחָד
  choice: sa isa’t isa
  rationale: Ipinahahayag ng inuulit na אֶחָד na may בְּ ang magkatabing ugnayan ng bawat kaliskis sa kasunod nito; natural itong ipinapahayag sa Tagalog bilang “sa isa’t isa.”
- source_word: יִגַּשׁוּ
  choice: dikit na dikit
  rationale: Bagaman karaniwang nangangahulugang “lumapit,” sa konteksto ng magkakasiksik na kaliskis ay ipinahahayag nito ang napakahigpit na pagkakadikit.
- source_word: וְרוּחַ
  choice: hangin
  rationale: Sa pisikal na paglalarawang ito, ang רוּחַ ay tumutukoy sa hangin, hindi sa espiritu. Pinananatili ng talababa ang posibleng diwang “bugso ng hangin” o “hininga.”
- source_word: לֹא יָבֹא
  choice: walang ... makakadaan
  rationale: Ipinakikita ng negatibong imperfect ang praktikal na imposibilidad na makapasok o makaraan ang hangin dahil sa higpit ng pagkakadikit.
- source_word: בֵינֵיהֶם
  choice: sa pagitan ng mga iyon
  rationale: Tuwirang spatial ang kahulugan ng בֵּין dito at tumutukoy sa pagitan ng magkakatabing kaliskis.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “mga iyon” sapagkat ang tinutukoy sa konteksto ay mga kaliskis; iniwasan ang tahasang pagdagdag ng “kaliskis” upang mapanatili ang anyo ng talata. Inilagay ang talababa pagkatapos ng buong pahayag na may kaugnayan sa רוּחַ.
