    issue: Idinagdag sa pangunahing teksto ang “kaniyang katawan.”
    rationale: Walang tahasang pangngalan para sa katawan sa Hebreo. Bagaman maaaring ipahiwatig ng konteksto ang pagkilos ni Leviatan, ang dagdag na ito ay nagpapaliit sa sintaktikong kalabuan ng source.
  - severity: low
    issue: Ang pangunahing salin ng ikalawang sugnay ay masyadong literal ngunit hindi natural sa Filipino.
    rationale: Ang “inilalatag niya ang kaniyang katawan na parang paragos” ay hindi pangkaraniwang paglalarawan sa Filipino at nakasalalay sa dagdag na layon. Ang “nag-iiwan ... ng bakas” ay naghahatid ng larawan sa mas natural na paraan, habang itinatala ng talababa ang ibang pagbasa.
  revised_text: Sa ilalim niya ay may matutulis na bibinga ng palayok[a]; sa putik ay nag-iiwan siya ng bakas na gaya ng paragos na panggiik.[b]
