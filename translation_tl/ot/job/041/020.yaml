translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘mamamana’ sa pangunahing teksto upang maging agad na maunawaan ang idyoma, ngunit pinanatili sa talababa ang literal na larawang Hebreo. Ang ‘panghilagpos’ ay bahagyang pormal ngunit mas tumpak sa sinaunang sandata kaysa ‘tirador.’
