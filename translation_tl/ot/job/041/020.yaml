  text: The son of the bow cannot make him flee[a]; slingstones become like stubble to him.
translation:
  language: tl
  text: Hindi siya mapapaalis ng mamamana[a]; ang mga batong panghilagpos ay nagiging parang dayami lamang sa kanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “anak ng busog,” isang idyoma para sa mamamana.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַבְרִיחֶנּוּ
  choice: mapatatakas siya
  rationale: Pinananatili ng anyong causative ng ברח ang diwang ‘magpangyaring tumakas’; sa ayos na pasibo, likas sa Filipino ang ‘hindi siya mapatatakas.’
- source_word: בֶן קָשֶׁת
  choice: mamamana
  rationale: Ang literal na ‘anak ng busog’ ay idyomang Hebreo para sa taong gumagamit ng busog. Mas malinaw at natural sa modernong Filipino ang ‘mamamana,’ habang inilalagay sa talababa ang literal na anyo.
- source_word: לְקַשׁ
  choice: parang dayami lamang
  rationale: Ang קַשׁ ay tuyong tangkay o dayaming natitira matapos ang pag-aani. Ipinahahayag ng ‘dayami lamang’ ang pagiging magaan at walang bisa nito sa paghahambing, nang hindi ito ipinagkakamaling ipa.
- source_word: נֶהְפְּכוּ לוֹ
  choice: nagiging ... sa kanya
  rationale: Ang Niphal ng הפך ay nagsasaad dito ng kalagayang parang nagbago ang mga bato tungo sa isang bagay na walang gaanong bisa kaugnay niya; natural itong naihahayag ng ‘nagiging ... sa kanya.’
- source_word: אַבְנֵי קָלַע
  choice: mga batong panghilagpos
  rationale: Tumutukoy ang pariralang construct sa mga batong ginagamit sa sinaunang panghilagpos. Iniiwasan ng saling ito ang ‘tirador,’ na sa kasalukuyang Filipino ay kadalasang tumutukoy sa slingshot na may goma.
