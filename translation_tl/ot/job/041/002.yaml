  text: No one is so fierce that he dares to stir him up[a]. Who then is he who can stand before me?
translation:
  language: tl
  text: Walang sinumang napakabangis na mangangahas pumukaw sa kanya.[a] Kung gayon, sino ang makatatayo sa harap ko?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “gisingin siya.” Ang pandiwang Hebreo ay nangangahulugang “gumising” o “pumukaw”; dito, ipinahihiwatig nito ang pagpukaw o paghamon sa Leviatan.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא אַכְזָר
  choice: Walang sinumang napakabangis
  rationale: Ang לֹא kasama ng pang-uring אַכְזָר ay likas na ipinahahayag sa Filipino bilang kawalan ng sinumang may gayong tindi ng bangis. Ang “napakabangis” ay angkop sa nakatatakot na tapang sa harap ng Leviatan at hindi agad naglalagay ng moral na kahulugang taglay ng “malupit.”
- source_word: כִּי יְעוּרֶנּוּ
  choice: na mangangahas pumukaw sa kanya
  rationale: Ang pandiwang עור ay nangangahulugang gumising o pumukaw. Sa konteksto, tumutukoy ito sa pagpukaw o paghamon sa Leviatan. Idinagdag ang “mangangahas” upang likas na maipahayag ang pahiwatig ng retorikal na pangungusap, nang hindi ginagawang tahasang bahagi ng leksikal na kahulugan ng pandiwa.
- source_word: וּמִי הוּא
  choice: Kung gayon, sino
  rationale: Ang pangatnig at pananong ay naghahatid ng paghinuha mula sa Leviatan tungo sa Diyos. Ang “Kung gayon” ay malinaw at natural na naghahayag ng ugnayang ito sa modernong Filipino.
- source_word: לְפָנַי יִתְיַצָּב
  choice: ang makatatayo sa harap ko
  rationale: Ang hitpael ng יצב ay “pumuwesto” o “tumindig,” at ang לְפָנַי ay literal na “sa harap ko.” Pinananatili ng salin ang larawang may makatatagal o makakaharap sa presensiya ng Diyos.
theological_decisions:
- issue: Ang kaugnayan ng unang sugnay tungkol sa Leviatan at ng ikalawang sugnay tungkol sa Diyos
  choice: 'Ang ikalawang sugnay ay lumilipat mula sa Leviatan tungo sa Diyos: kung walang nangangahas pumukaw sa nilalang, lalo nang walang makatatayo sa harap ng Maylalang.'
  alternative: Ang dalawang sugnay ay kapuwa tumutukoy lamang sa Leviatan.
  rationale: Malinaw na unang panauhan ang hulaping nasa לְפָנַי, “sa harap ko,” sa loob ng pagsasalita ng Diyos. Gayunman, hindi pinalalawig ng salin ang lohika nang higit sa mismong retorikal na tanong.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “Leviatan” sa talababa para sa malinaw na reperensiya sa nilalang na tinatalakay sa konteksto. Ang “pumukaw” ay pinili kaysa sa mas kolokyal na “galitin” upang mapanatili ang saklaw ng Hebreong pandiwa.
