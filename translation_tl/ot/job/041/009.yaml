  yaml_path: translation/ot/job/041/009.yaml
  text: Each one sticks to its fellow[a]; they are clasped together and cannot be separated.
translation:
  language: tl
  text: Bawat isa ay nakadikit sa kapwa nito[a]; mahigpit silang magkakabit at hindi mapaghihiwalay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literal: “Bawat isa ay nakadikit sa kapatid nito.” Ang “kapatid” ay mas pormal na alternatibo sa “kapwa” sa makatang paglalarawang ito ng mga kaliskis ng Leviatan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  choice: Bawat isa
  rationale: Ginagamit dito ang אִישׁ sa diwang pamahagi, tumutukoy sa bawat kaliskis ng Leviatan, hindi sa isang lalaking tao.
- source_word: בְּאָחִיהוּ
  choice: sa katabi nito
  rationale: Literal itong “sa kapatid nito.” Sa paglalarawan sa magkakatabing kaliskis, likas at malinaw sa modernong Tagalog ang “katabi nito,” habang pinananatili sa talababa ang talinghagang “kapatid.”
- source_word: יְדֻבָּקוּ
  choice: mahigpit na nakakapit
  rationale: Ipinapahayag ng ugat na דבק ang mahigpit na pagdikit o pagkapit; ang parirala ay malinaw na naglalarawan sa halos walang puwang na pagkakadikit ng mga kaliskis.
- source_word: יִתְלַכְּדוּ
  choice: magkakakawing
  rationale: Ipinahihiwatig ng pandiwa ang pagkakahuli, pagkakasilo, o mahigpit na pagkakaugnay. Ang “magkakakawing” ay masining ngunit madaling maunawaan at angkop sa magkakabit na mga kaliskis.
- source_word: וְלֹא יִתְפָּרָדוּ
  choice: at hindi mapaghihiwalay
  rationale: 'Ipinapakita nito ang bunga ng kanilang mahigpit na pagkakaugnay: hindi sila maihihiwalay sa isa’t isa.'
