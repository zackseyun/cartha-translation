  yaml_path: translation/ot/job/041/003.yaml
  text: Who has first given to me[a], that I should repay him? Whatever is under all the heavens is mine.
translation:
  language: tl
  text: Sino ang nagbigay muna sa akin[a], upang suklian ko siya? Akin ang lahat ng nasa silong ng buong langit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas pormal, “Sino ang nauna sa akin, upang suklian ko siya?” Ang pandiwang Hebreo ay maaaring mangahulugang “mauna” o “unahan,” ngunit dito ay malamang na tumutukoy sa pagbibigay muna upang magkaroon ng obligasyong gumanti ang pinagbigyan.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי
  choice: Sino
  rationale: Tuwirang panghalip na pananong na nagpapanatili sa lakas ng retorikal na tanong nang walang idinagdag na diin.
- source_word: הִקְדִּימַנִי
  choice: ang unang nagbigay sa akin
  rationale: Bagaman ang pandiwang קדם sa Hiphil ay maaaring mangahulugang ‘nauna sa akin,’ ipinahihiwatig ng kasunod na ‘upang bayaran ko siya’ ang isang naunang pagbibigay na maglalagay sa Diyos sa pagkakautang. Natural sa Filipino ang ‘unang nagbigay sa akin’ at pinananatili ng talababa ang mas pormal na alternatibo.
- source_word: וַאֲשַׁלֵּם
  choice: upang bayaran ko siya
  rationale: Inihahayag dito ang ibubungang obligasyong gumanti o magbayad. Ang ‘siya’ ay likas na ipinahihiwatig na layon ng pandiwa sa retorikal na tanong.
- source_word: תַּחַת כָּל הַשָּׁמַיִם
  choice: nasa silong ng buong langit
  rationale: Ang ‘nasa silong ng buong langit’ ay dignified at natural na Filipino para sa lahat ng nasa nilikhang daigdig. Ginamit ang kolektibong ‘buong langit’ sa halip na di-likas na literal na pangmaramihan.
- source_word: לִי הוּא
  choice: Akin ang lahat
  rationale: Pinananatili ng paunang ‘Akin’ ang diin ng Hebreong לִי. Ang ‘lahat’ ay tahasang kumakatawan sa kabuuang ipinahihiwatig ng pariralang kasunod.
theological_decisions:
- issue: Ang pagkakautang ng Diyos at ang pagmamay-ari niya sa lahat
  choice: Isinalin ang unang sugnay bilang retorikal na pagtanggi na may sinumang makapagbibigay muna sa Diyos at sa gayon ay makapaglalagay sa kanya sa obligasyong magbayad; kasunod nito ang pahayag na kanya ang lahat sa ilalim ng langit.
  alternative: Maaaring isalin nang mas pormal bilang ‘Sino ang nauna sa akin, upang bayaran ko siya?’ nang hindi tahasang ipinakikita ang diwa ng naunang pagbibigay.
  rationale: Ang pag-uugnay ng הִקְדִּימַנִי sa וַאֲשַׁלֵּם ay nagpapakitang hindi lamang temporal na pag-una ang punto kundi ang diumano’y paglalagay sa Diyos sa pagkakautang. Gayunman, pinananatili sa talababa ang tunay na leksikal na posibilidad na ‘nauna sa akin.’
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘nasa silong ng buong langit’ upang mapanatili ang bahagyang matayog na himig ng tula nang hindi nagiging lipas o mahirap unawain.
