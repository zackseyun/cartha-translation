lexical_decisions:
- source_word: יַחְשֹׁב
  choice: Itinuturing niya
  rationale: Ipinahahayag ng pandiwang חׁשב ang pagtataya o pagtingin sa isang bagay; likas sa modernong Filipino ang “itinuturing” at pinananatili nitong bale-wala sa nilalang ang matitibay na metal.
- source_word: לְתֶבֶן
  choice: dayami
  rationale: Karaniwang tumutukoy ang תבן sa dayami o tuyong tangkay; ipinakikita ng לְ ang paghahambing, kaya “dayami” ang tuwiran at natural na salin.
- source_word: בַּרְזֶל
  choice: bakal
  rationale: Ito ang karaniwang katumbas ng terminong Hebreo para sa iron.
- source_word: לְעֵץ רִקָּבוֹן
  choice: bulok na kahoy
  rationale: Literal na tumutukoy ang parirala sa kahoy na nabubulok o naaagnas; malinaw at idyomatiko sa Filipino ang “bulok na kahoy.”
- source_word: נְחוּשָׁה
  choice: tanso
  rationale: Maaaring tumukoy ang נְחוּשָׁה sa copper o bronze. Ang “tanso” ay natural na pangkalahatang katawagan sa Filipino sa ganitong kontekstong metal, habang inilalahad sa talababa ang tunay na leksikal na kalabuan.
