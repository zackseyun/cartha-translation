  text: He makes the deep boil like a pot[a]; he makes the sea like a pot of ointment.
translation:
  language: tl
  text: 'Pinakukulo niya ang kalaliman na parang palayok;

    ginagawa niyang parang timplang pabango[a] ang dagat.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “timplang pamahid.” Ang salitang Hebreo ay tumutukoy sa pinaghalong mga sangkap, na madalas iugnay sa pabango o pamahid.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַרְתִּיחַ
  choice: pinakukulo niya
  rationale: Ang Hiphil ng רתח ay nagsasaad ng pagpapakulo o pagpapalagablab; malinaw at natural sa Filipino ang “pinakukulo niya” at napapanatili nito ang causative na diwa.
- source_word: כַּסִּיר
  choice: na parang palayok
  rationale: Ang סִיר ay isang palayok o sisidlang panluto. Karaniwan at tuwiran sa modernong Filipino ang “palayok.”
- source_word: מְצוּלָה
  choice: ang kalaliman
  rationale: Tumutukoy ang מְצוּלָה sa malalim na bahagi ng tubig o dagat. Pinananatili ng “kalaliman” ang matalinghagang larawan at ang pagtutugma nito sa “dagat.”
- source_word: יָם
  choice: ang dagat
  rationale: Ang karaniwang kahulugan ng יָם ay “dagat,” kaya pinananatili rito ang kongkretong larawan ng Hebreo.
- source_word: יָשִׂים
  choice: ginagawa niyang
  rationale: Bagaman madalas mangahulugang “ilagay” ang שׂים, sa ganitong paghahambing ay natural itong nagpapahayag ng paggawa o pagturing sa isang bagay na gaya ng isa pa.
- source_word: כַּמֶּרְקָחָה
  choice: parang timplang pabango
  rationale: Ang מֶרְקָחָה ay pinaghalong kompuwesto na karaniwang iniuugnay sa pabango o pamahid. Ang “timplang pabango” ay nagpapanatili sa larawan ng hinalong sangkap nang hindi nagdaragdag ng sisidlang wala sa Hebreo.
