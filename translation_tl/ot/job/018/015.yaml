base_translation:
  language: en
  yaml_path: translation/ot/job/018/015.yaml
  text: In his tent dwells no longer his[b][a]; sulfur is scattered over his dwelling.
translation:
  language: tl
  text: Sa kanyang tolda ay mananahan ang hindi na kanya[a]; isasabog ang asupre[b] sa ibabaw ng kanyang tahanan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mahirap ang sintaks ng Hebreo. Maaari ring unawain na ang asupre ang huling binanggit na simuno: “Mananahan ang asupre sa kanyang tolda, na hindi na kanya.” Posible ring ang diwa ay wala nang anumang pag-aari niya na natitira sa tolda.'
    reason: alternative_reading
  - marker: b
    text: Ang “asupre” ay tinatawag ding “azufre” sa mas tradisyonal na gamit.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּשְׁכּוֹן
  choice: mananahan
  rationale: Ang pandiwa ay mula sa שכן, “manahan” o “tumira.” Nasa anyong ikatlong panauhang pambabae ito, kaya maaaring ang pambabaeng pangngalang גָפְרִית (“asupre”) sa hulihan ng talata ang huling inilagay na simuno.
- source_word: בְּאָהֳלוֹ
  choice: sa toldang
  rationale: Literal na “sa kanyang tolda.” Pinanatili ang kongkretong larawan ng tolda, ngunit iniugnay ito sa pariralang “hindi na kanya” upang maging natural sa Filipino.
- source_word: מִבְּלִי לוֹ
  choice: hindi na kanya
  rationale: Pinaikli at mahirap ang pariralang Hebreo; ipinahihiwatig nito ang pagkawala o pagkakait ng pag-aari. Hindi nito tiyak na sinasabi kung ang tolda, ang nananahan doon, o ang anumang dating pag-aari niya ang tinutukoy, kaya nilagyan ng talababa ang ibang posibleng pagbasa.
- source_word: יְזֹרֶה
  choice: ikakalat
  rationale: Ang Piel ng זרה ay “ikalat” o “isabog.” Maaaring impersonal ang ikatlong panauhang panlalaki sa Hebreo; hindi pinangalanan sa salin ang gumagawa.
- source_word: עַל נָוֵהוּ
  choice: sa kanyang tahanan
  rationale: Ang נָוֶה ay maaaring tirahan, tahanan, o pastulan. Dahil katambal ito ng “tolda,” ang “tahanan” ang pinakaangkop sa larawan ng wasak na tirahan.
- source_word: גָפְרִית
  choice: asupre
  rationale: Ang גָפְרִית ay sulfur. “Asupre” ang malinaw at karaniwang katawagang Filipino, samantalang ang “azufre” ay isang tradisyonal na anyo.
theological_decisions:
- issue: Ang simuno ng pambabaeng pandiwang תִּשְׁכּוֹן at ang kahulugan ng מִבְּלִי לוֹ
  choice: 'Itinuring ang “asupre” bilang simunong huling binanggit: mananahan ito sa toldang hindi na kanya.'
  alternative: 'Maaaring isalin: “Sa tolda niya mananahan ang hindi kanya,” o unawaing wala nang anumang pag-aari niya na natitira roon.'
  rationale: Siksik at tunay na malabo ang sintaks ng Hebreo. Ang napiling pagbasa ay umaayon sa pambabaeng anyo ng pandiwa at sa larawan ng asupre bilang tanda ng paghatol, ngunit hindi itinangging posible ang pagbasa tungkol sa ibang nananahan o sa kawalan ng natirang pag-aari.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Pinanatili ang magkatambal na larawan ng “tolda” at “tahanan,” at iniwasan ang pagdaragdag ng tahasang tagagawa ng pagkalat. Ang unang sugnay ay nilinaw para sa likas na ayos ng Filipino, habang ang tunay na kalabuan ng Hebreo ay inilagay sa talababa.
