  yaml_path: translation/ot/job/018/004.yaml
  text: You who tear yourself apart in your anger—shall the earth be abandoned for your sake[a], or a rock be moved from its place?
translation:
  language: tl
  text: Ikaw na pinupunit ang sarili mo sa galit—pababayaan ba ang daigdig alang-alang sa iyo, o aalisin ang isang bato mula sa kinalalagyan nito?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: טֹרֵף נַפְשׁוֹ
  choice: nilalapa ang iyong sarili
  rationale: Ang טֹרֵף ay masidhing larawan ng pagpunit o paglapang gaya ng ginagawa sa samsam. Kasama ng נַפְשׁוֹ, inilalarawan nito ang galit na sumisira sa sarili; pinananatili ng “nilalapa ang iyong sarili” ang talas ng talinghaga at ang likas na reflexive na diwa sa Filipino.
- source_word: בְּאַפּוֹ
  choice: sa galit
  rationale: Karaniwang tumutukoy ang אַף sa galit, bagaman literal itong ‘ilong.’ Ang pangalawang panauhan ay ginamit sa pangunahing teksto upang umayon sa tahasang לְמַעַנְךָ at sa tuwirang pagsaway kay Job.
- source_word: הֲלְמַעַנְךָ
  choice: ba ... alang-alang sa iyo
  rationale: Ipinahahayag ng לְמַעַן na ang mundo ay tila kailangang magbago dahil sa kapakanan o dahil sa pag-aangkin ng kausap. Likas at marangal sa Filipino ang “alang-alang sa iyo.”
- source_word: תֵּעָזַב אָרֶץ
  choice: iiwanan ba ang lupa
  rationale: Ang Niphal ng עזב ay may pasibong diwang ‘iwan’ o ‘pabayaan.’ Sa kasabihang may malawak na saklaw, mas angkop ang “lupa” bilang daigdig kaysa isang tiyak na lupain.
- source_word: וְיֶעְתַּק צוּר מִמְּקֹמוֹ
  choice: o aalisin ang isang bato mula sa kinalalagyan nito
  rationale: Ang עתק dito ay pag-aalis o paglilipat mula sa lugar. Ang “isang bato” ay nagpapanatili sa pangkalahatan at kawikaang larawan at umiiwas na ipakahulugan ang צוּר bilang isang tiyak na titulong teolohiko.
theological_decisions:
- issue: Paglipat mula ikatlong panauhan tungo sa tuwirang ikalawang panauhan
  choice: 'Ginawang tuwirang pakikipag-usap ang pangunahing teksto: “Ikaw na nilalapa ang iyong sarili...”'
  alternative: 'Mas pormal: “Siyang lumalapa sa sarili niya sa galit—iiwanan ba ang lupa alang-alang sa iyo...?”'
  rationale: Ang pambungad na participle at mga hulapi ay pormal na nasa ikatlong panauhan, ngunit agad na sumusunod ang ikalawang panauhang לְמַעַנְךָ. Ipinahahayag ng pangunahing salin ang malinaw na retorikal na pagsaway kay Job, habang itinatala sa talababa ang tunay na pagbabago ng panauhan sa Hebreo.
- issue: Saklaw ng retorikal na tanong
  choice: Pagbabago ng matatag na kaayusan ng mundo alang-alang kay Job
  alternative: Isang literal na pag-iwan sa isang partikular na lupain at paglilipat ng isang tiyak na bato
  rationale: Ang magkatulad na larawan ng lupa at batong inaalis sa kinalalagyan ay nagpapahiwatig ng di-makatwirang pagbaligtad sa matatag na kaayusan. Hindi dinaragdagan ng salin ang talata ng isang partikular na doktrina tungkol sa kaayusang iyon.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Pinili ang masiglang “nilalapa” upang mapanatili ang marahas na larawan ng Hebreo; malinaw at pangkaraniwan naman ang “iiwanan,” “lupa,” at “kinalalagyan.”
