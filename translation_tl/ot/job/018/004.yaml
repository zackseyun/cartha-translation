- from: Ikaw na nilalapa ang iyong sarili sa galit—iiwanan ba ang lupa alang-alang sa iyo[a], o aalisin ang isang bato mula sa kinalalagyan nito?
  to: Ikaw na pinupunit ang sarili mo sa galit—pababayaan ba ang daigdig alang-alang sa iyo, o aalisin ang isang bato mula sa kinalalagyan nito?
  rationale: Pinalitan ang “nilalapa” ng “pinupunit” upang maipahayag nang mas tumpak at natural ang larawan ng Hebreo ng pagsira sa sarili sa galit. Ginawang malinaw ang pasibong diwa ng “pababayaan,” at “daigdig” ang ginamit para sa pangkalahatang saklaw ng אָרֶץ. Pinanatili ang tuwirang ikalawang panauhan sa pangunahing teksto at ang pagbabago mula ikatlo tungo sa ikalawang panauhan sa talababa.
