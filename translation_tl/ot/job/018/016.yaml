  yaml_path: translation/ot/job/018/016.yaml
  text: His roots dry up beneath[a], and above, his branch withers.
translation:
  language: tl
  text: 'Sa ilalim, matutuyo ang kanyang mga ugat,


    at sa ibabaw, mapuputol ang kanyang usbong.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa ibabaw, puputulin ang kanyang ani.” Ang salitang Hebreo ay maaaring tumukoy sa ani o sa bahaging pinuputol o ginagapas; sa kontekstong ito, malamang na tumutukoy ito sa tumutubong bahagi ng halaman sa ibabaw.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִתַּחַת
  choice: sa ilalim
  rationale: Pinananatili ang panandang panlunan at ang pagtutumbas nito sa “sa ibabaw” sa ikalawang taludtod.
- source_word: שָׁרָשָׁיו
  choice: ang kanyang mga ugat
  rationale: Isinasalin ang pangmaramihang anyo at pinananatili ang larawan ng halaman.
- source_word: יִבָשׁוּ
  choice: matutuyo
  rationale: Tuwirang inilalarawan ang pagkatuyo ng mga ugat; natural ito sa makabagong Tagalog at hindi dinaragdagan ang metapora.
- source_word: וּמִמַּעַל
  choice: at sa ibabaw
  rationale: Pinananatili ang maikli at patulang pagsalungat sa “sa ilalim.”
- source_word: יִמַּל
  choice: mapuputol
  rationale: Ipinahahayag ang diwa ng pagkaputol o pagkatabas ng halaman, sa halip na ipakahulugang simpleng pagkalanta.
- source_word: קְצִירוֹ
  choice: ang kanyang usbong
  rationale: Bagaman karaniwang tumutukoy ang pangngalan sa ani o bagay na ginapas, dito ay katapat ito ng mga ugat at malamang na tumutukoy sa tumutubong bahagi ng halaman sa ibabaw.
theological_decisions: []
translation_notes:
  register: Makabago ngunit marangal na Tagalog, na may dalawang magkatimbang na patulang taludtod. Ginamit ang “usbong” upang maging malinaw ang larawan ng halamang may mga ugat sa ilalim at tumutubong bahagi sa ibabaw, habang inilalahad sa talababa ang lawak ng kahulugan ng salitang Hebreo.
