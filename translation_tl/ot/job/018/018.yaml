  text: Itinataboy nila siya[a] mula sa liwanag patungo sa kadiliman, at pinalalayas nila siya mula sa daigdig[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Hinahabol nila siya mula sa liwanag patungo sa kadiliman.”
    reason: lexical_alternative
  - marker: b
