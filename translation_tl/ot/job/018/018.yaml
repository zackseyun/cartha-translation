    reason: lexical_alternative
lexical_decisions:
- source_word: יֶהְדְּפֻהוּ
  choice: Itinataboy nila siya
  rationale: 'Ang Qal imperfect na may panlaping tumutukoy sa ikatlong panauhang panlalaki ay aktibo at may di-tiyak na maramihang simuno: ‘itinataboy nila siya.’ Napananatili ng ‘itinataboy’ ang diwa ng sapilitang pagpapaalis.'
- source_word: מֵאוֹר
  choice: mula sa liwanag
  rationale: Ang מִן ay nagpapahayag ng pinagmulan o paglayo, at ang אוֹר ay ‘liwanag.’ Likas at malinaw sa Tagalog ang ‘mula sa liwanag.’
- source_word: אֶל חֹשֶׁךְ
  choice: patungo sa kadiliman
  rationale: Ipinapakita ng אֶל ang direksiyon ng pagkilos. Binibigyang-diin ng ‘patungo sa’ ang paglipat mula sa liwanag tungo sa kabaligtaran nitong kadiliman.
- source_word: וּמִתֵּבֵל
  choice: at … sa daigdig
  rationale: Karaniwang tumutukoy ang תֵּבֵל sa daigdig, lalo na sa daigdig na tinitirhan ng mga tao. Ang ‘daigdig’ ay maikli, marangal, at angkop sa patulang konteksto; ang diwa ng paglayo mula rito ay ipinahahayag na ng pandiwang ‘pinalalayas.’
- source_word: יְנִדֻּהוּ
  choice: pinalalayas nila siya
  rationale: Ang anyo ay aktibo, maramihan, at nagpapahiwatig ng pagpapalayo o pagpapatapon. Iniiwasan ng ‘pinalalayas’ ang di-kailangang pag-uulit sa ‘itinataboy’ habang pinananatili ang magkatulad na mga linya.
