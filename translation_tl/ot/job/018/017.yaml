  yaml_path: translation/ot/job/018/017.yaml
  text: His memory perishes from the earth[a], and he has no name on the face of the street.
translation:
  language: tl
  text: Mawawala sa lupa ang alaala niya[a], at wala siyang pangalan sa lansangan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Maglalaho sa lupain ang pag-alaala sa kanya, at wala siyang pangalan sa pampublikong liwasan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: זִכְרוֹ
  choice: ang alaala niya
  rationale: Ang pangngalan ay tumutukoy sa alaala o pag-alaala sa isang tao. Likas sa modernong Tagalog ang “ang alaala niya” at ipinahihiwatig na mawawala siya sa gunita ng mga tao.
- source_word: אָבַד
  choice: mawawala
  rationale: Maaaring mangahulugang mapahamak, mawala, o maglaho. Sa alaala bilang simuno, malinaw at natural ang “mawawala” habang nananatili ang mariing larawan ng lubos na pagkapawi.
- source_word: מִנִּי אָרֶץ
  choice: sa lupa
  rationale: Maaaring tumukoy ang אֶרֶץ sa lupain o sa lupa/daigdig. Ang “sa lupa” ay nagpapanatili sa malawak na saklaw ng patulang pahayag at umaangkop sa pandiwang “mawawala.”
- source_word: וְלֹא שֵׁם לוֹ
  choice: at hindi na makikilala ang pangalan niya
  rationale: Literal itong nagsasaad na wala siyang pangalan, ngunit dito ang “pangalan” ay may diwang pagkakakilanlan o reputasyong nananatili sa publiko. Ang “hindi na makikilala” ay likas sa Tagalog at ipinapahayag ang pagkawala ng pangalan sa alaala ng madla.
- source_word: עַל־פְּנֵי חוּץ
  choice: sa lansangan
  rationale: Ang חוּץ ay maaaring mangahulugang labas, lansangan, o pampublikong lugar. Ang “sa lansangan” ay maikli, marangal, at nagpapanatili sa larawang pampubliko ng taludtod; hindi natural sa Tagalog ang literal na “sa ibabaw ng mukha ng lansangan.”
theological_decisions: []
translation_notes:
  register: Makabagong Filipino na may dignidad at patulang diin. Ginamit ang “lansangan” bilang natural ngunit mataas nang bahagya ang rehistro para sa pampublikong larangan. Ang “hindi na makikilala ang pangalan niya” ay isang idyomatikong paglilipat ng Hebreong “wala siyang pangalan,” nang hindi nililimitahan ang diwa sa literal na kawalan ng pangalan.
