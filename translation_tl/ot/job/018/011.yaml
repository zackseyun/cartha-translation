  naturalness: Ang “mga sindak” ay natural at angkop sa marangal na panulaang Filipino. Bahagyang sadyang literal ang “sa kaniyang mga paa,” ngunit malinaw itong ipinaliliwanag ng talababa at mas tapat sa imaheng Hebreo kaysa sa interpretibong “sa bawat hakbang niya.”
