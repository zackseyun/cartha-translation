translation:
  language: tl
  text: 'Sa bawat panig ay sinisindak siya ng mga sindak,

    at pinangangalat siya sa kaniyang mga paa.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “sa kaniyang mga paa.” Maaari rin itong mangahulugang “sa kaniyang mga sakong”; maaaring inilalarawan nito ang mga sindak na humahabol at nagtutulak sa kaniya saanman siya humakbang.
    reason: lexical_alternative
lexical_decisions:
- source_word: סָבִיב
  choice: Pinalilibutan
  rationale: Ipinahahayag ng parirala ang pagkapaligid mula sa lahat ng dako; natural sa Filipino ang pandiwang “pinalilibutan” at napapanatili nito ang larawan ng pagkubkob.
- source_word: בִּעֲתֻהוּ
  choice: nakatatakot
  rationale: Ang pandiwang בעת ay nangangahulugang manakot o sindakin. Isinama ito sa likas na pariralang “mga nakatatakot na bagay” upang maiwasan ang alanganing pag-uulit na “sinisindak siya ng mga sindak.”
- source_word: בַלָּהוֹת
  choice: mga nakatatakot na bagay
  rationale: Tumutukoy ang pangmaramihang pangngalan sa mga sindak o kakila-kilabot na pangyayari. Mas malinaw sa karaniwang modernong Filipino ang “mga nakatatakot na bagay” kaysa sa abstraktong “mga sindak.”
- source_word: וֶהֱפִיצֻהוּ
  choice: at itinataboy siya
  rationale: Bagaman pangunahing larawan ng ugat ang pagpapangalat, sa kontekstong ito ay inilalarawan nito ang mga sindak na nagpapasugod o nagtutulak sa tao. Ang “itinataboy” ay natural at hindi labis na nililinaw ang tiyak na paraan.
- source_word: לְרַגְלָיו
  choice: sa bawat hakbang niya
  rationale: Literal itong “sa/ukol sa kaniyang mga paa,” ngunit sa konteksto ay malamang na tumutukoy sa mga sindak na humahabol o nagtutulak sa kaniya saanman siya humakbang. Pinananatili ng salin ang larawang kaugnay ng mga paa sa idiomatikong Filipino.
