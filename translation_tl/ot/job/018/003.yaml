translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Ginamit ang “inyong” sapagkat maramihan ang hulaping Hebreo sa בְּעֵינֵיכֶם at tumutukoy si Bildad kay Job habang isinasama ang kaniyang mga kasamahan sa “kami.”
