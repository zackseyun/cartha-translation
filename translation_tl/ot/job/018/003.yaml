base_translation:
  language: en
  yaml_path: translation/ot/job/018/003.yaml
  text: Why are we regarded as cattle[b][a], and considered unclean in your eyes?
translation:
  language: tl
  text: Bakit kami itinuturing na parang mga hayop[a] at inaakalang marumi sa inyong paningin?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “parang mga alagang hayop.” Malawak ang kahulugan ng salitang Hebreo at ginagamit dito bilang mapanghamak na paghahambing.
    reason: lexical_alternative
  - marker: b
    text: Mahirap tiyakin ang kahulugan ng salitang Hebreo na isinaling “inaakalang marumi”; iba-iba ang pagkaunawa rito. Sa saling ito, tumututol si Bildad sa pagtingin sa kanila bilang marumi o nadungisan.
    reason: alternative_reading
lexical_decisions:
- source_word: מַדּוּעַ
  choice: Bakit
  rationale: Likas at tuwirang katumbas ng pang-abay na patanong na nagpapasimula sa retorikal na tanong ni Bildad.
- source_word: נֶחְשַׁבְנוּ
  choice: kami itinuturing
  rationale: Ipinapahayag ng pasibong anyo ng חשׁב kung paano hinahatulan o tinitingnan ng iba ang nagsasalita at ang kaniyang mga kasama.
- source_word: כַבְּהֵמָה
  choice: na parang mga hayop
  rationale: Malawak ang saklaw ng בְּהֵמָה at maaaring tumukoy sa hayop, mabangis man o alaga. Ang “mga hayop” ay natural sa Filipino at pinananatili ang mapanghamak na paghahambing nang hindi ito nililimitahan sa baka o hayop na ligaw.
- source_word: נִטְמִינוּ
  choice: inaakalang marumi
  rationale: Mahirap ang anyong Hebreo. Ang salin ay sumusunod sa pagbasa na may diwang karumihan o pagkadungis at pinananatili ang paralelismo sa “itinuturing,” ngunit nilalagyan ng talababa upang kilalanin ang kawalang-katiyakan.
- source_word: בְּעֵינֵיכֶם
  choice: sa inyong paningin
  rationale: Pinananatili nito ang karaniwang idyomang Hebreo tungkol sa pagtingin o paghatol, sa dignified at malinaw na modernong Filipino.
