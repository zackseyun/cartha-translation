translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang dobleng pormulang Hebreo na “sumagot … at sinabi,” at ang talababa ay nagpapakita ng alternatibong pagbasa sa panimulang waw.
