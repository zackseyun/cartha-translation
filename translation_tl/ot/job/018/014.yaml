  yaml_path: translation/ot/job/018/014.yaml
  text: He is torn from the security of his tent[b][a], and he is marched off to the king of terrors.
translation:
  language: tl
  text: Iniaalis siya mula sa katiwasayan ng kaniyang tolda[a], at inihahatid siya sa hari ng mga kakilabutan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Iniaalis siya mula sa kaniyang tolda, na siyang kaniyang katiwasayan.” Maaaring tumukoy ang Hebreo sa ligtas na kalagayan sa loob ng tolda o sa tolda mismo bilang kaniyang kanlungan.
    reason: lexical_alternative
  - marker: b
    text: Ang “hari ng mga kakilabutan” ay isang matalinghagang pananalita na madalas unawain bilang kamatayan na isinatao, ngunit hindi ito tahasang tinutukoy ng Hebreo.
    reason: alternative_reading
lexical_decisions:
- source_word: יִנָּתֵק
  choice: Inilalayo
  rationale: Ang Niphal ng נתק ay nagsasaad ng sapilitang pagkakalas o pag-agaw mula sa kinaroroonan. Ang “inilalayo” ay natural sa Filipino at nagpapanatili ng pasibong diwa nang hindi labis na tumitiyak kung siya ay “pinupunit” o “binubunot.”
- source_word: מֵאָהֳלוֹ
  choice: sa ... kaniyang tolda
  rationale: Ang אֹהֶל ay literal na “tolda.” Pinananatili nito ang kongkretong larawang patula, bagaman maaari rin itong tumukoy sa tahanan.
- source_word: מִבְטַחוֹ
  choice: kapanatagan
  rationale: Ang מִבְטָח ay maaaring mangahulugang seguridad, tiwala, o pinagkukunan ng katiwasayan. Ang “kapanatagan ng kaniyang tolda” ay natural at pinananatili ang posibilidad na ang tolda ang ligtas niyang kanlungan.
- source_word: וְתַצְעִדֵהוּ
  choice: at inihahatid siya
  rationale: Ang Hiphil ng צעד ay “papaglakarin” o “akayin.” Hindi malinaw ang pambabaeng paksa ng pandiwa; kaya ang pasibong “inihahatid siya” ay umiiwas sa pagdaragdag ng isang tiyak na gumagawa habang pinananatili ang sapilitang pagdadala.
- source_word: לְמֶלֶךְ
  choice: sa hari
  rationale: Ang לְ ay nagpapahayag ng patutunguhan, kaya ang “sa hari” ang tuwirang salin.
- source_word: בַּלָּהוֹת
  choice: ng mga kakilabutan
  rationale: Ang pangmaramihang בַּלָּהוֹת ay tumutukoy sa mga sindak o kakilabutan. Ang “hari ng mga kakilabutan” ay nagpapanatili sa matingkad at misteryosong personipikasyon ng Hebreo.
theological_decisions:
- issue: Pagkakakilanlan ng “hari ng mga kakilabutan”
  choice: Panatilihin ang matalinghagang titulo nang hindi tahasang kinikilala ang tinutukoy nito.
  alternative: Tukuyin ito bilang kamatayan na isinatao, Sheol, o isang demonyong pinuno.
  rationale: Hindi tahasang ipinapaliwanag ng Hebreo ang reperente. Pinananatili ng salin ang tunay na patula at teolohikal na kalabuan sa halip na magpasok ng isang tiyak na doktrinal na pakahulugan.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Pinanatili ang kongkretong “tolda” at ang patulang “hari ng mga kakilabutan.” Ginamit ang pasibong “inihahatid” upang hindi magtakda ng di-malinaw na paksa ng pandiwang Hebreo.
