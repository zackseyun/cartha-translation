  text: Sa sinapit niya[a], nasisindak ang mga susunod[b], at nangingilabot ang mga nauna[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “sa araw niya,” malamang na tumutukoy sa araw ng kanyang kapahamakan o paghatol.
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring “ang mga huli … ang mga nauna.” May mga nagpapakahulugan sa pares ayon sa lugar: “mga nasa kanluran … mga nasa silangan.”'
    reason: alternative_reading
  - marker: c
    text: Sa literal, “sinaklot ng pangingilabot,” isang idyoma para sa matinding sindak.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל יוֹמוֹ
  choice: sa sinapit niya
  rationale: Ang literal na “sa/kaugnay ng araw niya” ay tumutukoy rito sa araw ng kapahamakan o hatol na sumapit sa masama. Ang “sa sinapit niya” ay likas sa modernong Tagalog at hindi labis na tinutukoy kung kapahamakan, pagbagsak, o hatol ang diin.
- source_word: נָשַׁמּוּ
  choice: masisindak
  rationale: Ipinahahayag ng pandiwa ang matinding pagkagulat at pagkasindak. Mas malinaw at natural ito kaysa sa payak na “magtataka.”
- source_word: אַחֲרֹנִים
  choice: mga darating pagkaraan niya
  rationale: Pinananatili ang pangunahing temporal na kahulugang “mga huli” o “mga susunod,” habang ipinakikita ng “niya” ang kaugnayan sa taong tinutukoy sa konteksto.
- source_word: וְקַדְמֹנִים
  choice: mga nauna
  rationale: Ang temporal na “mga nauna” ang pinakanatural na katapat ng “mga darating pagkaraan niya,” bagaman maaari ring heograpikal ang pares.
- source_word: אָחֲזוּ שָׂעַר
  choice: mangingilabot
  rationale: Ang literal na larawan ay paghawak o pagsaklot ng pangingilabot. Ang “mangingilabot” ay natural na idyomatikong Tagalog na naghahatid ng matinding sindak at pisikal na pagkilabot.
