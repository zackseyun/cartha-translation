lexical_decisions:
- source_word: טָמוּן
  choice: nakatago
  rationale: Pinananatili nito ang pasibo at statibong diwa ng anyong mula sa טמן at natural ito sa makabagong Filipino.
- source_word: בָּאָרֶץ
  choice: sa lupa
  rationale: Sa konteksto ng paglalagay ng bitag, tumutukoy ito sa mismong lupa kung saan ikinukubli ang lubid, hindi sa lupain bilang teritoryo.
- source_word: חַבְלוֹ
  choice: ang lubid niya
  rationale: Ang חבל ay maaaring lubid o tali; malinaw at kongkreto ang “lubid,” habang pinananatili sa talababa ang posibleng “tali.”
- source_word: וּמַלְכֻּדְתּוֹ
  choice: at ... ang bitag niya
  rationale: Ang מַלְכֹּדֶת ay panghuli o patibong; ang “bitag” ay maikli, pangkaraniwan, at angkop sa matalinghagang tagpo.
- source_word: עֲלֵי נָתִיב
  choice: nasa landas
  rationale: Ipinahahayag nito ang lokasyon ng bitag sa dinaraanan. Ang “landas” ay dignified ngunit madaling maunawaan.
