  yaml_path: translation/ot/job/018/021.yaml
  text: Surely these are the dwellings of the unjust[b][a], and this is the place of one who does not know God.
translation:
  language: tl
  text: Tunay ngang, ito ang mga tahanan ng taong di-matuwid,[a] at ito ang lugar ng taong hindi nakakakilala sa Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “masamang tao.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Tunay
  rationale: Ginamit bilang mariing panapos sa sinabi ni Bildad, hindi sa restriktibong diwang “lamang.”
- source_word: מִשְׁכְּנוֹת
  choice: mga tahanan
  rationale: Malawak ang saklaw ng salita para sa mga tirahan; natural sa modernong Tagalog ang “mga tahanan” at hindi nito nililimitahan ang larawan sa mga tolda.
- source_word: עַוָּל
  choice: taong di-matuwid
  rationale: Ipinahihiwatig nito ang taong gumagawa ng mali o kawalang-katarungan. Pinananatili ng “di-matuwid” ang moral na diin nang hindi ito pinalalawak nang labis.
- source_word: וְזֶה מְקוֹם
  choice: at ito ang lugar
  rationale: Tuwirang pinananatili ang parallel na demonstratibo at ang pangngalang “lugar.”
- source_word: לֹא יָדַע אֵל
  choice: taong hindi kumikilala sa Diyos
  rationale: Sa kontekstong ito, ang “kilala” ay higit sa basta pagkaalam na umiiral ang Diyos; ang “kumikilala” ay natural na Tagalog na makapagdala ng relasyonal at moral na diwa nang hindi ito ginagawang tahasang paliwanag.
- source_word: אֵל
  choice: Diyos
  rationale: Karaniwang tumutukoy ito sa tunay na Diyos sa aklat ng Job; hindi kailangan ang pagpapalawak sa ibang titulo.
theological_decisions:
- issue: Kahulugan ng “hindi nakakakilala sa Diyos”
  choice: “hindi kumikilala sa Diyos,” na maaaring magpahiwatig ng relasyonal at moral na pagkilala
  alternative: “hindi nakakakilala sa Diyos,” na maaaring basahin bilang simpleng kawalan ng kaalaman o personal na pagkakilala
  rationale: Ipinahihiwatig ng konteksto ng karunungang panitikan ang pagkilala at wastong pakikipag-ugnayan sa Diyos. Gayunman, hindi pinalitan ng salin ang parirala ng isang mas tiyak na pormulang teolohikal.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “ganito” para sa natural na pagbubuod na tumutukoy pabalik sa kapalarang inilarawan, at inulit ang “taong” upang malinaw ang dalawang magkatulad na sugnay.
