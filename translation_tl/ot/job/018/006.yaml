  text: The light in his tent grows dark[a], and his lamp above him is extinguished.
translation:
  language: tl
  text: 'Ang liwanag sa kanyang tolda ay nagdidilim,

    at ang kanyang ilawan sa itaas niya[a] ay namamatay.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa ibabaw niya.” Ang Hebreong pang-ukol ay maaaring tumukoy sa nasa ibabaw o itaas; malamang na inilalarawan nito ang liwanag ng ilawang nasa itaas ng masamang tao.
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹר
  choice: liwanag
  rationale: Pinananatili ang karaniwang kongkretong kahulugan at ang larawang patula ng liwanag sa isang tahanan.
- source_word: חָשַׁךְ
  choice: nagdidilim
  rationale: Ipinahahayag ang pagpasok sa kalagayan ng kadiliman, hindi lamang ang statikong pagiging madilim.
- source_word: בְּאָהֳלוֹ
  choice: sa kanyang tolda
  rationale: Pinananatili ang literal na larawan ng אָהֶל bilang tolda, na maaari ring kumatawan sa tahanan.
- source_word: וְנֵרוֹ
  choice: at ang kanyang ilawan
  rationale: Ang נֵר ay kongkretong ilawan o lampara; natural at marangal sa Filipino ang 'ilawan' sa kontekstong patula.
- source_word: עָלָיו
  choice: sa ibabaw niya
  rationale: Pinananatili ang malawak na spatial na diwa ng עַל bilang nasa ibabaw o nakapuwesto sa itaas niya.
- source_word: יִדְעָךְ
  choice: ay namamatay
  rationale: Karaniwang natural sa Filipino ang 'namamatay' para sa apoy o ilaw na nauubos, at ipinahahayag nito ang pagkapawi nang hindi nagdaragdag ng tahasang tagagawa.
