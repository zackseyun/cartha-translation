  text: He has neither offspring nor posterity among his people[b][a], and no survivor in the places where he sojourned.
translation:
  language: tl
  text: Wala siyang supling ni inapo sa kanyang bayan,[a] at walang natirang buhay sa mga lugar na kanyang tinirhan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “anak ni apo”; ang magkatambal na mga salitang Hebreo ay nagpapahayag ng lubos na pagkaputol ng kanyang lahi.
    reason: lexical_alternative
  - marker: b
    text: O “sa kanyang mga tirahan” o “sa mga pook na kanyang pinanirahan”; maaaring tumukoy ang Hebreo sa mga lugar na tinitirhan o sa mga pook ng pansamantalang paninirahan.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִין
  choice: anak
  rationale: Tumutukoy ito sa supling o inapo. Sa tambalan nito sa נֶכֶד, ang natural na “anak” ay kumakatawan sa unang salinlahi nang hindi nililimitahan ang buong pahayag dito.
- source_word: נֶכֶד
  choice: kaapu-apuhan
  rationale: Maaaring tumukoy sa apo o sumunod pang salinlahi. Ang “kaapu-apuhan” ay likas na katambal ng “anak” at malinaw na nagpapahiwatig ng lubos na pagkaputol ng angkan.
- source_word: בְּעַמּוֹ
  choice: sa gitna ng kanyang bayan
  rationale: Pinananatili nito ang karaniwang kahulugan ng עַם bilang bayan o sambayanan at ang diwa ng pagiging kabilang sa isang komunidad.
- source_word: שָׂרִיד
  choice: natirang buhay
  rationale: Ang salita ay tumutukoy sa isang naiwan o nakaligtas. Malinaw at natural ang parirala sa modernong Tagalog at hindi ito nagdadagdag ng natatanging teolohikal na kahulugan.
- source_word: בִּמְגוּרָיו
  choice: sa mga lugar na kanyang tinirhan
  rationale: Ang maramihang anyo ng מָגוּר ay maaaring tumukoy sa mga tirahan o mga lugar ng pansamantalang paninirahan. Pinananatili ng salin ang saklaw na ito sa natural na Tagalog.
