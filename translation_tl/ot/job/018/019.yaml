- from: Wala siyang anak ni kaapu-apuhan sa gitna ng kanyang bayan,[a] at walang natirang buhay sa mga lugar na kanyang tinirhan.[b]
  to: Wala siyang supling ni inapo sa kanyang bayan,[a] at walang natirang buhay sa mga lugar na kanyang tinirhan.[b]
  rationale: Pinalitan ang hindi gaanong likas na “anak ni kaapu-apuhan” ng “supling ni inapo,” na mas malinaw na pinananatili ang tambalang Hebreo para sa ganap na pagkawala ng mga inapo. Ginawang mas idiomatiko ang pariralang pangkomunidad at pinino ang talababa upang huwag magpahiwatig ng di-kailangang pagkakaiba ng permanente at pansamantalang tirahan.
