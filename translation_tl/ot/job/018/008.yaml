review_pass:
  verdict: revise
  source_fidelity: Ang 'nagtutulak' ay nagdaragdag ng tiyak na kilos ng pagtulak na wala sa שֻׁלַּח, isang pu‘al na pasibo (‘ipinadala’). Ang kaugnayan ng ‘sarili niyang mga paa’ sa pagpapapasok niya sa lambat ay dapat manatiling malinaw ngunit hindi dapat magpahiwatig ng pisikal na pagtulak. Ang ‘sa ibabaw ng’ ay tapat sa עַל.
  naturalness: Mas natural at malinaw sa makabagong Filipino ang ‘ang sarili niyang mga paa ang nagpapasok sa kanya sa lambat’ kaysa ‘ang sarili niyang mga paa ang nagtutulak sa kanya papasok sa lambat.’ Ang ‘sapot’ ay likas na katumbas ng mesh/netting sa ikalawang kalahati.
  terminology: Pinananatili ang magkaibang larawan sa Hebreo sa pamamagitan ng ‘lambat’ para sa רֶשֶׁת at ‘sapot’ para sa שְׂבָכָה. Hindi nagdaragdag ng isang tahasang banal o ibang ahente sa pasibong pandiwa.
  issues:
  - severity: medium
    issue: Ang ‘nagtutulak’ ay mas tiyak kaysa sa pasibong שֻׁלַּח.
    rationale: Ang Hebreo ay nagsasabing siya ay ‘ipinadala’ o naipasok sa lambat sa pamamagitan ng kanyang mga paa; hindi nito tahasang sinasabing itinutulak siya ng mga ito.
  - severity: low
    issue: Ang ‘sala-salang bitag’ ay hindi gaanong tuwirang katumbas ng שְׂבָכָה.
    rationale: Ang salita ay tumutukoy sa sapot o mata-matang lambat; ang ‘sapot’ ay mas natural at mas tumpak, habang naiiwasan ang pagdaragdag ng ‘bitag.’
  revised_text: 'Sapagkat ang sarili niyang mga paa ang nagpapasok sa kanya sa lambat,

