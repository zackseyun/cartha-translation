  text: For he is sent into a net by his own feet, and he walks onto a mesh.
translation:
  language: tl
  text: 'Sapagkat ang sarili niyang mga paa ang nagpapasok sa kanya sa lambat,

    at lumalakad siya sa ibabaw ng sapot.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שֻׁלַּח
  choice: nagtutulak sa kanya
  rationale: Ang pormang pu‘al ay literal na ‘ipinadala/itinulak.’ Sa konteksto, ipinahahayag na ang sarili niyang mga paa ang nagdadala o nagtutulak sa kanya tungo sa bitag; pinananatili ng salin ang diwang pasibo nang natural sa Tagalog.
- source_word: בְּרֶשֶׁת
  choice: papasok sa lambat
  rationale: Ang רֶשֶׁת ay lambat na ginagamit bilang bitag. Ang ‘papasok sa’ ay angkop sa kilos na patungo sa pagkakasilo.
- source_word: בְּרַגְלָיו
  choice: ang sarili niyang mga paa
  rationale: Tinutukoy ang sariling mga paa ng masama bilang paraang nagdadala sa kanya sa lambat; ang ‘sarili niyang’ ay nagpapalinaw sa refleksibong diin.
- source_word: שְׂבָכָה
  choice: sala-salang bitag
  rationale: Tumutukoy sa isang lambat o sala-salang panghuli. Pinili ang parirala upang maiba ito sa רֶשֶׁת habang malinaw na nananatili sa larangan ng mga bitag.
- source_word: יִתְהַלָּךְ
  choice: lumalakad siya
  rationale: Ang hitpael imperfect ay naglalarawan sa kanyang paglakad o pagparoo't parito; sa taludtod na ito, natural at sapat ang ‘lumalakad siya.’
theological_decisions:
- issue: Kung tahasang tutukuyin ang Diyos o ibang tagapagpadala sa pasibong שֻׁלַּח
  choice: Hindi nagdagdag ng tahasang tagapagpadala; iniuugnay ang pagkilos sa sarili niyang mga paa ayon sa kasunod na parirala.
  alternative: ‘Ipinadadala siya sa lambat’ o ‘itinutulak siya [ng Diyos] sa lambat.’
  rationale: Walang tahasang ahente sa Hebreo. Ang pagdaragdag ng Diyos ay lulutas sa isang tunay na kalabuan na hindi nilulutas ng teksto.
translation_notes:
  register: Makabagong Filipino na marangal at madaling maunawaan. Pinanatili ang magkatulad ngunit hindi lubos na magkaparehong larawan ng רֶשֶׁת at שְׂבָכָה sa pamamagitan ng ‘lambat’ at ‘sala-salang bitag.’
