translation:
  language: tl
  text: 'Tunay ngang mamamatay ang liwanag ng masasama,

    at hindi magniningning ang ningas[a] ng kanyang apoy.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “tilamsik ng kanyang apoy.” Maaaring mangahulugan ang Hebreong שְׁבִיב ng “ningas” o “tilamsik.”
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: Tunay nga
  rationale: Ginagamit dito ang particle bilang pagdidiin sa pahayag ni Bildad, hindi lamang sa diwang pandagdag na “rin.” Natural sa makabagong Tagalog ang “tunay nga” para sa ganitong mariing paninindigan.
- source_word: אוֹר
  choice: liwanag
  rationale: Pinananatili ang tuwirang larawan ng liwanag sa halip na ipaliwanag agad ito bilang buhay o kasaganaan.
- source_word: רְשָׁעִים
  choice: ang masasama
  rationale: Tumutukoy ang pangmaramihang anyo sa masasamang tao bilang isang pangkalahatang uri; malinaw at natural ito sa Tagalog.
- source_word: יִדְעָךְ
  choice: mamamatay
  rationale: Ang pandiwa ay tumutukoy sa pagpanaw o pagkaubos ng isang liwanag. Ang “mamamatay” ay natural na ginagamit sa Tagalog para sa apoy o ilaw na kusang nawawala at hindi nagdaragdag ng tahasang gumaganap na wala naman sa Hebreo.
- source_word: וְלֹא
  choice: at hindi
  rationale: Tuwirang pinagdudugtong at itinatanggi nito ang ikalawang sugnay.
- source_word: יִגַּהּ
  choice: magniningning
  rationale: Ipinahahayag nito ang paglalabas ng liwanag at pinananatili ang matulaing larawan.
- source_word: שְׁבִיב
  choice: ningas
  rationale: Maaaring tumukoy ang salita sa ningas o tilamsik ng apoy. Ang “ningas” ang higit na angkop sa paralelismo sa “liwanag,” habang itinatala sa talababa ang tunay na alternatibong kahulugan.
- source_word: אִשּׁוֹ
  choice: kanilang apoy
  rationale: Ang literal na anyo ay “kanyang apoy,” ngunit kasunod ito ng pangmaramihang “masasama.” Ginamit ang likas na pangmaramihang pagtutugma sa Tagalog nang hindi binabago ang larawan ng apoy.
