translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog na nagpapanatili sa paralelismong patula at sa larawan ng liwanag at apoy. Ginamit ang “mamamatay” sa karaniwang idyomang Tagalog para sa pagkapawi ng ilaw o apoy.
