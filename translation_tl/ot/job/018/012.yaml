base_translation:
  language: en
  yaml_path: translation/ot/job/018/012.yaml
  text: His strength is famished[a], and calamity is ready at his side.
translation:
  language: tl
  text: 'Gutom na gutom ang kanyang lakas,

    at ang kapahamakan ay nakaabang sa kanyang tabi.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa kanyang pagkatisod.” Ang salitang Hebreo ay maaaring unawain bilang “tabi” o, ayon sa ibang pagpapakahulugan, bilang “pagkatisod” o “pagkapilay.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהִי
  choice: ang … ay
  rationale: Ang Qal imperfect ng היה ay inihayag bilang patulang paglalarawan ng kasalukuyan o nalalapit na kalagayan, hindi bilang isang tahasang paghiling.
- source_word: רָעֵב
  choice: gutom na gutom
  rationale: Ipinahahayag nito ang matinding gutom at pinananatili ang personipikasyon ng ‘lakas’ sa Hebreong tula.
- source_word: אֹנוֹ
  choice: kanyang lakas
  rationale: Ang אוֹן ay maaaring tumukoy sa lakas, sigla, o yaman; ang ‘lakas’ ang pinakanababagay sa larawan ng paghina ng tao sa konteksto.
- source_word: וְאֵיד
  choice: at ang kapahamakan
  rationale: Ang אֵיד ay tumutukoy sa mapaminsalang sakuna; ang ‘kapahamakan’ ay natural at may marangal na tonong patula.
- source_word: נָכוֹן
  choice: nakaabang
  rationale: Ipinakikita ng salita na ang kapahamakan ay nakahanda at nakapuwestong dumating; likas sa Filipino ang ‘nakaabang’ sa larawang ito.
- source_word: לְצַלְעוֹ
  choice: sa kanyang tabi
  rationale: Maaaring tumukoy ang צלע sa tagiliran o tabi. Pinananatili ng ‘sa kanyang tabi’ ang konkretong larawan ng kapahamakang malapit at handang sumalakay, habang inilalagay sa talababa ang ibang posibleng pagbasa.
theological_decisions: []
translation_notes:
  register: Makabagong Filipino na marangal at patula. Pinanatili ang matapang na personipikasyon na ang ‘lakas’ ay gutom na gutom, at ang tunay na leksikal na kalabuan sa huling parirala ay iniulat sa talababa.
