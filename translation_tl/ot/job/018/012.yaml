  source_fidelity: 'Tapat ang salin sa Hebreo: ang "kanyang lakas" (אֹנוֹ) ay inilalarawang lubhang gutom, at ang "kapahamakan" (אֵיד) ay handa o nakaabang malapit sa kanya. Ang patulang personipikasyon ay napanatili nang hindi dinaragdagan ang kahulugan.'
  naturalness: 'Natural at marangal ang modernong Filipino: "Gutom na gutom ang kanyang lakas" ay malinaw na patula, at "nakaabang sa kanyang tabi" ay idiomatiko at mabisa para sa larawang ang kapahamakan ay nakahandang sumalakay.'
