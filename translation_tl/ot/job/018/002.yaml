  text: Hanggang kailan kayo maglalagay ng mga bitag sa pamamagitan ng mga salita?[a] Umunawa kayo, at pagkatapos ay magsasalita kami.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Hanggang kailan kayo maglalagay ng mga hangganan sa mga salita?” Mahirap ang pariralang Hebreo; maaari rin itong unawain bilang reklamo tungkol sa walang katapusang pagsasalita, sa halip na tungkol sa paglalagay ng bitag sa pamamagitan ng mga salita.
    reason: lexical_alternative
  - marker: b
    text: O “at pagkatapos ay magsalita tayo.” Ang huling pandiwa ay maaari ring unawain bilang paanyaya, hindi lamang bilang payak na pahayag tungkol sa hinaharap.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַד אָ֤נָה
  choice: Hanggang kailan
  rationale: Likas na panandang pananong sa Filipino para sa isang reklamong tumutukoy sa tagal.
- source_word: תְּשִׂימוּן
  choice: kayo patuloy na maglalagay
  rationale: Pinananatili ang batayang diwa ng שׂים na ‘maglagay’ at ipinahihiwatig ang mapanuyang tanong tungkol sa nagpapatuloy na gawain.
- source_word: קִנְצֵי
  choice: mga bitag
  rationale: Sa mahirap na pariralang ito, ipinahahayag ng ‘mga bitag’ ang posibleng larawang retorikal ng paninilo sa pamamagitan ng pananalita; inilalahad sa talababa ang literal o alternatibong diwang ‘mga hangganan.’
- source_word: לְמִלִּין
  choice: gamit ang mga salita
  rationale: Ipinapahayag nang malinaw at natural sa Filipino ang instrumental na kaugnayan ng mga salita sa mga bitag, nang hindi ginagawang literal ang malabong gamit ng pang-ukol.
- source_word: תָּבִינוּ
  choice: Umunawa muna kayo
  rationale: Direktang panawagan ito sa maramihang kausap na magkaroon ng pagkaunawa bago magpatuloy ang pagsasalita; ang ‘muna’ ay likas na naghahayag ng pagkakasunod na tahasang ibinibigay ng kasunod na parirala.
- source_word: וְאַחַר
  choice: at pagkatapos
  rationale: 'Pinananatili ang malinaw na pagkakasunod: pag-unawa muna, saka pagsasalita.'
- source_word: נְדַבֵּר
  choice: magsasalita kami
  rationale: Inilalarawan bilang payak na hinaharap ang unang panauhang maramihan, habang itinatala sa talababa ang posibleng paanyayang pagbasa.
