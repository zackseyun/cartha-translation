  text: It devours the limbs of his skin[a]; the firstborn of death devours his limbs.
translation:
  language: tl
  text: Nilalamon nito ang mga bahagi ng kanyang balat; nilalamon ng panganay ng kamatayan[a] ang kanyang mga bahagi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “panganay ng kamatayan,” na maaaring isang makatang personipikasyon ng pinakamapanganib na karamdaman o ng pangunahing ahente ng kamatayan.
    reason: alternative_reading
lexical_decisions:
- source_word: יֹאכַל
  choice: nilalamon
  rationale: Ang Qal imperfect na אכל ay naglalarawan dito ng matindi at tuloy-tuloy na mapanirang pag-ubos; pinananatili ring di-tiyak ang simuno sa unang linya sa pamamagitan ng “nito.”
- source_word: בַּדֵּי עוֹרוֹ
  choice: ang mga bahagi ng kanyang balat
  rationale: Ang בדים ay maaaring tumukoy sa mga bahagi o sangkap. Ang “mga bahagi ng kanyang balat” ay malapit sa anyo ng Hebreo at hindi labis na nililimitahan ito sa literal na mga biyas.
- source_word: בַּדָּיו
  choice: ang mga bahagi ng kanyang katawan
  rationale: Tumutukoy ang salitang may hulapi sa kanyang mga bahagi o sangkap; idinagdag ang “katawan” upang maging likas at malinaw sa Tagalog ayon sa kontekstong pisikal, nang hindi pinipilit ang mas tiyak na “mga biyas.”
- source_word: בְּכוֹר מָוֶת
  choice: ang panganay ng kamatayan
  rationale: Pinananatili ang kapansin-pansin at malabong metapora ng Hebreo sa halip na ipakahulugan agad bilang isang partikular na sakit o paraan ng pagkamatay.
theological_decisions:
- issue: Kahulugan ng בְּכוֹר מָוֶת
  choice: Panatilihin sa pangunahing teksto ang “panganay ng kamatayan” bilang makatang personipikasyon ng mapanirang puwersa.
  alternative: ang pinakamapanganib na karamdaman; ang pinakakakila-kilabot na kamatayan; pangunahing ahente ng kamatayan
  rationale: Hindi tiyak sa Hebreo kung anong partikular na kapahamakan ang tinutukoy. Ang literal na metapora ay nagpapanatili sa tunay na kalabuan at teolohikal na tensiyon ng taludtod.
translation_notes:
  register: Makabago at marangal na Filipino. Ginamit ang “nilalamon” upang mapanatili ang matingkad na larawang patula; iniwasan ang “mga biyas” dahil maaaring maging labis na anatomikal, at pinanatili ang mahiwagang metaporang “panganay ng kamatayan.”
