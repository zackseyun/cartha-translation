translation_notes:
  register: Makabago ngunit marangal na Tagalog. Ginamit ang “masasagkaan” upang maging malinaw sa karaniwang mambabasa ang paghihigpit sa pagkilos, habang pinananatili sa talababa ang mas literal na larawan ng pagsikip. Ang magkatimbang na dalawang sugnay ay nagpapanatili sa maikli at matalim na anyong patula ng Hebreo.
