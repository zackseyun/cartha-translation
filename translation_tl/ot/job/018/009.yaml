  yaml_path: translation/ot/job/018/009.yaml
  text: A trap seizes him by the heel[a]; a snare holds him fast.
translation:
  language: tl
  text: Sinunggaban ng bitag ang kanyang sakong[a]; mahigpit siyang hinawakan ng silo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Nahuli ng bitag ang kanyang sakong; kinapitan siya nang mahigpit ng isang panilo.” Bihira ang huling pangngalang Hebreo at maaaring tumukoy sa isang partikular na uri ng silo o panilo.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹאחֵז
  choice: Sinunggaban
  rationale: Ang Qal imperfect ng אחז ay nagpapahayag ng pagdakma o pagsunggab. Ang “sinunggaban” ay malinaw at masigla sa larawang patula ng isang bitag na biglang kumakapit.
- source_word: בְּעָקֵב
  choice: ang kanyang sakong
  rationale: Ang עָקֵב ay “sakong.” Sa kontekstong ito, ipinahihiwatig ng ב na doon siya dinakma ng bitag; likas sa Filipino ang “sinunggaban ... ang kanyang sakong.”
- source_word: פָּח
  choice: bitag
  rationale: Karaniwang tumutukoy ang פָּח sa isang bitag o patibong. Pinili ang “bitag” upang maiba sa bihirang pangngalan sa ikalawang hati at mapanatili ang paralelismo.
- source_word: יַחֲזֵק
  choice: mahigpit ... hinawakan
  rationale: Ang Hiphil imperfect ng חזק dito ay may diwang paghawak nang matatag o hindi pagpapakawala. Ang “mahigpit ... hinawakan” ay natural sa Filipino at pinananatili ang lakas ng pandiwa.
- source_word: עָלָיו
  choice: siya
  rationale: Ang על na may hulaping panghalip ay tumutukoy sa taong dinadakma o kinokontrol. Sa natural na Filipino, ipinapahayag ito bilang tuwirang layon ng “hinawakan.”
- source_word: צַמִּים
  choice: silo
  rationale: Bihira ang צַמִּים at maaaring tumukoy sa isang partikular na uri ng panghuli, gaya ng silo o panilo. Pinanatili ng “silo” ang pagkakaiba nito sa פָּח nang hindi pinapawi ang leksikal na kawalang-katiyakan.
theological_decisions: []
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang masiglang pandiwang “sinunggaban” upang mapanatili ang personipikasyon at lakas ng tulang Hebreo; iniwasan ang sobrang teknikal o makalumang pananalita.
