revisions:
- from: At narito, isang malakas na hangin[a] ang dumating mula sa ibayo ng ilang at humampas sa apat na sulok ng bahay. Bumagsak ito sa mga kabataang lalaki[b], at namatay sila. Ako lamang ang nakatakas upang ibalita ito sa iyo.
  to: At narito, isang malakas na hangin[a] ang dumating mula sa kabilang panig ng ilang at humampas sa apat na sulok ng bahay. Bumagsak ang bahay sa mga kabataang lalaki[b], at namatay sila. At ako lamang ang nakatakas upang ibalita ito sa iyo.
  rationale: Ginawang tahasan ang “ang bahay” bilang bumagsak upang alisin ang hindi sinasadyang kalabuan ng panghalip at upang tapat na maipahayag ang antecedent ng pandiwang Hebreo. Pinalitan ang “ibayo” ng “kabilang panig” para sa mas karaniwang modernong Filipino nang hindi binabago ang direksiyonal na diwa. Dinagdagan ang talababa b upang ilahad ang literal na panlalaking pagbasa ng Hebreo at mapanatili ang mga leksikal na posibilidad nito.
