base_translation:
  language: en
  yaml_path: translation/ot/job/001/019.yaml
  text: And behold[a], a great wind came from across the wilderness and struck the four corners of the house, and it fell on the young men, and they died[b]; and I alone have escaped to tell you.
translation:
  language: tl
  text: At narito, isang malakas na hangin[a] ang dumating mula sa kabilang panig ng ilang at humampas sa apat na sulok ng bahay. Bumagsak ang bahay sa mga kabataang lalaki[b], at namatay sila. At ako lamang ang nakatakas upang ibalita ito sa iyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “napakalakas na hangin” o “malakas na hanging parang bagyo.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “mga kabataang lalaki.” Maaari rin itong mangahulugang “mga kabataan” o, sa ilang konteksto, “mga lingkod.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: At narito
  rationale: Pinananatili nito ang masigla at pantawag-pansing pagpapakilala sa kasukdulan ng ulat, sa isang marangal ngunit nauunawaang anyo.
- source_word: רוּחַ גְּדוֹלָה
  choice: isang malakas na hangin
  rationale: Sa kontekstong ito, ang רוּחַ ay hangin, hindi espiritu o hininga. Likas sa modernong Tagalog ang “malakas na hangin” at malinaw nitong ipinahihiwatig ang mapaminsalang puwersa nang hindi tahasang dinaragdagan ng “bagyo.”
- source_word: בָּאָה מֵעֵבֶר הַמִּדְבָּר
  choice: ang dumating mula sa ibayo ng ilang
  rationale: Ang “ibayo” ay nagpapanatili sa diwang mula sa kabilang panig o lagpas ng ilang, nang hindi nagdaragdag ng tiyak na heograpiya.
- source_word: וַיִּגַּע בְּאַרְבַּע פִּנּוֹת הַבַּיִת
  choice: at humampas sa apat na sulok ng bahay
  rationale: Bagaman maaaring mangahulugang “dumikit” o “umabot” ang נגע, hinihingi ng mapaminsalang bunga rito ang mas malakas ngunit tapat na “humampas.”
- source_word: וַיִּפֹּל עַל הַנְּעָרִים
  choice: Bumagsak ito sa mga kabataang lalaki
  rationale: Ang “ito” ay tumutukoy pabalik sa bahay nang hindi inuulit ang pangngalan. Pinananatili ng “mga kabataang lalaki” ang panlalaking anyo at karaniwang kahulugan ng הַנְּעָרִים, habang inilalagay sa talababa ang posibleng kahulugang “mga lingkod.”
- source_word: וַיָּמֻתוּ
  choice: at namatay sila
  rationale: Tuwirang isinasalin ang pandiwang מות at hindi nagdaragdag ng tahasang causative na diwa gaya ng “napatay.”
- source_word: וָאִמָּלְטָה רַק אֲנִי לְבַדִּי
  choice: Ako lamang ang nakatakas
  rationale: Likas at mariing naipapahayag ng “ako lamang” ang pinagsamang eksklusibong diin ng רַק at לְבַדִּי.
- source_word: לְהַגִּיד לָךְ
  choice: upang ibalita ito sa iyo
  rationale: Ang “ibalita” ay angkop sa paulit-ulit na pormula ng mensahero sa kabanata; idinagdag ang “ito” bilang likas na layon sa Tagalog nang hindi binabago ang kahulugan.
