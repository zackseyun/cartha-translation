  terminology: Ang “malakas na hangin,” “ilang,” “bahay,” at “mga kabataang lalaki” ay angkop. Pinananatili ng “mga kabataang lalaki” ang panlalaking maramihang anyo ng Hebreo, habang kinikilala ng talababa ang iba pang posibleng gamit ng termino.
