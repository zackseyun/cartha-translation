base_translation:
  language: en
  yaml_path: translation/ot/job/001/007.yaml
  text: Then Yahweh said to the Adversary[a], “Where have you come from?” And the Adversary answered Yahweh and said, “From roaming on the earth and from walking about on it.”
translation:
  language: tl
  text: At sinabi ni Yahweh sa Kalaban[a], “Saan ka nanggaling?” At sumagot ang Kalaban kay Yahweh at sinabi, “Mula sa paggala sa lupa at sa paglalakad-lakad dito.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “ang satan.” May tiyak na pantukoy ang katawagan dito at ginagamit bilang titulo na nangangahulugang “ang Kalaban.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang transliterasyon ng personal na pangalan ng Diyos sa halip na palitan ito ng titulong “PANGINOON.”
- source_word: הַשָּׂטָן
  choice: ang Kalaban
  rationale: May tiyak na pantukoy ang salitang Hebreo, kaya titulo o tungkulin ang ipinahihiwatig dito, hindi pa pangalang pantangi. Likas at malinaw sa modernong Tagalog ang “ang Kalaban.”
- source_word: מֵאַיִן תָּבֹא
  choice: Saan ka nanggaling?
  rationale: Natural na tanong ito sa Tagalog tungkol sa pinanggalingan ng isang kararating lamang.
- source_word: וַיַּעַן
  choice: Sumagot
  rationale: Tuwirang katumbas na angkop sa salaysay at usapan.
- source_word: מִשּׁוּט בָּאָרֶץ
  choice: Sa paggala sa lupa
  rationale: Ipinahahayag ng pandiwa ang malayang paggalaw o paglibot; pinananatili ng “paggala” ang di-tiyak na galaw nang hindi nagdaragdag ng ideya ng pagpapatrolya.
- source_word: וּמֵהִתְהַלֵּךְ בָּהּ
  choice: at paglakad-lakad doon
  rationale: Inihahatid ng pag-uulit sa “lakad-lakad” ang paulit-ulit na pagkilos na ipinahihiwatig ng anyong Hebreo, habang natural ang “doon” bilang pagtukoy sa lupa.
theological_decisions:
- issue: Kung ang הַשָּׂטָן ay pangalang pantangi o titulo/tungkulin
  choice: Titulong “ang Kalaban”
  alternative: Pangalang “Satanas” o mas pormal na “ang Satan”
  rationale: Malakas na ipinahihiwatig ng tiyak na pantukoy sa Hebreo na titulo ang gamit sa kontekstong ito. Iniiwasan ng “ang Kalaban” ang pagpasok ng kalaunang paggamit bilang pangalang pantangi, ngunit hindi itinatanggi ang pagkakakilanlan ng tauhan sa mas malawak na salaysay.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Pinanatili ang payak na ritmo ng salaysay at ang pag-uulit ng pangalang Yahweh sa orihinal. Ginamit ang “lupa” para sa cosmic na saklaw ng eksena, hindi ang mas panrehiyong “lupain.”
