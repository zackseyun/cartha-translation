  text: וַ/יֹּאמֶר֩ עָרֹ֨ם יצתי מִ/בֶּ֣טֶן אִמִּ֗/י וְ/עָרֹם֙ אָשׁ֣וּב שָׁ֔מָ/ה יְהוָ֣ה נָתַ֔ן וַ/יהוָ֖ה לָקָ֑ח יְהִ֛י שֵׁ֥ם יְהוָ֖ה מְבֹרָֽךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/001/021.yaml
  text: And he said[a], “Naked I came out from my mother’s womb, and naked I will return there. Yahweh gave, and Yahweh has taken away[b]. May the name of Yahweh be blessed.”
translation:
  language: tl
  text: At sinabi niya, “Hubad akong lumabas mula sa sinapupunan ng aking ina, at hubad din akong babalik doon.[a] Si Yahweh[b] ang nagbigay, at si Yahweh ang kumuha. Nawa’y maging pinagpala ang pangalan ni Yahweh.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “doon.” Hindi tahasang sinasabi ang patutunguhan; maaaring pahiwatig ito sa sinapupunan, sa lupa o libingan, o sa kalagayang walang anumang dala.
    reason: alternative_reading
  - marker: b
    text: Sa Hebreo, “YHWH,” ang banal na pangalan ng Diyos, na tradisyonal na isinasaling “ang PANGINOON.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עָרֹם
  choice: hubad
  rationale: Tuwirang katumbas na nagpapanatili kapwa sa larawan ng pagsilang at sa diwang walang dalang ari-arian.
- source_word: יצתי
  choice: akong lumabas
  rationale: Likas na modernong Filipino para sa paglabas mula sa sinapupunan sa pagsilang.
- source_word: מִבֶּטֶן אִמִּי
  choice: sa sinapupunan ng aking ina
  rationale: Tuwiran at malinaw na salin ng kongkretong larawan sa Hebreo.
- source_word: וְעָרֹם אָשׁוּב שָׁמָה
  choice: at hubad din akong babalik doon
  rationale: Pinananatili ang diin sa pagiging hubad at isinasalin ang שָׁמָה bilang “doon” nang hindi tinutukoy nang higit sa pinagmulan ang patutunguhan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang transliterasyon ng banal na pangalang YHWH sa halip na palitan ito ng isang titulo.
- source_word: נָתַן
  choice: nagbigay
  rationale: Ang payak na aspektong naganap ay angkop sa maikli at balanseng pahayag.
- source_word: לָקָח
  choice: kumuha
  rationale: Tuwirang ipinapahayag ang Hebreong pandiwa at iniiwasang idagdag ang bagay na hindi tahasang inuulit sa ikalawang sugnay.
- source_word: יְהִי שֵׁם יְהוָה מְבֹרָךְ
  choice: Purihin ang pangalan ni Yahweh
  rationale: Likas at marangal na pormulang Filipino para sa jussive na pagpapala; ipinahahayag nito na ang pangalan ay kilalaning pinagpala nang hindi nagiging mabigat ang literal na pasibo.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo, kaya pinananatili ito bilang Yahweh sa halip na palitan ng titulo.
- issue: Patutunguhan ng “babalik doon” (שָׁמָה)
  choice: Panatilihin ang “doon” nang hindi tinutukoy ang referent
  alternative: babalik sa lupa; babalik sa libingan; babalik sa sinapupunan ng aking ina
  rationale: Hindi tahasang tinutukoy ng Hebreo ang patutunguhan. Pinananatili ng salin ang maaaring pahiwatig sa sinapupunan, lupa/libingan, o kalagayang walang anumang dala.
- issue: Diwa ng מְבֹרָךְ sa pangwakas na jussive
  choice: Purihin ang pangalan ni Yahweh
  alternative: Pagpalain ang pangalan ni Yahweh; Nawa’y maging pinagpala ang pangalan ni Yahweh
  rationale: Ang “Purihin” ay likas na pormula sa Filipino para sa pagkilalang pinagpala ang pangalan, samantalang ang mas literal na mga anyo ay maaaring magtunog na tao ang nagbibigay ng pagpapala sa Diyos. Itinatala ang literal na anyo sa talababa.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Pinanatili ang maikli at balanseng estruktura ng Hebreong pananalita. Ginamit ang “sinapupunan” para sa dignidad at linaw, at ang “Yahweh” para sa banal na pangalan.
