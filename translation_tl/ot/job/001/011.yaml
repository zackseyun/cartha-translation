  text: But stretch out your hand[a], please, and touch all that he has, and he will surely curse you to your face.
translation:
  language: tl
  text: Ngunit iunat mo nga ang iyong kamay at hipuin ang lahat ng pag-aari niya, at tiyak na susumpain ka niya sa iyong harapan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “pagpapalain ka niya.” Sa prologo ng Job, karaniwan itong nauunawaan bilang magalang na eupemismo para sa “susumpain ka niya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאוּלָם
  choice: Ngunit
  rationale: Nagpapahayag ng mariing pagsalungat sa naunang sinabi, sa natural at marangal na modernong Tagalog.
- source_word: שְׁלַח נָא יָדְךָ
  choice: iunat mo nga ang iyong kamay
  rationale: Pinananatili ang larawang Hebreo ng kamay bilang kapangyarihang kumikilos; ipinahihiwatig ng “nga” ang pakiusap o mapanghamong paghimok ng נָא.
- source_word: וְגַע
  choice: at galawin
  rationale: Malapit sa literal na “hipuin,” ngunit sa konteksto ay nagpapahiwatig ng mapaminsalang pakikialam; hindi tahasang nilulutas bilang “saktan” ang lawak ng kahulugan.
- source_word: בְּכָל אֲשֶׁר לוֹ
  choice: ang lahat ng pag-aari niya
  rationale: Malinaw na tumutukoy sa lahat ng tinataglay ni Job at natural sa modernong Tagalog.
- source_word: אִם לֹא
  choice: tiyak na
  rationale: Ang pormang kondisyonal ay gumaganap dito bilang mariing panunumpa o pagpapahayag ng katiyakan.
- source_word: עַל פָּנֶיךָ
  choice: nang harapan
  rationale: Natural na katumbas ng idyomang nangangahulugang tuwiran at lantaran sa mismong presensiya ng Diyos.
- source_word: יְבָרֲכֶךָּ
  choice: susumpain ka niya
  rationale: Bagaman karaniwang “pagpalain” ang anyong Hebreo, sa prologo ng Job ay nauunawaan itong magalang na eupemismo para sa “sumpain”; inilalahad sa talababa ang literal na anyo.
theological_decisions:
- issue: Eupemistikong gamit ng ברך sa prologo ng Job
  choice: Isalin sa pangunahing teksto bilang “susumpain ka niya”
  alternative: “pagpapalain ka niya”
  rationale: Hinihingi ng salungat na konteksto ang diwang tatalikuran o lalapastanganin ni Job ang Diyos kapag napinsala. Gayunman, pinananatili sa talababa ang tunay na leksikal na tensiyon sapagkat literal na “pagpalain” ang nakasulat.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Pinanatili ang konkretong larawan ng pag-unat ng kamay at iniwasan ang labis na pagpapaliwanag sa pangunahing teksto. Inilagay ang marker [a] kaagad pagkatapos ng sugnay na tinutukoy nito.
