  source_fidelity: 'Tapat ang salin sa Hebreo: ang וַיְהִי הַיּוֹם ay natural na naipahayag bilang “Isang araw”; malinaw na napanatili ang kapwa mga anak na lalaki at mga anak na babae; ang mga participle ay naipahayag bilang nagpapatuloy na “kumakain at umiinom”; at ang יַיִן ay wastong “alak.” Ang “kanilang pinakamatandang kapatid na lalaki” ay tumutugma sa אֲחִיהֶם הַבְּכוֹר nang hindi nagdadagdag ng interpretasyon.'
  naturalness: Likas at malinaw ang modernong Filipino Tagalog. Ang ayos na “Isang araw, kumakain at umiinom ... ang ...” ay angkop na pansalaysay at maayos ang daloy. Sapat na marangal ang rehistro para sa tekstong biblikal nang hindi maging lipas ang wika.
  terminology: Wasto at pare-pareho ang mga terminong pampamilya. Mahalaga at matagumpay na pinanatili ang “kap­atid na lalaki,” dahil ang Hebreo ay tiyak na lalaki. Ang talababa na “panganay na kapatid na lalaki” ay lehitimong mas literal na alternatibo para sa “pinakamatandang kapatid na lalaki.”
