  yaml_path: translation/ot/job/001/013.yaml
  text: There was a day when his sons and his daughters were eating and drinking wine in the house of their oldest brother[a].
translation:
  language: tl
  text: Isang araw, kumakain at umiinom ng alak ang kanyang mga anak na lalaki at mga anak na babae sa bahay ng kanilang pinakamatandang kapatid na lalaki[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kanilang panganay na kapatid na lalaki.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי הַיּוֹם
  choice: Isang araw
  rationale: Ang pariralang Hebreo ay isang idyomang pansalaysay na nagpapakilala ng isang tagpo. Likas na ipinapahayag ito sa modernong Tagalog bilang “Isang araw,” nang hindi nagdaragdag ng tahasang salitang katumbas ng “ngayon.”
- source_word: וּבָנָיו וּבְנֹתָיו
  choice: ang kanyang mga anak na lalaki at mga anak na babae
  rationale: Tahasan sa Hebreo ang parehong mga anak na lalaki at mga anak na babae, kaya hindi ito pinaikli sa pangkalahatang “mga anak.”
- source_word: אֹכְלִים וְשֹׁתִים
  choice: kumakain at umiinom
  rationale: Ang mga participle ay naglalarawan ng nagpapatuloy na kilos sa tagpo. Pinananatili ng anyong Tagalog ang tuloy-tuloy na diwa nang hindi ipinapalagay ang mas interpretatibong “nagpipista.”
- source_word: יַיִן
  choice: alak
  rationale: Sa kontekstong biblikal at sa karaniwang modernong Tagalog, ang “alak” ang natural na katumbas ng inuming tinutukoy; hindi ito ginawang mas malabong “inumin.”
- source_word: בְּבֵית
  choice: sa bahay ng
  rationale: Malinaw at natural nitong ipinapahayag ang lokasyon at ang ugnayang konstruktibo ng parirala.
- source_word: אֲחִיהֶם
  choice: kanilang ... kapatid na lalaki
  rationale: Tiyak na kapatid na lalaki ang tinutukoy ng Hebreo, kaya pinanatili ang kasarian sa halip na gamitin lamang ang maaaring maging malabong “kapatid.”
- source_word: הַבְּכוֹר
  choice: pinakamatandang
  rationale: Sa konteksto, kinikilala ng salita ang kapatid ayon sa pagkakasunod ng kapanganakan. Ang “pinakamatandang” ay malinaw at karaniwan sa modernong Tagalog; inilalagay sa talababa ang mas pormal at literal na “panganay.”
