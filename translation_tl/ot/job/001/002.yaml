  text: And seven sons and three daughters were born to him.
translation:
  language: tl
  text: Nagkaroon siya ng pitong anak na lalaki at tatlong anak na babae.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּוָּלְדוּ
  choice: Nagkaroon
  rationale: Ang Niphal ng ילד ay literal na nagsasaad na sila ay “ipinanganak,” ngunit sa modernong Filipino, ang “nagkaroon siya ng” ang pinakanatural na paraan upang ipahayag ang resultang ugnayan ng kapanganakan at pagiging magulang nang hindi ipinahihiwatig na siya mismo ang nanganak.
- source_word: לוֹ
  choice: siya ng
  rationale: Ang ל na may hulaping panghalip ay nagpapahayag dito ng ugnayan ng mga anak sa kanya. Isinasama ito nang natural sa hulma ng Filipino na “nagkaroon siya ng,” sa halip na piliting isalin bilang “sa kanya.”
- source_word: שִׁבְעָה
  choice: pitong
  rationale: Tuwirang salin ng bilang na pito, na nilalagyan ng pang-angkop bago ang pangngalan.
- source_word: בָנִים
  choice: anak na lalaki
  rationale: Pinananatili ang tiyak na pagtukoy sa mga lalaking anak. Mas natural ito sa modernong Filipino kaysa sa “mga anak na lalaki” kasunod ng bilang, sapagkat malinaw na ang dami sa “pitong.”
- source_word: וְשָׁלֹשׁ
  choice: at tatlong
  rationale: Tuwirang koordinasyon ng ikalawang bilang at pangngalan, gamit ang natural na pang-angkop sa Filipino.
- source_word: בָּנוֹת
  choice: anak na babae
  rationale: Pinananatili ang tiyak na pagtukoy sa mga babaeng anak sa natural at marangal na Filipino.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na simple, dignified, at madaling maunawaan. Ginamit ang idiomatikong “nagkaroon siya ng” upang maihatid ang Hebreong pormula ng kapanganakan nang hindi nagiging alanganin ang literal na “ipinanganak sa kanya.”
