  source_fidelity: Ang “sumamba” bilang pangunahing salin ay nagpapaliwanag nang higit sa tahasang sinasabi ng Hebreo. Ang וַיִּשְׁתַּחוּ ay tumutukoy muna sa pagyukod o pagpapatirapa; maaari itong maging kilos ng pagsamba sa konteksto, ngunit hindi ito kailangang gawing tahasang pahayag sa mismong talata. Ang “bumagsak sa lupa at nagpatirapa” ay maayos na naghihiwalay sa dalawang magkasunod na kilos na וַיִּפֹּל אַרְצָה at וַיִּשְׁתָּחוּ.
  naturalness: Natural, malinaw, at marangal sa makabagong Filipino ang “bumagsak sa lupa at nagpatirapa.” Mas tiyak din ito kaysa “nagpatirapa sa lupa, at sumamba,” na maaaring magmukhang inuulit ang iisang kilos habang ginagawang tahasan ang interpretasyong pagsamba.
  terminology: Ang “balabal” ay angkop para sa מְעִיל. Ang “inahitan niya ang kanyang ulo” ay malinaw na pananalitang Filipino para sa kilos ng pag-ahit ng buhok sa ulo. Ang “nagpatirapa” ay angkop na pangunahing katumbas ng huling pandiwang Hebreo, samantalang ang “sumamba” ay dapat manatiling alternatibong posibilidad sa talababa.
  issues:
  - severity: medium
    issue: Ang “sumamba” ay ginawang pangunahing salin ng וַיִּשְׁתָּחוּ.
    rationale: Bagaman posibleng may diwang pagsamba ang pandiwa sa konteksto, pangunahing isinasaad nito ang pisikal na pagyukod/pagpapatirapa. Upang mapanatili ang leksikal na saklaw at maiwasang gawing tahasan ang isang kontekstuwal na inferensiya, mas ligtas ang pisikal na salin na may talababa.
  - severity: low
    issue: Hindi malinaw na naipapakita ng “nagpatirapa sa lupa” ang hiwalay na kilos na ‘bumagsak sa lupa’ bago ang pagyukod.
    rationale: May dalawang magkahiwalay na pandiwang sunod-sunod sa Hebreo. Ang “bumagsak sa lupa at nagpatirapa” ay nagpapanatili sa daloy na ito.
  - severity: low
    issue: Ang salitang “ritwal” sa leksikal na paliwanag para sa pag-ahit ay mas tiyak kaysa hinihingi ng teksto.
    rationale: Ang teksto ay naglalarawan ng kilos sa pagluluksa ngunit hindi tahasang tinatawag itong ritwal. Hindi ito kailangang ilagay sa rebisyong teksto o talababa.
  revised_text: Pagkatapos, tumayo si Job, pinunit niya ang kanyang balabal, inahitan niya ang kanyang ulo, bumagsak sa lupa, at nagpatirapa.[a]
