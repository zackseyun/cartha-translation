  yaml_path: translation/ot/job/001/020.yaml
  text: Then Job rose[a], tore his robe, shaved his head, fell to the ground, and bowed down.
translation:
  language: tl
  text: Pagkatapos, tumayo si Job, pinunit niya ang kanyang balabal, inahitan niya ang kanyang ulo, bumagsak sa lupa, at nagpatirapa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sumamba.” Ang pandiwang Hebreo ay maaaring tumukoy sa pisikal na pagyukod o pagpapatirapa, na madalas ay kilos ng pagpipitagan o pagsamba.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: tumayo
  rationale: Ang Qal wayyiqtol ng קום ay nagsasaad ng kasunod na kilos sa salaysay; natural at tuwiran sa Filipino ang “tumayo.”
- source_word: מְעִילוֹ
  choice: ang kanyang balabal
  rationale: Ang מְעִיל ay isang panlabas na kasuotan; malinaw at marangal na katumbas ang “balabal.”
- source_word: וַיִּקְרַע אֶת־מְעִילוֹ
  choice: pinunit ang kanyang balabal
  rationale: Sa konteksto ng pagluluksa, ang קרע ay literal na pagpunit sa kasuotan bilang tanda ng matinding dalamhati.
- source_word: וַיָּגָז אֶת־רֹאשׁוֹ
  choice: inahitan ang kanyang ulo
  rationale: Ang גזז ay pagputol o paggupit nang maikli, gaya ng paggugupit ng buhok o balahibo; sa kontekstong ito, likas na ipinahahayag ng “inahitan ang kanyang ulo” ang ritwal ng pagluluksa.
- source_word: וַיִּפֹּל אַרְצָה
  choice: nagpatirapa sa lupa
  rationale: Ipinahihiwatig ng אַרְצָה ang kilos patungo sa lupa. Isinasama ng “nagpatirapa sa lupa” ang pagbagsak at ang nakadapang posisyon sa natural na Filipino.
- source_word: וַיִּשְׁתָּחוּ
  choice: sumamba
  rationale: Ang anyong ito ng שׁחה ay tumutukoy sa pagyukod o pagpapatirapa bilang pagpipitagan, at sa konteksto ng tugon ni Job sa Diyos ay natural na maisalin na “sumamba,” habang inilalahad sa talababa ang pisikal na diwa.
theological_decisions:
- issue: Kung ang huling kilos ni Job ay isasalin bilang pisikal na pagpapatirapa o tahasang pagsamba
  choice: sumamba
  alternative: yumukod / nagpatirapa
  rationale: Maaaring tumukoy ang pandiwa sa pisikal na pagyukod o pagpapatirapa, ngunit madalas itong kilos ng pagpipitagan o pagsamba. Sinusuportahan ng kasunod na pananalita ni Job na nakatuon sa Diyos ang “sumamba,” habang pinananatili ng talababa ang tunay na leksikal na saklaw.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinili ang “Pagkatapos” upang ilahad ang sunod-sunod na kilos sa salaysay, at iniwasan ang mga salitang lipas o labis na teknikal.
