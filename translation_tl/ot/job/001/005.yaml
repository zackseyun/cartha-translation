base_translation:
  language: en
  yaml_path: translation/ot/job/001/005.yaml
  text: And when the days of the feasting had run their course, Job would send and consecrate them, and he would rise early in the morning and offer burnt offerings according to the number of them all. For Job said, “Perhaps my sons have sinned and cursed God in their hearts.” Thus Job would do all the time.
translation:
  language: tl
  text: Tuwing natatapos ang mga araw ng kanilang handaan, nagpapasundo si Job sa kanyang mga anak at pinababanal sila. Maaga siyang bumabangon sa umaga at naghahandog ng mga handog na sinusunog nang buo, ayon sa bilang nilang lahat. Sapagkat sinabi ni Job, “Baka nagkasala ang mga anak kong lalaki at isinumpa[a] ang Diyos sa kanilang puso.” Ganito ang palaging ginagawa ni Job.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal na Hebreo, “pinagpala.” Dito, malamang na ginagamit ang “pinagpala” bilang magalang na pamalit sa “isinumpa.”
    reason: Mahalagang ipakita ang literal na anyo at ang eupemistikong kahulugan ng Hebreo, sa halip na itago ang tekstuwal na tensiyon.
lexical_decisions:
- source_word: הִקִּיפוּ יְמֵי הַמִּשְׁתֶּה
  choice: natapos na ang magkakasunod na araw ng kanilang handaan
  rationale: Ipinahahayag nito ang pagkumpleto ng paikot o sunod-sunod na mga araw ng handaan, nang natural sa modernong Tagalog.
- source_word: וַיְקַדְּשֵׁם
  choice: pinabanal sila
  rationale: Pinananatili ang ritwal na diwa ng paghahanda o pagtatalaga bilang banal, nang hindi tinutukoy ang paraang hindi sinasabi ng teksto.
- source_word: עֹלוֹת
  choice: mga handog na sinusunog nang buo
  rationale: Inililinaw ang uri ng handog na lubusang sinusunog, sa halip na gumamit ng teknikal ngunit hindi gaanong malinaw na katawagan.
- source_word: מִסְפַּר כֻּלָּם
  choice: ayon sa bilang nilang lahat
  rationale: Malapit sa anyo ng Hebreo at hindi tahasang dinaragdagan ang ideyang tig-iisang handog, bagaman malamang na iyon ang ipinahihiwatig.
- source_word: בָנַי
  choice: mga anak kong lalaki
  rationale: Pinananatili ang tiyak na panlalaking anyo ng Hebreo sa iniisip na pananalita ni Job.
- source_word: וּבֵרֲכוּ אֱלֹהִים
  choice: isinumpa ang Diyos
  rationale: Ang literal na 'pinagpala ang Diyos' ay isang kinikilalang eupemistikong gamit sa kontekstong ito; ang kahulugang hinihingi ng pangungusap ay pagsumpa o paglapastangan.
- source_word: כָּל הַיָּמִים
  choice: Palagi itong ginagawa ni Job
  rationale: Ipinapahayag ang nakaugaliang at paulit-ulit na kilos, hindi ang literal na paggawa nito sa bawat araw.
theological_decisions:
- issue: Ang eupemistikong pandiwang בּרך kaugnay ng Diyos
  choice: isinumpa ang Diyos
  alternative: pinagpala ang Diyos
  rationale: Sa konteksto ng posibleng kasalanan at sa kahalintulad na gamit sa aklat ng Job, ang pandiwa ay eupemismo para sa pagsumpa. Isinama sa talababa ang literal na anyo upang maging lantad ang tensiyong tekstuwal.
- issue: Saklaw ng ritwal na pagpapabanal
  choice: pinabanal sila
  alternative: nilinis sila sa ritwal
  rationale: Ang 'pinabanal' ay nagpapanatili ng mas malawak na kahulugan ng ugat at hindi nagtatakda ng isang partikular na seremonyang hindi inilalarawan sa talata.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang maiikling sugnay at karaniwang bokabularyo, ngunit pinanatili ang ritwal at teolohikal na bigat ng talata.
