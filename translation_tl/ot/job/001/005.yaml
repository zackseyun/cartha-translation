revisions:
- from: Kapag natapos na ang magkakasunod na araw ng kanilang handaan, ipinatawag ni Job ang kanyang mga anak at pinabanal sila. Maaga siyang bumabangon kinabukasan at naghahandog ng mga handog na sinusunog nang buo, ayon sa bilang nilang lahat. Sapagkat sinabi ni Job, “Baka nagkasala ang mga anak kong lalaki at isinumpa[a] ang Diyos sa kanilang puso.” Palagi itong ginagawa ni Job.
  to: Tuwing natatapos ang mga araw ng kanilang handaan, nagpapasundo si Job sa kanyang mga anak at pinababanal sila. Maaga siyang bumabangon sa umaga at naghahandog ng mga handog na sinusunog nang buo, ayon sa bilang nilang lahat. Sapagkat sinabi ni Job, “Baka nagkasala ang mga anak kong lalaki at isinumpa[a] ang Diyos sa kanilang puso.” Ganito ang palaging ginagawa ni Job.
  rationale: Inayos ang salin upang mapanatili ang habitual na daloy ng talata, ang kahulugan ng 'nagpadala para sa kanila,' at ang hindi-tiyak na panahong 'sa umaga.' Pinanatili ang maingat na pagsasalin ng ritwal na mga termino at ang talababa sa eupemistikong paggamit ng pandiwa para sa 'pinagpala.'
