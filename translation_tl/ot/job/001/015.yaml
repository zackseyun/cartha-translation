base_translation:
  language: en
  yaml_path: translation/ot/job/001/015.yaml
  text: And Sheba fell upon them and took them[a], and they struck down the young men with the edge of the sword[c][b]; and I alone have escaped to tell you.
translation:
  language: tl
  text: Sumalakay ang mga taga-Seba at tinangay ang mga hayop[a]. Pinatay nila sa talim ng tabak[b] ang mga binata[c]. Ako lamang ang nakaligtas upang ibalita ito sa iyo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “mga hayop” ay ang mga baka at mga asnong binanggit sa talata 14.
    reason: referent_clarification
  - marker: b
    text: Literal na “sa bibig ng tabak,” isang idyomang Hebreo na tumutukoy sa talim ng tabak.
    reason: lexical_alternative
  - marker: c
    text: Ang “mga binata” ay malamang na mga lingkod o tagapag-alaga ni Job na nagbabantay sa mga hayop.
    reason: cultural_note
lexical_decisions:
- source_word: וַתִּפֹּל שְׁבָא
  choice: Sinalakay sila ng mga taga-Seba
  rationale: Ang נפל sa konteksto ng marahas na pagsalakay ay idyomatikong nangangahulugang sumalakay. Bagaman Seba mismo ang anyong Hebreo, tumutukoy ito rito sa pangkat na nagmula sa Seba; natural sa Tagalog ang “mga taga-Seba.”
- source_word: וַתִּקָּחֵם
  choice: tinangay ang mga iyon
  rationale: Tumutukoy ang hulaping panghalip sa mga baka at asnong binanggit sa naunang talata. Ipinahihiwatig ng לקח sa kontekstong ito ang sapilitang pagkuha bilang samsam.
- source_word: הַנְּעָרִים
  choice: mga kabataang lalaki
  rationale: Maaaring mangahulugan ang נְעָרִים ng mga binata, lingkod, o tagapag-alaga. Pinananatili ng salin ang pangunahing leksikal na diwa, habang nililinaw ng talababa ang tungkulin nila sa konteksto.
- source_word: הִכּוּ לְפִי חָרֶב
  choice: Pinatay nila sa talim ng tabak
  rationale: Literal na “hinampas sa bibig ng tabak” ang idyomang Hebreo. Ang “sa talim ng tabak” ay nagpapanatili sa larawan ngunit malinaw na ipinahahayag ang nakamamatay na kinalabasan.
- source_word: וָאִמָּלְטָה
  choice: nakaligtas
  rationale: Ang מלט ay nagsasaad ng pagtakas o pagkaligtas. Natural sa salaysay at sa pananalita ng mensahero ang “nakaligtas.”
- source_word: רַק אֲנִי לְבַדִּי
  choice: Ako lamang
  rationale: Magkasamang idiniriin ng רַק at לְבַדִּי na wala nang ibang nakaligtas. Maikli at likas sa modernong Tagalog ang “Ako lamang.”
- source_word: לְהַגִּיד לָךְ
  choice: upang ibalita ito sa iyo
  rationale: Sa kontekstong ito, ang נגד ay pormal na paghahatid ng balita. Mas angkop sa mensaherong nag-uulat ng sakuna ang “ibalita” kaysa sa payak na “sabihin.”
