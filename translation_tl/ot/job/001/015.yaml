translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mga taga-Seba” upang natural na ipahayag ang pangkat na tinutukoy ng pangalang Seba, at hinati sa maiikling pangungusap upang maihatid ang mabilis at matinding ulat ng mensahero.
