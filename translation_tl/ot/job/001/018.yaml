translation:
  language: tl
  text: Habang nagsasalita pa ang mensaherong iyon, may isa na namang dumating at nagsabi, “Ang iyong mga anak na lalaki at babae ay kumakain at umiinom ng alak sa bahay ng kanilang panganay na kapatid na lalaki.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עַד זֶה מְדַבֵּר
  choice: Habang nagsasalita pa ang mensaherong iyon
  rationale: Pinananatili ng “habang…pa” ang nagpapatuloy na kilos ng participle at ang pagsingit ng kasunod na balita. Nililinaw ng “mensaherong iyon” ang tinutukoy ng literal na “ang isang ito” ayon sa konteksto.
- source_word: וְזֶה בָּא
  choice: may isa na namang dumating
  rationale: Ang literal na “at dumating ang isang ito” ay tumutukoy sa panibagong mensahero. Likas sa Tagalog ang “isa na naman” para sa sunod-sunod na pagdating at masasamang balita.
- source_word: וַיֹּאמַר
  choice: at nagsabi
  rationale: Karaniwang salin ng anyong pasalaysay na nagpapakilala sa tuwirang pahayag.
- source_word: בָּנֶיךָ וּבְנוֹתֶיךָ
  choice: Ang inyong mga anak na lalaki at babae
  rationale: Pinananatili ang tahasang pagbanggit sa mga anak na lalaki at mga anak na babae, sa halip na gawing pangkalahatang “mga anak” lamang. Ang “inyong” ay angkop na magalang na pagtukoy kay Job.
- source_word: אֹכְלִים וְשֹׁתִים יַיִן
  choice: ay kumakain at umiinom ng alak
  rationale: Malapit ito sa literal na Hebreo at pinananatili ang dalawang nagpapatuloy na kilos. Hindi ginawang “nagpipista” upang hindi magdagdag ng interpretasyon.
- source_word: בְּבֵית אֲחִיהֶם הַבְּכוֹר
  choice: sa bahay ng kanilang panganay na kapatid na lalaki
  rationale: Ang הַבְּכוֹר ay tumutukoy sa una sa pagkakasunod-sunod ng kapanganakan. Ang “panganay na kapatid na lalaki” ay tumpak at malinaw sa modernong Tagalog.
