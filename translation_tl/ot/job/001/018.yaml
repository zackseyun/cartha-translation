translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “mensahero” upang maiwasan ang malabong “iyon,” at ang “isa na naman” upang natural na ipakita ang sunod-sunod na pagdating ng mga tagapagbalita. Walang kailangang talababa dahil ang pangunahing salin ay tuwiran at hindi nangangailangan ng mahalagang leksikal na alternatibo.
