base_translation:
  language: en
  yaml_path: translation/ot/job/001/009.yaml
  text: Then the Accuser answered Yahweh and said[b][a], “Does Job fear God for nothing?"
translation:
  language: tl
  text: Sumagot ang Tagapag-akusa[a] kay Yahweh, “Natatakot ba si Job sa Diyos nang walang kapalit?[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “ang satan” o “ang kalaban.” May tiyak na pantukoy ang salita rito at ginagamit bilang titulo o tungkulin, kaya isinaling “ang Tagapag-akusa.”
    reason: alternative_reading
  - marker: b
    text: Maaari ring “nang walang dahilan” o “nang walang pakinabang.” Hinahamon ng tanong kung ang pagkatakot ni Job sa Diyos ay walang hinihintay na gantimpala o pakinabang.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן
  choice: Sumagot
  rationale: Karaniwang pormula ito sa salaysay para sa pagtugon sa isang kausap; natural at tapat ang “sumagot” sa modernong Tagalog.
- source_word: הַשָּׂטָן
  choice: ang Tagapag-akusa
  rationale: May tiyak na pantukoy ang salitang Hebreo at gumaganap dito bilang titulo o papel. Ipinapahayag ng “Tagapag-akusa” ang kontekstong mapang-usig nang hindi agad ginagawa itong pangalang pantangi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan nito ang banal na pangalang YHWH sa halip na palitan iyon ng isang titulo.
- source_word: וַיֹּאמַר
  choice: '[ipinahiwatig sa pagpapakilala ng tuwirang sinabi]'
  rationale: Ang literal na “at sinabi” pagkatapos ng “sumagot” ay kalabisan sa natural na Tagalog. Sapat ang kuwit bago ang sipi upang mapanatili ang tungkulin nito sa salaysay.
- source_word: הֲחִנָּם
  choice: nang walang kapalit
  rationale: Sa konteksto, hinahamon ng tanong kung ang pagkatakot ni Job sa Diyos ay walang hinihintay na pakinabang. Pinananatili ng parirala ang diwa ng “nang libre” o “walang pakinabang,” bagaman maaari rin itong mangahulugang “nang walang dahilan.”
- source_word: יָרֵא
  choice: natatakot
  rationale: Pinananatili nito ang lakas at tradisyonal na teolohikal na saklaw ng pagkatakot sa Diyos, na maaaring kabilang ang pagpipitagan.
- source_word: אֱלֹהִים
  choice: Diyos
  rationale: Ito ang tuwiran at karaniwang katumbas kapag tumutukoy sa tunay na Diyos.
theological_decisions:
- issue: Ang הַשָּׂטָן na may tiyak na pantukoy
  choice: ang Tagapag-akusa
  alternative: ang Kalaban; ang Satanas
  rationale: Ipinakikita ng anyong may pantukoy na titulo o tungkulin ito sa tagpo. Iniiwasan ng salin na ipalagay agad na isa na itong pangalang pantangi, habang pinananatili ang papel nitong nag-aakusa.
- issue: Ang banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; ang PANGINOON
  rationale: Pinananatili ang personal na banal na pangalang nasa tekstong Hebreo sa halip na halinhan ito ng titulo.
- issue: Diwa ng הֲחִנָּם sa tanong tungkol kay Job
  choice: nang walang kapalit
  alternative: nang walang dahilan; nang walang pakinabang
  rationale: Itinatampok ng konteksto ang paratang na may napapala si Job sa kaniyang debosyon, ngunit inilalagay sa talababa ang lehitimong ibang pakahulugan upang hindi lubusang isara ang leksikal na pag-aalinlangan.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Inalis ang literal na dobleng pormulang “sumagot ... at sinabi” dahil hindi ito likas sa Tagalog, habang pinanatili ang ayos ng diyalogo. Ginamit ang “natatakot sa Diyos” sa halip na mas interpretibong “gumagalang” upang mapanatili ang lawak ng ירא.
