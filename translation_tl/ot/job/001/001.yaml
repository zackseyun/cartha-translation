id: JOB.1.1
reference: Job 1:1
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: אִ֛ישׁ הָיָ֥ה בְ/אֶֽרֶץ ע֖וּץ אִיּ֣וֹב שְׁמ֑/וֹ וְ/הָיָ֣ה הָ/אִ֣ישׁ הַ/ה֗וּא תָּ֧ם וְ/יָשָׁ֛ר וִ/ירֵ֥א אֱלֹהִ֖ים וְ/סָ֥ר מֵ/רָֽע־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/001/001.yaml
  text: There was a man in the land of Uz whose name was Job[a], and that man was blameless and upright, fearing God and turning away from evil.
translation:
  language: tl
  text: May isang lalaki sa lupain ng Uz na ang pangalan ay Job. Ang lalaking iyon ay walang kapintasan at matuwid, may takot sa Diyos, at umiiwas sa kasamaan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “lumalayo sa kasamaan.” Ang pandiwang Hebreo ay maaaring mangahulugang lumihis, lumayo, o umiwas sa masama.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ הָיָה
  choice: May isang lalaki
  rationale: Likas na panimulang pasalaysay sa modernong Tagalog na pinananatili ang eksistensiyal na diwa at ang pagtukoy sa isang lalaking indibidwal.
- source_word: בְאֶרֶץ עוּץ
  choice: sa lupain ng Uz
  rationale: Ang “lupain” ay angkop sa heograpikong gamit ng אֶרֶץ, at pinanatili bilang transliterasyon ang pangalang Uz.
- source_word: אִיּוֹב שְׁמוֹ
  choice: na ang pangalan ay Job
  rationale: Tuwiran at natural na pagkakakilanlan sa Tagalog; ginamit ang nakaugaliang anyong “Job” ng pangalan.
- source_word: וְהָיָה הָאִישׁ הַהוּא
  choice: Ang lalaking iyon ay
  rationale: Ipinananatili ang panunumbalik sa naunang tauhan at ang bahagyang demonstratibong lakas ng הַהוּא.
- source_word: תָּם
  choice: walang kapintasan
  rationale: Nagpapahayag ng integridad at kapuri-puring asal, hindi kinakailangang ganap na kawalang-kasalanan.
- source_word: יָשָׁר
  choice: matuwid
  rationale: Karaniwan at marangal na salitang Tagalog para sa etikal na katuwiran.
- source_word: וִירֵא אֱלֹהִים
  choice: may takot sa Diyos
  rationale: Natural na idyomang Tagalog para sa mapitagang paggalang at debosyon, hindi lamang sindak; hinihingi ng konteksto ang isahang “Diyos.”
- source_word: וְסָר מֵרָע
  choice: umiiwas sa kasamaan
  rationale: Malinaw na ipinahahayag ang aktibong paglayo o pag-iwas sa masama, habang inilalagay sa talababa ang alternatibong larawang pandiwa.
theological_decisions:
- issue: Kahulugan ng paglalarawan sa moralidad ni Job
  choice: Inilarawan si Job bilang may integridad at kapuri-puring asal, hindi bilang tahasang ganap na walang kasalanan.
  alternative: Unawain ang תָּם bilang ganap o absolutong kawalang-kasalanan.
  rationale: Sa panitikang karunungan, ang תָּם kasama ng יָשָׁר ay pumupuri sa kabuuan ng pagkatao at katuwiran; hindi nito sapilitang ipinahahayag ang walang-hanggang moral na kasakdalan.
- issue: Tinutukoy ng אֱלֹהִים
  choice: Diyos
  alternative: mga diyos
  rationale: Bagaman maramihan ang anyong morpolohikal, ang idyoma at konteksto ng salaysay ay humihingi ng isahang pantukoy.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Pinanatili ang payak na himig ng pambungad na salaysay at iniwasang ipakahulugan ang “walang kapintasan” bilang absolutong kawalang-kasalanan.
