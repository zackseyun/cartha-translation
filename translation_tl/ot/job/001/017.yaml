source:
  edition: WLC
  text: ע֣וֹד זֶ֣ה מְדַבֵּ֗ר וְ/זֶה֮ בָּ֣א וַ/יֹּאמַר֒ כַּשְׂדִּ֞ים שָׂ֣מוּ שְׁלֹשָׁ֣ה רָאשִׁ֗ים וַֽ/יִּפְשְׁט֤וּ עַל הַ/גְּמַלִּים֙ וַ/יִּקָּח֔וּ/ם וְ/אֶת הַ/נְּעָרִ֖ים הִכּ֣וּ לְ/פִי חָ֑רֶב וָ/אִמָּ֨לְטָ֧/ה רַק אֲנִ֛י לְ/בַדִּ֖/י לְ/הַגִּ֥יד לָֽ/ךְ׀׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/001/017.yaml
  text: While this one was still speaking[a], another came and said, “The Chaldeans formed three raiding parties, swept down on the camels and took them, and they struck down the young men with the edge of the sword[c][b]. And I alone have escaped to tell you.”
translation:
  language: tl
  text: Habang nagsasalita pa siya, dumating ang isa pang mensahero at nagsabi, “Bumuo ang mga Caldeo ng tatlong pangkat[a] at biglang sumalakay sa mga kamelyo at kinuha ang mga iyon. Pinatay nila sa talim ng espada[b] ang mga kabataang lalaki[c]. Ako lamang ang nakatakas upang ibalita ito sa iyo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “hinati sa tatlong pangkat” o “pumuwesto sa tatlong pangkat”; literal, “nagtakda ng tatlong ulo.”
    reason: lexical_alternative
  - marker: b
    text: 'Idyoma sa Hebreo: “pinatay ... sa bibig/talim ng espada,” na nangangahulugang pinatay sila gamit ang mga espada.'
    reason: lexical_alternative
  - marker: c
    text: Ang “mga kabataang lalaki” ay maaari ring tumukoy rito sa mga tauhan o lingkod ng sambahayan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ע֣וֹד זֶ֣ה מְדַבֵּר
  choice: Habang nagsasalita pa siya
  rationale: Ipinapahayag ng עוֹד kasama ng participle ang nagpapatuloy na pagsasalita; natural sa Tagalog ang temporal na ‘habang ... pa.’
- source_word: וְזֶה בָּא וַיֹּאמַר
  choice: dumating ang isa pang mensahero at nagsabi
  rationale: Sa sunod-sunod na ulat, ang ikalawang זֶה ay tumutukoy sa kasunod na tagapagbalita; nilinaw bilang ‘isa pang mensahero’ para sa likas na daloy.
- source_word: כַּשְׂדִּים
  choice: mga Caldeo
  rationale: Karaniwang modernong Tagalog na katawagan sa pangkat-etnikong Chaldeans.
- source_word: שָׂמוּ שְׁלֹשָׁה רָאשִׁים
  choice: bumuo ... ng tatlong pangkat
  rationale: Literal na ‘nagtakda ng tatlong ulo’; sa konteksto ng pagsalakay, tumutukoy ito sa tatlong dibisyon o pangkat. Hindi ipinilit sa teksto ang mas tiyak na ‘pangkat ng mananalakay,’ ngunit inilagay sa talababa ang mga posibleng diwa.
- source_word: וַיִּפְשְׁטוּ עַל
  choice: biglang sumalakay sa
  rationale: Ipinahihiwatig ng pandiwa ang mabilis na paglusob o pandarambong laban sa isang target.
- source_word: הַגְּמַלִּים ... וַיִּקָּחוּם
  choice: mga kamelyo at kinuha ang mga iyon
  rationale: Tuwirang pinananatili ang reperensiya ng hulaping panghalip sa mga kamelyo.
- source_word: הַנְּעָרִים
  choice: mga kabataang lalaki
  rationale: Pinananatili ang pangunahing leksikal na diwa ng נְעָרִים nang hindi tiyakang ginagawang ‘mga lingkod’; binabanggit sa talababa ang kontekstuwal na posibilidad.
- source_word: הִכּוּ לְפִי חָרֶב
  choice: pinatay ... sa talim ng espada
  rationale: Ang idyomang literal na ‘sa bibig/talim ng espada’ ay nangangahulugang pinatay sa pamamagitan ng espada; pinanatili ang larawang ‘talim.’
- source_word: וָאִמָּלְטָה רַק אֲנִי לְבַדִּי
  choice: Ako lamang ang nakatakas
  rationale: Natural na Tagalog na pinananatili ang diin na siya lamang ang nakaligtas.
- source_word: לְהַגִּיד לָךְ
  choice: upang ibalita ito sa iyo
  rationale: Ang הגיד ay ‘sabihin’ o ‘iulat’; ang ‘ibalita’ ay angkop sa agarang ulat ng mensahero.
