base_translation:
  language: en
  yaml_path: translation/ot/job/001/016.yaml
  text: While this one was still speaking, another came and said, “Fire of God fell from heaven and burned among the sheep and the young men and consumed them, and I alone have escaped to tell you.”
translation:
  language: tl
  text: Habang nagsasalita pa siya, dumating ang isa pang mensahero at nagsabi, “Bumagsak mula sa langit ang apoy ng Diyos[a] at nagliyab sa gitna ng mga tupa at ng mga kabataang lalaki, at tinupok sila. Ako lamang ang nakaligtas upang ibalita ito sa iyo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “apoy ng Diyos” ay maaari ring mangahulugang isang napakalakas o pambihirang apoy; hindi tahasang sinasabi ng Hebreo kung kidlat ang tinutukoy.
    reason: Pinananatili ang leksikal at teolohikal na kalabuan ng אֵשׁ אֱלֹהִים.
lexical_decisions:
- source_word: אֵשׁ אֱלֹהִים
  choice: apoy ng Diyos
  rationale: Pinananatili ang tuwirang pariralang Hebreo at ang posibleng kahulugang apoy na mula sa Diyos o pambihirang apoy, nang hindi agad tinutukoy ang likas nito.
- source_word: בַנְּעָרִים
  choice: mga kabataang lalaki
  rationale: Ang נְעָרִים ay literal na tumutukoy sa mga batang lalaki o kabataang lalaki; pinananatili ito sa halip na gawing pangkalahatang “mga lingkod,” bagaman sa konteksto ay malamang na sila ang mga tagapag-alaga.
- source_word: וַתִּבְעַר בַצֹּאן וּבַנְּעָרִים
  choice: nagliyab sa gitna ng mga tupa at ng mga kabataang lalaki
  rationale: Isinasalamin ang pandiwang “nagliyab” at ang pang-ukol na בְּ, habang ang kasunod na “tinupok sila” ang malinaw na nagsasaad ng pagkawasak.
- source_word: וָאִמָּלְטָה רַק אֲנִי לְבַדִּי
  choice: Ako lamang ang nakaligtas
  rationale: Natural na Tagalog na tumpak sa mariing Hebreong “ako lamang, mag-isa.”
theological_decisions:
- issue: Pagkakakilanlan ng “apoy ng Diyos”
  choice: Pinanatili sa pangunahing teksto ang “apoy ng Diyos” at nilagyan ng paliwanag sa talababa.
  alternative: “kidlat” o “apoy mula sa Diyos”
  rationale: Hindi tahasang tinutukoy ng Hebreo kung kidlat ito, isang supernatural na apoy, o isang idyomatikong paglalarawan ng napakalakas na apoy; hindi dapat lutasin ng salin ang tunay na kalabuan.
translation_notes:
  register: Makabago at marangal na Filipino. Ginamit ang “mensahero” upang luminaw ang salit-salit na pagdating ng mga nagbabalita, at “ibalita ito” bilang natural na katumbas ng לְהַגִּיד לָךְ.
