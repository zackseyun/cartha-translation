base_translation:
  language: en
  yaml_path: translation/ot/job/001/003.yaml
  text: His livestock were seven thousand sheep[a], three thousand camels, five hundred yoke of oxen, five hundred female donkeys, and a very large household; and that man was greater than all the sons of the east.
translation:
  language: tl
  text: Ang kanyang mga alagang hayop ay pitong libong tupa, tatlong libong kamelyo, limang daang pares ng mga bakang pang-araro, limang daang babaeng asno, at isang napakalaking sambahayan; at ang taong iyon ay higit na dakila kaysa sa lahat ng mga taga-silangan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִקְנֵהוּ
  choice: kanyang mga alagang hayop
  rationale: Tumutukoy ang salita sa pag-aaring binubuo lalo na ng mga domestikadong hayop; nililinaw ng kasunod na talaan ang kahulugang ito.
- source_word: צֹאן
  choice: tupa
  rationale: Maaaring tumukoy sa maliliit na hayop ng kawan, kabilang ang mga tupa at kambing, ngunit natural at tradisyonal sa ganitong bilangang talaan ang “tupa.”
- source_word: גְמַלִּים
  choice: kamelyo
  rationale: Tuwirang katumbas sa modernong Filipino.
- source_word: צֶמֶד בָּקָר
  choice: pares ng mga bakang pang-araro
  rationale: Ang צֶמֶד ay isang pares na pinagtatambal sa pamatok, at ang בָּקָר dito ay mga bakang ginagamit sa gawaing bukid. Mas malinaw ito sa karaniwang mambabasa kaysa sa literal na “pamatok ng mga baka.”
- source_word: אֲתוֹנוֹת
  choice: babaeng asno
  rationale: Hayagang pambabae ang anyong Hebreo, kaya pinanatili ang kasarian ng mga hayop.
- source_word: עֲבֻדָּה רַבָּה מְאֹד
  choice: Napakarami rin ng kanyang mga lingkod
  rationale: Sa konteksto ng malaking ari-arian, malamang na metonimikong tumutukoy ang parirala sa napakalaking bilang ng mga tagapaglingkod o tauhan, hindi lamang sa abstraktong “paglilingkod.”
- source_word: גָּדוֹל מִכָּל
  choice: ang pinakadakila sa lahat
  rationale: Ipinapahayag ng konstruksiyong paghahambing na nahihigitan niya ang lahat ng kabilang sa tinutukoy na pangkat, kaya natural sa Filipino ang superlatibong anyo.
- source_word: בְּנֵי קֶדֶם
  choice: mga taga-silangan
  rationale: Idyomatikong tumutukoy ang “mga anak ng silangan” sa mga taong naninirahan sa silangan; ang “mga taga-silangan” ay natural at tumpak sa modernong Filipino.
theological_decisions:
- issue: Saklaw ng בְּנֵי קֶדֶם
  choice: mga taga-silangan
  alternative: mga anak ng silangan
  rationale: Kolektibong katawagan ito sa mga tao ng silangan, hindi pahayag tungkol sa literal na pagiging anak o eksklusibong kasariang lalaki. Pinananatili ng idyomatikong salin ang heograpiko at panlipunang diwa.
- issue: Diwa ng עֲבֻדָּה רַבָּה מְאֹד
  choice: Napakarami rin ng kanyang mga lingkod
  alternative: napakalaki rin ng kanyang sambahayan / napakarami niyang tauhan
  rationale: May tunay na leksikal na puwang sa pagitan ng “paglilingkod,” mga lingkod, at buong establisimyento ng sambahayan. Sa kontekstong naglalarawan ng kayamanan, malinaw at malamang ang pagtukoy sa maraming tagapaglingkod, nang hindi nagpapasok ng doktrinal na pagpapakahulugan.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Hinati sa tatlong pangungusap ang mahabang sugnay na Hebreo upang maging natural ang daloy. Ginamit ang “mga bakang pang-araro” upang mailahad ang gamit ng magkapares na baka, at “mga taga-silangan” bilang likas na katumbas ng idyomang Hebreo.
