  text: וַ/יְהִ֣י הַ/יּ֔וֹם וַ/יָּבֹ֨אוּ֙ בְּנֵ֣י הָ/אֱלֹהִ֔ים לְ/הִתְיַצֵּ֖ב עַל יְהוָ֑ה וַ/יָּב֥וֹא גַֽם הַ/שָּׂטָ֖ן בְּ/תוֹכָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/001/006.yaml
  text: There was a day when the sons of God came to present themselves before Yahweh[b][a], and the Adversary also came among them.
translation:
  language: tl
  text: May isang araw na dumating ang mga anak ng Diyos[a] upang humarap kay Yahweh, at dumating din ang Kalaban[b] sa gitna nila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “mga anak ng Diyos” ay maaaring tumukoy sa mga nilalang sa langit na kabilang sa makalangit na kapulungan.
    reason: cultural_note
  - marker: b
    text: O, ayon sa tradisyon, “Satanas.” Nasa Hebreo ang “ang satan/kalaban,” na may tiyak na pantukoy at maaaring ginagamit dito bilang titulo sa halip na pangalang pantangi.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי הַיּוֹם
  choice: May isang araw na
  rationale: Likas na panimulang pormula ito sa salaysay at pinananatili ang diwa ng paglitaw ng isang tagpo nang hindi nagdaragdag ng tahasang panandang gaya ng “Ngayon.”
- source_word: בְּנֵי הָאֱלֹהִים
  choice: mga anak ng Diyos
  rationale: Pormal na pinananatili ang larawang Hebreo at ang posibleng teolohikal na kalabuan nito, sa halip na agad itong bigyang-kahulugang “mga nilalang sa langit.”
- source_word: לְהִתְיַצֵּב עַל יְהוָה
  choice: upang humarap kay Yahweh
  rationale: Sa kontekstong ito, tumutukoy ang pandiwa at pang-ukol sa pagharap o pagpapakita sa harap ng isang nakatataas; natural sa modernong Tagalog ang “humarap kay.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ang personal na pangalan ng Diyos sa tekstong Hebreo.
- source_word: הַשָּׂטָן
  choice: ang Kalaban
  rationale: May tiyak na pantukoy ang salitang Hebreo, kaya malamang na titulo o tungkulin ang tinutukoy rito at hindi pa isang tiyak na pangalang pantangi.
- source_word: בְּתוֹכָם
  choice: kasama nila
  rationale: Natural na Filipino ito para sa pagdating niya sa loob ng pangkat; pinananatili nito ang diwa ng pagiging kabilang sa kanilang kalipunan sa tagpong iyon.
theological_decisions:
- issue: Kung ang הַשָּׂטָן ay pangalang pantangi o titulo
  choice: ang Kalaban
  alternative: Satanas; ang Tagapag-akusa
  rationale: Dahil may tiyak na pantukoy ang Hebreo, pinananatili ng “ang Kalaban” ang tungkulin o titulo at hindi ipinapasok nang maaga ang mas huling paggamit bilang nakapirming pangalang pantangi. Nasa talababa ang tradisyonal na salin.
- issue: Kung bibigyang-kahulugan o pormal na isasalin ang בְּנֵי הָאֱלֹהִים
  choice: mga anak ng Diyos
  alternative: mga nilalang sa langit; mga makalangit na nilalang
  rationale: Malamang na mga nilalang sa makalangit na kapulungan ang tinutukoy, ngunit pinananatili ng pangunahing teksto ang mismong larawan at kalabuan ng Hebreo.
translation_notes:
  register: Modernong Filipino na simple ngunit marangal. Ginamit ang “humarap” sa halip na literal na “tumayo” upang malinaw na maipahayag ang pormal na pagharap sa isang nakatataas. Pinanatili ang “mga anak ng Diyos” at “ang Kalaban” upang huwag patahimikin ang mga tunay na kalabuan ng tekstong Hebreo.
