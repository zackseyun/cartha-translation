translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mensahero” upang iwasang ipahiwatig na ang tagapagbalita ay isang anghel. Pinanatili sa teksto ang tiyak na kasarian ng אֲתֹנוֹת sa halip na ilagay sa talababa.
