  text: And a messenger came to Job and said[a], “The oxen were plowing, and the donkeys were grazing beside them,”
translation:
  language: tl
  text: Dumating kay Job ang isang mensahero at nagsabi, “Nag-aararo ang mga baka, at nanginginain sa tabi nila ang mga babaeng asno.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמַלְאָךְ
  choice: Dumating ... ang isang mensahero
  rationale: Sa konteksto, ang מַלְאָךְ ay isang taong naghahatid ng balita, hindi isang anghel. Hindi na kailangang isalin nang hiwalay ang וּ dahil natural na ipinagpapatuloy ng Tagalog na salaysay ang pangyayari.
- source_word: בָּא אֶל אִיּוֹב
  choice: Dumating kay Job
  rationale: Likas at malinaw na salin ng paglapit ng mensahero kay Job.
- source_word: וַיֹּאמַר
  choice: at nagsabi
  rationale: Pinananatili ang pagsulong ng salaysay at ipinahihiwatig ng anyo ng pandiwa na ang mensahero ang nagsalita.
- source_word: הַבָּקָר
  choice: ang mga baka
  rationale: Bagaman maaaring tumukoy sa mga hayop na ginagamit sa pag-aararo, ang “mga baka” ang karaniwang dignified na katawagan sa Filipino; nililinaw ng kilos na sila ang mga hayop na nag-aararo.
- source_word: הָיוּ חֹרְשׁוֹת
  choice: nag-aararo
  rationale: Natural na Filipino para sa patuloy na gawaing inilalarawan sa nakaraang tagpo.
- source_word: וְהָאֲתֹנוֹת
  choice: ang mga asnong babae
  rationale: Tiyak na pambabae ang pangngalang Hebreo, kaya tahasang pinananatili ang detalyeng ito sa pangunahing teksto.
- source_word: רֹעוֹת
  choice: nanginginain
  rationale: Tumpak at likas na paglalarawan sa mga hayop na kumakain ng damo sa pastulan.
- source_word: עַל יְדֵיהֶם
  choice: sa tabi nila
  rationale: Ang idyomang Hebreo ay nagpapahayag ng kalapitan; “sa tabi nila” ang natural na katumbas sa Filipino.
