id: JOB.1.12
reference: Job 1:12
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל הַ/שָּׂטָ֗ן הִנֵּ֤ה כָל אֲשֶׁר ל/וֹ֙ בְּ/יָדֶ֔/ךָ רַ֣ק אֵלָ֔י/ו אַל תִּשְׁלַ֖ח יָדֶ֑/ךָ וַ/יֵּצֵא֙ הַ/שָּׂטָ֔ן מֵ/עִ֖ם פְּנֵ֥י יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/001/012.yaml
  text: And Yahweh said to the Accuser[a], “Look, all that he has is in your hand; only against him do not stretch out your hand.” Then the Accuser went out from the presence of Yahweh.
translation:
  language: tl
  text: Sinabi ni Yahweh sa Tagapagparatang[a], “Tingnan mo, ang lahat ng pag-aari niya ay nasa iyong kamay. Ngunit huwag mong iunat ang iyong kamay laban sa kanya.” Pagkatapos, umalis ang Tagapagparatang mula sa presensya ni Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang Satanas” o “ang kalaban.” May pantukoy ang salitang Hebreo, kaya malamang na titulo o tungkulin ang tinutukoy.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
- source_word: הַשָּׂטָן
  choice: ang Tagapagparatang
  rationale: May pantukoy ang Hebreo at tumutukoy sa isang papel o titulo. Ang “Tagapagparatang” ay likas sa Filipino at angkop sa mapanumbat na papel niya sa konteksto.
- source_word: הִנֵּה
  choice: Tingnan mo
  rationale: Isinasalin ang pantawag-pansin nang malinaw at natural sa modernong Filipino.
- source_word: כָל אֲשֶׁר לוֹ
  choice: ang lahat ng pag-aari niya
  rationale: Likas na ipinahahayag sa Filipino ang kabuuan ng mga bagay na nasa kanya.
- source_word: בְּיָדֶךָ
  choice: ay nasa iyong kamay
  rationale: Pinananatili ang larawang “kamay” bilang kapangyarihan o kontrol at ang pag-uulit nito sa kasunod na pagbabawal.
- source_word: רַק
  choice: Ngunit
  rationale: Sa kontekstong ito, malinaw na minamarkahan ang tanging hangganan ng ipinahintulot; mas natural dito ang “Ngunit” kaysa sa literal na “Tanging.”
- source_word: אֵלָיו אַל תִּשְׁלַח יָדֶךָ
  choice: huwag mong iunat ang iyong kamay laban sa kanya
  rationale: Pinananatili ang Hebreong idyoma at ang pag-uulit ng “kamay,” habang nililinaw ng “laban sa kanya” ang masamang pagkilos na ipinagbabawal.
- source_word: וַיֵּצֵא
  choice: umalis
  rationale: Direkta at natural na salaysay ng pag-alis.
- source_word: מֵעִם פְּנֵי יְהוָה
  choice: mula sa presensya ni Yahweh
  rationale: Natural na salin ng idyomang tumutukoy sa pag-alis mula sa harapan o kinaroroonan ni Yahweh.
theological_decisions:
- issue: Pagpapakahulugan sa הַשָּׂטָן sa pambungad ng Job
  choice: ang Tagapagparatang
  alternative: ang Satanas; ang kalaban
  rationale: Ang anyong Hebreo ay may pantukoy at maaaring maglarawan ng papel o titulo sa makalangit na kapulungan, hindi kinakailangang isang ganap nang nakapirming pangalang pantangi. Pinananatili nito ang tensiyon ng teksto nang hindi ipinapasok ang mga pagpapalagay mula sa mas huling tradisyon.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang pangalang Yahweh at ang magkaugnay na larawang “nasa iyong kamay” / “iunat ang iyong kamay.”
