  yaml_path: translation/ot/job/001/004.yaml
  text: His sons would go and hold a feast[a], each in his own house on his day, and they would send and invite their three sisters to eat and drink with them.
translation:
  language: tl
  text: Ang mga anak niyang lalaki ay karaniwang nagpupunta at nagdaraos ng handaan, bawat isa sa sarili niyang bahay sa kanyang araw[a]. Nagpapadala sila at nag-aanyaya sa kanilang tatlong kapatid na babae upang kumain at uminom kasama nila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O maaaring “sa kanyang kaarawan.” Literal sa Hebreo ang “sa kanyang araw,” na maaaring tumukoy sa takdang araw ng bawat anak na lalaki o sa kanyang kaarawan.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָלְכוּ
  choice: ay nagdaraos
  rationale: Sa konteksto ng tal. 4–5, ang anyong pandiwa ay naglalarawan ng nakagawiang kilos sa nakaraan. Likas sa Tagalog ang pangkasalukuyang anyong “nagdaraos” sa ganitong salaysay ng paulit-ulit na kaugalian.
- source_word: בָנָיו
  choice: kanyang mga anak na lalaki
  rationale: Tiyak na panlalaking maramihan ang Hebreo, at hiwalay na binabanggit sa talata ang mga kapatid nilang babae.
- source_word: וְעָשׂוּ מִשְׁתֶּה
  choice: nagdaraos ng salu-salo
  rationale: Natural na katumbas ito ng idyomang literal na “gumawa ng handaan,” at ipinahihiwatig ang masayang sama-samang pagkain nang hindi labis na pormal.
- source_word: בֵּית אִישׁ
  choice: bawat isa sa sarili niyang bahay
  rationale: 'Ipinahahayag nito ang distributibong diwa: bawat anak na lalaki ay nagdaraos sa sarili niyang bahay.'
- source_word: יוֹמוֹ
  choice: sa kanyang araw
  rationale: Pinananatili ang literal at sadyang hindi tiyak na Hebreong “kanyang araw,” na maaaring tumukoy sa takdang araw ng bawat isa o sa kanyang kaarawan.
- source_word: וְשָׁלְחוּ וְקָרְאוּ
  choice: Nagpapasugo sila at inaanyayahan
  rationale: Pinananatili ang dalawang kilos—pagpapadala ng mensahe o sugo at pag-anyaya—sa natural na modernong Tagalog, habang ipinahahayag ang nakagawiang pag-uulit.
- source_word: לִשְׁלֹשֶׁת אֲחִיתֵיהֶם
  choice: ang kanilang tatlong kapatid na babae
  rationale: Malinaw nitong tinutukoy ang tatlong babaeng kapatid ng mga anak na lalaki.
- source_word: לֶאֱכֹל וְלִשְׁתּוֹת
  choice: upang kumain at uminom
  rationale: Tuwirang katumbas ng magkaparis na infinitive at natural na nagpapahayag ng layunin ng paanyaya.
- source_word: עִמָּהֶם
  choice: na kasama nila
  rationale: Ipinahahayag ang sama-samang pakikibahagi ng mga kapatid na babae sa salu-salo kasama ng kanilang mga kapatid na lalaki.
