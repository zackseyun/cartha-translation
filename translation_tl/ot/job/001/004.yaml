translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “salu-salo” sa halip na mas pormal na “piging,” at pinanatili sa pangunahing teksto ang kalabuan ng “sa kanyang araw,” na ipinaliliwanag sa talababa.
