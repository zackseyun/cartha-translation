  yaml_path: translation/ot/job/001/022.yaml
  text: In all this[a], Job did not sin, nor did he charge God with wrongdoing.
translation:
  language: tl
  text: Sa lahat ng ito, hindi nagkasala si Job, ni ibinintang ni Job sa Diyos ang anumang kamalian.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “ni ibinintang ni Job sa Diyos ang kahangalan,” o “ni iniugnay ni Job sa Diyos ang anumang di-nararapat.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּכָל זֹאת
  choice: Sa lahat ng ito
  rationale: Tumutukoy ang parirala sa kabuuan ng mga pangyayaring nauna. Likas sa modernong Tagalog ang “Sa lahat ng ito” at pinananatili nito ang saklaw ng Hebreo.
- source_word: לֹא חָטָא
  choice: hindi nagkasala
  rationale: Ang חטא ang karaniwang pandiwa para sa pagkakasala; hindi ito pinalabnaw tungo sa mas pangkalahatang “hindi nagkamali.”
- source_word: אִיּוֹב
  choice: Job
  rationale: Ginamit ang nakaugaliang anyo ng pangalang biblikal sa Tagalog.
- source_word: וְלֹא נָתַן
  choice: ni ibinintang
  rationale: Bagaman literal na “nagbigay” ang נתן, kasama ng תִּפְלָה at ng di-tuwirang layon na Diyos, ipinahihiwatig ng parirala ang pag-uukol o pagpaparatang ng isang kapintasan. Ang “ibinintang” ay natural at malinaw sa konteksto.
- source_word: תִּפְלָה
  choice: anumang kamalian
  rationale: Ang bihirang salita ay maaaring magpahiwatig ng kamalian, kahangalan, o bagay na di-nararapat. Ang “kamalian” ay sapat na malawak upang hindi labis na paliitin ang kahulugan, habang inilalahad sa talababa ang mahahalagang alternatibo.
- source_word: לֵאלֹהִים
  choice: sa Diyos
  rationale: Ang ל ay nagmamarka sa Diyos bilang pinag-uukulan ng ipinaparatang; payak at angkop ang “sa Diyos.”
theological_decisions:
- issue: Kahulugan ng תִּפְלָה kapag iniuukol sa Diyos
  choice: ni ibinintang sa Diyos ang anumang kamalian
  alternative: ni ibinintang sa Diyos ang kahangalan; ni iniugnay sa Diyos ang anumang di-nararapat
  rationale: Ipinakikita ng talata na sa gitna ng kapahamakan ay hindi itinuring ni Job na may kapintasang maibibintang sa Diyos. Hindi nilulutas nang labis ng “kamalian” ang saklaw ng bihirang salitang Hebreo; pinananatili sa talababa ang mga posibleng diwang “kahangalan” at “di-nararapat.”
translation_notes:
  register: Modernong, dignificado, at madaling maunawaang Tagalog. Ginamit ang “ni” upang natural na ipagpatuloy ang ikalawang pagtanggi, at iniwasan ang masyadong teknikal o denominasyonal na pananalita.
