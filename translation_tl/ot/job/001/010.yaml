base_translation:
  language: en
  yaml_path: translation/ot/job/001/010.yaml
  text: Have you not put a hedge around him and around his house and around all that he has[a], on every side? You have blessed the work of his hands[b], and his livestock has spread throughout the land.
translation:
  language: tl
  text: Hindi mo ba siya, ang kanyang sambahayan, at lahat ng kanyang pag-aari ay binakuran mo sa lahat ng panig?[a] Pinagpala mo ang gawa ng kanyang mga kamay, at ang kanyang mga alagang hayop ay lumaganap sa lupain.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Hindi mo ba siya, ang kanyang sambahayan, at lahat ng kanyang pag-aari ay nilagyan mo ng bakod sa lahat ng panig?” Ang Hebreo ay gumagamit ng kongkretong larawan ng isang bakod na nagbibigay ng proteksiyon.
    reason: lexical_alternative
  - marker: b
    text: O “dumami nang labis sa lupain.” Ang pandiwang Hebreo ay literal na naglalarawan ng pagputok palabas o paglaganap.
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׂכְתָּ
  choice: binakuran
  rationale: Pinananatili nito ang kongkretong larawan ng isang bakod na nagbibigay ng proteksiyon, sa halip na gawing abstraktong ‘pinrotektahan.’
- source_word: בַעֲדוֹ / וּבְעַד בֵּיתוֹ / וּבְעַד כָּל אֲשֶׁר לוֹ מִסָּבִיב
  choice: siya ... ang kanyang sambahayan ... lahat ng kanyang pag-aari, sa palibot
  rationale: Ipinahahayag nito ang ganap na pag-ikot ng proteksiyon. Ginamit ang ‘sambahayan’ upang mapanatili ang posibleng saklaw ng בֵּיתוֹ bilang bahay at mga taong kabilang dito.
- source_word: מַעֲשֵׂה יָדָיו
  choice: ang gawa ng kanyang mga kamay
  rationale: Pinananatili ang malinaw at likas na idyomang Hebreo para sa kanyang paggawa at produktibong gawain.
- source_word: בֵּרַכְתָּ
  choice: Pinagpala mo
  rationale: Tuwirang pinananatili ang wika ng pagpapala at ang pag-uugnay ng tagumpay ni Job sa kilos ng Diyos.
- source_word: מִקְנֵהוּ
  choice: ang kanyang mga alagang hayop
  rationale: Saklaw nito ang mga kawan at iba pang hayop na pag-aari, at mas madaling maunawaan sa modernong Filipino kaysa sa mas makitid na ‘mga baka.’
- source_word: פָּרַץ בָּאָרֶץ
  choice: lumaganap sa lupain
  rationale: Inililipat nito sa natural na Filipino ang masiglang larawan ng pagputok palabas o malawakang pagdami, kasama ang heograpikong paglawak na ipinahihiwatig ng parirala.
- source_word: הֲלֹא
  choice: Hindi mo ba
  rationale: Pinananatili ang anyo at mapanumbat na lakas ng retorikal na tanong.
theological_decisions:
- issue: Pagpapanatili ng wika ng pagpapala sa halip na gawin lamang itong materyal na pag-unlad
  choice: Pinagpala mo ang gawa ng kanyang mga kamay
  alternative: Pinaunlad mo ang gawa ng kanyang mga kamay
  rationale: Ang בֵּרַכְתָּ ay tahasang nagsasabing pinagpala ng Diyos ang gawain ni Job; hindi dapat paliitin ang pahayag tungo lamang sa ekonomikong tagumpay.
- issue: Pagpapanatili ng metapora ng nakapalibot na proteksiyon
  choice: binakuran ... sa palibot
  alternative: pinrotektahan
  rationale: Ang Hebreo ay gumagamit ng kongkretong larawan ng isang proteksiyon na bakod. Pinananatili ito upang hindi mawala ang talinghagang lakas ng paratang.
- issue: Saklaw ng בֵּיתוֹ
  choice: sambahayan
  alternative: bahay
  rationale: Maaaring tumukoy ang Hebreo sa tahanan bilang gusali o sa sambahayan. Ang ‘sambahayan’ ay natural sa konteksto at hindi nililimitahan ang proteksiyon sa gusali lamang.
translation_notes:
  register: Modernong Filipino na dignified at madaling maunawaan. Pinanatili ang retorikal na tanong, ang kongkretong metapora ng bakod, ang idyomang ‘gawa ng kanyang mga kamay,’ at ang teolohikal na salitang ‘pinagpala.’
