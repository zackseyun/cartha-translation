id: JOB.1.8
reference: Job 1:8
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל הַ/שָּׂטָ֔ן הֲ/שַׂ֥מְתָּ לִבְּ/ךָ֖ עַל עַבְדִּ֣/י אִיּ֑וֹב כִּ֣י אֵ֤ין כָּמֹ֨/הוּ֙ בָּ/אָ֔רֶץ אִ֣ישׁ תָּ֧ם וְ/יָשָׁ֛ר יְרֵ֥א אֱלֹהִ֖ים וְ/סָ֥ר מֵ/רָֽע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/001/008.yaml
  text: 'And Yahweh said to the Accuser[a], “Have you set your heart on my servant Job? For there is none like him on the earth: a blameless and upright man[b], one who fears God and turns away from evil.”'
translation:
  language: tl
  text: At sinabi ni Yahweh sa Tagapagparatang[a], “Pinagtuunan mo ba ng pansin ang lingkod kong si Job?[b] Sapagkat walang sinumang katulad niya sa lupa—isang lalaking walang kapintasan at matuwid, may takot sa Diyos at lumalayo sa kasamaan.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang Satanas” o “ang Kalaban.” May pantukoy ang salitang Hebreo, kaya tila titulo o tungkulin ang gamit nito rito sa halip na malinaw na personal na pangalan.
    reason: alternative_reading
  - marker: b
    text: Sa literal, “Inilagak mo ba ang iyong puso sa lingkod kong si Job?” Ang idyomang Hebreo ay nangangahulugang sadyang ituon ang pansin sa isang tao.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang transliterasyon ng personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
- source_word: הַשָּׂטָן
  choice: ang Tagapagparatang
  rationale: Dahil may pantukoy ang salitang Hebreo, malamang na titulo o tungkulin ang tinutukoy rito, hindi pa malinaw na isang personal na pangalan. Napananatili rin nito ang diwang hudisyal ng pag-aakusa.
- source_word: הֲשַׂמְתָּ לִבְּךָ עַל
  choice: Pinagtuunan mo ba ng pansin
  rationale: Ipinahahayag nito sa likas na modernong Tagalog ang idyomang tumutukoy sa sinasadyang pagbibigay-pansin. Inilagay sa talababa ang literal na larawan ng ‘paglalagak ng puso’ upang hindi mawala ang anyo ng Hebreo.
- source_word: עַבְדִּי
  choice: ang lingkod ko
  rationale: Ang konteksto ay katayuan ni Job bilang pag-aari at naglilingkod sa Diyos, kaya mas angkop ang ‘lingkod’ kaysa ‘alipin.’
- source_word: כִּי אֵין כָּמֹהוּ בָּאָרֶץ
  choice: Sapagkat walang sinumang katulad niya sa lupa
  rationale: Malinaw at likas itong nagpapahayag ng natatanging pagkatao ni Job at hindi nililimitahan ang saklaw sa isang partikular na lupain.
- source_word: אִישׁ
  choice: isang lalaki
  rationale: Tiyak na tumutukoy ito kay Job bilang isang lalaking indibidwal.
- source_word: תָּם
  choice: walang kapintasan
  rationale: Ipinahihiwatig nito ang moral na integridad, hindi ang ganap na kawalan ng kasalanan.
- source_word: יָשָׁר
  choice: matuwid
  rationale: Likas at kinikilalang katumbas ito ng moral na pagiging tuwid o wasto.
- source_word: יְרֵא אֱלֹהִים
  choice: may takot sa Diyos
  rationale: Pinananatili nito ang biblikal na idyoma at ang diwa ng patuloy na pagpipitagan at kabanalan.
- source_word: וְסָר מֵרָע
  choice: lumalayo sa kasamaan
  rationale: Ipinahahayag nito ang palagiang pag-iwas at pagtalikod ni Job sa masama.
theological_decisions:
- issue: Kung ang הַשָּׂטָן ay personal na pangalan o titulo/tungkulin
  choice: Isinalin bilang ‘ang Tagapagparatang.’
  alternative: ‘Satanas,’ ‘ang Satanas,’ o ‘ang Kalaban.’
  rationale: Ang pantukoy sa Hebreo ay pumapabor sa pagbasa rito bilang titulo o tungkulin. Hindi ipinapasok nang maaga ang kalaunang paggamit nito bilang personal na pangalan.
- issue: Kung ang תָּם ay nangangahulugang ganap na walang kasalanan
  choice: Isinalin bilang ‘walang kapintasan’ sa diwa ng integridad.
  alternative: ‘perpekto’ o ‘ganap.’
  rationale: Sa panitikang karunungan at sa pagkakatambal nito sa ‘matuwid,’ inilalarawan nito ang buo at matapat na asal, hindi ang absolutong kawalan ng kasalanan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Pinili ang likas na idyomang ‘pinagtuunan ng pansin’ sa pangunahing teksto at pinanatili sa talababa ang literal na larawan ng Hebreo. Ginamit ang ‘Tagapagparatang’ bilang malinaw na titulo sa konteksto ng makalangit na hukuman.
