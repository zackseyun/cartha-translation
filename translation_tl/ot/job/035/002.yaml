  naturalness: 'Kailangan ng maliit na rebisyon sa balangkas at bantas. Ang ‘Itinuturing mo bang makatarungan ito—ang sabihin mo’ ay mabigat at may hindi magkatugmang panipi. Mas malinaw at marangal ang ‘Itinuturing mo bang makatarungan na sabihin mo: ...?’'
  terminology: Ang ‘makatarungan’ para sa מִשְׁפָּט at ‘katuwiran’ para sa צִדְקִי ay angkop sa modernong Filipino Tagalog at pinananatili ang legal-moral na rehistro. Ang ‘katuwiran ng Diyos’ ay isang kinakailangang pagsasalin ng nakapahiwatig na pangngalan sa pahambing na pagbasa, hindi isang doktrinal na pagpapalawak.
