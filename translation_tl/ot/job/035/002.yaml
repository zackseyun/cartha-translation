translation:
  language: tl
  text: 'Itinuturing mo bang makatarungan na sabihin mo: ‘Ang katuwiran ko ay higit kaysa sa katuwiran ng Diyos’?'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֲזֹאת חָשַׁבְתָּ
  choice: Itinuturing mo bang ... ito
  rationale: 'Pinagsama ang pantanong na הֲ, ang demonstratibong זֹאת, at ang חָשַׁבְתָּ upang maipahayag nang natural sa Tagalog ang retorikal na tanong: ‘Itinuturing mo bang ... ito?’'
- source_word: לְמִשְׁפָּט
  choice: makatarungan
  rationale: Ang מִשְׁפָּט ay maaaring tumukoy sa katarungan, hatol, o karapatan; dito ay hinahamon ni Elihu kung makatarungan o tama ang sinasabi ni Job.
- source_word: אָמַרְתָּ
  choice: ang sabihin mo
  rationale: Bagaman anyong ganap ang pandiwa, ipinakikilala nito ang sinabi ni Job na may kasalukuyang kaugnayan. Ang ‘ang sabihin mo’ ay maayos na nakakabit sa unang sugnay at hindi nagpapasya kung minsanan o patuloy ang pagsasalita.
- source_word: צִדְקִי
  choice: Ang katuwiran ko
  rationale: Pinananatili ng ‘katuwiran’ ang moral at hudisyal na saklaw ng צֶדֶק/צְדָקָה, kabilang ang pag-aangkin ng pagiging nasa tama.
- source_word: מֵאֵל
  choice: ay higit kaysa sa Diyos
  rationale: Maaaring gamiting pahambing ang מִן, kaya ang pangunahing salin ay ‘higit kaysa sa Diyos.’ Sadyang hindi idinagdag ang ‘katuwiran ng Diyos’ sa teksto upang mapanatili ang siksik at bahagyang alanganing anyo ng Hebreo.
theological_decisions:
- issue: Ang ugnayan ng ‘aking katuwiran’ at ‘Diyos’ sa pariralang צִדְקִי מֵאֵל
  choice: 'Pahambing: ‘Ang katuwiran ko ay higit kaysa sa Diyos’'
  alternative: ‘Matuwid ako sa harap ng Diyos’ o ‘Ang karapatan ko ay mula sa Diyos’
  rationale: Siksik at pinagtatalunan ang Hebreo. Ang pahambing na pagbasa ay angkop sa mapanuligsang buod ni Elihu, ngunit tunay na posible ang ibang ugnayan ng מִן; kaya inilalahad ang mga iyon sa talababa sa halip na tahimik na alisin.
translation_notes:
  register: Makabago at marangal na Tagalog. Ginamit ang ‘makatarungan’ at ‘katuwiran’ upang mapanatili ang legal-moral na himig. Ang gitling na em dash ay nagpapalinaw na ang kasunod na sipi ang bagay na tinutukoy sa retorikal na tanong.
