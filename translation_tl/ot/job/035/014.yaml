  yaml_path: translation/ot/job/035/014.yaml
  text: How much less when you say[a], ‘You do not see him’; the case is before him, and you must wait for him.
translation:
  language: tl
  text: Gaano pa kaya kung sinasabi mong, “Hindi mo siya nakikita”? Ang usapin ay nasa harap niya, at maghintay ka sa kanya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O mas literal, “at mamilipit ka sa harap niya.” Mahirap unawain ang pandiwang Hebreo, at marami ang nagpapakahulugan dito bilang “maghintay sa kanya nang may pag-asa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַף כִּי
  choice: Gaano pa kaya kapag
  rationale: Ipinahahayag ng parirala ang mas mariing paghahambing o pangangatwiran mula sa naunang talata, hindi lamang isang pagsalungat na gaya ng “bagaman.”
- source_word: תֹאמַר
  choice: sinasabi mong
  rationale: Likas na salin ng pandiwang nasa ikalawang panauhang panlalaki na tuwirang tumutukoy kay Job.
- source_word: לֹא תְשׁוּרֶנּוּ
  choice: Hindi mo siya nakikita
  rationale: Ang שׁוּר ay nangangahulugang tumingin, makakita, o makatanaw. Sa konteksto, ito ang pahayag ni Job na hindi niya nakikita o namamalayan ang Diyos, hindi na hindi nakikita ng Diyos ang kaso.
- source_word: דִּין
  choice: ang kaso
  rationale: 'May legal na diwa rito ang דִּין: isang usaping inihaharap upang hatulan, sa halip na ang abstraktong konsepto ng katarungan.'
- source_word: לְפָנָיו
  choice: nasa harap niya
  rationale: Pinananatili nito ang karaniwang idyoma at ang larawan ng kasong nakahain sa harap ng Diyos para pagpasyahan.
- source_word: וּתְחוֹלֵל לוֹ
  choice: kaya maghintay ka sa kanya
  rationale: Mahirap at maaaring higit sa isa ang kahulugan ng pandiwang Hebreo. Ang “maghintay” ay angkop sa konteksto ng paghihintay sa pasya o pagkilos ng Diyos; ang kongkretong alternatibong “mamilipit” ay pinanatili sa talababa.
theological_decisions:
- issue: Ang ugnayan ng hindi pagkakita kay God at ng kasong nasa harap niya
  choice: Hindi man nakikita ni Job ang Diyos, nasa harap pa rin ng Diyos ang kaso at dapat maghintay si Job sa kanya.
  alternative: Hindi nakikita ng Diyos ang kaso.
  rationale: Ang gramatika at daloy ng pahayag ay higit na tumutukoy sa reklamo ni Job na hindi niya nakikita ang Diyos. Hindi nito ipinapalagay na walang kaalaman ang Diyos sa kaso.
- issue: Kahulugan ng panghuling pandiwa
  choice: maghintay ka sa kanya
  alternative: mamilipit ka sa harap niya
  rationale: Ang pandiwa ay tunay na mahirap unawain. Ginamit sa pangunahing teksto ang kahulugang umaangkop sa konteksto, ngunit hindi itinago ang mas literal na alternatibo at inilagay ito sa talababa.
translation_notes:
  register: Makabago at marangal na Filipino, na gumagamit ng payak na pananalita at pinananatili ang legal na larawan ng talata. Inilagay ang panandang [a] sa panghuling sugnay na talagang tinutukoy ng talababa.
