  text: If you sin[a], what do you accomplish against him? And if your transgressions are many, what do you do to him?
translation:
  language: tl
  text: 'Kung nagkakasala ka, ano ang nagagawa mo laban sa kanya?[a]


    At kung marami ang mga pagsuway mo, ano ang ginagawa mo sa kanya?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O mas literal, “ano ang ginagawa mo sa kanya?” Ang pandiwang Hebreo ay maaaring mangahulugang “gumawa” o “magdulot ng epekto”; ipinahahayag ng “nagagawa mo laban sa kanya” ang retorikal na diwa ng tanong.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם חָטָאתָ
  choice: Kung nagkakasala ka
  rationale: Ang אִם ay nagpapakilala ng pasubaling kalagayan. Bagaman perpektibo ang anyo ng חטא, pangkalahatan at retorikal ang diwa rito, kaya natural sa modernong Tagalog ang aspektong imperpektibo na “nagkakasala.”
- source_word: מַה תִּפְעָל בּוֹ
  choice: ano ang nagagawa mo laban sa kanya
  rationale: Ang פעל ay maaaring mangahulugang gumawa o magdulot ng epekto. Ang בּוֹ ay maaaring tumukoy sa pagkilos laban sa kanya; pinananatili ng “nagagawa ... laban” ang retorikal na tanong nang hindi tahasang idinaragdag ang salitang “pinsala.”
- source_word: וְרַבּוּ פְשָׁעֶיךָ
  choice: At kung marami ang mga pagsuway mo
  rationale: Ipinahihiwatig ng magkatulad na mga sugnay ang kondisyong “kung” sa ikalawang linya. Ang פשע ay may diwa ng kusang paglabag o paghihimagsik; ang “mga pagsuway” ay malinaw, marangal, at hindi labis na teknikal.
- source_word: מַה תַּעֲשֶׂה לּוֹ
  choice: ano ang nagagawa mo sa kanya
  rationale: Ang עשה na may לּוֹ ay literal na nagtatanong kung ano ang ginagawa o naidudulot sa kanya. Iniwasang idagdag ang “kaya” o “pinsala” upang mapanatili ang payak at bahagyang bukas na pagkakasabi ng Hebreo.
theological_decisions:
- issue: Kung ipahihiwatig bang walang anumang kabuluhan sa Diyos ang kasalanan ng tao, o mas makitid na hindi nito siya napipinsala o nababawasan.
  choice: 'Panatilihin ang dalawang retorikal na tanong: “nagagawa ... laban sa kanya” at “nagagawa ... sa kanya.”'
  alternative: “Anong pinsala ang naidudulot mo sa kanya?”
  rationale: Sa argumento ni Elihu, binibigyang-diin ang kadakilaan at kasarinlan ng Diyos, hindi ang kawalang-halaga ng kasalanan sa moral na pakikipag-ugnayan sa kanya. Ang napiling salin ay nagpapahiwatig ng kawalan ng epektong laban sa Diyos nang hindi pinalalawak iyon tungo sa pahayag na walang kabuluhan sa kanya ang kasalanan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “nagkakasala” para sa pangkalahatang kondisyong retorikal at “mga pagsuway” upang maipakita ang sinadyang paglabag na taglay ng פשע. Napanatili ang parallelismo ng dalawang tanong at ang tunay na bahagyang pagkakaiba ng mga pang-ukol na בּוֹ at לּוֹ.
