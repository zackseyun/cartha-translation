  yaml_path: translation/ot/job/035/013.yaml
  text: Surely God does not hear emptiness[a], and the Almighty does not regard it.
translation:
  language: tl
  text: Tunay ngang hindi dinirinig ng Diyos ang kawalang-saysay[a], at hindi ito pinapansin ng Makapangyarihan sa Lahat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “kahungkagan,” “kabulaanan,” o “walang kabuluhan.” Ang salitang Hebreo ay maaaring tumukoy sa bagay na hungkag, walang saysay, o mapanlinlang.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Tunay ngang
  rationale: Ipinahahayag ang madiing lakas ng partikula nang natural sa makabagong Tagalog, nang hindi ito ginagawang panrestrictibong “lamang.”
- source_word: שָׁוְא
  choice: kabulaanan
  rationale: Sinasaklaw nito ang diwang hungkag, walang saysay, o mapanlinlang, habang nananatiling abstraktong pangngalan. Inilalahad sa talababa ang tunay na lawak ng salitang Hebreo.
- source_word: יִשְׁמַע
  choice: hindi dinirinig
  rationale: Ang imperpektibo ay nagpapahayag dito ng pangkalahatang katotohanan; pinananatili ng “dinirinig” ang tuwirang pandama at ang posibleng diwa ng pagtugon.
- source_word: אֵל
  choice: Diyos
  rationale: Karaniwan at natural na katumbas ng banal na titulong אֵל sa Filipino.
- source_word: וְשַׁדַּי
  choice: at ... ng Makapangyarihan sa Lahat
  rationale: Isinasalin ang titulong שַׁדַּי sa nakatatag at madaling maunawaang banal na katawagan sa Tagalog.
- source_word: יְשׁוּרֶנָּה
  choice: hindi ito pinapansin
  rationale: Ipinakikita ang diwa ng maingat na pagtingin o pagbibigay-pansin at ang paralelismo sa “hindi dinirinig”; ang “ito” ay tumutukoy sa kabulaanan.
theological_decisions:
- issue: Ang tinutukoy ng שָׁוְא sa pahayag ni Elihu
  choice: Pinananatili bilang abstraktong “kabulaanan,” na maaari ring magpahiwatig ng isang hungkag, walang saysay, o di-tapat na hinaing.
  alternative: Tahasang isalin bilang “hungkag na daing” o bilang “mapagmataas na pananalita.”
  rationale: Hindi nililimitahan ng Hebreo ang salita sa isang tiyak na uri ng panalangin o pananalita. Pinananatili ng salin at talababa ang leksikal at teolohikal na tensiyon, at hindi ipinahihiwatig na may hindi nalalaman ang Diyos.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “Tunay ngang” para sa diin at “pinapansin” para sa natural na paralelismo ng pagdinig at maingat na pagtingin. Nasa pangunahing teksto ang marker na [a].
