id: JOB.35.9
reference: Job 35:9
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: מֵ֭/רֹב עֲשׁוּקִ֣ים יַזְעִ֑יקוּ יְשַׁוְּע֖וּ מִ/זְּר֣וֹעַ רַבִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/job/035/009.yaml
  text: Because of the multitude of oppressions they cry out[b][a]; they call for help because of the arm of the mighty.
translation:
  language: tl
  text: Dahil sa napakaraming pang-aapi, sumisigaw sila; humihingi sila ng tulong dahil sa bisig ng mga makapangyarihan.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “humihingi sila ng tulong mula sa bisig ng mga makapangyarihan.” Maaaring isalin nang mas literal na “mula sa” ang pang-ukol sa Hebreo, bagaman malamang na sanhi ng kanilang pagdaing ang ipinahahayag dito.
    reason: lexical_alternative
  - marker: b
    text: Ang “bisig” ay larawang Hebreo para sa lakas o kapangyarihan.
    reason: cultural_note
lexical_decisions:
- source_word: מֵרֹב
  choice: Dahil sa napakaraming
  rationale: Ipinahahayag ng מִן kasama ng רֹב ang sanhi ng pagsigaw, habang natural na naihahatid ng “napakaraming” ang lawak o dami.
- source_word: עֲשׁוּקִים
  choice: pang-aapi
  rationale: Sa konteksto, tumutukoy ang anyong maramihan sa mga gawa o pagkakataon ng pang-aapi, hindi pangunahin sa mga taong inaapi.
- source_word: יַזְעִיקוּ
  choice: sumisigaw sila
  rationale: Ang Hiphil ng זעק ay karaniwang nangangahulugang magtaas ng sigaw o sumigaw dahil sa matinding kagipitan.
- source_word: יְשַׁוְּעוּ
  choice: humihingi sila ng tulong
  rationale: Ipinahahayag ng pandiwa ang pagdaing upang saklolohan; bahagyang naiiba ito sa naunang pangkalahatang pagsigaw at napapanatili ang paralelismo.
- source_word: מִזְּרֹעַ
  choice: dahil sa bisig ng
  rationale: Pinananatili ng “bisig” ang larawang Hebreo para sa lakas o kapangyarihan, at binabasa rito ang pang-ukol bilang nagsasaad ng sanhi.
- source_word: רַבִּים
  choice: mga makapangyarihan
  rationale: Sa konteksto ng pang-aapi at “bisig,” malamang na tumutukoy ito sa mga taong makapangyarihan, hindi lamang sa marami o dakila.
theological_decisions:
- issue: Kaugnayan ng מִן sa “bisig ng mga makapangyarihan”
  choice: dahil sa bisig ng mga makapangyarihan
  alternative: mula sa bisig ng mga makapangyarihan
  rationale: Maaaring ipahayag ng pang-ukol ang sanhi o pinagmumulan. Mas angkop sa daloy ang sanhi ng paghingi ng tulong, ngunit pinananatili sa talababa ang mas literal at tunay na posibleng pagbasa.
translation_notes:
  register: Modernong Filipino na natural at marangal. Pinanatili ang konkretong larawang “bisig” sa halip na palitan agad ng “kapangyarihan,” at iniwasan ang labis na teknikal o makalumang pananalita.
