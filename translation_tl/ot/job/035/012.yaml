  source_fidelity: 'Tumpak ang salin sa Hebreo: ang שָׁם ay “Doon,” ang יִצְעֲקוּ ay naipahayag bilang “sila sumisigaw,” at ang sanhi ay wastong “dahil sa ... ng masasamang tao.” Ang hindi tahasang simuno ng יַעֲנֶה ay pinanatili sa “siya,” nang hindi tahasang idinadagdag ang Diyos sa pangunahing teksto.'
  naturalness: 'Likas, malinaw, at marangal ang modernong Filipino: “Doon sila sumisigaw, ngunit hindi siya sumasagot, dahil sa kapalaluan ng masasamang tao.” Ang “ngunit” ay angkop na pagpapahayag ng kontrast, at ang daloy ng pangungusap ay maayos.'
  terminology: Ang “kapalaluan” ay angkop para sa negatibong גְּאוֹן sa kontekstong ito; ang alternatibong “kayabangan” ay wastong naitala. Ang “masasamang tao” ay natural na pantumbas ng רָעִים at hindi nagdaragdag ng di-hinihinging limitasyon sa kasarian.
