  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: שָׁ֣ם יִ֭צְעֲקוּ וְ/לֹ֣א יַעֲנֶ֑ה מִ֝/פְּנֵ֗י גְּא֣וֹן רָעִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/job/035/012.yaml
  text: There they cry out[a], but he does not answer[b], because of the pride of evil men.
translation:
  language: tl
  text: Doon sila sumisigaw, ngunit hindi siya sumasagot[a], dahil sa kapalaluan[b] ng masasamang tao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hindi tahasang pinangalanan sa Hebreo ang simuno ng “sumasagot”; ipinahihiwatig ng konteksto na ito ay ang Diyos.
    reason: alternative_reading
  - marker: b
    text: Maaari ring “kayabangan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁם
  choice: Doon
  rationale: Pangunahing panlunan ang pang-abay at tumutukoy sa kalagayang inilalarawan sa konteksto; hindi ito ginawang pansamantalang “pagkatapos.”
- source_word: יִצְעֲקוּ
  choice: sila sumisigaw
  rationale: Ipinahihiwatig ng צעק ang malakas na pagsigaw dahil sa kagipitan. Likas at malinaw sa modernong Filipino ang “sumisigaw” nang hindi nagdaragdag ng tiyak na nilalaman ng kanilang sigaw.
- source_word: וְלֹא
  choice: ngunit hindi
  rationale: Bagaman maaaring payak na pang-ugnay ang waw, ipinakikita rito ng “ngunit” ang malinaw na pagsalungat sa pagitan ng pagsigaw at kawalan ng sagot.
- source_word: יַעֲנֶה
  choice: siya sumasagot
  rationale: Nasa ikatlong panauhang panlalaking isahan ang pandiwa, ngunit hindi tahasang pinangalanan ang simuno. Pinananatili ng “siya” ang pagpipigil ng Hebreo; ayon sa konteksto, Diyos ang ipinahihiwatig.
- source_word: מִפְּנֵי
  choice: dahil sa
  rationale: Nagsasaad dito ng sanhi ang parirala, kaya malinaw at likas ang “dahil sa.”
- source_word: גְּאוֹן
  choice: kapalaluan
  rationale: 'Sa kaugnayan nito sa masasamang tao, negatibo ang diwa ng גאון: mapagmataas na pagmamataas, hindi marangal na kadakilaan. Ang “kayabangan” ay isang posibleng kahalili.'
- source_word: רָעִים
  choice: masasamang tao
  rationale: Ginagamit bilang pangngalang maramihan ang panlalaking pang-uri at tumutukoy sa mga taong gumagawa ng masama. Ang “masasamang tao” ay likas sa Filipino at hindi nagpapalagay na ang gramatikal na panlalaking anyo ay naglilimita lamang sa mga lalaking tao.
theological_decisions:
- issue: Hindi tahasang simuno ng “sumasagot”
  choice: Hindi pinangalanan ang Diyos sa pangunahing teksto; “siya” lamang ang ginamit.
  alternative: Hindi sila sinasagot ng Diyos.
  rationale: Malinaw na Diyos ang ipinahihiwatig ng konteksto, ngunit walang tahasang pangngalang simuno sa sugnay na Hebreo. Pinananatili ng salin ang tunay na pagpipigil ng teksto.
- issue: Saklaw ng רָעִים
  choice: masasamang tao
  alternative: masasamang lalaki
  rationale: Panlalaking maramihan ang anyong Hebreo, ngunit maaari itong gamitin bilang substantibong tawag sa mga taong masama. Ang “masasamang lalaki” ay maaaring magdagdag ng eksklusibong pagtukoy sa kasarian na hindi tiyak na hinihingi ng konteksto.
translation_notes:
  register: Makabago, payak, at marangal ang pananalita. Pinanatili ang panlunang “Doon,” ang bigat ng pagsigaw sa kagipitan, at ang di-tahasang simuno ng pandiwang “sumasagot.”
