  text: אִם צָ֭דַקְתָּ מַה תִּתֶּן ל֑/וֹ א֥וֹ מַה מִ/יָּדְ/ךָ֥ יִקָּֽח־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/035/007.yaml
  text: If you are righteous[b][a], what do you give to him? Or what does he take from your hand?
translation:
  language: tl
  text: Kung matuwid ka, ano ang ibinibigay mo sa kanya?[a] O ano ang kinukuha niya mula sa iyong kamay?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “kanya” ay tumutukoy sa Diyos. Sa konteksto, ipinapakita ni Elihu na walang pakinabang na naidaragdag sa Diyos ang katuwiran ng tao.
    reason: cross_reference
  - marker: b
    text: O “tinatanggap niya mula sa iyong kamay.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Kung
  rationale: Tuwirang ipinakikilala ang kondisyong ipinahahayag ng Hebreo.
- source_word: צָדַקְתָּ
  choice: matuwid ka
  rationale: Ipinahahayag ng צדק ang pagiging matuwid o nasa tama; ang “matuwid” ay angkop sa moral at teolohikal na himig ng Job.
- source_word: מַה תִּתֶּן לוֹ
  choice: ano ang ibinibigay mo sa kanya
  rationale: Pinananatili ang retorikal na tanong at ang karaniwang diwa ng imperfect na pandiwa nang hindi nagdaragdag ng tahasang modal na “kaya” o “maaari.”
- source_word: מִיָּדְךָ
  choice: mula sa iyong kamay
  rationale: Pinananatili ang konkretong larawang Hebreo tungkol sa bagay na nagmumula sa pag-aari o pagkilos ng isang tao.
- source_word: יִקָּח
  choice: kinukuha niya
  rationale: Tuwirang katumbas ng לקח ang “kumuha,” habang kinikilala sa talababa ang maaari ring diwang “tumanggap.”
theological_decisions:
- issue: Ang tinutukoy ng mga panghalip na לוֹ at יִקָּח
  choice: Pinanatili bilang “sa kanya/niya,” na tumutukoy sa Diyos ayon sa konteksto.
  alternative: Palitan sa pangunahing teksto ng tahasang “sa Diyos/ng Diyos,” o unawaing di-tiyak ang tinutukoy.
  rationale: Sa pangangatwiran ni Elihu sa Job 35:6–8, ang punto ay walang naidaragdag sa Diyos ang katuwiran ng tao. Gayunman, mga panghalip lamang ang nasa tekstong Hebreo, kaya hindi tahasang ipinalit ang pangalang “Diyos” sa pangunahing teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang magkatulad na retorikal na mga tanong at ang larawan ng “kamay” mula sa Hebreo; hindi tahasang pinalitan ng “Diyos” ang panghalip upang maiwasan ang labis na pagpapaliwanag sa pangunahing teksto.
