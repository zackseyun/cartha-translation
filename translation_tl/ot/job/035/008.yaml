  naturalness: Likas ang “nakaaapekto sa” at malinaw ang pag-uulit nito sa magkatambal na sugnay. Mas natural at mas malinaw sa modernong Filipino ang “isang tao” sa pangunahing teksto; ang literal na imaheng Hebreo ay maaaring ipreserba sa talababa.
