base_translation:
  language: en
  yaml_path: translation/ot/job/035/008.yaml
  text: Your wickedness affects a man like yourself[a], and your righteousness a son of man.
translation:
  language: tl
  text: Ang kasamaan mo ay nakaaapekto sa taong tulad mo, at ang katuwiran mo naman ay nakaaapekto sa isang tao.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal na “sa isang anak ng tao.” Karaniwang idyomang Hebreo ito para sa isang mortal na tao; hindi ito mesiyanikong titulo.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְאִישׁ
  choice: nakaaapekto sa taong
  rationale: Walang hayag na pandiwa sa Hebreo, kaya ipinahiwatig mula sa konteksto ng talata 6–7 ang diwang ang kilos ng tao ay umaabot o may epekto sa kapwa tao. Likas sa Filipino ang “nakaaapekto sa” at hindi nito ipinahihiwatig na direktang nababago ng kasamaan ang Diyos.
- source_word: כָּמוֹךָ
  choice: tulad mo
  rationale: 'Pinananatili nito ang tahasang paghahambing sa Hebreo: ang tinutukoy ay kapwa taong katulad ni Job.'
- source_word: רִשְׁעֶךָ
  choice: ang kasamaan mo
  rationale: Ang רֶשַׁע ay tumutukoy sa moral na kasamaan o masamang asal; tuwiran at marangal ang “kasamaan” sa paralelismo ng talata.
- source_word: וּלְבֶן אָדָם
  choice: sa isang anak ng tao
  rationale: Pinananatili ang konkretong larawang Hebreo at ang panlalaking isahan, habang nililinaw ng di-tiyak na “isang” at ng talababa na karaniwang katawagan ito sa isang mortal na tao, hindi isang mesiyanikong titulo rito.
- source_word: צִדְקָתֶךָ
  choice: ang katuwiran mo
  rationale: Ang צְדָקָה rito ay matuwid na asal o katuwiran, na tuwirang katapat ng “kasamaan” sa paralelismo.
theological_decisions:
- issue: Kahulugan ng בֶּן אָדָם sa konteksto
  choice: Karaniwang mortal na tao, ngunit isinalin sa pangunahing teksto bilang “isang anak ng tao”
  alternative: “isang tao” o “isang mortal”
  rationale: Sa Job, karaniwang patulang katawagan ito para sa tao at kapantay ng “taong tulad mo.” Hindi ito ginagamit dito bilang mesiyanikong titulong “Anak ng Tao.” Pinananatili ng salin ang imaheng Hebreo nang hindi nilulutas nang palihim ang posibleng maling pagbasa.
- issue: Ipinahiwatig na epekto ng kasamaan at katuwiran
  choice: Inulit ang “nakaaapekto” sa dalawang sugnay
  alternative: 'Panatilihin ang elipsis: “ang kasamaan mo ay para sa taong tulad mo, at ang katuwiran mo naman ay para sa isang anak ng tao”'
  rationale: Nominal at eliptikal ang Hebreo, ngunit itinatakda ng konteksto sa talata 6–7 ang tanong kung kanino umaabot ang epekto ng asal ng tao. Kailangan ng Filipino ng pandiwa upang maging malinaw at natural; ang pag-uulit nito sa ikalawang sugnay ay umiiwas sa alanganing pangungusap.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “nakaaapekto” bilang likas na pagpapahayag ng pandiwang ipinahihiwatig ng konteksto, habang pinanatili ang patulang pariralang “anak ng tao” at ipinaliwanag ito sa talababa.
