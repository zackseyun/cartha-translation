  text: So Job opens his mouth in vain[a]; without knowledge he multiplies words.
translation:
  language: tl
  text: Kaya ibinubuka ni Job ang kanyang bibig nang walang kabuluhan[a]; nagpaparami siya ng mga salita nang walang kaalaman.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa kahungkagan” o “nang walang saysay.” Ang Hebreong הֶבֶל ay maaaring tumukoy sa singaw, kahungkagan, kawalang-kabuluhan, o kawalang-saysay.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶבֶל
  choice: nang walang kabuluhan
  rationale: Saklaw ng הֶבֶל ang singaw, kahungkagan, at kawalang-kabuluhan. Sa pangungusap na ito, inilalarawan nito ang pagsasalita ni Job bilang walang saysay o kabuluhan, kaya natural at tapat ang pang-abay na parirala.
- source_word: יִפְצֶה פִּיהוּ
  choice: ibinubuka ... ang kanyang bibig
  rationale: Ang פצה פה ay idyomang nangangahulugang ibuka ang bibig upang magsalita. Napananatili ng salin ang larawan ng Hebreo at nauunawaan pa rin ito sa modernong Filipino.
- source_word: בִּבְלִי דַעַת
  choice: nang walang kaalaman
  rationale: Tuwirang ipinapahayag ng בִּבְלִי ang kawalan, at ang דַעַת ay kaalaman. Hindi pinalalawak ng salin ang paratang ni Elihu tungo sa mas tiyak na uri ng kamangmangan.
- source_word: מִלִּין
  choice: mga salita
  rationale: Ang Aramaizing na anyong maramihan ay tumutukoy sa mga salita o pahayag; ang “mga salita” ang pinakasimple at pinakatapat na katumbas.
- source_word: יַכְבִּר
  choice: nagpaparami
  rationale: Ipinahihiwatig ng pandiwang Hiphil ang pagpaparami o paggawa ng marami. Pinananatili ng “nagpaparami” ang sanhiing diwa at ang matinding puna sa dami ng sinasabi.
- source_word: וְאִיּוֹב
  choice: Kaya ... si Job
  rationale: Sa konteksto, inuugnay ng וְ ang talata sa naunang kongklusyon ni Elihu. Ipinahahayag ng “Kaya” ang inferensiyal na ugnayan nang hindi ginagawa itong tahasang pagsalungat.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Pinanatili ang Hebreong larawang “ibinubuka ... ang bibig,” habang ginawang likas sa Filipino ang gamit ng הֶבֶל bilang pang-abay. Ang semicolon ay nagpapanatili sa magkatimbang na dalawang sugnay ng tulang Hebreo.
