  text: who teaches us more than the beasts of the earth and makes us wiser than the birds of the heavens[a].
translation:
  language: tl
  text: na nagtuturo sa atin nang higit kaysa sa mga hayop sa lupa at ginagawa tayong mas marunong kaysa sa mga ibon sa langit[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O kaya, “na nagtuturo sa atin mula sa mga hayop sa lupa at ginagawa tayong marunong mula sa mga ibon sa langit.” Maaari ring ipahiwatig ng pang-ukol sa Hebreo ang pinagmulan sa halip na paghahambing.
    reason: alternative_reading
lexical_decisions:
- source_word: מַ֭לְּפֵנוּ
  choice: nagtuturo sa atin
  rationale: Ang Piel participle ng למד na may hulaping unang panauhang maramihan ay tumutukoy sa aktibong pagtuturo. Natural at malinaw sa modernong Filipino ang “nagtuturo sa atin.”
- source_word: מִבַּהֲמוֹת אָרֶץ
  choice: nang higit kaysa sa mga hayop sa lupa
  rationale: Pinakamalamang na pahambing ang gamit ng מִן sa kontekstong patula. Ipinahahayag nitong ang pagtuturong ibinibigay sa tao ay higit sa natatanggap o taglay ng mga hayop, habang pinananatili ang kongkretong larawan ng “mga hayop sa lupa.”
- source_word: וּמֵעוֹף הַשָּׁמַיִם
  choice: kaysa sa mga ibon sa langit
  rationale: Kaagapay ito ng naunang pahambing na parirala. Ang “mga ibon sa langit” ay natural sa Filipino at tapat sa Hebreong idyoma.
- source_word: יְחַכְּמֵנוּ
  choice: ginagawa tayong mas marunong
  rationale: 'Ang Piel imperfect ng חכם na may hulaping unang panauhang maramihan ay may diwang sanhi: ginagawa niya tayong marunong. Idinagdag ang “mas” upang malinaw na maipahayag ang pinakamalamang na paghahambing.'
theological_decisions:
- issue: Kahulugan ng pahimulang מִן/מֵ sa dalawang magkatugmang parirala
  choice: 'Pahambing: tinuturuan ng Diyos ang mga tao nang higit kaysa sa mga hayop at ginagawa silang mas marunong kaysa sa mga ibon.'
  alternative: 'Pinagmulan o paraan: tinuturuan tayo mula sa mga hayop sa lupa at binibigyan ng karunungan mula sa mga ibon sa langit.'
  rationale: Mas sinusuportahan ng paralelismong patula at ng konteksto ang paghahambing ng kaloob na pagtuturo at karunungan sa tao sa kalagayan ng mga hayop. Gayunman, tunay na posible sa gramatika ang pagbasa sa pang-ukol bilang tanda ng pinagmulan, kaya pinananatili iyon sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang paralelismo at larawang patula. Ang pambungad na “na” at tandang pananong ay umaayon sa pagpapatuloy ng retorikal na tanong mula sa naunang talata.
