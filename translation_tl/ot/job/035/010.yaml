  text: But no one says[a], ‘Where is God my Maker, who gives songs in the night?’
translation:
  language: tl
  text: Ngunit walang nagsasabi, “Nasaan ang Diyos na aking Maylalang,[a] na nagbibigay ng mga awit sa gabi?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “mga gumawa sa akin”; maramihan ang anyo, bagaman iisang Diyos ang tinutukoy rito.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא אָמַר
  choice: Ngunit walang nagsasabi
  rationale: Ang pangatnig at pagtanggi ay nagpapakita ng pagsalungat sa naunang konteksto. Bagaman perpektibo ang anyo ng pandiwa, pangkalahatan o nakagawiang kilos ang diwa rito, kaya natural ang pangkasalukuyang “walang nagsasabi.”
- source_word: אַיֵּה
  choice: Nasaan
  rationale: Likas at tuwirang salin ito ng pananong tungkol sa kinaroroonan o presensiya.
- source_word: אֱלוֹהַּ
  choice: Diyos
  rationale: Karaniwang katawagan ito sa Diyos sa aklat ng Job at malinaw sa modernong Tagalog.
- source_word: עֹשָׂי
  choice: Maylikha sa akin
  rationale: Bagaman maramihan ang anyong Hebreo, iisang Diyos ang tinutukoy. Ang “Maylikha sa akin” ay marangal at natural, at malinaw na nagpapahayag ng kaugnayan ng Maylikha sa nagsasalita.
- source_word: נֹתֵן
  choice: na nagbibigay
  rationale: Ang participle ay naglalarawan sa karaniwang ginagawa ng Diyos; natural itong ipinapahayag bilang sugnay na panlarawan.
- source_word: זְמִרוֹת
  choice: mga awit
  rationale: Saklaw nito ang payak na kahulugan ng salita nang hindi ipinapalagay na tahasang mga awit ng pagsamba ang tinutukoy.
- source_word: בַּלָּיְלָה
  choice: sa gabi
  rationale: Natural sa Tagalog at napapanatili ang maikli at matalinghagang himig ng Hebreo.
theological_decisions:
- issue: Bilang ng עֹשָׂי kapag tumutukoy sa Diyos
  choice: 'Isahang diwa: “Maylikha sa akin”'
  alternative: 'Pormal na maramihan: “mga maylikha sa akin”'
  rationale: Maramihan ang pormang Hebreo ngunit ang tinutukoy ay ang iisang Diyos. Ginamit ang isahan sa pangunahing teksto upang hindi magpahiwatig ng maraming diyos, habang itinala sa talababa ang pormal na anyong maramihan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang patulang larawang “mga awit sa gabi” at iniwasang dagdagan ito ng tahasang diwang liturhikal na wala sa mismong salita.
