base_translation:
  language: en
  yaml_path: translation/ot/job/035/003.yaml
  text: For you say[a], ‘What advantage is it to you? What profit do I have from my sin?’
translation:
  language: tl
  text: Sapagkat sinasabi mo[a], “Ano ang pakinabang nito sa iyo? Ano ang mapapala ko mula sa aking kasalanan?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Ano ang pakinabang mo? Ano ang mapapala ko nang higit kaysa mula sa aking kasalanan?” Maikli at eliptikal ang Hebreo, at maaaring ipinahihiwatig nito ang paghahambing ng pagiging matuwid at pagkakasala.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikilala nito ang paliwanag ni Elihu tungkol sa sinasabi ni Job at likas na nag-uugnay sa pangangatwiran.
- source_word: תֹאמַר
  choice: sinasabi mo
  rationale: Qal imperfect, ikalawang panauhang panlalaki na isahan; ang aspektong nagpapatuloy ay natural na maipahahayag sa modernong Tagalog bilang “sinasabi mo.”
- source_word: יִסְכָּן לָךְ
  choice: Ano ang pakinabang nito sa iyo?
  rationale: Ang סכן ay tumutukoy sa pagiging kapaki-pakinabang. Pinananatili ng “nito” ang di-tiyak na reperente ng Hebreo sa halip na tahasang idagdag ang “pagiging matuwid.”
- source_word: אֹעִיל
  choice: Ano ang mapapala ko
  rationale: Ang Hiphil ng יעל ay nangangahulugang makinabang o magtamo ng pakinabang; ang “mapapala ko” ay natural at malinaw sa kasalukuyang Tagalog.
- source_word: מֵחַטָּאתִי
  choice: mula sa aking kasalanan
  rationale: Maaaring magpahiwatig ang מִן ng pinagmulan o paghahambing. Ang “mula sa” ay sumusunod sa payak na anyo at hindi tahasang nilulutas ang posibleng pahambing na diwa.
theological_decisions:
- issue: Diwa ng sipi ni Elihu at reperente ng “sa iyo”
  choice: Pinanatiling di-tiyak sa “Ano ang pakinabang nito sa iyo?”
  alternative: “Ano ang pakinabang sa iyo ng pagiging matuwid?” o “Ano ang pakinabang mo rito?”
  rationale: Maikli at eliptikal ang Hebreo, at maaaring tumukoy ang panghalip sa naunang pahayag tungkol sa pagiging matuwid. Hindi idinagdag sa pangunahing teksto ang isang tahasang reperente na wala mismo sa talata.
- issue: Posibleng paghahambing sa pagitan ng katuwiran at pagkakasala
  choice: “Ano ang mapapala ko mula sa aking kasalanan?”
  alternative: “Ano ang mapapala ko nang higit kaysa kung nagkasala ako?”
  rationale: Maaaring pahambing ang מִן ayon sa konteksto, ngunit hindi tahasang inuulit ng Hebreo ang buong batayan ng paghahambing. Inilalagay sa talababa ang alternatibo upang mapanatili ang tensiyon.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “pakinabang” at “mapapala” upang mapanatili ang paralelismo nang hindi nagiging paulit-ulit o teknikal.
