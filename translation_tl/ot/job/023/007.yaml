  yaml_path: translation/ot/job/023/007.yaml
  text: There an upright man could reason with him[b][a], and I would be delivered forever from my judge.
translation:
  language: tl
  text: Doon, makikipagkatuwiranan sa kanya ang taong matuwid,[a] at makaliligtas ako magpakailanman mula sa humahatol sa akin.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “makikipagtalo sa kanya” o “maihaharap ang kanyang usapin sa kanya.”
    reason: lexical_alternative
  - marker: b
    text: O “mula sa aking hukom.” Maaari ring unawain ang Hebreo bilang pagkaligtas “mula sa humahatol sa akin.”
    reason: alternative_reading
lexical_decisions:
- source_word: שָׁם
  choice: Doon
  rationale: Tumutukoy ito sa inaakalang lugar ng pakikipagharap sa Diyos sa konteksto; natural at tuwiran ang “Doon.”
- source_word: יָשָׁר
  choice: ang matuwid
  rationale: Pinananatili nito ang diwa ng moral na integridad o katuwiran ng taong naghaharap ng usapin.
- source_word: נוֹכָח
  choice: makikipagtalo
  rationale: 'May legal at dialogong diwa ang salita rito: ang paglalahad at pagtatanggol ng katuwiran sa harap ng kausap, hindi simpleng pakikipag-away.'
- source_word: עִמּוֹ
  choice: sa kanya
  rationale: Pinananatili ang panghalip ng Hebreo nang hindi tahasang pinapangalanan ang Diyos, bagaman siya ang tinutukoy sa konteksto.
- source_word: וַאֲפַלְּטָה
  choice: at makaliligtas ako
  rationale: Ang pandiwang פלט ay tumutukoy sa pagtakas o pagkaligtas. Ang anyong ito ay natural sa Filipino at hindi ipinipilit ang mas teknikal na kahulugang “mapawawalang-sala.”
- source_word: לָנֶצַח
  choice: magpakailanman
  rationale: Ipinahahayag nito ang pangmatagalan o ganap na bisa ng inaasahang pagkaligtas.
- source_word: מִשֹּׁפְטִי
  choice: mula sa humahatol sa akin
  rationale: Mas natural ito kaysa “mula sa aking hukom” at nananatiling malapit sa posibleng kahulugang “ang humahatol sa akin,” nang hindi ginagawang “tagapag-akusa.”
theological_decisions:
- issue: Ang tinutukoy at legal na diwa ng מִשֹּׁפְטִי
  choice: humahatol sa akin
  alternative: aking hukom; tagapag-akusa sa akin
  rationale: Pinananatili ng salin ang legal na larawan at ang tensiyon kung ang diin ay nasa Diyos bilang Hukom o sa kilos ng paghatol kay Job. Hindi nito ipinapasok ang mas tiyak at interpretatibong “tagapag-akusa.”
- issue: Uri ng pagharap na ipinahihiwatig ng נוֹכָח
  choice: makikipagtalo sa kanya
  alternative: makikipagkatuwiranan sa kanya; maihaharap ang kanyang usapin sa kanya
  rationale: Ipinakikita ng “makikipagtalo” ang matapang at legal na pakikipagtuwiran ni Job nang hindi awtomatikong ipinahihiwatig na walang paggalang o na tiyak ang magiging hatol.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang legal na wikang “makikipagtalo” at “humahatol” upang mapanatili ang larawan ng paglilitis, ngunit iniwasan ang sobrang teknikal o denominasyonal na pagpapakahulugan.
