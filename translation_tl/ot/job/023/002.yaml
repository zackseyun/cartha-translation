source:
  edition: WLC
  text: גַּם הַ֭/יּוֹם מְרִ֣י שִׂחִ֑/י יָ֝דִ֗/י כָּבְדָ֥ה עַל אַנְחָתִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/023/002.yaml
  text: Even today my complaint is rebellious[b][a]; my hand is heavy because of my groaning.
translation:
  language: tl
  text: Kahit ngayon, mapaghimagsik ang aking reklamo[a]; mabigat ang aking kamay dahil sa aking pagdaing[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mapait ang aking reklamo.” Karaniwang tumutukoy ang salitang Hebreo sa paghihimagsik o pagsuway, bagaman inuunawa ito ng ilan bilang “mapait” ayon sa konteksto.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “mabigat ang aking kamay sa ibabaw ng aking pagdaing.” Hindi tiyak ang kahulugan ng parirala. Nauunawaan ito ng ilan bilang idyoma para sa pinipigil o nabibigatang pagpapahayag; binabago naman ng iba ang teksto upang basahing “kaniyang kamay.”
    reason: alternative_reading
lexical_decisions:
- source_word: גַּם הַיּוֹם
  choice: Kahit ngayon
  rationale: Ipinahahayag ang patuloy na kalagayan ni Job hanggang sa kasalukuyan, sa natural na modernong Tagalog.
- source_word: מְרִי
  choice: mapaghimagsik
  rationale: Pinananatili ang matalim na pangunahing diwa ng paghihimagsik o pagsuway, sa halip na agad itong palambutin bilang ‘mapait.’
- source_word: שִׂיחִי
  choice: ang aking reklamo
  rationale: Sa konteksto ng panaghoy ni Job, tumutukoy ito sa kaniyang ipinahahayag na hinaing o reklamo; malinaw at karaniwan ang ‘reklamo’ sa modernong Tagalog.
- source_word: יָדִי
  choice: ang aking kamay
  rationale: Tuwirang sinusunod ang Masoretic Text na may hulaping unang panauhan, kahit hindi tiyak ang idyomatikong kahulugan ng parirala.
- source_word: כָּבְדָה
  choice: mabigat
  rationale: Pinananatili ang payak na statibong diwa ng pagiging mabigat.
- source_word: עַל
  choice: dahil sa
  rationale: Likas na ipinahahayag sa Tagalog ang posibleng ugnayang sanhi sa pagitan ng bigat at pagdaing, habang itinatala sa talababa ang literal at hindi tiyak na anyo.
- source_word: אַנְחָתִי
  choice: aking pagdaing
  rationale: Ang ‘pagdaing’ ay angkop sa masidhing panaghoy at kaayon ng konteksto ng pagdurusa ni Job.
theological_decisions:
- issue: Kung palalambutin ang paglalarawan ni Job sa kaniyang reklamo upang hindi magpahiwatig ng mapanghamong pagsuway
  choice: Panatilihin sa pangunahing teksto ang ‘mapaghimagsik’
  alternative: mapait
  rationale: Pinananatili nito ang teolohikal na tensiyon ng isang nagdurusang matuwid na nagsasalita sa paraang halos mapanghamon, sa halip na lutasin iyon sa pagsasalin.
- issue: Kung papalitan ang ‘aking kamay’ ng ‘kaniyang kamay’
  choice: Panatilihin ang ‘aking kamay’ ayon sa tekstong Masoretiko
  alternative: mabigat sa akin ang kaniyang kamay
  rationale: Ang nakasulat na tekstong Hebreo ay may unang-panauhang hulapi. Ang emendasyon ay posibleng interpretasyon lamang at hindi dapat ilagay nang walang pahiwatig sa pangunahing teksto.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang matalim na ‘mapaghimagsik’ at ang tekstuwal na ‘aking kamay,’ habang inilagay sa mga talababa ang leksikal at tekstuwal na mga alternatibo.
