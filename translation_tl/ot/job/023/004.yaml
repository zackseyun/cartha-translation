lexical_decisions:
- source_word: אֶעֶרְכָה
  choice: Ilalatag ko
  rationale: Ipinahihiwatig ng ערך ang maayos na pagsasaayos o paglalahad. Sa kontekstong panghukuman, natural na ipinapahayag ng “ilalatag” ang masinop na paghaharap ng usapin.
- source_word: לְפָנָיו
  choice: sa harap niya
  rationale: Tuwirang pinananatili ang diwa ng pagharap sa kaniyang presensya, kasabay ng larawang panghukuman.
- source_word: מִשְׁפָּט
  choice: ang aking usapin
  rationale: Bagaman maaari itong mangahulugang “hatol” o “katarungan,” tumutukoy ito rito sa usaping inihaharap ni Job na parang nasa hukuman. Ang “aking” ay likas na nauunawaan mula sa nagsasalita at ginagawang malinaw sa Tagalog.
- source_word: וּפִי
  choice: ang aking bibig
  rationale: Pinananatili ang konkretong idyomang Hebreo dahil natural itong kaugnay ng pandiwang “pupunuin.”
- source_word: אֲמַלֵּא
  choice: pupunuin ko
  rationale: Pinananatili ang larawan ng pagpuno at ang aspektong hinaharap o kondisyunal na nagpapatuloy mula sa naunang taludtod at konteksto.
- source_word: תּוֹכָחוֹת
  choice: mga katuwiran
  rationale: Sa kontekstong panghukuman, tumutukoy ito sa mga pangangatwiran, patunay, pagsalungat, o pagsaway. Ang “mga katuwiran” ay malinaw at natural, ngunit inilalahad sa talababa ang tunay na lawak ng salita.
theological_decisions:
- issue: Larawang panghukuman sa pagsasalita ni Job sa Diyos
  choice: Panatilihin ang matapang na larawan ng paglalahad ng usapin at mga katuwiran sa harap niya.
  alternative: Gawing mas pangkalahatan bilang paglalahad lamang ng hinaing o pagsasalita tungkol sa kalagayan.
  rationale: Ang pagsasama ng ערך, משפט, at תוכחות ay lumilikha ng malinaw na tagpong panghukuman. Hindi dapat pahinain ang tapang ni Job o dagdagan ito ng pahiwatig ng kawalang-galang na hindi tahasang nasa Hebreo.
translation_notes:
  register: Makabago, dignificado, at madaling maunawaang Filipino. Pinanatili ang larawang “pupunuin ... ang aking bibig” dahil malinaw at makapangyarihan ito sa Tagalog, at ginamit ang “usapin” at “mga katuwiran” upang maipakita ang kontekstong panghukuman nang hindi labis na teknikal.
