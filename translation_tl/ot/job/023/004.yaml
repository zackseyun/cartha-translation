  naturalness: Natural at marangal ang sintaksis ng draft. Mas malinaw na maipapahayag ang modal na puwersa sa modernong Filipino sa pamamagitan ng “sana.” Ang “mga pangangatwiran” ay mas tuwirang katumbas ng mga argumentong ibibigkas sa pangalawang linya kaysa “mga katuwiran,” na maaari ring tumukoy sa pagiging matuwid o mga katwiran/justification.
