base_translation:
  language: en
  yaml_path: translation/ot/job/023/011.yaml
  text: My foot has held fast to his steps[a]; I have kept his way and have not turned aside.
translation:
  language: tl
  text: Mahigpit na sumunod ang paa ko sa kanyang mga yapak[a]; iningatan ko ang kanyang daan at hindi ako lumihis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Kumapit ang paa ko sa kanyang yapak.” Ang larawan sa Hebreo ay ang mahigpit at malapit na pagsunod sa mga yapak ng Diyos.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּאֲשֻׁרוֹ
  choice: sa kanyang mga yapak
  rationale: Ang אֲשׁוּר ay hakbang o bakas ng paa. Ginamit ang maramihang “mga yapak” bilang natural na Filipino upang ilarawan ang patuloy na pagsunod sa dinaanan niya, habang pinananatili sa talababa ang posibleng isahang anyo.
- source_word: אָחֲזָה
  choice: Mahigpit na sumunod
  rationale: Ang pandiwang אחז ay literal na humawak o kumapit. Dahil “ang paa ko” ang simuno at “mga yapak” ang kaugnay na larawan, ipinahahayag ng salin ang matatag at malapit na pagsunod nang hindi nagpapahiwatig ng marahas na pagdakma.
- source_word: רַגְלִי
  choice: ang paa ko
  rationale: Pinanatili ang isahang anyo ng Hebreo at ang kongkretong larawan ng paa na sumusunod sa mga yapak.
- source_word: דַּרְכּוֹ
  choice: ang kanyang daan
  rationale: Ang דֶּרֶךְ ay daan o landas at maaari ring tumukoy sa paraan ng pamumuhay. Ang “daan” ay tuwiran, natural, at nagpapanatili sa metapora.
- source_word: שָׁמַרְתִּי
  choice: iningatan ko
  rationale: Ang שׁמר ay mangahulugang ingatan, sundin, o bantayan. Ang “iningatan” ay nagpapanatili sa pangunahing larawan ng maingat na pagtupad sa kanyang daan.
- source_word: וְלֹא אָט
  choice: at hindi ako lumihis
  rationale: Sa konteksto ng daan, ang anyong pandiwa ay tumutukoy sa hindi paglihis o pagtalikod. Natural sa Filipino ang “hindi ako lumihis” at pinananatili nito ang larawan ng landas.
theological_decisions:
- issue: Ang tinutukoy ng mga hulaping panlalaking isahan sa “kanyang mga yapak” at “kanyang daan”
  choice: Pinanatili ang “kanyang” nang hindi tahasang pinangalanan ang Diyos sa talata.
  alternative: Isalin bilang “mga yapak ng Diyos” at “daan ng Diyos,” o iugnay sa isang di-tiyak na matuwid na landas.
  rationale: Sa konteksto ng Job 23:10–12, malamang na Diyos ang tinutukoy. Gayunman, mga panghalip lamang ang nasa Hebreo, kaya pinananatili ng salin ang anyo at hindi nagdaragdag ng pangalang wala sa talata.
translation_notes:
  register: Makabago at marangal na Filipino na madaling maunawaan. Pinanatili ang kongkretong larawan ng paa, mga yapak, daan, at paglihis; iniwasan ang sobrang literal na “humawak ang paa” sa pangunahing teksto dahil hindi ito likas sa Filipino, ngunit inilagay ang literal na posibilidad sa talababa.
