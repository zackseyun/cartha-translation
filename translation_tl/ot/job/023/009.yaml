  text: שְׂמֹ֣אול בַּ/עֲשֹׂת֣/וֹ וְ/לֹא אָ֑חַז יַעְטֹ֥ף יָ֝מִ֗ין וְ/לֹ֣א אֶרְאֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/023/009.yaml
  text: On the left[a], when he is at work, I do not perceive him; he turns to the right[b], and I do not see him.
translation:
  language: tl
  text: Sa kaliwa[a], kapag siya ay kumikilos, hindi ko siya mawari; sa kanan, nagkukubli siya[b], at hindi ko siya nakikita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “kaliwa” at “kanan” sa Hebreo ay maaari ring tumukoy sa hilaga at timog; pinananatili rito ang makatang paghahambing na kaliwa–kanan.
    reason: cultural_note
  - marker: b
    text: Mas literal, “bumabalot” o “nagtatakip siya sa kanan.” Mahirap at hindi tiyak ang eksaktong diwa ng pariralang Hebreo; maaari rin itong unawain bilang pagtatakip ng sarili.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂמֹאול
  choice: sa kaliwa
  rationale: Pangunahing kahulugan nito ang “kaliwa.” Dahil itinatambal ito sa יָמִין (“kanan”), pinananatili ang makatang paghahambing na kaliwa–kanan sa halip na tahasang gawing hilaga–timog.
- source_word: בַּעֲשֹׂתוֹ
  choice: kapag siya ay kumikilos
  rationale: Ang בְּ na sinusundan ng infinitive construct ng עשה at hulaping 3ms ay may temporal na diwang “kapag/sa paggawa niya.” Ang “kumikilos” ay natural sa Filipino at hindi nililimitahan ang salita sa pisikal na paggawa lamang.
- source_word: אָחַז
  choice: hindi ko siya mawari
  rationale: Pangunahing nangangahulugan ang pandiwa na “humawak” o “sumunggab,” ngunit dito ay tumutukoy sa kabiguang maabot o matalos ang Diyos habang hinahanap siya ni Job. Ipinahahayag ng “mawari” ang kontekstuwal na diwa nang hindi ito ipinapantay lamang sa pisikal na paghawak.
- source_word: יַעְטֹף
  choice: nagkukubli siya
  rationale: Maaari itong mangahulugang “bumalot, tumakip, magkubli,” at mahirap ang eksaktong sintaks ng parirala. Pinananatili ng “nagkukubli” ang larawan ng pagtatakip at ang parallel na resulta na hindi siya makita, habang inilalagay sa talababa ang mas literal na alternatibo.
- source_word: יָמִין
  choice: sa kanan
  rationale: Pangunahing kahulugan nito ang “kanan.” Kasama ng שְׂמֹאול, pinananatili nito ang spatial at makatang kontrast sa talata.
- source_word: אֶרְאֶה
  choice: hindi ko siya nakikita
  rationale: Tuwirang kahulugan ng ראה ang “makita.” Ang layong “siya” ay malinaw mula sa konteksto at likas na kailangan sa Filipino.
theological_decisions:
- issue: Tinutukoy ng mga pandiwa at panghalip na nasa ikatlong panauhan
  choice: Ang Diyos ang ipinahihiwatig na tinutukoy, ayon sa konteksto ng paghahanap ni Job sa kanya.
  alternative: Isang hindi tinukoy na “siya” lamang
  rationale: Hindi tahasang binabanggit ang Diyos sa mismong talata, ngunit malinaw sa Job 23:8–10 na siya ang hinahanap ni Job. Hindi idinaragdag ang pangalang “Diyos” sa pangunahing teksto upang mapanatili ang anyo ng Hebreo.
- issue: Diwa ng יַעְטֹף sa kaugnayan nito sa kanan
  choice: “Nagkukubli siya sa kanan,” na nagpapanatili sa larawan ng pagtatakip at sa kawalan ng kakayahan ni Job na makita siya.
  alternative: “Lumingon siya sa kanan” o “tinatakpan niya ang kanan”
  rationale: Hindi tiyak ang mahirap na parirala. Ang napiling salin ay hindi nagpapasya na simpleng pagliko lamang ang kilos at umaayon sa kasunod na “hindi ko siya nakikita”; ang mas literal na anyo ay itinatala sa talababa.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “mawari” bilang pangkaraniwang pampanitikang salita para sa kabiguang matalos o maabot sa pandama, at “nagkukubli” upang mapanatili ang larawan ng pagtatakip sa mahirap na ikalawang linya.
