  yaml_path: translation/ot/job/023/016.yaml
  text: But God has made my heart faint[a], and the Almighty has terrified me.
translation:
  language: tl
  text: Ngunit pinanghina ng Diyos ang puso ko[a], at sinindak ako ng Makapangyarihan sa Lahat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O kaya, “pinalambot ng Diyos ang puso ko.” Literal na “ginawang malambot” ang pandiwang Hebreo; dito, malamang na tumutukoy ito sa pagkawala ng tapang ni Job.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵל
  choice: Ngunit ... ng Diyos
  rationale: Ang אֵל ay karaniwang katawagan sa Diyos. Bagaman maaaring simpleng “at” ang וְ, ang “ngunit” ay likas na nagpapakita ng ugnayan nito sa naunang pahayag ni Job nang hindi binabago ang diwa.
- source_word: הֵרַךְ
  choice: pinanghina
  rationale: Literal na tumutukoy ang pandiwa sa pagpapalambot o pagpapalupaypay. Kapag puso ang layon, ipinahihiwatig nito ang pagkawala ng tapang o panloob na lakas; malinaw at natural itong naipapahayag ng “pinanghina.”
- source_word: לִבִּי
  choice: ang puso ko
  rationale: Pinananatili ng “puso” ang larawang Hebreo para sa kalooban at panloob na lakas, habang nililinaw ng “pinanghina” ang kahulugan sa konteksto.
- source_word: וְשַׁדַּי
  choice: at ... ng Makapangyarihan sa Lahat
  rationale: Ang שַׁדַּי ay titulong pantukoy sa Diyos. Ang “Makapangyarihan sa Lahat” ay malinaw, marangal, at likas na salin sa modernong Filipino.
- source_word: הִבְהִילָנִי
  choice: sinindak ako
  rationale: Ang Hiphil ng בהל ay nagpapahayag ng pagdudulot ng matinding takot, pagkabigla, o panghihilakbot. Ang “sinindak ako” ay maikli, natural, at sapat ang tindi.
theological_decisions:
- issue: Pagsasalin sa mga katawagang אֵל at שַׁדַּי
  choice: Diyos ... Makapangyarihan sa Lahat
  alternative: Diyos ... Shaddai
  rationale: Magkapantay na katawagan sa Diyos ang ginagamit sa talata. Isinasalin ang titulo upang maipahayag ang kahulugan nito, sa halip na ituring itong personal na pangalan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Pinanatili ang larawang “puso,” ngunit ginamit ang idiomatikong “pinanghina” upang maipahayag ang pagkawala ng tapang; inilagay sa talababa ang mas literal na pagbasa.
