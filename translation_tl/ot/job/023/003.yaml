base_translation:
  language: en
  yaml_path: translation/ot/job/023/003.yaml
  text: Oh[a], that I knew where I might find him, that I might come to his dwelling place.
translation:
  language: tl
  text: Kung malaman ko lamang kung saan ko siya mahahanap! Makapunta lamang sana ako sa kaniyang kinaroroonan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa kaniyang tiyak na lugar” o “sa kaniyang tirahan.” Ang salitang Hebreo ay tumutukoy sa isang matatag o nakatalagang kinaroroonan.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי יִתֵּן
  choice: Kung … lamang
  rationale: Isang idyomang nagpapahayag ng matinding paghahangad, hindi literal na tanong na “Sino ang magbibigay?” Likas sa makabagong Tagalog ang “Kung … lamang.”
- source_word: יָדַעְתִּי וְאֶמְצָאֵהוּ
  choice: alam ko … kung saan ko siya matatagpuan
  rationale: Bagaman walang tahasang salitang “saan” sa Hebreo, ipinahihiwatig ito ng pagsasama ng “malaman” at “matagpuan siya.” Nililinaw ng salin ang elipsis nang hindi binabago ang diwa ng paghahangad.
- source_word: אָבוֹא עַד
  choice: Pupunta ako sa
  rationale: Ang anyong pandiwa ay nagpapahayag ng gagawin ni Job kung matatagpuan niya ang Diyos; ang עַד ay tumutukoy sa patutunguhan at natural na isinasalin bilang “sa.”
- source_word: תְּכוּנָתוֹ
  choice: lugar na kinaroroonan niya
  rationale: Tumutukoy ang pangngalan sa isang matatag o tiyak na lugar. Iniiwasan ng “kinaroroonan” ang labis na pagtitiyak na bahay, tirahan, upuan, o trono ang ibig sabihin.
theological_decisions:
- issue: Tinutukoy ng mga hulaping panlalaking isahan sa “siya” at “niya”
  choice: Ang Diyos ang ipinahihiwatig na tinutukoy, ngunit hindi idinaragdag ang pangalang “Diyos” sa talata.
  alternative: Tahasan itong isaling “ang Diyos” at “kaniyang.”
  rationale: Ipinakikita ng kalapit na konteksto na nais ni Job na iharap ang kaniyang usapin sa Diyos. Gayunman, mga panghalip lamang ang nasa talata, kaya pinananatili iyon upang huwag gawing higit na tahas ang teksto kaysa sa Hebreo.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog. Ginamit ang padamdam sa unang pangungusap upang maipakita ang matinding paghahangad ng optatibong idyoma; pinanatiling hindi tiyak kung ang lugar ay tirahan, luklukan, o ibang takdang kinaroroonan.
