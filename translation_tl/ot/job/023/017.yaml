  yaml_path: translation/ot/job/023/017.yaml
  text: For I was not silenced because of the darkness[a], nor because deep gloom covered my face.
translation:
  language: tl
  text: Sapagkat hindi ako napatahimik dahil sa dilim[a], ni dahil tinakpan ng pusikit na dilim ang aking mukha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Sapagkat hindi ako nilipol dahil sa dilim, ni dahil tinakpan ng pusikit na dilim ang aking mukha.” Mahirap unawain ang Hebreo ng talatang ito, lalo na kung ang diwa ay “napatahimik” o “nilipol,” at kung ang ikalawang bahagi ay nangangahulugang “tinakpan ang aking mukha” o “tinakpan ang nasa harap ko.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Nagpapakilala ito ng paliwanag o dahilan kaugnay ng naunang pahayag ni Job, nang hindi labis na nililinaw ang ugnayang lohikal.
- source_word: נִצְמַתִּי
  choice: hindi ako napatahimik
  rationale: Ang Niphal ng צמת ay maaaring mangahulugang patahimikin, putulin, o wakasan. Ang “napatahimik” ay angkop sa patuloy na pagsasalita at paghihinagpis ni Job, habang pinananatili ng talababa ang ibang posibleng kahulugan.
- source_word: מִפְּנֵי חֹשֶׁךְ
  choice: dahil sa dilim
  rationale: Ang parirala ay pinakamalamang na nagpapahayag dito ng sanhi o dahilan, at natural itong naihahatid sa modernong Tagalog bilang “dahil sa dilim.”
- source_word: וּמִפָּנַי
  choice: ang aking mukha
  rationale: Ang hulaping unang panauhan sa פָּנִים ay maaaring tukuyin ang “aking mukha,” bagaman posible rin ang pang-abay na diwang “sa harap ko”; pinananatili sa talababa ang tunay na kalabuan.
- source_word: כִּסָּה
  choice: tinakpan
  rationale: Tuwirang ipinapahayag nito ang karaniwang kahulugan ng pandiwa na ‘takpan’ o ‘ikubli’ at pinananatili ang aktibong larawang patula.
- source_word: אֹפֶל
  choice: pusikit na dilim
  rationale: Mas matindi ito kaysa חֹשֶׁךְ at tumutukoy sa makapal o matinding kadiliman; ipinakikita ng “pusikit na dilim” ang pagkakaibang leksikal sa naunang “dilim.”
theological_decisions: []
translation_notes:
  register: Makabagong Filipino na marangal at patula ngunit madaling maunawaan. Pinanatili ang magkaibang tindi ng חֹשֶׁךְ at אֹפֶל bilang “dilim” at “pusikit na dilim,” at hindi inalis ang sintaktiko at leksikal na kalabuan ng Hebreo.
