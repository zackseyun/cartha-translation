  yaml_path: translation/ot/job/023/015.yaml
  text: Therefore I am terrified before him[a]; when I consider[b], I am afraid of him.
translation:
  language: tl
  text: Kaya ako’y nasisindak sa harap niya[a]; kapag nag-iisip-isip ako[b], natatakot ako sa kanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “dahil sa kanya” o “sa kanyang presensiya.” Literal, ang Hebreo ay may diwang “mula sa kanyang mukha/presensiya.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “kapag nagmumuni-muni ako” o “kapag pinagninilayan ko.” Walang tahasang layon ang pandiwa sa Hebreo.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  choice: Kaya
  rationale: Ipinahahayag nito ang lohikal na bunga ng naunang sinabi at likas ang tunog sa makabagong Filipino.
- source_word: מִפָּנָיו
  choice: sa harap niya
  rationale: Pinananatili nito ang kongkretong diwa ng Hebreong 'mula sa kanyang mukha/presensiya' nang hindi nililimitahan ang kahulugan sa sanhi lamang.
- source_word: אֶבָּהֵל
  choice: ako'y nasisindak
  rationale: Ang Niphal ng בהל ay nagpapahiwatig ng matinding pagkabalisa o sindak; ang 'nasisindak' ay malinaw at marangal na katumbas.
- source_word: אֶתְבּוֹנֵן
  choice: kapag pinagninilayan ko ito
  rationale: Ipinahahayag ng anyo ng בין ang masusing pag-iisip o pagninilay. Ang 'ito' ay likas na tumutukoy sa bagay na pinag-iisipan sa konteksto, bagaman hindi tahasang nasa Hebreo.
- source_word: וְאֶפְחַד
  choice: natatakot ako
  rationale: Tuwirang ipinahahayag ang takot at pinananatili ang kaagapay na matinding reaksiyon sa unang sugnay.
- source_word: מִמֶּנּוּ
  choice: sa kanya
  rationale: Kasama ng pandiwang 'natatakot,' ito ang likas na Filipino para sa Hebreong 'mula sa kanya,' na may diwang takot sa kanya.
theological_decisions:
- issue: Tinutukoy ng mga panlalaking hulapi sa ikatlong panauhan
  choice: Ginamit ang 'niya/kanya,' na tumutukoy sa Diyos nang hindi idinaragdag ang titulong 'Diyos' sa teksto.
  alternative: Tahasan itong isaling 'Diyos.'
  rationale: Mga panghalip lamang ang nasa Hebreo, at malinaw sa konteksto ang tinutukoy; pinananatili nito ang daloy at hindi nagdaragdag ng wala sa talata.
- issue: Tindi ng reaksiyon ni Job sa Diyos
  choice: Ginamit ang matinding pananalitang 'nasisindak' at 'natatakot.'
  alternative: Palambutin bilang 'nababagabag' o 'namamangha.'
  rationale: Tunay na pangamba ang ipinahahayag ng talata; hindi ito dapat gawing simpleng pagpipitagan lamang.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang 'ako'y' upang mapanatiling maikli at bahagyang patula ang linya, habang ang 'sa harap niya' ay nagpapanatili sa larawang Hebreo at sa tunay na tensiyon ng takot ni Job.
