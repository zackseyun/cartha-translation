  yaml_path: translation/ot/job/023/014.yaml
  text: For he will complete what is appointed for me[a], and many such things are with him.
translation:
  language: tl
  text: Sapagkat isasakatuparan niya ang itinakda para sa akin[a], at maraming gayong bagay ang nasa kanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang aking pasiya,” “ang aking batas,” o “ang takdang bahagi para sa akin.” Ang salitang Hebreo ay maaaring tumukoy sa isang bagay na itinadhana o itinakda para kay Job.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinahahayag nito ang dahilan o paliwanag kaugnay ng naunang sinabi, kaya pinananatili ang ugnayang sanhi at paliwanag.
- source_word: יַשְׁלִים
  choice: isasakatuparan
  rationale: Ang Hiphil ng שׁלם ay tumutukoy sa pagdadala ng isang bagay sa ganap na katuparan; natural sa Filipino ang “isasakatuparan” sa kontekstong ito.
- source_word: חֻקִּי
  choice: ang itinakda para sa akin
  rationale: Maaaring mangahulugan ang חֹק ng batas, pasiya, o takdang bahagi, ngunit dito ay tumutukoy sa bagay na itinakda o inilaan ng Diyos para kay Job nang hindi labis na nililimitahan ang kahulugan.
- source_word: וְכָהֵנָּה רַבּוֹת
  choice: at marami pang gayong bagay
  rationale: Pinananatili nito ang di-tiyak na pagtukoy sa marami pang bagay na katulad ng itinakda para kay Job.
- source_word: עִמּוֹ
  choice: ang nasa kanya
  rationale: Malapit ito sa literal na “kasama niya/nasa kanya” at iniiwang bukas kung ang tinutukoy ay nasa kanyang pasiya, kapangyarihan, o pag-iingat.
theological_decisions:
- issue: Kung legal na “aking batas/pasiya” o ang bahaging itinakda ng Diyos para kay Job ang חֻקִּי
  choice: ang itinakda para sa akin
  alternative: ang aking pasiya; ang aking batas; ang takdang bahagi para sa akin
  rationale: Ang konteksto ay tungkol sa ipinasiyang landas o sasapitin ni Job sa ilalim ng kapangyarihan ng Diyos, hindi sa isang batas na ginawa ni Job. Gayunman, inilalahad sa talababa ang leksikal na lawak upang hindi alisin ang tunay na kalabuan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “isasakatuparan” upang ipahayag ang ganap na pagtupad, at pinanatili ang bahagyang mahiwagang “nasa kanya” sa halip na ipaliwanag nang tahasan bilang plano o kapangyarihan ng Diyos.
