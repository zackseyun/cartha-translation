  yaml_path: translation/ot/job/023/010.yaml
  text: But he knows the way with me[a]; when he has tested me[b], I will come out like gold.
translation:
  language: tl
  text: Ngunit alam niya ang landas na aking tinatahak[a]; kapag nasubok na niya ako[b], lalabas akong tulad ng ginto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang aking landas.” Literal na, “ang daang kasama ko”; maaari itong tumukoy sa landas o takbo ng buhay ni Job.
    reason: lexical_alternative
  - marker: b
    text: O “kung subukin niya ako” o “pagkatapos niya akong subukin.” Maaaring magpahiwatig ang pagkakabuo ng Hebreo ng higit sa isang ugnayang temporal.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Ngunit
  rationale: 'Bagaman madalas itong mangahulugang “sapagkat,” dito ay ipinakikita nito ang pagsalungat: hindi matagpuan ni Job ang Diyos, ngunit lubos siyang kilala ng Diyos.'
- source_word: יָדַע
  choice: alam niya
  rationale: Tumutukoy ito sa ganap at kasalukuyang kaalaman ng Diyos tungkol kay Job.
- source_word: דֶּרֶךְ עִמָּדִי
  choice: ang daang kasama ko
  rationale: Pinananatili nito ang mas literal at hindi pangkaraniwang pariralang Hebreo, sa halip na agad itong pakinisin bilang “ang aking daan.”
- source_word: בְּחָנַנִי
  choice: kapag sinubok niya ako
  rationale: Ang pandiwa ay nangangahulugang subukin o siyasatin; ang “sinubok” ay angkop sa kasunod na larawan ng ginto, habang ang “kapag” ay nagpapanatili ng posibleng temporal na diwa.
- source_word: כַּזָּהָב
  choice: tulad ng ginto
  rationale: Likas na paghahambing sa modernong Tagalog at pinananatili ang larawan ng pagdadalisay.
- source_word: אֵצֵא
  choice: lalabas ako
  rationale: Tuwirang inilalarawan ang kinalabasan ng pagsubok nang hindi dinaragdagan ang teksto ng tiyak na ideya ng pagdadalisay o pagpapawalang-sala.
theological_decisions:
- issue: Kaugnayan ng pagsubok ng Diyos sa magiging kalagayan ni Job
  choice: Panatilihin ang larawan ng pagsubok at paglabas na tulad ng ginto nang hindi nililinaw kung ito ay pangunahing pagpapatunay ng pagiging matuwid o moral na pagdadalisay.
  alternative: Isalin ito nang tahasang tumutukoy sa pagpapawalang-sala o, sa kabilang banda, sa espirituwal na pagdadalisay.
  rationale: Maaaring ipahiwatig ng larawan ng ginto ang pagpapatunay o pagdadalisay. Hindi nilulutas ng Hebreo ang tensiyong ito, kaya hindi rin ito dapat tahasang lutasin ng salin.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Sadyang pinanatili ang bahagyang di-pangkaraniwang “ang daang kasama ko” upang maipakita ang tunay na anyo at kalabuan ng Hebreo; ipinaliliwanag sa talababa ang mas natural na alternatibo.
