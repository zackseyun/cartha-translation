  terminology: Ang “pasiya” ay angkop para sa kontekstuwal na diwa ng בְּאֶחָד at ng tanong tungkol sa pagpapabalik o pagpapabago. Ang “kalooban” ay angkop na pangunahing salin ng נַפְשׁוֹ sa pariralang ito; dapat panatilihin ng talababa ang literal na “kaluluwa” at ipaliwanag ang idiomatikong gamit nito.
