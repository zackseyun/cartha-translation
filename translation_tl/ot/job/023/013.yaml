  yaml_path: translation/ot/job/023/013.yaml
  text: But he is one[a], and who can turn him back? What his soul desires[b], that he does.
translation:
  language: tl
  text: Ngunit iisa ang kaniyang pasiya, at sino ang makapagpapabago sa kaniya? Anumang ninanais ng kaniyang kalooban ay ginagawa niya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “at ninanais ng kaniyang kaluluwa.” Ang “kaluluwa” ay karaniwang paraan sa Hebreo ng pagtukoy sa sariling kalooban o pagnanais.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוּא
  choice: Ngunit siya
  rationale: Ipinahahayag ng pangatnig at tahasang panghalip ang pagsalungat sa naunang konteksto; natural itong naihahatid ng “Ngunit siya.”
- source_word: בְאֶחָד
  choice: ay iisa
  rationale: Pinananatili nito ang maikli at sadyang malabong pahayag ng Hebreo, sa halip na tahasang ipakahulugang “hindi nagbabago”; sa konteksto, maaaring tumukoy ito sa pagiging buo o hindi nagbabago ng kaniyang pasiya.
- source_word: וּמִי יְשִׁיבֶנּוּ
  choice: at sino ang makapagpapabago sa kaniya?
  rationale: Ang Hiphil ng שׁוב ay tumutukoy rito sa pagpapabalik o pagpapabago ng pasiya o landas. Mas natural sa modernong Tagalog ang “makapagpapabago sa kaniya,” bagaman hindi nito pinananatili nang lubos ang larawang “magpabalik.”
- source_word: וְנַפְשׁוֹ
  choice: ng kaniyang kalooban
  rationale: Ang נֶפֶשׁ ay literal na “sarili/buhay/kaluluwa,” ngunit sa pariralang ito tumutukoy sa sariling pagnanais o kalooban. Ang “kalooban” ay likas at marangal sa Tagalog habang ipinaliliwanag sa talababa ang literal na anyo.
- source_word: אִוְּתָה
  choice: naisin
  rationale: Ipinahahayag ng pandiwa ang pagnanais o pagkagusto; ang “naisin” ay natural at hindi labis ang diin.
- source_word: וַיָּעַשׂ
  choice: ginagawa niya
  rationale: Tuwirang katumbas ito ng karaniwang pandiwang עשה na “gawin,” at hindi nagdaragdag ng ideyang “ganap na isinasakatuparan” na hindi tahasang nasa teksto.
theological_decisions:
- issue: Pahayag tungkol sa pagiging “iisa” ng Diyos at sa hindi mapipigilang pasiya niya
  choice: siya ay iisa
  alternative: siya ay hindi nagbabago sa kaniyang pasiya
  rationale: Ang Hebreo ay literal at matalinghagang “siya ay nasa/sa iisa.” Pinananatili ng pangunahing teksto ang tunay na kalabuan at teolohikal na tensiyon; inilalahad ng talababa ang malamang na kontekstuwal na diwa nang hindi ito ipinapalit sa teksto.
- issue: Antropomorpikong “kaniyang kaluluwa” bilang tagapagpahayag ng pagnanais
  choice: anumang naisin ng kaniyang kalooban
  alternative: anumang naisin ng kaniyang kaluluwa
  rationale: Sa Hebreo, ang “kaluluwa” ay karaniwang paraan ng pagtukoy sa mismong sarili, nais, o kalooban ng isang tao. Ang “kalooban” ay malinaw sa modernong Tagalog, samantalang pinananatili sa talababa ang literal na larawan.
translation_notes:
  register: Modernong Filipino Tagalog na payak ngunit marangal. Pinanatili ang literal na “iisa” upang huwag lutasin sa pangunahing teksto ang kalabuan ng Hebreo; ginamit ang “kalooban” sa halip na “kaluluwa” para sa likas na daloy, na may literal na anyo sa talababa.
