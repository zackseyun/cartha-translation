  yaml_path: translation/ot/job/023/012.yaml
  text: I have not turned aside from the command of his lips[a]; I have treasured the words of his mouth more than my allotted portion.
translation:
  language: tl
  text: Hindi ako lumihis sa utos ng kanyang mga labi; mas higit kong pinahalagahan ang mga salita ng kanyang bibig kaysa sa bahaging inilaan sa akin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O kaya, ayon sa tradisyonal na pagpapakahulugan sa isang mahirap na pariralang Hebreo: “Mas higit kong pinahalagahan ang mga salita ng kanyang bibig kaysa sa pagkaing kailangan ko.”'
    reason: alternative_reading
lexical_decisions:
- source_word: מִצְוַת
  choice: utos
  rationale: Ang pang-isahang construct ay natural na naipapahayag sa Filipino bilang “utos” at pinananatili ang lakas ng Hebreo.
- source_word: שְׂפָתָיו
  choice: kanyang mga labi
  rationale: Pinananatili ang kongkretong larawang patula at ang parallelismo sa “kanyang bibig”; tumutukoy sa Diyos ang hulaping panlalaking pangatlong panauhan ayon sa konteksto.
- source_word: לֹא אָמִישׁ
  choice: Hindi ako lumihis
  rationale: Ipinahahayag ng Hiphil ng מוש ang hindi paglayo o paglihis; natural at malinaw ang “lumihis” sa konteksto ng katapatan.
- source_word: מֵחֻקִּי
  choice: higit sa bahaging inilaan sa akin
  rationale: Mahirap at maaaring unawain sa iba’t ibang paraan ang parirala. Ang saling ito ay kumakatawan sa paghahambing at sa ideya ng sariling takdang bahagi nang hindi tahasang tinutukoy iyon bilang pagkain.
- source_word: צָפַנְתִּי
  choice: iningatan ko sa puso
  rationale: Ang pandiwa ay literal na magtago o mag-imbak, at sa karunungang panitikan ay nagpapahiwatig ng mahalagang pag-iingat sa kalooban. Natural itong ipinahahayag sa Filipino bilang “iningatan sa puso.”
- source_word: אִמְרֵי
  choice: mga salita
  rationale: Payak at natural na katumbas ng pangmaramihang construct.
- source_word: פִיו
  choice: kanyang bibig
  rationale: Pinananatili ang literal na larawang patula at ang parallelismo sa “kanyang mga labi.”
theological_decisions:
- issue: Tinutukoy ng mga hulaping panlalaking pangatlong panauhan sa “kanyang mga labi” at “kanyang bibig”
  choice: Ang Diyos
  alternative: Isang di-tiyak na tagapagsalita
  rationale: Sa Job 23, inilalarawan ni Job ang kanyang katapatan sa harap ng Diyos at sa pananalita ng Diyos. Malakas na sinusuportahan ito ng konteksto nang hindi kailangang idagdag ang pangalang “Diyos” sa talata.
- issue: Kahulugan ng מֵחֻקִּי
  choice: 'Paghahambing: “higit sa bahaging inilaan sa akin”'
  alternative: “mula sa aking tuntunin/pasya”; o “higit sa pagkaing kailangan ko” ayon sa tradisyonal na interpretasyon
  rationale: Mahirap ang anyo ng tekstong Hebreo. Pinananatili ng pangunahing salin ang ideya ng sariling takdang bahagi at ang posibleng paghahambing, samantalang inilalagay sa talababa ang kilalang tradisyonal na pagpapakahulugang tumutukoy sa pagkain.
translation_notes:
  register: Makabagong Filipino na marangal ngunit madaling maunawaan. Pinanatili ang paralelismong “mga labi/bibig” at ang tunay na kalabuan ng מֵחֻקִּי sa pamamagitan ng pangunahing salin at talababa.
