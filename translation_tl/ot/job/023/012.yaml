  rationale: Inalis ang hindi tahasang “sa puso” at pinalitan ng “pinahalagahan” upang maihatid ang diwa ng pag-iingat/pagtatangi sa צָפַנְתִּי nang walang dagdag na imahen. Inayos ang sintaks upang malinaw ang paghahambing, habang pinananatili ang pangunahing pagbasa na “bahaging inilaan sa akin” at ang tradisyonal na alternatibong “pagkaing kailangan ko” sa talababa.
