base_translation:
  language: en
  yaml_path: translation/ot/job/023/008.yaml
  text: Look[a], I go east, but he is not there; and west, but I do not perceive him.
translation:
  language: tl
  text: Narito,[a] nagtutungo ako sa silangan, ngunit wala siya roon; at sa kanluran, hindi ko siya mabatid.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pasulong ... paurong.” Ang mga katawagang Hebreo ay maaaring unawain bilang mga direksiyong silangan at kanluran, o bilang pasulong at paurong.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Narito
  rationale: Ginagamit bilang pantawag-pansin sa pahayag ni Job; marangal at likas sa tekstong biblikal nang hindi kasinluma ng ibang posibleng anyo.
- source_word: קֶדֶם
  choice: silangan
  rationale: Sa pagtutumbas nito sa אָחוֹר, natural itong tumukoy sa silangan, bagaman maaari rin itong mangahulugang pasulong; pinanatili sa talababa ang tunay na alternatibo.
- source_word: אֶהֱלֹךְ
  choice: pumunta ako
  rationale: Ipinahahayag ng anyong pandiwa ang pagkilos ni Job sa paghahanap. Ang aspektong Filipino na pumunta ay natural sa pag-uulat ng tangkang paghahanap, nang hindi dinaragdagan ang paraan ng paglakad.
- source_word: וְאֵינֶנּוּ
  choice: ngunit wala siya roon
  rationale: Ang panghalip ay tumutukoy sa Diyos ayon sa konteksto. Idinagdag ang roon upang maging malinaw at natural ang kaugnayan sa direksiyong pinuntahan; inilabas ng ngunit ang pagsalungat na ipinahihiwatig ng bigong paghahanap.
- source_word: אָחוֹר
  choice: kanluran
  rationale: Bilang katapat ng קֶדֶם sa tulang paralelismo, malinaw itong naipapahayag bilang kanluran, habang kinikilala sa talababa ang literal na posibilidad na paurong.
- source_word: לֹא אָבִין לוֹ
  choice: hindi ko siya makita
  rationale: Bagaman ang בין ay maaaring mangahulugang umunawa o kumilala, sa konteksto ng paghahanap sa presensiya ng Diyos ay tumutukoy ito sa hindi pagkakita o pagkabatid sa kaniya. Ang makita ay malinaw at likas sa modernong Tagalog.
theological_decisions:
- issue: Tinutukoy ng mga panghalip na panlalaking isahan
  choice: Ang mga panghalip ay tumutukoy sa Diyos at isinaling “siya.”
  alternative: Isang hindi tahasang tinukoy na referent
  rationale: Ang nakapaligid na konteksto ay tungkol sa paghahanap ni Job sa Diyos. Sapat ang panghalip na siya at hindi kailangang idagdag ang pangalang Diyos sa mismong talata.
translation_notes:
  register: Modernong Filipino Tagalog na simple ngunit marangal. Pinanatili ang maikling paralelismo ng tulang Hebreo at ang tensiyon ng paghahanap ni Job sa Diyos nang hindi nagpapaliwanag nang higit sa teksto.
