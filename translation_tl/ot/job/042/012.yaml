  to: At pinagpala ni Yahweh ang huling bahagi ng buhay ni Job nang higit kaysa sa unang bahagi ng kaniyang buhay[a]. Nagkaroon siya ng labing-apat na libong tupa, anim na libong kamelyo, isang libong pares ng baka[b], at isang libong babaeng asno.
