base_translation:
  language: en
  yaml_path: translation/ot/job/042/012.yaml
  text: And Yahweh blessed the latter part of Job more than his beginning[a]. And he had fourteen thousand sheep, six thousand camels, a thousand yoke of oxen[b], and a thousand female donkeys.
translation:
  language: tl
  text: At pinagpala ni Yahweh ang huling bahagi ng buhay ni Job nang higit kaysa sa unang bahagi ng kaniyang buhay[a]. Nagkaroon siya ng labing-apat na libong tupa, anim na libong kamelyo, isang libong pares ng baka[b], at isang libong babaeng asno.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “ang huling bahagi ni Job nang higit kaysa sa kaniyang pasimula.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “isang libong magkapares na bakang pantrabaho” o “isang libong pangkat ng mga bakang ipinapamatok.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיהוָה
  choice: ni Yahweh
  rationale: Tuwirang tinutumbasan ang pangalang tipan na יְהוָה bilang “Yahweh,” sa halip na palitan ito ng isang titulo.
- source_word: בֵּרַךְ
  choice: pinagpala
  rationale: Pinananatili ng “pinagpala” ang Diyos bilang pinagmumulan ng kabutihan at hindi nililimitahan ang diwa sa materyal na pag-unlad lamang.
- source_word: אַחֲרִית אִיּוֹב
  choice: ang huling bahagi ng buhay ni Job
  rationale: Ipinahahayag nito ang mas huling yugto ng buhay ni Job nang hindi ipinahihiwatig na mga huling araw lamang niya ang tinutukoy.
- source_word: מֵרֵאשִׁתוֹ
  choice: nang higit kaysa sa unang bahagi nito
  rationale: Pinananatili ang paghahambing ng mas huli at unang bahagi ng buhay ni Job; ang talababa ay nagbibigay ng mas literal na anyo.
- source_word: וַיְהִי לוֹ
  choice: Nagkaroon siya ng
  rationale: Natural na salin sa Filipino ng Hebreong eksistensiyal na pormulang literal na “nagkaroon para sa kaniya.”
- source_word: אַרְבָּעָה עָשָׂר אֶלֶף צֹאן
  choice: labing-apat na libong tupa
  rationale: Ang צֹאן ay kolektibong katawagan sa maliliit na alagang hayop at maaaring sumaklaw sa tupa at kambing, ngunit “tupa” ang angkop na maikling salin sa listahang ito at kaayon ng Job 1:3.
- source_word: שֵׁשֶׁת אֲלָפִים גְּמַלִּים
  choice: anim na libong kamelyo
  rationale: Tuwirang salin ng bilang at pangngalan.
- source_word: אֶלֶף צֶמֶד בָּקָר
  choice: isang libong pares ng baka
  rationale: Ang צֶמֶד ay isang pares ng mga bakang magkasamang ipinapamatok para sa paggawa; malinaw at natural sa Filipino ang “pares ng baka.”
- source_word: אֶלֶף אֲתוֹנוֹת
  choice: isang libong babaeng asno
  rationale: Tiyak na mga babaeng asno ang tinutukoy ng אֲתוֹנוֹת, kaya pinananatili ang kasarian sa salin.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Pangalan mismo ang nasa tekstong Hebreo, kaya “Yahweh” ang ginamit sa halip na ang titulong “PANGINOON.”
- issue: Saklaw ng pagpapala sa huling bahagi ng buhay ni Job
  choice: pinagpala ang huling bahagi ng buhay ni Job
  alternative: pinaunlad ang huling kalagayan ni Job
  rationale: Hindi ibinababa ang בֵּרַךְ sa materyal na kasaganaan lamang, kahit na mga ari-arian ang kasunod na inilalarawan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “huling bahagi ng buhay” upang maging natural habang napapanatili ang temporal na paghahambing sa Hebreo. Ang mga bilang ay isinulat sa salita, at iniwasan ang labis na teknikal o makalumang bokabularyo.
