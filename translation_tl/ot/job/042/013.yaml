  text: Nagkaroon din siya ng pitong anak na lalaki at tatlong anak na babae.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי לוֹ
  choice: Nagkaroon din siya ng
  rationale: Ang Hebreong idyomang ויהי + ל + hulaping panghalip ay nagpapahayag ng pag-iral o pag-aari (“nagkaroon siya”). Ang “din” ay likas na nag-uugnay sa pangungusap sa naunang salaysay ng pagpapanumbalik.
- source_word: שִׁבְעָנָה
  choice: pitong
  rationale: Tuwirang salin ng bilang na pito, na ginamitan ng pang-angkop bago ang pangngalan.
- source_word: בָנִים
  choice: anak na lalaki
  rationale: Tiyak na tumutukoy ang Hebreo sa mga lalaking anak; natural at malinaw itong ipinapahayag sa modernong Filipino bilang “anak na lalaki.”
- source_word: וְשָׁלֹשׁ
  choice: at tatlong
  rationale: Likas na salin ng pangatnig at bilang, na may pang-angkop bago ang pangngalan.
- source_word: בָּנוֹת
  choice: anak na babae
  rationale: Tiyak na tumutukoy ang Hebreo sa mga babaeng anak; ang “anak na babae” ang karaniwan at dignidad na katumbas sa Filipino.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na simple, malinaw, at marangal. Pinanatili ang tiyak na kasarian ng mga anak at ang tuloy-tuloy na ugnayan sa naunang salaysay sa pamamagitan ng “din.”
