  yaml_path: translation/ot/job/042/005.yaml
  text: I had heard of you by the hearing of the ear[a], but now my eye has seen you.
translation:
  language: tl
  text: Dati, narinig ko lamang ang tungkol sa iyo[a], ngunit ngayon ay nakita ka ng aking mata.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “sa pakikinig ng tainga”; maaari ring “sa sabi-sabi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לְשֵׁמַע אֹזֶן
  choice: sa narinig ko
  rationale: Ang literal na pariralang “sa pakikinig ng tainga” ay isang idyoma tungkol sa kaalamang natamo sa pamamagitan ng ulat o sabi-sabi. Ang “sa narinig ko” ay natural sa modernong Tagalog at pinananatili ang kaibahan sa tuwirang pagkakita.
- source_word: שְׁמַעְתִּיךָ
  choice: nakilala lamang kita
  rationale: Bagaman literal na “narinig kita,” ang diwa sa konteksto ay dating pagkakilala sa Diyos batay sa narinig na ulat. Ginagawang malinaw ng “nakilala lamang kita sa narinig ko” ang diwang ito nang hindi ipinahihiwatig na narinig lamang ni Job ang tinig ng Diyos.
- source_word: וְעַתָּה
  choice: ngunit ngayon
  rationale: Ipinakikita nito ang mariing pagsalungat ng dating di-tuwirang pagkakilala at ng kasalukuyang tuwirang karanasan.
- source_word: עֵינִי
  choice: aking mata
  rationale: Pinanatili ang pang-isahang anyo ng Hebreo at ang matulaing, personal na diin nito.
- source_word: רָאָתְךָ
  choice: nakita ka
  rationale: Tuwirang isinasalin ang pandiwa at pinananatili ang natapos na pagkakita na may kabuluhan sa kasalukuyang sandali; natural sa Tagalog ang aspektong perpektibo rito.
theological_decisions:
- issue: Ang uri ng ‘pagkakita’ ni Job sa Diyos
  choice: nakita ka ng aking mata
  alternative: tuwiran kitang nakilala / naunawaan kita
  rationale: Pinananatili ang payak na pandiwang “nakita” at hindi ipinapasyang ito ay talinghaga lamang o ganap na pangitain sa Diyos. Sa gayon, nananatili ang teolohikal na tensiyon ng teksto.
translation_notes:
  register: Makabago, natural, at marangal na Filipino. Ginamit ang “Noon” upang ilantad ang paghahambing sa “ngayon,” at ang “lamang” upang ipakita ang limitasyon ng dating kaalaman ni Job. Pinanatili ang pang-isahang “mata” bilang matulaing anyo.
