translation:
  language: tl
  text: Kaya hinahamak ko ang aking sarili[a], at nagsisisi ako sa alabok at abo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Kaya itinatakwil ko, at nagbabago ako ng pasya hinggil sa alabok at abo.” Maikli ang Hebreong teksto at pinagtatalunan ang kahulugan nito, lalo na ang di-binanggit na layon ng “hinahamak/itinatakwil ko” at kung ang kasunod na pandiwa ay nangangahulugang “nagsisisi,” “nagbabago ng pasya,” o “naaaliw.”
    reason: alternative_reading
lexical_decisions:
- source_word: עַל כֵּן
  choice: Kaya
  rationale: Ipinahihiwatig ng parirala ang kongklusyon ni Job mula sa naunang pahayag ng Diyos at sa sinabi niya sa talata 5. Likas at malinaw sa modernong Tagalog ang “Kaya.”
- source_word: אֶמְאַס
  choice: hinahamak ko ang aking sarili
  rationale: Karaniwang nangangahulugang “itakwil” o “hamakin” ang pandiwang מאס, ngunit walang tahasang layon sa Hebreo. Ipinagpalagay sa pangunahing teksto ang “aking sarili” ayon sa konteksto ng pagpapakumbaba ni Job, habang inilalahad sa talababa ang posibleng diwang “binabawi ko ang sinabi ko.”
- source_word: וְנִחַמְתִּי
  choice: at nagsisisi ako
  rationale: Maaaring mangahulugan ang Niphal ng נחם ng pagsisisi, pag-uurong o pagbabago ng pasya, o pagkaaliw, depende sa konteksto. Ang “nagsisisi ako” ay malinaw at angkop sa tugon ni Job matapos niyang makatagpo ang Diyos, ngunit hindi inaalis ng talababa ang ibang posibleng pagbasa.
- source_word: עַל
  choice: sa
  rationale: 'Malawak ang saklaw ng pang-ukol na עַל: “sa ibabaw,” “hinggil sa,” o “dahil sa.” Sa pangunahing pagbasa, likas sa Tagalog ang “sa alabok at abo” bilang kalagayan o tindig ng pagpapakumbaba at pagluluksa.'
- source_word: עָפָר וָאֵפֶר
  choice: alabok at abo
  rationale: Pinananatili ng “alabok at abo” ang matatag na tambalang larawan ng pagiging mortal, pagpapakumbaba, at pagluluksa.
theological_decisions:
- issue: 'Ang huling tugon ni Job: paghamak sa sarili at pagsisisi, o pagbawi sa kanyang sinabi at pagbabago ng saloobin hinggil sa alabok at abo'
  choice: 'Ipinapahayag ni Job ang pagpapakumbaba at pagsisisi: “hinahamak ko ang aking sarili, at nagsisisi ako sa alabok at abo.”'
  alternative: 'Maaaring ang ibig sabihin ay: “binabawi ko ang sinabi ko at nagbabago ako ng saloobin hinggil sa alabok at abo.” Maaari ring ang itinatakwil niya ay ang dati niyang sinabi o ipinaglaban, hindi tahasang ang kanyang sarili.'
  rationale: Maikli at pinagtatalunan ang Hebreo. Walang nakasaad na layon ang אֶמְאַס, at maraming posibleng diwa ang וְנִחַמְתִּי. Sinusuportahan ng 42:5 at ng mapagpakumbabang tugon ni Job ang pangunahing pagbasa, ngunit pinananatili sa talababa ang tunay na tekstuwal at teolohikal na tensiyon.
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran, marangal, at madaling maunawaan. Pinanatili ang tradisyonal at malinaw na larawang “alabok at abo,” at ginamit ang talababa upang hindi maitago ang pagkasiksik at kalabuan ng Hebreo.
