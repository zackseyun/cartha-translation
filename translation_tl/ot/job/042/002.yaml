  text: Alam kong kaya mong gawin ang lahat, at walang layunin mo ang mahahadlangan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “at walang balak mo ang mahahadlangan.” Ang salitang Hebreo ay maaaring mangahulugang “balak,” “plano,” o “layunin,” at ang pandiwa ay maaaring tumukoy sa pagpigil, paghadlang, o pagbigo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ידעת
  choice: Alam kong
  rationale: Sa konteksto, ito ang kasalukuyang pagkilala ni Job sa Diyos. Likas sa modernong Tagalog ang “Alam kong” para sa statibong diwa ng pandiwa at sa kasunod na sugnay.
- source_word: כִּי
  choice: -ng
  rationale: Ang pang-angkop sa “Alam kong” ay likas na nagpapakilala sa nilalaman ng ipinahahayag ni Job, katumbas ng complementizer na כִּי rito.
- source_word: כֹל
  choice: ang lahat
  rationale: Pinananatili nito ang malawak at walang-takdang saklaw ng kakayahan ng Diyos.
- source_word: תּוּכָל
  choice: kaya mong gawin
  rationale: Ang יכל ay nangangahulugang magkaroon ng kakayahan o kapangyarihan. Ang “kaya mong gawin” ay malinaw at likas na Tagalog kasama ng “ang lahat,” nang hindi dinaragdagan ang diwa.
- source_word: וְלֹא
  choice: at walang anumang
  rationale: Ikinakabit nito ang ikalawang sugnay at natural na ipinapahayag ang ganap na pagkakaila sa Tagalog.
- source_word: יִבָּצֵר
  choice: mapipigilan
  rationale: Ang Niphal ng בצר kasama ng מן ay maaaring magpahiwatig ng hindi maipagkait, mahadlangan, o mabigo. Sa ugnayan nito sa “layunin,” ang “mapipigilan” ay malinaw na naghahatid ng diwang walang intensiyon ng Diyos na maaaring biguin.
- source_word: מִמְּךָ
  choice: mo
  rationale: Bagaman literal na may diwang “mula sa iyo,” natural na ipinahahayag sa Tagalog sa pamamagitan ng paari na ang layunin ay sa Diyos.
- source_word: מְזִמָּה
  choice: layunin
  rationale: Maaaring mangahulugan ang salita ng balak, plano, o layunin. Ang “layunin” ay angkop sa konteksto at iniiwasan ang posibleng negatibong pahiwatig ng ibang salita, habang kinikilala sa talababa ang lehitimong alternatibong “balak.”
theological_decisions:
- issue: Pagpapahayag sa kakayahan ng Diyos at sa hindi mapipigilang intensiyon niya
  choice: Alam kong kaya mong gawin ang lahat, at walang anumang layunin mo ang mapipigilan.
  alternative: Alam kong kaya mong gawin ang lahat, at walang anumang balak mo ang mahahadlangan.
  rationale: Tuwirang pinagtitibay ng Hebreo ang ganap na kakayahan ng Diyos at ang hindi mahahadlangang intensiyon niya, nang hindi nagdaragdag ng sistematikong paliwanag tungkol sa omnipotensiya. Pinananatili ng salin ang bigat ng pahayag at ang saklaw ng “lahat.”
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang “kaya mong gawin” at “mapipigilan” bilang likas na pananalita, habang pinanatili sa talababa ang leksikal na lawak ng ikalawang sugnay.
