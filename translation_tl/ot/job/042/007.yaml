source:
  edition: WLC
  text: וַ/יְהִ֗י אַחַ֨ר דִּבֶּ֧ר יְהוָ֛ה אֶת הַ/דְּבָרִ֥ים הָ/אֵ֖לֶּה אֶל אִיּ֑וֹב וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל אֱלִיפַ֣ז הַ/תֵּֽימָנִ֗י חָרָ֨ה אַפִּ֤/י בְ/ךָ֙ וּ/בִ/שְׁנֵ֣י רֵעֶ֔י/ךָ כִּ֠י לֹ֣א דִבַּרְתֶּ֥ם אֵלַ֛/י נְכוֹנָ֖ה כְּ/עַבְדִּ֥/י אִיּֽוֹב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/042/007.yaml
  text: And it happened[a], after Yahweh had spoken these words to Job, that Yahweh said to Eliphaz the Temanite, “My anger burns against you and against your two friends, because you have not spoken rightly of me, as my servant Job has.”
translation:
  language: tl
  text: Matapos sabihin ni Yahweh ang mga salitang ito kay Job, sinabi ni Yahweh kay Elifaz na taga-Teman, “Nag-aalab ang galit ko laban sa iyo at sa dalawa mong kaibigan, sapagkat hindi kayo nagsalita nang tama tungkol sa akin[a], tulad ng ginawa ng lingkod kong si Job.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “hindi kayo nagsalita sa akin ng tama, tulad ng ginawa ng lingkod kong si Job.” Literal na “sa akin” ang pang-ukol sa Hebreo, ngunit sa konteksto ay malamang na nangangahulugang “tungkol sa akin” o “hinggil sa akin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי אַחַר
  choice: At nangyari, matapos
  rationale: Pinananatili ang Hebreong panandang pasalaysay at pagkakasunod ng mga pangyayari, ngunit gumagamit ng malinaw at marangal na likas na Tagalog.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat ang banal na pangalan sa halip na palitan ito ng isang titulo.
- source_word: דִּבֶּר ... אֶת־הַדְּבָרִים הָאֵלֶּה
  choice: sabihin ... ang mga salitang ito
  rationale: Ang “mga salitang ito” ay malapit sa kongkretong anyo ng דְּבָרִים at natural sa Tagalog; ipinahihiwatig na ng “matapos” ang naunang pagkaganap.
- source_word: אֱלִיפַז הַתֵּימָנִי
  choice: Elifaz na Temanita
  rationale: Karaniwang anyong Filipino ng pangalan at katawagang tumutukoy sa pinagmulan niya.
- source_word: חָרָה אַפִּי
  choice: Nag-aalab ang galit ko
  rationale: Pinananatili ang matingkad na talinghaga ng Hebreo na ang galit ay nag-aalab, sa natural na modernong Tagalog.
- source_word: בְךָ וּבִשְׁנֵי רֵעֶיךָ
  choice: sa iyo at sa dalawa mong kaibigan
  rationale: Sa konteksto ng galit, malinaw na ang mga taong ito ang pinatutungkulan; iniiwasan ang mabigat na pag-uulit nang hindi nawawala ang kahulugan.
- source_word: לֹא דִבַּרְתֶּם
  choice: hindi kayo nagsalita
  rationale: Likas na Tagalog para sa natapos na pagsasalita na ngayo'y sinusuri ng Diyos.
- source_word: אֵלַי
  choice: tungkol sa akin
  rationale: Bagaman literal na “sa akin,” mas malamang sa konteksto na tumutukoy ito sa nilalaman ng kanilang sinabi hinggil sa Diyos.
- source_word: נְכוֹנָה
  choice: nang tama
  rationale: Pinananatili ang lawak ng kahulugang tama, wasto, o nararapat nang hindi ito nililimitahan sa katumpakang pangkaalaman lamang.
- source_word: כְּעַבְדִּי אִיּוֹב
  choice: gaya ng lingkod kong si Job
  rationale: Pinananatili ang paghahambing at ang mahalagang katawagang “lingkod ko,” sa natural na ayos ng Tagalog.
theological_decisions:
- issue: Kung ang אֵלַי ay dapat unawaing literal na “sa akin” o ayon sa konteksto na “tungkol sa akin”
  choice: tungkol sa akin
  alternative: sa akin
  rationale: Sinusuri ng talata ang nilalaman ng mga sinabi ng mga kaibigan sa mga talakayan tungkol sa Diyos. Gayunman, inilalagay sa talababa ang literal na posibilidad upang mapanatili ang tunay na kalabuan ng Hebreo.
- issue: Saklaw ng נְכוֹנָה sa paghatol ng Diyos sa kanilang pananalita
  choice: nang tama
  alternative: kung ano ang tama
  rationale: Ang “nang tama” ay hindi nagpapasya kung ang tinutukoy ay katumpakang pangkaalaman, moral na pagiging matuwid, pagiging nararapat, o pagsasama ng mga ito, kaya nananatili ang tensiyong teolohikal.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Pinanatili ang pangalang Yahweh, ang talinghagang “nag-aalab ang galit,” at ang kalabuan ng אֵלַי sa pamamagitan ng talababa.
