revisions:
- from: At nangyari, matapos sabihin ni Yahweh ang mga salitang ito kay Job, sinabi ni Yahweh kay Elifaz na Temanita, “Nag-aalab ang galit ko sa iyo at sa dalawa mong kaibigan, sapagkat hindi kayo nagsalita nang tama tungkol sa akin[a], gaya ng lingkod kong si Job.”
  to: Matapos sabihin ni Yahweh ang mga salitang ito kay Job, sinabi ni Yahweh kay Elifaz na taga-Teman, “Nag-aalab ang galit ko laban sa iyo at sa dalawa mong kaibigan, sapagkat hindi kayo nagsalita nang tama tungkol sa akin[a], tulad ng ginawa ng lingkod kong si Job.”
  rationale: Inayos ang panimulang ayos upang maging natural na modernong Filipino, nilinaw ang direksiyon ng galit sa pamamagitan ng “laban sa,” ginawang mas karaniwan at malinaw ang katawagang pangheograpiya na “taga-Teman,” at tahasang ipinakita ang pandiwang ipinahihiwatig sa paghahambing kay Job. Pinanatili ng talababa ang literal na posibilidad ng אֵלַי na “sa akin.”
