lexical_decisions:
- source_word: וַיָּמָת
  choice: At namatay
  rationale: Isinasalaysay ng wayyiqtol ng מות ang sumunod na pangyayari. Likas sa Tagalog ang “At namatay” at pinananatili nito ang payak na pagkakasunod-sunod ng salaysay.
- source_word: אִיּוֹב
  choice: Job
  rationale: Ginamit ang nakaugaliang anyo ng pangalang ito sa mga Bibliyang Tagalog.
- source_word: זָקֵן
  choice: matanda na
  rationale: Tuwirang ipinahahayag ng pang-uri ang katandaan ni Job; natural at malinaw sa modernong Tagalog ang “matanda na.”
- source_word: וּשְׂבַע יָמִים
  choice: at puspos sa mga araw
  rationale: Pinananatili nito ang larawan ng idyomang Hebreo tungkol sa isang ganap at mahabang buhay, sa halip na ganap itong ipaliwanag sa pangunahing teksto.
