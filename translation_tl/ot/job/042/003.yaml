  text: מִ֤י זֶ֨ה מַעְלִ֥ים עֵצָ֗ה בְּֽלִ֫י דָ֥עַת לָ/כֵ֣ן הִ֭גַּדְתִּי וְ/לֹ֣א אָבִ֑ין נִפְלָא֥וֹת מִ֝מֶּ֗/נִּי וְ/לֹ֣א אֵדָֽע׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/042/003.yaml
  text: ‘Who is this who hides counsel without knowledge?’ Therefore I have spoken, but I did not understand—things too wonderful for me[b][a], which I did not know.
translation:
  language: tl
  text: “Sino itong nagkukubli ng panukala nang walang kaalaman?” Kaya nagsalita ako, ngunit hindi ko naunawaan ang mga bagay na lubhang kamangha-mangha at higit sa aking pagkaunawa[b]—mga bagay na hindi ko alam.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, ayon sa mas tradisyonal na salin, “Sino itong nagpapadilim sa panukala nang walang kaalaman?” Naiiba ang pananalita ni Job sa Hebreo rito kaysa sa Job 38:2.
    reason: lexical_alternative
  - marker: b
    text: O “mga bagay na lampas sa akin” o “mga kababalaghang lampas sa akin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי זֶה
  choice: Sino itong
  rationale: Pinananatili ang tuwirang tanong at likas itong pakinggan sa makabagong Tagalog.
- source_word: מַעְלִים
  choice: nagkukubli
  rationale: Ang Hifil ng עלם ay tumutukoy sa pagkukubli o pagtatago; sinusunod nito ang mismong salita sa 42:3 sa halip na iayon sa naiibang pandiwa sa 38:2.
- source_word: עֵצָה
  choice: panukala
  rationale: Saklaw nito ang payo, balak, o pasiya na bunga ng karunungan, at angkop sa konteksto ng banal na layunin.
- source_word: בְּלִי דָעַת
  choice: nang walang kaalaman
  rationale: Malapit na katumbas ng pariralang Hebreo at pinananatili ang diin sa kakulangan ng kaalaman.
- source_word: לָכֵן
  choice: Kaya
  rationale: Natural na naghahayag sa Tagalog ng lohikal na bunga ng naunang pagsaway.
- source_word: הִגַּדְתִּי
  choice: nagsalita ako
  rationale: Sa konteksto, inaamin ni Job ang dati niyang pagsasalita; simple at hindi labis ang lakas ng salitang ito.
- source_word: וְלֹא אָבִין
  choice: ngunit hindi ako nakaunawa
  rationale: 'Ipinakikita ng “ngunit” ang likas na salungatan: nagsalita si Job gayong hindi niya nauunawaan.'
- source_word: נִפְלָאוֹת
  choice: mga bagay na lubhang kamangha-mangha
  rationale: Ipinahihiwatig kapwa ang pambihirang katangian ng mga bagay at ang paglagpas ng mga ito sa pagkaunawa ni Job.
- source_word: מִמֶּנִּי
  choice: para sa akin
  rationale: Kasama ng “lubhang kamangha-mangha,” likas nitong ipinahihiwatig na ang mga bagay ay lampas sa kakayahan ni Job; inilalagay sa talababa ang mas tahasang alternatibo.
- source_word: וְלֹא אֵדָע
  choice: na hindi ko nalalaman
  rationale: Ang pang-ugnay na “na” ay natural na nag-uugnay sa hulíng sugnay sa tinutukoy na mga bagay nang hindi binabago ang kahulugan.
theological_decisions:
- issue: Ugnayan ng Job 42:3 sa pagsasalita ng Diyos sa Job 38:2
  choice: Isinalin ang aktuwal na pandiwa sa 42:3 bilang “nagkukubli,”
  alternative: “nagpapadilim” sa panukala nang walang kaalaman
  rationale: Bagaman inuulit o inaangkop ni Job ang naunang pagsaway, magkaiba ang pandiwang Hebreo sa 42:3 at 38:2. Hindi dapat pagtugmain nang sapilitan ang dalawang talata.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog. Ginamit ang “panukala” sa malawak na diwang payo o balak, at pinanatili ang pag-amin ni Job nang hindi nilulutas ang posibleng sintaktikong tensiyon. Ang mga marker [a] at [b] ay kapwa nasa pangunahing teksto.
