  source_fidelity: Ang “nagkukubli” ay wastong tumutugon sa Hifil ng עלם sa Job 42:3 at hindi ito dapat iayon sa “nagpapadilim” ng Job 38:2. Gayunman, ang “mga bagay na lubhang kamangha-mangha para sa akin” ay karaniwang nangangahulugang mga bagay na kahanga-hanga sa paningin ni Job, hindi mga bagay na lampas sa kaniyang kakayahang unawain. Nililinaw ng rebisyon ang idyomatikong diwa ng מִמֶּנִּי nang hindi binabago ang saklaw ng pahayag.
  naturalness: Mas natural at malinaw sa modernong Filipino ang “mga bagay na lubhang kamangha-mangha at higit sa aking pagkaunawa” kaysa “kamangha-mangha para sa akin.” Ang “hindi ko alam” ay mas likas sa kontekstong pagbabalik-tanaw kaysa “hindi ko nalalaman.”
  terminology: Ang “panukala” ay katanggap-tanggap para sa עֵצָה sa kontekstong ito. Pinananatili ang marangal ngunit modernong rehistro, pati ang maingat na pagkakaiba ng “nagkukubli” mula sa tradisyonal na “nagpapadilim.”
