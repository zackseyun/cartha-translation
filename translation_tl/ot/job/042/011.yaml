id: JOB.42.11
reference: Job 42:11
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יָּבֹ֣אוּ אֵ֠לָי/ו כָּל אֶחָ֨י/ו וְ/כָל אחיתי/ו וְ/כָל יֹדְעָ֣י/ו לְ/פָנִ֗ים וַ/יֹּאכְל֨וּ עִמּ֣/וֹ לֶחֶם֮ בְּ/בֵית/וֹ֒ וַ/יָּנֻ֤דוּ ל/וֹ֙ וַ/יְנַחֲמ֣וּ אֹת֔/וֹ עַ֚ל כָּל הָ֣/רָעָ֔ה אֲשֶׁר הֵבִ֥יא יְהוָ֖ה עָלָ֑י/ו וַ/יִּתְּנוּ ל֗/וֹ אִ֚ישׁ קְשִׂיטָ֣ה אֶחָ֔ת וְ/אִ֕ישׁ נֶ֥זֶם זָהָ֖ב אֶחָֽד־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/job/042/011.yaml
  text: Then all his brothers[a], all his sisters, and all who had known him before came to him, and they ate bread with him in his house. They showed him sympathy and comforted him for all the calamity that Yahweh had brought upon him[d][c][b]. And each one gave him one qesitah and one gold ring.
translation:
  language: tl
  text: Pagkatapos, pumunta sa kanya ang lahat ng kapatid niyang lalaki, ang lahat ng kapatid niyang babae, at ang lahat ng dati niyang kakilala. Nagsalo-salo sila sa pagkain sa bahay niya. Nakiramay sila sa kanya at inaliw siya dahil sa lahat ng kapahamakang pinasapit sa kanya ni Yahweh. Bawat isa ay nagbigay sa kanya ng isang kesita[a] at isang gintong singsing[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang kesita ay isang sinaunang bagay o yunit na may halaga; hindi tiyak ang eksaktong katumbas nito.
    reason: cultural_note
  - marker: b
    text: Maaari ring “isang gintong singsing sa ilong” o “isang gintong hikaw”; maaaring tumukoy ang salitang Hebreo sa singsing na isinusuot sa ilong o tainga.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל אֶחָיו וְכָל אֲחִיתָיו
  choice: ang lahat ng kapatid niyang lalaki, ang lahat ng kapatid niyang babae
  rationale: Pinananatili ang magkahiwalay na pagbanggit at pag-uulit ng כָּל sa Hebreo, habang gumagamit ng likas na modernong Tagalog.
- source_word: וְכָל יֹדְעָיו לְפָנִים
  choice: at ang lahat ng dati niyang kakilala
  rationale: Ang יֹדְעָיו ay mga taong nakakakilala sa kanya, at ang לְפָנִים ay tumutukoy sa naunang panahon. Ang 'dati niyang kakilala' ay maikli at natural sa Tagalog.
- source_word: וַיֹּאכְלוּ עִמּוֹ לֶחֶם בְּבֵיתוֹ
  choice: Nagsalo-salo sila sa pagkain sa bahay niya
  rationale: Ang literal na 'kumain ng tinapay' ay karaniwang Hebreong pahayag para sa sama-samang pagkain. Inililipat ng salin ang diwa ng pakikisalo at pakikipag-ugnayan nang hindi nagmumukhang tinapay lamang ang kinain.
- source_word: וַיָּנֻדוּ לוֹ
  choice: Nakiramay sila sa kanya
  rationale: Sa kontekstong ito, ang נוד ay pagpapakita ng pakikiramay sa nagdurusa, hindi mapanuyang pag-iling ng ulo.
- source_word: וַיְנַחֲמוּ אֹתוֹ
  choice: at inaliw siya
  rationale: Ipinahahayag ng נחם dito ang pag-aliw o pagdamay sa isang nagdurusa. Natural at malinaw ang 'inaliw' sa modernong Tagalog.
- source_word: עַל כָּל הָרָעָה
  choice: dahil sa lahat ng kapahamakan
  rationale: Ang רָעָה rito ay sakuna o matinding kasawiang naranasan, hindi moral na kasamaan. Ang 'kapahamakan' ay angkop sa konteksto.
- source_word: אֲשֶׁר הֵבִיא יְהוָה עָלָיו
  choice: na pinasapit sa kanya ni Yahweh
  rationale: Malinaw na iniuugnay ng Hebreo kay Yahweh ang pagpapasapit ng kapahamakan. Ang 'pinasapit' ay natural sa Tagalog at hindi pinapahina bilang pahintulot lamang.
- source_word: קְשִׂיטָה
  choice: kesita
  rationale: Hindi tiyak ang eksaktong anyo at katumbas na halaga ng sinaunang bagay o yunit na ito, kaya pinanatili ang transliterasyon at ipinaliwanag sa talababa.
- source_word: נֶזֶם זָהָב
  choice: gintong singsing
  rationale: Maaaring tumukoy ang נֶזֶם sa palamuting singsing na isinusuot sa ilong o tainga. Pinananatili ng pangkalahatang 'singsing' ang ambiguwidad, na nililinaw sa talababa.
theological_decisions:
- issue: Ang pagkilos ni Yahweh sa pagdurusa ni Job
  choice: lahat ng kapahamakang pinasapit sa kanya ni Yahweh
  alternative: lahat ng kapahamakang pinahintulutan ni Yahweh na sapitin niya
  rationale: Tahasang ginagamit ng Hebreo ang causative na הֵבִיא at iniuugnay kay Yahweh ang pagpapasapit ng kapahamakan. Pinananatili ng salin ang teolohikal na tensiyon sa halip na gawing pahintulot lamang ang pagkilos niya.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa salaysay. Ginamit ang 'Yahweh' para sa banal na pangalang יהוה. Ang idyomang 'kumain ng tinapay' ay isinaling ayon sa likas na kahulugang pakikisalo sa pagkain, samantalang pinanatili sa transliterasyon ang hindi tiyak na 'kesita'.
