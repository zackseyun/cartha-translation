  source_fidelity: Tumpak na naipapahayag ng salin ang pagdating ng mga kapatid at dating kakilala ni Job, ang kanilang pakikisalo sa kanyang bahay, pakikiramay at pag-aliw, ang hayag na pag-uugnay kay Yahweh ng kapahamakan, at ang dalawang regalong ibinigay ng bawat isa. Napananatili ang di-tiyak na kahulugan ng קְשִׂיטָה at נֶזֶם.
