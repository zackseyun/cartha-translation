  to: Pagkatapos nito, nabuhay pa si Job nang isandaan at apatnapung taon, at nakita niya ang kanyang mga anak na lalaki at mga apo niyang lalaki—apat na salinlahi.[a]
  rationale: Pinalitan ang malabong “mga anak ng mga ito” ng “mga apo niyang lalaki,” na natural sa modernong Filipino at malinaw na pinananatili ang panlalaking saklaw ng Hebreong parirala. Pinanatili ang “apat na salinlahi” nang walang dagdag na pang-ukol o pagpapaliwanag upang hindi lutasin ang bukas na pagkakaugnay at pagbibilang sa pinagmulan.
