base_translation:
  language: en
  yaml_path: translation/ot/job/042/016.yaml
  text: After this[a], Job lived one hundred and forty years, and saw his sons and his grandsons, four generations.
translation:
  language: tl
  text: Pagkatapos nito, nabuhay pa si Job nang isandaan at apatnapung taon, at nakita niya ang kanyang mga anak na lalaki at mga apo niyang lalaki—apat na salinlahi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaaring idiomatikong isalin: “Nabuhay si Job upang makita ang kanyang mga anak na lalaki at mga apo niyang lalaki.” Mas literal sa Hebreo: “nakita niya ang kanyang mga anak na lalaki at ang mga anak na lalaki ng kanyang mga anak na lalaki—apat na salinlahi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחִי
  choice: nabuhay pa
  rationale: Ipinahihiwatig ng anyong pasalaysay na nagpatuloy ang buhay ni Job matapos ang naunang mga pangyayari; likas sa Tagalog ang “nabuhay pa” sa kontekstong ito.
- source_word: אַחֲרֵי זֹאת
  choice: Pagkatapos nito
  rationale: Tuwirang tumutukoy sa panahong kasunod ng mga naunang pangyayari at natural sa makabagong Tagalog.
- source_word: מֵאָה וְאַרְבָּעִים שָׁנָה
  choice: isandaan at apatnapung taon
  rationale: Tuwiran at malinaw na salin ng bilang.
- source_word: וַיַּרְא
  choice: Nakita niya
  rationale: Pinananatili ang payak na kahulugan ng ראה na “makita,” sa halip na gawing tahasan ang ipinahihiwatig na “nabuhay upang makita.”
- source_word: בָּנָיו
  choice: kanyang mga anak na lalaki
  rationale: Pinananatili ang panlalaking anyo ng Hebreo sa halip na gamitin ang mas pangkalahatang “mga anak.”
- source_word: בְּנֵי בָנָיו
  choice: mga anak ng mga ito
  rationale: Natural sa Tagalog at pinananatili ang ugnayang literal na mga anak ng kanyang mga anak na lalaki, nang hindi ipagpalagay ang kasarian ng ikalawang pangkat nang higit sa hinihingi ng konstruksiyong Hebreo.
- source_word: אַרְבָּעָה דֹּרוֹת
  choice: apat na salinlahi
  rationale: Ang “salinlahi” ay dignified ngunit madaling maunawaang katumbas ng “generation”; pinananatili ang maikli at bahagyang bukas na pagkakaugnay nito sa naunang parirala.
theological_decisions:
- issue: Kung kabilang si Job sa bilang na apat na salinlahi
  choice: Hindi tahasang nilinaw sa pangunahing teksto; pinanatili ang “apat na salinlahi.”
  alternative: “hanggang sa ikaapat na salinlahi” o isang paliwanag kung kasama si Job sa bilang
  rationale: Maikli at walang tahasang pang-ukol ang Hebreong אַרְבָּעָה דֹּרוֹת, kaya hindi dapat tahimik na lutasin ang eksaktong paraan ng pagbibilang.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “nabuhay pa” bilang natural na pagsasalaysay, ngunit pinanatili ang literal na “nakita niya” upang hindi gawing tahasan sa pangunahing teksto ang ipinahihiwatig lamang ng konteksto. Ang footnote marker [a] ay inilagay sa pangunahing teksto.
