  terminology: Ang “Yahweh,” “Job,” “manalangin,” at “mga kaibigan” ay angkop at pare-pareho. Ang “dating kalagayan” ay natural na Tagalog para sa Hebreong idyoma at hindi ito nag-aangkin ng literal na pagkabihag.
