  text: And Yahweh restored Job’s fortunes when he prayed for his friends[c][b][a], and Yahweh gave Job twice as much as he had before.
translation:
  language: tl
  text: At ibinalik ni Yahweh ang dating kalagayan ni Job[a] nang manalangin siya para sa kanyang mga kaibigan[b], at binigyan ni Yahweh si Job ng dalawang ulit ng lahat ng dati niyang pag-aari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pinanumbalik ni Yahweh ang kalagayan ni Job.” Ang idyomang Hebreo ay hindi kinakailangang tumukoy sa paglaya mula sa literal na pagkabihag.
    reason: lexical_alternative
  - marker: b
    text: O “alang-alang sa kanyang mga kaibigan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos na nasa tekstong Hebreo.
- source_word: שָׁב אֶת שבית אִיּוֹב
  choice: ibinalik ... ang mabuting kalagayan ni Job
  rationale: Ang idyoma ay tumutukoy sa pagbabalik o pagpapanumbalik ng kalagayan ng isang tao, hindi kinakailangang paglaya mula sa literal na pagkabihag.
- source_word: בְּהִתְפַּלְלוֹ
  choice: nang manalangin siya
  rationale: Ang ב na may infinitive construct ay natural na nagpapahayag dito ng panahong kasabay ng pangyayari, nang hindi ipinipilit na tuwirang sanhi ang panalangin.
- source_word: בְּעַד רֵעֵהוּ
  choice: para sa kanyang mga kaibigan
  rationale: Ipinahahayag ng בְּעַד ang pananalangin alang-alang sa iba; sa konteksto, ang kolektibong רֵעֵהוּ ay tumutukoy sa mga kaibigan ni Job.
- source_word: וַיֹּסֶף ... לְמִשְׁנֶה
  choice: dinoble
  rationale: Magkasamang ipinahahayag ng pandiwang 'nagdagdag' at ng לְמִשְׁנֶה na ang ibinigay kay Job ay naging dalawang ulit ng dati niyang taglay.
- source_word: אֶת כָּל אֲשֶׁר לְאִיּוֹב
  choice: ang lahat ng dating pag-aari ni Job
  rationale: Tumutukoy ito sa kabuuan ng dating pag-aari ni Job bago ang kanyang mga pagkawala.
theological_decisions:
- issue: Ugnayan ng panalangin ni Job at ng pagpapanumbalik ni Yahweh
  choice: 'Pansamantalang ugnayan: “nang manalangin siya”'
  alternative: 'Sanhing ugnayan: “dahil nanalangin siya”'
  rationale: Maaaring magpahiwatig ng panahon o kalagayan ang Hebreong konstruksyon. Malinaw na magkaugnay ang pananalangin at pagpapanumbalik, ngunit hindi dapat gawing mas tahasang sanhi ang panalangin kaysa sa sinasabi ng teksto.
translation_notes:
  register: Makabagong Filipino na marangal at madaling maunawaan. Ginamit ang “mabuting kalagayan” upang maging natural ang Hebreong idyoma, at “dinoble” upang malinaw at maikli ang huling sugnay.
