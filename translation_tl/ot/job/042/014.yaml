  yaml_path: translation/ot/job/042/014.yaml
  text: He named the first Jemimah[a], the second Keziah, and the third Keren-happuch.
translation:
  language: tl
  text: Tinawag niyang Yemima ang una, Ketsia ang ikalawa, at Keren-hapuk ang ikatlo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Keren-hapuk ay malamang na nangangahulugang “sungay ng antimonyo” o “sungay ng pampaganda sa mata.” Maaaring tumukoy ang “sungay” sa isang sisidlan ng kosmetiko, at ang huling salita naman ay sa mismong sangkap na pampaganda.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא שֵׁם
  choice: Tinawag niyang
  rationale: Ang pariralang Hebreo ay karaniwang gamit sa pagbibigay ng pangalan. Likas sa modernong Filipino ang “tinawag niyang,” at malinaw sa konteksto na si Job ang paksa.
- source_word: הָאַחַת ... הַשֵּׁנִית ... הַשְּׁלִישִׁית
  choice: ang una ... ang ikalawa ... ang ikatlo
  rationale: Inilalarawan ng mga anyong pambabae ang sunod-sunod na tatlong anak na babae. Pinananatili ng salin ang payak na pagkakasunod ng Hebreo.
- source_word: יְמִימָה
  choice: Yemima
  rationale: Tuwirang transliterasyon ng pangalang Hebreo gamit ang likas na baybay sa Filipino; ang unang yod ay kinakatawan ng Y.
- source_word: קְצִיעָה
  choice: Ketsia
  rationale: Transliterasyon ng personal na pangalan; ang צ ay kinakatawan ng “ts,” na mas malapit sa tunog ng Hebreo kaysa sa anyong Ingles na Keziah.
- source_word: קֶרֶן הַפּוּךְ
  choice: Keren-hapuk
  rationale: Transliterasyon ng tambalang personal na pangalan. Pinananatili ang gitling upang makita ang tambalang anyo, habang inilalagay sa talababa ang malamang na kahulugan nito.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na payak ngunit marangal. Ginamit ang mga transliterasyong nakabatay sa Hebreo sa halip na basta sundin ang tradisyunal na baybay sa Ingles. Inilipat ang talababa sa Keren-hapuk, ang pangalang aktuwal na ipinaliliwanag nito.
