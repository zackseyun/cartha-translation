  text: וַ/יֵּלְכוּ֩ אֱלִיפַ֨ז הַ/תֵּֽימָנִ֜י וּ/בִלְדַּ֣ד הַ/שּׁוּחִ֗י צֹפַר֙ הַ/נַּ֣עֲמָתִ֔י וַֽ/יַּעֲשׂ֔וּ כַּ/אֲשֶׁ֛ר דִּבֶּ֥ר אֲלֵי/הֶ֖ם יְהוָ֑ה וַ/יִּשָּׂ֥א יְהוָ֖ה אֶת פְּנֵ֥י אִיּֽוֹב־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/042/009.yaml
  text: So Eliphaz the Temanite[a], Bildad the Shuhite, and Zophar the Naamathite went and did as Yahweh had spoken to them, and Yahweh accepted Job.
translation:
  language: tl
  text: Kaya, nagpunta sina Elifaz na Temanita, Bildad na Suhita, at Zofar na Naamatita, at ginawa nila ayon sa sinabi ni Yahweh sa kanila. Tinanggap naman ni Yahweh si Job.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “itinaas ni Yahweh ang mukha ni Job,” isang idyomang nangangahulugang pinaboran o tinanggap niya si Job.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: pumunta
  rationale: Isinasalaysay ng wayyiqtol ng הלך ang sumunod na pangyayari; ang “pumunta” ang natural at tuwirang katumbas sa konteksto.
- source_word: הַתֵּימָנִי / הַשּׁוּחִי / הַנַּעֲמָתִי
  choice: na Temanita / na Suhita / na Naamatita
  rationale: Mga gentiliko ang mga ito na tumutukoy sa lugar o angkan ng bawat lalaki. Pinananatili ng mga anyong Tagalog na ito ang katangian ng mga pangalan habang madaling basahin.
- source_word: וַיַּעֲשׂוּ
  choice: ginawa nila
  rationale: Malawak ang kahulugan ng עשה at kasama ng כַּאֲשֶׁר ay nangangahulugang ginawa nila ang iniutos o sinabi; hindi na dinaragdagan ng mas tiyak na kilos ang teksto.
- source_word: כַּאֲשֶׁר דִּבֶּר אֲלֵיהֶם
  choice: ang sinabi sa kanila
  rationale: Natural na ipinahahayag sa modernong Tagalog ang pagtupad nila sa naunang sinabi ni Yahweh nang hindi nawawala ang pagtukoy sa naunang utos.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin ang Tetragrammaton bilang personal na pangalang “Yahweh,” sa halip na palitan ito ng isang titulo.
- source_word: וַיִּשָּׂא ... אֶת־פְּנֵי אִיּוֹב
  choice: Tinanggap naman ni Yahweh si Job
  rationale: Ang idyomang נשׂא פנים ay nagsasaad ng pagpapakita ng pabor o pagtanggap. Malinaw at natural sa Tagalog ang “tinanggap,” habang inilalagay sa talababa ang literal na larawan.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Tuwirang ginagamit ng talata ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng titulo.
- issue: Idyoma ng pabor ng Diyos kay Job
  choice: Tinanggap naman ni Yahweh si Job
  alternative: Pinaboran ni Yahweh si Job; itinaas ni Yahweh ang mukha ni Job
  rationale: Ipinahihiwatig ng idyoma ang mabuting pagtanggap kay Job, lalo na kaugnay ng kanyang pananalangin para sa mga kaibigan. Hindi nito dinaragdagan ang teksto ng isang mas tiyak na paliwanag na teolohikal.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “sina” para sa likas na pagpapakilala sa tatlong taong pinangalanan. Ang “naman” ay banayad na nag-uugnay sa pagtupad ng mga kaibigan at sa tugon ni Yahweh nang hindi nagdaragdag ng sanhi na wala sa Hebreo. Inilipat ang marker [a] sa pariralang tinatalakay ng talababa.
