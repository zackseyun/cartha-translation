  text: שְֽׁמַֽע נָ֭א וְ/אָנֹכִ֣י אֲדַבֵּ֑ר אֶ֝שְׁאָלְ/ךָ֗ וְ/הוֹדִיעֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/042/004.yaml
  text: Hear[a], please, and I will speak; I will ask you[b], and you declare to me.
translation:
  language: tl
  text: “Makinig ka[a], pakiusap, at magsasalita ako; tatanungin kita[b], at ipaalam mo sa akin.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Halos salita-sa-salitang inuulit dito ni Job ang naunang sinabi ng PANGINOON sa Job 38:3 at 40:7.
    reason: cross_reference
  - marker: b
    text: O “magtatanong ako sa iyo”; ang kasunod ay literal na “at gawin mong malaman ko.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁמַע
  choice: Makinig ka
  rationale: Tuwirang pautos na natural sa modernong Filipino. Mas angkop dito ang “makinig” kaysa “dinggin,” sapagkat malinaw nitong ipinahahayag ang hinihinging pagbibigay-pansin habang nananatiling marangal ang himig.
- source_word: נָא
  choice: pakiusap
  rationale: Ipinahahayag ang pakiusap o magalang na paghiling ng partikula nang hindi gumagamit ng makaluma o nakalilitong katumbas.
- source_word: וְאָנֹכִי אֲדַבֵּר
  choice: at magsasalita ako
  rationale: Pinananatili ang payak na pag-uugnay at ang tahasang panghalip na nagbibigay-diin sa nagsasalita.
- source_word: אֶשְׁאָלְךָ
  choice: tatanungin kita
  rationale: Tuwirang katumbas ng pandiwang שאל na may panlaping tumutukoy sa ikalawang panauhang panlalaki; hindi nito pinalalakas ang diwa tungo sa mas mapanuring “uusisain.”
- source_word: וְהוֹדִיעֵנִי
  choice: at ipaalam mo sa akin
  rationale: Pinananatili ang pautos at sanhiang diwa ng Hiphil ng ידע, “gawin mong malaman ko,” sa natural na Filipino. Hindi ito nilimitahan sa “sagutin mo ako,” na mas interpretatibo.
theological_decisions:
- issue: Ugnayan ng talata sa Job 38:3 at 40:7
  choice: Isinalin bilang tuwirang pag-ulit ni Job sa naunang mga salita ng PANGINOON, nang walang idinagdag na “Sinabi mo.”
  alternative: Lagyan ng tahasang panandang sipi o pambungad na “Sinabi mo.”
  rationale: Halos inuulit ng Hebreo ang naunang hamon ng PANGINOON. Pinananatili ng salin ang alusyong ito nang hindi nagdaragdag ng mga salitang wala sa teksto; ipinaliliwanag ito sa talababa.
- issue: Saklaw ng וְהוֹדִיעֵנִי
  choice: “at ipaalam mo sa akin”
  alternative: “at sagutin mo ako” o “at ipahayag mo sa akin”
  rationale: Ang piniling anyo ay nagpapanatili sa sanhiang diwa na “gawin mong malaman ko” at hindi nagpapasya na ang hinihingi ay sagot lamang.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “Makinig ka, pakiusap” upang mapanatili kapuwa ang tuwirang pautos at ang magalang na נָא. Ang mga panandang [a] at [b] ay nasa pangunahing teksto at tumutugma sa mga talababa.
