  text: Then Job answered Yahweh and said:[a]
translation:
  language: tl
  text: Pagkatapos, sumagot si Job kay Yahweh at sinabi:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: “YHWH”; tradisyonal na isinasaling “ang PANGINOON.” Kabilang sa ibang anyo ang “Yahweh” at “Jehovah.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַן
  choice: sumagot
  rationale: Ang pandiwang ענה sa pormulang pasalaysay na ito ay nangangahulugang “sumagot” o “tumugon.” Pinananatili ng “sumagot” ang anyo ng pag-uusap kahit walang tuwirang tanong kaagad bago nito.
- source_word: אִיּוֹב
  choice: Job
  rationale: Ito ang kinikilalang anyo sa Filipino ng pangalang אִיּוֹב.
- source_word: אֶת
  choice: '[hindi isinalin]'
  rationale: Tanda ito ng tiyak na tuwirang layon sa Hebreo at walang hiwalay na katumbas sa Filipino.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasatitik nito ang personal na banal na pangalan sa halip na palitan iyon ng isang titulo.
- source_word: וַיֹּאמַר
  choice: at sinabi
  rationale: Karaniwang pormulang Hebreo ito sa pagpapatuloy ng salaysay; natural at malinaw sa Filipino ang “at sinabi.”
- source_word: וַ
  choice: Pagkatapos
  rationale: Ipinagpapatuloy ng panimulang waw-consecutive ang sunod-sunod na salaysay; malinaw na ipinahihiwatig ng “Pagkatapos” ang pagkakasunod.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: ang PANGINOON; Jehovah
  rationale: Tuwirang ginagamit sa talata ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalan habang itinatala sa talababa ang tradisyonal at iba pang anyo.
translation_notes:
  register: Modernong Filipino na payak ngunit marangal. Ginamit ang “kay Yahweh” sapagkat natural itong pantukoy sa taong pinatutungkulan ng sagot; pinanatili ang pormulang “sumagot … at sinabi” upang masalamin ang Hebreong salaysay.
