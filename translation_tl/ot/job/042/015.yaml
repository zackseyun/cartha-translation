  text: וְ/לֹ֨א נִמְצָ֜א נָשִׁ֥ים יָפ֛וֹת כִּ/בְנ֥וֹת אִיּ֖וֹב בְּ/כָל הָ/אָ֑רֶץ וַ/יִּתֵּ֨ן לָ/הֶ֧ם אֲבִי/הֶ֛ם נַחֲלָ֖ה בְּ/ת֥וֹךְ אֲחֵי/הֶֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/job/042/015.yaml
  text: And nowhere in all the land were women found as beautiful as Job’s daughters[a], and their father gave them an inheritance among their brothers.
translation:
  language: tl
  text: Sa buong lupain ay walang natagpuang mga babaeng kasingganda ng mga anak na babae ni Job[a]. Binigyan sila ng kanilang ama ng mana kasama ng kanilang mga kapatid na lalaki.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “sa buong daigdig.”
    reason: lexical_alternative
lexical_decisions:
- source_word: נִמְצָא
  choice: walang natagpuang
  rationale: Ang pasibong anyo ng מצא ay nagpapahayag na walang natuklasan o makitang gayong mga babae; natural sa modernong Tagalog ang konstruksiyong “walang natagpuang.”
- source_word: נָשִׁים יָפוֹת
  choice: mga babaeng kasingganda
  rationale: Ang נָשִׁים ay “mga babae,” hindi partikular na “mga asawa,” at ang יָפוֹת kasama ng panandang paghahambing na כ ay natural na isinasaling “kasingganda.”
- source_word: כִּבְנוֹת אִיּוֹב
  choice: ng mga anak na babae ni Job
  rationale: Pinananatili ng “kasingganda ng” ang paghahambing na ipinahihiwatig ng prefiks na כ, habang malinaw na tinutukoy ang mga anak na babae ni Job.
- source_word: בְּכָל הָאָרֶץ
  choice: sa buong lupain
  rationale: Maaaring mangahulugan ang הָאָרֶץ ng “lupain” o “daigdig.” Ang “buong lupain” ay angkop sa konteksto ng salaysay at pinananatili ang mariing paghahambing nang hindi kinakailangang ipahiwatig ang buong globo.
- source_word: וַיִּתֵּן לָהֶם
  choice: Binigyan sila
  rationale: Direkta at natural na salin ng נתן na may hulaping tumutukoy sa kanila bilang di-tuwirang layon.
- source_word: נַחֲלָה
  choice: mana
  rationale: Ang נַחֲלָה ay minanang ari-arian o bahagi sa pamana; sapat at malinaw sa Tagalog ang “mana.”
- source_word: בְּתוֹךְ אֲחֵיהֶם
  choice: kasama ng kanilang mga kapatid na lalaki
  rationale: Ang בְּתוֹךְ ay “sa gitna/kasama,” at tahasang panlalaki ang אֲחֵיהֶם. Nililinaw ng “mga kapatid na lalaki” ang kapansin-pansing detalye na tumanggap din ng mana ang mga anak na babae kasama ng mga lalaking tagapagmana.
theological_decisions:
- issue: Tiyak na kasarian ng katawagang pampamilya
  choice: kasama ng kanilang mga kapatid na lalaki
  alternative: kasama ng kanilang mga kapatid
  rationale: Tahasang “mga kapatid na lalaki” ang Hebreong אֲחֵיהֶם. Hindi ito ginawang neutral upang mapanatili ang mahalagang detalye ng salaysay.
- issue: Saklaw ng הָאָרֶץ
  choice: sa buong lupain
  alternative: sa buong daigdig
  rationale: Parehong posible ang “lupain” at “daigdig.” Mas angkop sa idyoma at tagpuan ng salaysay ang “lupain,” ngunit inilalagay sa talababa ang tunay na alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kasingganda” para sa natural na paghahambing at “mga kapatid na lalaki” upang mapanatili ang tiyak na kasarian sa Hebreo.
