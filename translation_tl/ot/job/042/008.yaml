revisions:
- from: Kaya ngayon, kumuha kayo ng pitong toro at pitong lalaking tupa, at pumunta kayo sa lingkod kong si Job. Maghandog kayo ng handog na sinusunog para sa inyong sarili. Ipananalangin kayo ng lingkod kong si Job, sapagkat tatanggapin ko siya[a], upang hindi ko kayo tratuhin ayon sa inyong kahangalan[b]. Sapagkat hindi kayo nagsalita nang tama tungkol sa akin[c], gaya ng lingkod kong si Job.
  to: Kaya ngayon, kumuha kayo ng pitong toro at pitong lalaking tupa, at pumunta kayo sa lingkod kong si Job. Maghandog kayo ng handog na sinusunog para sa inyo. Ipananalangin kayo ng lingkod kong si Job, sapagkat tatanggapin ko siya[a], upang hindi ko kayo gawan ng kahiya-hiyang bagay[b]. Sapagkat hindi kayo nagsalita nang tama tungkol sa akin[c], gaya ng ginawa ng lingkod kong si Job.
  rationale: Pinananatili ng rebisyon ang tahasang “Kaya ngayon” ng וְעַתָּה, ang intersesoryong papel ni Job, at ang natural na modernong Filipino. Itinatama nito ang idinagdag na “ayon sa” sa sugnay tungkol sa נְבָלָה at iniiwan ang semantikong kahirapan nito na nakikita sa pangunahing teksto at talababa, nang hindi nagpapataw ng teolohikal na paglutas. Itinatama rin nito ang literal na paliwanag ng idyomang “itaas ang mukha.”
