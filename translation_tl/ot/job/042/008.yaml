  text: וְ/עַתָּ֡ה קְחֽוּ לָ/כֶ֣ם שִׁבְעָֽה פָרִים֩ וְ/שִׁבְעָ֨ה אֵילִ֜ים וּ/לְכ֣וּ אֶל עַבְדִּ֣/י אִיּ֗וֹב וְ/הַעֲלִיתֶ֤ם עוֹלָה֙ בַּֽעַדְ/כֶ֔ם וְ/אִיּ֣וֹב עַבְדִּ֔/י יִתְפַּלֵּ֖ל עֲלֵי/כֶ֑ם כִּ֧י אִם פָּנָ֣י/ו אֶשָּׂ֗א לְ/בִלְתִּ֞י עֲשׂ֤וֹת עִמָּ/כֶם֙ נְבָלָ֔ה כִּ֠י לֹ֣א דִבַּרְתֶּ֥ם אֵלַ֛/י נְכוֹנָ֖ה כְּ/עַבְדִּ֥/י אִיּֽוֹב־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/042/008.yaml
  text: Take for yourselves seven bulls and seven rams[a], and go to my servant Job, and offer up a burnt offering for yourselves. And my servant Job will pray for you, for I will accept him, so that I may not deal with you disgracefully. For you have not spoken rightly about me[c][b], as my servant Job has.
translation:
  language: tl
  text: Kaya ngayon, kumuha kayo ng pitong toro at pitong lalaking tupa, at pumunta kayo sa lingkod kong si Job. Maghandog kayo ng handog na sinusunog para sa inyo. Ipananalangin kayo ng lingkod kong si Job, sapagkat tatanggapin ko siya[a], upang hindi ko kayo gawan ng kahiya-hiyang bagay[b]. Sapagkat hindi kayo nagsalita nang tama tungkol sa akin[c], gaya ng ginawa ng lingkod kong si Job.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “sapagkat itataas ko ang kanyang mukha,” isang idyomang Hebreo na nangangahulugang “tatanggapin ko siya” o “papakitaan ko siya ng pabor.”
    reason: lexical_alternative
  - marker: b
    text: O “upang hindi ko kayo tratuhin ayon sa inyong kahangalan.” Ang salitang Hebreo ay maaaring tumukoy sa kahangalan, kahiya-hiyang gawa, o napakasamang asal.
    reason: lexical_alternative
  - marker: c
    text: O “hindi kayo nagsalita nang tama sa akin.” Maaaring unawain ang Hebreo bilang “sa akin” o, ayon sa diwa ng konteksto, “tungkol sa akin.”
    reason: alternative_reading
lexical_decisions:
- source_word: וְעַתָּה
  choice: Kaya ngayon
  rationale: May tahasang temporal na עַתָּה, “ngayon,” habang ipinahihiwatig ng וְ ang pag-uugnay nito sa naunang sinabi. Ang “Kaya ngayon” ay natural na panimula ng utos sa Filipino.
- source_word: קְחוּ לָכֶם
  choice: kumuha kayo
  rationale: Ipinahahayag ng pangmaramihang pautos ang pagkuha ng mga hayop; hindi kailangang ulitin ang benepaktibong לָכֶם dahil malinaw ito sa kasunod na “para sa inyong sarili.”
- source_word: שִׁבְעָה פָרִים וְשִׁבְעָה אֵילִים
  choice: pitong toro at pitong lalaking tupa
  rationale: Ang פָּר ay lalaking baka o toro, at ang אַיִל ay lalaking tupa. Tiyak at madaling maunawaan ang mga katumbas na Filipino.
- source_word: עַבְדִּי אִיּוֹב
  choice: lingkod kong si Job
  rationale: Ang עֶבֶד dito ay titulong nagpapahayag ng tapat at marangal na paglilingkod sa Diyos, hindi diin sa pagkaalipin.
- source_word: וְהַעֲלִיתֶם עוֹלָה
  choice: Maghandog kayo ng handog na sinusunog
  rationale: Karaniwang pananalita sa paghahain ang Hiphil ng עלה kasama ng עוֹלָה. Ang “handog na sinusunog” ay malinaw na katawagan sa ritwal nang hindi nagdaragdag ng ideyang wala sa teksto.
- source_word: בַּעַדְכֶם
  choice: para sa inyong sarili
  rationale: Ipinahihiwatig ng pang-ukol ang kapakinabangan o representasyon ng naghahandog sa kontekstong pansakripisyo.
- source_word: יִתְפַּלֵּל עֲלֵיכֶם
  choice: Ipananalangin kayo
  rationale: Tuwirang ipinahahayag ang panalangin ni Job alang-alang sa mga kaibigan; likas at malinaw ito sa modernong Filipino.
- source_word: כִּי אִם פָּנָיו אֶשָּׂא
  choice: sapagkat tatanggapin ko siya
  rationale: Ang literal na “itataas ko ang kanyang mukha” ay idyomang Hebreo para sa pagtanggap o pagpapakita ng pabor. Sa konteksto, tatanggapin ng Diyos si Job bilang nananalangin para sa kanila.
- source_word: לְבִלְתִּי עֲשׂוֹת עִמָּכֶם נְבָלָה
  choice: upang hindi ko kayo tratuhin ayon sa inyong kahangalan
  rationale: Maaaring tumukoy ang נְבָלָה sa kahangalan o kahiya-hiyang kasamaan. Inilalarawan ng salin ang makatarungang pakikitungo sa kanila kaugnay ng kanilang kasalanan nang hindi ipinahihiwatig na gagawa ang Diyos ng imoral na bagay; itinatala sa talababa ang mas literal na alternatibo.
- source_word: לֹא דִבַּרְתֶּם אֵלַי נְכוֹנָה
  choice: hindi kayo nagsalita nang tama tungkol sa akin
  rationale: Literal na maaaring unawain ang אֵלַי bilang “sa akin,” ngunit sa konteksto ay tumutukoy ang pananalita sa Diyos at sa kanyang mga gawa. Pinananatili sa talababa ang tunay na sintaktikong alternatibo.
- source_word: כְּעַבְדִּי אִיּוֹב
  choice: gaya ng lingkod kong si Job
  rationale: Pinananatili ang maikling paghahambing ng Hebreo at likas itong nauunawaan bilang paghahambing sa paraan o nilalaman ng kanilang pagsasalita.
theological_decisions:
- issue: Pagtanggap ng Diyos kay Job kaugnay ng kanyang pananalangin
  choice: Tatanggapin ng Diyos si Job sa kanyang gampaning manalangin para sa mga kaibigan.
  alternative: Magpapakita lamang ang Diyos ng personal na pabor kay Job, na walang diin sa pamamagitan ng kanyang panalangin.
  rationale: Magkakaugnay sa talata ang paghahandog, panalangin ni Job, at idyoma ng pagtanggap. Ipinapakita nito ang pamamagitan ni Job ngunit hindi nag-aangkat ng mas huling sistemang teolohikal.
- issue: Ang diwa ng נְבָלָה sa maaaring gawin ng Diyos sa mga kaibigan
  choice: Hindi sila pakikitunguhan ng Diyos ayon sa kanilang culpableng kahangalan.
  alternative: Hindi gagawa ang Diyos sa kanila ng isang kahiya-hiya o napakasamang bagay.
  rationale: Saklaw ng salita ang kahangalan at kahiya-hiyang asal. Iniiwasan ng pangunahing salin ang maling pahiwatig na maaaring kumilos nang imoral ang Diyos, habang inilalahad ng talababa ang anyong mas malapit sa literal.
- issue: Kung ang mga kaibigan ay nagsalita “sa” Diyos o “tungkol sa” Diyos
  choice: “Tungkol sa akin” sa pangunahing teksto.
  alternative: “Sa akin.”
  rationale: Pinapaboran ng konteksto ang kanilang mga pahayag tungkol sa Diyos, ngunit maaaring ipakahulugan nang tuwiran ang pang-ukol na אֵלַי bilang “sa akin.” Hindi nilulutas nang palihim ang kalabuan; nakatala ang alternatibo.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “Kaya ngayon” dahil tahasang nasa WLC ang וְעַתָּה. Pare-pareho ang magalang na pangmaramihang “kayo,” at iniwasan ang sobrang teknikal o denominasyonal na pananalita.
