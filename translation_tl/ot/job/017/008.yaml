  yaml_path: translation/ot/job/017/008.yaml
  text: The upright are appalled at this[a], and the innocent stirs himself up against the godless.
translation:
  language: tl
  text: Nangingilabot dito ang mga matuwid, at ang walang-sala ay bumabangon laban sa di-maka-Diyos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mapagkunwari.” Ang Hebreong חָנֵף ay maaaring tumukoy sa taong lapastangan o di-maka-Diyos, at sa ilang konteksto ay tradisyonal na isinasaling “mapagkunwari.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשֹׁמּוּ
  choice: nangingilabot
  rationale: Ang qal ng שׁמם ay nagpapahayag dito ng pagkagimbal o matinding pagkasindak. Ang “nangingilabot” ay natural sa Filipino at angkop sa lakas ng damdamin sa konteksto.
- source_word: יְשָׁרִים
  choice: ang mga matuwid
  rationale: Pangmaramihang pang-uri na ginamit bilang pangngalan; pinananatili ng salin ang moral na kategorya nang walang di-kailangang pagpapalawak.
- source_word: עַל זֹאת
  choice: dito
  rationale: Tinutukoy ng parirala ang bagay o pangyayaring sanhi ng kanilang pagkagimbal. Ang “dito” ay maikli at likas sa modernong Filipino.
- source_word: נָקִי
  choice: ang taong walang-sala
  rationale: Tumutukoy sa isang malaya sa pagkakasala; malinaw at likas ang “taong walang-sala” sa kontekstong moral.
- source_word: חָנֵף
  choice: ang taong hindi kumikilala sa Diyos
  rationale: Ang salita ay tumutukoy sa taong lapastangan o hindi maka-Diyos, hindi lamang sa isang mapagkunwari. Iniiwasan ng saling ito ang sobrang pagpapakitid ng kahulugan.
- source_word: יִתְעֹרָר
  choice: pinupukaw ... ang sarili niya
  rationale: Pinananatili nito ang reflexive na diwa ng hitpolel—ang taong walang-sala ay gumigising o naghahanda sa sarili para kumilos.
- source_word: עַל חָנֵף
  choice: laban sa taong hindi kumikilala sa Diyos
  rationale: Kasama ng pandiwa ng pagpukaw, ang עַל ay pinakamainam unawain bilang pagsalungat o pagkilos laban sa taong hindi maka-Diyos.
theological_decisions:
- issue: Pagsasalin ng חָנֵף
  choice: ang taong hindi kumikilala sa Diyos
  alternative: ang mapagkunwari
  rationale: Ang talata ay naghahambing ng mga moral na uri—matuwid/walang-sala at lapastangan/hindi maka-Diyos. Pinananatili ng piniling salin ang etikal at panrelihiyong pagsalungat nang hindi nililimitahan ang salita sa pagkukunwari lamang.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “nangingilabot” para sa matinding pagkagimbal at ang malinaw na pariralang “taong hindi kumikilala sa Diyos” upang katawanin ang malawak na diwa ng חָנֵף. Nasa pangunahing teksto ang marker na [a].
