translation:
  language: tl
  text: 'Tinatawag ko ang hukay: ‘Ikaw ang aking ama,’ at ang uod: ‘Aking ina at aking kapatid na babae.’'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שַׁחַת
  choice: hukay
  rationale: Tumutukoy sa hukay o libingan; pinananatili ng “hukay” ang konkretong larawan at hindi nito ipinapalagay na tiyak na ang Sheol ang ibig sabihin.
- source_word: קָרָאתִי
  choice: Tinatawag ko
  rationale: Direktang ipinapahayag ang pagtawag o pakikipag-usap ni Job sa hukay, alinsunod sa aspektong ganap ng Hebreo na maaaring ilahad nang natural sa kasalukuyang pananalita sa konteksto.
- source_word: רִמָּה
  choice: uod
  rationale: Karaniwang tawag sa uod na kaugnay ng pagkabulok; natural at malinaw sa modernong Tagalog.
- source_word: אָבִי ... אִמִּי וַאֲחֹתִי
  choice: aking ama ... aking ina at aking kapatid na babae
  rationale: Pinananatili ang magkakatapat na katawagang pampamilya at ang tahasang pambabaeng “kapatid na babae.”
theological_decisions:
- issue: Pagkatao at kalagayan ng “hukay” at “uod”
  choice: Panatilihin bilang matalinghagang direktang kinakausap ni Job
  alternative: Ipaliwanag ang mga ito bilang tiyak na pagtukoy sa Sheol o sa kamatayan
  rationale: Ang talata ay gumagamit ng personipikasyon at larawang pampamilya; hindi dapat dagdagan ng salin ang isang mas tiyak na doktrina ng kabilang-buhay kaysa sa sinasabi ng Hebreo.
translation_notes:
  register: Makabagong Filipino Tagalog na simple ngunit marangal. Ginamit ang “Tinatawag ko” upang mapanatili ang direktang kilos ng קָרָאתִי, at “kapatid na babae” upang malinaw na maipahayag ang pambabaeng anyo ng אֲחוֹת.
