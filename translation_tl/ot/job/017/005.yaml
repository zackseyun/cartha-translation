  text: He denounces friends for a share[a], and the eyes of his children will fail.
translation:
  language: tl
  text: 'Ang nagsusumbong laban sa mga kaibigan upang magkaroon ng bahagi[a],

    at manghihina ang mga mata ng kanyang mga anak.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “para sa isang bahagi,” “para sa pakinabang,” o, ayon sa ibang pakahulugan, “bilang pambobola.” Mahirap unawain ang pariralang Hebreo, ngunit malamang na tumutukoy ito sa pakikitungo sa mga kaibigan para sa sariling kapakinabangan.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְחֵלֶק
  choice: upang magkaroon ng bahagi
  rationale: Ang חֵלֶק ay pangunahing nangangahulugang “bahagi” o “mana.” Sa mahirap na kontekstong ito, ipinahihiwatig ng לְ ang pakinabang o layuning makakuha ng bahagi, ngunit hindi idinagdag sa pangunahing teksto ang “samsam” dahil wala itong tahasang katumbas sa Hebreo. Inilalahad sa talababa ang iba pang posibleng pakahulugan.
- source_word: יַגִּיד
  choice: nagsusumbong laban sa
  rationale: Ang Hiphil ng נגד ay “magsabi, magpahayag, magbigay-alam.” Dahil mga kaibigan ang sangkot at may pahiwatig ng sariling pakinabang, likas sa Filipino ang “nagsusumbong laban sa,” na nagpapakita ng mapaminsalang pagbubunyag nang hindi ito nililimitahan sa isang pormal na usaping legal.
- source_word: רֵעִים
  choice: mga kaibigan
  rationale: Karaniwang tumutukoy ang רֵעִים sa mga kaibigan o kasamahan. Pinananatili ng “mga kaibigan” ang bigat ng pagtataksil sa isang malapit na ugnayan.
- source_word: וְעֵינֵי בָנָיו
  choice: ang mga mata ng kanyang mga anak
  rationale: Maaaring mangahulugan ang בנים ng “mga anak na lalaki” o ng “mga anak” sa mas malawak na diwa. Ang “mga anak” ay natural at hindi nagpapasok ng di-tiyak na pagtatakda sa kasarian.
- source_word: תִּכְלֶנָה
  choice: manghihina
  rationale: Ang כלה ay maaaring mangahulugang maubos, manghina, o maglaho. Kapag mga mata ang simuno, inilalarawan ng “manghihina” ang pagkabigo o unti-unting panghihina ng paningin nang hindi ipinapako ang diwa sa simpleng pagkalabo lamang.
theological_decisions:
- issue: Ugnayan ng gawa ng magulang at paghina ng mga mata ng mga anak
  choice: Pinanatili ang tuwirang pagkakasunod at ang panghinaharap na pahayag ng Hebreo.
  alternative: Ipaliwanag ito bilang tiyak na banal na parusa o bilang kasabihan lamang tungkol sa kahihinatnan.
  rationale: Hindi tahasang tinutukoy ng talata ang sanhi o mekanismo ng kahihinatnan. Ang salin ay hindi nagdaragdag ng paliwanag na doktrinal.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “nagsusumbong laban sa” bilang malinaw at karaniwang pananalita; pinanatili ang “bahagi” at “manghihina ang mga mata” upang hindi labis na linawin ang dalawang malalabong larawang Hebreo.
