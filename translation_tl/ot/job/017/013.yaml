  yaml_path: translation/ot/job/017/013.yaml
  text: If I hope for Sheol as my house[a], if I spread my bed in the darkness,
translation:
  language: tl
  text: Kung aasahan kong ang Sheol ang magiging tahanan ko[a], at ilalatag ko ang aking higaan sa kadiliman,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “libingan” o “lugar ng mga patay.” Ang Hebreong “Sheol” ay tumutukoy sa lugar ng mga patay at mas malawak ang kahulugan kaysa sa isang libingan lamang.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Kung
  rationale: Pinananatili ang kondisyunal o mapagpalagay na puwersa ng Hebreo, sa halip na gawin itong tiyak o purong pamanahon.
- source_word: אֲקַוֶּה
  choice: aasahan ko
  rationale: Ipinahahayag ng קוה ang may-pananabik na paghihintay o pag-asa. Likas sa Filipino ang “aasahan ko” sa ganitong kondisyunal na pahayag at hindi nito pinapawi ang tensiyon ng pagtanaw ni Job sa kamatayan.
- source_word: שְׁאוֹל
  choice: Sheol
  rationale: Pinananatili ang transliterasyon upang huwag paliitin ang konsepto sa libingan lamang o lagyan ito ng mas huling doktrinal na kahulugan. Nililinaw sa talababa ang saklaw nito.
- source_word: בֵּיתִי
  choice: bilang tahanan ko
  rationale: Likas na ipinahahayag sa Filipino ang walang pandiwang ugnayan ng “Sheol” at “aking bahay” sa pamamagitan ng “bilang,” habang ang “tahanan” ay angkop sa larawan ng tirahan.
- source_word: בַּחֹשֶׁךְ
  choice: sa kadiliman
  rationale: Tuwirang inililipat ang pariralang may pang-ukol at tiyak na anyo, at pinananatili ang larawang kaugnay ng Sheol at kamatayan.
- source_word: רִפַּדְתִּי
  choice: ilalatag ko
  rationale: Inilalarawan ng pandiwa ang paglalatag o paghahanda ng hihigaan; malinaw at kongkreto ang “ilalatag” sa modernong Filipino.
- source_word: יְצוּעָי
  choice: ang higaan ko
  rationale: Ang “higaan” ay natural at marangal na katumbas ng lugar na hinihigaan, at pinananatili ang larawan ng kamatayan bilang pagpapahinga.
theological_decisions:
- issue: Kung bibigyang-kahulugang salin ang שְׁאוֹל
  choice: Sheol
  alternative: libingan; daigdig ng mga patay
  rationale: Pinananatili ng “Sheol” ang mas malawak na saklaw ng konseptong Hebreo at iniiwasang itumbas lamang ito sa pisikal na libingan o sa isang mas tiyak at mas huling doktrina tungkol sa kabilang-buhay.
translation_notes:
  register: Modernong Filipino na dignified at madaling maunawaan. Pinanatili ang magkapares na kondisyunal na sugnay at ang kongkretong larawan ng tahanan, kadiliman, at higaan. Ginamit ang “Sheol” na may maikling paliwanag sa talababa upang mapanatili ang tunay na lawak at tensiyong teolohikal ng Hebreo.
