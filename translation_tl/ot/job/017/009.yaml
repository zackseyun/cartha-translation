translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang parallelismo at ang larawang “malilinis na kamay,” habang ginawang natural ang Hebreong idyoma ng paghawak nang mahigpit sa sariling landas.
