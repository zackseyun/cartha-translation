  text: Yet the righteous holds fast to his way[a], and the one with clean hands grows stronger.
translation:
  language: tl
  text: Ngunit ang matuwid ay mahigpit na kakapit sa kanyang landas, at ang may malilinis na kamay ay lalo pang lalakas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “magdaragdag ng lakas”; maaari ring unawain bilang “lalago sa lakas” o, sa mas makitid na diwa, “lalakas ang loob.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֹאחֵז
  choice: Ngunit ... mananatiling mahigpit
  rationale: Ang וְ ay may banayad na panalungat na puwersa sa konteksto, at ang אחז ay nangangahulugang humawak o kumapit nang mahigpit. Ang parirala ay likas na nagpapahayag ng patuloy na pagtitiyaga.
- source_word: צַדִּיק
  choice: ang matuwid
  rationale: Ang pang-isahang pang-uri ay ginamit bilang pangngalan at kumakatawan sa sinumang taong matuwid, nang hindi nagdaragdag ng salitang wala sa Hebreo.
- source_word: דַּרְכּוֹ
  choice: kanyang landas
  rationale: Ang דֶּרֶךְ ay maaaring tumukoy sa daan, landas, o takbo ng buhay. Pinananatili ng “landas” ang literal at metaporikal na larawan.
- source_word: וּטֳהָר יָדַיִם
  choice: ang may malilinis na kamay
  rationale: Pinananatili nito ang konkretong idyomang Hebreo para sa kawalang-sala o kadalisayang moral, sa natural na makabagong Tagalog.
- source_word: יֹסִיף אֹמֶץ
  choice: lalo pang lalakas
  rationale: Literal itong “magdaragdag ng lakas.” Likas na ipinahahayag ng “lalo pang lalakas” ang pag-igting ng lakas o katatagan habang hindi nililimitahan ang אֹמֶץ sa tapang lamang.
