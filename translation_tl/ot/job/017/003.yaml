source:
  edition: WLC
  text: שִֽׂימָ/ה נָּ֭א עָרְבֵ֣/נִי עִמָּ֑/ךְ מִֽי ה֝֗וּא לְ/יָדִ֥/י יִתָּקֵֽעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/017/003.yaml
  text: Lay down[a], please, a pledge for me with yourself[b]; who else is there who would strike hands with me?
translation:
  language: tl
  text: Maglaan ka nga ng panagot para sa akin sa iyo rin[a]; sino pa ang makikipagkamay sa akin[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “Ikaw mismo ang managot para sa akin.” Legal na pananalita ang Hebreo tungkol sa pagbibigay ng garantiya o seguridad; hindi pangkaraniwan ang pakiusap sapagkat sa Diyos din ilalagak ang panagot.
    reason: lexical_alternative
  - marker: b
    text: Literal na tumutukoy sa paghampas o paghawak ng kamay—isang kilos na nagpapatibay noon ng pangako, kasunduan, o pananagutan bilang tagagarantiya.
    reason: cultural_note
lexical_decisions:
- source_word: שִׂימָה
  choice: Maglaan
  rationale: Ang pautos na anyo ng שׂים ay literal na ‘maglagay,’ ngunit sa kontekstong legal, mas likas sa Filipino ang ‘maglaan’ para sa pagtatakda o pagbibigay ng panagot.
- source_word: נָּא
  choice: nga
  rationale: Pinapalambot ng particle na ito ang pakiusap. Ang ‘nga’ ay naghahatid ng mapilit ngunit magalang na pagsusumamo sa modernong Filipino.
- source_word: עָרְבֵנִי
  choice: ng panagot para sa akin
  rationale: Nagmula sa ערב na tumutukoy sa paggarantiya o pagbibigay ng seguridad para sa isang tao. Pinananatili ng ‘panagot’ ang legal na larawan nang hindi nagiging labis na teknikal.
- source_word: עִמָּךְ
  choice: sa iyo rin
  rationale: Ipinahihiwatig ng parirala na ang panagot ay ilalagak sa Diyos mismo. Ipinakikita ng ‘rin’ ang di-karaniwang kalagayang sa Diyos din nakasalalay ang hinihinging garantiya, habang hindi lubusang nilulutas ang tensiyon.
- source_word: מִי הוּא
  choice: sino pa
  rationale: Isa itong retorikal na tanong na nagpapahiwatig na walang ibang maaaring gumanap bilang tagapanagot. Likas sa Filipino ang ‘sino pa’ para sa ganitong paghahambing.
- source_word: לְיָדִי יִתָּקֵעַ
  choice: makikipagkamay sa akin
  rationale: Ang literal na pag-abot o paghampas ng kamay ay idyoma para sa pagpapatibay ng isang kasunduang may panagot. Pinananatili ng salin ang kongkretong kilos at nililinaw ito sa talababa.
theological_decisions:
- issue: Legal na talinghagang ipinatutungkol sa Diyos
  choice: Humihingi si Job sa Diyos ng panagot na ilalagak sa Diyos din, yamang walang ibang makikipagkasundo sa kaniya.
  alternative: Maaaring unawain na humihingi lamang si Job ng isang tagapanagot, nang hindi tahasang sinasabing ang Diyos mismo ang gaganap sa magkabilang panig.
  rationale: Malakas na ipinahihiwatig ng pagsasama ng עָרְבֵנִי at עִמָּךְ na sa Diyos din hihingin at ilalagak ang garantiya. Gayunman, hindi ginawang tahasan sa pangunahing teksto na ang Diyos mismo ang ‘panagot,’ upang mapanatili ang kakaiba at maigting na anyo ng Hebreo.
translation_notes:
  register: Modernong Filipino na may marangal at mapanaghoy na tono. Ginamit ang ‘panagot’ sa halip na mas banyagang ‘garantiya’ sa pangunahing teksto, at pinanatili ang larawan ng pakikipagkamay, na nilinaw sa talababa upang hindi ito mapagkamalang karaniwang pagbati.
