  text: My days have passed by; my plans are broken off[a], the desires of my heart.
translation:
  language: tl
  text: Lumipas na ang aking mga araw; naputol na ang aking mga balak, ang mga minimithi ng aking puso.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang mga pag-aari ng aking puso,” “ang mga bagay na pinakaiingatan ng aking puso,” o “ang mga mana ng aking puso.” Bihira at mahirap unawain ang pananalitang Hebreo.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָמַי
  choice: aking mga araw
  rationale: Tuwirang pinananatili ang idyomang Hebreo para sa mga araw ng buhay ng nagsasalita; natural din ito sa makatang Filipino.
- source_word: עָבְרוּ
  choice: lumipas na
  rationale: Ipinapahayag ng perpektong Qal ang naganap nang pagdaan ng panahon; ang “lumipas na” ay likas at malinaw sa Filipino.
- source_word: זִמֹּתַי
  choice: aking mga balak
  rationale: Ang זִמָּה ay maaaring tumukoy sa layunin, plano, o iniisip na gawin. Ang “mga balak” ay akma sa konteksto at hindi nagdaragdag ng negatibong pahiwatig.
- source_word: נִתְּקוּ
  choice: naputol na
  rationale: Ang Nifal ng נתק ay nagsasaad ng pagkaputol, pagkahiwalay, o pagkalagot. Ang “naputol na” ay natural at pinananatili ang marahas na larawan ng mga planong hindi na maipagpapatuloy.
- source_word: מוֹרָשֵׁי
  choice: mga minimithi
  rationale: Bihira at mahirap ang anyo sa kontekstong ito. Maaaring tumukoy ito sa mga pag-aari o minamahal na bagay ng puso; ang “mga minimithi” ay nagpahayag ng malamang na diwa ngunit nilalagyan ng talababa upang mapanatili ang tunay na leksikal na kalabuan.
- source_word: לְבָבִי
  choice: aking puso
  rationale: Karaniwang katumbas na nagpapanatili sa Hebreong larawan ng puso bilang sentro ng pag-iisip, hangarin, at kalooban.
