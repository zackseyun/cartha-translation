translation_notes:
  register: Makabago ngunit marangal na Filipino, na may maikling paralelismong patula. Ginamit ang gitling na em upang ipakitang ang “mga minimithi ng aking puso” ay nagpapaliwanag sa “aking mga balak,” nang hindi lubusang nilulutas ang sintaktikong ugnayan.
