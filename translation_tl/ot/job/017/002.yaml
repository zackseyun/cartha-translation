id: JOB.17.2
reference: Job 17:2
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: אִם לֹ֣א הֲ֭תֻלִים עִמָּדִ֑/י וּ֝/בְ/הַמְּרוֹתָ֗/ם תָּלַ֥ן עֵינִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/017/002.yaml
  text: Surely mockers are with me[b][a], and my eye lodges on their provocation.
translation:
  language: tl
  text: Tiyak na kasama ko ang mga manunuya[a], at nananatiling nakatuon ang mata ko sa kanilang pang-uudyok.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga manlilinlang”; maaaring tumukoy ang salitang Hebreo sa mga taong mapanlinlang o mapanlibak.
    reason: lexical_alternative
  - marker: b
    text: O “sa kanilang paghihimagsik” o “sa kanilang kapaitan.” Mahirap tiyakin ang pariralang Hebreo at maaaring tumukoy sa asal na nang-uudyok, mapanghimagsik, o mapait.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם לֹא
  choice: Tiyak na
  rationale: Ginagamit dito ang parirala bilang mariing pagpapatibay, hindi bilang kondisyon; natural na naihahatid ng “Tiyak na” ang diin.
- source_word: הֲתֻלִים
  choice: mga manunuya
  rationale: Tumutukoy ang pangngalan sa mga taong nanlilibak o nangungutya, na angkop sa mapanuyang pananalita ng mga kasama ni Job; posible rin ang diwang “mga manlilinlang.”
- source_word: עִמָּדִי
  choice: kasama ko
  rationale: Tuwirang ipinahahayag ang presensiya ng mga taong iyon sa piling ni Job.
- source_word: וּבְהַמְּרוֹתָם
  choice: sa kanilang pang-uudyok
  rationale: Maaaring tumukoy ang anyo sa asal na nang-uudyok, mapanghimagsik, o mapait; ang “pang-uudyok” ay nagpapanatili sa kaugnayan nito sa antagonistikong asal nang hindi ito ginagawang tiyak na paghihimagsik laban sa Diyos.
- source_word: תָּלַן
  choice: nananatiling nakatuon
  rationale: Literal itong “tumutuloy” o “nagpapalipas ng gabi,” ngunit talinghaga ito para sa matang nananatili o nakapako; mas natural sa modernong Filipino ang “nananatiling nakatuon.”
- source_word: עֵינִי
  choice: ang mata ko
  rationale: Pinananatili ang isahang anyo ng Hebreo, na nauunawaan bilang tingin o pansin ni Job.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “manunuya” para sa malinaw na konteksto ng panlilibak, habang inilagay sa talababa ang posibleng “manlilinlang.” Ang matingkad na larawan ng literal na “tumutuloy ang mata” ay bahagyang ginawang likas na Filipino bilang “nananatiling nakatuon ang mata ko,” nang pinananatili ang isahang “mata.”
