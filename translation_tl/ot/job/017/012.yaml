  source_fidelity: 'Tumpak na naihahatid ang dalawang paralelong pahayag ng Hebreo: ang gabi ay itinuturing na araw, at ang liwanag ay ipinahahayag na malapit kaugnay ng kadiliman. Ang “sinasabi nila” at mga panipi ay isang katanggap-tanggap na paglilinaw sa eliptikong ikalawang linya, na kaayon din ng English POB audit trail. Ang “sa harap ng kadiliman” ay maingat na pinananatili ang malabong ugnayan ng מִפְּנֵי (maaaring ‘sa harap ng’/‘dahil sa’ ayon sa pagbasa) nang hindi nagpapataw ng paliwanag.'
