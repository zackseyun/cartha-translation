translation:
  language: tl
  text: Ginagawa nilang araw ang gabi; sinasabi nila, “Malapit na ang liwanag,” sa harap ng kadiliman.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לַיְלָה לְיוֹם יָשִׂימוּ
  choice: Ginagawa nilang araw ang gabi
  rationale: 'Pinananatili ang tuwirang larawan at ayos ng Hebreo: itinuturing o ginagawang araw ang gabi.'
- source_word: אוֹר קָרוֹב
  choice: Malapit na ang liwanag
  rationale: Likas sa modernong Tagalog at pinananatili ang maigsi at bahagyang malabong pahayag na ang liwanag ay malapit.
- source_word: מִפְּנֵי חֹשֶׁךְ
  choice: sa harap ng kadiliman
  rationale: Pormal na inililipat ang idyomang Hebreo upang mapanatili ang matinding pagtatambis ng liwanag at kadiliman.
theological_decisions:
- issue: Hindi tahasang nakasaad sa Hebreo ang pandiwang “sinasabi nila.”
  choice: Isinama ang “sinasabi nila” upang ipakitang ang “Malapit na ang liwanag” ay pahayag ng naunang tinutukoy na maramihan.
  alternative: “Ginagawa nilang araw ang gabi; malapit ang liwanag sa harap ng kadiliman.”
  rationale: Ang pandiwa ay ipinahihiwatig ng putol at masinsing paralelismo ng tula; nililinaw nito ang daloy nang hindi tinutukoy kung sino ang “nila” o kung tama ang kanilang pahayag.
translation_notes:
  register: Makabagong Filipino na marangal at madaling maunawaan; pinanatili ang matalinghagang tensiyon sa pagitan ng gabi, araw, liwanag, at kadiliman.
