  yaml_path: translation/ot/job/017/010.yaml
  text: But all of you[a], come back now, and come; I will not find a wise man among you.
translation:
  language: tl
  text: Ngunit bumalik kayong lahat at lumapit ngayon; hindi ako makasusumpong sa inyo ng kahit isang taong marunong.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “bumalik kayo at pumarito ngayon.” Ang Hebreo ay isang mariing panawagan, na malamang ay hamon ni Job sa kaniyang mga kaibigan na muling iharap ang kanilang mga pangangatwiran.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאוּלָם
  choice: Ngunit
  rationale: Nagpapahiwatig ito ng mariing pagsalungat o paglipat ng diwa; natural at marangal sa modernong Filipino ang “Ngunit.”
- source_word: כֻּלָּם
  choice: kayong lahat
  rationale: Ang kasunod na mga pandiwa ay nasa ikalawang panauhang panlalaking maramihan, kaya tuwirang kinakausap ni Job ang lahat ng kaniyang mga kausap.
- source_word: תָּשֻׁבוּ
  choice: bumalik kayo
  rationale: Ang anyo mula sa שוב ay ginagamit dito bilang mariing paanyaya o hamon na muling humarap at mangatuwiran.
- source_word: וּבֹאוּ נָא
  choice: at lumapit ngayon
  rationale: Pinananatili ang ikalawang utos at ang mapilit na puwersa ng נָא. Ang “lumapit” ay likas sa Filipino at iniiwasan ang alanganing pag-uulit na “bumalik ... at pumarito.”
- source_word: וְלֹא אֶמְצָא
  choice: wala akong matatagpuang
  rationale: 'Ipinapahayag ng imperfect ang magiging resulta matapos ang hamon: hindi makakakita si Job ng gayong tao sa kanila, nang hindi idinaragdag ang diwang ‘hindi ko kaya.’'
- source_word: בָכֶם
  choice: sa inyo
  rationale: Likas na Filipino para sa paghahanap ng isang tao sa loob ng pangkat na kinakausap.
- source_word: חָכָם
  choice: isang marunong
  rationale: Ang panlalaking pang-isahang pang-uri ay substantibo. Sa Filipino, ang “isang marunong” ay natural, tumutukoy sa isang taong marunong, at hindi kinakailangang magdagdag ng salitang wala sa Hebreo.
theological_decisions:
- issue: Kasarian sa חָכָם
  choice: isang marunong
  alternative: isang lalaking marunong
  rationale: Bagaman panlalaking pang-isahan ang anyong Hebreo at mga lalaki ang agarang kausap, hindi karaniwang minamarkahan ng pang-uring Filipino ang kasarian. Ang “isang marunong” ay nagpapanatili sa pang-isahang substantibong diwa nang hindi nagpapasok ng di-likas na tahasang pagtukoy sa kasarian.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang mariing tono ng hamon at ang dalawang magkasunod na pandiwa sa Hebreo, habang ginawang likas ang pagkakasabi sa Filipino.
