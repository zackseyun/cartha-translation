  yaml_path: translation/ot/job/017/004.yaml
  text: For you have hidden their heart from understanding[b][a]; therefore you will not exalt them.
translation:
  language: tl
  text: Sapagkat ikinubli mo ang kanilang puso mula sa pag-unawa[a]; kaya hindi mo sila itataas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “puso” sa Hebreo ay maaari ring tumukoy sa “isip” o “kaloob-looban,” ang sentro ng pag-iisip at pagkilala, hindi lamang ng damdamin.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “dadakilain” o, ayon sa diwa, “hindi mo sila hahayaan na magtagumpay.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikilala nito ang dahilan o batayan ng kasunod na pahayag at angkop sa marangal na daloy ng tulang Tagalog.
- source_word: לִבָּם
  choice: ang kanilang puso
  rationale: Pinananatili ang larawang Hebreo; dito, ang “puso” ay tumutukoy sa kaloob-loobang may kakayahang mag-isip at kumilala, hindi lamang sa damdamin.
- source_word: צָפַנְתָּ
  choice: ikinubli mo
  rationale: Tuwirang ipinahahayag ang ginawang pagkukubli at pinananatili ang Diyos bilang gumagawa ng kilos.
- source_word: מִשָּׂכֶל
  choice: sa pagkaunawa
  rationale: Ang מִן ay nagpapahiwatig ng pagkakahiwalay o pagkakalayo; ang שׂכל ay pagkaunawa o wastong pagkilala.
- source_word: עַל כֵּן
  choice: kaya
  rationale: Natural na panandang naghahayag ng bunga o kongklusyon sa modernong Tagalog.
- source_word: לֹא תְרֹמֵם
  choice: hindi mo sila itataas
  rationale: Pinananatili ang konkretong larawan ng רום, ‘itaas,’ habang ang ipinahihiwatig na layon na ‘sila’ ay nililinaw ayon sa pangmaramihang tinutukoy sa unang sugnay.
theological_decisions:
- issue: Ang tinutukoy ng “kanilang” at “sila”
  choice: Pinanatili ang mga panghalip nang hindi tinutukoy nang tahasan kung sino ang pangkat.
  alternative: Tukuyin sila bilang mga kalaban ni Job o mga kapanalig ng mga ito.
  rationale: Ang Diyos ang kinakausap sa mga pandiwang nasa ikalawang panauhan, ngunit hindi tahasang pinapangalanan ng talata ang pangkat na tinutukoy ng mga panghalip.
- issue: Ang ugnayan ng Diyos at ng kanilang kawalan ng pagkaunawa
  choice: Pinanatili ang tuwirang pahayag na ang Diyos ang nagkubli ng kanilang puso sa pagkaunawa.
  alternative: Gawing mas di-tuwiran, gaya ng ‘hindi mo sila pinagkalooban ng pagkaunawa.’
  rationale: Mahalagang huwag pahinain o ipaliwanag nang labis ang tensiyong teolohikal ng tahasang kilos ng Diyos sa tekstong Hebreo.
translation_notes:
  register: Makabago ngunit marangal na Tagalog. Ginamit ang “ikinubli” upang mapanatili ang patulang larawan at ang kakaibang pahayag ng Hebreo; ginamit ang “itataas” sa halip na mas interpretatibong “pagwawagiin” upang hindi agad lutasin ang lawak ng kahulugan.
