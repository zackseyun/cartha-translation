  yaml_path: translation/ot/job/017/016.yaml
  text: Will they go down to the bars of Sheol? Shall we descend together into the dust?[a][b]
translation:
  language: tl
  text: Bababa ba ang mga iyon sa mga rehas ng Sheol?[a] Magkasama ba tayong bababa sa alabok?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga bahagi ng Sheol” o “mga halang/rehas ng Sheol.” Malamang na inilalarawan ng Hebreo ang mga halang na kaugnay ng mga pintuang nagsasara sa daigdig ng mga patay.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “Magkasama ba tayong magpapahinga sa alabok?” Ang huling salitang Hebreo ay maaaring unawain bilang “paglusong,” ngunit inuunawa naman ito ng ilan bilang “pamamahinga.”
    reason: alternative_reading
lexical_decisions:
- source_word: בַּדֵּי
  choice: mga rehas
  rationale: Sa kaugnayan nito sa Sheol, malamang na inilalarawan ng salita ang mga rehas o halang ng pintuang nagsasara sa daigdig ng mga patay. Pinananatili ng “mga rehas” ang matalinghagang larawan nang hindi ito ginagawang literal na mga bahagi lamang.
- source_word: שְׁאֹל
  choice: Sheol
  rationale: Pinanatili ang terminong Hebreo upang hindi paliitin ang kahulugan nito sa isang pisikal na libingan lamang; tumutukoy ito sa daigdig o kalagayan ng mga patay.
- source_word: תֵּרַדְנָה
  choice: Bababa ba ang mga iyon
  rationale: Ang pandiwa ay nasa ikatlong panauhang pambabaeng maramihan at malamang na tumutukoy sa mga pag-asang binanggit sa naunang konteksto. Ginawang tanong upang maipakita ang retorikal na daloy ng pananalita ni Job.
- source_word: אִם
  choice: ba
  rationale: Bagaman karaniwang nangangahulugang “kung,” dito ay may puwersa itong patanong. Ang katagang “ba” ang likas na paraan sa Tagalog upang ipahayag iyon.
- source_word: יַחַד
  choice: magkasama
  rationale: Tuwirang ipinahahayag nito ang sama-samang paglusong o pamamahinga sa kamatayan.
- source_word: עַל עָפָר
  choice: sa alabok
  rationale: Pinanatili ang “alabok” bilang makatang larawan ng kamatayan at pagbabalik ng katawan sa lupa. Ang “sa” ay natural sa Tagalog at hindi labis na nagpapasya kung ang diwa ay paglusong tungo rito o pamamahinga sa ibabaw nito.
- source_word: נָחַת
  choice: bababa
  rationale: Isinalin ayon sa diwa ng “paglusong,” na kaagapay ng unang pandiwang “bababa.” Gayunman, tunay na posible ang pagbasa na “magpapahinga,” kaya inilagay iyon sa talababa.
theological_decisions:
- issue: Kahulugan ng Sheol
  choice: Pinanatili bilang “Sheol”
  alternative: “libingan” o “daigdig ng mga patay”
  rationale: Hindi ipinantay ang Sheol sa isang libingan lamang o sa isang mas tiyak na doktrina tungkol sa kabilang-buhay; pinananatili nito ang lawak at tensiyon ng konseptong Hebreo.
translation_notes:
  register: Makabago at marangal na Tagalog ang ginamit, na may payak na ayos at retorikal na mga tanong. Pinanatili ang “Sheol” bilang mahalagang terminong Hebreo at ipinaliwanag ang mga tunay na alternatibong pagbasa sa mga talababa.
