    rationale: Ang Hebreong parirala ay may kolektibong/maramihang saklaw. Ang mas malinaw na pangunahing salin ay kailangang ipakita ang “lahat,” habang kinikilala sa talababa na hindi tiyak ang eksaktong saklaw ng וִיצֻרַי.
  - severity: low
