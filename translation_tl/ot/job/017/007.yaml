  source_fidelity: Ang unang sugnay ay tumpak sa diwa, ngunit ang “buo kong anyo” ay hindi gaanong malinaw na naipapahayag ang maramihang כֻּלָּם (“lahat ng mga ito”) at ang malamang na pagtukoy ng וִיצֻרַי sa mga bahagi o sangkap ng katawan. Ang “lumabo ang mata ko” ay mas tuwirang tumutugon sa larawan ng pandiwang כהה kaysa “nanghina ang paningin ko.”
  naturalness: Likas at marangal sa makabagong Filipino ang “Lumabo ang mata ko dahil sa dalamhati.” Ang “lahat ng bahagi ng katawan ko” ay malinaw, bagaman ang pambihirang Hebreong termino ay pinananatiling bukas sa talababa.
  terminology: Napananatili ang “dalamhati” bilang kontekstuwal na salin ng כַּעַשׂ, kasama ang mga leksikal na alternatibo. Ang “bahagi ng katawan” ay isang ligtas na pangunahing salin para sa וִיצֻרַי, at ang alternatibong “anyo” at “balangkas” ay dapat manatili sa talababa upang hindi magpanggap na tiyak ang pinagtatalunang termino.
