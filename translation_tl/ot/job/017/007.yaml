translation:
  language: tl
  text: Lumabo ang mata ko dahil sa dalamhati[a], at ang lahat ng bahagi ng katawan ko[b] ay parang anino.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “dahil sa galit,” “yamot,” “sama ng loob,” o “lungkot.” Saklaw ng salitang Hebreo ang iba't ibang uri ng matinding pagkabagabag.
    reason: lexical_alternative
  - marker: b
    text: O “anyo ko,” “balangkas ko,” o “buo kong katawan.” Hindi tiyak kung ang salitang Hebreo ay tumutukoy sa anyo, balangkas, o mga bahagi ng katawan ni Job.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּכַהּ
  choice: Nanghina
  rationale: Ang pandiwang כהה ay tumutukoy sa pagdilim o panghihina. Kasama ng “paningin,” likas nitong ipinapahayag sa Filipino ang paghina ng kakayahang makakita.
- source_word: מִכַּעַשׂ
  choice: dahil sa dalamhati
  rationale: Maaaring tumukoy ang כַּעַשׂ sa galit, yamot, sama ng loob, o matinding dalamhati. Sa konteksto ng pagdurusa at panaghoy ni Job, ang “dalamhati” ang pinakaangkop, habang inilalahad sa talababa ang ibang posibilidad.
- source_word: עֵינִי
  choice: ang paningin ko
  rationale: Bagaman literal na isahan ang “mata ko,” maaari itong tumukoy sa paningin. Ang “paningin ko” ay natural sa modernong Filipino at pinananatili ang ideya ng lumalabong paningin.
- source_word: וִיצֻרַי
  choice: ang buo kong anyo
  rationale: Ang anyong maramihan ng יֵצֶר dito ay hindi tiyak at maaaring tumukoy sa mga bahagi o hugis ng katawan. Ang “buo kong anyo” ay malinaw at angkop sa larawan ng pagiging parang anino, nang hindi nililimitahan ang salita sa mga biyas lamang.
- source_word: כַּצֵּל
  choice: parang anino
  rationale: Pinananatili nito ang simili ng tekstong Hebreo at likas itong pakinggan sa makabagong Filipino.
- source_word: כֻּלָּם
  choice: buo
  rationale: Ang pangkalahatang diwa ng “lahat ng mga iyon” ay ipinahayag sa “buo kong anyo,” na natural sa Filipino at sumasaklaw sa kabuuan.
