  text: He has made me a byword among the peoples[b][a], and I have become one before whom people spit.
translation:
  language: tl
  text: Ginawa niya akong bukambibig ng mga bayan[a], at ako'y naging tudlaan ng pagdura sa kanilang harapan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Ginawa niya akong kasabihan sa gitna ng mga bayan.” Malamang na tumutukoy ang salitang Hebreo sa isang kilalang halimbawa ng kahihiyan at paghamak.
    reason: lexical_alternative
  - marker: b
    text: 'Sa literal, “at ako''y naging isang pagdura sa harap ng mga mukha,” na tumutukoy sa pagiging lantad na tudlaan ng paghamak. Maaari ring unawain: “at dinuduraan ako nang harapan.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִצִּגַנִי
  choice: Ginawa niya ako
  rationale: Ang Hiphil na may hulaping unang panauhan ay nagsasaad na may naglagay o gumawa kay Job bilang isang lantad na bagay ng paghamak. Likas sa Tagalog ang “ginawa niya ako” sa ganitong panaguri.
- source_word: לִמְשֹׁל
  choice: bukambibig
  rationale: Tumutukoy ito sa pagiging isang kasabihan o kilalang halimbawa, at sa konteksto ay may diwa ng panunuya at kahihiyan. Ipinahihiwatig ng “bukambibig” ang malaganap na pagbanggit nang hindi ginagawang neutral na “salawikain.”
- source_word: עַמִּים
  choice: ng mga bayan
  rationale: Pinananatili ang pangmaramihang “mga bayan” ng Hebreong עַמִּים at ang malawak, pampublikong saklaw ng kahihiyan ni Job.
- source_word: וְתֹפֶת
  choice: dura
  rationale: Ang pambihirang pangngalan ay malamang na tumutukoy sa pagdura o sa isang bagay na dinuduraan. Ang konkretong “dura” ay nagpapanatili sa matindi at tahasang larawan ng paghamak.
- source_word: לְפָנִים
  choice: sa harap ng mga tao
  rationale: Ang literal na “sa harap ng mga mukha” ay nagpapahiwatig ng lantaran at harapang paghamak. Ginawang likas sa modernong Tagalog nang hindi inaalis ang pampublikong diwa.
- source_word: אֶהְיֶה
  choice: ako'y naging
  rationale: Bagaman imperfect ang anyo, maaari itong magpahayag ng kalagayang bunga ng naunang ginawa. Ang “naging” ay umaayon sa paralelismong “ginawa niya ako” at sa kasalukuyang kahihinatnan.
theological_decisions:
- issue: Hindi tahasang pinangalanan ang simuno ng וְהִצִּגַנִי sa talata
  choice: Pinanatili ang panghalip na “niya”
  alternative: Tukuyin bilang “Diyos”
  rationale: Hindi dapat idagdag sa mismong talata ang pangalang wala sa Hebreo; pinananatili nito ang lokal na gramatikal na pahiwatig at kaugnayan sa konteksto nang hindi tahasang nilulutas ang tinutukoy ng panghalip.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Pinanatili ang maigsi at matinding paralelismo ng tulang Hebreo. Ang “bukambibig” ay madaling maunawaan ngunit nililinaw sa talababa ang posibleng “kasabihan”; ang di-karaniwang larawang “dura” ay sadyang pinanatili upang hindi pahinain ang konkretong paghamak sa orihinal.
