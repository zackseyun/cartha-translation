  yaml_path: translation/ot/job/017/015.yaml
  text: And where[a], then, is my hope? And my hope—who can see it?
translation:
  language: tl
  text: At nasaan nga ang pag-asa ko? At ang pag-asa ko—sino ang makakakita nito?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sino ang makakamasid nito?” Maaaring isalin ang pandiwang Hebreo bilang “makita” o “masdan,” at maaaring unawain ang anyong pandiwa bilang payak na panghinaharap (“sino ang makakakita nito?”) o nagsasaad ng kakayahan (“sino ang kayang makakita nito?”).
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַיֵּה
  choice: At nasaan
  rationale: Ang אַיֵּה ay tanong tungkol sa kinaroroonan, at pinananatili ng “At” ang pagpapatuloy ng panaghoy ni Job.
- source_word: אֵפוֹ
  choice: nga
  rationale: Nagdaragdag ang אֵפוֹ ng diin o pahiwatig na bunga ng naunang sinabi; natural itong naipahahayag ng “nga” sa Filipino.
- source_word: תִקְוָתִי
  choice: ang pag-asa ko
  rationale: Karaniwang nangangahulugan ang תִּקְוָה ng pag-asa o inaasahan; “pag-asa” ang pinakanatural sa konteksto.
- source_word: וְתִקְוָתִי
  choice: Ang pag-asa ko
  rationale: Pinananatili ang pag-uulit sa Hebreo upang maingatan ang diin at puwersang patula, kahit hindi na inuulit nang tahasan ang pangatnig sa Filipino.
- source_word: מִי
  choice: sino
  rationale: Ito ang karaniwang katumbas ng panghalip na pananong para sa tao.
- source_word: יְשׁוּרֶנָּה
  choice: ang makakakita nito
  rationale: Ang שׁור ay nangangahulugang tumingin, masdan, o makita. Maaaring modal o simpleng panghinaharap ang imperfect; ang “makakakita” ay natural ngunit hindi ganap na inaalis ang pahiwatig ng kakayahan. Ang “nito” ay tumutukoy sa pambabaeng pangngalang תִּקְוָה.
