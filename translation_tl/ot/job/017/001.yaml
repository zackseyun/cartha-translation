  text: רוּחִ֣/י חֻ֭בָּלָה יָמַ֥/י נִזְעָ֗כוּ קְבָרִ֥ים לִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/job/017/001.yaml
  text: My spirit is broken[a]; my days are extinguished[b]; graves await me.
translation:
  language: tl
  text: Wasak na ang aking espiritu[a]; nauupos na ang aking mga araw[b]; mga libingan ang naghihintay sa akin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Wasak na ang aking hininga.” Ang salitang Hebreo na רוּחַ ay maaaring mangahulugang “espiritu” o “hininga.”
    reason: lexical_alternative
  - marker: b
    text: O “napawi na ang aking mga araw.” Malamang na inilalarawan ng pandiwa ang isang apoy o ilaw na pinapatay o nauupos.
    reason: lexical_alternative
lexical_decisions:
- source_word: רוּחִי
  choice: aking espiritu
  rationale: Maaaring tumukoy ang רוּחַ sa espiritu o hininga. Sa panaghoy ni Job, likas sa Tagalog ang “aking espiritu” para sa kaniyang panloob na buhay, habang pinananatili sa talababa ang pisikal na diwa ng hiningang nauubos.
- source_word: חֻבָּלָה
  choice: wasak na
  rationale: Ang pasibong anyo ay nagpapahiwatig ng matinding pagkasira. Ang “wasak na” ay natural at marubdob sa modernong Tagalog nang hindi tinutukoy kung paano naganap ang pagkasira.
- source_word: יָמַי
  choice: aking mga araw
  rationale: Tuwirang pinananatili ang maramihang anyo at ang pagtukoy sa nalalabing panahon ng buhay ni Job.
- source_word: נִזְעָכוּ
  choice: nauupos na
  rationale: Ipinahihiwatig ng pandiwa ang pagkapawi o pagkamatay na gaya ng apoy o ilaw. Natural sa Tagalog ang “nauupos na” at pinananatili nito ang larawang unti-unti nang namamatay ang kaniyang buhay.
- source_word: קְבָרִים
  choice: mga libingan
  rationale: Pinananatili ang tahasang maramihang anyo ng Hebreo sa halip na gawing kolektibong isahan.
- source_word: לִי
  choice: ang naghihintay sa akin
  rationale: Literal itong “para sa akin,” ngunit sa konteksto ay ipinahihiwatig na libingan na ang nasa unahan ni Job. Ang “naghihintay sa akin” ay natural na pagpapahayag ng puwersang ito sa Tagalog.
