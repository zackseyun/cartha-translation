translation:
  language: tl
  text: Kung sasabihin ninyo[a], “Paano natin siya tutugisin, yamang matatagpuan sa akin ang ugat ng usapin?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mahirap ang Hebreo. Maaari ring unawain ang huling sugnay bilang, “yamang matatagpuan sa kanya ang ugat ng usapin,” depende sa pagtimbang sa tekstong katinig at sa mga sinaunang salin. Maaari ring unawain ang “tutugisin” sa mas malakas na diwang “uusigin.”
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי תֹאמְרוּ
  choice: Kung sasabihin ninyo
  rationale: Sa kontekstong ito, ang כִּי kasama ng imperfect ay nagpapakilala ng isang ipinapalagay na sasabihin ng mga kausap ni Job. Likas sa Filipino ang kondisyunal na “Kung sasabihin ninyo.”
- source_word: מַה נִּרְדָּף לוֹ
  choice: Paano natin siya uusigin
  rationale: Ang מַה ay adberbiyal na tanong na “paano,” at ang רדף ay maaaring mangahulugang humabol, tumugis, o umusig. Pinili ang “uusigin” upang maipahayag ang mapaminsalang paghabol kay Job sa konteksto, habang pinananatili ang unang panauhang maramihan ng pandiwa.
- source_word: וְשֹׁרֶשׁ דָּבָר
  choice: yamang ... ang ugat ng usapin
  rationale: Ang וְ ay nauunawaan dito bilang nagpapakilala ng dahilan. Ang שֹׁרֶשׁ ay pinanatiling metaporikal na “ugat,” at ang דָּבָר ay “usapin,” ang kasong pinagtatalunan.
- source_word: נִמְצָא בִי
  choice: nasa akin
  rationale: Ang Niphal נִמְצָא at בִי ay literal na tumutukoy sa bagay na “natatagpuan sa akin.” Ang “nasa akin” ay natural at maikli sa Filipino, ngunit nananatili ang tunay na hirap at kalabuan ng parirala sa talababa.
theological_decisions:
- issue: Kung kanino matatagpuan ang “ugat ng usapin”
  choice: nasa akin
  alternative: nasa kanya
  rationale: Ang patinig at anyong Masoretiko בִי ay “sa akin,” ngunit mahirap ang diwa at may sinaunang ebidensiya at interpretasyong sumusuporta sa “sa kanya.” Hindi inayos nang tahimik ang tensiyon; inilagay ang alternatibo sa talababa.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “usapin” sa halip na mas teknikal na “kaso,” at pinanatili ang metaporang “ugat.” Ang “uusigin” ay malinaw sa ordinaryong mambabasa at angkop sa mapanlabang konteksto.
