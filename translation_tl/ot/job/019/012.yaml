  yaml_path: translation/ot/job/019/012.yaml
  text: Together his troops come; they build up their road against me[a], and they camp all around my tent.
translation:
  language: tl
  text: Sama-samang dumarating ang kanyang mga hukbo; nagtatambak sila ng kanilang daan laban sa akin[a], at nagkakampo sila sa buong paligid ng aking tolda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “gumagawa sila ng kanilang daan laban sa akin.” Ang pandiwang Hebreo ay maaaring maglarawan ng pagtatambak o paggawa ng mataas na daan, o ng rampang ginagamit sa pagkubkob.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַחַד
  choice: Sama-samang
  rationale: Ipinahihiwatig ng pang-abay ang sabay-sabay at nagkakaisang pagkilos ng mga hukbo.
- source_word: יָבֹאוּ
  choice: dumarating
  rationale: Pinananatili ang payak na diwang 'dumating/pumarito' at ang masiglang kasalukuyang paglalahad ng tula.
- source_word: גְדוּדָיו
  choice: ang kanyang mga hukbo
  rationale: Ang גְּדוּד ay pangkat ng mga mandirigma o hukbo; hindi tinutukoy nang tahasan kung sino ang tinutukoy ng 'kanyang,' gaya ng Hebreo.
- source_word: וַיָּסֹלּוּ ... דַּרְכָּם
  choice: nagtatayo sila ng daang pansalakay
  rationale: Ang סלל kasama ng דֶּרֶךְ ay maaaring tumukoy sa pagtambak o paggawa ng daan o rampa para sa paglusob. Nililinaw ng 'pansalakay' ang larawang militar nang hindi lubusang nililimitahan ito sa isang rampa.
- source_word: עָלַי
  choice: laban sa akin
  rationale: Sa konteksto ng pagkubkob, ang literal na 'sa ibabaw ko' ay may malinaw na puwersang panlaban.
- source_word: וַיַּחֲנוּ
  choice: nagkakampo sila
  rationale: Likas na makabagong Tagalog para sa pagkakampo ng isang puwersang militar.
- source_word: סָבִיב
  choice: sa palibot
  rationale: Ipinapakita ang pag-ikot o pagkubkob sa lahat ng panig.
- source_word: לְאָהֳלִי
  choice: ng aking tolda
  rationale: Pinananatili ang kongkretong larawan ng אֹהֶל bilang tolda, sa halip na gawing mas abstraktong 'tahanan.'
theological_decisions:
- issue: Tinutukoy ng hulaping ikatlong panauhang panlalaki sa 'kanyang mga hukbo'
  choice: Pinanatili ang panghalip na 'kanyang'; sa konteksto, inilalarawan ni Job ang Diyos bilang umaatake sa kanya.
  alternative: Gawing tahasang 'mga hukbo ng Diyos' o unawain bilang hukbo ng isang di-tiyak na pinuno.
  rationale: Hindi tahasang pinapangalanan ng talata ang tinutukoy ng panghalip. Ang pagpapanatili rito ay tapat sa Hebreo at hinahayaang ang kalapit na konteksto ang magpakilala sa tinutukoy.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang matinding larawang militar ng sabay-sabay na pagdating, paggawa ng daang pansalakay, pagkubkob, at tolda.
