  yaml_path: translation/ot/job/019/013.yaml
  text: He has driven my brothers far from me[b][a], and those who know me are wholly estranged from me.
translation:
  language: tl
  text: Inilayo niya sa akin ang aking mga kapatid[a], at ang mga nakakakilala sa akin ay tuluyang naging mga estranghero sa akin.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Inalis niya sa akin ang aking mga kapatid.”
    reason: lexical_alternative
  - marker: b
    text: O “ang mga nakakakilala sa akin ay lubusang napalayo sa akin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחַי
  choice: aking mga kapatid
  rationale: Ang anyo ay panlalaking maramihan na may hulaping unang panauhan, literal na “aking mga kapatid na lalaki.” Sa konteksto maaari itong tumukoy sa malalapit na kamag-anak, ngunit pinananatili ng “mga kapatid” ang tuwirang anyo nang hindi nagdaragdag ng kasariang hindi kailangang ipahayag sa natural na Filipino.
- source_word: מֵעָלַי
  choice: sa akin
  rationale: Kasama ng causative na הִרְחִיק, ipinahihiwatig nito ang pag-aalis mula sa presensiya o ugnayan ni Job. Natural sa Filipino ang “inilayo ... sa akin.”
- source_word: הִרְחִיק
  choice: inilayo
  rationale: Ang Hiphil perfect ay nangangahulugang “pinaging malayo” o “inilayo.” Ang “inilayo” ay malinaw, natural, at nagpapanatili sa causative na diwa.
- source_word: וְיֹדְעַי
  choice: ang mga nakakakilala sa akin
  rationale: Literal itong “mga nakakakilala sa akin.” Mas malinaw at mas buhay ito kaysa sa “mga kakilala ko,” at hindi nito nililimitahan ang saklaw sa isang mababaw na pagkakakilala.
- source_word: אַךְ
  choice: lubusang
  rationale: Dito ay pinatitindi nito ang pagkakahiwalay. Ang “lubusang” ay natural na naghahatid ng ganap na antas ng pagkakalayo.
- source_word: זָרוּ
  choice: napalayo
  rationale: Ipinapahayag ng pandiwa ang pagiging banyaga o estranghero sa ugnayan. Ang “napalayo” ay natural sa modernong Filipino at nagpapakita ng bunga ng pagkasira ng relasyon; inilalagay sa talababa ang mas literal na “naging mga estranghero.”
- source_word: מִמֶּנִּי
  choice: sa akin
  rationale: Ang pang-ukol ay nagpapahiwatig ng paghihiwalay mula kay Job. Sa idyomatikong Filipino, “napalayo sa akin” ang natural na katumbas.
theological_decisions:
- issue: Hindi tahasang paksa ng הִרְחִיק
  choice: Pinanatili ang panghalip na “niya.”
  alternative: “Inilayo ng Diyos sa akin...”
  rationale: May di-binanggit na paksa sa ikatlong panauhang panlalaki ang Hebreo. Ipinakikita ng kalapit na konteksto na Diyos ang tinutukoy, ngunit ang panghalip ay nagpapanatili sa pagtitipid at tensiyong teolohikal ng mismong talata nang hindi ito labis na tinutukoy.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “mga kapatid” sa halip na mas teknikal o mas malawak na “mga kamag-anak,” at “napalayo” upang likas na maipahayag ang pagkasira ng ugnayan habang pinananatili sa talababa ang mas literal na larawan ng pagiging mga estranghero.
