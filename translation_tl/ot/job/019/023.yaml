  register: Makabago ngunit marangal na Tagalog. Ginamit ang bahagyang patulang ayos na “sa isang aklat ang mga ito’y maiukit” upang mapanatili ang diin at parallelismo ng Hebreo nang manatiling malinaw sa karaniwang mambabasa.
