  text: Oh[a], that now my words were written down! Oh[b], that they were inscribed in a book!
translation:
  language: tl
  text: O, sana'y maisulat na ngayon ang aking mga salita! O, sana'y maiukit ang mga ito sa isang aklat[a][b]!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “balumbon” o “nakasulat na dokumento.” Maaaring tumukoy ang salitang Hebreo sa isang aklat, balumbon, o iba pang nakasulat na dokumento.
    reason: cultural_note
  - marker: b
    text: O “maitala” o “maisulat.” Ipinahihiwatig ng pandiwang Hebreo ang pag-uukit o pagtatala sa paraang matibay at pangmatagalan, hindi lamang karaniwang pagsulat.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי יִתֵּן
  choice: O, sana'y
  rationale: Ang idyomang Hebreo ay nagpapahayag ng matinding hangarin, hindi literal na tanong kung sino ang magbibigay. Likas sa modernong Tagalog ang “O, sana’y” para sa optatibong diin.
- source_word: אֵפוֹ
  choice: ngayon
  rationale: Nagdaragdag ang kataga ng agarang damdamin at diin sa hangarin ni Job; pinananatili ito ng “ngayon” nang hindi labis na nagpapakahulugan.
- source_word: וְיִכָּתְבוּן
  choice: maisulat
  rationale: Ipinahihiwatig ng anyo ang pasibong pagsulat o pagtatala. Ang “maisulat” ay natural sa pangungusap na nagpapahayag ng hangarin.
- source_word: מִלָּי
  choice: aking mga salita
  rationale: Direkta at natural itong katumbas ng pangmaramihang pangngalan na may hulaping unang panauhan.
- source_word: בַּסֵּפֶר
  choice: sa isang aklat
  rationale: Maaaring tumukoy ang סֵפֶר sa aklat, balumbon, o nakasulat na dokumento. Malinaw sa karaniwang mambabasa ang “aklat,” habang inilalahad sa talababa ang lawak ng kahulugan.
- source_word: וְיֻחָקוּ
  choice: maiukit
  rationale: Ang חקק ay nagpapahiwatig ng pag-ukit o matibay na paglalapat ng mga titik. Pinananatili ng “maiukit” ang larawan ng pangmatagalang pagtatala at ang lakas ng parallelismo.
