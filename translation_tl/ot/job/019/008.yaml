base_translation:
  language: en
  yaml_path: translation/ot/job/019/008.yaml
  text: He has walled up my way so that I cannot pass[a], and he has set darkness upon my paths.
translation:
  language: tl
  text: Hinarangan niya ng pader ang aking daan upang hindi ako makadaan; at sa aking mga landas ay naglagay siya ng kadiliman.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָרְחִי
  choice: aking daan
  rationale: Ang pangngalan ay tumutukoy sa daan, landas, o takbo ng buhay. Likas sa modernong Tagalog ang “aking daan” at napapanatili nito ang literal at matalinghagang bisa.
- source_word: גָדַר
  choice: hinarangan ... ng pader
  rationale: Ipinahahayag ng pandiwa ang paglalagay ng pader, bakod, o harang. Mas malinaw at natural sa Tagalog ang pariralang ito kaysa sa “pinaderan,” habang pinananatili ang kongkretong larawan ng isang daang sinarhan ng pader.
- source_word: וְלֹא אֶעֱבוֹר
  choice: kaya hindi ako makaraan
  rationale: Ipinakikita ng “kaya” ang bunga ng pagharang. Ang “makaraan” ay tuwirang nagpapahayag na hindi makadaan o makatawid si Job.
- source_word: נְתִיבוֹתַי
  choice: aking mga landas
  rationale: Pinananatili ng “mga landas” ang maramihang anyo at ang makatang larawan ng iba't ibang rutang tinatahak ni Job.
- source_word: חֹשֶׁךְ
  choice: kadiliman
  rationale: Tuwirang katumbas ito ng darkness at angkop kapwa sa pisikal at matalinghagang kahulugan sa panaghoy ni Job.
- source_word: יָשִׂים
  choice: nilagyan
  rationale: Ang pandiwa ay nangangahulugang maglagay o magtakda. Natural sa Tagalog ang “nilagyan ... ng kadiliman” at napapanatili ang larawan ng kadilimang inilagay sa mga landas.
theological_decisions:
- issue: Tinutukoy ng di-binanggit na simuno sa ikatlong panauhan
  choice: niya
  alternative: ng Diyos / ng PANGINOON
  rationale: Walang tahasang simuno ang pandiwang Hebreo, bagaman malinaw sa konteksto na Diyos ang tinutukoy ni Job. Pinananatili ng “niya” ang di-tahasang pagtukoy at hindi nagdaragdag ng pangalang wala sa mismong talata.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang magkatugmang larawan ng daan at mga landas, pati ang kongkretong pader at kadilimang humahadlang sa paglalakbay.
