  text: וַ/יַּ֣חַר עָלַ֣/י אַפּ֑/וֹ וַ/יַּחְשְׁבֵ֖/נִי ל֣/וֹ כְ/צָרָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/job/019/011.yaml
  text: His anger burns against me[a], and he counts me as his enemies.
translation:
  language: tl
  text: Nag-alab laban sa akin ang galit niya[a], at itinuring niya akong isa sa kanyang mga kaaway.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Nagningas laban sa akin ang galit niya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחַר
  choice: Nag-alab
  rationale: Ang חרה kasama ng אַף ay idyoma para sa pagliyab o pag-init ng galit. Pinananatili ng “nag-alab” ang metapora at ang nakaraang anyo ng Hebreo sa natural na Tagalog.
- source_word: עָלַי
  choice: laban sa akin
  rationale: Sa konteksto ng galit, ang עַל ay nagpapahayag ng poot na nakatuon sa isang tao; malinaw itong naihahayag ng “laban sa akin.”
- source_word: אַפּוֹ
  choice: ang galit niya
  rationale: Bagaman literal na “ilong” ang אַף, karaniwan itong tumutukoy sa galit, lalo na sa idyomang ito. Natural at malinaw sa makabagong Tagalog ang “galit.”
- source_word: וַיַּחְשְׁבֵנִי
  choice: itinuring niya ako
  rationale: Ang חשב dito ay nangangahulugang ipalagay o ituring ang isang tao bilang kabilang sa isang uri.
- source_word: לוֹ
  choice: kanyang
  rationale: Ipinahihiwatig ng panghalip ang kaugnayan o pananaw ng kumikilos; natural itong isinasalin bilang pang-angking “kanyang.”
- source_word: כְצָרָיו
  choice: isa sa kanyang mga kaaway
  rationale: Maramihan ang צָרָיו, “kanyang mga kaaway.” Ginagawang natural ng “isa sa” ang pag-uuri kay Job sa maramihang pangkat nang hindi inaalis ang bilang na maramihan.
theological_decisions:
- issue: Tinutukoy ng ikatlong panauhang simuno at ng mga hulapi
  choice: Ang Diyos pa rin ang simuno, ayon sa nagpapatuloy na daing ni Job na kumikilos ang Diyos laban sa kanya.
  alternative: Isang hindi tinukoy na mapanlabang kumikilos
  rationale: Sa Job 19:6–12, paulit-ulit na iniuugnay ni Job sa Diyos ang mga pagkilos na ito. Pinananatili ng salin ang matinding teolohikal na tensiyon sa halip na palambutin ito.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang metapora ng nag-aalab na galit, ang nakaraang aspekto ng mga pandiwa, at ang maramihang “mga kaaway.”
