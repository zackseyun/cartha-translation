  text: חָדְל֥וּ קְרוֹבָ֑/י וּֽ/מְיֻדָּעַ֥/י שְׁכֵחֽוּ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/job/019/014.yaml
  text: My relatives have failed me[a], and my acquaintances have forgotten me.
translation:
  language: tl
  text: Pinabayaan ako ng mga kamag-anak ko[a], at kinalimutan ako ng mga kakilala ko.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Hindi na naririyan ang mga malapit sa akin.”
    reason: Ipinakikita nito ang mas literal na kahulugan ng חָדְלוּ (“tumigil” o “nawala”) at קְרוֹבָי (“mga malapit sa akin”), na maaaring tumukoy sa mga kamag-anak o malalapit na tao.
lexical_decisions:
- source_word: חָדְלוּ
  choice: pinabayaan ako
  rationale: Pangunahing kahulugan ng pandiwa ang “tumigil” o “mawala.” Sa kontekstong ang mga kamag-anak ang simuno, ipinahihiwatig nitong hindi na sila naririyan o umaalalay kay Job. Likas na naipapahayag ito sa Tagalog ng “pinabayaan ako,” habang inilalagay sa talababa ang mas literal na anyo.
- source_word: קְרוֹבָי
  choice: mga kamag-anak ko
  rationale: Ang קָרוֹב ay literal na “malapit,” ngunit maaari itong tumukoy sa mga kaanak. Ang “mga kamag-anak ko” ang pinakamalinaw at pinakanatural na modernong Tagalog sa kontekstong ito.
- source_word: וּמְיֻדָּעַי
  choice: mga kakilala ko
  rationale: Tumutukoy ito sa mga taong kilala ni Job. Pinananatili ng “mga kakilala ko” ang lawak ng salita nang hindi ipinapalagay na matatalik silang kaibigan.
- source_word: שְׁכֵחוּנִי
  choice: kinalimutan ako
  rationale: Tuwirang kahulugan ng שׁכח ang “kalimutan.” Ang “kinalimutan ako” ay malinaw, natural, at nagpapanatili sa bigat ng panaghoy ni Job.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na simple ngunit marangal. Ginamit ang magkatimbang na mga pariralang “Pinabayaan ako” at “kinalimutan ako” upang mapanatili ang maikli at matinding himig ng panaghoy.
