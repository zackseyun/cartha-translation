translation:
  language: tl
  text: Dumikit ang aking buto[a] sa aking balat at sa aking laman, at nakaligtas ako sa balat ng aking mga ngipin.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “aking buto” (pang-isahan), na malamang ay kolektibong tumutukoy sa buong balangkas ng katawan; maaari ring isaling “aking mga buto.”
    reason: lexical_alternative
  - marker: b
    text: O “sa pamamagitan ng balat ng aking mga ngipin.” Ang kakaibang pahayag na Hebreo ay karaniwang nauunawaang tumutukoy sa isang napakakitid o bahagya lamang na pagkaligtas.
    reason: idiom_explanation
lexical_decisions:
- source_word: בְּעוֹרִי וּבִבְשָׂרִי
  choice: sa aking balat at laman
  rationale: Ang עוֹר ay “balat” at ang בשר ay “laman.” Dahil ang pandiwang דבק ay nagpapahiwatig ng mahigpit na pagdikit, natural sa Tagalog ang pang-ukol na “sa.” Inilalarawan ng magkatambal na salita ang labis na pangangayayat ni Job.
- source_word: דָּבְקָה עַצְמִי
  choice: Dumikit ang aking buto
  rationale: Pinananatili ang pang-isahang עַצְמִי (“aking buto”), na maaaring gamiting kolektibo para sa balangkas ng katawan. Ang “dumikit” ay tuwirang nagpapahayag ng mahigpit na pagkapit o pagkakadikit.
- source_word: וָאֶתְמַלְּטָה
  choice: at nakaligtas ako
  rationale: Ang מלט ay tumutukoy sa pagtakas o pagkaligtas. Ang aspektong ganap ng “nakaligtas” ay angkop sa kalagayang inilalarawan ni Job bilang natitirang buhay.
- source_word: בְּעוֹר שִׁנָּי
  choice: sa pamamagitan ng balat ng aking mga ngipin
  rationale: Pinananatili ang kapansin-pansin at sadyang palaisipang larawang Hebreo sa halip na palitan agad ng paliwanag na “bahagya lamang.” Ang “sa pamamagitan ng” ay kumakatawan sa instrumental na gamit ng בְּ, samantalang ipinaliliwanag sa talababa ang diwa ng napakakitid na pagkaligtas.
