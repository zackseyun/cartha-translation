base_translation:
  language: en
  yaml_path: translation/ot/job/019/021.yaml
  text: Have pity on me[a], have pity on me, you my friends[b], for the hand of God has struck me.
translation:
  language: tl
  text: Mahabag kayo sa akin[a], mahabag kayo sa akin, kayong mga kaibigan ko, sapagkat tinamaan ako ng kamay ng Diyos.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Kaawaan ninyo ako” o “Magpakita kayo ng awa sa akin.”
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “humipo sa akin ang kamay ng Diyos.” Sa kontekstong ito, ang paghipo ay nagpapahiwatig ng mapaminsalang pagtama.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָנֻּנִי
  choice: Mahabag kayo sa akin
  rationale: Ang maramihang pautos mula sa חנן ay tuwirang pakiusap ni Job sa kaniyang mga kaibigan na pakitunguhan siya nang may awa. Likas sa makabagong Tagalog ang “mahabag kayo sa akin,” at napapanatili nito ang tindi ng pakiusap.
- source_word: חָנֻּנִי (inuulit)
  choice: mahabag kayo sa akin
  rationale: Pinanatili ang buong pag-uulit upang maipahayag ang matinding damdamin at mapilit na pagsusumamo ni Job.
- source_word: רֵעָי
  choice: kayong mga kaibigan ko
  rationale: Karaniwang tumutukoy ang רֵעַ sa kaibigan o kasama. Pinananatili ng parirala ang tuwirang pagtawag ni Job sa mga taong inaasahan niyang mahahabag sa kaniya.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala nito ang dahilan ng pakiusap. Ang “sapagkat” ay malinaw, marangal, at angkop sa tulang konteksto.
- source_word: יַד אֱלוֹהַּ
  choice: kamay ng Diyos
  rationale: Pinananatili ang konkretong metapora ng Hebreo para sa pagkilos o kapangyarihan ng Diyos sa halip na gawing abstraktong pahayag.
- source_word: אֱלוֹהַּ
  choice: Diyos
  rationale: Ang אֱלוֹהַּ ay patulang anyong isahan para sa Diyos; walang batayan sa talata upang palawakin ito bilang “Diyos na Makapangyarihan sa lahat.”
- source_word: נָגְעָה בִּי
  choice: hinagupit ako
  rationale: Ang נגע na may בְּ ay maaaring mangahulugang humipo, sumakit, o manakit. Sa konteksto ng pagdurusa ni Job, ipinahihiwatig nito ang mapaminsalang pagdapo; malinaw itong naipapahayag ng “hinagupit ako,” habang inilalagay sa talababa ang mas literal na “humipo sa akin.”
theological_decisions:
- issue: Ang pagkilos ng Diyos sa pagdurusa ni Job
  choice: hinagupit ako ng kamay ng Diyos
  alternative: humipo sa akin ang kamay ng Diyos; pinahirapan ako ng kamay ng Diyos
  rationale: Tahasang iniuugnay ng Hebreo ang pagdurusa ni Job sa kamay ng Diyos. Pinananatili ng salin ang mahirap na teolohikal na tensiyong ito nang hindi ito pinalalambot, ipinapaliwanag, o isinasalalay sa isang partikular na doktrina.
translation_notes:
  register: Makabago ngunit marangal na Tagalog. Ginamit ang maramihang “kayo” dahil maraming kaibigan ang kinakausap, pinanatili ang emosyonal na pag-uulit, at iniwasan ang labis na teknikal o makalumang pananalita.
