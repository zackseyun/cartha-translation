  yaml_path: translation/ot/job/019/010.yaml
  text: He tears me down on every side[a], and I am gone; he has uprooted my hope like a tree.
translation:
  language: tl
  text: Winasak niya ako sa lahat ng panig, at ako'y naglaho[a]; binunot niya ang pag-asa ko na parang isang puno.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “at ako''y umalis” o “at ako''y napahamak.” Literal sa Hebreo, “at ako''y pumunta,” na malamang ay nagsasaad ng bunga ng pagkawasak kay Job: siya''y naglaho o napawi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִתְּצֵנִי
  choice: Winasak niya ako
  rationale: Ang pandiwang נתץ ay tumutukoy sa paggiba o pagwasak. Ang “winasak” ay natural sa Filipino at pinananatili ang matinding larawan ng lubusang pagkawasak ni Job.
- source_word: סָבִיב
  choice: sa lahat ng panig
  rationale: Ipinahahayag nito na ang pagkawasak ay nakapaligid at ganap, hindi lamang mula sa isang direksiyon.
- source_word: וָאֵלַךְ
  choice: at ako'y naglaho
  rationale: Literal itong “at ako'y umalis/pumunta,” ngunit sa konteksto ay nagsasaad ng bunga ng paggiba—si Job ay nawalan ng katayuan o wari'y napawi. Ang talababa ay nagpapanatili sa literal at posibleng alternatibong diwa.
- source_word: וַיַּסַּע
  choice: binunot niya
  rationale: Ang נסע ay maaaring mangahulugang alisin o hugutin ang isang bagay na nakapirmi. Dahil inihahambing sa puno ang pag-asa, ang “binunot” ang malinaw at natural na katumbas.
- source_word: כָּעֵץ
  choice: parang puno
  rationale: Pinananatili nito ang tuwirang paghahambing sa puno at natural itong pakinggan sa modernong Filipino.
- source_word: תִּקְוָתִי
  choice: ang pag-asa ko
  rationale: Ang תִּקְוָה ay karaniwang nangangahulugang pag-asa o inaasahan; “pag-asa” ang pinakanatural at angkop sa panaghoy ni Job.
theological_decisions: []
translation_notes:
  register: Makabagong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “winasak” upang ihatid ang puwersa ng paggiba, at “binunot” upang mapanatili ang larawan ng punong inaalis mula sa pagkakaugat.
