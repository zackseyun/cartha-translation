base_translation:
  language: en
  yaml_path: translation/ot/job/019/009.yaml
  text: He has stripped my honor from me and removed the crown from my head[a].
translation:
  language: tl
  text: Hinubaran niya ako ng aking karangalan[a] at inalis ang korona sa aking ulo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “aking kaluwalhatian” o “aking dignidad.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּבוֹדִי
  choice: aking karangalan
  rationale: Ang כָּבוֹד ay maaaring tumukoy sa karangalan, kaluwalhatian, o dignidad. Sa konteksto ng pagkapahiya at pagkawala ng katayuan ni Job, likas at malinaw sa modernong Tagalog ang “karangalan,” habang pinananatili sa talababa ang mga tunay na alternatibo.
- source_word: מֵעָלַי
  choice: ako
  rationale: Literal itong “mula sa ibabaw ko,” ngunit sa idyomang Tagalog na “hinubaran niya ako ng,” malinaw nang naipapahayag ang pag-aalis nang hindi nagiging pilit ang pananalita.
- source_word: הִפְשִׁיט
  choice: Hinubaran
  rationale: Pinananatili nito ang matingkad na larawan ng pag-aalis ng isang kasuotan o pantakip; dito, ang karangalan ang metaporikal na inaalis kay Job.
- source_word: וַיָּסַר
  choice: inalis
  rationale: Karaniwang ipinahihiwatig ng hiphil ng סור ang pag-aalis o pagkuha. Ang “inalis” ay tuwiran at maayos na kaagapay ng “hinubaran.”
- source_word: עֲטֶרֶת
  choice: korona
  rationale: Ang salita ay tumutukoy sa korona o putong bilang sagisag ng karangalan at katayuan. “Korona” ang pinakakaraniwan at malinaw na katumbas sa modernong Tagalog.
- source_word: רֹאשִׁי
  choice: aking ulo
  rationale: Tuwirang pinananatili ang larawan ng koronang nasa ulo, na mahalaga sa paralelismong patula ng talata.
theological_decisions:
- issue: Ang tinutukoy ng di-pinangalanang gumagawa ng kilos
  choice: Ginamit ang “niya,” na sa konteksto ay tumutukoy sa Diyos bilang siyang nagpahiya kay Job.
  alternative: Maaaring unawain bilang isang di-tiyak na kalaban o pangyayari.
  rationale: Hindi tahasang pinangalanan ng Hebreo ang Diyos sa talatang ito. Kaya pinananatili ng salin ang panghalip lamang, sa halip na idagdag ang “Diyos,” upang mapanatili ang kaiklian at tensiyong teolohikal ng orihinal.
translation_notes:
  register: Modernong Filipino Tagalog na dignified ngunit madaling maunawaan. Pinanatili ang dalawang magkatugmang larawan—paghuhubad ng karangalan at pag-aalis ng korona—nang hindi tahasang pinapangalanan ang gumagawa ng kilos.
