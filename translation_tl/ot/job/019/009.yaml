  source_fidelity: Tumpak ang salin sa Hebreo. Ang “Hinubaran niya ako ng aking karangalan” ay angkop na pagpapahayag ng הִפְשִׁיט ... כְּבוֹדִי at napapanatili ang metapora ng sapilitang pag-aalis. Ang “inalis ang korona sa aking ulo” ay tapat sa וַיָּסַר עֲטֶרֶת רֹאשִׁי at pinananatili ang patulang paralelismo. Hindi idinagdag ang Diyos bilang paksa, kaya nananatili ang di-tahasang panghalip ng Hebreo.
