translation_notes:
  register: Modernong Filipino Tagalog na tuwiran at marangal. Ginamit ang maramihang “ninyo” ayon sa anyong maramihan ng mga pandiwa sa Hebreo. Pinanatili ang matinding talinghaga ng pagdurog, habang ang footnote ay nagpapakita ng alternatibong pagbasa na higit na tahasang tumutukoy sa panloob na dalamhati.
