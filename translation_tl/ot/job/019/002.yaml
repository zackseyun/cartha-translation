  text: Hanggang kailan ninyo ako pahihirapan at dudurugin sa inyong mga salita?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Hanggang kailan ninyo palulumbayin ang aking kalooban at dudurugin sa inyong mga salita?”
