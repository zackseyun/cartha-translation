lexical_decisions:
- source_word: עַד אָנָה
  choice: Hanggang kailan
  rationale: Likas na pormula ng panaghoy at retorikal na tanong sa Tagalog; pinananatili ang diwa ng patuloy na pagtitiis.
- source_word: תּוֹגְיוּן
  choice: ninyo ako pahihirapan
  rationale: Ang Hiphil ng יגה/יגה ay nagsasaad ng pagdudulot ng dalamhati o paghihirap. Ang “pahihirapan” ay natural at sapat na malakas sa modernong Tagalog.
- source_word: נַפְשִׁי
  choice: ako
  rationale: Dito, ang נֶפֶשׁ ay tumutukoy sa mismong persona o panloob na pagkatao ni Job. Iniiwasan ng “ako” ang di-likas o posibleng dualistikong dating ng “aking kaluluwa.”
- source_word: וּתְדַכְּאוּנַנִי
  choice: at dudurugin
  rationale: Pinananatili ang marahas at matalinghagang lakas ng ugat na דכא, na nagpapahiwatig ng pagdurog o lubos na pagpapabagsak.
- source_word: בְמִלִּים
  choice: sa pamamagitan ng mga salita
  rationale: 'Ipinakikita ang instrumental na gamit ng בְּ: ang kanilang mga salita ang paraang ginagamit upang durugin si Job.'
