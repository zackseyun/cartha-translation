  text: גַּם עֲ֭וִילִים מָ֣אֲסוּ בִ֑/י אָ֝ק֗וּמָה וַ/יְדַבְּרוּ בִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/019/018.yaml
  text: Even little children despise me; when I rise[a], they speak against me.
translation:
  language: tl
  text: Kahit ang mga bata ay humahamak sa akin; kapag tumatayo ako, nagsasalita sila laban sa akin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga hangal,” “mga lapastangan,” o “mga batang lalaki.” Ang salitang Hebreo ay karaniwang tumutukoy sa mga taong hangal o walang moral na unawa, ngunit dito ay inuunawa ito ng marami bilang mga bata o kabataang walang gaanong katayuan na humahamak kay Job.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: Kahit
  rationale: 'Nagpapahayag ito ng pagdidiin at pagpapatuloy sa hinaing ni Job: pati ang mga hindi inaasahang hahamak sa kanya ay gumagawa nito.'
- source_word: עֲוִילִים
  choice: mga bata
  rationale: Mahirap tiyakin ang tiyak na diwa ng salita. Maaari itong tumukoy sa mga hangal o lapastangan, ngunit sa konteksto ay malamang na tumutukoy sa mga bata o kabataang mababa ang katayuan, na lalo pang nagpapakita ng kahihiyan ni Job. Inilalahad sa talababa ang ibang posibilidad.
- source_word: מָאֲסוּ בִי
  choice: humahamak sa akin
  rationale: Ang מאס ay nagpapahiwatig ng mapanghamak na pagtanggi. Likas sa Filipino ang “humahamak sa akin” at angkop sa himig ng talata.
- source_word: אָקוּמָה
  choice: kapag tumatayo ako
  rationale: 'Sa konteksto, ang anyo ay natural na nauunawaan bilang temporal o paulit-ulit na pangyayari: tuwing tumatayo si Job, nagsasalita sila laban sa kanya.'
- source_word: וַיְדַבְּרוּ בִי
  choice: nagsasalita sila laban sa akin
  rationale: Pinananatili nito ang kilos ng pagsasalita at ang masamang pakay na ipinahihiwatig ng ב sa konteksto, nang hindi tahasang nililimitahan ito sa panunuya.
theological_decisions: []
translation_notes:
  register: Makabago at marangal na Filipino, na gumagamit ng payak na parirala. Ang “mga bata” ay mas natural kaysa “maliliit na bata” at hindi labis na nililimitahan ang maaaring edad; pinananatili ng talababa ang tunay na leksikal na kalabuan.
