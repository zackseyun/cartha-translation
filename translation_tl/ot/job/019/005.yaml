lexical_decisions:
- source_word: אִם אָמְנָם
  choice: Kung talagang
  rationale: Pinananatili ng “kung” ang kondisyonal na anyo at ng “talagang” ang mariing diwa ng אָמְנָם, sa natural na makabagong Tagalog.
- source_word: עָלַי תַּגְדִּילוּ
  choice: itinataas ninyo ang inyong sarili laban sa akin
  rationale: Inilalarawan ng Hiphil ng גדל ang pagpapakadakila ng mga kausap sa kapinsalaan ni Job. Pinananatili ng salin ang larawan ng pagtataas sa sarili at ang mapanlabang gamit ng עָלַי.
- source_word: וְתוֹכִיחוּ
  choice: at ginagamit ninyo ... bilang katibayan
  rationale: Maaaring mangahulugan ang Hiphil ng יכח na mangatuwiran, magpatunay, o magtatag ng kaso. Ipinahahayag ng salin ang forensic na diwa sa malinaw at likas na Tagalog nang hindi lubusang inaalis ang posibilidad ng pakikipagtalo.
- source_word: חֶרְפָּתִי
  choice: aking kahihiyan
  rationale: Saklaw ng חֶרְפָּה ang kahihiyan, kadustaan, at paghamak sa paningin ng iba. Ang “aking kahihiyan” ay malinaw at karaniwan sa makabagong Tagalog.
