translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang kondisyonal na simula at ang mapanumbat na tono ni Job. Ang “itinataas ninyo ang inyong sarili” ay mas malinaw kaysa sa literal ngunit di-likas na “pinalalaki ninyo ang inyong sarili,” samantalang ang “bilang katibayan” ay naghahatid ng posibleng legal o forensic na himig ng ikalawang pandiwa.
