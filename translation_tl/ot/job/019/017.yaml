base_translation:
  language: en
  yaml_path: translation/ot/job/019/017.yaml
  text: My breath is repulsive to my wife[b][a], and I am loathsome to the sons of my own body.
translation:
  language: tl
  text: Nakasusuklam sa aking asawa ang hininga ko, at kasuklam-suklam ako sa mga anak na mula sa sarili kong katawan.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O, ayon sa ibang pagkaunawa sa mahirap na Hebreo: “at nagsusumamo ako sa mga anak na mula sa sarili kong katawan” o “nakikiusap ako sa kanila na maawa sa akin.”'
    reason: alternative_reading
  - marker: b
    text: Sa literal na Hebreo, “mga anak ng aking tiyan.” Maaaring tumukoy ang pahayag sa sariling mga anak ni Job o, sa mas malawak na diwa, sa kanyang malalapit na kadugo.
    reason: cultural_note
lexical_decisions:
- source_word: רוּחִי
  choice: ang hininga ko
  rationale: Maaaring mangahulugan ang רוּחַ ng hininga, hangin, o espiritu. Sa konteksto ng pisikal na karamdaman ni Job at paglayo ng kanyang asawa, ang kongkretong kahulugang “hininga” ang pinakaangkop.
- source_word: זָרָה
  choice: nakasusuklam
  rationale: Pangunahing ipinahihiwatig ng salita ang pagiging banyaga o kakaiba, ngunit sa relasyong inilalarawan dito ay may diwang pagtataboy o pagkasuklam. Ang “nakasusuklam” ay likas sa Filipino at malinaw na naghahatid ng ganitong reaksiyon.
- source_word: לְאִשְׁתִּי
  choice: sa aking asawa
  rationale: Tinutukoy ng לְ ang taong nakararanas ng reaksiyon; ang “sa aking asawa” ang natural na katumbas sa pangungusap.
- source_word: וְחַנֹּתִי
  choice: at kasuklam-suklam ako
  rationale: Napakahirap ng anyong Hebreo at pinagtatalunan ang kahulugan. Pinili sa pangunahing teksto ang pagbasa ng pagkasuklam dahil umaayon ito sa parallelismo ng unang sugnay at sa tema ng pagtatakwil kay Job. Nasa talababa ang pagbasa mula sa ideya ng pagsusumamo o paghingi ng awa.
- source_word: לִבְנֵי בִטְנִי
  choice: sa mga anak na mula sa sarili kong katawan
  rationale: Literal itong “sa mga anak ng aking tiyan/sinapupunan.” Pinananatili ng salin ang pisikal na larawan ng pagkakamag-anak nang hindi gumagamit ng di-likas na pahayag na tila may sinapupunan si Job; maaari rin itong tumukoy nang mas malawak sa malalapit na kadugo.
theological_decisions:
- issue: Pagkakakilanlan ng “mga anak na mula sa sarili kong katawan”
  choice: Pinanatili ang literal na larawang maaaring tumukoy sa sariling mga anak ni Job.
  alternative: Isalin nang tahasan bilang “malalapit kong kadugo.”
  rationale: Hindi tiyak kung sariling mga anak o mas malawak na mga kadugo ang tinutukoy. Hindi nilutas ng pangunahing salin ang tunay na kalabuan; ipinaliwanag ito sa talababa.
- issue: Kahulugan ng וְחַנֹּתִי
  choice: “at kasuklam-suklam ako” sa pangunahing teksto
  alternative: “at nagsusumamo ako” o “at ang pakiusap ko”
  rationale: Parehong kinikilala ang tekstuwal at leksikal na kahirapan. Mas magkahanay ang unang pagbasa sa naunang sugnay, samantalang pinananatili sa talababa ang alternatibong pagbasa tungkol sa paghingi ng awa.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “nakasusuklam/kasuklam-suklam” upang maging malinaw at natural ang magkatulad na larawan ng pagtataboy, habang pinanatili sa talababa ang tunay na kalabuan ng mahirap na ikalawang sugnay.
