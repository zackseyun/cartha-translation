  yaml_path: translation/ot/job/019/022.yaml
  text: Why do you pursue me like God[b][a], and are not satisfied with my flesh?
translation:
  language: tl
  text: Bakit ninyo ako inuusig na gaya ng Diyos[a], at hindi kayo nasisiyahan sa aking laman?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O kaya, “na gaya ng isang diyos.” Ang Hebreong אֵל ay maaari ring mangahulugang “diyos” o, bagaman mas di-malamang dito, “makapangyarihang nilalang.”
    reason: alternative_reading
  - marker: b
    text: Sa literal, “mula sa aking laman.” Malamang na ang idyoma ay nangangahulugang para bang hindi sila mabusog sa paglapà sa mismong laman ni Job—isang matingkad na larawan ng walang-lubay na pag-uusig.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָמָּה
  choice: Bakit
  rationale: Likas at tuwirang katumbas ng pang-abay na patanong na nagpapahayag ng pagtutol ni Job.
- source_word: תִּרְדְּפֻנִי
  choice: ninyo ako inuusig
  rationale: Ang רדף ay maaaring mangahulugang humabol, tumugis, o umusig. Sa konteksto ng mapanlabang pakikitungo ng mga kasama ni Job, malinaw na naipapahayag ng “uusig” ang patuloy na pag-atake nang hindi nililimitahan sa literal na paghahabol.
- source_word: כְמוֹ
  choice: na gaya ng
  rationale: Natural na paghahambing sa modernong Filipino para sa payak na Hebreong katagang komparatibo.
- source_word: אֵל
  choice: Diyos
  rationale: Malamang na ang Diyos ang tinutukoy sa paghahambing, bagaman maaari ring unawain ang salita bilang “isang diyos” o, mas di-malamang dito, “isang makapangyarihan.”
- source_word: וּמִבְּשָׂרִי
  choice: sa aking laman
  rationale: Pinananatili ang kongkretong larawang “laman” at ang kaugnayan nito sa pandiwang “masiyahan.” Ipinahihiwatig ng Hebreo ang pagiging busog o sapat mula sa laman ni Job, na parang siya ay nilalapa.
- source_word: לֹא תִשְׂבָּעוּ
  choice: hindi kayo nasisiyahan
  rationale: Ipinapahayag ng שבע ang pagiging busog o ganap na nasiyahan. Ang anyong ito ay natural sa Filipino at pinananatili ang larawan ng walang-kasiyahang pagkapoot.
theological_decisions:
- issue: Ang tinutukoy ng אֵל sa paghahambing na כְמוֹ אֵל
  choice: Diyos
  alternative: isang diyos; isang makapangyarihan
  rationale: Sa konteksto, inihahambing ni Job ang pag-uusig ng kanyang mga kasama sa matinding pakikitungo ng Diyos sa kanya. Ginagamit ang “Diyos” sa pangunahing teksto, ngunit pinananatili sa talababa ang tunay na leksikal na posibilidad ng ibang pagbasa.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang maramihang “ninyo/kayo” dahil maramihan ang Hebreong mga pandiwa. Pinanatili ang kongkretong “laman” at ang retorikal na tanong, pati ang hindi ganap na tiyak na kahulugan ng אֵל sa pamamagitan ng talababa.
