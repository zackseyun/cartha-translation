  yaml_path: translation/ot/job/019/004.yaml
  text: And even if I truly have gone astray[a], my error remains with me.
translation:
  language: tl
  text: At kahit talagang nagkamali ako, sa akin nananatili ang pagkakamali ko.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa mas literal na salin, “sa akin tumutuloy ang pagkakamali ko.”
    reason: Pinananatili sa talababa ang larawan ng pandiwang Hebreo na nangangahulugang “tumuloy” o “magpalipas ng gabi.”
lexical_decisions:
- source_word: וְאַף
  choice: At kahit
  rationale: 'Iniuugnay nito ang pahayag sa nauna at ipinahahayag ang mapagbigay na pagpapalagay: kahit ipagpalagay na nagkamali si Job.'
- source_word: אָמְנָם
  choice: totoong
  rationale: Pinananatili nito ang pagbibigay-diin ng pang-abay sa isang natural at marangal na paraan sa makabagong Tagalog.
- source_word: שָׁגִיתִי
  choice: nagkamali ako
  rationale: Maaaring tumukoy ang pandiwa sa pagkaligaw o pagkakamali. Ang “nagkamali” ay malinaw sa konteksto at hindi labis na nagpapakahulugan dito bilang tahasang pagkakasala.
- source_word: אִתִּי
  choice: sa akin
  rationale: Ipinahihiwatig ng parirala na ang pagkakamali ay nananatiling sariling usapin ni Job; hindi kinakailangang unawain itong “laban sa akin.”
- source_word: תָּלִין
  choice: mananatili
  rationale: Ang literal na larawan ay ang pagpapalipas ng gabi o pagtuloy, ngunit dito ay idyomatikong nagsasaad ng patuloy na pananatili.
- source_word: מְשׁוּגָתִי
  choice: ang pagkakamali ko
  rationale: Tumutukoy ang pangngalan sa pagkakamali o pagkaligaw at kauri ng naunang pandiwa. Iniiwasan ng saling ito ang mas tiyak na “kasalanan.”
theological_decisions:
- issue: Kung ang sinabi ni Job ay pag-amin ng moral na kasalanan
  choice: Isinalin bilang “nagkamali” at “pagkakamali,” nang hindi tinutukoy na kasalanan ito.
  alternative: “Nagkasala ako” at “kasalanan ko”
  rationale: Ang mga salitang Hebreo ay maaaring tumukoy sa pagkaligaw o pagkakamali at hindi sa kontekstong ito nangangailangan ng tahasang pag-amin ng moral na pagkakasala.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “At kahit totoong” upang mapanatili ang ugnay, pagbibigay-diin, at mapagbigay na pagpapalagay ng Hebreo; inilagay ang panandang [a] matapos ang sugnay na tinutukoy nito.
