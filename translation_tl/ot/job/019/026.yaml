  text: And after my skin has been destroyed[b][a], yet from my flesh I will see God.
translation:
  language: tl
  text: Matapos mawasak ang aking balat[b], gayunman, mula sa aking laman ay makikita ko ang Diyos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa aking laman ay makikita ko ang Diyos”; o kaya, “nang wala ang aking laman ay makikita ko ang Diyos.” Mahirap unawain ang pariralang Hebreo at isinasalin ito sa iba’t ibang paraan.
    reason: alternative_reading
  - marker: b
    text: Mahirap ang mga salita at pagkakabuo ng sugnay na “matapos mawasak ang aking balat.” Mas literal itong maaaring isalin na “matapos nilang tuklapin ang aking balat—ito.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַחַר
  choice: At matapos
  rationale: Pinananatili ang pagkakaugnay sa naunang pahayag at ang temporal na diwa ng parirala.
- source_word: עוֹרִי
  choice: aking balat
  rationale: Karaniwan at tuwirang katumbas sa konteksto ng katawan at pagdurusa ni Job.
- source_word: נִקְּפוּ זֹאת
  choice: mawasak
  rationale: Mahirap ang pandiwa at pagkakabuo ng sugnay. Ipinahahayag ng pasibong anyo ang pagkasira ng balat nang hindi ipinipilit ang mas literal ngunit malabong 'matuklap' o ang hiwalay na pagsasalin sa זֹאת.
- source_word: וּמִבְּשָׂרִי
  choice: mula sa aking laman
  rationale: Pinananatili ang pinakatuwirang diwa ng מִן bilang 'mula sa' at ang kongkretong larawan ng laman, habang hindi nilulutas ang kilalang sintaktiko at teolohikal na kalabuan.
- source_word: אֶחֱזֶה
  choice: makikita ko
  rationale: Malinaw at likas na modernong Tagalog para sa pagkakita o pagmamasid.
- source_word: אֱלוֹהַּ
  choice: ang Diyos
  rationale: Tuwiran at angkop na salin ng katawagan para sa Diyos sa aklat ni Job.
theological_decisions:
- issue: Kung tahasang itinuturo ng וּמִבְּשָׂרִי ang pagkabuhay na muli ng katawan
  choice: Isinalin bilang 'mula sa aking laman' at pinanatili ang tensiyon ng talata.
  alternative: '''sa aking laman'' o ''nang wala na ang aking laman'''
  rationale: Pinagtatalunan ang gamit ng pang-ukol at ang sintaks. Ang 'sa aking laman' ay higit na magpapahiwatig ng pangkatawang pagkabuhay na muli, samantalang ang 'nang wala na ang aking laman' ay magpapahiwatig ng pagkakitang hiwalay sa katawan. Hindi nilulutas ng pangunahing teksto ang higit sa malinaw na pinahihintulutan ng Hebreo.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Ginamit ang 'laman' upang mapanatili ang pisikal na larawan at ang kalabuan ng Hebreo; iniwasan ang saling magtatakda agad ng isang tiyak na doktrinal na pagbasa.
