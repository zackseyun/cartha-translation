  yaml_path: translation/ot/job/019/029.yaml
  text: Be afraid of the sword yourselves[a], for wrath brings the punishments of the sword, so that you may know that there is judgment.
translation:
  language: tl
  text: Matakot kayo mismo sa tabak, sapagkat ang poot ay nagdudulot ng mga parusang dumarating sa pamamagitan ng tabak, upang malaman ninyo na may paghatol[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “na umiiral ang Makapangyarihan”; mahirap unawain ang pangwakas na pananalita sa Hebreo at maaari ring isalin na “na may mga paghatol” o “na may isang hukom.”
    reason: alternative_reading
lexical_decisions:
- source_word: גּוּרוּ
  choice: matakot
  rationale: Ang maramihang pautos ay isang mariing babala; natural at malinaw sa makabagong Tagalog ang “matakot.”
- source_word: לָכֶם
  choice: kayo mismo
  rationale: 'Ipinahahayag nito ang diin ng datibong panghalip: ang mga kausap mismo ang dapat mangamba.'
- source_word: מִפְּנֵי חֶרֶב
  choice: sa tabak
  rationale: Sa kasunod ng “matakot,” natural na ipinahahayag ng “sa tabak” ang kinatatakutang panganib nang hindi dinaragdagan ang kahulugan.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala nito ang dahilan ng naunang babala.
- source_word: חֵמָה
  choice: poot
  rationale: Ipinapanatili ng “poot” ang matinding galit na may moral at hudisyal na himig.
- source_word: עֲוֺנוֹת
  choice: mga parusa
  rationale: Bagaman madalas itong tumutukoy sa mga kasamaan o sala, sa kontekstong ito ay maaari itong tumukoy sa mga kaparusahang bunga ng pagkakasala.
- source_word: חָרֶב
  choice: ng tabak
  rationale: Pinananatili nito ang maikli at siksik na ugnayan ng mga parusa sa tabak sa Hebreo.
- source_word: לְמַעַן
  choice: upang
  rationale: Karaniwang panandang nagpapahayag ng layunin o nilalayong resulta.
- source_word: תֵּדְעוּן
  choice: malaman ninyo
  rationale: Ang di-ganap na pandiwang maramihan pagkatapos ng לְמַעַן ay likas na nagpapahayag ng layunin.
- source_word: שדין
  choice: na may paghatol
  rationale: Mahirap at may ilang posibleng pakahulugan ang anyong Hebreo. Ang “may paghatol” ay angkop sa babala ng konteksto at hindi labis na tinutukoy kung sino o ano ang nasa likod nito.
theological_decisions:
- issue: Pakahulugan sa mahirap na pangwakas na pananalitang שדין
  choice: na may paghatol
  alternative: na umiiral ang Makapangyarihan; na may mga paghatol; na may isang hukom
  rationale: Hindi tiyak sa teksto at leksikon ang pangwakas na anyo. Pinakamalinaw sa konteksto ang paghatol, ngunit mahalaga ang ibang sinaunang o posibleng pagbasa kaya inilalahad ang mga iyon sa talababa sa halip na tahimik na lutasin ang tensiyon.
translation_notes:
  register: Makabago ngunit marangal na Tagalog. Ginamit ang “tabak,” “poot,” at “paghatol” upang mapanatili ang seryoso at hudisyal na himig. Ang panandang [a] ay inilagay sa pangunahing teksto bagaman ang talababa ay tumutukoy sa mahirap na pangwakas na parirala, alinsunod sa ibinigay na ayos ng konsultasyong teksto.
