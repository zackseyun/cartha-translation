translation:
  language: tl
  text: Sampung beses na ninyo akong ipinahiya; hindi man lamang kayo nahihiyang gawan ako ng masama.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pagmalupitan ako” o, marahil, “ituring akong parang isang estranghero.” Mahirap tiyakin ang kahulugan ng pandiwang Hebreo; maaari itong tumukoy sa pakikitungo kay Job na para bang siya ay dayuhan o hindi nila kilala.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶה עֶשֶׂר פְּעָמִים
  choice: Sampung beses na
  rationale: Pinananatili ang bilang at retorikal na diin ng Hebreong idyoma, habang ang “na” ay likas na nagpapahayag ng paulit-ulit na kilos sa Filipino.
- source_word: תַּכְלִימוּנִי
  choice: ninyo akong ipinahiya
  rationale: Ipinahahayag ng anyong Hiphil ng כלם ang pagsasanhi ng hiya o kahihiyan; natural at tuwiran sa modernong Tagalog ang “ipinahiya.”
- source_word: לֹא תֵבֹשׁוּ
  choice: hindi man lamang kayo nahihiya
  rationale: Tuwirang pinananatili ang moral na paratang ng בוש, at ipinadarama ng “man lamang” ang pagkabigla ni Job sa kawalan nila ng hiya.
- source_word: תַּהְכְּרוּ לִי
  choice: ituring akong parang isang estranghero
  rationale: Ang mahirap na Hiphil ng נכר ay maaaring magpahiwatig ng pakikitungo kay Job bilang dayuhan, di-kilala, o taong itinatakwil. Pinananatili ng salin ang kongkretong larawan at ang tunay na leksikal na tensiyon.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang maramihang “ninyo/kayo” ayon sa anyong maramihan ng mga pandiwang Hebreo. Inilagay ang talababa sa mahirap na huling pandiwa upang hindi ikubli ang leksikal na kalabuan.
