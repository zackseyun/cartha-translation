  source_fidelity: Tumpak ang “Sampung beses na ninyo akong ipinahiya” para sa retorikal na bilang at sa sanhiang diwa ng תַּכְלִימוּנִי. Tumpak din ang paratang na wala silang hiya. Gayunman, ang “ituring akong parang isang estranghero” ay isang posibleng mas literal na pagbasa ng mahirap na תַּהְכְּרוּ לִי, ngunit masyado itong tiyak bilang pangunahing salin; hindi ito ang nag-iisang o malinaw na kahulugan ng pandiwa sa talatang ito.
  naturalness: Natural at marangal ang unang hati ng pangungusap. Mas likas at mas hindi mapilit na gamitin ang malawak na “gawan ako ng masama” sa pangunahing teksto, habang inilalagay sa talababa ang posibleng larawan ng pagtrato kay Job bilang di-kilala o dayuhan.
  terminology: Ang “ipinahiya” at “nahihiya” ay angkop na modernong Filipino Tagalog. Pinananatili ng “gawan ako ng masama” ang paratang ng maling pagtrato nang hindi isinasara ang pinagtatalunang saklaw ng Hiphil ng נכר.
