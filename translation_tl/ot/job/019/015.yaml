  text: גָּ֘רֵ֤י בֵיתִ֣/י וְ֭/אַמְהֹתַ/י לְ/זָ֣ר תַּחְשְׁבֻ֑/נִי נָ֝כְרִ֗י הָיִ֥יתִי בְ/עֵינֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/job/019/015.yaml
  text: The guests in my house and my female servants count me as a stranger; I have become a foreigner in their eyes.
translation:
  language: tl
  text: Ang mga nakikituloy sa aking bahay[a] at ang mga babaeng lingkod ko ay itinuturing akong estranghero; naging dayuhan ako sa paningin nila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga panauhin sa aking bahay” o “mga dayuhang naninirahan sa aking bahay.”
    reason: Malawak ang saklaw ng גֵּר at maaaring tumukoy sa panauhin, nakikituloy, o dayuhang naninirahan.
lexical_decisions:
- source_word: גָּרֵי בֵיתִי (gārê vêti)
  choice: mga nakikituloy sa aking bahay
  rationale: Ang גֵּר ay maaaring tumukoy sa panauhin, pansamantalang naninirahan, o dayuhang naninirahan. Ipinahahayag ng “nakikituloy” ang kanilang paninirahan sa sambahayan nang hindi labis na nililimitahan ang katayuan nila.
- source_word: אַמְהֹתַי (ʾamhōtai)
  choice: mga babaeng lingkod ko
  rationale: Tuwirang ipinakikita ang kasarian at tungkulin ng mga tinutukoy, sa natural at dignified na modernong Tagalog.
- source_word: לְזָר (lezār)
  choice: estranghero
  rationale: Ipinahahayag ang pagkilala sa kanya bilang isang taong hindi kabilang o hindi kilala.
- source_word: נָכְרִי (nokhrî)
  choice: dayuhan
  rationale: Pinananatili ang magkaugnay ngunit magkaibang salita ng Hebreo sa pamamagitan ng “estranghero” at “dayuhan,” sa halip na gawing iisang termino ang dalawa.
- source_word: בְעֵינֵיהֶם (veʿênêhem)
  choice: sa paningin nila
  rationale: Natural na katumbas ng idyomang Hebreo na tumutukoy sa kanilang pagkilala o pagtingin kay Job.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Pinanatili ang parallel na “estranghero” at “dayuhan,” at iniwasan ang sobrang pormal o lipas na pananalita.
