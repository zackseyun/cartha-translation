translation:
  language: tl
  text: Kinasusuklaman ako ng lahat ng matatalik kong kaibigan[a], at ang mga minahal ko ay bumaling laban sa akin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “mga tao ng aking lihim na lupon.” Tumutukoy ito sa kumpidensiyal na bilog ni Job o sa mga pinagkakatiwalaan niyang kasama.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּעֲבוּנִי
  choice: Kinasusuklaman ako
  rationale: Ipinapanatili ng “kinasusuklaman” ang matinding pagkamuhi at pagkasuklam na ipinahihiwatig ng pandiwang תעב, higit sa karaniwang pag-ayaw.
- source_word: כָּל
  choice: lahat
  rationale: Tuwirang ipinahahayag ang saklaw na pangkalahatan ng כָּל at natural ito sa Filipino.
- source_word: מְתֵי סוֹדִי
  choice: matatalik kong kaibigan
  rationale: Ang parirala ay literal na tumutukoy sa mga taong kabilang sa lihim na sanggunian o mapagkakatiwalaang lupon ni Job. Ang “matatalik kong kaibigan” ay natural na naghahatid ng diwa ng malapit at kumpidensiyal na ugnayan; inilalahad sa talababa ang literal na larawan.
- source_word: וְזֶה
  choice: at ang mga
  rationale: Bagaman isahan ang anyong זֶה, kolektibo ang gamit nito rito, gaya ng makikita sa kasunod na pandiwang maramihan. Ang “ang mga” ay natural sa Filipino at hindi ipinipilit ang literal na isahan.
- source_word: אָהַבְתִּי
  choice: minahal ko
  rationale: Ang aspektong ganap ng pandiwa ay angkop na isalin bilang natapos o dating pagmamahal sa konteksto ng panaghoy.
- source_word: נֶהְפְּכוּ
  choice: tumalikod
  rationale: Ipinahihiwatig ng Niphal ng הפך ang pagbabaligtad o pagbabago ng panig. Sa kontekstong panlipunan, malinaw at natural ang “tumalikod.”
- source_word: בִי
  choice: sa akin
  rationale: Kasama ng “tumalikod,” likas na ipinapahayag ng “sa akin” ang salungat na pagbabago ng saloobin o katapatan nang hindi labis na dinaragdagan ang teksto.
