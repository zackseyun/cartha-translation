  yaml_path: translation/ot/job/019/025.yaml
  text: But as for me[a], I know that my Redeemer lives[c][b], and afterward he will rise over the dust.
translation:
  language: tl
  text: Ngunit ako, alam kong buháy ang aking manunubos[a], at sa huli ay tatayo siya sa ibabaw ng alabok.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Tagapagtanggol ng aking karapatan.” Ang Hebreong גֹּאֵל ay maaaring tumukoy sa isang manunubos, tagapagtanggol, o isang kumakatawan upang ipagtanggol ang usapin ng isang kapamilya.
    reason: lexical_alternative
  - marker: b
    text: O “at pagkatapos ay babangon siya sa ibabaw ng alabok.” Maaari ring unawain ang Hebreo bilang “at bilang huling isa ay tatayo siya sa ibabaw ng alabok.”
    reason: alternative_reading
  - marker: c
    text: Ang “alabok” ay maaaring magpahiwatig ng pagiging mortal, ng libingan, o ng lupa; literal na “alabok” ang Hebreo.
    reason: cultural_note
lexical_decisions:
- source_word: וַאֲנִי
  choice: Ngunit ako
  rationale: Ang hiwalay na panghalip kasama ng pang-ugnay ay nagbibigay-diin at nagpapakita ng pagsalungat sa naunang konteksto.
- source_word: יָדַעְתִּי
  choice: alam kong
  rationale: Bagaman ganap ang anyong Hebreo, ipinapahayag nito rito ang matatag at patuloy na katiyakan ni Job; likas itong sabihin sa kasalukuyang panahunan sa Tagalog.
- source_word: גֹּאֲלִי
  choice: aking Manunubos
  rationale: Ang גאל ay tumutukoy sa isang kamag-anak na tumutubos, nagtatanggol, o nagpapatunay sa katuwiran ng kapamilya. Pinananatili ng “Manunubos” ang lawak at bigat ng katawagan, habang inilalagay sa talababa ang mahalagang alternatibong “Tagapagtanggol ng aking karapatan.”
- source_word: חָי
  choice: buháy
  rationale: Tuwirang inilalarawan ng pang-uri ang patuloy na pagiging buhay ng Manunubos; malinaw at natural ang “buháy” sa Tagalog.
- source_word: וְאַחֲרוֹן
  choice: at sa huli
  rationale: Maaaring unawain ang אַחֲרוֹן bilang pang-abay na “sa huli/pagkatapos” o bilang pangngalang “ang huling isa.” Ang “sa huli” ay maikli at likas ngunit hindi lubusang nag-aalis sa tunay na kalabuan.
- source_word: יָקוּם
  choice: tatayo
  rationale: Ang קום ay maaaring mangahulugang tumayo, bumangon, o lumitaw. Ang “tatayo” ang pinakadiretso rito at hindi kusang nagpapasok ng tiyak na pahayag tungkol sa muling pagkabuhay.
- source_word: עַל עָפָר
  choice: sa ibabaw ng alabok
  rationale: Pinananatili ang karaniwang diwang pook ng עַל at ang literal na larawang “alabok” ng עָפָר, sa halip na ipakahulugang agad bilang lupa o libingan.
theological_decisions:
- issue: Ang pagkakakilanlan at tungkulin ng גֹּאֵל ni Job
  choice: “aking Manunubos,” nang hindi tinutukoy kung siya ay ang Diyos mismo, isang makalangit na saksi, o isang mesiyanikong manunubos
  alternative: “Tagapagtanggol ng aking karapatan” o “kamag-anak na manunubos”
  rationale: Hindi tahasang kinikilala ng Hebreo kung sino ang tinutukoy. Pinananatili ng salin ang teolohikal na bigat at ang posibleng legal-pampamilyang diwa nang hindi nilulutas ang usapin ayon sa isang doktrina.
- issue: Ang pangwakas o eskatolohikal na diwa ng וְאַחֲרוֹן ... יָקוּם
  choice: “at sa huli ay tatayo siya sa ibabaw ng alabok”
  alternative: “at pagkatapos ay babangon siya sa ibabaw ng alabok” o “at bilang huling isa ay tatayo siya sa ibabaw ng alabok”
  rationale: Pinagtatalunan ang sintaks at pahiwatig ng parirala. Hindi ginagawang tahasang pormula ng muling pagkabuhay ang pangunahing teksto, at itinatala sa talababa ang ibang makatwirang pagbasa.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “buháy” upang maiwasan ang maling pagbasa sa bigkas. Pinanatili ang “alabok” at ang hindi tiyak na pagkakakilanlan ng Manunubos upang huwag lampasan ang sinasabi ng Hebreo.
