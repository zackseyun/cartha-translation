base_translation:
  language: en
  yaml_path: translation/ot/job/019/007.yaml
  text: Look[a], I cry out, “Violence!” but I am not answered; I cry for help[c][b], but there is no justice.
translation:
  language: tl
  text: Tingnan![a] Sumisigaw ako, “Karahasan!” ngunit walang sumasagot sa akin; humihingi ako ng saklolo, ngunit walang katarungan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Masdan” o “Narito.” Isa itong mariing panawag-pansin.
    reason: lexical_alternative
  - marker: b
    text: O “walang makatarungang paghatol” o “walang legal na pagtutuwid.” May legal na diwa ang salitang Hebreo.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Tingnan mo
  rationale: Isang mariing panawag-pansin ang הֵן. Likas sa makabagong Tagalog ang “Tingnan mo” at pinananatili nito ang tuwirang diin.
- source_word: אֶצְעַק
  choice: sumisigaw ako
  rationale: Ang צעק ay malakas at apurahang pagsigaw dahil sa paghihirap; malinaw itong naihahatid ng “sumisigaw ako.”
- source_word: חָמָס
  choice: Karahasan
  rationale: Maaaring tumukoy ang חָמָס sa karahasan, matinding kasamaan, o reklamong dulot ng pang-aapi. “Karahasan” ang pinakatuwiran at kinikilalang salin, habang inilalahad sa talababa ang lawak ng kahulugan.
- source_word: אֵעָנֶה
  choice: walang sumasagot sa akin
  rationale: Ang Niphal ng ענה ay nangangahulugang hindi siya sinasagot. Natural ito sa Tagalog at hindi nito pinapalitan ng mas interpretatibong “walang nakikinig.”
- source_word: אֲשַׁוַּע
  choice: humihingi ako ng saklolo
  rationale: Ang pandiwa ay tumutukoy sa apurahang paghingi ng tulong. Ang “humihingi ako ng saklolo” ay malinaw, marangal, at naiiba nang bahagya sa naunang pagsigaw.
- source_word: מִשְׁפָּט
  choice: katarungan
  rationale: Sa konteksto ng reklamo ni Job, saklaw ng מִשְׁפָּט ang makatarungang paghatol at legal na pagtutuwid. “Katarungan” ang pinakanatural na pangunahing salin.
theological_decisions:
- issue: Ang tindi ng reklamo ni Job tungkol sa hindi sinasagot na daing at kawalan ng katarungan
  choice: 'Panatilihing tuwiran ang reklamo: walang sumasagot at walang katarungan.'
  alternative: Palambutin ang pahayag upang hindi magmukhang ipinagkakait ng Diyos ang katarungan.
  rationale: Tuwirang inilalahad ng Hebreo ang protesta ni Job. Dapat panatilihin ang tensiyong teolohikal sa halip na ipaliwanag o pahupain ito sa pagsasalin.
translation_notes:
  register: Makabago ngunit marangal na Tagalog. Ginamit ang “saklolo” sapagkat pamilyar at angkop sa matinding paghingi ng tulong; iniwasan ang labis na teknikal o denominasyonal na pananalita.
