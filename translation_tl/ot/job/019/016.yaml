  text: I call to my servant[a], but he does not answer[b]; I plead with him with my own mouth.
translation:
  language: tl
  text: Tinatawag ko ang aking lingkod[a], ngunit hindi siya sumasagot[b]; ako mismo ang nagsusumamo sa kanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “alipin ko.” Ang salitang Hebreo ay maaaring mangahulugang lingkod o alipin, depende sa konteksto.
    reason: lexical_alternative
  - marker: b
    text: O “Tinawag ko ang aking lingkod, ngunit hindi siya sumagot; ako mismo ang nagsumamo sa kanya.” Maaaring isalin nang mas mahigpit bilang pangnagdaan ang mga pandiwang Hebreo.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְעַבְדִּי
  choice: ang aking lingkod
  rationale: Ang עֶבֶד ay maaaring tumukoy sa lingkod o alipin. Sa konteksto ng kasambahay ni Job, natural ang “lingkod,” habang inilalagay sa talababa ang posibleng “alipin.”
- source_word: קָרָאתִי
  choice: Tinatawag ko
  rationale: Bagaman perpektibo ang anyong Hebreo at maaaring isaling pangnagdaan, maaari itong maglarawan nang buhay sa kasalukuyang kalagayan ni Job. Ang “Tinatawag ko” ay natural sa panaghoy.
- source_word: וְלֹא יַעֲנֶה
  choice: ngunit hindi siya sumasagot
  rationale: Ang ענה ay “sumagot” o “tumugon.” Ang pangatnig ay ginawang pasalungat na “ngunit” dahil iyon ang ugnayan ng mga sugnay.
- source_word: בְּמוֹ פִי
  choice: sa sarili kong bibig
  rationale: Pinananatili nito ang diin ng Hebreo na si Job mismo ang tuwirang nagsusumamo, at ipinakikita ang kanyang kahihiyan.
- source_word: אֶתְחַנֶּן לוֹ
  choice: nagsusumamo ako sa kanya
  rationale: Ang hitpael ng חנן ay nagpapahayag ng paghingi ng pabor o awa. Ang “nagsusumamo” ay dignificado at hindi nagdaragdag ng modal na ideyang “kailangan.”
