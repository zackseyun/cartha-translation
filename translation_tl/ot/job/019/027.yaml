translation:
  language: tl
  text: 'na ako mismo ang makakakita para sa aking sarili,


    at ang sarili kong mga mata ang makakakita sa kanya, at hindi ang iba.[a]


    Ang mga bato ko ay nauubos sa loob ko.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal, “at hindi isang estranghero.” Maaaring ang diwa ay: si Job mismo, at hindi ibang tao, ang makakakita sa kanya.'
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “ang aking mga bato.” Ang “mga bato” ay larawan ng kaloob-looban o pinakamalalim na damdamin; ang “sa loob ko” ay naghahatid ng Hebreong larawan na “sa aking dibdib.”
    reason: cultural_note
lexical_decisions:
- source_word: אֲשֶׁר
  choice: na
  rationale: Panghalip na pamanggit ito na tumutukoy sa personal na binanggit sa naunang talata; pinananatili ng “na” ang ugnayan ng pangungusap sa konteksto.
- source_word: אֲנִי
  choice: ako mismo
  rationale: May hayag na panghalip bukod sa anyo ng pandiwa, kaya nararapat panatilihin ang diin sa mismong karanasan ni Job.
- source_word: אֶחֱזֶה לִּי
  choice: makakakita para sa aking sarili
  rationale: Pinananatili ang payak na diwa ng pagkakita at ang mahirap ngunit mariing datibong לִּי, nang hindi ito binibigyang-kahulugang “panig sa akin” o nilulutas ang teolohikal na konteksto.
- source_word: וְעֵינַי רָאוּ
  choice: makikita siya ng sarili kong mga mata
  rationale: Likas na Filipino ito na nagpapanatili sa paralelismo at mariing personal na pagkakita. Ang qatal ay inuunawang panghinaharap ayon sa paralelismo sa naunang imperfect.
- source_word: וְלֹא זָר
  choice: at hindi ng iba
  rationale: Ipinahihiwatig nito ang kaibahan sa pagitan ni Job mismo at ng ibang tao, habang inilalagay sa talababa ang mas literal na “hindi isang estranghero.”
- source_word: כָּלוּ
  choice: nanghihina
  rationale: Maaaring tumukoy ang pandiwa sa pagkaubos, pangungulila, o pananamlay; ang “nanghihina” ay natural at hindi labis na nagtatakda ng tiyak na emosyon.
- source_word: כִלְיֹתַי בְּחֵקִי
  choice: ang kaloob-looban ko sa aking dibdib
  rationale: Ang literal na “mga bato” ay Hebreong larawan para sa malalim na damdamin o panloob na sarili. Isinasalin ang idyoma sa malinaw na Filipino habang pinananatili ang larawan ng dibdib at inilalagay ang literal na salita sa talababa.
theological_decisions:
- issue: Kalikasan at panahon ng inaasahang pagkakita ni Job
  choice: Inilalarawan ito bilang personal na pagkakita ni Job sa binanggit sa naunang talata, nang hindi tinutukoy kung mangyayari ito bago o pagkatapos ng kamatayan.
  alternative: Tahasang katawaning muling pagkabuhay, pagpapawalang-sala habang nabubuhay, o espirituwal na pagkakita sa Diyos pagkamatay.
  rationale: Mariing sinasabi ng Hebreo na si Job mismo ang makakakita, ngunit hindi nilulutas ng talatang ito lamang ang pinagtatalunang panahon at paraan ng pagkakitang iyon.
translation_notes:
  register: Makabago at marangal na Filipino na angkop sa tulang biblikal. Pinanatili ang diin ng “ako mismo” at “sarili kong mga mata,” ngunit ginawang malinaw sa karaniwang mambabasa ang Hebreong idyoma tungkol sa mga bato.
