translation:
  language: tl
  text: 'Sa pamamagitan ng pantitik na bakal at tingga,[b]

    maukit nawa ang mga iyon sa bato magpakailanman![a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mahiwa” o “matibag.” Ang pandiwang Hebreo ay karaniwang nangangahulugang “tumibag,” “humukay,” o “humugis sa pamamagitan ng pagputol”; dito, tumutukoy ito sa permanenteng pag-ukit ng mga salita sa bato.
    reason: lexical_alternative
  - marker: b
    text: Maaaring tumukoy ang tingga sa metal na ginamit kasama ng kasangkapang bakal, marahil bilang pampuno sa mga inukit na titik upang luminaw ang mga ito, ngunit hindi ito tahasang sinasabi ng teksto.
    reason: cultural_note
lexical_decisions:
- source_word: בְּעֵט
  choice: sa pamamagitan ng panulat
  rationale: Ang עֵט ay kasangkapang ginagamit sa pagsulat o pag-ukit. Nililinaw ng kasunod na “bakal” at ng batong inuukitan na hindi panulat na may tinta ang tinutukoy.
- source_word: בַּרְזֶל
  choice: na bakal
  rationale: Tuwirang tumutukoy sa materyal ng panulat o kasangkapang pang-ukit.
- source_word: וְעֹפָרֶת
  choice: at tingga
  rationale: Ang עֹפָרֶת ay metal na tingga. Hindi ipinapaliwanag ng Hebreo kung paano ito ginagamit, kaya pinanatili lamang ang pangalan ng materyal.
- source_word: לָעַד
  choice: magpakailanman
  rationale: Nagpapahayag ito ng walang-hanggang pananatili at likas na katumbas sa marangal na modernong Tagalog.
- source_word: בַּצּוּר
  choice: sa bato
  rationale: Ang צוּר ay malaking bato o batuhan. Sa Tagalog, likas ang “ukitin sa bato,” na nagpapahiwatig ng paghiwa sa mismong ibabaw nito.
- source_word: יֵחָצְבוּן
  choice: ukitin nawa ang mga iyon
  rationale: Ang חצב ay karaniwang “tumibag,” “humew,” o “pumutol.” Sa konteksto ng mga salitang permanenteng itinatala sa bato, “ukitin” ang malinaw na katumbas; ang “nawa” ay nagpapanatili sa himig ng kahilingan.
