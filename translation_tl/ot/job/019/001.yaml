lexical_decisions:
- source_word: וַיַּעַן
  choice: Sumagot
  rationale: Ang ענה sa pormulang pasalaysay na ito ay nangangahulugang ‘sumagot’ o ‘tumugon.’ Ang “sumagot” ay natural sa makabagong Tagalog at pinananatili ang diwa ng pag-uusap.
- source_word: אִיּוֹב
  choice: Job
  rationale: Ginamit ang nakaugaliang anyo ng pangalang ito sa mga saling Tagalog ng Bibliya.
- source_word: וַיֹּאמַר
  choice: at sinabi
  rationale: Ang אמר ay karaniwang nangangahulugang ‘sabihin.’ Pinananatili ng “at sinabi” ang Hebreong pormulang ‘sumagot at sinabi’ nang hindi ito ginagawang paraphrase.
- source_word: וַ
  choice: at
  rationale: Ang waw ay nag-uugnay sa mga pandiwa sa pormulang pasalaysay. Dito, natural sa Tagalog ang “at,” samantalang hindi kailangang gawing tahasang “pagkatapos” ang pagkakasunod-sunod.
