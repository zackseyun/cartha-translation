  text: Know then that God has wronged me and has surrounded me with his net[a][b].
translation:
  language: tl
  text: Alamin nga ninyo na hindi makatarungan ang ginawa sa akin ng Diyos[a], at pinalibutan niya ako ng kanyang lambat[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “pinakitunguhan niya ako nang di-makatarungan” o “binaluktot niya ang katarungan laban sa akin.” Maaaring ipahiwatig ng pandiwang Hebreo ang pagbaluktot o pagpilipit sa kung ano ang tama.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “kanyang bitag” o “kanyang lambat na panghuli.”
    reason: lexical_alternative
lexical_decisions:
- source_word: דְּעוּ אֵפוֹ
  choice: Alamin nga ninyo
  rationale: Ang maramihang pautos na דְּעוּ ay tuwirang panawagan sa mga kausap ni Job na tanggapin ang kanyang sinasabi; ipinahihiwatig ng “nga” ang pagbibigay-diin ng אֵפוֹ nang natural sa Tagalog.
- source_word: אֱלוֹהַּ
  choice: Diyos
  rationale: Karaniwang pang-isahang katawagan ito sa Diyos at hindi isang mas tiyak na titulong gaya ng Makapangyarihan-sa-lahat.
- source_word: עִוְּתָנִי
  choice: ginawan ako ng Diyos ng kawalang-katarungan
  rationale: Ang pandiwang עות ay maaaring mangahulugang baluktutin, pilipitin, o gawan ng mali. Pinananatili ng salin ang matinding paratang ni Job habang malinaw at natural sa makabagong Tagalog.
- source_word: מְצוּדוֹ
  choice: kanyang lambat
  rationale: Tumutukoy ang pangngalan sa lambat o bitag na ginagamit sa pangangaso. Pinananatili ng “lambat” ang kongkretong larawan ng Hebreo.
- source_word: עָלַי הִקִּיף
  choice: pinalibutan niya ako
  rationale: Ipinapahayag ng pandiwa ang pagpalibot o pagkubkob. Ang ayos na ito ay natural sa Tagalog at malinaw na ang lambat ang larawang pumapalibot kay Job.
theological_decisions:
- issue: Ang tuwirang paratang ni Job laban sa Diyos
  choice: Pinanatili ang pahayag na ginawan siya ng Diyos ng kawalang-katarungan.
  alternative: Pinarusahan ako ng Diyos; kinalaban ako ng Diyos.
  rationale: Malakas ang moral at hudisyal na puwersa ng pandiwang Hebreo. Hindi dapat pahinain ng salin ang tensiyong nasa panaghoy ni Job, bagaman ang pagsasalin sa kanyang sinabi ay hindi nangangahulugang itinuturing itong pamantayang pahayag ng doktrina.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ang “Alamin nga ninyo” ay nagpapanatili sa mariing panawagan sa maramihang kausap, at ang tuwirang paratang ay hindi pinalalambot. Ginamit ang “kanyang” sa halip na “Kanyang” ayon sa karaniwang makabagong ortograpiya.
