  text: Between their rows they press out oil[a]; they tread winepresses[b], yet they go thirsty.
translation:
  language: tl
  text: Sa pagitan ng kanilang mga hanay[a], nagpipiga sila ng langis[b]; niyayapakan nila ang mga pisaan ng ubas, ngunit nauuhaw sila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kanilang mga pader” o “kanilang mga terasa.” Malamang na tumutukoy ang salitang Hebreo sa mga hanay o sa napaliligirang bahagi ng bukirin kung saan sila nagtatrabaho.
    reason: lexical_alternative
  - marker: b
    text: Mahirap tiyakin ang kahulugan ng pandiwang Hebreo; kaugnay ito ng “langis” o “ningning,” at sa kontekstong ito ay malamang na tumutukoy sa pagpiga o pagkuha ng langis mula sa olibo.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּין
  choice: Sa gitna ng
  rationale: Likas na Filipino para sa lokasyong ipinahihiwatig ng 'sa pagitan ng' o 'sa loob ng' mga hanay.
- source_word: שׁוּרֹתָם
  choice: kanilang mga hanay
  rationale: Pinananatili ang konkretong ngunit hindi tiyak na larawan ng mga hanay; maaari ring tumukoy ang Hebreo sa mga pader o bahaging napaliligiran.
- source_word: יַצְהִירוּ
  choice: nagpapatulo sila ng langis
  rationale: Mahirap ang pandiwa, ngunit sa kontekstong agrikultural malamang na tumutukoy ito sa pagkuha o pagpiga ng langis mula sa olibo.
- source_word: יְקָבִים
  choice: mga pisaan ng ubas
  rationale: Malinaw na inilalarawan ang mga pisaan o batyang ginagamit sa paggawa ng alak.
- source_word: דָּרְכוּ
  choice: niyayapakan nila
  rationale: Tuwirang inilalarawan ang tradisyonal na pagyapak sa mga ubas sa pisaan.
- source_word: וַיִּצְמָאוּ
  choice: ngunit nauuhaw sila
  rationale: 'Ipinahahayag ng ''ngunit'' ang mapait na kabalintunaan: gumagawa sila ng inumin ngunit sila mismo ay pinagkakaitan nito.'
