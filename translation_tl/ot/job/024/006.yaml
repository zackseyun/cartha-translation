translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “kumpay” dahil maikli at tumpak, ngunit ipinaliwanag ito sa talababa. Pinalawak ang “namumulot” bilang “namumulot ... ng mga natirang bunga” upang maging malinaw ang natatanging diwa ng pandiwang Hebreo.
