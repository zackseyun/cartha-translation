  yaml_path: translation/ot/job/024/006.yaml
  text: In the field they harvest fodder[c][b][a], and they glean in the vineyard of the wicked.
translation:
  language: tl
  text: Sa bukid ay inaani nila ang kumpay[a], at namumulot sila ng mga natirang ani sa ubasan[b] ng taong masama.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “halu-halong pakain sa hayop.” Pakain sa hayop ang tinutukoy ng salitang Hebreo, hindi karaniwang butil na pagkain ng tao. May hulaping maaaring literal na isaling “kanyang,” ngunit hindi tiyak ang tinutukoy nito.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “at ang ubasan ng taong masama ay pinamumulutan nila ng mga natirang ani.” Hindi tahasang inuulit sa Hebreo ang pang-ukol na “sa.”
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “ng isang masamang tao.” Maaaring pangkalahatang tumukoy ang Hebreo sa isang masamang may-ari ng ubasan.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּשָּׂדֶה
  choice: Sa bukid
  rationale: Ang בְּ ay panandang panlunan, at ang “sa bukid” ang natural na katumbas sa modernong Tagalog.
- source_word: בְּלִילוֹ
  choice: ang kumpay
  rationale: Ang בְּלִיל ay pakain sa hayop, malamang ay halu-halong kumpay, at hindi karaniwang butil na pagkain ng tao. Hindi tahasang isinalin ang hulaping 3ms sapagkat malabo ang tinutukoy nito at magiging pilit ang “kanyang kumpay” sa Tagalog.
- source_word: יקצירו
  choice: inaani nila
  rationale: Ang pandiwang קצר ay nangangahulugang gumapas o umani; ang “inaani” ay natural at malinaw sa kasalukuyang Tagalog.
- source_word: וְכֶרֶם
  choice: at ... sa ubasan
  rationale: Walang inuulit na pang-ukol sa Hebreo, ngunit likas sa Tagalog na gamitin ang “sa” upang ipakitang ubasan ang lugar ng pamumulot. Inilalahad sa talababa ang mas literal na kayarian.
- source_word: רָשָׁע
  choice: ng taong masama
  rationale: Ang pang-isahang pang-uri ay ginagamit bilang pangngalan. Pinananatili ng “taong masama” ang pang-isahang diwa nang hindi ipinapalagay na isang partikular na kilalang may-ari ang tinutukoy.
- source_word: יְלַקֵּשׁוּ
  choice: namumulot sila ng mga natirang bunga
  rationale: Ang Piel ng לקשׁ ay tumutukoy sa pamumulot ng mga natira o nahuling bunga. Mas madaling maunawaan ito ng karaniwang mambabasa kaysa sa isang teknikal o lipas na katawagan.
