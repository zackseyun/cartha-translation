base_translation:
  language: en
  yaml_path: translation/ot/job/024/018.yaml
  text: He is swift on the surface of the waters[a]; their portion in the land is cursed[c][b]; he does not turn toward the way of the vineyards.
translation:
  language: tl
  text: Mabilis siya sa ibabaw ng tubig[a]; isinumpa ang kanilang bahagi sa lupain[b]; hindi siya bumabaling sa daan ng mga ubasan.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Magaan siya sa ibabaw ng tubig.” Mahirap unawain ang Hebreo; itinuturing ng ilan na ang pambungad ay tumutukoy sa pagiging panandalian sa halip na sa bilis.
    reason: lexical_alternative
  - marker: b
    text: Mahirap unawain ang Hebreo; maaaring basahin ang “isinumpa ang kanyang bahagi sa lupain” sa halip na “isinumpa ang kanilang bahagi sa lupain.”
    reason: textual_variant
  - marker: c
    text: O “hindi siya bumabaling sa daang patungo sa mga ubasan.” Maaaring ang ibig sabihin ay hindi na siya bumabalik sa sinasakang lupain o sa masaganang mga lugar.
    reason: lexical_alternative
lexical_decisions:
- source_word: קַֽל
  choice: mabilis
  rationale: Ang literal na diwa ay “magaan,” ngunit sa larawang may pagkilos sa ibabaw ng tubig, malamang na ipinahihiwatig nito ang bilis o pagiging panandalian. Ang “mabilis” ay natural sa Filipino nang hindi labis na ipinapaliwanag ang talinghaga.
- source_word: עַל פְּנֵי מַיִם
  choice: sa ibabaw ng tubig
  rationale: Natural na katumbas sa Filipino ng Hebreong idyomang “sa mukha ng mga tubig,” habang pinananatili ang larawan ng ibabaw ng tubig.
- source_word: תְּקֻלַּל
  choice: isinumpa
  rationale: Ang Pual na anyo ng קלל ay pinakatuwirang nagpapahayag ng pasibong diwang “isinumpa.” Hindi pinili ang posibleng diwang “itinuring na walang halaga” dahil hindi iyon ang mas malinaw na pagbasa sa sintaks.
- source_word: חֶלְקָתָם
  choice: kanilang bahagi
  rationale: Sinusunod nito ang anyong may pangmaramihang hulapi sa ibinigay na tekstong Hebreo, habang itinatala sa talababa ang posibleng pagbasa na pang-isahan.
- source_word: בָּאָרֶץ
  choice: sa lupain
  rationale: Ang “lupain” ay natural na kaugnay ng “bahagi” bilang pag-aari o takdang bahagi ng lupa; posible rin sa leksikon ang mas malawak na “daigdig.”
- source_word: לֹא יִפְנֶה
  choice: hindi siya bumabaling
  rationale: Pinananatili ng “bumabaling” ang pangunahing larawan ng pandiwang פנה na pagharap o pagliko tungo sa isang direksiyon, nang hindi agad binibigyang-kahulugang “bumabalik.”
- source_word: דֶּרֶךְ כְּרָמִים
  choice: daan ng mga ubasan
  rationale: Malapit ito sa kayariang Hebreo at pinananatili ang kalabuan kung ang tinutukoy ay daang nasa mga ubasan o daang patungo sa mga ito.
