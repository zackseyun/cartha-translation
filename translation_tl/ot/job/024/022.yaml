  text: וּ/מָשַׁ֣ךְ אַבִּירִ֣ים בְּ/כֹח֑/וֹ יָ֝ק֗וּם וְֽ/לֹא יַאֲמִ֥ין בַּֽ/חַיִּֽין־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/024/022.yaml
  text: Yet he drags away the mighty by his power; he rises up[a], but he has no assurance of life.
translation:
  language: tl
  text: Gayunman, sa pamamagitan ng kanyang lakas ay kinakaladkad niya ang mga makapangyarihan; bumabangon siya, ngunit wala siyang katiyakan na mabubuhay.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “bumabangon siya, ngunit hindi siya nagtitiwala sa buhay”; maaari ring “bumabangon siya, at walang sinumang nakatitiyak na mabubuhay.” Malabo sa Hebreo kung sino ang paksa ng huling sugnay.
    reason: alternative_reading
lexical_decisions:
- source_word: וּמָשַׁךְ
  choice: kinakaladkad niya
  rationale: Karaniwang nangangahulugang humila o kumaladkad ang משׁך. Ang marahas na diwa ay angkop kapag ang tuwirang layon ay ang mga makapangyarihan at ang kilos ay ginagawa sa pamamagitan ng kanyang lakas.
- source_word: אַבִּירִים
  choice: ang mga makapangyarihan
  rationale: Tumutukoy ang salita sa malalakas o makapangyarihang mga tao. Pinananatili ng saling ito ang posibleng panlipunan at pisikal na diwa nang hindi ito ginagawang ‘mga toro.’
- source_word: בְּכֹחוֹ
  choice: sa pamamagitan ng kanyang lakas
  rationale: Ipinahihiwatig ng ב instrumental na gamit ng כֹּחַ, kaya malinaw at natural ang ‘sa pamamagitan ng kanyang lakas.’
- source_word: יָקוּם
  choice: bumabangon siya
  rationale: Ang qal ng קום ay karaniwang ‘bumangon’ o ‘tumayo.’ Pinananatili ng ‘bumabangon’ ang larawan at hindi nililinaw nang labis kung ito ay pagbangon upang kumilos o pananatiling nakatayo.
- source_word: וְלֹא יַאֲמִין בַּחַיִּין
  choice: ngunit wala siyang katiyakan na mabubuhay
  rationale: Ang literal na ayos ay ‘at hindi siya nagtitiwala sa buhay.’ Ipinahahayag ng salin ang kawalan ng katiyakan tungkol sa patuloy na buhay habang pinananatili ang pang-isahang paksa ng pandiwa; inilalahad sa talababa ang alternatibong impersonal na pagbasa.
theological_decisions:
- issue: Malabong paksa ng huling sugnay
  choice: 'Pinanatiling ang masamang tao ang pang-isahang paksa: ‘wala siyang katiyakan na mabubuhay.’'
  alternative: ‘walang sinumang nakatitiyak na mabubuhay’ o mas literal na ‘hindi siya nagtitiwala sa buhay’
  rationale: Pang-isahan ang pandiwang יַאֲמִין at maaari itong tumukoy sa paksa ng naunang sugnay. Gayunman, siksik at malabo ang Hebreo, at maaari ring maunawaan ang sugnay bilang paglalarawan sa kawalang-katiyakang idinudulot niya sa iba; kaya hindi itinago ang alternatibo.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang ‘Gayunman’ upang ipakita ang ugnayang panalungat, at iniwasan ang sobrang teknikal o denominasyonal na pananalita.
