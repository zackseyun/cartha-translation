  source_fidelity: 'Tapat ang salin sa Hebreo: ang עָרוֹם ay naihatid bilang “hubad,” יָלִינוּ bilang “nagpapalipas sila ng gabi,” at ang magkakatambal na kawalan ng damit at pantakip laban sa lamig ay malinaw na napanatili. Ang “pantakip sa lamig” ay likas na nagpapahayag ng proteksiyong ipinahihiwatig ng כְּסוּת nang hindi ito labis na tinutukoy bilang kumot.'
  naturalness: Natural at malinaw ang modernong Filipino. Ang pag-uulit ng “hubad, walang damit” ay sinasadya at angkop, sapagkat inuulit at pinatitindi rin ng Hebreo ang larawan ng ganap na kawalan ng kasuotan.
