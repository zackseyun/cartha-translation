base_translation:
  language: en
  yaml_path: translation/ot/job/024/007.yaml
  text: They spend the night naked[a], without clothing, and have no covering against the cold.
translation:
  language: tl
  text: Nagpapalipas sila ng gabi na hubad[a], walang damit, at walang pantakip sa lamig.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Natutulog silang hubad, walang kasuotan, at walang pantakip sa gitna ng lamig.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עָרוֹם
  choice: hubad
  rationale: Tuwirang inilalarawan ang kawalan o kakulangan ng kasuotan; malinaw at masidhi ang “hubad” sa konteksto ng kanilang paghihirap.
- source_word: יָלִינוּ
  choice: nagpapalipas sila ng gabi
  rationale: Ang pandiwang לין ay nangangahulugang magpalipas ng gabi o mamalagi sa gabi. Likas sa modernong Filipino ang pariralang ito at napapanatili ang aspektong temporal.
- source_word: מִבְּלִי
  choice: walang
  rationale: Ipinapahayag nito ang kawalan o pagkakait. Ang “walang” ang pinakamaikli at pinakanatural na katumbas sa pangungusap.
- source_word: לְבוּשׁ
  choice: damit
  rationale: Pangkalahatang tumutukoy sa kasuotan o isang damit. Ang “damit” ay karaniwan, malinaw, at hindi lipas na salita.
- source_word: כְּסוּת
  choice: pantakip
  rationale: Tumutukoy sa anumang pantakip, na maaaring damit o ibang proteksiyon. Hindi nito labis na tinutukoy kung kumot o kasuotan ang bagay.
- source_word: בַּקָּרָה
  choice: sa lamig
  rationale: Literal itong tumutukoy sa “lamig.” Sa pariralang “pantakip sa lamig,” natural na naipahihiwatig ang proteksiyon laban dito nang hindi inaalis ang mas literal na ugnayan.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na simple ngunit marangal. Pinanatili ang matinding larawan ng kahubaran at pagkakalantad sa lamig, habang iniwasang tukuyin ang כְּסוּת bilang “kumot” dahil mas malawak ang kahulugan nito.
