base_translation:
  language: en
  yaml_path: translation/ot/job/024/012.yaml
  text: From the city the dying groan[a], and the soul of the slain cries out for help[b], yet God does not regard it as folly.
translation:
  language: tl
  text: Mula sa lungsod ay dumaraing ang mga naghihingalo[a], at ang kaluluwa ng mga pinaslang ay humihiyaw para sa tulong; gayunma’y hindi ito itinuturing ng Diyos na kahangalan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Sa lungsod ay dumaraing ang mga tao.” Mahirap unawain dito ang Hebreong מְתִים; maaari itong mangahulugang “mga tao” sa halip na “mga naghihingalo.”
    reason: lexical_alternative
  - marker: b
    text: Mahirap ang Hebreong idyoma. Maaari ring isalin ang huling parirala na “gayunma’y hindi ito itinuturing ng Diyos na kamalian” o “gayunma’y hindi ito ibinibilang ng Diyos na mali.” Hindi rin tiyak kung ano ang tinutukoy ng “ito.”
    reason: alternative_reading
lexical_decisions:
- source_word: מֵעִיר
  choice: Mula sa lungsod
  rationale: Pinananatili ang karaniwang diwa ng מִן bilang pinagmumulan ng daing, nang hindi ipinapakahulugang higit sa sinasabi ng Hebreo.
- source_word: מְתִים
  choice: ang mga naghihingalo
  rationale: Mahirap ang salitang ito, ngunit ang pagkakatugma nito sa mga pinaslang sa kasunod na parirala ay pumapabor sa kahulugang nauugnay sa pagkamatay; inilalagay sa talababa ang posibleng 'mga tao.'
- source_word: יִנְאָקוּ
  choice: dumaraing
  rationale: Likas at malinaw na Filipino para sa naririnig na daing bunga ng matinding paghihirap.
- source_word: וְנֶפֶשׁ
  choice: at ... ang kaluluwa
  rationale: Pinananatili ang anyo at bigat ng נֶפֶשׁ, habang ang ayos ng pangungusap ay ginawang natural sa Filipino.
- source_word: חֲלָלִים
  choice: ng mga pinaslang
  rationale: Karaniwang tumutukoy sa mga napatay sa marahas na paraan at angkop sa konteksto ng kawalang-katarungan.
- source_word: תְּשַׁוֵּעַ
  choice: humihingi ng tulong
  rationale: Ipinahahayag ang desperadong paghingi ng saklolo na ipinahihiwatig ng masidhing anyo ng pandiwa.
- source_word: וֶאֱלוֹהַּ
  choice: gayunma'y ... ang Diyos
  rationale: 'Adbersatibo ang ugnayan dito: itinatapat ang pagdaing ng mga biktima sa waring hindi pagtugon ng Diyos.'
- source_word: לֹא יָשִׂים תִּפְלָה
  choice: hindi ito itinuturing ... na kahangalan
  rationale: Malapit sa mga leksikal na diwa ng תִּפְלָה bilang kahangalan, kabalintunaan, o bagay na di-nararapat, habang iniiwasang gawing tiyak ang mahirap na idyoma.
theological_decisions:
- issue: Ang waring hindi pagtugon ng Diyos sa gitna ng kawalang-katarungan
  choice: gayunma'y hindi ito itinuturing ng Diyos na kahangalan
  alternative: gayunma'y hindi ito ibinibilang ng Diyos na kasalanan / gayunma'y hindi pinapansin ng Diyos ang sigaw
  rationale: Pinananatili nito ang matinding reklamo ni Job at ang kalabuan ng Hebreo, nang hindi ipinapaliwanag o pinahihinahon ang teolohikal na tensiyon.
translation_notes:
  register: Makabagong, marangal, at madaling maunawaang Filipino. Ginamit ang “lungsod,” “dumaraing,” at “humihingi ng tulong” bilang natural na pananalita; pinanatili ang “kaluluwa” upang maipakita ang anyo at emosyonal na bigat ng Hebreo. Parehong nasa pangunahing teksto ang mga panandang [a] at [b].
