  language: tl
  text: Sapagkat sa kanilang lahat, ang umaga ay pusikit na dilim[a][b]; sapagkat batid ng bawat isa sa kanila ang mga lagim ng pusikit na dilim.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Sapagkat ang umaga para sa kanilang lahat ay parang pusikit na dilim.” Masinsin ang ayos ng Hebreo at maaaring unawain sa bahagyang magkaibang paraan.'
    reason: alternative_reading
  - marker: b
    text: Ang Hebreong צַלְמָוֶת (tsalmaveth) ay maaari ring isaling “anino ng kamatayan” o “karimlan.” Dito, malamang na tumutukoy ito sa napakalalim na dilim, hindi sa kamatayan mismo.
    reason: lexical_alternative
  - marker: c
    text: Isahan ang pandiwa sa Hebreo—“batid niya” o “nakikilala niya.” Maaaring pangkalahatan ang tinutukoy nito, iyon ay, bawat isa sa mga masamang tao; kaya isinaling “batid ng bawat isa sa kanila.”
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikita ang paliwanag o dahilan na nagpapatuloy sa paglalarawan sa masasama sa konteksto.
- source_word: יַחְדָּו
  choice: sa kanilang lahat
  rationale: Bagaman literal na “magkakasama,” may kolektibo o distributibong diwa rito; natural sa Tagalog ang “sa kanilang lahat.”
- source_word: בֹּקֶר
  choice: umaga
  rationale: Karaniwang kahulugan ng salita at malinaw na pinananatili ang matinding pagsalungat nito sa pusikit na dilim.
- source_word: לָמוֹ
  choice: para sa kanila
  rationale: 'Ipinahahayag ang kaugnayan sa sugnay na walang tahasang pandiwa: ang umaga ay itinuturing nilang pusikit na dilim.'
- source_word: צַלְמָוֶת
  choice: pusikit na dilim
  rationale: Sa Job, karaniwan itong tumutukoy sa napakalalim na dilim o karimlan, hindi kinakailangang sa kamatayan mismo. Ang “pusikit na dilim” ay natural at maringal sa makabagong Tagalog.
- source_word: יַכִּיר
  choice: kilala niya
  rationale: Pinananatili ang isahang anyong panlalaki ng Hebreo at ang maaaring diwa ng pagkilala o pagiging pamilyar sa isang bagay, nang hindi tahimik na ginagawang maramihan.
- source_word: בַּלְהוֹת
  choice: mga lagim
  rationale: Tumutukoy sa mga nakatatakot na karanasan o biglaang sindak; ang “mga lagim” ay maikli, natural, at akma sa kasunod na pariralang “ng pusikit na dilim.”
