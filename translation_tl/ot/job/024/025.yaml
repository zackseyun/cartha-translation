  text: And if it is not so[a], then who can prove me a liar and make my word into nothing?
translation:
  language: tl
  text: At kung hindi nga ganito, sino ang makapagpapatunay na sinungaling ako at makapagpapawalang-saysay ang sinabi ko?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִם לֹא
  choice: At kung hindi nga ganito
  rationale: Ipinahahayag ang kondisyong hamon batay sa mga naunang sinabi ni Job. Ang “ganito” ay likas na tumutukoy sa naunang paglalarawan nang hindi nagdaragdag ng bagong kahulugan.
- source_word: אֵפוֹ
  choice: nga
  rationale: Ang partikula ay nagbibigay-diin sa retorikal na hamon. Sa modernong Tagalog, likas na naihahatid ng “nga” ang diin, samantalang hindi na kailangang idagdag ang mabigat na “kung gayon.”
- source_word: מִי
  choice: sino
  rationale: Tuwirang katumbas ng pananong na panghalip at pinananatili ang anyo ng retorikal na tanong.
- source_word: יַכְזִיבֵנִי
  choice: makapagpapatunay na sinungaling ako
  rationale: Ang Hiphil ng כזב ay maaaring mangahulugang patunayang bulaan o ipakitang sinungaling. Pinananatili ng salin ang personal at mapanghamong lakas ng pananalita ni Job.
- source_word: וְיָשֵׂם לְאַל
  choice: at makapagpapawalang-saysay
  rationale: Ang literal na diwang “ilagay sa wala” ay isang idyoma para sa pagpapawalang-bisa o pagpapakitang walang kabuluhan; natural at malinaw sa Tagalog ang “magpawalang-saysay.”
- source_word: מִלָּתִי
  choice: sa sinabi ko
  rationale: Ang pangngalan ay tumutukoy sa salita, pahayag, o pananalita ni Job. Mas natural sa kasalukuyang Tagalog ang “sinabi ko” kaysa “aking salita” sa ganitong retorikal na konteksto.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na dignified ngunit madaling maunawaan. Pinanatili ang maigsi at matapang na retorikal na hamon ni Job, nang walang idinagdag na denominasyonal na interpretasyon.
