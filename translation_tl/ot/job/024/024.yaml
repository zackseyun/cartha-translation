base_translation:
  language: en
  yaml_path: translation/ot/job/024/024.yaml
  text: They are exalted a little while[a], and then they are gone; they are brought low; like all others they are gathered up[c][b], and like the head of a stalk of grain they are cut off.
translation:
  language: tl
  text: Itinataas sila nang sandali, at pagkatapos ay wala na sila[a]. Ibinababa sila; tulad ng lahat ay tinitipon sila[b], at tulad ng ulo ng uhay[c] ay pinuputol sila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “hindi na sila naroroon.” Ganito maaaring isalin nang mas literal ang Hebreong idyoma.
    reason: lexical_alternative
  - marker: b
    text: O “inaalis.” Bihira ang pandiwang Hebreo rito, at pinagtatalunan ang eksaktong diwa nito.
    reason: lexical_alternative
  - marker: c
    text: Sa Hebreo, “tulad ng ulo ng isang uhay.”
    reason: cultural_note
lexical_decisions:
- source_word: רֹמּוּ מְּעַט
  choice: Itinataas sila sandali
  rationale: Pinananatili ang pasibong diwa ng רום at ang panandaliang kahulugan ng מְעַט sa konteksto ng biglang pagkawala.
- source_word: וְאֵינֶנּוּ
  choice: at pagkatapos ay wala na sila
  rationale: Ang Hebreong idyoma ay nagsasaad na hindi na sila naroroon o umiiral; ginamit ang maramihan ayon sa mga nakapaligid na pandiwa, bagaman distributibo ang anyong isahan.
- source_word: וְהֻמְּכוּ
  choice: Ibinababa sila
  rationale: Inihahayag ang pagbabaligtad mula sa pagkakaangat tungo sa pagkakababa nang hindi dinaragdagan ng tiyak na moral na pakahulugan.
- source_word: כַּכֹּל יִקָּפְצוּן
  choice: tulad ng lahat, sila ay tinitipon
  rationale: Ang bihirang pandiwang יִקָּפְצוּן ay maaaring tumukoy sa pagtitipon o pag-aalis; pinili ang 'tinitipon' upang mapanatili ang larawan at ang leksikal na kawalang-katiyakan.
- source_word: וּכְרֹאשׁ שִׁבֹּלֶת
  choice: tulad ng ulo ng uhay
  rationale: Ang 'ulo ng uhay' ay tuwirang naglilipat sa larawang pang-ani at natural na nauunawaan sa modernong Filipino.
- source_word: יִמָּלוּ
  choice: pinuputol sila
  rationale: Sa larawang pang-ani, malamang na tumutukoy ito sa pagputol sa uhay; ang 'pinuputol' ay hindi nagpapasya kung 'cut off,' 'cut down,' o isang kaugnay na pagkilos ang eksaktong diin.
