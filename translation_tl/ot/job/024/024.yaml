translation_notes:
  register: Makabagong Filipino na marangal at madaling maunawaan. Pinanatili ang pasibong ayos at ang sunod-sunod na larawang pagtaas, pagbaba, pagtitipon, at pagputol. Hindi nilinaw nang lampas sa Hebreo kung sino ang gumagawa ng mga kilos.
