  text: חֲמ֣וֹר יְתוֹמִ֣ים יִנְהָ֑גוּ יַ֝חְבְּל֗וּ שׁ֣וֹר אַלְמָנָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/job/024/003.yaml
  text: They drive away the orphan's donkey[b][a]; they take the widow's ox as a pledge.
translation:
  language: tl
  text: Itinataboy nila ang asno ng mga ulila[a]; kinukuha nila bilang sangla ang baka ng biyuda[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang asno ng bawat ulila.” Maramihan ang “mga ulila” sa Hebreo at maaaring unawain nang sama-sama o pamahagi.
    reason: lexical_alternative
  - marker: b
    text: O “kinukuha nilang panagot sa utang ang baka ng biyuda.” Ang pandiwa ay partikular na tumutukoy sa pagkuha ng ari-arian bilang garantiya sa isang utang.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲמוֹר
  choice: asno
  rationale: Ang “asno” ang malinaw at karaniwang makabagong tawag sa domestikadong hayop na pantrabaho; hindi kailangang tukuyin sa salin na lalaki ito.
- source_word: יְתוֹמִים
  choice: ng mga ulila
  rationale: Pinananatili ang tahasang anyong maramihan ng Hebreo. Maaaring tumukoy ito sa mga ulila bilang isang pangkat o sa pag-aari ng bawat ulila, kaya nililinaw sa talababa ang saklaw ng konstruksiyon.
- source_word: יִנְהָגוּ
  choice: itinataboy nila
  rationale: Ang pandiwang נהג ay nangangahulugang magtaboy o magpaandar ng hayop. Ang “itinataboy” ay natural sa Filipino at akma sa sapilitang pagkuha sa konteksto, nang hindi tahasang dinaragdagan ng salitang “ninakaw.”
- source_word: יַחְבְּלוּ
  choice: kinukuha nila bilang sangla
  rationale: Pinananatili nito ang tiyak na legal at pangkabuhayang diwa ng pagkuha ng ari-arian bilang panagot sa utang, sa halip na gawing pangkalahatang “kinukuha” lamang.
- source_word: שׁוֹר
  choice: baka
  rationale: Ang שׁוֹר ay tumutukoy sa isang hayop na bovine, madalas na ginagamit sa gawaing bukid. Ang “baka” ang pinakanatural at hindi labis na tiyak sa kasarian sa modernong Filipino; ang “toro” ay maaaring magpahiwatig ng lalaking hindi kinapon, na hindi hinihingi ng salita.
- source_word: אַלְמָנָה
  choice: ng biyuda
  rationale: 'Natural na ipinapahayag sa Filipino ng pariralang “ng biyuda” ang ugnayang konstruktong Hebreo: ang baka ay pag-aari ng biyuda.'
