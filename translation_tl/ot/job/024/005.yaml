base_translation:
  language: en
  yaml_path: translation/ot/job/024/005.yaml
  text: Look[a], like wild donkeys in the wilderness they go out to their work, seeking prey early; the desert is bread for him[b], for the children.
translation:
  language: tl
  text: 'Masdan, gaya ng maiilap na asno sa ilang,


    lumalabas sila para sa kanilang gawain,


    maagang naghahanap ng makakain;


    ang tigang na kapatagan ang pagkain para sa kaniya[a],


    para sa mga bata.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isahan ang “kaniya” sa Hebreo. Ang panghuling salita ay maaaring isalin ding “mga kabataan,” “mga binata,” o, ayon sa pag-unawa sa larawan, “mga anak.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Tingnan ninyo
  rationale: Likas na panawag-pansin sa makabagong Filipino at pinananatili ang puwersang deiktiko ng Hebreo.
- source_word: פְּרָאִים
  choice: maiilap na asno
  rationale: Tumutukoy sa mga asnong hindi napaamo; malinaw at kasalukuyang Filipino.
- source_word: בַּמִּדְבָּר
  choice: sa ilang
  rationale: Saklaw nito ang di-sinasakang ilang o ilang na lupain, hindi lamang mabuhanging disyerto.
- source_word: יָצְאוּ בְּפָעֳלָם
  choice: lumalabas sila para sa kanilang gawain
  rationale: Pinananatili ang payak na kilos at ang layunin ng kanilang pagpapagal upang mabuhay.
- source_word: מְשַׁחֲרֵי לַטָּרֶף
  choice: maagang naghahanap ng makakain
  rationale: Ipinahahayag kapwa ang masikap o maagang paghahanap at ang pagkain bilang panustos sa konteksto ng karalitaan; ang literal na 'biktima' ay maaaring magmukhang hayop lamang ang tinutukoy.
- source_word: עֲרָבָה
  choice: tigang na kapatagan
  rationale: Inilalarawan ang tuyot na steppe o kaparangan nang mas tiyak kaysa sa pangkalahatang 'ilang'.
- source_word: לוֹ
  choice: niya
  rationale: Pinananatili ang isahang anyo ng tekstong Hebreo sa halip na tahimik itong gawing maramihan.
- source_word: לֶחֶם
  choice: pagkain
  rationale: Ang 'tinapay' ay literal ngunit dito ay metonimiya para sa pangunahing panustos; mas natural ang 'pagkain' sa Filipino habang nananatili ang diwa.
- source_word: לַנְּעָרִים
  choice: para sa mga anak
  rationale: Sa konteksto, tumutukoy ito sa mga batang umaasa sa kaniya; hindi nililimitahan ng 'mga anak' sa lalaki ang kahulugan.
