translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang maiikling linyang patula upang mapanatili ang galaw at parallelismo. Ang isahang 'niya' ay sadyang pinanatili dahil iyon ang anyo ng Hebreo, kahit maramihan ang naunang paksa.
