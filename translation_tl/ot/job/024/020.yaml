  yaml_path: translation/ot/job/024/020.yaml
  text: The womb forgets him[a]; the worm feeds sweetly on him. He is remembered no more[b], and injustice is broken like a tree.
translation:
  language: tl
  text: Nililimot siya ng sinapupunan; nasasarapan sa kaniya ang uod.[a] Hindi na siya maaalaala, at ang kasamaan ay nabali na parang punongkahoy.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “matamis siya sa uod.”
    reason: lexical_alternative
  - marker: b
    text: O, “nabili na parang punongkahoy ang taong masama.” Abstraktong pangngalan ang Hebreo na nangangahulugang “kasamaan” o “kalikuan,” ngunit maaari itong tumukoy sa taong gumagawa ng masama.
    reason: alternative_reading
lexical_decisions:
- source_word: יִשְׁכָּחֵהוּ
  choice: Nililimot siya
  rationale: Ang Qal imperfect ng שׁכח na may hulaping 3ms ay isinalin sa pangkasalukuyang anyo upang ipahayag ang masigla at pangkalahatang paglalarawan sa sinapit ng masama.
- source_word: רֶחֶם
  choice: ng sinapupunan
  rationale: Pinananatili ang tahasan at matinding personipikasyon ng Hebreo; hindi ito pinalawak bilang ‘sinapupunan ng kaniyang ina.’
- source_word: מְתָקוֹ רִמָּה
  choice: nasasarapan sa kaniya ang uod
  rationale: Ipinahahayag sa likas na Tagalog ang ideyang matamis o kanais-nais siya sa uod bilang kinakain, nang hindi labis na nililinaw ang maigsi at kakila-kilabot na larawan ng Hebreo.
- source_word: עוֹד לֹא יִזָּכֵר
  choice: Hindi na siya maaalaala
  rationale: Pinananatili ang balintiyak na tinig ng Niphal at ang diwa ng עוֹד לֹא na wala nang kasunod na pag-alaala.
- source_word: וַתִּשָּׁבֵר
  choice: ay nababali
  rationale: Ang balintiyak na ‘nababali’ ay maikli, patula, at umaangkop sa pangkalahatang paglalarawan ng wakas ng masama.
- source_word: כָּעֵץ
  choice: na parang punongkahoy
  rationale: Direktang pinananatili ang paghahambing at ang karaniwang kahulugan ng עֵץ bilang puno.
- source_word: עַוְלָה
  choice: ang kasamaan
  rationale: Pinananatili ang abstraktong anyo ng pangngalang Hebreo. Mas likas sa Tagalog ang ‘kasamaan’ kaysa ‘kawalang-katuwiran’ sa larawang nababali na parang puno.
theological_decisions:
- issue: Kung ang עַוְלָה ay dapat unawaing abstrakto bilang ‘kasamaan’ o kongkreto bilang ‘taong masama.’
  choice: 'Abstrakto: ‘ang kasamaan ay nababali na parang punongkahoy.’'
  alternative: 'Kongkreto: ‘nababali na parang punongkahoy ang taong masama.’'
  rationale: Abstraktong pangngalan ang tahasang anyo sa Hebreo, kaya iyon ang pinanatili sa teksto. Gayunman, maaari itong kumatawan sa taong gumagawa ng masama, kaya inilagay sa talababa ang kongkretong pagbasa.
translation_notes:
  register: Makabago ngunit marangal na Tagalog, na may maigsi at matinding himig ng tulang Hebreo. Pinanatili ang personipikasyon ng sinapupunan at ang abstraktong ‘kasamaan,’ habang inilagay sa mga talababa ang tunay na mga alternatibong pagbasa.
