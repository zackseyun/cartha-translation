  yaml_path: translation/ot/job/024/021.yaml
  text: He preys on the barren woman who does not bear[a], and he does no good to the widow.
translation:
  language: tl
  text: Sinasamantala niya ang babaeng baog na hindi nanganganak[a], at hindi siya gumagawa ng mabuti para sa balo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kinakain niya ang babaeng baog.” Literal na “nagpapastol/nagpapakain” ang pandiwang Hebreo, ngunit sa kontekstong ito ay malamang na may mapanirang diwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹעֶה
  choice: sinasalakay
  rationale: Ang literal na diwa ng pandiwa ay “nagpapastol/nagpapakain,” ngunit sa mapaminsalang konteksto ay tumutukoy ito sa mapang-abusong pagtrato sa isang mahina. Ipinahahayag ng “sinasalakay” ang negatibong puwersa nang hindi ipinapasok ang positibong larawan ng pagpapastol; inilalagay sa talababa ang literal na posibilidad.
- source_word: עֲקָרָה
  choice: babaeng baog
  rationale: Tuwirang tumutukoy sa isang babaeng hindi nagkakaanak; malinaw at karaniwang nauunawaan sa modernong Filipino.
- source_word: לֹא תֵלֵד
  choice: na hindi nanganganak
  rationale: Malapit sa literal na “hindi nagsisilang/nanganganak” at hindi nagdaragdag ng modal na “hindi kayang,” na hindi tahasang nasa Hebreo.
- source_word: אַלְמָנָה
  choice: balo
  rationale: Karaniwang katumbas sa Filipino para sa mahina at nanganganib na pangkat na tinutukoy ng Hebreo.
- source_word: לֹא יְיֵטִיב
  choice: wala siyang ginagawang mabuti sa
  rationale: Pinananatili ang kahulugang “gumawa ng mabuti/pakitunguhan nang mabuti” at ang moral na bigat ng pahayag nang hindi ito labis na ipinapakahulugan bilang isang tiyak na uri ng kabaitan.
