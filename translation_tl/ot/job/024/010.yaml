base_translation:
  language: en
  yaml_path: translation/ot/job/024/010.yaml
  text: They go about naked[a], without clothing; hungry, they carry sheaves.
translation:
  language: tl
  text: Hubad silang naglalakad, walang damit; gutom silang nagdadala ng mga bigkis ng inaning butil.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “isang bigkis ng inaning butil.” Isahan ang pangngalang Hebreo, ngunit maaaring kolektibo ang gamit nito rito.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָרוֹם
  choice: hubad
  rationale: Tuwirang ipinahahayag nito ang kawalan o matinding kakulangan ng kasuotan, ayon sa kalagayang inilalarawan sa konteksto.
- source_word: הִלְּכוּ
  choice: naglalakad
  rationale: Ang anyong Tagalog na ito ay likas na naglalarawan ng nagpapatuloy o nakaugaliang pagkilos, hindi lamang ng isang minsanang paglakad.
- source_word: בְּלִי לְבוּשׁ
  choice: walang damit
  rationale: Malinaw at natural itong katumbas ng pariralang nagsasaad na wala silang kasuotan.
- source_word: רְעֵבִים
  choice: gutom
  rationale: Pinananatili nito ang payak na kahulugan ng Hebreo nang hindi pinalalabis bilang ‘nagugutom nang labis’ o ‘halos mamatay sa gutom.’
- source_word: נָשְׂאוּ
  choice: nagdadala
  rationale: Ito ang natural na salin para sa pagbubuhat o pagdadala ng inaning ani sa konteksto ng sapilitang paggawa.
- source_word: עֹמֶר
  choice: mga bigkis ng inaning butil
  rationale: Ang pangngalan ay nasa anyong isahan ngunit maaaring kolektibo ang gamit. Nililinaw ng ‘inaning butil’ kung ano ang nakabigkis, at ang maramihan ay angkop sa maraming manggagawang nagdadala nito.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang matinding paghahambing sa pagitan ng gutom ng mga manggagawa at ng aning sila mismo ang nagdadala. Inilipat ang talababa sa ‘mga bigkis ng inaning butil,’ sapagkat iyon ang salitang may tunay na alternatibong isahan sa Hebreo.
