  source_fidelity: 'Tumpak ang salin sa dalawang patulang sugnay: ang tagtuyot at init ang marahas na kumukuha sa “tubig ng niyebe,” at ang Sheol ang katapat na kumukuha sa mga nagkasala. Ang “inaagaw” ay angkop na masiglang katumbas ng יִגְזְלוּ, at malinaw na naipahayag ang elipsis sa ikalawang sugnay nang walang idinagdag na imahen.'
  naturalness: Natural at marangal ang modernong Filipino. Ang pag-uulit ng “inaagaw” at paggamit ng “gayundin” ay nakapagpapalinaw sa paghahambing na patula. Ang “tubig ng niyebe” ay bahagyang literal ngunit naiintindihan at naaangkop sa rehistrong pangkasulatan.
  terminology: Wasto ang “tagtuyot,” “init,” at “Sheol.” Maingat na pinanatili ng “Sheol” ang saklaw ng terminong Hebreo at hindi ito ipinantay sa impiyerno. Ang mga talababa ay wastong nagpapaliwanag ng posibleng “tubig na natunaw mula sa niyebe” at ng kahulugang “libingan” nang hindi inaalis ang pangunahing ambiguwidad.
