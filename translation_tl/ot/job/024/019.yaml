  text: צִיָּ֤ה גַם חֹ֗ם יִגְזְל֥וּ מֵֽימֵי שֶׁ֗לֶג שְׁא֣וֹל חָטָֽאוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/024/019.yaml
  text: Drought and heat also snatch away the waters of snow[b][a]; so Sheol takes those who have sinned.
translation:
  language: tl
  text: Inaagaw ng tagtuyot at init ang tubig ng niyebe[a]; gayundin, inaagaw ng Sheol[b] ang mga nagkasala.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “tubig na natunaw mula sa niyebe.” Literal sa Hebreo: “tubig ng niyebe.”'
    reason: lexical_alternative
  - marker: b
    text: Ang “Sheol” ay katawagang Hebreo para sa daigdig o kinaroroonan ng mga patay; maaari ring isaling “libingan.”
    reason: alternative_reading
lexical_decisions:
- source_word: צִיָּה
  choice: tagtuyot
  rationale: Tumutukoy sa matinding pagkatuyo o kawalan ng ulan; ang “tagtuyot” ay natural sa Filipino at nababagay bilang kaparis ng “init.”
- source_word: גַם
  choice: at
  rationale: Sa pariralang צִיָּה גַם חֹם, idinudugtong nito ang “init” sa “tagtuyot.” Mas natural sa Filipino ang payak na “at” kaysa piliting isalin itong “din.”
- source_word: חֹם
  choice: init
  rationale: Direkta at karaniwang katumbas ng pangngalan, at pinananatili ang pares na tagtuyot at init.
- source_word: יִגְזְלוּ
  choice: inaagaw
  rationale: Pinananatili ang marahas at masiglang larawan ng pandiwang nangangahulugang mang-agaw o magnakaw. Ang aspektong di-ganap ay angkop sa pangkalahatang obserbasyong patula.
- source_word: מֵימֵי שֶׁלֶג
  choice: ang tubig ng niyebe
  rationale: Malapit sa literal na “mga tubig ng niyebe” ngunit mas natural sa Filipino. Hindi tahasang nililimitahan sa natunaw na tubig, kaya nananatili ang larawan at ambiguwidad ng Hebreo.
- source_word: שְׁאוֹל
  choice: Sheol
  rationale: Pinananatili ang katawagang Hebreo para sa daigdig o kinaroroonan ng mga patay, sa halip na paliitin ang kahulugan sa “libingan” o iugnay agad sa impiyerno.
- source_word: חָטָאוּ
  choice: ang mga nagkasala
  rationale: Ang anyong pandiwa ay literal na “nagkasala sila.” Sa eliptikong ikalawang sugnay, ang “mga nagkasala” ang malinaw at natural na pagpapahayag sa Filipino nang hindi binabago ang verbal na ideya.
theological_decisions:
- issue: Kahulugan ng שְׁאוֹל
  choice: Pinanatili bilang “Sheol,” na tumutukoy sa daigdig o kinaroroonan ng mga patay.
  alternative: “libingan,” “daigdig ng mga patay,” o “kamatayan”
  rationale: Hindi tinutukoy ng talata ang isang mas makitid o huling kalagayan ng kaparusahan. Ang transliterasyon ay nagpapanatili sa lawak at tensiyong teolohikal ng katawagang Hebreo.
- issue: Elipsis at paghahambing sa ikalawang sugnay
  choice: Ginamit ang “gayundin” at inulit ang “inaagaw” upang malinaw ang ipinahihiwatig na paghahambing.
  alternative: Panatilihin ang putol na anyong “Sheol—ang mga nagkasala,” o isaling “nilalamon ng Sheol”
  rationale: 'Ang Hebreo ay patulang eliptiko: ang kilos sa unang sugnay ang ipinahihiwatig sa ikalawa. Ginagawang malinaw ng salin ang ugnayan nang hindi nagdaragdag ng ibang imaheng gaya ng “nilalamon.”'
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang masidhing personipikasyon sa “inaagaw” at ang katawagang “Sheol,” habang ginawang natural ang eliptikong paghahambing sa pamamagitan ng “gayundin.”
