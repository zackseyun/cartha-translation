base_translation:
  language: en
  yaml_path: translation/ot/job/024/001.yaml
  text: Why are times not kept by the Almighty[b][a], and why do those who know him not see his days?
translation:
  language: tl
  text: Bakit hindi lingid sa Makapangyarihan sa Lahat ang mga panahon[a], at bakit hindi nakikita ng mga nakakakilala sa kanya ang kanyang mga araw?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Bakit hindi nakalaan o naitabi ng Makapangyarihan sa Lahat ang mga takdang panahon?”
    reason: lexical_alternative
  - marker: b
    text: Ang “kanyang mga araw” ay maaaring tumukoy sa mga panahong kumikilos ang Diyos, gaya ng sa paghatol.
    reason: alternative_reading
lexical_decisions:
- source_word: מַדּוּעַ
  choice: Bakit
  rationale: Likas at tuwirang panandang pananong sa makabagong Filipino; pinananatili nito ang diin ng hinaing ni Job.
- source_word: מִשַּׁדַּי
  choice: ang Makapangyarihan sa Lahat
  rationale: Ang שַׁדַּי ay karaniwang titulo ng Diyos sa Job. Isinaayos ang pangungusap sa aktibong anyo para maging malinaw at natural sa Filipino, habang kinikilala sa talababa ang mas literal na pasibong pagbasa.
- source_word: נִצְפְּנוּ
  choice: nagtatakda
  rationale: Ang צפן ay maaaring mangahulugang magtago, mag-imbak, o magreserba. Sa ugnay nito sa עִתִּים, ipinahahayag ng 'nagtatakda' ang ideya ng paglalaan ng mga panahong kikilos ang Diyos, nang hindi tahasang tinutukoy kung ano ang gagawin niya. Inilalahad sa talababa ang mas literal na 'inilalaan/itinatabi.'
- source_word: עִתִּים
  choice: mga panahon
  rationale: Pinananatili ang malawak at bahagyang di-tiyak na kahulugan ng עִתִּים. Ang posibleng diwang 'mga takdang panahon' ay nasa talababa.
- source_word: וְיֹדְעָיו
  choice: mga nakakakilala sa kanya
  rationale: Likas na Filipino para sa participle na tumutukoy sa mga taong may pagkakilala sa Diyos; pinananatili ang relasyonal na diwa.
- source_word: חָזוּ
  choice: nakikita
  rationale: Tuwirang katumbas ng ideya ng pagkakita o pagkamasid, at hindi dinaragdagan ng tiyak na bisyonaryong kahulugan.
- source_word: יָמָיו
  choice: ang kanyang mga araw
  rationale: Literal na pinananatili ang pangmaramihang anyo at ang panghalip upang huwag agad tukuyin ang mga ito bilang mga araw ng paghatol o pakikialam ng Diyos.
theological_decisions:
- issue: Kahulugan ng “kanyang mga araw” bilang pagtukoy sa Diyos
  choice: Panatilihin ang literal na “ang kanyang mga araw.”
  alternative: “ang mga araw ng kanyang paghatol” o “ang mga panahong kumikilos siya”
  rationale: Masinsin at bukás sa higit sa isang pagpapakahulugan ang Hebreo. Maaaring tumukoy ito sa mga araw ng paghatol o pakikialam ng Diyos, ngunit hindi iyon tahasang sinasabi ng pangunahing teksto.
- issue: Kaugnayan ng Makapangyarihan sa Lahat sa pagtatakda o pagtatago ng mga panahon
  choice: Gamitin sa pangunahing teksto ang natural na tanong na “hindi nagtatakda ng mga panahon ang Makapangyarihan sa Lahat.”
  alternative: “hindi inilalaan/itinatabi ng Makapangyarihan sa Lahat ang mga panahon” o “hindi nakakubli sa Makapangyarihan sa Lahat ang mga panahon”
  rationale: Maaaring ipahiwatig ng Hebreo ang pagreserba ng mga takdang panahon sa kapangyarihan ng Diyos, ngunit may tunay na kalabuan sa pandiwa at sa pang-ukol. Pinananatili sa talababa ang mas literal na pagbasa sa halip na gawing tiyak na doktrina ang isang posibilidad.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Makapangyarihan sa Lahat” bilang madaling maunawaang titulo para sa שַׁדַּי. Pinanatili ang makatang pariralang “kanyang mga araw” at inilagay sa talababa ang malamang na kahulugan nito.
