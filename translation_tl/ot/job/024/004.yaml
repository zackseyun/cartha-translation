  text: They turn the needy off the road[b][a]; together the poor of the land hide themselves.
translation:
  language: tl
  text: Inililihis nila palayo sa daan ang mga nangangailangan[a]; sama-samang nagtatago ang mga dukha sa lupain[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Inililihis nila ang mga nangangailangan mula sa landas.”
    reason: lexical_alternative
  - marker: b
    text: O “ang mga dukha sa daigdig.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יַטּוּ
  choice: Inililihis nila
  rationale: Ang Hiphil ng נטה ay causative, ‘pinapalingon’ o ‘inililihis.’ Pinananatili ng ‘inililihis’ ang causative na diwa nang hindi tahasang nagdaragdag ng puwersang hindi likas na binanggit.
- source_word: אֶבְיוֹנִים
  choice: ang mga nangangailangan
  rationale: Tumutukoy ang אֶבְיוֹנִים sa mga dukha o nangangailangan na mahina ang kalagayang panlipunan. Ipinag-iiba ito nang bahagya sa kasunod na עֲנִיֵּי habang kinikilalang magkalapit ang kahulugan.
- source_word: מִדָּרֶךְ
  choice: sa daan
  rationale: Sa konstruksiyong ‘inililihis ... sa daan,’ likas na ipinahihiwatig ng Tagalog na inilalayo sila mula sa daan. Ang ‘daan’ ay nagpapanatili rin sa konkretong larawan, bagaman maaari itong unawaing ‘landas’ o ‘pamamaraan.’
- source_word: יַחַד
  choice: sama-samang
  rationale: Tuwirang ipinahahayag nito ang sama-sama o kolektibong kalagayan ng mga dukha.
- source_word: חֻבְּאוּ
  choice: nagtatago
  rationale: Ang Pual ng חבא ay maaaring unawaing pasibo o stative, ‘nakatago,’ ngunit sa Filipino ay natural ang ‘nagtatago’ para sa pag-urong nila sa paningin dahil sa pang-aapi. Itinatala sa talababa ang pasibong posibilidad.
- source_word: עֲנִיֵּי אָרֶץ
  choice: ang mga dukha sa lupain
  rationale: Ang עָנִי ay maaaring ‘dukha,’ ‘api,’ o ‘nagdurusa.’ Ang ‘mga dukha sa lupain’ ay malinaw at natural sa kontekstong panlipunan; maaari ring isalin ang אֶרֶץ bilang ‘daigdig.’
