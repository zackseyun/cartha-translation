translation_notes:
  register: Makabago ngunit marangal na Filipino. Pinili ang ‘inililihis’ kaysa ‘itinutulak’ o ‘pinagtabuyan’ upang manatiling malapit sa Hebreong causative nang hindi pinalalakas nang labis ang tahasang dahas. Ang pagkakasunod ng mga parirala ay inayos para sa natural na daloy sa Tagalog.
