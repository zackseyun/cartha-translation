  source_fidelity: 'Ang pangunahing diwa ay tapat sa Hebreo: ang mga nangangailangan ay inililihis mula sa daan, at ang mga dukha ng lupain ay sama-samang nagtatago. Gayunman, ang kasalukuyang “inililihis nila sa daan” ay hindi malinaw na nagsasaad ng pag-aalis mula sa daan at maaari pang mangahulugang inililihis habang nasa daan.'
  naturalness: Mas malinaw at likas sa modernong Filipino ang “inililihis nila palayo sa daan ang mga nangangailangan.” Ang “sama-samang nagtatago” ay natural at naipahahayag ang kolektibong kalagayan, bagaman ang anyong Pual ng Hebreo ay maaari ring unawaing “nakatago.”
  terminology: Ang “mga nangangailangan” at “mga dukha” ay angkop na magkaibang salin para sa magkalapit ngunit hindi magkaparehong Hebreong katawagan. Ang “lupain” ay angkop para sa אֶרֶץ sa kontekstong panlipunan.
