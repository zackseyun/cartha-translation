  yaml_path: translation/ot/job/024/016.yaml
  text: In the dark they break into houses[a]; by day they shut themselves in[c][b]; they do not know the light.
translation:
  language: tl
  text: Sa dilim, binubutas niya ang mga bahay[a]; sa araw, nagkukulong sila[b]; hindi nila kilala ang liwanag[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa dilim ay bumubutas siya sa mga bahay.” Ang pandiwang Hebreo ay literal na maaaring mangahulugang “humukay” o “bumutas,” malamang sa pader upang makapasok. Isahan ang pandiwa rito, bago lumipat sa maramihan ang kasunod na mga pandiwa.
    reason: lexical_and_grammatical_alternative
  - marker: b
    text: O “sa araw, ikinukulong nila ang kanilang sarili.” Ang pandiwang Hebreo ay maaari ring mangahulugang “tinatatakan” o “mahigpit na isinasara”; maaaring idiin nito ang pagkukubli nila habang maliwanag.
    reason: lexical_alternative
  - marker: c
    text: Ang “liwanag” ay maaaring literal na tumukoy sa liwanag ng araw, ngunit maaari ring may moral na pahiwatig sa konteksto ng masasamang taong umiiwas na malantad.
    reason: semantic_ambiguity
lexical_decisions:
- source_word: חָתַר
  choice: binubutas
  rationale: Ang pandiwa ay literal na tumutukoy sa paghuhukay o pagbutas, lalo na sa pader upang makapasok. Pinananatili ng “binubutas” ang kongkretong larawan ng paraan ng pagnanakaw; ipinapaliwanag sa talababa ang idyomatikong diwang pagpasok nang sapilitan.
- source_word: בַּחֹשֶׁךְ
  choice: sa dilim
  rationale: Natural na modernong Tagalog ito para sa panahon o kalagayan ng pagkilos at pinananatili ang larawan ng pagtatago.
- source_word: בָּתִּים
  choice: mga bahay
  rationale: Tuwirang katumbas ito ng pangmaramihang pangngalan para sa mga tirahan at angkop sa tagpo ng pagnanakaw.
- source_word: יוֹמָם
  choice: kung araw
  rationale: Maikli at natural na panandang pamanahon na malinaw na kasalungat ng “sa dilim.”
- source_word: חִתְּמוּ לָמוֹ
  choice: nagkukulong sila
  rationale: Ang pandiwa ay “tatakan, sarhan.” Sa konteksto, ipinahihiwatig nito ang pagsasara o pagkukubli nila sa sarili habang araw. Ang “nagkukulong sila” ay natural ngunit hindi labis na nagpapaliwanag.
- source_word: לֹא יָדְעוּ אוֹר
  choice: hindi nila kilala ang liwanag
  rationale: Pinananatili nito ang Hebreong idyoma at ang posibleng sabayang literal at moral na pahiwatig ng “liwanag,” sa halip na paliitin ito sa “liwanag ng araw” lamang.
theological_decisions:
- issue: Posibleng moral at sagisag na diwa ng “liwanag”
  choice: Panatilihin ang literal na “liwanag” sa pangunahing teksto.
  alternative: Isalin bilang “liwanag ng araw” o ipakahulugang “kung ano ang matuwid.”
  rationale: Pangunahin sa konteksto ang pagsalungat ng krimen sa gabi at pagtatago sa araw, ngunit maaaring may moral ding pahiwatig ang liwanag. Pinananatili ng salin ang tensiyong ito.
- issue: Pagbabago mula isahan tungo sa maramihan sa Hebreo
  choice: Gamitin ang maramihang “nila/sila” sa buong talata para sa natural na daloy sa Tagalog.
  alternative: Panatilihin ang “binubutas niya” sa unang sugnay at lumipat sa “sila” sa kasunod.
  rationale: Ang unang pandiwa ay anyong isahan ngunit ang kasunod na mga anyo ay maramihan, malamang na mula sa isang kinatawang gumagawa tungo sa uri ng gayong mga tao. Ang maramihan sa Tagalog ay malinaw at kaayon ng pangkalahatang tinutukoy, nang hindi binabago ang pangunahing diwa.
translation_notes:
  register: Modernong Filipino Tagalog na payak ngunit marangal. Pinili ang kongkretong “binubutas” upang manatiling malapit sa larawan ng Hebreo, at ang “nagkukulong” para sa natural na pagbasa. Inilagay ang bawat pananda ng talababa sa mismong sugnay na tinutukoy nito.
