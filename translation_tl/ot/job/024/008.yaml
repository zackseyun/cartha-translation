  yaml_path: translation/ot/job/024/008.yaml
  text: They are drenched by the mountain rains[a]; lacking shelter[b], they embrace the rock.
translation:
  language: tl
  text: Basang-basa sila sa buhos ng ulan sa kabundukan[a]; dahil walang masisilungan, yumayakap sila sa bato.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa rumaragasang tubig mula sa mga bundok” o “sa bagyong ulan sa kabundukan.”
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “yumayakap sila sa bato”; ibig sabihin, dumidikit sila rito upang makasilong.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזֶּרֶם הָרִים
  choice: sa malakas na ulan sa mga bundok
  rationale: Ang זֶרֶם ay maaaring tumukoy sa malakas na buhos ng ulan o rumaragasang tubig. Sa konteksto ng pagkabasa at kawalan ng silungan, malinaw at natural sa modernong Tagalog ang meteorolohikal na diwa, habang pinananatili sa talababa ang ibang posibilidad.
- source_word: יִרְטָבוּ
  choice: Basang-basa sila
  rationale: Ipinahihiwatig ng pandiwa ang pagiging basa o lubhang nabasa. Ang “basang-basa” ay natural at nagpapakita ng tindi ng kanilang pagkakalantad sa panahon.
- source_word: וּמִבְּלִי מַחְסֶה
  choice: dahil walang masisilungan
  rationale: Ang parirala ay nangangahulugang walang kanlungan o silungan. Ginagawang malinaw ng “dahil” ang ugnayan nito sa pagyakap sa bato nang hindi nagdaragdag ng diwang banyaga sa konteksto.
- source_word: חִבְּקוּ
  choice: yumayakap sila
  rationale: Pinananatili nito ang matingkad at literal na larawan ng pagyakap, sa halip na agad itong ipaliwanag bilang pagkapit.
- source_word: צוּר
  choice: malaking bato
  rationale: Ang צוּר ay bato o batuhan na maaaring magsilbing masisilungan. Ang “malaking bato” ay mas natural at mas malinaw kaysa sa payak na “bato” sa larawang ito, nang hindi ito ginagawang kuweba o ganap na kanlungan.
