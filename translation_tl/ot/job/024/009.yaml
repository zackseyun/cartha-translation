    issue: Idinagdag sa pangunahing teksto ang “ng ina.”
    rationale: Ang Hebreo ay may “mula sa suso/dibdib” ngunit hindi hayagang nagsasaad ng “ina.” Bagaman posibleng ipinahihiwatig ito ng konteksto, dapat manatili ang mas maingat na antas ng katiyakan sa pangunahing salin.
  - severity: medium
    issue: Isinalin ang panagot bilang “ang pag-aari ng dukha.”
    rationale: Ang יַחְבֹּלוּ ay tumutukoy sa pagkuha ng isang panagot/kolateral mula sa dukha. Hindi tinutukoy ng teksto ang bagay bilang “pag-aari,” at ang dagdag na ito ay maaaring magbago sa pokus ng kilos.
