  text: They snatch the orphan from the breast[a], and they take a pledge from the poor.
translation:
  language: tl
  text: Inaagaw nila ang ulila mula sa suso[a], at kumukuha sila ng panagot mula sa dukha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Inaagaw nila ang ulila mula sa suso ng ina.” Mahirap unawain ang pariralang Hebreo; ipinahihiwatig nito na marahas na kinukuha ng masasama maging ang isang ulilang batang sumususo.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִגְזְלוּ
  choice: Inaagaw nila
  rationale: Ang גזל ay tumutukoy sa marahas o di-makatarungang pagkuha; ipinahahayag ng “inaagaw” ang puwersa at kalupitan ng kilos.
- source_word: מִשֹּׁד
  choice: mula sa dibdib ng ina
  rationale: Mahirap ang anyong Hebreo. Sinusunod ng salin ang tradisyonal na pagkaunawang tumutukoy sa dibdib o kandungan, at ginagawang malinaw sa natural na Tagalog ang larawan ng isang batang inaalis habang sumususo.
- source_word: יָתוֹם
  choice: ang ulila
  rationale: Karaniwang tumutukoy ang יָתוֹם sa ulila, lalo na sa batang walang ama; “ulila” ang maikli at likas na katawagan sa Tagalog.
- source_word: וְעַל
  choice: at ... ang pag-aari ng
  rationale: Kasama ng חבל, ipinakikilala ng עַל ang taong pinipinsala sa pagkuha ng panagot. Isinaayos ang parirala upang maging malinaw at likas sa Tagalog.
- source_word: עָנִי
  choice: dukha
  rationale: Sa konteksto ng mapagsamantalang pagpapautang, ang sosyo-ekonomikong diwang “dukha” ang pinakamalapit.
- source_word: יַחְבֹּלוּ
  choice: kinukuha nilang panagot sa utang ang pag-aari
  rationale: Ang pandiwa ay tumutukoy sa pagkuha ng sangla o collateral. Idinagdag ang “pag-aari” bilang likas na layon sa Tagalog nang hindi tinutukoy kung anong bagay iyon.
theological_decisions: []
translation_notes:
  register: Makabagong Filipino na marangal ngunit madaling maunawaan. Pinanatili ang marahas na larawan sa unang linya at nilinaw ang legal-ekonomikong diwa ng ikalawang linya. Ang “dibdib ng ina” ay bahagyang mas tahasan kaysa sa Hebreo, kaya nilagyan ng talababa upang kilalanin ang hirap at alternatibong pagbasa.
