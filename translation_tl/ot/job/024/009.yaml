  verdict: revise
  source_fidelity: Ang unang sugnay ay wastong naghahatid ng marahas na pag-agaw sa ulila, ngunit ang “dibdib ng ina” ay mas tiyak kaysa sa mahirap na Hebreong מִשֹּׁד (“mula sa suso/dibdib”). Sa ikalawang sugnay, ang “pag-aari ng dukha” ay nagdaragdag ng layon na wala sa teksto at maaaring magmungkahi na mismong ari-arian ang isinasangla; ang Hebreo ay nagsasabing kumukuha sila ng panagot mula sa dukha.
  naturalness: Mas natural at malinaw sa makabagong Filipino ang “Inaagaw nila ang ulila mula sa suso” at “kumukuha sila ng panagot mula sa dukha.” Ang “panagot” ay sapat na legal-ekonomikong salita; hindi kailangang magdagdag ng “sa utang” o “pag-aari.”
  terminology: Ang “ulila,” “suso,” “dukha,” at “panagot” ay angkop sa register at sa diwa ng talata. Pinananatili ng talababa ang pinag-aalitang/mahirap na larawan nang hindi ipinipilit na tahasang binabanggit ng Hebreo ang ina.
  issues:
