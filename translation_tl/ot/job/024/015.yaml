base_translation:
  language: en
  yaml_path: translation/ot/job/024/015.yaml
  text: The eye of the adulterer waits for twilight[a], saying, ‘No eye will see me’[b]; and he puts a covering over his face.
translation:
  language: tl
  text: Ang mata ng mangangalunya ay nag-aabang ng takipsilim[a], na sinasabi, “Walang matang makakakita sa akin”; at naglalagay siya ng pantakip sa kanyang mukha.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “dapithapon.” Ang pangngalang Hebreo ay tumutukoy sa malabong liwanag sa pagtatapos ng araw, na angkop sa konteksto ng kasalanang palihim.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “at naglalagay siya ng pagtatago ng mukha.” Ipinahihiwatig ng pariralang Hebreo na tinatakpan o ikinukubli niya ang kanyang mukha upang hindi makilala.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵין
  choice: mata
  rationale: Pinananatili ang kongkretong larawan ng matang nagmamasid at ng matang maaaring makakita sa gumagawa ng lihim na kasalanan.
- source_word: נֹאֵף
  choice: mangangalunya
  rationale: Ang panlalaking pang-isahang participle ay tumutukoy sa lalaking gumagawa ng pangangalunya; malinaw at likas sa modernong Filipino ang “mangangalunya.”
- source_word: שָׁמְרָה
  choice: nag-aabang
  rationale: Bagaman ang pangunahing diwa ng pandiwa ay magbantay o mag-ingat, ipinahihiwatig ng konteksto ang sabik na paghihintay sa pagdating ng dilim.
- source_word: נֶשֶׁף
  choice: takipsilim
  rationale: Tumutukoy ito sa malabong liwanag sa hangganan ng araw at gabi; ang “takipsilim” ay natural at hindi labis na nagtatakda ng eksaktong antas ng dilim.
- source_word: לֵאמֹר
  choice: na sinasabi
  rationale: Pinananatili nito ang karaniwang pormula sa Hebreo at maaari pa ring tumukoy sa sinasabi nang malakas o sa sarili.
- source_word: תְשׁוּרֵנִי
  choice: makakakita sa akin
  rationale: Natural na salin ng pandiwang nangangahulugang tumingin o makakita, at pinananatili ang tema ng pag-iwas na makita.
- source_word: וְסֵתֶר פָּנִים
  choice: pantakip sa kanyang mukha
  rationale: Ang siksik na pariralang Hebreo ay literal na tumutukoy sa pagtatago o pagtatakip ng mukha; malinaw ang salin nang hindi tinutukoy kung anong uri ng pantakip iyon.
- source_word: יָשִׂים
  choice: naglalagay siya
  rationale: Tuwirang katumbas ng pandiwang “maglagay/maglapag” at likas na kasama ng “pantakip.”
