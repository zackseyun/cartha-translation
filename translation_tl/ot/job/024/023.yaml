  yaml_path: translation/ot/job/024/023.yaml
  text: He gives them security[a], and they are supported[b]; his eyes are on their ways.
translation:
  language: tl
  text: Binibigyan niya sila ng katiwasayan[a], at sila'y inaalalayan[b]; nakatuon ang kanyang mga mata sa kanilang mga lakad.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, isahan ang “sa kanya” at “siya'y inaalalayan.” Isinalin dito ang mga ito bilang maramihan dahil maramihan ang “kanilang mga lakad” sa hulihan ng talata.
    reason: alternative_reading
  - marker: b
    text: 'O, mas pormal: “Binibigyan niya siya ng katiwasayan, at siya''y inaalalayan; nakatuon ang kanyang mga mata sa kanilang mga lakad.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִתֶּן לָבֶטַח
  choice: Binibigyan ... ng katiwasayan
  rationale: Ang Qal imperfect ng נתן kasama ng לָבֶטַח ay tumutukoy sa pagkakaloob ng kalagayang ligtas o panatag. Natural sa makabagong Filipino ang “binibigyan ng katiwasayan” at hindi nito inililipat ang diwa sa pansariling tiwala lamang.
- source_word: לוֹ
  choice: sila
  rationale: Bagaman isahan ang anyong Hebreo (“sa kanya”), ang pangwakas na דַּרְכֵיהֶם (“kanilang mga lakad”) ay maramihan at nagpapahiwatig ng kolektibong pagtukoy sa masasama. Nananatili sa talababa ang pormal na isahan.
- source_word: וְיִשָּׁעֵן
  choice: at sila'y inaalalayan
  rationale: Ang Nifal imperfect ng שׁען ay maaaring mangahulugang maalalayan, masuportahan, o sumandig. Ipinahahayag ng “inaalalayan” ang pasibo o resultang kalagayan at likas pakinggan sa Filipino; ginawang maramihan ayon sa kolektibong pagbasa.
- source_word: וְעֵינֵיהוּ עַל
  choice: nakatuon ang kanyang mga mata sa
  rationale: Pinananatili ang maramihang “mga mata” at ang idyoma ng mapagmasid na pagtutuon. Hindi tahasang pinapangalanan ang tinutukoy ng panghalip sapagkat hindi rin ito pinapangalanan sa talata.
- source_word: דַּרְכֵיהֶם
  choice: kanilang mga lakad
  rationale: Pinananatili ng “mga lakad” ang talinghaga ng דרך habang malinaw na maaari itong tumukoy sa pamumuhay o asal.
theological_decisions:
- issue: Pagpapalit sa isahan at maramihan at ang tinutukoy ng mga panghalip
  choice: Kolektibong maramihan sa unang hati (“sila”), ngunit pinanatili ang isahang “kanyang” sa huling sugnay.
  alternative: “Binibigyan niya siya ng katiwasayan, at siya'y inaalalayan; nakatuon ang kanyang mga mata sa kanilang mga lakad.”
  rationale: Magkahalo sa Hebreo ang isahang לוֹ at וְיִשָּׁעֵן at ang maramihang דַּרְכֵיהֶם. Ang kolektibong maramihan ay mas malinaw sa Filipino, ngunit hindi tinutukoy nang tahasan kung sino ang nagkakaloob at nagmamasid. Sa gayon, napapanatili ang sintaktiko at teolohikal na tensiyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “katiwasayan” para sa panlabas na kaligtasan o kapanatagan, “inaalalayan” para sa pasibong diwa ng Nifal, at “mga lakad” upang mapanatili ang Hebreong talinghaga ng paraan ng pamumuhay.
