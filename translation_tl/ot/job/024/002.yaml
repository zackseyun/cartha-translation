lexical_decisions:
- source_word: גְּבֻלוֹת
  choice: mga pananda ng hangganan
  rationale: Sa konteksto, tumutukoy ang pangmaramihang pangngalan sa mga pisikal na panandang naghihiwalay sa mga lupain; malinaw at natural ito sa modernong Filipino.
- source_word: יַשִּׂיגוּ
  choice: inililipat
  rationale: Dito, inilalarawan ng pandiwa ang labag sa katarungang pag-usog sa mga pananda upang makapang-angkin ng lupa. Pinananatili ng “inililipat” ang posibleng diwa ng pag-usog nang hindi ipinapalagay na tuluyang inalis ang mga ito.
- source_word: עֵדֶר
  choice: isang kawan
  rationale: Ang isahang pangngalang kolektibo ay karaniwang tumutukoy sa kawan, at ang “isang kawan” ay likas na katumbas ng anyong walang tiyak na pantukoy.
- source_word: גָּזְלוּ
  choice: inaagaw
  rationale: Ipinahihiwatig ng pandiwa ang marahas o labag sa batas na pagkuha. Ang “inaagaw” ay nagpapanatili sa puwersahang diwa, samantalang maaari ring isalin itong “ninakaw.”
- source_word: וַיִּרְעוּ
  choice: at ipinapastol iyon
  rationale: Ang pandiwang רעה ay tumutukoy sa pagpapastol o pagpapakain sa kawan. Ipinapakita ng “ipinapastol” na hayagan nilang inaalagaan bilang kanila ang kawang inagaw.
