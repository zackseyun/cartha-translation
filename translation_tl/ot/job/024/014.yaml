  text: At dawn the murderer rises[a]; he kills the poor and needy[b], and in the night he is like a thief.
translation:
  language: tl
  text: Sa pagbubukang-liwayway ay bumabangon ang mamamaslang[a]; pinapatay niya ang dukha at nangangailangan[b], at sa gabi ay para siyang magnanakaw.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Sa pagdating ng liwanag”; literal na tumutukoy ang Hebreo sa liwanag, malamang ay sa pagbubukang-liwayway.
    reason: lexical_alternative
  - marker: b
    text: O “pinapaslang niya ang dukha at nangangailangan.” Ibang pandiwa ang ginamit dito sa Hebreo kaysa sa salitang isinaling “mamamaslang,” kaya pinananatili sa pangunahing teksto ang pagkakaibang iyon sa “pinapatay.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לָאוֹר
  choice: Sa pagbubukang-liwayway
  rationale: Ang literal na pagtukoy sa pagdating ng liwanag ay likas na nagpapahiwatig ng madaling-araw; pinananatili ng pariralang ito ang temporal at makatang diwa.
- source_word: יָקוּם
  choice: bumabangon
  rationale: Ang Qal imperfect ng קום ay tumutukoy rito sa pagbangon upang kumilos; natural at tuwiran ang “bumabangon.”
- source_word: רוֹצֵחַ
  choice: ang mamamatay-tao
  rationale: Ang participle ay ginagamit bilang pangngalan para sa uri ng taong inilalarawan; ang “mamamatay-tao” ay dignified, malinaw, at generic.
- source_word: יִקְטָל
  choice: pinapatay niya
  rationale: Karaniwang pandiwa itong nangangahulugang pumatay, at iba sa salitang רצח na nasa “mamamatay-tao”; pinananatili ng salin ang pagkakaibang leksikal.
- source_word: עָנִי וְאֶבְיוֹן
  choice: ang dukha at nangangailangan
  rationale: Tinutukoy ng tambalang ito ang mga taong salat at mahina sa lipunan; pinananatili ang dalawang magkaugnay ngunit hindi lubos na magkaparehong katawagan.
- source_word: וּבַלַּיְלָה
  choice: at sa gabi
  rationale: Natural na temporal na parirala sa modernong Tagalog at malinaw na kaibahan sa pagbubukang-liwayway.
- source_word: יְהִי
  choice: ay para siyang
  rationale: Kasama ng כ, inilalarawan ng היה ang kalagayan o papel na gaya ng iba; natural na naihahayag ito sa Tagalog sa “para siyang.”
- source_word: כַגַּנָּב
  choice: magnanakaw
  rationale: Ang prefixed כ ay paghahambing; kasama ng “para siyang,” tuwirang naihahatid ang “gaya ng isang magnanakaw.”
