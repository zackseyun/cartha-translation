  text: הֵ֤מָּה הָיוּ֮ בְּֽ/מֹרְדֵ֫י א֥וֹר לֹֽא הִכִּ֥ירוּ דְרָכָ֑י/ו וְ/לֹ֥א יָ֝שְׁב֗וּ בִּ/נְתִיבֹתָֽי/ו׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/024/013.yaml
  text: These are among those who rebel against the light[a]; they do not recognize its ways[b], and they do not stay in its paths.
translation:
  language: tl
  text: Ang mga taong ito ay kabilang sa mga naghihimagsik laban sa liwanag[a]; hindi nila kinikilala ang mga daan nito[b], at hindi sila nananatili sa mga landas nito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Ang mga taong ito ay kabilang noon sa mga naghihimagsik laban sa liwanag.” Maaaring basahin bilang nagdaan ang pandiwang Hebreo (“kabilang noon”), ngunit sa makatang kontekstong ito ay malamang na inilalarawan nito ang isang patuloy na uri ng mga tao.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “kanyang mga daan … kanyang mga landas.” Ang mga hulapi ay pinakamalamang na tumutukoy sa “liwanag,” kaya “mga daan nito … mga landas nito” ang salin.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵמָּה
  choice: Ang mga ito
  rationale: Pinananatili ang mariing, halos panturong gamit ng hiwalay na panghalip sa Hebreo at tinutukoy ang uri ng mga taong inilalarawan.
- source_word: הָיוּ
  choice: ay kabilang
  rationale: Bagaman anyong nagdaan ang pandiwa, ang makatang konteksto ay naglalarawan ng patuloy o pangkalahatang uri ng tao; natural sa Tagalog ang pangkasalukuyang paglalarawan.
- source_word: בְּמֹרְדֵי
  choice: kabilang sa mga naghihimagsik
  rationale: Ipinahahayag ang pagsama sa isang pangkat at pinananatili ang aktibong diwa ng participle na מרד.
- source_word: אוֹר
  choice: liwanag
  rationale: Tuwirang salin na nagpapanatili sa posibleng literal at moral na mga pahiwatig nang hindi nililimitahan ang kahulugan.
- source_word: לֹא הִכִּירוּ
  choice: hindi nila kinikilala
  rationale: Ang הכיר ay maaaring mangahulugang kilalanin, malaman, o tanggapin; ang “kinikilala” ay angkop sa “mga daan” at nagpapanatili sa saklaw ng kahulugan.
- source_word: דְרָכָיו
  choice: ang mga daan nito
  rationale: Ang panlalaking isahang hulapi ay pinakamalapit na tumutukoy sa אוֹר, na panlalaking isahan sa Hebreo; ang “nito” ay umiiwas sa di-kinakailangang pagsasatao sa liwanag.
- source_word: וְלֹא יָשְׁבוּ
  choice: at hindi sila nananatili
  rationale: Sa pariralang may “mga landas,” ang ישב ay tumutukoy sa pananatili o pamamalagi, hindi sa literal na pag-upo.
- source_word: בִּנְתִיבֹתָיו
  choice: sa mga landas nito
  rationale: Pinananatili ng “mga landas” ang makatang paralelismo sa “mga daan” habang ipinakikita ang naiibang salitang Hebreo.
theological_decisions:
- issue: Tinutukoy ng mga panghalip na hulapi sa “mga daan nito” at “mga landas nito”
  choice: Tumutukoy ang mga hulapi sa “liwanag,” kaya “nito” ang ginamit.
  alternative: Maaaring basahing tumutukoy sa isang ipinahihiwatig na persona, kaya “kanyang mga daan” at “kanyang mga landas.”
  rationale: Ang pinakamalapit na gramatikal na pinatutungkulan ay אוֹר (“liwanag”), isang panlalaking isahang pangngalan sa Hebreo. Hindi ginagawang tahasang persona ang liwanag upang hindi magdagdag ng teolohikal na pagpapakahulugang wala sa teksto.
translation_notes:
  register: Makabago ngunit marangal na Filipino; malinaw sa karaniwang mambabasa. Pinanatili ang imahen ng liwanag, mga daan, at mga landas, gayundin ang bahagyang ambiguwidad ng panahunan at ng tinutukoy ng mga hulapi sa pamamagitan ng mga talababa.
