lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikita ang paliwanag o dahilan kaugnay ng naunang pahayag; likas sa Tagalog ang “Sapagkat” para sa ganitong ugnayan.
- source_word: אֹזֶן
  choice: ang tainga
  rationale: Isahan na ginagamit sa pangkalahatang diwa bilang kawikaan.
- source_word: מִלִּין
  choice: ang mga salita
  rationale: Tuwirang tumutukoy sa mga salitang binibigkas at pinananatili ang pagkakatapat sa paralelismo.
- source_word: תִּבְחָן
  choice: sinusuri
  rationale: Ipinahahayag ang mapanuring pagsubok o pagtataya, hindi lamang ang simpleng pagdinig.
- source_word: חֵךְ
  choice: ang panlasa
  rationale: Bagaman literal na maaaring tumukoy sa ngalangala, ang “panlasa” ang natural na katawagan sa sangkap ng pandamang lumalasa sa modernong Tagalog.
- source_word: יִטְעַם
  choice: lumalasa
  rationale: Pinananatili ang pandiwang larawan ng pagtikim at ang pagtutulad sa mapanuring pakikinig.
- source_word: לֶאֱכֹל
  choice: pagkain
  rationale: Ang infinitibong may ל ay ginagamit dito sa substantibong diwa, ‘yaong kinakain’ o ‘pagkain.’
