  text: For the ear tests words[a], as the palate tastes food.
translation:
  language: tl
  text: Sapagkat sinusuri ng tainga ang mga salita, kung paanong lumalasa ang ngalangala sa pagkain.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kung paanong nalalasahan ng ngalangala ang kinakain.”
