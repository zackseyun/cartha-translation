base_translation:
  language: en
  yaml_path: translation/ot/job/034/029.yaml
  text: If he gives quietness[a], who can condemn? If he hides his face[c][b], who can behold him? This is so for a nation and for a man alike.
translation:
  language: tl
  text: Kung magbigay siya ng katahimikan, sino ang makapaghahatol na siya ay may sala?[a] Kung ikubli niya ang kanyang mukha, sino ang makakakita sa kanya?[b] Gayon din sa isang bansa at sa isang tao.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sino ang makapagpapahayag na siya ay masama?” Ang pandiwang Hebreo ay may hudisyal na diwang magpahayag na ang isang tao ay masama o may sala.
    reason: lexical_alternative
  - marker: b
    text: O “sino ang makakatingin sa kanya?” Ang pandiwa ay nangangahulugang tumingin sa o makita.
    reason: lexical_alternative
  - marker: c
    text: Sa literal, “at sa isang bansa at sa isang tao nang magkasama.” Ipinahihiwatig na kapwa naaangkop ang pahayag sa isang bansa at sa isang indibidwal.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַשְׁקִיט
  choice: nagbibigay ng katahimikan
  rationale: 'Pinananatili nito ang sanhiang diwa ng Hiphil: siya ang nagpapairal ng kapanatagan o katahimikan, hindi lamang siya mismo ang tahimik.'
- source_word: יַרְשִׁיעַ
  choice: makakahatol na siya ay may sala
  rationale: Malinaw nitong ipinahahayag ang karaniwang hudisyal na diwa ng Hiphil ng רשע, ‘ipahayag na masama o may sala,’ habang pinananatiling Diyos ang tinutukoy ng hulaping panghalip.
- source_word: יַסְתֵּר פָּנִים
  choice: ikinukubli niya ang kanyang mukha
  rationale: Pinananatili ang literal at teolohikal na makabuluhang idyomang ‘ikubli ang mukha’ nang hindi nililimitahan ang kahulugan sa pagkawala lamang ng pabor.
- source_word: יְשׁוּרֶנּוּ
  choice: makakakita sa kanya
  rationale: Likas sa modernong Tagalog at tumpak sa pandiwang שור, ‘tumingin sa, makita’; ang isahang panlalaking hulapi ay tumutukoy sa Diyos.
- source_word: גּוֹי
  choice: bansa
  rationale: Tumutukoy sa isang kolektibong panlipunan o pampolitikang pangkat, hindi partikular sa mga Hentil.
- source_word: אָדָם
  choice: tao
  rationale: Sa konteksto, inihahambing ang bansa bilang kabuuan sa isang indibidwal; ang ‘isang tao’ ay natural at hindi nagpapasok ng di-kailangang kasariang espesipikasyon sa Tagalog.
- source_word: יָחַד
  choice: kapwa
  rationale: Ipinahahayag ang magkatulad na pagkakapit ng pahayag sa bansa at sa indibidwal, sa halip na ang mas spatial na ‘magkasama.’
- source_word: וְעַל גּוֹי וְעַל אָדָם יָחַד
  choice: Ito ay kapwa para sa isang bansa at sa isang tao
  rationale: Ipinakikita ang saklaw ng naunang pahayag sa kolektibo at indibidwal nang hindi labis na tinutukoy kung ang על ay ‘laban sa’ o ‘sa ibabaw ng.’
theological_decisions:
- issue: Idyoma ng pagkukubli ng mukha ng Diyos
  choice: Panatilihin ang ‘ikinukubli niya ang kanyang mukha.’
  alternative: ‘Inilalayo niya ang kanyang sarili’ o ‘inaalis niya ang kanyang pabor.’
  rationale: Ang literal na idyoma ay may mahalagang teolohikal na tensiyon at mas malawak kaysa sa pagpapakahulugang pagkawala lamang ng pabor.
- issue: Saklaw ng pangwakas na sugnay
  choice: Ipakitáng ang prinsipyo ay kapwa naaangkop sa isang bansa at sa isang indibidwal.
  alternative: Unawain ang על bilang tahasang ‘laban sa isang bansa at laban sa isang tao.’
  rationale: Maluwag ang gamit ng על, at ang pangwakas na sugnay ay likas na nagpapalawak ng saklaw nang hindi kailangang ipilit ang maparusang diwa.
- issue: Tinutukoy ng hulapi sa יְשׁוּרֶנּוּ
  choice: Ang Diyos ang hindi makikita.
  alternative: Ang ginawa o ang bunga ng pagkukubli ang hindi makikita.
  rationale: Ang isahang panlalaking hulapi at daloy ng retorikal na tanong ay pinakamalinaw na tumutukoy pabalik sa Diyos.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang ‘katahimikan’ upang mapanatili ang malawak na diwa ng שקט, at ang mas malinaw na pariralang hudisyal na ‘makakahatol na siya ay may sala’ para sa רשע. Pinanatili ang antropomorpikong ‘mukha’ at ang retorikal na ayos ng Hebreo.
