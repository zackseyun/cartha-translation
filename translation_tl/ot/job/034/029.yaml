  - severity: low
    issue: Hindi gaanong idiomatiko ang “Ito ay kapwa para sa isang bansa at sa isang tao.”
    rationale: Ang pangwakas na sugnay ay nagpapalawak ng saklaw sa bansa at indibidwal. Ang “Gayon din sa isang bansa at sa isang tao” ay mas likas habang iniiwan ang maluwag na saklaw ng על.
