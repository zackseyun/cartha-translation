base_translation:
  language: en
  yaml_path: translation/ot/job/034/014.yaml
  text: If he should set his heart on himself[a], and gather to himself his spirit and his breath,
translation:
  language: tl
  text: Kung itutuon niya ang kanyang puso sa kanyang sarili[a], at titipunin niya sa kanyang sarili ang kanyang espiritu at hininga,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Kung itutuon niya rito ang kanyang puso.” Ang Hebreong pananalitang “ituon ang puso” ay maaaring mangahulugang ituon ang pansin o layunin.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Kung
  rationale: Tuwirang nagpapakilala ng kondisyong ipinapalagay, nang walang idinadagdag na diin.
- source_word: יָשִׂים
  choice: itutuon
  rationale: Sa idyomang may לֵב, ang שׂים ay nagpapahayag ng pagtutuon ng pansin o layunin; natural sa modernong Tagalog ang “itutuon ... ang puso.”
- source_word: אֵלָיו
  choice: sa kanyang sarili
  rationale: Pinananatili ang malamang na reflexive na diwa ng pang-ukol at hulapi, habang ang alternatibong pagtukoy sa “bagay na ito” ay inilalahad sa talababa.
- source_word: לִבּוֹ
  choice: ang kanyang puso
  rationale: Pinananatili ang larawang Hebreo ng puso bilang sentro ng pansin, layunin, o kalooban, sa halip na paliitin ito sa “isip.”
- source_word: רוּחוֹ
  choice: ang kanyang espiritu
  rationale: Ang רוּחַ ay maaaring espiritu, hangin, o hininga; “espiritu” ang nagpapanatili ng pagkakaiba nito sa kasunod na נְשָׁמָה.
- source_word: וְנִשְׁמָתוֹ
  choice: at hininga
  rationale: Ang נְשָׁמָה ay tumutukoy sa hininga o hininga ng buhay; “hininga” ang malinaw at natural na katumbas habang pinananatili ang paralelismo.
- source_word: יֶאֱסֹף
  choice: titipunin niya pabalik
  rationale: Pinananatili ng “titipunin” ang konkretong larawan ng אָסַף, at nililinaw ng “pabalik” ang kontekstuwal na diwa ng pagbawi sa espiritu at hiningang nagmula sa Diyos.
theological_decisions:
- issue: Tinutukoy ng mga panghalip
  choice: Ang lahat ng panghalip na panlalaking isahan ay tumutukoy sa Diyos; ang unang אֵלָיו ay isinaling reflexive bilang “sa kanyang sarili.”
  alternative: Maaaring unawain ang unang parirala bilang “ituon niya ang kanyang puso rito,” bagaman ang Diyos pa rin ang simuno sa konteksto.
  rationale: Sa argumento ni Elihu, inilalarawan ang maaaring pagbawi ng Diyos sa espiritu at hiningang nagbibigay-buhay. Malakas ang reflexive na pagbasa, ngunit hindi ganap na inaalis ang leksikal na alternatibo kaya inilagay ito sa talababa.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang “puso,” “espiritu,” at “hininga” upang maingatan ang larawang antropolohikal at ang magkaibang terminong Hebreo. Ang kuwit sa dulo ay nagpapakitang nagpapatuloy ang kondisyong pangungusap sa Job 34:15.
