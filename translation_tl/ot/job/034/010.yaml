base_translation:
  language: en
  yaml_path: translation/ot/job/034/010.yaml
  text: 'Therefore[a], men of understanding, listen to me: far be it from God to do wickedness[b], and from the Almighty to do wrong.'
translation:
  language: tl
  text: 'Kaya nga, kayong mga lalaking may pang-unawa[a], makinig kayo sa akin: hinding-hindi gagawa ng kasamaan ang Diyos[b], ni gagawa ng kawalang-katarungan ang Makapangyarihan sa Lahat.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “mga lalaki ng puso,” isang idyoma para sa mga lalaking may pang-unawa o mahusay kumilatis.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin, “malayo sa Diyos ang kasamaan, at sa Makapangyarihan sa Lahat ang kawalang-katarungan.” Ipinahahayag ng Hebreo na hindi maiuugnay sa Diyos ang gayong kasamaan.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Kaya nga
  rationale: Nagsisilbi itong panandang naghahango ng konklusyon mula sa naunang pangangatwiran; likas sa modernong Tagalog ang “Kaya nga.”
- source_word: אַנֲשֵׁי לֵבָב
  choice: mga lalaking may pang-unawa
  rationale: Literal itong “mga lalaki ng puso,” ngunit ang “puso” sa idyomang Hebreo ay tumutukoy sa isip, pagkaunawa, at pagkilatis. Pinananatili rin ang panlalaking anyo ng pinagmulan.
- source_word: שִׁמְעוּ לִי
  choice: makinig kayo sa akin
  rationale: Ipinahihiwatig ng pautos at ng kasunod na pang-ukol ang maingat at tuwirang pakikinig sa nagsasalita.
- source_word: חָלִילָה
  choice: hinding-hindi
  rationale: Matindi itong pahayag ng pagtanggi na ang gayong bagay ay maaaring iugnay sa Diyos. Ang “hinding-hindi” ay natural at mariin sa Tagalog nang hindi pinapahina ang diwa.
- source_word: מֵרֶשַׁע
  choice: gagawa ng kasamaan
  rationale: Ang pang-ukol at pangngalan ay naghahayag ng lubos na pagkakahiwalay sa kasamaan; inilalahad sa Tagalog ang ipinahihiwatig na kilos upang maging malinaw at natural.
- source_word: שַׁדַּי
  choice: ang Makapangyarihan sa Lahat
  rationale: Isinasalin ang banal na titulo ayon sa kahulugan nito sa halip na tumbasan bilang pangalang pantangi.
- source_word: מֵעָוֶל
  choice: gagawa ng kawalang-katarungan
  rationale: Saklaw ng עָוֶל ang mali at kawalang-katarungan. Pinili ang huli upang malinaw na maipakita ang moral at makatarungang kaibhan nito sa רֶשַׁע.
theological_decisions:
- issue: Pagpapakahulugan sa matinding pagtanggi ng חָלִילָה kasama ng לָאֵל at mga pariralang may מִן
  choice: hinding-hindi gagawa ng kasamaan ang Diyos
  alternative: malayo sa Diyos ang kasamaan
  rationale: Pinananatili ng napiling salin ang mariing pagtanggi at inilalahad ang kilos na ipinahihiwatig ng Hebreo. Hindi nito nilulutas nang higit sa teksto ang pahayag bilang pilosopikong imposibilidad; mariin lamang nitong itinatanggi ang paggawa ng Diyos ng kasamaan.
- issue: Pagsasalin sa banal na titulong שַׁדַּי
  choice: ang Makapangyarihan sa Lahat
  alternative: Shaddai
  rationale: Titulo ito sa konteksto at kaya isinasalin upang maipaabot ang kahulugan sa karaniwang mambabasa.
- issue: Panlalaking anyo ng אַנֲשֵׁי לֵבָב
  choice: mga lalaking may pang-unawa
  alternative: mga taong may pang-unawa
  rationale: Tahasang panlalaking maramihan ang Hebreo, kaya pinananatili ang anyong iyon habang malinaw na isinasalin ang idyomatikong kahulugan ng “puso.”
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “hinding-hindi” bilang likas na katumbas ng mariing Hebreong pagtanggi, at pinanatili ang balanseng magkatulad na sugnay tungkol sa Diyos at sa Makapangyarihan sa Lahat.
