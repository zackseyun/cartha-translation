  text: Therefore he recognizes their deeds; he overturns them in the night[a], and they are crushed.
translation:
  language: tl
  text: Dahil dito, batid niya ang kanilang mga gawa; ibinabagsak niya sila sa gabi[a], at sila'y nadudurog.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring, “pinabubuwal niya sila sa gabi.” Walang tahasang layon ang pandiwang Hebreo na isinaling “ibinabagsak,” ngunit ipinahihiwatig ng konteksto na tumutukoy ito sa masasamang pinunong hinahatulan.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Kaya
  rationale: Likas at malinaw na naghahayag ng bunga o kongklusyon mula sa naunang pangangatwiran.
- source_word: יַכִּיר
  choice: kinikilala niya
  rationale: Pinananatili ang diwa ng pagkilala at lubos na pagkaalam sa kanilang ginagawa, hindi lamang pangkalahatang kaalaman.
- source_word: מַעְבָּדֵיהֶם
  choice: ang kanilang mga gawa
  rationale: Karaniwan, marangal, at may angkop na moral na bigat sa konteksto ng paghatol.
- source_word: וְהָפַךְ
  choice: ibinabagsak niya sila
  rationale: Ipinahahayag ang marahas na pagpapatumba o pagpapabagsak. Ang 'sila' ay ipinahiwatig ng konteksto ngunit hindi tahasang nakasaad sa Hebreo.
- source_word: לַיְלָה
  choice: sa gabi
  rationale: Natural na panandang pamanahon sa Filipino at pinananatili ang tagpong nagaganap sa gabi.
- source_word: וְיִדַּכָּאוּ
  choice: at sila'y nadudurog
  rationale: Pinananatili ang pasibong diwa at matinding larawan ng pagdurog bunga ng paghatol.
theological_decisions:
- issue: Hindi tahasang paksa at layon sa tagpo ng paghatol
  choice: Ang Diyos ang paksa ng mga pandiwa, at ang masasamang makapangyarihang tao ang ipinahiwatig na layon ng 'ibinabagsak.'
  alternative: Maaaring basahing walang tahasang layon ang 'binaligtad/pinabagsak,' o iugnay ang pandiwa sa 'gabi.'
  rationale: Sa Job 34:24–26, ang Diyos ang kumikilala at humahatol sa makapangyarihang masasama. Nililinaw ng 'sila' ang ipinahihiwatig ng konteksto habang itinatala sa talababa na walang tahasang layon sa Hebreo.
translation_notes:
  register: Makabagong Filipino na marangal at madaling maunawaan. Ginamit ang “kinikilala” upang mapanatili ang pagkilala/pagkilatis, at “nadudurog” upang maihatid ang tindi ng pasibong pandiwang Hebreo.
