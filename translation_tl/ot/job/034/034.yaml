  text: אַנְשֵׁ֣י לֵ֭בָב יֹ֣אמְרוּ לִ֑/י וְ/גֶ֥בֶר חָ֝כָ֗ם שֹׁמֵ֥עַֽ לִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/034.yaml
  text: Men of understanding will say to me[a], and a wise man who hears me,
translation:
  language: tl
  text: Sasabihin sa akin ng mga taong may pang-unawa[a], at ng isang taong marunong na nakikinig sa akin,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “mga taong may puso,” isang idyoma para sa mga taong may pang-unawa o mahusay kumilatis.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַנְשֵׁי לֵבָב
  choice: mga taong may pang-unawa
  rationale: Literal itong “mga taong may puso,” ngunit sa Hebreo ang “puso” rito ay tumutukoy sa kakayahang umunawa at kumilatis. Likas at malinaw sa modernong Tagalog ang “mga taong may pang-unawa.”
- source_word: יֹאמְרוּ לִי
  choice: Sasabihin sa akin
  rationale: Ang anyong yiqtol ay maaaring magpahayag ng inaasahang sasabihin. Pinananatili ng “Sasabihin sa akin” ang direksiyon ng pandiwa at ang diwang prospektibo sa konteksto.
- source_word: וְגֶבֶר חָכָם
  choice: at ng isang taong marunong
  rationale: Bagaman ang גֶּבֶר ay maaaring tumukoy sa lalaking nasa hustong gulang o may lakas, ang paralelismo rito ay nagpapahiwatig ng payak na “tao.” Ang “marunong” ay dignificado at natural na katumbas ng חָכָם sa kontekstong ito.
- source_word: שֹׁמֵעַ לִי
  choice: na nakikinig sa akin
  rationale: Ang participle ay naglalarawan sa taong marunong. Mas malinaw sa Tagalog ang “nakikinig” kaysa literal na “nakakarinig,” sapagkat ipinahihiwatig dito ang sadyang pakikinig kay Elihu.
