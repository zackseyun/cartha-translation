  yaml_path: translation/ot/job/034/012.yaml
  text: Indeed[a], God does not act wickedly, and the Almighty does not pervert justice.
translation:
  language: tl
  text: Tunay[a], hindi gumagawa ng kasamaan ang Diyos, at hindi binabaluktot ng Makapangyarihan sa lahat ang katarungan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Hindi humahatol nang di-makatarungan ang Diyos” o “Hindi nagdedeklara ang Diyos na may sala ang sinuman.” Maaaring magkaroon ng kahulugang panghukuman ang pandiwang Hebreo sa ilang konteksto.
    reason: alternative_reading
lexical_decisions:
- source_word: אַף אָמְנָם
  choice: Tunay
  rationale: Pinagsasama ng dalawang salitang Hebreo ang pagpapatibay at pagdidiin. Likas at marangal sa makabagong Tagalog ang “Tunay” at hindi ito labis na makaluma.
- source_word: אֵל
  choice: Diyos
  rationale: Dito, ang אֵל ay tumutukoy sa Diyos bilang banal na titulo o pangalan. Ang “Diyos” ang pinakanatural na katumbas at angkop sa kaagapay nitong titulong “Makapangyarihan sa lahat.”
- source_word: יַרְשִׁיעַ
  choice: hindi gumagawa ng kasamaan
  rationale: Maaaring mangahulugan ang Hiphil ng רשע na “maghatol na nagkasala” sa kontekstong panghukuman, ngunit sa kaagapay nitong pahayag tungkol sa hindi pagbaluktot sa katarungan, pangunahing ipinahahayag dito na ang Diyos ay hindi gumagawa ng masama. Inilalahad sa talababa ang tunay na posibilidad ng kahulugang panghukuman.
- source_word: שַׁדַּי
  choice: Makapangyarihan sa lahat
  rationale: Isinalin ang banal na titulo sa karaniwang anyong nauunawaan sa Tagalog sa halip na baybayin lamang bilang “Shaddai.”
- source_word: יְעַוֵּת
  choice: binabaluktot
  rationale: Ipinahihiwatig ng pandiwa ang pagbaluktot o pagpilipit. Ang “binabaluktot” ay malinaw at likas na katambal ng “katarungan” sa Tagalog.
- source_word: מִשְׁפָּט
  choice: katarungan
  rationale: Sa kontekstong ito, tumutukoy ang מִשְׁפָּט sa makatarungang paghatol o sa pamantayan ng pagiging matuwid. Mas malinaw at natural dito ang “katarungan” kaysa “hatol.”
theological_decisions:
- issue: Kahulugan ng יַרְשִׁיעַ kaugnay ng katangian ng Diyos
  choice: hindi gumagawa ng kasamaan ang Diyos
  alternative: hindi humahatol nang di-makatarungan ang Diyos; hindi idinedeklarang nagkasala ng Diyos
  rationale: Ipinapahayag ng talata ang moral at panghukumang integridad ng Diyos. Pinapaboran ng paralelismo ang malawak na pagtanggi na gumagawa ang Diyos ng kasamaan, ngunit hindi inaalis ang posibleng kahulugang panghukuman ng pandiwang Hebreo; kaya pinanatili iyon sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog para sa karaniwang mambabasa. Pinanatili ang mariing pagpapatibay sa simula, ang paralelismo ng dalawang sugnay, at ang ambiguwidad na moral o panghukuman ng יַרְשִׁיעַ sa pamamagitan ng talababa.
