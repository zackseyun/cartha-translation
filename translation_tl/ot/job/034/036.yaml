  yaml_path: translation/ot/job/034/036.yaml
  text: My father[a], let Job be tested to the limit[c][b], because of his answers like wicked men.
translation:
  language: tl
  text: Ama ko[a], nawa'y subukin si Job hanggang sa sukdulan[b], dahil sa mga sagot niyang gaya ng mga sagot ng masasamang tao.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “O Ama ko.” Literal sa Hebreo ang “ama ko,” malamang bilang tuwirang tawag, bagaman may iba pang pagkaunawa sa parirala.
    reason: lexical_alternative
  - marker: b
    text: Literal na “hanggang magpakailanman” o “hanggang sa walang hanggan”; dito ay malamang na nangangahulugang lubusan o hanggang sa pinakamatinding antas ang pagsubok.
    reason: lexical_alternative
  - marker: c
    text: O “kasama ng masasamang tao” o “sa gitna ng masasamang tao.” Maaaring magpahiwatig ng paghahambing o pakikisama ang pang-ukol sa Hebreo.
    reason: alternative_reading
lexical_decisions:
- source_word: אָבִי
  choice: Ama ko
  rationale: Pinananatili ang literal na anyong “ama ko” at ang malamang na gamit nito bilang tuwirang tawag, kahit hindi tiyak kung sino ang tinutukoy.
- source_word: יִבָּחֵן
  choice: nawa'y subukin
  rationale: Ang Niphal imperfect ng בחן ay nangangahulugang “subukin/suriin.” Ipinahahayag ng “nawa’y” ang hangarin o pakiusap na ipinahihiwatig ng sugnay.
- source_word: עַד נֶצַח
  choice: hanggang sa sukdulan
  rationale: Bagaman literal na tumutukoy sa pagpapatuloy o kawalang-hanggan, sa konteksto ng pagsubok ay malamang na idyomang nagsasaad ng lubusan o matinding pagsubok.
- source_word: עַל
  choice: dahil sa
  rationale: Ipinakikilala rito ng עַל ang dahilan ng hangarin tungkol sa pagsubok kay Job.
- source_word: תְּשֻׁבוֹת
  choice: mga sagot
  rationale: Natural at tuwirang katumbas ito sa konteksto ng pagtatalo at mga tugon ni Job.
- source_word: בְּאַנְשֵׁי אָוֶן
  choice: gaya ng sa masasamang tao
  rationale: Ipinakikita ng pangunahing salin ang malamang na paghahambing, habang inilalahad sa talababa ang maaari ring pakahulugang pakikisama o pag-uugnay sa masasamang tao.
theological_decisions:
- issue: Ang hangarin ni Elihu na subukin si Job
  choice: Isang hangaring lubusang subukin si Job dahil ang kanyang mga sagot ay gaya ng sa masasamang tao.
  alternative: Maaaring mangahulugan na subukin si Job magpakailanman, o subukin siyang kasama ng masasamang tao.
  rationale: Pinananatili ang maparatang na lakas ng pananalita ni Elihu nang hindi ginagawang tiyak ang isang teolohikal na pahayag na hindi tiyak sa Hebreo. Ang mga leksikal at sintaktikong alternatibo ay inilalagay sa mga talababa.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “nawa’y” upang natural na ipahayag ang hangarin, “hanggang sa sukdulan” para sa matinding/lubusang diwa, at “masasamang tao” bilang malinaw na salin ng אַנְשֵׁי אָוֶן. Pinanatili sa talababa ang tunay na kalabuan ng pambungad at ng pang-ukol בְּ.
