  text: For he adds rebellion to his sin[a]; among us he claps his hands[b], and he multiplies his words against God.
translation:
  language: tl
  text: Sapagkat dinaragdagan niya ng paghihimagsik ang kanyang kasalanan; sa gitna natin ay ipinapalakpak niya ang kanyang mga kamay[a], at pinararami niya ang kanyang mga salita laban sa Diyos.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “pinagtatama niya ang kanyang mga palad.” Malamang na ang kilos ay nagpapahayag ng panunuya, pagsalungat, o paghamak.
    reason: lexical_alternative
  - marker: b
    text: O, “sa Diyos.” Maaaring unawain ang pang-ukol sa Hebreo bilang neutral na direksiyon, ngunit pinapaboran ng konteksto ang diwang “laban sa Diyos.”
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikilala nito ang paliwanag ni Elihu sa naunang hatol; likas sa Tagalog ang “sapagkat” para sa ganitong ugnayang nagpapaliwanag.
- source_word: יֹסִיף עַל חַטָּאתוֹ
  choice: dinaragdagan niya ... ang kanyang kasalanan
  rationale: Pinananatili ang larawan ng pagdaragdag ng isang pagkakasala sa nauna nang kasalanan.
- source_word: פֶשַׁע
  choice: paghihimagsik
  rationale: Higit ito sa pangkalahatang pagkakamali; ipinahihiwatig ng salita ang mapanghimagsik at mapanghamong pagsuway.
- source_word: בֵּינֵינוּ
  choice: sa gitna natin
  rationale: Likas na katumbas sa Tagalog ng literal na “sa pagitan natin,” at angkop sa pangkat na nakikinig kay Elihu.
- source_word: יִסְפּוֹק
  choice: ipinapalakpak niya ang kanyang mga kamay
  rationale: Pinananatili ang kongkretong kilos na malamang ay nagpapahayag ng panunuya, paghamak, o pagsalungat, sa halip na ilagay agad ang interpretasyon sa pangunahing teksto.
- source_word: וְיֶרֶב אֲמָרָיו
  choice: at pinararami niya ang kanyang mga salita
  rationale: Tuwirang inilalarawan ang patuloy na pagpaparami o pagtatambak ng kanyang sinasabi.
- source_word: לָאֵל
  choice: laban sa Diyos
  rationale: Bagaman maaari itong tumukoy lamang sa direksiyon na “sa Diyos,” pinapaboran ng mapanumbat na konteksto ang adversatibong diwang “laban sa Diyos.”
theological_decisions:
- issue: Kung ang mga salita ni Job ay inilalarawang sinabi lamang “sa Diyos” o sinabi “laban sa Diyos.”
  choice: laban sa Diyos
  alternative: sa Diyos
  rationale: Ang “laban sa Diyos” ay umaayon sa pag-igting ng paratang ni Elihu—mula sa kasalanan tungo sa paghihimagsik at mapanghamong pananalita—nang hindi nagdaragdag ng doktrinang wala sa teksto. Nananatili sa talababa ang mas neutral na posibilidad.
translation_notes:
  register: Makabago ngunit marangal na Filipino; tuwiran at madaling maunawaan. Pinanatili ang kongkretong kilos ng mga kamay at ang posibleng kahulugan ng pang-ukol sa mga talababa upang hindi itago ang tunay na kalabuan ng Hebreo.
