  text: Should I lie concerning my right? My wound is incurable[b][a], though there is no transgression.
translation:
  language: tl
  text: Magsisinungaling ba ako tungkol sa aking karapatan? Walang lunas ang aking sugat[b], kahit wala akong ginawang paglabag.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin ang unang pangungusap: “Laban sa aking karapatan, itinuring akong sinungaling.”'
    reason: alternative_reading
  - marker: b
    text: 'Literal: “Ang aking palaso ay walang lunas.” Ang “palaso” ay malamang na larawan ng sugat o paghihirap na idinulot sa kanya.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל מִשְׁפָּטִי
  choice: tungkol sa aking karapatan
  rationale: Pinananatili nito ang legal na diwa ng מִשְׁפָּטִי bilang karapatan o makatarungang usapin, habang likas sa modernong Tagalog ang gamit ng “tungkol sa.”
- source_word: אֲכַזֵּב
  choice: Magsisinungaling ba ako
  rationale: Ang anyong pandiwa ay maaaring tumukoy sa pagsisinungaling; binasa rito bilang retorikal na tanong ayon sa daloy ng pahayag, ngunit itinatala sa talababa ang posibleng pasibong kahulugan.
- source_word: אָנ֖וּשׁ
  choice: walang lunas
  rationale: Ipinahahayag ng salita ang kalagayang malubha at hindi mapagaling; ang “walang lunas” ay malinaw at natural sa Tagalog.
- source_word: חִצִּי
  choice: aking sugat
  rationale: Literal itong “aking palaso,” ngunit malamang na metapora para sa sugat o paghihirap na idinulot sa nagsasalita. Pinananatili sa talababa ang literal na larawan.
- source_word: בְלִי פָשַׁע
  choice: kahit wala akong pagsuway
  rationale: Ang בְלִי ay nagsasaad ng kawalan, at ipinahihiwatig ng konteksto ang pagsalungat sa matinding paghihirap. Ang פָשַׁע ay may moral at panrelihiyong bigat na angkop sa “pagsuway.”
theological_decisions:
- issue: Pag-unawa sa unang sugnay bilang siniping pahayag ni Job
  choice: 'Retorikal na tanong: “Magsisinungaling ba ako tungkol sa aking karapatan?”'
  alternative: 'Pasalaysay: “Laban sa aking karapatan, itinuring akong sinungaling.”'
  rationale: Siksik at maaaring unawain sa higit sa isang paraan ang Hebreo. Ang retorikal na tanong ay umaangkop sa pagtanggi ni Job na talikuran ang kanyang pag-aangkin sa pagiging matuwid, samantalang pinananatili sa talababa ang lehitimong alternatibong pagbasa.
- issue: Larawan ng חִצִּי
  choice: Isinalin sa diwang “aking sugat”
  alternative: Literal na “aking palaso”
  rationale: Sa konteksto, ang palaso ay malamang na kumakatawan sa sugat o kapahamakang tumama kay Job. Ang malinaw na diwa ay nasa teksto at ang konkretong imahen ay nasa talababa upang hindi mawala ang ambiguwidad.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “karapatan” upang mapanatili ang legal na himig, “walang lunas” para sa matinding kalagayan, at “pagsuway” upang maipahayag ang moral na bigat ng פָשַׁע nang hindi nagdaragdag ng denominasyonal na paliwanag.
