  yaml_path: translation/ot/job/034/033.yaml
  text: Should he repay according to your judgment because you have rejected it? For you must choose[a], and not I[b]; so declare what you know.
translation:
  language: tl
  text: Dapat ba siyang magbigay ng kabayaran ayon sa pasiya mo[a] dahil tinanggihan mo iyon[b]? Ikaw ang dapat pumili, hindi ako; kaya sabihin mo kung ano ang nalalaman mo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Dapat ba siyang magbigay ng kabayaran ayon sa iyo?” Idyomatiko at mahirap ang pambungad sa Hebreo; ipinahihiwatig na hindi ang kagustuhan ni Job ang nagtatakda ng paggawad ng Diyos ng nararapat.
    reason: lexical_alternative
  - marker: b
    text: Maaaring tumukoy ang “iyon” sa pasiya ng Diyos, sa paraan ng kanyang pamamahala, o sa kabayarang pinag-uusapan.
    reason: alternative_reading
lexical_decisions:
- source_word: הֲמֵעִמְּךָ
  choice: ayon sa pasiya mo
  rationale: Mahirap at idyomatiko ang literal na ‘mula sa piling mo.’ Sa konteksto, itinatanong kung ang paggagawad ng Diyos ng nararapat ay dapat bang ibatay sa pasiya o kagustuhan ni Job.
- source_word: יְשַׁלְּמֶנָּה
  choice: magbigay ng kabayaran
  rationale: Ang Piel ng שלם ay tumutukoy sa pagbabayad o paggawad ng nararapat. Likas sa modernong Tagalog ang pariralang ito at hindi nito nililimitahan ang diwa sa pagbabayad lamang ng salapi.
- source_word: כִּי מָאַסְתָּ
  choice: dahil tinanggihan mo iyon
  rationale: Karaniwang nangangahulugan ang מאס ng ‘tanggihan,’ ‘ayawan,’ o ‘hamakin.’ Pinananatili ng ‘iyon’ ang di-tiyak na tinutukoy ng Hebreo, na ipinaliliwanag sa talababa.
- source_word: כִּי אַתָּה תִבְחַר וְלֹא אָנִי
  choice: Ikaw ang dapat pumili, hindi ako
  rationale: Pinananatili nito ang tuwirang paghahambing kay Job at kay Elihu at ang mapanghamong puwersa ng pandiwang בחר.
- source_word: וּמַה יָדַעְתָּ דַבֵּר
  choice: kaya sabihin mo kung ano ang nalalaman mo
  rationale: Natural nitong inilalahad sa Tagalog ang pautos na hamon na ipahayag ni Job ang kanyang nalalaman.
theological_decisions:
- issue: Kung kaninong pasiya nakabatay ang paggawad ng kabayaran
  choice: Inilalarawan ang tanong bilang hamon kung dapat bang ibatay sa pasiya ni Job ang kabayaran.
  alternative: Literal na ‘mula sa iyo’ o ‘ayon sa iyo.’
  rationale: Ipinahihiwatig ito ng mahirap na idyomang Hebreo at ng konteksto, ngunit pinananatili sa talababa ang mas literal na posibilidad.
- issue: Tinutukoy ng ‘tinanggihan mo’
  choice: Iniwan itong di-tiyak sa pangunahing teksto sa pamamagitan ng ‘iyon.’
  alternative: Tahasang tukuyin bilang pasiya ng Diyos, pamamahala ng Diyos, o iminungkahing kabayaran.
  rationale: Walang tahasang layon ang pandiwa sa Hebreo, kaya hindi dapat ipasya sa salin ang isang teolohikal na interpretasyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang ‘magbigay ng kabayaran’ upang maipahayag ang paggawad ng nararapat nang hindi ito magtunog na pananalaping transaksiyon lamang. Pinanatili ang retorikal na tanong at ang hindi tiyak na tinutukoy ng ‘tinanggihan.’
