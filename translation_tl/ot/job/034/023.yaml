  yaml_path: translation/ot/job/034/023.yaml
  text: For he does not set a time for a man to go before God in judgment[a].
translation:
  language: tl
  text: Sapagkat hindi siya nagtatakda ng panahon para sa isang tao upang humarap sa Diyos sa paghatol.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “Sapagkat hindi siya nagtatakda ng karagdagang panahon para sa isang tao upang humarap sa Diyos sa paghatol.” Mahirap at siksik ang Hebreo; ang diwa ay hindi kailangan ng Diyos ng isa pang pagdinig o pagkaantala bago humatol.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikita nitong ang talata ay nagbibigay ng saligan o paliwanag sa naunang pahayag sa pangangatwiran ni Elihu.
- source_word: עַל אִישׁ
  choice: para sa isang tao
  rationale: Sa konstruksiyong kasama ng שׂים, ipinahihiwatig nito ang isang bagay na itinatalaga para sa isang tao. Ang “tao” ay likas na Filipino at naipapahayag ang pangkalahatang gamit ng panlalaking isahan dito.
- source_word: יָשִׂים
  choice: nagtatakda
  rationale: Ang pandiwa ay nangangahulugang maglagay o magtakda; sa kontekstong hudisyal, ang “nagtatakda” ay angkop sa ipinahiwatig na panahon ng pagharap.
- source_word: עוֹד
  choice: panahon
  rationale: Literal itong “muli,” “higit pa,” o “karagdagan.” Dahil siksik at eliptikal ang Hebreo, isinusuplay ang “panahon” bilang ipinahiwatig na layon ng “nagtatakda”; ang diwang “karagdagan” ay inilalahad sa talababa bilang alternatibong mas tahasang pagbasa.
- source_word: לַהֲלֹךְ אֶל אֵל
  choice: upang humarap sa Diyos
  rationale: Literal na “upang pumunta sa Diyos.” Sa hudisyal na konteksto, likas na ipinahahayag ng “humarap sa Diyos” ang pagharap sa hukuman nang hindi ginagawang labis na tiyak ang eliptikal na parirala.
- source_word: בַּמִּשְׁפָּט
  choice: sa paghatol
  rationale: Pinananatili nito ang saklaw na hudisyal ng מִשְׁפָּט—paghatol o paglilitis—nang hindi nililimitahan ang kahulugan sa isang partikular na teknikal na hakbang ng paglilitis.
theological_decisions:
- issue: Ang pakahulugan sa siksik na pariralang may עוֹד at walang tahasang layon pagkatapos ng יָשִׂים
  choice: Hindi nagtatakda ang Diyos ng panahon para humarap ang tao sa kanya sa paghatol.
  alternative: Hindi nagtatakda ang Diyos ng karagdagang panahon para humarap ang tao sa kanya sa paghatol.
  rationale: Mahirap at eliptikal ang Hebreo. Sinusuportahan ng konteksto ang diwang hindi kailangan ng Diyos ng panibagong pagdinig o pagkaantala bago humatol, ngunit hindi ito ginawang labis na tahasan sa pangunahing teksto. Pinananatili sa talababa ang puwersa ng עוֹד bilang “karagdagan.”
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “tao” sa pangkalahatang diwa ng אִישׁ at hindi ang mas makitid na “lalaki.” Hindi ginamit ang reverential capitalization. Pinanatili ang hudisyal na larawan at ang tunay na kalabuan ng Hebreo sa pamamagitan ng maikling pangunahing teksto at paliwanag sa talababa.
