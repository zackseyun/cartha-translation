  text: sapagkat tumalikod sila sa pagsunod sa kanya[a], at hindi nila binigyang-pansin ang alinman sa kanyang mga daan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “mula sa likuran niya,” isang idyomang Hebreo na nangangahulugang tumigil sa pagsunod sa kanya.
