lexical_decisions:
- source_word: אֲשֶׁר עַל כֵּן
  choice: sapagkat
  rationale: Likas na ipinahahayag nito sa Filipino ang sanhi o dahilan na inihaharap ng parirala sa konteksto.
- source_word: סָרוּ
  choice: tumalikod sila
  rationale: Ipinahahayag ng pandiwang סור ang paglihis o pagtalikod; ang “tumalikod” ay natural at pinananatili ang moral at relasyonal na diwa.
- source_word: מֵאַחֲרָיו
  choice: sa pagsunod sa kanya
  rationale: Ang literal na “mula sa likuran niya” ay idyomang Hebreo para sa pagtigil sa pagsunod; malinaw itong naihahatid ng “tumalikod ... sa pagsunod sa kanya.”
- source_word: וְכָל דְּרָכָיו
  choice: ang alinman sa kanyang mga daan
  rationale: Bagaman literal na “lahat ng kanyang mga daan,” dahil sa kasunod na pagtanggi, natural sa Filipino ang “hindi ... ang alinman,” habang nananatili ang ganap na saklaw.
- source_word: לֹא הִשְׂכִּילוּ
  choice: hindi nila binigyang-pansin
  rationale: Ang Hiphil ng שׂכל ay maaaring mangahulugang umunawa, magbigay-isip, o isaalang-alang. Sa konteksto, ang “binigyang-pansin” ay nagpapakita ng sadyang hindi pagsasaalang-alang nang hindi isinasara ang saklaw ng salita.
theological_decisions:
- issue: Tinutukoy ng mga hulaping panghalip na panlalaking isahan sa “pagsunod sa kanya” at “kanyang mga daan”
  choice: Pinanatiling panghalip na “kanya/kanyang,” na sa konteksto ay tumutukoy sa Diyos
  alternative: Tahasan itong isalin bilang “Diyos” o iugnay sa isang makalupang pinuno o hukom
  rationale: Ang mas malawak na talumpati ni Elihu ay tumutukoy sa pagkakita at paghatol ng Diyos, ngunit panghalip lamang ang nasa Hebreo. Ang hindi pagbanggit nang tahasan sa “Diyos” ay nagpapanatili sa anyo at posibleng tensiyon ng pinagmulan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mga daan” bilang karaniwang biblikal ngunit nauunawaang paglalarawan sa kilos, pamantayan, o kalooban ng Diyos; hindi ginawang malaking titik ang mga panghalip upang hindi magdagdag ng interpretasyong wala sa Hebreo.
