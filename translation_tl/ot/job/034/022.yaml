source:
  edition: WLC
  text: אֵֽין חֹ֭שֶׁךְ וְ/אֵ֣ין צַלְמָ֑וֶת לְ/הִסָּ֥תֶר שָׁ֝֗ם פֹּ֣עֲלֵי אָֽוֶן־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/022.yaml
  text: There is no darkness[a], and no deep shadow, where workers of wickedness may hide themselves.
translation:
  language: tl
  text: Walang dilim o pusikit na anino[a] na mapagtataguan ng mga gumagawa ng kasamaan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “anino ng kamatayan” o “matinding dilim.” Sa tulang Hebreo, ang salitang ito ay maaaring tumukoy sa napakalalim na dilim o pangungulimlim.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵין
  choice: Walang
  rationale: 'Likas at tuwirang pagpapahayag sa Tagalog ng eksistensiyal na pagkakaila: walang umiiral na dilim o aninong makapagtatago sa kanila.'
- source_word: חֹשֶׁךְ
  choice: dilim
  rationale: Karaniwang kahulugan ng salita at angkop sa larawang tumutukoy sa pagtatago.
- source_word: צַלְמָוֶת
  choice: pusikit na anino
  rationale: Ipinahihiwatig nito ang napakalalim na dilim sa matulaing konteksto. Pinananatili ng “anino” ang larawan ng Hebreo, habang ipinahahayag ng “pusikit” ang tindi nito nang hindi ipinapasok sa pangunahing teksto ang kamatayan.
- source_word: לְהִסָּתֶר
  choice: na mapagtataguan
  rationale: Ipinahahayag ng anyong ito ang layunin o posibilidad ng pagtatago. Natural sa Tagalog ang relasyong “na mapagtataguan” kasunod ng mga lugar o kalagayang itinanggi.
- source_word: שָׁם
  choice: na mapagtataguan
  rationale: Ang literal na “doon” ay likas na naisasama sa Tagalog sa hulaping lokatibong “-an” ng “mapagtataguan,” kaya napapanatili ang diwa nang hindi nagiging alanganin ang pangungusap.
- source_word: פֹּעֲלֵי אָוֶן
  choice: mga gumagawa ng kasamaan
  rationale: Pinananatili nito ang aktibong larawang “mga gumagawa” at malinaw na ipinahahayag ang moral na kahulugan ng אָוֶן sa konteksto.
- source_word: אָוֶן
  choice: kasamaan
  rationale: Sa kontekstong ito, moral na kasamaan ang tinutukoy, hindi lamang paghihirap o kaguluhan.
theological_decisions:
- issue: Kahulugan ng צַלְמָוֶת sa matulaing konteksto
  choice: pusikit na anino
  alternative: anino ng kamatayan; matinding dilim
  rationale: Ang paksa ng talata ay ang imposibilidad ng pagtatago mula sa Diyos, hindi ang kamatayan mismo. Pinananatili ng pangunahing salin ang matulaing larawan at ang diin sa matinding dilim; inilalagay sa talababa ang tradisyonal at iba pang posibleng kahulugan upang hindi ikubli ang leksikal na saklaw.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ang “pusikit” ay isang kilalang salitang pampanitikan ngunit malinaw sa tambalang “pusikit na anino”; pinananatili nito ang tula at tindi ng orihinal. Ang ayos ng pangungusap ay natural sa Tagalog at hindi tahasang nilulutas ang saklaw ng צַלְמָוֶת.
