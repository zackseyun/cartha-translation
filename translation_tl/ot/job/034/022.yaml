  source_fidelity: 'Tapat ang salin sa Hebreo: ang dobleng אֵין ay naipahayag ng “Walang,” ang חֹשֶׁךְ at צַלְמָוֶת ay napanatiling magkapares na larawang tumutukoy sa dilim, at ang layuning pagpapahayag ng לְהִסָּתֶר ... פֹּעֲלֵי אָוֶן ay malinaw na naihatid bilang lugar na hindi mapagtataguan ng mga gumagawa ng kasamaan. Hindi ipinapasok ng pangunahing teksto ang kahulugang “kamatayan,” na isang leksikal na posibilidad ngunit hindi kailangan ng konteksto.'
