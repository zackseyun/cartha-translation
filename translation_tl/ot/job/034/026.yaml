  yaml_path: translation/ot/job/034/026.yaml
  text: He strikes them as wicked people in full view[a].
translation:
  language: tl
  text: Hinahampas niya sila bilang masasamang tao, nang hayagan[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Hinahampas niya sila dahil sila ay masasama, nang hayagan.” Maaaring tumukoy ang mahirap na pambungad na parirala sa dahilan ng pagpaparusa sa halip na sa katayuan nila nang sila ay hampasin.
    reason: alternative_reading
lexical_decisions:
- source_word: תַּחַת
  choice: bilang
  rationale: Sa mahirap na pariralang תַּחַת רְשָׁעִים, ipinahahayag ng “bilang” ang katayuang kinikilalang taglay nila kapag pinarurusahan. Pinananatili sa talababa ang posibleng pagbasa na nagsasaad ng dahilan.
- source_word: רְשָׁעִים
  choice: masasamang tao
  rationale: Ang pangmaramihang pang-uri ay ginagamit bilang pangngalan at tumutukoy sa mga taong masama, nang walang kinakailangang pagtukoy sa kasarian.
- source_word: סְפָקָם
  choice: Hinahampas niya sila
  rationale: Ang pandiwa ay nangangahulugang humampas o manakit. Hindi idinagdag ang di-tiyak na resultang gaya ng “ibinabagsak” o “pinapatay.”
- source_word: בִּמְקוֹם רֹאִים
  choice: sa harap ng lahat
  rationale: Literal na tumutukoy ang parirala sa isang lugar na may mga nakakakita. Ang likas na idyomang Filipino ay malinaw na naghahatid ng diwang hayagan at nakikita ng mga tao.
theological_decisions:
- issue: Kung ang תַּחַת רְשָׁעִים ay nagsasaad ng katayuan o dahilan ng parusa
  choice: 'Katayuan: “bilang masasamang tao”'
  alternative: 'Dahilan: “dahil sa kanilang kasamaan”'
  rationale: Kapuwa posible ang dalawang ugnayan sa mahirap na parirala. Ginamit sa pangunahing teksto ang pagbasa bilang katayuan, ngunit hindi inalis ang posibleng pagbasa bilang dahilan at inilagay ito sa talababa.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ang “sa harap ng lahat” ay likas na pagpapahayag ng hayagang kaparusahan; hindi nito inuulit ang ideya ng pisikal na lugar.
