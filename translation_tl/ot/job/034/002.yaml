  yaml_path: translation/ot/job/034/002.yaml
  text: Hear my words[a], you wise men, and give ear to me, you who know.
translation:
  language: tl
  text: 'Makinig kayo sa aking mga salita, kayong marurunong;

    pakinggan ninyo ako, kayong may kaalaman.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שִׁמְעוּ
  choice: Makinig kayo
  rationale: Ang Qal imperative plural ng שׁמע ay tuwirang panawagang makinig; natural ito sa makabagong Filipino at malinaw na naiiba sa ikalawang pandiwa.
- source_word: חֲכָמִים
  choice: kayong marurunong
  rationale: Ang pang-uring panlalaking maramihan ay ginagamit bilang pantawag. Sa Filipino, ang inklusibong anyong “kayong marurunong” ay natural at hindi kailangang tahasang markahan ang kasarian na nakasaad lamang sa gramatikang Hebreo.
- source_word: מִלָּי
  choice: sa aking mga salita
  rationale: Pinananatili ang kongkretong maramihang diwa ng “mga salita” at ang panlaping unang panauhan.
- source_word: וְיֹדְעִים
  choice: kayong may kaalaman
  rationale: Isinasalin ang substantibong participle bilang paglalarawan sa mga kinakausap, nang hindi dinaragdagan ang diwa tungo sa “nakauunawa.”
- source_word: הַאֲזִינוּ
  choice: pakinggan ninyo ako
  rationale: Ang Hiphil imperative ng אזן ay literal na may kaugnayan sa pagbibigay ng tainga, ngunit “pakinggan ninyo ako” ang natural at marangal na katumbas sa Filipino.
- source_word: לִי
  choice: ako
  rationale: Ang pang-ukol na may hulaping unang panauhan ay likas na naipapahayag bilang tuwirang layon ng “pakinggan” sa Filipino.
