  source_fidelity: 'Tapat ang salin sa Hebreo: napapanatili ang dalawang magkatulad na pautos, ang “aking mga salita,” at ang dalawang pantawag sa maramihang kausap. Ang “pakinggan ninyo ako” ay natural na katumbas ng הַאֲזִינוּ לִי, kahit hindi nito tahasang inuulit ang idyomang “ibigay ang tainga.”'
