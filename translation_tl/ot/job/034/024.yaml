  text: He shatters the mighty without investigation[a], and sets others in their place.
translation:
  language: tl
  text: Dinudurog niya ang mga makapangyarihan nang walang pagsisiyasat[a], at naglalagay siya ng iba sa kanilang lugar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “nang walang pagsusuri” o “nang walang paghahanap.” Literal sa Hebreo: “hindi pagsisiyasat/paghahanap.” Maaaring ipahiwatig nito na hindi niya kailangan ng mahabang pagsusuri bago niya pabagsakin ang mga makapangyarihan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָרֹעַ
  choice: dinidurog
  rationale: Ang pandiwang Hiphil mula sa רעע ay nagpapahayag ng marahas at ganap na pagwasak o pagpapabagsak. Ang “dinidurog” ay mas matindi kaysa “sinasaktan” at angkop sa makatang paglalarawan ng paghatol.
- source_word: כַּבִּירִים
  choice: ang mga makapangyarihan
  rationale: Tumutukoy ito sa mga taong may malaking kapangyarihan, malamang na mga pinuno o kabilang sa mataas na uri. Hindi nito labis na tinutukoy ang kanilang partikular na katungkulan.
- source_word: לֹא חֵקֶר
  choice: nang hindi na kailangang magsiyasat
  rationale: Literal itong “walang pagsisiyasat/paghahanap.” Sa konteksto, hindi kailangan ng Diyos ang mahabang pagsisiyasat bago kumilos laban sa makapangyarihan. Pinananatili ng talababa ang posibleng mas literal o alternatibong pagbasa.
- source_word: וַיַּעֲמֵד
  choice: inilalagay niya
  rationale: Ang Hiphil ng עמד ay “pinatatayo,” “itinatatag,” o “inilalagay.” Ang “inilalagay” ay likas kasama ng pariralang “bilang kapalit nila.”
- source_word: אֲחֵרִים
  choice: ang iba
  rationale: Isa itong di-tiyak na maramihan para sa mga taong pumapalit; sapat at likas sa Tagalog ang “ang iba.”
- source_word: תַּחְתָּם
  choice: bilang kapalit nila
  rationale: Bagaman literal na “sa ilalim nila,” idiomatiko itong nangangahulugang paghalili o pagkuha sa kanilang lugar sa kontekstong ito.
theological_decisions:
- issue: Ipinahihiwatig na simuno ng mga pandiwa
  choice: Ang Diyos ang tinutukoy ng “niya.”
  alternative: Maaaring iwang hindi tiyak ang simuno kung ihihiwalay ang talata sa konteksto.
  rationale: Sa nakapaligid na pahayag ni Elihu, ang Diyos ang gumagawa ng walang-kinikilingang paghatol sa mga pinuno. Likas at hinihingi ng Tagalog na ipahayag ito sa pamamagitan ng panghalip.
- issue: Kahulugan ng לֹא חֵקֶר
  choice: Hindi na kailangan ang pagsisiyasat bago hatulan ang makapangyarihan.
  alternative: “Nang hindi masiyasat” o “di-malirip,” na maaaring tumukoy sa di-masiyasat na paraan o lawak ng kanyang pagkilos.
  rationale: Sinusuportahan ng kasunod na talata, na nagsasabing alam niya ang kanilang mga gawa, ang pagbasa na hindi niya kailangan ang mahabang pagsisiyasat. Gayunman, inilalahad sa talababa ang leksikal na kalabuan sa halip na lubusang alisin ito.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang pangkasalukuyang anyo upang ilarawan ang pangkalahatang pagkilos ng Diyos sa makatang pahayag. Ang “dinidurog” ay nagpapanatili sa lakas ng Hebreong pandiwa, samantalang ang “bilang kapalit nila” ay likas na nagpapahayag ng idyomatikong תַּחְתָּם.
