translation:
  language: tl
  text: 'Sabay-sabay na mamamatay ang lahat ng nilalang,

    at ang sangkatauhan[a] ay babalik sa alikabok.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang tao.” Isahan ang Hebreong אָדָם ngunit maaari itong kumatawan sa buong sangkatauhan.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִגְוַע
  choice: mamamatay
  rationale: Ang גוע ay tumutukoy sa pagpanaw o pagkamatay. Natural at tuwiran sa modernong Tagalog ang “mamamatay,” at ang kondisyunal na diwa ay ipinagpapatuloy mula sa naunang talata.
- source_word: כָּל בָּשָׂר
  choice: lahat ng may laman
  rationale: Pinananatili nito ang konkretong idyomang Hebreo na “lahat ng laman” ngunit ginagamit ang mas malinaw na anyong Tagalog na tumutukoy sa lahat ng mortal na nilalang.
- source_word: יָחַד
  choice: sabay-sabay
  rationale: Ipinahahayag nito ang sabayang pagkamatay at ang kolektibong saklaw na binibigyang-diin ng pang-abay.
- source_word: אָדָם
  choice: sangkatauhan
  rationale: Dito ang pangngalang isahan ay kolektibong tumutukoy sa buong sangkatauhan, kapantay ng “lahat ng may laman.” Mas malinaw ito sa modernong Tagalog kaysa sa “tao,” na maaaring ipakahulugang isang indibidwal.
- source_word: עַל עָפָר
  choice: sa alabok
  rationale: Bagaman literal na “sa ibabaw ng alabok,” ang pariralang kasama ng שוב ay likas na isinasalin bilang “babalik sa alabok,” na nagpapanatili sa larawang biblikal ng pinagmulan at kamatayan ng tao.
- source_word: יָשׁוּב
  choice: babalik
  rationale: Karaniwang kahulugan ng שוב ang “bumalik.” Ang hinaharap na anyo sa Tagalog ay natural na nagdadala ng resultang kondisyunal mula sa talata 14.
theological_decisions:
- issue: Kolektibong kahulugan ng אָדָם
  choice: sangkatauhan
  alternative: ang tao
  rationale: Ang אָדָם ay anyong isahan ngunit dito ay pangkalahatan at kolektibo ang tinutukoy. Nililinaw ng “sangkatauhan” ang saklaw nang hindi nililimitahan ito sa kalalakihan o sa iisang tao; inilalagay sa talababa ang mas pormal na alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang paralelismo at bigat ng pangungusap, habang ang “sabay-sabay” ay inilagay sa unahan upang maging natural ang daloy. Ang linyang ito ay kondisyunal na bunga ng talata 14.
