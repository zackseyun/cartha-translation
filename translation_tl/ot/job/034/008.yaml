  text: וְ/אָרַ֣ח לְ֭/חֶבְרָה עִם פֹּ֣עֲלֵי אָ֑וֶן וְ֝/לָ/לֶ֗כֶת עִם אַנְשֵׁי רֶֽשַׁע־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/008.yaml
  text: and keeps company with workers of wickedness[b][a], and walks with men of evil.
translation:
  language: tl
  text: 'at nakikisama[a] sa mga gumagawa ng kasamaan[b],

    at lumalakad kasama ng masasamang tao.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sumasama sa paglalakbay.” Maaari ring tumukoy ang Hebreo sa paglalakbay na kasama ng iba o sa pakikisama sa kanila.
    reason: lexical_alternative
  - marker: b
    text: O “mga taong gumagawa ng masama.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָרַח לְחֶבְרָה
  choice: at nakikisama
  rationale: Magkasamang ipinahihiwatig ng pandiwa at ng pariralang לְחֶבְרָה ang pagsama o pakikipag-ugnayan sa isang pangkat, hindi lamang ang literal na paglalakbay. Likas sa modernong Tagalog ang “nakikisama” at pinananatili nito ang diwang panlipunan at moral.
- source_word: עִם
  choice: sa / kasama ng
  rationale: Ang pang-ukol ay nagpapahayag ng pagsama. Ginamit ang “sa” kasunod ng “nakikisama” at ang “kasama ng” sa ikalawang sugnay ayon sa likas na gamit sa Tagalog.
- source_word: פֹּעֲלֵי אָוֶן
  choice: mga gumagawa ng kasamaan
  rationale: Pinananatili ng “mga gumagawa ng” ang aktibong diwa ng participle פֹּעֲלֵי, samantalang ang “kasamaan” ay malinaw na naghahatid ng moral na diwa ng אָוֶן sa kontekstong ito.
- source_word: וְלָלֶכֶת
  choice: at lumalakad
  rationale: Pinananatili ng “lumalakad” ang larawang Hebreo ng paglakad, na maaari ring tumukoy sa paraan ng pamumuhay at pakikisama sa iba.
- source_word: אַנְשֵׁי רֶשַׁע
  choice: masasamang tao
  rationale: Likas at marangal sa Tagalog ang “masasamang tao.” Bagaman maaaring tumukoy sa mga lalaki ang אַנְשֵׁי, karaniwan din itong gumaganap bilang pangkalahatang pantukoy sa mga tao; hindi malinaw na mahalaga rito ang kasarian.
theological_decisions:
- issue: Kung pananatilihin bilang tiyak sa kasarian ang אַנְשֵׁי רֶשַׁע
  choice: masasamang tao
  alternative: masasamang lalaki
  rationale: Hindi nakasalalay sa kasarian ang moral na paratang sa konteksto. Ang “mga tao” ang natural na pangkalahatang katumbas sa Tagalog, habang ang “mga lalaki” ay maaaring magdagdag ng diin sa kasarian na hindi kinakailangan ng talata.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa panulaang karunungan. Pinanatili ang parallelism ng dalawang sugnay at ang metaporang “lumalakad,” habang iniwasan ang masyadong makalumang “kalikuan” o denominasyonal na pananalita.
