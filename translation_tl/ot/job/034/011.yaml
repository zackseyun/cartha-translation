  text: For he repays a man according to his deed[a], and he makes him find according to a man's way.
translation:
  language: tl
  text: 'Sapagkat ginagantihan niya ang tao ayon sa kanyang ginawa,

    at ipinararanas niya sa kanya ang naaayon sa kanyang landas.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “pinangyayari niyang maranasan niya ito” o “dinadala niya ito sa kanya,” na nagpapahiwatig ng causative na diwa ng pandiwang Hebreo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikita ang paliwanag o batayan ng sinabi ni Elihu sa konteksto.
- source_word: פֹעַל
  choice: ginawa
  rationale: Tumutukoy sa gawa o kilos ng tao; natural ito sa modernong Tagalog at angkop sa konteksto ng pagganti ayon sa asal.
- source_word: אָדָם
  choice: ang tao
  rationale: Pinananatili ang pang-isahang kinatawang diwa ng Hebreo habang natural at pangkalahatan sa Tagalog.
- source_word: יְשַׁלֶּם לוֹ
  choice: ginagantihan niya ang tao
  rationale: Ang Piel ng שלם ay nagpapahayag ng pagganti o pagbabayad ayon sa ginawa; ang 'ginagantihan' ay malinaw at may hukom na himig nang hindi makaluma.
- source_word: וּכְאֹרַח אִישׁ
  choice: ayon sa landas nito
  rationale: Pinananatili ng 'landas' ang metapora ng אֹרַח para sa paraan ng pamumuhay; ang 'nito' ay tumutukoy sa tao at umiiwas sa mabigat na pag-uulit.
- source_word: יַמְצִאֶנּוּ
  choice: ipinararanas niya rito
  rationale: 'Ipinahahayag ang causative na diwa ng Hiphil: pinasasapit o ipinahahanap sa tao ang bunga na naaayon sa kanyang landas. Mas natural ito kaysa literal na ''ipinahahanap niya rito.'''
theological_decisions:
- issue: Banal na pagganti ayon sa asal ng tao
  choice: Isinasaad na ginagantihan ng Diyos ang tao ayon sa kanyang ginawa at ipinararanas ang naaayon sa kanyang landas.
  alternative: Unawain ito bilang pahayag na ang bawat pagdurusa ay eksaktong parusa sa sariling kasalanan.
  rationale: Pinananatili ng salin ang pangkalahatang prinsipyo ng banal na katarungan ngunit hindi nito nilulutas nang payak ang mas malawak na tensiyong teolohikal sa aklat ng Job.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang 'tao' bilang pangkalahatang katawagan at pinanatili ang metapora ng 'landas.'
