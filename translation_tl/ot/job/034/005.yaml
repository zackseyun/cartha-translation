  text: כִּֽי אָ֭מַר אִיּ֣וֹב צָדַ֑קְתִּי וְ֝/אֵ֗ל הֵסִ֥יר מִשְׁפָּטִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/005.yaml
  text: For Job has said[a], ‘I am in the right, and God has taken away my justice.’
translation:
  language: tl
  text: Sapagkat sinabi ni Job, “Ako ang nasa tama, at inalis ng Diyos ang katarungang nararapat sa akin.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang karapatan ko” o “ang aking katarungan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikilala nito ang paliwanag ni Elihu batay sa naunang sinabi ni Job at maayos na nag-uugnay sa daloy ng pangangatwiran.
- source_word: אָמַר
  choice: sinabi
  rationale: Ang qatal ay tumutukoy sa naunang pahayag ni Job na mahalaga pa rin sa kasalukuyang argumento; likas sa Filipino ang payak na aspektong naganap dito.
- source_word: אִיּוֹב
  choice: Job
  rationale: Karaniwang anyo ng pangalang ito sa makabagong saling Filipino.
- source_word: צָדַקְתִּי
  choice: Ako ang nasa tama
  rationale: Ipinahahayag nito na tama si Job sa usaping pinagtatalunan, nang hindi pinalalawak tungo sa ganap na moral na kawalang-sala.
- source_word: וְאֵל
  choice: at … ng Diyos
  rationale: Karaniwang katawagan sa Diyos ang אֵל dito. Pinanatili ang payak na pagdaragdag ng וְ sa halip na gawing tahasang panalungat.
- source_word: הֵסִיר
  choice: inalis
  rationale: Tuwirang inilalarawan ng hiphil ng סור ang pag-aalis o pagtanggal, nang hindi dinaragdagan ang teksto ng mas tiyak na paraan gaya ng ‘ipinagkait.’
- source_word: מִשְׁפָּטִי
  choice: ang katarungan para sa akin
  rationale: Pinananatili nito ang legal at moral na lawak ng מִשְׁפָּטִי habang mas natural sa Filipino kaysa sa literal na ‘ang aking katarungan.’ Inilalahad sa talababa ang mga posibleng kahulugang karapatan at katarungang nararapat kay Job.
theological_decisions:
- issue: Forensikong diwa ng pahayag ni Job tungkol sa sarili
  choice: Ako ang nasa tama
  alternative: Ako ay matuwid
  rationale: Iniuugnay nito ang pahayag sa usapin ni Job sa harap ng Diyos at hindi ipinahihiwatig na inaangkin niya ang lubos na kawalang-kasalanan.
- issue: Saklaw ng kahulugan ng מִשְׁפָּטִי
  choice: ang katarungan para sa akin
  alternative: ang karapatan ko; ang katarungang nararapat sa akin; ang usapin ko
  rationale: Pinananatili ng pangunahing salin ang sabayang legal at moral na diwa ng salita, habang inilalahad ng talababa ang mga mas tiyak na pagbasa nang hindi nilulutas ang tunay na leksikal na tensiyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘nasa tama’ para sa natural na forensikong pahayag at iniwasan ang mas malawak na ‘matuwid.’ Pinanatili ang ‘at’ upang hindi magdagdag ng panalungat na hindi tahasang nasa Hebreo.
