  text: For he has said[a], ‘A man gains nothing by delighting himself with God.’
translation:
  language: tl
  text: Sapagkat sinabi niya[a], “Walang napapala ang tao sa pagkagalak niya sa Diyos.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Walang napapala ang tao kapag kinalulugdan siya ng Diyos,” o “Walang napapala ang tao sa paghahangad ng lingap ng Diyos.” Masiksik ang pariralang Hebreo at maaari itong unawain sa mahigit isang paraan.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikilala nito ang dahilan o batayan ng paratang ni Elihu sa naunang konteksto.
- source_word: אָמַר
  choice: sinabi niya
  rationale: Likas na salin ng ganap na pandiwa para sa naunang pahayag ni Job na ngayo'y binubuod ni Elihu.
- source_word: לֹא יִסְכָּן
  choice: Walang napapala
  rationale: Natural na makabagong Tagalog para sa diwang hindi nakikinabang o walang natatamong pakinabang.
- source_word: גָּבֶר
  choice: ang tao
  rationale: Bagaman panlalaki ang anyong Hebreo, ginagamit ito rito bilang pangkalahatang pagtukoy sa isang tao.
- source_word: בִּרְצֹתוֹ
  choice: sa pagkakaroon ng kasiyahan
  rationale: Pinananatili ang pangunahing pagbasa na ang tao ang nakararanas o nagkakaroon ng kasiyahan, habang hindi ginagawang labis na tiyak ang masiksik na pariralang Hebreo.
- source_word: עִם אֱלֹהִים
  choice: sa Diyos
  rationale: Sa natural na Tagalog, ipinahahayag nito ang Diyos bilang kaugnay na layon ng kasiyahan; ang mas literal na “kasama ng Diyos” ay maaaring magbigay ng ibang diwa.
theological_decisions:
- issue: Pagpapakahulugan sa pariralang בִּרְצֹתוֹ עִם אֱלֹהִים
  choice: Ang tao ay walang napapala sa pagkakaroon ng kasiyahan sa Diyos.
  alternative: Ang tao ay walang napapala kapag nalulugod sa kanya ang Diyos; o walang napapala sa paghahangad ng lingap ng Diyos.
  rationale: Pinakamadaling iugnay sa tao ang hulaping panghalip at ituring siyang simuno ng infinitibo, ngunit masiksik at maaaring unawain sa iba’t ibang paraan ang Hebreo. Kaya pinanatili sa talababa ang mga tunay na alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “walang napapala” bilang karaniwang pahayag ng kawalan ng pakinabang, at inilagay agad ang marker [a] pagkatapos ng “sinabi niya” gaya ng pinagkunang konsultasyong teksto.
