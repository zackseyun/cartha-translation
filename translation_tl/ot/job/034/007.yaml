  text: What man is like Job[a], who drinks mockery like water?
translation:
  language: tl
  text: Sinong lalaki ang tulad ni Job,[a] na umiinom ng panunuya na parang tubig?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “May lalaki bang tulad ni Job, na umiinom ng panlilibak na parang tubig?”'
    reason: Pinananatili ng alternatibo ang retorikal na diwa ng מִי at ang posibleng salin na “panlilibak” para sa לַּעַג.
lexical_decisions:
- source_word: מִי גֶבֶר
  choice: Sinong lalaki
  rationale: Ang מִי ay nagpapakilala ng retorikal na tanong, at ang גֶבֶר ay tumutukoy rito sa isang lalaki. Likas at tuwiran sa modernong Tagalog ang “Sinong lalaki” habang pinananatili ang pagtataka at paghahambing ng Hebreo.
- source_word: כְּאִיּוֹב
  choice: tulad ni Job
  rationale: Ang unlaping כְּ ay naghahayag ng paghahambing. Malinaw at natural sa Tagalog ang “tulad ni Job.”
- source_word: יִשְׁתֶּה
  choice: umiinom
  rationale: Ang imperfect na pandiwa ay naglalarawan dito ng katangian o nakagawiang kilos; ang pangkasalukuyang “umiinom” ang natural na katumbas sa Tagalog.
- source_word: לַּעַג
  choice: panunuya
  rationale: Ang pangngalan ay tumutukoy sa panlilibak, pangungutya, o mapanuyang pananalita. Ang “panunuya” ay malinaw at nagpapanatili sa larawang ito bilang bagay na iniinom.
- source_word: כַּמָּיִם
  choice: parang tubig
  rationale: Pinananatili nito ang tahasang paghahambing at ang matingkad na larawan ng isang bagay na iniinom nang sagana o karaniwan.
