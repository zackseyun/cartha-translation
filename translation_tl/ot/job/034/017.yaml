  text: Can one who hates justice govern? And will you condemn the righteous Mighty One?[a][b]
translation:
  language: tl
  text: Maaari bang mamuno ang namumuhi sa katarungan? At hahatulan mo bang maysala ang Matuwid na Makapangyarihan?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “mamuno,” “magpigil,” o, mas literal, “magbigkis.” Malamang na tumutukoy rito ang pandiwang Hebreo sa paggamit ng kapangyarihang mamahala o magpigil.
    reason: lexical_alternative
  - marker: b
    text: O “ang matuwid na makapangyarihan” o “ang matuwid na dakila.” Pinakamalamang na tumutukoy rito ang parirala sa Diyos.
    reason: alternative_reading
lexical_decisions:
- source_word: הַאַף
  choice: Maaari bang
  rationale: Ipinahahayag ang mariing retorikal na tanong sa natural na Filipino; ipinahihiwatig ng tanong ang di-maaaring mangyari nang hindi kailangang idagdag ang “maging.”
- source_word: שׂוֹנֵא
  choice: ang namumuhi
  rationale: Ang participle ay ginagamit bilang pangngalan at naglalarawan sa isang taong likas o patuloy na napopoot.
- source_word: מִשְׁפָּט
  choice: katarungan
  rationale: Sa konteksto ng pamamahala, tumutukoy ito sa matuwid na kaayusang moral at panghukuman, hindi lamang sa isang hatol.
- source_word: יַחֲבוֹשׁ
  choice: mamahala
  rationale: Bagaman literal na “magbigkis,” malamang na idyomatiko rito ang diwang mamuno, maghari, o magpigil sa pamamagitan ng awtoridad.
- source_word: וְאִם
  choice: At ... bang
  rationale: Iniuugnay nito ang ikalawang retorikal na tanong sa una; natural sa Filipino ang “At” kasama ng hulaping pananong na “ba.”
- source_word: צַדִּיק
  choice: Matuwid
  rationale: Pinananatili ang moral at teolohikal na bigat ng salitang tumutukoy sa pagiging matuwid o makatarungan.
- source_word: כַּבִּיר
  choice: Makapangyarihan
  rationale: Bilang substantibong pang-uri, malamang na tumutukoy ito sa Diyos bilang ang Makapangyarihan o Dakila; ang malaking titik ay nagpapahiwatig ng malamang na reperensiya nang hindi inaalis ang alternatibong pagbasa.
- source_word: תַּרְשִׁיעַ
  choice: hahatulan mo bang maysala
  rationale: 'Tumpak na ipinapahayag ang causative/judicial na diwa: ideklarang masama o maysala, hindi lamang parusahan.'
theological_decisions:
- issue: Ang tinutukoy ng צַדִּיק כַּבִּיר
  choice: Malamang na Diyos, isinalin bilang “ang Makapangyarihang Matuwid”
  alternative: “ang matuwid na makapangyarihan” o “ang matuwid na dakila,” na maaaring tumukoy sa isang makapangyarihang pinuno
  rationale: Sa pangangatwiran ni Elihu, ang retorikal na diin ay nasa kamalian ng paghatol sa Diyos, ang matuwid na tagapamahala. Gayunman, hindi tahasang pangalan ng Diyos ang parirala, kaya itinatala ang lehitimong alternatibo.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “hahatulan ... maysala” upang panatilihin ang wikang panghukuman, at ang ayos na “Makapangyarihang Matuwid” upang maging natural bilang pantukoy sa Diyos habang iniiwan sa talababa ang tunay na ambiguwidad ng pariralang Hebreo.
