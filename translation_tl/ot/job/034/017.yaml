  naturalness: Natural ang unang tanong at ang “hahatulan mo bang maysala.” Gayunman, ang “Makapangyarihang Matuwid” ay hindi likas na ayos ng pang-uring Filipino at maaaring mabasa bilang isang likhang titulo o bilang “lubhang matuwid.” Mas malinaw at mas natural ang “Matuwid na Makapangyarihan,” habang pinananatili ang substantibong gamit at ang posibleng pagtukoy sa Diyos.
  terminology: Ang “katarungan,” “mamuno,” “maysala,” at “Matuwid na Makapangyarihan” ay angkop sa marangal ngunit modernong rehistrong Filipino. Ang kapitalisasyon sa pangunahing teksto ay maaaring magpahiwatig ng malamang na banal na reperensiya, samantalang ang talababa ay nararapat na magpanatili ng di-tiyak na pagbasa.
