  to: Sa isang iglap ay namamatay sila; sa hatinggabi ay nayayanig ang isang bayan at naglalaho; ang makapangyarihan ay inaalis, hindi sa pamamagitan ng kamay.[a]
  rationale: Pinalitan ang ‘lumilipas’ ng ‘naglalaho’ upang maipakita ang kontekstuwal na pagkawala/pagpanaw ng bayan. Inayos ang huling sugnay sa balintiyak na ayos na mas malinaw sa Filipino at nananatiling hindi tinutukoy ang ahente. Pinanatili ang literal na ‘hindi sa pamamagitan ng kamay’ sa pangunahing teksto upang huwag lutasin ang kalabuan ng Hebreo.
