  yaml_path: translation/ot/job/034/020.yaml
  text: In a moment they die; at midnight a people are shaken[a], and they pass away; the mighty are removed, not by hand.
translation:
  language: tl
  text: Sa isang iglap ay namamatay sila; sa hatinggabi ay nayayanig ang isang bayan at naglalaho; ang makapangyarihan ay inaalis, hindi sa pamamagitan ng kamay.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nang walang kamay ng tao.” Literal sa Hebreo, “hindi sa pamamagitan ng kamay”; malamang na tumutukoy ito sa pag-aalis na hindi sa pamamagitan ng ahensiya ng tao.
    reason: lexical_alternative
lexical_decisions:
- source_word: רֶגַע
  choice: sa isang iglap
  rationale: Tumutukoy sa napakaikling sandali; natural sa Filipino at pinananatili ang diin sa biglaang pangyayari.
- source_word: יָמֻתוּ
  choice: namamatay sila
  rationale: Tuwirang salin ng karaniwang pandiwa para sa pagkamatay.
- source_word: וַחֲצוֹת לָיְלָה
  choice: sa hatinggabi
  rationale: Likas na katumbas sa Filipino ng pariralang literal na 'kalahati ng gabi.'
- source_word: יְגֹעֲשׁוּ
  choice: nayayanig
  rationale: Sinasaklaw ang diwa ng pagyanig o matinding pagkagulo nang hindi tiyakang itinatakda kung pisikal o panlipunan ang pagyanig.
- source_word: עָם
  choice: ang isang bayan
  rationale: Pinananatili ang kolektibong isahan at di-tiyak na reperensiya ng Hebreo.
- source_word: וְיַעֲבֹרוּ
  choice: at lumilipas
  rationale: Pinananatili ang larawan ng pagdaan habang sa konteksto ay nagpapahiwatig ng pagkawala o pagpanaw.
- source_word: וְיָסִירוּ
  choice: inaalis
  rationale: Ang anyong Filipino ay nagpapahintulot na manatiling hindi tinutukoy ang gumagawa, gaya ng konteksto ng Hebreo.
- source_word: אַבִּיר
  choice: ang makapangyarihan
  rationale: Nagsasaad ng taong malakas o makapangyarihan; pinananatili ang anyong isahan ng Hebreo.
- source_word: לֹא בְיָד
  choice: hindi sa pamamagitan ng kamay
  rationale: Malapit sa literal na idyoma ng Hebreo at hindi tahasang nilulutas kung ang ibig sabihin ay walang kamay ng tao.
theological_decisions:
- issue: Ang ahensiyang ipinahihiwatig ng לֹא בְיָד ('hindi sa pamamagitan ng kamay')
  choice: Pinanatili sa pangunahing teksto ang literal na larawan ng kamay.
  alternative: nang walang kamay ng tao
  rationale: Malamang na ipinahihiwatig ang pagkilos na hindi sa pamamagitan ng tao, ngunit hindi tahasang sinasabi ng Hebreo ang salitang 'tao.' Pinananatili ng salin ang tensiyon at inilalagay sa talababa ang malamang na kahulugan.
translation_notes:
  register: Makabago at marangal na Filipino. Ginamit ang 'sa isang iglap' para sa biglaang oras, 'bayan' bilang kolektibong sambayanan, at isang bahagyang literal na parirala sa hulihan upang mapanatili ang tunay na kalabuan ng Hebreo.
