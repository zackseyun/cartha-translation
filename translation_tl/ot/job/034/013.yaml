translation:
  language: tl
  text: 'Sino ang nag-atas sa kanya ng pangangasiwa sa lupa,

    at sino ang naglagay sa kanya bilang tagapangasiwa ng buong daigdig?'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פָקַד עָלָיו
  choice: nagtalaga sa kanya upang mamahala
  rationale: Sa konteksto, ang parirala ay tumutukoy sa pag-aatas ng pananagutan o pamamahala. Likas sa modernong Tagalog ang ganitong pagpapahayag at malinaw na ipinakikitang walang nakatataas na nagbigay sa Diyos ng tungkulin sa lupa.
- source_word: אָרְצָה
  choice: sa lupa
  rationale: Dahil kaparis nito ang תבל, pandaigdig ang saklaw at hindi isang partikular na lupain.
- source_word: שָׂם
  choice: naglagay ... sa kaayusan
  rationale: Ang salitang Hebreo ay karaniwang nangangahulugang maglagay o magtakda. Idinagdag ang 'sa kaayusan' upang maipahayag nang natural ang diwa ng paglalagay sa buong daigdig bilang isang maayos na kabuuan, nang hindi gamitin ang mas matinding 'nagtatag.'
- source_word: תֵּבֵל כֻּלָּהּ
  choice: buong daigdig
  rationale: Ang תבל ay ang daigdig bilang tinatahanan at maayos na mundo; ipinananatili ng 'buong' ang diin ng כֻּלָּהּ.
theological_decisions:
- issue: Tinutukoy ng hulaping panghalip sa עָלָיו
  choice: 'Ang panghalip ay tumutukoy sa Diyos: ''sa kanya.'''
  alternative: Maaaring unawain sa ilang pagbasa na tumutukoy ito sa lupa o sa isang mas abstraktong bagay.
  rationale: Sa Job 34:10–15, ang tanong ni Elihu ay kung may nakatataas bang nag-atas sa Diyos na mamahala sa lupa. Likas na panlalaking isahan ang hulapi at pinakamalamang na ang Diyos ang tinutukoy, ngunit pinananatili sa talababa ang leksikal na alternatibong pagbasa ng buong parirala.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog. Ginamit ang 'daigdig' upang maiba sa 'lupa' at mapanatili ang parallelism ng אֶרֶץ at תבל. Ang taludtod ay nananatiling retorikal at hindi nagdaragdag ng denominasyonal na pagpapakahulugan.
