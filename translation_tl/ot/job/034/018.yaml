  text: who says to a king[a], ‘Worthless one!’ and to nobles[b], ‘Wicked ones!’
translation:
  language: tl
  text: 'ang nagsasabi[a] sa isang hari, “Walang-kuwenta ka!”[b]


    at sa mga maharlika, “Masasama kayo!”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring basahin: “Nararapat bang sabihin” o “Masasabi ba.” Maaaring pantanong ang unang pantig sa Hebreo sa halip na pantukoy sa “ang nagsasabi.”'
    reason: textual_or_syntactic_ambiguity
  - marker: b
    text: Ang salitang Hebreo ay nangangahulugang “walang-kuwenta” o “hamak.” Hindi ito kailangang unawain dito bilang pangalang pantanging “Belial.”
    reason: lexical_alternative
  - marker: c
    text: Isahan ang anyo ng “masama” sa Hebreo, ngunit maramihan ang mga maharlikang kinakausap; kaya ginawang maramihan sa Filipino para luminaw ang patungkol.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַאֲמֹר
  choice: ang nagsasabi
  rationale: Binabasa ang anyo bilang isang pariralang tumutukoy sa gumagawa ng pagsasalita at umaayon sa pagpapatuloy ng paglalarawan sa konteksto. Nananatili sa talababa ang posibleng pagbasa rito bilang tanong.
- source_word: לְמֶלֶךְ
  choice: sa isang hari
  rationale: Ang לְ ay nagpapakilala sa kinakausap, at walang tiyak na pantukoy ang מֶלֶךְ, kaya ang pangkalahatang “isang hari” ang angkop.
- source_word: בְּלִיָּעַל
  choice: Walang-kuwenta ka!
  rationale: Dito, ang salita ay mapanlait na tawag na tumutukoy sa kawalang-halaga o kasamaan, hindi kailangang unawain bilang pangalang pantangi na “Belial.” Idinagdag ang “ka” upang maging likas at malinaw na tuwirang pananalita sa Filipino.
- source_word: רָשָׁע
  choice: Masasama kayo!
  rationale: Bagaman isahan ang anyo sa Hebreo, nakatuon ito sa maramihang נְדִיבִים. Ang “kayo” at maramihang pang-uri ay malinaw at likas sa Filipino habang pinananatili ang mapanuring lakas ng salita.
- source_word: אֶל נְדִיבִים
  choice: sa mga pinuno
  rationale: Ang אֶל ay nagpapakilala sa mga kinakausap. Sa paralelismo sa “hari,” ang נְדִיבִים ay tumutukoy sa mga taong mataas ang katayuan o may kapangyarihan; mas malinaw sa karaniwang modernong Filipino ang “mga pinuno” kaysa “mga maharlika.”
theological_decisions:
- issue: Kung ang הַאֲמֹר ay paglalarawan o tanong
  choice: Isinalin sa pangunahing teksto bilang “ang nagsasabi,” na naglalarawan sa tinutukoy sa konteksto.
  alternative: “Nararapat bang sabihin sa isang hari…?” o “Masasabi ba sa isang hari…?”
  rationale: Maaaring unawain ang הַ־ bilang pantukoy na ginagawang substantibo ang infinitive o bilang pantanong. Sinusunod ng pangunahing teksto ang pagbasa na maayos na nag-uugnay sa kasunod na paglalarawan, ngunit hindi itinatago ang tunay na sintaktikong kalabuan.
translation_notes:
  register: Makabago, tuwiran, at marangal na Filipino. Ang “Walang-kuwenta ka!” at “Masasama kayo!” ay likas na mga sambit sa tuwirang pananalita at malinaw na nagpapakita ng isahan at maramihang kausap. Pinanatili ang anyong piraso ng pangungusap dahil nakaugnay ang talata sa nakapaligid na konteksto.
