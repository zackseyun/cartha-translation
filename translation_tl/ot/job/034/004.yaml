translation:
  language: tl
  text: Piliin natin para sa ating mga sarili kung ano ang makatarungan[a]; sama-sama nating alamin kung ano ang mabuti.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Piliin natin para sa ating mga sarili ang katarungan; sama-sama nating kilalanin kung ano ang mabuti.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁפָּט
  choice: kung ano ang makatarungan
  rationale: Maaaring tumukoy ang מִשְׁפָּט sa katarungan, paghatol, o pasiya. Sa kontekstong ito ng sama-samang pagsusuri, natural na ipinahahayag ng “kung ano ang makatarungan” ang etikal at panghukumang diwa nang hindi ito nililimitahan sa isang hatol ng hukuman.
- source_word: נִבְחֲרָה
  choice: piliin natin
  rationale: Ang Qal imperfect na unang panauhang maramihan ay ginagamit bilang paghihikayat; malinaw itong naihahatid ng “piliin natin.”
- source_word: לָּנוּ
  choice: para sa ating sarili
  rationale: Ang ל na may hulaping unang panauhang maramihan ay nagpapahiwatig ng kapakinabangan o kaugnayan; pinananatili ng parirala ang pansarili at sama-samang pakikibahagi sa pagpili.
- source_word: נֵדְעָה
  choice: alamin natin
  rationale: Karaniwang nangangahulugang “malaman” ang ידע, ngunit dito ay may diwa rin ng pagkilala o pag-unawa sa pamamagitan ng pagsusuri. Ang “alamin natin” ay malapit sa anyo ng Hebreo at likas sa Filipino.
- source_word: בֵינֵינוּ
  choice: sa gitna natin
  rationale: Ipinahihiwatig ng idyoma ang sama-samang pag-uusap at pagsusuri sa loob ng pangkat. Pinananatili ng “sa gitna natin” ang posibleng diwa ng “between/among us” nang hindi ito labis na ipinapaliwanag.
- source_word: מַה טּוֹב
  choice: kung ano ang mabuti
  rationale: Malawak ang saklaw ng טוֹב—mabuti, kapaki-pakinabang, o nararapat. Pinananatili ng “kung ano ang mabuti” ang lawak at ang kaagapay nitong etikal na pagsusuri.
