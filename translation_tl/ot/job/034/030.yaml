translation:
  language: tl
  text: upang hindi maghari ang taong walang takot sa Diyos[a] at hindi masilo ang bayan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “upang huwag maghari ang taong walang takot sa Diyos, upang walang mga silo sa bayan.” Siksik ang Hebreo at maaaring unawain sa ilang magkakalapit na paraan ang ugnayan ng “maghari” at “mga silo.”'
    reason: alternative_reading
lexical_decisions:
- source_word: מִמְּלֹךְ
  choice: upang hindi maghari
  rationale: Ang מִן na kasunod ng pawatas ng מלך ay nauunawaan dito bilang pagpigil o layunin/bunga kaugnay ng pagkilos ng Diyos sa naunang talata. Likas sa Tagalog ang “upang hindi maghari.”
- source_word: אָדָם
  choice: ang tao
  rationale: Tumutukoy ito sa isang taong namumuno, hindi sa sangkatauhan sa kabuuan.
- source_word: חָנֵף
  choice: walang takot sa Diyos
  rationale: Sa panitikang karunungan, inilalarawan ng salita ang taong lapastangan o hindi kumikilala sa Diyos, hindi lamang ang isang mapagkunwari. Ang pariralang ito ay malinaw at likas sa makabagong Tagalog.
- source_word: מִמֹּקְשֵׁי
  choice: at hindi masilo
  rationale: Napakasiksik ng Hebreong parirala. Ipinahahayag ng pandiwang pasibo ang malamang na diwang pagpigil sa pagkakasilo, habang iniiwasan ang hindi likas na literal na “mula sa mga silo.”
- source_word: עָם
  choice: ang bayan
  rationale: Sa konteksto ng pamamahala, tumutukoy ito sa sambayanang nasa ilalim ng pinuno; ang “bayan” ay maikli, marangal, at natural.
theological_decisions:
- issue: Ang siksik at eliptikong sintaks ng talata
  choice: Kumikilos ang Diyos upang hindi maghari ang taong walang takot sa Diyos at upang hindi masilo ang bayan.
  alternative: “upang huwag maghari ang taong walang takot sa Diyos, upang walang mga silo sa bayan”; maaari ring iugnay ang “mga silo” sa bayan bilang pinagmumulan o taglay nito.
  rationale: Pinakamalinaw sa konteksto ang pagbasa rito bilang layunin o bunga ng makatarungang pagkilos ng Diyos, ngunit hindi ganap na tiyak ang ugnayan ng mga salita sa ikalawang hati. Kaya pinananatiling maikli ang pangunahing teksto at inilalahad sa talababa ang tunay na kalabuan.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “walang takot sa Diyos” upang ihatid ang moral at panrelihiyong bigat ng חָנֵף, at “masilo ang bayan” upang maging natural ang siksik na ikalawang parirala nang hindi lubusang ikinukubli ang kalabuan nito.
