  text: For his eyes are on the ways of a man[a], and he sees all his steps.
translation:
  language: tl
  text: 'Sapagkat nakatuon ang kanyang mga mata sa mga landas ng isang tao,[a]

    at nakikita niya ang bawat hakbang ng taong iyon.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “mga landas ng isang lalaki,” na gumagamit ng panlalaking isahan sa pangkalahatang diwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikita ang paliwanag o batayan ng naunang pahayag at natural itong panimula sa Filipino.
- source_word: עֵינָיו עַל
  choice: nakatuon ang kanyang mga mata sa
  rationale: Pinananatili ang larawan ng mga mata na masusing nakamasid, sa natural at marangal na Filipino.
- source_word: דַּרְכֵי אִישׁ
  choice: mga landas ng tao
  rationale: Ang דֶּרֶךְ ay maaaring tumukoy sa literal na landas at, sa konteksto, sa asal o takbo ng buhay. Ang אִישׁ ay panlalaking isahan ngunit may pangkalahatang diwa; ang 'tao' ang likas na generic na katumbas sa Filipino.
- source_word: וְכָל צְעָדָיו
  choice: at ... ang bawat hakbang nito
  rationale: Ang 'bawat hakbang' ay tuwirang nagpapahayag ng kabuuang saklaw at pinananatili ang kongkretong larawang maaari ring tumukoy sa mga kilos.
- source_word: יִרְאֶה
  choice: nakikita niya
  rationale: Ang di-ganap na anyo ay nagpapahayag dito ng patuloy at pangkalahatang katotohanan; ang kasalukuyang aspekto ay natural sa Filipino.
theological_decisions:
- issue: Pangkalahatang diwa ng panlalaking isahang אִישׁ
  choice: tao
  alternative: isang lalaki
  rationale: Bagaman panlalaking isahan ang anyong Hebreo, pangkalahatan ang gamit nito sa konteksto. Ang 'tao' ay hindi naglilimita sa kasarian at karaniwang katumbas sa modernong Filipino; nililinaw ng talababa ang anyo ng orihinal.
- issue: Tinutukoy ng mga panghalip
  choice: kanyang / niya para sa Diyos; nito para sa tao
  alternative: ulitin ang 'Diyos' at 'tao'
  rationale: Pinananatili ang mga panghalip ng Hebreo habang ginagamit ang 'nito' upang luminaw na ang mga hakbang ay sa tao, hindi sa Diyos.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang magkaugnay na larawan ng mga landas at mga hakbang, pati ang panghalip para sa Diyos sa halip na tahasang idagdag ang pangalang wala sa talata.
