  text: What I do not see[a], you teach me; if I have done wrong[b], I will not do it again.
translation:
  language: tl
  text: Ang hindi ko nakikita, ituro mo sa akin[a]; kung nakagawa ako ng mali, hindi ko na iyon uulitin.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin nang mas literal: “Ang hindi ko nakikita, ipakita mo sa akin” o “Bukod sa nakikita ko, turuan mo ako.” Eliptiko ang Hebreo.'
    reason: lexical_alternative
  - marker: b
    text: 'Mas literal: “hindi na ako magdaragdag,” na ang ibig sabihin ay “hindi na ako magpapatuloy” o “hindi ko na iyon gagawin muli.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּלְעֲדֵי אֶחֱזֶה
  choice: Ang hindi ko nakikita
  rationale: Ang parirala ay eliptiko. Pinananatili ng salin ang larawan ng pagkakita habang natural na ipinahihiwatig ang hindi pa nauunawaan o napapansing kamalian.
- source_word: אַתָּה הֹרֵנִי
  choice: ituro mo sa akin
  rationale: Ang Hiphil ng ירה ay karaniwang nangangahulugang magturo o magbigay-aral. Ang anyong pautos sa Filipino ay angkop sa pakiusap na ituwid ang kakulangan ng nagsasalita.
- source_word: אִם
  choice: kung
  rationale: Likas na ipinakikita ng “kung” ang kondisyong ipinahahayag ng אִם nang hindi ginagawang tiyak ang pag-amin.
- source_word: עָוֶל פָּעַלְתִּי
  choice: nakagawa ako ng mali
  rationale: Ang עָוֶל ay malawak na tumutukoy sa kamalian, kasamaan, o kawalang-katarungan, at ang פעל ay pangkalahatang pandiwa ng paggawa. Natural at hindi labis na espesipiko ang parirala sa Filipino.
- source_word: לֹא אֹסִיף
  choice: hindi ko na iyon uulitin
  rationale: Literal itong “hindi na ako magdaragdag,” ngunit idyomatikong nangangahulugang hindi na magpapatuloy o gagawa muli. Nililinaw ng “uulitin” ang diwa sa kasalukuyang Filipino.
theological_decisions:
- issue: Ang pananalita bilang pagpapakumbaba at kahandaang tumanggap ng pagtutuwid mula sa Diyos
  choice: Isinalin bilang pakiusap na maturuan at pangakong hindi na ulitin ang mali, nang hindi nagdaragdag ng teknikal na pananalita tungkol sa pagsisisi o ganap na pag-amin ng sala.
  alternative: “Bukod sa nakikita ko, turuan mo ako; kung gumawa ako ng kasamaan, hindi na ako magdaragdag.”
  rationale: Pinananatili nito ang kondisyong “kung,” ang kahandaang maturuan, at ang pasiyang tumigil sa maling gawain nang hindi nilulutas ang elipsis o pinalalakas ang pag-amin nang lampas sa Hebreo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mali” sa halip na mas teknikal o makalumang “kalikuan,” at pinanatili sa talababa ang tunay na kalabuan ng unang sugnay at ang literal na idyoma ng huling sugnay.
