  yaml_path: translation/ot/job/034/016.yaml
  text: If you have understanding[a], hear this; listen to the sound of my words.
translation:
  language: tl
  text: Kung may pang-unawa ka, pakinggan mo ito; makinig ka sa tinig ng aking mga salita.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “tunog ng aking mga salita.” Ang salitang Hebreo ay maaaring mangahulugang “tinig” o “tunog.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Kung
  rationale: Ipinakikilala nito ang isang kondisyong panawagan. Hindi na hiwalay na isinalin ang prefixed conjunction dahil sapat at likas sa modernong Tagalog ang “Kung.”
- source_word: בִּינָה
  choice: may pang-unawa ka
  rationale: Ang בִּינָה ay tumutukoy sa pang-unawa o kakayahang kumilala nang tama. Idinagdag ang “may … ka” upang maipahayag nang likas sa Tagalog ang ipinahihiwatig na kondisyon sa Hebreo.
- source_word: שִׁמְעָה
  choice: dinggin mo
  rationale: Tuwirang pautos ito mula sa שׁמע. Ang “dinggin mo” ay marangal ngunit nauunawaan pa rin, at naipag-iiba ito sa mas masidhing kasunod na panawagang “pakinggan mo.”
- source_word: זֹּאת
  choice: ito
  rationale: Tumutukoy ang demonstratibo sa sinasabi ni Elihu nang hindi nagdaragdag ng interpretatibong pangngalan gaya ng “bagay” o “usapin.”
- source_word: הַאֲזִינָה
  choice: pakinggan mo
  rationale: Ipinahahayag ng pandiwa ang masinsing pakikinig. Likas sa modernong Tagalog ang “pakinggan mo” at malinaw na pautos.
- source_word: לְקוֹל
  choice: ang tinig ng
  rationale: Maaaring mangahulugan ang קוֹל ng “tinig” o “tunog.” Pinanatili ng “tinig ng” ang kongkretong konstruksiyon ng Hebreo sa halip na gawing payak na “pakinggan ang aking mga salita.”
- source_word: מִלָּי
  choice: aking mga salita
  rationale: Tuwirang tinutumbasan nito ang pangmaramihang anyong tumutukoy sa mga binigkas na salita ni Elihu.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran at marangal. Ginamit ang “dinggin” upang mapanatili ang pagkakaiba ng dalawang pandiwa ng pakikinig, habang ang “pakinggan” ay nagbibigay ng likas at masinsing ikalawang utos. Pinanatili ang bahagyang di-karaniwang pariralang “tinig ng aking mga salita” dahil naroon din ang kongkretong parirala sa Hebreo.
