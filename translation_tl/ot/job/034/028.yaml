base_translation:
  language: en
  yaml_path: translation/ot/job/034/028.yaml
  text: so as to bring before him the cry of the poor[b][a], and he hears the cry of the afflicted.
translation:
  language: tl
  text: upang dalhin sa harap niya[a] ang daing ng dukha[b], at naririnig niya ang daing ng mga naghihirap.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa kaniya” o “laban sa kaniya.” Maaaring unawain sa mahigit isang paraan ang pang-ukol sa Hebreo rito.
    reason: lexical_alternative
  - marker: b
    text: O “ng mahina.” Ang mga salitang Hebreo na isinaling “dukha” at “mga naghihirap” ay magkalapit ang kahulugan ngunit hindi ganap na magkapareho; maaari ring isalin ang huli na “mga inaapi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לְהָבִיא
  choice: upang dalhin
  rationale: Ang לְ na kasunod ng Hifil infinitive ng בוא ay nagpapahayag dito ng layunin o bunga. Pinananatili ng “upang dalhin” ang causative at infinitival na diwa nang hindi nagpapalawak sa sinabi ng Hebreo.
- source_word: עָלָיו
  choice: sa harap niya
  rationale: Kasama ng בוא, maaari itong tumukoy sa pagdadala ng daing sa pansin ng isang hukom o pinuno. Likas sa Filipino ang “sa harap niya,” ngunit hindi nito inaalis ang ibang posibleng pagbasa ng pang-ukol.
- source_word: צַעֲקַת
  choice: ang daing
  rationale: Ang צְעָקָה ay sigaw o daing na nagmumula sa matinding paghihirap. Ang “daing” ay malinaw at marangal sa kasalukuyang Filipino at akma sa konteksto ng paghingi ng katarungan.
- source_word: דָּל
  choice: dukha
  rationale: Ang דָּל ay maaaring tumukoy sa mahirap, mahina, o walang kapangyarihan sa lipunan. Ang “dukha” ay maikli at karaniwang salin na nagpapahiwatig ng kahirapan at pagiging mahina.
- source_word: וְצַעֲקַת
  choice: at ... ang daing
  rationale: Inuulit ang “daing” upang mapanatili ang paralelismo at retorikal na pag-uulit ng Hebreo.
- source_word: עֲנִיִּים
  choice: mga naghihirap
  rationale: Ang עֲנִיִּים ay maaaring mangahulugang mga dukha, pinahihirapan, o inaapi. Pinananatili ng “mga naghihirap” ang pagkakaiba nito sa דָּל nang hindi ipinapalagay na tahasang pang-aapi lamang ang tinutukoy.
- source_word: יִשְׁמָע
  choice: naririnig niya
  rationale: Maaaring gamitin ang imperfect sa tulang karunungan para sa karaniwang o patuloy na kilos. Ang “naririnig niya” ay tuwiran at hindi nagdaragdag ng kahulugang wala sa pandiwa.
theological_decisions:
- issue: Ang tinutukoy ng panghalip sa עָלָיו at ang paksa ng יִשְׁמָע
  choice: Dinadala ang daing sa harap ng Diyos, at ang Diyos ang nakaririnig dito.
  alternative: Maaaring dalhin ang daing laban sa masamang tao, samantalang ang Diyos ang nakaririnig; o maaaring dumating ang daing sa mapang-api at siya ang makarinig nito.
  rationale: Sa konteksto, inilalarawan ni Elihu ang pang-aapi ng masasama at ang pagkaalam at paghatol ng Diyos. Pinakanatural na ang di-binanggit na paksa ng “naririnig” ay ang Diyos. Gayunman, inilalahad sa talababa ang tunay na kalabuan ng עָלָיו.
translation_notes:
  register: Modernong Filipino na may marangal ngunit madaling maunawaang himig. Pinanatili ang maikling paralelismo ng tulang Hebreo, ang pag-uulit ng “daing,” at ang kalabuan ng pang-ukol sa pamamagitan ng talababa.
