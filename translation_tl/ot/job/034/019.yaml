  text: who shows no partiality to princes and does not regard the rich above the poor, for all of them are the work of his hands.
translation:
  language: tl
  text: 'na hindi nagtatangi sa mga pinuno

    at hindi itinuturing na higit ang mayaman kaysa sa mahirap,

    sapagkat silang lahat ay gawa ng kanyang mga kamay.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֹא נָשָׂא פְּנֵי שָׂרִים
  choice: hindi nagtatangi sa mga pinuno
  rationale: Ang idyomang Hebreo na ‘magtaas/magpakita ng mukha’ ay likas na tumutukoy sa pagkiling o pagtatangi; malinaw at natural ito sa modernong Tagalog.
- source_word: וְלֹא נִכַּר שׁוֹעַ לִפְנֵי דָל
  choice: hindi nagpapahalaga sa mayaman nang higit kaysa sa mahirap
  rationale: Pinananatili ang paghahambing sa katayuan ng mayaman at mahirap nang hindi ipinapalagay na simpleng pabor lamang ang diwa ng נכר; ang ‘nagpapahalaga’ ay sumasaklaw sa pagkilala o pagtinging nakahihigit.
- source_word: מַעֲשֵׂה יָדָיו כֻּלָּם
  choice: silang lahat ay gawa ng kanyang mga kamay
  rationale: Pinananatili ang kongkretong larawan ng paglikha sa pamamagitan ng mga kamay at ang diin na kapwa kabilang ang lahat.
theological_decisions:
- issue: Ang kawalang-pagtatangi ng Diyos sa mga pinuno, mayaman, at mahirap
  choice: Inilahad bilang hindi pagtatangi at hindi pagtingin sa mayaman na higit sa mahirap, sapagkat lahat ay kanyang nilikha.
  alternative: ‘Hindi pinapaboran ang mayaman kaysa sa mahirap.’
  rationale: Mas malapit ang pinili sa saklaw ng נכר at sa audited English consultation layer na ‘regard ... above,’ habang hindi nagdaragdag ng denominasyonal na pagpapakahulugan.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang ‘pinuno’ sa halip na mas makalumang ‘prinsipe,’ at pinanatili ang paralelismong patula ng Hebreo.
