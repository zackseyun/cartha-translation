  rationale: Ginamit ang kinikilalang anyo ng pangalang Hebreo sa tradisyong Tagalog at sa tekstong sanggunian.
- source_word: וַיֹּאמַר
  choice: sinabi niya
  rationale: Ang אמר ay karaniwang pandiwa para sa pagsasalita. Pinananatili ng “sinabi niya” ang pormulang Hebreo na “sumagot … at sinabi,” habang nililinaw sa natural na Tagalog ang simuno.
- source_word: וַ
  choice: Pagkatapos ay
  rationale: Ang unang waw na kalakip ng wayyiqtol ay nagpapasulong sa salaysay. Ipinahahayag ng “Pagkatapos ay” ang pagkakasunod-sunod nang mas natural kaysa sa payak na “At.”
