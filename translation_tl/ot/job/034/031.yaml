  text: For has anyone said to God[a], ‘I have borne punishment; I will not offend again’?
translation:
  language: tl
  text: Sapagkat may nagsabi na ba sa Diyos, “Pinasan ko; hindi ako gagawa ng masama[a]”?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “Pinasan ko; hindi ako kikilos nang masama.” Hindi tahasang binabanggit sa Hebreo kung ano ang pinasan; maaaring ipinahihiwatig ang parusa, disiplina, o kasalanan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Pinananatili ang ugnayang nagpapaliwanag o nagbibigay-katwiran sa naunang argumento.
- source_word: אֶל אֵל
  choice: sa Diyos
  rationale: Likas na salin ng pariralang tumutukoy sa Diyos bilang kausap.
- source_word: הֶאָמַר
  choice: may nagsabi na ba
  rationale: Bagaman ikatlong panauhang panlalaki ang anyo, ang konteksto ay retorikal at pangkalahatan; natural sa Filipino ang tahasang di-tiyak na paksa.
- source_word: נָשָׂאתִי
  choice: Tiniis ko na ang parusa
  rationale: Ang pangunahing diwa ay pagdadala o pagtitiis; hindi binanggit sa Hebreo ang layon, ngunit sa konteksto ay maaaring tumukoy sa parusa o disiplina. Isinama sa teksto para sa linaw, habang itinatala sa talababa ang literal na kawalan ng layon.
- source_word: לֹא אֶחְבֹּל
  choice: hindi na ako gagawa ng masama
  rationale: Ipinahahayag ang etikal na diwa ng חבל bilang paggawa nang mali o masama; ang “na” ay natural na nagpapahiwatig ng pangakong hindi ito uulitin.
theological_decisions:
- issue: Hindi tahasang layon ng נָשָׂאתִי
  choice: “ang parusa” sa pangunahing teksto, na may talababa
  alternative: “Tiniis ko na” o “Pinasan ko na” nang walang layon
  rationale: Nagbibigay ito ng malinaw at natural na pangungusap ngunit hindi ikinukubli na maaaring tumukoy ang Hebreo sa parusa, disiplina, o kasalanang pinasan.
translation_notes:
  register: Makabago, dignificado, at madaling maunawaan. Ginamit ang retorikal na “may nagsabi na ba” at ang natural na pangakong “hindi na ako gagawa ng masama,” habang pinananatili sa talababa ang tunay na kalabuan ng Hebreo.
