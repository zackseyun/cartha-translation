  text: Job speaks without knowledge[a], and his words are without understanding.
translation:
  language: tl
  text: Nagsasalita si Job nang walang kaalaman, at ang mga salita niya ay walang pagkaunawa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְדַעַת
  choice: nang walang kaalaman
  rationale: Ipinahahayag ng בְּ kasama ng abstraktong pangngalan ang paraan o katangian ng pagsasalita. Likas sa modernong Tagalog ang “nang walang kaalaman” at malinaw nitong ipinakikita ang kakulangan sa kaalaman.
- source_word: יְדַבֵּר
  choice: nagsasalita
  rationale: Ang imperfect dito ay pinakamainam unawain bilang kasalukuyang paglalarawan sa pananalita ni Job, hindi bilang panghinaharap.
- source_word: דְבָרָיו
  choice: ang mga salita niya
  rationale: Tuwirang tinutumbasan nito ang pangmaramihang דְּבָרָיו habang nananatiling natural at madaling maunawaan.
- source_word: בְהַשְׂכֵּיל
  choice: walang pagkaunawa
  rationale: Ang ugat na שׂכל ay tumutukoy sa pag-unawa o pagkakaroon ng wastong kabatiran. Pinananatili ng “pagkaunawa” ang paralelismo sa “kaalaman” nang hindi nagdaragdag ng ideya ng isang partikular na uri ng karunungan.
- source_word: לֹא
  choice: walang
  rationale: Bagaman literal na negasyon ang לֹא, ang “walang” ang likas na Tagalog sa dalawang pariralang nagsasaad ng kakulangan sa kaalaman at pagkaunawa.
