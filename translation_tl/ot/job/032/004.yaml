translation_notes:
  register: Modernong Filipino na may marangal na tonong pampanitikan. Ginamit ang “sapagkat” para sa malinaw ngunit dignified na ugnayang sanhi. Iniwasan ang sobrang literal na “sa mga araw” sa pangunahing teksto dahil hindi ito likas na pagpapahayag ng edad sa Filipino; inilagay ang detalye sa talababa.
