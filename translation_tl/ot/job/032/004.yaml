  text: Elihu had waited to speak to Job[b][a], because they were older than he in days.
translation:
  language: tl
  text: At naghintay si Elihu bago magsalita kay Job[a], sapagkat mas matanda sila kaysa sa kaniya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “naghintay si Elihu kay Job sa mga salita”; ang diwa ay naghintay siya bago magsalita kay Job.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “sapagkat mas matanda sila kaysa sa kaniya sa mga araw”; idyoma ito na nangangahulugang mas matanda sila sa edad.
    reason: lexical_alternative
lexical_decisions:
- source_word: וֶאֱלִיהוּ
  choice: At si Elihu
  rationale: Isinalin ang waw bilang “At” upang mapanatili ang payak na pagkakaugnay sa naunang salaysay nang hindi nagdaragdag ng tahasang panandang temporal.
- source_word: חִכָּה
  choice: naghintay
  rationale: Ang pandiwa ay nangangahulugang maghintay o magtagal. Sapat ang aspektong naganap sa Filipino; hindi kailangang artipisyal na tumbasan ang English past perfect.
- source_word: אֶת אִיּוֹב בִּדְבָרִים
  choice: na magsalita kay Job
  rationale: Ang literal na ayos ay humigit-kumulang “naghintay kay Job sa mga salita,” ngunit ipinahihiwatig ng idyoma at konteksto na naghintay siyang magsalita kay Job.
- source_word: כִּי
  choice: sapagkat
  rationale: Tuwirang ipinapahayag ang sanhi ng paghihintay ni Elihu.
- source_word: זְקֵנִים הֵמָּה מִמֶּנּוּ
  choice: mas matanda sa kaniya ang mga iyon
  rationale: Ang pang-uri ay tumutukoy sa paghahambing ng edad, hindi sa katungkulan ng mga “matatanda” o elders. Ang “mga iyon” ay nagpapanatili sa pangmaramihang reperensiya ng הֵמָּה.
- source_word: לְיָמִים
  choice: sa edad
  rationale: Idyoma itong literal na tumutukoy sa “mga araw,” ngunit ang likas at malinaw na kahulugan sa modernong Filipino ay edad.
