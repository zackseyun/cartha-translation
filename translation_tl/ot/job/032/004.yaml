  source_fidelity: Napananatili ng draft ang sanhi at ang paghahambing ng edad. Gayunman, ang “mga iyon” ay hindi likas na katumbas ng panghalip na “sila” sa daloy ng salaysay, at ang “naghintay ... na magsalita” ay maaaring magpahiwatig ng layunin sa halip na ng paghihintay bago magsalita. Ang “bago magsalita” ay mas malinaw na naghahatid ng idyomatikong diwa ng Hebreo sa kontekstong ito.
  naturalness: Mas natural sa modernong Filipino ang “mas matanda sila kaysa sa kaniya” kaysa “mas matanda sa kaniya ang mga iyon.” Ang “At” ay katanggap-tanggap na pagsasalin ng waw at ang “sapagkat” ay angkop sa marangal na pampanitikang rehistro.
  terminology: Wasto ang pangalang “Elihu” at “Job.” Wasto ang “mas matanda” para sa paghahambing ng edad; hindi ito dapat gawing “mga matatanda” sa kahulugang katungkulan. Ang idyomang “sa mga araw” ay mas mabuting ipaliwanag sa talababa kaysa piliting ilagay sa pangunahing teksto.
