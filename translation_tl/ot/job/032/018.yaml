  text: כִּ֭י מָלֵ֣תִי מִלִּ֑ים הֱ֝צִיקַ֗תְ/נִי ר֣וּחַ בִּטְנִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/job/032/018.yaml
  text: For I am full of words[a]; the spirit within me constrains me.
translation:
  language: tl
  text: 'Sapagkat punô ako ng mga salita;

    nanggigipit sa akin ang espiritu sa aking kalooban.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal na, “ang espiritu sa aking tiyan” o “ang espiritu sa aking mga panloob na bahagi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikita ang sanhi o paliwanag kung bakit kailangang magsalita ni Elihu.
- source_word: מָלֵתִי מִלִּים
  choice: punô ako ng mga salita
  rationale: Pinananatili ang kongkretong larawan ng taong hitik sa mga salitang nais niyang sabihin, sa natural na modernong Tagalog.
- source_word: הֱצִיקַתְנִי
  choice: nanggigipit sa akin
  rationale: Ipinahahayag ng pandiwa ang patuloy na panloob na pagdiin o pamimilit nang hindi nilulutas kung ito ay simpleng pagkabalisa o udyok na magsalita.
- source_word: רוּחַ
  choice: ang espiritu
  rationale: Pinananatili ang malawak at posibleng malabong saklaw ng רוּחַ bilang panloob na espiritu o udyok, sa halip na gawing tahasang banal na Espiritu o hininga.
- source_word: בִּטְנִי
  choice: sa aking kalooban
  rationale: Ang literal na 'tiyan ko' ay tumutukoy rito sa panloob na pagkatao; natural na ipinahahayag ito ng 'kalooban,' habang inilalagay sa talababa ang mas literal na larawan.
theological_decisions:
- issue: Ang pagkakakilanlan ng רוּחַ
  choice: espiritu
  alternative: Espiritu ng Diyos / hininga / udyok
  rationale: Walang tahasang pagtukoy sa Diyos sa talata. Kaya hindi ginawang 'Espiritu ng Diyos' at pinanatili ang tunay na kalabuan kung ito ay espiritu, panloob na lakas, o udyok ni Elihu.
translation_notes:
  register: Makabago at marangal na Filipino. Ginamit ang “punô ako ng mga salita” upang mapanatili ang matinding larawang Hebreo, at “nanggigipit” upang ipahiwatig ang panloob na presyur nang hindi labis na nagpapaliwanag.
