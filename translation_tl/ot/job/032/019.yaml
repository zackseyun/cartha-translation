base_translation:
  language: en
  yaml_path: translation/ot/job/032/019.yaml
  text: Look[a], my belly is like wine that has no vent[b]; like new wineskins it is about to burst.
translation:
  language: tl
  text: Narito, ang tiyan ko ay parang alak na walang labasan[a]; gaya ng mga bagong sisidlang-balat[b], malapit na itong pumutok.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa literal: “parang alak na hindi nabubuksan.” Maaari ring unawain ang “tiyan ko” bilang “kaloob-looban ko.”'
    reason: lexical_alternative
  - marker: b
    text: Ang mga sisidlang-balat ay lalagyang yari sa balat ng hayop na ginagamit noon para sa mga likido, lalo na sa alak.
    reason: cultural_note
lexical_decisions:
- source_word: הִנֵּה
  choice: Narito
  rationale: Pinupukaw ng katagang ito ang pansin sa matinding paghahambing ni Elihu. Likas at marangal sa modernong Filipino ang “Narito.”
- source_word: בִטְנִי
  choice: ang tiyan ko
  rationale: Tuwirang tumutukoy ang בטן sa tiyan ngunit maaari ring katawanin ang kaloob-looban. Pinananatili ng “tiyan ko” ang kongkreto at metaporikal na larawan ng naiipong presyon.
- source_word: כְּיַיִן
  choice: parang alak
  rationale: Payak na paghahambing ito sa alak. Hindi idinagdag ang “umuumbok” o “umaasim” sapagkat hindi tahasang sinasabi iyon sa Hebreo.
- source_word: לֹא יִפָּתֵחַ
  choice: na walang labasan
  rationale: Literal itong “hindi nabubuksan,” ngunit sa larawan ay alak na hindi mailabas o mapasingawan. Malinaw sa Filipino ang “walang labasan” nang hindi inaalis ang literal na alternatibo sa talababa.
- source_word: כְּאֹבוֹת חֲדָשִׁים
  choice: gaya ng mga bagong sisidlang-balat
  rationale: Ang אֹבוֹת dito ay mga sisidlang yari sa balat na ginagamit sa mga likido, lalo na sa alak; ang חֲדָשִׁים ay “bago.” Ang tambalang “sisidlang-balat” ay malinaw at hindi ipinagkakamali sa modernong bote.
- source_word: יִבָּקֵעַ
  choice: malapit na itong pumutok
  rationale: Ang pandiwa ay nangangahulugang mabiyak o pumutok. Ipinahihiwatig ng konteksto ang matinding presyong nalalapit nang humantong sa pagputok.
