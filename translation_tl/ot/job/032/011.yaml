  text: Look[a], I waited for your words; I listened to your insights[c][b], until you searched out words.
translation:
  language: tl
  text: Narito[a], hinintay ko ang inyong mga salita; nakinig ako sa inyong mga pangangatwiran[b], hanggang sa magsaliksik kayo ng mga salita.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Tunay nga” o “Masdan.” Ginagamit ang salitang Hebreo upang tawagin ang pansin sa sumusunod na pahayag.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “inyong pagkaunawa,” “mga kabatiran,” o “mga katuwiran.”
    reason: lexical_alternative
  - marker: c
    text: 'Sa mas literal: “hanggang sa saliksikin ninyo ang mga salita.” Masinsin at medyo idyomatiko ang parirala sa tulang Hebreo; maaari itong tumukoy sa paghahanap o pagsusuri nila ng mga salitang isasagot.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Narito
  rationale: Pantawag-pansin ito sa diskurso. Ang “Narito” ay marangal at malinaw sa makabagong Filipino nang hindi kasintanda ng ibang posibleng anyo.
- source_word: הוֹחַלְתִּי
  choice: hinintay ko
  rationale: Ang יחל ay maaaring mangahulugang maghintay o umasa. Sa konteksto, idinidiin ni Elihu na nagpigil siya habang nagsasalita ang iba, kaya “hinintay ko” ang pinakamalinaw.
- source_word: לְדִבְרֵיכֶם
  choice: ang inyong mga salita
  rationale: Likas na katambal ng “hinintay” sa Filipino at pinananatili ang tahasang pagtukoy sa kanilang sinabi.
- source_word: אָזִין
  choice: nakinig ako
  rationale: Ipinahihiwatig ng anyong Hiphil ang masusing pakikinig. Sapat na natural at malinaw ang “nakinig ako” sa konteksto.
- source_word: תְּבוּנוֹתֵיכֶם
  choice: inyong mga pang-unawa
  rationale: Maaaring tumukoy ang pangmaramihang תבונות sa pagkaunawa, mga kabatiran, o mga pangangatwiran. Pinananatili ng “mga pang-unawa” ang lawak at bahagyang di-tiyak na kahulugan ng Hebreo.
- source_word: עַד
  choice: habang
  rationale: Bagaman karaniwang “hanggang,” ang parirala rito ay maaaring ilarawan ang patuloy na pakikinig habang sinisikap nilang makahanap ng sasabihin. Mas natural sa Filipino ang “habang,” samantalang nililinaw sa talababa ang mas literal na pagbasa.
- source_word: תַּחְקְרוּן
  choice: naghahanap kayo
  rationale: Ang חקר ay paghahanap o masusing pagsisiyasat. Sa pagsama sa מִלִּין, natural na ipinapahayag nito ang pagsisikap nilang makahanap ng angkop na pananalita.
- source_word: מִלִּין
  choice: mga salitang sasabihin
  rationale: Literal itong “mga salita,” ngunit sa masinsing pariralang patula ay tumutukoy sa mga salitang hinahanap upang maipahayag ang sagot. Ang maikling paglilinaw ay nagbibigay ng natural na Filipino nang hindi ginagawang tiyak na “mga argumento.”
