  rationale: Ibinalik ang “hanggang sa” upang tumpak na katawanin ang עַד. Pinalitan ang hindi likas na “mga pang-unawa” ng “mga pangangatwiran,” na mas natural at angkop sa diskursong pinakikinggan ni Elihu. Pinanatiling “mga salita” ang huling parirala upang huwag gawing sobrang tiyak ang ipinahihiwatig na sagot o argumento; ang posibleng paliwanag ay nasa talababa.
