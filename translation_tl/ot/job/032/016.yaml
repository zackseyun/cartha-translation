  text: And I waited[a], because they did not speak[b], because they stood still and answered no more.
translation:
  language: tl
  text: At naghintay ako[a], sapagkat hindi sila nagsalita, sapagkat tumigil sila[b] at hindi na sumagot.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “At umasa ako,” sapagkat ang pandiwa ay maaaring mangahulugan ng paghihintay na may inaasahan; mas angkop dito ang “naghintay.”
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “tumayo sila”; sa konteksto, malamang na nangangahulugan itong huminto sila at nanatiling tahimik.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹחַלְתִּי
  choice: At naghintay ako
  rationale: Ang Hiphil perfect na unang panauhan ng יחל ay maaaring tumukoy sa paghihintay na may inaasahan, ngunit sa konteksto ay ipinagpaliban ni Elihu ang pagsasalita habang hinihintay ang matatandang lalaki; kaya natural at angkop ang “naghintay.”
- source_word: כִּי ... כִּי
  choice: sapagkat ... sapagkat
  rationale: Pinananatili ang dalawang magkatulad na panandang sanhi upang maipakita ang paulit-ulit na paliwanag sa paghihintay ni Elihu.
- source_word: לֹא יְדַבֵּרוּ
  choice: hindi sila nagsalita
  rationale: Bagaman imperfect ang pandiwa sa Hebreo, ang konteksto ng salaysay ay tumutukoy sa kanilang hindi pagsasalita habang naghihintay si Elihu.
- source_word: עָמְדוּ
  choice: tumigil sila
  rationale: Literal itong “tumayo sila,” ngunit sa konteksto ng pagtatalo ay idyoma itong nagpapahiwatig na huminto sila sa pagsasalita. Ang “tumigil” ay malinaw at natural sa modernong Tagalog.
- source_word: לֹא עָנוּ עוֹד
  choice: hindi na sumagot
  rationale: Ipinahihiwatig ng עוֹד kasunod ng negasyon na natapos na ang kanilang pagsagot; tuwiran at likas sa Tagalog ang “hindi na sumagot.”
