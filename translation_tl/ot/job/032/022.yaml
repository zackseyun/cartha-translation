  text: For I do not know how to flatter[b][a]; otherwise my Maker would soon carry me away.
translation:
  language: tl
  text: Sapagkat hindi ako marunong mambola[a]; kung gagawin ko iyon, agad akong kukunin ng Maylalang ko.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “magbigay ng mga titulong mapuri.” Maaaring tumukoy ang pandiwang Hebreo sa pagtawag sa isang tao gamit ang mga titulong nagpaparangal sa paraang pambobola o may pagtatangi.
    reason: lexical_alternative
  - marker: b
    text: O “agad akong aalisin ng Maylalang ko.” Hindi tahasang sinasabi ng Hebreo na “papatayin ako,” bagaman maaaring ipinahihiwatig ang pag-aalis bilang paghatol.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikilala nito ang dahilan ng pagtanggi ni Elihu na magpakita ng pagtatangi sa naunang konteksto.
- source_word: לֹא יָדַעְתִּי
  choice: hindi ako marunong
  rationale: Kasama ng kasunod na pandiwa, ipinahihiwatig ng parirala ang kawalan ng kakayahan o nakasanayang kasanayan; natural itong pakinggan sa makabagong Tagalog.
- source_word: אֲכַנֶּה
  choice: mambola
  rationale: Sa konteksto ng pagtatangi at pagpapalugod sa tao, malinaw at maikli nitong ipinahahayag ang negatibong panlipunang diwa. Posible rin ang mas literal na ideya ng pagtawag sa iba sa mga titulong mapuri.
- source_word: כִּמְעַט
  choice: agad
  rationale: Sa babalang ito, nagpapahiwatig ang parirala ng nalalapit na kahihinatnan, hindi lamang ng pagtatantiya.
- source_word: יִשָּׂאֵנִי
  choice: kukunin ako
  rationale: Maaaring mangahulugan ang נשא ng buhatin, dalhin, o alisin. Pinananatili ng 'kukunin' ang pangkalahatang diwa ng pag-aalis bilang paghatol nang hindi tahasang ginagawang 'papatayin.'
- source_word: עֹשֵׂנִי
  choice: Maylalang sa akin
  rationale: Natural at marangal na katawagan ito sa Tagalog para sa 'gumawa sa akin,' at pinananatili ang personal na ugnayan ng nilalang sa lumikha.
theological_decisions:
- issue: Kalikasan ng bantang kilos ng Diyos
  choice: agad akong kukunin ng Maylalang sa akin
  alternative: agad akong papatayin ng Maylalang sa akin
  rationale: Mas malawak ang kahulugan ng נשא kaysa 'pumatay.' Maaaring ipinahihiwatig ang kamatayan bilang paghatol, ngunit hindi iyon tahasang sinasabi ng Hebreo, kaya pinananatili ang tensiyon at kalabuan.
translation_notes:
  register: Makabago, dignified, at madaling maunawaang Tagalog. Ginamit ang karaniwang 'mambola' sa halip na mas mabigat na parirala, habang inilagay sa talababa ang mas literal na alternatibo. Ang 'Maylalang sa akin' ay marangal ngunit malinaw sa ordinaryong mambabasa.
