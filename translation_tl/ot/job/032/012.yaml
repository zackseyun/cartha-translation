translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “Pinakinggan ko kayong mabuti” bilang natural na pananalita, at ang “nakapagpabulaan” upang mapanatili ang konteksto ng pormal na pagtatalo. Ang mga tunay na leksikal na alternatibo ay inilagay sa mga talababa.
