  text: I paid close attention to you[a], and behold, there was no one among you to refute Job[b], to answer his words.
translation:
  language: tl
  text: Pinakinggan ko kayong mabuti[a], at narito, wala ni isa sa inyo ang nakapagpabulaan kay Job[b] sa pamamagitan ng pagsagot sa kanyang mga sinabi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Binigyan ko kayo ng buong pansin.” Ang pandiwang Hebreo ay tumutukoy sa maingat na pagsasaalang-alang o masusing pagmamasid.
    reason: lexical_alternative
  - marker: b
    text: O “nakapagtuwid kay Job” o “nakasaway kay Job.” Ang salitang Hebreo ay maaaring tumukoy sa pagpapabulaan sa isang argumento, pagtutuwid, o pagsaway.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָדֵיכֶם אֶתְבּוֹנָן
  choice: Pinakinggan ko kayong mabuti
  rationale: Ang hitpolel ng בין, kasama ng pariralang nakatuon sa mga kausap, ay nagpapahiwatig ng masusing pagbibigay-pansin. Sa konteksto ng talakayan, likas sa Filipino ang “pinakinggan ... mabuti” at malinaw na ipinahihiwatig ang maingat na pagsasaalang-alang.
- source_word: וְהִנֵּה
  choice: ngunit
  rationale: Dito, ipinakikilala ng וְהִנֵּה ang kapansin-pansing resulta ng maingat na pakikinig ni Elihu. Ang “ngunit” ay natural na naghahatid ng retorikal na paglipat at pagsalungat sa Filipino, bagaman hindi nito literal na inuulit ang larawang “masdan.”
- source_word: אֵין לְאִיּוֹב מוֹכִיחַ
  choice: wala ni isa ... ang nakapagpabulaan kay Job
  rationale: Ang מוֹכִיחַ mula sa יכח ay maaaring tumukoy sa taong sumasalungat sa pangangatwiran, nagpapatunay na mali, o sumasaway. Sa konteksto ng pagtatalo, “nakapagpabulaan” ang malinaw na naghahatid ng ideya ng matagumpay na pagsalungat, habang iniingatan sa talababa ang mas malawak na saklaw.
- source_word: עוֹנֶה אֲמָרָיו
  choice: nakasagot sa kanyang mga sinabi
  rationale: Natural na ipinahahayag nito sa modernong Filipino ang pagsagot sa mga pahayag ni Job at nananatiling malapit sa konstruksiyong Hebreo.
- source_word: מִכֶּם
  choice: ni isa sa inyo
  rationale: Sa negatibong pangungusap, idiomatiko at eksakto ang “wala ni isa sa inyo” para sa pinagmulan mula sa pangkat ng mga kausap.
