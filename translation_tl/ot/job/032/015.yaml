  text: They are dismayed[a]; they answer no more[b]; words have departed from them.
translation:
  language: tl
  text: Nabagabag sila[a]; hindi na sila sumasagot; iniwan na sila ng mga salita.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Nanglupaypay sila,” “Nasindak sila,” o “Nalito sila”; ang pandiwang Hebreo ay maaaring tumukoy sa pagkadurog, pagkasindak, o matinding pagkabagabag.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “lumayo sa kanila ang mga salita”—isang masining na paraan ng pagsasabing wala na silang masabi.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַתּוּ
  choice: Nabagabag sila
  rationale: Ang pandiwang חתת ay maaaring magpahiwatig ng pagkawasak, pagkalito, o matinding panghihina ng loob. Sa konteksto, natigilan at natahimik ang mga kaibigan ni Job; natural na ipinahahayag ng “nabagabag” ang kanilang pagkalito at panghihina nang hindi labis na pinatitindi ang kahulugan.
- source_word: עָנוּ
  choice: sila sumasagot
  rationale: Ang ענה rito ay tumutukoy sa pagsagot sa isang pagtatalo o talakayan; ang “sumasagot” ang tuwiran at natural na katumbas.
- source_word: לֹא ... עוֹד
  choice: hindi na
  rationale: Kasama ng negasyon, ipinahihiwatig ng עוֹד na tumigil na ang dating nagpapatuloy; maikli at likas sa Tagalog ang “hindi na.”
- source_word: הֶעְתִּיקוּ מֵהֶם
  choice: iniwan na sila
  rationale: Ang Hiphil ng עתק na may מֵהֶם ay naglalarawan ng paglayo o pag-alis mula sa kanila. Sa pariralang ang simuno ay “mga salita,” pinananatili ng “iniwan na sila” ang matingkad na personipikasyon ng Hebreo.
- source_word: מִלִּים
  choice: mga salita
  rationale: Pinananatili ang pangunahing kahulugang “mga salita” sa halip na ipaliwanag bilang “mga argumento” o “masasabi,” upang mapanatili ang larawan sa Hebreo.
