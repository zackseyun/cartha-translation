base_translation:
  language: en
  yaml_path: translation/ot/job/032/009.yaml
  text: It is not the many who are wise[a], nor the old who understand justice.
translation:
  language: tl
  text: 'Hindi ang marami ang marurunong,

    ni ang matatanda ang nakauunawa kung ano ang matuwid.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “katarungan” o “hatol.” Ang salitang Hebreo na mishpat ay maaaring tumukoy sa hatol na legal, katarungan, o sa kung ano ang matuwid.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא
  choice: Hindi
  rationale: Tuwirang ipinapahayag ang mariing pagtanggi sa kasunod na pangkalahatang pahayag.
- source_word: רַבִּים
  choice: ang marami
  rationale: Ginagamit ang pang-uri bilang pangngalan para tumukoy sa maraming tao; hindi ipinapalagay na ang kahulugan ay mga dakila o makapangyarihan.
- source_word: יֶחְכָּמוּ
  choice: ang marurunong
  rationale: Sa ganitong pangkalahatang pahayag, likas na ipinapahayag sa Filipino ang kalagayan ng pagiging marunong, hindi kinakailangang ang proseso ng pagiging marunong.
- source_word: וּזְקֵנִים
  choice: ni ang matatanda
  rationale: Ang pagtukoy ay nakabatay sa edad, hindi sa katungkulan ng mga 'matatanda' o elder; ang 'ni' ay natural na nagdurugtong sa ikalawang sugnay sa saklaw ng pagtanggi.
- source_word: יָבִינוּ
  choice: nakauunawa
  rationale: Tumutugma sa diwa ng pag-unawa o pagkilala nang may discernment at nagpapanatili ng kasalukuyang pangkalahatang pahayag.
- source_word: מִשְׁפָּט
  choice: kung ano ang matuwid
  rationale: Ipinahahayag ang moral at hudisyal na diwa ng mishpat sa natural na Filipino, habang kinikilala sa talababa ang mga posibleng saling 'katarungan' at 'hatol.'
