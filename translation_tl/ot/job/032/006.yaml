base_translation:
  language: en
  yaml_path: translation/ot/job/032/006.yaml
  text: Then Elihu son of Barakel the Buzite answered and said[a], “I am young in days, and you are aged[b]; therefore I was timid and afraid to declare my knowledge to you.
translation:
  language: tl
  text: Si Elihu, anak ni Barakel na Buzita, ay sumagot at nagsabi, “Bata pa ako[a], samantalang matatanda na kayo. Kaya nangimi ako at natakot na ipahayag sa inyo ang nalalaman ko.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “bata sa mga araw,” isang idyomang tumutukoy sa pagiging bata sa edad.
    reason: cultural_note
  - marker: b
    text: Maaari ring isalin, “umurong ako at natakot na ipahayag sa inyo ang nalalaman ko.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמַר
  choice: Sumagot ...
  rationale: Ang karaniwang pormula sa pagsisimula ng isang talumpati ay likas na naipapahayag sa Filipino sa pamamagitan ng “Sumagot,” nang hindi ipinahihiwatig na may tuwirang tanong na nauna.
- source_word: אֱלִיהוּא בֶן בַּרַכְאֵל הַבּוּזִי
  choice: si Elihu na anak ni Barakel na Buzita
  rationale: Isinatinig ang mga pangalang pantangi, at isinalin ang katawagang pangkat o angkan na הַבּוּזִי bilang “Buzita.”
- source_word: צָעִיר אֲנִי לְיָמִים
  choice: Bata pa ako
  rationale: Natural na Filipino ito para sa idyomang Hebreo na literal na “bata sa mga araw,” habang pinananatili ang paghahambing ng edad.
- source_word: וְאַתֶּם יְשִׁישִׁים
  choice: samantalang matatanda na kayo
  rationale: Ipinahahayag ng יְשִׁישִׁים ang katandaan o katandaan sa gulang; ang “samantalang” ay malinaw na naghaharap ng kaibahan kay Elihu.
- source_word: עַל כֵּן
  choice: Kaya
  rationale: Natural at malinaw na panandang Filipino ng bunga o lohikal na kahihinatnan.
- source_word: זָחַלְתִּי
  choice: nag-atubili ako
  rationale: Sinasaklaw nito ang diwa ng pag-urong o pag-aatubiling magsalita dahil sa pagkamahiyain o pangamba.
- source_word: וָאִירָא
  choice: at natakot
  rationale: Pinananatili ang ikalawang pandiwang tumitindi sa pag-aatubili ni Elihu.
- source_word: מֵחַוּוֹת דֵּעִי אֶתְכֶם
  choice: na sabihin sa inyo ang nalalaman ko
  rationale: Ang “sabihin” ay likas na katumbas ng pagpapahayag o pagpapaalam, at ang “ang nalalaman ko” ay malinaw na modernong Filipino para sa literal na “aking kaalaman.”
