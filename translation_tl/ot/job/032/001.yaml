  text: וַֽ/יִּשְׁבְּת֡וּ שְׁלֹ֤שֶׁת הָ/אֲנָשִׁ֣ים הָ֭/אֵלֶּה מֵ/עֲנ֣וֹת אֶת אִיּ֑וֹב כִּ֤י ה֖וּא צַדִּ֣יק בְּ/עֵינָֽי/ו־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/job/032/001.yaml
  text: So these three men stopped answering Job[a], because he was righteous in his own eyes.
translation:
  language: tl
  text: Kaya tumigil sa pagsagot kay Job[a] ang tatlong lalaking ito, sapagkat matuwid siya sa sarili niyang paningin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, ayon sa ibang tradisyon ng teksto, “sapagkat matuwid siya sa paningin nila.”
    reason: textual_variant
lexical_decisions:
- source_word: וַיִּשְׁבְּתוּ
  choice: tumigil
  rationale: Ang pandiwang שבת dito ay nangangahulugang huminto o tumigil; kasunod ng מֵעֲנוֹת, likas sa modernong Tagalog ang “tumigil sa pagsagot.”
- source_word: שְׁלֹשֶׁת הָאֲנָשִׁים הָאֵלֶּה
  choice: ang tatlong lalaking ito
  rationale: Tuwirang inililipat ang bilang, panlalaking pangngalan, at demonstratibo; ang tinutukoy ay ang tatlong kaibigan ni Job.
- source_word: מֵעֲנוֹת
  choice: sa pagsagot
  rationale: Ang ענה ay “sumagot” o “tumugon”; ang anyong “sa pagsagot” ay natural na kapupunan ng “tumigil.”
- source_word: אֶת אִיּוֹב
  choice: kay Job
  rationale: Hindi isinasalin nang hiwalay ang direct-object marker na אֶת; ginagamit ang “kay” dahil pangalan ng tao ang layon ng pagsagot.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala nito ang dahilan ng kanilang pagtigil. Ang “sapagkat” ay malinaw at marangal ngunit nauunawaan pa rin sa kasalukuyang Filipino.
- source_word: צַדִּיק
  choice: matuwid
  rationale: Pinananatili ng “matuwid” ang moral at panghatol na diwa ng צַדִּיק at karaniwan ito sa wikang biblikal na Filipino.
- source_word: בְּעֵינָיו
  choice: sa sarili niyang paningin
  rationale: Ang panlaping panghalip sa ibinigay na tekstong Hebreo ay ikatlong panauhang panlalaki na isahan. Likas na ipinahahayag sa Filipino ng “sa sarili niyang paningin” ang pansariling pagtataya.
theological_decisions:
- issue: Kung ipinahahayag bang talagang matuwid si Job o matuwid lamang ayon sa sarili niyang pagtataya
  choice: “matuwid siya sa sarili niyang paningin”
  alternative: “matuwid siya sa paningin nila”
  rationale: Ang ibinigay na tekstong Masoretiko ay may isahang hulaping panghalip, “sa paningin niya.” Hindi nito pinatutunayang obhetibong tama ang pagtataya ni Job; pinananatili nito ang tensiyong salaysay. Inilalagay sa talababa ang ibang tradisyon ng teksto.
translation_notes:
  register: Modernong Filipino na may marangal na himig. Ginamit ang “tumigil sa pagsagot” bilang likas na parirala at “matuwid” upang mapanatili ang moral-panghatol na bigat ng Hebreo. Ang panandang [a] ay inilagay agad pagkatapos ng “Job,” ayon sa ibinigay na konsultasyong teksto.
