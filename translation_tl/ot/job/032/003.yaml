base_translation:
  language: en
  yaml_path: translation/ot/job/032/003.yaml
  text: And his anger burned against his three friends because they had found no answer[a], yet they had condemned Job.
translation:
  language: tl
  text: At nag-alab ang galit niya sa kanyang tatlong kaibigan, sapagkat wala silang mahanap na sagot, ngunit hinatulan nila si Job.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ipinahayag nilang may sala si Job” o “itinuring nilang masama si Job.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִשְׁלֹשֶׁת רֵעָיו
  choice: sa kanyang tatlong kaibigan
  rationale: Sa idyomang חרה אף, ang ב ay tumutukoy sa pinatutungkulan ng galit. Likas sa Filipino ang “sa kanyang tatlong kaibigan” at malinaw ang ugnayan.
- source_word: חָרָה אַפּוֹ
  choice: nag-alab ang galit niya
  rationale: Pinananatili nito ang metapora ng Hebreong idyoma para sa matinding galit nang hindi isinasalin nang malabo ang literal na larawan ng nag-iinit na ilong.
- source_word: עַל אֲשֶׁר
  choice: sapagkat
  rationale: Ipinakikilala ng parirala ang dahilan ng kanyang galit; ang “sapagkat” ay maikli, malinaw, at marangal sa modernong Filipino.
- source_word: לֹא מָצְאוּ מַעֲנֶה
  choice: hindi sila nakahanap ng sagot
  rationale: Ang מַעֲנֶה ay maaaring “sagot” o “tugon.” Ang “sagot” ay natural sa konteksto ng pagtatalo at hindi nagdaragdag ng paliwanag.
- source_word: וַיַּרְשִׁיעוּ
  choice: hinatulan nila
  rationale: Ang Hiphil ng רשע ay karaniwang nangangahulugang magpahayag na may sala o humatol. Ang “hinatulan” ay nagpapanatili sa aspektong panghukuman nang hindi pinalalakas ang pahayag.
- source_word: וַ
  choice: gayunma’y
  rationale: 'Bagaman karaniwang pang-ugnay ang waw, dito ay may lohikal na pagsalungat: wala silang sagot ngunit hinatulan pa rin nila si Job. Ipinahahayag ng “gayunma’y” ang ugnayang ito.'
theological_decisions:
- issue: Ang kahulugan ng ginawa ng mga kaibigan kay Job
  choice: hinatulan nila si Job
  alternative: itinuring nilang masama si Job / ipinahayag nilang may sala si Job
  rationale: Ang anyong Hiphil ng רשע ay may likas na deklaratibo o panghukumang diwa sa ganitong pagtatalo. Hindi nito nilulutas nang lampas sa teksto kung ang diin ay nasa pormal na paghatol o sa pagturing kay Job bilang masama; inilalahad sa talababa ang mga posibleng diwa.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Pinanatili ang metaporang “nag-alab ang galit,” habang ginawang natural ang Hebreong idyoma at ang pagsalungat sa hulihan ng pangungusap.
