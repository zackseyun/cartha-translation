  text: וַ/יִּ֤חַר אַ֨ף אֱלִיה֣וּא בֶן בַּרַכְאֵ֣ל הַ/בּוּזִי֮ מִ/מִּשְׁפַּ֪חַ֫ת רָ֥ם בְּ֭/אִיּוֹב חָרָ֣ה אַפּ֑/וֹ עַֽל צַדְּק֥/וֹ נַ֝פְשׁ֗/וֹ מֵ/אֱלֹהִֽים׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/032/002.yaml
  text: Then Elihu son of Barakel the Buzite[a], from the family of Ram, burned with anger against Job; his anger burned because he justified himself rather than God.
translation:
  language: tl
  text: At nag-alab sa galit kay Job si Elihu na anak ni Barakel na Buzita, mula sa angkan ni Ram. Nag-alab ang galit niya dahil itinuring ni Job na matuwid ang sarili niya sa halip na ang Diyos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “dahil itinuring niyang mas matuwid ang sarili niya kaysa sa Diyos.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּחַר אַף
  choice: nag-alab sa galit
  rationale: Pinananatili ang larawang Hebreo ng nag-aapoy na galit habang natural at marangal sa makabagong Tagalog.
- source_word: אֱלִיהוּא בֶן בַּרַכְאֵל
  choice: si Elihu na anak ni Barakel
  rationale: Tuwirang isinasalin ang pangalang pantangi at ugnayang genealogical ayon sa karaniwang anyong Filipino.
- source_word: הַבּוּזִי
  choice: na Buzita
  rationale: Ginagamit ang natural na katawagang Filipino para sa kasapi ng isang bayan o lipi.
- source_word: מִמִּשְׁפַּחַת רָם
  choice: mula sa angkan ni Ram
  rationale: Mas angkop ang “angkan” kaysa “pamilya” para sa mas malawak na pangkat na tinutukoy ng מִשְׁפָּחָה.
- source_word: בְּאִיּוֹב
  choice: kay Job
  rationale: Sa pandiwa ng pagkagalit, ang בְּ ay tumutukoy sa pinag-uukulan ng galit; natural itong ipahayag sa Tagalog sa pamamagitan ng “kay.”
- source_word: חָרָה אַפּוֹ
  choice: Nag-alab ang galit niya
  rationale: Pinananatili ang pag-uulit at matinding larawang nasa Hebreo.
- source_word: עַל
  choice: dahil
  rationale: Ipinakikilala rito ng עַל ang sanhi ng galit ni Elihu.
- source_word: צַדְּקוֹ נַפְשׁוֹ
  choice: itinuring ni Job na matuwid ang sarili niya
  rationale: Ipinahahayag ang forensic o deklaratibong diwa ng צִדֵּק, habang ang נַפְשׁוֹ ay likas na isinasaling reflexive bilang “ang sarili niya.” Inulit ang pangalang Job upang luminaw ang paksa sa Tagalog.
- source_word: מֵאֱלֹהִים
  choice: sa halip na ang Diyos
  rationale: 'Ipinakikita ang paghahambing o pagtutunggali: ang pag-aakalang nasa tama si Job ay nauuna sa pagbibigay-katuwiran sa Diyos, nang hindi lubusang nilulutas ang mahirap na konstruksyong Hebreo.'
theological_decisions:
- issue: Diwa ng עַל צַדְּקוֹ נַפְשׁוֹ מֵאֱלֹהִים
  choice: dahil itinuring ni Job na matuwid ang sarili niya sa halip na ang Diyos
  alternative: dahil itinuring niyang mas matuwid ang sarili niya kaysa sa Diyos
  rationale: Pinananatili ng pangunahing salin ang paghahambing at teolohikal na tensiyon nang hindi tahasang ipinapalagay na nag-angkin si Job ng pangkalahatang moral na kahigitan sa Diyos. Inilalagay sa talababa ang mas matinding posibleng pagbasa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang dalawang pagbanggit sa pag-alab ng galit upang katawanin ang diin at pag-uulit ng Hebreo.
