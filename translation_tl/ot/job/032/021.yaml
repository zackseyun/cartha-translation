translation:
  language: tl
  text: Huwag nawa akong magpakita ng pagtatangi kaninuman, ni magbigay ng mapamuring titulo kaninuman.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַל נָא
  choice: Huwag nawa akong
  rationale: Pinananatili ng “huwag nawa” ang magalang ngunit taimtim na negatibong kahilingan o hangarin na ipinahahayag ng אַל נָא.
- source_word: אֶשָּׂא פְנֵי אִישׁ
  choice: magtangi ng sinumang tao
  rationale: Ang literal na “itaas ang mukha ng isang tao” ay idyomang Hebreo para sa pagpapakita ng pagkiling o pagtatangi. Natural at malinaw sa modernong Filipino ang “magtangi.”
- source_word: אִישׁ
  choice: sinumang tao
  rationale: Bagaman panlalaking pangngalan ang אִישׁ, pangkalahatan ang gamit nito rito; ipinahahayag ng “sinumang tao” ang di-tiyak at pangkalahatang saklaw nang hindi nagdaragdag ng kahulugan.
- source_word: וְאֶל אָדָם
  choice: ni ... ang sinuman
  rationale: Ang אָדָם ay tumutukoy sa isang tao at kapantay ng אִישׁ sa unang hati. Ang “ni ... ang sinuman” ay natural na nagpapanatili sa negatibong paralelismo.
- source_word: לֹא אֲכַנֶּה
  choice: bolahin
  rationale: Sa konteksto, ang Piel ng כנה ay maaaring tumukoy sa pagbibigay ng mapamuring titulo o sa mapanuyo at labis na papuri. Ang “bolahin” ay malinaw at kasalukuyang Filipino para sa pambobola, habang inilalagay sa talababa ang mas literal na alternatibo.
