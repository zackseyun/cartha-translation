translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “huwag nawa” upang mapanatili ang taimtim na himig, “magtangi” para sa idyomang Hebreo, at “bolahin” para sa natural na pagpapahayag ng etikal na diwa; ang mas literal na posibilidad ng כנה ay iniingatan sa talababa.
