  text: Upang hindi ninyo sabihing[a], “Natagpuan na namin ang karunungan; Diyos ang magtataboy sa kanya, hindi tao.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Diyos ang sasagot sa kanya, hindi tao,” o “Diyos ang makadadaig sa kanya, hindi tao.” Karaniwang nangangahulugan ang pandiwang Hebreo na “itaboy” o “palayasin,” ngunit dito ay maaari itong tumukoy nang mas malawak sa pagdaig o pagpapabulaanan si Job.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּן
  choice: Huwag ninyong
  rationale: Nagpapahayag ito ng babala laban sa maaaring sabihin ng mga kausap; natural sa Filipino ang pautos na negatibong anyo.
- source_word: תֹּאמְרוּ
  choice: sabihin
  rationale: Ang ikalawang panauhang maramihan ay malinaw na ipinahihiwatig ng “ninyong.”
- source_word: מָצָאנוּ
  choice: Natagpuan na namin
  rationale: Pinananatili ng “na” ang diwa ng natamo nang resulta ng perpektong anyo sa Hebreo.
- source_word: חָכְמָה
  choice: karunungan
  rationale: Karaniwan at tuwirang katumbas na angkop sa marangal na rehistro.
- source_word: אֵל
  choice: Diyos
  rationale: Tumutukoy sa Diyos sa tuwirang paghahambing sa isang taong kumikilos.
- source_word: יִדְּפֶנּוּ
  choice: ang magpapalayas sa kanya
  rationale: Pinananatili ang pangunahing larawan ng pandiwang נדף, “itaboy” o “palayasin,” habang ang talab nito sa konteksto—daigin o pasinungalingan si Job—ay inilalahad sa talababa.
- source_word: לֹא אִישׁ
  choice: hindi tao
  rationale: Ipinapahayag ang pangkalahatang paghahambing ng Diyos at isang taong nilalang nang hindi nagpapahiwatig na lalaki lamang ang tinutukoy.
theological_decisions:
- issue: Pangkalahatang isahan na אִישׁ bilang katapat ng Diyos
  choice: hindi tao
  alternative: hindi isang tao; hindi lalaki
  rationale: Ang punto ay Diyos laban sa taong nilalang, hindi ang kasarian ng isang partikular na indibidwal.
- issue: Kahulugan ng אֵל יִדְּפֶנּוּ לֹא אִישׁ
  choice: Diyos ang magpapalayas sa kanya, hindi tao
  alternative: Diyos ang sasagot sa kanya, hindi tao; Diyos ang makadadaig sa kanya, hindi tao
  rationale: Ang pangunahing leksikal na diwa ay pagtataboy o pagpapalayas, ngunit maaaring tumukoy ang idyoma sa pagdaig o pagpapabulaan kay Job; pinananatili sa talababa ang tunay na kalabuan.
translation_notes:
  register: Modernong Filipino na natural at marangal. Ginamit ang “Huwag ninyong sabihin” bilang malinaw na babala, at pinanatili ang kongkretong larawan ng pandiwang Hebreo sa pangunahing teksto habang inilalahad sa talababa ang mga posibleng kontekstuwal na kahulugan.
