  text: Should it be told to him that I would speak? If a man speaks[c][b][a], surely he would be swallowed up.
translation:
  language: tl
  text: Dapat bang sabihin sa kanya na magsasalita ako? Kung magsalita ang isang tao,[a][b] tiyak na malulunok siya.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “kanya” ay tumutukoy sa Diyos ayon sa konteksto; maaari ring isulat na “Kanya.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “isang lalaki”; maaari rin itong mangahulugang “isang tao” o “sinuman” sa pangkalahatang diwa.
    reason: lexical_alternative
  - marker: c
    text: 'Mahirap unawain ang sintaks ng Hebreo sa talatang ito. Posible rin: “Dapat bang sabihin sa kanya na nagsasalita ako? O dapat bang sabihin ng isang tao na siya ay malulunok?”'
    reason: alternative_reading
lexical_decisions:
- source_word: הֲיְסֻפַּר
  choice: Dapat bang sabihin
  rationale: Pinananatili ang impersonal na pasibong tanong ng Hebreo at ang diwang modal ng retorikal na pahayag.
- source_word: לוֹ
  choice: sa kanya
  rationale: Ang tinutukoy sa konteksto ay ang Diyos, ngunit walang pagmamarka ng marangal na malaking titik sa Hebreo; nililinaw ito sa talababa.
- source_word: כִּי אֲדַבֵּר
  choice: na magsasalita ako
  rationale: Ang כִּי ay nagpapakilala sa nilalaman ng sasabihin, at ang imperfect na אֲדַבֵּר ay natural na naipapahayag sa Filipino bilang inaasahan o binabalak na pagsasalita.
- source_word: אִם אָמַר אִישׁ
  choice: Kung magsalita ang isang tao
  rationale: Pinananatili ang kondisyunal na אִם at ang pangkalahatang diwa ng אִישׁ nang hindi nagdaragdag ng tahasang layon na wala sa Hebreo.
- source_word: כִּי יְבֻלָּע
  choice: tiyak na lalamunin siya
  rationale: Ipinahahayag ng “tiyak” ang mariing puwersa ng כִּי, habang pinananatili ng “lalamunin” ang matingkad na larawang pasibo ng בלע.
theological_decisions:
- issue: Tinutukoy ng panghalip na לוֹ
  choice: Isinalin bilang “sa kanya,” na tumutukoy sa Diyos ayon sa konteksto.
  alternative: “sa Kanya”
  rationale: Hindi ipinapakita ng Hebreo ang reverential capitalization; ang paggamit ng maliit na titik ay usaping estilo at hindi pagtanggi sa banal na tinutukoy.
- issue: Pagpapakahulugan sa אִישׁ
  choice: “isang tao”
  alternative: “isang lalaki”
  rationale: Bagaman panlalaking pangngalan ang אִישׁ, pangkalahatan ang gamit nito rito. Ang “isang tao” ay natural sa modernong Filipino at hindi nagdaragdag ng espesipikong kasariang hindi mahalaga sa pahayag.
- issue: Mahirap at siksik na sintaks ng talata
  choice: Pinanatili ang retorikal na tanong at kondisyunal na daloy nang hindi tiyakang nilulutas ang ugnayan ng mga sugnay.
  alternative: “Dapat bang sabihin sa kanya na nagsasalita ako? O dapat bang sabihin ng isang tao na siya ay lalamunin?”
  rationale: Maaaring hatiin at iugnay sa iba’t ibang paraan ang ikalawang bahagi. Inilalagay sa talababa ang mahalagang alternatibo upang mapanatili ang tunay na kalabuan.
translation_notes:
  register: Modernong Filipino na dignified at madaling maunawaan. Pinanatili ang retorikal na tono, ang larawan ng pagkalamon, at ang sintaktikong kalabuan ng Hebreo; iniwasan ang denominasyonal na pagpapaliwanag.
