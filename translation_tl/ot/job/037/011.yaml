translation_notes:
  register: Makabago at marangal na Filipino. Pinili ang “pinabibigatan” upang mapanatili ang larawan ng ulap na may pasan, at iniwang literal sa pangunahing teksto ang di-tiyak na pariralang “ulap ng kanyang liwanag,” habang nasa talababa ang mas interpretibong pagbasa na tumutukoy sa kidlat.
