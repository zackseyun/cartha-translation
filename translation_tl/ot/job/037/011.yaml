  yaml_path: translation/ot/job/037/011.yaml
  text: Indeed[a], he loads the thick cloud with moisture[b]; he scatters his cloud of light.
translation:
  language: tl
  text: Tunay nga, pinabibigatan niya ng halumigmig ang makapal na ulap[a]; ikinakalat niya ang ulap ng kanyang liwanag[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pinabibigatan niya ng ulan [o tubig] ang makapal na ulap.” Hindi tiyak ang kahulugan ng salitang Hebreo na isinaling “halumigmig.”
    reason: lexical_alternative
  - marker: b
    text: O “ikinakalat niya ang ulap ng kanyang kidlat.” Sa konteksto ng bagyo, maaaring tumukoy sa kidlat ang “liwanag.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַף
  choice: Tunay nga
  rationale: Ginamit dito bilang salitang panidiin na nagdaragdag ng isa pang paglalarawan sa pamamahala ng Diyos sa lagay ng panahon.
- source_word: בְּרִי
  choice: ng halumigmig
  rationale: Hindi tiyak ang kahulugan ng salitang Hebreo; sa larawan ng makapal na ulap na pinabibigatan, ang halumigmig o tubig-ulan ang pinakamalamang na diwa. Inilagay sa talababa ang ibang posibilidad.
- source_word: יַטְרִיחַ
  choice: pinabibigatan niya
  rationale: Pinananatili nito ang diwa ng Hiphil na pagpapasan o paglalagay ng bigat sa ulap, sa halip na gawing mas payak na ‘pinupuno.’
- source_word: עָב
  choice: ang makapal na ulap
  rationale: Ang עָב ay tumutukoy sa makapal o masinsing ulap.
- source_word: יָפִיץ
  choice: ikinakalat niya
  rationale: Tuwirang ipinahahayag nito ang sanhiang diwa ng pagpapangalat o pagpapalaganap.
- source_word: עֲנַן אוֹרוֹ
  choice: ang ulap ng kanyang liwanag
  rationale: Pinananatili ang kakaiba ngunit posibleng konstruksiyong ‘ulap ng kanyang liwanag’ at hindi agad ipinapalit ang interpretasyong ‘ulap ng kidlat.’
