  text: From its chamber comes the storm[b][a], and from the scattering winds comes cold.
translation:
  language: tl
  text: Mula sa silid ay dumarating ang unos,[a] at mula sa mga hanging nagpapangalat ay dumarating ang lamig.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Mula sa timog ay dumarating ang unos.” Literal na sinasabi ng Hebreo, “mula sa silid,” na maaaring isang patulang pagtukoy sa timog na dako o sa isang tagong imbakan.
    reason: alternative_reading
  - marker: b
    text: O “at mula sa hilaga ay dumarating ang lamig,” o “at mula sa mga hanging nagpapangalat, ang lamig.” Bihira ang salitang Hebreo at hindi tiyak ang eksaktong kahulugan nito.
    reason: alternative_reading
lexical_decisions:
- source_word: מִן הַחֶדֶר
  choice: Mula sa silid nito
  rationale: Ang חֶדֶר ay literal na “silid” o “panloob na silid.” Sa matalinghagang paglalarawan ng panahon, maaaring tumukoy ito sa tagong pinagmumulan o kinalalagyan ng unos. Pinananatili ng “silid nito” ang larawan ng Hebreo nang hindi ipinapalagay na tahasan itong nangangahulugang “timog.”
- source_word: תָּבוֹא
  choice: ay dumarating
  rationale: Karaniwang kahulugan ng בוא ang “dumating” o “pumarito.” Ang progresibong “dumarating” ay natural sa Filipino at nagpapanatili sa masiglang paglalarawan ng taludtod.
- source_word: סוּפָה
  choice: ang unos
  rationale: Ang סוּפָה ay isang malakas na bagyo, unos, o ipuipo. Dignified at malawak ang “unos,” at hindi ito kasimpit ng “ipuipo.”
- source_word: וּמִמְּזָרִים
  choice: mula sa mga hanging nagpapangalat
  rationale: Bihira at hindi tiyak ang מְזָרִים. Ang saling ito ay nagpapanatili sa posibleng ugnayan nito sa pagpapangalat o pagpapakalat, habang ang alternatibong “hilaga” ay inilalagay sa talababa.
- source_word: קָרָה
  choice: ang lamig
  rationale: Maaaring tumukoy ang קָרָה sa lamig, nagyeyelong panahon, o hamog na nagyelo. Ang “lamig” ang pinakamaikli at hindi labis na tiyak na katumbas sa konteksto.
theological_decisions: []
translation_notes:
  register: Makabago ngunit marangal na Filipino. Pinanatili ang patulang larawan ng “silid” at ang kawalang-katiyakan ng bihirang terminong מְזָרִים; inulit ang “dumarating” upang maging buo at natural ang ikalawang sugnay.
