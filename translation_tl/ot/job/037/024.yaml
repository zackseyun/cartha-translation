  yaml_path: translation/ot/job/037/024.yaml
  text: Therefore men fear him[a]; he does not regard any who are wise of heart.
translation:
  language: tl
  text: Kaya't natatakot sa kanya ang mga tao; hindi niya pinapansin ang sinumang pantas sa puso.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “hindi niya nakikita ang lahat ng pantas sa puso.” Ang pandiwang Hebreo ay maaaring mangahulugang “makakita” o “magbigay-pansin.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Kaya't
  rationale: Ipinakikita ang kongklusyon mula sa naunang paglalarawan sa kadakilaan ng Diyos at natural ang daloy sa makabagong Tagalog.
- source_word: יְרֵאוּהוּ
  choice: natatakot sa kanya
  rationale: Pinananatili ang tuwirang diwa ng ירא na maaaring magpahiwatig ng takot, pagpipitagan, at pagkasindak sa harap ng banal na kadakilaan.
- source_word: אֲנָשִׁים
  choice: ang mga tao
  rationale: Pangkalahatang tumutukoy sa mga taong nilalang; likas at inklusibo ang karaniwang gamit nito sa Tagalog.
- source_word: לֹא יִרְאֶה
  choice: hindi niya pinapansin
  rationale: Bagaman literal na 'hindi niya nakikita,' maaari itong mangahulugang hindi niya binibigyang-pansin o kinikilala; mas malinaw sa Tagalog ang idyomatikong salin habang inilalagay sa talababa ang literal na anyo.
- source_word: כָּל
  choice: ang sinumang
  rationale: 'Sa negatibong pangungusap, natural nitong naihahayag ang distributibong diwa: walang sinuman sa pangkat ang pinapansin.'
- source_word: חַכְמֵי לֵב
  choice: marunong sa puso
  rationale: Pinananatili ang Hebreong metapora ng puso bilang kinaroroonan ng karunungan nang hindi idinaragdag ang interpretasyong 'sa sariling palagay.'
theological_decisions:
- issue: Ang diwa ng hindi pagtingin ng Diyos sa marurunong sa puso
  choice: Ang Diyos ang ipinahihiwatig na simuno at hindi niya pinapansin ang sinumang marunong sa puso.
  alternative: Hindi niya nakikita ang lahat ng marurunong sa puso; o hindi siya nakikita ng mga marurunong sa puso.
  rationale: Sa konteksto, ang Diyos ang pinakanatural na simuno ng pandiwang isahan. Ang 'pinapansin' ay naghahayag ng posibleng idyomatikong diwa ngunit hindi tahasang nilalagyan ng 'sa sariling palagay' ang karunungan, sapagkat wala iyon sa Hebreo.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog. Pinanatili ang maikli at matinding pangwakas na pahayag ng talata, gayundin ang metaporang “sa puso.”
