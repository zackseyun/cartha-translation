  text: From the breath of God ice is given[b][a], and the broad expanse of waters is frozen solid.
translation:
  language: tl
  text: Mula sa hininga ng Diyos ay nabubuo ang yelo[a], at ang lawak ng tubig ay tumitigas.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Sa pamamagitan ng hininga ng Diyos ay nabubuo ang yelo.” Maaaring tukuyin ng pang-ukol sa Hebreo ang pinagmulan (“mula sa”) o ang paraang ginamit (“sa pamamagitan ng”).
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “ang lawak ng tubig ay namumuo” o “nagiging matigas.” Matalinghaga ang pahayag sa Hebreo at maaaring tumukoy sa malawak na bahagi o ibabaw ng tubig na tumitigas.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנִּשְׁמַת
  choice: Sa hininga ng
  rationale: Ang נִשְׁמָה ay “hininga,” at maaaring ipahayag ng מִן ang pinagmulan o paraan. Likas sa Filipino ang “sa hininga ng” at nananatiling bukas sa dalawang diwa.
- source_word: אֵל
  choice: Diyos
  rationale: Karaniwang banal na titulo rito ang אֵל; hindi kailangan ang pagpapalawak na “Diyos na Makapangyarihan.”
- source_word: יִתֶּן קָרַח
  choice: nabubuo ang yelo
  rationale: Literal na “nagbibigay ng yelo” o “ibinibigay ang yelo.” Ang “nabubuo ang yelo” ay malinaw at natural sa Filipino habang ipinahihiwatig pa rin na gawa ito ng hininga ng Diyos.
- source_word: וְרֹחַב מַיִם
  choice: ang malawak na ibabaw ng tubig
  rationale: Ang רֹחַב ay lawak o malawak na kalawakan. Sa konteksto, malamang na tinutukoy nito ang malawak na nakalatag na ibabaw ng tubig.
- source_word: בְּמוּצָק
  choice: tumitigas
  rationale: Ang מוּצָק ay maaaring tumukoy sa pagiging matatag, matigas, o parang hinulma. Sa konteksto ng yelo, natural na ipinapahayag ng “tumitigas” ang pagtigas ng tubig nang hindi labis na nililinaw ang matalinghagang salita.
