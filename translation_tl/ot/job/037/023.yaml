revisions:
- from: Ang Makapangyarihan sa Lahat—hindi natin siya lubos na maarok[a]—ay dakila sa kapangyarihan. Sa katarungan[b] at saganang katuwiran, hindi siya nang-aapi.[c]
  to: Ang Makapangyarihan sa Lahat—hindi natin siya lubos na maarok[a]—ay dakila sa kapangyarihan, sagana sa katarungan[b] at katuwiran; hindi siya nang-aapi.[c]
  rationale: Inayos ang pagkakatambal ng mga katangiang “kapangyarihan,” “katarungan,” at “katuwiran” upang maging malinaw at likas sa Tagalog, habang pinananatili ang matibay na kontekstuwal na pagbasa na hindi nang-aapi ang Diyos. Pinalitan ang talababa c upang ilahad lamang ang mga tunay na alternatibong semantiko ng huling pandiwa at hindi magpataw ng di-likas na bagay nito.
