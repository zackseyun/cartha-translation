  yaml_path: translation/ot/job/037/023.yaml
  text: The Almighty—we cannot find him out—great in power[c][b][a]; and justice and abundant righteousness he does not afflict.
translation:
  language: tl
  text: Ang Makapangyarihan sa Lahat—hindi natin siya lubos na maarok[a]—ay dakila sa kapangyarihan, sagana sa katarungan[b] at katuwiran; hindi siya nang-aapi.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “hindi natin siya matagpuan,” “hindi natin siya maabot,” o “hindi natin siya lubos na maunawaan.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “paghatol.”
    reason: lexical_alternative
  - marker: c
    text: Maaari ring isalin ang huling pandiwa bilang “hindi siya nagpapahirap.” May ilang bumabasa rito bilang “hindi siya sumasagot,” ngunit hindi ito gaanong angkop sa konteksto.
    reason: alternative_reading
lexical_decisions:
- source_word: שַׁדַּי
  choice: Ang Makapangyarihan sa Lahat
  rationale: Isinasalin ang banal na titulong Shaddai sa karaniwang anyong malinaw sa modernong mambabasang Tagalog.
- source_word: לֹא מְצָאנֻהוּ
  choice: hindi natin siya lubos na maarok
  rationale: Ang literal na 'hindi natin siya masumpungan' ay may diwang hindi siya kayang matuklasan o maunawaan nang lubos; pinananatili ng 'maarok' ang diwa ng hindi maabot na kadakilaan nang hindi sinasabing ganap na walang anumang kaalaman tungkol sa Diyos.
- source_word: שַׂגִּיא כֹחַ
  choice: dakila sa kapangyarihan
  rationale: 'Malapit ito sa anyo at diwa ng Hebreo: napakadakila o mataas sa lakas at kapangyarihan.'
- source_word: וּמִשְׁפָּט
  choice: Sa katarungan
  rationale: Sa pagkakaugnay nito sa katuwiran, ang mishpat ay tumutukoy rito sa makatarungang pamamahala o katangian, bagaman maaari rin itong isaling 'paghatol.'
- source_word: וְרֹב צְדָקָה
  choice: at saganang katuwiran
  rationale: Pinananatili ang pangngalang 'katuwiran' at ang ideya ng kasaganaan o kadakilaan nito.
- source_word: לֹא יְעַנֶּה
  choice: hindi siya nang-aapi
  rationale: Ang Piel ng ענה ay karaniwang nangangahulugang magpahirap, manakit, o mang-api. Ang 'nang-aapi' ay likas sa Tagalog at akma sa pagbanggit sa katarungan at katuwiran, habang inilalahad sa talababa ang ibang posibleng pagbasa.
theological_decisions:
- issue: Ang kaugnayan ng huling sugnay na לֹא יְעַנֶּה sa katarungan at katuwiran ng Diyos
  choice: Ipinahahayag na hindi nang-aapi ang Diyos.
  alternative: Maaaring unawain na hindi niya nilalabag o pinipinsala ang katarungan at saganang katuwiran; maaari ring basahin ang pandiwa bilang 'hindi siya sumasagot.'
  rationale: Ang pagbasa na 'hindi siya nang-aapi' ay leksikal na matibay at umaayon sa agarang pagbanggit sa katarungan at katuwiran. Hindi nito inaalis ang tensiyon sa pagitan ng pagiging di-maisaklaw ng Diyos at ng katiyakan tungkol sa kaniyang matuwid na pagkilos; itinatala sa talababa ang tunay na kalabuan ng huling pandiwa.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang 'maarok' bilang bahagyang mataas ngunit pamilyar na salita para sa di-kayang lubos na maunawaan, at 'nang-aapi' bilang malinaw at likas na katumbas ng pandiwang Hebreo.
