translation:
  language: tl
  text: Ikaw, na mainit ang iyong mga damit kapag panatag ang lupa dahil sa hanging timog?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “mula sa timog.” Literal na “mula sa timog” ang Hebreo, na maaari ring tumukoy nang mas pangkalahatan sa dako ng timog; ginagawang tahas ng “hanging timog” ang kahulugang pangpanahon.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר
  choice: ikaw na
  rationale: Ipinakikilala ng pang-ugnay ang tuwirang pagtukoy ni Elihu kay Job. Likas sa Filipino ang “ikaw na” bilang simula ng sugnay na naglalarawan sa kausap.
- source_word: בְּגָדֶיךָ
  choice: ang mga damit
  rationale: Ang בגד ay karaniwang tumutukoy sa damit o kasuotan. Malinaw at pangkaraniwan sa modernong Filipino ang “mga damit”; ipinahihiwatig na ng “ikaw na” na ang mga ito ay sa kausap.
- source_word: חַמִּים
  choice: mainit
  rationale: Tuwirang inilalarawan ng pang-uri ang init ng mga damit. Pinananatili ng “mainit” ang anyong stative ng Hebreo sa halip na gawing “umiinit.”
- source_word: בְּהַשְׁקִט
  choice: kapag tahimik
  rationale: Ang anyong mula sa שקט ay nangangahulugang maging tahimik, payapa, o walang galaw. Ang “kapag tahimik” ay natural sa paglalarawan ng panahong walang galaw ang hangin.
- source_word: אֶרֶץ
  choice: ang lupa
  rationale: Maaaring mangahulugan ang אֶרֶץ ng lupa, lupain, o daigdig. Sa lokal na larawang pangpanahon, ang “lupa” ay simple at hindi nagpapalawak nang higit sa hinihingi ng teksto.
- source_word: מִדָּרוֹם
  choice: dahil sa hanging mula sa timog
  rationale: Literal itong “mula sa timog,” ngunit sa kontekstong pangpanahon ay malamang na tumutukoy sa mainit na hanging nagmumula sa timog. Ginagawang malinaw ng pangunahing salin ang ugnayang sanhi, habang pinananatili sa talababa ang mas literal na pagbasa.
