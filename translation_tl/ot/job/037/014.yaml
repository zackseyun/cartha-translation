    rationale: Ang Hebreong pautos עֲמֹד ay literal na “tumayo” o “manindigan.” Maaaring ipahiwatig ng konteksto ang paghinto para magmuni, ngunit hindi ligtas na palitan ang utos ng simpleng “tumigil.”
  revised_text: Pakinggan mo ito, Job; tumayo ka at pag-isipan ang mga kamangha-manghang gawa ng Diyos.[a]
