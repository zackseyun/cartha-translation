  yaml_path: translation/ot/job/037/014.yaml
  text: Listen to this[a], Job[c][b]; stand still and consider the wonders of God.
translation:
  language: tl
  text: Pakinggan mo ito, Job; tumayo ka at pag-isipan ang mga kamangha-manghang gawa ng Diyos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang mga kababalaghan ng Diyos.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַאֲזִינָה
  choice: Pakinggan mo
  rationale: Ang pautos na anyo ay nananawagan ng masusing pakikinig. Likas at malinaw sa makabagong Filipino ang “Pakinggan mo.”
- source_word: זֹּאת
  choice: ito
  rationale: Ang panghalip na pamatlig na pambabae at isahan ay tumutukoy sa sinasabi ni Elihu; tuwiran itong naihahayag ng “ito.”
- source_word: אִיּוֹב
  choice: Job
  rationale: Ginamit ang nakaugaliang anyo ng personal na pangalan sa mga saling Filipino.
- source_word: עֲמֹד
  choice: tumigil ka
  rationale: Bagaman literal na “tumayo,” sa pagkakaugnay nito sa kasunod na utos ay ipinahihiwatig ang paghinto upang magnilay. Mas natural sa Filipino ang “tumigil ka” kaysa “tumayo kang hindi gumagalaw.”
- source_word: וְהִתְבּוֹנֵן
  choice: at pag-isipan
  rationale: Ang hitpolel na pautos ng בין ay nagsasaad ng maingat na pagsasaalang-alang o pagninilay. Ang “pag-isipan” ay malinaw at likas.
- source_word: נִפְלְאוֹת
  choice: ang mga kamangha-manghang gawa
  rationale: Ang pangmaramihang pangngalan mula sa פלא ay maaaring tumukoy sa mga kahanga-hangang bagay o gawa. Sa konteksto ng mga kilos ng Diyos sa kalikasan, natural ang “mga kamangha-manghang gawa,” habang pinananatili sa talababa ang mas maikling alternatibo.
- source_word: אֵל
  choice: Diyos
  rationale: Ang אֵל ay karaniwang katawagan sa Diyos rito. Hindi kailangang dagdagan ng “Makapangyarihan,” na higit sa tahasang sinasabi ng Hebreo.
theological_decisions:
- issue: Pagpapakahulugan sa banal na katawagang אֵל
  choice: Diyos
  alternative: Makapangyarihang Diyos
  rationale: Sapat ang “Diyos” upang ipahayag ang payak na kahulugan ng Hebreo nang hindi nagdaragdag ng diin na hindi tahasang nasa talata.
- issue: Saklaw ng נִפְלְאוֹת bilang mga bagay o mga gawa
  choice: mga kamangha-manghang gawa
  alternative: mga kababalaghan
  rationale: Maaaring tumukoy ang salita sa mga kahanga-hangang gawa o pangyayari. Ang “mga kamangha-manghang gawa” ay angkop sa konteksto ngunit hindi itinatangging posible ang mas malawak na “mga kababalaghan.”
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang tuwirang pakikipag-usap na “mo/ka,” alinsunod sa mga pautos na isahan sa Hebreo. Iniwasan ang arkaikong “dinggin” at ang sobrang literal ngunit di-likas na “tumayo kang tahimik.”
