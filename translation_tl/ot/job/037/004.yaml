  text: After it[a], a voice roars; he thunders with his majestic voice[c][b], and he does not hold them back when his voice is heard.
translation:
  language: tl
  text: Pagkatapos nito[a], umuungal ang isang tinig; ipinadaragundong niya ang kanyang maringal na tinig, at hindi niya pinipigil ang mga iyon[b] kapag[c] naririnig ang kanyang tinig.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Pagkatapos, umuungal ang isang tinig.” Maaaring gamiting pang-abay ang Hebreo, ngunit malamang na tumutukoy ito sa kidlat sa naunang talata.
    reason: lexical_alternative
  - marker: b
    text: O “hindi niya inaantala ang mga iyon.” Malamang na tumutukoy ang “mga iyon” sa mga kidlat o iba pang epekto ng bagyong kasabay ng kulog.
    reason: lexical_alternative
  - marker: c
    text: O “sapagkat naririnig ang kanyang tinig.” Ang pangatnig sa Hebreo ay maaaring magpahayag ng sanhi o panahon.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֲרָיו
  choice: Pagkatapos nito
  rationale: Ang hulaping panlalaking isahan ay malamang na tumutukoy sa kidlat sa naunang talata. Pinananatili ng “nito” ang ugnayang iyon, samantalang posible rin ang gamit na pang-abay na “pagkatapos.”
- source_word: יִשְׁאַג קוֹל
  choice: umuungal ang isang tinig
  rationale: Karaniwang inilalarawan ng שׁאג ang ungol ng leon at dito ay matalinghagang tumutukoy sa kulog. Pinananatili ng “umuungal” ang buhay at makapangyarihang larawan, at hindi inuunahan ang tahasang pag-uugnay ng tinig sa Diyos.
- source_word: יַרְעֵם
  choice: kumukulog siya
  rationale: Ang Hiphil ng רעם ay nagpapahayag na siya ang nagpapakulog. Ang “kumukulog siya” ay likas at maikli sa Filipino at pinananatili ang personal na pagkilos ng Diyos nang hindi siya tahasang pinapangalanan sa talata.
- source_word: בְּקוֹל גְּאוֹנוֹ
  choice: sa kanyang maringal na tinig
  rationale: Ang גָּאוֹן ay maaaring mangahulugang karangalan, kadakilaan, o karingalan. Ang “maringal na tinig” ay natural sa modernong Filipino at tapat sa diwa ng dakilang kapangyarihan.
- source_word: וְלֹא יְעַקְּבֵם
  choice: at hindi niya pinipigil ang mga iyon
  rationale: Ang Piel ng עקב ay maaaring mangahulugang pigilin, hadlangan, o antalahin. Malamang na ang hulaping maramihan ay tumutukoy sa mga kidlat o mga epekto ng bagyo; gaya ng Hebreo, hindi tahasang tinutukoy ng salin ang pinagmumulan ng “mga iyon.”
- source_word: כִּי יִשָּׁמַע קוֹלוֹ
  choice: kapag naririnig ang kanyang tinig
  rationale: Maaaring temporal o sanhi ang כִּי. Ang “kapag” ay angkop sa pagkakasunod-sunod ng kidlat at kulog sa konteksto, habang inilalahad sa talababa ang posibleng pagbasa na sanhi.
theological_decisions:
- issue: Ang tinutukoy na umuungal at kumukulog
  choice: Ang Diyos ang personal na gumagawa, at ang kulog ay pagpapahayag ng kanyang tinig.
  alternative: Maaaring basahin ang unang sugnay bilang di-personal na paglalarawan sa tunog o bagyo.
  rationale: Inilalarawan ng konteksto ang pagkilos ng Diyos sa bagyo, at ang “kanyang maringal na tinig” ay malakas na nagpapahiwatig ng personal at banal na tinutukoy. Gayunman, hindi idinagdag ang pangalang “Diyos,” sapagkat wala ito sa mismong talata.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Pinanatili ang matingkad na larawang “umuungal” at ang bahagyang kalabuan ng “mga iyon.” Ginamit ang maliliit na titik sa mga panghalip para sa Diyos, alinsunod sa karaniwang modernong gamit at upang hindi magdagdag ng impormasyong wala sa Hebreo.
