base_translation:
  language: en
  yaml_path: translation/ot/job/037/018.yaml
  text: Can you[a], with him, spread out the skies[c][b], hard as a cast metal mirror?
translation:
  language: tl
  text: Maiuunat mo ba[a], kasama niya, ang kalangitang[b] sintigas ng salaming hinulma?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “maipukpok mo ba nang manipis” o “mailatag mo ba.” Ang pandiwang Hebreo ay maaaring maglarawan ng pagpukpok sa metal upang numipis at lumapad, gayundin ng paglalatag o pag-uunat.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “himpapawid,” “mga langit,” o “mga ulap.” Patulang salita ang Hebreong שׁחקים na maaaring tumukoy sa kalangitan o mga langit at, sa ilang konteksto, sa mga ulap.
    reason: lexical_alternative
  - marker: c
    text: Sa literal, “gaya ng salaming hinulma.” Noong sinaunang panahon, ang mga salamin ay yari sa pinakintab na metal; inilalarawan dito ang kalangitan bilang matigas at makintab na tulad ng hinulmang metal.
    reason: cultural_note
lexical_decisions:
- source_word: תַּרְקִיעַ
  choice: maiunat
  rationale: Ang Hiphil ng רקע ay tumutukoy sa paglalatag o pagpapapad ng isang bagay, lalo na ng metal sa pamamagitan ng pagpukpok. Natural sa Filipino ang “maiunat” para sa kalangitan, habang pinananatili sa talababa ang pahiwatig ng pagpoproseso ng metal.
- source_word: עִמּוֹ
  choice: kasama niya
  rationale: Panghalip na “niya” ang nasa Hebreo. Bagaman Diyos ang tinutukoy sa konteksto, hindi ito ginawang tahasan sa pangunahing teksto.
- source_word: לִשְׁחָקִים
  choice: ang kalangitan
  rationale: Ang שׁחקים ay patulang katawagan sa himpapawid o kalangitan at maaari ring tumukoy sa mga ulap. Ang paghahambing dito sa metal na salamin ay higit na umaangkop sa nakikitang kalangitan.
- source_word: חֲזָקִים
  choice: matigas
  rationale: Sa paghahambing sa hinulmang metal, mas tuwiran ang “matigas” kaysa “malakas” at malinaw nitong inilalarawan ang katangiang ipinapahiwatig ng taludtod.
- source_word: כִּרְאִי
  choice: gaya ng salamin
  rationale: Ang ראי ay salamin, at ang unlaping כ־ ay naghahayag ng paghahambing.
- source_word: מוּצָק
  choice: hinulma mula sa tunaw na metal
  rationale: Ang anyong ito ay tumutukoy sa bagay na ibinuhos o hinulma, karaniwan ay metal. Hindi tinukoy ang bronse sa Hebreo, kaya hindi iyon idinagdag.
theological_decisions:
- issue: Ang tinutukoy ng panghalip sa עִמּוֹ
  choice: Pinanatili ang “niya.”
  alternative: Gawing tahasan na “Diyos.”
  rationale: Diyos ang malinaw na tinutukoy sa konteksto, ngunit panghalip lamang ang ginamit ng tekstong Hebreo; pinananatili nito ang anyo at hindi nagdaragdag ng pangalan sa pangunahing teksto.
translation_notes:
  register: Makabago at marangal na Filipino ang ginamit. Ang “Maiuunat mo ba” ay nagpapanatili sa anyong retorikal ng tanong at natural pakinggan, samantalang inilalahad sa talababa ang mas kongkretong larawang metalurhiko. Pinanatili ang “kasama niya” upang sundan ang panghalip ng Hebreo at mapanatili ang bahagyang tensiyon ng pahayag.
