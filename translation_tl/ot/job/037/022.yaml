  text: מִ֭/צָּפוֹן זָהָ֣ב יֶֽאֱתֶ֑ה עַל אֱ֝ל֗וֹהַּ נ֣וֹרָא הֽוֹד־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/037/022.yaml
  text: From the north comes golden splendor; around God is awesome majesty.
translation:
  language: tl
  text: Mula sa hilaga ay dumarating ang gintong kaningningan[a]; sa Diyos ay may kasindak-sindak na kamahalan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “ginto.”
    reason: Ipinababatid ang literal at maigsi ngunit di-tiyak na pagbasa ng זָהָב, samantalang gumagamit ang pangunahing teksto ng likas na ekspresyong “gintong kaningningan.”
lexical_decisions:
- source_word: מִצָּפוֹן (mitstsafon)
  choice: Mula sa hilaga
  rationale: Tuwirang ipinapahayag ang pinagmulan o direksiyon na tinutukoy ng pang-ukol מִן at ng pangngalang צָפוֹן.
- source_word: זָהָב (zahav)
  choice: gintong kaningningan
  rationale: Ang literal na kahulugan ay “ginto,” ngunit sa konteksto ng maningning na pagpapakita ay likas sa Tagalog ang “gintong kaningningan.” Pinananatili sa talababa ang literal na anyo dahil maigsi at maaaring sadyang malabo ang Hebreo.
- source_word: יֶאֱתֶה (ye'eteh)
  choice: dumarating
  rationale: Isinasalin ang di-ganap na pandiwa bilang kasalukuyang nagaganap na kilos, ayon sa masiglang paglalarawan ng talata.
- source_word: עַל אֱלוֹהַּ (al eloah)
  choice: sa Diyos
  rationale: Ang עַל ay malawak ang ugnayang maaaring ipahiwatig (“sa ibabaw,” “nasa,” o kaugnay ng Diyos). Ang payak na “sa Diyos” ay hindi labis na nagtatakda kung ang kamahalan ay nasa ibabaw, nakapalibot, o taglay niya.
- source_word: נוֹרָא הוֹד (nora hod)
  choice: kasindak-sindak na kamahalan
  rationale: Ang נוֹרָא ay nagpapahiwatig ng pagpipitagan at sindak, samantalang ang הוֹד ay dignidad, karilagan, o kamahalan. Ang parirala ay natural at marangal sa modernong Tagalog.
theological_decisions:
- issue: Ugnayan ng kasindak-sindak na kamahalan sa Diyos sa pariralang עַל אֱלוֹהַּ
  choice: sa Diyos ay may kasindak-sindak na kamahalan
  alternative: nakapalibot sa Diyos ang kasindak-sindak na kamahalan
  rationale: Iniiwasang gawing tiyak na “nakapalibot” ang malawak na pang-ukol na עַל. Napananatili ang pahayag na ang kamahalan ay kaugnay at naroroon sa Diyos nang hindi nagdaragdag ng isang partikular na larawang spatial.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang baligtad na ayos na “sa Diyos ay may” upang mapanatili ang diin at maluwag na ugnayan ng Hebreo nang hindi maging malamya o labis na teknikal.
