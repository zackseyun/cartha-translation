base_translation:
  language: en
  yaml_path: translation/ot/job/037/006.yaml
  text: For he says to the snow[a], ‘Fall to the earth,’ and to the rain, ‘Become a shower,’ and to the rains[b], ‘Become a downpour of his might.’
translation:
  language: tl
  text: Sapagkat sinasabi niya sa niyebe[a], “Bumagsak ka sa lupa,” at sa ulan, “Bumuhos ka,” at sa mga ulan[b], “Bumuhos kayo nang buong lakas niya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Maging nasa lupa ka,” sa diwang inuutusan ang niyebe na lumitaw o mahimlay sa ibabaw ng lupa.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring unawain ang huling bahagi bilang “at ang malalakas na ulan ng kaniyang kapangyarihan” o “at ang makapangyarihang mga buhos ng ulan.” Siksik at patula ang Hebreo.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikita ang paliwanag o dahilan sa patulang paglalarawan ng pamamahala ng Diyos sa lagay ng panahon.
- source_word: לַשֶּׁלַג
  choice: sa niyebe
  rationale: Ang ל kasunod ng אמר ay tumutukoy sa kinakausap; pinananatili nito ang pagsasatao sa niyebe.
- source_word: יֹאמַר
  choice: sinasabi niya
  rationale: Ang imperpektibo ay inuunawang pangkasalukuyang paglalarawan; ang lakas ng utos ay lumilitaw sa tuwirang pananalita.
- source_word: הֱוֵא אָרֶץ
  choice: Bumagsak ka sa lupa
  rationale: Literal na may diwang ‘maging/naroon sa lupa,’ ngunit sa konteksto ng niyebe, natural na inilalarawan ng ‘bumagsak’ ang pagdating nito sa lupa nang hindi nawawala ang utos.
- source_word: וְגֶשֶׁם מָטָר
  choice: at sa ulan, “Maging buhos ka”
  rationale: Pinananatili ang dalawang magkalapit na salitang tumutukoy sa ulan sa pamamagitan ng ‘ulan’ at ‘buhos,’ at ang paralelismong pautos ng taludtod.
- source_word: וְגֶשֶׁם מִטְרוֹת עֻזּוֹ
  choice: at sa mga pag-ulan, “Maging malakas na buhos ng kaniyang kapangyarihan”
  rationale: Ang maramihang מִטְרוֹת ay nagpapahiwatig ng pinaigting o paulit-ulit na ulan. Ang siksik na pariralang Hebreo ay inilahad bilang pagpapatuloy ng utos, habang minamarkahan sa talababa ang ibang posibleng pagkakabuo.
- source_word: עֻזּוֹ
  choice: ng kaniyang kapangyarihan
  rationale: Ang hulaping panghalip na panlalaking isahan ay pinakamalamang na tumutukoy sa Diyos, na siyang nagsasalita at namamahala sa panahon sa konteksto.
theological_decisions:
- issue: Tinutukoy ng panghalip sa עֻזּוֹ
  choice: 'Tumutukoy sa Diyos: “ng kaniyang kapangyarihan.”'
  alternative: 'Maaaring tumukoy sa ulan: “sa buong lakas nito.”'
  rationale: Ang Diyos ang ipinahihiwatig na nagsasalita at namamahala sa mga pangyayari sa kalikasan sa agarang konteksto. Gayunman, hindi ganap na imposibleng iugnay ang hulapi sa lakas ng ulan.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang karaniwang “niyebe,” “ulan,” at “buhos,” at pinanatili ang patulang pagsasatao at tatlong bahaging pagbanggit sa pag-ulan. Ang “kaniyang” ay ginamit sa halip na denominasyonal na pagmamarka ng banal na panghalip.
