  text: Listen carefully[a] to the trembling of his voice[b], and the rumbling that comes out from his mouth.
translation:
  language: tl
  text: Pakinggan ninyong mabuti[a] ang panginginig ng kanyang tinig, at ang ugong[b] na lumalabas sa kanyang bibig.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “Pakinggan ninyo, pakinggan ninyo.” Ang pag-uulit sa Hebreo ay nagbibigay-diin sa utos.
    reason: translation_form
  - marker: b
    text: Maaari ring “mahinang ugong,” “bulong,” o “tunog.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ שָׁמוֹעַ
  choice: Pakinggan ninyong mabuti
  rationale: Ang pautos na pandiwa na sinusundan ng infinitive absolute ay nagbibigay-diin sa utos. Likas sa makabagong Tagalog ang “pakinggan ninyong mabuti” at naihahatid nito ang diin nang hindi gumagamit ng alanganing pag-uulit.
- source_word: בְּרֹגֶז
  choice: ang panginginig ng
  rationale: Maaaring tumukoy ang רֹגֶז sa panginginig, pagkabalisa, o pagngangalit. Sa larawan ng bagyo at kulog, inilalarawan ng “panginginig” ang nakakayayanig na katangian ng tinig nang hindi ipinapalagay na galit ang tiyak na kahulugan.
- source_word: קֹלוֹ
  choice: kanyang tinig
  rationale: Ang קוֹל ay maaaring “tinig” o “tunog.” Pinananatili ng “tinig” ang makatang paglalarawan sa kulog bilang pagsasalita ng Diyos at umaayon ito sa kasunod na pagbanggit sa kanyang bibig.
- source_word: וְהֶגֶה
  choice: ang ugong
  rationale: Ang הֶגֶה ay isang mababa at tuloy-tuloy na tunog, bulong, o ungol. Sa konteksto ng bagyo, natural na inilalarawan ng “ugong” ang tunog ng kulog habang pinananatili ang saklaw ng salitang Hebreo sa talababa.
- source_word: מִפִּיו יֵצֵא
  choice: na lumalabas sa kanyang bibig
  rationale: Tuwirang ipinahihiwatig ng יצא ang paglabas. Ang pariralang ito ay natural sa Tagalog at pinananatili ang kongkreto at antropomorpikong larawan ng tekstong Hebreo.
theological_decisions:
- issue: Antropomorpikong paglalarawan sa Diyos sa larawan ng bagyo
  choice: Panatilihin ang “kanyang tinig” at “kanyang bibig” gaya ng makatang larawan sa Hebreo.
  alternative: Gawing di-personal ang pahayag, gaya ng “tunog nito” o tahasang “kulog.”
  rationale: Inilalarawan ng talata ang bagyo bilang mismong pagbigkas ng Diyos. Ang pagpapanatili sa antropomorpikong wika ay tapat sa tekstong pinagmulan at hindi pinapahina ang teolohikal at pampanitikang puwersa nito.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “ninyong” upang katawanin ang pangmaramihang pautos at ang “ugong” upang maging natural ang larawan ng kulog. Hindi ginamitan ng malaking titik ang panghalip para sa Diyos, alinsunod sa karaniwang modernong gamit at upang hindi magdagdag ng anyong wala sa Hebreo.
