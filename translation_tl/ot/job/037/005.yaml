  yaml_path: translation/ot/job/037/005.yaml
  text: God thunders wondrously with his voice[b][a]; he does great things that we do not know.
translation:
  language: tl
  text: Kamangha-manghang nagpapakulog ang Diyos sa pamamagitan ng kanyang tinig[a]; gumagawa siya ng mga dakilang bagay na hindi natin nalalaman.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Kamangha-manghang kumukulog ang Diyos sa kanyang tinig.” Maaaring unawain nang mas literal bilang “mga kababalaghan” ang salitang Hebreo, ngunit malamang na inilalarawan nito rito ang kamangha-manghang paraan ng pagpapakulog ng Diyos.
    reason: lexical_alternative
  - marker: b
    text: O, “mga dakilang bagay na lampas sa ating kaalaman” o “mga dakilang bagay na hindi natin kayang maunawaan.”
    reason: alternative_reading
lexical_decisions:
- source_word: יַרְעֵם
  choice: nagpapakulog
  rationale: Ang Hiphil ng רעם ay tumutukoy sa pagpapakulog o paglikha ng kulog. Ang “nagpapakulog” ay natural sa Filipino at angkop sa larawan ng bagyo at sa tinig ng Diyos sa konteksto.
- source_word: אֵל
  choice: Diyos
  rationale: Ang אֵל ay karaniwang katawagan sa Diyos dito at hindi nangangailangan ng pinalawak na titulong gaya ng “Makapangyarihang Diyos.”
- source_word: בְּקוֹלוֹ
  choice: sa kanyang tinig
  rationale: 'Pinananatili nito ang instrumental na gamit ng ב: ang tinig ng Diyos ang paraan o kasabay ng kanyang pagpapakulog.'
- source_word: נִפְלָאוֹת
  choice: kamangha-mangha
  rationale: Bagaman pangmaramihang pangngalan ang anyo nito at maaaring literal na “mga kababalaghan,” malamang na gumaganap itong pang-abay dito at inilalarawan kung paano nagpapakulog ang Diyos.
- source_word: עֹשֶׂה
  choice: gumagawa
  rationale: Malawak ang kahulugan ng עשה na “gumawa.” Ang “gumagawa” ay likas na kaakibat ng sumusunod na “mga dakilang bagay.”
- source_word: גְדֹלוֹת
  choice: mga dakilang bagay
  rationale: 'Ginagamit nang substantibo ang pangmaramihang pang-uri: mga bagay o gawa na dakila. Pinananatili ng “mga dakilang bagay” ang lawak ng pahayag.'
- source_word: וְלֹא נֵדָע
  choice: na hindi natin nalalaman
  rationale: Malapit ito sa payak na kahulugan ng ידע, “malaman.” Hindi nito pinatitindi ang pahayag tungo sa ganap na kawalan ng kakayahang umunawa.
theological_decisions:
- issue: Saklaw ng kawalang-kaalaman ng tao sa huling sugnay
  choice: Sinasabi ng talata na hindi natin nalalaman ang mga dakilang bagay na ginagawa ng Diyos.
  alternative: Gumagawa ang Diyos ng mga dakilang bagay na hindi natin kayang unawain.
  rationale: Ang tahasang kahulugan ng ידע ay “malaman.” Bagaman ipinahihiwatig ng konteksto ang hangganan ng pagkaunawa ng tao sa kapangyarihan ng Diyos, hindi dapat gawing mas matindi ng salin ang pahayag kaysa sa Hebreo.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “nagpapakulog” upang natural na maipahayag ang pandiwang Hebreo habang pinananatili ang “sa kanyang tinig” bilang instrumento. Ang “hindi natin nalalaman” ay sadyang hindi pinalakas tungo sa “hindi natin kayang unawain.”
