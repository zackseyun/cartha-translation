revisions:
- from: Alam mo ba kung paano sila itinatalaga ng Diyos[a], at kung paano niya pinasisilay ang liwanag ng kanyang ulap[b]?
  to: Alam mo ba kung paano inilalagay ng Diyos ang mga ito sa ibabaw nila[a], at kung paano niya pinakikislap ang liwanag ng kanyang ulap[b]?
  rationale: Ibinalik ng rebisyon ang pagkakaiba ng implicit na bagay na inilalagay at ng panghalip na kasunod ng “sa ibabaw,” alinsunod sa Hebreong בְּשׂוּם ... עֲלֵיהֶם at sa English audit trail. Hindi tinutukoy ng “mga ito” o “nila” ang kanilang reperente. Inayos din ang lexical alternative para sa sanhi ng pagkislap ng liwanag.
