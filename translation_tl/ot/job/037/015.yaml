  yaml_path: translation/ot/job/037/015.yaml
  text: Do you know how God lays these upon them[b][a], and causes the light of his cloud to shine?
translation:
  language: tl
  text: Alam mo ba kung paano inilalagay ng Diyos ang mga ito sa ibabaw nila[a], at kung paano niya pinakikislap ang liwanag ng kanyang ulap[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring “kapag inilalagay ng Diyos ang mga ito” o “kung paano itinatakda ng Diyos ang mga ito.” Siksik ang pahayag sa Hebreo: hindi tahasang binabanggit ang inilalagay, at umaasa sa nakapaligid na konteksto ang tinutukoy ng “nila.”'
    reason: alternative_reading
  - marker: b
    text: Maaari ring “pinakikislap ang ningning ng kanyang ulap.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתֵדַע
  choice: Alam mo ba
  rationale: Tuwirang inilalahad ang retorikal na tanong kay Job sa natural na modernong Tagalog.
- source_word: בְּשׂוּם
  choice: kung paano ... itinatalaga
  rationale: Ang ב na may infinitive construct ng שׂום ay maaaring tumukoy sa paraan o kalagayan ng pagtatakda. Ang “itinatalaga” ay nagpapanatili sa di-tiyak na bagay na ipinahihiwatig ng Hebreo at hindi nagdaragdag ng espesipikong penomenong meteorolohikal.
- source_word: אֱלוֹהַּ
  choice: Diyos
  rationale: Karaniwang patulang anyong isahan ito para sa Diyos sa aklat ng Job; walang batayan upang palawakin ang titulo.
- source_word: עֲלֵיהֶם
  choice: sila
  rationale: Sa pandiwang “itinatalaga,” likas sa Tagalog ang tuwirang anyong “sila.” Nananatiling hindi tinutukoy kung sino o ano ang tinutukoy ng panghalip, gaya sa Hebreo.
- source_word: וְהוֹפִיעַ
  choice: at kung paano niya pinasisilay
  rationale: Ipinapahayag ng Hiphil ng יפע ang pagpapalitaw o pagpapasinag ng liwanag. Ang “pinasisilay” ay malinaw na causative at angkop sa biglang ningning na kaugnay ng ulap.
- source_word: אוֹר
  choice: ang liwanag
  rationale: Tuwirang katumbas ng אוֹר at natural kasama ng kasunod na pariralang nag-uugnay rito sa ulap.
- source_word: עֲנָנוֹ
  choice: kanyang ulap
  rationale: Pinananatili ang isahang pangngalan at ang panghalip na tumutukoy sa Diyos; iniiwasan ang interpretatibong “ulap ng bagyo.”
theological_decisions:
- issue: Hindi hayag na layon ng שׂום at hindi tiyak na tinutukoy ng panghalip na “sila”
  choice: Panatilihin ang di-tiyak na “kung paano sila itinatalaga ng Diyos.”
  alternative: “kung paano inilalagay ng Diyos ang mga ito sa ibabaw nila” o “kapag itinatakda ng Diyos ang mga ito”
  rationale: Napakasiksik ng Hebreo at walang tahasang layon ang שׂום; umaasa rin sa konteksto ang עֲלֵיהֶם. Hindi tinukoy ng salin kung ito ay mga ulap, kidlat, utos, o ibang penomeno, upang hindi lutasin ang tunay na kalabuan ng teksto.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “Alam mo ba” para sa tuwirang retorikal na tanong at “pinasisilay” upang ipakita ang causative na anyo nang hindi tiyakang pinangalanan ang kidlat. Ang mga panandang [a] at [b] ay kapuwa nasa pangunahing teksto.
