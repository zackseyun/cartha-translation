base_translation:
  language: en
  yaml_path: translation/ot/job/037/012.yaml
  text: It turns around and around by his guidance[c][b][a], to accomplish all that he commands them over the face of the inhabited world on the earth.
translation:
  language: tl
  text: Umiikot-ikot ito sa ilalim ng Kanyang patnubay,[a][b] upang gawin ang lahat ng ipinag-uutos Niya sa mga ito sa ibabaw ng tinatahang daigdig, sa lupa.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “paulit-ulit na umiikot” o “sa mga paikot na landas”; idiniriin ng Hebreo ang paulit-ulit na paikot na galaw.
    reason: lexical_alternative
  - marker: b
    text: O “sa ilalim ng Kanyang paggabay” o “ayon sa Kanyang pamamatnubay”; ipinahihiwatig ng salitang Hebreo ang mahusay na paggabay o pagkontrol.
    reason: lexical_alternative
  - marker: c
    text: Sa Hebreo, “ang tinatahang daigdig, patungong lupa/patungong lupain”; magkapatong na paglalarawan ito ng mundong panlupa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוּא
  choice: ito
  rationale: Panlalaking panghalip ito sa Hebreo, ngunit ang tinutukoy sa konteksto ay ang ulap o mga penomenong meteorolohikal; pinananatili ng “ito” ang di-tiyak na reperente nang natural sa Tagalog.
- source_word: מְסִבּוֹת מִתְהַפֵּךְ
  choice: umiikot-ikot
  rationale: Ipinahahayag ng pinagsamang mga salita ang paulit-ulit na pag-ikot at pagbabago ng direksiyon; malinaw at natural itong naihahatid ng “umiikot-ikot.”
- source_word: בְּתַחְבֻּלֹתוֹ
  choice: ayon sa kanyang patnubay
  rationale: Maaaring tumukoy ang pangngalan sa mahusay na paggabay, pagpipiloto, o pagkontrol. Ang “patnubay” ay angkop sa konteksto ng Diyos na pumapatnubay sa mga ulap o panahon.
- source_word: לְפָעֳלָם
  choice: upang isagawa
  rationale: 'Ipinakikita ng anyong ito ang layunin: isagawa ng mga penomenong tinutukoy ang iniatas sa kanila.'
- source_word: כֹּל אֲשֶׁר יְצַוֵּם
  choice: ang lahat ng iniuutos niya sa mga iyon
  rationale: Pinananatili nito ang saklaw ng כֹּל אֲשֶׁר at ang maramihang layon ng pandiwang “iniuutos,” na malamang na tumutukoy sa mga ulap o iba pang ahente ng panahon.
- source_word: עַל־פְּנֵי תֵבֵל אָרְצָה
  choice: sa ibabaw ng daigdig na tinatahanan, sa lupa
  rationale: Pinananatili nito ang larawang “sa ibabaw” at ang patong-patong na pagtukoy ng Hebreo sa tinatahanang daigdig at sa lupa, nang hindi ganap na pinapawi ang bahagyang kalabisan ng orihinal.
theological_decisions:
- issue: Ang tinutukoy ng isahang panghalip at ng kasunod na maramihang hulapi
  choice: Iniwan itong malawak bilang ulap o penomenong meteorolohikal na pinamamahalaan ng Diyos.
  alternative: Tukuyin ito nang tahasan bilang isang kumpol ng ulap, kidlat, o sistema ng bagyo.
  rationale: Tinatalakay ng kalapit na konteksto ang mga ulap, kidlat, at bagyo bilang mga kasangkapan sa pamamahala ng Diyos. Hindi sapat ang talata upang paliitin pa ang reperente.
translation_notes:
  register: Makabago at marangal na Filipino; pinanatili ang di-tiyak na reperente ng “ito” at ang maramihang “mga iyon.” Ginamit ang “daigdig na tinatahanan” upang maipakita ang diwa ng תֵבֵל, habang ang kuwit bago “sa lupa” ay nagpapanatili sa layered at bahagyang paulit-ulit na ekspresyon ng Hebreo.
