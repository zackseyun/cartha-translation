  text: הֲ֭/תֵדַע עַל מִפְלְשֵׂי עָ֑ב מִ֝פְלְא֗וֹת תְּמִ֣ים דֵּעִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/037/016.yaml
  text: Do you know about the balancing of the clouds[a], the wonders of one perfect in knowledge?
translation:
  language: tl
  text: Alam mo ba ang pagkakabalanse ng mga ulap[a], ang mga kababalaghan ng may ganap na kaalaman?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pagkakalatag ng mga ulap.” Bihira ang salitang Hebreo, at hindi tiyak ang eksaktong diwa nito; malamang na tumutukoy ito sa pagkakalatag o pagkakasuspinde ng mga ulap sa langit.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתֵדַע
  choice: Alam mo ba
  rationale: Tuwirang pinananatili ang retorikal na tanong at ang karaniwang diwa ng ידע nang hindi dinaragdagan ng ideya ng mas malalim na pagkaunawa.
- source_word: עַל
  choice: kung paano
  rationale: Sa natural na Filipino, ipinakikilala nito ang bagay na itinatanong tungkol sa kaalaman; iniaangkop ang parirala upang maging malinaw at hindi pilit.
- source_word: מִפְלְשֵׂי עָב
  choice: nakabalanse ang mga ulap
  rationale: Ipinahihiwatig ang pagkakapirme o pagkakasuspinde ng mga ulap sa langit. Dahil bihira at di-tiyak ang salitang Hebreo, inilalahad sa talababa ang alternatibong 'nakalatag.'
- source_word: מִפְלְאוֹת
  choice: mga kamangha-manghang gawa
  rationale: Natural at marangal na katumbas na tumutukoy sa pambihirang mga gawa o penomenon.
- source_word: תְּמִים
  choice: ganap
  rationale: Ipinapahayag ang kabuuan o kasakdalan, at mas natural sa pariralang Filipino kaysa sa 'perpekto'.
- source_word: דֵּעִים
  choice: sa kaalaman
  rationale: Ang anyong maramihan sa Hebreo ay malamang na nagpapahiwatig ng lubos o saganang kaalaman; ang pang-isahang abstraktong anyo ang likas sa Filipino.
theological_decisions:
- issue: Ang tinutukoy ng “niya na ganap sa kaalaman”
  choice: Hindi tahasang pinangalanan; hinahayaang tukuyin ng konteksto bilang Diyos
  alternative: Isingit ang “Diyos,” o unawain bilang isang marunong na tao o di-tuwirang pagtukoy ni Elihu sa sarili
  rationale: Sa konteksto ng kapangyarihan sa panahon at sangnilikha, natural itong tumutukoy sa Diyos, ngunit hindi tahasang nakalagay ang pangalan sa Hebreo. Pinananatili ng salin ang implicit na pagtukoy at ang anyo ng pinagmulan.
translation_notes:
  register: Makabagong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “nakabalanse” bilang malinaw na larawan ng mga ulap na wari’y nakabitin sa langit, habang pinananatili sa talababa ang leksikal na kawalang-katiyakan. Ang gitling na em dash ay nag-uugnay sa penomenon ng mga ulap sa mga kamangha-manghang gawa ng hindi tahasang pinangalanang Diyos.
