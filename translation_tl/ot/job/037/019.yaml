  yaml_path: translation/ot/job/037/019.yaml
  text: Teach us what we should say to him[b][a]; we cannot arrange our words because of darkness.
translation:
  language: tl
  text: Ituro mo sa amin kung ano ang dapat naming sabihin sa kanya; hindi namin maisaayos ang aming sasabihin[a] dahil sa kadiliman.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “hindi namin maihanay ang aming mga salita” o “hindi namin maisaayos ang aming usapin.”
    reason: lexical_alternative
  - marker: b
    text: Maaaring matalinghagang tumukoy ang “kadiliman” sa kakulangan ng pagkaunawa o kakayahan ng tao, bagaman posible rin ang literal na diwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹדִיעֵנוּ
  choice: Ituro mo sa amin
  rationale: Ang Hiphil na pautos ng ידע ay nangangahulugang “ipaalam” o “ipaunawa.” Sa konteksto, natural sa modernong Tagalog ang “Ituro mo sa amin” bilang paghingi ng tagubilin.
- source_word: מַה נֹּאמַר לוֹ
  choice: kung ano ang dapat naming sabihin sa kanya
  rationale: Ipinahahayag ng “dapat naming sabihin” ang deliberatibong diwa ng Hebreo nang natural, habang pinananatili ang panghalip na “sa kanya” nang hindi tahasang pinapangalanan ang tinutukoy.
- source_word: לֹא נַעֲרֹךְ
  choice: hindi namin maisaayos ang aming sasabihin
  rationale: Ang ערך ay “ayusin” o “ihanay.” Idinagdag ang “ang aming sasabihin” bilang likas na ipinahihiwatig na layon sa Tagalog, ngunit hindi ito pinalawak agad bilang isang pormal na usapin o kaso.
- source_word: מִפְּנֵי חֹשֶׁךְ
  choice: dahil sa kadiliman
  rationale: Karaniwang ipinahahayag ng מִפְּנֵי ang sanhi. Pinananatili ng “kadiliman” ang masinsin at maaaring literal o matalinghagang larawan ng Hebreo.
theological_decisions:
- issue: Kahulugan ng “kadiliman” sa huling parirala
  choice: Panatilihin ang malawak na salitang “kadiliman” nang hindi ipinapaliwanag ang tiyak na kahulugan.
  alternative: dahil sa aming kamangmangan; dahil madilim
  rationale: Maaaring tumukoy ang larawan sa kakulangan ng pagkaunawa o kakayahan ng tao, ngunit posible rin ang mas literal na diwa. Hindi nilulutas ng salin ang sinadyang pagiging masinsin ng Hebreo.
- issue: Tinutukoy ng panghalip na לוֹ
  choice: sa kanya
  alternative: sa Diyos
  rationale: Bagaman malamang na Diyos ang tinutukoy sa konteksto, panghalip lamang ang nasa Hebreo. Pinananatili ng salin ang anyo at bahagyang di-tiyak na pagtukoy ng pinagmulan.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “aming sasabihin” upang maging likas ang pangungusap habang nananatiling malapit sa larawang “pag-aayos” ng mga salita; iniwasang gawing tahasang legal ang parirala. Ang mga panghalip at ang “kadiliman” ay sadyang hindi pinalawak upang mapanatili ang tunay na kalabuan ng Hebreo.
