  yaml_path: translation/ot/job/037/021.yaml
  text: And now they do not see the light[a], bright though it is in the skies[b]; but a wind passes by and clears them.
translation:
  language: tl
  text: At ngayon, hindi nila nakikita ang liwanag[a], bagama’t maningning ito sa kalangitan[b]; ngunit dumaraan ang hangin at nililinaw nito ang mga iyon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “hindi nila nakita ang liwanag na maningning sa kalangitan.” Masinsin ang pagkakasunod-sunod ng mga salita sa Hebreo at maaari itong unawain nang walang diwang “bagaman.”
    reason: alternative_reading
  - marker: b
    text: Maramihan ang panghalip sa “nililinaw nito ang mga iyon,” at malamang na tumutukoy ito sa kalangitan o sa mga ulap. Maaari ring unawain ang pangkalahatang diwa bilang “nililinaw nito ang kalangitan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: At ngayon
  rationale: Pinananatili ang pang-ugnay na ו at ang panandang temporal na עַתָּה sa natural na Filipino.
- source_word: לֹא רָאוּ
  choice: hindi nila nakikita
  rationale: Ang Qal perfect na ikatlong panauhang maramihan ay maaaring maglarawan ng kasalukuyang kalagayan dito. Pinananatili rin ang di-tiyak na maramihang simuno ng Hebreo.
- source_word: אוֹר
  choice: ang liwanag
  rationale: Hindi ito pinaliit sa 'sikat ng araw,' sapagkat ang Hebreo ay pangkalahatang 'liwanag.'
- source_word: בָּהִיר הוּא
  choice: bagama't maningning ito
  rationale: 'Ipinahahayag ang malamang na pagsalungat: naroon at maningning ang liwanag ngunit hindi ito nakikita. Inilalahad sa talababa ang posibleng di-konsebidong pagbasa.'
- source_word: בַּשְּׁחָקִים
  choice: sa kalangitan
  rationale: Ang שׁחקים ay maaaring tumukoy sa himpapawid o mga ulap; ang 'kalangitan' ay marangal at hindi labis na nagpapakitid sa larawan.
- source_word: וְרוּחַ
  choice: ngunit ... ang hangin
  rationale: Meteorolohikal na hangin ang tinutukoy, hindi espiritu. Ang 'ngunit' ay nagpapakita ng pagbabago sa lagay na dulot nito; hindi nangangailangan ang Filipino ng pantukoy na katumbas ng English na 'a.'
- source_word: עָבְרָה
  choice: dumaraan
  rationale: Nagbibigay ng buhay na kasalukuyang paglalarawan sa pagdaan ng hangin.
- source_word: וַתְּטַהֲרֵם
  choice: at nililinaw ang mga iyon
  rationale: Ang טהר ay nangangahulugang gawing malinis o malinaw. Pinananatili ng 'mga iyon' ang maramihang hulaping Hebreo, kahit hindi ganap na tahasang tinutukoy ang antecedent.
