translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Pinanatili ang matingkad na larawang pisikal ng pusong nanginginig at lumulukso, gayundin ang posibleng sanhi ng reaksiyon sa “Dahil din dito.”
