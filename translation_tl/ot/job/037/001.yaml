  yaml_path: translation/ot/job/037/001.yaml
  text: At this also my heart trembles and leaps from its place[a][b].
translation:
  language: tl
  text: Dahil din dito, nanginginig ang puso ko[a] at lumulukso mula sa kinalalagyan nito[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nayanig”; ang pandiwang Hebreo ay maaaring tumukoy sa panginginig dahil sa takot, paghanga, o pagkabagabag.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “tumatalon palabas sa kinalalagyan nito”; matingkad na inilalarawan ng pananalitang Hebreo ang puso na tila biglang naalis sa puwesto.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַף לְזֹאת
  choice: Dahil din dito
  rationale: Pinagsasama nito ang pang-ugnay at pampatinding diwa ng אַף at ang sanhi o bagay na tinutukoy ng לְזֹאת. Likas ito sa Filipino at inuugnay ang reaksiyon sa kababalaghang naunang binanggit.
- source_word: יֶחֱרַד
  choice: nanginginig
  rationale: Saklaw nito ang panginginig dahil sa takot, paghanga, o matinding pagkabagabag nang hindi nililimitahan ang dahilan sa takot lamang.
- source_word: לִבִּי
  choice: ang puso ko
  rationale: Pinananatili ang konkretong larawan ng Hebreo at ang diwa ng puso bilang kalooban at damdamin ng tao.
- source_word: וְיִתַּר
  choice: at lumulukso
  rationale: Inilalarawan ng mahirap na pandiwang ito ang bigla at marahas na paggalaw ng puso. Pinananatili ng “lumulukso” ang masiglang talinghaga.
- source_word: מִמְּקוֹמוֹ
  choice: mula sa kinalalagyan nito
  rationale: Tumutukoy ang hulapi sa puso at inilalarawan itong tila naaalis sa karaniwang puwesto nito; malinaw at likas ang parirala sa modernong Filipino.
