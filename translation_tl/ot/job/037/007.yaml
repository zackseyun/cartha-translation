  text: He seals the hand of every man[b][a], so that all men may know his work.
translation:
  language: tl
  text: Tinatatakan niya ang kamay ng bawat tao[b][a], upang malaman ng lahat ng tao ang kanyang gawa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Nilalagyan niya ng tatak ang kamay ng bawat tao.” Malamang na ang Hebreong pananalita ay nangangahulugang pinatitigil ng Diyos ang karaniwang gawain ng tao.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, literal na “bawat tao” at “lahat ng lalaki”; pangkalahatang tumutukoy ang mga pananalitang ito sa sangkatauhan.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּיַד
  choice: ang kamay
  rationale: Bagaman may pang-ukol na ב, likas sa Filipino na gawing tuwirang layon ng pandiwang “tinatatakan” ang “kamay.” Pinananatili nito ang mahirap na talinghaga ng Hebreo.
- source_word: כָּל אָדָם
  choice: bawat tao
  rationale: Ang אָדָם ay pangkalahatang tumutukoy sa sinumang tao; malinaw at inklusibo ang “bawat tao” sa modernong Filipino.
- source_word: יַחְתּוֹם
  choice: tinatatakan niya
  rationale: Ang Qal ng חתם ay “tatakan” o “lagyan ng tatak.” Pinananatili ng “tinatatakan” ang talinghaga nang hindi ipinapasok sa pangunahing teksto ang ipinahihiwatig na pagpapatigil sa paggawa.
- source_word: לָדַעַת
  choice: upang makilala
  rationale: Ipinahahayag ng infinitive na may ל ang layunin o bunga. Ang “upang” ay likas na panandang Filipino para rito; ang “makilala” ay maaaring tumukoy sa pagkilala o pag-unawa sa gawa ng Diyos.
- source_word: כָּל אַנְשֵׁי
  choice: lahat ng tao
  rationale: Pangkalahatan ang tinutukoy ng parirala, kaya ang “lahat ng tao” ay tumpak at natural, at pinananatili ang pagkakatulad nito sa “bawat tao.”
- source_word: מַעֲשֵׂהוּ
  choice: ang kanyang gawa
  rationale: Tuwirang tinutumbasan ng “kanyang gawa” ang pangngalang isahan na may hulaping ikatlong panauhang panlalaki. Sa konteksto, ang tinutukoy ay ang gawain ng Diyos.
theological_decisions:
- issue: Tinutukoy ng ikatlong panauhang isahan sa “tinatatakan niya” at “kanyang gawa”
  choice: Ang Diyos ang simuno at may-ari ng gawa.
  alternative: Ang bagyo o panahon ang gumaganap, o hindi tiyak ang simuno.
  rationale: Sa talumpati ni Elihu tungkol sa pamamahala ng Diyos sa panahon at sangnilikha, ang Diyos ang pinakamalinaw na antecedent. Hindi na pinangalanan ang Diyos sa talata upang mapanatili ang anyo ng Hebreo.
- issue: Kahulugan ng pagtatatak sa kamay
  choice: Pinanatili sa pangunahing teksto ang talinghagang “tinatatakan ... ang kamay.”
  alternative: “Pinatitigil niya ang gawain ng bawat tao.”
  rationale: Malamang na ipinahihiwatig ng idyoma ang pagpapatigil ng karaniwang paggawa, ngunit hindi ito tahasang sinasabi ng Hebreo. Inilagay ang paliwanag bilang talababa upang mapanatili ang tunay na hirap at pahiwatig ng teksto.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Pinanatili ang konkretong talinghaga ng pagtatatak sa kamay at gumamit ng inklusibong “tao” para sa mga pangkalahatang katawagang Hebreo.
