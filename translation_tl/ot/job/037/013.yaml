base_translation:
  language: en
  yaml_path: translation/ot/job/037/013.yaml
  text: Whether for correction[a], or for his land, or for steadfast love[c][b], he causes it to happen.
translation:
  language: tl
  text: Maging para sa pagdidisiplina[a], maging para sa kanyang lupain, o para sa tapat na pag-ibig[b], kanyang pinangyayari ito.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “para sa pamalo,” samakatuwid, para sa parusa o pagwawasto.
    reason: lexical_alternative
  - marker: b
    text: O “para sa awa” o “para sa kabutihan.”
    reason: lexical_alternative
  - marker: c
    text: Maaari ring isalin ang pandiwang Hebreo na “pinangyayari niyang dumating ito” o “isinasagawa niya ito.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: maging
  rationale: Sa tatlong ulit na pagkakagamit, naghahayag ang אִם ng magkakaibang maaaring layunin o bunga, hindi ng karaniwang kondisyong ‘kung.’ Likas sa Filipino ang ‘maging … o …’ para sa ganitong hanay.
- source_word: לְשֵׁבֶט
  choice: para sa pagdidisiplina
  rationale: Literal na ‘para sa pamalo,’ ngunit metonimiko rito ang שֵׁבֶט para sa pagpaparusa o pagdidisiplina. Pinananatili ng ‘pagdidisiplina’ ang saklaw nang hindi ipinapalagay na parusa lamang ang tinutukoy.
- source_word: לְאַרְצוֹ
  choice: para sa kanyang lupain
  rationale: Ang אֶרֶץ ay maaaring ‘lupain’ o ‘daigdig.’ Ang ‘kanyang lupain’ ay tuwirang kumakatawan sa anyong may ikatlong panauhang panlalaking pang-isahang hulapi at akma sa konteksto ng pamamahala ng Diyos sa panahon.
- source_word: לְחֶסֶד
  choice: para sa tapat na pag-ibig
  rationale: Ang חֶסֶד ay mayaman sa diwa ng matatag na pag-ibig, kabutihan, at awa. Mas napapanatili ng ‘tapat na pag-ibig’ ang bigat nito kaysa sa mas makitid na isang-salitang katumbas.
- source_word: יַמְצִאֵהוּ
  choice: pinangyayari niya ito
  rationale: Ang Hiphil ng מצא ay causative rito. Natural sa Filipino ang ‘pinangyayari niya ito,’ samantalang ang hulaping layon ay inilalarawan ng ‘ito’ at tumutukoy sa penomenong binabanggit sa kalapit na konteksto.
theological_decisions:
- issue: Ang diwa ng tatlong pariralang pinangungunahan ng אִם
  choice: 'Inililista ng talata ang magkakaibang maaaring layunin ng Diyos sa penomeno ng panahon: pagdidisiplina, kapakinabangan ng kanyang lupain, o tapat na pag-ibig.'
  alternative: Maaaring unawain ang mga parirala bilang mga patutunguhan sa halip na mga layunin, o ang una bilang tahasang maparusahang paghatol.
  rationale: Sa konteksto ng pamamahala ng Diyos sa mga ulap at bagyo, pinakamalamang na nagsasaad ng layunin o bunga ang לְ sa tatlong parirala. Hindi nililimitahan ng salin ang kilos ng Diyos sa poot lamang o sa pagpapala lamang.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang ‘maging … o …’ upang natural na katawanin ang tatlong alternatibo, at pinanatili ang reperensiyang ‘ito’ upang hindi tahasang pangalanan ang penomenong hindi inuulit sa mismong talata.
