  text: Then the wild animal enters its lair[a], and remains in its dens.
translation:
  language: tl
  text: Saka pumapasok ang mabangis na hayop sa lungga nito[a] at nananatili sa mga tirahan nito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa pinagtataguan nito.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּבֹא
  choice: Kaya pumapasok
  rationale: Ang Qal wayyiqtol ng בוא ay nagsusulong sa sunod-sunod na paglalarawan. Ang “Kaya pumapasok” ay natural sa Filipino at ipinahihiwatig na ang pagpasok ay tugon sa lagay ng panahon.
- source_word: חַיָּה
  choice: ang mabangis na hayop
  rationale: Maaaring tumukoy ang חַיָּה sa hayop sa pangkalahatan o sa mailap/mabangis na hayop. Dito, generic ang gamit at hindi tumutukoy sa isang tiyak na uri.
- source_word: בְמוֹ אָרֶב
  choice: sa lungga nito
  rationale: Ang אָרֶב ay lugar na pinagtataguan o pinagbabantayan ng hayop. Malinaw at karaniwan sa modernong Filipino ang “lungga,” habang pinananatili ng talababa ang mas literal na alternatibo.
- source_word: וּבִמְעוֹנֹתֶיהָ
  choice: at ... sa mga tirahan nito
  rationale: Ang מְעוֹנוֹת ay maramihang mga tirahan. Pinananatili ng “mga tirahan” ang plural at iniiwasang gawing magkapareho ang kahulugan nito at ng naunang אָרֶב.
- source_word: תִשְׁכֹּן
  choice: nananatili
  rationale: Ang שכן ay nangangahulugang manirahan o manatili. Sa konteksto ng hayop na sumisilong dahil sa panahon, malinaw na ipinapahayag ng “nananatili” ang patuloy nitong pamamalagi roon.
