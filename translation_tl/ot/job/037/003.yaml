  text: Under all the heavens he sends it out[b][a], and his lightning to the ends of the earth.
translation:
  language: tl
  text: Sa ilalim ng buong kalangitan ay ipinadadala niya ito, at ang kanyang kidlat ay umaabot hanggang sa mga dulo ng lupa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O kaya, “at ang kanyang liwanag sa mga pakpak ng lupa.” Ang “mga pakpak ng lupa” ay isang matalinghagang pahayag para sa mga dulo o malalayong hangganan nito; sa konteksto, ang “liwanag” ay malamang na tumutukoy sa kidlat.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּחַת כָּל הַשָּׁמַיִם
  choice: Sa ilalim ng buong kalangitan
  rationale: Pinananatili nito ang larawang panlunan ng Hebreong ‘sa ilalim ng lahat ng kalangitan,’ ngunit gumagamit ng likas at marangal na modernong Tagalog.
- source_word: יִשְׁרֵהוּ
  choice: ay ipinadadala niya iyon
  rationale: Ang pandiwa at hulaping panghalip ay nagpapahiwatig ng pagpapalabas o pagpapadala ng isang bagay na nauna nang tinutukoy. Pinananatili ng ‘iyon’ ang bahagyang di-tiyak na reperensiya ng Hebreo sa konteksto ng bagyo.
- source_word: וְאוֹרוֹ
  choice: at ang kanyang kidlat
  rationale: Literal na ‘at ang kanyang liwanag,’ ngunit sa konteksto ng bagyo ay malamang na tumutukoy sa kidlat. Ang ‘kidlat’ ang malinaw at likas na salin, habang inilalagay sa talababa ang literal na alternatibo.
- source_word: עַל כַּנְפוֹת הָאָרֶץ
  choice: hanggang sa mga dulo ng lupa
  rationale: Literal itong ‘sa ibabaw ng mga pakpak ng lupa,’ isang matalinghagang pahayag para sa malalayong hangganan o dulo ng lupa. Ang ‘hanggang sa mga dulo ng lupa’ ay natural na naghahatid ng lawak na tinutukoy.
theological_decisions: []
translation_notes:
  register: Makabagong Filipino Tagalog na may dignidad at bahagyang patulang himig. Iniwasan ang sobrang literal na ‘mga pakpak ng lupa’ sa pangunahing teksto, ngunit pinanatili ito sa talababa kasama ng literal na ‘liwanag.’
