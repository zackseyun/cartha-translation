  text: Anong laki ng naitulong mo sa taong walang lakas! Anong laki ng nailigtas mo—isang bisig na walang lakas![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O, mas literal: “Ano ang naitulong mo sa taong walang lakas? Ano ang nailigtas mo—isang bisig na walang lakas?” Matalim na mapanukso ang Hebreo.'
