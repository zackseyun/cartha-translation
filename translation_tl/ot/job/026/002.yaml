lexical_decisions:
- source_word: מֶה
  choice: Talagang
  rationale: Ginamit bilang padamdam na retorikal upang maiparinig sa natural na Filipino ang matalim na panunuya ni Job. Hindi ito simpleng tanong na humihingi ng paliwanag.
- source_word: עָזַרְתָּ
  choice: natulungan mo
  rationale: Tuwirang katumbas ng pandiwang ‘tumulong’; ipinahahayag ang kilos bilang nagawa na at tuwirang iniuukol kay Bildad.
- source_word: לְלֹא כֹחַ
  choice: ang walang lakas
  rationale: Pinananatili ang isahang di-tiyak na tinutukoy ng Hebreo at ang kawalan ng kakayahan, nang hindi nililinaw kung si Job mismo o isang karaniwang taong mahina ang tinutukoy.
- source_word: הוֹשַׁעְתָּ
  choice: nailigtas mo
  rationale: Pinananatili ang pangunahing diwa ng ישׁע na ‘magligtas’ o ‘maghatid sa kaligtasan,’ at ang paralelismo sa unang sugnay.
- source_word: זְרוֹעַ
  choice: bisig
  rationale: Pinananatili ang konkretong larawang Hebreo ng bisig bilang sagisag ng lakas, sa halip na palitan agad ng abstraktong ‘kapangyarihan.’
- source_word: לֹא עֹז
  choice: walang lakas
  rationale: Likas at malinaw na katumbas ng kawalan ng lakas o kapangyarihan. Ang pag-uulit ng ‘lakas’ ay madaling maunawaan at nagpapatindi sa kabalintunaan ng bisig na walang lakas.
