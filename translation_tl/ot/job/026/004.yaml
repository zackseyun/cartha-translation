  text: To whom have you declared words[a], and whose breath has come out from you?
translation:
  language: tl
  text: Kanino mo ipinahayag ang mga salita, at kaninong hininga ang lumabas mula sa iyo?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kaninong espiritu ang lumabas mula sa iyo?” Ang salitang Hebreo ay maaaring mangahulugang “hininga” o, sa ilang konteksto, “espiritu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶת מִי
  choice: Kanino
  rationale: Likas na ipinahahayag sa Tagalog ang taong pinagsabihan o pinagpahayagan sa pamamagitan ng “kanino,” habang pinananatili ang retorikal na tanong.
- source_word: הִגַּדְתָּ
  choice: mo ipinahayag
  rationale: Ang Hiphil ng נגד ay nangangahulugang magsabi, magpahayag, o magbigay-alam. Ang “ipinahayag” ay angkop sa marangal na tonong patula.
- source_word: מִלִּין
  choice: ang mga salitang ito
  rationale: Ang Aramaikong anyong pangmaramihan ay tumutukoy sa mga binigkas na salita. Idinagdag ang “ito” bilang likas na pantukoy sa Tagalog sa kontekstong tinutukoy ni Job ang kasasabi lamang ni Bildad, bagaman walang tahasang demonstratibo sa Hebreo.
- source_word: וְנִשְׁמַת מִי
  choice: at kaninong hininga
  rationale: Maaaring mangahulugan ang נשמה ng “hininga” o, sa ilang konteksto, “espiritu.” Pinananatili ng “hininga” ang kongkretong larawang may lumalabas mula sa nagsasalita.
- source_word: יָצְאָה מִמֶּךָּ
  choice: ang lumabas mula sa iyo
  rationale: Tuwirang pinananatili nito ang metapora ng Hebreong יצא, “lumabas,” at hindi ipinapasiya kung ang tinutukoy ay pananalita, inspirasyon, o espiritu.
theological_decisions:
- issue: Pagkakakilanlan ng hininga o espiritung lumabas kay Bildad
  choice: Pinanatili sa pangunahing teksto ang “hininga” at hindi tinukoy kung kanino ito nagmula.
  alternative: “kaninong espiritu ang nagmula sa iyo?”
  rationale: Sadyang nagtatanong ang Hebreo nang hindi sinasagot kung sarili, tao, o ibang pinagmulan ang nasa isip; hindi dapat lutasin sa salin ang retorikal at teolohikal na tensiyong ito.
translation_notes:
  register: Makabago ngunit marangal na Filipino, na may tuwirang retorikal na tanong at bahagyang patulang himig. Ginamit ang “hininga” sa teksto upang mapanatili ang kongkretong larawan at ang talab ng posibleng kahulugang “espiritu.”
