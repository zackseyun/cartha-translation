lexical_decisions:
- source_word: וַיַּעַן
  choice: sumagot
  rationale: Ang qal na ענה na may waw-consecutive ay karaniwang nagpapakilala ng tugon sa isang pag-uusap. Likas at malinaw sa modernong Tagalog ang “sumagot.”
- source_word: אִיּוֹב
  choice: Job
  rationale: Ginamit ang nakaugaliang anyo ng pangalang ito sa mga saling Tagalog.
- source_word: וַיֹּאמַר
  choice: at sinabi
  rationale: Pinanatili ang dalawang pandiwa sa karaniwang Hebreong pormula ng pagsasalaysay at pagsasalita, sa halip na pagsamahin ang mga ito sa iisang pandiwa.
- source_word: וַ
  choice: Pagkatapos
  rationale: Ipinahihiwatig ng panimulang waw-consecutive ang pagsulong at pagkakasunod-sunod ng diskurso. Natural itong ipinapahayag sa Tagalog sa pamamagitan ng “Pagkatapos.”
