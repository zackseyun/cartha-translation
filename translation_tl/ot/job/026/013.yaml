  yaml_path: translation/ot/job/026/013.yaml
  text: By his breath the heavens are made fair[c][b][a]; his hand pierced the fleeing serpent.
translation:
  language: tl
  text: Sa pamamagitan ng kanyang hininga[a], ginawa niyang marilag ang kalangitan; tinuhog[b] ng kanyang kamay ang tumatakas na ahas.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kanyang Espiritu” o “kanyang hangin.” Ang salitang Hebreo ay maaaring mangahulugang hininga, hangin, o espiritu.
    reason: lexical_alternative
  - marker: b
    text: O “Hinubog ng kanyang kamay ang tumatakas na ahas.” Maaaring unawain sa ibang paraan ang pandiwang Hebreo, ngunit ang “tinuhog” ay angkop sa larawang labanan sa taludtod.
    reason: alternative_reading
  - marker: c
    text: Malamang na ang “tumatakas na ahas” ay nagpapahiwatig ng isang kosmikong ahas ng kaguluhan; ihambing ang Isaias 27:1.
    reason: cross_reference
lexical_decisions:
- source_word: בְּרוּחוֹ
  choice: sa pamamagitan ng kanyang hininga
  rationale: Maaaring mangahulugan ang רוּחַ ng hininga, hangin, o espiritu. Pinananatili ng “hininga” ang malinaw na larawang patula at ang gamit ng ב bilang pananda ng kasangkapan, nang hindi ipinipilit ang isang tiyak na teolohikal na pagbasa.
- source_word: שָׁמַיִם
  choice: ang kalangitan
  rationale: Ang “kalangitan” ay likas at marangal na katumbas sa makatang kontekstong kosmolohikal, at naihahatid ang kolektibong diwa ng anyong Hebreong maramihan.
- source_word: שִׁפְרָה
  choice: naging marilag
  rationale: Ipinahahayag ng ugat שׁפר ang kagandahan, kaningningan, o kaliwanagan. Ang “naging marilag” ay natural sa Filipino at pinananatili ang resultang kalagayan ng kalangitan nang hindi nililimitahan ang kahulugan sa liwanag lamang.
- source_word: חֹלֲלָה
  choice: tinuhog
  rationale: Sa larawang labanan ng taludtod, ang “tinuhog” ay mahusay na naghahatid ng posibleng kahulugang ‘pierced’ at nagpapanatili ng marahas at kongkretong kilos. Inilalagay sa talababa ang ibang posibleng pagkaunawa sa pandiwa.
- source_word: יָדוֹ
  choice: ng kanyang kamay
  rationale: Tuwirang pinananatili ang kongkretong larawan ng kamay bilang kapahayagan ng aktibong kapangyarihan.
- source_word: נָחָשׁ בָּרִיחַ
  choice: ang tumatakas na ahas
  rationale: Pinananatili nito ang pinakamatibay na posibleng diwa ng בָּרִיחַ sa kosmikong larawang ito at hindi tahasang kinikilala ang ahas bilang isang partikular na teolohikal na persona.
theological_decisions:
- issue: Kung ang רוּחַ ay dapat isaling “Espiritu” at unawain bilang tahasang pagtukoy sa isang natatanging persona
  choice: “Hininga” sa pangunahing teksto, kasama ang mga alternatibo sa talababa
  alternative: “Espiritu” o “hangin”
  rationale: Hindi hinihingi ng Hebreo sa kontekstong ito ang tahasang personal o Trinitaryong pagbasa. Pinananatili ng salin at talababa ang tunay na saklaw at tensiyon ng salita.
- issue: Kung ang נָחָשׁ בָּרִיחַ ay dapat tahasang kilalanin bilang si Satanas o Leviatan
  choice: Pinanatili bilang “ang tumatakas na ahas”
  alternative: “Leviatan,” “ahas ng kaguluhan,” o “Satanas”
  rationale: Kosmikong larawang labanan ang ipinahihiwatig ng taludtod, ngunit hindi nito tahasang pinapangalanan ang ahas bilang si Satanas o Leviatan. Kaya hindi nilulutas ng pangunahing teksto ang pagkakakilanlan nito.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “kalangitan” at “marilag” upang mapanatili ang mataas na uring patula, samantalang nananatiling malinaw sa karaniwang mambabasa. Iniwasan ang tahasang denominasyonal o sistematikong pagpapakahulugan.
