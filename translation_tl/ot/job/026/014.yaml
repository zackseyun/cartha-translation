  terminology: Ang “Narito,” “mga daan,” “bulong,” “dagundong,” “kapangyarihan,” at “makauunawa” ay angkop sa marangal ngunit modernong rehistro. Pinananatili ng “bulong” at “dagundong” ang mahalagang pandinig na pagtutunggali ng tula.
