base_translation:
  language: en
  yaml_path: translation/ot/job/026/014.yaml
  text: Look[a], these are the fringes of his ways[b], and what a mere whisper we hear of him! But the thunder of his power—who can understand it?
translation:
  language: tl
  text: Narito, ang mga ito ay mga dulo lamang ng kanyang mga daan[a], at napakahinang bulong lamang ang naririnig natin tungkol sa kanya![b] Ngunit ang dagundong ng kanyang kapangyarihan—sino ang makauunawa?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga gilid” o “mga panlabas na bahagi ng kanyang mga daan.” Ipinahihiwatig ng Hebreo na ang tinutukoy ay ang pinakapanlabas lamang na bahagi ng mga daan ng Diyos.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “napakaliit na pahiwatig lamang ang naririnig natin tungkol sa kanya.” Bihira ang pariralang Hebreo at idiniriin nito kung gaano kaliit ang naririnig kung ihahambing sa “dagundong” ng kanyang kapangyarihan.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶן
  choice: Narito
  rationale: Isang pantawag-pansin na may diin; marangal at likas sa makabagong salin ng tulang biblikal.
- source_word: קְצוֹת
  choice: mga gilid lamang
  rationale: Ipinahihiwatig ang mga dulo o panlabas na bahagi lamang ng nakikitang pagkilos ng Diyos; nililinaw ng “lamang” ang paghahambing sa kabuuan ng kanyang kapangyarihan.
- source_word: דְּרָכָיו
  choice: kanyang mga daan
  rationale: Pinananatili ang metapora ng Hebreo para sa paraan at pagkilos ng Diyos nang hindi ito nililimitahan sa “mga gawa.”
- source_word: שֵׁמֶץ דָּבָר
  choice: napakahinang bulong lamang
  rationale: Ang bihirang parirala ay nagpapahiwatig ng napakaliit o halos di-marinig na bagay; ang “bulong” ay nagpapanatili sa larawang pandinig na itinatambal sa dagundong.
- source_word: נִשְׁמַע בּוֹ
  choice: ang naririnig natin tungkol sa kanya
  rationale: Likas na Filipino para sa kolektibo o di-tiyak na tagapakinig; “tungkol sa kanya” ang diwa sa konteksto, hindi kinakailangang tuwirang pananalita mula sa kanya.
- source_word: רַעַם
  choice: dagundong
  rationale: Nagpapahayag ng malakas at nakagugulat na tunog ng kulog at mahusay na kasalungat ng “bulong.”
- source_word: גְּבוּרָתוֹ
  choice: kanyang kapangyarihan
  rationale: Tumpak at karaniwang katumbas ng lakas o kapangyarihan, nang walang dagdag na teolohikal na pagpapakahulugan.
- source_word: יִתְבּוֹנָן
  choice: makauunawa
  rationale: Ipinahahayag ang masusing pagkaunawa o pagtalos na hindi kayang lubos na abutin ng tao sa retorikal na tanong.
theological_decisions:
- issue: Lawak ng kaalaman ng tao tungkol sa Diyos sa makatang pahayag
  choice: Ang nakikita at naririnig ng tao ay mga panlabas na bahagi lamang ng mga daan at kapangyarihan ng Diyos.
  alternative: Maaaring unawain ang pahayag nang mas makitid bilang pagtukoy lamang sa mga gawa ng Diyos sa sangnilikha.
  rationale: Naglalahad ang malapit na konteksto ng mga gawa ng Diyos sa kosmos, ngunit hindi tiyak na nililimitahan ng talata roon ang “kanyang mga daan.” Pinananatili ng salin ang limitasyon ng pagkaunawa ng tao nang hindi gumagawa ng mas malawak na sistematikong pahayag.
translation_notes:
  register: Makabago ngunit marangal na Filipino; pinanatili ang makatang pagtutunggali ng mahinang bulong at dagundong. Ginamit ang “Narito” bilang natural na pantawag-pansin at iniwasan ang mga katawagang nakatali sa isang denominasyon.
