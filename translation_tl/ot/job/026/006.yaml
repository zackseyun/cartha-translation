base_translation:
  language: en
  yaml_path: translation/ot/job/026/006.yaml
  text: Sheol lies naked before him[b][a], and Abaddon has no covering.
translation:
  language: tl
  text: 'Hubad ang Sheol sa harap niya,[a]

    at walang pantakip ang Abaddon.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Lantad ang Sheol sa harap niya.”
    reason: lexical_alternative
  - marker: b
    text: Ang Abaddon ay maaari ring isaling “Kapahamakan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עָרוֹם
  choice: Hubad
  rationale: Tuwirang pinananatili ang matalinghagang larawan ng pagiging hubad o lantad; likas din itong kaagapay ng “pantakip” sa ikalawang taludtod.
- source_word: שְׁאוֹל
  choice: Sheol
  rationale: Pinanatili ang transliterasyon upang hindi paliitin ang saklaw ng salitang Hebreo sa “libingan” lamang at upang mapanatili ang larawan ng daigdig ng mga patay sa panulaang karunungan.
- source_word: נֶגְדּוֹ
  choice: sa harap niya
  rationale: Tuwirang salin ng “sa harap niya” o “sa kanyang presensya”; ang tinutukoy ng panghalip ay ang Diyos ayon sa konteksto, nang hindi ito tahasang idinaragdag sa teksto.
- source_word: אֵין
  choice: walang
  rationale: Natural na katumbas sa Tagalog ng konstruksiyong nagsasaad na walang umiiral na pantakip para sa Abaddon.
- source_word: כְּסוּת
  choice: pantakip
  rationale: Pinananatili ang kongkretong metapora ng takip, na tumutugma sa “hubad” sa unang taludtod.
- source_word: אֲבַדּוֹן
  choice: Abaddon
  rationale: Pinanatili bilang transliterasyon sapagkat kapantay ito ng Sheol sa tula at maaaring tumukoy sa dako o personipikasyon ng kapahamakan; iniiwasang gawing abstrakto lamang ang termino.
theological_decisions:
- issue: Tinutukoy ng panlalaking panghalip sa נֶגְדּוֹ
  choice: “niya,” na ayon sa konteksto ay tumutukoy sa Diyos
  alternative: Isang hindi tinukoy na tagamasid
  rationale: Inilalarawan ng konteksto ang kaalaman at kapangyarihan ng Diyos sa mga nakatagong dako. Pinananatili ng “sa harap niya” ang anyo at bahagyang di-tahasang pagtukoy ng Hebreo.
- issue: Pag-unawa sa אֲבַדּוֹן
  choice: Abaddon bilang katawagang kaagapay ng Sheol
  alternative: Kapahamakan o dako ng kapahamakan
  rationale: Ang paralelismo ay pumapabor sa isang katawagang parang pangalan para sa nakatagong dako ng kamatayan, ngunit kinikilala sa talababa ang leksikal na kahulugang “Kapahamakan.”
translation_notes:
  register: Makabagong, marangal, at maikling wikang Filipino na nagpapanatili sa paralelismong patula. Ginamit ang “Hubad” at “pantakip” upang mapanatili ang magkatuwang na kongkretong larawan ng Hebreo. Ang mga pangalang Sheol at Abaddon ay hindi isinalin sa pangunahing teksto upang mapanatili ang natatanging konseptuwal at panulaang bisa ng mga ito.
