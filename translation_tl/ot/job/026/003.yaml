  text: How you have counseled one without wisdom[a], and made sound wisdom known abundantly!
translation:
  language: tl
  text: Kay husay mong nagpayo sa taong walang karunungan,[a] at sagana mong ipinaalam ang wastong karunungan!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Anong payo ang ibinigay mo sa taong walang karunungan, at sagana mong ipinaalam ang wastong karunungan!” Ang pambungad na salitang Hebreo ay maaaring mangahulugang “ano” o gamiting padamdam na “kay.” Ginamit sa pangunahing teksto ang anyong padamdam upang maipakita ang panunuya ni Job.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה
  choice: Kay husay
  rationale: Ginamit ang padamdam na “Kay husay” upang ihatid ang mapanuyang papuri ni Job. Maaari ring maunawaan ang מַה bilang patanong na “Ano,” kaya inilagay sa talababa ang alternatibo.
- source_word: יָּעַצְתָּ
  choice: nagpayo
  rationale: Tuwirang katumbas ng pandiwang יעץ at natural sa makabagong Tagalog.
- source_word: לְלֹא חָכְמָה
  choice: sa taong walang karunungan
  rationale: Ginawang tahasan ang ipinahihiwatig na taong pinapayuhan nang hindi tinutukoy nang labis kung sino iyon.
- source_word: חָכְמָה
  choice: karunungan
  rationale: Karaniwang katumbas sa panitikang karunungan at angkop sa marangal na rehistro.
- source_word: וְתוּשִׁיָּה
  choice: wastong karunungan
  rationale: Ipinahahayag ang diwa ng תושיה bilang matibay, mahusay, o mabisang karunungan, nang hindi ito nililimitahan sa tagumpay lamang.
- source_word: לָרֹב
  choice: sagana
  rationale: Inilalarawan ang malaking lawak o dami ng diumano'y ipinaalam at pinatitindi ang panunuya.
- source_word: הוֹדָעְתָּ
  choice: ipinaalam
  rationale: Tuwirang ipinahahayag ang Hiphil na diwang “ginawang malaman” o “ipinaalam.”
