  text: He inscribed a circle on the surface of the waters[a], at the boundary of light and darkness.
translation:
  language: tl
  text: Gumuhit siya ng bilog sa ibabaw ng tubig[a], sa hangganan ng liwanag at dilim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Nagtakda siya ng hangganan sa ibabaw ng tubig, hanggang sa dulo ng liwanag at dilim.”
    reason: lexical_alternative
lexical_decisions:
- source_word: חֹק חָג
  choice: Gumuhit siya ng isang bilog
  rationale: Pinagsamang ipinahahayag ng חֹק at חָג ang pagmamarka ng isang takdang pabilog na hangganan. Natural sa modernong Tagalog ang “gumuhit ng isang bilog” at pinananatili nito ang kongkretong larawan.
- source_word: עַל פְּנֵי מָיִם
  choice: sa ibabaw ng mga tubig
  rationale: Ang פְּנֵי ay literal na “mukha” ngunit tumutukoy rito sa ibabaw. Pinananatili ng “mga tubig” ang malawak at makatang larawan ng Hebreo.
- source_word: עַד תַּכְלִית
  choice: sa hangganan
  rationale: Tinutukoy ng parirala ang sukdulan o takdang limitasyon ng iginuhit na bilog. Ang “hangganan” ay malinaw at angkop sa larawan.
- source_word: אוֹר עִם חֹשֶׁךְ
  choice: ng liwanag at dilim
  rationale: Ang literal na ugnayan ay “liwanag kasama ng dilim.” Ang “ng liwanag at dilim” ay natural ngunit hindi labis na nagpapaliwanag kung ito ay paghihiwalay o pagtatagpo.
theological_decisions: []
translation_notes:
  register: Makatula ngunit tuwiran at madaling maunawaan sa modernong Filipino. Ginamit ang “siya” ayon sa Hebreong pandiwang panlalaki; malinaw sa konteksto ng talata na tumutukoy ito sa Diyos. Pinanatili ang posibleng kahulugan ng bilog at hangganan sa pangunahing teksto at talababa.
