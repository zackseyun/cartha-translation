  text: By his power he stilled the sea[a], and by his understanding he shattered Rahab.
translation:
  language: tl
  text: 'Sa kanyang kapangyarihan, pinatahimik niya ang dagat;

    at sa kanyang unawa, dinurog niya si Rahab.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “Rahab” ay makatang pangalan para sa isang puwersa ng kaguluhan o halimaw-dagat na sumasalungat sa Diyos; maaari rin itong isaling “ang halimaw-dagat.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּכֹחוֹ
  choice: Sa kanyang kapangyarihan
  rationale: Instrumental ang בְּ, at malinaw na ipinahahayag ng “kapangyarihan” ang lakas na ginagamit ng Diyos sa makatang paglalarawan.
- source_word: רָגַע
  choice: pinatahimik niya
  rationale: Sa konteksto ng dagat, pinakamalamang na tumutukoy ang pandiwa sa pagpapahupa o pagpapatahimik, bagaman maaari itong magpahiwatig ng pag-antig o pagligalig sa ibang konteksto.
- source_word: הַיָּם
  choice: ang dagat
  rationale: Tuwirang salin ito na nagpapanatili kapwa sa literal na kahulugan at sa makatang larawan ng magulong puwersa.
- source_word: וּבִתְבוּנָתוֹ
  choice: at sa kanyang pagkaunawa
  rationale: Ipinahahayag ng תְּבוּנָה ang pagkaunawa, kabatiran, o wastong pag-unawa; natural ang “pagkaunawa” at pinananatili nito ang temang karunungan sa Job.
- source_word: מָחַץ
  choice: dinurog niya
  rationale: Ang pandiwa ay nagsasaad ng marahas at ganap na pagdurog o pagwasak; ang “dinurog” ay matingkad at angkop sa tulang Filipino.
- source_word: רָהַב
  choice: Rahab
  rationale: Pinanatili bilang pangalang pantangi ng makatang kapangyarihan o halimaw ng kaguluhan, sa halip na paliitin ang kahulugan sa “pagmamataas” o agad ipakahulugang “halimaw sa dagat.”
theological_decisions:
- issue: Kung ang רָהַב ay isasalin bilang pangalang pantangi o bilang pangkalahatang katawagan
  choice: Pangalang “Rahab,” na tumutukoy sa makatang kapangyarihan o halimaw ng kaguluhan na nilupig ng Diyos
  alternative: “pagmamataas” o “halimaw sa dagat”
  rationale: Sa kosmolohikal at makatang konteksto ng Job, gumaganap ang Rahab bilang sagisag ng magulong kapangyarihang sinupil ng Diyos. Pinananatili ng transliterasyon ang larawan at ang posibleng saklaw ng kahulugan; ipinapaliwanag ito sa talababa nang hindi nilulutas nang tahasan ang lahat ng pahiwatig.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang magkatimbang na mga pariralang “Sa kanyang kapangyarihan” at “sa kanyang pagkaunawa” upang mapanatili ang paralelismo ng tulang Hebreo. Inilagay ang panandang [a] pagkatapos ng “Rahab,” ang salitang mismong ipinaliliwanag ng talababa.
