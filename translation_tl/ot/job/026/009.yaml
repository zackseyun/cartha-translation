  yaml_path: translation/ot/job/026/009.yaml
  text: He covers the face of his throne[b][a], spreading his cloud over it.
translation:
  language: tl
  text: Tinatakpan[a] niya ang mukha ng kanyang trono[b], habang inilalatag niya ang kanyang ulap sa ibabaw nito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Hinahawakan niya nang mahigpit” o “Kinakapitan niya.” Karaniwang nangangahulugan ang pandiwang Hebreo na “humawak” o “hawakang mahigpit,” ngunit sa kontekstong ito ay malamang na tumutukoy sa pagtatakip o pagkukubli.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “ang mukha ng trono.” Maaari rin itong mangahulugang ang nakikitang bahagi o ibabaw ng trono. Literal na “ang trono,” hindi “kanyang trono”; ipinahihiwatig lamang ng konteksto ang pagmamay-ari.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְאַחֵז
  choice: Tinatakpan
  rationale: Karaniwang nangangahulugan ang pandiwa na “humawak” o “hawakang mahigpit,” ngunit sa larawang patula—lalo na kasunod ng paglalatag ng ulap sa ibabaw ng trono—malamang na ang diwa ay pagtatakip o pagkukubli.
- source_word: פְּנֵי
  choice: ang harapan ng
  rationale: Literal itong “mukha ng,” ngunit ang “harapan” ay natural sa makabagong Tagalog at naipahahayag ang nakikitang bahagi o ibabaw ng trono.
- source_word: כִסֵּה
  choice: kanyang trono
  rationale: Ang pangngalan ay “trono.” Bagaman walang tahasang hulaping paari rito, ang Diyos ang ipinahihiwatig na paksa, at ang kasunod na “kanyang ulap” ay sumusuporta sa pag-unawang sarili niyang trono ang tinutukoy.
- source_word: פַּרְשֵׁז
  choice: inilalatag
  rationale: Ipinahihiwatig ng pandiwa ang pag-uunat o paglalatag. Ang anyong ito ay natural na naglalarawan sa ulap na inilalatag sa ibabaw ng trono.
- source_word: עָלָיו
  choice: sa ibabaw nito
  rationale: Ang hulaping panlalaki ay pinakanatural na tumutukoy pabalik sa trono; ang “nito” ay malinaw at likas sa Tagalog.
- source_word: עֲנָנוֹ
  choice: kanyang ulap
  rationale: Isahan ang pangngalan at may hulaping paari, kaya tuwirang tinutumbasan ng “kanyang ulap.”
theological_decisions:
- issue: Ipinahihiwatig na paksa at pagmamay-ari ng trono
  choice: Ang Diyos ang nagkukubli ng sarili niyang trono sa pamamagitan ng kanyang ulap.
  alternative: Maaaring isaling mas literal na “ang trono,” nang hindi tahasang ginagawang “kanyang trono.”
  rationale: Sa konteksto, ang Diyos ang ipinahihiwatig na gumagawa ng mga kilos. Nililinaw ng “kanyang trono” ang natural na reperensiya sa Tagalog, ngunit inilalahad sa tala ang mas literal na anyo upang hindi maitago ang bahagyang kalabuan.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinili ang “harapan” sa halip na literal ngunit di-likas na “mukha” ng trono. Ang “habang” ay nagpapakita ng magkaugnay na larawang patula nang hindi ginagawang magkahiwalay ang dalawang kilos.
