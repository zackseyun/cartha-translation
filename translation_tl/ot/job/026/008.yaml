  yaml_path: translation/ot/job/026/008.yaml
  text: He binds up the waters in his clouds[b][a], yet the cloud is not split open under them.
translation:
  language: tl
  text: Binibigkis niya ang tubig sa kanyang mga ulap[a], ngunit hindi nabibiyak ang ulap sa ilalim ng mga iyon.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa kanyang makakapal na ulap”; maaaring idiin ng salitang Hebreo ang makapal o masinsing kumpol ng ulap.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “hindi pumuputok”; literal na “hindi nabibiyak.”
    reason: lexical_alternative
lexical_decisions:
- source_word: צֹרֵר
  choice: binibigkis
  rationale: Pinananatili nito ang patulang larawan ng pagbibigkis o pagpigil sa tubig, sa halip na ipaliwanag lamang na ito ay iniimbak o ikinukulong.
- source_word: מַיִם
  choice: ang tubig
  rationale: Bagaman anyong maramihan ang salitang Hebreo, likas sa modernong Tagalog ang kolektibong pangngalang “tubig”; hindi kailangang gawing “mga tubig.”
- source_word: בְּעָבָיו
  choice: sa kanyang mga ulap
  rationale: Ipinahahayag ang panlalaking panghalip at ang maramihang diwa ng anyo. Maaaring bigyang-diin ng עָב ang makapal o masinsing ulap, kaya inilagay ang alternatibo sa talababa.
- source_word: וְלֹא
  choice: ngunit hindi
  rationale: 'Likas na ipinahahayag ng “ngunit” ang pagtatambis: kahit may tubig na binibigkis sa mga ulap, hindi nabibiyak ang ulap.'
- source_word: נִבְקַע
  choice: hindi nabibiyak
  rationale: Pinananatili ang balintiyak na diwa at ang pisikal na larawan ng pagkabiyak. Ang “hindi pumuputok” ay posible ngunit mas malayang paglalarawan.
- source_word: עָנָן
  choice: ang ulap
  rationale: Pinananatili ang isahang anyo ng Hebreo, na maaaring gamitin bilang kolektibo o pangkalahatang pagtukoy sa ulap.
- source_word: תַּחְתָּם
  choice: sa ilalim ng mga iyon
  rationale: Pinananatili ang maramihang hulapi ng Hebreo at hindi tiyak na nilulutas kung ang tinutukoy ay ang tubig o ang mga ulap.
