  yaml_path: translation/ot/job/026/011.yaml
  text: The pillars of heaven tremble and are astonished at his rebuke[a][b][c].
translation:
  language: tl
  text: Ang mga haligi ng langit ay nanginginig[a] at natitigilan[b] dahil sa pagsaway niya.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nayayanig.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “namamangha” o “nasisindak.”
    reason: lexical_alternative
  - marker: c
    text: Sa literal, “mula sa pagsaway niya”; maaari ring mangahulugang “dahil sa pagsaway niya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עַמּוּדֵי שָׁמַיִם
  choice: ang mga haligi ng langit
  rationale: Pinananatili ng “mga haligi ng langit” ang tuwirang makatang larawang kosmiko ng Hebreo nang hindi ito ipinapaliwanag bilang mga bundok o ginagawang literal na arkitektura.
- source_word: יְרוֹפָפוּ
  choice: nanginginig
  rationale: Ipinahihiwatig ng רפף ang pagyanig o panginginig. Ang “nanginginig” ay likas sa Filipino at naipapakita kapwa ang kilos at ang matinding reaksiyon sa kapangyarihan ng Diyos.
- source_word: וְיִתְמְהוּ
  choice: at natitigilan
  rationale: Ang תמהּ ay tumutukoy sa pagkabigla o pagkamangha. Ang “natitigilan” ay natural na nagpapahayag ng gulat na halos hindi makakilos, habang hindi ipinapasok ang ideya ng moral na pagkasuklam.
- source_word: מִגַּעֲרָתוֹ
  choice: dahil sa pagsaway niya
  rationale: Maaaring tukuyin ng מִן ang pinagmulan o sanhi. Dito, malinaw at natural na ipinapahayag ng “dahil sa” ang sanhi ng panginginig at pagkagulat; inilalahad sa talababa ang mas literal na ugnayang “mula sa.”
theological_decisions:
- issue: Makatang larawang kosmiko ng “mga haligi ng langit”
  choice: Panatilihin ang larawan nang hindi ito binabago o ipinapaliwanag sa mismong salin.
  alternative: Unawain at isalin ito bilang mga bundok, o ilarawan bilang literal na sinaunang estruktura ng kosmos.
  rationale: Ang talata ay gumagamit ng maringal na tulang kosmiko. Ang pagpapanatili sa larawan ay gumagalang sa anyo at tunay na tensiyon ng teksto nang hindi nagpapasok ng makabagong kosmolohiya o isang tiyak na pagpapakahulugan.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang matinding personipikasyon at paralelismo ng tulang Hebreo; ginamit ang “pagsaway” bilang natural na katumbas ng makapangyarihang גערה nang hindi dinaragdagan ang kahulugan.
