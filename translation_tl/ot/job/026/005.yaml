  text: The departed spirits tremble beneath the waters[a], and those who dwell in them.
translation:
  language: tl
  text: Ang mga espiritu ng yumao ay nanginginig sa ilalim ng mga tubig[a], at ang mga naninirahan dito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Ang mga patay ay namimilipit sa ilalim ng mga tubig.” Ang Hebreong רְפָאִים ay maaaring mangahulugang “mga patay” o “mga espiritu ng yumao,” at ang יְחוֹלָלוּ ay maaari ring isaling “namimilipit.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרְפָאִים
  choice: ang mga espiritu ng yumao
  rationale: Sa kontekstong patula tungkol sa daigdig ng mga patay, tumutukoy ito sa mga yumao, hindi sa sinaunang lahi ng mga Refaim. Pinananatili ng parirala ang makatang diwa nang hindi nagmumukhang pangalan ng isang pangkat.
- source_word: יְחוֹלָלוּ
  choice: ay nanginginig
  rationale: Maaaring magpahiwatig ang pandiwa ng panginginig o pamimilipit. Ang “nanginginig” ay natural sa Filipino at angkop sa paglalarawan ng pagyanig sa harap ng kapangyarihan ng Diyos.
- source_word: מִתַּחַת מַיִם
  choice: sa ilalim ng tubig
  rationale: Tuwirang pinananatili nito ang larawang panlunan ng Hebreo at likas itong pakinggan sa modernong Filipino.
- source_word: וְשֹׁכְנֵיהֶם
  choice: pati ang mga naninirahan doon
  rationale: Ang hulaping panghalip ay pinakamalamang na tumutukoy sa tubig. Ginagawang malinaw ng “doon” ang ugnayan habang hindi tinutukoy nang higit sa sinasabi ng teksto kung sino ang mga naninirahan.
theological_decisions:
- issue: Tinutukoy ng רְפָאִים
  choice: mga espiritu ng yumao sa daigdig ng mga patay
  alternative: ang mga Refaim bilang isang sinaunang lahi
  rationale: Ang kontekstong patula ng Job 26 ay naglalarawan sa kapamahalaan ng Diyos sa mga kosmiko at nasa-ilalim-na-daigdig na saklaw. Kaya ang kahulugang nauukol sa mga yumao ang higit na angkop, nang hindi nagdaragdag ng partikular na doktrina tungkol sa kalagayan nila.
translation_notes:
  register: Modernong Filipino na marangal at patula ngunit madaling maunawaan. Ginamit ang “pati” upang likas na maipahayag ang pagdaragdag sa ikalawang sugnay; iniwasan ang teknikal o makalumang “mga lilim” at ang posibleng mapanlinlang na pangalang “mga Refaim.”
