base_translation:
  language: en
  yaml_path: translation/ot/job/026/007.yaml
  text: He stretches out the north over emptiness[b][a]; he hangs the earth on nothing.
translation:
  language: tl
  text: Iniuunat niya ang hilaga sa ibabaw ng kahungkagan[a][b]; ibinibitin niya ang daigdig sa wala.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “hilagang kalangitan.” “Hilaga” lamang ang literal na sinasabi ng Hebreo, ngunit sa makatang kontekstong ito ay maaaring tumukoy iyon sa hilagang bahagi ng kalangitan.
    reason: lexical_alternative
  - marker: b
    text: O “kawalan” o “walang-anyong kalawakan.” Maaaring tumukoy ang salitang Hebreo sa kahungkagan, pagkatiwangwang, o kawalang-anyo.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹטֶה
  choice: Iniuunat
  rationale: Ang Qal participle ng נטה ay nagsasaad ng patuloy o katangiang pagkilos na pag-uunat o paglalatag. Ang “Iniuunat” ay tuwiran at pinananatili ang larawang pangkalawakan.
- source_word: צָפוֹן
  choice: ang hilaga
  rationale: Karaniwang nangangahulugang “hilaga” ang צָפוֹן. Maaaring tumukoy rito sa hilagang bahagi ng kalangitan, ngunit pinananatili ng salin ang payak at sadyang hindi tiyak na pananalita ng Hebreo.
- source_word: תֹּהוּ
  choice: kahungkagan
  rationale: Maaaring tumukoy ang תֹּהוּ sa kawalan, walang anyo, o hungkag na kalawakan. Ang “kahungkagan” ay marangal at nauunawaan, at pinananatili ang kosmikong larawan nang hindi ito labis na ipinapaliwanag.
- source_word: תֹּלֶה
  choice: ibinibitin
  rationale: Ang Qal participle ng תלה ay nangangahulugang ibitin o isabit. Ang “ibinibitin” ay natural sa Filipino at malinaw na naghahatid ng larawan ng pagkakasuspinde.
- source_word: אֶרֶץ
  choice: ang daigdig
  rationale: Sa kosmikong kontekstong ito, ang אֶרֶץ ay tumutukoy sa buong mundo o lupa, hindi sa isang partikular na lupain. Mas malinaw dito ang “daigdig.”
- source_word: בְּלִי מָה
  choice: sa wala
  rationale: Ang parirala ay literal na “nang walang anuman” at, kasama ng עַל, ay nagbibigay ng diwang “sa wala.” Pinananatili nito ang matapang at maikling larawan ng Hebreo.
- source_word: עַל
  choice: sa ibabaw ng / sa
  rationale: Dalawang ulit itong ginamit. Ang “sa ibabaw ng” ay natural kasama ng kahungkagan, samantalang ang “sa wala” ay mas likas na Filipino sa ikalawang sugnay habang pinananatili ang ugnayang pansaklaw o pansuporta.
theological_decisions:
- issue: Larawang pangkalawakan
  choice: Isinalin bilang makatang paglalarawan sa kapangyarihan ng Diyos sa sangnilikha, nang hindi nilalagyan ng makabagong siyentipikong pagpapaliwanag.
  alternative: Ituring itong eksaktong pahayag ng makabagong agham, o tahasang palawakin ang “hilaga” bilang mitolohikong reperensiya.
  rationale: Karunungang patula ang konteksto. Dapat manatiling malinaw ang mismong larawan ng Hebreo ngunit hindi ito dapat gawing mas tiyak kaysa sa pinagmulang teksto.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Pinanatili ang paralelismong patula, ang kasalukuyang kilos ng mga participle, at ang sadyang kalabuan ng “hilaga” at תֹּהוּ. Inilagay ang mga marker sa pagkakasunod na [a][b] kasunod ng pariralang kapuwa nila nililinaw.
