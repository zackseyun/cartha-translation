  text: Is not disaster for the unrighteous[b][a], and calamity for the workers of iniquity?
translation:
  language: tl
  text: Hindi ba para sa taong di-matuwid[b] ang kapahamakan[a], at para sa mga gumagawa ng kasamaan ang sakuna?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin ang “kapahamakan” na “pagkawasak,” at ang “sakuna” na “kasawian.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “taong di-makatarungan”; at ang “mga gumagawa ng kasamaan” ay maaari ring “mga gumagawa ng masama.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: Hindi ba
  rationale: Pinananatili ang retorikal na tanong na umaasang sasang-ayon ang nakikinig.
- source_word: אֵיד
  choice: kapahamakan
  rationale: Likas at marangal na salitang Filipino para sa mapaminsalang sakuna o pagkawasak sa kontekstong moral.
- source_word: לְעַוָּל
  choice: para sa taong di-matuwid
  rationale: Ipinahahayag ang taong kinakikitaan ng kawalang-katarungan o maling asal nang hindi nililimitahan ang salita sa isang tiyak na uri ng kasalanan.
- source_word: וְנֵכֶר
  choice: at ... matinding kasawian
  rationale: Sa parallelism na ito, tumutukoy ang pambihirang salita sa isang mabigat at mapaminsalang kinahinatnan; bahagya itong ibinukod sa 'kapahamakan' habang pinananatili ang kaagapay na diwa.
- source_word: לְפֹעֲלֵי
  choice: para sa mga gumagawa ng
  rationale: Malinaw na isinasalin ang participial expression at ang aktuwal na pagsasagawa ng masama.
- source_word: אָוֶן
  choice: kasamaan
  rationale: Sa pariralang 'mga gumagawa ng,' ang salita ay tumutukoy sa may-salang paggawa ng masama, hindi lamang sa ligalig o hirap.
theological_decisions:
- issue: Moral na kaayusan sa panitikang karunungan
  choice: Inilahad ang kapahamakan bilang para sa di-matuwid at sa gumagawa ng kasamaan, nang hindi tinutukoy ang eksaktong mekanismo nito.
  alternative: Gawing tahasang parusa ng Diyos o isa lamang likas na bunga ng masamang gawa.
  rationale: Hindi sinasabi ng Hebreo sa talatang ito kung ang kinahinatnan ay tuwirang parusa ng Diyos o pagpapahayag ng mas malawak na moral na kaayusan; pinananatili ng salin ang tensiyong iyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang anyong retorikal at ang balanseng parallelism ng tulang Hebreo; iniwasan ang arkaikong 'kasamaan' alternatives like 'kalikuan' where ordinary readers may find it less immediate.
