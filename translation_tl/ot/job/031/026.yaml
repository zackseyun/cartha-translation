lexical_decisions:
- source_word: אִם
  choice: kung
  rationale: Nagsisimula ito ng kondisyong bahagi ng panunumpa ni Job na wala siyang ginawang kasalanan.
- source_word: אֶרְאֶה
  choice: tiningnan ko
  rationale: Bagaman literal na “nakita ko,” ipinahihiwatig ng konteksto ang sadyang pagtingin sa mga bagay sa langit; ang aspektong nagdaan ay natural sa serye ng mga kondisyong itinatanggi ni Job.
- source_word: אוֹר
  choice: ang liwanag
  rationale: Pinananatili ang literal na salitang Hebreo at ang tunay na posibilidad na tumutukoy ito sa araw, nang hindi iyon tahasang ipinapasok sa pangunahing teksto.
- source_word: כִּי
  choice: nang
  rationale: Ipinakikilala nito ang kalagayang kasabay ng pagtingin at natural na nag-uugnay sa “sumikat.”
- source_word: יָהֵל
  choice: ito ay sumikat
  rationale: Naghahayag ng pagbibigay-liwanag o pagningning. Ang “sumikat” ay natural sa Filipino at angkop sa malamang na pagtukoy sa araw.
- source_word: וְיָרֵחַ
  choice: o ang buwan
  rationale: Ang pangatnig ay disjunctive sa magkahanay na mga bagay sa kondisyong ito; natural sa Filipino ang “o.”
- source_word: יָקָר
  choice: maringal
  rationale: Sa paglalarawan sa buwan, ang salitang karaniwang nangangahulugang mahalaga o mahal ay naghahayag dito ng karilagan o maningning na kadakilaan.
- source_word: הֹלֵךְ
  choice: na naglalakbay
  rationale: Pinananatili ang larawan ng buwan na patuloy na lumalakad o dumaraan sa kalangitan.
theological_decisions:
- issue: Posibleng konteksto ng pagsamba sa mga bagay sa langit
  choice: Panatilihin ang literal na larawan ng liwanag at buwan nang hindi tahasang binabanggit ang pagsamba sa pangunahing teksto.
  alternative: Isalin ang אוֹר bilang “araw” upang gawing mas lantad ang konteksto ng pagtanggi sa idolatriya.
  rationale: Nililinaw ng mga talatang 27–28 ang kaugnayan sa ipinagbabawal na pagpipitagan sa mga bagay sa langit, ngunit “liwanag” at “buwan” lamang ang tahasang binabanggit sa talatang 26. Hinahayaan ng salin na ang kasunod na konteksto ang magpaliwanag sa teolohikal na pahiwatig.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Pinananatili ang anyong di-ganap na pangungusap dahil nagpapatuloy ang kondisyong sinimulan dito hanggang sa mga susunod na talata. Ang “naglalakbay” ay mas natural kaysa literal na “naglalakad” sa pangunahing teksto, habang nasa talababa ang mas literal na larawan.
