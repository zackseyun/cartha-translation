lexical_decisions:
- source_word: אִם לֹא
  choice: Kung hindi
  rationale: Pinananatili ang kondisyunal na anyo ng pormulang panunumpa sa Hebreo sa halip na gawing tahasang pagpapatunay.
- source_word: מְתֵי אָהֳלִי
  choice: mga tao sa aking tolda
  rationale: Malapit ito sa konkretong larawan ng Hebreo, bagaman maaaring tumukoy ang ‘tolda’ sa sambahayan o mga kasambahay ni Job.
- source_word: מִי יִתֵּן
  choice: Mayroon bang
  rationale: Sa kontekstong ito, ang idyoma ay naghaharap ng retorikal na tanong—‘Sino ang naroon na...?’—hindi ng karaniwang paghahangad na ‘Sino ang magbibigay...?’
- source_word: מִבְּשָׂרוֹ
  choice: sa karneng mula sa kaniya
  rationale: Pinananatili ang ‘mula sa’ at ang literal na diwa ng ‘karne,’ habang ipinahihiwatig ng konteksto ang pagkaing inilaan ni Job.
- source_word: לֹא נִשְׂבָּע
  choice: hindi nabusog
  rationale: Likas na Filipino ito para sa Niphal na nangangahulugang mapuno o masiyahan sa pagkain.
