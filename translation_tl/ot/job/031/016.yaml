translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “dukha” at “biyuda” bilang karaniwang nauunawaang mga katawagan. Pinanatili ang kondisyong anyo at ang matalinghagang “mga mata,” ngunit idinagdag ang “sa paghihintay” upang maipahayag nang natural ang Hebreong idyoma.
