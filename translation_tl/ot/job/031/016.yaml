  yaml_path: translation/ot/job/031/016.yaml
  text: If I have withheld the poor from their desire[a], or caused the eyes of the widow to fail[b],
translation:
  language: tl
  text: Kung ipinagkait ko sa mga dukha ang kanilang ninanais[a], o pinanghina ko ang mga mata ng isang biyuda[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ipinagkait ko sa mga dukha ang kanilang kailangan.” Ang salitang Hebreo ay maaaring tumukoy sa ninanais o sa bagay na hinahangad; sa konteksto, maaaring pangunahing pangangailangan ang tinutukoy.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, literal na “pinanghina ko ang mga mata ng isang biyuda”—isang idyoma para sa matagal na pagkabigo, pananabik, o pag-asang hindi natutupad.
    reason: cultural_note
lexical_decisions:
- source_word: אִם
  choice: Kung
  rationale: Ipinakikilala nito ang kondisyong bahagi ng panunumpa ni Job tungkol sa sarili; natural sa Tagalog ang payak na “Kung.”
- source_word: אֶמְנַע
  choice: ipinagkait ko
  rationale: Ang qal ng מנע ay nangangahulugang magpigil o magkait. Ang aspektong pangnagdaan ay angkop sa pagbabalik-tanaw ni Job sa kanyang asal.
- source_word: מֵחֵפֶץ דַּלִּים
  choice: sa mga dukha ang kanilang ninanais
  rationale: Ipinapahayag ng חֵפֶץ ang pagnanais o bagay na ninanais. Inililipat sa natural na ayos ng Tagalog ang ugnayang “ipinagkait sa mga dukha ang kanilang ninanais,” habang hindi nililimitahan ang kahulugan sa “pangangailangan.”
- source_word: דַּלִּים
  choice: mga dukha
  rationale: Tumutukoy ito sa mahihirap, mahihina, o mababa ang kalagayan. Ang “mga dukha” ay dignified at malinaw sa kontekstong panlipunan.
- source_word: וְעֵינֵי אַלְמָנָה אֲכַלֶּה
  choice: o hinayaan kong manghina sa paghihintay ang mga mata ng isang biyuda
  rationale: Ang literal na larawang pagkapawi o panghihina ng mga mata ay idyoma para sa matagal at bigong paghihintay. Pinananatili ang larawan ng mga mata at nililinaw ang ipinahihiwatig na paghihintay.
