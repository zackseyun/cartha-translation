translation:
  language: tl
  text: kung magkagayon, gumiling nawa ang asawa ko para sa ibang lalaki, at lumuhod nawa sa ibabaw niya ang ibang mga lalaki.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O maaaring, “makipagtalik sa kanya ang ibang mga lalaki”; malamang na seksuwal na eupemismo sa kontekstong ito ang “lumuhod sa ibabaw niya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּטְחַן
  choice: gumiling
  rationale: Pinananatili ang kongkretong larawan ng paggiling ng butil at ang pahiwatig nito ng abang paglilingkod; sa konteksto, maaari rin itong may seksuwal na pahiwatig.
- source_word: לְאַחֵר
  choice: para sa ibang lalaki
  rationale: Ang אַחֵר ay nangangahulugang “iba.” Nililinaw ng “lalaki” ang personal at panlalaking tinutukoy sa konteksto.
- source_word: אִשְׁתִּי
  choice: ang asawa ko
  rationale: Ito ang natural at karaniwang salin ng אִשָּׁה na may hulaping unang panauhan sa kontekstong ito.
- source_word: וְעָלֶיהָ
  choice: sa ibabaw niya
  rationale: Pinananatili ang pisikal at spatial na larawan ng pang-ukol na עַל nang hindi pinapahina ang pahayag.
- source_word: יִכְרְעוּן
  choice: lumuhod
  rationale: Ang karaniwang kahulugan ng כרע ay “lumuhod” o “yumukod.” Malamang na eupemismong seksuwal ito rito, ngunit pinananatili sa pangunahing teksto ang mismong larawan ng Hebreo.
- source_word: אֲחֵרִין
  choice: ang ibang mga lalaki
  rationale: Ang anyong panlalaking maramihan ay tumutukoy sa ibang mga lalaki; tahasan itong ipinahahayag para maging natural sa Filipino.
theological_decisions:
- issue: Kung gagawing tahasan sa pangunahing teksto ang seksuwal na eupemismo
  choice: Panatilihin sa pangunahing teksto ang literal na mga larawan ng “gumiling” at “lumuhod sa ibabaw niya,” at ilagay sa talababa ang malamang na seksuwal na diwa.
  alternative: “kung magkagayon, makipagtalik nawa sa ibang lalaki ang asawa ko, at sipingan nawa siya ng ibang mga lalaki.”
  rationale: Gumagamit ang Hebreo ng mga kongkretong pandiwa sa halip na tahasang salita para sa pakikipagtalik. Pinananatili ng salin ang tunay na anyo at tensiyon ng pahayag habang ipinababatid sa talababa ang malamang na eupemistikong kahulugan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “nawa” upang ihayag ang anyong sumpa o kondisyonal na kahilingan; pinanatili ang matinding kongkretong larawan ng Hebreo nang hindi ito ginagawang mas tahasan kaysa sa pinagmulan.
