  text: 'at ang puso ko’y lihim na naakit,

    at ang aking kamay ay humalik sa aking bibig—[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas idyomatiko ayon sa konteksto, “at nagpadala ako ng halik mula sa aking kamay”—malamang na isang kilos ng pagpupugay na kaugnay ng pagsamba sa mga bagay sa langit.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְתְּ
  choice: naakit
  rationale: Ang anyong ito ng פתה ay nagsasaad na ang kalooban ay nahikayat o natangay. Ang “naakit” ay natural sa Filipino at pinananatili ang diwa ng panloob na pang-aakit nang hindi pinalalakas tungo sa tahasang “nadaya.”
- source_word: בַּסֵּתֶר
  choice: lihim na
  rationale: Ipinahahayag ng סתר ang pagiging lihim o nakatago. Ang “lihim na” ay tuwirang naglalarawan sa pagkakaakit ng puso.
- source_word: לִבִּי
  choice: ang puso ko
  rationale: Ang לֵב ay tumutukoy sa panloob na pagkatao, kalooban, o damdamin. Ang “puso” ay malinaw at karaniwang katumbas sa dignified na modernong Filipino.
- source_word: וַתִּשַּׁק
  choice: hinalikan
  rationale: Ang נשק ay karaniwang nangangahulugang “humalik.” Pinananatili sa pangunahing teksto ang konkretong kilos sa halip na isingit ang interpretasyong ritwal.
- source_word: יָדִי
  choice: ng kamay ko
  rationale: Tuwirang salin ng “aking kamay”; ang kamay ang gumagawa ng kilos na pagpupugay.
- source_word: לְפִי
  choice: ang bibig ko
  rationale: Literal na “sa aking bibig.” Sa kayariang Filipino na “hinalikan ng kamay ko ang bibig ko,” napapanatili ang konkretong larawan at nauunawaan ang direksiyon ng kilos.
theological_decisions:
- issue: Posibleng ritwal ng pagsamba sa mga bagay sa langit
  choice: Panatilihin sa pangunahing teksto ang konkretong kilos ng kamay at bibig, nang hindi tahasang idinadagdag ang salitang “sumamba.”
  alternative: at nagpadala ako ng halik mula sa aking kamay
  rationale: Ipinakikita ng konteksto ng Job 31:26–28 na malamang na kilos ito ng pagpupugay sa araw o buwan. Gayunman, inilalarawan mismo ng talata ang kilos sa halip na pangalanan ito bilang pagsamba; kaya pinananatili ang tensiyong iyon at inilalagay sa talababa ang paliwanag.
translation_notes:
  register: Makabagong Filipino na may marangal at bahagyang makatang himig. Pinanatili ang magkatugmang sugnay at ang konkretong, bahagyang di-karaniwang larawan ng Hebreo; ipinaliwanag sa talababa ang malamang na kahulugang pangkultura.
