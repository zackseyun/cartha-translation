  text: for from my youth he raised me like a father[b][a], and from my mother’s womb I guided her.
translation:
  language: tl
  text: Sapagkat mula sa aking kabataan ay pinalaki niya ako na parang isang ama[a], at mula sa sinapupunan ng aking ina ay ginabayan ko siya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pinalaki niya akong tulad ng isang ama,” o “pinalaki ko siya na parang isang ama.” Mahirap unawain ang Hebreo sa linyang ito; nauunawaan ng ilan na ang tinutukoy ay ang pagkalinga ni Job sa ulila mula pa sa kanyang kabataan.
    reason: alternative_reading
  - marker: b
    text: Ang “siya” rito ay pambabae sa Hebreo at malamang na tumutukoy sa biyuda sa naunang talata.
    reason: cross_reference
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikita ang batayan ng pagtanggi ni Job sa naunang talata at ang ugnayang pangangatwiran sa konteksto.
- source_word: מִנְּעוּרַי
  choice: mula sa aking kabataan
  rationale: Pinananatili ang temporal na diwa ng parirala at likas itong pakinggan sa makabagong Tagalog.
- source_word: גְּדֵלַנִי
  choice: pinalaki niya ako
  rationale: Sinusunod ang anyong Hebreo na may hulaping unang panauhang isahan; hindi pinapawi sa pangunahing teksto ang mahirap at di-karaniwang pagkakabuo ng pahayag.
- source_word: כְאָב
  choice: na parang isang ama
  rationale: Malinaw na pinananatili ang paghahambing na ipinahihiwatig ng כְּ.
- source_word: וּמִבֶּטֶן אִמִּי
  choice: at mula sa sinapupunan ng aking ina
  rationale: Pinananatili ang matinding temporal na idyoma na tumutukoy sa pinakamaagang yugto ng buhay.
- source_word: אַנְחֶנָּה
  choice: ginabayan ko siya
  rationale: Isinasalin ang Hiphil unang panauhang isahan na may pambabaeng isahang layon; ang 'siya' ay natural sa Tagalog, habang nililinaw sa talababa ang malamang na tinutukoy.
theological_decisions:
- issue: Pagbabago ng tinutukoy sa loob ng talata
  choice: Pinananatili sa unang sugnay ang panlalaking ikatlong panauhan at sa ikalawa ang pambabaeng layon, nang hindi pinag-iisa ang mga ito sa salin.
  alternative: Unawain ang dalawang sugnay bilang pangkalahatang paglalarawan ng habambuhay na pagkalinga ni Job, o isalin ang una bilang ‘lumaki siyang kasama ko na para akong ama.’
  rationale: Mahirap ang Hebreo at may kapansin-pansing pagbabago sa gramatikal na kasarian. Pinananatili ng salin ang tensiyon at inilalahad sa talababa ang pangunahing alternatibong pagbasa sa halip na tahimik itong lutasin.
translation_notes:
  register: Makabagong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang literal at di-karaniwang ayos ng unang sugnay dahil tunay na malabo ang Hebreo; inilagay ang mga posibleng pagbasa sa talababa. Ginamit ang “sinapupunan” bilang dignified at karaniwang salitang biblikal.
