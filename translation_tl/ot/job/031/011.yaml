  text: כִּי הוא זִמָּ֑ה ו/היא עָוֺ֥ן פְּלִילִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/031/011.yaml
  text: For that is a disgraceful act[a], and it is an iniquity for the judges.
translation:
  language: tl
  text: Sapagkat iyon ay isang karumal-dumal na gawain, at isang kasalanang dapat hatulan ng mga hukom.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “isang kasalanang dapat parusahan ng mga hukom.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikilala nito ang dahilan ng naunang panunumpa ni Job; malinaw at natural ang paliwanag na ugnayan sa Filipino.
- source_word: הוא
  choice: iyon ay
  rationale: Tumutukoy pabalik sa gawaing binanggit sa konteksto, nang hindi tahasang idinaragdag ang salitang ‘pangangalunya’ sa talata.
- source_word: זִמָּה
  choice: isang karumal-dumal na gawain
  rationale: Ipinahahayag ng salita ang matinding kasamaan at moral na pagkasuklam, lalo na sa kontekstong seksuwal. Mas natural at marangal ito sa modernong Filipino kaysa sa mas makitid na ‘kahalayan.’
- source_word: וְהִיא
  choice: at
  rationale: Ipinagpapatuloy nito ang paglalarawan sa parehong gawain. Hindi na kailangang ulitin ang panghalip sa Filipino dahil malinaw ang paksa.
- source_word: עָוֺן
  choice: isang kasalanan
  rationale: Pinananatili nito ang moral na bigat ng salita, na maaaring tumukoy sa kasamaan, pagkakasala, o pananagutang dulot nito.
- source_word: פְּלִילִים
  choice: dapat hatulan ng mga hukom
  rationale: 'Inihahayag nito ang hudisyal na diwa ng pangmaramihang pangngalan: ang gawa ay saklaw ng pormal na paghatol. Iniiwasan nitong gawing tiyak ang uri ng parusa.'
theological_decisions:
- issue: Kung moral na kasalanan lamang o usaping saklaw din ng hukuman ang tinutukoy
  choice: isang kasalanang dapat hatulan ng mga hukom
  alternative: isang kasalanang dapat parusahan ng mga hukom
  rationale: Pinananatili ng pangunahing salin ang ugnayan ng moral na pagkakasala at hudisyal na paghatol, ngunit hindi ipinapalagay na ang פְּלִילִים mismo ay tahasang tumutukoy sa pagpaparusa.
translation_notes:
  register: Modernong Filipino na dignificado at madaling maunawaan. Ang ‘karumal-dumal na gawain’ ay nagpapakita ng tindi ng זִמָּה nang hindi gumagamit ng luma o sobrang teknikal na pananalita; ang ‘dapat hatulan ng mga hukom’ ay natural na paglalahad ng diwang hudisyal ng פְּלִילִים.
