  source_fidelity: Tapat ang salin sa Hebreo. Ang “Sapagkat” ay wastong nagbibigay ng paliwanag sa naunang panunumpa; ang “iyon” ay tumutukoy sa gawaing nasa konteksto; at ang “karumal-dumal na gawain” ay angkop sa matinding moral na bigat ng זִמָּה. Ang “isang kasalanang dapat hatulan ng mga hukom” ay isang maingat at katanggap-tanggap na paglalahad ng hudisyal na diwa ng עָוֺן פְּלִילִים nang hindi ipinipilit na tahasang ‘parusa’ ang pangunahing kahulugan.
  naturalness: Natural, malinaw, at dignificado ang modernong Filipino. Ang pag-iwas sa pag-uulit ng panghalip pagkatapos ng “at” ay idiomatiko at hindi nagpapalabo sa kahulugan.
  terminology: Ang “karumal-dumal na gawain” ay angkop na mas malawak na katumbas ng זִמָּה sa kontekstong seksuwal, samantalang ang “kasalanan” ay pinananatili ang moral na dimensiyon ng עָוֺן. Maayos ang pagkakatali ng “mga hukom” sa פְּלִילִים. Ang talababa ay wastong nagtatala ng mas penal na pagbasa bilang alternatibo.
