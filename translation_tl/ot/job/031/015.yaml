  yaml_path: translation/ot/job/031/015.yaml
  text: Did not he who made me in the womb make him[a], and form us in one womb?
translation:
  language: tl
  text: Hindi ba ang gumawa sa akin sa sinapupunan ang gumawa rin sa kanya? At hindi ba iisa ang humubog sa amin sa sinapupunan?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “at humubog sa amin sa iisang sinapupunan?” Binibigyang-diin ng masiksik na pananalitang Hebreo na pareho silang hinubog ng iisang Maylalang at kapuwa tao; hindi ito nangangahulugang iisa ang kanilang biyolohikal na ina.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: Hindi ba
  rationale: Likas na pambungad ito sa isang retorikal na tanong na umaasang sasang-ayon ang kausap.
- source_word: בַבֶּטֶן
  choice: sa sinapupunan
  rationale: Sa kontekstong ito, tumutukoy ang בטן sa sinapupunan bilang lugar ng pagbuo bago ipanganak, hindi lamang sa tiyan.
- source_word: עֹשֵׂנִי
  choice: ang gumawa sa akin
  rationale: Pinananatili nito ang pandiwang at personal na diwa ng participle na may hulaping unang panauhan, sa halip na gawin itong titulong gaya ng “Maylalang ko.”
- source_word: עָשָׂהוּ
  choice: ang gumawa rin sa kanya
  rationale: Ang panghalip ay tumutukoy sa lalaking alipin o lingkod sa naunang konteksto. Ipinahahayag ng “rin” ang paralelismo ng pagkakalikha sa kanilang dalawa.
- source_word: וַיְכֻנֶנּוּ
  choice: humubog sa amin
  rationale: Ang pandiwa ay may diwang paghubog o pag-anyo sa sinapupunan; ang hulapi ay inuunawang unang panauhang maramihan, ayon sa konteksto.
- source_word: בָּרֶחֶם
  choice: sa sinapupunan
  rationale: Tiyak na tumutukoy ang רחם sa sinapupunan.
- source_word: אֶחָד
  choice: iisa
  rationale: Iniuugnay ang “iisa” sa humubog sa kanilang dalawa, isang kinikilalang pagbasa na natural sa Tagalog at hindi nagpapahiwatig na iisa ang kanilang biyolohikal na ina. Ang mas literal na pag-uugnay nito sa “sinapupunan” ay inilagay sa talababa.
theological_decisions:
- issue: Ang tinutukoy ng panghalip na “kanya”
  choice: Ang lalaking alipin o lingkod ni Job sa agarang konteksto
  alternative: Sinumang kapuwa-tao sa pangkalahatan
  rationale: Tinutukoy sa Job 31:13–14 ang mga aliping lalaki at babae ni Job. Pinananatili rito ang panlalaking isahan ng Hebreo nang hindi nililimitahan ang mas malawak na pahiwatig tungkol sa pantay na pagkakalikha ng mga tao.
- issue: Ang ugnayan ng אֶחָד sa ikalawang sugnay
  choice: “Iisa ang humubog sa amin”
  alternative: “Humubog sa amin sa iisang sinapupunan”
  rationale: Kapuwa posible ang mga pagbasa sa masiksik na pananalitang Hebreo. Ang pangunahing salin ay malinaw at natural, at iniiwasang magpahiwatig na iisa ang biyolohikal na ina nina Job at ng kanyang lingkod. Pinananatili sa talababa ang mas literal na alternatibo.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “sinapupunan” at “humubog” upang mapanatili ang matulaing larawan at ang diin sa iisang banal na pinagmulan, nang hindi ipinapasok ang salitang “Diyos,” na hindi tahasang nasa talata.
