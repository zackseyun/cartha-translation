  yaml_path: translation/ot/job/031/023.yaml
  text: For calamity from God was a terror to me[b][a], and because of his majesty I could not endure.
translation:
  language: tl
  text: Sapagkat kakila-kilabot sa akin ang kapahamakang mula sa Diyos[a], at dahil sa kanyang kadakilaan ay hindi ako makatatagal[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Sapagkat ang kapahamakan ng Diyos ay kakila-kilabot sa akin.” Maaaring isalin nang mas pormal na “ng Diyos” ang Hebreo, ngunit malamang na tumutukoy ito sa kapahamakang nagmumula sa Diyos.
    reason: lexical_alternative
  - marker: b
    text: O “at dahil sa kanyang kataasan ay wala akong magagawa” o “hindi ko Siya/iyon makalalabanan.” Maaaring mangahulugan ang pangngalan na “kataasan” o “kadakilaan,” at maaaring ipahayag ng pandiwa ang kawalan ng kakayahan o ang hindi makapanindigan laban sa kanya o rito.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikilala nito ang dahilan ng pagpipigil ni Job na binanggit sa naunang konteksto.
- source_word: פַחַד אֵלַי
  choice: ay kinatatakutan ko
  rationale: Likas sa modernong Tagalog ang pandiwang anyo, at naipahahayag nito ang matinding pangamba ni Job kahit hindi napapanatili ang nominal na anyo ng Hebreo.
- source_word: אֵיד אֵל
  choice: ang kapahamakang mula sa Diyos
  rationale: Ang אֵיד ay mapaminsalang sakuna o kapahamakan; ipinakikita ng “mula sa Diyos” ang malamang na diwang ito ay nagmumula sa Diyos, habang itinatala sa talababa ang mas pormal na pagbasa.
- source_word: וּמִשְּׂאֵתוֹ
  choice: at dahil sa kanyang kadakilaan
  rationale: Maaaring tumukoy ang שְׂאֵת sa pagiging mataas o maringal. Ang “kadakilaan” ay natural at marangal, at ang מִן ay inuunawang nagsasaad ng dahilan.
- source_word: לֹא אוּכָל
  choice: ay hindi ako makatatagal
  rationale: Ang יכל ay pangunahing tumutukoy sa kakayahan; sa konteksto, ipinahahayag ng “makatatagal” ang kawalan ng kakayahang manatili o humarap sa banal na kadakilaan.
theological_decisions:
- issue: Pagpapakahulugan sa אֵל sa pariralang אֵיד אֵל
  choice: Diyos
  alternative: Makapangyarihan; El
  rationale: Karaniwang tawag sa Diyos ang gamit dito at hindi kailangang ituring na pangalang pantangi; hindi rin nagdaragdag ang “Diyos” ng sektaryong pagpapakahulugan.
- issue: Dahilan ng matuwid na pagkilos ni Job
  choice: Pinipigil siya kapuwa ng pangamba sa kapahamakang mula sa Diyos at ng pagkilala sa kadakilaan ng Diyos
  alternative: Takot lamang sa parusa; abstraktong pagkamangha lamang sa kataasan ng Diyos
  rationale: Pinananatili ng talata ang dalawang magkaugnay ngunit magkaibang dahilan nang hindi binabawasan ang pahayag sa pansariling takot lamang o sa abstraktong paggalang lamang.
- issue: Layon ng pandiwang לֹא אוּכָל
  choice: 'Hindi tinukoy nang tahasan: “hindi ako makatatagal”'
  alternative: Hindi ko Siya malalabanan; hindi ko iyon matitiis; wala akong magagawa
  rationale: Walang tahasang layon sa Hebreo. Pinananatili ng salin at talababa ang kalabuan kung Diyos, ang kanyang kadakilaan, o ang bunga nito ang hindi kayang harapin ni Job.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “kapahamakan” at “kadakilaan” upang mapanatili ang bigat ng pananalita nang hindi maging lipas o teknikal. Inilagay ang mga pananda ng talababa sa mismong teksto at pinanatili ang kalabuan ng hulihang sugnay.
