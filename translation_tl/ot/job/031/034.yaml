base_translation:
  language: en
  yaml_path: translation/ot/job/031/034.yaml
  text: because I feared the great multitude[a], and the contempt of clans terrified me[b], so that I kept silent and did not go out the door—
translation:
  language: tl
  text: 'sapagkat natakot ako sa malaking karamihan,


    at sinindak ako ng paghamak ng mga angkan,[a]


    kaya nanahimik ako at hindi lumabas ng pintuan—[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Hebreo ay maaari ring tumukoy sa “mga pamilya” o mas malalaking pangkat ng magkakamag-anak.
    reason: lexical_alternative
  - marker: b
    text: 'Bahagi ito ng panunumpa ni Job na wala siyang kasalanan. Eliptiko ang Hebreo; maaaring ang diwa ay: “kung natakot ako sa sasabihin ng madla … kaya nanahimik ako at nanatili sa loob.”'
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikita nito ang dahilan sa loob ng ipinahihiwatig na kondisyon o panunumpa ni Job, habang pinananatili ang bahagyang eliptikong ugnayan sa konteksto.
- source_word: אֶעֱרוֹץ
  choice: natakot ako
  rationale: Likas at malinaw na salin ng pandiwang nagsasaad ng matinding pangamba; hindi nito pinalalabis ang antas ng takot.
- source_word: הָמוֹן רַבָּה
  choice: napakaraming tao
  rationale: Natural sa modernong Tagalog at malinaw na ipinahahayag ang malaking bilang at panlipunang bigat ng karamihan.
- source_word: וּבוּז מִשְׁפָּחוֹת
  choice: at ang paghamak ng mga angkan
  rationale: Ang 'paghamak' ay tumutugma sa בּוּז, at ang 'mga angkan' ay mas malawak kaysa nuklear na pamilya at angkop sa sinaunang pangkat na magkakamag-anak.
- source_word: יְחִתֵּנִי
  choice: sinindak ako
  rationale: Ipinahahayag ng Hiphil ng חתת ang pagdudulot ng takot o panghihina ng loob. Ang 'sinindak' ay masidhi ngunit natural at hindi paulit-ulit sa 'natakot.'
- source_word: וָאֶדֹּם
  choice: kaya nanahimik ako
  rationale: 'Binabasa ang waw bilang bunga o kasunod na pangyayari: ang takot sa opinyon ng lipunan ang humantong sa pananahimik.'
- source_word: לֹא אֵצֵא פָתַח
  choice: at hindi lumabas ng pintuan
  rationale: Pinananatili ang konkretong larawan ng pananatili sa loob; idiomatiko sa Tagalog ang 'lumabas ng pintuan.'
theological_decisions:
- issue: Ugnayan ng talata sa panunumpa ni Job na wala siyang kasalanan
  choice: Pinanatili ang anyong dahilan sa 'sapagkat' at ipinaliwanag sa talababa ang ipinahihiwatig na kondisyon.
  alternative: Isalin nang tahasan bilang 'kung natakot ako...'
  rationale: Eliptiko ang Hebreo at maaaring maunawaan sa balangkas ng kondisyon o panunumpa. Hindi idinagdag sa pangunahing teksto ang salitang 'kung,' upang hindi tahasang lutasin ang sintaktikong tensiyon.
translation_notes:
  register: Makabagong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang 'angkan' para sa sinaunang mas malawak na pangkat ng magkakamag-anak, at pinanatili sa talababa ang tunay na sintaktikong kalabuan ng talata.
