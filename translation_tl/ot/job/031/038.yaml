  text: If my land cries out against me[a], and its furrows weep together,
translation:
  language: tl
  text: Kung ang aking lupa ay sumisigaw laban sa akin, at sabay-sabay na tumatangis ang mga tudling nito[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “umiiyak”; ang pandiwang Hebreo ay karaniwang salita para sa pag-iyak o pagtangis at patulang ginamit dito tungkol sa mga tudling.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Kung
  rationale: Nagpapasimula ito ng kondisyong bahagi ng panunumpa ni Job na wala siyang kasalanan.
- source_word: עָלַי
  choice: laban sa akin
  rationale: Kasama ng זעק, ipinahihiwatig nito na ang lupa ay tumututol o nagpapatotoo laban kay Job, hindi lamang na may nangyayari sa ibabaw niya.
- source_word: אַדְמָתִי
  choice: ang aking lupa
  rationale: Tumutukoy ang אֲדָמָה sa lupang sinasaka; natural at malinaw sa modernong Filipino ang “aking lupa.”
- source_word: תִזְעָק
  choice: ay sumigaw
  rationale: Ang זעק ay malakas na pagsigaw, madalas dahil sa paghihirap o bilang pagtutol. Pinananatili ng “sumigaw” ang masidhing personipikasyon ng lupa.
- source_word: וְיַחַד
  choice: at sabay-sabay
  rationale: Ipinahihiwatig ng יַחַד ang magkakasabay o sama-samang pagkilos ng mga tudling.
- source_word: תְּלָמֶיהָ
  choice: ang mga tudling nito
  rationale: Ang תֶּלֶם ay tudling na nalilikha sa pag-aararo; “mga tudling” ang tiyak at karaniwang katumbas sa kontekstong pansakahan.
- source_word: יִבְכָּיוּן
  choice: na tumangis
  rationale: Mula ito sa בכה, “umiyak” o “tumangis.” Ang “tumangis” ay nagpapanatili sa matinding larawang patula at ipinag-iiba ang pandiwa sa naunang “sumigaw.”
