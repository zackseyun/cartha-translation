  yaml_path: translation/ot/job/031/006.yaml
  text: Let him weigh me in righteous scales[b][a], and let God know my integrity.
translation:
  language: tl
  text: Nawa’y timbangin niya ako sa timbangan ng katarungan[a], at kilalanin ng Diyos ang aking integridad[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa makatarungang timbangan” o “sa patas na timbangan.”
    reason: lexical_alternative
  - marker: b
    text: O “ang aking kawalang-kapintasan” o “ang aking kawalang-sala.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׁקְלֵנִי
  choice: Timbangin niya ako
  rationale: Ang Qal imperfect na may hulaping unang panauhan ay ginagamit dito nang pahintulot o paghiling; inaanyayahan ni Job ang Diyos na siyasatin siya. Likas sa Tagalog ang anyong “Timbangin niya ako” at napananatili nito ang metaporang pansukat at panghukuman.
- source_word: בְמֹאזְנֵי צֶדֶק
  choice: sa makatarungang timbangan
  rationale: Ang מֹאזְנַיִם ay timbangan, at ang צֶדֶק ay maaaring tumukoy sa katuwiran, katarungan, o pagiging patas. Ang “makatarungang timbangan” ay malinaw at marangal na Filipino at pinananatili ang ideya ng patas na pagsusuri.
- source_word: וְיֵדַע
  choice: at kilalanin
  rationale: 'Maaaring ipagpatuloy ng waw at imperfect ang volitional na diwa ng naunang pandiwa. Ang “kilalanin” ay higit kaysa simpleng pagkuha ng impormasyon: sa konteksto, hinihiling ni Job na mapatunayan o tanggapin ng Diyos ang tunay niyang kalagayan.'
- source_word: אֱלוֹהַּ
  choice: ng Diyos
  rationale: Ito ang pang-isahang patulang katawagan para sa Diyos na karaniwan sa Job; walang batayan sa talata upang palawakin ito bilang “Diyos na Makapangyarihan sa lahat.”
- source_word: תֻּמָּתִי
  choice: ang aking katapatan
  rationale: Ang תֻּמָּה ay integridad, pagiging buo sa asal, o kawalang-kapintasan. Ang “katapatan” ay natural sa modernong Filipino at naghahayag ng matuwid na paninindigan ni Job nang hindi ipinahihiwatig ang ganap na kawalan ng kasalanan.
theological_decisions:
- issue: Lakas ng pahayag ni Job tungkol sa sarili
  choice: ang aking katapatan
  alternative: ang aking kawalang-sala; ang aking kawalang-kapintasan
  rationale: Humihiling si Job ng patas na pagsusuri ng Diyos at ipinagtatanggol ang kaniyang moral na integridad. Hindi tahasang ipinapahayag ng salita na siya ay lubos na walang kasalanan; kaya pinananatili ng “katapatan” ang tensiyong teolohikal nang hindi ito nilulutas nang labis.
translation_notes:
  register: Modernong Filipino Tagalog na dignipikado at madaling maunawaan. Ginamit ang “makatarungang timbangan” upang mapanatili ang konkretong metapora at ang diwa ng katarungan; ginamit ang “kilalanin” para sa forensic na pagkilala sa integridad, hindi lamang kaalamang mental.
