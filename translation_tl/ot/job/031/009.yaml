  text: If my heart has been enticed by a woman[a], and I have lain in wait at my neighbor's door[b],
translation:
  language: tl
  text: Kung ang puso ko’y naakit sa isang babae[a], at ako’y palihim na nag-abang sa pintuan ng kapwa ko[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nahikayat” o “nadaya.” Ang pandiwang Hebreo ay maaaring tumukoy sa pagkaakit, pagkahikayat, o pagkadaya; dito ay nasa konteksto ito ng seksuwal na tukso.
