lexical_decisions:
- source_word: נִפְתָּה
  choice: naakit
  rationale: Ang Niphal ng פתה ay maaaring mangahulugang nahikayat, nadaya, o naakit. Sa konteksto ng seksuwal na tukso, likas sa Tagalog ang “naakit” at hindi nito ipinapalagay na ang babae mismo ang sadyang nang-akit.
- source_word: לִבִּי
  choice: ang puso ko
  rationale: Pinananatili nito ang Hebreong larawan ng puso bilang sentro ng pagnanasa, pasiya, at panloob na pagkatao.
- source_word: עַל אִשָּׁה
  choice: sa isang babae
  rationale: Ipinahihiwatig ng parirala ang pinagtutuunan o sanhi ng pagkaakit. Ang “sa isang babae” ay natural sa Tagalog at pinananatili ang kaunting kalabuan ng pang-ukol na עַל.
- source_word: פֶּתַח
  choice: pintuan
  rationale: Ang “pintuan” ay tuwiran at natural na katumbas ng pasukan o bungad ng bahay sa kontekstong ito.
- source_word: רֵעִי
  choice: aking kapwa
  rationale: Ang רֵעַ ay maaaring tumukoy sa kapwa, kaibigan, o kasamahan. Ang “kapwa” ay angkop sa malawak na ugnayang panlipunan at hindi nagpapahiwatig ng matalik na pagkakaibigan.
- source_word: אָרָבְתִּי
  choice: ako'y nag-abang
  rationale: Ipinahahayag ng ארב ang palihim at sinasadyang paghihintay. Ang “nag-abang” ay natural at may sapat na pahiwatig ng lihim na masamang balak nang hindi nagdaragdag ng hayagang karahasan.
theological_decisions:
- issue: Moral na paglalarawan sa panunumpa ni Job tungkol sa pangangalunya
  choice: Panatilihin ang pag-usad mula sa panloob na pagkaakit tungo sa sinasadyang palihim na pag-abang sa pintuan ng kapwa.
  alternative: Gawing mas malumanay bilang romantikong pagkagusto, o gawing tahasang pagtatangkang mangalunya.
  rationale: Ipinapakita ng Hebreo kapwa ang pagnanasa ng puso at ang panlabas na lihim na pagkilos. Pinananatili ng salin ang bigat ng usaping moral nang hindi nagdaragdag ng detalyeng hindi tahasang sinabi.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang anyong kondisyonal at ang larawan ng puso; ginamit ang “nag-abang” upang maipahayag ang palihim at sinasadyang pagkilos. Ang kuwit sa hulihan ay angkop dahil nagpapatuloy ang kondisyong pangungusap sa kasunod na talata.
