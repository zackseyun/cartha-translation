  text: kung itinaas ko ang aking kamay laban sa batang walang ama[a] dahil nakita kong may sumusuporta sa akin sa tarangkahan ng lungsod[b][c]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ulila.” Ang salitang Hebreo ay partikular na tumutukoy sa isang nawalan ng ama at dahil dito ay mahina ang katayuan sa lipunan.
    reason: lexical_alternative
  - marker: b
    text: Ang “tarangkahan ng lungsod” ay lugar kung saan humahatol ang mga pinuno at ginagawa ang mga pampublikong pasiya.
    reason: cultural_note
  - marker: c
    text: Sa literal, “ang tulong ko”; dito ay nangangahulugang suporta o pagkakaroon ng mga kakampi sa isang legal o pampublikong usapin.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: kung
  rationale: Ipinananatili ang pasubaling anyo ng panunumpa sa Job 31, na nagpapatuloy sa kaparusahang binabanggit sa susunod na talata.
- source_word: הֲנִיפוֹתִי עַל ... יָדִי
  choice: itinaas ko ang aking kamay laban sa
  rationale: Inilalarawan ng Hiphil ng נוּף ang mapagbanta o mapanakit na pagtaas ng kamay; natural sa Filipino ang pariralang ito at hindi nito labis na tinutukoy kung anong uri ng pananakit ang ginawa.
- source_word: יָתוֹם
  choice: batang walang ama
  rationale: Tiyak na tumutukoy ang salitang Hebreo sa isang nawalan ng ama at dahil dito ay mahina ang katayuan sa lipunan; mas eksakto ito kaysa sa karaniwang pagkaunawa sa “ulila,” na maaaring walang ama, ina, o kapwa magulang.
- source_word: כִּי
  choice: dahil
  rationale: Ipinahahayag dito ang dahilan ng posibleng pang-aabuso sa kapangyarihan.
- source_word: אֶרְאֶה
  choice: nakita kong
  rationale: Pinananatili ang larawan ng pagkakita, habang natural ding nauunawaan bilang pagkilala o pagkaalam sa suportang taglay niya.
- source_word: בַשַּׁעַר
  choice: sa pintuang-bayan
  rationale: Ang tinutukoy ay ang pintuan ng lungsod o bayan bilang lugar ng paglilitis at mga pampublikong pasiya; nililinaw ng tambalang salita ang institusyong tinutukoy.
- source_word: עֶזְרָתִי
  choice: may kakampi ako
  rationale: Bagaman literal na “ang tulong ko,” sa konteksto ay tumutukoy ito sa mga taong sumusuporta o kumakampi kay Job sa pampubliko o legal na usapin.
