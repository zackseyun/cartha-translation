  text: if I have eaten its produce without payment[a], or caused its owners to lose heart—
translation:
  language: tl
  text: kung kinain ko ang ani nito nang hindi ko ito binayaran, o pinanghina ko ang loob ng mga may-ari nito[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas literal, “pinaubos ko ang buhay ng mga may-ari nito” o “pinahingal ko ang mga may-ari nito.” Bihira ang pandiwang Hebreo, at maaaring tumukoy ang parirala sa matinding pang-aapi o sa pagkitil ng buhay.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּחָהּ
  choice: ani nito
  rationale: Literal itong tumutukoy sa “lakas” ng lupain, ngunit sa kontekstong pansakahan ay ang bunga o ani na iniluluwal nito ang ibig sabihin.
- source_word: אָכַלְתִּי
  choice: kinain ko
  rationale: Pinananatili ang karaniwang kahulugang “kumain,” na rito ay tumutukoy sa pagkonsumo o pakikinabang sa ani ng lupain.
- source_word: בְלִי כָסֶף
  choice: nang hindi nagbabayad
  rationale: Bagaman literal na “nang walang pilak,” ang pilak ay ginagamit bilang salapi; malinaw na ipinahihiwatig ng parirala ang hindi pagbabayad.
- source_word: נֶפֶשׁ בְּעָלֶיהָ
  choice: ang loob ng mga may-ari nito
  rationale: Ang נֶפֶשׁ ay maaaring mangahulugang buhay, sarili, o hininga. Ang “loob” ay natural na bahagi ng idyomang Filipino na “pinanghina ang loob,” habang ang mas literal at mas matinding posibilidad ay inilalahad sa talababa.
- source_word: הִפָּחְתִּי
  choice: pinanghina ko
  rationale: Bihira at mahirap tiyakin ang pandiwang ito. Maaaring tumukoy ito sa pagpapahingal, pagpapanghina, o pagkitil ng buhay; ang pangunahing salin ay hindi nagpapasya nang labis, at pinananatili sa talababa ang ibang posibilidad.
theological_decisions: []
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “ani” para sa produktibong lakas ng lupa at ang natural na idyomang “pinanghina ang loob,” habang pinananatili sa talababa ang tunay na leksikal na kalabuan at ang mas matinding pagbasa.
