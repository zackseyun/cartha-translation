  text: If I have made gold my confidence[a], and said to fine gold[c][b], ‘You are my security,’
translation:
  language: tl
  text: Kung ginawa kong sandigan ang ginto[a], at sinabi ko sa dalisay na ginto[b], ‘Ikaw ang aking katiwasayan[c],’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “aking tiwala,” “pag-asa ko,” o “kumpiyansa ko.”
    reason: lexical_alternative
  - marker: b
    text: Ang “dalisay na ginto” ay salin ng כֶּתֶם, na tumutukoy sa pino o purong ginto.
