    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Kung
  rationale: Ipinakikilala nito ang kondisyong bahagi ng panunumpa ni Job na siya ay walang sala; likas sa Filipino ang payak na “Kung.”
- source_word: שַׂמְתִּי
  choice: ginawa kong
  rationale: Bagaman literal na “inilagay” o “itinakda,” ipinahihiwatig ng konstruksiyon na ginawa niyang saligan ng pagtitiwala ang ginto.
- source_word: זָהָב
  choice: ginto
  rationale: Tuwirang katumbas ng karaniwang salita para sa ginto.
- source_word: כִּסְלִי
  choice: tiwala ko
  rationale: Maaaring mangahulugang tiwala, pag-asa, o kumpiyansa. Ang “tiwala ko” ay natural at malinaw sa konteksto ng pag-asa sa kayamanan.
- source_word: וְלַכֶּתֶם
  choice: at sinabi ko sa dalisay na ginto
  rationale: Ang כֶּתֶם ay tumutukoy sa pino o purong ginto; pinananatili ng “dalisay na ginto” ang pagkakaiba nito sa naunang pangkalahatang זָהָב.
- source_word: אָמַרְתִּי
  choice: sinabi ko
  rationale: Natural na anyong naganap sa loob ng kondisyong sugnay at tumutugma sa Hebreong perpekto.
- source_word: מִבְטַחִי
  choice: aking katiwasayan
  rationale: Tumutukoy ito sa bagay na inaasahan para sa seguridad o kaligtasan. Naiiba ang “katiwasayan” sa naunang “tiwala” at sa gayon ay napapanatili ang leksikal na baryasyon ng Hebreo.
theological_decisions:
- issue: Ang pagtanggi ni Job na umasa sa kayamanan
  choice: 'Pinanatili bilang kondisyong pahayag: “Kung ginawa kong tiwala ko ang ginto...”'
  alternative: “Kung inilagak ko sa ginto ang aking pag-asa...”
  rationale: Ipinahahayag ng talata ang pagtanggi ni Job sa pagtrato sa kayamanan bilang sukdulang saligan ng tiwala, nang hindi nagdaragdag ng mga kategoryang teolohikal na wala sa teksto.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “katiwasayan” upang mapanatili ang pagkakaiba ng כִּסְלִי at מִבְטַחִי, bagaman bahagya itong mas pormal kaysa karaniwang pananalita.
