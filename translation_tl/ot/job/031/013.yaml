  text: If I have rejected the case of my male servant or my female servant when they brought a complaint against me[b][a],
translation:
  language: tl
  text: Kung itinakwil ko ang karapatan ng aking aliping lalaki o ng aking aliping babae[a] nang magsampa sila ng reklamo laban sa akin[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “aking lingkod na lalaki o lingkod na babae.” Ang Hebreo ay literal na “aking aliping lalaki at aking aliping babae.”
    reason: lexical_alternative
  - marker: b
    text: O “nang makipagtalo sila sa akin.” Ang Hebreo ay gumagamit ng salitang maaaring tumukoy sa pagtatalo, reklamo, o usaping legal.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Kung
  rationale: Nagsisimula ito ng kondisyunal na sugnay sa panunumpa ni Job na wala siyang kasalanan.
- source_word: אֶמְאַס
  choice: ipinagkait ko
  rationale: Sa legal na konteksto, ipinahihiwatig ng pandiwa ang pagtanggi o hindi pagbibigay-pansin sa nararapat na kahilingan, hindi lamang personal na paghamak.
- source_word: מִשְׁפַּט
  choice: ang katarungan
  rationale: Maaaring tumukoy ang salita sa katarungan, karapatang legal, o usaping dinidinig. Likas sa Filipino ang 'ipinagkait ang katarungan' at pinananatili nito ang legal at moral na saklaw ng salita.
- source_word: עַבְדִּי וַאֲמָתִי
  choice: aking aliping lalaki o aliping babae
  rationale: Malinaw nitong ipinapakita ang nakagapos na katayuan at ang hayagang pagkakaiba ng kasarian sa dalawang salitang Hebreo.
- source_word: בְּרִבָם
  choice: nang magsampa sila ng reklamo
  rationale: Ang ריב ay wika ng pagtatalo o usaping legal; ang 'magsampa ng reklamo' ay natural na Filipino at malinaw na naghahayag ng legal na tunggalian.
- source_word: עִמָּדִי
  choice: laban sa akin
  rationale: Bagaman literal na 'kasama ko,' ang parirala sa konteksto ng pagtatalo ay nagpapahiwatig na si Job ang inirereklamo.
theological_decisions:
- issue: Saklaw ng מִשְׁפַּט
  choice: katarungan
  alternative: usapin o karapatang legal
  rationale: Hindi nililimitahan ang teksto sa isang teknikal na demanda lamang; nananatili ang posibilidad na tumukoy ito sa kanilang makatarungang karapatan o kaso.
translation_notes:
  register: Makabago at marangal na Filipino. Ginamit ang tuwirang terminong 'alipin' upang hindi ikubli ang posibleng nakagapos na katayuan, habang inilagay sa talababa ang mas tradisyonal na 'lingkod.' Pinanatili rin sa talababa ang saklaw ng legal na pananalita.
