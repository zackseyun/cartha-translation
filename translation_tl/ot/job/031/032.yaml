  text: The sojourner did not spend the night outside[a]; I opened my doors to the traveler.
translation:
  language: tl
  text: Walang dayuhang nakikipamayan ang nagpalipas ng gabi sa labas[a]; binuksan ko ang aking mga pinto para sa manlalakbay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa lansangan.” Ang “dayuhang nakikipamayan” ay tumutukoy sa di-katutubong naninirahan o nakikituloy sa isang pamayanan.
    reason: Ipinapakita ang posibleng kontekstuwal na diwa ng בַּחוּץ at nililinaw ang katayuang ipinahihiwatig ng גֵּר nang walang maling kahulugan na “nakikilalang dayuhan.”
lexical_decisions:
- source_word: בַּחוּץ
  choice: sa labas
  rationale: Tuwirang ipinapahayag nito ang pagiging nasa labas o lantad na lugar, at natural ito sa makabagong Tagalog.
- source_word: יָלִין
  choice: nagpalipas ng gabi
  rationale: Tiyak na tumutukoy ang pandiwa sa pagtuloy o pananatili nang magdamag; malinaw na naipapahayag ng pariralang ito ang temporal na diwa.
- source_word: גֵּר
  choice: dayuhan
  rationale: Tumutukoy ito sa isang hindi katutubo na naninirahan o nakikituloy sa gitna ng ibang bayan. Ang “dayuhan” ay likas at madaling maunawaan, bagaman hindi nito lubos na naipapakita ang katayuang panlipunan ng salitang Hebreo.
- source_word: דְּלָתַי
  choice: aking mga pinto
  rationale: Pinananatili ang anyong maramihan ng Hebreo at ang larawan ng bukás na tahanan bilang pagpapakita ng kagandahang-loob.
- source_word: לָאֹרַח
  choice: para sa manlalakbay
  rationale: Sa konteksto, ang אֹרַח ay taong naglalakbay at nangangailangan ng matutuluyan, hindi ang daan mismo.
- source_word: אֶפְתָּח
  choice: binubuksan ko
  rationale: Ang aspektong di-ganap ay inuunawa bilang nakagawiang kilos sa pagtatanggol ni Job sa kanyang pamumuhay. Ang pangkasalukuyang anyong Tagalog ay natural na nagpapahayag ng ganitong ugali.
