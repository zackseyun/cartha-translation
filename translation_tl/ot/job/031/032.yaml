  register: Makabago, marangal, at madaling maunawaang Tagalog. Ginamit ang “dayuhan” at “manlalakbay” upang mapanatili ang pagkakaiba ng dalawang katawagang Hebreo, at ang “binubuksan ko” upang ipahiwatig ang nakagawiang pagtanggap sa panauhin.
