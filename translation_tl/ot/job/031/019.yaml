lexical_decisions:
- source_word: אִם
  choice: kung
  rationale: Ipinananatili ang kondisyunal na panimula ng panunumpa ni Job sa kaniyang kawalang-sala.
- source_word: אֶרְאֶה
  choice: nakakita ako
  rationale: Sa konteksto ng pagbabalik-tanaw sa kabanata, likas sa Tagalog ang aspektong kontemplatibo upang tukuyin ang anumang nagawa niya noon.
- source_word: אֹבֵד
  choice: sinumang namamatay
  rationale: Ang participle ay naglalarawan sa isang taong nasa kalagayan ng pagkapahamak; ipinahahayag ng “sinumang namamatay” ang patuloy na kalagayan at di-tiyak na tinutukoy.
- source_word: מִבְּלִי לְבוּשׁ
  choice: dahil walang maisuot
  rationale: Natural itong pahayag ng kakulangan sa damit at pinananatili ang posibleng sanhi ng pagkapahamak na ipinahihiwatig ng parirala.
- source_word: וְאֵין
  choice: o ... walang
  rationale: Bagaman karaniwang pang-ugnay ang וְ, mas natural ang “o” sa Tagalog sa magkatumbas na mga kondisyon ng panunumpa, nang hindi itinatangging magkaparis ang dalawang linya.
- source_word: כְּסוּת
  choice: maipantakip
  rationale: Pinananatili nito ang larawan ng pantakip at ang bahagyang leksikal na pagkakaiba nito sa לְבוּשׁ, “maisusuot/damit.”
- source_word: לָאֶבְיוֹן
  choice: isang nangangailangan
  rationale: Tumutukoy sa taong salat o dukha; malinaw at dignified ang “isang nangangailangan” nang hindi labis na nililimitahan ang kahulugan.
