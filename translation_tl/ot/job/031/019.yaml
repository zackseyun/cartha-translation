translation_notes:
  register: Makabagong, dignified, at madaling maunawaang Filipino. Pinanatili ang anyong di-kumpletong kondisyunal dahil nagpapatuloy ang panunumpa sa kasunod na mga talata; ginamit ang “maipantakip” upang mapanatili ang poetic parallelism nang hindi inuulit lamang ang “maisuot.”
