translation_notes:
  register: Modernong Filipino na natural ngunit marangal. Ginamit ang “tumubo sana” upang maipakita ang kontekstuwal na diwa ng sumpa, at ang “Dito nagwakas” bilang malinaw na pangwakas na pormula.
