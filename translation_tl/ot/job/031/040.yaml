base_translation:
  language: en
  yaml_path: translation/ot/job/031/040.yaml
  text: Instead of wheat[a], let thorns come up, and instead of barley, stinkweed. The words of Job are ended.
translation:
  language: tl
  text: Sa halip na trigo, tumubo sana ang mga tinik, at sa halip na sebada, mabahong damo.[a] Nagtapos na ang mga salita ni Job.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nakalalasong damo” o “mapaminsalang damo”; hindi tiyak kung anong halaman ang tinutukoy ng salitang Hebreo.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּחַת
  choice: sa halip na
  rationale: Sa kontekstong ito ng sumpa tungkol sa ani, substitution ang diwa, hindi pisikal na lokasyon.
- source_word: חִטָּה
  choice: trigo
  rationale: Karaniwang tawag sa Filipino sa butil na kaibahan ng mapaminsalang halaman.
- source_word: יֵצֵא
  choice: tumubo sana
  rationale: Kapag halaman ang paksa, ipinahihiwatig ng pandiwa ang paglitaw mula sa lupa; ipinapahayag ng “sana” ang diwa ng sumpa o hiling sa konteksto.
- source_word: חוֹחַ
  choice: mga tinik
  rationale: Malinaw at likas na panumbas para sa pangkalahatang matinik at mapaminsalang halaman.
- source_word: שְׂעֹרָה
  choice: sebada
  rationale: Karaniwang modernong Filipino na tawag sa barley.
- source_word: בָאְשָׁה
  choice: mabahong damo
  rationale: Pinananatili ang malamang na kaugnayan ng salita sa masamang amoy, habang hindi nagkukunwaring tiyak ang eksaktong uring botanikal.
- source_word: תַּמּוּ
  choice: nagwakas
  rationale: Maikli at marangal na pahayag na malinaw na nagsisilbing pangwakas na tala.
- source_word: דִּבְרֵי אִיּוֹב
  choice: ang mga salita ni Job
  rationale: Tuwirang salin ng construct phrase at pinananatili ang pormal na pangwakas na pahayag.
