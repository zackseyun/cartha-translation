  text: this too would be an iniquity for the judges[b][a], for I would have denied God above.
translation:
  language: tl
  text: Ito rin ay paglabag na dapat hatulan ng mga hukom,[a] sapagkat itinakwil ko sana ang Diyos na nasa kaitaasan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “paglabag na saklaw ng hukuman,” “kasalanang maaaring parusahan ng mga hukom,” o “kasalanang nararapat sa paghatol.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “sapagkat nagtaksil sana ako sa Diyos na nasa kaitaasan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם הוּא
  choice: Ito rin
  rationale: Tumutukoy ito sa gawaing binanggit sa naunang talata at idinaragdag iyon sa mga kasalanang itinatanggi ni Job.
- source_word: עָוֺן
  choice: kasalanan
  rationale: Likas at marangal na salitang Filipino na nagpapanatili sa moral at legal na bigat ng terminong Hebreo.
- source_word: פְּלִילִי
  choice: dapat hatulan
  rationale: Ipinahahayag ang kaugnayan nito sa pagpapasiya o paghatol ng hukuman, habang iniiwasang gawing tiyak ang hindi ganap na tiyak na anyong Hebreo.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala ang dahilan kung bakit maituturing na kasalanang dapat hatulan ang naturang gawa.
- source_word: כִחַשְׁתִּי
  choice: itinakwil ko sana
  rationale: Sa konteksto ng pagsamba sa mga bagay sa langit, higit ito sa simpleng pagsisinungaling at nagpapahiwatig ng pagtatwa o pagtataksil sa Diyos; ipinakikita ng 'sana' ang di-tunay na kondisyon sa mas malawak na panunumpa ni Job.
- source_word: לָאֵל
  choice: ang Diyos
  rationale: Likas sa Filipino ang tuwirang layon pagkatapos ng 'itinakwil,' bagaman may pang-ukol sa Hebreo.
- source_word: מִמָּעַל
  choice: na nasa kaitaasan
  rationale: Pinananatili ang maikling patayong paglalarawan sa Diyos at ang kaibahan sa mga bagay sa langit na nabanggit sa konteksto, nang hindi dinaragdagan ng tahasang 'langit.'
theological_decisions:
- issue: Kung palalawakin ang מִמָּעַל bilang tahasang pagtukoy sa langit
  choice: ang Diyos na nasa kaitaasan
  alternative: ang Diyos sa itaas; ang Diyos sa langit
  rationale: Pinananatili ng salin ang patayong kaibahan sa konteksto ngunit hindi nagdaragdag ng 'langit,' na wala nang tahasan sa Hebreo.
- issue: Kung ang כִחַשְׁתִּי ay simpleng pagsisinungaling o pagtatwa/pagtataksil sa Diyos
  choice: itinakwil ko sana
  alternative: nagtaksil sana ako sa Diyos; nagsinungaling sana ako sa Diyos
  rationale: Ang konteksto ng posibleng pagsamba sa araw o buwan ay sumusuporta sa pagtatwa sa Diyos, ngunit inilalagay sa talababa ang alternatibong diwa ng pagiging di-tapat upang mapanatili ang saklaw ng pandiwa.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang 'dapat hatulan' upang malinaw na maipakita ang legal na himig ng talata; pinanatili sa mga talababa ang tunay na leksikal na mga alternatibo.
