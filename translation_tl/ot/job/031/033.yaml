  text: if I have covered my transgressions like Adam[a], by hiding my iniquity in my bosom—
translation:
  language: tl
  text: 'Kung tinakpan ko ang aking mga pagsalangsang gaya ng tao[a],

    sa pag-iingat ng aking pagkakasala na nakatago sa aking dibdib—'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “gaya ni Adan.” Ang Hebreong אָדָם ay maaaring mangahulugang “tao” o tumukoy sa pangalang “Adan.”'
    reason: alternative_reading
lexical_decisions:
- source_word: אִם
  choice: Kung
  rationale: Ipinakikilala nito ang kondisyon sa panunumpang pahayag ni Job nang hindi dinaragdagan ang diin ng Hebreo.
- source_word: כִּסִּיתִי
  choice: tinakpan ko
  rationale: Pinananatili ang kongkretong talinghaga ng כסה, ‘takpan’ o ‘itago,’ habang malinaw pa ring tumutukoy sa pagtatangkang maglihim ng kasalanan.
- source_word: כְאָדָם
  choice: gaya ng tao
  rationale: Maaaring pangkaraniwang pangngalan ang אָדָם na nangangahulugang ‘tao,’ ngunit maaari rin itong basahin bilang pangalang ‘Adan’; pinananatili sa talababa ang mahalagang alternatibong ito.
- source_word: פְּשָׁעָי
  choice: aking mga pagsalangsang
  rationale: Ang פֶּשַׁע ay tumutukoy sa paglabag o paghihimagsik; ang ‘mga pagsalangsang’ ay nagpapanatili ng moral at legal na bigat nito.
- source_word: לִטְמוֹן
  choice: sa pagkukubli
  rationale: Ipinahahayag ang paraan ng pagtatakip at pinananatili ang diwa ng טמן, ‘itago’ o ‘ikubli.’
- source_word: בְּחֻבִּי
  choice: sa aking dibdib
  rationale: Pinananatili ang kongkretong larawan ng lihim na pagtatago sa dibdib o kandungan sa halip na gawing abstraktong ‘sa lihim.’
- source_word: עֲוֺנִי
  choice: aking kasamaan
  rationale: Maaaring tumukoy ang עָוֹן sa kasamaan, sala, o pananagutang bunga nito. Ang ‘kasamaan’ ay natural sa modernong Tagalog at hindi nito ipinapako ang salita sa konsepto lamang ng pagkakasala o kaparusahan.
theological_decisions:
- issue: Pagbasa sa אָדָם sa כְאָדָם
  choice: 'pangkaraniwang pangngalan: “gaya ng tao”'
  alternative: 'pangngalang pantangi: “gaya ni Adan”'
  rationale: Tunay na pinahihintulutan ng Hebreo ang generic na pagtukoy sa tao at ang posibleng pagtukoy kay Adan. Nasa pangunahing teksto ang common-noun reading, habang nasa talababa ang matagal nang kinikilalang pagbasa kay Adan upang hindi tuluyang lutasin ang kalabuan.
translation_notes:
  register: Makabago ngunit marangal at patulang Tagalog. Pinanatili ang kondisyong hindi pa tapos at ang gitling sa dulo dahil nagpapatuloy ang panunumpang pangungusap sa kasunod na talata. Ang ‘tinakpan’ at ‘sa aking dibdib’ ay sadyang nagpapanatili sa mga kongkretong larawan ng Hebreo.
