  yaml_path: translation/ot/job/031/030.yaml
  text: I have not allowed my mouth to sin by asking for his life with a curse[a].
translation:
  language: tl
  text: 'Hindi ko hinayaang magkasala ang aking bibig

    sa paghingi ng kanyang buhay sa pamamagitan ng sumpa.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa pamamagitan ng panunumpa.” Maaaring mangahulugan ang salitang Hebreo ng “sumpa” o “panunumpa,” ngunit sa kontekstong ito ng paghahangad ng kapahamakan, mas angkop ang “sumpa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: נָתַתִּי
  choice: hinayaang
  rationale: Ang literal na “ibinigay” kasama ng pawatas ay isang idyomang nagpapahayag ng pagpapahintulot; natural itong naihahayag sa Filipino bilang “hinayaang.”
- source_word: לַחֲטֹא
  choice: magkasala
  rationale: Pinananatili nito ang karaniwang moral na diwa ng חטא at inilalarawan ang maling pananalitang hindi pinahintulutan ni Job.
- source_word: חִכִּי
  choice: aking bibig
  rationale: Bagaman literal na “ngalangala,” ginagamit ito sa tula bilang metonimiya para sa sangkap ng pananalita; “bibig” ang malinaw at natural na katumbas sa Filipino.
- source_word: לִשְׁאֹל
  choice: sa paghingi ng
  rationale: 'Ipinakikita ng pariralang ito kung paano sana nagkasala ang bibig: sa paghiling na kunin o mapahamak ang buhay ng kaaway.'
- source_word: בְּאָלָה
  choice: sa pamamagitan ng sumpa
  rationale: Maaaring tumukoy ang אָלָה sa sumpa o panunumpa. Sa konteksto ng paghahangad ng kapahamakan sa kaaway, higit na angkop ang “sumpa,” habang pinananatili sa talababa ang tunay na alternatibo.
- source_word: נַפְשׁוֹ
  choice: kanyang buhay
  rationale: Sa kontekstong ito, ang נֶפֶשׁ ay tumutukoy sa buhay ng tao, hindi sa isang teknikal na konsepto ng kaluluwa.
