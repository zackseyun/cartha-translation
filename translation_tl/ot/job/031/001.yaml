  text: I have made a covenant with my eyes[a]; so how could I gaze at a virgin?
translation:
  language: tl
  text: Nakipagtipan ako sa aking mga mata; kaya paano ako tititig sa isang birhen?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “bakit pa ako titingin nang masusi sa isang birhen?”
    reason: Pinananatili ang posibleng pagbasa sa וּמָה bilang tanong na “bakit,” at ang אֶתְבּוֹנֵן bilang masusing pagtingin o pagmamasid.
lexical_decisions:
- source_word: בְּרִית כָּרַתִּי
  choice: Nakipagtipan ako
  rationale: Pinananatili nito ang bigat ng Hebreong idyomang literal na “pumutol ng tipan,” ngunit ipinahahayag sa natural na Filipino bilang isang taimtim at may-bisang pangako.
- source_word: לְעֵינָי
  choice: sa aking mga mata
  rationale: Ang לְ ay tumutukoy sa mga mata bilang kaugnay na panig o saklaw ng sariling tipan. Sa pariralang “nakipagtipan ... sa aking mga mata,” malinaw at likas sa Filipino ang personipikasyon.
- source_word: וּמָה
  choice: kaya paano ako
  rationale: 'Ipinahahayag nito ang inferensiyal na ugnayan: dahil sa naunang tipan, itinuturing ni Job na hindi naaayon dito ang sinasadyang pagtitig. Posible rin ang pagbasa na “bakit pa ako,” kaya inilagay ang alternatibo sa talababa.'
- source_word: אֶתְבּוֹנֵן
  choice: tititig
  rationale: Ang anyo ng pandiwa ay nagpapahiwatig ng masusing o sinasadyang pagtingin, hindi lamang ng panandaliang sulyap. Ang “tititig” ay natural at angkop sa moral na konteksto.
- source_word: עַל בְּתוּלָה
  choice: sa isang dalaga
  rationale: Ang בְּתוּלָה ay karaniwang tumutukoy sa isang dalagang hindi pa nakikipagtalik. Sa modernong Filipino, “dalaga” ang pinakanatural at marangal na katawagan; ang “birhen” ay mas tahasang teknikal ngunit maaaring maging di-likas dito.
theological_decisions:
- issue: Kung ang talata ay tuwirang tumutukoy sa mahalay na pagtingin
  choice: Hindi idinagdag ang salitang “mahalay” o “may pagnanasa.”
  alternative: “tititig nang may pagnanasa sa isang dalaga”
  rationale: Ipinahihiwatig ng konteksto ang seksuwal na pagpipigil, ngunit hindi tahasang nasa Hebreong talata ang mga salitang “mahalay” o “pagnanasa.” Pinananatili ng salin ang pahiwatig at tensiyon nang hindi nagpapaliwanag sa mismong teksto.
translation_notes:
  register: Modernong Filipino na natural ngunit marangal. Ginamit ang “nakipagtipan” upang mapanatili ang taimtim na bigat ng בְּרִית, at “dalaga” sa halip na mas teknikal na “birhen.”
