  text: מִסְפַּ֣ר צְ֭עָדַ/י אַגִּידֶ֑/נּוּ כְּמוֹ נָ֝גִ֗יד אֲקָרֲבֶֽ/נּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/031/037.yaml
  text: I would declare to him the number of my steps[c][b][a]; like a prince I would approach him.
translation:
  language: tl
  text: Ipahahayag ko sa kanya[b] ang bilang ng aking mga hakbang[a]; tulad ng isang pinuno[c], lalapit ako sa kanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang salaysay tungkol sa aking mga hakbang.”
    reason: lexical_alternative
  - marker: b
    text: Ang “kanya” ay maaaring tumukoy sa Diyos o sa tagapag-akusa ni Job sa malapit na konteksto.
    reason: alternative_reading
  - marker: c
    text: O “prinsipe” o “maharlika.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִסְפַּר
  choice: ang bilang ng
  rationale: Pangunahing kahulugan nito ang bilang o dami. Pinananatili ng salin ang kongkretong larawan ng Hebreo, habang ipinahihiwatig ng konteksto ang isang buong pagsusulit o pagsasalaysay.
- source_word: צְעָדַי
  choice: aking mga hakbang
  rationale: Literal itong tumutukoy sa mga hakbang, ngunit maaari ring lumarawan sa kilos at takbo ng buhay ng isang tao. Pinananatili ang talinghaga nang hindi ito ipinapaliwanag sa mismong teksto.
- source_word: אַגִּידֶנּוּ
  choice: Ipahahayag ko sa kanya
  rationale: Ang Hiphil ng נגד ay nangangahulugang magpahayag, magsabi, o magbigay-alam. Ang “ipahahayag” ay angkop sa marangal at tila panghukuman na himig ng pananalita ni Job.
- source_word: כְּמוֹ
  choice: tulad ng
  rationale: Tuwiran nitong ipinakikita ang paghahambing sa Hebreo at natural sa makabagong Tagalog.
- source_word: נָגִיד
  choice: isang pinuno
  rationale: Ang salita ay maaaring tumukoy sa pinuno, prinsipe, o taong marangal. Ang “pinuno” ay malinaw at hindi nililimitahan ang kahulugan sa anak ng isang hari.
- source_word: אֲקָרֲבֶנּוּ
  choice: lalapit ako sa kanya
  rationale: Ang Piel ng קרב dito ay nagpapahayag ng paglapit. Pinananatili ng salin ang personal na hulaping panlalaki at ang matapang na pagharap na ipinahihiwatig ng konteksto.
theological_decisions:
- issue: Ang tinutukoy ng mga hulaping panlalaking isahan sa “ipahahayag ko sa kanya” at “lalapit ako sa kanya”
  choice: Pinanatiling “sa kanya” nang hindi tahasang pinangalanan ang tinutukoy.
  alternative: Maaaring tumukoy sa Diyos o sa tagapag-akusa ni Job.
  rationale: Hindi hayagang tinutukoy ng talata kung sino ang tinutukoy ng mga hulapi. Pinananatili ng salin ang kalabuan at tensiyong nasa Hebreo sa halip na magpasok ng isang tiyak na pagpapakahulugan.
translation_notes:
  register: Makabago ngunit marangal ang wika. Ginamit ang “ipahahayag” upang mapanatili ang pormal at panghukumang himig, samantalang ang ayos ng pangungusap ay nananatiling malinaw at likas sa ordinaryong mambabasang Filipino.
