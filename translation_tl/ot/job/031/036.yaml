  yaml_path: translation/ot/job/031/036.yaml
  text: Surely I would carry it on my shoulder[a]; I would bind it on myself like a crown.
translation:
  language: tl
  text: Tiyak na papasanin ko iyon sa aking balikat; isusuot ko iyon na parang korona.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “mga korona” ang anyong ginamit; maaaring masidhing maramihan ito, kaya isinaling “parang korona.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם לֹא
  choice: Tiyak na
  rationale: Sa konteksto ng panunumpa, idiomatikong mariing pagpapatunay ito, hindi karaniwang kondisyong ‘kung hindi.’
- source_word: עַל שִׁכְמִי
  choice: sa aking balikat
  rationale: Tuwirang pinananatili ang isahang ‘balikat’ at ang larawan ng hayagang pagpasan sa kasulatan o paratang.
- source_word: אֶשָּׂאֶנּוּ
  choice: papasanin ko iyon
  rationale: Ang נשׂא ay nangangahulugang buhatin o dalhin; ang ‘papasanin’ ay likas sa Filipino at akma sa paglalagay nito sa balikat.
- source_word: אֶעֶנְדֶנּוּ
  choice: isusuot ko iyon
  rationale: Ang ענד ay tumutukoy sa pagkakabit o pagsusuot ng isang palamuti. Likas na ipinapahayag ng ‘isusuot’ ang larawan nang hindi labis na nililiteral ang paraan ng pagkakatali.
- source_word: עֲטָרוֹת
  choice: parang korona
  rationale: Bagaman maramihan ang anyong Hebreo, maaaring masidhing maramihan ito o tumukoy sa palamuting tulad ng korona. Mas natural sa Filipino ang isahang ‘korona’ sa paghahambing, habang iniingatan sa talababa ang tunay na anyong maramihan.
- source_word: לִי
  choice: sa aking sarili, ipinahiwatig sa ‘isusuot ko’
  rationale: Kasama ng ענד, likas na ipinahihiwatig ng pandiwang Filipino na si Job mismo ang magsusuot nito; hindi na kailangang ulitin ang ‘sa aking sarili.’
