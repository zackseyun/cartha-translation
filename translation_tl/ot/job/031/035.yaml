  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: מִ֤י יִתֶּן לִ֨/י שֹׁ֘מֵ֤עַֽ לִ֗/י הֶן תָּ֭וִ/י שַׁדַּ֣י יַעֲנֵ֑/נִי וְ/סֵ֥פֶר כָּ֝תַ֗ב אִ֣ישׁ רִיבִֽ/י־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/031/035.yaml
  text: Oh[a], that I had someone to hear me! Here is my signature; let the Almighty answer me[b], and let my accuser write out the indictment.
translation:
  language: tl
  text: Kung may makikinig lamang sa akin! Narito ang aking lagda[a]; sagutin sana ako ng Makapangyarihan sa Lahat, at isulat sana ng aking tagapag-akusa ang sakdal laban sa akin.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “aking marka” o “aking tanda.” Malamang na tumutukoy ang Hebreo sa tandang inilagay ni Job bilang pagpapatunay sa kaniyang pahayag.
    reason: lexical_alternative
  - marker: b
    text: 'Mas literal: “at ang kasulatang isinulat ng taong may usapin laban sa akin.” Maikli at maaaring unawain sa higit sa isang paraan ang Hebreo; sa konteksto, hinihiling ni Job ang isang nakasulat na paratang mula sa kaniyang tagapag-akusa.'
    reason: alternative_reading
lexical_decisions:
- source_word: מִי יִתֶּן
  choice: Kung ... lamang
  rationale: Ang idyoma ay nagpapahayag ng matinding paghahangad, hindi literal na tanong na “Sino ang magbibigay?” Natural itong ipinahahayag sa modernong Tagalog sa hulmahang “Kung ... lamang!”
- source_word: שֹׁמֵעַ לִי
  choice: may makikinig ... sa akin
  rationale: Ipinahihiwatig ng participle at ng לִי ang isang taong makikinig sa pahayag o usapin ni Job. Ang “makikinig” ay natural at nananatili ang legal na diwa ng pagdinig sa kaniyang kaso.
- source_word: הֶן
  choice: Narito
  rationale: Pantawag-pansin ito sa bagay na inihaharap ni Job bilang pagpapatunay. Ang “Narito” ay marangal at kasalukuyang gamit.
- source_word: תָּוִי
  choice: aking lagda
  rationale: Ang תָּו ay tanda o marka; dito ay tila tandang nagpapatunay sa pormal na pahayag ni Job. Malinaw na naihahatid ng “lagda” ang gamit nito, habang nasa talababa ang mas literal na mga alternatibo.
- source_word: שַׁדַּי
  choice: Makapangyarihan sa Lahat
  rationale: Karaniwang salin sa Tagalog ng banal na titulong שַׁדַּי, nang hindi nagdaragdag ng mas tiyak na pagpapakahulugang teolohikal.
- source_word: יַעֲנֵנִי
  choice: sagutin sana ako
  rationale: Sa tagpong legal, hinihiling ni Job na tugunin ng Diyos ang kaniyang iniharap na kaso. Ipinakikita ng “sana” ang hinihiling na diwa.
- source_word: וְסֵפֶר
  choice: ang sakdal laban sa akin
  rationale: Literal itong kasulatan o balumbon, ngunit sa kontekstong legal ay tumutukoy sa nakasulat na paratang. Ang “sakdal” ay malinaw sa karaniwang mambabasa at pinananatili ang legal na larawan.
- source_word: כָּתַב
  choice: isulat sana
  rationale: Bagaman anyong perfect ang pandiwa, maaaring unawain ang sugnay bilang pagpapatuloy ng paghahangad ni Job. Pinananatili sa talababa ang mas literal na pagbasa bilang naganap na pagsulat.
- source_word: אִישׁ רִיבִי
  choice: aking tagapag-akusa
  rationale: Literal na “tao ng aking alitan/usapin,” ngunit sa tagpong hukuman ay siya ang naghaharap ng paratang laban kay Job. Ang “tagapag-akusa” ay maikli at malinaw nang hindi tinutukoy kung sino siya.
theological_decisions:
- issue: Legal na larawan sa paghamon ni Job
  choice: Gumamit ng malinaw na legal na mga salitang “lagda,” “tagapag-akusa,” at “sakdal.”
  alternative: Mas literal na “marka,” “taong may usapin laban sa akin,” at “kasulatan.”
  rationale: Inihaharap ni Job ang kaniyang pahayag na parang isang pormal na kaso at humihingi siya ng nakasulat na paratang. Nililinaw ng mga salitang legal ang konteksto nang hindi tinutukoy ang pagkakakilanlan ng tagapag-akusa o nilulutas ang teolohikal na tensiyon ng paghiling niyang sagutin siya ng Makapangyarihan sa Lahat.
- issue: Anyo ng huling sugnay
  choice: 'Unawain bilang paghiling: “isulat sana.”'
  alternative: Unawain bilang pahayag tungkol sa “kasulatang isinulat” ng kaniyang katunggali.
  rationale: Umaayon ang paghiling sa optatibong daloy ng talata at sa hamon ni Job na ilahad ang paratang. Gayunman, dahil perfect ang כָּתַב at maigsi ang Hebreong sugnay, inilalahad sa talababa ang mas literal na alternatibo.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “Kung ... lamang” at “sana” upang natural na ihatid ang paghahangad ni Job. Pinili ang pormal ngunit karaniwang legal na bokabularyo, at iniwasan ang arkaikong “masdan” at sobrang teknikal na pananalita.
