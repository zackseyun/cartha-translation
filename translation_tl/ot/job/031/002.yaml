  yaml_path: translation/ot/job/031/002.yaml
  text: And what is the portion from God above[a], and the inheritance from the Almighty from on high?
translation:
  language: tl
  text: At ano ang bahaging mula sa Diyos sa itaas[a], at ang pamanang mula sa Makapangyarihan mula sa kaitaasan?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “mula sa itaas … mula sa matataas na dako.” Maaaring unawain ang mga pariralang Hebreo bilang mga pang-abay na nagbibigay-diin sa makalangit na pinagmulan ng bahaging inilalaan ng Diyos at ng pamana mula sa Makapangyarihan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֶה
  choice: At ano ang
  rationale: Pinananatili ng “At” ang dugtong sa naunang pangangatwiran, habang ang “ano ang” ay natural na anyo ng retorikal na tanong sa Tagalog.
- source_word: חֵלֶק
  choice: bahagi
  rationale: Ang “bahagi” ay karaniwang katumbas ng isang takdang parte o laang bahagi at maayos na kaparis ng “pamana.”
- source_word: אֱלוֹהַּ
  choice: Diyos
  rationale: Ito ang tuwirang katumbas ng makatang isahang katawagan para sa Diyos sa aklat ng Job.
- source_word: מִמָּעַל
  choice: sa itaas
  rationale: Ipinapahayag nito ang mataas o makalangit na kinaroroonan; pinananatili ng talababa ang posibilidad na unawain itong pang-abay na “mula sa itaas.”
- source_word: וְנַחֲלַת
  choice: at ang pamanang
  rationale: Pinananatili ng “pamana” ang diwa ng minana o itinakdang pag-aari at ang paralelismo sa “bahagi.”
- source_word: שַׁדַּי
  choice: ang Makapangyarihan
  rationale: Isinasalin ang banal na titulo sa malinaw at marangal na modernong Tagalog sa halip na transliterahin ito.
- source_word: מִמְּרֹמִים
  choice: mula sa kaitaasan
  rationale: Pinananatili ang pinagmumulang ipinahihiwatig ng pang-ukol at ang maramihang/hebraikong larawan ng matataas na dako nang hindi tahasang idinaragdag ang “langit.”
theological_decisions:
- issue: Magkaparis na mga katawagan sa Diyos sa tulang Hebreo
  choice: Isalin ang אֱלוֹהַּ bilang “Diyos” at ang שַׁדַּי bilang “ang Makapangyarihan.”
  alternative: “Diyos … Shaddai”
  rationale: Ang dalawang katawagan ay magkatapat sa tula. Ang pagsasalin sa dalawa ay naghahatid ng kahulugan sa karaniwang mambabasa nang hindi nagdaragdag ng denominasyonal na pakahulugan.
- issue: Pagkakaugnay ng “sa itaas” sa unang taludtod
  choice: Panatilihin ang posibleng pagbasa na inilalarawan nito ang Diyos, habang itinatala sa talababa ang pagbasa rito bilang makalangit na pinagmulan ng bahagi.
  alternative: “bahaging mula sa itaas na galing sa Diyos”
  rationale: Maaaring iugnay ang pariralang Hebreo sa Diyos o unawain nang higit na pang-abay. Hindi dapat tahimik na lutasin ang tunay na kalabuan.
translation_notes:
  register: Makabago ngunit marangal na Tagalog. Pinanatili ang anyong retorikal at ang balanseng paralelismo ng “bahagi” at “pamana.” Ang bahagyang di-pangkaraniwang pag-uulit ng “mula” ay sumasalamin sa dalawang pariralang pinagmulan sa Hebreo.
