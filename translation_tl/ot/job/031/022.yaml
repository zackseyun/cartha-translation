  text: then let my shoulder fall from its socket[b][a], and let my arm be broken from its bone.
translation:
  language: tl
  text: kung magkagayon, malaglag nawa ang balikat ko mula sa kinalalagyan nito,[a] at mabali nawa ang braso ko mula sa buto nito.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mula sa balikat” o “mula sa kasukasuan.” Malamang na inilalarawan ng Hebreo ang balikat na natanggal sa kinalalagyan nito.
    reason: lexical_alternative
  - marker: b
    text: O “mula sa kasukasuan nito.” Bihira ang salitang Hebreo at maaaring tumukoy sa buto o sa dugtungan ng braso.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּתֵפִי
  choice: ang balikat ko
  rationale: Karaniwang tumutukoy ang כָּתֵף sa balikat o tagiliran; sa konteksto ng sumpang ukol sa katawan, “balikat” ang pinakanatural at kaagapay ng “braso” sa kasunod na parirala.
- source_word: מִשִּׁכְמָה
  choice: mula sa kinalalagyan nito
  rationale: Maaaring tumukoy ang שִׁכְמָה sa bahagi ng balikat o likod. Ipinahihiwatig ng pandiwang “malaglag” ang pagkahiwalay ng balikat sa kinalalagyan o dugtungan nito; pinananatili ng salin ang larawang ito nang hindi tiyakang ginagawang “kasukasuan” ang salitang Hebreo.
- source_word: תִפּוֹל
  choice: malaglag nawa
  rationale: Literal na “mahuhulog/malaglag” ang pandiwa. Ang “malaglag nawa” ay nagpapanatili sa konkretong larawan at sa anyo ng sumpang ipinapataw ng nagsasalita sa sarili.
- source_word: וְאֶזְרֹעִי
  choice: at ... ang braso ko
  rationale: Ang זְרוֹעַ ay karaniwang “braso”; walang dahilan sa konteksto upang paliitin ito sa “bisig” o “bisig sa ibaba ng siko.”
- source_word: מִקָּנָה
  choice: mula sa buto nito
  rationale: Bihira at hindi ganap na tiyak ang pangngalan dito, ngunit sa anatomikal na konteksto ay malamang na tumutukoy sa buto o kayariang pinagdurugtungan ng braso. “Buto” ang konkretong pangunahing salin, habang inilalagay sa talababa ang “kasukasuan” bilang alternatibo.
- source_word: תִשָּׁבֵר
  choice: mabali nawa
  rationale: 'Ang Niphal ng שׁבר ay pasibo: “mabali.” Ang “mabali nawa” ay natural na Filipino at nagpapanatili sa imprekatoryong himig.'
