  source_fidelity: 'Tapat ang salin sa estruktura at imprekatoryong pananalita ng Hebreo: ang balikat ay “malaglag” at ang braso ay “mabali.” Ang “mula sa kinalalagyan nito” ay isang maingat at natural na paraan upang ihatid ang anatomikal na paghihiwalay na ipinahihiwatig sa konteksto, nang hindi sapilitang itinatakda ang eksaktong kahulugan ng bihirang termino.'
  naturalness: Makabago ngunit marangal ang Filipino. Ang “kung magkagayon” at ang dalawang “nawa” ay malinaw na naghuhudyat ng kondisyonal na sumpang ipinapataw ni Job sa sarili. Naiintindihan ang “mabali ... mula sa buto nito” bilang marahas na larawang pagkahiwalay/pagkabali ng braso, bagaman sinadyang matindi at hindi pangkaraniwan ang imahen gaya ng pinagmulan.
  terminology: 'Ang “balikat,” “braso,” at “buto” ay angkop na pangunahing katumbas. Hindi ipinipilit ng salin ang “kasukasuan” bilang teksto; tama itong inilagay bilang alternatibo sa talababa. Wasto rin ang mga anchor: [a] para sa unang hindi tiyak na anatomikal na parirala at [b] para sa ikalawa.'
