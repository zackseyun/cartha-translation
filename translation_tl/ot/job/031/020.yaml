lexical_decisions:
- source_word: אִם לֹא
  choice: kung hindi
  rationale: Pinananatili ang kondisyonal na anyo ng panunumpa ni Job sa halip na tahasang ilahad ang ipinahihiwatig na sumpa sa sarili.
- source_word: בֵרֲכוּנִי
  choice: ako pinagpala
  rationale: Pinananatili ang karaniwang kahulugang ‘pagpalain’; sa konteksto, ipinahihiwatig nito ang pagpapasalamat ng taong natulungan, ngunit hindi iyon ipinapalit sa mismong idyoma.
- source_word: חֲלָצָיו
  choice: kanyang baywang
  rationale: Ang baywang ang literal na tinutukoy at kumakatawan dito sa katawan ng taong dinamitan at pinainit.
- source_word: וּמִגֵּז
  choice: sa balahibo
  rationale: Maaaring tumukoy ang pangngalan sa balahibo ng tupa o sa ginupit na lana; ang ‘balahibo’ ay malinaw at kongkreto, habang inilalahad sa talababa ang saklaw ng salita.
- source_word: כְּבָשַׂי
  choice: aking mga tupa
  rationale: Mas natural ang ‘mga tupa’ sa konteksto ng paglalaan ng balahibo o lana kaysa ‘mga kordero.’
- source_word: יִתְחַמָּם
  choice: siya nainitan
  rationale: Ipinapahayag ang pagkakaroon ng init na bunga ng balahibo, at nililinaw ang taong tinutukoy ng metonimikong ‘baywang.’
theological_decisions:
- issue: Ang ‘pagpapala’ bilang tugon ng dukhang tinulungan
  choice: Pinanatili ang ‘pinagpala’ sa pangunahing teksto.
  alternative: ‘pinasalamatan’
  rationale: Bagaman pasasalamat ang praktikal na diwa sa konteksto, pinananatili ng salin ang teolohikal at emosyonal na saklaw ng ugat na ברך nang hindi ito pinapaliit sa pasasalamat lamang.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Pinanatili ang matalinghagang ‘baywang’ at ang kondisyonal na anyo ng panunumpa; nilinaw sa talababa ang metonimiya at ang posibleng kahulugan ng salitang tumutukoy sa balahibo o lana.
