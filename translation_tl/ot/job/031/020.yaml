    at kung hindi siya nainitan sa lana[b] ng aking mga tupa—'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “kanyang baywang” o “kanyang balakang,” isang pahayag na tumutukoy sa katawan ng taong nangangailangan na dinamitan at pinainit.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “sa balahibo ng aking mga tupa.” Ang salitang Hebreo ay maaaring tumukoy sa balahibo ng tupa o sa ginupit na lana.
