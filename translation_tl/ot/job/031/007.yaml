base_translation:
  language: en
  yaml_path: translation/ot/job/031/007.yaml
  text: if my step has turned aside from the way[a], and my heart has gone after my eyes, and any stain has clung to my hands[b],
translation:
  language: tl
  text: kung ang hakbang ko ay lumihis sa daan, kung ang puso ko ay sumunod sa aking mga mata, at kung may anumang dungis na kumapit sa aking mga kamay,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “anumang batik” o “anumang kapintasan.” Maaaring tumukoy ang salitang Hebreo sa dungis, batik, o kapintasan.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּטֶּה אַשֻּׁרִי מִנִּי הַדָּרֶךְ
  choice: ang hakbang ko ay lumihis sa daan
  rationale: Pinananatili ang konkretong larawan ng hakbang na lumilihis sa daan bilang talinghaga ng pagtalikod sa matuwid na asal. Ang pangnagdaan na diwa ay natural na ipinahihiwatig sa konteksto ng panunumpa ni Job.
- source_word: וְאַחַר עֵינַי הָלַךְ לִבִּי
  choice: ang puso ko ay sumunod sa aking mga mata
  rationale: Malapit ito sa ayos at larawan ng Hebreo habang natural sa modernong Tagalog; pinananatili nito ang ugnayan ng nakita ng mga mata at ng pagnanais o pagpapasya ng puso.
- source_word: לִבִּי
  choice: ang puso ko
  rationale: Pinananatili ang biblikal na katawagang antropolohikal; saklaw nito ang pagnanais, kalooban, at pag-iisip, kaya hindi ito pinaliit sa ‘isip’ lamang.
- source_word: וּבְכַפַּי דָּבַק
  choice: kumapit sa aking mga kamay
  rationale: Ang ‘kumapit’ ay natural na katumbas ng דבק at pinananatili ang larawan ng karumihan o kasalanang nakakabit sa mga gawa ng isang tao.
- source_word: מֻאוּם
  choice: anumang dungis
  rationale: Maaaring tumukoy ang salita sa batik, kapintasan, o dungis. Ang ‘dungis’ ay malinaw sa kontekstong moral ngunit hindi lubusang inaalis ang konkretong larawan.
theological_decisions:
- issue: Ang moral na talinghaga ng daan
  choice: Pinanatili ang ‘daan.’
  alternative: ‘matuwid na pamumuhay’ o ‘tamang asal’
  rationale: Hindi ginawang abstrakto ang larawan ng Hebreo; nananatili ang teolohikal at pampanitikang tensiyon ng paglihis mula sa daan.
- issue: Ang ugnayan ng puso at mga mata
  choice: Pinanatiling literal ang ‘puso’ at ‘mga mata.’
  alternative: ‘ang pagnanasa ko ay sumunod sa aking nakita’
  rationale: Iniiwasan nitong paliitin ang puso sa pagnanasa lamang at pinananatili ang masaklaw na moral na sikolohiya ng Hebreo.
- issue: Pag-uulit ng kondisyong אִם sa serye ng mga sugnay
  choice: Inulit ang ‘kung’ sa bawat sugnay.
  alternative: Isang ‘kung’ lamang sa simula ng talata
  rationale: Nililinaw sa Tagalog na ang tatlong parirala ay magkakaugnay na mga kondisyon sa panunumpang nagpaparusa sa sarili, nang hindi binabago ang kahulugan.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang ‘hakbang,’ ‘daan,’ ‘puso,’ at ‘mga mata’ upang mapanatili ang konkretong biblikal na larawan. Ang pangwakas na kuwit ay angkop sapagkat nagpapatuloy sa kasunod na talata ang kondisyong panunumpa.
