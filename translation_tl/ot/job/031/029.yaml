base_translation:
  language: en
  yaml_path: translation/ot/job/031/029.yaml
  text: If I rejoiced at the ruin of the one who hates me[d][c][b][a], and exulted when evil found him—
translation:
  language: tl
  text: Kung ikinagalak ko ang kapahamakan[a] ng taong napopoot sa akin[b], at nagbunyi ako[c] nang datnan siya ng kapinsalaan[d]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sakuna” o “pagkawasak.”
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “ang taong napopoot sa akin”; ayon sa nakaugaliang salin, “ang aking kaaway.”
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “nagpakasaya” o “natuwa,” na higit na nagdidiin sa maling pagkatuwa sa kapinsalaan ng iba.
    reason: lexical_alternative
  - marker: d
    text: Maaari ring “nang sumapit sa kanya ang kasawian” o “nang datnan siya ng sakuna.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Kung
  rationale: Ipinakikilala nito ang kondisyong bahagi ng panunumpa ni Job tungkol sa kanyang kawalang-sala; likas sa Filipino ang “kung” sa ganitong hindi pa tapos na sugnay.
- source_word: אֶשְׂמַח
  choice: ikinagalak ko
  rationale: Ipinahihiwatig ng שׂמח ang pagkagalak. Ang anyong pangnagdaan ay angkop sa pagbabalik-tanaw ni Job sa kanyang asal.
- source_word: בְּפִיד
  choice: ang kapahamakan
  rationale: Ang פִיד ay tumutukoy sa mapaminsalang pagbagsak, sakuna, o kapahamakan. Malinaw at marangal sa modernong Filipino ang “kapahamakan.”
- source_word: מְשַׂנְאִי
  choice: ng taong napopoot sa akin
  rationale: Pinananatili nito ang pandiwang lakas ng participle—literal na ang taong napopoot kay Job—sa halip na agad itong ibuod bilang “kaaway.”
- source_word: וְהִתְעֹרַרְתִּי
  choice: at nagbunyi
  rationale: Sa paralelismo, tumutukoy ito sa matinding emosyonal na pagkagalak. Naipapahayag ng “nagbunyi” ang lakas nito nang hindi tahasang dinaragdagan ng mapanlibak na diwa ng “nagpakasaya sa sinapit niya.”
- source_word: כִּי
  choice: nang
  rationale: Ipinakikilala rito ang kalagayan o panahong pinagmulan ng pagbubunyi; natural na katumbas sa Filipino ang “nang.”
- source_word: מְצָאוֹ
  choice: datnan siya
  rationale: Ang מצא ay literal na “makatagpo” ngunit maaari ring mangahulugang may sumapit o dumating sa isang tao. Pinananatili ng “datnan siya” ang personipikadong larawan sa natural na Filipino.
- source_word: רָע
  choice: masama
  rationale: Sa kontekstong ito, ang רָע ay masamang pangyayari o kapinsalaan, hindi kinakailangang moral na kasamaan. Pinananatili ng substantibong “masama” ang lawak at kaiklian ng Hebreo.
theological_decisions:
- issue: Ang etikal na diwa ng pagtanggi ni Job na ikagalak ang kapahamakan ng napopoot sa kanya
  choice: Inilarawan ang pagkagalak bilang “nagbunyi” nang hindi tahasang isinalin bilang mapanlibak na pagsasaya.
  alternative: “nagpakasaya” o “natuwa sa sinapit niya”
  rationale: Malinaw na itinatanggi ni Job ang maling pagkatuwa sa kapahamakan ng iba, ngunit hindi kailangang palalimin ng salin ang salita tungo sa tahasang panlilibak. Nasa talababa ang mas matinding posibleng diwa.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang hindi natatapos na kondisyong sugnay sa pamamagitan ng gitling sa dulo, sapagkat nagpapatuloy ang panunumpa sa kasunod na talata. Hindi pinalitan ng “kaaway” ang mas literal na “taong napopoot sa akin,” at pinanatili sa “masama” ang lawak ng רָע habang nililinaw sa talababa na kapinsalaan o kasawian ang tinutukoy.
