  text: if I ate my morsel by myself[a], and the fatherless did not eat from it—
translation:
  language: tl
  text: 'kung kinain kong mag-isa ang aking kapirasong pagkain,

    at hindi kumain mula roon ang batang walang ama—'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֹכַל
  choice: kung kinain ko
  rationale: Sa sunod-sunod na panunumpang may pasubaling sugnay sa Job 31, ang waw ay likas na isinasalin bilang “kung”; ang Qal 1cs ay “kinain ko.”
- source_word: פִּתִּי
  choice: ang aking kapirasong pagkain
  rationale: Ang פַּת ay isang piraso o subo, madalas ng tinapay o pagkain. Pinananatili ng “kapirasong pagkain” ang kongkretong diwa nang hindi nililimitahan sa tinapay.
- source_word: לְבַדִּי
  choice: mag-isa
  rationale: Natural at tuwirang katumbas ito ng “ako lamang/mag-isa” sa konteksto ng pagkain, nang hindi idinaragdag ang mas mariing diwang “para lamang sa sarili ko.”
- source_word: וְלֹא אָכַל
  choice: at hindi kumain
  rationale: Pinag-uugnay ng waw at negasyon ang ikalawang sugnay sa parehong pasubaling pahayag; ang Qal perfect 3ms ay angkop na ipinahayag sa aspektong naganap.
- source_word: יָתוֹם
  choice: ang batang walang ama
  rationale: Partikular na tumutukoy ang Hebreo sa isang nawalan ng ama at sa gayon ay mahina sa lipunan. Mas malinaw ito sa modernong Tagalog kaysa “ulila,” na maaaring mangahulugang nawalan ng isa o kapuwa magulang.
- source_word: מִמֶּנָּה
  choice: mula roon
  rationale: Ang pambabaeng panghalip ay bumabalik sa פִּתִּי. Iniiwasan ng “mula roon” ang di-natural na kasariang pambalarila sa Tagalog at malinaw na tumutukoy sa pagkaing nabanggit.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang anyong pasubali at ang nakabitin na gitling, sapagkat bahagi ang talata ng mas malawak na pormula ng panunumpa. Isinalin nang tahasan ang יָתוֹם upang mapanatili ang espesipikong kahulugang “walang ama.”
