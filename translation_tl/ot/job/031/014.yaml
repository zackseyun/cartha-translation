  text: And what would I do when God rises up? And when he calls me to account[a], what would I answer him?
translation:
  language: tl
  text: At ano ang gagawin ko kapag tumindig ang Diyos? At kapag siyasatin niya ako[a], ano ang isasagot ko sa kanya?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kapag dalawin niya ako” o “kapag hihingan niya ako ng pananagutan.” Ang pandiwang Hebreo ay maaaring mangahulugang dumalaw, magsiyasat, o humingi ng pananagutan; sa kontekstong ito, nangingibabaw ang diwa ng pagsusuri at pananagutan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמָה אֶעֱשֶׂה
  choice: At ano ang gagawin ko
  rationale: Pinananatili ng “At ano” ang pang-ugnay at biglang retorikal na pagtatanong. Ang aspektong di-ganap ng pandiwa ay natural na naipahahayag sa Filipino bilang isang inaasahang gagawin sa hinaharap.
- source_word: כִּי יָקוּם אֵל
  choice: kapag tumindig ang Diyos
  rationale: Ang כִּי ay temporal dito, at ang קום ay literal na “tumindig” o “bumangon.” Pinananatili ng “tumindig” ang larawan ng Diyos na tumatayo upang kumilos, pati ang posibleng hudisyal na himig, nang hindi ito labis na binibigyang-kahulugan.
- source_word: וְכִי יִפְקֹד
  choice: Kapag siniyasat niya ako
  rationale: 'Malawak ang saklaw ng פקד: maaaring dumalaw, magbigay-pansin, magsiyasat, o maningil ng pananagutan. Sa konteksto ng pagsagot sa Diyos, ipinahihiwatig nito ang pagsusuri at pananagutan; natural sa Filipino ang “siniyasat niya ako,” habang inilalahad sa talababa ang ibang mga posibilidad.'
- source_word: מָה אֲשִׁיבֶנּוּ
  choice: ano ang maisasagot ko sa kanya
  rationale: Ang Hiphil ng שוב ay idyomatikong nangangahulugang magbalik ng sagot. Ipinahahayag ng “maisasagot” ang retorikal na diwa ng kawalan ng sapat na maisasagot sa harap ng Diyos.
theological_decisions:
- issue: Larawang hudisyal ng pagkilos ng Diyos
  choice: Ilarawan ang Diyos na tumitindig at sumusuri kay Job, na nagpapahiwatig ng pananagutan ngunit hindi tahasang nililimitahan sa huling paghuhukom.
  alternative: Isalin ang פקד bilang simpleng “dumalaw,” o tahasang sabihing “sinisingil ng pananagutan.”
  rationale: Sinusuportahan ng paralelismo sa “ano ang maisasagot ko” ang hudisyal na himig. Gayunman, hindi hinihingi ng Hebreo ang isang eksklusibong eskatolohikal na pagbasa, at may tunay na lawak ang kahulugan ng פקד.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “tumindig” upang mapanatili ang metapora ng Hebreo, at “siniyasat” upang maipahayag nang natural ang pangunahing kontekstuwal na diwa ng פקד nang hindi ikinukubli ang iba pang posibleng kahulugan.
