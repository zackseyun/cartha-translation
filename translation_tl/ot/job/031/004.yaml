lexical_decisions:
- source_word: הֲלֹא
  choice: Hindi ba
  rationale: Naghahain ito ng retorikal na tanong na umaasa sa sang-ayon na sagot; likas itong ipinapahayag sa modernong Tagalog bilang “Hindi ba...?”
- source_word: הוּא
  choice: niya
  rationale: Tumutukoy ang malayang panghalip sa Diyos sa konteksto. Sapat na natural ang “niya”; ang pagdaragdag ng “mismo” ay maaaring magpalabis sa diin.
- source_word: יִרְאֶה
  choice: nakikita
  rationale: Pinananatili nito ang payak at kongkretong larawan ng Hebreong ראה, nang hindi ito pinalalawak tungo sa abstraktong pahayag tungkol sa kaalaman ng Diyos.
- source_word: דְרָכָי
  choice: ang aking mga lakad
  rationale: Pinananatili ng “mga lakad” ang maramihan at ang metapora ng mga daan o paraan ng pamumuhay; maaari rin itong tumukoy sa asal sa konteksto.
- source_word: וְכָל
  choice: at ... ang lahat ng
  rationale: Pinananatili ang pang-ugnay at ang saklaw ng kabuuan sa ikalawang sugnay.
- source_word: צְעָדַי
  choice: aking mga hakbang
  rationale: Natural sa Tagalog at pinananatili ang kongkretong metapora ng bawat kilos o galaw ni Job.
- source_word: יִסְפּוֹר
  choice: binibilang
  rationale: Direktang ipinapahayag ang karaniwang kahulugang “bilangin,” kasabay ng aspektong pangkasalukuyan na angkop sa katapat na “nakikita.”
theological_decisions:
- issue: Ang kaalaman ng Diyos na ipinahahayag sa pamamagitan ng mga pandiwang antropomorpiko
  choice: Panatilihin ang retorikal na pagpapatibay na nakikita at binibilang ng Diyos ang mga lakad at hakbang ni Job.
  alternative: Hindi ba niya inoobserbahan ang aking asal at itinatala ang lahat ng aking ginagawa?
  rationale: Kongkreto ang mga larawan ng Hebreo—pagkakita at pagbibilang. Pinananatili ng salin ang lakas at tensiyong teolohikal ng mga ito nang hindi ginagawang abstraktong paliwanag tungkol sa omnisiyensiya.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Pinanatili ang matalinghagang “mga lakad” at “mga hakbang,” at ginamit ang retorikal na “Hindi ba” upang maipahiwatig ang inaasahang sang-ayon na sagot.
