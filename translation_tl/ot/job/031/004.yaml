  text: Hindi ba niya nakikita ang aking mga landas at binibilang ang lahat ng aking mga hakbang?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “minamasdan ang aking asal at binibilang ang lahat ng aking mga hakbang.”
