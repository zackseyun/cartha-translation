id: JOB.31.5
reference: Job 31:5
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: אִם הָלַ֥כְתִּי עִם שָׁ֑וְא וַ/תַּ֖חַשׁ עַל מִרְמָ֣ה רַגְלִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/031/005.yaml
  text: If I have walked with falsehood[b][a], and my foot has hastened to deceit—
translation:
  language: tl
  text: Kung lumakad akong kasama ng kabulaanan[b], at nagmadali ang aking paa tungo sa panlilinlang[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “at nagmadali ang aking paa na habulin ang panlilinlang.” Maaaring unawain ang pang-ukol sa Hebreo bilang nagpapahiwatig ng direksiyon—“tungo sa” o “habol sa.”
    reason: lexical_alternative
  - marker: b
    text: Ang “lumakad” ay isang idyomang Hebreo para sa asal o paraan ng pamumuhay ng isang tao.
    reason: cultural_note
lexical_decisions:
- source_word: אִם
  choice: Kung
  rationale: Ipinakikilala nito ang kondisyon sa panunumpa ni Job tungkol sa kanyang kawalang-sala, nang walang idinagdag na diin.
- source_word: הָלַכְתִּי
  choice: lumakad ako
  rationale: Pinananatili ang konkretong talinghaga ng Hebreo para sa asal o paraan ng pamumuhay; ipinaliliwanag ang idyoma sa talababa.
- source_word: עִם
  choice: kasama ng
  rationale: Ipinahahayag ang pakikisama o kaugnayan sa kabulaanan, gaya ng tuwirang kahulugan ng pang-ukol.
- source_word: שָׁוְא
  choice: kabulaanan
  rationale: Bagaman maaari rin itong tumukoy sa kawalang-kabuluhan o kahungkagan, ang etikal na diwang ‘kabulaanan’ ang higit na angkop dahil katambal nito ang panlilinlang.
- source_word: וַתַּחַשׁ
  choice: at nagmadali
  rationale: Inilalarawan ng pandiwa ang mabilis na pagkilos at pinananatili ang masiglang pagsasatao sa paa bilang simuno.
- source_word: עַל
  choice: tungo sa
  rationale: Sa konteksto ng pagkilos, maaaring magpahiwatig ang pang-ukol ng direksiyon patungo sa isang layon; pinananatili sa talababa ang alternatibong ‘habol sa.’
- source_word: מִרְמָה
  choice: panlilinlang
  rationale: Tumutukoy ito sa mapanlinlang o madayang asal at likas na katambal ng ‘kabulaanan’ sa taludtod.
- source_word: רַגְלִי
  choice: aking paa
  rationale: Pinananatili ang isahang bilang at ang poetikong pagsasatao sa paa bilang larawan ng landas ng pagkilos.
theological_decisions:
- issue: Hindi tapos na kondisyong panunumpa
  choice: Pinanatili ang pambungad na ‘Kung’ at ang gitling sa dulo.
  alternative: Gawing ganap na pahayag ng pagtanggi, gaya ng ‘Hindi ako lumakad…’
  rationale: Ang Hebreo ay nagsisimula ng isang kondisyon sa panunumpa ni Job na nagpapatuloy sa kasunod na talata; hindi ito dapat tahimik na gawing tuwirang pagtanggi.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Pinanatili ang mga poetikong larawan ng paglakad at ng paa, habang ang bahagyang di-pangkaraniwang pananalitang ‘lumakad akong kasama ng kabulaanan’ ay sadyang sumusunod sa talinghaga at moral na diin ng Hebreo.
