  source_fidelity: 'Tapat ang salin sa Hebreo: pinananatili ang kondisyunal na אִם sa “Kung,” ang larawan ng “paglakad” na may kabulaanan, ang isahang “aking paa,” at ang pagkilos nito patungo sa panlilinlang. Ang pangwakas na gitling ay wastong nagpapahiwatig na nagpapatuloy ang kondisyunal na panunumpa sa kasunod na talata.'
