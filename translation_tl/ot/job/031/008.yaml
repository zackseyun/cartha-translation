  register: Modernong Filipino na may dignidong himig. Pinanatili ang kongkretong larawang pang-agrikultura at ang anyo ng sumpang ipinapataw sa sarili. Inilagay ang panandang talababa pagkatapos ng sugnay na tinutukoy nito.
