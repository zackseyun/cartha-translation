translation:
  language: tl
  text: Kung gayon, nawa’y maghasik ako at iba ang kumain, at mabunot ang aking mga supling.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mabunot ang aking ani,” o “maalis sa ugat ang aking mga inapo.” Ang Hebreong צֶאֱצָא ay maaaring tumukoy sa anumang sumisibol o lumalabas, maging mga supling o ani.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶזְרְעָה
  choice: maghasik ako
  rationale: Ang Qal cohortative na nasa unang panauhan ay bahagi ng sumpang ipinapataw ni Job sa sarili. Sa kontekstong nagsisimula sa ipinahihiwatig na “kung gayon,” likas sa Filipino ang “maghasik ako” bilang masamang kahihinatnang hinihiling niya laban sa sarili.
- source_word: וְאַחֵר
  choice: at iba
  rationale: Tuwirang ipinapakita ng “iba” ang kaibahan ni Job, na naghahasik, at ng ibang taong makikinabang sa bunga ng kanyang paggawa.
- source_word: יֹאכֵל
  choice: ang kumain
  rationale: Pinananatili ng “kumain” ang literal at kongkretong larawang pang-agrikultura ng pandiwang אכל.
- source_word: וְצֶאֱצָאַי
  choice: ang aking mga supling
  rationale: Maaaring tumukoy ang צֶאֱצָא sa mga anak o inapo, ngunit maaari rin sa anumang tumutubo o lumalabas, gaya ng ani. Ang “mga supling” ay dignido at nagpapanatili sa malamang na pantaong kahulugan habang naiiwan ang larawang organiko ng pagtubo.
- source_word: יְשֹׁרָשׁוּ
  choice: mabunot sana
  rationale: Ipinahahayag nito ang sumpang-diing kahulugan ng Piel at pinananatili ang larawan ng pagbunot mula sa ugat. Ang “sana” ay nagpapalinaw sa imprekatoryong puwersa sa natural na Filipino.
