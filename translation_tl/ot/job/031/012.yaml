  text: For it is a fire that consumes to destruction[a], and it would root out all my produce.
translation:
  language: tl
  text: Sapagkat iyon ay apoy na tumutupok hanggang sa pagkapuksa[a], at wawasakin nito hanggang sa ugat ang lahat ng aking ani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “hanggang sa Abadon.” Ang Hebreong אֲבַדּוֹן ay maaaring mangahulugang “pagkapuksa” o, sa ilang konteksto, ang dako o personipikasyon ng pagkapuksa.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikita ang paliwanag o batayan ng naunang babala sa panunumpa ni Job.
- source_word: אֵשׁ הִיא
  choice: iyon ay apoy
  rationale: Pinananatili ang tahasang metapora at iniuugnay ito sa kasalanang tinutukoy sa naunang talata.
- source_word: עַד אֲבַדּוֹן
  choice: hanggang sa pagkapuksa
  rationale: Ipinahahayag ang sukdulang mapanirang epekto ng apoy. Karaniwang pangngalan ang pinakamalamang na diwa rito, habang inilalagay sa talababa ang posibleng pagbasa na Abadon.
- source_word: תֹּאכֵל
  choice: tumutupok
  rationale: Likas na pandiwang Filipino para sa mapanirang pagkonsumo ng apoy.
- source_word: תְּבוּאָתִי
  choice: lahat ng aking ani
  rationale: Ang salita ay tumutukoy sa bunga o pakinabang mula sa lupa o paggawa; pinananatili ng “ani” ang larawang pansakahan.
- source_word: תְשָׁרֵשׁ
  choice: bubunot
  rationale: Ipinahahayag ang masidhing pandiwang nangangahulugang bunutin o lipulin mula sa ugat, at pinananatili ang larawang pansakahan.
theological_decisions:
- issue: Kahulugan ng אֲבַדּוֹן
  choice: karaniwang pangngalang “pagkapuksa”
  alternative: pangngalang pantanging “Abadon”
  rationale: Sa kontekstong ito ng karunungang panitikan, pinakamalamang na inilalarawan nito ang ganap na kapahamakang dulot ng kasalanan. Gayunman, maaaring tumukoy ang anyong Hebreo sa Abadon sa ibang konteksto, kaya pinananatili ang posibilidad sa talababa.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “tumutupok” at “bubunot” upang mapanatili ang magkakaugnay na larawan ng apoy at lubusang pagkawasak ng ani.
