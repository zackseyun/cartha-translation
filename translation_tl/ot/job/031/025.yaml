  text: if I rejoiced because my wealth was abundant[a], and because my hand had gained much—
translation:
  language: tl
  text: kung nagalak ako dahil sagana ang aking kayamanan, at dahil malaki ang natamo ng aking kamay—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִם
  choice: kung
  rationale: Nagsisimula ito ng kondisyon sa panunumpa ni Job na siya ay walang sala; likas na katumbas sa Tagalog ang “kung.”
- source_word: אֶשְׂמַח
  choice: nagalak ako
  rationale: Ipinahahayag ng pandiwang שׂמח ang pagkagalak o labis na kasiyahan; pinananatili ng “nagalak” ang moral na diin sa pagkalugod dahil sa kayamanan.
- source_word: כִּי רַב חֵילִי
  choice: dahil sagana ang aking kayamanan
  rationale: Causal ang כִּי, ang רַב ay tumutukoy sa kasaganaan, at ang חֵיל sa kontekstong ito ay materyal na yaman o ari-arian.
- source_word: וְכִי כַבִּיר מָצְאָה יָדִי
  choice: at dahil maraming natamo ang aking kamay
  rationale: Pinananatili ang ikalawang causal na sugnay at ang larawan ng “aking kamay,” habang natural na ipinahahayag ng “natamo” ang idyomang מָצְאָה יָדִי tungkol sa nakamit o nakuha sa sariling kakayahan.
theological_decisions:
- issue: Kung kayamanan mismo o pagkagalak dahil sa kasaganaan at sariling pagtatamo ang itinatanggi ni Job
  choice: Itinatanggi ni Job na nagalak siya dahil sagana ang kanyang kayamanan at dahil maraming natamo ang kanyang kamay.
  alternative: Maaaring gawing tila ang pagkakaroon mismo ng kayamanan ang kanyang itinatanggi.
  rationale: Ang dalawang sugnay na may כִּי ay nagbibigay ng dahilan ng pagkagalak, at ang larawan ng kamay ay nagdiriin sa personal na pagtatamo. Hindi sinasabi ng Hebreo na masama sa ganang sarili ang pag-aari ng kayamanan.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “nagalak” sa halip na mas kolokyal na “natuwa,” at pinanatili ang Hebreong larawan ng “aking kamay” nang hindi ginagawang alanganin ang pangungusap.
