  text: Can mortal man be in the right before God? Can a man be pure before his Maker?[a]
translation:
  language: tl
  text: Maaari bang maging matuwid ang taong mortal sa harap ng Diyos? Maaari bang maging dalisay ang isang tao sa harap ng kanyang Maylalang?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O, sa mas pormal na salin: “Maaari bang maging higit na matuwid ang taong mortal kaysa sa Diyos? Maaari bang maging higit na dalisay ang isang tao kaysa sa kanyang Maylalang?”'
    reason: alternative_reading
lexical_decisions:
- source_word: הַאֱנוֹשׁ
  choice: ang taong mortal
  rationale: Ipinananatili nito ang diin ng אֱנוֹשׁ sa kahinaan at pagiging mortal ng tao, hindi lamang sa sangkatauhan sa pangkalahatan.
- source_word: מֵאֱלוֹהַ
  choice: sa harap ng Diyos
  rationale: Sa ugnayan nito sa צדק, natural na ipinahahayag nito ang katayuan ng tao kaugnay ng Diyos, habang kinikilala sa talababa ang posibleng tahasang paghahambing.
- source_word: יִצְדָּק
  choice: maging matuwid
  rationale: Ipinahahayag ng pandiwa ang pagiging tama o matuwid sa kaugnayan sa Diyos; malinaw at marangal ang 'maging matuwid' sa makabagong Tagalog.
- source_word: אִם
  choice: Maaari bang
  rationale: Ginagawang malinaw at natural sa Tagalog ang ikalawang retorikal na tanong at pinananatili ang paralelismo.
- source_word: מֵעֹשֵׂהוּ
  choice: sa harap ng Lumikha sa kanya
  rationale: Ang participle na may hulapi ay nangangahulugang 'kanyang tagagawa/lumikha.' Ang 'Lumikha sa kanya' ay natural at nagpapanatili sa ugnayan ng nilalang at Maylalang.
- source_word: יִטְהַר
  choice: maging dalisay
  rationale: Sinasaklaw ng טהר ang kalinisan o kadalisayan; ang 'dalisay' ay angkop sa moral at espirituwal na paralelismo sa 'matuwid.'
- source_word: גָּבֶר
  choice: isang tao
  rationale: Dito ay katambal ito ng אֱנוֹשׁ. Ang 'isang tao' ay natural at hindi nagdaragdag ng di-tiyak na diin gaya ng 'malakas na lalaki.'
theological_decisions:
- issue: Katayuan ng tao kaugnay ng Diyos
  choice: Inilahad ang talata bilang retorikal na tanong kung maaaring maging matuwid o dalisay ang mortal na tao sa harap ng Diyos.
  alternative: Maaari bang maging higit na matuwid ang taong mortal kaysa sa Diyos, o higit na dalisay kaysa sa Lumikha sa kanya?
  rationale: Maaaring unawain ang konstruksyong may מִן bilang relational ('sa harap ng') o comparative ('higit ... kaysa'). Ang pangunahing salin ay natural na nagpapahayag ng katayuan ng tao kaugnay ng Diyos, samantalang pinananatili ng talababa ang tunay na posibilidad ng tahasang paghahambing nang hindi ipinapasok ang isang mas huling pormulasyong doktrinal.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang patulang paralelismo sa pag-uulit ng “Maaari bang,” gayundin ang kaibhan ng “taong mortal” at “isang tao.”
