  text: Is not their tent-cord pulled up within them? They die[b][a], and not in wisdom.
translation:
  language: tl
  text: Hindi ba nabubunot sa kanila ang tali ng kanilang tolda? Namamatay sila[a] nang walang karunungan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “napapahamak sila.”
    reason: lexical_alternative
  - marker: b
    text: O “bago magtamo ng karunungan.” Ang Hebreo ay literal na “at hindi sa karunungan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: Hindi ba
  rationale: Pinananatili ang anyong patanong na retorikal at ang inaasahang pagsang-ayon.
- source_word: נִסַּע
  choice: nabubunot
  rationale: Ang pandiwa ay maaaring tumukoy sa pagbunot o pag-aalis, gaya ng pagbaklas ng tolda; pinananatili nito ang konkretong larawang kaugnay ng tolda.
- source_word: יִתְרָם
  choice: ang tali ng kanilang tolda
  rationale: Maaaring mangahulugan ang יֶתֶר ng tali, lalo na ng tali ng tolda. Ang kahulugang ito ay angkop sa larawan ng marupok na tahanan ng tao sa naunang talata.
- source_word: בָּם
  choice: mula sa kanila
  rationale: Bagaman karaniwang nangangahulugang “sa kanila” o “nasa loob nila” ang בם, natural na ipinahahayag ng “mula sa kanila” ang pagkakahiwalay ng tali nang hindi inaalis sa talababa ang mas literal na posibilidad.
- source_word: יָמוּתוּ
  choice: Namamatay sila
  rationale: Tuwirang katumbas ito ng karaniwang pandiwang Hebreo para sa pagkamatay.
- source_word: וְלֹא בְחָכְמָה
  choice: nang walang karunungan
  rationale: Natural ito sa modernong Tagalog ngunit nananatiling bukas kung ang diwa ay pagkamatay na walang karunungan o bago magtamo nito.
