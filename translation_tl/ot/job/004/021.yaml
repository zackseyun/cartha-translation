translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “tolda” upang mapanatili ang konkretong talinghaga. Inilagay ang mga pananda ng talababa sa mismong teksto at pinanatili ang kahulugan ng huling parirala na hindi lubusang tiyak.
