  yaml_path: translation/ot/job/004/014.yaml
  text: Fear came upon me[a], and trembling, and it made all my bones shake.
translation:
  language: tl
  text: Dumating sa akin ang takot at panginginig; sinindak nito ang marami sa aking mga buto.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “sinindak nito ang karamihan ng aking mga buto.” Ang di-karaniwang pariralang Hebreo ay isang matingkad na paglalarawan ng matinding reaksiyon ng katawan. Maaari ring isalin, “pinanginig nito ang marami sa aking mga buto.”
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּחַד
  choice: takot
  rationale: Malawak at likas na katumbas ito ng pangngalang tumutukoy sa takot o pangamba, nang hindi agad pinatitindi bilang sukdulang sindak.
- source_word: קְרָאַנִי
  choice: dumating sa akin
  rationale: Ginamit dito ang diwa ng pagdating, pagsalubong, o pagsapit ng isang karanasan; ipinahihiwatig ng parirala ang biglang pagsapit ng takot.
- source_word: וּרְעָדָה
  choice: at panginginig
  rationale: Tinutukoy nito ang pisikal na reaksiyong kaakibat ng takot at pinananatili ang patulang pagtutumbas ng dalawang pangngalan.
- source_word: וְרֹב עַצְמוֹתַי
  choice: ang aking mga buto
  rationale: Pinananatili ang matingkad na larawan ng mga buto, ngunit ginawang likas sa Tagalog ang di-karaniwang pariralang Hebreo na literal na 'ang karamihan/kasaganaan ng aking mga buto.' Ang literal na anyo at alternatibong pagbasa ay inilagay sa talababa.
- source_word: הִפְחִיד
  choice: pinanginig nito
  rationale: Ang pandiwa ay nasa anyong sanhi at literal na tumutukoy sa pagpapasindak. Sa konteksto ng mga buto, ipinahahayag ng 'pinanginig' ang ibinungang pisikal na reaksiyon habang pinananatili ang sanhiang diwa.
theological_decisions: []
translation_notes:
  register: Makabagong, marangal, at madaling maunawaang Tagalog. Pinanatili ang konkretong larawang “mga buto,” samantalang ipinaliwanag sa talababa ang kakaibang pariralang Hebreo upang hindi gawing mabigat o di-likas ang pangunahing teksto.
