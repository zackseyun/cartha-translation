  text: how much more those who dwell in houses of clay[a], whose foundation is in the dust[b], who are crushed before the moth!
translation:
  language: tl
  text: Gaano pa kaya ang mga naninirahan sa mga bahay na yari sa luwad[a], na ang pundasyon ay nasa alabok! Nadudurog sila sa harap ng gamu-gamo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin na “maging ang mga naninirahan sa mga bahay na yari sa luwad.” Ang salitang Hebreo ay maaaring mangahulugang “maging” o “tunay na,” ngunit dito ay malamang na nagpapalakas ito sa paghahambing: “gaano pa kaya.”'
    reason: lexical_alternative
  - marker: b
    text: Maaari ring ang diwa ay “nadudurog sila nang mas mabilis kaysa sa gamu-gamo” o “mas madali pa silang durugin kaysa sa gamu-gamo.” Ang pariralang Hebreo ay literal na “sa harap ng gamu-gamo” at maaaring tumukoy sa bilis o kadalian ng pagkawasak.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַף
  choice: Gaano pa kaya
  rationale: Sa konteksto ng paghahambing sa naunang talata, ipinahihiwatig ng partikula na lalo nang hindi mapagkakatiwalaan o matatag ang marurupok na tao. Pinananatili rin ng “kaya” ang retorikal at patulang himig.
- source_word: שֹׁכְנֵי
  choice: mga naninirahan
  rationale: Ipinahahayag ng participle ang patuloy na paninirahan, at likas sa makabagong Tagalog ang “mga naninirahan.”
- source_word: בָתֵּי חֹמֶר
  choice: mga bahay na yari sa luwad
  rationale: Malinaw nitong pinananatili ang larawan ng katawang-lupa bilang marupok na tirahan nang hindi tuwirang ipinapaliwanag ang metapora sa pangunahing teksto.
- source_word: בֶּעָפָר יְסוֹדָם
  choice: na ang pundasyon ay nasa alabok
  rationale: Pinananatili ang konkretong larawan ng pundasyong nasa alabok at ang pahiwatig nito tungkol sa pagiging mortal ng tao.
- source_word: יְדַכְּאוּם
  choice: Nadudurog sila
  rationale: Ang pandiwa ay nangangahulugang durugin. Ginamit ang anyong hindi tahasang nagsasaad ng gumagawa sapagkat walang tiyak na tagaganap na binanggit sa Hebreo.
- source_word: לִפְנֵי עָשׁ
  choice: sa harap ng gamugamo
  rationale: Malapit ito sa literal na anyo ng Hebreo at pinananatili ang patulang kalabuan kung ang diwa ay bilis, kadalian, o paghahambing sa pagkawasak na dulot ng gamugamo.
theological_decisions:
- issue: Tinutukoy ng “mga bahay na yari sa luwad”
  choice: Pinanatili bilang metapora ng marupok at mortal na kalagayan ng tao
  alternative: Mga literal na bahay na putik o luwad bilang larawan ng kahinaan ng tao
  rationale: Inihahambing ng konteksto ang mga makalangit na lingkod at ang mga tao. Hindi ipinalit sa metapora ang interpretasyon upang manatili ang lawak at puwersa ng orihinal na larawan.
- issue: Kahulugan ng “sa harap ng gamugamo”
  choice: Pinanatili ang literal at malabong patulang pananalita
  alternative: “mas mabilis kaysa sa gamugamo” o “mas madaling durugin kaysa sa gamugamo”
  rationale: Maaaring magpahiwatig ang parirala ng bilis o kadalian ng pagkawasak, ngunit hindi lubos na tiyak ang eksaktong ugnayan. Ang talababa ang naglalahad ng mga posibleng diwa.
translation_notes:
  register: Makabago ngunit marangal na Tagalog. Ginamit ang “luwad,” “pundasyon,” at “alabok” upang mapanatili ang magkakaugnay na larawang makalupa at ang patulang pahiwatig ng pagiging mortal. Hinati sa dalawang pangungusap upang maging malinaw sa karaniwang mambabasa nang hindi inaalis ang bigat ng paghahambing.
