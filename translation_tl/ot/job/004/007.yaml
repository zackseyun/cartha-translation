  text: 'Please remember: who that was innocent ever perished? Or where were the upright cut off?[a][b]'
translation:
  language: tl
  text: 'Alalahanin mo nga: sino bang walang-sala ang napahamak? O saan nalipol ang mga matuwid?[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “walang kapintasan” sa halip na “walang-sala.”
    reason: lexical_alternative
  - marker: b
    text: O “napuksa” o “binura” sa halip na “nalipol.”
    reason: lexical_alternative
lexical_decisions:
- source_word: זְכָר נָא
  choice: Alalahanin mo nga
  rationale: Ang pautos na זְכָר ay panawagan na alalahanin o pag-isipan ang isang bagay; ipinahahayag ng “nga” ang pakiusap o banayad na diin ng נָא sa natural na modernong Tagalog.
- source_word: מִי הוּא
  choice: sino bang taong
  rationale: Pinatitindi ng panghalip na הוּא ang tanong. Ang “sino bang taong” ay natural sa Tagalog at nagpapanatili sa retorikal na diin.
- source_word: נָקִי
  choice: walang-sala
  rationale: Tumutukoy ito sa pagiging malaya sa kasalanan o pananagutan; malinaw at karaniwang katumbas sa modernong Tagalog ang “walang-sala.”
- source_word: אָבָד
  choice: napahamak
  rationale: Ipinahahayag ng pandiwa ang pagkasawi o pagkapahamak. Ang “napahamak” ay nagpapanatili sa bigat ng salita nang hindi tinutukoy kung sino ang sanhi.
- source_word: וְאֵיפֹה
  choice: At saan
  rationale: Ipinakikilala ng pang-ugnay at pananong ang ikalawang kahilerang retorikal na tanong. Pinananatili ng “At saan” ang anyo ng Hebreo.
- source_word: יְשָׁרִים
  choice: ang mga matuwid
  rationale: Pangmaramihang pang-uri itong ginamit bilang pangngalan para sa mga taong namumuhay nang matuwid.
- source_word: נִכְחָדוּ
  choice: nilipol
  rationale: Ang Niphal ng כחד ay maaaring mangahulugang nabura, napuksa, o lubusang inalis. Ang “nilipol” ay natural na pasibong-resultatibong pahayag sa Tagalog at kaagapay ng “napahamak.”
theological_decisions:
- issue: Ang retorikal na pahayag ni Elifaz tungkol sa sinasapit ng walang-sala at ng mga matuwid
  choice: Isinalin nang tuwiran bilang retorikal na pag-aangkin ni Elifaz, nang hindi ito pinahihina o tahasang sinasang-ayunan ng tagapagsalin.
  alternative: Lagyan ang mismong salin ng pahiwatig na pinagtatalunan o itinatama ang pahayag sa mas malawak na argumento ng aklat.
  rationale: Ang talata ay nagpapahayag ng pananaw ni Elifaz. Dapat manatili ang teolohikal na tensiyon sa loob ng salaysay at hindi lutasin sa pamamagitan ng mapagpaliwanag na pagsasalin.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “mo nga” at “sino bang taong” upang maipahayag ang banayad na pakiusap at retorikal na diin nang hindi nagiging makaluma. Nananatiling tuwiran ang pag-aangkin ni Elifaz.
