  text: If one tries a word with you[a], will you be weary? But who can hold back words?
translation:
  language: tl
  text: Kung may mangahas na magsalita sa iyo[a], mapapagod ka ba? Ngunit sino ang makapagpipigil sa mga salita?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Kung may magtangkang magsabi ng isang bagay sa iyo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲנִסָּה
  choice: Kung may mangahas
  rationale: Ang Piel ng נסה rito ay tumutukoy sa pagtatangka o lakas-loob na magsimula, hindi sa pagsubok kay Job. Ipinahahayag ng “mangahas” ang maingat na paglapit ni Elifaz.
- source_word: דָבָר אֵלֶיךָ
  choice: magsalita sa iyo
  rationale: Bagaman maaaring literal na “isang salita sa iyo,” ang pandiwang pariralang ito ay likas sa modernong Tagalog at pinananatili ang diwa ng pagharap kay Job sa pamamagitan ng pananalita.
- source_word: תִּלְאֶה
  choice: manghihina ka ba
  rationale: Mula sa לאה, “mapagod” o “manghina.” Pinananatili ng “manghihina” ang pangunahing larawan ng panghihina nang hindi ito nililimitahan sa pagkainip o pagkayamot.
- source_word: וַעְצֹר
  choice: makapipigil
  rationale: Ang עצר ay “pumigil” o “magpigil.” Sa konteksto, retorikal na sinasabi ni Elifaz na mahirap pigilan ang pagsasalita.
- source_word: בְּמִלִּין
  choice: sa mga salita
  rationale: Pinananatili ang maramihang anyo at ang tuwirang pagtukoy sa mga salitang bibigkasin.
- source_word: מִי יוּכָל
  choice: sino ang makapipigil
  rationale: Likas at maikli itong katumbas ng retorikal na tanong tungkol sa kakayahan.
theological_decisions: []
translation_notes:
  register: Makabagong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “mangahas magsalita” upang ihatid ang maingat na pagtatangka ni Elifaz, at “manghihina” upang mapanatili ang literal na puwersa ng לאה at ang posibleng emosyonal na diwa nito.
