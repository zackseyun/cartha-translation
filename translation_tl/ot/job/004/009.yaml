  yaml_path: translation/ot/job/004/009.yaml
  text: By the breath of God they perish[c][b][a], and by the blast of his anger they come to an end.
translation:
  language: tl
  text: 'Sa hininga ng Diyos[a], sila ay nalilipol[b];

    at sa ihip[c] ng kanyang galit, nauubos sila.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Mula sa hininga ng Diyos.” Maaaring ipahiwatig ng pang-ukol sa Hebreo ang pinagmulan o ang kasangkapan/sanhi.
    reason: lexical_alternative
  - marker: b
    text: O “sila ay napapahamak.”
    reason: lexical_alternative
  - marker: c
    text: Ang salitang Hebreo ay maaari ring mangahulugang “hangin,” “hininga,” o “espiritu.” Dito ay inilalarawan nito ang mapaminsalang pagbugang kaugnay ng galit ng Diyos.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנִּשְׁמַת
  choice: Sa hininga ng
  rationale: Ang נְשָׁמָה ay tumutukoy sa hininga o paghinga. Maaaring magpahiwatig ang prefiks na מִן ng pinagmulan o kasangkapan/sanhi; likas sa Filipino ang “sa hininga ng” at hindi nito lubusang isinasara ang dalawang posibilidad.
- source_word: אֱלוֹהַ
  choice: Diyos
  rationale: Ito ang payak na katumbas ng patulang anyong singular na אֱלוֹהַ, na madalas gamitin sa Job. Hindi dinaragdagan ng titulong wala sa Hebreo.
- source_word: יֹאבֵדוּ
  choice: sila ay napapahamak
  rationale: Ang Qal ng אבד ay nangangahulugang mapahamak o malipol. Pinananatili ng “napapahamak” ang di-tuwirang verbal na diwa at hindi nito labis na tinutukoy kung paano nagaganap ang pagkawasak.
- source_word: וּמֵרוּחַ
  choice: at sa ihip
  rationale: 'Malawak ang saklaw ng רוּחַ: hangin, hininga, o espiritu. Sa paralelismo nito sa “hininga” at kaugnayan sa galit, ang “ihip” ay naghahatid ng larawan ng malakas na pagbuga nang hindi nagbibigay ng maling impresyong tumutukoy ito sa isang espiritung persona.'
- source_word: אַפּוֹ
  choice: ng kanyang galit
  rationale: Bagaman literal na maaaring tumukoy ang אַף sa ilong o butas ng ilong, karaniwan itong idyoma para sa galit. Malinaw sa modernong Filipino ang “kanyang galit,” habang nananatili sa “ihip” ang konkretong larawan ng pagbuga.
- source_word: יִכְלוּ
  choice: nauubos sila
  rationale: Ang Qal ng כלה ay maaaring mangahulugang maubos, matapos, o sumapit sa wakas. Ang “nauubos” ay natural, maikli, at angkop sa patulang paralelismo sa “napapahamak.”
theological_decisions:
- issue: Antropomorpikong paglalarawan sa galit ng Diyos
  choice: Isinalin ang אַפּוֹ bilang “kanyang galit” at pinanatili ang larawan ng pagbuga sa “ihip.”
  alternative: “mula sa kanyang mga butas ng ilong” o “ng kanyang poot”
  rationale: Ang pangunahing diwa ng idyoma ay galit, ngunit may konkretong larawan ng pagbuga mula sa ilong. Nililinaw ng salin ang idyomatikong kahulugan nang hindi lubusang inaalis ang patulang larawan o nagdaragdag ng doktrinal na paliwanag.
translation_notes:
  register: Makabago at marangal na Filipino na madaling maunawaan. Pinanatili ang maikling paralelismong patula at ang magkatuwang na larawan ng “hininga” at “ihip,” habang iniwasan ang arkaiko o sobrang teknikal na pananalita.
