  text: Your words have raised up the one who stumbles[b][a], and you have strengthened knees that were giving way.
translation:
  language: tl
  text: Ang iyong mga salita ay nagpatayo sa taong natitisod[a], at pinalakas mo ang mga tuhod na bumibigay[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “umalalay” o “pagpatayuin.”
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “mga tuhod na yumuyuko”; ang diwa ay mga tuhod na lumulundo o bumibigay dahil sa panghihina.
    reason: lexical_alternative
lexical_decisions:
- source_word: כּוֹשֵׁל
  choice: natitisod
  rationale: Ang participle ng כשל ay tumutukoy sa taong natitisod, nadarapa, o nanghihina. Pinananatili ng “natitisod” ang kongkretong larawan at natural ito sa modernong Tagalog.
- source_word: יְקִימוּן
  choice: nagbangon
  rationale: 'Ang Hiphil ng קום ay causative: magpatayo, magbangon, o umalalay upang manatiling nakatayo. Ang “nagbangon” ay angkop sa patulang larawan at sa completed action na inilalarawan ni Elifaz.'
- source_word: מִלֶּיךָ
  choice: mga salita mo
  rationale: Ang plural na מִלָּה ay “mga salita” o “pananalita.” Direktang salin ang “mga salita mo” at karaniwan sa Tagalog.
- source_word: בִרְכַּיִם
  choice: mga tuhod
  rationale: Literal na bahagi ng katawan ang tinutukoy at malinaw sa Tagalog ang larawan ng mga tuhod na nanghihina.
- source_word: כֹּרְעוֹת
  choice: na nanghihina
  rationale: Ang כרע ay maaaring mangahulugang yumuko, lumuhod, o lumaylay. Kapag inilapat sa mga tuhod, inilalarawan nito ang mga tuhod na bumibigay dahil sa panghihina; natural na ipinahahayag ito ng “nanghihina.”
- source_word: תְּאַמֵּץ
  choice: pinalakas mo
  rationale: Ang Piel ng אמץ ay “palakasin” o “patatagin.” Pinananatili ng “pinalakas mo” ang pisikal na metapora at ang parallelismo sa “nagbangon.”
