  yaml_path: translation/ot/job/004/005.yaml
  text: But now it comes to you[a], and you are weary; it touches you[b], and you are dismayed.
translation:
  language: tl
  text: Ngunit ngayo’y dumarating ito sa iyo[a] at nanghihina ka; dumadampi ito sa iyo[b] at nababagabag ka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Sapagkat ngayo’y dumarating ito sa iyo.” Maaaring isalin sa iba’t ibang paraan ang Hebreong pang-ugnay na כִּי; ginamit dito ang “Ngunit” upang ipakita ang pagsalungat sa konteksto.
    reason: lexical_alternative
  - marker: b
    text: Pambabaeng isahan sa Hebreo ang mga pandiwang “dumarating” at “dumadampi.” Malamang na tumutukoy ang di-binanggit na paksa sa kapahamakan o paghihirap. Ang pandiwang isinaling “dumadampi” ay maaari ring mangahulugang “humihipo,” “umaabot,” o “tumatama.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ngunit
  rationale: Ipinahahayag dito ang pagsalungat sa dating pagpapalakas ni Job sa iba at sa kasalukuyan niyang reaksiyon nang siya naman ang dumanas ng hirap. Posible rin ang panandang sanhi, kaya inilakip ang alternatibo sa talababa.
- source_word: עַתָּה
  choice: ngayon
  rationale: Panandang temporal na naghahambing sa kasalukuyang kalagayan ni Job at sa dati niyang ginagawa.
- source_word: תָּבוֹא
  choice: dumarating ito
  rationale: Ang pandiwa ay ikatlong panauhang pambabae sa isahan at may di-binanggit na paksa, malamang na tumutukoy sa kapahamakan o paghihirap. Pinananatili ng “ito” ang di-tiyak na reperensiya nang hindi ipinapasok sa pangunahing teksto ang isang tahasang pangngalan.
- source_word: אֵלֶיךָ
  choice: sa iyo
  rationale: Likas na Filipino para sa direksiyon ng pagdating ng paghihirap kay Job.
- source_word: וַתֵּלֶא
  choice: nanghihina ka
  rationale: Ang ugat na לאה ay tumutukoy sa pagkapagod o pagkawala ng lakas. Ipinahahayag ng “nanghihina” ang epekto ng dinaranas nang hindi ito binibigyang-kahulugang moral na pagkainip.
- source_word: תִּגַּע עָדֶיךָ
  choice: pagsapit nito sa iyo
  rationale: Ang נגע ay maaaring mangahulugang humipo, umabot, o sumapit. Mas natural sa Filipino ang “pagsapit nito sa iyo” para sa paghihirap, habang pinananatili ang pag-usad mula sa pagdating tungo sa personal na pagdanas.
- source_word: וַתִּבָּהֵל
  choice: nababagabag ka
  rationale: Ang בהל ay nagpapahiwatig ng pagkagulat, pagkabalisa, o matinding pagkabagabag. Ang “nababagabag” ay may sapat na bigat ngunit hindi labis na itinatakda bilang sukdulang takot.
