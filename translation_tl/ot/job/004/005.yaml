translation_notes:
  register: Modernong Filipino na dignificado at madaling maunawaan. Ginamit ang “nanghihina” at “nababagabag” upang ihatid ang pisikal-emosyonal na bigat nang hindi labis na nagpapakahulugan. Ang “ito” ay sadyang nagpapanatili sa di-binanggit na paksa ng Hebreo.
