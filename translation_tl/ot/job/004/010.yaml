  register: Makabago ngunit marangal na Filipino. Pinanatili ang patulang paralelismo at ang magkakaibang katawagan sa leon. Inilagay ang panandang talababa pagkatapos ng “nabali,” sapagkat ang alternatibong leksikal ay nauukol sa pandiwang Hebreo.
