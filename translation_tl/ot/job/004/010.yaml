base_translation:
  language: en
  yaml_path: translation/ot/job/004/010.yaml
  text: The lion’s roar[a], and the voice of the fierce lion, and the teeth of the young lions are broken.
translation:
  language: tl
  text: 'Ang ungal ng leon, ang tinig ng mabangis na leon,

    at ang mga ngipin ng mga batang leon ay nabali.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nabunot” o “natanggal nang marahas.” Ipinahihiwatig ng pandiwang Hebreo ang marahas na pagkatanggal o pagkabali.
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׁאֲגַת
  choice: ungal
  rationale: Pangngalang tumutukoy sa malakas at nakatatakot na sigaw ng leon; natural at malinaw ang “ungal” sa makabagong Filipino.
- source_word: אַרְיֵה
  choice: leon
  rationale: Karaniwang katawagan sa leon at walang dahilan sa konteksto upang gumamit ng mas tiyak na salita.
- source_word: קוֹל
  choice: tinig
  rationale: Pinananatili ang pagkakaiba nito sa “ungal” at ang paralelismong patula ng Hebreo.
- source_word: שָׁחַל
  choice: mabangis na leon
  rationale: Patulang katawagan ito sa leon na may pahiwatig ng lakas o kabangisan; ipinakikita ng salin ang pagpapatindi nang hindi ginagamit ang hindi tiyak na “itim na leon.”
- source_word: שִׁנֵּי
  choice: mga ngipin ng
  rationale: Tuwirang salin ng pangmaramihang anyong construct.
- source_word: כְפִירִים
  choice: mga batang leon
  rationale: Tumutukoy sa mga leon na bata ngunit malalakas na, hindi sa mga munting anak na walang kakayahang manila.
- source_word: נִתָּעוּ
  choice: nabali
  rationale: Inihahayag ng pandiwa ang marahas na pagkasira o pagkatanggal ng mga ngipin. Natural sa Filipino ang “nabali,” habang inilalagay sa talababa ang posibilidad na ang larawan ay pagkapigtal o pagkabunot.
