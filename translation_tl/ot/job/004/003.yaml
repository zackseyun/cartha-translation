  text: הִ֭נֵּה יִסַּ֣רְתָּ רַבִּ֑ים וְ/יָדַ֖יִם רָפ֣וֹת תְּחַזֵּֽק׃
base_translation:
  language: en
  yaml_path: translation/ot/job/004/003.yaml
  text: Behold[a], you have instructed many, and you have strengthened weak hands.
translation:
  language: tl
  text: 'Narito,[a] marami ang iyong tinuruan,

    at pinalakas mo ang mga kamay na nanghihina.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “dinisiplina” o “itinuwid”; maaaring saklawin ng pandiwang Hebreo ang pagtuturo sa pamamagitan ng pagtutuwid.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Narito
  rationale: Isang panandang pansalita na tumatawag ng pansin sa kasunod; pinananatili ng “Narito” ang mariin at marangal na himig ng tulang pananalita.
- source_word: יִסַּרְתָּ
  choice: iyong tinuruan
  rationale: Ang יסר ay maaaring tumukoy sa pagtuturo sa pamamagitan ng pagsaway, pagtutuwid, o pagdidisiplina. Sa konteksto, kinikilala ni Elifaz ang dating paggabay ni Job sa iba, kaya natural ang “tinuruan” habang inilalahad sa talababa ang mas matinding mga kahulugan.
- source_word: רַבִּים
  choice: marami
  rationale: Tuwirang katumbas na likas at malinaw sa modernong Filipino.
- source_word: יָדַיִם רָפוֹת
  choice: mga kamay na nanghihina
  rationale: Pinananatili ang kongkretong metapora ng mga kamay habang likas na ipinahihiwatig ang kawalan ng lakas o panghihina ng loob.
- source_word: תְּחַזֵּק
  choice: pinalakas mo
  rationale: Ang Piel ng חזק ay nangangahulugang palakasin o gawing malakas. Binabasa ito bilang nagdaang kilos na kaagapay ng naunang pandiwa.
theological_decisions: []
