  yaml_path: translation/ot/job/004/016.yaml
  text: 'It stood still[a], but I could not recognize its appearance; a form was before my eyes; there was silence[b], and I heard a voice:'
translation:
  language: tl
  text: 'Tumigil ito, ngunit hindi ko makilala ang anyo nito[a]. Isang anyo ang nasa harap ng aking mga mata. Nagkaroon ng katahimikan[b], at nakarinig ako ng isang tinig:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “anyo niya.” Panlalaking isahan ang hulapi sa Hebreo, ngunit hindi pa nakikilala kung ano o sino ang nagpakita.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “pagkatahimik” o “katahimikang walang galaw.” Ang salitang Hebreo ay maaaring tumukoy sa katahimikan o sa paghupa ng galaw at ingay.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעֲמֹד
  choice: Nanatili itong nakatayo
  rationale: Ipinahahayag nito ang diwa ng עמד na tumayo o manatiling nakatayo, at akma sa mahiwagang anyong huminto at nanatili sa harap ng nagsasalita.
- source_word: וְלֹא אַכִּיר
  choice: ngunit hindi ko makilala
  rationale: Ang Hiphil ng נכר ay nangangahulugang makilala o matukoy. Ang “ngunit” ay nagpapakita ng kaibahan sa pagitan ng presensiya ng anyo at ng kawalan ng kakayahang kilalanin ito.
- source_word: מַרְאֵהוּ
  choice: ang anyo nito
  rationale: Ang מַרְאֶה ay tumutukoy sa nakikitang anyo o hitsura. Pinananatili ng “nito” na hindi tiyak kung isang persona o ibang uri ng pagpapakita ang tinutukoy.
- source_word: תְּמוּנָה
  choice: isang hugis
  rationale: Maaaring mangahulugan ang תְּמוּנָה ng anyo, wangis, o hugis. Ang “hugis” ay malinaw at iniiwasan ang di-kailangang pag-uulit ng “anyo.”
- source_word: לְנֶגֶד עֵינָי
  choice: nasa harap ng aking mga mata
  rationale: Malapit ito sa literal na larawan ng Hebreo at pinananatili ang matingkad na paglalarawan ng pangitain.
- source_word: דְּמָמָה
  choice: Nagkaroon ng katahimikan
  rationale: Saklaw ng דְּמָמָה ang katahimikan, kawalan ng galaw, o mahinang paghupa ng ingay. Ang buong sugnay ay natural sa Filipino at ipinakikita ang tahimik na sandali bago marinig ang tinig.
- source_word: וָקוֹל אֶשְׁמָע
  choice: at nakarinig ako ng isang tinig
  rationale: Maaaring “tinig” o “tunog” ang קוֹל, ngunit “tinig” ang higit na angkop dahil sinusundan ito ng mga salitang binibigkas sa kasunod na talata.
