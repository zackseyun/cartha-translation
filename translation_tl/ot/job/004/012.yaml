  text: A word was secretly brought to me[a], and my ear caught a whisper of it.
translation:
  language: tl
  text: Isang salita ang palihim na ipinarating sa akin, at nasagap ng tainga ko ang mahinang bulong nito.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “bahagyang pahiwatig nito” o “mahinang tunog mula rito.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלַי
  choice: sa akin
  rationale: Pinananatili ang tahasang patunguhan ng salita; hindi dinaragdagan ng temporal na panandang wala sa Hebreo.
- source_word: דָּבָר
  choice: isang salita
  rationale: Ang “salita” ay nagpapanatili sa maikli at mahiwagang dating ng Hebreo nang hindi agad binibigyang-kahulugang isang buong mensahe.
- source_word: יְגֻנָּב
  choice: palihim na nakarating
  rationale: 'Metaporikal ang pasibong anyo ng pandiwang “magnakaw”: ang salita ay dumating nang patago o palihim, hindi literal na ninakaw.'
- source_word: וַתִּקַּח
  choice: nasagap
  rationale: Natural na Filipino para sa pandinig na nakakuha o nakarinig ng bahagyang tunog, habang pinananatili ang kongkretong larawan.
- source_word: אָזְנִי
  choice: ng tainga ko
  rationale: Pinananatili ang isahang “tainga ko” sa Hebreo at ang malinaw na larawang pangkatawan.
- source_word: שֵׁמֶץ
  choice: ang mahinang bulong
  rationale: Sa kontekstong pandinig, ipinahihiwatig nito ang bahagya o halos di-marinig na tunog; ang “mahinang bulong” ay natural at hindi sobra ang pagpapakahulugan.
- source_word: מֶנְהוּ
  choice: nito
  rationale: Tumutukoy pabalik sa “salita” at natural na nagpapahayag na ang nasagap ay bahagyang tunog mula rito.
