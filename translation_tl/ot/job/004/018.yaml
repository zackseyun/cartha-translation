  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: הֵ֣ן בַּ֭/עֲבָדָי/ו לֹ֣א יַאֲמִ֑ין וּ֝/בְ/מַלְאָכָ֗י/ו יָשִׂ֥ים תָּהֳלָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/job/004/018.yaml
  text: Look[a], he puts no trust in his servants[b], and he charges his messengers with error.
translation:
  language: tl
  text: Tunay, hindi siya nagtitiwala sa kanyang mga lingkod, at iniuukol niya ang kamalian[b] sa kanyang mga sugo[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga anghel.” Maaaring tumukoy ang salitang Hebreo sa mga sugo na tao o makalangit; sa kontekstong ito, malamang na mga makalangit na nilalang ang tinutukoy.
    reason: alternative_reading
  - marker: b
    text: Maaari ring “kahangalan,” “kapintasan,” o “di-kasakdalan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Tunay
  rationale: Nagpapakilala ito ng mariing pahayag. Likas at marangal sa makabagong Filipino ang “Tunay,” nang hindi gumagamit ng mas makalumang “Narito.”
- source_word: בַּעֲבָדָיו
  choice: sa kanyang mga lingkod
  rationale: Ang ב kasunod ng Hiphil ng אמן ang tumutukoy sa pinagtitiwalaan. Ang “mga lingkod” ay angkop sa kanilang tungkuling nakapailalim sa Diyos at hindi nagpapahiwatig ng partikular na katayuang panlipunan gaya ng “mga alipin.”
- source_word: לֹא יַאֲמִין
  choice: hindi siya nagtitiwala
  rationale: Dito ang Hiphil ng אמן ay tumutukoy sa pagtitiwala o pagkakaroon ng lubos na kumpiyansa, hindi lamang sa paniniwalang intelektuwal.
- source_word: וּבְמַלְאָכָיו
  choice: sa kanyang mga sugo
  rationale: Maaaring tumukoy ang מַלְאָךְ sa taong mensahero o sa makalangit na anghel. Pinananatili ng “mga sugo” ang lawak ng salitang Hebreo, samantalang inilalahad sa talababa ang malamang na makalangit na tinutukoy sa konteksto.
- source_word: יָשִׂים
  choice: iniuukol niya
  rationale: Sa pariralang ito, ang שׂים kasama ng pangngalang abstrakto ay nangangahulugang mag-ukol o magturing na taglay ng isang tao o nilalang ang isang katangian. Iniiwasan nito ang sobrang literal at di-likas na “naglalagay.”
- source_word: תָּהֳלָה
  choice: kamalian
  rationale: Bihira ang pangngalan at maaaring magpahiwatig ng kamalian, kahangalan, kapintasan, o di-kasakdalan. Ang “kamalian” ay maikli at natural habang pinananatili sa talababa ang ibang posibleng diwa.
theological_decisions:
- issue: Kung ang מַלְאָכָיו ay isasaling partikular na “mga anghel” o mas malawak na “mga sugo”
  choice: mga sugo
  alternative: mga anghel
  rationale: Ang pangunahing leksikal na diwa ay “mga sugo,” bagaman malamang na mga makalangit na nilalang ang tinutukoy rito dahil sa konteksto. Pinananatili sa pangunahing teksto ang leksikal na lawak at inilalagay sa talababa ang mas tiyak na pagbasa.
- issue: Kung ang תָּהֳלָה ay dapat unawain bilang kamalian, kahangalan, kapintasan, o di-kasakdalan
  choice: kamalian
  alternative: kahangalan, kapintasan, o di-kasakdalan
  rationale: Dahil bihira at hindi ganap na tiyak ang salita, ginagamit ang natural na “kamalian” sa teksto ngunit hindi isinasara ang iba pang posibleng diwa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Tunay” bilang mariing panimula, “mga lingkod” para sa ugnayang nakapailalim sa Diyos, at “iniuukol” upang maipahayag ang idyomatikong paglalapat ng kamalian nang hindi nagiging sobrang literal. Itinama ang pagkakalagay ng mga pananda ng talababa upang [a] tumukoy sa “mga sugo” at [b] sa “kamalian.”
