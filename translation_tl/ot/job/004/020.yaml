  yaml_path: translation/ot/job/004/020.yaml
  text: From morning to evening they are crushed; without anyone taking notice[a], they perish forever.
translation:
  language: tl
  text: Mula umaga hanggang gabi, sila’y dinudurog; walang sinumang nagbibigay-pansin[a], sila’y tuluyang nawawala.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “walang sinumang nag-uukol ng pansin” / “walang sinumang nagsasapuso nito.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִבֹּקֶר לָעֶרֶב
  choice: Mula umaga hanggang gabi
  rationale: Pinananatili nito ang saklaw ng isang araw sa Hebreo at likas itong pahayag sa makabagong Tagalog; itinatampok nito ang kaiklian at karupukan ng buhay ng tao.
- source_word: יֻכַּתּוּ
  choice: ay dinudurog sila
  rationale: Ipinapanatili ng pandiwang balintiyak ang diwang sila ay pinipisa o winawasak, nang hindi tinutukoy kung paano o kung sino ang gumagawa nito.
- source_word: מִבְּלִי מֵשִׂים
  choice: walang sinumang nagbibigay-pansin
  rationale: Likas nitong ipinapahayag ang eliptikong idyoma sa Hebreo na walang naglalagak ng isip o puso sa nangyayari; hindi nito ginagawang simpleng di-sinasadyang hindi pagkakita ang diwa.
- source_word: לָנֶצַח
  choice: tuluyan
  rationale: Sa kontekstong ito, malinaw nitong ipinahahayag ang di-na-mababaligtad na wakas ng kanilang pagkapahamak habang iniiwasang palawakin ang talata tungo sa isang tiyak na doktrina tungkol sa walang-hanggang kaparusahan.
- source_word: יֹאבֵדוּ
  choice: napapahamak
  rationale: Sinasaklaw nito ang diwa ng pagkawala, pagkasira, o pagdating sa kapahamakan, nang hindi nagpapasok ng mas makitid na teolohikal na kahulugan.
theological_decisions:
- issue: Ang pagiging pangwakas ng kamatayan ng tao sa sinabi ni Elifaz
  choice: Isinalin ang לָנֶצַח יֹאבֵדוּ bilang “tuluyan silang napapahamak,” na nagpapanatili sa diwa ng di-na-mababaligtad na kapahamakan.
  alternative: “napapahamak sila magpakailanman,” na maaaring unawain bilang tahasang pahayag tungkol sa eskatolohikal na kaparusahan.
  rationale: Inilalarawan ni Elifaz sa konteksto ang karupukan at panandaliang buhay ng mga mortal sa harap ng Diyos. Pinananatili ng salin ang bigat at pagiging pangwakas ng pananalita nang hindi tahimik na ginagawa itong isang ganap na doktrina tungkol sa walang-hanggang paghatol.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “dinudurog” upang mapanatili ang matinding larawang balintiyak ng Hebreo, at “nagbibigay-pansin” upang maipahayag nang natural ang idyomang מִבְּלִי מֵשִׂים. Nasa pangunahing teksto ang panandang talababa [a].
