  text: בִּ֭/שְׂעִפִּים מֵ/חֶזְיֹנ֣וֹת לָ֑יְלָה בִּ/נְפֹ֥ל תַּ֝רְדֵּמָ֗ה עַל אֲנָשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/004/013.yaml
  text: Amid disquieting thoughts from visions of the night[a], when deep sleep falls on men[b],
translation:
  language: tl
  text: Sa gitna ng nakababalisang mga kaisipang mula sa mga pangitain sa gabi[a], nang dalawin ng mahimbing na tulog ang mga tao[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Sa gitna ng balisang mga kaisipang dulot ng mga pangitain sa gabi.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “mga lalaki”; ginagamit dito sa pangkalahatang diwa para sa mga tao.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשְׂעִפִּים
  choice: Sa gitna ng nakababalisang mga kaisipan
  rationale: Ang pangngalan ay tumutukoy sa hati-hati, balisa, o nakagugulong mga kaisipan. Ipinahahayag ng “nakababalisang mga kaisipan” ang ligalig na angkop sa konteksto ng pangitain sa gabi.
- source_word: מֵחֶזְיֹנוֹת לָיְלָה
  choice: mula sa mga pangitain sa gabi
  rationale: Pinananatili ng “mula sa” ang diwa ng pinagmulan o sanhi na maaaring taglayin ng מִן, samantalang tuwirang isinasalin ng “mga pangitain sa gabi” ang pariralang Hebreo.
- source_word: בִּנְפֹל
  choice: nang dalawin
  rationale: Ang infinitive construct na may בְּ ay temporal. Sa Filipino, likas na ipinahahayag ng “nang dalawin ... ng tulog” ang pagdating o pagsapit ng tulog, bagaman hindi literal na inuulit ang larawang “mahulog.”
- source_word: תַּרְדֵּמָה
  choice: mahimbing na tulog
  rationale: Tumutukoy ito sa mabigat o napakalalim na pagtulog, hindi lamang sa karaniwang tulog.
- source_word: עַל אֲנָשִׁים
  choice: ang mga tao
  rationale: Bagaman anyong panlalaking maramihan ang salitang Hebreo, pangkalahatan ang gamit nito rito. Ang “mga tao” ang likas at tumpak na katumbas sa Filipino.
theological_decisions:
- issue: Kasariang ipinahihiwatig ng אֲנָשִׁים
  choice: mga tao
  alternative: mga lalaki
  rationale: Pangkalahatan ang tinutukoy ng panlalaking anyong maramihan sa kontekstong ito. Hindi kailangang gawing tiyak sa mga lalaki ang salin sa Filipino, ngunit itinatala sa talababa ang mas literal na anyo.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “nang dalawin ng mahimbing na tulog” bilang natural na idyomatikong paglalarawan sa pagsapit ng malalim na tulog, habang pinananatili ang anyong sugnay na nagpapatuloy sa kasunod na talata.
