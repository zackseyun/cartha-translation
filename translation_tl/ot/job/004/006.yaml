  source_fidelity: 'Tapat ang salin sa retorikal na tanong ng הֲלֹא at sa dalawang magkatimbang na nominal na sugnay: ang pagkatakot sa Diyos bilang tiwala at ang katapatan/integridad ng mga lakad bilang pag-asa. Ang pagdaragdag ng “sa Diyos” ay isang maingat na kontekstuwal na paglilinaw ng יִרְאָה, at malinaw na itinatala ng talababa na hindi tahasang nasa Hebreo ang layon.'
