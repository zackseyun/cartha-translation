base_translation:
  language: en
  yaml_path: translation/ot/job/004/006.yaml
  text: Is not your fear of God your confidence[c][b][a], and the integrity of your ways your hope?
translation:
  language: tl
  text: Hindi ba ang pagkatakot mo sa Diyos[a] ang iyong tiwala[b], at ang katapatan ng iyong mga lakad[c] ang iyong pag-asa?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “ang iyong pagkatakot”; hindi tahasang binabanggit kung kanino nakatuon ang takot, bagaman karaniwan itong tumutukoy sa Diyos sa panitikang karunungan.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “kapanatagan” o “pananalig.”
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “integridad” o “kawalang-kapintasan ng iyong mga lakad.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: Hindi ba
  rationale: Likas na panimulang anyo sa Filipino para sa retorikal na tanong na umaasang sasang-ayon ang kausap.
- source_word: יִרְאָתְךָ
  choice: ang pagkatakot mo sa Diyos
  rationale: Ang יִרְאָה ay takot o pagpipitagan; bagaman walang tahasang layon sa Hebreo, karaniwang Diyos ang tinutukoy nito sa panitikang karunungan. Pinananatili ng “pagkatakot” ang lakas ng salitang pinagmulan.
- source_word: כִּסְלָתֶךָ
  choice: ang iyong tiwala
  rationale: Sa kontekstong ito, ang pangngalan ay tumutukoy sa tiwala o kapanatagan, hindi sa kahangalan. Ang “tiwala” ay natural sa Filipino at angkop sa pagkakatulad nito sa “pag-asa.”
- source_word: תִּקְוָתְךָ
  choice: ang iyong pag-asa
  rationale: Karaniwan at tuwirang katumbas ng תִּקְוָה na nagpapahayag ng inaasahan at pinanghahawakan.
- source_word: וְתֹם
  choice: at ang katapatan
  rationale: Ang תֹּם ay maaaring mangahulugang kabuuan, integridad, o kawalang-kapintasan. Ang “katapatan” ay malinaw at marangal na salitang Filipino para sa moral na integridad nang hindi nagmumungkahi ng ganap na kawalang-kasalanan.
- source_word: דְּרָכֶיךָ
  choice: ng iyong mga lakad
  rationale: Pinananatili ang metapora ng Hebreong “mga daan” sa pamamagitan ng natural na idyomang Filipino na tumutukoy sa pamumuhay o asal.
theological_decisions:
- issue: Hindi tahasang layon ng “takot”
  choice: “pagkatakot mo sa Diyos” sa pangunahing teksto
  alternative: “iyong pagkatakot” o “iyong pagpipitagan”
  rationale: Hindi binabanggit ng Hebreo ang layon, ngunit sa panitikang karunungan ay karaniwang tumutukoy ito sa Diyos. Nililinaw ito sa teksto habang itinatala sa talababa ang literal na posibilidad upang hindi maitago ang tunay na kalabuan.
- issue: Ugnayang sintaktiko ng apat na pangngalan
  choice: 'Dalawang magkatimbang na sugnay: ang pagkatakot ay tiwala, at ang katapatan ng mga lakad ay pag-asa'
  alternative: 'Isang talaan: “ang iyong pagkatakot ... ang iyong tiwala, pag-asa, at katapatan ng iyong mga lakad”'
  rationale: Ang balanseng ayos ng Hebreo ay pinakamadaling unawain bilang dalawang magkatulad na nominal na sugnay. Pinananatili nito ang paralelismong patula at ang tensiyon ng sinabi ni Elifaz.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “Hindi ba” para sa retorikal na tanong at pinanatili ang pares na “tiwala/pag-asa.” Ang “mga lakad” ay sadyang nagpapanatili sa metapora ng Hebreo ngunit nauunawaan sa Filipino bilang paraan ng pamumuhay.
