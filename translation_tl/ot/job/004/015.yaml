  text: Then a spirit passed before my face[a]; the hair of my flesh bristled.
translation:
  language: tl
  text: At isang espiritu ang dumaan sa harap ng aking mukha[a]; nagsitayuan ang mga balahibo sa aking katawan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “isang hangin” o “isang hininga” ang dumaan sa harap ng aking mukha. Ang salitang Hebreo na רוּחַ ay maaaring mangahulugang “espiritu,” “hangin,” o “hininga”; sa kontekstong ito, mas malamang ang “espiritu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרוּחַ
  choice: isang espiritu
  rationale: Maaaring mangahulugang “espiritu,” “hangin,” o “hininga” ang רוּחַ. Sa mahiwaga at nakapangingilabot na karanasang inilalarawan, “espiritu” ang pinakamalamang na diwa, habang pinananatili sa talababa ang tunay na lawak ng kahulugan.
- source_word: עַל פָּנַי
  choice: sa harap ng aking mukha
  rationale: Kasama ng pandiwang יחלף, inilalarawan nito ang pagdaan sa harapan ng nagsasalita. Pinananatili ng salin ang kongkretong larawan ng Hebreo sa halip na paikliin lamang bilang “sa harap ko.”
- source_word: יַחֲלֹף
  choice: dumaan
  rationale: Karaniwang nangangahulugan ang חלף na dumaan o lumampas. Likas at malinaw ang “dumaan” sa modernong Tagalog.
- source_word: תְּסַמֵּר
  choice: nagsitindig
  rationale: Ang pandiwa ay tumutukoy sa pagiging matigas o nakatayo. Sa mga balahibo, natural na idyomang Tagalog ang “nagsitindig.”
- source_word: שַׂעֲרַת בְּשָׂרִי
  choice: ang mga balahibo sa aking katawan
  rationale: Literal itong “balahibo ng aking laman,” ngunit mas natural at malinaw sa Tagalog ang “mga balahibo sa aking katawan,” nang hindi nawawala ang pisikal na larawan.
