base_translation:
  language: en
  yaml_path: translation/ot/job/004/008.yaml
  text: As I have seen[b][a], those who plow iniquity and sow trouble reap it.
translation:
  language: tl
  text: Ayon sa aking nakita, ang mga nag-aararo ng kasamaan[a] at naghahasik ng paghihirap[b] ay iyon din ang aanihin nila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “kapahamakan”; ang salitang Hebreo ay maaaring tumukoy sa moral na kasamaan o sa kapahamakang kaugnay nito.
    reason: lexical_alternative
  - marker: b
    text: O, “pagdurusa” o “pinsala.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּאֲשֶׁר רָאִיתִי
  choice: Ayon sa nakita ko
  rationale: Natural na Filipino para sa panawagan ni Elifaz sa sarili niyang karanasan; pinananatili nito ang diwa ng paghahambing o pagmamasid nang hindi ginagawang ganap na pahayag ang kasabihan.
- source_word: חֹרְשֵׁי
  choice: ang mga nag-aararo
  rationale: Ginagamit ang pandiwaring Hebreo bilang pangngalan at pinananatili ang larawang pang-agrikultura.
- source_word: אָוֶן
  choice: kasamaan
  rationale: Sa konteksto, may malinaw na bigat na moral ang salita, bagaman maaari rin itong tumukoy sa kapahamakan o paghihirap na bunga ng kasamaan.
- source_word: וְזֹרְעֵי
  choice: at naghahasik
  rationale: Pinananatili ang paralelismo ng pag-aararo, paghahasik, at pag-aani sa natural na Filipino.
- source_word: עָמָל
  choice: paghihirap
  rationale: Saklaw nito ang hirap, pagdurusa, o pinsalang idinudulot; ang “paghihirap” ay malinaw at karaniwang nauunawaan sa Filipino.
- source_word: יִקְצְרֻהוּ
  choice: ay iyon din ang aanihin nila
  rationale: Pinananatili ang metapora ng pag-aani at ang kaisipang ang bunga ay tumutugma sa kanilang inihasik; ang “iyon” ay kolektibong tumutukoy sa kasamaan at paghihirap.
theological_decisions:
- issue: Moral na sanhi at bunga sa pananalita ni Elifaz
  choice: Isinalin nang tuwiran bilang prinsipyong sinasabi ni Elifaz batay sa kanyang nakita.
  alternative: Gawin itong ganap at pangkalahatang doktrina ng kagyat na pagganti, o hinaan bilang isa lamang karaniwang posibilidad.
  rationale: Bahagi ito ng pangangatwiran ni Elifaz kay Job. Dapat panatilihin ang lakas ng kanyang pahayag nang hindi ito ipinipilit bilang pangwakas na teolohikal na hatol ng buong aklat.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinananatili ang magkakaugnay na larawang pag-aararo, paghahasik, at pag-aani, pati ang likas na tensiyon ng pahayag ni Elifaz sa konteksto ng aklat.
