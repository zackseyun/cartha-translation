  yaml_path: translation/ot/job/004/001.yaml
  text: 'Then Eliphaz the Temanite answered and said:'
translation:
  language: tl
  text: 'Sumagot si Elifaz na Temanita at sinabi:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַן
  choice: Sumagot
  rationale: Ang pandiwang ענה sa pormulang pasalaysay na ito ay nangangahulugang sumagot o tumugon. Likas sa makabagong Tagalog ang “Sumagot” at malinaw na ipinakikilalang tugon ito sa naunang sinabi ni Job.
- source_word: אֱלִיפַז
  choice: Elifaz
  rationale: Isinalin sa karaniwang baybay-Tagalog ang pangalang Hebreo.
- source_word: הַתֵּימָנִי
  choice: na Temanita
  rationale: Ang anyong gentiliko ay tumutukoy sa isang taong mula sa Teman. Ang “Temanita” ay maikli at karaniwang anyo sa Tagalog, at ang pang-angkop na “na” ay likas na nag-uugnay nito kay Elifaz.
- source_word: וַיֹּאמַר
  choice: at sinabi
  rationale: Pinananatili nito ang karaniwang pormulang Hebreo sa pagpapakilala ng tuwirang pananalita, kahit may bahagyang pag-uulit kasama ng “Sumagot.”
- source_word: וַ
  choice: at
  rationale: Ang waw sa ikalawang pandiwa ay natural na naipapahayag bilang “at.” Hindi na kailangang tahasang tumbasan ng “Pagkatapos” ang paunang waw dahil malinaw na sa sunod-sunod na salaysay ang pandiwang “Sumagot.”
