  yaml_path: translation/ot/job/004/011.yaml
  text: The lion perishes for lack of prey[a], and the cubs of the lion are scattered.
translation:
  language: tl
  text: Namamatay ang leon dahil walang masila, at nangangalat ang mga anak ng leon[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “leonesa.” Magkaiba ang mga salitang Hebreo para sa “leon” sa dalawang bahagi ng taludtod, at ang לָבִיא ay maaaring tumukoy sa leon o leonesa.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַיִשׁ
  choice: leon
  rationale: Tumutukoy ang salita sa isang leon, na maaaring may pahiwatig ng lakas o pagiging ganap na ang gulang. Ang payak na “leon” ang pinakanatural at hindi nagdaragdag ng katangiang hindi tiyak sa konteksto.
- source_word: אֹבֵד
  choice: namamatay
  rationale: Ipinahahayag ng pandiwari ang pagkamatay o pagkapahamak. Ang “namamatay” ay malinaw at angkop sa bunga ng kawalan ng masisila, habang pinananatili ang matinding larawan ng kasabihan.
- source_word: מִבְּלִי
  choice: dahil walang
  rationale: Ipinahahayag ng parirala ang kakulangan o kawalan bilang sanhi. Natural itong sabihin sa makabagong Tagalog bilang “dahil walang.”
- source_word: טָרֶף
  choice: masila
  rationale: Ang salita ay tumutukoy sa hayop na nahuhuli at nilalapa ng maninila, hindi lamang sa pangkalahatang pagkain. Ang “masila” ay natural at pinananatili ang larawan ng pangangaso ng leon.
- source_word: בְנֵי
  choice: mga anak ng
  rationale: Literal itong “mga anak na lalaki ng,” ngunit sa pagtukoy sa mga hayop, natural at sapat ang “mga anak ng.” Hindi nito ipinipilit ang kasarian ng mga batang leon.
- source_word: לָבִיא
  choice: leon
  rationale: Maaaring tumukoy ang לָבִיא sa leon o leonesa. Ginamit sa pangunahing teksto ang mas malawak na “leon,” at inilagay sa talababa ang tunay na leksikal na alternatibo.
- source_word: יִתְפָּרָדוּ
  choice: nangangalat
  rationale: Ipinahahayag ng pandiwa ang paghihiwalay o pagkakawatak-watak. Ang “nangangalat” ay natural sa tulang Tagalog at inilalarawan ang pagkalansag ng pangkat o pamilya.
