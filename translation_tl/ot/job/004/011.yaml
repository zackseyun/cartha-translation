translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog na nagpapanatili sa maikli at matalinghagang anyo ng tulang Hebreo. Ang “mga anak ng leon” ay bahagyang mas pormal kaysa “mga batang leon” ngunit mas tapat sa ugnayang ipinahahayag ng בְנֵי.
