base_translation:
  language: en
  yaml_path: translation/ot/job/020/026.yaml
  text: All darkness is hidden up for his treasures[a]; a fire not blown will consume him[c][b]; it will feed on what remains in his tent.
translation:
  language: tl
  text: Lahat ng kadiliman ay nakalaan sa kanyang mga tagong kayamanan[a]; tutupukin siya ng apoy na hindi hinipan[b]; sasalantain nito ang anumang natira sa kanyang tolda.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “Lahat ng kadiliman ay nakalaan para sa kanya.” Mahirap ang pariralang Hebreo: maaaring tumukoy ito sa kapahamakang nakalaan para sa kanya, o sa kanyang mga tagong bagay, imbakan, o kayamanan.'
    reason: alternative_reading
  - marker: b
    text: Ang “apoy na hindi hinipan” ay maaaring mangahulugang apoy na hindi pinagniningas o pinayayabong ng hininga ng tao, kaya maaaring magpahiwatig ng apoy na hindi mula sa karaniwang pagkilos ng tao.
    reason: lexical_alternative
  - marker: c
    text: O “mapapahamak ang nakaligtas sa kanyang tolda” o “sasalantain nito ang nalabi sa kanyang tolda.” Maaaring tumukoy ang salitang Hebreo sa isang nakaligtas o sa anumang nalabi.
    reason: alternative_reading
lexical_decisions:
- source_word: כָּל חֹשֶׁךְ
  choice: Lahat ng kadiliman
  rationale: Pinananatili ang malawak na panukat at ang konkretong larawang “kadiliman,” na sa konteksto ay maaari ring magpahiwatig ng kapahamakan o hatol.
- source_word: טָמוּן
  choice: ay nakatago
  rationale: Ipinapahayag ang pasibong diwa ng isang bagay na ikinubli o inilaan para sa hinaharap, nang hindi nilulutas ang dalawang posibleng diin.
- source_word: לִצְפּוּנָיו
  choice: para sa kanyang mga kayamanan
  rationale: Sinasalamin ang mahirap na pariralang maaaring tumukoy sa kanyang mga nakatagong imbakan o kayamanan; inilalahad sa talababa ang posibleng kahulugang kapahamakang inilaan para sa kanya.
- source_word: תְּאָכְלֵהוּ אֵשׁ
  choice: tutupukin siya ng apoy
  rationale: Ang “tutupukin” ay likas na salitang Filipino para sa mapanirang pagkilos ng apoy at malinaw na pinananatiling tao ang layon ng pandiwa.
- source_word: לֹא נֻפָּח
  choice: na hindi hinipan
  rationale: Malapit ito sa larawang Hebreo ng apoy na hindi pinayayabong o pinagniningas sa pamamagitan ng pag-ihip, at hindi tahasang idinaragdag kung sino ang nagpadala nito.
- source_word: יֵרַע
  choice: sasalantain nito
  rationale: Ipinahahayag ang mapaminsalang kilos sa konteksto ng apoy, habang iniiwasang gawing teknikal o labis na tiyak ang mahirap na anyong Hebreo.
- source_word: שָׂרִיד
  choice: ang anumang natira
  rationale: Pinananatiling bukas kung ang tinutukoy ay nalabing tao, sambahayan, o ari-arian; ang alternatibong “nakaligtas” ay inilalahad sa talababa.
- source_word: בְּאָהֳלוֹ
  choice: sa kanyang tolda
  rationale: Pinananatili ang literal at masining na larawan ng tolda, na maaari ring kumatawan sa tahanan o sambahayan.
theological_decisions:
- issue: Kung ang apoy na “hindi hinipan” ay tahasang apoy mula sa Diyos
  choice: Hindi tahasang tinukoy ang pinagmulan ng apoy.
  alternative: Apoy na ipinadala ng Diyos o hindi pinagniningas ng tao.
  rationale: Ipinahihiwatig ng larawan ang apoy na hindi nangangailangan ng pag-ihip ng tao, ngunit hindi tahasang sinasabi ng talata kung sino ang nagpasiklab o nagpadala nito.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Pinanatili ang matitingkad na larawang “kadiliman,” “apoy,” at “tolda.” Ginamit ang “tutupukin” at “sasalantain” bilang natural at madaling maunawaang pananalita, habang inilagay sa mga talababa ang mahahalagang leksikal at sintaktikong kalabuan.
