  yaml_path: translation/ot/job/020/005.yaml
  text: For the rejoicing of the wicked is brief[a], and the joy of the godless lasts only a moment.
translation:
  language: tl
  text: 'Sapagkat panandalian lamang ang pagbubunyi ng masasama,

    at ang kagalakan ng taong walang galang sa Diyos ay saglit lamang.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “at ang kagalakan ng mapagkunwari ay saglit lamang.” Ang salitang Hebreo na חָנֵף ay maaaring tumukoy sa isang mapagkunwari, ngunit maaari rin itong magkaroon ng mas malawak na diwa ng taong lapastangan o walang galang sa Diyos.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikita ang paliwanag o batayan ng naunang pahayag at natural itong panimula sa Filipino.
- source_word: רִנְנַת
  choice: pagbubunyi
  rationale: Tumutukoy sa masiglang pagpapahayag o sigaw ng kagalakan; pinananatili ng “pagbubunyi” ang masiglang kulay ng salita.
- source_word: רְשָׁעִים
  choice: ang masasama
  rationale: Karaniwan at malinaw na katumbas para sa mga taong itinuturing na masama o makasalanan sa panitikang karunungan.
- source_word: מִקָּרוֹב
  choice: panandalian lamang
  rationale: 'Sa konteksto, temporal ang diwa: maikli o malapit nang matapos, hindi pisikal na malapit.'
- source_word: וְשִׂמְחַת
  choice: at ang kagalakan ng
  rationale: Tuwirang salin na nagpapanatili sa paralelismo ng dalawang taludtod.
- source_word: חָנֵף
  choice: taong walang galang sa Diyos
  rationale: Ipinahahayag ang mas malawak na diwa ng taong lapastangan o hindi kumikilala sa Diyos, sa halip na limitahan sa pagkukunwari lamang.
- source_word: עֲדֵי רָגַע
  choice: ay saglit lamang
  rationale: Ipinakikita ang hangganan ng tagal—hanggang sa isang napakaikling sandali—sa natural at maikling Filipino.
theological_decisions:
- issue: Saklaw ng חָנֵף
  choice: taong walang galang sa Diyos
  alternative: mapagkunwari
  rationale: Sa Job, maaaring mas malawak ang salita kaysa sa isang taong nagkukunwaring banal; ang piniling salin ay nagpapanatili sa diwa ng kawalang-pitagan sa Diyos, habang inilalahad sa talababa ang leksikal na alternatibo.
translation_notes:
  register: Makabago, dignificado, at madaling maunawaang Filipino. Ginamit ang “pagbubunyi” upang mapanatili ang masiglang himig ng רִנָּה, at “taong walang galang sa Diyos” upang malinaw ngunit hindi sektaryanong maipahayag ang חָנֵף.
