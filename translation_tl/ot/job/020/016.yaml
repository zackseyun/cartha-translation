  text: רֹאשׁ פְּתָנִ֥ים יִינָ֑ק תַּֽ֝הַרְגֵ֗/הוּ לְשׁ֣וֹן אֶפְעֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/020/016.yaml
  text: He sucks the venom of cobras[b][a]; the tongue of a viper kills him.
translation:
  language: tl
  text: Sinisipsip niya ang kamandag[a] ng mga kobra[b]; papatayin siya ng dila ng ulupong.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “lason.” Literal na “ulo” ang salitang Hebreo, ngunit ginagamit ito rito sa diwang kamandag o lason.
    reason: lexical_alternative
  - marker: b
    text: Ayon sa tradisyon, “mga asp,” isang uri ng makamandag na ahas.
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹאשׁ
  choice: kamandag
  rationale: Bagaman karaniwang nangangahulugang “ulo,” ginagamit dito ang salita sa diwang “lason” o “kamandag,” gaya ng ipinahihiwatig ng mga makamandag na ahas at ng kapantay na linya tungkol sa kamatayan. Mas tiyak sa kontekstong ito ang “kamandag.”
- source_word: פְּתָנִים
  choice: mga kobra
  rationale: Tumutukoy ito sa makamandag na ahas na tradisyonal na tinatawag na “asp.” Ang “kobra” ay malinaw at pamilyar sa makabagong mambabasang Filipino, nang hindi pinipilit ang higit na katiyakan sa espesye kaysa sa ipinahihiwatig ng Hebreo.
- source_word: יִינָק
  choice: sinisipsip niya
  rationale: Pinananatili nito ang tuwiran at matingkad na larawan ng pandiwang Hebreo na nangangahulugang “sumipsip” o “sumuso,” sa halip na palitan ito ng mas malayang “inumin.”
- source_word: תַּהַרְגֵהוּ
  choice: papatayin siya
  rationale: Tuwirang ipinahahayag nito ang tiyak na nakamamatay na bunga. Ang aspektong di-ganap ng pandiwang Hebreo ay maaaring ilarawan bilang kasalukuyan o hinaharap ayon sa konteksto; natural dito sa Filipino ang hinaharap na “papatayin.”
- source_word: לְשׁוֹן
  choice: dila
  rationale: Literal na “dila” ang nasa Hebreo. Pinananatili ang matapang na larawang patula sa halip na ipalit ang ipinapalagay na mekanismo gaya ng “pangil” o “kagat.”
- source_word: אֶפְעֶה
  choice: ulupong
  rationale: Tumutukoy ito sa isang makamandag na ahas, karaniwang isinasaling “viper.” Ang “ulupong” ay natural na katumbas sa Filipino at angkop sa paralelismo sa “kobra.”
