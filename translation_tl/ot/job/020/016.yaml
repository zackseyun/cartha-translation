translation_notes:
  register: Makabagong Filipino na tuwiran, marangal, at madaling maunawaan. Pinanatili ang matingkad na larawang patula ng pagsipsip sa kamandag at ng “dila” ng ahas, pati ang paralelismo ng dalawang linya.
