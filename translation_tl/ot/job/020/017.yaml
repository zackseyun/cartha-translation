base_translation:
  language: en
  yaml_path: translation/ot/job/020/017.yaml
  text: He will not look upon streams[a], rivers flowing with honey and curds.
translation:
  language: tl
  text: Hindi niya makikita ang mga sapa[a], mga ilog, at mga batis na umaapaw sa pulot at namuong gatas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O kaya: “Hindi niya makikita ang mga daluyan, mga ilog, mga lambak na dinadaluyan ng tubig, na may pulot at namuong gatas.”'
    reason: Pinananatili ng alternatibo ang posibilidad na ang tatlong magkakalapit na katawagang Hebreo ay tumukoy sa mga daluyan, ilog, at mga lambak o tuyong batis na dinadaluyan ng tubig. Ang “may pulot at namuong gatas” ay mas literal na ipinapakita ang ugnayan ng mga katawagang ito sa kasaganaang inilalarawan.
lexical_decisions:
- source_word: אַל יֵרֶא
  choice: Hindi niya makikita
  rationale: Sa konteksto ng patulang paglalarawan sa sasapitin ng masama, ang אַל kasama ng imperfect na יֵרֶא ay natural na ipinahahayag bilang pagtanggi sa mangyayari, hindi bilang tuwirang pagbabawal. Pinananatili ng “makikita” ang literal na pandiwang ראה at maaari ring magpahiwatig ng hindi niya mararanasan ang kasaganaang ito.
- source_word: בִפְלַגּוֹת
  choice: ang mga daluyan ng tubig
  rationale: Ang פְלַגּוֹת ay tumutukoy sa mga sapa o daluyan ng tubig. Ang unlaping ב ay inuunawang idyomatiko kaugnay ng pandiwang “makikita,” kaya hindi isinaling mekanikal bilang “sa loob ng.”
- source_word: נַהֲרֵי
  choice: mga ilog
  rationale: Ito ang construct plural ng נָהָר. Ang hiwalay na katawagan ay nagpapanatili sa sunod-sunod na larawang-tubig sa Hebreo.
- source_word: נַחֲלֵי
  choice: mga batis
  rationale: Ang נַחַל ay maaaring tumukoy sa batis, rumaragasang sapa, o tuyong lambak na dinadaluyan ng tubig. Ang “batis” ay malinaw at likas sa modernong Filipino habang pinananatili ang ikatlong katawagang-tubig ng Hebreo.
- source_word: דְּבַשׁ
  choice: pulot-pukyutan
  rationale: Karaniwang katumbas ng דְּבַשׁ at malinaw na larawan ng kasaganaan sa Filipino.
- source_word: וְחֶמְאָה
  choice: at kulta
  rationale: Ang חֶמְאָה ay maaaring tumukoy sa kulta, mantikilya, o krema. Pinili ang “kulta” upang ilarawan ang produktong gatas nang hindi ipinapalagay ang modernong naprosesong mantikilya.
theological_decisions:
- issue: Pahayag ba ito ng pagbabawal, kahilingan, o tiyak na kapalaran?
  choice: Isinalin bilang “Hindi niya makikita,” isang pahayag tungkol sa hindi mararanasan ng masama.
  alternative: “Huwag nawa niyang makita” o “Hindi sana niya makita.”
  rationale: Bagaman maaaring magkaroon ng jussive na himig ang אַל at imperfect, mas angkop sa daloy ng pahayag ni Zofar ang paglalarawan sa kapalaran ng masama. Hindi naman pinalalakas ang pahayag nang higit sa kayang ipahiwatig ng konteksto.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang gitling-pahaba upang ipakitang ang “mga ilog at mga batis” ay nagpapatuloy at nagpapalawak sa larawan ng “mga daluyan ng tubig.” Nasa pangunahing teksto ang marker na [a], alinsunod sa talababa.
