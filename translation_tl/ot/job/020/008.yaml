translation:
  language: tl
  text: Gaya ng panaginip, lilipad siyang palayo at hindi siya matatagpuan[a]; itataboy siya gaya ng pangitain sa gabi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “at hindi nila siya matatagpuan.” Gumagamit ang Hebreo ng pandiwang maramihan na walang tiyak na simuno, na may hulaping tumutukoy sa “siya.”
    reason: lexical_alternative
  - marker: b
    text: O “gaya ng pangitain ng gabi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּחֲלוֹם
  choice: Gaya ng panaginip
  rationale: Ang unlaping כַּ ay naghuhudyat ng paghahambing, at ang חֲלוֹם ay nangangahulugang “panaginip.” Likas at malinaw sa makabagong Tagalog ang “gaya ng panaginip.”
- source_word: יָעוּף
  choice: lilipad siyang palayo
  rationale: Ang pandiwang עוּף ay literal na “lumipad.” Pinananatili ng salin ang matingkad na larawang nagpapahiwatig ng mabilis na paglaho.
- source_word: וְלֹא יִמְצָאֻהוּ
  choice: at hindi na matatagpuan
  rationale: Literal na aktibong maramihan ang Hebreo, “at hindi nila siya matatagpuan,” ngunit likas sa Tagalog ang balintiyak na anyo at napapanatili nitong nakatuon ang linya sa taong naglalaho. Ibinibigay sa talababa ang mas literal na alternatibo.
- source_word: וְיֻדַּד
  choice: itataboy siya
  rationale: Ang Hophal na anyo ay nagpapahayag na siya ay itinutulak o itinataboy palayo. Ang “itataboy” ay natural, marangal, at angkop sa patulang paralelismo.
- source_word: כְּחֶזְיוֹן לָיְלָה
  choice: gaya ng pangitain sa gabi
  rationale: Ang חֶזְיוֹן ay “pangitain,” at maaaring unawain ang לָיְלָה bilang kaugnay na “ng gabi” o lokatibong “sa gabi.” Pinili ang mas natural na Tagalog na “pangitain sa gabi,” habang itinatala ang alternatibo sa talababa.
