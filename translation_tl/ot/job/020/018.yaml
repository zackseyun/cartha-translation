base_translation:
  language: en
  yaml_path: translation/ot/job/020/018.yaml
  text: He gives back what he labored for and does not swallow it down; according to the wealth of his exchange[a], he does not rejoice.
translation:
  language: tl
  text: Isinasauli niya ang pinaghirapan niya at hindi niya iyon nilulunok; ayon sa yamang nakuha niya sa pakikipagpalitan[a], hindi siya nagagalak.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Isinasauli niya ang kaniyang pinaghirapan at hindi niya iyon kinakain; tungkol sa yamang nakuha sa pakikipagpalitan, hindi siya nagbubunyi.” Siksik ang Hebreo sa ikalawang linya at maaari itong isalin sa ilang magkakalapit na paraan.'
    reason: alternative_reading
lexical_decisions:
- source_word: מֵשִׁיב
  choice: Isinasauli niya
  rationale: Ang Hiphil na anyo ng שוב ay nagpapahiwatig ng pagpapabalik o pagsasauli. Natural sa Filipino ang “isinasauli” at angkop sa diwang napipilitang bitiwan ng masama ang kaniyang nakuha.
- source_word: יָגָע
  choice: ang pinaghirapan niya
  rationale: Maaaring tumukoy ang יָגָע sa pagpapagal o sa bunga ng pagpapagal. Dahil ito ang layon ng “isinasauli,” malinaw at natural ang “ang pinaghirapan niya.”
- source_word: וְלֹא יִבְלָע
  choice: at hindi iyon nilulunok
  rationale: Literal na “lumunok” ang בלע. Pinananatili ng salin ang matingkad na larawan ng hindi niya makain, matamasa, o mapanatili ang kaniyang pakinabang.
- source_word: כְחֵיל
  choice: ayon sa yamang
  rationale: Sa konteksto, ang חֵיל ay malamang na “yaman” o “ari-arian,” hindi lakas-militar. Ang “ayon sa” ay kumakatawan sa mahirap at posibleng proporsiyonal na gamit ng כ.
- source_word: תְּמוּרָתוֹ
  choice: nakuha niya sa pakikipagpalitan
  rationale: Ang תְּמוּרָה ay maaaring mangahulugang palitan, kapalit, o bagay na nakuha sa palitan. Ginagawang malinaw ng parirala ang ekonomikong diwa habang pinananatili ang konsepto ng exchange.
- source_word: וְלֹא יַעֲלֹס
  choice: hindi siya nagagalak
  rationale: Ang עלס ay tumutukoy sa matinding pagkagalak o pagbubunyi. Ang “nagagalak” ay dignificado, malinaw, at likas sa modernong Filipino.
theological_decisions:
- issue: Ugnayan ng “yaman” at “pakikipagpalitan” sa ikalawang hati
  choice: ayon sa yamang nakuha niya sa pakikipagpalitan
  alternative: sa yaman ng kaniyang kapalit
  rationale: Napakasiksik at hindi tiyak ang Hebreo. Ang piniling salin ay nagpapakita ng malamang na ekonomikong diwa ngunit hindi nagpapasok ng partikular na teolohikal o moral na paliwanag na wala sa talata.
translation_notes:
  register: Modernong Filipino na dignificado at madaling maunawaan. Pinanatili ang konkretong larawang “nilulunok” at nilagyan ng talababa ang tunay na kalabuan ng ikalawang linya.
