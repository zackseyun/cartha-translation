  - severity: medium
    issue: Hindi gaanong likas ang “palalabasin iyon ng Diyos.”
    rationale: Bagaman nauunawaan bilang causative, mas idiomatiko at tuwiran ang “ilalabas ito ng Diyos,” na pinananatili ang Diyos bilang aktibong paksa at ang kayamanan bilang bagay na inaalis mula sa tiyan.
