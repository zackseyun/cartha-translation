  yaml_path: translation/ot/job/020/015.yaml
  text: He swallowed wealth[a], but he will vomit it up[b]; God will drive it out of his belly.
translation:
  language: tl
  text: Nilunok niya ang kayamanan[a], ngunit isusuka niya ito; ilalabas ito ng Diyos mula sa kanyang tiyan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga kayamanan” o “ari-arian” (חַיִל).
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, literal na “tiyan,” na nagpapanatili sa larawan ng nilunok na pakinabang na sapilitang inilalabas.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַיִל
  choice: kayamanan
  rationale: Sa konteksto ng karunungang panitikan at ng pakinabang ng masama, tumutukoy ito sa materyal na yaman o ari-arian, hindi sa lakas o hukbo.
- source_word: בָּלַע
  choice: nilunok
  rationale: Pinananatili nito ang konkretong larawang nagpapatuloy sa pandiwang “isusuka.”
- source_word: וַיְקִאֶנּוּ
  choice: ngunit isusuka rin niya iyon
  rationale: 'Ang pandiwa ay nangangahulugang “sumuka.” Ipinahahayag ng “ngunit” at “rin” ang matinding pagbabaligtad: hindi niya mapananatili ang nilunok niyang yaman.'
- source_word: מִבִּטְנוֹ
  choice: mula sa kanyang tiyan
  rationale: Ang בֶּטֶן ay literal na “tiyan” dito; pinananatili ng salin ang matingkad na larawang pangkatawan.
- source_word: יוֹרִשֶׁנּוּ
  choice: palalabasin iyon
  rationale: Ang causative na anyo ay nagsasaad na pangyayarihin ng Diyos ang paglabas o pagpapaalis sa nilunok na yaman.
- source_word: אֵל
  choice: Diyos
  rationale: Karaniwang katawagan ito sa Diyos at tahasang paksa ng huling sugnay.
theological_decisions:
- issue: Ang gumagawa ng paghatol sa pagpapaalis ng yaman ng masama
  choice: Tahasan ang Diyos bilang nagpapalabas ng yaman mula sa kanyang tiyan.
  alternative: Ipakita ang pagkawala bilang di-tiyak o likas lamang na bunga ng ginawa niya.
  rationale: Tahasan sa Hebreo ang אֵל bilang paksa ng יוֹרִשֶׁנּוּ, kaya hindi dapat palabuin ang pagkilos ng Diyos.
translation_notes:
  register: Makabago ngunit marangal na Filipino; pinanatili ang malinaw at marahas na larawang nilunok, isinuka, at inilabas mula sa tiyan. Ginamit ang hinaharap na aspekto sa pagbabaligtad at paghatol, alinsunod sa konteksto ng pahayag ni Zofar.
