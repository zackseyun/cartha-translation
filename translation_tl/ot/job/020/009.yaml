  text: The eye that saw him will not see him again[a], and his place will no longer see him.
translation:
  language: tl
  text: Ang matang nakakita sa kanya ay hindi na muling makakakita sa kanya[a], at hindi na siya makikita ng kanyang lugar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Ang matang tumitig sa kanya ay hindi na muling tititig sa kanya.” Isahan ang “mata” sa Hebreo bilang poetikong paglalarawan, at binibigyang-katauhan ang “kanyang lugar” sa ikalawang linya.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַיִן
  choice: Ang matang
  rationale: Pinananatili ang literal na isahang “mata” at ang matingkad na personipikasyon ng tulang Hebreo, sa halip na gawing “walang sinuman.”
- source_word: שְׁזָפַתּוּ
  choice: nakakita sa kanya
  rationale: Ang pandiwa ay maaaring mangahulugang makakita o tumitig. Natural sa modernong Tagalog ang “nakakita sa kanya” at kaagapay ito ng kilos ng pagtingin sa ikalawang linya.
- source_word: וְלֹא תוֹסִיף
  choice: ay hindi na muling makakakita sa kanya
  rationale: Ang negatibong anyo ng יסף ay nagsasaad na hindi na mauulit ang kilos. Inulit ang layong “sa kanya” upang maging malinaw at natural sa Tagalog.
- source_word: וְלֹא עוֹד
  choice: at hindi na
  rationale: Maikli at natural itong katumbas ng pahayag na wala nang pagpapatuloy o pag-uulit.
- source_word: תְּשׁוּרֶנּוּ
  choice: siya makikita
  rationale: Isinasalin ang שׁור bilang “makikita.” Ginamit ang balintiyak na ayos upang mapanatiling paksa at personipikado ang “kanyang lugar” nang hindi nagiging pilit ang Tagalog.
- source_word: מְקוֹמוֹ
  choice: ng kanyang lugar
  rationale: Pinananatili ang literal na “kanyang lugar” at ang poetikong personipikasyon nito bilang hindi na nakakakita sa kanya.
