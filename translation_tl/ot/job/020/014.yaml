  source_fidelity: 'Tapat ang salin sa daloy at larawan ng Hebreo: ang pagkain sa tiyan ay nagbabago at inilalarawan bilang kamandag ng mga ahas sa loob ng tao. Ang “pagkain,” “tiyan,” “kamandag,” at “sa loob niya” ay angkop na modernong katumbas ng mga pangunahing salita. Ang “mga ulupong” ay maingat na pangkalahatang katumbas ng פְּתָנִים at hindi nag-aangkin ng di-tiyak na espesye.'
  naturalness: Natural at marangal ang modernong Tagalog. Ang em dash ay epektibong nagpapakita ng bigla at patulang paglipat sa ikalawang larawan. Bagaman mas maikli sana ang “ay nagiging,” ang kasalukuyang “ay nagbabago—nagiging” ay nauunawaan at hindi nagpapalit ng diwa.
  terminology: Ang “kamandag” ay angkop sa konteksto ng מְרוֹרַת פְּתָנִים; ang talababa ay maayos na nag-iingat ng literal/tradisyonal na alternatibong “tinapay,” “mga laman-loob,” at “apdo.” Wasto ang anchor at tumutugma ang dahilan nito sa tekstong nasa talababa.
