translation:
  language: tl
  text: Ang pagkain niya sa kanyang tiyan ay nagbabago—nagiging kamandag ng mga ulupong sa loob niya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Ang kanyang tinapay sa kanyang mga laman-loob ay nababago—apdo ng mga makamandag na ahas sa loob niya.”'
    reason: Pinananatili ang mas literal na mga kahulugan ng לֶחֶם (“tinapay”), מֵעִים (“mga laman-loob”), at מְרֹרָה (“apdo/kapaitan”), gayundin ang maikli at di-ganap na ipinahayag na ugnayan ng dalawang sugnay sa Hebreo.
lexical_decisions:
- source_word: לַחְמוֹ
  choice: ang pagkain niya
  rationale: Bagaman karaniwang nangangahulugang “tinapay,” mas malawak ang gamit nito rito para sa kinain niya; natural sa modernong Tagalog ang “pagkain.”
- source_word: בְּמֵעָיו
  choice: sa kanyang tiyan
  rationale: Tumutukoy ito sa mga panloob na bahagi ng katawan, lalo na sa konteksto ng pagtunaw; malinaw at likas ang “sa kanyang tiyan.”
- source_word: נֶהְפָּךְ
  choice: ay nagbabago—nagiging
  rationale: Ipinapahayag ng Niphal ang pagbabago ng kalagayan. Pinananatili ng “nagbabago” ang kilos, at nililinaw ng “nagiging” ang ugnayan nito sa kasunod na larawang kamandag.
- source_word: מְרוֹרַת
  choice: kamandag
  rationale: Bagaman kaugnay ng “apdo” at “kapaitan,” sa pagkakaugnay nito sa makamandag na ahas ay likas na tumutukoy ito sa lason o kamandag.
- source_word: פְּתָנִים
  choice: mga ulupong
  rationale: Tumutukoy sa makamandag na ahas. Ang “ulupong” ay dignified at madaling maunawaang katumbas sa Tagalog nang hindi nag-aangkin ng tiyak na modernong espesye.
- source_word: בְּקִרְבּוֹ
  choice: sa loob niya
  rationale: Natural na ipinapahayag nito ang bagay na nasa kaloob-looban ng tao habang pinananatili ang pisikal na larawan.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Ginamit ang “ulupong” bilang pangkalahatang katawagan sa makamandag na ahas, sa halip na tukuyin nang tiyak bilang kobra. Ang dash ay nagpapanatili sa matinding, patulang paglipat mula sa pagbabago ng pagkain tungo sa kamandag.
