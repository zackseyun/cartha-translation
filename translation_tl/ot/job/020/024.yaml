base_translation:
  language: en
  yaml_path: translation/ot/job/020/024.yaml
  text: He will flee from an iron weapon[b][a]; a bronze bow will pierce him through.
translation:
  language: tl
  text: 'Tatakas siya mula sa sandatang bakal,

    ngunit tatagos sa kanya ang tansong pana.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “daraanan siya ng tansong pana.” Ang pandiwa ay maaaring mangahulugang “dumaan” o “tumagos”; sa kontekstong ito, ipinahihiwatig nito ang palasong pinakawalan mula sa pana.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִבְרַח
  choice: Tatakas siya
  rationale: Ang Qal imperfect ng ברח ay tumutukoy sa pagtakas; ang anyong panghinaharap ay angkop sa konteksto ng makatang paglalarawan sa hatol.
- source_word: מִנֵּשֶׁק בַּרְזֶל
  choice: mula sa sandatang bakal
  rationale: Maaaring tumukoy ang נשק sa sandata o mga sandata sa pangkalahatan. Ang isahang “sandata” ay natural dito at napapanatili ang kaugnayan nito sa bakal.
- source_word: תַּחְלְפֵהוּ
  choice: palalagpasin siya
  rationale: Ang חלף ay may batayang diwang “dumaan” o “lumagpas.” Sa konteksto ng sandata, ipinahihiwatig nitong tatagos ang pinakawalang palaso sa katawan niya, ngunit pinananatili sa teksto ang matalinghagang pagbanggit sa pana bilang gumagawa ng kilos.
- source_word: קֶשֶׁת נְחוּשָׁה
  choice: tansong pana
  rationale: Ang קשת ay pana at ang נחושה ay tanso o bronse. Ang “tansong pana” ay maikli, natural, at angkop sa sinaunang larawang pandigma.
theological_decisions: []
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “sandatang bakal” at “tansong pana” upang mapanatili ang maigsi at magkatapat na larawang patula. Ang “palalagpasin siya” ay sadyang pormal nang kaunti upang mapanatili ang ambiguwidad ng חלף, habang nililinaw ng talababa ang malamang na diwa sa konteksto.
