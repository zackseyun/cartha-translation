base_translation:
  language: en
  yaml_path: translation/ot/job/020/010.yaml
  text: His sons will seek the favor of the poor[b][a], and his own hands will give back his wealth.
translation:
  language: tl
  text: Sisikaping makuha ng kanyang mga anak na lalaki ang loob ng mahihirap[a], at ibabalik ng sarili niyang mga kamay ang kanyang yaman.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “payapain ng kanyang mga anak na lalaki ang mahihirap.” Ang pandiwang Hebreo ay maaaring tumukoy sa paghahangad ng pabor o sa pagpapalubag sa mga taong nagawan ng masama.
    reason: lexical_alternative
  - marker: b
    text: O “kanyang ari-arian”; maaari ring mangahulugang “kanyang lakas” o “kanyang sigla.” Malawak ang saklaw ng pangngalang Hebreo, ngunit “yaman” ang higit na angkop sa kontekstong ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּנָיו
  choice: kanyang mga anak na lalaki
  rationale: Tuwirang sinasalamin nito ang pangngalang panlalaking maramihan na may hulaping nangangahulugang “kanya.” Pinananatili ang “mga anak na lalaki” sa halip na gawing pangkalahatang “mga anak.”
- source_word: יְרַצּוּ
  choice: sisikaping makuha ... ang loob
  rationale: Ang Piel ng רצה ay maaaring mangahulugang humanap ng pagtanggap o pabor, o payapain ang mga taong nagawan ng masama. Ang idyomang Filipino na “makuha ang loob” ay natural at pinananatili ang diwang pakikipagkasundo nang hindi ipinapalagay na ganap na ang pagbabayad-pinsala.
- source_word: דַלִּים
  choice: mahihirap
  rationale: Karaniwang tumutukoy ang דלים sa mga dukha o mahihina sa lipunan. Ang “mahihirap” ang pinakanatural at tuwirang tawag sa modernong Filipino.
- source_word: יָדָיו
  choice: sarili niyang mga kamay
  rationale: Pinananatili ang literal na larawang “mga kamay,” samantalang ang “sarili niyang” ay nagbibigay-diin na ang pagsasauli ay magmumula sa kanya mismo.
- source_word: תָּשֵׁבְנָה
  choice: ibabalik
  rationale: Ang Hiphil ng שוב ay nangangahulugang magpabalik o magsauli. Ang “ibabalik” ay malinaw at likas sa konteksto ng pagsasauli.
- source_word: אוֹנוֹ
  choice: kanyang yaman
  rationale: Maaaring tumukoy ang אוֹן sa yaman, ari-arian, lakas, o sigla. Sa konteksto ng pagsasauli sa mahihirap, “yaman” ang pinakamalamang na materyal na diwa, habang itinatala sa talababa ang tunay na alternatibo.
theological_decisions:
- issue: Kung ang ikalawang sugnay ay tumutukoy sa materyal na pagsasauli o sa pagbabalik ng lakas
  choice: materyal na pagsasauli ng kanyang yaman
  alternative: pagsasauli ng kanyang ari-arian o pagbabalik ng kanyang lakas/sigla
  rationale: Mas angkop sa agarang konteksto ng mahihirap at ng bunga ng kasamaan ang materyal na pagbabayad o pagsasauli, ngunit hindi lubusang nilulutas ng Hebreo ang saklaw ng אוֹן; kaya pinananatili ang alternatibo sa talababa.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang natural na idyomang “makuha ang loob” para sa ugnayang ipinahihiwatig ng pandiwa, habang pinanatili ang kongkretong larawang “sarili niyang mga kamay.”
