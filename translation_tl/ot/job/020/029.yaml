  yaml_path: translation/ot/job/020/029.yaml
  text: This is the portion of a wicked man from God[a], the inheritance appointed for him from the Mighty One.
translation:
  language: tl
  text: 'Ito ang bahagi ng masamang tao mula sa Diyos,

    ang pamanang itinakda sa kanya[a] ng Makapangyarihan.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “ang pamana ng kanyang pahayag mula sa Makapangyarihan.” Ang salitang Hebreo ay mas literal na “kanyang salita” o “kanyang pahayag,” ngunit malamang na tumutukoy rito sa ipinahayag o itinakda ng Diyos para sa kanya.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶה
  choice: Ito ang
  rationale: Ipinakikilala ng demonstratibo ang pangwakas na buod ni Zofar; likas sa Tagalog na gamitin ang panandang “ang.”
- source_word: חֵלֶק
  choice: bahagi
  rationale: Tumutukoy sa takdang bahagi o kahihinatnan na inilaan sa isang tao; pinananatili rin nito ang pagkakatulad sa “pamana.”
- source_word: אָדָם רָשָׁע
  choice: taong masama
  rationale: Isang pangkalahatang katawagang nasa isahang bilang. Ang “taong masama” ay natural sa modernong Tagalog at hindi nagpapahiwatig na isang partikular na lalaki lamang ang tinutukoy.
- source_word: מֵאֱלֹהִים
  choice: mula sa Diyos
  rationale: Ang אֱלֹהִים ay tumutukoy rito sa Diyos bilang pinagmumulan ng takdang kahihinatnan.
- source_word: וְנַחֲלַת
  choice: ang pamanang
  rationale: Kaagapay ito ng “bahagi” at tumutukoy sa natanggap o itinalagang kapalaran; pinananatili ng “pamana” ang matalinghagang larawan ng Hebreo.
- source_word: אִמְרוֹ
  choice: itinakda sa kanya
  rationale: Literal na kaugnay ito ng “salita” o “pahayag,” ngunit sa konteksto ay malamang na tumutukoy sa ipinahayag o itinalagang kahihinatnan para sa masama. Inilalagay sa talababa ang tunay na leksikal na alternatibo.
- source_word: מֵאֵל
  choice: ng Makapangyarihan
  rationale: Ang אֵל ay titulong banal na nagpapahiwatig ng kapangyarihan. Ang “Makapangyarihan” ay nagpapanatili ng patulang pagkakaiba nito sa naunang “Diyos”; ginamit ang “ng” upang natural na ipahayag sa Tagalog ang pinagmulan o tagapagtakda.
theological_decisions:
- issue: Pangkalahatang gamit ng אָדָם sa isahang bilang
  choice: taong masama
  alternative: masamang lalaki
  rationale: Bagaman panlalaki at isahan ang anyong Hebreo, pangkalahatan ang tinutukoy nito. Mas tumpak at natural sa Tagalog ang “taong masama” nang hindi nililimitahan ang diwa sa kasariang lalaki.
- issue: Kahulugan ng אִמְרוֹ
  choice: itinakda sa kanya
  alternative: kanyang salita/pahayag
  rationale: Ang konteksto at paralelismo ng “bahagi” at “pamana” ay sumusuporta sa diwang isang kapalarang ipinahayag o itinakda ng Diyos. Gayunman, hindi tiyak ang idyomatikong pagpapakahulugan, kaya pinananatili sa talababa ang mas literal na pagbasa.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang patulang paralelismo sa dalawang linya at ang pagkakaiba ng mga titulong “Diyos” at “Makapangyarihan.”
