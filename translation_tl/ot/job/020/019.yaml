base_translation:
  language: en
  yaml_path: translation/ot/job/020/019.yaml
  text: For he has crushed and abandoned the poor[a]; he has seized a house and will not rebuild it.
translation:
  language: tl
  text: Sapagkat dinurog niya at pinabayaan ang mga mahihirap[a]; inagaw niya ang isang bahay, at hindi niya ito itatayo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin ang “pinabayaan” bilang “tinalikuran.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikilala nito ang dahilan ng hatol na inilalarawan sa konteksto; natural sa Filipino ang “sapagkat” at pinananatili nito ang paliwanag na ugnayan.
- source_word: רִצַּץ
  choice: dinurog
  rationale: Pinananatili ng “dinurog” ang marahas at konkretong larawan ng pandiwang רצץ, sa halip na agad itong gawing mas abstraktong “inapi.”
- source_word: עָזַב
  choice: pinabayaan
  rationale: Ipinahihiwatig nito ang may-salang pagtalikod o pagpapabaya sa mga dukha, sa natural at kasalukuyang Filipino.
- source_word: דַּלִּים
  choice: ang mga dukha
  rationale: Ang דל ay maaaring tumukoy sa mahihirap, mahihina, o mga kapos sa kapangyarihan; ang “mga dukha” ay maikli, marangal, at angkop sa konteksto.
- source_word: בַּיִת גָּזַל
  choice: inagaw niya ang isang bahay
  rationale: Ang גזל ay pagkuha sa pamamagitan ng dahas o pandarambong. Mas malinaw na ipinapahayag ng “inagaw” kaysa “ninakaw” ang sapilitang pagkamkam ng bahay.
- source_word: וְלֹא יִבֶנֵהוּ
  choice: ngunit hindi niya iyon maitatayo
  rationale: Ang בנה ay pangunahing nangangahulugang “magtayo/magbuo.” Ang “maitatayo” ay nagpapanatili sa aspektong di-ganap at sa kabalintunaan na inagaw niya ang bahay ngunit hindi niya ito maitatatag para sa sarili; hindi nito tahasang ipinapasok ang ideya ng muling pagtatayo.
theological_decisions:
- issue: Kung ang huling sugnay ay karaniwang pahayag lamang o pahiwatig ng hatol
  choice: hindi niya iyon maitatayo
  alternative: hindi niya iyon muling itatayo
  rationale: Pinananatili ng napiling anyo ang bukas na pahiwatig na hindi niya magagawang maitatag o mapakinabangan ang inagaw na bahay, nang hindi nilulutas nang labis kung ito ay kawalan ng kakayahan, hinaharap na hatol, o literal na pagtatayo.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Pinanatili ang kongkretong larawang “dinurog” at ang panlipunang bigat ng “mga dukha.” Ginamit ang “maitatayo” upang maging natural ang hinaharap na diwa ng pandiwa habang pinananatili ang tunay na kalabuan ng huling sugnay.
