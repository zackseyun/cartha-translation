    rationale: Sa Tagalog, ang “nito” ay pinakamalapit na tumutukoy sa “galit,” kaya maaaring mabasa na ang galit ang nagpapaulan. Sa Hebreo, ang Diyos ang ipinahihiwatig na gumagawa ng pagpapadala at pagpapaulan; ang galit ang ipinadadala/ibinubuhos.
  - severity: low
    issue: Medyo di-natural ang “Kapag pupunuin na niya.”
    rationale: Mas idiomatiko ang “Kapag malapit na niyang punuin ang kanyang tiyan” para sa temporal at napipintong diwa ng יְהִי לְמַלֵּא.
