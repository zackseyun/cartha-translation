  text: When he is about to fill his belly[a], he will send against him the burning of his anger and rain it upon him as his food.
translation:
  language: tl
  text: Kapag malapit na niyang punuin ang kanyang tiyan, ipadadala ng Diyos laban sa kanya ang nag-aalab Niyang galit, at pauulanan siya ng Diyos ng galit na ito bilang kanyang pagkain.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “at pauulanan siya ng Diyos ng galit na ito habang kumakain siya.” Mahirap unawain ang huling parirala sa Hebreo; maaaring mas tuwirang iugnay nito sa kanyang pagkain ang ibinubuhos na paghatol, sa halip na tukuyin lamang ang oras ng pagkain.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהִי לְמַלֵּא בִטְנוֹ
  choice: Kapag pupunuin na niya ang kanyang tiyan
  rationale: Ipinapahayag ang temporal na pangyayari sa likod ng di-tiyak na anyong יְהִי, habang pinananatili ng “pupunuin” at “tiyan” ang kongkretong larawan ng pagpapatighaw sa sarili.
- source_word: יְשַׁלַּח בּוֹ
  choice: ipadadala ng Diyos laban sa kanya
  rationale: Ang שלח ay tuwirang “magpadala,” at ang בּוֹ ay may diwang salungat o laban sa isang tao. Tinukoy ang Diyos bilang ipinahihiwatig na simuno ayon sa konteksto.
- source_word: חֲרוֹן אַפּוֹ
  choice: ang nag-aalab Niyang galit
  rationale: Pinananatili ng “nag-aalab” ang metapora ng init o pagliyab ng galit, ngunit mas likas ito sa modernong Tagalog kaysa sa isang mahigpit na nominal na parirala.
- source_word: וְיַמְטֵר עָלֵימוֹ
  choice: at pauulanan siya nito
  rationale: Pinananatili ang larawan ng pag-ulan ng hatol at ang panghalip na isahan na hinihingi ng konteksto ng masamang tao.
- source_word: בִּלְחוּמוֹ
  choice: bilang kanyang pagkain
  rationale: Ang mahirap na pangwakas na salita ay iniuugnay sa pagkain; ipinapakita ng salin ang posibilidad na ang ibinubuhos na galit mismo ang nagiging takdang “pagkain” niya, samantalang inilalahad sa talababa ang mahalagang alternatibo.
theological_decisions:
- issue: Ipinahihiwatig na simuno ng mga pandiwa ng paghatol
  choice: Hayagang tinukoy ang Diyos bilang nagpapadala at nagpapaulan ng galit.
  alternative: Panatilihin lamang ang panghalip na “niya,” o gumamit ng balintiyak na ayos upang hindi tukuyin ang simuno.
  rationale: Sa konteksto ng pahayag ni Zofar tungkol sa pagganti ng Diyos, ang Diyos ang pinakanatural na simuno at Siya rin ang tinutukoy ng “Kanyang galit.” Nililinaw ito nang hindi nagdaragdag ng natatanging aral ng anumang denominasyon.
- issue: Ugnayan ng בִּלְחוּמוֹ sa paghatol at pagkain
  choice: “bilang kanyang pagkain”
  alternative: “habang kumakain siya” o “kasabay ng kanyang pagkain”
  rationale: Mahirap at hindi tiyak ang parirala. Pinananatili sa pangunahing teksto ang mas tuwirang ugnayan ng pag-ulang hatol sa pagkain, habang ang temporal na pagbasa ay inilalagay sa talababa upang hindi ikubli ang tunay na kalabuan.
translation_notes:
  register: Makabago at marangal na Tagalog; pinanatili ang matitingkad na larawang “tiyan,” “nag-aalab,” at “pauulanan.” Ginamit ang “Niyang” para malinaw na tumutukoy sa Diyos ang galit, at iniwasan ang teknikal o denominasyonal na pananalita.
