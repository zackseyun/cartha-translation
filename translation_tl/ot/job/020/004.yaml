  text: Have you known this from of old[a], since man was placed on the earth?
translation:
  language: tl
  text: Hindi mo ba alam ito mula pa noong unang panahon, mula nang ilagay ang tao[a] sa lupa?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sangkatauhan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲ/זֹאת
  choice: ito
  rationale: Ang demonstratibo ang tumutukoy sa nilalaman ng retorikal na tanong; likas at sapat ang “ito” sa Tagalog.
- source_word: יָדַעְתָּ
  choice: Hindi mo ba alam
  rationale: Ang Qal perfect na 2ms sa retorikal na tanong ay natural na ipinahahayag sa Tagalog bilang “Hindi mo ba alam,” na maaaring tumukoy sa kaalamang matagal nang dapat taglay.
- source_word: מִנִּי עַד
  choice: mula pa noong unang panahon
  rationale: Ipinahahayag ng idyoma ang malayong nakaraan; malinaw at marangal sa makabagong Tagalog ang pariralang ito.
- source_word: מִנִּי שִׂים
  choice: mula nang ilagay
  rationale: Pinananatili nito ang ikalawang panandang temporal at ang diwang nagsisimula sa pagkakalagay.
- source_word: שִׂים
  choice: ilagay
  rationale: Tumutukoy ang infinitive construct sa paglalagay o pagtatakda sa tao sa ibabaw ng lupa; “ilagay” ang pinakadiretso at natural na katumbas sa konteksto.
- source_word: אָדָם
  choice: ang tao
  rationale: Ang pang-isahang אָדָם ay gamit nang pangkalahatan. Sa Tagalog, likas na tumutukoy ang “ang tao” sa sangkatauhan nang hindi nililimitahan sa lalaking kasarian at napapanatili ang anyong pang-isahan.
- source_word: עֲלֵי אָרֶץ
  choice: sa lupa
  rationale: Diretsong lokatibong salin ito; natural sa Tagalog ang “sa lupa” at angkop sa konteksto ng paglalagay sa tao.
theological_decisions:
- issue: Pangkalahatang antropolohikal na gamit ng אָדָם
  choice: ang tao
  alternative: ang sangkatauhan
  rationale: Pang-isahan ngunit pangkalahatan ang Hebreo. Ang “ang tao” ay pinananatili ang anyong pang-isahan at likas na inclusive sa Tagalog; inilalagay sa talababa ang mas tahasang kolektibong pagbasa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang retorikal na anyong “Hindi mo ba alam” at pinanatili ang dalawang magkaugnay na pariralang temporal ng Hebreo.
