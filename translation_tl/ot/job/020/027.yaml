base_translation:
  language: en
  yaml_path: translation/ot/job/020/027.yaml
  text: The heavens will reveal his iniquity[b][a], and the earth will rise up against him.
translation:
  language: tl
  text: Ilalantad ng kalangitan ang kanyang kasamaan[a], at babangon laban sa kanya ang lupa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang kanyang pagkakasala.” Maaaring tumukoy ang salitang Hebreo sa masamang gawa o sa pananagutang moral na kaakibat nito.
    reason: lexical_alternative
  - marker: b
    text: O “ang lupain,” ngunit mas angkop dito ang “lupa” dahil katambal ito ng “kalangitan” sa makatang paglalarawan.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְגַלּוּ
  choice: Ilalantad
  rationale: Ang Piel imperfect ng גלה ay tumutukoy sa paghahayag o paglalantad ng isang bagay. Pinananatili ng “ilalantad” ang larawan ng pagkakasamang mabubunyag sa harap ng lahat.
- source_word: שָׁמַיִם
  choice: ang kalangitan
  rationale: Bagaman nasa anyong maramihan ang salitang Hebreo, karaniwan itong tumutukoy sa langit bilang kabuuan. Ang “kalangitan” ay natural, marangal, at angkop sa personipikasyon sa tula.
- source_word: עֲוֺנוֹ
  choice: ang kanyang kasamaan
  rationale: Maaaring tumukoy ang עָוֹן sa masamang gawa o sa pananagutang dulot nito. Ang “kasamaan” ay malinaw na nagpapahayag ng moral na kabulukan sa konteksto, habang inilalahad sa talababa ang tunay na alternatibong “pagkakasala.”
- source_word: וְאֶרֶץ
  choice: at ... ang lupa
  rationale: Maaaring mangahulugan ang אֶרֶץ ng “lupa” o “lupain.” Mas akma rito ang “lupa” dahil katambal ito ng “kalangitan” sa kosmikong personipikasyon.
- source_word: מִתְקוֹמָמָה
  choice: babangon
  rationale: Ang anyo mula sa קום ay naglalarawan ng pagtindig o pagbangon bilang pagsalungat. Pinananatili ng “babangon” ang masiglang personipikasyon.
- source_word: לוֹ
  choice: laban sa kanya
  rationale: Bagaman karaniwang nangangahulugang “sa” o “para sa” ang ל, nagkakaroon ito rito ng salungat na diwa kasunod ng pandiwa ng pagbangon. Likas sa Filipino ang “babangon laban sa kanya.”
theological_decisions: []
translation_notes:
  register: Makabago at marangal na Filipino na may bahagyang makatang himig. Pinanatili ang personipikasyon ng kalangitan at lupa, pati ang semantikong lawak ng עָוֹן sa pamamagitan ng talababa.
