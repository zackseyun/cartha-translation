  to: Sa kasagsagan ng kanyang kasaganaan[a], darating sa kanya ang kapighatian; darating sa kanya ang bawat kamay ng mga nagdurusa[b].
  rationale: Pinalitan ang “kagipitan” ng “kapighatian” upang masaklaw ang kahulugang pagkasikip o pagdurusang ipinahihiwatig ng יֵצֶר nang walang di-kailangang limitasyong pinansiyal. Inayos ang ikalawang sugnay upang maging mas likas sa Filipino, habang pinananatili ang “kamay” bilang metonimiya at ang hindi lubusang tiyak na paraan ng pagdating nito sa kanya. Inayos din ang mga talababa para sa mas natural na Filipino at upang mapanatili ang mahahalagang leksikal na alternatibo.
