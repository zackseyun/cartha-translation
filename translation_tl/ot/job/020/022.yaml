lexical_decisions:
- source_word: בִּמְלֹאות
  choice: Sa kasagsagan ng
  rationale: Ipinahahayag ng בְּ kasama ng anyong mula sa מלא ang panahong umabot sa kapuspusan o rurok ang isang kalagayan. Likas sa makabagong Tagalog ang “sa kasagsagan ng” at napapanatili nito ang temporal na diwa.
- source_word: שִׂפְקוֹ
  choice: kanyang kasaganaan
  rationale: Ang שׂפק ay tumutukoy sa kasapatan o saganang kalagayan. Ang “kasaganaan” ay malinaw at angkop sa konteksto ng pag-unlad ng masama, habang inilalahad sa talababa ang “kasapatan.”
- source_word: יֵצֶר לוֹ
  choice: darating sa kanya ang kagipitan
  rationale: Ang parirala ay naglalarawan ng pagsisikip o pagkagipit na sasapit sa kanya. Ipinahahayag ng salin ang idyoma nang malinaw nang hindi tinutukoy kung ano mismo ang sanhi ng kagipitan.
- source_word: כָּל יַד
  choice: bawat kamay
  rationale: Pinananatili ang isahang-distributibong כָּל at ang matingkad na metonimiya ng “kamay” bilang kapangyarihan o pagkilos.
- source_word: עָמֵל
  choice: taong naghihirap
  rationale: Maaaring tumukoy ang עָמֵל sa taong nagdurusa, nagpapagal, o nasa abang kalagayan. Ang “taong naghihirap” ay natural at sapat na malawak sa kontekstong ito.
- source_word: תְּבוֹאֶנּוּ
  choice: darating laban sa kanya
  rationale: Literal na nagsasaad ang בוא na darating o sasapit sa kanya. Nililinaw ng “laban” ang salungatang ipinahihiwatig ng “bawat kamay” nang hindi ginagawang mas marahas kaysa sa teksto.
