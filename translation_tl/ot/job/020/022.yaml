  text: Sa kasagsagan ng kanyang kasaganaan[a], darating sa kanya ang kapighatian; darating sa kanya ang bawat kamay ng mga nagdurusa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Sa ganap na kasapatan niya.” Maikli at siksik ang pahayag sa Hebreo, at maaaring ipahiwatig ng pangngalan ang kasapatan, kasaganaan, o saganang kalagayan.
    reason: lexical_alternative
