  source_fidelity: 'Tumpak ang pangunahing pag-unawa sa Hebreo: ang unang sugnay ay tumutukoy sa pagdating ng pagkagipit/kapighatian sa rurok ng kanyang kasapatan o kasaganaan, at ang huling sugnay ay pinananatili ang kolektibo at metonimikong “kamay.” Gayunman, ang “kagipitan” ay maaaring masyadong magpahiwatig ng suliraning pinansiyal sa makabagong Filipino para sa mas malawak na יֵצֶר (“pagkabalisa, pagkasikip, kapighatian”).'
  naturalness: Ang “darating laban sa kanya ang bawat kamay” ay malapit sa estruktura ng Hebreo ngunit medyo matigas sa Filipino. Ang “darating sa kanya ang bawat kamay ng mga nagdurusa” ay mas natural na poetic Filipino at hindi ipinipilit ang “laban,” na isang pagpapalinaw lamang sa English audit trail, hindi tahasang salita sa Hebreo.
  terminology: Ang “kasaganaan” ay angkop para sa שִׂפְקוֹ. Ang “kapighatian” ay mas malawak at mas angkop sa rehistrong pangkarunungan kaysa “kagipitan.” Ang “mga nagdurusa” ay likas na kolektibong katumbas ng עָמֵל at iniiwasan ang labis na sosyoekonomikong pakahulugan ng “taong naghihirap.”
  issues:
  - severity: medium
    issue: Maaaring masyadong makitid ang “kagipitan.”
    rationale: Sa karaniwang modernong Filipino, madalas itong tumutukoy sa kakulangan sa pera o kabuhayan. Ang Hebreong יֵצֶר ay mas pangkalahatang kalagayan ng pagkasikip, pagdadalamhati, o kapighatian.
  - severity: low
    issue: Medyo hindi likas ang “bawat kamay ng taong naghihirap ay darating laban sa kanya.”
    rationale: Bagaman napapanatili nito ang larawan ng Hebreo, ang “darating laban” ay calque-like sa Filipino. Hindi rin kinakailangang idagdag ang adversatibong “laban,” sapagkat ang בוא na may pronominal na layon ay maaaring isaling “darating/sasapit sa kanya.”
  - severity: low
    issue: Ang paliwanag na “Masinsin ang Hebreo” ay hindi ang pinakalikas na paglalarawan sa compact na pahayag.
    rationale: Mas malinaw sa Filipino ang “maikli at siksik ang pahayag sa Hebreo.”
