  yaml_path: translation/ot/job/020/013.yaml
  text: He spares it and does not let it go[a], and holds it in his mouth.
translation:
  language: tl
  text: Iniingatan niya ito at ayaw niyang bitiwan; pinananatili niya ito sa loob ng kanyang bibig.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “sa loob ng kanyang ngalangala.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יַחְמֹל עָלֶיהָ
  choice: Iniingatan niya ito
  rationale: Ang חמל ay karaniwang nangangahulugang maawa o magligtas, ngunit sa larawan ng kasamaan bilang matamis na bagay sa naunang talata, ipinahihiwatig dito ang maingat na pag-iingat sa isang bagay na ayaw niyang isuko. Ang “iniingatan” ay natural sa Filipino at hindi inaalis ang diwa ng pagpapahalaga at pagpapanatili.
- source_word: וְלֹא יַעַזְבֶנָּה
  choice: at ayaw niyang bitiwan
  rationale: Ang עזב ay nangangahulugang iwan, pabayaan, o bitawan. Sa pisikal na larawan ng bagay na nasa bibig, malinaw at likas ang “ayaw niyang bitiwan,” na nagpapahayag ng sadyang hindi pagpapakawala.
- source_word: וְיִמְנָעֶנָּה
  choice: pinananatili niya ito
  rationale: Ang מנע ay may diwang pigilin, ipagkait, o panatilihin. Dito ay pinipigil niyang malunok o mawala ang bagay, kaya ang “pinananatili” ay naghahatid ng larawan nang hindi nagdaragdag ng kilos na wala sa teksto.
- source_word: בְּתוֹךְ חִכּוֹ
  choice: sa loob ng kanyang bibig
  rationale: Ang חך ay literal na ngalangala, ngunit maaari itong tumukoy sa bibig sa ganitong makatang paglalarawan. Mas malinaw sa karaniwang mambabasa ang “sa loob ng kanyang bibig,” habang inilalagay sa talababa ang mas literal na katawagan.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang metapora ng isang bagay na iniingatan sa bibig at ang pambabaeng panghalip na tumutukoy sa “kasamaan” sa talata 12 ay isinalin bilang neutral na “ito.”
