translation:
  language: tl
  text: Kaya inuudyukan ako ng aking mga saloobin na sumagot,[a] dahil sa pagkabagabag sa loob ko.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sinasagot ako ng aking mga saloobin” o “ang aking magugulong saloobin ang sumasagot sa akin.” Masiksik ang idyomang Hebreo at maaaring tumukoy sa mga saloobing tumutugon sa loob niya o nagtutulak sa kanya na sumagot.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “dahil sa pagmamadali sa loob ko.” Maaaring mangahulugan ng pagmamadali ang salitang Hebreo, ngunit sa konteksto ay malamang na tumutukoy ito sa panloob na pagkabagabag o apurahang bugso ng damdamin.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Kaya
  rationale: Likas na panandang Filipino para sa bunga o paghihinuha mula sa naunang sinabi.
- source_word: שְׂעִפַּי
  choice: aking mga saloobin
  rationale: Pinananatili ang malawak at makatang kahulugan ng mga kaisipan o saloobing gumugulo sa nagsasalita nang hindi nagdaragdag ng tahasang pang-uri na wala sa Hebreo.
- source_word: יְשִׁיבוּנִי
  choice: sinasagot ako
  rationale: Malapit sa masiksik na idyomang Hebreo at pinananatili ang larawang ang mga saloobin niya mismo ang tumutugon sa kanya; inilalahad sa talababa ang posibleng causative na diwa.
- source_word: וּבַעֲבוּר
  choice: dahil sa
  rationale: Malinaw at natural na nagpapahayag ng sanhi sa modernong Tagalog.
- source_word: חוּשִׁי
  choice: pagkabagabag
  rationale: Ipinahahayag ang panloob na pagkabalisa o apurahang pagkilos ng damdamin na angkop sa konteksto, habang kinikilala sa talababa ang literal na diwa ng pagmamadali.
- source_word: בִי
  choice: sa loob ko
  rationale: Tuwirang pinananatili ang lokasyong panloob na ipinahihiwatig ng pariralang Hebreo.
