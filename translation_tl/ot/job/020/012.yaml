base_translation:
  language: en
  yaml_path: translation/ot/job/020/012.yaml
  text: Though evil is sweet in his mouth[a], he hides it under his tongue,
translation:
  language: tl
  text: Kahit matamis sa kanyang bibig ang kasamaan[a], itinatago niya ito sa ilalim ng kanyang dila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Kung matamis sa kanyang bibig ang kasamaan.” Maaaring unawain ang salitang Hebreo bilang kondisyunal na “kung” o konsesibong “kahit”; mas angkop sa konteksto ang konsesibong diwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Kahit
  rationale: Maaaring kondisyunal na “kung” o konsesibo na “kahit/bagama't” ang אִם. Sa konteksto ng paglalarawan sa masamang taong nasisiyahan sa kasamaan, natural ang konsesibong “Kahit,” habang itinatala sa talababa ang tunay na alternatibo.
- source_word: תַּמְתִּיק
  choice: matamis
  rationale: Ang Hiphil ng מתק ay maaaring mangahulugang “gawing matamis,” ngunit kapag רָעָה ang paksa, ang idyomatikong diwa ay pagiging matamis o kaaya-aya. Ang “matamis” ay natural at pinananatili ang metapora ng panlasa.
- source_word: בְּפִיו
  choice: sa kanyang bibig
  rationale: Tuwirang isinasalin ang konkretong larawan ng פֶּה at iniuugnay ito sa kasunod na “sa ilalim ng kanyang dila.”
- source_word: רָעָה
  choice: kasamaan
  rationale: Sa kontekstong ito, tumutukoy ang pangngalan sa moral na kasamaan na nilalasap ng taong masama. Ang “kasamaan” ay malinaw at likas sa marangal na modernong Filipino.
- source_word: יַכְחִידֶנָּה
  choice: itinatago niya ito
  rationale: Ang Hiphil ng כחד ay nagpapahayag ng pagtatago o pagkukubli. Ang “ito” ay tumutukoy pabalik sa “kasamaan.” Ginamit ang aspektong di-ganap upang ilarawan ang nagpapatuloy o karaniwang kilos.
- source_word: תַּחַת
  choice: sa ilalim ng
  rationale: Pinananatili ang payak na lokatibong kahulugan at ang matingkad na larawan sa loob ng bibig.
- source_word: לְשׁוֹנוֹ
  choice: kanyang dila
  rationale: Literal na salin na nagpapanatili sa larawan ng palihim na pag-iingat at paglasap sa kasamaan.
