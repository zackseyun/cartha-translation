  text: Though his exaltation rises to the heavens[a], and his head reaches to the clouds[b],
translation:
  language: tl
  text: Kahit umabot sa langit ang kanyang kataasan[a][b], at umabot sa mga ulap ang kanyang ulo,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Kung umabot sa langit ang kanyang kataasan.” Ang Hebreong אִם ay maaaring unawain bilang payak na kondisyon (“kung”) o, sa kontekstong ito, bilang pagpapahiwatig ng konsesyon (“kahit”).
    reason: lexical_alternative
  - marker: b
    text: Ang “kataasan” ay maaari ding mangahulugang “kadakilaan” o “mataas na kalagayan,” kaya maaaring tumukoy ang larawan kapwa sa taas at sa pag-angat ng katayuan.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Kahit
  rationale: Sa kontekstong patula, ang אִם ay maaaring magpakilala ng pasakaling may diwang pagpap concessive; likas sa Tagalog ang “Kahit” at umaayon sa kasunod na kabalintunaan.
- source_word: יַעֲלֶה
  choice: umabot
  rationale: Bagaman literal na tumutukoy sa pag-akyat, sa pariralang kasama ang “kataasan” ay mas natural ang “umabot sa langit” at napapanatili ang paitaas na larawan.
- source_word: לַשָּׁמַיִם
  choice: sa langit
  rationale: Ang “langit” ang karaniwang natural na katumbas sa modernong Tagalog at angkop sa maringal na larawang patula.
- source_word: שִׂיאוֹ
  choice: ang kanyang kataasan
  rationale: Pinananatili ng “kataasan” ang sadyang malawak na kahulugan ng pisikal na taas, kadakilaan, o mataas na katayuan nang hindi nililimitahan sa pagmamataas.
- source_word: וְרֹאשׁוֹ
  choice: at ... ang kanyang ulo
  rationale: Ang “ulo” ang tuwirang kahulugan at pinananatili ang larawan ng isang taong napakataas.
- source_word: לָעָב
  choice: sa mga ulap
  rationale: Natural sa Tagalog ang maramihang “mga ulap” sa paralelismo nito sa langit, bagaman isahan ang kolektibong Hebreo.
- source_word: יַגִּיעַ
  choice: umabot
  rationale: Malinaw at natural na ipinahahayag ng “umabot” ang pag-abot hanggang sa isang hangganan.
theological_decisions:
- issue: Kung pisikal na taas o mataas na kalagayan ang tinutukoy ng שִׂיאוֹ
  choice: kataasan
  alternative: kadakilaan / mataas na kalagayan
  rationale: Ang “kataasan” ay nagpapanatili sa kongkretong larawang patayo habang hinahayaan ding marinig ang pahiwatig ng kadakilaan o pag-angat ng masama sa konteksto.
translation_notes:
  register: Makabagong Filipino na may dignidad at bahagyang patulang himig. Ginamit ang payak na “umabot” at “kataasan” upang maging malinaw sa karaniwang mambabasa habang pinananatili ang paralelismo at semantikong lawak ng Hebreo.
