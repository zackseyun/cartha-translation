  text: The produce of his house will be carried away[b][a], flowing away in the day of his anger.
translation:
  language: tl
  text: Aalis[a] ang ani ng kaniyang sambahayan, at aagos palayo sa araw ng kaniyang galit.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mawawala” o “dadalhin sa pagkatapon”; ang pandiwa ay maaaring tumukoy sa pag-alis o pagkakatanggal, dito ay sa ani o yaman ng sambahayan ng masamang tao.
    reason: lexical_alternative
  - marker: b
    text: Malamang na galit ng Diyos ang tinutukoy, bagaman hindi tahasang sinasabi sa Hebreo kung kaninong galit ito.
    reason: alternative_reading
lexical_decisions:
- source_word: יִגֶל
  choice: Mawawala
  rationale: Ang Qal imperfect ng גלה ay maaaring tumukoy sa pag-alis, pagpapatapon, o pagkakait. Dahil יְבוּל ang simuno, ipinahahayag ng “mawawala” ang pagkaparam ng pag-aari nang hindi nagdaragdag ng tiyak na gumawa nito.
- source_word: יְבוּל
  choice: bunga
  rationale: Tumutukoy ito sa ani, aniing bunga, o anumang pakinabang na naibubunga ng lupain o sambahayan. Ang “bunga” ay natural sa Filipino at sapat na malawak para sa yaman o pakinabang ng sambahayan.
- source_word: בֵּיתוֹ
  choice: ng kaniyang sambahayan
  rationale: Bagaman literal na “ng kaniyang bahay,” maaaring saklawin ng בַּיִת ang buong sambahayan at ari-arian. Iniiwasan ng “sambahayan” ang di-natural na pariralang “bunga ng kaniyang bahay.”
- source_word: נִגָּרוֹת
  choice: aagos itong palayo
  rationale: Mula sa נגר, inilalarawan nito ang pag-agos o pagbuhos palayo. Pinananatili ng salin ang larawang parang tubig na tuluyang nawawala, nang hindi tahasang nagdaragdag ng baha o ibang sanhi.
- source_word: בְּיוֹם
  choice: sa araw ng
  rationale: Pinananatili ang temporal at maringal na idyomang Hebreo, na tumutukoy sa takdang panahon ng paghatol.
- source_word: אַפּוֹ
  choice: kaniyang galit
  rationale: Ang אַף ay nangangahulugang galit o poot, at ang hulapi ay ikatlong panauhang panlalaki. Hindi tahasang pinapangalanan ng Hebreo kung sino ang tinutukoy, kaya pinanatili ang panghalip.
theological_decisions:
- issue: Ang tinutukoy ng “kaniyang galit”
  choice: Pinanatili sa pangunahing teksto ang “kaniyang galit” nang hindi tahasang idinaragdag ang Diyos.
  alternative: “galit ng Diyos” o galit ng masamang tao
  rationale: Malakas na ipinahihiwatig ng konteksto na galit ng Diyos ang tinutukoy, ngunit nananatiling implicit ang tinutukoy ng panghalip sa Hebreo. Pinananatili ng salin ang tunay na kalabuan at ipinaliliwanag sa talababa ang malamang na pagbasa.
translation_notes:
  register: Makabagong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “kaniyang” para sa pormal na daloy, at pinanatili ang magkaugnay na larawan ng pagkawala at pag-agos palayo. Ang mga talababa ay nakamarka sa pangunahing teksto bilang [a] at [b].
