  text: He pulls it out[a], and it comes from his body; a flashing point comes from his gall; terrors come upon him.
translation:
  language: tl
  text: Hinugot niya iyon[a], at lumabas iyon mula sa kanyang katawan; ang kumikislap na dulo ay lumabas mula sa kanyang apdo; nilukob siya ng mga sindak.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “lumabas ang kumikislap na talim mula sa kanyang apdo”; gumagamit ang Hebreo ng matingkad na larawang pangkatawan at maaaring tumukoy sa kumikislap na dulo ng sandata habang inilalabas ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלַף
  choice: Hinugot niya iyon
  rationale: Ang pandiwa ay nangangahulugang humugot o bumunot, karaniwan ng sandata. Hindi tahasang binanggit ang layon, kaya ginamit ang “iyon” ayon sa konteksto nang hindi tinutukoy nang higit sa pinagmulan.
- source_word: וַיֵּצֵא מִגֵּוָה
  choice: at lumabas iyon mula sa kanyang katawan
  rationale: Ang יָצָא ay “lumabas,” at ang גֵּוָה ay katawan o torso. Ang “katawan” ang likas at malinaw na katumbas sa makabagong Filipino.
- source_word: וּבָרָק
  choice: ang kumikislap na dulo
  rationale: Literal itong “kidlat” o kislap, ngunit sa konteksto ng sandatang hinuhugot sa katawan ay malamang na tumutukoy sa kumikislap na talim o dulo. Pinananatili ng salin ang matingkad na larawan nang hindi labis na nililinaw ang uri ng sandata.
- source_word: מִמְּרֹרָתוֹ
  choice: mula sa kanyang apdo
  rationale: Sa kontekstong anatomikal, tumutukoy ito sa apdo o bahagi ng katawang kinalalagyan nito. Ang “apdo” ay maikli, visceral, at karaniwang nauunawaan.
- source_word: יַהֲלֹךְ עָלָיו אֵמִים
  choice: nilukob siya ng mga sindak
  rationale: Ang parirala ay naglalarawan ng mga sindak na dumarating o sumasakop sa kanya. Ang “nilukob” ay natural sa Filipino at pinananatili ng “mga sindak” ang maramihang anyo at tindi.
