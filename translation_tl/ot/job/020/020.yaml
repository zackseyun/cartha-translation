translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang masidhing larawang ‘tiyan’ at ang ambiguwidad kung ang minimithing mga bagay ang paraan sana ng pagtakas o pagliligtas sa sarili.
