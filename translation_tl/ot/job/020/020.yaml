  text: For he knew no quiet in his belly[a]; with his desirable things he will not escape.
translation:
  language: tl
  text: Sapagkat hindi siya nakaranas ng kapanatagan sa kanyang tiyan[a]; sa pamamagitan ng mga bagay na minimithi niya, hindi siya makatatakas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Sapagkat hindi siya nakadama ng ginhawa sa kanyang sikmura; hindi niya maililigtas ang sarili sa pamamagitan ng mga bagay na kinagigiliwan niya.”
    reason: Ipinapakita ang mga posibleng kahulugan ng שָׁלֵו, בטן, בַּחֲמוּדוֹ, at ang reflexive na diwa ng ימלט nang hindi pinipili nang tahasan ang isa lamang.
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Nagpapakilala ito ng dahilan o paliwanag sa naunang hatol at likas ang ganitong daloy sa makabagong Tagalog.
- source_word: לֹא יָדַע
  choice: hindi siya nakaranas
  rationale: Literal itong ‘hindi niya nalaman,’ ngunit kaugnay ng kapanatagan, mas natural sa Tagalog ang ‘hindi nakaranas’ habang pinananatili ang diwang hindi niya nakilala o tinamasa ang gayong kalagayan.
- source_word: שָׁלֵו
  choice: kapanatagan
  rationale: Saklaw nito ang katahimikan, kaginhawahan, at panloob na pagiging payapa nang hindi nililimitahan ang salita sa isang tiyak na pakahulugan.
- source_word: בְּבִטְנוֹ
  choice: sa kanyang tiyan
  rationale: Pinananatili ang kongkretong larawan ng בטן (‘tiyan’ o ‘mga laman-loob’), na mahalaga sa konteksto ng walang kabusugang pagnanasa.
- source_word: בַּחֲמוּדוֹ
  choice: sa pamamagitan ng mga bagay na minimithi niya
  rationale: Ang salitang mula sa חמד ay tumutukoy sa bagay na ninanais o itinuturing na mahalaga. Ginamit ang pangmaramihang kolektibo sa Tagalog at pinanatili ang posibleng instrumental na gamit ng בְּ.
- source_word: לֹא יְמַלֵּט
  choice: hindi siya makatatakas
  rationale: Ang Piel ng מלט ay maaaring mangahulugang tumakas o magligtas. Ang ‘hindi makatatakas’ ay natural at pinananatili ang malawak na diwa ng hindi niya maililigtas ang sarili mula sa hatol.
