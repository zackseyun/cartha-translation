  text: עַ֭צְמוֹתָי/ו מָלְא֣וּ עלומ/ו וְ֝/עִמּ֗/וֹ עַל עָפָ֥ר תִּשְׁכָּֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/020/011.yaml
  text: His bones are full of his youthful vigor[a], but it will lie down with him in the dust.
translation:
  language: tl
  text: Ang kanyang mga buto ay punô ng sigla ng kanyang kabataan[a], ngunit iyon ay mahihimlay na kasama niya sa alabok.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “punô ng kanyang kabataan”; ang salitang Hebreo ay maaaring tumukoy sa kabataan mismo o sa siglang kaugnay nito.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַצְמוֹתָיו
  choice: ang kanyang mga buto
  rationale: Pinananatili ang kongkretong larawan ng Hebreong עֶצֶם sa halip na gawing mas malabong “katawan” o “buong pagkatao.”
- source_word: מָלְאוּ
  choice: ay punô ng
  rationale: Natural na Filipino para sa Qal perfect na may maramihang simuno; sa tulang konteksto, inilalarawan nito ang kalagayang taglay ng kanyang mga buto nang hindi kailangang tahasang markahan ang panahunan.
- source_word: עֲלוּמָיו
  choice: sigla ng kanyang kabataan
  rationale: Naipahahayag ang kabataan at ang lakas na kaugnay nito, habang pinananatili sa talababa ang leksikal na posibilidad na simpleng “kabataan” ang tinutukoy.
- source_word: וְעִמּוֹ
  choice: ngunit iyon ay … kasama niya
  rationale: Ang וְ ay angkop na ipinahayag bilang panalungat na “ngunit” sa diwa ng biglang paglipat mula sa sigla tungo sa kamatayan; ang עִמּוֹ ay tuwirang “kasama niya.”
- source_word: עַל־עָפָר
  choice: sa alabok
  rationale: Natural at marangal na Filipino na nagpapanatili sa larawang biblikal ng kamatayan at alabok, nang hindi tahasang ginagawang “libingan.”
- source_word: תִּשְׁכָּב
  choice: mahihimlay
  rationale: Ang Qal imperfect ay ipinahayag na panghinaharap; ang “mahihimlay” ay natural sa konteksto ng kamatayan at tumutugma sa pambabaeng isahang pandiwa na tumutukoy sa naunang abstraktong kabataan o sigla.
theological_decisions:
- issue: Ang tinutukoy ng pambabaeng isahang תִּשְׁכָּב
  choice: “iyon,” na tumutukoy sa sigla o kabataan
  alternative: Ang tao mismo ang mahihimlay
  rationale: 'Pinananatili ng isahang panghalip ang gramatikal at makatang tensiyon ng Hebreo: ang kabataan o siglang pumuno sa kanyang mga buto ay kasabay niyang hahantong sa alabok.'
translation_notes:
  register: Modernong Filipino na dignified at madaling maunawaan. Ginamit ang “punô,” “sigla,” at “mahihimlay” upang mapanatili ang masinsing larawang patula nang hindi maging lipas o teknikal ang wika.
