  text: Then Zophar the Naamathite answered and said:[a]
translation:
  language: tl
  text: Pagkatapos, sumagot si Zofar na Naamatita at sinabi:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “At sumagot si Zofar na Naamatita at sinabi.”
