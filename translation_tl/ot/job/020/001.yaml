lexical_decisions:
- source_word: וַיַּעַן
  choice: sumagot
  rationale: Karaniwang ipinahihiwatig ng ענה sa pormulang pasalaysay ng isang pag-uusap ang pagsagot; malinaw na tumutugon si Zofar sa naunang sinabi ni Job.
- source_word: צֹפַר
  choice: Zofar
  rationale: Isinalin sa baybay na madaling basahin sa Filipino ang pangalang Hebreo.
- source_word: הַנַּעֲמָתִי
  choice: na Naamita
  rationale: Ang pang-uring gentiliko na may pantukoy ay nag-uugnay kay Zofar sa Naama, bilang lugar na pinagmulan o kaugnayang pangkat; natural sa Filipino ang anyong “Naamita.”
- source_word: וַיֹּאמַר
  choice: at sinabi
  rationale: Pinanatili ang karaniwang kahulugan ng אמר at ang dobleng pormulang Hebreo na “sumagot ... at sinabi,” sa halip na alisin ito bilang kalabisan.
- source_word: וַ
  choice: Pagkatapos
  rationale: Ang panimulang waw ay nagpapatuloy sa salaysay. Ipinahahayag ng “Pagkatapos” ang pagkakasunod-sunod sa natural na modernong Filipino, habang kinikilala sa talababa ang mas literal na “At.”
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang tradisyonal na pormulang “sumagot ... at sinabi” upang maipakita ang estruktura ng Hebreo, at ginamit ang “Naamita” bilang natural na katawagang gentiliko sa Filipino.
