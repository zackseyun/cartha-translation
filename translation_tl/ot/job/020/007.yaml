  yaml_path: translation/ot/job/020/007.yaml
  text: Like his own dung[a], he will perish forever; those who saw him will say, ‘Where is he?’
translation:
  language: tl
  text: Gaya ng sarili niyang dumi[a], mawawala siya magpakailanman; sasabihin ng mga nakakita sa kanya, “Nasaan siya?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Gaya ng sarili niyang tae.” Sadyang mapanghamak ang larawang ginamit sa Hebreo.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּגֶלֲלוֹ
  choice: Gaya ng sarili niyang dumi
  rationale: Ang גֶּלֶל ay tumutukoy sa dumi o tae. Pinananatili ng “dumi” ang sadyang mapanghamak na larawan nang hindi nagiging labis na teknikal o di-likas sa makabagong Tagalog; malinaw na ipinapahayag ng “sarili niyang” ang hulaping paari.
- source_word: לָנֶצַח
  choice: magpakailanman
  rationale: Ipinahahayag nito ang tuloy-tuloy at ganap na tagal ng pagkawala o kapahamakan sa kontekstong patula.
- source_word: יֹאבֵד
  choice: mapapahamak siya
  rationale: Ang אבד ay may diwang mapahamak, malipol, o mawala. Ang “mapapahamak” ay natural at marangal sa Tagalog at pinananatili ang masidhing diwa ng pagkawasak nang hindi nililimitahan sa pisikal na kamatayan lamang.
- source_word: רֹאָיו
  choice: mga nakakita sa kanya
  rationale: 'Tuwirang ipinapahayag nito ang participle na may hulaping tumutukoy sa kanya: ang mga taong dating nakakita o nakakilala sa kanyang presensya.'
- source_word: יֹאמְרוּ
  choice: sasabihin
  rationale: Ang אמר ay karaniwang “sabihin.” Ang kasunod na tanong ang nagpapakitang ang sinabi ay patanong, kaya hindi kailangang gawing “itatanong.”
- source_word: אַיּוֹ
  choice: Nasaan siya?
  rationale: Ito ang natural at tuwirang katumbas ng lokatibong tanong na may panghalip; hindi dinaragdagan ng interpretibong “ngayon” o “saan siya nagpunta.”
theological_decisions: []
translation_notes:
  register: Makabagong Filipino Tagalog na natural at dignified, habang pinananatili ang marahas at mapanghamak na paghahambing ng tulang Hebreo. Ginamit ang “dumi” sa pangunahing teksto bilang malinaw ngunit hindi labis na kolokyal; inilagay sa talababa ang mas tahasang “tae.”
