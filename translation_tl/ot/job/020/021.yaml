  text: Nothing was left for him to devour[b][a]; therefore his prosperity will not endure.
translation:
  language: tl
  text: Walang nakaligtas sa kanyang paglamon[a]; kaya hindi magtatagal ang kanyang kasaganaan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mas literal, “Walang nalabi para sa kanyang pagkain.” Maaari rin itong unawain bilang, “Walang natira na makain niya.”
    reason: lexical_alternative
  - marker: b
    text: Mahirap tiyakin ang kahulugan ng pandiwang isinaling “magtatagal.” Maaari rin itong isaling “mananatili,” o, bagaman mas malamang na hindi rito, “uunlad.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵין שָׂרִיד
  choice: Walang natira
  rationale: Ang אֵין ay eksistensiyal na pagtanggi, at ang שָׂרִיד ay “nalabi” o “nakaligtas.” Sa konteksto, ipinahihiwatig ng parirala na wala siyang iniwang anuman.
- source_word: לְאָכְלוֹ
  choice: sa kanyang nilamon
  rationale: Mula sa אכל, “kumain.” Inilalarawan dito ang ganap at sakim na pag-ubos; natural sa Tagalog ang “sa kanyang nilamon” at malinaw nitong iniuugnay ang natira sa kanyang kinain o inubos.
- source_word: עַל כֵּן
  choice: kaya
  rationale: Karaniwang panandang naghahayag ng bunga o konklusyon; mas natural sa kasalukuyang Tagalog ang “kaya.”
- source_word: לֹא יָחִיל
  choice: hindi magtatagal
  rationale: Mahirap tiyakin ang eksaktong diwa ng pandiwa, ngunit sa pagsama nito sa טוּבוֹ, malamang na tumutukoy ito sa hindi pagpapatuloy o hindi pananatili ng kasaganaan.
- source_word: טוּבוֹ
  choice: ang kanyang kasaganaan
  rationale: Literal itong tumutukoy sa kanyang “mabuti” o “mabubuting bagay,” ngunit sa konteksto ng kayamanan at paghatol, ang “kasaganaan” ang malinaw at likas na katumbas.
theological_decisions: []
translation_notes:
  register: Makabago at dignified na Filipino ang ginamit. Pinili ang “nilamon” upang maipahiwatig ang sakim at ganap na pag-ubos nang hindi nagiging masyadong teknikal; pinanatili sa talababa ang mas literal na anyo at ang leksikal na kalabuan ng pandiwa sa ikalawang sugnay.
