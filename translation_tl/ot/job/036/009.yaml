translation:
  language: tl
  text: At ipinababatid niya sa kanila ang kanilang mga gawa at mga pagsuway—na nagmataas sila[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas literal, “na nagpakalakas sila” o “na naging malakas sila.” Sa konteksto, malamang na tumutukoy ito sa pagmamalaki o pagtataas ng sarili.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגֵּד
  choice: Pagkatapos ay ipinahahayag niya
  rationale: Ang Hiphil ng נגד ay nangangahulugang ‘ipabatid’ o ‘ipahayag.’ Likas sa Filipino ang ‘ipinahahayag,’ at ipinakikita ng ‘pagkatapos’ ang pagsulong ng kaisipan sa konteksto.
- source_word: לָהֶם
  choice: sa kanila
  rationale: Tuwirang katumbas ng pang-ukol at panghalip na tumutukoy sa mga pinagsasabihan.
- source_word: פָּעֳלָם
  choice: ang kanilang mga gawa
  rationale: Tumutukoy ito sa kanilang mga ginawa, lalo na sa moral na diwa dahil katambal nito ang ‘mga pagsuway.’
- source_word: וּפִשְׁעֵיהֶם
  choice: at mga pagsuway
  rationale: Ang פשע ay maaaring mangahulugang paghihimagsik o paglabag sa nararapat na awtoridad. Natural at marangal sa Filipino ang ‘mga pagsuway’ habang pinananatili ang bigat na moral.
- source_word: כִּי
  choice: na
  rationale: 'Ipinakikilala nito ang nilalaman o paliwanag ng ipinahahayag: nagmataas sila. Posible rin ang panandang sanhi, ngunit mas angkop dito ang nilalamang sugnay.'
- source_word: יִתְגַּבָּרוּ
  choice: nagmataas sila
  rationale: Literal itong may ideya ng pagpapalakas o pagpapakadakila sa sarili. Sa kontekstong moral, malinaw at natural na naihahayag ng ‘nagmataas’ ang mapagmataas na paggawi nang hindi labis na nagpapakahulugan.
theological_decisions:
- issue: Moral na diwa ng יִתְגַּבָּרוּ
  choice: nagmataas sila
  alternative: naging malakas sila; nanaig sila; nagpakadakila sila
  rationale: Dahil kaugnay ito ng kanilang mga pagsuway, malamang na tumutukoy ang pandiwa sa mapagmataas na pagpapalakas o pagpapakadakila sa sarili, hindi sa lakas lamang. Pinananatili sa talababa ang mas literal na posibilidad.
translation_notes:
  register: Makabagong Filipino na dignified at madaling maunawaan. Ginamit ang ‘ipinahahayag,’ ‘mga gawa,’ at ‘mga pagsuway’ upang mapanatili ang pormal na bigat ng talata; inilagay ang tunay na leksikal na kalabuan ng panghuling pandiwa sa talababa.
