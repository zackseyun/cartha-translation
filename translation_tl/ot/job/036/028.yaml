  text: na ibinubuhos ng mga ulap; saganang pumapatak sa sangkatauhan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲשֶׁר
  choice: na
  rationale: Pinananatili ang ugnayang pasakop sa naunang taludtod nang hindi nagdaragdag ng bagong nilalaman.
- source_word: יִזְּלוּ
  choice: ibinubuhos
  rationale: Sa konteksto ng ulan, likas na ipinahihiwatig nito ang pagdaloy pababa mula sa mga ulap.
- source_word: שְׁחָקִים
  choice: mga ulap
  rationale: Bagaman maaari rin itong tumukoy sa kalangitan, ang mga ulap ang pinakamalinaw na kahulugan sa larawang patula tungkol sa ulan.
- source_word: יִרְעֲפוּ
  choice: ipinapaulan
  rationale: Ipinahahayag ang pagpapatak o pagpapaambon mula sa itaas sa natural na modernong Tagalog, nang hindi ipinapalagay na marahas ang buhos.
- source_word: עֲלֵי
  choice: sa
  rationale: Natural na katumbas para sa pagbagsak ng ulan sa ibabaw ng tao.
- source_word: אָדָם
  choice: tao
  rationale: Pinananatili ang pangkalahatang isahan ng Hebreo; sa Tagalog, ang “tao” ay likas na maaaring tumukoy sa sangkatauhan nang hindi nililimitahan sa kasariang lalaki.
- source_word: רָב
  choice: sagana
  rationale: Ginagamit na pang-abay upang ipakita ang masaganang dami ng ulan.
theological_decisions:
- issue: Pangkalahatang kahulugan ng אָדָם
  choice: tao
  alternative: sangkatauhan / mga tao
  rationale: Ang isahang “tao” ay malapit sa anyong Hebreo at maaari ring gamitin nang pangkalahatan sa Tagalog. Nililinaw ng talababa ang kolektibong saklaw nito nang hindi ginagawang tahasang maramihan ang pangunahing teksto.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog. Ang panghalip na “ito” ay tumutukoy sa tubig o ulan mula sa naunang taludtod at ginagawang natural ang daloy ng pangungusap sa Tagalog.
