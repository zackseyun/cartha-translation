  yaml_path: translation/ot/job/036/021.yaml
  text: Take care[a]; do not turn to iniquity[b], for you have chosen this rather than affliction.
translation:
  language: tl
  text: Mag-ingat ka; huwag kang bumaling sa kasamaan[a], sapagkat ito ang pinili mo kaysa sa pagdurusa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Hebreo ay maaari ring isaling “kabuktutan,” “kasamaan,” o marahil “kapahamakan” o “pighati.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “sa halip ng pagdurusa” o “kaysa sa paghihirap.” Ang diwa ay babala na huwag piliin ang paggawa ng masama kaysa sa pagdurusang dinaranas.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִשָּׁמֶר
  choice: Mag-ingat ka
  rationale: Ang Niphal imperative ng שׁמר ay isang tuwirang babala. Natural at malinaw sa makabagong Filipino ang “Mag-ingat ka.”
- source_word: אַל תֵּפֶן
  choice: huwag kang bumaling
  rationale: Pinananatili nito ang larawan ng pagharap o pagtuon sa isang bagay at ang lakas ng pagbabawal.
- source_word: אֶל אָוֶן
  choice: sa kasamaan
  rationale: Maaaring tumukoy ang אָוֶן sa kasamaan, kabuktutan, o kaguluhan/paghihirap. Sa konteksto ng moral na babala, malinaw at malawak ang “kasamaan,” habang inilalagay sa talababa ang tunay na leksikal na lawak.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikita nito na ang kasunod na sugnay ang dahilan ng babala, sa isang marangal ngunit karaniwang rehistro.
- source_word: עַל זֶה
  choice: ito
  rationale: Ang demonstratibo ay tumutukoy sa nabanggit na kasamaan; natural sa Filipino na ilagay ang “ito” bilang layon ng “pinili.”
- source_word: בָּחַרְתָּ
  choice: pinili mo
  rationale: Tumpak na inilalarawan ang ikalawang panauhang panlalaking isahan na perfect at natural ang anyo sa Filipino.
- source_word: מֵעֹנִי
  choice: kaysa pagdurusa
  rationale: 'Sa konteksto ni Job, ang עֹנִי ay tumutukoy sa dinaranas na hirap o pagdurusa. Ang prefixed מ־ ay binasa bilang paghahambing: pinili ang isa kaysa sa isa pa.'
theological_decisions:
- issue: Ang kaugnayan ng “kasamaan” at “pagdurusa” sa pagpili ni Job
  choice: 'Panatilihin ang tahasang paghahambing: “ito ang pinili mo kaysa pagdurusa.”'
  alternative: “sapagkat dahil dito ay pinili mo ang pagdurusa” o iba pang pagbasa sa ugnayan ng mga parirala
  rationale: Pinakamalamang na ipinapayo ni Elihu kay Job na huwag piliin ang paggawa ng masama bilang tugon sa kanyang pagdurusa. Hindi dinaragdagan ng salin ang pahayag upang tukuyin kung anong partikular na kasalanan ang ipinapalagay.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang pang-isahang “ka/mo” sapagkat ikalawang panauhang panlalaking isahan ang Hebreo. Iniwasan ang mas arkaikong “kalikuan” sa pangunahing teksto, ngunit pinanatili sa talababa ang leksikal na lawak ng אָוֶן.
