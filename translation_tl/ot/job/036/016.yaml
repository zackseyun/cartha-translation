base_translation:
  language: en
  yaml_path: translation/ot/job/036/016.yaml
  text: Indeed[a], he lured you out of the mouth of distress into a broad place with no constraint beneath it[c][b], and the setting of your table was full of richness.
translation:
  language: tl
  text: Inakit ka rin niya mula sa bunganga ng kagipitan[a] tungo sa maluwang na lugar na walang anumang pagsisikip sa ilalim nito[b]; at ang nakahain sa iyong mesa ay punô ng masaganang pagkain.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mula sa mga panga ng paghihirap” o “mula sa bunganga ng makipot na lugar.” Pinagsasama ng Hebreo ang larawan ng paghihirap at kasikipan.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “tungo sa maluwang na lugar na walang paghihigpit sa ilalim nito.” Hindi tiyak ang kahulugan ng salitang Hebreo na isinaling “pagsisikip.”
    reason: textual_or_lexical_difficulty
  - marker: c
    text: Sa literal, “punô ng katabaan,” isang larawan ng sagana at masarap na pagkain.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַף
  choice: At siya rin
  rationale: Pinananatili ang pandagdag at nagpapatingkad na diwa ng parirala, habang natural na inuugnay ito sa naunang pahayag sa modernong Tagalog.
- source_word: הֲסִיתְךָ
  choice: ang humihikayat sa iyo na lumabas
  rationale: Ang pandiwa ay maaaring mangahulugang humikayat, umakit, o mag-udyok. Ang 'humihikayat ... na lumabas' ay akma sa larawan ng paglabas mula sa kagipitan nang hindi ipinapasok ang karaniwang negatibong diwa ng 'nanunulsol.'
- source_word: מִפִּי צָר
  choice: mula sa bunganga ng kagipitan
  rationale: Pinananatili ang konkretong larawang 'bunganga' at ang diwa ng צַר bilang kagipitan o makipot na kalagayan, na ikinokontra sa kasunod na maluwang na lugar.
- source_word: רַחַב
  choice: maluwang na lugar
  rationale: Malinaw at likas na Tagalog para sa lawak o kaluwagan, habang pinananatili ang spatial na metapora.
- source_word: לֹא מוּצָק תַּחְתֶּיהָ
  choice: na walang anumang pagsisikip sa ilalim nito
  rationale: Mahirap ang מוּצָק sa kontekstong ito. Ang salin ay nagpapanatili sa literal na 'sa ilalim nito' at sa malamang na pagsalungat sa pagkakakulong o kasikipan.
- source_word: וְנַחַת שֻׁלְחָנְךָ
  choice: at ang nakahain sa iyong mesa
  rationale: Ang נַחַת ay bihira at hindi tiyak; sa kaugnayan nito sa mesa, malamang na tumutukoy ito sa inilagay o inihain doon. Ang 'nakahain' ay natural ngunit hindi labis na nagpapaliwanag.
- source_word: מָלֵא דָשֶׁן
  choice: ay punô ng masaganang pagkain
  rationale: Ang דָּשֶׁן ay literal na katabaan at nagpapahiwatig ng masustansiya o saganang pagkain. Inihahatid ng parirala ang larawan sa malinaw na makabagong Tagalog.
theological_decisions:
- issue: Hindi tahasang pinangalanang simuno ng הֲסִיתְךָ
  choice: Gamitin ang panghalip na 'siya' at huwag tahasang idagdag ang 'Diyos.'
  alternative: Isalin bilang 'hinihikayat ka ng Diyos.'
  rationale: Ipinahihiwatig ng konteksto na Diyos ang tinutukoy, ngunit walang tahasang pangngalan sa Hebreo. Pinananatili ng panghalip ang anyo at bahagyang di-tiyak na pagtukoy ng pinagmulan.
- issue: Larawan ng kagipitan at kaluwagan
  choice: Panatilihin ang 'bunganga,' 'maluwang na lugar,' at 'sa ilalim nito.'
  alternative: Ipaliwanag bilang 'inililigtas ka niya mula sa paghihirap tungo sa kalayaan.'
  rationale: Mahalaga sa tulang Hebreo ang paghaharap ng masikip na kagipitan at maluwang na espasyo; hindi ito dapat gawing purong abstraktong pahayag.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang makapangyarihang spatial na mga metapora ng Hebreong tula. Ginamit ang 'mesa' sa halip na mas pormal na 'hapag' para sa likas na kasalukuyang wika, at 'punô' bilang wastong anyong may tuldik upang iwasang mabasa bilang puno (tree).
