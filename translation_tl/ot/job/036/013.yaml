base_translation:
  language: en
  yaml_path: translation/ot/job/036/013.yaml
  text: But the godless in heart store up anger[b][a]; they do not cry for help when he binds them.
translation:
  language: tl
  text: Ngunit ang mga taong sa puso'y walang takot sa Diyos[a] ay nagkikimkim ng galit; hindi sila humihingi ng tulong kapag sila'y ginagapos niya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “ang mga mapagkunwari sa puso” o “ang mga taong walang-galang sa Diyos.”
    reason: lexical_alternative
  - marker: b
    text: O “dahil ginagapos niya sila.” Ang salitang Hebreo ay maaari ring magpahiwatig ng sanhi sa halip na panahon.
    reason: alternative_reading
lexical_decisions:
- source_word: חַנְפֵי לֵב
  choice: ang mga walang takot sa Diyos sa puso
  rationale: Ang חנף ay maaaring tumukoy sa taong di-maka-Diyos, lapastangan, o mapagkunwari. Sa Job, higit na nangingibabaw ang kawalan ng paggalang sa Diyos kaysa simpleng pagkukunwari; pinananatili ng “sa puso” ang diin sa panloob na pagkatao.
- source_word: יָשִׂימוּ אָף
  choice: nagkikimkim ng galit
  rationale: Ang literal na “naglalagay ng galit” ay hindi likas sa Tagalog. Ipinahahayag ng “nagkikimkim” ang pagpapanatili at pag-iipon ng galit sa kalooban, at hindi nito ipinapalagay na poot ng Diyos ang אָף.
- source_word: לֹא יְשַׁוְּעוּ
  choice: hindi sila humihingi ng tulong
  rationale: Ang Piel ng שׁוע ay karaniwang nangangahulugang sumigaw o dumaing upang humingi ng tulong. Likas at malinaw sa modernong Tagalog ang napiling parirala.
- source_word: כִּי
  choice: kapag
  rationale: 'Bagaman madalas na sanhi ang ipinahihiwatig ng כִּי, ang temporal na “kapag” ay angkop sa daloy: hindi sila humihingi ng tulong sa panahon ng paggapos o pagdadalamhati. Inilalahad sa talababa ang posibleng pagbasa na sanhi.'
- source_word: אֲסָרָם
  choice: iginagapos niya sila
  rationale: Ang אָסַר ay maaaring mangahulugang gumapos, magtali, o magbilanggo. Pinananatili ng “iginagapos” ang larawan at ang pang-isahang simuno, na nauunawaang Diyos ayon sa konteksto nang hindi tahasang ipinapasok ang pangalang iyon.
theological_decisions:
- issue: Tinutukoy ng pang-isahang simuno sa אֲסָרָם
  choice: Pinanatili ang “niya,” na tumutukoy sa Diyos ayon sa konteksto.
  alternative: Tahasan itong isaling “iginagapos sila ng Diyos.”
  rationale: Panghalip lamang ang ipinahihiwatig ng Hebreo. Ang pagpapanatili sa “niya” ay tapat sa anyo ng teksto at hindi labis na nilulutas ang reperente, bagaman malinaw ito sa mas malawak na konteksto.
- issue: Kung temporal o sanhi ang כִּי
  choice: 'Temporal: “kapag iginagapos niya sila.”'
  alternative: 'Sanhi: “dahil iginagapos niya sila” o “sapagkat iginagapos niya sila.”'
  rationale: Parehong posible sa Hebreo. Mas maayos sa agarang daloy ang temporal na pagbasa, ngunit pinananatili sa talababa ang tunay na ambiguwidad.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “walang takot sa Diyos” upang maipahayag ang panloob na kawalang-galang sa Diyos; iniwasan ang mas makitid na “mapagkunwari” sa pangunahing teksto. Inilagay ang bawat pananda ng talababa sa mismong teksto.
