  text: I will bring my knowledge from afar[b][a], and to my Maker I will ascribe righteousness.
translation:
  language: tl
  text: 'Dadalhin ko mula sa malayo ang aking kaalaman,

    at iuukol ko sa aking Manlilikha ang katuwiran.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “at ituturing kong makatarungan ang aking Manlilikha.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶשָּׂא
  choice: Dadalhin ko
  rationale: Ang נׂשא ay literal na ‘buhatin/dalhin.’ Kasama ng ‘aking kaalaman’ at ‘mula sa malayo,’ natural na ipinahihiwatig nito ang pagdadala o pagkuha ng kaalaman mula sa malayong pinagmulan.
- source_word: דֵעִי
  choice: ang aking kaalaman
  rationale: Tuwirang katumbas ito ng pangngalang mula sa דעת at pinananatili ang pahayag ni Elihu na magsasalita siya batay sa nalalaman niya.
- source_word: לְמֵרָחוֹק
  choice: mula sa malayo
  rationale: Bagaman ang לְ ay karaniwang ‘sa/patungo sa,’ sa pariralang ito at kaugnay ng אֶשָּׂא, ang diwa ay kaalamang dinadala mula sa malayo. Pinananatili ng salin ang matalinghagang distansiya nang hindi tinutukoy kung heograpikal o intelektuwal ito.
- source_word: וּלְפֹעֲלִי
  choice: at sa aking Maylikha
  rationale: Ang participle פֹעֵל na may hulaping unang panauhan ay literal na ‘ang gumawa sa akin.’ Ang ‘aking Maylikha’ ay natural, marangal, at malinaw na tumutukoy sa Diyos.
- source_word: אֶתֵּן
  choice: iuukol ko
  rationale: Literal itong ‘ibibigay ko,’ ngunit kapag katuwiran ang layon at ang Maylikha ang pinag-uukulan, ang ‘iuukol’ ay natural na nagpapahayag ng pagkilala o pag-uugnay ng katangiang iyon sa Diyos.
- source_word: צֶדֶק
  choice: katuwiran
  rationale: Saklaw ng צֶדֶק ang moral na katuwiran at katarungan. Ang ‘katuwiran’ ay nagpapanatili ng mas malawak na pahayag tungkol sa pagiging matuwid ng Maylikha, habang inilalahad sa talababa ang ‘katarungan’ bilang tunay na alternatibo.
theological_decisions:
- issue: Kahulugan ng צֶדֶק bilang iniuukol sa Diyos
  choice: katuwiran
  alternative: katarungan
  rationale: Maaaring tumukoy ang salitang Hebreo kapwa sa moral na katuwiran at sa makatarungang paghatol. Pinili ang ‘katuwiran’ upang mapanatili ang mas malawak na saklaw ng pahayag, ngunit hindi inalis ang posibleng diin sa katarungan.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang ‘Maylikha’ bilang malinaw at magalang na katawagan sa Diyos. Pinanatili ang bahagyang matalinghagang pahayag na ‘mula sa malayo’ at ang teolohikal na lawak ng צֶדֶק.
