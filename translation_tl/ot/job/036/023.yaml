translation:
  language: tl
  text: Sino ang nagtakda para sa kanya ng landas na kanyang tatahakin?[a] O sino ang nagsabi, “Gumawa ka ng mali”?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Sino ang nag-atas sa kanya ng landas na kanyang tatahakin?” o “Sino ang nagparatang sa kanya tungkol sa kanyang landas?” Malawak ang kahulugan ng pandiwang Hebreo: maaari itong mangahulugang magtakda, mag-atas, magreseta, o magparatang.'
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring isalin: “Gumawa ka ng kawalang-katarungan.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי
  choice: Sino
  rationale: Pananong na panghalip na nagpapakilala ng retorikal na tanong.
- source_word: פָקַד
  choice: nagtakda
  rationale: Saklaw ng pandiwa ang paghirang, pag-aatas, o pagtatakda. Ang “nagtakda” ay likas sa Filipino at ipinahihiwatig na walang sinumang makapagtatalaga ng landas ng Diyos.
- source_word: עָלָיו
  choice: sa kanya
  rationale: Kasama ng פקד, maaaring tumukoy sa pagtatakda o pag-aatas para sa isang tao. Pinananatili ng “sa kanya” ang ugnayan nang hindi labis na nililinaw ang sintaks.
- source_word: דַּרְכּוֹ
  choice: kanyang landas
  rationale: Ang דֶּרֶךְ ay maaaring literal na landas o metaporikal na paraan at takbo ng pagkilos; napapanatili ng “landas” ang dalawang posibilidad.
- source_word: וּמִי
  choice: O sino
  rationale: Nag-uugnay ito ng ikalawang retorikal na tanong bilang alternatibong hamon.
- source_word: אָמַר
  choice: nagsabi
  rationale: Ang ganap na anyo ng pandiwa ay natural na naihahayag sa Filipino bilang “nagsabi” sa retorikal na tanong.
- source_word: פָּעַלְתָּ
  choice: Gumawa ka
  rationale: Tuwirang ipinapahayag ang ikalawang panauhang pandiwa, na sa konteksto ay pagtutuwid o pagpaparatang sa Diyos.
- source_word: עַוְלָה
  choice: mali
  rationale: Ang salita ay tumutukoy sa kamalian, kawalang-katarungan, o kasamaan. Ang “mali” ay malinaw at malawak, habang inilalagay sa talababa ang mas tiyak na alternatibo.
theological_decisions:
- issue: Tinutukoy ng mga hulaping panlalaki at ng pandiwang nasa ikalawang panauhan
  choice: 'Sa konteksto, ang tinutukoy ay ang Diyos: walang nagtatakda ng kanyang landas at walang makapagpaparatang sa kanya ng paggawa ng mali.'
  alternative: Maaaring basahin nang mas pangkalahatan bilang pagtukoy sa isang makapangyarihang pinuno o tao.
  rationale: Itinatanghal ni Elihu sa Job 36:22–23 ang kadakilaan at katarungan ng Diyos. Hindi idinagdag ang pangalang “Diyos” sa mismong talata upang mapanatili ang mga panghalip ng Hebreo at ang kontekstuwal na pagkakakilanlan ng tinutukoy.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang dalawang retorikal na tanong, ang metaporang “landas,” at ang di-tiyak na lawak ng salitang tumutukoy sa mali o kawalang-katarungan.
