    rationale: Bagaman may kaugnayan ang ugat sa pagsala o pagpino, ang parirala ay hindi malinaw na Filipino para sa pagbagsak o pagdistila ng ulan. Ang “tumutulo ... bilang ulan” ay nagpapanatili ng poetikong larawan nang hindi nagdaragdag ng prosesong teknikal.
