  text: הֶן אֵ֣ל כַּ֭בִּיר וְ/לֹ֣א יִמְאָ֑ס כַּ֝בִּ֗יר כֹּ֣חַֽ לֵֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/036/005.yaml
  text: Behold[a], God is mighty and does not despise[b]; he is mighty in strength of heart.
translation:
  language: tl
  text: Tunay nga, makapangyarihan ang Diyos at hindi siya humahamak[a]; makapangyarihan siya sa lakas ng puso.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “hindi nagtatakwil” o “hindi tumatanggi.” Walang tahasang layon ang pandiwa sa Hebreo.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “lakas ng puso.” Ang “puso” rito ay maaaring tumukoy sa isip, pang-unawa, o katatagan ng layunin.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶן
  choice: Tunay nga
  rationale: Nagsisimula ito ng isang mariing pahayag. Likas sa makabagong Filipino ang “Tunay nga” at napapanatili nito ang diin at marangal na himig ng tulang Hebreo.
- source_word: אֵל
  choice: Diyos
  rationale: Karaniwang katawagang patula ito para sa Diyos; hindi kailangang palawakin bilang isang natatanging titulo.
- source_word: כַּבִּיר
  choice: makapangyarihan
  rationale: Ipinahihiwatig ng salita ang kadakilaan at kapangyarihan. Inulit ang iisang salin upang mapanatili ang pag-uulit sa Hebreo.
- source_word: וְלֹא יִמְאָס
  choice: at hindi siya humahamak
  rationale: Maaaring mangahulugan ang pandiwa ng humamak, tumanggi, o magtakwil. Hindi nilagyan ng tahasang layon sa salin sapagkat wala ring nakasaad na layon sa Hebreo.
- source_word: כֹּחַ לֵב
  choice: lakas ng puso
  rationale: Pinananatili ang literal na larawan ng Hebreo. Ang “puso” ay maaaring tumukoy sa isip, pang-unawa, paninindigan, o kalooban, kaya hindi ito nilimitahan sa iisang pakahulugan.
theological_decisions:
- issue: Hindi tahasang layon ng pandiwang יִמְאָס
  choice: hindi siya humahamak
  alternative: hindi siya humahamak kaninuman / hindi siya nagtatakwil
  rationale: Hindi tinutukoy ng Hebreo kung sino o ano ang hindi hinahamak o itinatakwil ng Diyos. Ang hindi pagdaragdag ng “kaninuman” ay nagpapanatili sa tunay na kalabuan ng teksto.
- issue: Kahulugan ng “lakas ng puso”
  choice: makapangyarihan siya sa lakas ng puso
  alternative: makapangyarihan siya sa pang-unawa / matatag siya sa layunin
  rationale: Maikli at maraming maaaring ipakahulugan ang pariralang Hebreo. Pinananatili ng “puso” ang talinghaga at hindi nito ipinipilit na pang-unawa o katatagan ng layunin lamang ang tinutukoy.
translation_notes:
  register: Makabago ngunit marangal na Filipino ang ginamit. Pinanatili ang patulang pag-uulit ng “makapangyarihan” at ang larawang “lakas ng puso,” habang iniwasang magdagdag ng layon na wala sa Hebreo.
