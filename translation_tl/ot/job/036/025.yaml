translation:
  language: tl
  text: 'Nakita ito ng lahat ng tao[a];

    ang tao ay tumitingin mula sa malayo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Nakita siya ng lahat ng tao.” Panlalaking isahan ang panghalip sa Hebreo at maaaring unawain bilang personal; ngunit mas malamang sa konteksto na tumutukoy ito sa gawa o ginawa ng Diyos.
    reason: alternative_reading
lexical_decisions:
- source_word: כָּל אָדָם
  choice: lahat ng tao
  rationale: Ang כָּל na kasama ng kolektibong אָדָם ay tumutukoy sa buong sangkatauhan; natural at inklusibo sa modernong Filipino ang “lahat ng tao.”
- source_word: חָזוּ
  choice: Nakita
  rationale: Ang חזה ay nangangahulugang makakita o magmasid. Ang “nakita” ay malinaw at likas sa Filipino, habang ang konteksto at ikalawang taludtod ay nagpapanatili sa diwang mapagmasid.
- source_word: בוֹ
  choice: ito
  rationale: Bagaman panlalaking isahan ang hulaping panghalip sa Hebreo, malamang na tumutukoy ito sa gawa ng Diyos sa naunang konteksto; pinananatili ng “ito” ang malamang na impersonal na reperensiya nang hindi ito labis na ipinapaliwanag.
- source_word: אֱנוֹשׁ
  choice: tao
  rationale: Generic ang אֱנוֹשׁ dito at maaaring magpahiwatig ng mortal na sangkatauhan. Ang “tao” ay natural at pinananatili ang paralelismo sa unang taludtod.
- source_word: יַבִּיט
  choice: minamasdan
  rationale: Ang Hiphil ng נבט ay tumutukoy sa pagtingin o pagmamasid. Ipinahihiwatig ng “minamasdan” ang patuloy at masusing pagtingin at angkop ito sa tonong patula.
- source_word: מֵרָחוֹק
  choice: mula sa malayo
  rationale: Tuwirang ipinahahayag nito ang distansiya at natural itong pakinggan sa dignified na modernong Filipino.
theological_decisions:
- issue: Ang reperensiya ng panlalaking isahang panghalip na בוֹ
  choice: “ito,” bilang malamang na tumutukoy sa gawa ng Diyos
  alternative: “siya,” bilang posibleng tumutukoy sa Diyos
  rationale: Hindi tiyak ang antecedent ayon sa gramatika lamang. Mas pinapaboran ng konteksto ang gawa o ginawa ng Diyos, ngunit inilalahad sa talababa ang personal na pagbasa upang mapanatili ang tunay na kalabuan.
translation_notes:
  register: Modernong Filipino na malinaw, dignified, at bahagyang patula. Ginamit ang generic na “tao” sa parehong taludtod upang iwasan ang di-kinakailangang pagtukoy sa kasarian at mapanatili ang paralelismo ng אָדָם at אֱנוֹשׁ.
