base_translation:
  language: en
  yaml_path: translation/ot/job/036/008.yaml
  text: And if they are bound in chains[a], caught in cords of affliction[b],
translation:
  language: tl
  text: At kung sila'y nakagapos sa mga tanikala[a], nahuli sa mga lubid ng paghihirap[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa mga bakal na gapos.”
    reason: lexical_alternative
  - marker: b
    text: O “mga lubid ng kaabahan” o “mga lubid ng karalitaan”; ang salitang Hebreo ay maaaring tumukoy sa paghihirap, kaabahan, o karalitaan ayon sa konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: At kung
  rationale: Pinananatili ang pang-ugnay na וְ at ang kondisyonal na אִם, at natural itong nagdurugtong sa daloy ng pananalita ni Elihu.
- source_word: אֲסוּרִים
  choice: sila'y nakagapos
  rationale: Pinananatili ang pasibong diwa ng pandiwang אסר, “gapusin,” sa malinaw at likas na Tagalog.
- source_word: בַּזִּקִּים
  choice: sa mga tanikala
  rationale: Tumutukoy sa mga gapos o bakal na panali; malinaw ang “mga tanikala” at pinananatili nito ang konkretong larawan ng pagkakabilanggo.
- source_word: יִלָּכְדוּן
  choice: nahuli
  rationale: Ang Niphal na anyo ng לכד ay nagpapahayag ng pagkakahuli o pagkakabihag; pinananatili ng “nahuli” ang pasibong diwa at ang paralelismo sa “nakagapos.”
- source_word: בְּחַבְלֵי
  choice: sa mga lubid ng
  rationale: Ang חבל ay maaaring tumukoy sa lubid, tali, o panali. Pinananatili ng “mga lubid” ang konkretong metapora ng pagpipigil.
- source_word: עֹנִי
  choice: paghihirap
  rationale: Maaaring mangahulugan ang עֹנִי ng pagdurusa, kaabahan, o kahirapan. Malawak ang “paghihirap” at hindi nito nililimitahan ang kahulugan sa kakulangan sa salapi.
theological_decisions:
- issue: Kalikasan ng larawan ng pagkakagapos
  choice: Panatilihin ang konkretong larawan ng pisikal na pagkakagapos habang hinahayaang tumukoy rin ito sa pagdurusa o pagdidisiplina ng Diyos.
  alternative: Unawain ang pananalita bilang literal lamang na pagkabilanggo, o bilang ganap na metaporikal na paghihirap.
  rationale: Konkreto ang mga salitang Hebreo para sa pagkakagapos, mga tanikala, pagkakahuli, at mga lubid, ngunit sa konteksto ay tinatalakay ni Elihu ang pakikitungo ng Diyos sa mga nagdurusa. Hindi dapat sapilitang pagpasyahan ng salin kung literal o metaporikal lamang ang larawan.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “tanikala” upang mapanatili ang malinaw na larawan ng pisikal na pagkakagapos, at “paghihirap” bilang malawak na katumbas ng עֹנִי. Ang pinaikling “sila’y” ay nagbibigay ng maayos at dignified na daloy nang hindi nagiging makaluma.
