  text: Will your cry avail when distress comes[b][a], or all the exertions of your strength?
translation:
  language: tl
  text: 'Makakatulong ba ang daing mo kapag dumating ang kagipitan[a][b],

    o ang lahat ng pagpupunyagi ng iyong lakas?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mahirap unawain ang Hebreo ng talatang ito, lalo na ang mga pariralang isinaling “ang daing mo” at “kapag dumating ang kagipitan.”
    reason: lexical_alternative
  - marker: b
    text: 'O, ayon sa ibang pagpapakahulugan sa mahirap na Hebreo: “Makakatulong ba ang kayamanan mo upang hindi ka malagay sa kagipitan, o ang lahat ng puwersa ng iyong lakas?”'
    reason: alternative_reading
lexical_decisions:
- source_word: הֲיַעֲרֹךְ
  choice: Makakatulong ba
  rationale: Ang ערך ay karaniwang nangangahulugang ‘ayusin’ o ‘ihanay,’ ngunit sa masalimuot na kontekstong patula rito ay malamang na idyomatikong tumutukoy sa pagiging kapaki-pakinabang o sapat. Ang ‘Makakatulong ba’ ay natural na naghahayag ng retorikal na tanong nang hindi labis na nililinaw ang paraan ng pagtulong.
- source_word: שׁוּעֲךָ
  choice: ang daing mo
  rationale: Sinusunod nito ang pagbigkas ng MT, na karaniwang inuunawa mula sa שׁוע, ‘dumaing/humingi ng tulong.’ Inilalagay sa talababa ang alternatibong ‘kayamanan mo’ dahil mahirap ang anyo at may ibang sinaunang pag-unawa rito.
- source_word: לֹא בְצָר
  choice: kapag dumating ang kagipitan
  rationale: Bagaman ang לֹא ay karaniwang ‘hindi,’ ang siksik at mahirap na pariralang patula ay maaaring unawain bilang kalagayan ng kagipitan. Ang saling ito ay malinaw sa Tagalog, habang pinananatili sa talababa ang alternatibong pagbasa na may tahasang pagtanggi.
- source_word: וְכֹל
  choice: o ang lahat
  rationale: Literal na maaaring ‘at ang lahat,’ ngunit sa retorikal na tanong ay ipinakikilala nito ang isa pang posibleng mapagkukunan na hindi rin makatutulong. Kaya natural dito ang ‘o ang lahat.’
- source_word: מַאֲמַצֵּי כֹחַ
  choice: lahat ng pagpupunyagi ng iyong lakas
  rationale: Pinananatili ng ‘pagpupunyagi’ ang diwa ng matinding pagsisikap, at ng ‘iyong lakas’ ang sangkap na כֹחַ. Ang pagmamay-ari ay ipinahihiwatig ng tuwirang pakikipag-usap at paralelismo.
