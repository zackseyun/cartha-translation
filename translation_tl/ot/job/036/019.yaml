  register: Makabagong Filipino na marangal ngunit madaling maunawaan. Ginamit ang ‘daing,’ ‘kagipitan,’ at ‘pagpupunyagi’ upang mapanatili ang matinding himig ng tulang Hebreo nang hindi maging lipas o teknikal. Ang tunay na kalabuan ng teksto ay hindi pinawi at malinaw na itinala sa mga talababa.
