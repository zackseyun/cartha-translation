  terminology: Ang “katarungan” ay angkop para sa מִשְׁפָּט sa kontekstong ito. Maingat ding pinananatili ng talababa ang mas malawak na saklaw ng “mga naghihirap,” kabilang ang mga dukha at sinisiil. Walang problemang pangalang pantangi o pangunahing terminong teolohikal.
