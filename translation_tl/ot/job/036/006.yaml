  source_fidelity: Tapat ang salin sa Hebreo. Ang “Hindi niya pinananatiling buhay ang masama” ay wastong naghahayag ng Piel na יְחַיֶּה bilang patuloy na pag-iingat o pagpapanatiling buhay, at hindi nagpapasok ng diwa ng muling pagkabuhay. Ang “binibigyan niya ng katarungan ang mga naghihirap” ay maayos na katumbas ng וּמִשְׁפַּט עֲנִיִּים יִתֵּן. Ang kontrastibong “kundi” ay katanggap-tanggap na pagpapahayag ng waw sa kontekstong ito.
