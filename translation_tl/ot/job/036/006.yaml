  text: לֹא יְחַיֶּ֥ה רָשָׁ֑ע וּ/מִשְׁפַּ֖ט עֲנִיִּ֣ים יִתֵּֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/036/006.yaml
  text: He does not keep the wicked alive[b][a], but gives justice to the afflicted.
translation:
  language: tl
  text: 'Hindi niya pinananatiling buhay ang masama[a],

    kundi binibigyan niya ng katarungan ang mga naghihirap.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “hinahayaang mabuhay ang masama.”
    reason: lexical_alternative
  - marker: b
    text: O “mga dukha” o “mga sinisiil.” Ang salitang Hebreo ay maaaring tumukoy sa mga aba, pinahihirapan, sinisiil, o mahihirap sa kabuhayan.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְחַיֶּה
  choice: pinananatiling buhay
  rationale: Ang Piel ng חיה rito ay tumutukoy sa patuloy na pag-iingat o pagpapanatiling buhay, hindi sa muling pagkabuhay. Likas sa Filipino ang pariralang ito at malinaw na naghahayag ng temporal na pagpapanatili.
- source_word: רָשָׁע
  choice: ang masama
  rationale: Bagaman isahan ang anyong Hebreo, ginagamit ito bilang pangkalahatang katawagan sa taong masama. Pinananatili ng “ang masama” ang gayong generic na diwa.
- source_word: וּ
  choice: kundi
  rationale: Literal na “at” ang pangatnig, ngunit malinaw na kontrastibo ang ugnayan ng dalawang sugnay. Ang “kundi” ay natural matapos ang negatibong unang sugnay.
- source_word: מִשְׁפָּט
  choice: katarungan
  rationale: Dito ay tumutukoy ito sa makatarungang pasiya o karapatang ipinagkakaloob sa mga naghihirap, hindi lamang sa gawain ng paghatol.
- source_word: עֲנִיִּים
  choice: ang mga naghihirap
  rationale: Saklaw ng עָנִי ang mga dukha, aba, pinahihirapan, o sinisiil. Ang “mga naghihirap” ay malawak at likas sa modernong Filipino nang hindi ito nililimitahan sa kahirapang materyal.
- source_word: יִתֵּן
  choice: binibigyan
  rationale: Tuwirang katumbas ito ng karaniwang pandiwang נתן at natural sa pariralang Filipino na “binibigyan ng katarungan.”
theological_decisions:
- issue: Kung ang יְחַיֶּה ay nagpapahiwatig ng muling pagkabuhay o pagbibigay-buhay sa teolohikal na diwa
  choice: “pinananatiling buhay,” bilang pansamantalang pag-iingat o pagpapanatili
  alternative: “binibigyang-buhay” o “muling binubuhay”
  rationale: 'Ang konteksto ay ang makatarungang pamamahala ng Diyos: hindi niya patuloy na iniingatan ang masama, ngunit iginagawad niya ang katarungan sa mga naghihirap. Hindi hinihingi ng talata ang diwa ng muling pagkabuhay.'
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “kundi” upang natural na ihayag ang kontrastong nasa Hebreo, at pinanatili sa talababa ang lawak ng kahulugan ng עֲנִיִּים.
