base_translation:
  language: en
  yaml_path: translation/ot/job/036/012.yaml
  text: But if they do not listen[a], they will pass away by the sword, and they will die without knowledge.
translation:
  language: tl
  text: Ngunit kung hindi sila makikinig, malilipol sila sa tabak, at mamamatay silang walang kaalaman.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “dahil sa kakulangan ng kaalaman.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Ngunit kung
  rationale: Ipinakikita ang pasubaling pagsalungat sa pangako sa naunang talata; mas malinaw sa konteksto kaysa sa simpleng “At kung.”
- source_word: לֹא יִשְׁמְעוּ
  choice: hindi sila makikinig
  rationale: Saklaw ng שׁמע ang pagdinig at pagtugon o pagsunod. Pinananatili ng “makikinig” ang lawak na ito nang hindi nililimitahan sa pisikal na pagdinig o tahasang pagsunod lamang.
- source_word: בְּשֶׁלַח
  choice: sa tabak
  rationale: Ang שׁלח dito ay sandata ng paglipol. Ang “tabak” ang natural at angkop na salin sa konteksto, bagaman maaari itong tumukoy nang mas malawak sa isang sandata o bagay na inihahagis.
- source_word: יַעֲבֹרוּ
  choice: mapapahamak sila
  rationale: Literal na nangangahulugang “daraan” o “lilipas” ang עבר, ngunit sa kontekstong ito ng hatol ay idiomatikong tumutukoy sa pagkapuksa. Natural sa Tagalog ang “mapapahamak” at pinananatili nito ang kaibhan sa kasunod na “mamamatay.”
- source_word: וְיִגְוְעוּ
  choice: at mamamatay
  rationale: Karaniwang tumutukoy ang גוע sa pagkamatay o pagpanaw. Malinaw at natural ang “mamamatay.”
- source_word: כִּבְלִי דָעַת
  choice: nang walang kaalaman
  rationale: Pinananatili nito ang anyo at posibleng kahulugan ng kalagayan o paraan sa Hebreo. Posible rin ang pananahilang “dahil sa kakulangan ng kaalaman,” kaya inilagay iyon sa talababa.
theological_decisions:
- issue: Kung ang שׁמע ay simpleng pagdinig o pagtugon na may pagsunod
  choice: hindi sila makikinig
  alternative: hindi sila susunod
  rationale: Ang “makikinig” ay maaaring magpahiwatig kapuwa ng pakikinig at pagtalima, kaya hindi nito nilulutas nang labis ang sadyang malawak na kahulugan ng salitang Hebreo.
- issue: Kung ang כִּבְלִי דָעַת ay nagsasaad ng sanhi o kalagayan
  choice: nang walang kaalaman
  alternative: dahil sa kakulangan ng kaalaman
  rationale: Likas na sinusuportahan ng pariralang Hebreo ang kalagayang “walang kaalaman,” ngunit posible rin ang pananahilang pagbasa; pinanatili ang alternatibo sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mapapahamak” sa halip na literal ngunit di-likas na “lilipas” upang maipahayag ang idiomatikong diwa ng kamatayan sa hatol, habang pinananatili ang paralelismo sa “mamamatay.”
