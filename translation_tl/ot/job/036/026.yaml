  text: הֶן אֵ֣ל שַׂ֭גִּיא וְ/לֹ֣א נֵדָ֑ע מִסְפַּ֖ר שָׁנָ֣י/ו וְ/לֹא חֵֽקֶר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/036/026.yaml
  text: Behold[a], God is great, and we do not know him[b]; the number of his years is unsearchable.
translation:
  language: tl
  text: Masdan, dakila ang Diyos, at hindi natin siya maunawaan[a]; hindi masasaliksik ang bilang ng kanyang mga taon.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “at hindi natin alam.” Walang tahasang layon sa Hebreo; ipinahihiwatig ng konteksto na ang Diyos ang tinutukoy.'
    reason: lexical_alternative
  - marker: b
    text: O, “walang makapagsasaliksik sa bilang ng kanyang mga taon.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶן
  choice: Masdan
  rationale: Isang panawag-pansing kataga na nagbibigay-diin sa kasunod na pahayag; pinananatili ng “Masdan” ang marangal at patulang himig.
- source_word: אֵל
  choice: Diyos
  rationale: Karaniwang patulang tawag ito sa Diyos sa konteksto, kaya hindi ito itinuring na pangalang pantangi na dapat baybayin nang transliterado.
- source_word: שַׂגִּיא
  choice: dakila
  rationale: Saklaw nito ang diwa ng kadakilaan at kataasan nang hindi nililimitahan ang salita sa lakas lamang.
- source_word: וְלֹא נֵדָע
  choice: at hindi natin siya maunawaan
  rationale: Walang tahasang layon ang pandiwang Hebreo, ngunit ang Diyos ang malinaw na tinutukoy sa konteksto. Ang “maunawaan” ay natural sa Filipino at ipinahahayag ang hangganan ng kaalaman ng tao nang hindi nagsasabing wala tayong anumang pagkakilala sa Diyos.
- source_word: מִסְפַּר שָׁנָיו
  choice: ang bilang ng kanyang mga taon
  rationale: Pinananatili nito ang tuwirang patulang larawan ng Hebreo sa halip na palitan ito ng sistematikong katawagang “kawalang-hanggan.”
- source_word: וְלֹא חֵקֶר
  choice: hindi masasaliksik
  rationale: Natural at maikli itong katumbas ng idyomang nagsasabing walang ganap na pagsisiyasat o pagtarok dito.
theological_decisions:
- issue: Hindi tahasang layon ng וְלֹא נֵדָע
  choice: 'Ipinahiwatig ang Diyos bilang layon: “hindi natin siya maunawaan.”'
  alternative: 'Panatilihing walang layon: “at hindi natin alam”; o isaling “hindi natin siya kilala.”'
  rationale: Ang Diyos ang agarang tinutukoy, ngunit maaaring magpahiwatig sa Filipino ang “hindi natin siya kilala” na walang anumang ugnayan o pagkakilala sa kanya. Pinananatili ng napiling salin ang kontekstuwal na diwa ng hindi lubos na pagtarok, habang inilalahad sa talababa ang mas literal na anyo.
- issue: Ang “mga taon” ng Diyos
  choice: Pinanatili ang larawang “ang bilang ng kanyang mga taon.”
  alternative: Ipaliwanag bilang “ang kanyang kawalang-hanggan” o “ang haba ng kanyang buhay.”
  rationale: Patulang inilalarawan ng Hebreo ang tagal ng Diyos sa pamamagitan ng kanyang “mga taon.” Hindi ito dapat tahimik na palitan ng mas sistematikong teolohikal na termino.
translation_notes:
  register: Makabago ngunit marangal na Filipino ang ginamit, na may bahagyang patulang himig. Pinanatili ang larawang “mga taon” at ang diin ng pambungad na הֶן, habang nilinaw sa talababa ang sintaktikong kalabuan ng “hindi natin alam.”
