  source_fidelity: Ang pangmaramihang panghalip na בָם ay wastong naipreserba bilang “mga iyon,” kasama ang instrumental na diwa ng pang-ukol. Wasto rin ang “pagkain nang sagana” para sa יִתֶּן אֹכֶל לְמַכְבִּיר. Gayunman, ang יָדִין ay mas tumpak na “humahatol” kaysa “hinahatulan,” dahil ang huli ay mas madaling magpahiwatig ng pagpaparusa o pagkondena kaysa ng mas malawak na pagkilos ng paghatol.
  naturalness: Mas natural at malinaw sa modernong Filipino ang “humahatol siya sa mga bayan” kaysa “hinahatulan niya ang mga bayan.” Nananatili ang marangal ngunit madaling basahing rehistro.
  terminology: Ang “mga bayan” ay katanggap-tanggap para sa עַמִּים at pinananatili ang saklaw na “mga peoples” nang hindi ikinakahon sa modernong pampolitikang “mga bansa.” Ang “mga iyon” ay wastong hindi tumutukoy nang tiyak sa ulan, kidlat, o ibang elementong pinagtatalunan sa konteksto.
