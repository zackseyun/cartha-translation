  text: For by them he judges peoples; he gives food in abundance.
translation:
  language: tl
  text: Sapagkat sa pamamagitan ng mga iyon ay humahatol siya sa mga bayan; nagbibigay siya ng pagkain nang sagana.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָם
  choice: sa pamamagitan ng mga iyon
  rationale: Pinananatili ang pangmaramihang panghalip at ang ugnayang instrumental ng בְּ, nang hindi tahasang nilulutas kung ano ang tinutukoy nito sa naunang taludtod.
- source_word: יָדִין
  choice: hinahatulan niya
  rationale: Tuwirang ipinapahayag ang diwang hudisyal ng pandiwang דין at pinananatili ang Diyos bilang di-binanggit ngunit malinaw na simuno.
- source_word: עַמִּים
  choice: mga bayan
  rationale: Ang 'mga bayan' ay natural at malawak na katumbas ng pangmaramihang עמים, na maaaring tumukoy sa mga pangkat ng tao o mga bansa.
- source_word: יִתֶּן אֹכֶל
  choice: nagbibigay siya ng pagkain
  rationale: Likas na salin sa Filipino ng literal na 'nagbibigay ng pagkain,' na pinananatili ang parallel na pagkilos ng parehong simuno.
- source_word: לְמַכְבִּיר
  choice: nang sagana
  rationale: Ipinahahayag ang diwa ng kasaganaan o maraming suplay sa maikli at natural na Filipino.
theological_decisions:
- issue: Ang magkaugnay na paghatol at pagbibigay ng pagkain sa pamamagitan ng parehong mga bagay
  choice: Pinanatiling magkatabi ang dalawang kilos nang walang paliwanag kung paano sila magkaugnay.
  alternative: Tukuyin ang 'mga iyon' bilang ulan, bagyo, o kidlat at ipaliwanag ang mga ito bilang mga kasangkapan ng parusa at pagpapala.
  rationale: Hindi tahasang pinapangalanan ng talata ang tinutukoy ng panghalip; ang paglilinaw nito sa pangunahing teksto ay mag-aalis ng tunay na kontekstuwal na kalabuan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang 'mga iyon' upang tumukoy pabalik sa naunang larawan habang pinananatili ang kalabuan ng Hebreo; iniwasan ang mas mabigat na 'mga sambayanan' upang manatiling madaling maunawaan.
