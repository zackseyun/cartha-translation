  text: Remember that you should magnify his work[a], of which men have sung.
translation:
  language: tl
  text: Alalahanin mong dakilain ang kanyang gawa[a], na ipinagdiwang ng mga tao sa awit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “na nakita ng mga tao” o “na pinagmasdan ng mga tao.” Mahirap tiyakin ang kahulugan ng pandiwang Hebreo na שֹׁרְרוּ; inuunawa ito ng ilan bilang pagkakita sa halip na pag-awit.
    reason: lexical_alternative
lexical_decisions:
- source_word: זְכֹר
  choice: Alalahanin mo
  rationale: Tuwirang pautos na panlalaking isahan mula sa זכר. Ang “alalahanin” ay natural at malinaw na panawagan sa makabagong Tagalog.
- source_word: כִּי
  choice: -ng
  rationale: Ipinakikilala rito ng כִּי ang nilalaman ng dapat alalahanin. Likas itong naipahahayag sa Tagalog sa pamamagitan ng pang-angkop sa “Alalahanin mong...” sa halip na hiwalay na katumbas.
- source_word: תַשְׂגִּיא
  choice: dakilain
  rationale: Ang Hiphil na anyo ay may diwang gawing dakila, itanghal, o kilalaning dakila. Napananatili ng “dakilain” ang lakas ng paghihikayat at natural itong kaugnay ng gawa ng Diyos.
- source_word: פָעֳלוֹ
  choice: ang kanyang gawa
  rationale: Malawak ang saklaw ng פֹּעַל bilang gawa, ginawa, o pagkilos. Pinananatili rin ng “kanyang” ang panghalip ng Hebreo nang hindi inuulit nang tahasan ang Diyos.
- source_word: אֲשֶׁר
  choice: na siyang
  rationale: Nag-uugnay ito sa “kanyang gawa” at sa kasunod na sugnay. Nililinaw ng “na siyang” na ang gawa ang paksa ng awit nang hindi binabago ang kahulugan.
- source_word: שֹׁרְרוּ
  choice: inawitan
  rationale: Sinusunod nito ang tradisyonal at malamang na makatang diwa na umawit tungkol sa gawain. Dahil mahirap ang anyo at maaari rin itong iugnay sa pagkakita o pagmamasid, inilalahad ang mga iyon sa talababa.
- source_word: אֲנָשִׁים
  choice: mga tao
  rationale: Bagaman panlalaking maramihan ang anyong Hebreo, karaniwang tumutukoy ang אֲנָשִׁים sa mga tao sa pangkalahatan. Sa modernong Tagalog, “mga tao” ang tumpak at likas na katumbas nang walang di-kinakailangang pagkitid sa kalalakihan lamang.
theological_decisions:
- issue: Tinutukoy ng panlalaking isahang hulapi sa “kanyang gawa”
  choice: Pinanatili ang panghalip na “kanyang”; nauunawaang Diyos ang tinutukoy ayon sa konteksto.
  alternative: Tahasang “gawa ng Diyos”
  rationale: Diyos ang malinaw na tinutukoy sa konteksto ng pananalita ni Elihu, ngunit panghalip lamang ang ginamit ng Hebreo. Pinananatili ng salin ang anyo at hindi nagdaragdag ng pangngalan.
- issue: Diwa ng שֹׁרְרוּ
  choice: Umawit tungkol sa gawa
  alternative: Nakita o pinagmasdan ang gawa
  rationale: Ang pagbasa bilang pag-awit ay ang tradisyonal at malamang na makatang pakahulugan, ngunit hindi tiyak ang mahirap na pandiwa. Pinananatili sa talababa ang tunay na leksikal na kalabuan.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog. Ginamit ang “dakilain” upang mapanatili ang matinding paghihikayat ng pandiwa, at “inawitan” upang maging natural ang kaugnayan ng awit sa gawa. Ang talababa ay nag-iingat sa leksikal na kalabuan ng Hebreo.
