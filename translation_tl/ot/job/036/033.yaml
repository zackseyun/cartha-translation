  text: Its thunder declares concerning him[a]; the cattle also[b], concerning what is rising.
translation:
  language: tl
  text: Nagpapahayag ang kulog nito tungkol sa kanya[a]; pati ang mga alagang hayop, tungkol sa umaahon.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mahirap unawain ang Hebreo. Sa literal na pagbasa, maaaring “kanyang kaibigan” sa halip na “kulog nito”; inuunawa ng marami na tumutukoy ang linya sa ingay ng bagyo.
    reason: lexical_alternative
  - marker: b
    text: O, “pati ang mga alagang hayop ay nagpapahayag tungkol sa bagyong paparating.” Malamang na tumutukoy ang huling parirala sa papalapit na bagyo, ngunit “umaahon” lamang ang tahasang sinasabi ng Hebreo.
    reason: alternative_reading
lexical_decisions:
- source_word: יַגִּיד
  choice: ipinahahayag
  rationale: Ang Hiphil ng נגד ay nangangahulugang ‘ipahayag’ o ‘ipaalam.’ Ang ‘ipinahahayag’ ay angkop sa marangal at patulang tono.
- source_word: עָלָיו
  choice: ang tungkol sa kanya
  rationale: Maaaring mangahulugang ‘tungkol sa kanya’ o ‘laban sa kanya’ ang על na may hulaping panghalip. Pinananatili ng saling ito ang neutral na diwa at ang hindi tiyak na tinutukoy.
- source_word: רֵעוֹ
  choice: kulog nito
  rationale: Mahirap ang anyong Hebreo at literal na maaari itong basahing ‘kanyang kaibigan.’ Gayunman, dahil sa konteksto ng bagyo, nauunawaan ito ng marami bilang ingay o kulog nito; inilalagay sa talababa ang literal na alternatibo.
- source_word: מִקְנֶה
  choice: mga hayop
  rationale: Karaniwang tumutukoy ang salita sa mga alagang hayop o kawan. Ang ‘mga hayop’ ay natural sa Filipino at akma sa larawang nakadarama ang mga ito ng paparating na bagyo.
- source_word: אַף
  choice: gayundin
  rationale: Nagdaragdag o nagbibigay-diin ang kataga; natural na ipinapakita ng ‘gayundin’ ang pagpapatuloy ng paralelismo.
- source_word: עַל
  choice: tungkol sa
  rationale: Pinananatili nito ang malawak at neutral na kahulugan ng pang-ukol sa mahirap na taludtod.
- source_word: עוֹלֶה
  choice: umaahon
  rationale: Ang Qal participle ng עלה ay ‘umaakyat’ o ‘umaahon.’ Hindi tinutukoy ng Hebreo kung ano ang umaahon, kaya hindi tahasang idinaragdag ang ‘bagyo.’
