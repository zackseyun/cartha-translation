  text: He opens their ear to discipline[b][a], and says that they should turn back from wickedness.
translation:
  language: tl
  text: Binubuksan niya ang kanilang mga tainga para sa pagdidisiplina[a], at sinasabi niyang tumalikod sila mula sa kasamaan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “binubuksan niya ang kanilang mga tainga para sa pagtutuwid” o “inaalisan niya ng takip ang kanilang mga tainga para sa pagtuturo.”
    reason: lexical_alternative
  - marker: b
    text: Ang salitang isinaling “kasamaan” ay maaari ring mangahulugang “kalikuan” o, sa ibang konteksto, “kaguluhan” o “paghihirap.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגֶל אָזְנָם
  choice: Binubuksan niya ang kanilang pandinig
  rationale: Ang literal na larawan ay ‘binubuksan/inaalisan ng takip ang kanilang tainga.’ Ginamit ang ‘pandinig’ upang maging natural sa makabagong Tagalog habang pinananatili ang metapora ng pagiging handang makinig.
- source_word: לַמּוּסָר
  choice: sa pagdidisiplina
  rationale: Saklaw ng מוּסָר ang pagtuturo, pagtutuwid, at pagdidisiplina. Sa konteksto, ang paghihirap ay inilalarawang paraan ng pagtutuwid, kaya pinananatili ng ‘pagdidisiplina’ ang parehong aspektong nagtuturo at nagtutuwid.
- source_word: וַיֹּאמֶר כִּי
  choice: at sinasabing
  rationale: Ipinakikilala nito ang nilalaman ng sinasabi nang hindi nagdaragdag ng tahasang di-tuwirang layon.
- source_word: יְשֻׁבוּן
  choice: tumalikod sila
  rationale: Ang שוב ay nangangahulugang bumalik o tumalikod. Dito, ang hinihinging tugon ay pagtalikod mula sa masamang gawain; naipahihiwatig ng sugnay ang pag-uutos o paghihikayat nang hindi ito pinalalabis.
- source_word: מֵאָוֶן
  choice: sa kasamaan
  rationale: Maaaring tumukoy ang אָוֶן sa kasamaan, kabulaanan, o kaguluhan/paghihirap. Moral ang diin sa kontekstong ito, kaya natural at angkop ang ‘kasamaan.’
theological_decisions:
- issue: Kalikasan ng מוּסָר sa pananalita ni Elihu
  choice: pagdidisiplina bilang nagtutuwid na pagtuturo
  alternative: pagtuturo lamang, o pagpaparusa/pagkastigo na mas matindi ang diin
  rationale: Inilalarawan ng kalapit na konteksto ang pagdurusa bilang paraan ng Diyos upang turuan at panumbalikin ang tao mula sa masamang gawa. Pinananatili ng ‘pagdidisiplina’ ang tensiyon sa pagitan ng pagtuturo at pagtutuwid nang hindi nagpapasok ng natatanging doktrina tungkol sa pagdurusa.
- issue: Diwa ng אָוֶן
  choice: moral na kasamaan
  alternative: kaguluhan o paghihirap
  rationale: Ang pandiwang ‘tumalikod’ ay nagpapahiwatig dito ng moral na pagkilos, ngunit itinatala sa talababa ang mas malawak na saklaw ng salita.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog. Ginamit ang ‘pandinig’ sa halip na literal na kolektibong ‘tainga’ upang maging likas ang idyoma, habang inilagay sa talababa ang mas literal na larawan. Ang ‘pagdidisiplina’ ay sadyang nagpapanatili sa pinagsamang diwa ng pagtuturo at pagtutuwid.
