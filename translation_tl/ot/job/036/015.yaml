  naturalness: 'Ang “sa pamamagitan ng paghihirap nito” ay tunog mekanikal, sapagkat ang “nito” ay karaniwang tumutukoy sa bagay o hayop, hindi sa generic na tao. Mas natural sa modernong Filipino ang maramihang pangkalahatang pagpapahayag: “ang mga nagdurusa … kanilang pagdurusa … kanilang mga tainga.” Ang “kagipitan” ay mas malawak at natural na katumbas ng לחץ kaysa “panggigipit,” na maaaring magpahiwatig nang mas makitid ng pangha-harass o pamimilit.'
