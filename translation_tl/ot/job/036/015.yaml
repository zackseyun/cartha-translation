source:
  edition: WLC
  text: יְחַלֵּ֣ץ עָנִ֣י בְ/עָנְי֑/וֹ וְ/יִ֖גֶל בַּ/לַּ֣חַץ אָזְנָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/job/036/015.yaml
  text: He rescues the afflicted by their affliction[b][a], and opens their ears by oppression.
translation:
  language: tl
  text: Inililigtas niya ang mga nagdurusa sa pamamagitan ng kanilang pagdurusa[a], at binubuksan niya ang kanilang mga tainga sa pamamagitan ng kagipitan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring, “Inililigtas niya ang mahirap sa kanyang paghihirap.” Ang mga salitang Hebreo ay maaaring magdiin sa kahirapan, pagdurusa, o pang-aapi.
    reason: lexical_alternative
  - marker: b
    text: Literal, “binubuksan” o “inilalantad ang kanilang mga tainga,” isang idyomang Hebreo para sa pagbubukas ng tainga upang makinig o tumanggap ng turo o babala.
    reason: cultural_note
lexical_decisions:
- source_word: יְחַלֵּץ
  choice: Inililigtas
  rationale: Ang Piel ng חלץ ay tumutukoy sa paghango o pagliligtas mula sa panganib. Ang “inililigtas” ay natural at malinaw sa modernong Filipino.
- source_word: עָנִי
  choice: ang nagdurusa
  rationale: Bagaman maaari itong mangahulugang “mahirap,” itinatampok ng kaagapay na עָנְיוֹ at לַחַץ ang pagdurusa o pagkapiit sa ilalim ng hirap, hindi lamang kahirapang pangkabuhayan.
- source_word: בְעָנְיוֹ
  choice: sa pamamagitan ng paghihirap nito
  rationale: Pinananatili ng “sa pamamagitan ng” ang malamang na instrumental na diwa ng בְּ, habang ang “nito” ay sumusunod sa gramatikal na isahan ng generic na עָנִי.
- source_word: וְיִגֶל
  choice: binubuksan
  rationale: Literal itong “inaalisan ng takip,” ngunit kapag tainga ang layon, isa itong idyoma para sa pagpaparinig o pagpapátanggap ng turo.
- source_word: בַּלַּחַץ
  choice: sa pamamagitan ng panggigipit
  rationale: Ang לַחַץ ay maaaring tumukoy sa panggigipit, paniniil, o matinding kagipitan. Pinananatili ng parirala ang instrumental na pagkakatulad sa unang hati.
- source_word: אָזְנָם
  choice: kanilang mga tainga
  rationale: Ang hulaping ikatlong panauhang panlalaking maramihan ay sumusuporta sa “kanilang,” kahit na generic na isahan ang naunang עָנִי.
theological_decisions:
- issue: Ang pagdurusa bilang paraan ng pagliligtas at pagtuturo ng Diyos
  choice: Isinalin ang dalawang pariralang may בְּ bilang “sa pamamagitan ng,” kaya nananatiling paraan o instrumento ang paghihirap at panggigipit.
  alternative: 'Maaaring unawain ang mga ito bilang kalagayan lamang: “sa kanyang paghihirap” at “sa gitna ng panggigipit.”'
  rationale: Ang magkatulad na pagkakabuo ng dalawang parirala ay pumapabor sa instrumental na pagbasa. Gayunman, hindi dinagdagan ang teksto ng paliwanag na lahat ng pagdurusa ay mabuti o tuwirang parusa; pinananatili ang tensiyon sa pananalita ni Elihu.
translation_notes:
  register: Modernong Filipino na natural ngunit marangal. Pinanatili ang paglipat mula sa generic na isahan (“ang nagdurusa… nito”) tungo sa maramihang hulapi ng Hebreo (“kanilang mga tainga”).
