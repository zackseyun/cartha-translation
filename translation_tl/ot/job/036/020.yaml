  text: Do not long for the night[a], when peoples are taken away from their place.
translation:
  language: tl
  text: Huwag mong hangarin ang gabi[a], kapag ang mga bayan ay inaalis sa kanilang kinalalagyan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O mas literal: “Huwag mong hangarin ang gabi, para sa pag-ahon ng mga bayan mula sa ilalim nila.” Mahirap unawain ang Hebreo; ang “inaalis sa kanilang kinalalagyan” ay sumusunod sa isang karaniwang kontekstuwal na pagkaunawa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּשְׁאַף
  choice: Huwag mong hangarin
  rationale: Ang אַל na may imperfect ay nagpapahayag ng pagbabawal, at ang שׁאף ay maaaring mangahulugang manabik o masidhing magnais. Natural at marangal sa Filipino ang “Huwag mong hangarin.”
- source_word: הַלָּיְלָה
  choice: ang gabi
  rationale: Tuwirang katumbas ito ng tiyak na pangngalan at natural sa modernong Filipino.
- source_word: לַעֲלוֹת
  choice: kapag ... ay inaalis
  rationale: Mahirap ang infinitive ng עלה sa talatang ito. Ipinapahayag ng saling ito ang karaniwang kontekstuwal na pagkaunawa na ang mga bayan ay inaalis o tinatangay, habang inilalahad sa talababa ang mas literal na anyo.
- source_word: עַמִּים
  choice: ang mga bayan
  rationale: Pinananatili ng “mga bayan” ang maramihan at kolektibo o pambansang diwa, sa halip na tumukoy lamang sa mga indibidwal.
- source_word: תַּחְתָּם
  choice: sa kanilang kinalalagyan
  rationale: Bagaman literal na may diwang “sa ilalim nila,” malamang na tumutukoy rito ang תחת sa lugar o katayuang pinagmumulan ng pag-aalis. Ang “sa kanilang kinalalagyan” ay malinaw at kontekstuwal.
theological_decisions:
- issue: Ang ugnayan ng “gabi” sa pag-aalis ng mga bayan
  choice: Hindi tinukoy kung ang gabi ay kamatayan, paghuhukom, o panahon lamang ng kapahamakan.
  alternative: Ipaliwanag ang gabi bilang kamatayan o banal na paghuhukom.
  rationale: Hindi tahasang nilulutas ng Hebreo ang talinghaga o temporal na diwa ng “gabi”; pinananatili ng salin ang tunay na kalabuan nang walang pag-aangkat ng tiyak na doktrina.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Pinanatili ang “mga bayan” para sa kolektibong diwa at gumamit ng talababa upang hindi ikubli ang kahirapan at ambiguwidad ng Hebreo.
