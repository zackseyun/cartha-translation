  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: הֶן אֵ֭ל יַשְׂגִּ֣יב בְּ/כֹח֑/וֹ מִ֖י כָמֹ֣/הוּ מוֹרֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/036/022.yaml
  text: Behold[a], God is exalted in his power[b]; who is a teacher like him?
translation:
  language: tl
  text: Masdan, dakila ang Diyos sa kanyang kapangyarihan[a]; sino ang gurong tulad niya?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “dakila sa pamamagitan ng kanyang kapangyarihan” o “dakila sa kanyang lakas.”
    reason: lexical_alternative
  - marker: b
    text: O “sino ang tulad niya bilang guro?”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶן
  choice: Masdan
  rationale: Isang pantawag-pansin ang salitang Hebreo. Pinananatili ng “Masdan” ang marangal at patulang himig habang malinaw pa rin sa makabagong mambabasa.
- source_word: אֵל
  choice: Diyos
  rationale: Karaniwang titulong tumutukoy sa Diyos ang אֵל sa kontekstong ito, kaya likas at tuwiran ang “Diyos.”
- source_word: יַשְׂגִּיב
  choice: dakila
  rationale: Ang Hiphil ng שׂגב ay nagpapahayag ng kataasan o kadakilaang hindi madaling maabot. Ang “dakila” ay natural sa Filipino at hindi labis na nililinaw kung ito ay kalagayan, pagpapakita ng sarili, o pagkilos nang may kataasan.
- source_word: בְּכֹחוֹ
  choice: sa kanyang kapangyarihan
  rationale: Maaaring ilarawan ng בְּ ang kaugnayan, paraan, o kasangkapan. Pinananatili ng “sa kanyang kapangyarihan” ang siksik at bahagyang bukas na pahayag ng Hebreo.
- source_word: מִי כָמֹהוּ
  choice: sino ang ... tulad niya?
  rationale: Pinananatili nito ang tuwiran at retorikal na paghahambing na nagpapahayag na walang maihahambing sa Diyos.
- source_word: מוֹרֶה
  choice: guro
  rationale: Ang מוֹרֶה ay tumutukoy sa isang nagtuturo. Ang “guro” ang pinakamaikli, natural, at karaniwang katumbas sa Filipino.
theological_decisions:
- issue: Ang kaugnayan ng kadakilaan ng Diyos sa kanyang kapangyarihan
  choice: Inilalarawan ang Diyos bilang dakila sa kanyang kapangyarihan, nang hindi tinutukoy nang higit kung ito ay kalagayan, paraan ng pagkilos, o pagpapakita ng kanyang kataasan.
  alternative: “Itinataas ng Diyos sa pamamagitan ng kanyang kapangyarihan” o “kumikilos ang Diyos nang may kadakilaan sa kanyang lakas.”
  rationale: May saklaw ng kahulugan ang pandiwa at ang pang-ukol, ngunit ang pangunahing diin sa konteksto ay ang kataasan ng Diyos at ang kawalan ng kapantay niya bilang guro. Iniiwasan ng salin ang pagpasok ng mas tiyak na doktrinal na paliwanag kaysa sa hinihingi ng Hebreo.
- issue: Ayos ng retorikal na tanong tungkol sa Diyos bilang guro
  choice: “sino ang gurong tulad niya?”
  alternative: “sino ang tulad niya bilang guro?”
  rationale: Parehong posible sa Hebreo. Ang piniling ayos ay mas natural sa Filipino at pinananatili ang diin sa kawalan ng kapantay na guro.
translation_notes:
  register: Makabago ngunit marangal at patula ang rehistro. Ginamit ang “Masdan” bilang malinaw na pantawag-pansin, at iniwasan ang mas teknikal o denominasyonal na pananalita. Ang mga pananda ng talababa [a] at [b] ay inilagay kaagad sa mga pariralang tinutukoy ng mga ito.
