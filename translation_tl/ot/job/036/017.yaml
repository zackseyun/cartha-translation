  verdict: revise
  source_fidelity: Ang unang hati, “Ngunit punô ka ng paghatol na nauukol sa masama,” ay isang katanggap-tanggap na paglalapat ng siksik na דִּין רָשָׁע at maayos na pinananatili ng talababa ang pangunahing mga posibilidad. Sa huling hati, gayunman, ang hayag na “sa iyo” at ang “humahawak” ay masyadong nagtatakda ng hindi hayag na layon at hindi gaanong malinaw na naipahahayag ang saklaw ng תמך. Maaaring ipahiwatig ng konteksto ang layong si Job, ngunit hindi ito sinasabi sa Hebreo.
  naturalness: Natural at marangal sa pangkalahatan ang Filipino ng draft. Mas matatas ang “hatol” kaysa “paghatol” sa maigsi at matalinghagang paralelismong ito. Ang “mahigpit na humahawak” na walang layon sa kasalukuyang talababa ay hindi lubos na likas sa Tagalog; mas maayos ang “mahigpit na kumakapit,” bagaman ito rin ay isang alternatibong pagpapahayag lamang.
  terminology: Ang “hatol” at “katarungan” ay angkop na mga terminong panghukuman. Ang “masama” ay pinananatiling pang-isahang pangngalang pangkalahatan, gaya ng Hebreo. Ang “sumasaklot sa iyo” ay mas malinaw na alternatibo para sa maparusang pagbasa, samantalang ang pangunahing teksto ay hindi dapat pumili nang ganap sa pagitan ng pagsuporta at paghawak/pagsaklot.
  issues:
