  yaml_path: translation/ot/job/036/017.yaml
  text: But you are full of the judgment of the wicked[b][a]; judgment and justice seize you.
translation:
  language: tl
  text: Ngunit punô ka ng hatol na nauukol sa masama[a]; hatol at katarungan ay umaalalay o mahigpit na kumakapit.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “punô ka ng hatol ng taong masama.” Siksik ang Hebreo at maaaring tumukoy sa hatol na sinasapitan ng masama o sa uri ng hatol na kaugnay ng masama.
    reason: alternative_reading
  - marker: b
    text: 'O “hatol at katarungan ang umaalalay sa iyo” o “sumasaklot sa iyo.” Maaari ring unawaing walang tahasang layon: “hatol at katarungan ay mahigpit na kumakapit.” Ang pandiwang Hebreo ay maaaring mangahulugang sumuporta, umalalay, o humawak.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְדִין
  choice: Ngunit ... paghatol
  rationale: Ang וְ ay inuunawang panalungat ayon sa konteksto, samantalang ang דִּין ay isinasama sa pariralang kasunod. Pinananatili ng “paghatol” ang himig na panghukuman.
- source_word: רָשָׁע
  choice: sa masama
  rationale: Ang pang-isahang pang-uri ay ginagamit bilang pangngalan at tumutukoy sa taong masama nang hindi nagdaragdag ng salitang “lalaki.”
- source_word: מָלֵאתָ
  choice: punô ka
  rationale: Tuwirang inilalarawan ang kalagayan ni Job at pinananatili ang metapora ng pagiging punô.
- source_word: דִּין וּמִשְׁפָּט
  choice: paghatol at katarungan
  rationale: Pinananatili ang dalawang magkaugnay ngunit hindi lubos na magkaparehong terminong panghukuman.
- source_word: יִתְמֹכוּ
  choice: humahawak sa iyo
  rationale: Maaaring mangahulugang sumuporta, umalalay, o humawak ang תמך. Ang “humahawak sa iyo” ay natural sa Tagalog at hindi lubusang nagpapasya kung ang kilos ay pagsuporta o pagsaklot; ang “sa iyo” ay ipinahihiwatig lamang ng konteksto.
theological_decisions:
- issue: Kaugnayan ng “paghatol” at “masama” sa unang hati
  choice: “paghatol na nauukol sa masama”
  alternative: “paghatol ng taong masama” o “uri ng paghatol na ginagawa ng masama”
  rationale: Napakasiksik ng Hebreo at maaaring tumukoy sa hatol na dinaranas ng masama o sa paghatol na kaugnay ng asal ng masama. Hindi tahasang nilulutas ng salin ang dalawang posibilidad.
- issue: Diwa at layon ng יִתְמֹכוּ
  choice: “humahawak sa iyo”
  alternative: “umaalalay sa iyo,” “sumasaklot sa iyo,” o ang walang tahasang layon na “mahigpit na humahawak”
  rationale: Walang hayag na layon sa Hebreo, at maaaring positibo o maparusang paghawak ang pandiwa. Ipinahihiwatig ng konteksto ang “sa iyo,” ngunit inilalahad sa talababa ang leksikal at sintaktikong kalabuan.
translation_notes:
  register: Makabagong, marangal, at madaling maunawaang Filipino. Pinanatili ang maigsi at panghukuman na himig ng tulang Hebreo, pati ang tunay na kalabuan ng dalawang hati.
