    rationale: Walang tahasang layon ang יִתְמֹכוּ. Bagaman maaaring si Job ang ipinahihiwatig ng konteksto, mas mainam na huwag itong gawing sapilitan sa pangunahing salin, lalo na dahil kinikilala mismo ng audit trail ang sintaktikong kalabuan.
  - severity: low
    issue: Hindi ganap na likas ang alternatibong “mahigpit na humahawak” nang walang layon sa talababa.
    rationale: Karaniwang kailangan ng “humahawak” ang pariralang “sa …” sa ganitong gamit. Ang “mahigpit na kumakapit” ay mas natural na walang hayag na layon, ngunit dapat manatili bilang alternatibo lamang.
