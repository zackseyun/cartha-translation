source:
  edition: WLC
  text: הֵן פָּרַ֣שׂ עָלָ֣י/ו אוֹר֑/וֹ וְ/שָׁרְשֵׁ֖י הַ/יָּ֣ם כִּסָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/036/030.yaml
  text: Behold[a], he spreads his light over it[c][b], and he covers the roots of the sea.
translation:
  language: tl
  text: Masdan, ikinakalat niya sa ibabaw nito[a] ang kanyang liwanag[b], at tinatakpan niya ang mga ugat ng dagat.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa ibabaw niya.” Panlalaking isahan ang panghalip sa Hebreo, ngunit hindi tahasang tinutukoy kung sino o ano ang pinatutungkulan; maaaring kaugnay ito ng ulap o unos sa konteksto.
    reason: alternative_reading
  - marker: b
    text: Maaari ring “ang kanyang kidlat” o “ang kanyang ningning.”
    reason: lexical_alternative
  - marker: c
    text: Sa literal, “mga ugat ng dagat”; maaaring tumukoy ito sa pinakamalalim o saligang bahagi ng dagat.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Masdan
  rationale: Pantawag-pansin ito sa patulang paglalarawan. Pinananatili ng “Masdan” ang marangal at matinding himig nang hindi nagiging lipas ang pananalita.
- source_word: פָּרַשׂ
  choice: ikinakalat
  rationale: Ang pandiwa ay nangangahulugang maglatag, magbukadkad, o magpalawak. Ang “ikinakalat” ay likas sa Filipino kapag liwanag ang bagay na lumalaganap at pinananatili ang larawan ng paglawak.
- source_word: עָלָיו
  choice: sa ibabaw nito
  rationale: Panlalaking isahan ang hulaping panghalip sa Hebreo, ngunit hindi tahasang tinutukoy ang pinatutungkulan. Ang “nito” ay angkop sa posibleng ulap o unos sa konteksto, habang pinananatili sa talababa ang pormal na posibilidad na “niya.”
- source_word: אוֹרוֹ
  choice: ang kanyang liwanag
  rationale: Karaniwang kahulugan ng אוֹר ang “liwanag.” Sa konteksto ng unos maaari itong tumukoy sa kidlat o ningning, ngunit hindi nililimitahan ng pangunahing salin ang mas malawak na salitang Hebreo.
- source_word: וְשָׁרְשֵׁי
  choice: at ... ang mga ugat ng
  rationale: Tuwirang larawan sa Hebreo ang “mga ugat.” Pinananatili ito upang hindi agad ipakahulugan bilang “kalaliman” o “mga saligan.”
- source_word: הַיָּם
  choice: dagat
  rationale: Tuwirang tumutukoy ang pangngalan sa dagat; ang “mga tubig” ay magiging mas malawak kaysa sa salitang pinagmulan.
- source_word: כִּסָּה
  choice: tinatakpan niya
  rationale: Pangunahing diwa ng pandiwa ang pagtatakip. Ang kasalukuyang anyo ay umaayon sa masiglang patulang paglalarawan ng kilos.
theological_decisions:
- issue: Hindi tahasang paksa ng mga pandiwa
  choice: Pinanatili ang panghalip na “niya” nang hindi idinaragdag ang pangalang “Diyos.”
  alternative: Tahasan itong isaling “ikinakalat ng Diyos” at “tinatakpan ng Diyos.”
  rationale: Nauunawaan sa konteksto na Diyos ang paksa, ngunit hindi siya pinangalanan sa mismong talata. Ang panghalip ay mas tapat sa anyo ng Hebreo at umiiwas sa di-kinakailangang pagpapaliwanag sa pangunahing teksto.
translation_notes:
  register: Makabagong Filipino na marangal at patula. Ginamit ang “Masdan” bilang mataas ngunit madaling maunawaang pantawag-pansin; pinanatili ang matingkad na larawang “mga ugat ng dagat” at ang mga tunay na kalabuan ng panghalip at ng salitang “liwanag.”
