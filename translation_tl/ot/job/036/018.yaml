id: JOB.36.18
reference: Job 36:18
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: כִּֽי חֵ֭מָה פֶּן יְסִֽיתְ/ךָ֣ בְ/סָ֑פֶק וְ/רָב כֹּ֝֗פֶר אַל יַטֶּֽ/ךָּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/036/018.yaml
  text: Because wrath—beware lest it entice you into scoffing[c][b][a], and do not let a great ransom turn you aside.
translation:
  language: tl
  text: Sapagkat ang poot—mag-ingat ka, baka akitin ka nito sa panlilibak[a], at huwag mong hayaang ilihis ka ng malaking pantubos[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “baka akitin ka nito sa pagpalakpak.” Mahirap tiyakin ang salitang Hebreo na isinaling “panlilibak”; maaaring mas literal itong tumukoy sa paghampas o pagpalakpak ng mga kamay, marahil bilang mapanuyang kilos.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “at huwag mong hayaang madaig ka ng malaking pantubos.”
    reason: alternative_reading
  - marker: c
    text: Ang “pantubos” ay maaari ring unawaing “halagang pantakip-sala” o, sa ilang konteksto, “suhol.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinananatili ang panandang nagbibigay ng dahilan o batayan sa babala; maaari rin itong unawaing “Dahil.”
- source_word: חֵמָה
  choice: poot
  rationale: Ipinahahayag ang tindi ng nag-aalab na galit nang hindi tinutukoy kung ito ay poot ng Diyos, galit ni Job, o poot sa pangkalahatan.
- source_word: פֶּן
  choice: mag-ingat ka, baka
  rationale: Likas na babala sa modernong Tagalog na pinananatili ang diwang may posibleng masamang kahihinatnan.
- source_word: יְסִיתְךָ
  choice: akitin ka nito
  rationale: Ang anyong Hiphil ng סות ay maaaring mangahulugang udyukan, akitin, o iligaw; ang “akitin” ay angkop sa babala at hindi labis na nagpapaliwanag.
- source_word: בְסָפֶק
  choice: sa panlilibak
  rationale: Mahirap at pinagtatalunang salita ito. Ipinahahayag ng “panlilibak” ang malamang na idyomatikong diwa ng mapanuyang pagkilos, habang inilalagay sa talababa ang mas literal na posibilidad na pagpalakpak o paghampas ng mga kamay.
- source_word: רָב כֹּפֶר
  choice: malaking pantubos
  rationale: Likas na ipinapakita na ang רָב ay naglalarawan sa laki o halaga ng כֹּפֶר, nang hindi ito nililimitahan sa kahulugang “suhol.”
- source_word: אַל יַטֶּךָּ
  choice: huwag mong hayaang ilihis ka
  rationale: Pinananatili ang larawan ng paglihis mula sa wastong landas at ang lakas ng pagbabawal.
theological_decisions:
- issue: Kung kaninong poot ang tinutukoy
  choice: Iniwan bilang “ang poot” nang walang tahasang may-ari.
  alternative: “poot ng Diyos” o “sarili mong galit”
  rationale: Walang tahasang tinutukoy ang Hebreo, at kapuwa posible sa konteksto ang higit sa isang pagbasa. Hindi dapat lutasin ng salin ang sadyang nananatiling tensiyon.
- issue: Kahulugan ng כֹּפֶר
  choice: pantubos
  alternative: halagang pantakip-sala o suhol
  rationale: Saklaw ng salita ang pantubos o bayad upang maiwasan ang kaparusahan, at sa ilang konteksto ay suhol. Ang “pantubos” ang hindi gaanong nagtatakda ng isang tiyak na teolohikal o moral na pakahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang putol na diin pagkatapos ng “ang poot” sa pamamagitan ng gatlang upang maipakita ang bigat at bahagyang hirap ng Hebreong pagkakabuo, nang hindi ginagawang hindi likas ang pangungusap.
