  yaml_path: translation/ot/job/036/007.yaml
  text: He does not withdraw his eyes from the righteous[a], but with kings on the throne he seats them forever[b], and they are exalted.
translation:
  language: tl
  text: Hindi niya inaalis ang kanyang mga mata sa mga matuwid,[a] kundi kasama ng mga hari sa trono ay pinauupo niya sila magpakailanman, at itinataas sila.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O: “at ang mga hari sa trono—pinauupo niya sila roon magpakailanman.” Siksik ang Hebreo, at maaaring unawain ang sugnay na tuwirang tumutukoy sa mga hari sa halip na sa mga matuwid na pinauupong kasama nila.'
    reason: alternative_reading
  - marker: b
    text: 'O: “at itinataas niya sila.” Maaaring unawain ang huling pandiwa bilang aktibo, na ang Diyos ang ipinahihiwatig na simuno.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִגְרַע
  choice: inaalis
  rationale: Ang גרע ay nangangahulugang magbawas o mag-alis. Kasama ng “mga mata,” pinananatili ng “inaalis” ang konkretong larawang Hebreo ng hindi pagkakait ng Diyos ng kanyang mapagbantay na pagtingin.
- source_word: מִצַּדִּיק
  choice: sa mga matuwid
  rationale: Bagaman anyong isahan ang Hebreo, maaari itong tumukoy sa isang pangkalahatang uri; likas sa Filipino ang maramihang “mga matuwid,” lalo na dahil maramihan ang kasunod na panghalip.
- source_word: עֵינָיו
  choice: ang kanyang mga mata
  rationale: Pinananatili ang antropomorpikong larawan ng pinagmulang teksto sa halip na gawing abstraktong “pagkalinga” o “pansin.”
- source_word: וְאֶת מְלָכִים לַכִּסֵּא
  choice: kasama ng mga hari sa trono
  rationale: Siksik at eliptikal ang parirala. Ang saling ito ay nag-uugnay sa mga matuwid sa maharlikang karangalan nang hindi nagdaragdag ng isa pang pandiwang tahasang wala sa Hebreo.
- source_word: וַיֹּשִׁיבֵם
  choice: pinauupo niya sila
  rationale: Ang Hiphil ng ישׁב ay “magpaupo” o “maglagay na nakaupo.” Mas tuwiran ito kaysa “iniluluklok,” na mas tiyak at mas interpretatibo.
- source_word: לָנֶצַח
  choice: magpakailanman
  rationale: Likas at marangal na katumbas sa modernong Filipino para sa patuloy o walang hanggang tagal.
- source_word: וַיִּגְבָּהוּ
  choice: sila'y itinataas
  rationale: Ipinahahayag ang kinalabasang mataas na kalagayan habang hindi tahasang nilulutas sa pangunahing teksto ang maigsi at maaaring pagtalunang anyo ng pandiwa.
theological_decisions:
- issue: Antropomorpikong paglalarawan sa pansin ng Diyos
  choice: Panatilihin ang “kanyang mga mata.”
  alternative: “kanyang pagtingin,” “kanyang pagkalinga,” o “kanyang pansin”
  rationale: Ang konkretong larawan ay bahagi ng tula at hindi dapat patagin sa abstraktong paliwanag.
- issue: Tinutukoy ng “sila” sa maharlikang sugnay
  choice: Ang “sila” ay pangunahing inuunawang tumutukoy sa mga matuwid, na pinauupo kasama ng mga hari sa trono.
  alternative: Ang “sila” ay tumutukoy sa mga hari na pinauupo ng Diyos magpakailanman.
  rationale: Maaaring magsilbing kolektibong antecedent ang “matuwid,” ngunit siksik ang Hebreo kaya inilalahad sa talababa ang tunay na alternatibong pagbasa.
- issue: Simuno ng huling pandiwa
  choice: Isinalin bilang resultative/passive na “sila'y itinataas.”
  alternative: “itinataas niya sila”
  rationale: Hindi malinaw sa maigsi at walang patinig na anyo kung dapat idiin ang Diyos bilang ipinahiwatig na simuno o ang mataas na kalagayang sinapit nila; pinananatili ng teksto at talababa ang tensiyong ito.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang poetikong “mga mata,” iniwasan ang mas interpretatibong “iniluluklok,” at ginamit ang “pinauupo” upang manatiling malapit sa causative na pandiwang Hebreo. Ang mga tunay na sintaktiko at morpolohikong kalabuan ay inilagay sa mga talababa.
