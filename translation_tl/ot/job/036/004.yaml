  text: For truly[a], my words are not false; one perfect in knowledge is with you.
translation:
  language: tl
  text: Sapagkat tunay na hindi kasinungalingan ang mga salita ko; ang may ganap na kaalaman ay kasama mo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaaring ang “may ganap na kaalaman” ay tumutukoy sa Diyos sa halip na kay Elihu.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי אָמְנָם
  choice: Sapagkat tunay na
  rationale: Pinagsasama nito ang paliwanag na bisa ng כִּי at ang mariing pagpapatunay ng אָמְנָם sa natural at marangal na Tagalog.
- source_word: לֹא שֶׁקֶר מִלָּי
  choice: hindi kasinungalingan ang mga salita ko
  rationale: Tuwirang pinananatili ang pagtanggi sa kabulaanan at ang pangmaramihang diwa ng מִלָּי, habang natural ang ayos sa Tagalog.
- source_word: תְּמִים דֵּעוֹת
  choice: isang may ganap na kaalaman
  rationale: Ang תְּמִים ay nagpapahiwatig ng kabuuan o pagiging ganap, at ang pangmaramihang abstraktong דֵּעוֹת ay likas na naipapahayag bilang isahang abstraktong 'kaalaman' sa Tagalog. Hindi nito awtomatikong ipinahihiwatig ang kawalang-kasalanan.
- source_word: עִמָּךְ
  choice: ang kasama mo
  rationale: Pinananatili ang payak at tuwirang kahulugan ng preposisyong 'kasama/kapiling' at ang tuwirang pagtukoy kay Job.
theological_decisions:
- issue: Ang tinutukoy ng “isang may ganap na kaalaman”
  choice: Iniwan sa pangunahing teksto na pinakamadaling mabasa bilang pagtukoy ni Elihu sa sarili niya.
  alternative: Maaaring tumukoy ito sa Diyos bilang siyang may ganap na kaalaman at kasama ni Job.
  rationale: Ang malapit na konteksto ay pagtatanggol ni Elihu sa sarili niyang mga salita, ngunit walang tahasang panghalip o pangalan sa parirala. Kaya hindi dapat lubusang isara ang tunay na posibilidad na Diyos ang tinutukoy.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang matapang na retorika ng pahayag at ang kalabuan tungkol sa tinutukoy ng huling parirala.
