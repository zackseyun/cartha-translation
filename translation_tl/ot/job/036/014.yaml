  text: They die in youth[a], and their life ends among the male cult prostitutes.
translation:
  language: tl
  text: Namamatay sila sa kanilang kabataan, at nagwawakas ang kanilang buhay kasama ng mga lalaking prostituto na kaugnay ng kulto.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kasama ng mga itinalaga.” Malamang na tumutukoy ang salitang Hebreo sa mga lalaking prostituto na kaugnay ng paganong pagsamba.
    reason: alternative_reading
lexical_decisions:
- source_word: תָּמֹת
  choice: Namamatay sila
  rationale: Ang Qal imperfect ng מות ay tumutukoy sa pagkamatay. Ginawang maramihan sa Filipino upang maipahayag nang likas ang maramihang tinutukoy ng hulaping panghalip sa נַפְשָׁם.
- source_word: בַּנֹּעַר
  choice: sa kanilang kabataan
  rationale: Ang נֹעַר ay kabataan o maagang yugto ng buhay; malinaw at likas sa Filipino ang may panghalip na 'kanilang.'
- source_word: נַפְשָׁם
  choice: sila
  rationale: Dito, ang נֶפֶשׁ ay idiomatikong tumutukoy sa tao o buhay. Ang literal na 'ang kanilang kaluluwa ay namamatay' ay maaaring maghatid ng hindi nilalayong teolohikal na pahiwatig.
- source_word: וְחַיָּתָם
  choice: at nagwawakas ang kanilang buhay
  rationale: Ang anyo ay tumutukoy sa kanilang buhay o panahon ng pamumuhay. Ang 'nagwawakas' ay ipinahihiwatig ng paralelismo sa unang sugnay at kailangan upang maging buo at likas ang pangungusap sa Filipino.
- source_word: בַּקְּדֵשִׁים
  choice: kasama ng mga lalaking naglilingkod bilang bayarang seksuwal sa mga kulto
  rationale: Ang קְדֵשִׁים ay malamang na tumutukoy sa mga lalaking kaugnay ng seksuwal na gawain sa paganong pagsamba. Ang paglalarawan ay mas malinaw sa ordinaryong Filipino kaysa sa teknikal o tradisyonal na katawagan, habang pinananatili ang kasarian at kontekstong pangkulto.
theological_decisions:
- issue: Kahulugan ng קְדֵשִׁים
  choice: mga lalaking naglilingkod bilang bayarang seksuwal sa mga kulto
  alternative: mga itinalaga
  rationale: Sa gamit ng salitang Hebreo sa Lumang Tipan, malamang na hindi ito pangkalahatang tawag sa mga banal o itinalaga kundi sa mga lalaking kaugnay ng ipinagbabawal na seksuwal na gawain sa paganong kulto. Gayunman, inilalagay sa talababa ang mas literal na alternatibo upang mapanatili ang tunay na leksikal na posibilidad.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Iniwasan ang lumang katawagang may labis o mapanlinlang na konotasyon; ipinaliwanag nang tuwiran ang malamang na institusyong pangkulto.
