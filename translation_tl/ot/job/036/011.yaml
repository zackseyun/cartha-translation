base_translation:
  language: en
  yaml_path: translation/ot/job/036/011.yaml
  text: If they listen and serve[b][a], they will complete their days in prosperity and their years in pleasantness.
translation:
  language: tl
  text: Kung makikinig[a] sila at maglilingkod, gugugulin nila ang kanilang mga araw sa kasaganaan at ang kanilang mga taon sa kaluguran.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “makikinig at susunod”; maaari ring magpahiwatig ng masunuring pakikinig ang pandiwang Hebreo para sa “makinig.”
    reason: lexical_alternative
  - marker: b
    text: O “tatapusin nila ang kanilang mga araw sa mabuti at ang kanilang mga taon sa mga kaluguran.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Kung
  rationale: Malinaw na pinananatili ang kondisyunal na diwa ng sugnay.
- source_word: יִשְׁמְעוּ
  choice: makikinig sila
  rationale: Ang pandiwang שׁמע ay maaaring mangahulugang makarinig, makinig, o sumunod. Pinananatili ng “makikinig” ang pangunahing diwa habang ipinahihiwatig ng konteksto ang pagtugon.
- source_word: וְיַעֲבֹדוּ
  choice: at maglilingkod
  rationale: Malawak ang saklaw ng עבד bilang paglilingkod; hindi ito nililimitahan sa ritwal na pagsamba o karaniwang paggawa.
- source_word: יְכַלּוּ
  choice: gugugulin nila
  rationale: Sa kaugnayan ng “mga araw” at “mga taon,” ang כלה ay idyomatikong tumutukoy sa pagdaan o pagtatapos ng haba ng buhay. Natural sa Tagalog ang “gugugulin” at hindi nito ipinahihiwatig na sila mismo ang tatapos sa kanilang buhay.
- source_word: יְמֵיהֶם
  choice: ang kanilang mga araw
  rationale: Pinananatili ang malinaw na panulaang larawan at ang pagkakatapat nito sa “mga taon.”
- source_word: בַּטּוֹב
  choice: sa kasaganaan
  rationale: Ang substantibong טוֹב ay tumutukoy rito sa mabuti at maunlad na kalagayan; malinaw itong naihahatid ng “kasaganaan” nang hindi nililimitahan sa salapi.
- source_word: וּשְׁנֵיהֶם
  choice: at ang kanilang mga taon
  rationale: Literal at natural na katapat ng pariralang “ang kanilang mga araw,” kaya napapanatili ang paralelismo.
- source_word: בַּנְּעִימִים
  choice: sa kaluguran
  rationale: Inihahatid nito ang diwa ng mga bagay o kalagayang kaaya-aya at kasiya-siya, habang pinananatili ang matayog na himig ng tula.
theological_decisions:
- issue: Kung ang talata ay nangangako ng materyal na kasaganaan bilang isang ganap at pangkalahatang tuntuning teolohikal
  choice: Isinalin nang tuwiran bilang kondisyunal na pahayag ni Elihu tungkol sa mabuting kalagayan sa buhay.
  alternative: Basahin ito bilang pangkalahatang garantiya na laging hahantong sa materyal na yaman ang pagsunod, o bilang pangakong espirituwal lamang.
  rationale: Ipinahahayag ng Hebreo ang kondisyunal na pahayag ni Elihu sa anyong karunungan. Hindi dapat palawakin ng salin ang sinabi tungo sa isang ganap na doktrina, ni alisin ang payak na pagtukoy nito sa kaaya-ayang kalagayan sa buhay.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinananatili ang paralelismo ng “mga araw” at “mga taon,” at ginamit ang natural na “gugugulin” para sa idyomang tumutukoy sa pagtatapos ng haba ng buhay.
