  source_fidelity: 'Tapat ang salin sa pangunahing larawan ng Hebreo: tinatakpan niya ang kaniyang mga kamay/palad ng "liwanag," na sa konteksto ng unos ay makatwirang isinaling "kidlat," at inuutos niya ito kaugnay ng mahirap na pangwakas na parirala. Hindi ikinukubli ng mga talababa ang leksikal at sintaktikong kawalang-katiyakan.'
