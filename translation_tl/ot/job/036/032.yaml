base_translation:
  language: en
  yaml_path: translation/ot/job/036/032.yaml
  text: He covers his hands with lightning[b][a], and commands it to strike the mark.
translation:
  language: tl
  text: 'Tinatakpan niya ng kidlat[a] ang kanyang mga kamay,

    at inuutusan niya itong tumama sa puntirya.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “liwanag”; sa konteksto ng unos sa mga kalapit na talata, malamang na “kidlat” ang ibig sabihin.
    reason: lexical_alternative
  - marker: b
    text: Mahirap unawain ang huling parirala sa Hebreo. Maaari rin itong isalin na “laban sa tinatamaan nito” o “laban sa tagapamagitan.”
    reason: alternative_reading
lexical_decisions:
- source_word: כַּפַּיִם
  choice: kanyang mga kamay
  rationale: Ang dual na כַּפַּיִם ay tumutukoy sa dalawang palad o kamay. Mas natural sa modernong Tagalog ang “mga kamay,” habang napapanatili ang larawang pantao.
- source_word: כִּסָּה
  choice: tinatakpan
  rationale: Ang כּסה ay nangangahulugang “takpan” o “ikubli.” Ang “tinatakpan” ay tuwiran at hindi labis na nagpapakahulugan sa talinghaga.
- source_word: אוֹר
  choice: kidlat
  rationale: Karaniwang nangangahulugang “liwanag” ang אוֹר, ngunit sa konteksto ng unos at kulog sa paligid ng talata, malamang na kidlat ang tinutukoy.
- source_word: וַיְצַו
  choice: inuutusan
  rationale: Ang צוה ay “mag-utos.” Pinananatili ng “inuutusan” ang personal na kapangyarihan at pagkilos ng Diyos sa kidlat.
- source_word: עָלֶיהָ
  choice: itong
  rationale: Mahirap tiyakin ang tinutukoy ng pambabaeng hulapi. Sa salin, ang “itong” ay natural na tumutukoy sa kidlat nang hindi ginagawang tahasan ang gramatikal na kasarian.
- source_word: בְמַפְגִּיעַ
  choice: tumama sa puntirya
  rationale: Napakahirap ng anyong ito mula sa פגע at maaaring tumukoy sa tumatama, sinasalakay, o namamagitan. Sa konteksto ng unos, ang pag-uutos sa kidlat na tumama sa puntirya ay malinaw ngunit ang ibang pagbasa ay inilalahad sa talababa.
theological_decisions:
- issue: Posibleng kahulugang “tagapamagitan” ng בְמַפְגִּיעַ
  choice: tumama sa puntirya
  alternative: laban sa tagapamagitan / laban sa tinatamaan nito
  rationale: Hindi ginawang teolohikal na “tagapamagitan” ang parirala dahil mas umaangkop sa konteksto ng unos ang pagpatama ng kidlat, ngunit pinanatili sa talababa ang tunay na kalabuan ng Hebreo.
translation_notes:
  register: Makabagong Filipino Tagalog na marangal at madaling maunawaan. Pinanatili ang masidhing larawang patula ng mga kamay na natatakpan ng kidlat, habang inilagay sa talababa ang leksikal at sintaktikong kalabuan.
