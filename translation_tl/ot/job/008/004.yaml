  text: If your sons sinned against him[a], he gave them over into the hand of their transgression.
translation:
  language: tl
  text: Kung nagkasala laban sa kanya ang iyong mga anak na lalaki, ibinigay niya sila sa kapangyarihan ng kanilang pagsuway.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa literal: “ibinigay niya sila sa kamay ng kanilang pagsuway.” Ang “sa kamay ng” ay idyomang Hebreo na nangangahulugang “sa kapangyarihan ng.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Kung
  rationale: Pinananatili ang karaniwang kondisyunal na diwa ng Hebreo at hindi ito ginagawang tiyak na sanhi sa pamamagitan ng “yamang” o “dahil.”
- source_word: בָּנֶיךָ
  choice: iyong mga anak
  rationale: Bagaman literal na “mga anak na lalaki,” natural sa modernong Tagalog ang “mga anak,” at maaari rin itong tumukoy nang kolektibo sa mga supling ni Job sa kontekstong ito.
- source_word: חָטְאוּ לוֹ
  choice: nagkasala sa kanya
  rationale: Ang ל kasunod ng חטא ay tumutukoy sa pinagkasalahan; natural na katumbas sa Tagalog ang “nagkasala sa kanya.”
- source_word: וַיְשַׁלְּחֵם
  choice: ibinigay niya sila
  rationale: Sa kasunod na pariralang “sa kamay ng,” ang pandiwa ay may diwang ipinailalim o ibinigay sa kapangyarihan, hindi lamang pinayaong umalis.
- source_word: בְּיַד
  choice: sa kapangyarihan ng
  rationale: Ang literal na “sa kamay ng” ay idyomang Hebreo para sa pagpapailalim sa kapangyarihan o kontrol; malinaw at natural sa Tagalog ang kahulugang ito.
- source_word: פִּשְׁעָם
  choice: sarili nilang pagsuway
  rationale: Ang פשע ay tumutukoy sa kusang paglabag o pagrerebelde, na mas matindi kaysa sa pangkalahatang חטא. Ang “pagsuway” ay natural at pinananatili ang pagkakaibang iyon.
theological_decisions:
- issue: Tinutukoy ng panghalip na “kanya”
  choice: Pinanatili ang panghalip; sa konteksto, tumutukoy ito sa Diyos.
  alternative: Tahasang isalin bilang “sa Diyos.”
  rationale: Malinaw sa konteksto na Diyos ang tinutukoy, ngunit panghalip ang nasa Hebreo. Ang pagpapanatili nito ay umiiwas sa hindi kailangang pagpapaliwanag sa mismong teksto.
- issue: Ugnayan ng pagkakasala at sinapit ng mga anak
  choice: “ibinigay niya sila sa kapangyarihan ng sarili nilang pagsuway”
  alternative: “itinaboy niya sila dahil sa kanilang pagsuway”
  rationale: Pinananatili ng salin ang kilos ng Diyos at ang matalinghagang kapangyarihan ng kanilang sariling pagsuway, nang hindi dinaragdagan ang teksto ng mas tiyak na paliwanag tungkol sa pagganti.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “kapangyarihan” sa pangunahing teksto upang natural na maipahayag ang idyomang Hebreo; inilagay sa talababa ang literal na larawan ng “kamay.”
