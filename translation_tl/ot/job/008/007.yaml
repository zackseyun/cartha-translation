base_translation:
  language: en
  yaml_path: translation/ot/job/008/007.yaml
  text: Though your beginning was small[a], your latter end will increase greatly.
translation:
  language: tl
  text: Maliit man ang naging pasimula mo,[a] lalago nang lubha ang kalagayan mo sa bandang huli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “At maliit ang naging pasimula mo, ngunit magiging napakadakila ang iyong hinaharap.”
    reason: Posibleng unawain ang unang pang-ugnay bilang payak na “at” sa halip na pasalungat na “maliit man,” at ang אַחֲרִית bilang “hinaharap.”
lexical_decisions:
- source_word: וְהָיָה
  choice: Maliit man ang naging
  rationale: Ipinahahayag ng “man” ang pasalungat na ugnayan ng maliit na pasimula at ng malaking paglago sa bandang huli. Posible rin ang payak na “at naging,” kaya pinanatili sa talababa ang alternatibo.
- source_word: רֵאשִׁיתְךָ
  choice: pasimula mo
  rationale: Tuwirang ipinahahayag nito ang unang yugto o panimulang kalagayan ng tinutukoy na tao sa natural na modernong Tagalog.
- source_word: מִצְעָר
  choice: maliit
  rationale: Ipinapahiwatig ng salita ang kaliitan o kawalang-halaga; ang “maliit” ang pinakamaikli at pinakanatural sa paghahambing dito.
- source_word: אַחֲרִיתְךָ
  choice: kalagayan mo sa bandang huli
  rationale: Maaaring tumukoy ang salita sa wakas, kahihinatnan, o hinaharap. Iniiwasan ng pariralang ito ang maling pahiwatig na kamatayan lamang ang tinutukoy habang pinananatili ang diin sa magiging huling kalagayan.
- source_word: יִשְׂגֶּה
  choice: lalago
  rationale: Ipinahahayag ng pandiwa ang paglaki o pag-unlad mula sa maliit na pasimula tungo sa higit na kalagayan.
- source_word: מְאֹד
  choice: nang lubha
  rationale: Pinananatili nito ang matinding pagpapalakas ng pang-abay at marangal ang himig nang hindi makaluma.
