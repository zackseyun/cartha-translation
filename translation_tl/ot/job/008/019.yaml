  yaml_path: translation/ot/job/008/019.yaml
  text: Behold[a], this is the joy of his way[b], and out of the dust others will sprout.
translation:
  language: tl
  text: Tingnan mo, ito ang kagalakan ng kanyang landas[a], at mula sa alabok ay may iba pang sisibol.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “siya ang kagalakan ng kanyang landas.” Maaaring unawain nang mas personal ang panghalip sa Hebreo, ngunit maaaring tumukoy ang “ito” sa kinahinatnan ng halamang inilarawan sa naunang mga talata.
    reason: alternative_reading
  - marker: b
    text: O “at mula sa alabok ay may isa pang sisibol.” Singular ang אַחֵר (“iba” o “isa pa”), ngunit plural ang pandiwang Hebreo.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶן
  choice: Tingnan mo
  rationale: Isang pantawag-pansin na may mariing puwersa; natural itong pakinggan sa makabagong Filipino habang pinananatili ang sigla ng tula.
- source_word: הוּא
  choice: ito
  rationale: Bagaman maaari itong mangahulugang 'siya,' malamang na itinuturo rito ang kalagayan o kinahinatnang kalalarawan pa lamang.
- source_word: מְשׂוֹשׂ
  choice: kagalakan
  rationale: Tuwirang ipinapahayag ang diwa ng tuwa o galak at angkop sa marangal na wikang patula.
- source_word: דַּרְכּוֹ
  choice: kanyang landas
  rationale: Pinananatili ng 'landas' ang literal at matalinghagang saklaw ng דֶּרֶךְ sa konteksto.
- source_word: וּמֵעָפָר
  choice: at mula sa alabok
  rationale: Ipinahahayag ang pinagmulan at pinananatili ang biblikal at patulang larawan ng עָפָר.
- source_word: אַחֵר
  choice: may ibang
  rationale: Singular ang anyo ng salita ngunit plural ang kasunod na pandiwa; sa Filipino, ang 'may ibang' ay likas na nakapag-iiwan ng bilang na di-tiyak at hindi sapilitang nilulutas ang tensiyong ito.
- source_word: יִצְמָחוּ
  choice: sisibol
  rationale: Pinananatili ang malinaw na larawang pambotanika ng pandiwang צמח; ang Filipino ay hindi minamarkahan ang bilang sa pandiwa.
