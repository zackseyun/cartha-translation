translation_notes:
  register: Makabago, natural, at marangal na Filipino na may bahagyang patulang himig. Ginamit ang “Tingnan mo” sa halip na arkaikong “Narito,” at pinanatili ang “alabok,” “landas,” at “sisibol” upang maingatan ang imahen at tunay na kalabuan ng Hebreo.
