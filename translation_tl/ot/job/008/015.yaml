  yaml_path: translation/ot/job/008/015.yaml
  text: He leans on his house[a], but it does not stand; he grasps hold of it[b], but it does not remain standing.
translation:
  language: tl
  text: 'Sumasandal siya sa kanyang bahay[a], ngunit hindi ito nakatatayo;

    mahigpit niya itong hinahawakan[b], ngunit hindi ito nananatiling nakatayo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Umaasa siya sa kanyang bahay.” Ang pandiwang Hebreo ay maaaring tumukoy kapuwa sa pisikal na pagsandal at sa pagdepende sa isang bagay bilang suporta.
    reason: lexical_alternative
  - marker: b
    text: Ang pag-uulit ng larawan ng “pagtayo” at “pananatiling nakatayo” ay nagpapanatili sa paralelismo ng tulang Hebreo. Ipinahihiwatig nito na ang kanyang sinasandalan ay hindi matatag.
    reason: cross_reference
lexical_decisions:
- source_word: יִשָּׁעֵן
  choice: Sumasandal
  rationale: Pinananatili ang kongkretong larawan ng pag-asa sa isang bagay bilang panukod, habang naipahihiwatig din ang pagdepende rito.
- source_word: עַל
  choice: sa
  rationale: Likas na pang-ukol sa Filipino kasama ng “sumasandal,” na nagpapahayag ng pisikal na pagsuporta.
- source_word: בֵּיתוֹ
  choice: kanyang bahay
  rationale: Ang karaniwang kahulugan ng בַּיִת ay “bahay.” Hindi ito pinalitan ng “sambahayan” o ng tahasang interpretasyon upang mapanatili ang larawan sa Hebreo.
- source_word: וְלֹא יַעֲמֹד
  choice: ngunit hindi ito nakatatayo
  rationale: Ang עמד ay tumutukoy sa pagtayo o pananatiling nakatayo. Ang “ngunit” ay natural na naghahayag ng salungat na resulta, at ang pangkasalukuyang anyo ay angkop sa pangkalahatang paglalarawan.
- source_word: יַחֲזִיק
  choice: mahigpit niya itong hinahawakan
  rationale: Inilalarawan ng Hiphil ng חזק ang aktibong paghawak o pagkapit nang mahigpit; pinananatili rito ang malinaw na pisikal na kilos.
- source_word: בּוֹ
  choice: itong
  rationale: Ang panghalip ay tumutukoy pabalik sa bahay bilang bagay na mahigpit na hinahawakan.
- source_word: וְלֹא יָקוּם
  choice: ngunit hindi ito nananatiling nakatayo
  rationale: Sa pagkakatulad nito sa עמד, ipinakikita ng קום na hindi nananatiling matatag o nakatayo ang sinasandalan. Pinanatili ang larawan ng pagtayo sa halip na gawing abstraktong “hindi nagtatagal.”
