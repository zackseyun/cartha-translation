  yaml_path: translation/ot/job/008/020.yaml
  text: Behold[a], God does not reject the blameless, nor does he uphold the hand of evildoers.
translation:
  language: tl
  text: Tunay,[a] hindi itinatakwil ng Diyos ang walang kapintasan, ni hindi niya sinusuportahan ang mga gumagawa ng masama.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Masdan” o “Tiyak na.”
    reason: lexical_alternative
  - marker: b
    text: O, mas literal, “ni hindi niya hinahawakan ang kamay ng mga gumagawa ng masama.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶן
  choice: Tunay
  rationale: Naghahayag ito ng mariing paninindigan. Mas likas sa makabagong Tagalog ang “Tunay” kaysa sa literal ngunit di-gaanong natural na “Narito.”
- source_word: אֵל
  choice: Diyos
  rationale: Karaniwang patulang katawagan ito sa Diyos; walang tahasang salitang “Makapangyarihan” sa talata.
- source_word: יִמְאַס
  choice: itinatakwil
  rationale: Ipinahahayag ng מאס ang pagtanggi o pagtatakwil; ang “itinatakwil” ay angkop sa kontekstong moral at ugnayan nang hindi ipinapasok ang diwang emosyonal ng pagkamuhi.
- source_word: תָּם
  choice: ang taong walang kapintasan
  rationale: Ang pang-uri ay ginamit bilang pangngalan at tumutukoy sa isang lalaking buo ang pagkatao o walang maipipintas sa moral na diwa. Pinananatili ng parirala ang panlalaking anyo at ang mahalagang bokabularyo ng Job.
- source_word: יַחֲזִיק
  choice: aalalayan
  rationale: Sa Hiphil at kasama ng “kamay,” maaari itong mangahulugang humawak, magpalakas, o sumuporta. Ipinahahayag ng “aalalayan” ang idiomatikong diwa habang pinananatili ang larawan ng kamay.
- source_word: בְּיַד
  choice: ang kamay ng
  rationale: Pinananatili nito ang konkretong larawan ng Hebreong idyoma sa halip na ganap itong gawing abstraktong “susuportahan.”
- source_word: מְרֵעִים
  choice: mga gumagawa ng masama
  rationale: Aktibong participle ito mula sa רעע; mas malinaw na naipapakita ng parirala ang mga taong gumagawa ng masama kaysa sa mas pangkalahatang “masasama.”
theological_decisions:
- issue: Kahulugan ng idyomang וְלֹא יַחֲזִיק בְּיַד מְרֵעִים
  choice: “hindi niya aalalayan ang kamay ng mga gumagawa ng masama”
  alternative: “hindi niya hahawakan ang kamay ng mga gumagawa ng masama” o “hindi niya susuportahan ang mga gumagawa ng masama”
  rationale: Pinananatili ng salin ang konkretong larawan ng kamay ngunit ipinahihiwatig din ang pagsuporta o pagtulong. Hindi nito nilulutas nang sobra ang leksikal na lawak ng יַחֲזִיק.
translation_notes:
  register: Makabago, marangal, at patulang Tagalog. Ginamit ang “Tunay” bilang likas na mariing panimula, at pinanatili ang larawan ng kamay sa ikalawang linya.
