  source_fidelity: 'Ang pangunahing diwa ay tapat sa Hebreo: ang עַד אָן ay wastong “Hanggang kailan,” plural ang “mga bagay na ito,” at napananatili ang metapora ng “malakas na hangin.” Gayunman, ang “patuloy na magsasalita” ay nagdaragdag ng aspektong “keep/continue” na posible sa konteksto ngunit hindi kailangang ipilit ng anyong Hebreo. Mas maingat ang payak na “magsasalita.”'
