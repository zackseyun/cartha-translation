  text: How long will you keep saying these things[a], and the words of your mouth be a mighty wind?
translation:
  language: tl
  text: 'Hanggang kailan ka magsasalita ng mga bagay na ito,

    at magiging malakas na hangin ang mga salita ng iyong bibig?[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Hanggang kailan mo sasabihin ang mga bagay na ito, at magiging malakas na hangin ang mga salita ng iyong bibig?”
    reason: lexical_alternative
lexical_decisions:
- source_word: עַד אָן
  choice: Hanggang kailan
  rationale: Likas na katumbas sa Tagalog ng idyomatikong tanong na nagpapahayag ng pagkainip at pagsaway.
- source_word: תְּמַלֶּל
  choice: ka patuloy na magsasalita
  rationale: Ipinahihiwatig ng anyo at konteksto ang nagpapatuloy na pagsasalita; malinaw itong naihahayag sa modernong Tagalog nang hindi lumalampas sa saklaw ng salita.
- source_word: אֵלֶּה
  choice: ng mga bagay na ito
  rationale: Pinananatili ang pangmaramihang demonstratibo at hindi labis na tinutukoy bilang mga salita, yamang tahasang binabanggit ang mga salita sa ikalawang hati.
- source_word: וְרוּחַ כַּבִּיר
  choice: at magiging malakas na hangin
  rationale: 'Pinananatili ang matingkad na metapora ng hangin at ang diwa ng lakas ng כַּבִּיר. Ang balangkas ng Hebreo ay maaaring unawain bilang pagpapatuloy ng tanong: gaano katagal magiging gaya ng malakas na hangin ang kanyang mga salita.'
- source_word: אִמְרֵי פִיךָ
  choice: ang mga salita ng iyong bibig
  rationale: Pormal ngunit malinaw na parirala na nagpapanatili sa kongkretong larawan at paralelismo ng tulang Hebreo.
theological_decisions: []
translation_notes:
  register: Makabago at dignidad na Filipino, na pinananatili ang patulang paralelismo at matalim na tono ng pagsaway ni Bildad. Ginamit ang “patuloy na magsasalita” para sa duratibong puwersa sa konteksto; inilagay ang talababa upang mapanatili ang mas payak na alternatibong “sasabihin.”
