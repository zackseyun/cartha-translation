  yaml_path: translation/ot/job/008/022.yaml
  text: Those who hate you will be clothed with shame[a], and the tent of the wicked will be no more.
translation:
  language: tl
  text: Ang mga napopoot sa iyo ay magdadamit ng kahihiyan, at ang tolda ng masasama ay hindi na iiral.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas literal, “ang tolda ng masasama ay wala.”
    reason: Pinananatili ang posibleng mas literal at pangkasalukuyang pagbasa ng אֵינֶנּוּ.
lexical_decisions:
- source_word: שֹׂנְאֶיךָ
  choice: ang mga napopoot sa iyo
  rationale: Ang Qal active participle na maramihan na may hulaping ikalawang panauhang panlalaki na isahan ay ginagamit bilang pangngalan. Likas sa modernong Tagalog ang “mga napopoot sa iyo” at malinaw na pinananatili ang personal na layon na “iyo.”
- source_word: יִלְבְּשׁוּ
  choice: mabibihisan ng
  rationale: Ang pandiwang לבשׁ ay tumutukoy sa pagsusuot o pagkakabihis. Sa kasamang abstraktong pangngalang “kahihiyan,” pinananatili ng “mabibihisan ng” ang metapora at natural itong pakinggan sa Tagalog.
- source_word: בֹשֶׁת
  choice: kahihiyan
  rationale: Saklaw ng “kahihiyan” ang personal na pagkapahiya at hayag na kasiraang-puri nang hindi labis na nililinaw ang alinman sa dalawang diwa.
- source_word: וְאֹהֶל
  choice: at ang tolda
  rationale: Literal na “tolda” ang אֹהֶל. Bagaman maaari itong kumatawan sa tahanan o sambahayan, pinananatili rito ang kongkretong larawan ng tulang Hebreo.
- source_word: רְשָׁעִים
  choice: ng masasama
  rationale: Ang pangmaramihang substantibong pang-uri ay tumutukoy sa uring binubuo ng masasamang tao. Natural at maikli sa Tagalog ang “ng masasama.”
- source_word: אֵינֶנּוּ
  choice: ay mawawala na
  rationale: Pormal itong eksistensiyal na pagtanggi, “ito ay wala/hindi umiiral.” Sa daloy ng mga magiging kalalabasan sa talata, natural na ipinahahayag sa hinaharap ng “mawawala na,” habang inilalagay sa talababa ang mas literal na anyo.
theological_decisions:
- issue: Panahong ipinahihiwatig ng huling sugnay
  choice: 'Panghinaharap o resultative: “ang tolda ng masasama ay mawawala na”'
  alternative: 'Pangkasalukuyan o mas literal: “ang tolda ng masasama ay wala”'
  rationale: Ang konteksto ng Job 8:20–22 ay tumutukoy sa mga ipinangakong kalalabasan para kay Job at sa kaniyang mga kalaban. Kaya ang anyong panghinaharap ang mas natural sa diskurso, ngunit hindi itinatago ang pormal na pangkasalukuyang eksistensiyal na pagtanggi ng Hebreo.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Pinanatili ang matalinghagang “mabibihisan ng kahihiyan” at ang kongkretong larawang “tolda,” sa halip na gawing “sambahayan.” Inilagay ang talababa sa huling sugnay na aktuwal nitong ipinapaliwanag.
