lexical_decisions:
- source_word: וַיַּעַן
  choice: sumagot
  rationale: Karaniwang ipinapahayag ng ענה sa pormulang pambungad ng usapan ang pagsagot o pagtugon; natural at angkop dito ang “sumagot.”
- source_word: בִּלְדַּד
  choice: Bildad
  rationale: Isinalin-titik ang pangalang pantangi ayon sa karaniwang anyo nito sa Tagalog na Bibliya.
- source_word: הַשּׁוּחִי
  choice: na Suhita
  rationale: Ipinahihiwatig ng katawagang ito ang kaugnayan ni Bildad sa angkan o lupaing nauugnay kay Shuah; ang “Suhita” ay maikli at likas na anyong Tagalog para sa katawagang gentiliko.
- source_word: וַיֹאמַר
  choice: at sinabi
  rationale: Pinananatili ang ikalawang pandiwa sa Hebreong pormulang “sumagot ... at sinabi,” sa halip na alisin bilang kalabisan.
- source_word: וַ
  choice: Pagkatapos
  rationale: Ang unang waw ay nagsusulong sa pagkakasunod-sunod ng salaysay; malinaw at natural sa modernong Tagalog ang “Pagkatapos.”
