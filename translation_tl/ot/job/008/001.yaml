  text: Then Bildad the Shuhite answered and said:[a][b]
translation:
  language: tl
  text: 'Pagkatapos, sumagot si Bildad na Suhita[a] at sinabi:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “Suhita” ay tumutukoy sa isang taong kabilang sa bayan o lupaing nauugnay kay Shuah.
