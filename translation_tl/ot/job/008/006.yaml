  yaml_path: translation/ot/job/008/006.yaml
  text: If you are pure and upright[c][b][a], surely even now he will rouse himself for you and restore your righteous dwelling.
translation:
  language: tl
  text: Kung ikaw ay dalisay at matuwid, tiyak na ngayon ay kikilos siya alang-alang sa iyo[a] at panunumbalikin niya[b] ang matuwid mong tahanan.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “gigising siya para sa iyo” o “pupukawin niya ang sarili niya alang-alang sa iyo.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “gagawin niyang buo” o “gagantihan niya.” Ang pandiwang Hebreo ay maaaring mangahulugang magsauli, gawing ganap, o magbayad/gumanti.
    reason: lexical_alternative
  - marker: c
    text: Sa literal, “ang tahanan ng iyong katuwiran.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Kung
  rationale: Karaniwang panandang pasubali na nagpapakilala sa kondisyong inilalahad ni Bildad.
- source_word: זַךְ
  choice: dalisay
  rationale: Ipinahahayag ang kalinisan o kadalisayang moral nang hindi labis na pinatitindi tungo sa teknikal na kahulugang legal na kawalang-sala.
- source_word: יָשָׁר
  choice: matuwid
  rationale: Likas at kinikilalang katumbas sa bokabularyo ng karunungan para sa wastong asal at moral na katuwiran.
- source_word: כִּי עַתָּה
  choice: tiyak na ... ngayon
  rationale: Itinuturing ang כִּי bilang pagbibigay-diin sa resulta ng kondisyon; pinananatili ng “ngayon” ang agarang diwa ng עַתָּה.
- source_word: יָעִיר עָלֶיךָ
  choice: kikilos siya ngayon para sa iyo
  rationale: Ipinahahayag sa natural na Filipino ang larawang paggising o pagpukaw bilang pagkilos alang-alang sa isang tao; inilalahad sa talababa ang mas literal na mga posibilidad.
- source_word: וְשִׁלַּם
  choice: panunumbalikin niya
  rationale: Sa bagay na “tahanan,” pinakamalinaw ang diwang ibabalik sa maayos o ganap na kalagayan, habang kinikilala sa talababa ang mga kahulugang gawing buo o gantihan/bayaran.
- source_word: נְוַת
  choice: tahanan
  rationale: Natural at malawak na salitang maaaring tumukoy sa tirahan at, ayon sa konteksto, sa sambahayan o ari-arian.
- source_word: צִדְקֶךָ
  choice: matuwid mong
  rationale: Natural na anyong pang-uri sa Filipino para sa pariralang konstrukto; pinananatili sa talababa ang literal na “tahanan ng iyong katuwiran.”
theological_decisions:
- issue: Di-tahasang simuno ng mga pandiwa sa resulta ng kondisyon
  choice: Pinanatili ang panghalip na “siya,” na tumutukoy sa Diyos ayon sa konteksto.
  alternative: Tahasan na idagdag ang pangngalang “Diyos.”
  rationale: Walang hayag na pangngalang simuno sa Hebreo. Nauunawaan sa konteksto na Diyos ang tinutukoy, ngunit iniiwasang magdagdag ng pangngalang wala sa mismong talata.
- issue: Lakas ng pahayag ni Bildad
  choice: Isinalin bilang tiyak na kondisyunal na pahayag ni Bildad, nang walang komentaryong sumasang-ayon o tumututol dito.
  alternative: Palambutin o lagyan ng distansiya ang pahayag upang hindi magmukhang itinataguyod ng tagapagsalaysay.
  rationale: Dapat katawanin nang tapat ang sinabi ng tauhan habang hindi ipinapalagay na ang kaniyang pananaw tungkol sa pagganti ng Diyos ay paghatol ng tagapagsalaysay.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “dalisay at matuwid” para sa magkatambal na katangiang moral, at “tahanan” upang manatiling bukas ang saklaw mula tirahan hanggang sambahayan o ari-arian.
