lexical_decisions:
- source_word: הֲלֹא
  choice: Hindi ... ba
  rationale: Pinananatili ang retorikal na tanong na umaasang sasang-ayon ang kausap.
- source_word: הֵם
  choice: nila
  rationale: Tumutukoy sa mga naunang salinlahi na binanggit sa konteksto; likas sa Filipino ang enclitic na panghalip dito.
- source_word: יוֹרוּךָ
  choice: tuturuan ka
  rationale: Tuwirang ipinahahayag ang Hiphil ng ירה na nangangahulugang magturo o magbigay-aral.
- source_word: יֹאמְרוּ לָךְ
  choice: kakausapin ka
  rationale: Natural na Filipino para sa pagsasalita nila sa kausap, habang nananatiling kaiba sa pandiwang 'tuturuan.'
- source_word: וּמִלִּבָּם
  choice: mula sa kanilang puso
  rationale: Pinananatili ang larawang Hebreo ng puso bilang kaloob-loobang pinagmumulan ng pag-iisip at pananalita.
- source_word: יוֹצִיאוּ
  choice: maglalabas
  rationale: Pinananatili ang metapora ng pagpapalabas sa mga salitang nagmumula sa kalooban.
- source_word: מִלִּים
  choice: mga salita
  rationale: Payak at tumpak na katumbas na angkop sa konteksto ng karunungan.
