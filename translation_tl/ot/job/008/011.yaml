  yaml_path: translation/ot/job/008/011.yaml
  text: Does papyrus grow where there is no marsh? Does reed grass flourish without water?[a]
translation:
  language: tl
  text: Tutubo ba ang papiro kung walang latian? Lalago ba ang damong-tambo kung walang tubig?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “tambo” sa halip na “papiro” at “halamang-latian” sa halip na “damong-tambo”; dalawang halamang tumutubo sa latian ang magkatambal na binabanggit sa Hebreo.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲ/יִגְאֶה
  choice: Tutubo ba
  rationale: Ang הֲ ay nagpapakilala ng retorikal na tanong, at ang גאה rito ay tumutukoy sa paglaki ng halaman. Ang “tutubo” ay likas at malinaw sa Filipino.
- source_word: גֹּמֶא
  choice: papiro
  rationale: Karaniwang tumutukoy ang גמא sa halamang papyrus na tumutubo sa latian; pinananatili ng “papiro” ang malamang na tiyak na halaman.
- source_word: בְּלֹא בִצָּה
  choice: kung walang latian
  rationale: Ipinahahayag ng בלא ang kawalan at ang ביצה ay latian o lusak. Ang “kung walang latian” ay natural na Filipino at angkop sa retorikal na tanong.
- source_word: יִשְׂגֶּה
  choice: Lalago ba
  rationale: Ipinahihiwatig ng שׂגה ang masagana o malusog na paglaki. Ang “lalago” ay naghahatid ng ganitong diwa at kaagapay ng “tutubo.”
- source_word: אָחוּ
  choice: damong-tambo
  rationale: Tumutukoy ang אָחוּ sa halamang tumutubo sa basang lugar, marahil ay uri ng damo o tambo. Ang “damong-tambo” ay nauunawaan at naihihiwalay sa papiro habang pinananatili ang kaunting katiyakan sa eksaktong uri.
- source_word: בְלִי מָיִם
  choice: kung walang tubig
  rationale: Tuwirang ipinahahayag ng parirala ang kawalan ng tubig. Ang “kung walang tubig” ay natural na kaparis ng unang tanong.
