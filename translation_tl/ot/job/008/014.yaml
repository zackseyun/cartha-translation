translation:
  language: tl
  text: 'Ang kanyang pag-asa ay mapuputol[a][b],

    at ang kanyang pinagtitiwalaan ay bahay ng gagamba.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kumpiyansa”; ang salitang Hebreo ay maaaring tumukoy sa pag-asa, kumpiyansa, o katiwasayan sa kontekstong ito.
    reason: lexical_alternative
  - marker: b
    text: Bihira at pinagtatalunan ang pandiwang Hebreo na isinaling “mapuputol.” Maaari rin itong mangahulugang “mahihiwalay” o, bagaman di-gaanong malamang dito, “kinasusuklaman.”
    reason: lexical_alternative
  - marker: c
    text: Ibig sabihin, ang kanyang pinagtitiwalaan ay marupok na gaya ng bahay o sapot ng gagamba.
    reason: cultural_note
lexical_decisions:
- source_word: אֲשֶׁר
  choice: Ang kanyang
  rationale: Iniuugnay ng panghalip na pamanggit ang talata sa taong tinutukoy sa naunang konteksto. Sa natural na Filipino, ang sugnay ay maayos na naipapahayag sa pamamagitan ng “Ang kanyang” nang hindi pinipilit ang isang saling literal na alanganin.
- source_word: יָקוֹט
  choice: ay mapuputol
  rationale: Bihira at pinagtatalunan ang pandiwa. Ang “mapuputol” ay umaangkop sa larawan ng biglang pagkawala ng pag-asa o katiwasayan at pinananatili ang posibleng diwa ng pagkaputol; inilalahad sa talababa ang ibang posibilidad.
- source_word: כִּסְלוֹ
  choice: kanyang pag-asa
  rationale: Sa kontekstong ito, tumutukoy ang pangngalan sa pag-asa, tiwala, o katiwasayan, gaya ng ipinahihiwatig ng kaagapay na מִבְטַחוֹ. Natural at malinaw sa Filipino ang “pag-asa,” habang pinananatili sa talababa ang “kumpiyansa” bilang alternatibo.
- source_word: וּבֵית
  choice: at ... bahay
  rationale: Pinananatili ng “at” ang parallel na ikalawang linya at ng “bahay” ang kongkretong metapora sa Hebreo.
- source_word: עַכָּבִישׁ
  choice: ng gagamba
  rationale: Karaniwang modernong salin ng pangngalan at natural na anyo para sa pariralang construct na “bahay ng gagamba.”
- source_word: מִבְטַחוֹ
  choice: kanyang pinagtitiwalaan
  rationale: Maaaring tukuyin ng pangngalan ang batayan o bagay na pinaglalagakan ng tiwala. Mas malinaw sa Filipino ang “pinagtitiwalaan” kaysa abstraktong “tiwala” dahil ang ikalawang hati ay inihahalintulad iyon sa bahay ng gagamba.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na dignified at madaling maunawaan. Pinanatili ang konkretong “bahay ng gagamba” sa pangunahing teksto sa halip na palitan agad ng “sapot,” at ipinaliwanag ang ipinahihiwatig na karupukan sa talababa. Ang hati ng mga linya ay sumasalamin sa parallelism ng Hebreo.
