source:
  edition: WLC
  text: הַ֭/אֵל יְעַוֵּ֣ת מִשְׁפָּ֑ט וְ/אִם שַׁ֝דַּ֗י יְעַוֵּֽת צֶֽדֶק־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/008/003.yaml
  text: Does God pervert justice[a], or does the Almighty pervert righteousness?
translation:
  language: tl
  text: Binabaluktot ba ng Diyos ang katarungan[a], o binabaluktot ba ng Makapangyarihan sa Lahat ang katuwiran?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “paghatol”; maaari ring isalin ang buong talata: “Binabaluktot ba ng Diyos ang paghatol, o binabaluktot ba ng Makapangyarihan sa Lahat ang katarungan?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַאֵל
  choice: ba ng Diyos
  rationale: Ang הַ ay panandang patanong na bumubuo ng tanong na masasagot ng oo o hindi, at ang אֵל dito ay karaniwang titulong “Diyos,” hindi pangalang pantangi.
- source_word: יְעַוֵּת
  choice: binabaluktot
  rationale: Ang Piel ng עוה ay tumutukoy sa paggawang baluktot o paglihis sa tama, lalo na sa legal at moral na konteksto. Ang “binabaluktot” ay malinaw, matindi, at natural sa modernong Tagalog.
- source_word: מִשְׁפָּט
  choice: katarungan
  rationale: Dito, ang מִשְׁפָּט ay tumutukoy sa makatarungang paghatol o sa pamantayan ng katarungan. Ang “katarungan” ang pinakanatural sa pangunahing teksto, habang inilalahad sa talababa ang “paghatol” bilang leksikal na alternatibo.
- source_word: וְאִם
  choice: o ... ba
  rationale: Bagaman literal na “at kung,” ginagamit ito rito upang ipakilala ang ikalawang bahagi ng magkatambal na retorikal na tanong. Ang “o ... ba” ang natural na katumbas sa Tagalog.
- source_word: שַׁדַּי
  choice: ang Makapangyarihan sa Lahat
  rationale: Ang שַׁדַּי ay titulong tumutukoy sa Diyos. Isinasalin ito upang maipahayag ang kahulugan sa halip na baybayin lamang bilang “Shaddai.”
- source_word: צֶדֶק
  choice: katuwiran
  rationale: Maaaring mangahulugan ang צֶדֶק ng katuwiran o katarungan. Pinananatili ng “katuwiran” ang leksikal na pagkakaiba nito sa מִשְׁפָּט habang nananatiling malinaw ang magkaugnay na moral at legal na diwa.
theological_decisions:
- issue: Pagsasalin sa magkatambal na titulong אֵל at שַׁדַּי
  choice: Diyos ... ang Makapangyarihan sa Lahat
  alternative: El ... Shaddai
  rationale: Kapuwa ginagamit bilang mga titulo sa kontekstong ito, hindi bilang mga pangalang pantangi. Ang pagsasalin sa mga ito ay malinaw na naghahatid ng kahulugan nang hindi nag-aangkat ng partikular na tradisyong pangdoktrina.
- issue: Pagpapanatili sa pagkakaiba ng מִשְׁפָּט at צֶדֶק
  choice: katarungan ... katuwiran
  alternative: paghatol ... katarungan; katarungan ... katarungan
  rationale: Magkaugnay ngunit hindi magkapareho ang dalawang legal at etikal na salita sa Hebreo. Pinananatili ng napiling salin ang kanilang pagkakaiba at ang paralelismong patula nang hindi pinapawi ang pag-uugnayan ng makatarungang paghatol at moral na katuwiran.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang magkatulad na pandiwang “binabaluktot” upang mapanatili ang mahigpit na paralelismo at puwersa ng retorikal na tanong sa Hebreo.
