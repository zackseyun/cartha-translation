  text: While it is still in its shoot[a], not cut down[b], it dries up before any other grass.
translation:
  language: tl
  text: Habang sariwa pa ang sibol nito[a] at hindi pa ito napuputol[b], natutuyo ito bago pa matuyo ang alinmang ibang damo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “habang luntian pa ito” o “habang nasa usbong pa ito.” Ang salitang Hebreo ay tumutukoy sa sariwa o murang pagtubo ng halaman.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “hindi pa ito napipitas.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹדֶנּוּ
  choice: Habang ... pa
  rationale: Ipinahahayag ng pang-abay na may hulaping panlalaking isahan ang nagpapatuloy na kalagayan ng halaman; natural itong naihahatid sa Tagalog sa temporal na pariralang “Habang ... pa.”
- source_word: בְאִבּוֹ
  choice: sariwa pa ang usbong nito
  rationale: Ang אֵב/אִב ay tumutukoy sa sariwa at murang pagtubo ng halaman. Pinananatili ng “usbong” ang kongkretong larawang botanikal, habang ipinahahayag ng “sariwa” ang kalagayang nasasaklaw ng salitang Hebreo.
- source_word: לֹא יִקָּטֵף
  choice: hindi pa napuputol
  rationale: Ang anyong Niphal ng קטף ay pasibo at maaaring mangahulugang putulin o pitasin. Ang “napuputol” ay malinaw at angkop sa halamang tambo o papiro sa konteksto.
- source_word: וְלִפְנֵי
  choice: bago pa matuyo
  rationale: 'Ginagamit dito ang parirala sa paghahambing ng panahon: nauunang matuyo ang halaman. Inulit ang pandiwang “matuyo” sa Tagalog upang maging malinaw at natural ang paghahambing.'
- source_word: כָל חָצִיר
  choice: alinmang ibang damo
  rationale: Sa kontekstong pahambing, ipinakikita nitong mas maagang natutuyo ang tinutukoy na halaman kaysa sa karaniwang damo. Nililinaw ng “ibang” ang paghahambing nang hindi ginagawang lubos na pahayag ang “lahat ng damo.”
- source_word: יִיבָשׁ
  choice: natutuyo na ito
  rationale: Ang יבש ay nangangahulugang matuyo o malanta. Ang “natutuyo” ay pinakamalapit sa literal na larawan ng halamang umaasa sa tubig, at ang “na” ay nagpapatingkad sa maagang pagkatuyo nito.
