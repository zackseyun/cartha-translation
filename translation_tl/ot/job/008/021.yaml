  text: He will yet fill your mouth with laughter[a], and your lips with shouting.
translation:
  language: tl
  text: Pupunuin pa niya ng tawa ang iyong bibig, at ng sigaw ang iyong mga labi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Hanggang sa punuin niya ng tawa ang iyong bibig, at ng sigaw ang iyong mga labi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עַד
  choice: pa
  rationale: Sa konteksto, ipinahihiwatig nito na gagawin pa ng Diyos ang ipinangakong pagpapanumbalik. Likas sa Tagalog ang “pa” para sa ganitong panghinaharap na diwa, habang pinananatili sa talababa ang temporal na alternatibong “hanggang sa.”
- source_word: יְמַלֵּה
  choice: pupunuin niya
  rationale: Ang Piel imperfect na 3ms ay may panghinaharap na puwersa rito; ang Diyos ang ipinahihiwatig na simuno mula sa naunang talata.
- source_word: שְׂחוֹק
  choice: tawa
  rationale: Tuwirang ipinapahayag ang pagtawa sa konteksto ng pagpapanumbalik, nang hindi dinaragdagan ng negatibong diwang panunuya.
- source_word: פִּיךָ
  choice: ang iyong bibig
  rationale: Pinananatili ang malinaw at makatang larawan ng bibig na pinupuno.
- source_word: וּשְׂפָתֶיךָ
  choice: at ... ang iyong mga labi
  rationale: Pinananatili ang paralelismo at pisikal na larawang katapat ng “iyong bibig.”
- source_word: תְרוּעָה
  choice: sigaw ng tuwa
  rationale: Maaari itong tumukoy sa malakas na sigaw, kadalasan dahil sa galak o tagumpay. Sa kontekstong ito ng tawa at pagpapanumbalik, natural ang “sigaw ng tuwa” sa Tagalog, nang hindi ito ginagawang tiyak na panliturhiya o pandigma.
theological_decisions:
- issue: Ipinahihiwatig na simuno ng pandiwa
  choice: Isinalin bilang “niya,” na tumutukoy sa Diyos ayon sa agarang konteksto.
  alternative: 'Di-tiyak na anyo: “Mapupuno ng tawa ang iyong bibig.”'
  rationale: Ang Diyos ang tahasang paksa sa talata 20, at likas na nagpapatuloy ang pangako sa talata 21. Pinananatili ng “niya” na ang pagpapanumbalik ay pagkilos ng Diyos.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang makatang paralelismo ng “bibig” at “mga labi,” gayundin ang tunay na posibilidad na temporal ang עַד.
