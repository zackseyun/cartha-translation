  yaml_path: translation/ot/job/008/018.yaml
  text: If he is destroyed from his place[a], then it will deny him, saying[b], “I have not seen you.”
translation:
  language: tl
  text: 'Kung siya ay lamunin mula sa kaniyang kinaroroonan[a], ikakaila siya nito[b]: “Hindi kita nakita.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mula sa kinaroroonan nito.” Maaaring tumukoy ang hulaping Hebreo sa halaman sa larawan, bagaman isinatao rin ang larawan kaugnay ng taong masama.
    reason: lexical_alternative
  - marker: b
    text: O “itatakwil siya nito” / “pakikitunguhan siya nito nang may kabulaanan.” Maaaring magpahayag ang pandiwang Hebreo ng pagkakaila, pagtatakwil, o pakikitungo nang may kabulaanan.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Kung
  rationale: Pinananatili ang kondisyonal at posibleng diwa ng Hebreo, sa halip na gawing tiyak na pangyayaring temporal.
- source_word: יְבַלְּעֶנּוּ
  choice: siya ay lamunin
  rationale: Ang Piel ng בלע na may hulaping 3ms ay naglalarawan ng paglamon o pag-ubos sa kaniya. Pinananatili ng 'lamunin' ang matingkad na larawan at hindi ito tahasang nilulutas bilang 'lipulin' lamang.
- source_word: מִמְּקוֹמוֹ
  choice: mula sa kaniyang kinaroroonan
  rationale: Ang panlalaking isahang hulapi ay maaaring tumukoy sa taong inilalarawan sa pamamagitan ng halaman. Ang 'kinaroroonan' ay natural sa Filipino at maaari ring tumukoy sa lugar na tinutubuan niya.
- source_word: וְכִחֶשׁ בּוֹ
  choice: ikakaila siya nito
  rationale: Ang כחש ay maaaring mangahulugang magkaila, itakwil, o makitungo nang may kabulaanan. Dito, ang kinaroroonan ang isinatao bilang nagkakaila sa kaniya.
- source_word: לֹא רְאִיתִיךָ
  choice: Hindi kita nakita
  rationale: Tuwirang pinananatili ang konkretong pandiwang 'makita' at ang pormula ng pagkakaila, sa halip na palawakin bilang 'Hindi kita kilala.'
