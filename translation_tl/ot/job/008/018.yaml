translation_notes:
  register: Makabagong Filipino na marangal at madaling maunawaan. Pinanatili ang patulang pagsasatao sa kinaroroonan at ang tunay na kalabuan kung tao o halaman ang tuwirang tinutukoy ng hulapi.
