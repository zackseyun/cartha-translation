  text: Sagana siya sa tubig sa harap ng araw[b], at ang kanyang mga usbong ay sumusulpot sa ibabaw ng kanyang hardin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang kanyang usbong ay sumusulpot sa ibabaw ng kanyang hardin.” Maaaring unawain bilang kolektibo ang isahang pangngalang Hebreo para sa murang usbong o paglago.
    reason: lexical_alternative
  - marker: b
    text: Ang “sa harap ng araw” ay maaaring mangahulugang nakalantad sa araw o nasa liwanag nito, at hindi kinakailangang “bago sumikat ang araw.”
