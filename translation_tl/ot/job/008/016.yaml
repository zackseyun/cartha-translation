lexical_decisions:
- source_word: רָטֹב
  choice: hitik sa halumigmig
  rationale: Ipinahahayag ang pagiging basa o sagana sa tubig ng halaman, habang pinananatili ang kongkretong larawan ng Hebreo.
- source_word: הוּא
  choice: siya
  rationale: Pinananatili ang panlalaking panghalip at personipikasyon sa paghahambing ni Bildad, bagaman halaman ang inilalarawan.
- source_word: לִפְנֵי שָׁמֶשׁ
  choice: sa harap ng araw
  rationale: Malapit ito sa literal na kahulugan at pinananatili ang posibilidad na tumukoy sa pagkakalantad sa liwanag ng araw, hindi lamang sa panahong bago sumikat ang araw.
- source_word: וְעַל
  choice: at sa ibabaw ng
  rationale: Pinananatili ang panlunan at spatial na diwa ng pang-ukol sa natural na ayos ng Filipino.
- source_word: גַּנָּתוֹ
  choice: kanyang hardin
  rationale: Direkta at natural na katumbas ng pangngalang may panlalaking isahang hulapi.
- source_word: יֹנַקְתּוֹ
  choice: kanyang mga usbong
  rationale: Ang isahang pangngalan para sa murang paglago ay maaaring kolektibo; ang maramihang 'mga usbong' ay malinaw at natural sa modernong Filipino.
- source_word: תֵצֵא
  choice: sumisibol
  rationale: Ipinahahayag ang paglabas o pag-usli ng murang paglago nang hindi labis na ipinapasok ang ideya ng pagkalat.
