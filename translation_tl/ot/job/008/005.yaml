id: JOB.8.5
reference: Job 8:5
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: אִם אַ֭תָּה תְּשַׁחֵ֣ר אֶל אֵ֑ל וְ/אֶל שַׁ֝דַּ֗י תִּתְחַנָּֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/008/005.yaml
  text: But if you seek God earnestly[a], and plead for favor from the Almighty[b],
translation:
  language: tl
  text: Ngunit kung buong sikap mong hahanapin ang Diyos[a] at magsusumamo ka sa Makapangyarihan sa Lahat[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “hahanapin mo nang maaga ang Diyos.” Maaaring tumukoy ang pandiwang Hebreo sa maagang paghahanap, bagaman dito ay malamang na masikap o taimtim na paghahanap ang ibig sabihin.
    reason: lexical_alternative
  - marker: b
    text: Hebreo, “Shaddai.” Tradisyonal itong isinasaling “ang Makapangyarihan sa Lahat.”
    reason: alternative_reading
lexical_decisions:
- source_word: אִם
  choice: Ngunit kung
  rationale: Ipinakikilala nito ang kondisyon at ipinahihiwatig ang pagsalungat sa naunang pahayag.
- source_word: אַתָּה
  choice: mong / ka
  rationale: Ang tahasang panghalip na ikalawang panauhang panlalaki at isahan ay likas na ipinapahayag sa mga anyong Tagalog na “mong” at “ka.”
- source_word: תְּשַׁחֵר
  choice: buong sikap mong hahanapin
  rationale: Ang Piel ng שׁחר ay maaaring tumukoy sa maagang paghahanap o sa masikap at taimtim na paghahanap; sa konteksto, ang masikap na paglapit sa Diyos ang malamang na diwa.
- source_word: אֶל אֵל
  choice: ang Diyos
  rationale: Likas na isinasama sa pandiwang “hahanapin” ang direksiyong ipinapahayag ng אֶל; ang אֵל ay isinaling “Diyos.”
- source_word: וְ/אֶל שַׁדַּי
  choice: at ... sa Makapangyarihan sa Lahat
  rationale: Ang pang-ukol ay likas na ipinapahayag bilang “sa” kasunod ng “magsusumamo,” at ang titulong שַׁדַּי ay isinalin sa halip na baybayin lamang.
- source_word: תִּתְחַנָּן
  choice: magsusumamo ka
  rationale: Ipinahahayag ng Hitpael ng חנן ang taimtim na paghingi ng awa o pabor; ang “magsusumamo” ay marangal, malinaw, at hindi nagdaragdag ng bagay na hindi tahasang binanggit.
theological_decisions:
- issue: Pagsasalin sa titulong שַׁדַּי
  choice: Makapangyarihan sa Lahat
  alternative: Shaddai
  rationale: Isinalin ang banal na titulo upang maiparating ang tradisyonal na diwa nito, habang inilalagay sa talababa ang transliterasyong nagpapanatili sa anyong Hebreo.
translation_notes:
  register: Modernong Filipino na dignified at madaling maunawaan. Pinanatili ang kondisyonal na sugnay at ang kuwit sa hulihan dahil nagpapatuloy ang pangungusap sa kasunod na talata. Ang “buong sikap” ay nagpapahayag ng malamang na idiomatikong diwa, habang pinananatili sa talababa ang tunay na alternatibong “nang maaga.”
