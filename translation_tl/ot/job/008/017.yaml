  text: His roots are intertwined over a stone heap[a]; he sees a house of stones.
translation:
  language: tl
  text: Sa ibabaw ng bunton ng mga bato ay nagkakabuhol-buhol ang mga ugat niya; nakikita niya ang isang bahay na yari sa mga bato.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nakikita niya ang isang bahay na bato” o “nakikita niya ang loob ng isang bahay na yari sa mga bato.” Literal na “bahay ng mga bato” ang pariralang Hebreo at maaaring tumukoy sa isang gusaling bato o sa isang mabatong lugar.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל גַּל
  choice: sa ibabaw ng bunton ng mga bato
  rationale: Ang עַל ay nagsasaad ng pagkakalatag sa ibabaw ng bunton. Bagaman ang גַּל ay literal na “bunton,” nililinaw ng kasunod na pagbanggit sa mga bato ang konkretong larawan.
- source_word: שָׁרָשָׁיו
  choice: ang mga ugat nito
  rationale: Pinananatili ang maramihang “mga ugat” at ang talinghaga ng halamang kumakatawan sa tao; natural sa Filipino ang “nito” para sa larawang halaman.
- source_word: יְסֻבָּכוּ
  choice: nagkakabuhol-buhol
  rationale: Ipinahihiwatig ng pandiwa ang mga ugat na nagsasanga, nagsasalabid, o nagkakabuhol-buhol. Ang napiling anyo ay malinaw at masining nang hindi labis na nagpapakahulugan.
- source_word: בֵּית אֲבָנִים
  choice: isang bahay na yari sa mga bato
  rationale: Malapit ito sa literal na “bahay ng mga bato” ngunit mas natural sa modernong Filipino. Iniiwasan din nito ang tiyak na kahulugang pangkultura ng pariralang “bahay na bato.”
- source_word: יֶחֱזֶה
  choice: natatanaw nito
  rationale: Ang pandiwa ay nangangahulugang makakita o masdan. Ang “natatanaw” ay nagpapanatili sa masining na puwersa ng pandiwa at sa isahang personipikadong paksa.
