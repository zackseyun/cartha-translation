translation:
  language: tl
  text: 'Ganyan ang mga landas ng lahat ng lumilimot sa Diyos;

    at maglalaho ang pag-asa ng taong walang paggalang sa Diyos.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “taong mapagkunwari” o “taong lapastangan.” Ang salitang Hebreo ay maaaring tumukoy sa taong masama o walang paggalang sa Diyos; sa kontekstong ito, ang “taong walang paggalang sa Diyos” ang pinakamalapit sa diwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֵּן
  choice: Ganyan
  rationale: Ipinahahayag nito ang paghahambing at kongklusyon mula sa naunang larawan; natural ito sa makabagong Filipino.
- source_word: אָרְחוֹת
  choice: mga landas
  rationale: Pinananatili ang maramihang anyo at ang metapora para sa takbo o paraan ng pamumuhay.
- source_word: שֹׁכְחֵי אֵל
  choice: lahat ng lumilimot sa Diyos
  rationale: Natural na isinasalin ang participial construction bilang pariralang naglalarawan. Karaniwang titulong pantukoy sa Diyos ang אֵל dito, hindi pangalang kailangang tumbasan ng transliterasyon.
- source_word: תִקְוַת
  choice: pag-asa
  rationale: Ito ang likas at angkop na katumbas sa konteksto ng karunungang panitikan.
- source_word: חָנֵף
  choice: taong hindi maka-Diyos
  rationale: Ipinahahayag nito ang taong masama o walang paggalang sa Diyos, nang hindi nililimitahan ang kahulugan sa pagkukunwari lamang.
- source_word: תֹּאבֵד
  choice: mawawala
  rationale: Natural na Filipino para sa pagkaparam o pagkawala ng pag-asa, habang pinananatili ang tiyak na magiging bunga.
theological_decisions:
- issue: Kahulugan ng חָנֵף sa konteksto ng paghatol sa panitikang karunungan
  choice: taong hindi maka-Diyos
  alternative: taong mapagkunwari; taong lapastangan
  rationale: Sa Job, mas malawak ang moral at panrelihiyong diwa ng salita kaysa sa simpleng pagkukunwari. Hindi nito ipinapasok ang mas makitid na sikolohikal na kategorya, at pinananatili ang kaibahan sa mga lumilimot sa Diyos.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang metapora ng “mga landas” at ang balanseng anyo ng dalawang sugnay; ang tuldok-kuwit ay nagpapakita ng malapit na ugnayan ng paghahambing at kongklusyon.
