  text: For please ask the former generation[b][a], and consider the findings of their fathers.
translation:
  language: tl
  text: Sapagkat magtanong ka nga sa naunang salinlahi, at ituon mo ang iyong pansin sa pagsisiyasat ng kanilang mga ninuno.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa mga natuklasan ng kanilang mga ninuno.” Ang salitang Hebreo ay maaaring tumukoy sa mismong pagsisiyasat o sa mga natuklasan sa pamamagitan nito.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Nagsisilbi itong pang-ugnay na nagbibigay ng batayan sa naunang sinabi ni Bildad.
- source_word: שְׁאַל נָא
  choice: magtanong ka
  rationale: Ang pandiwa ay pautos na ‘magtanong’ o ‘magsiyasat’; ang נָא ay nagpapalumanay sa pakiusap. Sa modernong Tagalog, sapat nang magalang at natural ang ‘magtanong ka’ sa kontekstong ito.
- source_word: לְדֹר רִישׁוֹן
  choice: sa naunang salinlahi
  rationale: Tumutukoy ito sa isang salinlahing nauna, hindi kinakailangang sa pinakaunang salinlahi.
- source_word: וְכוֹנֵן
  choice: at pag-isipan mo
  rationale: Ipinahihiwatig ng כון dito ang matamang pagbaling o pagtutuon ng isip; natural itong naipahahayag sa ‘pag-isipan mo.’
- source_word: לְחֵקֶר
  choice: ang mga natuklasan
  rationale: Maaaring tukuyin ng חֵקֶר ang pagsisiyasat mismo o ang mga resultang natuklasan dito. Ang ‘mga natuklasan’ ay angkop sa naipong karunungan na hinihikayat na pag-isipan.
- source_word: אֲבוֹתָם
  choice: ng kanilang mga ninuno
  rationale: Bagaman literal na ‘kanilang mga ama,’ ginagamit ito rito sa diwang angkan o mga naunang ninuno; mas natural at hindi malabong pakinggan sa modernong Tagalog ang ‘mga ninuno.’
