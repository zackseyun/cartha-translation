base_translation:
  language: en
  yaml_path: translation/ot/job/008/009.yaml
  text: For we are only of yesterday and do not know[a], for our days on the earth are a shadow.
translation:
  language: tl
  text: 'Sapagkat tayo''y kahapon lamang at walang nalalaman,[a]

    sapagkat anino lamang ang mga araw natin sa lupa.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “tayo ay mga tao lamang ng kahapon”; ibig sabihin, kamakailan lamang tayo umiral kaya limitado ang ating kaalaman.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinapakita nito ang paliwanag o batayan sa pangangatwiran ni Bildad at pinananatili ang ugnayang lohikal ng Hebreo.
- source_word: תְמוֹל אֲנַחְנוּ
  choice: tayo'y kahapon lamang
  rationale: Pinananatili ang matalinghagang pahayag na ang mga tao ay waring mula lamang kahapon—kamakailan lamang umiral at kaya'y limitado ang kaalaman.
- source_word: וְלֹא נֵדָע
  choice: at walang nalalaman
  rationale: Tuwirang ipinahahayag ang kawalan o kakulangan ng kaalaman nang hindi nagdaragdag ng tiyak na layon na wala sa Hebreo.
- source_word: כִּי
  choice: sapagkat
  rationale: 'Pinananatili ang ikalawang pangatwirang pang-ugnay: ang ikli ng buhay ang batayan ng limitadong kaalaman ng tao.'
- source_word: צֵל
  choice: anino lamang
  rationale: Pinananatili ang larawang patula ng anino bilang sagisag ng panandalian at madaling lumipas na buhay; ang “lamang” ay likas na nagpapalinaw sa paghahambing sa Filipino.
- source_word: יָמֵינוּ
  choice: ang mga araw natin
  rationale: Malapit na salin ng pangngalang may unang panauhang maramihang hulapi at tumutukoy sa haba ng buhay ng tao.
- source_word: עֲלֵי אָרֶץ
  choice: sa lupa
  rationale: Likas at marangal na Filipino para sa kinaroroonan ng buhay ng tao sa daigdig.
