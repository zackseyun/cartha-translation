  text: He builds his house like a moth[a], like a shelter that a watchman makes.
translation:
  language: tl
  text: 'Itinatayo niya ang kanyang bahay gaya ng gamugamo,[a]


    gaya ng kubol na ginagawa ng bantay.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “gaya ng uod.” Ang salitang Hebreo ay karaniwang isinasaling “gamugamo,” ngunit maaari ring unawain bilang isang uod.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּנָה
  choice: Itinatayo
  rationale: Bagaman perpektibo ang anyong Hebreo, inilalarawan ng tulang ito ang karaniwang ginagawa ng masama; ang pangkasalukuyang aspekto ay natural sa Filipino.
- source_word: כָעָשׁ
  choice: na gaya ng sa gamugamo
  rationale: Karaniwang tumutukoy ang עָשׁ sa gamugamo. Ang pariralang “gaya ng sa” ay nagpapahiwatig ng bahay o tirahan nito nang hindi nagdaragdag ng tahasang salita sa tekstong Hebreo.
- source_word: בֵּיתוֹ
  choice: ang kanyang bahay
  rationale: Mas angkop ang literal na gusali kaysa sambahayan dahil kahilera nito ang pansamantalang kubol at parehong inilalarawang ginagawa o itinatayo.
- source_word: וּכְסֻכָּה
  choice: gaya ng kubol
  rationale: Ang סֻכָּה ay isang payak at pansamantalang silungan; malinaw at likas sa kontekstong bukid ang “kubol.”
- source_word: עָשָׂה
  choice: ginagawa
  rationale: Ginamit ang pangkasalukuyang anyo upang tumugma sa pangkalahatan at makatang paglalarawan ng unang pandiwa.
- source_word: נֹצֵר
  choice: bantay
  rationale: Ang participle ay tumutukoy sa taong nagbabantay; sa larawan ng talata, malamang na bantay ito sa bukid o ubasan.
