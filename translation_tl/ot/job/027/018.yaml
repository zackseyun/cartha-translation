    issue: Hindi likas at semantically over-specified ang “na gaya ng sa gamugamo.”
    rationale: Walang tahasang “bahay/tirahan ng gamugamo” sa unang paghahambing sa Hebreo. Ang kasalukuyang parirala ay kapwa elliptical sa Filipino at nagpapahiwatig ng isang idinagdag na nominal na ideya.
  - severity: low
    issue: Masyadong tiyak ang paliwanag sa talababa tungkol sa “uod na sumisira ng damit.”
    rationale: Maaaring magbigay ng “uod” bilang leksikal na alternatibo, ngunit hindi kailangang itali ito sa isang tiyak na paglalarawan na hindi tuwirang isinasaad ng teksto.
