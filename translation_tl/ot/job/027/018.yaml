translation_notes:
  register: Makabago ngunit marangal na Filipino. Pinanatili ang dalawang magkatulad na larawan at ang pagiging pansamantala at marupok ng bahay, nang hindi tinutukoy nang higit sa Hebreo kung anong uri ng bantay ang tinutukoy.
