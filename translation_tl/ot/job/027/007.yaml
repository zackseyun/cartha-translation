  yaml_path: translation/ot/job/027/007.yaml
  text: May my enemy be like the wicked[a], and the one who rises against me like the unrighteous.
translation:
  language: tl
  text: Nawa’y ang aking kaaway ay maging gaya ng masamang tao, at ang bumabangon laban sa akin ay gaya ng taong di-makatarungan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O kaya, “Nawa’y maging gaya ng masama ang aking kaaway, at gaya ng di-makatarungan ang kumakalaban sa akin.”
    reason: Ipinakikita ang mas maigsi at substantibong paraan ng pagsasalin sa רָשָׁע at עַוָּל, at ang mas maikling katumbas ng participial na parirala.
lexical_decisions:
- source_word: יְהִי
  choice: ay maging
  rationale: Ang Qal jussive ng היה ay nagpapahayag ng hangarin o sumpang kahilingan; sa Filipino, likas at marangal na naihahatid ito ng hulma na “ay maging.”
- source_word: כְרָשָׁע
  choice: gaya ng masama
  rationale: Ang כְּ ay paghahambing, at ang רָשָׁע ay taong masama. Pinananatili ng “gaya ng masama” ang paghahambing at ang moral na kategorya nang hindi kinakailangang tukuying lalaki ang tao.
- source_word: אֹיְבִי
  choice: aking kaaway
  rationale: Tuwirang katumbas ito ng pangngalang אויב na may hulaping unang panauhang isahan.
- source_word: וּמִתְקוֹמְמִי
  choice: at ang bumabangon laban sa akin
  rationale: Pinananatili nito ang pandiwang larawan ng isang taong tumitindig o kumakalaban sa nagsasalita, sa halip na paikliin lamang bilang “kalaban.”
- source_word: כְעַוָּל
  choice: gaya ng gumagawa ng mali
  rationale: Ang עַוָּל ay tumutukoy sa taong kakikitaan ng kasamaan, kamalian, o kawalang-katarungan. Ang “gumagawa ng mali” ay natural sa modernong Filipino at sapat na malawak upang hindi limitahan ang kahulugan sa usaping legal lamang.
theological_decisions:
- issue: Kung ang pahayag ay pagkakakilanlan o paghahangad na mapabilang ang mga kalaban sa uri ng masasama
  choice: 'Isinalin bilang paghahangad: “ay maging gaya ng…”'
  alternative: “Ang aking kaaway ay tulad ng masama…” bilang payak na paglalarawan
  rationale: Ang jussive na יְהִי ay may bolitibong puwersa. Pinananatili ng salin ang tensiyon ng imprekasyon nang hindi dinaragdagan o pinahihina ang pahayag.
translation_notes:
  register: Modernong Filipino na may dignidad at malinaw sa karaniwang mambabasa. Ginamit ang “aking” at ang hulmang “ay maging” upang mapanatili ang bahagyang makatang tono ng Job. Ang panandang talababa [a] ay nasa pangunahing teksto.
