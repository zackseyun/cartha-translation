translation:
  language: tl
  text: Hindi magsasalita ng kawalang-katarungan ang aking mga labi[a], ni bibigkas ng panlilinlang ang aking dila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Gumagamit ang Hebreo ng anyong tulad ng panunumpa na may “kung” (אִם) upang magpahayag ng mariing pagtanggi. Sa literal: “kung magsasalita ng kawalang-katarungan ang aking mga labi…,” na ang diwa ay, “tiyak na hindi magsasalita ng kawalang-katarungan ang aking mga labi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: hindi
  rationale: Sa konteksto ng taimtim na panunumpa, ang אִם ay isang eliptikong pormula ng matinding pagtanggi, hindi karaniwang kondisyon. Likas itong ipinahahayag sa Filipino sa pamamagitan ng tahasang pagtangging “hindi.”
- source_word: תְּדַבֵּרְנָה
  choice: magsasalita
  rationale: Ang Piel imperfect ng דבר ay tumutukoy sa pagsasalita at, sa konteksto ng paninindigan ni Job, may hinaharap o mariing kapasiyahang diwa.
- source_word: שְׂפָתַי
  choice: ang aking mga labi
  rationale: Pinananatili ang kongkretong larawan ng mga labi at ang paralelismo nito sa “aking dila.”
- source_word: עַוְלָה
  choice: kawalang-katarungan
  rationale: Sinasaklaw nito ang moral na diwa ng mali o di-matuwid na gawain nang hindi ito ipinapantay sa “panlilinlang” sa ikalawang linya.
- source_word: וּלְשׁוֹנִי
  choice: ni ... ang aking dila
  rationale: Dahil nagpapatuloy ang negatibong puwersa ng unang sugnay, natural na ipinapahayag ang waw bilang “ni,” habang pinananatili ang paralelismo ng mga bahagi ng katawan.
- source_word: יֶהְגֶּה
  choice: bibigkas
  rationale: Ang הגה ay maaaring mangahulugang umusal, bumigkas, o magnilay. Dahil dila ang simuno at panlilinlang ang layon, ang “bibigkas” ang malinaw at marangal na katumbas.
- source_word: רְמִיָּה
  choice: panlilinlang
  rationale: Malinaw nitong ipinapahayag ang daya o deceit at nananatiling naiiba sa mas malawak na “kawalang-katarungan.”
