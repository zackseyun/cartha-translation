base_translation:
  language: en
  yaml_path: translation/ot/job/027/008.yaml
  text: For what is the hope of the godless when God cuts him off[c][b][a], when God takes away his life?
translation:
  language: tl
  text: Sapagkat, ano ang pag-asa ng taong walang takot sa Diyos[a] kahit nagkamit siya ng pakinabang[b], kapag kinuha ng Diyos ang kanyang buhay[c]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “taong mapagkunwari.” Ang salitang Hebreo ay maaaring tumukoy sa taong walang galang sa Diyos, di-maka-Diyos, o mapagkunwari.
    reason: lexical_alternative
  - marker: b
    text: Mahirap unawain ang sugnay sa Hebreo. Maaari ring isalin, “kapag siya’y pinutol” o “kapag siya’y winakasan.”
    reason: alternative_reading
  - marker: c
    text: O “kapag hinugot ng Diyos ang kanyang kaluluwa/buhay.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּקְוַת
  choice: pag-asa
  rationale: Tumutukoy sa inaasahan o pinanghahawakang pag-asa; natural ito sa retorikal na tanong ng talata.
- source_word: חָנֵף
  choice: taong walang takot sa Diyos
  rationale: Ipinahahayag nito ang kawalan ng paggalang at katapatan sa Diyos, nang hindi nililimitahan ang salita sa panlabas na pagkukunwari lamang.
- source_word: יִבְצָע
  choice: kapag siya’y winakasan na
  rationale: Mahirap at pinagtatalunan ang maikling sugnay. Ang pagpiling ito ay umaayon sa kasunod na pagbanggit sa pagbawi ng Diyos sa buhay, ngunit inilalahad sa talababa ang posibleng kahulugang may kinalaman sa pagkakamit ng pakinabang.
- source_word: יֵשֶׁל
  choice: binawi
  rationale: Ipinahihiwatig ng pandiwa ang pagkuha o paghugot; ang “binawi” ay natural sa Filipino kapag buhay ang tuwirang layon.
- source_word: אֱלוֹהַּ
  choice: Diyos
  rationale: Karaniwang patulang katawagan ito sa Diyos sa aklat ng Job.
- source_word: נַפְשׁוֹ
  choice: ang kanyang buhay
  rationale: Sa kontekstong ito, ang נֶפֶשׁ ay tumutukoy sa buhay ng tao na kinukuha sa kamatayan, hindi kinakailangang sa isang teknikal na konsepto ng kaluluwa.
theological_decisions:
- issue: Kahulugang antropolohikal ng נֶפֶשׁ
  choice: ang kanyang buhay
  alternative: ang kanyang kaluluwa
  rationale: Ang talata ay nagsasalita tungkol sa pagkitil o pagbawi ng buhay, hindi tahasang nagtuturo ng isang tiyak na metapisikal na paliwanag tungkol sa kaluluwa.
- issue: Paksa at kahulugan ng יִבְצָע
  choice: kapag siya’y winakasan na
  alternative: kapag nagkamit siya / kahit nagkamit siya
  rationale: Pinananatili ng pangunahing salin ang ugnayan sa kasunod na sugnay tungkol sa kamatayan, habang ang talababa ay nagpapanatili sa tunay na leksikal at sintaktikong kalabuan ng Hebreo.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “walang takot sa Diyos” upang maging malinaw sa karaniwang mambabasa ang moral at panrelihiyong diwa ng חָנֵף. Ang anyong “siya’y” ay bahagyang pampanitikan ngunit natural sa panulaan at karunungang biblikal.
