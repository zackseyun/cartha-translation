base_translation:
  language: en
  yaml_path: translation/ot/job/027/013.yaml
  text: 'This is the portion of a wicked man with God[c][b][a], and the inheritance that the ruthless receive from the Almighty:'
translation:
  language: tl
  text: 'Ito ang bahaging mula sa Diyos para sa masamang tao, at ang mana na tatanggapin ng mga malupit mula sa Makapangyarihan sa Lahat:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: זֶה
  choice: Ito ang
  rationale: Ipinakikilala ng demonstratibo ang pahayag; likas sa Filipino ang hulma na “Ito ang …”
- source_word: חֵלֶק
  choice: bahagi
  rationale: Tumutukoy sa nakalaang kalagayan o kahihinatnan ng isang tao at pinananatiling naiiba sa kasunod na “mana.”
- source_word: אָדָם רָשָׁע
  choice: taong masama
  rationale: Likas at malinaw na panumbas sa isang taong inilalarawang masama sa konteksto ng panitikang karunungan.
- source_word: עִם אֵל
  choice: sa piling ng Diyos
  rationale: Pinananatili ang pangunahing diwa ng עִם na “kasama/kasiping,” habang inilalagay sa dignified at nauunawaang Filipino; ipinapaliwanag sa talababa ang posibleng idyomatikong diwang “mula sa Diyos.”
- source_word: נַחֲלַת
  choice: mana
  rationale: Karaniwang panumbas sa isang bahaging minamana o ipinagkakaloob; kaagapay ngunit hindi kapareho ng “bahagi.”
- source_word: עָרִיצִים
  choice: mga malupit
  rationale: Ipinahahayag ang pagiging mapaniil at walang habag ng tinutukoy; ang “mga marahas” ay lehitimong alternatibo.
- source_word: מִשַּׁדַּי
  choice: mula sa Makapangyarihan sa Lahat
  rationale: Isinalin ang banal na titulo ayon sa kahulugan nito at pinanatili ang tahasang pinagmulan na ipinakikita ng מִן.
- source_word: יִקָּחוּ
  choice: tatanggapin
  rationale: Bagaman literal na “kukunin,” mas natural ang “tatanggapin” sa konteksto ng bahaging inilaan at mana, nang hindi binabago ang ideya ng pagkuha ng nakatakdang bahagi.
theological_decisions:
- issue: Ugnayan ng masamang tao sa Diyos sa pariralang עִם אֵל
  choice: sa piling ng Diyos
  alternative: mula sa Diyos
  rationale: Ang teksto ay literal na gumagamit ng pang-ukol na “kasama,” ngunit maaari itong unawain bilang kung ano ang inilaan ng Diyos. Pinanatili sa pangunahing teksto ang mas malapit na anyo at iniwan sa talababa ang idyomatikong pagbasa upang hindi tahimik na lutasin ang kalabuan.
- issue: Banal na titulong שַׁדַּי
  choice: Makapangyarihan sa Lahat
  alternative: Shaddai
  rationale: Titulo ito ng Diyos, kaya isinalin ang kahulugan sa halip na baybayin lamang ang anyong Hebreo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang paralelismo ng “bahagi” at “mana,” gayundin ang tutuldok na naghahanda sa paglalahad sa mga susunod na talata.
