  yaml_path: translation/ot/job/027/020.yaml
  text: Terrors overtake him like waters[b][a]; in the night a storm steals him away.
translation:
  language: tl
  text: Aabutan siya ng mga lagim na parang tubig[a]; sa gabi, palihim siyang tatangayin ng isang bagyo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “na parang baha.”
    reason: lexical_alternative
  - marker: b
    text: O “unos”; maaari ring “ipu-ipo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּשִּׂיגֵהוּ
  choice: inaabutan siya
  rationale: Ang Hiphil ng נשׂג ay nagpapahayag ng paghabol na umaabot o sumasapit sa isang tao. Likas sa Filipino ang “inaabutan siya” at pinananatili nito ang larawan ng kapahamakang humahabol.
- source_word: כַמַּיִם
  choice: na parang rumaragasang tubig
  rationale: Ang literal na “parang tubig” ay maaaring mahina o malabo sa Filipino; idinagdag ang “rumaragasang” upang likas na maipahayag ang mapanupil na lakas ng larawang pantula nang hindi tuwirang ginagawang “baha” ang pangngalan.
- source_word: בַּלָּהוֹת
  choice: mga lagim
  rationale: Ang בלהות ay tumutukoy sa mga kakila-kilabot na sindak o kapahamakan. Ang “mga lagim” ay maikli, marangal, at angkop sa panulaang Filipino.
- source_word: לַיְלָה
  choice: sa gabi
  rationale: Ginagamit ang pangngalan bilang pang-abay. Ang “sa gabi” ang pinakanatural at tuwirang katumbas sa modernong Filipino.
- source_word: גְּנָבַתּוּ
  choice: palihim siyang tinatangay
  rationale: Mula ito sa ugat na גנב, “magnakaw.” Pinananatili ng “palihim” ang imahen ng pagkilos ng magnanakaw, samantalang malinaw na ipinahahayag ng “tinatangay” ang pag-aalis sa kaniya ng bagyo.
- source_word: סוּפָה
  choice: isang bagyo
  rationale: Ang סופה ay isang marahas na bagyo o unos. Ang “bagyo” ay malinaw at karaniwan, ngunit hindi nito nililimitahan ang salita sa mas tiyak na “ipu-ipo.”
theological_decisions: []
translation_notes:
  register: 'Modernong Filipino Tagalog na may dignidad at lakas na pantula. Pinanatili ang dalawang magkatugmang larawan: mga lagim na humahabol na gaya ng rumaragasang tubig, at bagyong kumukuha sa kaniya sa gabi na parang magnanakaw. Ang mga marker na [a] at [b] ay kapwa nasa pangunahing teksto.'
