  text: Though he heaps up silver like dust and prepares clothing like clay[b][a],
translation:
  language: tl
  text: Kahit magbunton siya ng pilak na kasindami ng alabok at maghanda ng mga damit na kasindami ng luwad,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Kung magbunton siya ng pilak na kasindami ng alabok at maghanda ng mga damit na kasindami ng luwad.” Maaaring unawain ang salitang Hebreo bilang kondisyonal (“kung”) o konsesibo (“kahit”); mas angkop sa daloy ng argumento ang konsesibong diwa.
    reason: alternative_reading
lexical_decisions:
- source_word: אִם
  choice: Kahit
  rationale: Sa kontekstong patula, maaaring kondisyonal o konsesibo ang אִם. Ang “Kahit” ay natural na nagpapahayag ng konsesibong diwa na ang naipong yaman ng masama ay mawawalan din ng saysay sa kasunod na talata.
- source_word: יִצְבֹּר
  choice: magbunton
  rationale: Pinananatili ng “magbunton” ang kongkretong larawan ng pagtatambak o pag-iipon at ang pagtutulad sa alabok.
- source_word: כֶּעָפָר
  choice: na tulad ng alabok
  rationale: Malinaw nitong ipinapahayag ang paghahambing at pinananatili ang eksaheradong larawan ng napakaraming pilak.
- source_word: כָּסֶף
  choice: pilak
  rationale: Ang literal na “pilak” ay mas angkop kaysa pangkalahatang “salapi” dahil pinananatili nito ang kongkreto at patulang larawan.
- source_word: וְכַחֹמֶר
  choice: at ... na tulad ng luwad
  rationale: Ang חֹמֶר ay karaniwang tumutukoy sa luwad o putik. Ang “luwad” ay nagpapanatili sa larawan ng isang bagay na sagana at karaniwan.
- source_word: יָכִין
  choice: maghanda
  rationale: Ang Hiphil ng כון dito ay nangangahulugang ihanda o gawing handa; natural itong gamitin kaugnay ng mga damit.
- source_word: מַלְבּוּשׁ
  choice: mga damit
  rationale: Ang “mga damit” ay malinaw at natural sa makabagong Filipino at naipahahayag ang kolektibong diwa ng pangngalan.
