base_translation:
  language: en
  yaml_path: translation/ot/job/027/003.yaml
  text: For as long as my breath is still in me[a], and the spirit of God is in my nostrils,
translation:
  language: tl
  text: 'Sapagkat hangga’t nasa akin pa ang aking hininga,

    at ang hininga[a] ng Diyos ay nasa mga butas ng aking ilong,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang Espiritu ng Diyos ay nasa mga butas ng aking ilong.” Ang salitang Hebreo na רוּחַ ay maaaring mangahulugang “hininga,” “hangin,” o “espiritu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikita rito ang kaugnayan ng solemneng pahayag ni Job sa panunumpang kasunod nito, nang hindi labis na nililinaw ang eksaktong lohikal na ugnayan.
- source_word: כָל עוֹד
  choice: habang ... pa
  rationale: 'Likas itong pariralang Filipino para sa patuloy na tagal na ipinahahayag ng Hebreo: ‘hangga''t naroroon pa’ o ‘samantalang nananatili pa.’'
- source_word: נִשְׁמָתִי
  choice: aking hininga
  rationale: Ang נְשָׁמָה ay tumutukoy rito sa hininga o hiningang nagbibigay-buhay, hindi kinakailangang sa ‘kaluluwa.’
- source_word: בִי
  choice: nasa akin
  rationale: Pinananatili nito ang larawan ng hiningang nasa loob pa ni Job, sa natural na pananalitang Filipino.
- source_word: וְרוּחַ
  choice: at ... ang hininga
  rationale: Maaaring mangahulugan ang רוּחַ ng hininga, hangin, o espiritu. Dahil kapantay ito ng ‘aking hininga’ at kaugnay ng mga butas ng ilong, ‘hininga’ ang pinakamalinaw na kahulugan sa konteksto; pinananatili sa talababa ang ‘Espiritu’ bilang tunay na alternatibo.
- source_word: אֱלוֹהַּ
  choice: Diyos
  rationale: Ang singular na titulong אֱלוֹהַּ, na karaniwan sa Job, ay tuwirang isinasalin bilang ‘Diyos.’
- source_word: בְּאַפִּי
  choice: nasa mga butas ng ilong ko
  rationale: Pisikal na ilong o mga butas ng ilong ang kahulugan ng אַף dito. Pinananatili ng salin ang kongkretong larawan ng paghinga.
theological_decisions:
- issue: Kahulugan ng רוּחַ אֱלוֹהַּ na kapantay ng נִשְׁמָתִי
  choice: ang hininga ng Diyos
  alternative: ang Espiritu ng Diyos
  rationale: Itinatampok ng agarang konteksto ang patuloy na buhay at paghinga, kaya mas angkop sa paralelismo ang ‘hininga ng Diyos.’ Gayunman, hindi lubusang nilulutas ng salin ang teolohikal at leksikal na posibilidad ng ‘Espiritu ng Diyos’; inilalagay ito sa talababa.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang kongkretong larawang Hebreo ng hininga sa mga butas ng ilong at ang anyong hindi pa tapos ng pangungusap, sapagkat nagpapatuloy ang panunumpa sa susunod na talata.
