  yaml_path: translation/ot/job/027/021.yaml
  text: The east wind carries him away[a], and he is gone; it sweeps him away from his place.
translation:
  language: tl
  text: Tinatangay siya ng hanging silangan, at wala na siya; itinataboy siya nito palayo mula sa kanyang kinaroroonan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “inihahagis siya nito palayo mula sa kanyang kinaroroonan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשָּׂאֵהוּ
  choice: Tinatangay siya
  rationale: Ang נשׂא ay nangangahulugang ‘buhatin, dalhin.’ Sa konteksto ng mapaminsalang hangin, natural na ipinahahayag ng ‘tinatangay’ ang sapilitang pagdadala palayo.
- source_word: קָדִים
  choice: hanging silangan
  rationale: Karaniwang tumutukoy ang קָדִים sa hanging mula sa silangan, na madalas ay mapaminsala sa tulang Hebreo.
- source_word: וְיֵלַךְ
  choice: at tuluyan na siyang nawawala
  rationale: Literal na ‘at siya ay umaalis/pumaparoon.’ Ipinahahayag ng salin ang resultang tuluyang pagkawala matapos siyang tangayin, habang pinananatili ang aspektong imperpektibo sa masiglang paglalarawan.
- source_word: וִישָׂעֲרֵהוּ
  choice: nililipad siya nito
  rationale: Ang סער ay kaugnay ng malakas o nagngangalit na bagyo at sapilitang pagpapaalis. Ang ‘nililipad’ ay natural sa Filipino para sa marahas na pagtangay ng hangin; inilalagay sa talababa ang mas hayag na imahen ng pag-ikot.
- source_word: מִמְּקֹמוֹ
  choice: mula sa kanyang kinaroroonan
  rationale: Ang מָקוֹם ay ‘lugar.’ Mas natural dito ang ‘kinaroroonan’ kaysa sa literal na ‘kanyang lugar,’ at malinaw nitong ipinapakita ang pagpapaalis mula sa dating kinalalagyan.
theological_decisions: []
translation_notes:
  register: Makabagong Filipino na marangal at madaling maunawaan. Pinanatili ang masiglang pangkasalukuyang anyo ng tulang Hebreo at ang marahas na larawan ng hanging silangan; iniwasan ang di-natural na literalismong ‘binabagyo siya palayo.’
