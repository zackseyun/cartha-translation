  yaml_path: translation/ot/job/027/012.yaml
  text: Look[a], all of you have seen it; why then do you become vain?
translation:
  language: tl
  text: Narito, nakita na ninyong lahat; bakit pa kayo kumikilos nang walang kabuluhan?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “bakit pa kayo nagiging walang kabuluhan?” Gumagamit ang Hebreo ng pangngalan at pandiwang magkaugnay mula sa salitang nangangahulugang “kawalang-kabuluhan,” “kawalang-laman,” o “pagiging walang saysay,” kaya may mariing paglalaro sa mga salita na mahirap lubos na tumbasan sa Tagalog.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Tingnan ninyo
  rationale: Isang mariing pantawag-pansin ang particle; pinananatili ng “Tingnan ninyo” ang puwersa nito sa likas at makabagong Tagalog.
- source_word: אַתֶּם כֻּלְּכֶם
  choice: ninyong lahat
  rationale: Ipinahahayag nito ang mariing ikalawang panauhang maramihan at ang pagiging saklaw ng bawat kausap.
- source_word: חֲזִיתֶם
  choice: nakita na
  rationale: Ang חזה ay tumutukoy sa pagkakita o tuwirang pagkaunawa; ipinahihiwatig ng “na” na nasaksihan na nila ang tinutukoy ni Job.
- source_word: וְלָמָּה
  choice: bakit pa
  rationale: Ikinakabit ng tanong ang pagsaway sa naunang katotohanang nakita na nila; natural na ipinahahayag ng “pa” ang ganitong lohikal na diin.
- source_word: זֶּה
  choice: —
  rationale: Sa pariralang ito, malamang na may idiomatiko o pampatinding gamit ang זֶּה. Hindi ito isinalin bilang hiwalay na “ito” upang maiwasan ang di-likas at posibleng mapanlinlang na Tagalog.
- source_word: הֶבֶל תֶּהְבָּלוּ
  choice: nagiging walang kabuluhan
  rationale: Magkaugat ang pangngalan at pandiwa sa Hebreo at mariing nagpapahayag ng kawalang-laman o kabuluhan. Natural sa Tagalog ang salin, bagaman hindi lubos na matutularan ang paglalaro sa magkaugnay na salita.
theological_decisions:
- issue: Kung ang pagsaway ay tumutukoy sa pagkatao, pagkilos, o pananalita ng mga kausap
  choice: nagiging walang kabuluhan
  alternative: kumikilos nang walang kabuluhan / nagsasalita ng walang kabuluhan
  rationale: Hindi tahasang tinutukoy ng Hebreong pandiwa kung sa pananalita lamang o sa mas malawak na asal umiiral ang kawalang-kabuluhan. Pinananatili ng pangunahing salin ang lawak ng pahayag.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog. Ang “Tingnan ninyo” ay mariin ngunit hindi makaluma; ang pangwakas na parirala ay sadyang hindi nilimitahan sa pananalita lamang upang mapanatili ang saklaw at kalabuan ng Hebreo.
