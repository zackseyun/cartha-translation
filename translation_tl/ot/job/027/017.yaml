  text: Maaaring ihanda niya iyon[a], ngunit ang matuwid ang magsusuot niyon[b], at ang walang-sala ang maghahati ng pilak.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Inihahanda niya iyon, ngunit ang matuwid ang magsusuot niyon.” Maaari ring isalin nang payak ang pandiwang Hebreo nang walang konsesibong diwa; sinusuportahan ng naunang talata ang diwang “Maaaring ihanda niya iyon, ngunit…”.
    reason: lexical_alternative
