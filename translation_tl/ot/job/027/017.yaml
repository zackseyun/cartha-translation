lexical_decisions:
- source_word: יָכִין
  choice: Maaaring ihanda niya iyon
  rationale: Ang Hiphil ng כון ay nangangahulugang “ihanda” o “gawing handa.” Ipinahihiwatig ng naunang talata ang layon—ang naipong kasuutan—kaya dinagdag ang “iyon.” Ang “maaaring” ay nagpapahayag ng konsesibong diwa na nagmumula sa konteksto, bagaman maaari ring payak na isaling “inihahanda niya.”
- source_word: צַדִּיק
  choice: ang matuwid
  rationale: Pang-uring ginamit bilang pangngalan. Ang “ang matuwid” ay natural sa Tagalog at hindi na kailangang dagdagan ng “tao” upang maipahayag ang kinatawang isahan.
- source_word: יִלְבָּשׁ
  choice: ang magsusuot niyon
  rationale: Ang Qal ng לבש ay “magsuot” o “isuot.” Ang layon ay ipinahihiwatig mula sa kasuutang binanggit sa naunang talata; ginagamit ang “niyon” para sa linaw.
- source_word: כֶסֶף
  choice: ang pilak
  rationale: Maaaring tumukoy ang כסף sa pilak o salapi. Sa konteksto ng naipong kayamanan at ng paghahati nito, pinananatili ng “pilak” ang kongkretong katawagan ng Hebreo.
- source_word: נָקִי
  choice: ang walang-sala
  rationale: Pang-uring ginamit bilang pangngalan na tumutukoy sa taong malaya sa pagkakasala o maling gawa. Ang “walang-sala” ay malinaw at likas sa modernong Tagalog.
- source_word: יַחֲלֹק
  choice: maghahati-hati
  rationale: Ang Qal ng חלק ay “hatiin” o “bahagi-bahaginan.” Ang “maghahati-hati” ay natural na nagpapahayag ng pamamahagi o paghahati ng naipong pilak nang hindi tinutukoy kung kanino eksaktong ibabahagi.
