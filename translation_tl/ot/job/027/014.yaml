  text: If his sons multiply[a], it is for the sword, and his descendants will not be satisfied with bread.
translation:
  language: tl
  text: Kung dumami ang kaniyang mga anak na lalaki, tabak ang nakalaan sa kanila; at ang kaniyang mga supling ay hindi mabubusog sa tinapay.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “hindi mabubusog sa tinapay”; ang “tinapay” ay maaari ring tumukoy sa pagkain sa pangkalahatan. Ipinahihiwatig nito na hindi sila magkakaroon ng sapat na makakain.
    reason: lexical_clarification
lexical_decisions:
- source_word: אִם
  choice: Kung ... man
  rationale: Ipinananatili ang kondisyunal na diwa ng אִם; ang “man” ay likas sa Filipino at nagpapahayag na kahit mangyari ang pagdami, hindi nito maiiwasan ang kasunod na kapahamakan.
- source_word: יִרְבּוּ
  choice: dumami
  rationale: Tuwirang ipinahahayag ang pagdami sa bilang, sa natural na modernong Filipino.
- source_word: בָנָיו
  choice: kaniyang mga anak na lalaki
  rationale: Tiyak na panlalaki ang pangngalang Hebreo, kaya hindi ito pinalawak tungo sa pangkalahatang “mga anak.”
- source_word: לְמוֹ חָרֶב
  choice: tabak ang nakalaan sa kanila
  rationale: Ang לְמוֹ ay tumutukoy sa mga anak bilang tatanggap ng kapalarang sinasagisag ng “tabak.” Likas sa Filipino ang ayos na ito at pinananatili ang konkretong larawan ng marahas na kamatayan.
- source_word: וְצֶאֱצָאָיו
  choice: at ang kaniyang mga supling
  rationale: Ang “mga supling” ay mas malawak kaysa sa agarang mga anak at naaangkop sa saklaw ng Hebreong tumutukoy sa mga nagmula sa kaniya.
- source_word: לֹא יִשְׂבְּעוּ
  choice: hindi mabubusog
  rationale: Pinananatili ang pangunahing diwa ng שבע na pagiging busog o nasisiyahan, habang malinaw sa konteksto ang kakulangan ng pagkain.
- source_word: לָחֶם
  choice: tinapay
  rationale: Pinananatili ang konkretong larawang “tinapay,” bagaman maaari rin itong kumatawan sa pagkain sa pangkalahatan.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “kaniyang” para sa pormal ngunit kasalukuyang anyo, at pinanatili ang matitinding konkretong larawan ng “tabak” at “tinapay.”
