  text: Those who survive him will be buried by death[a], and his widows will not weep.
translation:
  language: tl
  text: Ang mga makaliligtas sa kaniya ay ililibing ng kamatayan[a], at ang mga balo niya ay hindi iiyak.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ililibing sa kamatayan.” Siksik at malabo ang pariralang Hebreo; maaaring tukuyin nito ang paraan o kapalaran ng paglilibing, o ang paglilibing sa gitna ng kamatayan.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂרִידוֹ
  choice: ang mga matitirang buhay sa kaniya
  rationale: Ang pangngalan ay tumutukoy sa natitira o nakaliligtas. Bagaman nasa anyong isahan, kolektibo ang gamit nito rito, gaya ng ipinahihiwatig ng kasunod na pandiwang maramihan.
- source_word: בַּמָּוֶת
  choice: ng kamatayan
  rationale: Ang ב na kasama ng מָוֶת ay maaaring magpahiwatig ng paraan o kalagayan. Pinananatili ng “ililibing ng kamatayan” ang matindi at siksik na larawan ng Hebreo nang hindi nilulutas ang likas na kalabuan nito.
- source_word: יִקָּבֵרוּ
  choice: ay ililibing
  rationale: Ang Nifal imperfect ng קבר ay may pasibong diwang “ililibing,” na likas at malinaw sa Tagalog.
- source_word: וְאַלְמְנֹתָיו
  choice: at ang kaniyang mga balo
  rationale: Tuwirang isinasalin ang pambabaeng pangngalang maramihan na may hulaping panlalaking isahan. Maaaring tumukoy ito sa mga babaeng nabalo dahil sa mga kamatayang binabanggit.
- source_word: לֹא תִבְכֶּינָה
  choice: ay hindi iiyak
  rationale: Ang בכה ay karaniwang nangangahulugang umiyak o tumangis. Ang “iiyak” ay eksakto, natural, at hindi pinalalawak sa mas pangkalahatang “magluluksa.”
