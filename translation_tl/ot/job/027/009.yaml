  text: הַֽ֭/צַעֲקָת/וֹ יִשְׁמַ֥ע אֵ֑ל כִּֽי תָב֖וֹא עָלָ֣י/ו צָרָֽה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/027/009.yaml
  text: Will God hear his cry when distress comes upon him?[a][b][c]
translation:
  language: tl
  text: Pakikinggan ba ng Diyos ang kanyang daing kapag dumating sa kanya ang kagipitan?[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang kanyang sigaw” o “ang kanyang pagsusumamo.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “kung dumating sa kanya ang kagipitan”; maaari ring unawain bilang kondisyonal ang pangatnig sa Hebrew, bagaman ang “kapag” ay angkop sa konteksto.
    reason: alternative_reading
  - marker: c
    text: Ang “kagipitan” ay maaari ring isaling “matinding hirap,” “kapahamakan,” o “pagdurusa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצַּעֲקָתוֹ
  choice: ang kanyang daing
  rationale: Ang צְעָקָה ay isang malakas at apurahang paghingi ng tulong dahil sa matinding hirap. Likas at marangal sa modernong Tagalog ang “daing,” at hindi nito nililimitahan ang salita sa panalangin lamang.
- source_word: יִשְׁמַע
  choice: Pakikinggan ba
  rationale: Ang yiqtol sa retorikal na tanong ay angkop isalin sa hinaharap. Ang “pakikinggan” ay maaaring magpahiwatig hindi lamang ng pagkarinig kundi ng pagbibigay-pansin sa daing, gaya ng maaaring saklaw ng Hebrew na שׁמע sa ganitong konteksto.
- source_word: אֵל
  choice: ng Diyos
  rationale: Ang אֵל ay tuwirang tumutukoy sa Diyos dito. Ang “Diyos” ang malinaw at karaniwang katumbas sa Tagalog.
- source_word: כִּי
  choice: kapag
  rationale: 'Mal自然 at kontekstuwal ang temporal na pagbasa: dumarating ang kagipitan. Gayunman, maaari ring unawain ang pangatnig bilang kondisyonal, kaya inilalahad iyon sa talababa.'
- source_word: תָבוֹא עָלָיו
  choice: dumating sa kanya
  rationale: Pinananatili nito ang payak na larawang literal ng בוא (“dumating”) kasunod ng עַל, habang nananatiling natural sa Tagalog.
- source_word: צָרָה
  choice: kagipitan
  rationale: Sinasaklaw ng “kagipitan” ang kalagayan ng matinding hirap o pagkakapos na ipinahihiwatig ng צָרָה, nang hindi agad pinatitindi ito bilang ganap na kapahamakan.
theological_decisions:
- issue: Ang puwersa ng tanong kung diringgin ng Diyos ang masamang tao
  choice: Pinanatili bilang retorikal na tanong nang walang idinagdag na tahasang sagot.
  alternative: Isalin o ipaliwanag na tiyak na hindi siya pakikinggan ng Diyos.
  rationale: Tanong ang anyo ng Hebrew. Bagaman nagpapahiwatig ang konteksto ng negatibong sagot, hindi dapat idagdag sa mismong salin ang sagot na hindi tahasang nakasaad sa talata.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, dignified, at madaling maunawaan. Ginamit ang “pakikinggan” at “daing” bilang natural na ekspresyon ng pagdinig sa apurahang paghingi ng tulong. Pinanatili ang kaiklian at retorikal na anyo ng Hebrew.
