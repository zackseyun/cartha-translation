base_translation:
  language: en
  yaml_path: translation/ot/job/027/002.yaml
  text: As God lives[a], who has taken away my justice, and the Almighty, who has made my soul bitter[b],
translation:
  language: tl
  text: Buháy ang Diyos[a], na nagkait sa akin ng katarungan, at ang Makapangyarihan sa Lahat, na ginawang mapait ang aking buhay[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “Buháy ang Diyos.” Isa itong pormula ng panunumpa.
    reason: idiom
  - marker: b
    text: Maaari ring “ginawang mapait ang aking kaluluwa” o “ginawang mapait ang aking sarili.” Ang Hebreong נֶפֶשׁ ay maaaring mangahulugang “buhay,” “sarili,” o “kaluluwa,” depende sa konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַי אֵל
  choice: Saksi ang Diyos na buháy
  rationale: Ang חַי na sinusundan ng titulong pantukoy sa Diyos ay pormula ng panunumpa. Ang “Saksi ang Diyos na buháy” ay likas at marangal sa modernong Tagalog at pinananatili ang puwersa ng panunumpa, sa halip na gawing paglalarawan lamang ang parirala.
- source_word: אֵל
  choice: Diyos
  rationale: Karaniwang titulong tumutukoy sa Diyos ang אֵל dito at bahagi ito ng pormula ng panunumpa.
- source_word: הֵסִיר
  choice: nagkait
  rationale: Ang Hiphil ng סור ay nangangahulugang alisin o ipagkait. Sa kontekstong legal ng מִשְׁפָּטִי, malinaw at natural ang “nagkait sa akin,” bagaman mas literal ang “nag-alis.”
- source_word: מִשְׁפָּטִי
  choice: katarungan
  rationale: Maaaring tumukoy ang מִשְׁפָּט sa katarungan, karapatan, hatol, o makatarungang paghahabol. Pinananatili ng “katarungan” ang lawak at tindi ng hinaing ni Job.
- source_word: וְשַׁדַּי
  choice: at ang Makapangyarihan sa Lahat
  rationale: Isinalin ang titulong שַׁדַּי sa karaniwang Tagalog sa halip na transliterahin, habang pinananatili ang maringal na paralelismo.
- source_word: הֵמַר
  choice: nagpait
  rationale: Ang Hiphil ng מרר ay “gawing mapait” o “paitin.” Ang “nagpait” ay maikli, matalinghaga, at angkop sa panulaan.
- source_word: נַפְשִׁי
  choice: aking buhay
  rationale: Ang נֶפֶשׁ ay maaaring mangahulugang buhay, sarili, o kaluluwa. Sa idyomang ito, natural na ipinahahayag ng “aking buhay” ang buong personal na pagdurusa nang hindi nagpapasok ng teknikal na paghahati ng katawan at kaluluwa.
theological_decisions:
- issue: Pagsasalin sa mga titulong אֵל at שַׁדַּי
  choice: Diyos … ang Makapangyarihan sa Lahat
  alternative: Diyos … Shaddai
  rationale: Isinalin ang mga titulong banal upang maging malinaw ang kahulugan sa karaniwang mambabasa, habang nananatili ang taimtim na paralelismo ng panunumpa.
- issue: Ang reklamo ni Job na inalis ng Diyos ang kaniyang מִשְׁפָּט
  choice: nagkait sa akin ng katarungan
  alternative: nag-alis ng aking karapatan / makatarungang paghahabol
  rationale: 'Hindi nilulutas o pinahihina ng salin ang matinding teolohikal na tensiyon: tahasang ipinapahayag ni Job sa kaniyang panunumpa na ipinagkait sa kaniya ng Diyos ang katarungan.'
translation_notes:
  register: Modernong Filipino Tagalog na marangal at patula. Ginamit ang “Saksi ang Diyos na buháy” bilang natural na pormula ng panunumpa at “nagpait sa aking buhay” upang mapanatili ang konkretong talinghaga. Nananatili ang kuwit sa hulihan sapagkat nagpapatuloy ang panunumpa sa kasunod na talata.
