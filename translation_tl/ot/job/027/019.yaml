base_translation:
  language: en
  yaml_path: translation/ot/job/027/019.yaml
  text: He lies down rich[a], but he will not be gathered; he opens his eyes[b], and he is gone.
translation:
  language: tl
  text: Mayaman siyang humihiga, ngunit hindi siya titipunin.[a] Pagmulat niya, wala na siya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring unawain bilang, “hindi siya titipunin sa kanyang mga ninuno.” Maikli ang Hebreo at maaaring nagpapahiwatig ng kamatayan at paglilibing nang hindi ito tahasang sinasabi.
    reason: alternative_reading
  - marker: b
    text: Sa literal, “at wala siya”; isang idyomang nangangahulugang wala na siya o naglaho na.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָשִׁיר
  choice: mayaman
  rationale: Pinananatili ang pang-uri bilang panaguri—“humihiga siyang mayaman”—nang hindi idinaragdag ang salitang “tao,” na wala sa Hebreo.
- source_word: יִשְׁכַּב
  choice: humihiga
  rationale: Ang payak na diwang “humiga” ay inihayag sa masiglang pangkasalukuyang anyo, gaya ng matalinghagang paglalahad sa konteksto.
- source_word: וְלֹא יֵאָסֵף
  choice: ngunit hindi siya titipunin
  rationale: Pinananatili ang maikli at malabong pahayag ng Hebreo. Maaaring tumukoy ito sa kamatayan, paglilibing, o pagkatipon sa kanyang mga ninuno, ngunit hindi tahasang sinasabi ng talata.
- source_word: עֵינָיו פָּקַח
  choice: pagdilat niya ng kanyang mga mata
  rationale: Likas sa modernong Tagalog at pinananatili ang biglang paglipat ng tagpo sa Hebreo.
- source_word: וְאֵינֶנּוּ
  choice: wala na siya
  rationale: Natural na Tagalog para sa idyomang literal na “at wala siya,” na maaaring magpahiwatig ng paglaho o kamatayan.
theological_decisions:
- issue: Ang kahulugan ng “hindi siya titipunin”
  choice: Hindi pinalawak sa pangunahing teksto
  alternative: “hindi siya titipunin sa kanyang mga ninuno” o mas pangkalahatang “hindi siya maililibing”
  rationale: Hindi tinutukoy ng Hebreo kung ano o kanino siya titipunin; pinananatili ang tunay na kalabuan at iniiwasang gawing tiyak ang isang posibleng pahiwatig tungkol sa kamatayan at paglilibing.
translation_notes:
  register: Modernong Filipino Tagalog na maikli, marangal, at patula. Ang “titipunin” ay sadyang pinanatili upang huwag alisin ang kalabuan ng Hebreo; ipinaliliwanag ito sa talababa. Ang mga panandang [a] at [b] ay kapwa nasa pangunahing teksto.
