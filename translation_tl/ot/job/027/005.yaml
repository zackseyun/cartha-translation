  text: חָלִ֣ילָ/ה לִּ/י֮ אִם אַצְדִּ֪יק אֶ֫תְ/כֶ֥ם עַד אֶגְוָ֑ע לֹא אָסִ֖יר תֻּמָּתִ֣/י מִמֶּֽ/נִּי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/027/005.yaml
  text: Far be it from me to declare you right[a]; until I die[b], I will not remove my integrity from myself.
translation:
  language: tl
  text: Hinding-hindi ko sasabihing kayo ang nasa tama[a]. Hanggang sa mamatay ako, hindi ko iwawaksi ang aking integridad[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ipahahayag kong kayo ang matuwid” o “kikilalaning tama kayo.” Ang pandiwang Hebreo ay maaaring gamitin sa pasyang nagsasabing isang panig ang nasa tama.
    reason: lexical_alternative
  - marker: b
    text: O “pagiging walang kapintasan.” Ang salitang Hebreo ay maaaring tumukoy sa integridad o sa pagiging walang maipipintas sa konteksto ng pagtatanggol ni Job sa sarili.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָלִילָה לִּי
  choice: Hinding-hindi ko
  rationale: Likas na pahayag sa makabagong Tagalog ng mariing pagtanggi at pagkasuklam sa isang posibilidad; pinananatili nito ang lakas ng idyomang Hebreo nang hindi nagiging salitang-salita.
- source_word: אִם אַצְדִּיק אֶתְכֶם
  choice: sasabihing kayo ang nasa tama
  rationale: 'Ang Hiphil ng צדק ay may diwang panghatol: ipahayag o kilalaning ang isang panig ang nasa tama. Malinaw ito sa karaniwang mambabasa at hindi nag-aangkat ng makitid na teolohikal na gamit ng “ariing-ganap.”'
- source_word: עַד אֶגְוָע
  choice: Hanggang sa mamatay ako
  rationale: Tuwiran, natural, at marangal na katumbas ng pandiwang Hebreo para sa pagkamatay o pagpanaw.
- source_word: לֹא אָסִיר
  choice: hindi ko iwawaksi
  rationale: Ipinahihiwatig ng Hiphil ng סור ang pag-aalis o pagtataboy palayo. Ang “iwawaksi” ay natural sa Tagalog at pinananatili ang konkretong larawan ng sadyang pag-aalis.
- source_word: תֻּמָּתִי
  choice: ang aking integridad
  rationale: Saklaw ng תֻּמָּה ang pagiging buo, matuwid, o walang maipipintas sa asal. Ang “integridad” ay kasalukuyang gamit, natural, at hindi nagpapalabis tungo sa pag-aangking ganap na walang kasalanan.
- source_word: מִמֶּנִּי
  choice: nakapaloob sa pandiwang “iwawaksi” at sa pagmamay-aring “aking”
  rationale: Magiging pilit sa Tagalog ang literal na “aalisin mula sa aking sarili.” Naipahahayag ng napiling pangungusap ang diwang hindi ihihiwalay ni Job sa sarili niya ang kanyang integridad.
theological_decisions:
- issue: Saklaw ng pag-aangkin ni Job tungkol sa kanyang moral na kalagayan
  choice: integridad
  alternative: kawalang-sala; pagiging walang kapintasan
  rationale: Ipinagpipilitan ni Job na hindi niya tatalikuran ang kanyang matuwid na paninindigan sa harap ng paratang ng mga kaibigan. Hindi nito awtomatikong ginagawang pag-aangkin ng ganap na kawalang-kasalanan ang sinabi niya.
- issue: Diwang panghatol ng אַצְדִּיק
  choice: sasabihing kayo ang nasa tama
  alternative: aariin kayong ganap; ipahahayag kayong matuwid
  rationale: Pinananatili nito ang usaping kung sino ang tama sa pagtatalo nang hindi ipinapasok ang isang espesyalisadong doktrinal na kahulugan.
translation_notes:
  register: Makabago at madaling maunawaang Filipino, ngunit marangal at angkop sa masidhing pananalita ni Job. Ginamit ang maramihang “kayo” dahil maramihan ang Hebreong panghalip. Inilipat ang [b] sa “integridad,” sapagkat ang nilalaman ng talababa ay tumutukoy sa תֻּמָּתִי, hindi sa pariralang “hanggang sa mamatay ako.”
