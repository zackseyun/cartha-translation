  text: בְּ/צִדְקָתִ֣/י הֶ֭חֱזַקְתִּי וְ/לֹ֣א אַרְפֶּ֑/הָ לֹֽא יֶחֱרַ֥ף לְ֝בָבִ֗/י מִ/יָּמָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/027/006.yaml
  text: I hold fast to my righteousness and will not let it go[b][a]; my heart does not reproach me for any of my days.
translation:
  language: tl
  text: Mahigpit kong pinanghahawakan ang aking katuwiran at hindi ko ito bibitiwan; hindi ako sinusumbatan ng puso ko sa alinman sa mga araw ko.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa buong buhay ko.” Maaari ring unawain ang Hebreong pahayag bilang “hindi ako nilalait o tinutuya ng puso ko sa lahat ng aking mga araw.” Inilalarawan nito ang panloob na pagsumbat sa sarili.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּצִדְקָתִי
  choice: ang aking katuwiran
  rationale: Karaniwang tumutukoy ang צִדְקָה sa katuwiran o pagiging nasa tama. Sa konteksto ng paggiit ni Job sa kanyang kawalang-sala, maaari rin itong lumapit sa diwang 'katapatan sa matuwid,' ngunit pinananatili ng 'katuwiran' ang moral at hudisyal na lakas ng salita.
- source_word: הֶחֱזַקְתִּי
  choice: Mahigpit kong pinanghahawakan
  rationale: Ang Hiphil ng חזק ay nagpapahayag ng matatag na pagkapit o paghawak. Ang kasalukuyang anyo ay natural sa Filipino at naghahatid ng patuloy na paninindigan ni Job.
- source_word: וְלֹא אַרְפֶּהָ
  choice: at hindi ko ito bibitiwan
  rationale: Ang רפה sa Hiphil ay nangangahulugang magpakawala, magluwag ng hawak, o bumitaw. Ang 'ito' ay tumutukoy pabalik sa pambabaeng pangngalang צִדְקָתִי.
- source_word: לֹא יֶחֱרַף לְבָבִי
  choice: hindi ako sinusumbatan ng puso ko
  rationale: Ang חרף ay maaaring mangahulugang manumbat, mang-alipusta, o manlait. Sa puso bilang simuno, ipinahihiwatig nito ang panloob na pagsumbat sa sarili; pinananatili ang 'puso' sa halip na ipakahulugang 'budhi.'
- source_word: מִיָּמָי
  choice: sa alinman sa mga araw ko
  rationale: Sa saklaw ng pagtanggi, ang parirala ay nagsasaad na walang bahagi ng kanyang mga araw o buhay ang dahilan ng pagsumbat. Ang salin ay nagpapanatili sa anyong 'mga araw' at nililinaw ang negatibong saklaw.
theological_decisions:
- issue: Kung ang צִדְקָה ay isasaling may mas malakas na moral-hudisyal na diwa o bilang personal na integridad lamang.
  choice: katuwiran
  alternative: integridad
  rationale: Ang 'katuwiran' ang mas tuwirang katumbas ng karaniwang diwa ng pangngalan at pinananatili ang lakas ng pag-aangkin ni Job. Ang 'integridad' ay posibleng kontekstuwal na paliwanag ngunit maaaring paliitin ang pahayag tungo sa katapatan o sinseridad lamang.
translation_notes:
  register: Makabagong, marangal, at madaling maunawaang Filipino. Pinanatili ang konkretong 'puso' ng Hebreo sa halip na palitan ng mas interpretibong 'budhi,' at ginamit ang 'katuwiran' upang mapanatili ang moral-hudisyal na tensiyon ng pahayag ni Job.
