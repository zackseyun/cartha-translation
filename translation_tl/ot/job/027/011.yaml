  yaml_path: translation/ot/job/027/011.yaml
  text: I will teach you concerning the hand of God[b][a]; what is with the Almighty I will not hide.
translation:
  language: tl
  text: Ituturo ko sa inyo ang ukol sa kamay ng Diyos[a]; hindi ko itatago ang nauukol sa Makapangyarihan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa pamamagitan ng kamay ng Diyos.” Maaari ring unawain ang “kamay ng Diyos” bilang tumutukoy sa kanyang kapangyarihan, pagkilos, o pakikitungo.
    reason: lexical_alternative
  - marker: b
    text: O “kung ano ang taglay ng Makapangyarihan,” “ang pag-aari ng Makapangyarihan,” o “ang mula sa Makapangyarihan.” Maikli at medyo eliptikal ang pariralang Hebreo.
    reason: alternative_reading
lexical_decisions:
- source_word: אוֹרֶה
  choice: Ituturo ko
  rationale: Ang Hiphil imperfect na unang panauhang isahan ng ירה ay ginagamit dito sa diwang magturo; likas sa konteksto ang pahayag na nasa hinaharap.
- source_word: אֶתְכֶם
  choice: sa inyo
  rationale: Tumutukoy ito sa ikalawang panauhang maramihan; hinihingi ng pandiwang Tagalog na “ituro” ang pariralang “sa inyo.”
- source_word: בְּיַד אֵל
  choice: ang tungkol sa kamay ng Diyos
  rationale: Pinakamalamang na paksa ng pagtuturo ang ipinahihiwatig ng ב, hindi ang kasangkapan nito. Pinananatili ng salin ang metaporang “kamay,” na maaaring tumukoy sa kapangyarihan, pagkilos, o pakikitungo ng Diyos.
- source_word: אֵל
  choice: Diyos
  rationale: Karaniwan at malinaw na salin ng banal na titulong אֵל sa kontekstong ito.
- source_word: אֲשֶׁר עִם שַׁדַּי
  choice: ang nauukol sa Makapangyarihan
  rationale: Maikli at eliptikal ang Hebreo. Ang “nauukol sa” ay natural sa Tagalog ngunit nananatiling malawak, nang hindi ito nililimitahan sa payo, layunin, o hatol.
- source_word: שַׁדַּי
  choice: Makapangyarihan
  rationale: Karaniwan at marangal na salin ng banal na titulong שַׁדַּי sa aklat ng Job.
- source_word: לֹא אֲכַחֵד
  choice: hindi ko itatago
  rationale: Ang Piel imperfect ng כחד ay karaniwang nangangahulugang magkubli o magtago; ang “itatago” ay tuwiran at natural.
theological_decisions:
- issue: Pagkilos ng Diyos na ipinahahayag ng “kamay ng Diyos”
  choice: Pinanatili ang metaporang “kamay ng Diyos.”
  alternative: kapangyarihan ng Diyos; mga ginagawa ng Diyos
  rationale: Mayaman at karaniwang larawan sa Kasulatan ang “kamay.” Ang pagpapanatili rito ay umiiwas sa di-kinakailangang paglilimita ng kahulugan sa kapangyarihan lamang o sa isang uri ng pagkilos.
- issue: Kahulugan ng eliptikal na pariralang אֲשֶׁר עִם שַׁדַּי
  choice: ang nauukol sa Makapangyarihan
  alternative: ang payo ng Makapangyarihan; ang layunin ng Makapangyarihan; ang mula sa Makapangyarihan
  rationale: Hindi tahasang tinutukoy ng Hebreo kung payo, layunin, gawain, o ibang bagay ang nasa isip. Pinananatili ng “nauukol sa” ang lawak at tensiyon ng orihinal.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Ituturo ko sa inyo” bilang likas na ayos sa Tagalog, pinanatili ang imaheng “kamay ng Diyos,” at isinalin ang eliptikal na ikalawang sugnay nang natural ngunit hindi labis na nagpapakahulugan.
