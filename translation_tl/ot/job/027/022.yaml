lexical_decisions:
- source_word: וְיַשְׁלֵךְ עָלָיו
  choice: Pinupukol niya ang taong iyon
  rationale: Ang Hiphil ng שׁלך ay nangangahulugang “maghagis/magpukol,” at ang עָלָיו ay nagpapahiwatig ng kilos na nakatuon laban sa kanya. Likas sa modernong Tagalog ang “pinupukol” para sa marahas na paghagis laban sa isang tao, samantalang iniiwasan nitong idagdag ang reflexive na “ang sarili niya,” na wala sa Hebreo. Ginamit ang “ang taong iyon” upang malinaw na maiba ang inaatake sa di-tahasang simuno nang hindi pinapangalanan ang simuno.
- source_word: וְלֹא יַחְמֹל
  choice: at hindi niya ito kinahahabagan
  rationale: Saklaw ng חמל ang hindi pagpatay o hindi pagpaparusa at ang pagkahabag. Ang “hindi kinahahabagan” ay natural at pinananatili ang kawalan ng awa nang hindi nililimitahan ang diwa sa isang tiyak na uri ng kaparusahan.
- source_word: מִיָּדוֹ
  choice: mula sa kanyang kamay
  rationale: Pinananatili ng “kamay” ang konkretong larawang Hebreo, na maaari ring magpahiwatig ng kapangyarihan o pagkakahawak.
- source_word: בָּרוֹחַ יִבְרָח
  choice: talagang tumatakas
  rationale: Ang infinitive absolute na בָּרוֹחַ kasama ng finite verb na יִבְרָח ay nagbibigay-diin sa pagtakas. Ipinahahayag ito ng “talagang” nang hindi nagdaragdag ng mas tiyak na paraan gaya ng “nagmamadali” o “walang patumangga.”
theological_decisions:
- issue: Hindi tahasang tinukoy na simuno ng וְיַשְׁלֵךְ
  choice: Panatilihin ang panghalip na “niya” at ipaliwanag ang kalabuan sa talababa
  alternative: Tahasan itong tukuyin bilang Diyos o bilang hangin/bagyo
  rationale: Walang nakasulat na pangngalang simuno sa talata. Maaaring iugnay ito sa Diyos o sa hangin/bagyong binanggit sa naunang konteksto. Hindi dapat tahasang lutasin ng salin ang tunay na kalabuan ng Hebreo.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Pinili ang “pinupukol” upang maiparating ang marahas na kilos ng paghagis sa natural na Tagalog; pinanatili ang “kamay” bilang larawang Hebreo at ang panghalip na “niya” upang hindi sapilitang tukuyin ang di-tahasang simuno.
