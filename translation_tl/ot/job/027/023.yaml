  text: He claps his hands at him and hisses at him from his place[a][b].
translation:
  language: tl
  text: Ipinapalakpak niya ang kanyang mga kamay sa kanya at sinisitsitan siya mula sa kanyang kinaroroonan.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sinisipulan.” Ang pandiwang Hebreo ay maaaring tumukoy sa pagsipol o pagsitsit; pinili rito ang “sinisitsitan” upang maipakita ang mapanlibak na himig ng konteksto.
    reason: lexical_alternative
  - marker: b
    text: 'Hindi hayag sa Hebreo ang simuno: “ipinapalakpak niya … at sinisitsitan.” Iba-iba ang pagkaunawa rito bilang Diyos, ibang mga tao, o isang di-personal na puwersa.'
    reason: alternative_reading
lexical_decisions:
- source_word: יִשְׂפֹּק
  choice: ipinapalakpak
  rationale: Ang Qal ng שׂפק kasama ng כפים ay tumutukoy sa paghampas o pagpapalakpak ng mga kamay. Pinananatili ng “ipinapalakpak” ang kongkretong kilos nang hindi ipinapasya kung ito ay tanda ng paghamak, pagtatagumpay, o iba pang damdamin.
- source_word: עָלֵימוֹ
  choice: laban sa kanya
  rationale: Ang על na may hulaping panghalip ay maaaring mangahulugang “sa,” “sa ibabaw ng,” o “laban sa.” Dito, malinaw na ipinahihiwatig ng konteksto ang kilos na nakatuon laban sa taong tinutukoy.
- source_word: כַפֵּימוֹ
  choice: ang kanyang mga kamay
  rationale: Bagaman ang כף ay literal na “palad,” karaniwan itong tumutukoy sa buong kamay sa idyomang pagpapalakpak ng mga kamay.
- source_word: וְיִשְׁרֹק
  choice: sinisitsitan
  rationale: Ang שרק ay maaaring tumukoy sa pagsipol o pagsitsit. Ang “sinisitsitan” ay natural sa makabagong Filipino at nagpapahayag ng mapanlibak o mapanlait na tunog sa kontekstong ito; inilalahad sa talababa ang alternatibong “sinisipulan.”
- source_word: עָלָיו
  choice: siya
  rationale: Sa pandiwang “sinisitsitan,” likas sa Filipino na gawing tuwirang layon ang taong pinatutungkulan ng kilos, kaya “sinisitsitan siya.”
- source_word: מִמְּקֹמוֹ
  choice: mula sa kanyang kinaroroonan
  rationale: Ang מקום ay “lugar.” Mas natural sa Filipino ang “mula sa kanyang kinaroroonan” kaysa “mula sa kanyang lugar,” habang hindi tinutukoy kung tahanan, puwesto, o ibang uri ng lugar ang ibig sabihin.
theological_decisions:
- issue: Pagkakakilanlan ng simuno ng talata
  choice: Pinanatili ang di-tiyak na panghalip na isahan na “niya” sa halip na pangalanan ang gumagawa.
  alternative: Maaaring unawain ang gumagawa bilang Diyos, ibang mga tao, o isang di-personal na puwersa gaya ng hanging silangan.
  rationale: Ang Hebreo ay may mga pandiwang nasa ikatlong panauhang panlalaking isahan ngunit walang hayag na simuno. Hindi tiyak sa talata kung sino ang gumagawa, kaya hindi ito nilinaw nang lampas sa sinasabi ng teksto.
translation_notes:
  register: Makabago at dignified na Filipino ang ginamit. Pinanatili ang mga panghalip upang huwag tukuyin ang simunong hindi pinangalanan sa Hebreo. Ang “laban sa kanya” ay bahagyang pormal ngunit kailangan upang hindi magmukhang pagpapahalaga o pagbati ang pagpapalakpak.
