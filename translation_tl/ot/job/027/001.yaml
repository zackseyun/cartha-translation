lexical_decisions:
- source_word: וַיֹּסֶף
  choice: muling ipinagpatuloy
  rationale: Ipinahihiwatig ng יסף ang pagdaragdag o pagpapatuloy; kasama ng kasunod na idyoma, natural nitong ipinapahayag na muling nagpatuloy si Job sa pagsasalita.
- source_word: אִיּוֹב
  choice: Job
  rationale: Ginamit ang nakaugaliang anyo ng pangalang ito sa modernong salin sa Filipino.
- source_word: שְׂאֵת
  choice: ipinagpatuloy
  rationale: Ang literal na diwang 'buhatin' ng נשׂא ay bahagi rito ng idyomang nangangahulugang bumigkas o maglahad ng isang pormal na pahayag; iniwasan ang di-natural na literal na 'itinaas'.
- source_word: מְשָׁלוֹ
  choice: ang kanyang mabigat na pahayag
  rationale: Malawak ang saklaw ng מָשָׁל—maaaring salawikain, talinghaga, orakulo, o masining at makapangyarihang pahayag. Sa konteksto, isang mahabang patulang pananalita ang sumusunod, kaya ang 'mabigat na pahayag' ay natural at nagpapanatili sa pormal at makahulugang katangian nito.
- source_word: וַיֹּאמַר
  choice: Sinabi niya
  rationale: Tuwirang katumbas ng karaniwang pormulang Hebreo na nagpapakilala sa kasunod na pananalita.
