  text: At muling ipinagpatuloy ni Job ang kanyang pahayag at sinabi:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang kanyang salawikain,” “ang kanyang talinghaga,” o “ang kanyang orakulo.” Malawak ang kahulugan ng salitang Hebreo at maaari itong tumukoy sa iba’t ibang uri ng makahulugan o matalinghagang pananalita.
