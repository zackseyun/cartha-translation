  terminology: Ang “karahasan,” “mga kamay,” “panalangin,” at “dalisay” ay angkop, malinaw, at hindi nagdaragdag ng doktrinal na pagpapakahulugan. Wasto ring nakatali ang mga talababa sa salitang/sugnay na kanilang nililinaw.
