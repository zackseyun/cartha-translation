translation:
  language: tl
  text: Bagaman walang karahasan sa aking mga kamay,[a] at dalisay ang aking panalangin.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Sapagkat walang karahasan sa aking mga kamay.” Maaaring unawain sa iba’t ibang paraan ang pang-ukol sa Hebreo; ginamit sa pangunahing teksto ang diwang pasalungat ayon sa konteksto.
    reason: lexical_alternative
  - marker: b
    text: O “malinis.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל
  choice: bagaman
  rationale: Sa konteksto ng pagtutol ni Job sa gitna ng pagdurusa, natural itong unawain bilang panandang pasalungat. Pinananatili sa talababa ang ibang posibleng ugnayan.
- source_word: לֹא חָמָס
  choice: walang karahasan
  rationale: Ang חָמָס ay maaaring tumukoy sa karahasan, kasamaan, o kawalang-katarungan. Ang “karahasan” ang tuwiran at konkretong katumbas nang hindi inaalis ang moral na bigat nito.
- source_word: בְּכַפָּי
  choice: sa aking mga kamay
  rationale: Pinananatili nito ang konkretong larawan ng Hebreo at ang diwang walang marahas na gawang maibibintang kay Job.
- source_word: וּתְפִלָּתִי
  choice: at ... ang aking panalangin
  rationale: Karaniwang kahulugan ng תְּפִלָּה ang “panalangin”; ang ayos ng pangungusap ay natural sa modernong Filipino.
- source_word: זַכָּה
  choice: dalisay
  rationale: Ipinahahayag nito ang kalinisan o kadalisayan ng panalangin. Dignified at natural itong gamitin sa panalangin, habang ang literal na alternatibong “malinis” ay inilalagay sa talababa.
theological_decisions:
- issue: Ang pahayag ni Job tungkol sa sarili niyang kawalang-sala
  choice: Inilarawan ito bilang tiyak na pagtutol sa paratang ng karahasan at bilang paggiit na dalisay ang kanyang panalangin.
  alternative: Unawain ito bilang ganap na pag-aangkin na wala siyang anumang kasalanan, o bilang pahayag lamang tungkol sa rituwal na kalinisan.
  rationale: Ang talata ay tuwirang tumutukoy sa kawalan ng karahasan sa kanyang mga kamay at sa uri ng kanyang panalangin. Hindi pinalalawak ng salin ang pahayag tungo sa ganap na kawalang-kasalanan at hindi rin nililimitahan sa rituwal na kalinisan.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Pinanatili ang larawang “sa aking mga kamay” at ang pasalungat na ugnayan ng unang sugnay, habang inilalahad sa talababa ang tunay na ambigwidad ng Hebreo.
