  to: Nilapa niya ako sa kanyang galit at kinapootan niya ako; nagngangalit siya ng ngipin laban sa akin. Pinatatalas ng aking kaaway ang kanyang mga mata laban sa akin.[a]
  rationale: Idinagdag ang malinaw na layong “niya ako” upang ganap na maisalin ang pandiwang Hebreo at maiwasan ang putol na sintaks. Inayos ang ikalawang sugnay sa mas likas na idyomang Filipino na “nagngangalit siya ng ngipin,” nang hindi binabago ang larawan o ang panahunan. Pinanatili ang “aking kaaway” at ang metaporang “pinatatalas ... ang kanyang mga mata” upang huwag tukuyin ang hindi tahasang referent at huwag pakinisin ang matinding imahen ng Hebreo.
