  yaml_path: translation/ot/job/016/009.yaml
  text: His anger has torn me and hated me[a]; he gnashes his teeth at me; my adversary sharpens his eyes against me.
translation:
  language: tl
  text: Nilapa niya ako sa kanyang galit at kinapootan niya ako; nagngangalit siya ng ngipin laban sa akin. Pinatatalas ng aking kaaway ang kanyang mga mata laban sa akin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “pinatatalas ng aking kaaway ang kanyang mga mata laban sa akin”—isang metapora para sa matalim at mapanlabang pagtitig.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַפּוֹ
  choice: sa kanyang galit
  rationale: Ang אַף ay literal na “ilong” ngunit karaniwang tumutukoy sa galit; likas at malinaw sa modernong Tagalog ang “sa kanyang galit.”
- source_word: טָרַף
  choice: nilapa
  rationale: Ipinapanatili ng “nilapa” ang matingkad na larawan ng mabangis na hayop na pumupunit sa sinila.
- source_word: וַיִּשְׂטְמֵנִי
  choice: at kinapootan
  rationale: Tuwirang ipinahahayag nito ang pagkapoot o matinding pagkam düşman ng שׂטם nang hindi nagdaragdag ng hiwalay na kilos ng paglusob.
- source_word: חָרַק עָלַי בְּשִׁנָּיו
  choice: nagngangalit ang kanyang mga ngipin laban sa akin
  rationale: Ang “nagngangalit ang mga ngipin” ay natural na idyomang Filipino para sa pagngangalit o pagkiskis ng ngipin dahil sa poot, habang pinananatili ng “laban sa akin” ang masamang pagtutok.
- source_word: צָרִי
  choice: aking kaaway
  rationale: Malinaw at karaniwang salita ang “kaaway” para sa isang kumakalaban, ngunit hindi nito tinutukoy kung ang tinutukoy ay Diyos, isang tao, o isang makatang paglalarawan sa Diyos bilang kaaway.
- source_word: יִלְטוֹשׁ
  choice: pinatatalas
  rationale: Pinananatili nito ang di-pangkaraniwan ngunit sadyang matinding metapora ng Hebreo na “patalasin” ang mga mata.
- source_word: עֵינָיו לִי
  choice: ang kanyang mga mata laban sa akin
  rationale: Ang “laban sa akin” ay naghahayag ng mapanlabang pagtitig at tumutugma sa konteksto, sa halip na neutral na “sa akin.”
theological_decisions:
- issue: Ang tinutukoy ng panlalaking isahang paksa sa panaghoy ni Job
  choice: Panatilihin ang mga panghalip na “niya/kanyang” at ang “aking kaaway” nang hindi tahasang pinapangalanan ang tinutukoy.
  alternative: Tukuyin ang paksa bilang Diyos, isang taong kaaway, o isang pinagsamang makatang larawan ng Diyos na kumikilos bilang kaaway.
  rationale: Panlalaking isahan ang mga anyo sa Hebreo, ngunit hindi muling pinapangalanan ng talata ang paksa. Pinananatili nito ang tunay na kalabuan at tensiyong teolohikal ng panaghoy.
translation_notes:
  register: Modernong Filipino na marangal at patula. Ginamit ang “nilapa” upang mapanatili ang larawang mandaragit, at pinanatili ang kakaibang metaporang “pinatatalas ... ang mga mata” sa halip na pakinisin bilang simpleng “tinitigan nang masama.”
