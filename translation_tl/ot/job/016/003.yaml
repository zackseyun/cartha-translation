  register: Makabago at dignidad na Filipino na madaling maunawaan. Ang “mga salitang puro hangin” ay nagpapanatili sa Hebreong talinghaga habang natural na naghahatid ng diwang hungkag na pananalita. Ang tono ay tuwiran at may pagkayamot, gaya ng retorikal na pananalita ni Job.
