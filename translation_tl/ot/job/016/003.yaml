  yaml_path: translation/ot/job/016/003.yaml
  text: Is there no end to windy words? Or what provokes you[a], that you answer this way?
translation:
  language: tl
  text: Wala na bang katapusan ang mga salitang puro hangin? O ano ang umuudyok sa iyo[a] para sumagot ka nang ganyan?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ano ang nagpapalakas ng loob mo para sumagot?”
    reason: Pinananatili ang posibleng kahulugan ng יַמְרִיצְךָ bilang pagbibigay ng tapang o lakas ng loob, sa halip na pag-uudyok.
lexical_decisions:
- source_word: הֲקֵץ
  choice: Wala na bang katapusan
  rationale: Ipinahahayag nito ang retorikal na tanong at pagkayamot ni Job, habang pinananatili ang kahulugan ng קֵץ bilang “katapusan” o “hangganan.”
- source_word: לְדִבְרֵי רוּחַ
  choice: ang mga salitang puro hangin
  rationale: Pinananatili ang konkretong talinghaga ng רוּחַ (“hangin”) at likas na ipinahihiwatig sa Filipino ang pananalitang walang laman o kabuluhan.
- source_word: אוֹ
  choice: O
  rationale: Tuwirang nag-uugnay sa ikalawang retorikal na tanong bilang alternatibong hamon.
- source_word: מַה
  choice: ano
  rationale: Pinananatili ang tuwirang anyo ng interrogative pronoun nang hindi ito ginagawang “bakit.”
- source_word: יַמְרִיצְךָ
  choice: umuudyok sa iyo
  rationale: Ipinahahayag ang diwa ng pagtutulak o pag-uudyok sa isang tao na tumugon, ngunit hindi labis na tinutukoy kung galit, tapang, o ibang motibo ang sanhi.
- source_word: כִּי
  choice: para
  rationale: Natural na ipinakikita sa Filipino ang ugnayan ng pag-uudyok at ng kasunod na pagsagot sa kontekstong ito.
- source_word: תַעֲנֶה
  choice: sumagot ka nang ganyan
  rationale: Ang “sumagot” ang karaniwang kahulugan ng pandiwa; ang “nang ganyan” ay maingat na pagpapalinaw sa mapanuyang puwersa ng tanong ayon sa konteksto.
