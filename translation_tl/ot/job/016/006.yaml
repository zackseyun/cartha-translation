lexical_decisions:
- source_word: אִם אֲדַבְּרָה
  choice: Kung magsasalita ako
  rationale: Ipinapahayag ang kondisyon sa natural na modernong Tagalog habang pinananatili ang unang panauhan at ang diwa ng pagsasalita.
- source_word: לֹא יֵחָשֵׂךְ כְּאֵבִי
  choice: hindi maiibsan ang sakit ko
  rationale: Ang Niphal ng חשׂך ay may diwang mapigil o mabawasan. Sa kaugnayan nito sa sakit, ang “maiibsan” ay natural at malinaw nang hindi nililimitahan kung pisikal o emosyonal ang sakit.
- source_word: וְאַחְדְּלָה
  choice: at kung titigil ako
  rationale: Pinananatili ang maikli at bahagyang eliptikong anyo ng Hebreo. Ipinahihiwatig ng naunang sugnay na ang pagtigil ay pagtigil sa pagsasalita, ngunit hindi ito tahasang idinaragdag.
- source_word: מַה מִנִּי יַהֲלֹךְ
  choice: ano ang mawawala sa akin?
  rationale: Pinananatili ang maigsi at retorikal na tanong. Hindi tahasang tinutukoy ng Hebreo kung ang nawawala ay ang sakit o bahagi nito.
