  yaml_path: translation/ot/job/016/011.yaml
  text: God hands me over to the ungodly and throws me into the hands of the wicked[a][b].
translation:
  language: tl
  text: Ibinibigay ako ng Diyos sa isang taong di-makadiyos[a], at inihahagis niya ako sa mga kamay ng masasama[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa taong lapastangan sa Diyos” o “sa taong walang Diyos.”
    reason: lexical_alternative
  - marker: b
    text: Mahirap tiyakin ang kahulugan ng huling pandiwa; malamang na nangangahulugan itong “inihahagis” o “ibinabagsak” ako sa kapangyarihan ng masasama.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַסְגִּירֵנִי
  choice: Ibinibigay ako
  rationale: Ang Hiphil ng סגר ay tumutukoy sa pagsasalin ng isang tao sa kapangyarihan ng iba. Likas sa Filipino ang “ibinibigay ako” sa ganitong masamang pagsuko, habang pinananatili ang diwa ng paghahatid sa kapangyarihan ng kalaban.
- source_word: אֵל
  choice: Diyos
  rationale: Dito, ang אֵל ay katawagan sa Diyos at siyang simuno ng reklamo ni Job.
- source_word: אֶל עֲוִיל
  choice: sa taong walang Diyos
  rationale: Ang עֲוִיל ay isang taong baluktot sa moral at lapastangan sa Diyos, hindi lamang mangmang. Ang isahang “taong” ay sumusunod sa bilang ng Hebreo.
- source_word: וְעַל יְדֵי
  choice: sa mga kamay ng
  rationale: Pinananatili nito ang konkretong idyoma ng Hebreo na nagpapahiwatig ng pagkalagay sa kapangyarihan ng iba.
- source_word: רְשָׁעִים
  choice: masasama
  rationale: Karaniwan at malinaw na salin ito para sa maramihang רְשָׁעִים, na tumutukoy sa mga taong kilala sa kasamaan.
- source_word: יִרְטֵנִי
  choice: inihahagis niya ako
  rationale: Mahirap tiyakin ang bihirang pandiwa. Ang “inihahagis” ay kumakatawan sa malamang na marahas na pagkilos nang hindi dinaragdagan ng tiyak na direksiyon gaya ng “pababa.”
theological_decisions:
- issue: Tinutukoy ng אֵל
  choice: Ang Diyos ang nagbibigay kay Job sa taong walang Diyos.
  alternative: Isang pangkalahatang “makapangyarihan” ang nagbibigay sa kanya.
  rationale: Sa konteksto ng Job, ang אֵל ay karaniwang tumutukoy sa Diyos; mahalaga sa reklamo ni Job na Diyos mismo ang itinuturing niyang gumawa nito.
- issue: Antas ng katiyakan sa יִרְטֵנִי
  choice: Inihahagis niya ako.
  alternative: Ipinauubaya niya ako / ibinabagsak niya ako.
  rationale: Pinananatili sa talababa ang tunay na leksikal na kahirapan sa halip na magkunwaring tiyak ang kahulugan.
translation_notes:
  register: Makabago at marangal na Filipino, na may payak na sintaks. Pinanatili ang larawan ng “mga kamay” at ang marahas ngunit hindi ganap na tiyak na kahulugan ng huling pandiwa.
