  text: Even now[a], behold, my witness is in heaven[b], and he who testifies for me is in the heights.
translation:
  language: tl
  text: Kahit ngayon, narito—nasa langit ang aking saksi, at nasa kaitaasan ang aking saksi.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang nagpapatotoo para sa akin.” Ang ikalawang salita ay malapit na kasingkahulugan ng “saksi”; ang “aking saksi” ay higit na pinananatili ang paralelismo ng Hebreo.
    reason: lexical_alternative
  - marker: b
    text: O “sa matataas na dako.”
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם עַתָּה
  choice: Kahit ngayon
  rationale: 'Ipinahahayag ng pariralang ito ang mariing pagtukoy sa kasalukuyan: sa kabila ng kalagayan ni Job, may saksi siya ngayon din. Mas likas ito sa modernong Tagalog kaysa sa literal na “gayundin ngayon.”'
- source_word: הִנֵּה
  choice: narito—
  rationale: Pinananatili ang biglaang pagtawag-pansin ng Hebreong pantukoy, habang ang gitling ay nagpapakita ng mariing paghinto bago ang pahayag.
- source_word: בַשָּׁמַיִם
  choice: nasa langit
  rationale: Ang tinutukoy rito ay ang makalangit na dako, hindi lamang ang pisikal na himpapawid.
- source_word: עֵדִי
  choice: aking saksi
  rationale: Tuwirang pinananatili ang legal na larawang ipinahihiwatig ng עֵד at ang unang-panauhang hulapi.
- source_word: וְשָׂהֲדִי
  choice: ang nagpapatotoo para sa akin
  rationale: Ang Aramaikong anyo ay malapit na kasingkahulugan ng “saksi.” Inilalarawan ng salin ang tungkulin nito nang hindi ipinapalagay na isa itong abogado o tagapamagitan.
- source_word: בַּמְּרוֹמִים
  choice: nasa kaitaasan
  rationale: Pinananatili ang patulang paralelismo sa “nasa langit” at ang larawan ng matayog na dako.
theological_decisions:
- issue: Pagkakakilanlan ng makalangit na saksi ni Job
  choice: Tinukoy lamang siya ayon sa tungkulin bilang “aking saksi” at “ang nagpapatotoo para sa akin.”
  alternative: Tahasang kilalanin siya bilang Diyos, isang anghel o makalangit na tagapamagitan, o pagsasatao ng patotoo ni Job.
  rationale: Hindi tahasang kinikilala ng Hebreo kung sino ang saksi. Pinananatili ng salin ang legal na larawan at ang sadyang kalabuan ng teksto.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “narito” sa halip na mas kolokyal na “tingnan,” at iniwasan ang panghalip na may tiyak na kasarian upang hindi magdagdag ng pagkakakilanlang hindi malinaw sa pinagmulan.
