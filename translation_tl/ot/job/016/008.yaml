  text: You have shriveled me up—it has become a witness; my gauntness rises up against me and answers to my face.
translation:
  language: tl
  text: Pinayayat mo ako—naging saksi ito; ang kapayatan ko ay tumitindig laban sa akin at sumasagot sa harap ko.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתִּקְמְטֵנִי
  choice: Pinangayayat mo ako
  rationale: Inilalarawan ng pandiwa ang pag-urong o pangungulubot ng katawan; sa konteksto ng paghihirap ni Job, natural na ipinahahayag ito bilang matinding pagpayat nang hindi inaalis ang pisikal na larawan.
- source_word: לְעֵד הָיָה
  choice: naging saksi ito
  rationale: Pinananatili ang personipikasyon at ang di-tiyak na tinutukoy ng panlalaking isahan na pandiwa; ang “ito” ay maaaring tumukoy sa kalagayang inilarawan sa naunang sugnay.
- source_word: כַחֲשִׁי
  choice: ang kapayatan ko
  rationale: Sa konteksto, tumutukoy ang pangngalan sa pangangayayat o pagkaubos ng laman ng katawan, na nagsisilbing nakikitang ebidensiya laban kay Job.
- source_word: יַעֲנֶה
  choice: sumasagot
  rationale: Ito ang karaniwang diwa ng ugat ענה sa anyong ito at pinananatili ang larawang parang nagsasalita ang kapayatan ni Job sa harap niya.
theological_decisions:
- issue: Ang paghihirap bilang saksing laban kay Job
  choice: Pinanatili ang wikang panghukuman at personipikasyon nang hindi sinasabing tunay na pinatutunayan nito ang pagkakasala ni Job.
  alternative: Isaling “nagpapatotoo na nagkasala ako,” na tahasang magpapasya sa kahulugan ng saksi.
  rationale: Ang talata ay naglalarawan sa anyo ni Job bilang saksing tumitindig laban sa kanya, ngunit hindi nito tuwirang sinasang-ayunan ang teolohikal na palagay na patunay ng kasalanan ang kanyang paghihirap.
translation_notes:
  register: Makabago at marangal na Filipino. Ginamit ang “pinangayayat” at “kapayatan” upang maging malinaw sa karaniwang mambabasa, habang pinananatili ang matinding personipikasyon at tonong panghukuman ng Hebreo.
