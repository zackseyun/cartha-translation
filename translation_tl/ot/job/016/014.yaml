  yaml_path: translation/ot/job/016/014.yaml
  text: He breaks through me with breach upon breach[b][a]; he rushes at me like a warrior.
translation:
  language: tl
  text: Binabasag niya ako nang sunod-sunod; sumusugod siya sa akin na parang mandirigma.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal na Hebreo, “siwang sa ibabaw ng siwang,” isang larawan ng magkakasunod o nagkakapatong na pagbasag.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִפְרְצֵנִי
  choice: Winawasak niya ako
  rationale: Ang pandiwang mula sa פרץ ay naglalarawan ng marahas na pagbasag o paglikha ng puwang. Ang “winawasak niya ako” ay natural sa Filipino at nagpapanatili sa puwersa ng larawan.
- source_word: פֶרֶץ עַל־פְּנֵי פָרֶץ
  choice: sunod-sunod na pagwasak
  rationale: Ipinahahayag ng parirala ang magkakasunod o nagkakapatong na pagwasak. Pinananatili ng salin ang pag-uulit ng ugat sa “winawasak” at “pagwasak” habang malinaw sa makabagong Filipino.
- source_word: יָרוּץ עָלַי
  choice: sumusugod siya sa akin
  rationale: Bagaman literal na “tumatakbo siya laban sa akin,” ang konteksto ay marahas na paglapit upang umatake; malinaw at matindi ang “sumusugod.”
- source_word: כְגִבּוֹר
  choice: na parang mandirigma
  rationale: Ang גִּבּוֹר ay maaaring tumukoy sa isang makapangyarihang lalaki, bayani, o mandirigma. Dahil inilalarawan dito ang pagsugod sa pakikipaglaban, “mandirigma” ang pinakaangkop na katumbas.
theological_decisions:
- issue: Ang di-tahasang simuno ng mga pandiwa
  choice: Pinanatili bilang “niya/siya,” ayon sa agarang Hebreong talata.
  alternative: Tukuyin nang tahasan ang Diyos bilang simuno.
  rationale: Hindi tahasang inuulit sa talatang ito ang pangalan ng simuno. Ang panghalip ay nagpapanatili sa anyo ng Hebreo at umiiwas sa pagdaragdag sa mismong talata, bagaman malinaw sa konteksto na Diyos ang tinutukoy ni Job.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Pinanatili ang marahas at patulang pag-uulit ng Hebreo, habang ginawang natural ang kilos ng mabilis na pag-atake sa “sumusugod.”
