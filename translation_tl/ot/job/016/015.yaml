  text: I have sewn sackcloth over my skin[b][a], and thrust my horn into the dust.
translation:
  language: tl
  text: "Tinahi ko sa ibabaw ng aking balat ang magaspang na telang sako,\n at ibinaba ko[a] sa alabok ang aking sungay.[b]"
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ibinagsak ko” o “nilapastangan ko.” Mahirap tiyakin ang eksaktong diwa ng pandiwang Hebreo rito.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, ang “sungay” ay talinghaga para sa lakas, karangalan, o mataas na kalagayan.
    reason: cultural_note
lexical_decisions:
- source_word: שַׂק
  choice: telang-sako
  rationale: Tumutukoy ito sa magaspang na telang isinusuot bilang tanda ng pagluluksa. Ang “telang-sako” ay malinaw at likas sa makabagong Filipino.
- source_word: תָּפַרְתִּי
  choice: Tinahi ko
  rationale: Ang Qal perfect na unang panauhan ay nagsasaad ng natapos na pagtahi na may nagpapatuloy na kalagayan sa konteksto.
- source_word: עֲלֵי גִלְדִּי
  choice: sa ibabaw ng aking balat
  rationale: Pinananatili nito ang konkretong larawan ng telang nakatakip sa balat; hindi pinalalawak ang גֶּלֶד bilang buong katawan.
- source_word: וְעֹלַלְתִּי
  choice: at ibinaon ko
  rationale: Mahirap tiyakin ang eksaktong diwa ng pandiwa. Ang “ibinaon” ay nagbibigay ng konkretong kilos ng pagpapababa tungo sa alabok nang hindi ganap na nilulutas ang talinghaga.
- source_word: בֶעָפָר
  choice: sa alabok
  rationale: Ang “sa alabok” ay natural na katambal ng “ibinaon” at nagpapahayag ng kahihiyan at pagpapakababa.
- source_word: קַרְנִי
  choice: aking sungay
  rationale: Pinananatili ang literal at makatang larawang Hebreo. Ang sungay ay maaaring sumagisag sa lakas, karangalan, o mataas na kalagayan.
theological_decisions:
- issue: Talinghaga ng “sungay”
  choice: Pinanatili bilang “aking sungay” sa pangunahing teksto
  alternative: aking lakas; aking karangalan
  rationale: Mahalaga sa panulaan ng talata ang konkretong larawan ng sungay. Ipinaliliwanag sa talababa ang maaaring simbolikong diwa sa halip na pumili ng iisang interpretasyon.
- issue: Hindi tiyak na diwa ng וְעֹלַלְתִּי
  choice: Isinalin bilang konkretong kilos na “ibinaon ko”
  alternative: ibinagsak ko; nilapastangan ko; inilugmok ko
  rationale: Ang pandiwa ay may pinagtatalunang kahulugan. Ang napiling salin ay angkop sa kasunod na “sa alabok,” habang tahasang pinananatili sa talababa ang leksikal na kawalang-katiyakan.
translation_notes:
  register: Makabago ngunit marangal na Filipino; pinanatili ang maigsi at matinding himig ng panaghoy. Ginamit ang “telang-sako” upang maging malinaw sa karaniwang mambabasa at pinanatili ang “sungay” bilang makatang larawang Hebreo.
