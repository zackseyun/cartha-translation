base_translation:
  language: en
  yaml_path: translation/ot/job/016/018.yaml
  text: O earth[a], do not cover my blood[c][b], and let there be no resting place for my cry.
translation:
  language: tl
  text: O lupa, huwag mong takpan ang aking dugo[a][b], at huwag magkaroon ng lugar ang aking daing.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “dugong dumanak dahil sa akin.” Literal na “aking dugo” ang Hebreo, ngunit sa konteksto maaari itong tumukoy sa dugong ibinuhos nang di-makatarungan.
    reason: lexical_alternative
  - marker: b
    text: Ipinapaalaala ng larawang ito ang dugong sumisigaw mula sa lupa para sa katarungan; ihambing ang Genesis 4:10.
    reason: cross_reference
  - marker: c
    text: O “sigaw ko.” Ang salitang Hebreo ay maaaring tumukoy sa sigaw ng matinding paghihirap na isa ring panawagan para sa tulong o katarungan.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶרֶץ
  choice: O lupa
  rationale: Ang lupa ay tuwirang kinakausap, gaya ng ipinahihiwatig ng pambabaeng isahang anyo ng kasunod na pandiwa. Pinananatili ng “O lupa” ang marangal at makatang pagtawag.
- source_word: תְּכַסִּי
  choice: huwag mong takpan
  rationale: Karaniwang nangangahulugang “takpan” ang כסה. Pinananatili nito ang kongkretong larawan ng dugong hindi dapat matabunan o maitago.
- source_word: דָמִי
  choice: aking dugo
  rationale: Literal na “aking dugo” ang anyong Hebreo. Bagaman maaari itong tumukoy sa dugong ibinuhos nang di-makatarungan, hindi ginawang tahasan sa pangunahing teksto ang interpretasyong iyon.
- source_word: מָקוֹם
  choice: pahingahan
  rationale: Pangunahing nangangahulugang “lugar” ang מָקוֹם, ngunit sa konteksto, ang hinihiling ay huwag magkaroon ng lugar ang daing upang humimpil o matahimik. Likas sa Filipino ang “pahingahan” at pinananatili nito ang makatang larawan.
- source_word: לְזַעֲקָתִי
  choice: aking daing
  rationale: Ang זעקה ay sigaw ng matinding paghihirap na maaari ring magsilbing panawagan para sa tulong o katarungan. Likas at marangal ang “daing,” habang nananatiling bukas ang dalawang diwang ito.
theological_decisions:
- issue: Pahiwatig sa dugong walang-salang ibinuhos na humihingi ng katarungan
  choice: Pinanatili ang kongkretong “aking dugo” at ang makatang “aking daing” nang hindi tahasang ipinapaliwanag ang pahiwatig sa pangunahing teksto.
  alternative: Isalin bilang “dugo kong ibinuhos” o “sigaw ko para sa katarungan.”
  rationale: Malamang na kaugnay ito ng biblikal na larawan ng dugong sumisigaw mula sa lupa, ngunit pinananatili ng Hebreo ang tensiyon sa pagitan ng literal na dugo, matinding daing, at panawagan para sa katarungan.
translation_notes:
  register: Makata, marangal, at madaling maunawaan sa modernong Filipino. Ginamit ang “O lupa” bilang tuwirang pagtawag at ang “pahingahan” upang maipahiwatig na hindi dapat humimpil o mapatahimik ang daing.
