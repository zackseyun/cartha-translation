base_translation:
  language: en
  yaml_path: translation/ot/job/016/012.yaml
  text: I was at ease[a], but he shattered me; he seized me by my neck and dashed me to pieces; he set me up for himself as a target.
translation:
  language: tl
  text: Panatag ako, ngunit niluray niya ako[a]; sinunggaban niya ako sa batok at dinurog niya ako; itinayo niya ako bilang sarili niyang puntirya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bihira at hindi tiyak ang pandiwang isinaling “niluray”; maaari rin itong unawain na “niyugyog nang marahas” o “pinunit-punit.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלֵו
  choice: Payapa ang buhay ko noon
  rationale: Ipinahahayag nito ang dating kalagayan ni Job na tahimik at walang kaguluhan; natural sa modernong Filipino ang pariralang ito at malinaw ang kaibahan sa biglang karahasang sumunod.
- source_word: וַיְפַרְפְּרֵנִי
  choice: niluray niya ako
  rationale: Bihira at hindi tiyak ang pandiwa, ngunit malinaw na tumutukoy sa marahas na pagwasak o pagyanig. Ang “niluray” ay masidhi at pinananatili ang pagkakaiba nito sa kasunod na pandiwa; inilalahad sa talababa ang iba pang posibilidad.
- source_word: וְאָחַז
  choice: sinunggaban niya ako
  rationale: Ang pandiwa ay nangangahulugang mahigpit na paghawak o pagsunggab; ipinadarama ng “sinunggaban” ang puwersa at poot ng kilos.
- source_word: בְּעָרְפִּי
  choice: sa batok
  rationale: Ang עֹרֶף ay batok o likod ng leeg. Ang “sa batok” ay tiyak, maikli, at natural sa Filipino.
- source_word: וַיְפַצְפְּצֵנִי
  choice: dinurog
  rationale: Ang masidhing pandiwa ay naglalarawan ng marahas na pagdurog o pagbasag. Ang “dinurog” ay malinaw at mabigat, nang hindi inuulit ang salitang ginamit sa naunang bihirang pandiwa.
- source_word: וַיְקִימֵנִי
  choice: itinayo niya ako
  rationale: 'Causative ang anyo ng קום: pinatayo o inilagay si Job sa isang posisyon. Pinananatili ng “itinayo” ang kongkretong larawan bago banggitin ang puntirya.'
- source_word: לוֹ
  choice: niya
  rationale: Ipinakikita ng panghalip na ang puntirya ay para sa sariling paggamit ng umaatake; natural itong naipahahayag sa “puntirya niya.”
- source_word: לְמַטָּרָה
  choice: bilang puntirya
  rationale: Ang מַטָּרָה ay puntirya o target ng pag-atake. Ang “bilang puntirya” ay malinaw at pinananatili ang larawang militar.
theological_decisions:
- issue: Ang tinutukoy ng panlalaking ikatlong panauhan sa buong talata
  choice: Ginamit lamang ang “niya” at hindi tahasang pinangalanan ang gumagawa.
  alternative: Tukuyin siya bilang Diyos o bilang isang hindi tinukoy na kaaway.
  rationale: Sa mas malawak na pananalita ni Job, ipinahihiwatig na Diyos ang tinutukoy, ngunit sa talatang Hebreo mismo ay mga anyong pandiwa at panghalip lamang ang ginamit. Pinananatili ng salin ang di-tahasang pagtukoy at ang teolohikal na tensiyon.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “batok” para sa tiyak at natural na larawan, at “puntirya” bilang karaniwang salitang Filipino para sa target. Napanatili ang sunod-sunod na mararahas na kilos at ang di-tahasang pagkakakilanlan ng umaatake.
