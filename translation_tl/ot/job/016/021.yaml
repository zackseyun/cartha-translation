  text: that he would arbitrate for a man with God[c][b][a], as a son of man does for his neighbor.
translation:
  language: tl
  text: 'Makipangatwiran[a] sana siya sa Diyos para sa isang tao, gaya ng pakikipangatwiran ng isang tao[b] para sa kanyang kapwa.[c]


    [a] Maaari ring “ipaglaban niya ang usapin” o “humatol siya”; ang pandiwang Hebreo ay maaaring tumukoy sa paghatol, pamamagitan, o pangangatwiran sa isang usapin.

    [b] Sa Hebreo, “anak ng tao,” isang karaniwang katawagan dito para sa isang tao, at hindi kinakailangang isang mesiyanikong titulo.

    [c] Maaari ring “kaibigan.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ipaglaban niya ang usapin” o “humatol siya”; ang pandiwang Hebreo ay maaaring tumukoy sa paghatol, pamamagitan, o pangangatwiran sa isang usapin.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “anak ng tao,” isang karaniwang katawagan dito para sa isang tao, at hindi kinakailangang isang mesiyanikong titulo.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “kaibigan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיוֹכַח
  choice: Makipangatwiran sana siya
  rationale: Ang Hiphil ng יכח ay maaaring mangahulugang magpasya, magpatunay, sumaway, o mangatwiran sa isang usaping legal. Ang “makipangatwiran” ay natural sa Filipino at pinananatili ang larawang legal nang hindi ipinapalagay na neutral na tagapamagitan lamang ang tinutukoy.
- source_word: לְגֶבֶר
  choice: para sa isang tao
  rationale: Bagaman ang גבר ay maaaring tumukoy sa isang lalaki, ginagamit ito rito bilang tao na ang usapin ay ipinakikipagtalo. Ipinakikita ng “para sa” ang benefaktibong gamit ng לְ.
- source_word: עִם אֱלוֹהַּ
  choice: sa Diyos
  rationale: Ang עִם ay literal na “kasama/kasama ng,” ngunit sa pangangatwirang legal, natural sa Filipino ang “makipangatwiran sa Diyos.” Hindi ito ginawang “laban sa Diyos” upang hindi higitan ang ipinahihiwatig ng teksto.
- source_word: וּבֶן אָדָם
  choice: gaya ng pakikipangatwiran ng isang tao
  rationale: Ang בֶּן־אָדָם ay literal na “anak ng tao” ngunit karaniwang idyoma para sa isang taong mortal. Isinalin itong “isang tao” sa pangunahing teksto upang maging natural at maiwasan ang di-sinasadyang pagtrato rito bilang natatanging titulo; pinanatili ang literal na anyo sa talababa.
- source_word: לְרֵעֵהוּ
  choice: para sa kanyang kapwa
  rationale: Ang רֵעַ ay maaaring mangahulugang kapwa, kaibigan, o kasama. Ang “kapwa” ay malawak at angkop sa paghahambing, samantalang ang “para sa” ay nagpapanatili sa parallel na benefaktibong לְ.
theological_decisions:
- issue: Posibleng mesiyanikong pagbasa sa בֶּן־אָדָם
  choice: Isalin ayon sa karaniwang kahulugan nitong “isang tao,” at ilagay sa talababa ang literal na “anak ng tao.”
  alternative: Panatilihin sa pangunahing teksto ang “anak ng tao” o gawin itong titulong “Anak ng Tao.”
  rationale: Sa konteksto, kaagapay ito ng גבר at tumutukoy sa isang karaniwang tao. Ang paggamit ng malaking titik o tahasang mesiyanikong pagbasa ay magpapasok ng kahulugang hindi hinihingi ng talata.
- issue: Papel ng hinihiling na tagapagsalita
  choice: 'Panatilihin ang benefaktibong diwa: nakikipangatwiran siya sa Diyos para sa tao.'
  alternative: Ilarawan siya bilang neutral na tagapamagitan sa pagitan ng tao at Diyos.
  rationale: Ang לְגֶבֶר ay natural na nagpapahiwatig ng pagkilos para sa tao. Ang neutral na “sa pagitan” ay maaaring magpahina sa diwang iyon, kaya hindi tahasang nilutas ang papel bilang pormal na arbitrator.
translation_notes:
  register: Makabagong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “makipangatwiran” upang mapanatili ang legal na himig nang hindi maging teknikal; ang ikalawang sugnay ay bahagyang pinalawak upang maging malinaw ang elipsis ng tulang Hebreo.
