  yaml_path: translation/ot/job/016/007.yaml
  text: Surely now he has worn me out[b][a]; you have devastated all my company.
translation:
  language: tl
  text: Tunay nga, ngayo’y pinagod niya ako[a]; winasak mo ang buong pangkat ko[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “inubos niya ako sa pagod” o “pinanghina niya ako.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “buong kapulungan ko.” Maaaring tumukoy ang Hebreo sa pangkat ng mga taong nakapaligid kay Job; sa konteksto, posible rin ang “sambahayan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Ngunit
  rationale: Sa konteksto, minamarkahan nito ang mariing pagliko mula sa naunang sinabi ni Job tungo sa kasalukuyan niyang paghihirap. Mas natural dito ang “Ngunit” kaysa “Tunay nga,” habang nananatili ang diin.
- source_word: עַתָּה
  choice: ngayon
  rationale: Tuwirang ipinahahayag ang kasalukuyang kalagayan ni Job at pinananatili ang agarang himig ng panaghoy.
- source_word: הֶלְאָנִי
  choice: lubos niya akong pinanghina
  rationale: Ang pandiwang mula sa לאה ay nangangahulugang magpahina dahil sa pagod o lubusang manghina. Pinananatili ng “niya” ang di-tahasang ikatlong panauhang panlalaking simuno nang hindi ito tahasang kinikilalang Diyos.
- source_word: הֲשִׁמּוֹתָ
  choice: winasak mo
  rationale: Ang causative na diwa ng שמם ay gawing wasak o tiwangwang. Malakas at natural sa Filipino ang “winasak,” at pinananatili nito ang ikalawang panauhang isahan.
- source_word: כָּל
  choice: buo
  rationale: Likas na Filipino ang “ang buo kong” bilang panlahat na panuring sa kasunod na pangngalan.
- source_word: עֲדָתִי
  choice: sambahayan
  rationale: Bagaman karaniwang tumutukoy ang עֵדָה sa kapulungan o pangkat, sa panaghoy ni Job maaari itong tumukoy sa buong bilog ng mga taong nakaugnay sa kanya, lalo na sa kanyang sambahayan. Inilalagay sa talababa ang ibang tunay na posibilidad.
theological_decisions:
- issue: Paglipat ng panauhan sa pagitan ng dalawang pandiwa
  choice: 'Panatilihin ang ikatlong panauhan at pagkatapos ay ikalawang panauhan: “niya akong pinanghina; winasak mo...”'
  alternative: 'Pag-isahin ang dalawang pandiwa bilang tuwirang pakikipag-usap sa Diyos: “pinanghina mo ako; winasak mo...”'
  rationale: May tunay na paglipat ang tekstong Masoretiko mula 3ms tungo sa 2ms. Hindi ito pinapakinis upang manatiling bukas kung retorikal na lumilipat si Job mula sa pagsasalita tungkol sa Diyos tungo sa tuwirang pakikipag-usap sa kanya.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “sambahayan” upang maging natural sa konteksto ng pagkawala ni Job, ngunit pinanatili sa talababa ang mas literal na “pangkat/kapulungan.”
