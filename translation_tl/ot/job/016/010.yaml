  text: They have opened their mouths wide against me[a]; with reproach they have struck my cheek; together they gather themselves against me.
translation:
  language: tl
  text: Ibinuka nila nang maluwang ang kanilang mga bibig laban sa akin; hinampas nila nang may paghamak ang aking pisngi; sama-sama silang nagtipon laban sa akin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “sama-sama silang nagbuo ng puwersa laban sa akin” o “napuno sila laban sa akin.” Mahirap at idyomatiko ang huling pandiwa sa Hebreo; ipinahihiwatig nito ang magkakasabay na pagtipon ng mga kalaban.
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּעֲרוּ
  choice: Ibinuka ... nang maluwang
  rationale: Pinananatili ang matingkad na larawan ng pagbuka ng bibig nang malaki bilang pagkutya o pagkapoot.
- source_word: עָלַי
  choice: laban sa akin
  rationale: Sa konteksto ng pag-atake, malinaw na ipinahahayag nito ang salungat at mapanlabang diwa ng pang-ukol.
- source_word: בְּפִיהֶם
  choice: ang kanilang bibig
  rationale: Pinananatili ang kolektibong isahan ng Hebreo; natural pa rin ito sa Tagalog para sa pangkat na sabay-sabay na nanlalait.
- source_word: בְּחֶרְפָּה
  choice: nang may paghamak
  rationale: Saklaw ng חֶרְפָּה ang paghamak, insulto, at kahihiyan; likas at marangal sa modernong Tagalog ang pariralang ito.
- source_word: הִכּוּ
  choice: hinampas
  rationale: Tuwirang inilalarawan ang pisikal na pananakit at mas natural dito kaysa sa pangkalahatang 'sinaktan.'
- source_word: לְחָיָי
  choice: ang aking pisngi
  rationale: Ang לְחִי ay pisngi o panga; ang 'pisngi' ang pinakamalinaw na tumutugma sa larawang nagpapahiya sa biktima.
- source_word: יַחַד
  choice: sama-sama
  rationale: Ipinahahayag ang magkakasabay at nagkakaisang pagkilos ng mga kalaban.
- source_word: יִתְמַלָּאוּן
  choice: nagtipon
  rationale: Mahirap at idyomatiko ang anyo ng מלא rito. Sa konteksto, malamang na tumutukoy ito sa sama-samang pagbuo o pagtipon ng puwersang laban kay Job, nang hindi ipinapasok ang literal ngunit malabong 'napuno.'
