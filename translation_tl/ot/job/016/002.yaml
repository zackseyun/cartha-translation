translation:
  language: tl
  text: Marami na akong narinig na ganito; kayong lahat ay mga tagapag-aliw na puno ng pasakit.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “mga tagapag-aliw ng pasakit” o “mga tagapag-aliw ng paghihirap”; maaari ring unawain bilang “mga nakapapagod na tagapag-aliw.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמַעְתִּי
  choice: narinig na akong
  rationale: Ang Qal perfect na unang panauhang isahan ay tumutukoy sa naipong karanasan ni Job sa pakikinig; ang “na akong narinig” ay natural sa Filipino at ipinakikitang may kaugnayan pa ito sa kasalukuyan.
- source_word: כְאֵלֶּה רַבּוֹת
  choice: Marami ... na ganitong mga salita
  rationale: Pinagsama ang diwa ng “marami” at “tulad ng mga ito.” Idinagdag ang “mga salita” bilang likas na ipinahihiwatig na bagay sa konteksto ng mga talumpati ng mga kaibigan.
- source_word: מְנַחֲמֵי
  choice: mga tagapag-aliw
  rationale: 'Ang participle ay ginamit bilang pangngalan, “mga umaaliw/tagapag-aliw.” Pinananatili ng salita ang kabalintunaan: dumating sila upang umaliw ngunit kabaligtaran ang epekto.'
- source_word: עָמָל
  choice: puro paghihirap ang dulot
  rationale: Ang עָמָל ay maaaring mangahulugang paghihirap, ligalig, pagod, o dalamhati. Sa construct phrase, natural na Filipino ang paglalarawang ang kanilang pag-aliw ay nagdudulot lamang ng paghihirap, nang hindi lubusang ikinukulong ang maluwag na ugnayang Hebreo.
- source_word: כֻּלְּכֶם
  choice: kayong lahat
  rationale: Malinaw na pinananatili ang maramihan at ang sama-samang tuwirang pagtukoy ni Job sa kaniyang mga kaibigan.
