translation_notes:
  register: Makabago, tuwiran, at marangal na Filipino. Ginamit ang “tagapag-aliw” upang mapanatili ang ironikong ugnayan sa layunin ng mga kaibigan, at inilagay sa talababa ang mas pormal ngunit malabong construct ng Hebreo.
