  yaml_path: translation/ot/job/016/022.yaml
  text: For a few years will come[b][a], and I will go on the path from which I will not return.
translation:
  language: tl
  text: Sapagkat ilang taon na lamang ang darating[a], at tatahakin ko ang landas na hindi ko na babalikan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “mga taon ng bilang,” ibig sabihin, mga taong kakaunti o may takdang bilang.
    reason: lexical_alternative
  - marker: b
    text: O, “at lalakad ako sa daang hindi ko na babalikan.” Tumutukoy ang pahayag sa di-na-mababalikang paglalakbay tungo sa kamatayan.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikita ang dahilan o batayan ng naunang sinabi ni Job at natural na pinananatili ang ugnayang sanhi.
- source_word: שְׁנוֹת מִסְפָּר
  choice: iilang taon
  rationale: Ang literal na “mga taon ng bilang” ay isang idyoma para sa mga taong kakaunti o may takdang bilang; malinaw at natural sa Filipino ang “iilang taon.”
- source_word: יֶאֱתָיוּ
  choice: darating
  rationale: Tuwirang ipinahahayag ng pandiwa ang pagdating ng nalalabing mga taon.
- source_word: וְאֹרַח
  choice: at ... ang landas
  rationale: Pinananatili ng “landas” ang konkretong talinghaga ng אֹרַח para sa paglalakbay tungo sa kamatayan.
- source_word: לֹא אָשׁוּב
  choice: na hindi ko na babalikan
  rationale: Pinananatili ang diwa ng hindi pagbabalik, habang ang “na” ay natural na nag-uugnay nito sa “landas”; ipinahihiwatig ng “na” ang kawalang-pagbalik mula sa sandaling tahakin iyon.
- source_word: אֶהֱלֹךְ
  choice: tatahakin ko
  rationale: Sa kaugnayan nito sa “landas,” natural na isinasalin ang simpleng “lalakad/pupunta ako” bilang “tatahakin ko,” nang hindi ginagawang hayag ang kamatayan na talinghaga lamang sa Hebreo.
theological_decisions:
- issue: Ang tinutukoy na hindi na maibabalik na paglalakbay
  choice: Pinanatili bilang talinghagang “landas” at hindi tuwirang tinawag na kamatayan sa pangunahing teksto.
  alternative: “at mamamatay ako at hindi na babalik”
  rationale: Ang konteksto ay tumutukoy sa paglalakbay tungo sa kamatayan, ngunit talinghaga at hindi tahasang katawagan ang ginamit ng tekstong Hebreo; hindi dapat alisin ang anyong patula o palawakin ang teolohiya nito.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “Sapagkat” para sa malinaw na ugnayan sa naunang talata at “landas/tatahakin” upang mapanatili ang patulang talinghaga nang hindi maging lipas o labis na literal.
