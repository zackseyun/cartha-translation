translation:
  language: tl
  text: Ang mga kaibigan ko ang mga nanunuya sa akin[a]; sa Diyos dumadaloy ang luha mula sa aking mata.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga tagapamagitan/tagapagsalita para sa akin.” May mga umuunawa sa salitang Hebreo na מְלִיצַי sa positibong diwa, ngunit sa kontekstong ito mas angkop sa reklamo ni Job ang “mga nanunuya sa akin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מְלִיצַי
  choice: mga nanunuya sa akin
  rationale: Maaaring tumukoy ang salita sa mga manunuya o nanlilibak. Sa konteksto ng daing ni Job laban sa kaniyang mga kaibigan, malinaw at natural sa makabagong Filipino ang “mga nanunuya sa akin,” habang inilalagay sa talababa ang ibang posibleng pakahulugan.
- source_word: רֵעָי
  choice: mga kaibigan ko
  rationale: Karaniwang nangangahulugang kaibigan o kasama ang רֵעַ. Pinananatili ng “mga kaibigan ko” ang kabalintunaan na ang inaasahang kakampi ni Job ang siya ngayong nanunuya sa kaniya.
- source_word: אֶל אֱלוֹהַ
  choice: sa Diyos
  rationale: Ipinahihiwatig ng אֶל ang direksiyon patungo sa Diyos. Sa ayos na “sa Diyos tumutulo,” natural na naipahahayag na ang pagluha ni Job ay nakatuon sa Diyos.
- source_word: דָּלְפָה
  choice: tumutulo ang luha
  rationale: Ang pandiwa ay literal na tumutukoy sa pagtulo o pag-agos nang patak-patak. Ang pagdaragdag ng “luha” ay ginagawang malinaw at natural sa Filipino ang larawang ang mata ni Job ay patuloy na lumuluha.
- source_word: עֵינִי
  choice: aking mata
  rationale: Isahan ang Hebreo, kaya pinanatili ang “aking mata” upang maingatan ang matingkad na larawang patula ng orihinal.
theological_decisions:
- issue: Kung negatibo o positibo ang kahulugan ng מְלִיצַי
  choice: mga nanunuya sa akin
  alternative: mga tagapamagitan/tagapagsalita para sa akin
  rationale: Mas angkop sa agarang konteksto ng reklamo ni Job ang negatibong kahulugan, ngunit tunay na umiiral ang positibong pagbasa kaya hindi ito ipinagwalang-bahala at inilagay sa talababa.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang patulang isahang “aking mata” at ang larawan ng luhang tumutulo, habang ginawang lantad ang bagay na tumutulo upang maging natural sa Tagalog.
