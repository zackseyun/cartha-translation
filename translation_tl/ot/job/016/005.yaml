  text: I could strengthen you with my mouth[b][a], and the moving of my lips could hold back grief.
translation:
  language: tl
  text: Palalakasin ko sana kayo sa pamamagitan ng mga salita ng aking bibig, at ang pagkilos[a] ng aking mga labi ay makapagpapahupa sana ng inyong dalamhati.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pagdamay” o “pang-aaliw.” Ang salitang Hebreo ay maaaring tumukoy sa isang pagkilos o pagtango na nagpapahayag ng pakikiramay, hindi lamang sa pisikal na paggalaw.
    reason: lexical_alternative
  - marker: b
    text: Mas literal, “at ang pagkilos ng aking mga labi ay makapipigil.” Walang tahasang layon ang pandiwa sa Hebreo; ang “inyong dalamhati” ay hango sa konteksto ng pag-aliw.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲאַמִּצְכֶם
  choice: Mapalalakas ko kayo
  rationale: Ang Piel ng אמץ na may layong panghalip na pangmaramihan ay nangangahulugang ‘palakasin.’ Ipinahihiwatig ng anyong ‘mapalalakas ko’ ang haka-hakang sitwasyon mula sa naunang talata nang hindi ito ginagawang tahasang pangako.
- source_word: בְּמוֹ פִי
  choice: sa mga salita ng aking bibig
  rationale: Ginagamit ang bibig bilang kasangkapan ng pagsasalita. Idinagdag ang ‘mga salita’ upang maging likas sa makabagong Tagalog habang pinananatili ang kongkretong larawan ng ‘bibig’ at ang pagkakatugma nito sa ‘mga labi.’
- source_word: נִיד
  choice: pagkilos
  rationale: Maaaring tumukoy ang נִיד sa pagkilos o pagtango na nagpapahayag ng pakikiramay. Pinananatili ng ‘pagkilos’ ang pisikal na larawan at ang tunay na kalabuan ng salita; inilalagay sa talababa ang mas tiyak na diwang pang-aaliw o pakikiramay.
- source_word: שְׂפָתַי
  choice: aking mga labi
  rationale: Tuwirang pinananatili nito ang larawan at paralelismo ng Hebreo sa ‘aking bibig.’
- source_word: יַחְשֹׂךְ
  choice: makapagpapahupa
  rationale: Karaniwang nangangahulugan ang חשׂך na pigilan, ipagkait, o huwag hayaang magpatuloy. Sa konteksto ng pag-aliw, likas na ipinahahayag ng ‘makapagpapahupa’ ang epekto sa dalamhati, habang ipinaliliwanag sa talababa na mas literal ang ‘makapipigil’ at walang tahasang layon sa Hebreo.
