translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang imahen ng bibig at mga labi, ngunit ginawang likas ang unang parirala sa pamamagitan ng ‘mga salita ng aking bibig.’ Ang mga talababa ang nagpapanatili sa leksikal at sintaktikong kalabuan ng Hebreo.
