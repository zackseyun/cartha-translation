  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: יָ֘סֹ֤בּוּ עָלַ֨/י רַבָּ֗י/ו יְפַלַּ֣ח כִּ֭לְיוֹתַ/י וְ/לֹ֣א יַחְמ֑וֹל יִשְׁפֹּ֥ךְ לָ֝/אָ֗רֶץ מְרֵרָֽתִ/י׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/016/013.yaml
  text: His archers surround me[a]; he splits open my kidneys and does not spare[c][b]; he pours out my gall on the ground.
translation:
  language: tl
  text: Pinalilibutan ako ng kaniyang mga mamamana[a]; binibiyak niya ang aking mga bato[b] at hindi niya ako kinahahabagan; ibinubuhos niya sa lupa ang aking apdo[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kaniyang mga dakila” o “kaniyang mga pinuno.” Mahirap unawain ang anyong Hebreo; ang “mga mamamana” ay akma sa larawan ng paglusob sa talatang ito at sa mas malawak na konteksto.
    reason: alternative_reading
  - marker: b
    text: Sa Hebreo, “aking mga bato.” Literal itong tumutukoy sa mga bato (kidneys), hindi sa mga batong nasa lupa, at maaari ring kumatawan sa kaloob-looban ng isang tao sa idyomang Hebreo.
    reason: cultural_note
  - marker: c
    text: Maaaring unawain bilang “aking kapaitan.” Ngunit ang literal na kahulugang “apdo” ay mas akma sa marahas na larawan ng katawan sa talata.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָסֹבּוּ
  choice: pinalilibutan
  rationale: Ang Qal imperfect na maramihan ng סבב ay naglalarawan ng mga sumasalakay na pumapalibot kay Job. Likas sa makabagong Tagalog ang “pinalilibutan” at pinananatili nito ang larawang pandigma.
- source_word: רַבָּיו
  choice: kaniyang mga mamamana
  rationale: Mahirap ang anyong Hebreo at maaari itong iugnay sa “mga dakila” o “mga pinuno,” ngunit ang tradisyonal na pagbasa na “mga mamamana” ay akma sa mga larawan ng paglusob at pagwasak sa katawan sa talata at sa konteksto.
- source_word: יְפַלַּח
  choice: binibiyak
  rationale: Ang Piel ng פלח ay nagpapahiwatig dito ng marahas na paghiwa o paghati. Malinaw at matindi ang “binibiyak” sa kasalukuyang Tagalog.
- source_word: כִּלְיוֹתַי
  choice: aking mga bato
  rationale: Literal na tumutukoy ang salitang Hebreo sa mga kidney. Pinananatili ang kongkretong bahagi ng katawan sa halip na palitan ng interpretatibong “kaloob-looban.”
- source_word: לֹא יַחְמוֹל
  choice: hindi niya ako pinatatawad
  rationale: Ipinahahayag nito na hindi inililigtas o hindi pinangingilagan ng umaatake si Job. Ang “pinatatawad” dito ay nasa diwang hindi siya spared, hindi sa diwang pagpapatawad sa kasalanan.
- source_word: יִשְׁפֹּךְ
  choice: ibinubuhos niya
  rationale: Karaniwang kahulugan ng Qal ng שפך ang “ibuhos,” at pinananatili nito ang matingkad na pisikal na larawan.
- source_word: מְרֵרָתִי
  choice: aking apdo
  rationale: Maaaring tumukoy ang pangngalan sa apdo o bile at kaugnay rin ito ng kapaitan. Mas angkop sa marahas at anatomikal na larawan ng talata ang literal na “apdo.”
theological_decisions:
- issue: Anatomikal na larawan sa makatang paglalarawan ng pagdurusa
  choice: Pinanatili sa pangunahing teksto ang kongkretong mga katawagang “mga bato” at “apdo.”
  alternative: Gamitin ang mga interpretatibong katawagang “kaloob-looban” at “kapaitan.”
  rationale: Inilalarawan ng talata ang pagdurusa ni Job sa pamamagitan ng marahas at visceral na larawan. Pinananatili ng literal na mga bahagi ng katawan ang bagsik ng tulang Hebreo at iniiwasang palambutin o tiyaking espirituwal lamang ang kahulugan.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang marahas na anatomikal na larawan at ang paglipat mula sa maramihang “mga mamamana” tungo sa isahang kumikilos na “niya,” gaya ng nasa Hebreo. Ang “mga bato” ay karaniwang katawagang Filipino para sa kidneys; nililinaw ito sa talababa upang maiwasan ang pagkalito sa literal na mga bato sa lupa.
