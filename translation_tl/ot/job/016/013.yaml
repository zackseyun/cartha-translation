  to: Pinalilibutan ako ng kaniyang mga mamamana[a]; binibiyak niya ang aking mga bato[b] at hindi niya ako kinahahabagan; ibinubuhos niya sa lupa ang aking apdo[c].
  rationale: Pinalitan ang maling asosasyong dulot ng “pinatatawad” ng “kinahahabagan,” na mas tumpak na naghahatid ng diwa ng hindi pagpapalugit o hindi pagkakaroon ng awa. Inayos din ang mga talababa upang maging ganap na Tagalog, malinaw ang “mga bato” bilang kidneys, at makabuluhan ang alternatibo para sa “apdo.”
