  source_fidelity: Ang unang linya ay wastong naghahatid ng pagbabago ng kulay/anyo ng mukha dahil sa pag-iyak. Ang ikalawang linya ay tumutugma sa Hebreo sa pagtukoy sa mga talukap at sa matinding kadiliman, ngunit ang “nababalot” ay bahagyang nagpapasok ng pandiwang wala sa teksto; mas tuwiran ang “may ... sa.”
  naturalness: Likas at patula ang “Namumula ang mukha ko sa kaiiyak.” Mas natural at mas malapit sa estruktura ng pinagmulan ang “may matinding dilim sa aking mga talukap” kaysa “nababalot ... ang ... mga talukap.”
  terminology: 'Ang “matinding dilim” ay angkop para sa צלמות. Kailangang ayusin ang talababa: ang tradisyonal na alternatibo ay “anino ng kamatayan,” hindi “nakamamatay na anino,” at hindi dapat ipakita ang isang pagbasa bilang tiyak na mas malamang kung nananatiling pinagtatalunan ang leksikal na saklaw.'
  issues:
