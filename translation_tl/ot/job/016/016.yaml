    issue: Ang “nababalot” ay nagdaragdag ng mas tiyak na larawan ng pagbalot.
    rationale: 'Ang Hebreo ay nominal na pahayag: literal na “at sa ibabaw ng aking mga talukap [ay] malalim na dilim.” Ang “may ... sa” ay nagpapanatili ng larawan nang hindi nagdaragdag ng kilos.'
  - severity: medium
    issue: Hindi tumpak ang “nakamamatay na anino” bilang pagpapaliwanag ng tradisyonal na alternatibo.
    rationale: Ang kaugnay na tradisyonal na salin ay “anino ng kamatayan” (“shadow of death”), hindi aninong nakamamatay. Ang kasunod na pahayag na mas malamang ang isang kahulugan ay dapat ding gawing mas maingat upang mapanatili ang leksikal na ambigwidad.
