  text: My face is red from weeping[a], and on my eyelids is deep darkness.
translation:
  language: tl
  text: 'Namumula ang mukha ko sa kaiiyak,

    at may matinding dilim sa aking mga talukap.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “anino ng kamatayan.” Ang salitang Hebreo ay maaaring tumukoy sa napakalalim na dilim o, sa tradisyonal na pagbasa, sa anino ng kamatayan.
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּנַי
  choice: ang mukha ko
  rationale: Bagaman nasa anyong maramihan sa Hebreo, karaniwan itong tumutukoy sa mukha bilang isang kabuuan. Likas at malinaw sa makabagong Filipino ang “ang mukha ko.”
- source_word: חמרמרה
  choice: namumula
  rationale: Ang pambihirang pandiwa ay naglalarawan ng kapansin-pansing pagbabago sa mukha dahil sa matinding dalamhati o pisikal na hirap. Sa konteksto ng pag-iyak, ipinahahayag ng “namumula” ang malamang na nakikitang epekto nang hindi labis na tinutukoy kung ito ay pamamaga o pangingitim.
- source_word: מִנִּי בֶכִי
  choice: sa kaiiyak
  rationale: Ipinahihiwatig ng pariralang Hebreo na ang kalagayan ng mukha ay bunga ng patuloy o matinding pag-iyak. Natural sa Filipino ang “sa kaiiyak” at napapanatili nito ang tindi ng pahayag.
- source_word: עַפְעַפַּי
  choice: ang aking mga talukap
  rationale: Tiyak na “mga talukap ng mata” ang tinutukoy ng Hebreo, hindi lamang ang mga mata. Ang pinaikling “mga talukap” ay malinaw sa konteksto at angkop sa tula.
- source_word: צַלְמָוֶת
  choice: matinding dilim
  rationale: Maaaring tumukoy ang salitang Hebreo sa napakalalim na dilim o sa “anino ng kamatayan.” Ang “matinding dilim” ay natural at naaangkop sa larawang nakapatong sa mga talukap, habang pinananatili sa talababa ang tradisyonal na alternatibo.
