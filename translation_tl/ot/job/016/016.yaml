translation_notes:
  register: Makabago, marangal, at patulang Filipino. Ginamit ang “sa kaiiyak” upang likas na ipahayag ang sanhi at tindi ng pag-iyak, at ang “nababalot” upang maihatid nang malinaw ang larawang patula ng dilim sa mga talukap.
