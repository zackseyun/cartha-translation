    rationale: Ang pandiwa ay tumutukoy sa pag-uugnay, pagdurugtong, o pagtitipon ng mga salita; ang “mag-ayos” ay maaaring mangahulugang magtama o mag-organisa at nababawasan ang retorikal na larawan.
  - severity: low
    issue: Hindi binabanggit ng “umiling sa inyo” ang “aking ulo.”
    rationale: Bagaman mauunawaan ang ibig sabihin, malinaw na kasama sa Hebreo ang ulo bilang bahagi ng kilos. Ang pagbanggit dito ay nagpapanatili ng larawan ng pinagmulan nang hindi nagiging di-likas ang Tagalog.
