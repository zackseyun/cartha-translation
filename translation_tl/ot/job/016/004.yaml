base_translation:
  language: en
  yaml_path: translation/ot/job/016/004.yaml
  text: I too could speak like you[a], if your soul were in place of my soul[c][b]; I could heap up words against you and shake my head at you.
translation:
  language: tl
  text: Maaari rin akong magsalita gaya ninyo, kung kayo ang nasa kalagayan ko[a]; maaari akong magdugtong-dugtong ng mga salita laban sa inyo[b] at iling-ilingin ang aking ulo sa inyo[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “kung ang inyong buhay/sarili ay kapalit ng aking buhay/sarili.” Ang salitang Hebreo na נֶפֶשׁ ay maaaring tumukoy sa buhay, sarili, tao, o kaluluwa ayon sa konteksto.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “magbunton ng mga salita laban sa inyo.”
    reason: lexical_alternative
  - marker: c
    text: Sa kontekstong ito, ang pag-iling ng ulo ay kilos ng paghamak o panunuya.
    reason: cultural_note
lexical_decisions:
- source_word: גַּם אָנֹכִי כָכֶם אֲדַבֵּרָה
  choice: Maaari rin akong magsalita gaya ninyo
  rationale: Ipinahahayag ang mariing pagtutumbas ni Job at ang potensiyal na kilos sa isang di-tunay na kalagayan, sa natural na modernong Tagalog.
- source_word: לוּ יֵשׁ נַפְשְׁכֶם תַּחַת נַפְשִׁי
  choice: kung kayo ang nasa kalagayan ko
  rationale: Ang נֶפֶשׁ ay tumutukoy rito sa tao o sarili, at ang buong parirala ay likas na nangangahulugang pagpapalitan ng kalagayan. Iniiwasan ng saling ito ang di-likas na literal na ‘kaluluwa kapalit ng kaluluwa’ habang pinananatili ang diwa.
- source_word: אַחְבִּירָה עֲלֵיכֶם בְּמִלִּים
  choice: maaari akong mag-ayos ng mga salita laban sa inyo
  rationale: Pinananatili ang pangunahing larawan ng pandiwang חָבַר—pagdurugtong o pag-aayos—at ang mapanlabang direksiyon ng עֲלֵיכֶם, nang hindi tiyakang ginagawang ‘tambakan’ lamang ang posibleng kahulugan.
- source_word: וְאָנִיעָה עֲלֵיכֶם בְּמוֹ רֹאשִׁי
  choice: at umiling sa inyo
  rationale: Ang pag-iling ng ulo ay malinaw at natural na katumbas sa Tagalog ng kilos na nagpapahayag ng paghamak o panunuya sa kontekstong ito.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang maramihang “ninyo/inyo” dahil higit sa isang kaibigan ang kinakausap ni Job. Ang kondisyunal na “maaari” ay nagpapanatili sa mapanuyang, di-tunay na paghahambing.
