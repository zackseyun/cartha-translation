  yaml_path: translation/ot/job/006/010.yaml
  text: This would still be my comfort[a], and I would exult in unrelenting pain; for I have not denied the words of the Holy One.
translation:
  language: tl
  text: Ito pa rin ang magiging kaaliwan ko,[a] at magagalak ako sa walang-humpay na kirot; sapagkat hindi ko itinakwil ang mga salita ng Banal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas pormal, “at magagalak ako sa kirot na hindi niya pinahuhupa.” Mahirap at siksik ang Hebreo ng sugnay na ito.
    reason: alternative_reading
lexical_decisions:
- source_word: נֶחָמָתִי
  choice: kaaliwan ko
  rationale: Ang pangngalan mula sa נחם ay tumutukoy sa kaaliwan o kaginhawahan. Likas at marangal sa modernong Tagalog ang “kaaliwan ko” at pinananatili nito ang natitirang aliw na sinasabi ni Job.
- source_word: וַאֲסַלְּדָה
  choice: at magagalak ako
  rationale: Bihira at mahirap tiyakin ang pandiwang סלד. Sa konteksto, nagsasaad ito ng matinding positibong tugon sa gitna ng kirot. Ang “magagalak” ay natural at hindi nagpapanggap na tiyak ang posibleng literal na larawang “lumulukso.”
- source_word: בְחִילָה
  choice: sa walang-humpay na kirot
  rationale: Maaaring tumukoy ang חִילָה sa pamimilipit, matinding hirap, o kirot. Ang “kirot” ay malinaw at madarama sa Tagalog; kaugnay ng kasunod na parirala, ang “walang-humpay” ay naghahatid ng sakit na hindi pinahuhupa.
- source_word: לֹא יַחְמֹל
  choice: walang-humpay
  rationale: Ang חמל ay nangangahulugang maawa o magpaligtas. Dahil siksik at mahirap ang sintaks, isinama ang diwang hindi pagpapagaan sa paglalarawang “walang-humpay,” habang inilalahad sa talababa ang mas pormal na pagbasa.
- source_word: כִחַדְתִּי
  choice: hindi ko itinakwil
  rationale: Sa piel, maaaring mangahulugan ang כחד ng ikaila, itago, o supilin. Sa layong “mga salita ng Banal,” ang “itinakwil” ay malinaw na nagpapahayag ng hindi pagtanggi o pagtataboy sa mga salita ng Diyos.
- source_word: אִמְרֵי
  choice: ang mga salita ng
  rationale: Ang construct plural ng אמרה ay tumutukoy sa mga salita o pahayag. “Mga salita ng” ang pinakamalawak at pinakanatural na katumbas.
- source_word: קָדוֹשׁ
  choice: ang Banal
  rationale: Ginagamit dito ang pang-uri bilang pangngalan at banal na titulo na tumutukoy sa Diyos. Ang “ang Banal” ay maikli, dignificado, at hindi nagdaragdag ng doktrinang wala sa teksto.
theological_decisions:
- issue: Banal na titulong קָדוֹשׁ
  choice: ang Banal
  alternative: ang banal
  rationale: Ipinahihiwatig ng konteksto na Diyos ang tinutukoy, hindi isang karaniwang taong banal. Ang malaking titik ay nagpapakita ng gamit bilang banal na titulo nang hindi nagdaragdag ng ibang katawagan.
- issue: Mahirap na gitnang pariralang בְחִילָה לֹא יַחְמֹל
  choice: sa walang-humpay na kirot
  alternative: sa kirot na hindi niya pinahuhupa
  rationale: Siksik at hindi ganap na tiyak ang Hebreo. Pinananatili ng pangunahing salin ang diwa ng matinding sakit na walang ginhawa at natural itong basahin; pinananatili sa talababa ang mas pormal na pagbasa at ang tahasang paksang “niya.”
translation_notes:
  register: Modernong Filipino Tagalog na natural, dignificado, at madaling maunawaan. Pinili ang “kirot” sa halip na mas teknikal o makalumang salita, at pinanatili sa talababa ang tunay na sintaktikong hirap at alternatibong pagbasa ng gitnang sugnay.
