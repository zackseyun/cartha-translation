  source_fidelity: Kailangang itama ang pangunahing salin ng מִמְּקוֹמָם (“mula sa kanilang lugar”). Ang draft na “sa kanilang kinaroroonan” ay nangangahulugang nasa lugar nila, samantalang ipinahihiwatig ng Hebreo na nawawala o napapawi sila mula roon. Ang “sa tindi ng init” ay maaari rin, ngunit ang simpleng “sa init” ay mas malapit sa בְּחֻמּוֹ at hindi nagdaragdag ng antas ng tindi na wala sa teksto.
  naturalness: Likas ang “Kapag umiinit ang mga ito,” ngunit mas malinaw at mas natural na gawing “naglalaho sila” kaysa ulitin ang “ang mga iyon.” Ang “nawawala mula sa kanilang kinaroroonan” ay malinaw na naghahatid ng direksiyong “mula sa” at nananatiling marangal na modernong Tagalog.
  terminology: Ang “naglalaho” para sa נִצְמָתוּ at “natutuyo” para sa נִדְעֲכוּ ay angkop sa larawan ng mga batis o daluyang pana-panahon. Pinanatili sa talababa ang mas malawak na posibleng diwang “napapawi” at ang kontekstuwal na posibilidad na ang “lugar” ay daluyan ng batis.
