translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Inulit ang ‘ang mga iyon’ upang maging tiyak ang paksa ng magkatulad na sugnay at maiwasan ang malabong pagtukoy. Pinanatili sa talababa ang posibleng larawan ng pagkapawi at ang mas tiyak na ‘daluyan ng batis,’ sa halip na tahimik na lutasin ang leksikal na kalabuan.
