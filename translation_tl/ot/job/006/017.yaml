  text: When they are warmed[a], they vanish; when it is hot[c][b], they dry up from their place.
translation:
  language: tl
  text: Kapag umiinit ang mga ito, naglalaho sila; sa init[a], natutuyo sila at nawawala mula sa kanilang kinaroroonan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “sa init nito”; maaari ring isaling “sa init.”
    reason: lexical_alternative
  - marker: b
    text: Ang “kinaroroonan” ay maaaring tumukoy nang mas tiyak sa daluyan ng batis sa kontekstong ito. Ang dalawang pandiwa para sa paglalaho at pagkatuyo ay maaari ring isaling “napapawi,” sapagkat pinaghahalo ng larawang Hebreo ang pagkawala at pagkapawi.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּעֵת
  choice: Kapag
  rationale: Likas na panandang temporal sa makabagong Tagalog at malinaw na inuugnay ang pag-init sa kasunod na pagkawala.
- source_word: יְזֹרְבוּ
  choice: umiinit ang mga iyon
  rationale: Ang bihirang pandiwa ay tumutukoy sa pagiging mainit o pag-init. Hindi nito labis na tinutukoy kung ano ang sanhi ng init, at ang panghalip ay bumabalik sa mga daluyan ng tubig sa konteksto.
- source_word: נִצְמָתוּ
  choice: naglalaho ang mga iyon
  rationale: Naipapahayag nito ang pagkawala o pagkaubos ng tubig sa pana-panahong mga batis, habang pinananatili ang masiglang larawan at hindi ipinipilit ang kahulugang ‘pinapatay.’
- source_word: בְּחֻמּוֹ
  choice: sa tindi ng init
  rationale: Pinananatili nito ang literal na kayariang ‘sa init nito’ nang natural sa Tagalog, ngunit iniiwasang magtakda ng hindi tiyak na personal na tinutukoy ng hulapi.
- source_word: נִדְעֲכוּ
  choice: natutuyo ang mga iyon
  rationale: Bagaman maaari ring mangahulugang mapawi o mamatay, ang ‘natutuyo’ ang malinaw na konkretong diwa sa larawan ng mga daluyan ng tubig na nawawala dahil sa init.
- source_word: מִמְּקוֹמָם
  choice: sa kanilang kinaroroonan
  rationale: Likas itong salin ng ‘mula sa kanilang lugar’ sa Tagalog at pinananatiling pangkalahatan ang מקום sa halip na agad itong tukuying ‘kanal’ o ‘dalisdis ng batis.’
