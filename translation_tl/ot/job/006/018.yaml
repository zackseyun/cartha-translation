translation:
  language: tl
  text: Nag-iiba ang direksiyon ng kanilang mga landas[a]; umaahon ang mga ito tungo sa tiwangwang at naglalaho.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Lumilihis ang mga ruta ng mga manlalakbay; umaahon sila sa tiwangwang at nawawala.” Mahirap unawain ang larawang Hebreo. Ipinapalagay ng ilan na mga ruta ng karaban, o ang mga karaban mismo, ang tinutukoy sa halip na ang mismong mga landas o daluyan.
    reason: alternative_reading
lexical_decisions:
- source_word: יִלָּפְתוּ
  choice: paliko-likong lumalayo
  rationale: Ang Niphal na anyo ay nagpapahiwatig ng pagliko, pagpilipit, o paglihis. Sa larawan ng mga batis o lagusan ng tubig, pinananatili ng parirala ang diwang paikot na paglayo nang hindi labis na nililinaw ang mahirap na talinghaga.
- source_word: אָרְחוֹת
  choice: mga landas
  rationale: Karaniwang tumutukoy ang salita sa mga landas o bakas. Posible rin ang metonimikong pakahulugang mga ruta o pangkat ng manlalakbay, kaya itinala ang alternatibo sa talababa.
- source_word: דַּרְכָּם
  choice: ng kanilang agos
  rationale: Literal itong 'kanilang daan,' ngunit sa konteksto ng mga batis na nabibigo, natural na ipinahahayag ng 'agos' ang tinatahak na daloy habang iniiwasan ang alanganing pag-uulit ng 'landas' at 'daan.'
- source_word: יַעֲלוּ
  choice: umaahon
  rationale: Pinananatili nito ang kongkretong kahulugan ng pag-akyat o pag-ahon, sa halip na palitan agad ng interpretasyong 'naglalaho.'
- source_word: בַתֹּהוּ
  choice: patungo sa tigang na ilang
  rationale: Ang תֹהוּ ay maaaring mangahulugang kawalan, kapanglawan, o ilang. Ang parirala ay natural sa modernong Tagalog at angkop sa larawang disyerto, habang ipinahahayag ang kilos na patungo roon.
- source_word: וְיֹאבֵדוּ
  choice: at naglalaho
  rationale: Ang אבד ay maaaring mangahulugang mapahamak, mawala, o maglaho. Para sa tubig na nawawala sa ilang, 'naglalaho' ang natural at malinaw na katumbas nang hindi ipinahihiwatig na mga taong namamatay ang tiyak na paksa.
