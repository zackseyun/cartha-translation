translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang mahirap at bahagyang malabong larawan ng Hebreo; ang pangunahing salin ay tumutukoy sa mga landas o agos, samantalang nasa talababa ang posibleng pagbasa tungkol sa mga ruta o karaban.
