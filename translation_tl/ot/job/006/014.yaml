  text: Kindness from his friend is due to one who is despairing[b][a], even if he forsakes the fear of the Almighty.
translation:
  language: tl
  text: Ang nawawalan ng pag-asa ay nararapat tumanggap ng kabutihang-loob[a] mula sa kanyang kaibigan, kahit talikuran pa niya ang pagkatakot sa Makapangyarihan sa Lahat.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “kabutihang-loob” ay salin ng חֶסֶד (ḥesed), na maaari ring mangahulugang tapat na pag-ibig, awa, o matibay na katapatan.
    reason: lexical_alternative
  - marker: b
    text: O, “Ang kaibigang nagkakait ng kabutihang-loob sa nawawalan ng pag-asa ay tumatalikod sa pagkatakot sa Makapangyarihan sa Lahat.” Siksik ang sintaks ng Hebreo at maaari itong unawain sa ganitong paraan.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמָּס
  choice: ang nawawalan ng pag-asa
  rationale: Ang salitang mula sa ugat na nangangahulugang “matunaw” o “manghina” ay metaporikong tumutukoy sa taong gumuho ang kalooban dahil sa pagdurusa. Likas at malinaw sa modernong Tagalog ang “nawawalan ng pag-asa.”
- source_word: מֵרֵעֵהוּ
  choice: mula sa kanyang kaibigan
  rationale: Pinananatili ng “mula sa” ang pinagmumulan ng kabutihang-loob, at ng “kanyang” ang panlalaking isahang hulapi, nang hindi ginagawang tiyak ang kasarian sa Tagalog.
- source_word: חָסֶד
  choice: kabutihang-loob
  rationale: Sa ugnayang pantao rito, tumutukoy ang חֶסֶד sa mahabagin at tapat na kabaitan. Ang “kabutihang-loob” ay natural at marangal, samantalang inilalahad sa talababa ang mas malawak na diwa nito.
- source_word: וְיִרְאַת שַׁדַּי
  choice: ang pagkatakot sa Makapangyarihan sa Lahat
  rationale: Pinananatili ng “pagkatakot” ang biblikal na idyoma at bigat ng יִרְאָה, na maaari ring magpahiwatig ng pagpipitagan, sa halip na paliitin ito sa simpleng paggalang.
- source_word: יַעֲזֹב
  choice: talikuran
  rationale: Ang “talikuran” ay natural na salin ng pandiwang nangangahulugang iwan o pabayaan, at ang “kahit … pa” ay nagpapahayag sa napiling pagbasa na konsesibo ang huling sugnay.
- source_word: שַׁדַּי
  choice: Makapangyarihan sa Lahat
  rationale: Karaniwang salin sa Tagalog ng banal na titulong שַׁדַּי; isinalin bilang titulo sa halip na baybayin lamang ang tunog nito.
theological_decisions:
- issue: Ugnayang sintaktiko ng huling sugnay
  choice: Ang nawawalan ng pag-asa ay nararapat tumanggap ng kabutihang-loob mula sa kanyang kaibigan, kahit talikuran pa niya ang pagkatakot sa Makapangyarihan sa Lahat.
  alternative: Ang kaibigang nagkakait ng kabutihang-loob sa nawawalan ng pag-asa ay tumatalikod sa pagkatakot sa Makapangyarihan sa Lahat.
  rationale: Napakasiksik ng sintaks ng Hebreo at kapwa posible ang mga pagbasa. Ang napiling konsesibong pagbasa ay akma sa agarang konteksto ng pagsaway ni Job sa mga kaibigang hindi nagpakita ng tapat na malasakit, ngunit pinananatili sa talababa ang mahalagang alternatibo.
translation_notes:
  register: Gumamit ng modernong, dignified, at madaling maunawaang Tagalog. Ang “nararapat tumanggap” ay naghahatid ng diwang may pagkakautang o obligasyong moral nang hindi pinipilit ang literal ngunit bitin na ayos ng Hebreo. Iniwasan ang salitang sektaryano at pinanatili ang biblikal na pariralang “pagkatakot sa Makapangyarihan sa Lahat.”
