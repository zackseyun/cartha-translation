lexical_decisions:
- source_word: מַה נִּמְרְצוּ
  choice: Napakabisa
  rationale: Ang מַה ay nagpapahayag ng matinding antas, at ang Niphal ng מרץ ay maaaring tumukoy sa lakas, bisa, o tindi. Ang “napakabisa” ay natural sa Filipino at hindi nililimitahan ang diwa sa sakit o panghihikayat lamang.
- source_word: אִמְרֵי יֹשֶׁר
  choice: mga salitang matuwid
  rationale: Pinananatili nito ang larawan ng יֹשֶׁר bilang katuwiran o pagiging tuwid, habang malinaw na tumutukoy sa tapat at wastong pananalita.
- source_word: וּמַה
  choice: Ngunit ano
  rationale: Bagaman payak na pang-ugnay ang ו, pasalungat ang ugnayan ng dalawang sugnay sa konteksto.
- source_word: יּוֹכִיחַ
  choice: ang pinatutunayan
  rationale: Maaaring mangahulugan ang Hiphil ng יכח na patunayan, sumaway, magwasto, o makipagtalo. Dito, hinahamon ng tanong kung ano talaga ang naipakikita o naisasakatuparan ng kanilang pagsaway.
- source_word: הוֹכֵחַ
  choice: pagsaway
  rationale: Ang anyong ito ay tumutukoy sa gawa ng pagsaway o pagwawasto. Ang “pagsaway” ay dignificado at madaling maunawaan.
- source_word: מִכֶּם
  choice: mula sa inyo
  rationale: Tuwirang ipinakikita ng pariralang ito ang pinagmulan ng pagsaway at pinananatili ang diin ng Hebreo.
