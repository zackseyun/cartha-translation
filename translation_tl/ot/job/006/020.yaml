translation:
  language: tl
  text: Napahiya sila dahil nagtiwala sila; dumating sila roon[b] at nabigo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Nalagay sila sa kahihiyan dahil nagtiwala sila; dumating sila roon at napahiya.” Gumagamit ang Hebreo ng dalawang magkaugnay na pandiwang tumutukoy sa hiya o kahihiyan; ang ikalawa ay maaari ring mangahulugang “nalito,” “napahiya,” o “namula sa hiya.”'
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “dumating sila sa kaniya,” na tumutukoy sa pana-panahong batis o wadi sa naunang konteksto.
    reason: cross_reference
lexical_decisions:
- source_word: בֹּשׁוּ
  choice: Napahiya sila
  rationale: Ang Qal perfect na maramihan ng בוש ay tumutukoy sa pagkapahiya o pagkalagay sa kahihiyan. Ang “napahiya” ay natural sa modernong Tagalog at pinananatili ang bunga at damdaming ipinahihiwatig ng pandiwa.
- source_word: כִּי
  choice: dahil
  rationale: Pinakamalamang na nagpapakilala ang כִּי ng dahilan ng kanilang pagkapahiya, kaya malinaw at natural ang “dahil.”
- source_word: בָטָח
  choice: nagtiwala sila
  rationale: Bagaman pang-isahang panlalaki ang anyong Hebreo, napaliligiran ito ng mga pandiwang maramihan at tumutukoy sa mga pangkat ng manlalakbay. Ang maramihang “nagtiwala sila” ang natural na pagpapahayag sa Tagalog nang hindi binabago ang kolektibong diwa.
- source_word: בָּאוּ
  choice: dumating sila
  rationale: Tuwirang katumbas ito ng Qal perfect na maramihan ng בוא at angkop sa pagdating ng mga manlalakbay sa inaasahang patutunguhan.
- source_word: עָדֶיהָ
  choice: roon
  rationale: Ang hulaping pambabae ay tumutukoy pabalik sa batis o wadi sa naunang konteksto. Mas natural sa Tagalog ang “roon” kaysa sa literal na “hanggang dito/rito sa kaniya,” habang pinananatili ang diwa ng patutunguhan.
- source_word: וַיֶּחְפָּרוּ
  choice: at nabigo
  rationale: Sa kontekstong ito, ang חפר ay maaaring magpahiwatig ng pagkalito, kahihiyan, o matinding pagkabigo. Ipinapahayag ng “nabigo” ang karanasan ng mga manlalakbay na dumating ngunit hindi natagpuan ang inaasahang tubig; inilalahad sa talababa ang kaugnay na diwa ng kahihiyan.
