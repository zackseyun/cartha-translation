lexical_decisions:
- source_word: וּמַלְּטוּנִי
  choice: Iligtas ninyo ako
  rationale: Ang Hiphil imperative na may panlaping tumutukoy sa unang panauhan ay panawagang ilabas si Job sa panganib. Ipinakikita ng “ninyo” na maramihan ang kinakausap, at likas sa modernong Tagalog ang “iligtas” sa ganitong konteksto.
- source_word: מִיַּד
  choice: mula sa kamay ng
  rationale: Pinananatili ang konkretong idyomang Hebreo para sa pagliligtas mula sa kapangyarihan o kontrol ng isang tao; malinaw at nauunawaan din ito sa Tagalog.
- source_word: צָר
  choice: kaaway
  rationale: Tumutukoy ito sa isang taong laban o mapan hostile kay Job. Pinananatili ng “kaaway” ang isahan at hindi nito nililimitahan ang diwa sa digmaang militar.
- source_word: עָרִיצִים
  choice: mga malulupit
  rationale: Ang pangngalan ay maramihan at tumutukoy sa mararahas, walang-awa, o mapaniil na mga tao. Malinaw at hindi labis na politikal ang “mga malulupit.”
- source_word: תִּפְדּוּנִי
  choice: Tubusin ninyo ako
  rationale: Ang פדה ay tumutukoy sa pagtubos o pagpapalaya, kung minsan sa pamamagitan ng pantubos. Pinananatili ng “tubusin” ang pagkakaiba nito sa מלט sa unang hati ng talata nang hindi ipinapalagay na espirituwal ang pagtubos dito.
theological_decisions:
- issue: Paglalarawan sa פדה sa kontekstong hindi kultiko o tahasang tungkol sa kaligtasang espirituwal
  choice: Tubusin ninyo ako
  alternative: Palayain ninyo ako
  rationale: Maaaring magkaroon ng espirituwal na pahiwatig ang “tubusin,” ngunit saklaw mismo ng pandiwang Hebreo ang pagpapalaya mula sa panganib o pagkakagapos. Pinananatili nito ang lakas at natatanging kulay ng ikalawang pandiwa nang hindi nagdaragdag ng doktrinang wala sa konteksto.
translation_notes:
  register: Makabago, marangal, at tuwirang Filipino. Pinananatili ang retorikal na tanong na nagpapatuloy mula sa naunang talata, ang maramihang kausap sa “ninyo,” at ang balanseng parallelismo ng dalawang pakiusap. Ang “o” sa simula at ang pangwakas na tandang pananong ay nagpapakitang bahagi ito ng mas mahabang tanong sa konteksto.
