  to: Bumalik kayo, pakiusap; huwag magkaroon ng kawalang-katarungan. Bumalik kayo muli; nanatili pa rin dito ang aking katuwiran.[a]
  rationale: Pinalitan ang interpretibong “Pag-isipan ninyo itong muli” ng “Bumalik kayo” upang maipreserba ang inuulit na pautos at ang larawan ng pagbabalik sa Hebreo. Hindi tahasang pinangalanan ang antecedent ng pambabaeng panghalip sa huling parirala; ang malamang na “usapin” ay ipinaliwanag lamang sa talababa. Napanatili ang magalang at marangal na rehistro, ang impersonal na pananalita tungkol sa kawalang-katarungan, at ang panghukuman/moral na saklaw ng “katuwiran.”
