  text: שֻֽׁבוּ נָ֭א אַל תְּהִ֣י עַוְלָ֑ה ו/שבי ע֝וֹד צִדְקִ/י בָֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/006/029.yaml
  text: Turn back[a], please; let there be no injustice. Turn back again; my righteousness is still in it.
translation:
  language: tl
  text: Bumalik kayo, pakiusap; huwag magkaroon ng kawalang-katarungan. Bumalik kayo muli; nanatili pa rin dito ang aking katuwiran.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “bumalik kayo muli; ang aking matuwid na panig ay nananatili pa rin sa usaping ito.” Ang “dito” ay tumutukoy sa isang hindi tahasang pinangalanang bagay, malamang sa usapin o kasong pinagtatalunan.
    reason: ambiguity
lexical_decisions:
- source_word: שֻׁבוּ / וְשֻׁבוּ
  choice: Pag-isipan ninyo itong muli
  rationale: Ang inuulit na pautos ng שׁוב ay literal na tumutukoy sa pagbalik o pagtalikod sa dating direksiyon. Sa konteksto, hinihimok ni Job ang mga kaibigan niyang balikan at baguhin ang kanilang paghatol. Ang salin ay likas sa modernong Filipino at pinananatili ang pag-uulit ng pakiusap; inilalagay sa talababa ang mas literal na larawan ng ‘bumalik.’
- source_word: נָא
  choice: pakiusap
  rationale: Magalang na katagang nagpapalambot sa pautos. Ang ‘pakiusap’ ay natural at marangal sa modernong Filipino at hindi ito binibigyan ng maling kahulugang temporal.
- source_word: אַל תְּהִי עַוְלָה
  choice: huwag magkaroon ng kawalang-katarungan
  rationale: Pinananatili ang impersonal na ayos at ang abstraktong pangngalang עַוְלָה, sa halip na tukuyin nang tahasan kung sino ang gumagawa ng mali.
- source_word: עוֹד
  choice: pa rin
  rationale: Ipinahihiwatig dito na nananatili ang katuwiran ni Job sa usaping pinagtatalunan. Ang ‘pa rin’ ang natural na katumbas ng ‘still/yet’ sa Filipino.
- source_word: צִדְקִי
  choice: aking katuwiran
  rationale: Pinananatili ang moral at panghukuman na saklaw ng צדק. Sa konteksto, ito ay pag-aangkin ni Job ng pagiging nasa katuwiran sa usaping ito, hindi ng ganap na kawalang-kasalanan.
- source_word: בָהּ
  choice: nasa usaping ito
  rationale: May pambabaeng panghalip na walang tahasang binanggit na antecedent; malamang na tumutukoy ito sa kaso o usaping pinagtatalunan. Ginawang malinaw sa katawan ng salin ngunit itinala sa talababa ang mas pormal at malabong ‘nasa loob nito.’
theological_decisions:
- issue: Saklaw ng pag-aangkin ni Job sa צִדְקִי
  choice: Ipinahahayag ni Job na nasa katuwiran pa rin siya sa usaping pinagtatalunan.
  alternative: Maaaring tumukoy ito sa kanyang makatarungang panig o sa katotohanang nakataya pa rin ang katuwiran sa usaping ito.
  rationale: Hindi dapat ipakahulugan ang parirala bilang pag-aangkin ng ganap na kawalang-kasalanan. Ang konteksto ay ang hatol ng mga kaibigan ni Job at ang kanyang integridad sa partikular na pagtatalo.
translation_notes:
  register: Modernong Filipino na magalang, marangal, at madaling maunawaan. Iniwasan ang ‘magbalik-loob,’ na maaaring magpasok ng di-kinakailangang relihiyosong kahulugan, at pinanatili ang dalawang ulit na pakiusap sa Hebreo.
