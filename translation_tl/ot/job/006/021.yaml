id: JOB.6.21
reference: Job 6:21
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: כִּֽי עַ֭תָּה הֱיִ֣יתֶם לא תִּֽרְא֥וּ חֲ֝תַ֗ת וַ/תִּירָֽאוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/006/021.yaml
  text: For now you have become nothing[a]; you see terror[b], and you are afraid.
translation:
  language: tl
  text: Sapagkat ngayo'y wala kayong kabuluhan[a]; nakikita ninyo ang kapahamakan[b] at natatakot kayo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal na mababasa sa Hebreo ang isang pariralang tulad ng “kayo ay naging hindi.” Nauunawaan ito ng marami bilang “wala kayong kabuluhan” o “naging tulad kayo nito”—samakatuwid, tulad ng mga batis na hindi maaasahan sa mga naunang talata.
    reason: textual_variant
  - marker: b
    text: Maaari ring isalin na “sindak” o “pagkawasak.” Ang salitang Hebreo ay maaaring tumukoy sa matinding takot, panghihilakbot, o mapangwasak na sakuna.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Iniuugnay nito ang pahayag sa naunang paghahambing sa mga batis na hindi maaasahan, nang hindi labis na nililinaw kung paliwanag o kongklusyon ang relasyon.
- source_word: עַתָּה
  choice: ngayo'y
  rationale: Ipinakikita ang kasalukuyang kalagayan ng mga kaibigan ni Job, taliwas sa tulong na inaasahan niya.
- source_word: הֱיִיתֶם לא
  choice: wala kayong kabuluhan
  rationale: Ang ketiv ay literal na mahirap unawain, ‘kayo ay naging hindi.’ Ipinahahayag ng salin ang kontekstuwal na diwang napatunayan silang walang maitutulong, habang inilalahad sa talababa ang tekstuwal na suliranin.
- source_word: תִּרְאוּ
  choice: nakikita ninyo
  rationale: Pinananatili ang payak na diwa ng ראה at ang tuwirang pagkakita nila sa nakapangingilabot na kalagayan ni Job.
- source_word: חֲתַת
  choice: kapahamakan
  rationale: Maaaring tumukoy ang pangngalan sa sindak, pagkawasak, o mapangwasak na sakuna. Ang ‘kapahamakan’ ay natural bilang bagay na nakikita at hindi inuulit lamang ang damdaming nasa kasunod na pandiwa.
- source_word: וַתִּירָאוּ
  choice: at natatakot kayo
  rationale: Natural na modernong Tagalog para sa takot na tugon ng mga kaibigan sa kanilang nakikita.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran at marangal. Ginamit ang ‘wala kayong kabuluhan’ sa halip na mas kolokyal na ‘wala kayong silbi,’ at pinanatili sa talababa ang tunay na hirap at kalabuan ng tekstong Hebreo.
