base_translation:
  language: en
  yaml_path: translation/ot/job/006/011.yaml
  text: What strength do I have[a], that I should keep hoping? And what is my end, that I should prolong my life?
translation:
  language: tl
  text: Ano ang lakas ko, para patuloy akong umasa? At ano ang wakas ko, para pahabain ko pa ang buhay ko?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “para patuloy akong magtiis?” Literal sa Hebreo, “para pahabain ko ang aking kaluluwa,” isang idyomang maaaring tumukoy sa pagpapahaba ng buhay o sa patuloy na pagtitiis.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה כֹּחִי
  choice: Ano ang lakas ko
  rationale: Pinananatili nito ang retorikal na tanong at ang diwa ng כֹּחַ bilang lakas o kakayahang magpatuloy.
- source_word: כִּי אֲיַחֵל
  choice: para patuloy akong umasa
  rationale: Ang יחל ay maaaring mangahulugang maghintay o umasa. Ang “patuloy” ay likas na nagpapahayag sa Filipino ng pagpapatuloy na kinukuwestiyon ni Job.
- source_word: וּמַה קִצִּי
  choice: At ano ang wakas ko
  rationale: Tuwirang pinananatili ang paralelismo at ang maikli ngunit mabigat na diwa ng קֵץ bilang wakas o hangganan.
- source_word: כִּי אַאֲרִיךְ נַפְשִׁי
  choice: para pahabain ko pa ang buhay ko
  rationale: Literal itong tumutukoy sa “pagpapahaba ng kaluluwa/sarili,” ngunit sa konteksto ay idyoma para sa pagpapatuloy ng buhay o pagtitiis. Ang “pa” ay natural na naghahatid ng ideya ng patuloy na pagpapahaba nang hindi ganap na nilulutas ang ambiguwidad.
