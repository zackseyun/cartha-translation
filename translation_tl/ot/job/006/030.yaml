  text: Is there injustice on my tongue? Does my palate not discern calamities?[a]
translation:
  language: tl
  text: May kawalang-katarungan ba sa aking dila? Hindi ba nakikilala ng aking ngalangala ang mga kapahamakan?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga bagay na lihis sa tama” o “mga bagay na nagdudulot ng kapahamakan.” Ang salitang Hebreo ay maaaring tumukoy sa mapanirang kasamaan o mga kapahamakan, o sa mga bagay na mali sa moral na diwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲיֵשׁ
  choice: May ... ba
  rationale: Likas na anyo sa modernong Tagalog para sa retorikal na tanong tungkol sa pag-iral.
- source_word: בִּלְשׁוֹנִי
  choice: sa aking dila
  rationale: Pinananatili ang konkretong metapora ng dila bilang kasangkapan ng pananalita.
- source_word: עַוְלָה
  choice: kawalang-katarungan
  rationale: Ipinahahayag ang moral na kamalian at bigat ng salita nang hindi nagiging lipas ang wika.
- source_word: אִם
  choice: Hindi ba
  rationale: Ipinakikita ang tungkulin nito rito bilang panimula ng ikalawang retorikal na tanong na kahanay ng una.
- source_word: חִכִּי
  choice: aking ngalangala
  rationale: Pinananatili ang literal na sangkap ng panlasa at ang metapora ng pagkilala sa pamamagitan ng pagtikim.
- source_word: לֹא יָבִין
  choice: Hindi ba nakikilala
  rationale: Ang 'nakikilala' ay natural na nagpapahiwatig ng mapanuring pagkilala habang umaangkop sa larawang kaugnay ng panlasa.
- source_word: הַוּוֹת
  choice: mga kapahamakan
  rationale: Maaaring tumukoy ang pangmaramihang salita sa mapanirang kasamaan o mga kapahamakan; akma ito sa pagdurusa ni Job, habang inilalahad sa talababa ang moral na kahulugan.
