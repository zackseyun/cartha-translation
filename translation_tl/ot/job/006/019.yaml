  text: הִ֭בִּיטוּ אָרְח֣וֹת תֵּמָ֑א הֲלִיכֹ֥ת שְׁ֝בָ֗א קִוּוּ לָֽ/מוֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/006/019.yaml
  text: The caravans of Tema looked[c][b][a]; the travelers of Sheba hoped for them.
translation:
  language: tl
  text: Tumingin ang mga karaban ng Tema[c]; umasa sa mga iyon[b][a] ang mga manlalakbay mula sa Sheba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “naghintay sa mga iyon.” Ang pandiwang Hebreo ay maaaring mangahulugang umasa o maghintay nang may inaasahan.
    reason: lexical_alternative
  - marker: b
    text: Ang “mga iyon” ay tumutukoy sa mga pana-panahong batis na binanggit sa naunang mga taludtod.
    reason: cross_reference
  - marker: c
    text: Ang “mga karaban” ay salin ng salitang Hebreo na maaari ring literal na mangahulugang “mga landas” o “mga daan”; dito, tumutukoy ito sa mga pangkat na naglalakbay sa mga rutang iyon.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִבִּיטוּ
  choice: Tumingin
  rationale: Ang pandiwa mula sa נבט ay nangangahulugang tumingin o titigan. Ang payak na “tumingin” ay natural at hindi nagdaragdag ng tindi na hindi tahasang nasa teksto.
- source_word: אָרְחוֹת
  choice: mga karaban
  rationale: Bagaman literal itong maaaring mangahulugang “mga landas” o “mga daan,” sa konteksto at sa paralelismo sa mga manlalakbay ng Sheba, metonimikong tumutukoy ito sa mga pangkat na naglalakbay.
- source_word: תֵּמָא
  choice: Tema
  rationale: Pangalan ng lugar, isinalin sa karaniwang transliterasyong Filipino.
- source_word: הֲלִיכֹת
  choice: mga manlalakbay
  rationale: Kaugnay ito sa paglakad o paglalakbay, ngunit dito ay tumutukoy sa mga naglalakbay. Malinaw at natural ang “mga manlalakbay.”
- source_word: שְׁבָא
  choice: Sheba
  rationale: Pangalan ng lugar, pinanatili sa nakikilalang transliterasyon.
- source_word: קִוּוּ
  choice: umasa
  rationale: Maaaring mangahulugan ang קוה ng umasa o maghintay nang may inaasahan. Ang “umasa” ay angkop sa mga manlalakbay na umaasang makasusumpong ng tubig, habang inilalagay sa talababa ang tunay na alternatibo.
- source_word: לָמוֹ
  choice: sa mga iyon
  rationale: Pinananatili ang panghalip na maramihan at hindi tahasang pinapalitan ng “mga batis”; ang tinutukoy nito ay mauunawaan mula sa naunang mga taludtod at ipinaliliwanag sa talababa.
