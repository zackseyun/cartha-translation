    rationale: Ang עִמָּדִי ay literal na “kasama ko / nasa akin,” hindi tahasang “nakabaon.” Maaaring ipahiwatig ng konteksto ang pagtama ng mga palaso, ngunit mas ligtas na huwag itong gawing tahasang pahayag sa pangunahing teksto.
  - severity: low
