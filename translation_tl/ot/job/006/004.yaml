  source_fidelity: Ang pangunahing salin na “nakabaon sa akin” ay mas tiyak kaysa sa עִמָּדִי (“kasama ko / nasa akin”). Bagaman posible ang imaheng mga palasong tumama, hindi ito tahasang sinasabi ng Hebreo. Ang “nilalagok” ay bahagyang nagpapasidhi rin sa payak na “umiinom.” Ang rebisyon ay pinananatili ang imaheng lason at ang pandigmang pag-aayos laban kay Job nang hindi dinaragdagan ang antas ng katiyakan.
  naturalness: Dignificado at malinaw ang draft. Ang “nasa akin,” “iniinom ng aking espiritu,” at “nagkakahanay laban sa akin” ay likas na modernong Tagalog at mas malapit sa aspekto at puwersa ng mga pandiwang Hebreo.
  terminology: Ang “Makapangyarihan” para sa שַׁדַּי, “Diyos” para sa אֱלוֹהַּ, “lason” para sa חֲמָתָם sa konteksto ng mga palaso, at “mga kilabot” para sa בִּעוּתֵי ay katanggap-tanggap. Napananatili ang magkaibang banal na katawagan at ang di-tiyak na ugnayan ng Diyos sa mga kilabot.
