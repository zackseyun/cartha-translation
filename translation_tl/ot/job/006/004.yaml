  text: כִּ֤י חִצֵּ֪י שַׁדַּ֡י עִמָּדִ֗/י אֲשֶׁ֣ר חֲ֭מָתָ/ם שֹׁתָ֣ה רוּחִ֑/י בִּעוּתֵ֖י אֱל֣וֹהַּ יַֽעַרְכֽוּ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/job/006/004.yaml
  text: For the arrows of the Almighty are in me[a]; my spirit drinks their poison[c][b]; the terrors of God array themselves against me.
translation:
  language: tl
  text: Sapagkat nasa akin ang mga palaso ng Makapangyarihan[a]; ang lason ng mga iyon ay iniinom ng aking espiritu[b]. Ang mga kilabot ng Diyos ay nagkakahanay laban sa akin.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kasama ko.” Mas literal itong tumutugma sa pang-ukol na Hebreo; iminumungkahi ng larawan ng mga palaso at lason na ang mga ito ay tumama na kay Job.
    reason: lexical_alternative
  - marker: b
    text: O “kamandag ng mga iyon”; maaari ring unawain nang mas abstrakto bilang “kanilang poot.”
    reason: lexical_alternative
  - marker: c
    text: Sa literal, “inaayos ang kanilang hanay laban sa akin”—isang larawang pandigma.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikilala nito ang paliwanag ni Job kung bakit matindi at makatuwiran para sa kaniya ang kaniyang paghihinagpis; pinananatili ang puwersang nagpapaliwanag o nagsasaad ng dahilan.
- source_word: חִצֵּי שַׁדַּי
  choice: ang mga palaso ng Makapangyarihan
  rationale: Pinananatili ang metaporang pandigma at isinasalin ang banal na titulong שַׁדַּי sa malinaw at kinikilalang katumbas sa modernong Tagalog.
- source_word: עִמָּדִי
  choice: nakabaon sa akin
  rationale: Bagaman ang pang-ukol ay literal na maaaring mangahulugang ‘kasama ko’ o ‘nasa akin,’ ipinahihiwatig ng mga palaso at ng kasunod na lason na tumama at nananatili ang mga ito sa katawan ni Job. Isinama sa talababa ang mas literal na alternatibo.
- source_word: חֲמָתָם
  choice: ang lason ng mga iyon
  rationale: Sa larawan ng mga palaso, ang kongkretong kahulugang ‘lason’ ang pinakaangkop; hindi nito ginagawang tahasang abstraktong ‘poot’ ang salitang Hebreo.
- source_word: שֹׁתָה רוּחִי
  choice: nilalagok ng aking espiritu
  rationale: Ang ‘nilalagok’ ay nagpapanatili sa matingkad na larawan ng patuloy at masidhing pag-inom, samantalang ang ‘aking espiritu’ ay tumutukoy sa panloob na pagkatao ni Job.
- source_word: בִּעוּתֵי אֱלוֹהַּ
  choice: ang mga kilabot ng Diyos
  rationale: Ang ‘mga kilabot’ ay nagpapahayag ng mga bagay na naghahatid ng matinding sindak. Pinananatili ng ‘ng Diyos’ ang maikling ugnayang genitibo ng Hebreo nang hindi labis na ipinapaliwanag kung ang mga ito ay mula sa Diyos o pag-aari niya.
- source_word: יַעַרְכוּנִי
  choice: nakahanay laban sa akin
  rationale: Ipinananatili nito ang larawan ng mga puwersang nakaayos sa hanay ng pakikipagdigma laban kay Job, sa natural na modernong Tagalog.
theological_decisions:
- issue: Paglalarawan sa dalawang banal na katawagan na שַׁדַּי at אֱלוֹהַּ
  choice: Isalin ang שַׁדַּי bilang ‘Makapangyarihan’ at ang אֱלוֹהַּ bilang ‘Diyos.’
  alternative: Gamitin ang ‘Shaddai,’ o isalin nang pareho ang dalawang katawagan.
  rationale: Magkaiba ang dalawang banal na katawagan sa Hebreo. Ang magkaibang salin ay nagpapanatili sa pagkakaibang iyon at sa paralelismong patula nang hindi nagpapasok ng natatanging doktrinang pangdenominasyon.
- issue: Kahulugan ng חֲמָתָם sa larawan ng mga palaso
  choice: Unawain bilang ‘lason’ ng mga palaso.
  alternative: Unawain bilang ‘kanilang poot’ o ‘kaniyang poot.’
  rationale: Ang agarang konteksto ay mga palasong may nakalalasong epekto na nilalagok ng espiritu ni Job. Pinananatili ng ‘lason’ ang kongkretong metapora at iniiwasang gawing mas abstraktong teolohikal ang pahayag kaysa sa hinihingi ng teksto.
- issue: Ugnayan ng Diyos sa ‘mga kilabot’
  choice: Panatilihin ang payak na ‘mga kilabot ng Diyos.’
  alternative: Gawing ‘mga kilabot na ipinadala ng Diyos’ o ‘takot kay Diyos.’
  rationale: Hindi tahasang tinutukoy ng maikling pariralang Hebreo ang eksaktong uri ng ugnayan. Pinananatili ng salin ang tunay na kalabuan sa halip na magdagdag ng sanhi o ibang layon.
translation_notes:
  register: Gumamit ng dignificado ngunit kasalukuyang Tagalog. Ang ‘nakabaon,’ ‘nilalagok,’ at ‘nakahanay’ ay nagpapanatili sa magkakaugnay na matitinding larawan ng palaso, lason, at hukbong nakapuwesto, habang nananatiling malinaw sa karaniwang mambabasa.
