  text: Does a wild donkey bray over grass[b][a], or does an ox low over its fodder?
translation:
  language: tl
  text: Humihiyaw ba ang ligaw na asno[a] kapag may damo ito, o umuunga ba ang baka kapag may pinaghalong pakain ito[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “asnong ligaw.” Ang Hebreo ay tumutukoy sa ligaw na asno, na kilala rin bilang onager.
    reason: lexical_alternative
  - marker: b
    text: Ang “pinaghalong pakain” ay salin ng salitang Hebreo para sa hinalo o inihandang pagkain ng hayop.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲיִנְהַק
  choice: Umaatungal ba
  rationale: Ang נהק ay tiyak na tumutukoy sa huni o sigaw ng asno. Ang “umaatungal” ay likas at nauunawaang salin sa Filipino, bagaman maaari rin itong gamitin sa ibang malalakas na sigaw ng hayop.
- source_word: פֶּרֶא
  choice: mailap na asno
  rationale: Tumutukoy ang פֶּרֶא sa asnong ligaw o onager. Mas natural sa kasalukuyang Filipino ang “mailap na asno” kaysa “ligaw na asno,” na maaaring ipakahulugang basta gumagala lamang.
- source_word: עֲלֵי דֶשֶׁא
  choice: kapag may damo ito
  rationale: Literal na may diwang “sa ibabaw/harap ng damo,” ngunit ipinahihiwatig ng retorikal na tanong ang kalagayang may makakain na damo ang hayop. Inihahatid ng salin ang diwang ito nang natural.
- source_word: אִם
  choice: o
  rationale: Sa magkatambal na retorikal na tanong, ipinakikilala ng אִם ang ikalawang alternatibo at likas na isinasalin bilang “o.”
- source_word: יִגְעֶה
  choice: umuunga ba
  rationale: Ang געה ay tunog ng baka. Ang “umuunga” ang tiyak at karaniwang pandiwang Filipino para rito.
- source_word: שׁוֹר
  choice: baka
  rationale: Ang שׁוֹר ay bovine na hayop at maaaring tumukoy sa toro o bakang pantrabaho. Pinananatili ng pangkalahatang “baka” ang lawak ng katawagan nang hindi nagpapasok ng di-tiyak na kasarian o gamit.
- source_word: עַל בְּלִילוֹ
  choice: kapag may pakain ito
  rationale: Ang בְּלִיל ay hinalo o inihandang pagkain ng hayop. Ang “pakain” ay natural at malinaw sa Filipino; ipinaliliwanag sa talababa ang mas tiyak na uri nito.
