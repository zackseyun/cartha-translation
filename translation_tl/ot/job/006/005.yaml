translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang mga tiyak na pandiwa para sa tunog ng asno at baka, habang natural na ipinahayag ang kalagayang may pagkain ang mga hayop. Nakalagay ang bawat pananda ng talababa sa mismong salin.
