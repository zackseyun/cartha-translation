  yaml_path: translation/ot/job/006/012.yaml
  text: Is my strength the strength of stones[a], or is my flesh bronze?
translation:
  language: tl
  text: Ang lakas ko ba ay lakas ng mga bato, o ang laman ko ba ay bronse?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang katawan ko ba ay tanso?” Literal sa Hebreo, “ang laman ko,” na binibigyang-diin ang kaibahan ng kahinaan ng tao at ng katigasan ng metal.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: ba
  rationale: Nagsisimula ito ng retorikal na tanong, kaya likas na ipinahahayag sa Tagalog sa pamamagitan ng hulaping pananong na “ba,” hindi bilang kondisyunal na “kung.”
- source_word: כֹּחַ ... כֹּחִי
  choice: ang lakas ... lakas ko
  rationale: Pinananatili ang pag-uulit ng salitang Hebreo upang maipakita ang diin at paralelismo ng tula.
- source_word: אֲבָנִים
  choice: mga bato
  rationale: Tuwirang pinananatili ang konkretong larawang nasa Hebreo.
- source_word: בְּשָׂרִי
  choice: ang laman ko
  rationale: Ang literal na “laman” ay nagpapanatili sa larawan ng marupok na katawang pantao at sa matinding paghahambing nito sa metal.
- source_word: נָחוּשׁ
  choice: tanso
  rationale: Maaaring tumukoy ang salita sa tanso o bronse. Ang “tanso” ay natural at madaling maunawaan sa modernong Filipino habang pinananatili ang larawan ng matigas na metal.
