  text: ה֭וֹרוּ/נִי וַ/אֲנִ֣י אַחֲרִ֑ישׁ וּ/מַה שָּׁ֝גִ֗יתִי הָבִ֥ינוּ לִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/006/024.yaml
  text: Teach me[a], and I will be silent; make me understand how I have gone astray.
translation:
  language: tl
  text: Turuan ninyo ako, at tatahimik ako; ipaunawa ninyo sa akin kung saan ako nagkamali.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הוֹרוּנִי
  choice: Turuan ninyo ako
  rationale: Ang Hiphil ng ירה ay nangangahulugang “magturo” o “magbigay-aral.” Ang maramihang “ninyo” ay tumutugma sa anyong Hebreo at sa pakikipag-usap ni Job sa kanyang mga kaibigan.
- source_word: וַאֲנִי אַחֲרִישׁ
  choice: at tatahimik ako
  rationale: Pinananatili ang tahasang panghalip at ang taimtim na diwa ng pangakong manahimik upang makinig sa pagtutuwid.
- source_word: וּמַה שָּׁגִיתִי
  choice: kung saan ako nagkamali
  rationale: Literal na may “ano,” ngunit sa pagkakaugnay nito sa שׁגה hinihingi ni Job na tukuyin ang kanyang pagkakamali. Likas sa Filipino ang “kung saan ako nagkamali” at hindi nito ipinapalagay na moral o doktrinal lamang ang uri ng kamalian.
- source_word: הָבִינוּ לִי
  choice: ipaunawa ninyo sa akin
  rationale: Ipinahahayag ng Hiphil imperative ng בין ang pagpapangyaring makaunawa; natural at tuwiran itong naihahatid ng “ipaunawa ninyo sa akin.”
theological_decisions:
- issue: Kung inaamin ba ni Job na talagang nagkamali siya
  choice: Panatilihin itong isang kahilingang tukuyin at ipaunawa ang ipinapalagay na pagkakamali
  alternative: Isalin na parang tahasang pag-amin ni Job sa kasalanan o pagkaligaw
  rationale: Hindi tuwirang ipinahahayag ng Hebreo na kinikilala na ni Job ang isang partikular na kasalanan; hinahamon niya ang mga kaibigan na ituro kung saan siya nagkamali.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang maramihang magalang na “ninyo” dahil maramihan ang mga pautos sa Hebreo at kinakausap ni Job ang kanyang mga kaibigan.
