base_translation:
  language: en
  yaml_path: translation/ot/job/006/008.yaml
  text: Oh[a], that my request would come, and that God would grant my hope.
translation:
  language: tl
  text: Sana'y dumating ang hinihiling ko, at ipagkaloob ng Diyos ang inaasam ko.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִי יִתֵּן
  choice: Sana'y
  rationale: Ang idyoma ay nagpapahayag ng matinding paghahangad, hindi literal na tanong. Likas sa makabagong Tagalog ang “Sana'y” at angkop sa himig ng panaghoy.
- source_word: תָּבוֹא
  choice: dumating
  rationale: Ang di-ganap na anyo ng pandiwa, kasunod ng pormulang optatibo, ay tumutukoy sa ninanais na mangyari. Pinananatili ng “dumating” ang konkretong larawan ng tekstong Hebreo.
- source_word: שֶׁאֱלָתִי
  choice: ang hinihiling ko
  rationale: Ang pangngalan ay nangangahulugang kahilingan o pakiusap. Mas natural at malinaw sa ordinaryong Tagalog ang pariralang “ang hinihiling ko.”
- source_word: וְתִקְוָתִי
  choice: at … ang inaasam ko
  rationale: Bagaman karaniwang nangangahulugang “pag-asa” ang תִּקְוָה, sa kontekstong ito ay tumutukoy ito sa bagay na taimtim na hinihintay o ninanais ni Job; inihahayag iyon nang natural ng “inaasam ko.”
- source_word: יִתֵּן
  choice: ipagkaloob
  rationale: Literal itong “ibigay,” ngunit kapag ang layon ay isang inaasam o kahilingan, dignified at natural sa Tagalog ang “ipagkaloob.”
- source_word: אֱלוֹהַּ
  choice: Diyos
  rationale: Ito ang tuwirang katumbas ng pang-isahang katawagan para sa Diyos; walang batayang leksikal dito upang idagdag ang “Makapangyarihan sa lahat.”
