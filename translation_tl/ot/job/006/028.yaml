translation_notes:
  register: Modernong Filipino Tagalog na natural, tuwiran, at marangal. Ginamit ang maramihang “kayo/ninyo” ayon sa mga anyong pangmaramihan sa Hebreo. Iniwasan ang sobrang literal na “sa harap ng inyong mga mukha,” ngunit pinanatili ang konkretong diwa sa “sa harap ninyo.”
