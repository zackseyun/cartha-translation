base_translation:
  language: en
  yaml_path: translation/ot/job/006/028.yaml
  text: But now[a], please turn to me, and before your faces[c][b], would I lie?
translation:
  language: tl
  text: Ngunit ngayon, pakisuyo, humarap kayo sa akin; magsisinungaling ba ako sa harap ninyo?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: Ngunit ngayon
  rationale: Ipinahihiwatig ng parirala ang agarang pakiusap na may pagsalungat sa naunang sinabi; natural na ipinapahayag ito ng “Ngunit ngayon.”
- source_word: הוֹאִילוּ
  choice: pakisuyo
  rationale: Ang pautos na anyo ay nagpapahayag ng kahandaang hinihingi bilang magalang na pakiusap; ang “pakisuyo” ay likas at marangal sa modernong Tagalog.
- source_word: פְנוּ בִי
  choice: humarap kayo sa akin
  rationale: Maaaring tumukoy ang פנה na may ב sa pagharap o pagbaling ng pansin sa isang tao. Pinananatili ng “humarap kayo sa akin” ang konkretong larawan at nababagay sa kasunod na “sa harap ninyo.”
- source_word: וְעַל פְּנֵיכֶם
  choice: sa harap ninyo
  rationale: Ito ang natural na salin ng literal na larawang “sa harap ng inyong mga mukha,” at pinananatili ang diwa ng tuwiran at hayagang pagsasalita sa kanilang presensiya.
- source_word: אִם אֲכַזֵּב
  choice: magsisinungaling ba ako?
  rationale: Sa konteksto, ang אִם ay nagpapakilala ng retorikal na tanong o hamon, hindi karaniwang kondisyon. Ang כזב ay maaaring mangahulugang magsinungaling o magsalita nang hindi totoo.
