  text: Ayaw ng kaluluwa ko na hipuin ang mga iyon[a]; para silang sakit sa pagkain ko[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “Ayaw ng gana ko na hipuin ang mga iyon.” Ang Hebreong nefesh ay maaaring mangahulugang “kaluluwa,” “sarili,” o, sa ilang konteksto, “gana sa pagkain.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin, “Para sa akin, ang mga iyon ay kasuklam-suklam na pagkain,” o “para silang sakit ng aking tinapay/pagkain.” Siksik at mahirap unawain ang pananalita sa Hebreo.
