lexical_decisions:
- source_word: מֵאֲנָה
  choice: Ayaw
  rationale: Nagpapahayag ang pandiwang מאן ng pagtanggi o kawalan ng loob na gawin ang isang bagay. Likas at tuwiran sa modernong Tagalog ang “ayaw” at napapanatili nito ang kusang pag-iwas.
- source_word: לִנְגּוֹעַ
  choice: hipuin
  rationale: Karaniwang kahulugan ng נגע ang paghipo o pagdaiti. Ang “hipuin” ay tuwirang salin at angkop sa pagkasuklam na ipinahihiwatig ng konteksto.
- source_word: נַפְשִׁי
  choice: aking kaluluwa
  rationale: Maaaring tumukoy ang נֶפֶשׁ sa kaluluwa, sarili, buhay, lalamunan, o gana sa pagkain. Pinananatili ng “aking kaluluwa” ang malawak at masidhing pahayag ng Hebreo nang hindi nililimitahan agad sa gana sa pagkain.
- source_word: הֵמָּה
  choice: ang mga iyon
  rationale: Tumutukoy ang panghalip sa mga bagay na kasuklam-suklam na binanggit sa naunang talata. Mas malinaw at likas sa Tagalog ang “ang mga iyon” kaysa sa payak na “sila” para sa mga bagay.
- source_word: כִּדְוֵי
  choice: para silang sakit sa
  rationale: Ang anyo ay kaugnay ng דוה, “sakit” o “karamdaman,” at nasa isang siksik at mahirap na parirala. Pinananatili ng salin ang larawan ng sakit nang hindi tiyak na ipinapakahulugan kung ang pagkain ay may sakit, nakasusuka, o sanhi ng sakit.
- source_word: לַחְמִי
  choice: aking pagkain
  rationale: Bagaman literal na “tinapay” ang לֶחֶם, madalas itong tumukoy sa pagkain sa pangkalahatan. Mas angkop dito ang “pagkain” upang hindi di-kailangang paliitin ang larawan sa tinapay lamang.
