translation:
  language: tl
  text: Nawa’y loobin[a] ng Diyos na durugin ako; nawa’y pakawalan niya ang kanyang kamay[b] at tuluyan akong wakasan.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nawa’y pumayag ang Diyos.” Ang pandiwang Hebreo ay nagpapahayag ng pagkukusa o pagsang-ayon.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “pakawalan ang kanyang kamay”—isang larawan ng pag-aalis ng pagpipigil upang humampas o kumilos nang ganap.
    reason: cultural_note
  - marker: c
    text: Maaari ring “putulin ako” o “kitlin ako.” Ipinahihiwatig ng Hebreo ang ganap at pangwakas na pagwasak.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֹאֵל
  choice: Nawa’y loobin
  rationale: Ang Hiphil ng יאל ay nagpapahayag ng pagkukusa, pagpayag, o pagiging handa. Ang “nawa’y loobin” ay likas sa panalanging naghahangad at pinananatili ang kusang-loob na diwa.
- source_word: אֱלוֹהַּ
  choice: Diyos
  rationale: Karaniwang katawagang isahan ito para sa Diyos sa aklat ng Job; hindi kailangan ang transliterasyon.
- source_word: וִידַכְּאֵנִי
  choice: durugin ako
  rationale: Ang Piel ng דכא ay tumutukoy sa marahas na pagdurog o pagwasak. Pinananatili ng “durugin ako” ang tindi ng panaghoy.
- source_word: יַתֵּר יָדוֹ
  choice: pakawalan niya ang kanyang kamay
  rationale: Pinananatili nito ang kongkretong idyomang Hebreo ng pag-aalis ng pagpipigil upang kumilos o humampas.
- source_word: וִיבַצְּעֵנִי
  choice: tuluyan akong wakasan
  rationale: Sa kontekstong ito, ang בצע ay nagpapahiwatig ng pagputol o pagkitil na ganap at pangwakas. Mas natural sa modernong Tagalog ang “tuluyan akong wakasan,” habang ipinapaliwanag sa talababa ang mas literal na larawan.
theological_decisions:
- issue: Antropomorpikong paglalarawan sa pagkilos ng Diyos
  choice: Panatilihin ang “kanyang kamay.”
  alternative: kanyang kapangyarihan; kanyang hatol
  rationale: Kongkretong larawan ng pagkilos at kapangyarihan ng Diyos ang ginamit sa Hebreo. Ang pagpapanatili nito ay nag-iingat sa tindi ng pakiusap nang hindi ipinapalagay na literal na may katawang-tao ang Diyos.
- issue: Ang hangarin ni Job na matapos ang kanyang buhay
  choice: Isalin bilang tahasang hangaring tuluyan siyang wakasan ng Diyos.
  alternative: Palambutin bilang paghiling lamang na matapos ang kanyang pagdurusa.
  rationale: Sa konteksto at bokabularyo, hinihiling ni Job ang pangwakas na pagkitil, hindi lamang ang pag-alis ng sakit. Pinananatili ng salin ang bigat at tensiyong teolohikal ng kanyang panaghoy.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang anyong “nawa’y” upang ihayag ang matinding paghahangad ni Job; pinanatili ang kongkretong larawan ng kamay, habang ginawang natural ang pangwakas na pandiwa sa Tagalog.
