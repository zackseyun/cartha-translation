translation:
  language: tl
  text: 'Pinagpapalabunutan ninyo pati ang ulila sa ama,[a]

    at pinagtatawaran ninyo ang inyong kaibigan.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Nagpapalabunutan kayo para sa ulila sa ama.” Literal na sinasabi ng idyomang Hebreo na “pinahuhulog ninyo sa ulila sa ama.”
    reason: lexical_alternative
  - marker: b
    text: O “at naghuhukay kayo ng hukay laban sa inyong kaibigan.” Mahirap tiyakin ang kahulugan ng pandiwang Hebreo rito; nauunawaan naman ito ng marami bilang pakikipagtawaran tungkol sa isang kaibigan o pagsasamantala sa kaniya.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַף
  choice: Kahit
  rationale: Ginagamit dito ang אַף upang patindihin ang paratang at ipakita ang nakagigitlang sukdulan ng ginagawa nila.
- source_word: יָתוֹם
  choice: ulila sa ama
  rationale: Ang יָתוֹם ay tumutukoy sa isang nawalan ng ama at dahil dito ay kabilang sa mga madaling pagsamantalahan. Mas tiyak ang “ulila sa ama” kaysa sa “ulila” lamang sa makabagong Filipino.
- source_word: תַּפִּילוּ
  choice: pinagpapalabunutan
  rationale: Ang Hiphil ng נפל kasama ng עַל ay malamang na idyomang tumutukoy sa pagpapahulog o pagbunot ng palabunutan tungkol sa isang tao. Ipinahahayag ng salin ang malupit na pagtrato sa ulila na para bang maaari siyang mapanalunan o mapagpasiyahan sa palabunutan.
- source_word: תִכְרוּ
  choice: pinagtatawaran
  rationale: Mahirap tiyakin ang kahulugan ng pandiwa rito. Sa paralelismo, maaaring tumukoy ito sa pakikipagtawaran tungkol sa isang tao, na para bang isang bagay na mapakikinabangan.
- source_word: רֵיעֲכֶם
  choice: inyong kaibigan
  rationale: Ang רֵעַ ay maaaring mangahulugang kaibigan, kasamahan, o kapuwa. Ang “kaibigan” ay angkop sa tuwirang pagsaway ni Job sa mga kasama niya at nagpapatingkad sa pagtataksil.
- source_word: עַל ... עַל
  choice: ang ... ang
  rationale: Hindi natural sa Filipino ang tuwirang pag-uulit ng katumbas na pang-ukol. Ipinahihiwatig ng mga pandiwang “pinagpapalabunutan” at “pinagtatawaran” na ang ulila at kaibigan ang ginagawang paksa o bagay ng mapagsamantalang pagkilos.
