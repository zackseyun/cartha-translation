  text: My brothers have dealt treacherously like a wadi[a], like the channels of wadis that pass away,
translation:
  language: tl
  text: Ang mga kapatid ko ay nagtaksil, tulad ng isang pana-panahong batis, tulad ng mga daluyan ng mga batis na nawawala.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “isang sapa” o “isang pana-panahong daluyan ng tubig.” Ang salitang Hebreo ay maaaring tumukoy sa batis, rumaragasang batis, lambak na dinadaluyan ng tubig, o daluyang may tubig lamang sa ilang panahon.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחַי
  choice: mga kapatid ko
  rationale: Tuwirang katumbas ng pangmaramihang anyong ‘aking mga kapatid.’ Maaari itong tumukoy sa malalapit na kasamahan, ngunit pinananatili ang pananalitang pampamilya ng Hebreo.
- source_word: בָּגְדוּ
  choice: nagtaksil
  rationale: Pinananatili ang matinding diwa ng kawalang-katapatan sa isang ugnayan, nang hindi dinaragdagan ang Hebreo ng isang tahasang layon.
- source_word: נָחַל
  choice: batis sa ilang
  rationale: Ipinahihiwatig nito ang daluyan ng tubig sa tigang na lupain na maaaring umagos nang malakas ngunit pana-panahong matuyo. Mas madaling maunawaan ito sa Filipino kaysa sa hiram na salitang ‘wadi.’
- source_word: כַאֲפִיק נְחָלִים
  choice: gaya ng mga daluyan ng mga batis
  rationale: Ang אֲפִיק ay tumutukoy sa daluyan o higaan ng umaagos na tubig. Pinananatili ng salin ang pangmaramihang anyo at ang pag-uulit ng larawang-tubig.
- source_word: יַעֲבֹרוּ
  choice: naglalaho
  rationale: Ang pangunahing diwa ay pagdaan o pagpanaw. Sa konteksto ng mga pana-panahong batis, ipinakikita nito na nawawala ang tubig; nililinaw pa ito ng mga kasunod na talata.
