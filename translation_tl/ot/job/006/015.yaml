  source_fidelity: Ang “mga kapatid ko” ay tapat sa אַחַי, at ang “nagtaksil” ay angkop sa בָּגְדוּ. Gayunman, ang “sa ilang” ay hindi tahasang nasa talata; mas mabuting ihayag ang pana-panahong katangian ng נחל nang hindi nagdaragdag ng isang tiyak na lokasyon. Ang “nawawala” ay likas na pagsasalin sa kontekstuwal na diwa ng יַעֲבֹרוּ.
  naturalness: Nauunawaan ang draft, ngunit mas direkta at likas ang “isang pana-panahong batis” kaysa “isang batis sa ilang.” Nililinaw rin ng binagong talababa na ang tinutukoy ay daluyan ng tubig, hindi lamang rumaragasang tubig.
  terminology: Pinananatili ang pampamilyang “mga kapatid,” ang moral na bigat ng “nagtaksil,” at ang larawan ng pana-panahong daluyan ng tubig. Walang idinagdag na interpretasyong teolohikal.
