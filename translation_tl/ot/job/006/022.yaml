translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang anyong retorikal at ang tuwirang sipi. Ginamit ang “yaman” sa pangunahing teksto para sa natural na kahulugang kontekstuwal, habang inilagay sa talababa ang literal na “lakas” upang mapanatili ang leksikal na tensiyon.
