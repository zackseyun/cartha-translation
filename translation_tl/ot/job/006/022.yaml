  text: Have I ever said[a], ‘Give to me,’ or, ‘From your strength[b], pay a bribe on my behalf’?”
translation:
  language: tl
  text: Sinabi ko ba kailanman, “Bigyan ninyo ako,” o, “Mula sa inyong yaman[a], magbayad kayo ng suhol[b] para sa akin”?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “mula sa inyong lakas.” Dito, ang salitang Hebreo para sa “lakas” ay malamang na tumutukoy sa kanilang kakayahan, ari-arian, o yaman.
    reason: lexical_alternative
  - marker: b
    text: Ang pandiwang isinaling “magbayad ng suhol” ay kaugnay ng pangngalang “suhol” o “regalo.” Maaari rin itong unawain nang mas pangkalahatan bilang pagbibigay ng bayad o pang-udyok alang-alang kay Job.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲכִי אָמַרְתִּי
  choice: Sinabi ko ba kailanman
  rationale: Ang tanong ay retorikal at mariing itinatanggi ni Job na humingi siya ng ganitong tulong. Likas sa modernong Tagalog ang “ba kailanman” para maipahayag ang diin nang hindi ginagawang tahasang pahayag ang tanong.
- source_word: הָבוּ לִי
  choice: Bigyan ninyo ako
  rationale: Tuwirang inililipat ang pangmaramihang pautos at ang layong “sa akin” sa natural na pananalitang Tagalog.
- source_word: וּמִכֹּחֲכֶם
  choice: Mula sa inyong sariling yaman
  rationale: Pangunahing kahulugan ng כֹּחַ ang “lakas” o “kapangyarihan,” ngunit sa konteksto ng pagbabayad ay malamang na tumutukoy ito sa kakayahang pinansiyal, mga ari-arian, o yaman. Ang “sariling” ay natural na nagpapakita na manggagaling ito sa kanila, gaya ng minamarkahan ng “mula sa.”
- source_word: שִׁחֲדוּ
  choice: magbayad kayo ng suhol
  rationale: Ang pandiwa ay kaugnay ng pangngalang nangangahulugang “suhol.” Pinananatili ng salin ang tiyak at posibleng negatibong diwa nito sa halip na palambutin agad bilang karaniwang regalo o bayad.
- source_word: בַעֲדִי
  choice: para sa akin
  rationale: Natural at malinaw na katumbas ng “para sa kapakanan ko” o “sa ngalan ko,” nang hindi nagpapasok ng hindi tiyak na taong tatanggap ng suhol.
