  yaml_path: translation/ot/job/006/026.yaml
  text: Do you think to reprove words[a], when the words of a despairing man are for the wind?
translation:
  language: tl
  text: Iniisip ba ninyong sawayin ang mga salita, gayong ang mga salita ng isang taong nawawalan ng pag-asa ay tulad ng hangin?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “Balak ba ninyong sawayin ang mga salita at ituring na tulad ng hangin ang mga salita ng isang taong nawawalan ng pag-asa?” Maaaring unawain ang ikalawang sugnay sa Hebreo bilang isang pahayag (“ang mga salita ... ay tulad ng hangin”) o bilang bahagi ng layon ng “sawayin” (“ituring ... na tulad ng hangin”).'
    reason: alternative_reading
lexical_decisions:
- source_word: הַ/לְ/הוֹכַח
  choice: sawayin
  rationale: Ipinahahayag ng pawatas ng יכח ang mapanuri at salungat na pagtutuwid ng mga kaibigan; natural at may sapat na bigat sa modernong Tagalog ang “sawayin.”
- source_word: מִלִּים
  choice: mga salita
  rationale: Tuwirang salin na nagpapanatili sa maikli at matalim na paraan ng pagrereklamo ni Job nang hindi idinaragdag ang di-tiyak na diwang “mga salita lamang.”
- source_word: תַּחְשֹׁבוּ
  choice: iniisip ninyo
  rationale: Saklaw ng חשב ang pag-iisip, pagtuturing, o pagbabalak. Pinananatili ng “iniisip ninyo” ang retorikal na tanong at hindi nito nilulutas nang labis kung isip o layunin ang diin.
- source_word: וּ֝/לְ/ר֗וּחַ
  choice: para sa hangin
  rationale: Pinananatili nito ang literal na larawan ng רוּחַ at ang maluwag na ugnayang ipinahihiwatig ng ל, na maaaring tumukoy sa pagiging panandalian, walang saysay, o nakalaan lamang tangayin.
- source_word: אִמְרֵי
  choice: ang mga salita
  rationale: Pinananatili ang pagkakatulad nito sa naunang מִלִּים at gumagamit ng karaniwang salitang nauunawaan ng modernong mambabasa.
- source_word: נֹאָשׁ
  choice: isang nawawalan ng pag-asa
  rationale: Ang Niphal participle ay tumutukoy sa taong nawalan o nawawalan ng pag-asa. Natural at malinaw ang parirala habang iniiwasan ang posibleng ibang pahiwatig ng “desperado.”
theological_decisions:
- issue: Ugnayang sintaktiko ng ikalawang sugnay
  choice: 'Isinalin ang ikalawang sugnay bilang pangyayari o kalagayang inihahambing sa balak nilang pagsaway: “samantalang ... ay para sa hangin.”'
  alternative: 'Maaaring saklawin ng pandiwang “sawayin” ang dalawang kaisipan: “sawayin ang mga salita at ituring na hangin ang mga salita ng isang nawawalan ng pag-asa.”'
  rationale: Malabo ang sintaks ng Hebreo at kapwa posible ang dalawang pagbasa. Pinili sa pangunahing teksto ang mas tuwirang sugnay ngunit malinaw na inilalahad sa talababa ang alternatibo, nang hindi pinapawi ang tensiyon.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit karaniwan. Pinanatili ang retorikal na tanong, ang pag-uulit ng “mga salita,” at ang metapora ng hangin. Ginamit ang “nawawalan ng pag-asa” sa halip na “desperadong tao” upang maging natural at maiwasan ang dagdag na pahiwatig.
