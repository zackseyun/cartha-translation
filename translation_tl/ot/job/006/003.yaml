translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang ‘padalus-dalos’ bilang likas na paglalarawan sa hindi napigil na pananalita, habang pinanatili sa talababa ang tunay na leksikal na kawalang-katiyakan.
