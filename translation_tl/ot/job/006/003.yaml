  text: For now it would be heavier than the sand of the seas[a]; therefore my words have been rash.
translation:
  language: tl
  text: Sapagkat ngayon, mas mabigat pa ito kaysa sa buhangin ng mga dagat; kaya naging padalus-dalos ang mga salita ko.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kaya magulo at hindi mapigil ang mga salita ko.” Mahirap tiyakin ang kahulugan ng pandiwang Hebreo rito; maaaring tumukoy ito sa pananalitang ligaw, magulo, o hindi mapigil.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikita ang dahilan ng panaghoy ni Job sa naunang talata at pinananatili ang lohikal na ugnayan.
- source_word: עַתָּה
  choice: ngayon
  rationale: Binibigyang-diin ang kasalukuyang kalagayan ni Job.
- source_word: מֵחוֹל יַמִּים
  choice: kaysa sa buhangin ng mga dagat
  rationale: Malinaw na ipinahahayag ang paghahambing at pinananatili ang pangmaramihang anyo ng יַמִּים.
- source_word: יִכְבָּד
  choice: mas mabigat pa ito
  rationale: Mula sa ugat na כבד, ‘maging mabigat.’ Ang ‘ito’ ay likas na tumutukoy sa di-tahasang paksa—ang dalamhati o paghihirap na binanggit sa talata 2—nang hindi ito tahasang pinapangalanan.
- source_word: עַל־כֵּן
  choice: kaya
  rationale: Natural na makabagong Tagalog para sa ugnayang bunga o kinahinatnan.
- source_word: דְּבָרַי
  choice: ang mga salita ko
  rationale: Tuwirang salin na pinananatili ang pangmaramihang anyo.
- source_word: לָעוּ
  choice: naging padalus-dalos
  rationale: Mahirap at hindi tiyak ang pandiwa. Ipinahahayag ng pagpiling ito ang pananalitang hindi napigil o napag-isipan, habang inilalahad sa talababa ang ibang posibleng diwa.
