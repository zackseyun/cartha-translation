  text: which are dark from ice[a], and on them the snow conceals itself.
translation:
  language: tl
  text: na dumidilim dahil sa yelo[a], at sa ibabaw ng mga iyon ay nagkukubli ang niyebe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “na lumalabo dahil sa yelo.” Ang salitang Hebreo ay pangunahing nangangahulugang “madilim” o “nagdidilim,” ngunit sa konteksto ay maaari ring maglarawan ng tubig na naging malabo dahil sa kalagayan ng taglamig.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקֹּדְרִים
  choice: na nangingitim
  rationale: Ang participle mula sa קדר ay tumutukoy sa pagdidilim o pagiging madilim. Pinananatili ng “nangingitim” ang pangunahing larawang biswal at ang aspektong nagpapatuloy, nang hindi agad ipinakahulugang malabo o maputik ang tubig.
- source_word: מִנִּי
  choice: dahil sa
  rationale: Maaaring magpahiwatig ang pang-ukol ng pinagmulan o sanhi; sa konteksto, likas sa Tagalog ang “dahil sa” upang ipahayag na yelo ang sanhi ng pag-itim.
- source_word: קָרַח
  choice: yelo
  rationale: Ang salita ay maaaring tumukoy sa yelo o hamog na nagyelo. Ang “yelo” ang mas tuwirang katumbas at kaagapay ng kasunod na larawan ng niyebe.
- source_word: עָלֵימוֹ
  choice: sa ibabaw ng mga iyon
  rationale: Pinananatili nito ang lokatibong kahulugan ng pang-ukol at ang pangmaramihang reperensiya sa mga batis o agusang-tubig na binabanggit sa konteksto.
- source_word: יִתְעַלֶּם
  choice: nagkukubli
  rationale: Ang hitpael ng עלם ay may refleksibong diwang ‘nagkukubli’ o ‘itinatago ang sarili.’ Natural at makata sa Tagalog ang “nagkukubli,” at hindi nito ginagawang tahasang pasibo ang pandiwa.
- source_word: שָׁלֶג
  choice: ang niyebe
  rationale: Ang “niyebe” ang karaniwang modernong salin ng snow; ang pantukoy na “ang” ay likas sa pangungusap at tumutukoy sa niyebeng nasa tagpong inilalarawan.
theological_decisions: []
translation_notes:
  register: Makabagong Filipino na may dignidad at bahagyang makatang himig. Ginamit ang “nangingitim” upang panatilihin ang pangunahing leksikal na larawan, at “nagkukubli” upang mapanatili ang refleksibong anyo ng pandiwang Hebreo.
