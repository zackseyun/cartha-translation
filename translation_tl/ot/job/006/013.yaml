  source_fidelity: 'Napananatili ng draft ang retorikal na tanong, ang panloob na diwa ng בִי, at ang pasibong larawan ng נִדְּחָה. Gayunman, ang “na naitaboy na ba sa akin” ay may maling direksiyon: ang מִמֶּנִּי ay “mula sa akin/palayo sa akin,” hindi “sa akin.”'
