lexical_decisions:
- source_word: הַאִם אֵין
  choice: Wala nga ba
  rationale: Ipinananatili ang anyong retorikal na tanong at ang negatibong diwa nang hindi dinaragdagan ang tindi nito.
- source_word: עֶזְרָתִי בִי
  choice: sa loob ko ang sarili kong tulong
  rationale: Tuwirang pinananatili ang ‘aking tulong’ at ang lokatibong diwa ng בִי, habang ginagawang malinaw sa Tagalog na panloob na kakayahan o mapagkukunan ang tinutukoy.
- source_word: וְתֻשִׁיָּה
  choice: mahusay na karunungan
  rationale: Ipinahihiwatig nito ang matino at mabisang karunungan, ngunit inilalagay sa talababa ang leksikal na posibilidad ng praktikal na kakayahan o pagiging maparaan.
- source_word: נִדְּחָה מִמֶּנִּי
  choice: naitaboy na ba sa akin
  rationale: Pinananatili ang pasibong larawan ng isang bagay na itinaboy o inilayo mula kay Job, gayundin ang pagpapatuloy ng tanong.
