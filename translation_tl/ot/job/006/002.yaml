  source_fidelity: Tumpak ang pangunahing larawan ng marubdob na paghiling, ang masidhing ‘pagtimbang,’ at ang magkasamang paglalagay ng dalamhati/pagkabagabag at kapahamakan sa timbangan. Gayunman, ang ‘Kung maaari lamang na timbangin’ ay hindi ganap na likas at medyo lumalabo ang pasibong/optatibong diwa ng Hebreo.
  naturalness: Mas natural at patula sa modernong Filipino ang ‘Kung matimbang lamang nang lubos’ at ‘sabay na mailagay sa timbangan.’ Iniiwasan nito ang malabong walang-tiyak na aktibong ‘timbangin’ at ang bahagyang mabigat na ‘kasabay nitong ilagay.’
