lexical_decisions:
- source_word: לוּ
  choice: Kung maaari lamang
  rationale: Ipinahahayag ang isang marubdob at panaghoy na paghiling; natural ito sa makabagong Filipino.
- source_word: שָׁקוֹל יִשָּׁקֵל
  choice: timbangin nang lubos
  rationale: Ipinakikita ng infinitive absolute na kasunod ng pandiwa ang diin o kasidhian ng pagtimbang.
- source_word: כַּעְשִׂי
  choice: aking dalamhati
  rationale: Maaaring tumukoy ang salita sa panloob na hirap, pagkainis, o galit. Sa panaghoy ni Job, ang “dalamhati” ay likas at marangal ngunit hindi lubusang nag-aalis sa mas malawak na saklaw nito, kaya may talababa.
- source_word: וְהַוָּתִי
  choice: aking kapahamakan
  rationale: Tumutukoy sa sakuna, pagkawasak, o kapinsalaang dinanas; pinananatili nito ang panlabas at obhetibong aspekto ng paghihirap ni Job.
- source_word: בְּמֹאזְנַיִם
  choice: sa timbangan
  rationale: Ang dual na anyo ay tumutukoy sa kasangkapang panimbang; “sa timbangan” ang natural na katumbas sa Filipino.
- source_word: יִשְׂאוּ
  choice: ilagay
  rationale: Literal na “buhatin/dalhin”; sa konteksto ng pagtimbang, likas sa Filipino ang “ilagay sa timbangan,” habang ang di-tiyak na maramihang tagaganap ay hindi tahasang ipinapahayag.
- source_word: יָחַד
  choice: kasabay nito
  rationale: Ipinakikitang magkasamang tinitimbang ang dalamhati at kapahamakan, habang pinananatili ang maayos na daloy sa Filipino.
