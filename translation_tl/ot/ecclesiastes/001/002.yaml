  text: הֲבֵ֤ל הֲבָלִים֙ אָמַ֣ר קֹהֶ֔לֶת הֲבֵ֥ל הֲבָלִ֖ים הַ/כֹּ֥ל הָֽבֶל׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/001/002.yaml
  text: Breath of breaths[a], says Qoheleth[b]; breath of breaths, all is mere breath.
translation:
  language: tl
  text: Hininga ng mga hininga[a], sabi ni Qohelet[b]; hininga ng mga hininga, ang lahat ay hininga lamang.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֶבֶל (hevel)
  choice: hininga / hininga lamang
  rationale: Literal itong tumutukoy sa hininga o singaw at ginagamit na larawan para sa bagay na panandalian, hindi mahawakan, at salungat sa inaasahan. Pinananatili ng “hininga” ang kongkretong larawan at ang lawak ng pahiwatig; sa huling sugnay, ipinahahayag ng “lamang” ang mapagpababang diin ng hatol nang hindi ito ginagawang tahasang nihilistiko.
- source_word: הֲבֵל הֲבָלִים
  choice: hininga ng mga hininga
  rationale: Pinananatili nito ang Hebreong hulma ng sukdulang paghahambing na “X ng mga X,” gaya ng “Awit ng mga Awit,” sa halip na palitan agad ng isang abstraktong paliwanag.
- source_word: אָמַר
  choice: sabi
  rationale: Natural na pormula ito sa makabagong Filipino para sa panitikang pahayag. Hindi nito ipinipilit na ang sinabi ay minsanan lamang sa nakaraan.
- source_word: קֹהֶלֶת
  choice: Qohelet
  rationale: Isinalin sa baybay-Latin ang Hebreong katawagan upang hindi paliitin ang kahulugan nito sa “Guro” o “Mangangaral.”
- source_word: הַכֹּל
  choice: ang lahat
  rationale: Malawak at sumasaklaw ang Hebreong parirala; likas sa Filipino ang “ang lahat” at pinananatili nito ang kabuuang saklaw.
theological_decisions:
- issue: Pagsasalin sa pangunahing motif na הֶבֶל
  choice: Panatilihin ang larawang “hininga,” kalakip ang “lamang” sa panaguring huling sugnay.
  alternative: kawalang-kabuluhan; walang saysay; walang kabuluhan; singaw; panandalian
  rationale: Ang mga abstraktong salin ay pumipili lamang ng isang aspekto at maaaring magpasok ng nihilismong hindi tahasang iginiit ng teksto. Ang “hininga” ay sabay na nagmumungkahi ng paglipas, kawalan ng kakayahang mahawakan, at pagkabigo ng inaasahan.
- issue: Pagpapakahulugan sa titulong קֹהֶלֶת
  choice: Qohelet
  alternative: ang Guro; ang Mangangaral; ang Tagapagtipon
  rationale: Hindi tiyak na naipapaloob ng alinmang katumbas ang buong saklaw ng katawagang Hebreo, kaya pinananatili ang pangalan/titulo sa transliterasyon.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Pinanatili ang matindi at patulang pag-uulit ng Hebreo. Ginamit ang “Qohelet” bilang transliterasyong madaling basahin sa Filipino, at ang tandang padamdam sa ikalawang pag-uulit upang likas na maihatid ang diin nang hindi nagdaragdag ng bagong proposisyon.
