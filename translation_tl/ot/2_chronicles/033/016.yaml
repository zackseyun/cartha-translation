  source_fidelity: Tumpak na naipapahayag ng salin ang muling pagsasaayos ng altar, ang paghahandog dito ng mga handog na pangkapayapaan at pasasalamat, at ang pagsasabi ni Manases sa Juda na maglingkod kay Yahweh. Hindi nito pinalalakas ang וַיֹּאמֶר bilang isang tahasang utos, at ang saklaw ng לַעֲבֹד ay wastong pinananatiling mas malawak kaysa pagsamba lamang.
