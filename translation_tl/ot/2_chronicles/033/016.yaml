  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: ו/יכן אֶת מִזְבַּ֣ח יְהוָ֔ה וַ/יִּזְבַּ֣ח עָלָ֔י/ו זִבְחֵ֥י שְׁלָמִ֖ים וְ/תוֹדָ֑ה וַ/יֹּ֨אמֶר֙ לִֽ/יהוּדָ֔ה לַ/עֲב֕וֹד אֶת יְהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/016.yaml
  text: Then he restored the altar of Yahweh and sacrificed on it sacrifices of peace offerings and thanksgiving[a], and he told Judah to serve Yahweh[b], the God of Israel.
translation:
  language: tl
  text: Pagkatapos, isinaayos niyang muli ang altar ni Yahweh at naghandog doon ng mga handog para sa kapayapaan[a] at mga handog ng pasasalamat.[b] Sinabihan niya ang Juda na maglingkod[c] kay Yahweh, ang Diyos ng Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga handog para sa pakikipag-isa.”
    reason: lexical_alternative
  - marker: b
    text: Literal na “at pasasalamat”; sa kontekstong ito, tumutukoy ito sa mga handog ng pasasalamat.
    reason: lexical_clarification
  - marker: c
    text: Maaari ring “sumamba,” ngunit mas malawak ang salitang Hebreo at saklaw nito ang paglilingkod sa Diyos.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְכֵן
  choice: isinaayos niyang muli
  rationale: Ang Hiphil ng כון ay maaaring mangahulugang ihanda, itatag, o ilagay sa wastong ayos. Dahil nilinis at ibinalik ni Manases ang pagsamba kay Yahweh sa konteksto, malinaw na ipinahihiwatig rito ang muling pagsasaayos ng altar.
- source_word: מִזְבַּח יְהוָה
  choice: ang altar ni Yahweh
  rationale: Natural na salin sa modernong Tagalog ng pariralang construct, habang tuwirang pinananatili ang banal na pangalang YHWH bilang Yahweh.
- source_word: וַיִּזְבַּח עָלָיו
  choice: naghandog doon
  rationale: Ipinahahayag ng זבח ang paghahandog ng hain. Ang 'doon' ay natural na tumutukoy sa altar nang hindi kailangang ulitin ito.
- source_word: זִבְחֵי שְׁלָמִים
  choice: mga handog para sa kapayapaan
  rationale: Pinananatili nito ang kategoryang sakripisyal ng שְׁלָמִים at ang kaugnayan nito sa kapayapaan o kabuuan, nang hindi ipinipilit ang mas interpretibong 'handog para sa pakikipag-isa.'
- source_word: וְתוֹדָה
  choice: mga handog ng pasasalamat
  rationale: Bagaman literal na maaaring 'pasasalamat,' hinihingi ng kontekstong sakripisyal ang malinaw na pagtukoy sa mga handog ng pasasalamat.
- source_word: וַיֹּאמֶר לִיהוּדָה
  choice: Sinabihan niya ang Juda
  rationale: Mas natural ito kaysa sa literal na 'sinabi niya sa Juda' at hindi nito pinatitindi ang pandiwa bilang tahasang 'inutusan.' Pinananatili ang Juda bilang kolektibong katawagan.
- source_word: לַעֲבוֹד
  choice: na maglingkod
  rationale: Mas malawak ang עבד kaysa 'sumamba' lamang; saklaw nito ang tapat na paglilingkod sa Diyos, kabilang ang pagsamba.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ang Diyos ng Israel
  rationale: Tuwiran at karaniwang salin ng construct phrase na nagpapanatili sa tipanang pagkakakilanlan ng Diyos.
theological_decisions:
- issue: Paglalarawan sa זִבְחֵי שְׁלָמִים
  choice: mga handog para sa kapayapaan
  alternative: mga handog para sa pakikipag-isa
  rationale: Ang terminong Hebreo ay may saklaw na nauugnay sa kapayapaan, kabuuan, at pakikisalo. Pinili ang mas malapit na 'kapayapaan' at inilagay sa talababa ang lehitimong alternatibo.
- issue: Saklaw ng לַעֲבוֹד kaugnay ng Diyos
  choice: maglingkod
  alternative: sumamba
  rationale: Maaaring kabilang sa paglilingkod kay Yahweh ang pagsamba, ngunit hindi dapat paliitin ang pandiwa sa gawaing panrelihiyon lamang.
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Pinananatili ang personal at tipanang pangalan sa tekstong Hebreo sa halip na palitan ito ng isang titulo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “altar,” “handog,” at “pasasalamat” bilang mga salitang madaling maunawaan ngunit angkop sa kontekstong panrelihiyon. Hindi ginawang “inutusan” ang וַיֹּאמֶר upang hindi dagdagan ang lakas ng orihinal na pandiwa.
