revisions:
- from: Ang kanyang panalangin at kung paano siya dininig, ang lahat ng kanyang kasalanan at kawalang-katapatan, at ang mga lugar na pinagtayuan niya ng mga dambana sa matataas na lugar at pinaglagyan ng mga Asherim[a] at mga inukit na larawan bago siya nagpakumbaba—narito, nakasulat ang mga iyon sa mga tala ng mga tagakita.[b]
  to: Ang kanyang panalangin, kung paano siya namanhik sa Diyos, ang lahat ng kanyang kasalanan at kawalang-katapatan, at ang mga lugar na pinagtayuan niya ng mga dambana sa matataas na lugar at pinaglagyan ng mga Asherim[a] at mga imaheng inukit bago siya nagpakumbaba—narito, nakasulat ang mga iyon sa mga tala ng mga tagakita.[b]
  rationale: Pinalitan ang “kung paano siya dininig” ng “kung paano siya namanhik sa Diyos” upang maitama ang direksiyon ng pagsusumamo sa Hebreo at maging malinaw sa Tagalog ang dating hindi naipapakitang tinutukoy ng panghalip. Ang pagbanggit sa Diyos ay paglilinaw ng antecedent na nasa agarang konteksto, hindi dagdag na doktrina. Pinalitan din ang “mga inukit na larawan” ng mas natural na “mga imaheng inukit,” nang pinananatili ang kongkretong kahulugan ng פְּסִילִים. Nanatili ang mga talababa at ang kanilang mga anchor.
