base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/019.yaml
  text: And his prayer[a], and how he was entreated, and all his sin and his unfaithfulness, and the places where he built high places and set up the Asherim and the carved images before he humbled himself—behold[b], they are written in the records of the seers.
translation:
  language: tl
  text: Ang kanyang panalangin, kung paano siya namanhik sa Diyos, ang lahat ng kanyang kasalanan at kawalang-katapatan, at ang mga lugar na pinagtayuan niya ng mga dambana sa matataas na lugar at pinaglagyan ng mga Asherim[a] at mga imaheng inukit bago siya nagpakumbaba—narito, nakasulat ang mga iyon sa mga tala ng mga tagakita.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga poste ni Ashera.” Maaaring tumukoy ang salitang Hebreo sa mga bagay na panritwal na kaugnay ni Ashera.
    reason: lexical_alternative
  - marker: b
    text: O “sa mga tala ni Hozai.” Maaaring pangalang pantangi ang huling salitang Hebreo sa halip na mangahulugang “mga tagakita.”
    reason: alternative_reading
lexical_decisions:
- source_word: תְפִלָּתוֹ
  choice: kanyang panalangin
  rationale: Ang “panalangin” ang natural at malawak na katumbas ng תְּפִלָּה sa modernong Tagalog.
- source_word: הֵעָתֶר לוֹ
  choice: kung paano siya dininig
  rationale: Ipinapahayag nito ang mabuting pagtugon sa kanyang panalangin sa natural na Tagalog, habang hindi tahasang nagdaragdag ng simuno na wala sa sugnay na Hebreo.
- source_word: כָל חַטָּאתוֹ
  choice: lahat ng kanyang kasalanan
  rationale: Pinananatili ang kolektibong isahan ng Hebreo at malinaw na tumutukoy sa kabuuan ng kanyang kasalanan.
- source_word: מַעְלוֹ
  choice: kanyang kawalang-katapatan
  rationale: Naipapahiwatig ang paglabag sa katapatan, kabilang ang posibleng pakahulugang pangtipan, nang hindi gumagamit ng labis na teknikal na salita.
- source_word: בָּמוֹת
  choice: mga dambana sa matataas na lugar
  rationale: Mas malinaw ito sa karaniwang mambabasang Tagalog kaysa sa literal na “matataas na lugar,” at ipinakikita ang panrelihiyong gamit ng mga lugar na tinutukoy.
- source_word: הָאֲשֵׁרִים
  choice: mga Asherim
  rationale: Pinananatili ng transliterasyon ang hindi tiyak na anyo ng mga kultikong bagay na kaugnay ni Ashera; ipinaliliwanag sa talababa ang karaniwang alternatibo.
- source_word: הַפְּסִלִים
  choice: mga inukit na larawan
  rationale: Pinananatili ang kongkretong diwa ng mga larawang inukit, sa halip na tukuyin lamang ang gamit ng mga ito bilang mga diyus-diyosan.
- source_word: לִפְנֵי הִכָּנְעוֹ
  choice: bago siya nagpakumbaba
  rationale: Natural na inilalarawan ang reflexive o intransitive na diwa at ang pagbabagong binibigyang-diin sa salaysay.
- source_word: הִנָּם כְּתוּבִים
  choice: narito, nakasulat ang mga iyon
  rationale: Pinananatili ng “narito” ang presentatibo at pampanitikang diin ng Hebreo, habang nananatiling malinaw sa modernong Tagalog.
- source_word: עַל דִּבְרֵי חוֹזָי
  choice: sa mga tala ng mga tagakita
  rationale: Ang “mga tala” ay natural sa konteksto ng nakasulat na sanggunian; ang חוֹזָי ay maaaring unawain bilang tumutukoy sa mga tagakita, habang pinananatili sa talababa ang posibilidad na pangalang pantangi ito.
theological_decisions:
- issue: Ang kalikasan ng pagpapakumbaba ni Manases sa הִכָּנְעוֹ
  choice: bago siya nagpakumbaba
  alternative: bago siya ibinaba o pinakumbaba
  rationale: Likas na sinusuportahan ng anyong Hebreo ang reflexive o intransitive na pagbasa. Pinananatili nito ang diin sa ginawa ni Manases nang hindi nagdaragdag ng mas buo o denominasyonal na paliwanag tungkol sa kanyang pagsisisi.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw ngunit marangal ang himig. Ginamit ang “mga dambana sa matataas na lugar” upang maipaliwanag ang kultikong gamit ng בָּמוֹת, samantalang pinanatili ang “Asherim” upang hindi labis na tukuyin ang pisikal na anyo ng mga bagay. Inilipat ang marker [a] sa “Asherim,” na siyang aktuwal na tinutukoy ng talababa.
