  text: וַ/יַּכּוּ֙ עַם הָ/אָ֔רֶץ אֵ֥ת כָּל הַ/קֹּֽשְׁרִ֖ים עַל הַ/מֶּ֣לֶךְ אָמ֑וֹן וַ/יַּמְלִ֧יכוּ עַם הָ/אָ֛רֶץ אֶת יֹאשִׁיָּ֥הוּ בְנ֖/וֹ תַּחְתָּֽי/ו־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/025.yaml
  text: But the people of the land struck down all those who had conspired against King Amon[b][a], and the people of the land made Josiah his son king in his place.
translation:
  language: tl
  text: Ngunit pinatay ng mga mamamayan ng lupain[a] ang lahat ng nagsabwatan laban kay Haring Amon, at ginawa nilang hari ang anak niyang si Josias bilang kapalit niya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “mga mamamayan ng lupain” ay isang katawagang Hebreo para sa mga mamamayan ng bansa at maaaring may pahiwatig na panlipunan o pampolitika.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּכּוּ
  choice: pinatay
  rationale: Sa kontekstong ito, ang נכה ay tumutukoy sa marahas at nakamamatay na pagganti sa mga nagsabwatan; malinaw at natural sa Filipino ang “pinatay.”
- source_word: עַם הָאָרֶץ
  choice: mga mamamayan ng lupain
  rationale: Pinananatili nito ang anyo ng Hebreong katawagan nang hindi tiyak na ipinapakahulugang “karaniwang tao,” sapagkat maaaring may sosyo-politikal na pahiwatig ang parirala.
- source_word: כָּל הַקֹּשְׁרִים
  choice: lahat ng nagsabwatan
  rationale: Natural nitong ipinahahayag ang participle ng קשר bilang mga taong magkakasamang bumuo ng sabuwatan.
- source_word: עַל הַמֶּלֶךְ אָמוֹן
  choice: laban kay Haring Amon
  rationale: Sa konstruksyong קשר עַל, malinaw na ang sabuwatan ay nakatuon laban sa hari.
- source_word: וַיַּמְלִיכוּ
  choice: ginawa nilang hari
  rationale: Tumpak nitong ipinahahayag ang Hifil ng מלך nang hindi nagdaragdag ng seremonya ng koronasyon na wala sa Hebreo.
- source_word: יֹאשִׁיָּהוּ בְנוֹ
  choice: ang anak niyang si Josias
  rationale: Malinaw at likas sa Filipino ang pagkakakilanlan kay Josias bilang anak ni Amon.
- source_word: תַּחְתָּיו
  choice: bilang kapalit niya
  rationale: Ipinahahayag nito ang paghalili ni Josias sa posisyon ni Amon.
- source_word: וַ
  choice: Ngunit
  rationale: Bagaman karaniwang nag-uugnay lamang sa salaysay ang waw, ang “Ngunit” ay angkop sa pagsalungat sa naunang pagpatay ng mga lingkod ni Amon at sa pagganti rito ng mga mamamayan.
theological_decisions: []
translation_notes:
  register: Makabagong Filipino na marangal at madaling maunawaan. Ginamit ang “Josias,” ang nakaugaliang anyong Filipino ng pangalang Josiah. Ang marker na [a] ay inilagay kaagad pagkatapos ng pariralang ipinapaliwanag.
