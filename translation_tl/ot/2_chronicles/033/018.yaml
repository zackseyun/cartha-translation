base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/018.yaml
  text: The rest of the acts of Manasseh[a], and his prayer to his God, and the words of the seers who spoke to him in the name of Yahweh, the God of Israel—behold, they are written among the records of the kings of Israel.
translation:
  language: tl
  text: Ang iba pang mga ginawa ni Manases, ang panalangin niya sa kanyang Diyos, at ang mga salita ng mga tagakita na nagsalita sa kanya sa pangalan ni Yahweh, ang Diyos ng Israel—ang mga iyon ay nakasulat sa mga tala ng mga hari ng Israel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin ang hulihang parirala na “sa aklat” o “sa mga taunang tala ng mga hari ng Israel.” Tumutukoy ang pormulang Hebreo sa isang nakasulat na talaang maharlika.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֶתֶר דִּבְרֵי מְנַשֶּׁה
  choice: ang iba pang mga ginawa ni Manases
  rationale: Sa pormulang pangkasaysayan ng Mga Cronica, ang דִּבְרֵי ay tumutukoy sa mga ginawa o pangyayari sa paghahari, hindi lamang sa mga salitang binigkas. Natural sa modernong Tagalog ang “iba pang mga ginawa.”
- source_word: תְפִלָּתוֹ אֶל אֱלֹהָיו
  choice: ang panalangin niya sa kanyang Diyos
  rationale: Pinananatili ang mga panandang paari at ang tuwirang diwa ng אֶל bilang “sa.”
- source_word: הַחֹזִים
  choice: mga tagakita
  rationale: Pinananatili ang tiyak na katawagang propetiko na חֹזֶה sa halip na ipantay ito sa mas pangkalahatang “mga propeta.”
- source_word: הַמְדַבְּרִים אֵלָיו
  choice: na nagsalita sa kanya
  rationale: Ang participle ay natural na isinalin bilang sugnay na naglalarawan sa nagdaang pagsasalita ng mga tagakita kay Manases.
- source_word: בְּשֵׁם יְהוָה
  choice: sa pangalan ni Yahweh
  rationale: Tuwirang pinananatili ang pormulang nagpapahiwatig ng pagsasalita bilang kinatawan at may awtoridad ni Yahweh.
- source_word: הִנָּם
  choice: ang mga iyon ay
  rationale: Ang “mga iyon” ay may pansin-itinurong puwersa ng הִנָּם nang hindi gumagamit ng lipas o mabigat na “narito.”
- source_word: עַל דִּבְרֵי מַלְכֵי יִשְׂרָאֵל
  choice: nakasulat sa mga tala ng mga hari ng Israel
  rationale: Ipinahihiwatig ng pormula ang pagkakatala sa isang nakasulat na sangguniang maharlika; nilinaw ito sa natural na Tagalog bilang “nakasulat sa mga tala.”
theological_decisions:
- issue: Pagbibigay ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehovah
  rationale: Ginagamit ng Hebreo ang Tetragrammaton; pinananatili ang personal na pangalang “Yahweh” sa halip na palitan ito ng isang titulo.
- issue: Pagkakakilanlan ng “mga hari ng Israel” sa sangguniang tala
  choice: mga hari ng Israel
  alternative: mga hari ng Juda
  rationale: Bagaman si Manases ay hari ng Juda, tahasang “Israel” ang nasa tekstong Masoretiko; hindi ito iniayon o pinalitan ng “Juda.”
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “tagakita” upang mapanatili ang natatanging katawagang propetiko, at iniwasan ang labis na arkaikong pananalita.
