  text: וַ/יִּ֥בֶן מִזְבְּח֖וֹת לְ/כָל צְבָ֣א הַ/שָּׁמָ֑יִם בִּ/שְׁתֵּ֖י חַצְר֥וֹת בֵּית יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/005.yaml
  text: He built altars for all the host of heaven in the two courts of the house of Yahweh[a].
translation:
  language: tl
  text: Nagtayo siya ng mga altar para sa buong hukbo ng langit[a] sa dalawang looban ng bahay ni Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “buong hukbong makalangit.” Ang ekspresyong Hebreo ay tumutukoy sa mga bagay o kapangyarihan sa kalangitan na sinasamba sa relihiyong nakasentro sa mga bituin at iba pang bagay sa langit.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶן
  choice: Nagtayo siya
  rationale: Ang Qal wayyiqtol ng בנה ay nagsasalaysay ng natapos na kilos ni Manases. Likas sa modernong Tagalog ang aspektong perpektibo na “nagtayo”; hindi na kailangang mekanikal na isalin ang waw bilang “at.”
- source_word: מִזְבְּחוֹת
  choice: mga altar
  rationale: Karaniwang katawagan ang מזבח para sa altar na pinaghahandugan o pinagsusunugan ng insenso; malinaw at natural sa Filipino ang “mga altar.”
- source_word: לְכָל צְבָא הַשָּׁמַיִם
  choice: para sa buong hukbo ng langit
  rationale: Pinananatili ng “hukbo ng langit” ang larawang Hebreo at ang posibleng pagtukoy sa mga bagay o kapangyarihang makalangit na sinasamba sa astral na relihiyon. Ang לְ ay likas na “para sa” sa konteksto ng pagtatayo ng mga altar bilang parangal o pagsamba.
- source_word: בִּשְׁתֵּי חַצְרוֹת
  choice: sa dalawang looban
  rationale: Tiyak na dalawang court area ang tinutukoy. Ang “looban” ay natural na katawagan sa bakuran o court sa loob ng kompleks ng templo.
- source_word: בֵּית יְהוָה
  choice: bahay ni Yahweh
  rationale: Malapit ito sa literal na בית יהוה at hindi agad pinapalitan ng interpretatibong “templo,” bagaman iyon ang tinutukoy. Inilalahad ang banal na pangalan bilang “Yahweh.”
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Tuwirang ginagamit ng tekstong Hebreo ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalang tipan sa halip na palitan ito ng isang titulo.
- issue: Pagkakakilanlan ng צְבָא הַשָּׁמַיִם
  choice: hukbo ng langit
  alternative: mga bagay sa kalangitan; hukbong makalangit
  rationale: Hindi tahasang nililista ng Hebreo kung mga bituin, planetang katawan, o makalangit na kapangyarihan ang saklaw. Pinananatili ng salin ang tunay na lawak at tensiyon ng idyoma, habang nililinaw ng talababa ang kontekstong astral na pagsamba.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “altar” at “looban” bilang pamilyar at natural na mga terminong pangkultura at pang-arkitektura; pinanatili ang idyomang “hukbo ng langit” upang huwag paliitin ang saklaw ng Hebreo.
