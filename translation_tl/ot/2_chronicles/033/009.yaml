  naturalness: Marangal at madaling maunawaan ang pangungusap. Mas natural sa modernong Filipino ang “gumawa sila ng higit na kasamaan.” Dapat ding idikit ang talababa sa “mga anak ni Israel,” ang pariralang aktuwal nitong nililinaw.
  terminology: Ang “Manases,” “Juda,” “Jerusalem,” at “Yahweh” ay angkop at pare-pareho. Ang “mga anak ni Israel” ay ligtas na malapit sa Hebreo, at ang mga alternatibo sa talababa ay kapaki-pakinabang.
