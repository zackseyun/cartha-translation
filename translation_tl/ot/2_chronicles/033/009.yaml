  text: וַ/יֶּ֣תַע מְנַשֶּׁ֔ה אֶת יְהוּדָ֖ה וְ/יֹשְׁבֵ֣י יְרוּשָׁלִָ֑ם לַ/עֲשׂ֣וֹת רָ֔ע מִן הַ֨/גּוֹיִ֔ם אֲשֶׁר֙ הִשְׁמִ֣יד יְהוָ֔ה מִ/פְּנֵ֖י בְּנֵ֥י יִשְׂרָאֵֽל־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/009.yaml
  text: So Manasseh led Judah and the inhabitants of Jerusalem astray[a], to do more evil than the nations whom Yahweh had destroyed before the sons of Israel.
translation:
  language: tl
  text: Iniligaw ni Manases ang Juda at ang mga naninirahan sa Jerusalem upang gumawa sila ng higit na kasamaan kaysa sa mga bansang nilipol ni Yahweh sa harap ng mga anak ni Israel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “mga Israelita” o “sambayanang Israel.” Sa Hebreo: “mga anak ni Israel.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּתַע
  choice: Iniligaw
  rationale: Ipinapahayag ng Hiphil ng תעה ang pagsasanhing maligaw ang iba. Ang “iniligaw” ay likas sa modernong Tagalog at nagpapanatili sa diwang sanhi.
- source_word: יְהוּדָה וְיֹשְׁבֵי יְרוּשָׁלִָם
  choice: ang Juda at ang mga naninirahan sa Jerusalem
  rationale: 'Pinananatiling malinaw ang dalawang kolektibong layon: ang Juda at, lalo na, ang mga naninirahan sa Jerusalem.'
- source_word: לַעֲשׂוֹת רָע
  choice: upang gumawa sila ng higit na masama
  rationale: Ang “upang gumawa” ay tumutugma sa infinitibong Hebreo, at ginagawang lantad ng “sila” ang likas na paksa sa Tagalog. Isinama sa parirala ang paghahambing na ipinahihiwatig ng מִן.
- source_word: מִן הַגּוֹיִם
  choice: kaysa sa mga bansa
  rationale: Ginagamit dito ang מִן bilang pananda ng paghahambing; natural itong ipinahahayag sa Tagalog sa pamamagitan ng “kaysa sa.”
- source_word: הַגּוֹיִם
  choice: mga bansa
  rationale: Tumutukoy ito sa mga bansang nauna sa Israel sa lupain, hindi sa teknikal o mas huling katawagang “mga Hentil.”
- source_word: אֲשֶׁר הִשְׁמִיד יְהוָה
  choice: na nilipol ni Yahweh
  rationale: Ang “nilipol” ay nagpapanatili sa lakas ng causative verb השמיד at malinaw na iniuugnay ang sugnay sa mga bansa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang transliterasyon ng personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
- source_word: מִפְּנֵי
  choice: sa harap ng
  rationale: Pinananatili nito ang idyomang Hebreo sa konteksto ng paglipol o pagpapaalis sa mga bansa mula sa harap ng Israel nang hindi nagdaragdag ng kilos na hindi tahasang nasa teksto.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Malapit ito sa literal na anyong “mga anak ni Israel” at pinananatili ang tradisyonal at korporatibong pahayag; inilalahad sa talababa ang mas idyomatikong mga katumbas.
theological_decisions:
- issue: Pagbibigay-kahulugan sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; ang PANGINOON
  rationale: Pinananatili ang personal na pangalang tipan sa pamamagitan ng karaniwang akademikong transliterasyong “Yahweh,” sa halip na palitan ito ng titulo.
- issue: Korporatibong pahayag na בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  alternative: mga Israelita; sambayanang Israel
  rationale: Pinananatili ang kongkretong anyo ng Hebreo at ang korporatibong diwa nito, habang kinikilala sa talababa ang mga likas na kolektibong salin.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinili ang “mga naninirahan” sa halip na mas pormal na “mga nananahan,” at pinanatili ang maikli at matinding “nilipol.” Inilipat ang marker [a] sa pariralang aktuwal na nililinaw ng talababa.
