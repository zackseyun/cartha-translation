- from: Iniligaw ni Manases ang Juda at ang mga naninirahan sa Jerusalem upang gumawa sila ng higit na masama kaysa sa mga bansang nilipol ni Yahweh sa harap ng mga anak ni Israel.[a]
  to: Iniligaw ni Manases ang Juda at ang mga naninirahan sa Jerusalem upang gumawa sila ng higit na kasamaan kaysa sa mga bansang nilipol ni Yahweh sa harap ng mga anak ni Israel.[a]
  rationale: Pinalitan ang bahagyang di-likas na “higit na masama” ng “higit na kasamaan” upang maging malinaw at natural ang layon ng “gumawa,” nang hindi binabago ang comparative na diwa. Inilagay ang marker sa mismong pariralang “mga anak ni Israel,” na siyang paksa ng talababa.
