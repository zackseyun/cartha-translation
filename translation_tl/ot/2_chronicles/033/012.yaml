  text: And when he was in distress[b][a], he sought the favor of Yahweh his God and humbled himself greatly before the God of his fathers.
translation:
  language: tl
  text: Sa kanyang kagipitan, hiningi niya ang lingap[a] ni Yahweh na kanyang Diyos, at lubos siyang nagpakumbaba sa harap ng Diyos ng kanyang mga ama[b].
  philosophy: optimal-equivalence
  footnotes:
