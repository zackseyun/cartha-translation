    text: 'Maaari ring isalin na “nagmakaawa siya kay Yahweh na kanyang Diyos” o “taimtim siyang nakiusap kay Yahweh na kanyang Diyos.” Literal na idyoma sa Hebreo: “pinalambot o sinuyo ang mukha ng.”'
    reason: lexical_alternative
  - marker: b
    text: 'Literal sa Hebreo: “Diyos ng kanyang mga ama.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְהָצֵר לוֹ
  choice: Sa kanyang kagipitan
  rationale: Ipinahahayag ng parirala ang kalagayan at panahon ng pagkilos ni Manases. Likas sa modernong Filipino ang “sa kanyang kagipitan” at pinananatili nito ang diwa ng matinding paghihirap o pagkabalisa.
- source_word: חִלָּה אֶת־פְּנֵי
  choice: hiningi niya ang lingap
  rationale: Ang idyomang Hebreo ay tumutukoy sa taimtim na paghingi ng pabor o mabuting pagtanggap. Ang “hiningi niya ang lingap” ay malinaw at natural, habang hindi nito nililimitahan ang kilos sa isang tiyak na anyo ng panalangin.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang transliterasyon ng personal na pangalang banal sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהָיו
  choice: kanyang Diyos
  rationale: Tuwirang ipinapahayag ng hulaping panghalip ang kaugnayang “kanyang Diyos.”
- source_word: וַיִּכָּנַע
  choice: nagpakumbaba
  rationale: Sa konteksto, ang Niphal ng כנע ay likas unawain bilang kusang pagpapakumbaba ni Manases, bagaman maaari rin itong ilarawan bilang pagiging mapagpakumbaba o pagpapasakop.
- source_word: מְאֹד
  choice: lubos
  rationale: Pinananatili ng “lubos” ang matinding antas na ipinahahayag ng מְאֹד at natural itong kasama ng “nagpakumbaba.”
- source_word: מִלִּפְנֵי
  choice: sa harap ng
  rationale: Ito ang malinaw at karaniwang katumbas ng idyomang nangangahulugang nasa presensiya ng isang tao.
- source_word: אֱלֹהֵי אֲבֹתָיו
  choice: Diyos ng kanyang mga ninuno
  rationale: Ang “mga ninuno” ang natural na katawagan sa Filipino para sa mga naunang ama ng angkan; ipinapaliwanag sa talababa ang literal na panlalaking anyo ng Hebreo.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehova
  rationale: Personal na pangalan ang nasa tekstong Hebreo, kaya pinanatili ito bilang “Yahweh” sa halip na palitan ng titulo.
- issue: Paglalarawan sa Diyos bilang אֱלֹהֵי אֲבֹתָיו
  choice: Diyos ng kanyang mga ninuno
  alternative: Diyos ng kanyang mga ama
  rationale: Mas natural at malinaw sa modernong Filipino ang “mga ninuno,” samantalang ang talababa ay nagpapanatili sa kaalaman na literal na “mga ama” ang anyong Hebreo.
- issue: Diwa ng Niphal na וַיִּכָּנַע
  choice: nagpakumbaba
  alternative: ibinaba o pinakumbaba ang sarili / nagpasakop
  rationale: Sinusuportahan ng konteksto ng pagsusumamo ang kusang pagpapakumbaba, ngunit hindi ginagawang mas tiyak kaysa kailangan ang paraan o lawak ng kanyang pagsisisi.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “kagipitan,” “lingap,” at “nagpakumbaba” bilang mga salitang pormal nang bahagya ngunit karaniwan pa rin; iniwasan ang sobrang literal at di-likas na anyo ng mga idyomang Hebreo.
