  text: And Yahweh spoke to Manasseh and to his people[a], but they did not listen.
translation:
  language: tl
  text: Nagsalita si Yahweh kay Manases at sa kanyang bayan, ngunit hindi sila nakinig.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nagbigay-pansin” o “dininig.” Ang pandiwang Hebreo ay tumutukoy sa maingat na pakikinig na maaaring magpahiwatig ng nararapat na pagtugon.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Nagsalita
  rationale: Ang piel na anyo ng דבר, kasama ng אֶל, ay likas na nangangahulugang “nagsalita sa.” Pinananatili ng “nagsalita” ang simpleng salaysay at hindi nito nilalagyan ng tiyak na nilalaman ang sinabi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang transliterasyon ng banal na pangalan sa halip na palitan ito ng isang titulo.
- source_word: מְנַשֶּׁה
  choice: Manases
  rationale: Ito ang likas at nakaugaliang anyo ng pangalang Hebreo sa Filipino.
- source_word: עַמּוֹ
  choice: kanyang bayan
  rationale: Ang עַם na may hulaping panlalaking isahan ay tumutukoy sa bayang nasasakupan ni Manases. Mas natural sa kontekstong pampamahalaan ang “kanyang bayan” kaysa “kanyang mga tao,” na maaaring magmukhang tumutukoy lamang sa piling mga tauhan niya.
- source_word: וְלֹא
  choice: ngunit hindi
  rationale: Bagaman literal na maaaring “at hindi,” ipinahihiwatig ng daloy ang malinaw na pagsalungat sa pagitan ng pagsasalita ni Yahweh at ng hindi pakikinig ng mga kinausap.
- source_word: הִקְשִׁיבוּ
  choice: nakinig
  rationale: Ang hiphil ng קשב ay tumutukoy sa maingat na pakikinig o pagbibigay-pansin, na maaari ring magpahiwatig ng nararapat na pagtugon. Ang “nakinig” ang pinakasimple at natural na salin, habang ipinapaliwanag sa talababa ang mas malawak na diwa.
theological_decisions:
- issue: Tinutukoy ng pangmaramihang simuno ng הִקְשִׁיבוּ
  choice: Ang “sila” ay tumutukoy kay Manases at sa kanyang bayan nang magkasama.
  alternative: Ang “sila” ay maaaring ituring na tumutukoy lamang sa bayan, samantalang hiwalay na binanggit si Manases bilang kinausap.
  rationale: Dalawang kinausap ang pinagsama sa pariralang “kay Manases at sa kanyang bayan,” at kasunod nito ang pandiwang pangmaramihan. Pinananatili ng “sila” ang pinakadirektang pagbasa nang hindi inuulit o nililinaw nang higit sa Hebreo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “bayan” para sa kolektibong nasasakupan ni Manases at ang payak na “nakinig” upang mapanatili ang likas na daloy habang inilalagay sa talababa ang ipinahihiwatig na pagbibigay-pansin at pagtugon.
