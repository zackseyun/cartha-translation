base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/021.yaml
  text: Amon was twenty-two years old when he became king, and he reigned two years in Jerusalem.
translation:
  language: tl
  text: Dalawampu't dalawang taong gulang si Amon nang maging hari siya, at naghari siya sa Jerusalem sa loob ng dalawang taon.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן עֶשְׂרִים וּשְׁתַּיִם שָׁנָה
  choice: Dalawampu't dalawang taong gulang
  rationale: Ang literal na Hebreong idyoma ay “anak ng dalawampu't dalawang taon,” ngunit ang natural at tumpak na katumbas sa modernong Tagalog ay “dalawampu't dalawang taong gulang.”
- source_word: אָמ֣וֹן
  choice: Amon
  rationale: Isinatinig ang pangalang pantangi sa anyong nakasanayan sa Tagalog sa halip na isalin ang kahulugan nito.
- source_word: בְּמָלְכוֹ
  choice: nang siya'y maging hari
  rationale: Ang ב na sinusundan ng infinitive construct ng מלך ay nagsasaad ng panahon ng pagluklok; natural na ipinahahayag ito sa Tagalog bilang “nang siya'y maging hari.”
- source_word: וּשְׁתַּיִם שָׁנִים
  choice: nang dalawang taon
  rationale: Tuwirang nagsasaad ito ng tagal ng paghahari; ginagamit ang “nang” upang malinaw na markahan ang haba ng panahon.
- source_word: מָלַךְ
  choice: naghari siya
  rationale: Sa kontekstong ito, ang pandiwa ay tumutukoy sa aktuwal na paghahari sa loob ng isang takdang panahon.
- source_word: בִּירוּשָׁלִָם
  choice: sa Jerusalem
  rationale: Ang pang-ukol ay lokatibo at itinuturo ang Jerusalem bilang kinaroroonan o luklukan ng kanyang paghahari.
