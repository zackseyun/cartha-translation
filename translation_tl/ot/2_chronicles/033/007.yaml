source:
  edition: WLC
  text: וַ/יָּ֕שֶׂם אֶת פֶּ֥סֶל הַ/סֶּ֖מֶל אֲשֶׁ֣ר עָשָׂ֑ה בְּ/בֵ֣ית הָ/אֱלֹהִ֗ים אֲשֶׁ֨ר אָמַ֤ר אֱלֹהִים֙ אֶל דָּוִיד֙ וְ/אֶל שְׁלֹמֹ֣ה בְנ֔/וֹ בַּ/בַּ֨יִת הַ/זֶּ֜ה וּ/בִֽ/ירוּשָׁלִַ֗ם אֲשֶׁ֤ר בָּחַ֨רְתִּי֙ מִ/כֹּל֙ שִׁבְטֵ֣י יִשְׂרָאֵ֔ל אָשִׂ֥ים אֶת שְׁמִ֖/י לְ/עֵילֽוֹם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/007.yaml
  text: He put the carved image[a], the idol that he had made, in the house of God, of which God had said to David and to Solomon his son, “In this house and in Jerusalem, which I have chosen out of all the tribes of Israel, I will put my name forever.”
translation:
  language: tl
  text: Inilagay niya sa bahay ng Diyos ang nililok na imahen[a], ang diyus-diyosang ginawa niya. Tungkol sa bahay na iyon, sinabi ng Diyos kay David at kay Solomon na anak niya, “Sa bahay na ito at sa Jerusalem, na pinili ko mula sa lahat ng mga lipi ng Israel, ilalagay ko ang aking pangalan magpakailanman.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “ang nililok na imahen ng diyus-diyosan”; dalawang magkaugnay na salitang Hebreo para sa rebultong diyus-diyosan ang ginamit.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: Inilagay niya
  rationale: Likas na salaysay sa modernong Tagalog at tumpak na nagpapahayag ng karaniwang pandiwang שׂים.
- source_word: פֶּסֶל הַסֶּמֶל
  choice: ang nililok na imahen, ang diyus-diyosan
  rationale: 'Pinananatiling nakikita ang dalawang magkaugnay na salitang Hebreo: inilalarawan ng una ang bagay bilang nililok na imahen at ipinahahayag ng ikalawa ang papel nito bilang diyus-diyosan.'
- source_word: אֲשֶׁר עָשָׂה
  choice: na ginawa niya
  rationale: Payak at natural na panuring sa Tagalog; malinaw na si Manases ang gumawa ng imahen.
- source_word: בְּבֵית הָאֱלֹהִים
  choice: sa bahay ng Diyos
  rationale: Pinananatili ang literal na larawan ng בַּיִת bilang “bahay” sa halip na agad itong ipakahulugang templo.
- source_word: אֲשֶׁר אָמַר אֱלֹהִים
  choice: Tungkol sa bahay na iyon, sinabi ng Diyos
  rationale: Nililinaw sa natural na Tagalog na ang kasunod na pahayag ng Diyos ay tumutukoy sa bahay, nang hindi binabago ang diwa ng ugnayang pangungusap sa Hebreo.
- source_word: אֶל דָּוִיד וְאֶל שְׁלֹמֹה בְנוֹ
  choice: kay David at kay Solomon na anak niya
  rationale: Pinananatili ang dalawang pinatunguhan ng pahayag at ang pagkakakilanlan kay Solomon bilang anak ni David.
- source_word: בַּבַּיִת הַזֶּה וּבִירוּשָׁלִַם
  choice: Sa bahay na ito at sa Jerusalem
  rationale: Pinananatili ang pag-uugnay ng bahay at ng lungsod at ang pag-uulit sa salitang “bahay.”
- source_word: אֲשֶׁר בָּחַרְתִּי מִכֹּל שִׁבְטֵי יִשְׂרָאֵל
  choice: na pinili ko mula sa lahat ng lipi ng Israel
  rationale: Malapit sa anyo ng Hebreo at pinananatili ang Jerusalem bilang pinili ng Diyos mula sa kabuuan ng mga lipi ng Israel.
- source_word: אָשִׂים אֶת שְׁמִי
  choice: ilalagay ko ang aking pangalan
  rationale: Pinananatili ang kongkretong teolohikal na idyoma ng paglalagay ng pangalan at hindi ito ipinapaliwanag sa paraang mas makitid kaysa sa Hebreo.
- source_word: לְעֵילֹום
  choice: magpakailanman
  rationale: Karaniwan, marangal, at angkop na salin para sa pangmatagalang pahayag na לְעוֹלָם.
theological_decisions:
- issue: Pagtukoy sa Diyos
  choice: Diyos
  alternative: PANGINOON
  rationale: אֱלֹהִים ang ginamit sa talata, hindi ang pangalang tipan na יהוה; kaya hindi ipinapasok ang “PANGINOON.”
- issue: Idyoma tungkol sa pangalan ng Diyos
  choice: ilalagay ko ang aking pangalan magpakailanman
  alternative: pananatilihin ko roon ang aking presensya magpakailanman
  rationale: Pinananatili ang mismong idyoma ng Hebreo at ang teolohikal na lawak nito sa halip na ipantay agad ang “pangalan” sa isang paliwanag gaya ng presensya.
- issue: Pagkakaugnay ng piniling lugar
  choice: Sa bahay na ito at sa Jerusalem, na pinili ko
  alternative: Sa bahay na ito, sa Jerusalem na pinili ko
  rationale: Sinasalamin ang Hebreong pag-uugnay ng bahay at Jerusalem habang pinananatili ang tunay na bahagyang kalabuan kung ang sugnay ng pagpili ay gramatikal na nakatuon lamang sa Jerusalem o sa pinagsamang lokasyon.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Ginamit ang “bahay ng Diyos” upang mapanatili ang bokabularyo at pag-uulit ng Hebreo; iniwasan ang lumang “larawang inanyuan” at ang labis na paliwanag sa idyoma ng pangalan ng Diyos.
