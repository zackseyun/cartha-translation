id: 2CH.33.23
reference: 2 Chronicles 33:23
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/לֹ֤א נִכְנַע֙ מִ/לִּ/פְנֵ֣י יְהוָ֔ה כְּ/הִכָּנַ֖ע מְנַשֶּׁ֣ה אָבִ֑י/ו כִּ֛י ה֥וּא אָמ֖וֹן הִרְבָּ֥ה אַשְׁמָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/023.yaml
  text: But he did not humble himself before Yahweh as his father Manasseh humbled himself[a], for he, Amon, increased guilt.
translation:
  language: tl
  text: Ngunit hindi siya nagpakumbaba sa harap ni Yahweh, tulad ng kanyang amang si Manases na nagpakumbaba[a]. Sapagkat siya, si Amon, ay lubha niyang pinarami ang kanyang pagkakasala.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaaring iugnay ang “sa harap ni Yahweh” sa pagpapakumbaba ni Manases: “tulad ng kanyang amang si Manases na nagpakumbaba sa harap ni Yahweh.”'
    reason: Ipinakikita ang posibleng saklaw ng pariralang Hebreo nang hindi itinatakda ang isang sintaktikong pagbasa.
lexical_decisions:
- source_word: נִכְנַע
  choice: nagpakumbaba
  rationale: 'Ang Niphal ng כנע ay may diwang reflexive sa kontekstong ito: kusang pagpapakumbaba o pagpapasakop sa Diyos. Ang “nagpakumbaba” ang pinakanatural sa makabagong Tagalog at umaangkop sa salaysay tungkol sa pagsisisi ni Manases.'
- source_word: מִלִּפְנֵי יְהוָה
  choice: sa harap ni Yahweh
  rationale: Natural na inilalarawan ng “sa harap ni” ang pagiging nasa presensiya o pananagutan sa Diyos, samantalang pinananatili ang pangalang tipan na Yahweh.
- source_word: כְּהִכָּנַע
  choice: gaya ng pagpapakumbaba
  rationale: Pinananatili ng pangngalang pandiwa ang paghahambing at ang leksikal na ugnayan sa naunang “nagpakumbaba.”
- source_word: מְנַשֶּׁה אָבִיו
  choice: kanyang amang si Manases
  rationale: Ito ang natural at malinaw na ayos sa Tagalog para tukuyin ang ama ni Amon.
- source_word: כִּי
  choice: Sapagkat
  rationale: Pinananatili ang posibleng paliwanag na ugnayan ng huling sugnay sa naunang pahayag, nang hindi ito tahasang ginagawang simpleng pagsalungat.
- source_word: הוּא אָמוֹן
  choice: siya—si Amon—
  rationale: Ang gitling na paningit ay nagpapanatili sa mariing panghalip at tahasang pagkilala kay Amon.
- source_word: הִרְבָּה אַשְׁמָה
  choice: lalo pang nagpalaki ng kanyang pagkakasala
  rationale: Ipinahahayag nito ang pagdami o paglala ng pananagutan sa kasalanan, hindi ang handog para sa pagkakasala. Ang “lalo pang” ay natural na naghahatid ng ideya ng pag-ibayo.
theological_decisions:
- issue: Paglalarawan sa pagpapakumbaba ni Amon at ni Manases
  choice: nagpakumbaba / pagpapakumbaba
  alternative: nagpasakop / pagpapasakop
  rationale: Ang “nagpakumbaba” ay mas angkop sa konteksto ng pagsisisi at hindi nag-aalis sa maaaring diwa ng pagpapasakop sa Diyos.
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Direktang pinananatili ang personal na pangalang nasa tekstong Hebreo nang hindi ito pinapalitan ng titulo.
- issue: Kaugnayan ng כִּי sa huling sugnay
  choice: Sapagkat
  alternative: Sa halip
  rationale: Maaaring maging paliwanag o mariing pagpapatunay ang כִּי. Pinili ang “Sapagkat” upang mapanatili ang paliwanag na puwersa at maiwasang gawing tiyak ang isang purong adversative na pagbasa.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “sa harap ni Yahweh” at “nagpakumbaba” bilang karaniwang wikang panrelihiyon, habang ang paningit na “si Amon” ay nagpapanatili sa diin ng Hebreo.
