revisions:
- from: Ngunit hindi siya nagpakumbaba sa harap ni Yahweh, gaya ng pagpapakumbaba ng kanyang amang si Manases[a]. Sapagkat siya—si Amon—ay lalo pang nagpalaki ng kanyang pagkakasala.
  to: Ngunit hindi siya nagpakumbaba sa harap ni Yahweh, tulad ng kanyang amang si Manases na nagpakumbaba[a]. Sapagkat siya, si Amon, ay lubha niyang pinarami ang kanyang pagkakasala.
  rationale: Inayos ang paghahambing upang maging mas natural na modernong Filipino habang pinananatili ang pandiwang parallelism ng Hebreo. Pinalinaw rin ang huling sugnay upang mas tumpak na maipahayag ang pagpaparami ng guilt/pananagutan ni Amon. Napanatili ang footnote dahil may makatwirang kawalang-katiyakan sa saklaw ng “sa harap ni Yahweh.”
