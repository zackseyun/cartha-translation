  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וּ/בָנָ֥ה מִזְבְּח֖וֹת בְּ/בֵ֣ית יְהוָ֑ה אֲשֶׁר֙ אָמַ֣ר יְהוָ֔ה בִּ/ירוּשָׁלִַ֥ם יִֽהְיֶה שְּׁמִ֖/י לְ/עוֹלָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/004.yaml
  text: He built altars in the house of Yahweh[a], of which Yahweh had said[b], “In Jerusalem my name will be forever.”
translation:
  language: tl
  text: Nagtayo siya ng mga altar sa bahay ni Yahweh[a], na sinabi ni Yahweh tungkol dito, “Sa Jerusalem ay magiging magpakailanman ang pangalan ko.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa templo ni Yahweh.” Literal na “sa bahay ni Yahweh.”
    reason: lexical_alternative
  - marker: b
    text: Literal na “Sa Jerusalem ay magiging magpakailanman ang pangalan ko.” Hindi nakasulat sa Hebreo ng talatang ito ang salitang “doon,” na matatagpuan sa kahawig na mga pahayag sa ibang talata.
    reason: source_clarification
lexical_decisions:
- source_word: וּבָנָה
  choice: Nagtayo siya
  rationale: Ang Qal perfect na בנה ay nangangahulugang “nagtayo.” Hindi na tahasang isinalin ang pang-ugnay na וּ upang maging natural ang daloy ng makabagong salaysay sa Filipino.
- source_word: מִזְבְּחוֹת
  choice: mga altar
  rationale: Ito ang tuwirang salin ng pangmaramihang anyo ng מִזְבֵּחַ, ang karaniwang salita para sa altar na pinaghahandugan.
- source_word: בְּבֵית יְהוָה
  choice: sa bahay ni Yahweh
  rationale: Pinananatili ng “bahay” ang literal na larawan ng בַּיִת, bagaman ang tinutukoy sa konteksto ay ang templo; inilagay ang mas malinaw na alternatibo sa talababa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinalin ang Tetragrammaton bilang personal na pangalang “Yahweh,” hindi bilang isang titulo.
- source_word: אֲשֶׁר אָמַר יְהוָה
  choice: na tungkol dito ay sinabi ni Yahweh
  rationale: Ikinakabit ng אֲשֶׁר ang sinabi ni Yahweh sa “bahay.” Ang “tungkol dito” ay nagpapanatili sa ugnayang iyon nang hindi ginagawang pook na pang-abay lamang ang parirala.
- source_word: בִּירוּשָׁלִַם
  choice: Sa Jerusalem
  rationale: Tuwirang salin ng pang-ukol at pangalan ng lugar, habang pinananatili ang pagkakauna nito para sa diin.
- source_word: יִהְיֶה שְּׁמִי
  choice: mananatili ang pangalan ko
  rationale: Literal na “ang pangalan ko ay magiging.” Sa natural na Filipino, ipinahahayag ng “mananatili” ang patuloy na pag-iral na hinihingi ng kasunod na לְעוֹלָם, nang idagdag ang salitang “doon” na wala sa tekstong Hebreo.
- source_word: לְעוֹלָם
  choice: magpakailanman
  rationale: Karaniwan at marangal na katumbas sa Filipino para sa walang hanggang tagal.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo, kaya pinanatili itong “Yahweh” sa halip na palitan ng titulo.
- issue: Kung idaragdag ang “doon” sa pahayag tungkol sa pangalan
  choice: Hindi idinagdag ang “doon”
  alternative: “Doon mananatili ang pangalan ko magpakailanman”
  rationale: Walang שָׁם (“doon”) sa talatang ito. Pinananatili ng salin ang partikular na anyo ng tekstong Hebreo at hindi inaangkat ang mas buong pananalita mula sa mga kahawig na talata.
- issue: Kahulugan ng “pangalan” sa pahayag ni Yahweh
  choice: Pinanatili ang “pangalan ko” nang walang paliwanag sa mismong teksto
  alternative: Palawakin bilang “presensiya ko” o “kapamahalaan ko”
  rationale: Ang “pangalan” ay mayaman sa teolohikong kahulugan, ngunit hindi ito dapat tahasang paliitin sa iisang interpretasyon.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Pinanatili ang literal na larawang “bahay ni Yahweh,” na may “templo” bilang malinaw na alternatibo sa talababa. Ginamit ang “mananatili” upang maging natural ang pahayag sa Filipino habang hindi idinaragdag ang “doon.”
