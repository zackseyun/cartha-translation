- from: Nagtayo siya ng mga altar sa bahay ni Yahweh[a], na tungkol dito ay sinabi ni Yahweh, “Sa Jerusalem mananatili ang pangalan ko magpakailanman.”[b]
  to: Nagtayo siya ng mga altar sa bahay ni Yahweh[a], na sinabi ni Yahweh tungkol dito, “Sa Jerusalem ay magiging magpakailanman ang pangalan ko.”[b]
