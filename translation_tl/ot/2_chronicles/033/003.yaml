base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/003.yaml
  text: For he rebuilt the high places that Hezekiah his father had torn down[a], and he set up altars to the Baals, and made Asherah poles[d][c][b], and bowed down to all the host of heaven and served them.
translation:
  language: tl
  text: Muli niyang itinayo ang mga sambahan sa matataas na lugar na giniba ng kanyang amang si Hezekias[a]. Nagtayo siya ng mga altar para sa mga Baal[b], gumawa ng mga poste ni Ashera[c], at yumukod sa buong hukbo ng langit[d] at naglingkod sa mga iyon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaaring isalin na “muli niyang ipinatayo.” Literal sa Hebreo: “bumalik siya at itinayo,” isang pahayag na nangangahulugang ibinalik niya ang mga giniba.'
    reason: lexical_alternative
  - marker: b
    text: Pinananatili ng “mga Baal” ang maramihang anyo sa Hebreo. Maaaring tumukoy ito sa iba’t ibang lokal na anyo, titulo, o imahen ni Baal.
    reason: lexical_alternative
  - marker: c
    text: O “mga Ashera.” Maaaring tumukoy ang salitang Hebreo sa mga kultikong poste o iba pang sagisag na kaugnay ng diyosang si Ashera.
    reason: lexical_alternative
  - marker: d
    text: Ang “hukbo ng langit” dito ay tumutukoy sa mga bagay sa kalangitan na ginawang mga sinasamba, gaya ng araw, buwan, at mga bituin; ihambing sa 2 Hari 21:3.
    reason: cross_reference
lexical_decisions:
- source_word: וַיָּשָׁב וַיִּבֶן
  choice: Muli niyang itinayo
  rationale: Ang magkasunod na שוב at בנה ay nagsasaad ng muling pagtatayo o pagpapanumbalik sa giniba; natural itong ipinapahayag sa Tagalog bilang “muling itinayo.”
- source_word: הַבָּמוֹת
  choice: mga sambahan sa matataas na lugar
  rationale: Tumutukoy ang במות sa mga kultikong pook-sambahan, kadalasang nasa matataas na lugar. Nililinaw ng “mga sambahan” na hindi lamang heograpikong lugar ang tinutukoy.
- source_word: נִתַּץ
  choice: giniba
  rationale: Ipinapahayag ng pandiwa ang paggiba o pagwasak ng mga estruktura; maikli at natural ang “giniba.”
- source_word: יְחִזְקִיָּהוּ אָבִיו
  choice: kanyang amang si Hezekias
  rationale: Natural sa modernong Tagalog ang ayos na ito at malinaw na si Hezekias ang ama niya.
- source_word: וַיָּקֶם מִזְבְּחוֹת לַבְּעָלִים
  choice: Nagtayo siya ng mga altar para sa mga Baal
  rationale: Pinananatili ang maramihang anyo ng בעלים at ang tiyak na kultikong katawagang “altar.”
- source_word: אֲשֵׁרוֹת
  choice: mga poste ni Ashera
  rationale: Maaaring tumukoy ang termino sa mga kultikong bagay o sagisag na kaugnay ni Ashera. Madaling maunawaan ang “mga poste ni Ashera,” habang ipinapaliwanag sa talababa ang tunay na saklaw ng termino.
- source_word: וַיִּשְׁתַּחוּ
  choice: yumukod
  rationale: Pinananatili nito ang pisikal na kilos ng pagpapatirapa o pagyukod, samantalang ang kasunod na “naglingkod” ang higit na hayagang nagsasaad ng pagsambang kultiko.
- source_word: לְכָל צְבָא הַשָּׁמַיִם
  choice: sa buong hukbo ng langit
  rationale: Pinananatili ang metapora ng צבא at ang nakaugaliang biblikal na pahayag, habang nililinaw sa talababa na mga bagay sa kalangitan ang tinutukoy rito.
- source_word: וַיַּעֲבֹד אֹתָם
  choice: naglingkod sa mga iyon
  rationale: Pinananatili ang leksikal na kaibahan nito sa naunang “yumukod.” Sa kontekstong kultiko, ang paglilingkod ay bahagi ng pagsamba.
theological_decisions:
- issue: Paglalarawan sa mga paganong kulto
  choice: Panatilihin ang mga tiyak na katawagang “mga sambahan sa matataas na lugar,” “mga Baal,” at “mga poste ni Ashera.”
  alternative: Gawing pangkalahatan ang mga ito bilang “mga diyus-diyosan” o “mga huwad na diyos.”
  rationale: Isa-isang binabanggit ng Hebreo ang mga partikular na anyo ng pagsambang itinuring na pagtataksil. Ang kongkretong mga katawagan ay nagpapanatili sa makasaysayan at panrelihiyong detalye nang hindi nagdaragdag ng teolohikong paglalahat.
- issue: Kahulugan ng “hukbo ng langit”
  choice: Unawain ito sa kontekstong ito bilang mga bagay sa kalangitan na sinamba.
  alternative: Unawain ito bilang mga anghel o iba pang espiritung makalangit.
  rationale: Dahil kabilang ito sa talaan ng ipinagbabawal na pagsamba kasama ng mga Baal at mga bagay na kaugnay ni Ashera, pinakamalamang na astral na pagsamba ang tinutukoy. Gayunman, pinananatili sa pangunahing teksto ang matalinghagang anyo ng Hebreo at inilalagay ang paglilinaw sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit tuwiran. Ginamit ang “sambahan sa matataas na lugar” upang maging malinaw ang kultikong kahulugan ng bamot, at pinanatili ang mga tiyak na pangalang Baal at Ashera. Iniwasan ang masyadong teknikal o denominasyonal na pananalita.
