id: 2CH.33.15
reference: 2 Chronicles 33:15
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ֠/יָּסַר אֶת אֱלֹהֵ֨י הַ/נֵּכָ֤ר וְ/אֶת הַ/סֶּ֨מֶל֙ מִ/בֵּ֣ית יְהוָ֔ה וְ/כָל הַֽ/מִּזְבְּח֗וֹת אֲשֶׁ֥ר בָּנָ֛ה בְּ/הַ֥ר בֵּית יְהוָ֖ה וּ/בִ/ירוּשָׁלִָ֑ם וַ/יַּשְׁלֵ֖ךְ ח֥וּצָ/ה לָ/עִֽיר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/015.yaml
  text: He removed the foreign gods and the idol from the house of Yahweh[a], and all the altars that he had built on the mountain of the house of Yahweh and in Jerusalem[b], and he threw them outside the city.
translation:
  language: tl
  text: Inalis niya sa bahay ni Yahweh ang mga banyagang diyos at ang diyus-diyosan[a], pati ang lahat ng altar na itinayo niya sa bundok ng bahay ni Yahweh[b] at sa Jerusalem. Itinapon niya ang mga iyon sa labas ng lungsod.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “imahen.” Ang salitang Hebreo ay maaaring tumukoy sa isang diyus-diyosan o imaheng ginagamit sa pagsamba.
    reason: lexical_alternative
  - marker: b
    text: O “sa burol ng bahay ni Yahweh”; ibig sabihin, sa kinaroroonan ng templo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּסַר
  choice: Inalis niya
  rationale: Ang Hiphil ng סור ay nangangahulugang ipaalis o alisin. Likas at tuwiran sa modernong Tagalog ang “inalis.”
- source_word: אֱלֹהֵי הַנֵּכָר
  choice: ang mga banyagang diyos
  rationale: Tumutukoy ang parirala sa mga diyos na hindi kabilang sa pagsamba kay Yahweh. Malinaw at idiomatiko ang “mga banyagang diyos.”
- source_word: הַסֶּמֶל
  choice: ang diyus-diyosan
  rationale: Ang סֶמֶל ay isang imahen o rebultong ginagamit sa kultong pagsamba. Ipinahihiwatig ng “diyus-diyosan” ang relihiyosong gamit nito, habang pinananatili sa talababa ang mas neutral na alternatibo.
- source_word: מִבֵּית יְהוָה
  choice: sa bahay ni Yahweh
  rationale: Sa konstruksiyong “inalis ... sa,” likas na ipinapahayag ng “sa” ang pinanggalingan. Pinananatili ng “bahay ni Yahweh” ang Hebreong metapora para sa templo.
- source_word: וְכָל הַמִּזְבְּחוֹת
  choice: pati ang lahat ng altar
  rationale: Tumpak na inilalahad ng “lahat ng altar” ang pangmaramihang anyo kasama ang כָּל; likas na ikinakabit ng “pati” ang mga ito sa mga naunang bagay na inalis.
- source_word: אֲשֶׁר בָּנָה
  choice: na itinayo niya
  rationale: Karaniwang ginagamit ang “itinayo” para sa pagtatayo ng mga altar at malinaw na tumutukoy sa naunang ginawa ni Manases.
- source_word: בְּהַר בֵּית יְהוָה
  choice: sa bundok ng bahay ni Yahweh
  rationale: Pinananatili nito ang kongkretong salita ng Hebreo para sa bundok o burol at ang kaugnayan nito sa bahay ni Yahweh, nang hindi tahasang pinapalitan ng interpretatibong katawagang “Temple Mount.”
- source_word: וּבִירוּשָׁלָם
  choice: at sa Jerusalem
  rationale: Tuwirang salin na nagpapakitang may mga altar din sa iba pang bahagi ng Jerusalem.
- source_word: וַיַּשְׁלֵךְ
  choice: Itinapon niya
  rationale: Napananatili ng “itinapon” ang mariin at pisikal na pagtatakwil na ipinahihiwatig ng שׁלך.
- source_word: חוּצָה לָעִיר
  choice: sa labas ng lungsod
  rationale: Likas at eksaktong ipinapahayag nito ang direksiyon tungo sa lugar sa labas ng hangganan ng lungsod.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang transliterasyon ng banal na pangalang יהוה sa halip na palitan ito ng isang titulo.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang pangalan sa halip na palitan ito ng titulong “PANGINOON,” at ito ang mas malamang na bigkas kaysa “Jehovah.”
- issue: Paglalarawan sa הַסֶּמֶל
  choice: diyus-diyosan
  alternative: imahen
  rationale: Relihiyosong imahen ang tinutukoy sa konteksto ng mga reporma ni Manases. Gayunman, hindi lubos na tinutukoy ng salita ang anyo o uri nito, kaya inilalahad sa talababa ang mas neutral na “imahen.”
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran at marangal. Ginamit ang “bahay ni Yahweh” upang mapanatili ang Hebreong pahayag, ngunit nananatiling madaling maunawaan sa konteksto. Hinati sa dalawang pangungusap ang mahabang Hebreong pangungusap upang maging malinaw kung ano ang itinapon, nang hindi binabago ang daloy ng mga kilos.
