translation:
  language: tl
  text: At nakipagsabwatan laban sa kanya ang kanyang mga lingkod, at pinatay nila siya sa sarili niyang bahay.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְשְׁרוּ עָלָיו
  choice: nakipagsabwatan laban sa kanya
  rationale: Ang idyomang קשר על ay tumutukoy sa pagsasabwatan laban sa isang tao, lalo na sa konteksto ng pagpaslang sa hari. Likas sa modernong Filipino ang pariralang ito at pinananatili nito ang lihim at mapanlabang pagkilos.
- source_word: עֲבָדָיו
  choice: ang kanyang mga lingkod
  rationale: Sa konteksto ng maharlikang sambahayan, maaaring tumukoy ang עבד sa mga lingkod o tauhan ng hari. Ang “mga lingkod” ang pinakadirekta at hindi labis na tumutukoy sa kanilang ranggo o legal na katayuan.
- source_word: וַיְמִיתֻהוּ
  choice: pinatay nila siya
  rationale: Ang Hiphil ng מות ay may causative na diwa. Sa Filipino, malinaw at natural na ipinahahayag ng “pinatay nila siya” ang sadyang pagkitil sa kanyang buhay.
- source_word: בְּבֵיתוֹ
  choice: sa sarili niyang bahay
  rationale: Ipinakikita ng ב ang kinalalagyan, at ng hulaping panghalip na iyon ay bahay niya. Natural na binibigyang-diin ng “sarili niyang” ang nakakagulat na lugar ng pagpaslang nang hindi binabago ang kahulugan.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na simple, marangal, at angkop sa salaysay. Ginamit ang “nakipagsabwatan” sa halip na mas kolokyal na “nagplano,” at pinanatili ang “mga lingkod” upang hindi labis na tukuyin ang tungkulin ng עֲבָדָיו.
