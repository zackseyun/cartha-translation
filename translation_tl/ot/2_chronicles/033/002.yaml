id: 2CH.33.2
reference: 2 Chronicles 33:2
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה כְּ/תֽוֹעֲבוֹת֙ הַ/גּוֹיִ֔ם אֲשֶׁר֙ הוֹרִ֣ישׁ יְהוָ֔ה מִ/פְּנֵ֖י בְּנֵ֥י יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/002.yaml
  text: He did what was evil in the sight of Yahweh[a], according to the abominations of the nations whom Yahweh had driven out before the sons of Israel.
translation:
  language: tl
  text: Ginawa niya ang masama sa paningin ni Yahweh, gaya ng mga karumal-dumal na gawain ng mga bansang pinalayas ni Yahweh sa harap ng mga anak ni Israel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O mas natural: “mga Israelita.” Ang literal na Hebreo ay “mga anak ni Israel.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ הָרַע
  choice: Ginawa niya ang masama
  rationale: Likas na salaysay sa Filipino ang nakaraang panahunan; ang substantibong הָרַע ay tuwirang naipapahayag bilang “ang masama.”
- source_word: בְּעֵינֵי יְהוָה
  choice: sa paningin ni Yahweh
  rationale: Pinananatili ang Hebreong metapora at ang kahulugang pagsusuri ayon kay Yahweh, habang natural sa modernong Filipino.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin ang Tetragrammaton bilang personal na pangalang Yahweh sa halip na palitan ng isang titulo.
- source_word: כְּתוֹעֲבוֹת הַגּוֹיִם
  choice: gaya ng mga karumal-dumal na gawain ng mga bansa
  rationale: Ang כְּ ay naghahayag ng paghahambing o pagtulad. Ipinahihiwatig ng תוֹעֲבוֹת dito ang mga gawaing lubhang kasuklam-suklam, kaya nilinaw bilang “mga ... gawain” nang hindi pinahihina ang bigat nito.
- source_word: הוֹרִישׁ
  choice: pinalayas
  rationale: Sa Hiphil, ang ירשׁ ay nangangahulugang paalisin o agawan ng paninirahan ang mga dating naninirahan; “pinalayas” ang malinaw at angkop sa konteksto.
- source_word: מִפְּנֵי
  choice: sa harap ng
  rationale: Pinananatili ang spatial na idyoma ng Hebreo kaugnay ng pagpapaalis sa mga bansa mula sa daraanan o presensiya ng Israel.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Pinananatili ang literal at pampamilyang anyo ng Hebreo; nilalagyan ng talababa ang mas idiomatikong kolektibong kahulugan.
theological_decisions:
- issue: Pagbanggit sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang pangalan sa halip na palitan ito ng titulo.
- issue: Pampamilyang pananalitang בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  alternative: mga Israelita; sambayanang Israel
  rationale: Pinananatili ng pangunahing teksto ang anyong pampamilya ng pinagmulan, samantalang ipinapaliwanag sa talababa ang natural na kolektibong katumbas sa Filipino.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang biblikal na idyomang “sa paningin” at ang pampamilyang “mga anak ni Israel,” ngunit ginawang malinaw ang תוֹעֲבוֹת bilang “mga karumal-dumal na gawain.”
