  text: וַ/יִּתְפַּלֵּ֣ל אֵלָ֗י/ו וַ/יֵּעָ֤תֶר ל/וֹ֙ וַ/יִּשְׁמַ֣ע תְּחִנָּת֔/וֹ וַ/יְשִׁיבֵ֥/הוּ יְרוּשָׁלִַ֖ם לְ/מַלְכוּת֑/וֹ וַ/יֵּ֣דַע מְנַשֶּׁ֔ה כִּ֥י יְהוָ֖ה ה֥וּא הָֽ/אֱלֹהִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/013.yaml
  text: He prayed to him[a], and he was moved by his entreaty, heard his supplication, and brought him back to Jerusalem to his kingdom[c][b]. Then Manasseh knew that Yahweh is God.
translation:
  language: tl
  text: Nanalangin si Manases sa Diyos, at pinagbigyan[a] ng Diyos ang kanyang pakiusap, dininig ang kanyang pagsusumamo, at ibinalik siya sa Jerusalem at sa kanyang paghahari[b]. At nalaman ni Manases na si Yahweh ang Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “hinayaan ng Diyos na mapakiusapan siya” o “tumugon nang may pagsang-ayon ang Diyos sa kanya.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “sa kanyang kaharian,” na tumutukoy sa kanyang maharlikang pamamahala o paghahari.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְפַּלֵּל אֵלָיו
  choice: Nanalangin si Manases sa Diyos
  rationale: Karaniwang kahulugan ng hitpael na התפלל ang ‘manalangin.’ Nilinaw ang mga panghalip ayon sa konteksto upang maiwasan ang kalituhan sa Filipino, nang hindi binabago ang tinutukoy.
- source_word: וַיֵּעָתֶר לוֹ
  choice: pinagbigyan ng Diyos ang kanyang taimtim na pakiusap
  rationale: Maaaring mangahulugan ang niphal ng עתר na ‘magpahintulot na mapakiusapan’ o ‘tumugon nang may pagsang-ayon.’ Likas sa Filipino ang ‘pinagbigyan’ at ipinahihiwatig nito ang mabuting tugon ng Diyos, habang itinatala sa talababa ang ibang anyo.
- source_word: וַיִּשְׁמַע תְּחִנָּתוֹ
  choice: dininig ang kanyang pagsusumamo
  rationale: Ang תחנה ay taimtim na paghingi ng awa o lingap. Pinananatili ng ‘pagsusumamo’ ang bigat ng salita at ng konteksto ng panalangin.
- source_word: וַיְשִׁיבֵהוּ יְרוּשָׁלַםִ לְמַלְכוּתוֹ
  choice: ibinalik siya sa Jerusalem upang muli siyang maghari
  rationale: Ang hiphil ng שוב ay ‘magbalik’ o ‘pabalikin.’ Ang לְמַלְכוּתוֹ ay tumutukoy sa pagpapanumbalik kay Manases sa kanyang maharlikang pamamahala; isinalin ito nang natural sa Filipino at ibinigay sa talababa ang mas literal na anyo.
- source_word: וַיֵּדַע מְנַשֶּׁה
  choice: Kaya nalaman ni Manases
  rationale: Ang ידע ay ‘malaman’ o ‘makilala.’ Ipinahahayag ng ‘kaya’ ang bunga sa daloy ng salaysay nang hindi nagdaragdag ng bagong ideya.
- source_word: כִּי יְהוָה הוּא הָאֱלֹהִים
  choice: na si Yahweh ang Diyos
  rationale: Pinananatili ang pangalang tipan na יהוה bilang ‘Yahweh.’ Likas na naihahatid ng hulma na ‘si Yahweh ang Diyos’ ang diin ng הוּא nang hindi idinaragdag ang salitang ‘lamang,’ na hindi tahasang nasa Hebreo.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang ginagamit sa talata ang Tetragrammaton. Pinananatili ng ‘Yahweh’ ang natatanging pangalan sa halip na palitan ito ng isang titulo.
- issue: Diin ng כִּי יְהוָה הוּא הָאֱלֹהִים
  choice: si Yahweh ang Diyos
  alternative: si Yahweh lamang ang Diyos; si Yahweh—siya ang Diyos
  rationale: Ipinahahayag ng Hebreo ang pagkilala ni Manases sa pagka-Diyos ni Yahweh. Naipapakita sa natural na ayos ng Filipino ang diin ng panghalip, ngunit hindi idinaragdag ang ‘lamang’ dahil hindi iyon tahasang nakasulat.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Nilinaw ang salit-salitang panghalip sa pamamagitan ng pagbanggit kina Manases at Diyos, sapagkat magiging malabo sa Filipino ang sunod-sunod na ‘siya/kanya.’ Pinanatili ang magkalapit ngunit magkahiwalay na mga kilos na ‘pinagbigyan’ at ‘dininig,’ gaya ng paralelismong Hebreo.
