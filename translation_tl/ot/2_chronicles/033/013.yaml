revisions:
- from: Nanalangin si Manases sa Diyos, at pinagbigyan[a] ng Diyos ang kanyang taimtim na pakiusap, dininig ang kanyang pagsusumamo, at ibinalik siya sa Jerusalem upang muli siyang maghari[b]. Kaya nalaman ni Manases na si Yahweh ang Diyos.
  to: Nanalangin si Manases sa Diyos, at pinagbigyan[a] ng Diyos ang kanyang pakiusap, dininig ang kanyang pagsusumamo, at ibinalik siya sa Jerusalem at sa kanyang paghahari[b]. At nalaman ni Manases na si Yahweh ang Diyos.
  rationale: Inayos ang parirala tungkol sa pagpapanumbalik upang maipakita ang dalawang magkaugnay na layon sa Hebreo—Jerusalem at ang paghahari ni Manases—nang hindi ito gawing sugnay ng layunin. Ginawang “At nalaman” ang pangwakas na sugnay para sa neutral na daloy ng salaysay, at inalis ang dagdag na “taimtim” sa unang “pakiusap.”
