base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/011.yaml
  text: So Yahweh brought against them the commanders of the army of the king of Assyria[a], and they captured Manasseh with hooks, bound him with bronze chains, and took him to Babylon.
translation:
  language: tl
  text: Kaya ipinadala ni Yahweh laban sa kanila ang mga kumander ng hukbo ng hari ng Asiria. Binihag nila si Manases gamit ang mga kawit[a], iginapos siya ng mga tanikalang bronse, at dinala siya sa Babilonia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, gamit ang isang kawit. Ang salitang Hebreo ay maaaring tumukoy sa mga kawit o mga tinik; nauunawaan din ito ng ilan bilang mas pangkalahatang panali na ikinakabit sa isang bihag.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang transliterasyon ng personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
- source_word: וַיָּבֵא ... עֲלֵיהֶם
  choice: ipinadala ... laban sa kanila
  rationale: Pinananatili ang tuwirang pagkilos ni Yahweh at ang mapanlabang diwa ng עַל, habang gumagamit ng likas na pananalita para sa pagpapakilos ng hukbo.
- source_word: שָׂרֵי הַצָּבָא אֲשֶׁר לְמֶלֶךְ אַשּׁוּר
  choice: ang mga kumander ng hukbo ng hari ng Asiria
  rationale: Ang 'mga kumander' ay malinaw at makabagong katumbas ng mga pinunong militar; ipinahahayag ng kasunod na parirala ang kaugnayan nila sa hari ng Asiria.
- source_word: וַיִּלְכְּדוּ
  choice: binihag
  rationale: Ang pandiwa ay nangangahulugang hulihin o dakpin, lalo na sa kontekstong militar; ang 'binihag' ay angkop sa pagkakadakip sa isang hari.
- source_word: בַּחֹחִים
  choice: gamit ang mga kawit
  rationale: Pinananatili ang kongkretong larawan ng mga kawit na maaaring gamitin sa mga bihag, ngunit inilalahad sa talababa ang leksikal na kalabuan ng salita.
- source_word: וַיַּאַסְרֻהוּ בַּנְחֻשְׁתַּיִם
  choice: iginapos siya ng mga tanikalang tanso
  rationale: Ipinahahayag ang paggapos at ang metal na materyal ng mga panali; ang 'tanikalang tanso' ay malinaw sa karaniwang mambabasa.
- source_word: וַיּוֹלִיכֻהוּ בָּבֶלָה
  choice: dinala siya sa Babilonia
  rationale: Likas na salin ng causative na pandiwa at ng panandang patungo sa isang lugar.
theological_decisions:
- issue: Ang pagkilos ng Diyos sa pagsalakay ng Asiria
  choice: Tuwirang ipinadala ni Yahweh laban sa kanila ang mga kumander.
  alternative: Pinahintulutan lamang ni Yahweh na salakayin sila.
  rationale: Tuwirang iniuugnay ng Hiphil na pandiwa kay Yahweh ang pagpaparating sa hukbo; hindi ito pinalalambot bilang pahintulot lamang.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang 'kumander,' 'binihag,' at 'iginapos' bilang natural na mga salitang angkop sa kontekstong militar. Inilagay ang talababa sa mismong salitang 'mga kawit,' na siyang may leksikal na kalabuan.
