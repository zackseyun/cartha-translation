  - severity: low
    issue: Hindi pinakamalinaw ang estrukturang “ayon sa buong Kautusan, sa mga tuntunin, at sa mga hatol.”
    rationale: Mas tuwiran at mas malapit sa saklaw ng Hebreo ang pagtukoy sa “lahat ng Kautusan, mga tuntunin, at mga hatol,” na pawang ibinigay sa pamamagitan ni Moises.
