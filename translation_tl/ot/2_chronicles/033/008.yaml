  text: וְ/לֹ֣א אוֹסִ֗יף לְ/הָסִיר֙ אֶת רֶ֣גֶל יִשְׂרָאֵ֔ל מֵ/עַל֙ הָֽ/אֲדָמָ֔ה אֲשֶׁ֥ר הֶֽעֱמַ֖דְתִּי לַ/אֲבֹֽתֵי/כֶ֑ם רַ֣ק אִם יִשְׁמְר֣וּ לַ/עֲשׂ֗וֹת אֵ֚ת כָּל אֲשֶׁ֣ר צִוִּיתִ֔י/ם לְ/כָל הַ/תּוֹרָ֛ה וְ/הַֽ/חֻקִּ֥ים וְ/הַ/מִּשְׁפָּטִ֖ים בְּ/יַד מֹשֶֽׁה־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/008.yaml
  text: And I will no longer remove the foot of Israel from upon the land that I appointed for your fathers[a], if only they are careful to do all that I commanded them[b], according to all the law and the statutes and the judgments given through Moses.
translation:
  language: tl
  text: At hindi ko na aalisin ang paa ng Israel[a] mula sa lupaing itinakda ko para sa inyong mga ninuno, kung maingat nilang susundin ang lahat ng iniutos ko sa kanila—ang buong Kautusan, mga tuntunin, at mga hatol na ibinigay sa pamamagitan ni Moises.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal, “ang paa ng Israel,” isang idyoma para sa pananatili o presensiya ng Israel sa lupain.
    reason: lexical_alternative
  - marker: b
    text: Literal, “sa kamay ni Moises.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹסִיף לְהָסִיר
  choice: hindi ko na aalisin
  rationale: Ipinahahayag ng pagsasama ng יסף at הסיר ang hindi na muling pagpapaalis; natural at malinaw ito sa modernong Tagalog.
- source_word: רֶגֶל יִשְׂרָאֵל
  choice: ang paa ng Israel
  rationale: Pinananatili ang kongkretong larawan ng Hebreo, habang nililinaw sa talababa na idyoma ito para sa presensiya ng Israel sa lupain.
- source_word: מֵעַל הָאֲדָמָה
  choice: mula sa lupain
  rationale: Ang 'lupain' ay angkop sa konteksto ng tipan at likas na naihahayag sa Tagalog ang diwa ng pag-aalis mula roon.
- source_word: אֲשֶׁר הֶעֱמַדְתִּי לַאֲבֹתֵיכֶם
  choice: itinakda ko para sa inyong mga ninuno
  rationale: Ipinahahayag ng 'itinakda' ang sanhi at pagtatalaga sa hiphil ng עמד; mas malinaw sa kasalukuyang Tagalog ang 'mga ninuno' kaysa literal na 'mga ama' sa kontekstong pangkasaysayan.
- source_word: רַק אִם
  choice: kung ... lamang
  rationale: Pinananatili nito ang mahigpit at tunay na kondisyon sa pangako nang hindi ito ginagawang paghiling o pag-asam.
- source_word: יִשְׁמְרוּ לַעֲשׂוֹת
  choice: iingatan nilang gawin
  rationale: Sinasaklaw nito kapwa ang maingat na pagsunod at aktuwal na paggawa, at pinananatili ang pamilyar na wikang biblikal nang hindi lipas.
- source_word: כָּל אֲשֶׁר צִוִּיתִים
  choice: ang lahat ng iniutos ko sa kanila
  rationale: Tuwirang pinananatili ang kabuuan ng utos at ang panghalip na tumutukoy sa Israel.
- source_word: לְכָל הַתּוֹרָה
  choice: ayon sa buong Kautusan
  rationale: Sa talaang legal na kasama ang mga tuntunin at mga hatol, ang 'Kautusan' ang malinaw na katumbas ng תּוֹרָה; ipinahahayag ng 'ayon sa' ang ugnayang dala ng לְ.
- source_word: הַחֻקִּים
  choice: mga tuntunin
  rationale: Natural itong terminong legal sa modernong Tagalog at nananatiling naiiba sa 'mga hatol.'
- source_word: הַמִּשְׁפָּטִים
  choice: mga hatol
  rationale: Pinananatili nito ang hudisyal na himig ng salitang Hebreo.
- source_word: בְּיַד מֹשֶׁה
  choice: ibinigay sa pamamagitan ni Moises
  rationale: Malinaw na ipinahahayag ang idyomatikong diwa ng pagkilos o paghahatid sa pamamagitan ni Moises; itinatala sa talababa ang literal na larawan.
theological_decisions:
- issue: May-kondisyong pananatili ng Israel sa lupain
  choice: Inilalahad ang hindi pagpapaalis bilang nakasalalay sa maingat na pagsunod ng Israel.
  alternative: Unawain ito bilang lubos na walang-kondisyong garantiya, o bilang retorikal lamang na kondisyon.
  rationale: Tahasan sa Hebreo ang רַק אִם at יִשְׁמְרוּ לַעֲשׂוֹת. Pinananatili ng salin ang tunay na kondisyon nang hindi nilulutas ang mas malawak na mga usaping teolohikal tungkol sa tipan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Sinasadyang panatilihin sa pangunahing teksto ang larawang “paa ng Israel,” ngunit nililinaw ito sa talababa. Ginamit ang malaking titik sa “Kautusan” bilang tawag sa kabuuang kautusang ibinigay sa pamamagitan ni Moises, samantalang nananatiling karaniwang pangngalan ang “mga tuntunin” at “mga hatol.”
