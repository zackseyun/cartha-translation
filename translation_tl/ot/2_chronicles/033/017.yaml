id: 2CH.33.17
reference: 2 Chronicles 33:17
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: אֲבָל֙ ע֣וֹד הָ/עָ֔ם זֹבְחִ֖ים בַּ/בָּמ֑וֹת רַ֖ק לַ/יהוָ֥ה אֱלֹהֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/017.yaml
  text: Nevertheless[a], the people still sacrificed at the high places, but only to Yahweh their God.
translation:
  language: tl
  text: Gayunman[a], naghahain pa rin ang bayan sa matataas na lugar, ngunit para lamang kay Yahweh na kanilang Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Ngunit.”
    reason: Posibleng mas payak na katumbas ng אֲבָל; kapuwa nito ipinahahayag ang pagsalungat sa naunang konteksto.
lexical_decisions:
- source_word: אֲבָל
  choice: Gayunman
  rationale: 'Ipinahahayag nito ang pagsalungat na may diwang konsesibo: sa kabila ng naunang mga reporma, nagpatuloy ang gawaing ito.'
- source_word: עוֹד
  choice: pa rin
  rationale: Ipinakikita ang pagpapatuloy ng paghahain sa panahong inilalarawan.
- source_word: הָעָם
  choice: ang bayan
  rationale: Likas na kolektibong katawagan sa mga mamamayan sa salaysay.
- source_word: זֹבְחִים
  choice: naghahain
  rationale: Tuwirang inilalarawan ang pag-aalay ng mga hain at ang nagpapatuloy na gawain ng participle sa Hebreo.
- source_word: בַּבָּמוֹת
  choice: sa matataas na lugar
  rationale: Pinananatili ang kinikilalang kahulugan ng בָּמוֹת bilang mga lokal na lugar ng pagsamba nang hindi nagdaragdag ng bagay na hindi tahasang binanggit.
- source_word: רַק
  choice: ngunit para lamang
  rationale: Nililinaw ang pagtatakda sa tumatanggap ng mga hain, kasabay ng panimbang na diwa ng sugnay.
- source_word: לַיהוָה
  choice: kay Yahweh
  rationale: Ang pang-ukol ay tumutukoy sa pinag-uukulan ng hain, at pinananatili ang personal na pangalan ng Diyos.
- source_word: אֱלֹהֵיהֶם
  choice: na kanilang Diyos
  rationale: Natural na Filipino para sa konstruktong may hulaping panghalip na nangangahulugang 'kanilang Diyos.'
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON o Jehovah
  rationale: Tuwirang ginagamit ng talata ang Tetragrammaton; ang 'Yahweh' ay nagpapanatili sa tipanang pangalan sa halip na palitan ito ng titulo.
- issue: Saklaw ng רַק sa sugnay tungkol sa matataas na lugar
  choice: Ang mga hain ay iniuukol lamang kay Yahweh, bagaman inihahain pa rin sa matataas na lugar.
  alternative: Sa mga matataas na lugar lamang na nakatalaga kay Yahweh naghahain ang bayan.
  rationale: Sa ayos ng Hebreo, nililimitahan ng רַק לַיהוָה אֱלֹהֵיהֶם ang pinag-uukulan ng hain, hindi ang lokasyon. Sa gayon, nananatili ang tensiyon na hindi lubos ang reporma kahit si Yahweh lamang ang sinasamba roon.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “matataas na lugar” sa halip na mas lumang “matataas na dako,” at iniwasang dagdagan ng “dambana” o “sambahan” ang pangunahing teksto dahil hindi tahasang naroon ang mga salitang iyon sa Hebreo.
