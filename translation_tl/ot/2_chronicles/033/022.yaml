  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יַּ֤עַשׂ הָ/רַע֙ בְּ/עֵינֵ֣י יְהוָ֔ה כַּ/אֲשֶׁ֥ר עָשָׂ֖ה מְנַשֶּׁ֣ה אָבִ֑י/ו וּֽ/לְ/כָל הַ/פְּסִילִ֗ים אֲשֶׁ֤ר עָשָׂה֙ מְנַשֶּׁ֣ה אָבִ֔י/ו זִבַּ֥ח אָמ֖וֹן וַ/יַּֽעַבְדֵֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/022.yaml
  text: He did what was evil in the sight of Yahweh[a], just as Manasseh his father had done[b]. Amon sacrificed to all the carved images that Manasseh his father had made and served them.
translation:
  language: tl
  text: Ginawa niya ang masama sa paningin ni Yahweh, gaya ng ginawa ng kanyang amang si Manases. Naghandog si Amon ng mga hain sa lahat ng larawang inukit[a] na ginawa ng kanyang amang si Manases, at naglingkod siya sa mga iyon[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga diyus-diyosan.” Partikular na tumutukoy ang Hebreo sa mga larawang nililok o inuukit.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “sinamba niya ang mga iyon.” Literal na “naglingkod siya sa mga iyon”; madalas gamitin ang pandiwang Hebreo para sa relihiyosong paglilingkod.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ הָרַע
  choice: Ginawa niya ang masama
  rationale: Likas na ipinapahayag sa Filipino ang Hebreong idyomang עשה + הרע at pinananatili ang tahasang moral na paghatol.
- source_word: בְּעֵינֵי יְהוָה
  choice: sa paningin ni Yahweh
  rationale: Pinananatili ang larawang-diwa ng Hebreong idyoma tungkol sa pagsusuri o paghatol ng Diyos, sa paraang malinaw sa modernong Filipino.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ang personal na pangalang banal sa pamamagitan ng karaniwang transliterasyon nito, sa halip na palitan ito ng isang titulo.
- source_word: כַּאֲשֶׁר עָשָׂה מְנַשֶּׁה אָבִיו
  choice: gaya ng ginawa ng kanyang amang si Manases
  rationale: Malinaw na ipinakikita ang paghahambing sa ginawa ng ama ni Amon at natural ang ayos ng pangalan at kaugnayan sa Filipino.
- source_word: הַפְּסִילִים
  choice: mga larawang inukit
  rationale: Pinananatili ang tiyak na diwa ng פסילים bilang mga imaheng nililok o inuukit, hindi lamang ang mas malawak na katawagang 'mga diyus-diyosan.'
- source_word: זִבַּח
  choice: Naghandog ... ng mga hain
  rationale: Ipinahahayag ang kultikong kahulugan ng pandiwa bilang paghahandog ng hain at ginagawang natural ang pangungusap sa Filipino.
- source_word: וַיַּעַבְדֵם
  choice: at naglingkod siya sa mga iyon
  rationale: Pinananatili ang batayang kahulugan na 'maglingkod'; ipinahihiwatig ng konteksto na ito ay relihiyosong paglilingkod o pagsamba.
- source_word: אָמֹון
  choice: Amon
  rationale: Ginamit ang nakagawiang anyong Filipino ng personal na pangalan.
theological_decisions:
- issue: Pagbibigay-kahulugan sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo; pinananatili ito bilang pangalan sa halip na palitan ng titulong 'PANGINOON.'
- issue: Kahulugan ng עבד sa konteksto ng idolatriya
  choice: naglingkod siya sa mga iyon
  alternative: sinamba niya ang mga iyon
  rationale: Ang batayang kahulugan ng pandiwa ay paglilingkod. Bagaman relihiyosong pagsamba ang ipinahihiwatig ng konteksto, hindi ito tahasang nililimitahan ng salin sa salitang 'sumamba.'
translation_notes:
  register: Modernong Filipino na may marangal at malinaw na himig. Pinanatili ang Hebreong idyomang “sa paningin ni Yahweh” dahil nauunawaan ito at mahalaga ang larawang-diwa nito. Inilagay ang mga panandang [a] at [b] sa mismong mga salitang tinatalakay ng kaukulang talababa.
