  source_fidelity: 'Tumpak ang salin sa Hebreo: ipinahahayag nito ang paggawa ni Amon ng masama sa paningin ni Yahweh, ang pagtulad niya kay Manases na kanyang ama, ang paghahandog niya sa lahat ng larawang inukit na ginawa ni Manases, at ang paglilingkod niya sa mga ito. Napananatili ang saklaw ng "lahat" at ang magkahiwalay na kilos na maghandog at maglingkod.'
  naturalness: Natural at malinaw ang modernong Filipino. Ang "sa paningin ni Yahweh," "gaya ng ginawa ng kanyang amang si Manases," at "Naghandog ... ng mga hain" ay angkop sa marangal na rehistro ng salaysay.
  terminology: Wasto at pare-pareho ang "Yahweh," "Manases," "Amon," at "mga larawang inukit." Ang "naglingkod siya sa mga iyon" ay malapit sa Hebreong עבד at hindi labis na binibigyang-kahulugan bilang pagsamba. Nakatali nang tama ang talababa a sa "larawang inukit" at b sa "mga iyon," na siyang tinutukoy na terminong Hebreo.
