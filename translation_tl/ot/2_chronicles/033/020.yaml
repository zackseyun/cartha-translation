base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/020.yaml
  text: And Manasseh slept with his fathers[a], and they buried him in his house. And Amon his son reigned in his place.
translation:
  language: tl
  text: At nahimlay si Manases kasama ng kanyang mga ninuno, at inilibing nila siya sa kanyang bahay[a]. Ang anak niyang si Amon ay naghari bilang kahalili niya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa kanyang palasyo.” “Bahay” ang literal na sinasabi ng Hebreo, ngunit sa konteksto ng isang hari maaari itong tumukoy sa palasyo o sa kompleks ng palasyo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: namahinga
  rationale: Pinananatili nito ang magalang na Hebreong talinghaga para sa kamatayan nang hindi nagiging di-likas sa makabagong Tagalog ang literal na “natulog.”
- source_word: עִם אֲבֹתָיו
  choice: kasama ng kanyang mga ninuno
  rationale: Ang “mga ninuno” ang likas at malinaw na katumbas sa Tagalog ng karaniwang pormula tungkol sa pagkamatay ng isang hari; hindi nito ipinapahiwatig na sa iisang libingan sila inilibing.
- source_word: וַיִּקְבְּרֻהוּ
  choice: inilibing nila siya
  rationale: Tuwirang ipinapakita ang aktibong pandiwang maramihan at ang layong panghalip ng Hebreo.
- source_word: בֵּיתוֹ
  choice: sa kanyang bahay
  rationale: Pinananatili ang pangunahing kahulugan ng בַּיִת, habang inilalagay sa talababa ang posibleng kahulugang palasyo sa konteksto ng hari.
- source_word: וַיִּמְלֹךְ
  choice: ang naghari
  rationale: Maikli at likas na paglalarawan ito ng paghalili sa paghahari.
- source_word: תַּחְתָּיו
  choice: bilang kahalili niya
  rationale: Malinaw at natural nitong ipinapahayag ang paghalili sa posisyon ng hari.
