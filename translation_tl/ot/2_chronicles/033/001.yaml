base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/001.yaml
  text: Manasseh was twelve years old when he began to reign, and he reigned fifty-five years in Jerusalem.
translation:
  language: tl
  text: Labindalawang taong gulang si Manases nang maging hari siya, at limampu't limang taon siyang naghari sa Jerusalem.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן שְׁתֵּים עֶשְׂרֵה שָׁנָה
  choice: Labindalawang taong gulang
  rationale: Karaniwang pormula ito sa Hebreo para tukuyin ang edad. Likas at tumpak sa modernong Tagalog ang “labindalawang taong gulang.”
- source_word: מְנַשֶּׁה
  choice: Manases
  rationale: Ginamit ang nakaugaliang anyo ng pangalang ito sa mga saling Bibliya sa Tagalog.
- source_word: בְמָלְכוֹ
  choice: nang maging hari siya
  rationale: Sa pormulang panghari, tinutukoy nito ang panahon ng pagluklok o pagsisimula ng paghahari. Likas sa Tagalog ang “nang maging hari siya.”
- source_word: וַחֲמִשִּׁים וְחָמֵשׁ שָׁנָה
  choice: limampu't limang taon
  rationale: Ito ang natural na modernong Tagalog na pagpapahayag ng tambalang bilang na limampu at lima.
- source_word: מָלַךְ
  choice: naghari
  rationale: Sa kontekstong ito, ang pandiwang Hebreo ay tumutukoy sa pamamahala bilang hari; maikli at tumpak ang “naghari.”
- source_word: בִּירוּשָׁלִָם
  choice: sa Jerusalem
  rationale: Ang pang-ukol na Hebreo ay nagmamarka ng lugar; “sa Jerusalem” ang tuwirang katumbas sa Tagalog.
