  source_fidelity: 'Tapat ang salin sa pagkakasunod at saklaw ng Hebreo: pinananatili ang idyomang “pinaraan ... sa apoy,” ang pook na Lambak ng Anak ni Hinom, ang magkakaibang gawaing okulto, at ang pagpaparami ng paggawa ng masama hanggang sa paggalit kay Yahweh. Ang “kaya ginalit niya siya” ay katanggap-tanggap na pagbasa ng לְהַכְעִיסוֹ bilang bunga, nang hindi labis na ipinipilit ang motibo.'
