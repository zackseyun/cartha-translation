id: 2CH.33.6
reference: 2 Chronicles 33:6
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/הוּא֩ הֶעֱבִ֨יר אֶת בָּנָ֤י/ו בָּ/אֵשׁ֙ בְּ/גֵ֣י בֶן הִנֹּ֔ם וְ/עוֹנֵ֤ן וְ/נִחֵשׁ֙ וְֽ/כִשֵּׁ֔ף וְ/עָ֥שָׂה א֖וֹב וְ/יִדְּעוֹנִ֑י הִרְבָּ֗ה לַ/עֲשׂ֥וֹת הָ/רַ֛ע בְּ/עֵינֵ֥י יְהוָ֖ה לְ/הַכְעִיסֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/006.yaml
  text: He made his sons pass through the fire in the Valley of the Son of Hinnom[a], practiced soothsaying and divination and sorcery, and dealt with mediums and spiritists. He multiplied doing what was evil in the eyes of Yahweh[b], provoking him to anger.
translation:
  language: tl
  text: Pinaraan niya sa apoy ang kanyang mga anak sa Lambak ng Anak ni Hinom[a]. Nagsagawa siya ng panghuhula, pagbasa ng mga tanda, at pangkukulam, at nakitungo sa mga medium at espiritista[b]. Napakarami niyang ginawang masama sa paningin ni Yahweh, kaya ginalit niya siya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O mas tahasan, “inihandog niya sa apoy ang kanyang mga anak.” Literal sa Hebreo: “pinaraan niya sa apoy ang kanyang mga anak.”'
    reason: lexical_alternative
  - marker: b
    text: Ang “mga medium at espiritista” ay salin ng mga katawagang Hebreo para sa mga taong kaugnay ng pagsangguni sa mga patay o sa mga espiritu.
    reason: cultural_note
lexical_decisions:
- source_word: הֶעֱבִיר אֶת־בָּנָיו בָּאֵשׁ
  choice: Pinaraan niya sa apoy ang kanyang mga anak
  rationale: Pinananatili ang konkretong idyomang Hebreo at ang tunay na anakalahatang saklaw nito, habang inilalagay sa talababa ang malinaw na implikasyon ng paghahandog ng mga anak.
- source_word: בְּגֵי בֶן־הִנֹּם
  choice: sa Lambak ng Anak ni Hinom
  rationale: Tuwirang isinasalin ang heograpikong pangalan at pinananatili sa transliterasyon ang pangalang Hinom.
- source_word: וְעוֹנֵן
  choice: Nagsagawa siya ng panghuhula
  rationale: Ipinahihiwatig ng pandiwa ang gawaing panghuhula o soothsaying; pinili ang karaniwang terminong Filipino nang hindi ito ipinapantay sa kasunod na pagbasa ng mga tanda.
- source_word: וְנִחֵשׁ
  choice: pagbasa ng mga tanda
  rationale: Ipinakikita nang mas tiyak ang kaugnayan ng pandiwa sa pagpapakahulugan sa mga tanda o omen at naihihiwalay ito sa naunang uri ng panghuhula.
- source_word: וְכִשֵּׁף
  choice: pangkukulam
  rationale: Natural at malinaw na katumbas sa modernong Filipino para sa paggamit ng mahika o mga orasyon.
- source_word: וְעָשָׂה אוֹב וְיִדְּעוֹנִי
  choice: nakitungo sa mga medium at espiritista
  rationale: Ang malawak na pandiwang “nakitungo” ay hindi nagpapasiya kung siya ay kumonsulta, kumuha, o personal na nagsagawa ng mga gawaing ito. Ang dalawang katawagan ay nililinaw sa talababa.
- source_word: הִרְבָּה לַעֲשׂוֹת
  choice: Napakarami niyang ginawang
  rationale: Natural sa Filipino ngunit pinananatili ang diin ng konstruksiyong Hebreo sa kasaganaan at paglala ng kanyang paggawa ng masama.
- source_word: הָרַע בְּעֵינֵי יְהוָה
  choice: masama sa paningin ni Yahweh
  rationale: Pinananatili ang pormulang Hebreo na “sa paningin” at direktang inilalahad ang banal na pangalang Yahweh.
- source_word: לְהַכְעִיסוֹ
  choice: kaya ginalit niya siya
  rationale: Inihahayag ang bunga ng kanyang mga ginawa nang hindi ipinipilit na ang tanging layunin niya ay galitin si Yahweh.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Nasa tekstong Hebreo ang Tetragrammaton; pinananatili ang personal na pangalang tipan sa anyong Yahweh.
- issue: Kung tahasang tatawaging paghahandog ang pagpaparaan sa apoy
  choice: Panatilihin sa pangunahing teksto ang idyomang “pinaraan niya sa apoy”
  alternative: Sinunog o inihandog niya sa apoy ang kanyang mga anak
  rationale: Malakas ang implikasyon ng idyoma na ito ay ritwal ng paghahandog ng mga anak, ngunit hindi tahasang ginagamit ng talata ang pandiwang “inihandog”; kaya pinananatili ang anyo at inilalagay ang mas tahasang pagpapakahulugan sa talababa.
- issue: Layunin o bunga sa לְהַכְעִיסוֹ
  choice: kaya ginalit niya siya
  alternative: upang galitin siya
  rationale: Maaaring magpahayag ang infinitive ng layunin o bunga. Ang “kaya” ay natural na naglalahad ng bunga at umiiwas na ipalagay nang tiyak ang panloob na motibo ni Manases.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “kanyang” sa halip na mas kolokyal na “kaniyang,” at pinanatili ang mga terminong ritwal nang hindi nagdaragdag ng denominasyonal na pagpapakahulugan.
