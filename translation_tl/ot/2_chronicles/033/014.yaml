  to: Pagkatapos nito, nagtayo siya ng isang panlabas na pader para sa Lungsod ni David, sa kanluran ng Gihon sa libis, hanggang sa pasukan ng Tarangkahan ng mga Isda.[a] Pinaligiran niya[c] ang Ofel,[b] at lubha niyang pinataas ang pader. Naglagay rin siya ng mga pinuno ng hukbo sa lahat ng pinatibay na lungsod sa Juda.
