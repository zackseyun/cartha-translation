  text: וְ/אַחֲרֵי כֵ֡ן בָּנָ֣ה חוֹמָ֣ה חִֽיצוֹנָ֣ה לְ/עִיר דָּוִ֡יד מַעְרָבָ/ה֩ לְ/גִיח֨וֹן בַּ/נַּ֜חַל וְ/לָ/ב֨וֹא בְ/שַׁ֤עַר הַ/דָּגִים֙ וְ/סָבַ֣ב לָ/עֹ֔פֶל וַ/יַּגְבִּיהֶ֖/הָ מְאֹ֑ד וַ/יָּ֧שֶׂם שָֽׂרֵי חַ֛יִל בְּ/כָל הֶ/עָרִ֥ים הַ/בְּצֻר֖וֹת בִּ/יהוּדָֽה־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/014.yaml
  text: After this he built an outer wall for the city of David[a], west of Gihon in the valley, as far as the entrance of the Fish Gate; it went around Ophel, and he made it very high[c][b]. He also placed military commanders in all the fortified cities in Judah.
translation:
  language: tl
  text: Pagkatapos nito, nagtayo siya ng isang panlabas na pader para sa Lungsod ni David, sa kanluran ng Gihon sa libis, hanggang sa pasukan ng Tarangkahan ng mga Isda.[a] Pinaligiran niya[c] ang Ofel,[b] at lubha niyang pinataas ang pader. Naglagay rin siya ng mga pinuno ng hukbo sa lahat ng pinatibay na lungsod sa Juda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “at patungo sa pasukan ng Tarangkahan ng mga Isda.” Maaaring tukuyin ng Hebreo ang direksiyon o hangganan ng pader patungo sa tarangkahang iyon.
    reason: lexical_alternative
  - marker: b
    text: Ang “Ofel” ay pangalan ng isang mataas na pook sa Jerusalem, malamang na nasa timog ng lugar ng templo.
    reason: cultural_note
  - marker: c
    text: Maaari ring unawain na “umíkot ito sa Ofel,” na ang tinutukoy ay ang landas ng pader. Ang pandiwang Hebreo ay maaaring mangahulugang lumibot o pumalibot.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחֲרֵי כֵן
  choice: Pagkatapos nito
  rationale: Likas na panandang temporal sa makabagong Filipino na pinananatili ang pagkakasunod-sunod ng salaysay.
- source_word: בָּנָה
  choice: nagtayo
  rationale: Pangunahing kahulugan ng pandiwa ang pagtatayo; hindi nito tahasang hinihingi ang ‘muling nagtayo.’
- source_word: חוֹמָה חִיצוֹנָה
  choice: isang panlabas na pader
  rationale: Tuwirang ipinapahayag ang pader na nasa labas nang hindi nagdaragdag ng haka tungkol sa estruktura nito.
- source_word: לְעִיר דָּוִיד
  choice: para sa Lungsod ni David
  rationale: Ipinakikita ng ‘para sa’ ang kaugnayan ng pader sa lungsod at natural ito sa Filipino.
- source_word: מַעְרָבָה לְגִיחוֹן בַּנַּחַל
  choice: sa kanluran ng Gihon sa libis
  rationale: Pinananatili ang direksiyong heograpikal at ang karaniwang kahulugan ng נחל bilang libis sa kontekstong ito.
- source_word: וְלָבוֹא בְשַׁעַר הַדָּגִים
  choice: hanggang sa pasukan ng Tarangkahan ng mga Isda
  rationale: Natural na ipinahahayag ang saklaw o hantungan ng pader; inilalagay sa talababa ang posibleng pagbasa bilang direksiyon patungo sa pasukan.
- source_word: וְסָבַב לָעֹפֶל
  choice: Pinaligiran niya ang Ofel
  rationale: Ang pandiwa ay panlalaking isahan at natural na nagpapatuloy kay Manases bilang paksa; gayunman, maaaring ilarawan ng parirala ang landas ng pader, kaya itinatala ang posibilidad na iyon sa talababa.
- source_word: הָעֹפֶל
  choice: Ofel
  rationale: Pangalan ito ng isang pook sa Jerusalem, kaya tinumbasan sa transliterasyon at hindi isinalin bilang karaniwang pangngalan.
- source_word: וַיַּגְבִּיהֶהָ מְאֹד
  choice: lubha niyang pinataas ang pader
  rationale: Malinaw na tinutukoy ng pambabaeng hulapi ang pader; ang ‘lubha’ ay nagpapanatili sa diin ng מְאֹד.
- source_word: שָׂרֵי חַיִל
  choice: mga pinuno ng hukbo
  rationale: Malinaw at dignified na modernong Filipino para sa mga opisyal o kumandanteng militar.
- source_word: בְּכָל הֶעָרִים הַבְּצֻרוֹת
  choice: sa lahat ng napapaderang lungsod
  rationale: Ipinahahayag ang mga lungsod na pinatibay sa pamamagitan ng mga pader nang maikli at madaling maunawaan.
