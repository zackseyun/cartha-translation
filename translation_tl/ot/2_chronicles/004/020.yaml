  text: וְ/אֶת הַ/מְּנֹר֞וֹת וְ/נֵרֹתֵי/הֶ֗ם לְ/בַעֲרָ֧/ם כַּ/מִּשְׁפָּ֛ט לִ/פְנֵ֥י הַ/דְּבִ֖יר זָהָ֥ב סָגֽוּר־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/020.yaml
  text: the lampstands and their lamps[a], to burn according to the ordinance before the inner sanctuary, of pure gold[b];
translation:
  language: tl
  text: ang mga patungan ng ilawan at ang mga ilawan ng mga iyon, upang panatilihing nagniningas ayon sa itinakdang tuntunin sa harap ng panloob na santuwaryo[a]—pawang yari sa dalisay na ginto[b];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Kabanal-banalang Dako.” Ang salitang Hebreo na דְּבִיר ay tumutukoy sa panloob na santuwaryo ng templo.
    reason: lexical_alternative
  - marker: b
    text: O “pinadalisay na ginto.” Ang pariralang Hebreo ay tumutukoy sa mataas na uri ng gintong pinadalisay.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמְּנֹרוֹת
  choice: mga patungan ng ilawan
  rationale: Ang מְנוֹרָה ay patungan o lalagyan ng mga ilawan. Malinaw ito sa karaniwang mambabasang Filipino at iniiwasan ang di-kinakailangang transliterasyong “menora.”
- source_word: וְנֵרֹתֵיהֶם
  choice: at ang mga ilawan ng mga iyon
  rationale: Ang נֵר ay tumutukoy sa ilawan o apoy nito; sa talaan ng mga kagamitan sa templo, “mga ilawan” ang pinakanatural at kongkretong salin.
- source_word: לְבַעֲרָם
  choice: upang panatilihing nagniningas
  rationale: Ipinapahayag ng anyo ang layuning pagningasin o panatilihing nagniningas ang mga ilawan. Ipinakikita ng salin ang causative na diwa nang hindi nagiging salitang-salita.
- source_word: כַּמִּשְׁפָּט
  choice: ayon sa itinakdang tuntunin
  rationale: Sa kontekstong pangtemplo, ang מִשְׁפָּט ay tumutukoy sa itinakdang kaayusan o tuntunin. Pinananatili ng salin ang pormal na diwa nito.
- source_word: לִפְנֵי הַדְּבִיר
  choice: sa harap ng panloob na santuwaryo
  rationale: Ang דְּבִיר ay ang pinakaloob na silid o santuwaryo ng templo. Tumpak at madaling maunawaan ang “panloob na santuwaryo” nang hindi tahasang ipinapalit ang tradisyonal na katawagang maaaring mas espesipiko.
- source_word: זָהָב סָגוּר
  choice: dalisay na ginto
  rationale: Ang parirala ay naglalarawan ng mataas na uri at pinadalisay na ginto. Natural sa Filipino ang “dalisay na ginto,” samantalang magiging malabo ang literal na “saradong ginto.”
- source_word: וְאֶת
  choice: ang
  rationale: Nagpapatuloy ang talata sa listahan mula sa naunang pangungusap. Hindi kailangang tumbasan nang mekanikal ang pangatnig at pananda ng tuwirang layon sa Hebreo.
theological_decisions:
- issue: Pagkatawag sa דְּבִיר
  choice: panloob na santuwaryo
  alternative: Kabanal-banalang Dako
  rationale: Pinananatili ng pangunahing salin ang leksikal na diwa ng pinakaloob na santuwaryo at inilalagay sa talababa ang tradisyonal at mas interpretatibong katawagan.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “patungan ng ilawan” sa halip na transliterasyong “menora,” at ang estruktura ay nananatiling bahagi ng nagpapatuloy na talaan ng mga kagamitan sa templo. Inilipat ang [a] sa “panloob na santuwaryo,” na siyang aktuwal na tinutukoy ng talababa.
