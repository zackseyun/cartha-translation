  source_fidelity: Ang "ipinahulma" ay nagpapahiwatig na ipinagawa o ipinag-utos lamang ng hari ang gawain, samantalang ang Hebreong יְצָקָם ay tuwirang nagsasabing ang hari ang naghulma/nagpatunaw at nagbuhos ng mga iyon. Mas tapat ang "inihulma ng hari." Ang "siksik na lupang luwad" ay maingat na naihahayag ang diwa ng עֲבִי הָאֲדָמָה nang hindi nagdaragdag ng mga hulmahan na hindi tahasang binanggit sa teksto.
  naturalness: Natural at marangal sa modernong Filipino ang rebisadong pangungusap. Ang "Kapatagan ng Jordan," "sa pagitan ng," at ang mga transliteradong pangalan ng lugar ay malinaw at angkop sa rehistro ng Kasulatan.
  terminology: Pinanatili ang "Jordan," "Sucot," at "Zeredah." Inayos ang talababa upang tukuyin nang mas wasto ang aklat na "1 Hari" at ang anyong "Zarethan" sa katumbas na talata, habang pinananatili ang tekstuwal na pagkakaiba ng Zeredah sa Mga Cronica.
