  yaml_path: translation/ot/2_chronicles/004/017.yaml
  text: In the plain of the Jordan the king cast them in the clay ground[a], between Sukkoth and Zeredah.
translation:
  language: tl
  text: Sa Kapatagan ng Jordan, inihulma ng hari ang mga ito sa siksik na lupang luwad, sa pagitan ng Sucot at Zeredah.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa katulad na salaysay sa 1 Hari 7:46, “Zarethan” ang pangalan ng lugar. “Zeredah” ang mababasa rito sa Mga Cronica, na malamang ay ibang anyo ng pangalan ng lugar ding iyon.
    reason: textual_variant
lexical_decisions:
- source_word: בְּכִכַּר הַיַּרְדֵּן
  choice: Sa Kapatagan ng Jordan
  rationale: Ang כִּכָּר ay maaaring tumukoy sa isang malawak at patag na rehiyon. Ang “Kapatagan ng Jordan” ay natural sa Filipino at angkop sa heograpikong konteksto.
- source_word: יְצָקָם
  choice: ipinahulma ... ang mga ito
  rationale: Ang יָצַק ay tumutukoy rito sa pagbubuhos ng tunaw na metal upang mahulma. Ipinahihiwatig ng anyong causative sa Filipino na iniutos o pinangasiwaan ng hari ang paggawa, nang hindi idinaragdag na siya mismo ang gumawa.
- source_word: הַמֶּלֶךְ
  choice: ng hari
  rationale: Tiyak na pangngalan ito na tumutukoy sa hari sa konteksto; tuwirang isinalin bilang “ang hari,” na naging “ng hari” ayon sa balangkas ng pangungusap.
- source_word: בַּעֲבִי הָאֲדָמָה
  choice: sa luwad na lupa
  rationale: Literal na may diwa ng kapal o siksik na katangian ang עֲבִי, ngunit kasama ng אֲדָמָה sa konteksto ng paghuhulma ng metal, tumutukoy ito sa siksik at maluwad na lupang angkop sa mga hulmahan.
- source_word: בֵּין סֻכּוֹת וּבֵין צְרֵדָתָה
  choice: sa pagitan ng Sucot at Zeredah
  rationale: Tinumbasan ang mga pangalang-heograpiko sa anyong madaling basahin sa modernong Filipino, habang pinanatili ang “Zeredah” na pagbasa ng teksto ng Cronica.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “ipinahulma” upang natural na maipahayag ang paghahagis o casting ng metal sa konteksto, at “luwad na lupa” upang maipakita ang praktikal na gamit ng siksik na lupa bilang hulmahan.
