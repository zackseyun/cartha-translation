  text: Solomon made all these vessels in very great abundance[a], for the weight of the bronze could not be determined.
translation:
  language: tl
  text: Ginawa ni Solomon ang lahat ng kagamitang ito sa napakaraming dami, sapagkat hindi matiyak ang bigat ng tanso.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “hindi siniyasat ang bigat ng tanso.” Ang pandiwang Hebreo ay maaaring mangahulugang “siyasatin” o “tiyakin”; ipinahihiwatig ng konteksto na napakarami ng tanso kaya hindi kinalkula ang bigat nito.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Ginawa
  rationale: Ang karaniwang pandiwang עשה ay tuwirang tumutukoy sa paggawa ng mga kagamitan para sa templo.
- source_word: כָּל הַכֵּלִים הָאֵלֶּה
  choice: ang lahat ng kagamitang ito
  rationale: Malawak ang saklaw ng כֵּלִים para sa mga bagay o kasangkapan; natural at angkop sa konteksto ng templo ang “mga kagamitan.”
- source_word: לָרֹב מְאֹד
  choice: sa napakaraming dami
  rationale: Ipinahahayag ng parirala ang sukdulang kasaganaan o napakalaking kantidad, at pinananatili ng “napakaraming” ang diin ng מְאֹד.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala rito ng כִּי ang paliwanag sa naunang pahayag; ang “sapagkat” ay dignificado at malinaw na panandang sanhi.
- source_word: לֹא נֶחְקַר
  choice: hindi matiyak
  rationale: Ang Niphal ng חקר ay maaaring mangahulugang hindi nasiyasat o hindi natiyak; sa konteksto ng timbang, natural ang “hindi matiyak” habang pinananatili ang leksikal na lawak.
- source_word: מִשְׁקַל
  choice: ang bigat
  rationale: Tiyak na tumutukoy ang מִשְׁקַל sa timbang o bigat, hindi lamang sa pangkalahatang dami.
- source_word: הַנְּחֹשֶׁת
  choice: ng tanso
  rationale: Sa modernong Filipino, “tanso” ang karaniwang katawagan sa metal na נְחֹשֶׁת sa mga salaysay tungkol sa mga kagamitan ng templo; maaari itong tumukoy sa bronze sa sinaunang konteksto.
