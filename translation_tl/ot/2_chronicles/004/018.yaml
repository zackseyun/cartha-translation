  terminology: Ang “tanso” ay matatag na gamit sa Filipino Bibliya para sa נְחֹשֶׁת sa konteksto ng mga kagamitang pangtemplo, bagaman maaaring saklawin ng sinaunang termino ang bronze. Wasto rin ang “bigat” para sa מִשְׁקַל. Ang talababa ay maingat na nagbibigay ng leksikal na alternatibo nang hindi nagtatakda ng isang hindi kinakailangang interpretasyon.
