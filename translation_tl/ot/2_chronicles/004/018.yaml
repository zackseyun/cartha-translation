  source_fidelity: Tumpak ang salin sa Hebreo. Naipapahayag ng “Ginawa ni Solomon,” “lahat ng kagamitang ito,” at “sa napakaraming dami” ang paggawa ng lahat ng kagamitang nabanggit sa napakalaking kasaganaan. Ang “sapagkat hindi matiyak ang bigat ng tanso” ay isang angkop na kontekstuwal na pagsasalin ng לֹא נֶחְקַר מִשְׁקַל הַנְּחֹשֶׁת nang hindi inaalis ang saklaw na “hindi nasiyasat/hindi natiyak.”
