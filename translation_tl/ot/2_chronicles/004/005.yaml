base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/005.yaml
  text: Its thickness was a handbreadth[a], and its rim was like the work of the rim of a cup, like a lily blossom[b]. It could hold three thousand baths.
translation:
  language: tl
  text: Isang palad[a] ang kapal nito, at ang labi nito ay tulad ng pagkakayari ng labi ng isang kopa, gaya ng bulaklak ng liryo. Maaari itong maglaman ng tatlong libong bat[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “palad” ay isang sinaunang sukat na kasinlapad ng palad.
    reason: cultural_note
  - marker: b
    text: Ang bat ay isang sinaunang Hebreong yunit ng likidong sukat. Sa 1 Hari 7:26, dalawang libong bat ang sinasabing kasya sa malaking palanggana. Maaaring tumukoy ang dalawang bilang sa ganap na kapasidad at sa karaniwang laman nito, o maaaring sumasalamin ang mga ito sa pagkakaiba ng tradisyong tekstuwal.
    reason: cultural_note_and_cross_reference
lexical_decisions:
- source_word: עָבְיוֹ
  choice: ang kapal nito
  rationale: Tumutukoy ito sa kapal ng pader ng hinulmang malaking palanggana; malinaw at likas ang “kapal” sa kontekstong ito.
- source_word: טֶפַח
  choice: isang palad
  rationale: Ang טֶפַח ay maliit na sukat na batay sa lapad ng palad. Iniwasan ang “dangkal,” na karaniwang tumutukoy sa mas mahabang sukat mula hinlalaki hanggang hinliliit.
- source_word: שְׂפָתוֹ
  choice: ang labi nito
  rationale: Sa isang sisidlan, ang שָׂפָה ay ang labi o pinakaitaas na gilid. Pinananatili rin ng “labi” ang konkretong larawan ng Hebreo.
- source_word: כְּמַעֲשֵׂה שְׂפַת כּוֹס
  choice: tulad ng pagkakayari ng labi ng isang kopa
  rationale: Pinananatili nito ang sanggunian sa pagkakayari o disenyo (מַעֲשֵׂה), pati ang tuwirang paghahambing sa labi ng isang kopa.
- source_word: פֶּרַח שׁוֹשַׁנָּה
  choice: gaya ng bulaklak ng liryo
  rationale: Likas at malinaw na paglalarawan ito sa hugis-bulaklak na labi, nang hindi tinutukoy nang higit sa sinasabi ng teksto kung paano eksaktong nauugnay ang dalawang paghahambing.
- source_word: מַחֲזִיק ... יָכִיל
  choice: ang kaya nitong laman
  rationale: Magkasamang ipinahihiwatig ng participle at pandiwa ang kapasidad. Ang pariralang Filipino ay natural at iniiwasan ang mabigat na pag-uulit.
- source_word: בַּתִּים
  choice: bat
  rationale: Pangmaramihang anyo ito ng bat, isang sinaunang Hebreong yunit ng likidong sukat. Pinanatili ang katawagang pinagmulan sa halip na magbigay ng di-tiyak na modernong conversion.
- source_word: שְׁלֹשֶׁת אֲלָפִים
  choice: tatlong libo
  rationale: Tuwirang katumbas ng bilang sa tekstong Hebreo.
theological_decisions:
- issue: Pagkakaiba ng kapasidad sa 1 Hari 7:26
  choice: Pinanatili sa pangunahing teksto ang “tatlong libong bat,” ayon sa WLC ng 2 Cronica 4:5, at ipinaliwanag lamang sa talababa ang pagkakaiba.
  alternative: Iayon ang bilang sa “dalawang libong bat” ng 1 Hari 7:26 o ipaliwanag sa mismong talata kung bakit magkaiba.
  rationale: Ang pag-aayon ay magpapalit sa malinaw na bilang ng tekstong pinagmulan. Hindi rin tiyak kung ang pagkakaiba ay dahil sa ganap na kapasidad laban sa karaniwang laman, o dahil sa pagkakaiba ng tradisyong tekstuwal; kaya hindi ito dapat tahimik na lutasin.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “kopa” para sa sisidlang inuman at “labi” para sa itaas na gilid nito. Inilagay ang mga panandang talababa sa mismong mga salitang kanilang ipinapaliwanag upang maiwasan ang kalituhan sa ibinigay na English consultation layer.
