base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/007.yaml
  text: He made ten gold lampstands according to their prescribed design[a], and he placed them in the temple[c][b], five on the right side and five on the left.
translation:
  language: tl
  text: Gumawa siya ng sampung gintong patungan ng mga ilawan ayon sa itinakdang anyo ng mga ito[a], at inilagay niya ang mga ito sa templo[b]—lima sa kanan at lima sa kaliwa.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ayon sa itinakdang tuntunin ng mga ito” o “ayon sa kanilang padron.” Ang salitang Hebreo ay maaaring tumukoy sa itinakdang tuntunin, pamamaraan, o anyo.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “sa pangunahing bulwagan” o “sa santuwaryo.” Ang Hebreo ay tumutukoy sa mismong gusali ng templo, hindi sa mas malawak na kompleks nito.
    reason: lexical_alternative
  - marker: c
    text: Sa Hebreo, “lima sa kanan at lima sa kaliwa.” Batay sa pagkakaharap ng templo, maaaring tumugma ang mga ito sa gawing timog at gawing hilaga.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Gumawa siya
  rationale: Karaniwang pandiwang pasalaysay ang Qal wayyiqtol ng עשה. Likas sa modernong Tagalog ang “Gumawa siya,” at hindi na kailangang isalin nang hiwalay ang panimulang pang-ugnay.
- source_word: מְנֹרוֹת הַזָּהָב עֶשֶׂר
  choice: sampung gintong patungan ng ilawan
  rationale: Ang מְנוֹרָה ay patungan ng ilawan, hindi ang ilawan lamang. Ginamit ang natural na ayos ng bilang at panuring sa Tagalog.
- source_word: כְּמִשְׁפָּטָם
  choice: ayon sa itinakdang anyo ng mga iyon
  rationale: Maaaring tumukoy ang מִשְׁפָּט sa itinakdang tuntunin, kaayusan, o disenyo. Sa konteksto ng paggawa ng mga kagamitan sa templo, ipinahihiwatig nito ang pagsunod sa itinakdang espesipikasyon, habang pinananatili sa talababa ang ibang posibilidad.
- source_word: וַיִּתֵּן
  choice: at inilagay niya
  rationale: Bagaman pangunahing kahulugan ng נתן ang “magbigay,” sa kontekstong lokatibo ay nangangahulugan itong maglagay o magpuwesto.
- source_word: בַּהֵיכָל
  choice: sa templo
  rationale: Ang הֵיכָל dito ay tumutukoy sa mismong gusali ng templo, lalo na sa pangunahing bulwagan, at hindi sa buong bakuran o kompleks.
- source_word: חָמֵשׁ מִיָּמִין וְחָמֵשׁ מִשְּׂמֹאול
  choice: lima sa kanan at lima sa kaliwa
  rationale: Tahasang “kanan” at “kaliwa” ang Hebreo. Hindi ito pinalitan sa pangunahing teksto ng interpretatibong “timog” at “hilaga.”
