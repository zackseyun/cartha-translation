translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Pinili ang “patungan ng ilawan” upang tumpak na maiba ito sa ilawan mismo. Pinanatili ang literal na kanan at kaliwa at inilagay sa talababa ang posibleng kaugnayan sa timog at hilaga.
