  yaml_path: translation/ot/2_chronicles/004/014.yaml
  text: He made the stands[b][a], and he made the basins on the stands.
translation:
  language: tl
  text: Ginawa niya ang mga patungan[a], at ginawa niya ang mga palanggana[b] na nakapatong sa mga iyon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga tuntungan” o “mga base”; ang salitang Hebreo ay tumutukoy sa mga estrukturang sumusuporta sa mga palanggana.
    reason: lexical_alternative
  - marker: b
    text: Ang mga palangganang ito ay mga sisidlang ginagamit sa paghuhugas sa templo.
    reason: lexical_clarification
lexical_decisions:
- source_word: הַמְּכֹנוֹת
  choice: mga patungan
  rationale: Tumutukoy ang מְכוֹנוֹת sa mga ginawang suportang kinalalagyan ng mga palanggana. Likas at malinaw sa modernong Tagalog ang “mga patungan,” samantalang maaaring masyadong malabo ang “mga tuntungan” at masyadong tiyak ang “mga kariton.”
- source_word: עָשָׂה
  choice: ginawa
  rationale: Karaniwan at tuwirang katumbas ng עשה ang “ginawa”; hindi na kailangang dagdagan ng kulay na pansining ang payak na pandiwa.
- source_word: הַכִּיֹּרוֹת
  choice: mga palanggana
  rationale: Ang כִּיּוֹר ay sisidlang ginagamit sa paghuhugas. Malinaw at kasalukuyang Filipino ang “mga palanggana,” hindi gaya ng mga katawagang makaluma o teknikal.
- source_word: עַל
  choice: na nakapatong sa
  rationale: Ipinahihiwatig ng עַל ang pagkakalagay ng mga palanggana sa ibabaw ng mga patungan. Mas natural sa Tagalog ang sugnay na “na nakapatong sa” kaysa sa literal ngunit alanganing “sa ibabaw ng.”
- source_word: וְאֶת ... וְאֶת
  choice: at ... at
  rationale: Ang mga pang-ugnay ay nagdurugtong sa dalawang bagay na ginawa. Hindi isinasalin nang hiwalay ang mga pantukoy sa tuwirang layon, sapagkat wala itong likas na katumbas sa Tagalog.
