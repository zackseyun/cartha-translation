translation_notes:
  register: Modernong Filipino Tagalog na tuwiran, marangal, at madaling maunawaan. Iningatan ang pag-uulit ng “ginawa niya” sa Hebreo at nilinaw sa natural na Tagalog ang ugnayang pisikal ng mga palanggana at mga patungan.
