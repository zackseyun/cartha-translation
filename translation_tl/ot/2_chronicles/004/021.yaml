translation:
  language: tl
  text: ang mga bulaklak, ang mga ilawan, at ang mga sipit[a], na pawang yari sa dalisay na ginto.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga pang-ipit ng mitsa” o “mga pantabas ng mitsa.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, literal na “ginto—iyon ay mga kalubusan ng ginto,” isang di-pangkaraniwang parirala na malamang na tumutukoy sa gintong lubos na dinalisay o ganap ang pagkakayari.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַפֶּרַח
  choice: ang mga bulaklak
  rationale: Ang פֶּרַח ay literal na “bulaklak” o “pamumulaklak.” Bagaman isahan ang anyong Hebreo, maaari itong gamitin bilang kolektibong tawag sa mga palamuting hugis-bulaklak na kaugnay ng mga ilawan; natural sa Filipino ang maramihang “mga bulaklak” sa talaang ito.
- source_word: וְהַנֵּרוֹת
  choice: ang mga ilawan
  rationale: Ang נֵרוֹת ay karaniwang tumutukoy sa mga ilawan o liwanag. Ang “mga ilawan” ang malinaw at likas na tawag sa mga kagamitang ito sa templo.
- source_word: וְהַמֶּלְקַחַיִם
  choice: ang mga sipit
  rationale: Ang מֶלְקַחַיִם ay kagamitang pansunggab, lalo na para sa mitsa o baga. Pinili ang malawak at madaling maunawaang “mga sipit,” habang inilalahad sa talababa ang mas tiyak na gamit na maaaring ipinahihiwatig.
- source_word: זָהָב
  choice: na pawang yari sa ... ginto
  rationale: Ang unang זָהָב ay tumutukoy sa materyal ng mga nakalistang bagay. Ipinahihiwatig ng “pawang yari sa” na lahat ng ito ay ginto at nagbibigay ng natural na ugnayan sa Filipino.
- source_word: הוּא מִכְלוֹת זָהָב
  choice: dalisay na ginto
  rationale: Mahirap ang pariralang Hebreo, na literal na may diwang “ginto—iyon ay mga kalubusan/kaganapan ng ginto.” Sa konteksto, malamang na binibigyang-diin nito ang gintong lubos na dinalisay o ganap ang pagkakayari. Ang “dalisay na ginto” ay malinaw ngunit hindi gumagamit ng superlatibong wala sa Hebreo; pinananatili sa talababa ang hindi pangkaraniwang anyo ng parirala.
