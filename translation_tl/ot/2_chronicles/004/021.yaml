translation_notes:
  register: 'Makabago, malinaw, at marangal na Filipino. Ginamit ang “ilawan” at “sipit” bilang mga karaniwang salitang madaling maunawaan. Inilipat ang mga talababa sa mga salitang aktuwal na tinutukoy ng mga ito: [a] sa “mga sipit” at [b] sa “dalisay na ginto.”'
