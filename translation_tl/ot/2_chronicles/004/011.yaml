base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/011.yaml
  text: 'Huram made the pots[a], the shovels, and the bowls. So Huram finished the work that he did for King Solomon in the house of God:'
translation:
  language: tl
  text: 'Ginawa ni Huram[a] ang mga kaldero, mga pala, at mga mangkok. At tinapos ni Huram ang gawaing ginawa niya para kay Haring Solomon sa bahay ng Diyos:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang pangalang Hebreo ay binabaybay ding “Hiram” sa mga kaugnay na talata at sa tradisyong Ingles.
    reason: alternative_reading
lexical_decisions:
- source_word: חוּרָם / חירם
  choice: Huram
  rationale: Pinananatili ang anyong Huram na pinakamalapit sa anyo ng pangalan sa talatang ito; ang pamilyar na anyong Hiram ay inilagay sa talababa.
- source_word: הַסִּירוֹת
  choice: mga kaldero
  rationale: Tumutukoy ito sa mga sisidlang gaya ng mga pot. Mas angkop ang “kaldero” kaysa “palayok” dahil hindi nito ipinahihiwatig na yari sa luwad ang mga kagamitang ito.
- source_word: הַיָּעִים
  choice: mga pala
  rationale: Likas at tuwirang katumbas ito para sa mga kagamitang ginagamit sa pag-aalis ng abo o pagsalok ng materyal sa altar.
- source_word: הַמִּזְרָקוֹת
  choice: mga mangkok
  rationale: Malinaw na tawag ito sa mga mangkok na ginagamit sa paglilingkod sa templo nang hindi idinaragdag sa pangunahing teksto ang tiyak na ritwal na gamit nito.
- source_word: וַיְכַל
  choice: natapos
  rationale: Ipinahahayag nito ang pagkumpleto sa iniatas na gawain at natural ang anyo sa Filipino.
- source_word: לַעֲשׂוֹת אֶת הַמְּלָאכָה
  choice: ang gawaing ginawa niya
  rationale: Pinananatili ang diwa ng pagsasagawa at pagkumpleto sa gawa, habang ginagamit ang natural na ayos ng pangungusap sa Filipino.
- source_word: אֲשֶׁר עָשָׂה לַמֶּלֶךְ שְׁלֹמֹה
  choice: ginawa niya para kay Haring Solomon
  rationale: Tapat nitong inilalahad na ang paggawa ay isinagawa para sa hari, nang hindi dinaragdagan ang likas na malawak na kahulugan ng עשה.
- source_word: בְּבֵית הָאֱלֹהִים
  choice: sa bahay ng Diyos
  rationale: Pinananatili ang literal na larawang “bahay ng Diyos” at ang posibleng lokatibong diwa ng pang-ukol, sa halip na agad itong gawing “templo” o “para sa templo.”
theological_decisions: []
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Pinanatili ang “bahay ng Diyos” para sa pormal na pagkakatugma sa Hebreo, at ang tutuldok dahil nagpapatuloy sa susunod na talata ang talaan ng mga ginawa.
