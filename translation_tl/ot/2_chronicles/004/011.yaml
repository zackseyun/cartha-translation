  source_fidelity: 'Tumpak ang mga pangunahing katumbas: Huram, mga sisidlan, mga pala, mga mangkok, pagkumpleto ng gawain para kay Haring Solomon, at “bahay ng Diyos.” Gayunman, ang “Sa gayon” ay nagdaragdag ng malinaw na resultang ugnayan na hindi tahasang ipinapahayag ng magkakasunod na waw sa Hebreo; mas maingat ang simpleng “At.”'
