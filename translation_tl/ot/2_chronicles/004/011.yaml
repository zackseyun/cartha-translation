  terminology: Ang “mga kaldero,” “mga pala,” at “mga mangkok” ay katanggap-tanggap na mga modernong katumbas. Napananatili ang “bahay ng Diyos,” at ang tala sa “Hiram” ay angkop, ngunit nilinaw ang pagtukoy sa tradisyong Ingles upang tumugma sa audit trail.
