base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/008.yaml
  text: He made ten tables and placed them in the temple[a], five on the right and five on the left; he also made one hundred bowls of gold.
translation:
  language: tl
  text: Gumawa siya ng sampung mesa at inilagay niya ang mga ito sa templo—lima sa kanan at lima sa kaliwa. Gumawa rin siya ng isandaang mangkok na ginto[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga palangganang ginto” o “mga mangkok na ginto para sa pagwiwisik.” Ang salitang Hebreo ay tumutukoy sa mga sisidlang ginagamit sa paglilingkod sa templo.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֻׁלְחָנוֹת
  choice: mga mesa
  rationale: Karaniwang tumutukoy ang pangngalan sa mga mesa; malinaw ito sa konteksto ng mga kagamitan sa templo nang hindi dinaragdagan ang tiyak na gamit ng mga iyon.
- source_word: וַיַּנַּח
  choice: inilagay
  rationale: Likas at tuwirang ipinapahayag nito ang paglalagay o pagpoposisyon sa mga mesa.
- source_word: בַּהֵיכָל
  choice: sa templo
  rationale: Sa kontekstong ito ng pagsamba, ang הֵיכָל ay tumutukoy sa gusali o santuwaryo ng templo, hindi sa palasyo.
- source_word: מִיָּמִין
  choice: sa kanan
  rationale: Pinananatili nito ang tahasang panig na binanggit sa Hebreo at iniiwasang ipalit ang ipinagpapalagay na direksiyong heograpiko.
- source_word: מִשְּׂמֹאול
  choice: sa kaliwa
  rationale: Tuwirang katumbas ito ng kaliwang panig at natural na kapares ng 'sa kanan.'
- source_word: מִזְרְקֵי זָהָב
  choice: mangkok na ginto
  rationale: Ang מִזְרָק ay mangkok o palanggana na ginagamit sa paglilingkod sa templo. Ang 'mangkok na ginto' ay malinaw at hindi labis na nagtatalaga ng espesipikong ritwal na gamit.
- source_word: מֵאָה
  choice: isandaan
  rationale: Tuwiran at natural na salin ng bilang sa modernong Filipino.
