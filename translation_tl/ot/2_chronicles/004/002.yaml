base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/002.yaml
  text: He made the Sea of cast metal[a], ten cubits from brim to brim, round all around; its height was five cubits[b], and a line of thirty cubits encircled it all around.
translation:
  language: tl
  text: Gumawa siya ng Dagat na gawa sa metal na ibinuhos sa hulma.[a] Sampung siko ito mula labi hanggang labi, bilog sa buong palibot. Limang siko ang taas nito, at isang panukat na lubid na tatlumpung siko ang pumalibot dito.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Dagat na hinulma sa pagbubuhos.” Ang “Dagat” ang tawag sa Hebreo sa malaking sisidlang kabilang sa mga kagamitan ng templo.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “isang lubid na tatlumpung siko.” Inilalarawan nito ang sukat na paikot sa sisidlan ayon sa karaniwang sinaunang paraan ng pagsukat.
    reason: cultural_note
lexical_decisions:
- source_word: הַיָּם
  choice: Dagat
  rationale: Literal itong nangangahulugang “dagat,” ngunit dito ay pangalan ng malaking sisidlan sa templo. Ginamitan ng malaking titik upang ipakitang isang tiyak na kagamitan ang tinutukoy.
- source_word: מוּצָק
  choice: yari sa hinulmang metal
  rationale: Ipinahihiwatig ng anyong Hebreo na ang bagay ay ginawa sa pamamagitan ng pagbubuhos ng tunaw na metal sa hulma. Natural sa Filipino ang pariralang ito at malinaw ang paraan ng paggawa.
- source_word: עֶשֶׂר בָּאַמָּה
  choice: sampung siko
  rationale: Pinanatili ang sinaunang yunit na “siko” sa halip na tahimik na tumbasan ito ng makabagong sukat.
- source_word: מִשְּׂפָתוֹ אֶל שְׂפָתוֹ
  choice: mula sa isang labi hanggang sa kabila
  rationale: Ang שָׂפָה ay literal na “labi” o “gilid”; para sa isang malaking sisidlan, malinaw at matalinghaga pa rin ang “labi.”
- source_word: עָגוֹל סָבִיב
  choice: Bilog ito sa palibot
  rationale: Pinananatili nito kapwa ang bilog na hugis at ang diin ng Hebreo na gayon ito sa buong palibot.
- source_word: וְחָמֵשׁ בָּאַמָּה קוֹמָתוֹ
  choice: limang siko ang taas
  rationale: Natural na ayos sa Filipino na tumpak na naghahayag ng patayong sukat.
- source_word: וְקָו
  choice: Isang lubid
  rationale: Ang קַו ay isang pisi o lubid na ginagamit sa pagsukat. Pinananatili ng “lubid” ang kongkretong larawan sa Hebreo sa halip na palitan ito ng abstraktong “sirkumperensiya.”
- source_word: יָסֹב אֹתוֹ סָבִיב
  choice: umikot dito sa palibot
  rationale: Malapit ito sa literal na kilos ng pandiwang “umikot/pumalibot” at nananatiling natural sa paglalarawan ng panukat na lubid.
