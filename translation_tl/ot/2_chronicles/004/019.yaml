base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/019.yaml
  text: 'And Solomon made all the vessels that were for the house of God: the golden altar[a], the tables, and on them the bread of the Presence.'
translation:
  language: tl
  text: 'Ginawa ni Solomon ang lahat ng kagamitang para sa bahay ng Diyos: ang gintong altar, ang mga mesa, at ang tinapay ng Presensya[a] na nasa ibabaw ng mga ito.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, ayon sa tradisyon, “tinapay na handog.” Sa Hebreo, “tinapay ng Presensya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Ginawa
  rationale: Ang עשה ay karaniwang nangangahulugang “gumawa.” Ang “ginawa” ay natural at tapat sa konteksto ng talaan ng mga kagamitang pangtemplo.
- source_word: כָּל הַכֵּלִים
  choice: ang lahat ng kagamitan
  rationale: Ang כֵּלִים ay tumutukoy sa mga kasangkapan o kagamitang ginagamit sa paglilingkod. Mas natural sa modernong Tagalog ang “mga kagamitan” kaysa “mga sisidlan,” na magiging napakakitid sa kontekstong ito.
- source_word: בֵּית הָאֱלֹהִים
  choice: bahay ng Diyos
  rationale: Pinananatili nito ang literal at malinaw na Hebreong katawagan sa templo, sa halip na tahasang palitan ng “templo ng Diyos.”
- source_word: מִזְבַּח הַזָּהָב
  choice: altar na ginto
  rationale: Natural itong paglilipat ng Hebreong pariralang tumutukoy sa altar na yari o nababalutan ng ginto.
- source_word: הַשֻּׁלְחָנוֹת
  choice: mga mesa
  rationale: Tuwirang katumbas ito ng pangmaramihang Hebreo at malinaw sa konteksto ng mga kasangkapan sa templo.
- source_word: וַעֲלֵיהֶם
  choice: na nakalagay sa mga iyon
  rationale: Ipinahahayag nito nang natural sa Tagalog na ang tinapay ay nasa ibabaw ng mga mesa, bagaman inayos ang pagkakasunod ng parirala para sa kalinawan.
- source_word: לֶחֶם הַפָּנִים
  choice: tinapay ng Presensya
  rationale: Pinananatili nito ang teknikal na diwa ng literal na Hebreong “tinapay ng Presensya” at hindi agad nilulutas kung paano eksaktong uunawain ang “presensya/mukha.”
theological_decisions:
- issue: Paglilipat sa בֵּית הָאֱלֹהִים
  choice: bahay ng Diyos
  alternative: templo ng Diyos
  rationale: Ang “bahay ng Diyos” ay nagpapanatili sa Hebreong idyoma at malinaw pa ring tumutukoy sa templo nang hindi pinapalitan ang anyo ng katawagan.
- issue: Paglilipat sa לֶחֶם הַפָּנִים
  choice: tinapay ng Presensya
  alternative: tinapay na handog sa harap ng Diyos
  rationale: Ang piniling salin ay mas malapit sa anyo at teolohikal na pahiwatig ng Hebreo. Hindi nito ipinapasok sa pangunahing teksto ang isang pagpapaliwanag na maaaring magpaliit sa saklaw ng parirala.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang karaniwang salitang “kagamitan” at pinanatili ang mga katawagang “bahay ng Diyos” at “tinapay ng Presensya” upang manatiling malapit sa Hebreo.
