  to: At ginawa ni Huram-abi[a] ang mga palayok, mga pala, mga tinidor, at lahat ng kaugnay na kagamitan para kay Haring Solomon, para sa bahay ni Yahweh, na yari sa pinakintab na bronse.[b]
  rationale: Inayos ang catch-all na “lahat ng kagamitan ng mga iyon” upang maging natural at malinaw sa modernong Filipino nang hindi dinaragdagan ang saklaw ng Hebreo. Inayos din ang parirala para sa materyal sa mas idiomatikong Filipino. Pinanatili ang Huram-abi at ang talababa upang huwag burahin ang tunay na kalabuan ng anyong Hebreo.
