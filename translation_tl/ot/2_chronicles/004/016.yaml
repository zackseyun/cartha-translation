base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/016.yaml
  text: And Huram-abi made the pots[a], the shovels, the forks, and all their utensils for King Solomon, for the house of Yahweh[c][b], of polished bronze.
translation:
  language: tl
  text: At ginawa ni Huram-abi[a] ang mga palayok, mga pala, mga tinidor, at lahat ng kaugnay na kagamitan para kay Haring Solomon, para sa bahay ni Yahweh, na yari sa pinakintab na bronse.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “Huram-abi”; maaari ring unawain na “Huram na kanyang ama,” ngunit malamang na pangalan o titulo ito ng manggagawa rito.
    reason: alternative_reading
  - marker: b
    text: Maaari ring isalin na “pinakinis na bronse.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַסִּירוֹת
  choice: mga palayok
  rationale: Karaniwang tumutukoy ang salita sa mga palayok o sisidlang ginagamit sa pagluluto; malinaw at natural ang “mga palayok” sa listahan ng mga kagamitan.
- source_word: הַיָּעִים
  choice: mga pala
  rationale: Tumutukoy ito sa mga kasangkapang ginagamit sa pag-aalis ng abo o paghawak ng baga; ang “mga pala” ang tuwiran at angkop na salin.
- source_word: הַמִּזְלָגוֹת
  choice: mga tinidor
  rationale: Tumutukoy ito sa mga kasangkapang may mga tulis na tulad ng tinidor. Pinananatili ng saling ito ang pangkalahatang kahulugan nang hindi labis na tinutukoy ang gamit.
- source_word: כָּל כְּלֵיהֶם
  choice: lahat ng kagamitan ng mga iyon
  rationale: Malawak ang kahulugan ng כְּלִי bilang kagamitan, sisidlan, o kasangkapan. Ipinapakita ng “ng mga iyon” ang literal na panghalip habang nananatiling nauunawaan bilang mga kaugnay na kagamitan.
- source_word: חוּרָם אָבִיו
  choice: Huram-abi
  rationale: Malamang na gumaganap ang parirala bilang pangalan o titulo ng manggagawa sa kontekstong ito. Pinananatili ang anyong tambalan upang hindi ipalagay agad na literal na “ama niya.”
- source_word: לַמֶּלֶךְ שְׁלֹמֹה
  choice: para kay Haring Solomon
  rationale: Ipinahihiwatig ng ל ang paggawa sa kapakanan o atas ni Solomon; natural itong ipinapahayag ng “para kay.”
- source_word: לְבֵית יְהוָה
  choice: para sa bahay ni Yahweh
  rationale: Pinananatili ng “bahay” ang literal na larawan ng בַּיִת, na tumutukoy rito sa templo, at malinaw pa rin sa konteksto.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasatinig ang personal na banal na pangalan sa halip na palitan ito ng isang titulo.
- source_word: נְחֹשֶׁת מָרוּק
  choice: mula sa pinakinis na bronse
  rationale: Sa konteksto ng mga kagamitang metal, karaniwang tumutukoy ang נְחֹשֶׁת sa bronse, at ang מָרוּק ay “pinakinis” o “pinakintab.”
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Tuwirang ginagamit sa talata ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalan sa tekstong Hebreo.
- issue: Pag-unawa sa חוּרָם אָבִיו
  choice: Huram-abi bilang pangalan o titulo
  alternative: Huram na kanyang ama
  rationale: Ang konteksto ay tumutukoy sa pagkakakilanlan ng bihasang manggagawa. Gayunman, tunay na posible sa anyo ng Hebreo ang literal na pagbasa, kaya inilalahad iyon sa talababa sa halip na tahimik na alisin ang kalabuan.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “bahay ni Yahweh” upang mapanatili ang Hebreong larawan, at ang mga talababa ay limitado sa tunay na kalabuan sa pangalan/titulo at sa leksikal na alternatibo para sa pagkakapakinis ng bronse.
