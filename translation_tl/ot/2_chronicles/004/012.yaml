  text: עַמּוּדִ֣ים שְׁנַ֔יִם וְ/הַ/גֻּלּ֧וֹת וְ/הַ/כֹּתָר֛וֹת עַל רֹ֥אשׁ הָ/עַמּוּדִ֖ים שְׁתָּ֑יִם וְ/הַ/שְּׂבָכ֣וֹת שְׁתַּ֔יִם לְ/כַסּ֗וֹת אֶת שְׁתֵּי֙ גֻּלּ֣וֹת הַ/כֹּֽתָר֔וֹת אֲשֶׁ֖ר עַל רֹ֥אשׁ הָֽ/עַמּוּדִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/012.yaml
  text: the two pillars[a], and the two bowls and the two capitals on top of the pillars, and the two latticeworks to cover the two bowls of the capitals that were on top of the pillars[b];
translation:
  language: tl
  text: ang dalawang haligi, ang dalawang mangkok[a] at ang dalawang kapitel sa ibabaw ng mga haligi, at ang dalawang sala-sala[b] na pantakip sa dalawang mangkok ng mga kapitel na nasa ibabaw ng mga haligi;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga globo” o “mga bilugang anyo”; hindi tiyak ang eksaktong hugis na tinutukoy ng salitang Hebreo.
    reason: lexical_alternative
  - marker: b
    text: O “mga lambat-lambat na palamuti.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עַמּוּדִים
  choice: mga haligi
  rationale: Karaniwan at malinaw na katawagang pang-arkitektura para sa dalawang haliging inilalarawan sa konteksto.
- source_word: גֻּלּוֹת
  choice: mga mangkok
  rationale: Tumutukoy sa mga bilugan o hugis-mangkok na bahagi na kaugnay ng itaas ng mga haligi. Hindi tiyak ang eksaktong anyo, kaya inilagay sa talababa ang mga maaaring alternatibo.
- source_word: כֹּתָרוֹת
  choice: mga kapitel
  rationale: Tiyak na terminong pang-arkitektura para sa pinalamutian o pinakamataas na bahagi ng isang haligi; mas angkop dito kaysa sa literal at matalinghagang “mga korona.”
- source_word: רֹאשׁ
  choice: ibabaw
  rationale: Bagaman literal na “ulo,” tumutukoy ito rito sa itaas o ibabaw ng haligi at natural itong pakinggan sa Filipino.
- source_word: שְּׂבָכוֹת
  choice: mga sala-sala
  rationale: Naghahayag ng hinabi o parang lambat na palamuting estruktura sa malinaw at kasalukuyang Filipino.
- source_word: לְכַסּוֹת
  choice: na pantakip
  rationale: Pinananatili ang layunin o gamit ng mga sala-sala sa isang natural na pariralang Filipino.
- source_word: אֲשֶׁר
  choice: na nasa
  rationale: Natural na panandang nag-uugnay sa mga kapitel at sa kinalalagyan ng mga ito sa ibabaw ng mga haligi.
- source_word: שְׁנַיִם / שְׁתַּיִם / שְׁתֵּי
  choice: dalawa / dalawang
  rationale: Pinananatili ang paulit-ulit na bilang sapagkat isa-isang iniimbentaryo ng Hebreo ang mga bahagi.
theological_decisions: []
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang teknikal ngunit tanggap na “kapitel” dahil tiyak ang kahulugang pang-arkitektura; nilinaw sa daloy ng pangungusap na ito ang nasa ibabaw ng mga haligi. Pinanatili ang anyong listahan at ang pag-uulit ng “dalawa” sa Hebreo.
