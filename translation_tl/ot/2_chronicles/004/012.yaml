  source_fidelity: 'Tapat ang salin sa imbentaryong Hebreo: dalawang haligi, dalawang mangkok/bilugang bahagi, dalawang kapitel, at dalawang sala-sala na pantakip. Napananatili ang paulit-ulit na bilang at ang layuning ipinahahayag ng לְכַסּוֹת. Ang pariralang “mga kapitel na nasa ibabaw ng mga haligi” ay isang likas na pagpapahayag ng ugnayang pang-arkitektura sa talata.'
