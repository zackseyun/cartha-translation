  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “Dagat” bilang tiyak na pangalan ng malaking sisidlan sa templo, at inilagay sa talababa ang literal na anyo ng masalimuot na pariralang panglokasyon.
