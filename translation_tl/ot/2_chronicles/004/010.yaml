translation:
  language: tl
  text: Inilagay niya ang Dagat sa gawing timog-silangan[a], katapat ng timog.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal na Hebreo, “sa kanang panig, pasilangan, sa tapat ng timog.” Dahil karaniwang inilalarawan ang mga direksiyon sa Hebreo mula sa pananaw ng isang nakaharap sa silangan, ang “kanang panig” ay tumutukoy sa timog; kasama ng “pasilangan,” ipinahihiwatig nito ang gawing timog-silangan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת
  choice: Inilagay niya
  rationale: Ang וְ ay nag-uugnay sa talata sa naunang paglalarawan, samantalang ang אֵת ay pananda ng tuwirang layon at hindi kailangang tumbasan nang hiwalay sa Tagalog.
- source_word: הַיָּם
  choice: ang Dagat
  rationale: Tumutukoy ito sa malaking tansong sisidlan sa templo. Pinananatili ng “Dagat” ang literal at nakaugaliang katawagan, at ang malaking titik ay nagpapakitang tiyak na kagamitang ito ang tinutukoy.
- source_word: נָתַן
  choice: Inilagay
  rationale: Natural na pandiwa ito sa Tagalog para sa pagpuwesto ng isang bagay at tapat sa kahulugan ng Hebreo.
- source_word: מִכֶּתֶף
  choice: sa gawing
  rationale: Bagaman literal na “balikat” ang כָּתֵף, ginagamit ito sa paglalarawan ng lokasyon bilang panig o bahagi. Ang “sa gawing” ay likas na panumbas sa Tagalog.
- source_word: הַיְמָנִית קֵדְמָה
  choice: timog-silangan
  rationale: Sa karaniwang Hebreong pagtanaw na nakaharap sa silangan, ang “kanang panig” ay timog; kasama ng “pasilangan,” ipinahihiwatig ng tambalan ang gawing timog-silangan.
- source_word: מִמּוּל נֶגְבָּה
  choice: na nakaharap sa timog
  rationale: Pinananatili nito ang ugnayang ipinapahayag ng מִמּוּל at ang direksiyong timog ng נֶגְבָּה, habang natural ang daloy sa modernong Tagalog.
