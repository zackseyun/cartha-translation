base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/013.yaml
  text: and the four hundred pomegranates for the two latticeworks[a], two rows of pomegranates for each latticework[b], to cover the two bowl-shaped capitals that were on top of the pillars.
translation:
  language: tl
  text: at ang apatnaraang granada para sa dalawang palamuting sala-sala[a]—dalawang hanay ng mga granada para sa bawat palamuting sala-sala—upang takpan ang dalawang hugis-mangkok na bahagi[b] ng mga kapitel na nasa ibabaw ng mga haligi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga palamuting parang lambat.” Tumutukoy ang salitang Hebreo sa sala-sala o lambat na palamuti sa mga kapitel.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “ang dalawang mangkok ng mga kapitel.” Inilalarawan ng Hebreo ang mga bilugan, hugis-mangkok na bahagi ng mga kapitel.
    reason: lexical_alternative
lexical_decisions:
- source_word: רִמּוֹנִים
  choice: mga granada
  rationale: Tumutukoy ito sa mga anyong granada na pandekorasyon sa mga kagamitan ng templo; pinanatili ang tuwirang larawan ng Hebreo.
- source_word: אַרְבַּע מֵאוֹת
  choice: apatnaraan
  rationale: Tuwirang salin ng bilang na apat na raan; ginamit bilang panuring bago ang pangngalan.
- source_word: שְּׂבָכוֹת
  choice: mga sala-salang palamuti
  rationale: Ipinahahayag nito ang nililok na palamuting kawangis ng lambat o sala-sala sa mga kapitel, sa paraang mas madaling maunawaan kaysa sa teknikal na katawagan lamang.
- source_word: שְׁנַיִם טוּרִים
  choice: dalawang hanay
  rationale: Likas at eksaktong salin ng dalawang magkakaayos na hanay.
- source_word: לַשְּׂבָכָה הָאֶחָת
  choice: para sa bawat sala-salang palamuti
  rationale: 'Ang anyong isahan sa Hebreo ay distributibo rito: tig-dalawang hanay ang bawat isa sa dalawang palamuti.'
- source_word: לְכַסּוֹת
  choice: upang takpan
  rationale: Pinananatili ang layuning ipinahahayag ng pawatas sa Hebreo.
- source_word: גֻּלּוֹת
  choice: mga bahaging hugis-mangkok
  rationale: Pinananatili ang larawan ng bilugan o mangkok na anyo habang nililinaw na mga bahagi ito ng mga kapitel.
- source_word: כֹּתָרוֹת
  choice: mga kapitel
  rationale: Ito ang wastong katawagang pang-arkitektura para sa pandekorasyong pang-itaas ng haligi, hindi mga koronang maharlika.
- source_word: עַל פְּנֵי הָעַמּוּדִים
  choice: nasa ibabaw ng mga haligi
  rationale: Sa konteksto ng mga kapitel, malinaw na tumutukoy ito sa kanilang kinalalagyan sa ibabaw ng mga haligi.
theological_decisions: []
translation_notes:
  register: Makabago at marangal na Filipino. Ginamit ang teknikal ngunit tanggap na salitang “kapitel,” at nilinaw sa karaniwang wika ang sala-salang palamuti at ang hugis-mangkok na mga bahagi. Pinanatili ang panimulang “at” sapagkat karugtong ang talata ng naunang talaan.
