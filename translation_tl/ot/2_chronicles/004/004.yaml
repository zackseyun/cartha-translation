id: 2CH.4.4
reference: 2 Chronicles 4:4
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: עוֹמֵ֞ד עַל שְׁנֵ֧ים עָשָׂ֣ר בָּקָ֗ר שְׁלֹשָׁ֣ה פֹנִ֣ים צָפ֡וֹנָ/ה וּ/שְׁלוֹשָׁה֩ פֹנִ֨ים יָ֜מָּ/ה וּ/שְׁלֹשָׁ֣ה פֹּנִ֣ים נֶ֗גְבָּ/ה וּ/שְׁלֹשָׁה֙ פֹּנִ֣ים מִזְרָ֔חָ/ה וְ/הַ/יָּ֥ם עֲלֵי/הֶ֖ם מִ/לְ/מָ֑עְלָ/ה וְ/כָל אֲחֹרֵי/הֶ֖ם בָּֽיְתָ/ה־׀׀׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/004.yaml
  text: 'It stood on twelve oxen: three facing north[a], three facing west, three facing south, and three facing east. The Sea was above them[b], and all their rear parts were inward.'
translation:
  language: tl
  text: 'Nakatayo ito sa labindalawang baka: tatlo ang nakaharap sa hilaga[a], tatlo sa kanluran, tatlo sa timog, at tatlo sa silangan. Ang Dagat ay nasa ibabaw nila, at ang likurang bahagi nilang lahat ay nakaharap sa loob.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “tatlo ang nakaharap pahilaga ... tatlo ang nakaharap patungo sa dagat.” Dito, ang “kanluran” ang kahulugan ng idyomatikong gamit ng “patungo sa dagat.”
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring isalin: “at ang mga hulihang bahagi nilang lahat ay nasa loob.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: עוֹמֵד
  choice: Nakatayo ito
  rationale: Ang Qal participle ay naglalarawan sa posisyon ng Dagat; natural sa Tagalog ang pandiwang nasa aspektong naglalarawan ng kalagayan.
- source_word: בָּקָר
  choice: mga baka
  rationale: Tumutukoy sa labindalawang rebultong bovine na sumusuporta sa Dagat. Hindi tinutukoy nang higit sa Hebreo ang kasarian ng mga ito, kaya hindi ginamit ang mas tiyak na “mga toro.”
- source_word: פֹנִים
  choice: nakaharap
  rationale: Bagaman kaugnay ng literal na “mukha,” idyomatiko itong nagsasaad ng direksiyon ng pagkakaharap.
- source_word: צָפוֹנָה
  choice: hilaga
  rationale: Ang directional he ay nagpapahiwatig ng pagkakaharap pahilaga; sapat at natural ang “sa hilaga” kasunod ng “nakaharap.”
- source_word: יָמָּה
  choice: kanluran
  rationale: Literal itong “patungo sa dagat,” ngunit karaniwang idyomang Hebreo ito para sa kanluran.
- source_word: נֶגְבָּה
  choice: timog
  rationale: Sa talaan ng apat na direksiyon, timog ang tinutukoy, hindi ang rehiyon ng Negeb bilang pantanging pook.
- source_word: מִזְרָחָה
  choice: silangan
  rationale: Karaniwang katawagang pandireksiyon; malinaw at natural sa Tagalog.
- source_word: הַיָּם
  choice: ang Dagat
  rationale: Pangalan ito rito ng malaking sisidlan sa templo, hindi ng heograpikong dagat; pinanatili ang metaporikal na katawagan at ginamitan ng malaking titik.
- source_word: עֲלֵיהֶם מִלְמָעְלָה
  choice: nasa ibabaw nila
  rationale: Malinaw na inilalarawan ang posisyon ng Dagat sa ibabaw ng mga baka nang hindi inuulit nang alanganin ang ideya ng pagtayo.
- source_word: אֲחֹרֵיהֶם
  choice: ang likurang bahagi nilang lahat
  rationale: Pinananatili ang kolektibong pagtukoy sa likod o hulihang bahagi ng mga rebultong hayop sa paraang marangal at malinaw.
- source_word: בָּיְתָה
  choice: nakaharap sa loob
  rationale: Ang anyong pandireksiyon mula sa “bahay/loob” ay nangangahulugang papaloob, patungo sa gitna sa ilalim ng Dagat.
