  source_fidelity: 'Tumpak na naipapahayag ang Hebreong paglalarawan: ang Dagat ay nakapatong sa labindalawang bovine figure, na tig-tatatlo ang nakaharap sa apat na direksiyon, at ang kanilang mga hulihang bahagi ay papaloob. Ang pagkakasunod ng mga direksiyon at ang spatial na relasyon ay napanatili.'
