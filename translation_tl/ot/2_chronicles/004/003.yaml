base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/003.yaml
  text: And beneath it were figures of oxen all around[a], encircling it, ten to the cubit, surrounding the Sea all around. The oxen were in two rows[c][b], cast as one piece with it.
translation:
  language: tl
  text: Sa ilalim nito ay may mga anyo ng baka[a] sa buong palibot, sampu sa bawat siko[b], na nakapalibot sa Dagat. Nasa dalawang hanay ang mga baka, at inihulma ang mga ito kasabay ng Dagat.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga wangis ng mga baka”; mga palamuting hugis-baka ang tinutukoy ng Hebreo, hindi mga buhay na hayop.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “sampu sa siko,” na malamang ay nangangahulugang sampung anyo sa bawat siko sa palibot.
    reason: cultural_note
  - marker: c
    text: Sa Hebreo, “sa pagkakahulma nito”; ipinahihiwatig na ang mga anyo ay ginawa bilang bahagi ng iisang pagkakahulma ng Dagat, hindi ikinabit pagkaraan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּדְמוּת בְּקָרִים
  choice: mga anyong baka
  rationale: Ipinahihiwatig ng דְּמוּת na mga hugis o representasyon ang tinutukoy, hindi mga buhay na hayop. Likas at malinaw sa modernong Filipino ang “mga anyong baka.”
- source_word: תַּחַת לוֹ
  choice: sa ilalim nito
  rationale: Tuwirang ipinapahayag ang lokasyon ng palamuti sa ibabang bahagi ng Dagat.
- source_word: סָבִיב סָבִיב
  choice: sa buong palibot
  rationale: Inihahatid nito ang pinatinding diwa ng pag-ikot nang hindi inuulit nang alanganin ang salita sa Filipino.
- source_word: עֶשֶׂר בָּאַמָּה
  choice: sampu sa bawat siko
  rationale: Ipinapahayag ang malamang na bilang ng mga anyo sa bawat isang siko ng palibot; pinananatili sa talababa ang likas na kaiklian at bahagyang kalabuan ng Hebreo.
- source_word: הַיָּם
  choice: Dagat
  rationale: Ginawang pantanging katawagan ang “Dagat” para sa malaking templong sisidlan, ayon sa konteksto.
- source_word: שְׁנַיִם טוּרִים
  choice: nasa dalawang hanay
  rationale: Malinaw at natural na paglalarawan sa pagkakaayos ng mga anyo.
- source_word: יְצוּקִים בְּמֻצַקְתּוֹ
  choice: hinulmang kasama nito bilang iisang piraso
  rationale: Sa konteksto ng paggawa sa metal, ang ugat יצק ay tumutukoy sa paghuhulma o casting; ipinakikita ng parirala na kasabay at kabahagi ng mismong hulma ng Dagat ang mga anyo.
