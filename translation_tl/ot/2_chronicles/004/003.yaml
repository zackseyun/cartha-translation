translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “baka” bilang pangkalahatang katawagan sa bovine figures; iniwasan ang mas tiyak na “toro” dahil hindi tahasang tinutukoy ng בָּקָר ang kasarian. Pinanatili ang “siko” bilang tradisyonal na yunit at nilinaw lamang sa talababa ang ugnayang panukat.
