base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/009.yaml
  text: And he made the court of the priests[a], and the great court, and doors for the court[c][b]; and he overlaid their doors with bronze.
translation:
  language: tl
  text: Ginawa niya ang patyo ng mga pari at ang malaking patyo, pati ang mga pinto[a] para sa patyo. Binalutan niya ng bronse[b] ang mga pintong iyon.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga tarangkahan.” Mas karaniwang nangangahulugang “mga pinto” ang salitang Hebreo, kaya iyon ang ginamit sa teksto.
    reason: lexical_alternative
  - marker: b
    text: O “tanso.” Maaaring tumukoy ang salitang Hebreo sa tanso o bronse; ang “bronse” ang ginamit dahil sa konteksto ng mga bahagi ng templo.
    reason: lexical_alternative
  - marker: c
    text: Sa Hebreo, “kanilang mga pinto.” Maaari ring unawain bilang “mga pinto nito,” na tumutukoy sa patyo bilang isang kabuuan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Ginawa niya
  rationale: Malawak ang kahulugan ng עשה (‘gumawa’), at ang payak na ‘ginawa’ ay natural sa salaysay ng pagtatayo nang hindi dinaragdagan ang tiyak na paraan ng paggawa.
- source_word: חֲצַר הַכֹּהֲנִים
  choice: ang looban ng mga pari
  rationale: Ang חָצֵר ay looban o patyo. Ang ‘looban ng mga pari’ ay malinaw, natural, at tuwirang nagpapanatili sa ugnayang construct ng Hebreo.
- source_word: וְהָעֲזָרָה הַגְּדוֹלָה
  choice: at ang malaking looban
  rationale: Sa konteksto ng templo, ang עֲזָרָה ay isang looban o nakabakod na lugar. Pinananatili ng ‘malaking looban’ ang kaibhan ng salitang Hebreo mula sa חָצֵר nang hindi gumagamit ng hindi likas na terminong arkitektural.
- source_word: וּדְלָתוֹת לָעֲזָרָה
  choice: pati ang mga pinto para sa looban
  rationale: Karaniwang nangangahulugang ‘pinto’ ang דֶּלֶת; hindi ito awtomatikong tumutukoy sa mas malaking tarangkahan. Ang ‘para sa looban’ ay pinananatili ang lakas ng pang-ukol na לְ.
- source_word: וְדַלְתוֹתֵיהֶם
  choice: ang mga pinto ng mga iyon
  rationale: Pangmaramihang panlalaki sa ikatlong panauhan ang hulapi sa Hebreo (‘kanilang’). Iniiwasan ng ‘ng mga iyon’ ang di-likas na paglalapat ng ‘kanila’ sa mga gusali habang pinananatili ang pangmaramihang anyo at ang bahagyang kalabuan ng tinutukoy.
- source_word: צִפָּה
  choice: Binalutan niya
  rationale: Sa gawaing metal at arkitektura, ang צפה ay nangangahulugang balutan o patungan ng metal. Likas at madaling maunawaan sa Filipino ang ‘binalutan.’
- source_word: נְחֹשֶׁת
  choice: bronse
  rationale: Maaaring tumukoy ang נְחֹשֶׁת sa tanso o bronse. Ang ‘bronse’ ay ang karaniwang angkop na katawagan sa konteksto ng mga kagamitan at bahagi ng templo, habang itinatala sa talababa ang tunay na leksikal na saklaw.
