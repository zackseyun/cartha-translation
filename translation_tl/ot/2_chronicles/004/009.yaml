translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang ‘looban’ para sa dalawang magkaugnay na katawagang arkitektural sa templo, habang ang mga talababa ay nagpapanatili sa mahahalagang leksikal at gramatikal na alternatibo. Inilagay ang bawat pananda kaagad sa pariralang ipinaliliwanag nito.
