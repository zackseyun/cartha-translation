  to: Ginawa niya ang patyo ng mga pari at ang malaking patyo, pati ang mga pinto[a] para sa patyo. Binalutan niya ng bronse[b] ang mga pintong iyon.[c]
  rationale: Pinalitan ang “looban” ng “patyo” upang maging mas natural at tiyak ang katawagang arkitektural. Pinalitan ang “mga pinto ng mga iyon” ng “mga pintong iyon” upang maging idiomatiko ang Filipino nang hindi nilulutas nang lampas sa ebidensiya ang di-ganap na malinaw na pantukoy ng hulaping Hebreo; ang literal na anyo at alternatibong pagbasa ay nananatili sa talababa.
