  yaml_path: translation/ot/2_chronicles/004/006.yaml
  text: He made ten basins and set five on the right and five on the left[a], to wash in them; in them they would rinse the things used for the burnt offering[c][b]. But the sea was for the priests to wash in.
translation:
  language: tl
  text: Gumawa siya ng sampung palanggana[a] at inilagay ang lima sa kanan at ang lima sa kaliwa upang gamitin sa paghuhugas. Sa mga iyon nila binabanlawan ang mga bagay na ginagamit para sa handog na sinusunog[b]. Ngunit ang Dagat[c] ay para doon maghugas ang mga pari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isaling “mga hugasan.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, literal na “ang gawain ng handog na sinusunog”; maaaring tumukoy ang parirala sa mga bagay o sangkap na kaugnay ng paghahanda ng handog na sinusunog.
    reason: lexical_alternative
  - marker: c
    text: Ang “Dagat” ang tawag sa malaking tansong sisidlan na ginagamit ng mga pari sa paghuhugas.
    reason: cultural_note
lexical_decisions:
- source_word: כִּיּוֹרִים
  choice: mga palanggana
  rationale: Tumutukoy ito sa malalaking sisidlang hugasan sa paglilingkod sa templo. Likas at madaling maunawaan sa modernong Filipino ang “mga palanggana”; inilalagay sa talababa ang alternatibong “mga hugasan.”
- source_word: מִיָּמִין / מִשְּׂמֹאול
  choice: sa kanan / sa kaliwa
  rationale: Pinananatili nito ang payak na paglalarawan ng pagkakalagay nang hindi nagdaragdag ng hindi tinukoy na punto ng pananaw.
- source_word: לְרָחְצָה
  choice: upang gamiting hugasan
  rationale: Malinaw nitong ipinahahayag ang layunin ng mga palanggana at natural itong basahin sa Filipino.
- source_word: מַעֲשֵׂה הָעוֹלָה
  choice: mga bagay na ginagamit para sa handog na sinusunog
  rationale: Elliptical ang pariralang Hebreo, na literal na “gawain ng handog na sinusunog.” Ang salin ay nagpapalinaw sa malamang na tinutukoy na mga bagay na kaugnay ng paghahanda ng handog, habang itinatala sa talababa ang literal at hindi tiyak na anyo.
- source_word: יָדִיחוּ
  choice: binabanlawan
  rationale: Ang pandiwa ay tumutukoy sa pagbabanlaw o paghuhugas upang maalis ang dumi. Ang aspektong nagaganap o nakagawian sa konteksto ay natural na naipahahayag ng “binabanlawan.”
- source_word: וְהַיָּם
  choice: ang Dagat
  rationale: Pinananatili ang natatanging katawagan sa malaking tansong sisidlan. Ginamit ang malaking titik bilang pangalan ng sisidlan, at ipinaliwanag ang reperente sa talababa.
- source_word: לַכֹּהֲנִים
  choice: ginagamit ng mga pari
  rationale: Natural nitong ipinahahayag sa Filipino na ang Dagat ay inilaan para sa paghuhugas ng mga pari.
