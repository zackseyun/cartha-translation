  register: Modernong Filipino na dignified at madaling maunawaan. Pinanatili ang katawagang “Dagat” at ang pagkakaiba nito sa sampung palanggana. Iniwasan ang labis na teknikal o makalumang bokabularyo, habang ang tunay na kalabuan ng מַעֲשֵׂה הָעוֹלָה ay hayagang itinala sa talababa.
