translation_notes:
  register: Modernong Filipino na dignificado at madaling maunawaan. Ginamit ang “altar” bilang nakaugaliang salitang Filipino sa kontekstong biblikal at “siko” upang mapanatili ang sinaunang yunit ng sukat. Hinati sa dalawang pangungusap para maging malinaw ang mahabang hanay ng mga dimensiyon nang hindi binabago ang kahulugan.
