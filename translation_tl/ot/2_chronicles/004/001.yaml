base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/001.yaml
  text: He made a bronze altar[a], twenty cubits its length and twenty cubits its width, and ten cubits its height.
translation:
  language: tl
  text: Gumawa siya ng altar na tanso[a]. Dalawampung siko ang haba nito, dalawampung siko ang lapad nito, at sampung siko ang taas nito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “altar na bronse.” Ang salitang Hebreo ay maaaring tumukoy sa tanso o bronse.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Gumawa siya
  rationale: Ang wayyiqtol ng עשה ay nagpapatuloy sa salaysay at likas na isinasalin bilang payak na naganap na kilos. Hindi kailangang tahasang isalin ang pang-ugnay sa Filipino.
- source_word: מִזְבַּח
  choice: altar
  rationale: Ang “altar” ang karaniwan at madaling maunawaang katawagan sa modernong Filipino para sa estrukturang pinaghahandugan.
- source_word: נְחֹשֶׁת
  choice: tanso
  rationale: Ang נְחֹשֶׁת ay maaaring tumukoy sa copper o sa haluang metal nitong bronze. “Tanso” ang natural at tradisyonal na malawak na katawagan sa Filipino, habang nililinaw sa talababa ang posibleng metal.
- source_word: עֶשְׂרִים אַמָּה
  choice: dalawampung siko
  rationale: Pinananatili ang sinaunang yunit na “siko” sa halip na tantiyahin sa modernong sukat.
- source_word: אָרְכּוֹ
  choice: ang haba nito
  rationale: Natural na nominal na parirala sa Filipino para sa sukat ng isang gusali o bagay.
- source_word: רָחְבּוֹ
  choice: ang lapad
  rationale: Ang “lapad” ang karaniwang terminong pang-arkitektura para sa dimensiyong ito; nauunawaan ang pagtukoy sa altar mula sa naunang parirala.
- source_word: וְעֶשֶׂר אַמּוֹת
  choice: at sampung siko
  rationale: Tuwirang pinananatili ang bilang at sinaunang yunit.
- source_word: קוֹמָתוֹ
  choice: ang taas
  rationale: Sa kontekstong pang-arkitektura, ang קוֹמָה ay tumutukoy sa taas ng altar.
