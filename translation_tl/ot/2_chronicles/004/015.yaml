lexical_decisions:
- source_word: הַיָּם
  choice: Dagat
  rationale: Literal na nangangahulugang “dagat” ang יָם, ngunit dito ay pangalan ito ng malaking hulmahang imbakan ng tubig sa templo. Pinananatili ng malaking titik ang gamit nito bilang tawag sa bagay.
- source_word: אֶחָד
  choice: iisang
  rationale: Tuwirang bilang ito na tumutukoy sa Dagat. Likas sa Filipino ang “iisang” sa ganitong maikling talaan at malinaw nitong pinananatili ang bilang na isa.
- source_word: הַבָּקָר
  choice: mga baka
  rationale: Kolektibong tawag ang בָּקָר sa mga bovine. Sa konteksto, tumutukoy ito sa labindalawang anyong baka na sumusuporta sa Dagat; hindi tiyak sa salita lamang kung mga toro ang inilalarawan.
- source_word: שְׁנֵים עָשָׂר
  choice: labindalawang
  rationale: Karaniwang salin ng bilang na labindalawa, na ginagamit bilang panuring sa “baka.”
- source_word: תַּחְתָּיו
  choice: sa ilalim nito
  rationale: Ang hulaping panlalaking isahan ay tumutukoy pabalik sa Dagat. Natural at maikli sa Filipino ang “sa ilalim nito.”
- source_word: אֶת ... וְאֶת
  choice: hindi hiwalay na isinalin
  rationale: Mga pananda ito ng tuwirang layon at kinakatawan sa Filipino ng ayos at pagkakaugnay ng mga parirala.
