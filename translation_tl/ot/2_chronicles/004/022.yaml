  terminology: Ang 'mga panggupit ng mitsa,' 'mga palanggana,' 'mga lalagyan ng baga,' 'Kabanal-banalan,' at 'bulwagan ng templo' ay angkop at pinananatili ang mahahalagang pagkakaiba ng Hebreo.
