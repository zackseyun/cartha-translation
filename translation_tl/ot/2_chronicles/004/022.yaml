base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/022.yaml
  text: the snuffers[a], the basins, the bowls, and the firepans of pure gold; and the entrance of the house, its inner doors for the Most Holy Place, and the doors of the house for the nave[c][b], were of gold.
translation:
  language: tl
  text: 'Ang mga panggupit ng mitsa, mga palanggana, mga mangkok, at mga lalagyan ng baga ay pawang yari sa dalisay na ginto; at ang pasukan ng bahay: ang panloob nitong mga pinto para sa Kabanal-banalan at ang mga pinto ng bahay para sa bulwagan ng templo ay yari sa ginto.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מְזַמְּרוֹת
  choice: mga panggupit ng mitsa
  rationale: Sa talaan ng mga kagamitan sa templo, tumutukoy ito sa kagamitang pumuputol o nag-aayos ng mitsa ng ilawan. Mas malinaw ito sa karaniwang mambabasa kaysa sa hiniram o teknikal na katawagan.
- source_word: מִּזְרָקוֹת
  choice: mga palanggana
  rationale: Tumutukoy sa malalaking sisidlang ginagamit sa ritwal, marahil sa pagsalo o pagwisik ng dugo; naipag-iiba ito sa kasunod na mas maliliit na sisidlan.
- source_word: כַּפּוֹת
  choice: maliliit na mangkok
  rationale: Maaaring tumukoy sa maliliit na mangkok o kopa. Idinagdag ang 'maliliit' upang mapanatili ang pagkakaiba sa naunang mga palanggana nang hindi labis na tinutukoy ang gamit.
- source_word: מַּחְתּוֹת
  choice: mga lalagyan ng baga
  rationale: Tumutukoy sa mga sisidlang ginagamit sa pagdadala ng nagbabagang uling o apoy. Hindi nito ipinapalagay na para lamang sa insenso ang mga ito.
- source_word: זָהָב סָגוּר
  choice: dalisay na ginto
  rationale: Ang parirala ay tumutukoy sa mataas na uring pinadalisay na ginto; natural at malinaw sa Filipino ang 'dalisay na ginto.'
- source_word: פֶּתַח הַבַּיִת
  choice: ang pasukan ng bahay
  rationale: Pinananatili ang karaniwang metapora ng templo bilang 'bahay' at ang kahulugan ng פתח bilang pasukan o bukana.
- source_word: דַּלְתוֹתָיו הַפְּנִימִיּוֹת
  choice: ang panloob na mga pinto nito
  rationale: Pinananatili ang maramihang anyo at ang kaibahan sa susunod na hanay ng mga pinto.
- source_word: לְקֹדֶשׁ הַקֳּדָשִׁים
  choice: patungo sa Kabanal-banalan
  rationale: Ang nakaugaliang katawagang Filipino na 'Kabanal-banalan' ay malinaw na naghahayag ng Hebreong superlatibo at tumutukoy sa pinakaloob na banal na silid.
- source_word: וְדַלְתֵי הַבַּיִת לַהֵיכָל
  choice: at ang mga pinto ng bahay patungo sa bulwagan ng templo
  rationale: Dito, ang היכל ay ang pangunahing silid o bulwagan ng templo, na naiiba sa Kabanal-banalan. Mas madaling maunawaan ang 'bulwagan ng templo' kaysa sa teknikal na 'nave.'
- source_word: זָהָב
  choice: ay yari sa ginto
  rationale: Ang pangwakas na pangngalan ay nagsasaad ng materyal ng mga pinto; kailangan ang 'ay yari sa' para sa natural na sintaks sa Filipino.
theological_decisions:
- issue: Pagkakaiba ng קֹדֶשׁ הַקֳּדָשִׁים at הֵיכָל
  choice: Kabanal-banalan at bulwagan ng templo
  alternative: Pinakabanal na Lugar at santuwaryo
  rationale: Pinananatili ng salin ang pagkakaiba ng pinakaloob na silid at ng pangunahing silid ng templo, nang hindi pinagsasama ang dalawang espasyo o nagdaragdag ng denominasyonal na pagpapakahulugan.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang mga konkretong katawagan para sa mga kagamitang panritwal at pinanatili ang 'bahay' bilang katawagan sa templo dahil naroon ito sa Hebreo. Ang gitling na pahaba ay nagpapalinaw na ang lahat ng apat na naunang kagamitan ay yari sa dalisay na ginto.
