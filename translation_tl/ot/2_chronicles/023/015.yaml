base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/015.yaml
  text: So they laid hands on her[a], and she went to the entrance of the Horse Gate at the king’s house[b], and they put her to death there.
translation:
  language: tl
  text: Kaya inilapat nila sa kanya ang kanilang mga kamay[a]. Nakarating siya sa pasukan ng Pintuan ng mga Kabayo sa palasyo ng hari[b], at doon nila siya pinatay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal, “inilagay nila ang mga kamay para sa kanya.” Hindi tiyak ang kahulugan ng Hebreong idyoma; maaari itong mangahulugang hinawakan o dinakip siya, o binigyan siya ng daan.
    reason: Pinananatili ang pinagtatalunang kalabuan ng Hebreong parirala nang hindi itinatakda sa pangunahing teksto ang isang pagbasa.
  - marker: b
    text: Literal, “sa bahay ng hari.”
    reason: Ipinapakita ang mas literal na anyo sa likod ng likas na saling “palasyo ng hari.”
lexical_decisions:
- source_word: וַיָּשִׂימוּ לָהּ יָדַיִם
  choice: dinakip nila siya
  rationale: Literal na tumutukoy sa paglalagay ng mga kamay sa kaniya. Sa konteksto ng pagdadala sa kaniya sa lugar ng pagpatay, pinakamalamang na nangangahulugan itong siya ay sinunggaban o dinakip. Inilalagay sa talababa ang mas literal at ang ibang posibleng pagbasa upang mapanatili ang tunay na kalabuan.
- source_word: וַתָּבוֹא אֶל מְבוֹא
  choice: Nakarating siya sa pasukan
  rationale: Ang pandiwa ay literal na nagsasabing dumating o pumaroon siya, hindi tahasang ‘dinala siya.’ Ang ‘nakarating’ ay likas sa Filipino at hindi nagdaragdag kung kusa ba siya o sapilitan.
- source_word: שַׁעַר הַסּוּסִים
  choice: Pintuan ng mga Kabayo
  rationale: Malamang na pangalan ito ng isang tiyak na pintuan. Ang paglalagay ng malaking titik ay nagpapakita ng gamit nito bilang pangalan ng lugar.
- source_word: בֵּית הַמֶּלֶךְ
  choice: sa palasyo ng hari
  rationale: Ang literal na ‘bahay ng hari’ ay karaniwang tumutukoy sa maharlikang tahanan o palasyo. Mas malinaw at natural sa modernong Filipino ang ‘palasyo ng hari,’ habang pinananatili sa talababa ang literal na anyo.
- source_word: וַיְמִיתוּהָ שָׁם
  choice: doon nila siya pinatay
  rationale: Tuwirang ipinapahayag ng Hiphil ng מות na pinangyari nilang mamatay siya. Ang ‘pinatay’ ay malinaw at hindi labis na nagtatakda ng legal na kahulugang maaaring ipahiwatig ng ‘binitay’ o ‘hinatulan ng kamatayan.’
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang maiikling pangungusap upang maging likas ang daloy at maiwasang magmukhang kusa ang buong kilos ni Atalia. Ang mga pangalan ng tiyak na pook ay ginamitan ng malaking titik.
