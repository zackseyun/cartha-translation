  source_fidelity: 'Ang “dinakip nila siya” ay isang posibleng pagbasa sa di-karaniwang idyomang וַיָּשִׂימוּ לָהּ יָדַיִם, ngunit mas tiyak ito kaysa sa Hebreo. Dahil pinagtatalunan kung ang parirala ay tumutukoy sa paghawak/pagdakip o sa pagbibigay-daan, mas mabuting panatilihin sa pangunahing teksto ang literal na larawan ng mga kamay at ipaliwanag ang kawalang-katiyakan sa talababa. Tumpak ang iba pang bahagi: ang pagdating sa pasukan ng Pintuan ng mga Kabayo, kaugnay ng bahay/palasyo ng hari, at ang pagpatay sa kanya roon.'
