  to: Pagkatapos, inilabas ng paring si Jehoiada ang mga pinuno ng tig-isang daang kawal na nakatalaga sa hukbo. Sinabi niya sa kanila, “Ilabas ninyo siya sa pagitan ng mga hanay,[a] at patayin sa espada ang sinumang susunod sa kanya.” Sapagkat sinabi ng pari, “Huwag ninyo siyang patayin sa bahay ni Yahweh.”
  rationale: Ginawa lamang ang ligtas na paglilinaw na “tig-isang daang kawal” at pinalitan ang “itinalaga” ng mas natural na “nakatalaga.” Hindi binago ang kahulugan, ang antas ng kawalang-katiyakan sa pariralang Hebreo, o ang pangalan ni Yahweh.
