  text: וַ/יּוֹצֵא֩ יְהוֹיָדָ֨ע הַ/כֹּהֵ֜ן אֶת שָׂרֵ֥י הַ/מֵּא֣וֹת פְּקוּדֵ֣י הַ/חַ֗יִל וַ/יֹּ֤אמֶר אֲלֵ/הֶם֙ הֽוֹצִיא֨וּ/הָ֙ אֶל מִ/בֵּ֣ית הַ/שְּׂדֵר֔וֹת וְ/הַ/בָּ֥א אַחֲרֶ֖י/הָ יוּמַ֣ת בֶּ/חָ֑רֶב כִּ֚י אָמַ֣ר הַ/כֹּהֵ֔ן לֹ֥א תְמִית֖וּ/הָ בֵּ֥ית יְהוָֽה־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/014.yaml
  text: Then Jehoiada the priest brought out the commanders of hundreds who were appointed over the army[a], and said to them, “Bring her out between the ranks, and whoever follows after her, let him be put to death with the sword.” For the priest had said, “Do not put her to death in the house of Yahweh.”
translation:
  language: tl
  text: Pagkatapos, inilabas ng paring si Jehoiada ang mga pinuno ng tig-isang daang kawal na nakatalaga sa hukbo. Sinabi niya sa kanila, “Ilabas ninyo siya sa pagitan ng mga hanay,[a] at patayin sa espada ang sinumang susunod sa kanya.” Sapagkat sinabi ng pari, “Huwag ninyo siyang patayin sa bahay ni Yahweh.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa labas ng mga hanay.” Mahirap unawain ang pariralang Hebreo; malamang na tumutukoy ito sa paglalabas kay Atalia sa gitna o sa pagitan ng mga nakaayos na hanay.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹצֵא
  choice: inilabas
  rationale: Ang Hiphil ng יצא ay sanhiing lumabas o ilabas. Ang “inilabas” ay tuwiran at natural sa Filipino.
- source_word: שָׂרֵי הַמֵּאוֹת
  choice: mga pinuno ng tig-iisang daan
  rationale: Pinananatili nito ang pormal na katawagang militar sa Hebreo nang hindi gumagamit ng “senturyon,” na maaaring magpahiwatig ng kontekstong Romano.
- source_word: פְּקוּדֵי הַחַיִל
  choice: na itinalaga sa hukbo
  rationale: Ipinahahayag ng anyong ito ang mga lalaking binigyan ng tungkulin kaugnay ng hukbo; malinaw ang “itinalaga sa hukbo” nang hindi labis na tinutukoy ang eksaktong saklaw ng kanilang kapangyarihan.
- source_word: הוֹצִיאוּהָ
  choice: Ilabas ninyo siya
  rationale: Pautos na maramihan ito na may hulaping tumutukoy kay Atalia; pinananatili ng salin ang sanhiing diwa ng pandiwa.
- source_word: אֶל מִבֵּית הַשְּׂדֵרוֹת
  choice: sa pagitan ng mga hanay
  rationale: Mahirap at di-karaniwan ang pariralang Hebreo. Sa kontekstong militar, malamang na tumutukoy ang הַשְּׂדֵרוֹת sa nakaayos na mga hanay; inilalahad sa talababa ang tunay na kawalang-katiyakan.
- source_word: וְהַבָּא אַחֲרֶיהָ
  choice: ang sinumang susunod sa kanya
  rationale: Ang participle na may אַחֲרֶיהָ ay tumutukoy sa sinumang paparoon o susunod sa likuran niya, malamang bilang tagasuporta.
- source_word: יוּמַת בֶּחָרֶב
  choice: patayin sa espada
  rationale: Ang pasibong anyo ay may puwersa ng utos sa konteksto. Ang Filipino na “patayin” ay natural sa tuwirang utos at pinananatili ang espada bilang paraan ng pagpatay.
- source_word: כִּי אָמַר הַכֹּהֵן
  choice: Sapagkat sinabi ng pari
  rationale: Ipinakikita ng כִּי na ang naunang utos ay nakabatay sa tagubilin ng pari.
- source_word: לֹא תְמִיתוּהָ
  choice: Huwag ninyo siyang patayin
  rationale: Ang Hiphil ng מות ay nangangahulugang sanhiing mamatay o ipapatay; malinaw at likas sa Filipino ang pormang ito.
- source_word: בֵּית יְהוָה
  choice: bahay ni Yahweh
  rationale: Pinananatili nito ang karaniwang Hebreong ekspresyong “bahay ni Yahweh” at ang tahasang banal na pangalan.
theological_decisions:
- issue: Paglalapat ng banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON / Jehova
  rationale: Tahasang ginagamit ng tekstong Hebreo ang pangalang tipan na יהוה. Ang “Yahweh” ay transliterasyong nagpapanatili rito bilang pangalan sa halip na palitan ng titulo.
- issue: Pagkakakilanlan ng mga susunod kay Atalia
  choice: sinumang susunod sa kanya
  alternative: sinumang tagasuporta niya
  rationale: Hindi tahasang sinasabi ng Hebreo kung literal na pagsunod o pampolitika at militar na pagsuporta ang ibig sabihin. Pinananatili ng salin ang sadyang malawak na pahayag.
translation_notes:
  register: Makabago ngunit marangal na Filipino ang ginamit. Pinanatili ang pormal na katawagang militar at ang “bahay ni Yahweh,” habang iniwasan ang katawagang Romano at ang pagpapaliit sa malabong Hebreong parirala.
