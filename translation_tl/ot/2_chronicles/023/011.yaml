base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/011.yaml
  text: Then they brought out the king’s son[a], put the crown and the testimony on him, made him king, and anointed him; and Jehoiada and his sons said, “Long live the king!”
translation:
  language: tl
  text: Pagkatapos, inilabas nila ang anak ng hari, ipinutong sa kanya ang korona, at inilagay sa kanya ang patotoo[a]. Ginawa nila siyang hari at pinahiran siya ng langis ni Jehoiada at ng kanyang mga anak. At sinabi nina Jehoiada at ng kanyang mga anak, “Mabuhay ang hari!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang Kautusan” o “ang kasulatan ng tipan.” Malamang na tumutukoy ang salitang Hebreo sa nakasulat na patotoo ng tipan na kaugnay ng pamamahala ng hari.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹצִיאוּ
  choice: inilabas nila
  rationale: Ang hiphil ng יצא ay nangangahulugang magpalabas o magdala palabas. Ang “inilabas nila” ay natural sa Filipino at angkop sa seremonyal na paghaharap sa tagapagmana.
- source_word: בֶּן הַמֶּלֶךְ
  choice: ang anak ng hari
  rationale: Tuwirang isinasalin ang construct phrase at pinananatili ang mahalagang pagkakakilanlan niya bilang tagapagmana ng hari.
- source_word: הַנֵּזֶר
  choice: ang korona
  rationale: Sa konteksto ng pagluklok, ang נזר ay tumutukoy sa maharlikang korona o diyadema. “Korona” ang pinakamalinaw at pinakanauunawaang katumbas.
- source_word: הָעֵדוּת
  choice: ang Patotoo
  rationale: Pinananatili ng “Patotoo” ang pangunahing kahulugan ng salitang Hebreo at ang kaugnayan nito sa tipan, nang hindi tiyakang nililimitahan ito sa kautusan o sa isang kasulatan. Nilagyan ito ng malaking titik upang ipakitang isang partikular na bagay o dokumento ang tinutukoy.
- source_word: וַיַּמְלִיכוּ אֹתוֹ
  choice: ginawa nila siyang hari
  rationale: Tuwirang ipinapahayag nito ang causative na diwa ng מלך—ang gawin o itatag ang isang tao bilang hari—at hindi ito ipinagkakamali sa naunang pagpuputong ng korona.
- source_word: וַיִּמְשָׁחֻהוּ
  choice: pinahiran siya ng langis
  rationale: Ang “pinahiran ng langis” ang malinaw at tradisyonal na paglalarawan sa seremonyal na משׁח sa pagluklok ng hari.
- source_word: יְהוֹיָדָע וּבָנָיו
  choice: ni Jehoiada at ng mga anak nito
  rationale: Ipinahahayag ng ayos na ito na sina Jehoiada at ang kanyang mga anak ang simuno ng pangmaramihang pandiwang “pinahiran,” gaya ng natural na pagbasa sa Hebreo. Ginamit ang “nito” upang malinaw na kay Jehoiada ang mga anak.
- source_word: יְחִי הַמֶּלֶךְ
  choice: Mabuhay ang hari!
  rationale: Ito ang natural na Filipino na katumbas ng jussive na sigaw ng pagpupugay sa hari.
theological_decisions:
- issue: Kahulugan ng הָעֵדוּת sa ritwal ng pagluklok
  choice: Patotoo
  alternative: Kautusan; kasulatan ng tipan; atas
  rationale: Malawak ang salitang Hebreo at may pahiwatig ng tipan. Pinananatili ng “Patotoo” ang leksikal at teolohikal na saklaw nito, samantalang ipinapaliwanag sa talababa ang malamang na pagtukoy nito sa nakasulat na saksi o mga tungkuling kaugnay ng paghahari.
- issue: Simuno ng pagpapahid ng langis
  choice: Hayagang tinukoy sina Jehoiada at ang kanyang mga anak bilang mga nagpahid
  alternative: Iwan sa di-tiyak na “pinahiran nila siya,” saka simulan ang hiwalay na sugnay tungkol kina Jehoiada at sa kanyang mga anak
  rationale: Sa Hebreo, ang pangalang “Jehoiada at ang kanyang mga anak” ay sumusunod sa pangmaramihang pandiwa ng pagpapahid at pinaka-natural na nagsisilbing simuno nito; sila rin ang simuno ng kasunod na pagsigaw. Hindi kailangang gawing malabo sa Filipino ang malinaw na ugnayang panggramatika.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Mabuhay ang hari!” bilang natural na pormula ng pampublikong pagpupugay. Ang pag-uulit ng “Pagkatapos” ay nagpapanatili sa sunod-sunod na kilos ng salaysay nang hindi nagiging mabigat.
