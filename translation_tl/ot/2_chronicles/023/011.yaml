  source_fidelity: 'Tumpak sa kabuuan ang mga kilos ng Hebreo: inilabas ang anak ng hari, inilagay sa kanya ang korona at ang patotoo, ginawa siyang hari, at pinahiran ng langis. Ang ayos na “pinahiran siya ng langis ni Jehoiada at ng kanyang mga anak” ay wastong nagpapakita na sina Jehoiada at ang kanyang mga anak ang simuno ng pagpapahid; sila rin ang malinaw na simuno ng kasunod na pagsigaw. Mas mainam na pangalanan silang muli sa huling sugnay kaysa gumamit ng posibleng malabong “nila.”'
  naturalness: Natural at marangal ang pangunahing rehistro, ngunit mas idiomatiko ang “ng kanyang mga anak” kaysa “ng mga anak nito” kapag tao ang tinutukoy. Ang tahasang pagbanggit kina Jehoiada at sa kanyang mga anak sa huling sugnay ay mas malinaw sa modernong Filipino.
  terminology: Ang “korona,” “pinahiran ng langis,” at “Mabuhay ang hari!” ay angkop. Ang “patotoo” ay nagpapanatili ng sinadyang malawak na kahulugan ng הָעֵדוּת; hindi kailangang lagyan ng malaking titik sa pangunahing teksto, sapagkat hindi tiyak sa Hebreo ang teknikal na pangalan ng dokumento. Nananatili ang mga alternatibong pagbasa sa talababa.
