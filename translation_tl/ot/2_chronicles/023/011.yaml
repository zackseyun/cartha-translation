  - severity: low
    issue: Di-kailangang malaking titik sa “Patotoo.”
    rationale: Ang הָעֵדוּת ay tumutukoy sa isang tiyak na bagay sa konteksto, ngunit hindi ipinakikilala ng Hebreo ang isang pormal na pamagat. Ang maliit na titik ay mas maingat at pinananatili ang leksikal na kalabuan.
