base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/013.yaml
  text: And she looked[a], and behold, the king was standing by his pillar at the entrance, and the officials and the trumpets were beside the king; and all the people of the land were rejoicing and blowing trumpets, and the singers with the instruments of song were leading the praise. Then Athaliah tore her clothes and said[b], “Conspiracy! Conspiracy!”
translation:
  language: tl
  text: Nang tumingin siya, naroon ang hari, nakatayo sa tabi ng kanyang haligi sa pasukan. Ang mga pinuno at ang mga trumpeta[a] ay nasa tabi ng hari. Nagagalak ang buong bayan at nagpapatunog ng mga trumpeta, at ang mga mang-aawit, kasama ang mga instrumentong pangmusika, ay nangunguna sa pagpupuri[b]. Nang magkagayon, pinunit ni Atalia ang kanyang mga damit at sinabi, “Sabwatan! Sabwatan!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo: “ang mga pinuno at ang mga trumpeta.” Maaaring tumukoy ang “mga trumpeta” sa mga taong nagpapatunog ng mga ito.'
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “nangangasiwa sa pagpupuri.” Medyo idyomatiko ang pahayag sa Hebreo sa kontekstong ito ng musika.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּרֶא וְהִנֵּה
  choice: At tumingin siya, at naroon
  rationale: Pinananatili ng “tumingin” ang kusang pagkakita sa tagpo, samantalang likas na naihahatid ng “naroon” ang pansin at pagkagulat na ipinahihiwatig ng הִנֵּה.
- source_word: הַמֶּלֶךְ עוֹמֵד עַל עַמּוּדוֹ בַּמָּבוֹא
  choice: ang hari, nakatayo sa tabi ng kanyang haligi sa pasukan
  rationale: Ipinakikita ng “nakatayo” ang nagpapatuloy na tindig; ang “sa tabi ng” ay angkop sa lokasyong seremonyal ng hari kaugnay ng haligi.
- source_word: וְהַשָּׂרִים וְהַחֲצֹצְרוֹת עַל הַמֶּלֶךְ
  choice: Ang mga pinuno at ang mga trumpeta ay nasa tabi ng hari
  rationale: Pinananatili ang literal na “mga trumpeta” sa tekstong Hebreo sa halip na tahimik na palitan ito ng “mga tagap trumpeta”; ipinapaliwanag sa talababa ang malamang na metonimiya.
- source_word: וְכָל עַם הָאָרֶץ שָׂמֵחַ
  choice: Nagagalak ang buong bayan
  rationale: Ang “buong bayan” ay natural na modernong Tagalog para sa kolektibong mamamayan ng lupain, at ang “nagagalak” ay nagpapahayag ng hayagang pagdiriwang.
- source_word: וְתוֹקֵעַ בַּחֲצֹצְרוֹת
  choice: humihip ng mga trumpeta
  rationale: Direkta at malinaw na katumbas ng karaniwang Hebreong idyoma para sa pagpapatunog ng mga trumpeta.
- source_word: וְהַמְשׁוֹרֲרִים בִּכְלֵי הַשִּׁיר
  choice: ang mga mang-aawit, kasama ang mga instrumentong pangmusika
  rationale: Pinananatili ang tiyak na pagtukoy sa mga mang-aawit habang natural na isinasalin ang mga kasangkapang ginagamit sa musika.
- source_word: וּמוֹדִיעִים לְהַלֵּל
  choice: ay nangunguna sa pagpupuri
  rationale: Inihahatid nito ang tungkuling gumagabay o nangangasiwa sa pagpupuri sa kontekstong musikal, nang hindi pinipilit ang hindi tiyak na idyomang Hebreo.
- source_word: קֶשֶׁר קָשֶׁר
  choice: Pagtataksil! Pagtataksil!
  rationale: Sa konteksto ng pag-agaw o pagbago ng pamumuno, natural na sigaw sa Tagalog ang “Pagtataksil!” para sa isang sabwatan o paghihimagsik laban sa naghahari.
