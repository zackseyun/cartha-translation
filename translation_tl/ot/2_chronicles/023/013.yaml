    rationale: Ang Hebreong salita ay nangangahulugang sabwatan o conspiracy. Ang “pagtataksil” ay ibang konsepto at hindi sapat na tumpak sa leksikal na antas.
  - severity: medium
    issue: “sumigaw” para sa וַתֹּאמֶר
    rationale: Ang pinagmulan ay nagsasabing “sinabi”; bagaman posibleng pasigaw ang konteksto, hindi ito tahasang isinasaad at hindi dapat dagdagan.
  - severity: low
    issue: “At tumingin siya, at naroon”
    rationale: Nauunawaan ito ngunit medyo putol at di-likas. Ang “Nang tumingin siya, naroon” ay natural na Tagalog at nananatiling pansin-angkin ang tagpo.
