base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/005.yaml
  text: one third shall be at the king’s house[a], one third at the Foundation Gate, and all the people in the courts of the house of Yahweh.
translation:
  language: tl
  text: Ang ikatlong bahagi ay sa bahay ng hari, ang ikatlong bahagi ay sa Tarangkahan ng Pundasyon, at ang buong bayan ay sa mga looban ng bahay ni Yahweh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהַשְּׁלִשִׁית
  choice: ang ikatlong bahagi
  rationale: Ginagamit ang pambabaeng ordinal bilang pangngalan upang tukuyin ang isa sa tatlong pangkat; malinaw at likas sa Filipino ang “ikatlong bahagi.”
- source_word: בְּבֵית הַמֶּלֶךְ
  choice: sa bahay ng hari
  rationale: Pinananatili ang literal na “bahay,” na sa konteksto ay tumutukoy sa tirahan o palasyo ng hari, at ang “sa” ay angkop sa itinakdang puwesto.
- source_word: בְּשַׁעַר הַיְסוֹד
  choice: sa Tarangkahan ng Pundasyon
  rationale: Ang שַׁעַר ay “tarangkahan,” at ang יְסוֹד ay “pundasyon.” Itinuturing itong pangalan ng isang tiyak na tarangkahan habang pinananatili ang kahulugan ng Hebreo.
- source_word: וְכָל הָעָם
  choice: at ang buong bayan
  rationale: Ang עָם ay karaniwang “bayan” o “mga tao”; natural dito ang “buong bayan” bilang kolektibong tawag sa lahat ng naroon.
- source_word: בְּחַצְרוֹת
  choice: sa mga looban
  rationale: Ang pangmaramihang חָצֵר ay tumutukoy sa mga nakapaloob na bakuran o looban ng kompleks ng templo.
- source_word: בֵּית יְהוָה
  choice: bahay ni Yahweh
  rationale: Pinananatili ang literal na “bahay” at tahasang isinasalin ang banal na pangalang יהוה bilang “Yahweh.”
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Tahasang nasa tekstong Hebreo ang Tetragrammaton; ang “Yahweh” ay nagpapanatili rito bilang personal na pangalan sa halip na palitan ng titulo.
- issue: Pagpapakahulugan sa בְּשַׁעַר הַיְסוֹד
  choice: Tarangkahan ng Pundasyon
  alternative: tarangkahan ng pundasyon
  rationale: Maaaring pangalan ito ng isang partikular na tarangkahan. Ang paggamit ng malaking titik ay naghahayag ng posibilidad na iyon nang hindi nagdaragdag ng sektaryong paliwanag.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang maikling pariralang Hebreo at ang tatluhang paghahati; hindi idinagdag ang pandiwang wala sa talata, bagaman nauunawaan ang atas mula sa konteksto.
