  source_fidelity: 'Tumpak na naipapahayag ang tatluhang pagtatalaga sa Hebreo: isang ikatlo sa bahay ng hari, isang ikatlo sa isang tiyak na tarangkahan, at ang buong bayan sa mga looban ng bahay ni Yahweh. Wala itong idinagdag na pandiwa o pagpapakahulugang wala sa pinagmulan; ang elliptikal na anyo ay angkop dahil nakasalalay ito sa utos ng kalapit na konteksto.'
  naturalness: Likas at malinaw ang modernong Filipino. Ang magkatulad na hulma ng “Ang ikatlong bahagi ay sa ...” ay maayos na tumutugma sa pamamahaging nasa Hebreo. Ang “mga looban” ay nauunawaan bilang mga korteng nakapaloob sa kompleks ng bahay ni Yahweh.
  terminology: Ang “Yahweh” ay wastong pagpapanatili ng banal na pangalan. Ang “Tarangkahan ng Pundasyon,” na may malaking titik, ay katanggap-tanggap na maingat na pagtrato sa posibleng pangalan ng tarangkahan, at ang “bahay ng hari/bahay ni Yahweh” ay malapit sa בית sa Hebreo.
