  to: At ang buong kapulungan ay nakipagtipan sa hari sa bahay ng Diyos. Sinabi ni Jehoiada sa kanila, “Tingnan ninyo, ang anak ng hari ang maghahari, gaya ng sinabi ni Yahweh tungkol sa mga anak ni David.”
  rationale: Pinalitan lamang ang “sa loob ng bahay ng Diyos” ng “sa bahay ng Diyos” upang iwasan ang hindi kinakailangang pagpapakitid ng kahulugan ng pang-ukol sa Hebreo. Pinanatili ang iba pang mga pagpili, kabilang ang kontekstuwal na pagtukoy kay Jehoiada at ang maramihang “mga anak ni David.”
