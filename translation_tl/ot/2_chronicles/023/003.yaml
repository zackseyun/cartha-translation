base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/003.yaml
  text: And all the assembly made a covenant in the house of God with the king, and he said to them, “Look, the king’s son will reign, just as the LORD spoke concerning the sons of David.”
translation:
  language: tl
  text: At ang buong kapulungan ay nakipagtipan sa hari sa bahay ng Diyos. Sinabi ni Jehoiada sa kanila, “Tingnan ninyo, ang anak ng hari ang maghahari, gaya ng sinabi ni Yahweh tungkol sa mga anak ni David.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָל־הַקָּהָל
  choice: ang buong kapulungan
  rationale: Tuwirang ipinahahayag ang kabuuan ng nagkakatipong pangkat at natural sa makabagong Filipino.
- source_word: וַיִּכְרֹת ... בְּרִית
  choice: nakipagtipan
  rationale: Ang Hebreong idyomang literal na 'pumutol ng tipan' ay likas na isinasalin bilang pagpasok o pakikipagtipan.
- source_word: בְּבֵית הָאֱלֹהִים
  choice: sa loob ng bahay ng Diyos
  rationale: Pinananatili ang kongkretong katawagang 'bahay ng Diyos' at nililinaw na dito naganap ang pakikipagtipan.
- source_word: עִם־הַמֶּלֶךְ
  choice: sa hari
  rationale: Sa konstruksyong Filipino na 'nakipagtipan sa,' natural na katumbas ito ng Hebreong 'kasama/kay ang hari.'
- source_word: הִנֵּה
  choice: Tingnan ninyo
  rationale: Pinananatili ang pang-akit-pansing lakas ng הִנֵּה nang mas natural kaysa sa arkaikong 'Narito.'
- source_word: בֶן־הַמֶּלֶךְ יִמְלֹךְ
  choice: ang anak ng hari ang maghahari
  rationale: Ang pang-ukol na 'ang' bago sa pandiwa ay nagbibigay-diin sa itinakdang tagapagmana, gaya ng ayos ng Hebreo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin ang personal na pangalan ng Diyos bilang Yahweh sa halip na palitan ito ng titulong 'PANGINOON.'
- source_word: עַל בְּנֵי דָוִיד
  choice: tungkol sa mga anak ni David
  rationale: Pinananatili ang maramihang anyo at ang saklaw ng pangako hinggil sa mga inapo o anak ni David nang hindi ito higit na binibigyang-kahulugan.
theological_decisions:
- issue: Ang tinutukoy ng di-hayag na simuno sa וַיֹּאמֶר
  choice: Sinabi ni Jehoiada
  alternative: Sinabi niya
  rationale: Batay sa agarang konteksto ng 2 Cronica 23:1–3, si Jehoiada ang nagsasalita sa kapulungan. Ang pagbanggit sa pangalan ay nag-aalis ng posibleng maling pagbasa na ang hari ang nagsalita, nang hindi binabago ang diwa.
- issue: Ang ugnayan ng tipan at ng hari
  choice: nakipagtipan sa hari
  alternative: gumawa ng tipan kasama ng hari
  rationale: Hindi tinutukoy ng talata ang lahat ng nilalaman o eksaktong legal na papel ng batang hari; pinananatili lamang ang relasyong ipinahahayag ng עִם.
- issue: Ang pangako tungkol sa mga anak ni David
  choice: gaya ng sinabi ni Yahweh tungkol sa mga anak ni David
  alternative: gaya ng ipinangako ni Yahweh na ang mga anak ni David ay maghahari
  rationale: Pinananatili ang mas maluwag na 'sinabi tungkol sa' ng Hebreo at hindi idinaragdag sa talata ang mas tiyak na pagpapaliwanag sa pangako.
translation_notes:
  register: Makabagong, marangal, at madaling maunawaang Filipino. Ginamit ang 'kapulungan,' 'nakipagtipan,' at 'maghahari' bilang dignified ngunit karaniwang bokabularyo; iniwasan ang arkaikong 'narito' at ang labis na literal na 'pumutol ng tipan.'
