id: 2CH.23.18
reference: 2 Chronicles 23:18
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יָּשֶׂם֩ יְהוֹיָדָ֨ע פְּקֻדֹּ֜ת בֵּ֣ית יְהוָ֗ה בְּ/יַ֨ד הַ/כֹּהֲנִ֣ים הַ/לְוִיִּם֮ אֲשֶׁ֣ר חָלַ֣ק דָּוִיד֮ עַל בֵּ֣ית יְהוָה֒ לְֽ/הַעֲל֞וֹת עֹל֣וֹת יְהוָ֗ה כַּ/כָּת֛וּב בְּ/תוֹרַ֥ת מֹשֶׁ֖ה בְּ/שִׂמְחָ֣ה וּ/בְ/שִׁ֑יר עַ֖ל יְדֵ֥י דָוִֽיד־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/018.yaml
  text: And Jehoiada appointed the oversight of the house of Yahweh into the hand of the priests[a], the Levites, whom David had assigned over the house of Yahweh, to offer up burnt offerings to Yahweh, as it is written in the Law of Moses, with rejoicing and with song[c][b], according to the direction of David.
translation:
  language: tl
  text: Itinalaga ni Jehoiada ang pangangasiwa sa bahay ni Yahweh sa mga pari, ang mga Levita[a], na itinalaga ni David upang mangasiwa sa bahay ni Yahweh, upang maghandog ng mga handog na sinusunog para kay Yahweh, gaya ng nakasulat sa Kautusan ni Moises, nang may kagalakan at pag-awit, ayon sa tagubilin ni David.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “mga paring Levita” o “mga pari at mga Levita.” Maaaring unawain sa higit sa isang paraan ang pariralang Hebreo.
    reason: alternative_reading
  - marker: b
    text: Sa Hebreo, “sa pamamagitan ng kamay ni David”; maaari itong mangahulugang ayon sa pagsasaayos, pamamahala, o tagubilin ni David.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם ... פְּקֻדֹּת
  choice: Itinalaga ... ang pangangasiwa
  rationale: Ang שׂים ay literal na ‘ilagay,’ ngunit kasama ng פְּקֻדּוֹת sa kontekstong administratibo, tumutukoy ito sa pagtatatag o pagtatalaga ng pangangasiwa.
- source_word: בֵּית יְהוָה
  choice: bahay ni Yahweh
  rationale: Pinananatili nito ang konkretong idyomang Hebreo na ‘bahay’ sa halip na agad itong ipakahulugang ‘templo,’ habang natural pa rin sa Tagalog.
- source_word: בְּיַד
  choice: sa
  rationale: Ang literal na ‘sa kamay ng’ ay idyoma para sa pagkakatiwala ng pananagutan o awtoridad. Ang ‘sa mga pari’ ay likas na naghahatid ng administratibong diwa sa kasalukuyang Tagalog.
- source_word: הַכֹּהֲנִים הַלְוִיִּם
  choice: mga pari, ang mga Levita
  rationale: Malapit ito sa magkatabing katawagang Hebreo at hindi nito lubusang nilulutas kung apposisyon ang parirala o tumutukoy sa dalawang pangkat.
- source_word: אֲשֶׁר חָלַק דָּוִיד
  choice: na inatasan ni David
  rationale: Ang חָלַק ay ‘hatiin’ o ‘bahaginan,’ ngunit dito ay tumutukoy sa pag-aayos at pagtatalaga ni David sa mga tauhan para sa paglilingkod.
- source_word: לְהַעֲלוֹת עֹלוֹת
  choice: upang maghandog ng mga handog na sinusunog
  rationale: Ito ang malinaw at kinikilalang katawagan para sa mga haing lubusang sinusunog sa altar.
- source_word: כַּכָּתוּב בְּתוֹרַת מֹשֶׁה
  choice: gaya ng nakasulat sa Kautusan ni Moises
  rationale: Pinananatili ang pormulang tumutukoy sa nasusulat na tagubilin ng Torah.
- source_word: בְּשִׂמְחָה וּבְשִׁיר
  choice: nang may kagalakan at awitan
  rationale: Inihahatid nito ang dalawang nominal na paglalarawan sa masaya at musikal na pagsamba.
- source_word: עַל יְדֵי דָוִיד
  choice: ayon sa tagubilin ni David
  rationale: Ang idyomang ‘sa pamamagitan ng kamay ni David’ ay maaaring tumukoy sa kaniyang pagsasaayos o itinakdang tagubilin; ang pangunahing teksto ay naghahatid ng malamang na administratibong diwa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin ang tetragrammaton bilang personal na pangalang Yahweh sa halip na palitan ito ng isang titulo.
theological_decisions:
- issue: Paglalarawan sa ugnayan ng mga pari at mga Levita
  choice: mga pari, ang mga Levita
  alternative: mga paring Levita; o mga pari at mga Levita
  rationale: Maaaring basahin ang Hebreo bilang apposisyon o bilang pagtukoy sa magkaugnay ngunit magkahiwalay na mga pangkat. Pinananatili ng teksto at talababa ang tunay na kalabuan.
- issue: Paglilipat sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo, kaya pinananatili ito bilang Yahweh nang hindi pinapalitan ng titulo.
- issue: Kahulugan ng עַל יְדֵי דָוִיד
  choice: ayon sa tagubilin ni David
  alternative: sa pamamagitan ni David; sa pamamahala ni David
  rationale: Sa konteksto ng pagsasaayos ng paglilingkod at awitan sa templo, malamang na tumutukoy ito sa kaayusang itinakda ni David, ngunit itinatala sa talababa ang literal na idyoma at saklaw nito.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang ‘bahay ni Yahweh’ upang maipakita ang anyo ng Hebreo, samantalang ginawang likas sa Tagalog ang mga idyomang administratibo. Ginamit ang ‘awitan’ para sa liturhikal na pag-awit at iniwasang magpasok ng denominasyonal na pagpapakahulugan.
