    issue: Ang 'na inatasan ni David sa bahay ni Yahweh' ay kulang sa diwa ng pangangasiwa na nasa עַל בֵּית יְהוָה.
    rationale: Ang pang-ukol na עַל sa kontekstong ito ay nagpapahiwatig na ang mga tauhan ay inilagay upang mangasiwa sa bahay ni Yahweh, hindi lamang na inatasan sa loob o sa lugar ng bahay.
  - severity: low
    issue: Ang 'awitan' ay hindi gaanong tuwirang katumbas ng בְּשִׁיר.
    rationale: Bagaman maaari itong tumukoy sa musikal na pagsamba, ang 'pag-awit' ay mas malinaw na tumutukoy sa aktong singing at mas natural na kapareha ng 'kagalakan.'
