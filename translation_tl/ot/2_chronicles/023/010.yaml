- from: At inilagay niya sa kani-kanilang puwesto ang buong bayan, bawat isa ay may sandata sa kamay, mula sa timog na panig ng templo hanggang sa hilagang panig nito, sa tabi ng altar at ng templo, paikot sa hari.
