base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/010.yaml
  text: And he stationed all the people, each man with his weapon in his hand, from the south side of the house to the north side of the house, by the altar and by the house, around the king.
translation:
  language: tl
  text: At ipinuwesto niya ang lahat ng tao, bawat lalaki na may sandata sa kaniyang kamay, mula sa timog na panig ng templo hanggang sa hilagang panig nito, sa tabi ng altar at ng templo, nakapalibot sa hari.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲמֵד
  choice: inilagay niya sa kani-kanilang puwesto
  rationale: Ipinahahayag ng causative na pandiwa ang pag-aayos o pagpupuwesto sa mga tao, hindi lamang ang pagpap站.
- source_word: כָּל־הָעָם
  choice: ang buong bayan
  rationale: Ang עָם ay tumutukoy sa sama-samang mga taong naroon; natural at marangal sa Tagalog ang “buong bayan.”
- source_word: שִׁלְחוֹ
  choice: sandata
  rationale: Sa kontekstong militar, tumutukoy ito sa sandatang hawak ng bawat lalaki; pinanatiling pangkalahatan dahil hindi tiyak ang uri nito.
- source_word: כֶּתֶף הַבַּיִת הַיְמָנִית ... כֶּתֶף הַבַּיִת הַשְּׂמָאלִית
  choice: timog na panig ng templo ... hilagang panig nito
  rationale: Sa oryentasyong Hebreo na nakaharap sa silangan, ang kanan ay timog at ang kaliwa ay hilaga; malinaw na heograpikong katumbas ang ginamit ayon sa konteksto.
- source_word: הַבַּיִת
  choice: templo
  rationale: Sa konteksto, ang “bahay” ay ang templo; mas malinaw at natural ito sa modernong Tagalog.
- source_word: עַל־הַמֶּלֶךְ סָבִיב
  choice: paikot sa hari
  rationale: Tuwirang ipinahahayag ang pagkakalagay ng bantay sa palibot ng hari.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Ginamit ang “templo” para sa kontekstuwal na kahulugan ng הַבַּיִת at pinanatiling pangkalahatan ang “sandata” upang hindi magtakda ng uri na hindi tiyak sa Hebreo.
