    issue: Ang “bawat isa” ay hindi tahasang sumasalamin sa אִישׁ.
    rationale: Bagaman maaari itong gumana bilang pangkalahatang pananalita, ang Hebreo ay gumagamit ng “bawat lalaki,” kaya ligtas at mas tapat itong ilahad nang tuwiran.
  - severity: low
    issue: Medyo di-idiomatiko ang “paikot sa hari.”
    rationale: Mas likas sa modernong Tagalog ang “nakapalibot sa hari,” na malinaw ding naghahatid ng saklaw ng סָבִיב.
