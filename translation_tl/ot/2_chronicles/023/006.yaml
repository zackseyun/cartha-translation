source:
  edition: WLC
  text: וְ/אַל יָב֣וֹא בֵית יְהוָ֗ה כִּ֤י אִם הַ/כֹּֽהֲנִים֙ וְ/הַ/מְשָׁרְתִ֣ים לַ/לְוִיִּ֔ם הֵ֥מָּה יָבֹ֖אוּ כִּי קֹ֣דֶשׁ הֵ֑מָּה וְ/כָל הָ/עָ֔ם יִשְׁמְר֖וּ מִשְׁמֶ֥רֶת יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/006.yaml
  text: And let no one enter the house of Yahweh except the priests and the ministering Levites[a]; they may enter, because they are holy[b]. And let all the people keep the charge of Yahweh.
translation:
  language: tl
  text: Huwag pumasok sa bahay ni Yahweh ang sinuman, maliban sa mga pari at mga Levitang naglilingkod; sila ang maaaring pumasok sapagkat sila ay banal. At tuparin ng buong bayan ang tungkuling iniatas ni Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “tuparin ang tungkuling iniatas ni Yahweh” ay maaari ring isaling “ingatan ang iniatang na tungkulin ni Yahweh” o “magbantay para kay Yahweh.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַל יָבוֹא
  choice: At huwag papasukin ... ang sinuman
  rationale: Ang אַל na sinusundan ng anyong jussive ng בוא ay naghahayag ng pagbabawal. Likas sa modernong Tagalog ang konstruksiyong “huwag papasukin ... ang sinuman” at malinaw nitong ipinakikitang ipinagbabawal ang pagpasok.
- source_word: בֵית יְהוָה
  choice: bahay ni Yahweh
  rationale: Pinananatili nito ang literal na talinghagang Hebreo na “bahay ni Yahweh”; sa konteksto, tumutukoy ito sa templo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang transliterasyon ng personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
- source_word: כִּי אִם
  choice: maliban sa
  rationale: Ipinakikilala ng parirala ang tanging eksepsiyon sa naunang pagbabawal.
- source_word: הַכֹּהֲנִים וְהַמְשָׁרְתִים לַלְוִיִּם
  choice: mga pari at sa mga Levitang naglilingkod
  rationale: Ang participle מְשָׁרְתִים ay naglalarawan sa mga Levita bilang gumaganap ng sagradong paglilingkod.
- source_word: הֵמָּה יָבֹאוּ
  choice: sila ang maaaring pumasok
  rationale: Sa konteksto ng eksepsiyon, ipinahahayag nito ang pahintulot at binibigyang-diin ang mga awtorisadong pumasok.
- source_word: כִּי קֹדֶשׁ הֵמָּה
  choice: sapagkat sila ay banal
  rationale: Ang קֹדֶשׁ dito ay tumutukoy sa kanilang sagradong katayuan o pagkakatalaga, na siyang batayan ng pagpasok nila.
- source_word: וְכָל הָעָם
  choice: At ... ng buong bayan
  rationale: Ang הָעָם ay kolektibong tumutukoy sa lahat ng ibang kabilang sa kapulungan.
- source_word: יִשְׁמְרוּ מִשְׁמֶרֶת יְהוָה
  choice: tuparin ... ang tungkuling iniatas ni Yahweh
  rationale: Ang cognate construction na שׁמר משׁמרת ay maaaring tumukoy sa pagtupad sa itinakdang tungkulin, pagbabantay, o pagsunod sa kautusan. Ang salin ay natural sa Tagalog at hindi nililimitahan ang diwa sa pisikal na pagbabantay lamang.
theological_decisions:
- issue: Ang kabanalan ng mga pari at Levitang naglilingkod
  choice: sila ay banal
  alternative: sila ay itinalaga / ibinukod
  rationale: Pinananatili ng “banal” ang kategoryang teolohikal ng teksto. Sa kontekstong ito, tumutukoy ito sa sagradong katayuang nagpapahintulot sa pagpasok, hindi sa kawalan ng kasalanan.
- issue: Paglalahad sa banal na pangalan
  choice: Yahweh
  alternative: PANGINOON / Jehova
  rationale: Pinananatili ang personal na pangalang kinakatawan ng tetragrammaton nang hindi ito pinapalitan ng titulo.
- issue: Saklaw ng מִשְׁמֶרֶת יְהוָה
  choice: tungkuling iniatas ni Yahweh
  alternative: pagbabantay para kay Yahweh / kautusan ni Yahweh
  rationale: Maaaring tumukoy ang parirala sa itinakdang tungkulin, pagbabantay, o obligasyong panrelihiyon. Ang pangunahing salin ay malawak, habang inilalahad sa talababa ang tunay na lexical na pag-aalinlangan.
translation_notes:
  register: Modernong Filipino Tagalog na dignified ngunit madaling maunawaan. Ginamit ang “bahay ni Yahweh” upang mapanatili ang Hebreong larawan, at iniwasan ang masyadong teknikal na pananalitang panrelihiyon. Inilagay ang tanging talababa sa pangunahing teksto bilang [a].
