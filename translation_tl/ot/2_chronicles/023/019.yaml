  text: וַֽ/יַּעֲמֵד֙ הַ/שּׁ֣וֹעֲרִ֔ים עַֽל שַׁעֲרֵ֖י בֵּ֣ית יְהוָ֑ה וְ/לֹֽא יָבֹ֥א טָמֵ֖א לְ/כָל דָּבָֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/019.yaml
  text: He stationed the gatekeepers at the gates of the house of Yahweh[a], so that no one unclean in any respect might enter.
translation:
  language: tl
  text: Inilagay niya sa puwesto ang mga bantay-pinto sa mga pintuan ng bahay ni Yahweh, upang walang sinumang marumi sa anumang paraan[a] ang makapasok.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “walang marumi sa anumang bagay ang papasok.” Maaaring tumukoy ang pananalitang ito sa anumang uri o dahilan ng ritwal na karumihan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֵד
  choice: Inilagay niya sa puwesto
  rationale: 'Ang Hiphil ng עמד ay causative: pinatayo o inilagay niya ang mga tauhan sa kanilang tungkulin. Likas sa Filipino ang “inilagay sa puwesto” at malinaw na tumutukoy sa pagdestino sa kanila.'
- source_word: הַשּׁוֹעֲרִים
  choice: ang mga bantay-pinto
  rationale: Tiyak na tumutukoy ang salita sa mga taong inatasang magbantay sa mga pasukan, hindi lamang sa pangkalahatang mga guwardiya.
- source_word: עַל שַׁעֲרֵי
  choice: sa mga pintuan ng
  rationale: Sa kontekstong ito, ipinahihiwatig ng עַל ang kinalalagyan ng mga bantay sa mga pasukan. Natural at malinaw sa Filipino ang “sa mga pintuan.”
- source_word: בֵּית יְהוָה
  choice: bahay ni Yahweh
  rationale: Pinananatili ng “bahay” ang kongkretong salita sa Hebreo, habang likas na ipinahahayag ng “ni Yahweh” ang kaugnayan nito sa banal na pangalan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasatunog nang tuwiran ang personal na pangalang tipan na nakasulat sa tekstong Hebreo.
- source_word: וְלֹא יָבֹא
  choice: upang ... ang makapasok
  rationale: 'Sa konteksto, ang waw at negatibong imperfect ay nagpapahayag ng layunin o inaasahang bunga ng paglalagay ng mga bantay: hadlangan ang pagpasok.'
- source_word: טָמֵא
  choice: marumi
  rationale: Ito ang karaniwang salitang Filipino para sa kalagayang ritwal na humahadlang sa pagpasok sa banal na lugar.
- source_word: לְכָל דָּבָר
  choice: sa anumang paraan
  rationale: Malawak ang idyomang Hebreo at sumasaklaw sa anumang uri o dahilan ng ritwal na karumihan. Iniiwasan ng saling ito ang alanganing literal na “sa anumang bagay,” habang ipinaliliwanag iyon sa talababa.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehovah
  rationale: Hayagang ginagamit ng talata ang Tetragrammaton. Pinananatili ng “Yahweh” ang pagkakakilanlan nito bilang personal na pangalan sa halip na palitan ito ng isang titulo.
- issue: Kahulugan ng טָמֵא sa pagpasok sa templo
  choice: marumi
  alternative: marungis o nadungisan
  rationale: Ang tinutukoy ay ritwal na kalagayan, hindi karaniwang pisikal o moral na karumihan lamang. Pinananatili ng “marumi” ang tradisyonal na kategoryang panrelihiyon nang hindi dinaragdagan ang teksto ng isang tiyak na sanhi.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “bantay-pinto” at “inilagay sa puwesto” bilang natural na mga katumbas sa konteksto ng templo. Inilagay ang tandang [a] pagkatapos ng pariralang aktuwal na ipinaliliwanag ng talababa.
