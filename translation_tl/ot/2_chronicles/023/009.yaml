base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/009.yaml
  text: Then Jehoiada the priest gave to the commanders of hundreds the spears[a], the shields, and the large shields that belonged to King David[c][b], which were in the house of God.
translation:
  language: tl
  text: Pagkatapos, ibinigay ng paring si Jehoiada sa mga pinuno ng tig-iisang daang kawal[a] ang mga sibat, mga kalasag, at malalaking kalasag[b] na pag-aari ni Haring David at nasa bahay ng Diyos.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, mga opisyal na namumuno sa mga pangkat na may tig-iisang daang kawal; maaari ring isaling “mga kapitan ng tig-iisang daan.”
    reason: lexical_alternative
  - marker: b
    text: Ipinagkaiba ng Hebreo ang mga ito sa naunang “mga kalasag.” Hindi tiyak ang eksaktong uri ng pananggalang na tinutukoy.
    reason: lexical_alternative
  - marker: c
    text: O “templo ng Diyos.” Literal na “bahay ng Diyos.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: ibinigay
  rationale: Karaniwang salaysay na gamit ng נתן; malinaw nitong ipinahahayag ang paglilipat ng mga sandata sa mga pinuno.
- source_word: יְהוֹיָדָע הַכֹּהֵן
  choice: ang paring si Jehoiada
  rationale: Likas na ayos sa modernong Filipino para sa pangalang may kasunod na titulong כהן.
- source_word: לְשָׂרֵי הַמֵּאוֹת
  choice: sa mga pinuno ng tig-iisang daang kawal
  rationale: Ipinapakita ang tungkuling militar sa mga pangkat na may tig-iisang daan nang hindi gumagamit ng katawagang may partikular na Romanong pahiwatig.
- source_word: הַחֲנִיתִים
  choice: mga sibat
  rationale: Karaniwan at malinaw na katumbas sa Filipino ng sandatang tinutukoy ng חניתים.
- source_word: הַמָּגִנּוֹת
  choice: mga kalasag
  rationale: Pangkalahatang tawag sa mga kalasag at likas sa modernong Filipino.
- source_word: הַשְּׁלָטִים
  choice: malalaking kalasag
  rationale: Pinananatili ang pagkakaiba nito sa naunang מגנות; maaaring tumukoy ang salita sa ibang uri o mas malaking pananggalang, bagaman hindi ganap na tiyak ang eksaktong anyo.
- source_word: אֲשֶׁר לַמֶּלֶךְ דָּוִיד
  choice: na pag-aari ni Haring David
  rationale: Tuwirang ipinahahayag ang ugnayang pagmamay-ari sa pariralang Hebreo nang hindi nagdaragdag ng di-tiyak na aspektong pangpanahon.
- source_word: בֵּית הָאֱלֹהִים
  choice: bahay ng Diyos
  rationale: Pinananatili ang literal at makabuluhang diksyon ng Chronicler; sa konteksto, tumutukoy ito sa templo.
