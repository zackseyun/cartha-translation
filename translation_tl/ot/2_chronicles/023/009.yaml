translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “paring si Jehoiada” at “mga pinuno ng tig-iisang daang kawal” upang maging likas sa Filipino habang pinananatili ang estruktura at impormasyong militar ng Hebreo. Inilagay ang mga panandang talababa sa mismong pariralang kanilang nililinaw.
