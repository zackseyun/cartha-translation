  naturalness: Malinaw, marangal, at likas sa makabagong Filipino ang kabuuan. Mas malinaw at mas di-mapagkakamalian ang “pintuang nasa itaas” kaysa “Mataas na Pintuan.”
  terminology: Ang “mga kumandante ng tig-iisang daan,” “mga maharlika,” “mga pinuno ng bayan,” “bahay ni Yahweh,” at “trono ng kaharian” ay angkop at malapit sa Hebreo. Ang “sambayanan ng lupain” ay pinananatili ang pormal na pampublikong diwa ng עַם הָאָרֶץ; sapat ang paliwanag sa talababa.
