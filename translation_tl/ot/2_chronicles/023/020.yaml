  text: וַ/יִּקַּ֣ח אֶת שָׂרֵ֣י הַ/מֵּא֡וֹת וְ/אֶת הָֽ/אַדִּירִים֩ וְ/אֶת הַ/מּֽוֹשְׁלִ֨ים בָּ/עָ֜ם וְ/אֵ֣ת כָּל עַ֣ם הָ/אָ֗רֶץ וַ/יּ֤וֹרֶד אֶת הַ/מֶּ֨לֶךְ֙ מִ/בֵּ֣ית יְהוָ֔ה וַ/יָּבֹ֛אוּ בְּ/תֽוֹךְ שַׁ֥עַר הָֽ/עֶלְי֖וֹן בֵּ֣ית הַ/מֶּ֑לֶךְ וַ/יּוֹשִׁ֨יבוּ֙ אֶת הַ/מֶּ֔לֶךְ עַ֖ל כִּסֵּ֥א הַ/מַּמְלָכָֽה־־־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/020.yaml
  text: Then he took the commanders of hundreds[a], the nobles, the rulers of the people, and all the people of the land, and brought the king down from the house of Yahweh[c][b]. They entered through the upper gate of the king’s house and seated the king on the throne of the kingdom.
translation:
  language: tl
  text: Pagkatapos, isinama niya ang mga kumandante ng tig-iisang daan, ang mga maharlika[a], ang mga pinuno ng bayan, at ang buong sambayanan ng lupain[b]. Inihatid niya ang hari pababa mula sa bahay ni Yahweh. Dumaan sila sa pintuang nasa itaas ng bahay ng hari[c], at iniluklok nila ang hari sa trono ng kaharian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga makapangyarihan” o “mga taong may mataas na katayuan.”
    reason: lexical_alternative
  - marker: b
    text: Sa mga salaysay tungkol sa hari, ang “sambayanan ng lupain” ay isang karaniwang katawagan sa mamamayan bilang isang pangkat na may papel sa buhay pampubliko at pampulitika.
    reason: cultural_note
  - marker: c
    text: Ibig sabihin, ang palasyo ng hari.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: isinama niya
  rationale: Bagaman literal na “kinuha niya,” sa konteksto ay pinangunahan o isinama ni Jehoiada ang mga pangkat na binanggit; mas likas ito sa makabagong Tagalog.
- source_word: שָׂרֵי הַמֵּאוֹת
  choice: mga kumandante ng tig-iisang daan
  rationale: Pinananatili nito ang estruktura at tungkuling militar ng Hebreo nang hindi gumagamit ng katawagang Romano gaya ng “senturyon.”
- source_word: הָאַדִּירִים
  choice: mga maharlika
  rationale: Tumutukoy ang salita sa mga prominenteng makapangyarihang tao; sa tagpuang pampulitika at maharlika, ang “mga maharlika” ang likas na katumbas, habang kinikilala sa talababa ang mas malawak na diwa.
- source_word: הַמֹּשְׁלִים בָּעָם
  choice: mga pinuno ng bayan
  rationale: Malinaw at malapit sa Hebreo ang katawagang ito para sa mga taong may kapangyarihang mamahala sa sambayanan.
- source_word: כָּל עַם הָאָרֶץ
  choice: ang buong sambayanan ng lupain
  rationale: Pinananatili ang nakaugaliang idyomang Hebreo at ang pampublikong-pampulitikang diwa nito nang hindi ito nililimitahan sa mga karaniwang mamamayan lamang.
- source_word: וַיּוֹרֶד אֶת הַמֶּלֶךְ
  choice: Inihatid niya ang hari pababa
  rationale: 'Ipinapahayag ang causative at direksiyonal na diwa ng pandiwa: pinababa o inakay ni Jehoiada ang hari mula sa templo patungo sa palasyo.'
- source_word: מִבֵּית יְהוָה
  choice: mula sa bahay ni Yahweh
  rationale: Pinananatili ang Hebreong ekspresyong “bahay ni Yahweh” at tahasang isinasalin ang banal na pangalang יהוה bilang “Yahweh.”
- source_word: בְּתוֹךְ שַׁעַר הָעֶלְיוֹן
  choice: Dumaan sila sa Mataas na Pintuan
  rationale: Likas na Tagalog ito para sa pagpasok sa pamamagitan ng pintuan, habang pinananatili ang pagkakakilanlan ng pintuang nasa itaas.
- source_word: בֵּית הַמֶּלֶךְ
  choice: bahay ng hari
  rationale: Malapit ito sa literal na Hebreo; nililinaw ng talababa na sa kontekstong ito ay ang palasyo ng hari ang tinutukoy.
- source_word: וַיּוֹשִׁיבוּ
  choice: iniluklok nila
  rationale: Ipinahihiwatig ng causative na pandiwa ang pagpapaupo sa hari; ang “iniluklok” ay likas at angkop sa seremonyal na konteksto ng pag-upo sa trono.
- source_word: כִּסֵּא הַמַּמְלָכָה
  choice: trono ng kaharian
  rationale: Pinananatili nito ang tahasang pangngalang מַמְלָכָה at ang pormal na ugnayan ng trono sa paghahari.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tahasang ginagamit sa talata ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalang tipan nang hindi ito pinapalitan ng isang titulo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang ilang Hebreong anyo—“bahay ni Yahweh,” “sambayanan ng lupain,” at “trono ng kaharian”—kapag mahalaga ang pormal o pampulitikang diwa, ngunit gumamit ng likas na pandiwa gaya ng “isinama,” “dumaan,” at “iniluklok.”
