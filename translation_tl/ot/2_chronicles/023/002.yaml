  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יָּסֹ֨בּוּ֙ בִּֽ/יהוּדָ֔ה וַ/יִּקְבְּצ֤וּ אֶת הַ/לְוִיִּם֙ מִ/כָּל עָרֵ֣י יְהוּדָ֔ה וְ/רָאשֵׁ֥י הָ/אָב֖וֹת לְ/יִשְׂרָאֵ֑ל וַ/יָּבֹ֖אוּ אֶל יְרוּשָׁלִָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/002.yaml
  text: And they went throughout Judah and gathered the Levites from all the cities of Judah[a], and the heads of the fathers’ houses of Israel, and they came to Jerusalem.
translation:
  language: tl
  text: At nilibot nila ang Juda at tinipon ang mga Levita mula sa lahat ng lungsod ng Juda, at ang mga pinuno ng mga angkan[a] ng Israel; at dumating sila sa Jerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga pinuno ng mga sambahayan ng mga ninuno”; mas idiomatikong, “mga pinuno ng mga pamilya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּסֹבּוּ
  choice: nilibot nila
  rationale: Sa kontekstong ito, ang סבב ay tumutukoy sa paglalakbay sa iba't ibang bahagi ng isang lupain, hindi lamang sa pag-ikot o paglingon.
- source_word: בִּיהוּדָה
  choice: ang Juda
  rationale: Karaniwang anyo sa Filipino ng pangalang heograpiko; bilang layon ng pandiwang “nilibot,” natural ang panandang “ang.”
- source_word: וַיִּקְבְּצוּ
  choice: tinipon
  rationale: Tuwirang ipinapahayag ng קבץ ang pagtitipon ng mga tao sa iisang layunin.
- source_word: אֶת־הַלְוִיִּם
  choice: ang mga Levita
  rationale: Karaniwang katawagan sa Filipino para sa pangkat na tribo at panrelihiyon na tinutukoy ng Hebreo.
- source_word: מִכָּל עָרֵי יְהוּדָה
  choice: mula sa lahat ng lungsod ng Juda
  rationale: Pinananatili nito ang saklaw na ipinahihiwatig ng כָּל at ang ideya ng pinagmulan sa מִן.
- source_word: וְרָאשֵׁי הָאָבוֹת
  choice: pati ang mga pinuno ng mga angkan
  rationale: Ang literal na “mga ulo ng mga ama” ay isang idyomang pang-administratibo at pangangkan. Mas malinaw sa modernong Filipino ang “mga pinuno ng mga angkan,” habang itinatala sa talababa ang mas pormal na alternatibo.
- source_word: לְיִשְׂרָאֵל
  choice: ng Israel
  rationale: Dito, ang לְ ay nagpapahayag ng kaugnayan o pag-aari; hindi nito kinakailangang tukuyin ang layunin.
- source_word: וַיָּבֹאוּ אֶל־יְרוּשָׁלִָם
  choice: Pagkatapos, pumunta sila sa Jerusalem
  rationale: Ang בוא אֶל ay natural na “pumunta sa” sa Filipino. Ginawang hiwalay na pangungusap upang maiwasan ang mabigat na sunod-sunod na koordinasyon nang hindi binabago ang pagkakasunod ng salaysay.
theological_decisions:
- issue: Saklaw ng “Israel” sa kontekstong nakasentro sa Juda
  choice: Panatilihin ang “Israel” nang hindi pinapalitan ng “Juda” o “mga tao.”
  alternative: Juda; ang sambayanang Israel
  rationale: Malinaw na יִשְׂרָאֵל ang nasa Hebreo. Maaaring tumukoy ito sa mas malawak na bayang tipan kahit nakasentro sa kaharian ng Juda ang tagpo; ang pagpapanatili rito ay umiiwas sa pagpapaliit ng kahulugan.
- issue: Paglilipat sa idyomang רָאשֵׁי הָאָבוֹת
  choice: mga pinuno ng mga angkan
  alternative: mga pinuno ng mga sambahayan ng mga ninuno; mga pinuno ng mga angkan ng mga ninuno
  rationale: Ang parirala ay tumutukoy sa mga kinikilalang pinuno ng mga pangkat na nakabatay sa angkan. Ang pangunahing salin ay malinaw at marangal sa modernong Filipino, at pinananatili sa talababa ang mas pormal na anyo.
translation_notes:
  register: Modernong Filipino na natural at marangal. Ginamit ang “angkan” upang malinaw na maipahayag ang sinaunang estrukturang pampamilya nang hindi maging artipisyal ang pangunahing teksto; may talababa para sa mas pormal na anyo.
