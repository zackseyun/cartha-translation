base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/008.yaml
  text: So the Levites and all Judah did according to all that Jehoiada the priest had commanded[a], and each man took his men, those coming in on the Sabbath together with those going out on the Sabbath, for Jehoiada the priest had not dismissed the divisions.
translation:
  language: tl
  text: Kaya, ginawa ng mga Levita at ng buong Juda ang lahat ng iniutos sa kanila ng paring si Jehoiada. Kinuha ng bawat isa ang kanyang mga tauhan—ang mga pumapasok sa tungkulin sa Sabbath kasama ang mga lumalabas sa tungkulin sa Sabbath—sapagkat hindi pinauwi ng paring si Jehoiada ang mga pangkat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga pangkat na salitan sa tungkulin”; tumutukoy ito sa nakatakdang mga pangkat ng mga pari at Levita na naglilingkod nang salitan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: ginawa
  rationale: Karaniwang kahulugan ng עשה rito ang pagsasagawa o pagtupad sa iniutos; natural sa Filipino ang pariralang “ginawa ... ayon sa iniutos.”
- source_word: הַלְוִיִּם
  choice: mga Levita
  rationale: Pamantayang katawagan sa Filipino para sa tinutukoy na pangkat; ipinahihiwatig ng “mga” ang maramihan at tiyak na pangkat.
- source_word: וְכָל יְהוּדָה
  choice: at ng buong Juda
  rationale: Pinananatili ang kolektibong pagtukoy ng Hebreo sa Juda sa halip na tahasang dagdagan ng “mga mamamayan.”
- source_word: כְּכֹל אֲשֶׁר צִוָּה
  choice: ang lahat ayon sa iniutos
  rationale: Ipinapahayag ang ganap na pagsunod na saklaw ng כְּכֹל אֲשֶׁר sa natural na ayos ng Filipino.
- source_word: יְהוֹיָדָע הַכֹּהֵן
  choice: paring si Jehoiada
  rationale: Natural na ayos sa Filipino para sa pangalan at katungkulan, habang pinananatili ang personal na pangalan.
- source_word: וַיִּקְחוּ אִישׁ אֶת אֲנָשָׁיו
  choice: Kinuha ng bawat isa ang kanyang mga tauhan
  rationale: Ang אִישׁ ay distributibo, “bawat isa,” at ang אֲנָשָׁיו ay mga taong nasa ilalim ng kanyang pamamahala; mas natural at malinaw ang “mga tauhan” kaysa literal na “mga lalaki niya.”
- source_word: בָּאֵי הַשַּׁבָּת
  choice: ang mga pumapasok sa tungkulin sa araw ng Sabbath
  rationale: Ang participle ay tumutukoy sa pangkat na pumapasok sa lingguhang serbisyo. Ang “sa tungkulin” ay nilinaw mula sa konteksto upang hindi magmukhang simpleng pagpasok sa isang lugar.
- source_word: עִם יוֹצְאֵי הַשַּׁבָּת
  choice: kasama ang mga lumalabas sa tungkulin sa araw ng Sabbath
  rationale: Pinananatili ang magkatambal na larawan ng papasok at papalabas na mga pangkat sa pagpapalit ng tungkulin.
- source_word: כִּי
  choice: sapagkat
  rationale: Nagpapakilala ito ng paliwanag kung bakit kapwa naroon ang papasok at papalabas na mga pangkat.
- source_word: לֹא פָטַר
  choice: hindi pinauwi
  rationale: Sa konteksto, nangangahulugan ang פטר na hindi sila pinaalis o pinalaya mula sa tungkulin; “pinauwi” ang malinaw at natural na ekspresyon sa Filipino.
- source_word: הַמַּחְלְקוֹת
  choice: mga pangkat
  rationale: Tumutukoy sa organisadong mga pangkat na nakatalaga sa paglilingkod. Ang “mga pangkat” ay madaling maunawaan; inilalagay sa talababa ang mas tiyak na kahulugang mga pangkat o salitan sa tungkulin.
