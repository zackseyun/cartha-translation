translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Sabbath” bilang pamilyar na terminong biblikal at “mga tauhan” para sa mga lalaking nasa ilalim ng bawat pinuno. Ang mga gitling na pahaba ay naghihiwalay sa paliwanag tungkol sa papasok at papalabas na mga pangkat nang hindi binabago ang ugnayang sintaktiko.
