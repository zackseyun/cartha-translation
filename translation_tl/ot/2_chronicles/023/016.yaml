base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/016.yaml
  text: Then Jehoiada made a covenant between himself[a], all the people, and the king[c][b], that they should be Yahweh's people.
translation:
  language: tl
  text: Pagkatapos, gumawa si Jehoiada ng tipan sa pagitan niya mismo, ng buong bayan, at ng hari[a], upang sila’y maging bayan ni Yahweh.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “pumutol ng tipan si Jehoiada sa pagitan niya mismo, ng buong bayan, at ng hari.”
    reason: lexical_alternative
  - marker: b
    text: O “upang maging isang bayan para kay Yahweh.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכְרֹת ... בְּרִית
  choice: nakipagtipan
  rationale: Ang כרת ברית ay idyomang literal na ‘pumutol ng tipan.’ Ang ‘nakipagtipan’ ang likas at marangal na katumbas sa modernong Tagalog; ipinahihiwatig ng ‘Pagkatapos’ ang pagsulong ng salaysay.
- source_word: בֵּינוֹ וּבֵין כָּל הָעָם וּבֵין הַמֶּלֶךְ
  choice: si Jehoiada sa buong bayan at sa hari
  rationale: Pinananatili nitong magkakahiwalay na kalahok si Jehoiada, ang buong bayan, at ang hari, nang hindi idinaragdag si Yahweh bilang tahasang kabilang sa nakalistang mga panig.
- source_word: לִהְיוֹת לְעָם לַיהוָה
  choice: na sila ay maging bayan ni Yahweh
  rationale: Ipinapahayag ng infinitive ang layunin ng tipan. Ang ‘bayan ni Yahweh’ ay natural sa Tagalog at naghahayag ng pag-aari o kaugnayang pangtipan nang hindi labis na nilulutas ang saklaw ng parirala.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang personal na pangalang banal na tuwirang kinakatawan ng Tetragrammaton sa tekstong Hebreo.
theological_decisions:
- issue: Sino ang mga panig sa tipan
  choice: Si Jehoiada, ang buong bayan, at ang hari ang nakalistang mga kalahok
  alternative: Si Yahweh ang isang panig, at ang bayan at hari ang kabilang panig
  rationale: 'Tatlong elemento ang tahasang kasunod ng magkakaugnay na בֵּין: si Jehoiada, ang buong bayan, at ang hari. Si Yahweh ay binabanggit sa layunin ng tipan bilang siyang kinabibilangan ng bayan, hindi bilang tahasang nakalistang panig.'
- issue: Diwa ng לְעָם לַיהוָה
  choice: maging bayan ni Yahweh
  alternative: maging isang bayan para kay Yahweh
  rationale: Ang pangunahing salin ay natural at malinaw na nagpapahayag ng pag-aari at katapatan sa tipan; inilalagay sa talababa ang mas pormal na anyo upang mapanatili ang posibleng diin ng dalawang ל.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Pinili ang ‘nakipagtipan’ sa halip na literal na ‘pumutol ng tipan,’ at pinanatili ang pangalang Yahweh. Ang lahat ng marker na [a] at [b] ay nasa pangunahing teksto.
