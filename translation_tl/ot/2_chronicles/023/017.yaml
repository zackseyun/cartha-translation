base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/017.yaml
  text: Then all the people went to the house of Baal and tore it down, and they smashed his altars and his images, and they killed Mattan the priest of Baal before the altars.
translation:
  language: tl
  text: Pagkatapos, pumunta ang buong bayan sa templo ni Baal at giniba iyon. Dinurog nila ang mga altar at mga imahen nito, at pinatay nila si Matan, na pari ni Baal, sa harap ng mga altar.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֵּית הַבַּעַל
  choice: templo ni Baal
  rationale: Ang בֵּית sa kontekstong ito ay gusaling sambahan, kaya mas malinaw at natural ang “templo” kaysa literal na “bahay.”
- source_word: וַיִּתְּצֻהוּ
  choice: giniba iyon
  rationale: Ipinahihiwatig ng pandiwa ang paggiba o pagbuwag sa templo; pinananatili ng “giniba” ang lakas at katiyakan ng kilos.
- source_word: שִׁבֵּרוּ
  choice: Dinurog
  rationale: Ang masidhing anyo ng שבר ay tumutukoy sa lubusang pagbasag; ang “dinurog” ay natural at malinaw na nagpapahayag ng marahas na pagwasak.
- source_word: צְלָמָיו
  choice: mga imahen nito
  rationale: Tumutukoy ang צֶלֶם sa mga larawang inanyuan o rebultong panrelihiyon. Ginamit ang “nito” upang mapanatili ang gramatikal na pagtukoy kay Baal nang hindi ipinahihiwatig na tunay siyang buhay na may-ari.
- source_word: לִפְנֵי הַמִּזְבְּחוֹת
  choice: sa harap ng mga altar
  rationale: Tuwirang inililipat ang lokatibong parirala nang hindi ipinapalagay kung ang mga altar ay nasa loob o labas ng templo.
theological_decisions:
- issue: Pagtukoy kay Baal at sa kaniyang mga altar at imahen
  choice: “templo ni Baal” ngunit “mga altar at mga imahen nito”
  alternative: “kaniyang mga altar at kaniyang mga imahen”
  rationale: Pinananatili ang malinaw na ugnayan kay Baal habang iniiwasan ang personal na panghalip na maaaring magbigay ng hindi kailangang impresyon tungkol sa ontolohikal na katayuan ng diyos-diyosan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “bayan” para sa kolektibong עָם at “altar” bilang karaniwang salitang panrelihiyon sa modernong Filipino. Ang pangalan ay isinaling “Matan” ayon sa likas na baybay sa Filipino.
