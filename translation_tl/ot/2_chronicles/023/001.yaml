- from: 'Nang ikapitong taon, nagpakalakas ng loob si Joiada at isinama niya sa isang tipan[a] ang mga pinuno ng mga pangkat na tig-iisang daan: si Azarias na anak ni Jeroham, si Ismael na anak ni Jehohanan, si Azarias na anak ni Obed, si Maaseias na anak ni Adaias, at si Elisafat na anak ni Zicri.'
