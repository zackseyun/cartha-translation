base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/001.yaml
  text: 'In the seventh year Jehoiada strengthened himself and took the commanders of hundreds into covenant with him: Azariah son of Jeroham[a], Ishmael son of Jehohanan, Azariah son of Obed, Maaseiah son of Adaiah, and Elishaphat son of Zichri.'
translation:
  language: tl
  text: 'Noong ikapitong taon, nagpakalakas ng loob si Joiada at isinama niya ang mga pinuno ng mga pangkat na tig-iisang daan sa isang tipan kasama niya: si Azarias na anak ni Jeroham, si Ismael na anak ni Jehohanan, si Azarias na anak ni Obed, si Maaseias na anak ni Adaias, at si Elisafat na anak ni Zicri.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבַשָּׁנָה הַשְּׁבִעִית
  choice: Nang ikapitong taon
  rationale: Likas na pariralang temporal sa Tagalog; hindi kailangang isalin nang tahasan ang panimulang pangatnig upang mapanatili ang daloy.
- source_word: הִתְחַזַּק
  choice: nagpakalakas ng loob
  rationale: Pinananatili ang reflexive na diwa ng Hitpael at ang kontekstuwal na kahulugang nagkaroon ng tapang o katatagan si Joiada bago kumilos.
- source_word: וַיִּקַּח ... עִמּוֹ בַבְּרִית
  choice: isinama niya sa isang tipan
  rationale: Ipinahahayag nang natural sa Tagalog ang literal na larawan ng ‘pagkuha’ sa mga opisyal upang mapabilang sila sa isang kasunduang tipan kasama niya, nang hindi ipinapalagay ang mga di-binanggit na detalye nito.
- source_word: שָׂרֵי הַמֵּאוֹת
  choice: mga pinuno ng mga pangkat na tig-iisang daan
  rationale: Malinaw na inilalarawan ang mga opisyal na namumuno sa yunit na binubuo ng isandaan, habang iniiwasan ang katawagang may partikular na Romanong pahiwatig.
- source_word: לַעֲזַרְיָהוּ ... וּלְיִשְׁמָעֵאל ... וְלַעֲזַרְיָהוּ ... וְאֶת מַעֲשֵׂיָהוּ ... וְאֶת אֱלִישָׁפָט
  choice: Azarias ... Ismael ... Azarias ... Maaseias ... at Elisafat
  rationale: Gumagamit ng mga anyong pangalan na likas sa tradisyong Tagalog; pinananatili ang dalawang magkaibang taong parehong nagngangalang Azarias.
- source_word: בֶן
  choice: anak ni
  rationale: Karaniwang paraan sa Tagalog ng pagtukoy sa ama ng isang tao.
