translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “nagpakalakas ng loob” upang mapanatili ang reflexive na diin, at “mga pangkat na tig-iisang daan” upang maipaliwanag ang titulong militar nang hindi nagdaragdag ng Romanong kulay.
