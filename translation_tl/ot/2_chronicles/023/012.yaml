  text: When Athaliah heard the noise of the people running and praising the king, she came to the people at the house of the LORD.
translation:
  language: tl
  text: Nang marinig ni Atalia ang ingay ng mga taong tumatakbo at nagpupuri sa hari, pumunta siya sa mga tao sa bahay ni Yahweh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ק֤וֹל
  choice: ingay
  rationale: Sa konteksto, tumutukoy ito sa sama-samang tunog na nililikha ng mga taong tumatakbo at nagpupuri; mas natural dito ang “ingay” kaysa literal na “tinig.”
- source_word: הָֽרָצִ֔ים
  choice: mga taong tumatakbo
  rationale: Pinananatili ang tahasang kilos ng participle at ang ugnay nito sa “mga tao.”
- source_word: מְהַֽלְלִ֖ים
  choice: nagpupuri
  rationale: Tuwirang ipinapahayag ang masiglang pagpupuri o pagbubunyi sa hari nang hindi dinaragdagan ang diwa.
- source_word: בֵּ֥ית יְהוָֽה
  choice: bahay ni Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos sa Hebreo at ang karaniwang biblikal na katawagang “bahay” para sa templo.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Ang paggamit ng “Yahweh” ay direktang kumakatawan sa personal na pangalan sa tekstong Hebreo, sa halip na palitan ito ng titulong “PANGINOON.”
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino; pinanatili ang payak na daloy at mga konkretong kilos ng tekstong Hebreo.
