base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/004.yaml
  text: 'This is what you shall do: one third of you who come in on the Sabbath[a], of the priests and of the Levites, shall be gatekeepers of the thresholds.'
translation:
  language: tl
  text: 'Ito ang gagawin ninyo: isang-katlo sa inyo na pumapasok tuwing Sabbath—mula sa mga pari at Levita—ay magiging mga bantay-pinto sa mga bungad.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “magbabantay sa mga bungad.” Pinag-uugnay ng Hebreo ang mga salitang “mga bantay-pinto” at “mga bungad,” na nagbibigay-diin sa pagbabantay sa mga pasukan.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶה הַדָּבָר אֲשֶׁר תַּעֲשׂוּ
  choice: Ito ang gagawin ninyo
  rationale: Likas at tuwirang pormula sa modernong Tagalog na pinananatili ang lakas ng utos.
- source_word: הַשְּׁלִשִׁית מִכֶּם
  choice: ang ikatlong bahagi sa inyo
  rationale: Malinaw na ipinahahayag ang bahaging isang-katlo na kukunin mula sa grupong kinakausap.
- source_word: בָּאֵי הַשַּׁבָּת
  choice: na pumapasok sa araw ng Sabbath
  rationale: Ang participle ay tumutukoy sa mga dumarating o pumapasok para sa tungkulin sa Sabbath; pinananatili ng salin ang ideya ng pagpasok.
- source_word: לַכֹּהֲנִים וְלַלְוִיִּם
  choice: mula sa mga pari at mga Levita
  rationale: 'Ipinakikita ang partitive o appositional na ugnayan: ang pangkat na pumapasok ay binubuo ng mga pari at mga Levita.'
- source_word: לְשֹׁעֲרֵי הַסִּפִּים
  choice: ay magiging mga bantay sa mga pasukan
  rationale: Isinasalin ang tungkulin ng שֹׁעֲרֵי bilang mga bantay-pinto at ang הַסִּפִּים bilang mga bungad o threshold; mas natural sa Tagalog ang 'mga bantay sa mga pasukan' habang nananatili ang diin sa pagbabantay ng mga entrada.
