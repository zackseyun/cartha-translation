  yaml_path: translation/ot/2_chronicles/023/021.yaml
  text: And all the people of the land rejoiced[a], and the city was quiet. And they put Athaliah to death with the sword.
translation:
  language: tl
  text: Nagalak ang lahat ng mamamayan ng lupain, at tahimik ang lungsod. At pinatay nila si Atalia sa pamamagitan ng tabak.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׂמְחוּ
  choice: nagalak
  rationale: Ang שׂמח ay nagpapahayag ng galak o tuwa. Ang “nagalak” ay natural at marangal para sa hayagang pagdiriwang ng bayan.
- source_word: כָל עַם הָאָרֶץ
  choice: ang lahat ng mamamayan sa lupain
  rationale: Tumutukoy ang parirala sa buong populasyon ng lupain. Pinananatili ng “sa lupain” ang heograpikong diwa nang hindi ipinapalagay na ang tinutukoy ay buong bansa sa makabagong kahulugan.
- source_word: וְהָעִיר
  choice: at ang lungsod
  rationale: Tuwirang salin ito. Bagaman Jerusalem ang malamang na tinutukoy ayon sa konteksto, “ang lungsod” lamang ang tahasang sinasabi ng Hebreo.
- source_word: שָׁקָטָה
  choice: naging payapa
  rationale: Ang שׁקט ay maaaring mangahulugang naging tahimik, panatag, o malaya sa kaguluhan. Ang “naging payapa” ay natural sa Filipino at angkop sa paghupa ng kaguluhan sa lungsod.
- source_word: וְאֶת עֲתַלְיָהוּ הֵמִיתוּ
  choice: At pinatay nila si Atalia
  rationale: Ang Hiphil ng מות ay literal na “pinapangyaring mamatay” at idyomatikong nangangahulugang “pinatay” o “ipinapatay.” Isinalin ang waw bilang payak na “At” upang mapanatili ang koordinasyon sa Hebreo at hindi magpasok ng tahasang ugnayang sanhi na hindi minarkahan sa teksto.
- source_word: בֶחָרֶב
  choice: sa pamamagitan ng tabak
  rationale: Instrumental ang gamit ng ב, at malinaw na ipinahahayag ng salin na tabak ang ginamit sa pagpatay.
