  yaml_path: translation/ot/2_chronicles/023/007.yaml
  text: The Levites shall surround the king on every side[a], each man with his weapons in his hand; and whoever enters the house shall be put to death. Be with the king when he comes in and when he goes out.
translation:
  language: tl
  text: Palibutan ninyo ang hari sa lahat ng panig, bawat isa ay may hawak na mga sandata; at ang sinumang pumasok sa bahay[a] ay papatayin. Samahan ninyo ang hari sa pagpasok niya at sa paglabas niya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “templo.” Sa Hebreo, “bahay,” na karaniwang tawag sa templo sa Mga Cronica.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקִּיפוּ הַלְוִיִּם אֶת הַמֶּלֶךְ סָבִיב
  choice: Palilibutan ng mga Levita ang hari sa lahat ng panig
  rationale: Ipinapahayag ng anyong pandiwa ang tagubilin, at pinananatili ng “sa lahat ng panig” ang diin ng סָבִיב sa ganap na pagpalibot.
- source_word: אִישׁ וְכֵלָיו בְּיָדוֹ
  choice: bawat isa ay may hawak na mga sandata
  rationale: Distributibo ang אִישׁ, at sa konteksto ng armadong pagbabantay, ang כֵּלָיו ay tumutukoy sa mga sandata. Natural sa Filipino ang “may hawak” para sa literal na “nasa kanyang kamay.”
- source_word: וְהַבָּא אֶל הַבַּיִת
  choice: ang sinumang pumasok sa bahay
  rationale: 'Ang may-artikulong participle ay pangkalahatan: “sinumang pumapasok/pumasok.” Pinananatili sa pangunahing teksto ang literal na “bahay,” habang nililinaw sa talababa ang karaniwang kahulugan nito sa Mga Cronica.'
- source_word: יוּמָת
  choice: ay papatayin
  rationale: Ang Hophal ay pasibong causative at tumutukoy sa paglalapat ng parusang kamatayan, hindi lamang sa kusang pagkamatay.
- source_word: וִהְיוּ אֶת הַמֶּלֶךְ
  choice: Samahan ninyo ang hari
  rationale: Ang pangmaramihang pautos ng היה kasama ng אֶת ay nagsasaad ng pananatili o pag-iral na kasama ng hari; “samahan ninyo” ang natural na utos sa konteksto ng proteksiyon.
- source_word: בְּבֹאוֹ וּבְצֵאתוֹ
  choice: sa pagpasok niya at sa paglabas niya
  rationale: Pinananatili ang magkatambal na kilos ng pagpasok at paglabas nang malinaw at natural sa modernong Filipino.
