translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “mga Levita,” “hari,” at “mga sandata” bilang pamilyar ngunit tumpak na mga katawagan. Pinanatili ang literal na “bahay” sa teksto at inilagay sa talababa ang kontekstuwal na alternatibong “templo.”
