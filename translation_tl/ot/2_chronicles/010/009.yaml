  yaml_path: translation/ot/2_chronicles/010/009.yaml
  text: And he said to them[a], “What do you advise, so that we may answer this people who have spoken to me, saying, ‘Lighten the yoke that your father put on us’?”
translation:
  language: tl
  text: Sinabi niya sa kanila, “Ano ang maipapayo ninyo upang maisagot natin sa bayang ito na nagsabi sa akin, ‘Pagaanin mo ang pamatok na ipinataw sa amin ng iyong ama’?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵהֶם
  choice: Sinabi niya sa kanila
  rationale: Likas na salin ng panimulang wayyiqtol sa salaysay; hindi kailangan ang tahasang pang-ugnay sa modernong Tagalog.
- source_word: מָה אַתֶּם נוֹעָצִים
  choice: Ano ang maipapayo ninyo
  rationale: Ipinahahayag ang paghingi ng payo mula sa pangkat at natural itong pakinggan sa tuwirang pananalita.
- source_word: וְנָשִׁיב דָּבָר
  choice: upang maisagot natin
  rationale: Ang idyomang Hebreo ay tumutukoy sa pagbibigay ng tugon; ipinapakita ng “upang” ang layuning kaugnay ng hinihinging payo.
- source_word: הָעָם הַזֶּה
  choice: bayang ito
  rationale: Pinananatili ang kolektibong pangngalan ng Hebreo sa natural at dignidad na Tagalog.
- source_word: דִּבְּרוּ אֵלַי לֵאמֹר
  choice: na nagsabi sa akin
  rationale: Natural na pinagsasama sa Tagalog ang pandiwa ng pagsasalita at ang quotative infinitive nang hindi inuulit ang “na sinasabi.”
- source_word: הָקֵל מִן הָעֹל
  choice: Pagaanin mo ang pamatok
  rationale: Pinananatili ang pautos at ang kongkretong larawan ng pamatok bilang metapora ng mabigat na paggawa o pamamahala.
- source_word: נָתַן ... עָלֵינוּ
  choice: ipinataw sa amin
  rationale: Ang “ipinataw” ay likas sa Tagalog para sa pasaning ipinilit o inilagay sa iba at angkop sa metapora ng pamatok.
- source_word: אָבִיךָ
  choice: iyong ama
  rationale: Tuwirang salin ng ikalawang panauhang panlalaking isahan na tumutukoy sa ama ni Rehoboam.
