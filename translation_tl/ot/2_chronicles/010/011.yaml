base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/010/011.yaml
  text: And now[a], my father made your yoke heavy, but I will add to your yoke. My father disciplined you with whips, but I with scorpions.
translation:
  language: tl
  text: Ngayon, ginawang mabigat ng aking ama ang inyong pamatok, ngunit magdaragdag ako sa inyong pamatok. Dinisiplina kayo ng aking ama gamit ang mga latigo, ngunit didisiplinahin ko kayo gamit ang mga alakdan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O marahil, “mga latigong-alakdan,” samakatuwid, mga latigong may matutulis na dulo o kawit; literal na “mga alakdan” ang Hebreo.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶעְמִיס ... עֹל כָּבֵד
  choice: pinabigat ... ang inyong pamatok
  rationale: Ipinahahayag ng Hiphil na הֶעְמִיס ang pagpapasan o pagpapabigat ng pasanin; pinananatili ng salin ang tahasang larawan ng mabigat na pamatok sa natural na Filipino.
- source_word: אֹסִיף עַל עֻלְּכֶם
  choice: lalo ko pang pabibigatin ang inyong pamatok
  rationale: Literal itong 'magdaragdag ako sa inyong pamatok.' Mas natural sa Filipino ang napiling anyo at malinaw nitong pinananatili ang pamatok bilang talinghaga at ang ideya ng karagdagang bigat.
- source_word: יִסַּר
  choice: pinarusahan
  rationale: Maaaring tumukoy ang יסר sa pagdidisiplina o pagpaparusa. Sa konteksto ng mga latigo at banta ng mas malupit na pagtrato, malinaw at natural ang 'pinarusahan' nang hindi nagdaragdag ng doktrinal na pakahulugan.
- source_word: בַּשּׁוֹטִים
  choice: sa pamamagitan ng mga latigo
  rationale: Ang שׁוֹט ay latigo o panghagupit; 'mga latigo' ang malinaw at karaniwang katumbas sa modernong Filipino.
- source_word: בָּעֲקְרַבִּים
  choice: sa pamamagitan ng mga alakdan
  rationale: Literal na 'mga alakdan' ang Hebreo. Pinananatili ito sa pangunahing teksto, habang inilalahad sa talababa ang posibleng pagtukoy sa isang mabagsik na uri ng latigo.
