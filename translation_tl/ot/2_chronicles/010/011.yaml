  to: Ngayon, ginawang mabigat ng aking ama ang inyong pamatok, ngunit magdaragdag ako sa inyong pamatok. Dinisiplina kayo ng aking ama gamit ang mga latigo, ngunit didisiplinahin ko kayo gamit ang mga alakdan.[a]
  rationale: Ibinalik ng rebisyon ang tahasang pandiwang “magdaragdag” ng Hebreo, nilinaw ang ipinahihiwatig na panghinaharap na pandiwa sa huling sugnay, at gumamit ng “dinisiplina” upang mapanatili ang mas malawak na kahulugan ng יסר. Nananatili sa teksto ang literal na “mga alakdan,” habang ang posibleng kahulugang “latigong-alakdan” ay maingat na inilalagay sa talababa.
