- from: 'Nang hindi sila pinakinggan ng hari, sumagot ang buong Israel sa hari: “Ano ang bahagi namin kay David? Wala kaming mana sa anak ni Jesse. Bawat lalaki[a] sa kanyang tolda, O Israel! Ngayon, asikasuhin mo ang sarili mong sambahayan, David.” Kaya umuwi ang buong Israel sa kani-kanilang mga tolda.[b]'
  to: 'Dahil hindi sila pinakinggan ng hari, sumagot ang buong Israel sa hari: “Ano ang bahagi namin kay David? Wala kaming mana sa anak ni Jesse. Bawat lalaki[a], sa inyong mga tolda, O Israel! Ngayon, asikasuhin mo ang sarili mong sambahayan, David.” Kaya pumunta ang buong Israel sa kani-kanilang mga tolda.[b]'
  rationale: Itinuwid ang sanggunian ng panghalip sa panawagan sa Israel, ginawang mas tuwiran ang pagsasalin ng pandiwang “pumunta,” at inayos ang mga talababa upang tumpak na mailarawan ang anyo at idyomatikong gamit ng Hebreo. Walang pagbabagong ginawa sa kahulugan ng bahagi, mana, o sambahayan.
