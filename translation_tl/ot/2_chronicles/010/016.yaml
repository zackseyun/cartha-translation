  text: וְ/כָל יִשְׂרָאֵ֗ל כִּ֠י לֹא שָׁמַ֣ע הַ/מֶּלֶךְ֮ לָ/הֶם֒ וַ/יָּשִׁ֣יבוּ הָ/עָ֣ם אֶת הַ/מֶּ֣לֶךְ לֵ/אמֹ֡ר מַה לָּ/נוּ֩ חֵ֨לֶק בְּ/דָוִ֜יד וְ/לֹֽא נַחֲלָ֣ה בְּ/בֶן יִשַׁ֗י אִ֤ישׁ לְ/אֹהָלֶ֨י/ךָ֙ יִשְׂרָאֵ֔ל עַתָּ֕ה רְאֵ֥ה בֵיתְ/ךָ֖ דָּוִ֑יד וַ/יֵּ֥לֶךְ כָּל יִשְׂרָאֵ֖ל לְ/אֹהָלָֽי/ו־־־׀־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/010/016.yaml
  text: And all Israel[a], because the king did not listen to them, answered the king, saying, “What share do we have in David? We have no inheritance in the son of Jesse. Each man to your tents, O Israel! Now see to your own house[b], David.” So all Israel went to their tents.
translation:
  language: tl
  text: 'Dahil hindi sila pinakinggan ng hari, sumagot ang buong Israel sa hari: “Ano ang bahagi namin kay David? Wala kaming mana sa anak ni Jesse. Bawat lalaki[a], sa inyong mga tolda, O Israel! Ngayon, asikasuhin mo ang sarili mong sambahayan, David.” Kaya pumunta ang buong Israel sa kani-kanilang mga tolda.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Hebreo ay literal na “bawat lalaki” at gumagamit ng panlalaking isahan sa paraang distributibo. Ang kasunod na “sa inyong mga tolda, O Israel” ay isang panawagan sa Israel bilang isang kolektibo.
    reason: cultural_note
  - marker: b
    text: Ang Hebreo ay pormal na “pumunta ang buong Israel sa mga tolda nito/kanyang,” kasunod ng kolektibong “buong Israel.” Likas na distributibong Filipino ang “kani-kanilang mga tolda.” Ang “pumunta sa mga tolda” ay idyoma para sa paghiwa-hiwalay patungo sa sariling tirahan.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמַע
  choice: pinakinggan
  rationale: Sa kontekstong ito, ang pandiwa ay tumutukoy sa pakikinig na may pagsang-ayon o pagtugon, hindi lamang sa pagkarinig.
- source_word: וַיָּשִׁיבוּ
  choice: sumagot
  rationale: Ang anyong mula sa שוב ay ginagamit dito sa idyomang nangangahulugang magbigay ng sagot.
- source_word: חֵלֶק
  choice: bahagi
  rationale: Pinananatili nito ang talinghaga ng pakikibahagi habang ang pahayag ay nagsisilbing hayagang pagtatakwil sa katapatan kay David.
- source_word: נַחֲלָה
  choice: mana
  rationale: Inilalarawan nito ang minana o itinakdang bahagi at pinananatili ang ugnayang pampamilya at pandinastiya ng pahayag.
- source_word: בְּבֶן יִשַׁי
  choice: sa anak ni Jesse
  rationale: Likas itong Filipino para sa Hebreong pariralang nagsasaad ng pagkakaroon ng bahagi o mana sa angkan ni David.
- source_word: אִישׁ
  choice: bawat lalaki
  rationale: Ang pangngalan ay panlalaking isahan na ginagamit nang pamahagi; pinananatili ng salin ang tahasang kasarian at puwersang distributibo nito.
- source_word: לְאֹהָלֶיךָ
  choice: sa kanyang tolda
  rationale: Pinananatili ang larawan ng tolda; ginawang distributibong isahan ang panghalip sa Filipino upang tumugma nang natural sa “bawat lalaki,” bagaman maramihan ang kausap sa Hebreo.
- source_word: רְאֵה בֵיתְךָ
  choice: asikasuhin mo ang sarili mong sambahayan
  rationale: Inihahatid nito ang idyomatikong utos kay David na harapin ang sarili niyang angkan o dinastiya, nang hindi nililimitahan ang בַּיִת sa pisikal na bahay.
- source_word: לְאֹהָלָיו
  choice: sa kani-kanilang mga tolda
  rationale: Ang Hebreo ay pormal na isahan pagkatapos ng kolektibong “buong Israel”; ang distributibong parirala sa Filipino ay malinaw at likas.
theological_decisions:
- issue: Panlalaking distributibong pangngalang אִישׁ
  choice: Bawat lalaki
  alternative: Bawat isa
  rationale: Pinananatili ang tahasang panlalaking anyo ng pinagmulan habang ipinakikita sa talababa na distributibo ang gamit.
- issue: Pormula ng pampolitikang pagtatakwil
  choice: Ano ang bahagi namin kay David? Wala kaming mana sa anak ni Jesse.
  alternative: Wala kaming kinalaman kay David o sa anak ni Jesse.
  rationale: Pinananatili ang magkahiwalay na mga talinghaga ng “bahagi” at “mana,” pati ang pampamilya at pandinastiyang tensiyon ng Hebreo, sa halip na gawing pangkalahatang modernong pahayag.
- issue: Kahulugan ng בַּיִת sa utos kay David
  choice: sambahayan
  alternative: bahay
  rationale: Maaaring tumukoy ang salita sa bahay, sambahayan, angkan, o dinastiya. Ang “sambahayan” ay nagpapanatili ng saklaw sa pamilya at dinastiya nang hindi lubusang nilulutas ang pahiwatig.
translation_notes:
  register: Makabago at marangal na Filipino na may bahagyang makatang himig sa tuwirang pananalita. Pinanatili ang “O Israel” bilang pormal na panawagan at ang mga larawang “bahagi,” “mana,” “tolda,” at “sambahayan” upang mapanatili ang pampolitika at pandinastiyang bigat ng Hebreo.
