review_pass:
  verdict: revise
  source_fidelity: 'Kailangang itama ang utos na לְאֹהָלֶיךָ: ang kausap ay ang kolektibong Israel (“sa inyong mga tolda”), hindi ang bawat lalaki nang paisa-isa (“sa kanyang tolda”). Ang “pumunta” ay mas malapit sa וַיֵּלֶךְ kaysa “umuwi,” bagaman malinaw ang idyomatikong implikasyon ng pag-uwi o paghiwa-hiwalay.'
  naturalness: Ang rebisyong “Bawat lalaki, sa inyong mga tolda, O Israel!” ay bahagyang pormal, ngunit angkop ito sa nakapirming panawagang pampolitika at malinaw na nagpapakita ng kolektibong pagtawag sa Israel. Ang ibang pananalita ay likas at marangal sa makabagong Filipino.
  terminology: Ang “bahagi,” “mana,” “anak ni Jesse,” “tolda,” at “sambahayan” ay angkop. Pinananatili ng “sambahayan” ang saklaw ng בַּיִת na maaaring tumukoy sa sambahayan o angkan/dinastiya nang hindi labis na ipinapaliwanag ito.
  issues:
  - severity: medium
    issue: Maling panghalip sa “Bawat lalaki[a] sa kanyang tolda, O Israel!”
    rationale: Ang Hebreong לְאֹהָלֶיךָ ay direktang nakatuon sa Israel sa panawagan (“sa iyong/mga tolda mo, Israel”), samantalang ang “sa kanyang tolda” ay inililipat ang sanggunian sa bawat lalaki at inaalis ang retorikal na pagtawag sa Israel.
  - severity: low
    issue: Ang “umuwi” ay mas interpretibo kaysa sa pandiwang Hebreo.
    rationale: Ang וַיֵּלֶךְ ay “pumunta/umalis.” Maaaring ipahiwatig ng idyoma ang pag-uwi, ngunit mas mainam na ilagay ang pagpapaliwanag na iyon sa talababa.
  - severity: low
    issue: Hindi tumpak ang pahayag na literal ang “kani-kanilang mga tolda.”
    rationale: Ang huling anyong Hebreo ay pormal na isahan kasunod ng kolektibong “buong Israel”; ang distributibong “kani-kanilang” ay likas na salin ngunit hindi literal na anyo.
