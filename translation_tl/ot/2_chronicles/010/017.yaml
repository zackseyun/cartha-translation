  text: But Rehoboam reigned over the children of Israel who lived in the cities of Judah[a].
translation:
  language: tl
  text: Ngunit naghari si Rehoboam sa mga anak ni Israel na naninirahan sa mga lungsod ng Juda.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “mga anak ni Israel,” isang tawag sa mga Israelita.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְנֵי יִשְׂרָאֵל
  choice: Ngunit ang mga anak ni Israel
  rationale: Pinanatili ang mas pormal na anyong “mga anak ni Israel,” gaya ng Hebreong etnonimo. Isinalin ang pangatnig na וּ bilang “Ngunit” upang ipakita ang pagsalungat sa paghihimagsik na binanggit sa naunang konteksto.
- source_word: הַיֹּשְׁבִים
  choice: na naninirahan
  rationale: Ang participle ng ישב ay tumutukoy sa patuloy na paninirahan; natural at marangal sa modernong Filipino ang “naninirahan.”
- source_word: בְּעָרֵי יְהוּדָה
  choice: sa mga lungsod ng Juda
  rationale: Tuwirang pinananatili ang lokatibong diwa at ang heograpikong kaugnayan ng mga lungsod sa Juda.
- source_word: וַיִּמְלֹךְ
  choice: naghari
  rationale: Karaniwang salaysay na katumbas ng מלך, na nagsasaad ng pamamahala ni Rehoboam bilang hari.
- source_word: עֲלֵיהֶם
  choice: sa kanila
  rationale: Ipinahahayag ang mga taong sakop ng paghahari; ang hulihang panghalip ay malinaw na tumutukoy sa mga anak ni Israel na naninirahan sa Juda.
- source_word: רְחַבְעָם
  choice: Rehoboam
  rationale: Ginamit ang karaniwang anyo ng pangalan sa mga saling Bibliya sa Filipino.
