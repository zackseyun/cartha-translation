base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/010/006.yaml
  text: Then King Rehoboam consulted the elders who had stood before Solomon his father while he was still alive[a], saying[b], “How do you advise me to answer this people?”
translation:
  language: tl
  text: At sumangguni si Haring Rehoboam sa mga nakatatanda na naglilingkod[a] sa kanyang amang si Solomon noong nabubuhay pa ito. Sinabi niya, “Ano ang maipapayo ninyo na isagot ko sa bayang ito?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal na “nakatayo sa harap ni.” Maaari rin itong mangahulugang dumadalo o naglilingkod sa kanya sa isang opisyal na tungkulin.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּוָּעַץ
  choice: sumangguni
  rationale: Ang Niphal ng יעץ ay tumutukoy rito sa paghingi ng payo sa iba. Likas at malinaw sa modernong Tagalog ang “sumangguni.”
- source_word: הַזְּקֵנִים
  choice: mga nakatatanda
  rationale: Maaaring tumukoy ang זקנים sa matatandang lalaki at, sa kontekstong ito, sa mga nakatatandang tagapayo o pinunong may opisyal na papel. Pinananatili ng “mga nakatatanda” ang saklaw ng kahulugan nang hindi nagdaragdag ng tiyak na katungkulang hindi tahasang binanggit.
- source_word: אֲשֶׁר הָיוּ עֹמְדִים לִפְנֵי
  choice: na naglilingkod[a] sa
  rationale: Literal itong “na nakatayo sa harap ni,” isang idyomang maaaring magpahiwatig ng pagdalo o paglilingkod sa isang hari. Mas natural sa Tagalog ang “naglilingkod sa,” habang inilalahad sa talababa ang literal na larawan at alternatibong diwa.
- source_word: שְׁלֹמֹה אָבִיו
  choice: kanyang amang si Solomon
  rationale: Natural sa Tagalog ang ayos na ito at tumpak na pinananatili ang kaugnayan ni Solomon bilang ama ni Rehoboam.
- source_word: בִּהְיוֹתוֹ חַי
  choice: noong nabubuhay pa ito
  rationale: Ipinapahayag nito ang panahong buhay pa si Solomon. Ang “ito” ay malinaw na tumutukoy kay Solomon at umiiwas sa pag-uulit.
- source_word: אֵיךְ אַתֶּם נוֹעָצִים
  choice: Ano ang maipapayo ninyo
  rationale: Bagaman literal na “Paano kayo nagpapayo,” ang tanong ay humihingi ng nilalaman ng kanilang payo. Ang “Ano ang maipapayo ninyo” ay natural at pinananatili ang diwa.
- source_word: לְהָשִׁיב לָעָם הַזֶּה דָּבָר
  choice: na isagot ko sa bayang ito
  rationale: Literal na “upang magbalik ng salita sa bayang ito,” ngunit idyomatiko itong nangangahulugang magbigay ng sagot. Ginagawang tahasan ng “ko” ang ipinahiwatig na tagapagsalita nang hindi binabago ang diwa.
theological_decisions: []
translation_notes:
  register: Gumamit ng natural, kasalukuyan, at marangal na Filipino. Pinanatili ang “mga nakatatanda” sa halip na gawing tiyak na “mga tagapayo” upang hindi paliitin ang kahulugan ng זקנים, samantalang isinalin nang idyomatiko ang paglilingkod at pagbibigay ng sagot.
