base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/010/007.yaml
  text: They spoke to him[a], saying, “If you will be good to this people, and if you please them and speak good words to them[b], then they will be your servants all your days.”
translation:
  language: tl
  text: Sinabi nila sa kanya, “Kung magiging mabuti ka sa bayang ito at palulugdan mo sila[a] at magsasalita ka sa kanila ng mabubuting salita, magiging mga lingkod mo sila habang panahon.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pakikitunguhan mo sila nang may pabor.” Ang pandiwang Hebreo ay maaaring tumukoy sa pagbibigay-kasiyahan sa isang tao o sa pakikitungo sa kanya nang may pabor.
    reason: lexical_alternative
  - marker: b
    text: O “patuloy ka nilang paglilingkuran.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּהְיֶה לְטוֹב לְהָעָם הַזֶּה
  choice: magiging mabuti ka sa bayang ito
  rationale: Pinananatili nito ang idyomang ‘maging mabuti sa’ at ang malawak na diwa ng pamumunong kapaki-pakinabang at may kabutihan, nang hindi ito pinakikitid sa ‘maging mabait’ lamang.
- source_word: וּרְצִיתָם
  choice: palulugdan mo sila
  rationale: Ipinahahayag nito ang malamang na diwa ng pagbibigay-kasiyahan o pagkamit ng pagsang-ayon ng bayan sa konteksto, habang kinikilala sa talababa ang posibleng diwang ‘pakikitunguhan nang may pabor.’
- source_word: וְדִבַּרְתָּ אֲלֵיהֶם דְּבָרִים טוֹבִים
  choice: magsasalita ka sa kanila ng mabubuting salita
  rationale: Pinananatili ang pag-uulit ng ugat na דבר sa pandiwa at pangngalan, gayundin ang tahasang ‘mabubuting salita,’ sa halip na paikliin bilang ‘magsalita nang mabait.’
- source_word: וְהָיוּ לְךָ עֲבָדִים
  choice: magiging mga lingkod mo sila
  rationale: Sa konteksto ng katapatan ng mga nasasakupan sa hari, mas angkop ang ‘mga lingkod’ kaysa ‘mga alipin’; pinananatili rin nito ang anyong panaguring pangngalan ng Hebreo.
- source_word: כָּל הַיָּמִים
  choice: habang panahon
  rationale: Natural itong Filipino para sa tuloy-tuloy at pangmatagalang paglilingkod. Hindi dinaragdagan ang tekstong Hebreo ng tahasang ‘mo,’ na wala sa pariralang ito.
