  to: Sinabi nila sa kanya, “Kung magiging mabuti ka sa bayang ito at palulugdan mo sila[a] at magsasalita ka sa kanila ng mabubuting salita, magiging mga lingkod mo sila habang panahon.[b]”
  rationale: Idinugtong ang “at” pagkatapos ng “bayang ito” upang malinaw na ang pagiging mabuti, pagpapalugod sa bayan, at pagsasalita ng mabubuting salita ay magkakasamang kundisyon, bago ang resultang magiging mga lingkod sila. Walang binago sa kahulugan o sa mga talababa.
