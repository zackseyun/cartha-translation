translation_notes:
  register: Gumamit ng makabago ngunit marangal at madaling maunawaang Filipino. Pinanatili ang pormal na parallelismo ng payo—maging mabuti, palugdan ang bayan, at magsalita ng mabubuting salita—nang hindi ginagawang labis na kolokyal.
