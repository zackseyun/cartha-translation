lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵהֶם
  choice: Sinabi niya sa kanila
  rationale: Likas na salin sa modernong Tagalog ng karaniwang anyong pasalaysay na nagpapakilala ng tuwirang pananalita.
- source_word: עוֹד שְׁלֹשֶׁת יָמִים
  choice: pagkalipas ng tatlong araw
  rationale: Ipinahahayag nito ang hinihinging tatlong-araw na paghihintay bago sila bumalik, nang hindi ipinapalagay na tatlong karagdagang araw ito sa naunang takdang panahon.
- source_word: וְשׁוּבוּ אֵלָי
  choice: Bumalik kayo sa akin
  rationale: Ang maramihang pautos na שוב at ang patungong אֵלַי ay tuwirang naihahatid sa natural na Tagalog.
- source_word: וַיֵּלֶךְ הָעָם
  choice: Kaya umalis ang mga tao
  rationale: Ang kolektibong הָעָם ay natural na isinasaling “ang mga tao”; ipinakikita ng “kaya” ang kasunod na tugon nila sa utos.
