base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/010/003.yaml
  text: So they sent and called for him[a], and Jeroboam and all Israel came and spoke to Rehoboam, saying,
translation:
  language: tl
  text: Kaya nagsugo sila at ipinatawag siya[a]. Dumating si Jeroboam at ang buong Israel, at nagsalita sila kay Rehoboam. Sinabi nila,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nagpadala sila ng mensahe at ipinatawag siya.” Hindi tahasang binabanggit sa Hebreo ang layon ng “nagsugo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלְחוּ
  choice: nagsugo sila
  rationale: Pinananatili nito ang hiwalay na unang kilos sa Hebreo nang hindi tinutukoy kung mensahero o mensahe ang ipinadala, sapagkat hindi hayag ang layon ng pandiwa.
- source_word: וַיִּקְרְאוּ לוֹ
  choice: ipinatawag siya
  rationale: Likas sa modernong Tagalog ang 'ipinatawag' para sa קרא + ל sa konteksto ng pagpapapunta kay Jeroboam.
- source_word: וַיָּבֹא
  choice: Dumating
  rationale: Ang pandiwa ay nasa isahan at si Jeroboam ang nangungunang paksa; natural na naihahayag ito sa Tagalog sa 'Dumating si Jeroboam kasama...'.
- source_word: יָרָבְעָם וְכָל יִשְׂרָאֵל
  choice: si Jeroboam kasama ang buong Israel
  rationale: Pinananatili ang pambansa at tipanang ekspresyong 'buong Israel'; ipinahihiwatig ng 'kasama' ang isahang anyo ng pandiwa sa Hebreo nang hindi binabago ang saklaw ng pangkat.
- source_word: וַיְדַבְּרוּ אֶל
  choice: nagsalita sila kay
  rationale: Tuwirang katumbas ito ng דבר אל at pinananatili ang maramihang paksa ng pagkilos.
- source_word: לֵאמֹר
  choice: Sinabi nila,
  rationale: Sa natural na Tagalog, mas malinaw na panimula ito sa tuwirang pananalitang sumusunod sa susunod na talata kaysa sa literal ngunit alanganing 'na sinasabi'.
