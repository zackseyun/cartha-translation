  text: Rehoboam went to Shechem, because all Israel had come to Shechem to make him king.
translation:
  language: tl
  text: Pumunta si Rehoboam sa Shekem, sapagkat pumunta roon ang buong Israel upang gawin siyang hari.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: Pumunta
  rationale: Likas at tuwirang salin ng pandiwang nagsasaad ng pagpunta ni Rehoboam sa Shekem.
- source_word: שְׁכֶמָה / שְׁכֶם
  choice: sa Shekem / roon
  rationale: Isinalin ang unang banggit bilang pangalan ng lugar; ginamit ang “roon” sa ikalawa upang maging natural sa Tagalog nang hindi nawawala ang reperensiya sa Shekem.
- source_word: כִּי
  choice: sapagkat
  rationale: Pinananatili ang malinaw na ugnayang sanhi o dahilan sa konteksto.
- source_word: כָל־יִשְׂרָאֵל
  choice: ang buong Israel
  rationale: Tapat sa kolektibong pahayag ng Hebreo at natural sa biblikal na Tagalog.
- source_word: לְהַמְלִיךְ אֹתוֹ
  choice: upang gawin siyang hari
  rationale: 'Ipinahahayag ang causative na diwa ng Hifil: dumating sila upang kilalanin o italaga siya bilang hari.'
