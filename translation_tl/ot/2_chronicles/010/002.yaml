id: 2CH.10.2
reference: 2 Chronicles 10:2
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יְהִ֞י כִּ/שְׁמֹ֨עַ יָרָבְעָ֤ם בֶּן נְבָט֙ וְ/ה֣וּא בְ/מִצְרַ֔יִם אֲשֶׁ֣ר בָּרַ֔ח מִ/פְּנֵ֖י שְׁלֹמֹ֣ה הַ/מֶּ֑לֶךְ וַ/יָּ֥שָׁב יָרָבְעָ֖ם מִ/מִּצְרָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/010/002.yaml
  text: And when Jeroboam son of Nebat heard it (for he was in Egypt[a], where he had fled from before King Solomon)[b], Jeroboam returned from Egypt.
translation:
  language: tl
  text: Nang marinig ito[a] ni Jeroboam na anak ni Nebat—nasa Ehipto siya noon, kung saan siya tumakas upang makalayo kay Haring Solomon[b]—bumalik si Jeroboam mula sa Ehipto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nang mabalitaan niya.” Walang tahasang binabanggit sa Hebreo kung ano ang narinig ni Jeroboam; ipinahihiwatig ito ng konteksto.
    reason: lexical_alternative
  - marker: b
    text: 'Mas literal: “kung saan siya tumakas mula sa harapan ni Haring Solomon.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּשְׁמֹעַ
  choice: Nang marinig
  rationale: Ang וַיְהִי na sinusundan ng infinitive construct ay nagpapakilala ng sugnay na temporal. Likas sa makabagong Tagalog ang “Nang marinig” at hindi na kailangang panatilihin ang mas literal ngunit mabigat na “At nangyari, nang marinig.”
- source_word: שְׁמֹעַ
  choice: marinig ito
  rationale: Walang tahasang layon ang pandiwang Hebreo, ngunit ipinahihiwatig ng konteksto ang narinig. Ginamit ang “ito” para sa natural na Tagalog, habang nililinaw sa talababa ang tunay na di-tiyak na anyo ng pinagmulan.
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: Jeroboam na anak ni Nebat
  rationale: Karaniwang anyo sa Tagalog para sa patronimikong pariralang Hebreo, gamit ang pamantayang transliterasyon ng mga pangalan.
- source_word: וְהוּא בְמִצְרַיִם
  choice: nasa Ehipto siya noon
  rationale: Nagbibigay ang sugnay ng impormasyong pangkaligiran. Ipinahihiwatig ng “noon” ang kasabay na kalagayan nang marinig ni Jeroboam ang balita.
- source_word: מִצְרַיִם
  choice: Ehipto
  rationale: Karaniwang pangalang Tagalog para sa מִצְרַיִם.
- source_word: אֲשֶׁר בָּרַח מִפְּנֵי שְׁלֹמֹה הַמֶּלֶךְ
  choice: kung saan siya tumakas upang makalayo kay Haring Solomon
  rationale: Ang אֲשֶׁר ay tumutukoy sa Ehipto bilang lugar na tinakasan niya, at ang מִפְּנֵי ay nagsasaad ng paglayo mula sa harapan o banta ni Solomon. Natural sa Tagalog ang “upang makalayo kay,” habang inilalahad sa talababa ang mas literal na anyo.
- source_word: הַמֶּלֶךְ
  choice: Haring Solomon
  rationale: Likas sa Tagalog ang titulong “Haring” bago ang pangalang Solomon.
- source_word: וַיָּשָׁב
  choice: bumalik
  rationale: Sa kontekstong pasalaysay, ang שׁוב ay nangangahulugang pagbabalik sa isang lugar, hindi pagsisisi o teolohikal na pagpapanumbalik.
- source_word: מִמִּצְרָיִם
  choice: mula sa Ehipto
  rationale: Ang מן ay tumutukoy sa pinagmulan ng pagbabalik.
