base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/010/004.yaml
  text: Your father made our yoke heavy[a]. So now lighten the hard service of your father and his heavy yoke that he put on us[b], and we will serve you.
translation:
  language: tl
  text: Pinabigat ng iyong ama ang aming pamatok.[a] Kaya ngayon, pagaanin mo ang mahirap na sapilitang paglilingkod na ipinataw ng iyong ama at ang mabigat niyang pamatok na ipinatong niya sa amin,[b] at paglilingkuran ka namin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ginawang mahirap ang aming pamatok” o “ginawang mabigat ang aming pamatok.”
    reason: lexical_alternative
  - marker: b
    text: Ang “sapilitang paglilingkod” dito ay tumutukoy sa ipinataw na paggawa o tungkulin sa ilalim ng paghahari; maaari ring “paggawa.”
    reason: cultural_note
lexical_decisions:
- source_word: הִקְשָׁה
  choice: pinabigat
  rationale: Ang Hiphil ay nagsasaad na ginawang mahirap o mabigat ng ama ang pamatok. Ang “pinabigat” ay natural sa Filipino, pinananatili ang sanhiang diwa, at kaayon ng larawan ng pamatok sa buong talata.
- source_word: עֻלֵּנוּ
  choice: ang aming pamatok
  rationale: Tumutukoy ang עֹל sa literal na pamatok at, bilang talinghaga rito, sa mapaniil na pamamahala o pasanin. Pinananatili ng “pamatok” ang kongkretong larawan.
- source_word: הָקֵל
  choice: pagaanin mo
  rationale: Ang pautos ay humihiling kay Rehoboam na bawasan ang pasanin. Likas na itinatambal ang “pagaanin” sa pamatok at pasanin.
- source_word: מֵעֲבֹדַת אָבִיךָ הַקָּשָׁה
  choice: ang mahirap na paglilingkod sa iyong ama
  rationale: Maaaring mangahulugan ang עֲבֹדָה ng paggawa o paglilingkod. Pinananatili ng salin ang ugnayang “sa iyong ama” at ang pampolitikang diwa ng sapilitang tungkulin, habang isinasalin ang הַקָּשָׁה bilang “mahirap.”
- source_word: וּמֵעֻלּוֹ הַכָּבֵד
  choice: at ang mabigat niyang pamatok
  rationale: Pinananatili ang pag-uulit ng talinghagang pamatok at tuwirang isinasalin ang כָּבֵד bilang “mabigat.”
- source_word: אֲשֶׁר נָתַן עָלֵינוּ
  choice: na ipinatong niya sa amin
  rationale: Ang “ipinatong” ay malapit sa larawan ng נָתַן עַל at natural na ginagamit sa isang pamatok o pasaning inilalagay sa iba.
- source_word: וְנַעַבְדֶךָּ
  choice: at paglilingkuran ka namin
  rationale: Ipinahahayag nito ang ipinangangakong tugon ng bayan kapag pinagaan ang kanilang pasanin.
- source_word: אָבִיךָ
  choice: iyong ama
  rationale: Tuwirang tumutukoy kay Solomon at pinananatili ang pag-uulit nito sa Hebreo.
