  register: Makabago at marangal na Filipino na madaling maunawaan. Pinanatili ang talinghaga ng pamatok at ang pag-uulit ng “iyong ama,” habang ang mga talababa ay naglalahad ng leksikal at pangkulturang lawak nang hindi nilulutas nang sapilitan ang mga posibleng kahulugan.
