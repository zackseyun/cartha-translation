  to: Pinabigat ng iyong ama ang aming pamatok.[a] Kaya ngayon, pagaanin mo ang mahirap na sapilitang paglilingkod na ipinataw ng iyong ama at ang mabigat niyang pamatok na ipinatong niya sa amin,[b] at paglilingkuran ka namin.
