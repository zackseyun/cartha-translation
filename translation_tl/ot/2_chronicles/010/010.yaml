    issue: Ang “Sinabi sa kanya” ay hindi ganap na tumutugma sa pandiwang “nagsalita” sa Hebreo.
    rationale: Ang וַיְדַבְּרוּ אִתּוֹ ay “nagsalita sila sa/kasama niya,” hindi lamang “sinabi nila sa kanya.” Ang pagpapalit sa “Nagsalita sa kanya” ay mas tapat at nananatiling natural.
  - severity: low
    issue: Kailangang pasimplihin ang paglalarawan ng literal na anyo sa talababa a.
    rationale: Ang קָטָנִּי ay mas tuwirang “ang aking kaliitan” kaysa “ang maliit ko,” na maaaring magmukhang isang tiyak na “maliit na bagay.” Sapat na ang tumpak na literal na paglalarawan at ang idyomatikong paliwanag.
