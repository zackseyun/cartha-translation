base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/010/010.yaml
  text: The young men who had grown up with him spoke to him[a], saying, “This is what you shall say to the people who spoke to you, saying, ‘Your father made our yoke heavy, but you make it lighter for us.’ Thus you shall say to them[b], ‘My little finger is thicker than my father’s waist.’”
translation:
  language: tl
  text: 'Nagsalita sa kanya ang mga kabataang lalaking lumaking kasama niya, “Ganito ang sasabihin mo sa mga taong nagsabi sa iyo, ‘Pinabigat ng iyong ama ang aming pamatok, ngunit pagaanin mo ito para sa amin.’ Ganito ang sasabihin mo sa kanila: ‘Mas makapal ang hinliliit ko[a] kaysa sa baywang[b] ng aking ama.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “ang aking kaliitan”; nauunawaan ang idyoma bilang “ang hinliliit ko.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “mga balakang.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַיְלָדִים
  choice: mga kabataang lalaki
  rationale: Sa konteksto, tumutukoy ito sa mga kaedad o nakababatang tagapayo ni Rehoboam, hindi sa maliliit na bata.
- source_word: גָּדְלוּ אִתּוֹ
  choice: lumaking kasama niya
  rationale: Likas na ipinahahayag nito sa Tagalog ang magkasamang paglaki o pagkahinog.
- source_word: כֹּה תֹאמַר
  choice: Ganito ang sasabihin mo
  rationale: Pinananatili ang karaniwang pormula ng tagubilin sa pagsasalita at ang puwersang nasa anyong di-ganap ng Hebreo.
- source_word: אָבִיךָ הִכְבִּיד אֶת עֻלֵּנוּ
  choice: Pinabigat ng iyong ama ang aming pamatok
  rationale: Pinananatili ang kongkretong talinghaga ng pamatok at ang ideya ng pagpapabigat.
- source_word: הָקֵל מֵעָלֵינוּ
  choice: pagaanin mo ito para sa amin
  rationale: Ang tinutukoy na pamatok ay likas na ipinahihiwatig ng “ito”; malinaw at natural itong kahilingan para sa ginhawa sa Tagalog.
- source_word: קָטָנִּי
  choice: hinliliit ko
  rationale: Ang literal na anyo ay “ang aking kaliitan” o “ang maliit ko,” ngunit sa idyoma at sa kaagapay na salaysay sa 1 Hari 12:10, nauunawaan itong tumutukoy sa hinliliit.
- source_word: עָבָה
  choice: mas makapal ... kaysa
  rationale: Tuwirang ipinahahayag ang kapal at ang paghahambing na minamarkahan ng מִן.
- source_word: מִמָּתְנֵי אָבִי
  choice: kaysa sa baywang ng aking ama
  rationale: Ang מָתְנַיִם ay tumutukoy sa bahagi ng baywang o mga balakang; “baywang” ang malinaw at dignidad na katumbas sa makabagong Tagalog.
