revisions:
- from: 'Sinabi sa kanya ng mga kabataang lalaking lumaking kasama niya, “Ganito ang sasabihin mo sa mga taong nagsabi sa iyo, ‘Pinabigat ng iyong ama ang aming pamatok, ngunit pagaanin mo ito para sa amin.’ Ganito ang sasabihin mo sa kanila: ‘Mas makapal ang hinliliit ko[a] kaysa sa baywang[b] ng aking ama.’”'
  to: 'Nagsalita sa kanya ang mga kabataang lalaking lumaking kasama niya, “Ganito ang sasabihin mo sa mga taong nagsabi sa iyo, ‘Pinabigat ng iyong ama ang aming pamatok, ngunit pagaanin mo ito para sa amin.’ Ganito ang sasabihin mo sa kanila: ‘Mas makapal ang hinliliit ko[a] kaysa sa baywang[b] ng aking ama.’”'
  rationale: Pinalitan ang pambungad na pandiwa upang mas tapat na maipakita na nagsalita ang mga kabataang lalaki kay Rehoboam. Nilinaw rin ang literal na paliwanag sa talababa a nang hindi binabago ang idyomatikong salin. Pinanatili ang lahat ng iba pang kahulugan, rehistro, at mga angkla ng talababa.
