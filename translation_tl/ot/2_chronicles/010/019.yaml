  text: So Israel has been in rebellion against the house of David to this day[a].
translation:
  language: tl
  text: Kaya naghimagsik ang Israel laban sa sambahayan ni David hanggang sa araw na ito.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Kaya nanatiling naghihimagsik ang Israel laban sa sambahayan ni David hanggang sa araw na ito.” Maaaring isalin ang pandiwang Hebreo bilang payak na pangyayaring naganap (“naghimagsik”) o bilang pagbibigay-diin sa nagpapatuloy na kalagayan (“nanatiling naghihimagsik”).
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְשְׁעוּ
  choice: naghimagsik … at nananatili silang naghihimagsik
  rationale: Ang פשע ay tumutukoy sa paghihimagsik laban sa isang namumuno. Pinagsasama ng salin ang naganap na pag-aaklas at ang nagpapatuloy na kalagayang ipinahihiwatig ng “hanggang sa araw na ito,” habang inilalahad sa talababa ang mas payak na posibleng pagbasa.
- source_word: יִשְׂרָאֵל
  choice: ang Israel
  rationale: Pinananatili ang pangalang pantangi; sa konteksto, tumutukoy ito sa mga lipi sa hilaga bilang isang kabuuan, na kaiba sa dinastiya ni David.
- source_word: בְּבֵית דָּוִיד
  choice: laban sa sambahayan ni David
  rationale: Kasama ng פשע, ang בְּ ay nagmamarka sa kinakalaban. Ang “sambahayan” ay likas na Filipino at nagpapanatili sa dinastikong kahulugan ng בֵּית, hindi lamang sa isang literal na gusali o pamilya.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: hanggang sa araw na ito
  rationale: Karaniwang idyoma ito para sa isang kalagayang nagpapatuloy hanggang sa panahon ng tagapagsalaysay.
theological_decisions: []
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “naghimagsik” upang malinaw na ihayag ang pampolitikang pag-aaklas laban sa awtoridad, at “sambahayan ni David” upang mapanatili ang diwang dinastiko. Ang pariralang “at nananatili silang naghihimagsik” ay bahagyang nagpapalawak para maipahayag nang natural ang patuloy na kalagayan, habang pinananatili sa talababa ang mas pormal at payak na alternatibo.
