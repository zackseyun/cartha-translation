  text: And the king answered them harshly[b][a], and King Rehoboam forsook the counsel of the elders.
translation:
  language: tl
  text: Matigas silang sinagot ng hari[a], at tinalikuran ni Haring Rehoboam ang payo ng mga nakatatanda.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “sinagot sila ng hari nang malupit.”
    reason: lexical_alternative
  - marker: b
    text: O, “iniwan ni Haring Rehoboam ang payo ng mga nakatatanda.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲנֵם
  choice: Sinagot sila
  rationale: Ang hulaping panghalip na panlalaking maramihan ay tahasang tumutukoy sa mga taong sinagot, kaya pinanatili ang layong “sila.”
- source_word: הַמֶּלֶךְ
  choice: ang hari
  rationale: Tuwirang salin ng pangngalang may tiyak na pantukoy; natural ito sa daloy ng salaysay.
- source_word: קָשָׁה
  choice: nang mabagsik
  rationale: Bagaman pang-uri ang anyo sa Hebreo, gumaganap ito rito bilang paglalarawan sa paraan ng pagsagot. Ipinahahayag ng “mabagsik” ang matigas at malupit na tono nang hindi lumalabis sa diwa ng salita.
- source_word: וַיַּעֲזֹב
  choice: tinalikuran
  rationale: Ipinahihiwatig ng עזב ang sadyang pag-iwan o pagtatakwil. Sa konteksto ng payo, natural na ipinakikita ng “tinalikuran” na hindi ito sinunod ni Rehoboam.
- source_word: הַמֶּלֶךְ רְחַבְעָם
  choice: ni Haring Rehoboam
  rationale: Ang pariralang appositional ay natural na isinasalin sa Filipino bilang titulo bago ang pangalan.
- source_word: עֲצַת
  choice: ang payo
  rationale: Tumutukoy ito sa rekomendasyong ibinigay kay Rehoboam; ang “payo” ay malinaw at karaniwan sa modernong Filipino.
- source_word: הַזְּקֵנִים
  choice: ng mga nakatatanda
  rationale: Tumutukoy ito sa kinikilalang matatandang tagapayo, hindi lamang sa mga lalaking may edad. Pinananatili ng “mga nakatatanda” ang kanilang katayuan sa salaysay nang hindi nagdaragdag ng titulong wala sa teksto.
