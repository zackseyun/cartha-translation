base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/010/012.yaml
  text: So Jeroboam and all the people came to Rehoboam on the third day[a], just as the king had said, saying, “Return to me on the third day.”
translation:
  language: tl
  text: 'Kaya sa ikatlong araw, pumunta si Jeroboam at ang buong bayan kay Rehoboam, gaya ng sinabi ng hari: “Bumalik kayo sa akin sa ikatlong araw.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Muling pumunta kayo sa akin sa ikatlong araw.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: pumunta
  rationale: Ang בוא ay maaaring mangahulugang ‘pumunta,’ ‘pumarito,’ o ‘dumating,’ depende sa pananaw. Ang ‘pumunta’ ay likas sa salaysay habang inilalarawan ang pagkilos patungo kay Rehoboam.
- source_word: יָרָבְעָם
  choice: Jeroboam
  rationale: Ginamit ang karaniwang anyo ng pangalang Hebreo sa makabagong saling Filipino.
- source_word: וְכָל הָעָם
  choice: at ang buong bayan
  rationale: Ang עָם ay tumutukoy sa kabuuan ng mga taong kasama ni Jeroboam; mas natural at kolektibo sa Filipino ang ‘buong bayan’ kaysa ‘lahat ng mga tao.’
- source_word: אֶל רְחַבְעָם
  choice: kay Rehoboam
  rationale: Ang אֶל ay nagsasaad ng direksiyon patungo sa isang tao; sapat at natural ang ‘kay Rehoboam’ kasunod ng ‘pumunta.’
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: nang ikatlong araw / sa ikatlong araw
  rationale: 'Isinalin nang idiomatiko ang pariralang pamanahon: ‘nang ikatlong araw’ sa salaysay at ‘sa ikatlong araw’ sa tuwirang sinabi ng hari.'
- source_word: כַּאֲשֶׁר
  choice: gaya ng
  rationale: Malinaw nitong ipinapakita na nangyari ang pagpunta ayon mismo sa naunang sinabi ng hari.
- source_word: דִּבֶּר הַמֶּלֶךְ
  choice: sinabi ng hari
  rationale: Ang דִּבֶּר ay karaniwang pandiwa para sa pagsasalita. Hindi ito pinalakas bilang ‘iniutos’ sapagkat hindi iyon tahasang hinihingi ng Hebreo.
- source_word: לֵאמֹר
  choice: tutuldok bago ang sipi
  rationale: Ang לֵאמֹר ay nagpapakilala sa nilalaman ng sinabi. Sa natural na Filipino, mahusay itong naihahayag ng tutuldok sa halip na ng mabigat na ‘na sinasabi.’
- source_word: שׁוּבוּ אֵלַי
  choice: Bumalik kayo sa akin
  rationale: Pinananatili ng ‘bumalik’ ang pangunahing diwa ng שׁוּב. Ang ‘sa akin’ ay tuwirang katumbas ng אֵלַי, habang ang alternatibong deiktikong pagbasa ay inilagay sa talababa.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinagaan ang Hebreong pormulang לֵאמֹר sa pamamagitan ng bantas, ngunit pinanatili ang pag-uulit ng ‘ikatlong araw’ at ang tuwirang pananalita ng hari.
