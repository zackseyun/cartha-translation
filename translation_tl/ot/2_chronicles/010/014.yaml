base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/010/014.yaml
  text: He spoke to them according to the advice of the young men[a], saying, “I will make your yoke heavier, and I will add to it. My father disciplined you with whips, but I with scorpions.”
translation:
  language: tl
  text: Nagsalita siya sa kanila ayon sa payo ng mga nakababatang lalaki. Sinabi niya, “Pabibigatin ko ang inyong pamatok at dadagdagan ko pa ito. Dinisiplina kayo ng aking ama sa pamamagitan ng mga latigo, ngunit didisiplina ko kayo sa pamamagitan ng mga alakdan[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O maaaring “mga latigong alakdan,” samakatuwid, mga latigong may matutulis na dulo o mga tinik; literal na “mga alakdan” ang Hebreo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Nagsalita siya
  rationale: Karaniwang kahulugan ng דבר ang ‘magsalita.’ Bagaman tugon ito sa konteksto, hindi kailangang idagdag ang mas interpretatibong ‘sumagot.’
- source_word: כַּעֲצַת הַיְלָדִים
  choice: ayon sa payo ng mga kabataang lalaki
  rationale: Ang עֵצָה ay ‘payo’ o ‘payo ng mga tagapayo,’ at ang כ ay nagpapahiwatig ng pagsunod ayon dito. Sa salaysay, ang הַיְלָדִים ay hindi maliliit na bata kundi mga nakababatang lalaking tagapayo ni Rehoboam.
- source_word: אַכְבִּיד אֶת עֻלְּכֶם
  choice: Pabibigatin ko ang inyong pamatok
  rationale: Ang Hiphil ng כבד ay sanhiang ‘gawing mabigat/pabigatin.’ Pinananatili ng ‘pamatok’ ang malinaw na talinghaga ng mapaniil na pasanin o sapilitang paglilingkod.
- source_word: וַאֲנִי אֹסִיף עָלָיו
  choice: at dadagdagan ko pa iyon
  rationale: Ang יסף na may עַל ay nangangahulugang magdagdag. Ang panghalip ay likas na tumutukoy sa naunang pamatok; ang ‘pa’ ay natural na nagpapahayag ng paglala.
- source_word: יִסַּר אֶתְכֶם
  choice: Dinisiplina kayo
  rationale: Ang יסר ay maaaring mangahulugang disiplinahin, parusahan, o ituwid. Pinananatili ng ‘dinisiplina’ ang lawak ng salita kahit malinaw na marahas at maparusang pamamahala ang konteksto.
- source_word: בַּשּׁוֹטִים
  choice: sa pamamagitan ng mga latigo
  rationale: Ang שׁוֹט ay latigo o panghagupit. Ang ‘latigo’ ay malinaw at kasalukuyang salitang Filipino.
- source_word: בָּעֲקְרַבִּים
  choice: sa pamamagitan ng mga alakdan
  rationale: Literal na ‘mga alakdan’ ang עֲקְרַבִּים. Pinananatili ito sa teksto upang hindi alisin ang matingkad ngunit sadyang hindi tiyak na larawan; nililinaw sa talababa ang posibleng kahulugan.
theological_decisions: []
translation_notes:
  register: Makabago ngunit marangal na Filipino. Pinanatili ang talinghagang ‘pamatok’ at ang literal na ‘mga alakdan’ sa halip na tahimik na ipakahulugan ang huli bilang isang tiyak na uri ng latigo.
