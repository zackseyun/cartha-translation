revisions:
- from: Nagsalita siya sa kanila ayon sa payo ng mga kabataang lalaki. Sinabi niya, “Pabibigatin ko ang inyong pamatok at dadagdagan ko pa iyon. Dinisiplina kayo ng aking ama sa pamamagitan ng mga latigo, ngunit ako naman ay sa pamamagitan ng mga alakdan[a].”
  to: Nagsalita siya sa kanila ayon sa payo ng mga nakababatang lalaki. Sinabi niya, “Pabibigatin ko ang inyong pamatok at dadagdagan ko pa ito. Dinisiplina kayo ng aking ama sa pamamagitan ng mga latigo, ngunit didisiplina ko kayo sa pamamagitan ng mga alakdan[a].”
  rationale: Idinagdag ang tahasang pandiwang “didisiplina ko kayo” sa huling sugnay upang maging ganap at natural ang Filipino habang pinananatili ang parallelismo at marahas na retorika ng Hebreo. Pinalitan ang “mga kabataang lalaki” ng “mga nakababatang lalaki” para sa mas likas na modernong gamit. Hindi binago ang literal na “mga alakdan” at nananatili ang talababa para sa posibleng kahulugang mga latigong may tinik.
