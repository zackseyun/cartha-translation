  text: וְ/לֹֽא שָׁמַ֥ע הַ/מֶּ֖לֶךְ אֶל הָ/עָ֑ם כִּֽי הָיְתָ֤ה נְסִבָּה֙ מֵ/עִ֣ם הָֽ/אֱלֹהִ֔ים לְמַעַן֩ הָקִ֨ים יְהוָ֜ה אֶת דְּבָר֗/וֹ אֲשֶׁ֤ר דִּבֶּר֙ בְּ/יַד֙ אֲחִיָּ֣הוּ הַ/שִּֽׁלוֹנִ֔י אֶל יָרָבְעָ֖ם בֶּן נְבָֽט־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/010/015.yaml
  text: So the king did not listen to the people[a], for this turn of events was from God, so that Yahweh might establish his word that he had spoken through Ahijah the Shilonite to Jeroboam son of Nebat.
translation:
  language: tl
  text: Kaya hindi pinakinggan ng hari ang bayan, sapagkat ang ganitong takbo ng mga pangyayari[a] ay mula sa Diyos, upang pagtibayin ni Yahweh ang kanyang salita na sinabi niya sa pamamagitan ni Ahias na Shilonita kay Jeroboam na anak ni Nebat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “sapagkat ang sanhi ay mula sa Diyos.” Ang pangngalang Hebreo ay maaaring tumukoy sa isang pagliko, kalagayan, o pag-unlad na nagsisilbing sanhi.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמַע אֶל־הָעָם
  choice: pinakinggan ang bayan
  rationale: Sa konteksto, tumutukoy ito sa pagbibigay-pansin at pagsang-ayon sa kahilingan ng bayan, hindi lamang sa pisikal na pagkarinig. Hindi rin ito pinalakas hanggang sa tahasang “sinunod.”
- source_word: נְסִבָּה
  choice: takbo ng mga pangyayari
  rationale: Ipinahihiwatig ng pangngalan ang isang pagliko, kalagayan, o sanhi sa pag-unlad ng mga pangyayari. Likas sa modernong Tagalog ang pariralang ito at naipapakita nitong may providensiyal na pinagmulan ang nangyari nang hindi labis na nagpapaliwanag.
- source_word: מֵעִם הָאֱלֹהִים
  choice: mula sa Diyos
  rationale: Tuwirang ipinapahayag ng parirala ang Diyos bilang pinagmulan ng pangyayari.
- source_word: לְמַעַן
  choice: upang
  rationale: Malinaw na pinananatili nito ang diwang nagsasaad ng layunin.
- source_word: הָקִים
  choice: pagtibayin
  rationale: Ang hiphil ng קום ay literal na “patayuin” at dito ay nangangahulugang itatag o pagtibayin. Mas malapit ito sa Hebreo kaysa sa mas interpretatibong “tuparin.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinalin bilang personal na pangalan ng Diyos sa halip na palitan ng isang titulo.
- source_word: דְּבָרוֹ
  choice: kanyang salita
  rationale: Pinananatili ang malawak na kahulugan ng דָּבָר bilang propetikong salita o pahayag, nang hindi ito pinakikitid sa “pangako.”
- source_word: בְּיַד
  choice: sa pamamagitan ni
  rationale: Ang idyomang “sa kamay ni” ay nagpapahayag dito ng tagapamagitan o instrumento; natural itong ipinapahayag sa Tagalog bilang “sa pamamagitan ni.”
- source_word: הַשִּׁלוֹנִי
  choice: na Shilonita
  rationale: Pinananatili ang gentiliko o katawagang nag-uugnay kay Ahias sa Shilo, sa isang maikli at pormal na anyo.
- source_word: בֶּן נְבָט
  choice: anak ni Nebat
  rationale: Karaniwang anyo sa Tagalog para sa patronimikong parirala.
theological_decisions:
- issue: Pagkilos ng Diyos at pananagutan ng tao
  choice: hindi pinakinggan ng hari ang bayan, sapagkat ang ganitong takbo ng mga pangyayari ay mula sa Diyos
  alternative: hindi pinakinggan ng hari ang bayan, sapagkat ang sanhi ay mula sa Diyos
  rationale: Hayagang iniuugnay ng Hebreo sa Diyos ang pinagmulan ng pangyayari habang inilalarawan ang hindi pakikinig bilang tunay na kilos ng hari. Pinananatili ng salin ang tensiyong ito at hindi sinasabing tuwirang ginawa ng Diyos ang pagtanggi nang higit sa sinasabi ng teksto.
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Ginagamit ang transliterasyon ng Tetragrammaton upang mapanatili ang personal na pangalang nasa tekstong Hebreo.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “bayan” para sa kolektibong הָעָם, at pinanatili ang mga pangalang Yahweh, Ahias, Jeroboam, Nebat, at ang katawagang Shilonita.
