  to: Ngunit tinalikuran niya ang payo ng matatanda na ibinigay nila sa kanya, at sumangguni siya sa mga kabataang lalaki na lumaking kasama niya at nakatayo sa harap niya.[a]
  rationale: Inayos ang anyo ng “mga kabataang lalaki” para sa natural na Filipino at pinalitan ang posibleng mapanlinlang na “paghukuman” ng “pangkorte” sa talababa. Walang binagong kahulugan o antas ng katiyakan ng pinagmulan.
