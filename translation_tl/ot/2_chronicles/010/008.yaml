base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/010/008.yaml
  text: But he abandoned the advice of the elders that they had given him[a], and consulted with the young men who had grown up with him, who stood before him.
translation:
  language: tl
  text: Ngunit tinalikuran niya ang payo ng matatanda na ibinigay nila sa kanya, at sumangguni siya sa mga kabataang lalaki na lumaking kasama niya at nakatayo sa harap niya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “naglilingkod sa kanya” o “mga tagapaglingkod niya”; ang “nakatayo sa harap niya” ay maaari ring idyomang pangkorte para sa mga dumadalo at naglilingkod sa hari.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲזֹב
  choice: tinalikuran
  rationale: Ipinahihiwatig ng עזב na iniwan o itinakwil ni Rehoboam ang payo; natural sa Filipino ang “tinalikuran” at malinaw na higit ito sa pansamantalang pagsasantabi.
- source_word: עֲצַת
  choice: payo
  rationale: Ang עֵצָה ay payo o mungkahing gabay. Ang “payo” ang pinakanatural at malinaw na katumbas sa modernong Filipino.
- source_word: הַזְּקֵנִים
  choice: matatanda
  rationale: Tumutukoy ito sa mga nakatatandang lalaking nagbibigay-payo. Pinananatili ng “matatanda” ang tahasang pagtukoy sa edad nang hindi nagdaragdag ng titulong wala sa Hebreo.
- source_word: יְעָצֻהוּ
  choice: na ibinigay nila sa kanya
  rationale: Dahil nabanggit na ang “payo,” iniiwasan ng pariralang ito ang di-natural na pag-uulit ng “ipinayo,” habang tumpak na naihahatid ang kahulugan.
- source_word: וַיִּוָּעַץ
  choice: sumangguni siya
  rationale: Ang anyong Niphal ay nagpapahayag ng pakikipagsanggunian. Dignified at karaniwan sa Filipino ang “sumangguni.”
- source_word: הַיְלָדִים
  choice: mga kabataang lalaki
  rationale: Bagaman maaari itong tumukoy sa mga bata o batang lalaki, ipinakikita ng konteksto na mga kaedad at kasamahan sila ng hari sa palasyo; iniiwasan ng saling ito ang maling impresyong mga musmos sila.
- source_word: גָּדְלוּ אִתּוֹ
  choice: lumaking kasama niya
  rationale: Tuwirang inilalarawan nito ang kanilang magkasamang paglaki at natural ang ayos sa Filipino.
- source_word: הָעֹמְדִים לְפָנָיו
  choice: nakatayo sa harap niya
  rationale: Pinananatili nito ang konkretong larawan ng Hebreo. Dahil maaari rin itong maging idyomang panghukuman para sa paglilingkod o pagdalo sa hari, inilalahad sa talababa ang posibleng diwa.
