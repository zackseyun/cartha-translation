  text: וַ/יִּשְׁלַ֞ח הַ/מֶּ֣לֶךְ רְחַבְעָ֗ם אֶת הֲדֹרָם֙ אֲשֶׁ֣ר עַל הַ/מַּ֔ס וַ/יִּרְגְּמוּ ב֧/וֹ בְנֵֽי יִשְׂרָאֵ֛ל אֶ֖בֶן וַ/יָּמֹ֑ת וְ/הַ/מֶּ֣לֶךְ רְחַבְעָ֗ם הִתְאַמֵּץ֙ לַֽ/עֲל֣וֹת בַּ/מֶּרְכָּבָ֔ה לָ/נ֖וּס יְרוּשָׁלִָֽם־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/010/018.yaml
  text: Then King Rehoboam sent Hadoram[a], who was over the forced labor, but the sons of Israel stoned him with stones, and he died[d][c][b]. And King Rehoboam strengthened himself to get up into the chariot to flee to Jerusalem.
translation:
  language: tl
  text: Pagkatapos, isinugo ni Haring Rehoboam si Hadoram[a], na namamahala sa sapilitang paggawa.[b] Ngunit binato siya ng mga anak ng Israel[c] ng mga bato, at namatay siya. Nagpakatatag naman si Haring Rehoboam upang sumakay sa karwahe at tumakas patungong Jerusalem.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “Hadoram”; “Adoram” naman ang pangalan sa kapantay na salaysay sa 1 Hari 12:18.
    reason: alternative_reading
  - marker: b
    text: Maaari ring “namamahala sa ipinataw na paglilingkod.” Ang salitang Hebreo ay tumutukoy sa sapilitang paggawa para sa pamahalaan.
    reason: lexical_alternative
  - marker: c
    text: Ang “mga anak ng Israel” ay isang idyomang Hebreo na nangangahulugang “mga Israelita.”
    reason: lexical_alternative
  - marker: d
    text: 'Mas literal: “nagpalakas sa sarili upang umakyat sa karwahe.” Maaari ring unawain na nagpakatatag siya upang gawin ito sa gitna ng panganib.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: isinugo
  rationale: Karaniwang salin ng שלח sa pagsasalaysay; likas at marangal sa modernong Tagalog.
- source_word: הַמֶּלֶךְ רְחַבְעָם
  choice: Haring Rehoboam
  rationale: Natural na ayos sa Tagalog para sa titulo at pangalan.
- source_word: הֲדֹרָם
  choice: Hadoram
  rationale: Tuwirang sinusunod ang anyo ng pangalan sa Hebreong teksto ng Mga Cronica; ang kaibang anyo sa 1 Hari 12:18 ay inilagay sa talababa.
- source_word: אֲשֶׁר עַל הַמַּס
  choice: na namamahala sa sapilitang paggawa
  rationale: Ang מַס ay tumutukoy sa ipinataw na paglilingkod o paggawa, hindi lamang sa buwis; malinaw ito sa karaniwang mambabasa.
- source_word: וַיִּרְגְּמוּ בוֹ ... אֶבֶן
  choice: pinagbabato siya
  rationale: Ipinahihiwatig ng pandiwang inuulit-ulit ang paghagis ng mga bato at iniiwasan ang di-likas na Tagalog na 'binato ng bato,' habang nananatili ang kongkretong kilos ng Hebreo.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: mga anak ng Israel
  rationale: Pinananatili ang literal at makasaysayang idyomang Hebreo; nililinaw sa talababa na pambansang tawag ito sa mga Israelita.
- source_word: וַיָּמֹת
  choice: at namatay siya
  rationale: Tuwirang pinananatili ang payak na pagpapatuloy ng salaysay, nang hindi ginagawang tahasang layunin o resulta ang ugnayan.
- source_word: הִתְאַמֵּץ
  choice: buong-lakas na nagsikap
  rationale: Ipinakikita ang matinding pagpupunyagi o pagpapalakas sa sarili na nasa hitpael ng אמץ, nang hindi ito basta pinapalitan ng pandiwang nangangahulugang pagmamadali.
- source_word: לַעֲלוֹת בַּמֶּרְכָּבָה
  choice: na makasakay sa karwahe
  rationale: Natural na Tagalog para sa pag-akyat o pagsakay sa sasakyang ito.
- source_word: לָנוּס יְרוּשָׁלָם
  choice: upang tumakas patungong Jerusalem
  rationale: Tuwirang ipinapahayag ng נוס ang pagtakas, at malinaw ang direksiyon patungong Jerusalem.
