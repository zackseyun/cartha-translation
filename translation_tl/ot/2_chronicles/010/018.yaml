translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Pinanatili ang idyomang “mga anak ng Israel” dahil makahulugan sa anyo ng Hebreo, ngunit nilinaw sa talababa. Isinalin ang הִתְאַמֵּץ bilang matinding pagpupunyagi sa halip na simpleng pagmamadali, upang hindi mawala ang leksikal na diwa ng pagpapalakas sa sarili.
