revisions:
- from: Pagkatapos, isinugo ni Haring Rehoboam si Hadoram[a], na namamahala sa sapilitang paggawa.[b] Ngunit pinagbabato siya ng mga anak ng Israel[c], at namatay siya. Buong-lakas namang nagsikap si Haring Rehoboam na makasakay sa karwahe upang tumakas patungong Jerusalem.[d]
  to: Pagkatapos, isinugo ni Haring Rehoboam si Hadoram[a], na namamahala sa sapilitang paggawa.[b] Ngunit binato siya ng mga anak ng Israel[c] ng mga bato, at namatay siya. Nagpakatatag naman si Haring Rehoboam upang sumakay sa karwahe at tumakas patungong Jerusalem.[d]
  rationale: Pinalitan ang pandiwang di-ganap na “pinagbabato” ng natapos na “binato ... ng mga bato,” upang tumugma sa Hebreong naratibo at mapanatili ang ekspresyong pandiwa kasama ang pangngalang “bato.” Pinalitan din ang “buong-lakas na nagsikap” ng “nagpakatatag,” isang mas maingat at likas na salin ng reflexive na diwa ng הִתְאַמֵּץ. Iningatan ang mga pangalan, idyoma, kahulugan ng sapilitang paggawa, at mga talababa.
