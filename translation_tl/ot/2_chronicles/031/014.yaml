  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/קוֹרֵ֨א בֶן יִמְנָ֤ה הַ/לֵּוִי֙ הַ/שּׁוֹעֵ֣ר לַ/מִּזְרָ֔חָ/ה עַ֖ל נִדְב֣וֹת הָ/אֱלֹהִ֑ים לָ/תֵת֙ תְּרוּמַ֣ת יְהוָ֔ה וְ/קָדְשֵׁ֖י הַ/קֳּדָשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/014.yaml
  text: Kore son of Imnah[a], the Levite, the gatekeeper on the east, was in charge of the freewill offerings of God[b], to distribute the contribution of Yahweh and the most holy things.
translation:
  language: tl
  text: Si Kore na anak ni Imna, ang Levitang bantay-pinto sa silangan, ang namamahala sa kusang-loob na mga handog sa Diyos, upang ipamahagi[a] ang handog para kay Yahweh at ang mga kabanal-banalang bagay.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “upang ibigay.” Literal na “upang ibigay” ang pawatas sa Hebreo; sa kontekstong ito, tumutukoy ito sa pamamahagi ng mga bagay na naialay na.
    reason: lexical_alternative
  - marker: b
    text: O “ang mga kabanal-banalang handog.” Ang pariralang Hebreo ay tumutukoy sa mga bagay na bukod-tanging banal, hindi naman kinakailangang sa panloob na santuwaryong tinatawag na Kabanal-banalang Dako.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקוֹרֵא בֶן יִמְנָה
  choice: Si Kore na anak ni Imna
  rationale: Isinalin ang pangalang pantangi ayon sa anyong madaling bigkasin sa Filipino at pinanatili ang kaugnayang ama-anak. Hindi na ipinahayag ang panimulang וְ sapagkat hindi ito kailangan sa natural na pagpapatuloy ng salaysay sa Filipino.
- source_word: הַלֵּוִי
  choice: ang Levita
  rationale: Pinanatili ang tiyak na pagkakakilanlan ni Kore bilang kabilang sa mga Levita.
- source_word: הַשּׁוֹעֵר לַמִּזְרָחָה
  choice: ang bantay-pinto sa silangan
  rationale: Ang שׁוֹעֵר ay opisyal na nagbabantay sa pasukan; ang לַמִּזְרָחָה ay tumutukoy sa kinalalagyan sa gawing silangan nang hindi tahasang nagdaragdag ng salitang 'tarangkahan' sa pariralang lokatibo.
- source_word: עַל נִדְבוֹת הָאֱלֹהִים
  choice: ang namamahala sa kusang-loob na mga handog sa Diyos
  rationale: Sa kontekstong administratibo, ang עַל ay nagpapahiwatig ng pananagutan o pamamahala. Ang נִדְבוֹת ay mga handog na boluntaryong ibinigay, kaya malinaw at likas ang 'kusang-loob na mga handog.'
- source_word: לָתֵת
  choice: upang ipamahagi
  rationale: Literal itong 'upang ibigay,' ngunit sa konteksto ng pangangasiwa sa mga handog, tumutukoy ito sa pagbibigay ng mga ito sa mga nararapat tumanggap. Inilagay sa talababa ang mas literal na alternatibo.
- source_word: תְּרוּמַת יְהוָה
  choice: ang handog para kay Yahweh
  rationale: Ang תְּרוּמָה ay bahaging ibinukod bilang handog o kontribusyon. Sa Filipino, ang 'para kay Yahweh' ay malinaw na nagpapahayag na ito ay inialay sa kaniya at umiiwas sa di-likas o mapanlinlang na pahiwatig na si Yahweh mismo ang nagbigay ng handog.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinatinig ang banal na pangalang YHWH bilang 'Yahweh' sa halip na palitan ito ng isang titulo.
- source_word: וְקָדְשֵׁי הַקֳּדָשִׁים
  choice: at ang mga bagay na kabanal-banalan
  rationale: Ipinahahayag ng parirala ang sukdulang antas ng kabanalan ng mga bagay na tinutukoy, hindi ang panloob na silid ng santuwaryo.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehova
  rationale: Tuwirang ginagamit ng tekstong Hebreo ang Tetragrammaton. Pinananatili ng 'Yahweh' ang personal na pangalan sa halip na palitan ito ng titulong 'PANGINOON,' nang hindi nagpapasok ng denominasyonal na pagpapakahulugan.
- issue: Kahulugan ng וְקָדְשֵׁי הַקֳּדָשִׁים
  choice: mga bagay na kabanal-banalan
  alternative: mga kabanal-banalang handog
  rationale: Hindi tinutukoy rito ang lugar na Kabanal-banalang Dako. Ang mas malawak na 'mga bagay' ay nagpapanatili sa saklaw ng Hebreo, habang kinikilala sa talababa na maaaring handog ang tinutukoy sa konteksto.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang karaniwang terminong 'Levita,' ang malinaw na 'bantay-pinto,' at ang pamilyar na pananalitang 'kusang-loob na mga handog.' Iniwasan ang lipas o teknikal na 'handog na itinaas' at pinanatili ang pangalan na 'Yahweh.'
