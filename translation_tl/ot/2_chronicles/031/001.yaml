  text: וּ/כְ/כַלּ֣וֹת כָּל זֹ֗את יָצְא֨וּ כָּל יִשְׂרָאֵ֥ל הַֽ/נִּמְצְאִים֮ לְ/עָרֵ֣י יְהוּדָה֒ וַ/יְשַׁבְּר֣וּ הַ/מַּצֵּב֣וֹת וַ/יְגַדְּע֣וּ הָ/אֲשֵׁרִ֡ים וַ/יְנַתְּצ֣וּ אֶת הַ֠/בָּמוֹת וְ/אֶת הַֽ/מִּזְבְּחֹ֞ת מִ/כָּל יְהוּדָ֧ה וּ/בִנְיָמִ֛ן וּ/בְ/אֶפְרַ֥יִם וּ/מְנַשֶּׁ֖ה עַד לְ/כַלֵּ֑ה וַ/יָּשׁ֜וּבוּ כָּל בְּנֵ֧י יִשְׂרָאֵ֛ל אִ֥ישׁ לַ/אֲחֻזָּת֖/וֹ לְ/עָרֵי/הֶֽם־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/001.yaml
  text: And when all this was finished[a], all Israel who were present went out to the cities of Judah and shattered the pillars, cut down the Asherim, and tore down the high places and the altars throughout all Judah and Benjamin, and in Ephraim and Manasseh, until they had completely destroyed them. Then all the sons of Israel returned, each man to his possession, to their cities.
translation:
  language: tl
  text: Nang matapos ang lahat ng ito, lumabas ang buong Israel na naroon at nagtungo sa mga lungsod ng Juda. Dinurog nila ang mga sagradong haligi, pinutol ang mga Asherim[a], at giniba ang mga dambana sa matataas na lugar at ang mga altar sa buong Juda at Benjamin, gayundin sa Efraim at Manases, hanggang sa tuluyan nilang mawasak ang lahat ng iyon. Pagkatapos, bumalik ang lahat ng mga anak ni Israel, bawat isa sa sarili niyang lupaing pag-aari, sa kani-kanilang mga lungsod.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaaring isalin na “mga poste ni Ashera.” Ang salitang Hebreo ay tumutukoy sa mga bagay na ginagamit sa pagsamba na kaugnay ni Ashera, na madalas inuunawa bilang mga poste o mga punongkahoy.
    reason: Pinananatili ang leksikal na kalabuan tungkol sa tiyak na anyo ng mga Asherim.
lexical_decisions:
- source_word: וּכְכַלּוֹת כָּל זֹאת
  choice: Nang matapos ang lahat ng ito
  rationale: Ang כ na nakakabit sa infinitive construct ay bumubuo ng temporal na sugnay. Likas sa Tagalog ang “nang matapos,” at hindi nito dinaragdagan ng tahasang simuno ang Hebreo.
- source_word: כָּל יִשְׂרָאֵל הַנִּמְצְאִים
  choice: ang buong Israel na naroon
  rationale: Ang participle na הַנִּמְצְאִים ay tumutukoy sa mga Israelitang naroroon. Pinananatili ng “buong Israel” ang kolektibong anyo ng pinagmulan.
- source_word: וַיְשַׁבְּרוּ הַמַּצֵּבוֹת
  choice: Dinurog nila ang mga sagradong haligi
  rationale: Ang מַצֵּבוֹת ay mga nakatayong batong ginagamit sa pagsamba. Ipinahihiwatig ng “sagradong” ang kultikong gamit, at ipinapakita ng “dinurog” ang puwersa ng שׁבר.
- source_word: וַיְגַדְּעוּ הָאֲשֵׁרִים
  choice: pinutol ang mga Asherim
  rationale: Maaaring tumukoy ang אֲשֵׁרִים sa iba’t ibang bagay na kultikong kaugnay ni Ashera. Pinananatili ang katawagang Asherim upang hindi tiyaking mga poste o mga punongkahoy ang anyo ng mga ito.
- source_word: וַיְנַתְּצוּ אֶת הַבָּמוֹת
  choice: giniba ang matataas na sambahan
  rationale: Ang בָּמוֹת ay mga kultikong pook na karaniwang nasa mataas na lugar. Mas malinaw sa karaniwang mambabasa ang “matataas na sambahan” kaysa literal ngunit malabong “matataas na lugar.”
- source_word: מִכָּל יְהוּדָה וּבִנְיָמִן וּבְאֶפְרַיִם וּמְנַשֶּׁה
  choice: sa buong Juda at Benjamin, gayundin sa Efraim at Manases
  rationale: Ipinahahayag ng parirala ang lawak ng pag-aalis sa mga kultikong gusali at bagay. Natural sa Tagalog ang “sa buong” at “gayundin sa” habang iginagalang ang bahagyang pagbabago ng mga pang-ukol sa Hebreo.
- source_word: עַד לְכַלֵּה
  choice: hanggang sa tuluyang mawasak ang lahat ng iyon
  rationale: Ipinahahayag ng infinitive ang ganap na pagtatapos ng gawain. Ang “lahat ng iyon” ay malinaw na tumutukoy sa mga kultikong bagay at pook na naunang binanggit.
- source_word: וַיָּשׁוּבוּ כָּל בְּנֵי יִשְׂרָאֵל
  choice: bumalik ang lahat ng mga anak ni Israel
  rationale: Pinananatili ng “mga anak ni Israel” ang anyo ng karaniwang Hebreong katawagan sa bayan, sa halip na lubusang gawing “mga Israelita.”
- source_word: אִישׁ לַאֲחֻזָּתוֹ
  choice: bawat isa sa sarili niyang lupaing pag-aari
  rationale: Distributibo ang אִישׁ, at ang אֲחֻזָּה ay karaniwang tumutukoy sa lupa o minanang pag-aaring hawak ng isang sambahayan. Nililinaw ng “lupaing pag-aari” ang kahulugan nang hindi ito tahasang tinatawag na mana.
- source_word: לְעָרֵיהֶם
  choice: sa kani-kanilang mga lungsod
  rationale: Naipapahayag ng “kani-kanilang” ang ugnayan ng naunang distributibong singular at ng plural na hulapi sa Hebreo.
theological_decisions:
- issue: Panlalaking katawagan sa bayan at distributibong singular
  choice: ang lahat ng mga anak ni Israel, bawat isa sa sarili niyang lupaing pag-aari
  alternative: ang lahat ng mga Israelita, bawat isa sa sariling pag-aari
  rationale: Ang בְּנֵי יִשְׂרָאֵל at אִישׁ ay may panlalaking anyo. Pinananatili ng salin ang tradisyonal at pormal na katawagang “mga anak ni Israel,” ngunit ginagamit ang natural na distributibong “bawat isa”; hindi nito ipinahihiwatig na hindi kabilang sa bayan ang mga babae.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “matataas na sambahan” upang maunawaan agad ang kultikong kahulugan, samantalang pinanatili ang “Asherim” at ipinaliwanag ito sa talababa upang huwag magtakda ng anyong hindi tiyak sa Hebreo.
