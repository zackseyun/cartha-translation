revisions:
- from: Nang matapos ang lahat ng ito, ang buong Israel na naroon ay pumunta sa mga lungsod ng Juda. Dinurog nila ang mga sagradong haligi, pinutol ang mga Asherim[a], at giniba ang matataas na sambahan at ang mga altar sa buong Juda at Benjamin, gayundin sa Efraim at Manases, hanggang sa tuluyang mawasak ang lahat ng iyon. Pagkatapos, bumalik ang lahat ng mga anak ni Israel, bawat isa sa sarili niyang lupaing pag-aari, sa kani-kanilang mga lungsod.
  to: Nang matapos ang lahat ng ito, lumabas ang buong Israel na naroon at nagtungo sa mga lungsod ng Juda. Dinurog nila ang mga sagradong haligi, pinutol ang mga Asherim[a], at giniba ang mga dambana sa matataas na lugar at ang mga altar sa buong Juda at Benjamin, gayundin sa Efraim at Manases, hanggang sa tuluyan nilang mawasak ang lahat ng iyon. Pagkatapos, bumalik ang lahat ng mga anak ni Israel, bawat isa sa sarili niyang lupaing pag-aari, sa kani-kanilang mga lungsod.
  rationale: Idinagdag ang “lumabas” upang katawanin ang pandiwang Hebreo, at pinalitan ang “matataas na sambahan” ng “mga dambana sa matataas na lugar” upang maging mas tumpak ang pagtukoy sa בָּמוֹת nang walang modernong konotasyon. Iningatang mapanatili ang saklaw ng mga rehiyon, ang kabuuang pagwasak, ang Asherim bilang di-tiyak na katawagan, at ang distributibong pagbalik sa mga pag-aari at lungsod.
