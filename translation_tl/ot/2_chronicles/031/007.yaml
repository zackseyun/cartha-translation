translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “bunton” para sa konkretong larawan ng naipong ani, at “mula sa pundasyon” upang mapanatili ang di-pangkaraniwang larawan ng tekstong Hebreo nang hindi nagiging lubhang di-natural.
