  yaml_path: translation/ot/2_chronicles/031/007.yaml
  text: In the third month they began to lay the foundation of the heaps[b][a], and in the seventh month they finished them.
translation:
  language: tl
  text: Nang ikatlong buwan, sinimulan nilang ilatag ang pundasyon ng mga bunton[a][b], at nang ikapitong buwan ay natapos nila ang mga iyon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga tumpok.” Tumutukoy ang salitang Hebreo sa naipong mga handog na ani.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “sinimulan nilang itatag ang mga bunton,” isang idyomang nangangahulugang sinimulan nila ang mga bunton sa paglalatag ng pundasyon o saligan ng mga ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּחֹדֶשׁ הַשְּׁלִשִׁי
  choice: Nang ikatlong buwan
  rationale: Ang חֹדֶשׁ sa ganitong pahayag ng panahon ay nangangahulugang “buwan.” Likas sa modernong Tagalog ang “nang ikatlong buwan” bilang panandang temporal.
- source_word: הֵחֵלּוּ
  choice: sinimulan nila
  rationale: Ang Hiphil perfect ng חלל/החל ay nangangahulugang “magsimula”; kailangan sa Tagalog ang kasunod na kilos na “buuin.”
- source_word: הָעֲרֵמוֹת
  choice: ang mga bunton
  rationale: Ang עֲרֵמוֹת ay mga bunton o tumpok, dito ay mga naipong handog na ani. Pinananatili ng “mga bunton” ang kongkretong larawan.
- source_word: לְיִסּוֹד
  choice: buuin mula sa pundasyon
  rationale: Ang infinitive ng יסד na may ל ay tumutukoy sa pagsisimula sa saligan o pinakailalim. Ang parirala ay natural sa Tagalog at pinananatili ang larawan ng pagtatayo ng bunton mula sa base nito.
- source_word: וּבַחֹדֶשׁ הַשְּׁבִיעִי
  choice: at nang ikapitong buwan
  rationale: Tuwirang pagpapatuloy ng panahong binabanggit; natural na katumbas sa Tagalog.
- source_word: כִּלּוּ
  choice: natapos nila ang mga iyon
  rationale: Ang Piel perfect ng כלה ay “tapusin” o “kumpletuhin.” Ang “mga iyon” ay malinaw na tumutukoy sa mga bunton, bagaman hindi tahasang inuulit sa Hebreo ang layon.
