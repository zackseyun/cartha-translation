base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/013.yaml
  text: Jehiel[a], Azaziah, Nahath, Asahel, Jerimoth, Jozabad, Eliel, Ismakiah[b], Mahath, and Benaiah were officers under the authority of Conaniah and Shimei his brother, by the appointment of King Hezekiah and Azariah, the chief officer of the house of God.
translation:
  language: tl
  text: Sina Jehiel, Azaziah, Nahath, Asahel, Jerimoth, Jozabad, Eliel, Ismakiah, Mahath, at Benaiah ay mga opisyal sa ilalim ng pamamahala ni Conaniah at ng kapatid niyang si Shimei,[a] ayon sa atas[b] ni Haring Hezekiah at ni Azariah, na pinuno ng bahay ng Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “mula sa kamay ni Conaniah at ng kapatid niyang si Shimei.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “ayon sa utos” o “sa ilalim ng pangangasiwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּקִידִים
  choice: mga opisyal
  rationale: Tumutukoy ito sa mga hinirang na may pananagutang administratibo. Natural sa makabagong Filipino ang “mga opisyal” at hindi nito pinalalabis ang kanilang ranggo.
- source_word: מִיַּד
  choice: sa ilalim ng pamamahala ni
  rationale: Literal itong “mula/sa kamay ni,” ngunit idyoma ito para sa kapangyarihan, pangangasiwa, o pamamahala. Malinaw na ipinapakita ng salin ang ugnayan ng pananagutan.
- source_word: אָחִיו
  choice: kapatid niyang
  rationale: Tuwirang tumutukoy kay Shimei bilang kapatid ni Conaniah.
- source_word: בְּמִפְקַד
  choice: ayon sa atas
  rationale: Maaaring tumukoy ang salita sa utos, pagtatalaga, o pangangasiwa. Pinananatili ng “ayon sa atas” ang ideya ng opisyal na awtorisasyon nang hindi nilulutas nang labis ang saklaw ng termino.
- source_word: נְגִיד
  choice: pinuno
  rationale: Nangangahulugan ito ng lider o pangunahing opisyal. Ang “pinuno” ay malinaw at hindi nag-aangkat ng ranggong gaya ng “prinsipe” na hindi kailangan sa kontekstong administratibo.
- source_word: בֵּית הָאֱלֹהִים
  choice: bahay ng Diyos
  rationale: Ito ang literal at karaniwang katawagan sa templo, at malinaw pa rin ito sa Filipino.
- source_word: יְחִיאֵל, עֲזַזְיָהוּ, נַחַת, עֲשָׂהאֵל, יְרִימוֹת, יוֹזָבָד, אֱלִיאֵל, יִסְמַכְיָהוּ, מַחַת, בְּנָיָהוּ, כּוֹנַנְיָהוּ, שִׁמְעִי, יְחִזְקִיָּהוּ, עֲזַרְיָהוּ
  choice: Jehiel, Azaziah, Nahath, Asahel, Jerimoth, Jozabad, Eliel, Ismakiah, Mahath, Benaiah, Conaniah, Shimei, Hezekiah, Azariah
  rationale: Ginamit ang nakasanayang anyo ng mga pangalang biblikal sa halip na isalin ang kahulugan ng mga ito.
theological_decisions:
- issue: Antas ng mga katungkulang administratibo sa templo
  choice: Gumamit ng karaniwang katawagang “mga opisyal” at “pinuno.”
  alternative: Gumamit ng mas matataas na katawagang gaya ng “mga tagapamahala,” “mga prinsipe,” o “mga naghahari.”
  rationale: Administratibo ang pangunahing diwa ng talata. Iniiwasan ng piniling salin ang pag-aangkat ng ranggong panrelihiyon o monarkikal na hindi tahasang hinihingi ng Hebreo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang mahabang talaan ng mga pangalan at ang administratibong ayos ng talata, habang ang mga idyomang Hebreo ay isinalin sa natural na Filipino. Inilagay ang mga talababa sa mismong mga pariralang tinutukoy ng mga ito.
