revisions:
- from: Iniutos din niya sa mga mamamayan ng Jerusalem na ibigay ang bahaging nauukol sa mga pari at mga Levita, upang makapaglaan sila ng sarili sa kautusan ni Yahweh.[a]
  to: Iniutos din niya sa bayan, sa mga naninirahan sa Jerusalem, na ibigay ang bahaging nauukol sa mga pari at mga Levita, upang maitalaga nila ang kanilang sarili sa kautusan ni Yahweh.[a]
  rationale: Pinalitan ang hindi idiomatikong "makapaglaan sila ng sarili" ng "maitalaga nila ang kanilang sarili," na likas na naghahatid ng kontekstuwal na diwa ng pagtuon ng mga pari at Levita sa kautusan. Ibinalik ang appositional na paglalarawan ng Hebreo sa "bayan, sa mga naninirahan sa Jerusalem." Inayos ang gramatika ng alternatibong salin sa talababa at pinanatili ang marker sa pariralang may leksikal na kalabuan.
