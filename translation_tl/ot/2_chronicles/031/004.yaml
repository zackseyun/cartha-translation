  text: וַ/יֹּ֤אמֶר לָ/עָם֙ לְ/יוֹשְׁבֵ֣י יְרוּשָׁלִַ֔ם לָ/תֵ֕ת מְנָ֥ת הַ/כֹּהֲנִ֖ים וְ/הַ/לְוִיִּ֑ם לְמַ֥עַן יֶחֶזְק֖וּ בְּ/תוֹרַ֥ת יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/004.yaml
  text: He also commanded the people[a], the inhabitants of Jerusalem, to give the portion due to the priests and the Levites, so that they might devote themselves to the law of Yahweh.
translation:
  language: tl
  text: Iniutos din niya sa bayan, sa mga naninirahan sa Jerusalem, na ibigay ang bahaging nauukol sa mga pari at mga Levita, upang maitalaga nila ang kanilang sarili sa kautusan ni Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “upang maging matatag sila sa kautusan ni Yahweh,” o “upang mahigpit silang manghawak sa kautusan ni Yahweh.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Iniutos din niya
  rationale: Karaniwang nangangahulugang “sinabi” ang אמר, ngunit ang kasunod na pawatas at ang awtoridad ng hari sa konteksto ay nagpapahiwatig ng utos. Ipinahihiwatig ng “din” ang pagpapatuloy ng salaysay.
- source_word: לָעָם לְיוֹשְׁבֵי יְרוּשָׁלִַם
  choice: sa mga mamamayan ng Jerusalem
  rationale: Ang “mga naninirahan sa Jerusalem” ay paglilinaw kung sino ang tinutukoy na bayan; likas at maikli itong naipahahayag sa Filipino bilang “mga mamamayan ng Jerusalem.”
- source_word: לָתֵת מְנָת
  choice: na ibigay ang bahaging nauukol
  rationale: Ang מְנָה ay takda o nakalaang bahagi. Ipinakikita ng “nauukol” na ito ang bahaging nararapat matanggap ng mga pari at Levita.
- source_word: הַכֹּהֲנִים וְהַלְוִיִּם
  choice: sa mga pari at mga Levita
  rationale: Pinananatiling magkahiwalay ang dalawang pangkat, gaya ng tahasang pagkakabanggit sa Hebreo.
- source_word: לְמַעַן יֶחֶזְקוּ
  choice: upang makapaglaan sila ng sarili
  rationale: Sa konteksto ng materyal na pagtustos, ipinahahayag nito na mabibigyan sila ng kakayahang ituon nang matatag ang sarili sa kanilang tungkulin. Dahil maaari ring mangahulugang “maging matatag” o “manghawakang mahigpit,” pinananatili sa talababa ang tunay na leksikal na kalabuan.
- source_word: בְּתוֹרַת יְהוָה
  choice: sa kautusan ni Yahweh
  rationale: Ang תּוֹרָה rito ay tumutukoy sa kautusan o tagubilin ni Yahweh. Ang pang-ukol ay likas na umaayon sa pariralang Filipino na “maglaan ng sarili sa.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin ang tetragrammaton bilang personal na pangalang “Yahweh,” hindi pinapalitan ng isang titulo.
theological_decisions:
- issue: Pagpapahayag sa יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Personal na pangalan ng Diyos ang nasa tekstong Hebreo, kaya pinananatili ito bilang “Yahweh.”
- issue: Kahulugan ng יֶחֶזְקוּ בְּתוֹרַת יְהוָה
  choice: makapaglaan sila ng sarili sa kautusan ni Yahweh
  alternative: maging matatag sila sa kautusan ni Yahweh; manghawakan silang mahigpit sa kautusan ni Yahweh
  rationale: Maaaring tumukoy ang חזק sa pagiging matatag o mahigpit na pagkapit. Sa konteksto, ang pagbibigay ng bahagi ay nagpapahintulot sa mga pari at Levita na ituon ang sarili sa kautusan, ngunit hindi dapat burahin ang iba pang posibleng diwa; kaya inilalahad ang mga iyon sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mga mamamayan ng Jerusalem” upang natural na pagsamahin ang “bayan” at ang kasunod nitong paglilinaw. Inilagay ang talababa sa pariralang may tunay na kalabuan, hindi sa salitang “mamamayan.”
