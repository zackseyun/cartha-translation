base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/016.yaml
  text: apart from those enrolled by genealogy among the males from three years old and upward[a], all who entered the house of Yahweh, as the daily matter required[c][b], for their service in their duties according to their divisions.
translation:
  language: tl
  text: Bukod sa mga lalaking nakatalang ayon sa angkan, mula tatlong taong gulang pataas[a], ibinibigay ito sa lahat ng pumapasok sa bahay ni Yahweh, ayon sa kinakailangan sa bawat araw[b], para sa kanilang paglilingkod sa mga itinakdang tungkulin nila[c], ayon sa kani-kanilang pangkat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “bukod sa talaan ayon sa angkan ng mga lalaking tatlong taong gulang pataas.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, literal na “para sa bagay ng isang araw sa araw nito,” ibig sabihin, ang kinakailangan sa bawat araw.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring isalin ang “mga itinakdang tungkulin” bilang “mga pagbabantay” o “mga turno ng paglilingkod.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִלְּבַד
  choice: bukod sa
  rationale: Pinananatili nito ang ugnayang maaaring mangahulugang hiwalay sa o karagdagan sa naunang pangkat, nang hindi tahasang pinipili ang mas mahigpit na ‘maliban sa.’
- source_word: הִתְיַחְשָׂם לִזְכָרִים
  choice: mga lalaking nakatala ayon sa angkan
  rationale: Ipinahahayag nito ang genealogical registration at ang tahasang pagtukoy ng Hebreo sa mga lalaki, sa natural na makabagong Tagalog.
- source_word: מִבֶּן שָׁלֹשׁ שָׁנִים וּלְמַעְלָה
  choice: mula tatlong taong gulang pataas
  rationale: Karaniwan at malinaw na pahayag sa Tagalog para sa hangganan ng edad.
- source_word: לְכָל הַבָּא
  choice: sa lahat ng pumapasok
  rationale: Ang participle ay kolektibo at maaaring magpahiwatig ng regular o pangkalahatang pagpasok, kaya ginamit ang aspektong di-ganap.
- source_word: לְבֵית יְהוָה
  choice: sa bahay ni Yahweh
  rationale: Pinananatili ang literal na ‘bahay’ at ang personal na banal na pangalang Yahweh, sa halip na palitan ito ng titulo.
- source_word: לִדְבַר יוֹם בְּיוֹמוֹ
  choice: ayon sa kinakailangan sa bawat araw
  rationale: Natural na inilalahad ang idyomang administratibo tungkol sa pang-araw-araw na kinakailangan, habang nasa talababa ang literal na anyo.
- source_word: לַעֲבוֹדָתָם
  choice: upang gampanan ang kanilang paglilingkod
  rationale: Ang ‘paglilingkod’ ay angkop sa gawain sa templo nang hindi nag-aangkat ng mas huling terminolohiyang pansimbahan.
- source_word: בְּמִשְׁמְרוֹתָם
  choice: sa mga takdang tungkulin nila
  rationale: Ipinakikita ang organisadong duty assignments; inilalagay sa talababa ang posibleng mas tiyak na diwang ‘mga turno.’
- source_word: כְּמַחְלְקוֹתֵיהֶם
  choice: ayon sa kani-kanilang pangkat
  rationale: Tumutukoy sa organisadong mga dibisyon ng mga tauhan sa templo at malinaw ito sa karaniwang mambabasa.
theological_decisions:
- issue: Tahasang panlalaking katawagan sa mga tauhan ng templo
  choice: mga lalaki
  alternative: mga tao / mga nakatala
  rationale: Ang לִזְכָרִים ay tahasang tumutukoy sa mga lalaki; hindi ito ginawang neutral sa salin.
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehovah
  rationale: Ginamit ang personal na pangalang nasa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- issue: Ugnayan ng מִלְּבַד sa mga pangkat na binanggit
  choice: bukod sa
  alternative: maliban sa
  rationale: Pinananatili ng ‘bukod sa’ ang posibilidad ng karagdagan o pagkakahiwalay nang hindi ginagawang tiyak na hindi kabilang ang pangkat.
translation_notes:
  register: Makabago ngunit marangal na Filipino; pinanatili ang anyong pangungusap na karugtong ng nakaraang talata. Ginamit ang em dash upang luminaw ang paglipat mula sa rehistradong pangkat patungo sa ‘lahat ng pumapasok,’ nang hindi binabago ang hindi ganap na malinaw na sintaktikong ugnayan sa Hebreo.
