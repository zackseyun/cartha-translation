language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/כִ/פְרֹ֣ץ הַ/דָּבָ֗ר הִרְבּ֤וּ בְנֵֽי יִשְׂרָאֵל֙ רֵאשִׁ֣ית דָּגָ֗ן תִּיר֤וֹשׁ וְ/יִצְהָר֙ וּ/דְבַ֔שׁ וְ/כֹ֖ל תְּבוּאַ֣ת שָׂדֶ֑ה וּ/מַעְשַׂ֥ר הַ/כֹּ֛ל לָ/רֹ֖ב הֵבִֽיאוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/005.yaml
  text: And when the matter spread[a], the sons of Israel brought in abundance the firstfruits of grain, new wine, oil, honey, and all the produce of the field[b]; they brought in abundantly the tithe of everything.
translation:
  language: tl
  text: Nang kumalat ang usaping ito[a], nagdala ang mga anak ni Israel[b] ng napakaraming unang bunga ng butil, bagong alak, langis, pulot[c], at lahat ng ani sa bukid. At dinala nila nang sagana ang ikapu ng lahat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nang kumalat ang utos” o “nang kumalat ang balita tungkol dito.” Malawak ang kahulugan ng salitang Hebreo at maaaring tumukoy sa sinabi, utos, o balita tungkol dito.
    reason: lexical_alternative
  - marker: b
    text: Ang “mga anak ni Israel” ay karaniwang kolektibong tawag sa mga Israelita bilang isang bayan.
    reason: cultural_note
  - marker: c
    text: Sa ilang konteksto, ang “pulot” ay maaaring tumukoy sa matamis na arnibal, gaya ng arnibal mula sa datiles, at hindi lamang sa pulot-pukyutan.
    reason: cultural_note
lexical_decisions:
- source_word: וְ/כִ/פְרֹץ הַ/דָּבָר
  choice: Nang lumaganap ang bagay na ito
  rationale: Ang pariralang temporal ay isinaling “Nang,” at ang פרץ ay “lumaganap” upang maipahiwatig ang mabilis na pagkalat. Pinananatili ng “bagay na ito” ang lawak ng kahulugan ng דָּבָר nang hindi tiyakang nagpapasya kung ang tinutukoy ay ang utos, salita, o balita tungkol dito.
- source_word: הִרְבּוּ
  choice: saganang nagdala
  rationale: Sa konteksto ng mga handog at ng kasunod na הֵבִיאוּ, inilalarawan nito ang malaking dami ng kanilang dinala. Likas sa Tagalog ang “saganang nagdala.”
- source_word: בְנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Pinananatili ang pormal na Hebreong pananalita. Sa konteksto, kolektibo itong tumutukoy sa mga Israelita, na nililinaw sa talababa.
- source_word: רֵאשִׁית
  choice: mga unang bunga
  rationale: Ito ang karaniwang katawagan sa unang bahagi ng ani na inihahandog o itinatalaga.
- source_word: דָּגָן
  choice: butil
  rationale: Pangkalahatang katawagan ito sa mga aning cereal; malinaw at maikli ang “butil” sa modernong Tagalog.
- source_word: תִּירוֹשׁ
  choice: bagong alak
  rationale: Ipinapakita nito ang agrikultural na diwa ng sariwa o bagong gawang alak, sa halip na alak sa pinakapangkalahatang kahulugan.
- source_word: יִצְהָר
  choice: langis
  rationale: Karaniwan itong tumutukoy sa sariwang langis, lalo na langis ng olibo, ngunit hindi kailangang dagdagan ang “olibo” sa pangunahing teksto.
- source_word: דְבַשׁ
  choice: pulot
  rationale: Pinananatili ang karaniwang kahulugan habang inilalagay sa talababa ang posibilidad na matamis na arnibal ang tinutukoy.
- source_word: וְ/כֹל תְּבוּאַת שָׂדֶה
  choice: at lahat ng ani sa bukid
  rationale: Natural na ipinahahayag ng “ani sa bukid” ang lahat ng produktong agrikultural na tinutukoy.
- source_word: וּ/מַעְשַׂר הַ/כֹּל
  choice: ang ikapu ng lahat ng bagay
  rationale: Ang “ikapu” ang teknikal at pamilyar na katawagan sa ikasampung bahaging inihahandog; isinasalamin ng “lahat ng bagay” ang הַכֹּל.
- source_word: לָ/רֹב
  choice: nang sagana
  rationale: Ipinahahayag nito ang napakaraming dami ng ikapung dinala at pinananatili ang pag-uulit ng diin sa talata.
theological_decisions:
- issue: Kolektibong pananalitang may kasariang בְנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  alternative: mga Israelita / sambayanang Israel
  rationale: Pinananatili sa pangunahing teksto ang pormal na anyo ng Hebreo, ngunit nililinaw sa talababa na ang gamit nito rito ay kolektibo at hindi limitado sa mga lalaking anak lamang.
- issue: Saklaw ng הַדָּבָר
  choice: ang bagay na ito
  alternative: ang utos / ang balita / ang salita
  rationale: Hindi tahasang nilulutas ng Hebreo kung ang diin ay nasa naunang utos, sa mensahe, o sa pagkalat ng balita tungkol dito. Ang malawak na salin at talababa ay nagpapanatili sa tunay na kalabuan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Pinanatili ang tradisyonal ngunit malinaw na mga katawagang “mga unang bunga” at “ikapu.” Ginamit ang “sagana” upang natural na maipakita ang inuulit na diin ng Hebreo sa malaking dami.
