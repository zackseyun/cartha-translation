  to: At para sa mga anak ni Aaron[a], ang mga pari, sa mga bukid sa mga pastulan[b] ng kanilang mga lunsod, sa bawat lunsod[c], may mga lalaking itinalaga ayon sa pangalan[d] upang magbigay ng mga bahagi sa bawat lalaking kabilang sa mga pari at sa bawat isa sa mga Levita na nakatala ayon sa talaangkanan[e].
