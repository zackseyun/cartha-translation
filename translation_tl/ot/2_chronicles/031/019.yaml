translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “lunsod,” “pastulan,” at “talaangkanan/angkan” upang mapanatili ang makasaysayan at administratibong diwa nang hindi nagiging labis na teknikal. Ang lahat ng talababa ay nakakabit sa mismong salitang nililinaw.
