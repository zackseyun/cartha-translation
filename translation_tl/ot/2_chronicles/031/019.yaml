  text: וְ/לִ/בְנֵי֩ אַהֲרֹ֨ן הַ/כֹּהֲנִ֜ים בִּ/שְׂדֵ֨י מִגְרַ֤שׁ עָרֵי/הֶם֙ בְּ/כָל עִ֣יר וָ/עִ֔יר אֲנָשִׁ֕ים אֲשֶׁ֥ר נִקְּב֖וּ בְּ/שֵׁמ֑וֹת לָ/תֵ֣ת מָנ֗וֹת לְ/כָל זָכָר֙ בַּ/כֹּ֣הֲנִ֔ים וּ/לְ/כָל הִתְיַחֵ֖שׂ בַּ/לְוִיִּֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/019.yaml
  text: And for the sons of Aaron[a], the priests, in the pasture lands of their cities, in every city[e][d][c][b], there were men designated by name to give portions to every male among the priests and to everyone enrolled by genealogy among the Levites.
translation:
  language: tl
  text: At para sa mga anak ni Aaron[a], ang mga pari, sa mga bukid sa mga pastulan[b] ng kanilang mga lunsod, sa bawat lunsod[c], may mga lalaking itinalaga ayon sa pangalan[d] upang magbigay ng mga bahagi sa bawat lalaking kabilang sa mga pari at sa bawat isa sa mga Levita na nakatala ayon sa talaangkanan[e].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga inapo ni Aaron.” Literal na “mga anak ni Aaron” ang Hebreo, isang pananalitang pangangkan na maaari ring tumukoy sa mga inapo sa mga sumunod na salinlahi.
    reason: lexical_alternative
  - marker: b
    text: O “mga panlahatang lupain” o “mga bukás na lupain” ng kanilang mga lunsod. Tumutukoy ito sa lupang nakapaligid sa mga lunsod, na karaniwang ginagamit bilang pastulan.
    reason: cultural_note
  - marker: c
    text: Literal na “bawat lunsod at lunsod,” isang idyomang nangangahulugang bawat isa sa lahat ng lunsod.
    reason: lexical_alternative
  - marker: d
    text: O “nakalista ayon sa pangalan” o “tinukoy ayon sa pangalan.” Ipinahihiwatig ng Hebreo na opisyal na kinilala ang mga lalaking ito sa pamamagitan ng kanilang pangalan.
    reason: lexical_alternative
  - marker: e
    text: Ibig sabihin, nakatala sa mga talaangkanan ng mga Levita.
    reason: cultural_note
lexical_decisions:
- source_word: וְלִבְנֵי אַהֲרֹן הַכֹּהֲנִים
  choice: At para sa mga anak ni Aaron, na mga pari
  rationale: Pinananatili ng “mga anak ni Aaron” ang anyong pangangkan ng Hebreo, habang nililinaw ng “na mga pari” ang appositional na ugnayan.
- source_word: בִּשְׂדֵי מִגְרַשׁ עָרֵיהֶם
  choice: na nasa mga pastulan ng kanilang mga lunsod
  rationale: Ang מִגְרָשׁ ay bukás o panlahatang lupa sa paligid ng mga lunsod, karaniwang ginagamit bilang pastulan; natural at malinaw ang “mga pastulan” sa konteksto.
- source_word: בְּכָל עִיר וָעִיר
  choice: sa bawat lunsod
  rationale: Ang literal na pag-uulit na “bawat lunsod at lunsod” ay idyomang distributibo; naipahahayag ito nang natural sa Filipino sa “sa bawat lunsod.”
- source_word: אֲנָשִׁים אֲשֶׁר נִקְּבוּ בְּשֵׁמוֹת
  choice: may mga lalaking itinalaga ayon sa pangalan
  rationale: Ipinahihiwatig ng parirala ang opisyal at tiyak na pagkakakilanlan sa pangalan. Ang “itinalaga” ay angkop sa administratibong tungkulin ngunit binabanggit sa talababa ang posibilidad na “nakalista.”
- source_word: לָתֵת מָנוֹת
  choice: upang magbigay ng mga bahagi
  rationale: Ang מָנוֹת ay mga bahagi o takdang bahagi ng mga panustos na ipinamamahagi; pinananatili ng salin ang payak na kilos na “magbigay.”
- source_word: לְכָל זָכָר בַּכֹּהֲנִים
  choice: sa bawat lalaking kabilang sa mga pari
  rationale: Tiyak na tumutukoy ang זָכָר sa kasariang lalaki, kaya hindi ito ginawang pangkalahatang “bawat isa.”
- source_word: וּלְכָל הִתְיַחֵשׂ בַּלְוִיִּם
  choice: at sa bawat nakatala ayon sa angkan kabilang sa mga Levita
  rationale: Ang hitpael ng יחס ay tumutukoy sa pagtatala batay sa talaangkanan. Ang “nakatala ayon sa angkan” ay malinaw at natural sa modernong Filipino.
