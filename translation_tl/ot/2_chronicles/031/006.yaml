  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וּ/בְנֵ֧י יִשְׂרָאֵ֣ל וִֽ/יהוּדָ֗ה הַ/יּֽוֹשְׁבִים֮ בְּ/עָרֵ֣י יְהוּדָה֒ גַּם הֵ֗ם מַעְשַׂ֤ר בָּקָר֙ וָ/צֹ֔אן וּ/מַעְשַׂ֣ר קָֽדָשִׁ֔ים הַ/מְקֻדָּשִׁ֖ים לַ/יהוָ֣ה אֱלֹהֵי/הֶ֑ם הֵבִ֕יאוּ וַֽ/יִּתְּנ֖וּ עֲרֵמ֥וֹת עֲרֵמֽוֹת־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/006.yaml
  text: And the people of Israel and Judah who lived in the cities of Judah also brought the tithe of cattle and sheep[a], and the tithe of the holy things consecrated to Yahweh their God, and they laid them in heaps[b], heap upon heap.
translation:
  language: tl
  text: At ang mga Israelita at mga taga-Juda na naninirahan sa mga lunsod ng Juda ay nagdala rin ng ikasampung bahagi ng mga baka at mga tupa, at ng ikasampung bahagi ng mga banal na bagay na itinalaga kay Yahweh na kanilang Diyos. Inilagay nila ang mga iyon sa bunton-bunton.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי יִשְׂרָאֵל וִיהוּדָה
  choice: ang mga Israelita at mga taga-Juda
  rationale: Ang בְּנֵי ay kolektibong tumutukoy sa mga kabilang sa Israel at Juda, hindi lamang sa mga lalaking anak. Likas at malinaw ito sa modernong Tagalog.
- source_word: הַיּוֹשְׁבִים בְּעָרֵי יְהוּדָה
  choice: na naninirahan sa mga lunsod ng Juda
  rationale: Ang participle ng ישׁב ay nagpapahiwatig ng patuloy na paninirahan; tuwirang katumbas ng עָרֵי ang 'mga lunsod.'
- source_word: גַּם הֵם
  choice: ay nagdala rin
  rationale: Ipinahihiwatig ng parirala na nakibahagi rin ang pangkat na ito; natural na naihahatid iyon ng 'rin.'
- source_word: מַעְשַׂר
  choice: ikasampung bahagi
  rationale: Tuwirang ipinapahayag ang kahulugan ng kultikong terminong 'tithe' sa wikang madaling maunawaan ng karaniwang mambabasa.
- source_word: בָּקָר וָצֹאן
  choice: mga baka at mga tupa
  rationale: Ang בָּקָר ay mga baka, samantalang ang צֹאן ay maliliit na alagang hayop at maaaring sumaklaw sa tupa at kambing. Pinili ang maikli at karaniwang 'mga tupa' nang hindi dinaragdagan ang tahasang binanggit.
- source_word: וּמַעְשַׂר קָדָשִׁים
  choice: at ng ikasampung bahagi ng mga banal na bagay
  rationale: Pinananatili ng 'mga banal na bagay' ang malawak at bahagyang di-tiyak na saklaw ng קָדָשִׁים nang hindi ipinapalagay ang isang mas espesipikong uri ng handog.
- source_word: הַמְקֻדָּשִׁים
  choice: na itinalaga
  rationale: Ipinapakita ng passive participle na ang mga bagay ay ibinukod o inilaan para sa Diyos; natural sa Tagalog ang 'itinalaga.'
- source_word: לַיהוָה אֱלֹהֵיהֶם
  choice: kay Yahweh na kanilang Diyos
  rationale: Pinananatili ang personal na pangalang יהוה bilang 'Yahweh,' at malinaw na ipinahahayag ang kaugnayang 'kanilang Diyos.'
- source_word: הֵבִיאוּ
  choice: nagdala
  rationale: Karaniwan at tuwirang kahulugan ng hiphil ng בוא sa kontekstong ito.
- source_word: וַיִּתְּנוּ
  choice: Inilagay nila ang mga iyon
  rationale: Sa konteksto ng mga bunton, ang נתן ay nangangahulugang inilagay o itinambak. Ang 'mga iyon' ay malinaw na bumabalik sa mga dinalang bagay.
- source_word: עֲרֵמוֹת עֲרֵמוֹת
  choice: sa bunton-bunton
  rationale: Ginagaya ng pag-uulit sa 'bunton-bunton' ang idyomatikong pag-uulit sa Hebreo at ipinahihiwatig ang maraming magkakahiwalay na bunton.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יהוה
  choice: Yahweh
  alternative: ang PANGINOON; Jehovah
  rationale: Tahasan sa Hebreo ang Tetragrammaton. Pinananatili ng 'Yahweh' ang personal at tipanang pangalan nang hindi ito pinapalitan ng isang titulo.
- issue: Saklaw ng קָדָשִׁים
  choice: mga banal na bagay
  alternative: mga banal na handog; mga bagay na itinalaga
  rationale: Hindi tiyak sa parirala ang eksaktong uri ng mga bagay. Ang mas malawak na salin ay nagpapanatili sa tunay na leksikal na kalabuan at hindi nagpapasok ng mas tiyak na interpretasyong kultiko.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang 'ikasampung bahagi' sa halip na teknikal na 'ikapu' para sa agarang pagkaunawa, habang pinanatiling malawak ang 'mga banal na bagay.' Ang 'bunton-bunton' ay natural na Tagalog na nagpapanatili sa diin ng pag-uulit sa Hebreo.
