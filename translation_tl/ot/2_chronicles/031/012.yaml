translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “ikapu” bilang tiyak na terminong biblikal, ngunit iniwasan ang mas teknikal na pananalitang ritwal. Ang “pangalawa niya” ay sadyang maikli upang mapanatili ang bahagyang elipsis ng Hebreo; nililinaw sa talababa ang administratibong kahulugan.
