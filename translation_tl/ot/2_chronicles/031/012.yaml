- from: Matapat nilang dinala sa mga imbakan ang handog, ang ikapu, at ang mga banal na bagay.[a] Si Conanias na Levita ang namamahala sa mga ito, at pangalawa niya ang kapatid niyang si Simei.[b]
  to: Matapat nilang dinala ang handog, ang ikapu, at ang mga banal na bagay.[a] Si Conanias na Levita ang namamahala sa mga ito, at ang kapatid niyang si Simei ang pangalawa.[b]
  rationale: Inalis ang destinasyong “sa mga imbakan” upang hindi magdagdag ng detalyeng wala sa mismong Hebreong teksto. Inayos ang huling sugnay upang maging mas natural at malinaw sa Filipino, nang hindi pinalalawak ang bahagyang pinaikling pahayag ng Hebreo tungkol sa ikalawang ranggo ni Simei.
