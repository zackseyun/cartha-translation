  source_fidelity: Ang pagdaragdag ng “sa mga imbakan” ay hindi hayagang nasa Hebreong teksto ng talata. Bagaman sinusuportahan ito ng mas malawak na konteksto, mas ligtas na huwag itong isama sa mismong salin. Wasto ang pagtukoy sa handog, ikapu, mga banal na bagay, tapat na paraan ng pangangasiwa, at ranggo nina Conanias at Simei.
  naturalness: Natural ang karamihan ng draft, ngunit ang “pangalawa niya” ay medyo malabo at hindi gaanong idiomatiko sa modernong Filipino. Mas malinaw at natural ang “ang kapatid niyang si Simei ang pangalawa,” habang pinananatili ang maikling pagpapahayag ng Hebreo.
  terminology: Ang “handog,” “ikapu,” “mga banal na bagay,” at “Levita” ay angkop sa modernong Filipino Tagalog at tapat sa mga pangunahing terminong Hebreo. Ang “Conanias” at “Simei” ay katanggap-tanggap na tradisyonal na anyo ng mga pangalan.
