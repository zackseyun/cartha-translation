base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/012.yaml
  text: They brought in the contribution[a], the tithe, and the holy things faithfully, and Conaniah the Levite was chief over them[b], with his brother Shimei second.
translation:
  language: tl
  text: Matapat nilang dinala ang handog, ang ikapu, at ang mga banal na bagay.[a] Si Conanias na Levita ang namamahala sa mga ito, at ang kapatid niyang si Simei ang pangalawa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga bagay na itinalaga sa Diyos.”
    reason: lexical_alternative
  - marker: b
    text: O “at ang kapatid niyang si Simei ang pangalawa sa pamamahala.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבִיאוּ
  choice: dinala sa mga imbakan
  rationale: Ang Hiphil ng בוא ay nangangahulugang “dinala” o “ipinasok.” Dahil malinaw sa konteksto ng kabanata na inilalagak ang mga handog sa mga silid-imbakan ng templo, natural sa Tagalog ang “dinala sa mga imbakan.”
- source_word: הַתְּרוּמָה
  choice: ang handog
  rationale: Ang תְּרוּמָה ay ambag na ibinukod para sa banal na gamit. Ang “handog” ay malinaw at karaniwang salitang Filipino, nang hindi gumagamit ng teknikal na katawagang ritwal.
- source_word: הַמַּעֲשֵׂר
  choice: ang ikapu
  rationale: Ang מַעֲשֵׂר ay ang itinakdang ikasampung bahagi; “ikapu” ang kinikilalang maikli at tiyak na katumbas sa Filipino.
- source_word: הַקֳּדָשִׁים
  choice: ang mga banal na bagay
  rationale: Ang pangmaramihang anyo ng קֹדֶשׁ ay tumutukoy sa mga bagay na ibinukod para sa banal na gamit. Pinananatili ng saling ito ang lawak at pagiging kongkreto ng Hebreo.
- source_word: בֶּאֱמוּנָה
  choice: Matapat nilang
  rationale: Sa kontekstong administratibo, ang אֱמוּנָה ay nagpapahiwatig ng katapatan o pagiging mapagkakatiwalaan. Inilagay sa simula ang pang-abay upang maging natural ang daloy sa Filipino habang tumutukoy pa rin sa paraan ng pagdadala.
- source_word: וַעֲלֵיהֶם נָגִיד
  choice: ang namamahala sa mga ito
  rationale: Pinagsamang natural na salin ito ng pariralang nagsasaad na si Conanias ang pinunong may pananagutan sa mga naunang binanggit na bagay.
- source_word: כונניהו
  choice: Conanias
  rationale: Ginamit ang anyong pangalang nakasanayan sa mga saling Filipino at ang hulaping “-ias” na karaniwang kumakatawan sa teoporikong hulapi ng Hebreo.
- source_word: הַלֵּוִי
  choice: na Levita
  rationale: Tinutukoy nito ang kinikilalang katayuang Levitiko ni Conanias; natural sa Filipino ang konstruksiyong “na Levita.”
- source_word: אָחִיהוּ
  choice: ang kapatid niyang
  rationale: Karaniwang nangangahulugang literal na kapatid ang אָח, at walang pahiwatig sa konteksto na dapat itong palawakin bilang kamag-anak lamang.
- source_word: מִשְׁנֶה
  choice: pangalawa niya
  rationale: Ang מִשְׁנֶה ay tumutukoy sa opisyal na pangalawa sa ranggo o katuwang na kasunod ng namamahala. Napananatili ng “pangalawa niya” ang maikli at bahagyang di-tiyak na pahayag ng Hebreo.
- source_word: שִׁמְעִי
  choice: Simei
  rationale: Ginamit ang tradisyonal at madaling makilalang anyo ng pangalang ito sa Filipino.
