  terminology: Ang “Ezequias,” “mga pinuno,” “mga bunton,” at “Yahweh” ay angkop sa makabagong Filipino at sa marangal na rehistro. Ang “binasbasan” ay natural para sa pagpapala sa bayan, samantalang “pinuri” ang idiomatikong katumbas kapag si Yahweh ang layon ng ברך sa kontekstong ito.
