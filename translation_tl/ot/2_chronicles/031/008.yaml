base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/008.yaml
  text: When Hezekiah and the officials came and saw the heaps[b][a], they blessed Yahweh and his people Israel.
translation:
  language: tl
  text: Dumating si Ezequias at ang mga pinuno, at nakita nila ang mga bunton[a]. Pinuri nila si Yahweh at binasbasan ang kanyang bayang Israel.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga tumpok.” Ang salitang Hebreo ay tumutukoy sa mga naipong bunton, na rito ay malamang na mga inihandog na ani o iba pang handog.
    reason: lexical_alternative
  - marker: b
    text: Posible ring “ang kanyang bayan, ang Israel,” kung ang “kanyang” ay tumutukoy kay Ezequias sa halip na kay Yahweh.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: dumating
  rationale: Ang pandiwang בוא sa salaysay ay likas na nangangahulugang pagdating; mas angkop dito ang “dumating” kaysa “pumasok.”
- source_word: יְחִזְקִיָּהוּ
  choice: Ezequias
  rationale: Ginamit ang nakaugaliang makabagong Tagalog na anyo ng pangalan.
- source_word: וְהַשָּׂרִים
  choice: ang mga pinuno
  rationale: Ang שׂרים ay tumutukoy sa mga nasa pamumuno o matataas na opisyal; malinaw at dignidadong salin ang “mga pinuno.”
- source_word: וַיִּרְאוּ
  choice: makita nila
  rationale: Tuwirang ipinahahayag ng ראה ang pisikal na pagkakita.
- source_word: הָעֲרֵמוֹת
  choice: ang mga bunton
  rationale: Ang עֲרֵמוֹת ay mga naipong bunton o tumpok, dito ay ayon sa konteksto mga handog na ani at iba pang ambag.
- source_word: וַיְבָרֲכוּ
  choice: pinagpala nila
  rationale: Pinananatili nito ang pangunahing diwa ng ברך at ang ugnayang leksikal nito sa pagpapala; kapag Diyos ang layon, kabilang sa kahulugan ang pagpupuri sa kanya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinalin ang Tetragrammaton bilang personal na pangalang “Yahweh,” sa halip na palitan ito ng isang titulo.
- source_word: עַמּוֹ יִשְׂרָאֵל
  choice: ang kanyang bayang Israel
  rationale: Pinakamalamang na ang hulaping “kanyang” ay tumutukoy kay Yahweh at inilalarawan ang Israel bilang kanyang bayan, habang pinananatili sa talababa ang posibleng ibang tukoy.
theological_decisions:
- issue: Ang tinutukoy ng hulaping panghalip sa עַמּוֹ (“kanyang bayan”)
  choice: 'Tumutukoy kay Yahweh: “ang kanyang bayang Israel.”'
  alternative: 'Maaaring tumukoy kay Ezequias: “ang kanyang bayan, ang Israel.”'
  rationale: Mas natural sa agarang pangungusap at sa karaniwang wikang tipan sa Kasulatan na ang Israel ay bayan ni Yahweh. Gayunman, maaari sa balarila ang pagtukoy kay Ezequias, kaya hindi ito ikinubli at inilagay sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang konkretong larawan ng mga bunton at ang pandiwang “pinagpala,” habang ipinaliwanag sa talababa ang kahulugan at tunay na kalabuan ng panghalip.
