  text: וּ/לְ/הִתְיַחֵ֗שׂ בְּ/כָל טַפָּ֧/ם נְשֵׁי/הֶ֛ם וּ/בְנֵי/הֶ֥ם וּ/בְנוֹתֵי/הֶ֖ם לְ/כָל קָהָ֑ל כִּ֥י בֶ/אֱמוּנָתָ֖/ם יִתְקַדְּשׁוּ קֹֽדֶשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/018.yaml
  text: and for the enrollment of all their little ones[a], their wives, their sons, and their daughters, for all the assembly[c][b]; for in their faithfulness they consecrated themselves as holy.
translation:
  language: tl
  text: at para sa pagkakatala[a] ng lahat ng kanilang maliliit na anak, ng kanilang mga asawa, ng kanilang mga anak na lalaki at mga anak na babae—para sa buong kapulungan; sapagkat sa kanilang katapatan[b] ay itinalaga nila ang kanilang sarili sa kabanalan[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “pagpapatala ayon sa angkan.” Ang pandiwang Hebreo ay tumutukoy sa paglalagay ng pangalan sa mga talaan ng pamilya o angkan.
    reason: lexical_alternative
  - marker: b
    text: Ang “katapatan” dito ay malamang na nangangahulugang pagiging mapagkakatiwalaan o tapat sa pagtupad ng mga banal na tungkulin, hindi pangunahing panloob na pananampalataya.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring isalin na “itinalaga nila ang kanilang sarili sa kabanalan” o “pinanatili nilang banal ang kanilang sarili.” Inuulit sa Hebreo ang ideya ng kabanalan sa pandiwa at pangngalan bilang pagdiriin.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְהִתְיַחֵשׂ
  choice: at para sa pagkakatala
  rationale: Ang hitpael ng יחס sa Mga Cronica ay tumutukoy sa pagpapatala sa talaan ng angkan o pamilya. Likas sa modernong Tagalog ang “pagkakatala,” habang nililinaw sa talababa ang aspektong genealogical.
- source_word: בְּכָל טַפָּם
  choice: ng lahat ng kanilang maliliit na anak
  rationale: Ang טַף ay partikular na tumutukoy sa maliliit na anak, kaya hindi ito pinalawak tungo sa lahat ng kasambahay o umaasa sa kanila.
- source_word: נְשֵׁיהֶם
  choice: ng kanilang mga asawa
  rationale: Sa talaan ng mga kasapi ng sambahayan, ang tinutukoy ay ang kanilang mga asawang babae; sapat at natural sa Tagalog ang “mga asawa.”
- source_word: וּבְנֵיהֶם וּבְנוֹתֵיהֶם
  choice: ng kanilang mga anak na lalaki at mga anak na babae
  rationale: Pinananatili ang tahasang pagkilala ng Hebreo sa mga anak na lalaki at mga anak na babae.
- source_word: לְכָל קָהָל
  choice: para sa buong kapulungan
  rationale: Ang קָהָל ay ang kabuuang kapulungang saklaw ng pagtatala at pamamahagi. Pinananatili ng “para sa” ang puwersa ng pang-ukol na לְ.
- source_word: בֶאֱמוּנָתָם
  choice: sa kanilang katapatan
  rationale: Sa kontekstong pangsaserdote at administratibo, ang אֱמוּנָה ay tumutukoy sa pagiging tapat at mapagkakatiwalaan sa tungkulin, hindi pangunahing sa panloob na pananampalataya.
- source_word: יִתְקַדְּשׁוּ קֹדֶשׁ
  choice: itinalaga nila ang kanilang sarili bilang banal
  rationale: Ipinahahayag ng anyong hitpael ang pagtatalaga o pagpapabanal sa sarili, at pinananatili ng “bilang banal” ang idinagdag na קֹדֶשׁ at ang pagdiriin sa kabanalan.
theological_decisions:
- issue: Kahulugan ng אֱמוּנָה sa kontekstong pangkulto at administratibo
  choice: katapatan o pagiging mapagkakatiwalaan sa pagtupad ng mga banal na tungkulin
  alternative: pananampalataya sa panloob o debosyonal na diwa
  rationale: Ang nakapaligid na talata ay tungkol sa maaasahang pangangasiwa ng mga pari at Levita at sa kanilang banal na katayuan. Hindi ipinapasok sa salita ang isang mas huling doktrinal na pakahulugan.
- issue: Pag-uulit ng ideya ng kabanalan sa יִתְקַדְּשׁוּ קֹדֶשׁ
  choice: itinalaga nila ang kanilang sarili bilang banal
  alternative: nagpakabanal sila; nanatili silang banal; itinalaga nila ang kanilang sarili sa kabanalan
  rationale: Pinananatili ng napiling salin kapwa ang kilos ng pagtatalaga sa sarili at ang kasunod na pangngalang nagpapadiin sa kabanalan, nang hindi tiyakang nilulutas kung ito ay simula ng pagtatalaga o patuloy na pagpapanatili ng kabanalan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “kapulungan” para sa pormal na katawagang pangkomunidad at “itinalaga…bilang banal” upang mapanatili ang sagradong diwa at ang pag-uulit ng Hebreo nang hindi nagiging labis na teknikal.
