  naturalness: Marangal at malinaw ang Tagalog sa kabuuan. Ang “itinalaga nila ang kanilang sarili sa kabanalan” ay mas idiomatiko at mas malapit sa pandiwang reflexive kaysa “bilang banal,” habang pinananatili ang kasunod na pangngalang tumutukoy sa kabanalan.
