base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/020.yaml
  text: Hezekiah did this throughout all Judah[a], and he did what was good and right and true before Yahweh his God.
translation:
  language: tl
  text: Ginawa ito ni Ezequias sa buong Juda, at ginawa niya ang mabuti, matuwid, at tapat[a] sa harap ni Yahweh na kanyang Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “totoo” o “ayon sa katotohanan.” Ang salitang Hebreo ay maaaring tumukoy sa katotohanan, pagiging maaasahan, o katapatan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ כָּזֹאת
  choice: Ginawa ito
  rationale: Binubuod ng parirala ang naunang mga reporma at kaayusan; likas at tuwiran sa Tagalog ang “Ginawa ito.”
- source_word: בְּכָל יְהוּדָה
  choice: sa buong Juda
  rationale: Ipinahihiwatig ng ב na may kasamang כל ang saklaw sa buong lupain ng Juda.
- source_word: הַטּוֹב
  choice: ang mabuti
  rationale: Ginagamit ang pang-uri bilang pangngalan at tumutukoy sa mabuting gawain o asal.
- source_word: הַיָּשָׁר
  choice: matuwid
  rationale: Sa kontekstong moral, ang ישר ay tumutukoy sa pagiging tama o matuwid; ang “matuwid” ay marangal at karaniwang salitang Filipino.
- source_word: הָאֱמֶת
  choice: tapat
  rationale: Maaaring mangahulugan ang אֱמֶת ng katotohanan, pagiging maaasahan, o katapatan. Sa paglalarawan ng asal kasama ng “mabuti” at “matuwid,” natural ang “tapat,” habang inilalahad sa talababa ang tunay na ambiguwidad.
- source_word: לִפְנֵי יְהוָה
  choice: sa harap ni Yahweh
  rationale: Pinananatili nito ang diwa ng pagkilos sa presensiya at ayon sa pagsusuri ng Diyos.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasatitik ang personal na pangalang Hebreo sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהָיו
  choice: kanyang Diyos
  rationale: Pinananatili ang panghalip na panlalaking isahan na tumutukoy kay Ezequias at ang personal na ugnayang ipinahahayag ng Hebreo.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Personal na pangalan ang tahasang nasa tekstong Hebreo, kaya pinanatili ito bilang “Yahweh” sa halip na palitan ng titulo.
- issue: Kahulugan ng הָאֱמֶת sa paglalarawan sa kilos ni Ezequias
  choice: tapat
  alternative: totoo; katotohanan
  rationale: 'Hindi nilulutas nang tahimik ang saklaw ng salita: ang “tapat” ay angkop sa asal, at itinatala ng talababa na maaari rin itong unawain bilang “totoo” o “katotohanan.”'
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Pinanatili ang pag-uulit ng “Ginawa” upang maipakita ang dalawang magkasunod na sugnay ng Hebreo, at ginamit ang “sa buong Juda” bilang natural na pahayag ng kabuuang saklaw.
