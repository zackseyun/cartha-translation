    issue: Hindi tiyak ang “bahaging inilaan ng hari.”
    rationale: Maaari itong mangahulugang bahaging inilaan ng hari, samantalang ang Hebreo ay tumutukoy sa bahagi ng hari na mula sa kanyang sariling ari-arian.
  - severity: low
    issue: Hindi gaanong idiomatiko ang “mga Sabbath.”
    rationale: Mas karaniwan at malinaw sa Filipino ang “mga araw ng Sabbath,” lalo na para sa paulit-ulit na mga pagdiriwang.
