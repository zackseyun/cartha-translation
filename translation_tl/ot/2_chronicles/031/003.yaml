  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וּ/מְנָת֩ הַ/מֶּ֨לֶךְ מִן רְכוּשׁ֜/וֹ לָ/עֹל֗וֹת לְ/עֹלוֹת֙ הַ/בֹּ֣קֶר וְ/הָ/עֶ֔רֶב וְ/הָ֣/עֹל֔וֹת לַ/שַּׁבָּת֖וֹת וְ/לֶ/חֳדָשִׁ֣ים וְ/לַ/מֹּעֲדִ֑ים כַּ/כָּת֖וּב בְּ/תוֹרַ֥ת יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/003.yaml
  text: 'The king’s portion from his own possessions was for the burnt offerings: the burnt offerings of the morning and the evening[a], and the burnt offerings for the Sabbaths, the new moons, and the appointed feasts[e][d][c][b], as it is written in the Law of Yahweh.'
translation:
  language: tl
  text: 'Ang bahagi ng hari[a], na nagmula sa sarili niyang mga ari-arian, ay para sa mga handog na sinusunog: ang mga handog na sinusunog sa umaga at sa gabi[e], at ang mga handog na sinusunog para sa mga araw ng Sabbath, sa mga bagong buwan[b], at sa mga itinakdang kapistahan[c], ayon sa nakasulat sa Kautusan ni Yahweh.[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “takdang bahagi ng hari” o “bahagi ng hari.”
    reason: lexical_alternative
  - marker: b
    text: Ang “mga bagong buwan” ay tumutukoy sa buwanang pagdiriwang sa pagsamba ng Israel sa pagsisimula ng bawat bagong buwan.
    reason: cultural_note
  - marker: c
    text: Maaari ring isalin na “mga itinakdang panahon” o “mga itinakdang pagdiriwang.”
    reason: lexical_alternative
  - marker: d
    text: 'Mas literal: “Torah ni Yahweh”; maaari ring isalin ang Torah bilang “tagubilin.”'
    reason: lexical_alternative
  - marker: e
    text: 'Mas literal na inuulit ng Hebreo ang “para”: “para sa mga handog na sinusunog: para sa mga handog na sinusunog sa umaga at sa gabi.”'
    reason: source_form
lexical_decisions:
- source_word: וּמְנָת הַמֶּלֶךְ
  choice: ang bahaging inilaan ng hari
  rationale: Ang מְנָה ay isang takda o nakalaang bahagi. Nililinaw ng “bahaging inilaan” na ito ang ambag na nakatalaga sa hari nang hindi ipinapalagay na buwis ito.
- source_word: מִן רְכוּשׁוֹ
  choice: mula sa sarili niyang mga ari-arian
  rationale: Ang רְכוּשׁ ay tumutukoy sa mga pag-aari o kayamanan. Ipinakikita ng parirala na nagmula ito sa personal na yaman ng hari.
- source_word: לָעֹלוֹת
  choice: para sa mga handog na sinusunog
  rationale: Ang עֹלָה ay handog na lubusang sinusunog. Ang saling ito ay malinaw sa karaniwang mambabasa at pinananatili ang uri ng handog.
- source_word: לְעֹלוֹת הַבֹּקֶר וְהָעֶרֶב
  choice: ang mga handog na sinusunog sa umaga at sa gabi
  rationale: Pinananatili nito ang tahasang pagbanggit ng Hebreo sa mga handog sa dalawang takdang oras, sa natural na ayos ng Tagalog.
- source_word: וְהָעֹלוֹת לַשַּׁבָּתוֹת וְלֶחֳדָשִׁים וְלַמֹּעֲדִים
  choice: at ang mga handog na sinusunog para sa mga Sabbath, sa mga bagong buwan, at sa mga itinakdang kapistahan
  rationale: Ang mga termino ay tumutukoy sa lingguhan, buwanan, at iba pang itinakdang pagdiriwang sa kalendaryo ng pagsamba ng Israel. Ang “itinakdang kapistahan” ay nagpapanatili sa diwa ng מוֹעֵד bilang panahong itinalaga.
- source_word: כַּכָּתוּב
  choice: ayon sa nakasulat
  rationale: Natural itong pormula sa Tagalog para sa pagsunod sa nasusulat na tagubilin.
- source_word: בְּתוֹרַת יְהוָה
  choice: sa Kautusan ni Yahweh
  rationale: Sa kontekstong ito, ang תּוֹרָה ay tumutukoy sa nakasulat na kautusang namamahala sa mga handog; ang pangalang יְהוָה ay tinumbasan ng “Yahweh.”
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Tuwirang ginagamit ng tekstong Hebreo ang pangalan ng Diyos. Pinananatili ng “Yahweh” ang katangiang pangalan sa halip na palitan ito ng isang titulo.
- issue: Saklaw ng תּוֹרָה sa talata
  choice: Kautusan
  alternative: tagubilin; Torah
  rationale: Ang konteksto ay ang nakasulat na mga tuntunin para sa takdang mga handog, kaya ang “Kautusan” ay natural at angkop, habang ang talababa ay nagpapanatili sa mas literal na alternatibo.
translation_notes:
  register: Makabago at marangal na Filipino, na gumagamit ng pangkaraniwang bokabularyo. Pinanatili ang “Sabbath” bilang kilalang terminong biblikal, ipinaliwanag ang “mga bagong buwan,” at iniwasan ang mga salitang nakatali sa isang partikular na denominasyon.
