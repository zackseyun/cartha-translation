revisions:
- from: 'Ang bahaging inilaan ng hari[a] mula sa sarili niyang mga ari-arian ay para sa mga handog na sinusunog: ang mga handog na sinusunog sa umaga at sa gabi[e], at ang mga handog na sinusunog para sa mga Sabbath, sa mga bagong buwan[b], at sa mga itinakdang kapistahan[c], ayon sa nakasulat sa Kautusan ni Yahweh.[d]'
  to: 'Ang bahagi ng hari[a], na nagmula sa sarili niyang mga ari-arian, ay para sa mga handog na sinusunog: ang mga handog na sinusunog sa umaga at sa gabi[e], at ang mga handog na sinusunog para sa mga araw ng Sabbath, sa mga bagong buwan[b], at sa mga itinakdang kapistahan[c], ayon sa nakasulat sa Kautusan ni Yahweh.[d]'
  rationale: Inayos ang unang parirala upang malinaw na ang tinutukoy ay bahagi ng hari at na ito ay nagmula sa kanyang sariling ari-arian. Pinalitan ang “mga Sabbath” ng “mga araw ng Sabbath” para sa mas natural na Filipino, nang walang pagbabago sa kahulugan o sa saklaw ng plural na Hebreo. Napanatili ang lahat ng umiiral na footnote anchor at tala.
