base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/002.yaml
  text: And Hezekiah appointed the divisions of the priests and the Levites according to their divisions[a], each man according to his service, both the priests and the Levites, for burnt offerings and peace offerings[c][b], to minister and to give thanks and to praise at the gates of the camps of Yahweh.
translation:
  language: tl
  text: Itinalaga ni Ezekias ang mga pangkat ng mga pari at mga Levita ayon sa kani-kanilang pangkat[a], ang bawat lalaki ayon sa kanyang tungkulin—kapwa ang mga pari at mga Levita—para sa mga handog na sinusunog at mga handog pangkapayapaan[b], upang maglingkod, magpasalamat, at magpuri sa mga pintuan ng mga kampo ni Yahweh.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga pangkat na nakatalaga sa takdang paglilingkod.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “mga handog ng pakikisalo.”
    reason: lexical_alternative
  - marker: c
    text: Sa Hebreo, “mga kampo ni Yahweh”; inuunawa naman ito ng ilan bilang “mga looban ni Yahweh.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעֲמֵד
  choice: Itinalaga
  rationale: Sa kontekstong administratibo ng pagsamba, tumutukoy ito sa opisyal na pag-aayos at pagtatalaga sa tungkulin, hindi lamang sa pagpapatayo sa isang lugar.
- source_word: מַחְלְקוֹת
  choice: mga pangkat
  rationale: Tumutukoy ito sa organisadong mga pangkat ng mga pari at Levita. Likas at malinaw sa modernong Tagalog ang “mga pangkat,” at pinananatili ang pag-uulit ng salita sa Hebreo.
- source_word: אִישׁ כְּפִי עֲבֹדָתוֹ
  choice: ang bawat lalaki ayon sa kanyang tungkulin
  rationale: Pinananatili ang panlalaking isahang pamamahagi sa Hebreo; ang tinutukoy sa kasaysayang kontekstong ito ay mga lalaking pari at Levita. Ang “tungkulin” ay natural na nagpapahayag ng nakatalagang paglilingkod.
- source_word: לְעֹלָה
  choice: para sa mga handog na sinusunog
  rationale: Ang isahang pangngalan sa Hebreo ay ginagamit bilang pangkalahatang katawagan sa paulit-ulit na uri ng handog; natural sa Tagalog ang maramihan dito.
- source_word: וְלִשְׁלָמִים
  choice: at mga handog para sa kapayapaan
  rationale: Direktang pinananatili nito ang tradisyonal na ugnayan ng katawagang sakripisyal sa kapayapaan, nang hindi nililimitahan ang kahulugan sa pakikisalo lamang.
- source_word: לְשָׁרֵת
  choice: upang maglingkod
  rationale: Malinaw at natural itong tumutukoy sa banal na paglilingkod sa templo nang hindi gumagamit ng katawagang maaaring magpahiwatig ng mas huling sistemang pansimbahan.
- source_word: וּלְהוֹדוֹת וּלְהַלֵּל
  choice: magpasalamat, at magpuri
  rationale: Sa konteksto ng pagsamba, ang ידה ay nagpapahayag ng pasasalamat; pinagtitibay ito ng kasunod na “magpuri.”
- source_word: בְּשַׁעֲרֵי מַחֲנוֹת יְהוָה
  choice: sa mga pintuan ng mga kampo ni Yahweh
  rationale: Pinananatili ang tahasang maramihang “mga kampo” at ang di-karaniwang larawan ng Hebreo sa halip na tahimik itong gawing “mga looban.”
theological_decisions:
- issue: Panlalaking isahang אִישׁ sa kontekstong pangpari at Levitico
  choice: ang bawat lalaki ayon sa kanyang tungkulin
  alternative: ang bawat isa ayon sa kanyang tungkulin
  rationale: Ang Hebreo ay tahasang panlalaking isahan, at ang mga opisyal na tinutukoy sa kontekstong ito ay mga lalaki; kaya hindi pinalalabo ang kasariang nasa pinagmulan.
- issue: Kahulugan ng שְׁלָמִים
  choice: mga handog para sa kapayapaan
  alternative: mga handog para sa pakikisalo
  rationale: Pinananatili ng pinili ang leksikal at teolohikal na lawak ng kategoryang sakripisyal at iniiwasang gawing tanging pakikisalo ang diwa nito.
- issue: Di-karaniwang pariralang מַחֲנוֹת יְהוָה
  choice: mga kampo ni Yahweh
  alternative: mga looban ni Yahweh
  rationale: Maramihan ang anyo sa Hebreo. Pinananatili ang tunay na di-pangkaraniwang larawan sa halip na lutasin ito sa mas interpretibong “mga looban.”
translation_notes:
  register: Modernong Filipino Tagalog na malinaw ngunit marangal. Pinanatili ang pag-uulit ng “mga pangkat,” ang tahasang panlalaking pagtukoy, ang pangalang Yahweh, at ang di-karaniwang maramihang “mga kampo.”
