base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/011.yaml
  text: Then Hezekiah commanded them to prepare chambers in the house of Yahweh[b][a], and they prepared them.
translation:
  language: tl
  text: Pagkatapos, iniutos[b] ni Hezekias na ihanda ang mga silid[a] sa bahay ni Yahweh, at inihanda nila ang mga iyon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga kuwarto” o “mga silid-imbakan.”
    reason: lexical_alternative
  - marker: b
    text: 'Sa literal: “sinabi.” Dito, ang pandiwang Hebreo ay nagpapahayag ng tagubilin ng hari.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: iniutos
  rationale: Literal itong “sinabi,” ngunit ang kasunod na infinitive na לְהָכִין ay naghahayag ng isang tagubilin ng hari. Likas sa Filipino ang “iniutos” sa kontekstong ito.
- source_word: יְחִזְקִיָּהוּ
  choice: Hezekias
  rationale: Ginamit ang nakaugaliang anyo ng pangalan sa mga saling Tagalog.
- source_word: לְהָכִין
  choice: ihanda
  rationale: Ang Hiphil ng כון dito ay nangangahulugang gawing handa o ihanda.
- source_word: לְשָׁכוֹת
  choice: mga silid
  rationale: Tumutukoy ito sa mga silid sa kompleks ng templo. Hindi tahasang sinasabi ng salita mismo na imbakan ang mga ito, kaya hindi iyon isinama sa pangunahing teksto.
- source_word: בְּבֵית יְהוָה
  choice: sa bahay ni Yahweh
  rationale: Pinananatili nito ang Hebreong paglalarawang “bahay ni Yahweh” sa halip na gawing tahasang “templo.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinalin ang Tetragrammaton bilang personal na pangalang Yahweh, hindi pinalitan ng isang titulo.
- source_word: וַיָּכִינוּ
  choice: at inihanda nila ang mga iyon
  rationale: Ang pandiwa ay maramihan at ang ipinahihiwatig na layon nito ay ang naunang “mga silid”; idinagdag ang “mga iyon” para sa likas at malinaw na Filipino.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehovah
  rationale: Tuwirang ginagamit sa Hebreo ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng titulo.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “silid” sa halip na mas kolokyal na “kuwarto,” at pinanatili ang Hebreong idyomang “bahay ni Yahweh.”
