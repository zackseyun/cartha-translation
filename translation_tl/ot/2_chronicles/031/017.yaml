base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/017.yaml
  text: The genealogical registration of the priests was by their fathers’ houses[a], and that of the Levites from twenty years old and upward[b], in their duties by their divisions.
translation:
  language: tl
  text: Ang pagpapatala ayon sa talaangkanan ng mga pari ay batay sa mga sambahayan ng kanilang mga ninuno[a]; gayundin ang sa mga Levita, mula sa edad na dalawampung taon pataas, ayon sa kanilang mga tungkulin sa kani-kanilang mga dibisyon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “mga sambahayan ng kanilang mga ninuno” ay mga pangkat ng magkakamag-anak ayon sa lahi ng ama na ginagamit sa opisyal na pagtatala at pag-oorganisa ng paglilingkod.
    reason: cultural_note
lexical_decisions:
- source_word: הִתְיַחֵשׂ
  choice: itinala ayon sa kanilang angkan
  rationale: Tumutukoy ang pandiwa sa pagpapatala batay sa talaangkanan o angkan. Ginawang tahasang pandiwa sa Filipino upang maging natural ang siksik at eliptikong pariralang Hebreo, habang ipinaliliwanag sa talababa ang alternatibong pagbasa.
- source_word: הַכֹּהֲנִים
  choice: ang mga pari
  rationale: Karaniwan at malinaw na salin para sa tiyak na pangkat ng mga pari.
- source_word: לְבֵית אֲבוֹתֵיהֶם
  choice: sa sambahayan ng kanilang mga ninuno
  rationale: Ang parirala ay tumutukoy sa mga pangkat ng magkakamag-anak ayon sa lahi ng ama na ginagamit sa opisyal na pagtatala at pag-oorganisa. Mas natural sa modernong Filipino ang 'mga ninuno' kaysa literal na 'mga ama.'
- source_word: וְהַלְוִיִּם
  choice: Ang mga Levita naman ... ay itinala
  rationale: Ipinagpapatuloy ng eliptikong Hebreo ang diwa ng pagpapatala mula sa unang sugnay. Inulit ang pandiwa sa Filipino para luminaw ang paralelismo.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וּלְמָעְלָה
  choice: na dalawampung taong gulang pataas
  rationale: Natural na Filipino para sa pormulang nagsasaad ng pinakamababang edad.
- source_word: בְּמִשְׁמְרוֹתֵיהֶם
  choice: ayon sa kanilang mga tungkulin
  rationale: Maaaring tumukoy ang pangngalan sa pananagutan, tungkulin, o takdang paglilingkod; saklaw ng 'mga tungkulin' ang kahulugan nang hindi nililimitahan sa pagbabantay.
- source_word: בְּמַחְלְקוֹתֵיהֶם
  choice: at mga pangkat
  rationale: Tumutukoy sa organisadong mga dibisyon o pangkat na pinaglilingkuran nila. Ang 'mga pangkat' ay malinaw at natural sa karaniwang Filipino.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang dalawang pangungusap at inulit ang 'itinala' upang maipahayag nang natural ang elipsis ng Hebreo. Pinanatili ang administratibong diwa nang hindi nagpapasok ng denominasyonal na paliwanag.
