revisions:
- from: Sumagot sa kanya si Azarias, ang punong pari[a] mula sa sambahayan ni Zadok, “Mula nang simulan nilang dalhin ang handog sa bahay ni Yahweh, nakakain kami at nabusog, at napakarami pa ang natira. Sapagkat pinagpala ni Yahweh ang kanyang bayan, at ang natira ay ang napakaraming ito.”
  to: Sumagot sa kanya si Azarias, ang punong pari[a] mula sa angkan ni Zadok, “Mula nang sinimulan nilang dalhin ang ambag sa bahay ni Yahweh, kumain kami at nabusog, at napakarami pa ang natira. Sapagkat pinagpala ni Yahweh ang kanyang bayan, at ang natira ay ang malaking kasaganaang ito.”
