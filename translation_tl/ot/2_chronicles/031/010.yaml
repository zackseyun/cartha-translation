  text: וַ/יֹּ֣אמֶר אֵלָ֗י/ו עֲזַרְיָ֧הוּ הַ/כֹּהֵ֛ן הָ/רֹ֖אשׁ לְ/בֵ֣ית צָד֑וֹק וַ֠/יֹּאמֶר מֵ/הָחֵ֨ל הַ/תְּרוּמָ֜ה לָ/בִ֣יא בֵית יְהוָ֗ה אָכ֨וֹל וְ/שָׂב֤וֹעַ וְ/הוֹתֵר֙ עַד לָ/ר֔וֹב כִּ֤י יְהוָה֙ בֵּרַ֣ךְ אֶת עַמּ֔/וֹ וְ/הַ/נּוֹתָ֖ר אֶת הֶ/הָמ֥וֹן הַ/זֶּֽה־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/010.yaml
  text: Azariah the chief priest[a], of the house of Zadok, said to him, “Since they began bringing the contribution into the house of Yahweh, we have eaten and been satisfied and have had plenty left over, for Yahweh has blessed his people; and what is left is this great abundance.”
translation:
  language: tl
  text: Sumagot sa kanya si Azarias, ang punong pari[a] mula sa angkan ni Zadok, “Mula nang sinimulan nilang dalhin ang ambag sa bahay ni Yahweh, kumain kami at nabusog, at napakarami pa ang natira. Sapagkat pinagpala ni Yahweh ang kanyang bayan, at ang natira ay ang malaking kasaganaang ito.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “paring pinuno.” Ang Hebreong salita para sa “ambag” ay maaari ring isaling “handog”; tumutukoy ito sa abuloy na ibinukod para sa banal na gamit.
    reason: Pinananatili ang alternatibong pagbasa para sa ranggong makapari at ipinapaliwanag ang mas tiyak na kahulugan ng ambag na inihandog para sa banal na gamit.
lexical_decisions:
- source_word: הַכֹּהֵן הָרֹאשׁ
  choice: ang punong pari
  rationale: Likas sa modernong Tagalog at pinananatili ang diwa ng nangungunang tungkuling makapari nang hindi ginagamit ang mas teknikal na titulong “pinakapunong pari.”
- source_word: לְבֵית צָדוֹק
  choice: mula sa sambahayan ni Zadok
  rationale: Ipinahahayag ang kaugnayang pampamilya at makapari; mas malinaw sa karaniwang mambabasa ang “sambahayan” kaysa literal na “bahay.”
- source_word: מֵהָחֵל
  choice: Mula nang simulan nilang
  rationale: Pinananatili ang panahong panimula na ipinahahayag ng מן kasunod ng infinitive.
- source_word: הַתְּרוּמָה
  choice: ang handog
  rationale: Tumutukoy sa ambag na ibinukod para sa banal na gamit. Natural at malinaw sa Tagalog ang “handog,” habang ipinaliliwanag sa talababa ang mas tiyak na diwa.
- source_word: לָבִיא בֵית יְהוָה
  choice: dalhin ang handog sa bahay ni Yahweh
  rationale: Natural na ipinahahayag sa Tagalog ang pagdadala patungo sa templo; ang “bahay ni Yahweh” ay nagpapanatili sa metapora ng Hebreo.
- source_word: אָכוֹל וְשָׂבוֹעַ
  choice: nakakain kami at nabusog
  rationale: Malinaw na ipinahahayag ang sama-samang karanasan ng pagkain at pagkakaroon ng sapat.
- source_word: וְהוֹתֵר עַד לָרֹב
  choice: at napakarami pa ang natira
  rationale: Pinananatili ang matinding diwa ng labis na natira sa natural na ayos ng Tagalog.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat ang personal na banal na pangalan sa halip na palitan ito ng isang titulo.
- source_word: בֵּרַךְ אֶת עַמּוֹ
  choice: pinagpala ni Yahweh ang kanyang bayan
  rationale: Pinananatili ang paliwanag na ang kasaganaan ay bunga ng pagpapala ni Yahweh.
- source_word: וְהַנּוֹתָר אֶת הֶהָמוֹן הַזֶּה
  choice: at ang natira ay ang napakaraming ito
  rationale: Pinananatili ang bahagyang di-karaniwang konstruksiyon at ang diin sa nakikitang malaking bunton o dami ng sobrang panustos.
theological_decisions:
- issue: Paglalarawan sa nangungunang tungkuling makapari ni Azarias
  choice: punong pari
  alternative: pinakapunong pari
  rationale: Ang Hebreo ay literal na “paring pinuno”; ang “punong pari” ay nagpapanatili sa ranggo nang hindi sapilitang ipinapantay sa isang mas teknikal na titulo.
- issue: Pagsasalin ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Ginagamit ng talata ang Tetragrammaton bilang personal na pangalan; pinananatili ito bilang “Yahweh” sa halip na palitan ng titulo.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “sambahayan” para sa angkan ni Zadok at “bahay ni Yahweh” para mapanatili ang konkretong katawagan sa templo. Ang pangungusap sa dulo ay sadyang nagpapanatili ng diin at bahagyang tensiyon ng Hebreong konstruksiyon.
