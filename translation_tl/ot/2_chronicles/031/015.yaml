base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/015.yaml
  text: Under his authority were Eden[a], Miniamin, Jeshua, Shemaiah, Amariah, and Shecaniah, in the cities of the priests, faithfully to distribute to their brothers by divisions[c][b], to great and small alike.
translation:
  language: tl
  text: Sa ilalim ng kanyang pangangasiwa ay sina Eden[a], Miniamin, Jesua, Semaias, Amarias, at Secanias, na nasa mga lunsod ng mga pari upang buong katapatang mamahagi sa kanilang mga kapatid[b] ayon sa mga pangkat[c], sa malaki man o maliit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “kasama niya” o “nasa ilalim ng kanyang pananagutan.” Ang idyomang Hebreo ay maaaring magpahayag ng pagkilos sa pamamagitan ng isang tao, pangangasiwa, o awtoridad.
    reason: lexical_alternative
  - marker: b
    text: Ang “kanilang mga kapatid” ay tumutukoy sa kapwa nila kasapi ng pamayanan ng mga pari.
    reason: cultural_note
  - marker: c
    text: Maaari ring “ayon sa mga hati ng paglilingkod.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל־יָדוֹ
  choice: Sa ilalim ng kanyang pamamahala
  rationale: Ipinahahayag ng idyomang Hebreo ang pangangasiwa o awtoridad sa kontekstong administratibo, habang pinananatili sa talababa ang ibang posibleng diwa.
- source_word: עֵדֶן וּמִנְיָמִן וְיֵשׁוּעַ וּשְׁמַעְיָהוּ אֲמַרְיָהוּ וּשְׁכַנְיָהוּ
  choice: Eden, Miniamin, Jesua, Semaias, Amarias, at Secanias
  rationale: Isinalin sa karaniwang anyong Filipino ang mga pangalang pantangi, alinsunod sa nakaugaliang baybay sa tradisyong biblikal na Tagalog.
- source_word: בְּעָרֵי הַכֹּהֲנִים
  choice: Sa mga lunsod ng mga pari
  rationale: Tuwirang pinananatili ang ugnayang genitibo ng Hebreo sa natural na Tagalog.
- source_word: בֶּאֱמוּנָה
  choice: buong katapatan
  rationale: Sa administratibong konteksto, inilalarawan nito ang mapagkakatiwalaang paraan ng pagtupad sa tungkulin.
- source_word: לָתֵת
  choice: ipinamahagi
  rationale: Bagaman literal na 'magbigay,' ipinahihiwatig ng konteksto ang organisadong pamamahagi ng mga takdang bahagi.
- source_word: לַאֲחֵיהֶם
  choice: sa kanilang mga kapatid
  rationale: Pinananatili ang literal na ugnayang magkakapatid; nililinaw sa talababa na tumutukoy ito sa mga kapwa kasapi ng pamayanang makasaserdote.
- source_word: בְּמַחְלְקוֹת
  choice: ayon sa mga pangkat
  rationale: Tumutukoy ang salita sa mga organisado at takdang pangkat o hati ng paglilingkod.
- source_word: כַּגָּדוֹל כַּקָּטָן
  choice: maging sa nakatataas o nakabababa
  rationale: Pinananatili ang saklaw ng idyoma nang hindi nililimitahan sa edad lamang; maaari itong tumukoy sa katayuan o ranggo.
theological_decisions:
- issue: Saklaw ng כַּגָּדוֹל כַּקָּטָן
  choice: maging sa nakatataas o nakabababa
  alternative: maging sa matanda o bata
  rationale: Maaaring tumukoy ang pares sa ranggo, katayuan, laki, o edad. Sa kontekstong administratibo, mas ligtas na huwag itong paliitin sa edad lamang.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Gumamit ng ‘lunsod’ at ‘pari’ bilang pamilyar na bokabularyong biblikal, at hinati sa dalawang pangungusap upang maging malinaw ang ugnayang sintaktiko nang hindi binabago ang nilalaman.
