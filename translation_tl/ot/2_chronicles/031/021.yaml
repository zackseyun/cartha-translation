base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/021.yaml
  text: And in every work that he began in the service of the house of God[a], and in the law and the commandment, seeking his God with all his heart[c][b], he did and prospered.
translation:
  language: tl
  text: At sa bawat gawaing sinimulan niya sa paglilingkod sa bahay ng Diyos, at sa Kautusan[a] at sa utos, upang hanapin[b] ang kanyang Diyos nang buong puso, ginawa niya ito at nagtagumpay[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “turo.” Ang Hebreong torah ay maaaring mangahulugang kautusan o turo.
    reason: lexical_alternative
  - marker: b
    text: O “sumangguni sa kanyang Diyos.” Maaaring mangahulugan ang pandiwang Hebreo ng paghahanap o pagsangguni/pagtatanong.
    reason: lexical_alternative
  - marker: c
    text: O “umunlad.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְכָל מַעֲשֶׂה
  choice: At sa bawat gawain
  rationale: Ang מַעֲשֶׂה ay maaaring tumukoy sa gawa, gawain, o aktibidad. Likas sa modernong Tagalog ang “bawat gawain” sa kontekstong ito.
- source_word: אֲשֶׁר הֵחֵל
  choice: sinimulan niya
  rationale: Tuwirang inililipat ang karaniwang kahulugan ng Hiphil na הֵחֵל, “magsimula.”
- source_word: בַּעֲבוֹדַת בֵּית הָאֱלֹהִים
  choice: para sa paglilingkod sa bahay ng Diyos
  rationale: Saklaw ng עֲבוֹדָה ang paglilingkod at paggawa kaugnay ng templo; hindi ito nililimitahan sa ritwal ng mga pari.
- source_word: וּבַתּוֹרָה
  choice: at tungkol sa Kautusan
  rationale: Sa konteksto ng mga reporma ni Hezekias, tumutukoy ang תּוֹרָה lalo na sa tipanang Kautusan, habang pinananatili sa talababa ang lehitimong diwang “turo.”
- source_word: וּבַמִּצְוָה
  choice: at sa utos
  rationale: Pinananatili ang anyong isahan ng מִצְוָה; maaari itong may kolektibong diwa ngunit malinaw pa rin bilang “utos.”
- source_word: לִדְרֹשׁ לֵאלֹהָיו
  choice: upang hanapin ang kanyang Diyos
  rationale: Mahalagang motibo sa Mga Cronica ang דרשׁ bilang buong-pusong paghahanap sa Diyos; maaari rin itong mangahulugang sumangguni o magtanong sa kanya.
- source_word: בְּכָל לְבָבוֹ
  choice: nang buong puso
  rationale: Natural na katumbas sa Tagalog ng idyomang nagsasaad ng lubos at taimtim na debosyon.
- source_word: עָשָׂה
  choice: ginawa niya iyon
  rationale: Ang “iyon” ay natural na pantukoy pabalik sa bawat gawaing sinimulan niya at malinaw na naghahatid sa payak na pandiwang עָשָׂה.
- source_word: וְהִצְלִיחַ
  choice: at nagtagumpay
  rationale: Sa konteksto, ang Hiphil ng צלח ay may intransitibong diwang “magtagumpay” o “umunlad”; mas tuwiran at natural dito ang “nagtagumpay.”
theological_decisions:
- issue: Kahulugan ng תּוֹרָה sa konteksto ng reporma
  choice: Kautusan
  alternative: turo
  rationale: Binibigyang-diin ng konteksto ang pagsunod sa tipanang Kautusan, ngunit hindi itinatanggi ang mas malawak na leksikal na diwang “turo,” kaya inilagay iyon sa talababa.
- issue: Kahulugan ng לִדְרֹשׁ אֱלֹהִים
  choice: hanapin ang kanyang Diyos
  alternative: sumangguni sa kanyang Diyos
  rationale: Pinananatili ng “hanapin” ang paulit-ulit na teolohikal na motibo sa Mga Cronica nang hindi inaalis ang posibilidad ng pagsangguni o pagtatanong.
- issue: Pagkakaugnay ng בְּכָל לְבָבוֹ
  choice: Iniugnay sa paghahanap sa Diyos
  alternative: Iugnay sa paggawa ng gawain
  rationale: Ang pinakamalapit na pariralang לִדְרֹשׁ לֵאלֹהָיו ang natural na inuugnayan nito, bagaman may kaunting sintaktikong puwang para marinig itong sumasaklaw sa buong pagkilos.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “bahay ng Diyos” upang mapanatili ang larawan ng Hebreo, at ang “Kautusan” bilang kinikilalang katawagan sa tipanang Torah. Inilagay ang mga panandang talababa sa mismong mga salitang may leksikal na alternatibo.
