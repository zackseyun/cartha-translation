  - severity: low
    issue: “tungkol sa Kautusan”
    rationale: Ang וּבַתּוֹרָה ay mas tuwirang “at sa Kautusan.” Ang “tungkol sa” ay posibleng tama sa maluwag na pakahulugan ngunit bahagyang nagpapalabo sa paralelong pag-uugnay ng paglilingkod, Kautusan, at utos.
