reference: 2 Chronicles 1:3
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יֵּלְכ֗וּ שְׁלֹמֹה֙ וְ/כָל הַ/קָּהָ֣ל עִמּ֔/וֹ לַ/בָּמָ֖ה אֲשֶׁ֣ר בְּ/גִבְע֑וֹן כִּי שָׁ֣ם הָיָ֗ה אֹ֤הֶל מוֹעֵד֙ הָֽ/אֱלֹהִ֔ים אֲשֶׁ֥ר עָשָׂ֛ה מֹשֶׁ֥ה עֶֽבֶד יְהוָ֖ה בַּ/מִּדְבָּֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/003.yaml
  text: So Solomon and all the assembly with him went to the high place that was at Gibeon[a], because the tent of meeting of God was there, which Moses the servant of Yahweh had made in the wilderness.
translation:
  language: tl
  text: Pumunta si Solomon at ang buong kapulungan na kasama niya sa mataas na lugar sa Gibeon,[a] dahil naroon ang tolda ng pakikipagtagpo ng Diyos, na ginawa ni Moises, na lingkod ni Yahweh, sa ilang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “sapagkat naroon ang tolda ng pakikipagtagpo ng Diyos.”
    reason: Ipinapakita ang alternatibong pang-ugnay na pagsasalin ng כִּי bilang paliwanag o dahilan.
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: pumunta
  rationale: Ipinapahayag ng wayyiqtol ng הלך ang kasunod na pangunahing kilos sa salaysay. Natural sa makabagong Tagalog ang “pumunta” at hindi ito nagdaragdag ng direksiyong hindi tahasang nasa pandiwa.
- source_word: הַקָּהָל
  choice: buong kapulungan
  rationale: Ang קהל ay tumutukoy sa sambayanang nagkatipon. Ang “kapulungan” ay marangal ngunit nauunawaan pa rin sa kasalukuyang Tagalog; ipinapakita ng “buong” ang כָל.
- source_word: עִמּוֹ
  choice: kasama niya
  rationale: Tuwirang ipinapahayag ang pakikisama ng kapulungan kay Solomon.
- source_word: לַבָּמָה
  choice: sa mataas na lugar
  rationale: Karaniwang tumutukoy ang במה sa isang mataas na lugar na ginagamit sa pagsamba. Pinananatili ng salin ang anyong ito nang hindi agad hinahatulan ang lugar bilang ilegal o idolatroso.
- source_word: בְּגִבְעוֹן
  choice: sa Gibeon
  rationale: Likas na panandang panlunan sa Tagalog ang “sa,” at pinanatili ang pangalang Gibeon sa transliterasyon.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala nito ang dahilan ng pagpunta nila sa Gibeon. Malinaw at marangal sa Tagalog ang “sapagkat”; maaari ring ipahayag bilang “dahil.”
- source_word: אֹהֶל מוֹעֵד
  choice: tolda ng pakikipagtagpo
  rationale: Tapat itong nagpapahayag sa toldang itinakdang lugar ng pakikipagtagpo. Iniwasan ang “tolda ng tipanan,” na maaaring magpasok ng ideya ng covenant na wala sa mismong pariralang מוֹעֵד.
- source_word: הָאֱלֹהִים
  choice: ng Diyos
  rationale: 'Tuwirang pinananatili ang ugnayang construct: ang tolda ng pakikipagtagpo ay sa Diyos.'
- source_word: עָשָׂה
  choice: ginawa
  rationale: Ang simpleng “ginawa” ay sapat sa Tagalog upang tukuyin ang naunang pagkakagawa ni Moises sa tolda; hindi kailangan ang hiwalay na anyong past perfect.
- source_word: עֶבֶד יְהוָה
  choice: lingkod ni Yahweh
  rationale: Dito, ang עֶבֶד ay isang marangal na katawagan kay Moises bilang tapat na naglilingkod kay Yahweh; mas angkop ang “lingkod” kaysa “alipin.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinalin ang Tetragrammaton bilang personal na pangalang “Yahweh” sa halip na palitan ito ng titulong “Panginoon.”
- source_word: בַּמִּדְבָּר
  choice: sa ilang
  rationale: Ang “ilang” ay maikli, natural, at tradisyonal na salin ng מִדְבָּר sa salaysay tungkol sa paglalakbay ng Israel.
theological_decisions:
- issue: Ang במה sa konteksto ng pagsamba bago maitayo ang templo
  choice: mataas na lugar
  alternative: dambana sa mataas na lugar
  rationale: 'Pinananatili ang leksikal at teolohikal na tensiyon: ang termino ay maaaring gamitin sa ibang konteksto para sa mga sinasaway na sambahan, ngunit dito naroon ang tolda ng pakikipagtagpo. Hindi nagdagdag ang salin ng negatibong paghatol na wala sa talata.'
- issue: Ang banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Personal na pangalan ang nasa tekstong Hebreo, kaya pinanatili ito bilang “Yahweh” sa halip na palitan ng isang titulo.
- issue: Ang kahulugan ng אֹהֶל מוֹעֵד
  choice: tolda ng pakikipagtagpo
  alternative: Tabernakulo; tolda ng tipanan
  rationale: Mas malinaw na sinasalamin ng “pakikipagtagpo” ang מוֹעֵד at hindi nito ipinapalit ang konsepto ng tipan o ang mas teknikal na salitang “tabernakulo.”
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino Tagalog. Ginamit ang “kapulungan,” “tolda ng pakikipagtagpo,” at “ilang” bilang madaling maunawaang mga salitang angkop sa salaysay ng Kasulatan. Pinanatili ang “mataas na lugar” nang walang idinagdag na negatibong paghuhusga.
