  yaml_path: translation/ot/2_chronicles/001/007.yaml
  text: That night God appeared to Solomon and said to him[a], “Ask what I should give you.”
translation:
  language: tl
  text: Nang gabing iyon, nagpakita ang Diyos kay Solomon at sinabi sa kanya, “Hilingin mo kung ano ang ibibigay ko sa iyo.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּלַּיְלָה הַהוּא
  choice: Nang gabing iyon
  rationale: Likas na pagpapahayag sa makabagong Filipino ng tiyak na panahong tinutukoy ng pariralang Hebreo.
- source_word: נִרְאָה
  choice: nagpakita
  rationale: Tuwirang ipinapahayag ang paglitaw ng Diyos kay Solomon nang hindi idinaragdag ang interpretatibong diwang “ipinahayag ang sarili.”
- source_word: אֱלֹהִים
  choice: ang Diyos
  rationale: Isahan ang pandiwang kaakibat nito at ang tinutukoy sa salaysay ay ang nag-iisang Diyos.
- source_word: לִשְׁלֹמֹה
  choice: kay Solomon
  rationale: Ang לְ ay nagmamarka sa taong pinagpakitaan; “kay Solomon” ang likas na katumbas sa Filipino.
- source_word: וַיֹּאמֶר לוֹ
  choice: at sinabi sa kanya
  rationale: Malapit sa anyong Hebreo at natural sa kasalukuyang Filipino.
- source_word: שְׁאַל
  choice: Humiling ka
  rationale: Sa kontekstong ang hinihingi ay isang bagay o kaloob, mas malinaw at natural ang “humiling” kaysa sa pangkalahatang “magtanong.”
- source_word: מָה אֶתֶּן לָךְ
  choice: kung ano ang ibibigay ko sa iyo
  rationale: Pinananatili ang bukás na paanyaya at ang literal na diwa ng “ano ang ibibigay ko sa iyo,” habang natural na ikinakabit sa pandiwang “humiling.”
theological_decisions:
- issue: Pagpapakahulugan sa אֱלֹהִים sa konteksto ng pagpapakita ng Diyos
  choice: ang Diyos
  alternative: mga diyos
  rationale: Tiyak ang isahang tinutukoy dahil isahan ang pandiwa at gayon din ang konteksto ng salaysay; hindi kailangan ng dagdag na doktrinal na paglilinaw.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Humiling ka” upang maging natural ang utos sa konteksto ng isang kaloob, at iniwasan ang mas lumang anyong “hingin mo kung ano ang ibibigay ko sa iyo.”
