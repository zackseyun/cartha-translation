base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/018.yaml
  text: And Solomon said to build a house for the name of Yahweh[b][a], and a house for his kingdom.
translation:
  language: tl
  text: Nagpasya si Solomon na magtayo ng isang bahay para sa pangalan ni Yahweh[a], at ng isang bahay para sa kaniyang kaharian.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa mas literal na Hebreo, “Sinabi ni Solomon na magtayo.” Maaari rin itong unawain na ipinasiya o ipinag-utos niyang magtayo.
    reason: lexical_alternative
  - marker: b
    text: Iisang salitang Hebreo na nangangahulugang “bahay” ang ginamit para sa dalawang gusali. Sa konteksto, maaari itong isalin na “isang templo para sa pangalan ni Yahweh, at isang palasyo para sa kaniyang kaharian.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Nagpasya
  rationale: Bagaman karaniwang nangangahulugang “sinabi” ang pandiwa, ang pagkakasunod nito sa pawatas na לִבְנוֹת (“magtayo”) ay maaaring magpahayag ng pasiya o layunin. Ang “nagpasya” ay natural sa Tagalog at iniiwasan ang malabong “sinabi na magtayo,” habang itinatala sa talababa ang mas literal na pagbasa.
- source_word: לִבְנוֹת
  choice: na magtayo
  rationale: Tuwirang ipinapahayag ang kilos ng pagtatayo at natural na sumusunod sa “nagpasya” sa Tagalog.
- source_word: בַּיִת ... וּבַיִת
  choice: isang bahay ... isang bahay
  rationale: Pinananatili ang sinadyang pag-uulit ng iisang salitang Hebreo. Sa konteksto, ang una ay templo at ang ikalawa ay palasyo, ngunit hindi ipinapalit sa pangunahing teksto ang dalawang mas tiyak na katawagan.
- source_word: לְשֵׁם יְהוָה
  choice: para sa pangalan ni Yahweh
  rationale: Pinananatili ang mahalagang pormulang teolohikal na inuugnay ang gusali sa pangalan ni Yahweh, nang hindi ipinahihiwatig na nakukulong ang Diyos sa gusali.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin sa titik ang personal na pangalang nasa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: לְמַלְכוּתוֹ
  choice: para sa kaniyang kaharian
  rationale: Ang מַלְכוּת ay maaaring tumukoy sa kaharian, paghahari, o pagiging hari. Ang “kaniyang kaharian” ang pinakamalapit at natural na katumbas dito, bagaman ang gusali ay malinaw na may tungkuling maharlika.
theological_decisions:
- issue: Pormula tungkol sa templo at sa banal na pangalan
  choice: para sa pangalan ni Yahweh
  alternative: para kay Yahweh / bilang parangal kay Yahweh
  rationale: Pinananatili ng pangunahing salin ang mismong idyomang Hebreo at ang teolohikal na diin nito sa pangalan ni Yahweh.
- issue: Pagpapakahulugan sa dalawang paglitaw ng בַּיִת
  choice: bahay ... bahay
  alternative: templo ... palasyo
  rationale: Ang pag-uulit ay nasa pinagmulang teksto at dapat manatiling nakikita. Ibinibigay sa talababa ang mas malinaw na kontekstuwal na kahulugan.
- issue: Lakas ng וַיֹּאמֶר bago ang pawatas
  choice: Nagpasya
  alternative: Sinabi / ipinag-utos
  rationale: Hindi tahasang tinutukoy ng Hebreo kung simpleng pagsasalita, pagpapasiya, o pag-uutos ang ibig sabihin. Pinili ang natural na kontekstuwal na “nagpasya,” ngunit pinananatili sa talababa ang mas literal at iba pang posibleng pagbasa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kaniyang” upang mapanatili ang pormal na himig at malinaw na tukuyin si Solomon. Pinanatili ang pag-uulit ng “bahay” bilang mahalagang katangian ng Hebreo, samantalang ipinaliwanag sa talababa ang “templo” at “palasyo.”
