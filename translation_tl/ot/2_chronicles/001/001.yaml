base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/001.yaml
  text: And Solomon son of David strengthened himself over his kingdom[b][a], and Yahweh his God was with him and made him exceedingly great.
translation:
  language: tl
  text: Naging matatag si Solomon na anak ni David sa kanyang paghahari,[a] at si Yahweh[b] na kanyang Diyos ay sumakaniya at ginawa siyang lubhang dakila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “lumakas sa kanyang paghahari,” “pinatatag ang sarili sa kanyang paghahari,” o “naitatag sa kanyang paghahari.”
    reason: lexical_alternative
  - marker: b
    text: Ang “Yahweh” ay pagsasatitik ng banal na pangalang Hebreo na YHWH, na tradisyonal na isinasaling “ang PANGINOON.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּתְחַזֵּק
  choice: naging matatag
  rationale: Ang Hitpael ng חזק ay maaaring reflexive o intransitive. Pinananatili ng “naging matatag” ang diwa ng paglakas o pagkakatatag nang hindi tiyak na ipinapakahulugang siya lamang ang aktibong nagtatag sa sarili niya.
- source_word: עַל מַלְכוּתוֹ
  choice: sa pamamahala sa kanyang kaharian
  rationale: Ipinahihiwatig ng עַל kasama ng מַלְכוּת ang paghahari o awtoridad sa kaharian. Mas natural ito sa modernong Tagalog kaysa sa literal na “sa ibabaw ng kanyang kaharian,” habang pinananatili ang saklaw ng kanyang pamumuno.
- source_word: בֶן דָּוִיד
  choice: anak ni David
  rationale: Tuwirang salin ng katawagang pampamilya at dinastiko.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasatitik nito ang banal na pangalang YHWH sa halip na palitan iyon ng isang titulo.
- source_word: אֱלֹהָיו
  choice: kanyang Diyos
  rationale: Pinananatili ang payak na anyong paari at ang personal na ugnayang ipinahihiwatig nito.
- source_word: עִמּוֹ
  choice: sumakanya
  rationale: Natural at marangal na idyomang Tagalog para sa presensya at pagtulong ng Diyos; katumbas ng “kasama niya.”
- source_word: וַיְגַדְּלֵהוּ
  choice: ginawa siyang ... dakila
  rationale: 'Pinananatili ang causative na diwa ng Piel: si Yahweh ang gumawa kay Solomon na dakila.'
- source_word: לְמָעְלָה
  choice: lubhang
  rationale: Ginagamit dito ang salita bilang panidhi, kaya malinaw na ipinahahayag ng “lubhang” ang mataas na antas ng pagdakila.
theological_decisions:
- issue: Paglalahad ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehova
  rationale: Pangalan mismo na YHWH ang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng titulong “PANGINOON.”
- issue: Ang papel ni Solomon at ng Diyos sa kanyang paglakas
  choice: Panatilihin kapwa ang pagiging matatag ni Solomon at ang aktibong pagdakila sa kanya ni Yahweh
  alternative: Isaling pasibo ang unang sugnay bilang “pinatatag si Solomon,” o ipakahulugang lubos na “itinatag niya ang sarili”
  rationale: Inilalahad ng Hebreo ang paglakas o pagkakatatag ni Solomon at, kasabay nito, ang presensya at pagkilos ni Yahweh. Hindi nilulutas ng salin ang tensiyon sa pamamagitan ng pag-uukol ng buong pagkilos sa isa lamang.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “naging matatag” upang maiwasan ang di-natural na literalismo at mapanatili ang saklaw ng Hitpael; ginamit ang “sumakanya” bilang maikli at biblikal ngunit nauunawaang pahayag ng banal na presensya.
