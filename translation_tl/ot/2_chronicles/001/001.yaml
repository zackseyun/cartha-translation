  to: Naging matatag si Solomon na anak ni David sa kanyang paghahari,[a] at si Yahweh[b] na kanyang Diyos ay sumakaniya at ginawa siyang lubhang dakila.
  rationale: Pinalitan ang hindi idiomatikong “sa pamamahala sa kanyang kaharian” ng “sa kanyang paghahari.” Pinananatili nito ang kaugnayan ng paglakas ni Solomon sa kanyang maharlikang pamumuno at hindi nito ipinipilit kung siya ba mismo ang kumilos upang patatagin ang sarili o siya ay naging matatag. Inayos din sa “sumakaniya” ang baybay ng panghalip na nakakabit sa pandiwa.
