  naturalness: Natural at angkop ang register sa kabuuan. Mas malinaw at mas idiomatiko sa modernong Tagalog ang “sa isang halaga” kaysa “kapalit ng bayad.”
  terminology: Ang Ehipto, Solomon, Kue, at “mga mangangalakal ng hari” ay angkop. Pinanatili ang Kue nang walang dogmatikong pagpapasya, at malinaw na inilalahad ng mga talababa ang alternatibong leksikal na pag-unawa.
