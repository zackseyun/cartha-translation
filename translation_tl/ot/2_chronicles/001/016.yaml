  to: Ang pinagmulan ng mga kabayo ni Solomon ay Ehipto at Kue[a], at kinukuha ng mga mangangalakal ng hari ang mga ito mula sa Kue sa isang halaga.[b]
  rationale: Pinalitan ang “kapalit ng bayad” ng “sa isang halaga” upang tumpak na maihatid ang בִּמְחִיר nang hindi nagdaragdag o nagdodoble ng kahulugan. Inayos din ang katumbas na pananalita sa talababa b upang huwag magpahiwatig na ang presyo ay nakatakda. Walang ibang pagbabagong ginawa sa pangunahing pagbasa o sa maingat na pagpreserba ng leksikal na kalabuan ng מִקְוֵא.
