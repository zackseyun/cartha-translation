base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/016.yaml
  text: And the source of Solomon’s horses was Egypt and Kue[b][a], and the king’s merchants would obtain them from Kue for a price.
translation:
  language: tl
  text: Ang pinagmulan ng mga kabayo ni Solomon ay Ehipto at Kue[a], at kinukuha ng mga mangangalakal ng hari ang mga ito mula sa Kue sa isang halaga.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “at mula sa isang tipunan o imbakan.” Mahirap unawain ang salitang Hebreo na מִקְוֵא, at maaari rin itong ituring na karaniwang pangngalan sa halip na pangalan ng lugar na Kue.
    reason: alternative_reading
  - marker: b
    text: O “binibili ng mga mangangalakal ng hari ang mga ito mula sa isang imbakan sa isang halaga.” Ito ay batay sa pag-unawa sa מִקְוֵא bilang lugar ng pagtitipon o imbakan, hindi bilang pangalang heograpiko.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמוֹצָא
  choice: Ang pinagmulan
  rationale: Maaaring tumukoy ang מוֹצָא sa pinanggalingan o pinagmulan. Sa konteksto ng kalakalan, malinaw ito nang hindi dinaragdagan ang teksto ng tiyak na ideya ng pag-aangkat.
- source_word: הַסּוּסִים אֲשֶׁר לִשְׁלֹמֹה
  choice: ng mga kabayo ni Solomon
  rationale: Likas na pahayag sa modernong Tagalog para sa mga kabayong nauugnay o pag-aari ni Solomon.
- source_word: מִמִּצְרָיִם
  choice: Ehipto
  rationale: Karaniwang pangalang Tagalog para sa Egypt.
- source_word: וּמִקְוֵא
  choice: at Kue
  rationale: Itinuturing ang mahirap na anyong מִקְוֵא bilang pangalan ng lugar, malamang na Kue sa rehiyon ng Cilicia, kasabay ng Ehipto bilang pinagmulan.
- source_word: סֹחֲרֵי הַמֶּלֶךְ
  choice: mga mangangalakal ng hari
  rationale: Tumpak at natural na salin ng substantibong participle para sa mga trader o merchant ng hari.
- source_word: יִקְחוּ
  choice: kinukuha
  rationale: Pinananatili ang malawak na diwa ng לקח na ‘kumuha’ sa komersiyal na konteksto, nang hindi tahasang ginagawang ‘binibili’ ang pandiwa.
- source_word: בִּמְחִיר
  choice: kapalit ng bayad
  rationale: Ipinahahayag ang transaksiyonal na diwa ng parirala sa natural na Tagalog.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Pinanatili ang Kue bilang pangunahing pagbasa, habang inilalahad sa mga talababa ang tunay na leksikal na kalabuan. Inilagay ang bawat panandang talababa sa pangunahing teksto.
