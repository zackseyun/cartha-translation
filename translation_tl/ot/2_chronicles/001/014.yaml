translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “karwahe” bilang pamilyar na terminong biblikal at “mangangabayo” bilang tumpak at madaling maunawaang tawag sa mga nakasakay sa kabayo. Hinati sa tatlong pangungusap para sa likas na daloy at pagbasa.
