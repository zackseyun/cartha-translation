base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/014.yaml
  text: And Solomon gathered chariots and horsemen[a], and he had 1,400 chariots and 12,000 horsemen[b]; and he stationed them in the chariot cities and with the king in Jerusalem.
translation:
  language: tl
  text: Nagtipon si Solomon ng mga karwahe at mga mangangabayo[a]. Mayroon siyang 1,400 karwahe at 12,000 mangangabayo. Inilagay niya ang mga ito sa mga lungsod na himpilan ng mga karwahe[b] at kasama ng hari sa Jerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kabalyerya.” Ang salitang Hebreo ay tumutukoy sa mga nakasakay sa kabayo; mas literal ang “mga mangangabayo.”
    reason: lexical_alternative
  - marker: b
    text: Ibig sabihin, mga lungsod na itinakdang maging himpilan o paglagakan ng mga karwahe.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֶּאֱסֹף
  choice: Nagtipon
  rationale: Karaniwan itong nangangahulugang magtipon o mangolekta; likas sa Filipino ang “nagtipon” para sa pag-iipon ng mga kagamitang at tauhang militar.
- source_word: רֶכֶב
  choice: mga karwahe
  rationale: Bagaman maaari itong tumukoy nang kolektibo sa hukbo ng mga karwahe, tahasang binibilang ang mga ito rito, kaya ang konkretong pangmaramihang “mga karwahe” ang pinakamalinaw.
- source_word: פָּרָשִׁים
  choice: mga mangangabayo
  rationale: Ang salita ay karaniwang tumutukoy sa mga nakasakay o mandirigmang nakasakay sa kabayo, hindi lamang sa mga kabayo.
- source_word: וַיְהִי לוֹ
  choice: Mayroon siyang
  rationale: Ito ang likas na salin sa Filipino ng Hebreong idyoma na literal na “nagkaroon para sa kaniya,” at malinaw na ipinapahayag ang pag-aari.
- source_word: וַיַּנִּיחֵם
  choice: Inilagay niya ang mga ito
  rationale: Ipinahihiwatig ng causative verb ang paglalagay sa itinakdang kinalalagyan. Hindi nililimitahan ng “inilagay” ang panghalip sa mga tao lamang at maaari nitong saklawin kapuwa ang mga karwahe at mangangabayo.
- source_word: בְּעָרֵי הָרֶכֶב
  choice: sa mga lungsod na himpilan ng mga karwahe
  rationale: Nililinaw nito sa natural na Filipino na ang mga lungsod ay mga itinakdang lugar para sa paglalagak o paggarison ng mga karwahe, sa halip na gumamit ng malabong literal na “mga lungsod ng karwahe.”
- source_word: וְעִם הַמֶּלֶךְ
  choice: at sa piling ng hari
  rationale: Pinananatili nito ang payak na Hebreong “kasama ng hari” nang hindi idinaragdag ang ipinahihiwatig ngunit hindi tahasang sinasabing “ang ilan.”
- source_word: בִּירוּשָׁלִָם
  choice: sa Jerusalem
  rationale: Pamantayang anyo ng pangalan at pang-ukol sa Filipino.
