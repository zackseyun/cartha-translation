  text: וַ/יַּעַל֩ שְׁלֹמֹ֨ה שָׁ֜ם עַל מִזְבַּ֤ח הַ/נְּחֹ֨שֶׁת֙ לִ/פְנֵ֣י יְהוָ֔ה אֲשֶׁ֖ר לְ/אֹ֣הֶל מוֹעֵ֑ד וַ/יַּ֧עַל עָלָ֛י/ו עֹל֖וֹת אָֽלֶף־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/006.yaml
  text: And Solomon went up there to the bronze altar before Yahweh[a], which was at the tent of meeting, and offered on it a thousand burnt offerings.
translation:
  language: tl
  text: Umakyat doon si Solomon sa tansong altar sa harap ni Yahweh[a], na nasa may toldang tipanan, at naghandog siya roon ng isang libong handog na sinusunog.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: יהוה (YHWH), ang personal na pangalan ng Diyos; karaniwang isinasalin din itong “ang PANGINOON.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַל ... שָׁם
  choice: Umakyat doon
  rationale: Pinananatili ang direksiyonal na diwa ng עלה at ang pagtukoy ng שָׁם sa lugar na nabanggit sa konteksto.
- source_word: מִזְבַּח הַנְּחֹשֶׁת
  choice: tansong altar
  rationale: Ang “tanso” ay natural at tradisyonal na katumbas sa Filipino para sa נְחֹשֶׁת sa kontekstong ito, bagaman maaaring tumukoy ang salita sa copper o bronze.
- source_word: לִפְנֵי יְהוָה
  choice: sa harap ni Yahweh
  rationale: Tuwirang ipinapahayag ang posisyon o presensiya sa harap ni Yahweh at pinananatili ang personal na pangalang nasa Hebreo.
- source_word: אֲשֶׁר לְאֹהֶל מוֹעֵד
  choice: na nasa toldang tipanan
  rationale: Unawain ang לְ bilang lokatibo o asosiyatibo; natural na iniuugnay ng parirala ang altar sa toldang tipanan nang hindi dinaragdagan ang teksto.
- source_word: וַיַּעַל עָלָיו עֹלוֹת
  choice: naghandog siya roon ng ... handog na sinusunog
  rationale: Ang ikalawang gamit ng עלה ay idyomang pansakripisyo. Isinasalin itong “naghandog” upang maging malinaw sa Filipino, habang ang עָלָיו ay likas na ipinahahayag ng “roon.”
- source_word: עֹלוֹת
  choice: handog na sinusunog
  rationale: Malinaw at karaniwang katumbas ng עֹלָה sa modernong Filipino; ipinahihiwatig ang handog na sinusunog sa altar.
- source_word: אָלֶף
  choice: isang libo
  rationale: Tuwirang katumbas ng bilang sa Hebreo.
theological_decisions:
- issue: Pagpapahayag sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: ang PANGINOON / Jehova
  rationale: Personal na pangalan ang tahasang nasa tekstong Hebreo. Ang “Yahweh” ay transliterasyong nagpapanatili rito sa halip na palitan ng titulo.
- issue: Ugnayan ng tansong altar at ng toldang tipanan
  choice: na nasa toldang tipanan
  alternative: na para sa toldang tipanan / na nasa harap ng toldang tipanan
  rationale: Maaaring lokatibo o asosiyatibo ang לְ; pinili ang natural na lokatibong pagbasa ngunit hindi pinalalawak ang parirala upang sabihing “nasa harap,” na wala rito nang tahasan.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “tansong altar,” “toldang tipanan,” at “handog na sinusunog” bilang malinaw na bokabularyong pangkulto. Nasa pangunahing teksto ang marker na [a].
