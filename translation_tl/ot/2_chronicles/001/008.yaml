id: 2CH.1.8
reference: 2 Chronicles 1:8
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר שְׁלֹמֹה֙ לֵֽ/אלֹהִ֔ים אַתָּ֗ה עָשִׂ֛יתָ עִם דָּוִ֥יד אָבִ֖/י חֶ֣סֶד גָּד֑וֹל וְ/הִמְלַכְתַּ֖/נִי תַּחְתָּֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/008.yaml
  text: And Solomon said to God[a], “You have shown great covenant faithfulness to David my father, and you have made me king in his place.”
translation:
  language: tl
  text: At sinabi ni Solomon sa Diyos, “Nagpakita kayo ng dakilang tapat na pag-ibig[a] kay David na aking ama, at ginawa ninyo akong hari bilang kahalili niya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nagpakita kayo ng dakilang katapatan sa tipan kay David na aking ama” o “nagpakita kayo ng dakilang kabutihan kay David na aking ama.” Ang Hebreong חֶסֶד ay madalas tumutukoy sa tapat at matibay na pag-ibig o katapatan, lalo na sa isang tipanang ugnayan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: At sinabi
  rationale: Isinusulong ng waw-consecutive ang salaysay. Ang “At sinabi” ay likas at marangal sa salaysay na Filipino.
- source_word: לֵאלֹהִים
  choice: sa Diyos
  rationale: Tumutukoy rito ang אֱלֹהִים sa iisang Diyos na kinakausap ni Solomon; tuwiran itong isinasalin na “sa Diyos.”
- source_word: עָשִׂיתָ עִם ... חֶסֶד גָּדוֹל
  choice: Nagpakita kayo ng dakilang tapat na pag-ibig kay
  rationale: Ang idyomang עשה עם + חֶסֶד ay nagsasaad ng pagkilos nang may matapat at matibay na pag-ibig. Pinananatili ng “tapat na pag-ibig” ang ugnayang bigat ng חֶסֶד nang hindi ginagawang tahasang bahagi ng pangunahing teksto ang ipinahihiwatig na tipan.
- source_word: דָּוִיד אָבִי
  choice: David na aking ama
  rationale: Malinaw at likas sa Filipino ang ayos na ito, at pinananatili nito ang pagkakasunod ng pangalang David at ng kaugnayang “aking ama.”
- source_word: וְהִמְלַכְתַּנִי
  choice: at ginawa ninyo akong hari
  rationale: 'Ang Hiphil ng מלך ay causative: pinaghari o ginawang hari. Tuwiran at natural ang “ginawa ninyo akong hari,” at malinaw ang pagkilos ng Diyos.'
- source_word: תַּחְתָּיו
  choice: bilang kahalili niya
  rationale: Sa konteksto ng paghalili sa trono, nangangahulugan itong pumalit sa kinalalagyan niya. Ang “bilang kahalili niya” ay malinaw at hindi nagpapahiwatig ng marahas na pagpapatalsik.
theological_decisions:
- issue: Pagsasalin ng חֶסֶד sa konteksto ng pakikitungo ng Diyos kay David
  choice: tapat na pag-ibig
  alternative: katapatan sa tipan; dakilang kabutihan
  rationale: May bigat ng matatag, tapat, at relasyonal na pag-ibig ang חֶסֶד, at nasa likuran nito ang tipanang pakikitungo ng Diyos kay David. Pinipili ang “tapat na pag-ibig” bilang natural na Filipino habang inilalagay sa talababa ang posibleng mas tahasang tipanang pagbasa.
- issue: Wika ng paghalili sa paghahari
  choice: ginawa ninyo akong hari bilang kahalili niya
  alternative: pinaghari ninyo ako kapalit niya; ginawa ninyo akong hari sa lugar niya
  rationale: Pinananatili nito ang pagkilos ng Diyos sa pagluklok kay Solomon at malinaw na ipinahahayag ang lehitimong paghalili, nang walang dagdag na teolohikong pahayag.
translation_notes:
  register: Gumamit ng modernong, marangal, at madaling maunawaang Filipino. Ginamit ang magalang na panghalip na “kayo/ninyo” sa tuwirang pakikipag-usap sa Diyos, ayon sa likas na gamit sa Filipino; hindi nito ipinahihiwatig ang maramihan.
