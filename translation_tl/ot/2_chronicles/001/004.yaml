    issue: Di-likas at bahagyang malabong konstruksyon ang “ipinagtayo niya ito ng tolda.”
    rationale: Ang Hebreong נָטָה לוֹ אֹהֶל ay “naglatag/nagtayo siya ng tolda para rito.” Ang kasalukuyang Filipino ay maaaring basahing itinayo niya ang kaban gamit ang tolda, sa halip na naglaan siya ng tolda bilang tirahan ng kaban.
  revised_text: Ngunit ang kaban ng Diyos ay iniakyat na ni David mula sa Kiriat-jearim patungo sa lugar na inihanda niya para rito[a], sapagkat nagtayo siya ng tolda para rito sa Jerusalem.
