base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/004.yaml
  text: But David had brought up the ark of God from Kiriath-jearim to the place David had prepared for it[a], for he had pitched a tent for it in Jerusalem.
translation:
  language: tl
  text: Ngunit ang kaban ng Diyos ay iniakyat na ni David mula sa Kiriat-jearim patungo sa lugar na inihanda niya para rito[a], sapagkat nagtayo siya ng tolda para rito sa Jerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas literal, “patungo sa inihanda ni David para rito.” Siksik ang pagkakasabi sa Hebreo; ang diwa ay dinala ni David ang kaban sa lugar na inihanda niya para rito.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲבָל
  choice: Ngunit
  rationale: 'Ipinakikita ang pagsalungat sa naunang pahayag: nasa Gibeon ang tansong altar, samantalang inilipat na sa Jerusalem ang kaban.'
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: ang kaban ng Diyos
  rationale: Tuwirang salin ng pariralang konstruktibo at karaniwang katawagan sa banal na kaban.
- source_word: הֶעֱלָה
  choice: ay iniakyat na ni David
  rationale: Ang Hiphil ng עלה ay nagsasaad ng pagpapaaakyat o pagdadala paitaas. Ang “na” ay likas na nagpapakita sa Filipino na nauna nang naganap ang paglilipat.
- source_word: מִקִּרְיַת יְעָרִים
  choice: mula sa Kiriat-jearim
  rationale: Transliterasyon ng pangalan ng lugar sa anyong madaling basahin sa Filipino habang pinananatili ang pagkakakilanlan nito.
- source_word: בַּהֵכִין לוֹ דָוִיד
  choice: patungo sa lugar na inihanda niya para rito
  rationale: Siksik at eliptikal ang Hebreo. Idinagdag ang “lugar” upang maging malinaw ang patutunguhan nang hindi binabago ang diwa.
- source_word: כִּי
  choice: sapagkat
  rationale: Nagpapakilala ng paliwanag kung bakit inihanda ni David ang lugar.
- source_word: נָטָה לוֹ אֹהֶל
  choice: ipinagtayo niya ito ng tolda
  rationale: Likas na modernong Filipino para sa pagtatayo o paglalahad ng tolda para sa kaban.
- source_word: בִּירוּשָׁלִָם
  choice: sa Jerusalem
  rationale: Tuwirang pariralang panlunan gamit ang nakaugaliang anyo ng pangalan sa Filipino.
