base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/015.yaml
  text: The king made the silver and the gold in Jerusalem as plentiful as stones[b][a], and he made the cedars as plentiful as the sycamore trees that are in the lowland.
translation:
  language: tl
  text: Ginawa ng hari na maging kasindami ng mga bato ang pilak at ginto sa Jerusalem[a], at maging kasindami ng mga punong sikomoro sa mababang lupain[b] ang mga sedro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “tulad ng mga bato” at “tulad ng mga sikomoro ... sa napakaraming bilang.” Ipinahahayag ng Hebreo ang pambihirang kasaganaan sa pamamagitan ng paghahambing.
    reason: lexical_alternative
  - marker: b
    text: Ang “mababang lupain” ay tumutukoy sa Shephelah, ang maburol na paanan ng kabundukan ng Juda sa pagitan ng bulubundukin at kapatagang baybayin.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּתֵּן / נָתַן
  choice: ginawa ... na maging
  rationale: Bagaman karaniwang nangangahulugang “nagbigay” o “naglagay” ang נתן, resulta o kasaganaan ang ipinahahayag nito rito kasama ng mga paghahambing. Ang “ginawa ... na maging” ay natural sa Filipino at pinananatili ang causative/resultative na diwa ng dalawang paggamit.
- source_word: הַמֶּלֶךְ
  choice: ang hari
  rationale: Tiyak na pangngalan ito at tumutukoy kay Solomon ayon sa konteksto.
- source_word: הַכֶּסֶף וְאֶת הַזָּהָב
  choice: ang pilak at ginto
  rationale: Tumutukoy ang mga salita sa pilak at ginto bilang mahahalagang kalakal. Hindi kailangang ulitin ang pantukoy bago ang “ginto” sa natural na Filipino.
- source_word: בִּירוּשָׁלִַם
  choice: sa Jerusalem
  rationale: Tuwirang panandang panlunan.
- source_word: כָּאֲבָנִים
  choice: kasindami ng mga bato
  rationale: Literal itong “tulad ng mga bato,” ngunit dami at kasaganaan ang punto ng paghahambing, hindi pagkakatulad ng materyal. Ginagawang hayag ng “kasindami” ang likas na diwa sa Filipino.
- source_word: הָאֲרָזִים
  choice: ang mga sedro
  rationale: Maaaring tumukoy sa mga punong sedro o sa suplay ng kahoy na sedro. Pinananatili ng “mga sedro” ang lawak at bahagyang kalabuan ng Hebreo nang hindi ipinipilit ang “kahoy” o “mga puno.”
- source_word: כַּשִּׁקְמִים
  choice: kasindami ng mga punong sikomoro
  rationale: Ang שׁקמה ay punong sycamore fig ng rehiyon. Ginamit ang “punong sikomoro” upang malinaw na halaman ang tinutukoy at upang maipahayag ang paghahambing sa dami.
- source_word: אֲשֶׁר בַּשְּׁפֵלָה
  choice: sa mababang lupain
  rationale: Ang שְׁפֵלָה ay maaaring karaniwang mangahulugang mababang lupain at maaari ring tumukoy sa partikular na rehiyong Shephelah. Isinalin ang karaniwang kahulugan sa teksto at ipinaliwanag ang heograpikong tukoy na diwa sa talababa.
- source_word: לָרֹב
  choice: kasindami
  rationale: Nagpapahayag ito ng labis na dami o kasaganaan. Isinama ang diwa nito sa paghahambing upang maging malinaw at natural sa Filipino.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kasindami” upang natural na maipahayag ang idyomatikong paghahambing sa kasaganaan, habang inilagay sa talababa ang mas literal na anyo. Iniwasang gawing tiyak na “kahoy na sedro” ang הָאֲרָזִים upang mapanatili ang posibleng pagtukoy sa mga puno o sa suplay ng kahoy.
