source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֱלֹהִ֣ים לִ/שְׁלֹמֹ֡ה יַ֣עַן אֲשֶׁר֩ הָיְתָ֨ה זֹ֜את עִם לְבָבֶ֗/ךָ וְ/לֹֽא שָׁ֠אַלְתָּ עֹ֣שֶׁר נְכָסִ֤ים וְ/כָבוֹד֙ וְ/אֵת֙ נֶ֣פֶשׁ שֹׂנְאֶ֔י/ךָ וְ/גַם יָמִ֥ים רַבִּ֖ים לֹ֣א שָׁאָ֑לְתָּ וַ/תִּֽשְׁאַל לְ/ךָ֙ חָכְמָ֣ה וּ/מַדָּ֔ע אֲשֶׁ֤ר תִּשְׁפּוֹט֙ אֶת עַמִּ֔/י אֲשֶׁ֥ר הִמְלַכְתִּ֖י/ךָ עָלָֽי/ו־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/011.yaml
  text: And God said to Solomon[a], “Because this was in your heart, and you did not ask for wealth, possessions, or honor, or for the life of those who hate you, nor did you ask for many days, but asked for wisdom and knowledge for yourself[b], that you might judge my people over whom I have made you king,”
translation:
  language: tl
  text: At sinabi ng Diyos kay Solomon, “Dahil ito ang nasa puso mo, at hindi ka humiling ng kayamanan, mga pag-aari, o karangalan, ni ng buhay ng mga napopoot sa iyo[b], ni ng maraming araw[a], kundi humiling ka para sa iyong sarili ng karunungan at kaalaman upang hatulan mo ang aking bayan na ginawa kitang hari sa kanila,”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “mahabang buhay.”
    reason: lexical_alternative
  - marker: b
    text: O, “buhay ng iyong mga kaaway”; literal, “buhay ng mga napopoot sa iyo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעַן אֲשֶׁר
  choice: Dahil
  rationale: Likas at malinaw na ipinapahayag ang sanhi o dahilan ng tugon ng Diyos.
- source_word: הָיְתָה זֹאת עִם לְבָבֶךָ
  choice: ito ang nasa puso mo
  rationale: Pinananatili ang larawang Hebreo tungkol sa panloob na hangarin o disposisyon nang hindi ito labis na binibigyang-kahulugan.
- source_word: עֹשֶׁר
  choice: kayamanan
  rationale: Karaniwang makabagong salin para sa yaman at malinaw na naiiba sa kasunod na mga pag-aari.
- source_word: נְכָסִים
  choice: mga pag-aari
  rationale: Tumutukoy sa mga pag-aaring materyal at pinananatiling naiiba sa pangkalahatang kayamanan.
- source_word: כָבוֹד
  choice: karangalan
  rationale: Angkop sa katayuan at pagkilalang panlipunan sa kontekstong maharlika.
- source_word: נֶפֶשׁ שֹׂנְאֶיךָ
  choice: buhay ng mga napopoot sa iyo
  rationale: Malapit sa isahang anyo ng נֶפֶשׁ at sa participial na 'mga napopoot sa iyo'; ipinahihiwatig sa konteksto ang pagkitil sa kanilang buhay.
- source_word: יָמִים רַבִּים
  choice: maraming araw
  rationale: Pinananatili ang kongkretong pananalita ng Hebreo; ang idiomatikong kahulugang 'mahabang buhay' ay inilagay sa talababa.
- source_word: חָכְמָה וּמַדָּע
  choice: karunungan at kaalaman
  rationale: Pinananatili ang pagkakaiba ng dalawang magkaugnay ngunit hindi magkaparehong konsepto.
- source_word: לְךָ
  choice: para sa iyong sarili
  rationale: 'Ipinakikita ang dative/reflexive nuance: si Solomon ang tatanggap ng hinihinging kakayahan, nang hindi ipinahihiwatig na makasarili ang kahilingan.'
- source_word: אֲשֶׁר תִּשְׁפּוֹט
  choice: upang hatulan mo
  rationale: Pinananatili ang karaniwang kahulugan ng pandiwang 'humatol' at ang layunin ng kahilingan; hindi ito nilalabo bilang pamamahala lamang.
- source_word: אֲשֶׁר הִמְלַכְתִּיךָ עָלָיו
  choice: na ginawa kitang hari nila
  rationale: Natural na Filipino para sa causative na pahayag na ginawa ng Diyos si Solomon na hari sa bayan.
theological_decisions:
- issue: Pagtukoy sa banal na nagsasalita na אֱלֹהִים
  choice: Diyos
  alternative: PANGINOON
  rationale: אֱלֹהִים ang nasa tekstong Hebreo, hindi ang banal na pangalang YHWH; kaya 'Diyos' ang nararapat.
- issue: Saklaw ng tungkulin ni Solomon sa תִּשְׁפּוֹט
  choice: hatulan
  alternative: pamahalaan
  rationale: Bagaman kalakip sa paghahari ang pamamahala, tahasang gumagamit ang Hebreo ng pandiwa para sa paghatol. Pinananatili ng salin ang legal at maharlikang tensiyon nito.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang pag-uulit ng 'humiling' at ang larawan ng 'nasa puso' upang masundan ang diin at estruktura ng Hebreo. Inilagay ang mga talababa sa mismong mga pariralang tinutukoy ng mga ito.
