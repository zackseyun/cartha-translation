source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר שְׁלֹמֹ֣ה לְ/כָל יִשְׂרָאֵ֡ל לְ/שָׂרֵי֩ הָ/אֲלָפִ֨ים וְ/הַ/מֵּא֜וֹת וְ/לַ/שֹּֽׁפְטִ֗ים וּ/לְ/כֹ֛ל נָשִׂ֥יא לְ/כָל יִשְׂרָאֵ֖ל רָאשֵׁ֥י הָ/אָבֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/002.yaml
  text: And Solomon spoke to all Israel—to the commanders of thousands and of hundreds[a], to the judges, and to every leader in all Israel[b], the heads of the fathers’ houses.
translation:
  language: tl
  text: Nagsalita si Solomon sa buong Israel—sa mga pinuno ng libu-libo at daan-daan, sa mga hukom, at sa bawat pinuno sa buong Israel—ang mga pinuno ng mga angkan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “mga pinuno ng mga ama,” isang idyomang tumutukoy sa mga pinuno ng mga angkan o sambahayang nagmula sa iisang ninuno.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Nagsalita
  rationale: Karaniwang nangangahulugang “sinabi” ang pandiwa, ngunit dahil maramihan at pampubliko ang mga kinakausap, mas natural sa Filipino ang “nagsalita ... sa” habang pinananatili ang diwa ng pormal na pagharap.
- source_word: לְכָל יִשְׂרָאֵל
  choice: sa buong Israel
  rationale: Pinananatili nito ang kolektibong katawagan sa bansa at hindi ito ginagawang tahasang “lahat ng Israelita.”
- source_word: שָׂרֵי הָאֲלָפִים וְהַמֵּאוֹת
  choice: mga pinuno ng libu-libo at daan-daan
  rationale: Maaaring tumukoy ang שָׂרִים sa mga pinunong militar o administratibo. Hindi nilimitahan ng salin sa isang tungkulin ang salita, at pinanatili ang mga yunit na “libu-libo” at “daan-daan.”
- source_word: וְלַשֹּׁפְטִים
  choice: sa mga hukom
  rationale: Tuwirang ipinahahayag ang kinikilalang tungkuling administratibo at panghukuman.
- source_word: וּלְכֹל נָשִׂיא
  choice: at sa bawat pinuno
  rationale: 'Malawak ang saklaw ng נָשִׂיא: maaaring lider, pangulo ng angkan, o punong opisyal. Ang “pinuno” ay malinaw at hindi nagpapahiwatig na anak sila ng hari, gaya ng maaaring ipakahulugan sa “prinsipe.”'
- source_word: רָאשֵׁי הָאָבוֹת
  choice: ang mga pinuno ng mga angkan
  rationale: Natural itong paglalarawan sa mga pinuno ng mga pangkat na nakabatay sa pinagmulang sambahayan o ninuno. Ipinaliliwanag sa talababa ang mas literal na idyomang Hebreo.
theological_decisions:
- issue: Ugnayan ng רָאשֵׁי הָאָבוֹת sa naunang “bawat pinuno”
  choice: Iniharap ito bilang pariralang panuring sa pamamagitan ng gitling
  alternative: Ituring itong isa pang hiwalay na pangkat ng mga kinausap
  rationale: Walang pangatnig bago ang רָאשֵׁי הָאָבוֹת, kaya pinakamalamang na nililinaw nito kung sino ang mga pinuno. Gayunman, hindi nagdagdag ng “samakatuwid” o “ibig sabihin” upang hindi lubusang alisin ang bahagyang kalabuan ng pagkakabuo.
- issue: Paglalarawan sa patrilineal na yunit na הָאָבוֹת
  choice: mga angkan, na may literal na paliwanag sa talababa
  alternative: mga sambahayan ng mga ama
  rationale: Pinananatili ng “angkan” ang historikal na istrukturang nakabatay sa ninuno nang hindi gumagamit ng salitang mahirap o di-natural sa karaniwang Filipino; ang anyong panlalaki ng Hebreong idyoma ay hindi ikinubli kundi iniulat sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang paulit-ulit na “sa buong Israel” at ang mga yunit na “libu-libo at daan-daan” upang hindi mawala ang estruktura at saklaw ng Hebreo.
