base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/010.yaml
  text: Now give me wisdom and knowledge[a], so that I may go out and come in before this people[b], for who can judge this great people of yours?
translation:
  language: tl
  text: Ngayon, bigyan mo ako ng karunungan at kaalaman, upang makalabas at makapasok ako sa harap ng bayang ito[a], sapagkat sino ang makapaghahatol sa dakila mong bayang ito?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “lumabas at pumasok sa harap ng bayan” ay isang Hebreong paraan ng paglalarawan sa hayagang pamumuno sa bayan.
    reason: cultural_note
  - marker: b
    text: Maaari ring “malaki mong bayang ito,” na posibleng tumutukoy sa laki o dami ng mamamayan nito.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַתָּה
  choice: Ngayon
  rationale: Likas at tuwirang panandang-panahon na nagpapakilala sa kahilingan ni Solomon.
- source_word: חָכְמָה וּמַדָּע
  choice: karunungan at kaalaman
  rationale: Pinananatili ang dalawang magkaugnay ngunit magkaibang konsepto; ang una ay may diwa ng mahusay na pagpapasiya, at ang ikalawa ay kaalaman o pagkaunawa.
- source_word: תֶּן לִי
  choice: bigyan mo ako
  rationale: Tuwirang katumbas ng pautos na pandiwa at ng di-tuwirang layon, sa natural na modernong Tagalog.
- source_word: וְאֵצְאָה ... וְאָבוֹאָה
  choice: upang makalabas at makapasok ako
  rationale: Ipinahahayag ng mga anyong pandiwa ang layunin ng kahilingan. Pinananatili ang Hebreong larawan at ipinaliliwanag sa talababa ang gamit nitong tumutukoy sa pamumuno.
- source_word: לִפְנֵי הָעָם הַזֶּה
  choice: sa harap ng bayang ito
  rationale: Pinananatili ang literal na larawang 'sa harap ng' at ang kolektibong kahulugan ng עָם bilang bayan o sambayanan.
- source_word: מִי יִשְׁפֹּט
  choice: sino ang makapaghahatol
  rationale: Ang tanong ay retorikal at tumutukoy sa kakayahan. Pinananatili ng 'humatol' ang pangunahing kahulugang panghukuman, bagaman saklaw rin nito rito ang pamamahala ng hari.
- source_word: עַמְּךָ הַזֶּה הַגָּדוֹל
  choice: iyong bayang ito na napakadakila
  rationale: Pinananatili ang pag-aari ng Diyos, ang demonstratibong 'ito,' at ang malawak na kahulugan ng גָּדוֹל. Inilalagay sa talababa ang posibleng diin sa laki o dami.
theological_decisions:
- issue: Ang idyoma ng paglabas at pagpasok bilang paglalarawan sa pamumuno ni Solomon
  choice: Panatilihin sa pangunahing teksto ang 'makalabas at makapasok ... sa harap ng bayang ito.'
  alternative: Pamunuan ang bayang ito
  rationale: Ang Hebreong larawan ay mahalagang bahagi ng pahayag at maaaring panatilihin nang hindi ikinukubli ang kahulugan; nililinaw ng talababa ang tungkulin nitong tumukoy sa hayagang pamumuno.
- issue: Saklaw ng יִשְׁפֹּט sa konteksto ng paghahari
  choice: makapaghahatol
  alternative: makapamahala
  rationale: Ang pandiwa ay tuwirang nangangahulugang humatol, ngunit sa kontekstong maharlika ay maaari ring sumaklaw sa pamamahala at pangangasiwa ng katarungan. Pinananatili ang pangunahing salitang panghukuman upang hindi paliitin o palawakin nang tahasan ang saklaw.
- issue: Kahulugan ng הַגָּדוֹל bilang katangian ng bayan ng Diyos
  choice: napakadakila
  alternative: napakalaki o napakarami
  rationale: Maaaring tumukoy ang salita sa kadakilaan, laki, o dami. Ang pangunahing teksto ay gumagamit ng mas malawak na 'napakadakila,' samantalang kinikilala sa talababa ang posibleng demograpikong diin.
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran ngunit marangal. Ginamit ang “bayan” para sa kolektibong עָם, at iniwasan ang labis na pormal o makalumang mga salita. Pinanatili ang idyomang Hebreo sa pangunahing teksto, kalakip ang maikling paliwanag.
