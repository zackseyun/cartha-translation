base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/013.yaml
  text: Then Solomon came to Jerusalem from the high place that was at Gibeon[a], from before the tent of meeting[c][b], and he reigned over Israel.
translation:
  language: tl
  text: Pagkatapos, dumating[a] si Solomon sa Jerusalem mula sa mataas na lugar na nasa Gibeon—mula sa harap ng tolda ng pagpupulong[b][c]—at naghari siya sa Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “pumunta”; ang pandiwang Hebreo ay maaaring isalin mula sa alinmang pananaw sa direksiyon.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “mula sa harap ng tolda ng pagpupulong,” isang pananalitang tumutukoy sa pag-alis mula sa lugar ng santuwaryo.
    reason: cultural_note
  - marker: c
    text: Ibig sabihin, ang mataas na lugar na sambahan sa Gibeon, kung saan naroon ang tolda ng pagpupulong.
    reason: cross_reference
lexical_decisions:
- source_word: וַיָּבֹא
  choice: dumating
  rationale: Ang בוא ay maaaring mangahulugang “dumating” o “pumunta” ayon sa pananaw ng nagsasalaysay. Ang “dumating ... sa Jerusalem” ay likas sa Filipino, habang pinananatili sa talababa ang tunay na alternatibo.
- source_word: לַבָּמָה
  choice: mataas na lugar
  rationale: Tumutukoy ang במה sa isang mataas na pook na ginagamit sa pagsamba. Pinananatili ng “mataas na lugar” ang katawagan nang hindi ito agad binibigyan ng negatibong pakahulugan.
- source_word: אֲשֶׁר בְּגִבְעוֹן
  choice: na nasa Gibeon
  rationale: Payak at natural na sugnay na nagsasaad kung saan naroon ang mataas na lugar.
- source_word: יְרוּשָׁלִַם
  choice: sa Jerusalem
  rationale: Sa konteksto, ang Jerusalem ang destinasyon ni Solomon mula sa Gibeon. Isinaayos ang siksik na pagkakasunod-sunod ng Hebreo upang maging malinaw sa Filipino.
- source_word: מִלִּפְנֵי
  choice: mula sa harap ng
  rationale: Pinananatili nito ang literal na larawang pangkalawakan ng pag-alis mula sa lugar sa harap ng santuwaryo.
- source_word: אֹהֶל מוֹעֵד
  choice: tolda ng pagpupulong
  rationale: Malinaw at tuwirang salin ng Hebreong parirala, at hindi kasing-interpretatibo ng ibang katawagan para sa tabernakulo.
- source_word: וַיִּמְלֹךְ
  choice: naghari siya
  rationale: Hari na si Solomon sa konteksto, kaya ang pandiwa ay tumutukoy sa pagpapatuloy ng kanyang paghahari, hindi sa pagsisimula niya bilang hari.
- source_word: עַל יִשְׂרָאֵל
  choice: sa Israel
  rationale: Ang “naghari ... sa Israel” ang natural na pariralang Filipino para sa pamumuno bilang hari sa bayan.
theological_decisions:
- issue: Ugnayang sintaktiko ng “Jerusalem” sa siksik na ayos ng Hebreo
  choice: Dumating si Solomon sa Jerusalem mula sa mataas na lugar sa Gibeon
  alternative: Dumating si Solomon mula sa mataas na lugar sa Gibeon patungong Jerusalem
  rationale: Ipinakikita ng konteksto na umalis si Solomon sa Gibeon at nagtungo sa Jerusalem. Nililinaw ng ayos sa Filipino ang direksiyon nang hindi nagdaragdag ng pangyayaring wala sa teksto.
- issue: Paglalarawan sa mataas na lugar na kaugnay ng tolda ng pagpupulong
  choice: mataas na lugar
  alternative: sambahan sa mataas na lugar
  rationale: Isinalin ang termino nang hindi ipinapasok ang negatibong pakahulugan na maaaring taglay nito sa ibang konteksto. Ipinaliliwanag ng talababa ang gamit ng pook na ito.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “tolda” sa halip na mas teknikal o lumang “tabernakulo,” at pinanatili ang “mataas na lugar” upang hindi labis na bigyang-kahulugan ang terminong kultiko. Ang mga gitling ay nagpapakitang ang pariralang “mula sa harap...” ay nagpapaliwanag pa sa pinanggalingan ni Solomon.
