base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/012.yaml
  text: Wisdom and knowledge are given to you[a], and I will give you riches and possessions and honor such as no kings before you have had, and none after you will have the like.
translation:
  language: tl
  text: Ipinagkaloob na sa iyo ang karunungan at kaalaman. Bibigyan din kita ng kayamanan, mga ari-arian, at karangalan. Wala pang haring nauna sa iyo ang nagkaroon ng mga kaloob na tulad nito, at wala ring haring susunod sa iyo ang magkakaroon nito.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “na hindi naging gayon sa mga haring nauna sa iyo, at pagkatapos mo ay hindi magiging gayon.”'
    reason: Pinananatili nito ang mas literal na anyo at ang bahagyang kalabuan ng כֵן (“gayon”), samantalang nililinaw ng pangunahing teksto na ang paghahambing ay may kaugnayan sa mga kaloob na binanggit.
lexical_decisions:
- source_word: הַחָכְמָה
  choice: karunungan
  rationale: Karaniwang katumbas ng חָכְמָה at natural na katawagan sa abstraktong katangian sa Filipino; hindi kailangang tumbasan nang tahasan ang pantukoy.
- source_word: הַמַּדָּע
  choice: kaalaman
  rationale: Tuwirang ipinapahayag ang diwa ng kaalaman at likas na kapares ng “karunungan,” nang hindi pinipili ang mas interpretatibong “pang-unawa.”
- source_word: נָתוּן לָךְ
  choice: ipinagkaloob na sa iyo
  rationale: Ang pasibong participle ay naglalarawan ng isang kaloob na tiyak nang nasa kalagayang ibinigay; ipinahihiwatig ng “na” ang resultang kalagayan.
- source_word: עֹשֶׁר
  choice: kayamanan
  rationale: Malinaw at marangal na modernong Filipino para sa yaman, at naiiba sa kasunod na mga pag-aari.
- source_word: נְכָסִים
  choice: mga ari-arian
  rationale: Saklaw nito ang mga pag-aari o pag-aaring materyal at mas natural sa Filipino kaysa teknikal na “mga asset.”
- source_word: כָבוֹד
  choice: karangalan
  rationale: Sa konteksto ng mga kaloob sa hari, tumutukoy ito sa dangal o karangalan, hindi kinakailangang sa banal na kaluwalhatian.
- source_word: אֶתֶּן לָךְ
  choice: Bibigyan din kita
  rationale: Ang imperfect ay panghinaharap na pangako sa konteksto; ang “din” ay likas na nag-uugnay sa naunang ipinagkaloob.
- source_word: אֲשֶׁר לֹא הָיָה כֵן לַמְּלָכִים אֲשֶׁר לְפָנֶיךָ
  choice: na hindi pa tinaglay ng sinumang haring nauna sa iyo
  rationale: Idyomatikong inilalahad ang paghahambing habang pinananatiling nakaugnay sa mga kaloob na binanggit, hindi sa lahat ng katangian ng mga hari.
- source_word: וְאַחֲרֶיךָ לֹא יִהְיֶה כֵן
  choice: at hindi rin tataglayin ng sinumang susunod sa iyo
  rationale: Ginagawang malinaw ang ipinahiwatig na paghahambing sa mga susunod na hari, samantalang itinatala sa talababa ang mas literal at mas hindi tiyak na anyo.
theological_decisions:
- issue: Saklaw ng pagiging walang kapantay ni Solomon
  choice: Ang paghahambing ay nakaugnay sa karunungan, kaalaman, kayamanan, mga ari-arian, at karangalang ipinagkaloob sa kanya.
  alternative: Isang ganap na pahayag na si Solomon mismo ay walang kapantay sa bawat aspekto kung ihahambing sa lahat ng hari.
  rationale: Sa balarila at daloy ng talata, ang sugnay ng paghahambing ay tumutukoy sa nakalistang mga kaloob. Hindi pinalalawak ng salin ang pahayag tungo sa lahat ng bahagi ng pagkatao o paghahari ni Solomon.
translation_notes:
  register: Modernong Filipino Tagalog na dignified ngunit madaling maunawaan. Ginamit ang “ipinagkaloob” para sa marangal na konteksto ng pagsasalita ng Diyos, at “tinaglay/tataglayin” upang natural na maipahayag ang paghahambing nang hindi lumalampas sa mga kaloob na nakalista.
