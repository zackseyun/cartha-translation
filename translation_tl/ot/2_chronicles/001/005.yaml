  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וּ/מִזְבַּ֣ח הַ/נְּחֹ֗שֶׁת אֲשֶׁ֤ר עָשָׂה֙ בְּצַלְאֵל֙ בֶּן אוּרִ֣י בֶן ח֔וּר שָׂ֕ם לִ/פְנֵ֖י מִשְׁכַּ֣ן יְהוָ֑ה וַ/יִּדְרְשֵׁ֥/הוּ שְׁלֹמֹ֖ה וְ/הַ/קָּהָֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/005.yaml
  text: And the bronze altar that Bezalel son of Uri[a], son of Hur, had made was there before the tabernacle of Yahweh, and Solomon and the assembly sought it there.
translation:
  language: tl
  text: At ang tansong altar na ginawa ni Bezalel na anak ni Uri, na anak ni Hur, ay naroon sa harap ng tabernakulo ni Yahweh. Hinanap iyon[a] ni Solomon at ng kapulungan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Hinanap nila si Yahweh roon.” Malabo kung ang hulaping panhalip sa Hebreo ay tumutukoy sa altar o kay Yahweh.
    reason: alternative_reading
lexical_decisions:
- source_word: וּמִזְבַּח הַנְּחֹשֶׁת
  choice: At ang tansong altar
  rationale: Ang מִזְבַּח ay “altar,” at ang נְחֹשֶׁת sa kontekstong ito ay “tanso.” Pinanatili ang pang-ugnay na וּ bilang “At” upang ipagpatuloy ang salaysay.
- source_word: אֲשֶׁר עָשָׂה
  choice: na ginawa
  rationale: Likas na Filipino ang payak na aspektong naganap; malinaw na nauna ang paggawa sa kasalukuyang tagpo nang hindi kailangang dagdagan ng “noon.”
- source_word: בְּצַלְאֵל בֶּן אוּרִי בֶן חוּר
  choice: Bezalel na anak ni Uri, na anak ni Hur
  rationale: Pinanatili ang sunod-sunod na ugnayang pampamilya at ang karaniwang transliterasyon ng mga pangalang Hebreo.
- source_word: שָׂם
  choice: ay naroon
  rationale: Ipinapahayag nito ang kinalalagyan o bungang kalagayan ng altar nang hindi nagdaragdag ng di-binanggit na gumawa ng paglalagay.
- source_word: לִפְנֵי מִשְׁכַּן יְהוָה
  choice: sa harap ng tabernakulo ni Yahweh
  rationale: Ang לִפְנֵי ay lokatibong “sa harap ng,” ang מִשְׁכָּן ay teknikal na banal na “tabernakulo,” at ang tetragrammaton ay isinaling “Yahweh” ayon sa ibinigay na consultation layer.
- source_word: וַיִּדְרְשֵׁהוּ
  choice: Hinahanap iyon
  rationale: Ang דרשׁ ay “hanapin/saliksikin/dulugan,” at ang hulaping panhalip ay maaaring tumukoy sa altar. Ginamit sa aktuwal na teksto ang aspektong naganap na “Hinanap iyon”; inilalahad sa talababa ang posibleng pagtukoy kay Yahweh.
- source_word: שְׁלֹמֹה וְהַקָּהָל
  choice: ni Solomon at ng kapulungan
  rationale: Ang קָהָל ay ang nagkakatipong pamayanan; malinaw at marangal sa modernong Filipino ang “kapulungan.” Inayos ang pananda bilang “ni/ng” dahil nauuna ang pandiwa sa pangalawang pangungusap.
theological_decisions:
- issue: Tinutukoy ng hulaping panhalip sa וַיִּדְרְשֵׁהוּ
  choice: 'Ang altar: “Hinanap iyon ni Solomon at ng kapulungan.”'
  alternative: 'Si Yahweh: “Hinanap siya roon ni Solomon at ng kapulungan”; maaari ring unawain nang lokatibo: “Dumulog sila roon.”'
  rationale: Ang altar ang pinakamalapit na tahasang pangngalan at tugma ito sa panlalaking anyo ng hulaping Hebreo. Gayunman, karaniwang ginagamit ang דרשׁ sa paghahanap o pagdulog kay Yahweh, kaya hindi dapat ikubli ang tunay na kalabuan; pinanatili ang alternatibo sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang teknikal na salitang “tabernakulo” at ang pangalang “Yahweh.” Inilipat ang talababa sa “iyon,” kung saan aktuwal na umiiral ang kalabuan, sa halip na ilagay sa pangalan ni Uri.
