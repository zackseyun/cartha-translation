  to: Nag-angkat[a] sila mula sa Ehipto ng isang karwahe sa halagang animnaraang siklo ng pilak[b] at ng isang kabayo sa halagang sandaan at limampung siklo ng pilak. At gayundin, sa pamamagitan nila[c] ay iniluwas ang mga ito sa lahat ng hari ng mga Heteo at sa mga hari ng Aram.[d]
