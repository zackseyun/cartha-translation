translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang likas na bokabularyong pangkalakalan ngunit nilagyan ng talababa upang mapanatili ang literal na galaw ng Hebreo. Pinanatili ang Aram bilang sinaunang pangalan at ang di-tiyak na tinutukoy ng panghalip sa בְּיָדָם.
