base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/017.yaml
  text: They imported from Egypt a chariot for six hundred shekels of silver[a], and a horse for one hundred fifty[c][b]; and so they exported them to all the kings of the Hittites and the kings of Aram.
translation:
  language: tl
  text: Nag-angkat[a] sila mula sa Ehipto ng isang karwahe sa halagang animnaraang siklo ng pilak[b] at ng isang kabayo sa halagang sandaan at limampung siklo ng pilak. At gayundin, sa pamamagitan nila[c] ay iniluwas ang mga ito sa lahat ng hari ng mga Heteo at sa mga hari ng Aram.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “Iniakyat at inilabas nila mula sa Ehipto.” Ginamit ang karaniwang mga pandiwa ng pagkilos sa konteksto ng pangangalakal; ipinapahayag ng “nag-angkat” at “iniluwas” ang diwang komersiyal.'
    reason: lexical_alternative
  - marker: b
    text: Hindi tahasang nasa Hebreo ang “siklo”; ito ang ipinapalagay na yunit ng timbang ng pilak. Gayundin sa kasunod na halaga.
    reason: implicit_unit
  - marker: c
    text: 'Hebreo: “sa kanilang kamay,” isang idyomang nangangahulugang “sa pamamagitan nila” o “sa pamamagitan ng kanilang mga kinatawan.”'
    reason: lexical_alternative
  - marker: d
    text: 'Hebreo: “Aram”; tradisyonal na isinasaling “Siria.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעֲלוּ וַיּוֹצִיאוּ מִמִּצְרַיִם
  choice: Nag-angkat sila mula sa Ehipto
  rationale: Ang dalawang karaniwang pandiwa ng pagkilos ay literal na nagsasaad ng pag-ahon at paglalabas, ngunit sa konteksto ng pagbili at presyo, likas na ipinahihiwatig ng mga ito ang pag-aangkat mula sa Ehipto.
- source_word: מֶרְכָּבָה
  choice: isang karwahe
  rationale: Tumutukoy ito sa karwaheng hinihila ng kabayo, at ang isahang anyo ay angkop sa presyong ibinibigay sa bawat yunit.
- source_word: בְּשֵׁשׁ מֵאוֹת כֶּסֶף
  choice: sa halagang animnaraang siklo ng pilak
  rationale: Hindi tahasang binanggit sa Hebreo ang yunit, ngunit ang siklo ang ipinapalagay na panukat ng pilak; idinagdag ito para luminaw ang halaga.
- source_word: וְסוּס בַּחֲמִשִּׁים וּמֵאָה
  choice: at ng isang kabayo sa halagang sandaan at limampung siklo ng pilak
  rationale: Ang סוּס ay karaniwang 'kabayo,' at ang yunit at materyal ng presyo ay likas na inuulit mula sa naunang parirala upang maging malinaw sa Filipino.
- source_word: וְכֵן
  choice: Gayundin
  rationale: Ipinagpapatuloy nito ang parehong kalakaran ng pangangalakal patungo sa ibang mga hari.
- source_word: בְּיָדָם
  choice: sa pamamagitan nila
  rationale: Ang literal na 'sa kanilang kamay' ay idyoma ng ahensiya. Pinananatili ng 'sa pamamagitan nila' ang panghalip at ang kaunting kalabuan ng tinutukoy nito nang hindi nagdaragdag ng tahasang antecedent.
- source_word: יוֹצִיאוּ
  choice: iniluluwas
  rationale: Sa ikalawang bahagi ng talata, ang paglalabas ay tumutukoy sa pagpapadala ng mga kalakal sa mga dayuhang hari; malinaw na naipapahayag ng 'iniluluwas' ang komersiyal na diwa.
- source_word: הַחִתִּים וּמַלְכֵי אֲרָם
  choice: mga Heteo at mga hari ng Aram
  rationale: Ang 'Heteo' ang natural na anyong Filipino para sa Hittites, samantalang pinananatili ang pangalang Aram sa halip na palitan ito ng makabagong heograpikong tawag na Siria.
