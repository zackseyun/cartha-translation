  terminology: Wastong pinananatili ang “Yahweh” para sa יהוה at “Diyos” para sa אֱלֹהִים. Ang “salita” ay angkop para sa דָּבָר at ang “pangako” ay wastong ilagay bilang alternatibo sa talababa.
