id: 2CH.1.9
reference: 2 Chronicles 1:9
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: עַתָּה֙ יְהוָ֣ה אֱלֹהִ֔ים יֵֽאָמֵן֙ דְּבָ֣רְ/ךָ֔ עִ֖ם דָּוִ֣יד אָבִ֑/י כִּ֤י אַתָּה֙ הִמְלַכְתַּ֔/נִי עַל עַ֕ם רַ֖ב כַּ/עֲפַ֥ר הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/009.yaml
  text: Now[a], Yahweh God, let your word to David my father be confirmed, for you have made me king over a people as numerous as the dust of the earth.
translation:
  language: tl
  text: Ngayon, Yahweh na Diyos, maitatag nawa ang iyong salita[a] kay David na aking ama, sapagkat ginawa mo akong hari sa isang bayang sindami ng alikabok ng lupa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “maitatag nawa ang iyong pangako kay David na aking ama.”
    reason: 'Leksikal na alternatibo: maaaring ipakahulugan ang “salita” bilang pangako sa kontekstong ito.'
lexical_decisions:
- source_word: עַתָּה
  choice: Ngayon
  rationale: Nagsisilbing panandang temporal at panimulang diskurso sa kahilingan ni Solomon; tuwiran at natural ang “Ngayon” sa Filipino.
- source_word: יְהוָה אֱלֹהִים
  choice: Yahweh na Diyos
  rationale: Pinananatili ang pangalang tipan na Yahweh at ang kasunod na titulong Diyos; ginagamit ang “na” upang maging natural sa Filipino ang apposisyon.
- source_word: יֵאָמֵן
  choice: mapagtibay nawa
  rationale: Ipinahahayag ng Niphal na anyo ang kahilingang ang salita ng Diyos ay pagtibayin o itatag. Pinananatili ng “mapagtibay nawa” ang diwang pasibo at ang tono ng panalangin.
- source_word: דְּבָרְךָ
  choice: iyong salita
  rationale: Literal na “iyong salita.” Bagaman tumutukoy ito sa isang pangako sa konteksto, pinananatili ng “salita” ang lawak ng Hebreo nang hindi tahasang nilulutas ang kahulugan.
- source_word: עִם דָּוִיד אָבִי
  choice: kay David na aking ama
  rationale: Bagaman literal na maaaring “kasama ni David,” sa idyomang ito ang salita ay sinabi o ipinangako kay David. Natural at malinaw sa Filipino ang “kay David na aking ama.”
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala nito ang batayan ng kahilingan ni Solomon at angkop sa marangal na himig ng panalangin.
- source_word: הִמְלַכְתַּנִי
  choice: ginawa mo akong hari
  rationale: 'Malinaw na ipinapahayag ang causative na kahulugan ng Hiphil: ang Diyos ang gumawa kay Solomon na hari.'
- source_word: עַל עַם רַב
  choice: sa isang bayang sindami
  rationale: Ang רַב ay may diwang marami o napakarami rito dahil sinusundan ito ng paghahambing sa alabok ng lupa.
- source_word: כַּעֲפַר הָאָרֶץ
  choice: ng alabok sa lupa
  rationale: Kasama ng “sindami,” natural nitong naihahatid ang karaniwang Hebreong larawan ng di-mabilang na karamihan.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Tuwirang ginagamit ng talata ang Tetragrammaton. Pinananatili ng “Yahweh” ang natatanging pangalan sa halip na palitan ito ng isang titulo.
- issue: Kung gagawing tahasan na “pangako” ang דְּבָרְךָ
  choice: iyong salita
  alternative: iyong pangako
  rationale: Ang konteksto ay tungkol sa pangako ng Diyos kay David, ngunit “salita” ang mismong Hebreong pahayag. Pinananatili sa pangunahing teksto ang tunay na leksikal na lawak, at inilalagay sa talababa ang mas tiyak na pagbasa.
translation_notes:
  register: Makabago ngunit marangal na Filipino na angkop sa panalangin. Ginamit ang “nawa” upang likas na maipahayag ang Hebreong kahilingan, at iniwasan ang sobrang teknikal o denominasyonal na pananalita.
