  to: Ngayon, Yahweh na Diyos, maitatag nawa ang iyong salita[a] kay David na aking ama, sapagkat ginawa mo akong hari sa isang bayang sindami ng alikabok ng lupa.
  rationale: Pinalitan ang “mapagtibay nawa” ng “maitatag nawa” upang maging mas natural na Filipino at mas malinaw na maipahayag ang kahilingang ang salita ng Diyos ay maitatag. Pinalitan din ang “alabok sa lupa” ng “alikabok ng lupa” upang mapanatili ang karaniwang larawan ng pinagmulan habang mas natural ang gamit.
