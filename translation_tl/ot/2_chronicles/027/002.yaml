id: 2CH.27.2
reference: 2 Chronicles 27:2
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יַּ֨עַשׂ הַ/יָּשָׁ֜ר בְּ/עֵינֵ֣י יְהוָ֗ה כְּ/כֹ֤ל אֲשֶׁר עָשָׂה֙ עֻזִּיָּ֣הוּ אָבִ֔י/ו רַ֕ק לֹא בָ֖א אֶל הֵיכַ֣ל יְהוָ֑ה וְ/ע֥וֹד הָ/עָ֖ם מַשְׁחִיתִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/027/002.yaml
  text: He did what was right in the eyes of Yahweh[a], according to all that his father Uzziah had done—except that he did not enter the temple of Yahweh[b]. But the people still acted corruptly.
translation:
  language: tl
  text: Ginawa niya ang tama sa paningin ni Yahweh, ayon sa lahat ng ginawa ng kanyang amang si Uzias—maliban lamang sa hindi siya pumasok sa templo ni Yahweh.[a] Ngunit patuloy pa ring gumagawa ng katiwalian ang bayan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang sugnay ay maaari ding isalin, “hindi siya pumaroon sa loob ng templo ni Yahweh.” Malamang na ipinakikita rito ang kaibahan ni Jotam kay Uzias, na pumasok sa templo nang wala siyang karapatang gawin iyon (tingnan ang 2 Cronica 26:16–21).
    reason: cross_reference
  - marker: b
    text: Maaari ring isalin, “patuloy na nagpapakasama ang bayan” o “patuloy na kumikilos nang tiwali ang bayan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ הַיָּשָׁר
  choice: Ginawa niya ang tama
  rationale: Ang הַיָּשָׁר ay pang-uring ginamit bilang pangngalan, kaya malinaw at likas ang “ang tama” bilang moral na pagtataya.
- source_word: בְּעֵינֵי יְהוָה
  choice: sa paningin ni Yahweh
  rationale: Pinananatili nito ang larawang Hebreo ng pagtataya “sa mga mata/paningin” ng Diyos, sa likas na idyomang Tagalog.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat ang banal na pangalang YHWH sa halip na palitan ito ng isang titulo.
- source_word: כְּכֹל אֲשֶׁר עָשָׂה עֻזִּיָּהוּ אָבִיו
  choice: ayon sa lahat ng ginawa ng kanyang amang si Uzias
  rationale: Ipinahahayag ng כְּכֹל אֲשֶׁר ang pagsunod sa naunang huwaran; pinananatili ng “lahat” ang saklaw ng paghahambing.
- source_word: רַק
  choice: maliban lamang sa
  rationale: Naglalagay ang רַק ng tahasang limitasyon sa pagkakatulad ni Jotam sa kanyang ama.
- source_word: לֹא בָא אֶל הֵיכַל יְהוָה
  choice: hindi siya pumasok sa templo ni Yahweh
  rationale: Sa kontekstong ito, ang בוא + אֶל ay tumutukoy sa pagpasok, at ang הֵיכָל ay ang templo o santuwaryo.
- source_word: וְעוֹד הָעָם מַשְׁחִיתִים
  choice: Ngunit patuloy pa ring gumagawa ng katiwalian ang bayan
  rationale: Ipinakikita ng וְעוֹד ang pagpapatuloy ng masamang kalagayan sa kabila ng matuwid na paghahari; ang “gumagawa ng katiwalian” ay hindi nagtatakda ng di-binanggit na layon ng participle.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo, kaya pinananatili ito bilang “Yahweh” sa halip na palitan ng titulo.
- issue: Ugnayan ng kilos ni Jotam sa pagpasok ni Uzias sa templo
  choice: Inilagay ang sugnay bilang limitasyon sa paghahambing, nang hindi tahasang sinasabing labag sa batas ang pagpasok
  alternative: Ipaliwanag sa pangunahing teksto na hindi niya ginaya ang labag sa batas na pagpasok ni Uzias
  rationale: Ang רַק ay malinaw na naglilimita sa paghahambing, ngunit hindi tahasang inuulit ng talata ang hatol sa kilos ni Uzias; ang kaugnay na konteksto ay inilagay sa talababa.
- issue: Di-tiyak na puwersa ng מַשְׁחִיתִים
  choice: gumagawa ng katiwalian
  alternative: nagpapakasama; kumikilos nang tiwali; nagpapatiwali
  rationale: Maaaring magpahiwatig ang Hiphil participle ng tiwaling pagkilos o pagpapatiwali. Pinananatili ng salin at talababa ang saklaw nang hindi nagdaragdag ng tiyak na layon.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kanyang amang si Uzias” bilang likas na ayos sa Tagalog, at ang em dash upang malinaw na ipakilala ang limitasyong dala ng רַק. Ang “bayan” ay ang kolektibong sambayanan, hindi lamang isang pangkat ng mga tao.
