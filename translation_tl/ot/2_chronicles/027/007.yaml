  naturalness: Malinaw at marangal ang pangungusap, ngunit mas natural sa modernong Filipino ang “kanyang pamumuhay” para sa asal o paraan ng pamumuhay ni Jotam. Ang “lahat ng ito” ay mas matatas ding pantukoy sa naunang magkakasamang talaan.
  terminology: Ang “Jotam,” “Juda,” “Aklat,” at “mga Hari” ay angkop. Pinanatili ang “narito” bilang mariing panturo. Inilipat ang talababa b sa salitang tinatalakay nito upang maitama ang footnote anchor.
