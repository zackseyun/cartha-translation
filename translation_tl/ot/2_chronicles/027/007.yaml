base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/027/007.yaml
  text: The rest of the acts of Jotham[a], and all his wars and his ways—behold[b], they are written in the Book of the Kings of Israel and Judah.
translation:
  language: tl
  text: Ang iba pang mga ginawa ni Jotam[a], pati ang lahat ng kanyang mga digmaan at ang kanyang pamumuhay[b]—narito, nakasulat ang lahat ng ito sa Aklat ng mga Hari ng Israel at Juda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga bagay tungkol kay Jotam”; ang idyomang Hebreo ay tumutukoy sa tala ng kanyang mga ginawa o mga gawain.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “kanyang asal” o “kanyang mga gawi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי יוֹתָם
  choice: Ang iba pang mga ginawa ni Jotam
  rationale: Sa pormulang pangkasaysayan tungkol sa mga hari, ang דִּבְרֵי ay tumutukoy sa mga ginawa o mga pangyayari tungkol sa hari, hindi lamang sa kanyang mga salita. Likas at malinaw sa Filipino ang “iba pang mga ginawa.”
- source_word: וְכָל מִלְחֲמֹתָיו
  choice: ang lahat ng kanyang mga digmaan
  rationale: Tuwirang ipinahahayag ng מִלְחָמוֹת ang mga digmaan o armadong tunggalian; pinananatili ng salin ang pangkalahatang saklaw nito nang hindi ito nililimitahan sa mga kampanya o labanan lamang.
- source_word: וּדְרָכָיו
  choice: at ang kanyang mga pamamaraan
  rationale: Ang דֶּרֶךְ ay literal na “daan” ngunit maaari ring tumukoy sa paraan ng pagkilos o asal. Ang “mga pamamaraan” ay nagpapanatili ng lawak at bahagyang talinghaga ng Hebreo, habang ang “pamumuhay” o “asal” ay posibleng alternatibo.
- source_word: הִנָּם
  choice: narito, ... ang mga iyon
  rationale: Ang הִנָּם ay may panturo at mariing puwersa. Inihahatid ng “narito” ang diin, at ng “ang mga iyon” ang pangmaramihang pagtukoy sa naunang talaan.
- source_word: כְּתוּבִים עַל סֵפֶר
  choice: nakasulat ... sa Aklat
  rationale: Bagaman literal na may pang-ukol na “sa ibabaw ng,” ang likas na Filipino para sa nilalaman ng isang kasulatan ay “nakasulat sa Aklat.”
- source_word: מַלְכֵי יִשְׂרָאֵל וִיהוּדָה
  choice: mga Hari ng Israel at Juda
  rationale: Itinuturing itong pamagat ng kinikilalang talaang pinagmulan, kaya ginamit ang malaking titik sa “Aklat” at “Hari.”
