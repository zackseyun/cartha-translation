base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/027/004.yaml
  text: He built cities in the hill country of Judah[b][a], and in the forests he built fortresses and towers.
translation:
  language: tl
  text: Nagtayo siya ng mga bayan sa kabundukan ng Juda. Sa mga kagubatan[a], nagtayo rin siya ng mga tanggulan[b] at mga tore.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga lugar na maraming puno” o “mga masukal na lugar.”
    reason: lexical_alternative
  - marker: b
    text: O “mga kuta” o “mga muog.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עָרִים
  choice: mga bayan
  rationale: Karaniwang tumutukoy ang salita sa mga pamayanang may kaayusang panlungsod. Mas natural at mas angkop sa sinaunang konteksto ang “mga bayan” kaysa sa makabagong dating ng “mga lungsod.”
- source_word: בָּנָה
  choice: nagtayo
  rationale: Tuwirang ipinahahayag ang gawaing pagtatayo at pinananatili ang maikli at salaysay na estilo ng Hebreo.
- source_word: בְּהַר יְהוּדָה
  choice: sa kabundukan ng Juda
  rationale: Dito, ang הַר ay tumutukoy sa bulubunduking rehiyon ng Juda, hindi lamang sa isang bundok.
- source_word: חֳרָשִׁים
  choice: mga kagubatan
  rationale: Tumutukoy ito sa mga lugar na masukal o maraming puno. Malinaw at natural sa modernong Filipino ang “mga kagubatan,” habang inilalahad sa talababa ang iba pang posibleng diwa.
- source_word: בִּירָנִיּוֹת
  choice: mga tanggulan
  rationale: Tumutukoy ang salita sa mga pinatibay na gusali o lugar. Ang “mga tanggulan” ay natural at nagpapakita ng gamit na pandepensa nang hindi nag-aangkat ng anakronistikong larawan.
- source_word: מִגְדָּלִים
  choice: mga tore
  rationale: Ito ang tuwirang katumbas ng pangngalan at, kasama ng mga tanggulan, malamang na tumutukoy sa mga toreng pandepensa.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at madaling maunawaan. Ginamit ang “mga bayan” para sa sinaunang mga pamayanan, “kabundukan” para sa panrehiyong kahulugan ng הַר, at dalawang pangungusap upang maging natural ang daloy nang hindi binabago ang ugnayan ng mga sugnay.
