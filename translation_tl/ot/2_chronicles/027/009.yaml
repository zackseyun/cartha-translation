base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/027/009.yaml
  text: And Jotham slept with his fathers[a], and they buried him in the city of David. And Ahaz his son reigned in his place.
translation:
  language: tl
  text: At nahimlay si Jotam kasama ng kanyang mga ninuno[a], at inilibing nila siya sa Lungsod ni David. At naghari ang anak niyang si Ahaz bilang kahalili ni Jotam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, sa mas tahasang pagpapakahulugan, “namatay si Jotam at napasama sa kanyang mga ninuno.” Literal na sinasabi ng Hebreo na “natulog na kasama ng kanyang mga ama,” isang karaniwang pormula tungkol sa pagkamatay ng isang hari.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: natulog
  rationale: Pinananatili nito ang larawan ng Hebreong pormula para sa pagkamatay ng hari, sa halip na agad itong ipakahulugang “namatay.”
- source_word: עִם אֲבֹתָיו
  choice: na kasama ng kanyang mga ninuno
  rationale: Sa modernong Tagalog, malinaw at likas ang “mga ninuno” para sa mga naunang salinlahi; pinananatili ng buong parirala ang tradisyonal na pormula tungkol sa kamatayan.
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: inilibing nila siya
  rationale: Pinananatili ang aktibong pandiwang maramihan ng Hebreo at ang di-tiyak na gumagawa ng kilos.
- source_word: בְּעִיר דָּוִיד
  choice: sa Lunsod ni David
  rationale: Natural na anyo sa Tagalog para sa kinikilalang pangalan ng lugar habang pinananatili ang konstruksiyon ng pangalang pantangi.
- source_word: וַיִּמְלֹךְ
  choice: naghari
  rationale: Tuwirang ipinahahayag ang pagganap sa pagiging hari at ang pormula ng paghalili.
- source_word: תַּחְתָּיו
  choice: bilang kahalili niya
  rationale: Malinaw at likas na ipinahahayag sa Tagalog ang paghalili sa trono, na siyang diwa ng salita sa kontekstong ito.
- source_word: יוֹתָם
  choice: Jotam
  rationale: Karaniwang anyong Tagalog ng pangalang Hebreo.
- source_word: אָחָז
  choice: Ahaz
  rationale: Karaniwang anyong Tagalog ng pangalang Hebreo.
- source_word: בְּנוֹ
  choice: ang anak niyang
  rationale: Hayagang pinananatili ang ugnayang ama-anak sa pormula ng paghalili.
theological_decisions:
- issue: Ang pormulang “natulog na kasama ng kanyang mga ninuno” bilang paglalarawan sa kamatayan
  choice: Pinanatili sa pangunahing teksto ang metaporang “natulog” at ipinaliwanag sa talababa.
  alternative: “Namatay si Jotam gaya ng kanyang mga ninuno”
  rationale: Pinananatili nito ang tunay na pananalita at pormulang maharlika ng Hebreo nang hindi ginagawang tuwirang pahayag tungkol sa kalagayan pagkatapos ng kamatayan.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang Hebreong metapora sa pormula ng kamatayan, ngunit ginamit ang “mga ninuno” sa halip na literal na “mga ama” upang maging natural at hindi malabo sa ordinaryong mambabasa.
