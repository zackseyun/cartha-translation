  text: ה֗וּא בָּנָ֛ה אֶת שַׁ֥עַר בֵּית יְהוָ֖ה הָ/עֶלְי֑וֹן וּ/בְ/חוֹמַ֥ת הָ/עֹ֛פֶל בָּנָ֖ה לָ/רֹֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/027/003.yaml
  text: He built the upper gate of the house of Yahweh[a], and on the wall of the Ophel he built much.
translation:
  language: tl
  text: Itinayo niya ang pintuang-daan sa itaas ng bahay ni Yahweh, at marami[a] rin siyang itinayo sa pader ng Ofel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “malawakan siyang nagtayo sa pader ng Ofel” o “sagana ang itinayo niya sa pader ng Ofel.”'
    reason: Pinahihintulutan ng לָרֹב ang mga pagbasa na nagbibigay-diin sa lawak o dami ng gawaing pagtatayo.
lexical_decisions:
- source_word: בָּנָה
  choice: itinayo / siyang itinayo
  rationale: Karaniwang kahulugan ng pandiwa ang magtayo o gumawa ng isang gusali o estruktura. Hindi sapat ang konteksto upang tukuying muli niya itong itinayo.
- source_word: שַׁעַר
  choice: pintuang-daan
  rationale: Tumutukoy ito sa malaking pasukan ng isang templo o napapaderang lugar; mas malinaw dito ang “pintuang-daan” kaysa simpleng “pinto.”
- source_word: בֵּית יְהוָה
  choice: bahay ni Yahweh
  rationale: Pinananatili nito ang konkretong Hebreong pananalitang “bahay ni Yahweh,” sa halip na ipalit agad ang interpretatibong “templo.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat sa Tagalog ang personal na pangalang nakasulat sa Hebreo, sa halip na palitan ito ng isang titulo.
- source_word: הָעֶלְיוֹן
  choice: itaas
  rationale: Inilalarawan nito ang lokasyon o pagkakakilanlan ng pintuang-daan bilang nasa itaas.
- source_word: וּבְחוֹמַת
  choice: rin ... sa pader ng
  rationale: Sa konteksto ng pagtatayo, ang pang-ukol ay likas na tumutukoy sa gawaing isinagawa sa pader. Ipinahahayag ng “rin” ang pang-ugnay na waw sa natural na Tagalog.
- source_word: הָעֹפֶל
  choice: Ofel
  rationale: Pangalan ito ng mataas at pinatibay na lugar sa Jerusalem, kaya isinalin ito sa baybay na angkop sa modernong Filipino.
- source_word: לָרֹב
  choice: marami
  rationale: Pinananatili ang malawak ngunit hindi tiyak na diwa ng dami o lawak ng kanyang pagtatayo; hindi nililinaw ng Hebreo kung eksaktong ano o gaano karami ang itinayo.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Personal na pangalan ang nasa tekstong Hebreo. Ang “Yahweh” ay nagpapanatili nito, samantalang ang “PANGINOON” ay kapalit na titulo.
translation_notes:
  register: Makabago at marangal na Filipino. Ginamit ang “bahay ni Yahweh” upang mapanatili ang larawan ng Hebreo, “pintuang-daan” para sa malinaw na kontekstong pang-arkitektura, at “Ofel” bilang pangalang pantangi. Inilipat ang panandang [a] sa “Marami,” ang salitang talagang saklaw ng leksikal na alternatibo.
