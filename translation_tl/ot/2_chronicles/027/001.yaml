base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/027/001.yaml
  text: Jotham was twenty-five years old when he began to reign, and he reigned sixteen years in Jerusalem. His mother’s name was Jerushah daughter of Zadok.
translation:
  language: tl
  text: Dalawampu't limang taong gulang si Jotam nang magsimula siyang maghari, at labing-anim na taon siyang naghari sa Jerusalem. Ang pangalan ng kanyang ina ay Jerusa, na anak ni Zadok.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן עֶשְׂרִים וְחָמֵשׁ שָׁנָה
  choice: Dalawampu't limang taong gulang
  rationale: Likas na salin sa modernong Tagalog ng Hebreong pormula sa pagsasaad ng edad.
- source_word: בְּמָלְכוֹ
  choice: nang magsimula siyang maghari
  rationale: Ipinahahayag ng konstruksyon ang panahon ng pagluklok o pagsisimula ng paghahari.
- source_word: מָלַךְ
  choice: naghari
  rationale: Tuwirang ipinapahayag ng pandiwa ang aktuwal na paghahari.
- source_word: בִּירוּשָׁלָם
  choice: sa Jerusalem
  rationale: Likas na lokatibong salin ng pang-ukol at pangalan ng lugar.
- source_word: וְשֵׁם אִמּוֹ
  choice: Ang pangalan ng kanyang ina ay
  rationale: Pinananatili ang pormula ng pagkakakilanlan sa natural at marangal na Tagalog.
- source_word: יְרוּשָׁה
  choice: Jerusa
  rationale: Isinalin sa baybay na angkop sa ponolohiya at tradisyon ng mga pangalang biblikal sa Tagalog.
- source_word: בַּת צָדוֹק
  choice: na anak ni Zadok
  rationale: Malinaw at natural na pagpapahayag ng ugnayang anak na babae sa Tagalog.
