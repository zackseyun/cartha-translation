  yaml_path: translation/ot/2_chronicles/027/008.yaml
  text: He was twenty-five years old when he began to reign, and he reigned sixteen years in Jerusalem.
translation:
  language: tl
  text: Dalawampu't limang taong gulang siya nang magsimula siyang maghari, at labing-anim na taon siyang naghari sa Jerusalem.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן עֶשְׂרִים וְחָמֵשׁ שָׁנָה
  choice: dalawampu't limang taong gulang
  rationale: Karaniwang pormula ito sa Hebreo para tukuyin ang edad. Ang saling ito ay natural sa makabagong Tagalog at tumpak na naghahayag ng edad.
- source_word: הָיָה בְמָלְכוֹ
  choice: nang magsimula siyang maghari
  rationale: Ang literal na anyo ay isang idyomang tumutukoy sa edad nang umakyat sa trono; malinaw at likas itong ipinahahayag ng napiling salin.
- source_word: וְשֵׁשׁ עֶשְׂרֵה שָׁנָה
  choice: at labing-anim na taon
  rationale: Tuwirang salin ng bilang at yunit ng panahon, habang pinananatili ang pang-ugnay na nasa Hebreo.
- source_word: מָלַךְ
  choice: naghari
  rationale: Tiyak na tumutukoy ang pandiwa sa pamamahala bilang hari; ang “naghari” ang pinakadirekta at karaniwang katumbas sa Tagalog.
- source_word: בִּירוּשָׁלִָם
  choice: sa Jerusalem
  rationale: Ipinahahayag ng pang-ukol na Hebreo ang lugar; “sa Jerusalem” ang natural na anyo sa Tagalog.
