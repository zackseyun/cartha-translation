  text: וַ/יִּתְחַזֵּ֖ק יוֹתָ֑ם כִּ֚י הֵכִ֣ין דְּרָכָ֔י/ו לִ/פְנֵ֖י יְהוָ֥ה אֱלֹהָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/027/006.yaml
  text: So Jotham became strong, because he ordered his ways before the LORD his God.
translation:
  language: tl
  text: Kaya naging makapangyarihan si Jotam, sapagkat itinuon niya ang kanyang pamumuhay sa harap ng PANGINOON na kanyang Diyos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּתְחַזֵּק
  choice: naging makapangyarihan
  rationale: Ang hitpael ng חזק ay nagpapahayag ng paglakas o pagiging matatag/makapangyarihan; sa konteksto ng paghahari ni Jotam, likas sa Tagalog ang “naging makapangyarihan” nang hindi tinutukoy kung pisikal, militar, o pampolitika lamang.
- source_word: הֵכִין
  choice: itinuon
  rationale: Ang Hiphil ng כון ay may diwang ihanda, itatag, o ituon nang matatag. Ang “itinuon” ay natural na kaugnay ng sinadyang pag-aayos ng buong pamumuhay ayon sa Diyos.
- source_word: דְּרָכָיו
  choice: ang kanyang pamumuhay
  rationale: Bagaman literal na “kanyang mga daan,” idiomatiko itong tumutukoy sa asal at paraan ng pamumuhay; “pamumuhay” ang malinaw at natural na katumbas sa modernong Tagalog.
- source_word: לִפְנֵי יְהוָה אֱלֹהָיו
  choice: sa harap ng PANGINOON na kanyang Diyos
  rationale: Pinananatili ang relasyonal at teolohikal na larawan ng pamumuhay sa presensya at pagsusuri ng Diyos. Isinalin ang tetragrammaton ayon sa nakasanayang anyong “PANGINOON.”
theological_decisions:
- issue: Ugnayan ng lakas ni Jotam at ng kanyang pamumuhay sa harap ng Diyos
  choice: Pinanatili ang tahasang sanhi sa “sapagkat.”
  alternative: Maaaring gawing mas maluwag na “habang” o “dahil maingat siyang namuhay,” ngunit pahihinain nito ang כִּי.
  rationale: Ipinapahayag ng tekstong Hebreo na ang pagiging malakas ni Jotam ay kaugnay ng sinadya niyang pag-aayos ng kanyang mga daan sa harap ng Diyos, nang hindi dinaragdagan ang teksto ng isang tiyak na doktrina tungkol sa gantimpala.
- issue: Saklaw ng הֵכִין דְּרָכָיו
  choice: “itinuon niya ang kanyang pamumuhay”
  alternative: “iniayos niya ang kanyang mga lakad” o “inihanda niya ang kanyang mga daan”
  rationale: Pinananatili nito ang diwa ng matatag at sinadyang disposisyon, ngunit iniiwasan ang di-natural o madaling mapagkamalang literal na paglalakbay.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “Jotam” bilang karaniwang anyong Tagalog ng pangalan at “PANGINOON” para sa יהוה. Walang footnote dahil kayang katawanin ng pangunahing salin ang kahulugan nang hindi kinakailangang lutasin nang labis ang saklaw ng “naging makapangyarihan.”
