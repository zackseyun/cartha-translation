translation_notes:
  register: Gumamit ng moderno, marangal, at madaling maunawaang Filipino. Pinanatili ang sinaunang mga yunit na “talento” at “kor” sa halip na gumamit ng di-tiyak na modernong conversion. Ginamit ang “Ammonita,” ang natural na katawagang etniko sa Filipino.
