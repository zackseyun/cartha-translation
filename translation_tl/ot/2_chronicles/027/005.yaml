  text: וְ֠/הוּא נִלְחַ֞ם עִם מֶ֣לֶךְ בְּנֵי עַמּוֹן֮ וַ/יֶּחֱזַ֣ק עֲלֵי/הֶם֒ וַ/יִּתְּנוּ ל֨/וֹ בְנֵֽי עַמּ֜וֹן בַּ/שָּׁנָ֣ה הַ/הִ֗יא מֵאָה֙ כִּכַּר כֶּ֔סֶף וַ/עֲשֶׂ֨רֶת אֲלָפִ֤ים כֹּרִים֙ חִטִּ֔ים וּ/שְׂעוֹרִ֖ים עֲשֶׂ֣רֶת אֲלָפִ֑ים זֹ֗את הֵשִׁ֤יבוּ ל/וֹ֙ בְּנֵ֣י עַמּ֔וֹן וּ/בַ/שָּׁנָ֥ה הַ/שֵּׁנִ֖ית וְ/הַ/שְּׁלִשִֽׁית־־־־־ס׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/027/005.yaml
  text: He fought with the king of the Ammonites and prevailed against them[a], and the Ammonites gave him that year one hundred talents of silver, ten thousand cors of wheat, and ten thousand of barley. This the Ammonites paid to him also in the second year and in the third.
translation:
  language: tl
  text: Nakipagdigma siya sa hari ng mga Ammonita at nanaig sa kanila. Noong taong iyon, ibinigay sa kanya ng mga Ammonita ang isang daang talento ng pilak, sampung libong kor ng trigo, at sampung libo ng sebada.[a] Ibinigay ding muli sa kanya ng mga Ammonita ang mga ito sa ikalawa at ikatlong taon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “sampung libong kor ng trigo, at sampung libo ng sebada”; nauunawaan na ang panukat na “kor” ay para rin sa sebada.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִלְחַם עִם
  choice: nakipagdigma ... sa
  rationale: Ipinapahayag ng Niphal ng לחם na may עִם ang pakikipaglaban; likas sa Tagalog ang “nakipagdigma sa,” at malinaw sa kasunod na sugnay na magkalaban ang dalawang panig.
- source_word: מֶלֶךְ בְּנֵי עַמּוֹן
  choice: hari ng mga Ammonita
  rationale: Ang בְּנֵי עַמּוֹן ay karaniwang katawagan sa bayang Ammon; ang “mga Ammonita” ay malinaw at natural na pangalang etniko sa Tagalog.
- source_word: וַיֶּחֱזַק עֲלֵיהֶם
  choice: nanaig sa kanila
  rationale: Sa kontekstong militar, ang חזק na may עַל ay tumutukoy sa pagkakaroon ng kapangyarihan o tagumpay laban sa kalaban, hindi lamang sa pagiging malakas.
- source_word: וַיִּתְּנוּ לוֹ
  choice: ibinigay sa kanya
  rationale: Pinananatili nito ang payak na kahulugan ng נתן, habang ipinahihiwatig ng konteksto na ang ibinigay ay tributo.
- source_word: מֵאָה כִּכַּר כֶּסֶף
  choice: 100 talento ng pilak
  rationale: Ang כִּכָּר ay sinaunang yunit ng timbang na karaniwang tinutumbasan ng “talento”; hindi ito ginawang makabagong timbang dahil hindi tiyak at nag-iiba ang eksaktong katumbas.
- source_word: כֹּרִים
  choice: kor
  rationale: Ang כֹּר ay sinaunang panukat sa tuyong bagay. Ang transliterasyong “kor” ay nagpapanatili sa tiyak na yunit nang hindi nagbibigay ng mapanlinlang na modernong katumbas.
- source_word: חִטִּים
  choice: trigo
  rationale: Ito ang karaniwan at malinaw na katumbas sa modernong Tagalog.
- source_word: וּשְׂעוֹרִים עֲשֶׂרֶת אֲלָפִים
  choice: at 10,000 ng sebada
  rationale: Hindi inuulit ng Hebreo ang yunit na “kor” bago ang sebada, kaya pinanatili sa pangunahing teksto ang elipsis at ipinaliwanag ito sa talababa.
- source_word: זֹאת הֵשִׁיבוּ לוֹ
  choice: Ibinigay ding muli sa kanya ... ang mga ito
  rationale: Ang Hiphil ng שׁוב ay literal na “ibinalik” o “ibinigay muli.” Dito ay tumutukoy ito sa muling paghahatid ng kaparehong tributo sa sumunod na mga taon; pinananatili ng “muli” ang aspektong pag-uulit.
- source_word: וּבַשָּׁנָה הַשֵּׁנִית וְהַשְּׁלִשִׁית
  choice: sa ikalawa at ikatlong taon
  rationale: Malinaw nitong ipinapahayag na naulit ang pagbibigay sa bawat isa sa dalawang sumunod na taon.
