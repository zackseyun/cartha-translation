  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: כֹּה אָמַ֞ר כּ֣וֹרֶשׁ מֶ֣לֶךְ פָּרַ֗ס כָּל מַמְלְכ֤וֹת הָ/אָ֨רֶץ֙ נָ֣תַן לִ֗/י יְהוָה֙ אֱלֹהֵ֣י הַ/שָּׁמַ֔יִם וְ/הֽוּא פָקַ֤ד עָלַ/י֙ לִ/בְנֽוֹת ל֣/וֹ בַ֔יִת בִּ/ירוּשָׁלִַ֖ם אֲשֶׁ֣ר בִּֽ/יהוּדָ֑ה מִֽי בָ/כֶ֣ם מִ/כָּל עַמּ֗/וֹ יְהוָ֧ה אֱלֹהָ֛י/ו עִמּ֖/וֹ וְ/יָֽעַל־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/023.yaml
  text: 'Thus says Cyrus king of Persia: Yahweh[a], the God of heaven, has given me all the kingdoms of the earth, and he has charged me to build for him a house in Jerusalem, which is in Judah. Whoever is among you of all his people, may Yahweh his God be with him[d][c][b], and let him go up.'
translation:
  language: tl
  text: 'Ganito ang sabi ni Ciro, hari ng Persia: “Ibinigay sa akin ni Yahweh[a], ang Diyos ng langit, ang lahat ng kaharian sa lupa. Inatasan niya akong magtayo para sa kanya ng isang bahay sa Jerusalem na nasa Juda. Sinuman sa inyo ang kabilang sa kanyang bayan[b]—sumakanya nawa si Yahweh na kanyang Diyos[c], at umahon na siya[d].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “Yahweh” ang personal na pangalan ng Diyos na kinakatawan ng apat na katinig na YHWH sa Hebreo.
    reason: divine_name
  - marker: b
    text: 'Mas literal: “Sino sa inyo, mula sa lahat ng kanyang bayan?” Siksik ang pariralang Hebreo at tumutukoy sa sinumang kabilang sa bayan ng Diyos.'
    reason: lexical_alternative
  - marker: c
    text: 'Maaari ring basahin: “Sumakanya si Yahweh na kanyang Diyos.” Walang tahasang pandiwa sa Hebreo; mas pinapaboran ng konteksto ang diwang isang bendisyon o kahilingan.'
    reason: alternative_reading
  - marker: d
    text: Ibig sabihin, umahon patungong Jerusalem. Ang “umahon” ang nakaugaliang biblikal na pananalita para sa pagpunta sa banal na lungsod.
    reason: cultural_note
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: Ganito ang sabi
  rationale: Likas na pormula sa modernong Tagalog para sa isang opisyal o maharlikang pahayag; pinananatili ang tuwirang pagpapakilala sa proklamasyon.
- source_word: כּוֹרֶשׁ מֶלֶךְ פָּרַס
  choice: Ciro, hari ng Persia
  rationale: Ginagamit ang nakaugaliang anyong Tagalog ng pangalan at ang malinaw na titulong maharlika.
- source_word: כָּל מַמְלְכוֹת הָאָרֶץ
  choice: ang lahat ng kaharian sa lupa
  rationale: Ipinahihiwatig ng אָרֶץ dito ang malawak na daigdig na saklaw ng mga kaharian, hindi lamang ang lupain ng Juda.
- source_word: נָתַן לִי
  choice: Ibinigay sa akin
  rationale: Tuwirang ipinapahayag ang natapos na pagkilos na may kasalukuyang bunga sa paghahari ni Ciro.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat ang personal na pangalang banal sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֵי הַשָּׁמַיִם
  choice: ang Diyos ng langit
  rationale: Ito ang natural at tumpak na katumbas sa Tagalog ng nakaugaliang pariralang Hebreo.
- source_word: וְהוּא פָקַד עָלַי
  choice: Inatasan niya ako
  rationale: Sa kontekstong ito, ang פקד ay tumutukoy sa pagbibigay ng awtoritatibong tungkulin o pananagutan.
- source_word: לִבְנוֹת לוֹ בַיִת
  choice: magtayo para sa kanya ng isang bahay
  rationale: Pinananatili ang literal na 'bahay' at ang teolohikal na diwa ng bahay ng Diyos, sa halip na agad itong ipakahulugang 'templo.'
- source_word: בִּירוּשָׁלִַם אֲשֶׁר בִּיהוּדָה
  choice: sa Jerusalem na nasa Juda
  rationale: Pinananatili ang tahasang sugnay na tumutukoy sa kinaroroonan ng Jerusalem.
- source_word: מִי בָכֶם מִכָּל עַמּוֹ
  choice: Sinuman sa inyo ang kabilang sa kanyang bayan
  rationale: 'Natural na ipinapahayag sa Tagalog ang siksik at partitive na pariralang Hebreo: maaaring tumugon ang sinumang kabilang sa bayan ng Diyos.'
- source_word: יְהוָה אֱלֹהָיו עִמּוֹ
  choice: sumakanya nawa si Yahweh na kanyang Diyos
  rationale: Ang anyong bendisyon o kahilingan ang pinakaangkop sa paanyayang konteksto, ngunit itinatala sa talababa ang posibleng pagbasa bilang pasalaysay.
- source_word: וְיָעַל
  choice: at umahon siya roon
  rationale: Pinananatili ang pandiwang 'umahon,' ang nakaugaliang biblikal na paglalarawan sa pagpunta sa Jerusalem; idinagdag ang 'roon' upang maging malinaw at natural sa Tagalog.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehova
  rationale: Personal na pangalan ang nasa tekstong Hebreo; pinananatili ito bilang Yahweh upang hindi ito mapalitan ng titulong 'Panginoon.'
- issue: Kahulugan ng בַיִת
  choice: bahay
  alternative: templo
  rationale: Bagaman ang templong itatayong muli ang tinutukoy, literal na 'bahay' ang Hebreo at mahalaga ang talinghaga ng tahanan o bahay ng Diyos.
- issue: Lakas ng יְהוָה אֱלֹהָיו עִמּוֹ
  choice: 'bendisyon: “sumakanya nawa si Yahweh na kanyang Diyos”'
  alternative: 'pasalaysay: “sumakanya si Yahweh na kanyang Diyos”'
  rationale: Mas natural sa pangwakas na paanyaya ang isang bendisyon, ngunit walang tahasang pandiwa sa Hebreo kaya nananatiling posible ang pasalaysay na pagbasa.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “Ganito ang sabi” bilang likas na pormula ng proklamasyon, “inatasan” para sa awtoritatibong komisyon, at “umahon” upang mapanatili ang biblikal na idyoma. Ang gitling bago ang bendisyon ay naghihiwalay sa pagkakakilanlan ng maaaring tumugon mula sa kasunod na pagpapala at utos.
