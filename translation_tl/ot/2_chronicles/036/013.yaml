id: 2CH.36.13
reference: 2 Chronicles 36:13
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ֠/גַם בַּ/מֶּ֤לֶךְ נְבֽוּכַדְנֶאצַּר֙ מָרָ֔ד אֲשֶׁ֥ר הִשְׁבִּיע֖/וֹ בֵּֽ/אלֹהִ֑ים וַ/יֶּ֤קֶשׁ אֶת עָרְפּ/וֹ֙ וַ/יְאַמֵּ֣ץ אֶת לְבָב֔/וֹ מִ/שּׁ֕וּב אֶל יְהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/013.yaml
  text: He also rebelled against King Nebuchadnezzar[a], who had made him swear by God; he stiffened his neck and hardened his heart from turning to Yahweh[b], the God of Israel.
translation:
  language: tl
  text: Naghimagsik din siya laban kay Haring Nebucadnezar[a], na nagpasumpa sa kanya sa ngalan ng Diyos. Pinatigas niya ang kanyang batok[b] at pinagmatigas ang kanyang puso upang hindi manumbalik kay Yahweh, ang Diyos ng Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “na nagbigkis sa kanya sa pamamagitan ng isang sumpa sa harap ng Diyos.” Maaaring idiin ng Hebreo ang pagpapasumpa sa ngalan ng Diyos o ang taimtim na pagbigkis ng sumpa sa harap niya.
    reason: lexical_alternative
  - marker: b
    text: Ang “pinatigas ang batok” ay isang idyomang Hebreo para sa sutil at matigas na paglaban.
    reason: cultural_note
lexical_decisions:
- source_word: וְגַם
  choice: Naghimagsik din siya
  rationale: Ipinahahayag ng וְגַם ang karagdagang ginawa niya sa nagpapatuloy na salaysay; natural sa Filipino ang paglalagay ng “din” kasunod ng pandiwa.
- source_word: בַּמֶּלֶךְ נְבוּכַדְנֶאצַּר מָרָד
  choice: naghimagsik ... laban kay Haring Nebucadnezar
  rationale: Sa pandiwang מָרַד, ang בְּ ay tumutukoy sa pinunong pinaghimagsikan. Ang “naghimagsik laban kay” ay malinaw at likas na katumbas sa Filipino.
- source_word: אֲשֶׁר הִשְׁבִּיעוֹ בֵּאלֹהִים
  choice: na nagpasumpa sa kanya sa ngalan ng Diyos
  rationale: Ang Hiphil ng שׁבע ay nangangahulugang magpasumpa o magpanumpa. Ipinakikita ng “sa ngalan ng Diyos” na ang Diyos ang pinananawagan sa sumpa, habang inilalahad sa talababa ang posibleng diin sa taimtim na sumpa sa harap ng Diyos.
- source_word: וַיֶּקֶשׁ אֶת עָרְפּוֹ
  choice: Pinatigas niya ang kanyang batok
  rationale: Pinananatili nito ang matingkad na idyomang Hebreo tungkol sa sutil na paglaban; ipinaliliwanag ang tayutay sa talababa.
- source_word: וַיְאַמֵּץ אֶת לְבָבוֹ
  choice: pinagmatigas ang kanyang puso
  rationale: Bagaman maaaring mangahulugan ang pandiwa na “palakasin,” sa kontekstong ito ay tumutukoy ito sa kusang pagpapatigas o pagpapatibay ng loob laban sa pagbabalik-loob.
- source_word: מִשּׁוּב אֶל יְהוָה
  choice: upang hindi manumbalik kay Yahweh
  rationale: Ang מִן kasunod ng pawatas ay maaaring magpahayag ng pagpigil o paglayo sa isang kilos. Likas sa Filipino ang “upang hindi manumbalik,” at malinaw nitong ipinahahayag ang pagtangging bumalik nang hindi dinaragdagan ang teksto ng tiyak na denominasyonal na kahulugan.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ang Diyos ng Israel
  rationale: Tuwirang inililipat ang anyong construct at pinananatili ang pagkakakilanlan kay Yahweh bilang Diyos ng Israel.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Tahasang ginagamit sa Hebreo ang Tetragrammaton. Ang “Yahweh” ay kumakatawan sa natatanging pangalang tipan nang hindi ito pinapalitan ng isang titulo.
- issue: Kaugnayan ng pagpapatigas ng puso sa hindi pagbabalik
  choice: upang hindi manumbalik
  alternative: kaya hindi siya nanumbalik; tumangging manumbalik
  rationale: Pinananatili ng napiling anyo ang ugnayan ng מִן at ng pawatas bilang pagpigil o paglayo, nang hindi lubusang nilulutas kung pangunahing diin ang layunin, bunga, o matigas na pagtutol.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang biblikal na larawan ng matigas na batok, ngunit nilagyan ito ng maikling paliwanag. Ginamit ang “kanyang” bilang karaniwang modernong anyo at ang pangalang “Nebucadnezar” ayon sa nakasanayang baybay sa Filipino.
