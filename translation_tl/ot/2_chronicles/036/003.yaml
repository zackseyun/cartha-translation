    rationale: Sa “inalis siya ... sa tungkulin sa Jerusalem,” maaaring maunawaan na ang Jerusalem ang lugar ng katungkulan, samantalang ang Hebreo ay naglalagay nito bilang lokasyon ng pagkilos. Ang paglalagay nito sa unahan ay nagpapalinaw.
  - severity: low
