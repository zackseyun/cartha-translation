  text: וַ/יְסִירֵ֥/הוּ מֶֽלֶךְ מִצְרַ֖יִם בִּֽ/ירוּשָׁלִָ֑ם וַֽ/יַּעֲנֹשׁ֙ אֶת הָ/אָ֔רֶץ מֵאָ֥ה כִכַּר כֶּ֖סֶף וְ/כִכַּ֥ר זָהָֽב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/003.yaml
  text: And the king of Egypt deposed him in Jerusalem and imposed on the land a tribute of a hundred talents of silver and a talent of gold[a][b][c].
translation:
  language: tl
  text: 'Sa Jerusalem, inalis siya ng hari ng Ehipto[a] at pinatawan niya ng multa ang lupain: isang daang talento ng pilak at isang talento ng ginto[b][c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “inalis siya sa tungkulin” o “dinala siya palayo.” Maaaring mangahulugan ang pandiwang Hebreo ng pag-aalis sa isang tao sa katungkulan o ng pagkuha sa kaniya mula sa isang lugar.
    reason: alternative_reading
  - marker: b
    text: O “pinatawan ang lupain ng salaping parusa.”
    reason: lexical_alternative
  - marker: c
    text: Ang talento ay isang malaking sinaunang yunit ng timbang. Pinanatili rito ang sinaunang sukat sa halip na tumbasan ito ng modernong yunit.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְסִירֵהוּ
  choice: inalis siya ... sa tungkulin
  rationale: Ang causative na anyo ng סוּר ay nangangahulugang alisin o paalisin. Sa konteksto ng hari, likas sa Filipino ang “inalis sa tungkulin,” habang ipinapahiwatig sa talababa na maaari rin itong tumukoy sa pagkuha o pagdadala sa kaniya.
- source_word: מֶלֶךְ מִצְרַיִם
  choice: ang hari ng Ehipto
  rationale: Tuwirang salin ng construct phrase; hindi idinaragdag ang pangalan ng paraon na wala sa talata.
- source_word: בִּירוּשָׁלָם
  choice: sa Jerusalem
  rationale: Ang בְּ ay lokatibo rito; natural sa Filipino ang “sa Jerusalem.”
- source_word: וַיַּעֲנֹשׁ
  choice: pinagmulta
  rationale: Ang עָנַשׁ ay tumutukoy sa pagpapataw ng salaping parusa. Mas tuwiran ang “pinagmulta” kaysa “pinarusahan” at hindi ipinapalagay na regular na buwis ang singil.
- source_word: הָאָרֶץ
  choice: ang lupain
  rationale: Tumutukoy ito sa nasasakupang lupain ng Juda, hindi sa buong daigdig.
- source_word: מֵאָה כִכַּר כֶּסֶף
  choice: isandaang talento ng pilak
  rationale: Pinananatili ang sinaunang yunit na כִּכָּר bilang “talento” sa halip na magbigay ng di-tiyak na modernong katumbas.
- source_word: וְכִכַּר זָהָב
  choice: at isang talento ng ginto
  rationale: Pinananatili ang tahasang isahang anyo at ang kaparehong sinaunang yunit ng timbang.
theological_decisions:
- issue: Saklaw ng pag-aalis kay Jehoahaz
  choice: inalis siya ... sa tungkulin
  alternative: dinala siya palayo
  rationale: Akma sa maharlikang konteksto ang pagtanggal sa tungkulin, ngunit hindi itinatago ang mas malawak na leksikal na posibilidad; nakatala ito sa talababa.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “inalis sa tungkulin” para sa malinaw na kontekstong pampolitika, “pinagmulta” para sa tiyak na salaping parusa, at “talento” upang mapanatili ang sinaunang panukat.
