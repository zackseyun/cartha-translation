    rationale: Bagaman posible ito sa konteksto, hindi tahasang sinasabi ng Hebreong pandiwa kung inalis siya sa katungkulan o kinuha/pinalayo siya. Dapat panatilihin sa pangunahing teksto ang saklaw ng pandiwa at ilagay ang “inalis sa tungkulin” bilang posibilidad sa talababa.
  - severity: low
