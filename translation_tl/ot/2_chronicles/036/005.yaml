  text: בֶּן עֶשְׂרִ֨ים וְ/חָמֵ֤שׁ שָׁנָה֙ יְהוֹיָקִ֣ים בְּ/מָלְכ֔/וֹ וְ/אַחַ֤ת עֶשְׂרֵה֙ שָׁנָ֔ה מָלַ֖ךְ בִּ/ירוּשָׁלִָ֑ם וַ/יַּ֣עַשׂ הָ/רַ֔ע בְּ/עֵינֵ֖י יְהוָ֥ה אֱלֹהָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/005.yaml
  text: Jehoiakim was twenty-five years old when he became king, and he reigned eleven years in Jerusalem. He did what was evil in the eyes of Yahweh his God.
translation:
  language: tl
  text: Dalawampu't limang taong gulang si Jehoiakim nang maging hari siya, at labing-isang taon siyang naghari sa Jerusalem. Ginawa niya ang masama sa paningin ni Yahweh na kanyang Diyos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן עֶשְׂרִים וְחָמֵשׁ שָׁנָה
  choice: Dalawampu't limang taong gulang
  rationale: Likas na salin sa modernong Tagalog ng karaniwang idyomang Hebreo para sa edad; hindi pinananatili ang literal ngunit di-likas na 'anak ng dalawampu't limang taon.'
- source_word: יְהוֹיָקִים
  choice: Jehoiakim
  rationale: Ginamit ang karaniwang anyo ng pangalang biblikal sa Tagalog.
- source_word: בְּמָלְכוֹ
  choice: nang maging hari siya
  rationale: Ipinahahayag ng pariralang may בְּ ang panahon ng pagluklok; natural at malinaw ito sa modernong Tagalog.
- source_word: וְאַחַת עֶשְׂרֵה שָׁנָה מָלַךְ
  choice: at labing-isang taon siyang naghari
  rationale: Ang מָלַךְ ay nangangahulugang maghari o maging hari; 'naghari' ang maikli at karaniwang salin sa pormulang panghari.
- source_word: בִּירוּשָׁלִָם
  choice: sa Jerusalem
  rationale: Tuwirang lokatibong parirala na tumutukoy sa lugar ng kanyang paghahari.
- source_word: וַיַּעַשׂ הָרַע
  choice: Ginawa niya ang masama
  rationale: Pinananatili ang pandiwang lakas at moral na pagtatasa ng Hebreong idyoma sa natural na Tagalog.
- source_word: בְּעֵינֵי
  choice: sa paningin ni
  rationale: Karaniwang Tagalog na katumbas ng Hebreong idyoma para sa pagsusuri ayon sa pananaw ng isang tao.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang isinasatitik ang banal na pangalang YHWH sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהָיו
  choice: kanyang Diyos
  rationale: Pinananatili ang panghalip na ikatlong panauhang panlalaki na tumutukoy kay Jehoiakim at ang ugnayang ipinahahayag ng parirala.
theological_decisions:
- issue: Pagsasalin ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; PANGINOON
  rationale: Personal na pangalan ang nasa tekstong Hebreo. Pinananatili ng 'Yahweh' ang pangalan sa halip na palitan ito ng titulong 'PANGINOON.'
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang maikli at pormulang estilo ng tala tungkol sa paghahari, pati ang Hebreong idyomang 'sa paningin ni' dahil malinaw at natural din ito sa Tagalog.
