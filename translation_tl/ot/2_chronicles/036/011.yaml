base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/011.yaml
  text: Zedekiah was twenty-one years old when he became king, and he reigned eleven years in Jerusalem.
translation:
  language: tl
  text: Dalawampu't isang taong gulang si Zedekias nang siya ay maging hari, at labing-isang taon siyang naghari sa Jerusalem.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן עֶשְׂרִים וְאַחַת שָׁנָה
  choice: Dalawampu't isang taong gulang
  rationale: Ang בֶּן na sinusundan ng bilang at שָׁנָה ay isang Hebreong pormula para sa edad; natural at malinaw itong ipinahahayag sa modernong Tagalog bilang “... taong gulang.”
- source_word: צִדְקִיָּהוּ
  choice: Zedekias
  rationale: Ginamit ang nakaugaliang anyo ng pangalang ito sa mga saling Bibliya sa Tagalog.
- source_word: בְמָלְכוֹ
  choice: nang siya ay maging hari
  rationale: Ipinahihiwatig ng בְּ na kalakip ng anyong pandiwa ang panahon ng pagluklok niya bilang hari; pinananatili ng salin ang temporal na diwa sa natural na Tagalog.
- source_word: וְאַחַת עֶשְׂרֵה שָׁנָה
  choice: at labing-isang taon
  rationale: Tuwirang isinasaad ang tagal ng paghahari, at pinananatili ang pang-ugnay na וְ bilang “at.”
- source_word: מָלַךְ
  choice: naghari
  rationale: Tiyak na tumutukoy ang pandiwa sa pamamahala bilang hari; “naghari” ang maikli at likas na katumbas sa Tagalog.
- source_word: בִּירוּשָׁלִָם
  choice: sa Jerusalem
  rationale: Ang pang-ukol na בְּ ay lokatibo rito, kaya ang natural na salin ay “sa Jerusalem.”
