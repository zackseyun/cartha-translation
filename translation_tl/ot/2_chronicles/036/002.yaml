  yaml_path: translation/ot/2_chronicles/036/002.yaml
  text: Jehoahaz was twenty-three years old when he became king[a], and he reigned three months in Jerusalem.
translation:
  language: tl
  text: Dalawampu't tatlong taong gulang si Jehoahaz nang maging hari siya[a], at tatlong buwan siyang naghari sa Jerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal na, “anak ng dalawampu't tatlong taon”—isang karaniwang idyomang Hebreo para sa edad.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן שָׁלֹשׁ וְעֶשְׂרִים שָׁנָה
  choice: Dalawampu't tatlong taong gulang
  rationale: Ang literal na Hebreong idyoma ay “anak ng dalawampu't tatlong taon,” ngunit ang likas at eksaktong katumbas nito sa modernong Tagalog ay “dalawampu't tatlong taong gulang.”
- source_word: יוֹאָחָז
  choice: Jehoahaz
  rationale: Ginamit ang kinikilalang transliterasyon ng pangalang Hebreo na karaniwan sa tradisyong biblikal sa Filipino.
- source_word: בְּמָלְכוֹ
  choice: nang siya ay maging hari
  rationale: Ipinahihiwatig ng anyong Hebreo ang panahon ng pagluklok o pagsisimula ng paghahari; malinaw at natural itong ipinapahayag sa Tagalog bilang “nang siya ay maging hari.”
- source_word: וּשְׁלֹשָׁה חֳדָשִׁים
  choice: at tatlong buwan
  rationale: Tuwirang isinasalin ang pang-ugnay, bilang, at pangngalan habang pinananatili ang natural na ayos ng pangungusap sa Tagalog.
- source_word: מָלַךְ
  choice: naghari
  rationale: Sa pormulang tumutukoy sa mga hari, ang “naghari” ang maikli, natural, at tiyak na katumbas ng pandiwang Hebreo.
- source_word: בִּירוּשָׁלִָם
  choice: sa Jerusalem
  rationale: Ang pang-ukol na Hebreo ay nagsasaad ng lokasyon; “sa Jerusalem” ang tuwiran at natural na salin sa Tagalog.
