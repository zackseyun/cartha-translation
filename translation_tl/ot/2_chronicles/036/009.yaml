  text: בֶּן שְׁמוֹנֶ֤ה שָׁנִים֙ יְהוֹיָכִ֣ין בְּ/מָלְכ֔/וֹ וּ/שְׁלֹשָׁ֤ה חֳדָשִׁים֙ וַ/עֲשֶׂ֣רֶת יָמִ֔ים מָלַ֖ךְ בִּ/ירוּשָׁלִָ֑ם וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/009.yaml
  text: Jehoiachin was eight years old when he began to reign[a], and he reigned three months and ten days in Jerusalem. He did what was evil in the sight of Yahweh.
translation:
  language: tl
  text: Walong taong gulang si Jehoiakin nang magsimula siyang maghari[a], at naghari siya sa Jerusalem nang tatlong buwan at sampung araw. Ginawa niya ang masama sa paningin ni Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa 2 Hari 24:8, “labingwalong taong gulang” ang mababasa sa halip na “walong taong gulang.”
    reason: textual_variant
lexical_decisions:
- source_word: בֶּן שְׁמוֹנֶה שָׁנִים
  choice: Walong taong gulang
  rationale: Likas na salin sa Filipino ng idyomang Hebreo para sa edad, na literal na ‘anak ng walong taon.’
- source_word: יְהוֹיָכִין
  choice: Jehoiakin
  rationale: Transliterasyon ng personal na pangalan na angkop sa karaniwang anyo sa Filipino.
- source_word: בְּמָלְכוֹ
  choice: nang magsimula siyang maghari
  rationale: Ipinahahayag ng konstruksiyon ang panahon ng pagluklok niya bilang hari.
- source_word: וּשְׁלֹשָׁה חֳדָשִׁים וַעֲשֶׂרֶת יָמִים
  choice: tatlong buwan at sampung araw
  rationale: Tuwirang salin ng haba ng paghahari.
- source_word: מָלַךְ
  choice: naghari siya
  rationale: Karaniwang salin ng pandiwang מלך sa pormula tungkol sa paghahari.
- source_word: בִּירוּשָׁלָם
  choice: sa Jerusalem
  rationale: Tuwirang salin ng pariralang panlunan.
- source_word: וַיַּעַשׂ הָרַע
  choice: Ginawa niya ang masama
  rationale: Pinananatili ang karaniwang idyomang Hebreo tungkol sa masamang asal sa malinaw at natural na Filipino.
- source_word: בְּעֵינֵי יְהוָה
  choice: sa paningin ni Yahweh
  rationale: Pinananatili ang metapora ng banal na pagsusuri habang natural sa Filipino.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
theological_decisions:
- issue: Pagkakaiba sa edad ni Jehoiakin kumpara sa 2 Hari 24:8
  choice: Pinanatili sa pangunahing teksto ang ‘walong taong gulang’ ayon sa tekstong Masoretiko ng 2 Cronica 36:9.
  alternative: Labingwalong taong gulang.
  rationale: Ang ibinigay na tekstong Hebreo ay malinaw na nagsasabing ‘walo.’ Hindi dapat tahimik na pagtugmain ang talata sa kaparehong ulat; inilalagay sa talababa ang mahalagang pagkakaiba.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang maikling pormula ng tala tungkol sa paghahari at ang tunay na tensiyong tekstuwal.
