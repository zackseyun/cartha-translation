base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/021.yaml
  text: to fulfill the word of Yahweh by the mouth of Yirmeyahu[a], until the land had enjoyed its Sabbaths. All the days of its desolation it kept Sabbath[d][c][b], to fulfill seventy years.
translation:
  language: tl
  text: upang matupad ang salita ni Yahweh sa pamamagitan ni Jeremias[a], hanggang sa matamasa ng lupain ang mga Sabbath nito. Sa buong panahon ng pagkatiwangwang nito, nagpahinga ito[b][c], upang malubos ang pitumpung taon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa pamamagitan ng bibig ni Jeremias.” Sa literal, “sa pamamagitan ng bibig ni Jeremias.”
    reason: lexical_alternative
  - marker: b
    text: 'O “nangilin ito ng Sabbath.” Pinananatili ng Hebreo ang paglalaro sa salitang Sabbath/pahinga: “mga Sabbath nito ... nagpahinga ito.”'
    reason: lexical_alternative
  - marker: c
    text: Umaalingawngaw rito ang babala ng tipan na tatamasahin ng lupain ang mga Sabbath nito habang walang naninirahan dito (tingnan ang Levitico 26:34–35).
    reason: cross_reference
lexical_decisions:
- source_word: לְמַלֹּאות
  choice: upang matupad
  rationale: Ipinahahayag ng infinitive na may לְ ang layunin o kinalabasan; pinananatili ng “matupad” ang diwa ng katuparan ng ipinahayag na salita.
- source_word: דְּבַר יְהוָה
  choice: ang salita ni Yahweh
  rationale: Ang דָּבָר ay tumutukoy rito sa propetikong salita; ang personal na pangalang יהוה ay isinaling “Yahweh.”
- source_word: בְּפִי יִרְמְיָהוּ
  choice: sa pamamagitan ng bibig ni Jeremias
  rationale: Pinananatili ang konkretong Hebreong idyoma at larawan ng propetang nagsasalita, habang likas pa ring nauunawaan sa Filipino.
- source_word: רָצְתָה
  choice: matamasa
  rationale: Sa kontekstong ito, ang lupain ang simuno at ang mga Sabbath nito ang layon; ipinahihiwatig na natanggap at naranasan ng lupain ang ipinagkait na kapahingahang Sabbath.
- source_word: הָאָרֶץ
  choice: ang lupain
  rationale: Tumutukoy ito sa lupain ng Juda, hindi sa buong daigdig.
- source_word: אֶת שַׁבְּתוֹתֶיהָ
  choice: ang mga Sabbath nito
  rationale: Pinananatili ang pangmaramihang Sabbath at ang kaugnayan nito sa nakatakdang kapahingahan ng lupain.
- source_word: כָּל יְמֵי הָשַּׁמָּה
  choice: Sa buong panahon ng pagkatiwangwang nito
  rationale: Natural na Filipino para sa lahat ng araw na nanatiling wasak at walang naninirahan ang lupain.
- source_word: שָׁבָתָה
  choice: nangilin ito ng Sabbath
  rationale: 'Pinananatili ang sadyang paglalaro sa magkaugnay na pangngalan at pandiwa: “mga Sabbath ... nangilin ng Sabbath.”'
- source_word: לְמַלֹּאות שִׁבְעִים שָׁנָה
  choice: upang malubos ang pitumpung taon
  rationale: Ang “malubos” ay natural sa Filipino para sa pagkumpleto ng takdang panahon, habang inilalantad ang pag-uulit ng ideya ng מלא sa talata.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Personal na pangalan ang nasa Hebreo; pinananatili ito bilang “Yahweh” sa halip na palitan ng titulo.
- issue: Pagpapanatili sa teolohiya at wordplay ng Sabbath sa שַׁבְּתוֹתֶיהָ / שָׁבָתָה
  choice: mga Sabbath nito ... nangilin ito ng Sabbath
  alternative: mga kapahingahan nito ... nagpahinga ito
  rationale: Ginagawang hayag ng Hebreo ang ugnayan ng pagkatiwangwang ng lupain at ng ipinagkait na kapahingahang Sabbath; hindi ito dapat gawing pangkalahatang pahinga lamang.
- issue: Ugnayan ng “pitumpung taon” sa unang sugnay
  choice: upang malubos ang pitumpung taon
  alternative: hanggang makumpleto ang pitumpung taon
  rationale: Pinananatili ang layunin o kinalabasan ng ikalawang לְמַלֹּאות nang hindi tinutukoy nang higit sa Hebreo kung eksaktong alin sa magkakaugnay na pangyayari ang binabago nito.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “pagkatiwangwang” para sa lupain at ang “nangilin ng Sabbath” upang mapanatili ang natatanging Hebreong wordplay. Inangkop ang pangalang יִרְמְיָהוּ sa karaniwang anyong Filipino na “Jeremias,” samantalang pinanatili ang “Yahweh” bilang banal na pangalan.
