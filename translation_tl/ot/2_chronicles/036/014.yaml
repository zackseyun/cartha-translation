  text: גַּ֠ם כָּל שָׂרֵ֨י הַ/כֹּהֲנִ֤ים וְ/הָ/עָם֙ הִרְבּ֣וּ לִ/מְעָול מַ֔עַל כְּ/כֹ֖ל תֹּעֲב֣וֹת הַ/גּוֹיִ֑ם וַֽ/יְטַמְּאוּ֙ אֶת בֵּ֣ית יְהוָ֔ה אֲשֶׁ֥ר הִקְדִּ֖ישׁ בִּ/ירוּשָׁלִָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/014.yaml
  text: Also all the leaders of the priests and the people increased in unfaithfulness[a], according to all the abominations of the nations, and they defiled the house of Yahweh[b], which he had consecrated in Jerusalem.
translation:
  language: tl
  text: Bukod dito, lalo pang nagtaksil ang lahat ng mga pinuno ng mga pari at ng bayan, gaya ng lahat ng kasuklam-suklam na gawain ng mga bansa[a]. Dinungisan nila ang bahay ni Yahweh[b], na ginawa niyang banal sa Jerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “ayon sa lahat ng kasuklam-suklam na gawain ng mga bansa” o “alinsunod sa lahat ng karumal-dumal na kaugalian ng mga bansa.”
    reason: lexical_alternative
  - marker: b
    text: Ang “Yahweh” ay salin-titik ng banal na pangalang YHWH.
    reason: alternative_reading
lexical_decisions:
- source_word: גַּם
  choice: Bukod dito
  rationale: Nag-uugnay ito sa naunang konteksto at natural na nagpapakita ng karagdagang paglala.
- source_word: כָּל שָׂרֵי הַכֹּהֲנִים וְהָעָם
  choice: ang lahat ng mga pinuno ng mga pari at ang bayan
  rationale: Pinananatili ang pagkakaiba ng mga pinuno ng kaparian sa mga pari bilang isang buong pangkat, pati ang hiwalay na pagbanggit sa bayan.
- source_word: הִרְבּוּ לִמְעָול מַעַל
  choice: lalo pang nagtaksil
  rationale: Ipinahahayag ng 'lalo pang' ang pagpapasidhi sa Hiphil na הִרְבּוּ, samantalang ang 'nagtaksil' ay naghahatid ng paglabag sa katapatan sa Diyos na taglay ng מָעַל. Mas natural ito sa modernong Tagalog kaysa sa literal na 'pinarami ang kanilang pagtataksil.'
- source_word: כְּכֹל תֹּעֲבוֹת הַגּוֹיִם
  choice: gaya ng lahat ng kasuklam-suklam na gawain ng mga bansa
  rationale: Ang 'gaya ng' ay nagpapanatili sa paghahambing o pagsunod sa halimbawa na maaaring ipahiwatig ng כְּכֹל; nililinaw ng 'mga gawain' na mga kasuklam-suklam na kaugalian ang tinutukoy.
- source_word: וַיְטַמְּאוּ
  choice: Dinungisan nila
  rationale: Ang 'dinungisan' ay natural at mabigat na katumbas sa konteksto ng moral at ritwal na paglapastangan sa templo.
- source_word: בֵּית יְהוָה
  choice: ang bahay ni Yahweh
  rationale: Pinananatili ang literal at teolohikal na makabuluhang larawang 'bahay,' sa halip na gawing tahasang 'templo.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat ang personal na pangalang banal na YHWH sa halip na palitan ito ng isang titulo.
- source_word: אֲשֶׁר הִקְדִּישׁ בִּירוּשָׁלִָם
  choice: na ginawa niyang banal sa Jerusalem
  rationale: Malinaw at madaling maunawaan nitong ipinapahayag na ang bahay ay ibinukod ng Diyos bilang banal sa Jerusalem, nang hindi gumagamit ng mas teknikal na salitang 'kinonsekrar.'
theological_decisions:
- issue: Ang covenantal at panrelihiyong paglabag na ipinahahayag ng מָעַל
  choice: nagtaksil
  alternative: naging di-tapat; nagkasala nang mabigat
  rationale: Ipinakikita ng 'nagtaksil' ang sinadyang paglabag sa katapatan sa Diyos at hindi ito nililimitahan sa isang legal na pagkakasala lamang.
- issue: Paglalarawan sa mga kasuklam-suklam na gawain ng mga bansa
  choice: gaya ng
  alternative: ayon sa; alinsunod sa
  rationale: May saklaw ang כְּ־ para sa paghahambing at pag-ayon. Pinili ang natural na 'gaya ng' habang pinananatili sa talababa ang posibleng diwa ng pagsunod sa kanilang mga gawain.
- issue: Paglilipat sa יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Pinananatili ang banal na personal na pangalan sa tekstong Hebreo sa halip na tahimik na palitan ito ng titulo.
- issue: Ang gumawa ng bahay na banal
  choice: si Yahweh, na tinutukoy ng 'niyang'
  alternative: walang tahasang panghalip na pantukoy sa kasarian
  rationale: Ang ikatlong panauhang panlalaking isahan sa הִקְדִּישׁ ay tumutukoy kay Yahweh; natural itong ipinahahayag ng 'niyang' sa Tagalog.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang 'bahay ni Yahweh' upang mapanatili ang Hebreong larawan, at 'lalo pang nagtaksil' upang pagsamahin ang pagpapasidhi at ang diwa ng paglabag sa katapatan nang hindi tunog-salin.
