  source_fidelity: 'Ang diwa ng talata ay wastong naipapahayag: lumubha ang di-katapatan ng mga pinuno, ang kanilang kilos ay umayon sa kasuklam-suklam na gawain ng mga bansa, at dinungisan nila ang bahay ni Yahweh. Gayunman, ang "mga pinuno ng mga pari at ang bayan" ay maaaring magmukhang ibinubukod ang bayan mula sa saklaw ng mga pinuno. Ang pag-uulit ng "ng" ay mas tumpak na naghahayag na ang mga pinuno ay kaugnay kapwa ng mga pari at ng bayan.'
  naturalness: Marangal at natural ang pangkalahatang rehistro. Ang "lalo pang nagtaksil" ay maikli ngunit sapat na nagpapahiwatig ng pagpapasidhi at ng paglabag sa katapatan. Ang "dinungisan" at "ginawa niyang banal" ay malinaw sa modernong Tagalog.
