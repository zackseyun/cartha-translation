  text: וַ/יִּקְחוּ֙ עַם הָ/אָ֔רֶץ אֶת יְהוֹאָחָ֖ז בֶּן יֹאשִׁיָּ֑הוּ וַ/יַּמְלִיכֻ֥/הוּ תַֽחַת אָבִ֖י/ו בִּ/ירוּשָׁלִָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/001.yaml
  text: Then the people of the land took Jehoahaz son of Josiah and made him king in Jerusalem in place of his father[a].
translation:
  language: tl
  text: Pagkatapos, kinuha ng mga tao ng lupain[a] si Jehoahaz na anak ni Josias at ginawa siyang hari sa Jerusalem bilang kahalili ng kanyang ama.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring, “mga karaniwang tao.” Ang Hebreong pananalitang “mga tao ng lupain” ay maaaring tumukoy sa populasyon ng lupain at, sa ilang konteksto, sa isang partikular na pangkat sa lipunan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: kinuha
  rationale: Karaniwang kahulugan ng לקח sa kontekstong ito ang pagkuha o pagpili ng isang tao para sa isang layunin. Hindi ginamit ang “dinakip” sapagkat hindi tahasang ipinahihiwatig ng talata ang pamimilit.
- source_word: עַם הָאָרֶץ
  choice: mga mamamayan ng lupain
  rationale: Pinananatili nito ang konkretong Hebreong pananalita habang natural sa makabagong Tagalog. Hindi nito agad nililimitahan ang tinutukoy sa isang tiyak na uring panlipunan.
- source_word: יְהוֹאָחָז
  choice: Jehoahaz
  rationale: Ginamit ang karaniwang anyong Filipino ng pangalang biblikal na Jehoahaz.
- source_word: בֶּן יֹאשִׁיָּהוּ
  choice: anak ni Josias
  rationale: Tuwiran at natural na salin ng ugnayang angkan; ginamit ang nakaugaliang anyong Filipino na Josias.
- source_word: וַיַּמְלִיכֻהוּ
  choice: ginawa siyang hari
  rationale: Ipinahahayag nito ang causative na diwa ng Hiphil ng מלך nang hindi nagdaragdag ng seremonya ng pagpuputong na hindi binanggit sa Hebreo.
- source_word: תַּחַת אָבִיו
  choice: bilang kahalili ng kanyang ama
  rationale: Ang תַּחַת dito ay tumutukoy sa paghalili o pagpalit sa paghahari, hindi sa lokasyong nasa ilalim ng ama.
- source_word: בִּירוּשָׁלִָם
  choice: sa Jerusalem
  rationale: Natural na katumbas sa Tagalog ng pang-ukol ב na kasama ng pangalan ng lugar.
