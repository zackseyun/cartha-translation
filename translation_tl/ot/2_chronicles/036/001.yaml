  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang Hebreong idyomang “mga mamamayan ng lupain” upang huwag isara ang tunay na lawak ng kahulugan; ipinaliwanag sa talababa ang posibleng panlipunang diwa.
