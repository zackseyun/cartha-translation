id: 2CH.36.15
reference: 2 Chronicles 36:15
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יִּשְׁלַ֡ח יְהוָה֩ אֱלֹהֵ֨י אֲבוֹתֵי/הֶ֧ם עֲלֵי/הֶ֛ם בְּ/יַ֥ד מַלְאָכָ֖י/ו הַשְׁכֵּ֣ם וְ/שָׁל֑וֹחַ כִּֽי חָמַ֥ל עַל עַמּ֖/וֹ וְ/עַל מְעוֹנֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/015.yaml
  text: And Yahweh[a], the God of their fathers, sent word to them by the hand of his messengers, rising early and sending[c][b], because he had compassion on his people and on his dwelling place.
translation:
  language: tl
  text: At si Yahweh[a], ang Diyos ng kanilang mga ninuno, ay paulit-ulit na nagpadala sa kanila ng mensahe sa pamamagitan ng kaniyang mga sugo,[b] sapagkat nahabag siya sa kaniyang bayan at sa kaniyang tahanan.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Yahweh: ang personal na pangalan ng Diyos, na kinakatawan sa Hebreo ng apat na katinig na YHWH.'
    reason: cultural_note
  - marker: b
    text: Sa literal, “sa kamay ng kaniyang mga sugo, maagang bumabangon at nagpapadala”—isang Hebreong idyoma na nagpapahayag ng masigasig at paulit-ulit na pagpapadala.
    reason: lexical_alternative
  - marker: c
    text: Ang tinutukoy na tahanan ng Diyos ay ang templo sa Jerusalem.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ang pangalang banal na YHWH at malinaw itong naiiba sa titulong “Panginoon.”
- source_word: אֱלֹהֵי אֲבוֹתֵיהֶם
  choice: ang Diyos ng kanilang mga ninuno
  rationale: Likas sa modernong Filipino at pinananatili ang makasaysayan at tipanang kaugnayan sa mga naunang salinlahi.
- source_word: וַיִּשְׁלַח ... עֲלֵיהֶם
  choice: nagpadala sa kanila ng mensahe
  rationale: Bagaman walang tahasang layon sa Hebreo, ipinahihiwatig ng mga sugo ang mensaheng ipinadala; natural ito sa Filipino nang hindi tinutukoy ang tiyak na nilalaman.
- source_word: בְּיַד מַלְאָכָיו
  choice: sa pamamagitan ng kaniyang mga sugo
  rationale: Ang Hebreong “sa kamay ng” ay idyoma ng pagganap o ahensiya; ang natural na katumbas sa Filipino ay “sa pamamagitan ng.”
- source_word: מַלְאָכָיו
  choice: kaniyang mga sugo
  rationale: Ang konteksto ay tumutukoy sa mga taong ipinadala upang maghatid ng babala, malamang na mga propeta; iniiwasan ng “sugo” ang di-kinakailangang pagpapakahulugang mga anghel sila.
- source_word: הַשְׁכֵּם וְשָׁלוֹחַ
  choice: paulit-ulit na nagpadala
  rationale: Ang literal na “maagang bumabangon at nagpapadala” ay Hebreong idyoma para sa masigasig at patuloy na pagpapadala. Inilalagay sa talababa ang literal na larawan.
- source_word: כִּי חָמַל
  choice: sapagkat nahabag siya
  rationale: Ipinahahayag ng חמל ang habag na nagtutulak upang magligtas o magpaliban ng kaparusahan; ang “nahabag” ay maikli, dignificado, at natural.
- source_word: עַל עַמּוֹ
  choice: sa kaniyang bayan
  rationale: Ang “bayan” ay angkop sa tipanang kolektibong kahulugan ng עַם at natural na katuwang ng pandiwang “nahabag.”
- source_word: מְעוֹנוֹ
  choice: kaniyang tahanan
  rationale: Pinananatili ang leksikal na larawan ng tirahan ng Diyos sa halip na tahasang ipalit ang interpretatibong “templo.”
theological_decisions:
- issue: Pagkakakilanlan ng “kaniyang mga sugo”
  choice: Mga taong sugong tagapagdala ng mensahe, na ayon sa konteksto ay mga propeta
  alternative: Mga anghel na makalangit
  rationale: Ang kasunod na talata ay nagsasalita tungkol sa paghamak sa mga sugo at propeta ng Diyos. Hindi hinihingi ng מַלְאָךְ dito ang kahulugang makalangit na anghel.
- issue: Kahulugan ng “kaniyang tahanan”
  choice: Panatilihin ang metapora ng tahanan ng Diyos
  alternative: Isalin nang tuwiran bilang “kaniyang templo”
  rationale: Sa konteksto, ang templo sa Jerusalem ang tinutukoy, ngunit pinananatili ng “tahanan” ang teolohikal na wika tungkol sa presensiya ng Diyos nang hindi pinapantay lamang sa isang gusali.
- issue: Pagpapahayag ng paulit-ulit at masigasig na pagpapadala
  choice: Ihayag ang idyomatikong diwa sa pangunahing teksto
  alternative: Panatilihin ang literal na “maagang bumabangon at nagpapadala”
  rationale: Hindi literal na kailangang bumangon ang Diyos nang maaga. Ang Hebreong anyo ay nagdidiin sa patuloy at maalagang pagbibigay-babala; pinananatili sa talababa ang orihinal na larawan.
translation_notes:
  register: Modernong Filipino na dignificado at madaling maunawaan. Ginamit ang “mga ninuno,” “mga sugo,” at “tahanan” upang maging natural ngunit manatiling malapit sa Hebreo. Isinalin ang Hebreong idyoma ayon sa diwa sa pangunahing teksto at ipinaliwanag ang literal na larawan sa talababa.
