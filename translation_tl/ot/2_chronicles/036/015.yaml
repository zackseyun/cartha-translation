  source_fidelity: 'Tapat ang salin sa Hebreo. Ang “paulit-ulit na nagpadala” ay wastong idyomatikong pagsasalin ng הַשְׁכֵּם וְשָׁלוֹחַ, na nagpapahiwatig ng masigasig at patuloy na pagpapadala. Napananatili rin ang ahensiya ng mga sugo, ang habag ng Diyos, at ang dalawang layon ng habag: ang kaniyang bayan at kaniyang tirahan.'
  naturalness: Natural at marangal ang modernong Filipino. Ang “Diyos ng kanilang mga ninuno,” “sa pamamagitan ng kaniyang mga sugo,” at “nahabag siya” ay malinaw at angkop sa rehistro. Ang “kaniyang tahanan” ay nauunawaan sa konteksto at sinusuportahan ng talababa.
  terminology: Wasto at pare-pareho ang “Yahweh,” “Diyos,” “mga sugo,” “bayan,” at “tahanan.” Ang “mga sugo” ay mas angkop kaysa “mga anghel” sa kontekstong ito at hindi nag-uutos ng isang hindi kailangan na pagpapakahulugan.
