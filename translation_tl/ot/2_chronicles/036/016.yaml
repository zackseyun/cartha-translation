id: 2CH.36.16
reference: 2 Chronicles 36:16
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יִּֽהְי֤וּ מַלְעִבִים֙ בְּ/מַלְאֲכֵ֣י הָ/אֱלֹהִ֔ים וּ/בוֹזִ֣ים דְּבָרָ֔י/ו וּ/מִֽתַּעְתְּעִ֖ים בִּ/נְבִאָ֑י/ו עַ֠ד עֲל֧וֹת חֲמַת יְהוָ֛ה בְּ/עַמּ֖/וֹ עַד לְ/אֵ֥ין מַרְפֵּֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/016.yaml
  text: But they kept mocking the messengers of God[a], despising his words, and scoffing at his prophets, until the wrath of Yahweh rose against his people[b], until there was no remedy.
translation:
  language: tl
  text: Ngunit patuloy nilang kinutya ang mga sugo ng Diyos[a], hinamak ang kanyang mga salita, at nilait ang kanyang mga propeta, hanggang sa mag-alab ang poot ni Yahweh laban sa kanyang bayan, hanggang sa wala nang lunas.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga anghel ng Diyos”; ngunit sa kontekstong ito, malinaw na pumapabor ang “mga sugo,” samakatuwid ay mga taong isinugo ng Diyos, dahil binabanggit sa kasunod na parirala ang “kanyang mga propeta.”
    reason: lexical_alternative
  - marker: b
    text: O “wala nang pagpapagaling” o “hindi na ito malulunasan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: patuloy nilang
  rationale: Kasama ng mga kasunod na participle, nagpapahayag ito ng nagpapatuloy o nakaugaliang kilos sa nakaraan.
- source_word: מַלְעִבִים
  choice: kinutya
  rationale: Ipinahahayag ng salita ang mapanghamak na panunuya; natural at malinaw ang “kinutya” sa modernong Tagalog.
- source_word: בְּמַלְאֲכֵי הָאֱלֹהִים
  choice: ang mga sugo ng Diyos
  rationale: Maaaring tumukoy ang מַלְאָךְ sa sugo o anghel, ngunit ang pagkakatulad nito sa “kanyang mga propeta” ay malinaw na pumapabor sa mga taong isinugo ng Diyos.
- source_word: וּבוֹזִים דְּבָרָיו
  choice: hinamak ang kanyang mga salita
  rationale: Ang בזה ay mapanghamak na pagtanggi, at pinananatili ng “mga salita” ang anyong maramihan ng Hebreo.
- source_word: וּמִתַּעְתְּעִים בִּנְבִאָיו
  choice: nilait ang kanyang mga propeta
  rationale: Ang “nilait” ay naghahatid ng mapanuyang paghamak habang iniiwasan ang di-kailangang pag-uulit sa “kinutya.”
- source_word: עַד עֲלוֹת חֲמַת יְהוָה
  choice: hanggang sa mag-alab ang poot ni Yahweh
  rationale: Ang חֵמָה ay matinding galit; ang “mag-alab” ay likas na idyomang Tagalog na kumakatawan sa pag-igting o pagsiklab ng poot.
- source_word: בְּעַמּוֹ
  choice: laban sa kanyang bayan
  rationale: Sa konteksto ng poot at paghuhukom, ipinakikita ng pang-ukol ang bayan bilang tudlaan ng galit.
- source_word: עַד לְאֵין מַרְפֵּא
  choice: hanggang sa wala nang lunas
  rationale: Ang מַרְפֵּא ay maaaring “pagpapagaling” o “lunas”; ang huli ay natural sa Tagalog at nagpapanatili sa diwa ng hindi na maaagapang kalagayan.
theological_decisions:
- issue: Tinutukoy ng “mga sugo ng Diyos”
  choice: mga taong isinugo ng Diyos bilang mga propetikong mensahero
  alternative: mga anghel ng Diyos
  rationale: Ang kasunod at kapantay na pariralang “kanyang mga propeta” ay pumapabor sa mga taong mensahero, bagaman pinananatili sa talababa ang likas na alternatibong kahulugan.
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehovah
  rationale: Direktang pinananatili ang personal na banal na pangalan sa tekstong Hebreo nang hindi ito pinapalitan ng titulo.
- issue: Larawan ng pagtaas ng banal na poot
  choice: mag-alab ang poot
  alternative: tumaas ang poot
  rationale: Ipinakikita ng idyomang Tagalog ang pagsiklab ng matinding galit nang hindi binabawasan ang bigat ng banal na paghuhukom.
translation_notes:
  register: 'Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “sugo” sa halip na mas teknikal na “mensahero,” at pinanatili ang tatlong magkakaugnay ngunit magkakaibang kilos: kinutya, hinamak, at nilait.'
