translation:
  language: tl
  text: Nagmartsa laban sa kanya si Nebucadnezar, hari ng Babilonia, at iginapos siya sa mga tanikalang tanso upang dalhin siya sa Babilonia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga panaling tanso” o “mga posas na tanso.” Ang Hebreo ay tumutukoy sa mga panaling yari sa tanso na ikinabit sa kanya.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלָיו עָלָה
  choice: Sinalakay siya
  rationale: Sa kontekstong militar, ang idyomang עָלָה עַל ay tumutukoy sa pagsulong laban sa isang tao. Ang “sinalakay siya” ay likas at malinaw sa modernong Filipino, bagaman mas tahasan ito kaysa sa literal na larawan ng pag-ahon laban sa kaniya.
- source_word: נְבוּכַדְנֶאצַּר
  choice: Nebucadnezar
  rationale: Ginamit ang anyong karaniwan at madaling makilala sa tradisyon ng Bibliyang Filipino.
- source_word: מֶלֶךְ בָּבֶל
  choice: hari ng Babilonia
  rationale: Tuwirang isinasalin ang pariralang konstruktong nagpapakilala sa titulo at nasasakupan ng hari.
- source_word: וַיַּאַסְרֵהוּ
  choice: iginapos siya
  rationale: Ang אָסַר ay nangangahulugang itali o gapusin, lalo na ang isang bihag. Pinananatili ng “iginapos” ang kongkretong kilos.
- source_word: בַּנְחֻשְׁתַּיִם
  choice: ng mga tanikala na tanso
  rationale: Ang salita ay tumutukoy sa mga panaling metal na yari sa tanso; malinaw sa ordinaryong mambabasa ang “mga tanikala na tanso,” habang inilalagay sa talababa ang iba pang posibleng anyo ng mga panali.
- source_word: לְהֹלִיכוֹ
  choice: upang dalhin
  rationale: Ang Hiphil ng הלך ay nagpapahayag ng pagpapayaon o pagdadala sa isang tao; sa konteksto, isang bihag ang dadalhin sa ibang lugar.
- source_word: בָּבֶלָה
  choice: sa Babilonia
  rationale: Ang directional he ay nagpapahiwatig ng patutunguhan; natural na ipinapahayag ito sa Filipino sa pamamagitan ng “sa Babilonia.”
