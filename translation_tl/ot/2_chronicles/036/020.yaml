base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/020.yaml
  text: He carried into exile to Babylon the remnant who had escaped the sword[a], and they became servants to him and to his sons until the reign of the kingdom of Persia.
translation:
  language: tl
  text: Ipinatapon niya sa Babilonia ang mga nalabing nakaligtas sa tabak. Naging mga alipin sila ng hari at ng kanyang mga anak hanggang sa maghari ang kaharian ng Persia.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֶּגֶל
  choice: Ipिनatapon niya
  rationale: Ang Hiphil ng גלה ay tumutukoy sa sapilitang pagdadala sa ibang lupain bilang mga ipinatapon. Likas sa modernong Tagalog ang “ipinatapon” at malinaw nitong ipinahihiwatig ang sapilitang pagpapatapon.
- source_word: הַשְּׁאֵרִית מִן הַחֶרֶב
  choice: ang mga nalabing nakaligtas sa tabak
  rationale: Pinananatili ng “mga nalabi” ang diwa ng natirang pangkat, samantalang ipinapahayag ng “nakaligtas sa tabak” ang idyomatikong kahulugan ng literal na “mula sa tabak.”
- source_word: אֶל בָּבֶל
  choice: sa Babilonia
  rationale: Karaniwang anyong Tagalog ng pangalan ng lugar at natural na patutunguhan kasunod ng “ipinatapon.”
- source_word: וַיִּהְיוּ לוֹ וּלְבָנָיו לַעֲבָדִים
  choice: Naging mga alipin sila niya at ng kanyang mga anak
  rationale: Maaaring mangahulugan ang עֲבָדִים ng mga lingkod o mga alipin. Dahil inilalarawan dito ang mga nakaligtas sa digmaan na sapilitang ipinatapon at isinailalim sa mananakop, mas angkop sa konteksto ang “mga alipin.”
- source_word: עַד מְלֹךְ מַלְכוּת פָּרָס
  choice: hanggang sa maghari ang kaharian ng Persia
  rationale: Natural nitong ipinahahayag sa Tagalog ang hangganang temporal na itinakda ng pagsisimula o pag-iral ng pamumuno ng kaharian ng Persia, nang hindi tinutukoy ang isang indibiduwal na haring hindi binanggit sa Hebreo.
theological_decisions:
- issue: Kalagayang ipinahihiwatig ng עֲבָדִים sa konteksto ng pananakop at pagpapatapon
  choice: mga alipin
  alternative: mga lingkod
  rationale: Tunay na malawak ang saklaw ng salitang Hebreo at hindi dapat ikubli ang alternatibo. Gayunman, pinapaboran ng sapilitang pananakop, pagpapatapon, at pagpapasakop sa hari at sa kanyang mga anak ang “mga alipin”; inilalagay sa talababa ang “mga lingkod” upang mapanatili ang leksikal na posibilidad.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “ipinatapon” para sa sapilitang deportasyon, “mga nalabi” upang mapanatili ang biblikal na diwa ng natirang pangkat, at “tabak” bilang dignified at pamilyar na larawan ng pagkamatay sa digmaan. Ang pangungusap ay hinati sa dalawa para sa natural na daloy nang hindi binabago ang ugnayan ng mga sugnay.
