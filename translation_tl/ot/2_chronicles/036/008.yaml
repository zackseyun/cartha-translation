base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/008.yaml
  text: The rest of the acts of Jehoiakim[a], and the abominations that he did, and what was found against him—behold, they are written in the Book of the Kings of Israel and Judah. And Jehoiachin his son reigned in his place.
translation:
  language: tl
  text: Ang iba pang mga ginawa ni Jehoiakim, pati ang mga kasuklam-suklam na ginawa niya at ang natuklasan laban sa kanya[a], ay nakasulat sa Aklat ng mga Hari ng Israel at Juda. At ang anak niyang si Jehoiakin ay naghari bilang kahalili niya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang natuklasan tungkol sa kanya.” Maaaring tumukoy sa pangkalahatan ang pananalitang Hebreo sa mga bagay na natuklasan tungkol kay Jehoiakim, bagaman ang “laban sa kanya” ay higit na angkop sa negatibong konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי יְהוֹיָקִים
  choice: Ang iba pang mga ginawa ni Jehoiakim
  rationale: Sa pormulang pangkasaysayan tungkol sa isang hari, ang דִּבְרֵי ay tumutukoy sa mga pangyayari o ginawa sa kanyang paghahari, hindi lamang sa mga salita. Likas sa modernong Tagalog ang “iba pang mga ginawa.”
- source_word: וְתֹעֲבֹתָיו אֲשֶׁר עָשָׂה
  choice: pati ang mga kasuklam-suklam na ginawa niya
  rationale: Pinananatili ng “kasuklam-suklam” ang matinding moral at maaaring panrelihiyong paghatol ng תּוֹעֵבָה, habang natural na ipinahahayag ng “pati” ang pagkakaugnay ng talaan.
- source_word: וְהַנִּמְצָא עָלָיו
  choice: at ang natuklasan laban sa kanya
  rationale: Maaaring magpahiwatig ang עָלָיו ng masamang bagay na natuklasan laban kay Jehoiakim. Hindi ito pinalawak bilang pormal na “mga paratang,” at inilalahad sa talababa ang mas pangkalahatang posibilidad.
- source_word: הִנָּם כְּתוּבִים
  choice: ay nakasulat
  rationale: Ang ayos ng pangungusap sa Tagalog ay sapat nang nagtutuon ng pansin sa katotohanang nakatala ang mga bagay na ito; ang pagdaragdag ng literal na “narito” ay magiging pilit sa kasalukuyang Tagalog.
- source_word: סֵפֶר מַלְכֵי יִשְׂרָאֵל וִיהוּדָה
  choice: Aklat ng mga Hari ng Israel at Juda
  rationale: Itinuturing itong pamagat ng binanggit na talaang pangkasaysayan at pinananatili ang saklaw na “Israel at Juda.”
- source_word: וַיִּמְלֹךְ יְהוֹיָכִין בְּנוֹ תַּחְתָּיו
  choice: At ang anak niyang si Jehoiakin ay naghari bilang kahalili niya
  rationale: Malinaw at likas na ipinahahayag ng “bilang kahalili niya” ang paghalili sa trono na tinutukoy ng תַּחְתָּיו.
