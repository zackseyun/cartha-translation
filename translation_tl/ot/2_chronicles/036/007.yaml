id: 2CH.36.7
reference: 2 Chronicles 36:7
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וּ/מִ/כְּלֵי֙ בֵּ֣ית יְהוָ֔ה הֵבִ֥יא נְבוּכַדְנֶאצַּ֖ר לְ/בָבֶ֑ל וַ/יִּתְּנֵ֥/ם בְּ/הֵיכָל֖/וֹ בְּ/בָבֶֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/007.yaml
  text: Nebuchadnezzar also brought some of the vessels of the house of Yahweh to Babylon[a], and put them in his temple in Babylon.
translation:
  language: tl
  text: Nagdala rin si Nebucadnezar sa Babilonia ng ilan sa mga kagamitan ng bahay ni Yahweh at inilagay niya ang mga iyon sa kanyang templo[a] sa Babilonia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kanyang palasyo,” sapagkat maaaring tumukoy ang salitang Hebreo sa templo o sa palasyo, depende sa konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מִ/כְּלֵי
  choice: Nagdala rin ... ng ilan sa mga kagamitan
  rationale: 'Ipinahahayag ng וּ ang karagdagang kilos at ng מִן ang partitive na diwa: ilan lamang mula sa kabuuan ng mga kagamitan. Natural itong naipapahayag sa modernong Tagalog sa pamamagitan ng “rin” at “ilan sa.”'
- source_word: בֵּית יְהוָה
  choice: bahay ni Yahweh
  rationale: Pinananatili ang literal na Hebreong idyomang “bahay ni Yahweh” sa halip na agad itong gawing “templo,” habang malinaw pa rin sa konteksto ang tinutukoy.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasatitik ang personal na pangalang יהוה bilang “Yahweh,” sa halip na palitan ito ng isang titulo.
- source_word: הֵבִיא
  choice: Nagdala
  rationale: Ang Hiphil ng בוא ay nangangahulugang magdala o maging sanhi upang makarating; ang “nagdala” ang malinaw at natural na katumbas dito.
- source_word: נְבוּכַדְנֶאצַּר
  choice: Nebucadnezar
  rationale: Ginamit ang nakaugaliang anyo ng pangalan sa Tagalog/Filipino na mga salin ng Bibliya.
- source_word: לְ/בָבֶל
  choice: sa Babilonia
  rationale: Ang directional לְ ay tumutukoy sa destinasyon; sa Tagalog, natural itong isalin na “sa Babilonia.”
- source_word: וַ/יִּתְּנֵם
  choice: at inilagay niya ang mga iyon
  rationale: Sa kontekstong ito, ang נתן ay nangangahulugang ilagay o ipuwesto. Nililinaw ng “mga iyon” na ang tinutukoy ay ang naunang mga kagamitan.
- source_word: בְּ/הֵיכָל/וֹ
  choice: sa kanyang templo
  rationale: Maaaring mangahulugan ang הֵיכָל ng templo o palasyo. Dahil mga sagradong kagamitan ang inilalagak, “templo” ang mas malamang sa konteksto, ngunit inilalahad sa talababa ang tunay na alternatibo.
- source_word: בְּ/בָבֶל
  choice: sa Babilonia
  rationale: Ang locative בְּ ay nagsasaad ng lugar kung saan inilagay ang mga kagamitan.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Personal na pangalan ang tuwirang ginagamit ng tekstong Hebreo. Pinananatili ito bilang “Yahweh” sa halip na palitan ng titulong “PANGINOON.”
- issue: Kahulugan ng הֵיכָל na tumutukoy sa gusali ni Nebucadnezar
  choice: kanyang templo
  alternative: kanyang palasyo
  rationale: Bagaman parehong maaaring tukuyin ng salita ang templo at palasyo, mas malamang ang kultikong kahulugan dahil mga kagamitan mula sa bahay ni Yahweh ang pinag-uusapan. Hindi itinatago ang leksikal na kalabuan; nakatala ang alternatibo sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na natural at marangal. Pinanatili ang “bahay ni Yahweh” upang katawanin ang Hebreong ekspresyon, samantalang ginamit ang “templo” para sa mas malamang na diwa ng הֵיכָל at nilagyan ng talababa ang alternatibong “palasyo.”
