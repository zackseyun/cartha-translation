base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/010.yaml
  text: At the turn of the year[a], King Nebuchadnezzar sent and brought him to Babylon, along with the precious vessels of the house of Yahweh[c][b], and made his brother Zedekiah king over Judah and Jerusalem.
translation:
  language: tl
  text: Nang muling umikot ang taon[a], nagpadala si Haring Nebucadnezar at dinala niya si Jehoiakin sa Babilonia, kasama ang mahahalagang kagamitan[b] ng bahay ni Yahweh. Ginawa niyang hari sa Juda at Jerusalem si Zedekias, na kapatid ni Jehoiakin[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “sa pagbalik/pag-ikot ng taon,” isang idyoma para sa muling pagsapit ng panahong iyon sa taon.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “mamahalin” o “iniingatang mga kagamitan.”
    reason: lexical_alternative
  - marker: c
    text: “Kapatid niya” ang nasa Hebreo. Malapit na kamag-anak ni Jehoiakin si Zedekias—mas tiyak, tiyuhin niya.
    reason: cultural_note
lexical_decisions:
- source_word: וְלִתְשׁוּבַת הַשָּׁנָה
  choice: Nang muling umikot ang taon
  rationale: Pinananatili nito ang Hebreong idyoma ng ‘pagbalik’ o ‘pag-ikot’ ng taon nang hindi ipinapalagay na tiyak na tagsibol ang tinutukoy.
- source_word: שָׁלַח ... וַיְבִאֵהוּ
  choice: nagpadala ... at dinala siya
  rationale: Inilalarawan ang magkasunod na kilos ng hari habang likas na nauunawaan na isinagawa ng mga isinugo niya ang pagdadala kay Jehoiakin.
- source_word: בָבֶלָה
  choice: sa Babilonia
  rationale: Ipinahahayag ng hulaping direksiyon sa Hebreo ang pagkilos patungo sa Babilonia.
- source_word: כְּלֵי חֶמְדַּת
  choice: mahahalagang kagamitan
  rationale: Ang כְּלֵי ay mga kagamitan o sisidlan, at ang חֶמְדַּת ay nagpapahiwatig ng pagiging mahalaga, kanais-nais, o iniingatang kayamanan.
- source_word: בֵּית יְהוָה
  choice: bahay ni Yahweh
  rationale: Pinananatili ang literal na larawang ‘bahay’ para sa templo at ang personal na pangalang nasa tekstong Hebreo.
- source_word: וַיַּמְלֵךְ
  choice: Ginawa niyang hari
  rationale: 'Tuwirang ipinapahayag ang causative na diwa ng pandiwa: pinaghari o ginawang hari.'
- source_word: אָחִיו
  choice: kapatid nito
  rationale: Pinananatili ang mismong malawak na katawagang pampagkamag-anak ng Hebreo; nililinaw sa talababa na si Zedekias ay mas tiyak na tiyuhin ni Jehoiakin.
- source_word: עַל יְהוּדָה וִירוּשָׁלָם
  choice: sa Juda at Jerusalem
  rationale: Likas na Filipino para sa saklaw ng pamamahala ni Zedekias sa Juda at sa kabisera nito.
theological_decisions:
- issue: Pagsasalin sa pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Personal na pangalang YHWH ang tuwirang nasa tekstong Hebreo; pinananatili itong ‘Yahweh’ sa halip na palitan ng isang titulo.
- issue: Ugnayang pampamilya ni Zedekias kay Jehoiakin
  choice: kapatid nito, na may paglilinaw sa talababa
  alternative: tiyuhin nito
  rationale: Ang tekstong Hebreo ay gumagamit ng אָחִיו, ‘kapatid niya,’ bagaman ipinakikita ng talaangkanan na tiyuhin ni Jehoiakin si Zedekias. Pinananatili ng salin ang tensiyon at inilalagay ang mas tiyak na ugnayan sa talababa.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Pinanatili ang idyoma tungkol sa pag-ikot ng taon, ang larawang ‘bahay ni Yahweh,’ at ang malawak na katawagang ‘kapatid,’ habang ang kinakailangang paglilinaw ay inilagay sa mga talababa.
