  to: Nang muling umikot ang taon[a], nagpadala si Haring Nebucadnezar at dinala niya si Jehoiakin sa Babilonia, kasama ang mahahalagang kagamitan[b] ng bahay ni Yahweh. Ginawa niyang hari sa Juda at Jerusalem si Zedekias, na kapatid ni Jehoiakin[c].
  rationale: Pinalitan ang malabong “kapatid nito” ng “kapatid ni Jehoiakin.” Ito ay paglilinaw lamang ng antecedent ng panghalip na Hebreo at hindi pagpapalit ng malawak na katawagang “kapatid” ng isang genealogical na interpretasyon. Inayos din ang unang sugnay upang malinaw na si Nebucadnezar ang kumilos sa pagpapadala at pagdadala kay Jehoiakin.
