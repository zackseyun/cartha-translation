  text: וְ֠/כֹל כְּלֵ֞י בֵּ֤ית הָ/אֱלֹהִים֙ הַ/גְּדֹלִ֣ים וְ/הַ/קְּטַנִּ֔ים וְ/אֹֽצְרוֹת֙ בֵּ֣ית יְהוָ֔ה וְ/אֹצְר֥וֹת הַ/מֶּ֖לֶךְ וְ/שָׂרָ֑י/ו הַ/כֹּ֖ל הֵבִ֥יא בָבֶֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/018.yaml
  text: And all the vessels of the house of God[a], great and small, and the treasures of the house of Yahweh[b], and the treasures of the king and of his officials—all this he brought to Babylon.
translation:
  language: tl
  text: At ang lahat ng kagamitan sa bahay ng Diyos, malalaki at maliliit, ang mga kayamanan[a] ng bahay ni Yahweh, at ang mga kayamanan ng hari at ng kanyang mga opisyal[b]—lahat ng iyon ay dinala niya sa Babilonia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Hebreo ay maaari ring tumukoy sa “mga imbakan” o “mga silid-yaman.”
    reason: lexical_alternative
  - marker: b
    text: O “mga pinuno”; maaari ring tumukoy ang salita sa mga prinsipe o matataas na opisyal.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֹל כְּלֵי
  choice: At ang lahat ng kagamitan
  rationale: Ipinapahayag ng וְכֹל ang kabuuan ng kolektibong pangkat, at sapat ang lawak ng “kagamitan” para sa sari-saring gamit o banal na kasangkapan sa templo.
- source_word: בֵּית הָאֱלֹהִים
  choice: bahay ng Diyos
  rationale: Pinananatili nito ang konkretong idyomang Hebreo na “bahay ng Diyos” nang hindi ipinapalit agad ang mas interpretibong “templo.”
- source_word: הַגְּדֹלִים וְהַקְּטַנִּים
  choice: malalaki at maliliit
  rationale: Tumutukoy ito sa mga kagamitan anuman ang laki o halaga; likas at malinaw sa Filipino ang tambalang ito.
- source_word: אֹצְרוֹת
  choice: mga kayamanan
  rationale: Maaaring tumukoy ang salita sa mga imbakan o sa mahahalagang laman ng mga iyon. Dahil dinala ang mga ito sa Babilonia, mas angkop sa konteksto ang “mga kayamanan,” habang inilalahad sa talababa ang ibang posibilidad.
- source_word: בֵּית יְהוָה
  choice: bahay ni Yahweh
  rationale: Pinananatili ang idyomang “bahay” at tuwirang isinasalin ang pangalang tipan na יהוה bilang “Yahweh.”
- source_word: שָׂרָיו
  choice: kanyang mga opisyal
  rationale: Malawak ang saklaw ng שַׂר at maaaring mangahulugang pinuno, prinsipe, o mataas na opisyal. Ang “mga opisyal” ay malinaw sa modernong Filipino at hindi labis na nagtatakda ng ranggo.
- source_word: הַכֹּל
  choice: lahat ng iyon
  rationale: Ito ang panumbalik na pariralang bumubuod sa buong naunang talaan.
- source_word: הֵבִיא בָבֶל
  choice: ay dinala niya sa Babilonia
  rationale: Ang isahang pandiwa ay may di-binanggit na simuno na mula sa konteksto ay si Nebucadnezar. Pinananatili ng “niya” ang gayong implicit na pagtukoy nang hindi idinaragdag ang pangalan sa talata.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang ginagamit ng tekstong Hebreo ang Tetragrammaton. Ang “Yahweh” ay nagpapanatili rito bilang pangalang pantangi at hindi bilang titulong “PANGINOON.”
- issue: Pagkilala sa di-binanggit na simuno ng הֵבִיא
  choice: niya
  alternative: Nebucadnezar
  rationale: Hindi inuulit ng talata ang pangalan ng gumagawa. Ang panghalip ay tapat sa anyo ng Hebreo at hinahayaang ang konteksto ang kumilala sa kanya.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Pinanatili ang “bahay ng Diyos/Yahweh” bilang malinaw na idyomang malapit sa Hebreo, ang panumbalik na “lahat ng iyon,” at ang panghalip na “niya” sa halip na idagdag ang pangalan ng simuno.
