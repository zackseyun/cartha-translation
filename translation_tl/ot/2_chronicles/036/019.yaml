  text: וַֽ/יִּשְׂרְפוּ֙ אֶת בֵּ֣ית הָ/אֱלֹהִ֔ים וַֽ/יְנַתְּצ֔וּ אֵ֖ת חוֹמַ֣ת יְרוּשָׁלִָ֑ם וְ/כָל אַרְמְנוֹתֶ֨י/הָ֙ שָׂרְפ֣וּ בָ/אֵ֔שׁ וְ/כָל כְּלֵ֥י מַחֲמַדֶּ֖י/הָ לְ/הַשְׁחִֽית־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/019.yaml
  text: They burned the house of God[a], tore down the wall of Jerusalem, burned all its palaces with fire[b], and destroyed all its precious vessels.
translation:
  language: tl
  text: Sinunog nila ang bahay ng Diyos[a], giniba ang pader ng Jerusalem, sinunog sa apoy ang lahat ng palasyo nito, at winasak ang lahat ng mahahalagang kagamitan nito.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “templo ng Diyos.” Literal sa Hebreo: “bahay ng Diyos.”'
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “lahat ng itinatangi nitong mga bagay” o “lahat ng mamahaling sisidlan nito.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂרְפוּ
  choice: Sinunog nila
  rationale: Ang Qal wayyiqtol ng שׂרף ay tuwirang nangangahulugang “sinunog.” Likas sa salaysay na Filipino ang payak na aspektong naganap, at ang “nila” ay ipinahihiwatig ng pandiwang Hebreo na nasa ikatlong panauhang panlalaking maramihan.
- source_word: בֵּית הָאֱלֹהִים
  choice: ang bahay ng Diyos
  rationale: Pinananatili nito ang literal na Hebreong pananalitang “bahay ng Diyos,” habang malinaw sa konteksto na templo ang tinutukoy.
- source_word: וַיְנַתְּצוּ
  choice: giniba
  rationale: Ang נתץ ay nangangahulugang magpabagsak o gumiba ng isang istruktura. Natural at tiyak ang “giniba” para sa pader.
- source_word: חוֹמַת יְרוּשָׁלִָם
  choice: ang pader ng Jerusalem
  rationale: Tapat ito sa isahang anyo ng Hebreo, na maaaring tumukoy sa kabuuang pader na nakapaligid sa lungsod.
- source_word: אַרְמְנוֹתֶיהָ
  choice: lahat ng palasyo nito
  rationale: Karaniwang tumutukoy ang אַרְמוֹן sa palasyo o maringal at maaaring nakukutaang gusali. Ang hulaping pambabae ay likas na tumutukoy sa Jerusalem, na isinasalin bilang “nito.”
- source_word: שָׂרְפוּ בָאֵשׁ
  choice: sinunog sa apoy
  rationale: Pinananatili ang tahasang pagbanggit ng Hebreo sa apoy at ang pag-uulit ng pagkilos na pagsunog.
- source_word: כְּלֵי מַחֲמַדֶּיהָ
  choice: lahat ng mahahalagang kagamitan nito
  rationale: Malawak ang saklaw ng כְּלִי—sisidlan, kasangkapan, kagamitan, o iba pang bagay—kaya hindi ito nililimitahan sa mga sisidlang panrelihiyon. Ipinapahayag ng מַחֲמַד ang pagiging mahalaga, kanais-nais, o itinatangi.
- source_word: לְהַשְׁחִית
  choice: winasak
  rationale: Bagaman infinitive ang anyong Hebreo, ipinapahayag nito ang layunin o kinalabasan ng ginawa sa mga kagamitan. Ang finite na “winasak” ay natural na Filipino at malinaw na naiuugnay sa sunod-sunod na pagkawasak.
theological_decisions: []
translation_notes:
  register: Gumamit ng makabago, malinaw, at marangal na Filipino. Pinanatili ang pag-uulit ng “sinunog” at ang tahasang “sa apoy” upang maipakita ang diin at pagkakasunod-sunod sa Hebreo. Inilagay ang talababa [b] sa “mahahalagang kagamitan,” na siyang salitang may mga leksikal na alternatibo.
