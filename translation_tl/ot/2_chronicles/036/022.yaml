  text: וּ/בִ/שְׁנַ֣ת אַחַ֗ת לְ/כ֨וֹרֶשׁ֙ מֶ֣לֶךְ פָּרַ֔ס לִ/כְל֥וֹת דְּבַר יְהוָ֖ה בְּ/פִ֣י יִרְמְיָ֑הוּ הֵעִ֣יר יְהוָ֗ה אֶת ר֨וּחַ֙ כּ֣וֹרֶשׁ מֶֽלֶךְ פָּרַ֔ס וַ/יַּֽעֲבֶר קוֹל֙ בְּ/כָל מַלְכוּת֔/וֹ וְ/גַם בְּ/מִכְתָּ֖ב לֵ/אמֹֽר־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/022.yaml
  text: 'In the first year of Cyrus king of Persia[a], so that the word of Yahweh by the mouth of Jeremiah might be fulfilled, Yahweh stirred up the spirit of Cyrus king of Persia, and he made a proclamation throughout all his kingdom, and also in writing, saying:'
translation:
  language: tl
  text: 'Sa unang taon ni Ciro na hari ng Persia, upang matupad ang salita ni Yahweh sa pamamagitan ni Jeremias[a], pinukaw ni Yahweh ang espiritu ni Ciro na hari ng Persia, at nagpalabas siya ng pahayag sa buong kaharian niya, gayon din sa pamamagitan ng sulat, na nagsasabi:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa pamamagitan ng bibig ni Jeremias”; literal sa Hebreo, “sa pamamagitan ng bibig ni Jeremias.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בִ/שְׁנַת אַחַת
  choice: Nang unang taon
  rationale: Likas na pormula ng pagpepetsa sa Tagalog; ipinahihiwatig ng konteksto ang kaugnayang pasalaysay ng waw nang hindi nagdaragdag ng tahasang “Ngayon.”
- source_word: לְ/כ֨וֹרֶשׁ מֶ֣לֶךְ פָּרַ֔ס
  choice: ni Ciro na hari ng Persia
  rationale: Pinananatili ang pangalan at maharlikang titulo sa malinaw at natural na apposisyon sa Tagalog.
- source_word: לִ/כְל֥וֹת דְּבַר יְהוָה
  choice: upang matupad ang salita ni Yahweh
  rationale: Ang infinitive ay nagpapahayag ng layunin o kinalabasan; ang “matupad” ay angkop sa pagsasakatuparan ng propetikong salita.
- source_word: בְּ/פִ֣י יִרְמְיָ֑הוּ
  choice: sa pamamagitan ng bibig ni Jeremias
  rationale: Pinananatili ang konkretong idyomang Hebreo at ang larawan ni Jeremias bilang tagapamagitan ng pahayag, habang nauunawaan pa rin sa Tagalog.
- source_word: הֵעִיר יְהוָה אֶת רוּחַ כּוֹרֶשׁ
  choice: pinukaw ni Yahweh ang espiritu ni Ciro
  rationale: Ang “pinukaw” ay natural na katumbas ng pag-antig o pag-udyok, at ang “espiritu” ay hindi nililimitahan sa isip o damdamin lamang.
- source_word: וַ/יַּֽעֲבֶר קוֹל֙ בְּ/כָל מַלְכוּת֔/וֹ
  choice: nagpalabas siya ng pahayag sa buong kaharian niya
  rationale: Inihahatid nang natural ang idyomang literal na pagpaparaan ng tinig, na tumutukoy sa pampublikong pagpapahayag sa buong nasasakupan.
- source_word: וְ/גַם בְּ/מִכְתָּב
  choice: at ipinasulat din ito
  rationale: Malinaw na ipinakikitang bukod sa ipinahayag, inilabas din ang kautusan sa nakasulat na anyo.
- source_word: לֵ/אמֹר
  choice: 'Ganito ang sabi:'
  rationale: Natural na panimula sa tuwirang sipi na nagpapatuloy sa kasunod na talata.
theological_decisions:
- issue: Pagbibigay-kahulugan sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehova
  rationale: Direktang pangalan ang nasa tekstong Hebreo; pinananatili ng “Yahweh” ang pagkakakilanlan nito bilang tipang pangalan nang hindi ito pinapalitan ng titulo.
- issue: Kahulugan ng רוּחַ ni Ciro
  choice: espiritu ni Ciro
  alternative: isip o kalooban ni Ciro
  rationale: Pinananatili ang lawak at posibleng teolohikal na alingawngaw ng רוּחַ, sa halip na paliitin ito sa isang sikolohikal na aspekto.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “Ciro” at “Jeremias,” mga nakasanayang anyo sa Tagalog. Hinati sa dalawang pangungusap ang mahabang Hebreong pangungusap upang luminaw, ngunit pinanatili ang ugnayan ng katuparan, pagkilos ni Yahweh, at pahayag ni Ciro.
