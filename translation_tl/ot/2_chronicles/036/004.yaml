base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/004.yaml
  text: And the king of Egypt made Eliakim his brother king over Judah and Jerusalem[a], and changed his name to Jehoiakim. And Neco took his brother Jehoahaz and brought him to Egypt.
translation:
  language: tl
  text: Itinalaga ng hari ng Ehipto si Eliakim, na kapatid ni Jehoahaz, bilang hari sa Juda at Jerusalem, at pinalitan niya ang pangalan ni Eliakim at ginawang Jehoiakim. At kinuha ni Neco[a] si Jehoahaz, na kapatid ni Eliakim, at dinala siya sa Ehipto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: Neko; isinusulat ding Necho sa ilang salin.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּמְלֵךְ
  choice: itinalaga ... bilang hari
  rationale: 'Ang Hiphil ng מלך ay causative: iniluklok ng hari ng Ehipto si Eliakim bilang hari. Natural sa modernong Tagalog ang “itinalaga ... bilang hari” at malinaw na hindi basta kusang nagsimulang maghari si Eliakim.'
- source_word: מֶלֶךְ מִצְרַיִם
  choice: ang hari ng Ehipto
  rationale: Tuwirang katumbas ito ng construct phrase at natural na tumutukoy sa partikular na pinunong binabanggit.
- source_word: אֶלְיָקִים אָחִיו
  choice: si Eliakim, na kapatid ni Jehoahaz
  rationale: Ang hulaping panghalip sa אָחִיו ay tumutukoy kay Jehoahaz ayon sa konteksto. Ginawang tahasan ang pangalan upang maiwasan ang malabong reperensiya ng “kapatid niya” sa Tagalog.
- source_word: עַל יְהוּדָה וִירוּשָׁלַם
  choice: sa Juda at Jerusalem
  rationale: Sa konteksto ng paghirang sa hari, ipinahihiwatig ng עַל ang saklaw ng paghahari. Ang “bilang hari sa” ay natural sa Tagalog at pinananatili ang Juda at ang kabiserang Jerusalem.
- source_word: וַיַּסֵּב אֶת־שְׁמוֹ יְהוֹיָקִים
  choice: pinalitan niya ang pangalan nito ng Jehoiakim
  rationale: Ipinapahayag ng idyoma ang pagpapalit ng pangalan. Ang “pangalan nito” ay malinaw na tumutukoy kay Eliakim at iniiwasan ang sunod-sunod na malabong “niya.”
- source_word: וְאֶת יוֹאָחָז אָחִיו לָקַח נְכוֹ
  choice: At kinuha ni Neco si Jehoahaz, na kapatid ni Eliakim
  rationale: Pinananatili ng “At” ang payak na pang-ugnay na וְ nang hindi nagdaragdag ng tahasang pagsalungat. Ang לקח ay isinaling payak na “kinuha,” at ginawang tahasan ang ugnayan ng magkapatid upang maging malinaw sa Tagalog.
- source_word: וַיְבִיאֵהוּ מִצְרָיְמָה
  choice: at dinala sa Ehipto
  rationale: Ang directional ending ay nagpapahiwatig ng pagpunta sa Ehipto; natural at tumpak sa Tagalog ang “dinala sa Ehipto.”
- source_word: נְכוֹ
  choice: Neco
  rationale: Ginamit ang anyong pangalang “Neco” na angkop sa modernong baybay-Filipino; inilagay sa talababa ang mas malapit na transliterasyon mula sa Hebreo.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na dignified ngunit madaling maunawaan. Nilinaw ang tinutukoy ng dalawang “kapatid niya” sa Hebreo sa pamamagitan ng pagbanggit sa mga pangalan, nang hindi binabago ang ugnayan ng magkapatid. Pinanatili ang payak na “At” ng source conjunction at iniwasang magpasok ng kontrast na hindi tahasang minarkahan sa Hebreo.
