  to: Itinalaga ng hari ng Ehipto si Eliakim, na kapatid ni Jehoahaz, bilang hari sa Juda at Jerusalem, at pinalitan niya ang pangalan ni Eliakim at ginawang Jehoiakim. At kinuha ni Neco[a] si Jehoahaz, na kapatid ni Eliakim, at dinala siya sa Ehipto.
