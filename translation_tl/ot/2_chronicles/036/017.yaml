  - severity: low
    issue: Ang “mismo” sa “sa loob mismo ng kanilang santuwaryo” ay dagdag na diin.
    rationale: Ipinahahayag ng בְּבֵית ang lokasyon, ngunit wala itong katumbas na pang-abay na “mismo.” Maaaring alisin nang hindi nawawala ang sakripisyal na konteksto.
