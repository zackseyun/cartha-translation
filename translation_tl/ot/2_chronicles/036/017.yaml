  text: וַ/יַּ֨עַל עֲלֵי/הֶ֜ם אֶת מֶ֣לֶךְ כשדיים וַ/יַּהֲרֹ֨ג בַּחוּרֵי/הֶ֤ם בַּ/חֶ֨רֶב֙ בְּ/בֵ֣ית מִקְדָּשָׁ֔/ם וְ/לֹ֥א חָמַ֛ל עַל בָּח֥וּר וּ/בְתוּלָ֖ה זָקֵ֣ן וְ/יָשֵׁ֑שׁ הַ/כֹּ֖ל נָתַ֥ן בְּ/יָדֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/017.yaml
  text: So he brought up against them the king of the Chaldeans[a], who killed their young men with the sword in the house of their sanctuary, and had no compassion on young man or virgin, old man or aged man[c][b]. He gave all into his hand.
translation:
  language: tl
  text: Kaya ipinadala niya laban sa kanila ang hari ng mga Caldeo[a]. Pinatay nito sa pamamagitan ng espada ang kanilang mga binata sa loob ng kanilang santuwaryo. Hindi ito nahabag sa binata o dalaga[b], sa matanda o sa napakatanda[c]. Ang lahat ay ibinigay niya sa kamay nito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “hari ng mga taga-Babilonia”; sa Hebreo, “mga Caldeo.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “birhen,” na tumutukoy dito sa isang dalagang hindi pa nag-aasawa.
    reason: lexical_alternative
  - marker: c
    text: O “Hindi nito pinaligtas ang binata o dalaga, ang matanda o ang napakatanda.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל עֲלֵיהֶם
  choice: ipinadala niya laban sa kanila
  rationale: 'Ang Hiphil ng עלה kasama ng עַל ay causative sa kontekstong militar: pinapunta o ipinadala laban sa isang bayan. Likas sa modernong Tagalog ang “ipinadala ... laban sa kanila,” at ang “niya” ay tumutukoy sa PANGINOON mula sa naunang konteksto.'
- source_word: מֶלֶךְ כשדיים
  choice: ang hari ng mga Caldeo
  rationale: Tuwirang kinakatawan ng “mga Caldeo” ang Hebreong כשדים; maaaring tumukoy ito nang mas malawak sa mga taga-Babilonia, kaya inilagay ang alternatibo sa talababa.
- source_word: וַיַּהֲרֹג
  choice: Pinatay nito
  rationale: Ang pandiwa ay nangangahulugang pumatay. Nililinaw ng “nito” na ang gumagawa ay ang hari ng mga Caldeo, hindi ang Diyos na paksa ng unang sugnay.
- source_word: בַּחוּרֵיהֶם
  choice: ang kanilang mga binata
  rationale: Ang בחור ay kabataang lalaki na nasa kasibulan; malinaw at likas ang “mga binata.”
- source_word: בַּחֶרֶב
  choice: sa pamamagitan ng espada
  rationale: Pinananatili nito ang instrumentong ipinahahayag ng Hebreo at iniiwasang ipakahulugan lamang bilang pangkalahatang digmaan.
- source_word: בְּבֵית מִקְדָּשָׁם
  choice: sa loob mismo ng kanilang santuwaryo
  rationale: Ang literal na “bahay ng kanilang banal na lugar” ay tumutukoy sa templo. Ang “santuwaryo” ay nagpapanatili sa banal na katangian ng pook, at ang “mismo” ay natural na nagbibigay-diin sa kalapastanganan nang hindi nagdaragdag ng bagong pangyayari.
- source_word: וְלֹא חָמַל
  choice: Hindi ito nahabag
  rationale: Saklaw ng חמל ang pagkahabag na humahantong sa hindi pagpatay o pagligtas. Pinananatili ng “nahabag” ang damdamin at moral na bigat; ang “hindi pinaligtas” ay ibinigay na alternatibo.
- source_word: בָּחוּר וּבְתוּלָה
  choice: sa binata o dalaga
  rationale: Ang בחור ay binata at ang בתולה ay isang dalagang birhen, karaniwang isang babaeng hindi pa nag-aasawa. Natural sa Tagalog ang “dalaga,” habang ipinapaliwanag sa talababa ang tiyak na diwa.
- source_word: זָקֵן וְיָשֵׁשׁ
  choice: sa matanda o sa napakatanda
  rationale: Pinananatili ang dalawang magkaugnay ngunit tumitinding kategorya ng katandaan sa Hebreo.
- source_word: הַכֹּל נָתַן בְּיָדוֹ
  choice: Silang lahat ay ibinigay niya sa kamay nito
  rationale: Ang idyomang “ibinigay sa kamay” ay nangangahulugang isinailalim sa kapangyarihan ng isang tao. Pinananatili rito ang larawang Hebreo, habang ipinakikita ng “silang lahat” na mga taong nabanggit ang pangunahing tinutukoy.
theological_decisions:
- issue: Paksa ng pambungad at pangwakas na mga pandiwa
  choice: Ang “niya” ay tumutukoy sa PANGINOON mula sa naunang talata; ang “nito” ay tumutukoy sa hari ng mga Caldeo.
  alternative: Maaaring gawing di-tiyak ang paksa sa salin, o ipakahulugang ang hari ang paksa ng pangwakas na sugnay.
  rationale: Ang mga pandiwa ay nasa ikatlong panauhang panlalaki at ang paksa ay dinadala mula sa naunang konteksto, kung saan ang PANGINOON ang kumikilos sa paghatol. Mahalaga ang magkaibang “niya” at “nito” upang mapanatili na ang Diyos ang nagpadala at nagbigay, samantalang ang hari ang pumatay.
- issue: Saklaw ng “lahat” sa pangwakas na sugnay
  choice: “Silang lahat,” na pangunahing tumutukoy sa mga tao sa agarang konteksto.
  alternative: “Ang lahat,” na maaaring sumaklaw rin sa mga bagay at ari-arian.
  rationale: Ang הַכֹּל ay maaaring mangahulugang “lahat” o “ang kabuuan.” Dahil mga pangkat ng tao ang agarang nauuna, likas ang personal na sanggunian, ngunit hindi nilulutas ng talata nang tahasan ang buong saklaw nito.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “santuwaryo” upang mapanatili ang sagradong diin ng Hebreo, at pinag-iba ang “niya” at “nito” upang luminaw ang pagpapalit ng tinutukoy na panlalaking paksa. Lahat ng marker [a], [b], at [c] ay nasa pangunahing teksto.
