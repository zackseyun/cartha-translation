id: 2CH.36.12
reference: 2 Chronicles 36:12
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יַּ֣עַשׂ הָ/רַ֔ע בְּ/עֵינֵ֖י יְהוָ֣ה אֱלֹהָ֑י/ו לֹ֣א נִכְנַ֗ע מִ/לִּ/פְנֵ֛י יִרְמְיָ֥הוּ הַ/נָּבִ֖יא מִ/פִּ֥י יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/012.yaml
  text: He did what was evil in the eyes of Yahweh his God[a], and he did not humble himself before Jeremiah the prophet, who spoke from the mouth of Yahweh.
translation:
  language: tl
  text: Ginawa niya ang masama sa paningin ni Yahweh na kanyang Diyos. Hindi siya nagpakumbaba sa harap ng propetang si Jeremias, na nagsalita ayon sa sinabi ni Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “mula sa bibig ni Yahweh.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ הָרַע
  choice: Ginawa niya ang masama
  rationale: Natural na ipinapahayag nito sa Filipino ang karaniwang Hebreong pormula para sa paggawa ng itinuturing na masama, nang hindi ginagawang sobrang literal ang הָרַע.
- source_word: בְּעֵינֵי
  choice: sa paningin ni
  rationale: Pinananatili nito ang Hebreong idyoma ng pagsusuri mula sa pananaw ng isang tao at likas din itong pakinggan sa Filipino.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang personal na pangalang nasa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהָיו
  choice: na kanyang Diyos
  rationale: Pinananatili ang panghalip na nagsasaad na si Yahweh ay Diyos niya, na nagbibigay-diin sa kanyang pananagutan.
- source_word: לֹא נִכְנַע
  choice: Hindi siya nagpakumbaba
  rationale: 'Ang Niphal ay inuunawang may reflexive o middle na diwa: tumanggi siyang magpakumbaba o magpasakop.'
- source_word: מִלִּפְנֵי יִרְמְיָהוּ הַנָּבִיא
  choice: sa harap ng propetang si Jeremias
  rationale: Malinaw at natural nitong pinananatili ang ugnayan kay Jeremias at ang kanyang tungkulin bilang propeta.
- source_word: מִפִּי יְהוָה
  choice: na nagsalita ayon sa sinabi ni Yahweh
  rationale: Ipinahihiwatig ng pariralang Hebreo ang mensaheng nagmula kay Yahweh. Ang sugnay na idinagdag sa Filipino ay nililinaw ang kaugnayan nito kay Jeremias, habang itinatala sa talababa ang mas literal na larawang 'mula sa bibig.'
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Personal na pangalan ang tuwirang ginagamit ng tekstong Hebreo; pinananatili itong pangalan at hindi pinapalitan ng titulo.
- issue: Ugnayan ng mensahe ni Jeremias kay Yahweh
  choice: na nagsalita ayon sa sinabi ni Yahweh
  alternative: na nagsalita mula sa bibig ni Yahweh
  rationale: Pinananatili ng salin ang awtoridad at pinagmulan ng propetikong mensahe nang hindi nagpapahiwatig ng doktrinang lampas sa idyomang Hebreo; ang literal na larawan ay nasa talababa.
translation_notes:
  register: Modernong Filipino na may marangal at malinaw na himig. Ginamit ang “sa paningin” at “nagpakumbaba” upang mapanatili ang pamilyar na biblikal na wika nang hindi maging lipas o mahirap unawain. Inilipat ang talababa sa pariralang talagang tinutukoy nito.
