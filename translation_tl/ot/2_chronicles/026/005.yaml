base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/005.yaml
  text: He continued to seek God in the days of Zechariah[a], who had understanding in the visions of God; and as long as he sought Yahweh[b], God made him prosper.
translation:
  language: tl
  text: Patuloy niyang hinanap ang Diyos noong mga araw ni Zacarias[a], na may pagkaunawa sa mga pangitain ng Diyos. At habang hinahanap niya si Yahweh[b], pinagtagumpay siya ng Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “na nagturo tungkol sa pagkatakot sa Diyos.” Mahirap unawain ang pariralang Hebreo; mas literal na mababasa sa Tekstong Masoretiko ang “na may pagkaunawa sa mga pangitain ng Diyos.”
    reason: alternative_reading
  - marker: b
    text: O “at noong mga panahong hinahanap niya si Yahweh”; maaari ring “hangga't hinahanap niya si Yahweh.”
    reason: temporal_nuance
lexical_decisions:
- source_word: וַיְהִי לִדְרֹשׁ אֱלֹהִים
  choice: Patuloy niyang hinanap ang Diyos
  rationale: Ang היה kasama ng pawatas na לִדְרֹשׁ ay nagpapahayag ng nagpapatuloy na gawain. Pinananatili ng “hanapin ang Diyos” ang malawak na diwa ng debosyon, pagtitiwala, at paglapit sa Diyos, sa halip na limitahan ito sa paghingi lamang ng impormasyon.
- source_word: בִּימֵי זְכַרְיָהוּ
  choice: noong mga araw ni Zacarias
  rationale: Tuwirang temporal na pahayag ito at likas pakinggan sa marangal na makabagong Tagalog.
- source_word: הַמֵּבִין
  choice: na may pagkaunawa
  rationale: Ipinapahayag ng participle ang pagkakaroon ng pagkaunawa o pagkilatis; hindi ito pinalawak tungo sa “nagturo,” na hindi tahasang sinasabi ng tekstong Masoretiko.
- source_word: בִּרְאֹת הָאֱלֹהִים
  choice: sa mga pangitain ng Diyos
  rationale: Sinusunod nito ang Masoretikong pagbasa na kaugnay ng “pagkakita” o “mga pangitain,” habang iniiwasang gawing tiyak ang isang mahirap at pinagtatalunang parirala.
- source_word: וּבִימֵי דָּרְשׁוֹ אֶת־יְהוָה
  choice: At habang hinahanap niya si Yahweh
  rationale: Ang “habang” ay natural na naghahatid ng patuloy na panahong inilalarawan ng Hebreo at ng ugnayan nito sa sumunod na tagumpay, nang hindi ginagawang tahasang pormulang kondisyonal ang parirala.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang personal na pangalan ng Diyos sa halip na palitan ito ng titulong “PANGINOON.”
- source_word: הִצְלִיחוֹ הָאֱלֹהִים
  choice: pinagtagumpay siya ng Diyos
  rationale: 'Ipinananatili nito ang causative na diwa ng Hiphil: ang Diyos ang nagbigay o nagsanhi ng kanyang tagumpay.'
theological_decisions:
- issue: Kahulugan ng mahirap na pariralang בִּרְאֹת הָאֱלֹהִים
  choice: Si Zacarias ay may pagkaunawa sa mga pangitain ng Diyos.
  alternative: Si Zacarias ay nakaunawa o nagturo tungkol sa pagkatakot sa Diyos.
  rationale: Sinusuportahan ng Masoretikong mga patinig ang pagbasa na kaugnay ng pagkakita o mga pangitain. Dahil may ibang tradisyon ng pagbasa na “pagkatakot sa Diyos,” pinanatili sa pangunahing teksto ang mas tuwirang ebidensiya ng WLC at inilagay sa talababa ang mahalagang alternatibo.
- issue: Temporal o kondisyonal na puwersa ng וּבִימֵי דָּרְשׁוֹ
  choice: habang hinahanap niya si Yahweh
  alternative: noong mga panahong hinahanap niya si Yahweh; hangga't hinahanap niya si Yahweh
  rationale: Ipinahihiwatig ng konteksto ang nagpapatuloy na panahon na kaugnay ng kanyang tagumpay. Ang “habang” ay nagpapanatili ng temporal na anyo at nagpapahiwatig ng duratibong ugnayan nang hindi labis na nililinaw bilang isang ganap na kondisyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “Zacarias” bilang pamilyar na anyo ng pangalan at “Yahweh” para sa tetragrammaton. Pinanatili ang bahagyang di-karaniwang pahayag na “mga pangitain ng Diyos” dahil mahirap at tunay na hindi tiyak ang Hebreo; nilinaw ang pangunahing alternatibo sa talababa.
