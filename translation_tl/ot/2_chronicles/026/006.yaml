  terminology: Ang mga pangalang Gat, Jabne, at Asdod, gayundin ang “mga Filisteo,” ay angkop. Ang “nasasakupan ng Asdod” ay isang maingat na paglalapat ng malabong בְּאַשְׁדּוֹד, at ang talababa ay wastong nagpapanatili ng posibilidad na lungsod o nakapaligid na teritoryo ang tinutukoy.
