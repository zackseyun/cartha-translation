base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/006.yaml
  text: He went out and fought against the Philistines[a], and he broke down the wall of Gath, the wall of Jabneh, and the wall of Ashdod[b]; and he built cities in the territory of Ashdod and among the Philistines.
translation:
  language: tl
  text: Lumabas siya at nakipaglaban sa mga Filisteo. Binutas niya ang pader ng Gat, ang pader ng Jabne, at ang pader ng Asdod.[a] Nagtayo siya ng mga lungsod sa nasasakupan ng Asdod[b] at sa gitna ng mga Filisteo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “binuksan” o “winasak” ang pader ng Gat, ang pader ng Jabne, at ang pader ng Asdod.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “sa Asdod.” Maaaring tumukoy ang “Asdod” sa lungsod o sa teritoryong nakapaligid at sakop nito.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: Lumabas siya
  rationale: Pinananatili ang payak na kahulugan ng יצא at ang sunod-sunod na daloy ng salaysay nang hindi idinaragdag ang di-tiyak na diwang militar ng ‘humayo upang sumalakay.’
- source_word: וַיִּלָּחֶם בַּפְּלִשְׁתִּים
  choice: nakipaglaban sa mga Filisteo
  rationale: Ang Niphal ng לחם ay nangangahulugang makipaglaban o makidigma; natural sa modernong Tagalog ang ‘nakipaglaban sa,’ at ang פְּלִשְׁתִּים ay tumutukoy sa pangkat ng mga tao.
- source_word: וַיִּפְרֹץ
  choice: Binutas niya
  rationale: Sa konteksto ng pader ng lungsod, ipinahihiwatig ng פרץ ang paggawa ng puwang o paglusot sa pader. Ang ‘binutas’ ay malinaw at hindi tiyak na nagsasabing lubusang giniba ang buong pader.
- source_word: חוֹמַת
  choice: ang pader ng
  rationale: Isahan ang anyong Hebreo at inuulit para sa bawat lungsod, kaya inulit din ang ‘ang pader ng’ sa tatlong pangalan.
- source_word: גַּת / יַבְנֶה / אַשְׁדּוֹד
  choice: Gat / Jabne / Asdod
  rationale: Ginamit ang mga anyong angkop sa ponolohiya at nakasanayang baybay sa Tagalog habang nananatiling malapit sa mga pangalang Hebreo.
- source_word: וַיִּבְנֶה עָרִים
  choice: Nagtayo rin siya ng mga lungsod
  rationale: Ang בנה ay ‘magtayo’ o ‘magpatayo,’ at walang tahasang batayan sa talata para sabihing ‘muling itinayo.’ Ang ‘mga lungsod’ ay tumutugma sa עָרִים.
- source_word: בְּאַשְׁדּוֹד
  choice: sa nasasakupan ng Asdod
  rationale: Dahil hindi natural na sabihing nagtayo ng maraming lungsod sa loob mismo ng isang lungsod, ipinakikita ng salin ang posibleng pagtukoy sa teritoryong sakop ng Asdod, habang itinatala sa talababa ang literal at malabong anyo.
- source_word: וּבַפְּלִשְׁתִּים
  choice: at sa gitna ng mga Filisteo
  rationale: Pinananatili nito ang pagtukoy ng Hebreo sa mga Filisteo bilang pangkat ng mga tao sa halip na tahasang palitan iyon ng pangalang panlupain na ‘Filistia.’
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang ‘nakipaglaban,’ ‘pader,’ at ‘nagtayo’ bilang karaniwang salitang madaling maunawaan. Pinanatili sa talababa ang saklaw ng kahulugan ng פרץ at ang heograpikong kalabuan ng בְּאַשְׁדּוֹד.
