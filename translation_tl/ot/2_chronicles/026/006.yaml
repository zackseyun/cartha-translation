  to: Lumabas siya at nakipaglaban sa mga Filisteo. Binutas niya ang pader ng Gat, ang pader ng Jabne, at ang pader ng Asdod.[a] Nagtayo siya ng mga lungsod sa nasasakupan ng Asdod[b] at sa gitna ng mga Filisteo.
