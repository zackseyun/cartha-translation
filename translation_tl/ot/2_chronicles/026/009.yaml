  text: וַ/יִּ֨בֶן עֻזִּיָּ֤הוּ מִגְדָּלִים֙ בִּ/יר֣וּשָׁלִַ֔ם עַל שַׁ֧עַר הַ/פִּנָּ֛ה וְ/עַל שַׁ֥עַר הַ/גַּ֖יְא וְ/עַל הַ/מִּקְצ֑וֹעַ וַֽ/יְחַזְּקֵֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/009.yaml
  text: Uzziah built towers in Jerusalem at the Corner Gate[a], at the Valley Gate, and at the Angle, and he fortified them.
translation:
  language: tl
  text: Nagtayo si Uzias ng mga tore sa Jerusalem, sa Tarangkahan sa Sulok, sa Tarangkahan sa Lambak, at sa Panulukan[a], at pinatibay niya ang mga iyon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sulok” o “likuan.” Ang salitang Hebreo ay maaaring tumukoy sa anggulo, sulok, o likuan ng muog.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶן
  choice: Nagtayo
  rationale: Ang בנה ay tuwirang nangangahulugang magtayo o bumuo; natural ang “nagtayo” para sa mga tore.
- source_word: עֻזִּיָּהוּ
  choice: Uzias
  rationale: Ginamit ang pangalang tradisyonal at madaling makilala sa modernong saling Tagalog.
- source_word: מִגְדָּלִים
  choice: mga tore
  rationale: Tuwirang plural ng מגדל; hindi idinagdag dito ang diwa ng pagpapatibay dahil nasa hulíng pandiwa iyon.
- source_word: בִּירוּשָׁלִַם
  choice: sa Jerusalem
  rationale: Natural na lokatibong salin ng ב kasama ng pangalan ng lugar.
- source_word: עַל
  choice: sa
  rationale: Sa konteksto ng mga tarangkahan at muog, lokasyon ang ipinahihiwatig; iniiwasan nitong ipakahulugan na nasa ibabaw mismo ng mga tarangkahan ang mga tore.
- source_word: שַׁעַר הַפִּנָּה
  choice: Tarangkahan sa Sulok
  rationale: Pangalan ito ng isang tarangkahan; malinaw na ipinakikita ang kaugnayan nito sa sulok nang hindi ito ipinagkakamali sa hiwalay na הַמִּקְצוֹעַ.
- source_word: שַׁעַר הַגַּיְא
  choice: Tarangkahan sa Lambak
  rationale: Ang גיא ay “lambak”; natural ito bilang pangalan ng tarangkahan.
- source_word: הַמִּקְצוֹעַ
  choice: Panulukan
  rationale: Tumutukoy ang salita sa isang sulok, anggulo, o likuan ng muog. Ang “Panulukan” ay maikli at topograpiko, at naihihiwalay sa Tarangkahan sa Sulok.
- source_word: וַיְחַזְּקֵם
  choice: at pinatibay niya ang mga iyon
  rationale: Sa konteksto ng depensa ng lungsod, ang piel ng חזק ay nangangahulugang patibayin. Ang hulaping maramihan ay pinakamalamang na tumutukoy sa mga tore.
theological_decisions: []
