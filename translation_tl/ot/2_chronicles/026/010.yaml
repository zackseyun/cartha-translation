revisions:
- from: Nagtayo siya ng mga tore[a] sa ilang at humukay ng maraming imbakan ng tubig, sapagkat napakarami niyang alagang hayop. Mayroon siyang mga magsasaka sa mababang lupain[b] at sa kapatagan, at mga tagapag-alaga ng ubasan sa mga burol at sa matabang lupain[c], sapagkat mahal niya ang lupa.
  to: Nagtayo siya ng mga tore[a] sa ilang at humukay ng maraming imbakang-tubig, sapagkat napakarami niyang alagang hayop sa mababang lupain[b] at sa kapatagan. Mayroon din siyang mga magsasaka at mga tagapag-alaga ng ubasan sa mga burol at sa matabang lupain[c], sapagkat mahal niya ang lupa.
