base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/010.yaml
  text: He built towers in the wilderness and cut out many cisterns[a], for he had much livestock; and in the lowland and in the plain he had farmers and vinedressers, in the hills and in the fertile land[c][b], for he loved the soil.
translation:
  language: tl
  text: Nagtayo siya ng mga tore[a] sa ilang at humukay ng maraming imbakang-tubig, sapagkat napakarami niyang alagang hayop sa mababang lupain[b] at sa kapatagan. Mayroon din siyang mga magsasaka at mga tagapag-alaga ng ubasan sa mga burol at sa matabang lupain[c], sapagkat mahal niya ang lupa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga toreng bantayan.”
    reason: lexical_alternative
  - marker: b
    text: O “Sefela,” ang rehiyon ng mabababang burol sa Juda.
    reason: cultural_note
  - marker: c
    text: O “sa Carmel,” kung ituturing itong pangalan ng isang lugar sa halip na “sa matabang lupain.”
    reason: alternative_reading
lexical_decisions:
- source_word: מִגְדָּלִים
  choice: mga tore
  rationale: Tuwirang katumbas ito ng pangkalahatang kahulugan ng salita; hindi tahasang tinutukoy ng Hebreo na mga bantayan ang mga tore.
- source_word: בַּמִּדְבָּר
  choice: sa ilang
  rationale: Saklaw ng “ilang” ang di-gaanong tinatahanang lupain nang hindi ipinapalagay na purong disyerto ito.
- source_word: וַיַּחְצֹב בֹּרוֹת
  choice: humukay ng maraming imbakan ng tubig
  rationale: Ipinahihiwatig ng pandiwa ang pag-ukit o paghukay, at sa kontekstong ito ang mga hukay ay imbakan ng tubig, hindi kinakailangang mga balong bukal ang pinagmumulan.
- source_word: מִקְנֶה רַב
  choice: napakarami niyang alagang hayop
  rationale: Pinananatili nito ang kolektibo at malawak na kahulugan ng מִקְנֶה nang hindi nililimitahan sa baka.
- source_word: שְׁפֵלָה
  choice: mababang lupain
  rationale: Isinasalin nito ang heograpikong kahulugan sa madaling maunawaang Tagalog; inilalagay sa talababa ang pangalang Sefela.
- source_word: מִישׁוֹר
  choice: kapatagan
  rationale: Natural na katumbas ito ng patag o pantay na lupain.
- source_word: אִכָּרִים
  choice: mga magsasaka
  rationale: Malinaw at makabagong katawagan ito para sa mga nagbubungkal ng lupa.
- source_word: כֹרְמִים
  choice: mga tagapag-alaga ng ubasan
  rationale: Tiyak nitong ipinapahayag na ang mga manggagawang ito ay nagtatanim at nag-aalaga ng ubasan.
- source_word: בֶּהָרִים
  choice: sa mga burol
  rationale: Ang “mga burol” ay angkop sa kontekstong agrikultural at hindi pinalalabis ang taas ng lupain.
- source_word: בַּכַּרְמֶל
  choice: sa matabang lupain
  rationale: Itinuturing dito ang כַּרְמֶל bilang karaniwang pangngalan para sa mataba o masaganang lupain; pinananatili sa talababa ang posibilidad na pangalang pook ito.
- source_word: אֹהֵב אֲדָמָה
  choice: mahal niya ang lupa
  rationale: Pinananatili nito ang kongkreto at bahagyang bukas na larawan ng pag-ibig sa lupa, sa halip na ipakahulugan lamang bilang pagkahilig sa pagsasaka.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang konkretong larawang “mahal niya ang lupa” at ang pagkakaiba ng mga magsasaka at mga tagapag-alaga ng ubasan. Ginamit ang “imbakan ng tubig” upang maging malinaw sa karaniwang mambabasa ang tungkulin ng mga hinukay na בֹּרוֹת.
