base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/011.yaml
  text: And Uzziah had an army fit for war[a], going out to battle by divisions, according to the number of their enrollment, under the direction of Jeiel the scribe and Maaseiah the officer, under the authority of Hananiah[b], one of the king’s commanders.
translation:
  language: tl
  text: May hukbong pangdigma si Uzias na lumalabas upang makipaglaban, pangkat-pangkat, ayon sa bilang ng kanilang pagpapatala[a]. Pinamahalaan sila ni Jeiel[b] na eskriba at ni Maaseias na opisyal, sa ilalim ng pangangasiwa ni Hananias, isa sa mga pinuno ng hari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ayon sa bilang ng kanilang pagtitipon para sa pagpapasuri.” Tumutukoy ang salitang Hebreo sa opisyal na pagbilang o pagpapatala ng mga kawal.
    reason: lexical_alternative
  - marker: b
    text: יעואל (Yeuel) ang baybay ng pangalang ito sa tekstong Hebreo rito; maaari rin itong isulat na “Jiel” o “Jeuel.”
    reason: textual_name_form
lexical_decisions:
- source_word: חַיִל עֹשֵׂה מִלְחָמָה
  choice: hukbong pangdigma
  rationale: Sa kontekstong militar, ang חַיִל ay isang hukbo o puwersa, at inilalarawan ito ng עֹשֵׂה מִלְחָמָה bilang hukbong nakalaan at may kakayahang makipagdigma.
- source_word: יוֹצְאֵי צָבָא
  choice: lumalabas upang makipaglaban
  rationale: Ipinahahayag ng parirala ang paglabas ng mga kawal para sa tungkuling militar o pakikipaglaban; natural at tuwiran ito sa modernong Tagalog.
- source_word: לִגְדוּד
  choice: pangkat-pangkat
  rationale: Tumutukoy ito sa organisadong mga yunit ng hukbo; ipinakikita ng pag-uulit ang pamamahagi nila ayon sa mga pangkat.
- source_word: בְּמִסְפַּר פְּקֻדָּתָם
  choice: ayon sa bilang ng kanilang pagpapatala
  rationale: Ang פְּקֻדָּה rito ay pormal na pagbilang o pagtatala ng mga kawal, hindi lamang isang karaniwang bilang.
- source_word: בְּיַד
  choice: pinamahalaan sila
  rationale: Ang idyoma ay nagpapahiwatig ng tuwirang administratibong pamamahala nina Jeiel at Maaseias, hindi literal na 'sa kamay.'
- source_word: הַסּוֹפֵר
  choice: eskriba
  rationale: Ang סֹפֵר ay isang opisyal na tagasulat o kalihim; pinananatili ng 'eskriba' ang tradisyonal at malinaw na katawagan sa tungkulin.
- source_word: הַשּׁוֹטֵר
  choice: opisyal
  rationale: Tumutukoy ang שֹׁטֵר sa isang tagapangasiwang may opisyal na tungkulin sa administrasyon o hukbo.
- source_word: עַל יַד
  choice: sa ilalim ng pangangasiwa
  rationale: Ipinahahayag nito ang nakatataas na antas ng pangangasiwa ni Hananias sa gawain nina Jeiel at Maaseias.
- source_word: מִשָּׂרֵי הַמֶּלֶךְ
  choice: isa sa mga pinuno ng hari
  rationale: Malawak ang saklaw ng שַׂר—pinuno, opisyal, o kumander. Ang 'pinuno' ay nagpapanatili ng saklaw nito nang hindi labis na tinutukoy ang eksaktong katungkulan.
