translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang 'pangkat-pangkat' para sa natural na daloy at malinaw na organisasyong militar. Inilagay ang bawat talababa sa mismong pariralang tinatalakay nito, sa halip na sundin ang tila napagpalit na puwesto ng mga marker sa consultation layer.
