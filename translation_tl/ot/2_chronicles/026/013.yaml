  naturalness: Natural ang “Sa ilalim ng kanilang pamumuno” at “hukbo.” Mas idiomatiko sa modernong Filipino ang “na may malaking lakas sa pakikipaglaban” kaysa “na nakikipagdigma nang buong lakas,” dahil iniiwasan nito ang di-kinakailangang impresyon na ang hukbo ay kasalukuyang nasa isang labanan.
  terminology: Ang “hukbo,” “hari,” at “kaaway” ay angkop na marangal ngunit karaniwang mga terminong Filipino. Pinanatili ang “pakikipaglaban” bilang natural na katumbas ng idiomang עֹשֵׂי מִלְחָמָה, at ang “malaking lakas” para sa lakas/kakayahang militar ng בְּכֹחַ חָיִל.
