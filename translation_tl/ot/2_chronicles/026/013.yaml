  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “pamumuno” at “hukbo” bilang natural na mga terminong militar; iniwasan ang literal ngunit alanganing “sa pamamagitan ng kanilang kamay” at “puwersa ng hukbo.”
