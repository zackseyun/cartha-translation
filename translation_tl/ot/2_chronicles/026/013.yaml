  text: Under their command was an army of 307,500[a], making war with mighty power, to help the king against the enemy.
translation:
  language: tl
  text: Sa ilalim ng kanilang pamumuno ay may hukbong 307,500[a], na may malaking lakas sa pakikipaglaban upang tulungan ang hari laban sa kaaway.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O, sa mas pormal na pagkakasalin: “Sa ilalim ng kanilang pamumuno ay may puwersang militar na 307,500, mga mandirigmang lumalaban nang may lakas.” Isinalin sa pangunahing teksto sa natural na Filipino ang mga idyomang militar ng Hebreo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל יָדָם
  choice: Sa ilalim ng kanilang pamumuno
  rationale: Ang idyomang עַל יָדָם ay tumutukoy sa pangangasiwa o awtoridad ng mga pinunong binanggit sa naunang talata, hindi sa literal na kamay.
- source_word: חֵיל צָבָא
  choice: hukbo
  rationale: Ang tambalang Hebreo ay tumutukoy sa isang organisadong puwersang militar; natural at sapat ang “hukbo” sa modernong Filipino.
- source_word: שְׁלֹשׁ מֵאוֹת אֶלֶף וְשִׁבְעַת אֲלָפִים וַחֲמֵשׁ מֵאוֹת
  choice: 307,500
  rationale: Ito ang tuwirang kabuuan ng mga bilang sa Hebreo, na inilalahad sa karaniwang anyong numerikal para madaling basahin.
- source_word: עוֹשֵׂי מִלְחָמָה
  choice: na nakikipagdigma
  rationale: Mas tuwirang sinasalamin nito ang participial na pariralang “mga gumagawa ng digmaan” habang natural pa rin sa Filipino. Maaari itong maglarawan sa karaniwang tungkulin o kakayahan ng hukbo, hindi lamang sa isang kasalukuyang labanan.
- source_word: בְּכֹחַ חָיִל
  choice: nang buong lakas
  rationale: Pinagsasama ng parirala ang diwa ng lakas, kapangyarihan, at kakayahang militar. Ang “nang buong lakas” ay natural at nagpapanatili sa diin nang hindi nagdaragdag ng teknikal na kahulugan.
- source_word: לַעְזֹר לַמֶּלֶךְ
  choice: upang tulungan ang hari
  rationale: Tuwiran at natural na katumbas ng layuning ipinahahayag ng infinitive na עזר.
- source_word: עַל הָאוֹיֵב
  choice: laban sa kaaway
  rationale: Sa kontekstong militar, ipinahahayag ng עַל ang pagsalungat sa kaaway.
