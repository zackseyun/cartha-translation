  text: The total number of the heads of the fathers’ houses, for the mighty men of valor, was two thousand six hundred.
translation:
  language: tl
  text: Ang kabuuang bilang ng mga pinuno ng mga angkan para sa mga magigiting na mandirigma ay 2,600.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רָאשֵׁי הָאָבוֹת
  choice: mga pinuno ng mga angkan
  rationale: Sa kontekstong pang-angkan, tumutukoy ito sa mga pinuno ng mga sambahayan o angkang nagmula sa mga ninuno; natural at malinaw sa modernong Tagalog ang “mga pinuno ng mga angkan.”
- source_word: לְגִבּוֹרֵי חָיִל
  choice: na namamahala sa magigiting na mandirigma
  rationale: Ang לְ ay nagpapahiwatig ng kaugnayan o pananagutan ng mga pinuno sa pangkat ng mga bihasang mandirigma. Ginawang tahasan ang ugnayan nang hindi ipinapalagay na ang 2,600 mismo ang bilang ng lahat ng mandirigma.
- source_word: אַלְפַּיִם וְשֵׁשׁ מֵאוֹת
  choice: 2,600
  rationale: Eksaktong inilalahad ang bilang sa karaniwang modernong anyong numerikal.
