translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Pinanatili ang pagkakaiba sa pagitan ng mga pinuno na binilang at ng magigiting na mandirigmang nasa ilalim ng kanilang pamamahala.
