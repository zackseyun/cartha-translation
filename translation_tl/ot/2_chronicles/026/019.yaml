  source_fidelity: Tumpak na naipapahayag ng draft ang galit ni Uzias, ang insensaryong hawak niya para sa pagsusunog ng insenso, ang biglaang paglitaw ng צָרַעַת sa kanyang noo habang kaharap ang mga pari, at ang lokasyon sa bahay ni Yahweh malapit sa altar ng insenso. Gayunman, ang “mismo” sa “sa harap mismo” ay dagdag na diin na wala sa לִפְנֵי. Ang talababa ay dapat ding magpaliwanag ng saklaw ng termino nang hindi tinutukoy ang sakit mismo bilang “karumihan.”
  naturalness: Marangal at madaling unawain ang rehistro. Ang pag-iwas sa magkasunod na “habang” ay nagpapadaloy sa pangungusap nang hindi binabago ang ugnayang pangyayari.
  terminology: Ang “Uzias,” “insensaryo,” “altar ng insenso,” at “Yahweh” ay angkop. Ang “malubhang sakit sa balat” ay isang maingat na kontekstuwal na salin ng צָרַעַת; ang talababa ang wastong lugar upang linawin na hindi ito kinakailangang modernong ketong/Hansen’s disease.
