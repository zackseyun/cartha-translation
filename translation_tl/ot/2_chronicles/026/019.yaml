id: 2CH.26.19
reference: 2 Chronicles 26:19
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יִּזְעַף֙ עֻזִּיָּ֔הוּ וּ/בְ/יָד֥/וֹ מִקְטֶ֖רֶת לְ/הַקְטִ֑יר וּ/בְ/זַעְפּ֣/וֹ עִם הַ/כֹּהֲנִ֗ים וְ֠/הַ/צָּרַעַת זָרְחָ֨ה בְ/מִצְח֜/וֹ לִ/פְנֵ֤י הַ/כֹּֽהֲנִים֙ בְּ/בֵ֣ית יְהוָ֔ה מֵ/עַ֖ל לְ/מִזְבַּ֥ח הַ/קְּטֹֽרֶת־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/019.yaml
  text: Then Uzziah became angry[a], with a censer in his hand to burn incense; and while he was angry with the priests, leprosy broke out on his forehead before the priests in the house of Yahweh, beside the altar of incense.
translation:
  language: tl
  text: Nagalit si Uzias; may hawak siyang insensaryo upang magsunog ng insenso. Habang galit siya sa mga pari, biglang lumitaw sa kanyang noo ang isang malubhang sakit sa balat[a], sa harap ng mga pari, sa bahay ni Yahweh, sa tabi ng altar ng insenso.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Hebreo ay maaaring tumukoy sa iba’t ibang sakit sa balat na nagdudulot ng karumihan sa ritwal, hindi lamang sa sakit na tinatawag ngayong ketong o Hansen’s disease.
    reason: Nililinaw ang mas malawak at hindi ganap na tiyak na saklaw ng צָרַעַת nang hindi ito ipinapantay sa isang modernong diagnosis.
lexical_decisions:
- source_word: וַיִּזְעַף
  choice: Nagalit
  rationale: Ipinapahayag nito ang pagpasok ni Uzias sa kalagayan ng galit nang hindi dinaragdagan ang tindi na hindi tiyak sa pandiwang Hebreo.
- source_word: עֻזִּיָּהוּ
  choice: Uzias
  rationale: Ginamit ang nakaugaliang anyo ng pangalang ito sa Filipino.
- source_word: מִקְטֶרֶת
  choice: insensaryo
  rationale: Tumutukoy ito sa sisidlang ginagamit sa ritwal na pagsusunog ng insenso; maikli at likas ang terminong ito sa Filipino.
- source_word: לְהַקְטִיר
  choice: upang magsunog ng insenso
  rationale: Malinaw na ipinahahayag ang layunin ng pawatas at ang mismong gawaing panritwal.
- source_word: וּבְזַעְפּוֹ עִם הַכֹּהֲנִים
  choice: Habang galit siya sa mga pari
  rationale: Pinananatili ang pangyayari bilang kalagayang kasabay ng biglang paglitaw ng sakit.
- source_word: הַצָּרַעַת
  choice: isang malubhang sakit sa balat
  rationale: Mas malawak ang saklaw ng terminong Hebreo kaysa sa makabagong Hansen's disease; iniiwasan nito ang hindi tiyak na medikal na pagtukoy habang ipinahahayag ang bigat ng karamdaman.
- source_word: זָרְחָה
  choice: biglang lumitaw
  rationale: Ang literal na larawan ay pagningning o pagsilang ng liwanag, ngunit dito ay tumutukoy sa kapansin-pansin at biglaang paglitaw sa noo.
- source_word: בְמִצְחוֹ
  choice: sa kanyang noo
  rationale: Tuwirang katumbas at likas na pariralang anatomikal sa Filipino.
- source_word: לִפְנֵי הַכֹּהֲנִים
  choice: sa harap mismo ng mga pari
  rationale: Nililinaw na nangyari ito sa kanilang presensiya at nasaksihan nila.
- source_word: בְּבֵית יְהוָה
  choice: sa bahay ni Yahweh
  rationale: Pinananatili ang konkretong Hebreong ekspresyong 'bahay' at ang personal na banal na pangalan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang isinasatitik ang Tetragrammaton bilang personal na pangalan sa halip na palitan ito ng isang titulo.
- source_word: מֵעַל לְמִזְבַּח הַקְּטֹרֶת
  choice: sa tabi ng altar ng insenso
  rationale: Ipinahahayag ang kaugnayang panlunan sa altar nang hindi pinipilit ang siksik at medyo hindi tiyak na kombinasyon ng mga pang-ukol sa Hebreo.
theological_decisions:
- issue: Saklaw ng צָרַעַת
  choice: isang malubhang sakit sa balat
  alternative: ketong
  rationale: Hindi kinakailangang tumukoy ang salita sa sakit na kilala ngayon bilang Hansen's disease. Pinananatili ng salin ang malubhang karumihang panritwal at pisikal na kapinsalaan sa salaysay nang hindi nagbibigay ng labis na tiyak na diagnosis.
- issue: Paglalarawan sa sanhi o ahensiya ng sakit
  choice: biglang lumitaw
  alternative: ipinabagsak ng Diyos sa kanya
  rationale: Hindi tahasang binabanggit ng talata ang ahente bagaman malinaw ang hatol sa mas malawak na salaysay; hindi nagdagdag ang salin ng hindi nakasaad sa mismong pangungusap.
- issue: Pangalan na יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Pinananatili ang personal na pangalang nasa tekstong Hebreo sa halip na palitan ito ng titulong panrelihiyon.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “insensaryo” at “altar” bilang pamilyar na bokabularyong panritwal; pinanatili ang “bahay ni Yahweh” upang masalamin ang konkretong ekspresyon ng Hebreo. Inilagay ang talababa pagkatapos ng “sakit sa balat,” ang terminong aktuwal nitong nililinaw.
