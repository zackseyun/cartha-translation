  - severity: low
    issue: Hindi sapat na tumpak ang “karumihan sa balat” sa talababa
    rationale: Ang צָרַעַת ay maaaring tumukoy sa isang kondisyon o sakit sa balat na may ritwal na karumihan, ngunit ang “karumihan” ay resulta/kategoryang ritwal at hindi tuwirang pangalan ng sakit sa kontekstong ito.
