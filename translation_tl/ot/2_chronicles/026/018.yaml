revisions:
- from: Hinarap nila si Haring Uzias[a] at sinabi sa kanya, “Hindi ikaw, Uzias, ang dapat magsunog ng insenso para kay Yahweh. Gawain ito ng mga pari, na mga anak ni Aaron, na itinalaga upang magsunog ng insenso. Lumabas ka sa santuwaryo, sapagkat nagtaksil ka sa iyong tungkulin[b], at hindi ito magdudulot sa iyo ng karangalan mula kay Yahweh na Diyos.”[c]
  to: Sinalungat nila si Haring Uzias[a] at sinabi sa kanya, “Hindi ikaw, Uzias, ang dapat magsunog ng insenso para kay Yahweh, kundi ang mga paring anak ni Aaron na itinalaga upang magsunog ng insenso. Lumabas ka sa santuwaryo, sapagkat naging di-tapat ka, at hindi ito magdudulot sa iyo ng karangalan mula sa Diyos na si Yahweh.”[c]
  rationale: Pinalitan ang panimulang pandiwa upang malinaw na maipahayag ang pagsalungat. Inalis ang interpretibong dagdag na “sa iyong tungkulin” at ginawang “naging di-tapat ka,” na mas malapit sa bigat ng מעל nang hindi nagdaragdag ng hindi tahasang layon. Inayos din ang pariralang tumutukoy sa mga paring Aaronita at ang hulíng parirala para sa mas natural na Filipino. Napanatili ang footnote b bilang leksikal na alternatibo, ngunit hindi ito nilagyan ng anchor sa pangunahing teksto sapagkat hindi ginagamit ang pangunahing alternatibo; ang mga aktibong anchor na a at c ay nasa wastong lokasyon.
