    issue: “nagtaksil ka sa iyong tungkulin” para sa מָעַלְתָּ
    rationale: Ang Hebreo ay nagsasaad ng mabigat na kawalang-katapatan/paglabag sa sagradong kaayusan, ngunit hindi nito tahasang sinasabing “sa iyong tungkulin.” Ang dagdag na layon ay interpretibong pagpapaliit.
  - severity: low
    issue: “Hinarap nila” ay hindi gaanong malinaw na pagsalungat
    rationale: Maaaring mangahulugan ang “hinarap” ng simpleng pagharap. Ang עמד על sa kontekstong ito ay malinaw na pagsalungat o pagkontra.
  - severity: low
    issue: Hindi gaanong natural ang “mula kay Yahweh na Diyos”
    rationale: Mas idiomatiko sa Filipino ang appositional na “mula sa Diyos na si Yahweh,” habang pinananatili ang kahulugang YHWH Elohim.
