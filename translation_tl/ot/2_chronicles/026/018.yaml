base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/018.yaml
  text: They stood against King Uzziah and said to him[a], “It is not for you, Uzziah, to burn incense to Yahweh, but for the priests, the sons of Aaron, who are consecrated to burn incense. Leave the sanctuary, for you have acted unfaithfully[c][b], and it will not be for your honor from Yahweh God.”
translation:
  language: tl
  text: Sinalungat nila si Haring Uzias[a] at sinabi sa kanya, “Hindi ikaw, Uzias, ang dapat magsunog ng insenso para kay Yahweh, kundi ang mga paring anak ni Aaron na itinalaga upang magsunog ng insenso. Lumabas ka sa santuwaryo, sapagkat naging di-tapat ka, at hindi ito magdudulot sa iyo ng karangalan mula sa Diyos na si Yahweh.”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “Hinarap nila.”
    reason: lexical_alternative
  - marker: c
    text: 'Sa literal: “at hindi sa iyo ukol sa karangalan mula kay Yahweh na Diyos.” Eliptiko ang pahayag; ang diwa ay hindi magbubunga ng karangalang mula sa Diyos ang ginawa ni Uzias.'
    reason: textual_clarity
lexical_decisions:
- source_word: וַיַּעַמְדוּ עַל
  choice: Hinarap nila
  rationale: Ang idyoma ay nagsasaad ng matatag na pagharap o pagsalungat, hindi lamang pagtayo sa tabi. Natural sa modernong Tagalog ang “hinarap” at malinaw ang diwang komprontasyonal.
- source_word: עֻזִּיָּהוּ הַמֶּלֶךְ
  choice: Haring Uzias
  rationale: Ginamit ang natural na ayos ng titulo at pangalan sa Tagalog at ang nakaugaliang anyong Tagalog na “Uzias.”
- source_word: לֹא לְךָ ... לְהַקְטִיר
  choice: Hindi ikaw ... ang dapat magsunog
  rationale: Ipinapahayag ng konstruksiyon na hindi ito karapatan o nararapat na gampanin ni Uzias, nang hindi dinaragdagan ng modernong konsepto ng pormal na awtorisasyon.
- source_word: לְהַקְטִיר
  choice: magsunog ng insenso
  rationale: Sa kontekstong pangsantuwaryo, tumutukoy ito sa paghahandog sa pamamagitan ng pagsusunog ng insenso.
- source_word: לַיהוָה
  choice: para kay Yahweh
  rationale: Tuwirang kinakatawan ang banal na pangalang YHWH; ang “para kay” ay natural na nagpapahayag ng pagtatalaga ng handog sa Tagalog.
- source_word: כִּי לַכֹּהֲנִים בְּנֵי אַהֲרֹן
  choice: Gawain ito ng mga pari, na mga anak ni Aaron
  rationale: Pinananatili ang eksklusibong gampanin ng mga paring Aaronita at ang pormal na katawagang “mga anak ni Aaron.”
- source_word: הַמְקֻדָּשִׁים
  choice: na itinalaga
  rationale: Ipinahihiwatig ang pagbubukod para sa banal na paglilingkod sa malinaw at karaniwang wikang Filipino.
- source_word: צֵא מִן הַמִּקְדָּשׁ
  choice: Lumabas ka sa santuwaryo
  rationale: Tuwirang pinananatili ang pautos na “lumabas” at ang malawak na kahulugan ng מקדש bilang banal na santuwaryo.
- source_word: מָעַלְתָּ
  choice: nagtaksil ka sa iyong tungkulin
  rationale: Ang מעל ay mabigat na paglabag sa banal na kaayusan o katapatan. Nililinaw ng “sa iyong tungkulin” ang kontekstong panggampanin nang hindi ito ibinababa sa simpleng pagkakamali.
- source_word: וְלֹא לְךָ לְכָבוֹד
  choice: hindi ito magdudulot sa iyo ng karangalan
  rationale: Natural na binubuo sa Tagalog ang eliptikong Hebreo habang pinananatili ang diwang ang ginawa ni Uzias ay hindi hahantong sa karangalan.
- source_word: מֵיְהוָה אֱלֹהִים
  choice: mula kay Yahweh na Diyos
  rationale: Pinananatili ang Diyos bilang pinagmumulan ng karangalan at iniiwasang ituring ang “Yahweh God” na isang di-natural na tambalang pangalan sa Tagalog.
theological_decisions:
- issue: Eksklusibong gampanin ng mga pari sa pagsusunog ng insenso
  choice: Ang pagsusunog ng insenso para kay Yahweh ay gampanin ng mga paring anak ni Aaron na itinalaga para rito.
  alternative: Isang pangkalahatang pahayag lamang tungkol sa pamumuno sa pagsamba.
  rationale: Partikular ang teksto sa gawaing kultiko ng pagsusunog ng insenso at sa mga paring Aaronita; hindi nito tinatalakay lamang sa abstraktong paraan ang hari at pari.
- issue: Bigat ng מָעַלְתָּ
  choice: Malubhang pagtataksil o paglabag sa banal na tungkulin at kaayusan.
  alternative: Isang maliit o pamamaraang pagkakamali lamang.
  rationale: Sa kontekstong banal at pangtipan, mabigat ang מעל at tumutukoy sa kawalang-katapatan o sakrilehiyosong paglabag.
- issue: Kahulugan ng pangwakas na sugnay
  choice: Ang ginawa ni Uzias ay hindi magdudulot sa kanya ng karangalang nagmumula sa Diyos.
  alternative: Isang pormulang tahasang nagsasabing aalisin ng Diyos ang lahat ng karangalan ni Uzias.
  rationale: Eliptiko ang Hebreo. Pinananatili ng salin ang negatibong kaugnayan sa karangalan mula sa Diyos nang hindi nagdaragdag ng tiyak na parusang hindi tahasang sinabi.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang mga terminong pangsantuwaryo na “insenso,” “pari,” at “santuwaryo.” Ginamit ang “Yahweh” upang tuwirang katawanin ang tetragrammaton, at iniwasan ang labis na teknikal o denominasyonal na pananalita.
