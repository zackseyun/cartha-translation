base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/015.yaml
  text: In Jerusalem he made devices[a], invented by skillful men, to be on the towers and on the corners, to shoot arrows and large stones. And his fame spread far abroad[c][b], for he was marvelously helped until he became strong.
translation:
  language: tl
  text: Sa Jerusalem, gumawa siya ng mga kagamitan[a] na likha ng isang bihasang tagapagdisenyo. Inilagay ang mga ito sa mga tore at sa mga panulukan upang magpalipad ng mga palaso at maghagis ng malalaking bato. Lumaganap ang kanyang katanyagan sa malalayong lugar[b], sapagkat tinulungan siya sa kamangha-manghang paraan[c] hanggang sa lumakas siya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “mga makina” o “mga mekanismo”—mga kagamitang pandigma na dinisenyo upang gamitin sa mga tore at panulukan ng mga tanggulan.
    reason: lexical_alternative
  - marker: b
    text: Literal, “lumabas ang kanyang pangalan hanggang sa malayo.”
    reason: lexical_alternative
  - marker: c
    text: Hindi tahasang sinasabi rito kung sino ang tumulong sa kanya, bagaman ipinahihiwatig ng konteksto na ang tulong ay mula sa Diyos.
    reason: alternative_reading
lexical_decisions:
- source_word: חִשְּׁבֹנוֹת
  choice: mga kagamitan
  rationale: Tumutukoy ang salita sa mga inimbento o pinag-isipang mekanismo. Malawak at likas sa modernong Tagalog ang “mga kagamitan,” at hindi nito labis na tinutukoy kung anong uri ng sinaunang makinang pandigma ang mga ito.
- source_word: מַחֲשֶׁבֶת חוֹשֵׁב
  choice: likha ng isang mahusay na tagapagdisenyo
  rationale: Pinananatili nito ang magkaugnay na diwa ng sadyang pagdidisenyo at ng taong bihasa sa gawaing iyon. Ginamit ang isahan sapagkat isahan ang חוֹשֵׁב sa tekstong Hebreo.
- source_word: עַל הַמִּגְדָּלִים וְעַל הַפִּנּוֹת
  choice: sa mga tore at sa mga panulukan
  rationale: Tuwirang tumutukoy ang מִגְדָּלִים sa mga tore. Ang “mga panulukan” ay nagpapanatili sa larawan ng פִּנּוֹת habang ipinahihiwatig ng konteksto na mga sulok ito ng mga tanggulan.
- source_word: לִירוֹא בַּחִצִּים וּבָאֲבָנִים גְּדֹלוֹת
  choice: upang ipampana at ipanghagis ng malalaking bato
  rationale: Ipinapahayag ng parirala ang layunin ng mga kagamitan. Bagaman iisang pandiwang Hebreo ang sumasaklaw sa mga palaso at bato, mas malinaw at likas sa Tagalog ang “ipampana” para sa mga palaso at “ipanghagis” para sa malalaking bato.
- source_word: וַיֵּצֵא שְׁמוֹ עַד לְמֵרָחוֹק
  choice: lumaganap ang kanyang katanyagan sa malalayong lugar
  rationale: Idyoma ang literal na “lumabas ang kanyang pangalan” para sa paglaganap ng reputasyon. Inihahatid ng salin ang kahulugan nito sa natural na Tagalog, habang inilalagay sa talababa ang literal na larawan.
- source_word: הִפְלִיא לְהֵעָזֵר
  choice: tinulungan siya sa kamangha-manghang paraan
  rationale: Pinananatili ng pasibong pagkakabuo ang di-pagbanggit sa tumulong, at ipinapahayag ng “sa kamangha-manghang paraan” ang pambihira o kahanga-hangang diwa ng הִפְלִיא.
- source_word: עַד כִּי חָזָק
  choice: hanggang sa lumakas siya
  rationale: Natural na ipinahahayag ng “lumakas” ang pag-abot niya sa kalagayang inilalarawan ng חָזָק nang hindi nagdaragdag ng antas na wala sa teksto.
theological_decisions:
- issue: Hindi tahasang tinukoy kung sino ang tumulong sa hari
  choice: Pinanatiling di-tiyak ang gumagawa sa “tinulungan siya sa kamangha-manghang paraan.”
  alternative: “Kamangha-mangha siyang tinulungan ng PANGINOON.”
  rationale: Bagaman ipinahihiwatig ng mas malawak na konteksto na mula sa Diyos ang tulong, walang tahasang pinangalanang gumagawa sa sugnay na Hebreo. Kaya hindi ito idinagdag sa pangunahing teksto.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “panulukan” sa halip na mas teknikal na terminong pangkuta, at pinanatiling pasibo ang pahayag tungkol sa tulong upang huwag pangalanan ang gumagawa kapag hindi ito tahasang binanggit sa Hebreo.
