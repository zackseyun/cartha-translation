  source_fidelity: 'May isang mahalagang pagkukulang sa sugnay ng layunin: nawawala ang mga palaso, at ang “ng malalaking bato” ay nagiging layon ng kapuwa “ipampana” at “ipanghagis.” Dapat tahasang maisalin ang חִצִּים bilang “mga palaso.” Ang ibang pangunahing diwa—mga kagamitang pandigma, mga tore at panulukan, paglaganap ng katanyagan, at di-tahasang tumulong—ay wasto at maingat na naipahayag.'
  naturalness: Natural sa modernong Filipino ang kabuuang rehistro. Mas malinaw at mas idiomatiko ang “magpalipad ng mga palaso at maghagis ng malalaking bato” kaysa sa kasalukuyang pagkakabuo, na hindi kumpleto at may malabong sintaks.
  terminology: Ang “mga kagamitan,” “mga tore,” “mga panulukan,” at “katanyagan” ay angkop. Ang “bihasang tagapagdisenyo” ay mas likas kaysa “mahusay na tagapagdisenyo,” habang pinananatili ang sinadyang pagdidisenyo ng Hebreo. Wastong hindi pinangalanan sa pangunahing teksto ang tumulong.
