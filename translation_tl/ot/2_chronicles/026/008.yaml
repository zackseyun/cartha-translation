base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/008.yaml
  text: The Ammonites gave tribute to Uzziah[a], and his fame spread as far as the entrance of Egypt[b], for he had become exceedingly strong.
translation:
  language: tl
  text: Nagbigay ng tributo kay Uzias ang mga Ammonita, at lumaganap ang kanyang katanyagan hanggang sa pasukan ng Egipto[a], sapagkat naging napakalakas niya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “pasukan ng Egipto” ay maaaring tumukoy sa daang papunta sa Egipto o sa rehiyon sa hanggahan nito.
    reason: cultural_note
lexical_decisions:
- source_word: הָעַמּוֹנִים
  choice: mga Ammonita
  rationale: Karaniwang makabagong katawagan sa Tagalog para sa pangkat etniko o bansang Ammon.
- source_word: מִנְחָה
  choice: tributo
  rationale: Sa kontekstong pampolitika ng pagbibigay ng isang banyagang bayan sa hari, tumutukoy ito sa tributo, hindi sa pangkalahatang regalo o handog na panrelihiyon.
- source_word: וַיֵּלֶךְ שְׁמוֹ
  choice: lumaganap ang kanyang katanyagan
  rationale: Ang literal na 'lumakad ang kanyang pangalan' ay idyomang tumutukoy sa paglaganap ng reputasyon o katanyagan.
- source_word: עַד לְבוֹא מִצְרַיִם
  choice: hanggang sa pasukan ng Egipto
  rationale: Pinananatili nito ang larawan ng Hebreong 'pagpasok/pasukan ng Egipto' at hindi tiyak na nililimitahan ang kahulugan sa mismong hanggahan.
- source_word: הֶחֱזִיק
  choice: naging malakas
  rationale: Sa kontekstong ito, ang Hiphil ng חזק ay nagpapahayag ng pagiging o paglakas.
- source_word: עַד לְמַעְלָה
  choice: napaka-
  rationale: Ang idyoma ay nagpapasidhi sa lakas sa napakataas na antas; likas itong ipinahahayag sa Tagalog sa pamamagitan ng 'napakalakas.'
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang 'tributo' para sa pampolitikang konteksto at 'katanyagan' upang likas na maipahayag ang Hebreong idyoma tungkol sa pangalan. Isang talababa lamang ang inilagay; ang impormasyong ang 'pangalan' ay nangangahulugang reputasyon ay naisalin na nang malinaw sa pangunahing teksto at hindi nangangailangan ng hiwalay na lexical footnote.
