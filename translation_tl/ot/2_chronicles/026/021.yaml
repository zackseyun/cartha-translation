  to: At si Haring Uzias ay may sakit sa balat hanggang sa araw ng kaniyang kamatayan. Nanirahan siya sa isang hiwalay na bahay[a], na may sakit sa balat, sapagkat inihiwalay siya mula sa bahay ni Yahweh. Ang anak niyang si Jotam ang namahala sa sambahayan ng hari at humatol sa mga mamamayan ng lupain.
