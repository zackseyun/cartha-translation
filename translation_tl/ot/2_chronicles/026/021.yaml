base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/021.yaml
  text: And King Uzziah was leprous until the day of his death[a], and he lived in a separate house, leprous, because he was cut off from the house of Yahweh. And Jotham his son was over the king’s house[b], judging the people of the land.
translation:
  language: tl
  text: At si Haring Uzias ay may sakit sa balat hanggang sa araw ng kaniyang kamatayan. Nanirahan siya sa isang hiwalay na bahay[a], na may sakit sa balat, sapagkat inihiwalay siya mula sa bahay ni Yahweh. Ang anak niyang si Jotam ang namahala sa sambahayan ng hari at humatol sa mga mamamayan ng lupain.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literal na maaaring isalin: “bahay ng kalayaan.” Malamang na tumutukoy ito sa isang tirahang nakabukod kung saan nanirahan si Uzias dahil sa kaniyang kalagayan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְצֹרָע
  choice: may malubhang sakit sa balat
  rationale: Ang צרעת sa Bibliya ay mas malawak kaysa sa modernong klinikal na ketong. Iniiwasan ng saling ito ang maling tiyak na diagnosis habang ipinahihiwatig ang bigat ng kalagayan ni Uzias.
- source_word: בֵּית הַחפשות
  choice: isang hiwalay na bahay
  rationale: Mahirap ang parirala, na literal na maaaring unawaing 'bahay ng kalayaan.' Sa konteksto, malamang na tumutukoy ito sa tirahang nakahiwalay dahil sa kaniyang karumihang ritwal at pagkakabukod.
- source_word: נִגְזַר מִבֵּית יְהוָה
  choice: inihiwalay siya sa bahay ni Yahweh
  rationale: Ang נִגְזַר ay nagpapahayag ng pagkaputol o pagkakahiwalay. Ang 'inihiwalay' ay natural sa Filipino at pinananatili ang diwa ng pagkakait sa kaniya ng pagpasok sa templo.
- source_word: בֵּית יְהוָה
  choice: bahay ni Yahweh
  rationale: Pinananatili ang literal na larawang 'bahay' at ang tipanang pangalan na Yahweh; sa konteksto, ito ang templo.
- source_word: עַל בֵּית הַמֶּלֶךְ
  choice: namahala sa sambahayan ng hari
  rationale: Ipinahihiwatig ng idyoma ang pangangasiwa sa palasyo o sambahayang maharlika. Mas likas ito sa modernong Filipino kaysa sa literal na 'nasa ibabaw ng bahay ng hari.'
- source_word: שׁוֹפֵט אֶת עַם הָאָרֶץ
  choice: humatol sa mga mamamayan ng lupain
  rationale: Pinananatili ng 'humatol' ang pangunahing leksikal na diwa, bagaman maaaring kabilang dito ang mas malawak na pamamahala.
- source_word: עַם הָאָרֶץ
  choice: mga mamamayan ng lupain
  rationale: Natural at hindi labis na teknikal na salin na hindi nililimitahan ang parirala sa isang partikular na uring panlipunan.
theological_decisions:
- issue: Paglalarawan sa צרעת
  choice: may malubhang sakit sa balat
  alternative: ketongin
  rationale: Hindi dapat ipantay nang tiyak ang biblikal na צרעת sa modernong Hansen's disease. Ang piniling salin ay nagpapanatili sa pisikal at ritwal na bigat ng kalagayan nang hindi nag-aangkat ng di-tiyak na diagnosis.
- issue: Pagsasalin sa pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Ang tekstong Hebreo ay tahasang gumagamit ng Tetragrammaton; pinananatili rito ang personal na pangalang tipanan na Yahweh.
- issue: Saklaw ng tungkulin ni Jotam
  choice: humatol
  alternative: namahala
  rationale: Ang participle na שׁוֹפֵט ay maaaring tumukoy sa paghatol at mas malawak na pamamahala. Pinananatili ng 'humatol' ang leksikal na tensiyon nang hindi tahasang pinalalawak ang tungkulin.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang 'sakit sa balat' sa halip na 'ketong' upang hindi ipakahulugan na tiyak na modernong Hansen's disease ang biblikal na צרעת. Inayos ang daloy upang maging natural, ngunit pinanatili ang mahahalagang pag-uulit at ambiguwidad ng Hebreo.
