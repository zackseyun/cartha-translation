- from: Siya ang nagtayo ng Elot at nagbalik nito sa Juda[a] matapos mahimlay ang hari kasama ng kanyang mga ninuno.[b]
  to: Siya ang nagtayo ng Elot at ibinalik niya ito[a] sa Juda matapos mahimlay ang hari kasama ng kanyang mga ninuno.[b]
  rationale: Pinalitan ang hindi natural na “nagbalik nito” ng “ibinalik niya ito,” na mas malinaw na naghahayag ng causative na pagbabalik ng Elot sa Juda. Inilipat ang talababa a upang tumukoy ito mismo sa isinaling pandiwa. Pinanatili ang pangalan ng lugar, ang “ang hari,” at ang eupemistikong pormula ng kamatayan.
