  text: He built Eloth and restored it to Judah after the king slept with his fathers[a][b].
translation:
  language: tl
  text: Siya ang nagtayo ng Elot at ibinalik niya ito[a] sa Juda matapos mahimlay ang hari kasama ng kanyang mga ninuno.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “isinauli niya ito.”
    reason: lexical_alternative
  - marker: b
    text: Ang “mahimlay kasama ng kanyang mga ninuno” ay isang idyomang Hebreo na nangangahulugang mamatay.
    reason: cultural_note
lexical_decisions:
- source_word: בָּנָה
  choice: nagtayo
  rationale: Karaniwang nangangahulugang “magtayo” ang pandiwa. Posibleng ipinahihiwatig ng konteksto ang muling pagtatayo, ngunit hindi iyon tahasang sinasabi ng salitang Hebreo.
- source_word: אֵילוֹת
  choice: Elot
  rationale: Pangalan ito ng lugar. Ang “Elot” ay tuwirang transliterasyon na angkop sa bigkas at baybay ng modernong Filipino.
- source_word: וַיְשִׁיבֶהָ
  choice: nagbalik nito
  rationale: 'Ang Hiphil ng שוב ay may diwang sanhi: pinabalik niya ang Elot sa Juda, malamang sa pamamahala nito. Pinananatili ng “nagbalik nito” ang pagkilos nang hindi dinaragdagan ang teksto ng tahasang paliwanag na pampolitika.'
- source_word: לִיהוּדָה
  choice: sa Juda
  rationale: Ipinakikita ng ל ang hantungan o tumanggap ng pagbabalik; natural itong ipinahahayag sa Filipino bilang “sa Juda.”
- source_word: אַחֲרֵי שְׁכַב
  choice: matapos mahimlay
  rationale: Ang literal na larawan ay paghiga o pagtulog, ngunit sa pormulang panghari ay tumutukoy ito sa kamatayan. Ang “mahimlay” ay marangal at likas sa Filipino at napapanatili ang eupemistikong diwa.
- source_word: הַמֶּלֶךְ
  choice: ang hari
  rationale: Pinananatili ang mismong katawagan sa Hebreo sa halip na idagdag ang pangalang Amazias mula sa konteksto.
- source_word: עִם אֲבֹתָיו
  choice: kasama ng kanyang mga ninuno
  rationale: Sa idyomang ito, ang אָבוֹת ay tumutukoy sa mga ninuno. Mas malinaw at natural sa modernong Filipino ang “mga ninuno” kaysa sa literal na “mga ama.”
