translation_notes:
  register: Gumamit ng modernong, marangal, at madaling maunawaang Filipino. Pinanatili ang biglang pagtukoy na “ang hari” at ang eupemistikong pormula ng kamatayan, habang nilinaw sa talababa ang kahulugan nito.
