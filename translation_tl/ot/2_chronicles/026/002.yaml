  source_fidelity: 'Tumpak ang pangunahing diwa: si Uzzias ang nagtayo ng Elot at ibinalik ito sa Juda pagkatapos ng pagkamatay ng hari. Gayunman, ang “nagbalik nito” ay hindi likas na paraan sa modernong Filipino para sa causative na וַיְשִׁיבֶהָ; mas tumpak at malinaw ang “ibinalik niya ito.” Napananatili ng “mahimlay ... kasama ng kanyang mga ninuno” ang eupemistikong pormulang Hebreo nang hindi tahasang pinapalitan ng “namatay.”'
  naturalness: Marangal at madaling unawain ang rehistro, ngunit hindi natural ang “nagbalik nito.” Ang binagong ayos na “ibinalik niya ito” ay karaniwang gamit at malinaw ang tinutukoy na Elot.
  terminology: Ang “Elot,” “Juda,” at “hari” ay angkop na mga anyo. Ang “mga ninuno” ay isang natural na modernong Filipino na katumbas ng pormulang “mga ama” sa kontekstong ito.
