base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/023.yaml
  text: And Uzziah slept with his fathers[a], and they buried him with his fathers in the burial field that belonged to the kings, for they said, “He is a leper.” And Jotham his son reigned in his place.
translation:
  language: tl
  text: At namahinga si Uzias kasama ng kanyang mga ninuno. Inilibing nila siya kasama ng kanyang mga ninuno sa lupang libingan na para sa mga hari, sapagkat sinabi nila, “May sakit siya sa balat[a].” At ang anak niyang si Jotam ang naghari kapalit niya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “May ketong siya.” Ang salitang Hebreo ay tumutukoy sa taong may צָרַעַת, isang uri ng sakit na maaaring mas malawak kaysa sa tinatawag ngayong ketong o Hansen’s disease.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: namahinga
  rationale: Sa pormulang ginagamit sa pagkamatay ng isang hari, ang pandiwa ay isang magalang na idyoma para sa kamatayan. Pinananatili ng “namahinga” ang tayutay nang mas natural sa modernong Tagalog kaysa sa literal na “natulog.”
- source_word: עִם אֲבֹתָיו
  choice: kasama ng kanyang mga ninuno
  rationale: Ang “mga ninuno” ay natural at malinaw na katumbas ng dinastikong pormula; hindi nito nililimitahan ang tinutukoy sa mismong ama lamang.
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: inilibing nila siya
  rationale: Pinananatili ang aktibong pandiwang maramihan at ang di-tiyak na mga tagapaglibing sa Hebreo.
- source_word: בִּשְׂדֵה הַקְּבוּרָה
  choice: sa lupang libingan
  rationale: Ang שָׂדֶה ay isang bukid o malawak na bahagi ng lupa. Ang “lupang libingan” ay natural sa Tagalog at pinananatili ang konkretong diwa nang hindi nagmumungkahi ng karaniwang sementeryo.
- source_word: אֲשֶׁר לַמְּלָכִים
  choice: na para sa mga hari
  rationale: Pinananatili nito ang posibleng ugnayang pag-aari o pagkakatalaga nang hindi tiyak na ipinapakahulugang legal na pagmamay-ari.
- source_word: מְצוֹרָע
  choice: may sakit sa balat
  rationale: Tumutukoy ito sa taong may צָרַעַת, isang sinaunang kategoryang hindi dapat itumbas nang tiyak sa modernong Hansen’s disease. Inilalagay sa talababa ang tradisyonal na “ketong.”
- source_word: וַיִּמְלֹךְ
  choice: naghari
  rationale: Ito ang tuwiran at karaniwang salin ng pandiwa sa pormula ng paghalili sa trono.
- source_word: תַּחְתָּיו
  choice: kapalit niya
  rationale: Malinaw nitong ipinahahayag ang paghalili sa posisyon, hindi lamang ang pagkakasunod sa panahon.
theological_decisions:
- issue: Paglalarawan sa מְצוֹרָע bilang ritwal at medikal na termino
  choice: May sakit siya sa balat
  alternative: May ketong siya
  rationale: Masaklaw ang sinaunang צָרַעַת at hindi ito tiyak na katumbas ng modernong ketong o Hansen’s disease. Iniiwasan ng pangunahing salin ang maling tiyak na diagnosis, habang pinananatili sa talababa ang pamilyar na tradisyonal na salin.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog. Ginamit ang “namahinga” upang mapanatili ang idyomang pangkamatayan, at “mga ninuno” bilang natural na dinastikong pahayag. Inilagay ang panandang [a] kaagad pagkatapos ng terminong nililinaw nito.
