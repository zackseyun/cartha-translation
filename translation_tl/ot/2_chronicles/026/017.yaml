base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/017.yaml
  text: Azariah the priest went in after him[a], and with him were eighty priests of Yahweh, valiant men.
translation:
  language: tl
  text: Pumasok kasunod niya si Azarias na pari, kasama ang walumpung pari ni Yahweh, na pawang magigiting na lalaki.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga lalaking may tapang at lakas.” Ang idyomang Hebreo na בְּנֵי חָיִל ay maaaring tumukoy sa mga lalaking kilala sa lakas, tapang, o kagitingan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא אַחֲרָיו
  choice: Pumasok na kasunod niya
  rationale: Ang בוא ay maaaring mangahulugang pumasok, dumating, o pumunta. Sa konteksto, sinusundan ni Azarias ang hari papasok, kaya malinaw at likas ang “Pumasok na kasunod niya” nang hindi dinaragdagan ang lugar na hindi tahasang binanggit sa talata.
- source_word: עֲזַרְיָהוּ הַכֹּהֵן
  choice: ang paring si Azarias
  rationale: Ginamit ang karaniwang anyong Filipino ng pangalan at ang likas na ayos na “ang paring si…” upang tukuyin ang katungkulan ni Azarias.
- source_word: וְעִמּוֹ
  choice: kasama
  rationale: Ipinapahayag ng parirala ang pagsama ng mga pari kay Azarias; sapat at natural sa Filipino ang “kasama” kahit walang hiwalay na pandiwa sa Hebreo.
- source_word: כֹּהֲנִים לַיהוָה
  choice: mga pari ni Yahweh
  rationale: Ipinahihiwatig ng ל ang kaugnayan o paglilingkod ng mga pari kay Yahweh. Ang “mga pari ni Yahweh” ay maikli, malinaw, at natural.
- source_word: שְׁמוֹנִים
  choice: walumpu
  rationale: Tuwirang salin ng bilang na cardinal.
- source_word: בְּנֵי חָיִל
  choice: mga lalaking magigiting
  rationale: Ang idyomang Hebreo ay tumutukoy sa mga lalaking may lakas, tapang, o kagitingan. Sa konteksto ng pagharap nila sa hari, ang “mga lalaking magigiting” ay natural at pinananatili ang panlalaking pagtukoy.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Tuwirang ginagamit sa talata ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalang tipan sa halip na palitan ito ng titulo.
- issue: Panlalaking anyo ng בְּנֵי חָיִל
  choice: mga lalaking magigiting
  alternative: mga magigiting
  rationale: Panlalaki ang anyong Hebreo at mga lalaking pari ang tinutukoy sa konteksto, kaya hindi inalis ang tahasang pagtukoy sa kasarian.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang em dash upang ilahad ang huling parirala bilang paglalarawan sa walumpung pari. Inilagay ang talababa sa pariralang talagang may leksikal na alternatibo.
