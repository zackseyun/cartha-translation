  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/יֶ֨תֶר֙ דִּבְרֵ֣י עֻזִּיָּ֔הוּ הָ/רִאשֹׁנִ֖ים וְ/הָ/אֲחֲרֹנִ֑ים כָּתַ֛ב יְשַֽׁעְיָ֥הוּ בֶן אָמ֖וֹץ הַ/נָּבִֽיא־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/022.yaml
  text: The rest of the acts of Uzziah[a], first and last, Isaiah son of Amoz the prophet wrote.
translation:
  language: tl
  text: Ang iba pang mga ginawa ni Uzias[a], mula sa una hanggang sa huli, ay isinulat ng propetang si Isaias na anak ni Amoz.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa mas literal na salin, “ang iba pang mga salita tungkol kay Uzias, ang mga una at ang mga huli.” Ang “mga salita” rito ay isang paraan ng pananalita sa Hebreo para sa mga pangyayari o ginawa sa panahon ng kanyang paghahari.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר
  choice: Ang iba pa
  rationale: Ang יֶתֶר ay tumutukoy sa natitira o iba pang bahagi. Likas sa modernong Tagalog ang “ang iba pa” sa pormulang nagbubuod sa paghahari.
- source_word: דִּבְרֵי
  choice: mga ginawa
  rationale: Bagaman literal na “mga salita,” ang דִּבְרֵי sa pormula ng mga tala tungkol sa hari ay tumutukoy sa mga gawa o pangyayari sa kanyang paghahari.
- source_word: עֻזִּיָּהוּ
  choice: Uzias
  rationale: Ginamit ang nakaugaliang anyong Tagalog ng pangalang Uzziah; ito ang pangalang nasa talata, hindi ang ibang anyong Azarias.
- source_word: הָרִאשֹׁנִים וְהָאֲחֲרֹנִים
  choice: mula sa una hanggang sa huli
  rationale: Ipinahahayag nito ang buong saklaw ng paghahari at natural na naisasalin sa Tagalog bilang “mula sa una hanggang sa huli.”
- source_word: כָּתַב
  choice: isinulat
  rationale: Tuwirang katumbas ito ng pandiwang “sumulat,” at pinananatili nito ang diin ng pinagmulang teksto sa pagkakasulat.
- source_word: יְשַׁעְיָהוּ בֶן אָמוֹץ הַנָּבִיא
  choice: ng propetang si Isaias na anak ni Amoz
  rationale: Natural na ayos sa Tagalog para sa pangalan, patronimiko, at tiyak na titulong propetiko.
theological_decisions:
- issue: Kahulugan ng דִּבְרֵי sa pormula ng mga tala ng hari
  choice: Isinaling “mga ginawa”
  alternative: “mga salita” o “mga bagay tungkol kay”
  rationale: Sa kontekstong historiograpiko ng Mga Cronica, tumutukoy ito sa mga gawa at pangyayari sa paghahari, hindi lamang sa mga sinalita ng hari. Nasa talababa ang mas literal na anyo upang mapanatili ang leksikal na impormasyon.
- issue: Ugnayan ni Isaias sa nakasulat na salaysay
  choice: Pinanatiling tahasan na si Isaias ang sumulat
  alternative: “itinala ni Isaias”
  rationale: Ang כָּתַב ay payak na “sumulat.” Hindi pinalawak ang pahayag upang tukuyin ang anyo, lawak, o kanonisidad ng sinulat ni Isaias.
- issue: Panimulang וְ
  choice: Hindi isinalin bilang hiwalay na “at” o “ngayon”
  alternative: “At ang iba pa”
  rationale: Sa Tagalog, malinaw ang paglipat sa pangwakas na buod kahit walang tahasang pang-ugnay; iniiwasan din nitong magpasok ng temporal na “ngayon” na wala sa Hebreo.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang karaniwang ayos na “propetang si Isaias” at ang pormulang “ay isinulat” upang maging natural ang pangungusap habang napapanatili ang pagkakasangkot ng lahat ng sangkap ng Hebreo.
