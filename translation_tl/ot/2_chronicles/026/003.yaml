base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/003.yaml
  text: Uzziah was sixteen years old when he became king[a], and he reigned fifty-two years in Jerusalem. His mother’s name was Jecoliah[b], from Jerusalem.
translation:
  language: tl
  text: Labing-anim na taong gulang si Uzias nang maging hari siya[a], at limampu't dalawang taon siyang naghari sa Jerusalem. Ang pangalan ng kanyang ina ay Jecolias[b], na taga-Jerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo: “nang magsimula siyang maghari” o “sa kanyang pagluklok bilang hari.”'
    reason: lexical_alternative
  - marker: b
    text: Ang pangalang Jecolias ay maaari ring isulat na Jequilias.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן שֵׁשׁ עֶשְׂרֵה שָׁנָה
  choice: Labing-anim na taong gulang
  rationale: Likas na salin sa modernong Tagalog ng idyomang Hebreo na nagsasaad ng edad.
- source_word: בְמָלְכוֹ
  choice: nang siya'y maging hari
  rationale: Ipinahihiwatig ng parirala ang panahon ng pagluklok o pagsisimula ng paghahari; malinaw at natural ito sa Tagalog.
- source_word: וַחֲמִשִּׁים וּשְׁתַּיִם שָׁנָה מָלַךְ
  choice: limampu't dalawang taon siyang naghari
  rationale: Pinananatili ang tagal at aktibong diwa ng pandiwang tumutukoy sa paghahari.
- source_word: בִּירוּשָׁלִָם
  choice: sa Jerusalem
  rationale: Tuwirang locative na salin ng pariralang Hebreo.
- source_word: וְשֵׁם אִמּוֹ
  choice: Ang pangalan ng kanyang ina ay
  rationale: Natural at marangal na anyo sa Tagalog ng pormulang pangangkanan.
- source_word: יכיליה
  choice: Jecolias
  rationale: Transliterasyong angkop sa nakaugaliang anyo ng mga pangalang biblikal sa Tagalog; inilalahad sa talababa ang ibang posibleng anyo.
- source_word: מִן יְרוּשָׁלִָם
  choice: na taga-Jerusalem
  rationale: Natural na Tagalog para sa pinagmulan o bayang kinamulatan na ipinahahayag ng מִן.
