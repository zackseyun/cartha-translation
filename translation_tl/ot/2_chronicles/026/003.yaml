  source_fidelity: Tumpak na naipapahayag ng salin ang edad ni Uzias sa pagluklok, ang limampu’t dalawang taon ng kanyang paghahari sa Jerusalem, at ang pinagmulan ng kanyang ina. Ang “nang siya’y maging hari” ay mauunawaan, ngunit mas tuwiran at idiomatiko ang “nang maging hari siya” para sa naganap na pagluklok.
  naturalness: Natural at marangal ang pangungusap. Inayos ang ayos ng salita sa unang sugnay para sa mas malinaw na modernong Tagalog, at pinasimple ang pahayag sa talababa b.
  terminology: Ang “Uzias,” “Jecolias,” at “Jerusalem” ay katanggap-tanggap na nakaugaliang anyo sa Tagalog. Ang “Jecolias” ay pinanatili; ang alternatibong anyo sa talababa ay ipinahayag nang walang hindi natural na paggamit ng pantukoy bago sa pangalan.
