base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/001.yaml
  text: Then all the people of Judah took Uzziah[a], who was sixteen years old[b], and made him king in place of his father Amaziah.
translation:
  language: tl
  text: Pagkatapos, kinuha[a] ng buong bayan ng Juda si Uzias, na labing-anim na taong gulang[b], at ginawa siyang hari bilang kapalit ng kanyang amang si Amazias.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O: “pinili.” Literal na “kinuha” ang pandiwang Hebreo, ngunit sa kontekstong ito ay tumutukoy ito sa ginawa ng bayan upang iluklok si Uzias.'
    reason: lexical_alternative
  - marker: b
    text: 'Literal: “at siya ay labing-anim na taong gulang.” Ang pangatnig sa Hebreo ay maaaring unawain bilang payak na pag-uugnay, hindi bilang “bagaman.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: kinuha
  rationale: Pinananatili nito ang literal na diwa ng לקח (“kumuha”), habang ipinahihiwatig ng konteksto na itinampok o pinili ng bayan si Uzias upang maging hari.
- source_word: כָּל עַם יְהוּדָה
  choice: buong bayan ng Juda
  rationale: Likas at kolektibong salin ito ng “lahat ng bayan ng Juda,” at pinananatili ang diin sa sambayanan.
- source_word: עֻזִּיָּהוּ
  choice: Uzias
  rationale: Direktang anyong Filipino ng pangalang Uzziah na nasa tekstong Hebreo; hindi ginamit ang kahaliling pangalang Azarias.
- source_word: וְהוּא בֶּן שֵׁשׁ עֶשְׂרֵה שָׁנָה
  choice: na labing-anim na taong gulang
  rationale: Natural na Filipino para sa literal na “at siya ay anak ng labing-anim na taon.” Ang neutral na sugnay na may “na” ay hindi nagpapasok ng di-tiyak na pasalungat na kahulugang “bagaman.”
- source_word: וַיַּמְלִיכוּ אֹתוֹ
  choice: at ginawa siyang hari
  rationale: 'Malinaw na ipinapahayag ang causative na anyo ng מלך: ginawa o itinalaga nila siyang hari, nang hindi nagdaragdag ng seremonya ng koronasyon.'
- source_word: תַּחַת
  choice: bilang kapalit ng
  rationale: Sa konteksto ng paghalili sa trono, ang תַּחַת ay tumutukoy sa pagkuha ng puwesto ng naunang hari.
- source_word: אָבִיו אֲמַצְיָהוּ
  choice: kanyang amang si Amazias
  rationale: Likas na Filipino na nagpapanatili sa kaugnayang ama-anak at sa personal na pangalan.
