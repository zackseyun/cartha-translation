translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang literal na “kinuha” sa pangunahing teksto at ipinaliwanag ang kontekstuwal na “pinili” sa talababa. Iniwasan ang pasalungat na “bagaman” sapagkat hindi ito kinakailangan ng Hebreo.
