base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/014.yaml
  text: And Uzziah prepared for them[a], for the whole army, shields and spears and helmets and coats of armor and bows and slingstones.
translation:
  language: tl
  text: At naghanda si Uzias para sa kanila—para sa buong hukbo—ng mga kalasag, sibat, helmet, mga baluti sa katawan, pana, at mga batong pangtirador.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “mga bato ng mga tirador,” o mga batong ginagamit sa mga tirador.
    reason: lexical_clarification
lexical_decisions:
- source_word: וַיָּכֶן
  choice: naghanda
  rationale: Ipinahahayag ng Hiphil ng כון na tiniyak ni Uzias na nakahanda o magagamit ang kagamitan; hindi nito kinakailangang sabihing siya ang gumawa ng mga iyon.
- source_word: לָהֶם
  choice: para sa kanila
  rationale: Pinananatili ang panghalip sa Hebreo; nililinaw ng kasunod na pariralang “para sa buong hukbo” kung sino ang tinutukoy.
- source_word: לְכָל הַצָּבָא
  choice: para sa buong hukbo
  rationale: Ang צָבָא sa kontekstong ito ay tumutukoy sa puwersang militar, at natural sa modernong Tagalog ang “buong hukbo.”
- source_word: מָגִנִּים
  choice: mga kalasag
  rationale: Karaniwan at tiyak na katawagan sa kagamitang pandepensa.
- source_word: רְמָחִים
  choice: mga sibat
  rationale: Malinaw at pangkalahatang katawagan sa sandatang tinutukoy ng רֹמַח.
- source_word: כּוֹבָעִים
  choice: mga helmet
  rationale: Sa talaan ng kagamitang pandigma, tumutukoy ito sa pananggalang sa ulo; ang “helmet” ang pinakanatural at madaling maunawaan sa modernong Filipino.
- source_word: שִׁרְיֹנוֹת
  choice: mga baluting panangga sa katawan
  rationale: Tumutukoy ito sa baluting nag-iingat sa katawan. Iniiwasan ang labis na espesipikong “baluting tanikala,” sapagkat hindi iyon tahasang itinatakda ng salita.
- source_word: קְשָׁתוֹת
  choice: mga pana
  rationale: Tuwirang salin ng pangmaramihang katawagan para sa pana.
- source_word: אַבְנֵי קְלָעִים
  choice: mga batong pangtirador
  rationale: Ang literal na parirala ay “mga bato ng mga panghilagpos/tirador.” Ang “mga batong pangtirador” ay maikli at mauunawaan bilang mga batong ginagamit na bala sa sinaunang sandatang panghilagpos.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang mga gitling na pahaba upang malinaw na ang “para sa buong hukbo” ay nagpapaliwanag sa “para sa kanila.” Ang “baluting panangga sa katawan” ay sadyang mas malinaw kaysa sa payak na “baluti,” at ang footnote marker ay inilagay sa terminong kaugnay nito.
