  to: At naghanda si Uzias para sa kanila—para sa buong hukbo—ng mga kalasag, sibat, helmet, mga baluti sa katawan, pana, at mga batong pangtirador.[a]
  rationale: Pinalitan ang redundanteng “baluting panangga sa katawan” ng mas natural na “mga baluti sa katawan.” Pininasimple rin ang footnote upang malinaw na maipakita ang literal na Hebreong parirala at ang gamit ng mga bato, nang hindi gumagamit ng hindi karaniwang katawagan. Ang kahulugan, bilang, at lawak ng pinagmulang teksto ay hindi binago.
