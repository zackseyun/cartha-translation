  text: וַ/יַּ֥עַשׂ הַ/יָּשָׁ֖ר בְּ/עֵינֵ֣י יְהוָ֑ה כְּ/כֹ֥ל אֲשֶׁר עָשָׂ֖ה אֲמַצְיָ֥הוּ אָבִֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/004.yaml
  text: He did what was right in the eyes of Yahweh[a], according to all that Amaziah his father had done.
translation:
  language: tl
  text: Ginawa niya ang tama sa paningin ni Yahweh[a], ayon sa lahat ng ginawa ng kanyang amang si Amazias.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “sa harap ng PANGINOON.”
    reason: Nagbibigay ng likas na alternatibong salin sa idyomang בְּעֵינֵי at ng tradisyonal na paglalahad sa banal na pangalan.
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Ginawa niya
  rationale: Ang wayyiqtol ng עשה ay nagsasaad ng kasunod na kilos sa salaysay. Hindi kailangang isalin nang hiwalay ang panimulang waw upang maging natural sa Tagalog.
- source_word: הַיָּשָׁר
  choice: ang tama
  rationale: Kasama ng pandiwang עשה, tumutukoy ito sa paggawa ng bagay na tama o matuwid. Ang “ang tama” ay malinaw at natural sa makabagong Tagalog.
- source_word: בְּעֵינֵי
  choice: sa paningin ni
  rationale: Pinananatili nito ang Hebreong talinghaga tungkol sa pagsusuri o pananaw ng isang persona at likas din itong pakinggan sa Tagalog.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin bilang personal na pangalan ng Diyos sa halip na palitan ng isang titulo.
- source_word: כְּכֹל אֲשֶׁר
  choice: ayon sa lahat ng
  rationale: Pinananatili ng parirala ang diwa ng pagtulad o pagsunod sa isang huwaran at ang saklaw na ipinahihiwatig ng כֹל.
- source_word: עָשָׂה
  choice: ginawa
  rationale: Sapat na ipinahihiwatig ng konteksto sa Tagalog na nauna ang mga ginawa ni Amazias; hindi kailangan ang mas mabigat na anyo upang markahan ang aspektong iyon.
- source_word: אֲמַצְיָהוּ
  choice: Amazias
  rationale: Ginamit ang nakaugaliang anyong Filipino ng pangalang Amaziah.
- source_word: אָבִיו
  choice: kanyang amang
  rationale: Sa kontekstong pangkasaysayan, si Amazias ang mismong ama ng tinutukoy, hindi lamang isang ninuno. Natural sa Tagalog ang pagkakabuo na “kanyang amang si Amazias.”
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Tuwirang ginagamit sa Hebreo ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalan, samantalang ang “PANGINOON” ay tradisyonal na pamalit na titulo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang Hebreong talinghagang “sa paningin” at ang komprehensibong diwa ng “lahat,” nang hindi ginagawang labis na literal ang ayos ng pangungusap.
