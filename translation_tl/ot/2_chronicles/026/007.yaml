  text: וַ/יַּעְזְרֵ֨/הוּ הָֽ/אֱלֹהִ֜ים עַל פְּלִשְׁתִּ֧ים וְ/עַל ה/ערביים הַ/יֹּשְׁבִ֥ים בְּ/גוּר בָּ֖עַל וְ/הַ/מְּעוּנִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/007.yaml
  text: God helped him against the Philistines[a], against the Arabians who lived in Gur-baal, and against the Meunites.
translation:
  language: tl
  text: Tinulungan siya ng Diyos laban sa mga Filisteo, sa mga Arabe na naninirahan sa Gur-Baal, at sa mga Meunita.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga Maonita.” Maaaring ang etnonimong Hebreo ay tumukoy sa isang kaugnay na pangkat o ibang anyo ng pangalan nito.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעְזְרֵהוּ
  choice: Tinulungan siya
  rationale: Tuwirang ipinapahayag ng pandiwang עזר na ang Diyos ang tumulong sa kanya; natural at malinaw ito sa makabagong Tagalog.
- source_word: הָאֱלֹהִים
  choice: ng Diyos
  rationale: Bagaman may pantukoy sa Hebreo, karaniwang tumutukoy ito sa Diyos ng Israel; ang “Diyos” ang likas na salin sa Tagalog.
- source_word: עַל
  choice: laban sa
  rationale: Sa kontekstong militar at kasunod ng pandiwang “tumulong,” ipinahihiwatig ng עַל ang mga kalabang hinarap.
- source_word: פְּלִשְׁתִּים
  choice: mga Filisteo
  rationale: Ito ang karaniwang katawagang Tagalog sa pangkat na פלשתים.
- source_word: הערביים
  choice: mga Arabe
  rationale: Natural na makabagong katawagang Tagalog ito para sa mga taong mula sa Arabia, nang hindi nagdaragdag ng pagkakakilanlang wala sa teksto.
- source_word: הַיֹּשְׁבִים
  choice: na naninirahan
  rationale: Ipinapahayag ng participle ng ישב ang patuloy na paninirahan sa isang lugar; malinaw at marangal ang “naninirahan.”
- source_word: בְּגוּר בָּעַל
  choice: sa Gur-Baal
  rationale: Pangalan ito ng lugar; ang בְּ ay likas na isinasaling “sa” sa Tagalog.
- source_word: הַמְּעוּנִים
  choice: mga Meunita
  rationale: Transliterasyon ito ng etnonimong מעונים. Hindi tiyak ang eksaktong pagkakakilanlan, kaya pinananatili sa talababa ang posibleng kaugnay o alternatibong anyo.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang payak na ayos ng salaysay at ang tuwirang pagkilos ng Diyos bilang tumutulong kay Uzias. Inilipat ang talababa sa “mga Meunita,” ang salitang tunay na may alternatibong pagkakabasa o pagkakakilanlan sa ibinigay na ebidensiya.
