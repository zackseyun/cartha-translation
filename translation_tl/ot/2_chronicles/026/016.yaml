base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/016.yaml
  text: But when he became strong, his heart was lifted up to his destruction, and he acted unfaithfully against Yahweh his God and entered the temple of Yahweh to burn incense on the altar of incense.
translation:
  language: tl
  text: Ngunit nang maging makapangyarihan siya, nagmataas ang kanyang puso, na humantong sa kanyang kapahamakan. Nagtaksil siya kay Yahweh na kanyang Diyos at pumasok sa templo ni Yahweh upang magsunog ng insenso sa altar ng insenso.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּכְחֶזְקָתוֹ
  choice: Ngunit nang maging makapangyarihan siya
  rationale: 'Ang כְּ sa parirala ay temporal dito: “nang/noong siya ay lumakas.” Ang “maging makapangyarihan” ay natural sa konteksto ng hari at pinananatili ang ugnayang temporal na humahantong sa kanyang pagmamataas.'
- source_word: גָּבַהּ לִבּוֹ
  choice: nagmataas ang kanyang puso
  rationale: Pinananatili nito ang Hebreong larawan ng pusong naging mataas habang malinaw na ipinahihiwatig ang pagmamataas sa natural at dignified na Tagalog.
- source_word: עַד לְהַשְׁחִית
  choice: na humantong sa kanyang kapahamakan
  rationale: Ang עַד לְ ay nagsasaad ng kinalabasan o sukdulan. Ang “humantong sa kanyang kapahamakan” ay malinaw na ipinapakitang ang pagmamataas niya ay nauwi sa mapaminsalang resulta, nang hindi nililipat ang diin sa simpleng masasamang asal.
- source_word: וַיִּמְעַל
  choice: Nagtaksil siya
  rationale: Ang מעל ay tumutukoy sa paglabag sa katapatan, lalo na laban sa Diyos. Ang “nagtaksil” ay maikli, natural, at may bigat ng paglabag sa tipan.
- source_word: בַּיהוָה אֱלֹהָיו
  choice: kay Yahweh na kanyang Diyos
  rationale: Kasama ng מעל, ang בְּ ay nagpapakilala sa pinagtaksilan. Ang “kay” ay natural na Tagalog para sa personal na layon ng pagtataksil.
- source_word: הֵיכַל יְהוָה
  choice: templo ni Yahweh
  rationale: Ang הֵיכָל dito ay gusali ng templo o santuwaryo. Ang “templo” ang pinakatuwiran at madaling maunawaang katumbas sa kontekstong ito.
- source_word: לְהַקְטִיר
  choice: upang magsunog ng insenso
  rationale: Sa kontekstong pangkulto, ang Hiphil ng קטר ay pagsusunog o paghahandog ng insenso. Ang “magsunog ng insenso” ay direkta at umaayon sa kasunod na altar.
- source_word: מִזְבַּח הַקְּטֹרֶת
  choice: altar ng insenso
  rationale: Ito ang tuwirang katawagan sa altar na itinakda para sa insenso at likas na parirala sa modernong Tagalog.
theological_decisions:
- issue: Pagpapakilala sa pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON / Jehovah
  rationale: Ginagamit ng tekstong Hebreo ang banal na pangalang יהוה. Pinanatili ang “Yahweh” bilang personal at pangtipang pangalan ng Diyos, sa halip na palitan ito ng titulo.
- issue: Likas ng kasalanan ni Uzias sa וַיִּמְעַל
  choice: Nagtaksil siya kay Yahweh
  alternative: Nagkasala siya laban kay Yahweh / Hindi siya naging tapat kay Yahweh
  rationale: Pinananatili ng “nagtaksil” ang bigat ng מעל bilang paglabag sa katapatan sa Diyos, ngunit hindi nito ipinapasok ang isang partikular na denominasyonal na paliwanag sa tungkulin ng hari at pari.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Pinanatili ang larawang “nagmataas ang kanyang puso,” ngunit nilinaw sa natural na Tagalog ang resultang ipinahihiwatig ng עַד לְהַשְׁחִית. Ginamit ang “Yahweh” bilang transliterasyon ng banal na pangalan.
