    rationale: Maaaring ipahiwatig ng וַיַּבְהִלֻהוּ ang apurahang pagpapaalis, ngunit hindi nito kailangang magpahiwatig ng marahas o sapilitang pagkilos. Dapat iharap ang puwersa bilang posibilidad, hindi pangunahing diin.
