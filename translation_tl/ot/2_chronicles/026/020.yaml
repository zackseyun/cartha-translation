  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יִּ֣פֶן אֵלָ֡י/ו עֲזַרְיָהוּ֩ כֹהֵ֨ן הָ/רֹ֜אשׁ וְ/כָל הַ/כֹּהֲנִ֗ים וְ/הִנֵּה ה֤וּא מְצֹרָע֙ בְּ/מִצְח֔/וֹ וַ/יַּבְהִל֖וּ/הוּ מִ/שָּׁ֑ם וְ/גַם הוּא֙ נִדְחַ֣ף לָ/צֵ֔את כִּ֥י נִגְּע֖/וֹ יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/020.yaml
  text: Azariah the chief priest turned toward him[a], and all the priests also, and behold, he was leprous on his forehead. So they hurried him out of there, and he himself also hastened to go out[c][b], because Yahweh had struck him.
translation:
  language: tl
  text: Bumaling sa kanya si Azarias na punong pari, gayundin ang lahat ng mga pari, at nakita nila na may malubhang sakit siya sa balat sa kanyang noo[a]. Kaya dali-dali nila siyang inilabas mula roon[b]. Siya mismo ay nagmadali ring lumabas[c], sapagkat sinaktan siya ni Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Hebreo ay ginagamit sa mga kautusan tungkol sa ritwal na karumihan para sa isang malubhang sakit o pinsala sa balat. Hindi ito kinakailangang eksaktong tumukoy sa sakit na tinatawag ngayong ketong o Hansen’s disease.
    reason: cultural_note
  - marker: b
    text: Maaari ring isalin, “pinaalis nila siya agad mula roon.” Maaaring idiin ng pandiwang Hebreo ang apurahang pagpapaalis; maaari rin nitong ipahiwatig ang puwersahang pagkilos ng mga pari.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring isalin, “siya rin ay napilitang lumabas.” Maaaring ipahiwatig ng Hebreo na itinulak o inudyukan siyang palabas, bagaman maaaring idiin ng konteksto ang sarili niyang pagmamadali.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפֶן אֵלָיו
  choice: Humarap sa kanya
  rationale: Ang פנה na may אֵלָיו ay tumutukoy sa pagbaling o pagharap kay Uzias; natural sa modernong Tagalog ang “humarap sa kanya.”
- source_word: עֲזַרְיָהוּ כֹהֵן הָרֹאשׁ
  choice: si Azarias na punong pari
  rationale: Literal na “paring pinuno” ang parirala. Malinaw at dignificado ang “punong pari,” nang hindi kinakailangang ipilit ang isang teknikal na titulong hindi tahasang ginamit dito.
- source_word: וְכָל הַכֹּהֲנִים
  choice: gayundin ang lahat ng mga pari
  rationale: Ipinahihiwatig ng parirala na kasama sa pagharap at pagkakita ang iba pang mga pari.
- source_word: וְהִנֵּה
  choice: at nakita nilang
  rationale: Minamarkahan ng הִנֵּה ang biglaang pagkakatuklas. Sa natural na salaysay sa Tagalog, naipahahayag ito ng “at nakita nilang” nang hindi gumagamit ng artipisyal na “narito.”
- source_word: מְצֹרָע בְּמִצְחוֹ
  choice: may malubhang sakit sa balat ang kanyang noo
  rationale: Ang מְצֹרָע ay terminong kaugnay ng mga batas sa ritwal na karumihan at hindi tiyak na katumbas ng modernong Hansen’s disease. Iniiwasan ng salin ang mapanlinlang na medikal na espesipikasyon habang pinananatili ang bigat ng karamdaman.
- source_word: וַיַּבְהִלֻהוּ מִשָּׁם
  choice: dali-dali nila siyang inilabas mula roon
  rationale: Ang Hiphil ng בהל ay nagpapahiwatig ng agarang pagpapalabas o pagpapaalis; pinananatili ng “dali-dali” ang apurahang kilos nang hindi tahasang nagpapasiya kung marahas ito.
- source_word: וְגַם הוּא נִדְחַף לָצֵאת
  choice: Siya mismo ay nagmadali ring lumabas
  rationale: Binibigyang-diin ng וְגַם הוּא na si Uzias mismo ay nakibahagi sa agarang paglabas. Maaaring mangahulugan ang Niphal ng דחף na siya ay itinulak o napilitang lumabas, kaya inilalahad sa talababa ang alternatibo.
- source_word: כִּי נִגְּעוֹ יְהוָה
  choice: sapagkat pinarusahan siya ni Yahweh
  rationale: Sa kontekstong ito, ang נגע ay isang maparusa at makadiyos na pananakit o pagdagok, hindi neutral na paghipo. Natural sa Tagalog ang “pinarusahan” at malinaw nitong ipinapakita ang konteksto, bagaman ang mas literal na “sinaktan” ay maaari rin.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang banal na nasa tekstong Hebreo sa halip na palitan ito ng isang titulo.
theological_decisions:
- issue: Pagpapahayag sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Personal na pangalan ang Tetragrammaton sa tekstong Hebreo; pinananatili ito bilang “Yahweh” sa halip na palitan ng titulo.
- issue: Kung teknikal na titulong “mataas na pari” ang כֹהֵן הָרֹאשׁ
  choice: punong pari
  alternative: mataas na pari; paring pinuno
  rationale: Ang Hebreo ay literal na tumutukoy sa pari na nasa pangunahin o namumunong katungkulan. Pinananatili ng “punong pari” ang diwa nang hindi nagdaragdag ng teknikal na pagkakaibang hindi tahasang nasa parirala.
- issue: Likas na katangian ng מְצֹרָע
  choice: malubhang sakit sa balat
  alternative: ketongin; may ketong
  rationale: Ang terminong Hebreo ay mula sa sistemang pari ng ritwal na karumihan at hindi maaaring awtomatikong itumbas sa modernong Hansen’s disease. Ang talababa ay nagpapanatili sa kulturang-legal na konteksto.
- issue: Lakas o kusang-loob sa נִדְחַף לָצֵאת
  choice: nagmadali ring lumabas
  alternative: itinulak/pinilit ding lumabas
  rationale: Maaaring idiin ng anyong Hebreo ang pagkakatulak o pagkapilit, ngunit ipinakikita ng konteksto na si Uzias mismo ay agarang lumabas nang makilala niya ang ginawa ni Yahweh. Pinananatili sa talababa ang tunay na ambiguwidad.
translation_notes:
  register: Modernong Filipino Tagalog na dignificado at madaling maunawaan. Ginamit ang “Azarias” at “punong pari” bilang natural na anyong biblikal sa Tagalog. Inayos ang pangungusap upang maging malinaw na nakita ng mga pari ang karamdaman, habang pinanatili sa mga talababa ang ambiguwidad tungkol sa puwersa ng pagpapalabas at sa uri ng sakit sa balat.
