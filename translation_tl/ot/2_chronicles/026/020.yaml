revisions:
- from: Humarap sa kanya si Azarias na punong pari, gayundin ang lahat ng mga pari, at nakita nilang may malubhang sakit sa balat[a] ang kanyang noo. Kaya dali-dali nila siyang inilabas mula roon[b]. Siya mismo ay nagmadali ring lumabas[c], sapagkat pinarusahan siya ni Yahweh.
  to: Bumaling sa kanya si Azarias na punong pari, gayundin ang lahat ng mga pari, at nakita nila na may malubhang sakit siya sa balat sa kanyang noo[a]. Kaya dali-dali nila siyang inilabas mula roon[b]. Siya mismo ay nagmadali ring lumabas[c], sapagkat sinaktan siya ni Yahweh.
  rationale: Pinalitan ang interpretatibong “pinarusahan” ng mas tuwirang “sinaktan,” alinsunod sa נִגְּעוֹ. Nilinaw rin ang sintaksis ng karamdaman sa noo at pinino ang talababa tungkol sa apurahang pagpapaalis upang hindi magpahiwatig ng dahas nang higit sa hinihingi ng Hebreo.
