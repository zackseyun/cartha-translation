  yaml_path: translation/ot/2_chronicles/017/004.yaml
  text: but he sought the God of his father and walked in his commandments[b][a], and not according to the deeds of Israel.
translation:
  language: tl
  text: Ngunit[a] hinanap niya ang Diyos ng kaniyang ama at namuhay ayon sa kaniyang mga utos, at hindi ayon sa mga gawain ng Israel.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “Sapagkat” o “Dahil.” Ang pangatnig na Hebreo ay maaari ring magpahayag ng dahilan; ginamit ang “Ngunit” sa pangunahing teksto upang idiin ang kontrast sa naunang talata.
    reason: lexical_alternative
  - marker: b
    text: Ang “Israel” dito ay malamang na tumutukoy sa hilagang kaharian, bilang kaiba sa Juda.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: Sa halip
  rationale: Sa konteksto, ipinakikita ng pangatnig ang pagsalungat sa naunang binanggit na hindi niya paghanap sa mga Baal. Likas sa modernong Tagalog ang “Sa halip,” samantalang itinatala sa talababa ang maaari ring sanhing kahulugan.
- source_word: לֵאלֹהֵי אָבִיו
  choice: ang Diyos ng kanyang ama
  rationale: Ang לְ ay pananda ng layon ng דָּרַשׁ at hindi kailangang isalin nang hiwalay sa Tagalog. Pinananatili ng “kanyang ama” ang isahang אָבִיו at ang pagpapatuloy ng pananampalataya ng kanyang ama.
- source_word: דָּרָשׁ
  choice: hinanap
  rationale: Sa kontekstong ito, tumutukoy ito sa tapat at debosyonal na paghahanap sa Diyos, hindi lamang sa pagtatanong sa kanya.
- source_word: וּבְמִצְוֺתָיו הָלָךְ
  choice: at namuhay ayon sa kanyang mga utos
  rationale: Ipinahahayag ng “namuhay” ang metaporikal na diwa ng הָלַךְ bilang paraan ng pamumuhay. Ang “ayon sa” ay natural sa Tagalog at pinananatili ang pamantayang ibinibigay ng mga utos.
- source_word: וְלֹא כְּמַעֲשֵׂה
  choice: hindi ayon sa mga gawain ng
  rationale: Ang מַעֲשֶׂה rito ay tumutukoy sa asal o mga ginagawa. Malapit sa anyo ng Hebreo at malinaw sa Tagalog ang “mga gawain,” nang hindi dinaragdagan ang interpretasyon.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Israel lamang ang nasa tekstong Hebreo. Hindi ito pinalawak sa “hilagang kaharian” upang hindi ilagay sa pangunahing teksto ang isang kontekstuwal na pagpapakahulugan.
theological_decisions:
- issue: Tinutukoy ng “Israel”
  choice: Pinanatili ang “Israel” sa pangunahing teksto.
  alternative: ang hilagang kaharian ng Israel
  rationale: Malamang na tumutukoy ito sa hilagang kaharian bilang kaiba sa Juda, ngunit hindi iyon tahasang sinasabi ng talata. Pinananatili sa salin ang pagkakasabi at inilalagay ang kontekstuwal na paliwanag sa talababa.
- issue: Ugnayan ng כִּי sa naunang talata
  choice: “Sa halip” bilang pangunahing salin
  alternative: “Sapagkat” o “dahil”
  rationale: Ang paghahanap niya sa Diyos ng kanyang ama ay kasalungat ng hindi niya paghanap sa mga Baal sa naunang talata. Gayunman, tunay na posible rin ang sanhing pagbasa, kaya pinanatili iyon sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “namuhay ayon sa” upang maipahayag nang natural ang Hebreong metapora ng paglakad bilang paraan ng pamumuhay. Hindi pinalawak ang “Israel” sa pangunahing teksto, at inilagay ang tunay na alternatibong kahulugan ng כִּי sa talababa.
