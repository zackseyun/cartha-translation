  source_fidelity: 'Tumpak ang pangunahing diwa ng draft: naglagay si Jehoshafat ng puwersang militar sa mga pinatibay na lungsod ng Juda at naglagay ng mga puwestong militar/itinalaga sa Juda at sa mga lungsod ng Efraim na nakuha ni Asa. Gayunman, ang “mga himpilan” ay higit na tumutukoy sa mga lugar o base, samantalang ang נְצִיבִים ay maaaring tumukoy sa mga garison o mga itinalagang opisyal. Ang “mga garison” ang mas malapit sa piniling kahulugan sa agarang kontekstong militar at sa English audit trail.'
  naturalness: Mas natural at malinaw ang “mga kawal” para sa mga tauhang militar na inilagay sa mga lungsod. Ang “nagtalaga ... ng mga himpilan” ay hindi gaanong idiomatiko, dahil karaniwang nagtatalaga ng mga tao at naglalagay o nagtatatag ng mga himpilan. Ang “naglagay ... ng mga garison” ay mas maayos sa Filipino at tumutugma sa konteksto.
  terminology: Ang “mga pinatibay na lungsod” ay malinaw na katumbas ng fortified cities. Pinanatili ang mga pangalang “Juda,” “Efraim,” at “Asa.” Ang lexical na kalabuan ng נְצִיבִים ay dapat manatili sa talababa, nang hindi ipinipilit na ang kahulugan ay eksklusibong militar.
