base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/017/002.yaml
  text: And he stationed forces in all the fortified cities of Judah[a], and he placed garrisons in the land of Judah and in the cities of Ephraim that Asa his father had captured.
translation:
  language: tl
  text: Naglagay siya ng mga kawal sa lahat ng pinatibay na lungsod ng Juda, at naglagay siya ng mga garison[a] sa lupain ng Juda at sa mga lungsod ng Efraim na nakuha ng kanyang amang si Asa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga gobernador,” “mga kinatawan,” o “mga opisyal.” Ang salitang Hebreo ay maaaring tumukoy sa mga itinalagang opisyal o sa mga garison/pwestong militar; mas angkop sa konteksto rito ang “mga garison.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֶּן חַיִל
  choice: Naglagay siya ng mga hukbo
  rationale: Sa konteksto ng mga napapaderang lungsod, ang חַיִל ay tumutukoy sa puwersang militar. Ang “mga hukbo” ay malinaw at likas sa modernong Filipino, habang pinananatili ng “naglagay” ang malawak na diwa ng נתן.
- source_word: בְּכָל עָרֵי יְהוּדָה הַבְּצֻרוֹת
  choice: sa lahat ng napapaderang lungsod ng Juda
  rationale: Tumpak na inilalarawan ng “napapaderang lungsod” ang mga bayang pinatibay para sa pagtatanggol; pinananatili rin ang kabuuang saklaw ng בְּכָל.
- source_word: וַיִּתֵּן נְצִיבִים
  choice: nagtalaga siya ng mga himpilan
  rationale: Maaaring tumukoy ang נְצִיבִים sa mga itinalagang opisyal o sa mga garison/himpilang militar. Dahil militar ang agarang konteksto, pinili ang “mga himpilan,” ngunit inilalahad sa talababa ang tunay na leksikal na kalabuan.
- source_word: בְּאֶרֶץ יְהוּדָה
  choice: sa lupain ng Juda
  rationale: Pinananatili nito ang heograpikal at panteritoryong kahulugan ng אֶרֶץ, na mas malawak kaysa sa mga lungsod lamang.
- source_word: וּבְעָרֵי אֶפְרַיִם
  choice: at sa mga lungsod ng Efraim
  rationale: Tuwirang salin ng pariralang heograpikal at pantribo.
- source_word: אֲשֶׁר לָכַד
  choice: na sinakop
  rationale: Ang לכד ay karaniwang tumutukoy sa pagkuha o pagsakop sa mga lungsod sa kontekstong militar.
- source_word: אָסָא אָבִיו
  choice: ng kanyang amang si Asa
  rationale: Natural sa Filipino ang ayos na ito at malinaw na ipinakikitang si Asa ang ama ng tinutukoy na hari.
