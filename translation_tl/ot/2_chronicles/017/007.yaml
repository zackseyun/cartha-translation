  text: וּ/בִ/שְׁנַ֨ת שָׁל֜וֹשׁ לְ/מָלְכ֗/וֹ שָׁלַ֤ח לְ/שָׂרָי/ו֙ לְ/בֶן חַ֨יִל֙ וּ/לְ/עֹבַדְיָ֣ה וְ/לִ/זְכַרְיָ֔ה וְ/לִ/נְתַנְאֵ֖ל וּ/לְ/מִיכָיָ֑הוּ לְ/לַמֵּ֖ד בְּ/עָרֵ֥י יְהוּדָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/017/007.yaml
  text: And in the third year of his reign[a], he sent his officials—Ben-hail, Obadiah, Zechariah, Nethanel, and Micaiah—to teach in the cities of Judah.
translation:
  language: tl
  text: Nang ikatlong taon ng paghahari niya, isinugo niya ang kanyang mga opisyal[a]—sina Ben-Hail, Obadias, Zacarias, Netanel, at Micaías—upang magturo sa mga lungsod ng Juda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga prinsipe” o “mga pinuno”; ang salitang Hebreo ay maaaring tumukoy sa mga opisyal ng hari o ng pamahalaan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִשְׁנַת שָׁלוֹשׁ לְמָלְכוֹ
  choice: Nang ikatlong taon ng paghahari niya
  rationale: Likas itong panandang-panahon sa salaysay sa makabagong Tagalog. Ang “paghahari” ay nagpapanatili sa maharlikang diwa ng לְמָלְכוֹ.
- source_word: שָׁלַח
  choice: isinugo niya
  rationale: Tuwirang ipinahahayag ang pagpapadala na may atas; ang “isinugo” ay natural at marangal sa ganitong konteksto.
- source_word: לְשָׂרָיו
  choice: ang kanyang mga opisyal
  rationale: Maaaring tumukoy ang שַׂר sa prinsipe, pinuno, o opisyal. Sa konteksto ng mga kinatawang inatasan ng hari, malinaw ang “mga opisyal” nang hindi nagpapahiwatig na kabilang sila sa angkan ng hari.
- source_word: לְבֶן חַיִל וּלְעֹבַדְיָה וְלִזְכַרְיָה וְלִנְתַנְאֵל וּלְמִיכָיָהוּ
  choice: sina Ben-Hail, Obadias, Zacarias, Netanel, at Micaías
  rationale: Mga pangalang pantangi ang mga ito kaya tinumbasan ayon sa karaniwang anyong ginagamit sa Filipino, habang pinananatili ang natatanging Hebreong anyo ng Netanel.
- source_word: לְלַמֵּד
  choice: upang magturo
  rationale: Ang piel infinitive ng למד ay tuwirang nangangahulugang “magturo”; ipinakikita ng “upang” ang layunin ng pagsusugo.
- source_word: בְּעָרֵי יְהוּדָה
  choice: sa mga lungsod ng Juda
  rationale: Pinananatili nito ang payak na lokatibong kahulugan ng בְּ nang hindi idinaragdag sa pangunahing teksto ang posibleng distributibong diwang “sa buong.”
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mga opisyal” bilang madaling maunawaang katawagan sa mga kinatawan ng hari, at inilagay ang talababa kasunod mismo ng salitang tinutukoy nito.
