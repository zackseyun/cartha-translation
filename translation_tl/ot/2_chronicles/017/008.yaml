base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/017/008.yaml
  text: 'And with them were the Levites: Shemaiah[a], Nethaniah, Zebadiah, Asahel, Shemiramoth, Jehonathan, Adonijah, Tobijah, and Tob-adonijah; and with them were Elishama and Jehoram[c][b], the priests.'
translation:
  language: tl
  text: 'Kasama nila ang mga Levita: sina Semaias, Netanias, Zebadias, Asael, Semiramot, Jehonatan[a], Adonias, Tobias[b], at Tob-adonias[c]. Kasama rin nila sina Elisama at Jehoram, na mga pari.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “Jehonatan” ang mas mahabang anyo ng pangalang Hebreo; maaari rin itong gawing “Jonatan.”
    reason: lexical_alternative
  - marker: b
    text: Ang Hebreong pangalan ay Toviyahu; sa ibang salin, “Tobiah.”
    reason: lexical_alternative
  - marker: c
    text: Sa tekstong Hebreo, ang pangalang ito ay nakasulat bilang dalawang elemento; malamang na isa itong tambalang personal na pangalan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעִמָּהֶם
  choice: Kasama nila
  rationale: Natural na Filipino para sa pariralang nagpapakilala sa mga kasama; hindi na kailangang tumbasan ang ipinahiwatig na pandiwang 'were.'
- source_word: הַלְוִיִּם
  choice: ang mga Levita
  rationale: Pinananatili ang tiyak na pantukoy at ang tawag sa pangkat ng mga Levita.
- source_word: שְׁמַעְיָהוּ
  choice: Semaias
  rationale: Ginamit ang nakaugaliang anyo ng pangalang biblikal sa Filipino.
- source_word: נְתַנְיָהוּ
  choice: Netanias
  rationale: Malapit sa anyong Hebreo at natural sa pagbabaybay ng mga pangalang biblikal sa Filipino.
- source_word: זְבַדְיָהוּ
  choice: Zebadias
  rationale: Transliterasyong angkop sa Filipino ng pangalang Hebreo.
- source_word: עֲשָׂהאֵל
  choice: Asael
  rationale: Direkta at malinaw na transliterasyon sa Filipino.
- source_word: שמרימות
  choice: Semiramot
  rationale: Sinusundan ang konsonantal na anyong Hebreo sa paraang madaling bigkasin sa Filipino.
- source_word: יְהוֹנָתָן
  choice: Jehonatan
  rationale: Pinananatili ang mas mahabang anyong Hebreo sa halip na paikliin bilang Jonatan.
- source_word: אֲדֹנִיָּהוּ
  choice: Adonias
  rationale: Nakaugaliang Filipino na anyo ng pangalang biblikal.
- source_word: טוֹבִיָּהוּ
  choice: Tobias
  rationale: Nakaugaliang Filipino na anyo habang kinakatawan ang buong personal na pangalan.
- source_word: טוֹב אֲדוֹנִיָּה
  choice: Tob-adonias
  rationale: Ang gitling ay nagpapakitang malamang na iisang tambalang personal na pangalan ito, habang nakikita pa rin ang dalawang elemento sa Hebreo.
- source_word: הַכֹּהֲנִים
  choice: mga pari
  rationale: Karaniwan at malinaw na Filipino para sa mga kohen; hiwalay silang tinutukoy mula sa mga Levita.
theological_decisions:
- issue: Pagkakaiba ng mga Levita at mga pari
  choice: Inihiwalay ang unang pangkat bilang mga Levita at sina Elisama at Jehoram bilang mga pari.
  alternative: Ituring na mga Levita rin ang lahat ng nakalistang pangalan.
  rationale: Muling ginagamit ng Hebreo ang 'kasama nila' bago sina Elisama at Jehoram at saka sila tahasang kinikilalang mga pari; dapat mapanatili ang institusyonal na pagkakaibang ito.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang 'sina' para sa likas na paglalahad ng talaan ng mga pangalan, at pinanatiling magkahiwalay ang mga Levita at mga pari. Itinama ang pagkakabit ng mga talababa upang tumugma ang bawat paliwanag sa kaukulang pangalan.
