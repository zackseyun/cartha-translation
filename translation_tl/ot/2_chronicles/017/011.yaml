  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang aspektong imperpektibo upang ipakita ang patuloy o nakaugaliang pagdadala, at pinanatili sa mga talababa ang tunay na leksikal na kalabuan at ang kongkretong larawang Hebreo.
