base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/017/011.yaml
  text: 'And some of the Philistines were bringing Jehoshaphat tribute and silver[a], a burden[b]; the Arabians also were bringing him flocks: 7,700 rams and 7,700 male goats.'
translation:
  language: tl
  text: 'May mga Filisteo[a] ring nagdadala kay Jehosafat ng tributo at isang kargang pilak[b]. Nagdadala rin sa kanya ang mga Arabe ng mga alagang hayop: 7,700 lalaking tupa at 7,700 lalaking kambing.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “Mula rin sa mga Filisteo”; maaaring bigyang-diin ng Hebreo ang pinagmulan sa halip na sabihing ilan lamang sa kanila.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “pilak, isang karga”—ibig sabihin, pilak na dinala bilang tributo.
    reason: cultural_note
lexical_decisions:
- source_word: וּ/מִן פְּלִשְׁתִּים
  choice: May mga Filisteo ring
  rationale: Maaaring tumukoy ang מִן sa ilan sa pangkat o sa pinagmulan. Likas sa Tagalog ang “may mga Filisteo,” habang itinatala sa talababa ang alternatibong pagbasa na nagbibigay-diin sa pinagmulan.
- source_word: מְבִיאִים
  choice: nagdadala
  rationale: Ang participle ay nagpapahiwatig ng nagpapatuloy o paulit-ulit na gawain; malinaw itong naihahayag ng aspektong imperpektibo sa Tagalog.
- source_word: מִנְחָה
  choice: tributo
  rationale: Sa kontekstong pampolitika ng mga banyagang bayan at isang hari, tumutukoy ito sa tributong ibinibigay sa pinuno, hindi sa handog na panrelihiyon.
- source_word: וְ/כֶסֶף מַשָּׂא
  choice: at isang kargang pilak
  rationale: Pinananatili nito ang kongkretong diwa ng כֶּסֶף na “pilak” at מַשָּׂא na “karga/pasan,” ngunit natural at malinaw sa modernong Tagalog.
- source_word: גַּם הָעַרְבִיאִים
  choice: Nagdadala rin ... ang mga Arabe
  rationale: Pinananatili ng “rin” ang dagdag na diwa ng גַּם, at ang “mga Arabe” ay karaniwang makabagong katawagan sa pangkat.
- source_word: ל/וֹ צֹאן
  choice: sa kanya ... ng mga kawan
  rationale: Ang צֹאן ay kolektibong katawagan sa maliliit na alagang hayop, lalo na sa mga tupa at kambing; ang “mga kawan” ay angkop bago isa-isahin ang mga ito.
- source_word: אֵילִים
  choice: lalaking tupa
  rationale: Tiyak na tumutukoy ito sa mga adultong lalaking tupa; malinaw ito sa ordinaryong mambabasang Filipino.
- source_word: וּ/תְיָשִׁים
  choice: lalaking kambing
  rationale: Tiyak na lalaking kambing ang tinutukoy, kaya hindi sapat ang pangkalahatang “kambing.”
- source_word: שִׁבְעַת אֲלָפִים וּ/שְׁבַע מֵאוֹת
  choice: 7,700
  rationale: Mas madaling basahin ang numerong anyo sa modernong publikasyon at ganap nitong pinananatili ang bilang.
