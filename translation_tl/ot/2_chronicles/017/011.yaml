  source_fidelity: 'Ang pangunahing diwa ay tumpak: may ilang Filisteo na nagdadala ng tributo at pilak kay Jehosafat, at ang mga Arabe ay nagdadala ng tinukoy na bilang ng mga lalaking tupa at kambing. Gayunman, ang “mga kawan” ay hindi ang pinakatumpak na katumbas ng צֹאן sa konstruksyong ito; tumutukoy ito sa maliliit na hayop, at ang kasunod na bilang ay tuwirang naglilista ng mga hayop, hindi ng mga kawan. Ang “isang kargang pilak” ay katanggap-tanggap bilang pagpapalinaw sa “pilak, isang karga.”'
