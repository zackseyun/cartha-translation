  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יָּ֨כֶן יְהוָ֤ה אֶת הַ/מַּמְלָכָה֙ בְּ/יָד֔/וֹ וַ/יִּתְּנ֧וּ כָל יְהוּדָ֛ה מִנְחָ֖ה לִ/יהוֹשָׁפָ֑ט וַֽ/יְהִי ל֥/וֹ עֹֽשֶׁר וְ/כָב֖וֹד לָ/רֹֽב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/017/005.yaml
  text: So Yahweh established the kingdom in his hand[a], and all Judah gave tribute to Jehoshaphat; and he had riches and honor in abundance.
translation:
  language: tl
  text: Kaya't pinatatag ni Yahweh ang kaharian sa kanyang kamay, at ang buong Juda ay nagbigay ng tributo[a] kay Jehoshafat. Nagkaroon siya ng saganang kayamanan at karangalan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring mangahulugang “kaloob,” “regalo,” o “handog” ang salitang Hebreo; ngunit sa kontekstong maharlika rito, mas angkop ang “tributo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּכֶן
  choice: pinatatag
  rationale: Ang Hiphil ng כון ay nangangahulugang itatag o gawing matibay. Ang “pinatatag” ay likas sa Filipino at angkop sa pagpapatibay ng paghahari.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: הַמַּמְלָכָה
  choice: ang kaharian
  rationale: Maaaring tumukoy ang מַמְלָכָה sa kaharian o paghahari; pinananatili ng “kaharian” ang lawak ng kahulugan nito sa konteksto.
- source_word: בְּיָדוֹ
  choice: sa kamay niya
  rationale: Pinananatili ang konkretong idyomang Hebreo na nagpapahiwatig na ang kaharian ay nasa kapangyarihan o pamamahala ni Jehoshafat.
- source_word: וַיִּתְּנוּ כָל יְהוּדָה
  choice: ang buong Juda ay nagbigay
  rationale: Ang נתן ay “magbigay,” at ang “buong Juda” ay kolektibong tumutukoy sa mga mamamayan ng kaharian.
- source_word: מִנְחָה
  choice: tributo
  rationale: Bagaman maaari itong mangahulugang handog, regalo, o kaloob, mas angkop ang “tributo” sa konteksto ng pagbibigay sa isang hari at pagpapatatag ng kaniyang pamamahala.
- source_word: לִיהוֹשָׁפָט
  choice: kay Jehoshafat
  rationale: Ginamit ang karaniwang anyong Filipino ng pangalan, na malapit sa Hebreong יְהוֹשָׁפָט.
- source_word: וַיְהִי לוֹ
  choice: Nagkaroon siya
  rationale: Likas na salin sa Filipino ng idyomang Hebreo na literal na “nagkaroon para sa kaniya.”
- source_word: עֹשֶׁר
  choice: kayamanan
  rationale: Tumutukoy ang salita sa materyal na yaman; malinaw at dignified ang “kayamanan” sa modernong Filipino.
- source_word: וְכָבוֹד
  choice: at karangalan
  rationale: Sa kontekstong maharlika, ang כָבוֹד ay tumutukoy sa dangal, katayuan, at pagkilala, kaya ang “karangalan” ay mas angkop kaysa “kaluwalhatian.”
- source_word: לָרֹב
  choice: napakaraming
  rationale: Ipinahahayag ng parirala ang lubhang malaking dami; natural itong ikinakabit sa “kayamanan at karangalan” sa Filipino.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Direktang ginagamit ng teksto ang Tetragrammaton. Pinananatili ng “Yahweh” ang pangalang tipan sa halip na palitan ito ng titulong “Panginoon.”
- issue: Kahulugan ng מִנְחָה sa maharlikang konteksto
  choice: tributo
  alternative: kaloob, regalo, o handog
  rationale: Hindi likas na relihiyosong handog ang hinihingi ng konteksto. Ang pagbibigay ng buong Juda sa hari matapos patatagin ang kaniyang kaharian ay pumapabor sa kahulugang maharlikang tributo, habang itinatala sa talababa ang tunay na saklaw ng salita.
translation_notes:
  register: Modernong Filipino na malinaw ngunit marangal. Pinanatili ang Hebreong larawang “sa kamay niya” upang hindi mawala ang tekstuwal na idyoma. Ginamit ang “tributo” bilang salitang pamilyar sa ordinaryong mambabasa, at inilagay ang mga leksikal na alternatibo sa talababa.
