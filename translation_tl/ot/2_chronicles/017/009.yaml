  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַֽ/יְלַמְּדוּ֙ בִּֽ/יהוּדָ֔ה וְ/עִ֨מָּ/הֶ֔ם סֵ֖פֶר תּוֹרַ֣ת יְהוָ֑ה וַ/יָּסֹ֨בּוּ֙ בְּ/כָל עָרֵ֣י יְהוּדָ֔ה וַֽ/יְלַמְּד֖וּ בָּ/עָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/017/009.yaml
  text: They taught in Judah[a], and the Book of the Law of Yahweh was with them[c][b]; they went around through all the cities of Judah and taught among the people.
translation:
  language: tl
  text: Nagturo sila sa Juda, at kasama nila ang Aklat ng Kautusan ni Yahweh.[a] Nilibot nila ang lahat ng lungsod ng Juda at nagturo sa gitna ng mga mamamayan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “balumbon ng Tagubilin ni Yahweh.” Ang salitang Hebreo para sa “aklat” ay maaari ring tumukoy sa isang nakasulat na balumbon, at ang “Kautusan” ay maaari ring isaling “Tagubilin.”
    reason: lexical_alternative
  - marker: b
    text: O “nagturo sa mga mamamayan.” Mas literal sa Hebreo, “nagturo sa gitna ng mga mamamayan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְלַמְּדוּ
  choice: Nagturo sila
  rationale: Ang Piel ng למד ay nangangahulugang magturo o magbigay-aral. Ang “nagturo” ang tuwiran at likas na salin, at inuulit nito ang pandiwa sa hulihan ng talata.
- source_word: בִּיהוּדָה
  choice: sa Juda
  rationale: Ang pang-ukol na ב ay nagsasaad ng kinaroroonan. Ipinahihiwatig na ng kasunod na paglilibot sa mga lungsod ang saklaw sa buong Juda.
- source_word: וְעִמָּהֶם
  choice: at kasama nila
  rationale: Pinananatili nito ang diwang may dala o kapiling nila ang kasulatan, gayundin ang koordinasyong ipinahihiwatig ng וְ. Ang pandiwang “ay” ay likas na ipinapalagay sa sugnay na walang tahasang pandiwa sa Hebreo.
- source_word: סֵפֶר תּוֹרַת יְהוָה
  choice: ang Aklat ng Kautusan ni Yahweh
  rationale: Ang סֵפֶר ay isang nakasulat na dokumento, karaniwang balumbon sa panahong iyon, ngunit likas na maisasalin bilang “aklat.” Sa pariralang ito, ang תּוֹרָה ay tumutukoy sa kapahayagan o kautusang tipan ni Yahweh; pinananatili sa talababa ang mas malawak na diwang “tagubilin.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin ang Tetragrammaton bilang personal na pangalang “Yahweh” sa halip na palitan ito ng titulong “PANGINOON.”
- source_word: וַיָּסֹבּוּ
  choice: Nilibot nila
  rationale: Sa kontekstong ito, ang סבב ay tumutukoy sa pag-ikot o paglalakbay sa iba’t ibang lugar. Ang “nilibot nila” ay maikli at likas sa Filipino.
- source_word: בְּכָל עָרֵי יְהוּדָה
  choice: ang lahat ng lungsod ng Juda
  rationale: Kasama ng pandiwang “nilibot,” malinaw nitong ipinahahayag ang pagpunta nila sa lahat ng mga lungsod nang hindi kailangang ulitin ang isang pang-ukol.
- source_word: וַיְלַמְּדוּ בָּעָם
  choice: at nagturo sa gitna ng mga mamamayan
  rationale: Pinananatili ng “sa gitna ng” ang pang-ukol na ב at ang diwang isinagawa nila ang pagtuturo sa loob ng sambayanan, sa halip na tahasang gawing layon ng pandiwa ang mga tao.
theological_decisions:
- issue: Paglalapat ng pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Personal na pangalan ang tahasang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang pangalang iyon sa halip na palitan ng titulo, nang hindi nagdaragdag ng sektaryang pakahulugan.
- issue: Saklaw ng תּוֹרָה
  choice: Kautusan
  alternative: tagubilin
  rationale: Sa tambalang “Aklat ng Kautusan ni Yahweh,” ang “Kautusan” ang nakaugaliang malinaw na tawag sa korpus ng tipang aral, ngunit hindi itinatanggi ang mas malawak na leksikal na diwang “tagubilin,” na inilalahad sa talababa.
translation_notes:
  register: Makabago ngunit marangal na Filipino ang ginamit. Iniwasan ang labis na arkaikong bokabularyo. Ang “kasama nila” ay nagpapanatili sa ayos at bahagyang diin ng sugnay na Hebreo, samantalang ang “nilibot nila” ay natural na nagpapahayag ng naglalakbay na ministeryo ng pagtuturo.
