base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/017/014.yaml
  text: 'And these were their mustered divisions by their fathers’ houses: for Judah[a], the commanders of thousands: Adnah the commander, and with him three hundred thousand mighty men of valor.'
translation:
  language: tl
  text: 'Ito ang kanilang pagkakatala[a] ayon sa mga sambahayan ng kanilang mga ninuno: Para sa Juda, ang mga pinuno ng libu-libo—ang pinunong si Adna, at kasama niya ang 300,000 magigiting na mandirigma.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “kanilang bilang” o “kanilang pagpapatala.” Ang salitang Hebreo ay maaaring tumukoy sa senso, pagtitipon para sa paglilingkod, o sa naging kaayusan ng mga hukbo.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְקֻדָּתָם
  choice: kanilang pagkakatala
  rationale: Sa kontekstong militar, tumutukoy ito sa pagtala o pagtitipon para sa paglilingkod at maaari ring tumukoy sa bilang o kaayusang bunga nito. Pinananatili ng “pagkakatala” ang administratibo at militar na diwa nang hindi nililimitahan sa bilang lamang.
- source_word: לְבֵית אֲבוֹתֵיהֶם
  choice: ayon sa mga sambahayan ng kanilang mga ninuno
  rationale: Tumutukoy ito sa kaayusang pangangkan at administratibo batay sa mga sambahayan ng ninuno. Likas at malinaw ito sa modernong Filipino.
- source_word: לִיהוּדָה
  choice: Para sa Juda
  rationale: Nagsisilbi itong pambungad na pantukoy sa pangkat mula sa Juda sa loob ng talaan.
- source_word: שָׂרֵי אֲלָפִים
  choice: mga pinuno ng libu-libo
  rationale: Pinananatili nito ang pamagat-militar para sa mga opisyal na namamahala sa mga pangkat na inuugnay sa libu-libo, nang hindi nagpapasok ng masyadong tiyak na makabagong ranggo.
- source_word: עַדְנָה הַשָּׂר
  choice: ang pinunong si Adna
  rationale: Malinaw na ipinakikilala si Adna bilang opisyal at kaayon ng salin sa naunang שָׂרֵי.
- source_word: גִּבּוֹרֵי חַיִל
  choice: magigiting na mandirigma
  rationale: Natural na idyomang Filipino para sa mga bihasa, malalakas, at matatapang na lalaking mandirigma.
- source_word: שְׁלֹשׁ מֵאוֹת אָלֶף
  choice: 300,000
  rationale: Tuwirang paglalahad ng bilang sa paraang madaling basahin sa modernong Filipino.
