translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “lalaking” upang gawing tahasan na ang bilang ay tumutukoy sa mga kawal, na ipinahihiwatig ng panlalaking maramihang pandiwari sa Hebreo. Walang talababa dahil sapat na naihahatid sa pangunahing teksto ang saklaw ng נֹשְׁקֵי nang hindi inaalis ang diwang pagdadala o pagkakaroon ng mga sandata.
