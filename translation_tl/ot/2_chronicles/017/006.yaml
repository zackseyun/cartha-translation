base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/017/006.yaml
  text: His heart was exalted in the ways of Yahweh[b][a], and furthermore he removed the high places and the Asherim from Judah.
translation:
  language: tl
  text: Lumakas ang loob niya sa mga daan ni Yahweh[a]. Bukod dito, inalis niya mula sa Juda ang mga dambana sa matataas na lugar at ang mga Asherim[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “Tumaas ang kanyang puso sa mga daan ni Yahweh.” Maaari ring isalin, “Naging matatag ang kanyang loob” o “Tumapang siya.” Positibo ang diwa rito, hindi mapagmataas.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, Asherim. Mga kultikong bagay ang mga ito na kaugnay ng pagsamba kay Ashera; maaaring mga sagradong poste o punong-kahoy ang tinutukoy.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְבַּהּ לִבּוֹ
  choice: Lumakas ang loob niya
  rationale: Ang literal na larawan ay pagtaas ng puso, ngunit sa kontekstong positibo ay tumutukoy ito sa paglakas ng loob, tapang, o matatag na pagpapasiya. Likas sa makabagong Tagalog ang “lumakas ang loob” at hindi nito ipinahihiwatig ang mapagmataas na pagmamapuri.
- source_word: בְּדַרְכֵי יְהוָה
  choice: sa mga daan ni Yahweh
  rationale: Pinananatili ang metaporang “mga daan” para sa pamumuhay o paggawi ayon kay Yahweh, pati ang personal na pangalang nasa tekstong Hebreo.
- source_word: וְעוֹד
  choice: Bukod dito
  rationale: Ipinahahayag ang pagdaragdag ng isa pang gawa sa naunang paglalarawan.
- source_word: הֵסִיר
  choice: inalis niya
  rationale: Tuwirang katumbas ng Hiphil na anyo ng סור, na nangangahulugang alisin o ipaalis.
- source_word: הַבָּמוֹת
  choice: mga dambana sa matataas na lugar
  rationale: Ipinakikilala ang mga pook-sambahan na tinutukoy ng בָּמוֹת sa paraang malinaw sa karaniwang mambabasa, nang hindi ipinapalagay na mga altar lamang ang mga iyon.
- source_word: הָאֲשֵׁרִים
  choice: mga poste ni Ashera
  rationale: Ipinahihiwatig ang mga kultikong bagay na kaugnay ng pagsamba kay Ashera, habang ipinapaliwanag sa talababa na hindi tiyak ang eksaktong anyo ng mga ito.
- source_word: מִיהוּדָה
  choice: sa Juda
  rationale: Sa Tagalog, ang “inalis ... sa Juda” ay likas na nagpapahayag ng pag-aalis mula sa nasasakupan ng Juda.
theological_decisions:
- issue: Kung ang pagtaas ng puso ay pagmamataas o positibong katapangan at katatagan
  choice: Positibong paglakas ng loob sa mga daan ni Yahweh
  alternative: Naging mapagmataas ang kanyang puso sa mga daan ni Yahweh
  rationale: Bagaman maaaring maging negatibo ang idyoma sa ibang konteksto, nililimitahan ito rito ng pariralang “sa mga daan ni Yahweh,” at sinusundan pa ng kapuri-puring pag-aalis ng mga bawal na pook at kagamitang panrelihiyon. Gayunman, itinatala sa talababa ang literal na larawan at saklaw ng kahulugan.
- issue: Kung gaano katiyak ang pagsasalin sa אֲשֵׁרִים
  choice: mga poste ni Ashera
  alternative: mga Asherim; mga sagradong poste o punong-kahoy
  rationale: Malinaw ang kaugnayan ng salita sa kulto ni Ashera, ngunit hindi lubos na tiyak ang pisikal na anyo ng tinutukoy. Kaya gumagamit ang pangunahing teksto ng madaling maunawaang katawagan at pinananatili sa talababa ang leksikal na pag-aalinlangan.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang likas na idyomang “lumakas ang loob” upang maipahayag ang positibong diwa ng Hebreo, samantalang pinanatili sa talababa ang literal na metapora. Iniwasan ang mas luma at di-gaanong malinaw na “matataas na dako.”
