  text: And under his command was Jehohanan the commander[a], and with him were two hundred and eighty thousand.
translation:
  language: tl
  text: At sa ilalim ng kaniyang pamumuno ay si Jehohanan, ang kumander[a], at may kasama siyang 280,000.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa kaniyang tabi/sa ilalim ng kaniyang awtoridad ay si Jehohanan, ang kumander.” Literal sa Hebreo, “sa ibabaw ng kaniyang kamay.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל יָדוֹ
  choice: At sa ilalim ng kaniyang pamumuno
  rationale: Sa talaang militar na ito, ang idyomang Hebreo na literal na 'sa ibabaw ng kaniyang kamay' ay nagpapahiwatig ng pagpapasakop sa pamamahala o awtoridad ng naunang pinuno, hindi lamang ng pisikal na pagiging katabi.
- source_word: יְהוֹחָנָן
  choice: Jehohanan
  rationale: Isinalin sa baybay na malapit sa anyong Hebreo at kaayon ng pagkakakilanlan ng pangalan sa Mga Cronica.
- source_word: הַשַּׂר
  choice: na pinuno
  rationale: Malawak ang saklaw ng שַׂר—pinuno, opisyal, o kumander. Ang 'pinuno' ay likas at marangal sa Filipino, habang hindi labis na tinutukoy ang ranggong militar.
- source_word: וְעִמּוֹ
  choice: at kasama niya
  rationale: Ipinakikilala ng parirala ang bilang ng mga tauhang nakatalaga kay Jehohanan; malinaw ito sa Filipino nang hindi na nagdaragdag ng pandiwa.
- source_word: מָאתַיִם וּשְׁמוֹנִים אָלֶף
  choice: 280,000
  rationale: Tuwirang pinananatili ang eksaktong bilang sa paraang madaling basahin sa isang talaang militar.
