  source_fidelity: Tumpak ang salin sa Hebreo. Ang “Marami siyang gawain” ay maingat na katumbas ng וּמְלָאכָה רַבָּה הָיָה לוֹ at pinananatili ang hindi pagtitiyak ng מְלָאכָה. Naipapahayag din ng “mga kawal—mga magigiting na mandirigma” ang magkatabing אַנְשֵׁי מִלְחָמָה at גִּבּוֹרֵי חַיִל bilang pagpapaliwanag sa iisang pangkat. Ang lokasyong Jerusalem ay wastong ikinabit sa pangkat-militar.
  naturalness: Natural, malinaw, at may angkop na marangal na rehistro ang modernong Filipino. Ang ayos na “sa Jerusalem ay mayroon siyang” ay madaling basahin at hindi nagpapasok ng bagong kahulugan. Ang em dash ay angkop na nagpapakita ng apposition.
  terminology: Ang “gawain,” “mga kawal,” at “mga magigiting na mandirigma” ay pare-parehong angkop at hindi labis na nagpapakahulugan. Wala ring problemang pangngalan, teolohikal na termino, o footnote anchor.
