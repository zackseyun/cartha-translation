  text: And he had much work in the cities of Judah, and men of war, mighty men of valor, in Jerusalem.
translation:
  language: tl
  text: Marami siyang gawain sa mga lungsod ng Juda, at sa Jerusalem ay mayroon siyang mga kawal—mga magigiting na mandirigma.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מְלָאכָה רַבָּה
  choice: maraming gawain
  rationale: Ang מְלָאכָה ay pangunahing tumutukoy sa gawain, trabaho, o gawa. Pinananatili ng saling ito ang malawak na kahulugan ng Hebreo at ang pagkakasunod na ‘maraming gawain,’ sa halip na gawing tiyak na ‘ari-arian’ o ‘mga imbakan.’
- source_word: אַנְשֵׁי מִלְחָמָה
  choice: mga kawal
  rationale: Natural at malinaw na Filipino para sa literal na ‘mga lalaki ng digmaan,’ na tumutukoy sa mga taong nakatalaga o handa sa pakikipagdigma.
- source_word: גִּבּוֹרֵי חַיִל
  choice: mga magigiting na mandirigma
  rationale: Ipinahahayag ang lakas, tapang, at kakayahang militar na saklaw ng parirala, nang hindi nagdaragdag ng ranggo o natatanging pangkat na wala sa teksto.
theological_decisions:
- issue: Kahulugan ng מְלָאכָה sa mga lungsod ng Juda
  choice: gawain
  alternative: ari-arian / mga imbakan / mga proyekto
  rationale: Malawak at bahagyang di-tiyak ang terminong Hebreo. Ang ‘gawain’ ang pinakamalapit na pormal na katumbas at hindi tahimik na nagpapasya kung ito ay gawaing pang-imprastraktura, pangangasiwa, o ibang aktibidad.
translation_notes:
  register: Makabagong, dignidad, at madaling maunawaang Filipino. Ginamit ang em dash upang ipakitang ang ‘mga magigiting na mandirigma’ ay naglalarawan sa ‘mga kawal,’ habang pinananatili ang dalawang magkatabing katawagang militar sa Hebreo.
