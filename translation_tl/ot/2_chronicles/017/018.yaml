  text: And at his side was Jehozabad[b][a], and with him were 180,000 armed for war.
translation:
  language: tl
  text: At sa tabi niya[a] ay si Jehozabad, at kasama niya ang 180,000 kawal na armado para sa digmaan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal sa Hebreo, “sa kaniyang kamay”; maaari ring mangahulugang nasa ilalim ng kaniyang pamamahala o nakapuwesto sa tabi niya.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “180,000 kawal na handa para sa labanan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל יָדוֹ
  choice: At sa tabi niya
  rationale: Ang idyomang Hebreo ay literal na “sa kaniyang kamay” at maaaring tumukoy sa pagiging nasa tabi, kaugnay, o nasa ilalim ng pamamahala ng isang tao. Pinananatili ng “sa tabi niya” ang pangunahing larawang ito nang hindi tiyak na ipinapalagay ang ranggo o pamumuno.
- source_word: יְהוֹזָבָד
  choice: Jehozabad
  rationale: Isinalin sa karaniwang transliterasyong angkop sa modernong Filipino ang personal na pangalan.
- source_word: וְעִמּוֹ
  choice: at kasama nito
  rationale: Ipinahahayag ng עִם ang pagsama o pagkakaugnay. Ginamit ang “nito” upang maging malinaw sa Filipino na si Jehozabad ang tinutukoy ng panghalip.
- source_word: מֵאָה וּשְׁמוֹנִים אֶלֶף
  choice: 180,000
  rationale: Tuwiran ang bilang sa Hebreo; ang paggamit ng mga numero ay malinaw at natural sa talaang militar.
- source_word: חֲלוּצֵי צָבָא
  choice: mga lalaking nasasandatahan para sa digmaan
  rationale: Ang חֲלוּצֵי ay tumutukoy sa mga lalaking nasangkapan o nasasandatahan para sa paglilingkod militar, at ang צָבָא ay tumutukoy sa hukbo o digmaan. Inilalahad ng salin ang dalawang sangkap nang malinaw at natural.
