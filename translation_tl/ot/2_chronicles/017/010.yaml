  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יְהִ֣י פַּ֣חַד יְהוָ֗ה עַ֚ל כָּל מַמְלְכ֣וֹת הָֽ/אֲרָצ֔וֹת אֲשֶׁ֖ר סְבִיב֣וֹת יְהוּדָ֑ה וְ/לֹ֥א נִלְחֲמ֖וּ עִם יְהוֹשָׁפָֽט׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/017/010.yaml
  text: And the fear of Yahweh came upon all the kingdoms of the lands that were around Judah[a], and they did not make war against Jehoshaphat.
translation:
  language: tl
  text: At ang takot kay Yahweh ay sumapit sa lahat ng kaharian sa mga lupaing nakapaligid sa Juda[a], kaya hindi sila nakipagdigma kay Jehoshafat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sindak na mula kay Yahweh” o “pangamba kay Yahweh.” Maaaring tumukoy ang pariralang Hebreo sa takot na kaugnay kay Yahweh; dito, malamang na isang sindak na ipinadala niya sa mga kaharian sa paligid.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: ay sumapit
  rationale: Ipinahahayag ng parirala ang pagdating o pagsapit ng isang kalagayan; natural sa Tagalog ang “sumapit” para sa takot na dumating sa isang pangkat.
- source_word: פַּחַד יְהוָה
  choice: ang takot kay Yahweh
  rationale: Ang פַּחַד ay takot, pangamba, o sindak. Pinananatili ng “takot kay Yahweh” ang genitibong kalabuan ng Hebreo, samantalang nililinaw ng talababa na maaari itong tumukoy sa sindak na mula kay Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasatitik ang banal na personal na pangalan sa halip na palitan ito ng isang titulo.
- source_word: עַל
  choice: sa
  rationale: Sa pariralang ito, tinutukoy ng עַל ang mga taong o pangkat na dinapuan ng takot; “sa” ang natural na katumbas kasunod ng “sumapit.”
- source_word: כָּל מַמְלְכוֹת הָאֲרָצוֹת
  choice: lahat ng kaharian sa mga lupain
  rationale: Pinananatili ang dalawang pangngalang “mga kaharian” at “mga lupain” nang hindi nagiging labis na literal sa Tagalog.
- source_word: אֲשֶׁר סְבִיבוֹת יְהוּדָה
  choice: na nakapaligid sa Juda
  rationale: Natural at malinaw na paglalarawan sa mga kalapit na lupain sa paligid ng Juda.
- source_word: וְלֹא נִלְחֲמוּ עִם
  choice: kaya hindi sila nakipagdigma kay
  rationale: Ang נלחם עם ay tumutukoy sa pakikipaglaban o pakikipagdigma. Ang “kaya” ay ipinahihiwatig ang bunga sa konteksto, bagaman literal na pang-ugnay ang וְ.
- source_word: יְהוֹשָׁפָט
  choice: Jehoshafat
  rationale: Karaniwang anyong Tagalog ng pangalang Hebreo na יְהוֹשָׁפָט.
theological_decisions:
- issue: Kahulugan ng פַּחַד יְהוָה sa kontekstong militar
  choice: Pinanatili sa pangunahing teksto ang “takot kay Yahweh,” na maaaring magpahiwatig ng takot na kaugnay kay Yahweh, habang ipinaliliwanag sa talababa ang malamang na diwang sindak na ipinadala niya.
  alternative: “sindak na mula kay Yahweh” o “sindak kay Yahweh”
  rationale: Sa salaysay, pinipigilan ng takot ang mga kaharian na makipagdigma, kaya malamang na hindi debosyonal na pagpipitagan ang tinutukoy. Gayunman, hindi dapat tuluyang alisin ang tunay na genitibong kalabuan ng Hebreo.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “sumapit” at “nakipagdigma” upang mapanatili ang salaysay na tono nang hindi tunog lipas; pinanatili ang pangalang Yahweh at ang marker na [a] sa pangunahing teksto.
