base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/017/016.yaml
  text: And under his command was Amasiah son of Zichri[a], who volunteered himself to Yahweh, and with him were two hundred thousand mighty men of valor.
translation:
  language: tl
  text: Nasa ilalim ng kanyang pamamahala si Amasias na anak ni Zicri, na kusang nagtalaga ng kanyang sarili kay Yahweh,[a] at kasama niya ang dalawang daang libong magigiting na mandirigma.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “kusang nag-alay ng kanyang sarili para kay Yahweh.” Maaaring idiin ng Hebreo ang kusang pagtatalaga ng sarili, at ang pang-ukol ay maaaring unawaing “kay” o “para kay.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל יָדוֹ
  choice: At nasa ilalim ng kanyang pamamahala
  rationale: Ang idyomang עַל יָד sa talaang militar ay nagpapahiwatig ng pagiging nasa ilalim ng awtoridad ng naunang pinuno; malinaw at natural sa Filipino ang “nasa ilalim ng kanyang pamamahala.”
- source_word: עֲמַסְיָה
  choice: Amasias
  rationale: Ginamit ang nakaugaliang anyong Filipino ng pangalang ito.
- source_word: בֶן זִכְרִי
  choice: anak ni Zicri
  rationale: Tuwirang ipinahahayag ang ugnayang nasa konstruksiyong Hebreo na בן.
- source_word: הַמִּתְנַדֵּב
  choice: na kusang nagtalaga ng kanyang sarili
  rationale: Ipinahahayag ng hitpael participle ng נדב ang kusang-loob at pansariling pag-aalay o pagtatalaga; pinananatili ng parirala ang reflexive na diwa.
- source_word: לַיהוָה
  choice: kay Yahweh
  rationale: Ang ל ay maaaring magpahiwatig ng patutunguhan o layunin ng pagtatalaga. Ang “kay Yahweh” ay natural sa Filipino at hindi ganap na inaalis ang saklaw na “para kay Yahweh.”
- source_word: וְעִמּוֹ
  choice: at kasama niya
  rationale: Ipinakikilala nito ang mga kawal na nakatalaga kay Amasias.
- source_word: מָאתַיִם אֶלֶף
  choice: dalawang daang libo
  rationale: Tuwirang salin ng bilang.
- source_word: גִּבּוֹר חָיִל
  choice: magigiting na mandirigma
  rationale: Sa kontekstong militar, tumutukoy ang parirala sa malalakas, may kakayahan, at matatapang na kawal; natural at marangal sa modernong Filipino ang “magigiting na mandirigma.”
theological_decisions:
- issue: Paglilipat ng banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tahasang ginagamit ng tekstong Hebreo ang Tetragrammaton; pinananatili ng “Yahweh” ang natatanging pangalan sa halip na palitan ito ng titulo.
- issue: Diwa ng kusang pagtatalaga ni Amasias
  choice: kusang nagtalaga ng kanyang sarili kay Yahweh
  alternative: kusang nag-alay ng kanyang sarili para kay Yahweh
  rationale: Pinananatili ng pangunahing salin ang reflexive at kusang-loob na diwa ng pandiwa habang hindi pinipilit na maging handog na ritwal ang kilos. Inilalahad sa talababa ang lehitimong alternatibo ng preposisyon at pandiwa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang anyo ng talaang militar, ngunit iniwasan ang literal na idyomang magiging malabo sa karaniwang mambabasa.
