  text: These were the ones serving the king[a], besides those whom the king had stationed in the fortified cities throughout all Judah.
translation:
  language: tl
  text: Ang mga ito ang naglilingkod sa hari, bukod pa sa mga itinalaga ng hari sa mga pinatibay na lungsod sa buong Juda.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵלֶּה הַמְשָׁרְתִים אֶת־הַמֶּלֶךְ
  choice: Ang mga ito ang naglilingkod sa hari
  rationale: Pinananatili ng “naglilingkod” ang participyal na diwa ng שׁרת at malinaw na tumutukoy sa opisyal na paglilingkod sa hari, nang hindi gumagamit ng salitang may makitid na konotasyong panrelihiyon.
- source_word: מִלְּבַד
  choice: bukod pa sa
  rationale: Likas itong nagpapahayag na may isa pang pangkat bukod sa mga tauhang katatapos lamang ilista.
- source_word: אֲשֶׁר נָתַן הַמֶּלֶךְ
  choice: mga itinalaga ng hari
  rationale: Bagaman literal na “ibinigay/inilagay,” ipinahihiwatig ng kontekstong militar at administratibo ang pagtatalaga ng mga tauhan sa kani-kanilang himpilan.
- source_word: בְּעָרֵי הַמִּבְצָר
  choice: sa mga napapaderang lungsod
  rationale: Ang מִבְצָר ay tumutukoy sa mga lungsod na pinatibay para sa depensa. Ang “napapaderang lungsod” ay malinaw at karaniwang salin sa modernong Filipino.
- source_word: בְּכָל יְהוּדָה
  choice: sa buong Juda
  rationale: Ipinahahayag nito ang saklaw sa kabuuan ng teritoryo ng Juda sa natural at maikling paraan.
