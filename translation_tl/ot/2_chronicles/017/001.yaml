  source_fidelity: Tumpak na naihahatid ng draft ang paghalili ni Jehosafat sa paghahari at ang pandiwang reflexive na nangangahulugang pagpapalakas ng sarili. Ang “laban sa Israel” ay sumusunod sa English POB audit trail at sa kontekstuwal na pagbasa ng עַל dito; hindi ito isinasalin bilang pamamahala ni Jehosafat sa hilagang Israel.
