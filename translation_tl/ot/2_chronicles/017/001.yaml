  text: At naghari kapalit niya ang anak niyang si Jehosafat, at nagpakalakas siya laban sa Israel.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּמְלֹךְ
  choice: ang naghari
  rationale: Tuwirang ipinapahayag ang pag-upo bilang hari habang umaangkop sa likas na ayos ng pangungusap sa Tagalog.
- source_word: תַּחְתָּיו
  choice: bilang kahalili niya
  rationale: Natural na Tagalog para sa literal na ‘sa lugar niya,’ na tumutukoy sa paghalili sa trono.
- source_word: וַיִּתְחַזֵּק
  choice: pinalakas nito ang sarili
  rationale: 'Pinananatili ang reflexive na diwa ng pandiwa: si Jehosafat mismo ang nagpatatag o nagpalakas ng kanyang kalagayan.'
- source_word: עַל יִשְׂרָאֵל
  choice: laban sa Israel
  rationale: Sa konteksto, ang עַל ay nagpapahiwatig ng paninindigan o paghahandang nakatuon laban sa hilagang kaharian ng Israel, hindi pamamahala rito.
theological_decisions:
- issue: Ugnayan ni Jehosafat sa Israel
  choice: laban sa Israel
  alternative: sa ibabaw ng Israel / laban o kaugnay sa Israel
  rationale: Ang salin ay sumusunod sa kontekstuwal na diwang pampolitika at pandepensa nang hindi ipinahihiwatig na naghari si Jehosafat sa Israel.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “nito” upang malinaw na si Jehosafat, hindi ang kanyang ama, ang tinutukoy sa ikalawang sugnay.
