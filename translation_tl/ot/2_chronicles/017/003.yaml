base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/017/003.yaml
  text: And Yahweh was with Jehoshaphat[a], because he walked in the former ways of David his father and did not seek the Baals.
translation:
  language: tl
  text: At kasama ni Jehosafat si Yahweh, sapagkat namuhay siya ayon sa mga dating gawi[a] ng kanyang amang si David at hindi niya hinanap ang mga Baal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “mga unang gawi ng kanyang amang si David.” Tinutukoy ng Hebreo ang naunang asal ni David, malamang upang ibukod ito sa kanyang mga pagkukulang kalaunan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinanatili ang personal na pangalan ng Diyos bilang transliterasyon ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: וַיְהִי ... עִם
  choice: ay sumasa kay
  rationale: Ang “sumasa kay” ay likas at marangal na salin ng idyomang nagsasaad ng presensiya at pagtulong ni Yahweh.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinahahayag nito ang sanhi o batayan ng naunang pahayag nang hindi binabago ang ugnayan ng mga sugnay.
- source_word: הָלַךְ בְּדַרְכֵי
  choice: namuhay ... ayon sa mga ... lakad
  rationale: Ipinahahayag ng “namuhay” ang etikal na diwa ng הָלַךְ, habang pinananatili ng “mga lakad” ang metapora ng דֶּרֶךְ sa natural na Filipino.
- source_word: דָּוִיד אָבִיו
  choice: kanyang amang si David
  rationale: Pinanatili ang “ama” bilang dinastiko at tipanang pananalita ng Hebreo, sa halip na tahasang gawing “ninuno.”
- source_word: הָרִאשֹׁנִים
  choice: mga unang
  rationale: Pinananatili nito ang pagtukoy sa naunang yugto ng asal ni David at ang posibleng kaibahan nito sa kanyang mga pagkukulang kalaunan.
- source_word: דָרַשׁ
  choice: hinanap
  rationale: Saklaw ng pandiwa ang relihiyosong paghahanap, pagsangguni, o paglapit sa isang diyos; hindi ito labis na nililimitahan sa “sumamba.”
- source_word: לַבְּעָלִים
  choice: ang mga Baal
  rationale: Pinanatili ang tahasang anyong maramihan, na maaaring tumukoy sa sari-saring lokal na anyo o kulto ni Baal.
theological_decisions:
- issue: Ang pagiging huwaran ni David sa kabila ng kanyang mga pagkukulang kalaunan
  choice: mga unang lakad ng kanyang amang si David
  alternative: mga dating lakad ng kanyang amang si David
  rationale: Tahasan sa Hebreo ang panandang tumutukoy sa unang bahagi ng asal ni David. Pinananatili ng salin ang limitasyong ito nang hindi ipinapaliwanag sa pangunahing teksto kung aling mga kabiguan ang tinutukoy.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “sumasa kay” dahil pamilyar ito sa biblikal na rehistro ngunit malinaw pa rin; ang “namuhay ayon sa mga ... lakad” ay nagbabalanse sa likas na Filipino at sa metapora ng Hebreo.
