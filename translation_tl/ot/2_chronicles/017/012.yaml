  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Jehoshafat” at “Juda” bilang pamilyar na anyong biblikal. Hiniwalay sa dalawang pangungusap upang maging natural at madaling basahin, habang pinananatili ang ugnayang pasalaysay ng Hebreo.
