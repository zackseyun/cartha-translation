base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/017/012.yaml
  text: And Jehoshaphat became greater and greater[b][a], and he built fortresses and store cities in Judah.
translation:
  language: tl
  text: Si Jehoshafat ay patuloy na naging lalo pang makapangyarihan. Nagtayo siya sa Juda ng mga tanggulan[a] at mga lunsod-imbakan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga kuta.” Ang salitang Hebreo ay tumutukoy sa mga pinatibay na tanggulan.
    reason: lexical_alternative
  - marker: b
    text: O “mga lunsod para sa imbakan” o “mga lunsod ng panustos.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי הֹלֵךְ וְגָדֵל עַד לְמָעְלָה
  choice: Patuloy na lumakas at naging higit na makapangyarihan
  rationale: Ang pinagsamang anyong הֹלֵךְ וְגָדֵל ay nagsasaad ng tuloy-tuloy na paglago, at pinatitingkad ito ng עַד לְמָעְלָה. Inihahatid ng salin ang progresibo at matinding pag-angat ni Jehoshafat nang hindi ginagaya nang mekanikal ang idyomang Hebreo.
- source_word: וַיִּבֶן
  choice: Nagtayo siya
  rationale: Karaniwan at tuwirang salin ng pandiwang בנה sa kontekstong pasalaysay.
- source_word: בִּיהוּדָה
  choice: sa Juda
  rationale: Tuwirang ipinapahayag ang lugar kung saan naganap ang pagtatayo.
- source_word: בִּירָנִיּוֹת
  choice: mga tanggulan
  rationale: Tumutukoy ito sa matitibay at pinatibay na kuta. Ang “tanggulan” ay natural sa modernong Filipino at umiiwas sa maling larawang maaaring idulot ng “kastilyo.”
- source_word: עָרֵי מִסְכְּנוֹת
  choice: mga lunsod-imbakan
  rationale: Tumutukoy ang parirala sa mga lunsod na ginagamit sa pag-iimbak ng mga panustos o kagamitan. Malinaw na naipapakita ng tambalang “lunsod-imbakan” ang tungkuling ito.
