base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/025.yaml
  text: Solomon had four thousand stalls for horses and chariots[a], and twelve thousand horsemen[b]; he stationed them in the chariot cities and with the king in Jerusalem.
translation:
  language: tl
  text: May apat na libong kulungan[a][b] si Solomon para sa mga kabayo at mga karwahe, at labindalawang libong mangangabayo. Inilagay niya ang mga ito sa mga lunsod ng mga karwahe at sa piling ng hari sa Jerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga kuwadra.” Ang salitang Hebreo ay tumutukoy sa mga puwesto o yunit na tirahan ng mga kabayo.
    reason: lexical_alternative
  - marker: b
    text: Sa kaparehong ulat sa 1 Hari 4:26, “apatnapung libong kulungan” ang mababasa; “apat na libo” naman ang nasa Mga Cronica rito.
    reason: cross_reference
lexical_decisions:
- source_word: וַיְהִי לִשְׁלֹמֹה
  choice: May ... si Solomon
  rationale: Ang idyomang היה + ל ay nagpapahayag ng pag-aari o pagkakaroon; natural itong isinasalin sa modernong Tagalog bilang “May ... si Solomon.”
- source_word: אַרְבַּעַת אֲלָפִים
  choice: apat na libo
  rationale: Tuwirang salin ng bilang sa tekstong Hebreo ng Mga Cronica.
- source_word: אֻרְיוֹת
  choice: mga kulungan
  rationale: Tumutukoy ang salita sa mga puwesto o yunit na tirahan ng kabayo. Ang “mga kulungan” ay madaling maunawaan at hindi ipinapalagay na buong gusali ang bawat isa.
- source_word: סוּסִים וּמַרְכָּבוֹת
  choice: para sa mga kabayo at mga karwahe
  rationale: Pinananatili ang dalawang pangngalan ng Hebreo at ipinahahayag ang gamit ng mga kulungan nang natural sa Tagalog.
- source_word: וּשְׁנֵים עָשָׂר אֶלֶף פָּרָשִׁים
  choice: at labindalawang libong mangangabayo
  rationale: Ang פָּרָשִׁים ay mga sumasakay sa kabayo; mas tuwiran at hindi anakronistiko ang “mangangabayo” kaysa terminong teknikal na pangmakabagong hukbo.
- source_word: וַיַּנִּיחֵם
  choice: Inilagay niya ang mga ito
  rationale: Sa kontekstong militar at administratibo, nangangahulugan itong inilagay o itinalaga sa mga tiyak na lugar. Pinananatili ng “inilagay” ang lawak ng kahulugan nang hindi labis na nagpapakahulugan.
- source_word: בְּעָרֵי הָרֶכֶב
  choice: sa mga lunsod para sa mga karwahe
  rationale: Tumutukoy ito sa mga lunsod na nakatalaga o nauugnay sa hukbong gumagamit ng mga karwahe; malinaw at natural ang ganitong anyo sa Tagalog.
- source_word: וְעִם הַמֶּלֶךְ
  choice: at sa piling ng hari
  rationale: Natural na ipinahahayag ang Hebreong “kasama ng hari” habang hindi idinaragdag kung ilan ang nanatili roon.
- source_word: בִּירוּשָׁלִָם
  choice: sa Jerusalem
  rationale: Karaniwang anyo ng pangalan ng lugar sa Tagalog.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Pinili ang “mangangabayo” at “mga karwahe” bilang mga salitang karaniwan at angkop sa sinaunang konteksto. Inilipat ang panandang [b] sa “mga kulungan,” sapagkat doon nauukol ang pagkakaiba ng bilang sa kaparehong ulat.
