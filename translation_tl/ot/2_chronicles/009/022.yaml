  text: King Solomon surpassed all the kings of the earth in wealth and wisdom.
translation:
  language: tl
  text: Nahigitan ni Haring Solomon ang lahat ng hari sa buong mundo sa kayamanan at karunungan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּגְדַּל
  choice: Nahigitan
  rationale: Sa paghahambing na may מִן, ipinahihiwatig ng גדל na naging higit o nakahihigit si Solomon sa iba; natural itong ipinapahayag sa Filipino ng “nahigitan.”
- source_word: הַמֶּלֶךְ שְׁלֹמֹה
  choice: ni Haring Solomon
  rationale: Likas sa modernong Filipino ang ayos na “Haring Solomon,” at napapanatili nito kapwa ang titulo at pangalan.
- source_word: מִכֹּל מַלְכֵי הָאָרֶץ
  choice: ang lahat ng hari sa buong mundo
  rationale: Maaaring mangahulugan ang אֶרֶץ ng “lupain” o “mundo.” Ang malawak na pandaigdigang paghahambing sa mga hari ang pinakanatural na kahulugan dito.
- source_word: לְעֹשֶׁר
  choice: sa kayamanan
  rationale: Tinutukoy ng לְ ang larangan ng paghahambing. Ang “sa kayamanan” ay malinaw at natural sa Filipino.
- source_word: וְחָכְמָה
  choice: at karunungan
  rationale: Ang חָכְמָה ay “karunungan.” Saklaw ng naunang “sa” ang magkatambal na “kayamanan at karunungan,” gaya ng konstruksiyon sa Hebreo.
