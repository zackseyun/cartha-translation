  source_fidelity: 'Tapat ang salin sa dalawang pahayag ng Hebreo: ang hari ang sanhi ng pagiging karaniwan ng pilak na gaya ng mga bato sa Jerusalem, at ng napakaraming sedro na gaya ng mga sikomoro sa Shefela. Naipapahayag ng “maging pangkaraniwan” at “kasindami” ang idyomatikong diwa ng וַיִּתֵּן / נָתַן at ang diin ng לָרֹב nang hindi lumalampas sa teksto.'
  naturalness: Likas at malinaw ang makabagong Filipino. Ang ayos na “Ginawa ng hari na maging…” at “ginawa niyang kasindami…” ay marangal ngunit hindi lipas. Ang “mababang lupain” ay isang katanggap-tanggap na pangkalahatang katumbas ng Shephelah, at nililinaw ito ng talababa.
  terminology: Ang “pilak,” “mga bato,” “mga sedro,” at “mga punong sikomoro” ay angkop at pare-pareho sa kahulugan ng pinagmulan. Wasto ang talababa at ang kapit nitong [a] sa “mababang lupain”; hindi nito binabago ang salin kundi nagbibigay ng kinakailangang heograpikong paglilinaw.
