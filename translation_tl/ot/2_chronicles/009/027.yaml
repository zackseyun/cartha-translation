base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/027.yaml
  text: The king made silver as common as stones in Jerusalem[a], and he made cedars as plentiful as sycamore trees in the lowland.
translation:
  language: tl
  text: Ginawa ng hari na maging pangkaraniwan sa Jerusalem ang pilak gaya ng mga bato, at ginawa niyang kasindami ng mga punong sikomoro sa mababang lupain[a] ang mga sedro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “sa Shefela,” ang rehiyon ng mga paanan ng burol sa Juda, sa kanluran ng gitnang bulubundukin.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּתֵּן / נָתַן
  choice: ginawa ... na maging / ginawa niyang
  rationale: Bagaman literal na “nagbigay” o “naglagay,” ipinahihiwatig ng idyoma na pinangyari ng hari na maging napakarami at pangkaraniwan ang pilak at mga sedro.
- source_word: הַכֶּסֶף
  choice: ang pilak
  rationale: Tumutukoy ito sa pilak bilang mahalagang metal, hindi partikular sa salaping barya.
- source_word: כָּאֲבָנִים
  choice: gaya ng mga bato
  rationale: Pinananatili ang tahasang paghahambing sa mga bato; ang “maging pangkaraniwan” ay nagpapahayag ng ipinahihiwatig na kasaganaan.
- source_word: בִּירוּשָׁלִַם
  choice: sa Jerusalem
  rationale: Tuwirang panlunan na salin.
- source_word: הָאֲרָזִים
  choice: mga sedro
  rationale: Maikli at likas na katumbas na maaaring tumukoy sa mga punong sedro o sa kahoy na sedro bilang kalakal.
- source_word: כַּשִּׁקְמִים
  choice: kasindami ng mga punong sikomoro
  rationale: Ipinahahayag ng “kasindami” ang dami na sentro ng paghahambing, habang nililinaw ng “mga punong sikomoro” ang tinutukoy.
- source_word: אֲשֶׁר בַּשְּׁפֵלָה
  choice: sa mababang lupain
  rationale: Nauunawaan ito bilang mababang lupa o paanan ng mga burol sa rehiyong Shefela ng Juda; inilalagay sa talababa ang pangalang panrehiyon.
- source_word: לָרֹב
  choice: kasindami
  rationale: Isinama sa paghahambing ang diwa ng labis na dami upang maging natural sa Tagalog.
theological_decisions: []
translation_notes:
  register: Makabago at marangal na Filipino; pinanatili ang dalawang paghahambing ngunit ginawang malinaw ang ipinahihiwatig na pagiging pangkaraniwan at sagana. Ikinabit ang talababa sa “mababang lupain,” ang mismong katumbas ng Shefela.
