  source_fidelity: 'Tumpak ang salin sa Hebreo: naipapahayag ang paliwanag na כִּי, ang mga barkong naglalayag patungong Tarsis kasama ng mga tauhan ni Huram, ang nakaugaliang pagdating minsan sa bawat tatlong taon, at ang talaan ng kargamento. Ang "mga barko ng Tarsis" ay wastong nagpapanatili sa nominal na parirala at sa kalabuan nito.'
  naturalness: Natural, malinaw, at angkop ang rehistro sa makabagong Filipino Tagalog. Maayos ang "mga tauhan ni Huram," "minsan sa bawat tatlong taon," at "na may dalang." Ang aspektong "naglalayag" at "dumarating" ay katanggap-tanggap na paglalarawan ng nakaugaliang gawain sa salaysay.
