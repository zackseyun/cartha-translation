base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/021.yaml
  text: For the king had ships going to Tarshish with Huram’s servants; once every three years the ships of Tarshish would come[a], carrying gold and silver, ivory, monkeys, and peacocks.
translation:
  language: tl
  text: Sapagkat ang hari ay may mga barkong naglalayag patungong Tarsis kasama ng mga tauhan ni Huram. Minsan sa bawat tatlong taon, dumarating ang mga barko ng Tarsis na may dalang ginto, pilak, garing, mga unggoy, at mga pabo real.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga loro.” Hindi tiyak ang tinutukoy ng huling pangalan ng hayop sa Hebreo.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Nagpapakilala ng paliwanag sa naunang konteksto tungkol sa kayamanan ng hari.
- source_word: אֳנִיּוֹת לַמֶּלֶךְ
  choice: ang hari ay may mga barko
  rationale: Likas na Filipino para sa Hebreong pariralang literal na 'mga barko para/sa hari,' na nagpapahayag dito ng pag-aari.
- source_word: הֹלְכוֹת תַּרְשִׁישׁ
  choice: naglalayag patungong Tarsis
  rationale: Pinananatili ang pandiwang anyo at ang malamang na diwang patutunguhan o ruta.
- source_word: עִם עַבְדֵי חוּרָם
  choice: kasama ng mga tauhan ni Huram
  rationale: Sa konteksto, tumutukoy ang עֲבָדִים sa mga taong naglilingkod sa hari; mas natural at hindi labis na nagpapahiwatig ng pagkaalipin ang 'mga tauhan.'
- source_word: אַחַת לְשָׁלֹשׁ שָׁנִים
  choice: Minsan sa bawat tatlong taon
  rationale: Malinaw na salin ng distributibong pahayag tungkol sa panahon.
- source_word: תָּבֹאנָה
  choice: dumarating
  rationale: Ang imperpektong anyo ay naglalarawan ng paulit-ulit o nakaugaliang pangyayari; natural itong maipapahayag sa aspektong di-naganap ng Filipino.
- source_word: אֳנִיּוֹת תַּרְשִׁישׁ
  choice: mga barko ng Tarsis
  rationale: Pinananatili ang nominal na parirala at ang tunay na kalabuan kung ito ay tumutukoy sa ugnayan sa Tarsis o sa isang uri ng malayuang sasakyang-dagat.
- source_word: נֹשְׂאוֹת
  choice: na may dalang
  rationale: Natural na Filipino para sa mga kargamentong inihahatid ng mga barko.
- source_word: זָהָב וָכֶסֶף
  choice: ginto, pilak
  rationale: Tuwirang katumbas ng mga kalakal.
- source_word: שֶׁנְהַבִּים
  choice: garing
  rationale: Karaniwang katawagan sa Filipino para sa ivory bilang kalakal.
- source_word: וְקוֹפִים
  choice: mga unggoy
  rationale: Karaniwang pagkaunawa sa salitang Hebreo; hindi nito sapilitang itinatakda ang mas makitid na uri.
- source_word: וְתוּכִּיִּים
  choice: mga pabo real
  rationale: Tradisyonal at posibleng kahulugan ng hindi tiyak na pangalan ng hayop; nilalagyan ng talababa upang ipakita ang alternatibong 'mga loro.'
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang 'mga tauhan' sa halip na 'mga lingkod' upang ilarawan ang mga tauhan ng hari nang hindi nagpapahiwatig ng tiyak na katayuang panlipunan. Pinanatili ang 'mga barko ng Tarsis' upang hindi alisin ang kalabuan ng pariralang Hebreo.
