base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/031.yaml
  text: And Solomon slept with his fathers[a], and they buried him in the city of David his father. And Rehoboam his son reigned in his place.
translation:
  language: tl
  text: At namahinga si Solomon kasama ng kanyang mga ninuno,[a] at inilibing nila siya sa Lunsod ni David na kanyang ama. At si Rehoboam na kanyang anak ang naghari bilang kahalili niya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “natulog kasama ng kanyang mga ama,” isang nakaugaliang pahayag tungkol sa kamatayan at pagkakalibing sa piling ng mga ninuno.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב עִם אֲבֹתָיו
  choice: namahinga ... kasama ng kanyang mga ninuno
  rationale: Ang pormula ay isang magalang at nakaugaliang pahayag tungkol sa kamatayan at pagkakalibing sa piling ng mga ninuno. Pinananatili ng “namahinga” ang eupemismo at ugnayang pampanitikan nito, habang mas natural sa modernong Tagalog kaysa sa literal na “natulog kasama ng kanyang mga ama.”
- source_word: וַיִּקְבְּרֻהוּ
  choice: inilibing nila siya
  rationale: Aktibong pangmaramihan ang pandiwang Hebreo at may layong panghalip; pinananatili ng salin ang di-tiyak na mga naglibing nang hindi sila kinikilala.
- source_word: בְּעִיר דָּוִיד
  choice: sa Lunsod ni David
  rationale: Ito ang natural at kinikilalang anyo sa Tagalog para sa pangalang-pook na “City of David.”
- source_word: אָבִיו
  choice: na kanyang ama
  rationale: Tumutukoy si David bilang ama ni Solomon; pinananatili ang payak na relasyong ipinahayag ng Hebreo.
- source_word: וַיִּמְלֹךְ
  choice: ang naghari
  rationale: Tuwirang ipinahahayag ang paghahari sa pormula ng paghalili at natural itong pakinggan sa Tagalog.
- source_word: תַּחְתָּיו
  choice: bilang kahalili niya
  rationale: Ipinahahayag nito ang paghalili o pag-upo sa puwesto ng naunang hari; mas natural sa modernong Tagalog kaysa sa literal na “sa kanyang lugar.”
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “namahinga” upang mapanatili ang eupemismo ng Hebreo nang hindi lumilikha ng di-natural o posibleng nakalilitong literal na pariralang “natulog kasama ng kanyang mga ama.”
