reference: 2 Chronicles 9:10
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/גַם עַבְדֵ֤י חירם וְ/עַבְדֵ֣י שְׁלֹמֹ֔ה אֲשֶׁר הֵבִ֥יאוּ זָהָ֖ב מֵ/אוֹפִ֑יר הֵבִ֛יאוּ עֲצֵ֥י אַלְגּוּמִּ֖ים וְ/אֶ֥בֶן יְקָרָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/010.yaml
  text: And also the servants of Hiram and the servants of Solomon[a], who brought gold from Ophir[c][b], brought algum wood and precious stones.
translation:
  language: tl
  text: At gayundin, ang mga lingkod ni Hiram[a] at ang mga lingkod ni Solomon, na nagdala ng ginto mula sa Ofir, ay nagdala ng kahoy na algum[b] at mahahalagang bato.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa ilang tradisyon ng pagsasalin, ang pangalang ito ay isinusulat na “Huram”; “Hiram” ang kumakatawan sa anyong Hebreo rito.
    reason: alternative_reading
  - marker: b
    text: Hindi tiyak ang eksaktong uri ng kahoy na tinutukoy ng salitang Hebreo; tinatawag din itong “almug” sa ibang salin.
    reason: lexical_alternative
  - marker: c
    text: Sa Hebreo, “mahalagang bato” ang anyong isahan, ngunit malamang na kolektibo ang gamit at tumutukoy sa mahahalagang bato.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: At gayundin
  rationale: Pinananatili nito kapwa ang pang-ugnay na וְ at ang pandagdag na diin ng גַם, habang natural pa rin sa salaysay na Filipino.
- source_word: עַבְדֵי
  choice: mga lingkod
  rationale: Sa konteksto ng paglilingkod sa mga hari, ang salita ay tumutukoy sa mga tauhan o tagapaglingkod; hindi kailangang ipakahulugang mga alipin.
- source_word: חירם
  choice: Hiram
  rationale: Tuwirang transliterasyon ito ng anyong Hebreo sa talata at pamilyar na anyo ng pangalan sa Filipino.
- source_word: וְעַבְדֵי שְׁלֹמֹה
  choice: at ang mga lingkod ni Solomon
  rationale: Malinaw na pinananatili ang konstruksiyong pag-aari at ang pagkakapantay ng dalawang parirala tungkol sa mga lingkod.
- source_word: אֲשֶׁר הֵבִיאוּ זָהָב מֵאוֹפִיר
  choice: na nagdala ng ginto mula sa Ofir
  rationale: Ang payak na nagdaang aspekto ay natural sa Filipino at sapat upang tukuyin ang mga lingkod bilang mga nagdala ng ginto mula sa Ofir.
- source_word: אוֹפִיר
  choice: Ofir
  rationale: Isinalin sa karaniwang transliterasyong Filipino ang pangalang pantangi sa halip na bigyan ito ng haka-hakang kahulugan.
- source_word: הֵבִיאוּ
  choice: nagdala
  rationale: Tuwirang ipinapahayag ang causative na diwa ng pandiwang Hebreo nang hindi nagdaragdag ng mas makitid na komersiyal na ideya gaya ng 'nag-angkat.'
- source_word: עֲצֵי אַלְגּוּמִּים
  choice: kahoy na algum
  rationale: Hindi tiyak ang eksaktong uri ng punong tinutukoy; pinananatili ng transliterasyong 'algum' ang katawagang Hebreo nang hindi nagpapanggap na tiyak ang botanikong pagkakakilanlan.
- source_word: וְאֶבֶן יְקָרָה
  choice: at mahahalagang bato
  rationale: Bagaman isahan ang anyo ng 'bato' sa Hebreo, malamang na kolektibo ang gamit nito; natural sa Filipino ang maramihang anyo sa listahan ng mga dinalang kalakal.
theological_decisions: []
translation_notes:
  register: Makabago ngunit marangal na Filipino ang ginamit. Pinanatili ang paulit-ulit na 'nagdala' upang masalamin ang estruktura at diin ng Hebreo, at iniwasang tukuyin nang tiyak ang uri ng algum dahil hindi ito tiyak sa leksikograpiya.
