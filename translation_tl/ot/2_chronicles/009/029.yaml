base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/029.yaml
  text: The rest of the acts of Solomon[a], from first to last, are they not written in the records of Nathan the prophet, and in the prophecy of Ahijah the Shilonite[b], and in the visions of Iddo the seer concerning Jeroboam son of Nebat?
translation:
  language: tl
  text: Ang iba pang mga ginawa ni Solomon, mula sa simula hanggang sa wakas, hindi ba nakasulat ang mga iyon sa mga tala ni Natan, ang propeta,[a] sa propesiya ni Ahias na taga-Silo, at sa mga pangitain ni Ido, ang tagakita, tungkol kay Jeroboam na anak ni Nebat?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa mga salita” o “sa salaysay ni Natan na propeta.” Ang salitang Hebreo ay maaaring tumukoy sa mga binigkas na salita o sa isang nakasulat na salaysay; dito, malamang na isang nakasulat na sanggunian ang tinutukoy.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “hinggil kay,” o posibleng “laban kay Jeroboam na anak ni Nebat.” Maraming magkakaugnay na kahulugan ang pang-ukol sa Hebreo; ang “tungkol kay” ang pinakanababagay sa konteksto ng pagbanggit ng sanggunian.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁאָר דִּבְרֵי שְׁלֹמֹה
  choice: Ang iba pang mga ginawa ni Solomon
  rationale: Sa pangwakas na pormula tungkol sa isang hari, ang דִּבְרֵי ay tumutukoy nang malawak sa mga ginawa at pangyayari, hindi lamang sa mga salitang binigkas. Likas sa Filipino ang “iba pang mga ginawa.”
- source_word: הָרִאשֹׁנִים וְהָאַחֲרוֹנִים
  choice: mula sa simula hanggang sa wakas
  rationale: Ipinahihiwatig ng idyoma ang kabuuang saklaw ng kasaysayan ni Solomon; malinaw at natural itong naipapahayag sa Filipino sa ganitong paraan.
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: hindi ba nakasulat ang mga iyon
  rationale: Pinananatili nito ang anyong retorikal na tanong at ang pormal na pormula ng pagtukoy sa mga nasusulat na sanggunian.
- source_word: עַל דִּבְרֵי נָתָן הַנָּבִיא
  choice: sa mga tala ni Natan na propeta
  rationale: Sa kontekstong ito ng pagbanggit ng mga sanggunian, ang דִּבְרֵי ay malamang na tumutukoy sa isang nakasulat na salaysay o tala. Ang “sa” ay natural na katumbas ng konstruksiyong ginagamit kasama ng “nakasulat.”
- source_word: נְבוּאַת אֲחִיָּה הַשִּׁילוֹנִי
  choice: sa propesiya ni Ahias na taga-Silo
  rationale: Tuwirang isinasalin ang נְבוּאָה bilang “propesiya,” habang malinaw na ipinapahayag ng “taga-Silo” ang katawagang batay sa pinagmulan.
- source_word: וּבַחֲזוֹת יֶעְדּוֹ הַחֹזֶה
  choice: at sa mga pangitain ni Ido na tagakita
  rationale: Ang “mga pangitain” ay kumakatawan sa maramihan o kolektibong anyo ng חֲזוֹת. Ang “tagakita” ay nagpapanatili sa pagkakaiba ng titulong חֹזֶה mula sa נָבִיא, “propeta.”
- source_word: עַל יָרָבְעָם בֶּן נְבָט
  choice: tungkol kay Jeroboam na anak ni Nebat
  rationale: Sa konteksto ng talaan ng mga sanggunian, pinakanatural na ipinakikilala ng עַל ang paksa ng mga pangitain, bagaman maaari rin itong magkaroon ng diwang “laban kay.”
