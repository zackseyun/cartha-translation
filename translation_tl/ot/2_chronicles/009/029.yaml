revisions:
- from: Ang iba pang mga ginawa ni Solomon, mula sa simula hanggang sa wakas, hindi ba nakasulat ang mga iyon sa mga tala ni Natan na propeta,[a] sa propesiya ni Ahias na taga-Silo, at sa mga pangitain ni Ido na tagakita tungkol kay Jeroboam na anak ni Nebat?[b]
  to: Ang iba pang mga ginawa ni Solomon, mula sa simula hanggang sa wakas, hindi ba nakasulat ang mga iyon sa mga tala ni Natan, ang propeta,[a] sa propesiya ni Ahias na taga-Silo, at sa mga pangitain ni Ido, ang tagakita, tungkol kay Jeroboam na anak ni Nebat?[b]
  rationale: Ginawa lamang ang maliliit at ligtas na pagbabago sa sintaks at sa lokasyon ng footnote anchor. Hindi binago ang kahulugan, ang retorikal na anyo, ang saklaw na “mula sa simula hanggang sa wakas,” o ang maingat na pagtrato sa semantikong saklaw ng עַל.
