translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang retorikal na tanong at ang pagkakaiba ng “propeta” at “tagakita.” Inilagay ang mga pananda ng talababa sa mismong mga pariralang tinatalakay ng mga ito.
