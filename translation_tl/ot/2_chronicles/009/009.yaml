revisions:
- from: At ibinigay niya sa hari ang 120 talento ng ginto,[a] napakaraming mga pabango, at mahahalagang bato. Kailanman ay wala pang mga pabangong tulad ng ibinigay ng reyna ng Sheba kay Haring Solomon.
  to: At ibinigay niya sa hari ang 120 talento ng ginto,[a] napakaraming espesya, at mahahalagang bato. Hanggang noon, wala pang mga espesyang tulad ng mga ibinigay ng reyna ng Sheba kay Haring Solomon.
  rationale: Pinalitan ang “mga pabango” ng “mga espesya” upang tumpak na maisalin ang mga aromatikong handog. Inayos ang huling pangungusap upang maging natural na Tagalog at upang ilahad sa pangunahing teksto ang paghahambing hanggang sa panahong iyon; idinagdag sa talababa ang alternatibong mas malawak na pagbasa nang hindi pumipili sa pagitan ng mga posibilidad.
