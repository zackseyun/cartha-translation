    issue: “mga pabango” para sa בְשָׂמִים
    rationale: Sa kontekstong ito, ang salita ay mga espesya/aromatikong sangkap na handog. Ang “pabango” sa modernong Tagalog ay karaniwang tumutukoy sa perfume o fragrance product at maaaring magpaliit o magbago ng tinutukoy.
  - severity: low
    issue: Hindi naipapakita ng talababa ang saklaw ng temporal na paghahambing sa huling pangungusap.
    rationale: Maaaring unawain ang Hebreo bilang walang katulad hanggang noon o bilang mas malawak na pahayag na wala nang katulad; makabubuting panatilihin ang ambigwidad sa talababa, ayon sa audit trail.
