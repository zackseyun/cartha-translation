base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/009.yaml
  text: And she gave the king one hundred twenty talents of gold[a], and spices in great abundance, and precious stones. There had never been spices like those that the queen of Sheba gave to King Solomon.
translation:
  language: tl
  text: At ibinigay niya sa hari ang 120 talento ng ginto,[a] napakaraming espesya, at mahahalagang bato. Hanggang noon, wala pang mga espesyang tulad ng mga ibinigay ng reyna ng Sheba kay Haring Solomon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ang 120 talento ay humigit-kumulang 4 na tonelada ng ginto, bagaman nag-iiba-iba ang eksaktong bigat ng isang talento. Maaari ring unawain ang huling pangungusap bilang: “Hindi na kailanman nagkaroon ng mga espesyang tulad ng mga ibinigay ng reyna ng Sheba kay Haring Solomon.”'
    reason: Nililinaw ang sinaunang yunit ng timbang at pinananatili ang posibleng mas malawak na saklaw ng temporal na paghahambing sa Hebreo.
lexical_decisions:
- source_word: וַתִּתֵּן
  choice: At ibinigay niya
  rationale: Isinusulong ng wayyiqtol ang salaysay; likas sa Tagalog ang “At ibinigay niya” bilang pagpapatuloy ng pangyayari.
- source_word: מֵאָה וְעֶשְׂרִים כִּכַּר זָהָב
  choice: 120 talento ng ginto
  rationale: Ang כִּכָּר ay sinaunang yunit ng timbang at karaniwang isinasaling “talento”; pinananatili ang eksaktong bilang sa teksto.
- source_word: וּבְשָׂמִים לָרֹב מְאֹד
  choice: napakaraming mga pabango
  rationale: Ang בְּשָׂמִים ay mga mababangong sangkap o espesya; “mga pabango” ang malinaw at natural na kolektibong tawag dito, habang ipinahahayag ng “napakarami” ang mariing dami ng לָרֹב מְאֹד.
- source_word: וְאֶבֶן יְקָרָה
  choice: at mahahalagang bato
  rationale: Bagaman anyong isahan ang אֶבֶן, maaari itong gamiting kolektibo; natural sa Tagalog ang maramihan sa talaan ng mga handog.
- source_word: וְלֹא הָיָה כַּבֹּשֶׂם הַהוּא
  choice: Kailanman ay wala pang mga pabangong tulad
  rationale: Ipinahahayag nito na hanggang sa puntong iyon ay walang kapantay ang mga pabango; hindi nilulutas nang labis kung kalidad, uri, o kabuuang handog ang pangunahing diin.
- source_word: מַלְכַּת שְׁבָא
  choice: reyna ng Sheba
  rationale: Pinananatili ang tradisyonal at madaling makilalang anyo ng pangalan ng lugar.
- source_word: לַמֶּלֶךְ שְׁלֹמֹה
  choice: kay Haring Solomon
  rationale: Ito ang natural na ayos ng titulo at pangalan sa modernong Tagalog.
