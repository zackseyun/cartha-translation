  text: And they were importing horses for Solomon from Egypt and from all the lands[a].
translation:
  language: tl
  text: At nag-aangkat sila ng mga kabayo mula sa Ehipto para kay Solomon, at mula sa lahat ng lupain.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O, mas literal: “At naglalabas sila ng mga kabayo mula sa Ehipto para kay Solomon, at mula sa lahat ng lupain.” Ang pandiwang Hebreo ay literal na nangangahulugang “nagpapalabas” o “naglalabas,” ngunit sa kontekstong ito ay tumutukoy sa pag-aangkat bilang panustos sa kalakalan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מוֹצִיאִים
  choice: At nag-aangkat sila
  rationale: Ang Hiphil participle ng יצא ay literal na “naglalabas” o “nagpapalabas.” Sa konteksto ng pagdadala ng mga kabayo mula sa ibang lupain para kay Solomon, likas na ipinahahayag ng “nag-aangkat” ang diwa ng kalakalan. Pinananatili ng “sila” ang di-tiyak na maramihang tagaganap ng Hebreo.
- source_word: סוּסִים
  choice: ng mga kabayo
  rationale: Tuwirang katumbas ng pangngalang maramihan na tumutukoy sa mga kabayo.
- source_word: מִ/מִּצְרַיִם
  choice: mula sa Ehipto
  rationale: Ipinahihiwatig ng מן ang pinagmulan ng mga kabayo.
- source_word: לִ/שְׁלֹמֹה
  choice: para kay Solomon
  rationale: Maaaring mangahulugan ang ל ng “kay” o “para kay.” Sa konteksto ng panustos at kalakalan, malinaw at natural ang “para kay Solomon” bilang benepisyaryo o tatanggap.
- source_word: וּ/מִ/כָּל הָ/אֲרָצוֹת
  choice: at mula sa lahat ng lupain
  rationale: Ang כָּל kasama ng maramihan ng אֶרֶץ ay tumutukoy sa malawak na hanay ng mga lupain o teritoryo. Pinananatili ng “mga lupain” ang larawan ng Hebreo nang hindi ito nililimitahan sa makabagong konsepto ng mga bansa.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “nag-aangkat” bilang likas na katawagan sa kalakalan, habang inilagay sa talababa ang mas literal na kahulugan upang mapanatili ang leksikal na puwang ng Hebreo.
