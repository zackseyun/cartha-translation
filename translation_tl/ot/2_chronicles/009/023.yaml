  text: וְ/כֹל֙ מַלְכֵ֣י הָ/אָ֔רֶץ מְבַקְשִׁ֖ים אֶת פְּנֵ֣י שְׁלֹמֹ֑ה לִ/שְׁמֹ֨עַ֙ אֶת חָכְמָת֔/וֹ אֲשֶׁר נָתַ֥ן הָ/אֱלֹהִ֖ים בְּ/לִבּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/023.yaml
  text: And all the kings of the earth sought the presence of Solomon[a], to hear his wisdom that God had put in his heart.
translation:
  language: tl
  text: At hinahangad ng lahat ng hari sa buong daigdig na makaharap si Solomon[a] upang marinig ang karunungang inilagay ng Diyos sa kanyang puso.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “hanapin ang mukha ni Solomon,” isang idyoma na nangangahulugang hangaring makaharap o makausap siya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֹל מַלְכֵי הָאָרֶץ
  choice: At ... ng lahat ng hari sa buong daigdig
  rationale: Ipinagpapatuloy ng וְ ang salaysay. Maaaring tumukoy ang הָאָרֶץ sa lupain o daigdig; sa konteksto ng malawak na katanyagan ni Solomon sa mga hari, natural sa Filipino ang “sa buong daigdig” bilang panlahat na pahayag ng Hebreo.
- source_word: מְבַקְשִׁים אֶת־פְּנֵי שְׁלֹמֹה
  choice: hinahangad ... na makaharap si Solomon
  rationale: Ang literal na “hinahanap ang mukha ni Solomon” ay idyoma para sa paghahangad na mapunta sa kanyang harapan o makausap siya. Pinananatili ng “hinahangad na makaharap” ang diwa ng presensya at ang patuloy na aspekto ng participle nang natural sa Filipino.
- source_word: לִשְׁמֹעַ אֶת־חָכְמָתוֹ
  choice: upang marinig ang karunungan
  rationale: Malinaw na layunin ang infinitive na לִשְׁמֹעַ. Ang “marinig ang karunungan” ay tuwiran at pinananatili ang paraan ng pagpapahayag sa Hebreo.
- source_word: אֲשֶׁר נָתַן הָאֱלֹהִים בְּלִבּוֹ
  choice: na inilagay ng Diyos sa kanyang puso
  rationale: Bagaman karaniwang “ibinigay” ang נָתַן, kasama ng בְּלִבּוֹ ay natural at tumpak ang “inilagay ... sa kanyang puso.” Pinananatili ng “puso” ang saklaw ng panloob na pagkatao sa biblikal na pananalita.
theological_decisions:
- issue: Ang Diyos bilang pinagmulan ng karunungan ni Solomon
  choice: karunungang inilagay ng Diyos sa kanyang puso
  alternative: karunungang ibinigay sa kanya ng Diyos
  rationale: Tahasang iniuugnay ng talata sa Diyos ang karunungan ni Solomon. Pinananatili rin ng napiling salin ang lokatibong “sa kanyang puso,” sa halip na gawing pangkalahatang pagkakaloob lamang.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “makaharap” upang natural na maipahayag ang Hebreong idyoma, habang ipinaliliwanag sa talababa ang literal na larawan.
