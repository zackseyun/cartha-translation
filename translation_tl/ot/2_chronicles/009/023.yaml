  source_fidelity: Tapat ang salin sa Hebreo. Naipapahayag ng “hinahangad ... na makaharap si Solomon” ang idyomang מְבַקְשִׁים אֶת־פְּנֵי bilang paghahangad ng paglapit o pakikipagharap kay Solomon, at ang “upang marinig” ay malinaw na nagsasaad ng layunin. Wasto ring iniugnay sa Diyos ang karunungang “inilagay ... sa kanyang puso.”
