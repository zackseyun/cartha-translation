  text: And twelve lions were standing there on the six steps[a], on this side and on that side. Nothing like it had been made for any kingdom.
translation:
  language: tl
  text: May labindalawang leon na nakatayo roon sa anim na baitang,[a] sa magkabilang panig. Walang nagawang katulad nito para sa alinmang kaharian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O: “May labindalawang leon na nakatayo roon sa anim na baitang, tig-isang leon sa bawat panig ng bawat baitang.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁנֵים עָשָׂר אֲרָיוֹת
  choice: May labindalawang leon
  rationale: Natural na ipinakikilala sa Tagalog ang kasunod na bahagi ng paglalarawan sa pamamagitan ng “May,” habang pinananatili ang bilang at ang mga pigurang leon.
- source_word: עֹמְדִים שָׁם
  choice: na nakatayo roon
  rationale: Ang participle ay naglalarawan sa kalagayan o ayos ng mga leon sa tagpo; malinaw itong naipapahayag ng “nakatayo roon.”
- source_word: עַל שֵׁשׁ הַמַּעֲלוֹת
  choice: sa anim na baitang
  rationale: Ang מַעֲלוֹת ay mga baitang na paakyat sa trono. Ang “sa” ay likas sa Tagalog at hindi labis na tinutukoy kung eksaktong nasa ibabaw o kahabaan ng mga baitang ang mga leon.
- source_word: מִזֶּה וּמִזֶּה
  choice: sa magkabilang panig
  rationale: Karaniwang ekspresyon sa Tagalog para sa simetrikong pagkakalagay sa isang panig at sa kabila.
- source_word: לֹא נַעֲשָׂה כֵן
  choice: Wala pang nagawang katulad nito
  rationale: Pinananatili ang pasibong diwa at ang pahayag ng pagiging natatangi, sa natural na modernong Tagalog.
- source_word: לְכָל מַמְלָכָה
  choice: para sa alinmang kaharian
  rationale: Ipinahihiwatig ng לְ ang paggawa para sa isang kaharian, at ipinakikita ng “alinmang” ang malawak na paghahambing.
