translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang 'nito' sa magkakalapit na pagtukoy sa reyna upang maiwasan ang kalituhan sa kasarian ng mga panghalip, at ang 'kanyang' sa huling pangungusap kung saan malinaw na ang tinutukoy.
