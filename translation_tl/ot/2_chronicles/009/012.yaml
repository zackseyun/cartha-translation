base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/012.yaml
  text: And King Solomon gave the queen of Sheba all that she desired[a], whatever she asked, besides what she had brought to the king. Then she turned and went to her own land[b], she and her servants.
translation:
  language: tl
  text: Ibinigay ni Haring Solomon sa reyna ng Sheba ang lahat ng kaniyang ninanais, anuman ang hiningi niya, bukod pa sa dinala niya sa hari.[a] Pagkatapos, bumalik siya sa kaniyang lupain kasama ang kaniyang mga lingkod.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “maliban sa dinala niya sa hari.” Maaaring unawain ang pariralang Hebreo bilang paghihiwalay sa mga ibinigay ni Solomon at sa mga kaloob na dinala ng reyna sa kaniya.'
    reason: lexical_alternative
  - marker: b
    text: 'Sa literal: “pumihit siya at pumunta sa kaniyang lupain.” Sa konteksto, ipinahihiwatig nito ang kaniyang pagbabalik.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נָתַן
  choice: ibinigay
  rationale: Karaniwang salin sa tuwirang konteksto ng pagbibigay ng mga kaloob.
- source_word: מַלְכַּת שְׁבָא
  choice: reyna ng Sheba
  rationale: Likas at malinaw na salin ng titulo, habang pinananatili ang pangalang pook na Sheba.
- source_word: כָּל חֶפְצָהּ
  choice: ang lahat ng ninanais nito
  rationale: Ipinahahayag ang saklaw ng חֵפֶץ bilang anumang bagay na nais ng reyna nang hindi nagiging labis na literal.
- source_word: אֲשֶׁר שָׁאָלָה
  choice: anuman ang hiningi nito
  rationale: Ang שׁאל ay tumutukoy rito sa paghingi; ang 'anuman' ay natural na nag-uugnay sa naunang 'lahat.'
- source_word: מִלְּבַד אֲשֶׁר הֵבִיאָה אֶל הַמֶּלֶךְ
  choice: bukod pa sa dinala nito sa hari
  rationale: Pinananatili ng 'bukod pa' ang posibleng diwang paghihiwalay o pagdaragdag ng מִלְּבַד; inilalahad sa talababa ang tunay na kalabuan ng kaugnayan ng mga kaloob.
- source_word: וַתַּהֲפֹךְ וַתֵּלֶךְ לְאַרְצָהּ
  choice: bumalik siya sa sarili niyang lupain
  rationale: Natural na Filipino para sa idyomatikong pagkakasunod na literal na 'pumihit siya at pumunta sa kanyang lupain'; nasa talababa ang mas literal na anyo.
- source_word: הִיא וַעֲבָדֶיהָ
  choice: kasama ang kanyang mga lingkod
  rationale: Natural na ipinahahayag ang pagsama ng mga tauhan ng reyna; hindi tiyak sa konteksto na dapat idiin ang kalagayang alipin.
