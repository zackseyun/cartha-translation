  text: וּ/מַאֲכַ֣ל שֻׁלְחָנ֡/וֹ וּ/מוֹשַׁ֣ב עֲבָדָי/ו֩ וּ/מַעֲמַ֨ד מְשָׁרְתָ֜י/ו וּ/מַלְבּֽוּשֵׁי/הֶ֗ם וּ/מַשְׁקָי/ו֙ וּ/מַלְבּ֣וּשֵׁי/הֶ֔ם וַ/עֲלִיָּת֔/וֹ אֲשֶׁ֥ר יַעֲלֶ֖ה בֵּ֣ית יְהוָ֑ה וְ/לֹא הָ֥יָה ע֛וֹד בָּ֖/הּ רֽוּחַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/004.yaml
  text: the food of his table[a], the seating of his servants, the attendance of his ministers and their clothing, his cupbearers and their clothing, and the stairway by which he went up to the house of Yahweh[b], there was no more breath in her.
translation:
  language: tl
  text: ang pagkain sa kanyang hapag, ang ayos ng pagkakaupo ng kanyang mga lingkod, ang pagkakapuwesto ng kanyang mga tagapagsilbi at ang kanilang kasuotan, ang kanyang mga tagapaghain ng inumin at ang kanilang kasuotan, at ang hagdanang inaakyatan niya[a] upang pumunta sa bahay ni Yahweh—wala nang hininga sa kanya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, ayon sa kahawig na pahayag sa 1 Hari 10:5, “ang handog na sinusunog na inihandog niya sa bahay ni Yahweh.” Pinakanatural na mabasa rito ang tekstong Hebreo bilang “ang hagdanan” o “ang paakyat na daan” na inaakyatan niya.
    reason: alternative_reading
  - marker: b
    text: Sa Hebreo, “wala nang hininga sa kanya,” isang idyomang nagpapahayag ng labis na pagkamangha.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַאֲכַל שֻׁלְחָנוֹ
  choice: ang pagkain sa kanyang hapag
  rationale: Tuwirang ipinahahayag ang pagkaing inihahain sa maharlikang hapag; natural at marangal ang “hapag” sa konteksto.
- source_word: מוֹשַׁב עֲבָדָיו
  choice: ang ayos ng pagkakaupo ng kanyang mga lingkod
  rationale: Ang מוֹשָׁב ay maaaring tumukoy sa upuan, pagkakaupo, o kaayusan ng mga puwesto. Ipinakikita ng salin ang organisadong kaayusan sa korte.
- source_word: מַעֲמַד מְשָׁרְתָיו
  choice: ang pagkakatayo ng kanyang mga tagapagsilbi
  rationale: Pinananatili ang konkretong larawan ng מַעֲמַד bilang pagtayo o pagkakapuwesto, at itinatangi ang מְשָׁרְתָיו mula sa naunang “mga lingkod.”
- source_word: מַלְבּוּשֵׁיהֶם
  choice: ang kanilang kasuotan
  rationale: Malinaw at kasalukuyang salin ng mga damit o bihis, na angkop sa marangal na tagpo.
- source_word: מַשְׁקָיו
  choice: ang kanyang mga tagapaghain ng inumin
  rationale: Ipinahahayag ang tungkulin ng mga opisyal na nangangasiwa sa inumin nang hindi gumagamit ng salitang may makitid o banyagang konotasyon.
- source_word: עֲלִיָּתוֹ אֲשֶׁר יַעֲלֶה בֵּית יְהוָה
  choice: ang hagdanang dinaraanan niya paakyat sa bahay ni Yahweh
  rationale: Ang tekstong Masoretiko ay pinakanatural na tumutukoy sa isang paakyat na daan o hagdanan. Pinananatili sa talababa ang alternatibong pagbasa mula sa kahawig na talata sa 1 Hari 10:5.
- source_word: בֵּית יְהוָה
  choice: bahay ni Yahweh
  rationale: Pinananatili ang literal na idyomang “bahay” at isinasalin ang banal na pangalang יהוה bilang “Yahweh.”
- source_word: וְלֹא הָיָה עוֹד בָּהּ רוּחַ
  choice: wala nang hininga sa kanya
  rationale: Pinananatili ang matingkad na larawang Hebreo ng pagkawala ng רוּחַ, na rito ay nagpapahayag ng labis na pagkamangha.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: ang PANGINOON; Jehova
  rationale: Tahasang nasa Hebreo ang Tetragrammaton; ang “Yahweh” ay nagpapanatili rito bilang personal na pangalan sa halip na palitan ng titulo.
- issue: Kahulugan ng רוּחַ sa pangwakas na idyoma
  choice: hininga
  alternative: espiritu; lakas ng loob
  rationale: Sa konteksto ng matinding pagkamangha, “hininga” ang konkretong kahulugang pinakamalapit sa idyoma at hindi nito nilulutas nang labis ang lawak ng salitang Hebreo.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “hapag” at “kasuotan” upang mapanatili ang pormal na tagpo nang hindi nagiging lipas ang wika. Inilipat ang mga pananda ng talababa sa mismong mga pariralang kanilang ipinaliliwanag.
