  text: Blessed are your men[b][a], and blessed are these your servants who stand before you continually and hear your wisdom.
translation:
  language: tl
  text: Mapalad[a] ang mga lalaking tauhan mo! Mapalad ang mga lingkod mong ito na laging nakatayo sa iyong harapan[b] at nakikinig sa iyong karunungan!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “Maligaya” o “Napakapalad.” Ang Hebreong אַשְׁרֵי ay tumutukoy sa isang maligaya, mapalad, o kanais-nais na kalagayan.
    reason: lexical_alternative
  - marker: b
    text: Ang “nakatayo sa iyong harapan” ay isang pananalita sa maharlikang korte para sa mga palaging humaharap at naglilingkod sa presensiya ng hari.
    reason: cultural_note
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: Mapalad
  rationale: Ipinahahayag nito ang isang kanais-nais at pinagpalang kalagayan. Likas at marangal sa Filipino ang “mapalad,” at hindi nito ipinahihiwatig nang tahasan kung sino ang nagbibigay ng pagpapala.
- source_word: אֲנָשֶׁיךָ
  choice: mga tauhan mo
  rationale: Sa konteksto ng maharlikang korte, tumutukoy ito sa mga lalaking kabilang sa sambahayan o korte ng hari. Mas natural ang “mga tauhan mo” kaysa sa literal ngunit alanganing “mga lalaki mo,” nang hindi ito ginagawang kapareho ng kasunod na “mga lingkod.”
- source_word: עֲבָדֶיךָ
  choice: mga lingkod mo
  rationale: Bagaman maaaring tumukoy ang salita sa alipin, ang diin dito ay paglilingkod sa korte; kaya ang “mga lingkod” ang angkop at likas na salin.
- source_word: אֵלֶּה
  choice: ito
  rationale: Pinananatili ng “ito” ang tiyak at panturong diwa ng Hebreong demonstratibo.
- source_word: הָעֹמְדִים לְפָנֶיךָ
  choice: na nakatayo sa iyong harapan
  rationale: Pinananatili nito ang literal na larawan at ang pormulang ginagamit sa korte para sa mga humaharap at naglilingkod sa presensiya ng hari.
- source_word: תָּמִיד
  choice: laging
  rationale: Ipinahahayag nito ang palagian o regular na pagharap. Natural sa modernong Filipino ang “laging” at hindi kinakailangang mangahulugang walang patid sa bawat sandali.
- source_word: וְשֹׁמְעִים
  choice: at nakikinig
  rationale: Sa konteksto, hindi lamang aksidenteng pagkarinig kundi mapanuring pakikinig sa karunungan ng hari ang ipinahihiwatig.
- source_word: חָכְמָתֶךָ
  choice: iyong karunungan
  rationale: Tuwirang pinananatili nito ang karunungang taglay at ipinahahayag ng hari.
