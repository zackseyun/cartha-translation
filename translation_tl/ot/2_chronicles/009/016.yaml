base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/016.yaml
  text: and three hundred shields of beaten gold[a]; three hundred shekels of gold went onto each shield[c][b]. And the king put them in the House of the Forest of Lebanon.
translation:
  language: tl
  text: Gumawa rin siya ng tatlong daang kalasag na yari sa pinukpok na ginto.[a] Tatlong daang siklo ng ginto ang inilapat sa bawat kalasag.[b] Inilagay ng hari ang mga iyon sa Bahay ng Gubat ng Lebanon.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “gintong pinukpok gamit ang martilyo.” Malamang na pinukpok ang ginto upang maging manipis na sapin.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “tatlong daang ginto”; hindi tahasang binanggit ang yunit. Idinagdag ang “siklo” para sa kalinawan, gaya ng ipinahihiwatig ng katumbas na pahayag sa 1 Hari 10:17.
    reason: lexical_alternative
  - marker: c
    text: Ang Bahay ng Gubat ng Lebanon ay pangalan ng isang gusaling panghari; maaari ring isalin na “Palasyo ng Gubat ng Lebanon.”
    reason: cultural_note
lexical_decisions:
- source_word: מָגִנִּים
  choice: mga kalasag
  rationale: Ang מָגֵן ay pangkalahatang tawag sa pananggalang na kalasag; malinaw at likas sa makabagong Filipino ang “kalasag.”
- source_word: זָהָב שָׁחוּט
  choice: pinukpok na ginto
  rationale: Inilalarawan ng שָׁחוּט dito ang gintong pinukpok o minartilyo, malamang upang maging manipis na sapin. Pinananatili ng “pinukpok na ginto” ang kongkretong paraan ng pagproseso.
- source_word: שְׁלֹשׁ מֵאוֹת זָהָב
  choice: tatlong daang siklo ng ginto
  rationale: Walang tahasang yunit sa Hebreo, na literal na “tatlong daang ginto.” Ipinahiwatig ng katumbas na pahayag sa 1 Hari 10:17 at ng sinaunang gamit sa pagtimbang na siklo ang yunit; isinama ito sa teksto para sa kalinawan at minarkahan sa talababa.
- source_word: יַעֲלֶה עַל
  choice: inilapat sa
  rationale: Ang parirala ay literal na nagpapahiwatig na ang dami ng ginto ay “umakyat sa” o napunta sa kalasag. Ang “inilapat sa” ay natural sa Filipino at ipinakikitang ginamit ang ginto bilang sapin nang hindi ipinapalagay na purong ginto ang buong kalasag.
- source_word: הַמָּגֵן הָאֶחָת
  choice: bawat kalasag
  rationale: 'Bagaman pormal na isahan, distributibo ang gamit sa konteksto: ang naturang dami ay para sa bawat isa sa tatlong daang kalasag.'
- source_word: וַיִּתְּנֵם
  choice: inilagay ... ang mga iyon
  rationale: Sa konteksto ng isang bagay at isang lokasyon, ang נתן ay likas na nangangahulugang ilagay o ipuwesto.
- source_word: בֵּית יַעַר הַלְּבָנוֹן
  choice: Bahay ng Gubat ng Lebanon
  rationale: Pangalan ito ng isang tiyak na gusaling maharlika. Ang anyong may malalaking titik ay nagpapanatili sa katangian nitong pantanging pangalan at sa hulma ng Hebreo.
