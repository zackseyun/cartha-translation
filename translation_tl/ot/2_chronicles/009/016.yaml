translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “siklo,” ang karaniwang katawagan sa biblikal na yunit ng timbang, at ipinaliwanag ang ipinahiwatig na yunit sa talababa. Pinanatili bilang pantanging pangalan ang gusaling maharlika.
