  text: When the queen of Sheba saw Solomon’s wisdom and the house that he had built,[a]
translation:
  language: tl
  text: Nang makita ng reyna ng Sheba ang karunungan ni Solomon at ang bahay na itinayo niya,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang palasyong itinayo niya.” “Bahay” ang nasa Hebreo, ngunit sa maharlikang kontekstong ito, maaaring partikular itong tumukoy sa palasyo ni Solomon o sa kabuuan ng mga gusali nito.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּרֶא
  choice: Nang makita
  rationale: Ang waw-consecutive na may ראה ay nagpapatuloy sa salaysay. Ang “Nang makita” ay likas sa Tagalog at naghahanda sa pagpapatuloy ng pangungusap sa kasunod na talata.
- source_word: מַלְכַּת שְׁבָא
  choice: ang reyna ng Sheba
  rationale: Ang construct chain ay tumutukoy sa reyna ayon sa kaniyang kaharian o lugar; natural at karaniwang anyo sa Tagalog ang “reyna ng Sheba.”
- source_word: אֵת
  choice: '[hindi hiwalay na isinalin]'
  rationale: Pananda ito ng tiyak na layon at walang sariling katumbas na salita sa Tagalog; naipapakita ang gamit nito sa ayos ng pangungusap.
- source_word: חָכְמַת שְׁלֹמֹה
  choice: ang karunungan ni Solomon
  rationale: Natural na pagsasalin ng construct chain sa Tagalog. Ang “karunungan” ay sumasaklaw sa kaniyang talino, unawa, at mahusay na pagpapasiya.
- source_word: וְהַבַּיִת
  choice: at ang bahay
  rationale: Literal na “bahay” ang בַּיִת. Sa maharlikang konteksto, maaari itong tumukoy sa palasyo o kabuuan ng palasyo, ngunit pinananatili sa pangunahing teksto ang mas malawak na kahulugan ng Hebreo.
- source_word: אֲשֶׁר בָּנָה
  choice: na ipinatayo niya
  rationale: Ang pandiwang בנה ay aktibong “itinayo niya,” ngunit sa natural na Tagalog, ang isang hari ay karaniwang sinasabing “nagpatayo” ng malaking gusali. Ipinahihiwatig ng aspektong naganap na tapos na ang pagtatayo bago ito nakita ng reyna.
