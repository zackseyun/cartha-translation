translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “sisidlang inuman” upang maiwasang paliitin ang kahulugan sa mga kopa lamang. Pinanatili bilang pantanging pangalan ang “Bahay ng Kagubatan ng Lebanon,” at inilagay sa talababa ang interpretibong “Palasyo.”
