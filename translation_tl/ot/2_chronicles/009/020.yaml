  text: וְ֠/כֹל כְּלֵ֞י מַשְׁקֵ֨ה הַ/מֶּ֤לֶךְ שְׁלֹמֹה֙ זָהָ֔ב וְ/כֹ֗ל כְּלֵ֛י בֵּֽית יַ֥עַר הַ/לְּבָנ֖וֹן זָהָ֣ב סָג֑וּר אֵ֣ין כֶּ֗סֶף נֶחְשָׁ֛ב בִּ/ימֵ֥י שְׁלֹמֹ֖ה לִ/מְאֽוּמָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/020.yaml
  text: All King Solomon’s drinking vessels were gold[a], and all the vessels of the House of the Forest of Lebanon were pure gold[c][b]. Silver was not considered anything in the days of Solomon.
translation:
  language: tl
  text: Ang lahat ng sisidlang inuman ni Haring Solomon ay yari sa ginto, at ang lahat ng sisidlan sa Bahay ng Kagubatan ng Lebanon[a] ay yari sa dalisay na ginto[b]. Noong panahon ni Solomon, ang pilak ay itinuring na walang halaga.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Palasyo ng Kagubatan ng Lebanon,” ang pangalan ng isang gusali ng hari.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “gintong nakapinid”; isang idyomang karaniwang inuunawang “dalisay” o “pinong” ginto.
    reason: lexical_alternative
  - marker: c
    text: 'Mas literal: “ang pilak ay hindi itinuring na anuman noong panahon ni Solomon.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּלֵי מַשְׁקֵה
  choice: mga sisidlang inuman
  rationale: Pinananatili nito ang malawak na diwa ng כְּלֵי bilang mga sisidlan o kagamitan at ang pagtukoy ng מַשְׁקֵה sa pag-inom, nang hindi nililimitahan sa mga kopa lamang.
- source_word: זָהָב
  choice: ginto
  rationale: Tuwirang katumbas ng materyal na tinutukoy; pinanatili sa dalawang paglitaw nito.
- source_word: בֵּית יַעַר הַלְּבָנוֹן
  choice: Bahay ng Kagubatan ng Lebanon
  rationale: Tuwirang isinasalin ang בֵּית bilang “Bahay” at pinananatili ang katangian nito bilang pangalan ng isang tiyak na gusaling maharlika.
- source_word: זָהָב סָגוּר
  choice: dalisay na ginto
  rationale: Ang סָגוּר kapag kasama ng “ginto” ay idyomang tumutukoy sa mataas na uri o pinong ginto; natural at malinaw sa Filipino ang “dalisay na ginto.”
- source_word: אֵין כֶּסֶף נֶחְשָׁב ... לִמְאוּמָה
  choice: ang pilak ay itinuring na walang halaga
  rationale: Natural nitong ipinapahayag sa Filipino ang kawalang-halaga o kawalang-pansin sa pilak na sinasaad ng Hebreo.
- source_word: בִּימֵי שְׁלֹמֹה
  choice: Noong panahon ni Solomon
  rationale: Likas na katumbas sa modernong Filipino ng Hebreong idyomang “sa mga araw ni Solomon,” nang hindi labis na tinutukoy na ito ay ang panahon lamang ng paghahari.
