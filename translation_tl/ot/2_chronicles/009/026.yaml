  text: וַ/יְהִ֥י מוֹשֵׁ֖ל בְּ/כָל הַ/מְּלָכִ֑ים מִן הַ/נָּהָר֙ וְ/עַד אֶ֣רֶץ פְּלִשְׁתִּ֔ים וְ/עַ֖ד גְּב֥וּל מִצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/026.yaml
  text: And he ruled over all the kings from the River to the land of the Philistines and to the border of Egypt[a].
translation:
  language: tl
  text: At pinamahalaan niya ang lahat ng hari mula sa Ilog[a] hanggang sa lupain ng mga Filisteo at hanggang sa hangganan ng Ehipto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “Ilog” ay malamang na tumutukoy sa Ilog Eufrates, isang karaniwang katawagang pangheograpiya sa Bibliyang Hebreo.
    reason: cross_reference
lexical_decisions:
- source_word: וַיְהִי מוֹשֵׁל
  choice: At pinamahalaan niya
  rationale: Ang וַיְהִי na kasunod ng participleng מוֹשֵׁל ay naglalarawan ng nagpapatuloy na kalagayan ng pamumuno sa nakaraan. Likas sa makabagong Tagalog ang payak na pandiwang “pinamahalaan” at malinaw nitong ipinahihiwatig ang kapangyarihang pampolitika.
- source_word: בְּכָל הַמְּלָכִים
  choice: ang lahat ng hari
  rationale: Sa piling ng מוֹשֵׁל, ang בְּ ay tumutukoy sa mga sakop ng pamamahala. Ipinahahayag ng “ang lahat ng hari” na ang mga haring ito ay nasa ilalim ng kaniyang kapangyarihan.
- source_word: מִן הַנָּהָר
  choice: mula sa Ilog
  rationale: Pinananatili sa pangunahing teksto ang tiyak ngunit hindi pinangalanang katawagang Hebreo na “ang Ilog.” Nililinaw sa talababa na malamang na Eufrates ang tinutukoy.
- source_word: וְעַד אֶרֶץ פְּלִשְׁתִּים
  choice: hanggang sa lupain ng mga Filisteo
  rationale: Malapit ito sa anyo at kahulugan ng Hebreo at malinaw na tumutukoy sa lawak na umaabot sa teritoryo ng mga Filisteo, nang hindi pinapalitan iyon ng mas interpretatibong pangalang “Filistia.”
- source_word: וְעַד גְּבוּל מִצְרָיִם
  choice: at hanggang sa hangganan ng Ehipto
  rationale: Ang “hangganan” ay tuwirang katumbas ng גְּבוּל at pinananatili ang heograpikong paglalarawan ng sukdulang saklaw.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “pinamahalaan” sa halip na mas mabigat na “naghari,” sapagkat ang tuwirang layon ay mga hari at ang diwa ay pampolitikang paghahari o kapangyarihan sa kanila. Pinanatili ang “Ilog” sa pangunahing teksto upang huwag gawing tahasan ang referent na ipinahihiwatig lamang ng nakaugaliang heograpikong gamit.
