id: 2CH.9.5
reference: 2 Chronicles 9:5
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/תֹּ֨אמֶר֙ אֶל הַ/מֶּ֔לֶךְ אֱמֶת֙ הַ/דָּבָ֔ר אֲשֶׁ֥ר שָׁמַ֖עְתִּי בְּ/אַרְצִ֑/י עַל דְּבָרֶ֖י/ךָ וְ/עַל חָכְמָתֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/005.yaml
  text: Then she said to the king[a], “The report that I heard in my own land about your words and your wisdom was true.”
translation:
  language: tl
  text: Pagkatapos ay sinabi niya sa hari, “Totoo ang balitang narinig ko sa sarili kong lupain tungkol sa iyong mga sinabi[a] at sa iyong karunungan.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga gawain” o “mga usapin.” Malawak ang kahulugan ng salitang Hebreo at maaari itong tumukoy sa mga salita o sa mga bagay na may kinalaman sa hari.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Pagkatapos ay sinabi niya
  rationale: Ipinahahayag ng wayyiqtol ang kasunod na pangyayari sa salaysay. Likas sa modernong Tagalog ang “Pagkatapos ay sinabi niya” at malinaw nitong napapanatili ang pagkakasunod-sunod.
- source_word: אֶל־הַמֶּלֶךְ
  choice: sa hari
  rationale: Tuwirang ipinakikita ng pariralang may אֶל ang taong kinakausap.
- source_word: אֱמֶת הַדָּבָר
  choice: Totoo ang balita
  rationale: Idyomatikong pinagtitibay ng Hebreo na totoo ang narinig na ulat. Mas natural sa konteksto ang “balita” kaysa sa literal na “salita” o “bagay.”
- source_word: אֲשֶׁר שָׁמַעְתִּי
  choice: na narinig ko
  rationale: Natural at tuwirang salin ng sugnay na panuring.
- source_word: בְּאַרְצִי
  choice: sa sarili kong lupain
  rationale: Pinananatili ng “kong” ang unang panauhang hulapi, at binibigyang-diin ng “sarili” ang personal na pagtukoy nang hindi binabago ang diwa.
- source_word: עַל־דְּבָרֶיךָ
  choice: tungkol sa iyong mga sinabi
  rationale: Maaaring tumukoy ang דְּבָרֶיךָ sa mga salita, usapin, gawain, o mga bagay na may kinalaman sa hari. Ang “mga sinabi” ang pinakamalapit at natural na pangunahing salin; inilalahad sa talababa ang mas malawak na posibilidad.
- source_word: וְעַל־חָכְמָתֶךָ
  choice: at sa iyong karunungan
  rationale: Tuwirang salin na nagpapanatili sa pangunahing tema ng talata.
