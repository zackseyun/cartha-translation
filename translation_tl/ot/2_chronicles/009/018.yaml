base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/018.yaml
  text: There were six steps to the throne[a], and a gold footstool attached to the throne, and armrests on this side and on that beside the seat, and two lions standing beside the armrests.
translation:
  language: tl
  text: May anim na baitang patungo sa trono at isang gintong tuntungan[a] na nakakabit sa trono. May mga patungan ng braso sa magkabilang tabi ng upuan, at may dalawang leon na nakatayo sa tabi ng mga patungan ng braso.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O maaaring: “isang gintong rampa o hagdanang nakakabit sa trono.” Maaaring unawain sa iba’t ibang paraan ang salitang Hebreo na כבשׁ, bagaman ang “tuntungan” ay angkop sa konteksto ng trono.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַעֲלוֹת
  choice: mga baitang paakyat
  rationale: Sa paglalarawan ng trono, tumutukoy ito sa anim na baitang na inaakyatan patungo sa trono. Likas at malinaw sa modernong Filipino ang “mga baitang paakyat.”
- source_word: כֶבֶשׁ
  choice: tuntungan
  rationale: Maaaring mangahulugan ang salita ng rampa o hagdanan, ngunit sa konteksto ng maharlikang upuan ay angkop ang suportang tuntungan sa harap ng trono. Pinananatili sa talababa ang tunay na leksikal na posibilidad.
- source_word: מָאֳחָזִים
  choice: nakakabit
  rationale: Ang pasibong anyo ay nagpapahiwatig na ang gintong tuntungan ay ikinabit o ipinirmi sa trono. Karaniwan at malinaw ang “nakakabit.”
- source_word: יָדוֹת
  choice: mga patungan ng braso
  rationale: Literal itong “mga kamay,” ngunit sa konteksto ng muwebles ay tumutukoy sa mga bahagi sa magkabilang tabi kung saan ipinapatong ang mga braso.
- source_word: מִזֶּה וּמִזֶּה
  choice: sa magkabilang tabi
  rationale: Ipinahahayag nito ang magkatapat na pagkakalagay sa isang tabi at sa kabila; natural at maikli ang salin.
- source_word: מְקוֹם הַשָּׁבֶת
  choice: ng upuan
  rationale: Literal na tumutukoy sa lugar ng pag-upo. Sa konteksto ng ayos ng trono, malinaw na inilalagay nito ang mga patungan ng braso sa magkabilang tabi ng upuan.
- source_word: אֲרָיוֹת
  choice: mga leon
  rationale: Tuwirang salin ng pangmaramihang anyo. Hindi idinagdag sa teksto na mga rebulto ang mga ito sapagkat hindi iyon tahasang sinasabi ng Hebreo.
- source_word: עֹמְדִים
  choice: nakatayo
  rationale: Tuwirang inilalarawan ng participle ang posisyon ng mga leon.
- source_word: אֵצֶל
  choice: sa tabi ng
  rationale: Nagpapahiwatig ito ng malapit na pagkakalagay at natural sa Filipino ang “sa tabi ng.”
