  register: Modernong Filipino na malinaw, marangal, at madaling maunawaan. Ginamit ang “trono,” “baitang,” at “patungan ng braso” upang mapanatili ang tiyak na paglalarawan sa estruktura nang hindi nagiging labis na teknikal.
