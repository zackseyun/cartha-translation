reference: 2 Chronicles 9:8
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: יְהִ֨י יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ בָּר֔וּךְ אֲשֶׁ֣ר חָפֵ֣ץ בְּ/ךָ֗ לְ/תִתְּ/ךָ֤ עַל כִּסְא/וֹ֙ לְ/מֶ֔לֶךְ לַ/יהוָ֖ה אֱלֹהֶ֑י/ךָ בְּ/אַהֲבַ֨ת אֱלֹהֶ֤י/ךָ אֶת יִשְׂרָאֵל֙ לְ/הַעֲמִיד֣/וֹ לְ/עוֹלָ֔ם וַ/יִּתֶּנְ/ךָ֤ עֲלֵי/הֶם֙ לְ/מֶ֔לֶךְ לַ/עֲשׂ֖וֹת מִשְׁפָּ֥ט וּ/צְדָקָֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/008.yaml
  text: Blessed be Yahweh your God[a], who delighted in you and set you on his throne as king for Yahweh your God. Because your God loved Israel, to establish them forever[c][b], he made you king over them to administer justice and righteousness.
translation:
  language: tl
  text: Pagpalain nawa si Yahweh na iyong Diyos,[a] na nalugod sa iyo at nagluklok sa iyo sa kanyang trono bilang hari para kay Yahweh na iyong Diyos. Dahil sa pag-ibig ng iyong Diyos sa Israel—upang itatag ito magpakailanman[b]—ginawa ka niyang hari sa ibabaw nila upang pairalin ang katarungan at katuwiran.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Purihin si Yahweh na iyong Diyos.”
    reason: lexical_alternative
  - marker: b
    text: Ang panghalip sa Hebreo ay isahan at tumutukoy sa Israel bilang isang sambayanan. Maaari ring isalin, “upang panatilihin silang matatag magpakailanman.”
    reason: lexical_alternative
  - marker: c
    text: 'Maaari ring unawain ang daloy: “Dahil mahal ng iyong Diyos ang Israel, ginawa ka niyang hari sa ibabaw nila upang itatag niya ito magpakailanman.”'
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: יְהִי ... בָּרוּךְ
  choice: Purihin
  rationale: Likas at marangal na pormula sa modernong Tagalog para sa pagbabasbas o pagpupuri sa Diyos; inilalahad sa talababa ang mas literal na anyong may 'pagpalain.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos na nasa tekstong Hebreo.
- source_word: חָפֵץ בְּךָ
  choice: nalugod sa iyo
  rationale: Ipinahahayag ang kasiyahan at pagtatangi nang natural sa Tagalog.
- source_word: לְתִתְּךָ עַל כִּסְאוֹ
  choice: nagluklok sa iyo sa kanyang trono
  rationale: Ang 'nagluklok' ay angkop sa konteksto ng paghirang bilang hari at pinananatili ng 'kanyang trono' ang mahalagang pagtukoy sa trono ng Diyos.
- source_word: לְמֶלֶךְ לַיהוָה אֱלֹהֶיךָ
  choice: bilang hari para kay Yahweh na iyong Diyos
  rationale: 'Pinananatili ang ugnayang ipinahihiwatig ng ל: ang hari ay namumuno para sa Diyos, nang hindi dinaragdagan ang kahulugan.'
- source_word: בְּאַהֲבַת אֱלֹהֶיךָ אֶת יִשְׂרָאֵל
  choice: Dahil sa pag-ibig ng iyong Diyos sa Israel
  rationale: Malinaw na ipinapahayag ang sanhi habang nananatiling malapit sa nominal na anyo ng Hebreo.
- source_word: לְהַעֲמִידוֹ לְעוֹלָם
  choice: upang itatag ito magpakailanman
  rationale: Pinananatili ang layuning ipinahahayag ng infinitive at ang anyong isahan ng hulapi, na tumutukoy sa Israel bilang isang sambayanan.
- source_word: וַיִּתֶּנְךָ עֲלֵיהֶם לְמֶלֶךְ
  choice: ginawa ka niyang hari sa kanila
  rationale: Natural na Tagalog para sa paghirang o paglalagay sa isang tao bilang hari sa isang bayan.
- source_word: לַעֲשׂוֹת מִשְׁפָּט וּצְדָקָה
  choice: upang pairalin ang katarungan at katuwiran
  rationale: Ang 'pairalin' ay natural sa tungkuling maharlika at pinananatiling magkahiwalay ang dalawang magkaugnay na konsepto.
theological_decisions:
- issue: Ang 'kanyang trono' at ang paghahari ni Solomon
  choice: Pinanatili ang 'kanyang trono,' na ang pinakamalapit na tinutukoy ay ang trono ni Yahweh.
  alternative: Unawain lamang ito bilang trono ng dinastiya o sariling trono ni Solomon.
  rationale: Inilalarawan ng Cronista ang hari bilang namumuno sa ilalim ng awtoridad ng Diyos; hindi dapat pahinain o palawakin ang pahayag.
- issue: Ang ugnayan ng לְהַעֲמִידוֹ לְעוֹלָם sa pag-ibig ng Diyos at sa paghirang sa hari
  choice: Pinanatili bilang hiwalay na pariralang layunin sa pagitan ng mga gitling.
  alternative: Isalin bilang 'at nais niyang itatag ito' o tahasang iugnay lamang sa paghirang kay Solomon.
  rationale: Ang Hebreo ay maaaring basahing kaugnay ng pag-ibig ng Diyos sa Israel o ng pagkakahirang sa hari. Iniiwasang magdagdag ng pandiwang 'nais' at pinananatili ang tensiyon sa sintaks.
- issue: מִשְׁפָּט וּצְדָקָה bilang pormulang maharlika
  choice: katarungan at katuwiran
  alternative: katarungan at pagiging makatarungan
  rationale: Pinananatili ang dalawang magkaibang pangngalan at ang tradisyonal na teolohikal at etikal na bigat ng צְדָקָה.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang 'Yahweh' para sa banal na pangalan; iniwasan ang sobrang arkaikong pananalita. Ang mga gitling ay tumutulong na mapanatili ang bahagyang sintaktikong kalabuan ng pariralang layunin nang hindi nagiging magulo ang pangungusap.
