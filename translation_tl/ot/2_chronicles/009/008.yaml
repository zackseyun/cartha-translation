    issue: “Purihin si Yahweh” ang pangunahing salin ng benedictory formula.
    rationale: 'Ang “Purihin” ay imperative na tumutukoy sa papuri, samantalang ang יְהִי ... בָּרוּךְ ay jussive/passive na pagbabasbas: “Pagpalain nawa.” Hindi sapat na ilagay lamang ang tumpak na anyo sa talababa.'
  - severity: medium
    issue: “ginawa ka niyang hari sa kanila” ay hindi sapat na malinaw para sa עֲלֵיהֶם.
    rationale: Maaaring ipahiwatig ng “sa kanila” ang pagiging kabilang o nasa gitna ng mga tao. Ang “sa ibabaw nila” ay malinaw na naghahayag na siya ay hinirang na hari over them.
  - severity: low
    issue: Hindi maayos ang inilahad na alternatibong daloy sa talababa c.
    rationale: Ang “Dahil mahal ... at upang itatag niya ...” ay hindi magkatimbang na koordinasyon sa Filipino. Maaaring ihayag ang alternatibong pagkakaugnay ng layunin nang hindi binabago ang kahulugan.
