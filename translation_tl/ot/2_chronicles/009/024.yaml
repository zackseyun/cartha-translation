translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang ayos ng talaan at ang taunang, nakagawiang kilos, habang iniwasan ang matatandang salitang “especia” at ang sobrang tiyak na pagpapakahulugan sa mga aromatikong sangkap.
