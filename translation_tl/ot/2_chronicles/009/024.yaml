base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/024.yaml
  text: 'And they were bringing[a], each man his tribute: articles of silver and articles of gold, garments, weapons, spices, horses, and mules[c][b], year by year.'
translation:
  language: tl
  text: 'At bawat isa ay nagdadala ng kanyang handog[a]: mga bagay na yari sa pilak, mga bagay na yari sa ginto, mga kasuotan[b], mga sandata[c], mga aromatikong sangkap, mga kabayo, at mga mula—taon-taon.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “kaloob” o “tributo.” Ang salitang Hebreo ay malawak na tumutukoy sa isang handog o regalong inihaharap; sa konteksto ng hari, maaaring may diwa itong tributo.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “mga balabal” o “mga damit.”
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “mga kagamitang pandigma” o “baluti.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מְבִיאִים
  choice: nagdadala
  rationale: Ang pandiwaring Hebreo ay nagpapahiwatig ng nakagawian o paulit-ulit na gawain; ang pangkasalukuyang anyo kasama ng “taon-taon” ay likas na naghahatid ng diwang ito sa Tagalog.
- source_word: אִישׁ מִנְחָתוֹ
  choice: bawat isa sa kanila ... ng kanyang handog
  rationale: Ginamit nang distributibo ang אִישׁ. Malawak ang saklaw ng מִנְחָה bilang handog o kaloob; pinananatili ng “handog” ang lawak nito, samantalang ipinapaliwanag sa talababa ang posibleng diwang tributo sa kontekstong maharlika.
- source_word: כְּלֵי כֶסֶף וּכְלֵי זָהָב
  choice: mga bagay na yari sa pilak at ginto
  rationale: Malawak ang kahulugan ng כְּלִי at maaaring tumukoy sa sari-saring bagay, sisidlan, o kagamitan. Hindi nililimitahan ng “mga bagay” ang tiyak na uri ng mga ito.
- source_word: וּשְׂלָמוֹת
  choice: mga kasuotan
  rationale: Tumutukoy ang bihirang salitang ito sa mga kasuotan, marahil ay mamahaling panlabas na damit. Ang “mga kasuotan” ay malawak at hindi labis na tiyak.
- source_word: נֵשֶׁק
  choice: mga sandata
  rationale: Ang salita ay maaaring tumukoy sa mga sandata o kagamitang pandigma; malinaw at karaniwan sa makabagong Tagalog ang “mga sandata.”
- source_word: וּבְשָׂמִים
  choice: mga sangkap na mabango
  rationale: Tumutukoy ito sa mahahalagang aromatikong sangkap o espesya. Iniiwasan ng salin ang pagpapakahulugang para lamang sa pagluluto o para lamang sa pabango.
- source_word: סוּסִים וּפְרָדִים
  choice: mga kabayo, at mga mola
  rationale: Mga tuwirang katumbas na pangalan ng mga hayop sa makabagong Tagalog.
- source_word: דְּבַר שָׁנָה בְּשָׁנָה
  choice: taon-taon
  rationale: Ipinapahayag ng idyomang Hebreo ang regular na pag-uulit bawat taon; likas at maikli ang “taon-taon” sa Tagalog.
