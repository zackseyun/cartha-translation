  yaml_path: translation/ot/2_chronicles/009/013.yaml
  text: The weight of the gold that came to Solomon in one year was six hundred sixty-six talents of gold,[a]
translation:
  language: tl
  text: Ang bigat ng gintong dumating kay Solomon sa loob ng isang taon ay anim na raan at animnapu't anim na talento ng ginto.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O, “gintong dinala kay Solomon.” Literal sa Hebreo: “gintong dumating kay Solomon”; hindi tinutukoy kung sino ang nagdala.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: ay
  rationale: Ipinagpapatuloy ng anyong Hebreo ang salaysay at ipinakikilala ang pahayag. Sa natural na Tagalog, sapat ang panandang panaguri na “ay”; hindi kailangang magdagdag ng tahasang “ngayon” na wala naman sa pinagmulan.
- source_word: מִשְׁקַל הַזָּהָב
  choice: ang bigat ng gintong
  rationale: Tiyak na bigat ang tinutukoy ng מִשְׁקַל, hindi lamang dami o halaga. Natural sa Tagalog ang “bigat ng gintong” bago ang sugnay na naglalarawan dito.
- source_word: אֲשֶׁר בָּא
  choice: dumating
  rationale: Pinananatili nito ang literal at di-tiyak-sa-tagaganap na diwa ng Hebreo. Hindi tahasang sinasabi ng teksto kung sino ang nagdala.
- source_word: לִשְׁלֹמֹה
  choice: kay Solomon
  rationale: Ipinahihiwatig ng ל ang direksiyon o tumanggap; “kay Solomon” ang karaniwang natural na anyo sa Tagalog.
- source_word: בְּשָׁנָה אֶחָת
  choice: sa loob ng isang taon
  rationale: Malinaw nitong ipinapahayag na ang kabuuang bigat ay natanggap sa saklaw ng isang taon.
- source_word: שֵׁשׁ מֵאוֹת וְשִׁשִּׁים וָשֵׁשׁ
  choice: animnaraan at animnapu't anim
  rationale: Tuwirang salin ng eksaktong bilang na 666 sa likas at dignidad na modernong Tagalog.
- source_word: כִּכְּרֵי זָהָב
  choice: talentong ginto
  rationale: Ang כִּכָּר ay malaking yunit ng timbang na nakaugaliang tawaging “talento” sa mga salin ng Bibliya; hindi ito ipinapalit sa makabagong sukat dahil hindi tiyak at hindi pare-pareho ang eksaktong katumbas.
theological_decisions:
- issue: Posibleng simbolikong kahulugan ng bilang na 666
  choice: Inilahad ang bilang bilang tuwirang makasaysayang sukat ng ginto nang walang simbolikong pahiwatig.
  alternative: Bigyang-diin ang posibleng kaugnayan nito sa mga sumunod na simbolikong paggamit ng 666 sa Bibliya.
  rationale: Sa talatang ito, taunang bigat ng ginto ang tahasang tinutukoy, at walang ibinigay na simbolikong paliwanag ang tekstong Hebreo. Hindi dapat magpasok ang salin ng kahulugang hindi sinasabi ng talata.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, natural, at marangal. Pinanatili ang tradisyonal na yunit na “talento,” at iniwasan ang labis na pagpapaliwanag sa pangunahing teksto. Ang hulma na “Ang bigat ... ay” ay pormal ngunit madaling maunawaan.
