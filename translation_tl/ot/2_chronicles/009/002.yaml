  yaml_path: translation/ot/2_chronicles/009/002.yaml
  text: And Solomon answered all her questions[b][a]; nothing was hidden from Solomon that he did not explain to her.
translation:
  language: tl
  text: At sinagot ni Solomon ang lahat ng tanong niya[a]; walang anumang nalingid kay Solomon na hindi niya ipinaliwanag sa kanya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sinabi ni Solomon sa kanya ang lahat ng usapin niya”; mas literal sa Hebreo, “lahat ng kanyang mga salita.”
    reason: lexical_alternative
  - marker: b
    text: O “walang usaping nalingid kay Solomon na hindi niya sinabi sa kanya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגֶּד לָהּ שְׁלֹמֹה
  choice: sinagot ni Solomon
  rationale: Ang נגד ay literal na “sinabi/ipinaalam,” ngunit sa konteksto ng reyna na sumusubok kay Solomon sa mahihirap na tanong, natural na ipinahihiwatig nito ang pagsagot.
- source_word: אֶת כָּל דְּבָרֶיהָ
  choice: ang lahat ng tanong niya
  rationale: Ang דָּבָר ay maaaring “salita,” “bagay,” o “usapin.” Dito, tumutukoy ito sa mga usaping iniharap ng reyna bilang mga tanong.
- source_word: נֶעְלַם דָּבָר מִשְּׁלֹמֹה
  choice: walang anumang nalingid kay Solomon
  rationale: Pinananatili ng “nalingid” ang larawang may isang bagay na hindi nalalaman o nakatago mula kay Solomon; natural sa Tagalog ang “nalingid kay.”
- source_word: אֲשֶׁר לֹא הִגִּיד לָהּ
  choice: na hindi niya ipinaliwanag sa kanya
  rationale: Inuulit ng Hebreo ang pandiwang נגד. Sa konteksto ng mahihirap na tanong, malinaw at likas ang “ipinaliwanag,” habang inilalagay sa talababa ang mas literal na “sinabi.”
theological_decisions: []
translation_notes:
  register: Makabagong Filipino na malinaw at marangal. Ginamit ang “nalingid” bilang dignidad na salitang madaling maunawaan sa konteksto; pinanatili sa mga talababa ang mas literal na mga posibilidad ng dalawang paglitaw ng נגד at ng malawak na kahulugan ng דָּבָר.
