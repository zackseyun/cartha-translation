source:
  edition: WLC
  text: וּ/מַֽלְכַּת שְׁבָ֗א שָֽׁמְעָה֮ אֶת שֵׁ֣מַע שְׁלֹמֹה֒ וַ/תָּב֣וֹא לְ/נַסּוֹת֩ אֶת שְׁלֹמֹ֨ה בְ/חִיד֜וֹת בִּ/ירֽוּשָׁלִַ֗ם בְּ/חַ֣יִל כָּבֵ֣ד מְאֹ֡ד וּ֠/גְמַלִּים נֹשְׂאִ֨ים בְּשָׂמִ֧ים וְ/זָהָ֛ב לָ/רֹ֖ב וְ/אֶ֣בֶן יְקָרָ֑ה וַ/תָּבוֹא֙ אֶל שְׁלֹמֹ֔ה וַ/תְּדַבֵּ֣ר עִמּ֔/וֹ אֵ֛ת כָּל אֲשֶׁ֥ר הָיָ֖ה עִם לְבָבָֽ/הּ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/001.yaml
  text: The queen of Sheba heard of Solomon’s fame[a], and she came to Jerusalem to test Solomon with riddles, with a very great retinue and camels carrying spices, gold in abundance, and precious stones. When she came to Solomon[c][b], she spoke with him about all that was in her heart.
translation:
  language: tl
  text: Narinig ng reyna ng Sheba ang balita tungkol kay Solomon[a], at pumunta siya sa Jerusalem upang subukin si Solomon sa pamamagitan ng mga palaisipan[b]. May kasama siyang napakalaking pangkat ng mga kasama at mga kamelyong may dalang mga pabango, napakaraming ginto, at mahahalagang bato. Nang makarating siya kay Solomon, nakipag-usap siya sa kaniya tungkol sa lahat ng nasa puso niya[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang katanyagan ni Solomon.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “sa pamamagitan ng mahihirap na tanong” o “mga bugtong.”
    reason: lexical_alternative
  - marker: c
    text: Ang “lahat ng nasa puso niya” ay idyomang tumutukoy sa kabuuan ng kaniyang mga iniisip, tanong, at alalahanin.
    reason: cultural_note
lexical_decisions:
- source_word: שֵׁמַע
  choice: balita tungkol kay Solomon
  rationale: Ang שֵׁמַע ay tumutukoy sa kumalat na balita o reputasyon tungkol kay Solomon. Mas natural sa modernong Tagalog ang “narinig ... ang balita tungkol kay Solomon” kaysa sa literal ngunit alanganing “narinig ang katanyagan.”
- source_word: לְנַסּוֹת
  choice: upang subukin
  rationale: Ipinahihiwatig ng נסה na susubukin ng reyna ang karunungan o kakayahan ni Solomon; malinaw at dignified ang “subukin.”
- source_word: בְחִידוֹת
  choice: sa pamamagitan ng mga palaisipan
  rationale: Ang חִידוֹת ay mga bugtong, palaisipan, o mahihirap na tanong. Pinananatili ng “mga palaisipan” ang enigmatikong katangian ng salita nang hindi ito nililimitahan sa karaniwang bugtong na may tugma.
- source_word: בִּירוּשָׁלִַם
  choice: sa Jerusalem
  rationale: Kasunod ng pandiwang may galaw na “pumunta,” natural na ipinahahayag ng “sa Jerusalem” ang destinasyon sa Tagalog.
- source_word: בְּחַיִל כָּבֵד מְאֹד
  choice: may kasama siyang napakalaking pangkat
  rationale: Malawak ang saklaw ng חַיִל—maaari itong tumukoy sa lakas, hukbo, kayamanan, o pangkat. Sa konteksto ng paglalakbay na may mga kamelyo at mahahalagang dala, pinakamalamang na isang malaki at kahanga-hangang kasamang pangkat ang tinutukoy.
- source_word: בְּשָׂמִים
  choice: mga sangkap na mabango
  rationale: Tumutukoy ang plural sa mababangong sangkap, rekado, o aromatikong produkto. Naiiwasan ng “mga sangkap na mabango” ang posibleng makitid na pagkaunawa sa “mga pampalasa” bilang panimpla lamang.
- source_word: לָרֹב
  choice: napakaraming
  rationale: Ipinahahayag nito ang labis na dami ng ginto sa natural at malinaw na Tagalog.
- source_word: אֶבֶן יְקָרָה
  choice: mahahalagang bato
  rationale: Bagaman singular ang anyo sa Hebreo, kolektibo ang gamit nito sa talaan ng mga mamahaling bagay.
- source_word: וַתְּדַבֵּר עִמּוֹ
  choice: sinabi niya rito
  rationale: Natural sa Tagalog ang “sinabi niya rito” para sa pakikipag-usap niya kay Solomon. Ang “rito” ay malinaw na tumutukoy kay Solomon at hindi sa isang lugar.
- source_word: אֵת כָּל אֲשֶׁר הָיָה עִם לְבָבָהּ
  choice: ang lahat ng nasa puso niya
  rationale: Pinananatili nito ang larawang Hebreo tungkol sa puso, habang mauunawaan sa Tagalog bilang kabuuan ng kaniyang mga iniisip, tanong, at alalahanin.
