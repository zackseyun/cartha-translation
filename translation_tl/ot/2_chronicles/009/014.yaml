translation_notes:
  register: Makabagong Filipino na malinaw at marangal. Ginawang hiwalay na pangungusap ang elliptical na pambungad upang maging natural sa Tagalog habang pinananatili ang kaibhan ng aspektong ‘dinala’ at ‘nagdadala.’
