- from: Bukod pa rito ang dinala ng mga mangangalakal at mga negosyante. Ang lahat ng hari ng Arabia at ang mga gobernador ng lupain ay nagdadala rin ng ginto at pilak kay Solomon.
  to: Bukod pa sa mga dinala ng mga mangangalakal at mga negosyante, ang lahat ng hari ng Arabia at ang mga gobernador ng lupain ay nagdadala ng ginto at pilak kay Solomon.
  rationale: Inayos ang sintaksis upang ang «bukod pa sa» ay wastong mamahala sa mga dinala ng mga mangangalakal at negosyante. Inalis ang «rin» dahil ang dagdag na diwa ay naipapahayag na ng «Bukod pa sa» at wala itong hiwalay na katumbas sa Hebreo. Pinanatili ang iba pang kahulugan at ang di-tiyak na saklaw ng «lupain».
