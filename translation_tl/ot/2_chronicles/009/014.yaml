  yaml_path: translation/ot/2_chronicles/009/014.yaml
  text: Besides what the traders and merchants brought, all the kings of Arabia and the governors of the land were bringing gold and silver to Solomon.
translation:
  language: tl
  text: Bukod pa sa mga dinala ng mga mangangalakal at mga negosyante, ang lahat ng hari ng Arabia at ang mga gobernador ng lupain ay nagdadala ng ginto at pilak kay Solomon.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַנְשֵׁי הַתָּרִים
  choice: mga mangangalakal
  rationale: Ang parirala ay literal na tumutukoy sa ‘mga taong naglalakbay’ ngunit sa konteksto ay mga naglalakbay upang mangalakal.
- source_word: הַסֹּחֲרִים
  choice: mga negosyante
  rationale: Pinananatiling hiwalay sa unang katawagan ang pangkat ng mga nakikipagkalakalan, nang hindi nagpapahiwatig ng higit na tiyak na uri ng negosyo.
- source_word: מַלְכֵי עֲרַב
  choice: mga hari ng Arabia
  rationale: Ang עֲרַב ay maaaring unawain bilang Arabia o kaugnay na mga Arabo; pinili ang heograpikong anyo na akma sa paralel na salaysay at sa tradisyonal na pagkilala sa pangalan.
- source_word: פַחוֹת הָאָרֶץ
  choice: mga gobernador ng lupain
  rationale: Ang פַחוֹת ay mga opisyal o gobernador; ang ‘lupain’ ay nagpapanatili sa di-tiyak na saklaw ng הָאָרֶץ.
- source_word: מְבִיאִים
  choice: nagdadala
  rationale: Ang participle ay natural na nagpapahayag ng patuloy o nakaugaliang pagdadala sa ikalawang sugnay.
