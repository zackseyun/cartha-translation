base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/006.yaml
  text: But I did not believe their words until I came and my own eyes saw it[a]; and behold, not even half of the greatness of your wisdom had been told to me[b]. You have surpassed the report that I heard.
translation:
  language: tl
  text: Ngunit hindi ako naniwala sa kanilang sinabi hanggang sa dumating ako at nakita ko ito sa sarili kong mga mata. At talaga ngang hindi man lamang naisalaysay sa akin ang kalahati ng lawak ng iyong karunungan. Nahigitan mo ang balitang narinig ko.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֶאֱמַנְתִּי
  choice: naniwala
  rationale: Sa kontekstong ito, ang Hiphil ng אמן ay tumutukoy sa pagkilalang totoo o kapani-paniwala ang isang ulat; mas angkop ang “naniwala” kaysa “nagtiwala.”
- source_word: לְדִבְרֵיהֶם
  choice: sa kanilang sinabi
  rationale: Likas sa makabagong Filipino ang pariralang ito at malinaw na tumutukoy sa mga salitang iniulat sa reyna.
- source_word: וַתִּרְאֶינָה עֵינַי
  choice: nakita iyon ng sarili kong mga mata
  rationale: Pinananatili nito ang idiomatikong diin ng Hebreo sa personal at tuwirang pagkakita.
- source_word: וְהִנֵּה
  choice: At talaga ngang
  rationale: Ipinahahayag nito ang pagkagulat at matinding pagpapatunay na dala ng הִנֵּה nang hindi gumagamit ng lipas o di-likas na pananalita.
- source_word: מַרְבִּית חָכְמָתֶךָ
  choice: lawak ng iyong karunungan
  rationale: Ang מַרְבִּית ay maaaring magpahiwatig ng kasaganaan, kalakhan, o kadakilaan. Ang “lawak” ay natural sa Filipino at mahusay na nagpapahayag ng di-masukat na saklaw ng karunungan.
- source_word: הֻגַּד לִי
  choice: naisalaysay sa akin
  rationale: Isinasalamin nito ang pasibong anyo ng pandiwa at ang ideya ng pagpapabatid o pag-uulat.
- source_word: יָסַפְתָּ עַל
  choice: Nahigitan mo
  rationale: Sa konstruksiyong ito, ipinahihiwatig ng יסף על ang paglagpas sa naunang ulat, hindi lamang ang literal na pagdaragdag.
- source_word: הַשְּׁמוּעָה
  choice: balitang narinig ko
  rationale: Ang שְׁמוּעָה ay isang balita o ulat na narinig. Ang “balita” ay neutral at natural, at hindi nagdadala ng negatibong pahiwatig ng “tsismis.”
