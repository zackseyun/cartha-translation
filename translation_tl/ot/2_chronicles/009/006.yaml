  verdict: revise
  source_fidelity: 'Tumpak sa kabuuan ang diwa ng Hebreo: hindi naniwala ang reyna sa mga sinabi, dumating siya, personal niyang nakita, at nalaman niyang hindi man lamang naikuwento sa kanya ang kalahati ng lawak/dakila ng karunungan ni Solomon. Ang huling paghahambing na lumalagpas ang katotohanan sa naunang ulat ay napanatili.'
  naturalness: 'May isang maliit ngunit mahalagang pag-aayos sa idiom: ang “nakita iyon ng sarili kong mga mata” ay nauunawaan ngunit hindi pinakanatural sa modernong Filipino. Mas malinaw at idiomatiko ang “nakita ko ito sa sarili kong mga mata.”'
  terminology: Ang “karunungan,” “naisalaysay,” at “balita” ay angkop sa marangal ngunit makabagong rehistro. Ang “lawak ng iyong karunungan” ay isang katanggap-tanggap na pagsasalin ng מַרְבִּית חָכְמָתֶךָ. Walang kinakailangang talababa sa saling Filipino; ang mga talababa sa English audit trail ay hindi ligtas na maililipat dahil hindi tugma ang nakasaad na anchor at ang lexical alternative.
  issues:
