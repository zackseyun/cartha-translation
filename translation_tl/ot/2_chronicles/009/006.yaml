    issue: Di-gaanong natural ang konstruksiyong “nakita iyon ng sarili kong mga mata.”
    rationale: 'Bagaman ipinahihiwatig nito ang Hebreong idiom na “nakita ng aking mga mata,” mas likas sa Filipino na gawing paksa ang nagsasalita: “nakita ko ito sa sarili kong mga mata.” Napananatili nito ang emphatic firsthand verification.'
