base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/011.yaml
  text: And the king made from the algum wood stairways for the house of Yahweh and for the king’s house[a], and lyres and harps for the singers[b]. Nothing like them had been seen before in the land of Judah.
translation:
  language: tl
  text: Gumawa ang hari mula sa kahoy na algum[b] ng mga daanan[a] para sa bahay ni Yahweh at sa bahay ng hari, gayundin ng mga lira at alpa para sa mga mang-aawit. Wala pang nakitang tulad ng mga iyon noon sa lupain ng Juda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “mga hagdanan.” Maaaring tumukoy ang salitang Hebreo sa mga itinayong daanang papasok o sa mga hagdanan.
    reason: lexical_alternative
  - marker: b
    text: 'Hebreo: “algum.” Sa katumbas na salaysay sa 1 Hari 10:12, “almug” ang anyo ng pangalan. Hindi tiyak ang eksaktong uri ng kahoy.'
    reason: cross_reference
lexical_decisions:
- source_word: עֲצֵי הָאַלְגּוּמִּים
  choice: kahoy na algum
  rationale: Bihira ang terminong ito at hindi tiyak ang uri ng punong tinutukoy. Pinanatili ang anyong ‘algum’ sa Mga Cronica sa halip na magbigay ng haka-hakang pangalan ng uri ng kahoy.
- source_word: מְסִלּוֹת
  choice: mga daanan
  rationale: Karaniwan itong tumutukoy sa isang itinayong o nakaangat na daan. Sa kontekstong panggusali, maaaring mga hagdanan o mga daanang papasok ang tinutukoy; ang ‘mga daanan’ ay hindi labis na nagtatakda sa anyo nito.
- source_word: לְבֵית יְהוָה וּלְבֵית הַמֶּלֶךְ
  choice: para sa bahay ni Yahweh at sa bahay ng hari
  rationale: Pinananatili ang tuwirang kahulugan at magkatulad na anyo ng dalawang pagbanggit sa בַּיִת, sa halip na gawing ‘templo’ at ‘palasyo.’
- source_word: כִנֹּרוֹת וּנְבָלִים
  choice: mga lira at alpa
  rationale: Dalawang magkaibang instrumentong de-kuwerdas ang tinutukoy. Ang ‘lira’ at ‘alpa’ ay malinaw na makabagong katumbas, bagaman hindi ganap na tiyak ang eksaktong anyo ng mga sinaunang instrumento.
- source_word: לַשָּׁרִים
  choice: para sa mga mang-aawit
  rationale: Ang anyong nagmula sa שׁיר ay tuwirang tumutukoy sa mga umaawit, hindi lamang sa mga musikero sa pangkalahatan.
- source_word: וְלֹא נִרְאוּ כָהֵם לְפָנִים
  choice: Wala pang nakitang tulad ng mga iyon noon
  rationale: Likas na Filipino ito na nagpapanatili sa diwang hindi pa dating nakita ang gayong mga bagay, nang hindi nagdaragdag ng paliwanag tungkol sa kalidad ng mga ito.
- source_word: בְּאֶרֶץ יְהוּדָה
  choice: sa lupain ng Juda
  rationale: Pinananatili ang tahasang salitang ‘lupain’ at ang pormal na heograpikong pagtukoy sa Juda.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Pangngalang pantangi ang יְהוָה sa talata. Ang ‘Yahweh’ ay tuwirang transliterasyon na nagpapanatili rito bilang banal na pangalan sa halip na palitan ng titulo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘bahay’ upang mapanatili ang pag-uulit sa Hebreo, at ‘gayundin’ upang maging natural ang ugnayan ng dalawang uri ng bagay na ginawa ng hari.
