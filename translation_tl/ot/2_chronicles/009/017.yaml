translation_notes:
  register: Modernong Filipino na natural at marangal. Ginamit ang “maringal” upang mapanatili ang saklaw ng גָּדוֹל sa laki at kadakilaan, at nilinaw sa talababa ang likas na ambiguwidad ng pariralang Hebreo tungkol sa garing.
