translation:
  language: tl
  text: Gumawa ang hari ng isang malaking tronong garing at binalutan niya ito ng dalisay na ginto.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “trono ng ngipin”; ang parirala ay tumutukoy sa isang tronong garing.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Gumawa
  rationale: Karaniwang kahulugan ng עשה sa salaysay; natural at tuwirang Filipino nang hindi nagdaragdag ng diwa.
- source_word: הַמֶּלֶךְ
  choice: ang hari
  rationale: Pinananatili ang tiyak na titulong ginamit sa Hebreo sa halip na palitan ito ng pangalang Solomon.
- source_word: כִּסֵּא
  choice: trono
  rationale: Sa konteksto ng hari, tumutukoy ang salita sa maharlikang upuan, kaya mas angkop ang “trono” kaysa “upuan.”
- source_word: שֵׁן
  choice: yari sa garing
  rationale: Literal na “ngipin” ang שֵׁן, ngunit sa konstruksiyong ito ay tumutukoy ito sa garing bilang materyal o palamuti ng trono. Ang “yari sa garing” ay malinaw sa modernong Filipino, bagaman maaaring tumukoy ang Hebreo sa isang tronong ginamitan o pinalamutian ng garing.
- source_word: גָּדוֹל
  choice: maringal
  rationale: Maaaring mangahulugang malaki o dakila ang גָּדוֹל. Sa paglalarawan sa trono, ipinahahayag ng “maringal” ang kahanga-hangang laki at karangyaan nang mas natural kaysa “malaking trono.”
- source_word: וַיְצַפֵּהוּ
  choice: binalutan niya ito
  rationale: Ang piel ng צפה ay nangangahulugang balutan o sapinan ng isang materyal; malinaw at likas ang pariralang ito sa Filipino.
- source_word: זָהָב טָהוֹר
  choice: dalisay na ginto
  rationale: Tuwirang ipinapahayag ang mataas na kadalisayan ng gintong ginamit; dignified at karaniwang kolokasyon sa tekstong biblikal.
