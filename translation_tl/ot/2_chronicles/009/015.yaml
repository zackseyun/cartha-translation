  text: King Solomon made two hundred large shields of beaten gold[a]; six hundred shekels of beaten gold went onto each shield.
translation:
  language: tl
  text: Gumawa si Haring Solomon ng dalawang daang malalaking kalasag mula sa pinukpok na ginto; animnaraan[a] ng pinukpok na ginto ang ginamit sa bawat kalasag.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “animnaraan ng pinukpok na ginto ang napunta sa isang kalasag.” Ipinahihiwatig ng Hebreo ang isang yunit ng timbang, ngunit hindi nito tahasang binabanggit kung anong yunit iyon.
    reason: Pinananatili ang kakulangan ng tahasang yunit sa tekstong Hebreo at iniiwasang ipasok sa pangunahing teksto ang “shekel” bilang tiyak na yunit.
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Gumawa
  rationale: Karaniwang kahulugan ng עשה ang “gumawa,” at natural ito sa salaysay tungkol sa mga kagamitang ipinagawa ni Solomon.
- source_word: הַמֶּלֶךְ שְׁלֹמֹה
  choice: si Haring Solomon
  rationale: Natural sa modernong Tagalog ang pamagat na sinusundan ng pangalan.
- source_word: מָאתַיִם צִנָּה
  choice: dalawang daang malalaking kalasag
  rationale: Ang צִנָּה ay karaniwang tumutukoy sa malaking kalasag na panangga sa katawan, kaya pinananatili ang pagkakaiba nito sa mas maliit na uri ng kalasag.
- source_word: זָהָב שָׁחוּט
  choice: pinukpok na ginto
  rationale: Inilalarawan ng שָׁחוּט ang gintong pinukpok o pinalapad upang magamit bilang sapin; malinaw at likas sa Tagalog ang “pinukpok na ginto.”
- source_word: שֵׁשׁ מֵאוֹת
  choice: animnaraan
  rationale: Tuwirang salin ng bilang; hindi isinisingit sa pangunahing teksto ang di-binanggit na yunit ng timbang.
- source_word: יַעֲלֶה עַל
  choice: ang ginamit sa
  rationale: Ang literal na larawan ay ang dami ng gintong “umakyat/napunta sa” kalasag. Ang “ginamit sa” ay likas sa Tagalog at hindi nagpapalagay na buong tinakpan nito ang kalasag.
- source_word: הַצִּנָּה הָאֶחָת
  choice: bawat kalasag
  rationale: Ang literal na “isang kalasag” ay ginagamit dito nang distributibo, kaya natural na katumbas ang “bawat kalasag.”
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “malalaking kalasag” upang ipakita ang uri ng צִנָּה, at “ginamit sa” upang maipahayag nang natural ang idiomang Hebreo nang hindi labis na tinutukoy ang paraan ng pagkakagawa.
