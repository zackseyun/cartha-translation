  text: And Solomon reigned in Jerusalem over all Israel forty years.
translation:
  language: tl
  text: Naghari si Solomon sa Jerusalem bilang hari ng buong Israel nang apatnapung taon.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּמְלֹךְ
  choice: Naghari
  rationale: Ang waw-consecutive imperfect ng מלך ay nagsasalaysay ng nakaraang paghahari. Ang “naghari” ang likas at tiyak na salin sa Filipino para sa pamamahala bilang hari.
- source_word: שְׁלֹמֹה
  choice: Solomon
  rationale: Ginamit ang nakaugaliang anyo ng pangalang ito sa mga saling Bibliya sa Filipino.
- source_word: בִירוּשָׁלִַם
  choice: sa Jerusalem
  rationale: Ang pang-ukol na ב ay tumutukoy sa lugar; natural itong isalin na “sa Jerusalem.”
- source_word: עַל כָּל יִשְׂרָאֵל
  choice: sa buong Israel
  rationale: Kasama ng מלך, ang עַל ay nagpapahayag ng saklaw ng paghahari. Pinananatili ng “buong Israel” ang kolektibo at pambansang diwa ng Hebreo.
- source_word: אַרְבָּעִים שָׁנָה
  choice: nang apatnapung taon
  rationale: Isinalin ang panahong tinagal sa natural na Filipino, gamit ang “nang” upang ipakilala ang haba ng paghahari.
