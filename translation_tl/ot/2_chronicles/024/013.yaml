base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/013.yaml
  text: So the workmen labored[a], and the repair work progressed by their hand[b]; they restored the house of God to its proper condition and strengthened it.
translation:
  language: tl
  text: Nagtrabaho ang mga manggagawa, at sumulong ang pagkukumpuni sa pamamagitan ng kanilang mga kamay.[a] Ibinalik nila ang bahay ng Diyos sa nararapat na kaayusan nito[b] at pinatatag iyon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “at sa kanilang mga kamay ay sumulong ang pagpapanumbalik ng gawain.” Ang salitang Hebreo ay maaari ring mangahulugang “paggaling” o “pagpapanumbalik,” at dito ay ginagamit para sa pagkukumpuni ng gusali.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin, “sa itinakdang ayos nito” o “sa dati nitong anyo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ עֹשֵׂי הַמְּלָאכָה
  choice: masikap na nagtrabaho ang mga manggagawa
  rationale: Ang literal na pag-uulit na “gumawa ang mga gumagawa ng gawain” ay hindi likas sa Tagalog. Ipinahahayag ng salin ang aktibong pagtupad ng mga manggagawa sa kanilang gawain.
- source_word: וַתַּעַל אֲרוּכָה לַמְּלָאכָה
  choice: umunlad ang pagkukumpuni
  rationale: Ang אֲרוּכָה ay maaaring tumukoy sa paggaling, pagpapanumbalik, o pagkukumpuni; sa konteksto ng gusali, “pagkukumpuni” ang kongkretong diwa. Ang עלה ay nagpapahiwatig dito ng pagsulong.
- source_word: בְּיָדָם
  choice: sa pamamagitan nila
  rationale: Idyoma ito ng ahensiya o kasangkapan. Natural sa modernong Tagalog ang “sa pamamagitan nila,” bagaman hindi nito pinananatili ang literal na larawan ng kamay.
- source_word: וַיַּעֲמִידוּ
  choice: ibinalik
  rationale: Bagaman literal na “pinatayo” o “pinanatiling nakatayo,” sa konteksto ng pagkukumpuni ay nangangahulugan itong muling pagsasaayos o pagpapanumbalik ng gusali.
- source_word: בֵּית הָאֱלֹהִים
  choice: bahay ng Diyos
  rationale: Pinananatili ang literal at pamilyar na katawagan sa Hebreo sa halip na gawing tahasang “templo ng Diyos.”
- source_word: עַל מַתְכֻּנְתּוֹ
  choice: sa wastong kalagayan nito
  rationale: Ang מַתְכֻּנֶת ay maaaring tumukoy sa itinakdang ayos, wastong anyo, sukat, o dating kalagayan. Ang “wastong kalagayan” ay malinaw ngunit hindi labis na nagpapasiya sa eksaktong kahulugan.
- source_word: וַיְאַמְּצֻהוּ
  choice: pinatatag iyon
  rationale: Ang Piel ng אמץ ay nangangahulugang gawing matibay o palakasin; ang “pinatatag” ay natural sa konteksto ng isang gusali.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “bahay ng Diyos” upang mapanatili ang anyo ng pinagmulang Hebreo, at “pagkukumpuni” upang maging kongkreto ang larawang angkop sa konteksto. Ang mga talababa ay nagpapanatili sa leksikal na lawak at tunay na kalabuan ng אֲרוּכָה at מַתְכֻּנְתּוֹ.
