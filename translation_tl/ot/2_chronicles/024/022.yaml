base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/022.yaml
  text: But King Joash did not remember the kindness that Jehoiada his father had shown him[a], and he killed his son. As he was dying, he said[c][b], “May Yahweh see and require it.”
translation:
  language: tl
  text: Ngunit hindi inalala ni Haring Joas ang kagandahang-loob na ipinakita sa kanya ni Joiada, na kanyang ama[a], at pinatay niya ang anak ni Joiada. Nang naghihingalo na ang anak ni Joiada, sinabi niya, “Nawa’y makita ito ni Yahweh at papanagutin niya.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “kanyang ama” ay malamang na tumutukoy sa makaamang papel ni Joiada kay Joas, hindi sa pagiging biyolohikal na ama niya. Ang “kagandahang-loob” ay maaari ring isaling “katapatan” o “tapat na pagmamahal.”
    reason: cultural_note_and_lexical_alternative
  - marker: b
    text: 'Sa literal: “Nawa’y makita ni Yahweh at hanapin o singilin.” Sa ganitong konteksto, ang pandiwa ay maaaring mangahulugang siyasatin ang kasalanan at hingin ang pananagutan; hindi tahasang tinutukoy sa Hebreo kung sino o ano ang pananagutin.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֶסֶד
  choice: ang kagandahang-loob
  rationale: Likas at marangal na katumbas ng חֶסֶד sa ugnayang pantao rito; ipinahihiwatig nito ang mabuting pakikitungo at katapatan nang hindi nililimitahan ang salita sa isang teknikal na diwang tipan.
- source_word: זָכַר
  choice: hindi inalala
  rationale: Pinananatili ang payak na diwa ng pag-alaala, habang natural na nagpapahiwatig sa konteksto ng kabiguang tumanaw ng utang na loob.
- source_word: אָבִיו
  choice: kanyang ama
  rationale: Pinananatili ang mismong katawagan ng Hebreo at ang posibleng diwang makaama o marangal, sa halip na ipakahulugan agad bilang biyolohikal na ama.
- source_word: וַיַּהֲרֹג אֶת־בְּנוֹ
  choice: at pinatay niya ang anak nito
  rationale: Tuwiran at natural; nililinaw ng “nito” na ang pinatay ay anak ni Joiada, hindi anak ni Joas.
- source_word: וּכְמוֹתוֹ
  choice: Habang naghihingalo siya
  rationale: Ipinapahayag ang temporal na diwa ng כְּמוֹתוֹ bilang mga huling sandali bago mamatay.
- source_word: יֵרֶא יְהוָה
  choice: Nawa'y makita ito ni Yahweh
  rationale: Ang “nawa'y” ay naghahatid ng jussive na panawagan o kahilingan, hindi lamang payak na pahayag tungkol sa hinaharap.
- source_word: וְיִדְרֹשׁ
  choice: at papanagutin niya ang may sala
  rationale: Inihahatid ang hudisyal na diwa ng דרש—pagsisiyasat at paghingi ng pananagutan—sa malinaw na modernong Tagalog. Ang “ang may sala” ay ipinahihiwatig ng konteksto ngunit hindi tahasang nasa Hebreo, kaya tinatandaan sa talababa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasatitik ang personal na pangalang banal sa halip na palitan ito ng titulong “PANGINOON.”
theological_decisions:
- issue: Ang diwa ng huling panawagan ni Zacarias
  choice: Isang panawagan kay Yahweh na makita ang kawalang-katarungan at papanagutin ang may sala
  alternative: Isang tahasang kahilingan para sa paghihiganti, o isang simpleng pahayag na nakikita ito ni Yahweh
  rationale: Ang mga anyong jussive at ang hudisyal na gamit ng דרש ay sumusuporta sa isang taimtim na panawagan para sa banal na pagtutuos, nang hindi ito pinakikitid sa paghihiganti lamang.
- issue: Ang katawagang “ama” para kay Joiada
  choice: Panatilihin ang “kanyang ama” at ipaliwanag ang posibleng makaamang papel sa talababa
  alternative: Isalin bilang “tagapag-aruga” o “tagapagtanggol”
  rationale: Pinananatili nito ang tunay na pananalita at ambiguwidad ng Hebreo, yamang maaaring marangal o makaama ang gamit sa halip na biyolohikal.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “Joas” at “Joiada,” mga anyong karaniwan sa tradisyong Tagalog. Iniwasan ang sobrang teknikal na pananalita, habang pinanatili sa talababa ang leksikal at kultural na ambiguwidad.
