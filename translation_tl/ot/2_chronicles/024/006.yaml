base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/006.yaml
  text: Then the king called Jehoiada the chief and said to him, “Why have you not required the Levites to bring from Judah and from Jerusalem the tax of Moses the servant of the LORD and of the assembly of Israel for the tent of the testimony?”
translation:
  language: tl
  text: Pagkatapos, ipinatawag ng hari si Jehoiada, ang pinuno, at sinabi sa kaniya, “Bakit hindi mo inatasan ang mga Levita na dalhin mula sa Juda at mula sa Jerusalem ang ambag ni Moises, na lingkod ni Yahweh, at ng kapulungan ng Israel para sa tolda ng patotoo?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָרֹאשׁ
  choice: ang pinuno
  rationale: Pinananatili ang pangkalahatang kahulugan ng Hebreong ‘ulo/pinuno’ nang hindi dinaragdagan ng tiyak na katungkulang hindi hayag sa talata.
- source_word: דָרַשְׁתָּ עַל הַלְוִיִּם
  choice: inatasan ang mga Levita
  rationale: Sa konstruksyong ito, ipinahihiwatig ng pandiwa ang paghingi o pag-aatas sa mga Levita na kumilos; natural sa Filipino ang ‘inatasan.’
- source_word: מַשְׂאַת
  choice: ang ambag na itinakda
  rationale: Ang salita ay tumutukoy rito sa ipinapataw o itinakdang ambag, hindi kinakailangang regular na buwis. Nililinaw ng ‘itinakda’ ang kaugnayan nito kay Moises at sa kapulungan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin ang personal na pangalan ng Diyos bilang ‘Yahweh,’ sa halip na palitan ito ng titulong ‘PANGINOON.’
- source_word: אֹהֶל הָעֵדוּת
  choice: tolda ng patotoo
  rationale: Malapit na katumbas ng parirala sa Hebreo at pinananatili ang terminolohiyang kultiko nito.
theological_decisions:
- issue: Ugnayan ng ambag kina Moises at sa kapulungan ng Israel
  choice: “ang ambag na itinakda ni Moises ... at ng kapulungan ng Israel”
  alternative: “ang buwis ni Moises ... at ng kapulungan ng Israel”
  rationale: Pinananatili ang parehong Moises at kapulungan bilang kaugnay ng ambag, gaya ng Hebreo, nang hindi ginagawang karaniwang buwis o nilulutas nang labis ang eksaktong uri ng kanilang kaugnayan.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang ‘Levita,’ ‘kapulungan,’ at ‘tolda ng patotoo’ upang mapanatili ang tekstuwal at panrelihiyong kulay ng orihinal.
