  to: Pagkatapos, ipinatawag ng hari si Jehoiada, ang pinuno, at sinabi sa kaniya, “Bakit hindi mo inatasan ang mga Levita na dalhin mula sa Juda at mula sa Jerusalem ang ambag ni Moises, na lingkod ni Yahweh, at ng kapulungan ng Israel para sa tolda ng patotoo?”
