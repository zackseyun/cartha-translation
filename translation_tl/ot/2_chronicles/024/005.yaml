  text: וַ/יִּקְבֹּץ֮ אֶת הַ/כֹּהֲנִ֣ים וְ/הַ/לְוִיִּם֒ וַ/יֹּ֣אמֶר לָ/הֶ֡ם צְא֣וּ לְ/עָרֵ֪י יְהוּדָ֟ה וְ/קִבְצוּ֩ מִ/כָּל יִשְׂרָאֵ֨ל כֶּ֜סֶף לְ/חַזֵּ֣ק אֶת בֵּ֣ית אֱלֹֽהֵי/כֶ֗ם מִ/דֵּ֤י שָׁנָה֙ בְּ/שָׁנָ֔ה וְ/אַתֶּ֖ם תְּמַהֲר֣וּ לַ/דָּבָ֑ר וְ/לֹ֥א מִֽהֲר֖וּ הַֽ/לְוִיִּֽם־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/005.yaml
  text: So he gathered the priests and the Levites and said to them[a], “Go out to the cities of Judah and collect silver from all Israel to repair the house of your God year by year[b], and you must act quickly in this matter.” But the Levites did not act quickly.
translation:
  language: tl
  text: Kaya tinipon niya ang mga pari at mga Levita at sinabi sa kanila, “Pumunta kayo sa mga lungsod ng Juda at mangolekta kayo ng pilak[a] mula sa buong Israel upang kumpunihin[b] ang bahay ng inyong Diyos taon-taon. Magmadali kayo sa bagay na ito.” Ngunit hindi nagmadali ang mga Levita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pera.” Ang literal na salita sa Hebreo ay “pilak,” na ginagamit din bilang tawag sa salaping kinokolekta.
    reason: lexical_alternative
  - marker: b
    text: O “patatagin” o “isaayos.” Literal na “palakasin”; sa kontekstong ito, tumutukoy ito sa pagkukumpuni ng gusali ng templo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְבֹּץ
  choice: tinipon niya
  rationale: Ang Qal wayyiqtol ng קבץ ay tumutukoy sa pagtitipon ng mga tao. Likas sa Tagalog ang “tinipon” para sa mga pari at mga Levita.
- source_word: הַכֹּהֲנִים וְהַלְוִיִּם
  choice: ang mga pari at mga Levita
  rationale: Tahasan nitong pinananatili ang dalawang magkaibang pangkat na naglilingkod sa templo.
- source_word: צְאוּ לְעָרֵי יְהוּדָה
  choice: Pumunta kayo sa mga lungsod ng Juda
  rationale: Ipinahahayag ng צְאוּ ang pag-alis o paglabas patungo sa isang lugar; mas natural sa kasalukuyang Tagalog ang “pumunta kayo” sa kontekstong ito.
- source_word: וְקִבְצוּ ... כֶּסֶף
  choice: at mangolekta kayo ng pilak
  rationale: Kapag salapi ang layon, malinaw at natural ang “mangolekta.” Pinananatili ng “pilak” ang kongkretong salita ng Hebreo, bagaman maaari itong tumukoy sa pera.
- source_word: מִכָּל יִשְׂרָאֵל
  choice: mula sa buong Israel
  rationale: Pinananatili nito ang malawak na pagtukoy ng teksto sa Israel at hindi ito nililimitahan sa Juda lamang.
- source_word: לְחַזֵּק
  choice: upang kumpunihin
  rationale: Bagaman literal na “palakasin,” sa konteksto ng isang gusali ang pandiwa ay tumutukoy sa pagkukumpuni o pagpapanumbalik ng katatagan nito.
- source_word: בֵּית אֱלֹהֵיכֶם
  choice: ang bahay ng inyong Diyos
  rationale: Pinananatili ang pormal na larawang “bahay” sa Hebreo sa halip na ipalit agad ang interpretatibong “templo.”
- source_word: מִדֵּי שָׁנָה בְּשָׁנָה
  choice: taon-taon
  rationale: Natural at malinaw na Filipino para sa regular na pag-uulit bawat taon.
- source_word: וְאַתֶּם תְּמַהֲרוּ לַדָּבָר
  choice: Madaliin ninyo ang gawaing ito
  rationale: Pinananatili ang diin at agarang utos ng מהר sa maikli at natural na pananalita.
- source_word: וְלֹא מִהֲרוּ הַלְוִיִּם
  choice: Ngunit hindi ito minadali ng mga Levita
  rationale: Inuulit ang salitang “minadali” upang mapanatili ang sadyang pag-uugnay sa naunang utos, gaya ng pag-uulit ng מהר sa Hebreo.
theological_decisions:
- issue: Saklaw ng “buong Israel”
  choice: mula sa buong Israel
  alternative: mula sa lahat ng Israelita; mula sa buong Juda
  rationale: Ang Hebreo ay tahasang nagsasabing Israel. Pinananatili ito upang huwag paliitin ang historikal at teolohikal na saklaw ng pahayag sa Juda lamang.
- issue: Paglalarawan sa templo bilang bahay ng Diyos
  choice: ang bahay ng inyong Diyos
  alternative: ang templo ng inyong Diyos
  rationale: Ang “bahay” ang mismong metapora ng Hebreo at pinananatili nito ang anyo ng orihinal nang hindi ikinukubli na templo ang tinutukoy.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mga Levita” bilang karaniwang katawagan sa pangkat, “bahay ng inyong Diyos” upang mapanatili ang larawang Hebreo, at magkatugmang “madaliin/minadali” upang maipakita ang pag-uulit at paghahambing sa orihinal.
