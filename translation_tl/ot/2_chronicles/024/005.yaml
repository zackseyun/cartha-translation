  source_fidelity: 'Tumpak ang pangunahing nilalaman: tinipon ang mga pari at Levita, inutusang pumunta sa mga lungsod ng Juda, mangalap ng pilak mula sa buong Israel para kumpunihin ang bahay ng kanilang Diyos taun-taon. Napananatili rin ang pagkakaiba ng mga pari at mga Levita, ang ''bahay'' ng Diyos, at ang saklaw na ''buong Israel.'' Gayunman, ang huling pangungusap na ''hindi ito minadali ng mga Levita'' ay bahagyang inililihis ang Hebreong pandiwang walang tuwirang layon (''hindi nagmadali ang mga Levita'').'
  naturalness: Malinaw at makabagong Filipino ang karamihan ng salin. Mas tuwiran at mas natural ang 'Magmadali kayo sa bagay na ito' at 'hindi nagmadali ang mga Levita,' at mas mahusay nitong pinananatili ang sadyang pag-uulit ng pandiwang מהר sa Hebreo.
  terminology: Ang 'mga pari,' 'mga Levita,' 'pilak,' at 'bahay ng inyong Diyos' ay angkop at tapat sa termino ng pinagmulan. Ang mga talababa ay tumpak at ang mga panandang [a] at [b] ay wastong nakalagay.
