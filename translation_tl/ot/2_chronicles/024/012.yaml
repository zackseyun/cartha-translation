base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/012.yaml
  text: And the king and Jehoiada gave it to those doing the work of the service of the house of Yahweh[a], and they hired stonecutters and craftsmen to restore the house of Yahweh[c][b], and also craftsmen in iron and bronze to strengthen the house of Yahweh.
translation:
  language: tl
  text: Ibinigay iyon[a] ng hari at ni Jehoiada sa mga gumagawa ng gawaing paglilingkod sa bahay ni Yahweh[b]. Umupa sila ng mga tagatabas ng bato at mga bihasang manggagawa upang isaayos muli ang bahay ni Yahweh, at ng mga bihasang manggagawa sa bakal at bronse[c] upang patibayin ang bahay ni Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ipinagkatiwala iyon” o “iniabot iyon.” Sa konteksto, ang “iyon” ay tumutukoy sa nakolektang salapi.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “bahay ni Yahweh”; ibig sabihin, ang templo.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “mga panday ng bakal at bronse.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנֵהוּ
  choice: Ibinigay iyon
  rationale: Pinananatili ang panghalip na panlalaking isahan sa Hebreo; batay sa konteksto, tumutukoy ito sa nakolektang salapi nang hindi iyon tahasang ipinapasok sa pangunahing teksto.
- source_word: אֶל עוֹשֵׂה מְלֶאכֶת עֲבוֹדַת בֵּית יְהוָה
  choice: sa mga nagsasagawa ng gawain sa paglilingkod sa bahay ni Yahweh
  rationale: Inililipat ang patung-patong na anyo ng pariralang Hebreo sa malinaw ngunit pormal na Filipino, nang hindi idinaragdag ang di-tahasang ideya ng pangangasiwa.
- source_word: בֵּית יְהוָה
  choice: bahay ni Yahweh
  rationale: Malapit ito sa literal na Hebreong 'bahay ni Yahweh' at pinananatili ang paulit-ulit na katawagan sa talata.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tinutumbasan ang Tetragrammaton bilang personal na pangalang Yahweh sa halip na palitan ito ng isang titulo.
- source_word: וַיִּהְיוּ שֹׂכְרִים
  choice: Umupa sila
  rationale: Likas na Filipino ito para sa konstruksiyong hayah at participle, na naglalarawan sa pagkuha nila ng mga manggagawa.
- source_word: חֹצְבִים
  choice: mga tagatabas ng bato
  rationale: Sa konteksto ng pagkukumpuni ng gusali, malinaw na tumutukoy ito sa mga manggagawang nagtatabas ng bato.
- source_word: חָרָשִׁים
  choice: mga bihasang manggagawa
  rationale: Malawak ang saklaw ng salitang Hebreo at hindi kailangang limitahan sa mga karpintero lamang.
- source_word: לְחַדֵּשׁ
  choice: upang isaayos muli
  rationale: Ipinahihiwatig ng Piel na gawing bago muli o ibalik sa maayos na kalagayan; natural sa Filipino ang 'isaayos muli' sa kontekstong ito.
- source_word: וְגַם לְחָרָשֵׁי בַרְזֶל וּנְחֹשֶׁת
  choice: pati ng mga manggagawang bihasa sa bakal at bronse
  rationale: Ipinakikita nitong mga dalubhasang manggagawa sa metal ang tinutukoy, nang hindi labis na nililimitahan ang kanilang tiyak na hanapbuhay.
- source_word: נְחֹשֶׁת
  choice: bronse
  rationale: Ang bronse ang karaniwang kahulugan sa mga konteksto ng materyales sa gusali at templo, bagaman maaaring tumukoy ang salita sa tanso sa ibang konteksto.
- source_word: לְחַזֵּק
  choice: upang patibayin
  rationale: Direktang inililipat ang diwang gawing matibay o palakasin ang estruktura.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo. Pinananatili ng 'Yahweh' ang pangalan sa halip na palitan ito ng titulong 'PANGINOON'.
translation_notes:
  register: Makabago at marangal na Filipino, na may malinaw na bokabularyo para sa karaniwang mambabasa. Pinanatili ang pormal na katawagang “bahay ni Yahweh” at ang bahagyang patung-patong na diwa ng parirala tungkol sa paglilingkod, ngunit inayos ang sintaks upang maging natural sa Tagalog.
