base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/016.yaml
  text: And they buried him in the city of David among the kings[a], because he had done good in Israel[b], and toward God and his house.
translation:
  language: tl
  text: At inilibing nila siya sa Lunsod ni David, kasama ng mga hari[a], sapagkat gumawa siya ng mabuti sa Israel[b], para sa Diyos at sa kanyang bahay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “sa piling ng mga hari.”
    reason: lexical_alternative
  - marker: b
    text: Maaaring tumukoy ang “kanyang bahay” sa bahay ng Diyos, ang templo; maaari rin itong unawain bilang sambahayan ni Jehoiada.
    reason: referential_ambiguity
lexical_decisions:
- source_word: וַיִּקְבְּרֻהוּ
  choice: At inilibing nila siya
  rationale: Aktibong pandiwang maramihan ang anyong Hebreo, na may layong panlalaking isahan. Pinananatili ng salin ang di-tiyak na gumaganap na “nila.”
- source_word: בְעִיר דָּוִיד
  choice: sa Lunsod ni David
  rationale: Pinananatili ang nakaugaliang anyo ng pangalan ng lugar; ginamit ang malaking titik sa “Lunsod” bilang bahagi ng katawagan.
- source_word: עִם הַמְּלָכִים
  choice: kasama ng mga hari
  rationale: Ang עִם ay pangunahing nangangahulugang “kasama.” Sa konteksto ng paglilibing, malinaw itong tumutukoy sa marangal na pagkalibing sa kinaroroonan o kapiling ng mga hari.
- source_word: כִּי
  choice: sapagkat
  rationale: Nagbibigay ang pangatnig ng dahilan kung bakit siya binigyan ng marangal na libing. Ang “sapagkat” ay malinaw at marangal sa makabagong Filipino.
- source_word: עָשָׂה טוֹבָה
  choice: gumawa siya ng mabuti
  rationale: Ipinahahayag ng parirala ang paggawa ng mabuti o kapaki-pakinabang na mga bagay; tuwiran at natural ang salin.
- source_word: בְּיִשְׂרָאֵל
  choice: sa Israel
  rationale: 'Pinananatili ang pangunahing diwang lokatibo o saklaw ng pang-ukol: sa loob ng Israel at sa buhay ng bayan.'
- source_word: וְעִם הָאֱלֹהִים
  choice: para sa Diyos
  rationale: Bagaman literal na “kasama ng Diyos,” ipinahihiwatig dito ang kabutihang iniukol sa Diyos. Iniiwasan ng “para sa” ang di-likas o mapanlinlang na pahiwatig ng simpleng pakikisama.
- source_word: וּבֵיתוֹ
  choice: at sa kanyang bahay
  rationale: Pinananatili ang panghalip na nasa Hebreo. Ang pinakamalapit na tinutukoy nito ay ang Diyos, kaya ang “kanyang bahay” ay ang templo; nililinaw ito sa talababa nang hindi pinapalitan ang panghalip sa pangunahing teksto.
theological_decisions:
- issue: Ang tinutukoy ng “kanyang bahay”
  choice: Ang bahay ng Diyos, ang templo
  alternative: Ang sariling sambahayan ni Jehoiada
  rationale: Ang Diyos ang pinakamalapit na antecedent, at nakasentro ang mas malawak na salaysay sa paglilingkod ni Jehoiada kaugnay ng templo. Gayunman, pinanatili sa pangunahing teksto ang panghalip ng Hebreo at inilagay ang paglilinaw sa talababa.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang payak at madaling maunawaang ayos, habang pinananatili ang aktibong anyo ng Hebreo, ang pormal na pangalan ng lugar, at ang panghalip sa “kanyang bahay.”
