  text: וַ/יֹּ֣אמֶר הַ/מֶּ֔לֶךְ וַֽ/יַּעֲשׂ֖וּ אֲר֣וֹן אֶחָ֑ד וַֽ/יִּתְּנֻ֛/הוּ בְּ/שַׁ֥עַר בֵּית יְהוָ֖ה חֽוּצָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/008.yaml
  text: Then the king commanded[a], and they made one chest and placed it outside at the gate of the house of Yahweh.
translation:
  language: tl
  text: Nag-utos ang hari, at gumawa sila ng isang kaban[a] at inilagay iyon sa labas, sa pintuang-daan ng bahay ni Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “isang kahon.” Maaaring binibigyang-diin ng Hebreo ang iisang itinalagang sisidlan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Nag-utos
  rationale: Ang payak na kahulugan ay “sinabi,” ngunit sa kontekstong administratibo at sa agarang pagsunod ng mga gumagawa, ang pananalita ng hari ay may bisa ng isang utos.
- source_word: הַמֶּלֶךְ
  choice: ang hari
  rationale: Tuwirang salin ng tiyak na pariralang pangngalan.
- source_word: וַיַּעֲשׂוּ
  choice: gumawa sila
  rationale: Pinananatili ang pangmaramihang ngunit hindi tinukoy na gumaganap sa Hebreo.
- source_word: אֲרוֹן אֶחָד
  choice: isang kaban
  rationale: Ang אֲרוֹן ay isang sisidlan o kaban. Pinananatili ng “isang” ang tahasang אֶחָד, na malamang na nagtatampok sa iisang itinalagang sisidlan para sa koleksiyon.
- source_word: וַיִּתְּנֻהוּ
  choice: inilagay iyon
  rationale: Sa kontekstong ito, ang נתן ay tumutukoy sa paglalagay o pagpuwesto ng pisikal na bagay.
- source_word: בְּשַׁעַר
  choice: sa pintuang-daan
  rationale: Likas na nagpapahayag sa Filipino ng lokasyon sa may pasukan, nang hindi labis na nililinaw kung eksaktong nasa loob o katabi ng tarangkahan.
- source_word: בֵּית יְהוָה
  choice: bahay ni Yahweh
  rationale: Malapit sa larawang “bahay” ng Hebreo at malinaw na tumutukoy sa santuwaryo sa konteksto.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin ang personal na pangalang tipan ayon sa anyong Yahweh, sa halip na palitan ito ng isang titulo.
- source_word: חוּצָה
  choice: sa labas
  rationale: Tuwirang ipinapahayag na ang kaban ay inilagay sa panlabas na bahagi.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehovah
  rationale: Personal na pangalan ang tahasang nasa tekstong Hebreo; pinananatili itong pangalan at hindi ginagawang titulong “PANGINOON.”
- issue: Kahulugan ng “bahay ni Yahweh”
  choice: bahay ni Yahweh
  alternative: templo ni Yahweh
  rationale: Pinananatili ng “bahay” ang mismong talinghaga ng בֵּית habang nauunawaan pa rin sa konteksto na templo ang tinutukoy.
translation_notes:
  register: Makabagong, malinaw, at marangal na Filipino. Ginamit ang “kaban” para sa isang matibay na sisidlan at hindi ang “arka,” na maaaring mapagkamalang Kaban ng Tipan. Inayos ang lokatibong parirala bilang “sa labas, sa pintuang-daan” upang maging natural habang pinananatili ang ugnayan ng חוּצָה sa kinalalagyan ng sisidlan.
