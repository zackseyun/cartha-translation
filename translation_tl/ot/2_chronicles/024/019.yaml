base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/019.yaml
  text: Yet he sent prophets among them to bring them back to Yahweh[a], and they testified against them, but they would not listen.
translation:
  language: tl
  text: Gayunman, nagsugo siya ng mga propeta sa gitna nila upang pabalikin sila kay Yahweh. Nagbigay ang mga ito ng patotoo laban sa kanila[a], ngunit hindi sila nakinig.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “binalaan sila.” Maaaring tumukoy ang pandiwang Hebreo sa taimtim na pagbababala, ngunit sa kontekstong ito ay may diwa rin ito ng pagpapatotoo laban sa kanila.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: nagsugo siya
  rationale: Karaniwang salin ng שלח sa salaysay; malinaw at likas sa modernong Tagalog.
- source_word: בָּהֶם
  choice: sa gitna nila
  rationale: Sa pagkakaugnay nito sa pagsusugo ng mga tao, ipinahihiwatig ng ב ang pagpasok ng mga propeta sa kanilang kalipunan, hindi lamang ang pagpapadala ng mensahe sa kanila.
- source_word: נְבִאִים
  choice: mga propeta
  rationale: Tuwiran at kinikilalang katumbas ng נביאים.
- source_word: לַהֲשִׁיבָם
  choice: upang ibalik sila
  rationale: 'Pinananatili ang causative na diwa ng Hiphil ng שוב: ang layunin ay maibalik ang mga tao sa kanilang Diyos.'
- source_word: אֶל יְהוָה
  choice: kay Yahweh
  rationale: Ginagamit ang personal na pang-ukol na “kay” at pinananatili ang banal na pangalang יהוה bilang Yahweh.
- source_word: וַיָּעִידוּ בָם
  choice: Nagpatotoo ang mga ito laban sa kanila
  rationale: Pinananatili ang pormal at halos panghukuman na diwa ng Hiphil ng עוד kasama ng ב, habang tinutukoy nang malinaw na ang mga propeta ang gumagawa ng kilos.
- source_word: וְלֹא הֶאֱזִינוּ
  choice: ngunit ayaw nilang makinig
  rationale: Ipinahahayag ng אזן ang masusing pakikinig; sa konteksto ng patuloy na pagsuway, ang “ayaw” ay likas na nagpapakita ng sadyang pagtanggi.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: ang PANGINOON; Jehova
  rationale: Pinananatili ang natatanging personal na pangalan ng Diyos sa Hebreo nang hindi ito pinapalitan ng isang titulo.
- issue: Diwa ng gawaing propetiko sa וַיָּעִידוּ בָם
  choice: Nagpatotoo ang mga ito laban sa kanila
  alternative: Binalaan sila ng mga ito
  rationale: Ang konteksto ay isang taimtim na pagsaway sa kataksilan ng bayan. Pinananatili ng “nagpatotoo laban” ang posibleng panghukuman o tipanang bigat ng Hebreo, habang inilalahad sa talababa ang diwang “nagbabala.”
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “Gayunman” para sa salungat na daloy, at hinati sa dalawang pangungusap para sa likas na pagbasa nang hindi binabago ang ugnayan ng mga sugnay.
