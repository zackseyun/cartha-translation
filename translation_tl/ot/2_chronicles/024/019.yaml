  source_fidelity: Tumpak na naisasalin ang pagsusugo ng mga propeta, ang layuning pabalikin ang bayan kay Yahweh, at ang patotoong laban sa kanila. Gayunman, ang “ayaw nilang makinig” ay nasa kasalukuyang aspekto at mas malinaw na nagdaragdag ng patuloy na/sinasadyang pagtanggi kaysa sa tuwirang nakalipas na salaysay ng Hebreo. Ang “hindi sila nakinig” ay mas malapit sa וְלֹא הֶאֱזִינוּ, nang hindi inaalis ang kontekstuwal na diin ng pagsuway.
  naturalness: Ang “Nagpatotoo ang mga ito laban sa kanila” ay nauunawaan ngunit bahagyang di-likas sa modernong Tagalog. Ang “Nagbigay ang mga ito ng patotoo laban sa kanila” ay mas idiomatiko at pinananatili ang pormal/panghukom na himig.
  terminology: Wasto at pare-pareho ang “mga propeta” at “Yahweh.” Ang “pabalikin sila kay Yahweh” ay mas hayag na causative at mas natural kaysa “ibalik sila kay Yahweh.”
