  source_fidelity: Ang “Ang tungkol sa kanyang mga anak” ay nagdaragdag ng paksang panandang wala sa Hebreo. Mas tapat na simulan ang talaan sa “Ang kanyang mga anak.” Napananatili ng “maraming kapahayagan laban sa kanya” ang isang posibleng pagbasa ng mahirap na מַשָּׂא, habang ang talababa ay wastong nagpapakita ng iba pang posibilidad. Ang “pagkakatatag ng bahay ng Diyos” ay ligtas na salin ng וִיסוֹד nang hindi idinaragdag ang ideyang “muling” pagtatayo.
  naturalness: Marangal at malinaw ang kabuuang rehistro. Ang pag-alis ng “Ang tungkol sa” ay nagpapasimple at nagpapalapit sa sintaks ng talaan. Ang “naghari kapalit niya” ay mas tuwiran at likas na Filipino para sa pormula ng paghalili.
  terminology: Ang “bahay ng Diyos,” “Midrash,” at pangalang “Amasias” ay angkop at magkakatugma sa pormal na rehistro. Ang “kapahayagan” ay katanggap-tanggap para sa pangunahing pagbasa, dahil malinaw na itinatala ng talababa ang leksikal na kawalang-katiyakan.
  issues:
