base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/027.yaml
  text: His sons[a], the many oracles against him, and the founding of the house of God—behold, they are written in the Midrash of the Book of the Kings[b]. And Amaziah his son reigned in his place.
translation:
  language: tl
  text: Ang kanyang mga anak, ang maraming kapahayagan laban sa kanya[a], at ang pagkakatatag ng bahay ng Diyos—narito, nakasulat ang mga iyon sa Midrash ng Aklat ng mga Hari[b]. At ang anak niyang si Amasias ay naghari kapalit niya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mahirap tiyakin ang kahulugan ng pariralang Hebreo. Maaari rin itong isalin na “ang bigat ng pasaning nakaatang sa kanya,” “ang napakaraming pahayag laban sa kanya,” o maging “ang mabigat na tributong ipinataw sa kanya.” Ang salitang מַשָּׂא ay maaaring mangahulugang “pasanin,” “kapahayagan,” o, sa ilang konteksto, isang ipinataw na dalahin o bayarin.
    reason: lexical_alternative
  - marker: b
    text: Ang “Midrash” dito ay malamang na isang mapagpaliwanag na tala, paglalahad, o komentaryong kaugnay ng Aklat ng mga Hari.
    reason: cultural_note
lexical_decisions:
- source_word: וּבָנָיו
  choice: ang tungkol sa kanyang mga anak
  rationale: Ginamit ang pariralang “ang tungkol sa” upang maging likas sa Filipino ang pambungad sa talaan ng mga bagay na sinasabing nakasulat, habang pinananatili ang “kanyang mga anak” bilang tuwirang kahulugan ng anyong Hebreo.
- source_word: וְרֹב הַמַּשָּׂא עָלָיו
  choice: sa maraming kapahayagan laban sa kanya
  rationale: Maaaring tumukoy ang מַשָּׂא sa isang pabigat o sa isang kapahayagan, kadalasa’y may diwang paghatol. Ang “kapahayagan” ay nagpapanatili sa posibleng kahulugang orakulo nang hindi tahasang dinaragdagan ng salitang “propesiya”; inilalahad sa talababa ang tunay na hirap at ibang posibleng pagbasa.
- source_word: וִיסוֹד
  choice: sa pagkakatatag
  rationale: Pinananatili ng “pagkakatatag” ang pangunahing diwa ng ugat na יסד, na magtatag o maglagay ng saligan. Hindi ito tahasang ginawang “muling pagtatayo,” sapagkat hindi hayagang nasa salita ang elementong “muli,” kahit iyon ang maaaring tinutukoy ng konteksto.
- source_word: בֵּית הָאֱלֹהִים
  choice: bahay ng Diyos
  rationale: Pormal at malinaw na katumbas ito ng idyomang Hebreo; nauunawaan sa konteksto na tumutukoy ito sa templo nang hindi pinapaliit ang saklaw ng salita.
- source_word: הִנָּם כְּתוּבִים
  choice: narito, nakasulat ang mga iyon
  rationale: Ang “narito” ay nagpapanatili sa mariing pantukoy na puwersa ng הִנָּם, at ang “nakasulat ang mga iyon” ay likas na ayos sa modernong Filipino.
- source_word: עַל מִדְרַשׁ סֵפֶר הַמְּלָכִים
  choice: sa Midrash ng Aklat ng mga Hari
  rationale: Pinanatili ang “Midrash” bilang transliterasyon upang hindi labis na tukuyin ang uri ng akda; ipinaliliwanag sa talababa na maaari itong mangahulugang mapagpaliwanag na tala o komentaryo.
- source_word: וַיִּמְלֹךְ אֲמַצְיָהוּ בְנוֹ תַחְתָּיו
  choice: ang anak niyang si Amasias ay naghari bilang kahalili niya
  rationale: Likas na salin ito ng karaniwang pormula ng paghalili sa hari. Ginamit ang nakaugaliang anyong Filipino na “Amasias.”
theological_decisions:
- issue: Kung ang מַשָּׂא ay kapahayagan ng paghatol, pabigat, o ipinataw na bayarin
  choice: kapahayagan laban sa kanya, na may talababa
  alternative: bigat ng pasaning nakaatang sa kanya; mabigat na tributo na ipinataw sa kanya
  rationale: Hindi tiyak ang pariralang Hebreo. Ang pangunahing salin ay kumakatawan sa posibleng gamit nitong tumutukoy sa isang kapahayagan laban sa hari, ngunit hindi itinatago ang ibang makabuluhang posibilidad.
- issue: Kung ang וִיסוֹד ay tumutukoy sa orihinal na pagkakatatag o sa gawaing pagpapanumbalik ng templo
  choice: pagkakatatag
  alternative: paglalagay ng saligan; muling pagtatayo
  rationale: Pinili ang salitang pinakamalapit sa ugat ng Hebreo at iniwasang idagdag sa pangunahing teksto ang di-hayag na elementong “muli,” habang kinikilalang maaaring pagpapanumbalik ng templo ang tinutukoy sa konteksto.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Pinanatili ang “bahay ng Diyos” at “Midrash” upang manatiling malapit sa anyo at saklaw ng Hebreo, habang ginawang likas ang sintaks sa pamamagitan ng “Ang tungkol sa…” at “bilang kahalili niya.”
