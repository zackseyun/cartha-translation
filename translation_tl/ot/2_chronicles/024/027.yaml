  - severity: low
    issue: Ang “bilang kahalili niya” ay mas maluwag kaysa sa “sa kanyang lugar.”
    rationale: Wasto ang diwa ng paghalili, ngunit ang “kapalit niya” ay mas tuwiran at natural na katumbas ng תַּחְתָּיו sa pormula ng paghahari.
