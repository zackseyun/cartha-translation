  text: Jehoiada took for him two wives[a], and he fathered sons and daughters.
translation:
  language: tl
  text: Kumuha si Jehoiada ng dalawang asawa para sa kanya[a], at naging ama siya ng mga anak na lalaki at babae.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O, bagaman mas hindi malamang: “Kumuha si Jehoiada ng dalawang asawa at naging ama ng mga anak na lalaki at babae,” kung si Jehoiada ang ituturing na simuno sa buong talata.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשָּׂא
  choice: Kumuha
  rationale: Karaniwang tumutukoy ang נשׂא kasama ng אשה/נשים sa pagkuha ng asawa. Sa kontekstong ito, ipinahihiwatig ng לּוֹ na si Jehoiada ang kumuha o nagsaayos ng mga asawa para kay Joas.
- source_word: ל֥וֹ
  choice: para sa kanya
  rationale: Tinutukoy ng pang-ukol at hulaping panghalip ang taong pinakikinabangan ng ginawa ni Jehoiada. Pinananatili rin nito ang di-tahasang pagtukoy ng Hebreo kung sino ang tinutukoy.
- source_word: יְהוֹיָדָע
  choice: Jehoiada
  rationale: Ginamit ang nakaugaliang transliterasyon ng pangalan sa Filipino.
- source_word: נָשִׁים שְׁתָּיִם
  choice: dalawang asawa
  rationale: Sa konteksto ng pag-aasawa, ang נָשִׁים ay nangangahulugang mga asawa, hindi lamang mga babae; tahasang pinanatili ang bilang na dalawa.
- source_word: וַיּוֹלֶד
  choice: nagkaanak siya
  rationale: Ang Hiphil ng ילד na may lalaking simuno ay nangangahulugang magkaanak o maging ama. Likas at malinaw sa modernong Filipino ang 'nagkaanak,' habang ang panghalip na 'siya' ay nagpapanatili sa posibleng kalabuan ng tinutukoy.
- source_word: בָּנִים וּבָנוֹת
  choice: mga anak na lalaki at babae
  rationale: Tahasan sa Hebreo ang kapwa mga anak na lalaki at babae, kaya hindi ito pinaikli sa pangkalahatang 'mga anak.'
theological_decisions:
- issue: Ang tinutukoy ng panghalip at ang simuno ng huling pandiwa
  choice: Kumuha si Jehoiada ng dalawang asawa para kay Joas, at si Joas ang nagkaanak ng mga anak na lalaki at babae.
  alternative: Si Jehoiada mismo ang kumuha ng dalawang asawa at nagkaanak ng mga anak na lalaki at babae.
  rationale: Nakasentro kay Joas ang mas malawak na salaysay, at malakas na ipinahihiwatig ng לּוֹ ('para sa kanya') na kumilos si Jehoiada alang-alang kay Joas. Gayunman, si Jehoiada ang pinakamalapit na tahasang simuno, kaya pinananatili ng salin ang anyong 'para sa kanya' at 'siya,' at inilalahad sa talababa ang mas hindi malamang na pagbasa.
translation_notes:
  register: Modernong Filipino na natural at marangal. Pinanatili ang kalabuan ng mga panghalip sa Hebreo sa halip na tahasang ipalit ang pangalang Joas sa pangunahing teksto.
