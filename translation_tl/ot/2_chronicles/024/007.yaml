  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: כִּ֤י עֲתַלְיָ֨הוּ֙ הַ/מִּרְשַׁ֔עַת בָּנֶ֥י/הָ פָרְצ֖וּ אֶת בֵּ֣ית הָ/אֱלֹהִ֑ים וְ/גַם֙ כָּל קָדְשֵׁ֣י בֵית יְהוָ֔ה עָשׂ֖וּ לַ/בְּעָלִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/007.yaml
  text: For Athaliah[a], that wicked woman, and her sons had broken into the house of God and had also made all the holy things of the house of Yahweh for the Baals.
translation:
  language: tl
  text: Sapagkat si Atalia, ang masamang babaeng iyon, at ang kanyang mga anak na lalaki ay sapilitang pumasok sa bahay ng Diyos. Ginawa rin nilang ukol sa mga Baal[a] ang lahat ng banal na kagamitan sa bahay ni Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin na: “ginamit nila para sa mga Baal.” Mas literal na “ginawa” ang pandiwang Hebreo, ngunit sa konteksto ay malamang na nangangahulugang inangkin o ginamit nila sa pagsamba sa mga Baal ang mga banal na kagamitan ng templo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikita ang paliwanag o dahilan kaugnay ng naunang konteksto.
- source_word: עֲתַלְיָהוּ
  choice: Atalia
  rationale: Karaniwang anyong Tagalog ng pangalang Athaliah.
- source_word: הַמִּרְשַׁעַת
  choice: ang masamang babaeng iyon
  rationale: Pinananatili ang pambabaeng pagtukoy at ang mariing, halos demonstratibong gamit ng pantukoy.
- source_word: בָּנֶיהָ
  choice: ang kanyang mga anak na lalaki
  rationale: Tiyak na 'mga anak na lalaki' ang nasa Hebreo, hindi lamang pangkalahatang 'mga anak.'
- source_word: פָרְצוּ אֶת בֵּית הָאֱלֹהִים
  choice: sapilitang pumasok sa bahay ng Diyos
  rationale: Ang פרץ ay maaaring tumukoy sa pagpasok sa pamamagitan ng pagwasak o pagbutas; ipinahahayag ng salin ang marahas at labag-sa-pahintulot na pagpasok nang hindi nililimitahan ito sa simpleng pagsira lamang.
- source_word: בֵּית הָאֱלֹהִים
  choice: bahay ng Diyos
  rationale: Malapit sa Hebreo at pinananatili ang ugnayang leksikal sa kasunod na 'bahay ni Yahweh.'
- source_word: וְגַם
  choice: rin
  rationale: Natural na ipinahahayag sa Tagalog ang pandagdag na diin.
- source_word: כָּל קָדְשֵׁי בֵית יְהוָה
  choice: ang lahat ng banal na kagamitan sa bahay ni Yahweh
  rationale: Sa konteksto, ang קָדְשֵׁי ay mga bagay na itinalaga sa banal na paggamit; nililinaw ng 'kagamitan' na mga sagradong bagay ng templo ang tinutukoy.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang kinakatawan ang banal na pangalang nasa tekstong Hebreo.
- source_word: עָשׂוּ לַבְּעָלִים
  choice: Ginawa rin nilang para sa mga Baal
  rationale: Pinananatili ang payak at malawak na kahulugan ng עשה ('ginawa') at ang maramihang anyo ng בְּעָלִים; ipinauunawa ng ayos na iniukol o inilaan nila ang mga banal na kagamitan sa pagsamba sa mga Baal nang hindi lubusang nilulutas ang leksikal na kalabuan.
theological_decisions:
- issue: Paglalarawan sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehova
  rationale: Pangngalang pantangi ang יְהוָה sa talata, kaya pinananatili itong Yahweh sa halip na palitan ng isang titulo.
- issue: Maramihang בְּעָלִים
  choice: mga Baal
  alternative: Baal; mga diyus-diyosang Baal
  rationale: Maramihan ang anyong Hebreo at maaaring tumukoy sa iba't ibang anyo, imahen, o kulto ni Baal; hindi ito ginawang isahan.
- issue: Gamit ng mga banal na kagamitan para sa mga Baal
  choice: Ginawa rin nilang para sa mga Baal
  alternative: ginamit nila para sa mga Baal
  rationale: Pinananatili ng pangunahing teksto ang mas literal at malawak na עָשׂוּ, habang ipinapaliwanag sa talababa ang malamang na kahulugan sa konteksto.
translation_notes:
  register: Makabago at marangal na Filipino. Ginamit ang “bahay ng Diyos/Yahweh” upang mapanatili ang larawan at pag-uulit sa Hebreo. Ang pangungusap ay hinati sa dalawa upang maging malinaw at natural sa Tagalog, at inilagay ang talababa sa pariralang tunay nitong ipinapaliwanag.
