  source_fidelity: Tumpak na naipapahayag ng draft ang paliwanag ng כִּי, ang marahas na pagpasok/paglabag sa bahay ng Diyos, ang pambabaeng paglalarawan kay Atalia, ang tiyak na “mga anak na lalaki,” at ang maramihang “mga Baal.” Pinananatili rin ang Yahweh para sa יהוה. Gayunman, ang “Ginawa rin nilang para sa” ay hindi maayos na pagtatambal sa makabagong Filipino at nagpapalabo sa kaugnayan ng pandiwa sa mga banal na kagamitan.
  naturalness: Natural ang unang pangungusap. Kailangan lamang ayusin ang ikalawang pangungusap sa “ginawa nilang ukol sa,” na mas matatas ngunit nananatiling malapit sa malawak na kahulugan ng עָשׂוּ לַבְּעָלִים.
