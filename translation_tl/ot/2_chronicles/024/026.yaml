  register: Makabago, malinaw, at marangal na Filipino. Inayos bilang “anak ng babaeng Ammonita/Moabita na si…” upang hindi maging malabo kung kanino tumutukoy ang pambabaeng katawagang etniko. Walang footnote dahil walang mahalagang tekstuwal o leksikal na kalabuan na kailangang ilahad; ang footnote sa English consultation layer ay hindi tumutugma sa kinapuwestuhan nitong marker.
