  text: וְ/אֵ֖לֶּה הַ/מִּתְקַשְּׁרִ֣ים עָלָ֑י/ו זָבָ֗ד בֶּן שִׁמְעָת֙ הָֽ/עַמּוֹנִ֔ית וִ/יה֣וֹזָבָ֔ד בֶּן שִׁמְרִ֖ית הַ/מּוֹאָבִֽית־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/026.yaml
  text: 'And these were the men who conspired against him: Zabad son of Shimeath the Ammonite woman[a], and Jehozabad son of Shimrith the Moabite woman.'
translation:
  language: tl
  text: 'At ito ang mga nakipagsabwatan laban sa kanya: si Zabad na anak ng babaeng Ammonita na si Simeat, at si Jehozabad na anak ng babaeng Moabita na si Simrit.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: At ito ang
  rationale: Likas na panimula sa Filipino na tumutukoy sa mga taong kasunod na pinangalanan at umaangkop sa salaysay.
- source_word: הַמִּתְקַשְּׁרִים
  choice: mga nakipagsabwatan
  rationale: Ang hitpael participle ng קשר ay tumutukoy sa sama-samang pagbabalak o pakikipagsabwatan. Pinananatili ng parirala ang kolektibo at aktibong diwa nang hindi nagdaragdag ng salitang wala sa Hebreo.
- source_word: עָלָיו
  choice: laban sa kanya
  rationale: Sa konteksto ng קשר, tinutukoy ng עַל ang taong pinuntirya ng sabwatan.
- source_word: זָבָד
  choice: Zabad
  rationale: Tuwirang transliterasyon ng pangalang Hebreo.
- source_word: בֶּן
  choice: anak ng
  rationale: Karaniwang Filipino para sa ugnayang anak at magulang; hindi ipinapalagay sa salita mismo kung ama o ina ang tinutukoy.
- source_word: שִׁמְעָת
  choice: Simeat
  rationale: Transliterasyong madaling basahin sa modernong Filipino.
- source_word: הָעַמּוֹנִית
  choice: babaeng Ammonita
  rationale: Pinananatili ang tahasang pambabaeng anyo ng Hebreo at nililinaw na si Simeat, hindi si Zabad, ang Ammonita.
- source_word: וִיהוֹזָבָד
  choice: at si Jehozabad
  rationale: Pinananatili ang pang-ugnay at tinutukoy nang malinaw ang ikalawang taong pinangalanan.
- source_word: שִׁמְרִית
  choice: Simrit
  rationale: Transliterasyong madaling basahin sa modernong Filipino.
- source_word: הַמּוֹאָבִית
  choice: babaeng Moabita
  rationale: Pinananatili ang pambabaeng anyo ng Hebreo at malinaw na iniuugnay ang katawagan kay Simrit.
