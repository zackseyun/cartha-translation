  text: בֶּן שֶׁ֤בַע שָׁנִים֙ יֹאָ֣שׁ בְּ/מָלְכ֔/וֹ וְ/אַרְבָּעִ֣ים שָׁנָ֔ה מָלַ֖ךְ בִּֽ/ירוּשָׁלִָ֑ם וְ/שֵׁ֣ם אִמּ֔/וֹ צִבְיָ֖ה מִ/בְּאֵ֥ר שָֽׁבַע־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/001.yaml
  text: Joash was seven years old when he began to reign, and he reigned forty years in Jerusalem. His mother’s name was Zibiah from Beer-sheba.
translation:
  language: tl
  text: Pitong taong gulang si Joas nang magsimula siyang maghari, at apatnapung taon siyang naghari sa Jerusalem. Ang pangalan ng kanyang ina ay Sibia, na mula sa Beer-seba.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן שֶׁבַע שָׁנִים
  choice: Pitong taong gulang
  rationale: Ang literal na pormulang Hebreo ay “anak ng pitong taon,” ngunit ang natural at tumpak na katumbas sa modernong Tagalog ay “pitong taong gulang.”
- source_word: בְּמָלְכוֹ
  choice: nang magsimula siyang maghari
  rationale: Ipinapahayag ng anyong ito ang panahon ng pagluklok ni Joas; malinaw na inililipat ng salin ang temporal na diwa.
- source_word: מָלַךְ
  choice: naghari
  rationale: Pinananatili nito ang pandiwang diwa na “maghari” at ang pormula ng buod tungkol sa isang hari.
- source_word: בִּירוּשָׁלִָם
  choice: sa Jerusalem
  rationale: Tuwirang lokatibong salin ng pang-ukol at pangalan ng lugar.
- source_word: וְשֵׁם אִמּוֹ
  choice: Ang pangalan ng kanyang ina ay
  rationale: Natural at marangal na Tagalog para sa karaniwang pormulang nagbibigay ng pangalan ng ina.
- source_word: צִבְיָה
  choice: Sibia
  rationale: Transliterasyon sa baybay na angkop sa tunog at ortograpiyang Filipino.
- source_word: מִבְּאֵר שָׁבַע
  choice: na mula sa Beer-seba
  rationale: Ipinakikita ng prefiks na מ ang pinagmulan; pinananatili ang tambalang anyo ng pangalan ng lugar sa transliterasyon.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, natural, at marangal. Ginamit ang “maghari” sa halip na mas kolokyal na pagpapahayag upang mapanatili ang pormal na himig ng buod ng paghahari. Walang kinakailangang talababa sa talatang ito.
