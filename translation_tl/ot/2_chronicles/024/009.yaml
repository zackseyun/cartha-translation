  source_fidelity: Ang pangunahing suliranin ay ang “para sa Israel,” na nagpapalabnaw sa עַל יִשְׂרָאֵל. Sa kontekstong ito, kasama ng מַשְׂאַת, ipinahihiwatig nito ang isang ambag na iniatas o ipinataw sa Israel. Ang binagong salin ay ipinapakita ang obligasyong ito nang hindi ito ikinakahon bilang makabagong buwis.
  naturalness: Natural at marangal sa modernong Filipino ang “nagpalabas ng pahayag” at “itinakdang ambag na iniatas ... sa Israel.” Ang pagtanggal sa malabong “para sa Israel” ay nagpapalinaw kung sino ang may pananagutan.
  terminology: Napanatili ang Yahweh, Moises, lingkod ng Diyos, Juda, Jerusalem, at ilang. Ang “itinakdang ambag” ay angkop para sa מַשְׂאַת; ang talababa ay nagbibigay ng “ambag na ipinataw” at “singil” bilang mga alternatibo nang hindi ipinipilit ang isang makabagong kategoryang pampamahalaan.
