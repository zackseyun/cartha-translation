  text: וַ/יִּתְּנוּ ק֞וֹל בִּֽ/יהוּדָ֣ה וּ/בִֽ/ירוּשָׁלִַ֗ם לְ/הָבִ֤יא לַֽ/יהוָה֙ מַשְׂאַ֞ת מֹשֶׁ֧ה עֶֽבֶד הָ/אֱלֹהִ֛ים עַל יִשְׂרָאֵ֖ל בַּ/מִּדְבָּֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/009.yaml
  text: And they made a proclamation in Judah and Jerusalem to bring to Yahweh the levy of Moses the servant of God for Israel in the wilderness[a].
translation:
  language: tl
  text: Nagpalabas sila ng pahayag sa Juda at Jerusalem na dalhin kay Yahweh ang itinakdang ambag na iniatas ni Moises, na lingkod ng Diyos, sa Israel noong nasa ilang sila.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “ang ambag ni Moises na lingkod ng Diyos na ipinataw sa Israel noong nasa ilang sila,” o “ang singil ni Moises.” Ang salitang Hebreo ay tumutukoy sa isang itinakda o hinihinging ambag.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ קוֹל
  choice: Nagpalabas sila ng pahayag
  rationale: Ang idyoma ay literal na ‘nagbigay sila ng tinig/tunog,’ ngunit tumutukoy rito sa isang pampublikong pagpapahayag. Likas sa makabagong Tagalog ang ‘nagpalabas ng pahayag’ at napananatili nito ang opisyal na diwa.
- source_word: בִּיהוּדָה וּבִירוּשָׁלַם
  choice: sa Juda at Jerusalem
  rationale: Tuwirang paglalarawan sa mga lugar na saklaw ng pahayag.
- source_word: לְהָבִיא
  choice: na dalhin
  rationale: Ipinapahayag ng pawatas ang layunin o nilalaman ng pahayag; natural itong iugnay sa Tagalog sa pamamagitan ng ‘na.’
- source_word: לַיהוָה
  choice: kay Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos na יהוה. Ginamit ang ‘kay’ sapagkat personal na pangalan ang kasunod.
- source_word: מַשְׂאַת
  choice: itinakdang ambag
  rationale: Maaari itong tumukoy sa ambag o halagang kailangang ibigay. Ipinahihiwatig ng ‘itinakda’ na hindi lamang ito kusang-loob na handog, habang mas natural at mas angkop sa kontekstong panrelihiyon ang ‘ambag’ kaysa ‘buwis’ o ‘singil.’
- source_word: מֹשֶׁה עֶבֶד הָאֱלֹהִים
  choice: ni Moises na lingkod ng Diyos
  rationale: Pinananatili ang pagkakaugnay ng ambag kay Moises at ang kaniyang titulong ‘lingkod ng Diyos’ nang hindi nagdaragdag ng paliwanag sa pangunahing teksto.
- source_word: עַל יִשְׂרָאֵל
  choice: para sa Israel
  rationale: Ang עַל ay maaaring magpahiwatig ng pananagutang iniatang sa Israel, ngunit maaari ring isalin sa mas maluwag na ugnayang ‘para sa Israel.’ Pinili ang likas na pariralang ito at ipinaliwanag sa talababa ang mas mariing alternatibo.
- source_word: בַּמִּדְבָּר
  choice: noong nasa ilang sila
  rationale: Nililinaw sa natural na Tagalog na ang Israel ang nasa ilang nang itakda ang ambag, nang hindi binabago ang pangyayari.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tahasang ginagamit sa Hebreo ang Tetragrammaton. Pinananatili ng ‘Yahweh’ ang personal at tipanang pangalan sa halip na palitan ito ng isang titulo.
- issue: Kung ang ambag ay kusang-loob o iniatang na pananagutan
  choice: itinakdang ambag … para sa Israel
  alternative: ambag na ipinataw … sa Israel; buwis ni Moises
  rationale: Ang מַשְׂאַת kasama ng עַל ay maaaring magpahiwatig ng isang itinakda o iniatang na ambag. Iniiwasan ng salin ang pagpapakahulugang isa lamang itong kusang handog, ngunit hindi rin ito labis na tinutukoy bilang karaniwang buwis ng pamahalaan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘Juda,’ ‘Moises,’ at ‘ilang’ bilang pamilyar na anyong biblikal, ngunit iniwasan ang lipas o labis na teknikal na pananalita.
