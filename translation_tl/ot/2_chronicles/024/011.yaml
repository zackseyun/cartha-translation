  to: Tuwing dinadala ng mga Levita ang kahon[a] sa ilalim ng pangangasiwa ng hari, at kapag nakikita nilang marami na ang pera[b], pumupunta ang kalihim ng hari at ang opisyal ng punong pari. Inaalisan nila ng laman ang kahon, pagkatapos ay binubuhat ito at ibinabalik sa kinalalagyan nito. Ganito ang ginagawa nila araw-araw, at napakaraming pera ang nalilikom.
