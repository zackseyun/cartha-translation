translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “kalihim” sa halip na mas teknikal na “eskriba” dahil administratibo ang tungkulin sa talata. Pinanatili ang bahagyang kalabuan kung sino ang saklaw ng panghalip na “nila” sa “kapag nakita nila,” gaya ng nasa Hebreo.
