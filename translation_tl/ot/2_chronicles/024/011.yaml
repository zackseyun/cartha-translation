  naturalness: Natural at marangal ang “sa ilalim ng pangangasiwa ng hari” sa modernong Filipino at mas malinaw na naihahayag ang administratibong diwa. Ang mga pandiwang nasa aspektong nagaganap ay angkop sa nakagawiang kilos na ipinahihiwatig ng “tuwing.”
  terminology: Ang “kahon,” “mga Levita,” “kalihim ng hari,” “opisyal ng punong pari,” at “pera” ay angkop. Nananatili sa talababa ang literal na “kaban” at “pilak.”
