source:
  edition: WLC
  text: וַ/יְהִ֡י בְּ/עֵת֩ יָבִ֨יא אֶת הָֽ/אָר֜וֹן אֶל פְּקֻדַּ֣ת הַ/מֶּלֶךְ֮ בְּ/יַ֣ד הַ/לְוִיִּם֒ וְ/כִ/רְאוֹתָ֞/ם כִּי רַ֣ב הַ/כֶּ֗סֶף וּ/בָ֨א סוֹפֵ֤ר הַ/מֶּ֨לֶךְ֙ וּ/פְקִיד֙ כֹּהֵ֣ן הָ/רֹ֔אשׁ וִ/יעָ֨רוּ֙ אֶת הָ֣/אָר֔וֹן וְ/יִשָּׂאֻ֖/הוּ וִֽ/ישִׁיבֻ֣/הוּ אֶל מְקֹמ֑/וֹ כֹּ֤ה עָשׂוּ֙ לְ/י֣וֹם בְּ/י֔וֹם וַ/יַּֽאַסְפוּ כֶ֖סֶף לָ/רֹֽב־־־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/011.yaml
  text: And whenever the chest was brought by the Levites to the king’s oversight[a], and when they saw that the money was abundant, the king’s scribe and the chief priest’s officer would come and empty the chest, then carry it and return it to its place. Thus they did day by day[b], and they gathered money in abundance.
translation:
  language: tl
  text: Tuwing dinadala ng mga Levita ang kahon[a] sa ilalim ng pangangasiwa ng hari, at kapag nakikita nilang marami na ang pera[b], pumupunta ang kalihim ng hari at ang opisyal ng punong pari. Inaalisan nila ng laman ang kahon, pagkatapos ay binubuhat ito at ibinabalik sa kinalalagyan nito. Ganito ang ginagawa nila araw-araw, at napakaraming pera ang nalilikom.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa mas literal na salin, “kaban.” Dito, ang tinutukoy ay ang kahong lalagyan ng mga handog, hindi ang Kaban ng Tipan.
    reason: lexical_alternative
  - marker: b
    text: 'Hebreo: “pilak”; sa kontekstong ito, tumutukoy ito sa perang nalikom.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאָרוֹן
  choice: ang kahon
  rationale: Ang tinutukoy ay ang lalagyan ng mga handog, hindi ang Kaban ng Tipan. Likas at malinaw sa makabagong Tagalog ang “kahon,” habang inilalahad sa talababa ang mas literal na “kaban.”
- source_word: פְּקֻדַּת הַמֶּלֶךְ
  choice: para sa pagsusuri ng hari
  rationale: Maaaring tumukoy ang פְּקֻדָּה sa pagsusuri, pangangasiwa, o opisyal na pananagutan. Ang “para sa pagsusuri ng hari” ay angkop sa administratibong tagpo at hindi nagpapasok ng tiyak na opisyal na hindi tahasang binanggit.
- source_word: בְּיַד הַלְוִיִּם
  choice: dinadala ng mga Levita
  rationale: Ang idyomang בְּיַד ay nagpapahayag ng gumaganap o tagapagdala. Direkta at natural itong naipapahayag sa Tagalog sa pamamagitan ng “ng mga Levita.”
- source_word: וְכִרְאוֹתָם
  choice: kapag nakita nila
  rationale: Pinananatili nito ang panahunang diwa ng parirala at ang pangmaramihang gumaganap nang hindi pilit na tinutukoy kung sino mismo ang saklaw ng “nila.”
- source_word: רַב הַכֶּסֶף
  choice: marami na ang pera
  rationale: Sa konteksto ng nalikom na handog, ang כֶּסֶף ay tumutukoy sa pera, bagaman literal itong “pilak.” Ang “marami na” ay natural na nagpapahiwatig na umabot na sa malaking halaga ang laman ng kahon.
- source_word: סוֹפֵר הַמֶּלֶךְ
  choice: ang kalihim ng hari
  rationale: Sa administratibong konteksto, ang סוֹפֵר ay isang opisyal na kalihim o eskriba. Mas malinaw sa karaniwang mambabasa ang “kalihim ng hari” para sa tungkuling ito.
- source_word: פְקִיד כֹּהֵן הָרֹאשׁ
  choice: ang opisyal ng punong pari
  rationale: Ipinahihiwatig ng pariralang construct ang isang opisyal na kaugnay o nasa ilalim ng punong pari. Hindi labis na tinutukoy ng “opisyal” ang eksaktong ranggo nito.
- source_word: וִיעָרוּ אֶת הָאָרוֹן
  choice: inaalisan nila ng laman ang kahon
  rationale: Ipinapahayag nito nang natural ang pag-aalis ng mga nakolekta mula sa kahon, na siyang diwa ng pandiwa sa kontekstong ito.
- source_word: וְיִשָּׂאֻהוּ וִישִׁיבֻהוּ אֶל מְקֹמוֹ
  choice: binubuhat iyon at ibinabalik sa kinalalagyan nito
  rationale: Sinasalamin nito ang pagkakasunod ng pagbuhat o pagdadala sa kahon at ang pagbabalik dito sa dati nitong lugar.
- source_word: כֹּה עָשׂוּ לְיוֹם בְּיוֹם
  choice: Ganito ang ginagawa nila araw-araw
  rationale: Malinaw at natural nitong ipinapahayag ang paulit-ulit na gawaing nagaganap sa bawat araw.
- source_word: וַיַּאַסְפוּ כֶסֶף לָרֹב
  choice: nakalikom sila ng napakaraming pera
  rationale: Ang “nakalikom” ay angkop sa pagtitipon ng mga handog, at ang “napakarami” ay nagpapakita ng diin ng לָרֹב.
