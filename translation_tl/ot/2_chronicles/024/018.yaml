source:
  edition: WLC
  text: וַ/יַּֽעַזְב֗וּ אֶת בֵּ֤ית יְהוָה֙ אֱלֹהֵ֣י אֲבוֹתֵי/הֶ֔ם וַ/יַּֽעַבְד֥וּ אֶת הָ/אֲשֵׁרִ֖ים וְ/אֶת הָֽ/עֲצַבִּ֑ים וַֽ/יְהִי קֶ֗צֶף עַל יְהוּדָה֙ וִ/יר֣וּשָׁלִַ֔ם בְּ/אַשְׁמָתָ֖/ם זֹֽאת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/018.yaml
  text: And they abandoned the house of Yahweh[a], the God of their fathers, and served the Asherim and the idols. So wrath came upon Judah and Jerusalem because of this guilt of theirs.
translation:
  language: tl
  text: Tinalikuran nila ang bahay ni Yahweh, ang Diyos ng kanilang mga ninuno, at naglingkod sila sa mga Asherim[a] at sa mga diyus-diyosan. Kaya dumating ang poot sa Juda at Jerusalem dahil sa kasalanang ito nila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga poste ni Asherah.” Ang salitang Hebreo ay tumutukoy sa mga kultikong bagay na kaugnay ni Asherah at maaari ring magpahiwatig ng kaugnayan sa diyosang Asherah.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַזְבוּ
  choice: Tinalikuran
  rationale: Ipinahihiwatig ng עזב ang pag-iwan o pagtatakwil. Ang “tinalikuran” ay natural sa makabagong Filipino at malinaw na naghahayag ng sinadyang kawalang-katapatan.
- source_word: בֵּית יְהוָה
  choice: ang bahay ni Yahweh
  rationale: Pinananatili nito ang literal na Hebreong “bahay ni Yahweh” sa halip na ipakahulugang agad bilang “templo,” bagaman iyon ang tinutukoy sa konteksto.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang pangalan ng Diyos ayon sa anyong Hebreo at sa ibinigay na pamantayan ng proyekto.
- source_word: אֱלֹהֵי אֲבוֹתֵיהֶם
  choice: ang Diyos ng kanilang mga ninuno
  rationale: Likas at marangal ito sa modernong Filipino at pinananatili ang ugnayang pampamilya at pangkasunduan ng parirala.
- source_word: וַיַּעַבְדוּ
  choice: naglingkod sila
  rationale: Mas malapit ito sa malawak na kahulugan ng עבד kaysa “sumamba,” habang malinaw pa rin ang relihiyosong diwa dahil sa mga bagay na pinaglilingkuran.
- source_word: הָאֲשֵׁרִים
  choice: mga Asherim
  rationale: Pinananatili ang katawagang mula sa Hebreo upang hindi agad pagpasyahan kung mga kultikong bagay, mga poste, o representasyong kaugnay ng diyosang Asherah ang pangunahing tinutukoy.
- source_word: הָעֲצַבִּים
  choice: mga diyus-diyosan
  rationale: Malinaw nitong naihahayag sa karaniwang Filipino ang mapanuring relihiyosong diwa ng salitang tumutukoy sa mga idolo o imahen.
- source_word: וַיְהִי קֶצֶף
  choice: Kaya dumating ang poot
  rationale: Pinananatili ang maikli at di-tahasang pahayag ng Hebreo at ipinakikita ang bunga ng kanilang pagkakasala nang hindi idinaragdag sa teksto kung kaninong poot iyon.
- source_word: עַל יְהוּדָה וִירוּשָׁלִַם
  choice: sa Juda at Jerusalem
  rationale: Natural itong katumbas sa Filipino ng poot na sumapit o dumating sa dalawang lugar.
- source_word: בְּאַשְׁמָתָם זֹאת
  choice: dahil sa pagkakasalang ito nila
  rationale: Ipinakikita ng “dahil sa” ang sanhi, habang pinananatili ng “ito nila” ang demonstratibo at ang pananagutan nila sa kasalanan.
theological_decisions:
- issue: Tinutukoy ng “poot”
  choice: Hindi tahasang dinagdagan ng “ng Diyos” o “ni Yahweh” sa pangunahing teksto.
  alternative: “dumating sa kanila ang poot ng Diyos/Yahweh”
  rationale: Malinaw sa konteksto na banal na poot o hatol ito, ngunit “poot” lamang ang tahasang nasa Hebreo. Pinananatili ng salin ang implikasyon nang hindi nagdaragdag.
- issue: Kahulugan ng אֲשֵׁרִים
  choice: Pinanatili ang katawagang “mga Asherim” sa pangunahing teksto.
  alternative: “mga poste ni Asherah” o “mga imahen ni Asherah”
  rationale: Maaaring tumukoy ang salita sa mga kultikong bagay at kasabay nito ay pumukaw sa kaugnayan sa diyosang Asherah. Iniiwasan ng transliterasyon ang labis na pagpapasya.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “mga ninuno” sa halip na literal na “mga ama” para sa natural na kolektibong kahulugan. Pinanatili ang “bahay ni Yahweh” at “mga Asherim” upang mapangalagaan ang anyo at tunay na kalabuan ng Hebreo.
