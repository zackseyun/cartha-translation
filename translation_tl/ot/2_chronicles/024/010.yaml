  text: Then all the officials and all the people rejoiced[a], and they brought their contributions and threw them into the chest until it was full.
translation:
  language: tl
  text: Nagalak ang lahat ng pinuno at ang buong bayan; dinala nila ang kanilang mga ambag at inihulog ang mga ito sa kahon hanggang sa matapos sila.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “hanggang sa mapuno ito.” Mas pangkalahatan, maaaring mangahulugan ang pananalitang Hebreo ng “hanggang sa matapos” o “hanggang sa makumpleto.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂמְחוּ
  choice: nagalak
  rationale: Ang pandiwang שׂמח ay nagpapahayag ng galak. Likas at marangal sa salaysay ang “nagalak,” at ipinahihiwatig nito ang aktibong sama-samang tuwa.
- source_word: כָל הַשָּׂרִים
  choice: lahat ng mga pinuno
  rationale: Ang שָׂרִים ay tumutukoy sa mga may kapangyarihan o katungkulan. Mas malinaw sa makabagong Tagalog ang “mga pinuno” kaysa “mga prinsipe,” na maaaring mapagkamalang mga anak ng hari.
- source_word: וְכָל הָעָם
  choice: at ang buong bayan
  rationale: Ipinapahayag nito ang kolektibong saklaw ng כָל הָעָם sa natural na Tagalog.
- source_word: וַיָּבִיאוּ
  choice: Dinala nila ang kanilang mga ambag
  rationale: Ang pandiwa ay nangangahulugang “dinala nila,” ngunit hindi tahasang binanggit ang layon sa Hebreo. Ipinapahiwatig ng agarang konteksto ng koleksiyon para sa templo na mga ambag ang dinala, kaya makatuwiran at natural ang paglalantad ng implicit na layon.
- source_word: וַיַּשְׁלִיכוּ
  choice: inihulog
  rationale: Karaniwang nangangahulugang “ihagis” o “itapon” ang שלך, ngunit sa paglalagay ng ambag sa isang kahon, pinananatili ng “inihulog” ang kongkretong kilos nang hindi nagpapahiwatig na itinapon lamang bilang basura.
- source_word: לָאָרוֹן
  choice: sa kahon
  rationale: Maaaring mangahulugan ang אָרוֹן ng kahon, baul, o kaban. Dito ay lalagyan ito ng mga ambag, hindi ang Kaban ng Tipan, kaya malinaw at pangkaraniwan ang “kahon.”
- source_word: עַד לְכַלֵּה
  choice: hanggang sa mapuno ito
  rationale: Ang כלה ay tumutukoy sa pagdating sa wakas o pagkakumpleto. Sa konteksto ng paghuhulog sa lalagyan, malamang na ang praktikal na diwa ay nagpatuloy sila hanggang mapuno ang kahon; inilalahad sa talababa ang mas pangkalahatang alternatibong “hanggang sa matapos sila.”
