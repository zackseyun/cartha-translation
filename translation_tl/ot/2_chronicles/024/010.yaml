translation_notes:
  register: Makabago, natural, at marangal na Filipino ang ginamit. Pinili ang “nagalak,” “mga pinuno,” “mga ambag,” at “kahon” upang madaling maunawaan ng karaniwang mambabasa habang nananatiling malapit sa salaysay at konteksto ng Hebreo. Inilagay ang talababa sa hulihang parirala, na siyang tunay na pinagmumulan ng leksikal na kalabuan.
