  text: וְ/אַֽחֲרֵ֥י מוֹת֙ יְה֣וֹיָדָ֔ע בָּ֚אוּ שָׂרֵ֣י יְהוּדָ֔ה וַ/יִּֽשְׁתַּחֲו֖וּ לַ/מֶּ֑לֶךְ אָ֛ז שָׁמַ֥ע הַ/מֶּ֖לֶךְ אֲלֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/017.yaml
  text: After the death of Jehoiada[a], the officials of Judah came and bowed down to the king[b]. Then the king listened to them.
translation:
  language: tl
  text: Pagkamatay ni Joiada, dumating ang mga pinuno ng Juda[a] at yumukod sa harap ng hari. Pagkatapos, nakinig ang hari sa kanila.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga prinsipe ng Juda” o “mga opisyal ng Juda.”
    reason: lexical_alternative
  - marker: b
    text: Ang “nakinig sa kanila” ay maaari ring mangahulugang “dininig sila” o “sinunod sila.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַחֲרֵי מוֹת
  choice: Pagkamatay
  rationale: Likas at maikli itong pagpapahayag sa Filipino ng panahong kasunod ng pagkamatay; hindi na kailangang isalin nang hiwalay ang panimulang pangatnig.
- source_word: יְהוֹיָדָע
  choice: Joiada
  rationale: Ginamit ang karaniwang anyo ng pangalang biblikal sa Filipino.
- source_word: בָּאוּ
  choice: dumating
  rationale: Tuwirang ipinahahayag ang paglapit o pagdating ng mga pinuno nang hindi nagdaragdag ng tiyak na destinasyong hindi tahasang binanggit.
- source_word: שָׂרֵי יְהוּדָה
  choice: mga pinuno ng Juda
  rationale: Ang שָׂרִים ay maaaring tumukoy sa mga prinsipe, opisyal, o pinuno. Malinaw at likas sa modernong Filipino ang “mga pinuno” at hindi nito ipinapalagay na mga anak sila ng hari.
- source_word: וַ/יִּשְׁתַּחֲווּ לַ/מֶּלֶךְ
  choice: yumukod sa harap ng hari
  rationale: Pinananatili nito ang pisikal na kilos ng pagpapaubaya o paggalang nang hindi ito tahasang tinatawag na pagsamba.
- source_word: אָז
  choice: Pagkatapos
  rationale: Ipinahihiwatig ang sumunod na hakbang sa daloy ng salaysay sa natural na Filipino.
- source_word: שָׁמַע הַ/מֶּלֶךְ אֲלֵי/הֶם
  choice: nakinig ang hari sa kanila
  rationale: Pinananatili ang pangunahing diwa ng idyomang Hebreo habang hindi tuluyang nilulutas kung pakikinig lamang o pagsunod ang tinutukoy.
theological_decisions:
- issue: Ang uri ng pagyukod ng mga pinuno sa hari
  choice: yumukod sa harap ng hari
  alternative: nagpatirapa sa hari; nagbigay-galang sa hari; sumamba sa hari
  rationale: Maaaring magpahiwatig ang pandiwang Hebreo ng pagyukod o pagpapatirapa bilang paggalang o pagsamba ayon sa konteksto. Dahil tao at hari ang pinatutungkulan dito, pinananatili ng “yumukod” ang kilos nang hindi ipinapasok ang mas tiyak na teolohikal na kahulugan ng pagsamba.
- issue: Lakas ng kahulugan ng pakikinig ng hari
  choice: nakinig ang hari sa kanila
  alternative: pinakinggan sila ng hari; sinunod sila ng hari
  rationale: Ang שׁמע אל ay maaaring mangahulugang makinig, dinggin, o tumalima. Pinananatili ng pangunahing teksto ang tunay na lawak ng kahulugan, samantalang inilalahad sa talababa ang posibleng diwa ng pagsunod.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Pinili ang “mga pinuno” sa halip na “mga prinsipe” upang malinaw na tumukoy sa mga taong may kapangyarihang mamahala, at ang “yumukod” upang iwasang labis na bigyang-kahulugan ang kilos bilang pagsamba.
