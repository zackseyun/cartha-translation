base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/024.yaml
  text: For the army of Aram came with few men[a], but Yahweh gave a very great army into their hand, because they had forsaken Yahweh, the God of their fathers[c][b]. Thus they executed judgment on Joash.
translation:
  language: tl
  text: Sapagkat dumating ang hukbo ng Aram na kakaunti lamang ang tauhan,[a] ngunit ibinigay ni Yahweh sa kanilang kamay[b] ang isang napakalaking hukbo, sapagkat tinalikuran nila si Yahweh, ang Diyos ng kanilang mga ninuno. At ipinataw nila ang mga hatol kay Joas.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “na may maliit lamang na bilang ng mga tauhan.”
    reason: lexical_alternative
  - marker: b
    text: Ang “sa kanilang kamay” ay idyomang Hebreo na nangangahulugang “sa kanilang kapangyarihan.”
    reason: lexical_alternative
  - marker: c
    text: O, “naglapat sila ng mga hatol kay Joas.”
    reason: alternative_reading
lexical_decisions:
- source_word: בְּמִצְעַר אֲנָשִׁים
  choice: na kakaunti lamang ang mga tauhan
  rationale: Ipinahahayag ng parirala ang maliit na bilang ng mga tauhan at pinananatili ang mariing paghahambing sa napakalaking hukbo ng Juda.
- source_word: חֵיל אֲרָם
  choice: ang hukbo ng Aram
  rationale: Sa kontekstong ito, ang חֵיל ay isang puwersang militar; pinanatili ang orihinal na pangalang Aram sa halip na palitan ito ng Syria.
- source_word: נָתַן בְּיָדָם
  choice: ibinigay ... sa kanilang kamay
  rationale: Pinananatili ang karaniwang idyomang Hebreo na nangangahulugang isinailalim sa kanilang kapangyarihan; nililinaw ito sa talababa.
- source_word: חַיִל לָרֹב מְאֹד
  choice: ang napakalaking hukbo
  rationale: Ang חַיִל ay muling tumutukoy sa hukbo, at ang לָרֹב מְאֹד ay nagsasaad ng napakalaking bilang o lakas.
- source_word: עָזְבוּ
  choice: tinalikuran
  rationale: Natural at marangal sa makabagong Filipino ang salitang ito at naipapahayag nito ang bigat ng pagtatakwil sa Diyos, hindi lamang pisikal na pag-alis.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang isinasalin ang personal na pangalang nasa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֵי אֲבוֹתֵיהֶם
  choice: ang Diyos ng kanilang mga ninuno
  rationale: Ang 'mga ninuno' ay natural sa kasalukuyang Filipino at tumpak na naghahatid ng genealogical at covenantal na diwa ng 'kanilang mga ama.'
- source_word: עָשׂוּ שְׁפָטִים
  choice: nagpatupad sila ng mga hatol
  rationale: Pinananatili ang maramihang שְׁפָטִים at ang diwang aktuwal na pagsasagawa ng maparusang paghatol, nang hindi ipinapaliwanag nang higit sa sinasabi ng teksto.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Personal na pangalan ang tahasang ginamit sa Hebreo; pinananatili ito upang hindi mapalitan ng isang titulo.
- issue: Ang tagumpay ng Aram bilang paghatol ng Diyos
  choice: At nagpatupad sila ng mga hatol laban kay Joas
  alternative: At pinarusahan nila si Joas
  rationale: Pinananatili ng napiling salin ang wikang hudisyal at ang maramihang anyo ng שְׁפָטִים, gayundin ang kaugnayan nito sa naunang pagkilos ni Yahweh, nang hindi tahasang tinutukoy ang mekanismo nang higit sa Hebreo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang 'mga tauhan' para sa bilang ng mga kawal, 'mga ninuno' para sa natural na genealogical na pahayag, at pinanatili ang idyomang 'sa kanilang kamay' kasama ang paliwanag sa talababa. Pinanatili rin ang maramihang 'mga hatol' upang katawanin ang plural na Hebreo.
