revisions:
- from: Sapagkat dumating ang hukbo ng Aram na kakaunti lamang ang mga tauhan,[a] ngunit ibinigay ni Yahweh sa kanilang kamay[b] ang napakalaking hukbo, dahil tinalikuran nila si Yahweh, ang Diyos ng kanilang mga ninuno. At nagpatupad sila ng mga hatol laban kay Joas.[c]
  to: Sapagkat dumating ang hukbo ng Aram na kakaunti lamang ang tauhan,[a] ngunit ibinigay ni Yahweh sa kanilang kamay[b] ang isang napakalaking hukbo, sapagkat tinalikuran nila si Yahweh, ang Diyos ng kanilang mga ninuno. At ipinataw nila ang mga hatol kay Joas.[c]
  rationale: Inayos ang dalawang parirala para sa mas natural at marangal na modernong Filipino nang hindi binabago ang saklaw ng kahulugan. Pinanatili ang Aram, Yahweh, ang idyomang Hebreo na may talababa, at ang plural na “mga hatol,” na mahalaga sa anyo ng pinagmulan.
