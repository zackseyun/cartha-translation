  text: וַ/יַּ֧עַשׂ יוֹאָ֛שׁ הַ/יָּשָׁ֖ר בְּ/עֵינֵ֣י יְהוָ֑ה כָּל יְמֵ֖י יְהוֹיָדָ֥ע הַ/כֹּהֵֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/002.yaml
  text: Joash did what was right in the eyes of Yahweh all the days of Jehoiada the priest.
translation:
  language: tl
  text: Ginawa ni Joas ang tama sa paningin ni Yahweh sa buong panahon ng buhay ni Joiada, ang pari.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Ginawa
  rationale: Karaniwang nangangahulugang “gawin” ang עשה; kasama ng הַיָּשָׁר, likas sa Filipino ang pariralang “ginawa ... ang tama.”
- source_word: הַיָּשָׁר
  choice: ang tama
  rationale: Ang יָשָׁר ay “tuwid, tama, matuwid.” Sa pormulang sumusuri sa hari, malinaw at natural ang “ang tama.”
- source_word: בְּעֵינֵי
  choice: sa paningin ni
  rationale: Pinananatili nito ang Hebreong metapora ng pagsusuri ayon sa pananaw ng isang tao at karaniwan ito sa marangal na Filipino.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ng transliterasyong “Yahweh” ang personal na pangalan ng Diyos sa tekstong Hebreo, sa halip na palitan ito ng isang titulo.
- source_word: כָּל יְמֵי
  choice: habang nabubuhay
  rationale: Literal na “lahat ng mga araw ni,” ngunit kapag tumutukoy sa haba ng buhay ng isang tao, natural at tumpak sa Filipino ang “habang nabubuhay.”
- source_word: יְהוֹיָדָע
  choice: Joiada
  rationale: Ginamit ang anyong Joiada, isang malinaw at matatag na transliterasyon sa Filipino ng pangalang Hebreo.
- source_word: הַכֹּהֵן
  choice: na pari
  rationale: Ang כֹּהֵן ay “pari.” Ikinakabit ito bilang paglalarawan sa tungkulin ni Joiada nang hindi nagdaragdag ng kahulugan.
theological_decisions:
- issue: Pagtutumbas sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehovah
  rationale: Personal na pangalan ang tahasang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang pangalan sa halip na palitan ito ng titulong “PANGINOON.”
- issue: Saklaw ng positibong pagsusuri kay Joas
  choice: habang nabubuhay si Joiada na pari
  alternative: sa lahat ng araw ni Joiada na pari
  rationale: 'Pinananatili ang limitasyong temporal ng Hebreo: ang pahayag tungkol sa paggawa ni Joas ng tama ay nakaugnay sa buong panahon ng buhay ni Joiada. Hindi pinalalawak ang pagsusuri lampas sa panahong iyon.'
translation_notes:
  register: Modernong Filipino na dignidad ngunit madaling maunawaan. Pinanatili ang biblikal na idyomang “sa paningin ni,” samantalang isinalin nang natural ang temporal na pariralang “lahat ng mga araw ni” bilang “habang nabubuhay.”
