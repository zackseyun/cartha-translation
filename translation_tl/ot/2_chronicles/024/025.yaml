  text: וּ/בְ/לֶכְתָּ֣/ם מִמֶּ֗/נּוּ כִּֽי עָזְב֣וּ אֹת/וֹ֮ ב/מחליים רַבִּים֒ הִתְקַשְּׁר֨וּ עָלָ֜י/ו עֲבָדָ֗י/ו בִּ/דְמֵי֙ בְּנֵי֙ יְהוֹיָדָ֣ע הַ/כֹּהֵ֔ן וַ/יַּֽהַרְגֻ֥/הוּ עַל מִטָּת֖/וֹ וַ/יָּמֹ֑ת וַֽ/יִּקְבְּרֻ֨/הוּ֙ בְּ/עִ֣יר דָּוִ֔יד וְ/לֹ֥א קְבָרֻ֖/הוּ בְּ/קִבְר֥וֹת הַ/מְּלָכִֽים־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/025.yaml
  text: When they departed from him—for they left him with many diseases—his servants conspired against him because of the blood of the sons of Jehoiada the priest[a], and they killed him on his bed, and he died. They buried him in the city of David, but they did not bury him in the tombs of the kings.
translation:
  language: tl
  text: Nang umalis sila sa kaniya—sapagkat iniwan nila siyang may maraming karamdaman—nagsabwatan laban sa kaniya ang mga lingkod niya dahil sa dugo ng mga anak ni Jehoiada, ang pari.[a] Pinatay nila siya sa kaniyang higaan, at namatay siya. Inilibing nila siya sa Lungsod ni David, ngunit hindi siya inilibing sa mga libingan ng mga hari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plural ang Hebreo: “dugo ng mga anak ni Jehoiada, ang pari.” Sa konteksto, maaaring partikular itong tumukoy sa “anak ni Jehoiada,” samakatuwid ay kay Zacarias (24:20–22).'
    reason: alternative_reading
lexical_decisions:
- source_word: וּבְלֶכְתָּם מִמֶּנּוּ
  choice: Nang umalis sila sa kaniya
  rationale: Ang ב na may infinitive construct ay temporal, at ang מִמֶּנּוּ ay tumutukoy sa paglayo kay Joas. Natural sa Tagalog ang “nang umalis sila sa kaniya.”
- source_word: כִּי עָזְבוּ אֹתוֹ בְּמַחֳלָיִם רַבִּים
  choice: sapagkat iniwan nila siyang may maraming karamdaman
  rationale: Pinananatili ng “sapagkat” ang sanhi na ipinahihiwatig ng כִּי, at ng “maraming karamdaman” ang plural ng tekstong Hebreo nang hindi ito ginagawang “mga sugat.”
- source_word: הִתְקַשְּׁרוּ עָלָיו עֲבָדָיו
  choice: nagsabwatan laban sa kaniya ang mga lingkod niya
  rationale: Ang hitpael ng קשר ay tumutukoy sa sabwatan. Direktang katumbas ng עֲבָדָיו ang “mga lingkod niya,” bagaman maaari itong tumukoy sa mga opisyal ng hari.
- source_word: בִּדְמֵי בְּנֵי יְהוֹיָדָע הַכֹּהֵן
  choice: dahil sa dugo ng mga anak ni Jehoiada na pari
  rationale: Ang בִּדְמֵי ay sanhi o batayan ng paghihiganti. Pinananatili ang literal na plural na “mga anak” at ang appositional na pagkakakilanlan kay Jehoiada bilang pari.
- source_word: וַיַּהַרְגֻהוּ עַל מִטָּתוֹ וַיָּמֹת
  choice: Pinatay nila siya sa kaniyang higaan, at namatay siya
  rationale: Direktang isinasalin ang הרג bilang “pinatay” at pinananatili ang tahasang kasunod na pahayag na namatay siya.
- source_word: וַיִּקְבְּרֻהוּ בְּעִיר דָּוִיד
  choice: Inilibing nila siya sa Lungsod ni David
  rationale: Natural at tuwirang salin; ginawang pantanging pangalan ang “Lungsod ni David.”
- source_word: וְלֹא קְבָרֻהוּ בְּקִבְרוֹת הַמְּלָכִים
  choice: ngunit hindi siya inilibing sa mga libingan ng mga hari
  rationale: 'Ipinakikita ng “ngunit” ang mahalagang pagtutunggali: inilibing siya sa Lungsod ni David ngunit hindi pinarangalan ng libing sa mga libingan ng mga hari.'
theological_decisions:
- issue: Plural na “mga anak ni Jehoiada” sa Masoretic Text laban sa kontekstuwal na singular na anak, si Zacarias
  choice: Pinanatili sa pangunahing teksto ang “mga anak ni Jehoiada.”
  alternative: “anak ni Jehoiada,” na tumutukoy kay Zacarias sa 24:20–22
  rationale: Plural ang tekstong Hebreo na ibinigay. Hindi ito tahimik na itinugma sa naunang salaysay; sa halip, ipinaliwanag sa talababa ang kontekstuwal na posibilidad ng singular.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “sapagkat” at “ngunit” para sa dignidad at malinaw na ugnayan ng mga sugnay; iniwasan ang labis na teknikal o denominasyonal na pananalita.
