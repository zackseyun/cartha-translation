- from: Nang umalis sila sa kaniya—sapagkat iniwan nila siyang may maraming karamdaman—nagsabwatan laban sa kaniya ang mga lingkod niya dahil sa dugo ng mga anak ni Jehoiada na pari.[a] Pinatay nila siya sa kaniyang higaan, at namatay siya. Inilibing nila siya sa Lungsod ni David, ngunit hindi siya inilibing sa mga libingan ng mga hari.
  to: Nang umalis sila sa kaniya—sapagkat iniwan nila siyang may maraming karamdaman—nagsabwatan laban sa kaniya ang mga lingkod niya dahil sa dugo ng mga anak ni Jehoiada, ang pari.[a] Pinatay nila siya sa kaniyang higaan, at namatay siya. Inilibing nila siya sa Lungsod ni David, ngunit hindi siya inilibing sa mga libingan ng mga hari.
