  source_fidelity: 'Tumpak na naisasalin ng draft ang pagkakasunod-sunod at mga pangunahing pahayag ng Hebreo: pag-alis, pag-iwan kay Joas na may maraming karamdaman, sabwatan ng kaniyang mga lingkod, pagpatay sa higaan, at libing sa Lungsod ni David ngunit hindi sa mga libingan ng mga hari. Napananatili rin ang plural na “mga anak” ng Masoretic Text.'
  naturalness: Malinaw at marangal ang modernong Filipino. Ang bahagyang pagbabago sa pagkakabit ng “ang pari” ay magpapalinaw na si Jehoiada, hindi ang mga anak, ang tinutukoy na pari. Inaayos din ang talababa upang hindi magmukhang ang saling Tagalog na nasa panipi ay mismong anyong Hebreo.
  terminology: Ang “nagsabwatan,” “mga lingkod,” “karamdaman,” “higaan,” at “mga libingan ng mga hari” ay angkop at tapat sa rehistro at kahulugan ng teksto. Ang mga pangalang Jehoiada at Zacarias ay pinananatili nang pare-pareho.
