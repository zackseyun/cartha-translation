  yaml_path: translation/ot/2_chronicles/024/004.yaml
  text: After this[b][a], it was in the heart of Joash to restore the house of Yahweh.
translation:
  language: tl
  text: Pagkatapos nito, hinangad ni Joas na panibaguhin[a] ang bahay ni Yahweh.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “ipanumbalik” o “kumpunihin.”
    reason: lexical_alternative
  - marker: b
    text: Ang “bahay ni Yahweh” ay tumutukoy sa templo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי כֵן
  choice: Pagkatapos nito
  rationale: Likas na panandang temporal sa makabagong Tagalog na nagpapanatili sa paglipat ng salaysay nang hindi kahoy ang literal na ‘at nangyari.’
- source_word: הָיָה עִם לֵב יוֹאָשׁ
  choice: ipinasya ni Joas
  rationale: Ipinahahayag ng idyomang Hebreo ang panloob na balak o pasya ni Joas. Natural ito sa Tagalog at hindi nagdaragdag ng labis na diin na maaaring ipahiwatig ng ‘itinalaga ang puso.’
- source_word: לְחַדֵּשׁ
  choice: panibaguhin
  rationale: Saklaw nito ang paggawa muling bago o pagpapanumbalik ng isang umiiral nang gusali; pinananatili rin nito ang bahagyang mas malawak na diwa kaysa sa ‘kumpunihin.’
- source_word: בֵּית יְהוָה
  choice: bahay ni Yahweh
  rationale: Pinananatili ang literal na larawang ‘bahay’ sa Hebreo at ang kaugnayan nito kay Yahweh; nililinaw sa talababa na templo ang tinutukoy.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ang banal na pangalang YHWH sa halip na palitan ito ng isang titulo.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo; pinananatili ng ‘Yahweh’ ang pagkakaiba nito sa titulong ‘Panginoon.’
- issue: Lakas ng pasya sa idyomang הָיָה עִם לֵב יוֹאָשׁ
  choice: ipinasya ni Joas
  alternative: isinapuso ni Joas; nagpasya nang buong puso si Joas
  rationale: Ipinakikita ang panloob na layunin nang hindi idinaragdag ang ideya ng ‘buong puso’ o isang mas matinding panata na hindi tahasang nasa Hebreo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘panibaguhin’ upang mapanatili ang lawak ng חָדַשׁ, at ang ‘bahay ni Yahweh’ upang mapanatili ang konkretong larawan ng Hebreo habang nililinaw sa talababa ang konteksto.
