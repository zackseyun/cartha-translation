  source_fidelity: 'Tapat ang salin sa pangunahing daloy ng Hebreo: ang hukbo ng Aram ay sumalakay kay Joas, dumating sa Juda at Jerusalem, nilipol ang mga pinuno ng bayan, at ipinadala ang samsam sa hari ng Damasco. Ang “Nang umikot ang taon” ay bahagyang literal ngunit katanggap-tanggap na pagsasalin ng temporal na idyoma at maayos na sinusuportahan ng talababa.'
  naturalness: Makabago at malinaw ang Filipino sa kabuuan. Ang ayos na “nilipol nila mula sa bayan ang lahat ng mga pinuno nito” ay may bahagyang pormal na diin, ngunit nauunawaan at sinadyang pinananatili ang paghihiwalay na nasa מֵעָם.
  terminology: 'Ang “hukbo,” “pinuno,” “nasamsam,” at “hari ng Damasco” ay angkop sa salaysay na pangkasaysayan. Wastong pinanatili ang Aram bilang pangalang Hebreo, at ang tala tungkol sa “Syria” ay kapaki-pakinabang. Wasto rin ang mga anchor ng talababa: [a] sa idyoma ng taon, [b] sa Aram, at [c] sa samsam.'
