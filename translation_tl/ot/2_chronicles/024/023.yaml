  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יְהִ֣י לִ/תְקוּפַ֣ת הַ/שָּׁנָ֗ה עָלָ֣ה עָלָי/ו֮ חֵ֣יל אֲרָם֒ וַ/יָּבֹ֗אוּ אֶל יְהוּדָה֙ וִ/יר֣וּשָׁלִַ֔ם וַ/יַּשְׁחִ֛יתוּ אֶת כָּל שָׂרֵ֥י הָ/עָ֖ם מֵ/עָ֑ם וְ/כָל שְׁלָלָ֥/ם שִׁלְּח֖וּ לְ/מֶ֥לֶךְ דַּרְמָֽשֶׂק׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/023.yaml
  text: At the turn of the year[a], the army of Aram came up against him. They came to Judah and Jerusalem, and destroyed all the leaders of the people from among the people[c][b], and sent all their spoil to the king of Damascus.
translation:
  language: tl
  text: Nang umikot ang taon[a], sumalakay sa kanya ang hukbo ng Aram.[b] Dumating sila sa Juda at Jerusalem at nilipol nila mula sa bayan ang lahat ng mga pinuno nito. Ipinadala nila sa hari ng Damasco ang lahat ng kanilang nasamsam.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Sa pagtatapos ng taon.” Ang idyomang Hebreo ay tumutukoy sa pag-ikot ng taon o ng mga panahon.
    reason: lexical_alternative
  - marker: b
    text: Ang “Aram” ang pangalang Hebreo na madalas isaling “Syria.”
    reason: cultural_note
  - marker: c
    text: O “lahat ng kanilang dinambong.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לִתְקוּפַת הַשָּׁנָה
  choice: Nang umikot ang taon
  rationale: Ang תְּקוּפָה ay tumutukoy sa pag-ikot o paglipat ng taunang siklo o panahon. Pinananatili ng salin ang larawang Hebreo sa natural na Filipino, habang inilalahad sa talababa ang posibleng diwa na pagtatapos ng taon.
- source_word: עָלָה עָלָיו
  choice: sumalakay sa kanya
  rationale: Sa kontekstong militar, ang עָלָה עַל ay nangangahulugang humayo laban sa isang tao o salakayin siya. Mas natural sa Filipino ang “sumalakay” kaysa sa literal na “umakyat laban.”
- source_word: חֵיל אֲרָם
  choice: hukbo ng Aram
  rationale: Ang חֵיל ay isang puwersang militar o hukbo. Pinanatili ang pangalang Aram sa halip na palitan ito ng makabagong heograpikong katawagang Syria.
- source_word: וַיָּבֹאוּ אֶל יְהוּדָה וִירוּשָׁלַם
  choice: Dumating sila sa Juda at Jerusalem
  rationale: Karaniwang nangangahulugan ang בוא na dumating o pumasok. Hindi dinagdagan ng “sinalakay” ang pandiwang ito dahil malinaw na ang kontekstong militar sa naunang sugnay.
- source_word: וַיַּשְׁחִיתוּ
  choice: nilipol
  rationale: Sa Hiphil, ang שׁחת ay maaaring mangahulugang sirain o lipulin. Dahil mga tao ang tuwirang layon, malinaw na ipinahihiwatig ng “nilipol” ang nakamamatay na pagwasak.
- source_word: כָּל שָׂרֵי הָעָם
  choice: lahat ng mga pinuno nito
  rationale: Ang שָׂרִים ay mga pinuno, tagapamahala, o mataas na opisyal. Ang “mga pinuno” ay malinaw at hindi nagpapahiwatig na sila ay mga anak ng hari.
- source_word: מֵעָם
  choice: mula sa bayan
  rationale: 'Pinananatili ang panandang paghihiwalay na מִן: ang mga pinuno ay nilipol mula sa gitna ng bayan. Inayos lamang ang puwesto ng parirala upang maging mas mabasa sa Filipino.'
- source_word: וְכָל שְׁלָלָם
  choice: lahat ng kanilang nasamsam
  rationale: Ang שָׁלָל ay samsam o pandarambong na nakuha sa digmaan. Ang “nasamsam” ay natural sa kasalukuyang Filipino at malinaw na tumutukoy sa mga bagay na kinuha ng mga mananalakay.
- source_word: שִׁלְּחוּ לְמֶלֶךְ דַּרְמָשֶׂק
  choice: Ipinadala nila sa hari ng Damasco
  rationale: Likas na tumutukoy ang parirala sa pinunong nakaluklok sa Damasco. Ginamit ang karaniwang anyong Filipino na “Damasco.”
theological_decisions: []
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang pangalang Aram at ang larawan ng pag-ikot ng taon, ngunit ginawang natural ang mga idyomang militar. Ang di-karaniwang pariralang “mula sa bayan” ay pinanatili upang hindi mawala ang pagkakahiwalay na ipinahihiwatig ng tekstong Hebreo.
