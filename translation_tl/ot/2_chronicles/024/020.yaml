id: 2CH.24.20
reference: 2 Chronicles 24:20
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/ר֣וּחַ אֱלֹהִ֗ים לָֽבְשָׁה֙ אֶת זְכַרְיָה֙ בֶּן יְהוֹיָדָ֣ע הַ/כֹּהֵ֔ן וַֽ/יַּעֲמֹ֖ד מֵ/עַ֣ל לָ/עָ֑ם וַ/יֹּ֨אמֶר לָ/הֶ֜ם כֹּ֣ה אָמַ֣ר הָ/אֱלֹהִ֗ים לָ/מָה֩ אַתֶּ֨ם עֹבְרִ֜ים אֶת מִצְוֺ֤ת יְהוָה֙ וְ/לֹ֣א תַצְלִ֔יחוּ כִּֽי עֲזַבְתֶּ֥ם אֶת יְהוָ֖ה וַ/יַּֽעֲזֹ֥ב אֶתְ/כֶֽם־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/020.yaml
  text: 'And the Spirit of God clothed Zechariah son of Jehoiada the priest[a], and he stood above the people and said to them, “Thus says God: Why are you transgressing the commandments of Yahweh, so that you do not prosper? Because you have forsaken Yahweh[b], he has also forsaken you.”'
translation:
  language: tl
  text: 'At binihisan ng Espiritu ng Diyos si Zacarias na anak ng paring si Joiada[a]. Tumayo siya nang mataas sa harap ng bayan at sinabi sa kanila, “Ganito ang sinasabi ng Diyos: ‘Bakit ninyo nilalabag ang mga utos ni Yahweh? Dahil dito, hindi kayo magtatagumpay.[b] Sapagkat pinabayaan ninyo si Yahweh, kaya pinabayaan din niya kayo.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaaring isalin: “sumakanya ang Espiritu ng Diyos”; literal: “binihisan ng Espiritu ng Diyos si Zacarias.”'
    reason: lexical_alternative
  - marker: b
    text: 'Maaaring isalin: “at hindi kayo magtatagumpay.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/ר֣וּחַ אֱלֹהִ֗ים
  choice: ang Espiritu ng Diyos
  rationale: Sa konteksto ng pagbibigay-kapangyarihan upang magpahayag bilang propeta, tumutukoy ito sa banal na ahensiya ng Diyos; ang malaking titik sa “Espiritu” ay angkop nang hindi dinaragdagan ang Hebreo.
- source_word: לָֽבְשָׁה֙ אֶת
  choice: binalot ... si
  rationale: Pinananatili ng “binalot” ang matingkad na metapora ng pananamit sa pandiwang לבשׁ, habang natural pa rin sa makabagong Tagalog.
- source_word: זְכַרְיָה֙ בֶּן יְהוֹיָדָ֣ע הַ/כֹּהֵ֔ן
  choice: si Zacarias na anak ng paring si Joiada
  rationale: Malinaw na si Joiada ang tinutukoy na pari, at natural sa Tagalog ang ganitong ayos.
- source_word: וַֽ/יַּעֲמֹ֖ד מֵ/עַ֣ל לָ/עָ֑ם
  choice: Tumayo siya sa isang mataas na lugar sa harap ng bayan
  rationale: Ipinahihiwatig ng מֵעַל na nasa mataas siyang posisyon kaysa sa bayan; ang salin ay nagpapanatili sa aspektong patayo ngunit iniiwasan ang di-natural na “sa ibabaw ng bayan.”
- source_word: כֹּ֣ה אָמַ֣ר הָ/אֱלֹהִ֗ים
  choice: Ganito ang sinasabi ng Diyos
  rationale: Natural at marangal na katumbas ito ng pormulang ginagamit sa mensaheng propetiko.
- source_word: לָ/מָה֩ אַתֶּ֨ם עֹבְרִ֜ים
  choice: Bakit ninyo nilalabag
  rationale: Sa kaugnayan nito sa mga utos, ang עבר ay nangangahulugang lumalabag o sumusuway, hindi literal na tumatawid.
- source_word: מִצְוֺ֤ת יְהוָה֙
  choice: ang mga utos ni Yahweh
  rationale: Tuwirang inililipat ng “mga utos” ang covenantal na diwa ng מִצְוֹת, at pinananatili ang pangalang Yahweh.
- source_word: וְ/לֹ֣א תַצְלִ֔יחוּ
  choice: Dahil dito, hindi kayo magtatagumpay
  rationale: Ipinahahayag nito ang bunga ng paglabag sa malinaw na Tagalog, habang kinikilala sa talababa ang posibleng payak na koordinasyon.
- source_word: כִּֽי עֲזַבְתֶּ֥ם אֶת יְהוָ֖ה ... וַ/יַּֽעֲזֹ֥ב אֶתְ/כֶֽם
  choice: Sapagkat pinabayaan ninyo si Yahweh, kaya pinabayaan din niya kayo
  rationale: Inuulit ang “pinabayaan” upang mapanatili ang sinadyang katumbasan ng dalawang anyo ng עזב.
theological_decisions:
- issue: Paglilipat sa יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Hayagang ginagamit ng Hebreo ang Tetragrammaton; pinananatili ng “Yahweh” ang personal at tipanang pangalan nang hindi ito pinapalitan ng titulo.
- issue: Pagkatao o katangian ng רוּחַ אֱלֹהִים
  choice: Espiritu ng Diyos
  alternative: espiritu ng Diyos; espiritung mula sa Diyos
  rationale: Sa salaysay, ang Espiritu ang kumikilos upang bigyang-kapangyarihan si Zacarias sa propetikong pagsasalita. Hindi ipinapasok ng salin ang higit pang sistematikong paliwanag.
- issue: Ugnayan ng וְלֹא תַצְלִיחוּ sa naunang tanong
  choice: 'bunga: “Dahil dito, hindi kayo magtatagumpay”'
  alternative: 'koordinasyon: “at hindi kayo magtatagumpay”'
  rationale: Pinapaboran ng konteksto ang resultang kahulugan, ngunit tunay na posible ang payak na “at,” kaya inilalahad ang alternatibo sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang matingkad na metapora ng Hebreo sa “binalot,” ngunit nilinaw sa talababa ang literal na larawan ng pagbibihis. Ginamit ang “bayan” bilang kolektibong katawagan sa mga tao at ang pangalang “Yahweh” ayon sa ibinigay na patakaran.
