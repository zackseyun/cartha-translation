  to: 'At binihisan ng Espiritu ng Diyos si Zacarias na anak ng paring si Joiada[a]. Tumayo siya nang mataas sa harap ng bayan at sinabi sa kanila, “Ganito ang sinasabi ng Diyos: ‘Bakit ninyo nilalabag ang mga utos ni Yahweh? Dahil dito, hindi kayo magtatagumpay.[b] Sapagkat pinabayaan ninyo si Yahweh, kaya pinabayaan din niya kayo.’”'
