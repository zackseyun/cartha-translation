base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/021.yaml
  text: So they conspired against him and stoned him at the command of the king[c][b][a], in the court of the house of Yahweh.
translation:
  language: tl
  text: Kaya nagsabwatan sila laban sa kanya[a] at binato nila siya ng mga bato[b] sa utos ng hari, sa looban ng bahay ni Yahweh[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “nagbalak sila laban sa kanya.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “binato nila siya ng bato”; ang pananalitang ito ay tumutukoy sa pagbato bilang pagbitay.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring isalin na “sa bakuran ng templo ni Yahweh.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְשְׁרוּ עָלָיו
  choice: nagsabwatan sila laban sa kanya
  rationale: Ang קשר na may עַל ay tumutukoy sa sama-samang pakana laban sa isang tao. Likas at malinaw sa modernong Tagalog ang “nagsabwatan laban sa kanya.”
- source_word: וַיִּרְגְּמֻהוּ אֶבֶן
  choice: binato siya hanggang mamatay
  rationale: Ang רגם ay tumutukoy rito sa pagpatay sa pamamagitan ng pagbato. Iniiwasan ng salin ang malabong “binato” lamang at malinaw na ipinahahayag ang uri ng pagbitay, samantalang inilalagay sa talababa ang mas literal na anyo.
- source_word: בְּמִצְוַת
  choice: sa utos ng
  rationale: Ang מִצְוָה rito ay isang may-awtoridad na utos; natural na Tagalog ang “sa utos ng” at pinananatili nito ang pananagutan ng hari.
- source_word: הַמֶּלֶךְ
  choice: hari
  rationale: Pinananatili ang titulong ginamit ng Hebreo sa halip na ipalit ang pangalang Joas mula sa konteksto.
- source_word: בַּחֲצַר
  choice: sa looban
  rationale: Ang חָצֵר ay bakuran o looban ng isang gusali. Ang “looban” ay natural at angkop sa bakuran ng templo.
- source_word: בֵּית יְהוָה
  choice: bahay ni Yahweh
  rationale: Pinananatili ang kongkretong Hebreong idyomang “bahay ni Yahweh” sa halip na agad itong ipakahulugang “templo.”
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Nasa tekstong Hebreo ang Tetragrammaton; ang “Yahweh” ay tuwirang kumakatawan sa pangalang tipan at hindi ito pinapalitan ng isang titulo.
- issue: Kung dapat bang gawing tahasan ang kamatayan sa pagbato
  choice: binato siya hanggang mamatay
  alternative: binato siya
  rationale: Sa konteksto, ang רגם ay pagbitay sa pamamagitan ng pagbato. Nililinaw ito sa natural na Tagalog nang hindi nagdaragdag ng sanhi o motibong wala sa teksto.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “nagsabwatan,” “sa utos,” at “looban” bilang mga likas na parirala; pinanatili ang “bahay ni Yahweh” upang maging malapit sa Hebreong anyo.
