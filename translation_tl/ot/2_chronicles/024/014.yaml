  to: Nang matapos na sila, dinala nila sa harap ng hari at ni Jehoiada ang natitirang pilak. Mula rito ay gumawa siya[a] ng mga kagamitan para sa bahay ni Yahweh—mga kagamitan para sa paglilingkod[b] at sa paghahandog[c], mga mangkok, at mga kagamitang ginto at pilak. At palagi silang naghahandog ng mga handog na sinusunog sa bahay ni Yahweh sa buong buhay ni Jehoiada.
