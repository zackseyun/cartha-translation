  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וּֽ/כְ/כַלּוֹתָ֡/ם הֵבִ֣יאוּ לִ/פְנֵי֩ הַ/מֶּ֨לֶךְ וִֽ/יהוֹיָדָ֜ע אֶת שְׁאָ֣ר הַ/כֶּ֗סֶף וַ/יַּעֲשֵׂ֨/הוּ כֵלִ֤ים לְ/בֵית יְהוָה֙ כְּלֵ֣י שָׁרֵ֔ת וְ/הַעֲל֣וֹת וְ/כַפּ֔וֹת וּ/כְלֵ֥י זָהָ֖ב וָ/כָ֑סֶף וַ֠/יִּֽהְיוּ מַעֲלִ֨ים עֹל֤וֹת בְּ/בֵית יְהוָה֙ תָּמִ֔יד כֹּ֖ל יְמֵ֥י יְהוֹיָדָֽע־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/014.yaml
  text: When they had finished[a], they brought the rest of the silver before the king and Jehoiada, and with it he made articles for the house of Yahweh, articles for ministry and for offering up, and bowls, and articles of gold and silver[c][b]. And they were offering burnt offerings in the house of Yahweh continually all the days of Jehoiada.
translation:
  language: tl
  text: Nang matapos na sila, dinala nila sa harap ng hari at ni Jehoiada ang natitirang pilak. Mula rito ay gumawa siya[a] ng mga kagamitan para sa bahay ni Yahweh—mga kagamitan para sa paglilingkod[b] at sa paghahandog[c], mga mangkok, at mga kagamitang ginto at pilak. At palagi silang naghahandog ng mga handog na sinusunog sa bahay ni Yahweh sa buong buhay ni Jehoiada.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isahan ang pandiwang Hebreo at ang hulaping tumutukoy sa natitirang pilak; maaari ring isalin, “ginawa niya itong mga kagamitan.”
    reason: Nililinaw ang gramatikal na isahan at ang posibleng mas literal na ayos nang hindi tinutukoy kung sino mismo ang gumawang-kamay.
  - marker: b
    text: Maaari ring “para sa paglilingkod sa templo.”
    reason: Nililinaw ang kontekstong pangkulto ng שָׁרֵת nang hindi ito ipinapasok nang tahasan sa pangunahing teksto.
  - marker: c
    text: Sa Hebreo, “para sa pagpapaitaas” o “para sa paghahandog”; hindi sinabi rito kung ano ang inihahandog.
    reason: Pinananatili ang kawalan ng tahasang layon at ang lexical na larawan ng עלה.
lexical_decisions:
- source_word: וּכְכַלּוֹתָם
  choice: Nang matapos sila
  rationale: Ang infinitive construct na may hulaping pangmaramihan ay nagpapahayag ng panahong natapos nila ang gawain; natural at tuwiran ito sa modernong Tagalog.
- source_word: שְׁאָר הַכֶּסֶף
  choice: ang natitirang pilak
  rationale: Ang שְׁאָר ay ang nalabi, at sa kontekstong gumagawa ng mga kagamitang metal, pinananatili ng “pilak” ang materyal na kahulugan ng כֶּסֶף.
- source_word: וַיַּעֲשֵׂהוּ
  choice: Mula rito ay gumawa siya
  rationale: Isahan ang pandiwa at ang hulaping tumutukoy sa natitirang pilak. Hindi tinutukoy ng salin kung ang hari, si Jehoiada, o isang kinatawan ang mismong gumawa.
- source_word: כֵלִים
  choice: mga kagamitan
  rationale: Malawak ang saklaw ng salitang Hebreo at maaaring tumukoy sa mga kasangkapan o sisidlang ginagamit sa templo.
- source_word: כְּלֵי שָׁרֵת
  choice: mga kagamitan para sa paglilingkod
  rationale: Ipinahihiwatig ng שָׁרֵת ang paglilingkod sa kontekstong pangtemplo; malinaw at hindi labis na teknikal ang “paglilingkod.”
- source_word: וְהַעֲלוֹת
  choice: at sa paghahandog
  rationale: Ang infinitive ng עלה ay tumutukoy rito sa paghahandog, ngunit walang tahasang layon sa parirala; hindi pa ipinapasok dito ang “mga handog na sinusunog.”
- source_word: וְכַפּוֹת
  choice: mga mangkok
  rationale: Isang malawak at karaniwang salin para sa kagamitang pangkulto na hindi nagpapasya sa eksaktong hugis nito.
- source_word: וּכְלֵי זָהָב וָכָסֶף
  choice: mga kagamitang ginto at pilak
  rationale: Tuwirang pinananatili ang pagtukoy sa dalawang materyal nang hindi nagdaragdag kung paano ginawa ang mga kagamitan.
- source_word: וַיִּהְיוּ מַעֲלִים עֹלוֹת ... תָּמִיד
  choice: At palagi silang naghahandog ng mga handog na sinusunog
  rationale: Ang participial na ayos kasama ng תָּמִיד ay nagpapahayag ng patuloy o nakaugaliang paghahandog, hindi lamang ng isang pangyayari.
- source_word: בְּבֵית יְהוָה
  choice: sa bahay ni Yahweh
  rationale: Pinananatili ang literal na larawang “bahay” at ang pangalang tipan na YHWH bilang Yahweh.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: ang PANGINOON
  rationale: Pangalan mismo ang nasa tekstong Hebreo; pinananatili ito bilang “Yahweh” sa halip na palitan ng isang titulo.
- issue: Uri at tagal ng paghahandog sa huling sugnay
  choice: palagi silang naghahandog ng mga handog na sinusunog ... sa buong buhay ni Jehoiada
  alternative: naghandog sila ... sa panahon ni Jehoiada
  rationale: Ang participle, תָּמִיד, at כֹּל יְמֵי ay magkakasamang nagpapahiwatig ng regular at nagpapatuloy na gawain sa lahat ng araw ng buhay ni Jehoiada.
- issue: Hindi tahasang layon ng וְהַעֲלוֹת
  choice: sa paghahandog
  alternative: sa paghahandog ng mga handog na sinusunog
  rationale: Hindi pinangalanan ang layon sa unang parirala, kaya hindi ito tahasang tinutukoy bilang handog na sinusunog kahit lumilitaw iyon sa susunod na pangungusap.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “bahay ni Yahweh” upang mapanatili ang Hebreong larawan, “mga kagamitan” bilang malawak na katawagan, at “palagi silang naghahandog” upang natural na maipahayag ang nagpapatuloy na gawaing pangkulto.
