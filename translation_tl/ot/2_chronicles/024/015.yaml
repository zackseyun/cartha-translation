base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/015.yaml
  text: And Jehoiada grew old and was full of days[a], and he died. He was one hundred and thirty years old at his death.
translation:
  language: tl
  text: Tumanda si Joiada at nabuhay nang lubos[a], at namatay siya. Siya ay isanda't tatlumpung taong gulang nang mamatay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O, “nabuhay nang ganap.” Literal sa Hebreo: “siya ay puspos ng mga araw.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְקַן
  choice: Tumanda
  rationale: Ipinahahayag ng pandiwa ang pag-abot o pagsulong sa katandaan; natural sa modernong Tagalog ang “tumanda” at napapanatili nito ang prosesong diwa.
- source_word: יְהוֹיָדָע
  choice: Joiada
  rationale: Ginamit ang karaniwang anyong Tagalog ng pangalang Hebreo.
- source_word: וַיִּשְׂבַּע יָמִים
  choice: nalubos ang kaniyang mga araw
  rationale: Pinananatili nito ang larawang Hebreo ng ganap o hustong haba ng buhay, sa halip na tahasang bigyang-kahulugan bilang kasiyahan o tagumpay sa buhay.
- source_word: וַיָּמֹת
  choice: namatay siya
  rationale: Tuwirang salin ng pandiwa sa sunod-sunod na salaysay; malinaw at natural ang hayag na panghalip sa Tagalog.
- source_word: בֶּן מֵאָה וּשְׁלֹשִׁים שָׁנָה
  choice: Isang daan at tatlumpung taon ang kaniyang edad
  rationale: Isinasalin ang pormulang Hebreo para sa edad sa likas na paraan sa Tagalog nang hindi ginagaya ang literal na “anak ng.”
- source_word: בְּמוֹתוֹ
  choice: nang mamatay siya
  rationale: Natural na temporal na pagpapahayag sa Tagalog para sa edad niya sa oras ng kaniyang kamatayan.
