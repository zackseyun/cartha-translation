  text: In the eighteenth year of Josiah’s reign[a], this Passover was kept.
translation:
  language: tl
  text: Sa ikalabingwalong taon ng paghahari ni Josias, ipinagdiwang ang Paskuwang ito.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ipinangilin ang Paskuwang ito”; mas literal, “ginawa ang Paskuwang ito.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּשְׁמוֹנֶה עֶשְׂרֵה שָׁנָה
  choice: Sa ikalabingwalong taon
  rationale: Ang בְּ na kasama ng bilang at שָׁנָה ay isang pormulang panahunan; natural at tumpak sa Filipino ang “Sa ikalabingwalong taon.”
- source_word: לְמַלְכוּת יֹאשִׁיָּהוּ
  choice: ng paghahari ni Josias
  rationale: Tinutukoy ng parirala ang panahon ng pamumuno bilang hari. Ang “paghahari ni Josias” ay likas at malinaw na katumbas sa modernong Filipino.
- source_word: נַעֲשָׂה
  choice: ipinagdiwang
  rationale: Bagaman literal na “ginawa,” kapag kasama ang פֶּסַח ay tumutukoy ito sa pagsasagawa o pagdiriwang ng Paskuwa. Ang “ipinagdiwang” ay natural sa Filipino, habang inilalahad sa talababa ang mas literal na anyo.
- source_word: הַפֶּסַח
  choice: ang Paskuwa
  rationale: Ang “Paskuwa” ang nakaugaliang katawagan sa Filipino para sa kapistahang פֶּסַח, nang hindi nagdaragdag ng salitang wala sa Hebreo.
- source_word: הַזֶּה
  choice: ito
  rationale: Itinuturo ng demonstratibo ang partikular na Paskuwang inilarawan sa naunang konteksto; tuwirang pinananatili ito ng “ito.”
