  text: And they slaughtered the Passover lamb[a], and the priests splashed the blood from their hands[c][b], while the Levites were skinning them.
translation:
  language: tl
  text: Kinatay nila ang mga hayop na handog sa Paskuwa[a]. Isinaboy naman ng mga pari ang dugong iniabot sa kanila[b], habang binabalatan ng mga Levita ang mga hayop[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “ang handog para sa Paskuwa.” Tumutukoy ang Hebreo sa hayop o mga hayop na kinatay bilang handog sa Paskuwa.
    reason: lexical_alternative
  - marker: b
    text: Literal na “mula sa kanilang kamay.” Ang pandiwang isinaling “isinaboy” ay karaniwang terminong pansakripisyo para sa paglalapat ng dugo sa altar; maaari rin itong isaling “wininiwisik.”
    reason: lexical_and_cultural_note
  - marker: c
    text: Ibig sabihin, inaalis ng mga Levita ang balat ng mga kinatay na hayop na ihahandog.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁחֲטוּ
  choice: Kinatay nila
  rationale: Ang שׁחט ay karaniwang pandiwa para sa ritwal na pagkatay ng mga hayop na ihahandog. Likas at malinaw sa modernong Filipino ang “kinatay” at napapanatili nito ang kontekstong pansakripisyo.
- source_word: הַפָּסַח
  choice: ang mga hayop na handog sa Paskuwa
  rationale: Sa kontekstong ito, tumutukoy ang פֶּסַח sa hayop o mga hayop na kinatay bilang handog sa Paskuwa, hindi lamang sa kapistahan. Hindi nilimitahan sa “kordero” sapagkat maaaring tumukoy ang konteksto sa mga hayop na pampaskuwa nang sama-sama.
- source_word: וַיִּזְרְקוּ
  choice: Isinasaboy
  rationale: Sa paghahandog, ang זרק ay teknikal na salita para sa paglalapat ng dugo sa altar sa pamamagitan ng paghagis o pagsaboy. Mas tumpak dito ang “isinasaboy” kaysa sa banayad na “wininiwisik.”
- source_word: הַכֹּהֲנִים
  choice: ng mga pari
  rationale: Karaniwang salin ng כֹּהֲנִים sa konteksto ng paglilingkod sa templo.
- source_word: מִיָּדָם
  choice: ang dugong iniabot sa kanila
  rationale: Literal na “mula sa kanilang kamay.” Ipinahihiwatig ng idyoma at ng ritwal na tinanggap ng mga pari ang dugo mula sa mga nagkatay. Ginawang natural sa Filipino nang hindi tahasang pinangalanan kung sino ang tinutukoy ng hulaping panghalip.
- source_word: וְהַלְוִיִּם
  choice: habang ... ng mga Levita
  rationale: Ipinakikita ng pang-ugnay at participle ang kasabay na kilos; natural na ipinahahayag ito sa Filipino sa pamamagitan ng “habang.”
- source_word: מַפְשִׁיטִים
  choice: binabalatan ... ang mga hayop
  rationale: Sa kontekstong pansakripisyo, ang participle mula sa פשט ay nangangahulugang pag-aalis ng balat ng mga kinatay na hayop. Malinaw at pangkaraniwan ang “binabalatan” sa modernong Filipino.
