  naturalness: Likas ang “kinatay,” “mga pari,” “mga Levita,” at “binabalatan.” Ang pare-parehong aspekto ng salaysay (“Kinatay … isinaboy … habang binabalatan”) ay mas maayos sa modernong Filipino kaysa sa paghahalo ng “Kinatay” at “Isinasaboy.”
  terminology: Ang “Paskuwa,” “mga pari,” “mga Levita,” at “altar” ay angkop na bokabularyong biblikal. Ang “isinasaboy”/“isinaboy” ay sapat na teknikal ngunit nauunawaan, at ang talababa ay wastong nagtatala ng alternatibong “wininiwisik.”
