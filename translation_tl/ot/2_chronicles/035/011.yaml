translation_notes:
  register: Modernong Filipino na malinaw, marangal, at madaling maunawaan. Ginamit ang “Paskuwa,” “mga pari,” at “mga Levita” bilang pamilyar na bokabularyong biblikal. Pinanatili sa talababa ang literal na anyo at bahagyang kalabuan ng מִיָּדָם, samantalang ginawang likas sa pangunahing teksto ang ritwal na daloy ng mga kilos.
