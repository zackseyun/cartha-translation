    rationale: Ang וּדְבָרָיו ay “ang kaniyang mga gawa/usapin/salita,” hindi tahasang “ang iba pa niyang mga ginawa.” Bagama’t maaaring idiomatiko ito sa konteksto, nagdaragdag ito ng kahulugang hindi ipinahahayag ng talata.
