translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang emphatic na “narito,” ngunit inayos ang pangungusap upang maging likas sa Filipino. Ang gitling ay naghihiwalay sa saklaw na pariralang “mula sa una hanggang sa huli” mula sa pahayag tungkol sa nakasulat na sanggunian.
