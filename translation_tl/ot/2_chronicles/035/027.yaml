- from: Ang iba pang mga ginawa niya, mula sa una hanggang sa huli—narito, nakasulat ang mga iyon sa Aklat ng mga Hari ng Israel at Juda.[a]
  to: Ang mga ginawa niya[a], mula una hanggang huli—narito, ang mga ito ay nakasulat sa Aklat[b] ng mga Hari ng Israel at Juda.
  rationale: Inalis ang dagdag na “iba pang” upang hindi magpasok ng kahulugang wala sa Hebreo. Nilinaw ang pagtukoy ng panghalip at inayos ang mga talababa upang maitala kapwa ang saklaw ng דְּבָרָיו at ang posibleng “balumbon” para sa סֵפֶר, nang hindi binabago ang kahulugan ng talata.
