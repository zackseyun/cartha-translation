  text: וּ/דְבָרָ֕י/ו הָ/רִאשֹׁנִ֖ים וְ/הָ/אַחֲרֹנִ֑ים הִנָּ֣/ם כְּתוּבִ֔ים עַל סֵ֥פֶר מַלְכֵֽי יִשְׂרָאֵ֖ל וִ/יהוּדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/027.yaml
  text: His acts[a], first and last, behold[c][b], they are written in the Book of the Kings of Israel and Judah.
translation:
  language: tl
  text: Ang mga ginawa niya[a], mula una hanggang huli—narito, ang mga ito ay nakasulat sa Aklat[b] ng mga Hari ng Israel at Juda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga salita,” “mga usapin,” o “mga gawa niya.” Ang salitang Hebreo ay maaaring tumukoy sa mga salita, usapin, o mga ginawa; sa buod tungkol sa hari, “mga ginawa” ang pinakaangkop.
    reason: lexical_alternative
  - marker: b
    text: O “sa balumbon/aklat ng mga Hari ng Israel at Juda.” Literal na “sa ibabaw ng”; ang “sa” ang karaniwang Filipino para sa nilalaman ng isang nakasulat na tala.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּדְבָרָיו
  choice: ang iba pang mga ginawa niya
  rationale: Maaaring mangahulugan ang דְּבָרִים ng mga salita, bagay, usapin, o ginawa. Sa pangwakas na buod tungkol sa isang hari, likas sa Filipino ang “mga ginawa niya.” Ginamit ang “iba pang” bilang natural na pang-ugnay sa naunang tala, bagaman hindi ito hiwalay na leksikal na elemento sa Hebreo.
- source_word: הָרִאשֹׁנִים וְהָאַחֲרֹנִים
  choice: mula sa una hanggang sa huli
  rationale: Pinananatili nito ang pormulang sumasaklaw sa buong panahon ng mga ginawa ni Josias, habang mas natural kaysa sa literal na “ang mga una at ang mga huli.”
- source_word: הִנָּם
  choice: narito
  rationale: Pinananatili ang pantawag-pansing diin ng Hebreong particle sa isang marangal ngunit nauunawaang paraang Filipino.
- source_word: כְּתוּבִים
  choice: nakasulat
  rationale: Tuwirang katumbas ng pasibong anyo ng כתב at angkop sa pormulang tumutukoy sa isang nakasulat na sanggunian.
- source_word: עַל סֵפֶר
  choice: sa Aklat
  rationale: Bagaman literal na “sa ibabaw ng balumbon/aklat,” ang “sa Aklat” ang natural na Filipino para sa impormasyong nasa isang nakasulat na tala. Ipinaliliwanag sa talababa ang posibilidad na “balumbon.”
- source_word: מַלְכֵי יִשְׂרָאֵל וִיהוּדָה
  choice: ng mga Hari ng Israel at Juda
  rationale: Itinuturing itong pamagat ng binanggit na sanggunian; kaya ginamit ang malaking titik sa “Aklat” at “Hari.”
