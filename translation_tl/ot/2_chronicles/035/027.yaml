    rationale: Ang pangunahing saling “mga ginawa” ay angkop sa konteksto, ngunit maaari ring mangahulugan ang termino ng mga salita, usapin, o mga gawa; makatutulong ang isang maikling talababa upang mapanatili ang audit trail.
  - severity: low
    issue: Ang kasalukuyang talababa ay nagsasabing “balumbon tungkol sa mga hari,” na mas maluwag kaysa sa “Aklat/balumbon ng mga Hari.”
    rationale: Ang konstruksiyon ay tumutukoy sa aklat o talaan na kaugnay ng mga hari bilang pamagat/identipikasyon; mas tumpak na panatilihin ang “ng mga Hari.”
