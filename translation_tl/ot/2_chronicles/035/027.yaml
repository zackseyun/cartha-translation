  naturalness: Natural at marangal ang binagong pangungusap sa modernong Filipino. Ang ayos na “narito, ang mga ito ay nakasulat” ay mas malinaw kaysa sa pagkakasunod na maaaring magmukhang hindi tiyak ang tinutukoy ng “mga iyon.”
  terminology: Ang “Aklat ng mga Hari ng Israel at Juda” ay angkop bilang pamagat ng tinutukoy na tala. Ang “mga ginawa” ay mabuting pangunahing salin sa kontekstong buod ng paghahari, ngunit nilalagyan ng talababa upang hindi maitago ang mas malawak na saklaw ng דְּבָרִים.
