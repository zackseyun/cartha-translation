  text: He appointed the priests to their duties and strengthened them for the service of the house of Yahweh[a][b].
translation:
  language: tl
  text: Itinalaga niya ang mga pari sa kani-kanilang tungkulin[a] at pinalakas[b] sila para sa paglilingkod sa bahay ni Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa kani-kanilang pangkat,” “sa kani-kanilang puwesto,” o mas literal, “sa kani-kanilang pagbabantay.”
    reason: lexical_alternative
  - marker: b
    text: O “pinalakas ang loob nila.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֵד
  choice: Itinalaga niya
  rationale: Ang Hiphil ng עמד ay tumutukoy sa paglalagay ng isang tao sa itinakdang posisyon. Likas sa modernong Tagalog ang “itinalaga” at angkop ito sa pag-oorganisa ni Josias sa mga pari.
- source_word: הַכֹּהֲנִים
  choice: ang mga pari
  rationale: Karaniwang salin ng כהנים, at pinananatili ang tiyak na anyo ng parirala.
- source_word: עַל מִשְׁמְרוֹתָם
  choice: sa kani-kanilang tungkulin
  rationale: Ang מִשְׁמָרוֹת ay maaaring tumukoy sa mga takdang puwesto, pangkat, pagbabantay, o gawain sa paglilingkod. Malinaw at natural sa konteksto ang “kani-kanilang tungkulin,” habang inilalahad sa talababa ang mga alternatibo.
- source_word: וַיְחַזְּקֵם
  choice: at pinalakas sila
  rationale: Maaaring mangahulugan ang Piel ng חזק na palakasin, patatagin, o palakasin ang loob. Pinananatili ng “pinalakas” ang malawak na diwa at ang tunay na posibilidad ng higit sa isang pagbasa.
- source_word: לַעֲבוֹדַת
  choice: para sa paglilingkod
  rationale: Ang עֲבוֹדָה ay gawain o paglilingkod, lalo na rito ang paglilingkod na may kaugnayan sa templo.
- source_word: בֵּית יְהוָה
  choice: bahay ni Yahweh
  rationale: Pinananatili ang Hebreong idyomang “bahay” para sa templo at tuwirang isinasalin ang pangalang יְהוָה bilang “Yahweh.”
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang ginagamit ng talata ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal at tipanang pangalan sa halip na palitan ito ng isang titulo.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “kani-kanilang” upang idiomatikong ipahayag ang maramihang takdang gawain, at iniwasan ang labis na teknikal o denominasyonal na pananalita.
