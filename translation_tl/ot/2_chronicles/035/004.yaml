  source_fidelity: Tumpak na naipapahayag ng salin ang utos na maghanda at mag-ayos batay sa mga sambahayan ng angkan at mga nakatalagang pangkat. Ang “gaya ng itinakda sa kasulatan” ay isang katanggap-tanggap na pagpapahayag ng pagsunod sa nakasulat na tagubilin, at malinaw na naiuugnay si Solomon bilang anak ni David.
  naturalness: Likas, malinaw, at marangal ang modernong Filipino. Ang “Ihanda ninyo ang inyong sarili” at “mga sambahayan ng inyong mga ninuno” ay angkop sa kontekstong pang-organisasyon at pangkultong sinauna nang hindi nagiging labis na teknikal.
  terminology: Ang “mga sambahayan” para sa בֵּית־אָבוֹת at “mga pangkat” para sa מַחְלְקוֹת ay mahusay na pangunahing mga termino. Wasto ring pinanatili ang “hari ng Israel” at ang ugnayang “anak niyang si Solomon.” Ang mga talababa ay kapaki-pakinabang at wastong nakaangkla sa mga salitang nililinaw nila.
