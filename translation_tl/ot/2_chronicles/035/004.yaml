  text: וְ/הָכִ֥ונוּ לְ/בֵית אֲבוֹתֵי/כֶ֖ם כְּ/מַחְלְקוֹתֵי/כֶ֑ם בִּ/כְתָ֗ב דָּוִיד֙ מֶ֣לֶךְ יִשְׂרָאֵ֔ל וּ/בְ/מִכְתַּ֖ב שְׁלֹמֹ֥ה בְנֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/004.yaml
  text: Prepare yourselves by your fathers’ houses according to your divisions[b][a], as prescribed in the writing of David king of Israel and in the writing of Solomon his son.
translation:
  language: tl
  text: Ihanda ninyo ang inyong sarili ayon sa mga sambahayan ng inyong mga ninuno[a] at sa inyong mga pangkat[b], gaya ng itinakda sa kasulatan ni David na hari ng Israel at sa kasulatan ng anak niyang si Solomon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang pariralang Hebreo ay tumutukoy sa mga sambahayan o pangkat ng angkan na nakabatay sa linya ng ama sa loob ng Israel.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isaling “mga dibisyon” o “mga turno,” lalo na para sa organisadong paglilingkod ng mga pari at Levita.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָכִינוּ
  choice: Ihanda ninyo ang inyong sarili
  rationale: Ang Hiphil imperative plural ng כון ay humihiling ng aktibong paghahanda o pag-aayos. Likas at malinaw sa modernong Filipino ang pariralang ito sa kontekstong pang-organisasyon at panrelihiyon.
- source_word: לְבֵית אֲבוֹתֵיכֶם
  choice: ayon sa mga sambahayan ng inyong mga ninuno
  rationale: Ang בֵית אָבוֹת ay tumutukoy sa mga sambahayan o yunit ng angkan na nakabatay sa linya ng ama. Pinananatili ng salin ang sinaunang kaayusang panlipunan nang hindi gumagamit ng di-likas na literalismong 'bahay ng mga ama.'
- source_word: כְּמַחְלְקוֹתֵיכֶם
  choice: at sa inyong mga pangkat
  rationale: Ang מַחְלְקוֹת ay mga organisadong dibisyon o nakatalagang pangkat, lalo na ng mga pari at Levita. Mas madaling maunawaan ng karaniwang mambabasa ang 'mga pangkat' kaysa 'mga dibisyon' o 'mga turno'; nilinaw ng talababa ang teknikal na diwa.
- source_word: בִּכְתָב
  choice: gaya ng itinakda sa kasulatan ni
  rationale: Ang כְּתָב ay isang nakasulat na dokumento, at ipinahihiwatig ng ב dito ang pagsunod sa nakasulat na tuntunin. Ipinapahayag ng 'gaya ng itinakda sa kasulatan' ang puwersang ito nang natural.
- source_word: דָּוִיד מֶלֶךְ יִשְׂרָאֵל
  choice: David na hari ng Israel
  rationale: Tuwirang pinananatili ang maharlikang titulo sa likas na ayos ng Filipino.
- source_word: וּבְמִכְתַּב
  choice: at sa kasulatan ng
  rationale: Ang מִכְתָּב ay isa ring nakasulat na dokumento. Dala na ng naunang 'gaya ng itinakda' ang diwa ng pagsunod, kaya mas natural at hindi paulit-ulit ang pinaikling ikalawang parirala.
- source_word: שְׁלֹמֹה בְנוֹ
  choice: anak niyang si Solomon
  rationale: Malinaw na si Solomon ang anak ni David. Ang ayos na ito ay natural sa Filipino at pinananatili ang ugnayang pampamilya.
theological_decisions: []
