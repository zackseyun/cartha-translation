source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר לַ֠/לְוִיִּם ה/מבונים לְ/כָל יִשְׂרָאֵ֜ל הַ/קְּדוֹשִׁ֣ים לַ/יהוָ֗ה תְּנ֤וּ אֶת אֲרוֹן הַ/קֹּ֨דֶשׁ֙ בַּ֠/בַּיִת אֲשֶׁ֨ר בָּנָ֜ה שְׁלֹמֹ֤ה בֶן דָּוִיד֙ מֶ֣לֶךְ יִשְׂרָאֵ֔ל אֵין לָ/כֶ֥ם מַשָּׂ֖א בַּ/כָּתֵ֑ף עַתָּ֗ה עִבְדוּ֙ אֶת יְהוָ֣ה אֱלֹֽהֵי/כֶ֔ם וְ/אֵ֖ת עַמּ֥/וֹ יִשְׂרָאֵֽל־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/003.yaml
  text: And he said to the Levites who taught all Israel[a], who were holy to Yahweh, “Put the holy ark in the house that Solomon son of David, king of Israel, built. You no longer have to carry it on your shoulders[c][b]. Now serve Yahweh your God and his people Israel.”
translation:
  language: tl
  text: Sinabi niya sa mga Levita na nagtuturo sa buong Israel[a] at banal kay Yahweh, “Ilagay ninyo ang banal na kaban sa bahay[b] na itinayo ni Solomon na anak ni David, ang hari ng Israel. Hindi na ninyo kailangang pasanin ito sa inyong mga balikat[c]. Ngayon, paglingkuran ninyo si Yahweh na inyong Diyos at ang kanyang bayang Israel.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga Levitang nagbibigay ng pagkaunawa sa buong Israel,” “mga Levitang may pagkaunawa,” o “mga Levitang naturuan para sa buong Israel.” Maaaring tumukoy ang salitang Hebreo sa pagkakaroon ng pagkaunawa o sa pagbibigay ng pagkaunawa o pagtuturo.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “bahay”; ang tinutukoy ay ang templong itinayo ni Solomon.
    reason: cultural_note
  - marker: c
    text: Sa literal, “Wala kayong pasanin sa balikat.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמְבִינִים
  choice: na nagtuturo
  rationale: Ang anyong mula sa בין ay maaaring tumukoy sa mga may pagkaunawa, naturuan, o nagbibigay ng pagkaunawa. Sa konteksto ng tungkulin ng mga Levita para sa buong Israel, natural at malamang ang diwang “nagtuturo,” habang inilalahad sa talababa ang tunay na kalabuan.
- source_word: הַקְּדוֹשִׁים לַיהוָה
  choice: mga banal kay Yahweh
  rationale: Pinananatili nito ang wikang kultiko ng kabanalan at ang katayuan ng mga Levita bilang nakalaan o nakatalaga kay Yahweh, nang hindi pinapalitan agad ng mas mapagpaliwanag na “itinalaga.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang transliterasyon ng personal na pangalang banal sa halip na palitan ito ng titulong “Panginoon.”
- source_word: תְּנוּ אֶת־אֲרוֹן הַקֹּדֶשׁ בַּבַּיִת
  choice: Ilagay ninyo ang banal na kaban sa bahay
  rationale: Sa kontekstong ito, ang נתן ay nangangahulugang ilagay. Pinananatili ng “bahay” ang literal na בית, samantalang nililinaw ng kasunod na sugnay at talababa na templo ni Solomon ang tinutukoy.
- source_word: אֲרוֹן הַקֹּדֶשׁ
  choice: banal na kaban
  rationale: Likas itong parirala sa Filipino at pinananatili ang diin sa kabanalan ng kaban.
- source_word: אֵין לָכֶם מַשָּׂא בַּכָּתֵף
  choice: Hindi na ninyo kailangang pasanin ito sa inyong mga balikat
  rationale: Malinaw nitong ipinahahayag sa modernong Filipino ang idyomang Hebreo at ang pisikal na larawan ng pagpasan, habang ibinibigay sa talababa ang mas literal na anyo.
- source_word: עַתָּה עִבְדוּ
  choice: Ngayon, paglingkuran ninyo
  rationale: Ang עבד ay maaaring mangahulugang maglingkod o gumanap ng banal na paglilingkod. Sapat ang lawak ng “paglingkuran” para saklawin ang paglilingkod kapwa kay Yahweh at sa kanyang bayan.
- source_word: וְאֶת־עַמּוֹ יִשְׂרָאֵל
  choice: at ang kanyang bayang Israel
  rationale: Natural sa Filipino at malinaw na ipinakikilala ang Israel bilang bayan ni Yahweh.
theological_decisions:
- issue: Paglalarawan sa papel ng mga Levita sa הַמְבִינִים
  choice: mga Levita na nagtuturo sa buong Israel
  alternative: mga Levitang may pagkaunawa; mga Levitang naturuan para sa buong Israel; mga Levitang nagbibigay ng pagkaunawa sa buong Israel
  rationale: Pinakamalamang sa konteksto ang gawaing pagtuturo, ngunit maraming posibleng diwa ang anyong Hebreo. Hindi inaalis ang kalabuan; tahasan itong inilalahad sa talababa.
- issue: Paglalarawan sa mga Levita bilang הַקְּדוֹשִׁים לַיהוָה
  choice: mga banal kay Yahweh
  alternative: mga itinalaga kay Yahweh
  rationale: Pinananatili ng “banal” ang mismong teolohikal at kultikong salita ng teksto. Ang diwang paglalaan o pagtatalaga ay kasama rito ngunit hindi ipinapalit bilang tanging pagpapakahulugan.
- issue: Pagsasalin sa pangalang יְהוָה
  choice: Yahweh
  alternative: Panginoon; Jehovah
  rationale: Ang tekstong Hebreo ay gumagamit ng Tetragrammaton, kaya pinananatili bilang personal na pangalang “Yahweh” sa halip na palitan ng isang titulo.
translation_notes:
  register: Modernong Filipino na marangal ngunit tuwiran. Ginamit ang “kaban,” “banal,” at “paglingkuran” bilang pamilyar na bokabularyong panrelihiyon, habang iniwasan ang lumang balangkas ng pangungusap. Ang lahat ng talababa ay may katugmang pananda sa pangunahing teksto.
