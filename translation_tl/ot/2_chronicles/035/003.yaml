  to: Sinabi niya sa mga Levita na nagtuturo sa buong Israel[a] at banal kay Yahweh, “Ilagay ninyo ang banal na kaban sa bahay[b] na itinayo ni Solomon na anak ni David, ang hari ng Israel. Hindi na ninyo kailangang pasanin ito sa inyong mga balikat[c]. Ngayon, paglingkuran ninyo si Yahweh na inyong Diyos at ang kanyang bayang Israel.”
  rationale: Inayos lamang ang sintaksis ng unang paglalarawan sa mga Levita upang maging malinaw na kapwa “nagtuturo sa buong Israel” at “banal kay Yahweh” ay mga panuring sa kanila. Inilipat din ang pananda ng talababa c bago ang tuldok, ayon sa karaniwang pagkakalagay ng pananda sa salin. Walang binagong kahulugan o idinagdag na interpretasyon.
