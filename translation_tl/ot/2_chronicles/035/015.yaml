reference: 2 Chronicles 35:15
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/הַ/מְשֹֽׁרֲרִ֨ים בְּנֵי אָסָ֜ף עַל מַעֲמָדָ֗/ם כְּ/מִצְוַ֤ת דָּוִיד֙ וְ/אָסָ֞ף וְ/הֵימָ֤ן וִֽ/ידֻתוּן֙ חוֹזֵ֣ה הַ/מֶּ֔לֶךְ וְ/הַ/שֹּׁעֲרִ֖ים לְ/שַׁ֣עַר וָ/שָׁ֑עַר אֵ֣ין לָ/הֶ֗ם לָ/סוּר֙ מֵ/עַ֣ל עֲבֹֽדָתָ֔/ם כִּֽי אֲחֵי/הֶ֥ם הַ/לְוִיִּ֖ם הֵכִ֥ינוּ לָ/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/015.yaml
  text: And the singers[a], the sons of Asaph, were at their stations according to the command of David, Asaph, Heman, and Jeduthun the king’s seer; and the gatekeepers were at each gate. They had no need to depart from their service[b], because their brothers the Levites prepared for them.
translation:
  language: tl
  text: Ang mga mang-aawit, na mga anak ni Asaf, ay nasa kani-kanilang puwesto, ayon sa utos ni David, ni Asaf, ni Heman, at ni Jedutun na tagakita ng hari.[a] Ang mga tagapagbantay sa mga pintuan ay nasa bawat pintuan. Hindi nila kailangang lumisan mula sa kanilang paglilingkod, sapagkat naghanda para sa kanila ang kanilang mga kapatid na Levita.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “tagakita ng hari” ay pinakanatural na tumutukoy kay Jedutun.
    reason: syntactical_attachment
  - marker: b
    text: O, “Hindi sila dapat lumisan mula sa kanilang paglilingkod.” Maaaring basahin nang mas mariin ang Hebreo, ngunit ipinahihiwatig ng kasunod na sugnay na hindi nila kailangang umalis sapagkat naghanda para sa kanila ang mga Levita.
    reason: alternative_reading
lexical_decisions:
- source_word: הַמְשֹׁרֲרִים
  choice: mga mang-aawit
  rationale: Tuwirang tumutukoy ang anyong participle mula sa שׁיר sa mga umaawit; mas tiyak ito kaysa sa mas malawak na “mga musikero.”
- source_word: בְּנֵי אָסָף
  choice: mga anak ni Asaf
  rationale: Pinananatili ang literal at makasaysayang katawagang tumutukoy sa angkan o pangkat na kaugnay ni Asaf.
- source_word: עַל מַעֲמָדָם
  choice: nasa kani-kanilang puwesto
  rationale: Ipinahihiwatig ng מַעֲמָד ang nakatalagang puwesto; likas sa Filipino ang distributibong “kani-kanilang” sa organisadong paglilingkod.
- source_word: כְּמִצְוַת
  choice: ayon sa utos ni
  rationale: Ipinapahayag ng מִצְוָה ang isang may-awtoridad na tagubilin; malinaw at natural ang “utos” sa konteksto.
- source_word: חוֹזֵה הַמֶּלֶךְ
  choice: tagakita ng hari
  rationale: Ang חוֹזֶה ay teknikal na katawagan sa isang seer; pinananatili ng “tagakita” ang pagkakaiba nito sa pangkalahatang “propeta.”
- source_word: הַשֹּׁעֲרִים
  choice: mga bantay ng pintuan
  rationale: Tumutukoy ito sa mga nakatalaga sa mga pintuan ng templo; malinaw at karaniwan sa modernong Filipino ang parirala.
- source_word: לְשַׁעַר וָשָׁעַר
  choice: nasa bawat pintuan
  rationale: Tumpak na ipinapahayag ng “bawat” ang distributibong Hebreong pananalita.
- source_word: אֵין לָהֶם לָסוּר
  choice: Hindi nila kailangang umalis
  rationale: Mas pinapaboran ng kayarian at ng kasunod na sanhi ang kawalan ng pangangailangang umalis kaysa isang tahasang pagbabawal.
- source_word: מֵעַל עֲבֹדָתָם
  choice: sa kanilang paglilingkod
  rationale: Sa konteksto ng templo, ang עֲבֹדָה ay nakatalagang sagradong paglilingkod, hindi lamang pangkalahatang trabaho.
- source_word: אֲחֵיהֶם הַלְוִיִּם
  choice: kanilang mga kapatid na Levita
  rationale: Pinananatili ang tahasang “mga kapatid” at ang appositional na pagkakakilanlan bilang mga Levita.
- source_word: הֵכִינוּ לָהֶם
  choice: ipinaghanda sila
  rationale: Isinasalin ang ideya ng paghahanda para sa kanila nang hindi tinutukoy ang bagay na hindi hayagang binanggit sa Hebreo.
theological_decisions:
- issue: Pagkakaugnay ng “tagakita ng hari”
  choice: 'Ikinakabit ang parirala kay Jedutun: “Jedutun na tagakita ng hari.”'
  alternative: Maaaring iugnay nang mas maluwag ang titulo sa naunang talaan ng mga pangalan.
  rationale: Ang isahang pariralang חוֹזֵה הַמֶּלֶךְ ay pinakanatural na tumutukoy sa agad na nauunang isahang pangalang Jedutun; pasyang panggramatika at pangkasaysayan ito, hindi pangdoktrina.
- issue: Diwa ng אֵין לָהֶם לָסוּר
  choice: 'Kawalan ng pangangailangang umalis: “Hindi nila kailangang umalis.”'
  alternative: 'Mas mariing pagbabawal: “Hindi sila dapat umalis sa kanilang paglilingkod.”'
  rationale: Ang אֵין na sinusundan ng infinitive ay maaaring magpahayag ng kawalan ng pangangailangan o pagkakataon. Sinusuportahan ito ng kasunod na paliwanag na ipinaghanda sila ng mga Levita.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa pampublikong pagbasa. Ginamit ang “kani-kanilang puwesto,” “paglilingkod,” at “tagakita” upang mapanatili ang konteksto ng organisadong paglilingkod sa templo at ang teknikal na katawagan sa Hebreo.
