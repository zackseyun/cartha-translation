  to: Ang mga mang-aawit, na mga anak ni Asaf, ay nasa kani-kanilang puwesto, ayon sa utos ni David, ni Asaf, ni Heman, at ni Jedutun na tagakita ng hari.[a] Ang mga tagapagbantay sa mga pintuan ay nasa bawat pintuan. Hindi nila kailangang lumisan mula sa kanilang paglilingkod, sapagkat naghanda para sa kanila ang kanilang mga kapatid na Levita.[b]
  rationale: Inayos ang pananalita upang maging mas natural at mas tiyak ang ugnayan ng pag-alis at ng nakatalagang paglilingkod, nang hindi binabago ang saklaw o kahulugan ng Hebreo. Inilipat din ang talababa tungkol sa mas mariing alternatibong pagbasa sa sugnay na aktuwal nitong nililinaw; ang talababa tungkol kay Jedutun ay nananatili sa “tagakita ng hari.”
