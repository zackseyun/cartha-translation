base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/016.yaml
  text: So all the service of Yahweh was prepared on that day, to keep the Passover and to offer burnt offerings on the altar of Yahweh, according to the command of King Josiah.
translation:
  language: tl
  text: Kaya, noong araw na iyon, naisaayos ang buong paglilingkod kay Yahweh upang ipagdiwang ang Paskuwa at maghandog ng mga handog na sinusunog nang buo sa altar ni Yahweh, ayon sa utos ni Haring Josias.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתִּכּוֹן
  choice: naisaayos
  rationale: 'Pinananatili nito ang diwang pasibo at resultativo ng Niphal: ang buong gawain sa pagsamba ay nailagay sa wastong kaayusan at kahandaan noong araw na iyon.'
- source_word: כָּל עֲבוֹדַת יְהוָה
  choice: ang buong paglilingkod kay Yahweh
  rationale: Sa kontekstong pangtemplo, ang עֲבוֹדָה ay tumutukoy sa paglilingkod o gawaing kaugnay ng pagsamba. Ang “paglilingkod kay Yahweh” ay likas sa Filipino at hindi ito nililimitahan sa gawain lamang ng mga pari.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin ang Tetragrammaton bilang personal na pangalang “Yahweh,” sa halip na palitan ito ng isang titulo.
- source_word: בַּיּוֹם הַהוּא
  choice: nang araw na iyon
  rationale: Likas na panandang temporal sa Filipino na pinananatili ang pagtukoy sa tiyak na araw.
- source_word: לַעֲשׂוֹת הַפֶּסַח
  choice: upang ipagdiwang ang Paskuwa
  rationale: Ang literal na “gawin ang Paskuwa” ay isang idyoma para sa rituwal na pagdiriwang o pagtupad nito; malinaw at natural ang “ipagdiwang” sa kasalukuyang Filipino.
- source_word: וְהַעֲלוֹת עֹלוֹת
  choice: at maghandog ng mga handog na sinusunog nang buo
  rationale: Ito ang karaniwang idyomang pansakripisyo para sa pag-aalay ng עֹלָה. Nililinaw ng “sinusunog nang buo” ang natatanging uri ng handog nang hindi ginagawa itong katawagang denominasyonal.
- source_word: עַל מִזְבַּח יְהוָה
  choice: sa altar ni Yahweh
  rationale: Direkta at natural na paglalarawan sa altar na pinaghahandugan at nauugnay kay Yahweh.
- source_word: כְּמִצְוַת
  choice: ayon sa utos
  rationale: Tumutukoy rito ang מִצְוָה sa tiyak na tagubilin ng hari, kaya ang “utos” ang malinaw na katumbas.
- source_word: הַמֶּלֶךְ יֹאשִׁיָּהוּ
  choice: Haring Josias
  rationale: Ginagamit ang likas na ayos ng titulong maharlika sa Filipino at ang nakaugaliang anyong Filipino ng pangalang Josiah.
theological_decisions:
- issue: Paglalarawan sa עֲבוֹדַת יְהוָה
  choice: paglilingkod kay Yahweh
  alternative: gawain ni Yahweh
  rationale: Ang parirala ay tumutukoy sa gawaing pagsamba sa templo. Iniiwasan ng salin ang posibleng maling pahiwatig na si Yahweh mismo ang gumagawa, habang hindi nililimitahan ang paglilingkod sa isang partikular na pangkat.
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Nasa tekstong Hebreo ang personal na pangalang tipan; pinananatili ito bilang “Yahweh” sa halip na palitan ng titulo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Paskuwa” bilang kinikilalang katawagang biblikal at ipinaliwanag sa mismong teksto ang uri ng handog bilang “sinusunog nang buo.”
