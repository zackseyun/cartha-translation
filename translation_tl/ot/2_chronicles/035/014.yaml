translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Pinanatili ang bokabularyong pansakripisyo at ang genealogical na pariralang “mga anak ni Aaron,” habang ang di-tiyak na referent ng לָהֶם ay inilalahad sa talababa.
