base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/014.yaml
  text: Afterward they prepared for themselves and for the priests[a], because the priests, the sons of Aaron, were occupied in offering up the burnt offering and the fat portions until night. So the Levites prepared for themselves and for the priests, the sons of Aaron.
translation:
  language: tl
  text: Pagkatapos, naghanda sila para sa kanilang sarili at para sa mga pari,[a] sapagkat ang mga pari, ang mga anak ni Aaron, ay abala sa paghahandog ng handog na sinusunog at ng mga bahaging taba hanggang sa maggabi. Kaya naghanda ang mga Levita para sa kanilang sarili at para sa mga pari, ang mga anak ni Aaron.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “para sa kanila” sa dalawang paglitaw ng “para sa kanilang sarili.” Hindi tahasang reflexive ang panghalip sa Hebreo, ngunit mariing ipinahihiwatig ng konteksto na naghanda ang mga Levita para sa sarili nilang pagkain pati na para sa mga pari.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחַר
  choice: Pagkatapos
  rationale: Likas at malinaw na panandang temporal sa modernong Tagalog na nagpapanatili sa pagkakasunod-sunod ng mga pangyayari.
- source_word: הֵכִינוּ
  choice: naghanda
  rationale: Pinananatili ang malawak na kahulugan ng Hiphil ng כון—maghanda o gawing handa—nang hindi tahasang idinaragdag na pagkain ang inihanda.
- source_word: לָהֶם
  choice: para sa kanilang sarili
  rationale: Sa konteksto, ang mga Levita ang paksa at malamang na naghanda rin sila ng para sa sarili nila; ipinapaliwanag sa talababa na hindi tahasang reflexive ang panghalip sa Hebreo.
- source_word: וְלַכֹּהֲנִים
  choice: at para sa mga pari
  rationale: Tuwirang ipinahahayag ang karagdagang pangkat na ipinaghanda.
- source_word: כִּי
  choice: sapagkat
  rationale: Malinaw na ipinakikilala ang dahilan ng ginawa ng mga Levita at angkop sa marangal na register.
- source_word: הַכֹּהֲנִים בְּנֵי אַהֲרֹן
  choice: ang mga pari na mga anak ni Aaron
  rationale: Pinananatili ang appositional at genealogical na katawagan ng Hebreo nang hindi gumagamit ng teknikal na salitang denominasyonal.
- source_word: בְּהַעֲלוֹת
  choice: ay abala sa paghahandog
  rationale: Ipinakikita ang nagpapatuloy na gawaing sakripisyal na dahilan kung bakit hindi nakapaghanda ang mga pari para sa sarili nila.
- source_word: הָעוֹלָה
  choice: ang handog na sinusunog
  rationale: Malinaw at karaniwang salin ng terminong pansakripisyong עֹלָה sa Filipino.
- source_word: וְהַחֲלָבִים
  choice: at ng mga taba
  rationale: Tumutukoy sa mga bahaging taba ng hain na inihahandog sa altar; maikli at malapit sa anyo ng Hebreo.
- source_word: עַד לָיְלָה
  choice: hanggang gabi
  rationale: Natural sa modernong Filipino at nagsasaad na nagpatuloy ang gawain hanggang sa panahon ng gabi.
- source_word: וְהַלְוִיִּם
  choice: Kaya naghanda ang mga Levita
  rationale: Ang “Kaya” ay natural na ipinakikita ang pagpapatuloy at bunga matapos ang paliwanag na nagsisimula sa כִּי.
