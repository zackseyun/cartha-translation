source:
  edition: WLC
  text: וְ/לֹֽא הֵסֵב֩ יֹאשִׁיָּ֨הוּ פָנָ֜י/ו מִמֶּ֗/נּוּ כִּ֤י לְ/הִלָּחֵֽם בּ/וֹ֙ הִתְחַפֵּ֔שׂ וְ/לֹ֥א שָׁמַ֛ע אֶל דִּבְרֵ֥י נְכ֖וֹ מִ/פִּ֣י אֱלֹהִ֑ים וַ/יָּבֹ֕א לְ/הִלָּחֵ֖ם בְּ/בִקְעַ֥ת מְגִדּֽוֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/022.yaml
  text: But Josiah did not turn his face away from him[a]; rather, he disguised himself to fight against him. He did not listen to the words of Neco from the mouth of God[c][b], and he came to fight in the Valley of Megiddo.
translation:
  language: tl
  text: Ngunit hindi tumalikod sa kanya si Josias[a]. Sa halip, nagbalatkayo siya upang labanan siya. Hindi niya pinakinggan ang mga salita ni Neco na mula sa bibig ng Diyos[b], at dumating siya upang makipaglaban sa Lambak ng Megido[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa literal: “hindi niya inilayo ang kanyang mukha sa kanya.”'
    reason: lexical_alternative
  - marker: b
    text: 'O “na nagmula sa Diyos.” Sa literal: “mula sa bibig ng Diyos.”'
    reason: lexical_alternative
  - marker: c
    text: O “sa Kapatagan ng Megido.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵסֵב ... פָנָיו מִמֶּנּוּ
  choice: hindi tumalikod sa kanya
  rationale: Likas at malinaw ito sa modernong Tagalog, habang pinananatili ang diwa ng hindi paglayo o pag-urong ni Josias. Inilalagay sa talababa ang mas literal na larawan ng pag-ilayo ng mukha.
- source_word: כִּי
  choice: sa halip
  rationale: Sa konteksto, ipinakikilala nito ang ginawa ni Josias bilang kabaligtaran ng pagtalikod, hindi bilang isang tuwirang sanhi.
- source_word: לְהִלָּחֵם בּוֹ
  choice: upang labanan siya
  rationale: Ipinahahayag ng infinitive ang layunin, at ang בּוֹ ay tumutukoy sa pakikipaglaban laban kay Neco.
- source_word: הִתְחַפֵּשׂ
  choice: nagbalatkayo siya
  rationale: Tumpak at maikli itong katumbas ng pandiwang reflexive na nangangahulugang magkunwaring ibang tao o magtago ng tunay na pagkakakilanlan.
- source_word: שָׁמַע אֶל
  choice: pinakinggan
  rationale: Pinananatili nito ang malawak na kahulugang makinig o magbigay-pansin, nang hindi agad nililimitahan sa tahasang pagsunod.
- source_word: דִּבְרֵי נְכוֹ
  choice: mga salita ni Neco
  rationale: Malapit ito sa anyo ng Hebreo at hindi dinaragdagan ng interpretasyong nakapaloob sa salitang “mensahe.”
- source_word: מִפִּי אֱלֹהִים
  choice: mula sa bibig ng Diyos
  rationale: Pinananatili ang tahasang idyoma ng Hebreo at ang pahayag na ang mga salita ni Neco ay nagmula sa Diyos.
- source_word: וַיָּבֹא
  choice: dumating siya
  rationale: Tuwirang katumbas ito ng pandiwang בוא at angkop sa sunod na pariralang nagsasaad ng layunin.
- source_word: בְּבִקְעַת מְגִדּוֹ
  choice: sa Lambak ng Megido
  rationale: Ang בִּקְעָה ay malawak na lambak o kapatagan; malinaw ang “Lambak ng Megido,” habang nananatiling posibleng alternatibo ang “kapatagan.”
theological_decisions:
- issue: Kung ang mga salita ni Neco ay inilalahad bilang tunay na nagmula sa Diyos
  choice: Pinanatili ang “mula sa bibig ng Diyos.”
  alternative: Maaaring gawing mas idyomatiko bilang “mula sa Diyos” o “ayon sa utos ng Diyos.”
  rationale: Tahasang inilalahad ng talata ang mga salita ni Neco bilang nagmula sa Diyos. Hindi dapat pahinain ng salin ang pahayag na ito o lutasin ang teolohikal na tensiyon sa pamamagitan ng pag-aalinlangan na wala naman sa teksto.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “nagbalatkayo” bilang maikli at karaniwang salita, at pinanatili ang Hebreong idyomang “mula sa bibig ng Diyos” dahil mahalaga ito sa teolohikal na diin ng talata.
