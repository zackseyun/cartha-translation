  text: וַֽ/יְבַשְּׁל֥וּ הַ/פֶּ֛סַח בָּ/אֵ֖שׁ כַּ/מִּשְׁפָּ֑ט וְ/הַ/קֳּדָשִׁ֣ים בִּשְּׁל֗וּ בַּ/סִּיר֤וֹת וּ/בַ/דְּוָדִים֙ וּ/בַ/צֵּ֣לָח֔וֹת וַ/יָּרִ֖יצוּ לְ/כָל בְּנֵ֥י הָ/עָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/013.yaml
  text: They cooked the Passover lamb in the fire according to the rule[a], and they boiled the holy offerings in pots, kettles, and bowls, and quickly brought them to all the people.
translation:
  language: tl
  text: Niluto nila sa apoy ang kordero ng Paskuwa ayon sa itinakdang tuntunin[a]. Pinakuluan naman nila sa mga palayok, malalaking kaldero, at mangkok ang mga banal na handog, at dali-dali nilang dinala ang mga iyon sa lahat ng tao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O mas tiyak, “inihaw sa apoy ang kordero ng Paskuwa.” Maaaring mangahulugan ang pandiwang Hebreo ng “magluto” sa malawak na diwa, ngunit itinakda sa kautusan ng Paskuwa na ihawin ito sa apoy at huwag pakuluan (tingnan ang Exodo 12:8–9).
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבַשְּׁלוּ
  choice: Niluto
  rationale: Malawak ang kahulugan ng בשׁל at maaaring tumukoy sa pagluluto o pagpapakulo. Dito, nililinaw ng pariralang 'sa apoy ayon sa itinakdang tuntunin' ang paraang itinakda para sa Paskuwa nang hindi pinakikitid ang pandiwa.
- source_word: הַפֶּסַח
  choice: ang kordero ng Paskuwa
  rationale: Sa kontekstong ito ng paghahanda at pagluluto, tumutukoy ang 'Paskuwa' sa hayop na inihandog at kinain; nililinaw ng 'kordero ng Paskuwa' ang kongkretong tinutukoy sa natural na Tagalog.
- source_word: בָּאֵשׁ
  choice: sa apoy
  rationale: Tuwirang salin na pinananatili ang paraan ng pagluluto nang hindi nagdaragdag ng detalye.
- source_word: כַּמִּשְׁפָּט
  choice: ayon sa itinakdang tuntunin
  rationale: Ipinahahayag nito ang legal at ritwal na kahulugan ng מִשְׁפָּט sa malinaw at kasalukuyang Tagalog.
- source_word: וְהַקֳּדָשִׁים
  choice: ang mga banal na handog
  rationale: Tumutukoy ito sa iba pang itinalagang handog na naiiba sa kordero ng Paskuwa; higit na malinaw ito kaysa sa literal na 'mga banal na bagay.'
- source_word: בִּשְּׁלוּ
  choice: Pinakuluan
  rationale: Ang mga sisidlang kasunod ay sumusuporta sa kahulugang pagpapakulo at lumilikha ng likas na kaibahan sa Paskuwang niluto sa apoy.
- source_word: בַּסִּירוֹת וּבַדְּוָדִים וּבַצֵּלָחוֹת
  choice: sa mga palayok, malalaking kaldero, at mangkok
  rationale: Mga natural na katumbas sa modernong Tagalog; ipinahihiwatig ng דְּוָדִים ang mas malaking sisidlan, samantalang hindi tiyak ang eksaktong hugis ng צֵלָחוֹת.
- source_word: וַיָּרִיצוּ
  choice: dali-dali nilang dinala
  rationale: Naipapahayag kapwa ang pagdadala at ang pagmamadaling taglay ng pandiwa.
- source_word: לְכָל בְּנֵי הָעָם
  choice: sa buong bayan
  rationale: Idyomatikong tumutukoy ang parirala sa lahat ng taong naroroon, hindi lamang sa mga anak na lalaki.
theological_decisions:
- issue: Posibleng tensiyon sa בשׁל at sa kautusan na ihawin sa apoy ang handog na Paskuwa
  choice: Isinalin ang unang pandiwa sa malawak na paraang 'niluto,' habang ang 'sa apoy ayon sa itinakdang tuntunin' ang tumutukoy sa legal na paraan.
  alternative: Isalin nang tahasan bilang 'inihaw,' o isalin ang dalawang pandiwa nang pareho bilang 'pinakuluan/niluto.'
  rationale: Pinananatili nito ang saklaw ng pandiwang Hebreo at ang pagkakaiba sa mismong talata sa pagitan ng Paskuwang niluto sa apoy at ng ibang handog na pinakuluan sa mga sisidlan.
- issue: Tinutukoy ng 'mga banal na handog'
  choice: Itinuring itong ibang mga itinalagang handog bukod sa kordero ng Paskuwa.
  alternative: Ituring itong pangkalahatang tawag sa lahat ng banal na pagkain, kasama ang Paskuwa.
  rationale: Pinaghihiwalay ng ayos ng pangungusap ang Paskuwa at ang mga banal na handog, at pinagtitibay ito ng magkaibang paraan ng pagluluto.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang 'Paskuwa' bilang pamilyar na terminong biblikal; iniwasan ang labis na arkaikong pananalita at pinanatili sa talababa ang tunay na leksikal na saklaw ng unang pandiwa.
