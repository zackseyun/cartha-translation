  to: Niluto nila sa apoy ang kordero ng Paskuwa ayon sa itinakdang tuntunin[a]. Pinakuluan naman nila sa mga palayok, malalaking kaldero, at mangkok ang mga banal na handog, at dali-dali nilang dinala ang mga iyon sa lahat ng tao.
