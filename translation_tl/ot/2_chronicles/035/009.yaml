  terminology: Ang “mga Levita,” “mga pinuno,” “nag-ambag,” at “mga handog sa Paskuwa” ay angkop sa modernong marangal na rehistro. Ang “hayop” para sa di-tahasang ipinangalan na limang libo ay maingat at hindi labis na nililimitahan ang mga ito sa tupa o kambing.
