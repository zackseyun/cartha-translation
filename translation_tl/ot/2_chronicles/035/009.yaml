  text: ו/כונניהו וּ/שְׁמַֽעְיָ֨הוּ וּ/נְתַנְאֵ֜ל אֶחָ֗י/ו וַ/חֲשַׁבְיָ֧הוּ וִ/יעִיאֵ֛ל וְ/יוֹזָבָ֖ד שָׂרֵ֣י הַ/לְוִיִּ֑ם הֵרִ֨ימוּ לַ/לְוִיִּ֤ם לַ/פְּסָחִים֙ חֲמֵ֣שֶׁת אֲלָפִ֔ים וּ/בָקָ֖ר חֲמֵ֥שׁ מֵאֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/009.yaml
  text: Conaniah[a], and Shemaiah and Nethanel his brothers, and Hashabiah and Jeiel and Jozabad, the chiefs of the Levites, contributed to the Levites for the Passover offerings five thousand and five hundred head of cattle.
translation:
  language: tl
  text: Si Conanias[a], kasama ang kanyang mga kapatid na sina Semaias at Netanel, at sina Hasabias, Jeiel, at Jozabad, na mga pinuno ng mga Levita, ay nag-ambag sa mga Levita ng limang libong hayop para sa mga handog sa Paskuwa, at limang daang baka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Conanyahu.” Ang Hebreong pangalan ay כונניהו; ang “Conanias” ay ang nakaugaliang anyong Filipino, samantalang ang “Conanyahu” ay mas malapit na transliterasyon.
    reason: lexical_alternative
lexical_decisions:
- source_word: כונניהו
  choice: Conanias
  rationale: Ginamit ang nakaugaliang anyong Filipino ng pangalang Hebreo, alinsunod sa tradisyon ng mga pangalang biblikal sa Tagalog.
- source_word: שְׁמַעְיָהוּ
  choice: Semaias
  rationale: Ginamit ang natural at nakaugaliang anyong Filipino ng pangalan.
- source_word: נְתַנְאֵל
  choice: Netanel
  rationale: Malapit na transliterasyon mula sa Hebreo at madaling basahin sa Filipino.
- source_word: אֶחָיו
  choice: mga kapatid niya
  rationale: Pinanatili ang tuwirang kahulugang pampamilya; hindi ito pinalawak sa 'mga kamag-anak' kahit maaari itong gamitin nang mas malawak sa ilang konteksto.
- source_word: חֲשַׁבְיָהוּ
  choice: Hasabias
  rationale: Ginamit ang anyong Filipino ng pangalang Hebreo.
- source_word: יעיאל
  choice: Jeiel
  rationale: Tuwirang transliterasyon na malinaw at madaling makilala sa Filipino.
- source_word: יוֹזָבָד
  choice: Jozabad
  rationale: Tuwirang transliterasyon ng personal na pangalan.
- source_word: שָׂרֵי הַלְוִיִּם
  choice: mga pinuno ng mga Levita
  rationale: Ang 'mga pinuno' ay natural sa modernong Filipino at pinananatili ang opisyal na tungkulin ng שָׂרִים nang hindi gumagamit ng makalumang 'mga prinsipe.'
- source_word: הֵרִימוּ
  choice: nag-ambag
  rationale: Sa kontekstong ito, ang Hiphil ng רום ay tumutukoy sa pagbibigay bilang ambag o kaloob, hindi sa literal na pag-aangat.
- source_word: לַלְוִיִּם
  choice: sa mga Levita
  rationale: Malinaw na ipinakikita ng parirala ang mga tumanggap ng ambag.
- source_word: לַפְּסָחִים
  choice: para sa mga handog sa Paskuwa
  rationale: Ang maramihang anyo ay malamang na tumutukoy sa mga hayop na inilaan sa pagdiriwang o paghahain sa Paskuwa, hindi sa maraming kapistahan.
- source_word: חֲמֵשֶׁת אֲלָפִים וּבָקָר חֲמֵשׁ מֵאוֹת
  choice: limang libong hayop ... at limang daang baka
  rationale: Pinananatili ang pagkakaiba sa Hebreo sa pagitan ng unang bilang, na walang tahasang pangngalang hayop sa talata ngunit nauunawaang tumutukoy sa maliliit na hayop para sa Paskuwa, at ng limang daang baka. Ang 'hayop' ay hindi labis na tumutukoy lamang sa tupa o kambing.
theological_decisions:
- issue: Pagpapakahulugan sa maramihang לַפְּסָחִים
  choice: mga handog sa Paskuwa
  alternative: mga hain sa Paskuwa; mga hayop para sa Paskuwa; mga Paskuwa
  rationale: Ipinahihiwatig ng konteksto ang mga hayop na inilaan para sa ritwal ng Paskuwa. Iniiwasan ng 'mga handog' ang di-natural na literal na 'mga Paskuwa' at hindi rin nililimitahan ang salita sa mga kordero lamang.
translation_notes:
  register: Modernong, marangal, at madaling maunawaang Filipino. Ginamit ang 'Paskuwa' at 'mga Levita' bilang pamilyar na bokabularyong biblikal. Inayos ang pangungusap upang maging natural sa Tagalog habang pinananatili ang mga pangkat ng pangalan at ang pagkakaiba ng limang libong hayop at limang daang baka.
