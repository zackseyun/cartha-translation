base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/006.yaml
  text: Slaughter the Passover lamb[a], consecrate yourselves, and prepare for your brothers[b], to do according to the word of Yahweh by the hand of Moses.
translation:
  language: tl
  text: Katayin ninyo ang kordero ng Paskuwa[a], italaga ninyo ang inyong sarili, at gumawa kayo ng paghahanda para sa inyong mga kapatid, upang maisagawa ang ayon sa salita ni Yahweh sa pamamagitan ni Moises.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mas literal, “ang Paskuwa.” Dito, tumutukoy ito sa hayop na inihahandog sa Paskuwa.
    reason: lexical_alternative
  - marker: b
    text: Mas literal, “sa kamay ni Moises.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׁחֲטוּ
  choice: Katayin ninyo
  rationale: Ang שׁחט ay tumutukoy sa pagkatay ng hayop, lalo na sa kontekstong paghahandog; pinananatili ng “katayin” ang rituwal na diwa nang natural sa Tagalog.
- source_word: הַפָּסַח
  choice: ang kordero ng Paskuwa
  rationale: Literal itong “ang Paskuwa,” ngunit sa konteksto ay ang hayop na kinakatay para sa Paskuwa. Ginagawang hayag ng “kordero ng Paskuwa” ang ipinahihiwatig na handog.
- source_word: וְהִתְקַדְּשׁוּ
  choice: italaga ninyo ang inyong sarili
  rationale: Ang reflexive na anyo ay tumutukoy sa paghahanda o pagtatalaga ng sarili para sa banal na paglilingkod.
- source_word: וְהָכִינוּ
  choice: ihanda ninyo ito
  rationale: Ang כון sa hiphil ay “ihanda.” Walang hayag na layon sa Hebreo; ang “ito” ay tumutukoy sa handog na Paskuwa at nagbibigay ng likas na daloy sa Tagalog.
- source_word: לַאֲחֵיכֶם
  choice: para sa inyong mga kapatid
  rationale: Pinananatili ang pampamilyang katawagang “mga kapatid,” na sa konteksto ay tumutukoy sa kapuwa nila mga Israelita.
- source_word: לַעֲשׂוֹת
  choice: upang sundin
  rationale: Bagaman literal na “upang gawin,” ang kilos na tinutukoy ay pagsasagawa ng iniutos ni Yahweh; malinaw at natural sa Tagalog ang “upang sundin.”
- source_word: כִּדְבַר יְהוָה
  choice: ang salita ni Yahweh
  rationale: Pinananatili ng “salita” ang malawak na saklaw ng דָּבָר habang ipinahihiwatig ng pandiwang “sundin” ang awtoridad ng tagubilin.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin ang Tetragrammaton bilang personal na pangalang “Yahweh,” sa halip na palitan ito ng isang titulo.
- source_word: בְּיַד מֹשֶׁה
  choice: na ipinaabot sa pamamagitan ni Moises
  rationale: Ang literal na idyomang “sa kamay ni Moises” ay nagsasaad na si Moises ang tagapamagitan ng salita; natural itong ipinahahayag sa modernong Tagalog bilang “ipinaabot sa pamamagitan ni Moises.”
theological_decisions:
- issue: Saklaw ng לַאֲחֵיכֶם
  choice: para sa inyong mga kapatid
  alternative: para sa kapuwa ninyo mga Israelita
  rationale: Mas malapit sa anyong Hebreo ang “mga kapatid” at maaari pa ring tumukoy sa mas malawak na sambayanang tipan nang magdagdag ng interpretasyong wala sa mismong salita.
- issue: Paglalarawan sa הַפָּסַח
  choice: kordero ng Paskuwa
  alternative: Paskuwa / handog na Paskuwa
  rationale: Sa talatang ito, ang bagay na kakatayin ang tinutukoy. Nililinaw ng salin ang ipinahihiwatig na hayop habang inilalagay sa talababa ang mas literal na anyo.
- issue: Pangalan ng Diyos na יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Pinananatili ang personal na pangalan sa tekstong Hebreo at hindi ito pinapalitan ng titulo.
- issue: Kaugnayan ng לַעֲשׂוֹת sa pangungusap
  choice: upang sundin ang salita ni Yahweh
  alternative: upang gawin ayon sa salita ni Yahweh
  rationale: Ang “upang sundin” ay likas sa Tagalog at naghahayag ng pagsasagawa ng tagubilin, ngunit hindi nito tinutukoy nang lampas sa teksto kung ang ipinahihiwatig na simuno ay ang mga Levita o ang kanilang mga kapatid.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “katayin,” “italaga,” at “ipinaabot” upang mapanatili ang rituwal at mediatoryong diwa nang hindi maging salitang-salita o lipas. Ang lahat ng marker ng talababa ay nasa pangunahing teksto.
