  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יָּסִ֨ירוּ הָ/עֹלָ֜ה לְ֠/תִתָּ/ם לְ/מִפְלַגּ֤וֹת לְ/בֵית אָבוֹת֙ לִ/בְנֵ֣י הָ/עָ֔ם לְ/הַקְרִיב֙ לַ/יהוָ֔ה כַּ/כָּת֖וּב בְּ/סֵ֣פֶר מֹשֶׁ֑ה וְ/כֵ֖ן לַ/בָּקָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/012.yaml
  text: They removed the burnt offerings[a], to give them by divisions of the fathers’ houses to the sons of the people, to present to Yahweh, as it is written in the Book of Moses; and so also with the cattle.
translation:
  language: tl
  text: Inihiwalay nila ang mga handog na sinusunog upang ipamahagi ang mga iyon ayon sa mga pangkat ng mga angkan sa mga anak ng bayan[a], upang ihandog kay Yahweh, gaya ng nakasulat sa Aklat ni Moises. Gayundin ang ginawa nila sa mga baka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal na “mga anak ng bayan.” Tumutukoy ito sa pangkalahatang mamamayan, bilang kaiba sa mga pari at Levita.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּסִירוּ
  choice: Inihiwalay nila
  rationale: Ang hiphil ng סור ay nagpapahiwatig ng pag-aalis o pagbubukod mula sa kinalalagyan. Sa paghahanda ng mga hain, natural sa Filipino ang “inihiwalay” at hindi nito labis na tinutukoy ang eksaktong ritwal na hakbang.
- source_word: הָעֹלָה
  choice: ang mga handog na sinusunog
  rationale: Bagaman isahan ang anyong Hebreo, maaari itong gamitin nang kolektibo. Ang maramihan ay angkop sa konteksto ng maraming hain, at malinaw sa ordinaryong mambabasa ang “handog na sinusunog.”
- source_word: לְתִתָּם
  choice: upang ipamahagi ang mga iyon
  rationale: Literal itong “upang ibigay ang mga iyon,” ngunit dahil kasunod ang organisadong mga pangkat at tatanggap, mas likas at kontekstuwal ang “ipamahagi.”
- source_word: לְמִפְלַגּוֹת לְבֵית אָבוֹת
  choice: ayon sa mga pangkat ng mga angkan
  rationale: Ang מִפְלַגּוֹת ay mga pangkat o dibisyon, at ang בֵית אָבוֹת ay yunit ng angkan o sambahayang ninuno. Iniiwasan ng saling ito ang di-likas na literalismong “mga bahay ng mga ama” habang pinananatili ang kaayusang nakabatay sa angkan.
- source_word: לִבְנֵי הָעָם
  choice: sa mga anak ng bayan
  rationale: Pinananatili nito ang literal at kinatawang pananalitang “mga anak ng bayan,” na tumutukoy sa karaniwang mamamayan bilang kaiba sa mga pari at Levita. Nililinaw sa talababa ang kahulugan.
- source_word: לְהַקְרִיב לַיהוָה
  choice: para ihandog nila kay Yahweh
  rationale: Sa konteksto ng paghahain, ang הקריב ay natural na “ihandog.” Idinagdag ang hayag na “nila” bilang likas na paglilinaw sa Filipino sa layuning ang mga tatanggap ang maghahandog, nang hindi inaalis ang posibleng sintaktikong ugnayan.
- source_word: כַּכָּתוּב בְּסֵפֶר מֹשֶׁה
  choice: gaya ng nakasulat sa Aklat ni Moises
  rationale: Malapit ito sa pormulang Hebreo at natural sa modernong Filipino; ang “Aklat ni Moises” ay tumutukoy sa nakasulat na tagubiling Mosaic.
- source_word: וְכֵן לַבָּקָר
  choice: Gayundin ang ginawa nila sa mga baka
  rationale: Pinaikli ng Hebreo ang sugnay. Ang paglalantad sa ipinahiwatig na pandiwa ay kailangan para sa malinaw at natural na Filipino, habang nananatiling pareho ang pamamaraan para sa mga bakang hain.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Tuwirang ginagamit ng teksto ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalang tipan at hindi ito pinapalitan ng isang titulo.
- issue: Kinatawang pananalita sa לִבְנֵי הָעָם
  choice: mga anak ng bayan
  alternative: mga mamamayan; karaniwang mamamayan
  rationale: Pinananatili sa pangunahing teksto ang anyo ng Hebreo at ang pagkakaiba ng pangkalahatang bayan sa mga lingkod na pangkulto, habang ipinapaliwanag sa talababa na kolektibo ang saklaw nito.
- issue: Sino ang naghahandog sa pariralang לְהַקְרִיב
  choice: para ihandog nila
  alternative: upang ihandog kay Yahweh
  rationale: Pinakamalamang na ang layunin ng pamamahagi sa mga sambahayang pangkat ay upang maiharap nila ang mga handog. Gayunman, hindi tahasang nakasaad sa infinitibong Hebreo ang simuno; ang alternatibong mas impersonal ay nananatiling posible.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “angkan” para sa sinaunang yunit ng sambahayan at “mga anak ng bayan” upang mapanatili ang natatanging anyo ng Hebreo, na may paliwanag sa talababa. Iniwasan ang teknikal o denominasyonal na pananalita.
