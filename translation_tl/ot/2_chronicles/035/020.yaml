base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/020.yaml
  text: After all this[a], when Josiah had prepared the house, Neco king of Egypt went up to fight at Carchemish on the Euphrates[b], and Josiah went out to meet him.
translation:
  language: tl
  text: Pagkatapos ng lahat ng ito, nang maihanda na ni Josias ang templo[a], umakyat si Neco na hari ng Egipto upang makipaglaban sa Carquemis na nasa tabi ng Eufrates. Lumabas naman si Josias upang salubungin siya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal, “ang bahay,” na tumutukoy rito sa templo. Maaari ring isalin ang “maihanda” bilang “maisaayos.”
    reason: lexical_alternative
  - marker: b
    text: Sa kontekstong militar, ang “salubungin siya” ay maaari ring mangahulugang “harapin siya” o “lumabas laban sa kanya.”
    reason: alternative_reading
lexical_decisions:
- source_word: הֵכִין
  choice: maihanda
  rationale: Ang Hiphil ng כון ay maaaring mangahulugang ihanda, itatag, o isaayos. Ang “maihanda” ay malapit sa anyong Hebreo at natural sa kasalukuyang Tagalog, habang hindi nililimitahan ang diwa sa pisikal na pagkukumpuni lamang.
- source_word: הַבַּיִת
  choice: ang templo
  rationale: Literal itong “ang bahay,” ngunit sa konteksto ng Mga Cronica ay tumutukoy sa bahay ng Diyos, ang templo. Ginawang tahasan ang tinutukoy para madaling maunawaan ng karaniwang mambabasa; iniingatan sa talababa ang literal na anyo.
- source_word: עָלָה
  choice: umahon
  rationale: Pinananatili nito ang karaniwang diwa ng עלה na “umakyat/umahon” at hindi dinaragdagan ng mas tiyak na pandiwang militar gaya ng “nagmartsa.”
- source_word: לְהִלָּחֵם
  choice: upang makipaglaban
  rationale: Tuwirang inilalarawan ng anyo ng לחם ang pakikipaglaban o pagsabak sa labanan.
- source_word: בְּכַרְכְּמִישׁ
  choice: sa Carquemis
  rationale: 'Ang ב ay pinakamalamang na panandang panlunan dito: sa Carquemis naganap o nilayon ang labanan, hindi kinakailangang laban sa lunsod mismo.'
- source_word: עַל פְּרָת
  choice: sa tabi ng Eufrates
  rationale: Ang עַל sa heograpikong pariralang ito ay nagsasaad ng kinalalagyan ng Carquemis kaugnay ng Ilog Eufrates. Ang “sa tabi ng” ay natural at malinaw sa Tagalog.
- source_word: וַיֵּצֵא לִקְרָאתוֹ
  choice: Lumabas naman si Josias upang salubungin siya
  rationale: Ang לקראת ay maaaring mangahulugang sumalubong, humarap, o komprontahin. Pinananatili ng “salubungin” ang pangunahing diwa at ang bahagyang kalabuan ng Hebreo, habang ipinahihiwatig na ng konteksto ang sitwasyong militar.
theological_decisions:
- issue: Layunin ni Josias sa paglabas upang salubungin si Neco
  choice: Hindi tahasang tinukoy sa pangunahing teksto na sinalakay o kinompronta niya si Neco.
  alternative: “Lumabas si Josias laban sa kanya” o “upang harapin siya sa labanan.”
  rationale: Bagaman militar ang konteksto, ang לִקְרָאתוֹ ay hindi sa ganang sarili nagtatakda kung mapayapa o palaban ang pagsalubong. Ang talababa ang nagsasaad ng mas malakas na posibleng diwang militar nang hindi isinasara ang tunay na kalabuan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit payak. Ginamit ang karaniwang tradisyonal na baybay ng mga pangalang biblikal sa Tagalog—Josias, Neco, Egipto, Carquemis, at Eufrates. Hinati sa dalawang pangungusap upang maging malinaw at natural nang hindi binabago ang ugnayan ng mga sugnay.
