id: 2CH.35.5
reference: 2 Chronicles 35:5
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/עִמְד֣וּ בַ/קֹּ֗דֶשׁ לִ/פְלֻגּוֹת֙ בֵּ֣ית הָֽ/אָב֔וֹת לַ/אֲחֵי/כֶ֖ם בְּנֵ֣י הָ/עָ֑ם וַ/חֲלֻקַּ֥ת בֵּֽית אָ֖ב לַ/לְוִיִּֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/005.yaml
  text: And stand in the holy place according to the divisions of the fathers’ houses of your brothers[a], the sons of the people, and according to the division of a father’s house for the Levites.
translation:
  language: tl
  text: At tumayo kayo sa banal na lugar ayon sa mga pangkat ng mga angkan ng inyong mga kapatid[a], ang mga anak ng bayan, at ayon sa pangkat ng isang angkan para sa mga Levita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “inyong mga kapuwa Israelita.” Ang “mga anak ng bayan” ay literal na pananalita na dito ay tumutukoy sa mga Israelitang hindi Levita, bilang kaibahan sa mga Levita.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעִמְדוּ
  choice: At tumayo kayo
  rationale: Pinananatili ang pang-ugnay na וְ at ang tuwirang utos sa maramihan ng pandiwang עמד.
- source_word: בַקֹּדֶשׁ
  choice: sa banal na lugar
  rationale: Ipinahihiwatig ng pantukoy at pang-ukol ang isang tiyak na sagradong lugar; hindi nito labis na tinutukoy kung aling bahagi ng santuwaryo.
- source_word: לִפְלֻגּוֹת
  choice: ayon sa mga pangkat
  rationale: Ipinapahayag ng pangngalan ang organisadong mga pangkat o pagkakahati, at ng לִ ang pagsasaayos ayon sa mga iyon.
- source_word: בֵּית הָאָבוֹת
  choice: mga angkan
  rationale: Sa kontekstong talaangkanan, ang parirala ay tumutukoy sa mga sambahayang nagmula sa iisang ninuno; likas at malinaw sa makabagong Tagalog ang “angkan.”
- source_word: לַאֲחֵיכֶם
  choice: ng inyong mga kapatid
  rationale: Pinananatili ang wikang pampamilya na ginagamit para sa kapuwa mga Israelita at ang kaugnayan nito sa mga pangkat ng angkan.
- source_word: בְּנֵי הָעָם
  choice: ang mga anak ng bayan
  rationale: Malapit ito sa literal na anyo at pinananatili ang panlipunang pagtukoy sa mga Israelitang hindi Levita; nililinaw sa talababa ang kahulugan sa konteksto.
- source_word: וַחֲלֻקַּת
  choice: at ayon sa pangkat
  rationale: Pinananatili ang koordinasyon at isahang anyo habang ginagawang malinaw sa Tagalog ang paralel na kaayusan ng dalawang bahagi.
- source_word: בֵּית אָב
  choice: isang angkan
  rationale: Ang isahan ay pinananatiling kumakatawan sa isang yunit ng angkan, nang hindi ipinapalagay ang mas tiyak na estruktura kaysa sa sinasabi ng Hebreo.
- source_word: לַלְוִיִּם
  choice: para sa mga Levita
  rationale: Ipinapakita nito ang kaugnayan ng katumbas na pangkat sa mga Levita at pinananatili ang puwersa ng pang-ukol לַ.
theological_decisions:
- issue: Wikang pampamilya at katawagang panlipunan
  choice: Panatilihin ang “inyong mga kapatid” at “mga anak ng bayan” sa pangunahing teksto.
  alternative: “inyong mga kapuwa Israelita” o “mga karaniwang tao”
  rationale: Pinananatili ng salin ang larawang pampamilya at ang tunay na anyo ng katawagang Hebreo, habang ipinauunawa sa talababa ang pagkakaiba ng mga Israelitang hindi Levita at ng mga Levita nang hindi nagdaragdag ng denominasyonal na pakahulugan.
translation_notes:
  register: Makabago at marangal na Filipino ang ginamit. Pinili ang “angkan” bilang likas na katumbas ng teknikal na pariralang tumutukoy sa sambahayan ng mga ninuno, at pinanatili ang bahagyang pormal na “mga anak ng bayan” upang hindi burahin ang natatanging pananalita ng Hebreo.
