  text: וְ/שָׂרָ֞י/ו לִ/נְדָבָ֥ה לָ/עָ֛ם לַ/כֹּהֲנִ֥ים וְ/לַ/לְוִיִּ֖ם הֵרִ֑ימוּ חִלְקִיָּ֨ה וּ/זְכַרְיָ֜הוּ וִֽ/יחִיאֵ֗ל נְגִידֵי֙ בֵּ֣ית הָ/אֱלֹהִ֔ים לַ/כֹּהֲנִ֞ים נָתְנ֣וּ לַ/פְּסָחִ֗ים אַלְפַּ֨יִם֙ וְ/שֵׁ֣שׁ מֵא֔וֹת וּ/בָקָ֖ר שְׁלֹ֥שׁ מֵאֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/008.yaml
  text: And his officials contributed a freewill offering for the people[a], for the priests, and for the Levites. Hilkiah, Zechariah, and Jehiel, the leaders of the house of God[b], gave to the priests 2,600 Passover offerings and 300 cattle.
translation:
  language: tl
  text: At ang kanyang mga pinuno ay nagbigay ng kusang-loob na handog para sa mga tao[a], sa mga pari, at sa mga Levita. Sina Hilkias, Zacarias, at Jehiel, na mga pinuno ng bahay ng Diyos[b], ay nagbigay sa mga pari ng 2,600 handog para sa Paskuwa at 300 baka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “para sa mga handog sa Paskuwa.” Maaaring tumukoy ang pangmaramihang Hebreo sa mga hayop na gagamitin sa pagdiriwang ng Paskuwa.
    reason: lexical_alternative
  - marker: b
    text: 'O “na mga pinuno ng bahay ng Diyos, ay nagbigay sa mga pari para sa mga handog sa Paskuwa: 2,600 at 300 baka.”'
    reason: syntactic_alternative
lexical_decisions:
- source_word: וְשָׂרָיו
  choice: at ang kanyang mga pinuno
  rationale: Ang שָׂרִים ay tumutukoy sa matataas na pinuno o opisyal. Ang “mga pinuno” ay likas at marangal sa modernong Tagalog nang hindi nagpapahiwatig na sila ay mga anak ng hari.
- source_word: לִנְדָבָה ... הֵרִימוּ
  choice: kusang-loob na nag-ambag
  rationale: Pinagsasama ng parirala ang ideya ng boluntaryong kaloob at ng aktuwal na pag-aambag. Ang saling ito ay natural sa Tagalog at pinananatili ang kusang katangian ng handog.
- source_word: לָעָם לַכֹּהֲנִים וְלַלְוִיִּם
  choice: para sa mga tao, sa mga pari, at sa mga Levita
  rationale: Ang inuulit na ל ay nagmamarka sa mga pinaglaanan o makikinabang sa ambag.
- source_word: חִלְקִיָּה וּזְכַרְיָהוּ וִיחִיאֵל
  choice: Hilkias, Zacarias, at Jehiel
  rationale: Ginamit ang mga anyo ng pangalan na malinaw at pamilyar sa tradisyong Tagalog, habang nananatiling makikilala ang mga pangalang Hebreo.
- source_word: נְגִידֵי בֵּית הָאֱלֹהִים
  choice: mga pinuno sa bahay ng Diyos
  rationale: Ang נָגִיד ay maaaring mangahulugang pinuno o tagapangasiwa. Ang “mga pinuno” ay sapat na malawak upang hindi labis na tukuyin ang kanilang tungkulin; ang “bahay ng Diyos” ay pinananatili bilang tawag sa templo.
- source_word: לַפְּסָחִים
  choice: mga handog para sa Paskuwa
  rationale: Ang pangmaramihang anyo ay malamang na tumutukoy sa mga hayop o handog na gagamitin sa pagdiriwang ng Paskuwa, hindi sa maraming magkakahiwalay na kapistahan.
- source_word: אַלְפַּיִם וְשֵׁשׁ מֵאוֹת
  choice: 2,600
  rationale: Ginamit ang bilang para sa madaling pagbasa nang walang pagbabago sa kahulugan.
- source_word: וּבָקָר שְׁלֹשׁ מֵאוֹת
  choice: at 300 baka
  rationale: Ang בָּקָר ay kolektibong katawagan para sa mga hayop na mula sa bakahan. Ang “baka” ay karaniwang salitang Tagalog at hindi nililimitahan ang kahulugan sa mga kapon na toro.
theological_decisions:
- issue: Ang kaugnayan ng לָעָם sa kusang-loob na ambag
  choice: para sa mga tao
  alternative: para sa mga handog sa Paskuwa
  rationale: Ang payak na pagbasa sa tekstong Masoretiko ay tumuturing sa “mga tao” bilang pinaglaanan ng ambag, kaagapay ng mga pari at Levita. Gayunman, maaaring maunawaan sa konteksto na ang tinutukoy ay mga hayop para sa kanilang mga handog sa Paskuwa, kaya itinala ang posibilidad sa talababa.
- issue: Pagkakaugnay ng bilang at לַפְּסָחִים
  choice: 2,600 handog para sa Paskuwa at 300 baka
  alternative: para sa mga handog sa Paskuwa, 2,600, at 300 baka
  rationale: Ang pangunahing salin ay ginagawang tahasan ang malamang na ipinahihiwatig na binibilang na mga handog o hayop. Ang mas pormal na pagkakaugnay ng mga parirala ay nananatiling posibleng basahin at inilagay sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “Paskuwa” bilang pamilyar na katawagang biblikal, “mga Levita” para sa pangkat panrelihiyon, at “bahay ng Diyos” upang mapanatili ang konkretong metapora ng Hebreo. Ang “kusang-loob na nag-ambag” ay mas natural kaysa sa literal na “nagtaas bilang kusang handog.”
