  text: וַ/יַּ֨עַשׂ יֹאשִׁיָּ֧הוּ בִֽ/ירוּשָׁלִַ֛ם פֶּ֖סַח לַ/יהוָ֑ה וַ/יִּשְׁחֲט֣וּ הַ/פֶּ֔סַח בְּ/אַרְבָּעָ֥ה עָשָׂ֖ר לַ/חֹ֥דֶשׁ הָ/רִאשֽׁוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/001.yaml
  text: Josiah kept the Passover to Yahweh in Jerusalem[a], and they slaughtered the Passover on the fourteenth day of the first month.
translation:
  language: tl
  text: Ipinagdiwang ni Josias ang Paskuwa para kay Yahweh sa Jerusalem, at kinatay nila ang handog sa Paskuwa[a] noong ika-labing-apat na araw ng unang buwan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “ang Paskuwa.” Dito, tumutukoy ang salita sa hayop na handog para sa Paskuwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: ipinagdiwang
  rationale: Bagaman ang payak na kahulugan ay “ginawa,” kasama ng פֶּסַח ay tumutukoy ito sa pagdiriwang o pagtupad sa Paskuwa. Ang “ipinagdiwang” ay natural at malinaw sa modernong Filipino.
- source_word: פֶּסַח
  choice: ang Paskuwa
  rationale: Sa unang paglitaw, tumutukoy ang salita sa pagdiriwang at rituwal ng Paskuwa sa kabuuan.
- source_word: לַיהוָה
  choice: para kay Yahweh
  rationale: Ipinahahayag ng ל ang pag-aalay o pag-uukol ng pagdiriwang kay Yahweh; pinananatili ang personal na pangalang nasa tekstong Hebreo.
- source_word: בִירוּשָׁלִַם
  choice: sa Jerusalem
  rationale: Tuwirang lokatibong parirala, gamit ang karaniwang anyo ng pangalan sa Filipino.
- source_word: וַיִּשְׁחֲטוּ
  choice: kinatay nila
  rationale: Tumpak na ipinahahayag ang rituwal na pagkatay nang hindi ginagawang pangkalahatang “pinatay” o labis na ipinapakahulugang “inihain.”
- source_word: הַפֶּסַח
  choice: ang handog sa Paskuwa
  rationale: Sa ikalawang paglitaw, ang Paskuwa ay metonimikong tumutukoy sa hayop na kinatay. Ginagawang natural sa Filipino ang kahulugan nang hindi tinutukoy na “kordero,” na hindi tahasang sinabi rito.
- source_word: בְּאַרְבָּעָה עָשָׂר
  choice: nang ikalabing-apat na araw
  rationale: Natural na anyong pangkalendaryo sa Filipino para sa Hebreong “sa labing-apat.”
- source_word: לַחֹדֶשׁ הָרִאשׁוֹן
  choice: ng unang buwan
  rationale: Nililinaw na ang ikalabing-apat na araw ay kabilang sa unang buwan.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Personal na pangalang יהוה ang tuwirang ginagamit sa talata; pinananatili itong “Yahweh” upang katawanin ang pangalang tipan nang hindi ito pinapalitan ng titulo.
- issue: Kahulugan ng ikalawang פֶּסַח
  choice: handog sa Paskuwa
  alternative: Paskuwa; kordero ng Paskuwa
  rationale: Sa konteksto ng pagkatay, tumutukoy ito sa hayop na handog, ngunit hindi tahasang tinutukoy ng talata kung anong uri ng hayop. Iniiwasan ng salin ang pagdaragdag ng “kordero” habang nililinaw ang metonimiya.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Paskuwa,” na pamilyar na terminong biblikal, at pinanatili ang biglang pagbabago mula sa isahang si Josias tungo sa maramihang “nila,” gaya ng nasa Hebreo.
