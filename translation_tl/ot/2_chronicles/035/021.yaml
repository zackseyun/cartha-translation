  text: וַ/יִּשְׁלַ֣ח אֵלָ֣י/ו מַלְאָכִ֣ים לֵ/אמֹר֩ מַה לִּ֨/י וָ/לָ֜/ךְ מֶ֣לֶךְ יְהוּדָ֗ה לֹא עָלֶ֨י/ךָ אַתָּ֤ה הַ/יּוֹם֙ כִּ֚י אֶל בֵּ֣ית מִלְחַמְתִּ֔/י וֵ/אלֹהִ֖ים אָמַ֣ר לְ/בַֽהֲלֵ֑/נִי חֲדַל לְ/ךָ֛ מֵ/אֱלֹהִ֥ים אֲשֶׁר עִמִּ֖/י וְ/אַל יַשְׁחִיתֶֽ/ךָ׀׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/021.yaml
  text: But he sent messengers to him[a], saying, “What have I to do with you, king of Judah? I am not coming against you today, but against the house with which I am at war; and God has told me to hurry. Stop opposing God, who is with me, so that he does not destroy you.”
translation:
  language: tl
  text: Ngunit nagsugo siya ng mga mensahero kay Josias at ipinasabi, “Ano ang pakialam ko sa iyo, hari ng Juda? Hindi ikaw ang sinasalakay ko ngayon, kundi ang sambahayang kinakalaban ko[a]. Sinabi ng Diyos na magmadali ako. Tigilan mo ang pagsalungat sa Diyos na kasama ko, upang hindi ka niya lipulin.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “lugar na paglalabanan ko” o “sambahayan/kahariang kinakalaban ko.” Mahirap tiyakin ang kahulugan ng pariralang Hebreo.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאָכִים
  choice: mga mensahero
  rationale: Sa kontekstong militar, mga taong isinugo ni Neco ang tinutukoy, hindi mga anghel.
- source_word: מַה לִּי וָלָךְ
  choice: Ano ang pakialam ko sa iyo
  rationale: Likas na idyomang Filipino ito para sa pahayag ng hindi pakikialam o kawalan ng kaugnayan, nang hindi dinaragdagan ang diwa ng tahasang pagkapoot.
- source_word: לֹא עָלֶיךָ אַתָּה הַיּוֹם
  choice: Hindi ikaw ang sinasalakay ko ngayon
  rationale: Pinupunan nito nang natural ang eliptikong Hebreo at malinaw na ipinapakitang hindi si Josias ang kasalukuyang puntirya.
- source_word: אֶל בֵּית מִלְחַמְתִּי
  choice: kundi ang sambahayang kinakalaban ko
  rationale: Pinananatili ng “sambahayan” ang larawang בֵּית habang ipinahahayag ang direksiyong laban sa isang sambahayan, dinastiya, o kaharian; inilalagay sa talababa ang tunay na kawalang-katiyakan.
- source_word: וֵאלֹהִים
  choice: ang Diyos
  rationale: Ang kasamang pandiwang nasa isahan ay pumapabor sa iisang tinutukoy, at sa talata 22 ay inilalarawan ng tagapagsalaysay ang mensahe bilang nagmula sa Diyos.
- source_word: לְבַהֲלֵנִי
  choice: na magmadali ako
  rationale: Natural na Filipino itong nagpapahayag ng kagyat na pagmamadali na ipinag-utos kay Neco.
- source_word: חֲדַל לְךָ מֵאֱלֹהִים
  choice: Tigilan mo ang pagsalungat sa Diyos
  rationale: Ipinahahayag nito ang babalang huminto si Josias sa paghadlang o paglaban sa ginagawa ng Diyos.
- source_word: אֲשֶׁר עִמִּי
  choice: na kasama ko
  rationale: Tuwirang pinananatili nito ang pananalita nang hindi labis na ipinapaliwanag ang uri ng pagsama o pagsuporta ng Diyos.
- source_word: וְאַל יַשְׁחִיתֶךָ
  choice: upang hindi ka niya lipulin
  rationale: 'Ang sugnay ay babalang pang-iwas: dapat huminto si Josias upang hindi siya dalhin ng Diyos sa kapahamakan; ang “lipulin” ay angkop sa tindi ng pandiwa.'
theological_decisions:
- issue: Ang tinutukoy ng אֱלֹהִים sa sinabi ni Neco
  choice: Isinalin bilang “ang Diyos”
  alternative: “isang diyos” o “mga diyos”
  rationale: Pumapabor ang pandiwang isahan sa iisang tinutukoy. Bukod dito, sa kasunod na talata ay kinikilala ng tagapagsalaysay ang mga salita bilang mula sa bibig ng Diyos, ngunit hindi na dinaragdagan ang teksto ng mas tiyak na paliwanag.
- issue: Kahulugan ng בֵּית מִלְחַמְתִּי
  choice: Pinanatili ang larawang “sambahayan” sa pangunahing teksto
  alternative: “lugar na paglalabanan ko” o “kaharian na kinakalaban ko”
  rationale: Hindi tiyak ang di-karaniwang pariralang Hebreo. Pinananatili ng salin at talababa ang posibleng mga kahulugan sa halip na tahimik na pumili ng isa.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “ipinasabi” upang natural na maipahayag ang mensaheng ipinadala, at pinanatili sa talababa ang kalabuan ng di-karaniwang pariralang Hebreo.
