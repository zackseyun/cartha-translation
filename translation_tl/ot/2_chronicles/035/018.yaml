  text: וְ/לֹֽא נַעֲשָׂ֨ה פֶ֤סַח כָּמֹ֨/הוּ֙ בְּ/יִשְׂרָאֵ֔ל מִ/ימֵ֖י שְׁמוּאֵ֣ל הַ/נָּבִ֑יא וְ/כָל מַלְכֵ֣י יִשְׂרָאֵ֣ל לֹֽא עָשׂ֡וּ כַּ/פֶּ֣סַח אֲשֶׁר עָשָׂ֣ה יֹֽ֠אשִׁיָּהוּ וְ/הַ/כֹּהֲנִ֨ים וְ/הַ/לְוִיִּ֤ם וְ/כָל יְהוּדָה֙ וְ/יִשְׂרָאֵ֣ל הַ/נִּמְצָ֔א וְ/יוֹשְׁבֵ֖י יְרוּשָׁלִָֽם־־׀־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/018.yaml
  text: No Passover like it had been kept in Israel since the days of Samuel the prophet[a], and none of the kings of Israel had kept a Passover like the one that Josiah kept, with the priests, the Levites, all Judah, Israel that was present[b], and the inhabitants of Jerusalem.
translation:
  language: tl
  text: Walang kapistahan ng Paskuwa na tulad nito ang ipinagdiwang sa Israel mula pa noong panahon ni Samuel na propeta,[a] at walang sinuman sa mga hari ng Israel ang nagdiwang ng Paskuwa na tulad ng ipinagdiwang ni Josias, kasama ang mga pari, ang mga Levita, ang buong Juda, ang mga Israelitang naroon,[b] at ang mga naninirahan sa Jerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Walang Paskuwang tulad nito ang idinaos sa Israel mula pa noong panahon ni Samuel na propeta.”'
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “ang Israel na naroon”; tumutukoy ito sa mga kabilang sa Israel na naroon para sa pagdiriwang.
    reason: lexical_alternative
lexical_decisions:
- source_word: נַעֲשָׂה / עָשׂוּ / עָשָׂה (kasama ng פֶסַח)
  choice: ipinagdiwang / nagdiwang
  rationale: Kapag kasama ng פֶסַח, ang עשה ay idyomatikong tumutukoy sa pagdaraos o pagdiriwang ng Paskuwa, hindi sa literal na paggawa nito. Natural at malinaw sa makabagong Tagalog ang “ipinagdiwang.”
- source_word: פֶסַח
  choice: kapistahan ng Paskuwa / Paskuwa
  rationale: Saklaw dito ang buong pagdiriwang, hindi lamang ang hain. Nilinaw ito bilang “kapistahan ng Paskuwa” sa unang banggit at pinaikli sa “Paskuwa” sa ikalawa.
- source_word: כָּמֹהוּ
  choice: na tulad nito
  rationale: Ang hulaping panghalip ay tumutukoy sa Paskuwang inilalarawan sa konteksto. Pinananatili ng “tulad nito” ang paghahambing nang hindi dinaragdagan ang pakahulugan.
- source_word: בְּיִשְׂרָאֵל
  choice: sa Israel
  rationale: Ang pang-ukol ay may lokatibo o pambansang saklaw; tuwiran at natural ang “sa Israel.”
- source_word: מִימֵי שְׁמוּאֵל הַנָּבִיא
  choice: mula pa noong panahon ni Samuel na propeta
  rationale: Ipinahihiwatig ng מִן kasama ng “mga araw” ang panimulang panahon ng paghahambing. Ang “mula pa noong panahon” ay natural na katumbas sa Tagalog.
- source_word: וְכָל מַלְכֵי יִשְׂרָאֵל לֹא
  choice: at walang sinuman sa mga hari ng Israel
  rationale: Ang Hebreong anyong “lahat ... hindi” ay nagpapahayag ng pangkalahatang pagkakaila. Inililipat ito sa likas na Tagalog bilang “walang sinuman sa mga hari.”
- source_word: אֲשֶׁר עָשָׂה יֹאשִׁיָּהוּ
  choice: na tulad ng ipinagdiwang ni Josias
  rationale: Natural na iniuugnay ng parirala ang Paskuwa ni Josias sa naunang paghahambing habang pinananatili ang sugnay na panuring.
- source_word: וְהַכֹּהֲנִים וְהַלְוִיִּם
  choice: kasama ang mga pari, ang mga Levita
  rationale: Ang mga kasunod na pangkat ay mga kalahok sa pagdiriwang. Nililinaw ng “kasama” ang kanilang ugnayan kay Josias nang hindi binabago ang diwa.
- source_word: וְכָל יְהוּדָה
  choice: ang buong Juda
  rationale: Tuwirang pambansang katawagan ito; natural sa Tagalog ang “ang buong Juda.”
- source_word: וְיִשְׂרָאֵל הַנִּמְצָא
  choice: ang mga Israelitang naroon
  rationale: Ang participle הַנִּמְצָא ay tumutukoy sa bahagi ng Israel na natagpuang naroon o dumalo. Ang “mga Israelitang naroon” ay malinaw na makabagong Tagalog, samantalang ipinapaliwanag sa talababa ang kolektibong anyo ng Hebreo.
- source_word: וְיוֹשְׁבֵי יְרוּשָׁלִָם
  choice: ang mga naninirahan sa Jerusalem
  rationale: Tuwiran at natural na salin ito ng participial na katawagan sa mga residente ng lungsod.
theological_decisions:
- issue: Saklaw ng historikal na paghahambing sa mga naunang Paskuwa
  choice: Pinananatili ang pahayag na walang katulad na Paskuwa mula pa noong panahon ni Samuel, nang hindi ipinapaliwanag kung ang paghahambing ay ganap o nakabatay sa natatanging katangian ng pagdiriwang.
  alternative: Unawain ito bilang ganap na historikal na pahayag na walang anumang maihahambing na pagdiriwang mula kay Samuel hanggang kay Josias, o bilang kwalitatibong paghahambing na hindi itinatanggi ang ibang mahahalagang Paskuwa.
  rationale: Hindi tahasang nilulutas ng Hebreo kung anong tiyak na aspekto ang batayan ng pagiging walang katulad. Kaya pinananatili ng salin ang tensiyon at hindi nagdaragdag ng harmonisasyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Paskuwa,” “Josias,” “Juda,” at “mga Levita” bilang pamilyar na anyong biblikal sa Tagalog. Iniwasan ang literal ngunit hindi likas na “gumawa ng Paskuwa,” at ginamit ang “ipinagdiwang” upang maipahayag ang idyomang Hebreo.
