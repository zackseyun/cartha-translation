  source_fidelity: 'Tapat ang salin sa Hebreo: ipinahihiwatig ng “Naglaan” ang pagbibigay/paglalaan ni Josias, naipapahayag ang mga hayop mula sa kawan (mga batang tupa at batang kambing), ang layon nilang Paskuwa, ang mga naroon, ang bilang na 30,000 at 3,000 baka, at ang pinagmulan ng mga ito sa pag-aari ng hari. Hindi nito ipinipilit na ang mga baka ay saklaw nang tahasan ng pariralang “para sa mga handog sa Paskuwa,” alinsunod sa sintaks ng pinagmulan.'
