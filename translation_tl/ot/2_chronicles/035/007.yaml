  text: וַ/יָּ֣רֶם יֹאשִׁיָּ֣הוּ לִ/בְנֵ֪י הָ/עָ֟ם צֹ֞אן כְּבָשִׂ֣ים וּ/בְנֵֽי עִזִּים֮ הַ/כֹּ֣ל לַ/פְּסָחִים֒ לְ/כָל הַ/נִּמְצָ֗א לְ/מִסְפַּר֙ שְׁלֹשִׁ֣ים אֶ֔לֶף וּ/בָקָ֖ר שְׁלֹ֣שֶׁת אֲלָפִ֑ים אֵ֖לֶּה מֵ/רְכ֥וּשׁ הַ/מֶּֽלֶךְ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/007.yaml
  text: Josiah contributed to the people from the flock[a], lambs and young goats, all of them for the Passover offerings, for all who were present, to the number of thirty thousand, and three thousand cattle[b]. These were from the king’s possessions.
translation:
  language: tl
  text: Naglaan si Josias para sa mga mamamayan[a] ng mga hayop mula sa kawan—mga batang tupa at mga batang kambing—na pawang para sa mga handog sa Paskuwa[b]. Para sa lahat ng naroon, tatlumpung libo ang bilang ng mga ito, bukod pa sa tatlong libong baka. Ang mga ito ay mula sa mga pag-aari ng hari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “para sa mga anak ng bayan”; maaari ring “para sa mga tao” o “para sa karaniwang mamamayan.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “na pawang para sa mga hain sa Paskuwa.” Maramihan sa Hebreo ang “mga Paskuwa,” na malamang na sama-samang tumutukoy sa mga hayop o handog para sa Paskuwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּרֶם
  choice: naglaan
  rationale: Sa Hiphil at sa kontekstong ito, tumutukoy ito sa pagbibigay o paglalaan bilang ambag, hindi sa literal na pagtataas. Hindi rin nito ipinahihiwatig na si Josias mismo ang nagsagawa ng paghahandog.
- source_word: לִבְנֵי הָעָם
  choice: para sa mga mamamayan
  rationale: Likas at malinaw ito sa makabagong Tagalog. Ang literal na ‘mga anak ng bayan’ ay inilagay sa talababa dahil maaaring tumukoy ang parirala sa karaniwang mamamayan na hindi kabilang sa mga Levita.
- source_word: צֹאן
  choice: mga hayop mula sa kawan
  rationale: Kolektibong katawagan ito sa maliliit na alagang hayop, lalo na sa mga tupa at kambing; pinananatili ng salin ang pangkalahatang termino bago ang kasunod na paglilinaw.
- source_word: כְּבָשִׂים וּבְנֵי עִזִּים
  choice: mga batang tupa at mga batang kambing
  rationale: Malinaw na tinutukoy ang mga hayop at iniiwasan ang anumang di-angkop o malabong modernong kahulugan ng ibang posibleng katawagan.
- source_word: הַכֹּל לַפְּסָחִים
  choice: na pawang para sa mga handog sa Paskuwa
  rationale: Ang maramihang anyo ng salitang Hebreo ay malamang na tumutukoy nang sama-sama sa mga hayop o handog para sa Paskuwa. Ang talababa ay nagpapanatili sa alternatibong ‘mga hain.’
- source_word: לְכָל הַנִּמְצָא
  choice: para sa lahat ng naroon
  rationale: Sa konteksto, tumutukoy ang parirala sa lahat ng naroon o nagkatipon para sa pagdiriwang.
- source_word: לְמִסְפַּר שְׁלֹשִׁים אֶלֶף
  choice: tatlumpung libo ang bilang ng mga ito
  rationale: Malinaw na iniuugnay ang bilang sa naunang mga hayop mula sa kawan habang pinananatili ang diwa ng Hebreong pahayag ng bilang.
- source_word: וּבָקָר שְׁלֹשֶׁת אֲלָפִים
  choice: bukod pa sa tatlong libong baka
  rationale: Ang בָּקָר ay kolektibong katawagan para sa mga baka; hindi tinutukoy ng salin ang kasarian o gamit ng mga ito.
- source_word: אֵלֶּה מֵרְכוּשׁ הַמֶּלֶךְ
  choice: Ang mga ito ay mula sa mga pag-aari ng hari
  rationale: Ipinakikita nitong ang mga hayop ay kinuha mula sa sariling yaman o ari-arian ng hari.
theological_decisions:
- issue: Saklaw ng ‘pawang para sa mga Paskuwa’
  choice: Iniugnay sa mga hayop mula sa kawan bilang mga handog sa Paskuwa
  alternative: Iugnay rin nang tahasan ang tatlong libong baka sa mga hain sa Paskuwa
  rationale: Sa ayos ng Hebreo, ang הַכֹּל לַפְּסָחִים ay kaagad na sumusunod sa mga tupa at batang kambing, bago banggitin ang mga baka. Hindi tahasang nilulutas ng salin kung pareho ang tiyak na ritwal na gamit ng mga baka.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang ‘naglaan’ sa halip na mas pinansiyal ang dating na ‘nag-ambag,’ at ‘Paskuwa’ bilang pamilyar na katawagang biblikal. Ang mga gitling na mahaba ay nagpapakita na ang ‘mga batang tupa at mga batang kambing’ ay paglilinaw sa ‘mga hayop mula sa kawan.’
