  text: And the archers shot King Josiah[a], and the king said to his servants, “Take me away, for I am severely wounded.”
translation:
  language: tl
  text: Pinana ng mga mamamana si Haring Josias, at sinabi ng hari sa kanyang mga lingkod, “Ilayo ninyo ako rito, sapagkat malubha ang aking pagkasugat[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “sapagkat lubha akong nanghihina,” yamang ang pandiwang Hebreo ay maaaring tumukoy sa paghina, pagkakasakit, o matinding pagkasugat; sa konteksto ng labanan, malamang na tumutukoy ito sa pagkasugat.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּרוּ הַיֹּרִים
  choice: Tinamaan ng mga mamamana
  rationale: Ang Hiphil ng ירה kasama ng participleng הַיֹּרִים ay tumutukoy sa pagpana sa konteksto ng labanan. Likas sa Filipino ang “tinamaan ng mga mamamana” at hindi nito ipinipilit kung ilang palaso ang tumama.
- source_word: לַמֶּלֶךְ יֹאשִׁיָּהוּ
  choice: si Haring Josias
  rationale: Minamarkahan ng ל ang pinatutungkulan o target ng pagpana. Sa balangkas na pasibo sa Filipino, natural itong ipahayag bilang “si Haring Josias.”
- source_word: הַעֲבִירוּנִי
  choice: Ilayo ninyo ako rito
  rationale: Ang causative ng עבר ay humihiling na paalisin o ilipat siya mula sa kinaroroonan. Ang “ilayo ninyo ako rito” ay natural at hindi nagsasaad nang higit sa Hebreo kung siya ay bubuhatin o ihahatid.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala nito ang dahilan ng utos; ang “sapagkat” ay angkop sa marangal na tuwirang pananalita.
- source_word: הָחֳלֵיתִי מְאֹד
  choice: malubha ang aking sugat
  rationale: Bagaman malawak ang חלה at maaaring mangahulugang manghina o magkasakit, sa konteksto ng pagkakatama sa labanan ay tumutukoy ito sa malubhang pagkakasugat. Inihahatid ng “malubha” ang diin ng מְאֹד.
