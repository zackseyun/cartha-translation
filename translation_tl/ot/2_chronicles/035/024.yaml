base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/024.yaml
  text: So his servants removed him from the chariot and set him on the second chariot that belonged to him[a], and brought him to Jerusalem. And he died and was buried in the tombs of his fathers, and all Judah and Jerusalem mourned for Josiah.
translation:
  language: tl
  text: Inalis siya ng kanyang mga lingkod mula sa karwahe at isinakay sa kanyang ikalawang karwahe[a]. Dinala nila siya sa Jerusalem. Namatay siya at inilibing sa mga libingan ng kanyang mga ninuno. Nagluksa para kay Josias ang buong Juda at Jerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “ang karwahe ng ikalawa,” na malamang ay tumutukoy sa ikalawa o reserbang karwahe ni Josias.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲבִירֻהוּ
  choice: inilabas siya
  rationale: Ang Hiphil ng עבר ay nagsasaad ng paglilipat mula sa isang lugar patungo sa iba; sa konteksto, inilabas si Josias mula sa karwaheng pandigma.
- source_word: עֲבָדָיו
  choice: kanyang mga lingkod
  rationale: Malawak ang saklaw ng עבד at maaaring tumukoy sa mga lingkod o opisyal; hindi labis na tinutukoy ng “mga lingkod” ang kanilang ranggo.
- source_word: הַמֶּרְכָּבָה
  choice: karwahe
  rationale: Tuwirang katumbas ito ng pangngalang tumutukoy sa sasakyang hinihila at ginagamit sa labanan.
- source_word: וַיַּרְכִּיבֻהוּ
  choice: inilipat
  rationale: Sa kalagayan ng sugatang hari, natural na ipinahihiwatig nito ang paglalagay sa isa pang karwahe, hindi ang pagpapasakay sa karaniwang diwa.
- source_word: רֶכֶב הַמִּשְׁנֶה אֲשֶׁר לוֹ
  choice: ikalawa niyang karwahe
  rationale: Pinananatili nito ang literal na “ikalawang karwahe” at malinaw na ipinakikitang pag-aari iyon ni Josias, nang hindi ginagawang tiyak sa teksto ang posibleng kahulugang reserbang karwahe.
- source_word: וַיּוֹלִיכֻהוּ
  choice: dinala nila siya
  rationale: Ang Hiphil ng הלך ay angkop na isaling “dinala” dahil inililipat ang sugatang hari patungo sa Jerusalem.
- source_word: וַיָּמָת
  choice: doon siya namatay
  rationale: Tuwiran nitong isinasalin ang pagkamatay; ang “doon” ay natural na inuugnay ang pangyayari sa naunang destinasyong Jerusalem.
- source_word: בְּקִבְרוֹת אֲבֹתָיו
  choice: sa mga libingan ng kanyang mga ninuno
  rationale: Ang “mga ninuno” ay natural na modernong salin ng idiomatikong “mga ama” at pinananatili ang dinastikong konteksto ng paglilibing.
- source_word: וְכָל־יְהוּדָה וִירוּשָׁלִַם
  choice: ang buong Juda at Jerusalem
  rationale: Pinananatili ang personipikasyon ng kaharian at kabisera bilang pamayanang nagluluksa.
- source_word: מִתְאַבְּלִים
  choice: nagluksa
  rationale: Natural itong salaysay sa Filipino; ipinahahayag ng pandiwang Hebreo ang pagdadalamhati para kay Josias.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “Josias” bilang nakaugaliang anyong Filipino ng pangalan, “Juda” para sa Judah, at “mga ninuno” sa halip na literal na “mga ama” upang maging natural nang hindi nawawala ang dinastikong diwa.
