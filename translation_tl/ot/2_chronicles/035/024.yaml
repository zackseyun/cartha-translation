  naturalness: Malinaw at marangal ang Tagalog. Mas tuwiran at natural sa kontekstong ito ang “isinakay” para sa וַיַּרְכִּיבֻהוּ kaysa “inilipat,” sapagkat malinaw nitong ipinahahayag ang pagpapasakay sa ibang karwahe.
