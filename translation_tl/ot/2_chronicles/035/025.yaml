    rationale: Nauunawaan at hindi mali, ngunit ang “sa araw na ito” ang mas likas na modernong Filipino para sa idiomang עַד הַיּוֹם (‘to this day’).
  - severity: low
    issue: Paulit-ulit at di-gaanong malinaw na “ang mga iyon”
