revisions:
- from: At nanaghoy si Jeremias para kay Josias, at binabanggit ng lahat ng mang-aawit na lalaki at babae si Josias sa kanilang mga panaghoy hanggang sa araw na ito. Itinakda nila ang mga iyon bilang tuntunin sa Israel; at narito, nakasulat ang mga iyon sa Mga Panaghoy.[a]
  to: At nanaghoy si Jeremias para kay Josias, at binabanggit ng lahat ng mang-aawit na lalaki at babae si Josias sa kanilang mga panaghoy sa araw na ito. Itinakda nila ito bilang tuntunin sa Israel; at narito, nakasulat sa Mga Panaghoy.[a]
  rationale: Ginawang mas natural at mas magaan ang Filipino nang hindi binabago ang saklaw o kawalang-katiyakan ng Hebreo. Ang pangkasalukuyang “binabanggit” ay pinanatili dahil inuugnay ng “sa araw na ito” ang gawain sa nagpapatuloy na kaugalian. Pinanatili ang kapitalisadong “Mga Panaghoy” kasama ang talababa upang iwanang bukás ang usapin kung tiyak na katipunan ba ito o pangkalahatang mga awit ng panaghoy.
