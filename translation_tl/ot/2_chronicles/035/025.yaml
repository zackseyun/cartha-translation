  text: וַ/יְקוֹנֵ֣ן יִרְמְיָהוּ֮ עַל יֹאשִׁיָּהוּ֒ וַ/יֹּאמְר֣וּ כָֽל הַ/שָּׁרִ֣ים וְ֠/הַ/שָּׁרוֹת בְּ/קִינ֨וֹתֵי/הֶ֤ם עַל יֹאשִׁיָּ֨הוּ֙ עַד הַ/יּ֔וֹם וַ/יִּתְּנ֥וּ/ם לְ/חֹ֖ק עַל יִשְׂרָאֵ֑ל וְ/הִנָּ֥/ם כְּתוּבִ֖ים עַל הַ/קִּינֽוֹת־־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/025.yaml
  text: And Jeremiah lamented for Josiah[a], and all the male singers and female singers speak of Josiah in their laments to this day. And they made them a statute in Israel; behold, they are written in the Laments.
translation:
  language: tl
  text: At nanaghoy si Jeremias para kay Josias, at binabanggit ng lahat ng mang-aawit na lalaki at babae si Josias sa kanilang mga panaghoy sa araw na ito. Itinakda nila ito bilang tuntunin sa Israel; at narito, nakasulat sa Mga Panaghoy.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nakasulat sa mga panaghoy,” kung pangkalahatang tumutukoy ang parirala sa mga awit ng panaghoy sa halip na sa isang tiyak na katipunang pinamagatang Mga Panaghoy.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְקוֹנֵן
  choice: nanaghoy
  rationale: Ipinahahayag ng pandiwa ang pagbigkas o pag-awit ng panaghoy para sa isang namatay, nang hindi ipinapalagay kung si Jeremias ang kumatha nito.
- source_word: עַל יֹאשִׁיָּהוּ
  choice: para kay Josias
  rationale: Sa konteksto ng pagluluksa, likas sa Filipino ang “nanaghoy para kay Josias.”
- source_word: הַשָּׁרִים וְהַשָּׁרוֹת
  choice: mga mang-aawit na lalaki at babae
  rationale: Tumutukoy ang dalawang anyo sa mga mang-aawit at tahasang ipinakikita ng Hebreo ang pagkakaiba ng kasarian.
- source_word: וַיֹּאמְרוּ ... עַד הַיּוֹם
  choice: binabanggit ... hanggang sa araw na ito
  rationale: Bagaman literal na “sinabi,” tumutukoy ito sa patuloy na pagbanggit o pag-awit tungkol kay Josias sa mga panaghoy; pinananatili ng aspektong di-ganap ng “binabanggit” ang duratibong diwa.
- source_word: בְּקִינוֹתֵיהֶם
  choice: sa kanilang mga panaghoy
  rationale: Ang קִינוֹת ay mga awit o bigkas ng pagluluksa; malinaw at kasalukuyang Filipino ang “mga panaghoy.”
- source_word: וַיִּתְּנוּם לְחֹק עַל יִשְׂרָאֵל
  choice: Itinakda nila ang mga iyon bilang tuntunin sa Israel
  rationale: Maaaring mangahulugan ang חֹק ng itinakdang tuntunin o nakaugaliang gawain. Pinananatili ng salin ang pormal na lakas nito nang hindi labis na ginagawang batas ang kaugalian.
- source_word: וְהִנָּם כְּתוּבִים
  choice: at narito, nakasulat ang mga iyon
  rationale: Pinananatili ng “narito” ang pantawag-pansing diwa ng הִנֵּה, at ang maramihang panghalip ay tumutukoy sa mga panaghoy.
- source_word: עַל הַקִּינוֹת
  choice: sa Mga Panaghoy
  rationale: Ipinakikita ng malaking titik ang posibleng pagtukoy sa isang kilalang katipunan na pinamagatang “Mga Panaghoy,” habang inilalahad sa talababa ang posibleng pangkalahatang kahulugan.
theological_decisions:
- issue: Kung ang הַקִּינוֹת ay pamagat ng isang tiyak na katipunan o pangkalahatang tawag sa mga awit ng panaghoy
  choice: Mga Panaghoy bilang posibleng pamagat ng isang kilalang katipunan
  alternative: mga panaghoy bilang pangkalahatang katawagan
  rationale: Maaaring tukuyin ng tiyak na pantukoy ang isang kilalang koleksiyon, ngunit hindi ganap na nilulutas ng Hebreo ang tanong; kaya pinananatili ang alternatibo sa talababa at hindi ito tahasang ipinapantay sa kanonikal na Aklat ng Mga Panaghoy.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “nanaghoy,” “mang-aawit,” at “tuntunin” upang mapanatili ang tonong pangkasaysayan at panrelihiyon nang hindi maging lipas o teknikal. Inilagay ang talababa sa pariralang talagang tinutukoy nito.
