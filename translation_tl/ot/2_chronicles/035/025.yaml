  source_fidelity: 'Tumpak sa kabuuan ang salin: naipapahayag nito ang panaghoy ni Jeremias, ang mga mang-aawit na lalaki at babae, ang pagpapatuloy hanggang sa panahon ng manunulat, ang pagtatakda ng mga panaghoy, at ang pagtukoy sa isang posibleng katipunan. Gayunman, ang panghalip sa hulíng sugnay ay hindi kailangang ulitin sa Filipino at nagiging bahagyang mabigat.'
  naturalness: Natural at marangal ang karamihan ng pahayag. Mas idiomatiko ang “sa araw na ito” kaysa “hanggang sa araw na ito” para sa עַד הַיּוֹם sa ganitong konteksto. Mas malinaw rin ang “itinakda nila ito” kaysa “ang mga iyon,” sapagkat tumutukoy ang panghalip sa mga panaghoy bilang isang itinatag na kaugalian/tuntunin.
  terminology: Ang “nanaghoy,” “mga mang-aawit na lalaki at babae,” at “mga panaghoy” ay angkop. Pinananatili ng “Mga Panaghoy” ang posibleng pamagat o kilalang katipunan nang hindi ito ipinapantay sa kanonikal na Aklat ng Mga Panaghoy; ang talababa ay wastong nag-iingat sa alternatibong pagbasa.
  issues:
