base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/017.yaml
  text: And the Israelites who were present kept the Passover at that time, and the Feast of Unleavened Bread for seven days.
translation:
  language: tl
  text: Ipinagdiwang ng mga Israelitang naroon ang Paskuwa nang panahong iyon, at ipinagdiwang nila ang Kapistahan ng Tinapay na Walang Pampaalsa sa loob ng pitong araw.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: ipinagdiwang
  rationale: Literal itong nangangahulugang “ginawa,” ngunit kapag kapistahan o Paskuwa ang layon, tumutukoy ito sa pagdiriwang o pagsasagawa ng itinakdang paggunita. Likas at malinaw sa modernong Tagalog ang “ipinagdiwang.”
- source_word: בְנֵי יִשְׂרָאֵל
  choice: mga Israelita
  rationale: Kolektibong tawag ito sa bayan ng Israel; ang “mga Israelita” ang natural at tumpak na katumbas sa kasalukuyang Tagalog.
- source_word: הַנִּמְצְאִים
  choice: naroon
  rationale: Sa kontekstong ito, inilalarawan ng participle ang mga taong naroroon sa pagdiriwang, hindi ang literal na mga “natagpuan.”
- source_word: הַפֶּסַח
  choice: ang Paskuwa
  rationale: Tumutukoy ito rito sa pagdiriwang ng Paskuwa, hindi lamang sa hayop na inihahandog. “Paskuwa” ang kinikilalang katawagan sa Tagalog na tradisyong biblikal.
- source_word: בָּעֵת הַהִיא
  choice: nang panahong iyon
  rationale: Direkta nitong ipinahahayag ang temporal na diwa nang hindi idinaragdag ang ideya ng “itinakdang panahon,” na hindi tahasang nasa parirala.
- source_word: חַג הַמַּצּוֹת
  choice: Kapistahan ng Tinapay na Walang Pampaalsa
  rationale: Pinananatili ng “Kapistahan” ang diwa ng חַג, at malinaw na inilalarawan ng “Tinapay na Walang Pampaalsa” ang מַצּוֹת sa natural na Tagalog.
- source_word: שִׁבְעַת יָמִים
  choice: sa loob ng pitong araw
  rationale: Natural nitong ipinahahayag sa Tagalog ang tagal ng pagdiriwang.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na dignified ngunit madaling maunawaan. Inulit ang “ipinagdiwang nila” sa ikalawang sugnay upang maging malinaw at natural ang ugnayan ng dalawang pagdiriwang, bagaman iisang pandiwa lamang ang tahasang nasa unang sugnay ng Hebreo.
