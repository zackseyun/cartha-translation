base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/026.yaml
  text: 'The rest of the acts of Josiah[a], and his deeds of faithful love, as written in the Law of Yahweh:'
translation:
  language: tl
  text: 'Ang iba pang mga ginawa ni Josias at ang kanyang mga gawa ng katapatan[a], ayon sa nakasulat sa Kautusan ni Yahweh:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “mga gawang tapat sa tipan,” “mga kabutihang-loob,” o “mga gawa ng tapat na pag-ibig.” Ang salitang Hebreo ay maaaring tumukoy sa kabutihang-loob, katapatan, o tapat na pag-ibig.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר
  choice: Ang iba pa
  rationale: Ipinahihiwatig ng יֶתֶר ang natitirang ulat; likas sa modernong Tagalog ang “ang iba pa” at hindi na kailangang dagdagan ng tahasang panandang pamanahon.
- source_word: דִּבְרֵי
  choice: mga ginawa
  rationale: Bagaman maaari itong mangahulugang “mga salita” o “mga bagay,” ang דִּבְרֵי sa pormulang pangwakas ng salaysay tungkol sa hari ay tumutukoy sa kanyang mga gawa o ginawa.
- source_word: יֹאשִׁיָּהוּ
  choice: Josias
  rationale: Ginamit ang nakaugaliang anyo ng pangalan sa Filipino.
- source_word: וַחֲסָדָיו
  choice: at ang kanyang mga gawang nagpapakita ng tapat na pag-ibig
  rationale: Ang חֶסֶד ay maaaring tumukoy sa kabutihang-loob, katapatan, o matapat na pag-ibig. Pinananatili ng salin ang bigat ng katapatan sa ugnayan nang hindi nililimitahan ang salita sa isang teknikal na pakahulugang pangtipan.
- source_word: כַּכָּתוּב
  choice: ayon sa nakasulat
  rationale: Natural at malinaw na katumbas ng “gaya/alinsunod sa nakasulat,” at angkop sa pagtukoy sa isang nasusulat na pamantayan.
- source_word: בְּתוֹרַת
  choice: sa Kautusan ni
  rationale: Sa kontekstong ito, tumutukoy ang תּוֹרָה sa awtoritatibong nasusulat na Kautusan; ang “Kautusan” ay malinaw at pamilyar sa mambabasang Filipino.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
theological_decisions:
- issue: Kahulugan ng חֶסֶד kapag iniuugnay kay Josias
  choice: mga gawang nagpapakita ng tapat na pag-ibig
  alternative: mga gawa ng katapatan; mga kabutihang-loob; mga gawang tapat sa tipan
  rationale: May lawak ang חֶסֶד na sumasaklaw sa pag-ibig, katapatan, at kabutihang-loob. Ang pangunahing salin ay nagpapanatili sa teolohikal na bigat nito ngunit hindi tahasang nagdaragdag ng “tipan,” na wala sa mismong parirala.
- issue: Paglilipat ng pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Ang “Yahweh” ay tuwirang kumakatawan sa banal na pangalan at hindi ito pinapalitan ng titulo.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang tutuldok dahil nagpapatuloy ang pormulang pangwakas sa kasunod na talata. Inilagay ang talababa sa pariralang aktuwal nitong ipinaliliwanag.
