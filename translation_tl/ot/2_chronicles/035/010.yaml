- from: Kaya naihanda[a] ang paglilingkod, at tumayo ang mga pari sa kani-kanilang puwesto[b], at ang mga Levita ayon sa kani-kanilang pangkat[c], ayon sa utos ng hari.
  to: Kaya naihanda[a] ang paglilingkod, at tumayo ang mga pari sa kani-kanilang puwesto[b], at pumuwesto ang mga Levita ayon sa kani-kanilang pangkat[c], ayon sa utos ng hari.
  rationale: Bahagyang inayos ang sugnay tungkol sa mga Levita upang maging ganap at likas ang pangungusap sa modernong Tagalog, nang hindi binabago ang saklaw ng pandiwang Hebreo. Inayos rin ang talababa c upang magbigay ito ng tunay na alternatibong salin para sa organisasyonal na terminong מַחְלְקוֹת.
