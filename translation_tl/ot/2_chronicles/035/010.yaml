base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/010.yaml
  text: So the service was prepared[a], and the priests stood at their stations, and the Levites by their divisions[c][b], according to the command of the king.
translation:
  language: tl
  text: Kaya naihanda[a] ang paglilingkod, at tumayo ang mga pari sa kani-kanilang puwesto[b], at pumuwesto ang mga Levita ayon sa kani-kanilang pangkat[c], ayon sa utos ng hari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “naisaayos” o “naitatag.”
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “sa kanilang kinatatayuan”; ibig sabihin, sa mga puwestong itinalaga sa kanila.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “sa kani-kanilang mga dibisyon.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּכּוֹן
  choice: naihanda
  rationale: Ipinapahayag ng anyong ito ng כון na ang gawain ay naisaayos o naihanda. Ang “naihanda” ay natural sa konteksto ng paghahanda para sa Paskuwa habang pinananatili ang posibilidad ng “naitatag” o “naisaayos.”
- source_word: הָעֲבוֹדָה
  choice: ang paglilingkod
  rationale: Sa konteksto ng templo, tumutukoy ang עֲבוֹדָה sa banal na paglilingkod o tungkulin sa pagsamba. Mas malinaw ito kaysa sa pangkalahatang “gawain” at hindi nag-aangkat ng mas huling teknikal na katawagang liturhikal.
- source_word: וַיַּעַמְדוּ
  choice: tumayo
  rationale: Tuwirang kahulugan ng עמד ang tumayo o pumuwesto; nililinaw ng kasunod na parirala na nasa mga itinalagang lugar sila.
- source_word: הַכֹּהֲנִים
  choice: ang mga pari
  rationale: Karaniwang salin ng כֹּהֲנִים sa konteksto ng paglilingkod sa templo.
- source_word: עַל עָמְדָם
  choice: sa kani-kanilang puwesto
  rationale: Ang Hebreong idyoma ay literal na tumutukoy sa kanilang lugar ng pagtayo. Ipinahihiwatig ng “kani-kanilang puwesto” ang mga itinalagang posisyon sa malinaw at makabagong Tagalog.
- source_word: הַלְוִיִּם
  choice: ang mga Levita
  rationale: Karaniwang katawagan sa Tagalog para sa pangkat na tinutukoy ng הַלְוִיִּם.
- source_word: עַל מַחְלְקוֹתָם
  choice: ayon sa kani-kanilang pangkat
  rationale: Ang מַחְלְקוֹת ay mga organisadong pangkat o dibisyon sa paglilingkod. Natural sa Tagalog ang “ayon sa kani-kanilang pangkat” at pinananatili ang diwa ng organisadong pagkakahati.
- source_word: כְּמִצְוַת
  choice: ayon sa utos
  rationale: Tumutukoy rito ang מִצְוָה sa isang tiyak na tagubilin ng hari, kaya mas angkop ang “utos” kaysa “kautusan.”
- source_word: הַמֶּלֶךְ
  choice: ng hari
  rationale: Tuwirang salin ng tiyak na pagtukoy sa hari sa konteksto.
theological_decisions:
- issue: Kultikong kahulugan ng עֲבוֹדָה
  choice: ang paglilingkod
  alternative: ang gawain; ang paglilingkod sa pagsamba
  rationale: Ipinakikita ng konteksto na ito ay paglilingkod sa templo kaugnay ng Paskuwa. Pinananatili ng “paglilingkod” ang sagradong diwa nang hindi nagdaragdag ng denominasyonal o teknikal na konsepto.
- issue: Mga idyoma para sa pagkakapuwesto ng mga pari at Levita
  choice: sa kani-kanilang puwesto ... ayon sa kani-kanilang pangkat
  alternative: sa kanilang kinatatayuan ... sa kanilang mga pangkat
  rationale: Malinaw na ipinakikita ng salin ang maayos at nakatalagang pagkakaayos ng paglilingkod, habang nananatiling malapit sa Hebreo at natural sa modernong Tagalog.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Ginamit ang “paglilingkod” para sa kontekstong pangtemplo, “puwesto” para sa malinaw na idyomatikong pagpapahayag, at “pangkat” sa halip na mas teknikal na “dibisyon.”
