    rationale: Sa 'upang italaga iyon sa kanya, magsunog ... , maglatag ...' mas malinaw at natural ang pag-uulit ng 'upang' bago ang unang dalawang layunin at ang maayos na magkakaugnay na pandiwa.
  - severity: low
    issue: Hindi pinakamalapit ang panandang talababa a sa salitang 'bahay.'
    rationale: Ang talababa a ay nagpapaliwanag sa 'bahay,' ngunit ang pananda ay kasalukuyang nasa hulihan ng 'aking Diyos.' Dapat ilagay ang pananda kaagad pagkatapos ng 'bahay.'
  - severity: low
