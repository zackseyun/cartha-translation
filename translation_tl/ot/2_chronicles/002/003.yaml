id: 2CH.2.3
reference: 2 Chronicles 2:3
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: הִנֵּה֩ אֲנִ֨י בֽוֹנֶה בַּ֜יִת לְ/שֵׁ֣ם יְהוָ֣ה אֱלֹהָ֗/י לְ/הַקְדִּ֣ישׁ ל֡/וֹ לְ/הַקְטִ֣יר לְ/פָנָ֣י/ו קְטֹֽרֶת סַמִּים֩ וּ/מַעֲרֶ֨כֶת תָּמִ֤יד וְ/עֹלוֹת֙ לַ/בֹּ֣קֶר וְ/לָ/עֶ֔רֶב לַ/שַּׁבָּתוֹת֙ וְ/לֶ֣/חֳדָשִׁ֔ים וּֽ/לְ/מוֹעֲדֵ֖י יְהוָ֣ה אֱלֹהֵ֑י/נוּ לְ/עוֹלָ֖ם זֹ֥את עַל יִשְׂרָאֵֽל־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/003.yaml
  text: Behold[a], I am building a house for the name of Yahweh my God, to consecrate it to him, to burn fragrant incense before him, and to set out the regular arrangement of bread, and burnt offerings morning and evening, on the Sabbaths, at the new moons[b], and at the appointed feasts of Yahweh our God[c]. This is forever for Israel.
translation:
  language: tl
  text: Narito, nagtatayo ako ng isang bahay[a] para sa pangalan ni Yahweh na aking Diyos, upang italaga ito sa kanya, upang magsunog ng mabangong insenso sa harap niya, maglatag ng palagiang hanay ng tinapay[b], at maghandog ng mga handog na sinusunog tuwing umaga at gabi, sa mga araw ng Sabbath, sa mga bagong buwan, at sa mga itinakdang kapistahan ni Yahweh na ating Diyos. Ito ay para sa Israel magpakailanman.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ang “bahay” ay tumutukoy sa templo. Literal sa Hebreo: “isang bahay para sa pangalan ni Yahweh.”'
    reason: lexical_alternative
  - marker: b
    text: 'Literal: “ang palagiang hanay.” Tinutukoy nito ang tinapay na palagiang inilalatag sa harap ni Yahweh, na tradisyonal ding tinatawag na tinapay na handog o tinapay ng Presensya.'
    reason: clarification
  - marker: c
    text: Ipinahihiwatig ng pariralang Hebreo na ang mga gawaing ito ay panghabang-panahong pananagutan ng Israel.
    reason: ambiguity
lexical_decisions:
- source_word: הִנֵּה
  choice: Narito
  rationale: Isang marangal at likas na panandang pantawag-pansin na angkop sa pahayag ng hari.
- source_word: בּוֹנֶה
  choice: nagtatayo ako
  rationale: Pinananatili ang aspektong nagpapatuloy o napipintong gawain ng Hebreong participle.
- source_word: בַּיִת לְשֵׁם יְהוָה
  choice: isang bahay para sa pangalan ni Yahweh
  rationale: Pinananatili ang literal at teolohikal na mahalagang idyomang 'bahay para sa pangalan,' sa halip na agad itong gawing 'templo.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
- source_word: לְהַקְדִּישׁ לוֹ
  choice: upang italaga iyon sa kanya
  rationale: Ipinahahayag ang pagbubukod sa bahay bilang banal para sa Diyos sa malinaw at kasalukuyang Tagalog.
- source_word: קְטֹרֶת סַמִּים
  choice: mabangong insenso
  rationale: Likas na salin para sa natatanging insensong may halimuyak na ginagamit sa pagsamba.
- source_word: מַעֲרֶכֶת תָּמִיד
  choice: palagiang hanay ng tinapay
  rationale: Ang 'hanay' ang tuwirang diwa ng מַעֲרֶכֶת; idinagdag ang 'tinapay' upang malinaw sa karaniwang mambabasa ang ritwal na tinutukoy, ayon sa konteksto ng tinapay na laging inilalagay sa harap ng Diyos.
- source_word: עֹלוֹת
  choice: mga handog na sinusunog
  rationale: Malinaw na modernong Tagalog para sa handog na lubos na sinusunog sa dambana.
- source_word: לַבֹּקֶר וְלָעֶרֶב
  choice: tuwing umaga at gabi
  rationale: Natural na ipinapahayag ang paulit-ulit na araw-araw na takdang panahon.
- source_word: מוֹעֲדֵי
  choice: mga itinakdang kapistahan
  rationale: Ipinapakita kapwa ang takdang panahon at ang kalikasan ng mga banal na pagdiriwang sa konteksto.
- source_word: לְעוֹלָם זֹאת עַל יִשְׂרָאֵל
  choice: Ito ay para sa Israel magpakailanman
  rationale: Pinananatiling maikli at bahagyang bukas ang Hebreong pahayag, nang hindi labis na ipinapaliwanag sa pangunahing teksto ang diwa ng obligasyon.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Pinananatili ang personal na pangalan sa tekstong Hebreo at hindi ito pinapalitan ng titulo.
- issue: Kung isasalin ang בַּיִת bilang 'bahay' o 'templo'
  choice: bahay
  alternative: templo
  rationale: Ang 'bahay' ang tahasang salita sa Hebreo at pinananatili nito ang makabuluhang pariralang 'bahay para sa pangalan ni Yahweh'; nililinaw sa talababa na templo ang tinutukoy.
- issue: Kung gagawing tahasan ang tinapay sa מַעֲרֶכֶת תָּמִיד
  choice: palagiang hanay ng tinapay
  alternative: palagiang hanay
  rationale: Bagaman hindi tahasang binabanggit ang 'tinapay' sa pariralang ito, iyon ang kinikilalang bagay na palagiang inaayos sa santuwaryo; pinipigilan ng paglilinaw ang malabong Tagalog, habang iniuulat sa talababa ang literal na anyo.
- issue: Kahulugan ng pangwakas na pariralang עַל יִשְׂרָאֵל
  choice: Ito ay para sa Israel magpakailanman
  alternative: Ito ay pananagutan ng Israel magpakailanman
  rationale: Hindi ginagawang tahasan sa pangunahing teksto ang ideya ng obligasyon na ipinahihiwatig ng parirala; inilalahad iyon sa talababa upang mapanatili ang bahagyang pagkaigsi at tensiyon ng Hebreo.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “Narito” upang mapanatili ang pormal na diin ng pahayag, “bahay” upang mapanatili ang idyomang Hebreo, at malinaw na mga pariralang pangritwal sa halip na makaluma o teknikal na bokabularyo. Lahat ng talababa ay may katugmang pananda sa pangunahing teksto.
