- from: Narito, nagtatayo ako ng isang bahay para sa pangalan ni Yahweh na aking Diyos[a], upang italaga iyon sa kanya, magsunog sa harap niya ng mabangong insenso, maglatag ng palagiang hanay ng tinapay[b], at maghandog ng mga handog na sinusunog tuwing umaga at gabi, sa mga Sabbath, sa mga bagong buwan, at sa mga itinakdang kapistahan ni Yahweh na ating Diyos. Ito ay para sa Israel magpakailanman.[c]
  to: Narito, nagtatayo ako ng isang bahay[a] para sa pangalan ni Yahweh na aking Diyos, upang italaga ito sa kanya, upang magsunog ng mabangong insenso sa harap niya, maglatag ng palagiang hanay ng tinapay[b], at maghandog ng mga handog na sinusunog tuwing umaga at gabi, sa mga araw ng Sabbath, sa mga bagong buwan, at sa mga itinakdang kapistahan ni Yahweh na ating Diyos. Ito ay para sa Israel magpakailanman.[c]
