base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/017.yaml
  text: From them he made seventy thousand burden-bearers[a], and eighty thousand stonecutters in the hill country, and three thousand six hundred overseers to make the people work.
translation:
  language: tl
  text: Mula sa kanila ay nagtalaga siya ng pitumpung libong tagapasan, walumpung libong tagatabas ng bato sa kabundukan[a], at tatlong libo at anim na raan na tagapangasiwa upang pagtrabahuhin ang mga tao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga tagatabas sa kabundukan.” Literal na sinasabi ng Hebreo na “mga tumatabas sa bundok/kabundukan”; ipinahihiwatig lamang ng konteksto na bato ang kanilang tinatabas.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ מֵהֶם
  choice: Mula sa kanila ay nagtalaga siya
  rationale: Ang parirala ay tumutukoy sa pagpili o pagtatalaga ng mga tao mula sa isang pangkat. Mas natural sa makabagong Tagalog ang “nagtalaga” kaysa sa literal na “gumawa siya mula sa kanila.”
- source_word: סַבָּל
  choice: tagapasan
  rationale: Tiyak nitong ipinahahayag ang taong nagdadala ng mabibigat na karga at hindi nito pinalalawak ang kahulugan tungo sa pangkalahatang manggagawa.
- source_word: חֹצֵב בָּהָר
  choice: tagatabas ng bato sa kabundukan
  rationale: Ang חצב ay nangangahulugang tumabas o humukay, at sa konteksto ng pagtatayo ay bato ang ipinahihiwatig na layon. Ang “sa kabundukan” ay natural na katumbas ng lokasyong ipinahahayag ng בָּהָר.
- source_word: מְנַצְּחִים
  choice: tagapangasiwa
  rationale: Sa kontekstong administratibo, tumutukoy ito sa mga namamahala at nangangasiwa sa paggawa.
- source_word: לְהַעֲבִיד אֶת הָעָם
  choice: upang pagtrabahuhin ang mga tao
  rationale: 'Pinananatili nito ang causative na diwa ng Hiphil: sila ang magpapagawa o magtatalaga ng trabaho sa mga tao.'
- source_word: הָעָם
  choice: ang mga tao
  rationale: Pinananatili ang pangkalahatang katawagan ng Hebreo sa halip na paliitin ito sa “mga manggagawa,” bagaman iyon ang papel nila sa konteksto.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “tagapasan” at “tagapangasiwa” bilang madaling maunawaang katawagang panghanapbuhay, at inilagay ang talababa sa “tagatabas ng bato sa kabundukan,” ang pariralang aktuwal na may leksikal na kalabuan.
