  verdict: revise
  source_fidelity: Kailangang linawin sa Tagalog ang ugnayan ng אֲשֶׁר אָמַר sa יִשְׁלַח. Ang mga panustos ang siyang tinukoy ng aking panginoon bilang mga ipadadala niya sa kaniyang mga lingkod; ang kasalukuyang “na sinabi niya” ay masyadong putol at hindi malinaw kung ano ang sinabi niya. Ang “ipadala nawa” ay maayos na naghahatid ng magalang na kahilingan/jussive.
  naturalness: Natural at marangal ang “ipadala nawa ng aking panginoon.” Mas malinaw at mas idiomatiko ang “na sinabi niyang ipadadala niya” kaysa sa nakabiting “na sinabi niya.”
  terminology: Tama ang “trigo,” “sebada,” “langis,” at “alak.” Ang “langis” ay hindi dapat gawing “langis ng olibo” sa pangunahing teksto. Ang “aking panginoon” ay angkop na magalang na pagtukoy at hindi banal na titulo.
  issues:
  - severity: medium
    issue: Hindi ganap na naipapakita ng “na sinabi niya” ang kaugnayan ng sinabi sa pagpapadala ng mga panustos.
    rationale: Ang Hebreong ayos ay nag-uugnay sa mga panustos sa sinabi ng “aking panginoon” at sa kaniyang pagpapadala ng mga ito. Sa Tagalog, kailangan ang pandiwang “ipadala” sa sugnay upang hindi maging malabo o bitin ang sanggunian.
