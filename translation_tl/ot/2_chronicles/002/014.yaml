  text: וְ֠/עַתָּה הַ/חִטִּ֨ים וְ/הַ/שְּׂעֹרִ֜ים הַ/שֶּׁ֤מֶן וְ/הַ/יַּ֨יִן֙ אֲשֶׁ֣ר אָמַ֣ר אֲדֹנִ֔/י יִשְׁלַ֖ח לַ/עֲבָדָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/014.yaml
  text: And now[a], let my lord send to his servants the wheat and the barley, the oil and the wine[b], of which he has spoken.
translation:
  language: tl
  text: At ngayon, ipadalang nawa ng aking panginoon sa kaniyang mga lingkod ang trigo at sebada, ang langis[a] at alak na sinabi niyang ipadadala niya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaaring mas tiyak na unawain ang “langis” bilang “langis ng olibo” sa kontekstong ito ng paglalaan ng panustos.
    reason: lexical_alternative
  - marker: b
    text: O “na binanggit niya.” Hindi hinihingi ng Hebreo ang mas matinding diwang “na ipinangako niya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: At ngayon
  rationale: Pinananatili ang pang-ugnay na וְ at ang panandang diskurso na עַתָּה, na nagpapakilala sa praktikal na kahilingan.
- source_word: הַחִטִּים וְהַשְּׂעֹרִים
  choice: ang trigo at sebada
  rationale: Likas na mga katawagang Filipino para sa dalawang butil; ipinahihiwatig ng unang pantukoy na “ang” na mga tiyak na panustos ang tinutukoy.
- source_word: הַשֶּׁמֶן
  choice: ang langis
  rationale: Hindi tinutukoy ng Hebreo kung anong uri ng langis, bagaman malamang na langis ng olibo ito sa kontekstong ito.
- source_word: וְהַיַּיִן
  choice: at alak
  rationale: Tuwirang salin ng יַיִן bilang isa sa mga hinihinging panustos.
- source_word: אֲשֶׁר אָמַר
  choice: na sinabi niya
  rationale: Pinananatili ang payak na diwa ng אָמַר at hindi ito pinalalakas bilang “ipinangako.” Nauunawaan sa konteksto na ang sinabi ay tungkol sa mga panustos.
- source_word: אֲדֹנִי
  choice: aking panginoon
  rationale: Magalang na katawagan ni Hiram kay Solomon; maliit na titik ang ginamit upang hindi mapagkamalang banal na titulo.
- source_word: יִשְׁלַח
  choice: ipadala
  rationale: Ginamit bilang magalang na pautos o kahilingan, ayon sa jussive na gamit ng yiqtol sa konteksto.
- source_word: לַעֲבָדָיו
  choice: sa kanyang mga lingkod
  rationale: Tuwirang ipinapakita ang לְ at ang sanggunian sa mga tauhan o manggagawa ni Hiram nang hindi nililimitahan ang kahulugan sa “mga manggagawa” lamang.
