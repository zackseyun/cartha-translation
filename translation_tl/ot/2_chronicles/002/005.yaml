  text: וּ/מִ֤י יַעֲצָר כֹּ֨חַ֙ לִ/בְנֽוֹת ל֣/וֹ בַ֔יִת כִּ֧י הַ/שָּׁמַ֛יִם וּ/שְׁמֵ֥י הַ/שָּׁמַ֖יִם לֹ֣א יְכַלְכְּלֻ֑/הוּ וּ/מִ֤י אֲנִי֙ אֲשֶׁ֣ר אֶבְנֶה לּ֣/וֹ בַ֔יִת כִּ֖י אִם לְ/הַקְטִ֥יר לְ/פָנָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/005.yaml
  text: But who has the strength to build a house for him[a], since the heavens, even the highest heavens, cannot contain him? And who am I, that I should build a house for him[b], except to burn incense before him?
translation:
  language: tl
  text: Ngunit sino ang may sapat na lakas upang magtayo para sa kanya ng isang bahay, yamang hindi siya kayang saklawin ng mga langit, maging ng kataas-taasang langit?[a] At sino ako upang magtayo para sa kanya ng isang bahay, maliban upang magpausok sa harap niya?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “ang mga langit at ang mga langit ng mga langit,” isang paraang tumutukoy sa kataas-taasang langit.
    reason: lexical_alternative
  - marker: b
    text: O “upang magpausok ng handog sa harap niya.” Ang pandiwang Hebreo ay maaaring tumukoy sa pagsusunog ng insenso o sa pagpapausok ng handog.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעֲצָר כֹּחַ
  choice: may sapat na lakas
  rationale: Ipinapahayag ng idyoma ang pagkakaroon ng sapat na kakayahan o lakas para sa gawain; natural ito sa makabagong Tagalog at pinananatili ang retorikal na tanong.
- source_word: לִבְנוֹת לוֹ בַיִת
  choice: ipagtayo siya ng isang bahay
  rationale: Pinananatili ang literal na 'bahay' sa halip na ang mas interpretibong 'templo,' habang malinaw pa rin sa konteksto ang tinutukoy.
- source_word: הַשָּׁמַיִם וּשְׁמֵי הַשָּׁמַיִם
  choice: ang langit, maging ang kataas-taasang langit
  rationale: Natural na inililipat ang Hebreong pormulang superlatibo habang pinananatili ang dalawang bahaging diin ng parirala.
- source_word: לֹא יְכַלְכְּלֻהוּ
  choice: hindi siya kayang saklawin
  rationale: Ang 'saklawin' ay nagpapahayag na hindi magkakasya o malilimitahan ang Diyos kahit ng kalangitan, nang hindi nagmumungkahi na pisikal lamang ang tinutukoy.
- source_word: וּמִי אֲנִי
  choice: At sino ako
  rationale: Pinananatili ang payak na pang-ugnay at ang pagpapakumbabang ipinahihiwatig ng retorikal na tanong.
- source_word: אֲשֶׁר אֶבְנֶה לוֹ בַיִת
  choice: upang ipagtayo siya ng isang bahay
  rationale: Likas na Tagalog ito para sa sugnay na nagpapahayag ng kawalan ng karapatan o kasapatan ng nagsasalita, hindi lamang ng layunin sa hinaharap.
- source_word: כִּי אִם
  choice: maliban bilang
  rationale: 'Ipinakikita ang paglilimita: hindi upang kulungin o saklawin ang Diyos ang bahay, kundi para sa tiyak na gawaing pagsamba.'
- source_word: לְהַקְטִיר לְפָנָיו
  choice: lugar na pagsusunugan ng insenso sa harap niya
  rationale: Sa kontekstong pangtemplo, malamang na insenso ang pinatutungkulan ng hiphil ng קטר, ngunit inilalagay sa talababa ang mas malawak na posibilidad na magpausok ng handog.
theological_decisions:
- issue: Ang pagiging higit ng Diyos sa lahat laban sa pagkakaugnay niya sa templo
  choice: Nilinaw na hindi kayang saklawin ng kahit kataas-taasang langit ang Diyos at na ang bahay ay para sa gawaing pagsamba sa harap niya.
  alternative: Unawain ang bahay bilang tirahang naglalaman o nagkukulong sa Diyos.
  rationale: Ang tahasang pahayag na hindi siya kayang saklawin ng mga langit ang kumokontrol sa kahulugan ng 'bahay'; gayunman, pinananatili ng huling sugnay ang kaugnayan ng bahay sa pagsambang inihahandog sa harap niya.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang 'bahay' bilang katumbas ng בַּיִת at iniwasang ipalit agad ang interpretibong 'templo.' Ginamit ang 'kataas-taasang langit' bilang natural na katumbas ng Hebreong idyomang superlatibo.
