translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang tahasang וְעַתָּה bilang “Kaya ngayon,” ang kasarian at bilang ng manggagawa, at ang pag-uulit sa pariralang tungkol sa pag-ukit. Gumamit ng karaniwang “tanso” sa halip na teknikal na “bronse,” at nilinaw ang mga kulay bilang mga telang ginagamit sa gawaing pangtemplo.
