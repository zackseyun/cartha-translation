revisions:
- from: Kaya ngayon, padalhan mo ako ng isang lalaking bihasang gumawa sa ginto, pilak, tanso, bakal, at mga telang kulay-ube, matingkad na pula[a], at asul. Dapat marunong din siyang umukit ng mga ukit[b] kasama ng mga bihasang manggagawang narito sa akin sa Juda at Jerusalem. Sila ang inihanda ng aking amang si David.[c]
  to: Kaya ngayon, padalhan mo ako ng isang lalaking bihasa sa paggawa gamit ang ginto, pilak, tanso, bakal, kulay-ube, matingkad na pula[a], at asul, at marunong umukit ng mga ukit[b], upang makasama ang mga bihasang manggagawang kasama ko sa Juda at Jerusalem, na inihanda ng aking amang si David.[c]
  rationale: Pinanatili ang tahasang “ngayon” ng וְעַתָּה at ang panlalaking isahang artisan. Inayos ang ugnayan ng mga sugnay upang ang lalaki ay inilalarawang marunong ding umukit at upang siya ay makasama ng mga bihasang manggagawa. Inalis ang dagdag na “narito” at ang hindi tahasang “mga telang,” habang pinanatili ang maingat na ambigwidad ng mga terminong pangkulay o tinina/makulay na materyal. Inayos din ang baybay sa talababa b.
