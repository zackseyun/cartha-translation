  text: וְ/עַתָּ֡ה שְֽׁלַֽח לִ֣/י אִישׁ חָכָ֡ם לַ/עֲשׂוֹת֩ בַּ/זָּהָ֨ב וּ/בַ/כֶּ֜סֶף וּ/בַ/נְּחֹ֣שֶׁת וּ/בַ/בַּרְזֶ֗ל וּ/בָֽ/אַרְגְּוָן֙ וְ/כַרְמִ֣יל וּ/תְכֵ֔לֶת וְ/יֹדֵ֖עַ לְ/פַתֵּ֣חַ פִּתּוּחִ֑ים עִם הַֽ/חֲכָמִ֗ים אֲשֶׁ֤ר עִמִּ/י֙ בִּֽ/יהוּדָ֣ה וּ/בִֽ/ירוּשָׁלִַ֔ם אֲשֶׁ֥ר הֵכִ֖ין דָּוִ֥יד אָבִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/006.yaml
  text: Send me a skilled man to work in gold[a], silver, bronze, iron, purple, crimson, and blue, and who knows how to engrave engravings, to be with the skilled men who are with me in Judah and Jerusalem[c][b], whom my father David prepared.
translation:
  language: tl
  text: Kaya ngayon, padalhan mo ako ng isang lalaking bihasa sa paggawa gamit ang ginto, pilak, tanso, bakal, kulay-ube, matingkad na pula[a], at asul, at marunong umukit ng mga ukit[b], upang makasama ang mga bihasang manggagawang kasama ko sa Juda at Jerusalem, na inihanda ng aking amang si David.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “eskarlata” sa halip na “matingkad na pula.”
    reason: lexical_alternative
  - marker: b
    text: Literal sa Hebreo, “umukit ng mga ukit,” isang magkaugnay na pandiwa at pangngalan na tumutukoy sa mahusay na gawaing pag-ukit.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “itinalaga” o “inihanda para sa gawain”; malawak ang saklaw ng pandiwang Hebreo ayon sa konteksto.
    reason: alternative_reading
lexical_decisions:
- source_word: וְעַתָּה שְׁלַח לִי
  choice: Kaya ngayon, padalhan mo ako
  rationale: Ang וְעַתָּה ay tahasang nangangahulugang “at/ngayon” at nag-uugnay sa naunang pakiusap; ang “Kaya ngayon” ay likas na makabagong Tagalog. Ang pautos na שְׁלַח ay isang pakiusap sa konteksto, kaya ang “padalhan mo ako” ay angkop.
- source_word: אִישׁ חָכָם
  choice: isang lalaking bihasa
  rationale: Sa konteksto ng paggawa, ang חָכָם ay tumutukoy sa teknikal na kahusayan, hindi lamang sa karunungan. Pinananatili ng “lalaki” ang panlalaking isahan ng Hebreo.
- source_word: לַעֲשׂוֹת בַּזָּהָב וּבַכֶּסֶף וּבַנְּחֹשֶׁת וּבַבַּרְזֶל
  choice: gumawa sa ginto, pilak, tanso, bakal
  rationale: Ipinakikilala ng ב ang mga materyales na gagamitin ng bihasang manggagawa. Ang נְחֹשֶׁת ay “tanso” sa karaniwang Tagalog, bagaman maaari itong tumukoy nang mas partikular sa bronse sa sinaunang konteksto.
- source_word: אַרְגְּוָן וְכַרְמִיל וּתְכֵלֶת
  choice: mga telang kulay-ube, matingkad na pula, at asul
  rationale: Ang mga salita ay mga kulay o materyales na tinina para sa gawaing pangtemplo. Idinagdag ang “mga telang” bilang likas na paglilinaw sa konteksto, nang hindi tinutukoy kung sinulid o yari nang tela ang eksaktong anyo.
- source_word: יֹדֵעַ לְפַתֵּחַ פִּתּוּחִים
  choice: marunong ... umukit ng mga ukit
  rationale: Pinananatili nito ang magkaugnay na pandiwa at pangngalan sa Hebreo, kahit bahagyang inuulit ang tunog sa Tagalog.
- source_word: עִם הַחֲכָמִים אֲשֶׁר עִמִּי
  choice: kasama ng mga bihasang manggagawang narito sa akin
  rationale: Ang “bihasang manggagawa” ay malinaw sa konteksto at pinananatili ang ugnayang leksikal sa naunang חָכָם. Hindi ginagawang tahasang pagkapailalim ang payak na עִמִּי, “kasama/nasa akin.”
- source_word: אֲשֶׁר הֵכִין דָּוִיד אָבִי
  choice: Sila ang inihanda ng aking amang si David
  rationale: Ang panlalaking maramihang tinutukoy ng אֲשֶׁר ay ang mga bihasang manggagawa. Ginawang hiwalay na pangungusap upang maging malinaw ang reperensiya sa Tagalog habang pinananatili ang malawak na kahulugan ng הֵכִין.
