  register: Makabagong Filipino na marangal at madaling maunawaan. Pinanatili ang pag-uulit ng Hebreo nang hindi nagiging labis na matigas. Ang mga sinaunang yunit ay isinasatitik at ipinaliliwanag sa mga talababa.
