base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/009.yaml
  text: And behold[a], for the woodcutters, the cutters of the trees, I have given to your servants twenty thousand kors of crushed wheat, and twenty thousand kors of barley, and twenty thousand baths of wine[c][b], and twenty thousand baths of oil.
translation:
  language: tl
  text: At narito, naglaan ako para sa iyong mga lingkod—ang mga tagaputol ng kahoy, mga pumuputol ng mga puno—ng dalawampung libong kor[b] ng dinurog na trigo[a], dalawampung libong kor[b] ng sebada, dalawampung libong bat[c] ng alak, at dalawampung libong bat[c] ng langis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hindi tiyak ang di-karaniwang pariralang Hebreo; maaari rin itong mangahulugang “trigo bilang pagkain” o “binayong trigo.”
    reason: lexical_alternative
  - marker: b
    text: Ang kor ay isang sinaunang panukat ng tuyong sangkap.
    reason: cultural_note
  - marker: c
    text: Ang bat ay isang sinaunang panukat ng likido.
    reason: cultural_note
lexical_decisions:
- source_word: וְהִנֵּה
  choice: At masdan
  rationale: Pinananatili ang pang-ugnay at ang pantawag-pansing lakas ng הִנֵּה sa isang marangal ngunit mauunawaang anyo.
- source_word: לַחֹטְבִים לְכֹרְתֵי הָעֵצִים
  choice: para sa mga tagaputol ng kahoy—sa mga pumuputol ng mga puno
  rationale: Pinananatili ang dalawang magkalapit na katawagan sa Hebreo, habang nililinaw ng ikalawa ang una.
- source_word: נָתַתִּי
  choice: naglaan ako
  rationale: Sa konteksto ng liham at pangakong panustos, natural na ipinahahayag nito ang isang tiyak nang paglalaan; mas angkop dito ang 'naglaan' kaysa sa literal ngunit maaaring malabong 'nagbigay.'
- source_word: חִטִּים מַכּוֹת
  choice: dinurog na trigo
  rationale: Ang מַכּוֹת ay di-karaniwang anyo ngunit malamang na tumutukoy sa naproseso o dinurog na trigo. Itinatala sa talababa ang tunay na kawalang-katiyakan.
- source_word: לַעֲבָדֶיךָ
  choice: sa iyong mga lingkod
  rationale: Pinananatili ang leksikal na diwa ng עֲבָדִים; sa konteksto, ang mga lingkod na ito ang mga manggagawa.
- source_word: כֹּרִים
  choice: kor
  rationale: Isinasatitik ang sinaunang panukat ng tuyong sangkap sa halip na gumamit ng di-tiyak na makabagong katumbas.
- source_word: בַּתִּים
  choice: bat
  rationale: Isinasatitik ang sinaunang panukat ng likido sa halip na sapilitang tumbasan ng makabagong yunit.
- source_word: יַיִן
  choice: alak
  rationale: Karaniwan at natural na salin ng יַיִן sa kontekstong ito.
- source_word: שֶׁמֶן
  choice: langis
  rationale: Hindi idinaragdag ang 'olibo' sapagkat langis lamang ang tahasang sinasabi ng Hebreo.
- source_word: עֶשְׂרִים אֶלֶף
  choice: dalawampung libo
  rationale: Tuwirang pinananatili ang bilang sa bawat panustos.
