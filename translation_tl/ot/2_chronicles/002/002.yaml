  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יִּשְׁלַ֣ח שְׁלֹמֹ֔ה אֶל חוּרָ֥ם מֶֽלֶךְ צֹ֖ר לֵ/אמֹ֑ר כַּ/אֲשֶׁ֤ר עָשִׂ֨יתָ֙ עִם דָּוִ֣יד אָבִ֔/י וַ/תִּֽשְׁלַֽח ל֣/וֹ אֲרָזִ֔ים לִ/בְנֽוֹת ל֥/וֹ בַ֖יִת לָ/שֶׁ֥בֶת בּֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/002.yaml
  text: Then Solomon sent to Huram king of Tyre[a], saying, “As you dealt with David my father and sent him cedars to build himself a house to dwell in, so do with me.”
translation:
  language: tl
  text: Pagkatapos, nagpasabi si Solomon kay Huram na hari ng Tiro,[a] “Kung paanong pinakitunguhan mo ang aking amang si David at pinadalhan mo siya ng mga kahoy na sedro upang makapagtayo siya ng bahay na matitirhan niya—”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Huram ang anyo ng pangalan sa tekstong Hebreo rito; karaniwang Hiram naman ang anyo nito sa katumbas na salaysay sa Mga Hari.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁלַח ... אֶל
  choice: nagpasabi ... kay
  rationale: Sa konteksto ng mensaheng sinusundan ng tuwirang pananalita, likas sa modernong Tagalog ang “nagpasabi kay” at tumpak nitong ipinahihiwatig ang pagpapadala ng mensahe.
- source_word: חוּרָם
  choice: Huram
  rationale: Sinusunod nito ang anyong חוּרָם sa tekstong Hebreo ng Mga Cronica; inilalagay sa talababa ang mas pamilyar na anyong Hiram sa Mga Hari.
- source_word: מֶלֶךְ צֹר
  choice: hari ng Tiro
  rationale: Likas na salin ito ng pariralang konstruktong tumutukoy sa titulo at nasasakupan.
- source_word: כַּאֲשֶׁר עָשִׂיתָ עִם דָּוִיד אָבִי
  choice: Kung paanong pinakitunguhan mo ang aking amang si David
  rationale: Pinananatili ng “kung paanong” ang paghahambing na nagpapatuloy sa susunod na talata, at malawak ang “pinakitunguhan” gaya ng idyomang עשה עם.
- source_word: וַתִּשְׁלַח לוֹ אֲרָזִים
  choice: at pinadalhan mo siya ng mga kahoy na sedro
  rationale: Sa konteksto ng pagtatayo, ang pangmaramihang אֲרָזִים ay tumutukoy sa materyales na sedro; nililinaw ito ng “mga kahoy na sedro” nang hindi ipinapalagay na tiyak na mga troso ang anyo nito.
- source_word: לִבְנוֹת לוֹ בַיִת לָשֶׁבֶת בּוֹ
  choice: upang makapagtayo siya ng bahay na matitirhan niya
  rationale: Ipinahahayag nito ang layunin, ang benepisyaryo, at ang gamit ng bahay sa natural na modernong Tagalog.
- source_word: לֵאמֹר
  choice: tuwirang pananalita pagkatapos ng kuwit
  rationale: Hindi kailangang isalin nang hiwalay ang “sinasabi” sa Tagalog; natural na naipakikilala ng “nagpasabi” at ng panipi ang nilalaman ng mensahe.
theological_decisions:
- issue: Hindi tapos na paghahambing sa dulo ng talata
  choice: Pinanatiling bukas ang pangungusap sa pamamagitan ng gitling
  alternative: Idagdag ang “gawin mo rin iyon para sa akin” gaya ng English POB
  rationale: Walang katumbas sa ibinigay na tekstong WLC ang idinagdag na sugnay. Ang כַּאֲשֶׁר ay nagbubukas ng paghahambing na ipinagpapatuloy ng kasunod na talata, kaya hindi tahimik na pinupunan ang elipsis.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “amang si David” at “matitirhan” bilang natural ngunit hindi kolokyal na pananalita. Pinanatili ang di-tapos na estruktura ng Hebreo sa halip na idagdag ang apodosis mula sa konsultasyong Ingles.
