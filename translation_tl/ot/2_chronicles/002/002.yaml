  source_fidelity: Tapat ang salin sa tekstong Hebreo. Ang “nagpasabi ... kay” ay likas na paraan sa Tagalog upang ipahayag ang pagpapadala ni Solomon ng mensahe kay Huram, at wastong pinananatili ang bukás na paghahambing ng כַּאֲשֶׁר na nagpapatuloy sa susunod na talata. Hindi idinagdag ang apodosis na wala sa WLC ng talatang ito.
