  terminology: Wasto ang “Huram” ayon sa anyong Hebreo ng Mga Cronica, at kapaki-pakinabang at tumpak ang talababa tungkol sa “Hiram” sa Mga Hari. Wasto rin ang “hari ng Tiro” at “mga kahoy na sedro.”
