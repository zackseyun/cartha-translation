revisions:
- from: Pagkatapos ay sinabi ni Huram[a], “Purihin si Yahweh, ang Diyos ng Israel, na gumawa ng langit at lupa! Binigyan niya si Haring David ng isang marunong na anak na may wastong pagpapasiya at pang-unawa[b], na magtatayo ng isang bahay para kay Yahweh at ng isang bahay para sa kanyang kaharian.[c]”
  to: Pagkatapos ay sinabi ni Huram[a], “Purihin nawa si Yahweh, ang Diyos ng Israel, na gumawa ng langit at lupa at nagbigay kay Haring David ng isang marunong na anak na may mabuting pagpapasiya at pang-unawa[b], na magtatayo ng isang bahay para kay Yahweh at isang bahay para sa kanyang paghahari.[c]”
  rationale: Pinalapit ang pormula ng pagpapala sa Hebreo sa pamamagitan ng “Purihin nawa,” inayos ang daloy ng magkakaugnay na mga sugnay, at ginawang “kanyang paghahari” ang huling parirala upang maiwasan ang di-sinasadyang pagbasa sa “kaharian” bilang lupain. Napanatili ang pangalan, retorikal na pag-uulit ng “bahay,” at lahat ng talababa sa wastong mga angkla.
