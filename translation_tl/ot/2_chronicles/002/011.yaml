source:
  edition: WLC
  text: וַ/יֹּאמֶר֮ חוּרָם֒ בָּר֤וּךְ יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁ֣ר עָשָׂ֔ה אֶת הַ/שָּׁמַ֖יִם וְ/אֶת הָ/אָ֑רֶץ אֲשֶׁ֣ר נָתַן֩ לְ/דָוִ֨יד הַ/מֶּ֜לֶךְ בֵּ֣ן חָכָ֗ם יוֹדֵ֨עַ֙ שֵׂ֣כֶל וּ/בִינָ֔ה אֲשֶׁ֤ר יִבְנֶה בַּ֨יִת֙ לַ/יהוָ֔ה וּ/בַ֖יִת לְ/מַלְכוּתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/011.yaml
  text: Then Huram said[a], “Blessed be Yahweh, the God of Israel, who made the heavens and the earth, who has given King David a wise son, who knows discretion and understanding[c][b], who will build a house for Yahweh and a house for his kingdom.”
translation:
  language: tl
  text: Pagkatapos ay sinabi ni Huram[a], “Purihin nawa si Yahweh, ang Diyos ng Israel, na gumawa ng langit at lupa at nagbigay kay Haring David ng isang marunong na anak na may mabuting pagpapasiya at pang-unawa[b], na magtatayo ng isang bahay para kay Yahweh at isang bahay para sa kanyang paghahari.[c]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Huram ay tinatawag na “Hiram” sa katumbas na salaysay sa 1 Mga Hari; Huram ang anyong Hebreo rito sa Mga Cronica.
    reason: alternative_reading
  - marker: b
    text: Maaari ring isalin na “na may matalinong pananaw at pang-unawa.”
    reason: lexical_alternative
  - marker: c
    text: Ibig sabihin, isang bahay para sa kanyang maharlikang pamamahala; maaaring tumukoy sa palasyo o sa kompleks nito.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Pagkatapos ay sinabi
  rationale: Ipinahihiwatig ng waw-consecutive ang pagsulong ng salaysay; natural sa modernong Tagalog ang “Pagkatapos ay sinabi.”
- source_word: חוּרָם
  choice: Huram
  rationale: Sinusunod ang anyong Hebreo sa Mga Cronica at hindi ito itinutulad sa Hiram ng katumbas na salaysay sa 1 Mga Hari.
- source_word: בָּרוּךְ יְהוָה
  choice: Purihin si Yahweh
  rationale: Natural at marangal na Tagalog para sa pormulang pagpapala o pagpupuri, habang pinananatili ang banal na pangalang Yahweh.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ang Diyos ng Israel
  rationale: Tuwirang inililipat ang construct phrase at ang pagkakakilanlan ng Diyos kaugnay ng Israel.
- source_word: עָשָׂה אֶת־הַשָּׁמַיִם וְאֶת־הָאָרֶץ
  choice: na gumawa ng langit at lupa
  rationale: Ang “langit at lupa” ang natural na pariralang Tagalog para sa Hebreong merism na tumutukoy sa buong sangnilikha.
- source_word: נָתַן
  choice: Binigyan niya
  rationale: Malinaw na inilalahad ang Diyos bilang simuno at si David bilang tumanggap, ayon sa sintaks ng Hebreo.
- source_word: בֵּן חָכָם
  choice: isang marunong na anak
  rationale: Saklaw ng “marunong” ang karunungan at praktikal na kakayahang ipinahihiwatig ng חָכָם.
- source_word: יוֹדֵעַ שֵׂכֶל וּבִינָה
  choice: na may wastong pagpapasiya at pang-unawa
  rationale: Natural sa Tagalog at pinananatili ang magkaugnay ngunit magkaibang diwa ng praktikal na pagpapasiya at kakayahang umunawa.
- source_word: בַּיִת לַיהוָה
  choice: isang bahay para kay Yahweh
  rationale: Pinananatili ang literal na “bahay” sa halip na tahasang gawing “templo,” kahit iyon ang tinutukoy sa konteksto.
- source_word: בַיִת לְמַלְכוּתוֹ
  choice: isang bahay para sa kanyang kaharian
  rationale: Pinananatili ang hindi pangkaraniwang Hebreong pahayag at hindi agad nilulutas bilang “palasyo”; nililinaw sa talababa ang malamang na kahulugan.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo; ang “Yahweh” ay tuwirang transliterasyon at hindi pagpapalit nito ng isang titulo.
- issue: Kahulugan ng בַיִת לְמַלְכוּתוֹ
  choice: bahay para sa kanyang kaharian
  alternative: palasyo para sa kanyang paghahari
  rationale: Pinananatili sa pangunahing teksto ang leksikal na anyo at bahagyang tensiyon ng Hebreo, habang inilalahad sa talababa ang posibleng pagtukoy sa palasyo o kompleks ng pamahalaang maharlika.
translation_notes:
  register: Modernong Filipino Tagalog na natural, marangal, at madaling maunawaan. Ginamit ang “si/kay Yahweh” alinsunod sa karaniwang gramatika ng Tagalog para sa personal na pangalan. Pinanatili ang “bahay” sa dalawang magkatugmang parirala upang maipakita ang retorika at leksikal na anyo ng Hebreo.
