  source_fidelity: Kailangang iwasto ang pangunahing pormula ng papuri upang mas maipakita ang בָּרוּךְ יְהוָה. Ang “Purihin si Yahweh” ay natural ngunit isang tuwirang pautos; ang “Purihin nawa si Yahweh” ay mas malapit sa pormulang pagpapala. Ang “kanyang kaharian” ay maaaring magpahiwatig ng teritoryo, samantalang ang לְמַלְכוּתוֹ ay mas angkop na “kanyang paghahari” o maharlikang pamamahala.
  naturalness: Natural at marangal ang rebisyon sa modernong Filipino Tagalog. Ang magkakaugnay na sugnay na “na gumawa ... at nagbigay ...” ay mas maayos kaysa sa paghahati sa pangungusap pagkatapos ng tandang padamdam.
  terminology: Wastong pinananatili ang “Yahweh,” “Diyos ng Israel,” at “bahay.” Ginamit ang “mabuting pagpapasiya at pang-unawa” para sa שֵׂכֶל וּבִינָה, na malinaw at hindi labis na teknikal.
