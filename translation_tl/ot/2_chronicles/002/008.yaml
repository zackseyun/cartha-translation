  text: and to prepare for me timber in abundance[b][a], for the house that I am building will be great and wonderful.
translation:
  language: tl
  text: at maghanda para sa akin ng napakaraming kahoy, sapagkat ang bahay[a] na aking itinatayo ay dakila at kahanga-hanga.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “templo”; literal sa Hebreo, “bahay.”
    reason: lexical_alternative
  - marker: b
    text: O “dakila at kamangha-mangha.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְהָכִין
  choice: at maghanda
  rationale: Ang infinitibong may panlaping pang-ugnay ay nagpapatuloy sa kahilingan mula sa naunang talata; natural sa Filipino ang pautos na anyong “at maghanda” sa ganitong dugtungang pangungusap.
- source_word: לִי
  choice: para sa akin
  rationale: Tuwirang ipinapahayag nito na si Solomon ang makikinabang sa paghahanda.
- source_word: עֵצִים לָרֹב
  choice: napakaraming kahoy
  rationale: Sa konteksto ng pagtatayo, ang עֵצִים ay kahoy na gagamiting materyales. Ang “napakarami” ay likas na katumbas ng ideya ng malaking kasaganaan sa לָרֹב.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala nito ang dahilan ng kahilingan at nagpapanatili ng marangal na himig.
- source_word: הַבַּיִת
  choice: ang bahay
  rationale: Pinananatili ang literal na salitang Hebreo, habang nililinaw sa talababa na templo ang tinutukoy.
- source_word: אֲשֶׁר אֲנִי בוֹנֶה
  choice: na itinatayo ko
  rationale: Ang participle ay nagpapahiwatig ng kasalukuyan o napipintong gawain; natural ito sa modernong Filipino.
- source_word: גָּדוֹל וְהַפְלֵא
  choice: dakila at kahanga-hanga
  rationale: Ipinahahayag ng “dakila” ang laki at kadakilaan, samantalang ang “kahanga-hanga” ay naghahatid ng pambihira o kamangha-manghang katangian mula sa ugat פלא.
theological_decisions:
- issue: Kung isasalin ang הַבַּיִת bilang “bahay” o “templo”
  choice: bahay
  alternative: templo
  rationale: Ang “bahay” ang pormal na katumbas ng salitang Hebreo at pinananatili ang biblikal na idyoma; inilalagay sa talababa ang mas malinaw na reperensiyang “templo.”
- issue: Ugnayan ng גָּדוֹל at וְהַפְלֵא
  choice: dakila at kahanga-hanga
  alternative: lubhang dakila
  rationale: Maaaring unawain ang pangalawang salita bilang kaagapay na katangian o bilang pagpapatindi sa “dakila.” Pinananatili sa pangunahing teksto ang koordinadong pagbasa at itinatala ang adberbiyal na posibilidad sa talababa.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Pinanatili ang dugtungang “at” dahil nagpapatuloy ang talata sa kahilingan mula sa naunang konteksto. Iniwasan ang “troso,” na maaaring magpahiwatig lamang ng mga pinutol na punong hindi pa napoproseso.
