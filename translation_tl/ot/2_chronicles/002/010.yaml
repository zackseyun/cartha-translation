id: 2CH.2.10
reference: 2 Chronicles 2:10
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר חוּרָ֤ם מֶֽלֶךְ צֹר֙ בִּ/כְתָ֔ב וַ/יִּשְׁלַ֖ח אֶל שְׁלֹמֹ֑ה בְּ/אַהֲבַ֤ת יְהוָה֙ אֶת עַמּ֔/וֹ נְתָנְ/ךָ֥ עֲלֵי/הֶ֖ם מֶֽלֶךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/010.yaml
  text: 'Then Huram king of Tyre answered in a letter that he sent to Solomon: “Because Yahweh loves his people[c][b][a], he has made you king over them.”'
translation:
  language: tl
  text: 'Pagkatapos, sumagot si Huram[a], hari ng Tiro, sa isang liham na ipinadala niya kay Solomon[c]: “Dahil iniibig ni Yahweh ang kanyang bayan[b], ginawa ka niyang hari nila.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: Huram; tradisyonal na Hiram.'
    reason: alternative_reading
  - marker: b
    text: 'Maaari ring isalin: “Dahil sa pag-ibig ni Yahweh sa kanyang bayan.”'
    reason: lexical_alternative
  - marker: c
    text: 'Mas literal: “sinabi sa isang liham at ipinadala iyon kay Solomon.”'
    reason: source_syntax
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Pagkatapos, sumagot
  rationale: Isinusulong ng waw-consecutive ang salaysay. Bagaman karaniwang nangangahulugang “sinabi” ang pandiwa, ang “sumagot” ay likas sa konteksto ng tugon ni Huram kay Solomon; pinananatili sa talababa ang mas literal na ayos.
- source_word: חוּרָם
  choice: Huram
  rationale: Ito ang anyong tahasang nasa tekstong Hebreo; ang tradisyonal na anyong “Hiram” ay inilagay bilang alternatibo sa talababa.
- source_word: מֶלֶךְ צֹר
  choice: hari ng Tiro
  rationale: Tuwirang ipinakikilala ng construct chain ang katungkulan ni Huram at ang kahariang pinamumunuan niya.
- source_word: בִּכְתָב
  choice: sa isang liham
  rationale: Sa kontekstong ipinadala ang isang nakasulat na tugon, mas tiyak at natural ang “liham” kaysa sa pangkalahatang “kasulatan” o “nakasulat.”
- source_word: וַיִּשְׁלַח אֶל שְׁלֹמֹה
  choice: na ipinadala niya kay Solomon
  rationale: Ginawang pantulong na sugnay sa Filipino upang maiwasan ang matigas at paulit-ulit na pagkakasabi, habang pinananatili ang kilos ng pagpapadala at ang tumanggap nito.
- source_word: בְּאַהֲבַת
  choice: Dahil iniibig
  rationale: 'Maaaring maging sanhi ang gamit ng בְּ kasama ng abstraktong pangngalan: ang pag-ibig ni Yahweh sa kanyang bayan ang dahilan ng paglalagay kay Solomon bilang hari. Ang alternatibong nominal na anyo ay nasa talababa.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinalin bilang personal na pangalan sa halip na palitan ng titulong “PANGINOON,” alinsunod sa tahasang Tetragrammaton sa tekstong Hebreo.
- source_word: עַמּוֹ
  choice: ang kanyang bayan
  rationale: Ang hulaping panghalip ay tumutukoy kay Yahweh, at ang “bayan” ay angkop sa kolektibo at tipanang diwa ng עַם.
- source_word: נְתָנְךָ
  choice: ginawa ka niya
  rationale: Literal na “ibinigay ka,” ngunit sa konstruksiyong may tungkuling maharlika, idiomatiko itong tumutukoy sa paglalagay o pagtatalaga sa isang tao bilang hari.
- source_word: עֲלֵיהֶם מֶלֶךְ
  choice: hari nila
  rationale: Likas at maikli sa Filipino ang “hari nila” para sa pamumuno sa kanila; katumbas din ang mas pormal na “hari sa kanila.”
theological_decisions:
- issue: Paglalarawan sa dahilan ng paghahari ni Solomon
  choice: “Dahil iniibig ni Yahweh ang kanyang bayan”
  alternative: “Dahil sa pag-ibig ni Yahweh sa kanyang bayan”
  rationale: Parehong pinananatili ng dalawang anyo na ang pag-ibig ni Yahweh sa bayan ang dahilan ng pagkakalagay kay Solomon bilang hari, nang hindi nagdaragdag ng paliwanag tungkol sa uri o lawak ng pag-ibig na iyon.
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Personal na pangalan ang nasa pinagmulang Hebreo, kaya pinanatili itong “Yahweh” sa halip na palitan ng isang titulo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Tiro,” “Solomon,” at “Yahweh” bilang madaling makilalang anyo ng mga pangalan. Inayos bilang likas na pangungusap sa Filipino ang dalawang magkasunod na pandiwang Hebreo, ngunit itinala sa talababa ang mas literal na sintaks.
