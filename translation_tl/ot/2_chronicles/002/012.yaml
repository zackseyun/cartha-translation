  text: וְ/עַתָּ֗ה שָׁלַ֧חְתִּי אִישׁ חָכָ֛ם יוֹדֵ֥עַ בִּינָ֖ה לְ/חוּרָ֥ם אָבִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/012.yaml
  text: And now I have sent a wise man[a], skilled in understanding, Huram-abi.
translation:
  language: tl
  text: At ngayon, ipinadala ko na ang isang lalaking marunong at may pang-unawa—si Huram-abi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, Huram-abi. Ang huling bahagi ay literal na “aking ama,” ngunit dito ay malamang na isang titulong pandangal o bahagi ng katawagan sa manggagawa. Ihambing ang “Huram na kanyang ama” sa 2 Cronica 4:16.
    reason: alternative_reading
lexical_decisions:
- source_word: וְעַתָּה
  choice: At ngayon
  rationale: Pinananatili nito kapwa ang pang-ugnay at ang pamanahong pananalita na naghuhudyat sa susunod na hakbang sa tugon ng hari.
- source_word: שָׁלַחְתִּי
  choice: ipinadala ko na
  rationale: Ang Hebreong ganap na anyo ay tumutukoy sa kilos na naisagawa na ngunit mahalaga pa sa kasalukuyang usapan; likas itong ipinahahayag sa Filipino sa pamamagitan ng “ipinadala ko na.”
- source_word: אִישׁ חָכָם
  choice: isang lalaking marunong
  rationale: Tiyak na lalaki ang tinutukoy ng אִישׁ. Ang חָכָם ay maaaring mangahulugang marunong o mahusay, lalo na sa gawaing-kamay; ang “marunong” ay nagpapanatili sa lawak ng kahulugan nito.
- source_word: יוֹדֵעַ בִּינָה
  choice: may pang-unawa
  rationale: Ang literal na diwang “nakaaalam ng pang-unawa” ay ginawang natural sa Filipino nang hindi nililimitahan ang kataga sa katalinuhan lamang o sa teknikal na kasanayan lamang.
- source_word: לְחוּרָם אָבִי
  choice: si Huram-abi
  rationale: Mahirap tiyakin kung ang אָבִי ay bahagi ng pangalan, titulong pandangal, o katawagang tumutukoy sa isang dalubhasa. Ang transliterasyong “Huram-abi” ang pinakamahusay na nagpapanatili sa kalabuan nito sa pangunahing teksto.
theological_decisions:
- issue: Kahulugan ng אָבִי sa katawagang לְחוּרָם אָבִי
  choice: Ituring itong bahagi ng pangalan o katawagan ng manggagawa at isalin bilang “Huram-abi.”
  alternative: “Huram na aking ama” o “Huram, ang aking dalubhasang manggagawa”
  rationale: Maaaring gamitin ang “ama” bilang titulong pandangal para sa isang pinuno, tagapayo, o dalubhasa, at hindi lamang para sa literal na magulang. Iniiwasan ng transliterasyon ang pagpilit ng isang tiyak na pakahulugan na hindi lubos na nililinaw ng Hebreo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang payak na “marunong at may pang-unawa” upang maipahayag ang karunungan at praktikal na kakayahan nang hindi nagiging teknikal o malabong pakinggan.
