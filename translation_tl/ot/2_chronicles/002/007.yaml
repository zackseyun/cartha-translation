translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mga lingkod mo/ko” bilang natural na anyo habang pinananatili ang ugnayang ipinahihiwatig ng tekstong Hebreo. Itinama ang pagkakalagay ng mga pananda ng talababa upang ang [a] ay tumukoy sa sipres at ang [b] sa algum.
