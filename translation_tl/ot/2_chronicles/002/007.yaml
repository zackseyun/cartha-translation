base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/007.yaml
  text: Send me cedar[a], cypress, and algum timber from Lebanon, for I know that your servants know how to cut timber in Lebanon. And behold[b], my servants will be with your servants.
translation:
  language: tl
  text: Magpadala ka sa akin ng kahoy na sedro, sipres[a], at algum[b] mula sa Lebanon, sapagkat alam kong marunong ang mga lingkod mo na pumutol ng mga puno sa Lebanon. At narito, makakasama ng mga lingkod mo ang mga lingkod ko.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “enebro” o “abeto”; hindi tiyak ang eksaktong uri ng punong tinutukoy ng Hebreong beroshim.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring baybayin na “almug.” Iniuugnay ito ng ilan sa punong sandal, ngunit hindi tiyak ang uri nito.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁלַח לִי
  choice: Magpadala ka sa akin
  rationale: Tuwirang utos ang pandiwa; hindi dinagdagan ng “ngayon” dahil walang tahasang salitang temporal sa Hebreo.
- source_word: עֲצֵי אֲרָזִים
  choice: kahoy na sedro
  rationale: Ang pariralang konstrukto ay tumutukoy sa kahoy o materyales na sedro sa konteksto ng pagtatayo.
- source_word: בְּרוֹשִׁים
  choice: sipres
  rationale: Karaniwang katumbas ito sa makabagong salin, bagaman hindi tiyak ang eksaktong uri ng puno; inilalahad ang ibang posibilidad sa talababa.
- source_word: אַלְגּוּמִּים
  choice: algum
  rationale: Pinanatili ang katawagang Hebreo sa anyong transliterado dahil hindi tiyak ang uri ng kahoy at magiging mapagpalagay ang tiyak na botanikong pagkakakilanlan.
- source_word: מֵהַלְּבָנוֹן
  choice: mula sa Lebanon
  rationale: Natural na anyong heograpiko sa Filipino.
- source_word: כִּי אֲנִי יָדַעְתִּי
  choice: sapagkat alam ko
  rationale: Ang aspektong ganap ng pandiwa ay nagpapahayag dito ng kasalukuyang kaalaman.
- source_word: אֲשֶׁר עֲבָדֶיךָ יֹדְעִים
  choice: alam kong marunong ang mga lingkod mo
  rationale: Ang “marunong” ay natural na nagpapahayag ng kaalamang gumawa ng kasunod na gawain.
- source_word: לִכְרוֹת עֲצֵי לְבָנוֹן
  choice: na pumutol ng mga puno sa Lebanon
  rationale: Pinananatili ang kongkretong larawan ng pagputol o pagpapabagsak ng mga puno, sa halip na agad gawing yari nang tabla o troso.
- source_word: וְהִנֵּה
  choice: At narito
  rationale: Pinananatili ang pantawag-pansing bisa ng deiktikong kataga sa isang marangal ngunit pamilyar na anyo.
- source_word: עֲבָדַי עִם עֲבָדֶיךָ
  choice: sasama ang mga lingkod ko sa mga lingkod mo
  rationale: Walang tahasang pandiwa sa Hebreo. Ang hinaharap na “sasama” ay natural sa konteksto ng iminungkahing kaayusan at hindi nagdaragdag ng tiyak na tungkuling hindi sinabi sa teksto.
