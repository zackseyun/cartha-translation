  text: And the house that I am building will be great[b][a], for our God is greater than all gods.
translation:
  language: tl
  text: At ang bahay na itinatayo ko ay dakila[a], sapagkat higit na dakila ang aming Diyos kaysa sa lahat ng diyos.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “malaki.” Maaari ring isalin ang “bahay” bilang “templo”: “Ang templong itinatayo ko ay dakila.” Literal sa Hebreo, “ang bahay na itinatayo ko.”'
    reason: lexical_alternative
  - marker: b
    text: O “ang aming Diyos ay dakila higit sa lahat ng diyos.” Ginagamit ng Hebreo ang “dakila” kasama ng “higit sa lahat ng diyos” upang magpahayag ng paghahambing.
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/הַ/בַּיִת
  choice: At ang bahay
  rationale: Ang בַּיִת ay literal na “bahay.” Sa konteksto, tumutukoy ito sa templo, ngunit pinananatili ng “bahay” ang Hebreong larawan ng bahay ng Diyos.
- source_word: בוֹנֶה
  choice: itinatayo ko
  rationale: Ang participle ay nagpapahayag ng kasalukuyan o nalalapit na gawain; natural sa Filipino ang “itinatayo ko.”
- source_word: גָּדוֹל
  choice: dakila
  rationale: Maaaring tumukoy ang salita sa laki at kahalagahan. Mas naipapanatili ng “dakila” ang dalawang dimensiyon kaysa “malaki,” bagaman maaari ring unawain dito ang pisikal na kalakhan ng gusali.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala nito ang dahilan ng naunang pahayag sa dignified ngunit malinaw na Filipino.
- source_word: גָדוֹל ... מִ/כָּל
  choice: higit na dakila kaysa sa lahat
  rationale: Bagaman hindi morpolohikal na comparative ang גָדוֹל, ang kasunod na מִן ay bumubuo ng paghahambing; malinaw itong naihahayag sa Filipino sa “higit na ... kaysa.”
- source_word: אֱלֹהֵינוּ
  choice: ang aming Diyos
  rationale: Tuwirang salin ng pangngalang may panlaping unang panauhang maramihan.
- source_word: הָ/אֱלֹהִים
  choice: mga diyos
  rationale: Pinananatili nito ang retorikal na paghahambing sa ibang mga diyos nang hindi ipinapasiya kung sila ay mga diyus-diyosan, huwad na diyos, o mga makalangit na nilalang.
theological_decisions:
- issue: Paghahambing sa ibang mga diyos
  choice: ang aming Diyos ay higit na dakila kaysa sa lahat ng mga diyos
  alternative: ang aming Diyos ay dakila sa ibabaw ng lahat ng mga diyos
  rationale: Ang konstruksyong Hebreo ay nagpapahayag ng paghahambing. Pinananatili ng salin ang hayag na pahayag ng teksto nang hindi nagbibigay ng pilosopikal na paliwanag tungkol sa kalikasan ng tinatawag na “mga diyos.”
- issue: Paglalarawan sa itinatayong bahay
  choice: dakila
  alternative: malaki
  rationale: May saklaw ang גָּדוֹל na laki, katayuan, at kahalagahan. Pinananatili ng “dakila” ang mas malawak na diwa at ang kaugnayan nito sa kadakilaan ng Diyos sa kasunod na sugnay.
translation_notes:
  register: Modernong Filipino na may dignified na himig. Pinanatili ang literal na larawang “bahay,” habang inilagay sa talababa ang kontekstuwal na “templo.” Ginamit ang “dakila” upang maipakita kapwa ang laki at kahalagahan at upang mapanatili ang pag-uulit ng salitang Hebreo sa bahay at sa Diyos.
