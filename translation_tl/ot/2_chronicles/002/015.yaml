  source_fidelity: 'Tumpak ang pangunahing diwa: ang mga taga-Lebanon ay puputol ng kahoy ayon sa pangangailangan ni Solomon, ihahatid ang mga ito bilang balsa sa dagat hanggang Jope, at si Solomon ang magdadala ng mga ito paitaas sa Jerusalem. Gayunman, ang “iaahon” ay karaniwang may tiyak na pahiwatig ng pag-ahon mula sa tubig o mula sa isang mababang lugar; ang “iaakyat” ang mas tuwirang katumbas ng causative na תַּעֲלֶה at ng pagdadala patungong Jerusalem.'
  naturalness: Malinaw at angkop ang rehistro. Mas likas at mas matimbang sa modernong Filipino ang “ayon sa lahat ng pangangailangan mo” kaysa “ayon sa lahat ng kailangan mo” sa ganitong pormal na kasunduan sa suplay.
  terminology: Ang “kahoy,” “balsa,” “Jope,” at “Jerusalem” ay angkop. Napananatili ng “balsa” ang paraan ng transportasyon at ng “iaakyat” ang direksiyong pataas nang hindi nagdaragdag ng kahulugang wala sa Hebreo.
