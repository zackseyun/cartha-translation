base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/015.yaml
  text: And we will cut timber from Lebanon[a], as much as you need, and bring it to you as rafts by sea to Joppa[c][b]; and you will take it up to Jerusalem.
translation:
  language: tl
  text: Puputol kami ng kahoy mula sa Lebanon, ayon sa lahat ng pangangailangan mo. Dadalhin namin sa iyo ang mga iyon bilang mga balsa[a] sa dagat patungong Jope.[b] At iaakyat[c] mo ang mga iyon sa Jerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa mga balsa” o “bilang mga palutang.”
    reason: lexical_alternative
  - marker: b
    text: Ang Jope ay daungang-dagat na kalaunan ay nakilala bilang Jaffa.
    reason: cultural_note
  - marker: c
    text: Sa Hebreo, “iaakyat.” Mas mataas ang kinaroroonan ng Jerusalem kaysa sa baybayin.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנַחְנוּ נִכְרֹת
  choice: Puputol kami
  rationale: Ang נִכְרֹת ay Qal imperfect na unang panauhang maramihan ng כרת at, kapag kahoy ang tinutukoy, ay nangangahulugang pumutol o magputol. Ang tahasang panghalip na וַאֲנַחְנוּ ay naipahihiwatig ng natural na ayos na “Puputol kami” nang hindi pinabibigat ang Filipino.
- source_word: עֵצִים
  choice: kahoy
  rationale: Sa konteksto ng mga materyales sa pagtatayo, tumutukoy ito sa kahoy na puputulin at ihahatid. Likas at malawak na nauunawaan sa modernong Filipino ang “kahoy,” samantalang mas teknikal ang “troso.”
- source_word: מִן הַלְּבָנוֹן
  choice: mula sa Lebanon
  rationale: Tumutukoy ang parirala sa kilalang kagubatang rehiyon ng Lebanon. Karaniwang hindi na kailangan sa Filipino ang katumbas ng tiyak na pantukoy na nasa Hebreo.
- source_word: כְּכָל צָרְכֶּךָ
  choice: ayon sa lahat ng kailangan mo
  rationale: Pinananatili nito ang ideya na ang dami ng kahoy ay tutugon sa kabuuan ng pangangailangan ni Solomon, sa natural na modernong Filipino.
- source_word: וּנְבִיאֵם לְךָ
  choice: Dadalhin namin sa iyo ang mga iyon
  rationale: Ang hulaping panghalip sa Hebreo ay maramihan at tumutukoy sa mga piraso ng kahoy. Pinananatili ng “mga iyon” ang gramatikal na bilang ng pinagmulan.
- source_word: רַפְסֹדוֹת
  choice: bilang mga balsa
  rationale: Ang salita ay tumutukoy sa mga kahoy na pinagsama upang lumutang para sa pagdadala. Ang “bilang mga balsa” ay malinaw ngunit hindi itinatago ang posibleng pagbasa na “sa mga balsa,” kaya nilagyan ng talababa.
- source_word: עַל יָם יָפוֹ
  choice: sa dagat patungong Jope
  rationale: Ipinapahayag ng parirala ang pagdadala sa dagat na ang hantungan ay Jope. Ang “Jope” ay isang kinikilalang anyong biblikal sa Filipino ng יָפוֹ.
- source_word: תַּעֲלֶה אֹתָם
  choice: iaahon mo ang mga iyon
  rationale: Ang עלה ay may direksiyong pataas. Ang “iaahon” ay nagpapanatili sa topograpikong pahiwatig ng pagdadala mula sa baybayin tungo sa mas mataas na Jerusalem.
- source_word: יְרוּשָׁלִָם
  choice: Jerusalem
  rationale: Ito ang pamantayan at madaling makilalang anyo ng pangalan sa modernong Filipino.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang maiikling sugnay upang maging natural ang daloy, habang pinananatili ang maramihang pagtukoy sa mga piraso ng kahoy at ang direksiyong pataas sa Jerusalem. Inayos ang pagkakalagay ng mga talababa upang tumugma ang bawat marker sa salitang ipinaliliwanag nito.
