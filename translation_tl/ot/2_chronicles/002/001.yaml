base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/001.yaml
  text: Solomon counted seventy thousand men as burden-bearers[a], and eighty thousand men as stonecutters in the hill country, and over them three thousand six hundred overseers.
translation:
  language: tl
  text: Binilang ni Solomon ang pitumpung libong lalaking tagapasan, ang walumpung libong lalaking tagatibag ng bato sa kabundukan[a], at ang tatlong libo at animnaraang tagapangasiwa sa kanila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “mga tumitibag sa bundok.” Maaari ring isalin na “mga tagatibag ng bato sa mga bundok.”
    reason: Pinananatili nito ang literal na anyo at saklaw ng חֹצֵב בָּהָר, habang ipinapaliwanag na ang ‘bato’ ay ipinahihiwatig ng konteksto.
lexical_decisions:
- source_word: וַיִּסְפֹּר
  choice: Binilang
  rationale: Ang pandiwang ספר sa anyong pasalaysay ay tuwirang nangangahulugang ‘binilang’ o ‘itinala ang bilang.’ Ang ‘binilang’ ang pinakanatural at hindi nagdaragdag ng ideya ng pormal na pagpapatala.
- source_word: אִישׁ סַבָּל
  choice: lalaking tagapasan
  rationale: Ang אִישׁ ay tumutukoy sa mga lalaki, at ang סַבָּל ay manggagawang nagdadala ng mabibigat na pasan. Pinananatili ng ‘lalaking tagapasan’ ang uri ng gawain at ang panlalaking pagtukoy ng Hebreo.
- source_word: חֹצֵב בָּהָר
  choice: lalaking tagatibag ng bato sa kabundukan
  rationale: Ang חצב ay ‘tumibag’ o ‘humukay/umukit,’ at sa konteksto ng gawaing pagtatayo ay tumutukoy sa pagtibag ng bato. Ang בָּהָר ay literal na ‘sa bundok’ at maaari ring tumukoy sa kabundukan. Ginagawang malinaw ng ‘ng bato’ ang ipinahihiwatig ng konteksto nang hindi binabago ang uri ng gawain.
- source_word: וּמְנַצְּחִים עֲלֵיהֶם
  choice: tagapangasiwa sa kanila
  rationale: Sa kontekstong panggawain, ang participle na מְנַצְּחִים ay tumutukoy sa mga namamahala o nangangasiwa. Likas sa Filipino ang ‘tagapangasiwa sa kanila’ at naipapahayag nito ang עֲלֵיהֶם nang hindi gumagamit ng alanganing literal na ‘sa ibabaw nila.’
- source_word: שְׁלֹשֶׁת אֲלָפִים וְשֵׁשׁ מֵאוֹת
  choice: tatlong libo at animnaraan
  rationale: Tuwirang salin ito ng bilang at natural ang anyo sa modernong Filipino.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang mga salitang pangkaraniwang mauunawaan—‘tagapasan,’ ‘tagatibag ng bato,’ at ‘tagapangasiwa’—habang pinananatili ang ayos ng talaan at ang eksaktong mga bilang sa Hebreo.
