translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa salaysay. Iniwasan ang labis na teknikal na “sensos” sa pangunahing teksto at ginamit ang “talaan ng mga binilang” upang maging natural sa karaniwang mambabasa habang pinananatili ang kaugnayan sa naunang pagbilang.
