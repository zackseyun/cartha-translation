base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/016.yaml
  text: Then Solomon counted all the resident foreigners who were in the land of Israel[a], after the census that David his father had taken of them, and they were found to be one hundred fifty-three thousand six hundred.
translation:
  language: tl
  text: Pagkatapos, binilang ni Solomon ang lahat ng lalaking dayuhang naninirahan sa lupain ng Israel[a], pagkatapos ng sensus na isinagawa ni David na kanyang ama. Ang bilang nila ay 153,600.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga nakikipamayang dayuhan” o “mga residenteng dayuhan.” Ang salitang Hebreo ay tumutukoy sa mga hindi Israelitang naninirahan sa nasasakupan ng Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְפֹּר
  choice: binilang
  rationale: Tumutukoy ang pandiwa sa pagbilang o pagtatala ng mga tao. Ang “binilang” ay tuwiran at natural sa modernong Tagalog.
- source_word: הָאֲנָשִׁים הַגֵּירִים
  choice: ang lahat ng dayuhang naninirahan
  rationale: Ang גֵּרִים ay mga hindi katutubong naninirahan sa lupain, hindi lamang mga nagdaraan. Malinaw na ipinahihiwatig ng “dayuhang naninirahan” ang kanilang kalagayan.
- source_word: בְּאֶרֶץ יִשְׂרָאֵל
  choice: sa lupain ng Israel
  rationale: Pinananatili nito ang hayagang teritoryal na diwa ng אֶרֶץ.
- source_word: אַחֲרֵי הַסְּפָר
  choice: ayon sa talaan ng mga binilang noon
  rationale: Maaaring mangahulugan ang parirala ng pagiging kasunod sa naunang pagbilang o ng paggamit sa tala nito bilang batayan. Sa konteksto, natural sa Tagalog ang pagbanggit sa naunang talaan, habang ang “noon” ay nagpapakita ng temporal na ugnayan.
- source_word: אֲשֶׁר סְפָרָם דָּוִיד אָבִיו
  choice: ng kanyang amang si David
  rationale: Ipinahahayag nang malinaw kung sino ang nagsagawa ng naunang pagbilang at likas sa Tagalog ang ayos na “kanyang amang si David.”
- source_word: וַיִּמָּצְאוּ
  choice: Napag-alamang sila ay
  rationale: 'Pinananatili nito ang pasibo at resultang diwa ng Niphal: ito ang kabuuang lumitaw sa pagbilang.'
- source_word: מֵאָה וַחֲמִשִּׁים אֶלֶף וּשְׁלֹשֶׁת אֲלָפִים וְשֵׁשׁ מֵאוֹת
  choice: 153,600 lahat
  rationale: Eksaktong inilalahad ang kabuuan sa madaling basahing modernong anyong pamilang.
