  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: בֶּן אִשָּׁ֞ה מִן בְּנ֣וֹת דָּ֗ן וְ/אָבִ֣י/ו אִישׁ צֹרִ֡י יוֹדֵ֡עַ לַ/עֲשׂ֣וֹת בַּ/זָּֽהָב וּ֠/בַ/כֶּסֶף בַּ/נְּחֹ֨שֶׁת בַּ/בַּרְזֶ֜ל בָּ/אֲבָנִ֣ים וּ/בָ/עֵצִ֗ים בָּ/אַרְגָּמָ֤ן בַּ/תְּכֵ֨לֶת֙ וּ/בַ/בּ֣וּץ וּ/בַ/כַּרְמִ֔יל וּ/לְ/פַתֵּ֨חַ֙ כָּל פִּתּ֔וּחַ וְ/לַ/חְשֹׁ֖ב כָּל מַחֲשָׁ֑בֶת אֲשֶׁ֤ר יִנָּֽתֶן ל/וֹ֙ עִם חֲכָמֶ֔י/ךָ וְֽ/חַכְמֵ֔י אֲדֹנִ֖/י דָּוִ֥יד אָבִֽי/ךָ־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/013.yaml
  text: the son of a woman from the daughters of Dan[a], and his father was a man of Tyre, skilled to work in gold and silver, bronze and iron, stone and wood, purple, blue, fine linen, and crimson, and to engrave every kind of engraving and to devise every kind of design that may be assigned to him[b], with your skilled men and the skilled men of my lord David your father.
translation:
  language: tl
  text: Anak siya ng isang babae mula sa mga anak na babae ni Dan[a]. Ang kanyang ama ay isang taga-Tiro. Dalubhasa siyang gumawa gamit ang ginto, pilak, tanso, bakal, bato, kahoy, tela na kulay-ube, asul na tela, pinong lino, at telang matingkad na pula[b]. Marunong siyang umukit ng lahat ng uri ng ukit at magdisenyo ng bawat uri ng disenyo na ipagagawa sa kanya, kasama ng iyong mga dalubhasang manggagawa at ng mga dalubhasang manggagawa ng panginoon kong si David na iyong ama.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “mula sa mga anak na babae ni Dan” ay malamang na nangangahulugang ang kanyang ina ay mula sa lipi ni Dan.
    reason: cultural_note
  - marker: b
    text: Maaari ring isalin na “iskarlata.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אִשָּׁה מִן בְּנוֹת דָּן
  choice: anak ng isang babae mula sa mga anak na babae ni Dan
  rationale: Pinananatili ang tahasang anyo ng Hebreo at ang paglalarawan sa pinagmulan ng kanyang ina, sa halip na agad itong ipakahulugang “mula sa lipi ni Dan.”
- source_word: וְאָבִיו אִישׁ צֹרִי
  choice: Ang kanyang ama ay isang taga-Tiro
  rationale: Likas at malinaw sa modernong Tagalog ang “taga-Tiro” para sa lalaking nagmula sa Tiro.
- source_word: יוֹדֵעַ לַעֲשׂוֹת
  choice: Dalubhasa siyang gumawa
  rationale: Ipinapahayag nito ang praktikal na kahusayan ng isang bihasang manggagawa, hindi lamang kaalamang pangkaisipan.
- source_word: בַּזָּהָב וּבַכֶּסֶף בַּנְּחֹשֶׁת בַּבַּרְזֶל בָּאֲבָנִים וּבָעֵצִים
  choice: gamit ang ginto, pilak, tanso, bakal, bato, at kahoy
  rationale: Ang “gamit ang” ay natural na nagpapakita sa mga materyales na kaya niyang gawan.
- source_word: בָּאַרְגָּמָן בַּתְּכֵלֶת וּבַבּוּץ וּבַכַּרְמִיל
  choice: telang kulay-ube, asul, pinong lino, at matingkad na pula
  rationale: Ginawang malinaw na mga tela o tininaang materyal ang mga terminong pangkulay; ang “matingkad na pula” ay madaling maunawaang katumbas ng כרמיל habang kinikilala sa talababa ang alternatibong kulay.
- source_word: וּלְפַתֵּחַ כָּל פִּתּוּחַ
  choice: umukit ng lahat ng uri ng ukit
  rationale: Pinananatili ang magkaugnay na pandiwa at pangngalan ng Hebreo at ang diin sa sari-saring gawaing pag-ukit.
- source_word: וְלַחְשֹׁב כָּל מַחֲשָׁבֶת אֲשֶׁר יִנָּתֶן לוֹ
  choice: magdisenyo ng anumang disenyo na ipagagawa sa kanya
  rationale: Sa konteksto ng sining at paggawa, ang חשׁב ay tumutukoy sa pagbuo ng disenyo; ang anyong pasibo ay pinananatili sa “ipagagawa sa kanya.”
- source_word: עִם חֲכָמֶיךָ וְחַכְמֵי אֲדֹנִי דָּוִיד אָבִיךָ
  choice: kasama ng iyong mga dalubhasang manggagawa at ng mga dalubhasang manggagawa ng panginoon kong si David na iyong ama
  rationale: Ang חכמים ay ipinakahulugang mga bihasang manggagawa ayon sa konteksto, at ang אֲדֹנִי ay isinaling pantao at magalang na titulo.
theological_decisions:
- issue: Kasarian ng mga bihasang manggagawa
  choice: mga dalubhasang manggagawa
  alternative: mga dalubhasang lalaki / mga artisano mo
  rationale: Walang likas na markang pangkasarian sa pangmaramihang pangngalang Tagalog na “manggagawa.” Hindi kailangang magdagdag ng “lalaki,” na wala namang hiwalay na leksikal na diin sa teksto; ang parirala ay tumpak na tumutukoy sa pangkat ng mga artisan.
- issue: Pantao at magalang na titulong אֲדֹנִי
  choice: panginoon kong si David
  alternative: amo kong si David
  rationale: Ang salita rito ay magalang na katawagan sa taong si David, hindi banal na titulo. Ang maliit na titik sa “panginoon” ay tumutulong panatilihin ang pagkakaibang ito.
- issue: Pagkakakilanlan ng ina bilang mula sa “mga anak na babae ni Dan”
  choice: pinanatili ang literal na pahayag at ipinaliwanag sa talababa
  alternative: mula sa lipi ni Dan
  rationale: Malamang na ang tinutukoy ay ang liping Dan, ngunit hindi tahasang ginagamit ng Hebreo ang salitang “lipi”; kaya hindi nilutas sa pangunahing teksto ang metonimikong pahayag.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang anyong genealogical at ang courtly address, habang ginawang natural ang bokabularyo ng paggawa at disenyo. Inayos ang mga marker upang ang talababa tungkol kay Dan ay nakalagay kay Dan at ang alternatibong kulay ay nakalagay sa “matingkad na pula.”
