base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/016/012.yaml
  text: In the thirty-ninth year of his reign[a], Asa became diseased in his feet; his disease became very severe. Yet even in his disease he did not seek Yahweh, but the physicians.
translation:
  language: tl
  text: Sa ikatatlumpu’t siyam na taon ng kanyang paghahari, nagkasakit si Asa sa kanyang mga paa, at lumubha nang husto ang kanyang sakit. Ngunit kahit may sakit siya, hindi niya hinanap si Yahweh kundi ang mga manggagamot.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “hindi siya sumangguni kay Yahweh kundi sa mga manggagamot.” Eliptikal ang sugnay sa Hebreo at ipinaghahambing ang paghanap kay Yahweh at ang paglapit sa mga manggagamot.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּחֱלֶא
  choice: nagkasakit
  rationale: Likas at malinaw na salin ng pandiwang חלה, na tumutukoy sa pagkakasakit o panghihina.
- source_word: בְּרַגְלָיו
  choice: sa kanyang mga paa
  rationale: Ang רֶגֶל ay maaaring mangahulugang paa o binti; “mga paa” ang tuwirang kahulugan at angkop sa konteksto ng karamdamang nasa ibabang bahagi ng katawan.
- source_word: עַד לְמַעְלָה חָלְיוֹ
  choice: lumubha nang husto ang kanyang sakit
  rationale: Sa konteksto, ang idyomang עַד לְמַעְלָה ay nagpapahayag ng sukdulang tindi ng sakit, hindi karaniwang direksiyong pataas.
- source_word: חָלְיוֹ / בְּחָלְיוֹ
  choice: ang kanyang sakit / kahit may sakit siya
  rationale: Ang “sakit” ay natural sa modernong Filipino. Bahagyang binago ang ikalawang anyo upang maiwasan ang mabigat at di-likas na pag-uulit ng “sa kanyang sakit,” habang pinananatili ang kahulugan.
- source_word: דָרַשׁ אֶת יְהוָה
  choice: hindi niya hinanap si Yahweh
  rationale: Pinananatili ng “hinanap” ang malawak na diwa ng דרש—ang paghanap, paglapit, o pagsangguni sa Diyos—nang hindi ito nililimitahan lamang sa paghingi ng kagalingan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang transliterasyon ng personal na pangalan ng Diyos sa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: כִּי בָּרֹפְאִים
  choice: kundi ang mga manggagamot
  rationale: Ang sugnay sa Hebreo ay eliptikal, literal na may diwang “kundi/sa mga manggagamot.” Ang salin ay nagpapanatili sa maikli at matinding paghahambing, habang ipinaliliwanag sa talababa ang alternatibong pagbasa.
theological_decisions:
- issue: Kung hinahatulan ba ng talata ang pagpapagamot mismo o ang hindi paghanap ni Asa kay Yahweh
  choice: 'Pinanatili ang paghahambing: hindi hinanap ni Asa si Yahweh kundi ang mga manggagamot.'
  alternative: Unawain ang talata bilang pangkalahatang pagbabawal sa paggamit ng mga manggagamot.
  rationale: Ang diin ng Hebreo ay nasa hindi paghanap ni Asa kay Yahweh at sa halip ay pagharap niya sa mga manggagamot. Hindi sapat ang teksto upang magpasok ng pangkalahatang pagtutol sa panggagamot.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “manggagamot” bilang dignified at madaling maunawaang katawagan; iniwasan ang sobrang teknikal o makalumang pananalita.
