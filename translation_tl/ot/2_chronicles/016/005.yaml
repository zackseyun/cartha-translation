  - severity: low
    issue: Ang “ipinatigil niya ang gawain niya” ay medyo di-likas at maaaring magpahiwatig ng pagpapautos sa ibang tao.
    rationale: Ang Hiphil ng שבת ay maaaring isalin sa Filipino bilang “itinigil niya” kapag ang layon ay sariling gawain; natural itong katumbas ng ‘caused his work to cease’ nang hindi nagdaragdag ng ahensiyang hindi tahasang binabanggit.
