  text: And when Baasha heard it[a], he stopped building Ramah and ceased his work.
translation:
  language: tl
  text: Nang marinig ito ni Baasa, tumigil siya sa pagtatayo ng Rama[a] at itinigil niya ang kanyang gawain.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pagpapatibay sa Rama”; sa kontekstong ito, maaaring tumukoy ang Hebreo sa paghinto ng pagtatayo o pagpapatibay sa Rama.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּשְׁמֹעַ
  choice: Nang marinig ito
  rationale: Ang temporal na pariralang Hebreo ay likas na ipinapahayag sa Filipino sa pamamagitan ng “Nang.” Ang “ito” ay idinagdag bilang likas na layon ng “marinig,” na tumutukoy sa naunang pangyayari.
- source_word: בַּעְשָׁא
  choice: Baasa
  rationale: Isinalin ang pangalang pantangi ayon sa karaniwang anyong Filipino.
- source_word: וַיֶּחְדַּל מִבְּנוֹת
  choice: tumigil siya sa pagpapatibay
  rationale: Ang חדל na may מן at pawatas ay nagsasaad ng pagtigil sa isang gawain. Sa konteksto, ang pagtatayo sa Rama ay pagpapatibay o pagkukuta rito.
- source_word: אֶת הָרָמָה
  choice: sa Rama
  rationale: Ang Rama ay pangalan ng lugar. Ginamit ang “sa” dahil likas sa Filipino ang “pagpapatibay sa” isang bayan o lugar.
- source_word: וַיַּשְׁבֵּת
  choice: at ipinatigil niya
  rationale: 'Ang Hiphil ng שבת ay causative: pinatigil o winakasan niya ang gawain. Pinananatili ng “ipinatigil” ang causative na anyo, sa halip na ipakahulugang siya lamang ang huminto.'
- source_word: מְלַאכְתּוֹ
  choice: ang gawain niya
  rationale: Ang מְלָאכָה ay tumutukoy sa gawain o proyekto; ang “gawain niya” ay malinaw at natural sa modernong Filipino.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “pagpapatibay” sa pangunahing teksto upang maipakita ang kontekstuwal na diwa ng pagtatayo bilang pagkukuta, habang pinanatili sa talababa ang mas literal na “pagtatayo.”
