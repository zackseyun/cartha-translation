base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/016/009.yaml
  text: For the eyes of Yahweh range throughout all the earth to strengthen those whose heart is wholly toward him[a]. You have acted foolishly in this; for from now on you will have wars.
translation:
  language: tl
  text: Sapagkat ang mga mata ni Yahweh ay nagmamasid sa buong daigdig upang palakasin ang mga taong ang puso ay lubos na nakatuon sa kanya.[a] Kumilos ka nang may kahangalan sa bagay na ito; sapagkat mula ngayon ay magkakaroon ka ng mga digmaan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “upang ipakita niya ang kanyang lakas alang-alang sa mga taong ang puso ay buong-buong nakatuon sa kanya.”
    reason: Posibleng alternatibong diwa ng לְהִתְחַזֵּק at שָׁלֵם.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos sa Hebreo ayon sa default na salin ng proyekto.
- source_word: עֵינָיו מְשֹׁטְטוֹת
  choice: ang mga mata ni Yahweh ay nagmamasid
  rationale: Pinananatili ang antropomorpikong larawan ng mga mata ng Diyos habang natural na ipinahahayag sa Filipino ang masigasig at malawak na pagsisiyasat.
- source_word: בְּכָל הָאָרֶץ
  choice: sa buong daigdig
  rationale: Ang pahayag ay pangkalahatan ang saklaw; mas angkop ang “daigdig” kaysa “lupain” sa kontekstong ito.
- source_word: לְהִתְחַזֵּק
  choice: upang palakasin
  rationale: Ipinahahayag ang layunin ng pagkilos ni Yahweh bilang aktibong pagsuporta o pagpapalakas sa mga tapat sa kanya; inilalahad sa talababa ang posibleng mas reflexive na kahulugan.
- source_word: עִם לְבָבָם שָׁלֵם אֵלָיו
  choice: ang mga taong ang puso ay lubos na nakatuon sa kanya
  rationale: Ang שָׁלֵם ay tumutukoy sa buo at di-hating katapatan, hindi sa ganap na kawalan ng kasalanan.
- source_word: נִסְכַּלְתָּ עַל זֹאת
  choice: Naging hangal ka sa bagay na ito
  rationale: Natural at tuwirang propetikong pagsaway na tumutukoy sa ginawa ni Asa.
- source_word: מֵעַתָּה יֵשׁ עִמְּךָ מִלְחָמוֹת
  choice: mula ngayon ay magkakaroon ka ng mga digmaan
  rationale: Natural na Filipino para sa eksistensiyal na konstruksiyong may hinaharap na diwa dahil sa “mula ngayon.”
theological_decisions:
- issue: Kahulugan ng שָׁלֵם bilang paglalarawan sa puso
  choice: buo at di-hating katapatan sa Diyos
  alternative: walang kapintasan o sakdal sa harap niya
  rationale: Ang konteksto ay tungkol sa lubos na pagtitiwala at katapatan kay Yahweh, hindi sa doktrina ng kawalang-kasalanan.
- issue: Saklaw ng הָאָרֶץ
  choice: buong daigdig
  alternative: buong lupain
  rationale: Ang kasabihan ay may pangkalahatan at pansansinukob na himig, bagaman maaari ring mangahulugan ng “lupain” ang salita sa ibang konteksto.
- issue: Diwa ng לְהִתְחַזֵּק
  choice: palakasin ang mga tapat sa kanya
  alternative: ipakita ang kanyang lakas alang-alang sa kanila
  rationale: Kapwa posible sa anyo at konteksto; pinili sa teksto ang benefactive na diwa at pinanatili sa talababa ang reflexive na posibilidad.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang matinding propetikong pagsaway, ang larawan ng mga mata ni Yahweh, at ang tunay na leksikal na posibilidad sa talababa.
