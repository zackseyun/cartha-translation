  source_fidelity: 'Tumpak sa kabuuan ang unang pangungusap: napapanatili ang larawan ng mga mata ni Yahweh, ang pansansinukob na saklaw, at ang diwa ng buong-pusong katapatan. Gayunman, ang ''Naging hangal ka'' ay bahagyang naglilipat mula sa kilos na sinasaway ng נִסְכַּלְתָּ tungo sa katayuan ng tao. Mas tumpak ang isang saling tuwirang tumutukoy sa ginawa niya. Ang ''kaya'' ay maaari, ngunit ang ''sapagkat'' ay mas malapit sa כִּי at sa ugnayan ng babala.'
  naturalness: Natural at makabagong Filipino ang 'nagmamasid sa buong daigdig' at 'lubos na nakatuon sa kanya.' Mas malinaw at mas tuwiran sa pagsaway ang 'Kumilos ka nang may kahangalan.' Inayos din ang talababa upang ang 'buong-buo' ay malinaw na tumutukoy sa pagtuon ng puso kay Yahweh.
  terminology: Wastong pinanatili ang 'Yahweh.' Ang 'lubos na nakatuon sa kanya' ay mahusay na pagpapahayag ng שָׁלֵם bilang di-hating katapatan, hindi kawalang-kasalanan. Ang alternatibong talababa ay pinanatili nang hindi nagtatakda ng isang doktrinal na pakahulugan.
