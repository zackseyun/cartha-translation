base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/016/004.yaml
  text: Ben-hadad listened to King Asa and sent the commanders of his armies against the cities of Israel[a], and they struck Ijon, Dan, Abel-maim, and all the store-cities of Naphtali.
translation:
  language: tl
  text: Pinakinggan ni Ben-hadad si Haring Asa at isinugo ang mga pinuno ng kaniyang mga hukbo laban sa mga lungsod ng Israel. Sinalakay nila ang Ijon, Dan, Abel-maim[a], at ang lahat ng mga lungsod na imbakan ng Neftali.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Abel-maim” ang mababasa sa tekstong Hebreo rito; kinikilala ito ng ilan bilang Abel-bet-maaca na binabanggit sa mga katulad na salaysay.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁמַע ... אֶל
  choice: Pinakinggan
  rationale: Sa konteksto, hindi lamang narinig ni Ben-hadad si Asa kundi tumugon siya sa kahilingan nito. Ipinahihiwatig ng “pinakinggan” ang pakikinig at pagsang-ayon nang hindi pinalalakas tungo sa “sinunod.”
- source_word: שָׂרֵי הַחֲיָלִים אֲשֶׁר לוֹ
  choice: ang mga pinuno ng kanyang mga hukbo
  rationale: Ang שָׂרֵי ay mga pinuno o kumander, at ang הַחֲיָלִים ay mga puwersang militar. Likas sa modernong Filipino ang anyong ito at malinaw na kay Ben-hadad ang mga hukbo.
- source_word: אֶל עָרֵי יִשְׂרָאֵל
  choice: laban sa mga lungsod ng Israel
  rationale: Ipinakikita ng אֶל sa kontekstong militar ang patutunguhan at layunin ng ipinadalang hukbo.
- source_word: וַיַּכּוּ
  choice: Sinalakay nila
  rationale: Sa salaysay na militar, ang נכה ay maaaring mangahulugang hampasin, salakayin, o talunin. Ang “sinalakay” ay natural at hindi nagsasaad nang higit sa malinaw na sinasabi ng konteksto.
- source_word: אָבֵל מָיִם
  choice: Abel-maim
  rationale: Ito ang mismong pangalang mababasa sa tekstong Hebreo rito; hindi ito tahimik na itinugma sa pangalan sa mga kahawig na talata.
- source_word: כָּל מִסְכְּנוֹת עָרֵי נַפְתָּלִי
  choice: ang lahat ng imbakan sa mga lungsod ng Neftali
  rationale: Ang מִסְכְּנוֹת ay tumutukoy sa mga imbakan o bodega ng panustos. Pinananatili ng salin ang kaugnayan ng mga ito sa mga lungsod ng Neftali nang hindi ipinapalagay na ang bawat lungsod mismo ay isang “lungsod-imbakan.”
