  text: וַ/יִּשְׁכַּ֥ב אָסָ֖א עִם אֲבֹתָ֑י/ו וַ/יָּ֕מָת בִּ/שְׁנַ֛ת אַרְבָּעִ֥ים וְ/אַחַ֖ת לְ/מָלְכֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/016/013.yaml
  text: And Asa slept with his fathers and died in the forty-first year of his reign[a].
translation:
  language: tl
  text: At nahimlay si Asa kasama ng kanyang mga ninuno, at namatay siya sa ikaapatnapu't isang taon ng kanyang paghahari.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “nahimlay kasama ng kanyang mga ninuno,” isang nakaugaliang pananalita tungkol sa kamatayan at pagkakalibing sa piling ng mga ninuno.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: nahimlay
  rationale: Pinananatili nito ang larawang 'humiga/natulog' sa nakaugaliang pormula tungkol sa kamatayan, nang hindi inuulit lamang ang kasunod na tahasang 'namatay.' Dignified at natural din ito sa salaysay.
- source_word: עִם אֲבֹתָיו
  choice: kasama ng kanyang mga ninuno
  rationale: Ang 'mga ninuno' ay natural at malinaw sa modernong Filipino at naipapahayag ang ugnayang pampamilya at pandinastiya ng Hebrew na אָבוֹת.
- source_word: וַיָּמָת
  choice: namatay siya
  rationale: Tahasan itong pinananatili sapagkat kapuwa ginagamit ng Hebrew ang nakaugaliang idyoma at ang payak na pahayag ng kamatayan.
- source_word: בִּשְׁנַת אַרְבָּעִים וְאַחַת
  choice: sa ikaapatnapu't isang taon
  rationale: Natural na Filipino na pagpapahayag ng ordinal na diwa ng pormula sa pagtatala ng mga taon ng paghahari.
- source_word: לְמָלְכוֹ
  choice: ng kanyang paghahari
  rationale: Ito ang malinaw at karaniwang katumbas sa Filipino para sa panahon ng kanyang pamamahala bilang hari.
- source_word: אָסָא
  choice: Asa
  rationale: Karaniwang transliterasyon sa Filipino ng pangalang pantangi.
theological_decisions:
- issue: Kahulugan ng pormulang 'nahimlay kasama ng kanyang mga ninuno'
  choice: Panatilihin ang pormulang patalinghaga at ipaliwanag sa talababa bilang nakaugaliang pananalita tungkol sa kamatayan at pagkakalibing sa piling ng mga ninuno.
  alternative: Isalin lamang bilang 'namatay' o unawain bilang tiyak na pahayag tungkol sa kalagayan ng kaluluwa pagkamatay.
  rationale: Ginagamit ng talata ang pormula at ang tahasang pandiwang 'namatay.' Ang pagsasalin ay hindi dapat burahin ang pag-uulit o dagdagan ito ng doktrinang hindi tahasang sinasabi rito.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang 'nahimlay' upang mapanatili ang idyomatikong larawan ng Hebrew, habang ang 'mga ninuno' ay mas natural sa ordinaryong modernong mambabasa kaysa sa literal na 'mga ama.'
