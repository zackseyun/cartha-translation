source:
  edition: WLC
  text: בִּ/שְׁנַ֨ת שְׁלֹשִׁ֤ים וָ/שֵׁשׁ֙ לְ/מַלְכ֣וּת אָסָ֔א עָלָ֞ה בַּעְשָׁ֤א מֶֽלֶךְ יִשְׂרָאֵל֙ עַל יְהוּדָ֔ה וַ/יִּ֖בֶן אֶת הָ/רָמָ֑ה לְ/בִלְתִּ֗י תֵּ֚ת יוֹצֵ֣א וָ/בָ֔א לְ/אָסָ֖א מֶ֥לֶךְ יְהוּדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/016/001.yaml
  text: In the thirty-sixth year of Asa’s reign[a], Baasha king of Israel went up against Judah and built up Ramah, so as not to allow anyone to go out or come in to Asa king of Judah.
translation:
  language: tl
  text: Sa ikatatlumpu’t anim na taon ng paghahari ni Asa[a], sumalakay sa Juda si Baasa, na hari ng Israel, at itinayo niya ang Rama upang walang makalabas o makapasok mula at papunta kay Asa, na hari ng Juda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “sa ikatatlumpu’t anim na taon ng paghahari ni Asa.” Nagdudulot ito ng tensiyong kronolohikal sa tala ng 1 Mga Hari tungkol sa panahon ni Baasa. Ayon sa ilan, ang pagbilang ay nagsimula sa pagkakahati ng kaharian; iminungkahi naman ng iba ang pagwawasto sa teksto upang maging “ikadalawampu’t anim na taon.”
    reason: alternative_reading
lexical_decisions:
- source_word: בִּ/שְׁנַת שְׁלֹשִׁים וָ/שֵׁשׁ
  choice: Nang ikatatlumpu't anim na taon
  rationale: Likas na modernong Tagalog para sa Hebreong pariralang panahunan na literal na tumutukoy sa ‘taon na tatlumpu at anim.’
- source_word: לְ/מַלְכוּת אָסָא
  choice: ng paghahari ni Asa
  rationale: Ang מַלְכוּת ay tumutukoy sa paghahari o pamamahala bilang hari; malinaw at natural ang ‘paghahari ni Asa.’
- source_word: עָלָה ... עַל יְהוּדָה
  choice: sumalakay sa Juda
  rationale: Sa kontekstong militar, ang עָלָה עַל ay paglusob o pagsalakay laban sa isang lupain; ipinahahayag ito nang natural sa Tagalog nang hindi dinaragdagan ang detalye.
- source_word: וַ/יִּבֶן אֶת הָ/רָמָה
  choice: at itinayo niya ang Rama
  rationale: Ang בנה ay pangunahing nangangahulugang ‘magtayo’ o ‘magtayo muli.’ Hindi tahasang sinasabi ng pandiwa na ‘pinatibay,’ kaya pinanatili ang payak na kahulugan.
- source_word: הָ/רָמָה
  choice: Rama
  rationale: Pangalan ng lugar na isina-Tagalog ang baybay ayon sa karaniwang anyo ng mga pangalang biblikal.
- source_word: לְ/בִלְתִּי תֵּת
  choice: upang walang
  rationale: Ipinahahayag ng לבלתי kasunod ng pawatas ang layuning humadlang; maikli at likas sa Tagalog ang konstruksiyong ito.
- source_word: יוֹצֵא וָ/בָא
  choice: makalabas o makapasok
  rationale: Pinananatili ang magkatambal na kilos sa Hebreo, na tumutukoy sa malayang paglabas at pagpasok.
- source_word: לְ/אָסָא מֶלֶךְ יְהוּדָה
  choice: patungo kay Asa na hari ng Juda
  rationale: Ang ל ay nagpapahiwatig ng direksiyon o kaugnayan kay Asa. Pinananatili ng ‘patungo kay’ ang anyo ng teksto habang hindi ipinapasok sa pangunahing salin ang mas malawak na interpretasyong ‘papunta at pabalik.’
theological_decisions:
- issue: Tensiyong kronolohikal sa panahon ng paghahari ni Baasa ayon sa 1 Mga Hari
  choice: Pinanatili sa pangunahing teksto ang Masoretikong pagbasa na ‘ikatatlumpu't anim na taon ng paghahari ni Asa.’
  alternative: Bilang mula sa pagkakahati ng kaharian; o ang mungkahing pagwawasto na ‘ikadalawampu't anim na taon ng paghahari ni Asa.’
  rationale: Malinaw na ‘tatlumpu't anim’ at ‘paghahari ni Asa’ ang nasa Hebreong teksto. Hindi dapat tahimik na ituwid o pagtugmain ang tunay na suliraning kronolohikal; inilalahad sa talababa ang mga pangunahing paliwanag.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang ‘sumalakay’ para sa likas na pagpapahayag ng kontekstong militar, ngunit hindi ginawang ‘pinatibay’ ang Rama dahil hindi iyon tahasang hinihingi ng pandiwang Hebreo. Pinanatili ang kronolohikal na tensiyon at ang panandang [a] sa pangunahing teksto.
