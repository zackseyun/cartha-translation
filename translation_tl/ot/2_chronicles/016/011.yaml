base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/016/011.yaml
  text: Behold[a], the acts of Asa, the first and the last, behold, they are written in the Book of the Kings of Judah and Israel.
translation:
  language: tl
  text: Narito, ang mga ginawa ni Asa, mula sa una hanggang sa huli[a]—narito, nakasulat ang mga iyon sa Aklat ng mga Hari ng Juda at Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa mas literal: “ang mga salita o usapin ni Asa, ang mga una at ang mga huli.” Sa pormulang ito ng pagsasalaysay ng kasaysayan, ang “mga ginawa” at “mula sa una hanggang sa huli” ang likas na diwa ng Hebreo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Narito
  rationale: Pinananatili ang panawag-pansing lakas ng Hebreo nang hindi nagdaragdag ng tahasang salitang pamanahon gaya ng “ngayon.”
- source_word: דִּבְרֵי
  choice: ang mga ginawa ni
  rationale: Sa pormulang pangkasaysayan tungkol sa isang hari, tumutukoy ang דִּבְרֵי sa mga gawa, pangyayari, o usaping may kinalaman sa kaniya, hindi lamang sa kaniyang mga sinabi.
- source_word: הָרִאשׁוֹנִים וְהָאַחֲרוֹנִים
  choice: mula sa una hanggang sa huli
  rationale: Natural na ipinahahayag sa Filipino ang buong saklaw ng mga ginawa ni Asa habang pinananatili ang larawan ng “una” at “huli” sa Hebreo.
- source_word: הִנָּם כְּתוּבִים
  choice: narito, nakasulat ang mga iyon
  rationale: Pinananatili ang ikalawang deiktikong diin ng הִנָּם at ang tahasang pahayag na nakasulat ang mga bagay na tinutukoy.
- source_word: עַל סֵפֶר
  choice: sa Aklat
  rationale: Bagaman maaaring literal na “sa ibabaw ng balumbon,” ang “sa Aklat” ang natural na Filipino para sa pagtukoy sa nilalaman ng isang nakasulat na sanggunian.
- source_word: הַמְּלָכִים
  choice: ng mga Hari
  rationale: Malinaw at malapit ito sa tahasang Hebreong “mga hari,” nang hindi dinaragdagan ng interpretibong “mga talaan.”
- source_word: לִיהוּדָה וְיִשְׂרָאֵל
  choice: ng Juda at Israel
  rationale: Sa pamagat ng kasulatan, natural na ipinahahayag ng “ng” ang kaugnayan nito sa mga hari ng dalawang kaharian.
