  terminology: Wasto at pare-pareho ang “Aklat ng mga Hari ng Juda at Israel,” “Juda,” at “Israel.” Walang problemang teolohikal o pangalang pantangi. Ang talababa ay kapaki-pakinabang at malinaw na inilalahad ang mas literal na posibilidad nang hindi ito ipinipilit bilang pangunahing salin.
