base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/016/006.yaml
  text: Then King Asa took all Judah[a], and they carried away the stones of Ramah and its timber, with which Baasha had built[b], and he built with them Geba and Mizpah.
translation:
  language: tl
  text: Pagkatapos, tinipon ni Haring Asa ang buong Juda[a]. Hinakot nila ang mga bato at mga kahoy ng Rama na ginamit ni Baasa sa pagtatayo nito.[b] Ginamit ni Asa ang mga iyon sa pagtatayo ng Geba at Mizpa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ipinatawag” o “pinakilos ang buong Juda”; literal na “kinuha ang buong Juda.”
    reason: lexical_alternative
  - marker: b
    text: Ibig sabihin, ang mga bato at kahoy na ginamit ni Baasa sa pagtatayo ng Rama.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָקַח אֶת כָּל יְהוּדָה
  choice: tinipon ... ang buong Juda
  rationale: Literal itong “kinuha ang buong Juda,” ngunit sa konteksto ang parirala ay tumutukoy sa pagtitipon o pagpapakilos sa mga taga-Juda para sa gawain. Natural at malinaw sa modernong Tagalog ang “tinipon,” habang itinatala sa talababa ang literal na anyo.
- source_word: וַיִּשְׂאוּ
  choice: hinakot nila
  rationale: Ang pandiwang נשׂא ay tumutukoy rito sa pagbuhat at paglilipat ng maraming materyales. Ang “hinakot” ay likas na salitang Tagalog para sa ganitong pag-aalis at pagdadala.
- source_word: אַבְנֵי הָרָמָה
  choice: mga bato ... ng Rama
  rationale: Pinananatili nito ang ugnayang construct ng Hebreo sa Rama bilang pinagmulan o pag-aari ng mga materyales, nang hindi labis na nagpapaliwanag sa pangunahing teksto.
- source_word: עֵצֶיהָ
  choice: mga kahoy ng Rama
  rationale: Ang hulapi ay tumutukoy pabalik sa Rama. Ang “mga kahoy” ay malinaw at karaniwang tawag sa materyales na kahoy na ginamit sa pagtatayo.
- source_word: אֲשֶׁר בָּנָה בַּעְשָׁא
  choice: na ginamit ni Baasa sa pagtatayo nito
  rationale: Ipinakikita nitong ang mga bato at kahoy ang mga materyales na ginamit ni Baasa sa pagtatayo ng Rama. Ang “nito” ay nagbibigay ng ipinahihiwatig na layon nang hindi idinaragdag sa teksto ang ideya ng pagpapatibay.
- source_word: וַיִּבֶן בָּהֶם
  choice: Ginamit ni Asa ang mga iyon sa pagtatayo
  rationale: Malinaw na si Asa ang paksa ng pandiwang isahan at ang mga materyales ang tinutukoy ng panghalip na maramihan. Ito ay natural na katumbas ng “nagtayo siya sa pamamagitan ng mga iyon.”
- source_word: גֶּבַע
  choice: Geba
  rationale: Karaniwang transliterasyon ng pangalan ng lugar.
- source_word: הַמִּצְפָּה
  choice: Mizpa
  rationale: Karaniwang anyong Filipino ng pangalan ng lugar; hindi isinasalin ang pantukoy na Hebreo na karaniwang hindi kasama sa pangalan sa Tagalog.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “tinipon” at “hinakot” bilang natural na mga pandiwa sa konteksto ng pagpapakilos sa mga tao at paglilipat ng mga materyales. Hindi idinagdag ang “pinatibay,” sapagkat bagaman maaaring ipinahihiwatig ng konteksto, “itinayo” lamang ang tahasang sinasabi ng Hebreo.
