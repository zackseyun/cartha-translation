  text: וַ/יִּקְבְּרֻ֣/הוּ בְ/קִבְרֹתָ֗י/ו אֲשֶׁ֣ר כָּֽרָה ל/וֹ֮ בְּ/עִ֣יר דָּוִיד֒ וַ/יַּשְׁכִּיבֻ֗/הוּ בַּ/מִּשְׁכָּב֙ אֲשֶׁ֤ר מִלֵּא֙ בְּשָׂמִ֣ים וּ/זְנִ֔ים מְרֻקָּחִ֖ים בְּ/מִרְקַ֣חַת מַעֲשֶׂ֑ה וַ/יִּשְׂרְפוּ ל֥/וֹ שְׂרֵפָ֖ה גְּדוֹלָ֥ה עַד לִ/מְאֹֽד־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/016/014.yaml
  text: They buried him in his tomb[a], which he had cut out for himself in the City of David, and laid him on the bier that had been filled with spices and various blended ointments prepared by a perfumer’s craft[b]; and they made a very great burning for him.
translation:
  language: tl
  text: Inilibing nila siya sa sarili niyang libingan[a] na hinukay niya para sa sarili sa Lungsod ni David. Inihimlay nila siya sa higaang[b] pinuno niya ng mababangong sangkap at sari-saring timplang pabango, na inihanda ayon sa kasanayan ng tagagawa ng pabango. Nagsagawa sila ng napakalaking pagsusunog para sa kanya.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal na “sa kanyang mga libingan”; maaaring tumukoy ang anyong maramihan sa isang libingang kompleks o maharlikang himlayan.
    reason: lexical_alternative
  - marker: b
    text: Ang salitang Hebreo ay maaari ring isaling “himlayan” o “sopa”; sa kontekstong ito, maaaring tumukoy sa higaang ginagamit sa paglilibing.
    reason: lexical_alternative
  - marker: c
    text: Hindi sinasabi ng Hebreo kung ano ang sinunog. Malamang na isa itong seremonyal na pagsusunog ng mga pabango o mababangong sangkap bilang parangal sa yumao, hindi kinakailangang kremasyon ng kanyang bangkay.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּקְבְּרֻהוּ
  choice: Inilibing nila siya
  rationale: Tuwirang salaysay na naglalarawan sa paglilibing kay Asa; natural ang ayos na ito sa modernong Tagalog.
- source_word: בְקִבְרֹתָיו
  choice: sa sarili niyang libingan
  rationale: Bagaman anyong maramihan ang Hebreo, maaaring tumukoy ito sa isang libingang kompleks o maharlikang himlayan. Ginamit ang natural na isahan sa pangunahing teksto at pinanatili sa talababa ang literal na anyo.
- source_word: אֲשֶׁר כָּרָה לוֹ
  choice: na hinukay niya para sa sarili
  rationale: Pinananatili ang karaniwang kahulugan ng כּרה na ‘humukay’ o ‘maghukay’ at ang reflexive-benefactive na לוֹ.
- source_word: בְּעִיר דָּוִיד
  choice: sa Lungsod ni David
  rationale: Karaniwan at malinaw na salin ng pangalan ng lugar.
- source_word: וַיַּשְׁכִּיבֻהוּ
  choice: Inihimlay nila siya
  rationale: Ang ‘inihimlay’ ay natural at marangal na pananalita sa konteksto ng paglilibing at nagpapahayag ng pagpapahiga sa bangkay.
- source_word: בַּמִּשְׁכָּב
  choice: sa higaan
  rationale: Ang מִשְׁכָּב ay literal na lugar na hinihigaan; hindi tiyak kung karaniwang higaan, sopa, o himlayang ginagamit sa libing, kaya ‘higaan’ ang piniling hindi labis na nagpapakahulugan.
- source_word: אֲשֶׁר מִלֵּא
  choice: pinuno
  rationale: Hindi hayag at hindi tiyak ang simuno ng pandiwang Hebreo; ang pasibong Tagalog ay natural at hindi nagdaragdag ng tiyak na tagagawa.
- source_word: בְּשָׂמִים
  choice: mababangong sangkap
  rationale: Saklaw nito ang mga espesya, balsamo, at iba pang aromatikong sangkap nang hindi nililimitahan sa pampalasa.
- source_word: וּזְנִים
  choice: at sari-saring pabango
  rationale: Bihira at hindi ganap na tiyak ang salita; malamang na tumutukoy sa iba’t ibang uri ng aromatikong timpla, ayon sa parallel na konteksto.
- source_word: מְרֻקָּחִים בְּמִרְקַחַת מַעֲשֶׂה
  choice: tinimpla ayon sa kasanayan ng tagagawa ng pabango
  rationale: Ipinahahayag ang masining at dalubhasang paghahalo o paggawa ng mga pabango nang natural sa Tagalog.
- source_word: וַיִּשְׂרְפוּ לוֹ שְׂרֵפָה גְּדוֹלָה עַד לִמְאֹד
  choice: nagsagawa sila ng napakalaking pagsusunog bilang parangal sa kanya
  rationale: Pinananatili ang tahasang ‘pagsusunog’ ng Hebreo ngunit ipinapakita ng לוֹ na ginawa iyon para sa kanya; iniiwasang sabihing sinunog ang kanyang bangkay.
theological_decisions:
- issue: Kahulugan ng pagsusunog sa libing
  choice: Isang napakalaking seremonyal na pagsusunog bilang parangal kay Asa, nang hindi tinutukoy kung ano ang sinunog.
  alternative: Kremasyon ng bangkay ni Asa; o tiyak na pagsusunog lamang ng mga pabango at aromatikong sangkap.
  rationale: Nauna nang sinasabi ng talata na inilibing at inihimlay si Asa. Ang idyomang Hebreo ay nagsasabing nagsagawa sila ng ‘pagsusunog para sa kanya,’ ngunit hindi tahasang tinutukoy ang bagay na sinunog. Kaya hindi dapat gawing tiyak sa pangunahing teksto ang kremasyon o ang pagsusunog lamang ng mga pabango.
translation_notes:
  register: Makabago ngunit marangal na Filipino ang ginamit. Pinili ang ‘inihimlay’ para sa angkop na himig ng paglilibing, samantalang nanatiling payak at madaling maunawaan ang ibang pangungusap. Ang mga hindi tiyak na detalye ng Hebreo—ang maramihang ‘mga libingan,’ ang uri ng higaan, at ang bagay na sinunog—ay hindi tahasang niresolba at ipinaliwanag sa mga talababa.
