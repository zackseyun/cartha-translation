revisions:
- from: Inilibing nila siya sa sarili niyang libingan[a] na hinukay niya para sa sarili sa Lungsod ni David. Inihimlay nila siya sa higaang[b] pinuno ng mababangong sangkap at sari-saring pabangong tinimpla ayon sa kasanayan ng tagagawa ng pabango. At nagsagawa sila ng napakalaking pagsusunog bilang parangal sa kanya.[c]
  to: Inilibing nila siya sa sarili niyang libingan[a] na hinukay niya para sa sarili sa Lungsod ni David. Inihimlay nila siya sa higaang[b] pinuno niya ng mababangong sangkap at sari-saring timplang pabango, na inihanda ayon sa kasanayan ng tagagawa ng pabango. Nagsagawa sila ng napakalaking pagsusunog para sa kanya.[c]
  rationale: Inayos ang sirang konstruksyon sa ikalawang pangungusap at isinalin nang malinaw ang aktibong “na pinuno niya.” Inalis ang interpretatibong “bilang parangal” mula sa pangunahing teksto upang mapanatili ang pag-iingat ng Hebreo, habang pinanatili ang paliwanag sa talababa. Hindi binago ang kahulugan ng talata o ang mga anchor ng talababa.
