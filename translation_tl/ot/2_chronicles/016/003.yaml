base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/016/003.yaml
  text: There is a treaty between me and you[a], and between my father and your father. Look, I have sent you silver and gold. Go, break your treaty with Baasha king of Israel[b], so that he may withdraw from me.
translation:
  language: tl
  text: “May kasunduan sa pagitan nating dalawa at sa pagitan ng aking ama at ng iyong ama. Narito, pinadalhan kita ng pilak at ginto. Pumunta ka at sirain mo ang kasunduan mo kay Baasa, na hari ng Israel, upang umurong siya mula sa akin.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Sa literal, “at umakyat siya mula sa ibabaw ko.” Sa konteksto, malamang na nangangahulugan itong umurong si Baasa at itigil ang kaniyang panggigipit o pagkilos militar laban kay Asa.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּרִית
  choice: kasunduan
  rationale: Sa konteksto ng ugnayang diplomatiko ng mga hari, malinaw at natural na ipinahihiwatig ng “kasunduan” ang isang pampolitikang tratado o alyansa, habang pinananatili ang iisang salin sa dalawang paglitaw ng salitang Hebreo.
- source_word: בֵּינִי וּבֵינֶךָ וּבֵין אָבִי וּבֵין אָבִיךָ
  choice: sa pagitan natin, gaya ng mayroon sa pagitan ng aking ama at ng iyong ama
  rationale: Pinananatili ang dalawang magkatapat na ugnayan sa pormulang diplomatiko; ginagamit ang “gaya ng mayroon” upang maging natural sa Filipino nang hindi binabago ang diwa.
- source_word: הִנֵּה
  choice: Narito
  rationale: Dignified at kasalukuyang panawag-pansin na akma sa mensaheng diplomatiko.
- source_word: שָׁלַחְתִּי לְךָ כֶּסֶף וְזָהָב
  choice: pinadalhan kita ng pilak at ginto
  rationale: Natural na Filipino para sa ganap na kilos na may kasalukuyang kabuluhan sa liham o mensahe.
- source_word: לֵךְ
  choice: Humayo ka
  rationale: Tuwirang pautos na angkop sa marangal na rehistro ng makasaysayang salaysay.
- source_word: הָפֵר
  choice: sirain mo
  rationale: Ipinahihiwatig ng Hiphil ng פרר ang pagpapawalang-bisa o pagsira sa isang kasunduan; malinaw at idiomatiko ang “sirain.”
- source_word: בְּרִיתְךָ אֶת־בַּעְשָׁא
  choice: ang kasunduan mo kay Baasa
  rationale: Natural na ipinapahayag sa Filipino ang kasunduang kinasasangkutan ni Baasa sa pamamagitan ng “kay Baasa.”
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: hari ng Israel
  rationale: Tuwirang salin ng karaniwang titulong maharlika.
- source_word: וְיַעֲלֶה מֵעָלַי
  choice: upang umurong siya mula sa akin
  rationale: Ipinakikita ng konteksto na ang idyoma ay tumutukoy sa pag-atras ni Baasa at pagtigil ng kaniyang presyong militar laban kay Asa.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na malinaw at marangal, na may bahagyang pormal na himig para sa mensaheng diplomatiko. Ginamit ang “kasunduan” sa halip na mas teknikal na “tratado” o mas teolohikal ang dating na “tipan.”
