revisions:
- from: Nagalit si Asa sa tagakita at ipinasok niya ito sa bilangguan[a], sapagkat galit na galit siya rito dahil dito. Nang panahong iyon, malupit ding inapi ni Asa ang ilan sa bayan.[b]
  to: Nagalit si Asa sa tagakita at ipinasok niya ito sa bilangguan[a], sapagkat galit na galit siya sa tagakita dahil sa bagay na ito. At nang panahong iyon, malupit na inapi ni Asa ang ilan sa mga tao[b].
  rationale: Inalis ang dagdag na diwang ‘also’ ng “ding,” nilinaw ang mga panghalip sa sugnay ng sanhi, at inilapit ang talababa b sa salitang “inapi.” Pinalawak nang kaunti ang paliwanag sa “pangawan” upang maging nauunawaan sa modernong Filipino, habang pinananatili ang leksikal na kawalang-katiyakan ng Hebreo.
