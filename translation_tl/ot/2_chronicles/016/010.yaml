    rationale: Walang tahasang ‘also’ sa וַיְרַצֵּץ; ang waw ay sapat na maisalin bilang “At.”
  - severity: low
    issue: Malabo at paulit-ulit ang “rito dahil dito.”
    rationale: Mas malinaw na ulitin ang “sa tagakita” at gamitin ang “bagay na ito,” nang hindi binabago ang sanggunian ng mga panghalip.
  - severity: low
    issue: Hindi nakadikit ang talababa b sa “inapi,” ang salitang leksikal na ipinapaliwanag nito.
    rationale: Mas malinaw na footnote anchoring ang paglalagay ng marker kaagad pagkatapos ng saling para sa וַיְרַצֵּץ.
  - severity: low
