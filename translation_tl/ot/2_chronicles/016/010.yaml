base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/016/010.yaml
  text: Then Asa was angry with the seer and put him in the prison house[a], because he was in a rage with him over this[b]. And Asa brutally oppressed some of the people at that time.
translation:
  language: tl
  text: Nagalit si Asa sa tagakita at ipinasok niya ito sa bilangguan[a], sapagkat galit na galit siya sa tagakita dahil sa bagay na ito. At nang panahong iyon, malupit na inapi ni Asa ang ilan sa mga tao[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa bahay ng mga pangawan”; ang pangawan ay kasangkapang pampigil, gaya ng stocks. Malamang na tumutukoy ang ekspresyong Hebreo sa isang lugar ng pagkakulong na may ganitong uri ng pagpigil.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isaling “dinurog” o “pinagmalupitan.” Marahas ang literal na diwa ng pandiwang Hebreo at nagpapahiwatig ng matinding pang-aabuso.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכְעַס
  choice: Nagalit
  rationale: Likas na salaysay sa Filipino para sa galit o pagkayamot na ipinahahayag ng כעס, nang hindi pinalalabis ang tindi.
- source_word: הָרֹאֶה
  choice: tagakita
  rationale: Pinananatili ang natatanging katawagang רֹאֶה sa halip na gawing mas malawak na 'propeta.'
- source_word: וַיִּתְּנֵהוּ
  choice: ipinasok niya ito
  rationale: Sa konteksto ng pagkakabilanggo, malinaw at natural itong katumbas ng paglalagay sa isang tao sa isang lugar ng pagkakulong.
- source_word: בֵּית הַמַּהְפֶּכֶת
  choice: bilangguan
  rationale: Ipinahahayag ang malinaw na tungkulin ng lugar sa konteksto; ang mas tiyak ngunit di-ganap na tiyak na kahulugang may kaugnayan sa pangawan ay inilagay sa talababa.
- source_word: בְזַעַף עִמּוֹ
  choice: galit na galit siya rito
  rationale: Inihahatid ang matinding poot ng זַעַף sa natural at marangal na modernong Filipino.
- source_word: עַל זֹאת
  choice: dahil dito
  rationale: Maikli at natural na tumutukoy sa sinabi o ginawa ng tagakita bilang sanhi ng galit ni Asa.
- source_word: וַיְרַצֵּץ
  choice: malupit ding inapi
  rationale: Ang Piel ng רצץ ay marahas—literal na durugin o wasakin—at sa kontekstong pantao ay nagpapahiwatig ng matinding pagmamalupit; pinananatili ng 'malupit na inapi' ang puwersang iyon.
- source_word: מִן הָעָם
  choice: ang ilan sa bayan
  rationale: 'Ipinakikita ang partitive na gamit ng מִן: hindi ang buong bayan kundi ilang kabilang dito.'
- source_word: בָּעֵת הַהִיא
  choice: Nang panahong iyon
  rationale: Karaniwan at malinaw na ekspresyong temporal sa Filipino.
