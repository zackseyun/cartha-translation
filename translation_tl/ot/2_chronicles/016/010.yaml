  register: Modernong Filipino na malinaw ngunit marangal. Ginamit ang 'tagakita' upang mapanatili ang terminong propetiko ng Hebreo. Iniwasan ang labis na kolokyal na pananalita, at ang dalawang leksikal na di-katiyakan ay pinanatili sa mga talababa.
