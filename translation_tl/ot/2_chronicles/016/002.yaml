  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יֹּצֵ֨א אָסָ֜א כֶּ֣סֶף וְ/זָהָ֗ב מֵ/אֹֽצְר֛וֹת בֵּ֥ית יְהוָ֖ה וּ/בֵ֣ית הַ/מֶּ֑לֶךְ וַ/יִּשְׁלַ֗ח אֶל בֶּן הֲדַד֙ מֶ֣לֶךְ אֲרָ֔ם הַ/יּוֹשֵׁ֥ב בְּ/דַרְמֶ֖שֶׂק לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/016/002.yaml
  text: Then Asa brought out silver and gold from the treasuries of the house of Yahweh and of the king’s house[a], and sent them to Ben-hadad king of Aram, who lived in Damascus, saying,
translation:
  language: tl
  text: 'Pagkatapos, inilabas ni Asa ang pilak at ginto mula sa mga kabang-yaman ng bahay ni Yahweh at ng bahay ng hari, at ipinadala niya ang mga ito kay Ben-hadad, hari ng Aram[a], na naninirahan sa Damasco, na may ganitong mensahe:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: “hari ng Aram”; tradisyonal na salin: “hari ng Siria.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּצֵא
  choice: inilabas
  rationale: Tuwirang ipinahahayag ng Hifil ng יצא ang pagpapalabas ng mga bagay mula sa imbakan; natural at konkreto sa Filipino ang “inilabas.”
- source_word: כֶּסֶף וְזָהָב
  choice: pilak at ginto
  rationale: Pinananatili ang dalawang tiyak na mahahalagang metal sa Hebreo sa halip na gawing pangkalahatang “kayamanan” o “salapi.”
- source_word: מֵאֹצְרוֹת
  choice: mula sa mga kabang-yaman
  rationale: Pinananatili ang tahasang maramihang anyo at ang diwa ng mga imbakan ng mahahalagang ari-arian.
- source_word: בֵּית יְהוָה
  choice: bahay ni Yahweh
  rationale: Pinananatili ang literal na “bahay” at ang pangalang tipan na Yahweh ayon sa mismong Tetragrammaton.
- source_word: וּבֵית הַמֶּלֶךְ
  choice: at ng bahay ng hari
  rationale: Pinananatili ang pag-uulit ng “bahay” at ang pagkakatulad ng estruktura sa “bahay ni Yahweh,” sa halip na agad ipakahulugang palasyo.
- source_word: וַיִּשְׁלַח
  choice: Ipinadala niya ang mga iyon
  rationale: Natural sa Filipino na ihayag ang ipinahihiwatig na layon, ang pilak at ginto, bagaman hindi ito inuulit sa Hebreo.
- source_word: אֶל בֶּן הֲדַד
  choice: kay Ben-hadad
  rationale: Isinasalin sa karaniwang transliterasyon ang pangalang pantangi.
- source_word: מֶלֶךְ אֲרָם
  choice: hari ng Aram
  rationale: Pinananatili ang orihinal na pangalang heograpiko at etniko na Aram sa halip na ang tradisyonal na “Siria.”
- source_word: הַיּוֹשֵׁב בְּדַרְמֶשֶׂק
  choice: na naninirahan sa Damasco
  rationale: Ipinahahayag ng participle ang patuloy na paninirahan; malinaw at dignificado sa modernong Filipino ang “naninirahan.”
- source_word: לֵאמֹר
  choice: at ipinasabi,
  rationale: Natural na panimulang pormula sa Filipino para sa tuwirang mensaheng susunod, habang pinananatili ang ugnayan sa pandiwang “ipinadala.”
theological_decisions:
- issue: Paglalarawan sa banal na pangalan na יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Ang teksto ay tuwirang gumagamit ng Tetragrammaton; pinananatili ng “Yahweh” ang natatanging pangalan ng Diyos nang hindi ito pinapalitan ng isang titulo.
- issue: Paglalarawan sa אֲרָם
  choice: Aram
  alternative: Siria
  rationale: Ang “Aram” ang mismong pangalan sa Hebreo. Ang “Siria” ay tradisyonal na katumbas ngunit maaaring magpasok ng mas huling heograpikong katawagan.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Pinanatili ang pagkakatulad ng “bahay ni Yahweh” at “bahay ng hari,” samantalang ginawang natural ang daloy sa pamamagitan ng paghahati sa dalawang pangungusap at paggamit ng “ipinasabi” bago ang mensaheng sumusunod.
