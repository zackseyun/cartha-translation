  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וּ/בָ/עֵ֣ת הַ/הִ֗יא בָּ֚א חֲנָ֣נִי הָ/רֹאֶ֔ה אֶל אָסָ֖א מֶ֣לֶךְ יְהוּדָ֑ה וַ/יֹּ֣אמֶר אֵלָ֗י/ו בְּ/הִשָּׁ֨עֶנְ/ךָ֜ עַל מֶ֤לֶךְ אֲרָם֙ וְ/לֹ֤א נִשְׁעַ֨נְתָּ֙ עַל יְהוָ֣ה אֱלֹהֶ֔י/ךָ עַל כֵּ֗ן נִמְלַ֛ט חֵ֥יל מֶֽלֶךְ אֲרָ֖ם מִ/יָּדֶֽ/ךָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/016/007.yaml
  text: At that time Hanani the seer came to Asa king of Judah and said to him[a], “Because you relied on the king of Aram and did not rely on Yahweh your God, therefore the army of the king of Aram has escaped from your hand.”
translation:
  language: tl
  text: Nang panahong iyon, pumunta ang tagakitang si Hanani kay Asa na hari ng Juda at sinabi sa kanya, “Dahil umasa ka sa hari ng Aram[a] at hindi umasa kay Yahweh na iyong Diyos, kaya nakaligtas sa kamay mo ang hukbo ng hari ng Aram.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Siria.” “Aram” ang nasa Hebreo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָעֵת הַהִיא
  choice: Nang panahong iyon
  rationale: Likas na panandang temporal sa modernong Tagalog; hindi na hiwalay na isinalin ang panimulang pangatnig.
- source_word: הָרֹאֶה
  choice: ang tagakita
  rationale: Pinananatili ang natatanging titulong propetiko na רֹאֶה sa halip na gawing pangkalahatang “propeta.”
- source_word: בְּהִשָּׁעֶנְךָ ... וְלֹא נִשְׁעַנְתָּ
  choice: Dahil umasa ka ... at hindi [umasa]
  rationale: Ang “umasa” ay malinaw na naghahatid ng pampolitika at teolohikal na pagdepende. Likas sa Tagalog ang pagkakaltas sa ikalawang “umasa,” habang nananatiling malinaw ang paghahambing.
- source_word: מֶלֶךְ אֲרָם
  choice: hari ng Aram
  rationale: Ginamit ang pangalang nasa Hebreo sa halip na ang mas huling katawagang “Siria.”
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: Yahweh na iyong Diyos
  rationale: Tuwirang kinakatawan ang personal na pangalang יהוה at pinananatili ang ugnayang ipinahahayag ng “iyong Diyos.”
- source_word: עַל כֵּן
  choice: nakaligtas [bilang bunga]
  rationale: Ang ugnayang sanhi at bunga ay naipahahayag ng ayos ng pangungusap matapos ang sugnay na “Dahil”; hindi na kailangan ang mabigat na “samakatuwid.”
- source_word: נִמְלַט
  choice: nakaligtas
  rationale: Nagpapahayag ng natapos na pagtakas o pagkaligtas mula sa kapangyarihan ni Asa, na nananatiling mahalaga sa kasalukuyang pagsaway.
- source_word: חֵיל מֶלֶךְ אֲרָם
  choice: ang hukbo ng hari ng Aram
  rationale: Ang חֵיל dito ay tumutukoy sa isang puwersang militar; “hukbo” ang malinaw at marangal na katumbas.
- source_word: מִיָּדֶךָ
  choice: sa kamay mo
  rationale: Pinananatili ang nauunawaang idyoma ng Hebreo para sa kapangyarihan o pagkakahawak nang hindi ito labis na ipinapaliwanag.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Personal na pangalan ang tahasang nasa tekstong Hebreo; ang “Yahweh” ay mas tuwirang kumakatawan rito kaysa sa pamalit na titulo.
- issue: Ang pagsaway sa pag-asa ni Asa
  choice: Pinanatili ang tuwirang pagtutunggali ng pag-asa sa hari ng Aram at pag-asa kay Yahweh
  alternative: Ipaliwanag ito bilang pangkalahatang pagbabawal sa lahat ng alyansang pampolitika
  rationale: Ang talata mismo ay humahatol sa partikular na pag-asa ni Asa ngunit hindi tahasang bumubuo rito ng mas malawak na doktrina tungkol sa bawat alyansa.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “tagakita” bilang tiyak na titulong propetiko, “hukbo” para sa puwersang militar, at ang payak na “umasa” upang mapanatili ang diin sa pagtitiwala nang hindi nagiging arkaiko.
