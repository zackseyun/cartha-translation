  text: הֲ/לֹ֧א הַ/כּוּשִׁ֣ים וְ/הַ/לּוּבִ֗ים הָי֨וּ לְ/חַ֧יִל לָ/רֹ֛ב לְ/רֶ֥כֶב וּ/לְ/פָרָשִׁ֖ים לְ/הַרְבֵּ֣ה מְאֹ֑ד וּ/בְ/הִשָּֽׁעֶנְ/ךָ֥ עַל יְהוָ֖ה נְתָנָ֥/ם בְּ/יָדֶֽ/ךָ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/016/008.yaml
  text: Were not the Cushites and the Lubites a very great army[a], with chariots and horsemen in great abundance? Yet when you relied on Yahweh, he gave them into your hand.
translation:
  language: tl
  text: Hindi ba napakalaking hukbo ang mga Cusita at mga Lubita[a], na may napakaraming karwahe at mangangabayo? Ngunit nang umasa ka kay Yahweh, ibinigay niya sila sa iyong kamay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “mga Etiope at mga Libyan.” Ginamit dito ang “mga Cusita” at “mga Lubita” upang manatiling malapit sa mga pangalang Hebreo ng mga bayang ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: Hindi ba
  rationale: Pinananatili ang retorikal na tanong na umaasang sasang-ayon ang kausap.
- source_word: הַכּוּשִׁים
  choice: mga Cusita
  rationale: Transliterasyon ng etnonimong Hebreo upang maiwasan ang di-tiyak at maaaring anakronistikong pagtukoy sa mga Etiope.
- source_word: וְהַלּוּבִים
  choice: at mga Lubita
  rationale: Pinananatiling malapit sa etnonimong Hebreo; ang 'mga Libyan' ay posibleng heograpikong katumbas ngunit mas tiyak kaysa sa teksto.
- source_word: הָיוּ לְחַיִל לָרֹב
  choice: napakalaking hukbo
  rationale: Sa konteksto, ang חַיִל ay puwersang militar, at ang לָרֹב ay nagbibigay-diin sa laki o dami nito.
- source_word: לְרֶכֶב וּלְפָרָשִׁים לְהַרְבֵּה מְאֹד
  choice: na may napakaraming karwahe at mangangabayo
  rationale: Likas na Filipino na naghahayag ng napakaraming kagamitang pandigma at mga nakasakay sa kabayo.
- source_word: וּבְהִשָּׁעֶנְךָ עַל
  choice: Ngunit nang umasa ka kay
  rationale: Ang pandiwa ay tumutukoy sa pagsandig o pagtitiwala; ipinahahayag ng 'ngunit' ang kontrast sa argumento, samantalang ang 'nang' ay tumutukoy sa kalagayan ng tagumpay.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang banal sa halip na palitan ito ng isang titulo.
- source_word: נְתָנָם בְּיָדֶךָ
  choice: ibinigay niya sila sa iyong kamay
  rationale: Pinananatili ang malinaw na idyomang Hebreo para sa pagbibigay ng tagumpay laban sa kaaway.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Tuwirang ginagamit sa Hebreo ang Tetragrammaton; ang 'Yahweh' ay transliterasyon ng personal na pangalan at hindi kapalit na titulo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang 'karwahe' para sa sasakyang pandigma at 'mangangabayo' para sa mga horseman. Pinanatili ang retorikal na tanong at ang idyomang 'sa iyong kamay' nang hindi nilulutas nang labis ang larawan ng orihinal.
source_grounding:
  english_pob_role: consult_only
