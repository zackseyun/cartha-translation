revisions:
- from: Pagkatapos, tinipon ni Solomon sa Jerusalem ang matatandang pinuno ng Israel at ang lahat ng pinuno ng mga lipi, ang mga pinuno ng mga angkan ng mga anak ni Israel, upang iahon ang kaban ng tipan ni Yahweh mula sa Lunsod ni David, samakatuwid ay mula sa Zion.[a]
  to: Pagkatapos, tinipon ni Solomon sa Jerusalem ang mga nakatatanda ng Israel at ang lahat ng pinuno ng mga lipi, ang mga pinuno ng mga angkan ng mga anak ni Israel, upang iahon ang kaban ng tipan ni Yahweh mula sa Lunsod ni David, na siyang Zion.[a]
  rationale: Inayos ang pangwakas na apposisyon upang tuwirang makilala ang Lunsod ni David bilang Zion, ayon sa הִיא צִיּוֹן, nang hindi nagdaragdag ng ikalawang ‘mula sa.’ Pinalitan ang “matatandang pinuno” ng “mga nakatatanda” upang mapanatili ang pagkakaiba ng mga elder at ng mga pinunong tahasang binanggit sa sumunod na parirala. Napanatili ang lahat ng kahulugan, ang pormal-marangal na rehistro, at ang talababa sa wastong angkla.
