id: 2CH.5.2
reference: 2 Chronicles 5:2
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: אָז֩ יַקְהֵ֨יל שְׁלֹמֹ֜ה אֶת זִקְנֵ֣י יִשְׂרָאֵ֗ל וְ/אֶת כָּל רָאשֵׁ֨י הַ/מַּטּ֜וֹת נְשִׂיאֵ֧י הָ/אָב֛וֹת לִ/בְנֵ֥י יִשְׂרָאֵ֖ל אֶל יְרוּשָׁלִָ֑ם לְֽ/הַעֲל֞וֹת אֶת אֲר֧וֹן בְּרִית יְהוָ֛ה מֵ/עִ֥יר דָּוִ֖יד הִ֥יא צִיּֽוֹן־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/005/002.yaml
  text: Then Solomon assembled the elders of Israel and all the heads of the tribes[a], the leaders of the fathers’ houses of the sons of Israel, at Jerusalem, to bring up the ark of the covenant of Yahweh from the city of David[b], that is Zion.
translation:
  language: tl
  text: Pagkatapos, tinipon ni Solomon sa Jerusalem ang mga nakatatanda ng Israel at ang lahat ng pinuno ng mga lipi, ang mga pinuno ng mga angkan ng mga anak ni Israel, upang iahon ang kaban ng tipan ni Yahweh mula sa Lunsod ni David, na siyang Zion.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “ang Zion.” Tinutukoy ng parirala ang Lunsod ni David.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: Pagkatapos
  rationale: Likas na panandang temporal sa salaysay at malinaw na nag-uugnay sa kasunod na pangyayari.
- source_word: יַקְהֵיל
  choice: tinipon
  rationale: Ang Hiphil ng קהל ay nangangahulugang magtipon o magpulong ng mga tao; ang “tinipon” ay tuwiran at natural sa Filipino.
- source_word: זִקְנֵי יִשְׂרָאֵל
  choice: matatandang pinuno ng Israel
  rationale: Ipinahihiwatig ng זקנים ang kinikilalang lupon ng nakatatandang mga pinuno, hindi lamang matatanda sa edad.
- source_word: כָּל רָאשֵׁי הַמַּטּוֹת
  choice: ang lahat ng pinuno ng mga lipi
  rationale: Sa kontekstong administratibo, ang מַטּוֹת ay tumutukoy sa mga lipi; malinaw at likas ang “mga pinuno” sa Filipino.
- source_word: נְשִׂיאֵי הָאָבוֹת
  choice: ang mga pinuno ng mga angkan
  rationale: Ang parirala ay tumutukoy sa mga pinuno ng mga sambahayan o angkang mula sa mga ninuno. Iniiwasan ng “angkan” ang di-likas na literalismong “mga sambahayan ng mga ama” habang pinananatili ang istrukturang genealogical.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: ng mga anak ni Israel
  rationale: Pinananatili nito ang tahasang genealogical at tipanang pananalita ng Hebreo sa halip na gawing simpleng “mga Israelita.”
- source_word: אֶל יְרוּשָׁלָם
  choice: sa Jerusalem
  rationale: Maaaring ipahayag ng אֶל ang destinasyon ng pagtitipon; ang “tinipon ... sa Jerusalem” ay natural sa Filipino at malinaw ang lugar.
- source_word: לְהַעֲלוֹת
  choice: upang iahon
  rationale: Pinananatili ang direksiyong paitaas ng עלה at ang layunin ng pagtitipon.
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: ang kaban ng tipan ni Yahweh
  rationale: Malinaw na ipinapakita ang ugnayan ng kaban, tipan, at banal na pangalan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ang Tetragrammaton bilang personal na pangalan ng Diyos.
- source_word: מֵעִיר דָּוִיד
  choice: mula sa Lunsod ni David
  rationale: Tuwirang locative na salin; ginawang pantangi ang “Lunsod ni David” bilang kilalang pangalan ng lugar.
- source_word: הִיא צִיּוֹן
  choice: samakatuwid ay mula sa Zion
  rationale: Ang panghalip na pambabae ay bumabalik sa “lunsod,” hindi kay David. Ang pag-uulit ng “mula sa” sa Filipino ay nag-aalis ng maling pagbasa na si David ang tinutukoy, habang nananatiling appositional ang pagkakakilanlan.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehova
  rationale: Personal na pangalan ang nasa tekstong Hebreo; pinananatili ng “Yahweh” ang pagkakaiba nito sa titulong “Panginoon” nang hindi nagdaragdag ng paliwanag na teolohikal.
- issue: Pagpapanatili sa genealogical na pahayag na לִבְנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  alternative: mga Israelita
  rationale: Mahalaga sa konteksto ang pormal na kaayusang panlipi at pang-angkan, kaya pinanatili ang literal na larawang genealogical.
- issue: Saklaw ng הִיא צִיּוֹן
  choice: Tinutukoy nito ang Lunsod ni David bilang Zion
  alternative: Mas literal na “na siyang Zion”
  rationale: Magkapareho ang diwa, ngunit nililinaw ng napiling ayos sa Filipino ang wastong tinutukoy ng pambabaeng panghalip nang hindi lumalampas sa Hebreo.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “matatandang pinuno” upang malinaw na katungkulan ang tinutukoy ng “elders,” at “angkan” upang likas na maipahayag ang ancestral household. Ang lahat ng marker ng talababa ay nasa pangunahing teksto.
