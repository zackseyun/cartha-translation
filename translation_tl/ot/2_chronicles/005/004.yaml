  text: And all the elders of Israel came[a], and the Levites carried the ark.
translation:
  language: tl
  text: Dumating ang lahat ng matatanda ng Israel, at pinasan ng mga Levita ang kaban.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ibig sabihin, ang kaban ng tipan, gaya ng nililinaw ng nakapaligid na konteksto.
    reason: cross_reference
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: Dumating
  rationale: Ang wayyiqtol ng בוא ay nagsasalaysay ng kasunod na pangyayari; natural at malinaw sa makabagong Filipino ang “dumating.”
- source_word: כֹּל
  choice: lahat
  rationale: Pinananatili nito ang kabuuang saklaw ng pagtukoy sa mga pinuno ng Israel.
- source_word: זִקְנֵי יִשְׂרָאֵל
  choice: mga matatandang pinuno ng Israel
  rationale: Hindi lamang edad ang tinutukoy ng זִקְנֵי kundi ang kinikilalang mga pinunong kumakatawan sa Israel; malinaw itong ipinahahayag ng “matatandang pinuno.”
- source_word: וַיִּשְׂאוּ
  choice: binuhat
  rationale: Sa kontekstong ito, ang נשׂא ay tumutukoy sa pagbuhat at pagdadala sa kaban. Ang “binuhat” ay tuwiran at angkop sa pisikal na kilos.
- source_word: הַלְוִיִּם
  choice: mga Levita
  rationale: Ito ang karaniwan at tumpak na katawagan sa Filipino para sa pangkat na לְוִיִּם.
- source_word: אֶת הָאָרוֹן
  choice: ang kaban
  rationale: “Kaban” ang nakaugaliang salin sa banal na sisidlang ito. Pinananatili sa pangunahing teksto ang payak na anyo ng Hebreo na “ang kaban,” nang hindi idinaragdag ang “ng tipan.”
theological_decisions:
- issue: Pagkakakilanlan ng “kaban”
  choice: Isinalin lamang bilang “ang kaban” sa pangunahing teksto.
  alternative: “ang kaban ng tipan”
  rationale: הָאָרוֹן lamang ang tahasang nasa talata. Bagaman malinaw sa konteksto na ito ang kaban ng tipan, hindi dapat idagdag sa pangunahing teksto ang mga salitang wala rito; inililinaw sa talababa ang tinutukoy.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “matatandang pinuno” upang maipakita ang opisyal at kinatawang diwa ng זִקְנֵי, at “mga Levita” bilang karaniwang katawagang biblikal.
