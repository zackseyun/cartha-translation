  text: וַ/יְהִ֕י בְּ/צֵ֥את הַ/כֹּהֲנִ֖ים מִן הַ/קֹּ֑דֶשׁ כִּ֠י כָּל הַ/כֹּהֲנִ֤ים הַֽ/נִּמְצְאִים֙ הִתְקַדָּ֔שׁוּ אֵ֖ין לִ/שְׁמ֥וֹר לְ/מַחְלְקֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/005/011.yaml
  text: And when the priests came out of the Holy Place—for all the priests who were present had consecrated themselves[a], without regard to divisions—
translation:
  language: tl
  text: Nang lumabas ang mga pari mula sa Banal na Dako—sapagkat ang lahat ng paring naroon ay nagpakabanal, nang hindi ayon sa kanilang mga pangkat[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nang hindi sinusunod ang pagkakahati sa kanilang mga pangkat”; ibig sabihin, hindi sinunod sa okasyong ito ang karaniwang paghahalinhinan ng mga nakatakdang pangkat ng mga pari.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בְּצֵאת
  choice: Nang lumabas
  rationale: Ang וַיְהִי ay nagpapatuloy sa salaysay, at ang בְּצֵאת ay bumubuo ng sugnay na panahunan. Likas sa modernong Tagalog ang “Nang lumabas” at pinananatili nito ang di-tapos na panimulang sugnay ng talata.
- source_word: הַכֹּהֲנִים
  choice: ang mga pari
  rationale: Karaniwan at malinaw na katumbas ng katawagang Hebreo para sa mga paring naglilingkod sa templo.
- source_word: מִן הַקֹּדֶשׁ
  choice: mula sa Banal na Dako
  rationale: Sa konteksto ng templo, tumutukoy ito sa sagradong bahagi o Holy Place, hindi sa abstraktong kabanalan. Ipinahihiwatig ng malaking titik na tiyak na lugar sa templo ang tinutukoy.
- source_word: כִּי
  choice: sapagkat
  rationale: Nagpapakilala ito ng paliwanag sa kalagayang kaugnay ng paglabas ng mga pari; malinaw na naipapakita ng “sapagkat” ang ugnayang iyon.
- source_word: כָּל הַכֹּהֲנִים הַנִּמְצְאִים
  choice: ang lahat ng paring naroon
  rationale: Ang participle na הַנִּמְצְאִים ay tumutukoy sa mga paring naroroon o nasa lugar, hindi lamang sa mga literal na ‘natagpuan.’
- source_word: הִתְקַדָּשׁוּ
  choice: nagpakabanal
  rationale: Ipinahahayag ng anyong Hitpael ang paghahanda o pagpapabanal ng sarili para sa ritwal na paglilingkod. Ang “nagpakabanal” ay maikli, dignificado, at pamilyar sa Tagalog sa kontekstong panrelihiyon.
- source_word: אֵין לִשְׁמֹר לְמַחְלְקוֹת
  choice: nang hindi sinusunod ang kani-kanilang pangkat
  rationale: Ang parirala ay literal na nagsasaad na walang pagsunod ayon sa mga pagkakahati o pangkat. Sa konteksto, ang מַחְלְקוֹת ay ang mga nakatakdang pangkat ng mga pari; iniiwasan ng salin ang malabong “mga dibisyon” habang pinananatili ang institusyonal na diwa.
theological_decisions:
- issue: Katawagan para sa ritwal na paghahanda ng mga pari
  choice: nagpakabanal
  alternative: itinalaga ang kanilang sarili; nilinis ang kanilang sarili ayon sa ritwal
  rationale: Ritwal na paghahanda para sa paglilingkod sa templo ang tuwirang konteksto. Pinananatili ng “nagpakabanal” ang saklaw ng salitang Hebreo nang hindi nililimitahan ito sa paglilinis lamang o dinaragdagan ng paliwanag na wala sa mismong teksto.
- issue: Paglilingkod nang hindi ayon sa karaniwang mga pangkat
  choice: nang hindi sinusunod ang kani-kanilang pangkat
  alternative: nang walang pagsasaalang-alang sa mga pangkat
  rationale: Ipinakikita ng Hebreo na sa okasyong ito ay hindi ipinatutupad ang karaniwang kaayusan ng paglilingkod ayon sa mga pangkat ng pari. Hindi nito sinasabing binuwag o walang saysay ang mga pangkat.
translation_notes:
  register: Modernong Filipino Tagalog na dignificado ngunit madaling maunawaan. Pinanatili ang em dash at ang di-tapos na ayos ng talata dahil nagpapatuloy ang pangungusap sa susunod na talata. Ginamit ang “Banal na Dako” bilang tiyak na katawagan sa bahagi ng templo, at iniwasan ang teknikal ngunit di-likas na “mga dibisyon” para sa mga pangkat ng pari.
