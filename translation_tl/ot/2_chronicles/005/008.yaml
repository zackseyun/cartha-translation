  source_fidelity: Ang "kinalalagyan ng kaban" ay wastong kumakatawan sa מְקוֹם הָאָרוֹן at pinananatili ang kaibhan nito sa kasunod na tahasang pagbanggit sa kaban. Gayunman, ang "pingga" ay pangunahing tumutukoy sa isang lever at hindi sapat na tiyak para sa בַּדָּיו, ang mga baras na ginagamit sa pagbuhat ng kaban. Ang periprastikong היה + participle ay mas mahusay na naipahahayag sa "nakalahad" kaysa sa payak na nakaraang "iniladlad."
