base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/005/008.yaml
  text: And the cherubim were spreading out their wings over the place of the ark[a], and the cherubim covered the ark and its poles from above.
translation:
  language: tl
  text: At nakalahad ang mga pakpak ng mga kerubin sa ibabaw ng kinalalagyan ng kaban[a], at mula sa itaas ay tinakpan ng mga kerubin ang kaban at ang mga baras na pambuhat nito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “iniunat ang kanilang mga pakpak sa ibabaw ng lugar ng kaban.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ ... פֹּרְשִׂים
  choice: iniladlad
  rationale: Ang היה na may participle ay naglalarawan ng nagpapatuloy na ayos o kalagayan. Sa Filipino, likas na naihahayag ito ng pandiwang “iniladlad” sa daloy ng salaysay, nang hindi gumagamit ng mabigat na literal na hulma.
- source_word: הַכְּרוּבִים
  choice: mga kerubin
  rationale: Ginamit ang nakaugaliang salin-tunog na “kerubin” para sa mga nilalang na kaugnay ng trono at santuwaryo; mas angkop ito sa marangal na konteksto kaysa sa kolokyal na anyo.
- source_word: פֹּרְשִׂים כְּנָפַיִם
  choice: iniladlad ... ang kanilang mga pakpak
  rationale: Ipinahihiwatig ng פרשׂ ang pag-uunat o paglaladlad. Idinagdag ang “kanilang” ayon sa likas na gamit ng Filipino at malinaw na paksa.
- source_word: עַל מְקוֹם הָאָרוֹן
  choice: sa ibabaw ng kinalalagyan ng kaban
  rationale: Pinananatili ang tahasang מְקוֹם, “lugar/kinalalagyan,” sa halip na paikliin bilang “sa ibabaw ng kaban,” sapagkat tuwirang binabanggit ang kaban sa kasunod na sugnay.
- source_word: וַיְכַסּוּ
  choice: tinakpan
  rationale: Ang כסה ay karaniwang nangangahulugang “takpan.” Tuwiran ito at hindi nagdaragdag ng interpretasyong gaya ng “nililiman.”
- source_word: עַל הָאָרוֹן וְעַל בַּדָּיו
  choice: ang kaban at ang mga pingga nito
  rationale: Ang בַּדִּים ay mga pinggang ginagamit sa pagbuhat ng kaban. Ang “pingga” ay malinaw at kasalukuyang salitang Filipino sa kontekstong ito.
- source_word: מִלְמָעְלָה
  choice: mula sa itaas
  rationale: Tuwirang pinananatili ang direksiyon o posisyon na ipinahihiwatig ng anyong may מִן.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang “kinalalagyan ng kaban” upang katawanin ang literal na מְקוֹם at hindi pag-isahin ang dalawang magkaibang parirala ng Hebreo. Ang “kaban” ay ginagamit bilang pamilyar na katawagan sa kaban ng tipan ayon sa konteksto.
