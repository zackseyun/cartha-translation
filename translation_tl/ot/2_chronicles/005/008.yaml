  terminology: Pinananatili ang "kerubin" at "kaban," na angkop at nakaugaliang katawagan sa kontekstong pang-santuwaryo. Pinalitan ang "mga pingga" ng "mga baras na pambuhat" upang malinaw na tukuyin ang mga carrying poles ng kaban.
