  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: אֵ֚ין בָּֽ/אָר֔וֹן רַ֚ק שְׁנֵ֣י הַ/לֻּח֔וֹת אֲשֶׁר נָתַ֥ן מֹשֶׁ֖ה בְּ/חֹרֵ֑ב אֲשֶׁ֨ר כָּרַ֤ת יְהוָה֙ עִם בְּנֵ֣י יִשְׂרָאֵ֔ל בְּ/צֵאתָ֖/ם מִ/מִּצְרָֽיִם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/005/010.yaml
  text: There was nothing in the ark except the two tablets that Moses put there at Horeb[b][a], where Yahweh made a covenant with the people of Israel when they came out of Egypt.
translation:
  language: tl
  text: Walang laman ang kaban maliban sa dalawang tapyas na inilagay ni Moises doon sa Horeb.[a] Doon nakipagtipan si Yahweh sa mga Israelita[b] nang lumabas sila mula sa Ehipto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “na ibinigay ni Moises sa Horeb.” Sa kontekstong ito, ang pandiwang Hebreo ay tumutukoy sa paglalagay ng mga tapyas sa kaban.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “mga anak ni Israel.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵין בָּאָרוֹן רַק
  choice: Walang laman ang kaban maliban sa
  rationale: Likas na Filipino ang hulmaing “walang … maliban sa” at malinaw nitong pinananatili ang pag-iral na itinatanggi at ang pagtatangi ng רַק.
- source_word: שְׁנֵי הַלֻּחוֹת
  choice: dalawang tapyas
  rationale: Tumpak na isinasalin ang לֻחוֹת nang hindi idinaragdag sa pangunahing teksto ang “bato,” na hindi tahasang nasa talatang ito.
- source_word: אֲשֶׁר נָתַן מֹשֶׁה
  choice: na inilagay ni Moises doon
  rationale: Bagaman karaniwang nangangahulugang “ibinigay” ang נָתַן, sa konteksto ng mga bagay na nasa kaban ay tumutukoy ito sa paglalagay. Nililinaw ng “doon” ang tinutukoy na kinalalagyan.
- source_word: בְּחֹרֵב
  choice: sa Horeb
  rationale: Pinananatili ang pangalang Horeb sa tekstong Hebreo at hindi ito itinutugma sa Sinai.
- source_word: אֲשֶׁר כָּרַת יְהוָה עִם
  choice: Doon nakipagtipan si Yahweh sa
  rationale: Ang כָּרַת, sa kontekstong ito, ay bahagi ng idyomang paggawa ng tipan. Ang “Doon” ay natural na nag-uugnay sa sugnay sa Horeb, habang ang “nakipagtipan” ay malinaw at marangal na Filipino.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga Israelita
  rationale: Ito ang natural na kolektibong katawagan sa makabagong Filipino; inilalagay sa talababa ang mas pormal at literal na anyo.
- source_word: בְּצֵאתָם מִמִּצְרָיִם
  choice: nang lumabas sila mula sa Ehipto
  rationale: Ang temporal na parirala ay likas na isinasalin sa “nang,” at pinananatili ng “mula sa Ehipto” ang pinagmulan ng paglabas.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang ginagamit ng tekstong Hebreo ang Tetragrammaton; pinananatili ng “Yahweh” ang personal at tipanang pangalan nang hindi ito pinapalitan ng isang titulo.
- issue: Di-tahasang pagbanggit sa tipan sa pariralang אֲשֶׁר כָּרַת יְהוָה עִם
  choice: nakipagtipan si Yahweh sa
  alternative: na pinagtibay ni Yahweh sa kanila; na ginawa ni Yahweh kasama nila
  rationale: Bagaman hindi inuulit sa Hebreo ang pangngalang בְּרִית (“tipan”), ang pandiwang כָּרַת kasama ng עִם sa kontekstong ito ay tumutukoy sa pagtatatag ng tipan. Ginagawang malinaw ito sa Filipino nang hindi tinutukoy ang nilalaman ng tipan nang higit sa sinasabi ng teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kaban” bilang nakaugaliang katawagan sa kaban ng tipan, “tapyas” nang hindi idinaragdag ang materyal na bato, at “mga Israelita” para sa likas na kolektibong pagtukoy. Hinati sa dalawang pangungusap upang maiwasan ang mabigat at malabong sunod-sunod na sugnay, habang pinananatiling Horeb ang pinakamalapit na pinatutungkulan ng “Doon.”
