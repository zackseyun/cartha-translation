  text: וַ/יַּעֲל֤וּ אֶת הָ/אָרוֹן֙ וְ/אֶת אֹ֣הֶל מוֹעֵ֔ד וְ/אֶת כָּל כְּלֵ֥י הַ/קֹּ֖דֶשׁ אֲשֶׁ֣ר בָּ/אֹ֑הֶל הֶעֱל֣וּ אֹתָ֔/ם הַ/כֹּהֲנִ֖ים הַ/לְוִיִּֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/005/005.yaml
  text: And they brought up the ark[a], the tent of meeting, and all the holy vessels that were in the tent; the Levitical priests brought them up.
translation:
  language: tl
  text: At iniakyat nila ang kaban, ang Toldang Tipanan, at ang lahat ng mga kagamitang banal na nasa tolda. Ang mga paring Levita[a] ang nag-akyat ng mga iyon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “ang mga pari, ang mga Levita.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעֲלוּ / הֶעֱלוּ
  choice: iniakyat / nag-akyat
  rationale: Pinananatili ang paulit-ulit na pandiwang עלה sa Hiphil at ang diwang direksiyonal ng pagdadala paitaas patungo sa templo, habang natural ang anyo sa Filipino.
- source_word: הָאָרוֹן
  choice: ang kaban
  rationale: Payak na 'ang kaban' ang nasa Hebreo, hindi ang mas buong 'kaban ng tipan'; malinaw ito sa konteksto at tapat sa pinaikling pagtukoy.
- source_word: אֹהֶל מוֹעֵד
  choice: ang Toldang Tipanan
  rationale: Ginagamit ang pamilyar at marangal na katawagan sa santuwaryong tolda kung saan nakikipagtipan o nakikipagtagpo ang Diyos sa Israel; iniiwasan ang teknikal at di-gaanong pangkaraniwang 'tabernakulo.'
- source_word: כָּל כְּלֵי הַקֹּדֶשׁ
  choice: ang lahat ng mga kagamitang banal
  rationale: Malawak ang כְּלִים at maaaring tumukoy sa mga kagamitan o kasangkapang ginagamit sa santuwaryo; ang 'mga kagamitang banal' ay natural at hindi labis na nagpapakitid sa sisidlan lamang.
- source_word: אֲשֶׁר בָּאֹהֶל
  choice: na nasa tolda
  rationale: Tuwirang ipinapakita ng sugnay ang kinaroroonan ng mga banal na kagamitan at inuulit ang 'tolda' gaya ng Hebreo.
- source_word: הַכֹּהֲנִים הַלְוִיִּם
  choice: ang mga paring Levita
  rationale: Natural nitong ipinakikilalang Levita ang mga pari nang hindi ipinahihiwatig na pari ang lahat ng Levita; inilalagay sa talababa ang mas literal na anyong appositional.
theological_decisions:
- issue: Pagpapakahulugan sa הַכֹּהֲנִים הַלְוִיִּם
  choice: ang mga paring Levita
  alternative: ang mga pari, ang mga Levita
  rationale: Maaaring basahin ang dalawang pangngalan bilang isang appositional na pariralang kumikilala sa mga pari bilang mga Levita. Pinili sa teksto ang natural na Filipino na hindi binubura ang pagkakaiba ng mga pari at ng mas malawak na pangkat ng mga Levita, habang pinananatili sa talababa ang literal at tunay na posibleng anyo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang 'kaban' at 'Toldang Tipanan' bilang pamilyar na katawagang biblikal; iniwasan ang sobrang teknikal o makalumang pananalita. Ang marker na [a] ay inilagay kaagad pagkatapos ng pariralang tinutukoy.
