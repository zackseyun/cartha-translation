  source_fidelity: 'Tapat ang salin sa Hebreo: naipapahayag ang pag-akyat/pagdala ng kaban, Toldang Tipanan, at lahat ng banal na kagamitan, pati ang pag-uulit ng pandiwa at ang huling pagtukoy sa mga paring Levita bilang nagsagawa nito. Hindi nito idinadagdag ang "ng tipan" sa "kaban."'
