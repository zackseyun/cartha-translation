  - severity: low
    issue: Medyo di-likas ang 'mga ingatang-yaman.'
    rationale: Bagaman nauunawaan, mas karaniwan at malinaw ang 'mga taguan ng yaman' para sa maramihang אֹצְרוֹת, nang hindi ginagawang sobrang teknikal ang parirala.
