  edition: WLC
  text: וַ/תִּשְׁלַם֙ כָּל הַ/מְּלָאכָ֔ה אֲשֶׁר עָשָׂ֥ה שְׁלֹמֹ֖ה לְ/בֵ֣ית יְהוָ֑ה וַ/יָּבֵ֨א שְׁלֹמֹ֜ה אֶת קָדְשֵׁ֣י דָּוִ֣יד אָבִ֗י/ו וְ/אֶת הַ/כֶּ֤סֶף וְ/אֶת הַ/זָּהָב֙ וְ/אֶת כָּל הַ/כֵּלִ֔ים נָתַ֕ן בְּ/אֹצְר֖וֹת בֵּ֥ית הָ/אֱלֹהִֽים־־ס־׀־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/005/001.yaml
  text: Thus all the work that Solomon had done for the house of Yahweh was finished. Then Solomon brought in the holy things of David his father[a], and the silver, the gold, and all the vessels; he put them into the treasuries of the house of God.
translation:
  language: tl
  text: Kaya natapos ang lahat ng gawaing ginawa ni Solomon para sa bahay ni Yahweh. Pagkatapos, ipinasok ni Solomon ang mga banal na bagay ni David na kanyang ama[a], ang pilak, ang ginto, at ang lahat ng kagamitan; inilagay niya ang mga ito sa mga taguan ng yaman ng bahay ng Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang mga bagay na itinalaga ni David na kanyang ama,” o “ang mga bagay na inilaan ni David na kanyang ama.”
    reason: Leksikal na alternatibo para sa קָדְשֵׁי, na maaaring tumukoy sa mga sagradong bagay o sa mga bagay na itinalaga para sa sagradong gamit.
lexical_decisions:
- source_word: וַתִּשְׁלַם
  choice: natapos
  rationale: Ipinapahayag ng pandiwa ang ganap na pagkakatapos ng gawain; natural at tuwiran ang “natapos” sa makabagong Tagalog.
- source_word: כָּל הַמְּלָאכָה
  choice: ang lahat ng gawain
  rationale: Tumutukoy ito sa kabuuang proyekto ng pagtatayo at paghahanda para sa templo, hindi lamang sa pagkakayari ng mga bagay.
- source_word: לְבֵית יְהוָה
  choice: para sa bahay ni Yahweh
  rationale: Pinananatili ng “bahay” ang larawan sa Hebreo, at ang pangalang tipan na יהוה ay tinutumbasan ng “Yahweh.”
- source_word: וַיָּבֵא
  choice: ipinasok
  rationale: Ang Hiphil ng בוא ay may diwang “dalhin/papasukin”; malinaw sa konteksto na ang mga bagay ay ipinasok sa bahay ng Diyos.
- source_word: קָדְשֵׁי דָּוִיד אָבִיו
  choice: ang mga banal na bagay ni David na kanyang ama
  rationale: Malapit ito sa anyo ng Hebreo at hindi isinasara ang saklaw sa isang paliwanag lamang; nililinaw sa talababa na ang mga ito ay mga bagay na itinalaga o inilaan.
- source_word: הַכֶּסֶף וְהַזָּהָב
  choice: ang pilak, ang ginto
  rationale: Pinananatili ang magkahiwalay at mariing pagbanggit sa dalawang mahalagang metal.
- source_word: כָּל הַכֵּלִים
  choice: ang lahat ng kagamitan
  rationale: Malawak ang כְּלִי at maaaring tumukoy sa sari-saring sisidlan, kasangkapan, o kagamitan; mas likas at sapat na malawak ang “kagamitan” sa Tagalog.
- source_word: נָתַן
  choice: inilagay niya
  rationale: Sa konteksto ng pag-iimbak, ang pangkalahatang pandiwang נתן ay natural na naipapahayag bilang “inilagay.”
- source_word: בְּאֹצְרוֹת
  choice: sa mga ingatang-yaman
  rationale: Ipinapakita ng maramihan na may higit sa isang silid o lagakan ng mahahalagang bagay; dignified at malinaw ang “mga ingatang-yaman.”
- source_word: בֵּית הָאֱלֹהִים
  choice: bahay ng Diyos
  rationale: Pinananatili ang literal na larawan ng “bahay” at ang pagbabago ng banal na katawagan mula Yahweh tungong Diyos.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON o Jehova
  rationale: Tuwirang ginagamit sa Hebreo ang Tetragrammaton; pinananatili ng “Yahweh” ang natatanging pangalang tipan sa halip na palitan ito ng titulo.
- issue: Pagkakaiba ng בֵּית יְהוָה at בֵּית הָאֱלֹהִים
  choice: “bahay ni Yahweh” at “bahay ng Diyos”
  alternative: Gawing “templo” ang dalawang parirala
  rationale: Pinananatili ang sinadyang pagkakaiba ng mga katawagan at ang magkakatulad na larawang “bahay” sa dalawang parirala.
- issue: Kahulugan ng קָדְשֵׁי
  choice: mga banal na bagay, na may talababa
  alternative: mga bagay na itinalaga o inilaan
  rationale: Pinananatili sa teksto ang pormal at malawak na kahulugan habang ipinakikita sa talababa ang mas tiyak na posibleng diwa ng mga bagay na itinalaga sa sagradong gamit.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang “bahay” sa halip na gawing “templo” upang maingatan ang larawan at pagkakaiba ng mga parirala sa Hebreo. Ginamit ang “ingatang-yaman” bilang madaling maunawaang tawag sa mga silid o lagakang pinag-iimbakan ng mahahalagang bagay.
