  source_fidelity: Tumpak sa kabuuan ang pagsasalin ng pagkakatapos ng gawain, pagpasok ng mga itinalagang bagay, at paglalagay ng mga ito sa mga imbakan. Gayunman, ang em dash ay nagpapahiwatig na ang pilak, ginto, at kagamitan ay pagpapaliwanag o kapalit ng 'mga banal na bagay,' samantalang inililista ng Hebreo ang mga ito bilang magkakahiwalay na layon ng 'ipinasok.'
  naturalness: Makabago at marangal ang Tagalog. Mas natural at mas malinaw ang payak na magkakaugnay na talaan kaysa paggamit ng em dash sa bahaging ito.
  terminology: Ang 'bahay ni Yahweh,' 'bahay ng Diyos,' at 'mga banal na bagay' ay angkop at pinananatili ang mga pagkakaiba sa Hebreo. Ang 'mga ingatang-yaman' ay nauunawaan, bagaman ang 'mga taguan ng yaman' ay mas likas na modernong Tagalog para sa mga treasury/storehouse.
