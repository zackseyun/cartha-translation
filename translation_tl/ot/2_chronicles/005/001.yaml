- from: Kaya natapos ang lahat ng gawaing ginawa ni Solomon para sa bahay ni Yahweh. Pagkatapos, ipinasok ni Solomon ang mga banal na bagay ni David na kanyang ama[a]—ang pilak, ang ginto, at ang lahat ng kagamitan—at inilagay niya ang mga iyon sa mga ingatang-yaman ng bahay ng Diyos.
  to: Kaya natapos ang lahat ng gawaing ginawa ni Solomon para sa bahay ni Yahweh. Pagkatapos, ipinasok ni Solomon ang mga banal na bagay ni David na kanyang ama[a], ang pilak, ang ginto, at ang lahat ng kagamitan; inilagay niya ang mga ito sa mga taguan ng yaman ng bahay ng Diyos.
