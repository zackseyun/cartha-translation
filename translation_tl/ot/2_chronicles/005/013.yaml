id: 2CH.5.13
reference: 2 Chronicles 5:13
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יְהִ֣י כְ֠/אֶחָד ל/מחצצרים וְ/לַ/מְשֹֽׁרֲרִ֜ים לְ/הַשְׁמִ֣יעַ קוֹל אֶחָ֗ד לְ/הַלֵּ֣ל וּ/לְ/הֹדוֹת֮ לַ/יהוָה֒ וּ/כְ/הָרִ֣ים ק֠וֹל בַּ/חֲצֹצְר֨וֹת וּ/בִ/מְצִלְתַּ֜יִם וּ/בִ/כְלֵ֣י הַ/שִּׁ֗יר וּ/בְ/הַלֵּ֤ל לַ/יהוָה֙ כִּ֣י ט֔וֹב כִּ֥י לְ/עוֹלָ֖ם חַסְדּ֑/וֹ וְ/הַ/בַּ֛יִת מָלֵ֥א עָנָ֖ן בֵּ֥ית יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/005/013.yaml
  text: And it came about[a], as the trumpeters and the singers were as one, to make one sound in praising and giving thanks to Yahweh, and when they lifted up their voice with trumpets and cymbals and instruments for song, and in praising Yahweh, “For he is good, for his steadfast love endures forever,” the house, the house of Yahweh[c][b], was filled with a cloud.
translation:
  language: tl
  text: 'Nang magkaisa[a] ang mga tagahip ng trumpeta at ang mga mang-aawit upang magparinig ng iisang tunog sa pagpupuri at pagpapasalamat kay Yahweh, at nang itaas nila ang kanilang tinig kasabay ng mga trumpeta, mga pompiyang, at mga instrumentong pang-awit, habang pinupuri nila si Yahweh: “Sapagkat siya ay mabuti; sapagkat ang kanyang tapat na pag-ibig[b] ay magpakailanman”—ang bahay, ang bahay ni Yahweh, ay napuno ng ulap.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “parang iisa” o “nang magkakasama.”
    reason: lexical_alternative
  - marker: b
    text: Ang Hebreong ḥesed ay maaaring tumukoy sa matatag at tapat na pag-ibig; isinasalin din itong “awa” o “wagas na katapatan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כְאֶחָד
  choice: magkaisa
  rationale: Ipinahahayag ang sama-sama at nagkakaisang pagkilos, hindi lamang ang pagsabay sa oras; pinananatili rin ng kasunod na “iisang tunog” ang larawan ng pagkakaisa.
- source_word: למחצצרים
  choice: mga tagahip ng trumpeta
  rationale: Tiyak at likas na tawag sa mga taong nagpapatunog ng mga trumpeta.
- source_word: ולמשׁררים
  choice: mga mang-aawit
  rationale: Ang anyong participle mula sa ugat na שׁיר ay tumutukoy sa mga umaawit, hindi sa mga musikero sa pangkalahatan.
- source_word: להשמיע קול אחד
  choice: upang magparinig ng iisang tunog
  rationale: Pinananatili ang layunin ng infinitive at ang kongkretong diin sa isang nagkakaisang tunog.
- source_word: להלל ולהודות
  choice: sa pagpupuri at pagpapasalamat
  rationale: 'Malinaw na pinananatiling magkahiwalay ang dalawang kilos: pagpuri at pagpapasalamat.'
- source_word: יהוה
  choice: Yahweh
  rationale: Tuwirang isinasalin ang personal na pangalang banal na nakasulat sa tekstong Hebreo.
- source_word: וכהרים קול
  choice: nang itaas nila ang kanilang tinig
  rationale: Likas na idyomang Filipino para sa Hebreong pagpapataas ng tinig o tunog; kolektibo ang isahang קוֹל.
- source_word: בחצצרות ובמצלתים ובכלי השיר
  choice: kasabay ng mga trumpeta, mga pompiyang, at mga panugtog
  rationale: Tinutukoy ang mga instrumentong sumasabay sa itinaas na tinig; ang “pompiyang” ay karaniwang salin ng mga cymbal, at ang “mga panugtog” ay malinaw na pangkalahatang tawag sa כלי השיר.
- source_word: כי טוב כי לעולם חסדו
  choice: Sapagkat siya ay mabuti; sapagkat ang kanyang tapat na pag-ibig ay magpakailanman
  rationale: Pinananatili ang dalawang sugnay ng pormulang liturhikal at isinasalin ang חֶסֶד bilang matatag at patuloy na pag-ibig na may diwa ng katapatan.
- source_word: והבית מלא ענן בית יהוה
  choice: ang bahay, ang bahay ni Yahweh, ay napuno ng ulap
  rationale: Pinananatili ang pag-uulit at apposition ng “bahay” sa Hebreo, pati ang di-tiyak na “ulap.”
theological_decisions:
- issue: Paglalahad sa pangalang יהוה
  choice: Yahweh
  alternative: ang PANGINOON
  rationale: Personal na pangalan ang nasa tekstong Hebreo; ang “Yahweh” ay hindi nagpapalit dito ng titulong wala sa mismong anyo ng pinagmulan.
- issue: Kahulugan ng חַסְדּוֹ
  choice: ang kanyang tapat na pag-ibig
  alternative: ang kanyang awa
  rationale: Mas malawak sa awa lamang ang חֶסֶד at madalas na nagpapahiwatig ng matatag, tapat, at nagbubuklod na pag-ibig; pinananatili ng saling ito ang lawak na iyon nang hindi ito ikinukulong sa isang doktrinal na paliwanag.
- issue: Di-tahasang pagpapakilala sa siniping pahayag
  choice: ginamit ang tutuldok bago ang sipi nang hindi nagdaragdag ng “sinabi nila”
  alternative: at sinabi nila
  rationale: Malinaw sa daloy na ang kasunod ay nilalaman ng pagpuri, ngunit walang hiwalay na pandiwang “sabihin” sa Hebreo; ang bantas ay nagbibigay-linaw nang hindi nagdaragdag ng tahasang kilos.
translation_notes:
  register: Makabagong Filipino na marangal at angkop sa pampublikong pagbasa. Pinanatili ang mahabang, seremonyal na daloy ng Hebreo sa tulong ng gatlang at tutuldok, ngunit iniwasan ang lipas o labis na teknikal na pananalita.
