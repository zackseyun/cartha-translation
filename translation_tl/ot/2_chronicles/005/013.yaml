- from: 'Nang magkaisa[a] ang mga tagahip ng trumpeta at ang mga mang-aawit upang magparinig ng iisang tunog sa pagpupuri at pagpapasalamat kay Yahweh—nang itaas nila ang kanilang tinig kasabay ng mga trumpeta, mga pompiyang, at mga panugtog, at pinuri si Yahweh: “Sapagkat siya ay mabuti; sapagkat ang kanyang tapat na pag-ibig[b] ay magpakailanman”—ang bahay, ang bahay ni Yahweh, ay napuno ng ulap.'
  to: 'Nang magkaisa[a] ang mga tagahip ng trumpeta at ang mga mang-aawit upang magparinig ng iisang tunog sa pagpupuri at pagpapasalamat kay Yahweh, at nang itaas nila ang kanilang tinig kasabay ng mga trumpeta, mga pompiyang, at mga instrumentong pang-awit, habang pinupuri nila si Yahweh: “Sapagkat siya ay mabuti; sapagkat ang kanyang tapat na pag-ibig[b] ay magpakailanman”—ang bahay, ang bahay ni Yahweh, ay napuno ng ulap.'
  rationale: Inayos ang pagsasalin ng circumstantial na בְהַלֵּל upang ipakitang kasabay ng pagtugtog ang pagpuri kay Yahweh, sa halip na isang hiwalay na kilos na nakaraan. Ginawang mas tiyak ang katawagan sa mga instrumentong pang-awit. Pinanatili ang ayos, pag-uulit, at di-tiyak na “ulap” ng Hebreo, pati ang mga footnote anchor.
