  text: And all the men of Israel assembled before the king at the feast, that is, in the seventh month.
translation:
  language: tl
  text: Nagtipon sa harap ng hari ang lahat ng kalalakihan ng Israel sa kapistahan, iyon ay, sa ikapitong buwan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקָּהֲלוּ
  choice: Nagtipon
  rationale: Likas at tuwirang katumbas ng pandiwang nangangahulugang magtipon o magkatipon bilang isang kapulungan.
- source_word: אֶל־הַמֶּלֶךְ
  choice: sa harap ng hari
  rationale: Sa kontekstong ito, ang Hebreong אֶל ay nagpapahiwatig ng paglapit at pagtitipon sa kinaroroonan ng hari; mas natural sa Filipino ang 'sa harap ng hari' kaysa 'patungo sa hari.'
- source_word: כָּל־אִישׁ יִשְׂרָאֵל
  choice: ang lahat ng kalalakihan ng Israel
  rationale: Pinananatili ang panlalaking pangngalang אִישׁ at ang kolektibong saklaw nito, sa halip na gawing pangkalahatang 'lahat ng Israel.'
- source_word: בֶּחָג
  choice: sa panahon ng kapistahan
  rationale: Ipinahahayag ang temporal na gamit ng בְּ at ang kahulugan ng חַג bilang kapistahan o taunang pistang panrelihiyon.
- source_word: הוּא הַחֹדֶשׁ הַשְּׁבִיעִי
  choice: samakatuwid, sa ikapitong buwan
  rationale: 'Ang הוּא ay ginagamit dito bilang paglilinaw o pagtukoy: ang panahon ng kapistahan ay nasa ikapitong buwan. Ang ''samakatuwid'' ay nagpapanatili sa eksplisitong ugnayang ito nang hindi tinutukoy ang pangalan ng kapistahan.'
