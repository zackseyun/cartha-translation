base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/005/006.yaml
  text: And King Solomon and all the assembly of Israel who had assembled before him[a], before the ark[b], were sacrificing sheep and cattle that could not be counted or numbered because of their great number.
translation:
  language: tl
  text: At si Haring Solomon at ang buong kapulungan ng Israel na nagkatipon kasama niya[a], sa harap ng Kaban, ay naghahandog ng mga tupa at kambing at mga baka[b] na hindi mabilang o matantos dahil sa napakarami ng mga iyon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “na nagkatipon sa harap niya.” Maaaring tumukoy ang Hebreong pananalita sa kapulungang nagtipon kasama ni Solomon o sa kanyang harapan.
    reason: lexical_alternative
  - marker: b
    text: Ang “mga tupa at kambing” ay salin ng Hebreong צֹאן, isang pangkalahatang katawagan para sa maliliit na alagang hayop na maaaring sumaklaw sa mga tupa at kambing.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲדַת יִשְׂרָאֵל
  choice: ang buong kapulungan ng Israel
  rationale: Ang עֵדָה ay tumutukoy sa pamayanang sama-samang nagtipon. Likas at marangal sa modernong Tagalog ang “kapulungan,” at ipinahihiwatig ng “buong” ang saklaw ng כָּל.
- source_word: הַנּוֹעָדִים עָלָיו
  choice: na nagkatipon kasama niya
  rationale: Ang Niphal na participle ay naglalarawan sa mga taong nagtipon; sa kontekstong ito, maaaring ipakahulugan ang עָלָיו bilang kasama ni Solomon o nasa kanyang harapan. Pinili ang “kasama niya” upang maging natural habang pinananatili sa talababa ang tunay na kalabuan.
- source_word: לִפְנֵי הָאָרוֹן
  choice: sa harap ng Kaban
  rationale: Tuwirang panlunan ang parirala. Ang “Kaban” ay malinaw na katawagan dito sa banal na kaban na tinutukoy ng konteksto.
- source_word: מְזַבְּחִים
  choice: ay naghahandog
  rationale: Pinananatili ng aspektong nagaganap ng “naghahandog” ang tuloy-tuloy na kilos ng participle; malinaw sa konteksto na paghahandog bilang hain ang ginagawa.
- source_word: צֹאן וּבָקָר
  choice: maliliit na hayop at mga baka
  rationale: Mas malawak ang צֹאן kaysa “mga tupa” lamang at maaaring sumaklaw sa tupa at kambing. Ang “maliliit na hayop” ay nagpapanatili ng lawak nito, samantalang ang בָּקָר ay “mga baka.”
- source_word: אֲשֶׁר לֹא יִסָּפְרוּ וְלֹא יִמָּנוּ
  choice: na hindi mabilang o matuos
  rationale: Pinananatili ang magkatabing halos magkasingkahulugang pandiwa upang maipahayag ang diin ng Hebreo.
- source_word: מֵרֹב
  choice: dahil sa napakarami ng mga iyon
  rationale: 'Malinaw nitong ipinahahayag ang sanhi: hindi mabilang ang mga hayop dahil sa labis na dami.'
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “kapulungan” para sa sama-samang bayan, “Kaban” bilang katawagang angkop sa konteksto, at “mabilang o matuos” upang mapanatili ang dobleng diin ng Hebreo.
