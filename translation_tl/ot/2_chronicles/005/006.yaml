revisions:
- from: At si Haring Solomon at ang buong kapulungan ng Israel na nagkatipon kasama niya[a] sa harap ng Kaban ay naghahandog ng maliliit na hayop at mga baka[b] na hindi mabilang o matuos dahil sa napakarami ng mga iyon.
  to: At si Haring Solomon at ang buong kapulungan ng Israel na nagkatipon kasama niya[a], sa harap ng Kaban, ay naghahandog ng mga tupa at kambing at mga baka[b] na hindi mabilang o matantos dahil sa napakarami ng mga iyon.
  rationale: Pinalitan ang hindi likas na “matuos” ng “matantos” upang mapanatili ang dobleng pagdidiin ng dalawang Hebreong pandiwa sa natural na Filipino. Pinalitan din ang “maliliit na hayop” ng “mga tupa at kambing” para sa mas malinaw na pangsakripisyong pananalita, habang pinanatili sa talababa ang katotohanang mas malawak ang saklaw ng צֹאן. Hindi binago ang sinasadyang kalabuan ng עָלָיו, na nakatala sa talababa.
