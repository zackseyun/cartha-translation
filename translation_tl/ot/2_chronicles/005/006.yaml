  terminology: Ang “kapulungan,” “Kaban,” at “naghahandog” ay angkop sa marangal ngunit modernong rehistro. Ang “mga tupa at kambing” ay nagbibigay ng natural na pagsasalin para sa צֹאן nang hindi itinatanggi sa talababa na ito ay isang pangkalahatang katawagan para sa maliliit na alagang hayop.
