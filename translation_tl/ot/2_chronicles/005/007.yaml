  text: וַ/יָּבִ֣יאוּ הַ֠/כֹּהֲנִים אֶת אֲר֨וֹן בְּרִית יְהוָ֧ה אֶל מְקוֹמ֛/וֹ אֶל דְּבִ֥יר הַ/בַּ֖יִת אֶל קֹ֣דֶשׁ הַ/קְּדָשִׁ֑ים אֶל תַּ֖חַת כַּנְפֵ֥י הַ/כְּרוּבִֽים־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/005/007.yaml
  text: Then the priests brought the ark of the covenant of Yahweh to its place[a], into the inner sanctuary of the house, into the Most Holy Place, under the wings of the cherubim.
translation:
  language: tl
  text: Pagkatapos, dinala ng mga pari ang kaban ng tipan ni Yahweh sa lugar nito, sa pinakaloob na santuwaryo ng bahay, sa Pinakabanal na Lugar[a], sa ilalim ng mga pakpak ng mga kerubin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Kabanal-banalang Dako.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבִיאוּ
  choice: dinala
  rationale: Ang Hiphil ng בוא ay nangangahulugang “dalhin” o “papuntahin.” Natural sa Filipino ang “dinala” at hindi ito nagdaragdag ng paraang hindi tahasang binanggit.
- source_word: הַכֹּהֲנִים
  choice: ang mga pari
  rationale: Tuwirang salin ng tiyak na pangngalang maramihan; ang mga pari ang tahasang simuno.
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: ang kaban ng tipan ni Yahweh
  rationale: Pinananatili ang ugnayang konstrukto at tahasang ipinapakita na ang tipan ay kay Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang transliterasyon ng banal na pangalan sa halip na palitan ito ng isang titulo.
- source_word: מְקוֹמוֹ
  choice: sa lugar nito
  rationale: Ang hulaping panghalip ay tumutukoy sa kaban; malinaw at likas ang “lugar nito” nang hindi idinaragdag ang ideyang “itinakda” o “nararapat.”
- source_word: דְּבִיר הַבַּיִת
  choice: sa pinakaloob na santuwaryo ng bahay
  rationale: Ang דְּבִיר ay ang pinakaloob na silid-santuwaryo. Pinananatili ang literal na “bahay” para sa הַבַּיִת, habang nililinaw ang sagradong gamit ng silid.
- source_word: קֹדֶשׁ הַקְּדָשִׁים
  choice: sa Kabanal-banalang Lugar
  rationale: Ipinahahayag nito sa natural na Filipino ang Hebreong superlatibong konstruksyon, ang lugar na sukdulang banal.
- source_word: תַּחַת כַּנְפֵי הַכְּרוּבִים
  choice: sa ilalim ng mga pakpak ng mga kerubin
  rationale: Tuwirang inililipat ang lokasyong “sa ilalim” at ang maramihang “mga pakpak”; “kerubin” ang nakaugaliang transliterasyon sa Filipino.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; ang PANGINOON
  rationale: Personal na pangalan ang יְהוָה sa teksto. Pinananatili ng “Yahweh” ang pangalan sa halip na palitan ito ng titulo, nang hindi nagdaragdag ng denominasyonal na pagpapakahulugan.
- issue: Pag-unawa sa קֹדֶשׁ הַקְּדָשִׁים
  choice: Kabanal-banalang Lugar
  alternative: Banal ng mga Banal
  rationale: Parehong naipakikita ang Hebreong sukdulang antas. Mas malinaw at natural sa karaniwang modernong Filipino ang “Kabanal-banalang Lugar,” habang inilalagay sa talababa ang mas pormal na alternatibo.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang mga gitling na pahaba upang ipakita na ang “pinakaloob na santuwaryo” at “Kabanal-banalang Lugar” ay magkakatumbas na paglalarawan sa destinasyon ng kaban. Pinanatili ang “bahay” para sa lexical correspondence sa בַּיִת, sa halip na tahasang gawing “templo.”
