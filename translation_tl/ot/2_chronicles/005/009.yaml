revisions:
- from: Iniunat nila ang mga pingga, kaya nakikita ang mga dulo ng mga ito mula sa Kaban, sa harap ng santuwaryo sa loob[a]; ngunit hindi nakikita ang mga ito mula sa labas. Naroon pa rin ang mga iyon hanggang sa araw na ito.
  to: Pinahaba ang mga pingga, kaya nakita ang mga dulo ng mga pingga na nakausli mula sa Kaban, sa harap ng santuwaryo sa loob[a]; ngunit hindi makita ang mga ito mula sa labas. Nandoon ang mga ito hanggang sa araw na ito.
  rationale: Ginawang pasibo ang unang sugnay upang mapanatili ang causative na diwa nang walang idinagdag na tagaganap. Nilinaw ang ugnayan ng mga dulo ng pingga at ng Kaban sa paraang natural sa Filipino, habang pinanatili ang kaibahan ng pagkakita sa harap ng panloob na santuwaryo at hindi pagkakita mula sa labas. Pinanatili ang talababa at ang terminolohiyang pangkulto.
