base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/005/009.yaml
  text: And the poles were so long that the heads of the poles were seen from the ark before the inner sanctuary[a], but they could not be seen from outside; and they are there to this day.
translation:
  language: tl
  text: Pinahaba ang mga pingga, kaya nakita ang mga dulo ng mga pingga na nakausli mula sa Kaban, sa harap ng santuwaryo sa loob[a]; ngunit hindi makita ang mga ito mula sa labas. Nandoon ang mga ito hanggang sa araw na ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “sa harap ng Dakong Kabanal-banalan.”
    reason: Pinananatili ang leksikal na alternatibo para sa הַדְּבִיר, na maaaring tukuyin bilang “santuwaryo sa loob” o “Dakong Kabanal-banalan.”
lexical_decisions:
- source_word: וַיַּאֲרִיכוּ
  choice: Iniunat nila
  rationale: Ang Hiphil ng ארך ay nagsasaad na pinahaba o iniunat nila ang mga pingga. Pinananatili ng aktibong anyong ito ang pahiwatig ng pandiwang Hebreo nang hindi tinutukoy kung paano ginawa ang pag-uunat.
- source_word: הַבַּדִּים
  choice: ang mga pingga
  rationale: Tumutukoy ito sa mahahabang pinggang pambuhat ng Kaban. Karaniwan at malinaw sa modernong Filipino ang “mga pingga.”
- source_word: רָאשֵׁי הַבַּדִּים
  choice: ang mga dulo ng mga ito
  rationale: Literal na “mga ulo ng mga pingga,” ngunit “mga dulo” ang likas na tawag sa Filipino sa mga dulong bahagi ng mga pingga.
- source_word: מִן הָאָרוֹן
  choice: mula sa Kaban
  rationale: 'Pinananatili ang payak na ugnayang panlunan ng מִן: ang mga dulo ay nakikita mula sa kinalalagyan ng Kaban, nang hindi labis na nililinaw ang eksaktong ayos ng mga ito.'
- source_word: עַל פְּנֵי הַדְּבִיר
  choice: sa harap ng santuwaryo sa loob
  rationale: Ang דְּבִיר ay ang pinakaloob na silid ng templo. Malinaw ang “santuwaryo sa loob,” at likas na katumbas ng panlunang עַל־פְּנֵי ang “sa harap ng.”
- source_word: וְלֹא יֵרָאוּ הַחוּצָה
  choice: ngunit hindi nakikita ang mga ito mula sa labas
  rationale: Ipinapakita nito ang pagsalungat sa naunang pagkakakita sa mga dulo at pinananatili ang diwa ng direksiyon o pananaw mula sa labas.
- source_word: וַיְהִי שָׁם עַד הַיּוֹם הַזֶּה
  choice: Naroon pa rin ang mga iyon hanggang sa araw na ito
  rationale: Ang pang-isahang pandiwa ay ginagamit dito sa eksistensiyal na paraan, samantalang ang mga pingga ang likas na tinutukoy. Ang “hanggang sa araw na ito” ay nagpapanatili sa karaniwang idyomang Hebreo.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “Kaban” bilang pamilyar na pinaikling tawag sa Kaban ng Tipan batay sa konteksto, at iniwasan ang lipas na “mga pingga” alternatives gaya ng “mga tukod.”
