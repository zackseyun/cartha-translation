  to: At ang lahat ng Levitang mang-aawit—sina Asaf, Heman, Jedutun, pati ang kanilang mga anak na lalaki at mga kapatid—ay nakadamit ng pinong lino at nakatayo sa silangan ng altar,[b] na may mga pompiyang, mga alpa,[a] at mga lira. Kasama nila ang 120 paring humihip ng mga trumpeta.
