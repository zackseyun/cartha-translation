base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/005/012.yaml
  text: And the Levites who were the singers—all of them[a], Asaph, Heman, Jeduthun, and their sons and their brothers—were clothed in fine linen, with cymbals, harps, and lyres, standing east of the altar[b]; and with them were one hundred twenty priests blowing trumpets.
translation:
  language: tl
  text: At ang lahat ng Levitang mang-aawit—sina Asaf, Heman, Jedutun, pati ang kanilang mga anak na lalaki at mga kapatid—ay nakadamit ng pinong lino at nakatayo sa silangan ng altar,[b] na may mga pompiyang, mga alpa,[a] at mga lira. Kasama nila ang 120 paring humihip ng mga trumpeta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga instrumentong tulad ng alpa” para sa נְבָלִים; hindi tiyak ang eksaktong pagkakaiba ng mga sinaunang instrumentong de-kuwerdas na binanggit dito.
    reason: lexical_alternative
  - marker: b
    text: O “nakatayo sa silangang bahagi ng altar.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַלְוִיִּם הַמְשֹׁרֲרִים
  choice: mga Levitang mang-aawit
  rationale: Likas at malinaw sa modernong Tagalog; pinananatili ang pagkakakilanlan nila bilang mga Levita at ang tungkulin nila bilang mga mang-aawit.
- source_word: לְכֻלָּם
  choice: lahat
  rationale: Ipinakikitang saklaw ang buong pangkat na kasunod na inilalarawan nang hindi pinabibigat ang pangungusap.
- source_word: לְאָסָף לְהֵימָן לִידוּתוּן
  choice: Asaf, Heman, Jedutun
  rationale: Mga pangalang isinalin sa karaniwang anyong madaling bigkasin sa Filipino.
- source_word: וְלִבְנֵיהֶם וְלַאֲחֵיהֶם
  choice: pati ang kanilang mga anak at mga kapatid
  rationale: Pinananatili ang tiyak na mga ugnayang pampamilya sa Hebreo; maaaring kabilang sa 'mga kapatid' ang mga kasapi ng angkan o kapwa lingkod, ngunit hindi ito tahasang nilulutas sa teksto.
- source_word: מְלֻבָּשִׁים בּוּץ
  choice: nakadamit ng pinong lino
  rationale: Tumpak na nagpapahayag ng kasuutan at ng mataas na uri ng linong tinutukoy ng בּוּץ.
- source_word: בִּמְצִלְתַּיִם
  choice: mga pompiyang
  rationale: Karaniwang katawagang Filipino para sa cymbals at angkop sa marangal na kontekstong pangmusika.
- source_word: וּבִנְבָלִים
  choice: mga alpa
  rationale: Ang 'alpa' ang malinaw at nakaugaliang katumbas, habang inilalahad sa talababa ang kawalang-katiyakan sa eksaktong sinaunang instrumento.
- source_word: וְכִנֹּרוֹת
  choice: mga lira
  rationale: Ibinubukod ang כִּנּוֹר sa נֵבֶל alinsunod sa karaniwang makabagong pagkilala sa dalawang instrumentong de-kuwerdas.
- source_word: עֹמְדִים מִזְרָח לַמִּזְבֵּחַ
  choice: nakatayo sa silangan ng altar
  rationale: Pinananatili ang maikli at locative na pahayag ng Hebreo; ang posibleng diwang 'sa silangang bahagi' ay nasa talababa.
- source_word: וְעִמָּהֶם כֹּהֲנִים לְמֵאָה וְעֶשְׂרִים
  choice: Kasama nila ang 120 pari
  rationale: Natural na ayos sa Filipino at tapat sa bilang at sa ugnayang ipinahahayag ng עִם.
- source_word: מחצררים בַּחֲצֹצְרוֹת
  choice: humihip ng mga trumpeta
  rationale: Ang anyong participle ay isinalin bilang nagpapatuloy na kilos; ang magkaugnay na pandiwa at pangngalan ay natural na ipinahayag sa Filipino.
