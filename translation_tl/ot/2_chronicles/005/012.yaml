  source_fidelity: 'Tapat ang salin sa mga pangunahing bahagi ng Hebreo: ang mga Levita na mang-aawit, ang tatlong pangkat na kaugnay nina Asaf, Heman, at Jedutun, ang pinong lino, mga instrumento, ang posisyon sa silangan ng altar, at ang 120 paring tumutugtog ng mga trumpeta. Gayunman, ang "mga anak" sa modernong Filipino ay maaaring sumaklaw sa anumang kasarian, samantalang ang בְּנֵיהֶם ay "kanilang mga anak na lalaki."'
  naturalness: Marangal, malinaw, at natural ang pangungusap. Ang "mga pompiyang," "mga alpa," at "mga lira" ay maayos na magkakahiwalay na katawagan. Natural din ang paglalagay ng mga instrumento bago ang lokasyong "nakatayo."
  terminology: Wasto ang "Levitang mang-aawit," "pinong lino," "altar," at "mga trumpeta." Pinananatili ng "mga kapatid" ang sinadyang di-pagpapasya kung literal na mga kapatid o mga kaugnay sa angkan/pangkat ang tinutukoy, habang ang "mga anak na lalaki" ay nagbibigay ng kinakailangang pagtutukoy ng Hebreo.
