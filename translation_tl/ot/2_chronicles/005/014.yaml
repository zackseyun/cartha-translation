  text: and the priests could not stand to minister because of the cloud[a], for the glory of Yahweh filled the house of God.
translation:
  language: tl
  text: Hindi makatayo ang mga pari upang maglingkod dahil sa ulap, sapagkat pinuno ng kaluwalhatian ni Yahweh ang bahay ng Diyos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “templo ng Diyos.” Literal na “bahay ng Diyos.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יָכְלוּ
  choice: makatayo
  rationale: Kasama ng pagtanggi at ng infinitibong לַעֲמוֹד, ipinahahayag nito na hindi nila kayang tumayo; natural itong naisasama sa Filipino bilang “hindi makatayong.”
- source_word: הַכֹּהֲנִים
  choice: ang mga pari
  rationale: Tuwirang katumbas ng tiyak na pangngalang maramihan para sa mga paring naglilingkod sa templo.
- source_word: לַעֲמוֹד
  choice: tumayo
  rationale: Pinananatili ang kongkretong larawan ng pagtayo nang hindi ipinapasok ang mas tiyak na interpretasyong “manatiling nakatayo.”
- source_word: לְשָׁרֵת
  choice: maglingkod
  rationale: Sa kontekstong pangtemplo, tumutukoy ito sa sagradong paglilingkod ng mga pari; malinaw at natural sa modernong Filipino ang “maglingkod.”
- source_word: מִפְּנֵי
  choice: dahil sa
  rationale: Ipinahahayag dito ng parirala ang dahilan kung bakit hindi makatayong maglingkod ang mga pari.
- source_word: הֶעָנָן
  choice: ang ulap
  rationale: Tuwirang salin ng tiyak na pangngalan, nang walang idinagdag na paliwanag tungkol sa likas ng ulap.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala nito ang paliwanag sa naunang pahayag at pinananatili ang ugnayang sanhi o batayan.
- source_word: מָלֵא
  choice: pinuno
  rationale: Aktibong pandiwa ang Hebreo at ang paksa nito ay “ang kaluwalhatian ni Yahweh”; pinananatili ng “pinuno” ang kilos at ayos na ito.
- source_word: כְבוֹד יְהוָה
  choice: ang kaluwalhatian ni Yahweh
  rationale: Tuwirang inililipat ang construct phrase at pinananatiling paksa ng pandiwang “pinuno.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transliterasyon ito ng personal na pangalang יְהוָה at hindi pagpapalit nito ng isang titulo.
- source_word: בֵּית הָאֱלֹהִים
  choice: ang bahay ng Diyos
  rationale: Pinananatili ang literal na larawang “bahay ng Diyos”; ang “templo ng Diyos” ay wastong kontekstuwal na alternatibo ngunit mas interpretatibo.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Personal na pangalan ang nasa tekstong Hebreo. Ang “Yahweh” ay direktang transliterasyon at hindi tahimik na pinapalitan ang pangalan ng titulong “PANGINOON.”
- issue: Paglalarawan sa presensiya ng Diyos
  choice: Pinuno ng kaluwalhatian ni Yahweh ang bahay ng Diyos
  alternative: Napuno ng kaluwalhatian ni Yahweh ang bahay ng Diyos
  rationale: Ginawang aktibong paksa ang “kaluwalhatian ni Yahweh,” gaya ng Hebreo, nang hindi ipinapaliwanag kung paano nauugnay ang kaluwalhatian sa ulap o sa presensiya ng Diyos.
translation_notes:
  register: Modernong Filipino na may marangal na himig. Ginamit ang “sapagkat” para sa malinaw na paliwanag at “bahay ng Diyos” upang mapanatili ang kongkretong pananalita ng Hebreo. Inilagay ang talababa pagkatapos ng pariralang tinutukoy nito.
