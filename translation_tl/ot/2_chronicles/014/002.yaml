id: 2CH.14.2
reference: 2 Chronicles 14:2
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יָּ֛סַר אֶת מִזְבְּח֥וֹת הַ/נֵּכָ֖ר וְ/הַ/בָּמ֑וֹת וַ/יְשַׁבֵּר֙ אֶת הַ/מַּצֵּב֔וֹת וַ/יְגַדַּ֖ע אֶת הָ/אֲשֵׁרִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/014/002.yaml
  text: He removed the foreign altars and the high places[a], shattered the sacred pillars, and cut down the Asherim.
translation:
  language: tl
  text: Inalis niya ang mga altar ng banyagang pagsamba at ang matataas na lugar ng pagsamba, dinurog ang mga sagradong haligi, at pinutol ang mga Asherim.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga poste ni Ashera.” Ang salitang Hebreo ay tumutukoy sa mga kultikong bagay na kaugnay ng pagsamba kay Ashera.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּסַר
  choice: Inalis niya
  rationale: Ang causative na anyo ng סור ay nangangahulugang alisin o ipaalis. Likas at tuwiran sa modernong Tagalog ang “inalis niya.”
- source_word: מִזְבְּחוֹת הַנֵּכָר
  choice: mga altar ng banyagang pagsamba
  rationale: Ang נֵכָר ay tumutukoy sa banyaga o dayuhan at, sa kontekstong ito, sa pagsambang hindi nararapat sa Israel. Iniiwasan ng saling ito ang maling pahiwatig na banyaga lamang ang pagkakayari o lokasyon ng mga altar.
- source_word: הַבָּמוֹת
  choice: matataas na lugar ng pagsamba
  rationale: Ang בָּמוֹת ay mga kultikong lugar na karaniwang tinatawag na “high places.” Nililinaw ng “lugar ng pagsamba” ang gamit ng mga ito, samantalang pinananatili ng “matataas” ang tradisyonal at konkretong larawan ng salita.
- source_word: וַיְשַׁבֵּר
  choice: dinurog
  rationale: Ipinahihiwatig ng שׁבר ang marahas at tiyak na pagwasak. Ang “dinurog” ay malinaw at masidhi nang hindi nagdaragdag ng paliwanag.
- source_word: הַמַּצֵּבוֹת
  choice: mga sagradong haligi
  rationale: Ang מַצֵּבוֹת ay mga nakatayong bato o haliging ginagamit sa kulto. Ipinakikita ng “sagrado” ang tungkuling panrelihiyon ng mga ito, hindi ang pagsang-ayon sa kanilang kabanalan.
- source_word: וַיְגַדַּע
  choice: pinutol
  rationale: Ang גדע ay nangangahulugang putulin o ibuwal sa pamamagitan ng pagputol, angkop sa malamang na kahoy na mga kultikong bagay.
- source_word: הָאֲשֵׁרִים
  choice: mga Asherim
  rationale: Maaaring tumukoy ang אֲשֵׁרִים sa iba't ibang kultikong bagay na kaugnay ni Ashera. Pinananatili ng transliterasyon ang tiyak na katawagang Hebreo nang hindi ipinapalagay na mga poste lamang ang mga ito.
theological_decisions:
- issue: Pagpapakahulugan sa אֲשֵׁרִים sa konteksto ng repormang panrelihiyon
  choice: mga Asherim
  alternative: mga poste ni Ashera
  rationale: Hindi lubos na tiyak kung ang tinutukoy ay mga posteng kahoy, estilong punongkahoy, o mas malawak na mga sagisag ng kulto ni Ashera. Pinananatili sa pangunahing teksto ang makasaysayang katawagan at inilalagay sa talababa ang karaniwang paliwanag.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang karaniwang salitang “altar,” habang ipinaliwanag sa mismong parirala ang teknikal na konsepto ng בָּמוֹת. Inilipat ang talababa sa “Asherim,” na siyang salitang tinatalakay nito.
