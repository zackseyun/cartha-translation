  text: And he told Judah to seek the LORD, the God of their fathers, and to keep the law and the commandment.
translation:
  language: tl
  text: Sinabi niya sa Juda na hanapin ang PANGINOON, ang Diyos ng kanilang mga ninuno, at sundin ang kautusan at ang utos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִדְרוֹשׁ
  choice: hanapin
  rationale: Tumutukoy sa masikap na paglapit at paghanap sa Diyos; natural sa modernong Tagalog at hindi nililimitahan sa pagtatanong lamang.
- source_word: יְהוָה
  choice: PANGINOON
  rationale: Ginagamit ang nakaugaliang salin para sa banal na pangalang YHWH, na minarkahan sa malalaking titik.
- source_word: אֱלֹהֵי אֲבוֹתֵיהֶם
  choice: ang Diyos ng kanilang mga ninuno
  rationale: Ang אבות ay tumutukoy sa mga ninuno o mga ama ng Israel; mas likas at malinaw sa kasalukuyang Filipino ang “mga ninuno.”
- source_word: וְלַעֲשׂוֹת
  choice: at sundin
  rationale: Bagaman literal na “gawin,” sa kaugnayan sa kautusan at utos ay natural na ipinahahayag sa Filipino bilang “sundin.”
- source_word: הַתּוֹרָה וְהַמִּצְוָה
  choice: ang kautusan at ang utos
  rationale: Pinananatili ang dalawang magkaibang pangngalan at ang isahang anyo ng “utos,” nang hindi pinagsasama ang mga ito.
theological_decisions:
- issue: Pagpapahayag sa banal na pangalang יהוה
  choice: PANGINOON
  alternative: Yahweh
  rationale: Sinusunod ang malawak na tradisyon sa saling Filipino habang ipinakikita sa tipograpiya na ito ang natatanging banal na pangalan.
- issue: Saklaw ng “kautusan at utos”
  choice: Panatilihing magkatambal at isahan ang “utos”
  alternative: “mga kautusan at mga utos” o isang pinagsamang katawagan
  rationale: Pinananatili nito ang pormal na pagkakaiba at bilang sa tekstong Hebreo, nang hindi ipinapaliwanag nang higit sa sinasabi ng talata.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Ginamit ang “Iniutos” para sa matibay na diwa ng ויאמר sa konteksto ng utos ng hari, at iniwasan ang mas kolokyal na pananalita.
