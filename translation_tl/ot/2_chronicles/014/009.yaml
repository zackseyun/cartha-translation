base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/014/009.yaml
  text: And Asa went out before him[b][a], and they drew up for battle in the Valley of Zephathah at Mareshah.
translation:
  language: tl
  text: Lumabas si Asa upang harapin siya[a], at pumuwesto sila para sa labanan[b] sa Lambak ng Zefata sa Maresa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “sa harap niya”; maaari ring “upang salubungin siya” o “laban sa kanya.”
    reason: lexical_alternative
  - marker: b
    text: O “inihanay nila ang kanilang mga kawal para sa labanan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: Lumabas
  rationale: Karaniwang salaysay na anyo ng יצא ang ginamit; ang “lumabas” ay natural at hindi labis na nagpapakahulugang nagmartsa.
- source_word: לְפָנָיו
  choice: upang harapin siya
  rationale: Literal itong “sa harap niya,” ngunit sa kontekstong militar ay tumutukoy sa paglabas ni Asa upang salubungin o harapin ang kalaban. Inilalagay sa talababa ang mas literal na anyo upang mapanatili ang saklaw ng Hebreo.
- source_word: וַיַּעַרְכוּ מִלְחָמָה
  choice: pumuwesto sila para sa labanan
  rationale: Ang ערך kasama ng מִלְחָמָה ay idyomang militar para sa pag-aayos ng mga kawal sa hanay; malinaw at likas sa modernong Filipino ang “pumuwesto ... para sa labanan.”
- source_word: בְּגֵיא
  choice: sa Lambak ng
  rationale: Ang גיא ay lambak o bangin; “Lambak” ang pinakakaraniwan at madaling maunawaang tawag sa heograpikong pangalan.
- source_word: צְפַתָה
  choice: Zefata
  rationale: Isinalin sa baybay-Filipino ang pangalang Hebreo na Ṣəphātāh.
- source_word: לְמָרֵשָׁה
  choice: sa Maresa
  rationale: Ang לְ sa pangalan ng lugar ay nagpapahiwatig ng lokasyon o kaugnayan sa Maresa; ang “sa Maresa” ay maikli at natural, habang maaaring tumukoy sa lugar na malapit o sakop nito.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na marangal ngunit tuwiran. Ginamit ang “harapin” sa pangunahing teksto upang maging malinaw ang kontekstong militar, habang pinanatili sa talababa ang literal at iba pang posibleng diwa. Ang mga pangalang Zefata at Maresa ay binaybay ayon sa karaniwang tunog sa Filipino.
