base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/014/010.yaml
  text: And Asa cried out to Yahweh his God and said[a], “Yahweh, there is none besides you to help between the mighty and the powerless. Help us, Yahweh our God, for we rely on you, and in your name we have come against this multitude. Yahweh our God, you are our God[b]; do not let man prevail against you.”
translation:
  language: tl
  text: At sumigaw si Asa kay Yahweh na kanyang Diyos at sinabi, “Yahweh, walang iba bukod sa iyo na makatutulong, maging makapangyarihan man o walang lakas.[a] Tulungan mo kami, Yahweh, aming Diyos, sapagkat sa iyo kami umaasa, at sa iyong pangalan ay dumating kami laban sa pulutong na ito. Yahweh, ikaw ang aming Diyos; huwag mong hayaang manaig laban sa iyo ang taong mortal.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari rin: “walang iba bukod sa iyo na makatutulong, marami man sila o walang lakas.” Masikip ang pariralang Hebreo at maaaring magbigay-diin sa dami o sa lakas.'
    reason: alternative_reading
  - marker: b
    text: 'Maaari rin: “huwag mong hayaang makapanindigan laban sa iyo ang taong mortal” o “huwag mong hayaang manatiling malakas laban sa iyo ang taong mortal.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: sumigaw
  rationale: Sa konteksto ng apurahang panalangin, ang קרא אל ay panawagan o pagsigaw sa Diyos, hindi simpleng pagsasalita lamang.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ng personal na pangalang “Yahweh” ang Tetragrammaton sa tekstong Hebreo, sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהָיו / אֱלֹהֵינוּ
  choice: kanyang Diyos / aming Diyos
  rationale: Pinananatili nito ang mga hulaping paari at ang personal na wika ng panalangin.
- source_word: אֵין עִמְּךָ לַעְזוֹר
  choice: walang iba maliban sa iyo na makatutulong
  rationale: Ipinahahayag nito ang pagiging bukod-tangi ng tulong ni Yahweh habang kinikilalang masikip at mahirap ang idyomang Hebreo.
- source_word: בֵּין רַב לְאֵין כֹּחַ
  choice: maging sa marami o sa walang lakas
  rationale: Hindi labis na nililinaw ang רַב bilang “malakas” lamang; pinananatili ang posibleng pagtukoy nito sa dami, samantalang ang talababa ay nagtatala ng alternatibong paghahambing batay sa lakas.
- source_word: עָזְרֵנוּ
  choice: Tulungan mo kami
  rationale: Tuwiran, maikli, at natural na katumbas ng pautos na pandiwa na may hulaping unang panauhang maramihan.
- source_word: כִּי עָלֶיךָ נִשְׁעַנּוּ
  choice: sapagkat sa iyo kami umaasa
  rationale: Likas na Filipino ito para sa metaporang literal na “sumandal sa iyo,” at malinaw na naghahayag ng pagtitiwala.
- source_word: וּבְשִׁמְךָ בָאנוּ
  choice: at sa iyong pangalan ay pumarito kami
  rationale: Pinananatili ang biblikal na idyoma ng pagkilos sa ilalim ng awtoridad at pagtitiwala sa Diyos.
- source_word: הֶהָמוֹן הַזֶּה
  choice: napakaraming ito
  rationale: Ipinahahayag ang malaking bilang ng kalabang hukbo nang hindi nagdaragdag ng pangngalang wala sa Hebreo.
- source_word: יְהוָה אֱלֹהֵינוּ אַתָּה
  choice: Yahweh, ikaw ang aming Diyos
  rationale: Ginagawang natural na pangungusap sa Filipino ang mariing at maikling ayos ng Hebreo, “Yahweh aming Diyos, ikaw.”
- source_word: אַל יַעְצֹר עִמְּךָ אֱנוֹשׁ
  choice: huwag mong hayaang manaig laban sa iyo ang taong mortal
  rationale: Ang עצר sa kontekstong pandigma ay maaaring mangahulugang manatiling malakas, makapanindigan, o manaig; ang “taong mortal” ay nagpapanatili sa diwa ng אֱנוֹשׁ.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON / Jehovah
  rationale: Personal na pangalan ang nasa Hebreo; pinananatili ito bilang “Yahweh” at hindi pinapalitan ng titulo.
- issue: Paghahambing sa בֵּין רַב לְאֵין כֹּחַ
  choice: maging sa marami o sa walang lakas
  alternative: sa makapangyarihan man o sa walang lakas
  rationale: Masikip at malabo ang pariralang Hebreo at maaaring tumukoy sa dami o lakas. Pinananatili sa pangunahing teksto ang posibilidad ng dami at inilalahad sa talababa ang alternatibong pagbasa.
- issue: Diwa ng אַל יַעְצֹר עִמְּךָ אֱנוֹשׁ
  choice: huwag mong hayaang manaig laban sa iyo ang taong mortal
  alternative: huwag mong hayaang makapanindigan laban sa iyo ang taong mortal
  rationale: Hindi tiyak ang eksaktong puwersa ng עצר dito. Ang pangunahing salin ay angkop sa panalangin bago ang labanan, habang kinikilala ng talababa ang mas literal na ideya ng pananatiling malakas o pagtindig laban sa Diyos.
- issue: Pangkalahatang isahang אֱנוֹשׁ
  choice: taong mortal
  alternative: sinumang tao / sangkatauhan
  rationale: Pinananatili ang isahang anyo at ang diin ng אֱנוֹשׁ sa kahinaan at mortalidad ng tao, nang hindi nililimitahan ang tinutukoy sa isang partikular na lalaki.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “sumigaw” upang ipakita ang apurahang panalangin, “napakaraming ito” sa halip na mas kolokyal na “sangkatutak,” at “taong mortal” upang mapanatili ang bigat ng אֱנוֹשׁ. Ang lahat ng marker na [a] at [b] ay nasa pangunahing teksto.
