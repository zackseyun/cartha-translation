  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יְהִ֣י לְ/אָסָ֗א חַיִל֮ נֹשֵׂ֣א צִנָּ֣ה וָ/רֹמַח֒ מִֽ/יהוּדָה֙ שְׁלֹ֣שׁ מֵא֣וֹת אֶ֔לֶף וּ/מִ/בִּנְיָמִ֗ן נֹשְׂאֵ֤י מָגֵן֙ וְ/דֹ֣רְכֵי קֶ֔שֶׁת מָאתַ֥יִם וּ/שְׁמוֹנִ֖ים אָ֑לֶף כָּל אֵ֖לֶּה גִּבּ֥וֹרֵי חָֽיִלס־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/014/007.yaml
  text: And Asa had an army of three hundred thousand from Judah bearing large shields and spears[a], and from Benjamin two hundred eighty thousand bearing shields and drawing bows. All these were mighty men of valor.
translation:
  language: tl
  text: May hukbo si Asa na 300,000 mula sa Juda, na may dalang malalaking kalasag at mga sibat, at 280,000 mula sa Benjamin, na may dalang mga kalasag at gumagamit ng mga pana. Lahat ng mga ito ay magigiting na mandirigma.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “magigiting na lalaki” o “malalakas na mandirigma.” Ang Hebreong pariralang גִּבּוֹרֵי חָיִל ay isang nakaugaliang katawagan sa malalakas at magigiting na lalaking kawal.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַיִל
  choice: hukbo
  rationale: Sa konteksto ng talaan ng mga kawal, tumutukoy ito sa organisadong puwersang militar ni Asa, hindi sa kayamanan o abstraktong lakas.
- source_word: נֹשֵׂא צִנָּה וָרֹמַח
  choice: may dalang malalaking kalasag at mga sibat
  rationale: Ipinahihiwatig ng participle na nasasandatahan ang mga kawal. Ang צִנָּה ay malaking pananggalang sa katawan, kaya tinukoy itong “malalaking kalasag” upang maiba sa מָגֵן sa kasunod na sugnay.
- source_word: מִיהוּדָה
  choice: mula sa Juda
  rationale: Pinananatili ang diwa ng pinagmulan o kinabibilangang lipi na ipinahahayag ng מִן.
- source_word: שְׁלֹשׁ מֵאוֹת אֶלֶף
  choice: 300,000
  rationale: Tuwirang paglalahad ng bilang sa paraang madaling basahin sa modernong Filipino.
- source_word: נֹשְׂאֵי מָגֵן
  choice: may dalang mga kalasag
  rationale: Ang מָגֵן ay kalasag, malamang na mas maliit kaysa צִנָּה; ang hindi paglalagay ng “malaki” rito ay nagpapanatili sa pagkakaiba ng dalawang terminong Hebreo.
- source_word: וְדֹרְכֵי קֶשֶׁת
  choice: gumagamit ng mga pana
  rationale: Ang idyoma ay literal na pagyapak o pagbaluktot sa pana upang ihanda at gamitin ito. Ang “gumagamit ng mga pana” ay natural at malinaw sa Filipino nang hindi nagpapahiwatig na pana lamang ang kanilang hinihila sa bawat sandali.
- source_word: מָאתַיִם וּשְׁמוֹנִים אָלֶף
  choice: 280,000
  rationale: Tuwirang paglalahad ng bilang sa kontemporaryong anyo.
- source_word: כָּל אֵלֶּה
  choice: Lahat ng mga ito
  rationale: Natural na pananalitang Filipino para sa pangwakas na pagbubuod.
- source_word: גִּבּוֹרֵי חָיִל
  choice: magigiting na mandirigma
  rationale: Ang nakaugaliang pariralang militar ay tumutukoy sa malalakas, matapang, at bihasang lalaking mandirigma. Naipahahayag ng “magigiting na mandirigma” ang pangunahing diwa sa natural na modernong Filipino.
theological_decisions:
- issue: Kasariang ipinahihiwatig ng militar na pariralang גִּבּוֹרֵי חָיִל
  choice: magigiting na mandirigma
  alternative: magigiting na lalaki / makapangyarihang mga lalaking mandirigma
  rationale: Bagaman panlalaki ang anyong Hebreo at mga lalaking kawal ang tinutukoy sa sinaunang senso militar, ang salitang “mandirigma” sa Filipino ay likas na hindi minamarkahan ang kasarian. Hindi nito itinatanggi ang historikal na reperensiya, at naiiwasan nito ang mabigat at di-likas na parirala. Nililinaw ng talababa ang posibleng mas tahasang panlalaking salin.
translation_notes:
  register: Modernong Filipino na malinaw at marangal, na may payak na estrukturang angkop sa pagbasa ng karaniwang mambabasa. Ginamit ang mga numerong digit para madaling makita ang laki ng bawat pangkat. Pinanatili ang pagkakaiba ng צִנָּה at מָגֵן sa pamamagitan ng “malalaking kalasag” at “mga kalasag.”
