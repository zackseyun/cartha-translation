- from: Hinabol sila ni Asa at ng mga taong kasama niya hanggang sa Gerar. Nabuwal ang mga Cusita[a] hanggang sa wala nang natirang buhay sa kanila, sapagkat nalupig sila sa harap ni Yahweh at ng hukbo niya.[b] Pagkatapos, napakaraming samsam ang kanilang dinala.
  to: Hinabol sila ni Asa at ng mga taong kasama niya hanggang sa Gerar. Nabuwal ang mga Cusita[a] hanggang sa wala nang natirang buhay sa kanila, sapagkat nalupig sila sa harap ni Yahweh at ng hukbo niya.[b] Pagkatapos, tinangay nila ang napakaraming samsam.
