base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/014/012.yaml
  text: Asa and the people who were with him pursued them as far as Gerar[a], and the Cushites fell until none remained alive, for they were shattered before Yahweh and before his army[b]. Then they carried off a very great amount of plunder.
translation:
  language: tl
  text: Hinabol sila ni Asa at ng mga taong kasama niya hanggang sa Gerar. Nabuwal ang mga Cusita[a] hanggang sa wala nang natirang buhay sa kanila, sapagkat nalupig sila sa harap ni Yahweh at ng hukbo niya.[b] Pagkatapos, tinangay nila ang napakaraming samsam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga Etiopiano.” Ang Hebreo ay tumutukoy sa mga tao ng Cush.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isaling “kampo niya.” Maaaring tumukoy ang panghalip na “niya” kay Asa, bagaman inuunawa ito ng ilan bilang tumutukoy kay Yahweh.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּרְדְּפֵם
  choice: Hinabol sila
  rationale: Likas at malinaw na salin ng רדף sa konteksto ng pagtugis sa digmaan.
- source_word: עַד לִגְרָר
  choice: hanggang sa Gerar
  rationale: Ipinapahayag ng עַד ang hangganan o lawak ng pagtugis.
- source_word: מִכּוּשִׁים
  choice: mga Cusita
  rationale: Pinananatili ang etnogeograpikong tawag na Cush sa halip na gamitin ang posibleng anakronistikong “mga Etiopiano.”
- source_word: לְאֵין לָהֶם מִחְיָה
  choice: hanggang sa wala nang natirang buhay sa kanila
  rationale: Malapit sa matinding pahayag ng Hebreo tungkol sa kawalan ng natirang buhay, nang hindi ito pinahihina.
- source_word: נִשְׁבְּרוּ
  choice: nalupig sila
  rationale: Sa konteksto ng digmaan, ipinahihiwatig ng passive na שבר ang ganap at matinding pagkatalo; mas natural sa Filipino ang “nalupig” kaysa literal na “binasag.”
- source_word: וְלִפְנֵי מַחֲנֵהוּ
  choice: at ng hukbo niya
  rationale: Ang מַחֲנֶה ay maaaring tumukoy sa kampo o hukbo; sa aktuwal na labanan, malinaw at natural ang “hukbo,” habang pinananatili sa talababa ang ibang posibilidad.
- source_word: וַיִּשְׂאוּ שָׁלָל הַרְבֵּה מְאֹד
  choice: napakaraming samsam ang kanilang dinala
  rationale: Natural na Filipino para sa pagdadala ng napakaraming ari-ariang nasamsam, at pinananatili ang diin ng הַרְבֵּה מְאֹד.
theological_decisions:
- issue: Pagsasalin sa pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Ginamit ang personal na pangalang tipan na Yahweh upang katawanin nang tuwiran ang Tetragrammaton.
- issue: Tinutukoy ng hulapi sa מַחֲנֵהוּ
  choice: hukbo niya, na pangunahing nauunawaang hukbo ni Asa
  alternative: kampo niya; hukbo ni Yahweh
  rationale: Sa daloy ng salaysay, si Asa ang likas na pinakamalapit na tinutukoy, ngunit hindi ganap na nililinaw ng Hebreo ang reperente. Kaya hindi ito tahasang ipinangalan sa pangunahing teksto at inilalahad sa talababa ang tunay na kalabuan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “samsam” bilang pamilyar na terminong biblikal at militar, at iniwasan ang sobrang literal ngunit di-likas na mga parirala. Inilagay ang bawat marker sa mismong salitang may kaugnayan sa talababa.
