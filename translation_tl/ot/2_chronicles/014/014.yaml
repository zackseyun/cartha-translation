base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/014/014.yaml
  text: They also struck the tents of livestock[a], and they carried off sheep in abundance and camels[c][b]. Then they returned to Jerusalem.
translation:
  language: tl
  text: Sinalakay rin nila ang mga toldang kaugnay ng mga alagang hayop[a], at tinangay nila ang napakaraming kawan[b] at mga kamelyo[c]. Pagkatapos, bumalik sila sa Jerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “mga tolda ng alagang hayop.” Maaaring tumukoy ang parirala sa mga kampong pastoral o sa mga kampo ng mga tagapag-alaga ng kawan.
    reason: lexical_alternative
  - marker: b
    text: Ang salitang Hebreo ay maaaring tumukoy sa “mga tupa,” sa “mga kawan,” o nang mas malawak sa maliliit na alagang hayop gaya ng mga tupa at kambing.
    reason: lexical_alternative
  - marker: c
    text: Ang pandiwang isinaling “tinangay” ay maaari ring mangahulugang “binihag.” Dahil mga hayop ang tinutukoy rito, ang diwa ay inagaw at dinala ang mga ito bilang samsam.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: din nila
  rationale: Ipinahahayag ang dagdag na kilos na kaugnay ng naunang salaysay; likas sa Tagalog na ilagay ang “din” kasunod ng paksa.
- source_word: אָהֳלֵי מִקְנֶה
  choice: mga tolda ng mga tagapag-alaga ng hayop
  rationale: Ang literal na “mga tolda ng hayop” ay maaaring magmukhang mga toldang para mismo sa hayop. Ipinahahayag ng salin ang malamang na diwa ng mga kampong pastoral habang nilalagyan ng talababa ang literal at masaklaw na pagbasa.
- source_word: הִכּוּ
  choice: sinalakay
  rationale: Sa kontekstong militar, ang נכה ay tumutukoy sa paglusob o pananakit sa mga kampo; mas natural dito ang “sinalakay” kaysa literal na “hinampas.”
- source_word: וַיִּשְׁבּוּ
  choice: tinangay
  rationale: Bagaman karaniwang nangangahulugang “binihag,” mga hayop ang tuwirang layon kaya ang diwa ay pag-agaw at pagdala sa mga ito bilang samsam.
- source_word: צֹאן
  choice: kawan
  rationale: Ang צֹאן ay kolektibong katawagan sa maliliit na alagang hayop, karaniwang mga tupa at kambing. Pinananatili ng “kawan” ang lawak ng kahulugan nang hindi ito nililimitahan sa tupa lamang.
- source_word: לָרֹב
  choice: napakaraming
  rationale: Natural na ipinahahayag sa modernong Tagalog ang napakalaking dami ng nasamsam.
- source_word: וּגְמַלִּים
  choice: at mga kamelyo
  rationale: Tuwirang katumbas ng pangngalan at pang-ugnay sa Hebreo.
- source_word: וַיָּשֻׁבוּ יְרוּשָׁלִָם
  choice: Pagkatapos, bumalik sila sa Jerusalem
  rationale: Malinaw na ipinakikita ang kasunod na pangyayari sa salaysay nang hindi binabago ang nilalaman.
