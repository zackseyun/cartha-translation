translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “sinalakay” para sa kontekstong militar, “tinangay” para sa mga hayop na kinuhang samsam, at “kawan” upang mapanatili ang masaklaw na kahulugan ng צֹאן. Ang mga talababa ay nagpapanatili sa tunay na leksikal na kalabuan.
