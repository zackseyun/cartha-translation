  text: וַ/יֹּ֨אמֶר לִֽ/יהוּדָ֜ה נִבְנֶ֣ה אֶת הֶ/עָרִ֣ים הָ/אֵ֗לֶּה וְ/נָסֵ֨ב חוֹמָ֣ה וּ/מִגְדָּלִים֮ דְּלָתַ֣יִם וּ/בְרִיחִים֒ עוֹדֶ֨/נּוּ הָ/אָ֜רֶץ לְ/פָנֵ֗י/נוּ כִּ֤י דָרַ֨שְׁנוּ֙ אֶת יְהוָ֣ה אֱלֹהֵ֔י/נוּ דָּרַ֕שְׁנוּ וַ/יָּ֥נַֽח לָ֖/נוּ מִ/סָּבִ֑יב וַ/יִּבְנ֖וּ וַ/יַּצְלִֽיחוּ׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/014/006.yaml
  text: And he said to Judah[a], “Let us build these cities and surround them with walls and towers, gates and bars, while the land is still before us, because we have sought Yahweh our God. We have sought him, and he has given us rest on every side.” So they built and prospered.
translation:
  language: tl
  text: Sinabi niya sa Juda, “Itayo natin ang mga lungsod na ito at palibutan ang mga ito ng mga pader at tore, mga pintuang-bayan at mga trangka. Nasa harapan pa natin ang lupain[a] sapagkat hinanap natin si Yahweh na ating Diyos. Hinanap natin siya, at binigyan niya tayo ng kapahingahan sa lahat ng panig.” Kaya nagtayo sila at umunlad.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “sapagkat nasa harapan pa natin ang lupain.” Maaari ring idiin ng pananalita na bukas pa ang pagkakataon o wala pang hadlang sa kanilang paggamit sa lupain.
    reason: Pinahihintulutan ng pagkakaugnay ng mga sugnay at ng idyomang Hebreo ang bahagyang naiibang pagbasa sa lohikal na diin.
lexical_decisions:
- source_word: וַיֹּאמֶר לִיהוּדָה
  choice: Sinabi niya sa Juda
  rationale: Ang pangalang Juda ay ginagamit na metonimiya para sa mga mamamayan o kaharian. Pinananatili ng salin ang anyong Hebreo nang hindi nagdaragdag ng paliwanag sa pangunahing teksto.
- source_word: נִבְנֶה
  choice: Itayo natin
  rationale: Ang unang panauhang maramihang cohortative ay nagpapahayag ng paghimok o sama-samang pagpapasiya. Hindi idinagdag ang di-tiyak na diwang ‘muling itayo.’
- source_word: הֶעָרִים הָאֵלֶּה
  choice: ang mga lungsod na ito
  rationale: Ang עָרִים ay tumutukoy sa mga pamayanang urban, at ang konteksto ay tahasang tungkol sa pagpapatibay sa mga ito.
- source_word: וְנָסֵב
  choice: at palibutan ang mga ito ng
  rationale: Ang Hiphil ng סבב ay nangangahulugang paligiran; nilinaw ng panghalip na ang mga lungsod ang palilibutan ng kasunod na mga tanggulan.
- source_word: חוֹמָה וּמִגְדָּלִים דְּלָתַיִם וּבְרִיחִים
  choice: mga pader at tore, mga pintuang-bayan at mga halang
  rationale: Ang talaan ay mga sangkap ng tanggulan. Ang ‘pintuang-bayan’ ay mas tiyak kaysa ‘pinto’ sa konteksto ng lungsod, at ang ‘halang’ ay ang pamigil na ipinapasok upang isara at patibayin ang mga iyon.
- source_word: עוֹדֶנּוּ הָאָרֶץ לְפָנֵינוּ
  choice: Nasa harapan pa natin ang lupain
  rationale: Pinananatili nito ang literal na idyoma at ang diwa ng nagpapatuloy na pagkakataon o malayang pagkilos, nang hindi tahasang ipinapakahulugang ‘mapayapa’ o ‘walang kaaway.’
- source_word: כִּי דָרַשְׁנוּ אֶת יְהוָה אֱלֹהֵינוּ
  choice: sapagkat hinanap natin si Yahweh na ating Diyos
  rationale: Ang דרשׁ kapag Diyos ang layon ay higit sa pagtatanong lamang at maaaring tumukoy sa taimtim na paghahanap sa kanya at pag-asa sa kanya.
- source_word: דָּרַשְׁנוּ
  choice: Hinanap natin siya
  rationale: Pinanatili ang mariing pag-uulit sa Hebreo; natural na tumutukoy ang ‘siya’ kay Yahweh sa naunang pangungusap.
- source_word: וַיָּנַח לָנוּ מִסָּבִיב
  choice: at binigyan niya tayo ng kapahingahan sa lahat ng panig
  rationale: Isinasalin nito ang pagbibigay ng pahinga o ginhawa sa buong paligid nang hindi nagdaragdag ng mga kaaway na hindi tahasang binanggit.
- source_word: וַיִּבְנוּ וַיַּצְלִיחוּ
  choice: Kaya nagtayo sila at nagtagumpay
  rationale: 'Ang huling dalawang pandiwa ay nag-uulat ng kinalabasan: isinagawa nila ang pagtatayo at naging matagumpay sila.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang transliterasyon ng personal na pangalang Hebreo sa halip na palitan ito ng isang titulo.
theological_decisions:
- issue: Paglalarawan sa paghahanap kay Yahweh at sa ibinigay niyang kapahingahan
  choice: 'Pinanatili ang ugnayang sanhi: hinanap nila si Yahweh, at binigyan niya sila ng kapahingahan.'
  alternative: Gawing payak na pagtatanong sa Diyos ang דרשׁ o tukuyin nang tahasan na kapahingahan ito mula sa mga kaaway.
  rationale: May debosyonal at tipanang lawak ang דרשׁ, samantalang hindi pinangalanan sa sugnay ang mga kaaway. Iniiwasan ng salin ang pagpapakitid o pagpapalawak na lampas sa teksto.
- issue: Pagbanggit sa banal na pangalan na יְהוָה
  choice: Yahweh
  alternative: Panginoon o Jehovah
  rationale: Ang pinagmulang teksto ay gumagamit ng Tetragrammaton bilang personal na pangalan; pinananatili ito sa transliterasyong malapit sa karaniwang rekonstruksiyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘lungsod,’ ‘pintuang-bayan,’ at ‘halang’ upang maging tiyak ang konteksto ng pagpapatibay, habang pinanatili ang pag-uulit at bahagyang kalabuan ng idyomang ‘nasa harapan pa natin ang lupain.’
