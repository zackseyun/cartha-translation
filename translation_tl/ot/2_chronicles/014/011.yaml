id: 2CH.14.11
reference: 2 Chronicles 14:11
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יִּגֹּ֤ף יְהוָה֙ אֶת הַ/כּוּשִׁ֔ים לִ/פְנֵ֥י אָסָ֖א וְ/לִ/פְנֵ֣י יְהוּדָ֑ה וַ/יָּנֻ֖סוּ הַ/כּוּשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/014/011.yaml
  text: And Yahweh struck down the Cushites before Asa and before Judah[a], and the Cushites fled.
translation:
  language: tl
  text: At nilupig ni Yahweh ang mga Cusita[a] sa harap ni Asa at ng Juda, at tumakas ang mga Cusita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga Etiope.” Ang katawagang etniko sa Hebreo ay “mga Cusita.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגֹּף
  choice: nilupig
  rationale: Sa konteksto ng labanan, ang נָגַף ay tumutukoy sa matinding pananakit o pagkatalo sa kaaway. Ang “nilupig” ay likas at marangal sa modernong Tagalog at pinananatili ang lakas ng kilos nang hindi gumagamit ng lipas na pananalita.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ng “Yahweh” ang banal na pangalang יהוה sa halip na palitan ito ng isang titulo.
- source_word: הַכּוּשִׁים
  choice: mga Cusita
  rationale: Pinananatili ng “mga Cusita” ang Hebreong katawagang etniko at hindi ito agad itinutumbas sa mas huling heograpikong katawagang “mga Etiope.”
- source_word: לִפְנֵי
  choice: sa harap ni … at ng …
  rationale: Sa ulat ng labanan, ipinahihiwatig ng לִפְנֵי na natalo ang mga Cusita sa harap o sa pagsulong nina Asa at Juda. Pinananatili ng saling ito ang larawan at pagkakabuo ng Hebreo.
- source_word: אָסָא
  choice: Asa
  rationale: Karaniwang anyo sa Tagalog ng pangalang pantangi.
- source_word: יְהוּדָה
  choice: Juda
  rationale: Dito ay tumutukoy ang pangalan sa kaharian o sambayanan ng Juda; hinahayaan ng “Juda” na linawin ito ng konteksto.
- source_word: וַיָּנֻסוּ
  choice: tumakas
  rationale: Tuwirang ipinahahayag ng נוּס ang pagtakas mula sa labanan; malinaw at natural ang “tumakas.”
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יהוה
  choice: Yahweh
  alternative: Jehovah
  rationale: Personal na pangalan ng Diyos ang nasa tekstong Hebreo, kaya pinanatili itong “Yahweh” sa halip na palitan ng titulo.
translation_notes:
  register: Makabago, malinaw, at marangal na salaysay sa Filipino. Ginamit ang “nilupig” upang maipahayag ang puwersa ng kilos sa konteksto ng digmaan, at pinanatili ang Hebreong katawagang etniko sa pangunahing teksto.
