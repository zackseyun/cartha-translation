  text: וַ/יָּ֨סַר֙ מִ/כָּל עָרֵ֣י יְהוּדָ֔ה אֶת הַ/בָּמ֖וֹת וְ/אֶת הַֽ/חַמָּנִ֑ים וַ/תִּשְׁקֹ֥ט הַ/מַּמְלָכָ֖ה לְ/פָנָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/014/004.yaml
  text: He removed the high places and the incense altars from all the cities of Judah[a], and the kingdom had rest before him.
translation:
  language: tl
  text: Inalis niya sa lahat ng lungsod ng Juda ang mga mataas na lugar ng pagsamba at ang mga altar ng insenso[a]. Naging payapa ang kaharian sa panahon ng kanyang paghahari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O maaaring “mga haligi ng araw.” Ang salitang Hebreo ay tumutukoy sa mga bagay na ginagamit sa pagsamba at, sa ilang konteksto, maaaring kaugnay ng pagsamba sa araw.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּסַר
  choice: Inalis niya
  rationale: Tuwirang ipinapahayag ng anyong Hiphil ng סור ang pagpapalis o pagtanggal; natural at hindi labis na nagpapakahulugan ang “inalis niya.”
- source_word: מִכָּל עָרֵי יְהוּדָה
  choice: sa lahat ng lungsod ng Juda
  rationale: Sa Filipino, likas na ipinahihiwatig ng “inalis ... sa” ang pinagmulan ng mga bagay na inalis, habang pinananatili ang buong saklaw ng reporma.
- source_word: הַבָּמוֹת
  choice: ang matataas na sambahan
  rationale: Ang בָּמוֹת ay mga pook ng pagsamba na karaniwang nasa mataas na lugar; mas malinaw ito sa karaniwang mambabasa kaysa sa literal ngunit malabong “matataas na lugar.”
- source_word: הַחַמָּנִים
  choice: ang mga altar ng insenso
  rationale: Posibleng tumukoy ang mahirap na terminong ito sa mga kultikong bagay na kaugnay ng insenso, ngunit pinananatili sa talababa ang posibleng kaugnayan nito sa pagsamba sa araw.
- source_word: וַתִּשְׁקֹט
  choice: naging payapa
  rationale: Ipinapahayag ng שקט ang pagiging tahimik, walang kaguluhan, o panatag; idiomatiko ang “naging payapa” para sa isang kaharian.
- source_word: הַמַּמְלָכָה
  choice: ang kaharian
  rationale: Direkta at karaniwang katumbas ito ng מַמְלָכָה.
- source_word: לְפָנָיו
  choice: sa ilalim ng pamamahala niya
  rationale: Bagaman literal na “sa harap niya,” ang kontekstuwal na diwa ay ang katahimikan ng kaharian sa panahon o sa ilalim ng paghahari ni Asa; ang literal na anyo ay magiging malabo sa modernong Filipino.
theological_decisions:
- issue: Uri ng mga bagay na inalis sa reporma ni Asa
  choice: Isinalin ang בָּמוֹת bilang mga kultikong sambahan at ang חַמָּנִים bilang mga altar ng insenso, nang hindi nagdaragdag ng mas tiyak na teolohikal na paliwanag sa pangunahing teksto.
  alternative: Maaaring tukuyin ang חַמָּנִים bilang mga haligi ng araw o mga kultikong bagay na kaugnay ng pagsamba sa araw.
  rationale: Malinaw na mga lugar at kagamitang panrelihiyon ang inalis, ngunit hindi tiyak ang eksaktong anyo at kaugnayan ng חַמָּנִים; kaya inilalahad ang alternatibo sa talababa sa halip na gawing tiyak ang pinagtatalunang kahulugan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “matataas na sambahan” upang maipakita ang kultikong kahulugan ng בָּמוֹת, at ginawang idiomatiko ang לְפָנָיו bilang “sa ilalim ng pamamahala niya.”
