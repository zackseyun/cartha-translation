  text: וַ/יִּ֛בֶן עָרֵ֥י מְצוּרָ֖ה בִּ/יהוּדָ֑ה כִּֽי שָׁקְטָ֣ה הָ/אָ֗רֶץ וְ/אֵין עִמּ֤/וֹ מִלְחָמָה֙ בַּ/שָּׁנִ֣ים הָ/אֵ֔לֶּה כִּֽי הֵנִ֥יחַ יְהוָ֖ה לֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/014/005.yaml
  text: He built fortified cities in Judah[a], because the land was quiet and there was no war with him in those years, because Yahweh gave him rest.
translation:
  language: tl
  text: Nagtayo siya ng mga lungsod na may tanggulan sa Juda, sapagkat tahimik ang lupain at wala siyang digmaan[a] sa mga taong iyon, sapagkat binigyan siya ni Yahweh ng kapahingahan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “walang digmaang laban sa kanya.” Maaaring tumukoy nang mas pangkalahatan ang idyomang Hebreo sa kawalan ng digmaang kinasasangkutan ni Asa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶן
  choice: Nagtayo siya
  rationale: Ang wayyiqtol ng בנה ay nagsasalaysay ng ginawa ni Asa. Likas sa makabagong Tagalog ang payak na pangnagdaan nang hindi isinasalin nang hiwalay ang panimulang וַ.
- source_word: עָרֵי מְצוּרָה
  choice: mga lungsod na may tanggulan
  rationale: Ipinapahayag ng pariralang konstrakto ang mga lungsod na may depensibong kuta o fortification. Malinaw at natural ito nang hindi ipinahihiwatig na pinatibay lamang ni Asa ang dati nang mga lungsod.
- source_word: בִּיהוּדָה
  choice: sa Juda
  rationale: Lokasyong tinutukoy ng pang-ukol בְּ at ng pangalang Juda.
- source_word: שָׁקְטָה הָאָרֶץ
  choice: tahimik ang lupain
  rationale: Pinananatili ang larawan ng שׁקט bilang katahimikan o kawalan ng kaguluhan, sa halip na gawing tahasang politikal na “mapayapa.”
- source_word: וְאֵין עִמּוֹ מִלְחָמָה
  choice: wala siyang digmaan
  rationale: Natural na Tagalog para sa kawalan ng digmaang kinasasangkutan o kinakaharap ni Asa. Hindi nito labis na nililimitahan ang parirala sa digmaang tuwirang inilunsad laban sa kanya; ang posibleng mas tiyak na pagbasa ay inilagay sa talababa.
- source_word: בַּשָּׁנִים הָאֵלֶּה
  choice: nang mga taong iyon
  rationale: Natural na panandang temporal sa salaysay para sa panahong tinutukoy.
- source_word: הֵנִיחַ
  choice: binigyan ... ng kapahingahan
  rationale: Ang Hiphil ng נוח ay nagpapahayag ng pagbibigay o pagkakaloob ng pahinga mula sa kaguluhan at digmaan. Pinananatili ng “kapahingahan” ang mahalagang temang teolohikal ng banal na pagkakaloob ng katiwasayan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasatitik ang personal na pangalang banal na יְהוָה sa halip na palitan ito ng isang titulo.
theological_decisions:
- issue: Paglalapat ng katahimikan at kapahingahan
  choice: Ang lupain ay “tahimik,” at si Yahweh ang “nagbigay sa kanya ng kapahingahan.”
  alternative: Isalin ang dalawang pahayag sa iisang salitang “kapayapaan.”
  rationale: Pinananatili ang magkaugnay ngunit hindi lubos na magkaparehong diwa ng שׁקט at נוח, pati ang hayagang pagkilos ni Yahweh bilang pinagmulan ng kapahingahan.
- issue: Pag-render sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Nasa Hebreong teksto ang Tetragrammaton bilang personal na pangalan; ang “Yahweh” ay tuwirang transliterasyon at hindi pamalit na titulo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang magkaugnay na mga larawang “tahimik” at “kapahingahan,” at inilagay ang talababa sa mismong pariralang may leksikal na kalabuan.
