id: 2CH.14.1
reference: 2 Chronicles 14:1
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יַּ֤עַשׂ אָסָא֙ הַ/טּ֣וֹב וְ/הַ/יָּשָׁ֔ר בְּ/עֵינֵ֖י יְהוָ֥ה אֱלֹהָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/014/001.yaml
  text: Asa did what was good and right in the eyes of Yahweh his God[a].
translation:
  language: tl
  text: Ginawa ni Asa ang mabuti at tama sa paningin ni Yahweh na kanyang Diyos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal na Hebreo, “sa mga mata ni Yahweh,” isang idyomang nangangahulugang “sa paningin o paghatol ni Yahweh.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Ginawa
  rationale: Sa ganitong pormulang sumusuri sa asal, ang עשה ay tumutukoy sa paggawa o pagsasagawa; natural sa Tagalog ang “ginawa” kasunod ng “ang mabuti at tama.”
- source_word: אָסָא
  choice: Asa
  rationale: Isinalin sa karaniwang anyo ng pangalang pantangi sa Tagalog.
- source_word: הַטּוֹב
  choice: ang mabuti
  rationale: Ang may-artikulong pang-uri pagkatapos ng עשה ay gumaganap bilang layon at tumutukoy sa mabuting asal o gawain.
- source_word: וְהַיָּשָׁר
  choice: at tama
  rationale: Sa kontekstong etikal, ang יָשָׁר ay nangangahulugang matuwid o tama; “tama” ang natural na katambal ng “mabuti” sa makabagong Tagalog.
- source_word: בְּעֵינֵי
  choice: sa paningin ni
  rationale: Pinananatili nito ang metaporang Hebreo habang malinaw na ipinahihiwatig ang pagtatasa o paghatol mula sa pananaw ng Diyos.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ng transliterasyon ang banal na pangalang יהוה sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהָיו
  choice: na kanyang Diyos
  rationale: Bagaman anyong maramihan ang אֱלֹהִים, isahan ang kahulugan nito rito at tumutukoy sa Diyos ni Asa. Nililinaw ng “na kanyang Diyos” na ang pariralang ito ay tumutukoy kay Yahweh.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Personal na pangalan ang nasa tekstong Hebreo, kaya pinananatili itong pangalan sa pamamagitan ng transliterasyong “Yahweh,” nang hindi pinapalitan ng titulo.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang metapora ng “paningin” ngunit iniwasan ang mas salitang-salitang “sa mga mata,” na hindi gaanong natural sa Tagalog.
