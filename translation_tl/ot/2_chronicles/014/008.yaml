base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/014/008.yaml
  text: Zerah the Cushite came out against them with an army of a thousand thousands and three hundred chariots[b][a], and he came as far as Mareshah.
translation:
  language: tl
  text: Lumabas laban sa kanila si Zera na Cusita[a], kasama ang hukbong may bilang na isang libong libo[b] at tatlong daang karwahe. Nakarating siya hanggang sa Maresa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “Cusita” ay katawagang etnogeograpiko sa Hebreo; tradisyonal na “Etiope.”
    reason: lexical_alternative
  - marker: b
    text: O “isang milyon.” Literal sa Hebreo, “isang libong libo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא אֲלֵיהֶם
  choice: Lumabas laban sa kanila
  rationale: Sa salaysay ng digmaan, ang יָצָא kasunod ng אֶל ay tumutukoy sa paglabas upang sumalakay. Pinananatili ng salin ang larawan ng paglabas at nililinaw ang mapanlabang diwa ng parirala.
- source_word: זֶרַח הַכּוּשִׁי
  choice: si Zera na Cusita
  rationale: Isinasalin ang pangalang זֶרַח bilang “Zera” at pinananatili ang etnogeograpikong katawagang כּוּשִׁי bilang “Cusita,” sa halip na ipakahulugan agad bilang “Etiope.”
- source_word: בְּחַיִל
  choice: kasama ang hukbong
  rationale: Sa kontekstong militar, ang חַיִל ay isang hukbo o puwersang pandigma; “hukbo” ang malinaw at likas na katumbas sa Filipino.
- source_word: אֶלֶף אֲלָפִים
  choice: isang libong libo
  rationale: Pinananatili nito ang literal at di-pangkaraniwang anyo ng Hebreo, sa halip na tahasang gawing “isang milyon,” upang hindi mawala ang posibleng retorikal o kumbensiyonal na gamit ng napakalaking bilang.
- source_word: וּמַרְכָּבוֹת שְׁלֹשׁ מֵאוֹת
  choice: at tatlong daang karwahe
  rationale: Tuwirang isinasalin ang bilang at ang מַרְכָּבוֹת bilang mga karwaheng pandigma; sapat ang “karwahe” sa konteksto.
- source_word: וַיָּבֹא עַד מָרֵשָׁה
  choice: Nakarating siya hanggang Maresa
  rationale: Ipinahahayag ng עַד ang pag-abot hanggang sa isang pook. Ang “hanggang Maresa” ay nagpapanatili ng hangganang diwa nito.
