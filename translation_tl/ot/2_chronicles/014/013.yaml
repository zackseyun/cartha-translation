  text: וַ/יַּכּ֗וּ אֵ֤ת כָּל הֶֽ/עָרִים֙ סְבִיב֣וֹת גְּרָ֔ר כִּי הָיָ֥ה פַֽחַד יְהוָ֖ה עֲלֵי/הֶ֑ם וַ/יָּבֹ֨זּוּ֙ אֶת כָּל הֶ֣/עָרִ֔ים כִּֽי בִזָּ֥ה רַבָּ֖ה הָיְתָ֥ה בָ/הֶֽם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/014/013.yaml
  text: And they struck down all the cities around Gerar, for the terror of Yahweh was upon them. And they plundered all the cities, for there was much spoil in them.
translation:
  language: tl
  text: Nilupig nila ang lahat ng lungsod sa palibot ng Gerar, sapagkat sumapit sa kanila ang sindak ni Yahweh. Sinamsaman nila ang lahat ng lungsod, sapagkat napakaraming samsam sa mga iyon.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּכּוּ
  choice: nilupig nila
  rationale: Sa kontekstong militar, ang hiphil ng נכה ay tumutukoy sa marahas at mapagpasyang paggapi. Mas likas sa modernong Tagalog ang “nilupig” kaysa literal na “hinampas,” at hindi nito ipinapalagay na mismong mga gusali ang pinatay.
- source_word: כָּל הֶעָרִים סְבִיבוֹת גְּרָר
  choice: ang lahat ng lungsod sa palibot ng Gerar
  rationale: Tuwirang ipinapahayag ang kabuuan at heograpikong ugnayan; ang “lungsod” ay angkop sa salaysay ng kampanya.
- source_word: פַּחַד יְהוָה
  choice: ang sindak mula kay Yahweh
  rationale: Ang פַּחַד ay matinding takot o sindak, hindi mapitagang pagkatakot. Ang “mula kay” ay natural na nagpapahayag na ang sindak ay dulot ni Yahweh, gaya ng hinihingi ng konteksto.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang kinakatawan ng Tetragrammaton sa halip na palitan ito ng isang titulo.
- source_word: עֲלֵיהֶם
  choice: sumakanila
  rationale: Isang marangal at maikling katumbas ng kalagayang ‘nasa ibabaw nila’ o ‘dumapo sa kanila,’ na tumutukoy sa mga naninirahan o tagapagtanggol ng mga lungsod.
- source_word: וַיָּבֹזּוּ
  choice: sinamsaman nila
  rationale: Ang בזז ay pagkuha ng mga ari-arian bilang samsam sa digmaan; malinaw at likas ang pandiwang “sinamsaman.”
- source_word: בִּזָּה רַבָּה
  choice: napakaraming samsam
  rationale: Ipinahahayag nito ang malaking dami ng mga ari-ariang maaaring kunin bilang samsam sa digmaan.
- source_word: בָהֶם
  choice: sa mga iyon
  rationale: Pinananatili ang panghalip na tumutukoy pabalik sa mga lungsod nang hindi inuulit ang pangngalan.
theological_decisions:
- issue: Pagpapakahulugan sa פַּחַד יְהוָה
  choice: sindak mula kay Yahweh
  alternative: pagkatakot kay Yahweh
  rationale: Sa salaysay ng digmaan, ang parirala ay tumutukoy sa takot na ipinataw o idinulot ni Yahweh sa mga lungsod, hindi sa kanilang mapitagang paggalang sa kaniya.
- issue: Pagsasalin ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Tahasan ang Tetragrammaton sa Hebreo; pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng titulo.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw ngunit marangal. Ginamit ang “nilupig” upang maipahayag ang diwang militar nang hindi gawing di-likas ang mga lungsod bilang tuwirang bagay ng pagpatay. Ang “sumakanila” ay bahagyang mataas ang registro ngunit karaniwan at angkop sa tekstong biblikal.
