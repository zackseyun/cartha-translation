base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/001.yaml
  text: After this[a], the Moabites and the Ammonites, and with them some of the Meunites, came against Jehoshaphat for battle.
translation:
  language: tl
  text: Pagkatapos nito, dumating ang mga Moabita at mga Ammonita, kasama ang ilan sa mga Meunita[a], upang makipagdigma kay Jehoshafat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo: “ilan sa mga Ammonita.” Dahil sa konteksto at sa ilang sinaunang salin, ipinapalagay ng maraming tagapagpaliwanag na mga Meunita o isa pang kahawig na kaalyadong pangkat ang tinutukoy, sa halip na ulitin ang mga Ammonita.'
    reason: textual_variant
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי כֵן
  choice: Pagkatapos nito
  rationale: Likas na salin ng pormulang nag-uugnay sa salaysay at malinaw na pinananatili ang pagkakasunod-sunod ng mga pangyayari nang hindi pilit na isinasalin ang idyomang “at nangyari.”
- source_word: בָּאוּ
  choice: dumating
  rationale: Karaniwang pandiwa ng paggalaw; sa pagkakaugnay nito sa עַל at sa layuning pandigma, malinaw sa buong pangungusap na ang pagdating ay laban kay Jehoshafat.
- source_word: בְנֵי מוֹאָב
  choice: mga Moabita
  rationale: Likas na katawagang etniko sa Filipino at mas malinaw kaysa sa literal na “mga anak ni Moab.”
- source_word: בְנֵי עַמּוֹן
  choice: mga Ammonita
  rationale: Likas na katawagang etniko sa Filipino at katumbas ng Hebreong konstruksiyon.
- source_word: וְעִמָּהֶם
  choice: kasama ang
  rationale: Pinananatili nitong ang ikatlong pangkat ay kaalyado at kasamang dumating ng mga Moabita at Ammonita.
- source_word: מֵהָעַמּוֹנִים
  choice: ilan sa mga Meunita
  rationale: Bagaman “mga Ammonita” ang mababasa sa tekstong Hebreo, ipinahihiwatig ng konteksto at ng ilang sinaunang salin na ibang kaalyadong pangkat ang tinutukoy, na karaniwang kinikilalang mga Meunita. Inilalahad sa talababa ang tunay na tekstuwal na kalabuan.
- source_word: עַל יְהוֹשָׁפָט
  choice: kay Jehoshafat
  rationale: Kasama ng “upang makipagdigma,” malinaw at likas sa Filipino na si Jehoshafat ang pinatutungkulan ng pagsalakay.
- source_word: לַמִּלְחָמָה
  choice: upang makipagdigma
  rationale: Malinaw na ipinahahayag ang layuning militar ng kanilang pagdating at likas itong pakinggan sa makabagong Filipino.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang karaniwang anyong Filipino ng mga katawagang etniko at ang pangalang “Jehoshafat.” Inilagay ang panandang talababa sa “Meunita,” kung saan naroon ang tekstuwal na usapin.
