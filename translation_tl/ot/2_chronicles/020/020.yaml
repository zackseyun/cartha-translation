revisions:
- from: Maaga silang bumangon kinabukasan at pumunta sa ilang ng Tekoa. Habang papalabas sila, tumayo si Jehoshafat at sinabi, “Makinig kayo sa akin, Juda at kayong mga naninirahan sa Jerusalem! Manalig kayo kay Yahweh na inyong Diyos, at kayo ay magiging matatag; manalig kayo sa kanyang mga propeta, at kayo ay magtatagumpay.”
  to: Maaga silang bumangon sa umaga at lumabas patungo sa ilang ng Tekoa. Habang lumalabas sila, tumayo si Jehoshafat at sinabi, “Makinig kayo sa akin, Juda at kayong mga naninirahan sa Jerusalem! Manalig kayo kay Yahweh na inyong Diyos, at kayo ay magiging matatag; manalig kayo sa kanyang mga propeta, at kayo ay magtatagumpay.”
  rationale: Inalis ang hindi hayagang “kinabukasan” upang manatili sa saklaw ng Hebreong teksto. Pinalitan ang “pumunta” ng “lumabas patungo” upang maipakita ang וַיֵּצְאוּ. Pinanatili ang pag-uulit ng “manalig” at idinagdag ang isang maikling tala para sa salitang-laro ng אמן nang hindi binabago ang natural na Tagalog.
