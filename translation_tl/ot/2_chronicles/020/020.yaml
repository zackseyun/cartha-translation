id: 2CH.20.20
reference: 2 Chronicles 20:20
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יַּשְׁכִּ֣ימוּ בַ/בֹּ֔קֶר וַ/יֵּצְא֖וּ לְ/מִדְבַּ֣ר תְּק֑וֹעַ וּ/בְ/צֵאתָ֞/ם עָמַ֣ד יְהוֹשָׁפָ֗ט וַ/יֹּ֨אמֶר֙ שְׁמָע֗וּ/נִי יְהוּדָה֙ וְ/יֹשְׁבֵ֣י יְרוּשָׁלִַ֔ם הַאֲמִ֜ינוּ בַּ/יהוָ֤ה אֱלֹהֵי/כֶם֙ וְ/תֵ֣אָמֵ֔נוּ הַאֲמִ֥ינוּ בִ/נְבִיאָ֖י/ו וְ/הַצְלִֽיחוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/020.yaml
  text: 'They rose early in the morning and went out to the wilderness of Tekoa[a]. As they were going out, Jehoshaphat stood and said, “Listen to me, Judah and inhabitants of Jerusalem: believe in Yahweh your God, and you will be established; believe in his prophets[c][b], and you will succeed.”'
translation:
  language: tl
  text: Maaga silang bumangon sa umaga at lumabas patungo sa ilang ng Tekoa. Habang lumalabas sila, tumayo si Jehoshafat at sinabi, “Makinig kayo sa akin, Juda at kayong mga naninirahan sa Jerusalem! Manalig kayo kay Yahweh na inyong Diyos, at kayo ay magiging matatag; manalig kayo sa kanyang mga propeta, at kayo ay magtatagumpay.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּשְׁכִּימוּ בַבֹּקֶר
  choice: Maaga silang bumangon kinabukasan
  rationale: Ang Hiphil ng שׁכם kasama ng בַבֹּקֶר ay nagsasaad ng maagang pagbangon. Idinagdag ang “kinabukasan” bilang likas na salaysay sa Tagalog ayon sa konteksto ng sunod na umaga.
- source_word: לְמִדְבַּר תְּקוֹעַ
  choice: sa ilang ng Tekoa
  rationale: Ang מִדְבָּר ay maaaring tumukoy sa ilang o tigang na bukas na lupain, hindi lamang sa mabuhanging disyerto. Ang “ilang” ay maikli at tumpak.
- source_word: וּבְצֵאתָם
  choice: Habang papalabas sila
  rationale: Ipinapakita ng preposisyon at infinitive construct ang kilos na kasabay ng pagtayo at pagsasalita ni Jehoshafat.
- source_word: שְׁמָעוּנִי
  choice: Makinig kayo sa akin
  rationale: Natural na makabagong Tagalog para sa tuwirang pautos na may hulaping tumutukoy sa nagsasalita.
- source_word: וְיֹשְׁבֵי יְרוּשָׁלִַם
  choice: at kayong mga naninirahan sa Jerusalem
  rationale: Malinaw at natural na pagtukoy sa mga residente ng Jerusalem sa isang pampublikong panawagan.
- source_word: הַאֲמִינוּ בַּיהוָה אֱלֹהֵיכֶם
  choice: Manalig kayo kay Yahweh na inyong Diyos
  rationale: Ang Hiphil ng אמן na may ב ay nagpapahayag ng pananalig o pagtitiwala. Ang “manalig” ay dignified at naiuulit nang natural sa kasunod na sugnay.
- source_word: וְתֵאָמֵנוּ
  choice: at kayo ay magiging matatag
  rationale: Ang Niphal ng אמן ay nagsasaad ng pagiging matibay o matatag at pinananatili ang ugnayang salita sa naunang הַאֲמִינוּ hangga't natural sa Tagalog.
- source_word: הַאֲמִינוּ בִנְבִיאָיו
  choice: manalig kayo sa kanyang mga propeta
  rationale: Inuulit ang parehong pandiwang אמן upang mapanatili ang retorikal na pag-uulit ng Hebreo.
- source_word: וְהַצְלִיחוּ
  choice: at kayo ay magtatagumpay
  rationale: Sa kontekstong ito, ang Hiphil ng צלח ay tumutukoy sa pagtatagumpay o magandang kinalabasan ng kanilang gagawin.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang isinasalin sa baybay na “Yahweh” ang personal na pangalang YHWH sa halip na palitan ito ng isang titulo.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Personal na pangalan ang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang pagkakaiba nito sa mga titulong gaya ng “Panginoon.”
- issue: Kahulugan at pag-uulit ng אמן
  choice: manalig ... magiging matatag; manalig
  alternative: magtiwala ... mananatiling matatag; paniwalaan
  rationale: Pinananatili ng salin ang pag-uulit sa dalawang utos at ang kaugnay na diwa ng katatagan sa resultang sugnay, nang hindi nililimitahan ang salita sa isang mas huling sistematikong kahulugan ng pananampalataya.
- issue: Ugnayan sa mga propeta
  choice: manalig kayo sa kanyang mga propeta
  alternative: paniwalaan ninyo ang kanyang mga propeta; magtiwala kayo sa kanyang mga propeta
  rationale: Ang Hebreo ay muling gumagamit ng הַאֲמִינוּ na may ב. Ang “manalig” ay nagpapanatili sa retorikal na pagkakatulad, habang hindi ipinahihiwatig na hiwalay sa Diyos ang awtoridad ng mga propeta.
translation_notes:
  register: Makabago ngunit marangal na Filipino Tagalog. Ginamit ang “kayo” sa pampublikong panawagan at iniwasan ang labis na sinauna o teknikal na pananalita. Walang footnote marker dahil walang kailangang tala upang maunawaan ang pangunahing salin.
