  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: לֹ֥א לָ/כֶ֖ם לְ/הִלָּחֵ֣ם בָּ/זֹ֑את הִתְיַצְּב֣וּ עִמְד֡וּ וּ/רְא֣וּ אֶת יְשׁוּעַת֩ יְהוָ֨ה עִמָּ/כֶ֜ם יְהוּדָ֣ה וִֽ/ירוּשָׁלִַ֗ם אַל תִּֽירְאוּ֙ וְ/אַל תֵּחַ֔תּוּ מָחָר֙ צְא֣וּ לִ/פְנֵי/הֶ֔ם וַ/יהוָ֖ה עִמָּ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/017.yaml
  text: You will not need to fight in this battle[a]. Take your positions, stand still, and see the salvation of Yahweh with you, O Judah and Jerusalem. Do not fear or be dismayed. Tomorrow go out before them[b], and Yahweh is with you.
translation:
  language: tl
  text: Hindi ninyo kailangang makipaglaban sa labanang ito. Pumuwesto kayo, manatili kayong nakatayo, at masdan ninyo ang pagliligtas[a] ni Yahweh para sa inyo, Juda at Jerusalem. Huwag kayong matakot o panghinaan ng loob. Bukas, lumabas kayo upang harapin sila, at kasama ninyo si Yahweh.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring ‘ang kaligtasan ni Yahweh para sa inyo.’ Ang salitang Hebreo ay maaaring tumukoy sa pagsagip sa labanan at sa kaligtasan sa mas malawak na diwa.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring ‘at sasamahan kayo ni Yahweh.’ Walang tahasang pandiwa ang sugnay sa Hebreo, kaya maaaring ipahayag ang katiyakan bilang kasalukuyan o panghinaharap.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא לָכֶם לְהִלָּחֵם בָּזֹאת
  choice: Hindi ninyo kailangang makipaglaban sa labanang ito
  rationale: Ang literal na diwang ‘hindi para sa inyo ang makipaglaban dito’ ay likas na naipapahayag sa modernong Tagalog bilang hindi nila kailangang lumaban, nang hindi ipinahihiwatig na hindi sila dapat humarap sa kaaway.
- source_word: הִתְיַצְּבוּ
  choice: Pumuwesto kayo
  rationale: Ipinahihiwatig ng hitpael imperative ang matatag na paglalagay ng sarili sa itinakdang puwesto; ang ‘pumuwesto’ ay natural at angkop sa kontekstong militar.
- source_word: עִמְדוּ
  choice: manatili kayong nakatayo
  rationale: Kasunod ng ‘pumuwesto,’ idinidiin nito na manatili silang matatag sa kinaroroonan at magmasid, sa halip na makipaglaban.
- source_word: וּרְאוּ אֶת יְשׁוּעַת יְהוָה
  choice: at masdan ninyo ang pagliligtas ni Yahweh
  rationale: Ang יְשׁוּעָה ay tumutukoy sa aktuwal na pagliligtas sa labanan ngunit maaari ring magkaroon ng mas malawak na diwa; pinananatili ng ‘pagliligtas’ ang dalawang saklaw nang natural sa Tagalog.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasatitik ang personal na pangalang Hebreo sa halip na palitan ito ng isang titulo.
- source_word: עִמָּכֶם
  choice: sa inyo / kasama ninyo
  rationale: Ang unang gamit ay likas na isinatinig bilang pagliligtas na gagawin ‘sa inyo,’ samantalang ang panghuling katiyakan ng presensiya at suporta ng Diyos ay malinaw na ‘kasama ninyo.’
- source_word: יְהוּדָה וִירוּשָׁלִַם
  choice: Juda at Jerusalem
  rationale: Direktang tawag ito sa sambayanan; hindi kailangan sa natural na Tagalog ang pantawag na katumbas ng Ingles na ‘O.’
- source_word: אַל תִּירְאוּ וְאַל תֵּחַתּוּ
  choice: Huwag kayong matakot o panghinaan ng loob
  rationale: Ang dalawang pagbabawal ay natural na pinagtambal sa Tagalog; ipinapahayag ng ‘panghinaan ng loob’ ang pagiging wasak o nasisiraan ng tapang na saklaw ng חתת.
- source_word: מָחָר צְאוּ לִפְנֵיהֶם
  choice: Bukas, lumabas kayo upang harapin sila
  rationale: Sa kontekstong militar, ang paglabas ‘sa harap nila’ ay pagharap sa kaaway; nililinaw ito nang hindi sinasabing sila ang lalaban.
- source_word: וַיהוָה עִמָּכֶם
  choice: at kasama ninyo si Yahweh
  rationale: Walang tahasang pandiwa ang sugnay sa Hebreo. Pinananatili ng pangkasalukuyang pahayag ang tuwirang katiyakan ng presensiya ni Yahweh, habang itinatala sa talababa ang posibleng panghinaharap na pagbasa.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang ginagamit ng teksto ang Tetragrammaton; ang ‘Yahweh’ ay nagpapanatili rito bilang personal na pangalan at hindi bilang titulo.
- issue: Saklaw ng יְשׁוּעַת יְהוָה
  choice: ang pagliligtas ni Yahweh
  alternative: ang kaligtasang mula kay Yahweh; ang pagtatagumpay ni Yahweh
  rationale: Ang agarang tinutukoy ay pagsagip sa labanan, ngunit hindi nililimitahan ng ‘pagliligtas’ ang salita sa tagumpay militar lamang.
- issue: Panahunan ng וַיהוָה עִמָּכֶם
  choice: kasama ninyo si Yahweh
  alternative: sasamahan kayo ni Yahweh
  rationale: Dahil walang pandiwa ang sugnay, maaaring ipahayag ang katiyakan bilang kasalukuyang presensiya o panghinaharap na pagsama. Pinili sa teksto ang mas tuwirang kasalukuyan at pinanatili sa talababa ang alternatibo.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang pangmaramihang ‘kayo/ninyo’ para sa kolektibong kausap, at iniwasan ang lipas o sobrang teknikal na pananalita. Inilagay ang [a] sa mismong ‘pagliligtas,’ na siyang tinatalakay ng talababa.
