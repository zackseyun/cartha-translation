revisions:
- from: Hindi ninyo kailangang makipaglaban sa labanang ito. Pumuwesto kayo, manatili kayong nakatayo, at masdan ninyo ang pagliligtas[a] ni Yahweh sa inyo, Juda at Jerusalem. Huwag kayong matakot o panghinaan ng loob. Bukas, lumabas kayo upang harapin sila, at kasama ninyo si Yahweh.[b]
  to: Hindi ninyo kailangang makipaglaban sa labanang ito. Pumuwesto kayo, manatili kayong nakatayo, at masdan ninyo ang pagliligtas[a] ni Yahweh para sa inyo, Juda at Jerusalem. Huwag kayong matakot o panghinaan ng loob. Bukas, lumabas kayo upang harapin sila, at kasama ninyo si Yahweh.[b]
  rationale: Inayos ang unang pariralang may ‘kasama/para sa inyo’ upang maging natural na Tagalog habang pinananatili ang diwa ng banal na pagliligtas na para sa Juda at Jerusalem. Pinalitan ang talababa a ng tunay na leksikal na alternatibo at pinanatiling ‘Yahweh’ ang banal na pangalan sa buong sipi at mga talababa.
