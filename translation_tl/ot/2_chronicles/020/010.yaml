    issue: “Sa halip” ang salin ng כִּי.
    rationale: 'Ang כִּי rito ay nagbibigay ng dahilan o paliwanag: hindi sila pinayagang salakayin sapagkat lumihis ang Israel mula sa kanila at hindi sila nilipol. Ang “Sa halip” ay nagpapalit sa ugnayang ito tungo sa mas malakas na kontrast.'
  - severity: low
    issue: “upang iwasan sila” ay nagdaragdag ng hayag na layunin.
    rationale: Ang סָרוּ מֵעֲלֵיהֶם ay nagsasaad na lumihis o tumalikod sila mula sa mga ito. Bagaman ang pag-iwas ay makatuwirang implikasyon, hindi ito kailangang gawing tahasang layunin sa salin.
  - severity: low
    issue: “nang manggaling ang Israel” ay hindi gaanong likas sa pangyayaring paglabas mula sa Ehipto.
    rationale: Ang “nang lumabas ang Israel mula sa lupain ng Ehipto” ay mas likas na Tagalog at mas direktang tumutugma sa temporal na parirala ng Hebreo.
