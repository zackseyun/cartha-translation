base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/010.yaml
  text: And now[a], behold, the people of Ammon and Moab and Mount Seir[b], whom you did not allow Israel to enter against when they came from the land of Egypt—for they turned away from them and did not destroy them—
translation:
  language: tl
  text: At ngayon, tingnan mo ang mga Ammonita, mga Moabita, at mga taga-Bundok Seir[a]. Hindi mo pinahintulutan ang Israel na sumalakay sa kanila[b] nang lumabas ang Israel mula sa lupain ng Ehipto, sapagkat lumihis ang Israel palayo sa kanila at hindi sila nilipol—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal na binabanggit ng Hebreo ang “mga anak ng Ammon, Moab, at Bundok Seir”; tumutukoy ito sa mga Ammonita, mga Moabita, at mga naninirahan sa Bundok Seir.
    reason: lexical_alternative
  - marker: b
    text: 'Mas literal: “Hindi mo ibinigay sa Israel na pumasok sa/laban sa kanila.” Sa konteksto, hindi pinahintulutan ng Diyos ang Israel na salakayin sila.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה הִנֵּה
  choice: At ngayon, tingnan mo
  rationale: Pinananatili ng “At ngayon” ang ugnay sa naunang panalangin, habang natural na ipinahahayag ng “tingnan mo” ang mapilit at deiktikong lakas ng הִנֵּה sa makabagong Tagalog.
- source_word: בְנֵי עַמּוֹן וּמוֹאָב וְהַר שֵׂעִיר
  choice: ang mga Ammonita, mga Moabita, at mga taga-Bundok Seir
  rationale: Inihahayag ang tinutukoy na mga pangkat ng tao sa natural na Tagalog. Ang “mga taga-Bundok Seir” ay nagpapaliwanag sa metonimikong pagtukoy ng Hebreo sa lugar bilang mga naninirahan doon.
- source_word: אֲשֶׁר לֹא נָתַתָּה לְיִשְׂרָאֵל לָבוֹא בָהֶם
  choice: Hindi mo pinahintulutan ang Israel na sumalakay sa kanila
  rationale: Sa konteksto ng paglalakbay at digmaan, ang idyomang literal na “hindi mo ibinigay sa Israel na pumasok laban/sa kanila” ay tumutukoy sa hindi pagpapahintulot na lusubin o salakayin sila.
- source_word: בְּבֹאָם מֵאֶרֶץ מִצְרָיִם
  choice: nang manggaling ang Israel sa lupain ng Ehipto
  rationale: Nililinaw ang implicit na simuno ng maramihang anyo sa Hebreo; ang Israel bilang sambayanan ang tinutukoy. Ang “lupain ng Ehipto” ay nagpapanatili sa buong heograpikong parirala.
- source_word: כִּי סָרוּ מֵעֲלֵיהֶם
  choice: Sa halip, lumihis ang Israel upang iwasan sila
  rationale: Ipinahahayag ang aktuwal na kilos ng Israel—paglihis ng landas at pag-iwas sa mga bansang iyon. Ang כִּי ay nauunawaan dito bilang pagpapaliwanag sa naunang pahayag, at natural na naihahatid ng “Sa halip” ang paghahambing sa hindi pagsalakay.
- source_word: וְלֹא הִשְׁמִידוּם
  choice: at hindi sila nilipol
  rationale: Ang “nilipol” ay sapat na matindi para sa Hiphil ng שׁמד at akma sa kontekstong militar, nang hindi nagdaragdag ng teknikal na terminong teolohikal.
theological_decisions:
- issue: Tuwirang pakikipag-usap sa Diyos sa ikalawang panauhan
  choice: Hindi mo pinahintulutan
  alternative: Hindi pinahintulutan ng PANGINOON
  rationale: Bahagi ito ng tuwirang panalangin ni Jehoshafat. Pinananatili ng ikalawang panauhan ang anyo at pagiging kagyat ng Hebreo, nang hindi nagdaragdag ng banal na pangalan na wala sa talata.
- issue: Lakas ng pandiwang militar sa לָבוֹא בָהֶם
  choice: sumalakay sa kanila
  alternative: pumasok laban sa kanila
  rationale: Ang parirala ay may tunay na bahagyang kalabuan sa anyong literal, ngunit malinaw na militar ang konteksto. Inilalagay sa talababa ang mas literal na anyo upang hindi maitago ang estruktura ng Hebreo.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “tingnan mo” sa halip na arkaikong “narito,” at ang mga pangalang etniko ay ginawang likas sa Filipino. Pinanatili ang gitling sa hulihan dahil nagpapatuloy ang pangungusap sa susunod na talata.
