base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/023.yaml
  text: Then the Ammonites and Moabites rose up against the inhabitants of Mount Seir to devote them to destruction and to wipe them out; and when they had finished with the inhabitants of Seir[a], they helped each other to destroy one another.
translation:
  language: tl
  text: At tumindig ang mga Ammonita at Moabita laban sa mga naninirahan sa Bundok Seir upang italaga sila sa pagkapuksa[a] at lipulin sila. Nang maubos na nila ang mga naninirahan sa Seir, nagtulungan silang puksain ang isa't isa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, isang teknikal na pagpapahayag para sa “italaga sa ganap na pagkawasak,” o “ipailalim sa herem.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַמְדוּ
  choice: tumindig ... laban
  rationale: Sa kontekstong militar at kasama ng עַל, ang pandiwa ay nagpapahiwatig ng pagharap o pagkilos laban sa isang kaaway. Pinananatili ng “tumindig laban” ang larawan ng Hebreo at malinaw ang diwang mapanlaban.
- source_word: בְּנֵי עַמּוֹן וּמוֹאָב
  choice: ang mga Ammonita at Moabita
  rationale: Likas na katawagan sa modernong Filipino para sa mga bayang tinutukoy ng literal na “mga anak ni Ammon at Moab.”
- source_word: יֹשְׁבֵי הַר שֵׂעִיר
  choice: mga naninirahan sa Bundok Seir
  rationale: Tuwirang isinasalin ang participial substantive bilang mga naninirahan at pinananatili ang kilalang pangalang heograpiko.
- source_word: לְהַחֲרִים
  choice: upang italaga sila sa ganap na pagkapuksa
  rationale: Ipinahihiwatig ng Hiphil ng חרם ang pagtatalaga sa pagkapuksa, hindi lamang karaniwang pagpatay. Ang parirala ay nagpapanatili sa natatanging bigat ng salita habang nauunawaan sa modernong Filipino.
- source_word: וּלְהַשְׁמִיד
  choice: at lipulin
  rationale: Ang “lipulin” ay natural at matindi, at naihihiwalay sa naunang kultikong diwa ng חרם.
- source_word: וּכְכַלּוֹתָם
  choice: Nang maubos na nila
  rationale: Ang כְּ na kasama ng infinitive construct ay temporal. Sa kontekstong ito, ang כִּלָּה בְּ ay tumutukoy sa pagtatapos o lubos na pag-ubos sa mga taga-Seir.
- source_word: עָזְרוּ אִישׁ בְּרֵעֵהוּ
  choice: nagtulungan sila
  rationale: Ang literal na “bawat lalaki ay tumulong sa kaniyang kapwa” ay distributibo at resiprokal; natural itong ipinahahayag sa Filipino bilang “nagtulungan sila.”
- source_word: לְמַשְׁחִית
  choice: puksain ang isa't isa
  rationale: Ipinakikita ng infinitive ang layunin o bunga ng kanilang pagtutulungan. Ginagawang hayag ng “ang isa't isa” ang resiprokal na bagay na ipinahihiwatig ng konteksto.
theological_decisions:
- issue: Pagpapahayag sa חרם sa konteksto ng digmaan
  choice: italaga sila sa ganap na pagkapuksa
  alternative: ilagay sila sa ilalim ng pagbabawal; lubusang puksain sila
  rationale: May natatanging kultiko at teolohikal na bigat ang חרם na hindi lubos na naihahatid ng karaniwang “puksain.” Pinananatili ng pangunahing salin ang ideya ng pagtatalaga sa pagkapuksa, samantalang inililinaw ng talababa ang teknikal na kahulugan.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “tumindig laban” upang mapanatili ang larawan ng orihinal, at “nagtulungan silang puksain ang isa't isa” upang malinaw na maipahayag ang kabalintunaan at resiprokal na karahasan sa huling sugnay.
