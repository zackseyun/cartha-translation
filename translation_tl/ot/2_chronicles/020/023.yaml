  source_fidelity: Tumpak na naihahatid ng draft ang pagkilos ng mga Ammonita at Moabita laban sa mga taga-Seir, ang dalawang magkaugnay ngunit magkaibang pandiwa ng pagwasak, ang temporal na pagsunod-sunod, at ang huling resiprokal na paglipol. Gayunman, ang “ganap na” sa pangunahing salin ay hindi kailangan sa לְהַחֲרִים at maaaring lumabo ang pagkakaiba nito sa kasunod na וּלְהַשְׁמִיד. Ang unang וַ ay pangsalaysay na “At,” hindi malinaw na pangatwirang “Kaya.”
  naturalness: Marangal at malinaw ang Filipino. Mas natural at mas malinaw ang “At tumindig” para sa pangsalaysay na dugtong at ang pag-uulit ng “sila” sa “at lipulin sila” upang hindi malabo ang layon ng ikalawang pandiwa.
  terminology: Ang “italaga ... sa pagkapuksa” ay angkop na salin ng חרם at naiiba sa “lipulin” para sa שׁמד. Ang “sa ilalim ng pagbabawal” sa talababa ay maaaring magpahiwatig lamang ng isang ipinagbabawal na bagay sa modernong Filipino, sa halip na ang teknikal na pagtatalaga sa pagwasak; dapat itong linawin.
