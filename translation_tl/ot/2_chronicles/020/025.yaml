base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/025.yaml
  text: Then Jehoshaphat and his people came to plunder their spoil[a], and they found among them in abundance goods, garments, and desirable articles; and they took for themselves more than they could carry. They were three days plundering the spoil, because it was so much.
translation:
  language: tl
  text: Nang dumating si Jehoshafat at ang kanyang bayan upang samsamin ang mga ari-arian ng mga kaaway, nakakita sila sa kanila ng napakaraming pag-aari, mga bangkay[a], at mahahalagang bagay. Kumuha sila para sa kanilang sarili ng mga iyon, nang higit sa kaya nilang dalhin. Tatlong araw silang nagsamsam ng mga samsam, sapagkat napakarami nito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Mga bangkay” ang mababasa sa tekstong Masoretiko. Ang ilang sinaunang saksi at salin ay nagpapahiwatig ng pagbabasang gaya ng “mga kasuotan,” o hindi isinasama ang salita, marahil upang maging mas maayos ang talaan ng mga samsam.
    reason: textual_variant
lexical_decisions:
- source_word: לָבֹז אֶת שְׁלָלָם
  choice: upang samsamin ang mga ari-arian ng mga kaaway
  rationale: Ipinahahayag ng pawatas ang layunin ng pagpunta. Ang “samsamin” ay likas na salitang Filipino para sa pagkuha ng mga ari-arian matapos ang labanan; nilinaw ang tinutukoy ng hulaping panghalip upang maiwasan ang malabong “kanilang samsam.”
- source_word: בָהֶם
  choice: sa gitna ng mga ito
  rationale: Sapat ang lawak ng parirala upang tumukoy sa hanay ng mga napatay na kaaway at sa mga bagay na nasa kanila o nakapaligid sa kanila.
- source_word: לָרֹב
  choice: napakaraming
  rationale: Natural na ipinahahayag nito ang diin ng Hebreo sa lubhang malaking dami.
- source_word: רְכוּשׁ
  choice: pag-aari
  rationale: Malawak ang saklaw nito para sa naililipat na ari-arian o kayamanan nang hindi nililimitahan sa salapi.
- source_word: פְגָרִים
  choice: mga bangkay
  rationale: Ito ang tuwirang kahulugan ng tekstong Masoretiko sa konteksto ng labanan. Hindi ito pinalitan sa pangunahing teksto kahit mahirap ang talaan at may ibang pagbasa ang ilang sinaunang saksi.
- source_word: כְלֵי חֲמֻדוֹת
  choice: mahahalagang kagamitan
  rationale: Ang כְּלִי ay maaaring tumukoy sa sari-saring kagamitan o bagay, at ang חֲמֻדוֹת ay nagpapahiwatig na kanais-nais o mahalaga ang mga ito.
- source_word: וַיְנַצְּלוּ לָהֶם
  choice: Kumuha sila para sa kanilang sarili
  rationale: Ipinakikita nito ang pagkuha ng samsam para sa sariling kapakinabangan. Mas natural ito sa Filipino kaysa sa literal na “hinubaran nila,” habang nananatili ang diwa sa konteksto.
- source_word: לְאֵין מַשָּׂא
  choice: nang higit sa kaya nilang dalhin
  rationale: Malinaw at natural na pagpapahayag ng idyomang nagsasabing lampas sa kakayahang dalhin ang dami.
- source_word: וַיִּהְיוּ יָמִים שְׁלוֹשָׁה בֹּזְזִים
  choice: Tatlong araw silang nagsamsam
  rationale: Pinananatili ang tagal at nagpapatuloy na kilos sa maikli at natural na anyong Filipino.
- source_word: כִּי רַב הוּא
  choice: dahil napakarami ng mga samsam
  rationale: 'Ipinahahayag ang dahilan ng tatlong araw na gawain: ang napakalaking dami ng samsam.'
