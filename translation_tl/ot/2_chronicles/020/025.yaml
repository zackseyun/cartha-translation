- from: Pagdating ni Jehoshafat at ng kanyang mga tauhan upang samsamin ang mga ari-arian ng mga kaaway, nakakita sila sa gitna ng mga ito ng napakaraming pag-aari, mga bangkay[a], at mahahalagang kagamitan. Kumuha sila para sa kanilang sarili nang higit sa kaya nilang dalhin. Tatlong araw silang nagsamsam dahil napakarami ng mga samsam.
  to: Nang dumating si Jehoshafat at ang kanyang bayan upang samsamin ang mga ari-arian ng mga kaaway, nakakita sila sa kanila ng napakaraming pag-aari, mga bangkay[a], at mahahalagang bagay. Kumuha sila para sa kanilang sarili ng mga iyon, nang higit sa kaya nilang dalhin. Tatlong araw silang nagsamsam ng mga samsam, sapagkat napakarami nito.
