base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/032.yaml
  text: He walked in the way of his father Asa and did not turn aside from it, doing what was right in the eyes of Yahweh.
translation:
  language: tl
  text: Lumakad siya sa landas ng kanyang amang si Asa at hindi lumihis dito; ginawa niya ang tama sa paningin ni Yahweh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּלֶךְ בְּדֶרֶךְ
  choice: Lumakad siya sa landas
  rationale: Pinananatili nito ang talinghagang Hebreo ng paglakad sa isang landas bilang paglalarawan sa asal at paraan ng pamumuhay, at likas pa rin itong nauunawaan sa makabagong Filipino.
- source_word: אָבִיו אָסָא
  choice: ng kanyang amang si Asa
  rationale: Malinaw at natural nitong ipinakikilala si Asa bilang ama ng tinutukoy na hari habang pinananatili ang ugnayang nasa tekstong Hebreo.
- source_word: וְלֹא סָר מִמֶּנָּה
  choice: at hindi lumihis dito
  rationale: Ang 'lumihis' ay tumutugma sa kahulugan ng סור na pagtalikod o paglayo at nagpapatuloy sa larawan ng landas; ang 'dito' ay tumutukoy pabalik sa landas.
- source_word: לַעֲשׂוֹת הַיָּשָׁר
  choice: ginawa niya ang tama
  rationale: Natural nitong ipinahahayag ang paggawa ng matuwid o wastong bagay nang hindi nagdaragdag ng paliwanag na wala sa orihinal.
- source_word: בְּעֵינֵי יְהוָה
  choice: sa paningin ni Yahweh
  rationale: Pinananatili ng 'sa paningin' ang idyomang Hebreo tungkol sa pagsusuri ng Diyos, at tuwirang isinasalin ang pangalang יְהוָה bilang Yahweh.
theological_decisions:
- issue: Paglalarawan sa matuwid na paghahari
  choice: ginawa niya ang tama sa paningin ni Yahweh
  alternative: ginawa niya ang matuwid sa harap ni Yahweh
  rationale: Pinananatili ang pamantayan ng banal na pagsusuri nang hindi ipinapakahulugan na ganap o walang-kasalanan ang hari.
- issue: Pagsasalin ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Pangalan mismo ng Diyos ang nasa tekstong Hebreo, kaya ginamit ang 'Yahweh' sa halip na palitan ito ng isang titulo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang biblikal na talinghaga ng paglakad sa landas at ang idyomang 'sa paningin ni Yahweh' nang hindi nagiging lipas o labis na literal.
