base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/007.yaml
  text: Did you not[a], our God, drive out the inhabitants of this land before your people Israel and give it forever to the offspring of Abraham, your friend?
translation:
  language: tl
  text: Hindi ba ikaw, Diyos namin, ang nagpalayas sa mga naninirahan sa lupaing ito sa harap ng iyong bayang Israel at ibinigay ang lupaing ito sa lahi ni Abraham, na kaibigan mo, magpakailanman?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֲלֹא
  choice: Hindi ba
  rationale: Ipinahahayag nito ang retorikal na tanong na umaasa ng sagot na oo; likas itong anyo sa makabagong Tagalog.
- source_word: אֱלֹהֵינוּ
  choice: Diyos namin
  rationale: Tuwirang pagtawag ito sa panalangin at malinaw na pinananatili ang panghalip na paari.
- source_word: הוֹרַשְׁתָּ
  choice: nagpalayas
  rationale: Ang causative na anyo ng ירשׁ ay tumutukoy sa pagpapaalis o pag-aalis ng dating mga naninirahan sa kanilang pag-aari; malinaw at karaniwan ang “nagpalayas” sa Tagalog.
- source_word: יֹשְׁבֵי הָאָרֶץ הַזֹּאת
  choice: mga naninirahan sa lupaing ito
  rationale: Tuwirang inilalarawan ang mga taong naninirahan sa nasabing lupain sa natural na Tagalog.
- source_word: מִלִּפְנֵי
  choice: mula sa harap ng
  rationale: Pinananatili ang Hebreong idyoma ng pagpapaalis mula sa harapan o presensiya ng Israel nang hindi dinaragdagan ang teksto ng isang tahasang paglalarawan sa pagsalakay.
- source_word: עַמְּךָ יִשְׂרָאֵל
  choice: iyong bayang Israel
  rationale: Pinananatili ang tipanang katawagan at ang Israel bilang pangalan na tumutukoy sa bayan.
- source_word: וַתִּתְּנָהּ
  choice: at nagbigay nito
  rationale: Ipinagpapatuloy ang magkakaugnay na nakaraang kilos sa loob ng retorikal na tanong; ang “nito” ay tumutukoy sa lupain.
- source_word: לְזֶרַע אַבְרָהָם
  choice: sa lahi ni Abraham
  rationale: Ang זֶרַע ay kolektibong pangngalang isahan; natural sa Tagalog ang “lahi” at napapanatili nito ang kolektibong diwa.
- source_word: אֹהַבְךָ
  choice: kaibigan mo
  rationale: Ipinahahayag nito ang kinikilalang katawagang pang-ugnayan kay Abraham, samantalang inilalagay sa talababa ang mas literal na pandiwang diwa.
- source_word: לְעוֹלָם
  choice: magpakailanman
  rationale: Karaniwan at marangal na salin ito para sa walang hanggang tagal sa konteksto ng pangako.
theological_decisions:
- issue: Ang katawagan kay Abraham na אֹהַבְךָ
  choice: kaibigan mo
  alternative: ang umibig sa iyo
  rationale: Maaaring unawain ang Hebreong participle bilang “ang umiibig/umibig sa iyo,” ngunit ginagamit din ito bilang katawagang nagpapahayag ng natatanging ugnayan ni Abraham sa Diyos. Natural ang “kaibigan mo,” at pinananatili sa talababa ang literal na diwa upang hindi maitago ang tensiyong leksikal.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog na angkop sa panalangin. Pinanatili ang retorikal na tanong, ang kolektibong diwa ng “lahi,” at ang Hebreong larawan ng pagpapaalis “mula sa harap” ng Israel.
