  text: וַ/יִּמְלֹ֥ךְ יְהוֹשָׁפָ֖ט עַל יְהוּדָ֑ה בֶּן שְׁלֹשִׁים֩ וְ/חָמֵ֨שׁ שָׁנָ֜ה בְּ/מָלְכ֗/וֹ וְ/עֶשְׂרִ֨ים וְ/חָמֵ֤שׁ שָׁנָה֙ מָלַ֣ךְ בִּֽ/ירוּשָׁלִַ֔ם וְ/שֵׁ֣ם אִמּ֔/וֹ עֲזוּבָ֖ה בַּת שִׁלְחִֽי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/031.yaml
  text: And Jehoshaphat reigned over Judah. He was thirty-five years old when he began to reign, and he reigned twenty-five years in Jerusalem. And his mother’s name was Azubah daughter of Shilhi.
translation:
  language: tl
  text: Naghari si Jehoshafat sa Juda. Tatlumpu't limang taong gulang siya nang magsimula siyang maghari, at dalawampu't limang taon siyang naghari sa Jerusalem. Ang pangalan ng kanyang ina ay Azuba, anak na babae ni Silhi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּמְלֹךְ
  choice: Naghari
  rationale: Ang wayyiqtol ng מלך ay nagpapakilala sa ulat tungkol sa paghahari; natural at tuwiran sa Filipino ang “naghari.”
- source_word: עַל יְהוּדָה
  choice: sa Juda
  rationale: Sa konstruksiyong מלך על, ang Juda ang nasasakupang kaharian. Mas natural sa Filipino ang “naghari sa Juda” kaysa “naghari sa ibabaw ng Juda.”
- source_word: בֶּן שְׁלֹשִׁים וְחָמֵשׁ שָׁנָה
  choice: Tatlumpu't limang taong gulang
  rationale: Karaniwang pormula ito ng edad sa Hebreo; ang idiomatikong katumbas sa Filipino ay “taong gulang.”
- source_word: בְּמָלְכוֹ
  choice: nang magsimula siyang maghari
  rationale: Ang ב na may infinitive construct at hulaping panghalip ay nagsasaad ng panahon ng pagluklok niya bilang hari.
- source_word: וְעֶשְׂרִים וְחָמֵשׁ שָׁנָה מָלַךְ
  choice: dalawampu't limang taon siyang naghari
  rationale: Tuwirang ipinahahayag nito ang tagal ng kanyang paghahari.
- source_word: בִּירוּשָׁלִַם
  choice: sa Jerusalem
  rationale: Ito ang lugar na binabanggit sa karaniwang pormula ng ulat tungkol sa paghahari.
- source_word: וְשֵׁם אִמּוֹ
  choice: Ang pangalan ng kanyang ina ay
  rationale: Pinananatili nito ang pormula ng Hebreo sa natural at marangal na ayos ng modernong Filipino.
- source_word: עֲזוּבָה
  choice: Azuba
  rationale: Isinalin sa baybay-Filipino ang personal na pangalan ayon sa bigkas ng Hebreo.
- source_word: בַּת שִׁלְחִי
  choice: anak ni Silhi
  rationale: Ang בַּת ay tumutukoy sa ugnayang anak na babae; malinaw na sa konteksto na babae si Azuba, kaya natural ang “anak ni Silhi” sa Filipino.
