  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/אַחֲרֵי כֵ֗ן אֶתְחַבַּר֙ יְהוֹשָׁפָ֣ט מֶֽלֶךְ יְהוּדָ֔ה עִ֖ם אֲחַזְיָ֣ה מֶֽלֶךְ יִשְׂרָאֵ֑ל ה֖וּא הִרְשִׁ֥יעַ לַ/עֲשֽׂוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/035.yaml
  text: After this[a], Jehoshaphat king of Judah allied himself with Ahaziah king of Israel[b], who acted wickedly in doing so.
translation:
  language: tl
  text: Pagkatapos nito, nakipag-alyansa si Jehoshafat na hari ng Juda kay Ahazias na hari ng Israel. Si Ahazias ay kumilos nang masama sa ginawa niya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “siya ay kumilos nang masama upang gumawa.” Malamang na si Ahazias ang tinutukoy ng “siya,” ngunit maaari rin itong unawain bilang pagtukoy kay Jehoshafat o sa ginawa niyang pakikipag-alyansa.
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/אַחֲרֵי כֵן
  choice: Pagkatapos nito
  rationale: Likas na panandang temporal sa makabagong Tagalog at malinaw na nag-uugnay sa naunang mga pangyayari.
- source_word: אֶתְחַבַּר
  choice: nakipag-alyansa
  rationale: Ang Hitpael ng חבר ay tumutukoy dito sa kusang pakikipag-ugnayan o pakikipagsanib; ang konteksto ng mga hari ay nagbibigay rito ng diwang pampolitika.
- source_word: יְהוֹשָׁפָט
  choice: Jehoshafat
  rationale: Karaniwang anyong transliterado ng pangalang Hebreo sa Tagalog.
- source_word: מֶלֶךְ יְהוּדָה
  choice: hari ng Juda
  rationale: Tuwirang salin ng titulong maharlika at pangalan ng lupain.
- source_word: עִם אֲחַזְיָה מֶלֶךְ יִשְׂרָאֵל
  choice: kay Ahazias na hari ng Israel
  rationale: Natural na Tagalog para sa pariralang nagpapakilala sa kasama at sa kaniyang titulo.
- source_word: הוּא
  choice: Si Ahazias
  rationale: Ginawang tahasan ang malamang na tinutukoy ng panghalip—ang pinakamalapit na antecedent na si Ahazias—upang maging malinaw sa Tagalog; inilalahad sa talababa ang tunay na kalabuan.
- source_word: הִרְשִׁיעַ
  choice: kumilos nang masama
  rationale: Pinananatili ang moral na bigat ng Hiphil ng רשע nang hindi nagdaragdag ng mas tiyak na uri ng kasamaan.
- source_word: לַ/עֲשׂוֹת
  choice: sa ginawa niya
  rationale: Ang pariralang Hebreo ay maikli at hindi karaniwan; ang saling ito ay natural ngunit hindi tinutukoy nang higit sa teksto kung anong partikular na gawa ang tinutukoy.
theological_decisions:
- issue: Tinutukoy ng panghalip na הוּא
  choice: Si Ahazias ang kumilos nang masama.
  alternative: Maaaring tumukoy ang panghalip kay Jehoshafat o sa kaniyang pakikipag-alyansa kay Ahazias.
  rationale: Si Ahazias ang pinakamalapit na antecedent at naaayon ito sa negatibong paglalarawan sa kaniya sa konteksto. Gayunman, hindi ganap na nilulutas ng maikling Hebreong sugnay ang reperensiya, kaya pinananatili sa talababa ang ibang posibilidad.
- issue: Kaugnayan ng לַעֲשׂוֹת sa kasamaan
  choice: Isinaling “sa ginawa niya,” na tumutukoy sa kaniyang pagkilos nang hindi nililimitahan iyon sa isang espesipikong proyekto.
  alternative: “sa paggawa nito,” na maaaring tahasang tumukoy sa alyansa o sa proyektong kasunod nito.
  rationale: Hindi tinutukoy ng Hebreo ang layon ng infinitive. Iniiwasan ng salin ang tahasang pagpapasiya kung ang hinahatulan ay ang alyansa mismo o ang kaugnay na gawain.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “nakipag-alyansa” upang ipahayag ang diwang pampolitika ng pandiwa, samantalang pinanatili sa talababa ang sintaktikong kalabuan ng huling sugnay.
