source:
  edition: WLC
  text: וַ/יֹּאמַ֗ר יְהוָ֞ה אֱלֹהֵ֤י אֲבֹתֵ֨י/נוּ֙ הֲ/לֹ֨א אַתָּֽה ה֤וּא אֱלֹהִים֙ בַּ/שָּׁמַ֔יִם וְ/אַתָּ֣ה מוֹשֵׁ֔ל בְּ/כֹ֖ל מַמְלְכ֣וֹת הַ/גּוֹיִ֑ם וּ/בְ/יָדְ/ךָ֙ כֹּ֣חַ וּ/גְבוּרָ֔ה וְ/אֵ֥ין עִמְּ/ךָ֖ לְ/הִתְיַצֵּֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/006.yaml
  text: and said[a], “O Yahweh, God of our fathers, are you not God in heaven? And do you not rule over all the kingdoms of the nations? In your hand are power and might[b], and there is none who can stand against you.”
translation:
  language: tl
  text: at sinabi niya, “O Yahweh, Diyos ng aming mga ama,[a] hindi ba kayo ang Diyos sa langit at namamahala sa lahat ng kaharian ng mga bansa? Nasa inyong kamay ang kapangyarihan at kalakasan, at walang sinumang makatatayo laban sa inyo.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “Diyos ng aming mga ninuno.” Sa literal, “Diyos ng aming mga ama.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “walang sinumang makalalaban sa inyo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמַר
  choice: at sinabi niya
  rationale: Pinananatili ang pagpapatuloy ng salaysay at nililinaw sa natural na Tagalog ang di-hayag na simuno ng pandiwa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang isinasalin ang banal na pangalang YHWH sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֵי אֲבֹתֵינוּ
  choice: Diyos ng aming mga ninuno
  rationale: Sa modernong Tagalog, ang “mga ninuno” ang likas at malinaw na tawag sa mga naunang salinlahi; ang literal na “mga ama” ay maaaring mapagkamalang tumutukoy lamang sa agarang mga ama.
- source_word: הֲלֹא
  choice: hindi ba
  rationale: Pinananatili ang retorikal na tanong na umaasang sasang-ayon ang kausap.
- source_word: אַתָּה הוּא אֱלֹהִים בַּשָּׁמַיִם
  choice: kayo ang Diyos sa langit
  rationale: Likas na Tagalog na pahayag ng pagkakakilanlan at saklaw ng banal na paghahari, nang hindi dinaragdagan ang di-tiyak na artikulo.
- source_word: מוֹשֵׁל
  choice: namamahala
  rationale: Ipinahahayag ang patuloy na soberanong paghahari sa malinaw at kasalukuyang Tagalog.
- source_word: מַמְלְכוֹת הַגּוֹיִם
  choice: lahat ng kaharian ng mga bansa
  rationale: Pinananatili ang “mga kaharian” at “mga bansa,” pati ang saklaw na “lahat” mula sa כֹל.
- source_word: וּבְיָדְךָ
  choice: Nasa inyong kamay
  rationale: Pinananatili ang konkretong larawang Hebreo ng kapangyarihang nasa kamay ng Diyos.
- source_word: כֹּחַ וּגְבוּרָה
  choice: kapangyarihan at kalakasan
  rationale: Natural na pares sa Tagalog na naghahayag ng kakayahan at makapangyarihang lakas.
- source_word: וְאֵין עִמְּךָ לְהִתְיַצֵּב
  choice: walang sinumang makatatayo laban sa inyo
  rationale: Ipinahahayag ang kontekstuwal na diwa ng pagharap o pagtindig bilang kalaban habang pinananatili ang larawan ng “pagtayo.”
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Pangngalang pantangi ang Tetragrammaton sa teksto; pinananatili ng “Yahweh” ang hayag na pangalang tipan sa halip na palitan ito ng titulo.
- issue: Saklaw ng אֲבֹתֵינוּ
  choice: aming mga ninuno
  alternative: aming mga ama
  rationale: Bagaman panlalaking pangmaramihan ang anyong Hebreo at maaaring literal na “mga ama,” sa kontekstong pangkasaysayan at tipan ay tumutukoy ito sa mga ninunong salinlahi; inilalahad sa talababa ang literal na anyo.
- issue: Diwa ng לְהִתְיַצֵּב
  choice: makatatayo laban sa inyo
  alternative: makalalaban sa inyo; makapipigil sa inyo
  rationale: Pinananatili ang metapora ng pagtayo at ang kontekstuwal na diwa ng pagsalungat, nang hindi ito nililimitahan sa isang partikular na uri ng pakikipaglaban.
translation_notes:
  register: Modernong Filipino na marangal at angkop sa panalangin. Ginamit ang magalang na panghalip na “kayo/inyo” para sa Diyos, karaniwan sa debosyonal na Tagalog, habang iniwasan ang labis na makaluma o teknikal na pananalita.
