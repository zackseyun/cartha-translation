  naturalness: Natural at marangal ang “kayo/inyo” para sa Diyos sa modernong Filipino Tagalog. Mas maayos na pag-isahin ang dalawang kaugnay na pagpapatibay sa iisang retorikal na tanong upang hindi maging payak na pahayag ang ikalawang bahagi.
  terminology: Wasto ang “Yahweh,” “mga kaharian ng mga bansa,” “nasa inyong kamay,” at “kapangyarihan at kalakasan.” Ang “mga ninuno” ay angkop bilang alternatibo sa talababa, ngunit hindi bilang pangunahing salin dahil “mga ama” ang anyong Hebreo.
