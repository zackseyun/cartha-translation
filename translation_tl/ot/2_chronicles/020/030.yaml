  yaml_path: translation/ot/2_chronicles/020/030.yaml
  text: So the kingdom of Jehoshaphat was at peace[a], and his God gave him rest all around.
translation:
  language: tl
  text: At naging payapa[a] ang kaharian ni Jehosafat, at binigyan siya ng kanyang Diyos ng kapahingahan sa lahat ng panig.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “naging tahimik.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּשְׁקֹט
  choice: naging payapa
  rationale: Ang pandiwang שׁקט ay tumutukoy sa pagiging tahimik, panatag, o malaya sa kaguluhan. Kapag kaharian ang simuno, likas at malinaw sa makabagong Tagalog ang “naging payapa.”
- source_word: מַלְכוּת
  choice: kaharian
  rationale: Tumutukoy ito sa kaharian o nasasakupan ni Jehosafat; “kaharian” ang karaniwan at angkop na salin sa kontekstong pangkasaysayan.
- source_word: יְהוֹשָׁפָט
  choice: Jehosafat
  rationale: Ginamit ang anyong madaling kilalanin sa Tagalog habang malapit na tinutumbasan ang pangalang Hebreo.
- source_word: וַיָּנַח
  choice: binigyan siya ng kapahingahan
  rationale: 'Ang anyong Hiphil ng נוח ay causative: pinangyari ng Diyos na makaranas siya ng pahinga o katiwasayan. Pinananatili ng parirala ang tahasang pagkilos ng Diyos.'
- source_word: אֱלֹהָיו
  choice: kanyang Diyos
  rationale: Tuwirang inilalarawan ng anyo ang Diyos ni Jehosafat.
- source_word: מִסָּבִיב
  choice: sa lahat ng dako
  rationale: Ipinahihiwatig ng parirala ang kapahingahan mula sa mga panganib sa buong paligid. Ang “sa lahat ng dako” ay natural at pinananatili ang saklaw sa bawat panig.
- source_word: וַ
  choice: at
  rationale: Pinananatili ng “at” ang koordinasyon ng dalawang sugnay sa Hebreo nang hindi ipinipilit na paliwanag lamang ang ugnayan ng mga ito.
theological_decisions:
- issue: Pagkilos ng Diyos bilang pinagmulan ng kapahingahan
  choice: “binigyan siya ng kanyang Diyos ng kapahingahan”
  alternative: “nagkaroon siya ng kapahingahan mula sa kanyang Diyos”
  rationale: Tahasan at causative sa Hebreo ang pagkilos ng Diyos. Ipinakikita ng salin na ang katiwasayan ni Jehosafat ay kaloob ng Diyos nang hindi dinaragdagan ang sinasabi ng teksto.
- issue: Ugnayan ng kapayapaan ng kaharian at ng kaloob na kapahingahan
  choice: Pinag-ugnay ang mga sugnay sa pamamagitan ng “at.”
  alternative: “sapagkat binigyan siya…”
  rationale: Maaaring unawain ang ikalawang sugnay bilang dahilan ng una, ngunit koordinasyon ang tahasang anyo sa Hebreo. Pinananatili ng “at” ang posibleng ugnayan nang hindi nilulutas ang bahagyang kalabuan.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ang “naging payapa” ay mas idiomatiko para sa isang kaharian kaysa sa literal na “naging tahimik,” samantalang ang “kapahingahan” ay nagpapanatili sa bokabularyo at teolohikal na diin ng pinagmulang teksto.
