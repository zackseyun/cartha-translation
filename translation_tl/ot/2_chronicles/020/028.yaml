  source_fidelity: Ang draft ay wastong naghahatid ng Jerusalem, mga instrumentong de-kuwerdas, mga trumpeta, at ang bahay ni Yahweh. Gayunman, ang “At dumating sila sa Jerusalem ... at nagtungo sa bahay ni Yahweh” ay ginagawang dalawang magkasunod na kilos ang iisang pandiwang וַיָּבֹאוּ (“dumating/sumapit”) sa Hebreo. Mas tapat na panatilihin ang bahay ni Yahweh bilang tiyak na hantungan sa Jerusalem.
  naturalness: Likas ang mga katawagang “alpa,” “lira,” at “trompeta.” Mas malinaw at mas maayos ang daloy kapag ang “sa bahay ni Yahweh” ay inilapit sa “sa Jerusalem,” sa halip na magdagdag ng “nagtungo.”
