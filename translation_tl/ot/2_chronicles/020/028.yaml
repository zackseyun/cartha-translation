  text: וַ/יָּבֹ֨אוּ֙ יְר֣וּשָׁלִַ֔ם בִּ/נְבָלִ֥ים וּ/בְ/כִנֹּר֖וֹת וּ/בַ/חֲצֹצְר֑וֹת אֶל בֵּ֖ית יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/028.yaml
  text: And they came to Jerusalem with harps and lyres and trumpets[b][a], to the house of Yahweh.
translation:
  language: tl
  text: At dumating sila sa Jerusalem, sa bahay ni Yahweh[b], na may mga alpa[a], lira, at trompeta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga instrumentong tulad ng alpa o lute”; hindi tiyak ang eksaktong anyo ng sinaunang instrumentong de-kuwerdas na tinutukoy ng salitang Hebreo na נְבָלִים.
    reason: lexical_alternative
  - marker: b
    text: O “templo ni Yahweh”; literal na “bahay ni Yahweh.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: At dumating sila
  rationale: Isinasalaysay ng waw-consecutive at ng pandiwang בוא ang kasunod na pangyayari. Likas sa modernong Tagalog ang “dumating” at hindi nito ipinapalagay na ang tinutukoy ay mismong pagpasok sa lungsod.
- source_word: יְרוּשָׁלִַם
  choice: Jerusalem
  rationale: Karaniwang anyo ng pangalan ng lugar sa modernong Tagalog.
- source_word: בִּנְבָלִים
  choice: na may mga alpa[a]
  rationale: Ang נבל ay isang sinaunang instrumentong de-kuwerdas na maaaring kahawig ng alpa o lute. Ginamit ang pamilyar na “alpa,” habang pinanatili sa talababa ang kawalang-katiyakan sa eksaktong uri nito.
- source_word: וּבְכִנֹּרוֹת
  choice: lira
  rationale: Ang כִּנּוֹר ay karaniwang kinikilalang lira. Pinananatili nitong magkaiba ang dalawang instrumentong de-kuwerdas sa Hebreo.
- source_word: וּבַחֲצֹצְרוֹת
  choice: at trumpeta
  rationale: Ang חֲצֹצְרָה ay trumpeta, karaniwang tuwid na instrumentong ginagamit sa seremonyang panrelihiyon. Hindi idinagdag ang “pilak” sapagkat wala ito sa talata.
- source_word: אֶל בֵּית יְהוָה
  choice: at nagtungo sa bahay ni Yahweh[b]
  rationale: Ipinahihiwatig ng אֶל ang patutunguhan. Ang pag-uulit ng pandiwang “nagtungo” ay natural sa Tagalog at nililinaw na ang bahay ni Yahweh ang hantungan, hindi isa pang kasangkapan ng pagdating. Pinananatili ng “bahay” ang literal na larawan ng Hebreo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinalin ang Tetragrammaton bilang personal na pangalang “Yahweh,” sa halip na palitan ito ng titulong “PANGINOON.”
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; ang PANGINOON
  rationale: Tuwirang ginagamit sa tekstong Hebreo ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalang tipan nang hindi ito pinapalitan ng isang titulo.
- issue: Paglalahad sa בֵּית יְהוָה
  choice: bahay ni Yahweh
  alternative: templo ni Yahweh
  rationale: Literal na “bahay ni Yahweh” ang parirala. Tama sa konteksto ang “templo,” ngunit mas interpretatibo iyon, kaya inilagay bilang alternatibo sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “lira” upang maiba ito sa “alpa,” at bahagyang inayos ang sintaks sa “at nagtungo” upang maging likas at hindi malabo sa Tagalog habang pinananatili ang iisang galaw na inilalarawan ng Hebreo.
