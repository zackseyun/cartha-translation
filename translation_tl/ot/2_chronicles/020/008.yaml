  text: And they lived in it and built for you in it a sanctuary for your name[a], saying[b],
translation:
  language: tl
  text: 'Nanirahan sila roon[a] at nagtayo roon para sa iyo ng isang santuwaryo para sa iyong pangalan,[b] at sinabi:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “tumira sila roon” o “nanirahan sila sa lupaing iyon.”
    reason: lexical_alternative
  - marker: b
    text: Ang “santuwaryo para sa iyong pangalan” ay isang banal na lugar na itinalaga sa pangalan ng PANGINOON—samakatuwid, sa kanyang ipinahayag na presensya at karangalan.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּשְׁבוּ
  choice: Nanirahan sila
  rationale: Ang pandiwang ישׁב ay tumutukoy rito sa paninirahan sa lupain. Ang “nanirahan” ay natural sa modernong Filipino at hindi nito labis na itinatampok ang unang pagsakop o pagtira lamang.
- source_word: בָהּ
  choice: roon
  rationale: Ang hulaping pambabaeng isahan ay tumutukoy sa lupain. Mas natural sa Filipino ang “roon” kaysa sa literal na “sa loob nito,” at malinaw ang pook na tinutukoy mula sa konteksto.
- source_word: וַיִּבְנוּ
  choice: nagtayo
  rationale: Karaniwang katumbas ito ng בנה kapag gusali o banal na dako ang itinatayo.
- source_word: לְךָ
  choice: para sa iyo
  rationale: 'Ipinahihiwatig ng לְ ang kapakinabangan at pagtatalaga: ang santuwaryo ay itinayo para sa Diyos.'
- source_word: מִקְדָּשׁ
  choice: isang santuwaryo
  rationale: Pinananatili ng “santuwaryo” ang diwa ng isang banal at itinalagang lugar nang hindi agad pinapantay ang salita sa institusyonal na katawagang “templo.”
- source_word: לְשִׁמְךָ
  choice: para sa iyong pangalan
  rationale: Direktang pinananatili nito ang biblikal na pahayag tungkol sa isang dakong itinalaga sa pangalan, ipinahayag na presensya, at karangalan ng Diyos.
- source_word: לֵאמֹר
  choice: na sinasabi,
  rationale: Ipinauugnay nito ang talata sa mga salitang susunod. Ang kuwit ay nagpapahiwatig na hindi pa tapos ang pangungusap.
theological_decisions:
- issue: Kahulugan ng “santuwaryo para sa iyong pangalan”
  choice: Isang banal na dakong itinalaga sa pangalan ng Diyos
  alternative: Isang templo para sa iyong karangalan; isang banal na dakong nagtataglay ng iyong pangalan
  rationale: Pinananatili ng salin ang teolohiya ng Lumang Tipan na iniuugnay ang santuwaryo sa pangalan at ipinahayag na presensya ng Diyos, nang hindi ipinahihiwatig na nakukulong ang Diyos sa gusali.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “nanirahan,” “nagtayo,” at “roon” para sa likas na daloy, habang pinanatili ang pormal at teolohikal na mahalagang pariralang “santuwaryo para sa iyong pangalan.”
