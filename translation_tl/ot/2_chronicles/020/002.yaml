  text: וַ/יָּבֹ֗אוּ וַ/יַּגִּ֤ידוּ לִֽ/יהוֹשָׁפָט֙ לֵ/אמֹ֔ר בָּ֣א עָלֶ֜י/ךָ הָמ֥וֹן רָ֛ב מֵ/עֵ֥בֶר לַ/יָּ֖ם מֵ/אֲרָ֑ם וְ/הִנָּ/ם֙ בְּ/חַֽצְצ֣וֹן תָּמָ֔ר הִ֖יא עֵ֥ין גֶּֽדִי׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/002.yaml
  text: Then they came and reported to Jehoshaphat[a], saying, “A great multitude is coming against you from beyond the sea, from Aram; and behold, they are in Hazazon-tamar” (that is[b], En-gedi).
translation:
  language: tl
  text: 'Pagkatapos, may mga dumating at nag-ulat kay Jehoshafat: “Isang napakalaking pulutong ang dumarating laban sa iyo mula sa kabila ng dagat, mula sa Aram.[a] Narito, nasa Hazazon-Tamar na sila, na tinatawag ding En-Gedi.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Aram ang nasa tekstong Hebreo; “Edom” ang mababasa sa ilang salin batay sa mungkahing alternatibong pagbasa.
    reason: textual_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: Pagkatapos, may mga dumating
  rationale: Ipinahahayag ng anyong pasalaysay ang kasunod na pangyayari. Likas sa modernong Tagalog ang “Pagkatapos,” habang pinananatili ng “may mga dumating” ang di-tiyak na mga tagapagbalita.
- source_word: וַיַּגִּידוּ
  choice: nag-ulat
  rationale: Ang Hiphil ng נגד ay nangangahulugang ipaalam o iulat; ang “nag-ulat” ay angkop sa agarang balitang inihatid sa hari.
- source_word: לֵאמֹר
  choice: ipinakilala sa pamamagitan ng tutuldok
  rationale: Karaniwang panandang pambanggit ito sa Hebreo. Sa natural na modernong Tagalog, sapat at malinaw ang tutuldok bago ang tuwirang sipi.
- source_word: בָּא
  choice: dumarating
  rationale: Bagaman anyong qatal, inilalarawan nito sa agarang ulat ang malaking pangkat na paparating; pinananatili ng aspektong imperpektibo sa Tagalog ang nalalapit na kilos.
- source_word: הָמוֹן רָב
  choice: isang napakalaking pulutong
  rationale: Ang הָמוֹן ay malaking karamihan o pulutong, at pinalalakas ito ng רָב. Hindi ito isinaling “hukbo” upang hindi gawing mas tiyak kaysa sa salitang Hebreo.
- source_word: עָלֶיךָ
  choice: laban sa iyo
  rationale: Sa kontekstong mapanlaban, malinaw na ipinahihiwatig ng עַל ang paglusob laban kay Jehoshafat.
- source_word: מֵעֵבֶר לַיָּם
  choice: mula sa kabila ng dagat
  rationale: Direktang pinananatili nito ang pananaw na heograpikal ng pariralang “mula sa kabilang panig ng dagat” sa natural na Tagalog.
- source_word: מֵאֲרָם
  choice: mula sa Aram
  rationale: “Aram” ang tahasang pagbasa ng tekstong Hebreo ng WLC. Hindi ito pinalitan sa pangunahing teksto ng “Edom” o ng mas huling pangalang “Syria.”
- source_word: וְהִנָּם
  choice: Narito, ... na sila
  rationale: Pinananatili ng “Narito” at ng “na” ang biglaan at agarang diin ng הִנֵּה na may hulaping panghalip.
- source_word: בְּחַצְצוֹן תָּמָר
  choice: nasa Hazazon-Tamar
  rationale: Isinalin ang lokatibong בְּ sa likas na Tagalog na “nasa” at pinanatili ang pangalan ng lugar sa transliterasyon.
- source_word: הִיא עֵין גֶּדִי
  choice: na tinatawag ding En-Gedi
  rationale: Ipinakikilala ng sugnay ang Hazazon-Tamar bilang En-Gedi. Natural sa Tagalog ang pormulang ito at hindi nito ipinapalagay na dalawang magkaibang lugar ang tinutukoy.
theological_decisions:
- issue: 'Pagbasa sa pinagmulan ng pulutong: Aram o Edom'
  choice: Aram sa pangunahing teksto
  alternative: Edom
  rationale: מֵאֲרָם (“mula sa Aram”) ang nasa ibinigay na tekstong Hebreo. Dahil maaaring ipaliwanag ng “Edom” ang heograpiya ngunit hindi iyon ang pagbasa ng WLC, pinanatili ang Aram at inilagay ang alternatibo sa talababa sa halip na tahimik na itama ang teksto.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “napakalaking pulutong” sa halip na mas teknikal na “hukbo,” at pinanatili ang mga pangalang Hebreo. Ang tutuldok ay gumaganap bilang natural na panandang pambanggit sa halip na isalin nang hiwalay ang לֵאמֹר.
