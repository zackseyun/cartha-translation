base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/029.yaml
  text: And the fear of God came upon all the kingdoms of the lands when they heard that Yahweh had fought against the enemies of Israel[a].
translation:
  language: tl
  text: At dumating ang takot sa Diyos sa lahat ng kaharian ng mga lupain nang marinig nilang nakipaglaban si Yahweh laban sa mga kaaway ng Israel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “sindak mula sa Diyos.” Ang pariralang Hebreo ay maaaring tumukoy sa takot na kaugnay ng presensiya o pagkilos ng Diyos.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: At sumapit
  rationale: Ipinahahayag ng anyong pasalaysay ang pagdating o pagsisimula ng isang kalagayan; natural na naihahatid ng “sumapit” ang paglaganap ng takot sa mga kaharian.
- source_word: פַּחַד אֱלֹהִים
  choice: ang takot sa Diyos
  rationale: Pinananatili nito ang anyong konstrukto at ang tunay na posibilidad na tumukoy sa takot na kaugnay ng Diyos o sa sindak na nagmula sa kanya. Ipinaliliwanag sa talababa ang alternatibo.
- source_word: עַל כָּל מַמְלְכוֹת הָאֲרָצוֹת
  choice: sa lahat ng kaharian sa mga lupain
  rationale: Ang “mga kaharian” at maramihang “mga lupain” ay kapuwa pinananatili, nang hindi ipinahihiwatig na tiyak na buong daigdig ang saklaw.
- source_word: בְּשָׁמְעָם
  choice: nang marinig nila
  rationale: Ang pang-ukol na may infinitive construct at hulaping panghalip ay nagsasaad ng panahong pangyayari; malinaw at natural ito sa modernong Tagalog.
- source_word: כִּי
  choice: -ng
  rationale: Pagkatapos ng “marinig,” ipinakikilala nito ang nilalaman ng kanilang narinig; likas itong ipinapahayag sa Tagalog sa pamamagitan ng pang-angkop.
- source_word: נִלְחַם
  choice: nakipaglaban
  rationale: Ipinahahayag ng ganap na anyo ang natapos nang pagkilos ni Yahweh na nabalitaan ng mga kaharian.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Direktang isinasalin sa anyong transliterasyon ang personal na pangalang banal sa halip na palitan ito ng isang titulo.
- source_word: עִם
  choice: laban sa
  rationale: Bagaman karaniwang nangangahulugang “kasama,” kasama ng pandiwang makipaglaban ay tinutukoy nito rito ang kalabang panig; hinihingi ng konteksto ang “laban sa.”
- source_word: אוֹיְבֵי יִשְׂרָאֵל
  choice: mga kaaway ng Israel
  rationale: Tuwirang inililipat ang ugnayang konstrukto at pinananatili ang malinaw at marangal na pananalita.
theological_decisions:
- issue: Kahulugan ng פַּחַד אֱלֹהִים
  choice: takot sa Diyos
  alternative: sindak mula sa Diyos
  rationale: Pinananatili ng pangunahing teksto ang pormal na ugnayan ng mga salita at hindi ipinapasiya kung ito ay takot na nakatuon sa Diyos o sindak na dulot ng kanyang pagkilos; inilalahad sa talababa ang mahalagang alternatibo.
- issue: Pagsasalin ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Ang tekstong Hebreo ay gumagamit ng Tetragrammaton; pinananatili ang personal na pangalan sa transliterasyong “Yahweh” sa halip na palitan ng titulo.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, natural, at marangal. Pinanatili ang bahagyang pormal na himig ng salaysay at ang leksikal na kalabuan ng “takot sa Diyos,” habang iniwasan ang pananalitang labis na arkaiko o denominasyonal.
