    issue: Hindi natural at malabo ang “ay sinakanya ng Espiritu ni Yahweh.”
    rationale: Ang “sinakanya” ay hindi karaniwang pandiwang makabago sa Filipino at maaaring hindi agad maunawaan. Kailangan ang malinaw na pandiwang nagsasaad na dumating o sumapit sa kanya ang Espiritu.
  revised_text: At sa gitna ng kapulungan, dumating kay Jahaziel—anak ni Zacarias, anak ni Benaias, anak ni Jeiel, anak ni Matanias, ang Levita, mula sa mga anak ni Asaf—ang Espiritu ni Yahweh.
