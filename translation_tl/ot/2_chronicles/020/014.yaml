source:
  edition: WLC
  text: וְ/יַחֲזִיאֵ֡ל בֶּן זְכַרְיָ֡הוּ בֶּן בְּ֠נָיָה בֶּן יְעִיאֵ֧ל בֶּן מַתַּנְיָ֛ה הַ/לֵּוִ֖י מִן בְּנֵ֣י אָסָ֑ף הָיְתָ֤ה עָלָי/ו֙ ר֣וּחַ יְהוָ֔ה בְּ/ת֖וֹךְ הַ/קָּהָֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/014.yaml
  text: And Jahaziel son of Zechariah, son of Benaiah, son of Jeiel, son of Mattaniah, the Levite, from the sons of Asaph—the Spirit of Yahweh came upon him in the midst of the assembly.
translation:
  language: tl
  text: At sa gitna ng kapulungan, dumating kay Jahaziel—anak ni Zacarias, anak ni Benaias, anak ni Jeiel, anak ni Matanias, ang Levita, mula sa mga anak ni Asaf—ang Espiritu ni Yahweh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְיַחֲזִיאֵל
  choice: At si Yahaziel
  rationale: Pinananatili ng “At” ang karaniwang dugtong sa salaysay. Ang pangalang Hebreo ay isinalin sa anyong transliterasyong malinaw at madaling basahin sa Filipino.
- source_word: בֶּן זְכַרְיָהוּ בֶּן בְּנָיָה בֶּן יְעִיאֵל בֶּן מַתַּנְיָה
  choice: anak ni Zacarias, na anak ni Benaias, na anak ni Jeiel, na anak ni Matanias
  rationale: Iningatan ang bawat pag-uulit ng בֶּן upang maipakita ang tahasang talaan ng angkan, sa halip na paikliin ito bilang “inapo.” Ginamit ang mga pangalang anyong pamilyar at nababasa sa Filipino.
- source_word: הַלֵּוִי
  choice: isang Levita
  rationale: Bagaman may pantukoy ang Hebreo, natural na ipinakikilala sa Filipino ang pagkakakilanlan sa pariralang “isang Levita.” Hindi kayang tumbasan nang tuwiran ng “ang Levita” ang gamit ng artikulo rito nang hindi nagiging matigas o tila tumutukoy sa iisang kilala nang Levita.
- source_word: מִן בְּנֵי אָסָף
  choice: mula sa mga anak ni Asaf
  rationale: Pinananatili nito ang larawan ng pinagmulang angkan o pangkat na ipinahihiwatig ng Hebreo, nang hindi ito pinaiikli sa mas malawak na “mga inapo.”
- source_word: הָיְתָה עָלָיו רוּחַ יְהוָה
  choice: sinakanya ng Espiritu ni Yahweh
  rationale: Ang “sinakanya” ay natural na biblikal na Filipino para sa pangyayaring dumating o lumukob sa isang tao ang Espiritu upang magsalita o kumilos. Hindi ginamit ang mas statikong “nasa kanya,” at iniwasan ang “napuspos” dahil hindi iyon ang mismong idyoma ng Hebreo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang pinananatili ang personal na banal na pangalan sa halip na palitan ito ng titulong “PANGINOON.”
- source_word: בְּתוֹךְ הַקָּהָל
  choice: sa gitna ng kapulungan
  rationale: Ang “sa gitna” ay tumutugon sa puwersang panlunan ng בְּתוֹךְ, at ang “kapulungan” ay dignidad ngunit malinaw na katawagan sa nagkakatipong bayan.
theological_decisions:
- issue: Pagpapakahulugan sa רוּחַ יְהוָה
  choice: ang Espiritu ni Yahweh
  alternative: ang espiritu ni Yahweh
  rationale: Sa konteksto, ang parirala ay tumutukoy sa banal na Espiritung sumakanya kay Yahaziel para sa propetikong pagpapahayag, hindi lamang sa damdamin o udyok ng tao. Ang malaking titik ay nagpapalinaw sa tinutukoy nang walang idinaragdag na paliwanag sa talata.
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Dahil personal na pangalan ang Tetragrammaton sa tekstong Hebreo, pinanatili itong “Yahweh” sa halip na palitan ng isang titulo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang buong hanay ng angkan at ang bahagyang pormal na himig ng pampublikong salaysay, habang ginawang natural ang apposisyon sa pamamagitan ng mga gitling.
