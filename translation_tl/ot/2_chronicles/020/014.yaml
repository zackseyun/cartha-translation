revisions:
- from: At si Yahaziel na anak ni Zacarias, na anak ni Benaias, na anak ni Jeiel, na anak ni Matanias—isang Levita mula sa mga anak ni Asaf—ay sinakanya ng Espiritu ni Yahweh sa gitna ng kapulungan.
  to: At sa gitna ng kapulungan, dumating kay Jahaziel—anak ni Zacarias, anak ni Benaias, anak ni Jeiel, anak ni Matanias, ang Levita, mula sa mga anak ni Asaf—ang Espiritu ni Yahweh.
  rationale: Pinalitan ang di-likas na “sinakanya” ng “dumating kay Jahaziel,” na malinaw na katumbas ng idyomang “ang Espiritu ni Yahweh ay dumating sa kanya.” Inayos ang pangungusap upang manatiling buo ang genealogy at ang pariralang “sa gitna ng kapulungan,” habang hindi binabago ang kahulugan.
