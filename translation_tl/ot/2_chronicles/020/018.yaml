  source_fidelity: 'Tumpak ang pangunahing diwa: yumukod si Jehoshafat, at ang buong Juda kasama ng mga naninirahan sa Jerusalem ay nagpatirapa sa harap ni Yahweh upang sambahin siya. Gayunman, ang “na ang mukha ay nakadapa sa lupa” ay hindi wastong likas na paglalarawan sa Tagalog, sapagkat ang tao, hindi ang mukha, ang karaniwang sinasabing nakadapa. Ang “hanggang sa lupa” ay malinaw na naghahatid ng Hebreong idyomang ‘mukha tungo sa lupa’ nang hindi nagdaragdag ng kahulugan.'
  naturalness: Dignified at modernong Tagalog ang kabuuang register. Mas natural at masidhi ang “yumukod si Jehoshafat hanggang sa lupa” kaysa “yumukod ... na ang mukha ay nakadapa sa lupa.” Ang natitirang mga parirala ay natural at malinaw.
  terminology: Wasto at pare-pareho ang “Yahweh” para sa inuulit na יהוה. Wasto ang “Juda,” “Jerusalem,” “nagpatirapa,” at “sumamba.” Pinananatili ng “upang sumamba kay Yahweh” ang inuulit na banal na pangalan at ang layuning ipinahihiwatig ng infinitive.
