base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/018.yaml
  text: Then Jehoshaphat bowed with his face to the ground[a], and all Judah and the inhabitants of Jerusalem fell down before Yahweh to worship Yahweh.
translation:
  language: tl
  text: At yumukod si Jehoshafat hanggang sa lupa, at ang buong Juda at ang mga naninirahan sa Jerusalem ay nagpatirapa sa harap ni Yahweh upang sumamba kay Yahweh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקֹּד
  choice: yumukod
  rationale: Ang קָדַד ay tumutukoy sa pagyukod o pagyukong mababa bilang paggalang. Likas at malinaw sa modernong Tagalog ang “yumukod,” habang inilalarawan ng kasunod na parirala ang lalim ng kilos.
- source_word: אַפַּיִם אָרְצָה
  choice: na ang mukha ay nakadapa sa lupa
  rationale: Idyoma itong literal na tumutukoy sa mukha na nakaharap sa lupa at nagpapahiwatig ng lubos na pagpapatirapa. Inihahatid ng salin ang konkretong postura sa natural na Tagalog.
- source_word: וְכָל יְהוּדָה
  choice: ang buong Juda
  rationale: Ginagamit ang Juda bilang kolektibong pantukoy sa sambayanan. Pinananatili ng “ang buong Juda” ang maikli at kolektibong anyo ng Hebreo.
- source_word: וְיֹשְׁבֵי יְרוּשָׁלִַם
  choice: ang mga naninirahan sa Jerusalem
  rationale: Ang participle ay tumutukoy sa mga taong nakatira roon. Karaniwan at malinaw sa modernong Tagalog ang “mga naninirahan.”
- source_word: נָפְלוּ לִפְנֵי יְהוָה
  choice: nagpatirapa sa harap ni Yahweh
  rationale: Bagaman literal na “bumagsak sa harap,” sa kontekstong pagsamba ay inilalarawan nito ang kusang pagpapatirapa. Ang “nagpatirapa” ay malinaw na naghahatid ng kilos nang hindi ipinahihiwatig ang aksidenteng pagkabuwal.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang banal na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: לְהִשְׁתַּחֲוֺת
  choice: upang sumamba
  rationale: Ang hitpael ng שׁחה ay maaaring mangahulugang yumukod o magpatirapa bilang pagsamba. Dahil malinaw nang sinabi ang pisikal na kilos, likas na ipinapahayag ng “upang sumamba” ang layunin nito.
- source_word: לַיהוָה
  choice: kay Yahweh
  rationale: Inuulit ng Hebreo ang banal na pangalan bilang pinag-uukulan ng pagsamba; pinananatili rin ito sa salin sa halip na gawing panghalip.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehovah
  rationale: Direktang ginagamit sa talata ang Tetragrammaton. Ang “Yahweh” ay transliterasyong nagpapanatili sa personal na pangalan at hindi ito pinapalitan ng titulong “PANGINOON.”
- issue: Kahulugan ng לְהִשְׁתַּחֲוֺת sa konteksto
  choice: upang sumamba
  alternative: upang yumukod / upang magpatirapa
  rationale: Maaaring tumukoy ang pandiwa kapwa sa pisikal na pagyukod at sa pagsamba. Dahil naipahayag na ang pagpapatirapa, pinipili ang “sumamba” para ihayag ang layunin nang hindi binubura ang pisikal na kilos.
translation_notes:
  register: Modernong Filipino Tagalog na dignified ngunit madaling maunawaan. Pinanatili ang pag-uulit ng “Yahweh” at ang kolektibong “buong Juda.” Walang footnote dahil walang mahalagang ambiguwidad na hindi kayang katawanin ng pangunahing teksto; ang kilos ng נפל ay ipinahayag bilang “nagpatirapa” ayon sa malinaw na konteksto ng pagsamba.
