  text: וּ/בְ/עֵת֩ הֵחֵ֨לּוּ בְ/רִנָּ֜ה וּ/תְהִלָּ֗ה נָתַ֣ן יְהוָ֣ה מְ֠אָֽרְבִים עַל בְּנֵ֨י עַמּ֜וֹן מוֹאָ֧ב וְ/הַר שֵׂעִ֛יר הַ/בָּאִ֥ים לִֽ/יהוּדָ֖ה וַ/יִּנָּגֵֽפוּ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/022.yaml
  text: And at the time they began with singing and praise[a], Yahweh set ambushes against the Ammonites, Moab, and Mount Seir, who were coming against Judah[b], and they were struck down.
translation:
  language: tl
  text: At nang magsimula silang umawit at magpuri, naglagay si Yahweh ng mga pananambang[a] laban sa mga Ammonita, sa Moab, at sa Bundok Seir, na dumarating laban sa Juda[b]; at sila ay pinabagsak.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga nananambang” o “mga taong nag-aabang.” Ang anyong Hebreo ay maaaring tumukoy sa mga taong nag-aabang upang manambang, gayundin sa pananambang sa mas pangkalahatang diwa.
    reason: lexical_alternative
  - marker: b
    text: O “na dumarating sa Juda.” Maaaring direksiyon lamang ang literal na pahayag, ngunit ipinakikita ng konteksto na kaaway ang mga dumarating.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְעֵת הֵחֵלּוּ
  choice: At nang magsimula sila
  rationale: Likas na ipinahahayag sa Tagalog ang χρονological na ugnayan ng pangungusap habang pinananatili ang punto kung kailan nagsimula ang kasunod na pagkilos.
- source_word: בְרִנָּה וּתְהִלָּה
  choice: umawit at magpuri
  rationale: Sa konteksto ng pagsamba, malinaw at natural itong katumbas ng pag-awit o masayang paghiyaw at pagpuri, nang hindi labis na nililimitahan ang רִנָּה sa simpleng pagsasalita.
- source_word: נָתַן יְהוָה
  choice: naglagay si Yahweh
  rationale: Pinananatili ang karaniwang diwa ng נָתַן na ‘naglagay’ at ang tuwirang banal na pangalang Yahweh.
- source_word: מְאָרְבִים
  choice: mga pananambang
  rationale: Pinananatili ng pangngalang ito ang posibilidad na tumukoy ang Hebreo sa mga pananambang bilang pangyayari o paraan, nang hindi ipinapalagay sa pangunahing teksto kung sino ang mga nanambang.
- source_word: בְּנֵי עַמּוֹן מוֹאָב וְהַר שֵׂעִיר
  choice: mga Ammonita, Moab, at Bundok Seir
  rationale: ‘Mga Ammonita’ ang natural na katumbas ng ‘mga anak ni Ammon,’ samantalang pinananatili ang Moab at Bundok Seir bilang mga katawagang heograpiko at pampangkat.
- source_word: הַבָּאִים לִיהוּדָה
  choice: na dumarating laban sa Juda
  rationale: Maaaring literal na ‘papunta sa Juda’ ang לִיהוּדָה, ngunit malinaw na pagsalakay ang konteksto; ipinahahayag ng ‘laban sa’ ang kontekstuwal na puwersa habang itinatala sa talababa ang mas literal na alternatibo.
- source_word: וַיִּנָּגֵפוּ
  choice: at sila ay nalupig
  rationale: Ipinahahayag ang pasibong bunga ng Niphal—sila ay natalo o pinabagsak—nang hindi tahasang nagdaragdag ng hindi binanggit na ahente.
theological_decisions:
- issue: Pagbaybay sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehovah
  rationale: Tuwirang ginagamit ng tekstong Hebreo ang Tetragrammaton; pinananatili ng ‘Yahweh’ ang personal na pangalang tipan sa halip na palitan ito ng titulo.
- issue: Pagkakakilanlan ng מְאָרְבִים
  choice: mga pananambang
  alternative: mga nanambang / mga lalaking nag-abang
  rationale: Hindi nilulutas ng pangunahing salin kung ang anyo ay tumutukoy sa mga taong nanambang o sa pananambang sa mas pangkalahatang diwa; inilalahad ang alternatibo sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘umawit at magpuri’ para sa likas na daloy, at pinanatili sa mga talababa ang mahahalagang leksikal na posibilidad nang hindi nagpapasok ng denominasyonal na paliwanag.
