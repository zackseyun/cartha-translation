base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/034.yaml
  text: The rest of the acts of Jehoshaphat[a], the first and the last, behold, they are written in the records of Jehu son of Hanani[b], which are included in the Book of the Kings of Israel.
translation:
  language: tl
  text: Ang iba pang mga ginawa ni Jehoshafat, ang una at ang huli, ay nakasulat nga sa mga tala[a] ni Jehu na anak ni Hanani, na isinama sa Aklat ng mga Hari ng Israel.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa salaysay ni Jehu na anak ni Hanani.” Sa Hebreo, “sa mga salita/mga tala ni Jehu na anak ni Hanani.”
    reason: lexical_alternative
  - marker: b
    text: Sa literal, ang sugnay sa Hebreo ay “na ipinaakyat niya sa ibabaw ng Aklat ng mga Hari ng Israel.” Malamang na nangangahulugan itong isinama ang tala ni Jehu sa mas malaking aklat na ito; hindi tiyak ang eksaktong ugnayang sintaktiko ng sugnay.
    reason: alternative_reading
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי יְהוֹשָׁפָט
  choice: Ang iba pang mga ginawa ni Jehoshafat
  rationale: Sa buod ng paghahari, ang דִּבְרֵי ay tumutukoy sa mga ginawa o pangyayari sa buhay ng hari, hindi lamang sa kaniyang mga salita. Likas sa modernong Tagalog ang “iba pang mga ginawa.”
- source_word: הָרִאשֹׁנִים וְהָאַחֲרֹנִים
  choice: mula sa una hanggang sa huli
  rationale: Ipinahahayag ng tambalang ito ang kabuuang saklaw ng mga ginawa ni Jehoshafat. Pinananatili ng salin ang merismo sa malinaw at natural na anyong Tagalog.
- source_word: הִנָּם כְּתוּבִים
  choice: ay nakasulat nga
  rationale: Ang “nakasulat” ay tuwirang katumbas ng כְּתוּבִים, samantalang ipinahahayag ng “nga” ang diin ng הִנָּם nang hindi gumagamit ng di-likas na “narito” sa pangungusap na ito.
- source_word: בְּדִבְרֵי יֵהוּא בֶן חֲנָנִי
  choice: sa mga tala ni Jehu na anak ni Hanani
  rationale: Sa konteksto, ang דִּבְרֵי ay isang nakasulat na sanggunian. Malinaw ang “mga tala” ngunit hindi nito ipinapalagay ang mas tiyak na uring pampanitikan gaya ng mga opisyal na taunang ulat.
- source_word: אֲשֶׁר הֹעֲלָה עַל סֵפֶר מַלְכֵי יִשְׂרָאֵל
  choice: na inilakip niya sa Aklat ng mga Hari ng Israel
  rationale: Aktibong singular ang pandiwang Hebreo at malamang na si Jehu ang paksa. Ang “inilakip niya” ay natural na naghahatid ng ideya na ang tala ay ipinasok o isinama sa mas malaking aklat, habang inilalahad sa talababa ang di-karaniwang literal na anyo.
- source_word: סֵפֶר מַלְכֵי יִשְׂרָאֵל
  choice: Aklat ng mga Hari ng Israel
  rationale: Pinananatili ang anyong pamagat ng binanggit na nakasulat na sanggunian at ang payak na kahulugan ng construct chain.
