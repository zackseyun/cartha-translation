revisions:
- from: Ang iba pang mga ginawa ni Jehoshafat, mula sa una hanggang sa huli, ay nakasulat nga sa mga tala ni Jehu na anak ni Hanani[a], na inilakip niya sa Aklat ng mga Hari ng Israel.[b]
  to: Ang iba pang mga ginawa ni Jehoshafat, ang una at ang huli, ay nakasulat nga sa mga tala[a] ni Jehu na anak ni Hanani, na isinama sa Aklat ng mga Hari ng Israel.[b]
  rationale: Pinalitan ang aktibong parirala ng pasibong “na isinama” upang mapanatili ang kawalang-katiyakan ng mahirap na Hebreong sugnay, nang hindi binabago ang malamang na kahulugang archival. Ginawang “ang una at ang huli” ang merismo upang mas malapít sa pinagmulan, at inayos ang ankla ng talababa a.
