translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “nakasulat nga” upang mapanatili ang diin ng Hebreo nang hindi maging lipas o pilit ang himig. Ang mga pangalang pantangi at ang pamagat ng sanggunian ay pinanatili sa karaniwang anyong biblikal.
