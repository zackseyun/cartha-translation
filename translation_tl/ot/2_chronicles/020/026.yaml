base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/026.yaml
  text: On the fourth day they assembled in the Valley of Beracah[a], because there they blessed Yahweh. Therefore they called the name of that place the Valley of Beracah to this day.
translation:
  language: tl
  text: Sa ikaapat na araw, nagtipon sila sa Lambak ng Beraca[a], sapagkat doon nila pinagpala si Yahweh. Kaya Lambak ng Beraca ang itinawag nila sa lugar na iyon; ito ang tawag dito hanggang sa araw na ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “Beraca” ay nangangahulugang “pagpapala.” Kaugnay nito ang salitang Hebreo na isinaling “pinagpala.”
    reason: Ipinaliliwanag ang kahulugan ng pangalan at pinananatili ang paglalaro ng salita sa pagitan ng בְּרָכָה at בֵּרֲכוּ.
lexical_decisions:
- source_word: נִקְהֲלוּ
  choice: nagtipon sila
  rationale: Ipinahahayag ng anyong Niphal ang pagdating at pagtitipon ng mga tao; natural at tuwiran sa makabagong Tagalog ang “nagtipon sila.”
- source_word: עֵמֶק בְּרָכָה
  choice: Lambak ng Beraca
  rationale: Isinalin ang pangkaraniwang pangngalang עֵמֶק bilang “Lambak” at tinumbasan sa baybay-Tagalog ang pangalang בְּרָכָה bilang “Beraca.” Ipinaliliwanag sa talababa ang kahulugan nito at ang paglalaro sa magkaugnay na salita.
- source_word: כִּי שָׁם בֵּרֲכוּ אֶת יְהוָה
  choice: sapagkat doon nila pinuri si Yahweh
  rationale: Causal ang כִּי, kaya “sapagkat.” Bagaman pangunahing nangangahulugang “pagpalain” ang ugat ברך, kapag ang Diyos ang layon, natural na ipinahahayag nito ang pagpuri o pagkilala sa kanya bilang pinagpala. Iniiwasan ng “pinuri” ang di-likas na pahiwatig na ang tao ang nagbibigay ng pagpapala sa Diyos, habang ipinaliliwanag sa talababa ang ugnayang leksikal sa pangalang Beraca.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinanatili ang personal na banal na pangalan bilang “Yahweh” sa halip na palitan ito ng isang titulo.
- source_word: קָרְאוּ אֶת שֵׁם הַמָּקוֹם הַהוּא
  choice: Lambak ng Beraca ang itinawag nila sa lugar na iyon
  rationale: Natural na katumbas sa Tagalog ng Hebreong pormula ng pagbibigay-pangalan, nang hindi pinananatili ang mekanikal na pariralang “tinawag ang pangalan.”
- source_word: עַד הַיּוֹם
  choice: hanggang sa araw na ito
  rationale: Karaniwang katumbas sa Tagalog ng idyomang Hebreo na nagsasaad na nananatili ang pangalan hanggang sa panahon ng manunulat.
theological_decisions:
- issue: Pagpapakahulugan sa בֵּרֲכוּ kapag si Yahweh ang layon
  choice: pinuri si Yahweh
  alternative: pinagpala si Yahweh
  rationale: Maaaring literal na tumbasan ang pandiwa ng “pinagpala,” ngunit maaari itong magpahiwatig sa modernong Tagalog na nagkakaloob ang tao ng pagpapala sa Diyos. Ang “pinuri” ay natural na naghahatid ng diwa ng pagpapahayag na pinagpala si Yahweh; pinananatili naman sa talababa ang mahalagang ugnayan nito sa בְּרָכָה, “pagpapala.”
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Pangalan mismo ang nasa tekstong Hebreo, kaya isinatitik ito bilang “Yahweh” sa halip na palitan ng titulong “PANGINOON.”
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “sapagkat” at “hanggang sa araw na ito” upang mapanatili ang bahagyang pormal na himig ng salaysay, habang nananatiling madaling maunawaan. Ang marker na [a] ay nasa pangunahing teksto at tumutugma sa talababa.
