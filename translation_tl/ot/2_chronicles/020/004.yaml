base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/004.yaml
  text: And Judah gathered together to seek Yahweh[b][a]; they even came from all the cities of Judah to seek Yahweh.
translation:
  language: tl
  text: Nagtipon ang mga taga-Juda upang humingi kay Yahweh[a]; dumating pa sila mula sa lahat ng lungsod ng Juda upang hanapin si Yahweh.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “upang humingi mula kay Yahweh.” Hindi tahasang sinasabi sa Hebreo kung ano ang hinihingi; maaaring ipahiwatig ng konteksto ang tulong o pagliligtas.'
    reason: lexical_alternative
  - marker: b
    text: 'Magkaiba nang bahagya ang pagkakabuo ng dalawang parirala sa Hebreo: sa una ay may diwang paghingi mula kay Yahweh; sa ikalawa, si Yahweh mismo ang tuwirang layon ng paghahanap.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקָּבְצוּ יְהוּדָה
  choice: Nagtipon ang mga taga-Juda
  rationale: Ang Niphal ng קבץ ay tumutukoy sa sama-samang pagtitipon. Ginawang “mga taga-Juda” ang kolektibong pangalang Juda upang maging malinaw at natural sa Tagalog na ang tinutukoy ay ang mga mamamayan.
- source_word: לְבַקֵּשׁ מֵיְהוָה
  choice: upang humingi ng tulong kay Yahweh
  rationale: Ang בקש na may מן ay literal na nagpapahiwatig ng paghahanap o paghingi mula kay Yahweh, ngunit hindi tahasang binabanggit ang hinihingi. Batay sa banta at panalangin sa konteksto, “tulong” ang likas na ipinahihiwatig; itinala sa talababa ang mas literal at hindi tiyak na anyo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinanatili ang personal na banal na pangalan sa pamamagitan ng karaniwang transliterasyong “Yahweh,” sa halip na palitan ito ng isang titulo.
- source_word: גַּם
  choice: pa
  rationale: 'Ipinahahayag ng “pa” ang diin ng גם: hindi lamang sila nagtipon, kundi dumating sila mula sa buong Juda.'
- source_word: מִכָּל עָרֵי יְהוּדָה
  choice: mula sa lahat ng lungsod ng Juda
  rationale: Malapit ito sa Hebreo at malinaw na ipinakikita ang malawak na pakikilahok mula sa buong kaharian.
- source_word: בָּאוּ לְבַקֵּשׁ אֶת יְהוָה
  choice: dumating sila … upang hanapin si Yahweh
  rationale: Pinananatili ng “hanapin” ang tuwirang layon na minarkahan ng אֶת at ang pagkakaiba nito sa unang pariralang may מן.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON o Jehova
  rationale: Ang transliterasyon ay nagpapanatili sa personal na pangalan sa tekstong Hebreo nang hindi ito pinapalitan ng titulo.
- issue: Kung pagtutugmain ang dalawang pariralang may בקש
  choice: “humingi ng tulong kay Yahweh” sa una at “hanapin si Yahweh” sa ikalawa
  alternative: Isalin ang dalawa bilang “hanapin si Yahweh” o kapwa bilang “humingi ng tulong kay Yahweh”
  rationale: 'Magkaiba ang mga konstruksiyon sa Hebreo: בקש + מן sa una at בקש + אֶת sa ikalawa. Pinananatili ng salin ang kaibhang ito nang hindi itinatangging maaaring tumukoy ang una sa tulong o pagliligtas.'
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mga taga-Juda” para sa kolektibong Juda at “lungsod” para sa mga pamayanang tinutukoy, habang pinanatili ang bahagyang tensiyon sa pagitan ng paghingi mula kay Yahweh at paghahanap kay Yahweh.
