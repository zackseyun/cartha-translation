  text: וַ/יִּתְנַבֵּ֞א אֱלִיעֶ֤זֶר בֶּן דֹּדָוָ֨הוּ֙ מִ/מָּ֣רֵשָׁ֔ה עַל יְהוֹשָׁפָ֖ט לֵ/אמֹ֑ר כְּ/הִֽתְחַבֶּרְ/ךָ֣ עִם אֲחַזְיָ֗הוּ פָּרַ֤ץ יְהוָה֙ אֶֽת מַעֲשֶׂ֔י/ךָ וַ/יִּשָּׁבְר֣וּ אֳנִיּ֔וֹת וְ/לֹ֥א עָצְר֖וּ לָ/לֶ֥כֶת אֶל תַּרְשִֽׁישׁ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/037.yaml
  text: Then Eliezer son of Dodavahu[a], from Mareshah, prophesied against Jehoshaphat, saying, “Because you joined yourself with Ahaziah[b], Yahweh has broken your works.” So the ships were wrecked and were not able to go to Tarshish.
translation:
  language: tl
  text: Pagkatapos, nagpropesiya laban kay Jehoshafat si Eliezer na anak ni Dodavahu, na mula sa Maresha. Sinabi niya, “Dahil nakipag-isa ka kay Ahazias, winasak ni Yahweh ang mga gawain mo[a].” Kaya nasira ang mga barko at hindi nakapaglayag[b] patungong Tarsis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “winasak ni Yahweh ang iyong proyekto.” Literal na “ang mga gawain mo”; sa konteksto, tumutukoy ito sa paggawa ng mga barko.
    reason: lexical_alternative
  - marker: b
    text: O “hindi nakapunta” o “napigilang pumunta” sa Tarsis.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְנַבֵּא
  choice: nagpropesiya
  rationale: Tuwirang ipinahahayag ng hitpael ng נבא ang pagsasalita bilang propeta; natural at malinaw sa modernong Filipino ang “nagpropesiya.”
- source_word: עַל
  choice: laban kay
  rationale: Sa konteksto ng mensahe ng paghatol kay Jehoshafat, ipinahihiwatig ng עַל na ang propesiya ay laban sa kaniya, hindi lamang tungkol sa kaniya.
- source_word: מִמָּרֵשָׁה
  choice: mula sa Maresha
  rationale: Ang מִן ay nagsasaad ng pinagmulan o bayang pinanggalingan.
- source_word: כְּהִתְחַבֶּרְךָ עִם
  choice: Dahil nakipag-isa ka kay
  rationale: Pinananatili nito ang kusang at kapuwa pakikipagsanib na diwa ng hitpael ng חבר nang hindi labis na tinutukoy kung pormal na kasunduan ang ginawa.
- source_word: פָּרַץ
  choice: winasak
  rationale: Bagaman pangunahing diwa ng פרץ ang paglagos o pagwasak, kapag tuwirang layon ang “mga gawain mo,” ipinahahayag nito ang pagsira o pagbigo sa isinagawang proyekto.
- source_word: מַעֲשֶׂיךָ
  choice: ang mga gawain mo
  rationale: Pinananatili ang plural at malawak na kahulugan ng literal na “mga gawa/gawain mo”; nililinaw ng konteksto na tumutukoy ito sa proyektong paggawa ng mga barko.
- source_word: וַיִּשָּׁבְרוּ אֳנִיּוֹת
  choice: Kaya nasira ang mga barko
  rationale: Ang niphal ay nagsasaad na nasira ang mga barko; ang “nasira” ay natural na Filipino at hindi nagdaragdag ng hindi tiyak na paraan ng pagkawasak.
- source_word: וְלֹא עָצְרוּ לָלֶכֶת
  choice: at hindi nakapaglayag
  rationale: Sa paksa nitong mga barko, natural na ipinapahayag ng “hindi nakapaglayag” ang kawalan ng kakayahang tumuloy, habang inilalagay sa talababa ang iba pang posibleng diwa ng pagpigil.
- source_word: תַּרְשִׁישׁ
  choice: Tarsis
  rationale: Isinalin sa karaniwang anyong Filipino ang pangalan ng lugar.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasatitik ang personal na pangalang banal sa halip na palitan ito ng isang titulo.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Personal na pangalan ang Tetragrammaton sa tekstong Hebreo; pinananatili ng “Yahweh” ang pangalan nang hindi ito pinapalitan ng titulong maaaring magkubli sa pagkakaiba nito.
- issue: Ugnayan ng pagkasira ng proyekto sa pakikipag-isa kay Ahazias
  choice: Pinanatili ang tuwirang pahayag na si Yahweh ang nagwasak dahil sa pakikipag-isa
  alternative: Palabnawin bilang likas lamang na bunga ng maling pasiya
  rationale: Maliwanag na iniuugnay ng pahayag ng propeta ang kilos ni Yahweh sa pakikipag-isa ni Jehoshafat kay Ahazias; hindi dapat bawasan o dagdagan ang teolohikal na sanhi na isinasaad ng teksto.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “nagpropesiya,” “nakipag-isa,” at “nakapaglayag” bilang likas na mga parirala, habang pinanatili sa pangunahing teksto ang literal na “mga gawain mo” at inilagay sa talababa ang kontekstuwal na kahulugang “proyekto.”
