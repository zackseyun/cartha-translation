  source_fidelity: 'Tapat ang salin sa Hebreo: si Eliezer na anak ni Dodavahu mula sa Maresha ay nagpropesiya laban kay Jehoshafat; ang sanhi ay ang pakikipag-isa niya kay Ahazias; si Yahweh ang nagpabigo sa kanyang mga gawain; at nasira ang mga barko kaya hindi sila nakapaglayag patungong Tarsis. Ang pagkakasunod at ugnayang sanhi-bunga ay napanatili.'
  naturalness: Natural at malinaw ang modernong Filipino. Ang “nagpropesiya laban,” “nakipag-isa ka kay,” “nasira ang mga barko,” at “hindi nakapaglayag” ay angkop sa marangal ngunit madaling unawaing rehistro. Ang “mga gawain mo” ay bahagyang literal ngunit sinadyang pinananatili at nililinaw nang wasto ng talababa.
  terminology: 'Wasto at pare-pareho ang mga pangalan: Jehoshafat, Eliezer, Dodavahu, Maresha, Ahazias, at Tarsis. Ang “Yahweh” ay tapat na pagsasalin ng Tetragrammaton ayon sa ibinigay na patakaran. Hindi nagdadagdag ang “nakipag-isa” ng mas tiyak na uri ng alyansa kaysa sa ipinahihiwatig ng Hebreo.'
