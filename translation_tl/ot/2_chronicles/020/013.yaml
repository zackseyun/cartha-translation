- from: At ang buong Juda ay nakatayo sa harap ni Yahweh—pati ang kanilang maliliit na anak, mga asawa, at mga anak.[a]
  to: At ang buong Juda ay nakatayo sa harap ni Yahweh—pati ang kanilang maliliit na anak, ang kanilang mga asawang babae, at ang kanilang mga anak.[a]
  rationale: Nilinaw ang kategoryang “mga asawang babae” upang maipahayag ang kasariang nasa נְשֵׁיהֶם, at inulit ang possessive para sa malinaw na pagtutugma ng mga pangkat. Pinanatili ang aspektong nagpapatuloy ng participle sa “ay nakatayo,” ang diin ng גַּם sa “pati,” at ang lexical na ambiguity ng בְנֵיהֶם sa talababa.
