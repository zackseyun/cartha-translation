  naturalness: Likas at marangal ang “Buong Juda ay nakatayo sa harap ni Yahweh.” Ang “kanilang mga asawang babae” ay bahagyang mas tahasan kaysa sa karaniwang “mga asawa,” ngunit malinaw, natural sa kontekstong pampamilya, at mas tumpak sa kasariang ipinahahayag ng pinagmulan.
  terminology: Pinanatili ang “Yahweh” para sa יהוה. Ang “maliliit na anak” ay angkop para sa טַפָּם, at ang “mga anak” para sa בְנֵיהֶם ay maingat na pinananatili ang mas malawak na posibleng kahulugan, kalakip ang talababa para sa “mga anak na lalaki.”
