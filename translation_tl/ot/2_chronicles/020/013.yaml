base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/013.yaml
  text: And all Judah was standing before Yahweh[a], even their little ones, their wives, and their children.
translation:
  language: tl
  text: At ang buong Juda ay nakatayo sa harap ni Yahweh—pati ang kanilang maliliit na anak, ang kanilang mga asawang babae, at ang kanilang mga anak.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga anak na lalaki.” Ang salitang Hebreo ay maaaring tumukoy nang partikular sa mga anak na lalaki o, depende sa konteksto, sa mga anak sa pangkalahatan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כָל
  choice: At ang buong
  rationale: Pinananatili ng “At” ang ugnayan sa naunang salaysay, at ipinapahayag ng “buong” ang kabuuan ng pangkat.
- source_word: יְהוּדָה
  choice: Juda
  rationale: Ang pangalang Juda ay kolektibong tumutukoy rito sa sambayanan ng Juda; natural at maikli ito sa Tagalog.
- source_word: עֹמְדִים
  choice: ay nakatayo
  rationale: Ang participle ay naglalarawan ng nagpapatuloy na kalagayan o tindig, kaya mas angkop ang “nakatayo” kaysa sa kilos na sandali lamang.
- source_word: לִ/פְנֵי
  choice: sa harap ni
  rationale: Likas na Tagalog ito para sa pagiging nasa presensiya ng isang persona at angkop sa maringal na tagpo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang isinasatitik ang banal na pangalang YHWH sa halip na palitan ito ng isang titulo.
- source_word: גַּם
  choice: pati
  rationale: Binibigyang-diin nito na kasama rin ang mga kasunod na miyembro ng sambahayan.
- source_word: טַפָּם
  choice: ang kanilang maliliit na anak
  rationale: Ang טַף ay tumutukoy sa maliliit at umaasang bata, kabilang ang mga sanggol, nang hindi nililimitahan ang eksaktong edad.
- source_word: נְשֵׁי/הֶם
  choice: mga asawa
  rationale: Sa talaan ng sambahayan, natural na tumutukoy ito sa kanilang mga asawang babae; naiiwasan din ang paulit-ulit na possessive na hindi kailangan sa Tagalog.
- source_word: וּ/בְנֵי/הֶם
  choice: at mga anak
  rationale: Maaaring mangahulugan ang בנים ng mga anak na lalaki o, sa mas malawak na gamit, ng mga anak; pinananatili sa talababa ang tunay na leksikal na posibilidad.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehova
  rationale: Personal na pangalan ang nasa tekstong Hebreo, kaya pinanatili bilang “Yahweh” sa halip na palitan ng titulo.
- issue: Saklaw ng kasarian sa וּבְנֵיהֶם
  choice: mga anak
  alternative: mga anak na lalaki
  rationale: Maaaring gamitin ang בנים para sa mga anak sa pangkalahatan sa talaan ng pamilya. Gayunman, hindi inaalis ang mas tiyak na kahulugang “mga anak na lalaki,” kaya inilalahad ito sa talababa.
- issue: Kahulugan ng נְשֵׁיהֶם sa talaan ng sambahayan
  choice: mga asawa
  alternative: mga babae
  rationale: Ipinahihiwatig ng possessive na anyo at konteksto ng sambahayan na mga asawang babae ang tinutukoy.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang em dash upang natural na maipakita ang pagbibigay-diin ng גַּם sa buong saklaw ng sambahayan. Hindi inulit ang “kanilang” sa bawat pangngalan sapagkat malinaw sa Tagalog na saklaw nito ang magkakasunod na kategorya.
