  - severity: low
    issue: Hindi inuulit ang possessive sa mga kasunod na kategorya.
    rationale: Nauunawaan ito sa Tagalog, ngunit ang pag-uulit ng “kanilang” ay nagpapalinaw sa estrukturang “their little ones, their wives, and their children,” nang walang pagbabago ng kahulugan.
