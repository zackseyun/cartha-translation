  text: וַ/יֹּ֗אמֶר הַקְשִׁ֤יבוּ כָל יְהוּדָה֙ וְ/יֹשְׁבֵ֣י יְרוּשָׁלִַ֔ם וְ/הַ/מֶּ֖לֶךְ יְהוֹשָׁפָ֑ט כֹּֽה אָמַ֨ר יְהוָ֜ה לָ/כֶ֗ם אַ֠תֶּם אַל תִּֽירְא֤וּ וְ/אַל תֵּחַ֨תּוּ֙ מִ/פְּנֵ֨י הֶ/הָמ֤וֹן הָ/רָב֙ הַ/זֶּ֔ה כִּ֣י לֹ֥א לָ/כֶ֛ם הַ/מִּלְחָמָ֖ה כִּ֥י לֵ/אלֹהִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/015.yaml
  text: 'And he said[a], “Listen, all Judah and inhabitants of Jerusalem, and King Jehoshaphat: Thus says Yahweh to you, ‘Do not fear, and do not be dismayed because of this great multitude, for the battle is not yours, but God''s.’”'
translation:
  language: tl
  text: 'Sinabi niya, “Makinig kayo, buong Juda at kayong mga naninirahan sa Jerusalem, at ikaw, Haring Jehosafat! Ganito ang sabi ni Yahweh sa inyo: ‘Huwag kayong matakot at huwag kayong panghinaan ng loob dahil sa napakaraming taong ito, sapagkat ang labanan ay hindi inyo kundi ng Diyos.’”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “sapagkat ang labanan ay hindi sa inyo kundi sa Diyos.”
    reason: Ipinapakita ang alternatibong idiomatikong pagsasalin ng Hebreong konstruksyong pag-aari na לֹא לָכֶם ... לֵאלֹהִים.
lexical_decisions:
- source_word: הַקְשִׁיבוּ
  choice: Makinig kayo
  rationale: Maramihang pautos ito na humihiling ng masusing pakikinig; natural at tuwiran sa modernong Filipino ang “Makinig kayo.”
- source_word: כָל יְהוּדָה
  choice: buong Juda
  rationale: Pinananatili ang kolektibong katawagan sa Juda nang hindi idinaragdag ang “mga tao,” na hindi tahasang nasa Hebreo.
- source_word: יֹשְׁבֵי יְרוּשָׁלִַם
  choice: kayong mga naninirahan sa Jerusalem
  rationale: Ipinahahayag ng participle ang mga taong nakatira sa Jerusalem; idinagdag ang “kayong” upang luminaw ang tuwirang pagtawag.
- source_word: וְהַמֶּלֶךְ יְהוֹשָׁפָט
  choice: at ikaw, Haring Jehosafat
  rationale: Tuwirang kinakausap ang hari kasama ng Juda at ng mga taga-Jerusalem; ang “ikaw” ay likas sa Filipino at nagpapalinaw sa pagbabago mula maramihan tungo sa isang tao.
- source_word: כֹּה אָמַר יְהוָה
  choice: Ganito ang sinabi ni Yahweh
  rationale: Pinananatili ang pormal na pormula ng mensaherong propetiko at ang pangalang tipan na Yahweh.
- source_word: אַל תִּירְאוּ
  choice: Huwag kayong matakot
  rationale: Tuwirang katumbas ng pagbabawal na nakatuon sa takot.
- source_word: וְאַל תֵּחַתּוּ
  choice: at huwag kayong panghinaan ng loob
  rationale: Sa kontekstong militar, ipinahahayag ng pandiwa ang pagkasindak o pagkawasak ng loob; natural sa Filipino ang “panghinaan ng loob” at nananatiling bukod sa unang pagbabawal.
- source_word: מִפְּנֵי הֶהָמוֹן הָרָב הַזֶּה
  choice: dahil sa napakaraming taong ito
  rationale: Ang מִפְּנֵי ay sanhi sa konteksto, at ang הָמוֹן רָב ay isang napakalaking pangkat; hindi ipinapalagay ng salin ang mas mapanlibak na “kawan” o “sangkaterba.”
- source_word: כִּי לֹא לָכֶם הַמִּלְחָמָה כִּי לֵאלֹהִים
  choice: sapagkat ang labanan ay hindi sa inyo kundi sa Diyos
  rationale: Pinananatili ang Hebreong konstruksiyon ng pag-aari o pananagutan at ang matinding paghahambing sa pagitan ng bayan at ng Diyos.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Pangalan mismo na YHWH ang nasa tekstong Hebreo; ang “Yahweh” ay nagpapanatili rito bilang pangalan sa halip na palitan ng titulo.
- issue: Pag-aari o pamamahala sa labanan
  choice: ang labanan ay hindi sa inyo kundi sa Diyos
  alternative: ang labanan ay hindi ninyo, kundi pag-aari ng Diyos
  rationale: Ipinahahayag ang agarang punto ng teksto—ang labanang ito ay nasa Diyos, hindi sa Juda—nang hindi pinalalawak tungo sa isang doktrinang lampas sa konteksto.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Pinanatili ang dalawang magkahiwalay na pagbabawal—huwag matakot at huwag panghinaan ng loob—at ginamit ang tuwirang pagtawag na “ikaw” para sa hari upang maging natural ang Hebreong serye ng mga kinakausap.
