  revision_rationale: Binago ang pormulang propetiko sa “Ganito ang sabi ni Yahweh” at ginawang malinaw ang possessive na paghahambing sa “hindi inyo kundi ng Diyos.” Pinanatili ang lahat ng iba pang wastong elemento, lalo na ang dalawang magkaibang pagbabawal at ang pangalang Yahweh.
