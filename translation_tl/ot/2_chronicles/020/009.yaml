  text: אִם תָּב֨וֹא עָלֵ֜י/נוּ רָעָ֗ה חֶרֶב֮ שְׁפוֹט֮ וְ/דֶ֣בֶר וְ/רָעָב֒ נַֽעַמְדָ֞ה לִ/פְנֵ֨י הַ/בַּ֤יִת הַ/זֶּה֙ וּ/לְ/פָנֶ֔י/ךָ כִּ֥י שִׁמְ/ךָ֖ בַּ/בַּ֣יִת הַ/זֶּ֑ה וְ/נִזְעַ֥ק אֵלֶ֛י/ךָ מִ/צָּרָתֵ֖/נוּ וְ/תִשְׁמַ֥ע וְ/תוֹשִֽׁיעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/009.yaml
  text: If disaster comes upon us—sword[a], judgment, pestilence, or famine—we will stand before this house and before you, for your name is in this house, and we will cry out to you from our distress, and you will hear and save.
translation:
  language: tl
  text: Kung sumapit sa amin ang kapahamakan—tabak, hatol, salot, o taggutom—tatayo kami sa harap ng bahay na ito at sa harap mo, sapagkat ang pangalan mo ay nasa bahay na ito[a]. Dadaing kami sa iyo sa aming kagipitan, at diringgin mo kami at ililigtas mo kami.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “ang bahay na ito ay nagtataglay ng iyong pangalan.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: רָעָה
  choice: kapahamakan
  rationale: Tumutukoy sa mapaminsalang kalamidad, hindi sa moral na kasamaan; natural ito sa makabagong Filipino at angkop sa kasunod na talaan.
- source_word: חֶרֶב
  choice: tabak
  rationale: Pinananatili ang kongkretong larawan ng Hebreo sa halip na gawing mas abstraktong “digmaan.”
- source_word: שְׁפוֹט
  choice: hatol
  rationale: Itinuturing na pangngalan sa talaan ng mga kapahamakan. Maikli ito at hindi nito nililimitahan ang diwa sa isang prosesong legal lamang.
- source_word: דֶבֶר
  choice: salot
  rationale: Karaniwang salitang Filipino para sa malawakang nakahahawang kapinsalaan sa ganitong konteksto; mas tiyak kaysa “sakit.”
- source_word: רָעָב
  choice: taggutom
  rationale: Tumutukoy sa malawakang kakulangan sa pagkain, hindi lamang sa personal na pagkagutom.
- source_word: נַעַמְדָה
  choice: tatayo kami
  rationale: Ipinahahayag ang ipinangakong gagawin ng bayan kapag sumapit ang kapahamakan, alinsunod sa kondisyunal na konteksto.
- source_word: לִפְנֵי הַבַּיִת הַזֶּה
  choice: sa harap ng bahay na ito
  rationale: Pinananatili ang “bahay” ng Hebreo at ang wikang tumutukoy sa pagtayo sa harap nito, sa halip na ipalit agad ang interpretatibong “templo.”
- source_word: וּלְפָנֶיךָ
  choice: at sa harap mo
  rationale: 'Pinananatili ang paralelismo: ang pagtayo sa harap ng bahay ay pagtayo rin sa harap ng Diyos.'
- source_word: כִּי שִׁמְךָ בַּבַּיִת הַזֶּה
  choice: sapagkat ang pangalan mo ay nasa bahay na ito
  rationale: Malapit sa idyomang Hebreo at hindi agad ipinapaliwanag kung ang diin ay presensiya, pag-aangkin, o pagkakaugnay ng pangalan ng Diyos sa bahay.
- source_word: וְנִזְעַק
  choice: dadaing kami
  rationale: Naghahatid ng apurahan at matinding paglapit sa Diyos mula sa gitna ng paghihirap, higit sa neutral na “mananalangin.”
- source_word: מִצָּרָתֵנוּ
  choice: mula sa aming kagipitan
  rationale: Pinananatili ang diwang nagmumula ang daing sa kalagayan ng matinding pangangailangan.
- source_word: וְתִשְׁמַע וְתוֹשִׁיעַ
  choice: at diringgin mo kami at ililigtas
  rationale: Pinananatiling magkahiwalay ang dalawang kilos. Idinagdag ang likas na layon na “kami” sa Filipino nang hindi binabago ang malinaw na kahulugan sa konteksto.
theological_decisions:
- issue: Teolohiya ng pangalan ng Diyos kaugnay ng bahay sa pariralang כִּי שִׁמְךָ בַּבַּיִת הַזֶּה
  choice: 'Pinanatili sa pangunahing teksto ang idyoma: “ang pangalan mo ay nasa bahay na ito.”'
  alternative: “ang bahay na ito ay nagtataglay ng iyong pangalan” o “ang pangalan mo ay nakaugnay sa bahay na ito”
  rationale: Hinahayaan nitong manatili ang saklaw ng idyoma—presensiya, pag-aangkin, at tipanang kaugnayan—nang hindi ito ikinukulong sa iisang paliwanag na teolohikal.
translation_notes:
  register: Makabago at marangal na Filipino na madaling maunawaan. Pinanatili ang “bahay” para sa Hebreong בַּיִת at ang tuwirang idyoma tungkol sa pangalan ng Diyos; ginamit ang “kagipitan” at “dadaing” upang maipahayag ang bigat at pagkaapurahan ng panalangin nang hindi nagiging lipas o labis na teknikal.
