revisions:
- from: Kung sumapit sa amin ang kapahamakan—tabak, hatol, salot, o taggutom—tatayo kami sa harap ng bahay na ito at sa harap mo, sapagkat ang pangalan mo ay nasa bahay na ito[a]. Dadaing kami sa iyo mula sa aming kagipitan, at diringgin mo kami at ililigtas.
  to: Kung sumapit sa amin ang kapahamakan—tabak, hatol, salot, o taggutom—tatayo kami sa harap ng bahay na ito at sa harap mo, sapagkat ang pangalan mo ay nasa bahay na ito[a]. Dadaing kami sa iyo sa aming kagipitan, at diringgin mo kami at ililigtas mo kami.
  rationale: 'Ginawa lamang ang mga ligtas na pagpapakinis sa Filipino: nilinaw ang layon ng “ililigtas” at ginawang mas idiomatiko ang pariralang nagsasaad ng kagipitan. Pinanatili ang Hebreong idyoma tungkol sa pangalan ng Diyos sa pangunahing teksto; ang talababa ay nagbibigay ng mas natural na alternatibo nang hindi nililimitahan ang saklaw nitong teolohikal.'
