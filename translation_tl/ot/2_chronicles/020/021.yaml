id: 2CH.20.21
reference: 2 Chronicles 20:21
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יִּוָּעַץ֙ אֶל הָ/עָ֔ם וַ/יַּעֲמֵ֤ד מְשֹֽׁרֲרִים֙ לַ/יהוָ֔ה וּֽ/מְהַֽלְלִ֖ים לְ/הַדְרַת קֹ֑דֶשׁ בְּ/צֵאת֙ לִ/פְנֵ֣י הֶֽ/חָל֔וּץ וְ/אֹֽמְרִים֙ הוֹד֣וּ לַ/יהוָ֔ה כִּ֥י לְ/עוֹלָ֖ם חַסְדּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/021.yaml
  text: After consulting with the people[a], he appointed singers to Yahweh, who praised the splendor of holiness as they went out before the vanguard, saying, “Give thanks to Yahweh[c][b], for his steadfast love endures forever.”
translation:
  language: tl
  text: 'Matapos sumangguni sa mga tao, nagtalaga siya ng mga mang-aawit para kay Yahweh, na nagpupuri sa banal na karilagan[a]. Lumabas sila sa unahan ng pangkat na nangunguna[b], habang sinasabi,


    “Magpasalamat kayo kay Yahweh,


    sapagkat ang kanyang tapat na pag-ibig[c] ay magpakailanman.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “karilagan ng kabanalan,” “kagandahan ng kabanalan,” o “banal na karilagan.” Hindi tiyak sa Hebreo kung ang parirala ay tumutukoy sa karilagang banal, sa karilagan ng kabanalan, o sa paraan ng pagpupuri.
    reason: lexical_alternative
  - marker: b
    text: O “sa unahan ng mga kawal na nasa unang hanay” o “sa unahan ng hukbong pasalakay.”
    reason: lexical_alternative
  - marker: c
    text: O “awa.” Ang salitang Hebreo na חֶסֶד ay nagpapahiwatig ng matatag at tapat na pag-ibig, lalo na sa loob ng isang tipan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּוָּעַץ אֶל הָעָם
  choice: Matapos sumangguni sa mga tao
  rationale: Likas sa modernong Tagalog at pinananatili ang pakikilahok ng mga tao sa pagsangguni at ang pagkakasunod ng mga pangyayari.
- source_word: וַיַּעֲמֵד
  choice: nagtalaga siya
  rationale: Ang Hiphil ay maaaring mangahulugang magpatayo, magpuwesto, o magtalaga; sa konteksto ng tungkulin ng mga mang-aawit, pinakamalinaw ang “nagtalaga.”
- source_word: מְשֹׁרֲרִים
  choice: mga mang-aawit
  rationale: Tiyak itong tumutukoy sa mga umaawit, hindi sa mas malawak na pangkat ng mga musikero.
- source_word: לַיהוָה
  choice: para kay Yahweh
  rationale: Ipinahihiwatig ng ל ang paglilingkod na nakatuon kay Yahweh, at tuwirang isinasalin ang pangalang יהוה.
- source_word: וּמְהַלְלִים לְהַדְרַת קֹדֶשׁ
  choice: na nagpupuri sa banal na karilagan
  rationale: Pinananatili ang malapit na ugnayan ng pagpupuri at ng malabong pariralang הַדְרַת קֹדֶשׁ nang hindi tiyakang nagpapasya kung ito ay bagay ng pagpupuri, katangian ng pagsamba, o banal na kasuotan.
- source_word: בְּצֵאת לִפְנֵי הֶחָלוּץ
  choice: Habang lumalabas sila sa unahan ng mga kawal na nangunguna
  rationale: Ang “habang” ay nagpapakita ng kasabay na kilos, at ang הֶחָלוּץ ay ang unang pangkat ng mga kawal o advance troops, hindi ang buong hukbo.
- source_word: הוֹדוּ לַיהוָה
  choice: Magpasalamat kayo kay Yahweh
  rationale: Sa konteksto ng pagsamba, ang Hiphil ng ידה ay karaniwang panawagang magpasalamat o magpuri; ang kasunod na dahilan ay umaayon sa “magpasalamat.”
- source_word: כִּי לְעוֹלָם חַסְדּוֹ
  choice: sapagkat ang kanyang tapat na pag-ibig ay magpakailanman
  rationale: Sinasaklaw ng “tapat na pag-ibig” ang katapatan, awa, at mapagpanindigang pag-ibig ng חֶסֶד. Ang “ay” ang likas na Tagalog na pagbuo ng sugnay na walang tahasang pandiwa sa Hebreo.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Ginagamit mismo ng talata ang Tetragrammaton; pinananatili ng “Yahweh” ang personal at tipanang pangalan nang hindi ito pinapalitan ng isang titulo.
- issue: Kahulugan ng חֶסֶד
  choice: tapat na pag-ibig
  alternative: awa; kagandahang-loob; pag-ibig na hindi nagmamaliw
  rationale: Hindi nililimitahan ang salita sa damdamin o habag lamang; pinananatili nito ang pagsasanib ng pag-ibig at katapatan, habang inilalahad sa talababa ang lehitimong alternatibo.
- issue: Kahulugan ng הַדְרַת קֹדֶשׁ
  choice: banal na karilagan
  alternative: kagandahan ng kabanalan; banal na kasuotan
  rationale: Tunay na malabo ang pariralang Hebreo. Ang pangunahing salin ay malapit sa anyo nito, at iniiwasang gawing tiyak ang isa lamang sa mga posibleng pakahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “mga mang-aawit,” “mga kawal,” at “magpasalamat” bilang pangkaraniwan at malinaw na bokabularyo. Hinati sa dalawang pangungusap at inayos bilang taludtod ang siniping pahayag upang maging natural basahin nang hindi binabago ang pagkakasunod ng Hebreong salaysay.
