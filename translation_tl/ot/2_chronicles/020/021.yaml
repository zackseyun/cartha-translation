  to: 'Matapos sumangguni sa mga tao, nagtalaga siya ng mga mang-aawit para kay Yahweh, na nagpupuri sa banal na karilagan[a]. Lumabas sila sa unahan ng pangkat na nangunguna[b], habang sinasabi,


