  text: אַ֥ךְ הַ/בָּמ֖וֹת לֹא סָ֑רוּ וְ/ע֤וֹד הָ/עָם֙ לֹא הֵכִ֣ינוּ לְבָבָ֔/ם לֵ/אלֹהֵ֖י אֲבֹתֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/033.yaml
  text: However[a], the high places were not removed, and the people still had not set their hearts toward the God of their fathers.
translation:
  language: tl
  text: Gayunman, hindi inalis ang matataas na lugar, at hindi pa rin itinuon ng mga tao ang kanilang puso sa Diyos ng kanilang mga ninuno.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “hindi pa rin inihanda ng mga tao ang kanilang puso para sa Diyos ng kanilang mga ninuno.”
    reason: Pinananatili ang leksikal na posibilidad na ang הֵכִינוּ ay nangangahulugang “inihanda,” at na ang ל ay maaaring ipahayag bilang “para sa,” habang isinasama ang negasyong לֹא at ang pagpapatuloy na ipinahihiwatig ng וְעוֹד.
lexical_decisions:
- source_word: אַךְ
  choice: Gayunman
  rationale: Ipinapakita ang pagsalungat sa naunang positibong pagtatasa kay Jehoshafat habang pinananatili ang marangal at likas na daloy sa modernong Tagalog.
- source_word: הַבָּמוֹת
  choice: ang matataas na lugar
  rationale: Pinananatili ang makasaysayang katawagan para sa mga lugar ng pagsamba nang hindi agad ipinapalagay na dambana ang bawat tinutukoy nito.
- source_word: לֹא סָרוּ
  choice: hindi inalis
  rationale: Bagaman literal na maaaring tumukoy sa hindi pag-alis o paglihis, ang konteksto ay likas na nagpapahayag na nanatili ang mga lugar na ito; ang pasibong diwa ay malinaw sa Tagalog.
- source_word: וְעוֹד
  choice: hindi pa rin
  rationale: Ipinahahayag ang nagpapatuloy at hindi pa nalulutas na kalagayan.
- source_word: הָעָם
  choice: ang mga tao
  rationale: Likas na kolektibong pagtukoy sa sambayanan sa modernong Tagalog.
- source_word: לֹא הֵכִינוּ לְבָבָם
  choice: hindi ... itinuon ... ang kanilang puso
  rationale: Sinasaklaw ng Hiphil ng כון kasama ng 'puso' ang paghahanda, pagpapatatag, o sadyang pagtutuon. Ang 'itinuon ang kanilang puso' ay malinaw na naghahayag ng kusang panloob na oryentasyon nang hindi nililimitahan ito sa damdamin lamang.
- source_word: לֵאלֹהֵי אֲבֹתֵיהֶם
  choice: sa Diyos ng kanilang mga ninuno
  rationale: Ang 'sa' kasunod ng 'itinuon' ay natural na naghahayag ng direksiyon, at ang 'mga ninuno' ay makabago at inklusibong katumbas ng ancestral fathers nang hindi nawawala ang kasaysayang tipan.
theological_decisions:
- issue: Likas ng pagkukulang ng mga tao
  choice: Inilalarawan ang hindi ganap na reporma sa pagsamba at ang hindi pa lubos na pagkakatuon ng puso ng sambayanan sa Diyos ng kanilang mga ninuno.
  alternative: Maaaring unawain na hindi pa nila inihanda o pinatatag ang kanilang puso para sa Diyos.
  rationale: Magkasamang binabanggit ng Hebreo ang nananatiling matataas na lugar at ang kalagayan ng puso. Hindi nililimitahan ng salin ang pahayag sa emosyon lamang o sa isang partikular na doktrinal na balangkas.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “matataas na lugar” upang mapanatili ang makasaysayang-relihiyosong katawagan nang hindi ito labis na binibigyang-kahulugan; inilagay ang talababa sa mismong pariralang may leksikal na alternatibo.
