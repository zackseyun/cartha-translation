  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וִֽ/יהוּדָ֛ה בָּ֥א עַל הַ/מִּצְפֶּ֖ה לַ/מִּדְבָּ֑ר וַ/יִּפְנוּ֙ אֶל הֶ֣/הָמ֔וֹן וְ/הִנָּ֧/ם פְּגָרִ֛ים נֹפְלִ֥ים אַ֖רְצָ/ה וְ/אֵ֥ין פְּלֵיטָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/024.yaml
  text: When Judah came to the lookout over the wilderness[a], they turned toward the multitude, and behold, there were corpses lying on the ground, and there was no survivor.
translation:
  language: tl
  text: Nang makarating ang Juda sa bantayan na nakatanaw sa ilang, ibinaling nila ang tingin sa napakaraming tao. At naroon ang mga bangkay na nakahandusay sa lupa[a]; walang nakaligtas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring “mga bangkay na nakabuwal sa lupa.” Mas literal sa Hebreo: “mga bangkay, nakabuwal sa lupa.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וִיהוּדָה
  choice: ang Juda
  rationale: Ang pangalang Juda ay ginagamit nang kolektibo para sa mga taga-Juda o hukbo nito, gaya ng ipinahihiwatig ng kasunod na pandiwang maramihan.
- source_word: בָּא
  choice: makarating
  rationale: Likas sa salaysay ang “makarating” para sa pagdating sa isang tiyak na lugar.
- source_word: עַל הַמִּצְפֶּה לַמִּדְבָּר
  choice: sa bantayan na nakatanaw sa ilang
  rationale: Ang מִצְפֶּה ay isang mataas na lugar na pinagmamasdan ang paligid; ipinahihiwatig ng לַמִּדְבָּר na nakaharap o nakatanaw ito sa ilang.
- source_word: וַיִּפְנוּ
  choice: ibinaling nila ang tingin
  rationale: Pinananatili nito ang konkretong diwa ng pagharap o pagbaling habang natural na ipinahahayag na tumingin sila.
- source_word: אֶל הֶהָמוֹן
  choice: sa napakaraming tao
  rationale: Ang הָמוֹן ay tumutukoy sa isang malaking karamihan o pulutong. Hindi tahasang idinagdag ang “hukbo” upang mapanatili ang lawak ng salitang Hebreo.
- source_word: וְהִנָּם
  choice: At naroon
  rationale: Ipinahahayag nito ang biglaang pagtukoy ng Hebreong deiktikong anyo nang natural sa modernong Tagalog.
- source_word: פְּגָרִים
  choice: mga bangkay
  rationale: Tuwiran at malinaw na katumbas ito ng salitang tumutukoy sa mga patay na katawan.
- source_word: נֹפְלִים אַרְצָה
  choice: nakahandusay sa lupa
  rationale: Natural nitong inilalarawan ang kalagayan ng mga bangkay sa lupa, habang pinananatili sa talababa ang mas literal na larawan ng pagkabuwal.
- source_word: וְאֵין פְּלֵיטָה
  choice: walang nakaligtas
  rationale: Sa konteksto, ipinahihiwatig ng פְּלֵיטָה ang taong nakatakas o nakaligtas; ang pariralang ito ang pinakanatural sa Tagalog.
theological_decisions: []
translation_notes:
  register: Gumamit ng moderno, malinaw, at marangal na Tagalog. Ang “ilang” at “bantayan” ay karaniwang bokabularyong biblikal ngunit madaling maunawaan. Pinanatili ang kolektibong “Juda” at iniwasang gawing tahasang “hukbo” ang הָמוֹן upang hindi paliitin ang kahulugan nito.
