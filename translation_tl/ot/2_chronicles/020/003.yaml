base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/003.yaml
  text: And Jehoshaphat was afraid[a], and set his face to seek Yahweh[b], and proclaimed a fast throughout all Judah.
translation:
  language: tl
  text: Natakot si Jehoshafat[a], at matatag siyang nagpasiyang hanapin si Yahweh[b]. Nagpahayag siya ng pag-aayuno sa buong Juda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “nagsimulang matakot.” Maaaring ipahiwatig ng anyong Hebreo ang pagsisimula ng takot sa pagkakasunod-sunod ng salaysay.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “itinuon niya ang kanyang mukha upang hanapin si Yahweh,” isang idyomang nagpapahayag ng matatag at sinadyang pagpapasiya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרָא
  choice: Natakot
  rationale: Tuwirang ipinapahayag ang takot ni Jehoshafat at maaari ring magpahiwatig na nagsimula siyang matakot sa puntong ito ng salaysay.
- source_word: וַיִּתֵּן ... אֶת־פָּנָיו
  choice: buo niyang ipinasiya
  rationale: Ang literal na idyomang ‘itinuon/itinakda ang kanyang mukha’ ay nagpapahayag ng matatag at sinadyang pagpapasiya; ang saling ito ay natural sa modernong Tagalog habang pinananatili ang diin sa determinasyon.
- source_word: לִדְרוֹשׁ
  choice: hanapin
  rationale: Ang דרש kapag ang Diyos ang layon ay tumutukoy sa paglapit sa kanya upang humingi ng tulong, patnubay, o tugon. Pinananatili ng ‘hanapin’ ang malawak na saklaw nito.
- source_word: לַיהוָה
  choice: kay Yahweh
  rationale: Isinasalin ang Tetragrammaton bilang personal na pangalang ‘Yahweh,’ ayon sa tuwirang anyo ng tekstong Hebreo.
- source_word: וַיִּקְרָא צוֹם
  choice: Nagpahayag siya ng pag-aayuno
  rationale: Ipinahihiwatig ng parirala ang pampubliko at opisyal na pagpapahayag ng isang pag-aayuno.
- source_word: עַל כָּל יְהוּדָה
  choice: sa buong Juda
  rationale: Natural nitong ipinakikita na saklaw ng ipinahayag na pag-aayuno ang buong Juda.
theological_decisions:
- issue: Pagbigkas sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehovah
  rationale: Personal na pangalang יְהוָה ang tahasang nasa tekstong Hebreo; pinananatili ng ‘Yahweh’ ang pagkakakilanlan nito bilang pangalan sa halip na palitan ng titulo.
- issue: Kahulugan ng ‘hanapin si Yahweh’
  choice: Panatilihin ang malawak na pananalitang ‘hanapin si Yahweh’
  alternative: humingi ng patnubay kay Yahweh / sumangguni kay Yahweh
  rationale: Hindi nililimitahan ng konteksto ang דרש sa pormal na pagsangguni lamang; maaari itong sumaklaw sa pananalangin, paghingi ng tulong, at pagbaling sa Diyos.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang ‘buo niyang ipinasiya’ upang maipahayag nang natural ang Hebreong idyoma, habang inilagay sa talababa ang literal na larawan. Pinanatili ang ‘hanapin si Yahweh’ upang huwag paliitin ang saklaw ng salitang Hebreo.
