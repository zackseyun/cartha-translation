  source_fidelity: Kailangang palitan ang “bangin,” na karaniwang tumutukoy sa matarik na gilid o talampas, hindi sa נחל, isang lambak o daluyan ng pana-panahong tubig. Ang “lambak” ay mas tumpak na pangkalahatang salin sa Filipino. Ang “ahunan ng Ziz” ay mas malinaw ding nagtatanghal sa Ziz bilang pangalan ng ahunan, sa halip na waring patutunguhan lamang ng daan.
  naturalness: Natural at malinaw ang pangmaramihang mga utos at ang daloy ng pangungusap. Ang “Tingnan ninyo” at “umaahon sila” ay angkop sa makabagong Filipino at pinananatili ang diin at topograpikal na kilos ng Hebreo.
  terminology: Pinanatili ang Ziz at Jeruel bilang mga pangalan ng lugar. Ang “ilang” ay angkop para sa מִדְבָּר. Ang talababa ay nagbibigay ng makatwirang mga alternatibo para sa “lambak” nang hindi ipinipilit na laging may tubig ang נחל.
  issues:
