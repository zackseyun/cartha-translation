base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/016.yaml
  text: Tomorrow go down against them. Look[a], they are coming up by the ascent of Ziz, and you will find them at the end of the wadi, before the wilderness of Jeruel.
translation:
  language: tl
  text: Bukas, bumaba kayo laban sa kanila. Tingnan ninyo, umaahon sila sa ahunan ng Ziz. Matatagpuan ninyo sila sa dulo ng lambak[a], sa tapat ng ilang ng Jeruel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “libis” o “sapa.” Ang salitang Hebreo ay maaaring tumukoy sa isang lambak o daluyan ng tubig na maaaring matuyo kapag walang ulan.
    reason: lexical_alternative
lexical_decisions:
- source_word: מָחָר
  choice: Bukas
  rationale: Tuwirang temporal na pang-abay; hindi idinagdag ang ‘umaga’ sapagkat wala iyon sa Hebreo.
- source_word: רְדוּ עֲלֵיהֶם
  choice: bumaba kayo laban sa kanila
  rationale: Pinananatili ang direksiyong ‘bumaba’ at ang mapanlabang diwa ng עַל sa kontekstong militar.
- source_word: הִנָּם
  choice: Tingnan ninyo
  rationale: Itinatawag nito ang pansin sa kasunod na impormasyon sa natural at makabagong Filipino, nang hindi gumagamit ng makalumang ‘masdan’.
- source_word: עֹלִים
  choice: umaahon sila
  rationale: Ang participle ay naglalarawan ng kasalukuyan o nalalapit na pag-akyat; pinananatili ng ‘umaahon’ ang topograpikal na kilos.
- source_word: בְּמַעֲלֵה הַצִּיץ
  choice: sa daanang paakyat sa Ziz
  rationale: Ipinahahayag ng מַעֲלֶה ang ahon o paakyat na daan; ang Ziz ay pinanatiling transliteradong pangalan ng lugar.
- source_word: וּמְצָאתֶם אֹתָם
  choice: Matatagpuan ninyo sila
  rationale: Natural na Filipino para sa ipinangakong resulta kasunod ng utos, habang nananatiling malapit sa karaniwang kahulugan ng מצא.
- source_word: בְּסוֹף הַנַּחַל
  choice: sa dulo ng bangin
  rationale: Ang נחל ay maaaring tumukoy sa bangin o libis na dinadaluyan ng pana-panahong tubig. Ang ‘bangin’ ay malinaw sa karaniwang mambabasa at angkop sa topograpiya.
- source_word: פְּנֵי מִדְבַּר יְרוּאֵל
  choice: sa tapat ng ilang ng Jeruel
  rationale: Ang ‘sa tapat’ ay natural na panumbas ng panlokasyong פְּנֵי, at ang ‘ilang’ ay hindi nagpapahiwatig na tiyak na mabuhanging disyerto ang מִדְבָּר.
