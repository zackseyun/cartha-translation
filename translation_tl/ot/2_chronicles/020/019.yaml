  text: וַ/יָּקֻ֧מוּ הַ/לְוִיִּ֛ם מִן בְּנֵ֥י הַ/קְּהָתִ֖ים וּ/מִן בְּנֵ֣י הַ/קָּרְחִ֑ים לְ/הַלֵּ֗ל לַ/יהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל בְּ/ק֥וֹל גָּד֖וֹל לְ/מָֽעְלָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/019.yaml
  text: Then the Levites[a], from the sons of the Kohathites and from the sons of the Korahites, stood up to praise Yahweh, the God of Israel, with a very loud voice.
translation:
  language: tl
  text: At tumayo ang mga Levita, mula sa mga anak ni Kohat at mula sa mga anak ni Korah, upang purihin si Yahweh, ang Diyos ng Israel, sa napakalakas na tinig.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaaring isalin: “sa lubhang malakas na tinig.” Ang Hebreong idyoma ay nagpapahiwatig ng matinding lakas ng kanilang pagpuri.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֻמוּ
  choice: At tumayo
  rationale: Ang Qal wayyiqtol ng קום ay nagsasaad ng kongkretong pagtayo bilang kasunod na kilos sa salaysay; natural sa modernong Tagalog ang “At tumayo.”
- source_word: הַלְוִיִּם
  choice: ang mga Levita
  rationale: Karaniwang tawag sa Tagalog para sa pangkat na pantribo at panritwal; pinananatili ang katiyakan ng anyong Hebreo.
- source_word: מִן בְּנֵי הַקְּהָתִים
  choice: mula sa mga anak ni Kohat
  rationale: Pinananatili ang Hebreong pahayag ng angkan na “mga anak ni,” habang malinaw na tumutukoy sa liping nagmula kay Kohat.
- source_word: וּמִן בְּנֵי הַקָּרְחִים
  choice: at mula sa mga anak ni Korah
  rationale: Kaagapay ng naunang parirala at pinananatili ang Hebreong katawagan sa angkan.
- source_word: לְהַלֵּל
  choice: upang purihin
  rationale: Ang infinitive ay nagpapahayag ng layunin. Hindi idinagdag ang “umawit” sapagkat pagpuri, hindi tahasang pag-awit, ang sinasabi ng pandiwa.
- source_word: לַיהוָה
  choice: si Yahweh
  rationale: Ginagamit ang personal na pangalang tipan para sa יהוה; ang panandang “si” ay angkop sa personal na pangalan sa Tagalog.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ang Diyos ng Israel
  rationale: Tuwirang salin ng construct phrase at appositive na pagkakakilanlan kay Yahweh.
- source_word: בְּקוֹל גָּדוֹל לְמָעְלָה
  choice: sa napakalakas na tinig
  rationale: Ipinahahayag ng buong parirala ang matinding lakas ng kanilang tinig. Natural na naihahatid ng “napakalakas” ang intensifying force, habang kinikilala sa talababa ang posibleng mas literal na spatial na pagbasa ng לְמָעְלָה.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Personal na pangalan ang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang pagkakaiba nito sa mga titulong gaya ng “Panginoon,” nang hindi nagdaragdag ng denominasyonal na pagpapakahulugan.
- issue: Kung awit ba ang paraan ng pagpuri
  choice: purihin
  alternative: awitan ng papuri
  rationale: Hindi tahasang gumagamit ang talata ng pandiwa para sa pag-awit. Ang mas malawak na “purihin” ay umiiwas sa pagdaragdag ng paraang hindi tinukoy ng teksto.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Ginamit ang “mga anak ni Kohat/Korah” upang mapanatili ang Hebreong anyo ng katawagan sa angkan. Ang “napakalakas na tinig” ay natural na pagpapahayag, at ang tunay na ambiguwidad ng לְמָעְלָה ay inilagay sa talababa.
