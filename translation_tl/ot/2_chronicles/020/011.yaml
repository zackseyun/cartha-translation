  text: וְ/הִ֨נֵּה הֵ֔ם גֹּמְלִ֖ים עָלֵ֑י/נוּ לָ/בוֹא֙ לְ/גָ֣רְשֵׁ֔/נוּ מִ/יְּרֻשָּׁתְ/ךָ֖ אֲשֶׁ֥ר הֽוֹרַשְׁתָּֽ/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/011.yaml
  text: And behold[a], they are repaying us by coming to drive us out of your possession, which you gave us as an inheritance.
translation:
  language: tl
  text: 'At narito, ganito nila kami ginagantihan: pumaparito sila upang palayasin kami sa lupaing pag-aari mo, na ibinigay mo sa amin bilang mana.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “mula sa iyong mana, na ipinamana mo sa amin.”
    reason: Ipinapakita ang lehitimong alternatibong kahulugan ng מִיְּרֻשָּׁתְךָ at ang mas pormal na causative na pagkakasalin ng הוֹרַשְׁתָּנוּ.
lexical_decisions:
- source_word: וְהִנֵּה
  choice: At narito
  rationale: Pinananatili ang mariing panawagan na bigyang-pansin ang kasalukuyang kalagayan, sa isang dignidad ngunit likas na anyo sa modernong Tagalog.
- source_word: הֵם
  choice: nila
  rationale: Nananatili ang diin sa mga taong gumagawa nito; isinama sa likas na pariralang “ganito nila kami ginagantihan.”
- source_word: גֹּמְלִים עָלֵינוּ
  choice: ganito nila kami ginagantihan
  rationale: Ipinahahayag ang diwa ng pagganti o paggawad ng kapalit, kasama ang mapait na kabalintunaan na ito ang isinukli nila sa naunang kabutihan ng Israel.
- source_word: לָבוֹא
  choice: pumaparito sila
  rationale: Ginagawang tahasang kilos ang pagparito bilang paraan ng kanilang pagganti, alinsunod sa gamit ng infinitive sa konteksto.
- source_word: לְגָרְשֵׁנוּ
  choice: upang palayasin kami
  rationale: Tuwirang ipinapahayag ang layuning paalisin o itaboy ang bayan mula sa lupain.
- source_word: מִיְּרֻשָּׁתְךָ
  choice: sa lupaing pag-aari mo
  rationale: Ang pangngalan ay maaaring tumukoy sa pag-aari o mana. Ang “lupaing pag-aari mo” ay malinaw sa konteksto at pinananatili ang ideya na sa Diyos ang lupain.
- source_word: אֲשֶׁר הוֹרַשְׁתָּנוּ
  choice: na ibinigay mo sa amin bilang mana
  rationale: 'Ipinahahayag nang natural ang causative na diwa ng Hiphil: ang Diyos ang nagkaloob upang ariin o manahin ng Israel ang lupain.'
theological_decisions:
- issue: Pagmamay-ari ng Diyos at pagtanggap ng Israel sa lupain bilang mana
  choice: sa lupaing pag-aari mo, na ibinigay mo sa amin bilang mana
  alternative: mula sa iyong mana, na ipinamana mo sa amin
  rationale: Pinananatili ng pangunahing salin ang tensiyon sa pagitan ng tunay na pagmamay-ari ng Diyos at ng pagkakaloob niya ng lupain sa Israel, habang itinatala sa talababa ang lehitimong alternatibong pag-unawa sa יְרֻשָּׁה bilang “mana.”
translation_notes:
  register: Modernong Filipino Tagalog na dignidad at madaling maunawaan. Ginamit ang “At narito” upang mapanatili ang mariing tono ng panalangin, at ang kolon upang luminaw na ang pagparito at pagpapalayas ang mismong paraan ng kanilang pagganti.
