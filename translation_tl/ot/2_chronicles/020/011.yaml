  source_fidelity: 'Tapat ang salin sa Hebreo: napapanatili ang mariing panawagang וְהִנֵּה, ang ironikong diwa ng גֹּמְלִים עָלֵינוּ, ang pagdating bilang paraan/layunin ng pagkilos, at ang pagpapaalis sa Israel mula sa lupain. Ang “lupaing pag-aari mo, na ibinigay mo sa amin bilang mana” ay wastong naghihiwalay sa pagmamay-ari ng Diyos at sa mana ng Israel.'
  naturalness: Likas at malinaw ang modernong Filipino Tagalog, habang ang “At narito” at ang kabuuang ayos ay may angkop na marangal na rehistro para sa panalangin. Ang kolon ay epektibong nagpapalinaw sa paraan ng kanilang ‘pagganti.’
