  - severity: low
    issue: Maaaring mas malinaw ang “patyo” bilang pangunahing salin ng “courtyard.”
    rationale: Ang “looban” ay posibleng gamitin, ngunit ang “patyo” ay mas tuwirang tumutukoy sa isang courtyard at madaling maunawaan sa modernong Filipino.
