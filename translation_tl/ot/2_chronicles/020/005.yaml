base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/005.yaml
  text: And Jehoshaphat stood in the assembly of Judah and Jerusalem[a], in the house of Yahweh, before the new court.
translation:
  language: tl
  text: Tumayo si Jehosafat sa kapulungan ng Juda at Jerusalem, sa bahay ni Yahweh, sa harap ng bagong patyo[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “bagong looban.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֹד
  choice: Tumayo
  rationale: Isinasalaysay ng anyong pandiwa ang isang payak na kilos sa nakaraan. Likas at tuwiran sa Filipino ang “tumayo,” nang hindi idinaragdag ang mas interpretatibong diwa ng “pumuwesto.”
- source_word: בִּקְהַל
  choice: sa gitna ng kapulungan ng
  rationale: Ang קהל ay tumutukoy sa isang nagkatipong sambayanan. Ipinahihiwatig ng ב ang kinalalagyan ni Jehosafat sa loob o gitna ng pagtitipon; malinaw at natural itong naipapahayag ng “sa gitna ng kapulungan.”
- source_word: יְהוּדָה וִירוּשָׁלַם
  choice: Juda at Jerusalem
  rationale: Pinananatili ang magkatambal na pagtukoy sa mga taong nagmula o kumakatawan sa Juda at Jerusalem nang walang dagdag na pagpapaliwanag.
- source_word: בְּבֵית יְהוָה
  choice: sa bahay ni Yahweh
  rationale: Literal na “bahay ni Yahweh” ang parirala. Bagaman maaaring sabihing “templo,” pinananatili ng “bahay” ang Hebreong idyoma at nauunawaan pa rin sa konteksto.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin ang Tetragrammaton bilang personal na pangalang “Yahweh” sa halip na palitan ito ng titulong “PANGINOON.”
- source_word: לִפְנֵי
  choice: sa harap ng
  rationale: Nagsasaad dito ng pisikal na posisyon ang לִפְנֵי; natural at tumpak ang “sa harap ng.”
- source_word: הֶחָצֵר הַחֲדָשָׁה
  choice: bagong looban
  rationale: Ang חָצֵר ay bukás na court o courtyard sa nasasakupan ng templo. Ang “looban” ay maikli, dignificado, at angkop sa ganitong konteksto; inilalahad sa talababa ang modernong alternatibong “patyo.”
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehova
  rationale: Tahasang ginagamit sa talata ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng isang titulo.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Pinanatili ang payak na ayos ng salaysay at ang idyomang “bahay ni Yahweh.” Inilagay ang panandang [a] sa “bagong looban,” ang pariralang aktuwal na tinutukoy ng talababa.
