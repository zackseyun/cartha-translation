  text: וַ֠/יָּשֻׁבוּ כָּל אִ֨ישׁ יְהוּדָ֤ה וִֽ/ירוּשָׁלִַ֨ם֙ וִֽ/יהוֹשָׁפָ֣ט בְּ/רֹאשָׁ֔/ם לָ/שׁ֥וּב אֶל יְרוּשָׁלִַ֖ם בְּ/שִׂמְחָ֑ה כִּֽי שִׂמְּחָ֥/ם יְהוָ֖ה מֵֽ/אוֹיְבֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/027.yaml
  text: Then all the men of Judah and Jerusalem returned[a], with Jehoshaphat at their head, to return to Jerusalem with joy[b], because Yahweh had made them rejoice over their enemies.
translation:
  language: tl
  text: Pagkatapos, bumalik ang lahat ng kalalakihan ng Juda at Jerusalem, na si Jehoshafat ang nangunguna sa kanila, upang magbalik sa Jerusalem nang may kagalakan, sapagkat pinaligaya sila ni Yahweh dahil sa kanilang mga kaaway.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “pinaligaya sila ni Yahweh sa pagtatagumpay laban sa kanilang mga kaaway” o “pinaligaya sila ni Yahweh nang iligtas sila mula sa kanilang mga kaaway.”'
    reason: Pinahihintulutan ng pang-ukol na מִן ang higit sa isang kaugnayan sa “kanilang mga kaaway”; hindi lubusang tinutukoy ng Hebreo kung ang diin ay nasa pagtatagumpay laban sa kanila o sa pagliligtas mula sa kanila.
lexical_decisions:
- source_word: וַיָּשֻׁבוּ ... לָשׁוּב
  choice: bumalik ... nagbalik
  rationale: Iningatan ang pag-uulit ng ugat na שׁוב sa pamamagitan ng dalawang anyo ng “balik,” ngunit hinati sa dalawang pangungusap upang maging natural sa modernong Tagalog.
- source_word: כָּל אִישׁ יְהוּדָה וִירוּשָׁלַם
  choice: ang lahat ng kalalakihan ng Juda at Jerusalem
  rationale: Ang אִישׁ ay panlalaking pangngalan na ginamit nang distributibo para sa buong pangkat; malinaw at natural sa Tagalog ang “lahat ng kalalakihan.”
- source_word: וִיהוֹשָׁפָט בְּרֹאשָׁם
  choice: na pinangungunahan ni Jehoshafat
  rationale: Ang literal na “nasa kanilang unahan/ulo” ay idyoma ng pamumuno; ipinapahayag ng salin ang diwa nang natural.
- source_word: בְּשִׂמְחָה
  choice: Masaya
  rationale: Likas na Tagalog na pagpapahayag sa kanilang masayang pagbabalik, habang pinananatili ang kahulugan ng שִׂמְחָה.
- source_word: כִּי שִׂמְּחָם יְהוָה
  choice: sapagkat pinagalak sila ni Yahweh
  rationale: Pinananatili ng “pinagalak” ang causative na puwersa ng Piel na שׂמח at malinaw na ipinakikitang si Yahweh ang sanhi ng kanilang kagalakan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasatitik ang personal na pangalang banal sa halip na palitan ito ng isang titulo.
- source_word: מֵאֹיְבֵיהֶם
  choice: dahil sa kanilang mga kaaway
  rationale: Ang מִן ay maaaring tumukoy sa sanhi o kaugnayan ng kagalakan; pinananatili ng “dahil sa” ang tunay na saklaw ng parirala nang hindi sapilitang nililinaw kung ito ay kagalakan sa pagkatalo ng mga kaaway o pagliligtas mula sa kanila.
theological_decisions:
- issue: Paglalahad sa pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo, kaya pinanatili ito bilang “Yahweh” sa halip na palitan ng titulo.
- issue: Kahulugan ng מֵאֹיְבֵיהֶם pagkatapos ng causative na “magalak”
  choice: dahil sa kanilang mga kaaway
  alternative: sa pagtatagumpay laban sa kanilang mga kaaway / mula sa kanilang mga kaaway
  rationale: Maaaring magpahiwatig ang parirala ng okasyon, bagay, o pinagmulan ng kagalakan. Ang piniling salin ay hindi tahasang nagdaragdag ng “tagumpay” o “pagkaligtas,” kaya napapanatili ang bahagyang kalabuan ng Hebreo.
- issue: Panlalaking kolektibong כָּל אִישׁ
  choice: lahat ng kalalakihan
  alternative: bawat lalaki / lahat ng tao
  rationale: Pinananatili ang panlalaking anyo ng אִישׁ at kasabay nito ang kolektibong diwa ng parirala.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Hinati sa dalawang pangungusap ang mahabang sugnay upang maging malinaw, at ginamit ang “pinangungunahan” sa halip na literal ngunit di-likas na “nasa kanilang ulo.”
