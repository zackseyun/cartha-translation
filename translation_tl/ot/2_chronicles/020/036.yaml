base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/036.yaml
  text: So he allied himself with him to make ships to go to Tarshish[b][a], and they made ships at Ezion-geber.
translation:
  language: tl
  text: Nakipag-alyansa siya rito[a] upang gumawa ng mga barkong pupunta sa Tarsis[b], at gumawa sila ng mga barko sa Ezion-geber.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nakipagtuwang siya rito” o “nakipagkaisa siya rito.” Ang pandiwang Hebreo ay tumutukoy sa pagpasok sa isang samahan o alyansa.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “maglalayag patungong Tarsis.” Sa ilang konteksto ng paglalayag, iba ang pagkaunawa ng ilan sa pananalitang may “Tarsis,” ngunit dito ay pinakanatural na tumutukoy ang Hebreo sa patutunguhan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחַבְּרֵהוּ עִמּוֹ
  choice: Nakipag-alyansa siya rito
  rationale: Ang Hiphil ng חבר kasama ng עִם ay nagpapahayag ng pagpasok sa isang ugnayan o pakikipagtuwang. Ang “nakipag-alyansa” ay natural sa Filipino at angkop sa kontekstong pampolitika at pangkalakalan; ang “rito” ay tumutukoy sa lalaking kababanggit sa konteksto.
- source_word: לַעֲשׂוֹת
  choice: upang gumawa
  rationale: Ang עשה ay karaniwang nangangahulugang “gumawa.” Bagaman maaaring sabihing “magtayo” o “bumuo” ng barko, pinananatili ng “gumawa” ang malawak na diwa ng Hebreo at malinaw pa rin sa Filipino.
- source_word: אֳנִיּוֹת
  choice: mga barko
  rationale: Tumutukoy ang pangngalan sa mga sasakyang pandagat; “mga barko” ang karaniwan at tiyak na katumbas sa konteksto ng paglalayag at kalakalan.
- source_word: לָלֶכֶת תַּרְשִׁישׁ
  choice: pupunta sa Tarsis
  rationale: Pinakanatural na ipinahihiwatig ng infinitive ng הלך kasunod ang Tarsis bilang patutunguhan. Ang “pupunta” ay tapat sa pangkalahatang pandiwang “humayo/pumunta,” samantalang inilalahad sa talababa ang mas kontekstuwal na “maglalayag.”
- source_word: תַּרְשִׁישׁ
  choice: Tarsis
  rationale: Pangalan ito ng lugar at isinalin sa nakagawiang anyong Filipino.
- source_word: וַיַּעֲשׂוּ
  choice: gumawa sila
  rationale: Ang pandiwang maramihan ay tumutukoy sa magkatuwang na pagkilos ng dalawang panig at inuulit ang pandiwang עשה sa unang sugnay.
- source_word: בְּעֶצְיוֹן גָּבֶר
  choice: sa Ezion-geber
  rationale: Ang בְּ ay tumutukoy sa lugar kung saan ginawa ang mga barko. Ang “sa” ang natural na panandang pook sa Filipino, at pinanatili bilang transliterasyon ang pangalan.
