translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “nakipag-alyansa” upang maipahayag ang pormal na pakikipagtuwang, at “mga barko” bilang karaniwang katawagan sa mga sasakyang pandagat. Inilagay ang mga marker [a] at [b] kaagad pagkatapos ng mga pariralang tinutukoy ng mga talababa.
