base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/012.yaml
  text: Our God[a], will you not judge them? For we have no power before this great multitude that is coming against us. We do not know what to do, but our eyes are on you.
translation:
  language: tl
  text: Diyos namin, hindi mo ba sila hahatulan? Sapagkat wala kaming lakas sa harap ng malaking pulutong na ito na dumarating laban sa amin. Hindi namin alam kung ano ang gagawin, ngunit sa iyo kami nakatingin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “sapagkat sa iyo nakatuon ang aming mga mata.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהֵינוּ
  choice: Diyos namin
  rationale: Tuwirang panawagan ito sa panalangin. Likas sa modernong Tagalog ang “Diyos namin” at hindi na kailangang dagdagan ng pantawag na wala sa Hebreo.
- source_word: הֲלֹא תִשְׁפָּט בָּם
  choice: hindi mo ba sila hahatulan?
  rationale: Pinananatili ng “hahatulan” ang hudisyal na saklaw ng שׁפט, na maaaring tumukoy kapwa sa paghatol sa mga kaaway at sa pagbibigay-katarungan sa bayan ng Diyos; mas makitid ang “parurusahan.”
- source_word: אֵין בָּנוּ כֹּחַ
  choice: wala kaming lakas
  rationale: Ang כֹּחַ ay lakas, kapangyarihan, o kakayahan. Ang “lakas” ay natural at angkop sa harap ng isang banta ng digmaan.
- source_word: לִפְנֵי
  choice: sa harap ng
  rationale: Pinananatili nito ang larawan ng Hebreo na nakaharap sila sa isang nakapangyayaring kalaban, nang hindi inuulit ang “laban sa amin” sa kasunod na parirala.
- source_word: הֶהָמוֹן הָרָב הַזֶּה
  choice: malaking pulutong na ito
  rationale: Ang הָמוֹן ay malaking pangkat o karamihan. Malinaw sa konteksto na armadong kalaban sila, ngunit hindi labis na tinutukoy ng “pulutong” ang salita bilang teknikal na “hukbo.”
- source_word: הַבָּא עָלֵינוּ
  choice: na dumarating laban sa amin
  rationale: Ipinahihiwatig ng participle ang nalalapit na banta, at ipinakikita ng “laban sa amin” ang mapanlabang diwa ng עַל sa kontekstong ito.
- source_word: וַאֲנַחְנוּ לֹא נֵדַע מַה נַּעֲשֶׂה
  choice: Hindi namin alam kung ano ang gagawin
  rationale: Payak at tuwirang ipinahahayag nito ang kanilang kawalan ng magawa at pinananatili ang kagyat na himig ng Hebreo.
- source_word: כִּי עָלֶיךָ עֵינֵינוּ
  choice: ngunit sa iyo kami nakatingin
  rationale: Ang literal na larawan ng mga matang nakatuon sa Diyos ay isang idyoma ng pagtitiwala at paghihintay. Natural sa Tagalog ang “sa iyo kami nakatingin,” at ipinakikita ng “ngunit” ang paglipat mula sa kawalan nila ng kaalaman tungo sa pag-asa sa Diyos.
theological_decisions:
- issue: Ugnayan ng huling כִּי sa naunang pagpapahayag ng kawalang-magawa
  choice: Isinalin bilang paghahambing na “ngunit sa iyo kami nakatingin.”
  alternative: “sapagkat sa iyo nakatuon ang aming mga mata”
  rationale: Karaniwang nangangahulugang “sapagkat/dahil” ang כִּי, ngunit sa daloy ng panalangin ang huling sugnay ay sukdulang pagpapahayag ng pagtitiwala sa kabila ng hindi nila pagkaalam sa gagawin. Pinananatili sa talababa ang mas pormal na pagbasa upang hindi maitago ang tunay na pagkakaiba sa sintaktikong pag-unawa.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang anyo ng panalangin at ang metapora ng pagtingin sa Diyos, habang iniwasan ang mga lumang pananalita at ang labis na pagtukoy sa הָמוֹן bilang isang teknikal na hukbo.
