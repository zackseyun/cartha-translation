  yaml_path: translation/ot/2_chronicles/034/023.yaml
  text: 'And she said to them[a], “Thus says Yahweh, the God of Israel: Say to the man who sent you to me,”'
translation:
  language: tl
  text: 'At sinabi niya sa kanila, “Ganito ang sabi ni Yahweh, ang Diyos ng Israel: Sabihin ninyo sa lalaking nagsugo sa inyo sa akin:”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֹּאמֶר לָהֶם
  choice: At sinabi niya sa kanila
  rationale: Pinananatili ang sunod-sunod na daloy ng salaysay at malinaw na tinutukoy ang mga kinausap ni Hulda.
- source_word: כֹּה אָמַר
  choice: Ganito ang sinabi
  rationale: Likas at marangal na anyo sa Filipino para sa pormulang pangmensahero ng propeta, habang pinananatili ang aspektong ganap ng pandiwang Hebreo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang isinasalin sa titik ang banal na pangalang YHWH sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ang Diyos ng Israel
  rationale: Tuwirang salin ng pariralang konstrukto at natural sa modernong Filipino.
- source_word: אִמְרוּ לָאִישׁ
  choice: Sabihin ninyo sa lalaking
  rationale: Ipinakikita ng “ninyo” na maramihan ang inuutusan, at pinananatili ng “lalaki” ang tiyak na panlalaking pangngalan sa Hebreo.
- source_word: אֲשֶׁר שָׁלַח אֶתְכֶם אֵלָי
  choice: nagsugo sa inyo sa akin
  rationale: Pinananatili ang pagkakakilanlan ng lalaki ayon sa kanyang ginawa at ang direksiyon ng pagsusugo kay Hulda.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Personal na pangalan ang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang pangalan sa halip na tahimik itong palitan ng titulong “PANGINOON.”
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “nagsugo” sa halip na “nagpadala” upang umangkop sa pormal na konteksto ng delegasyong ipinadala sa propeta. Sadyang hindi pa isinasara ang sipi dahil nagpapatuloy sa susunod na talata ang mensaheng ipinapasabi.
