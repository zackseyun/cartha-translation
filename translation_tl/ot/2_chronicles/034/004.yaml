id: 2CH.34.4
reference: 2 Chronicles 34:4
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יְנַתְּצ֣וּ לְ/פָנָ֗י/ו אֵ֚ת מִזְבְּח֣וֹת הַ/בְּעָלִ֔ים וְ/הַֽ/חַמָּנִ֛ים אֲשֶׁר לְ/מַ֥עְלָ/ה מֵ/עֲלֵי/הֶ֖ם גִּדֵּ֑עַ וְ֠/הָ/אֲשֵׁרִים וְ/הַ/פְּסִלִ֤ים וְ/הַ/מַּסֵּכוֹת֙ שִׁבַּ֣ר וְ/הֵדַ֔ק וַ/יִּזְרֹק֙ עַל פְּנֵ֣י הַ/קְּבָרִ֔ים הַ/זֹּבְחִ֖ים לָ/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/004.yaml
  text: They tore down before him the altars of the Baals[a], and he cut down the incense altars that were above them. He shattered and crushed the Asherim, the carved images, and the metal images[b], and scattered them over the graves of those who had sacrificed to them.
translation:
  language: tl
  text: Sa harap niya, giniba nila ang mga altar ng mga Baal, at pinutol niya ang mga altar ng insenso[a] na nasa ibabaw ng mga iyon. Binasag at dinurog niya ang mga Aserim[b], ang mga inukit na imahen, at ang mga imaheng hinulma mula sa metal. Pagkatapos, ikinalat niya ang mga iyon sa ibabaw ng mga libingan ng mga naghandog sa mga iyon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “mga haliging pang-araw.” Hindi tiyak ang salitang Hebreo at maaaring tumukoy sa mga haliging pangkulto na kaugnay ng pagsamba sa araw.
    reason: lexical_alternative
  - marker: b
    text: O, “mga poste ni Asera.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְנַתְּצוּ
  choice: giniba nila
  rationale: Pinananatili ang maramihang pandiwa ng Hebreo at malinaw na ipinahihiwatig ang paggiba ng mga estruktura.
- source_word: לְפָנָיו
  choice: sa harap niya
  rationale: Natural sa modernong Tagalog at pinananatili ang diwang naganap ito sa presensiya ni Josias.
- source_word: מִזְבְּחוֹת הַבְּעָלִים
  choice: mga altar ng mga Baal
  rationale: Pinananatili ang anyong maramihan ng בְּעָלִים, na maaaring tumukoy sa iba't ibang lokal na anyo o representasyon ng Baal.
- source_word: הַחַמָּנִים
  choice: mga altar ng insenso
  rationale: Ito ay maaaring tumukoy sa mga kagamitang pangkulto para sa insenso; dahil hindi tiyak ang kahulugan at maaari ring tumukoy sa mga haliging kaugnay ng pagsamba sa araw, inilagay ang alternatibo sa talababa.
- source_word: אֲשֶׁר לְמַעְלָה מֵעֲלֵיהֶם
  choice: na nasa ibabaw ng mga iyon
  rationale: Iniuugnay ang sugnay sa mga altar ng insenso at pinananatili ang kanilang posisyon sa ibabaw ng mga altar ng mga Baal.
- source_word: גִּדֵּעַ
  choice: pinutol niya
  rationale: Tumpak na nagpapahayag ng pagputol o pagpabagsak sa nakausling o nakatayong kagamitang pangkulto.
- source_word: הָאֲשֵׁרִים
  choice: mga Aserim
  rationale: Ang transliterasyon ay nagpapanatili sa kalabuan kung ang tinutukoy ay mga sagradong poste, ibang kagamitang pangkulto, o mga bagay na kaugnay ni Asera.
- source_word: הַפְּסִלִים
  choice: mga inukit na imahen
  rationale: Mas tiyak ito kaysa sa pangkalahatang 'mga diyus-diyosan' sapagkat ipinahihiwatig ng salita ang mga larawang inukit.
- source_word: הַמַּסֵּכוֹת
  choice: mga imaheng hinulma mula sa metal
  rationale: Ipinahahayag nito sa natural na Tagalog na ang mga imahen ay yari sa binubong o hinulmang metal.
- source_word: שִׁבַּר וְהֵדַק
  choice: binasag at dinurog
  rationale: Pinananatili ang dalawang magkasunod at mariing kilos ng pagwasak, kabilang ang pagpapaliit sa mga bagay o labi nito.
- source_word: וַיִּזְרֹק
  choice: ikinalat niya ang mga iyon
  rationale: Sa konteksto, ang ipinangalat ay ang mga bagay na binasag at dinurog o ang mga labi ng mga iyon; hindi tinutukoy nang tahasan ng Hebreo ang layon kaya hindi ito labis na nililinaw.
theological_decisions:
- issue: Kahulugan ng הָאֲשֵׁרִים
  choice: mga Aserim
  alternative: mga poste ni Asera
  rationale: Hindi tiyak kung ang termino ay tumutukoy lamang sa mga poste o sa mas malawak na uri ng mga kagamitang pangkulto na kaugnay ni Asera. Pinananatili ng transliterasyon ang kalabuan.
- issue: Kahulugan ng הַחַמָּנִים
  choice: mga altar ng insenso
  alternative: mga haliging pang-araw
  rationale: Pinagtatalunan ang tiyak na uri at gamit ng mga kagamitang ito. Ang pangunahing salin ay angkop sa kontekstong pangkulto, habang inilalahad sa talababa ang posibleng kaugnayan sa pagsamba sa araw.
translation_notes:
  register: Makabago ngunit marangal na Filipino ang ginamit. Pinanatili ang maramihang 'mga Baal,' ang transliterasyong 'mga Aserim,' at ang pagpapalit mula sa maramihang gumagawa ('giniba nila') tungo sa isahang gumagawa ('pinutol niya') ayon sa gramatika ng Hebreo. Inilagay ang mga pananda ng talababa sa mismong mga terminong may leksikal na kalabuan.
