  yaml_path: translation/ot/2_chronicles/034/019.yaml
  text: And when the king heard the words of the law[a], he tore his clothes.
translation:
  language: tl
  text: Nang marinig ng hari ang mga salita ng Kautusan[a], pinunit niya ang kanyang mga damit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “turo.” Maaaring tumukoy ang Hebreong torah sa pagtuturo sa mas malawak na diwa, bagaman dito ay tumutukoy ito sa tipanang Kautusang binabasa sa harap ng hari.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּשְׁמֹעַ
  choice: Nang marinig
  rationale: Ang waw-consecutive kasama ng כ at infinitive construct ay naghahayag ng pangyayaring kasabay o kasunod sa pakikinig. Ang “Nang marinig” ay likas at malinaw sa modernong Tagalog nang hindi ginagamit ang makalumang “At nangyari.”
- source_word: הַמֶּלֶךְ
  choice: ng hari
  rationale: Pinananatili ang titulong ginamit sa Hebreo sa halip na idagdag ang pangalang Josias mula sa konteksto.
- source_word: דִּבְרֵי
  choice: ang mga salita ng
  rationale: Tumutukoy ang construct plural ng דָּבָר sa nilalamang binasa o narinig; ang “mga salita” ang tuwiran at natural na katumbas.
- source_word: הַתּוֹרָה
  choice: Kautusan
  rationale: Bagaman maaaring mangahulugan ang תּוֹרָה ng mas malawak na “turo,” tumutukoy ito rito sa tipanang kautusang binabasa sa hari. Ang “Kautusan” ay malinaw at nakaugat sa gamit ng Bibliyang Tagalog.
- source_word: וַיִּקְרַע
  choice: pinunit niya
  rationale: Ang קָרַע ay tumutukoy sa pagpunit ng kasuotan bilang tanda ng matinding dalamhati, pagkabagabag, o pagsisisi. Ang “pinunit” ay karaniwan at marangal na pananalita.
- source_word: בְּגָדָיו
  choice: ang kanyang mga damit
  rationale: Pangkalahatang salita ang בֶּגֶד para sa kasuotan. Hindi ito nilimitahan sa “balabal” o kasuotang maharlika.
theological_decisions:
- issue: Paglalarawan sa תּוֹרָה sa konteksto ng reporma ni Josias
  choice: Kautusan
  alternative: turo; Torah
  rationale: Ipinahihiwatig ng konteksto ang tipanan at legal na nilalaman ng natagpuang aklat. Inihahatid ng “Kautusan” ang bigat na iyon nang hindi pinakikitid ang saklaw ng terminong Hebreo; pinananatili sa talababa ang tunay na alternatibong “turo.”
translation_notes:
  register: Modernong Filipino Tagalog na payak ngunit marangal. Ginamit ang “Nang marinig” para sa likas na daloy ng salaysay at “mga damit” sa halip na mas makaluma o labis na tiyak na katawagan. Ginawang malaking titik ang “Kautusan” bilang titulo o pagkakakilanlan ng tipanang kalipunan sa kontekstong ito.
