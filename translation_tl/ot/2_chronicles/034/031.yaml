  text: וַ/יַּעֲמֹ֨ד הַ/מֶּ֜לֶךְ עַל עָמְד֗/וֹ וַ/יִּכְרֹ֣ת אֶֽת הַ/בְּרִית֮ לִ/פְנֵ֣י יְהוָה֒ לָ/לֶ֜כֶת אַחֲרֵ֣י יְהוָ֗ה וְ/לִ/שְׁמ֤וֹר אֶת מִצְוֺתָי/ו֙ וְ/עֵֽדְוֺתָ֣י/ו וְ/חֻקָּ֔י/ו בְּ/כָל לְבָב֖/וֹ וּ/בְ/כָל נַפְשׁ֑/וֹ לַ/עֲשׂוֹת֙ אֶת דִּבְרֵ֣י הַ/בְּרִ֔ית הַ/כְּתוּבִ֖ים עַל הַ/סֵּ֥פֶר הַ/זֶּֽה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/031.yaml
  text: Then the king stood in his place and made the covenant before Yahweh[a], to walk after Yahweh and to keep his commandments and his testimonies and his statutes with all his heart and with all his soul, to carry out the words of the covenant that were written in this book.
translation:
  language: tl
  text: 'Pagkatapos, tumayo ang hari sa kanyang lugar at nakipagtipan sa harap ni Yahweh: lalakad siyang sumusunod kay Yahweh at tutuparin ang kanyang mga utos, mga patotoo, at mga tuntunin nang buong puso at buong kaluluwa, at isasagawa niya ang mga salita ng tipan na nakasulat sa aklat na ito.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin ang “aklat na ito” bilang “balumbong ito.” Ang salitang Hebreo ay maaaring tumukoy sa isang nakasulat na dokumentong nasa anyong balumbon.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֹד הַמֶּלֶךְ עַל־עָמְדוֹ
  choice: tumayo ang hari sa kanyang lugar
  rationale: Likas na isinasalin ang pandiwang עמד bilang “tumayo,” at ang idyomang עַל־עָמְדוֹ ay tumutukoy sa itinakda o kinatatayuan niyang lugar nang hindi labis na tinutukoy ang anyo ng gusali o seremonya.
- source_word: וַיִּכְרֹת אֶת־הַבְּרִית
  choice: nakipagtipan
  rationale: Ang כרת ברית ay karaniwang idyomang Hebreo para sa paggawa o pagpapatibay ng tipan. Ang “nakipagtipan” ay natural sa Tagalog at pinananatili ang pormal at panrelihiyong diwa.
- source_word: לִפְנֵי יְהוָה
  choice: sa harap ni Yahweh
  rationale: Ipinahahayag nito na ang taimtim na pakikipagtipan ay ginawa sa presensya ni Yahweh; pinananatili rin ang personal na pangalan ng Diyos.
- source_word: לָלֶכֶת אַחֲרֵי יְהוָה
  choice: lalakad siyang sumusunod kay Yahweh
  rationale: Pinananatili ng “lalakad” ang metaporang pangtipan, habang nililinaw ng “sumusunod” ang natural na kahulugan ng Hebreong parirala sa makabagong Tagalog.
- source_word: לִשְׁמוֹר
  choice: tutuparin
  rationale: Sa kontekstong legal at pangtipan, ang שמר ay nangangahulugang sundin, ingatan, o tuparin ang mga ipinag-uutos. Ang “tutuparin” ay malinaw at natural sa Tagalog.
- source_word: מִצְוֺתָיו וְעֵדְוֺתָיו וְחֻקָּיו
  choice: kanyang mga utos, mga patotoo, at mga tuntunin
  rationale: Pinananatili ang tatlong magkakahiwalay na katawagang legal sa Hebreo sa halip na pagsamahin ang mga ito sa iisang pangkalahatang salita.
- source_word: בְּכָל־לְבָבוֹ וּבְכָל־נַפְשׁוֹ
  choice: nang buong puso at buong kaluluwa
  rationale: Pinananatili nito ang pormulang pangtipan at ang ugnay nito sa wikang Deuteronomiko, nang hindi pinapaliit ang “kaluluwa” tungo lamang sa damdamin o buhay.
- source_word: לַעֲשׂוֹת אֶת־דִּבְרֵי הַבְּרִית
  choice: isasagawa niya ang mga salita ng tipan
  rationale: Ang “isasagawa” ay natural na nagpapahayag ng aktuwal na pagsunod, samantalang pinananatili ng “mga salita ng tipan” ang literal at makabuluhang parirala sa Hebreo.
- source_word: הַסֵּפֶר הַזֶּה
  choice: aklat na ito
  rationale: Ang סֵפֶר ay isang nakasulat na dokumento at karaniwang maisasaling “aklat”; inilalagay sa talababa ang mas makasaysayang posibilidad na ito ay balumbon.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Tuwirang ginagamit ng teksto ang Tetragrammaton. Ang “Yahweh” ay nagpapanatili sa personal at pangtipang pangalan sa halip na palitan ito ng titulo.
- issue: Pagpapanatili sa metapora ng לָלֶכֶת אַחֲרֵי יְהוָה
  choice: lalakad siyang sumusunod kay Yahweh
  alternative: susunod siya kay Yahweh
  rationale: Pinananatili ang imahen ng paglakad at ang Deuteronomikong himig nito, ngunit idinaragdag ang “sumusunod” upang maging malinaw at natural sa Tagalog.
- issue: Saklaw ng pangako sa tipan
  choice: Iniharap ang mga infinitive bilang nilalaman ng pakikipagtipan ng hari
  alternative: Basahin lamang ang mga ito bilang pangkalahatang layunin ng seremonya
  rationale: Sa Hebreo, ang mga infinitive na “lumakad,” “ingatan,” at “isagawa” ay natural na nagpapaliwanag sa nilalaman o layunin ng tipang ginawa ng hari; hindi tinutukoy nang higit sa teksto kung ito ay bagong tipan o pormal na pagpapanibago.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang bokabularyong pangtipan—“tipan,” “mga patotoo,” “mga tuntunin,” “buong puso,” at “buong kaluluwa”—dahil mahalaga ang mga ugnay nito sa ibang bahagi ng Kasulatan. Inilipat ang tandang talababa sa “aklat na ito,” sapagkat doon nauukol ang paliwanag tungkol sa aklat o balumbon.
