  text: Then the king sent and gathered all the elders of Judah and Jerusalem[a].
translation:
  language: tl
  text: Pagkatapos, ipinatawag ng hari at tinipon ang lahat ng matatanda ng Juda at Jerusalem.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas literal, “Pagkatapos, nagpadala ang hari at tinipon ang lahat ng matatanda ng Juda at Jerusalem.”
    reason: Ipinakikita ang mas literal na salin ng וַיִּשְׁלַח (“nagpadala”), sapagkat hindi tahasang binabanggit sa Hebreo ang ipinadalang mensahe, utos, o sugo.
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: ipinatawag
  rationale: Ang literal na diwa ay “nagsugo/nagpadala,” ngunit sa kontekstong kasunod ang pagtitipon sa mga pinuno, likas sa Filipino ang “ipinatawag.” Ipinahihiwatig nito ang pagpapadala ng utos o sugo nang hindi tinutukoy ang paraang hindi naman tahasang sinabi.
- source_word: הַמֶּלֶךְ
  choice: ang hari
  rationale: Pinanatili ang titulong ginamit sa Hebreo sa halip na ipalit ang pangalang Josias mula sa konteksto.
- source_word: וַיֶּאֱסֹף
  choice: tinipon
  rationale: Tuwirang ipinapahayag ang pagbuo ng kapulungan at natural itong gamitin para sa mga pinuno.
- source_word: אֶת כָּל
  choice: ang lahat ng
  rationale: Hindi isinasalin ang pantukoy sa tuwirang layon na אֶת; pinananatili ng “lahat” ang kabuuang saklaw ng כָּל.
- source_word: זִקְנֵי
  choice: matatandang pinuno
  rationale: Tumutukoy ang salita sa kinikilalang mga elder o pinuno ng pamayanan, hindi lamang sa matatandang lalaki. Ang “matatandang pinuno” ay malinaw sa karaniwang modernong Filipino habang pinananatili ang tradisyonal na katangian ng tungkulin.
- source_word: יְהוּדָה וִירוּשָׁלִָם
  choice: ng Juda at Jerusalem
  rationale: Ipinakikita ng parirala na ang mga pinunong tinipon ay mula o kabilang sa Juda at Jerusalem; hindi kailangang ulitin ang “ng” sa natural na Filipino.
