id: 2CH.34.22
reference: 2 Chronicles 34:22
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יֵּ֨לֶךְ חִלְקִיָּ֜הוּ וַ/אֲשֶׁ֣ר הַ/מֶּ֗לֶךְ אֶל חֻלְדָּ֨ה הַ/נְּבִיאָ֜ה אֵ֣שֶׁת שַׁלֻּ֣ם בֶּן תוקהת בֶּן חַסְרָה֙ שׁוֹמֵ֣ר הַ/בְּגָדִ֔ים וְ/הִ֛יא יוֹשֶׁ֥בֶת בִּ/ירוּשָׁלִַ֖ם בַּ/מִּשְׁנֶ֑ה וַ/יְדַבְּר֥וּ אֵלֶ֖י/הָ כָּ/זֹֽאת־׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/022.yaml
  text: 'Then Hilkiah and those whom the king had sent went to Huldah the prophetess[a], the wife of Shallum son of Tokhath, son of Hasrah, keeper of the garments. She lived in Jerusalem in the Second Quarter[b], and they spoke to her thus:'
translation:
  language: tl
  text: 'Kaya pumunta si Hilkias at ang mga inutusan ng hari kay Hulda na propetisa, na asawa ni Salum na anak ni Tokhat, na anak naman ni Hasra. Si Salum ang tagapangalaga ng mga kasuotan.[a] Nakatira si Hulda sa Ikalawang Distrito[b] ng Jerusalem. Ganito ang sinabi nila sa kanya:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring “tagapangalaga ng aparador.” Literal sa Hebreo: “tagapangalaga ng mga kasuotan.”'
    reason: lexical_alternative
  - marker: b
    text: 'Hebreo: Mishneh, malamang na pangalan ng isang distrito ng Jerusalem; tradisyonal na isinasaling “Ikalawang Distrito.”'
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: Kaya pumunta
  rationale: Likas na salaysay sa Tagalog para sa Hebrew wayyiqtol; ipinagpapatuloy nito ang pangyayari mula sa naunang talata.
- source_word: וַאֲשֶׁר הַמֶּלֶךְ
  choice: at ang mga inutusan ng hari
  rationale: Elliptical ang Hebrew at tumutukoy sa delegasyong binanggit sa naunang talata. Nilinaw sa Tagalog ang ipinahihiwatig na pagsusugo nang hindi tinutukoy kung sino-sino sila.
- source_word: חֻלְדָּה הַנְּבִיאָה
  choice: Hulda na propetisa
  rationale: Pinanatili ng 'propetisa' ang tahasang pambabaeng anyo ng pangngalan sa Hebrew.
- source_word: אֵשֶׁת שַׁלֻּם
  choice: asawa ni Salum
  rationale: Tuwirang ipinapahayag ng construct phrase ang ugnayang mag-asawa.
- source_word: בֶּן תוקהת בֶּן חַסְרָה
  choice: anak ni Tokhat, na anak naman ni Hasra
  rationale: Pinanatili ang sunod-sunod na talaangkanan sa malinaw at natural na Tagalog.
- source_word: שׁוֹמֵר הַבְּגָדִים
  choice: tagapangalaga ng mga kasuotan
  rationale: Malapit sa literal na kahulugan ng Hebrew at hindi labis na tinutukoy kung pribado o opisyal na aparador ang saklaw ng tungkulin.
- source_word: וְהִיא יוֹשֶׁבֶת
  choice: Nakatira si Hulda
  rationale: Ang participle ay nagbibigay ng impormasyong pangkaligiran tungkol sa patuloy niyang paninirahan. Inulit ang pangalan upang maiwasan ang malabong panghalip matapos banggitin si Salum at ang kanyang mga ninuno.
- source_word: בַּמִּשְׁנֶה
  choice: sa Ikalawang Distrito
  rationale: Malamang na pangalan ito ng isang bahagi ng Jerusalem. Isinalin ang kahulugan at iniingatan sa talababa ang posibilidad na pantanging pangalan ang Mishneh.
- source_word: וַיְדַבְּרוּ אֵלֶיהָ כָּזֹאת
  choice: 'Ganito ang sinabi nila sa kanya:'
  rationale: Natural na panimula sa susunod na pahayag at pinananatili ang demonstrative force ng כָּזֹאת.
theological_decisions:
- issue: Pagkilala sa pambabaeng katungkulan ni Hulda
  choice: propetisa
  alternative: propeta
  rationale: Ang Hebrew הַנְּבִיאָה ay tahasang pambabae; inilalarawan lamang ng salin ang gramatika at identidad sa teksto nang walang idinaragdag na doktrinal na konklusyon.
translation_notes:
  register: 'Makabago, malinaw, at marangal na Filipino. Ginamit ang karaniwang anyong Filipino ng mga pangalang Hilkias, Hulda, Salum, Tokhat, at Hasra. Hinati sa tatlong pangungusap ang mahabang sugnay sa Hebrew upang maging madaling maunawaan, at inulit ang mga pangalang Salum at Hulda upang alisin ang kalabuan ng mga panghalip. Itinama rin ang pagkakalagay ng mga marker: [a] sa tungkulin sa mga kasuotan at [b] sa Ikalawang Distrito.'
