  text: כֹּ֚ה אָמַ֣ר יְהוָ֔ה הִנְ/נִ֨י מֵבִ֥יא רָעָ֛ה עַל הַ/מָּק֥וֹם הַ/זֶּ֖ה וְ/עַל יוֹשְׁבָ֑י/ו אֵ֤ת כָּל הָ/אָלוֹת֙ הַ/כְּתוּב֣וֹת עַל הַ/סֵּ֔פֶר אֲשֶׁ֣ר קָֽרְא֔וּ לִ/פְנֵ֖י מֶ֥לֶךְ יְהוּדָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/024.yaml
  text: 'Thus says Yahweh: Behold[b][a], I am bringing disaster on this place and on its inhabitants—all the curses written in the book that they have read before the king of Judah.'
translation:
  language: tl
  text: 'Ganito ang sabi ni Yahweh: “Narito, ipapasapit ko sa lugar na ito at sa mga naninirahan dito ang kapahamakan—ang lahat ng sumpang[b] nakasulat sa aklat[a] na binasa nila sa harap ng hari ng Juda.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “balumbon.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isaling “mga sumpang kalakip ng panunumpa,” na nagbibigay-diin sa mga parusang itinakda sa tipan.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos na nasa tekstong Hebreo.
- source_word: כֹּה אָמַר
  choice: Ganito ang sinabi
  rationale: Likas at marangal na anyo sa modernong Tagalog para sa pormulang ginagamit ng mensaherong propetiko.
- source_word: הִנְנִי
  choice: Narito
  rationale: Pinananatili ang diin at solemneng pagpapahayag ng Hebreo nang hindi nagiging lipas ang pananalita.
- source_word: מֵבִיא רָעָה
  choice: ipapasapit ko ... ang kapahamakan
  rationale: Sa konteksto, ang רָעָה ay mapaminsalang hatol, hindi kasamaan sa moral na diwa. Ipinahihiwatig ng 'ipapasapit' ang tiyak at nalalapit na pagkilos.
- source_word: הַמָּקוֹם הַזֶּה
  choice: lugar na ito
  rationale: Tuwirang salin na hindi labis na tinutukoy bilang Jerusalem o Juda ang saklaw na iniwang implicit ng talata.
- source_word: יוֹשְׁבָיו
  choice: mga naninirahan dito
  rationale: Malinaw at natural na salin ng participial noun at ng hulaping tumutukoy sa lugar.
- source_word: אֵת כָּל הָאָלוֹת
  choice: ang lahat ng sumpa
  rationale: Ang אָלוֹת ay mga sumpang kaugnay ng mga parusa ng tipan; 'mga sumpa' ang pinakamalinaw na karaniwang salin, habang inilalagay sa talababa ang aspektong panunumpa.
- source_word: הַכְּתוּבוֹת עַל הַסֵּפֶר
  choice: nakasulat sa aklat
  rationale: Idyomatiko sa Tagalog; maaaring tumukoy ang סֵפֶר sa balumbon, kaya pinananatili ang alternatibo sa talababa.
- source_word: אֲשֶׁר קָרְאוּ לִפְנֵי
  choice: na binasa nila sa harap ng
  rationale: Pinananatili ang tahasang maramihang simuno ng pandiwang Hebreo at ang kahulugang ginawa ito sa presensiya ng hari.
- source_word: מֶלֶךְ יְהוּדָה
  choice: hari ng Juda
  rationale: Tuwiran at likas na salin ng konstruksiyong Hebreo.
theological_decisions:
- issue: Kahulugan ng רָעָה sa konteksto ng hatol ng Diyos
  choice: kapahamakan
  alternative: kasamaan; kalamidad
  rationale: Tinutukoy rito ang mapaminsalang hatol na nakasaad sa tipan. Iniiwasan ng 'kapahamakan' ang maling pahiwatig na moral na kasamaan ang ginagawa ng Diyos, ngunit pinananatili ang bigat ng hatol.
- issue: Kalikasan ng אָלוֹת
  choice: mga sumpa
  alternative: mga sumpang kalakip ng panunumpa
  rationale: Ang payak na 'mga sumpa' ay malinaw sa pangunahing teksto; ipinapaliwanag sa talababa ang posibleng teknikal na diin sa mga parusang pinagtibay ng sumpa sa tipan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang 'Narito' upang mapanatili ang solemneng diin, at ang em dash upang ipakitang ang 'lahat ng sumpa' ay nagpapaliwanag sa kapahamakang ipapasapit.
