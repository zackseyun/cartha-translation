id: 2CH.34.26
reference: 2 Chronicles 34:26
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/אֶל מֶ֣לֶךְ יְהוּדָ֗ה הַ/שֹּׁלֵ֤חַ אֶתְ/כֶם֙ לִ/דְר֣וֹשׁ בַּֽ/יהוָ֔ה כֹּ֥ה תֹאמְר֖וּ אֵלָ֑י/ו כֹּֽה אָמַ֤ר יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל הַ/דְּבָרִ֖ים אֲשֶׁ֥ר שָׁמָֽעְתָּ־ס־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/026.yaml
  text: 'But to the king of Judah[a], who sent you to inquire of Yahweh, thus you shall say to him: ‘Thus says Yahweh, the God of Israel: As for the words that you have heard—’'
translation:
  language: tl
  text: 'Ngunit sa hari ng Juda, na nagsugo sa inyo upang sumangguni kay Yahweh[a], ganito ang sasabihin ninyo sa kanya: “Ganito ang sabi ni Yahweh, ang Diyos ng Israel: Tungkol sa mga salitang narinig mo—”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “upang hanapin si Yahweh” o “upang magtanong kay Yahweh.” Maaaring saklawin ng pandiwang Hebreo kapuwa ang paghahanap at ang pagsangguni, lalo na sa kontekstong propetiko.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֶל
  choice: Ngunit sa
  rationale: Ipinahihiwatig ng וְ ang paglipat at bahagyang pagsalungat mula sa naunang pahayag, samantalang pinananatili ng “sa” ang direksiyon ng אֶל.
- source_word: מֶלֶךְ יְהוּדָה
  choice: hari ng Juda
  rationale: Tuwirang salin ng construct chain at likas na parirala sa modernong Tagalog.
- source_word: הַשֹּׁלֵחַ אֶתְכֶם
  choice: na nagsugo sa inyo
  rationale: Ang participleng may pantukoy ay tumutukoy sa hari bilang siyang nagsugo sa pangkat; ang pangnagdaang anyo ay natural sa konteksto.
- source_word: לִדְרֹשׁ בַּיהוָה
  choice: upang sumangguni kay Yahweh
  rationale: Sa kontekstong propetiko, ang דרשׁ na may בְּ ay tumutukoy sa paglapit upang humingi ng sagot o patnubay; malinaw itong naipahahayag ng “sumangguni” nang hindi inaalis ang mas malawak na diwang “hanapin.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal at tipanang pangalan ng Diyos na nasa tekstong Hebreo.
- source_word: כֹּה תֹאמְרוּ אֵלָיו
  choice: ganito ang sabihin ninyo sa kanya
  rationale: Pinananatili ang pormulang pangmensahero at ang maramihang utos sa mga isinugo.
- source_word: כֹּה אָמַר יְהוָה
  choice: Ganito ang sabi ni Yahweh
  rationale: Natural at marangal na pormulang propetiko sa Tagalog na hindi pinipilit ang Hebreong perfect bilang karaniwang pangnagdaan lamang.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ang Diyos ng Israel
  rationale: Tuwirang salin ng pariralang construct na kumikilala kay Yahweh kaugnay ng Israel.
- source_word: הַדְּבָרִים אֲשֶׁר שָׁמָעְתָּ
  choice: Tungkol sa mga salitang narinig mo—
  rationale: Pinananatili ang paksaing nakaharap sa unahan at ang sintaks na nakabitin hanggang sa kasunod na talata; ipinakikita ng gitling na nagpapatuloy ang pangungusap.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Nasa Hebreo ang Tetragrammaton bilang mismong pangalan ng Diyos; ang “Yahweh” ay tuwirang transliterasyon at hindi ito pinapalitan ng titulo.
- issue: Saklaw ng kahulugang לִדְרֹשׁ בַּיהוָה
  choice: sumangguni kay Yahweh
  alternative: hanapin si Yahweh; magtanong kay Yahweh
  rationale: Ang agarang konteksto ay isang delegasyong humihingi ng banal na tugon, ngunit kinikilala sa talababa na maaari ring taglayin ng pandiwa ang diwa ng paghahanap.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “sumangguni” para sa kontekstong propetiko, at pinanatili ang nakabitin na hulihan sa pamamagitan ng mahabang gitling sapagkat sa susunod na talata pa natatapos ang pahayag.
