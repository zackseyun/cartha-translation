  terminology: Wasto at pare-pareho ang mga katawagang institusyonal. Ang “Levita” ay ang karaniwang anyong Tagalog para sa Levites; ang “eskriba,” “opisyal,” at “bantay-pinto” ay sapat na tumpak nang hindi nagpapataw ng mas tiyak na modernong tungkulin.
