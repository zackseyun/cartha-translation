base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/013.yaml
  text: They were over the burden-bearers and supervised everyone doing work for service after service; and some of the Levites were scribes[a], officers, and gatekeepers.
translation:
  language: tl
  text: Sila ang namamahala sa mga tagapasan at nangangasiwa sa lahat ng gumagawa ng gawain para sa bawat uri ng paglilingkod.[a] Ang ilan naman sa mga Levita ay mga eskriba, mga opisyal, at mga bantay-pinto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “para sa paglilingkod at paglilingkod.” Malamang na ipinahihiwatig ng pag-uulit sa Hebreo ang sari-saring gawaing iniatas; maaari ring isalin na “sa sunod-sunod na paglilingkod.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל הַסַּבָּלִים
  choice: namamahala sa mga tagapasan
  rationale: Sa kontekstong administratibo, ang עַל ay nagpapahiwatig ng pamamahala o pangangasiwa, at ang סַבָּלִים ay partikular na tumutukoy sa mga nagdadala ng mabibigat na pasan.
- source_word: וּמְנַצְּחִים
  choice: nangangasiwa
  rationale: Ang participle mula sa נצח ay tumutukoy rito sa pagdidirekta o pangangasiwa sa mga manggagawa.
- source_word: לְכֹל עֹשֵׂה מְלָאכָה
  choice: sa lahat ng gumagawa ng gawain
  rationale: Pinananatili nito ang malawak at distributibong saklaw ng כֹל at ang kilos na ipinahahayag ng participle עֹשֵׂה.
- source_word: לַעֲבוֹדָה וַעֲבוֹדָה
  choice: para sa bawat uri ng paglilingkod
  rationale: Ang pag-uulit ng עֲבוֹדָה ay malamang na distributibo at tumutukoy sa sari-saring gawaing iniatas. Isinasalin ito nang natural sa Tagalog habang itinatala sa talababa ang literal na anyo at posibleng nuance.
- source_word: וּמֵהַלְוִיִּם
  choice: ang ilan naman sa mga Levita
  rationale: 'Partitibo ang מִן: ilang miyembro ng pangkat ng mga Levita ang gumanap sa mga kasunod na tungkulin.'
- source_word: סוֹפְרִים
  choice: mga eskriba
  rationale: Karaniwang katawagan ito sa mga sinaunang tagasulat o tagapagtala at pinananatili ang institusyonal na kahulugan ng salita.
- source_word: שֹׁטְרִים
  choice: mga opisyal
  rationale: Tumutukoy ang salita sa mga may administratibo o tagapangasiwang tungkulin; sapat na malawak at malinaw ang “mga opisyal.”
- source_word: שׁוֹעֲרִים
  choice: mga bantay-pinto
  rationale: Tuwirang ipinahahayag nito ang tungkulin ng mga nakatalaga sa mga pintuang-daan, lalo na sa templo.
theological_decisions: []
translation_notes:
  register: Makabagong Filipino na malinaw at marangal ang ginamit. Pinili ang “tagapasan,” “eskriba,” “opisyal,” at “bantay-pinto” upang mapanatili ang mga natatanging tungkulin sa sinaunang konteksto. Inilagay ang talababa pagkatapos ng pariralang tunay nitong ipinapaliwanag.
