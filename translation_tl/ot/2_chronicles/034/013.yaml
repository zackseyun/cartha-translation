  source_fidelity: 'Tapat ang salin sa estruktura at saklaw ng Hebreo: ang mga tinutukoy ay namamahala sa mga tagapasan at nangangasiwa sa lahat ng gumagawa, at ilan sa mga Levita ay may mga tungkuling eskriba, opisyal, at bantay-pinto. Ang “para sa bawat uri ng paglilingkod” ay isang likas na distributibong paglalapat ng inuulit na לַעֲבוֹדָה וַעֲבוֹדָה, at maayos na itinatala ng talababa ang literal na pag-uulit at ang alternatibong pagbasa.'
