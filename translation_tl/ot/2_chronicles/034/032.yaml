base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/032.yaml
  text: Then he made everyone who was found in Jerusalem and Benjamin stand to it[a], and the inhabitants of Jerusalem acted according to the covenant of God[b], the God of their fathers.
translation:
  language: tl
  text: Pagkatapos, pinatayo niya ang lahat ng naroon sa Jerusalem at Benjamin[a], at kumilos ang mga naninirahan sa Jerusalem ayon sa tipan ng Diyos, ang Diyos ng kanilang mga ninuno.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari rin itong mangahulugang inatasan niya silang manindigan sa tipan o manatiling tapat dito.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֵד
  choice: pinatayo niya
  rationale: Ang Hiphil ng עמד ay pangunahing nangangahulugang “magpatayo” o “magpangyaring tumayo.” Pinananatili ng salin ang larawan ng pagtayo at hindi tahasang nilulutas kung pisikal na pagtayo lamang o paninindigan sa tipan ang tinutukoy.
- source_word: אֵת כָּל הַנִּמְצָא
  choice: ang lahat ng naroon
  rationale: Likas sa makabagong Tagalog ang “lahat ng naroon” at tumpak nitong ipinahahayag ang kabuuan ng mga taong nasumpungan o naroroon.
- source_word: בִירוּשָׁלִַם וּבִנְיָמִן
  choice: sa Jerusalem at Benjamin
  rationale: Tuwirang pinananatili ang mga pangalang pook. Maaaring tumukoy ang Benjamin sa nasasakupan o mamamayan ng tribo, ngunit hindi ito pinalalawak dahil maikli rin ang Hebreo.
- source_word: וַיַּעֲשׂוּ
  choice: kumilos
  rationale: Sa pagkakaugnay nito sa כִּבְרִית, ipinahihiwatig ng עשה ang pagkilos na kaayon ng tipan. Ang “kumilos” ay malinaw at hindi kasing-tiyak ng “tumupad,” na maaaring magdagdag ng diin na wala sa pandiwa.
- source_word: יֹשְׁבֵי יְרוּשָׁלִַם
  choice: ang mga naninirahan sa Jerusalem
  rationale: Natural at malinaw na katumbas ito ng mga taong nakatira sa Jerusalem.
- source_word: כִּבְרִית
  choice: ayon sa tipan
  rationale: Ang prefiks na כ־ ay nagpapahayag dito ng pagsunod o pagkakaayon; likas at maikli sa Tagalog ang “ayon sa tipan.”
- source_word: אֱלֹהִים אֱלֹהֵי אֲבוֹתֵיהֶם
  choice: ng Diyos, ang Diyos ng kanilang mga ninuno
  rationale: Pinananatili ang appositional na pag-uulit sa Hebreo at ang diin sa Diyos bilang Diyos ng kanilang mga ninuno.
theological_decisions:
- issue: Ang diwa ng ginawa ni Josias sa pagpapanibago ng tipan
  choice: Pinatayo niya ang mga naroon, na sa konteksto ay maaari ring magpahiwatig ng pagpapapanindigan sa kanila sa tipan.
  alternative: Tahasan niyang pinangakong paninindigan o pinapasok sa tipan ang lahat ng naroon.
  rationale: Ang pandiwa ay literal na causative na “magpatayo,” ngunit nagpapahiwatig ang konteksto ng pananagutan sa tipan. Pinananatili sa pangunahing teksto ang konkretong larawan at inilalahad sa talababa ang posibleng pinalawak na diwa nang hindi nagdaragdag ng seremonyang hindi tahasang binanggit.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “mga ninuno” sa halip na literal na “mga ama” upang natural na tumukoy sa mga naunang salinlahi. Ang “pinatayo” ay sadyang nagpapanatili sa konkretong larawan at sa tunay na kalabuan ng Hebreo.
