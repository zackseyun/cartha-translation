  source_fidelity: Tumpak na naihahatid ng salin ang pag-akyat ng hari sa bahay ni Yahweh, ang malawak na hanay ng mga dumalo, at ang pagbasa nang malakas ng buong nilalaman ng aklat ng tipan. Ang “pinakahamak,” gayunman, ay maaaring magpahiwatig ng matinding paghamak o pagkasuklam na wala sa idyomang Hebreo na “mula sa dakila hanggang sa maliit.”
  naturalness: Marangal at likas ang modernong Filipino Tagalog ng karamihan ng talata. Mas natural at mas malapit sa antas ng idyomang Hebreo ang “mula sa dakila hanggang sa maliit” kaysa “mula sa pinakadakila hanggang sa pinakahamak.”
  terminology: Ang “Yahweh,” “bahay ni Yahweh,” “mga pari,” “mga Levita,” at “aklat ng tipan” ay pare-pareho at angkop. Napananatili rin ng “lahat ng lalaki ng Juda” ang tahasang panlalaking anyo ng אִישׁ nang hindi binubura ang kasunod na pagtukoy sa buong bayan.
