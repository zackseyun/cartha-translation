source:
  edition: WLC
  text: וַ/יַּ֣עַל הַ/מֶּ֣לֶךְ בֵּית יְ֠הוָה וְ/כָל אִ֨ישׁ יְהוּדָ֜ה וְ/יֹשְׁבֵ֣י יְרוּשָׁלִַ֗ם וְ/הַ/כֹּֽהֲנִים֙ וְ/הַ/לְוִיִּ֔ם וְ/כָל הָ/עָ֖ם מִ/גָּד֣וֹל וְ/עַד קָטָ֑ן וַ/יִּקְרָ֣א בְ/אָזְנֵי/הֶ֗ם אֶת כָּל דִּבְרֵי֙ סֵ֣פֶר הַ/בְּרִ֔ית הַ/נִּמְצָ֖א בֵּ֥ית יְהוָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/030.yaml
  text: Then the king went up to the house of Yahweh[a], and every man of Judah, and the inhabitants of Jerusalem, and the priests and the Levites, and all the people, from great to small[b]; and he read in their hearing all the words of the book of the covenant that had been found in the house of Yahweh.
translation:
  language: tl
  text: Pagkatapos, umakyat ang hari sa bahay ni Yahweh[a], kasama ang lahat ng lalaki ng Juda, ang mga naninirahan sa Jerusalem, ang mga pari at mga Levita, at ang buong bayan, mula sa dakila hanggang sa maliit. Binasa niya sa pandinig nila ang lahat ng salita ng aklat ng tipan na natagpuan sa bahay ni Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “Yahweh” ang personal na pangalang Hebreo ng Diyos, na madalas isinasalin bilang “PANGINOON.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: umakyat
  rationale: Pinananatili ang direksiyonal na diwa ng עלה at natural sa pagpunta sa templo.
- source_word: בֵּית יְהוָה
  choice: bahay ni Yahweh
  rationale: Malapit sa literal na Hebreong 'bahay ni YHWH' at malinaw pa rin bilang tawag sa templo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat ang banal na pangalang YHWH sa halip na palitan ito ng isang titulo.
- source_word: כָל אִישׁ יְהוּדָה
  choice: lahat ng lalaki ng Juda
  rationale: Ang אִישׁ ay panlalaking katawagan at distributibo rito; ang maramihang pahayag ay mas natural sa Tagalog kaysa 'bawat lalaki.'
- source_word: יֹשְׁבֵי יְרוּשָׁלִַם
  choice: mga naninirahan sa Jerusalem
  rationale: Likas at tumpak na katumbas ng participial na 'mga naninirahan.'
- source_word: הַכֹּהֲנִים
  choice: mga pari
  rationale: Karaniwang katumbas sa kontekstong panrelihiyon.
- source_word: הַלְוִיִּם
  choice: mga Levita
  rationale: Karaniwang katawagan sa pangkat na mula sa lipi ni Levi.
- source_word: כָל הָעָם
  choice: ang buong bayan
  rationale: Ipinahahayag ang kabuuan ng sambayanang nagkatipon.
- source_word: מִגָּדוֹל וְעַד קָטָן
  choice: mula sa pinakadakila hanggang sa pinakahamak
  rationale: Inihahatid ang idyomatikong saklaw ng katayuang panlipunan; mas malinaw sa modernong Tagalog kaysa literal na 'malaki hanggang maliit.'
- source_word: וַיִּקְרָא
  choice: binasa niya
  rationale: Sa konteksto ng isang aklat at ng mga nakikinig, ang קרא ay tumutukoy sa pagbasa nang malakas.
- source_word: בְאָזְנֵיהֶם
  choice: sa pandinig nila
  rationale: Pinananatili ang Hebreong idyoma sa isang natural at marangal na pahayag sa Tagalog.
- source_word: כָּל דִּבְרֵי
  choice: ang lahat ng salita
  rationale: Pinananatili ang tekstuwal na diin sa mismong mga salita ng kasulatang tipan.
theological_decisions:
- issue: Pagpapahayag sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo; pinananatili ito sa transliterasyong Yahweh nang hindi pinapalitan ng titulo.
- issue: Panlalaking wika sa כָל אִישׁ יְהוּדָה
  choice: lahat ng lalaki ng Juda
  alternative: lahat ng taga-Juda; bawat lalaki ng Juda
  rationale: Pinananatili ang tahasang panlalaking אִישׁ, samantalang natural na Tagalog ang kolektibong anyo; binabanggit din sa kasunod na parirala ang buong bayan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Pinanatili ang 'bahay ni Yahweh' at 'sa pandinig nila' upang maipakita ang anyo ng Hebreo nang hindi nagiging di-likas; ginamit ang 'pinakadakila hanggang sa pinakahamak' para sa malinaw na kahulugang panlipunan ng idyoma.
