  source_fidelity: 'Tapat ang salin sa pagkakasunod at saklaw ng Hebreo: ang ikawalo at ikalabindalawang taon ng paghahari, ang pagiging bata pa ni Josias, ang pagsisimula niyang hanapin ang Diyos ni David, at ang paglilinis sa Juda at Jerusalem mula sa nakatalang mga bagay at pook-kulto. Ang “ninuno” ay isang malinaw na modernong pagpapahayag ng dinastikong אָבִיו, at pinananatili ng talababa ang literal na “ama.”'
  naturalness: Natural at marangal ang modernong Filipino Tagalog. Ang “matataas na lugar ng pagsamba,” “mga sagisag ni Ashera,” at “mga imaheng hinulma mula sa metal” ay malinaw sa mambabasa nang hindi nagiging labis na malaya.
  terminology: Maayos ang paggamit ng “Diyos,” “Juda,” “Jerusalem,” at “Ashera.” Ang “mga sagisag ni Ashera” ay maingat na pinananatili ang kawalang-katiyakan sa pisikal na anyo ng אֲשֵׁרִים; ang “inukit na imahen” at “imaheng hinulma mula sa metal” ay wastong naipagkaiba ang פְּסִלִים at מַסֵּכוֹת. Ang mga talababa ay wastong nakaangkla at tumutugon sa mahahalagang alternatibong pagbasa.
