  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וּ/בִ/שְׁמוֹנֶ֨ה שָׁנִ֜ים לְ/מָלְכ֗/וֹ וְ/הוּא֙ עוֹדֶ֣/נּוּ נַ֔עַר הֵחֵ֕ל לִ/דְר֕וֹשׁ לֵ/אלֹהֵ֖י דָּוִ֣יד אָבִ֑י/ו וּ/בִ/שְׁתֵּ֧ים עֶשְׂרֵ֣ה שָׁנָ֗ה הֵחֵל֙ לְ/טַהֵ֔ר אֶת יְהוּדָה֙ וִ/יר֣וּשָׁלִַ֔ם מִן הַ/בָּמוֹת֙ וְ/הָ֣/אֲשֵׁרִ֔ים וְ/הַ/פְּסִלִ֖ים וְ/הַ/מַּסֵּכֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/003.yaml
  text: In the eighth year of his reign[a], while he was still a youth, he began to seek the God of David his father; and in the twelfth year he began to cleanse Judah and Jerusalem from the high places, the Asherim, the carved images[c][b], and the metal images.
translation:
  language: tl
  text: Sa ikawalong taon ng kanyang paghahari, habang bata pa siya, nagsimula siyang hanapin ang Diyos ni David na kanyang ninuno.[a] At sa ikalabindalawang taon, sinimulan niyang linisin ang Juda at Jerusalem mula sa matataas na lugar ng pagsamba, sa mga sagisag ni Ashera,[b] sa mga inukit na imahen, at sa mga imaheng hinulma mula sa metal.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “ang Diyos ni David na kanyang ama.” Karaniwang tinatawag na “ama” ang isang ninuno sa wikang dinastiko ng Bibliya.
    reason: lexical_alternative
  - marker: b
    text: Maaaring tumukoy sa mga poste o punong sagrado na kaugnay ni Ashera.
    reason: lexical_alternative
  - marker: c
    text: O “mga imaheng binubo,” na ginawa sa pamamagitan ng paghuhulma ng tunaw na metal.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִשְׁמוֹנֶה שָׁנִים לְמָלְכוֹ
  choice: Sa ikawalong taon ng kanyang paghahari
  rationale: Likas at tiyak na ipinapahayag sa Tagalog ang χρονolohiyang batay sa taon ng paghahari.
- source_word: וְהוּא עוֹדֶנּוּ נַעַר
  choice: habang bata pa siya
  rationale: Ang נַעַר ay maaaring tumukoy sa isang batang lalaki o kabataan; pinananatili ng 'bata pa' ang lawak nito at ang diin ng עוֹדֶנּוּ na 'pa'.
- source_word: הֵחֵל לִדְרֹשׁ
  choice: nagsimula siyang hanapin
  rationale: Sa kaugnayan sa Diyos, ang דרשׁ ay nagpapahiwatig ng taimtim at debosyonal na paghahanap, hindi lamang pagtatanong.
- source_word: לֵאלֹהֵי דָּוִיד אָבִיו
  choice: ang Diyos ni David na kanyang ninuno
  rationale: Sa modernong Tagalog, nililinaw ng 'ninuno' ang dinastikong kahulugan ng אָבִיו at iniiwasan ang maling pagkaunawang si David ang tuwirang ama ni Josias; itinatala sa talababa ang literal na 'ama'.
- source_word: הֵחֵל לְטַהֵר
  choice: sinimulan niyang linisin
  rationale: Saklaw ng 'linisin' ang pag-aalis ng mga bagay na pandungis sa relihiyon at malinaw ito sa karaniwang mambabasa.
- source_word: מִן הַבָּמוֹת
  choice: mula sa matataas na lugar ng pagsamba
  rationale: Nililinaw nito na ang בָּמוֹת ay mga pook-sambahan, hindi lamang matataas na lokasyon.
- source_word: וְהָאֲשֵׁרִים
  choice: mga sagisag ni Ashera
  rationale: Hindi labis na tinutukoy ang pisikal na anyo ng terminong maaaring tumukoy sa mga poste, puno, o iba pang kultikong sagisag na kaugnay ni Ashera.
- source_word: וְהַפְּסִלִים
  choice: mga inukit na imahen
  rationale: Tiyak nitong ipinahahayag na ang mga imahen ay ginawa sa pamamagitan ng pag-ukit.
- source_word: וְהַמַּסֵּכוֹת
  choice: mga imaheng hinulma mula sa metal
  rationale: Ipinapahayag nito sa malinaw na modernong Tagalog ang mga imaheng ginawa sa paghuhulma ng tunaw na metal.
theological_decisions:
- issue: Dinastikong gamit ng אָבִיו sa pariralang 'David na kanyang ama'
  choice: Gamitin ang 'ninuno' sa pangunahing teksto at banggitin ang literal na 'ama' sa talababa
  alternative: Panatilihin ang 'ama' sa pangunahing teksto
  rationale: Tunay na tumutukoy ang Hebreo kay David bilang 'ama' ayon sa karaniwang wikang dinastiko, ngunit sa modernong Tagalog ay madaling mapagkamalan itong tuwirang pagiging magulang. Pinananatili ng talababa ang anyo at teolohikal na ugnayang Davidiko ng orihinal.
- issue: Eksaktong anyo ng אֲשֵׁרִים
  choice: Gamitin ang malawak na 'mga sagisag ni Ashera'
  alternative: mga poste ni Ashera
  rationale: Hindi tiyak sa salita lamang kung mga posteng kahoy, puno, o ibang kultikong sagisag ang tinutukoy; kaya hindi dapat tahimik na paliitin ang kahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na natural, marangal, at madaling maunawaan. Ginamit ang 'imahen' sa halip na makalumang 'larawang inanyuan'; nilinaw ang mga terminong kultiko nang hindi inaalis ang tunay na kalabuan ng Hebreo.
