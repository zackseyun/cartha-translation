base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/015.yaml
  text: Then Hilkiah answered and said to Shaphan the scribe[a], “I have found the Book of the Law in the house of Yahweh.” And Hilkiah gave the book to Shaphan.
translation:
  language: tl
  text: Sumagot si Hilkias at sinabi niya kay Safan, ang eskriba, “Natagpuan ko ang Aklat ng Kautusan[a] sa bahay ni Yahweh.” At ibinigay ni Hilkias ang aklat kay Safan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Balumbon ng Kautusan.” Ang Hebreong sefer ay maaaring tumukoy sa aklat, kasulatan, dokumento, o balumbon.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: Sumagot ... at sinabi
  rationale: Pinananatili nito ang dalawang pandiwang Hebreo at ang karaniwang pormula ng pagsasalaysay, kahit walang tahasang tanong na nauna.
- source_word: הַסּוֹפֵר
  choice: tagapagsulat
  rationale: Maaaring tumukoy ang סֹפֵר sa isang eskriba o opisyal na kalihim. Ang “tagapagsulat” ay malinaw sa modernong Filipino at hindi labis na nililimitahan ang tungkulin.
- source_word: סֵפֶר הַתּוֹרָה
  choice: Aklat ng Kautusan
  rationale: Ang סֵפֶר ay maaaring aklat, kasulatan, o balumbon, samantalang ang תּוֹרָה rito ay tumutukoy sa tipanang kautusan. Ang parirala ay likas at pamilyar sa Filipino habang pinananatili ang alternatibong anyo sa talababa.
- source_word: מָצָאתִי
  choice: Natagpuan ko
  rationale: Ipinahahayag ng Hebreong perfect ang natapos na pagkakatuklas na mahalaga sa kasalukuyang pahayag; natural itong naihahatid ng “Natagpuan ko.”
- source_word: בְּבֵית יְהוָה
  choice: sa bahay ni Yahweh
  rationale: Pinananatili ang literal na idyomang “bahay,” na sa konteksto ay tumutukoy sa templo, at isinasalin ang banal na pangalan bilang Yahweh.
- source_word: וַיִּתֵּן ... אֶל שָׁפָן
  choice: ibinigay ... kay Safan
  rationale: Tuwirang katumbas ito ng karaniwang pandiwang נָתַן at natural sa salaysay na Filipino.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Tahasang ginagamit sa tekstong Hebreo ang Tetragrammaton. Ang “Yahweh” ay nagpapanatili sa personal na pangalang tipan nang hindi gumagamit ng pamalit na titulo.
- issue: Kahulugan ng תּוֹרָה sa pariralang סֵפֶר הַתּוֹרָה
  choice: Kautusan
  alternative: tagubilin; aral
  rationale: Bagaman malawak ang saklaw ng תּוֹרָה, ang konteksto ng natagpuang tipanang kasulatan ay angkop sa “Kautusan.” Hindi tinutukoy ng salin kung anong eksaktong lawak ng korpus ang aklat.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “tagapagsulat” sa halip na mas teknikal o hiram na “eskriba,” at pinanatili ang “bahay ni Yahweh” upang maingatan ang larawan ng Hebreo, bagaman templo ang tinutukoy sa konteksto.
