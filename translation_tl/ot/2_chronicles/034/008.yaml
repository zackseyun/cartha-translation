base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/008.yaml
  text: In the eighteenth year of his reign[a], when he had cleansed the land and the house, he sent Shaphan son of Azaliah, Maaseiah the governor of the city, and Joah son of Joahaz, the recorder[b], to repair the house of Yahweh his God.
translation:
  language: tl
  text: Noong ikalabingwalong taon ng kanyang paghahari, matapos niyang linisin ang lupain at ang bahay[a], isinugo niya sina Shafan na anak ni Azalia, Maaseias na pinuno ng lungsod, at Joah na anak ni Joahaz, na tagapagtala, upang kumpunihin[b] ang bahay ni Yahweh na kanyang Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang lupain at ang templo”; sa Hebreo, literal na “ang lupain at ang bahay.”
    reason: lexical_alternative
  - marker: b
    text: O “palakasin” o “isaayos”; sa kontekstong ito, tumutukoy ito sa pagkukumpuni o pagpapanumbalik ng templo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִשְׁנַת שְׁמוֹנֶה עֶשְׂרֵה לְמָלְכוֹ
  choice: Nang ikalabingwalong taon ng kanyang paghahari
  rationale: Natural na pormula sa Filipino para sa pagtatakda ng taon ng paghahari; ang pang-ugnay na וּ ay naipapahiwatig ng pagpapatuloy ng salaysay.
- source_word: לְטַהֵר
  choice: matapos niyang linisin
  rationale: Sa daloy ng salaysay, tumutukoy ito sa kalagayang natapos na ang paglilinis bago isinugo ang mga opisyal, sa halip na gawing layunin ng pagsusugo ang paglilinis.
- source_word: הָאָרֶץ וְהַבָּיִת
  choice: ang lupain at ang bahay
  rationale: Pinananatili ang literal na ugnayan ng dalawang pagbanggit sa 'bahay'; nililinaw ng kasunod na 'bahay ni Yahweh' na templo ang tinutukoy.
- source_word: שַׂר הָעִיר
  choice: pinuno ng lungsod
  rationale: Ipinahahayag ang tungkuling pansibiko ng שַׂר nang hindi ipinipilit ang isang mas tiyak na modernong titulong pampamahalaan.
- source_word: הַמַּזְכִּיר
  choice: tagapagtala
  rationale: Tumutukoy sa opisyal ng hari na may pananagutan sa mga tala o ulat; malinaw at likas ito sa modernong Filipino.
- source_word: לְחַזֵּק
  choice: kumpunihin
  rationale: Bagaman pangunahing nangangahulugang 'palakasin,' sa konteksto ng isang gusali ay tumutukoy ito sa pagkukumpuni o pagpapanumbalik.
- source_word: בֵּית יְהוָה אֱלֹהָיו
  choice: ang bahay ni Yahweh na kanyang Diyos
  rationale: Pinananatili ang larawan ng 'bahay' at ang personal na kaugnayang ipinahahayag ng 'kanyang Diyos.'
theological_decisions:
- issue: Paglalarawan sa pangalang banal na יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Tuwirang ginagamit sa Hebreo ang Tetragrammaton; pinananatili ng 'Yahweh' ang natatanging pangalang tipan sa halip na palitan ito ng titulo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “bahay” upang mapanatili ang pag-uulit sa Hebreo, habang ipinaliliwanag sa talababa na templo ang tinutukoy. Ang mga pangalang pantangi ay isinalin sa payak na transliterasyong malapit sa Hebreo.
