  text: הִנְ/נִ֨י אֹֽסִפְ/ךָ֜ אֶל אֲבֹתֶ֗י/ךָ וְ/נֶאֱסַפְתָּ֣ אֶל קִבְרֹתֶי/ךָ֮ בְּ/שָׁלוֹם֒ וְ/לֹא תִרְאֶ֣ינָה עֵינֶ֔י/ךָ בְּ/כֹל֙ הָֽ/רָעָ֔ה אֲשֶׁ֨ר אֲנִ֥י מֵבִ֛יא עַל הַ/מָּק֥וֹם הַ/זֶּ֖ה וְ/עַל יֹשְׁבָ֑י/ו וַ/יָּשִׁ֥יבוּ אֶת הַ/מֶּ֖לֶךְ דָּבָֽר־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/028.yaml
  text: Behold[a], I am about to gather you to your fathers, and you will be gathered to your graves in peace[c][b], and your eyes will not see all the disaster that I am bringing on this place and on its inhabitants.’ And they brought back word to the king.
translation:
  language: tl
  text: “Narito, titipunin kita sa iyong mga ninuno[a], at ihihimlay ka sa mga libingan mo[c] nang payapa[b]. Hindi makikita ng iyong mga mata ang lahat ng kapahamakang ipapasapit ko sa lugar na ito at sa mga naninirahan dito.” At ipinaabot nila sa hari ang mensahe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “mga ama,” isang karaniwang pananalita para sa mga ninuno, lalo na sa konteksto ng kamatayan.
    reason: lexical_alternative
  - marker: b
    text: Ang “nang payapa” ay malamang na nangangahulugang hindi na masasaksihan ni Josias ang darating na kapahamakan, gaya ng ipinapaliwanag ng kasunod na sugnay. Hindi nito kailangang ipahiwatig na hindi marahas ang mismong paraan ng kanyang pagkamatay.
    reason: cross_reference
  - marker: c
    text: Maaaring isalin na “sa iyong libingan.” Maramihan ang anyo sa Hebreo at maaaring tumukoy sa mga libingan ng kanyang angkan.
    reason: textual_form
lexical_decisions:
- source_word: הִנְנִי
  choice: Narito
  rationale: Pinananatili ang pormal na panandang nagbibigay-diin sa kasunod na pahayag ng Diyos nang hindi nagiging di-likas sa marangal na Tagalog.
- source_word: אֹסִפְךָ אֶל אֲבֹתֶיךָ
  choice: titipunin kita sa iyong mga ninuno
  rationale: Pinananatili ang talinghaga ng pagtitipon sa kamatayan; mas natural at mas malinaw sa makabagong Tagalog ang “mga ninuno” kaysa literal na “mga ama.”
- source_word: וְנֶאֱסַפְתָּ אֶל קִבְרֹתֶיךָ
  choice: ihihimlay ka sa mga libingan mo
  rationale: Ipinahahayag ang pasibong pagdadala sa libingan at pinananatili ang maramihang anyo ng קִבְרֹתֶיךָ, bagaman maaaring tumukoy ito sa libingan ng angkan.
- source_word: בְּשָׁלוֹם
  choice: nang payapa
  rationale: Sapat na malawak upang ipahiwatig ang kapayapaang kaugnay ng hindi niya pagkakita sa darating na kapahamakan, nang hindi iginigiit na hindi marahas ang paraan ng kanyang pagkamatay.
- source_word: וְלֹא תִרְאֶינָה עֵינֶיךָ
  choice: Hindi makikita ng iyong mga mata
  rationale: Pinananatili ang tahasang pagbanggit ng Hebreo sa mga mata bilang simuno at ang masidhing larawang dulot nito.
- source_word: בְּכֹל הָרָעָה
  choice: ang lahat ng kapahamakan
  rationale: Sa konteksto ng hatol, ang רָעָה ay tumutukoy sa sakuna o kapahamakan, hindi pangunahing sa kasamaan sa moral na diwa.
- source_word: אֲנִי מֵבִיא עַל
  choice: ipapasapit ko sa
  rationale: Natural na Tagalog para sa nalalapit at tiyak nang kapahamakang dinadala laban sa isang lugar.
- source_word: וְעַל יֹשְׁבָיו
  choice: at sa mga naninirahan dito
  rationale: Malinaw at likas na salin ng participial noun na may hulaping panghalip.
- source_word: וַיָּשִׁיבוּ אֶת הַמֶּלֶךְ דָּבָר
  choice: At iniulat nila sa hari ang sagot
  rationale: Ipinahahayag ang idyomatikong kahulugan na bumalik sila na may dalang mensahe o tugon para sa hari.
theological_decisions:
- issue: Kahulugan ng pangakong “nang payapa” sa kabila ng pagkamatay ni Josias sa labanan
  choice: Iniwan ang “nang payapa” na may malawak na kahulugan at ipinaliwanag na maaaring tumukoy ito sa pagkamatay niya bago sumapit ang ipinahayag na kapahamakan.
  alternative: Unawain ito bilang tiyak na pangakong hindi magiging marahas ang kanyang kamatayan, o bilang pagtukoy lamang sa mapayapang paglilibing.
  rationale: Ang kasunod na sugnay—hindi makikita ng kanyang mga mata ang kapahamakan—ang agarang paliwanag ng pangako. Pinananatili nito ang tensiyon sa teksto sa halip na sapilitang lutasin iyon.
translation_notes:
  register: Makabago ngunit marangal na Filipino; pinanatili ang Hebreong talinghaga ng pagtitipon sa mga ninuno at ang tahasang “mga mata,” habang ginawang natural ang ulat sa huling pangungusap.
