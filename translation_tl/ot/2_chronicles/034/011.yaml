  text: וַֽ/יִּתְּנ֗וּ לֶ/חָֽרָשִׁים֙ וְ/לַ/בֹּנִ֔ים לִ/קְנוֹת֙ אַבְנֵ֣י מַחְצֵ֔ב וְ/עֵצִ֖ים לַֽ/מְחַבְּר֑וֹת וּ/לְ/קָרוֹת֙ אֶת הַ/בָּ֣תִּ֔ים אֲשֶׁ֥ר הִשְׁחִ֖יתוּ מַלְכֵ֥י יְהוּדָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/011.yaml
  text: And they gave it to the craftsmen and to the builders to buy quarried stone and timber for the supports and for roofing the buildings that the kings of Judah had ruined[a][b][c].
translation:
  language: tl
  text: Ibinigay nila ang salapi sa mga bihasang manggagawa at sa mga tagapagtayo upang bumili ng mga batong mula sa tibagan[a] at kahoy para sa pagkakabit[b] at sa paglalagay ng bubong[c] sa mga gusaling sinira ng mga hari ng Juda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga tinibag na bato.” Tumutukoy ang pariralang Hebreo sa batong kinuha o tinabas mula sa tibagan para sa pagtatayo.
    reason: lexical_alternative
  - marker: b
    text: Hindi tiyak ang salitang Hebreo. Maaaring tumukoy ito sa pagkakabit, mga pangkabit, o mga bahagi ng balangkas ng gusali.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring isalin na “para sa mga biga” o “para sa pagtatakip.” Maaaring tumukoy ang pandiwang Hebreo sa pagbububong o pagtatakip sa isang gusali sa pamamagitan ng mga biga.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ
  choice: Ibinigay nila ang salapi
  rationale: Ang pandiwang נתן ay nangangahulugang “magbigay.” Walang hayag na layon sa talata, kaya idinagdag ang “ang salapi” mula sa naunang konteksto upang maging malinaw at natural sa Tagalog.
- source_word: חָרָשִׁים
  choice: mga bihasang manggagawa
  rationale: Tumutukoy ito sa mga manggagawang may kasanayan sa iba’t ibang uri ng gawa, kaya hindi ito nilimitahan sa mga karpintero.
- source_word: בֹּנִים
  choice: mga tagapagtayo
  rationale: Tuwirang tumutukoy sa mga taong gumagawa ng pagtatayo; malinaw itong naiiba sa mas malawak na pangkat ng mga bihasang manggagawa.
- source_word: לִקְנוֹת
  choice: upang bumili
  rationale: Natural na salin ng infinitibong קנה at malinaw na ipinapahayag ang layunin ng pagbibigay ng salapi.
- source_word: אַבְנֵי מַחְצֵב
  choice: mga batong mula sa tibagan
  rationale: Ipinahihiwatig ng parirala ang batong kinuha sa tibagan para sa pagtatayo, nang hindi ipinapalagay kung gaano na ito kahubog o kapulido.
- source_word: עֵצִים
  choice: kahoy
  rationale: Sa konteksto ng konstruksiyon, ang “kahoy” ay natural at sapat na tumutukoy sa materyales na gagamitin sa gusali.
- source_word: לַמְחַבְּרוֹת
  choice: para sa mga dugtungan
  rationale: Hindi tiyak ang teknikal na kahulugan ng salita, ngunit kaugnay ito ng pagdurugtong o pagkakabit ng mga bahagi ng estruktura. Pinananatili ng salin ang pangkalahatang diwa nang hindi tumutukoy sa isang tiyak na elementong arkitektural.
- source_word: וּלְקָרוֹת
  choice: at sa paglalagay ng bubong
  rationale: Sa konteksto ng pagtatayo, ang קרה ay maaaring mangahulugang bubungan o takpan ang isang estruktura, karaniwan sa pamamagitan ng mga biga. Natural sa Tagalog ang “paglalagay ng bubong” habang pinananatili sa talababa ang ibang posibilidad.
- source_word: הַבָּתִּים
  choice: mga gusali
  rationale: Bagaman karaniwang nangangahulugang “mga bahay,” sa konteksto ng pagkukumpuni ng templo ay tumutukoy ito sa mga gusali o estruktura, hindi sa mga karaniwang tirahan.
- source_word: הִשְׁחִיתוּ
  choice: sinira
  rationale: Maaaring mangahulugan ang hiphil ng שחת na sirain, wasakin, o ipahamak. Ang “sinira” ay angkop sa pagkukumpuni at hindi kinakailangang magpahiwatig ng lubos na pagkawasak.
- source_word: מַלְכֵי יְהוּדָה
  choice: mga hari ng Juda
  rationale: Tuwirang salin ng pariralang Hebreo.
