  source_fidelity: 'Tumpak ang pangkalahatang diwa: ang utos ay sumangguni kay Yahweh para sa hari at sa nalabi sa Israel at Juda, kaugnay ng natagpuang aklat, dahil sa matinding poot na ibinuhos dahil sa pagkabigong sundin ang salita ni Yahweh. Gayunman, ang אֲבוֹתֵינוּ ay tahasang “ating mga ama” (mga ninuno/forefathers), hindi ang neutral na “mga ninuno”; at ang כְּכָל ay mas mabuting maipakita sa “ayon sa lahat ng nakasulat.”'
  naturalness: Malinaw at marangal ang Tagalog. Ang “sumangguni kay Yahweh,” “mga nalabi,” at “matindi ang poot” ay angkop sa makabagong Filipino Tagalog na may biblikal na rehistro. Ang inayos na hulíng sugnay ay mas natural habang mas malapit sa saklaw ng Hebreo.
  terminology: Tamang pinanatili ang “Yahweh.” Ginamit ang “mga ama” para sa panlalaking anyo ng אֲבוֹתֵינוּ, na may talababa para sa natural na alternatibong “mga ninuno.” Nananatili ang “aklat,” na may wastong alternatibong “balumbon.”
