base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/021.yaml
  text: Go[a], inquire of Yahweh for me and for the remnant in Israel and in Judah concerning the words of the book that has been found, for great is the wrath of Yahweh that has been poured out on us, because our fathers have not kept the word of Yahweh[c][b], to do according to all that is written in this book.
translation:
  language: tl
  text: “Humayo kayo at sumangguni kay Yahweh para sa akin at para sa mga nalabi sa Israel at Juda tungkol sa mga salita ng aklat[a] na natagpuan. Sapagkat matindi ang poot ni Yahweh na ibinuhos sa atin, dahil hindi sinunod ng ating mga ama[b] ang salita ni Yahweh sa paggawa ayon sa lahat ng nakasulat sa aklat na ito.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “balumbon.” Maaaring tumukoy ang salitang Hebreo sa isang aklat o balumbon.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “ating mga ninuno.” Sa literal, “ating mga ama.”
    reason: lexical_alternative
lexical_decisions:
- source_word: דִרְשׁוּ אֶת־יְהוָה
  choice: sumangguni kay Yahweh
  rationale: Sa konteksto ng utos ng hari, tumutukoy ang pandiwa sa paghingi ng patnubay o pahayag mula sa Diyos, hindi lamang sa pangkalahatang paghahanap sa kanya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ang banal na pangalang YHWH sa halip na palitan ito ng isang titulo.
- source_word: הַנִּשְׁאָר
  choice: mga nalabi
  rationale: Ipinahihiwatig nito ang mga nanatili o natira at pinananatili ang makasaysayan at tipanang himig ng Hebreong salita.
- source_word: הַסֵּפֶר אֲשֶׁר נִמְצָא
  choice: aklat na natagpuan
  rationale: Maaaring mangahulugan ang סֵפֶר ng aklat o balumbon; natural sa makabagong Tagalog ang ‘aklat,’ samantalang inilalagay sa talababa ang materyal na alternatibo.
- source_word: גְדוֹלָה חֲמַת יְהוָה
  choice: matindi ang poot ni Yahweh
  rationale: Natural na ipinahahayag ng ‘matindi’ ang lakas ng poot na binibigyang-diin ng nauunang panaguri sa Hebreo.
- source_word: נִתְּכָה בָנוּ
  choice: ibinuhos sa atin
  rationale: Pinananatili nito ang metapora ng poot na ibinubuhos at ang ganap na aspekto ng pandiwang Hebreo.
- source_word: שָׁמְרוּ אֶת־דְּבַר יְהוָה
  choice: sinunod ang salita ni Yahweh
  rationale: Sa pariralang ito, ang ‘pag-iingat’ sa salita ay praktikal na pagsunod dito; mas malinaw at natural sa karaniwang mambabasang Tagalog ang ‘sinunod.’
- source_word: לַעֲשׂוֹת כְּכָל הַכָּתוּב
  choice: upang gawin ang lahat ng nakasulat
  rationale: Pinananatili ang ugnayan ng pagsunod sa salita at ng aktuwal na paggawa sa buong nakasulat na tagubilin.
theological_decisions:
- issue: Paglalapat sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Pangalan mismo ang nasa tekstong Hebreo, kaya pinananatili ito sa salin sa halip na gawing titulo.
- issue: Paglalarawan sa הַנִּשְׁאָר
  choice: mga nalabi
  alternative: mga natira
  rationale: Pinananatili ng ‘mga nalabi’ ang posibleng tipanan at makasaysayang diwa nang hindi dinaragdagan ang kahulugan ng teksto.
- issue: Paglalarawan sa אֲבוֹתֵינוּ
  choice: ating mga ninuno
  alternative: ating mga ama
  rationale: Sa konteksto, tumutukoy ang pananalita sa mga naunang salinlahi. Ang literal na anyong ‘mga ama’ ay inilalahad sa talababa upang hindi maitago ang anyong panlalaki ng Hebreo.
translation_notes:
  register: Makabago at malinaw na Tagalog na may marangal na himig. Ginamit ang ‘sumangguni’ para sa opisyal na paghingi ng patnubay mula kay Yahweh, at pinanatili ang ‘mga nalabi’ dahil mahalaga ang makasaysayan at tipanang pahiwatig nito.
