base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/012.yaml
  text: And the men were working faithfully in the work[a], and over them were appointed Jahath and Obadiah the Levites, from the sons of Merari, and Zechariah and Meshullam, from the sons of the Kohathites, to oversee; and the Levites[b], all who were skilled with musical instruments.
translation:
  language: tl
  text: Ang mga manggagawa ay tapat na gumagawa sa gawain. Itinalagang mamahala sa kanila sina Jahat at Obadias, na mga Levita mula sa mga anak ni Merari, at sina Zacarias at Mesulam, mula sa mga anak ng mga Kohatita, upang mangasiwa[a]; at ang mga Levita, na pawang bihasa sa mga instrumentong pang-awit[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mamuno” o “mangasiwa.” Ang pandiwang Hebreo ay maaaring tumukoy sa pangangasiwa o paggabay sa gawain.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “at ang mga Levita, bawat isang nakauunawa sa mga instrumento ng awit.” Walang tahasang pandiwa ang pariralang ito sa Hebreo; kaya hindi ganap na tiyak ang sintaktikong ugnayan nito sa naunang sugnay.
    reason: textual_or_syntactic_ambiguity
lexical_decisions:
- source_word: בֶּאֱמוּנָה
  choice: nang tapat
  rationale: Ginagamit ang pangngalan bilang pang-abay upang ilarawan ang mapagkakatiwalaan at matapat na paraan ng paggawa, hindi ang pansariling paniniwala.
- source_word: בַּמְּלָאכָה
  choice: ang kanilang gawain
  rationale: Tumutukoy ito sa gawaing isinasagawa, sa konteksto ay ang pagkukumpuni ng templo; natural sa Filipino ang paglalagay ng angkop na panghalip.
- source_word: מֻפְקָדִים
  choice: mga itinalagang mamahala
  rationale: Pinananatili ang pasibong diwa ng Hophal at nililinaw ang pananagutang iniatang sa mga pinangalanan.
- source_word: יַחַת
  choice: Jahat
  rationale: Transliterasyon ng pangalang pantangi ayon sa karaniwang anyong Filipino.
- source_word: עֹבַדְיָהוּ
  choice: Obadias
  rationale: Ginamit ang kinikilalang anyong Filipino ng pangalang biblikal.
- source_word: מִן בְּנֵי מְרָרִי
  choice: mula sa mga anak ni Merari
  rationale: Pinananatili ang lantad na anyong pangangkanan ng Hebreo.
- source_word: זְכַרְיָה
  choice: Zacarias
  rationale: Ginamit ang kinikilalang anyong Filipino ng pangalang biblikal.
- source_word: מְשֻׁלָּם
  choice: Mesulam
  rationale: Transliterasyon ng pangalang pantangi sa paraang madaling basahin sa Filipino.
- source_word: מִן בְּנֵי הַקְּהָתִים
  choice: mula sa mga anak ng mga Kohatita
  rationale: Pinananatili kapwa ang pananalitang pangangkanan at ang katawagan sa angkan na nasa Hebreo.
- source_word: לְנַצֵּחַ
  choice: nangangasiwa
  rationale: Sa konteksto ng pagkukumpuni, ipinahihiwatig ng pandiwa ang pamamahala o superbisyon sa gawain.
- source_word: כָּל מֵבִין
  choice: mga ... bihasa
  rationale: Ipinahahayag nito ang praktikal na pagkaunawa o kasanayan, kaya ang 'bihasa' ay malinaw at natural.
- source_word: בִּכְלֵי שִׁיר
  choice: sa pagtugtog ng mga instrumentong pangmusika
  rationale: Natural na katumbas ito ng mga instrumentong ginagamit sa awit o musika; inilantad ang pagtugtog na ipinahihiwatig ng kasanayan sa mga instrumento.
theological_decisions:
- issue: Ugnayan ng huling parirala sa mga tagapangasiwa
  choice: Iniugnay ang mga Levitang bihasa sa musika sa gawaing pangangasiwa sa pamamagitan ng 'kasama.'
  alternative: 'Iwan bilang hiwalay at bitin na parirala: ''At ang mga Levita, lahat ng bihasa sa mga instrumentong pangmusika.'''
  rationale: Walang tahasang pandiwa ang huling parirala sa Hebreo, ngunit ang pang-ugnay at daloy ng pangungusap ay nagpapahintulot na ituring silang karagdagang mga tagapangasiwa. Minarkahan sa talababa ang literal na anyo upang hindi maitago ang sintaktikong kalabuan.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Hinati sa mas maiikling pangungusap para sa malinaw na daloy, habang pinanatili ang mga pangkat ng angkan at ang sintaktikong kalabuan ng huling parirala sa pamamagitan ng talababa.
