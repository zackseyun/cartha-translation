base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/017.yaml
  text: They have poured out the silver that was found in the house of Yahweh and have put it into the hands of the overseers and into the hands of those doing the work[a][b].
translation:
  language: tl
  text: Inilabas nila ang pilak na natagpuan sa bahay ni Yahweh at ipinagkatiwala ito sa mga tagapangasiwa at sa mga manggagawa.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ibinuhos” o “inilabas mula sa sisidlan.” Sa kontekstong ito, ang pandiwang Hebreo ay maaaring tumukoy sa paglalabas o pamamahagi ng pilak, hindi sa literal na pagtunaw nito.
    reason: lexical_alternative
  - marker: b
    text: Ang “bahay ni Yahweh” ay tumutukoy sa templo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּתִּיכוּ
  choice: Inilabas nila
  rationale: Sa konteksto, tumutukoy ang pandiwa sa paglalabas o pagbubuhos ng nakalap na pilak upang ipamahagi, hindi sa pagtunaw nito. Natural sa Tagalog ang “inilabas” at hindi nito ipinapalagay na literal na ibinuhos ang salapi.
- source_word: הַכֶּסֶף
  choice: ang pilak
  rationale: Ang כֶּסֶף ay literal na “pilak” at maaari ring mangahulugang salapi. Pinananatili ng “pilak” ang kongkretong salita ng Hebreo sa konteksto ng pondong pangtemplo.
- source_word: הַנִּמְצָא
  choice: na natagpuan
  rationale: Tuwirang ipinapahayag ng parirala ang pilak na natagpuan o nakolekta sa bahay ni Yahweh.
- source_word: בְּבֵית יְהוָה
  choice: sa bahay ni Yahweh
  rationale: Pinananatili nito ang pormal na larawan ng Hebreong “bahay ni Yahweh,” na tumutukoy sa templo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang transliterasyon ng personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
- source_word: וַיִּתְּנֻהוּ עַל־יַד
  choice: ipinagkatiwala iyon sa
  rationale: Ang literal na idyomang “ibinigay sa kamay ng” ay nagpapahiwatig ng paglalagay sa pangangalaga o pananagutan ng isang tao. Likas at malinaw sa Tagalog ang “ipinagkatiwala ... sa.”
- source_word: הַמֻּפְקָדִים
  choice: mga tagapangasiwa
  rationale: Tumutukoy ang participle sa mga taong itinalaga upang mamahala o mangasiwa.
- source_word: עוֹשֵׂי הַמְּלָאכָה
  choice: mga gumagawa ng gawain
  rationale: Malawak ang parirala at hindi lamang tumutukoy sa isang tiyak na uri ng manggagawa; pinananatili ng salin ang lawak nito.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo; pinananatili ng “Yahweh” ang pangalang iyon nang hindi ito pinapalitan ng titulo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “ipinagkatiwala” upang natural na maipahayag ang Hebreong idyomang administratibo, habang ang mga talababa ay nagpapanatili sa leksikal na posibilidad ng “pagbubuhos/paglalabas.”
