  rationale: Karaniwang ayos ng bilang sa kasalukuyang Tagalog para sa tagal ng paghahari.
- source_word: מָלַךְ
  choice: naghari
  rationale: Tuwirang ipinapahayag ang pamamahala bilang hari at natural sa salaysay.
- source_word: בִּירוּשָׁלִָם
  choice: sa Jerusalem
  rationale: Tuwirang lokatibong salin ng pangalan ng lugar.
