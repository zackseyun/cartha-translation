  rationale: Ginamit ang tradisyonal at madaling makilalang anyo ng pangalan sa Tagalog na Bibliya.
- source_word: בְמָלְכוֹ
  choice: nang maging hari siya
  rationale: Ipinahahayag ng konstruksiyon ang panahon ng pagluklok niya; malinaw at natural ito sa modernong Tagalog.
- source_word: וּשְׁלֹשִׁים וְאַחַת שָׁנָה
