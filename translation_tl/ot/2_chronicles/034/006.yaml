  yaml_path: translation/ot/2_chronicles/034/006.yaml
  text: and in the cities of Manasseh and Ephraim and Simeon[a], even as far as Naphtali[b], in their surrounding ruins.
translation:
  language: tl
  text: at sa mga lunsod ng Manases, Efraim, at Simeon, maging hanggang sa Neftali, sa kanilang mga guho sa buong paligid.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mahirap unawain ang pangwakas na parirala sa tekstong Hebreo; sa mas literal na anyo, maaaring wari itong “sa/kasama ng kanilang … sa palibot.”
    reason: textual_variant
  - marker: b
    text: Maaari ring “sa kanilang mga tiwangwang na lugar sa palibot.” Ang tekstong puro katinig ay maaaring basahin nang mas literal bilang “kanilang mga bahay,” ngunit higit na umaangkop sa konteksto ang pagtukoy sa mga guho o wasak na lugar.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְ/עָרֵי
  choice: at sa mga lunsod ng
  rationale: Ipinakikita ang pang-ugnay at pang-ukol; ang “mga lunsod” ay likas at karaniwang salin ng עָרִים sa salaysay na pangkasaysayan.
- source_word: מְנַשֶּׁה וְ/אֶפְרַיִם וְ/שִׁמְעוֹן
  choice: Manases, Efraim, at Simeon
  rationale: Ginamit ang kinagawiang makabagong baybay-Filipino ng mga pangalang pantribo at panlugar, habang malinaw na pinananatili ang talaan.
- source_word: וְ/עַד נַפְתָּלִי
  choice: hanggang sa Neftali
  rationale: Ang עַד ay nagsasaad ng hangganan o lawak; natural na ipinahahayag ito ng “hanggang sa.”
- source_word: ב/הר בתי/הם סָבִיב
  choice: sa mga guho sa palibot nila
  rationale: Napakahirap ng anyong Hebreo sa pangwakas na parirala. Batay sa konteksto ng pagwasak sa mga sambahan, ipinahahayag ng pangunahing teksto ang malamang na lokatibong diwa at ang ideya ng mga wasak o tiwangwang na lugar, habang inilalahad sa mga talababa ang kawalang-katiyakan.
theological_decisions:
- issue: Kung ang pangwakas na parirala ay tumutukoy sa mga bahay o sa mga guho/tiwangwang na lugar
  choice: mga guho sa palibot nila
  alternative: kanilang mga bahay; kanilang mga tiwangwang na lugar sa palibot
  rationale: Hindi ito nilutas bilang usaping doktrinal. Pinili ang kahulugang pinakamalinaw sa konteksto, ngunit tahasang pinanatili sa mga talababa ang posibilidad na mas literal na basahin ang katinigang teksto bilang “kanilang mga bahay.”
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang anyong parirala ng talata at iniwasang pakinisin nang labis ang tunay na kahirapan ng tekstong Hebreo.
