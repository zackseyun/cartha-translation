base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/016.yaml
  text: Then Shaphan brought the book to the king and also brought back word to the king[a], saying, “All that was committed into the hand of your servants, they are doing.”
translation:
  language: tl
  text: Pagkatapos, dinala ni Safan ang aklat sa hari at iniulat din niya sa hari[a], “Ginagawa ng iyong mga lingkod ang lahat ng ipinagkatiwala sa kanila.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “at nagbalik din siya ng ulat sa hari.” Sa Hebreo, ang parirala para sa ipinagkatiwala ay literal na “inilagay sa kamay ng iyong mga lingkod.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֵא
  choice: dinala
  rationale: Ang Hiphil ng בוא ay nagsasaad na si Safan ang nagdala ng aklat sa hari, hindi lamang na pumunta siya roon.
- source_word: הַסֵּפֶר
  choice: ang aklat
  rationale: Maaaring tumukoy ang סֵפֶר sa isang balumbon o kasulatan, ngunit natural ang “aklat” sa Filipino at hindi nito labis na tinutukoy ang materyal na anyo nito.
- source_word: וַיָּשֶׁב עוֹד אֶת־הַמֶּלֶךְ דָּבָר
  choice: iniulat din niya sa hari
  rationale: Ang idyoma ay tumutukoy sa muling pagdadala o pag-uulat ng balita, at ipinahihiwatig ng עוֹד ang “din” o karagdagang ulat.
- source_word: לֵאמֹר
  choice: '[ipinakilala sa tuwirang sipi]'
  rationale: Sa natural na Filipino, sapat nang ipakilala ng pandiwang “iniulat” ang kasunod na tuwirang pananalita; hindi kailangang idagdag ang mabigat na “na sinasabi.”
- source_word: כֹּל אֲשֶׁר נִתַּן בְּיַד עֲבָדֶיךָ
  choice: ang lahat ng ipinagkatiwala sa kanila
  rationale: Ang נִתַּן בְּיַד ay idyomang nangangahulugang inilagay sa pananagutan o ipinagkatiwala. Isinasalin ang kahulugan sa natural na Filipino, samantalang inilalahad sa talababa ang literal na larawan ng kamay.
- source_word: עֲבָדֶיךָ
  choice: iyong mga lingkod
  rationale: Sa konteksto ng korte ng hari, tumutukoy ito sa mga naglilingkod sa hari; pinananatili ng “mga lingkod” ang malawak na kahulugan nang hindi ipinapalagay na mga alipin sila o pawang mga opisyal.
- source_word: הֵם עֹשִׂים
  choice: ginagawa
  rationale: Ipinahihiwatig ng participle ang nagpapatuloy na gawain. Natural itong maipahayag sa Filipino sa “ginagawa,” at malinaw ang layon mula sa naunang “lahat.”
