translation_notes:
  register: Gumamit ng makabago ngunit marangal at madaling maunawaang Filipino. Pinili ang “Safan” ayon sa karaniwang pag-aangkop sa Filipino, at isinalin nang idyomatiko ang pariralang Hebreo tungkol sa paglalagay sa kamay habang pinanatili sa talababa ang literal na larawan.
