revisions:
- from: “Dahil lumambot ang puso mo[a] at nagpakumbaba ka sa harap ng Diyos nang marinig mo ang kanyang mga salita laban sa lugar na ito at sa mga naninirahan dito; at dahil nagpakumbaba ka sa harap ko, pinunit mo ang iyong mga damit, at umiyak ka sa harap ko, pinakinggan din kita,” sabi ni Yahweh.
  to: “Dahil malambot ang iyong puso[a] at nagpakumbaba ka sa harap ng Diyos nang marinig mo ang kanyang mga salita laban sa lugar na ito at laban sa mga naninirahan dito, at nagpakumbaba ka sa harap ko, pinunit mo ang iyong mga damit, at umiyak ka sa harap ko, narinig din kita,” pahayag ni Yahweh.
  rationale: Inayos ang daloy upang ang lahat ng kasunod na sugnay ay malinaw na nakapailalim sa “Dahil,” gaya ng sanhi na ipinakikilala ng Hebreo. Pinalitan ang pandiwang “lumambot” ng pang-uring “malambot” upang maiwasan ang di-ipinahayag na pagbabagong aspekto. Ginawang “narinig din kita” ang tugon ng Diyos para sa mas malapit na katumbas ng Hebreong pandiwa, at ginamit ang “pahayag ni Yahweh” para sa נְאֻם יְהוָה.
