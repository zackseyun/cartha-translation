  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: יַ֠עַן רַךְ לְבָ֨בְ/ךָ֜ וַ/תִּכָּנַ֣ע מִ/לִּ/פְנֵ֣י אֱלֹהִ֗ים בְּ/שָׁמְעֲ/ךָ֤ אֶת דְּבָרָי/ו֙ עַל הַ/מָּק֤וֹם הַ/זֶּה֙ וְ/עַל יֹ֣שְׁבָ֔י/ו וַ/תִּכָּנַ֣ע לְ/פָנַ֔/י וַ/תִּקְרַ֥ע אֶת בְּגָדֶ֖י/ךָ וַ/תֵּ֣בְךְּ לְ/פָנָ֑/י וְ/גַם אֲנִ֥י שָׁמַ֖עְתִּי נְאֻם יְהוָֽה־׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/027.yaml
  text: Because your heart was tender[a], and you humbled yourself before God when you heard his words against this place and against its inhabitants, and because you humbled yourself before me and tore your clothes and wept before me, I also have heard you, declares Yahweh.
translation:
  language: tl
  text: “Dahil malambot ang iyong puso[a] at nagpakumbaba ka sa harap ng Diyos nang marinig mo ang kanyang mga salita laban sa lugar na ito at laban sa mga naninirahan dito, at nagpakumbaba ka sa harap ko, pinunit mo ang iyong mga damit, at umiyak ka sa harap ko, narinig din kita,” pahayag ni Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “malambot ang puso mo.” Inilalarawan ng idyomang Hebreo ang pusong bukás, tumutugon, at mapagpakumbaba.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעַן
  choice: Dahil
  rationale: Malinaw na ipinakikilala nito ang dahilan ng tugon ng Diyos at natural ito sa makabagong Tagalog.
- source_word: רַךְ לְבָבְךָ
  choice: lumambot ang puso mo
  rationale: Pinananatili ang konkretong idyomang Hebreo tungkol sa pusong naging bukás, madaling tumugon, at mapagpakumbaba, nang hindi ito ginagawang simpleng emosyonalidad.
- source_word: וַתִּכָּנַע
  choice: nagpakumbaba ka
  rationale: Ipinahahayag ng Niphal dito ang kusang pagpapakumbaba ni Josias; ang anyong ito ay natural at angkop sa dalawang paglitaw ng pandiwa.
- source_word: מִלִּפְנֵי אֱלֹהִים / לְפָנַי
  choice: sa harap ng Diyos / sa harap ko
  rationale: Pinananatili ang wika ng pagharap sa presensiya ng Diyos at ang mahalagang pag-uulit sa direktang pananalita.
- source_word: בְּשָׁמְעֲךָ
  choice: nang marinig mo
  rationale: Natural na Tagalog para sa temporal na gamit ng pang-ukol at infinitive construct.
- source_word: דְּבָרָיו
  choice: ang kanyang mga salita
  rationale: Pinananatili ang pangmaramihang ‘mga salita’ at ang reperensiya sa Diyos na hinihingi ng konteksto.
- source_word: עַל הַמָּקוֹם הַזֶּה וְעַל יֹשְׁבָיו
  choice: laban sa lugar na ito at sa mga naninirahan dito
  rationale: Sa konteksto ng hatol, ang עַל ay may diwang salungat o mapanghatol; malinaw itong naihahatid ng ‘laban sa.’
- source_word: וַתִּקְרַע אֶת בְּגָדֶיךָ
  choice: pinunit mo ang iyong mga damit
  rationale: Direkta at madaling maunawaan, habang pinananatili ang panlabas na tanda ng pagdadalamhati at pagsisisi.
- source_word: וַתֵּבְךְּ
  choice: umiyak ka
  rationale: Natural at marangal na paglalarawan ng taimtim na pagdadalamhati.
- source_word: וְגַם אֲנִי שָׁמַעְתִּי
  choice: pinakinggan din kita
  rationale: Ang bagay ng pandiwa ay ipinahihiwatig ng konteksto. Ipinakikita ng ‘pinakinggan’ ang pagtugon ng Diyos nang hindi dinaragdagan ang ipinangakong nilalaman.
- source_word: נְאֻם יְהוָה
  choice: sabi ni Yahweh
  rationale: Natural ngunit may bigat na Tagalog para sa pormulang pangpropeta, habang tahasang pinananatili ang pangalang tipan.
theological_decisions:
- issue: Pagbanggit sa banal na pangalan na יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tahasang ginagamit ng tekstong Hebreo ang Tetragrammaton; pinananatili ng ‘Yahweh’ ang personal na pangalang tipan sa halip na palitan ito ng titulo.
- issue: Kahulugan ng paglalambot ng puso
  choice: Pinanatili bilang idyoma ng pagiging bukás at mapagpakumbabang tumutugon
  alternative: Isalin lamang bilang ‘nagsisi ka’ o ‘naging masunurin ka’
  rationale: Hindi tahasang ginagamit ng Hebreo ang mga terminong ‘pagsisisi’ o ‘pagsunod.’ Iniiwasan ng salin na paliitin ang mas malawak na disposisyong inilalarawan ng idyoma.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang pag-uulit ng ‘nagpakumbaba’ at ‘sa harap’ dahil mahalaga ang mga ito sa retorika ng Hebreo. Ginamit ang ‘mga damit’ sa halip na mas lumang ‘mga kasuotan,’ at ang pangalang ‘Yahweh’ para sa יְהוָה.
