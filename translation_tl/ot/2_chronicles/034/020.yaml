translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kina” upang natural na ipakilala ang pangkat ng mga taong inutusan, at ang tutuldok upang ihudyat ang nilalaman ng utos sa kasunod na talata.
