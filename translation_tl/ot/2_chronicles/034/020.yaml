  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יְצַ֣ו הַ/מֶּ֡לֶךְ אֶת חִלְקִיָּ֡הוּ וְ/אֶת אֲחִיקָ֣ם בֶּן שָׁ֠פָן וְ/אֶת עַבְדּ֨וֹן בֶּן מִיכָ֜ה וְ/אֵ֣ת שָׁפָ֣ן הַ/סּוֹפֵ֗ר וְ/אֵ֛ת עֲשָׂיָ֥ה עֶֽבֶד הַ/מֶּ֖לֶךְ לֵ/אמֹֽר־־־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/020.yaml
  text: Then the king commanded Hilkiah[a], Ahikam son of Shaphan, Abdon son of Micah, Shaphan the scribe, and Asaiah the king’s servant, saying[b],
translation:
  language: tl
  text: 'Pagkatapos, iniutos ng hari kina Hilkias, Ahikam na anak ni Safan, Abdon na anak ni Mica[a], Safan na eskriba, at Asaias na lingkod ng hari[b] ang ganito:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Abdon na anak ni Mica” ang mababasa sa tekstong Masoretiko. Sa katumbas na salaysay sa 2 Hari 22:12, “Akbor na anak ni Micaias” ang mababasa.
    reason: textual_variant
  - marker: b
    text: Maaari ring isalin na “Asaias, na opisyal ng hari.” Literal na “lingkod ng hari” ang Hebreo, ngunit maaari itong tumukoy sa isang opisyal ng palasyo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו הַמֶּלֶךְ
  choice: Pagkatapos, iniutos ng hari
  rationale: Ipinahahayag ng pandiwang צוה ang isang utos na may awtoridad. Likas sa salaysay na Filipino ang “iniutos,” at ipinagdurugtong ng “Pagkatapos” ang pangyayari sa naunang talata.
- source_word: חִלְקִיָּהוּ
  choice: Hilkias
  rationale: Ginamit ang karaniwang anyong Filipino ng pangalang Hebreo.
- source_word: אֲחִיקָם בֶּן שָׁפָן
  choice: Ahikam na anak ni Safan
  rationale: Likas at malinaw sa Filipino ang “na anak ni” bilang katumbas ng patronimikong בֶּן.
- source_word: עַבְדּוֹן בֶּן מִיכָה
  choice: Abdon na anak ni Mica
  rationale: Sinusunod nito ang tekstong Masoretiko ng 2 Cronica habang itinatala sa talababa ang pagkakaiba sa katumbas na salaysay.
- source_word: שָׁפָן הַסֹּפֵר
  choice: Safan na eskriba
  rationale: Pinananatili ng “eskriba” ang tuwirang kahulugan ng סֹפֵר nang hindi tiyak na nililimitahan ang tungkulin sa makabagong konsepto ng isang kalihim.
- source_word: עֲשָׂיָה עֶבֶד הַמֶּלֶךְ
  choice: Asaias na lingkod ng hari
  rationale: Ang “lingkod ng hari” ang tuwirang salin; maaari rin itong tumukoy sa isang opisyal ng palasyo, gaya ng nakasaad sa talababa.
- source_word: לֵאמֹר
  choice: 'ang ganito:'
  rationale: Sa Filipino, likas na ipinakikilala ng “ang ganito:” ang utos na susunod sa kasunod na talata at ginagampanan nito ang tungkulin ng pormulang Hebreo na לֵאמֹר.
