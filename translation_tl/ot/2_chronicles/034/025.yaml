  text: תַּ֣חַת אֲשֶׁ֣ר עֲזָב֗וּ/נִי ו/יקטירו לֵֽ/אלֹהִ֣ים אֲחֵרִ֔ים לְמַ֨עַן֙ הַכְעִיסֵ֔/נִי בְּ/כֹ֖ל מַעֲשֵׂ֣י יְדֵי/הֶ֑ם וְ/תִתַּ֧ךְ חֲמָתִ֛/י בַּ/מָּק֥וֹם הַ/זֶּ֖ה וְ/לֹ֥א תִכְבֶּֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/025.yaml
  text: Because they have forsaken me and burned incense to other gods[a], so as to provoke me to anger by all the works of their hands[b], my wrath will be poured out on this place and will not be quenched.
translation:
  language: tl
  text: Sapagkat iniwan nila ako at nagsunog sila ng insenso sa ibang mga diyos[a], upang galitin ako sa pamamagitan ng lahat ng gawa ng kanilang mga kamay[b], ibubuhos ang matinding galit ko sa lugar na ito at hindi maaapula.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga banyagang diyos.” Mas literal sa Hebreo ang “ibang mga diyos.”
    reason: lexical_alternative
  - marker: b
    text: Ang “mga gawa ng kanilang mga kamay” ay maaaring tumukoy sa mga bagay na ginawa nila o sa kanilang mga gawa, lalo na sa mga diyus-diyosang ginawa ng tao at sa mga gawaing kaugnay ng mga ito.
    reason: cultural_note
lexical_decisions:
- source_word: תַּחַת אֲשֶׁר
  choice: Sapagkat
  rationale: Ipinahahayag ng idyoma ang dahilan ng darating na hatol; natural at marangal sa modernong Tagalog ang “Sapagkat.”
- source_word: עֲזָבוּנִי
  choice: iniwan nila ako
  rationale: Tumpak na ipinapahayag ang pagtalikod o pag-abandona sa Diyos nang hindi nagdaragdag ng paliwanag na wala sa teksto.
- source_word: וַיַּקְטִירוּ
  choice: nagsunog sila ng insenso
  rationale: Sa kontekstong panrelihiyon at idolatriya, karaniwang tumutukoy ang Hiphil ng קטר sa pagsusunog ng insenso o handog na pinauusok.
- source_word: לֵאלֹהִים אֲחֵרִים
  choice: para sa ibang mga diyos
  rationale: Pinananatili nito ang literal na diwa ng אֲחֵרִים na “iba,” habang natural ang ugnayang ipinahahayag ng “para sa” sa Tagalog.
- source_word: לְמַעַן הַכְעִיסֵנִי
  choice: upang galitin ako
  rationale: Pinananatili ang maaaring layunin o bunga ng parirala, pati ang personal na pagtukoy sa galit ng Diyos.
- source_word: בְּכֹל מַעֲשֵׂי יְדֵיהֶם
  choice: sa lahat ng ginawa ng kanilang mga kamay
  rationale: Pinananatili ang Hebreong larawang “mga kamay” at ang saklaw nitong maaaring tumukoy sa mga bagay na ginawa, lalo na sa mga diyus-diyosan, gayundin sa kaugnay na mga gawa.
- source_word: וְתִתַּךְ חֲמָתִי
  choice: Kaya ibubuhos ang matinding galit ko
  rationale: Ang נתך ay nagbibigay ng larawang pagbubuhos, at ang חֵמָה ay matinding galit sa konteksto ng hatol. Ginawang “Kaya” ang waw upang malinaw ang bunga sa natural na Tagalog.
- source_word: בַּמָּקוֹם הַזֶּה
  choice: sa lugar na ito
  rationale: Natural sa Tagalog ang “sa” para sa lugar na pinatutungkulan ng ibinubuhos na hatol.
- source_word: וְלֹא תִכְבֶּה
  choice: at hindi ito mapapatay
  rationale: Pinananatili ang larawang apoy na hindi mapapatay, habang ang “ito” ay natural na tumutukoy sa naunang matinding galit.
theological_decisions:
- issue: Wika tungkol sa banal na hatol
  choice: ibubuhos ang matinding galit ko sa lugar na ito, at hindi ito mapapatay
  alternative: ibubuhos ang poot ko sa lugar na ito, at hindi ito maaapula
  rationale: Pinananatili ang tuwirang wika ng banal na galit at ang magkaugnay na mga larawan ng pagbubuhos at apoy, nang hindi ipinapasok ang mga doktrinang wala sa talata.
- issue: Layunin o bunga sa לְמַעַן
  choice: upang galitin ako
  alternative: kaya ginalit nila ako
  rationale: Ang “upang” ay nagpapanatili sa purposive/resultative na tensiyon ng konstruksyon sa halip na tiyakang gawin lamang itong bunga.
- issue: Unang panauhang pagtukoy sa Diyos
  choice: ako / ko
  alternative: ang PANGINOON / ng PANGINOON
  rationale: Unang panauhan ang mismong Hebreo sa banal na pananalita, kaya hindi ito pinapalitan ng isang banal na pangalan.
translation_notes:
  register: Modernong Filipino Tagalog na dignified ngunit madaling maunawaan. Pinanatili ang mga konkretong larawan ng Hebreo—mga kamay, pagbubuhos, at apoy—habang iniwasan ang labis na arkaikong “poot” at “maaapula” sa pangunahing teksto.
