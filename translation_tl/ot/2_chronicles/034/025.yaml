- from: Sapagkat iniwan nila ako at nagsunog sila ng insenso para sa ibang mga diyos[a], upang galitin ako sa lahat ng ginawa ng kanilang mga kamay[b]. Kaya ibubuhos ang matinding galit ko sa lugar na ito, at hindi ito mapapatay.
  to: Sapagkat iniwan nila ako at nagsunog sila ng insenso sa ibang mga diyos[a], upang galitin ako sa pamamagitan ng lahat ng gawa ng kanilang mga kamay[b], ibubuhos ang matinding galit ko sa lugar na ito at hindi maaapula.
  rationale: Inayos ang pang-ukol para sa pinag-alayan ng insenso, nilinaw ang instrumental na puwersa ng “sa pamamagitan ng,” at pinalitan ang “mapapatay” ng “maaapula” upang malinaw na mapanatili ang metapora ng galit bilang apoy. Hindi binago ang kahulugan, ang sanhi-bungang daloy, o ang unang panauhang banal na pananalita.
