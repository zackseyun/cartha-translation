  naturalness: Dignified at madaling unawain ang Tagalog. Ngunit ang “hindi ito mapapatay” ay maaaring mangahulugang ‘hindi papatayin’ at hindi malinaw na tumutukoy sa larawang apoy. Mas malinaw at natural sa konteksto ang “hindi maaapula.”
  terminology: Ang “insenso,” “ibang mga diyos,” at “matinding galit” ay angkop. Pinanatili ang unang panauhan ng banal na pananalita at ang metapora ng pagbubuhos at apoy nang walang dagdag na doktrina.
  issues:
