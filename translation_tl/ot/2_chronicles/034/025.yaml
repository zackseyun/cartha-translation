  - severity: medium
    issue: “hindi ito mapapatay”
    rationale: Sa modernong Tagalog, maaari itong unawain bilang ‘hindi papatayin,’ hindi bilang pag-apula ng apoy. “Hindi maaapula” ang likas na katumbas ng metaporang ‘will not be quenched.’
