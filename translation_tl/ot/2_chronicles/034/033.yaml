  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יָּ֨סַר יֹֽאשִׁיָּ֜הוּ אֶת כָּל הַ/תּוֹעֵב֗וֹת מִֽ/כָּל הָ/אֲרָצוֹת֮ אֲשֶׁ֣ר לִ/בְנֵ֣י יִשְׂרָאֵל֒ וַֽ/יַּעֲבֵ֗ד אֵ֤ת כָּל הַ/נִּמְצָא֙ בְּ/יִשְׂרָאֵ֔ל לַ/עֲב֖וֹד אֶת יְהוָ֣ה אֱלֹהֵי/הֶ֑ם כָּל יָמָ֕י/ו לֹ֣א סָ֔רוּ מֵֽ/אַחֲרֵ֕י יְהוָ֖ה אֱלֹהֵ֥י אֲבוֹתֵי/הֶֽם־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/033.yaml
  text: And Josiah removed all the abominations from all the lands that belonged to the sons of Israel[a], and he made all who were found in Israel serve Yahweh their God. All his days they did not turn away from following Yahweh[d][c][b], the God of their fathers.
translation:
  language: tl
  text: Inalis ni Josias ang lahat ng kasuklam-suklam na bagay mula sa lahat ng lupain ng mga anak ni Israel[a], at pinaglingkod niya kay Yahweh, na kanilang Diyos, ang lahat ng naroon sa Israel[b]. Habang nabubuhay siya, hindi sila tumalikod sa pagsunod kay Yahweh, ang Diyos ng kanilang mga ama[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “mula sa lahat ng teritoryo ng bayan ng Israel.” Literal na sinasabi ng Hebreo, “mula sa lahat ng lupain na nauukol sa mga anak ni Israel.”
    reason: lexical_alternative
  - marker: b
    text: Literal na “ang lahat ng natagpuan sa Israel,” na sa kontekstong ito ay nangangahulugang lahat ng naroon o naninirahan doon.
    reason: lexical_note
  - marker: c
    text: Ang “Diyos ng kanilang mga ama” ay tumutukoy sa Diyos ng tipan na sinamba ng kanilang mga ninuno.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּסַר
  choice: inalis
  rationale: Ang Hiphil ng סור ay nangangahulugang alisin o ipaalis; malinaw at natural ang “inalis” sa konteksto ng reporma ni Josias.
- source_word: הַתּוֹעֵבוֹת
  choice: mga kasuklam-suklam na bagay
  rationale: Pinananatili nito ang matinding pagkondena sa mga bagay o gawaing kaugnay ng idolatriya nang hindi nililimitahan ang salita sa mga pisikal na bagay lamang.
- source_word: מִכָּל הָאֲרָצוֹת אֲשֶׁר לִבְנֵי יִשְׂרָאֵל
  choice: mula sa lahat ng lupain ng mga anak ni Israel
  rationale: Pinananatili ang pangmaramihang “mga lupain” at ang ugnayang ipinahihiwatig ng לְ, nang hindi labis na tinutukoy kung pag-aari, mana, o teritoryong tinitirhan ang ibig sabihin.
- source_word: וַיַּעֲבֵד
  choice: pinaglingkod niya
  rationale: Ipinahahayag ng causative Hiphil na si Josias ang aktibong nagpasailalim sa mga tao sa paglilingkod, ngunit hindi dinaragdagan ng tahasang pisikal na pamimilit.
- source_word: כָּל הַנִּמְצָא בְּיִשְׂרָאֵל
  choice: lahat ng naroon sa Israel
  rationale: Sa konteksto, ang Niphal participle ay tumutukoy sa lahat ng taong nasa Israel; iniiwasan ng “naroon” ang maling pahiwatig na hinanap at saka natagpuan sila.
- source_word: לַעֲבֹד אֶת יְהוָה אֱלֹהֵיהֶם
  choice: maglingkod kay Yahweh na kanilang Diyos
  rationale: Ang “maglingkod” ay nagpapanatili sa malawak na diwa ng katapatan at pagsambang nakapaloob sa עבד.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasatitik ang personal na pangalang banal sa halip na palitan ito ng isang titulo.
- source_word: כָּל יָמָיו
  choice: habang nabubuhay siya
  rationale: Natural nitong ipinahahayag sa modernong Tagalog ang buong panahong tinutukoy ng “lahat ng kanyang mga araw,” na si Josias ang antecedent.
- source_word: לֹא סָרוּ מֵאַחֲרֵי יְהוָה
  choice: hindi sila tumalikod sa pagsunod kay Yahweh
  rationale: Pinananatili ang larawan ng pagtalikod at ang tahasang ideya ng pagsunod na nasa pariralang מֵאַחֲרֵי.
- source_word: אֱלֹהֵי אֲבוֹתֵיהֶם
  choice: ang Diyos ng kanilang mga ama
  rationale: Malapit ito sa literal na pananalita ng Hebreo at pinananatili ang pormulang pangtipan na tumutukoy sa Diyos na sinamba ng naunang mga salinlahi.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehova
  rationale: Pangalan mismo ang nasa tekstong Hebreo, kaya pinananatili ito bilang “Yahweh” sa halip na palitan ng titulo.
- issue: Lakas ng causative na וַיַּעֲבֵד
  choice: pinaglingkod niya
  alternative: inatasan niyang maglingkod o pinilit niyang maglingkod
  rationale: Ipinakikita ng napiling anyo ang aktibong pagpapatupad ni Josias nang hindi pinahihina sa simpleng paghikayat o pinalalakas sa tahasang sapilitang karahasan.
- issue: Saklaw ng panghalip sa לֹא סָרוּ
  choice: hindi sila tumalikod
  alternative: ang lahat ng naroon sa Israel ay hindi tumalikod
  rationale: Pangmaramihan ang pandiwa at likas na tumutukoy sa mga taong nasa Israel; pinananatili ang panghalip ng pinagmulan at ang bahagyang distansiya nito sa tinutukoy.
- issue: Pagpapanatili sa pormulang “Diyos ng kanilang mga ama”
  choice: mga ama
  alternative: mga ninuno
  rationale: Ang אֲבוֹתֵיהֶם ay literal na “kanilang mga ama” at bahagi ng tradisyunal na pormulang pangtipan; ipinapaliwanag sa talababa ang intergenerational na diwa nito.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “Josias,” ang karaniwang anyong Tagalog ng pangalan, at “Yahweh” para sa tetragrammaton. Pinanatili ang matinding lakas ng “kasuklam-suklam,” ang causative na kilos ni Josias, at ang pormulang pangtipan na “Diyos ng kanilang mga ama.”
