  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַֽ/יִּתְּנ֗וּ עַל יַד֙ עֹשֵׂ֣ה הַ/מְּלָאכָ֔ה הַ/מֻּפְקָדִ֖ים בְּ/בֵ֣ית יְהוָ֑ה וַ/יִּתְּנ֨וּ אֹת֜/וֹ עוֹשֵׂ֣י הַ/מְּלָאכָ֗ה אֲשֶׁ֤ר עֹשִׂים֙ בְּ/בֵ֣ית יְהוָ֔ה לִ/בְדּ֥וֹק וּ/לְ/חַזֵּ֖ק הַ/בָּֽיִת־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/010.yaml
  text: They put it into the hand of the workmen who were appointed over the house of Yahweh[b][a], and the workmen who were working in the house of Yahweh gave it for repairing and strengthening the house.
translation:
  language: tl
  text: Ipinagkatiwala nila iyon sa mga manggagawang inatasang mangasiwa sa bahay ni Yahweh[a], at ibinigay nila iyon sa mga manggagawang nagtatrabaho sa bahay ni Yahweh upang ayusin at patibayin ang bahay.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “bahay ni Yahweh” ay ang templo.
    reason: cultural_note
  - marker: b
    text: 'Maaari ring isalin: “upang kumpunihin at palakasin ang bahay.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ
  choice: ipinagkatiwala / ibinigay
  rationale: 'Iisang pandiwa ang ginamit sa Hebreo, ngunit hinihingi ng dalawang konteksto ang magkaibang likas na salin: “ipinagkatiwala” para sa paglalagay sa pangangasiwa ng iba, at “ibinigay” para sa kasunod na paglilipat.'
- source_word: עַל יַד
  choice: sa mga … inatasang mangasiwa
  rationale: Ang idyoma ay tumutukoy sa pagbibigay ng isang bagay sa kontrol o pangangasiwa ng iba; mas likas ito sa modernong Tagalog kaysa sa literal na “sa kamay.”
- source_word: עֹשֵׂה הַמְּלָאכָה
  choice: mga manggagawa
  rationale: Bagaman anyong isahan ang participle, kolektibo ang diwa nito sa konteksto at tumutukoy sa mga gumagawa ng pagkukumpuni.
- source_word: הַמֻּפְקָדִים
  choice: inatasang mangasiwa
  rationale: Ipinahihiwatig ng passive participle na sila ay itinalaga at binigyan ng pananagutang mamahala.
- source_word: בְּבֵית יְהוָה
  choice: sa bahay ni Yahweh
  rationale: Pinananatili ang literal na larawan ng “bahay,” na sa konteksto ay ang templo, at isinasalin ang banal na pangalan bilang Yahweh.
- source_word: אֹתוֹ
  choice: iyon
  rationale: Ang panghalip ay tumutukoy sa salaping binanggit sa naunang konteksto; hindi idinaragdag sa pangunahing teksto ang pangngalang hindi hayagang narito sa Hebreo.
- source_word: עוֹשֵׂי הַמְּלָאכָה אֲשֶׁר עֹשִׂים
  choice: mga manggagawang nagtatrabaho
  rationale: Pinananatili nito ang pag-uulit ng ideya ng paggawa sa Hebreo nang hindi nagiging mabigat sa Tagalog.
- source_word: לִבְדּוֹק
  choice: upang ayusin
  rationale: Sa konteksto ng templo, ang pandiwa ay tumutukoy sa pagkukumpuni o pagsasaayos ng mga sira, hindi lamang sa pagsusuri.
- source_word: וּלְחַזֵּק
  choice: at patibayin
  rationale: Tuwirang ipinapahayag nito ang pagpapatatag o pagpapalakas ng gusali.
- source_word: הַבָּיִת
  choice: ang bahay
  rationale: Pinananatili ang leksikal na pag-uulit ng Hebreo at ang ugnayan nito sa naunang “bahay ni Yahweh.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang transliterasyon ng personal na banal na pangalan sa halip na palitan ito ng isang titulo.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehova
  rationale: Ang Hebreo ay may personal na pangalang tipan; pinananatili itong Yahweh nang hindi pinapalitan ng titulo.
- issue: Pagkilala sa “bahay ni Yahweh”
  choice: Panatilihin ang “bahay” at ipaliwanag sa talababa na ito ang templo
  alternative: Isalin nang tuwiran bilang “templo ni Yahweh”
  rationale: Pinananatili ng pangunahing teksto ang metapora at pag-uulit ng Hebreo, habang nililinaw ng talababa ang sangguniang pangkultura.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “ipinagkatiwala” para likas na maipahayag ang idyomang עַל יַד, ngunit pinanatili ang “bahay ni Yahweh” upang mapangalagaan ang larawan at pag-uulit ng Hebreo.
