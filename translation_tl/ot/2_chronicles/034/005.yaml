  text: וְ/עַצְמוֹת֙ כֹּֽהֲנִ֔ים שָׂרַ֖ף עַל מזבחותים וַ/יְטַהֵ֥ר אֶת יְהוּדָ֖ה וְ/אֶת יְרוּשָׁלִָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/005.yaml
  text: He burned the bones of the priests on their altars[a], and he cleansed Judah and Jerusalem.
translation:
  language: tl
  text: Sinunog niya sa kanilang mga altar[a] ang mga buto ng mga pari, at nilinis niya ang Juda at Jerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa mga altar.” Di-karaniwan ang anyong Hebreo rito; ang diwa ay sinunog ni Josias ang mga buto ng mga pari sa mga altar na kaugnay sa kanila.
    reason: textual_variant
lexical_decisions:
- source_word: וְ/עַצְמוֹת כֹּהֲנִים
  choice: ang mga buto ng mga pari
  rationale: Ang עַצְמוֹת ay maramihang anyong construct ng עֶצֶם at tumutukoy rito sa literal na mga buto; ang כֹּהֲנִים ay simpleng “mga pari.” Hindi idinagdag ang “sumasamba sa diyus-diyosan” dahil hindi iyon tahasang nasa parirala.
- source_word: שָׂרַף
  choice: Sinunog niya
  rationale: Ang Qal perfect 3ms ng שׂרף ay nangangahulugang “sinunog.” Ang aktibong ayos na ito ay natural sa makabagong Tagalog at malinaw na ipinagpapatuloy ang kilos ni Josias sa konteksto.
- source_word: עַל מזבחותים
  choice: sa kanilang mga altar
  rationale: Ang עַל ay “sa/sa ibabaw ng,” at ang di-karaniwang anyong מזבחותים ay malamang na nagpapahiwatig ng “kanilang mga altar.” Pinananatili sa talababa ang posibilidad na “sa mga altar.”
- source_word: וַ/יְטַהֵר
  choice: at nilinis niya
  rationale: Ang Piel wayyiqtol ng טהר ay tumutukoy sa pag-aalis ng karumihang kaugnay ng ipinagbabawal na pagsamba. Ang “nilinis” ay natural at napapanatili ang ritwal at moral na pahiwatig nang hindi labis na nagpapaliwanag.
- source_word: אֶת יְהוּדָה וְ/אֶת יְרוּשָׁלִָם
  choice: ang Juda at Jerusalem
  rationale: Karaniwang anyong Tagalog ng mga pangalang heograpiko ang “Juda” at “Jerusalem”; kapwa sila tuwirang layon ng pandiwang “nilinis.”
theological_decisions:
- issue: Uri ng paglilinis sa Juda at Jerusalem
  choice: Pag-aalis ng karumihang dulot ng ipinagbabawal na pagsamba
  alternative: Lubos na seremonyal na pagpapadalisay lamang, o pisikal na paglilinis lamang
  rationale: Sa konteksto ng reporma ni Josias, ang טהר ay may ritwal at moral na dimensiyon. Pinananatili ng “nilinis” ang lawak na ito nang hindi nagpapasok ng isang mas tiyak na doktrinal na pagpapakahulugan.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Inuna ang kilos na “Sinunog niya” para sa natural na daloy, habang pinanatili ang lantad na katawagang “mga pari” at ang ritwal-moral na saklaw ng “nilinis.”
