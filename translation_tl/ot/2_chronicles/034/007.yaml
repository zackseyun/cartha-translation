  source_fidelity: Ang salin ay wastong naghihiwalay sa paggiba ng mga altar at Asherim, pagdurog sa mga larawang inukit hanggang maging pino, at pagputol sa mga חַמָּנִים. Gayunman, ang “mga poste ni Ashera” ay masyadong tiyak sa pisikal na anyo ng אֲשֵׁרִים, samantalang hindi ito ganap na tiyak sa Hebreo. Ang “ibinagsak” ay maaari ring mangahulugang pinatumba lamang at hindi lubos na naghahayag ng paggiba na nasa נתץ.
  naturalness: Mas natural at mas tiyak ang “giniba” para sa mga altar at iba pang instalasyong pangkulto. Ang “mga Asherim” ay katanggap-tanggap na teknikal na anyo sa isang marangal na salin kapag ipinaliliwanag sa talababa. Ang “mga haliging iniuugnay sa araw” ay malinaw na Filipino at hindi labis na nagtatakda ng eksaktong gamit ng pinagtatalunang termino.
  terminology: Pinanatili ang “altar,” “mga larawang inukit,” at “Jerusalem.” Ginamit ang “Asherim” upang huwag ipagpalagay na ang mga bagay ay tiyak na mga poste. Para sa חַמָּנִים, pinanatili ang ugnayang leksikal sa araw ngunit nilinaw sa talababa ang alternatibong “mga altar ng insenso.”
