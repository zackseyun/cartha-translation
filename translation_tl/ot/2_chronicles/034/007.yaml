source:
  edition: WLC
  text: וַ/יְנַתֵּ֣ץ אֶת הַֽ/מִּזְבְּח֗וֹת וְ/אֶת הָ/אֲשֵׁרִ֤ים וְ/הַ/פְּסִלִים֙ כִּתַּ֣ת לְ/הֵדַ֔ק וְ/כָל הַֽ/חַמָּנִ֥ים גִּדַּ֖ע בְּ/כָל אֶ֣רֶץ יִשְׂרָאֵ֑ל וַ/יָּ֖שָׁב לִ/ירוּשָׁלִָֽם־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/007.yaml
  text: He tore down the altars and the Asherim[a], and he crushed the carved images to powder; he cut down all the incense altars throughout all the land of Israel[b]. Then he returned to Jerusalem.
translation:
  language: tl
  text: Giniba niya ang mga altar at ang mga Asherim[a], at dinurog niya hanggang maging pulbos ang mga larawang inukit. Pinutol niya ang lahat ng haliging iniuugnay sa araw[b] sa buong lupain ng Israel. Pagkatapos, bumalik siya sa Jerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga poste ni Ashera.” Ang salitang Hebreo ay tumutukoy sa mga bagay pangkulto na kaugnay ni Ashera; maaaring mag-iba ang eksaktong anyo ng mga ito ayon sa konteksto.
    reason: lexical_alternative
  - marker: b
    text: O “mga altar ng insenso.” Tinutukoy ng salitang Hebreo ang isang uri ng bagay pangkulto, ngunit pinagtatalunan ang eksaktong anyo at gamit nito.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְנַתֵּץ
  choice: Ibinagsak niya
  rationale: Ang pandiwang נתץ ay tumutukoy sa paggiba o pagbagsak ng mga estruktura; natural at malinaw ang “ibinagsak” para sa mga altar at kultikong bagay.
- source_word: הַמִּזְבְּחוֹת
  choice: mga altar
  rationale: Karaniwang makabagong salin ng מזבחות at madaling maunawaan sa Filipino.
- source_word: הָאֲשֵׁרִים
  choice: mga poste ni Ashera
  rationale: Tumutukoy ang אֲשֵׁרִים sa mga kultikong bagay na kaugnay ni Ashera. Ginamit ang karaniwang paglalarawang “mga poste,” habang nililinaw sa talababa na hindi tiyak ang eksaktong anyo ng mga ito.
- source_word: הַפְּסִלִים
  choice: mga larawang inukit
  rationale: Tiyak na ipinahahayag ng פסילים na ang mga ito ay mga kultikong imaheng nililok o inukit, sa halip na ang mas malawak na katawagang “mga diyus-diyosan.”
- source_word: כִּתַּת לְהֵדַק
  choice: dinurog niya hanggang maging pulbos
  rationale: Ipinahahayag ng parirala ang matinding pagdurog hanggang maging napakapino ang mga bagay.
- source_word: הַחַמָּנִים
  choice: mga haliging panamba sa araw
  rationale: Malamang na tumutukoy ang חַמָּנִים sa mga kultikong haligi o imaheng kaugnay ng araw. Akma rin ang nakatayong bagay sa pandiwang “pinutol,” ngunit pinanatili sa talababa ang alternatibong pagkakakilanlan bilang mga altar ng insenso.
- source_word: גִּדַּע
  choice: Pinutol niya
  rationale: Ang גדע ay nangangahulugang pumutol o magpatumba sa pamamagitan ng pagputol, at angkop sa mga nakatayong kultikong bagay.
- source_word: בְּכָל אֶרֶץ יִשְׂרָאֵל
  choice: sa buong lupain ng Israel
  rationale: Likas na Filipino na naghahayag ng lawak ng isinagawang paglilinis.
- source_word: וַיָּשָׁב לִירוּשָׁלִָם
  choice: Pagkatapos, bumalik siya sa Jerusalem
  rationale: Ipinakikita ng “Pagkatapos” ang pagsulong ng salaysay na ipinahahayag ng Hebrew wayyiqtol.
theological_decisions:
- issue: Paglalarawan sa mga bagay na ginagamit sa pagsambang hindi ayon sa kautusan
  choice: 'Pinanatili ang magkakaibang kongkretong katawagan: mga altar, mga poste ni Ashera, mga larawang inukit, at mga haliging panamba sa araw.'
  alternative: Pagsama-samahin ang lahat sa pangkalahatang katawagang “mga diyus-diyosan at dambana.”
  rationale: Mas malapit ito sa tiyak na mga katawagan sa Hebreo at hindi nito pinapawi ang pagkakaiba ng mga kultikong bagay.
- issue: Hindi tiyak na kahulugan ng הַחַמָּנִים
  choice: “mga haliging panamba sa araw” sa pangunahing teksto, na may alternatibo sa talababa
  alternative: “mga altar ng insenso”
  rationale: Ang ugnayan sa araw ay may matibay na leksikal na batayan at bumabagay sa pandiwang “pinutol,” ngunit nananatiling pinagtatalunan ang tiyak na pagkakakilanlan kaya hindi itinago ang alternatibo.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “altar,” na karaniwan na sa modernong Filipino, at iniwasan ang mga sinauna o labis na teknikal na katawagan. Ang “Ashera” at ang mga talababa ay nagpapanatili ng historikal at leksikal na katiyakan nang hindi nagpapataw ng denominasyonal na paliwanag.
