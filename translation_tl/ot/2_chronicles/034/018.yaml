base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/018.yaml
  text: Then Shaphan the scribe told the king[a], saying, “Hilkiah the priest has given me a book,” and Shaphan read from it before the king.
translation:
  language: tl
  text: Pagkatapos, iniulat ni Safan, na tagapagsulat, sa hari, “Binigyan ako ni Hilkias na pari ng isang aklat[a].” At binasa iyon ni Safan sa harap ng hari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “balumbon.” Ang salitang Hebreo ay maaaring tumukoy sa isang nakasulat na dokumento o aklat; noong panahong iyon, karaniwan itong nasa anyong balumbon.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגֵּד
  choice: sinabi
  rationale: Ang Hiphil ng נגד ay karaniwang nangangahulugang magsabi o mag-ulat. Natural sa makabagong Filipino ang “sinabi” at angkop ito sa tuwirang pananalitang kasunod.
- source_word: הַסּוֹפֵר
  choice: na tagapagsulat
  rationale: Ang סֹפֵר ay maaaring tumukoy sa eskriba o kalihim na opisyal ng hari. Pinananatili ng “tagapagsulat” ang pangunahing tungkulin nang hindi labis na nililimitahan ang posisyon.
- source_word: סֵפֶר
  choice: isang aklat
  rationale: Pangkalahatang katawagan ang סֵפֶר para sa isang nakasulat na dokumento o aklat. Hindi nito sapilitang tinutukoy ang pisikal na anyo, kaya inilagay sa talababa ang posibleng “balumbon.”
- source_word: נָתַן לִי
  choice: Binigyan ako
  rationale: 'Likas na paraan ito sa Filipino upang ipahayag ang natapos na pagbibigay na may agarang kaugnayan: nasa kay Safan na ang aklat.'
- source_word: חִלְקִיָּהוּ הַכֹּהֵן
  choice: Hilkias na pari
  rationale: Isinalin ang titulo at ginamit ang nakaugaliang anyong Filipino ng pangalang biblikal.
- source_word: וַיִּקְרָא בוֹ
  choice: binasa iyon
  rationale: Sa kontekstong ito, ipinahihiwatig ng בּוֹ ang pagbasa mula sa aklat. Ang “binasa iyon” ay natural sa Filipino at hindi nagdaragdag kung buong aklat o bahagi lamang ang binasa.
- source_word: לִפְנֵי הַמֶּלֶךְ
  choice: sa harap ng hari
  rationale: Tumpak at natural na katumbas ito ng pariralang nagsasaad na nagbasa siya sa presensiya ng hari.
