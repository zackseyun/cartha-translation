  text: וַ/יַּ֥עַשׂ הַ/יָּשָׁ֖ר בְּ/עֵינֵ֣י יְהוָ֑ה וַ/יֵּ֗לֶךְ בְּ/דַרְכֵי֙ דָּוִ֣יד אָבִ֔י/ו וְ/לֹא סָ֖ר יָמִ֥ין וּ/שְׂמֹֽאול־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/002.yaml
  text: He did what was right in the eyes of Yahweh[a], and walked in the ways of David his father[b]; he did not turn aside to the right or to the left.
translation:
  language: tl
  text: Ginawa niya ang tama sa paningin ni Yahweh[a], at lumakad siya sa mga landas ni David[b], na kanyang ninuno. Hindi siya lumihis sa kanan o sa kaliwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “sa paningin ng Panginoon.” Ang “sa paningin ni Yahweh” ay isang Hebreong idyoma para sa pagtataya o paghatol ni Yahweh.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “David na kanyang ama.” Ang “ama” ay ginagamit dito sa dinastikong diwa at tumutukoy sa isang ninuno.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַשׂ הַיָּשָׁר
  choice: Ginawa niya ang tama
  rationale: Ang עשה ay karaniwang nangangahulugang “gumawa,” at ang substantibong הַיָּשָׁר ay tumutukoy sa “tama” o “matuwid.” Likas at malinaw sa modernong Tagalog ang pariralang ito bilang pormula ng moral na pagtataya.
- source_word: בְּעֵינֵי יְהוָה
  choice: sa paningin ni Yahweh
  rationale: Pinananatili nito ang Hebreong larawan ng “sa mga mata ni Yahweh” habang ginagamit ang mas likas na idyomang Tagalog na “sa paningin.” Ang banal na pangalan na יְהוָה ay isinaling “Yahweh.”
- source_word: וַיֵּלֶךְ בְּדַרְכֵי
  choice: Lumakad siya sa mga daan
  rationale: Pinananatili ng “lumakad” at “mga daan” ang metapora ng pamumuhay at asal na nasa Hebreo, at nauunawaan pa rin ito sa dignified na wikang biblikal.
- source_word: דָּוִיד אָבִיו
  choice: David na kanyang ama
  rationale: Pormal na pinananatili ang אָבִיו bilang “kanyang ama.” Sa kontekstong dinastiko, ang “ama” ay maaaring tumukoy sa ninuno; nililinaw ito sa talababa nang hindi binabago ang anyo ng pangunahing teksto.
- source_word: וְלֹא סָר יָמִין וּשְׂמֹאול
  choice: at hindi siya lumihis sa kanan ni sa kaliwa
  rationale: Ang “lumihis” ay malinaw na nagpapahayag ng pagtalikod sa itinakdang landas. Pinananatili ng “sa kanan ni sa kaliwa” ang tambalang idyoma ng hindi paglihis sa alinmang panig.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Tuwirang lumilitaw sa tekstong Hebreo ang Tetragrammaton. Ang “Yahweh” ay nagpapanatili rito bilang personal na banal na pangalan sa halip na palitan ng isang titulo.
- issue: Ang katawagang “ama” para kay David
  choice: Pinanatili ang “ama” sa pangunahing teksto at ipinaliwanag na dinastikong ninuno
  alternative: David na kanyang ninuno
  rationale: Ang Hebreong אָב ay may mas malawak na saklaw kaysa sa agarang magulang at maaaring tumukoy sa isang ninuno. Ang pormal na anyo ay pinanatili nang may paliwanag upang maiwasan ang maling pagkaunawa.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Pinanatili ang mga metaporang “lumakad,” “mga daan,” at “lumihis” dahil magkakaugnay ang mga ito sa Hebreo at madaling maunawaan sa konteksto.
