  source_fidelity: Tumpak na naipapasa ang pagkakasunod ng salaysay, ang paghahatid ng salapi kay Hilkias na punong pari, ang salaping dinala sa bahay ng Diyos, at ang mga pangkat na pinanggalingan ng nalikom. Ang “lahat ng nalabi sa Israel” ay maingat na katumbas ng שְׁאֵרִית יִשְׂרָאֵל at hindi nagdaragdag ng pagpapakahulugang doktrinal.
