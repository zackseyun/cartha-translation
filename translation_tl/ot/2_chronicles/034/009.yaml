id: 2CH.34.9
reference: 2 Chronicles 34:9
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יָּבֹ֜אוּ אֶל חִלְקִיָּ֣הוּ הַ/כֹּהֵ֣ן הַ/גָּד֗וֹל וַֽ/יִּתְּנוּ֮ אֶת הַ/כֶּסֶף֮ הַ/מּוּבָ֣א בֵית אֱלֹהִים֒ אֲשֶׁ֣ר אָסְפֽוּ הַ/לְוִיִּם֩ שֹׁמְרֵ֨י הַ/סַּ֜ף מִ/יַּ֧ד מְנַשֶּׁ֣ה וְ/אֶפְרַ֗יִם וּ/מִ/כֹּל֙ שְׁאֵרִ֣ית יִשְׂרָאֵ֔ל וּ/מִ/כָּל יְהוּדָ֖ה וּ/בִנְיָמִ֑ן ו/ישבי יְרֽוּשָׁלִָֽם־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/009.yaml
  text: Then they came to Hilkiah the high priest and gave the money that had been brought into the house of God[a], which the Levites, the keepers of the threshold, had collected from Manasseh and Ephraim and from all the remnant of Israel, and from all Judah and Benjamin and the inhabitants of Jerusalem.
translation:
  language: tl
  text: Pagkatapos, pumunta sila kay Hilkias na punong pari at ibinigay nila ang salaping dinala sa bahay ng Diyos. Ang salaping ito ay tinipon ng mga Levita na bantay sa pasukan[a] mula sa Manases at Efraim, mula sa lahat ng nalabi sa Israel, at mula sa buong Juda at Benjamin at sa mga naninirahan sa Jerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga bantay sa pintuan”; literal, “mga bantay sa bungad.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: Pagkatapos, pumunta sila
  rationale: Isinusulong ng wayyiqtol ang salaysay; likas sa modernong Tagalog ang “Pagkatapos” upang ipakita ang pagkakasunod-sunod.
- source_word: חִלְקִיָּהוּ
  choice: Hilkias
  rationale: Ginamit ang nakaugaliang anyong Filipino ng pangalang Hebreo.
- source_word: הַכֹּהֵן הַגָּדוֹל
  choice: punong pari
  rationale: Likas at malinaw na katawagan sa Filipino para sa pinakamataas na katungkulan ng pari; hindi literalistikong “dakilang pari.”
- source_word: וַיִּתְּנוּ
  choice: ibinigay nila
  rationale: Tuwirang ipinapahayag ang paghahatid ng salapi kay Hilkias.
- source_word: הַכֶּסֶף
  choice: salapi
  rationale: Bagaman maaari itong literal na mangahulugang “pilak,” tumutukoy ito rito sa pondong salapi para sa bahay ng Diyos.
- source_word: הַמּוּבָא
  choice: dinala
  rationale: Pinananatili ang pasibong diwa ng participle sa isang maikli at likas na anyong Filipino.
- source_word: בֵית אֱלֹהִים
  choice: bahay ng Diyos
  rationale: Pinananatili ang larawan at pormal na pananalita ng Hebreo sa halip na agad itong gawing “templo ng Diyos.”
- source_word: אָסְפוּ
  choice: tinipon
  rationale: Ipinapahayag ang naunang pangangalap ng mga Levita; nilinaw sa hiwalay na pangungusap na ang salapi ang tinipon.
- source_word: הַלְוִיִּם
  choice: mga Levita
  rationale: Karaniwang anyong Filipino para sa pangkat na ito.
- source_word: שֹׁמְרֵי הַסַּף
  choice: mga bantay sa pasukan
  rationale: Malinaw na inilalarawan ang tungkulin sa natural na Filipino, habang inilalagay sa talababa ang literal na larawan ng “bungad.”
- source_word: מִיַּד
  choice: mula sa
  rationale: Ang idyomang literal na “mula sa kamay ng” ay nangangahulugang pinagmulan ng nakolektang salapi; natural dito ang “mula sa.”
- source_word: שְׁאֵרִית יִשְׂרָאֵל
  choice: lahat ng nalabi sa Israel
  rationale: Pinananatili ng “nalabi” ang posibleng mas malalim na diwa ng שְׁאֵרִית nang hindi ito nililimitahan sa simpleng “iba pa.”
- source_word: וישבי יְרוּשָׁלִָם
  choice: at sa mga naninirahan sa Jerusalem
  rationale: Isinasalin ang konsonantal na teksto ayon sa malinaw na kahulugang “mga naninirahan sa Jerusalem” at inaayon ang pang-ukol sa serye ng mga pinagmulan ng salapi.
theological_decisions:
- issue: Posibleng teolohikal na pahiwatig ng שְׁאֵרִית (“remnant”)
  choice: lahat ng nalabi sa Israel
  alternative: lahat ng iba pa sa Israel
  rationale: Maaaring tumukoy ang salita sa mga natira mula sa hilagang Israel at maaari rin itong magtaglay ng tipanang pahiwatig. Pinananatili ng “nalabi” ang saklaw na ito nang hindi nagdaragdag ng tiyak na doktrinal na pagpapakahulugan.
translation_notes:
  register: 'Modernong Filipino na marangal ngunit madaling maunawaan. Hinati sa dalawang pangungusap ang mahabang sugnay upang maging malinaw ang tinutukoy ng “tinipon,” nang hindi binabago ang ugnayan ng mga ideya. Ginamit ang mga nakaugaliang anyong Filipino ng mga pangalan: Hilkias, Manases, Efraim, Juda, Benjamin, at Jerusalem.'
