base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/014.yaml
  text: And when they brought out the silver that had been brought into the house of Yahweh[a], Hilkiah the priest found the Book of the Law of Yahweh by the hand of Moses.
translation:
  language: tl
  text: Nang inilalabas nila ang pilak na dinala sa bahay ni Yahweh, natagpuan ng paring si Hilkias ang Aklat ng Kautusan ni Yahweh sa pamamagitan ni Moises[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa literal na Hebreo: “sa kamay ni Moises,” isang idyomang maaaring mangahulugang “sa pamamagitan ni Moises” o “ibinigay sa pamamagitan ni Moises.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְהוֹצִיאָם
  choice: At habang inilalabas nila
  rationale: Ang בְּ na may infinitive construct at hulaping 3mp ay bumubuo ng sugnay na panahunan. Likas sa Tagalog ang “habang inilalabas nila,” at pinananatili nito ang kasabayang maaaring ipinahihiwatig ng Hebreo.
- source_word: הַכֶּסֶף
  choice: ang pilak
  rationale: Maaaring mangahulugan ang כֶּסֶף ng “pilak” o “salapi.” Pinananatili ng “pilak” ang kongkretong salita ng Hebreo, bagaman tumutukoy ito rito sa pondong nalikom.
- source_word: הַמּוּבָא
  choice: na dinala sa
  rationale: Ang Hophal participle ng בוא ay pasibo at nangangahulugang “dinala/ipinasok.” Ang “na dinala sa” ay malinaw at likas na panuring sa Tagalog.
- source_word: בֵּית יְהוָה
  choice: bahay ni Yahweh
  rationale: Literal itong “bahay ni Yahweh.” Pinananatili ang “bahay” sa halip na gawing “templo,” at isinasalin ang banal na pangalan bilang Yahweh.
- source_word: מָצָא
  choice: natagpuan
  rationale: Tuwirang katumbas ng Qal perfect na מָצָא ang “natagpuan”; hindi nito dinaragdagan ang diwa gaya ng maaaring gawin ng “natuklasan.”
- source_word: חִלְקִיָּהוּ הַכֹּהֵן
  choice: Hilkias na pari
  rationale: Ginagamit ang karaniwang anyong Filipino ng pangalan at ang likas na Tagalog na apposition na “na pari.”
- source_word: סֵפֶר תּוֹרַת יְהוָה
  choice: ang Aklat ng Kautusan ni Yahweh
  rationale: Ang סֵפֶר ay maaaring aklat, kasulatan, o balumbon, at ang תּוֹרָה ay kautusan o tagubilin. Ang “Aklat ng Kautusan” ay malinaw, marangal, at angkop sa tipanang konteksto.
- source_word: בְּיַד מֹשֶׁה
  choice: na ibinigay sa pamamagitan ni Moises
  rationale: Ang idyomang בְּיַד + tao ay nagsasaad ng pagkilos o paghahatid sa pamamagitan ng taong iyon. Nililinaw ng saling ito ang diwa sa natural na Tagalog, samantalang inilalahad sa talababa ang literal na larawan.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Tahasang lumilitaw sa talata ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal at tipanang pangalan sa halip na palitan ito ng isang titulo.
- issue: Ugnayan ng Kautusan at ni Moises sa pariralang בְּיַד מֹשֶׁה
  choice: na ibinigay sa pamamagitan ni Moises
  alternative: sa kamay ni Moises
  rationale: Maaaring ipahayag ng Hebreong idyoma ang tagapamagitan o ahente nang hindi eksaktong nilulutas kung ang diin ay sa pagkakasulat, paghahatid, o pagkakaloob. Ang “ibinigay sa pamamagitan” ay nagpapanatili sa pangkalahatang diwa ng pamamagitan; ang literal na anyo ay nasa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang “bahay” at “pilak” upang manatiling malapit sa Hebreo, habang ginawang likas sa Tagalog ang sugnay na panahunan at ang idyoma ng pamamagitan.
