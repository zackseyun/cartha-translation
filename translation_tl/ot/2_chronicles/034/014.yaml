revisions:
- from: At habang inilalabas nila ang pilak na dinala sa bahay ni Yahweh, natagpuan ni Hilkias na pari ang Aklat ng Kautusan ni Yahweh na ibinigay sa pamamagitan ni Moises.[a]
  to: Nang inilalabas nila ang pilak na dinala sa bahay ni Yahweh, natagpuan ng paring si Hilkias ang Aklat ng Kautusan ni Yahweh sa pamamagitan ni Moises[a].
  rationale: Inalis ang di-likas na “At habang” at ginawang mas natural ang pagtukoy kay Hilkias. Isinalin ang בְּיַד מֹשֶׁה bilang “sa pamamagitan ni Moises” upang maipahayag ang idyoma nang walang dagdag na pandiwang “ibinigay”; pinananatili sa talababa ang literal na anyo at ang posibleng pagpapakahulugan. Inilapit ang panandang talababa sa “Moises.”
