  text: וַ/יִּקְבֹּ֗ץ אֶת כָּל יְהוּדָה֙ וּ/בִנְיָמִ֔ן וְ/הַ/גָּרִים֙ עִמָּ/הֶ֔ם מֵ/אֶפְרַ֥יִם וּ/מְנַשֶּׁ֖ה וּ/מִ/שִּׁמְע֑וֹן כִּֽי נָפְל֨וּ עָלָ֤י/ו מִ/יִּשְׂרָאֵל֙ לָ/רֹ֔ב בִּ/רְאֹתָ֕/ם כִּֽי יְהוָ֥ה אֱלֹהָ֖י/ו עִמּֽ/וֹ־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/009.yaml
  text: And he gathered all Judah and Benjamin[a], and the sojourners with them from Ephraim, Manasseh, and Simeon, because many from Israel had fallen to him when they saw that Yahweh his God was with him.
translation:
  language: tl
  text: Tinipon niya ang buong Juda at Benjamin, pati ang mga dayuhang naninirahang kasama nila na mula sa Efraim, Manases, at Simeon. Marami kasing taga-Israel ang pumanig sa kanya[a] nang makita nilang kasama niya si Yahweh na kanyang Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “lumipat sa kanyang panig”; mas literal, “nahulog sa kanya.” Tumutukoy ang idyomang Hebreo sa paglipat ng katapatan kay Asa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְבֹּץ
  choice: Tinipon niya
  rationale: Ang Qal wayyiqtol ng קבץ ay tumutukoy sa pagtitipon ng mga tao. Likas at tuwiran sa modernong Tagalog ang “tinipon.”
- source_word: כָּל יְהוּדָה וּבִנְיָמִן
  choice: ang buong Juda at Benjamin
  rationale: Ginagamit ang mga pangalan ng lipi o lupain bilang pantukoy sa kanilang mga mamamayan. Pinananatili ng maikling anyo ang estruktura ng Hebreo at malinaw pa rin sa Tagalog.
- source_word: הַגָּרִים עִמָּהֶם
  choice: ang mga dayuhang naninirahang kasama nila
  rationale: Ang גֵּר ay hindi katutubong naninirahan sa isang pamayanan, hindi lamang panandaliang bisita. Iniiwasan ng pariralang ito ang luma o mapanlinlang na katawagang “estranghero” habang pinananatili ang katayuan nila bilang mga dayuhang residente.
- source_word: מֵאֶפְרַיִם וּמְנַשֶּׁה וּמִשִּׁמְעוֹן
  choice: na mula sa Efraim, Manases, at Simeon
  rationale: Ipinapahayag ng מִן ang kanilang pinagmulan. Ang “mula sa” ang pinakanatural na katumbas sa Tagalog.
- source_word: נָפְלוּ עָלָיו
  choice: pumanig sa kanya
  rationale: Sa kontekstong pampolitika, ang idyomang נפל על ay tumutukoy sa paglipat ng katapatan at pagsanib sa panig ng isang pinuno. Natural sa Tagalog ang “pumanig sa kanya”; inilalagay sa talababa ang mas literal na anyo upang mapanatili ang talinghaga at tunay na saklaw ng idyoma.
- source_word: מִיִּשְׂרָאֵל לָרֹב
  choice: Maraming taga-Israel
  rationale: Ang לָרֹב ay nagsasaad ng malaking bilang. Maikli at malinaw ang “maraming taga-Israel.”
- source_word: בִּרְאֹתָם
  choice: nang makita nila
  rationale: Ang infinitive construct na may בְּ ay nagsasaad ng pagkakataon o kalagayan; ang “nang makita nila” ay natural sa daloy ng salaysay at hindi labis na nagpapasya kung temporal o sanhi ang ugnayan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasatitik ang personal na pangalang banal sa halip na palitan ito ng titulong “PANGINOON.”
- source_word: אֱלֹהָיו עִמּוֹ
  choice: kasama niya si Yahweh na kanyang Diyos
  rationale: Tuwirang ipinapahayag ang presensya o pagsuporta ng Diyos nang hindi dinaragdagan ng mas tiyak na interpretasyong “nasa kanyang panig.”
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo. Ang “Yahweh” ay mas tuwirang kumakatawan sa Tetragrammaton kaysa sa pagpapalit dito ng isang titulo.
- issue: Kahulugan ng pagiging “kasama” ni Yahweh kay Asa
  choice: kasama niya si Yahweh na kanyang Diyos
  alternative: nasa panig niya ang kanyang Diyos
  rationale: Pinananatili ng “kasama niya” ang malawak na kahulugan ng banal na presensya at pagsuporta nang hindi ito nililimitahan sa pampolitika o militar na pagpanig.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “mga dayuhang naninirahan” upang malinaw na ipahayag ang panlipunang diwa ng גֵּר, at hinati sa dalawang pangungusap para sa likas na daloy nang hindi binabago ang lohikal na ugnayan ng mga sugnay.
