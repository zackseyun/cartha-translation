  source_fidelity: Tumpak na naihahatid ang וַיָּבֵא bilang “Dinala niya,” ang בֵּית הָאֱלֹהִים bilang “bahay ng Diyos,” at ang dalawang magkaibang pangkat ng קָדְשִׁים bilang mga bagay na inilaan ng kanyang ama at ng kanya mismo. Ang panghuling talaang “pilak, ginto, at mga kagamitan” ay wasto para sa כֶּסֶף וְזָהָב וְכֵלִים at hindi labis na pinasisikip ang saklaw ng “mga kagamitan.”
  naturalness: Natural at malinaw ang modernong Filipino. Bahagyang paulit-ulit ang “mga handog na inilaan,” ngunit ito ay hindi nakasasagabal at nakatutulong na ipakita ang konsepto ng mga bagay na itinalaga para sa Diyos.
  terminology: Ang “mga handog na inilaan” ay isang katanggap-tanggap na pagsasalin ng mga banal o itinalagang bagay sa talatang ito. Iniiwasan nito ang di-sapat na tiyak na “mga bagay” at hindi rin ipinapataw ang isang partikular na ritwal na kahulugan. Ang “bahay ng Diyos” ay angkop na biblikal na termino.
