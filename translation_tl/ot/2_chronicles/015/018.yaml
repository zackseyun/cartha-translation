  text: 'He brought into the house of God his father''s holy gifts and his own holy gifts: silver, gold, and vessels.'
translation:
  language: tl
  text: Dinala niya sa bahay ng Diyos ang mga handog na inilaan ng kanyang ama at ang sarili niyang mga handog na inilaan—pilak, ginto, at mga kagamitan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קָדְשֵׁי אָבִיו וְקָדָשָׁיו
  choice: mga handog na inilaan ng kanyang ama at ang sarili niyang mga handog na inilaan
  rationale: Ang קֹדֶשׁ sa konstruksiyong ito ay tumutukoy sa mga bagay na ibinukod bilang banal para sa Diyos. Nililinaw ng “mga handog na inilaan” ang gamit dito nang hindi ipinapalagay na ang mga ito ay karaniwang regalo lamang.
- source_word: בֵּית הָאֱלֹהִים
  choice: bahay ng Diyos
  rationale: Tuwirang salin na natural sa biblikal na Filipino at tumutukoy sa templo.
- source_word: כֶּסֶף וְזָהָב וְכֵלִים
  choice: pilak, ginto, at mga kagamitan
  rationale: Pinananatili ang tatlong uri ng mga inilaan na bagay; malawak ang כֵּלִים at ang “mga kagamitan” ay hindi labis na nagtatakda kung mga sisidlan o ibang kasangkapan ang tinutukoy.
theological_decisions:
- issue: Kahulugan ng mga banal na bagay
  choice: mga handog na inilaan
  alternative: mga banal na bagay
  rationale: Ipinahihiwatig ng konteksto na ang pilak, ginto, at mga kagamitan ay inilaan sa Diyos. Ang salin ay nagpapakita ng pagtatalaga nang hindi nagdaragdag ng partikular na ritwal o doktrina.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “inilaan” upang maipahayag ang konsepto ng mga bagay na ibinukod para sa Diyos; iniwasan ang mas teknikal o hindi likas na “mga banal na handog.”
