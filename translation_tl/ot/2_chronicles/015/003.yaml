id: 2CH.15.3
reference: 2 Chronicles 15:3
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/יָמִ֥ים רַבִּ֖ים לְ/יִשְׂרָאֵ֑ל לְ/לֹ֣א אֱלֹהֵ֣י אֱמֶ֗ת וּ/לְ/לֹ֛א כֹּהֵ֥ן מוֹרֶ֖ה וּ/לְ/לֹ֥א תוֹרָֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/003.yaml
  text: For many days Israel was without the true God[a], without a teaching priest[b], and without the law.
translation:
  language: tl
  text: Sa loob ng mahabang panahon, ang Israel ay walang tunay na Diyos[a], walang paring nagtuturo, at walang kautusan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Diyos ng katotohanan” o “Diyos na tapat.”
    reason: lexical_alternative
  - marker: b
    text: Ang salitang Hebreo ay maaari ring mangahulugang “turo” o “pagtuturo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָמִים רַבִּים
  choice: Sa loob ng mahabang panahon
  rationale: Likas na salin sa Filipino ng temporal na pariralang literal na “maraming araw”; ipinahihiwatig nito ang matagal na tagal nang hindi mekanikal ang anyo.
- source_word: לְיִשְׂרָאֵל
  choice: ang Israel ay
  rationale: Ang לְ ay naglalarawan dito ng kalagayang nauukol sa Israel; kailangan sa Filipino ang tahasang paksa at panandang pangungusap.
- source_word: לְלֹא אֱלֹהֵי אֱמֶת
  choice: walang tunay na Diyos
  rationale: Ang לְלֹא ay “walang,” at ang construct na אֱלֹהֵי אֱמֶת ay maaaring idiomatikong unawain bilang “tunay na Diyos,” habang itinatala sa talababa ang mas literal na “Diyos ng katotohanan.”
- source_word: כֹּהֵן מוֹרֶה
  choice: paring nagtuturo
  rationale: Ang מוֹרֶה ay participle ng “magturo”; malinaw at natural sa modernong Filipino ang pariralang tumutukoy sa tungkulin ng pari.
- source_word: תּוֹרָה
  choice: kautusan
  rationale: Ang “kautusan” ay dignidad at pamilyar na katumbas sa kontekstong biblikal, ngunit hindi nito lubos na saklaw ang posibleng kahulugang “turo/pagtuturo,” kaya pinananatili ang lawak sa talababa.
theological_decisions:
- issue: Paglalarawan sa אֱלֹהֵי אֱמֶת
  choice: tunay na Diyos
  alternative: Diyos ng katotohanan; Diyos na tapat
  rationale: Natural itong Filipino at nababagay sa konteksto ng Israel, ngunit hindi ginagawang eksklusibo ang interpretasyon; ang tunay/katotohanan/tapat na saklaw ng אֱמֶת ay nakasaad sa talababa.
- issue: Saklaw ng תּוֹרָה
  choice: kautusan
  alternative: turo; pagtuturo
  rationale: Pinananatili ng pangunahing teksto ang kinikilalang terminong biblikal, samantalang ipinababatid ng talababa na mas malawak ang leksikal na saklaw kaysa sa batas lamang.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at madaling maunawaan. Iningatan ang tatlong magkahanay na pariralang “walang,” at iniwasang magpasok ng paliwanag na denominasyonal.
