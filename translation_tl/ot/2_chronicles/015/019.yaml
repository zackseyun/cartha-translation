  text: And there was no war until the thirty-fifth year of Asa’s reign[a].
translation:
  language: tl
  text: At walang digmaan hanggang sa ikatatlumpu't limang taon ng paghahari ni Asa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “hanggang sa taong tatlumpu't lima ng paghahari ni Asa.” Nauunawaan ng ilang tagapagpaliwanag ang bilang na ito ayon sa isang mas malawak na sistemang kronolohikal, sa halip na bilangin ito nang mahigpit mula sa pagsisimula ng paghahari ni Asa, upang itugma sa kaugnay na mga talata.
    reason: alternative_reading
lexical_decisions:
- source_word: וּ/מִלְחָמָה לֹא הָיָתָה
  choice: At walang digmaan
  rationale: Ang מִלְחָמָה ay “digmaan” o “pakikidigma,” at ang לֹא הָיָתָה ay isang negatibong eksistensiyal na pahayag. Natural at tapat sa Filipino ang “walang digmaan,” habang pinananatili ng “At” ang ugnayan sa naunang talata.
- source_word: עַד
  choice: hanggang sa
  rationale: Ipinapakita nito ang hangganang temporal ng panahong walang digmaan.
- source_word: שְׁנַת שְׁלֹשִׁים וְחָמֵשׁ
  choice: ikatatlumpu't limang taon
  rationale: Ang construct na שְׁנַת na sinusundan ng bilang ay karaniwang pormula para sa taon ng paghahari; natural itong ipinapahayag sa Filipino bilang ordinal.
- source_word: לְמַלְכוּת אָסָא
  choice: ng paghahari ni Asa
  rationale: Sa kontekstong ito, ang מַלְכוּת ay tumutukoy sa panahon ng pamumuno bilang hari, kaya ang “paghahari” ang malinaw at natural na katumbas.
theological_decisions:
- issue: Kronolohikal na pahayag kaugnay ng ibang salaysay tungkol kay Asa
  choice: Tuwirang isinalin ang Hebreong pormula bilang “ikatatlumpu't limang taon ng paghahari ni Asa.”
  alternative: Unawain ang bilang ayon sa mas malawak na sistemang kronolohikal, gaya ng pagbibilang mula sa pagkakahati ng kaharian, o baguhin ang bilang upang itugma sa Mga Hari.
  rationale: Malinaw na iniuugnay ng tekstong Hebreo ang taon sa paghahari ni Asa. Hindi dapat lutasin sa pangunahing teksto ang umiiral na kronolohikal na tensiyon sa pamamagitan ng harmonisasyon o emendasyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “digmaan” bilang karaniwang salitang biblikal ngunit madaling maunawaan, at pinanatili ang kronolohikal na pahayag nang hindi ito tahimik na pinagkakasundo sa ibang teksto.
