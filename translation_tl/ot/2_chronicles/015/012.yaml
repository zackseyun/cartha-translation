  text: וַ/יָּבֹ֣אוּ בַ/בְּרִ֔ית לִ/דְר֕וֹשׁ אֶת יְהוָ֖ה אֱלֹהֵ֣י אֲבוֹתֵי/הֶ֑ם בְּ/כָל לְבָבָ֖/ם וּ/בְ/כָל נַפְשָֽׁ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/012.yaml
  text: And they entered into the covenant to seek Yahweh[a], the God of their fathers[b], with all their heart and with all their soul.
translation:
  language: tl
  text: Pumasok sila sa tipan[a] upang hanapin si Yahweh, ang Diyos ng kanilang mga ama[b], nang buong puso at nang buong kaluluwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Nagbigkis sila sa tipan.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “ang Diyos ng kanilang mga ama.” Ang “mga ama” ay tumutukoy sa kanilang mga ninunong lalaki.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּבֹאוּ בַבְּרִית
  choice: Pumasok sila sa tipan
  rationale: Pinananatili nito ang idyomang Hebreo na literal na tumutukoy sa pagpasok sa isang tiyak na tipanang pananagutan, hindi sa pisikal na pagpunta lamang.
- source_word: לִדְרוֹשׁ
  choice: upang hanapin
  rationale: Sa kontekstong panrelihiyon at pangtipan, ang pandiwa ay tumutukoy sa taimtim na paglapit at pagtatalaga sa Diyos, hindi lamang sa pagtatanong tungkol sa kaniya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang transliterasyon ng personal na pangalang banal sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֵי אֲבוֹתֵיהֶם
  choice: ang Diyos ng kanilang mga ninuno
  rationale: Ang “mga ninuno” ang natural na modernong Tagalog para sa mga naunang ama ng bayan at malinaw na naghahatid ng ugnayang pangkasaysayan at pangtipan.
- source_word: בְּכָל לְבָבָם
  choice: nang buong puso
  rationale: Ito ang natural na idyomang Tagalog para sa lubos na kalooban, hangarin, at panloob na pagtatalaga.
- source_word: וּבְכָל נַפְשָׁם
  choice: at buong kaluluwa
  rationale: Pinananatili ng “kaluluwa” ang pamilyar na pormulang pangtipan at ang diwa ng buong sarili o buhay.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehova
  rationale: Personal na pangalan ang tahasang nasa tekstong Hebreo; pinananatili ito sa transliterasyon sa halip na gawing titulo.
- issue: Kahulugan ng אֲבוֹתֵיהֶם bilang wikang tumutukoy sa mga ninuno
  choice: kanilang mga ninuno
  alternative: kanilang mga ama
  rationale: Ang “mga ninuno” ay natural sa modernong Tagalog at sa kontekstong ito ay tumutukoy sa mga naunang ama ng Israel, hindi lamang sa kani-kanilang agarang ama.
- issue: Saklaw ng נֶפֶשׁ
  choice: kaluluwa
  alternative: buong pagkatao
  rationale: Pinananatili ang leksikal at pormulang pangtipan ng “puso” at “kaluluwa,” habang hindi itinatanggi na maaaring saklawin ng נֶפֶשׁ ang buhay o buong sarili.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Pinanatili ang pormulang pangtipan at ang banal na pangalang Yahweh; ginamit ang “mga ninuno” bilang mas natural na Tagalog, at nilinaw sa talababa ang literal na “mga ama.”
