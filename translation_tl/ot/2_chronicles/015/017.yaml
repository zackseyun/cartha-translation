  text: וְ/הַ֨/בָּמ֔וֹת לֹא סָ֖רוּ מִ/יִּשְׂרָאֵ֑ל רַ֧ק לְבַב אָסָ֛א הָיָ֥ה שָׁלֵ֖ם כָּל יָמָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/017.yaml
  text: But the high places were not removed from Israel; nevertheless, Asa’s heart was whole all his days.
translation:
  language: tl
  text: Ngunit ang mga mataas na dako ay hindi inalis sa Israel. Gayunman, ang puso ni Asa ay buo sa buong buhay niya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַבָּמוֹת
  choice: matataas na sambahan
  rationale: Tumutukoy sa mga kultikong lugar na karaniwang nasa mataas na pook; pinananatili ng salin ang konsepto ng taas at nililinaw na mga sambahan ang mga ito.
- source_word: לֹא סָרוּ
  choice: hindi inalis
  rationale: Natural na Filipino para sa pasibong diwa na hindi naalis o naalis sa paggamit ang mga sambahang ito.
- source_word: לְבַב ... שָׁלֵם
  choice: ang puso ... ay buo
  rationale: Malapit sa literal na diwa ng 'buo/ganap' at pinananatili ang teolohikal na tensiyon sa pagitan ng mga natirang sambahan at ng pagtatasa sa puso ni Asa, nang hindi ito pinaliliit sa isang tiyak na paliwanag gaya ng 'lubos na nakatalaga.'
- source_word: כָּל יָמָיו
  choice: sa lahat ng araw ng kanyang buhay
  rationale: Dignified at malinaw na paglilipat ng Hebreong idyoma na nangangahulugang buong panahon ng kanyang buhay.
theological_decisions:
- issue: Ang kahulugan ng pagiging שָׁלֵם ng puso ni Asa sa kabila ng hindi pag-aalis ng matataas na sambahan
  choice: buo
  alternative: lubos na nakatalaga / tapat
  rationale: Ang 'buo' ay nagpapanatili sa lawak at posibleng tensiyon ng Hebreo, sa halip na tukuyin nang labis kung ito ay debosyon, katapatan, o kawalang-kapintasan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang 'matataas na sambahan' sa halip na mas teknikal o di-natural na 'matataas na lugar,' at pinanatili ang maikli at balanseng estruktura ng Hebreo.
