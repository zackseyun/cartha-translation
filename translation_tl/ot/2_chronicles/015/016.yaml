id: 2CH.15.16
reference: 2 Chronicles 15:16
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/גַֽם מַעֲכָ֞ה אֵ֣ם אָסָ֣א הַ/מֶּ֗לֶךְ הֱסִירָ/הּ֙ מִ/גְּבִירָ֔ה אֲשֶׁר עָשְׂתָ֥ה לַ/אֲשֵׁרָ֖ה מִפְלָ֑צֶת וַ/יִּכְרֹ֤ת אָסָא֙ אֶת מִפְלַצְתָּ֔/הּ וַ/יָּ֕דֶק וַ/יִּשְׂרֹ֖ף בְּ/נַ֥חַל קִדְרֽוֹן־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/016.yaml
  text: Even Maacah[a], the mother of King Asa, he removed from being queen mother, because she had made a dreadful image for Asherah; and Asa cut down her dreadful image, crushed it[c][b], and burned it in the Kidron Valley.
translation:
  language: tl
  text: Maging si Maaca, na ina ni Haring Asa, ay inalis ni Asa sa pagiging reyna ina, sapagkat gumawa siya ng isang kasuklam-suklam na imahen[a] para kay Ashera.[b] Pinutol ni Asa ang imahen niya, dinurog iyon, at sinunog sa Libis ng Kidron.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nakapangingilabot na imahen” o “karima-rimarim na bagay.” Ang salitang Hebreo ay tumutukoy sa isang kultikong bagay na nakapandidiri o nakatatakot.
    reason: lexical_alternative
  - marker: b
    text: Ang “Ashera” ay maaaring tumukoy sa diyosa o sa kultikong sagisag na kaugnay niya; sa ilang matatandang salin, isinasalin ito bilang “kakahuyan.”
    reason: cultural_note
  - marker: c
    text: Maaari ring “sa wadi ng Kidron” o “sa batis ng Kidron.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: Maging
  rationale: Ipinahihiwatig nito ang idinagdag at kapansin-pansing saklaw ng reporma ni Asa, pati sa isang malapit na kamag-anak ng hari.
- source_word: מַעֲכָה
  choice: Maaca
  rationale: Isinalin sa karaniwang anyong pantanging pangalan sa Filipino.
- source_word: אֵם אָסָא הַמֶּלֶךְ
  choice: ina ni Haring Asa
  rationale: Pinananatili ang tahasang ugnayang pampamilya at ang maharlikang pagkakakilanlan ni Asa.
- source_word: הֱסִירָהּ מִגְּבִירָה
  choice: inalis ni Asa sa pagiging reynang ina
  rationale: Ang pandiwa ay nangangahulugang alisin, at sa kontekstong maharlika ang גְּבִירָה ay tumutukoy sa kinikilalang katayuan o tungkulin ng reynang ina. Hayagang pinangalanan si Asa upang maging malinaw at natural sa Filipino.
- source_word: אֲשֶׁר עָשְׂתָה לַאֲשֵׁרָה
  choice: sapagkat gumawa siya ... para kay Ashera
  rationale: Ipinapakita ng sugnay ang dahilan ng pagtanggal sa kaniya. Pinananatili ng “para kay Ashera” ang kaugnayan sa diyosa o kultikong sagisag nang hindi ipinapalagay ang tiyak na anyo ng bagay.
- source_word: מִפְלָצֶת
  choice: isang kasuklam-suklam na imahen
  rationale: Ipinahahayag nito ang nakapandidiri o nakapanghihilakbot na katangian ng kultikong bagay. Ang “imahen” ay nilinaw mula sa kontekstong nagsasabing maaari itong putulin, durugin, at sunugin.
- source_word: וַיִּכְרֹת
  choice: Pinutol
  rationale: Tumutukoy ang pandiwa sa pagputol o pagtabas sa kultikong bagay; natural ito sa Filipino nang hindi labis na tinutukoy ang eksaktong hugis nito.
- source_word: מִפְלַצְתָּהּ
  choice: ang imahen niya
  rationale: Tumutukoy ang hulaping panghalip sa imaheng ginawa ni Maaca. Hindi na inulit ang panuring upang maging natural ang daloy habang malinaw pa rin ang tinutukoy.
- source_word: וַיָּדֶק
  choice: dinurog iyon
  rationale: Ipinahihiwatig ng pandiwa ang pagdurog o pagpino sa maliliit na piraso.
- source_word: וַיִּשְׂרֹף
  choice: sinunog
  rationale: Tuwirang katumbas ng pandiwang Hebreo para sa pagsunog.
- source_word: בְּנַחַל קִדְרוֹן
  choice: sa Libis ng Kidron
  rationale: Ang נחל ay maaaring tumukoy sa libis, bangin, wadi, o batis. Ang “Libis ng Kidron” ay malinaw at likas sa modernong Filipino.
theological_decisions:
- issue: Kahulugan ng אֲשֵׁרָה
  choice: Ashera bilang pantanging pangalan na kaugnay ng diyosa o kultikong sagisag
  alternative: poste ni Ashera; sagradong punongkahoy o kakahuyan
  rationale: Pinananatili nito ang sinaunang kontekstong panrelihiyon at ang tunay na kalabuan kung ang salita ay tumutukoy sa diyosa o sa sagisag na kaugnay niya. Hindi ipinipilit ng talata ang eksaktong anyo ng bagay.
- issue: Maharlikang titulong גְּבִירָה
  choice: reynang ina
  alternative: dakilang ginang; pangunahing ginang ng palasyo
  rationale: Sa konteksto ng monarkiya ng Juda, pinakamalamang na tumutukoy ito sa opisyal na katayuan ng ina ng hari o ng babaeng gumaganap sa tungkuling iyon.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “reynang ina” para sa institusyonal na katayuan, “kasuklam-suklam na imahen” para sa matinding negatibong diwa ng kultikong bagay, at “Libis ng Kidron” bilang malinaw na heograpikong katawagan. Inilagay ang bawat panandang talababa sa mismong salitang o pariralang tinatalakay nito.
