  text: So they gathered at Jerusalem in the third month, in the fifteenth year of Asa's reign.
translation:
  language: tl
  text: At nagtipon sila sa Jerusalem sa ikatlong buwan, sa ikalabinlimang taon ng paghahari ni Asa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקָּבְצוּ
  choice: Kaya nagtipon sila
  rationale: Ang Niphal wayyiqtol ng קבץ ay nagsasaad ng sama-samang pagtitipon sa kasunod na daloy ng salaysay. Likas sa modernong Tagalog ang “nagtipon sila,” samantalang ipinahihiwatig ng “Kaya” ang ugnayan nito sa naunang pangyayari.
- source_word: יְרוּשָׁלִַם
  choice: Jerusalem
  rationale: Ginamit ang nakaugaliang anyo ng pangalan ng lugar sa modernong saling Tagalog.
- source_word: בַּחֹדֶשׁ הַשְּׁלִישִׁי
  choice: nang ikatlong buwan
  rationale: Likas na pormula sa Tagalog para sa pagtukoy ng panahon, at malinaw na pinananatili ang ordinal na bilang ng buwan.
- source_word: לִשְׁנַת חֲמֵשׁ עֶשְׂרֵה
  choice: sa ikalabinlimang taon
  rationale: Sa pormula ng pagpepetsa ayon sa paghahari, idiomatiko sa Tagalog ang “sa ... taon” at tumpak nitong ipinahahayag ang Hebreong pariralang may ל.
- source_word: לְמַלְכוּת אָסָא
  choice: ng paghahari ni Asa
  rationale: Dito ang מַלְכוּת ay tumutukoy sa panahon ng pamumuno bilang hari. Ang “paghahari ni Asa” ay natural, malinaw, at hindi nagdaragdag ng interpretasyong wala sa teksto.
