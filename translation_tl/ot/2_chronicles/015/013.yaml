base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/013.yaml
  text: And everyone who would not seek Yahweh[a], the God of Israel, was to be put to death, from small to great[b], from man to woman.
translation:
  language: tl
  text: At ang sinumang hindi hahanap sa PANGINOON[a], ang Diyos ng Israel, ay papatayin, mula sa mababa hanggang sa mataas[b], lalaki man o babae.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “hindi humahanap sa PANGINOON.” Ang Hebreong pandiwa ay maaari ring isaling “hindi naghanap,” ngunit sa konteksto ng itinakda sa panata ng tipan, ang “hindi hahanap” ay nagpapakita ng puwersang modal o pangkondisyon.
    reason: lexical_alternative
  - marker: b
    text: O “mula sa pinakamababa hanggang sa pinakadakila.” Ang idyomang Hebreo ay nagpapahayag na saklaw ang buong pamayanan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֹל אֲשֶׁר
  choice: At ang sinumang
  rationale: Likas sa makabagong Tagalog ang “sinumang” at pinananatili nito ang saklaw na sumasaklaw sa bawat taong tinutukoy.
- source_word: לֹא יִדְרֹשׁ
  choice: ayaw hanapin
  rationale: Sa konteksto ng panata ng tipan, ang di-ganap na pandiwa ay may boluntaryo o modal na diwa, hindi lamang simpleng nakaraang kilos. Ang “hanapin” ay angkop sa paulit-ulit na pananalita ng Mga Cronica tungkol sa paglapit at pagtatalaga sa Diyos.
- source_word: לַיהוָה
  choice: ang PANGINOON
  rationale: Ginagamit ang nakaugaliang salin sa Tagalog para sa banal na pangalang יהוה, na minamarkahan sa malalaking titik.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ang Diyos ng Israel
  rationale: Tuwirang inililipat ang pariralang konstruktong tumutukoy sa Diyos bilang Diyos ng Israel.
- source_word: יוּמָת
  choice: ay papatayin
  rationale: 'Ang Hophal ng מות ay pasibo at causative: ipapataw ang kamatayan sa tao. Ang “papatayin” ay malinaw at pinananatili ang legal na bigat ng kaparusahan.'
- source_word: לְמִן קָטֹן וְעַד גָּדוֹל
  choice: mula sa mababa hanggang sa mataas
  rationale: Pinananatili nito ang Hebreong pares na maaaring tumukoy sa katayuan o kahalagahan, nang hindi nililimitahan ang kahulugan sa edad.
- source_word: לְמֵאִישׁ וְעַד אִשָּׁה
  choice: lalaki man o babae
  rationale: Natural na Tagalog ito para sa distributibong pares at malinaw na ipinahahayag ang kabuuang saklaw sa parehong lalaki at babae.
theological_decisions:
- issue: Ang mabigat na kaparusahan sa panata ng tipan
  choice: 'Panatilihin ang tahasang kaparusahang kamatayan: “ay papatayin.”'
  alternative: Palambutin bilang “ay mamamatay” o ipakahulugang pagtitiwalag o sumpa lamang.
  rationale: Malinaw na pasibo/causative ang יוּמָת at tumutukoy sa pagpapataw ng kamatayan. Hindi dapat pagaanin o palawakin ng salin ang iniulat na tuntunin.
- issue: Ang diwa ng לֹא יִדְרֹשׁ sa kontekstong legal at tipan
  choice: “ayaw hanapin”
  alternative: “hindi humahanap” o “hindi naghanap”
  rationale: Ang anyong pandiwa sa tuntunin ng panata ay maaaring magpahiwatig ng pagtanggi o kawalan ng kaloobang hanapin ang PANGINOON; pinananatili ng salin ang diwang ito habang itinatala sa talababa ang mas payak na alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “ayaw hanapin” upang maipakita ang modal/boluntaryong diwa ng tuntunin, at ang “lalaki man o babae” bilang mas natural na Tagalog kaysa sa literal na “mula sa lalaki hanggang sa babae.”
