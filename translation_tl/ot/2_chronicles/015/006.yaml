  text: וְ/כֻתְּת֥וּ גוֹי בְּ/ג֖וֹי וְ/עִ֣יר בְּ/עִ֑יר כִּֽי אֱלֹהִ֥ים הֲמָמָ֖/ם בְּ/כָל צָרָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/006.yaml
  text: Nation was crushed by nation[a], and city by city, for God troubled them with every kind of distress.
translation:
  language: tl
  text: Nagkadurog-durog ang bansa laban sa kapwa bansa, at ang lungsod laban sa kapwa lungsod, sapagkat ginulo sila ng Diyos sa pamamagitan ng sari-saring kagipitan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “sapagkat nilito sila ng Diyos sa bawat uri ng kagipitan.”'
    reason: Ipinakikita ang mas tiyak na diwa ng המם bilang paglalagay sa kalituhan at ang posibleng mas literal na saklaw ng בְּכָל צָרָה.
lexical_decisions:
- source_word: וְכֻתְּתוּ
  choice: Nagkadurog-durog
  rationale: Ang Pual ng כתת ay nagsasaad na sila ay dinurog o winasak. Ang anyong maramihan ay tumutukoy sa mga bansa at lungsod na magkakasunod na binabanggit; natural sa Tagalog ang pandiwang hindi minamarkahan para sa bilang.
- source_word: גוֹי בְּגוֹי
  choice: ang bansa laban sa kapwa bansa
  rationale: Ang בְּ ay naglalarawan dito ng marahas na tunggalian. Pinananatili ng “laban sa kapwa bansa” ang distributibo at magkakatunggaling diwa nang hindi nagpapasok ng tiyak na bansang gumaganap bilang tuwirang tagawasak.
- source_word: וְעִיר בְּעִיר
  choice: at ang lungsod laban sa kapwa lungsod
  rationale: Kaagapay ito ng naunang parirala at pinananatili ang maigsi at distributibong paglalarawan ng alitan sa pagitan ng mga lungsod.
- source_word: כִּי
  choice: sapagkat
  rationale: Nagpapakilala ito ng dahilan ng naunang pagkawasak.
- source_word: אֱלֹהִים
  choice: ang Diyos
  rationale: Bagaman morpolohikal na maramihan ang anyo, isahan ang pandiwa at malinaw na tumutukoy ito sa Diyos.
- source_word: הֲמָמָם
  choice: ginulo sila
  rationale: Ang המם ay maaaring tumukoy sa paglalagay sa kaguluhan, kalituhan, o sindak. Ang “ginulo sila” ay natural at pinananatili ang aktibong pagkilos ng Diyos at ang hulaping layon na “sila.”
- source_word: בְּכָל צָרָה
  choice: sa pamamagitan ng sari-saring kagipitan
  rationale: Ang בְּ ay binasang instrumental, at ipinahahayag ng “sari-saring kagipitan” ang komprehensibong puwersa ng כָּל sa natural na Tagalog.
theological_decisions:
- issue: Ang ahensiya sa mga kapahamakan
  choice: 'Tahasang iniuugnay sa pagkilos ng Diyos ang kaguluhan: “ginulo sila ng Diyos.”'
  alternative: “Hinayaan sila ng Diyos na magulo” o ibang saling ginagawa lamang na pahintulot ang pagkilos.
  rationale: Aktibo ang pandiwang Hebreo at ang Diyos ang simuno. Kaya pinananatili ang tuwirang banal na ahensiya nang walang idinaragdag na paliwanag kung paano ito nauugnay sa pananagutan ng mga bansa.
- issue: Saklaw ng בְּכָל צָרָה
  choice: “sa pamamagitan ng sari-saring kagipitan”
  alternative: “sa bawat kagipitan” o “sa lahat ng kagipitan”
  rationale: Maaaring unawain ang parirala bilang instrumento o kalagayan. Pinili ang instrumental na pagbasa ayon sa ugnayan nito sa aktibong pandiwa, ngunit itinatala ang alternatibong posibilidad sa talababa.
translation_notes:
  register: Makabago at marangal na Filipino. Ginamit ang “kapwa bansa/lungsod” upang malinaw ang distributibong tunggalian, at “kagipitan” upang maipahayag ang צָרָה nang hindi masyadong kolokyal.
