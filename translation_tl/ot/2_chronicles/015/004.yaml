id: 2CH.15.4
reference: 2 Chronicles 15:4
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יָּ֨שָׁב֙ בַּ/צַּר ל֔/וֹ עַל יְהוָ֖ה אֱלֹהֵ֣י יִשְׂרָאֵ֑ל וַ/יְבַקְשֻׁ֖/הוּ וַ/יִּמָּצֵ֥א לָ/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/004.yaml
  text: But in their distress they returned to Yahweh[a], the God of Israel, and sought him[b], and he was found by them.
translation:
  language: tl
  text: Ngunit sa kanilang kagipitan[a], nanumbalik sila kay Yahweh, ang Diyos ng Israel. Hinanap nila siya, at siya’y natagpuan nila.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa mas pormal na anyo ng Hebreo: “sa kanyang kagipitan,” kung saan ang isahan ay kolektibong tumutukoy sa Israel.'
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring isalin: “hinayaan niyang matagpuan nila siya.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: nanumbalik sila
  rationale: Ang שׁוּב ay nangangahulugang bumalik o manumbalik. Sa kontekstong ito, ipinahihiwatig nito ang muling pagbaling ng Israel sa Diyos; ang “nanumbalik” ay likas at marangal sa Filipino.
- source_word: בַּצַּר לוֹ
  choice: sa kanilang kagipitan
  rationale: Ang צַר ay tumutukoy sa kagipitan o matinding kalagayan. Bagaman isahan ang hulaping לוֹ, kolektibo ang tinutukoy nitong Israel, gaya ng ipinakikita ng kasunod na mga anyong maramihan.
- source_word: עַל יְהוָה
  choice: kay Yahweh
  rationale: Kasama ng שׁוּב, ang עַל ay nagpapahayag ng pagbaling o pagbabalik sa isang persona. Ang “kay” ang natural na katumbas nito sa Filipino.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos sa pamamagitan ng karaniwang transliterasyong “Yahweh,” sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ang Diyos ng Israel
  rationale: Tuwirang isinasalin ang construct chain at pinananatili ang pagkakakilanlan ni Yahweh bilang Diyos ng Israel.
- source_word: וַיְבַקְשֻׁהוּ
  choice: Hinanap nila siya
  rationale: Ang בקשׁ na may personal na layon ay nangangahulugang hanapin ang isang persona. Dito, tumutukoy ito sa taimtim na paglapit sa Diyos at paghingi ng kanyang tulong.
- source_word: וַיִּמָּצֵא לָהֶם
  choice: siya’y natagpuan nila
  rationale: Pinananatili nito ang pasibong diwa ng Niphal na “natagpuan,” nang hindi ipinapasok sa pangunahing teksto ang mas tiyak na pagpapakahulugang sadyang hinayaan ng Diyos na matagpuan siya.
theological_decisions:
- issue: Kolektibong isahan sa pambungad na sugnay
  choice: 'Isinalin bilang maramihan: “sa kanilang kagipitan, nanumbalik sila”'
  alternative: “Sa kanyang kagipitan, nanumbalik siya”
  rationale: Ang isahang anyo ay tumutukoy sa Israel bilang isang kolektibong bayan, samantalang maramihan ang kasunod na mga pandiwa at panghalip. Mas malinaw at natural sa Filipino ang maramihang anyo, habang itinatala sa talababa ang pormal na anyo ng Hebreo.
- issue: Pagiging matagpuan ng Diyos sa וַיִּמָּצֵא לָהֶם
  choice: “siya’y natagpuan nila”
  alternative: “hinayaan niyang matagpuan nila siya”
  rationale: Ang pangunahing salin ay nananatiling malapit sa pasibong anyo ng Hebreo at hindi tahimik na nilulutas kung gaano kalinaw na ipinahihiwatig rito ang aktibong pagpapahintulot ng Diyos. Inilalagay sa talababa ang posibleng pagpapahayag ng banal na pagkukusa.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “nanumbalik” upang ipahayag ang muling pagbaling sa Diyos, at pinanatili ang “Yahweh” bilang personal na pangalan. Iniwasan ang sobrang pagpapaliwanag sa pangunahing teksto; ang kolektibong isahan at ang posibleng banal na pagkukusa sa “natagpuan” ay nilinaw sa mga talababa.
