  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יִּשְׂמְח֨וּ כָל יְהוּדָ֜ה עַל הַ/שְּׁבוּעָ֗ה כִּ֤י בְ/כָל לְבָבָ/ם֙ נִשְׁבָּ֔עוּ וּ/בְ/כָל רְצוֹנָ֣/ם בִּקְשֻׁ֔/הוּ וַ/יִּמָּצֵ֖א לָ/הֶ֑ם וַ/יָּ֧נַח יְהוָ֛ה לָ/הֶ֖ם מִ/סָּבִֽיב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/015.yaml
  text: And all Judah rejoiced over the oath[a], because they had sworn with all their heart and sought him with all their will, and he let himself be found by them, and Yahweh gave them rest all around.
translation:
  language: tl
  text: Nagalak ang buong Juda dahil sa panunumpa, sapagkat nanumpa sila nang buong puso at hinanap siya nang buong kalooban. Natagpuan nila siya[a], at binigyan sila ni Yahweh ng kapahingahan sa buong paligid.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Hinayaan niyang matagpuan nila siya.”
    reason: interpretive_alternative
lexical_decisions:
- source_word: וַיִּשְׂמְחוּ כָל־יְהוּדָה
  choice: Nagalak ang buong Juda
  rationale: Pinananatili ang kolektibong pagtukoy sa bayan ng Juda at ang malinaw na diwa ng sama-samang kagalakan.
- source_word: עַל הַשְּׁבוּעָה
  choice: dahil sa panunumpa
  rationale: Sa konteksto ng pandiwang nagsasaad ng damdamin, ipinakikita ng עַל ang dahilan o pinagtutuunan ng kanilang kagalakan.
- source_word: בְכָל לְבָבָם נִשְׁבָּעוּ
  choice: nanumpa sila nang buong puso
  rationale: Natural na salin sa Filipino ng Hebreong pahayag tungkol sa taos-pusong panunumpa.
- source_word: וּבְכָל רְצוֹנָם בִּקְשֻׁהוּ
  choice: at hinanap siya nang buong kalooban
  rationale: Ang “buong kalooban” ay likas at marangal na Filipino para sa kusang-loob at ganap na pagnanais na ipinahihiwatig ng רָצוֹן, habang pinananatili ang paralelismo sa “buong puso.”
- source_word: וַיִּמָּצֵא לָהֶם
  choice: Hinayaan niyang matagpuan nila siya
  rationale: Ipinahahayag ang relasyonal na diwa ng Niphal sa kontekstong tumugon ang Diyos sa kanilang paghahanap, habang inilalagay sa talababa ang mas literal na anyo.
- source_word: וַיָּנַח יְהוָה לָהֶם
  choice: binigyan sila ni Yahweh ng kapahingahan
  rationale: Ang Hiphil ng נוח ay nangangahulugang magbigay o magdulot ng kapahingahan; ang pagkakasaling ito ay malinaw at angkop sa tema ng salaysay.
- source_word: מִסָּבִיב
  choice: sa buong paligid
  rationale: Natural na pahayag sa modernong Filipino para sa kapahingahang natamo sa lahat ng panig.
theological_decisions:
- issue: Paglalarawan sa tugon ng Diyos sa paghahanap sa kaniya
  choice: Hinayaan niyang matagpuan nila siya
  alternative: Natagpuan nila siya
  rationale: Ipinakikita ng pangunahing salin ang posibleng pahintulot o kusang pagpapakilala ng Diyos nang hindi itinatangging passive ang anyong Hebreo; pinananatili sa talababa ang mas literal na pagbasa.
- issue: Pagkasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehova
  rationale: Ginagamit ang personal na pangalang nasa tekstong Hebreo sa halip na palitan ito ng isang titulo.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang “buong Juda” bilang maikli at karaniwang kolektibong tawag sa bayan, at “buong kalooban” upang mapanatili ang paralelismo at kusang-loob na paghahangad.
