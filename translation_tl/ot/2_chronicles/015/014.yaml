  yaml_path: translation/ot/2_chronicles/015/014.yaml
  text: And they swore to Yahweh with a loud voice[a], with shouting, and with trumpets and horns.
translation:
  language: tl
  text: Sumumpa sila kay Yahweh sa malakas na tinig, na may sigawan at mga trumpeta at mga sungay[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: “mga shofar,” mga instrumentong sungay, karaniwang mula sa sungay ng lalaking tupa; iba ang mga ito sa “mga trumpeta” na binanggit bago nito.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׁבְעוּ
  choice: Sumumpa sila
  rationale: Ang Niphal ng שׁבע ay tumutukoy sa panunumpa. Ang “sumumpa sila” ay likas at tuwirang Filipino at pinananatili ang pormal na diwa ng tipan.
- source_word: לַיהוָה
  choice: kay Yahweh
  rationale: Ipinakikita ng pang-ukol kung kanino ginawa ang panunumpa. Pinanatili ang personal na pangalang Yahweh para sa יהוה.
- source_word: בְּקוֹל גָּדוֹל
  choice: nang malakas ang tinig
  rationale: Ang parirala ay idyoma para sa malakas na pagsasalita o pagbigkas; natural itong pakinggan sa modernong Filipino at hindi ginagawang literal na “dakilang tinig.”
- source_word: וּבִתְרוּעָה
  choice: na may sigawan
  rationale: Maaaring tumukoy ang תְּרוּעָה sa malakas na sama-samang sigaw o paghiyaw. Hindi tinukoy bilang sigaw ng digmaan o tuwa upang mapanatili ang lawak ng kahulugan sa konteksto.
- source_word: וּבַחֲצֹצְרוֹת
  choice: may mga trumpeta
  rationale: Ang חֲצֹצְרוֹת ay mga tuwid na metal na trumpeta na ginagamit sa pagsamba at pagtitipon ng Israel; malinaw at karaniwan ang “mga trumpeta.”
- source_word: וּבְשׁוֹפָרוֹת
  choice: mga tambuli
  rationale: Ang שׁוֹפָרוֹת ay mga instrumentong sungay na naiiba sa mga metal na trumpeta. Ang “tambuli” ay madaling maunawaan sa Filipino at pinananatili ang pagkakaibang iyon; nililinaw ng talababa ang terminong Hebreo.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang ginagamit sa talata ang Tetragrammaton. Ang “Yahweh” ay nagpapanatili sa pangalang tipan sa halip na palitan ito ng isang titulo.
translation_notes:
  register: Modernong Filipino na may marangal at malinaw na himig. Pinanatili ang magkakahiwalay na malakas na tinig, sigawan, trumpeta, at tambuli nang hindi ipinapalagay kung ang sigawan ay pandigma o masayang pagbubunyi. Inilipat ang marker [a] sa “mga tambuli,” sapagkat iyon ang salitang tinutukoy ng talababa.
