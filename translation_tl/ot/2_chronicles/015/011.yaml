base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/011.yaml
  text: 'On that day they sacrificed to Yahweh from the spoil they had brought: seven hundred cattle and seven thousand sheep[a][b].'
translation:
  language: tl
  text: 'Sa araw na iyon, naghain sila kay Yahweh mula sa samsam[a] na dinala nila: pitong daang baka at pitong libong tupa[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “mga bagay na nasamsam.” Ang salitang Hebreo ay tumutukoy sa mga ari-ariang nakuha bilang samsam sa digmaan.
    reason: lexical_alternative
  - marker: b
    text: Ang salitang Hebreo ay maaari ring tumukoy nang mas malawak sa maliliit na alagang hayop—mga tupa at kambing—hindi lamang sa mga tupa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְבְּחוּ
  choice: inihandog nila
  rationale: Sa kontekstong panrelihiyon, ang זבח ay tumutukoy sa paghahandog ng hayop bilang hain. Likas at malinaw sa modernong Tagalog ang “inihandog nila.”
- source_word: לַיהוָה
  choice: kay Yahweh
  rationale: Tinutukoy ng ל ang pinag-uukulan ng hain, at pinananatili ng “Yahweh” ang personal na pangalang יהוה.
- source_word: בַּיּוֹם הַהוּא
  choice: Sa araw na iyon
  rationale: Likas na panandang pamanahon ito sa modernong Tagalog.
- source_word: מִן הַשָּׁלָל
  choice: mula sa samsam
  rationale: Ang שָׁלָל ay mga ari-ariang nakuha sa digmaan. Ang “samsam” ay maikli, dignified, at wastong katumbas sa Tagalog.
- source_word: הֵבִיאוּ
  choice: na dinala nila
  rationale: Pinananatili nito ang tahasang kilos ng pagdadala nang hindi labis na tinutukoy ang eksaktong ugnayang pamanahon.
- source_word: בָּקָר
  choice: baka
  rationale: Ang בָּקָר ay kolektibong tawag sa mga bovine; ang “baka” ang karaniwan at malawak na katumbas sa Tagalog.
- source_word: שְׁבַע מֵאוֹת
  choice: pitong daan
  rationale: Tuwirang salin ng bilang.
- source_word: וְצֹאן
  choice: at ... tupa
  rationale: Ang “tupa” ay natural na pangunahing salin, habang inilalahad sa talababa ang mas malawak na posibilidad na kabilang ang mga kambing.
- source_word: שִׁבְעַת אֲלָפִים
  choice: pitong libo
  rationale: Tuwirang salin ng bilang.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Personal na pangalang יהוה ang tahasang ginamit sa tekstong Hebreo. Pinananatili ng “Yahweh” ang pangalang tipan nang hindi ito pinapalitan ng titulo.
translation_notes:
  register: 'Modernong Filipino Tagalog na malinaw, dignified, at angkop sa pampublikong pagbasa. Ginamit ang pokus na “ang inihandog ... ay” upang natural na mapanatili ang pagkakasunod ng Hebreo: ang pinagmulan ng hain bago ang bilang ng mga hayop.'
