  text: וַ/עֲזַרְיָ֨הוּ֙ בֶּן עוֹדֵ֔ד הָיְתָ֥ה עָלָ֖י/ו ר֥וּחַ אֱלֹהִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/001.yaml
  text: The Spirit of God came upon Azariah son of Oded[a].
translation:
  language: tl
  text: Dumating kay Azarias na anak ni Oded ang Espiritu ng Diyos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Ang Espiritu ng Diyos ay nasa ibabaw ni Azarias na anak ni Oded.”
    reason: Pinananatili ng alternatibo ang mas literal at maaaring estadong kahulugan ng הָיְתָה עָלָיו, sa halip na ang pangyayaring “dumating kay.”
lexical_decisions:
- source_word: וַ/עֲזַרְיָהוּ
  choice: kay Azarias
  rationale: Ginamit ang nakaugaliang anyong Filipino ng pangalang Azariah. Hindi isinalin nang hiwalay ang prefiks na וַ bilang “At” sapagkat sapat nang naipagpapatuloy ng konteksto ang salaysay at magiging mas natural ang pangungusap sa modernong Filipino.
- source_word: בֶּן עוֹדֵד
  choice: na anak ni Oded
  rationale: Ang בֶּן ay tumutukoy rito sa tuwirang ugnayan ng ama at anak; walang pahiwatig sa konteksto na mas malawak na “inapo” ang ibig sabihin.
- source_word: הָיְתָה עָלָיו
  choice: Dumating kay
  rationale: Sa kontekstong propetiko, ang literal na “nasa ibabaw niya” ay maaaring magpahayag ng pagdating ng Espiritu upang magbigay-inspirasyon o kapangyarihan. Pinili ang natural at pangyayaring pagbasa, habang inilagay sa talababa ang mas literal at estadong alternatibo.
- source_word: רוּחַ אֱלֹהִים
  choice: ang Espiritu ng Diyos
  rationale: Sa kontekstong ito, tumutukoy ang parirala sa Espiritu ng Diyos na nagbibigay ng propetikong kapangyarihan kay Azarias. Ang tiyak na anyong “ang Espiritu ng Diyos” ang pinakanatural sa Filipino at angkop sa diwa ng konstruktong Hebreo.
theological_decisions:
- issue: Kung ang רוּחַ אֱלֹהִים ay isasaling “isang espiritu mula sa Diyos” o “ang Espiritu ng Diyos”
  choice: ang Espiritu ng Diyos
  alternative: isang espiritu mula sa Diyos; isang banal na espiritu
  rationale: Ipinakikilala ng pormula sa konteksto ang propetikong pagkilos at pagbibigay-kapangyarihan ng Diyos sa isang tiyak na tao. Pinananatili ng “ang Espiritu ng Diyos” ang malamang na kahulugan ng Hebreo nang hindi nagdaragdag ng doktrinang hindi tahasang sinasabi ng talata.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Inuna ang pandiwa upang maging natural ang daloy at maiwasan ang mabigat na konstruksyon. Ginamit ang mga nakaugaliang anyong Filipino na “Azarias” at “Oded.”
