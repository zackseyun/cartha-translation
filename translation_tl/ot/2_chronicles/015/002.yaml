base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/002.yaml
  text: 'He went out to meet Asa and said to him[a], “Hear me, Asa, and all Judah and Benjamin: Yahweh is with you while you are with him. If you seek him, he will be found by you; but if you forsake him, he will forsake you.”'
translation:
  language: tl
  text: 'Lumabas siya upang salubungin si Asa at sinabi rito, “Pakinggan ninyo ako, Asa, at kayong buong Juda at Benjamin: Si Yahweh ay kasama ninyo habang kayo ay kasama niya. Kung hahanapin ninyo siya, matatagpuan ninyo siya; ngunit kung iiwan ninyo siya, iiwan niya kayo.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּצֵא לִפְנֵי אָסָא
  choice: Lumabas siya upang salubungin si Asa
  rationale: Ang יצא ay karaniwang ‘lumabas,’ at sa konteksto ng pagkilos, ang לִפְנֵי אָסָא ay likas na tumutukoy sa paglabas upang salubungin si Asa.
- source_word: שְׁמָעוּנִי
  choice: Pakinggan ninyo ako
  rationale: Pautos na maramihan ito na may panghalip na unang panauhan; malinaw at tuwiran ang ‘Pakinggan ninyo ako’ sa makabagong Tagalog.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
- source_word: עִמָּכֶם ... עִמּוֹ
  choice: Kasama ninyo ... kasama niya kayo
  rationale: Pinananatili ang pag-uulit ng עם at ang retorikal na pagtutumbasan ng dalawang sugnay, habang gumagamit ng likas na ayos sa Tagalog.
- source_word: בִּהְיוֹתְכֶם
  choice: habang kasama niya kayo
  rationale: Ang infinitive construct na may ב ay nagpapahayag ng kasabay at nagpapatuloy na kalagayan; ang ‘habang’ angkop sa ganitong ugnayan.
- source_word: תִּדְרְשֻׁהוּ
  choice: hahanapin ninyo siya
  rationale: Sa kontekstong panrelihiyon at pangtipan, ang דרש ay nangangahulugang taimtim na hanapin ang Diyos, hindi lamang magtanong sa kaniya.
- source_word: יִמָּצֵא לָכֶם
  choice: hahayaan niyang matagpuan ninyo siya
  rationale: Ang Niphal ng מצא ay ‘matagpuan.’ Ipinahihiwatig ng saling ito ang anyong pasibo/reflexive at ang kusang pagpapakilala ng Diyos nang hindi ginagawang simpleng aktibong ‘mahahanap ninyo siya.’
- source_word: תַּעַזְבֻהוּ ... יַעֲזֹב אֶתְכֶם
  choice: kung iiwan ninyo siya, iiwan niya kayo
  rationale: Ang pag-uulit ng ‘iiwan’ ay nagpapanatili sa parehong pandiwang עזב at sa sinadyang pagtutumbasan ng Hebreo.
theological_decisions:
- issue: Kondisyonal na pagtutumbasan sa wikang pangtipan
  choice: Tuwirang pinanatili na kasama nila si Yahweh habang kasama niya sila, at may magkatugmang bunga ang paghahanap o pag-iwan sa kaniya.
  alternative: Palambutin ang mga pahayag bilang karanasan lamang at hindi tunay na kondisyonal na pananalita.
  rationale: Malinaw ang mga kondisyon at pagtutumbasan sa Hebreo. Hindi nilulutas ng salin ang mas malawak na usaping teolohikal tungkol sa pagtitiis o pagtalikod.
- issue: Pagiging matatagpuan ng Diyos
  choice: hahayaan niyang matagpuan ninyo siya
  alternative: matatagpuan ninyo siya
  rationale: Pinananatili ng pangunahing salin ang pasibo/reflexive na anyo ng Hebreo at ang pahiwatig na ang Diyos ang nagpapahintulot na siya ay matagpuan; ibinibigay sa talababa ang mas payak na pagbasa.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang maramihang ‘ninyo/kayo’ dahil kinausap ang hari kasama ang buong Juda at Benjamin; pinanatili rin ang maikli at mariing himig ng pahayag ng propeta.
