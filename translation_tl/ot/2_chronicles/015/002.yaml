  to: 'Lumabas siya upang salubungin si Asa at sinabi rito, “Pakinggan ninyo ako, Asa, at kayong buong Juda at Benjamin: Si Yahweh ay kasama ninyo habang kayo ay kasama niya. Kung hahanapin ninyo siya, matatagpuan ninyo siya; ngunit kung iiwan ninyo siya, iiwan niya kayo.”'
