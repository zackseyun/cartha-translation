reference: 2 Chronicles 15:8
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/כִ/שְׁמֹ֨עַ אָסָ֜א הַ/דְּבָרִ֣ים הָ/אֵ֗לֶּה וְ/הַ/נְּבוּאָה֮ עֹדֵ֣ד הַ/נָּבִיא֒ הִתְחַזַּ֗ק וַ/יַּעֲבֵ֤ר הַ/שִּׁקּוּצִים֙ מִ/כָּל אֶ֤רֶץ יְהוּדָה֙ וּ/בִנְיָמִ֔ן וּ/מִן הֶ֣/עָרִ֔ים אֲשֶׁ֥ר לָכַ֖ד מֵ/הַ֣ר אֶפְרָ֑יִם וַ/יְחַדֵּשׁ֙ אֶת מִזְבַּ֣ח יְהוָ֔ה אֲשֶׁ֕ר לִ/פְנֵ֖י אוּלָ֥ם יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/008.yaml
  text: And when Asa heard these words and the prophecy of Oded the prophet[a], he took courage and removed the detestable things from all the land of Judah and Benjamin, and from the cities that he had captured in the hill country of Ephraim; and he renewed the altar of Yahweh that was before the vestibule of Yahweh.
translation:
  language: tl
  text: Nang marinig ni Asa ang mga salitang ito at ang propesiya ni Oded na propeta[a], nagkalakas siya ng loob. Inalis niya ang mga karima-rimarim na bagay sa buong lupain ng Juda at Benjamin, pati sa mga lunsod na nasakop niya sa kaburulan ng Efraim. Pinanibago niya ang altar ni Yahweh na nasa harap ng bulwagan ni Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo: “ang propesiya ni Oded na propeta.” Inuugnay ito ng ilang tagapagpaliwanag at talakayang tekstuwal kay Azarias na anak ni Oded sa nakapaligid na konteksto.'
    reason: textual_variant
lexical_decisions:
- source_word: וְכִשְׁמֹעַ
  choice: Nang marinig
  rationale: Likas na temporal na sugnay sa Tagalog na tapat sa diwa ng infinitive construct na may כְּ.
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: ang mga salitang ito
  rationale: Tumutukoy sa mensaheng kababanggit lamang, kaya mas angkop ang “mga salita” kaysa “mga bagay.”
- source_word: וְהַנְּבוּאָה
  choice: at ang propesiya
  rationale: Pinananatili ang tahasang katawagang tumutukoy sa pahayag na propetiko.
- source_word: עֹדֵד הַנָּבִיא
  choice: ni Oded na propeta
  rationale: Direktang sinusunod ang WLC/MT at hindi inihaharmonisa sa pagkakakilanlan kay Azarias sa nakapaligid na konteksto.
- source_word: הִתְחַזַּק
  choice: nagkalakas siya ng loob
  rationale: Natural na Filipino para sa reflexive na diwang siya ay tumatag o lumakas ang loob bilang tugon sa mensahe.
- source_word: וַיַּעֲבֵר הַשִּׁקּוּצִים
  choice: Inalis niya ang mga karima-rimarim na bagay
  rationale: Ipinahahayag ng “inalis” ang resultang causative sa konteksto; ang “karima-rimarim na bagay” ay nagpapanatili sa malakas na pagkasuklam at hindi labis na nagpapakitid sa mga ito bilang mga rebulto lamang.
- source_word: מִכָּל אֶרֶץ יְהוּדָה וּבִנְיָמִן
  choice: sa buong lupain ng Juda at Benjamin
  rationale: Ang “lupain” ay malinaw na tumutukoy sa nasasakupang teritoryo.
- source_word: וּמִן הֶעָרִים אֲשֶׁר לָכַד מֵהַר אֶפְרָיִם
  choice: pati sa mga lunsod na nasakop niya sa kaburulan ng Efraim
  rationale: Ang “nasakop” ay angkop sa לכד, at malinaw na heograpikong pagbasa ng מֵהַר ang “sa kaburulan,” habang kinikilalang maaari rin itong unawaing “mula sa kaburulan.”
- source_word: וַיְחַדֵּשׁ
  choice: Ipinaayos niyang muli
  rationale: Sa konteksto ng altar, natural itong nagpapahiwatig ng pagpapanumbalik o pagkukumpuni, habang taglay pa rin ang diwa ng muling pagpapabago.
- source_word: מִזְבַּח יְהוָה
  choice: ang altar ni Yahweh
  rationale: Natural na anyong paari sa Filipino at pinananatili ang banal na pangalan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang transliterasyon ng Tetragrammaton bilang personal na pangalan, hindi pagpapalit nito ng titulo.
- source_word: אֲשֶׁר לִפְנֵי אוּלָם יְהוָה
  choice: na nasa harap ng bulwagan ng templo ni Yahweh
  rationale: Ginagawang malinaw sa karaniwang mambabasa na ang אוּלָם ay ang bulwagan o portiko ng templo, at pinananatili ang relasyong panlunan na “nasa harap.”
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Ang Hebreo ay tahasang gumagamit ng Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalan nang hindi ito pinapalitan ng isang titulo.
- issue: Tekstuwal na tensiyon sa “Oded na propeta”
  choice: Isalin sa pangunahing teksto ang pagbasa ng WLC/MT na “Oded na propeta”
  alternative: Iharmonisa bilang “Azarias na anak ni Oded” batay sa nakapaligid na konteksto
  rationale: Ang ibinigay na tekstong Hebreo ay bumabasa ng עֹדֵד הַנָּבִיא. Hindi dapat tahimik na baguhin ang teksto upang lutasin ang tensiyon; inilalahad sa talababa ang kontekstuwal na suliranin.
- issue: Saklaw ng שִׁקּוּצִים
  choice: mga karima-rimarim na bagay
  alternative: mga diyus-diyosan; mga kasuklam-suklam na bagay
  rationale: May malinaw na kontekstong panrelihiyon at idolatriko, ngunit ang mas malawak na salin ay hindi naglilimita sa tinutukoy sa isang uri lamang ng kultikong kagamitan.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “lunsod,” “kaburulan,” at “bulwagan ng templo” upang maging malinaw nang hindi nagiging sobrang teknikal. Ang banal na pangalan ay isinaling “Yahweh.”
