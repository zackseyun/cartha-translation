  yaml_path: translation/ot/2_chronicles/015/007.yaml
  text: But as for you[a], be strong, and do not let your hands grow weak, for there is a reward for your work.
translation:
  language: tl
  text: Ngunit kayo, magpakatatag at huwag manghina ang inyong mga kamay,[a] sapagkat may gantimpala para sa inyong gawain.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “huwag lumaylay ang inyong mga kamay.” Ang idyomang Hebreo ay tumutukoy sa pagkawala ng lakas, tibay ng loob, o sigasig sa pagkilos.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַתֶּם
  choice: Ngunit kayo
  rationale: Ang pangatnig at nakahiwalay na panghalip ay nagbibigay ng mariing paghahambing sa naunang konteksto. Likas sa modernong Tagalog ang “Ngunit kayo” bilang panimulang pagtutuon sa mga kinakausap.
- source_word: חִזְקוּ
  choice: magpakatatag kayo
  rationale: Ang maramihang pautos mula sa חזק ay panawagan na maging malakas at matibay ang loob. Mas natural at marangal sa Tagalog ang “magpakatatag” kaysa sa literal na “maging malakas” sa ganitong konteksto.
- source_word: וְ/אַל יִרְפּוּ יְדֵי/כֶם
  choice: at huwag ninyong hayaang manghina ang inyong mga kamay
  rationale: Pinananatili ang larawang Hebreo ng mga kamay na nanghihina, habang malinaw na ipinapahayag ang pagbabawal. Ang idyoma ay tumutukoy sa pagkawala ng lakas, tatag ng loob, o sigasig sa pagkilos.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala nito ang dahilan ng naunang utos; ang “sapagkat” ay angkop sa marangal ngunit madaling maunawaang rehistro.
- source_word: יֵשׁ
  choice: may
  rationale: Tuwirang isinasalin ang eksistensiyal na pahayag nang hindi ito ginagawang tahasang panghinaharap.
- source_word: שָׂכָר
  choice: gantimpala
  rationale: Saklaw nito ang gantimpala o kabayaran nang hindi nililimitahan ang diwa sa upa o sahod lamang.
- source_word: לִ/פְעֻלַּתְ/כֶם
  choice: ang inyong gawain
  rationale: Ang פְעֻלָּה ay tumutukoy sa gawain, paggawa, o bunga ng pagkilos. Ang “inyong gawain” ay natural at sapat na kongkreto sa Tagalog.
theological_decisions:
- issue: Kalikasan ng ipinangakong kabayaran
  choice: sapagkat may gantimpala ang inyong gawain
  alternative: sapagkat gagantimpalaan ang inyong gawain
  rationale: Pinananatili ng salin ang eksistensiyal na anyo ng Hebreo at ang tuwirang pangako ng kabayaran, nang hindi nagpapasok ng mas malawak na doktrina tungkol sa merito, kaligtasan, o pagpapawalang-sala.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Pinanatili ang konkretong idyoma ng “mga kamay” at nilinaw sa talababa ang matalinghagang saklaw nito.
