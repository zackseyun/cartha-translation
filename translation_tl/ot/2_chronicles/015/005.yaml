  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang Hebreong idyoma sa pangunahing teksto at ipinaliwanag ito sa talababa; iniwasan ang labis na literal na “nasa ibabaw” upang maging natural ang sanhi at epekto sa Tagalog.
