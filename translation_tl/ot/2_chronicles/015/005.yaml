base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/005.yaml
  text: And in those times there was no peace for the one going out or for the one coming in[b][a], because many disturbances were upon all the inhabitants of the lands.
translation:
  language: tl
  text: Noong mga panahong iyon, walang kapayapaan para sa lumalabas o sa pumapasok[b], sapagkat maraming kaguluhan[a] ang sumapit sa lahat ng naninirahan sa mga lupain.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “matitinding kaguluhan.” Ang salitang Hebreo ay maaaring tumukoy sa kaguluhan, kalituhan, o sindak.
    reason: lexical_alternative
  - marker: b
    text: Ang pananalitang “lumalabas o pumapasok” ay isang idyomang Hebreo para sa karaniwang paggalaw sa araw-araw, lalo na sa paglalakbay o pampublikong gawain.
    reason: cultural_note
lexical_decisions:
- source_word: וּבָעִתִּים הָהֵם
  choice: At nang mga panahong iyon
  rationale: Pinananatili ang pangmaramihang עִתִּים at ang demonstratibong הָהֵם sa isang natural na panandang temporal sa Tagalog.
- source_word: אֵין שָׁלוֹם
  choice: walang kapayapaan
  rationale: Malawak ang saklaw ng שָׁלוֹם—kapayapaan, kaligtasan, at maayos na kalagayan. Pinananatili ng “kapayapaan” ang lawak nito, habang nililinaw ng kasunod na parirala ang kawalan ng seguridad.
- source_word: לַיּוֹצֵא וְלַבָּא
  choice: para sa lumalabas o sa pumapasok
  rationale: Ang mga participle ay isahan ngunit pangkalahatan. Pinananatili ng salin ang pares na idyomatikong Hebreo; natural ang “o” sa negatibong pangungusap sa Tagalog.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala nito ang dahilan kung bakit walang kapayapaan.
- source_word: מְהוּמֹת רַבּוֹת
  choice: maraming kaguluhan
  rationale: Ang מְהוּמָה ay maaaring tumukoy sa kaguluhan, kalituhan, o sindak. Ang “maraming kaguluhan” ay malinaw at hindi nililimitahan ang salita sa iisang uri ng kaguluhan.
- source_word: עַל כָּל יוֹשְׁבֵי הָאֲרָצוֹת
  choice: ang sumapit sa lahat ng naninirahan sa mga lupain
  rationale: Ipinahahayag ng “sumapit sa” ang diwang ang mga kaguluhan ay dumating at dumagan sa mga tao, nang mas natural kaysa literal na “nasa ibabaw.” Pinananatili ang pangmaramihang הָאֲרָצוֹת bilang “mga lupain.”
