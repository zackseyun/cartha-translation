  language: tl
  text: at ang Zora, Ayalon, at Hebron, na nasa Juda at Benjamin—mga lunsod na may tanggulan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: צָרְעָה
  choice: Zora
  rationale: Pangalan ng lugar; ginamit ang natural na transliterasyong Filipino.
- source_word: אַיָּלוֹן
  choice: Ayalon
  rationale: Pangalan ng lugar; malapit sa bigkas ng Hebreo at madaling basahin sa Filipino.
- source_word: חֶבְרוֹן
  choice: Hebron
  rationale: Pinanatili ang nakaugaliang anyo ng pangalan sa Filipino.
- source_word: אֲשֶׁר
  choice: na nasa
  rationale: Likas na Filipino para sa sugnay na naglalarawan sa kinaroroonan ng mga lunsod.
- source_word: בִּיהוּדָה וּבְבִנְיָמִן
  choice: nasa Juda at Benjamin
  rationale: Ipinahahayag ang heograpiko o pantribong lokasyon nang hindi ipinapalagay na pag-aari ang tinutukoy.
- source_word: עָרֵי מְצֻרוֹת
  choice: mga lunsod na may tanggulan
  rationale: Malinaw at likas na salin ng mga lunsod na pinatibay para sa pagtatanggol.
- source_word: וְאֶת ... וְאֶת ... וְאֶת
  choice: at ... at ... at
  rationale: Ipinagpapatuloy nito ang talaan mula sa naunang talata; hindi isinasalin ang pantukoy sa tuwirang layon.
