base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/005.yaml
  text: Rehoboam lived in Jerusalem[a], and he built fortified cities in Judah.
translation:
  language: tl
  text: Nanirahan si Rehoboam sa Jerusalem, at nagtayo siya ng mga lungsod para sa pagtatanggol[a] sa Juda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga lungsod na tanggulan” o “mga lungsod na pinatibay.” Sa literal, “mga lungsod para sa depensa/pagpapatibay.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: Nanirahan
  rationale: Likas na modernong Tagalog para sa paninirahan o pagtira; hindi ipinahihiwatig ang pagsisimula ng paninirahan na maaaring ipahiwatig ng “nanirahang permanente” o “namalagi.”
- source_word: בִּירוּשָׁלִָם
  choice: sa Jerusalem
  rationale: Tuwirang pariralang panlunan, gamit ang karaniwang anyo ng pangalan sa Filipino.
- source_word: וַיִּבֶן
  choice: nagtayo
  rationale: Tumutugma sa pangunahing kahulugan ng בנה na “magtayo/magpatayo”; hindi ito tahasang ginawang “pinatibay,” sapagkat ang layuning pandepensa ay nasa kasunod na parirala.
- source_word: עָרִים
  choice: mga lungsod
  rationale: Karaniwang katumbas ng pangmaramihang עִיר at angkop sa heograpiyang pampamahalaan at pangmilitar ng salaysay.
- source_word: לְמָצוֹר
  choice: para sa pagtatanggol
  rationale: Ipinapahayag ang layuning pandepensa ng mga lungsod habang pinananatili ang lawak ng מָצוֹר, na maaaring tumukoy sa tanggulan, pagpapatibay, o depensang kaugnay ng pagkubkob.
- source_word: בִּיהוּדָה
  choice: sa Juda
  rationale: Tuwirang pariralang panlunan para sa rehiyong pinagtayuan ng mga lungsod.
