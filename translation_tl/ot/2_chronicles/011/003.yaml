  text: אֱמֹ֕ר אֶל רְחַבְעָ֥ם בֶּן שְׁלֹמֹ֖ה מֶ֣לֶךְ יְהוּדָ֑ה וְ/אֶל֙ כָּל יִשְׂרָאֵ֔ל בִּ/יהוּדָ֥ה וּ/בִנְיָמִ֖ן לֵ/אמֹֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/003.yaml
  text: Speak to Rehoboam son of Solomon[a], king of Judah, and to all Israel in Judah and Benjamin, saying,
translation:
  language: tl
  text: Sabihin mo kay Rehoboam na anak ni Solomon, hari ng Juda, at sa buong Israel na nasa Juda at Benjamin,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֱמֹר
  choice: Sabihin mo
  rationale: Ang pautos na anyo ng אמר ay nag-uutos na ihatid ang isang mensahe. Likas sa modernong Tagalog ang “Sabihin mo” kapag sinusundan ng kay na tumutukoy sa kausap.
- source_word: אֶל
  choice: kay / sa
  rationale: Karaniwang pang-ukol na tumutukoy sa mga tatanggap ng mensahe; “kay” ang likas para sa pangalang pantangi at “sa” para sa pangkat.
- source_word: רְחַבְעָם
  choice: Rehoboam
  rationale: Karaniwang anyong Filipino ng pangalan sa tradisyong biblikal.
- source_word: בֶּן שְׁלֹמֹה
  choice: na anak ni Solomon
  rationale: Tuwirang ipinapahayag ang ugnayang angkan at natural na nag-uugnay sa pangalan sa Tagalog.
- source_word: מֶלֶךְ יְהוּדָה
  choice: hari ng Juda
  rationale: Pinananatili ang titulong maharlika at ang kaugnayan nito sa Juda.
- source_word: וְאֶל כָּל יִשְׂרָאֵל
  choice: at sa buong Israel
  rationale: Pinananatili ang pambansa at tipanang katawagang “Israel” sa halip na gawing “mga Israelita.”
- source_word: בִּיהוּדָה וּבִנְיָמִן
  choice: na nasa Juda at Benjamin
  rationale: Ipinakikita ng ב ang kinaroroonan ng tinutukoy na Israel; nililinaw ng “na nasa” ang lokatibong diwa nang hindi ito ginagawang pagkakakilanlang pantribo lamang.
- source_word: לֵאמֹר
  choice: '[ipinakikita ng bantas na kuwit]'
  rationale: Ipinakikilala nito ang mismong nilalaman ng mensahe sa susunod na talata. Sa modernong Tagalog, sapat at mas natural ang kuwit bago ang kasunod na tuwirang pahayag kaysa sa tahasang “na sinasabi.”
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “Sabihin mo” bilang natural na utos, at pinanatili ang “buong Israel” upang huwag paliitin ang pambansa o tipanang katawagan. Ang talata ay sadyang nagtatapos sa kuwit dahil ipinagpapatuloy ng susunod na talata ang nilalaman ng mensahe.
