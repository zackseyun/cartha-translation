  text: וַ/יַּֽעֲמֵ֨ד לָ/רֹ֧אשׁ רְחַבְעָ֛ם אֶת אֲבִיָּ֥ה בֶֽן מַעֲכָ֖ה לְ/נָגִ֣יד בְּ/אֶחָ֑י/ו כִּ֖י לְ/הַמְלִיכֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/022.yaml
  text: And Rehoboam appointed Abijah son of Maacah as chief among his brothers[a], for he intended to make him king.
translation:
  language: tl
  text: Itinalaga ni Rehoboam si Abias na anak ni Maaca bilang pangunahing pinuno sa kanyang mga kapatid[a], sapagkat balak niya itong gawing hari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “nakatataas sa kanyang mga kapatid”; maaaring ipahiwatig ng pang-ukol sa Hebreo ang kanyang pagiging una o nakatataas kaugnay nila.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֵד
  choice: Itinalaga
  rationale: Ang Hiphil ng עמד ay tumutukoy rito sa paglalagay ng isang tao sa isang tungkulin o katayuan; malinaw at natural sa makabagong Filipino ang “itinalaga.”
- source_word: לָרֹאשׁ ... לְנָגִיד
  choice: bilang pangunahing pinuno
  rationale: Ang רֹאשׁ (“ulo,” kaya “nangunguna”) at נָגִיד (“pinuno” o “tagapamahala”) ay kapwa nagpapahayag ng mataas na katayuan. Pinagsasama ng “pangunahing pinuno” ang dalawang magkaugnay na paglalarawan nang hindi nagiging paulit-ulit sa Filipino.
- source_word: אֲבִיָּה בֶן־מַעֲכָה
  choice: Abias na anak ni Maaca
  rationale: Ginamit ang mga anyong madaling bigkasin at nakasanayan sa Filipino, habang tuwirang pinanatili ang ugnayang “anak ni.”
- source_word: בְּאֶחָיו
  choice: sa kanyang mga kapatid
  rationale: Maaaring tukuyin ng ב ang pagiging nangunguna sa loob ng pangkat o ang pagiging nakatataas kaugnay nito. Likas na Filipino ang “sa kanyang mga kapatid” at hindi nito lubusang isinasara ang dalawang posibilidad.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala nito ang dahilan ng pagtatalaga; ang “sapagkat” ay malinaw, marangal, at angkop sa salaysay.
- source_word: לְהַמְלִיכוֹ
  choice: balak niya itong gawing hari
  rationale: Ang infinitive na may לְ ay nagpapahayag ng layunin o intensiyon. Nililinaw ng “niya” at “ito” na si Rehoboam ang may balak at si Abias ang gagawing hari.
theological_decisions: []
translation_notes:
  register: Makabago ngunit marangal na Filipino. Iniwasan ang hindi likas na pag-uulit ng “bilang pinuno, bilang tagapamahala” sa pamamagitan ng “pangunahing pinuno,” na kumakatawan sa parehong לָרֹאשׁ at לְנָגִיד. Nasa pangunahing teksto ang panandang [a], ayon sa talababa.
