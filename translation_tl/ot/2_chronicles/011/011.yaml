base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/011.yaml
  text: He strengthened the fortified places and put commanders in them[a], along with stores of food, oil[c][b], and wine.
translation:
  language: tl
  text: 'Pinatatag niya ang mga pinatibay na lugar[a] at naglagay siya roon ng mga pinuno[b] at mga nakaimbak na panustos: pagkain, langis, at alak.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga tanggulan” o “mga kutang lugar.”
    reason: lexical_alternative
  - marker: b
    text: O “mga kumandante,” “mga tagapamahala,” o “mga opisyal.”
    reason: lexical_alternative
  - marker: c
    text: Ang salitang Hebreo ay maaaring tumukoy sa mga kamalig o bodega, o sa mga panustos na nakaimbak doon.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחַזֵּק
  choice: Pinatatag niya
  rationale: Ang piel ng חזק ay nagpapahayag ng pagpapalakas o pagpapatibay. Likas sa modernong Tagalog ang “pinatatag” at hindi nito inuulit nang sobra ang ideya ng pagkakuta.
- source_word: הַמְּצֻרוֹת
  choice: ang mga kutang bayan
  rationale: Tumutukoy ang pangngalan sa mga pinatibay na lugar o tanggulan. Sa konteksto ng mga bayang pinatibay ni Rehoboam, malinaw at natural ang “mga kutang bayan,” habang pinananatili ng talababa ang mas malawak na mga maaaring kahulugan.
- source_word: וַיִּתֵּן בָּהֶם
  choice: at naglagay roon ng
  rationale: Ang נתן na may ב ay may lokatibong diwa ng paglalagay sa loob ng mga kutang bayan. Ang “roon” ay natural sa Tagalog at hindi labis na nililinaw kung sila ay itinalaga “sa ibabaw” ng mga iyon.
- source_word: נְגִידִים
  choice: mga pinuno
  rationale: Maaaring tumukoy ang נָגִיד sa pinuno, tagapamahala, opisyal, o kumandante. Pinananatili ng “mga pinuno” ang lawak ng salitang Hebreo at iniiwasang gawing tiyak na militar ang tungkulin nang higit sa sinasabi ng teksto.
- source_word: וְאֹצְרוֹת
  choice: pati ng mga imbak na
  rationale: Maaaring mangahulugan ang אֹצָרוֹת ng mga kamalig o ng mga nakaimbak na panustos. Ang “mga imbak na” ay natural at akma sa pagkain, langis, at alak, habang ang alternatibong pisikal na kamalig ay binabanggit sa talababa.
- source_word: מַאֲכָל
  choice: pagkain
  rationale: Karaniwan at tuwirang katumbas ito ng מַאֲכָל, at ipinahihiwatig na ng “mga imbak” ang gamit bilang panustos.
- source_word: שֶׁמֶן
  choice: langis
  rationale: Karaniwang salin ng שֶׁמֶן. Malamang na langis ng olibo ito sa konteksto, ngunit hindi iyon espesipikong sinasabi ng teksto.
- source_word: יָיִן
  choice: alak
  rationale: Karaniwang salin ng יָיִן at malinaw sa ordinaryong mambabasa.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na dignified ngunit madaling maunawaan. Ginamit ang “kutang bayan” upang ilarawan ang mga pinatibay na pamayanan sa konteksto, at “mga pinuno” upang mapanatili ang tunay na lawak ng נְגִידִים. Inayos ang mga marker sa natural na posisyon at sunod-sunod na [a], [b], [c].
