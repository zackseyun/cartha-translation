translation_notes:
  register: Modernong Filipino Tagalog na payak ngunit marangal. Iniwasang isalin ang וַיִּבֶן bilang “pinatibay” upang hindi magdagdag ng kahulugang nagmumula lamang sa konteksto. Inilagay ang talababa pagkatapos ng “Tekoa,” ang pangalang tinutukoy ng alternatibong baybay.
