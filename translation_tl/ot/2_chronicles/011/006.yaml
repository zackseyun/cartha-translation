  text: And he built Bethlehem[a], Etam, and Tekoa.
translation:
  language: tl
  text: At itinayo niya ang Bethlehem, Etam, at Tekoa[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring baybayin na “Tekoah.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶן
  choice: itinayo
  rationale: Ang Qal wayyiqtol ng בנה ay karaniwang nangangahulugang “nagtayo” o “itinayo.” Pinananatili nito ang payak na diwa ng pandiwa nang hindi tahasang dinaragdagan ng “pinatibay,” kahit iyon ang mas malawak na konteksto.
- source_word: אֶת
  choice: '[hindi isinalin]'
  rationale: Pananda ito ng tuwirang layon sa Hebreo at walang hiwalay na katumbas na kailangang ilagay sa natural na Tagalog.
- source_word: בֵּית לֶחֶם
  choice: Bethlehem
  rationale: Ginamit ang nakasanayan at madaling makilalang anyo ng pangalan ng lugar sa Filipino.
- source_word: עֵיטָם
  choice: Etam
  rationale: Tuwirang transliterasyon ng pangalan ng lugar sa anyong natural basahin sa Filipino.
- source_word: תְּקוֹעַ
  choice: Tekoa
  rationale: Tuwirang transliterasyon ng pangalan ng lugar; ang “Tekoah” ay isa ring posibleng baybay.
- source_word: וְ...וְ...וְ
  choice: At ... , ... , at ...
  rationale: Isinalin ang unang waw bilang “At” upang iugnay ang talata sa nauna, at inayos ang talaan sa natural na modernong Tagalog na may “at” bago ang huling pangalan.
