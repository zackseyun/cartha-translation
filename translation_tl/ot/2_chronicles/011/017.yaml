  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַֽ/יְחַזְּקוּ֙ אֶת מַלְכ֣וּת יְהוּדָ֔ה וַֽ/יְאַמְּצ֛וּ אֶת רְחַבְעָ֥ם בֶּן שְׁלֹמֹ֖ה לְ/שָׁנִ֣ים שָׁל֑וֹשׁ כִּ֣י הָֽלְכ֗וּ בְּ/דֶ֧רֶךְ דָּוִ֛יד וּ/שְׁלֹמֹ֖ה לְ/שָׁנִ֥ים שָׁלֽוֹשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/017.yaml
  text: So they strengthened the kingdom of Judah and strengthened Rehoboam son of Solomon for three years[a], because for three years they walked in the way of David and Solomon.
translation:
  language: tl
  text: Kaya pinatatag nila ang kaharian ng Juda at pinalakas si Rehoboam na anak ni Solomon sa loob ng tatlong taon, sapagkat sa loob ng tatlong taon ay lumakad sila sa landas nina David at Solomon.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחַזְּקוּ
  choice: pinatatag nila
  rationale: Ang piel ng חזק ay nagsasaad ng pagpapalakas o pagpapatatag. Ang “pinatatag” ay natural para sa kaharian at hindi nililimitahan ang diwa sa pagpapatibay na militar.
- source_word: מַלְכוּת יְהוּדָה
  choice: ang kaharian ng Juda
  rationale: Bagaman maaaring tumukoy ang מַלְכוּת sa paghahari o pagkahari, ang konteksto rito ay ang pampolitikang kaharian ng Juda.
- source_word: וַיְאַמְּצוּ
  choice: pinalakas
  rationale: Ang piel ng אמץ ay nangangahulugang palakasin o patibayin. Ang “pinalakas” ay angkop dahil si Rehoboam mismo ang tuwirang layon at pinananatili nito ang pagkakalapit ng kahulugan sa unang pandiwa nang hindi nagiging alanganing paulit-ulit.
- source_word: רְחַבְעָם בֶּן שְׁלֹמֹה
  choice: si Rehoboam na anak ni Solomon
  rationale: Tuwirang pinananatili ang ugnayang ama-anak sa likas na anyong Filipino.
- source_word: לְשָׁנִים שָׁלוֹשׁ
  choice: sa loob ng tatlong taon
  rationale: Likas na pagpapahayag sa Filipino ng tagal na tinutukoy ng לְ; pinanatili rin ang dalawang paglitaw nito sa Hebreo.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala nito ang dahilan ng naunang pagpapatatag at pagpapalakas; ang “sapagkat” ay malinaw, marangal, at kasalukuyang Filipino.
- source_word: הָלְכוּ בְּדֶרֶךְ
  choice: namuhay sila ayon sa landas
  rationale: Idyoma ito tungkol sa asal o pamumuhay. Iniiwasan ng “namuhay ayon sa landas” ang di-likas na literal na “lumakad sa daan” habang pinananatili ang talinghaga ng landas.
- source_word: דָּוִיד וּשְׁלֹמֹה
  choice: nina David at Solomon
  rationale: Ang “nina” ay likas na panandang Filipino para sa landas o huwarang iniuugnay sa dalawang taong pinangalanan.
theological_decisions:
- issue: Pagtataya sa “landas nina David at Solomon”
  choice: Pinanatili ang idyoma at nilimitahan ang positibong pagtataya sa tahasang binanggit na tatlong taon.
  alternative: Palawakin bilang “naging tapat sila sa PANGINOON gaya nina David at Solomon.”
  rationale: Hindi tahasang sinasabi ng talata ang “naging tapat sa PANGINOON,” ni inilalarawan nito ang buong buhay o paghahari nina David at Solomon. Ang idyoma ay pinanatili upang hindi magdagdag ng mas malawak na teolohikal na paghatol.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang magkaibang “pinatatag” at “pinalakas” upang maging natural ang dalawang magkalapit na pandiwang Hebreo. Pinanatili ang pag-uulit ng “sa loob ng tatlong taon” dahil tahasan at mahalaga ito sa estruktura at diin ng orihinal.
