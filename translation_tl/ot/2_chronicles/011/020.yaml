  text: וְ/אַחֲרֶ֣י/הָ לָקַ֔ח אֶֽת מַעֲכָ֖ה בַּת אַבְשָׁל֑וֹם וַ/תֵּ֣לֶד ל֗/וֹ אֶת אֲבִיָּה֙ וְ/אֶת עַתַּ֔י וְ/אֶת זִיזָ֖א וְ/אֶת שְׁלֹמִֽית־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/020.yaml
  text: After her[a], he took Maacah the daughter of Absalom, and she bore him Abijah, Attai, Ziza, and Shelomith.
translation:
  language: tl
  text: Matapos ang naunang asawa, pinakasalan ni Rehoboam si Maaca, na anak na babae ni Absalom,[a] at nagsilang siya para kay Rehoboam ng mga anak na sina Abias, Atai, Ziza, at Selomit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “anak na babae ni Absalom.” Kung minsan, ang salitang ito ay maaaring tumukoy sa isang mas malayong babaeng inapo, kaya inuunawa ito ng ilan bilang “apo ni Absalom.”
    reason: alternative_reading
lexical_decisions:
- source_word: וְאַחֲרֶיהָ
  choice: Pagkatapos niya
  rationale: Tuwirang pinananatili ang panghalip na pambabae, na tumutukoy sa naunang binanggit na asawa.
- source_word: לָקַח
  choice: kinuha ni Rehoboam
  rationale: Pinananatili ang literal na diwa ng 'kinuha'; idinagdag ang tahasang simuno mula sa konteksto upang maging natural at malinaw sa Tagalog.
- source_word: מַעֲכָה
  choice: Maaca
  rationale: Transliterasyon ng pangalang Hebreo sa anyong madaling basahin sa Tagalog.
- source_word: בַּת אַבְשָׁלוֹם
  choice: anak na babae ni Absalom
  rationale: Tuwirang salin ng pariralang Hebreo; hindi nilulutas sa pangunahing teksto ang posibilidad na tumukoy ito sa mas malayong babaeng inapo.
- source_word: וַתֵּלֶד לוֹ
  choice: at ipinanganak nito sa kaniya
  rationale: Natural na Tagalog na nagsasaad na si Maaca ang nagsilang ng mga anak para kay Rehoboam.
- source_word: אֶת אֲבִיָּה וְאֶת עַתַּי וְאֶת זִיזָא וְאֶת שְׁלֹמִית
  choice: sina Abias, Atai, Ziza, at Selomit
  rationale: Isinalin ang pantukoy sa mga pangalan bilang 'sina' at ginamit ang mga anyong angkop sa pagbasa ng Tagalog.
theological_decisions:
- issue: Ang genealogical na tawag kay Maaca bilang 'anak na babae ni Absalom'
  choice: Panatilihin sa pangunahing teksto ang literal na 'anak na babae ni Absalom'
  alternative: apo o babaeng inapo ni Absalom
  rationale: Malinaw na 'anak na babae' ang salitang Hebreo, ngunit maaari itong gamitin kung minsan para sa mas malayong babaeng inapo. Pinananatili ng teksto at talababa ang tunay na saklaw ng kahulugan nang hindi sapilitang nilulutas ito.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang literal na 'kinuha' at ang genealogical na katawagan, habang nilinaw sa talababa ang posibleng mas malawak na kahulugan.
