  terminology: Pinanatili ang mga anyong pangalang Maaca, Absalom, Abias, Atai, Ziza, at Selomit, na angkop sa karaniwang Filipino/Tagalog na pagbaybay sa Bibliya. Ang “anak na babae” ay wastong literal na katumbas ng בַּת; ang talababa ay maingat na nagtatala ng posibilidad na “babaeng inapo.”
