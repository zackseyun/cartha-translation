  text: And the word of Yahweh came to Shemaiah the man of God, saying,
translation:
  language: tl
  text: 'At dumating kay Semaias, ang tao ng Diyos, ang salita ni Yahweh:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: At dumating
  rationale: Ipinapahayag ng waw-consecutive na sumunod na pangyayari sa salaysay; natural sa Filipino ang payak na “At dumating” kaysa literal na “At nangyari.”
- source_word: דְּבַר יְהוָה
  choice: ang salita ni Yahweh
  rationale: Pinananatili nito ang kinikilalang pormulang propetiko at ang ugnayang construct ng tekstong Hebreo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ang banal na pangalang YHWH bilang personal na pangalan, hindi bilang titulong “Panginoon.”
- source_word: אֶל
  choice: kay
  rationale: Likas na panandang Filipino para sa taong tumanggap ng salita.
- source_word: שְׁמַעְיָהוּ
  choice: Semaias
  rationale: Ginamit ang nakasanayang anyong Filipino ng pangalang biblikal na Shemaiah.
- source_word: אִישׁ הָאֱלֹהִים
  choice: ang lingkod ng Diyos
  rationale: Bagaman literal na “tao ng Diyos,” ang “lingkod ng Diyos” ay mas natural at marangal sa modernong Filipino bilang tawag sa propetikong tauhan, nang hindi binabago ang kanyang kinikilalang papel.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Ang tutuldok ay natural na paraan sa Filipino upang ipakilala ang tuwirang pahayag na kasunod, at ginagampanan ang tungkulin ng Hebreong infinitive na “sinasabi.”
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo; pinananatili ng “Yahweh” ang pagkakaiba nito sa isang titulo.
- issue: Pagpapakahulugan sa אִישׁ הָאֱלֹהִים
  choice: ang lingkod ng Diyos
  alternative: ang tao ng Diyos
  rationale: Ang parirala ay isang kinikilalang katawagan sa isang propetikong lingkod. Mas karaniwan at malinaw sa Filipino ang “lingkod ng Diyos,” bagaman ang literal na anyo ay “tao ng Diyos.”
translation_notes:
  register: Modernong Filipino na natural, maikli, at marangal. Inuna ang daloy ng salaysay, ginamit ang personal na pangalang Yahweh, at ipinakilala ang susunod na tuwirang pahayag sa pamamagitan ng tutuldok.
