  text: 'And she bore him sons: Jeush, Shemariah, and Zaham.'
translation:
  language: tl
  text: 'At nagsilang siya kay Rehoboam ng mga anak na lalaki: sina Jeus, Semarias, at Zaham.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֵּלֶד
  choice: At nagsilang siya
  rationale: Ang wayyiqtol ng ילד ay nagpapatuloy sa salaysay. Likas at malinaw sa modernong Tagalog ang “nagsilang,” at pinananatili nito ang babaeng simuno.
- source_word: לוֹ
  choice: para sa kanya
  rationale: Ang ל na may hulaping panghalip ay tumutukoy sa ama sa pormula ng pagsilang. Ang “para sa kanya” ay natural na Tagalog at hindi nagdaragdag ng ideyang wala sa Hebreo.
- source_word: בָּנִים
  choice: mga anak na lalaki
  rationale: Tiyak na mga anak na lalaki ang sinasabi ng Hebreo, gaya rin ng ipinakikitang tatlong pangalang kasunod.
- source_word: יְעוּשׁ
  choice: Jeus
  rationale: Isinalin sa baybay na madaling bigkasin sa Tagalog habang malapit sa anyong Hebreo.
- source_word: שְׁמַרְיָה
  choice: Semarias
  rationale: Ginamit ang nakasanayang anyong biblikal sa Filipino para sa pangalang Hebreo na Shemariah.
- source_word: זָהַם
  choice: Zaham
  rationale: Tuwirang transliterasyon ng personal na pangalan, na angkop at madaling basahin sa Tagalog.
