  register: Maikli at marangal na modernong Tagalog, na pinananatili ang anyo ng talang nagpapatuloy mula sa naunang talata. Gumamit ng mga transliterasyong madaling basahin sa Filipino at hindi isinalin ang kahulugan ng mga pangalan ng lugar.
