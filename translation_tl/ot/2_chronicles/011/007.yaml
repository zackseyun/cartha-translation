  text: at ang Bet-zur,[a] Soco, at Adulam;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: “Bet-zur ... Soco ... Adulam.” Nagkakaiba-iba ang baybay ng mga pangalang ito sa mga salin; ang “Socoh” ay isa ring karaniwang anyo ng “Soco.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֶת
  choice: at ang
  rationale: Ang וְ ay nag-uugnay sa mga pangalan sa nagpapatuloy na talaan, samantalang ang pantukoy sa tuwirang layon na אֶת ay likas na naipahihiwatig ng Tagalog na “ang” sa kayariang ito.
- source_word: בֵּית צ֥וּר
  choice: Bet-zur
  rationale: Pangalan ito ng lugar; tinumbasan ito sa karaniwang transliterasyong angkop sa modernong Tagalog sa halip na isalin ang literal na mga bahagi ng pangalan.
- source_word: שׂוֹכ֖וֹ
  choice: Soco
  rationale: Pangalan ito ng bayan. Pinanatili ang kinikilalang anyong “Soco”; may iba pang posibleng baybay gaya ng “Socoh.”
- source_word: עֲדֻלָּֽם
  choice: Adulam
  rationale: Pangalan ito ng lugar sa Juda; ginamit ang natural na transliterasyong Tagalog na “Adulam.”
