- from: Kumilos siya nang may karunungan at itinalaga ang ilan sa kanyang mga anak sa lahat ng lupain ng Juda at Benjamin—sa lahat ng napapaderang lungsod.[a] Binigyan niya sila ng saganang panustos at humanap siya ng maraming mapapangasawa para sa kanila.[b]
  to: Kumilos siya nang may karunungan at ipinamahagi niya ang ilan sa kanyang mga anak sa lahat ng napapaderang lungsod sa lahat ng rehiyon ng Juda at Benjamin.[a] Binigyan niya sila ng saganang panustos at humanap siya ng maraming mapapangasawa para sa kanila.[b]
  rationale: Pinalitan ang “itinalaga” ng “ipinamahagi” upang mas malapit na maipahayag ang pagpapakalat/pamamahagi sa וַיִּפְרֹץ nang hindi nagmumungkahi ng sapilitang pagkakawatak-watak. Inayos din ang mga pariralang pook para sa malinaw na sintaks sa Tagalog at tinama ang talababa upang malinaw na ang tinutukoy ay ilan, hindi kinakailangang lahat, ng kanyang mga anak.
