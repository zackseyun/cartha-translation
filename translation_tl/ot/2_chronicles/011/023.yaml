base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/023.yaml
  text: And he acted wisely and distributed some of all his sons throughout all the lands of Judah and Benjamin[a], to all the fortified cities[c][b]; and he gave them abundant provisions and sought many wives for them.
translation:
  language: tl
  text: Kumilos siya nang may karunungan at ipinamahagi niya ang ilan sa kanyang mga anak sa lahat ng napapaderang lungsod sa lahat ng rehiyon ng Juda at Benjamin.[a] Binigyan niya sila ng saganang panustos at humanap siya ng maraming mapapangasawa para sa kanila.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ipinakalat niya ang ilan sa kanyang mga anak.” Malamang na ang ibig sabihin ay inilagay niya ang ilan sa kanyang mga anak sa iba't ibang napapaderang lungsod, hindi na bawat anak ay ipinadala sa bawat lugar.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “humingi siya ng napakaraming asawa.” Malamang na nangangahulugan itong nagsaayos siya ng mga pag-aasawa para sa kanyang mga anak.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֶן
  choice: Kumilos siya nang may karunungan
  rationale: Ang anyo ng בין ay maaaring mangahulugang magpakita ng pagkaunawa o kumilos nang may mahusay na pagpapasya. Sa konteksto ng maingat na pamamahala, likas sa modernong Tagalog ang pariralang ito.
- source_word: וַיִּפְרֹץ מִכָּל בָּנָיו
  choice: itinalaga ang ilan sa kanyang mga anak
  rationale: Ipinahihiwatig ng פרץ dito ang pagpapakalat o pamamahagi sa iba't ibang lugar, samantalang ang partitive na מִכָּל ay nagpapakitang ilan mula sa kabuuan ng kanyang mga anak ang tinutukoy. Pinili ang 'itinalaga' upang maipahayag ang sinasadyang paglalagay sa mga lungsod, hindi ang sapilitang pagtataboy.
- source_word: לְכָל אַרְצוֹת יְהוּדָה וּבִנְיָמִן
  choice: sa lahat ng lupain ng Juda at Benjamin
  rationale: Ang אֲרָצוֹת ay mga lupain o rehiyon. Pinananatili ng 'mga lupain' ang anyong Hebreo nang hindi ipinahihiwatig na magkakahiwalay na bansa ang mga ito.
- source_word: לְכֹל עָרֵי הַמְּצֻרוֹת
  choice: sa lahat ng napapaderang lungsod
  rationale: Ang מְצֻרוֹת ay tumutukoy sa mga lungsod na pinatibay laban sa pagsalakay. Ang 'napapaderang lungsod' ay malinaw at karaniwang ekspresyon sa Tagalog.
- source_word: וַיִּתֵּן לָהֶם הַמָּזוֹן לָרֹב
  choice: Binigyan niya sila ng saganang panustos
  rationale: Ang מָזוֹן ay pagkain, ikabubuhay, o panustos, at ang לָרֹב ay nagsasaad ng kasaganaan. Ang 'panustos' ay angkop sa administratibong konteksto at hindi lamang tumutukoy sa isang pagkain.
- source_word: וַיִּשְׁאַל הֲמוֹן נָשִׁים
  choice: humanap siya ng maraming mapapangasawa para sa kanila
  rationale: Karaniwang kahulugan ng שׁאל ang humingi o humanap. Sa konteksto, malamang na naghanap o nagsaayos si Rehoboam ng mga mapapangasawa para sa kanyang mga anak; ang 'para sa kanila' ay nilinaw mula sa naunang pangmaramihang reperente.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang 'napapaderang lungsod' sa halip na mas teknikal na 'pinatibay na lungsod,' at pinanatili sa talababa ang tunay na kalabuan ng mga pandiwang ויפרץ at וישאל.
