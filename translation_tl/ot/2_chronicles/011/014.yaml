  text: כִּֽי עָזְב֣וּ הַ/לְוִיִּ֗ם אֶת מִגְרְשֵׁי/הֶם֙ וַ/אֲחֻזָּתָ֔/ם וַ/יֵּלְכ֥וּ לִ/יהוּדָ֖ה וְ/לִֽ/ירוּשָׁלִָ֑ם כִּֽי הִזְנִיחָ֤/ם יָֽרָבְעָם֙ וּ/בָנָ֔י/ו מִ/כַּהֵ֖ן לַ/יהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/014.yaml
  text: For the Levites left their pasturelands and their possessions and went to Judah and Jerusalem[b][a], because Jeroboam and his sons had rejected them from serving as priests to Yahweh.
translation:
  language: tl
  text: Sapagkat iniwan ng mga Levita ang kanilang mga pastulan[a] at mga lupaing pag-aari, at pumunta sila sa Juda at Jerusalem, dahil itinakwil sila ni Jeroboam at ng kanyang mga anak at hindi na pinahintulutang maglingkod bilang mga pari kay Yahweh.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga bukas na lupain” o “mga lupaing pastulan.” Tumutukoy ang Hebreo sa bukas na lupaing nakapaligid at nakaugnay sa kanilang mga bayan.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “dahil ibinukod sila ni Jeroboam at ng kanyang mga anak sa paglilingkod bilang mga pari kay Yahweh.”
    reason: alternative_reading
lexical_decisions:
- source_word: מִגְרְשֵׁיהֶם
  choice: kanilang mga pastulan
  rationale: Tumutukoy ang מִגְרָשׁ sa bukas na lupa sa paligid ng mga bayan, lalo na sa lupaing ginagamit na pastulan na nakalaan sa mga Levita. Malinaw at likas sa Filipino ang “mga pastulan,” habang ipinapaliwanag sa talababa ang mas malawak na saklaw nito.
- source_word: וַאֲחֻזָּתָם
  choice: mga lupaing pag-aari
  rationale: Ang אֲחֻזָּה ay pag-aaring lupa o hawak na lupain. Mas tiyak ang “mga lupaing pag-aari” kaysa sa pangkalahatang “mga ari-arian,” at hindi nito ipinapasok ang posibleng labis na espesipikong diwa ng “mana.”
- source_word: וַיֵּלְכוּ לִיהוּדָה וְלִירוּשָׁלִָם
  choice: at pumunta sila sa Juda at Jerusalem
  rationale: Ang הלך na may ל ay nagsasaad ng pagkilos patungo sa isang destinasyon. Karaniwan at tuwiran sa salaysay ang “pumunta sila sa.”
- source_word: הִזְנִיחָם
  choice: inalis sila
  rationale: Sa kontekstong sinusundan ng מִכַּהֵן, ipinahihiwatig ng Hiphil ng זנח ang pagtatakwil o pagbubukod sa kanila mula sa gawaing pagkasaserdote. Likas sa Filipino ang “inalis sila ... sa paglilingkod,” samantalang pinananatili sa talababa ang mas literal na “itinakwil.”
- source_word: מִכַּהֵן
  choice: sa paglilingkod bilang mga pari
  rationale: Ang מִן kasama ng infinitive ng כהן ay nagpapahayag ng paghadlang o pag-aalis mula sa gawaing pagkasaserdote. Malinaw at natural ang “sa paglilingkod bilang mga pari.”
- source_word: לַיהוָה
  choice: kay Yahweh
  rationale: Ang יהוה ay ang personal na pangalang banal. Ang “kay” ang likas na panandang Filipino para sa paglilingkod na inuukol sa isang persona.
- source_word: כִּי ... כִּי
  choice: Sapagkat ... dahil
  rationale: Ang unang כִּי ay nagpapaliwanag sa naunang pahayag, samantalang ang ikalawa ay nagbibigay ng dahilan ng pag-alis ng mga Levita. Nililinaw ng “Sapagkat ... dahil” ang magkaibang tungkulin ng dalawang pangatnig.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON / Jehova
  rationale: Tahasan sa tekstong Hebreo ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal at tipanang pangalan sa halip na palitan ito ng isang titulo.
- issue: Lakas ng הִזְנִיחָם sa pag-aalis sa mga Levita sa tungkulin
  choice: inalis sila ... sa paglilingkod bilang mga pari
  alternative: itinakwil sila mula sa paglilingkod bilang mga pari
  rationale: Ipinahahayag ng pangunahing salin ang institusyonal na bunga nang hindi ikinakaila ang diwa ng pagtatakwil; inilalahad sa talababa ang mas literal at mas matinding alternatibo upang mapanatili ang saklaw ng Hebreo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mga lupaing pag-aari” upang maipakita ang uri ng pag-aari, at “inalis ... sa paglilingkod” upang maging likas ang pangungusap habang pinananatili sa talababa ang mas literal na diwa ng pagtatakwil.
