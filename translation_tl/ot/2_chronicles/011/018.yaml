base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/018.yaml
  text: Rehoboam took as wife Mahalath the daughter of Jerimoth son of David[a], and Abihail the daughter of Eliab son of Jesse.
translation:
  language: tl
  text: Kinuha ni Rehoboam bilang asawa si Mahalat, na anak ni Jerimot na anak ni David at ni Abihail na anak ni Eliab na anak ni Jesse.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Siksik at di-karaniwan ang pagkakasulat ng talaangkanan sa Hebreo. Halos literal: “Mahalat, anak [sa anyong pambalaki] ni Jerimot na anak ni David, Abihail na anak ni Eliab na anak ni Jesse.” Malamang na ang ibig sabihin ay anak si Mahalat nina Jerimot at Abihail. Itinuturing naman ng ilan si Abihail bilang isa pang pangalan sa tala ng pamilya o, bagaman di-gaanong malamang, bilang pangalawang asawa.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקַּח לוֹ ... אִשָּׁה
  choice: Kinuha ... bilang asawa
  rationale: Pinananatili nito ang Hebreong idyoma na “kumuha para sa sarili ng isang asawa” at malinaw na ipinahahayag ang pag-aasawa nang hindi lubusang pinapalitan ng mas interpretatibong “pinakasalan.”
- source_word: מָחֲלַת
  choice: Mahalat
  rationale: Isinalin sa baybay na madaling bigkasin sa Filipino habang nananatiling malapit sa pangalang Hebreo.
- source_word: בן יְרִימוֹת בֶּן דָּוִיד
  choice: anak ni Jerimot na anak ni David
  rationale: Ang unang בן ay pambalaki sa anyong nakasulat, ngunit dahil si Mahalat ay babae at siksik ang talaangkanan, “anak” ang piniling neutral at likas na salin; pinananatili rin ang sunod-sunod na ugnayang pampamilya.
- source_word: אֲבִיהַיִל בַּת אֱלִיאָב בֶּן יִשָׁי
  choice: ni Abihail na anak ni Eliab na anak ni Jesse
  rationale: Itinuturing si Abihail bilang ina ni Mahalat at pinananatili ang kaniyang talaangkanan, na siyang pinakanatural na pagbasa sa iisang “asawa” ng talata.
theological_decisions:
- issue: Ugnayang sintaktiko ng Mahalat, Jerimot, at Abihail sa siksik na talaangkanan
  choice: Si Mahalat ang iisang asawang tinutukoy at anak siya nina Jerimot at Abihail; kasunod na ibinibigay ang angkan ng bawat magulang.
  alternative: Maaaring ituring si Abihail bilang isa pang pangalan sa tala ng pamilya o, bagaman di-gaanong malamang, bilang pangalawang asawa.
  rationale: Isahan ang אִשָּׁה (“asawa”), at ang pagbasa kay Abihail bilang ina ni Mahalat ang nagbibigay ng pinakamaayos na diwa sa siksik at di-karaniwang sintaks. Gayunman, inilalahad sa talababa ang tunay na kalabuan ng Hebreo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “anak” bilang likas at neutral na katawagan sa mga ugnayang talaangkanan, at iniwasang lutasin nang tahimik ang kalabuan ng Hebreong sintaks sa pamamagitan ng isang talababa.
