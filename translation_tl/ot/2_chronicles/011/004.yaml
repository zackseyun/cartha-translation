base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/004.yaml
  text: 'Thus says Yahweh: You must not go up or fight against your brothers[a]. Return, each man to his house, for this thing has come from me[c][b]. So they listened to the words of Yahweh and turned back from going against Jeroboam.'
translation:
  language: tl
  text: 'Ganito ang sabi ni Yahweh: “Huwag kayong umahon ni makipaglaban laban sa inyong mga kapatid.[a] Bumalik ang bawat isa sa kaniyang tahanan, sapagkat mula sa akin ang bagay na ito.”[b] Kaya pinakinggan nila ang mga salita ni Yahweh at bumalik sila mula sa pagpunta kay Jeroboam.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “kasama ng inyong mga kapatid”; sa konteksto ng labanan, ang diwa ay “laban sa inyong mga kapatid.” Binibigyang-diin ng “mga kapatid” na kapuwa Israelita ang kanilang haharapin.
    reason: lexical_and_cultural_note
  - marker: b
    text: Maaari ring isalin, “sapagkat ang bagay na ito ay nagmula sa akin.”
    reason: lexical_alternative
  - marker: c
    text: Sa literal, “bumalik sila mula sa pagpunta kay Jeroboam.” Sa konteksto, ang pagpunta ay upang makipagdigma laban sa kaniya.
    reason: alternative_reading
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: Ganito ang sinabi ni Yahweh
  rationale: Pinananatili ang pormula ng mensaherong propetiko sa natural at marangal na modernong Tagalog.
- source_word: לֹא תַעֲלוּ וְלֹא תִלָּחֲמוּ
  choice: Huwag kayong umahon o makipaglaban
  rationale: Ang “umahon” ay nagpapanatili sa larawang pangheograpiya at militar ng עלה, habang malinaw na ipinahahayag ng “makipaglaban” ang kahulugan ng Niphal na לחם.
- source_word: עִם אֲחֵיכֶם
  choice: sa inyong mga kapatid
  rationale: Sa konteksto ng pakikipaglaban, ipinahihiwatig ng parirala ang pakikipaglaban laban sa kanila; pinananatili ng “mga kapatid” ang diin na kapuwa Israelita ang magkabilang panig.
- source_word: שׁוּבוּ אִישׁ לְבֵיתוֹ
  choice: Bumalik ang bawat isa sa kaniyang tahanan
  rationale: Ang אִישׁ ay distributibo rito; likas sa Tagalog ang “bawat isa” at tapat ito sa utos na magkanya-kanyang umuwi.
- source_word: כִּי מֵאִתִּי נִהְיָה הַדָּבָר הַזֶּה
  choice: sapagkat sa akin nagmula ang pangyayaring ito
  rationale: Malinaw na pinananatili ang pag-uugnay ng pangyayari sa pagkilos o kapasyahan ng Diyos nang hindi dinaragdagan ang pahayag ng isang mas malawak na doktrina.
- source_word: וַיִּשְׁמְעוּ אֶת דִּבְרֵי יְהוָה
  choice: Kaya nakinig sila sa mga salita ni Yahweh
  rationale: Sinasaklaw ng “nakinig” kapuwa ang pagdinig at pagsunod, na pinatutunayan ng sumunod nilang pagkilos.
- source_word: וַיָּשֻׁבוּ מִלֶּכֶת אֶל יָרָבְעָם
  choice: at hindi na tumuloy laban kay Jeroboam
  rationale: Natural na Tagalog ito para sa literal na pagtalikod mula sa pagpunta kay Jeroboam; ipinakikita ng konteksto na ang pagpunta ay para sa labanan.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; PANGINOON
  rationale: Ginagamit ang transliterasyong “Yahweh” upang malinaw na katawanin ang personal na banal na pangalan sa Hebreo.
- issue: Pagkilos ng Diyos sa מֵאִתִּי נִהְיָה הַדָּבָר הַזֶּה
  choice: sa akin nagmula ang pangyayaring ito
  alternative: ang bagay na ito ay mula sa akin
  rationale: Pinananatili ang tahasang pag-uugnay ng pangyayari sa Diyos, ngunit hindi nililinaw nang higit sa Hebreo kung ito ay tuwirang sanhi, kapasyahan, o kaayusan ng Diyos.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “tahanan” sa halip na mas kolokyal na “bahay” para sa dignidad ng pahayag, at “bawat isa” upang natural na maipahayag ang distributibong אִישׁ nang hindi kinakailangang gawing eksklusibong panlalaki ang Tagalog.
