id: 2CH.11.16
reference: 2 Chronicles 11:16
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/אַחֲרֵי/הֶ֗ם מִ/כֹּל֙ שִׁבְטֵ֣י יִשְׂרָאֵ֔ל הַ/נֹּֽתְנִים֙ אֶת לְבָבָ֔/ם לְ/בַקֵּ֕שׁ אֶת יְהוָ֖ה אֱלֹהֵ֣י יִשְׂרָאֵ֑ל בָּ֚אוּ יְר֣וּשָׁלִַ֔ם לִ/זְבּ֕וֹחַ לַ/יהוָ֖ה אֱלֹהֵ֥י אֲבוֹתֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/016.yaml
  text: And after them[a], from all the tribes of Israel, those who set their hearts to seek Yahweh, the God of Israel, came to Jerusalem to sacrifice to Yahweh[b], the God of their fathers.
translation:
  language: tl
  text: Kasunod nila, mula sa lahat ng lipi ng Israel, ang mga nagtuon ng kanilang puso[a] sa paghahanap kay Yahweh, ang Diyos ng Israel, ay dumating sa Jerusalem[b] upang maghain kay Yahweh, ang Diyos ng kanilang mga ama.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “ang mga nagbigay ng kanilang puso.” Ang idyoma ay nangangahulugang itinuon o itinalaga nila ang kanilang kalooban sa paghahanap kay Yahweh.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “pumunta sa Jerusalem.” Ang pandiwang Hebreo ay maaaring isaling “dumating” o “pumunta,” depende sa pananaw ng nagsasalaysay.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחֲרֵיהֶם
  choice: Kasunod nila
  rationale: Pinananatili ang pagkakasunod na kaugnayan sa naunang talata at natural itong pakinggan sa makabagong Filipino.
- source_word: מִכֹּל שִׁבְטֵי יִשְׂרָאֵל
  choice: mula sa lahat ng lipi ng Israel
  rationale: Malinaw na ipinahahayag ang pinagmulan at ang saklaw na sumasaklaw sa lahat ng lipi.
- source_word: הַנֹּתְנִים אֶת לְבָבָם
  choice: ang mga nagtalaga ng kanilang puso
  rationale: Inilalarawan ng idyomang Hebreo ang sinadyang pagtatalaga ng kalooban; pinananatili ng salin ang larawan ng puso nang hindi nagiging labis na literal.
- source_word: לְבַקֵּשׁ
  choice: na hanapin
  rationale: Sa kontekstong panrelihiyon, tumutukoy ito sa taimtim na paglapit at paghahangad sa Diyos; ang “hanapin” ang pinakadiretso at likas na katumbas.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang transliterasyon ng personal na pangalang Hebreo sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ang Diyos ng Israel
  rationale: Tuwirang inililipat ang pariralang konstruktong tumutukoy kay Yahweh bilang Diyos ng Israel.
- source_word: בָּאוּ יְרוּשָׁלִַם
  choice: ay pumunta sa Jerusalem
  rationale: Maaaring mangahulugan ang בוא ng “dumating” o “pumunta” ayon sa pananaw ng nagsasalaysay. Mas natural sa Filipino rito ang “pumunta,” habang itinatala sa talababa ang alternatibo.
- source_word: לִזְבּוֹחַ
  choice: upang maghandog ng hain
  rationale: Malinaw na ipinakikita ang layunin ng pagpunta at ang gawaing paghahain na tinutukoy ng pandiwa.
- source_word: אֱלֹהֵי אֲבוֹתֵיהֶם
  choice: ang Diyos ng kanilang mga ama
  rationale: Pinananatili ang tahasang panlalaking anyo ng Hebreo at ang tradisyonal na pormulang tipan.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Personal na pangalan ang nasa tekstong Hebreo, kaya pinananatili ito bilang “Yahweh” sa halip na palitan ng titulo.
- issue: Pormulang אֱלֹהֵי אֲבוֹתֵיהֶם
  choice: ang Diyos ng kanilang mga ama
  alternative: ang Diyos ng kanilang mga ninuno
  rationale: Ang Hebreo ay tahasang nagsasabing “mga ama.” Pinananatili ito upang hindi gawing neutral ang pormulang may kaugnayan sa tipan, bagaman mas karaniwang Filipino ang “mga ninuno.”
- issue: Kusang-loob na paghahanap kay Yahweh
  choice: nagtalaga ng kanilang puso na hanapin
  alternative: buong-pusong nagpasiyang hanapin
  rationale: Pinananatili ang larawan ng puso at ang sinadyang pagtatalaga ng kalooban nang hindi dinaragdagan ang teksto ng isang tiyak na doktrinal na paliwanag.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang pangalang “Yahweh,” ang larawang “puso,” at ang pormulang “Diyos ng kanilang mga ama,” habang ginawang natural ang ayos ng pangungusap sa Tagalog.
