  yaml_path: translation/ot/2_chronicles/011/013.yaml
  text: And the priests and the Levites who were in all Israel took their stand with him from all their territories[a].
translation:
  language: tl
  text: At ang mga pari at mga Levita na nasa buong Israel ay pumanig sa kanya mula sa lahat ng kanilang lupain.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “humarap sa kanya” o “tumindig sa harap niya.” Maaaring tumukoy ang idyomang Hebreo sa pisikal na pagharap kay Rehoboam o sa pagpanig sa kanya; mas pinapaboran ng konteksto ang pagpapahayag ng katapatan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַכֹּהֲנִים
  choice: At ang mga pari
  rationale: Pinananatili ng “At” ang kaugnayan sa naunang salaysay, at natural sa Tagalog ang tiyak na pangmaramihang “ang mga pari.”
- source_word: וְהַלְוִיִּם
  choice: at mga Levita
  rationale: Karaniwang katawagan sa Tagalog ang “mga Levita” para sa uring Levitico; ang pang-ugnay ay nagpapanatili sa koordinasyon ng dalawang pangkat.
- source_word: אֲשֶׁר בְּכָל יִשְׂרָאֵל
  choice: na nasa buong Israel
  rationale: Tuwirang ipinahihiwatig na ang mga pari at Levita ay nakakalat sa buong Israel, hindi lamang nasa Juda.
- source_word: הִתְיַצְּבוּ
  choice: pumanig
  rationale: Sa konteksto, ang Hitpael ng יצב ay nagpapahiwatig ng kusang pagharap o pagtindig bilang pagpapakita ng suporta. Ang “pumanig” ay natural at malinaw sa modernong Tagalog, habang inilalagay sa talababa ang posibleng mas literal na diwa.
- source_word: עָלָיו
  choice: sa kanya
  rationale: Kasama ng הִתְיַצְּבוּ, ipinahihiwatig nito ang pagpanig o pagsuporta kay Rehoboam; hindi kailangang idagdag ang pangalan dahil malinaw ang panghalip sa konteksto.
- source_word: מִכָּל גְּבוּלָם
  choice: mula sa lahat ng kanilang nasasakupan
  rationale: Ang גְּבוּל ay maaaring tumukoy sa hangganan o sa teritoryong nasa loob nito. Dito, ang “nasasakupan” ay likas na heograpikong katawagan sa Tagalog at hindi nagmumungkahing ang mga hangganang linya mismo ang pinanggalingan nila.
theological_decisions:
- issue: Kung ang הִתְיַצְּבוּ עָלָיו ay pisikal na pagharap lamang o pagpapahayag ng katapatan
  choice: Isinalin sa pangunahing teksto bilang “pumanig sa kanya.”
  alternative: “humarap sa kanya” o “tumayo sa harap niya”
  rationale: Maaaring taglayin ng idyomang Hebreo ang pisikal na pagharap o ang pagpanig. Mas pinapaboran ng konteksto ang kusang pagkampi kay Rehoboam, ngunit pinananatili sa talababa ang tunay na leksikal na posibilidad.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “pumanig” upang natural na maipahayag ang kontekstuwal na diwa, habang pinanatili sa talababa ang ambiguwidad ng idyomang Hebreo.
