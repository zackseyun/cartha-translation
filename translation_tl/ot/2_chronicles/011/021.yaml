  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יֶּאֱהַ֨ב רְחַבְעָ֜ם אֶת מַעֲכָ֣ה בַת אַבְשָׁל֗וֹם מִ/כָּל נָשָׁי/ו֙ וּ/פִ֣ילַגְשָׁ֔י/ו כִּ֠י נָשִׁ֤ים שְׁמוֹנֶֽה עֶשְׂרֵה֙ נָשָׂ֔א וּ/פִֽילַגְשִׁ֖ים שִׁשִּׁ֑ים וַ/יּ֗וֹלֶד עֶשְׂרִ֧ים וּ/שְׁמוֹנָ֛ה בָּנִ֖ים וְ/שִׁשִּׁ֥ים בָּנֽוֹת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/021.yaml
  text: Rehoboam loved Maacah the daughter of Absalom more than all his wives and his concubines[a], for he had taken eighteen wives and sixty concubines, and he fathered twenty-eight sons and sixty daughters.
translation:
  language: tl
  text: Minahal ni Rehoboam si Maaca, na anak na babae ni Absalom[a], nang higit kaysa sa lahat ng kanyang asawa at mga asawang pangalawa. Sapagkat kumuha siya ng labingwalong asawa at animnapung asawang pangalawa, at nagkaroon siya ng dalawampu't walong anak na lalaki at animnapung anak na babae.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O maaaring “inapo ni Absalom”; kung minsan, ang salitang Hebreo para sa “anak na babae” ay ginagamit nang mas malawak sa mga talaangkanan.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֶּאֱהַב
  choice: Minahal
  rationale: Tuwirang ipinahahayag ng pandiwang אהב ang pag-ibig o pagkagiliw; ang paghahambing ay inilalahad ng kasunod na pariralang מִכָּל.
- source_word: בַת אַבְשָׁלוֹם
  choice: anak ni Absalom
  rationale: Karaniwang nangangahulugang 'anak na babae' ang בַת. Sa Filipino, likas nang matutukoy na babae si Maaca, kaya sapat at natural ang 'anak'; pinananatili sa talababa ang posibleng mas malawak na kahulugang pangangkanan.
- source_word: מִכָּל נָשָׁיו וּפִילַגְשָׁיו
  choice: nang higit kaysa sa lahat ng iba pa niyang asawa at mga asawang-lingkod
  rationale: Ang מִכָּל ay naghahayag ng paghahambing. Nililinaw ng 'iba pa' na kabilang din si Maaca sa mga asawa, habang pinananatili ng 'asawang-lingkod' ang hiwalay na katayuang panlipunan ng פִּילֶגֶשׁ nang hindi ipinahihiwatig ang lihim o labag na relasyon.
- source_word: כִּי
  choice: Sapagkat
  rationale: Nagpapakilala rito ang כִּי ng paliwanag o kaugnay na saligang impormasyon sa naunang pahayag.
- source_word: נָשִׁים ... נָשָׂא
  choice: kumuha siya ng labingwalong asawa
  rationale: Ang נשא kasama ng נָשִׁים ay idyoma para sa pagkuha o pag-aasawa ng mga babae; pinananatili ng 'kumuha ... ng asawa' ang anyo at diwa ng Hebreo.
- source_word: פִּילַגְשִׁים
  choice: mga asawang-lingkod
  rationale: Tumutukoy ito sa mga babaeng kinikilalang pangalawahing asawa na may mas mababang katayuan. Mas tumpak ito kaysa 'kalunya,' na maaaring magpahiwatig ng lihim o ipinagbabawal na pakikipagrelasyon.
- source_word: וַיּוֹלֶד
  choice: naging anak niya
  rationale: Ipinahahayag nito na siya ang ama ng mga anak. Natural at malinaw sa makabagong Filipino ang pariralang ito, nang hindi gumagamit ng makaluma o teknikal na salita.
- source_word: עֶשְׂרִים וּשְׁמוֹנָה בָּנִים
  choice: dalawampu't walong lalaki
  rationale: Sa pariralang 'naging anak niya,' natural na tumutukoy ang 'lalaki' sa mga anak na lalaki at tumpak na inililipat ang bilang.
- source_word: וְשִׁשִּׁים בָּנוֹת
  choice: animnapung babae
  rationale: Sa pariralang 'naging anak niya,' natural na tumutukoy ang 'babae' sa mga anak na babae at tumpak na inililipat ang bilang.
theological_decisions:
- issue: Ang pagtukoy kay Maaca bilang בַת אַבְשָׁלוֹם
  choice: Pinanatili sa pangunahing teksto ang literal na diwang 'anak ni Absalom.'
  alternative: Maaaring unawain bilang mas malayong inapo ni Absalom, gaya ng apo.
  rationale: Hindi dapat lutasin nang tahimik ang tanong na pangangkanan. Karaniwang 'anak na babae' ang kahulugan ng Hebreo, ngunit maaari itong gamitin nang mas malawak sa ilang talaangkanan; kaya nasa talababa ang alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang 'asawang-lingkod' upang ipakita ang natatanging katayuan ng mga concubine nang hindi gumagamit ng mapanghamak o mapanlinlang na katawagang gaya ng 'kerida' o 'kalunya.'
