  rationale: Pangalan ng lugar; ginamit ang natural na transliterasyong Filipino na “Azeka.”
- source_word: וְ/אֶת ... וְ/אֶת ... וְ/אֶת
  choice: ang ... ang ... at ang
  rationale: Hindi tuwirang isinasalin sa Tagalog ang pananda ng tuwirang layon na אֵת. Ang pag-uulit ng “ang” sa bawat pangalan ay bahagyang nagpapanatili sa paisa-isang pagtuon ng Hebreo, samantalang natural na “at” ang nag-uugnay sa huling pangalan.
