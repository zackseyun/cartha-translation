  text: וַ/יָּבֹ֣א רְחַבְעָם֮ יְרוּשָׁלִַם֒ וַ/יַּקְהֵל֩ אֶת בֵּ֨ית יְהוּדָ֜ה וּ/בִנְיָמִ֗ן מֵאָ֨ה וּ/שְׁמוֹנִ֥ים אֶ֛לֶף בָּח֖וּר עֹשֵׂ֣ה מִלְחָמָ֑ה לְ/הִלָּחֵם֙ עִם יִשְׂרָאֵ֔ל לְ/הָשִׁ֥יב אֶת הַ/מַּמְלָכָ֖ה לִ/רְחַבְעָֽם־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/001.yaml
  text: When Rehoboam came to Jerusalem[a], he assembled the house of Judah and Benjamin, one hundred eighty thousand chosen warriors[b], to fight against Israel in order to restore the kingdom to Rehoboam.
translation:
  language: tl
  text: Nang dumating si Rehoboam sa Jerusalem, tinipon niya ang sambayanan ng Juda at Benjamin[a]—180,000 piling lalaking mandirigma[b]—upang lumaban sa Israel at maibalik kay Rehoboam ang kaharian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “bahay ng Juda at Benjamin,” isang kolektibong tawag sa sambayanan o kaharian sa timog.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “180,000 piling lalaking handa sa digmaan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: Pagdating
  rationale: Ang Qal wayyiqtol ng בוא ay nagsasaad ng pagdating o pagpasok sa isang pook. Likas sa makabagong Tagalog ang “Pagdating … sa Jerusalem” bilang panimulang sugnay sa salaysay.
- source_word: וַיַּקְהֵל
  choice: tinipon niya
  rationale: Ang Hiphil ng קהל ay nangangahulugang tipunin o kalapin ang mga tao; ang “tinipon” ay malinaw at angkop sa kontekstong militar.
- source_word: אֶת־בֵּית יְהוּדָה וּבִנְיָמִן
  choice: ang sambayanan ng Juda at Benjamin
  rationale: Ang בֵּית na kaugnay ng mga pangalan ng lipi ay tumutukoy sa isang kolektibong angkan o politikal na pangkat. Inihahatid ng “sambayanan” ang kolektibong diwa nang hindi gumagamit ng di-likas na literalismong “bahay.”
- source_word: מֵאָה וּשְׁמוֹנִים אֶלֶף
  choice: 180,000
  rationale: Tuwirang paglalahad ng bilang sa paraang madaling basahin sa makabagong Filipino.
- source_word: בָּחוּר
  choice: piling
  rationale: Sa kontekstong militar, ang בָּחוּר ay maaaring tumukoy sa mga pinili o mahuhusay na lalaki, hindi lamang sa mga kabataan.
- source_word: עֹשֵׂה מִלְחָמָה
  choice: mandirigma
  rationale: Ang literal na “gumagawa ng digmaan” ay idyomatikong tumutukoy sa mga taong nakikipagdigma; malinaw at maikli ang “mandirigma.”
- source_word: לְהִלָּחֵם עִם יִשְׂרָאֵל
  choice: upang makipaglaban sa Israel
  rationale: Sa kontekstong labanang militar, ipinapahayag ng עִם ang kinakaharap na kalaban. Sa Tagalog, sapat nang ipinahihiwatig ng “makipaglaban sa Israel” ang salungatang ito.
- source_word: לְהָשִׁיב
  choice: maibalik
  rationale: Ang Hiphil ng שוב ay nagsasaad ng pagpapabalik o pagpapanumbalik; natural sa Tagalog ang “maibalik” para sa muling pagpapasailalim ng kaharian.
- source_word: הַמַּמְלָכָה
  choice: ang kaharian
  rationale: Karaniwang tumutukoy ang מַמְלָכָה sa kaharian o sakop ng paghahari; pinananatili ng “kaharian” ang lawak ng kahulugan.
- source_word: לִרְחַבְעָם
  choice: kay Rehoboam
  rationale: Tinutukoy ng lamed ang tatanggap ng ibinabalik; likas at eksakto rito ang “kay Rehoboam.”
theological_decisions:
- issue: Ang tinutukoy ng “Israel” pagkakahati ng kaharian
  choice: Pinanatili ang “Israel” bilang tawag sa katunggaling politikal na pangkat.
  alternative: “mga lipi sa hilaga” o “mga naghimagsik na Israelita”
  rationale: “Israel” mismo ang tawag ng tekstong Hebreo. Ang pagpapanatili nito ay umiiwas sa pagdaragdag ng mapanghusga o masyadong paliwanag na katawagan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “sambayanan” upang maipahayag ang kolektibong diwa ng Hebreong בֵּית nang hindi maging mekanikal, at “piling mandirigma” upang maikli ngunit tumpak na maihatid ang pariralang militar.
