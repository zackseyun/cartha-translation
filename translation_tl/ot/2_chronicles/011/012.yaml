  text: And in every city he put shields and spears[a], and he strengthened them very greatly; and Judah and Benjamin belonged to him.
translation:
  language: tl
  text: Sa bawat lungsod ay naglagay siya ng mga kalasag at mga sibat, at lubha niyang pinatibay ang mga lungsod. Ang Juda at Benjamin ay nasa ilalim ng kanyang pamamahala.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/בְ/כָל עִיר וָ/עִיר
  choice: Sa bawat lungsod
  rationale: Ang pag-uulit na עִיר וָעִיר ay distributibo. Likas na naipahahayag sa modernong Tagalog ng “sa bawat lungsod” ang diin na ginawa ito sa bawat isang lungsod, nang hindi ginagaya ang di-likas na pag-uulit.
- source_word: צִנּוֹת
  choice: mga kalasag
  rationale: Tumutukoy ang salita sa mga kalasag, marahil malalaking panangga, ngunit hindi kailangang idagdag ang sukat dahil hindi iyon tahasang tinutukoy sa talata.
- source_word: וּ/רְמָחִים
  choice: mga sibat
  rationale: Ang “mga sibat” ang malinaw at karaniwang modernong katumbas ng רְמָחִים.
- source_word: וַֽ/יְחַזְּקֵם
  choice: pinatibay ang mga iyon
  rationale: Ang hulaping pangmaramihan ay tumutukoy sa mga lungsod. Ang “pinatibay” ay natural sa kontekstong militar at pinananatili ang ideya ng pagpapalakas sa mga ito.
- source_word: לְ/הַרְבֵּה מְאֹד
  choice: lubha
  rationale: Inihahatid ng “lubha” ang matinding pagpapalakas na ipinahahayag ng pinagsamang לְהַרְבֵּה at מְאֹד sa maikli at marangal na Tagalog.
- source_word: וַ/יְהִי ל֖/וֹ יְהוּדָה וּ/בִנְיָמִן
  choice: Nanatiling nasa ilalim ng kanyang pamamahala ang Juda at Benjamin
  rationale: Ipinahahayag ng idyomang ויהי לו ang pag-aari, pagkontrol, o katapatan sa hari. Sa kontekstong pampolitika, malinaw na ipinapakita ng “nasa ilalim ng kanyang pamamahala” ang kahulugan nang hindi nagpapahiwatig ng literal na pag-aari sa mga lupain o mga tao; ipinahihiwatig rin ng “nanatili” ang patuloy na katapatan sa konteksto.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa salaysay na pangkasaysayan. Ginamit ang “lungsod,” “kalasag,” “sibat,” at “pinatibay” bilang karaniwan at madaling maunawaang bokabularyo. Walang talababa dahil ang distributibong pag-uulit sa Hebreo ay sapat na naihahatid ng natural na “bawat.”
