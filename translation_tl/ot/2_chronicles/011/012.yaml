  source_fidelity: 'Tumpak ang karamihan ng mga katumbas: ang “mga kalasag,” “mga sibat,” at ang pagpapalakas nang lubha ay umaayon sa Hebreo. Gayunman, ang “Nanatiling” ay nagdaragdag ng aspektong temporal na wala sa וַיְהִי לוֹ. Bukod dito, ang “mga iyon” ay maaaring tumukoy sa mga kalasag at sibat, samantalang ang hulaping pangmaramihan sa וַיְחַזְּקֵם ay pinakamalinaw na tumutukoy sa mga lungsod/kuta sa konteksto.'
  naturalness: Likas at angkop sa modernong Filipino Tagalog ang pangunahing register. Mas malinaw at mas natural sa talatang ito na tahasang banggitin muli ang “mga lungsod” sa ikalawang sugnay upang maiwasan ang maling sanggunian.
  terminology: Ang “lungsod,” “kalasag,” “sibat,” at “pinatibay” ay angkop. Ang “nasa ilalim ng kanyang pamamahala” ay wastong paraan upang ipahayag ang politikal na saklaw o katapatan sa idyomang וַיְהִי לוֹ nang hindi ipinahihiwatig ang literal na pagmamay-ari.
  issues:
