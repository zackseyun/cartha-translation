base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/015.yaml
  text: And he appointed for himself priests for the high places[a], for the goat-demons, and for the calves that he had made.
translation:
  language: tl
  text: Nagtalaga siya para sa sarili niya ng mga pari para sa mga mataas na dako, para sa mga demonyong anyong-kambing[a], at para sa mga guya na ginawa niya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga satyr” o “mga kambing.” Ang salitang Hebreo ay maaaring tumukoy sa mga nilalang na anyong kambing na kaugnay ng ipinagbabawal na pagsamba.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֶד
  choice: Nagtalaga
  rationale: Sa kontekstong ang tuwirang layon ay mga pari, ipinahihiwatig ng pandiwa ang paghirang o pagtatalaga sa tungkulin, hindi lamang ang pagpapatayo.
- source_word: לּוֹ
  choice: para sa sarili niya
  rationale: Ipinakikita ng datibo na ginawa niya ang pagtatalaga para sa sarili niyang layunin o kapakanan; natural na naihahayag ito sa modernong Tagalog sa reflexive na parirala.
- source_word: כֹּהֲנִים
  choice: mga pari
  rationale: Karaniwang katawagan sa Tagalog para sa tungkuling panrelihiyon na tinutukoy ng Hebreo.
- source_word: לַבָּמוֹת
  choice: para sa matataas na sambahan
  rationale: Ang בָּמוֹת ay mga lugar ng kultikong pagsamba na tradisyonal na tinatawag na mga mataas na dako; mas malinaw sa karaniwang mambabasa ang 'matataas na sambahan' habang pinananatili ang pisikal at panrelihiyong diwa.
- source_word: לַשְּׂעִירִים
  choice: para sa mga demonyong kambing
  rationale: Sa konteksto ng ipinagbabawal na pagsamba, maaaring tumukoy ang salita sa mga nilalang o imaheng mala-kambing na kaugnay ng kulto, hindi lamang sa literal na mga kambing.
- source_word: וְלָעֲגָלִים
  choice: at para sa mga guya
  rationale: Literal na nangangahulugang mga guya ang salita; hinahayaang ipakita ng konteksto na mga larawang sinasamba ang mga ito sa halip na idagdag iyon sa pangunahing teksto.
- source_word: אֲשֶׁר עָשָׂה
  choice: na ginawa niya
  rationale: Natural at sapat sa Tagalog ang aspektong perpektibo upang tukuyin ang mga bagay na ginawa na bago o kaugnay ng pagtatalaga sa mga pari.
theological_decisions:
- issue: Kahulugan ng שְׂעִירִים sa konteksto ng pagsambang idolatroso
  choice: mga demonyong kambing
  alternative: mga kambing; mga satyr; mga nilalang na mala-kambing
  rationale: Mas malamang na kultikong mga nilalang o imaheng mala-kambing ang tinutukoy kaysa karaniwang hayop. Pinananatili ng salin ang ugnayan sa kambing at ang posibleng espirituwal na diwa, habang inilalahad sa talababa ang tunay na leksikal na lawak.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang 'matataas na sambahan' sa halip na mas malabong 'matataas na dako' upang madaling maunawaan ang kultikong gamit, at pinanatili sa talababa ang kalabuan ng katawagang Hebreo para sa שְׂעִירִים.
