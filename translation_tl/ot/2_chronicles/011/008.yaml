  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֶת
  choice: ang …, …, at …
  rationale: Ang אֵת ay pananda ng tiyak na tuwirang layon, at ang וְ ay nag-uugnay sa mga pangalan sa talaan. Sa Tagalog, ipinapakita ang tungkulin nito sa pamamagitan ng pantukoy na “ang” at ng likas na pagkakaugnay ng talaan, kasama ang “at” bago ang huling pangalan.
- source_word: גַּת
  choice: Gat
  rationale: Pangalan ng lugar; isinatinig ayon sa anyong karaniwang ginagamit sa mga saling Tagalog at malapit sa Hebreong bigkas.
- source_word: מָרֵשָׁה
  choice: Maresha
  rationale: Pangalan ng lungsod sa Juda; tuwirang transliterasyon sa paraang natural basahin sa Tagalog.
- source_word: זִיף
  choice: Zif
  rationale: Pangalan ng lugar; transliterasyong angkop sa ortograpiyang Tagalog, kung saan ang huling tunog na /f/ ay kinakatawan ng “f”.
theological_decisions: []
translation_notes:
  register: Maikli at tuwirang pagpapatuloy ng talaan ng mga lungsod. Gumamit ng makabagong, dignificado, at madaling basahing Tagalog; walang idinagdag na pandiwa dahil wala ito sa ibinigay na pariralang Hebreo at nakasalalay ang talata sa sintaks ng naunang talata.
