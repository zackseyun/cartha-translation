base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/015.yaml
  text: Then the men of Judah raised a shout, and when the men of Judah shouted, God struck down Jeroboam and all Israel before Abijah and Judah.
translation:
  language: tl
  text: Nagpakawala ng malakas na sigaw ang mga lalaki ng Juda. Nang magpakawala ng malakas na sigaw ang mga lalaki ng Juda, pinabagsak ng Diyos si Jeroboam at ang buong Israel sa harap ni Abias at ng Juda.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּרִיעוּ / בְּהָרִיעַ
  choice: Sumigaw / Nang sumigaw
  rationale: Ang רוע sa kontekstong pandigmaan ay tumutukoy sa malakas na sigaw. Pinananatili ng pag-uulit ang diin ng Hebreo habang natural sa Tagalog.
- source_word: אִישׁ יְהוּדָה
  choice: mga tauhan ng Juda / sila
  rationale: Kolektibo ang isahan sa Hebreo at tumutukoy sa mga mandirigma ng Juda. Ginamit ang “sila” sa ikalawang banggit upang maiwasan ang mabigat na pag-uulit nang hindi binabago ang tinutukoy.
- source_word: נָגַף
  choice: tinalo
  rationale: Sa salaysay ng labanan, ipinahihiwatig ng pandiwa na pinabagsak o ginapi ng Diyos ang kalaban; ang “tinalo” ay malinaw at hindi kinakailangang mangahulugang pinatay ang bawat isa.
- source_word: לִפְנֵי
  choice: sa harap ni
  rationale: Pinananatili ang larawang spatial at idiomatikong pahayag ng Hebreo na ang pagkatalo ay naganap sa harap o presensiya ng hukbo ni Abias at ng Juda.
theological_decisions:
- issue: Tahasang pagkilos ng Diyos sa tagumpay
  choice: tinalo ng Diyos
  alternative: natalo ... sa tulong ng Diyos
  rationale: Tahasan sa Hebreo na ang Diyos ang simuno ng נָגַף. Hindi ito pinalalabo bilang di-tuwirang tulong lamang.
- issue: Ugnayan ng sigaw ng Juda at pagkilos ng Diyos
  choice: Nang sumigaw sila, tinalo ng Diyos
  alternative: Dahil sumigaw sila, tinalo ng Diyos
  rationale: Ang בְּ infinitive ay nagtatakda ng panahon o kasabay na pangyayari; hindi dapat dagdagan ng tiyak na sanhi na hindi tahasang sinasabi ng teksto.
translation_notes:
  register: Modernong Filipino na tuwiran, marangal, at madaling maunawaan. Pinanatili ang pangalang “Abias,” ang karaniwang anyong Tagalog ng Abijah, at ang kolektibong “Juda” bilang bayan/hukbo.
