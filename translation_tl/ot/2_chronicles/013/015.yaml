  naturalness: Natural at malinaw ang pangungusap, ngunit mas tuwiran at mas tapat sa inuulit na Hebreo ang pag-uulit ng “mga lalaki ng Juda” sa halip na panghalip na “sila.” Ang “nagpakawala ng malakas na sigaw” ay likas na modernong Filipino para sa sigaw-pandigmaan.
  terminology: Pinananatili ang “Diyos,” “Jeroboam,” “Abias,” at “Juda.” Ang “pinabagsak” ay mas angkop na katumbas ng נָגַף kaysa “tinalo,” nang hindi ipinapahiwatig na ang bawat Israelita ay napatay.
