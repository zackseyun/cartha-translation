  text: הֲ/לֹ֤א הִדַּחְתֶּם֙ אֶת כֹּהֲנֵ֣י יְהוָ֔ה אֶת בְּנֵ֥י אַהֲרֹ֖ן וְ/הַ/לְוִיִּ֑ם וַ/תַּעֲשׂ֨וּ לָ/כֶ֤ם כֹּהֲנִים֙ כְּ/עַמֵּ֣י הָ/אֲרָצ֔וֹת כָּל הַ/בָּ֗א לְ/מַלֵּ֨א יָד֜/וֹ בְּ/פַ֤ר בֶּן בָּקָר֙ וְ/אֵילִ֣ם שִׁבְעָ֔ה וְ/הָיָ֥ה כֹהֵ֖ן לְ/לֹ֥א אֱלֹהִֽים־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/009.yaml
  text: Have you not driven out the priests of Yahweh[a], the sons of Aaron and the Levites[b], and made priests for yourselves like the peoples of the lands? Whoever comes to fill his hand with a young bull and seven rams becomes a priest of what are not gods.
translation:
  language: tl
  text: Hindi ba ninyo itinaboy ang mga pari ni Yahweh—ang mga anak ni Aaron—at ang mga Levita, at nagtalaga kayo para sa inyong sarili ng mga pari tulad ng mga mamamayan ng mga lupain? Sinumang dumarating upang maitalaga bilang pari[a] sa pamamagitan ng isang batang toro at pitong lalaking tupa ay nagiging pari ng mga hindi diyos.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “punuin ang kanyang kamay,” isang teknikal na pananalita para sa pagtatalaga o pagluklok sa tungkuling pari.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “pari para sa mga di-diyos” o “pari ng mga huwad na diyos.” Literal na itinatanggi ng Hebreo na tunay na mga diyos ang mga ito.
    reason: alternative_reading
lexical_decisions:
- source_word: הֲלֹא
  choice: Hindi ba ninyo
  rationale: Likas na anyo sa Tagalog ng retorikal na tanong na umaasang sasang-ayon ang kausap at nagpapanatili ng tono ng pagsaway.
- source_word: הִדַּחְתֶּם
  choice: itinaboy
  rationale: Ipinahihiwatig ng Hiphil ng נדח ang sapilitang pagpapaalis; malinaw at karaniwan ang “itinaboy” sa modernong Tagalog.
- source_word: כֹּהֲנֵי יְהוָה
  choice: mga pari ni Yahweh
  rationale: Tuwirang isinasalin ang ugnayang construct at pinananatili ang personal na pangalang Yahweh.
- source_word: בְּנֵי אַהֲרֹן
  choice: mga anak ni Aaron
  rationale: Pinananatili ang pormal na katawagang pangangkan at ang kahalagahan ng linya ni Aaron sa pagkasaserdote.
- source_word: וְהַלְוִיִּם
  choice: at ang mga Levita
  rationale: Pinananatiling hiwalay ang pagbanggit sa mga Levita kasunod ng mga anak ni Aaron.
- source_word: וַתַּעֲשׂוּ לָכֶם כֹּהֲנִים
  choice: at nagtalaga kayo para sa inyong sarili ng mga pari
  rationale: Sa kontekstong ito, ang עשה ay may diwang gumawa o humirang sa isang tungkulin. Ang “nagtalaga” ay natural sa Tagalog at pinananatili ng “para sa inyong sarili” ang mapansariling himig ng לָכֶם.
- source_word: כְּעַמֵּי הָאֲרָצוֹת
  choice: gaya ng ginagawa ng mga mamamayan ng ibang mga lupain
  rationale: Natural na ipinahahayag ang paghahambing sa mga nakapaligid na bayan nang hindi ipinapasok ang interpretatibong katawagang “pagano.”
- source_word: כָּל הַבָּא
  choice: Sinumang dumarating
  rationale: Ipinapahayag ang bukás at pangkalahatang saklaw ng konstruksyong isahan.
- source_word: לְמַלֵּא יָדוֹ
  choice: upang maitalaga bilang pari
  rationale: Teknikal na idyoma ito para sa pagtatalaga o pagluklok sa tungkuling pari. Inilalagay sa talababa ang literal na larawan upang hindi mawala ang anyo ng Hebreo.
- source_word: בְּפַר בֶּן בָּקָר
  choice: na may dalang isang batang toro
  rationale: Ang hayop ang kasangkapan o handog sa seremonya; malinaw sa Tagalog ang “may dalang,” at ang pariralang Hebreo ay karaniwang tumutukoy sa batang toro.
- source_word: וְאֵילִם שִׁבְעָה
  choice: at pitong lalaking tupa
  rationale: Tuwirang salin ng bilang at uri ng mga hayop; nililinaw ng “lalaking tupa” ang אֵילִם.
- source_word: וְהָיָה כֹהֵן
  choice: ay nagiging pari
  rationale: Ipinakikita ang resultang katayuan matapos ang seremonya.
- source_word: לְלֹא אֱלֹהִים
  choice: ng mga hindi naman diyos
  rationale: Pinananatili ang matalas na pagtanggi ng Hebreo na tunay na mga diyos ang mga sinasamba, sa halip na pakinisin lamang bilang “mga huwad na diyos.”
theological_decisions:
- issue: Pagsasalin sa pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Personal na pangalang tipan ang nasa tekstong Hebreo; ang “Yahweh” ay tuwirang transliterasyon na hindi pinapalitan ng isang titulo.
- issue: Diwa ng לְלֹא אֱלֹהִים
  choice: mga hindi naman diyos
  alternative: mga huwad na diyos; mga di-diyos
  rationale: Pinananatili nito ang polemikong pagtanggi sa kanilang pagka-diyos, nang hindi pinipili ang mas pinakinis ngunit bahagyang interpretatibong “mga huwad na diyos.”
- issue: Pagpapakahulugan sa לְמַלֵּא יָדוֹ
  choice: maitalaga bilang pari, na may literal na idyoma sa talababa
  alternative: punuin ang kanyang kamay; italaga ang sarili
  rationale: Teknikal na pananalita ito tungkol sa pagtatalaga sa tungkulin. Hindi tahasang sinasabi ng anyong Hebreo na ang tao mismo ang nagtatalaga sa sarili, kaya iniwasan ang ganitong dagdag na interpretasyon.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “pari” at “mga Levita” bilang karaniwang terminong biblikal. Ang mga dash sa “ang mga anak ni Aaron” ay nagpapakitang ito ay paglilinaw sa “mga pari ni Yahweh,” samantalang hiwalay ngunit kaugnay ang “mga Levita.”
