base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/020.yaml
  text: Jeroboam no longer retained strength in the days of Abijah[a], and Yahweh struck him, and he died.
translation:
  language: tl
  text: Hindi na muling nagkaroon ng lakas si Jeroboam sa panahon ni Abias. At sinaktan siya ni Yahweh[a], at namatay siya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “hinampas siya ni Yahweh” o “pinahirapan siya ni Yahweh.” “Sinaktan” lamang ang sinasabi ng Hebreo; hindi nito tinutukoy ang eksaktong paraan.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָצַר כֹּחַ
  choice: napanatili ang kanyang lakas
  rationale: Pinananatili nito ang diwa ng עָצַר bilang paghawak o pagpapanatili at ng כֹּחַ bilang lakas o kapangyarihan, nang hindi ito nililimitahan sa tagumpay militar.
- source_word: לֹא ... עוֹד
  choice: Hindi na
  rationale: Sa negatibong konstruksiyon, ang עוֹד ay likas na nangangahulugang 'hindi na' o 'hindi na muli.'
- source_word: בִּימֵי אֲבִיָּהוּ
  choice: noong panahon ni Abias
  rationale: Natural na modernong Tagalog para sa temporal na idyomang tumutukoy sa panahon o paghahari ni Abias.
- source_word: וַיִּגְּפֵהוּ
  choice: sinaktan siya
  rationale: Malawak ang saklaw ng נגף at maaaring tumukoy sa paghampas, pagpapahirap, salot, o pagkatalo. Pinananatili ng 'sinaktan' ang kawalan ng espesipikong paraan sa Hebreo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang transliterasyon ng personal na pangalang Hebreo sa halip na palitan ito ng isang titulo.
- source_word: וַיָּמֹת
  choice: at namatay siya
  rationale: Tuwirang isinasalin ang sunod na pangyayari sa salaysay nang hindi ipinapalagay ang eksaktong paraan o agwat bago ang kamatayan.
theological_decisions:
- issue: Uri ng pagkilos ni Yahweh sa וַיִּגְּפֵהוּ יְהוָה
  choice: Tuwirang sinasabi na sinaktan ni Yahweh si Jeroboam, at pagkatapos ay namatay siya, ngunit hindi tinutukoy ang paraan.
  alternative: Pinadalhan siya ni Yahweh ng salot o karamdaman; o agad siyang pinatay ni Yahweh sa labanan o paghatol.
  rationale: Iniuugnay ng Hebreo kay Yahweh ang pagkakasakit, pagbagsak, o hampas kay Jeroboam, ngunit hindi nito nililinaw kung ito ay sa pamamagitan ng sakit, sugat sa labanan, o ibang paraan. Ang 'at' ay nagpapanatili rin ng salaysay na pagkakasunod nang hindi tahasang ginagawang layunin o agarang resulta ang kamatayan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang 'Abias,' ang karaniwang anyong Tagalog ng pangalang Abijah. Pinanatili ang payak na koordinasyong 'At ... at ...' upang masalamin ang Hebreong salaysay at maiwasang tukuyin nang higit sa teksto ang kaugnayan ng banal na hampas at kamatayan.
