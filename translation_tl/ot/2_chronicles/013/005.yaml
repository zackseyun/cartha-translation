  source_fidelity: Tumpak na naipapahayag ang retorikal na tanong, ang pagkakaloob ni Yahweh ng paghahari sa Israel kay David, ang saklaw na “magpakailanman,” ang “sa kanya at sa kanyang mga anak,” at ang literal na idiomang “tipan ng asin.” Ang “paghahari sa Israel” ay angkop na tumutukoy sa maharlikang pamumuno sa Israel.
  naturalness: Natural at marangal ang modernong Filipino Tagalog. Ang ayos na “ibinigay ni Yahweh, ang Diyos ng Israel, kay David ang paghahari” ay malinaw at katanggap-tanggap; ang mga gitling ay nakatutulong upang maging malinaw ang magkakaugnay na parirala.
  terminology: Wastong pinanatili ang “Yahweh,” “Diyos ng Israel,” “paghahari,” at “tipan ng asin.” Ang talababa sa “mga anak” ay nagpapaliwanag ng dinastikong diwa nang hindi pinapalitan ang literal na salita sa teksto, at ang talababa sa “tipan ng asin” ay maingat na nagpapaliwanag ng idyoma.
