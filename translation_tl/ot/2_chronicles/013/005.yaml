language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: הֲ/לֹ֤א לָ/כֶם֙ לָ/דַ֔עַת כִּ֞י יְהוָ֣ה אֱלֹהֵ֣י יִשְׂרָאֵ֗ל נָתַ֨ן מַמְלָכָ֧ה לְ/דָוִ֛יד עַל יִשְׂרָאֵ֖ל לְ/עוֹלָ֑ם ל֥/וֹ וּ/לְ/בָנָ֖י/ו בְּרִ֥ית מֶֽלַח׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/005.yaml
  text: Do you not know that Yahweh[a], the God of Israel, gave the kingdom over Israel to David forever, to him and to his sons[b], by a covenant of salt?
translation:
  language: tl
  text: Hindi ba ninyo alam na ibinigay ni Yahweh, ang Diyos ng Israel, kay David ang paghahari sa Israel magpakailanman—sa kanya at sa kanyang mga anak[a]—sa pamamagitan ng isang tipan ng asin[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “kanyang mga anak” ay tumutukoy sa maharlikang angkan o dinastiya ni David.
    reason: cultural_note
  - marker: b
    text: Maaari ring “sa isang tipan ng asin.” Malamang na tumutukoy ang pananalitang ito sa isang tipang may-bisa at pangmatagalan; ihambing sa Bilang 18:19.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא לָכֶם לָדַעַת
  choice: Hindi ba ninyo alam
  rationale: Pinananatili ang retorikal na tanong na umaasang sasang-ayon ang kausap, sa natural na modernong Tagalog.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang transliterasyon ng personal na pangalan ng Diyos sa tekstong Hebreo, sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ang Diyos ng Israel
  rationale: Likas na salin ng pariralang konstrukto na nagpapakilala kay Yahweh bilang Diyos ng Israel.
- source_word: נָתַן מַמְלָכָה
  choice: ibinigay ... ang paghahari
  rationale: Ang “paghahari” ay nakatuon sa karapatan at kapangyarihang mamuno na ipinagkaloob kay David, hindi lamang sa lupain o nasasakupan.
- source_word: עַל יִשְׂרָאֵל
  choice: sa Israel
  rationale: Kasama ng “paghahari,” natural nitong ipinahahayag ang pamumuno sa Israel.
- source_word: לְעוֹלָם
  choice: magpakailanman
  rationale: Pinananatili ang mariing pahayag ng teksto tungkol sa walang-hanggang bisa ng pagkakaloob.
- source_word: לוֹ וּלְבָנָיו
  choice: sa kanya at sa kanyang mga anak
  rationale: Pinananatili ang literal na “mga anak,” habang ipinapaliwanag sa talababa ang dinastikong diwa nito sa konteksto.
- source_word: בְּרִית מֶלַח
  choice: sa pamamagitan ng isang tipan ng asin
  rationale: Pinananatili ang natatanging larawang Hebreo sa pangunahing teksto sa halip na palitan agad ng interpretasyong “pangmatagalang tipan.”
theological_decisions:
- issue: Ang walang-hanggang pagkakaloob ng paghahari kay David
  choice: Isinalin nang tuwiran ang “magpakailanman” at pinanatili ang “tipan ng asin.”
  alternative: Ipaliwanag sa pangunahing teksto bilang isang permanenteng tipan at gawing “mga inapo” ang “mga anak.”
  rationale: Pinananatili nito ang mismong wikang pangtipan at ang tensiyong teolohikal ng Hebreo nang hindi ipinapasok sa salin ang mga konklusyon mula sa mga susunod na teksto.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “paghahari” upang natural na ipahayag ang royal rule, at pinanatili ang literal na idyomang “tipan ng asin,” na ipinaliwanag sa talababa.
