base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/019.yaml
  text: 'Abijah pursued Jeroboam and captured from him cities: Bethel and its daughter towns, Jeshanah and its daughter towns, and Ephron and its daughter towns.'
translation:
  language: tl
  text: 'Hinabol ni Abias si Jeroboam at nasakop niya mula kay Jeroboam ang mga lunsod: Bethel at ang mga bayang sakop nito, Jesana at ang mga bayang sakop nito, at Efron at ang mga bayang sakop nito.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּרְדֹּף ... אַחֲרֵי
  choice: Hinabol
  rationale: Likas at tuwirang salin ng paghabol ni Abias kay Jeroboam.
- source_word: וַיִּלְכֹּד מִמֶּנּוּ
  choice: inagaw sa kanya
  rationale: Ipinahihiwatig ng pandiwa sa kontekstong pandigma ang pagsakop at pagkuha ng mga lungsod mula sa kapangyarihan ni Jeroboam.
- source_word: עָרִים
  choice: ang mga lungsod na ito
  rationale: Pinananatili ang tahasang pangkalahatang katawagang 'mga lungsod' bago ang kasunod na talaan.
- source_word: בְּנוֹתֶיהָ
  choice: ang mga bayang sakop nito
  rationale: Ang literal na 'mga anak na babae nito' ay isang idyoma para sa mga nakapalibot o dependiyenteng pamayanan; malinaw at natural itong naipapahayag bilang mga bayang sakop.
- source_word: אֲבִיָּה / יָרָבְעָם / בֵּית אֵל / יְשָׁנָה / עפרון
  choice: Abias / Jeroboam / Bethel / Jesana / Efron
  rationale: Ginamit ang karaniwang anyong Filipino ng mga pangalang biblikal; ang ketiv na עפרון ay isinaling Efron.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at madaling maunawaan. Ang idyomang Hebreo na 'mga anak na bayan' ay ginawang 'mga bayang sakop nito' nang hindi nagdaragdag ng teolohikal na pagpapakahulugan.
