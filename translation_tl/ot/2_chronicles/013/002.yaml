  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: שָׁל֣וֹשׁ שָׁנִ֗ים מָלַךְ֙ בִּ/יר֣וּשָׁלִַ֔ם וְ/שֵׁ֣ם אִמּ֔/וֹ מִיכָיָ֥הוּ בַת אוּרִיאֵ֖ל מִן גִּבְעָ֑ה וּ/מִלְחָמָ֥ה הָיְתָ֛ה בֵּ֥ין אֲבִיָּ֖ה וּ/בֵ֥ין יָרָבְעָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/002.yaml
  text: He reigned three years in Jerusalem[a], and his mother’s name was Micaiah daughter of Uriel from Gibeah. And there was war between Abijah and Jeroboam.
translation:
  language: tl
  text: Tatlong taon siyang naghari sa Jerusalem, at ang pangalan ng kanyang ina ay Micaias, na anak na babae ni Uriel na taga-Gibea.[a] At nagkaroon ng digmaan sa pagitan nina Abias at Jeroboam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa katumbas na salaysay sa 1 Hari 15:2, Maaca ang pangalan ng ina ni Abias. Maaari ring gamitin nang mas malawak ang Hebreong salita para sa “anak na babae” upang tumukoy sa isang babaeng inapo, kaya maaaring magkaiba ang dalawang salaysay dahil sa paraan ng paggamit ng mga pangalan o pagtatala ng angkan.
    reason: alternative_reading
lexical_decisions:
- source_word: מָלַךְ
  choice: naghari
  rationale: Karaniwang salin ito ng pandiwang tumutukoy sa pamamahala bilang hari at natural sa pormulang nagsasaad ng tagal ng paghahari.
- source_word: וְשֵׁם אִמּוֹ
  choice: at ang pangalan ng kanyang ina ay
  rationale: Pinananatili nito ang pormulang pangangkanan ng Hebreo sa malinaw at likas na modernong Tagalog.
- source_word: מִיכָיָהוּ
  choice: Micaias
  rationale: Gumagamit ng anyong pangalang angkop sa nakagawiang pagsasalin ng mga pangalang biblikal sa Tagalog, habang kinakatawan ang pangalang Hebreo sa talatang ito.
- source_word: בַת אוּרִיאֵל
  choice: anak ni Uriel
  rationale: Tuwirang ipinapahayag ang kaugnayang pampamilya. Bagaman literal na 'anak na babae,' malinaw na babae ang tinutukoy dahil siya ang ina ni Abias, at mas natural sa Tagalog ang 'anak ni Uriel.'
- source_word: מִן גִּבְעָה
  choice: na mula sa Gibea
  rationale: Pinananatili ang tahasang diwa ng preposisyong מִן, 'mula sa,' at ikinakabit ang lugar kay Uriel ayon sa pinakamalapit na pagbasa ng parirala.
- source_word: וּמִלְחָמָה הָיְתָה
  choice: At nagkaroon ng digmaan
  rationale: Likas na Tagalog na katumbas ng payak na eksistensiyal na sugnay na 'at may digmaan,' nang hindi nagdaragdag kung nagsimula o nagpatuloy ang labanan.
- source_word: בֵּין ... וּבֵין
  choice: sa pagitan nina ... at ...
  rationale: Ang 'nina ... at ...' ay natural na Tagalog para sa magkatunggaling mga taong kapuwa pinangalanan.
- source_word: אֲבִיָּה
  choice: Abias
  rationale: Kinakatawan ang anyong pangalan sa Mga Cronica at hindi ipinapasok ang naiibang anyo ng pangalan sa tradisyon ng Mga Hari.
theological_decisions:
- issue: Pagkakaiba ng pangalan ng ina ni Abias sa Mga Cronica at sa katumbas na salaysay sa Mga Hari
  choice: Pinanatili sa pangunahing teksto ang 'Micaias, na anak ni Uriel na mula sa Gibea.'
  alternative: Itugma ang pangalan kay Maaca sa 1 Hari 15:2, o ipakahulugan sa pangunahing teksto ang 'anak' bilang mas malayong inapo.
  rationale: Dapat katawanin ng salin ang mismong Hebreong teksto ng Mga Cronica at huwag palihim na pagtugmain ang magkaibang salaysay. Posibleng mas malawak ang saklaw ng בַת sa ilang talaangkanan, ngunit 'anak' lamang ang tahasang sinasabi rito; ang tensiyon ay ipinaliliwanag sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang mga likas na pormulang 'naghari,' 'ang pangalan ng kanyang ina,' at 'nagkaroon ng digmaan,' habang pinananatili ang payak na ayos at hindi nilulutas sa pangunahing teksto ang pagkakaiba sa 1 Hari 15:2.
