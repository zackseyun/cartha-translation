translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa salaysay. Ginamit ang “Abias” at “Jeroboam” bilang karaniwang anyong Tagalog ng mga pangalan. Pinanatili ang napakalalaking bilang ayon sa tekstong Masoretiko at hindi sinubukang ipaliwanag o baguhin ang mga ito.
