base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/003.yaml
  text: Abijah joined battle with an army of four hundred thousand chosen men[a], mighty warriors; and Jeroboam drew up for battle against him with eight hundred thousand chosen men[b], mighty men of valor.
translation:
  language: tl
  text: Nakipaglaban si Abias kasama ang isang hukbo na binubuo ng apatnaraang libong piling magigiting na mandirigma[a]; at pumuwesto si Jeroboam upang makipaglaban sa kanya kasama ang walongdaang libong piling magigiting na mandirigma.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin ang “Nakipaglaban” bilang “sumabak sa labanan.” Literal sa Hebreo, “itinali ang labanan.”
    reason: lexical_alternative
  - marker: b
    text: Ang “mandirigmang magigiting” ay salin ng isang ekspresyong militar sa Hebreo para sa matatapang at mahuhusay na kawal.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֶּאְסֹר אֶת־הַמִּלְחָמָה
  choice: Nakipaglaban
  rationale: Ang literal na diwang “itinali ang labanan” ay isang idyomang militar para sa pagsabak o pakikipaglaban; natural at malinaw sa modernong Tagalog ang “nakipaglaban.”
- source_word: בְּחַיִל
  choice: kasama ang isang hukbo
  rationale: Sa konteksto ng bilang ng mga kawal, ang חַיִל ay tumutukoy sa puwersang militar o hukbo, hindi sa yaman o kagitingan.
- source_word: גִּבּוֹרֵי מִלְחָמָה
  choice: mandirigma
  rationale: Tumutukoy ang parirala sa mga lalaking bihasa at makapangyarihan sa digmaan. Iniiwasan ng salin ang mabigat at paulit-ulit na “makapangyarihang mandirigma” dahil ipinahahayag din ng “piling” ang kanilang natatanging kakayahan.
- source_word: אַרְבַּע מֵאוֹת אֶלֶף אִישׁ בָּחוּר
  choice: apatnaraang libong piling mandirigma
  rationale: Pinananatili ang tahasang bilang at isinasalin ang בָּחוּר bilang “piling,” na dito ay tumutukoy sa mga pinili o piling kawal.
- source_word: עָרַךְ עִמּוֹ מִלְחָמָה
  choice: pumuwesto ... upang makipaglaban sa kanya
  rationale: Ang עָרַךְ sa kontekstong militar ay pag-aayos o pagpuwesto ng mga hukbo sa hanay ng labanan; ipinapakita rin ng “sa kanya” ang pagharap kay Abias.
- source_word: בִּשְׁמוֹנֶה מֵאוֹת אֶלֶף אִישׁ בָּחוּר
  choice: kasama ang walongdaang libong piling mandirigma
  rationale: Natural na ipinahahayag sa Tagalog ang bilang ng mga piling kawal habang pinananatili ang nilalaman ng Hebreo.
- source_word: גִּבּוֹר חָיִל
  choice: mandirigmang magigiting
  rationale: Ang ekspresyon ay tumutukoy sa matatapang, malalakas, at may kakayahang kawal. Ang “magigiting” ay dignified at madaling maunawaan sa kasalukuyang Tagalog.
