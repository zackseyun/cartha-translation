  text: וְ/הִנֵּה֩ עִמָּ֨/נוּ בָ/רֹ֜אשׁ הָ/אֱלֹהִ֧ים וְ/כֹהֲנָ֛י/ו וַ/חֲצֹצְר֥וֹת הַ/תְּרוּעָ֖ה לְ/הָרִ֣יעַ עֲלֵי/כֶ֑ם בְּנֵ֣י יִשְׂרָאֵ֗ל אַל תִּלָּֽחֲמ֛וּ עִם יְהוָ֥ה אֱלֹהֵֽי אֲבֹתֵי/כֶ֖ם כִּי לֹ֥א תַצְלִֽיחוּ׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/012.yaml
  text: And behold[a], God is with us at our head, and his priests with the trumpets for the battle cry, to sound the alarm against you. Sons of Israel, do not fight against Yahweh, the God of your fathers, for you will not succeed.
translation:
  language: tl
  text: At narito, kasama namin ang Diyos at nangunguna siya sa amin; kasama rin namin ang kanyang mga pari na may mga trumpeta para sa hudyat ng pakikidigma, upang patunugin ang hudyat laban sa inyo. Mga anak na lalaki ng Israel[a], huwag kayong makipaglaban kay Yahweh, ang Diyos ng inyong mga ama, sapagkat hindi kayo magtatagumpay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Mga Israelita.” Sa Hebreo, literal na “mga anak na lalaki ng Israel,” isang panlalaking anyong maramihan na ginamit dito bilang tuwirang pagtawag sa mga Israelita.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: At narito
  rationale: Pinananatili ang mariing panandang pandiskurso na tumatawag ng pansin sa kasunod na pahayag.
- source_word: עִמָּנוּ בָרֹאשׁ הָאֱלֹהִים
  choice: kasama namin ang Diyos at nangunguna siya sa amin
  rationale: Ipinahahayag nang natural sa Tagalog ang presensiya ng Diyos at ang larawang siya ay nasa unahan o ulo ng hukbo.
- source_word: וְכֹהֲנָיו
  choice: kasama rin namin ang kanyang mga pari
  rationale: Ang hulaping panghalip ay tumutukoy sa Diyos; nilinaw ng pandiwang idinagdag sa Tagalog ang kaugnayan ng parirala nang hindi binabago ang diwa.
- source_word: וַחֲצֹצְרוֹת הַתְּרוּעָה
  choice: na may mga trumpeta para sa hudyat ng pakikidigma
  rationale: Ang mga trumpeta ay ginagamit sa malakas na hudyat o alarma; nililinaw ng konteksto na hudyat ito sa digmaan.
- source_word: לְהָרִיעַ עֲלֵיכֶם
  choice: upang magbigay ng babala laban sa inyo
  rationale: Pinananatiling hiwalay ang layuning ipinahahayag ng pawatas mula sa naunang parirala tungkol sa mga trumpeta, at inilalarawan ang mapanlabang hudyat.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: Mga anak na lalaki ng Israel
  rationale: Tahasang pinananatili ang panlalaking anyong maramihan at ang tuwirang pagtawag sa mga Israelita.
- source_word: אַל תִּלָּחֲמוּ עִם יְהוָה
  choice: huwag kayong makipaglaban kay Yahweh
  rationale: Ang עִם kasunod ng pandiwang 'makipaglaban' ay nagpapahiwatig ng pagkalaban, na likas nang malinaw sa konstruksiyong Tagalog.
- source_word: אֱלֹהֵי אֲבֹתֵיכֶם
  choice: ang Diyos ng inyong mga ama
  rationale: Pinananatili ang tradisyonal at tipanang pagtukoy sa Diyos na sinamba ng kanilang mga ama.
- source_word: כִּי לֹא תַצְלִיחוּ
  choice: sapagkat hindi kayo magtatagumpay
  rationale: Ang pandiwa ay nangangahulugang magtagumpay o umunlad; sa kontekstong militar, malinaw at hindi labis na makitid ang 'magtatagumpay.'
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang ginagamit ng talata ang Tetragrammaton; pinananatili ng 'Yahweh' ang pangalang tipan sa halip na palitan ito ng titulo.
- issue: Panlalaking pagtawag na בְּנֵי יִשְׂרָאֵל
  choice: Mga anak na lalaki ng Israel
  alternative: Mga anak ng Israel; Mga Israelita
  rationale: Pinananatili sa pangunahing teksto ang gramatikal na panlalaking maramihan, habang inilalagay sa talababa ang mas likas na alternatibo sa Tagalog.
translation_notes:
  register: Makabago at marangal na Filipino ang ginamit. Pinanatili ang retorikal na “At narito,” ang talinghaga ng Diyos na nangunguna sa hukbo, at ang magkahiwalay na konstruksiyon para sa mga trumpeta at sa layuning magbigay ng babala.
