id: 2CH.13.18
reference: 2 Chronicles 13:18
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יִּכָּנְע֥וּ בְנֵי יִשְׂרָאֵ֖ל בָּ/עֵ֣ת הַ/הִ֑יא וַ/יֶּֽאֶמְצוּ֙ בְּנֵ֣י יְהוּדָ֔ה כִּ֣י נִשְׁעֲנ֔וּ עַל יְהוָ֖ה אֱלֹהֵ֥י אֲבוֹתֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/018.yaml
  text: So the sons of Israel were subdued at that time, and the sons of Judah prevailed, because they relied on Yahweh, the God of their fathers.
translation:
  language: tl
  text: Kaya nang panahong iyon, napasuko ang mga Israelita, at nanaig ang mga taga-Juda dahil sumandig sila kay Yahweh, ang Diyos ng kanilang mga ninuno.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּכָּנְעוּ
  choice: napasuko
  rationale: Ipinahahayag ng Niphal ng כנע ang pagkapailalim o pagkakapagpakumbaba. Sa konteksto ng labanan, malinaw na ipinahihiwatig ng “napasuko” ang pasibong kinalabasan nang hindi pinalalabis na lubos silang nalipol.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: ang mga Israelita
  rationale: Likas at malinaw sa makabagong Tagalog; sa konteksto, tumutukoy ito sa mga kabilang sa hilagang kaharian ng Israel, hindi lamang sa literal na mga anak na lalaki.
- source_word: בָּעֵת הַהִיא
  choice: nang panahong iyon
  rationale: Natural na katumbas sa Tagalog ng panandang temporal na tumutukoy sa pangyayaring isinasalaysay.
- source_word: וַיֶּאֶמְצוּ
  choice: nanaig
  rationale: Ang אמץ ay may diwang pagiging malakas o pagtataglay ng lakas. Sa konteksto ng labanan, ipinapahayag ng “nanaig” ang bunga ng lakas ng Juda nang hindi nagdaragdag ng detalye tungkol sa paraan ng tagumpay.
- source_word: בְנֵי יְהוּדָה
  choice: ang mga taga-Juda
  rationale: Natural na tawag sa mga kabilang sa Juda at pinananatili ang malinaw na pagtutunggali nila sa mga Israelita.
- source_word: כִּי
  choice: dahil
  rationale: Tuwirang ipinakikilala ang dahilan kung bakit nanaig ang Juda.
- source_word: נִשְׁעֲנוּ עַל
  choice: sumandig sila kay
  rationale: Pinananatili ng “sumandig” ang konkretong larawan ng pag-asa o pagdepende sa isang maaasahang sandigan, gaya ng idyomang Hebreo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tinutumbasan ang Tetragrammaton bilang personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֵי אֲבוֹתֵיהֶם
  choice: ang Diyos ng kanilang mga ninuno
  rationale: Malinaw at likas na kolektibong pananalita sa makabagong Tagalog na pinananatili ang kaugnayang minana nila sa Diyos ng mga naunang salinlahi.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Personal na pangalan ang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang pangalan sa halip na palitan ito ng titulong “PANGINOON”; hindi rin ipinagpapalagay ang anyong “Jehova,” na nagmula sa mas huling kumbinasyon ng mga katinig at panandang patinig.
- issue: Kaugnayan ng tagumpay ng Juda sa kanilang pagsandig sa Diyos
  choice: 'Ipinahayag bilang tuwirang dahilan: “dahil sumandig sila kay Yahweh”'
  alternative: Mahinang ugnayan gaya ng “habang nagtitiwala sila”
  rationale: Ang כִּי ay nagpapakilala rito ng sanhi. Pinananatili ng salin ang hayag na teolohikal na paliwanag ng tagapagsalaysay nang hindi dinaragdagan ang sinabi tungkol sa uri o antas ng kanilang pananampalataya.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mga Israelita” at “mga taga-Juda” sa halip na literal ngunit di-likas na “mga anak,” at “sumandig” upang mapanatili ang metapora ng Hebreo.
