id: 2CH.13.10
reference: 2 Chronicles 13:10
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/אֲנַ֛חְנוּ יְהוָ֥ה אֱלֹהֵ֖י/נוּ וְ/לֹ֣א עֲזַבְנֻ֑/הוּ וְ/כֹ֨הֲנִ֜ים מְשָׁרְתִ֤ים לַֽ/יהוָה֙ בְּנֵ֣י אַהֲרֹ֔ן וְ/הַ/לְוִיִּ֖ם בַּ/מְלָֽאכֶת׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/010.yaml
  text: But as for us[a], Yahweh is our God, and we have not forsaken him; and the priests who minister to Yahweh are the sons of Aaron[b], and the Levites are in their work.
translation:
  language: tl
  text: Ngunit kami naman, si Yahweh ang aming Diyos, at hindi namin siya tinalikuran[a]. Ang mga paring naglilingkod kay Yahweh ay mga anak ni Aaron, at ang mga Levita ay gumaganap ng kanilang gawain[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “iniwan.”
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “ang mga Levita sa gawain,” ibig sabihin, abala sila sa nakatalagang paglilingkod.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנַחְנוּ
  choice: Ngunit kami naman
  rationale: Ipinahahayag ng pangatnig at tahasang panghalip ang paghahambing ng Juda sa hilagang kaharian; natural na naihahatid ito ng “Ngunit kami naman.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang kinakatawan ng Tetragrammaton sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֵינוּ
  choice: aming Diyos
  rationale: Bagaman anyong maramihan ang pangngalan, tumutukoy ito rito sa nag-iisang Diyos ng Israel, si Yahweh.
- source_word: וְלֹא עֲזַבְנֻהוּ
  choice: at hindi namin siya tinalikuran
  rationale: Ang עזב ay maaaring mangahulugang iwan o talikuran; ang “tinalikuran” ay angkop sa konteksto ng katapatan sa tipan at maaari ring magpahiwatig ng nagpapatuloy na kalagayan.
- source_word: מְשָׁרְתִים
  choice: naglilingkod
  rationale: Inilalarawan ng participle ang patuloy na paglilingkod ng mga pari sa pagsamba.
- source_word: בְּנֵי אַהֲרֹן
  choice: mga anak ni Aaron
  rationale: Malapit ito sa literal na Hebreo at pinananatili ang diwa ng namamanang linya ng pagkapari.
- source_word: וְהַלְוִיִּם בַּמְלָאכֶת
  choice: at ang mga Levita ay gumaganap ng kanilang gawain
  rationale: Ginagawang likas sa modernong Tagalog ang maikling pariralang Hebreo habang ipinahahayag na aktibo ang mga Levita sa nakatalagang paglilingkod.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehovah
  rationale: Tuwirang ginagamit ng talata ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng titulo.
- issue: Pamanahong diwa ng עֲזַבְנֻהוּ
  choice: hindi namin siya tinalikuran
  alternative: hindi namin siya iniwan
  rationale: Sa pahayag ni Abias, ang ganap na pandiwa ay may kasalukuyang kaugnayan at nagsasaad ng ipinagpapatuloy na katapatan; hindi ito nililimitahan sa isang nakaraang pangyayari lamang.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kami naman” upang ihayag ang kontras, at “gumaganap ng kanilang gawain” upang gawing natural ang eliptikong pariralang Hebreo nang hindi labis na nililimitahan ang kahulugan nito.
