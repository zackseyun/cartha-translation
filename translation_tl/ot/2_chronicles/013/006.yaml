base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/006.yaml
  text: Jeroboam son of Nebat[a], a servant of Solomon son of David, rose up and rebelled against his lord.
translation:
  language: tl
  text: Bumangon si Jeroboam na anak ni Nebat, na lingkod ni Solomon na anak ni David, at naghimagsik laban sa kanyang panginoon[a], si Solomon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O kaya, “kanyang amo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: Bumangon
  rationale: Pinananatili nito ang kilos ng pagsisimula ng pagsalungat nang hindi nililimitahan ang kahulugan sa isang pag-aaklas na militar.
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: Jeroboam na anak ni Nebat
  rationale: Isinatinig ang mga pangalang pantangi at tuwirang isinalin ang patronimiko.
- source_word: עֶבֶד
  choice: lingkod
  rationale: Sa konteksto ng paglilingkod sa hari, ang “lingkod” ay natural at sapat na malawak; hindi nito ipinapalagay na ang tinutukoy ay alipin bilang pag-aari.
- source_word: שְׁלֹמֹה בֶן דָּוִיד
  choice: Solomon na anak ni David
  rationale: Pinananatili ang tahasang ugnayang angkan at ang diin sa dinastiya ni David.
- source_word: וַיִּמְרֹד
  choice: naghimagsik
  rationale: Malinaw nitong ipinahahayag ang pagrerebelde laban sa kinikilalang awtoridad at angkop ito sa kontekstong pampolitika.
- source_word: עַל אֲדֹנָיו
  choice: laban sa kanyang panginoon
  rationale: Ipinapakita ng “panginoon” ang nakatataas na awtoridad ni Solomon. Ginamit ang maliit na titik sapagkat tao, hindi Diyos, ang tinutukoy; inilagay sa talababa ang posibleng saling “amo.”
theological_decisions:
- issue: Paglalarawan sa taong tinutukoy ng אֲדֹנָיו
  choice: kanyang panginoon
  alternative: kanyang amo
  rationale: Tumutukoy ang salita kay Solomon bilang nakatataas kay Jeroboam, hindi sa banal na pangalan o titulo. Pinananatili ng “panginoon” ang pormal na ugnayan ng awtoridad, samantalang tunay ding posibleng salin ang “amo.”
translation_notes:
  register: Makabago ngunit marangal na Filipino. Pinanatili ang maikling anyong pasalaysay ng Hebreo at iniwasang dagdagan ng paliwanag ang uri o lawak ng paghihimagsik.
