  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/יֶ֨תֶר֙ דִּבְרֵ֣י אֲבִיָּ֔ה וּ/דְרָכָ֖י/ו וּ/דְבָרָ֑י/ו כְּתוּבִ֕ים בְּ/מִדְרַ֖שׁ הַ/נָּבִ֥יא עִדּֽוֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/022.yaml
  text: The rest of the acts of Abijah[a], and his ways and his sayings, are written in the midrash of the prophet Iddo.
translation:
  language: tl
  text: Ang iba pang mga ginawa ni Abias, ang kanyang pamumuhay, at ang kanyang mga sinabi ay nakasulat sa midrash[a] ng propetang si Iddo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “paliwanag,” “paglalahad,” o sa mas pangkalahatang diwa, “tala.” Ang salitang Hebreo na midrash dito ay tumutukoy sa isang nakasulat na akdang mapagsiyasat o mapagpaliwanag, at hindi kinakailangang sa kalaunang anyo ng rabinikong midrash.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי אֲבִיָּה
  choice: Ang iba pang mga ginawa ni Abias
  rationale: Sa pormulang pangkasaysayan tungkol sa isang hari, ang דִּבְרֵי ay tumutukoy nang malawak sa kanyang mga gawa o kaganapan sa kanyang paghahari, hindi lamang sa mga salita. Hindi isinalin ang וְ bilang panimulang “At” dahil sapat na naipahihiwatig ng “iba pang” ang ugnayan sa naunang salaysay.
- source_word: וּדְרָכָיו
  choice: ang kanyang pamumuhay
  rationale: Ang pangmaramihang דְּרָכָיו, literal na “kanyang mga daan,” ay tumutukoy dito sa asal o takbo ng buhay. Mas likas at malinaw sa modernong Filipino ang “pamumuhay” habang pinananatili ang saklaw ng kahulugan.
- source_word: וּדְבָרָיו
  choice: at ang kanyang mga sinabi
  rationale: Dahil nakahiwalay ito sa unang דִּבְרֵי at sa “pamumuhay,” malamang na tumutukoy ito sa mga salita o pahayag ni Abias. Ang “mga sinabi” ay natural at hindi labis na nagpapakitid sa pormal na “mga kasabihan.”
- source_word: כְּתוּבִים
  choice: ay nakasulat
  rationale: Tuwirang tinutumbasan ang pasibong anyo ng כתב at pinananatili ang diin na nasa isang nakasulat na akda ang mga ito.
- source_word: בְּמִדְרַשׁ
  choice: sa midrash[a]
  rationale: Pinanatili ang natatanging terminong Hebreo upang hindi ito gawing karaniwang “tala” lamang. Ipinaliliwanag sa talababa na maaari itong tumukoy sa isang mapagsiyasat o mapagpaliwanag na akda at hindi kinakailangang sa kalaunang rabinikong genre.
- source_word: הַנָּבִיא עִדּוֹ
  choice: ng propetang si Iddo
  rationale: Likas na ayos ito sa Filipino para tukuyin ang akdang kaugnay o iniuugnay sa propetang si Iddo. Pinanatili ang pangalang Iddo sa karaniwang transliterasyon.
- source_word: אֲבִיָּה
  choice: Abias
  rationale: Ginamit ang nakasanayang anyong Filipino ng pangalang biblikal na Abijah, na malinaw at dignificado para sa ordinaryong mambabasa.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na dignificado at madaling maunawaan. Iniwasan ang masyadong literal ngunit di-likas na “kanyang mga daan,” habang pinanatili ang teknikal na “midrash” at nilinaw ito sa talababa.
