id: 2CH.13.8
reference: 2 Chronicles 13:8
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/עַתָּ֣ה אַתֶּ֣ם אֹֽמְרִ֗ים לְ/הִתְחַזֵּק֙ לִ/פְנֵי֙ מַמְלֶ֣כֶת יְהוָ֔ה בְּ/יַ֖ד בְּנֵ֣י דָוִ֑יד וְ/אַתֶּם֙ הָמ֣וֹן רָ֔ב וְ/עִמָּ/כֶם֙ עֶגְלֵ֣י זָהָ֔ב אֲשֶׁ֨ר עָשָׂ֥ה לָ/כֶ֛ם יָרָבְעָ֖ם לֵ/אלֹהִֽים׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/008.yaml
  text: And now you are saying that you are strong enough to stand against the kingdom of Yahweh in the hand of the sons of David[c][b][a], because you are a great multitude and have with you the golden calves that Jeroboam made for you as gods.
translation:
  language: tl
  text: At ngayon, sinasabi ninyong kaya ninyong lumaban[a] sa kaharian ni Yahweh na nasa kamay ng mga anak ni David[b], sapagkat napakarami ninyo at kasama ninyo ang mga gintong guya na ginawa ni Jeroboam para sa inyo bilang mga diyos.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sinasabi ninyong magpapakalakas kayo sa harap ng kaharian ni Yahweh.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “nasa kamay ng mga anak ni David,” isang idyoma para sa pamamahala sa pamamagitan ng angkan ni David.
    reason: cultural_note
  - marker: c
    text: O “upang maging mga diyos.” Maramihan ang anyo sa Hebreo at mapanuyang tumutukoy sa mga idolong guya ni Jeroboam.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹמְרִים
  choice: sinasabi ninyong
  rationale: Pinananatili nito ang aspektong patuloy o kasalukuyan ng participle at ang retorikal na diin ng pananalita ni Abias, nang hindi ito nililimitahan sa tahimik na balak lamang.
- source_word: לְהִתְחַזֵּק לִפְנֵי
  choice: kaya ninyong lumaban
  rationale: Sa kontekstong militar, ang Hitpael ng חזק kasama ng לִפְנֵי ay tumutukoy sa pagpapakalakas o pagpapakitang malakas sa harap ng isang kalaban. Ang “lumaban” ay likas sa modernong Tagalog, samantalang inilalahad sa talababa ang mas pormal na anyo ng larawang Hebreo.
- source_word: מַמְלֶכֶת יְהוָה
  choice: kaharian ni Yahweh
  rationale: Malapit ito sa Hebreo at malinaw na ipinapahayag na kay Yahweh ang kaharian.
- source_word: בְּיַד בְּנֵי דָוִיד
  choice: nasa kamay ng mga anak ni David
  rationale: Pinananatili ang larawang Hebreo at ang pahayag na ang kaharian ni Yahweh ay pinamamahalaan sa pamamagitan ng angkan ni David; nililinaw ng talababa ang idyoma.
- source_word: הָמוֹן רָב
  choice: napakarami ninyo
  rationale: Natural na Tagalog ito para sa malaking hukbo o karamihan at malinaw na itinatampok ang kanilang kalamangan sa bilang.
- source_word: עֶגְלֵי זָהָב
  choice: mga gintong guya
  rationale: Direkta, malinaw, at karaniwang tawag sa mga imaheng panrelihiyon na ginawa ni Jeroboam.
- source_word: לֵאלֹהִים
  choice: bilang mga diyos
  rationale: Pinananatili ang anyong maramihan at ang mapanuyang pagtukoy sa mga guya bilang mga diyos, nang hindi pinahihina ang polemikal na tono.
theological_decisions:
- issue: Pag-render sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehova
  rationale: Ginagamit ang personal na pangalang “Yahweh” upang katawanin nang tuwiran ang Tetragrammaton sa tekstong Hebreo.
- issue: Ang kaugnayan ng kaharian ni Yahweh sa dinastiya ni David
  choice: kaharian ni Yahweh na nasa kamay ng mga anak ni David
  alternative: kaharian ni Yahweh na pinamamahalaan ng mga anak ni David
  rationale: 'Pinananatili ng pangunahing teksto ang dalawang sangkap at ang tensiyong teolohikal: kay Yahweh ang kaharian, ngunit ito ay nasa kamay ng angkan ni David. Hindi nito ginagawang pag-aari ng mga Davidiko ang kaharian ni inaalis ang kanilang aktuwal na pamamahala.'
- issue: Ang maramihang אֱלֹהִים kaugnay ng mga gintong guya
  choice: bilang mga diyos
  alternative: upang maging mga diyos
  rationale: Pinananatili ang gramatikal na maramihan at ang polemikal na paglalarawan sa mga idolo, sa halip na gawing isahan o gawing neutral na “mga imahen.”
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “napakarami ninyo” sa halip na mas makalumang “isang malaking karamihan,” at pinanatili ang “nasa kamay” dahil mahalaga ang larawang teolohikal ng orihinal, na may paliwanag sa talababa.
