  source_fidelity: 'Tumpak na naihahatid ng salin ang panunuya ni Abias: ang hangaring humarap o lumaban sa kaharian ni Yahweh, ang pag-iral nito “sa kamay ng mga anak ni David,” ang kanilang malaking bilang, at ang mga gintong guya na ginawa ni Jeroboam para sa kanila bilang mga diyos. Hindi nito nilulutas o pinahihina ang teolohikal na tensiyon ng Hebreo.'
  naturalness: Likas at malinaw ang modernong Filipino Tagalog. Ang “sinasabi ninyong kaya ninyong lumaban” ay angkop na retorikal at pangmilitar na paglalahad ng konstruksyong Hebreo; ang “napakarami ninyo” ay natural na katumbas ng malaking karamihan sa kontekstong ito.
  terminology: Wasto at pare-pareho ang “Yahweh,” “kaharian,” “mga anak ni David,” at “mga gintong guya.” Ang “bilang mga diyos” ay pinananatili ang maramihang, polemikal na gamit ng לֵאלֹהִים. Malinaw rin at angkop ang mga talababa, kasama ang mga angkla.
