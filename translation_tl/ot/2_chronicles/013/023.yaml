base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/023.yaml
  text: And Abijah slept with his fathers[a], and they buried him in the City of David. And Asa his son reigned in his place. In his days the land had rest for ten years.
translation:
  language: tl
  text: At nahimlay si Abias kasama ng kanyang mga ninuno, at inilibing nila siya sa Lungsod ni David. At naghari bilang kahalili niya ang anak niyang si Asa. Noong mga araw niya, namahinga ang lupain sa loob ng sampung taon.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “naging tahimik ang lupain sa loob ng sampung taon.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב עִם אֲבֹתָיו
  choice: nahimlay ... kasama ng kanyang mga ninuno
  rationale: Pinananatili ng “nahimlay” ang Hebreong larawang eupemistiko para sa kamatayan, samantalang ang “mga ninuno” ay mas natural at malinaw sa modernong Filipino kaysa literal na “mga ama.”
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: inilibing nila siya
  rationale: Pinananatili ang aktibong pandiwang maramihan ng Hebreo kahit hindi tinutukoy kung sino ang gumawa.
- source_word: בְּעִיר דָּוִיד
  choice: sa Lungsod ni David
  rationale: Ito ang natural at nakaugaliang anyo ng pangalang-pook sa Filipino.
- source_word: וַיִּמְלֹךְ אָסָא בְנוֹ תַּחְתָּיו
  choice: naghari bilang kahalili niya ang anak niyang si Asa
  rationale: Ipinahahayag nito ang paghaharing humalili sa ama nang hindi nagdaragdag ng higit sa diwa ng Hebreo.
- source_word: בְּיָמָיו
  choice: Noong mga araw niya
  rationale: Malapit ito sa literal na anyo ng Hebreo at nananatiling malinaw sa konteksto ng paghahari ni Asa.
- source_word: שָׁקְטָה הָאָרֶץ
  choice: namahinga ang lupain
  rationale: Pinananatili ang idyomang nagpapahiwatig ng katahimikan at kawalan ng kaguluhan; inilalahad sa talababa ang mas tuwirang alternatibo.
- source_word: עֶשֶׂר שָׁנִים
  choice: sa loob ng sampung taon
  rationale: Natural na Filipino para sa haba ng panahong tinutukoy.
theological_decisions: []
translation_notes:
  register: Makabago at marangal na Filipino; pinanatili ang pormulang pangkamatayan at ang larawang “namahinga ang lupain” nang hindi ginagawang tahasang “namatay” o “nagkaroon ng kapayapaan.”
