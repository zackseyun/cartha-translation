  naturalness: Makabago, malinaw, at angkop ang rehistro. Mas natural at mas walang kalabuan ang “Nag-asawa siya ng labing-apat na asawa” sa kontekstong ito. Ang “naging ama siya ng” ay katanggap-tanggap at malinaw.
  terminology: Ang “Abias” ay nakasanayang Filipino na anyo ng pangalan. Ang “asawa,” “anak na lalaki,” at “anak na babae” ay angkop at tumpak. Ang talababa tungkol sa Hebreong idyoma ay kapaki-pakinabang, ngunit dapat tumugma ang kinalalagyan ng panandang b sa salitang “asawa.”
