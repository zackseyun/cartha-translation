base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/021.yaml
  text: And Abijah grew strong[b][a], and he took for himself fourteen wives and fathered twenty-two sons and sixteen daughters.
translation:
  language: tl
  text: Lalong lumakas si Abias[a]. Nag-asawa siya ng labing-apat na asawa[b], at naging ama siya ng dalawampu't dalawang anak na lalaki at labing-anim na anak na babae.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “naging makapangyarihan” o “pinatatag ang sarili.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “kumuha siya para sa sarili niya ng labing-apat na asawa,” isang idyomang nangangahulugang nagpakasal siya sa kanila.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְחַזֵּק
  choice: lalong lumakas
  rationale: Ang Hitpael ng חזק ay nagpapahiwatig na si Abias ay naging mas malakas o higit na matatag. Natural sa Filipino ang “lalong lumakas” at hindi nito nililimitahan ang diwa sa lakas na militar o kapangyarihang pampolitika lamang.
- source_word: אֲבִיָּהוּ
  choice: Abias
  rationale: Ginamit ang nakasanayang anyo ng pangalang ito sa mga saling Filipino, sa halip na ang tuwirang transliterasyong “Abiyahu.”
- source_word: וַיִּשָּׂא לוֹ נָשִׁים אַרְבַּע עֶשְׂרֵה
  choice: Nag-asawa siya ng labing-apat
  rationale: Ang נשא na may נשים ay idyomang tumutukoy sa pagkuha ng mga asawa, kaya malinaw at natural itong isinaling “nag-asawa.” Inilagay sa talababa ang mas literal na anyo upang mapanatili ang detalye ng לוֹ, “para sa sarili niya.”
- source_word: וַיּוֹלֶד
  choice: naging ama siya ng
  rationale: Ang Hiphil ng ילד na ang simuno ay lalaki ay nangangahulugang nagkaanak o naging ama. Ang “naging ama siya ng” ay malinaw, makabago, at mas tiyak kaysa sa payak na “nagkaroon.”
- source_word: עֶשְׂרִים וּשְׁנַיִם בָּנִים
  choice: dalawampu't dalawang anak na lalaki
  rationale: Tuwirang pinanatili ang bilang at ang tiyak na kasarian ng בָּנִים.
- source_word: וְשֵׁשׁ עֶשְׂרֵה בָּנוֹת
  choice: at labing-anim na anak na babae
  rationale: Tuwirang pinanatili ang bilang at ang tiyak na kasarian ng בָּנוֹת.
theological_decisions:
- issue: Paglalarawan sa pagkakaroon ng maraming asawa
  choice: Isinalaysay lamang na nag-asawa si Abias ng labing-apat, nang walang idinagdag na papuri o paghatol.
  alternative: Dagdagan ang salin ng tahasang moral na pagtatasa, o gawing mas literal na “kumuha siya para sa sarili niya ng labing-apat na asawa.”
  rationale: Iniuulat ng talata ang ginawa ni Abias ngunit hindi ito tahasang pinupuri o hinahatulan. Hindi dapat magdagdag ang salin ng pasyang teolohikal o etikal na wala sa teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang natural na “nag-asawa” sa pangunahing teksto, habang inilagay sa talababa ang mas literal na Hebreong idyoma. Ang “lalong lumakas” ay nagpapanatili sa lawak ng kahulugan nang hindi labis na tinutukoy kung militar, politikal, o panlipunan ang paglakas.
