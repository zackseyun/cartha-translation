  text: וַ/יָּנ֥וּסוּ בְנֵי יִשְׂרָאֵ֖ל מִ/פְּנֵ֣י יְהוּדָ֑ה וַ/יִּתְּנֵ֥/ם אֱלֹהִ֖ים בְּ/יָדָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/016.yaml
  text: And the sons of Israel fled before Judah[c][b][a], and God gave them into their hand.
translation:
  language: tl
  text: At tumakas ang mga anak ni Israel mula sa harap ng Juda, at ibinigay sila ng Diyos sa kamay ng Juda.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “sa kanilang kamay,” isang idyomang nangangahulugang nasa kanilang kapangyarihan o kontrol; ang tinutukoy ay ang Juda.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּנ֥וּסוּ
  choice: tumakas
  rationale: Ang נוּס ay tumutukoy sa pagtakas o pag-urong mula sa panganib, lalo na sa labanan; natural at malinaw sa modernong Filipino ang “tumakas.”
- source_word: בְנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Pinananatili nito ang pormal na ekspresyong Hebreo, samantalang nananatiling nauunawaan bilang katawagan sa mga Israelita.
- source_word: מִפְּנֵי יְהוּדָה
  choice: sa harap ng Juda
  rationale: Inilalarawan ng idyoma ang pagtakas sa harap o pagsulong ng Juda; ang salin ay malapit sa anyo ng Hebreo at angkop sa konteksto ng labanan.
- source_word: וַיִּתְּנֵם
  choice: ibinigay sila
  rationale: Tuwirang pinananatili ang נתן at ang layong panghalip na “sila,” pati ang tahasang pagkilos ng Diyos sa kinalabasan.
- source_word: אֱלֹהִים
  choice: Diyos
  rationale: אֱלֹהִים ang ginamit sa talata, hindi ang banal na pangalang YHWH.
- source_word: בְּיָדָם
  choice: sa kamay ng Juda
  rationale: Ang literal na “sa kanilang kamay” ay maaaring maging malabo sa Filipino dahil ang pinakamalapit na maramihang tinutukoy ay ang mga anak ni Israel. Nilinaw ang referent na Juda habang pinananatili ang Hebreong idyoma ng kamay bilang kapangyarihan o kontrol; itinatala sa talababa ang literal na anyo.
theological_decisions:
- issue: Pagkilos ng Diyos sa kinalabasan ng labanan
  choice: ibinigay sila ng Diyos
  alternative: pinahintulutan ng Diyos na mapasailalim sila
  rationale: Tahasang Diyos ang simuno ng נתן. Hindi ito dapat pahinain at gawing pahintulot lamang.
- issue: Katawagan sa pangkat ng tipan
  choice: mga anak ni Israel
  alternative: mga Israelita
  rationale: Pinananatili ang natatanging ekspresyong בְנֵי יִשְׂרָאֵל nang hindi ipinagpapalagay na kailangang gawing neutral na kolektibong katawagan.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “mga anak ni Israel” upang mapanatili ang anyong Hebreo, ngunit nilinaw ang malabong panghalip sa huling parirala bilang “kamay ng Juda.”
