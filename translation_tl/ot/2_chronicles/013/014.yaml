  yaml_path: translation/ot/2_chronicles/013/014.yaml
  text: When Judah turned around, behold, the battle was before them and behind them; and they cried out to Yahweh, and the priests were blowing the trumpets.
translation:
  language: tl
  text: Lumingon ang mga taga-Juda, at heto’t ang labanan ay nasa harapan at likuran nila. Sumigaw sila kay Yahweh, at ang mga pari ay humihip ng mga trumpeta.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּפְנוּ יְהוּדָה
  choice: Paglingon ng mga taga-Juda
  rationale: Ang פנה ay tumutukoy rito sa paglingon o pagharap sa kabilang direksiyon. Ginawang “mga taga-Juda” ang kolektibong pangalang Juda upang maging natural at malinaw sa Tagalog nang hindi tahasang nagdaragdag ng “hukbo.”
- source_word: וְהִנֵּה
  choice: heto’t
  rationale: Pinananatili nito ang biglaan at masiglang pantawag-pansing lakas ng Hebreong הִנֵּה sa natural na salitang Tagalog.
- source_word: הַמִּלְחָמָה
  choice: ang labanan
  rationale: Ang tinutukoy ay ang kasalukuyang sagupaan, hindi ang isang mahabang digmaan.
- source_word: פָּנִים וְאָחוֹר
  choice: sa harapan at likuran nila
  rationale: Malapit ito sa Hebreong idyoma at malinaw na inilalarawan ang pakikipaglaban mula sa magkabilang direksiyon.
- source_word: וַיִּצְעֲקוּ
  choice: Sumigaw sila
  rationale: Ipinahahayag nito ang matindi at apurahang pagtawag nila sa Diyos, ayon sa lakas ng pandiwang צעק.
- source_word: לַיהוָה
  choice: kay Yahweh
  rationale: Direktang inililipat ang banal na pangalang יהוה bilang “Yahweh,” ayon sa pamantayan ng proyekto.
- source_word: וְהַכֹּהֲנִים מחצצרים בַּחֲצֹצְרוֹת
  choice: at hinihipan ng mga pari ang mga trumpeta
  rationale: Ang anyong pandiwari ay inilalarawan bilang nagpapatuloy na kilos sa pamamagitan ng “hinihipan,” habang ang חֲצֹצְרוֹת ay natural na isinaling “mga trumpeta” nang hindi idinaragdag na yari ang mga ito sa pilak.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON / Jehovah
  rationale: Pinananatili ang personal na banal na pangalan sa transliterasyong “Yahweh,” alinsunod sa itinakdang pamantayan at nang hindi pinapalitan ng isang titulo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “heto’t” upang mapanatili ang biglaang diin ng salaysay, at ang “mga taga-Juda” upang natural na maipahayag ang kolektibong gamit ng pangalang Juda.
