  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וּ/מַקְטִרִ֣ים לַ/יהוָ֡ה עֹל֣וֹת בַּ/בֹּֽקֶר בַּ/בֹּ֣קֶר וּ/בָ/עֶֽרֶב בָּ/עֶ֣רֶב וּ/קְטֹֽרֶת סַמִּים֩ וּ/מַעֲרֶ֨כֶת לֶ֜חֶם עַל הַ/שֻּׁלְחָ֣ן הַ/טָּה֗וֹר וּ/מְנוֹרַ֨ת הַ/זָּהָ֤ב וְ/נֵרֹתֶ֨י/הָ֙ לְ/בָעֵר֙ בָּ/עֶ֣רֶב בָּ/עֶ֔רֶב כִּֽי שֹׁמְרִ֣ים אֲנַ֔חְנוּ אֶת מִשְׁמֶ֖רֶת יְהוָ֣ה אֱלֹהֵ֑י/נוּ וְ/אַתֶּ֖ם עֲזַבְתֶּ֥ם אֹתֽ/וֹ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/011.yaml
  text: And we offer up burnt offerings to Yahweh morning by morning and evening by evening[a], and fragrant incense, and the arrangement of bread on the pure table, and the golden lampstand with its lamps to burn evening by evening; for we are keeping the charge of Yahweh our God, but you have forsaken him.
translation:
  language: tl
  text: Naghahandog kami kay Yahweh ng mga handog na sinusunog umaga-umaga at gabi-gabi, pati ng mabangong insenso. Inilalatag namin ang nakahanay na tinapay sa dalisay na mesa[a], at pinananatili naming nagliliyab gabi-gabi ang mga ilawan ng gintong kandelero. Sapagkat iniingatan namin ang ipinagkatiwalang tungkulin ni Yahweh na aming Diyos, ngunit tinalikuran ninyo siya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “tinapay na handog” o “tinapay ng Presensya.” Sa literal, “kaayusan ng tinapay.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמַקְטִרִים
  choice: Inihahandog namin
  rationale: Ipinahihiwatig ng Hiphil ng קטר ang pagpapausok ng handog sa altar; natural na ipinapahayag ng “inihahandog” ang gawaing pansakripisyo, at nililinaw ng kasunod na layon na ang mga ito ay handog na sinusunog.
- source_word: לַיהוָה
  choice: kay Yahweh
  rationale: Tuwirang isinasalin ang pangalang tipan na יהוה bilang “Yahweh.”
- source_word: עֹלוֹת
  choice: mga handog na sinusunog
  rationale: Karaniwan at malinaw na katawagan sa Tagalog para sa עֹלָה sa kontekstong pansakripisyo.
- source_word: בַּבֹּקֶר בַּבֹּקֶר ... וּבָעֶרֶב בָּעֶרֶב
  choice: umaga-umaga at gabi-gabi
  rationale: Pinananatili ng inuulit na anyo ang distributibo at regular na ritmo ng paglilingkod araw-araw.
- source_word: וּקְטֹרֶת סַמִּים
  choice: mabangong insenso
  rationale: Ang סַמִּים ay tumutukoy sa mababangong sangkap; idiomatiko at tumpak ang “mabangong insenso.”
- source_word: וּמַעֲרֶכֶת לֶחֶם
  choice: Inilalagay namin nang maayos ang tinapay
  rationale: Isinasalin ang diwa ng nakaayos na paglalatag ng tinapay nang hindi ipinapasok sa pangunahing teksto ang mas interpretatibong tradisyonal na katawagan.
- source_word: עַל הַשֻּׁלְחָן הַטָּהוֹר
  choice: sa dalisay na mesa
  rationale: Ipinahahayag ng “dalisay” ang ritwal at sagradong kahulugan ng טָהוֹר, hindi lamang pisikal na kalinisan.
- source_word: וּמְנוֹרַת הַזָּהָב וְנֵרֹתֶיהָ לְבָעֵר
  choice: sinisindihan namin ... ang mga ilawan sa gintong patungan ng ilawan
  rationale: Natural na Tagalog ito para sa layuning patuloy na magningas ang mga ilawan, habang pinananatili ang pagkakaiba ng patungan at ng mga ilawan nito.
- source_word: שֹׁמְרִים אֲנַחְנוּ אֶת מִשְׁמֶרֶת יְהוָה
  choice: tinutupad namin ang tungkuling iniatas ni Yahweh
  rationale: Ang idyomang שׁמר משׁמרת ay tumutukoy sa maingat na pagtupad sa ipinagkatiwalang tungkulin o paglilingkod.
- source_word: וְאַתֶּם עֲזַבְתֶּם אֹתוֹ
  choice: ngunit tinalikuran ninyo siya
  rationale: Ipinapakita ng “tinalikuran” ang matinding tipanang diwa ng עזב, hindi lamang pansamantalang pag-iwan.
theological_decisions:
- issue: Katawagan sa tinapay sa templo
  choice: Inilalagay namin nang maayos ang tinapay
  alternative: ang tinapay na handog / tinapay ng Presensya / ang pagkakaayos ng tinapay
  rationale: Binibigyang-diin ng מַעֲרֶכֶת לֶחֶם ang maayos na pagkakalatag ng tinapay. Pinananatili ng pangunahing teksto ang konkretong kilos at iniiwasang gawing tanging kahulugan ang isang tradisyonal na katawagan; inilalahad sa talababa ang mga alternatibo.
- issue: Pagsasalin sa pangalang יהוה
  choice: Yahweh
  alternative: ang PANGINOON
  rationale: Nasa Hebreong teksto ang mismong pangalang tipan; pinananatili itong pantanging pangalan sa salin.
- issue: Kahulugan ng משמרת יהוה
  choice: tungkuling iniatas ni Yahweh
  alternative: paglilingkod kay Yahweh / kautusan ni Yahweh
  rationale: Saklaw ng parirala ang ipinagkatiwalang pananagutan sa paglilingkod sa templo. Hindi ito pinakikitid sa isang utos lamang ni pinalalawak sa pangkalahatang debosyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang mga anyong “umaga-umaga” at “gabi-gabi” upang mapanatili ang regularidad at paralelismo ng Hebreo. Iniwasan ang sobrang teknikal o denominasyonal na pananalita.
