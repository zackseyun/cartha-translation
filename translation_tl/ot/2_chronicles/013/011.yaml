revisions:
- from: Inihahandog namin kay Yahweh ang mga handog na sinusunog, umaga-umaga at gabi-gabi, pati ang mabangong insenso. Inilalagay namin nang maayos ang tinapay sa dalisay na mesa[a], at sinisindihan namin gabi-gabi ang mga ilawan sa gintong patungan ng ilawan. Sapagkat tinutupad namin ang tungkuling iniatas ni Yahweh na aming Diyos, ngunit tinalikuran ninyo siya.
  to: Naghahandog kami kay Yahweh ng mga handog na sinusunog umaga-umaga at gabi-gabi, pati ng mabangong insenso. Inilalatag namin ang nakahanay na tinapay sa dalisay na mesa[a], at pinananatili naming nagliliyab gabi-gabi ang mga ilawan ng gintong kandelero. Sapagkat iniingatan namin ang ipinagkatiwalang tungkulin ni Yahweh na aming Diyos, ngunit tinalikuran ninyo siya.
  rationale: 'Inayos ang dalawang pariralang may kaugnayan sa mga kagamitan at paglilingkod sa templo upang masundan nang mas malapit ang Hebreo: ang tinapay ay isang nakahanay na ayos, at ang mga ilawan ay pinananatiling nagliliyab gabi-gabi. Pinanatili ang kahulugan, register, pangalang Yahweh, at talababa para sa mga kinikilalang alternatibo.'
