  text: But Yarobam had turned the ambush around to come behind them, so they were in front of Judah, and the ambush was behind them.
translation:
  language: tl
  text: Ngunit ipinadaan ni Yarobam sa paligid ang pangkat na nananambang upang makarating sa likuran nila. Kaya ang hukbo niya ay nasa harap ng Juda, samantalang ang pangkat na nananambang ay nasa likuran nila.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְיָרָבְעָם
  choice: Ngunit ... ni Yarobam
  rationale: Ang וְ ay gumaganap dito bilang panandang pagsalungat sa naunang pangyayari, kaya natural ang “Ngunit.” Pinanatili ang anyong pangalang “Yarobam,” na malapit sa Hebreo at kaayon ng ibinigay na konsultasyong salin.
- source_word: הֵסֵב אֶת־הַמַּאְרָב
  choice: pinaikot ... ang mga tauhang nakatalaga sa pananambang
  rationale: Ang הֵסֵב ay causative, “pinaiikot/pinalibot,” at ang מַאְרָב ay maaaring tumukoy sa pananambang o sa pangkat na nagsasagawa nito. Ginawang tahasan ang mga tauhan upang maging natural at malinaw sa Tagalog.
- source_word: לָבוֹא מֵאַחֲרֵיהֶם
  choice: upang makapunta sa likuran nila
  rationale: Pinananatili ang layunin ng pag-ikot at ang spatial na diwa ng Hebreo.
- source_word: וַיִּהְיוּ לִפְנֵי יְהוּדָה
  choice: Kaya nasa harapan ng Juda ang hukbo ni Yarobam
  rationale: Ang panghalip na maramihan ay tumutukoy sa pangunahing hukbo ni Yarobam; nilinaw ang tinutukoy upang maiwasan ang malabong “sila” sa Tagalog.
- source_word: וְהַמַּאְרָב מֵאַחֲרֵיהֶם
  choice: at nasa likuran naman nila ang mga nakatalaga sa pananambang
  rationale: Pinananatili ang pagkakaiba ng hukbong nasa harapan at ng pangkat na nananambang sa likuran.
