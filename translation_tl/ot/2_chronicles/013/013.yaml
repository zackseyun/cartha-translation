  verdict: revise
  source_fidelity: 'Wastong naipapakita ng draft ang maniobra ni Yarobam: ang pangkat na nananambang ay pinalibot upang dumating sa likuran ng Juda, habang ang pangunahing hukbo ay nasa harap nila. Gayunman, ang “pinaikot ... ang mga tauhang nakatalaga sa pananambang” ay bahagyang hindi likas at ang “mga tauhan” ay mas malawak kaysa sa tiyak na pangkat/pananambang na tinutukoy ng מַאֲרָב.'
  naturalness: Mas natural sa modernong Tagalog ang “ipinadaan ... sa paligid ang pangkat na nananambang” at ang magkatapat na “samantalang” para sa pagkakalagay ng hukbo sa harap at ng pangkat sa likuran.
  terminology: Pinanatili ang “Yarobam” ayon sa English POB audit trail. Ang “Juda” ay angkop para sa puwersang kinakatawan ng Juda. Ginamit ang “pangkat na nananambang” para sa מַאֲרָב nang hindi ipinapalagay ang eksaktong laki ng pangkat.
  issues:
