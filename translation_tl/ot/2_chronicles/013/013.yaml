    issue: Hindi ganap na likas ang “pinaikot ... ang mga tauhang nakatalaga sa pananambang.”
    rationale: Ang Hebreo ay tumutukoy sa ambush/ambushing force na pinalibot o pinadaan upang makarating sa likuran. Ang “ipinadaan sa paligid ang pangkat na nananambang” ay mas idiomatiko at mas malapit sa galaw na inilalarawan.
  - severity: low
    issue: Ang “mga tauhan” ay hindi kinakailangang pagpapalawak ng מַאֲרָב.
    rationale: Maaaring tumukoy ang מַאֲרָב sa pananambang o sa pangkat na nananambang; ang “pangkat” ay sapat at hindi labis na tumutukoy sa katayuan ng mga tao.
