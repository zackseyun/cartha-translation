  text: In the eighteenth year of King Jeroboam[a], Abijah became king over Judah.
translation:
  language: tl
  text: Sa ikalabingwalong taon ng paghahari ni Haring Jeroboam[a], naging hari ng Juda si Abias.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang tawag kay Abias sa katumbas na salaysay sa 1 Mga Hari 15:1 ay “Abiam”; “Abias” ang nakasulat dito sa Mga Cronica.
    reason: cross_reference
lexical_decisions:
- source_word: בִּ/שְׁנַת שְׁמוֹנֶה עֶשְׂרֵה
  choice: Nang ikalabingwalong taon ng paghahari
  rationale: Ang pariralang Hebreo ay pormula ng pagtatakda ng panahon ayon sa taon ng paghahari. Natural at malinaw sa modernong Tagalog ang “Nang ikalabingwalong taon ng paghahari.”
- source_word: לַ/מֶּלֶךְ יָרָבְעָם
  choice: ni Haring Jeroboam
  rationale: Sa pormulang ito, ang ל ay tumutukoy sa haring batayan ng pagbilang ng taon ng paghahari. Pinananatili ang karaniwang anyong Tagalog ng pangalan.
- source_word: וַ/יִּמְלֹךְ
  choice: naging hari
  rationale: Ipinahihiwatig ng pandiwa rito ang pagluklok o pagsisimula ng paghahari, hindi lamang ang patuloy na pamamahala.
- source_word: אֲבִיָּה
  choice: Abias
  rationale: Isinalin ang anyong אֲבִיָּה ayon sa nakaugaliang biblikal na anyo ng pangalan sa Tagalog; hindi ginamit ang ibang anyong Abiam na matatagpuan sa katumbas na salaysay sa Mga Hari.
- source_word: עַל יְהוּדָה
  choice: ng Juda
  rationale: Kasama ng pandiwang “naging hari,” natural sa Tagalog ang “naging hari ng Juda” upang ipahayag ang saklaw ng kanyang pamumuno.
