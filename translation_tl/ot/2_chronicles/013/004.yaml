base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/004.yaml
  text: Then Abijah stood on Mount Zemaraim[a], which is in the hill country of Ephraim, and said, “Hear me, Jeroboam and all Israel!”
translation:
  language: tl
  text: Pagkatapos, tumayo si Abias sa Bundok Zemaraim[a], na nasa kaburulan ng Efraim, at sinabi niya, “Pakinggan ninyo ako, Jeroboam at buong Israel!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “na nasa mga bundok ng Efraim.” Ang Hebreong pananalita ay maaaring tumukoy sa kaburulan o bulubunduking rehiyon ng Efraim.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: tumayo
  rationale: Karaniwang kahulugan ng קום sa salaysay ang pagbangon o pagtayo. Ang “tumayo” ay natural sa Filipino at hindi nagdaragdag ng tiyak na pormal o militar na tindig.
- source_word: מֵעַל לְהַר
  choice: sa Bundok ng
  rationale: Bagaman masalimuot ang literal na pagkakasunod ng mga pang-ukol, inilalarawan nito sa konteksto ang kinalalagyan ni Abias sa bundok. Ang “sa Bundok ng” ang natural na lokatibong anyo sa Filipino.
- source_word: צְמָרַיִם
  choice: Zemaraim
  rationale: Isinalin bilang transliteradong pangalang pantangi ng lugar.
- source_word: אֲשֶׁר בְּהַר אֶפְרָיִם
  choice: na nasa kaburulan ng Efraim
  rationale: Ang הַר ay maaaring tumukoy hindi lamang sa isang bundok kundi sa isang bulubundukin o mataas na rehiyon. Malinaw at natural na naihahayag ng “kaburulan ng Efraim” ang panrehiyong diwa.
- source_word: וַיֹּאמֶר
  choice: at sinabi niya
  rationale: Likas na panimula sa tuwirang pananalita sa isang salaysay; malinaw na pinananatili ang gumagawa ng kilos.
- source_word: שְׁמָעוּנִי
  choice: Makinig kayo sa akin
  rationale: Ang pautos na anyo ng שמע na may hulaping unang panauhan ay tuwirang panawagang makinig. Mas natural sa kasalukuyang Filipino ang “Makinig kayo sa akin” kaysa sa literal ngunit di-likas na “Pakinggan ninyo ako” sa ganitong talumpati.
- source_word: יָרָבְעָם וְכָל יִשְׂרָאֵל
  choice: Jeroboam at buong Israel
  rationale: Pinananatili ang tuwirang pagtawag sa hari at ang pambansa at tipanang katawagang “buong Israel,” nang hindi ito nililimitahan sa etnisidad lamang.
theological_decisions:
- issue: Pagpapahayag sa יִשְׂרָאֵל sa konteksto ng nahating kaharian
  choice: buong Israel
  alternative: lahat ng mga Israelita; buong sambayanan ng Israel
  rationale: Tuwirang ginagamit ng Hebreo ang pambansa at tipanang pangalang Israel. Pinananatili ng “buong Israel” ang retorikal at teolohikal na tensiyon na ang hilagang kaharian ay tinatawag sa ganap na pambansang katawagan kahit nahati na ang monarkiya.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “Makinig kayo” upang ipakita ang maramihang pautos at mapanatili ang mariing pampublikong panawagan. Ang mga pangalang Abias, Jeroboam, Zemaraim, Efraim, at Israel ay nasa karaniwang anyong Filipino o malinaw na transliterasyon.
