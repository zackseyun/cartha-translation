base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/017.yaml
  text: Abijah and his people struck them with a great blow[b][a], and five hundred thousand chosen men of Israel fell slain.
translation:
  language: tl
  text: Nagbigay si Abias at ang kanyang mga tauhan sa kanila ng isang matinding dagok,[a] at limang daang libong piling lalaki mula sa Israel ang napatay.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “nagbigay sa kanila ng isang malaking dagok”; maaari ring “isang malubhang dagok” o “isang malaking pagpatay.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “limang daang libong piniling lalaki mula sa Israel.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכּוּ בָהֶם
  choice: Matinding tinalo ... ang mga ito
  rationale: Ang נכה sa konteksto ng labanan ay tumutukoy sa pananakit o paggapi. Ginawang natural sa Filipino ang pariralang kasama ang מַכָּה רַבָּה habang pinananatili ang tindi ng pagkatalo.
- source_word: אֲבִיָּה וְעַמּוֹ
  choice: ni Abias at ng kanyang mga tauhan
  rationale: Bagaman literal na 'kanyang bayan' ang עַמּוֹ, ang tinutukoy sa kontekstong militar ay ang mga lalaking kasama niya sa labanan; mas malinaw at likas dito ang 'mga tauhan.'
- source_word: מַכָּה רַבָּה
  choice: Matinding tinalo
  rationale: Literal itong 'isang malaking dagok.' Ang 'matinding tinalo' ay natural na paglalahad ng matinding pinsala o pagkatalo sa labanan, samantalang ang kasunod na sugnay ang tahasang nagsasaad ng mga namatay.
- source_word: וַיִּפְּלוּ חֲלָלִים
  choice: ang napatay
  rationale: Sa ulat ng labanan, ang נפל na may חֲלָלִים ay nangangahulugang bumagsak bilang mga napatay. Ang 'napatay' ay malinaw at likas sa modernong Filipino.
- source_word: מִיִּשְׂרָאֵל
  choice: mula sa Israel
  rationale: Ipinakikita ng parirala kung sa aling pangkat nagmula ang mga nasawi.
- source_word: חֲמֵשׁ מֵאוֹת אֶלֶף
  choice: limang daang libo
  rationale: Tuwirang pinanatili ang bilang na nasa tekstong Hebreo.
- source_word: אִישׁ בָּחוּר
  choice: piling lalaki
  rationale: Ang בָּחוּר ay maaaring tumukoy sa pinili o pangunahing mga lalaki, lalo na bilang mga piling mandirigma. Hindi idinagdag sa pangunahing teksto ang 'mandirigma' sapagkat hindi iyon tahasang nasa parirala.
theological_decisions:
- issue: Napakalaking bilang ng mga nasawi sa salaysay ng labanan
  choice: Pinanatili ang limang daang libo gaya ng tahasang nakasaad sa tekstong Hebreo.
  alternative: Ituring ang bilang bilang pagmamalabis, baguhin ang numero, o unawain ang אֶלֶף bilang yunit o pangkat.
  rationale: Walang palatandaan sa mismong talata na dapat bawasan o gawing sagisag ang bilang; tungkulin ng salin na ihayag ang tekstong pinagmulan nang hindi nilulutas sa pangunahing teksto ang usaping pangkasaysayan o tekstuwal.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang tradisyonal na anyong Filipino na “Abias.” Iniwasan ang sobrang literal ngunit di-likas na “malaking dagok” sa pangunahing teksto, at inilagay ito sa talababa upang mapanatili ang anyo at mga posibleng kahulugan ng Hebreo.
