  text: וַ/יִּקָּבְצ֣וּ עָלָ֗י/ו אֲנָשִׁ֤ים רֵקִים֙ בְּנֵ֣י בְלִיַּ֔עַל וַ/יִּֽתְאַמְּצ֖וּ עַל רְחַבְעָ֣ם בֶּן שְׁלֹמֹ֑ה וּ/רְחַבְעָ֗ם הָ֤יָה נַ֨עַר֙ וְ/רַךְ לֵבָ֔ב וְ/לֹ֥א הִתְחַזַּ֖ק לִ/פְנֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/007.yaml
  text: And worthless men[a], sons of Belial, gathered around him and proved stronger than Rehoboam son of Solomon, when Rehoboam was young and fainthearted and had not strengthened himself against them.
translation:
  language: tl
  text: Nagtipon sa paligid niya ang mga taong walang kabuluhan, mga anak ni Belial[a], at nagpakalakas sila laban kay Rehoboam na anak ni Solomon. Noon, bata pa si Rehoboam at mahina ang loob, at hindi niya pinatatag ang sarili sa harap nila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “mga anak ni Belial” ay maaari ring unawain bilang “mga taong hamak” o “masasamang tao.”
    reason: Pinananatili ang literal at posibleng personipikadong anyo sa teksto, habang ibinibigay ang idyomatikong kahulugan sa talababa.
lexical_decisions:
- source_word: וַיִּקָּבְצוּ עָלָיו
  choice: Nagtipon sa paligid niya
  rationale: Maaaring mangahulugan ang קבץ na may עַל ng pagtitipon sa paligid o laban sa isang tao. Pinananatili ng salin ang larawan ng mga taong pumanig sa kanya, habang ipinahihiwatig ng konteksto ang kanilang pagkontra kay Rehoboam.
- source_word: אֲנָשִׁים רֵקִים
  choice: mga taong walang kabuluhan
  rationale: Ang רֵקִים ay literal na ‘walang laman’ ngunit idyomatikong tumutukoy sa mga taong walang mabuting pagkatao o halaga. Likas at mariin sa Filipino ang ‘walang kabuluhan.’
- source_word: בְּנֵי בְלִיַּעַל
  choice: mga anak ni Belial
  rationale: Pinananatili ang literal na anyo upang hindi agad pagpasiyahan kung ang בְלִיַּעַל ay pangalang pantangi o katawagan sa kasamaan at kawalang-kabuluhan. Ipinaliliwanag sa talababa ang idyomatikong diwa.
- source_word: וַיִּתְאַמְּצוּ עַל
  choice: nagpakalakas sila laban kay
  rationale: Ipinahahayag ng hitpael ng אמץ ang pagpapakitang malakas o pagpapatibay ng sarili laban sa iba. Pinananatili ng ‘nagpakalakas’ ang tinig at ang pag-uulit ng ugat na makikita rin sa hulihan ng talata, nang hindi tiyak na ipinapakahulugang ganap na silang nanaig.
- source_word: נַעַר
  choice: bata pa
  rationale: Maaaring tumukoy ang נַעַר sa isang bata, kabataan, o nakababatang lalaki. Dito, retorikal itong tumutukoy sa kamusmusan o kakulangan sa karanasan ni Rehoboam, hindi kinakailangang sa literal na edad ng isang bata.
- source_word: רַךְ לֵבָב
  choice: mahina ang loob
  rationale: Ang literal na ‘malambot ang puso’ ay tumutukoy rito sa kakulangan ng tapang o paninindigan, hindi sa pagiging mahabagin. Natural sa Filipino ang ‘mahina ang loob.’
- source_word: וְלֹא הִתְחַזַּק לִפְנֵיהֶם
  choice: hindi niya pinatatag ang sarili upang harapin sila
  rationale: Inilalarawan ng parirala ang hindi pagpapatibay ni Rehoboam sa sarili sa kanilang harapan. Ang ‘upang harapin sila’ ay natural na pagpapahayag ng לִפְנֵיהֶם sa kontekstong ito at pinananatili ang pananagutan ng tauhan sa halip na gawing simpleng kawalan ng kakayahan.
theological_decisions:
- issue: Pagpapakahulugan sa בְּנֵי בְלִיַּעַל
  choice: mga anak ni Belial
  alternative: mga taong hamak; masasamang tao
  rationale: Ang literal na parirala ay nagpapanatili sa tunay na kalabuan kung ang ‘Belial’ ay personipikadong pangalan o abstraktong katawagan sa kasamaan at kawalang-kabuluhan. Inilalagay sa talababa ang idyomatikong mga kahulugan sa halip na ipasok ang isang tiyak na interpretasyon sa pangunahing teksto.
- issue: Lakas ng pahayag sa וַיִּתְאַמְּצוּ עַל
  choice: nagpakalakas sila laban kay
  alternative: nanaig sila kay; naging mas malakas sila kaysa kay
  rationale: Hindi ginawang tahasang pahayag ng ganap na pagtatagumpay ang anyong Hebreo. Pinananatili rin ng salin ang mahalagang pag-uugnay nito sa kasunod na הִתְחַזַּק, na mula rin sa ugat na may diwang ‘lumakas/magpatatag.’
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang ‘mahina ang loob’ bilang likas na idyoma at ang ‘pinatatag ang sarili’ upang mapanatili ang pag-uulit ng konsepto ng lakas sa Hebreo. Ang panghalip na ‘niya’ ay iniwang gaya ng pinagmulan upang huwag magdagdag ng pangalang wala sa talata.
