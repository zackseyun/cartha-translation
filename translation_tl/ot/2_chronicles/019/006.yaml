  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֶל הַ/שֹּֽׁפְטִ֗ים רְאוּ֙ מָֽה אַתֶּ֣ם עֹשִׂ֔ים כִּ֣י לֹ֧א לְ/אָדָ֛ם תִּשְׁפְּט֖וּ כִּ֣י לַ/יהוָ֑ה וְ/עִמָּ/כֶ֖ם בִּ/דְבַ֥ר מִשְׁפָּֽט־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/019/006.yaml
  text: And he said to the judges[a], “See what you are doing, for you are not judging for man, but for Yahweh[b], and he is with you in the matter of judgment.”
translation:
  language: tl
  text: Sinabi niya sa mga hukom, “Tingnan ninyong mabuti ang ginagawa ninyo, sapagkat hindi para sa tao[a] ang paghatol ninyo kundi para kay Yahweh; at kasama ninyo siya sa usapin ng paghatol.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sangkatauhan.” Ginagamit dito ang isahang “tao” bilang pangkalahatang katawagan, na inihahambing kay Yahweh.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “sa usapin ng katarungan” o “kapag humahatol kayo.” Maaaring tumukoy ang pariralang Hebreo sa gawain ng paghatol o sa mga usaping panghukuman sa pangkalahatan.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשֹּׁפְטִים
  choice: mga hukom
  rationale: Ang participle mula sa שׁפט ay ginagamit bilang pangngalan at tumutukoy sa mga itinalagang tagapaghukom.
- source_word: רְאוּ מָה אַתֶּם עֹשִׂים
  choice: Tingnan ninyong mabuti ang ginagawa ninyo
  rationale: Pinananatili nito ang utos na magbigay ng masusing pansin sa kanilang patuloy na gawain, sa natural na makabagong Tagalog.
- source_word: לְאָדָם
  choice: para sa tao
  rationale: Ang tao ay generic na isahan dito at tuwirang inihahambing kay Yahweh; likas sa Tagalog ang ‘tao’ para sa sangkatauhan sa ganitong gamit.
- source_word: תִּשְׁפְּטוּ
  choice: ang paghatol ninyo
  rationale: Ipinahahayag nito ang pagsasagawa nila ng tungkuling panghukuman at maayos na umaayon sa pariralang ‘hindi para sa… kundi para sa…’.
- source_word: לַיהוָה
  choice: para kay Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos na nasa tekstong Hebreo at ang diwa ng paglilingkod o paghatol para sa kanya.
- source_word: וְעִמָּכֶם
  choice: at kasama ninyo siya
  rationale: Natural na ipinahahayag sa Tagalog ang ipinahihiwatig na pandiwang ‘siya ay’; ang pinakamalapit na tinutukoy ng panghalip ay si Yahweh.
- source_word: בִּדְבַר מִשְׁפָּט
  choice: sa usapin ng paghatol
  rationale: Ang דְבַר ay maaaring ‘usapin’ o ‘bagay,’ at ang מִשְׁפָּט ay tumutukoy sa paghatol o katarungan; pinananatili ng salin ang panghukuman at bahagyang malawak na diwa.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יהוה
  choice: Yahweh
  alternative: ang PANGINOON; Jehova
  rationale: Personal na pangalang יהוה ang tahasang nasa Hebreo. Ang ‘Yahweh’ ay mas tuwirang kumakatawan sa pangalan nang hindi ito pinapalitan ng isang titulo.
- issue: Generic na isahang אָדָם
  choice: tao
  alternative: sangkatauhan; mga tao
  rationale: Pinananatili ng ‘tao’ ang isahang anyo at ang retorikal na paghahambing ng tao kay Yahweh, habang likas itong nauunawaan bilang pangkalahatang katawagan sa Tagalog.
- issue: Presensiya ni Yahweh sa gawaing paghatol
  choice: kasama ninyo siya sa usapin ng paghatol
  alternative: kasama ninyo siya kapag humahatol kayo
  rationale: Hindi nililinaw ng Hebreo kung ang diin ay nasa bawat akto ng paghatol o sa mga usaping panghukuman sa pangkalahatan, kaya pinanatili ang mas malawak na parirala.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang maramihang ‘ninyo’ ayon sa pakikipag-usap sa mga hukom, at pinanatili ang pormal na bokabularyong panghukuman nang hindi nagiging lipas o teknikal.
