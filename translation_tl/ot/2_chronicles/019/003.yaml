id: 2CH.19.3
reference: 2 Chronicles 19:3
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: אֲבָ֕ל דְּבָרִ֥ים טוֹבִ֖ים נִמְצְא֣וּ עִמָּ֑/ךְ כִּֽי בִעַ֤רְתָּ הָ/אֲשֵׁרוֹת֙ מִן הָ/אָ֔רֶץ וַ/הֲכִינ֥וֹתָ לְבָבְ/ךָ֖ לִ/דְרֹ֥שׁ הָֽ/אֱלֹהִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/019/003.yaml
  text: Nevertheless[a], good things have been found in you[b], because you have cleared the Asherah poles out of the land and have set your heart to seek God.
translation:
  language: tl
  text: Gayunman, may mabubuting bagay na natagpuan sa iyo, sapagkat inalis mo sa lupain ang mga Ashera[a] at inihanda mo ang iyong puso[b] upang hanapin ang Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “mga Asherot”; mga bagay na pangkultong kaugnay ng diyosang si Ashera.
    reason: cultural_note
  - marker: b
    text: O “itinuon mo ang iyong puso.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲבָל
  choice: Gayunman
  rationale: Nagpapahayag ito ng pasalungat ngunit mapagbigay na paglipat mula sa naunang pagsaway tungo sa papuri.
- source_word: דְּבָרִים טוֹבִים
  choice: mabubuting bagay
  rationale: Pinananatili ang malawak na diwa ng parirala at hindi ito nililimitahan sa mga gawa lamang.
- source_word: נִמְצְאוּ עִמָּךְ
  choice: natagpuan sa iyo
  rationale: Pinananatili ang pasibong anyo at ang diwang may nakitang kapuri-puring mga katangian o gawa kay Jehoshafat.
- source_word: כִּי
  choice: sapagkat
  rationale: Malinaw na ipinakikilala ang dahilan ng positibong pagtataya, sa marangal ngunit kasalukuyang Tagalog.
- source_word: בִעַרְתָּ
  choice: inalis
  rationale: Ipinahihiwatig ang tiyak na pag-aalis sa mga bagay na pangkulto nang hindi ipinapalagay na pagsunog ang mismong paraan.
- source_word: הָאֲשֵׁרוֹת
  choice: mga Ashera
  rationale: Pinananatili ang kaugnayan sa pangalang Ashera at ang maramihang anyo, habang nililinaw sa talababa na mga bagay na pangkulto ang tinutukoy.
- source_word: מִן הָאָרֶץ
  choice: sa lupain
  rationale: Kasama ng pandiwang 'inalis,' natural nitong ipinapahayag ang pag-aalis mula sa nasasakupang lupain.
- source_word: וַהֲכִינוֹתָ לְבָבְךָ
  choice: inihanda mo ang iyong puso
  rationale: Malapit sa literal na kahulugan at pinananatili ang sinasadyang panloob na pagpapasiya.
- source_word: לִדְרֹשׁ הָאֱלֹהִים
  choice: upang hanapin ang Diyos
  rationale: Pinananatili ang mahalagang diwa sa Mga Cronica ng tapat na pagbaling at patuloy na paghahangad sa Diyos, hindi lamang pagtatanong sa kaniya.
theological_decisions:
- issue: Kahulugan ng הָאֲשֵׁרוֹת
  choice: mga Ashera
  alternative: mga poste ni Ashera
  rationale: Hindi lubusang tiyak ang pisikal na anyo ng mga bagay na pangkultong ito. Ang transliterasyong 'mga Ashera,' na may paliwanag sa talababa, ay hindi nagpapakitid sa kahulugan sa mga poste lamang.
- issue: Kahulugan ng לִדְרֹשׁ הָאֱלֹהִים
  choice: hanapin ang Diyos
  alternative: sumangguni sa Diyos
  rationale: Sa Mga Cronica, mas malawak ang parirala kaysa paghingi lamang ng impormasyon; tumutukoy ito sa pagbaling at tapat na paghahangad sa Diyos.
- issue: Kahulugan ng וַהֲכִינוֹתָ לְבָבְךָ
  choice: inihanda mo ang iyong puso
  alternative: itinuon mo ang iyong puso
  rationale: Ang 'inihanda' ay mas tuwirang tumutugma sa pandiwa, samantalang kinikilala ng talababa ang natural na alternatibong nagpapahayag ng matatag na layunin.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang pasibong 'natagpuan sa iyo' at ang idyomang 'inihanda ang puso' upang maingatan ang anyo at teolohikal na diin ng Hebreo. Inilagay ang mga pananda ng talababa sa mismong mga pariralang ipinaliliwanag ng mga ito.
