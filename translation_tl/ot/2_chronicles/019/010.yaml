  to: At sa bawat usaping ihaharap sa inyo ng inyong mga kapatid na naninirahan sa kanilang mga lungsod—maging sa pagitan ng dugo at dugo[a], sa pagitan ng kautusan at utos, ng mga tuntunin at mga hatol—babalaan ninyo sila upang hindi sila maging may-sala sa harap ni Yahweh; kung hindi, darating ang poot sa inyo at sa inyong mga kapatid. Gawin ninyo ito, at hindi kayo magiging may-sala.
