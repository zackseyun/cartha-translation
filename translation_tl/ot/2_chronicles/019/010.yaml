id: 2CH.19.10
reference: 2 Chronicles 19:10
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/כָל רִיב֩ אֲשֶׁר יָב֨וֹא עֲלֵי/כֶ֜ם מֵ/אֲחֵי/כֶ֣ם הַ/יֹּשְׁבִ֣ים בְּ/עָרֵי/הֶ֗ם בֵּֽין דָּ֣ם לְ/דָם֮ בֵּין תּוֹרָ֣ה לְ/מִצְוָה֮ לְ/חֻקִּ֣ים וּ/לְ/מִשְׁפָּטִים֒ וְ/הִזְהַרְתֶּ֣ם אֹתָ֔/ם וְ/לֹ֤א יֶאְשְׁמוּ֙ לַ/יהוָ֔ה וְ/הָֽיָה קֶ֥צֶף עֲלֵי/כֶ֖ם וְ/עַל אֲחֵי/כֶ֑ם כֹּ֥ה תַעֲשׂ֖וּ/ן וְ/לֹ֥א תֶאְשָֽׁמוּ־־׀־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/019/010.yaml
  text: And every dispute that comes before you from your brothers who live in their cities—whether between blood and blood[a], between law and commandment, statutes and judgments—you shall warn them, so that they may not incur guilt before Yahweh; otherwise wrath will come upon you and upon your brothers. Do this, and you will not incur guilt.
translation:
  language: tl
  text: At sa bawat usaping ihaharap sa inyo ng inyong mga kapatid na naninirahan sa kanilang mga lungsod—maging sa pagitan ng dugo at dugo[a], sa pagitan ng kautusan at utos, ng mga tuntunin at mga hatol—babalaan ninyo sila upang hindi sila maging may-sala sa harap ni Yahweh; kung hindi, darating ang poot sa inyo at sa inyong mga kapatid. Gawin ninyo ito, at hindi kayo magiging may-sala.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “sa pagitan ng dugo at dugo”; malamang na tumutukoy sa mga kasong may kinalaman sa pagdanak ng dugo o pagpatay.
    reason: lexical_alternative
lexical_decisions:
- source_word: רִיב
  choice: usapin
  rationale: Tumutukoy ito sa isang alitan o kasong legal; natural ang “usapin” sa konteksto ng isang bagay na inihaharap sa mga hukom nang hindi labis na nililimitahan sa pormal na demanda.
- source_word: יָבוֹא עֲלֵיכֶם
  choice: ihaharap sa inyo
  rationale: Sa kontekstong panghukuman, ipinahihiwatig ng parirala ang pagdadala ng isang usapin sa hurisdiksiyon ng mga hukom.
- source_word: מֵאֲחֵיכֶם
  choice: ng inyong mga kapatid
  rationale: Pinananatili ang tahasang pananalitang pampamilya ng Hebreo, na tumutukoy rito sa mga kapwa kabilang sa sambayanan.
- source_word: הַיֹּשְׁבִים בְּעָרֵיהֶם
  choice: na naninirahan sa kanilang mga lungsod
  rationale: Tuwiran at likas na salin ng pariralang participial sa modernong Filipino.
- source_word: בֵּין דָּם לְדָם
  choice: tungkol sa dugo at dugo
  rationale: Pinananatili ang maigsi at teknikal na pahayag ng Hebreo at inilalagay sa talababa ang malamang na sanggunian nito sa pagdanak ng dugo o pagpatay.
- source_word: בֵּין תּוֹרָה לְמִצְוָה לְחֻקִּים וּלְמִשְׁפָּטִים
  choice: sa kautusan at utos, sa mga tuntunin at mga hatol
  rationale: Pinananatili ang magkakaibang kategorya ng legal na tagubilin sa halip na pagsama-samahin ang lahat bilang pangkalahatang “mga batas.”
- source_word: וְהִזְהַרְתֶּם אֹתָם
  choice: babalaan ninyo sila
  rationale: Ang Hiphil ng זהר ay nagpapahiwatig ng pagbababala o pagpapaalala upang maiwasan ang pagkakasala.
- source_word: יֶאְשְׁמוּ לַיהוָה
  choice: magkasala kay Yahweh
  rationale: Likas itong Filipino para sa pagiging may-sala sa harap o laban kay Yahweh, habang pinananatili ang pananagutang moral sa Diyos.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin ang Tetragrammaton bilang personal na pangalang “Yahweh,” hindi pinapalitan ng isang titulo.
- source_word: קֶצֶף
  choice: poot
  rationale: Ipinahahayag nito ang matinding banal na galit at ang bigat ng hatol sa tipan.
- source_word: כֹּה תַעֲשׂוּן
  choice: Gawin ninyo ito
  rationale: Maikli at natural na utos na tumutukoy pabalik sa hinihinging pagbababala sa paghatol.
- source_word: וְלֹא תֶאְשָׁמוּ
  choice: hindi kayo magkakasala
  rationale: Pinananatili ang parehong diwa ng אשׁם gaya ng naunang gamit nito, sa natural na Filipino.
theological_decisions:
- issue: Pananalita para sa sambayanan sa אֲחֵיכֶם
  choice: ng inyong mga kapatid
  alternative: ng inyong mga kapwa Israelita
  rationale: Kinship language ang tahasang gamit ng teksto para sa mga kabilang sa sambayanan ng tipan; pinananatili ito nang hindi ginagawang mas tiyak kaysa sa Hebreo.
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Personal na pangalan ang nasa tekstong Hebreo, kaya pinananatili itong “Yahweh” sa halip na palitan ng titulo.
- issue: Kaugnayan ng poot sa pagkakasala
  choice: kung hindi, darating ang poot sa inyo at sa inyong mga kapatid
  alternative: at magkakaroon ng poot laban sa inyo at sa inyong mga kapatid
  rationale: Ipinahahayag ng sugnay ang bunga ng hindi pagbababala. Pinananatili ang banal na poot nang hindi nagdaragdag ng paliwanag kung paano o kailan ito darating.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang anyong panghukuman ng talata, ang kinship language na “mga kapatid,” ang banal na pangalang “Yahweh,” at ang sadyang maigsi at hindi ganap na malinaw na pariralang “dugo at dugo,” na nilinaw lamang sa talababa.
