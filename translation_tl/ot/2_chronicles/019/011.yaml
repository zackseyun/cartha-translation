revisions:
- from: At narito, si Amarias na punong pari[a] ang mamamahala sa inyo sa bawat usapin ni Yahweh. Si Zebadias naman na anak ni Ismael, ang pinuno ng sambahayan ng Juda, ang mamamahala sa bawat usapin ng hari. Ang mga Levita ay maglilingkod sa harap ninyo bilang mga opisyal. Magpakatatag kayo at kumilos, at sumama nawa si Yahweh sa mabuti.[b]
  to: At narito, si Amarias, ang punong pari[a], ang mamamahala sa inyo sa bawat usapin ni Yahweh. Si Zebadias naman, na anak ni Ismael at pinuno ng sambahayan ng Juda, ang mamamahala sa bawat usapin ng hari. Ang mga Levita ay maglilingkod sa harap ninyo bilang mga opisyal. Magpakatatag kayo at kumilos, at nawa’y samahan ni Yahweh ang taong mabuti.[b]
  rationale: Pinalitan ang “sumama nawa si Yahweh sa mabuti” ng “nawa’y samahan ni Yahweh ang taong mabuti” upang maipahayag nang natural at tumpak ang jussive na kahilingan na makasama ni Yahweh ang mabuting tao. Pinananatili ng talababa ang mas maikling pagbasa na “ang mabuti,” habang ang pangunahing teksto ay nililinaw ang likas na personal na tinutukoy ng pang-uri sa kontekstong ito. Walang binagong saklaw ng awtoridad o kahulugan ng iba pang mga sugnay.
