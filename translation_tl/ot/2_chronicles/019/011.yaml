reference: 2 Chronicles 19:11
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/הִנֵּ֡ה אֲמַרְיָ֣הוּ כֹהֵן֩ הָ/רֹ֨אשׁ עֲלֵי/כֶ֜ם לְ/כֹ֣ל דְּבַר יְהוָ֗ה וּ/זְבַדְיָ֨הוּ בֶן יִשְׁמָעֵ֜אל הַ/נָּגִ֤יד לְ/בֵית יְהוּדָה֙ לְ/כֹ֣ל דְּבַר הַ/מֶּ֔לֶךְ וְ/שֹׁטְרִ֥ים הַ/לְוִיִּ֖ם לִ/פְנֵי/כֶ֑ם חִזְק֣וּ וַ/עֲשׂ֔וּ וִ/יהִ֥י יְהוָ֖ה עִם הַ/טּֽוֹב־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/019/011.yaml
  text: And behold[a], Amariah the chief priest is over you in every matter of Yahweh, and Zebadiah son of Ishmael, the ruler of the house of Judah, for every matter of the king; and the Levites will serve as officers before you. Be strong and act[b], and may Yahweh be with the good.
translation:
  language: tl
  text: At narito, si Amarias, ang punong pari[a], ang mamamahala sa inyo sa bawat usapin ni Yahweh. Si Zebadias naman, na anak ni Ismael at pinuno ng sambahayan ng Juda, ang mamamahala sa bawat usapin ng hari. Ang mga Levita ay maglilingkod sa harap ninyo bilang mga opisyal. Magpakatatag kayo at kumilos, at nawa’y samahan ni Yahweh ang taong mabuti.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mataas na pari.”
    reason: lexical_alternative
  - marker: b
    text: O “nawa’y samahan ni Yahweh ang mabuti.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: At narito
  rationale: Pinananatili ang panandang diskurso na tumatawag ng pansin sa kaayusang inilalahad, sa natural at marangal na Tagalog.
- source_word: כֹהֵן הָרֹאשׁ
  choice: punong pari
  rationale: Malapit ito sa literal na ‘paring pinuno’ at hindi agad nagpapataw ng mas teknikal na katawagang ‘mataas na pari.’
- source_word: עֲלֵיכֶם
  choice: ang mamamahala sa inyo
  rationale: Ipinahahayag ang awtoridad na mangasiwa sa kontekstong hudisyal at administratibo.
- source_word: לְכֹל דְּבַר יְהוָה
  choice: sa bawat usapin ni Yahweh
  rationale: Ang דָּבָר ay tumutukoy rito sa usapin o kaso; pinananatiling malawak ang saklaw at malinaw ang kaugnayan kay Yahweh.
- source_word: הַנָּגִיד לְבֵית יְהוּדָה
  choice: ang pinuno ng sambahayan ng Juda
  rationale: Ang ‘pinuno’ ay natural na katumbas ng נָגִיד, at pinananatili ng ‘sambahayan ng Juda’ ang בֵּית sa Hebreo.
- source_word: לְכֹל דְּבַר הַמֶּלֶךְ
  choice: sa bawat usapin ng hari
  rationale: Pinananatili ang paralelismo sa mga usapin ni Yahweh at ang natatanging saklaw ng awtoridad ng hari.
- source_word: וְשֹׁטְרִים הַלְוִיִּם לִפְנֵיכֶם
  choice: Ang mga Levita ay maglilingkod sa harap ninyo bilang mga opisyal
  rationale: Ginagawang natural sa Tagalog ang sugnay na walang tahasang pandiwa habang pinananatili ang tungkulin ng mga Levita bilang mga opisyal na nakatalaga sa kanilang harapan.
- source_word: חִזְקוּ וַעֲשׂוּ
  choice: Magpakatatag kayo at kumilos
  rationale: Tuwirang panawagan itong maging matatag at isagawa ang iniatas na tungkulin.
- source_word: וִיהִי יְהוָה עִם הַטּוֹב
  choice: at sumama nawa si Yahweh sa mabuti
  rationale: Ipinapahayag ng ‘nawa’ ang himig na jussive. Pinananatili ng ‘sa mabuti’ ang kaiklian at tunay na kalabuan kung ang tinutukoy ay ang mabuti sa pangkalahatan o ang taong mabuti.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang personal na pangalang banal na hayag sa Tetragrammaton sa halip na palitan ito ng isang titulo.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Tahasang ginagamit ng talata ang Tetragrammaton; pinananatili ng ‘Yahweh’ ang pangalan sa halip na palitan ito ng titulo.
- issue: Kung teknikal na ‘mataas na pari’ ang כֹהֵן הָרֹאשׁ
  choice: punong pari
  alternative: mataas na pari
  rationale: Literal na tumutukoy ang parirala sa paring pinuno. Sa administratibong kontekstong ito, hindi kailangang ipalagay ang mas teknikal na kahulugan.
- issue: Kung ang הַטּוֹב ay abstraktong ‘mabuti’ o isang taong mabuti
  choice: sa mabuti
  alternative: sa taong mabuti
  rationale: Pinananatili ng pangunahing teksto ang pagiging maikli at malabo ng Hebreo; inilalagay sa talababa ang mas tiyak na personal na pagbasa.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang karaniwang anyong Filipino ng mga pangalan—Amarias, Zebadias, Ismael, Juda—at ang ‘mga Levita.’ Ang paghahati sa maiikling pangungusap ay nagpapalinaw sa magkatapat na saklaw ng pamamahala nang hindi binabago ang estruktura ng diwa.
