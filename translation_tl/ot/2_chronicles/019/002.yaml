  text: וַ/יֵּצֵ֣א אֶל פָּנָ֗י/ו יֵה֣וּא בֶן חֲנָ֘נִי֮ הַ/חֹזֶה֒ וַ/יֹּ֨אמֶר֙ אֶל הַ/מֶּ֣לֶךְ יְהוֹשָׁפָ֔ט הֲ/לָ/רָשָׁ֣ע לַ/עְזֹ֔ר וּ/לְ/שֹׂנְאֵ֥י יְהוָ֖ה תֶּאֱהָ֑ב וּ/בָ/זֹאת֙ עָלֶ֣י/ךָ קֶּ֔צֶף מִ/לִּ/פְנֵ֖י יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/019/002.yaml
  text: Jehu son of Hanani the seer went out to meet him and said to King Jehoshaphat[a], “Should you help the wicked and love those who hate Yahweh? Because of this[b], wrath is upon you from the presence of Yahweh.”
translation:
  language: tl
  text: Si Jehu na anak ni Hanani, ang tagakita, ay lumabas upang salubungin siya[a] at sinabi kay Haring Jehoshafat, “Dapat mo bang tulungan ang masama at ibigin ang mga napopoot kay Yahweh? Dahil dito, ang matinding galit mula kay Yahweh[b] ay nasa iyo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa mas literal na anyo, “lumabas patungo sa harapan niya.” Ang Hebreong idyoma ay nangangahulugang lumabas upang salubungin siya.
    reason: lexical_alternative
  - marker: b
    text: Sa mas literal na anyo, “mula sa harapan ni Yahweh.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא אֶל־פָּנָיו
  choice: lumabas upang salubungin siya
  rationale: Ang literal na larawan ay paglabas patungo sa harapan ng isang tao, ngunit ang idyoma sa konteksto ay nangangahulugang lumabas upang makipagtagpo o sumalubong. Natural sa Tagalog ang “lumabas upang salubungin siya.”
- source_word: הַחֹזֶה
  choice: ang tagakita
  rationale: Tiyak na titulong propetiko ang חֹזֶה. Pinananatili ng “tagakita” ang pagkakaiba nito sa pangkalahatang katawagang “propeta.”
- source_word: הֲלָרָשָׁע לַעְזֹר
  choice: Dapat mo bang tulungan ang masama
  rationale: Ipinahihiwatig ng tanong ang pagsaway. Ang pang-uring may pantukoy ay pinanatiling pangkalahatang kategoryang moral na “ang masama,” sa halip na tahasang tukuyin si Ahab.
- source_word: וּלְשֹׂנְאֵי יְהוָה תֶּאֱהָב
  choice: at ibigin ang mga napopoot kay Yahweh
  rationale: Pinananatili ng “mga napopoot” ang pandiwang lakas ng participle, sa halip na gawing mas malawak na “mga kaaway.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasatitik ang personal na pangalang tipan sa teksto sa halip na palitan ito ng isang titulo.
- source_word: וּבָזֹאת
  choice: Dahil dito
  rationale: Malinaw nitong ipinapakita na ang naging kilos ni Jehoshafat ang dahilan ng kasunod na pahayag ng paghatol.
- source_word: עָלֶיךָ קֶּצֶף
  choice: ang matinding galit ... ay nasa iyo
  rationale: Ipinahahayag ng קֶצֶף ang matinding banal na galit. Pinananatili ng “ay nasa iyo” ang kongkretong anyo ng Hebreong עָלֶיךָ.
- source_word: מִלִּפְנֵי יְהוָה
  choice: mula kay Yahweh
  rationale: Ang literal na “mula sa harapan ni Yahweh” ay isang idyomang nagsasaad na kay Yahweh nagmumula ang galit. Natural sa Tagalog ang “mula kay Yahweh,” habang inilalagay sa talababa ang literal na larawan.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehova
  rationale: Tuwirang ginagamit ng talata ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng titulo.
- issue: Saklaw ng “ang masama” at “mga napopoot kay Yahweh”
  choice: Pinanatili bilang mga pangkalahatang kategoryang moral
  alternative: Tahasan itong ipakahulugan bilang pagtukoy lamang kay Ahab
  rationale: Bagaman si Ahab ang agarang makasaysayang tinutukoy, malawak ang pananalita ng Hebreo. Hindi ito pinaliit sa isang pagpapaliwanag na gumagamit ng pangalang wala sa talata.
- issue: Pinagmulan ng matinding galit
  choice: mula kay Yahweh, na may literal na larawan sa talababa
  alternative: mula sa harapan ni Yahweh
  rationale: Ipinahihiwatig ng מִלִּפְנֵי ang pinagmulan sa presensiya ni Yahweh. Ang pangunahing salin ay natural sa Tagalog, at ang talababa ay nagpapanatili sa Hebreong larawan.
translation_notes:
  register: Makabago at dignidad na Filipino ang ginamit. Pinili ang “tagakita” bilang tiyak na titulong propetiko, “ibigin” para sa marangal ngunit madaling maunawaang pananalita, at “matinding galit” upang malinaw na maipahayag ang bigat ng banal na poot nang hindi maging lipas o sobrang teknikal.
