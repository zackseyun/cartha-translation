source:
  edition: WLC
  text: וְ/גַ֣ם בִּ֠/ירוּשָׁלִַם הֶעֱמִ֨יד יְהוֹשָׁפָ֜ט מִן הַ/לְוִיִּ֣ם וְ/הַ/כֹּהֲנִ֗ים וּ/מֵ/רָאשֵׁ֤י הָ/אָבוֹת֙ לְ/יִשְׂרָאֵ֔ל לְ/מִשְׁפַּ֥ט יְהוָ֖ה וְ/לָ/רִ֑יב וַ/יָּשֻׁ֖בוּ יְרוּשָׁלִָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/019/008.yaml
  text: Also in Jerusalem[a], Jehoshaphat appointed some of the Levites, the priests, and the heads of the fathers’ houses of Israel for the judgment of Yahweh and for disputes[b]; and they returned to Jerusalem.
translation:
  language: tl
  text: Sa Jerusalem din, nagtalaga si Jehoshafat ng ilan sa mga Levita, mga pari, at mga pinuno ng mga angkan ng Israel para sa paghatol ni Yahweh[a] at sa mga alitan. At bumalik sila sa Jerusalem.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring unawain bilang “para sa paghatol para kay Yahweh,” gaya ng mga kasong pinamamahalaan ng kautusan ni Yahweh.
    reason: lexical_alternative
  - marker: b
    text: 'Sa Hebreo: “At bumalik sila sa Jerusalem.” Medyo biglaan ang pahayag na ito sa konteksto. Iba ang pagkaunawa ng ilan sa teksto, gaya ng “At umupo sila sa Jerusalem” o “At nanirahan sila sa Jerusalem.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וְגַם בִּירוּשָׁלִַם
  choice: Sa Jerusalem din
  rationale: Likas na modernong Tagalog na pinananatili ang pandagdag na diwa ng וְגַם at ang lokatibong kahulugan ng בִּירוּשָׁלִַם.
- source_word: הֶעֱמִיד
  choice: nagtalaga
  rationale: Sa kontekstong administratibo at panghukuman, tumutukoy ang Hiphil sa paglalagay ng mga tao sa isang tungkulin; malinaw itong ipinapahayag ng “nagtalaga.”
- source_word: מִן הַלְוִיִּם וְהַכֹּהֲנִים וּמֵרָאשֵׁי הָאָבוֹת לְיִשְׂרָאֵל
  choice: ng ilan sa mga Levita, mga pari, at mga pinuno ng mga angkan ng Israel
  rationale: Ipinahahayag ng “ilan sa” ang partitive na gamit ng מִן/מֵ. Ang “mga angkan” ay natural at malinaw na katumbas ng panlipunang yunit na tinutukoy ng ‘mga sambahayan ng mga ama.’
- source_word: לְמִשְׁפַּט יְהוָה
  choice: upang humatol para kay Yahweh
  rationale: Pinananatili nito ang kaugnayan ng paghatol kay Yahweh nang hindi tahasang nililimitahan kung ito ay paghatol sa ngalan niya, ayon sa batas niya, o sa mga kasong nauukol sa kanya; inilalahad sa talababa ang saklaw ng parirala.
- source_word: וְלָרִיב
  choice: at lumutas ng mga usapin
  rationale: Ang רִיב sa kontekstong legal ay pagtatalo, kaso, o usaping pinagtatalunan. Ang “mga usapin” ay dignificado at madaling maunawaan, habang ipinahihiwatig ng pandiwang “lumutas” ang tungkulin ng mga itinalaga.
- source_word: וַיָּשֻׁבוּ יְרוּשָׁלִָם
  choice: At bumalik sila sa Jerusalem
  rationale: Ito ang tuwirang kahulugan ng natanggap na tekstong Hebreo, kahit tila biglaan ito matapos banggitin ang Jerusalem sa simula; pinananatili ang kahirapan sa pangunahing teksto at ipinaliliwanag sa talababa.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Direktang kinakatawan ng “Yahweh” ang natatanging banal na pangalan sa tekstong Hebreo at iniiwasang ipagkamali ito sa karaniwang titulong ‘Panginoon.’
- issue: Saklaw ng לְמִשְׁפַּט יְהוָה
  choice: upang humatol para kay Yahweh
  alternative: para sa paghatol ni Yahweh; sa mga kasong saklaw ng kautusan ni Yahweh
  rationale: Hindi tiyak ng gramatika lamang kung ang tinutukoy ay paghatol na nauukol kay Yahweh, isinasagawa sa ngalan niya, o pinamamahalaan ng kautusan niya. Hindi ito nilimitahan sa iisang pakahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, dignificado, at angkop sa pampublikong pagbasa. Ginamit ang “angkan” sa halip na literal ngunit mabigat na “sambahayan ng mga ama,” at pinanatili sa talababa ang tunay na tekstuwal at semantikong mga kalabuan.
