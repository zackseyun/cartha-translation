base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/019/009.yaml
  text: And he commanded them[a], saying, “Thus you shall act in the fear of Yahweh[d][c][b], in faithfulness and with a whole heart.”
translation:
  language: tl
  text: Iniutos niya sa kanila, “Ganito kayo kikilos[a] nang may takot kay Yahweh[b], nang may katapatan[c] at buong puso.[d]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Ganito ang gagawin ninyo.”
    reason: lexical_alternative
  - marker: b
    text: Ang “takot kay Yahweh” ay maaari ring ipahayag na “pagpipitagan kay Yahweh.”
    reason: lexical_alternative
  - marker: c
    text: O “nang may integridad” o “nang tapat.”
    reason: lexical_alternative
  - marker: d
    text: O “nang may pusong hindi hati.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו עֲלֵיהֶם לֵאמֹר
  choice: Iniutos niya sa kanila
  rationale: Ang צוה na may עַל ay tumutukoy sa pagbibigay ng utos sa kanila. Likas sa modernong Tagalog ang “iniutos niya sa kanila”; hindi na kailangang isalin nang hiwalay ang karaniwang Hebreong panandang-sipi na לֵאמֹר.
- source_word: כֹּה תַעֲשׂוּן
  choice: Ganito kayo kikilos
  rationale: Malawak ang kahulugan ng עשה—“gumawa” o “kumilos.” Sa konteksto ng tungkuling panghukuman, malinaw at natural ang “kikilos,” habang pinananatili ng “ganito” ang כֹּה at ng anyong panghinaharap ang puwersa ng tagubilin.
- source_word: בְּיִרְאַת יְהוָה
  choice: nang may takot kay Yahweh
  rationale: Saklaw ng יראה ang tunay na takot at mapitagang pagkilala sa Diyos. Pinananatili ng “takot” ang bigat at posibleng lawak ng Hebreo sa halip na paliitin ito sa paggalang lamang.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin ang Tetragrammaton bilang personal na pangalang “Yahweh,” hindi pinapalitan ng isang titulo.
- source_word: בֶּאֱמוּנָה
  choice: nang may katapatan
  rationale: Sa tagubilin sa mga hukom, ang אֱמוּנָה ay tumutukoy sa mapagkakatiwalaan at tapat na pagganap, hindi pangunahin sa panloob na pananampalataya.
- source_word: וּבְלֵבָב שָׁלֵם
  choice: at buong puso
  rationale: Pinananatili ng “buong puso” ang larawan ng Hebreo at ipinahihiwatig ang ganap at hindi hating panloob na katapatan nang hindi ito nililimitahan sa isang kahulugang moral lamang.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehova
  rationale: Tuwirang ginagamit sa talata ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalan sa tekstong Hebreo.
- issue: Kahulugan ng אֱמוּנָה sa kontekstong panghukuman
  choice: katapatan
  alternative: integridad o pananampalataya
  rationale: Ang konteksto ay kung paano dapat gampanan ng mga hukom ang kanilang tungkulin. Kaya ang diin ay nasa tapat at mapagkakatiwalaang pagkilos, bagaman maaaring ipahayag din ito bilang integridad.
- issue: Kahulugan ng לֵבָב שָׁלֵם
  choice: buong puso
  alternative: pusong hindi hati
  rationale: Pinananatili ng “buong puso” ang metapora at ang saklaw ng pagiging ganap, taos-puso, at hindi hati, sa halip na pumili lamang ng isa sa mga bahaging iyon.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinili ang tuwirang pangungusap sa halip na panatilihin ang Hebreong “na sinasabi,” na magiging mabigat sa Tagalog. Ang magkakatulad na pariralang “nang may” ay bahagyang nagpapanatili sa inuulit na pang-ukol ng Hebreo, samantalang ang “buong puso” ay natural na idyomang Tagalog.
