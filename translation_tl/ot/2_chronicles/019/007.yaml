id: 2CH.19.7
reference: 2 Chronicles 19:7
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/עַתָּ֕ה יְהִ֥י פַֽחַד יְהוָ֖ה עֲלֵי/כֶ֑ם שִׁמְר֣וּ וַ/עֲשׂ֔וּ כִּֽי אֵ֞ין עִם יְהוָ֣ה אֱלֹהֵ֗י/נוּ עַוְלָ֛ה וּ/מַשֹּׂ֥א פָנִ֖ים וּ/מִקַּח שֹֽׁחַד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/019/007.yaml
  text: Now then[a], let the fear of Yahweh be upon you. Be careful and act, for with Yahweh our God there is no injustice, no partiality, and no taking of a bribe.
translation:
  language: tl
  text: Kaya ngayon, sumainyo ang takot kay Yahweh. Mag-ingat kayo at kumilos, sapagkat kay Yahweh na ating Diyos ay walang kawalang-katarungan, pagtatangi[a], o pagtanggap ng suhol.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal na Hebreo, “pag-aangat ng mukha,” isang idyoma para sa pagkiling o pagpapakita ng paboritismo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Kaya ngayon
  rationale: Ipinahihiwatig ng parirala ang paglipat tungo sa pangwakas na tagubilin; likas na naihahatid ng “Kaya ngayon” ang temporal at inferensiyal na puwersa nito.
- source_word: יְהִי פַחַד יְהוָה עֲלֵיכֶם
  choice: sumainyo ang takot kay Yahweh
  rationale: Pinananatili ng “sumainyo” ang larawang ‘mapasa ibabaw/inyo’ at ang mapag-utos na diwa ng jussive. Ang “takot” ay sadyang hindi pinalitan ng “paggalang” upang mapanatili ang lawak at tindi ng פַחַד sa konteksto ng pananagutan sa Diyos.
- source_word: שִׁמְרוּ
  choice: Mag-ingat kayo
  rationale: Sa konteksto ng paghatol, hinihingi ng pandiwa ang maingat at mapagbantay na pagsasagawa ng tungkulin, hindi literal na pagbabantay lamang.
- source_word: וַעֲשׂוּ
  choice: at kumilos
  rationale: Inihahatid nito ang utos na isagawa ang nararapat nang hindi nagdaragdag ng tahasang layon na wala sa Hebreo.
- source_word: עַוְלָה
  choice: kawalang-katarungan
  rationale: Ang kahulugang hudisyal at moral ng salita ay malinaw sa konteksto ng mga hukom.
- source_word: מַשֹּׂא פָנִים
  choice: pagtatangi
  rationale: Ito ang natural na salin ng idyomang tumutukoy sa pagkiling o pagbibigay ng pabor batay sa pagkakakilanlan o katayuan ng tao.
- source_word: מִקַּח שֹׁחַד
  choice: pagtanggap ng suhol
  rationale: Tumpak at natural na inilalarawan nito ang nominal na parirala para sa pagtanggap ng bayad na nakaaapekto sa paghatol.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang isinasatitik ang personal na pangalan ng Diyos na kinakatawan ng Tetragrammaton sa tekstong Hebreo.
theological_decisions:
- issue: Kahulugan ng “takot kay Yahweh”
  choice: takot kay Yahweh
  alternative: matinding paggalang kay Yahweh
  rationale: Pinananatili ang mismong metapora at teolohikal na tensiyon ng פַחַד; maaaring kabilang dito ang pagpipitagan, ngunit hindi dapat paliitin ang kahulugan sa paggalang lamang.
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Ginamit ang transliterasyon ng pangalang nasa Hebreong teksto sa halip na palitan ito ng isang titulo.
translation_notes:
  register: Makabago at malinaw na Filipino na may marangal na himig. Pinanatili ang bahagyang pormal na “sumainyo” dahil mahusay nitong naihahatid ang larawang Hebreo nang hindi nagpapasok ng dagdag na paliwanag. Inilagay ang talababa pagkatapos ng “pagtatangi,” ang salitang talagang ipinapaliwanag nito.
