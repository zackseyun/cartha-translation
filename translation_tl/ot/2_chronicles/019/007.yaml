  source_fidelity: 'Tapat ang salin sa Hebreo. Ang “Kaya ngayon” ay angkop sa exhortatory/concluding force ng וְעַתָּה; naihahatid ng “sumainyo ang takot kay Yahweh” ang jussive na יְהִי at ang reverential accountability na saklaw ng פַחַד. Ang magkakaugnay na utos na “Mag-ingat kayo at kumilos” ay wasto para sa שִׁמְרוּ וַעֲשׂוּ. Kumpleto rin at tumpak ang talaan: kawalang-katarungan, pagtatangi, at pagtanggap ng suhol.'
