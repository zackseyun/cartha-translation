  to: Kaya nanirahan si Jehoshafat sa Jerusalem at muli[a] siyang lumabas upang maglibot sa bayan, mula sa Beer-seba hanggang sa kaburulan ng Efraim, at ibinalik niya sila kay Yahweh,[b] ang Diyos ng kanilang mga ninuno.
