base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/019/004.yaml
  text: So Jehoshaphat lived in Jerusalem[a], and he went out again among the people from Beersheba to the hill country of Ephraim and brought them back to Yahweh[b], the God of their fathers.
translation:
  language: tl
  text: Kaya nanirahan si Jehoshafat sa Jerusalem at muli[a] siyang lumabas upang maglibot sa bayan, mula sa Beer-seba hanggang sa kaburulan ng Efraim, at ibinalik niya sila kay Yahweh,[b] ang Diyos ng kanilang mga ninuno.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “bumalik siya at lumabas sa gitna ng bayan.” Inuulit sa Hebreo ang pandiwang “bumalik” bago ang “lumabas,” na malamang ay nagpapakitang ipinagpatuloy niya ang gawaing ito matapos siyang bumalik.'
    reason: lexical_alternative
  - marker: b
    text: Ang “Yahweh” ay paglilipat-titik ng banal na pangalang YHWH; tradisyonal din itong isinasalin na “ang PANGINOON.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: nanirahan
  rationale: Ang ישׁב ay tumutukoy rito sa paninirahan sa isang lugar, hindi sa literal na pag-upo. Likas at marangal sa modernong Tagalog ang “nanirahan.”
- source_word: וַיָּשָׁב וַיֵּצֵא
  choice: Muli siyang naglakbay
  rationale: Ang pag-uulit ng ugat na שוב bago ang “lumabas” ay nagpapahiwatig na ipinagpatuloy o inulit ni Jehoshafat ang pag-iikot matapos bumalik sa Jerusalem. Inililipat ng “muli” ang puwersang adberbyal nang hindi mabigat ang salin.
- source_word: וַיֵּצֵא בָעָם
  choice: naglakbay sa gitna ng bayan
  rationale: Ang בָעָם ay nagsasaad ng pagkilos sa gitna o kabuuan ng sambayanan. Mas malinaw sa Tagalog ang “naglakbay sa gitna ng bayan” kaysa literal na “lumabas sa bayan.”
- source_word: מִבְּאֵר שֶׁבַע עַד הַר אֶפְרַיִם
  choice: mula sa Beer-seba hanggang sa kaburulan ng Efraim
  rationale: Ang הַר אֶפְרַיִם ay heograpikong rehiyong bulubundukin; inilalarawan ito nang likas bilang “kaburulan ng Efraim.”
- source_word: וַיְשִׁיבֵם
  choice: ibinalik niya sila
  rationale: Ang hiphil ng שוב na may hulaping layon ay nangangahulugang pinabalik o ibinalik sila. Pinananatili ng salin ang aktibong sanhi nang hindi ito tahasang ginagawang “pinagsisi” o “kinumberte.”
- source_word: אֶל יְהוָה
  choice: kay Yahweh
  rationale: Direktang tinutumbasan ng “Yahweh” ang pangalang tipan na יהוה at ipinakikita ng “kay” ang pagbabalik-loob at katapatan sa kaniya.
- source_word: אֱלֹהֵי אֲבוֹתֵיהֶם
  choice: ang Diyos ng kanilang mga ninuno
  rationale: Ang “mga ninuno” ay natural at inklusibong modernong katumbas ng אֲבוֹתֵיהֶם sa diwang genealogical, habang pinananatili ang ugnayan sa pananampalataya ng mga salinlahi.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: ang PANGINOON; Jehova
  rationale: Ang tekstong Hebreo ay tahasang gumagamit ng Tetragrammaton. Ang transliterasyong “Yahweh” ay nagpapanatili sa katangian nito bilang personal na pangalan ng Diyos nang hindi nag-aangkat ng katawagang denominasyonal.
- issue: Kalikasan ng pagkilos sa וַיְשִׁיבֵם אֶל יְהוָה
  choice: ibinalik niya sila kay Yahweh
  alternative: pinagsisi niya sila; kinumberte niya sila
  rationale: Pinananatili ng “ibinalik” ang metapora at sanhi sa Hebreo, ngunit hindi nito nilulutas nang lampas sa teksto kung ang pagbabalik ay pangunahing pagsisisi, pagpapanibagong panrelihiyon, o katapatan sa tipan.
translation_notes:
  register: Modernong Filipino Tagalog na dignified ngunit madaling maunawaan. Ginamit ang “bayan” para sa sambayanan, “kaburulan” para sa heograpikong rehiyon, at “mga ninuno” bilang natural na katumbas ng ancestral plural. Ang mga pangungusap ay hinati upang maging malinaw ang takbo nang hindi binabago ang ugnayan ng mga sugnay.
