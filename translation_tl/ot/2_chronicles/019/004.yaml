    rationale: Ang וַיֵּצֵא ay literal na “lumabas”; ang saklaw na “mula Beer-seba hanggang kaburulan ng Efraim” ay nagpapahiwatig ng pag-iikot, ngunit hindi hinihingi ang partikular na pandiwang “naglakbay.”
