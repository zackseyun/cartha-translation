  naturalness: Likas at angkop ang rehistro sa kabuuan. Ang “muli siyang lumabas upang maglibot sa bayan” ay mas idiomatiko at mas malapit sa pandiwang Hebreo kaysa “muli siyang naglakbay sa gitna ng bayan.”
  terminology: Maayos ang “Yahweh,” “Diyos,” “kaburulan ng Efraim,” at “mga ninuno.” Pinananatili ng “ibinalik niya sila” ang sanhi at metapora ng Hebreo nang walang dagdag na pagpapakahulugang doktrinal.
