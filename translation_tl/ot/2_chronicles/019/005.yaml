base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/019/005.yaml
  text: And he appointed judges in the land[a], in all the fortified cities of Judah, city by city.
translation:
  language: tl
  text: Nagtalaga siya ng mga hukom sa lupain[a], sa lahat ng pinatibay na lungsod ng Juda—sa bawat lungsod.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa buong lupain.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֵד
  choice: Nagtalaga siya
  rationale: Ang Hiphil ng עמד dito ay tumutukoy sa paglalagay o pagtatalaga ng mga tao sa tungkulin, hindi lamang sa literal na pagpapatayo sa kanila.
- source_word: שֹׁפְטִים
  choice: mga hukom
  rationale: Tumutukoy ito sa mga opisyal na nangangasiwa sa paghatol; ang “mga hukom” ang tuwiran at karaniwang salin.
- source_word: בָּאָרֶץ
  choice: sa lupain
  rationale: Pinananatili nito ang payak na lokatibong diwa ng Hebreo; ipinahihiwatig naman ng kasunod na parirala ang lawak ng pagtatalaga.
- source_word: בְּכָל עָרֵי יְהוּדָה
  choice: sa lahat ng ... lungsod ng Juda
  rationale: Pinananatili ang saklaw na ipinahahayag ng כָל at ang kaugnayan ng mga lungsod sa Juda.
- source_word: הַבְּצֻרוֹת
  choice: napapaderang
  rationale: Inilalarawan nito ang mga lungsod bilang pinatibay at ipinagtatanggol; natural sa kontekstong sinauna ang “napapaderang lungsod.”
- source_word: לְעִיר וָעִיר
  choice: sa bawat lungsod
  rationale: Natural na Filipino ito para sa distributibong idyomang Hebreo at malinaw na nagsasaad ng hiwa-hiwalay na pagtatalaga sa bawat lungsod.
