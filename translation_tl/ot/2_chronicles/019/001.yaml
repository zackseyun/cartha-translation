  text: וַ֠/יָּשָׁב יְהוֹשָׁפָ֨ט מֶֽלֶךְ יְהוּדָ֧ה אֶל בֵּית֛/וֹ בְּ/שָׁל֖וֹם לִֽ/ירוּשָׁלִָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/019/001.yaml
  text: And Jehoshaphat king of Judah returned in peace to his house in Jerusalem[a].
translation:
  language: tl
  text: At si Jehoshafat na hari ng Juda ay payapang nakabalik sa kaniyang tahanan sa Jerusalem.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ligtas na nakabalik sa kaniyang tahanan sa Jerusalem.” Ang pariralang Hebreo na isinaling “payapang” ay maaari ring magdiin sa ligtas na pagbabalik.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: nakabalik
  rationale: Ang pandiwang שׁוב ay nangangahulugang bumalik. Ang “nakabalik” ay natural sa salaysay at, kasama ng “payapa,” ay angkop sa natapos na ligtas na pagbabalik.
- source_word: יְהוֹשָׁפָט
  choice: Jehoshafat
  rationale: Ginamit ang karaniwang anyong Filipino ng pangalang Hebreo, na malapit din sa transliterasyon ng pinagmulan.
- source_word: מֶלֶךְ יְהוּדָה
  choice: hari ng Juda
  rationale: Tuwirang inilalarawan ng pariralang konstrakto ang katungkulan ni Jehoshafat.
- source_word: אֶל בֵּיתוֹ
  choice: sa kaniyang tahanan
  rationale: Maaaring mangahulugan ang בַּיִת ng bahay o tahanan. Mas natural sa Filipino ang “tahanan” kapag tinutukoy ang lugar na inuuwian, nang hindi binabago ang kongkretong patutunguhan.
- source_word: בְּשָׁלוֹם
  choice: payapang
  rationale: Saklaw ng שָׁלוֹם ang kapayapaan, kalagayang mabuti, at kaligtasan. Pinananatili ng “payapang” ang pangunahing idyoma, habang inilalahad sa talababa ang posibleng diin sa ligtas na pagbabalik.
- source_word: לִירוּשָׁלִָם
  choice: sa Jerusalem
  rationale: Bagaman לְ ay karaniwang “patungo sa,” ang natural na Filipino matapos ang “sa kaniyang tahanan” ay “sa Jerusalem,” na nagpapakitang naroon ang tahanan.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na natural at marangal. Pinanatili ang salaysay na payak, at ang lawak ng kahulugan ng בְּשָׁלוֹם ay hindi nilimitahan sa kapayapaan lamang o sa pisikal na kaligtasan lamang.
