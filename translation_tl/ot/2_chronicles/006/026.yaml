base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/026.yaml
  text: When the heavens are shut up and there is no rain because they have sinned against you[a], and they pray toward this place and confess your name and turn from their sin because you answer them,
translation:
  language: tl
  text: Kapag nakapinid ang langit at walang ulan dahil nagkasala sila sa iyo, at nananalangin sila nang nakaharap sa lugar na ito, kinikilala ang iyong pangalan, at tumatalikod sa kanilang kasalanan sapagkat sinasagot mo sila,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּהֵעָצֵר הַשָּׁמַיִם
  choice: Kapag nakapinid ang langit
  rationale: Ang Niphal ng עצר ay nagpapahayag ng pagpigil o pagsasara. Pinananatili ng “nakapinid ang langit” ang kongkretong larawan ng Hebreo habang nauunawaan sa modernong Tagalog.
- source_word: וְלֹא יִהְיֶה מָטָר
  choice: at walang ulan
  rationale: Natural at tuwirang salin ng payak na pahayag na hindi magkakaroon ng ulan.
- source_word: כִּי יֶחֶטְאוּ לָךְ
  choice: dahil nagkasala sila sa iyo
  rationale: Causal ang כִּי, at ang לָךְ ay tumutukoy sa Diyos bilang siyang pinagkasalahan.
- source_word: וְהִתְפַּלְלוּ אֶל הַמָּקוֹם הַזֶּה
  choice: at manalangin sila nang nakaharap sa lugar na ito
  rationale: Ang אֶל ay nagpapahiwatig ng direksiyon ng panalangin, hindi na ang lugar mismo ang dinadalanginan.
- source_word: וְהוֹדוּ אֶת שְׁמֶךָ
  choice: kilalanin ang iyong pangalan
  rationale: Ang Hiphil ng ידה ay maaaring magpahayag ng pagkilala, pagpapahayag, pagpuri, o pasasalamat. Ang “kilalanin” ay angkop sa konteksto ng panalangin at pagsisisi nang hindi masyadong nililimitahan ang saklaw ng pandiwa.
- source_word: מֵחַטָּאתָם יְשׁוּבוּן
  choice: at talikuran ang kanilang kasalanan
  rationale: Pinananatili nito ang larawan ng שוב + מן, ang pagtalikod mula sa kasalanan, sa halip na palitan ito ng mas interpretibong terminong “magsisi.”
- source_word: כִּי תַעֲנֵם
  choice: sapagkat pinahihirapan mo sila
  rationale: Sa pagkakasunod-sunod ng tagtuyot, panalangin, pagkilala sa pangalan ng Diyos, at pagtalikod sa kasalanan, ang diwang “pahirapan” o “papagpakumbabain” ay nagbibigay ng malinaw na sanhi ng kanilang pagbabalik. Gayunman, maaari ring unawain ang anyo bilang “sinasagot mo sila,” kaya pinanatili iyon sa talababa.
theological_decisions:
- issue: Kahulugan ng ענה sa huling sugnay
  choice: sapagkat pinahihirapan mo sila
  alternative: sapagkat sinasagot mo sila; sapagkat pinagpapakumbaba mo sila
  rationale: Maaaring iugnay ang anyong Hebreo sa pandiwang “pahirapan/papagpakumbabain” o sa “sumagot.” Mas angkop sa causal na daloy ang pagpapahirap na umaakay sa pagtalikod sa kasalanan, ngunit hindi tiyak nang lubos ang pagbasa kaya hayagang inilalahad ang mga alternatibo.
translation_notes:
  register: Makabago ngunit marangal na Tagalog. Ginamit ang “nakapinid” upang mapanatili ang larawan ng langit na isinara, at “nang nakaharap” upang malinaw na direksiyon ng panalangin ang tinutukoy. Pinanatili ang kuwit sa hulihan dahil nagpapatuloy ang pangungusap sa kasunod na talata.
