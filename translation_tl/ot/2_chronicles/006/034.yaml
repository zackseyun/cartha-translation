id: 2CH.6.34
reference: 2 Chronicles 6:34
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: כִּֽי יֵצֵ֨א עַמְּ/ךָ֤ לַ/מִּלְחָמָה֙ עַל א֣וֹיְבָ֔י/ו בַּ/דֶּ֖רֶךְ אֲשֶׁ֣ר תִּשְׁלָחֵ֑/ם וְ/הִתְפַּֽלְל֣וּ אֵלֶ֗י/ךָ דֶּ֣רֶךְ הָ/עִ֤יר הַ/זֹּאת֙ אֲשֶׁ֣ר בָּחַ֣רְתָּ בָּ֔/הּ וְ/הַ/בַּ֖יִת אֲשֶׁר בָּנִ֥יתִי לִ/שְׁמֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/034.yaml
  text: If your people go out to battle against their enemies by the way that you send them[a], and they pray to you toward this city that you have chosen and the house that I have built for your name[b],
translation:
  language: tl
  text: Kung lalabas ang iyong bayan upang makipaglaban sa kanilang mga kaaway sa daang ipinadala mo silang tahakin, at mananalangin sila sa iyo nang nakaharap sa lungsod na ito[a] na iyong pinili at sa bahay na itinayo ko para sa iyong pangalan[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa direksiyon ng lungsod na ito.” Literal na gumagamit ang Hebreo ng salitang “daan” upang tukuyin ang direksiyon ng pagharap sa panalangin.
    reason: lexical_alternative
  - marker: b
    text: Ang “bahay” ay ang templong itinayo ni Solomon para sa pangalan ng PANGINOON.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: Kung
  rationale: Ipinakikilala nito ang isang maaaring kalagayan sa loob ng panalangin ni Solomon; ang “Kung” ay malinaw na nagpapanatili sa kondisyunal na ayos ng pangungusap.
- source_word: יֵצֵא עַמְּךָ לַמִּלְחָמָה
  choice: lalabas ang iyong bayan upang makipaglaban
  rationale: Pinananatili ng “lalabas” ang payak na diwa ng יצא, habang natural na ipinahahayag ng “upang makipaglaban” ang pariralang militar na לַמִּלְחָמָה.
- source_word: עַל אֹיְבָיו
  choice: sa kanilang mga kaaway
  rationale: Bagaman pang-isahan ang panlaping Hebreo dahil kolektibong pangngalan ang עַם, natural sa Filipino ang pangmaramihang pagtukoy sa mga taong bumubuo sa bayan.
- source_word: בַּדֶּרֶךְ אֲשֶׁר תִּשְׁלָחֵם
  choice: sa daang ipinadala mo silang tahakin
  rationale: Pinananatili ang larawan ng isang daan o ruta at ang pagkilos ng Diyos na nagsusugo sa kanila, ngunit isinaayos sa likas na sintaks ng Filipino.
- source_word: וְהִתְפַּלְלוּ אֵלֶיךָ
  choice: at mananalangin sila sa iyo
  rationale: Tuwirang ipinahahayag ang panalanging nakatuon sa Diyos.
- source_word: דֶּרֶךְ הָעִיר הַזֹּאת
  choice: nang nakaharap sa lungsod na ito
  rationale: Sa kontekstong ito, ang דֶּרֶךְ ay nagsasaad ng direksiyon ng pagharap habang nananalangin, hindi ng paglalakbay patungo sa lungsod.
- source_word: אֲשֶׁר בָּחַרְתָּ בָּהּ
  choice: na iyong pinili
  rationale: Tuwirang pinananatili ang pagpili ng Diyos sa lungsod; hindi na kailangang ulitin sa Filipino ang lokatibong panlapi ng Hebreo.
- source_word: וְהַבַּיִת אֲשֶׁר בָּנִיתִי
  choice: at sa bahay na itinayo ko
  rationale: Pinananatili ang literal at teolohikal na mahalagang katawagang “bahay,” habang nililinaw sa talababa na templo ang tinutukoy.
- source_word: לִשְׁמֶךָ
  choice: para sa iyong pangalan
  rationale: Tuwirang pinananatili ang pormulang tumutukoy sa pagtatalaga ng templo sa pangalan ng Diyos nang hindi ito pinalalawak sa isang tiyak na doktrinal na paliwanag.
theological_decisions:
- issue: Ang pisikal na direksiyon ng panalangin patungo sa Jerusalem at sa templo
  choice: 'Pinanatili ang kongkretong pagharap: “nang nakaharap sa lungsod na ito ... at sa bahay.”'
  alternative: Unawain lamang ito sa abstraktong diwa bilang panalanging may kaugnayan sa Jerusalem o sa templo.
  rationale: Binibigyang-diin ng Hebreo ang aktuwal na direksiyon ng panalangin sa makasaysayang konteksto ng panalangin ni Solomon. Hindi ito isinaespirituwal o ginawan ng konklusyong lampas sa talata.
- issue: Ang “bahay” na itinayo para sa pangalan ng Diyos
  choice: Ginamit ang “bahay” sa pangunahing teksto at ipinaliwanag sa talababa na templo ang tinutukoy.
  alternative: Isalin agad bilang “templo.”
  rationale: Ang “bahay” ay malapit sa salitang Hebreo at nagpapanatili ng mahalagang paglalarawan nito, samantalang sapat na nililinaw ng talababa ang makasaysayang tinutukoy.
translation_notes:
  register: Makabago at dignidad na Filipino ang ginamit. Pinili ang “bayan” para sa kolektibong bayan ng Diyos, “makipaglaban” para sa malinaw na kontekstong militar, at “bahay” upang mapanatili ang larawan ng Hebreo. Ang pangungusap ay iniwang may kuwit sa hulihan sapagkat nagpapatuloy ang kondisyunal na panalangin sa kasunod na talata.
