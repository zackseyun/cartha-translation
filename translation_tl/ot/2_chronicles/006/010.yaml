id: 2CH.6.10
reference: 2 Chronicles 6:10
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יָּ֣קֶם יְהוָ֔ה אֶת דְּבָר֖/וֹ אֲשֶׁ֣ר דִּבֵּ֑ר וָ/אָק֡וּם תַּחַת֩ דָּוִ֨יד אָבִ֜/י וָ/אֵשֵׁ֣ב עַל כִּסֵּ֣א יִשְׂרָאֵ֗ל כַּ/אֲשֶׁר֙ דִּבֶּ֣ר יְהוָ֔ה וָ/אֶבְנֶ֣ה הַ/בַּ֔יִת לְ/שֵׁ֥ם יְהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/010.yaml
  text: And Yahweh has fulfilled his word that he spoke[a], and I have risen in the place of David my father and sit on the throne of Israel, as Yahweh spoke, and I have built the house for the name of Yahweh[b], the God of Israel.
translation:
  language: tl
  text: At tinupad ni Yahweh ang salitang sinabi niya[a]. Humalili ako sa aking amang si David at umupo sa trono ng Israel, gaya ng sinabi ni Yahweh, at itinayo ko ang bahay para sa pangalan ni Yahweh[b], ang Diyos ng Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “pinagtibay” o “isinakatuparan ang salitang sinabi niya.” Literal na ipinahihiwatig ng pandiwang Hebreo na pinangyari ni Yahweh na “manatiling nakatayo” ang kanyang salita.
    reason: lexical_alternative
  - marker: b
    text: Ang “bahay” ay tumutukoy sa templo. Pinananatili rito ang ekspresyong Hebreo na “bahay para sa pangalan ni Yahweh.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֶם
  choice: tinupad
  rationale: Sa Hiphil, ang קום na may layon na 'salita' ay nangangahulugang pinangyaring manatiling nakatayo o isinakatuparan; natural sa Tagalog ang 'tinupad' para sa salitang ipinangako.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang banal na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: דְּבָרוֹ אֲשֶׁר דִּבֵּר
  choice: ang salitang sinabi niya
  rationale: Pinananatili ang pag-uulit ng ugat na דבר hangga't natural sa Tagalog at hindi agad nililimitahan ang 'salita' sa tahasang 'pangako.'
- source_word: וָאָקוּם תַּחַת דָּוִיד אָבִי
  choice: Humalili ako sa aking amang si David
  rationale: Ang תַּחַת sa konteksto ng pagmamana ng paghahari ay 'kapalit' o 'kahalili'; malinaw at natural na ipinahahayag ng 'humalili' ang dinastikong pagsunod.
- source_word: וָאֵשֵׁב עַל כִּסֵּא יִשְׂרָאֵל
  choice: umupo sa trono ng Israel
  rationale: Tuwirang maharlikang pananalita na natural sa modernong Tagalog; ang magkakasunod na wayyiqtol ay isinalin bilang naganap na mga kilos.
- source_word: וָאֶבְנֶה הַבַּיִת
  choice: itinayo ko ang bahay
  rationale: Pinananatili ang literal at kanonikal na 'bahay,' bagaman templo ang tinutukoy, upang mapanatili ang kasunod na pariralang tungkol sa pangalan ni Yahweh.
- source_word: לְשֵׁם יְהוָה
  choice: para sa pangalan ni Yahweh
  rationale: Pinananatili ang mahalagang pormulang Hebreo na nagsasabing ang bahay ay para sa pangalan ni Yahweh, nang hindi ito pinapakahulugang tirahan na naglalaman sa Diyos.
theological_decisions:
- issue: Tawag sa gusaling itinayo ni Solomon
  choice: ang bahay
  alternative: ang templo
  rationale: Bagaman templo ang referent, בַּיִת ay 'bahay.' Pinananatili nito ang ekspresyong teolohikal at pampanitikan ng Hebreo; nililinaw ng talababa ang tinutukoy.
- issue: Paglalarawan sa layunin ng bahay
  choice: para sa pangalan ni Yahweh
  alternative: bilang parangal kay Yahweh
  rationale: Hindi pinapawi ang natatanging konsepto ng 'pangalan' sa teksto, na mahalaga rin sa mas malawak na panalangin ni Solomon.
- issue: Paglilipat sa יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Tuwirang kinakatawan ang personal na pangalang nasa tekstong Hebreo sa halip na palitan ito ng titulo.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang 'humalili' upang natural na maipahayag ang pagbangon ni Solomon bilang kahalili ni David, habang pinanatili ang 'bahay' at 'para sa pangalan' dahil sa kanilang mahalagang ugnayang pampanitikan at teolohikal.
