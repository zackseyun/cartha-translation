  text: But I have built for you a lofty house, a place for you to dwell forever.
translation:
  language: tl
  text: Ngunit nagtayo ako para sa iyo ng isang mataas na tahanan, isang lugar upang manahan ka magpakailanman.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֵית זְבֻל
  choice: isang maringal na tahanan
  rationale: Ang זְבֻל ay tumutukoy sa isang mataas, marangal, o maringal na tirahan. Pinananatili ng “maringal na tahanan” ang dignidad ng parirala at mas natural ito sa makabagong Tagalog kaysa sa literal na “mataas na bahay.”
- source_word: מָכוֹן
  choice: isang lugar
  rationale: Ipinahahayag nito ang diwa ng isang nakatalaga o matatag na dako nang hindi nagdaragdag ng kahulugang wala sa talata.
- source_word: לְשִׁבְתְּךָ עוֹלָמִים
  choice: na pananahanan mo magpakailanman
  rationale: Tuwirang ipinapahayag ang layuning tirahan ng Diyos at ang pangmatagalang diwa ng עוֹלָמִים sa natural at marangal na Tagalog.
theological_decisions:
- issue: Ang templo bilang walang-hanggang tahanan ng Diyos
  choice: pananahanan mo magpakailanman
  alternative: pananahanan mo sa lahat ng salinlahi
  rationale: Pinananatili ang matinding pahayag ng tekstong Hebreo at hindi ito nililimitahan o ipinaliliwanag ayon sa isang partikular na teolohikal na sistema.
translation_notes:
  register: Makabago ngunit marangal na Filipino Tagalog. Ginamit ang “nagtayo ako para sa iyo” upang malinaw na katawanin ang לָךְ, at ang “pananahanan” upang mapanatili ang solemneng himig ng panalangin ni Solomon.
