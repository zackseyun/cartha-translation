base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/004.yaml
  text: And he said[a], “Blessed be Yahweh, the God of Israel, who spoke with his mouth to David my father and has fulfilled it by his hand, saying,”
translation:
  language: tl
  text: At sinabi niya, “Purihin si Yahweh, ang Diyos ng Israel, na nagsalita sa pamamagitan ng kanyang bibig kay David na aking ama at tumupad nito sa pamamagitan ng kanyang kamay nang sabihin niya[a]:”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O: “na sa pamamagitan ng kanyang bibig ay nagsalita kay David na aking ama at sa pamamagitan ng kanyang kamay ay tumupad nito, na nagsasabi:” Pinananatili ng Hebreo ang sinadyang pagtutumbas ng pagsasalita at pagkilos ng Diyos.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: At sinabi niya
  rationale: Karaniwang salaysay na wayyiqtol; pinananatili ng “At sinabi niya” ang daloy mula sa naunang talata.
- source_word: בָּרוּךְ
  choice: Purihin
  rationale: Natural at marangal na pormulang pagpupuri sa Diyos sa modernong Tagalog; ipinahahayag nito ang puwersa ng benediktibong participle.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang transliterasyon ng personal na pangalang banal na nasa tekstong Hebreo, sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ang Diyos ng Israel
  rationale: Tuwirang salin ng construct chain na nagpapakilala kay Yahweh kaugnay ng Israel.
- source_word: דִּבֶּר בְּפִיו
  choice: nagsalita sa pamamagitan ng sarili niyang bibig
  rationale: Pinananatili ang tahasang antropomorpikong “bibig” at ang sinadyang pagkakatugma nito sa “kamay.”
- source_word: אֵת דָּוִיד אָבִי
  choice: kay David na aking ama
  rationale: Sa konteksto ng דִּבֶּר, si David ang pinagsabihan; malinaw at natural sa Tagalog ang “kay.”
- source_word: וּבְיָדוֹ מִלֵּא
  choice: at tumupad nito sa pamamagitan ng sarili niyang kamay
  rationale: Ang di-tahasang layon ay ang ipinangako o sinalita. Pinananatili ng “kamay” ang paghahambing ng salita at gawa.
- source_word: לֵאמֹר
  choice: Sinabi niya
  rationale: Nagsisilbing panimula sa mismong nilalaman ng pahayag sa susunod na talata; mas natural ito sa Tagalog kaysa sa literal na “na sinasabi.”
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Personal na pangalan ang nasa Hebreo. Ang “Yahweh” ay nagpapanatili rito bilang pangalan at hindi ito pinapalitan ng titulong “PANGINOON.”
- issue: Antropomorpikong paralelismo ng bibig at kamay ng Diyos
  choice: Panatilihin kapwa ang “sarili niyang bibig” at “sarili niyang kamay”
  alternative: “nangako kay David ... at tinupad iyon”
  rationale: Sinadyang itinatambal ng Hebreo ang pagsasalita at pagkilos ng Diyos. Hindi ito dapat gawing abstrakto o ipaliwanag nang lampas sa teksto.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “Purihin” bilang likas na pormula ng pagpupuri, habang pinanatili ang matalinghagang “bibig” at “kamay.” Ang “sarili niyang” ay naglilinaw na iisa ang tinutukoy na gumagawa nang hindi dinaragdagan ang teolohiya ng teksto.
