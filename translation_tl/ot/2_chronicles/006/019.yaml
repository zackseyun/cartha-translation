  text: וּ/פָנִ֜יתָ אֶל תְּפִלַּ֧ת עַבְדְּ/ךָ֛ וְ/אֶל תְּחִנָּת֖/וֹ יְהוָ֣ה אֱלֹהָ֑/י לִ/שְׁמֹ֤עַ אֶל הָ/רִנָּה֙ וְ/אֶל הַ/תְּפִלָּ֔ה אֲשֶׁ֥ר עַבְדְּ/ךָ֖ מִתְפַּלֵּ֥ל לְ/פָנֶֽי/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/019.yaml
  text: Yet turn toward the prayer of your servant and his plea for favor[a], O Yahweh my God[c][b], to hear the cry and the prayer that your servant is praying before you.
translation:
  language: tl
  text: Gayunman, lingapin mo ang panalangin ng iyong lingkod at ang pagsusumamo niya[a], Yahweh, Diyos ko, upang dinggin mo ang daing[b] at ang panalanging idinadalangin ng iyong lingkod sa harap mo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pakiusap niya para sa awa.” Ang salitang Hebreo ay tumutukoy sa marubdob na paghingi ng awa o pabor.
    reason: lexical_alternative
  - marker: b
    text: O “malakas na sigaw.” Maaaring tumukoy ang salitang Hebreo sa isang umaalingawngaw na sigaw; dito, malamang na daing ito para sa tulong sa panalangin.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפָנִיתָ
  choice: Gayunman, lingapin mo
  rationale: Ang פנה ay literal na ‘bumaling’ ngunit sa konteksto ng panalangin ay humihiling ng kanais-nais na pagbaling ng pansin. Likas at marangal sa Tagalog ang ‘lingapin,’ habang ipinahihiwatig ng ‘Gayunman’ ang pagsalungat sa naunang konteksto.
- source_word: תְּפִלַּת
  choice: ang panalangin
  rationale: Karaniwang katumbas ng תפלה at pinananatiling naiiba sa תחנה.
- source_word: עַבְדְּךָ
  choice: iyong lingkod
  rationale: Ang ‘lingkod’ ang angkop sa pananalitang ginagamit ng isang hari na nagpapasakop sa Diyos, nang hindi ipinipilit ang diing legal ng ‘alipin.’
- source_word: תְּחִנָּתוֹ
  choice: ang pagsusumamo niya
  rationale: Ipinahahayag ng תחנה ang marubdob na paghingi ng awa o pabor. Natural at malinaw sa modernong Tagalog ang ‘pagsusumamo.’
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang kinakatawan ng Tetragrammaton sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהָי
  choice: aking Diyos
  rationale: Tuwirang salin ng anyong paari at bahagi ng tuwirang pagtawag kay Yahweh.
- source_word: לִשְׁמֹעַ
  choice: at pakinggan mo
  rationale: Ang infinitive ay kaugnay ng kahilingang lingapin ng Diyos ang panalangin upang dinggin ito. Mas natural sa Tagalog ang koordinadong pakiusap na ‘at pakinggan mo’ kaysa sa ‘upang marinig.’
- source_word: הָרִנָּה
  choice: ang daing
  rationale: Sa kontekstong ito, ang רנה ay isang malakas o matinding sigaw sa panalangin, malamang na paghingi ng tulong. Mahusay itong ipinahahayag ng ‘daing.’
- source_word: הַתְּפִלָּה
  choice: ang panalangin
  rationale: Inuulit ang parehong pangngalan upang mapanatili ang leksikal na pag-uulit at paralelismo ng Hebreo.
- source_word: מִתְפַּלֵּל
  choice: idinadalangin
  rationale: Ipinahahayag ng aspektong imperpektibo ng reduplikadong anyo ang nagpapatuloy na kilos ng participle sa eksena.
- source_word: לְפָנֶיךָ
  choice: sa harap mo
  rationale: Tuwirang natural na katumbas ng idyomang nangangahulugang nasa presensiya ng Diyos.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehova
  rationale: Ginagamit mismo ng talata ang Tetragrammaton. Pinananatili ng ‘Yahweh’ ang pangalan sa halip na palitan ito ng titulong ‘Panginoon,’ nang hindi nagdaragdag ng denominasyonal na pagpapakahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang ‘lingapin’ upang likas na maipahayag ang idyomatikong kahilingan ng Hebreo, at pinanatili ang malinaw na kaibhan ng ‘panalangin,’ ‘pagsusumamo,’ at ‘daing.’
