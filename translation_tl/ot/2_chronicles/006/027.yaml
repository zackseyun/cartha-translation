base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/027.yaml
  text: then may you hear in heaven and forgive the sin of your servants and of your people Israel[a], when you teach them the good way in which they should walk, and give rain on your land that you have given to your people as an inheritance.
translation:
  language: tl
  text: ay dinggin mo mula sa langit[a] at patawarin ang kasalanan ng iyong mga lingkod at ng iyong bayang Israel. Turuan mo sila ng mabuting daan na dapat nilang lakaran, at bigyan mo ng ulan ang iyong lupain, na ibinigay mo sa iyong bayan bilang mana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literal: “dinggin ang langit/mga langit.” Isa itong idyoma para sa pakikinig ng Diyos mula sa kanyang tahanan sa langit. Maaari ring isalin na “dinggin mo sa langit.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּשְׁמַע הַשָּׁמַיִם
  choice: dinggin mo sila mula sa langit
  rationale: Ang Hebreo ay literal na ‘dinggin ang langit/mga langit,’ isang pormulang tumutukoy sa pakikinig ng Diyos mula sa kanyang makalangit na tahanan. Idinagdag ang ‘sila’ bilang likas na layon sa Filipino ayon sa konteksto.
- source_word: וְסָלַחְתָּ לְחַטַּאת
  choice: at patawarin ang kasalanan
  rationale: Tuwirang ipinahahayag ng חטאת ang kasalanan dito; natural at malinaw sa Filipino ang ‘patawarin ang kasalanan.’
- source_word: עֲבָדֶיךָ
  choice: iyong mga lingkod
  rationale: Sa panalanging tipan, tumutukoy ito sa mga taong naglilingkod at nagpapasakop sa Diyos, hindi partikular na binibigyang-diin ang kalagayan ng isang alipin.
- source_word: וְעַמְּךָ יִשְׂרָאֵל
  choice: at ng iyong bayang Israel
  rationale: Ang ‘ng’ ay pinanatili upang malinaw na kapuwa ang mga lingkod at Israel ang kaugnay ng kasalanang hinihiling na patawarin.
- source_word: כִּי
  choice: kapag
  rationale: Ipinakikita rito ang pangyayaring kaakibat ng pagpapatawad at pagpapanumbalik; pinananatili ng ‘kapag’ ang temporal o kondisyonal na ugnayan nang hindi ito ginagawang tiyak na sanhi.
- source_word: תוֹרֵם
  choice: itinuro mo sa kanila
  rationale: Ang Hiphil ng ירה ay nangangahulugang magturo o magbigay ng patnubay; ang ‘itinuro’ ay likas sa Filipino at akma sa daang dapat tahakin.
- source_word: אֶל־הַדֶּרֶךְ הַטּוֹבָה
  choice: ang mabuting daan
  rationale: Pinananatili nito ang larawang moral ng ‘mabuting daan’ nang hindi pinapalitan ng mas interpretatibong ‘tamang daan.’
- source_word: אֲשֶׁר יֵלְכוּ בָהּ
  choice: na dapat nilang lakaran
  rationale: Pinananatili ang biblikal na talinghaga ng paglakad bilang pamumuhay at ang diwa ng nararapat na asal.
- source_word: וְנָתַתָּה מָטָר
  choice: bigyan mo ng ulan
  rationale: Tuwirang sinasalamin ang pandiwang נתן, ‘magbigay,’ habang natural pa rin sa Filipino.
- source_word: עַל־אַרְצְךָ
  choice: ang iyong lupain
  rationale: 'Pinananatili ang tahasang panghalip na paari: ang lupain ay sa Diyos at ibinigay niya sa Israel.'
- source_word: אֲשֶׁר נָתַתָּה לְעַמְּךָ לְנַחֲלָה
  choice: na ibinigay mo sa iyong bayan bilang mana
  rationale: Ang ‘mana’ ay maikli at natural na katumbas ng נחלה at pinananatili ang diwa ng lupaing ipinagkaloob sa bayan.
theological_decisions:
- issue: Ugnayan ng pagtuturo ng Diyos sa pagpapatawad at pagbibigay ng ulan
  choice: Isinalin ang כִּי bilang ‘kapag,’ kaya ang pagtuturo ay inilalahad bilang pangyayaring kaakibat ng tugon ng Diyos.
  alternative: ‘Sapagkat itinuro mo sa kanila,’ na gagawing mas tahasang sanhi o batayan ang sugnay.
  rationale: Maaaring magpahiwatig ang כִּי ng sanhi o ng pangyayaring kaugnay ng naunang pakiusap. Ang ‘kapag’ ay nagpapanatili sa daloy ng panalangin nang hindi nilulutas nang labis ang sintaktiko at teolohikal na tensiyon.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang ‘bayang Israel,’ ‘mga lingkod,’ at ‘bilang mana’ upang mapanatili ang biblikal na diwa nang hindi nagiging lipas o labis na teknikal.
