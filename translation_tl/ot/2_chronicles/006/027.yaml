  to: ay dinggin mo mula sa langit[a] at patawarin ang kasalanan ng iyong mga lingkod at ng iyong bayang Israel. Turuan mo sila ng mabuting daan na dapat nilang lakaran, at bigyan mo ng ulan ang iyong lupain, na ibinigay mo sa iyong bayan bilang mana.
