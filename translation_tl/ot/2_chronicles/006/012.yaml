  source_fidelity: 'Tumpak ang salin sa lahat ng pangunahing sangkap ng Hebreo: ang salaysay na wayyiqtol na “tumayo,” ang dalawang magkaibang relasyong pang-espasyo (“sa harap ng” altar at kapulungan), ang “buong kapulungan ng Israel,” at ang pag-uunat ng mga kamay. Ang “Pagkatapos” ay katanggap-tanggap na natural na panandang pagsulong ng salaysay.'
  naturalness: Natural at malinaw ang modernong Filipino Tagalog. Ang pag-uulit ng “sa harap ng” ay bahagyang estilistikong paulit ngunit tapat sa dalawang magkaibang Hebreong parirala at hindi nakasasagabal sa daloy. Ang “iniunat niya ang kanyang mga kamay” ay likas at angkop sa kilos ng panalangin.
  terminology: Ang “altar ni Yahweh,” “kapulungan ng Israel,” at “Yahweh” ay pare-pareho, marangal, at angkop sa itinakdang gamit. Wasto ring inililinaw ng talababa ang literal na “mga palad” nang hindi ipinipilit na ang literal na salitang iyon ang nasa pangunahing teksto.
