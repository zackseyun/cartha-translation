id: 2CH.6.12
reference: 2 Chronicles 6:12
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַֽ/יַּעֲמֹ֗ד לִ/פְנֵי֙ מִזְבַּ֣ח יְהוָ֔ה נֶ֖גֶד כָּל קְהַ֣ל יִשְׂרָאֵ֑ל וַ/יִּפְרֹ֖שׂ כַּפָּֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/012.yaml
  text: Then he stood before the altar of Yahweh in front of all the assembly of Israel and spread out his hands[a][b].
translation:
  language: tl
  text: Pagkatapos, tumayo siya sa harap ng altar ni Yahweh, sa harap ng buong kapulungan ng Israel, at iniunat niya ang kanyang mga kamay.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “ibinuka ang kanyang mga palad”; tumutukoy ito sa pag-uunat ng mga kamay sa pananalangin.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֹד
  choice: Pagkatapos, tumayo siya
  rationale: Ang wayyiqtol ng עמד ay nagpapasulong sa salaysay; natural sa modernong Tagalog ang “Pagkatapos” habang pinananatili ang payak na diwang “tumayo.”
- source_word: לִפְנֵי מִזְבַּח יְהוָה
  choice: sa harap ng altar ni Yahweh
  rationale: Ang לִפְנֵי ay nagsasaad ng posisyong nasa harap ng isang bagay, at ang construct chain ay likas na naipapahayag bilang “altar ni Yahweh.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang banal sa pamamagitan ng transliterasyong “Yahweh,” sa halip na palitan ito ng isang titulo.
- source_word: נֶגֶד כָּל קְהַל יִשְׂרָאֵל
  choice: sa harap ng buong kapulungan ng Israel
  rationale: Ang נֶגֶד ay tumutukoy sa kanyang kinalalagyan kaugnay ng nagkakatipong bayan; ang קהל ay ang nagkakatipong pamayanan, kaya ang “kapulungan” ay malinaw at marangal.
- source_word: וַיִּפְרֹשׂ כַּפָּיו
  choice: at iniunat niya ang kanyang mga kamay
  rationale: Bagaman literal na maaaring tumukoy ang כַּפָּיו sa kanyang mga palad, ang pariralang ito ay kilos ng pag-uunat o pagbubuka ng mga kamay sa pananalangin. Likas sa Tagalog ang “iniunat ... ang kanyang mga kamay.”
theological_decisions:
- issue: Pagbanggit sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang ginagamit ng tekstong Hebreo ang Tetragrammaton. Ang “Yahweh” ay nagpapanatili rito bilang personal na pangalan at hindi bilang pamalit na titulo.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “kapulungan” para sa pampublikong pagtitipon ng Israel at “iniunat ang kanyang mga kamay” para sa likas na paglalarawan ng kilos sa pananalangin.
