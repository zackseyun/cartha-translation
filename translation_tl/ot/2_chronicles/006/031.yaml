source:
  edition: WLC
  text: לְמַ֣עַן יִֽירָא֗וּ/ךָ לָ/לֶ֨כֶת֙ בִּ/דְרָכֶ֔י/ךָ כָּל הַ֨/יָּמִ֔ים אֲשֶׁר הֵ֥ם חַיִּ֖ים עַל פְּנֵ֣י הָ/אֲדָמָ֑ה אֲשֶׁ֥ר נָתַ֖תָּה לַ/אֲבֹתֵֽי/נוּ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/031.yaml
  text: so that they may fear you and walk in your ways all the days that they live on the face of the land that you gave to our fathers[a][b].
translation:
  language: tl
  text: upang matakot sila sa iyo[a] at lumakad sa iyong mga daan sa lahat ng araw na nabubuhay sila sa lupaing ibinigay mo sa aming mga ninuno[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “magpitagan sila sa iyo.” Saklaw ng salitang Hebreo ang takot na nahahayag sa pagpipitagan at pagsunod.
    reason: lexical_alternative
  - marker: b
    text: 'Mas literal: “sa ibabaw ng lupain.”'
    reason: literal_rendering
lexical_decisions:
- source_word: לְמַעַן
  choice: upang
  rationale: Likas na panandang Filipino para sa layunin o inaasahang bunga.
- source_word: יִירָאוּךָ
  choice: matakot sila sa iyo
  rationale: Pinananatili ang malawak na diwa ng ירא—takot na may pagpipitagan—sa halip na paliitin ito sa sindak lamang o sa pagpipitagan lamang.
- source_word: לָלֶכֶת בִּדְרָכֶיךָ
  choice: at lumakad sa iyong mga daan
  rationale: Ang paglakad sa mga daan ng Diyos ay malinaw na talinghaga ng pamumuhay ayon sa kaniyang kalooban; natural sa Filipino ang koordinasyong 'at lumakad' sa sugnay ng layunin.
- source_word: כָּל הַיָּמִים אֲשֶׁר הֵם חַיִּים
  choice: sa lahat ng araw na nabubuhay sila
  rationale: Pinananatili ang kongkretong Hebreong pagpapahayag ng buong panahon ng kanilang buhay.
- source_word: עַל פְּנֵי הָאֲדָמָה
  choice: sa lupain
  rationale: Sa konteksto, ang אֲדָמָה ay ang lupaing ibinigay sa mga ninuno; hindi kailangang panatilihin sa pangunahing teksto ang literal ngunit mabigat na idyomang 'sa ibabaw ng lupain.'
- source_word: אֲשֶׁר נָתַתָּה לַאֲבֹתֵינוּ
  choice: na ibinigay mo sa aming mga ninuno
  rationale: Malinaw at likas na Filipino para sa natapos na pagkakaloob ng Diyos sa mga ninuno ng Israel.
theological_decisions:
- issue: Diwa ng pagkatakot sa Diyos
  choice: matakot sila sa iyo
  alternative: igalang ka; magkaroon sila ng pagpipitagan sa iyo
  rationale: Ang Hebreong ירא ay maaaring magsama ng takot, pagpipitagan, at pagsunod. Ang 'matakot' ay nagpapanatili sa bigat at tensiyon ng orihinal, habang nililinaw ng kasunod na paglakad sa mga daan ng Diyos ang masunuring katangian nito.
- issue: Saklaw ng הָאֲדָמָה
  choice: lupain
  alternative: lupa; daigdig
  rationale: Tinutukoy ito ng kasunod na sugnay bilang lupaing ibinigay sa mga ninuno, kaya ang konteksto ay ang lupaing tipan, hindi ang buong daigdig.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang biblikal na talinghagang “lumakad sa iyong mga daan” at ang makahulugang salitang “matakot,” na may paliwanag sa talababa.
