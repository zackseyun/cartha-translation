  source_fidelity: 'Tumpak na naihahatid ng salin ang pagkakasunod at diwa ng Hebreo: ang panawagang bumangon, ang patutunguhan sa pahingahang dako, ang magkasamang pagtukoy kay Yahweh at sa kaban ng kanyang lakas, at ang dalawang hiling para sa mga pari at mga tapat. Ang “sa kabutihan” ay wastong nagpapanatili sa walang tahasang panghalip na paari sa בַּטּוֹב.'
