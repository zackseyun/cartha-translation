  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/עַתָּ֗ה קוּמָ֞/ה יְהוָ֤ה אֱלֹהִים֙ לְֽ/נוּחֶ֔/ךָ אַתָּ֖ה וַ/אֲר֣וֹן עֻזֶּ֑/ךָ כֹּהֲנֶ֜י/ךָ יְהוָ֤ה אֱלֹהִים֙ יִלְבְּשׁ֣וּ תְשׁוּעָ֔ה וַ/חֲסִידֶ֖י/ךָ יִשְׂמְח֥וּ בַ/טּֽוֹב׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/041.yaml
  text: And now arise[a], O Yahweh God, to your resting place, you and the ark of your strength. Let your priests, O Yahweh God, be clothed with salvation[c][b], and let your faithful ones rejoice in what is good.
translation:
  language: tl
  text: At ngayon, bumangon ka, Yahweh na Diyos, patungo sa iyong pahingahang dako—ikaw at ang kaban ng iyong lakas.[a] Damitan nawa ng kaligtasan[b] ang iyong mga pari, Yahweh na Diyos, at magalak nawa sa kabutihan[c] ang iyong mga tapat.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “kaban ng iyong kapangyarihan” o “kaban ng iyong kalakasan.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “pagliligtas” o “tagumpay.”
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “sa mabuti” o “sa iyong kabutihan.” Payak na “sa kabutihan/sa mabuti” ang nasa Hebreo at walang tahasang panghalip na paari.
    reason: alternative_reading
  - marker: d
    text: Maaari ring “iyong mga taong maka-Diyos” o “iyong mga banal.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: At ngayon
  rationale: Pinananatili ang pang-ugnay na וְ at ang panandang pansamantala at pananalitang עַתָּה, na nagpapakilala sa sukdulang pakiusap.
- source_word: קוּמָה
  choice: bumangon ka
  rationale: Tahasang pautos ng קום sa isang panalangin; likas sa modernong Tagalog at pinananatili ang marangal na himig.
- source_word: יְהוָה אֱלֹהִים
  choice: Yahweh na Diyos
  rationale: Pinananatili ang personal na pangalang יְהוָה at ang kasunod na titulong אֱלֹהִים sa tuwirang pagtawag.
- source_word: לְנוּחֶךָ
  choice: patungo sa iyong pahingahang dako
  rationale: Ipinahihiwatig ng לְ ang patutunguhan, at sa konteksto ng templo at kaban, ang נוּחַ ay tumutukoy sa isang dako ng permanenteng pamamahinga o pananahan.
- source_word: אֲרוֹן עֻזֶּךָ
  choice: kaban ng iyong lakas
  rationale: Pinananatili ang konkretong 'kaban' at ang malawak na diwa ng עֹז bilang lakas; hindi ito nilimitahan sa isang partikular na uri ng kapangyarihan.
- source_word: יִלְבְּשׁוּ תְשׁוּעָה
  choice: mabihisan nawa ng kaligtasan
  rationale: Pinananatili ang talinghaga ng pananamit at ang pakiusap na ipinahahayag ng anyong pandiwa; ang תְּשׁוּעָה ay maaaring tumukoy sa kaligtasan, pagliligtas, o tagumpay.
- source_word: חֲסִידֶיךָ
  choice: iyong mga tapat
  rationale: Ipinahahayag ang katapatan at debosyong nakapaloob sa חָסִיד nang hindi ipinapasok ang mga posibleng mas huling teknikal na kahulugan ng 'mga santo.'
- source_word: יִשְׂמְחוּ בַטּוֹב
  choice: magalak nawa sa kabutihan
  rationale: Pinananatili ang payak at malabong 'sa kabutihan/sa mabuti' ng Hebreo, na walang tahasang panghalip na paari.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Personal na pangalan ang nasa tekstong Hebreo; ang 'Yahweh' ay mas tuwirang kumakatawan rito kaysa palitan ito ng isang titulo.
- issue: Kung gagawing tahasang pag-aari ng Diyos ang בַטּוֹב
  choice: sa kabutihan
  alternative: sa iyong kabutihan; sa mabuti
  rationale: Bagaman maaaring ipakahulugan sa konteksto na kabutihan ng Diyos ang tinutukoy, walang hulaping paari ang Hebreo. Pinananatili ng pangunahing teksto ang kalabuan, at inilalagay sa talababa ang mas tahasang pagbasa.
- issue: Saklaw ng תְּשׁוּעָה
  choice: kaligtasan
  alternative: pagliligtas; tagumpay
  rationale: Malawak ang saklaw ng salitang Hebreo. Ang 'kaligtasan' ay likas sa Tagalog at hindi nito ganap na isinasara ang maaaring diwa ng pagliligtas o matagumpay na pagpapalaya.
translation_notes:
  register: Makabago ngunit marangal at panalanging Tagalog. Ginamit ang “nawa” upang likas na ipahayag ang mga pakiusap, habang pinanatili ang matalinghagang “mabihisan” at ang hindi ganap na tinukoy na “sa kabutihan.”
