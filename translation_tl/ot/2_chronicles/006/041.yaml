  terminology: Ang “Yahweh na Diyos,” “kaban,” “kaligtasan,” at “iyong mga tapat” ay angkop at pare-pareho sa piniling terminolohiya. Wastong iniiwasan ng “iyong mga tapat” ang mas teknikal o denominasyonal na dating ng “mga santo.”
