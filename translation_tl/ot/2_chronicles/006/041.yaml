  to: At ngayon, bumangon ka, Yahweh na Diyos, patungo sa iyong pahingahang dako—ikaw at ang kaban ng iyong lakas.[a] Damitan nawa ng kaligtasan[b] ang iyong mga pari, Yahweh na Diyos, at magalak nawa sa kabutihan[c] ang iyong mga tapat.[d]
