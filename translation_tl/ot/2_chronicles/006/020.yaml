base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/020.yaml
  text: that your eyes may be open toward this house day and night[a], toward the place where you said you would put your name[b], to hear the prayer that your servant prays toward this place.
translation:
  language: tl
  text: Nawa'y ang iyong mga mata ay maging bukás at nakatuon sa bahay na ito araw at gabi[a], sa lugar na sinabi mong paglalagyan mo ng iyong pangalan[b], upang dinggin ang panalanging idinadalangin ng iyong lingkod nang nakaharap sa lugar na ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O kaya, “lagi kang magbigay-pansin sa bahay na ito.” Literal sa Hebreo, “ang iyong mga mata ay maging bukás,” isang idyoma para sa mapagmatyag na pagbibigay-pansin.
    reason: lexical_alternative
  - marker: b
    text: Ang “paglalagay ng iyong pangalan” ay idyomang kaugnay ng templo at tumutukoy sa natatanging kaugnayan ng Diyos sa lugar na ito; hindi nito sinasabing literal na naninirahan doon ang Diyos.
    reason: cultural_note
lexical_decisions:
- source_word: לִהְיוֹת עֵינֶיךָ פְתֻחוֹת
  choice: Nawa'y ang iyong mga mata ay maging bukás
  rationale: Ipinahahayag ng “Nawa’y” ang lakas ng pakiusap sa konteksto, habang pinananatili ng “mga mata ... maging bukás” ang kongkretong antropomorpikong idyoma ng Hebreo.
- source_word: אֶל הַבַּיִת הַזֶּה
  choice: sa bahay na ito
  rationale: Sa Filipino, natural na naihahatid ng “sa” ang pagtutuon ng paningin sa tinutukoy na bahay; ang “bahay” ay tuwirang katumbas at tumutukoy rito sa templo.
- source_word: יוֹמָם וָלַיְלָה
  choice: araw at gabi
  rationale: Pinananatili nito ang merismong Hebreo para sa patuloy na pagbabantay o pagtuon.
- source_word: אֲשֶׁר אָמַרְתָּ לָשׂוּם שִׁמְךָ שָׁם
  choice: na sinabi mong paglalagyan mo ng iyong pangalan
  rationale: Natural itong Filipino para sa ipinahayag na layunin ng Diyos, at pinananatili ang mahalagang idyomang “iyong pangalan” nang hindi ito pinalalawak bilang literal na paninirahan.
- source_word: לִשְׁמֹעַ
  choice: upang pakinggan
  rationale: Malinaw na ipinakikita ng “upang” ang layunin ng infinitive; ang “pakinggan” ay likas sa Filipino para sa masusing pagdinig sa panalangin.
- source_word: הַתְּפִלָּה אֲשֶׁר יִתְפַּלֵּל
  choice: ang panalanging idinadalangin
  rationale: Pinananatili ang pag-uulit ng magkaugnay na pangngalan at pandiwa sa Hebreo, bagaman bahagyang pormal ang tunog nito.
- source_word: עַבְדְּךָ
  choice: iyong lingkod
  rationale: Ang “lingkod” ay angkop sa magalang at mapagpakumbabang pagtukoy ng nananalangin sa sarili sa harap ng Diyos.
- source_word: אֶל הַמָּקוֹם הַזֶּה
  choice: nang nakaharap sa lugar na ito
  rationale: Sa huling parirala, ipinapahayag ng אֶל ang direksiyon ng panalangin; nililinaw ng “nang nakaharap” ang likas na spatial na diwa sa Filipino.
theological_decisions:
- issue: Antropomorpikong pananalitang “ang iyong mga mata ay maging bukás”
  choice: Panatilihin ang kongkretong larawan ng mga mata ng Diyos na bukás
  alternative: Isalin nang interpretibo bilang “maging handa kang magbigay-pansin” o “bantayan mo”
  rationale: Ang orihinal ay gumagamit ng pisikal na larawan upang ipahayag ang mapagmatyag na pansin ng Diyos. Ang literal na idyoma ay nagpapanatili sa retorika at teolohikal na tensiyon ng teksto.
- issue: Teolohiya ng templo sa “paglalagyan mo ng iyong pangalan”
  choice: Panatilihin ang idyoma tungkol sa paglalagay ng pangalan
  alternative: Palawakin bilang “pananahanan ng iyong presensiya” o “ipakikilala mo ang iyong sarili”
  rationale: Siksik at sadyang idyomatiko ang Hebreo. Hindi dapat ipakahulugan ng salin na pisikal na nakakulong ang Diyos sa templo, ni pumili lamang ng isang posibleng paliwanag sa idyoma.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “Nawa’y” upang maging natural ang pakiusap, at pinanatili ang mga pangunahing idyomang Hebreo. Nilagyan ng tuldik ang “bukás” upang hindi mapagkamalang “bukas” na tumutukoy sa susunod na araw.
