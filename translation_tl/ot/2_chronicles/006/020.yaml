    issue: Hindi gaanong malinaw ang direksiyonal na diwa sa unang ‘sa bahay na ito.’
    rationale: Ang אֶל ay tumutukoy sa bahay bilang direksiyon o pokus ng banal na pansin. Ang ‘nakatuon sa bahay na ito’ ay natural na Filipino at mas malinaw na katumbas.
  - severity: low
    issue: Ang ‘pakinggan’ ay bahagyang mas interpretibo kaysa kinakailangan.
