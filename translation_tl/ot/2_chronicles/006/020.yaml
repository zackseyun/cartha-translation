  naturalness: Marangal at modernong Filipino ang rehistro. Ang ‘upang dinggin’ ay mas tuwiran at likas sa panalanging pananalita kaysa ‘upang pakinggan.’ Pinanatili ang sinadyang pag-uulit sa ‘panalanging idinadalangin,’ na tumutugon sa cognate construction ng Hebreo.
  terminology: Ang ‘iyong pangalan’ at ‘iyong lingkod’ ay angkop at dapat panatilihin. Sa talababa b, pinalitan ang ‘nakakulong’ ng ‘naninirahan’ upang ipaliwanag ang isyu ng literal na paninirahan nang hindi nagdaragdag ng mas matinding ideya ng pagkakabilanggo.
  issues:
