id: 2CH.6.38
reference: 2 Chronicles 6:38
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/שָׁ֣בוּ אֵלֶ֗י/ךָ בְּ/כָל לִבָּ/ם֙ וּ/בְ/כָל נַפְשָׁ֔/ם בְּ/אֶ֥רֶץ שִׁבְיָ֖/ם אֲשֶׁר שָׁב֣וּ אֹתָ֑/ם וְ/הִֽתְפַּֽלְל֗וּ דֶּ֤רֶךְ אַרְצָ/ם֙ אֲשֶׁ֣ר נָתַ֣תָּה לַ/אֲבוֹתָ֔/ם וְ/הָ/עִיר֙ אֲשֶׁ֣ר בָּחַ֔רְתָּ וְ/לַ/בַּ֖יִת אֲשֶׁר בָּנִ֥יתִי לִ/שְׁמֶֽ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/038.yaml
  text: and they return to you with all their heart and with all their soul in the land of their captivity[a], where they were taken captive, and pray toward their land that you gave to their fathers, and toward the city that you have chosen, and toward the house that I have built for your name,
translation:
  language: tl
  text: at manumbalik[a] sila sa iyo nang buong puso at buong kaluluwa sa lupain ng kanilang pagkabihag, kung saan sila dinalang bihag, at manalangin sila nang nakaharap sa kanilang lupain na ibinigay mo sa kanilang mga ninuno, sa lungsod na iyong pinili, at sa bahay na itinayo ko para sa iyong pangalan,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “bumalik.” Sa konteksto ng tipan, maaari rin itong magpahiwatig ng pagsisisi.
    reason: Pinananatili ang leksikal na saklaw ng שׁוּב at ang pahiwatig nitong pagsisisi nang hindi nilulutas ang kahulugan sa pangunahing teksto.
lexical_decisions:
- source_word: וְשָׁבוּ אֵלֶיךָ
  choice: at manumbalik sila sa iyo
  rationale: Ang שׁוּב na may אֶל ay pangunahing nangangahulugang bumalik o manumbalik sa isang tao. Pinananatili ng “manumbalik” ang konkretong larawan at ang posibleng diwa ng pagsisisi sa konteksto ng tipan nang hindi tahasang ipinapasok ang interpretasyong iyon sa pangunahing teksto.
- source_word: בְּכָל לִבָּם וּבְכָל נַפְשָׁם
  choice: nang buong puso at buong kaluluwa
  rationale: Likas at pamilyar na parirala ito sa Tagalog para sa lubos at taos-pusong pagtatalaga ng buong sarili, habang pinananatili ang tambalang Hebreo na “puso at kaluluwa.”
- source_word: בְּאֶרֶץ שִׁבְיָם
  choice: sa lupain ng kanilang pagkabihag
  rationale: Malapit ito sa konstruksiyong Hebreo at malinaw na tumutukoy sa lupaing kinaroroonan nila bilang mga bihag.
- source_word: אֲשֶׁר שָׁבוּ אֹתָם
  choice: kung saan sila dinalang bihag
  rationale: Aktibo sa Hebreo ang pandiwang tumutukoy sa mga bumihag sa kanila, ngunit mas natural sa Tagalog ang pasibong pagpapahayag na ito.
- source_word: וְהִתְפַּלְלוּ דֶּרֶךְ אַרְצָם
  choice: at manalangin sila nang nakaharap sa kanilang lupain
  rationale: Sa konteksto ng pananalangin, ang דֶּרֶךְ ay nagsasaad ng direksiyon. Ang “nang nakaharap sa” ay natural na Tagalog at malinaw na naghahatid ng oryentasyon ng panalangin.
- source_word: אֲשֶׁר נָתַתָּה לַאֲבוֹתָם
  choice: na ibinigay mo sa kanilang mga ninuno
  rationale: Ang “mga ninuno” ay natural at malinaw na modernong katumbas ng אָבוֹת kapag tumutukoy sa mga naunang salinlahi.
- source_word: וְהָעִיר אֲשֶׁר בָּחַרְתָּ
  choice: sa lungsod na iyong pinili
  rationale: Pinananatili nito ang pagpili ng Diyos sa lungsod nang hindi idinaragdag ang pangalang Jerusalem, na hindi tahasang nasa talata.
- source_word: וְלַבַּיִת אֲשֶׁר בָּנִיתִי לִשְׁמֶךָ
  choice: at sa bahay na itinayo ko para sa iyong pangalan
  rationale: Pinananatili ng “bahay” ang salitang בַּיִת at ang teolohikal na taginting nito, sa halip na tahasang gawing “templo.” Ang “para sa iyong pangalan” ay nagpapanatili sa idyomang Hebreo ng pagtatalaga sa pangalan ng Diyos.
theological_decisions:
- issue: Diwa ng pagsisisi sa שׁוּב אֵלֶיךָ
  choice: “manumbalik sa iyo” sa pangunahing teksto
  alternative: “magsisi sa harap mo” o “bumalik sa iyo”
  rationale: Ang pandiwa ay pangunahing nangangahulugang bumalik o manumbalik. Sa panalanging ito, may pahiwatig itong pagsisisi at panunumbalik sa tipan, ngunit hindi nararapat na gawing tahasang “magsisi” lamang at alisin ang tunay na lawak ng larawan.
- issue: Kahulugan ng בַּיִת
  choice: “bahay”
  alternative: “templo”
  rationale: Bagaman ang tinutukoy ay ang templo, pinananatili ng “bahay” ang mismong talinghagang Hebreo at ang kaugnayan nito sa “pangalan” ng Diyos.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang anyong tuloy-tuloy ng pangungusap at ang kuwit sa hulihan dahil bahagi ang talata ng mas mahabang kondisyonal na panalangin. Ginamit ang “mga ninuno” sa halip na “mga ama” para sa likas na modernong gamit, ngunit pinanatili ang “bahay” at “para sa iyong pangalan” upang hindi mapawi ang mga pangunahing idyomang Hebreo.
