  terminology: Ang “magkasala,” “kapwa,” “panunumpa,” “altar,” at “bahay” ay angkop. Ang talababa ay wastong nagpapanatili ng kahulugang curse-oath ng אָלָה. Ang “sumpang panunumpa” ay nauunawaan, bagaman mas idiomatiko ang “panunumpang may kaakibat na sumpa.”
