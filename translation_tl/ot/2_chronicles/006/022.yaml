source:
  edition: WLC
  text: אִם יֶחֱטָ֥א אִישׁ֙ לְ/רֵעֵ֔/הוּ וְ/נָֽשָׁא ב֥/וֹ אָלָ֖ה לְ/הַֽאֲלֹת֑/וֹ וּ/בָ֗א אָלָ֛ה לִ/פְנֵ֥י מִֽזְבַּחֲ/ךָ֖ בַּ/בַּ֥יִת הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/022.yaml
  text: If a man sins against his neighbor[a], and an oath is laid on him to make him swear, and he comes and the oath is before your altar in this house,
translation:
  language: tl
  text: Kung magkasala ang isang tao sa kanyang kapwa, at ipataw sa kanya ang isang panunumpa[a] upang pasumpain siya, at lumapit siya, at ang panunumpang iyon ay nasa harap ng iyong altar sa bahay na ito,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “panunumpang may kaakibat na sumpa.” Ang salitang Hebreo ay tumutukoy sa panunumpang may kaakibat na sumpa kung hindi ito tutuparin o kung magsisinungaling ang nanunumpa.
    reason: Pinananatili ang saklaw ng kahulugan ng אָלָה sa kontekstong legal.
lexical_decisions:
- source_word: אִם יֶחֱטָא אִישׁ
  choice: Kung magkasala ang isang tao
  rationale: Pinananatili ang kondisyunal na sugnay at ang moral at panrelihiyong diwa ng חטא. Ang “isang tao” ay likas sa modernong Tagalog at hindi nililimitahan ang kinatawang gamit ng אִישׁ sa kasarian.
- source_word: לְרֵעֵהוּ
  choice: sa kanyang kapwa
  rationale: Ang רֵעַ ay maaaring tumukoy sa kapwa, kasamahan, o kapitbahay. Ang “kapwa” ang pinakanatural sa legal at panlipunang konteksto rito.
- source_word: וְנָשָׁא בוֹ אָלָה
  choice: at ipataw sa kanya ang isang panunumpa[a]
  rationale: Ipinahahayag ng “ipataw” ang obligasyong inilalagay sa isang tao. Isinalin sa pangunahing teksto ang אָלָה bilang “panunumpa,” habang inilalahad sa talababa ang tunay na diwa nitong may kaakibat na sumpa.
- source_word: לְהַאֲלֹתוֹ
  choice: upang pasumpain siya
  rationale: 'Pinananatili nang hiwalay ang causative na anyo: ang tao ay pinasusumpa, hindi lamang basta nasa ilalim ng isang panunumpa.'
- source_word: וּבָא אָלָה לִפְנֵי מִזְבַּחֲךָ
  choice: at iharap ang panunumpang iyon sa iyong altar
  rationale: Sa Hebreo, ang panunumpa ang gramatikal na dumarating sa harap ng altar. Ang “iharap” ay natural na Tagalog para sa legal at ritwal na pagdadala ng panunumpa sa harap ng Diyos nang hindi ipinapalagay na ang tao ang tahasang paksa.
- source_word: בַּבַּיִת הַזֶּה
  choice: sa bahay na ito
  rationale: Pinananatili ang literal at teolohikal na katawagang “bahay” para sa templo, sa halip na palitan ito ng mas interpretibong “templo.”
theological_decisions:
- issue: Legal na diwa ng אָלָה
  choice: “Panunumpa” sa pangunahing teksto, na may talababa tungkol sa kaakibat na sumpa
  alternative: “sumpa” o “sumpang panunumpa” sa pangunahing teksto
  rationale: Sa kontekstong ito, tumutukoy ang salita sa isang panunumpang may ipinapataw na sumpa kapag nagsinungaling ang nanunumpa. Hindi sapat ang “sumpa” lamang upang maipakita ang legal na panunumpa, ngunit maaaring ikubli ng “panunumpa” lamang ang parusang kaakibat nito; kaya pinananatili ang dalawang diwa sa teksto at talababa.
- issue: Paksa ng וּבָא
  choice: Ang panunumpa ang inihaharap sa altar
  alternative: Ang taong pinasusumpa ang dumarating, at ang panunumpa ay nasa harap ng altar
  rationale: Ang Masoretic Hebrew ay tuwirang nag-uugnay sa וּבָא sa אָלָה. Iniiwasang gawing tahasang paksa ang tao, bagaman iyon ang maaaring ipinahihiwatig ng ritwal na tagpo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kapwa,” “ipataw,” at “iharap” bilang likas ngunit tumpak na mga salitang angkop sa legal at panalanging konteksto. Pinanatili ang pangwakas na kuwit sapagkat nagpapatuloy ang kondisyunal na pangungusap sa kasunod na talata.
