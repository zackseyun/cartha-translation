- from: 'At ngayon, O Yahweh, Diyos ng Israel, tuparin mo sa iyong lingkod na si David na aking ama ang sinabi mo sa kanya: “Hindi mawawalan sa harap ko ng isang lalaking mula sa iyo na uupo sa trono ng Israel, kung iingatan lamang ng iyong mga anak ang kanilang landas sa pamamagitan ng pagsunod sa aking kautusan, gaya ng paglakad mo sa harap ko.”'
  to: 'At ngayon, O Yahweh, Diyos ng Israel, tuparin mo para sa iyong lingkod na si David na aking ama ang sinabi mo sa kanya: “Hindi ka mawawalan ng lalaking uupo sa trono ng Israel sa harap ko, kung iingatan lamang ng iyong mga anak ang kanilang landas, sa paglakad ayon sa aking kautusan, gaya ng paglakad mo sa harap ko.”'
