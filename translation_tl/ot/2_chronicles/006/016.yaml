base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/016.yaml
  text: And now, LORD, God of Israel, keep for your servant David my father what you spoke to him, saying, ‘A man to sit on the throne of Israel before me shall not be cut off from you, if only your sons keep their way by walking in my law, as you have walked before me.’
translation:
  language: tl
  text: 'At ngayon, O Yahweh, Diyos ng Israel, tuparin mo para sa iyong lingkod na si David na aking ama ang sinabi mo sa kanya: “Hindi ka mawawalan ng lalaking uupo sa trono ng Israel sa harap ko, kung iingatan lamang ng iyong mga anak ang kanilang landas, sa paglakad ayon sa aking kautusan, gaya ng paglakad mo sa harap ko.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang personal na pangalan ng Diyos upang katawanin nang tuwiran ang Tetragrammaton sa tekstong Hebreo.
- source_word: שְׁמֹר
  choice: tuparin mo
  rationale: Sa konteksto ng pangakong sinabi kay David, ang literal na ‘ingatan’ ay likas na ipinahahayag sa Filipino bilang ‘tuparin.’
- source_word: לֹא יִכָּרֵת לְךָ אִישׁ
  choice: Hindi mawawalan ... ng isang lalaking mula sa iyo
  rationale: Pinananatili ang ideya ng Hebreong ‘hindi mapuputol’ bilang patuloy na pagkakaroon ng lalaking inapo, habang nililinaw ng ‘mula sa iyo’ ang לְךָ nang hindi labis na nagpapaliwanag.
- source_word: מִלְּפָנַי
  choice: sa harap ko
  rationale: Pinananatili ang pormal at teolohikal na larawan ng paglilingkod o paghahari sa presensiya ng Diyos.
- source_word: יִשְׁמְרוּ ... אֶת דַּרְכָּם
  choice: iingatan ... ang kanilang landas
  rationale: Pinananatili ang metaporang Hebreo ng ‘landas’ at ang pandiwang ‘ingatan,’ na tumutukoy sa maingat na pamumuhay.
- source_word: לָלֶכֶת בְּתוֹרָתִי
  choice: sa pamamagitan ng pagsunod sa aking kautusan
  rationale: Ang literal na ‘lumakad sa aking kautusan’ ay isinama sa paraan ng pag-iingat sa landas; ‘pagsunod’ ang natural na Filipino para sa etikal na kahulugan ng paglakad ayon sa Torah.
theological_decisions:
- issue: Kondisyon ng pangako sa dinastiya ni David
  choice: kung iingatan lamang ng iyong mga anak
  alternative: basta iingatan ng iyong mga anak
  rationale: Ang ‘kung ... lamang’ ay nagpapanatili sa diin ng רַק אִם at sa tunay na tensiyon sa pagitan ng pangako at pananagutan ng mga anak ni David.
- issue: Kahulugan ng תּוֹרָה
  choice: kautusan
  alternative: turo
  rationale: Sa kontekstong tipan at pagsunod, ang ‘kautusan’ ay malinaw at tradisyonal, ngunit hindi dinaragdagan ang teksto ng partikular na denominasyonal na pagbasa.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Pinanatili ang panalanging pormal, ang metapora ng ‘landas,’ at ang pariralang ‘sa harap ko.’ Ginamit ang ‘O Yahweh’ bilang likas na anyong pantawag sa panalangin.
