revisions:
- from: Ngunit sinabi ni Yahweh kay David na aking ama, “Yamang nasa puso mong magtayo ng isang bahay para sa aking pangalan[a], mabuti ang ginawa mo na nasa puso mo iyon.[b]”
  to: Ngunit sinabi ni Yahweh kay David na aking ama, “Yamang nasa puso mo ang magtayo ng isang bahay para sa aking pangalan[a], mabuti ang ginawa mo sapagkat nasa puso mo iyon.[b]”
  rationale: Inayos ang gramatika at daloy nang hindi binabago ang kahulugan. Ang “nasa puso mo ang magtayo” ay pinananatili ang metaporang Hebreo, at ang “sapagkat nasa puso mo iyon” ay pinananatili ang sinadyang pag-uulit at ang pagpapatibay ni Yahweh sa layunin ni David.
