  - severity: low
    issue: Medyo alanganin ang ugnayan sa “mabuti ang ginawa mo na nasa puso mo iyon.”
    rationale: Bagaman nauunawaan, ang “na” ay maaaring magmukhang panuring sa “ginawa.” Ang “sapagkat” ay mas malinaw na naghahayag na ang pagkakaroon ng hangaring ito ang pinapurihan, alinsunod sa כִּי sa huling sugnay.
