base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/008.yaml
  text: But Yahweh said to David my father[a], ‘Because it was in your heart to build a house for my name[b], you did well that it was in your heart.’
translation:
  language: tl
  text: Ngunit sinabi ni Yahweh kay David na aking ama, “Yamang nasa puso mo ang magtayo ng isang bahay para sa aking pangalan[a], mabuti ang ginawa mo sapagkat nasa puso mo iyon.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “magtayo ng isang templo para sa aking pangalan.” Literal sa Hebreo: “magtayo ng isang bahay para sa aking pangalan.”'
    reason: lexical_alternative
  - marker: b
    text: O “mabuti ang hangaring iyon ng puso mo.”
    reason: idiomatic_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang transliterasyon ng personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
- source_word: וַיֹּאמֶר
  choice: sinabi
  rationale: Natural na salin sa makabagong Filipino ng karaniwang pandiwang ginagamit sa pagsasalaysay.
- source_word: אָבִי
  choice: aking ama
  rationale: Tuwirang pinananatili ang pagtukoy ni Solomon sa kanyang ama.
- source_word: יַעַן אֲשֶׁר
  choice: Yamang
  rationale: Ipinakikilala nito ang batayan ng pagsang-ayon ni Yahweh at angkop sa marangal na rehistro ng talata.
- source_word: הָיָה עִם לְבָבְךָ
  choice: nasa puso mo
  rationale: Pinananatili ang metapora ng Hebreo tungkol sa panloob na hangarin, na malinaw rin sa Filipino.
- source_word: לִבְנוֹת בַּיִת לִשְׁמִי
  choice: magtayo ng isang bahay para sa aking pangalan
  rationale: Pinananatili ang literal at teolohikal na mahalagang larawang 'bahay para sa aking pangalan'; ipinaliliwanag sa talababa ang kontekstuwal na kahulugang templo.
- source_word: הֱטִיבוֹתָ
  choice: mabuti ang ginawa mo
  rationale: Likas na pahayag ng pagsang-ayon sa Filipino at tapat sa diwa ng Hiphil ng יטב.
- source_word: כִּי הָיָה עִם לְבָבֶךָ
  choice: na nasa puso mo iyon
  rationale: Pinananatili ang sinadyang pag-uulit ng Hebreo habang ginagamit ang 'iyon' upang maging malinaw at natural ang Filipino.
theological_decisions:
- issue: Paglalarawan sa templo bilang בַּיִת לִשְׁמִי
  choice: bahay para sa aking pangalan
  alternative: templo para sa aking pangalan
  rationale: Ang 'bahay' ang tuwirang kahulugan ng בַּיִת at pinananatili nito ang mahalagang pahayag na ang gusali ay para sa pangalan ng Diyos, nang hindi ipinahihiwatig na nakukulong doon ang Diyos.
- issue: Pag-uulit ng pariralang 'nasa puso mo'
  choice: pinanatili sa dalawang sugnay
  alternative: mabuti ang hangarin mo
  rationale: Ang pag-uulit ay lantad sa tekstong Hebreo at nagbibigay-diin na ang hangarin mismo ni David ang sinang-ayunan; hindi ito dapat tahimik na paikliin.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang metapora ng puso at ang pag-uulit ng orihinal, ngunit idinagdag ang panghalip na “iyon” upang hindi maging malabo o labis na alanganin ang huling sugnay.
