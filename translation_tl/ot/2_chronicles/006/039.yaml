  text: then hear from heaven[a], from the place where you dwell, their prayer and their pleas, and maintain their cause, and forgive your people who have sinned against you.
translation:
  language: tl
  text: Kung magkagayon, dinggin mo mula sa langit, mula sa iyong tahanan, ang kanilang panalangin at mga pagsusumamo; igawad mo sa kanila ang katarungan[a], at patawarin mo ang iyong bayang nagkasala sa iyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ipagtanggol mo ang kanilang usapin” o “pairalin mo ang katarungan para sa kanila.” Sa literal, “gawin mo ang kanilang hatol/usapin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמַעְתָּ
  choice: Kung magkagayon, dinggin mo
  rationale: Ang Qal perfect na 2ms ay nasa konteksto ng panalangin at gumaganap bilang pakiusap sa Diyos. Ipinahihiwatig ng “Kung magkagayon” ang pagpapatuloy mula sa kondisyong nasa naunang talata.
- source_word: מִן הַשָּׁמַיִם מִמְּכוֹן שִׁבְתְּךָ
  choice: mula sa langit, mula sa lugar na iyong tahanan
  rationale: 'Pinananatili ang dalawang magkaugnay na pariralang panlunan: ang langit at ang tiyak na lugar ng paninirahan ng Diyos.'
- source_word: תְּפִלָּתָם וְאֶת תְּחִנֹּתֵיהֶם
  choice: ang kanilang panalangin at mga pagsusumamo
  rationale: Ang “panalangin” ay tumutugma sa kolektibong anyong isahan, samantalang ang “mga pagsusumamo” ay nagpapahayag ng marubdob na paghingi ng awa at pinananatili ang maramihang anyo.
- source_word: וְעָשִׂיתָ מִשְׁפָּטָם
  choice: igawad mo sa kanila ang katarungan
  rationale: Ang idyomang Hebreo ay literal na “gawin/isagawa ang kanilang mishpat” at tumutukoy sa makatarungang pag-asikaso o pagtatanggol sa kanilang usapin. Ang salin ay likas sa modernong Tagalog at pinananatili ang diwang hudisyal.
- source_word: וְסָלַחְתָּ לְעַמְּךָ
  choice: at patawarin mo ang iyong bayan
  rationale: Ang “patawarin” ang tuwiran at karaniwang katumbas ng סלח sa konteksto ng pagpapatawad ng Diyos; likas sa Tagalog na gawing tuwirang layon ang “iyong bayan.”
- source_word: אֲשֶׁר חָטְאוּ לָךְ
  choice: na nagkasala sa iyo
  rationale: Ang לְ kasunod ng חטא ay nagpapahiwatig na ang pagkakasala ay laban o nakatuon sa Diyos. Ang “nagkasala sa iyo” ay malinaw at dignidad na modernong Tagalog.
theological_decisions:
- issue: Hudisyal na diwa ng מִשְׁפָּטָם
  choice: igawad mo sa kanila ang katarungan
  alternative: ipagtanggol mo ang kanilang usapin; isagawa mo ang hatol sa kanilang usapin
  rationale: Pinananatili ng salin ang papel ng Diyos bilang makatarungang hukom na kumikilos para sa mga nananalangin, nang hindi ipinapalagay na ang parirala ay tumutukoy sa paghatol laban sa kanila. Inilalahad sa talababa ang tunay na lawak ng idyomang Hebreo.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa panalanging biblikal. Iniwasan ang arkaikong pananalita at pinanatili ang pag-uulit ng mga pariralang panlunan sa Hebreo.
