  text: וָ/אָשִׂ֥ים שָׁם֙ אֶת הָ֣/אָר֔וֹן אֲשֶׁר שָׁ֖ם בְּרִ֣ית יְהוָ֑ה אֲשֶׁ֥ר כָּרַ֖ת עִם בְּנֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/011.yaml
  text: And there I have placed the ark[a], in which is the covenant of Yahweh, which he made with the sons of Israel.
translation:
  language: tl
  text: At doon ko inilagay ang kaban, na kinaroroonan ng tipan ni Yahweh na ginawa niya sa mga anak ni Israel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “mga anak na lalaki ni Israel,” isang karaniwang kolektibong tawag sa buong bayan ng Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאָשִׂים
  choice: inilagay ko
  rationale: Ang pandiwang שׂוּם ay nangangahulugang ‘ilagay’ o ‘itakda.’ Ang aspektong ganap ng kilos ay likas na naipahahayag sa Filipino sa pamamagitan ng “inilagay ko,” habang ipinakikita ng konteksto na nananatili roon ang kaban.
- source_word: שָׁם
  choice: roon
  rationale: Tumutukoy ito sa lugar na kababanggit lamang, ang templo o banal na dako; natural sa Filipino ang “roon” pagkatapos ng pandiwang may direksiyon.
- source_word: הָאָרוֹן
  choice: ang kaban
  rationale: Ang “kaban” ang nakaugaliang salin sa kontekstong panrelihiyon para sa אָרוֹן, ang kaban ng tipan, at mas angkop kaysa sa karaniwang “baul.”
- source_word: אֲשֶׁר שָׁם
  choice: na kinaroroonan ng
  rationale: Pinananatili nito ang lokatibong diwa ng Hebreo—naroon o nauugnay sa loob ng kaban ang tipan—nang hindi pinipilit na tukuyin sa pangunahing teksto kung ang tinutukoy ay ang mismong tipan o ang mga tapyas na sagisag nito.
- source_word: בְּרִית יְהוָה
  choice: ang tipan ni Yahweh
  rationale: Ang בְּרִית ay “tipan,” at malinaw na ipinahahayag ng “ni Yahweh” ang ugnayang genitibo at ang personal na pangalan ng Diyos.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ng “Yahweh” ang banal na pangalang YHWH sa halip na palitan ito ng isang titulo.
- source_word: אֲשֶׁר כָּרַת
  choice: na ginawa niya
  rationale: Ang literal na idyomang Hebreo na “pumutol ng tipan” ay nangangahulugang gumawa o magtatag ng tipan. Ang “ginawa niya” ay malinaw at likas sa modernong Filipino.
- source_word: עִם
  choice: sa
  rationale: Sa pariralang Filipino na “gumawa ng tipan sa,” natural na ipinahahayag ng “sa” ang kabilang panig ng tipan, katumbas ng Hebreong עִם (‘kasama/kaakibat’).
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Malapit ito sa anyong Hebreo na “mga anak na lalaki ni Israel,” ngunit sa Filipino ang nakaugaliang pormulang “mga anak ni Israel” ay natural at saklaw ang buong bayang nagmula kay Israel.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehova
  rationale: Pinananatili ng “Yahweh” ang personal na pangalan sa tekstong Hebreo at hindi ito pinapalitan ng titulong “PANGINOON.”
- issue: Saklaw ng בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  alternative: mga anak na lalaki ni Israel; sambayanang Israel
  rationale: Pinananatili ang tradisyonal at malapit-sa-Hebreong katawagan, ngunit ang parirala ay kolektibong pangalan para sa bayang Israel at hindi lamang para sa mga lalaking kabilang dito.
- issue: Kung paano naroon sa kaban ang “tipan”
  choice: na kinaroroonan ng tipan
  alternative: na kinaroroonan ng mga tapyas ng tipan
  rationale: Hindi idinaragdag sa pangunahing teksto ang “mga tapyas,” sapagkat wala iyon sa mismong talata. Pinananatili ang maikling pahayag at bahagyang pagkapahiwatig ng Hebreo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kaban” at “tipan” bilang pamilyar na terminong biblikal, habang iniwasan ang sobrang arkaikong ayos ng pangungusap. Inilipat ang talababa sa pariralang aktuwal nitong ipinapaliwanag.
