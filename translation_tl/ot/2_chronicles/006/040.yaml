base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/040.yaml
  text: Now[a], my God, please let your eyes be open and your ears attentive to the prayer of this place.
translation:
  language: tl
  text: Ngayon, Diyos ko, mangyaring maging bukás ang iyong mga mata at handang makinig ang iyong mga tainga sa panalangin ng lugar na ito.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “panalanging inihandog sa lugar na ito” o “panalanging nagmumula sa lugar na ito.” Mas literal sa Hebreo ang “panalangin ng lugar na ito.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עַתָּה
  choice: Ngayon
  rationale: Pinananatili ang temporal at diskursong panandang nagpapakilala sa pangwakas na pakiusap ni Solomon.
- source_word: אֱלֹהַי
  choice: Diyos ko
  rationale: Tuwirang tawag ito sa Diyos na may unang panauhang hulapi; natural sa modernong Tagalog ang “Diyos ko” nang hindi na dinaragdagan ng makalumang pantawag.
- source_word: יִהְיוּ נָא
  choice: mangyaring maging
  rationale: Ipinapahayag ng jussive na may נָא ang magalang at mapagpakumbabang pakiusap; malinaw itong naihahatid ng “mangyaring maging.”
- source_word: עֵינֶיךָ פְּתֻחוֹת
  choice: maging bukás ang iyong mga mata
  rationale: Pinananatili ang kongkretong larawan ng mga matang bukás bilang pahiwatig ng pagbabantay at pagbibigay-pansin ng Diyos.
- source_word: וְאָזְנֶיךָ קַשֻּׁבוֹת
  choice: handang makinig ang iyong mga tainga
  rationale: Ipinahihiwatig ng קַשֻּׁבוֹת ang masusing pakikinig o kahandaang makinig. Natural sa Tagalog ang pariralang ito habang pinananatili ang larawan ng mga tainga.
- source_word: לִתְפִלַּת
  choice: sa panalangin
  rationale: Ang לְ ay tumutukoy sa bagay na pinagtutuunan ng pakikinig, at ang pangngalan ay nasa isahan.
- source_word: הַמָּקוֹם הַזֶּה
  choice: ng lugar na ito
  rationale: Malapit ito sa literal na ugnayang genitibo ng Hebreo at hindi tahasang nagpapasiya kung ang panalangin ay inihandog sa lugar na ito o nagmula rito.
theological_decisions:
- issue: Antropomorpikong paglalarawan sa mga mata at tainga ng Diyos
  choice: Panatilihin ang kongkretong larawan ng bukás na mga mata at mga taingang handang makinig.
  alternative: Ipaliwanag bilang “bantayan mo at pakinggan mo.”
  rationale: Ang Hebreo ay gumagamit ng mga bahagi ng katawan bilang larawan ng banal na pagbibigay-pansin. Ang pagpapanatili nito ay gumagalang sa anyo at teolohikal na puwersa ng teksto nang hindi ipinapalagay na literal na may katawang-tao ang Diyos.
- issue: Ugnayan ng panalangin at ng lugar
  choice: “panalangin ng lugar na ito”
  alternative: “panalanging inihandog sa lugar na ito” o “panalanging nagmumula sa lugar na ito”
  rationale: Hindi tahasang nililinaw ng anyong genitibo sa Hebreo kung lokasyon o pinagmulan ang eksaktong diwa. Pinananatili sa pangunahing teksto ang tunay na kalabuan at inilalahad sa talababa ang mga posibleng pagpapakahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na magalang at marangal, ngunit madaling maunawaan. Ginamit ang “mangyaring” upang ihatid ang mapagpakumbabang pakiusap, at pinanatili ang konkretong imahen at ang kalabuan ng pariralang Hebreo.
