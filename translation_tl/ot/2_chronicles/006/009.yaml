base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/009.yaml
  text: Yet you shall not build the house[a]; rather, your son, who will come from your own body[b], shall build the house for my name.
translation:
  language: tl
  text: Ngunit hindi ikaw ang magtatayo ng bahay[a]. Sa halip, ang anak mong lalaki na magmumula sa sarili mong katawan[b] ang magtatayo ng bahay para sa aking pangalan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “templo.” Sa Hebreo, “bahay,” isang karaniwang katawagan para sa templo.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “mula sa iyong mga balakang,” isang idyomang nangangahulugang tuwirang pisikal na inapo.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: Ngunit
  rationale: Ipinahahayag nito ang paghihigpit o pagsalungat sa naunang pagsang-ayon ng Diyos; natural sa modernong Tagalog ang “Ngunit” sa kontekstong ito.
- source_word: תִבְנֶה הַבָּיִת
  choice: magtatayo ng bahay
  rationale: Pinananatili ng “bahay” ang tuwirang katawagan sa Hebreo, na sa konteksto ay tumutukoy sa templo.
- source_word: כִּי
  choice: Sa halip
  rationale: Pagkatapos ng pagtanggi, ipinakikilala nito ang kasalungat na positibong pahayag tungkol sa anak, hindi lamang isang payak na dahilan.
- source_word: בִנְךָ
  choice: ang anak mo
  rationale: Tuwiran at likas na salin ng pangngalang may hulaping pangalawang panauhang panlalaki.
- source_word: הַיּוֹצֵא מֵחֲלָצֶיךָ
  choice: magmumula sa sarili mong katawan
  rationale: Malinaw nitong ipinahahayag sa kasalukuyang Tagalog ang idyomang tumutukoy sa isang tuwirang pisikal na inapo, nang hindi gumagamit ng alanganin o makalumang literalismo.
- source_word: הוּא
  choice: ang … ang magtatayo
  rationale: Ang hulma ng pangungusap na may inuulit na “ang” ay likas na paraan sa Tagalog upang mapanatili ang diin sa anak bilang siyang magtatayo.
- source_word: יִבְנֶה הַבַּיִת
  choice: ang magtatayo ng bahay
  rationale: Pinananatili ang panghinaharap na diwa at inuulit ang “bahay” gaya ng sa Hebreo.
- source_word: לִשְׁמִי
  choice: para sa aking pangalan
  rationale: Pinananatili nito ang pormula tungkol sa pagtatayo bilang nakatalaga sa pangalan ng Diyos, nang hindi ipinapaliwanag nang higit sa sinabi ng teksto.
theological_decisions:
- issue: Katawagan sa templo
  choice: bahay
  alternative: templo
  rationale: “Bahay” ang tuwirang salita sa Hebreo at karaniwang katawagan doon para sa templo; pinananatili nito ang tekstuwal na larawan habang nililinaw sa talababa ang tinutukoy.
- issue: Idyoma ng angkan
  choice: mula sa sarili mong katawan
  alternative: mula sa iyong mga balakang
  rationale: Ang idyoma sa Hebreo ay nagsasaad ng tuwirang pisikal na inapo. Inihahatid ng napiling salin ang kahulugan nang malinaw at hindi nagdaragdag ng ibang teolohikal na pahayag.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang “bahay” bilang mahalagang katawagan sa Hebreo, at ginamit ang hulmang “ang anak … ang magtatayo” upang natural na maipakita ang diin ng hiwalay na panghalip na הוּא.
