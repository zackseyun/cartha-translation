revisions:
- from: Pakinggan mo nawa mula sa langit, ang tahanan mo, at magpatawad ka. Ibigay mo sa bawat tao ang ayon sa lahat ng kanyang mga lakad, yamang alam mo ang kanyang puso—sapagkat ikaw lamang ang nakaaalam sa puso ng lahat ng tao.[a]
  to: Pakinggan mo nawa mula sa langit, na siyang iyong tahanan, at magpatawad ka; suklian mo ang bawat isa ayon sa lahat ng kanyang mga lakad, na ang puso niya’y alam mo—sapagkat ikaw lamang ang nakaaalam sa puso ng lahat ng tao.[a]
  rationale: Inayos ang paglalarawan sa langit bilang tahanan ng Diyos, ibinalik ang relative na ugnayan ng “na ang puso niya’y alam mo,” at pinalitan ang di-likas na “ibigay” na walang malinaw na layon ng “suklian,” na natural na nagpapahayag ng paggawad ayon sa kilos nang hindi nililimitahan ang resulta sa gantimpala o parusa. Napanatili ang metaporang “mga lakad” at ang literal na impormasyon ng בְּנֵי הָאָדָם sa talababa.
