base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/030.yaml
  text: then may you hear from heaven[a], the place of your dwelling, and forgive, and give to each man according to all his ways, whose heart you know—for you alone know the heart of the sons of man—
translation:
  language: tl
  text: Pakinggan mo nawa mula sa langit, na siyang iyong tahanan, at magpatawad ka; suklian mo ang bawat isa ayon sa lahat ng kanyang mga lakad, na ang puso niya’y alam mo—sapagkat ikaw lamang ang nakaaalam sa puso ng lahat ng tao.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “mga anak ng tao,” isang Hebreong katawagang tumutukoy sa sangkatauhan o sa lahat ng tao.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּשְׁמַע
  choice: Pakinggan mo nawa
  rationale: Ang imperfect na pandiwa ay gumaganap bilang pakiusap sa panalangin ni Solomon; malinaw na ipinahihiwatig ng “nawa” ang jussive o mapitagang kahilingan.
- source_word: מִן הַשָּׁמַיִם
  choice: mula sa langit
  rationale: Bagaman anyong maramihan ang Hebreo, ang “langit” ang likas na katumbas sa modernong Tagalog sa kontekstong ito.
- source_word: מְכוֹן שִׁבְתֶּךָ
  choice: ang tahanan mo
  rationale: Tinutukoy ng parirala ang matatag na lugar ng pananahan ng Diyos. Natural at marangal ang “tahanan mo,” nang hindi nagpapabigat sa pangungusap.
- source_word: וְסָלַחְתָּ
  choice: at magpatawad ka
  rationale: Ipinagpapatuloy nito ang sunod-sunod na mga pakiusap sa panalangin.
- source_word: וְנָתַתָּה לָאִישׁ
  choice: Ibigay mo sa bawat tao
  rationale: Pinananatili ng “ibigay” ang karaniwang kahulugan ng נתן, habang ipinakikita ng “bawat tao” ang distributibong gamit ng אִישׁ.
- source_word: כְּכָל דְּרָכָיו
  choice: ang ayon sa lahat ng kanyang mga lakad
  rationale: Pinananatili ng “mga lakad” ang Hebreong metapora para sa asal at paraan ng pamumuhay; nauunawaan ito sa biblikal na Tagalog.
- source_word: אֲשֶׁר תֵּדַע אֶת לְבָבוֹ
  choice: yamang alam mo ang kanyang puso
  rationale: Ang ugnayan ng sugnay ay likas na naihahayag bilang batayan ng makatarungang paggawad, habang pinananatili ang diin sa pagkakilala ng Diyos sa puso.
- source_word: לְבָב
  choice: puso
  rationale: Ang “puso” ang karaniwang katumbas na sumasaklaw sa kalooban, pag-iisip, at panloob na pagkatao.
- source_word: כִּי אַתָּה לְבַדְּךָ יָדַעְתָּ
  choice: sapagkat ikaw lamang ang nakaaalam
  rationale: Malinaw nitong pinananatili ang dahilan at ang eksklusibong kaalaman ng Diyos.
- source_word: לְבַב בְּנֵי הָאָדָם
  choice: sa puso ng lahat ng tao
  rationale: Ang literal na “puso ng mga anak ng tao” ay kolektibong tumutukoy sa sangkatauhan. Ang “lahat ng tao” ay natural sa modernong Tagalog at malinaw na pinananatili ang pangkalahatang saklaw.
theological_decisions:
- issue: Saklaw ng בְּנֵי הָאָדָם
  choice: lahat ng tao
  alternative: mga anak ng tao
  rationale: Ang Hebreong parirala ay isang kinatawang katawagan para sa buong sangkatauhan, hindi lamang sa mga lalaki. Inilalagay sa talababa ang literal na anyo upang mapanatili ang tekstuwal na impormasyon nang hindi nagiging di-likas ang pangunahing salin.
- issue: Pagbibigay ayon sa mga lakad
  choice: Ibigay mo sa bawat tao ang ayon sa lahat ng kanyang mga lakad
  alternative: Gantihan mo ang bawat tao ayon sa lahat ng kanyang ginawa
  rationale: Pinananatili ang payak na pandiwang “ibigay” at ang metaporang “mga lakad,” kaya hindi tahasang nililimitahan sa gantimpala o parusa ang maaaring saklaw ng pahayag.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at angkop sa panalangin. Ginamit ang “mo” at mga anyong pakiusap na may paggalang sa tono, ngunit iniwasan ang lipas o labis na pormal na pananalita. Pinanatili ang biblikal na metapora ng “mga lakad.”
