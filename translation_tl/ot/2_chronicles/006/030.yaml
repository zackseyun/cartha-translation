  - severity: medium
    issue: Di-likas at di-ganap ang “Ibigay mo sa bawat tao ang ayon sa lahat ng kanyang mga lakad.”
    rationale: Hindi malinaw sa Tagalog kung ano ang ibinibigay. Sa kontekstong ito, ang נתן ay tumutukoy sa paggawad o pagsukli ayon sa asal, nang hindi kinakailangang tukuyin kung gantimpala o parusa.
