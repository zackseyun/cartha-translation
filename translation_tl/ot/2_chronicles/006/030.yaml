  source_fidelity: Ang draft ay wastong naghahatid sa panalanging-jussive na anyo ng pandiwa, sa kapatawaran, at sa natatanging kaalaman ng Diyos sa puso ng tao. Gayunman, ang “yamang alam mo ang kanyang puso” ay ginagawang sugnay na sanhi ang Hebreong pang-uring sugnay na direktang naglalarawan sa “bawat tao.” Ang “Ibigay mo sa bawat tao ang ayon sa lahat ng kanyang mga lakad” ay hindi rin likas o ganap sa Tagalog at hindi malinaw ang diwang paggawad ayon sa kilos.
  naturalness: Kailangan ng mas maayos na pag-uugnay sa “mula sa langit, ang tahanan mo,” at ng mas likas na pandiwa para sa paggawad na ayon sa mga lakad ng bawat isa. Ang “mga lakad” ay maaaring panatilihin bilang biblikal na metapora para sa asal o pamumuhay.
  terminology: Ang “langit,” “magpatawad,” “puso,” at “lahat ng tao” ay angkop sa modernong Filipino Tagalog. Ang talababa para sa literal na “mga anak ng tao” ay wasto at sapat na nagpapaliwanag ng kolektibong saklaw nito.
  issues:
