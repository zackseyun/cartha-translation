  to: Ngunit mananahan nga ba ang Diyos kasama ng tao[a] sa lupa? Narito, maging ang langit at ang pinakamataas na langit ay hindi makapaglalaman sa iyo; lalong hindi ang bahay na ito na itinayo ko.
  rationale: Pinalitan ang mas kolokyal na “talaga nga bang” ng “mananahan nga ba” upang mapanatili ang taimtim na pagtataka ng Hebreo. Pinalitan ang “lalo na ang bahay” ng “lalong hindi ang bahay” upang malinaw na maisalin ang אַף כִּי bilang a fortiori na “much less,” nang hindi binabago ang kahulugan o ang imahen ng bahay ng Diyos.
