base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/018.yaml
  text: But will God indeed dwell with man on the earth? Behold[a], heaven and the highest heaven cannot contain you, much less this house that I have built.
translation:
  language: tl
  text: Ngunit mananahan nga ba ang Diyos kasama ng tao[a] sa lupa? Narito, maging ang langit at ang pinakamataas na langit ay hindi makapaglalaman sa iyo; lalong hindi ang bahay na ito na itinayo ko.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kasama ng sangkatauhan” o “kasama ng mga tao.” Ang Hebreong “tao” ay nasa anyong isahan ngunit kumakatawan sa lahat ng tao.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַאֻמְנָם
  choice: talaga nga bang
  rationale: Ipinahahayag nito ang taimtim na pagtataka sa anyo ng retorikal na tanong, habang nananatiling natural sa makabagong Tagalog.
- source_word: יֵשֵׁב
  choice: mananahan
  rationale: Ang diwa rito ay paninirahan o presensiya, hindi literal na pag-upo.
- source_word: אֶת הָאָדָם
  choice: kasama ng tao
  rationale: Ang אֵת ay ginagamit dito sa diwang 'kasama,' at ang אָדָם ay kumakatawan sa sangkatauhan. Ang 'tao' sa Tagalog ay likas na maaaring tumukoy sa lahat ng tao habang napapanatili ang anyong isahan.
- source_word: עַל הָאָרֶץ
  choice: sa lupa
  rationale: Payak at natural na locative rendering; ang 'lupa' ay tumutukoy sa daigdig bilang tirahan ng tao.
- source_word: הִנֵּה
  choice: Narito
  rationale: Pinananatili ang pantawag-pansing bisa at marangal na himig ng panalangin.
- source_word: שָׁמַיִם וּשְׁמֵי הַשָּׁמַיִם
  choice: ang langit at ang pinakamataas na langit
  rationale: Ipinahahayag nang malinaw ang Hebreong superlatibong pariralang literal na 'langit at langit ng mga langit.'
- source_word: לֹא יְכַלְכְּלוּךָ
  choice: hindi makapaglalaman sa iyo
  rationale: Pinananatili ang larawan ng kawalan ng kakayahan ng anumang nilikhang dako na maglaman sa Diyos.
- source_word: אַף כִּי
  choice: lalo na
  rationale: 'Natural na ipinahahayag sa Tagalog ang a fortiori na pangangatwiran: kung hindi Siya kayang lamnin ng langit, lalong hindi ng bahay.'
- source_word: הַבַּיִת הַזֶּה
  choice: ang bahay na ito
  rationale: Pinananatili ang literal na 'bahay' at ang mahalagang ugnayan ng templo bilang bahay, sa halip na tahasang gawing 'templo.'
- source_word: אֲשֶׁר בָּנִיתִי
  choice: na itinayo ko
  rationale: Natural na Tagalog para sa natapos na pagtatayo na may kasalukuyang kaugnayan sa panalangin ni Solomon.
theological_decisions:
- issue: Ang saklaw ng אָדָם sa pariralang אֶת הָאָדָם
  choice: tao
  alternative: sangkatauhan / mga tao
  rationale: Pinananatili ng 'tao' ang kumakatawang isahan ng Hebreo at likas din itong pangkalahatan sa Tagalog. Nililinaw ng talababa na sangkatauhan ang saklaw nito.
- issue: Ang Diyos at ang kakayahan ng langit o templo na maglaman sa kaniya
  choice: hindi makapaglalaman sa iyo
  alternative: hindi sapat para sa iyo / hindi ka magkakasya
  rationale: Direktang pinananatili ang pahayag tungkol sa kawalan ng kakayahan ng langit na maglaman sa Diyos, nang hindi dinaragdagan o nilulutas ang teolohikal na tensiyon sa pagitan ng kaniyang presensiya at transendensiya.
translation_notes:
  register: Makabago ngunit marangal na wikang Tagalog para sa panalangin. Ginamit ang 'mananahan,' 'Narito,' at 'makapaglalaman' upang mapanatili ang taimtim at matayog na himig nang hindi nagiging lipas o labis na teknikal.
