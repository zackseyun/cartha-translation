  naturalness: Marangal at likas ang “mananahan,” “Narito,” at “makapaglalaman sa iyo.” Ang “mananahan nga ba” ay mas maayos at mas taimtim kaysa “talaga nga bang mananahan,” at ang “lalong hindi” ay malinaw at natural sa lohikal na daloy ng pangungusap.
  terminology: Ang “Diyos,” “tao,” “langit,” at “bahay” ay angkop. Ang “bahay” ay wastong pinananatili sa halip na dagdagang “templo.” Nananatiling kapaki-pakinabang ang talababa upang ipaliwanag ang pangkalahatang saklaw ng isahang “tao.”
