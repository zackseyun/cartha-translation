source:
  edition: WLC
  text: וְ/אַתָּ֞ה תִּשְׁמַ֤ע מִן הַ/שָּׁמַ֨יִם֙ מִ/מְּכ֣וֹן שִׁבְתֶּ֔/ךָ וְ/עָשִׂ֕יתָ כְּ/כֹ֛ל אֲשֶׁר יִקְרָ֥א אֵלֶ֖י/ךָ הַ/נָּכְרִ֑י לְמַ֣עַן יֵדְעוּ֩ כָל עַמֵּ֨י הָ/אָ֜רֶץ אֶת שְׁמֶ֗/ךָ וּ/לְ/יִרְאָ֤ה אֹֽתְ/ךָ֙ כְּ/עַמְּ/ךָ֣ יִשְׂרָאֵ֔ל וְ/לָ/דַ֕עַת כִּֽי שִׁמְ/ךָ֣ נִקְרָ֔א עַל הַ/בַּ֥יִת הַ/זֶּ֖ה אֲשֶׁ֥ר בָּנִֽיתִי־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/033.yaml
  text: then hear from heaven[a], from your dwelling place, and do according to all that the foreigner calls to you for, so that all the peoples of the earth may know your name and fear you, as your people Israel do, and may know that your name is called upon this house that I have built.
translation:
  language: tl
  text: Kung magkagayon, dinggin mo mula sa langit, mula sa iyong tahanan, at kumilos ka ayon sa lahat ng idinadalangin sa iyo ng dayuhan, upang makilala ng lahat ng bayan sa daigdig ang iyong pangalan at matakot sila sa iyo, gaya ng iyong bayang Israel, at malaman nilang ang iyong pangalan ay itinatawag sa bahay na ito[a] na aking itinayo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, sa mas interpretibong pagkakasalin, “na taglay ng bahay na ito ang iyong pangalan.” Sa literal, “ang iyong pangalan ay itinatawag sa bahay na ito.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּשְׁמַע
  choice: dinggin mo
  rationale: Sa konteksto ng panalangin, ang שׁמע ay hindi lamang pagkarinig kundi pakikinig na may layuning tumugon. Ang “dinggin mo” ay likas at marangal na pakiusap sa Filipino.
- source_word: מִן הַשָּׁמַיִם מִמְּכוֹן שִׁבְתֶּךָ
  choice: mula sa langit, mula sa iyong tahanan
  rationale: Pinananatili nito ang dalawang magkatumbas na pariralang panlunan nang hindi ipinahihiwatig na ang Diyos ay nananahan sa templong nasa lupa.
- source_word: וְעָשִׂיתָ כְּכֹל אֲשֶׁר יִקְרָא אֵלֶיךָ
  choice: at gawin mo ang lahat ng idalangin sa iyo
  rationale: Malawak ang kahulugan ng עשה, kaya pinanatili ang “gawin”; sa kontekstong ito, ang קרא אל ay paglapit sa Diyos sa panalangin.
- source_word: הַנָּכְרִי
  choice: dayuhan
  rationale: Tumutukoy ito sa isang taong hindi kabilang sa Israel. Malinaw at kasalukuyang salitang Filipino ang “dayuhan.”
- source_word: כָל עַמֵּי הָאָרֶץ
  choice: lahat ng bayan sa daigdig
  rationale: Pangkalahatan ang saklaw ng הָאָרֶץ dito, at ipinahihiwatig ng maramihang עַמֵּי ang iba’t ibang mga sambayanan.
- source_word: אֶת שְׁמֶךָ
  choice: ang iyong pangalan
  rationale: Pinananatili ang biblikal na idyoma; maaaring saklawin ng “pangalan” ang pagkakakilanlan, karangalan, at pagkakilala sa Diyos nang hindi ito nililimitahan sa isang paliwanag.
- source_word: וּלְיִרְאָה אֹתְךָ
  choice: at matatakot sila sa iyo
  rationale: Pinananatili ng “matakot” ang lakas at teolohikal na bigat ng ירא; hindi ito pinalalambot tungo lamang sa paggalang.
- source_word: כִּי שִׁמְךָ נִקְרָא עַל הַבַּיִת הַזֶּה
  choice: na ang iyong pangalan ay itinatawag sa bahay na ito
  rationale: Malapit ito sa Hebreong idyoma at hindi lubusang nilulutas kung ang diin ay pagtatalaga, pag-aangkin, o pagkakaugnay ng bahay sa pangalan ng Diyos.
theological_decisions:
- issue: Ang tahanan ng Diyos at ang templong itinayo ni Solomon
  choice: Pinanatili ang “mula sa langit, mula sa iyong tahanan” at hiwalay na tinukoy ang “bahay na ito.”
  alternative: Gawing “mula sa iyong makalangit na presensiya” upang maiwasan ang panlunang wika.
  rationale: Ang mismong talata ang nagtatangi sa langit bilang tahanan ng Diyos at sa templo bilang bahay na inuugnay sa kanyang pangalan. Hindi kailangang dagdagan ng sistematikong paglilinaw.
- issue: Ang pagkatakot ng mga bansa sa Diyos
  choice: matatakot sila sa iyo
  alternative: igagalang ka nila
  rationale: Ang ירא ay may diwa ng banal at mapitagang takot. Ang simpleng “paggalang” ay maaaring magpahina sa saklaw nito.
- issue: Ang pangalan ng Diyos na “itinatawag” sa templo
  choice: Panatilihin ang malapit-sa-literal na idyoma sa teksto at ipaliwanag ang mas interpretibong pagbasa sa talababa.
  alternative: “taglay ng bahay na ito ang iyong pangalan”
  rationale: Pinananatili nito ang sadyang malawak na ugnayan ng pangalan ng Diyos sa bahay—pagtatalaga, pagkakakilanlan, at pag-aangkin—sa halip na pumili lamang ng isa.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “dinggin” bilang likas na pananalita sa panalangin, “dayuhan” sa halip na mas malabong “estranghero,” at “daigdig” upang malinaw ang pandaigdig na saklaw. Hinati sa dalawang pangungusap para sa madaling pagbasa habang pinananatili ang ugnayang layunin ng לְמַעַן.
