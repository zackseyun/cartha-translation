base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/006.yaml
  text: But I have chosen Jerusalem for my name to be there[a], and I have chosen David to be over my people Israel.
translation:
  language: tl
  text: Ngunit pinili ko[a] ang Jerusalem upang naroon ang aking pangalan, at pinili ko si David upang mamahala sa aking bayang Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “pinili ko” ay tumutukoy sa pagpiling ginawa noon. Ipinakikita ng konteksto na nananatiling may bisa ang pagpiling iyon.
    reason: Paglilinaw sa aspekto ng pandiwang Hebreo at sa patuloy na bisa ng pagpili ayon sa konteksto.
lexical_decisions:
- source_word: וָאֶבְחַר
  choice: pinili ko
  rationale: Ang בחר ay nangangahulugang pumili. Likas sa Filipino ang aspektong perpektibo na “pinili ko” para sa pasyang ginawa na, habang ipinahihiwatig ng konteksto na nananatili ang bisa nito.
- source_word: בִּירוּשָׁלִַם
  choice: ang Jerusalem
  rationale: Karaniwang anyo sa modernong Filipino ng pangalan ng lungsod; ang panandang “ang” ay angkop sa tuwirang layon ng pandiwa.
- source_word: לִהְיוֹת שְׁמִי שָׁם
  choice: upang naroon ang aking pangalan
  rationale: Pinananatili ang layuning ipinahahayag ng infinitive, ang tahasang salitang “pangalan,” at ang lokatibong “naroon,” nang hindi pinapalitan ang idyoma ng isang teolohikal na pagpapaliwanag.
- source_word: בְּדָוִיד
  choice: si David
  rationale: Pagkatapos ng בחר, si David ang taong pinili. Ginagamit ang personal na pantukoy na “si” ayon sa likas na balarila ng Filipino.
- source_word: לִהְיוֹת עַל
  choice: upang mamahala sa
  rationale: Ipinahahayag ng עַל sa pariralang ito ang awtoridad sa bayan. Ang “mamahala sa” ay natural sa Filipino at hindi tahasang nagdaragdag ng titulong “hari.”
- source_word: עַמִּי יִשְׂרָאֵל
  choice: aking bayang Israel
  rationale: Pinananatili ang tipanang wikang “aking bayan” at ang Israel bilang pangalan na tumutukoy kung aling bayan.
- source_word: וָ
  choice: Ngunit
  rationale: Bagaman karaniwang pang-ugnay ang ו, dito ay kasalungat nito ang naunang pahayag na hindi pumili ang Diyos ng ibang lungsod o tao; natural na inililitaw ng “Ngunit” ang ugnayang iyon.
theological_decisions:
- issue: Teolohiya ng templo sa pariralang “naroon ang aking pangalan”
  choice: Panatilihin ang idyomang “upang naroon ang aking pangalan.”
  alternative: “upang naroon ang aking presensya” o “upang doon ako sambahin”
  rationale: Ang Hebreo ay tahasang nagsasalita tungkol sa pangalan ng Diyos. Ang pagpapanatili rito ay nag-iingat sa mahalagang tipanan at templong idyoma at hindi agad ipinapantay ang “pangalan” sa isang paliwanag lamang.
- issue: Ang papel ni David sa Israel
  choice: “upang mamahala sa aking bayang Israel” nang walang idinagdag na titulo
  alternative: “upang maging hari sa aking bayang Israel” o “upang pagharian ang aking bayang Israel”
  rationale: Ipinahihiwatig ng konteksto ang pagkahari, ngunit ang mismong parirala ay nagsasaad lamang ng pagiging may awtoridad sa bayan. Kaya hindi idinagdag sa pangunahing teksto ang salitang “hari.”
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Pinanatili ang biblikal na idyomang “naroon ang aking pangalan,” samantalang ginawang natural ang parirala tungkol sa awtoridad ni David sa pamamagitan ng “mamahala sa.”
