revisions:
- from: At dinggin mo ang mga pakiusap[a] ng iyong lingkod at ng iyong bayang Israel kapag nananalangin sila sa direksiyon ng lugar na ito. At ikaw, dinggin mo sila mula sa iyong tahanan, mula sa langit. Dinggin mo sila at magpatawad ka.
  to: At dinggin mo ang mga pakiusap[a] ng iyong lingkod at ng iyong bayang Israel kapag nananalangin sila sa direksiyon ng lugar na ito. Dinggin mo mula sa iyong tahanan, mula sa langit; dinggin mo at magpatawad ka.
  rationale: Inalis ang idinagdag na “sila” upang huwag tukuyin nang higit kaysa sa Hebreo ang layon ng ikalawa at ikatlong pagdinig. Inalis din ang hindi kailangang “At ikaw,” habang pinanatili ang tatlong ulit na “dinggin mo,” ang direksiyon ng panalangin tungo sa lugar na ito, at ang Diyos na dumirinig mula sa kanyang tahanan sa langit.
