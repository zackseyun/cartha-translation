base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/021.yaml
  text: And hear the pleas of your servant and of your people Israel when they pray toward this place. And may you hear from your dwelling place[a], from heaven, and when you hear, forgive.
translation:
  language: tl
  text: At dinggin mo ang mga pakiusap[a] ng iyong lingkod at ng iyong bayang Israel kapag nananalangin sila sa direksiyon ng lugar na ito. Dinggin mo mula sa iyong tahanan, mula sa langit; dinggin mo at magpatawad ka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O: mga pagsusumamo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמַעְתָּ / תִּשְׁמַע / וְשָׁמַעְתָּ
  choice: dinggin mo / dinggin mo / dinggin mo
  rationale: Pinananatili ang tatlong ulit na paggamit ng שׁמע, pati ang himig ng taimtim na kahilingan. Mas marangal at angkop sa panalangin ang “dinggin” kaysa sa karaniwang “pakinggan.”
- source_word: תַּחֲנוּנֵי
  choice: mga pakiusap
  rationale: Ipinahahayag nito ang taimtim na paghingi ng awa o lingap sa malinaw at makabagong Filipino; inilalagay sa talababa ang mas matinding alternatibong “mga pagsusumamo.”
- source_word: עַבְדְּךָ
  choice: iyong lingkod
  rationale: Sa panalangin ni Solomon sa Diyos, nangingibabaw ang magalang at kaugnayang kahulugan ng salita, kaya mas angkop ang “lingkod” kaysa “alipin.”
- source_word: וְעַמְּךָ יִשְׂרָאֵל
  choice: at ng iyong bayang Israel
  rationale: Ang pag-uulit ng “ng” ay nagpapalinaw na ang mga pakiusap ay kapuwa mula sa lingkod at sa bayang Israel.
- source_word: יִתְפַּלְלוּ
  choice: nananalangin sila
  rationale: Direkta at natural na katumbas ng pandiwang nangangahulugang manalangin.
- source_word: אֶל הַמָּקוֹם הַזֶּה
  choice: sa direksiyon ng lugar na ito
  rationale: Pinananatili ang direksiyonal na diwa ng אֶל nang hindi ipinahihiwatig na nasa templo mismo ang mga nananalangin.
- source_word: מִמְּקוֹם שִׁבְתְּךָ
  choice: mula sa iyong tahanan
  rationale: Malinaw at marangal na ipinahahayag ang lugar na kinaroroonan o pinananahanan ng Diyos.
- source_word: מִן הַשָּׁמַיִם
  choice: mula sa langit
  rationale: Bagaman anyong maramihan ang Hebreo, karaniwang tumutukoy rito ang salita sa langit bilang tahanan ng Diyos.
- source_word: סָלָחְתָּ
  choice: magpatawad ka
  rationale: Pinananatili ang panawagan sa Diyos na magpatawad nang hindi nagdaragdag ng tahasang layon na wala sa Hebreo.
theological_decisions:
- issue: Ang pagiging higit sa sangnilikha ng Diyos at ang papel ng templo
  choice: Nananalangin ang Israel sa direksiyon ng templo, ngunit dinirinig sila ng Diyos mula sa kanyang tahanan sa langit.
  alternative: Ipakahulugang naninirahan ang Diyos sa templo, o gawing sagisag lamang ang pagbanggit sa templo.
  rationale: 'Magkasabay na pinananatili ng tekstong Hebreo ang dalawang ideya: may natatanging papel ang templo bilang direksiyon ng panalangin, ngunit ang tahanan ng Diyos ay nasa langit. Hindi nilulutas o pinapawi ng salin ang tensiyong ito.'
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino para sa pampublikong pagbasa. Ginamit ang “dinggin” upang mapanatili ang pag-uulit sa Hebreo at ang himig ng panalangin; iniwasan ang labis na sinauna o teknikal na pananalita.
