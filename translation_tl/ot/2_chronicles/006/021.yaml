  source_fidelity: Ang draft ay wastong naghahatid ng mga pakiusap ng lingkod at Israel, pananalanging nakatuon sa lugar na ito, at pagdinig ng Diyos mula sa langit. Gayunman, ang idinagdag na layong “sila” sa ikalawa at ikatlong “dinggin mo sila” ay hindi tahasang nasa Hebreo. Mas tapat na panatilihing walang ipinahayag na layon, gaya ng paulit-ulit na pandiwang שׁמע sa pinagmulan.
  naturalness: Marangal at malinaw ang “dinggin mo,” at ang pag-uulit nito ay angkop sa panalanging pampubliko. Hindi kailangan ang “At ikaw,” na medyo hindi likas at hindi kinakailangan sa daloy ng Filipino. Natural ang “sa direksiyon ng lugar na ito” bilang pagpapahayag ng direksiyonal na parirala.
  terminology: Ang “mga pakiusap,” “iyong lingkod,” “iyong bayang Israel,” “tahanan,” “langit,” at “magpatawad” ay angkop at tapat sa konteksto. Ang talababa para sa “mga pagsusumamo” ay wastong alternatibong leksikal.
