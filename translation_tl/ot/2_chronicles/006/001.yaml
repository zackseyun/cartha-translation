  naturalness: Mas natural at mas malapit sa simpleng temporal na puwersa ng אָז ang “Noon” kaysa “Pagkatapos ay,” na maaaring magpahiwatig ng mas tiyak na sunod-sunod na kilos. Kailangan ding ayusin nang bahagya ang pangungusap sa talababa para sa mas likas na Filipino.
