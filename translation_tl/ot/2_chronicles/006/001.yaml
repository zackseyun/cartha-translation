base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/001.yaml
  text: Then Solomon said[a], “Yahweh has said that he would dwell in the thick darkness.”
translation:
  language: tl
  text: Noon ay sinabi ni Solomon, “Sinabi ni Yahweh na mananahan siya sa pusikit na dilim[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O kaya, “madilim na ulap.” Ang salitang Hebreo ay maaaring tumukoy sa makapal na ulap, karimlan, o pusikit na dilim, lalo na sa mga konteksto ng pagpapakita ng Diyos.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: Pagkatapos ay
  rationale: Nagsisilbi itong panandang temporal na nag-uugnay sa sinabi ni Solomon sa naunang pangyayari; natural ito sa makabagong Filipino.
- source_word: אָמַר ... שְׁלֹמֹה
  choice: sinabi ni Solomon
  rationale: Tuwirang salin ito ng karaniwang pormula sa pagpapakilala ng pagsasalita, nang walang dagdag na diin na wala sa Hebreo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos na nasa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: אָמַר
  choice: Sinabi
  rationale: Ang payak na nagdaang anyo ay natural sa Filipino at sapat na naghahayag ng aspektong ganap ng pandiwang Hebreo sa kontekstong ito.
- source_word: לִשְׁכּוֹן
  choice: na mananahan siya
  rationale: Ipinahahayag ng infinitibong may ל ang nilalaman ng sinabi ni Yahweh. Ang “mananahan” ay natural at pinananatili ang diwa ng namamalaging presensiya.
- source_word: בָּעֲרָפֶל
  choice: sa pusikit na dilim
  rationale: Maaaring tumukoy ang עֲרָפֶל sa makapal o madilim na ulap, karimlan, o pusikit na dilim. Ang piniling parirala ay malinaw at marangal habang pinananatili ang larawang kaugnay ng pagpapakita ng Diyos.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tahasang ginagamit ng talata ang Tetragrammaton, kaya pinananatili ang pangalang Yahweh sa halip na palitan ito ng titulo.
- issue: Ang diwa ng presensiya ng Diyos sa עֲרָפֶל
  choice: mananahan siya sa pusikit na dilim
  alternative: mananahan siya sa madilim na ulap
  rationale: Pinananatili ng pangunahing salin ang tensiyon sa pagitan ng paglapit at pagkakubli ng Diyos, samantalang inilalahad sa talababa ang tunay na leksikal na alternatibo.
translation_notes:
  register: Makabago, natural, at marangal na Filipino. Ginamit ang “pusikit na dilim” upang maging malinaw sa karaniwang mambabasa habang pinananatili ang bigat at tunay na kalabuan ng larawang Hebreo.
