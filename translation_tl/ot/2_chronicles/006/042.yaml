source:
  edition: WLC
  text: יְהוָ֣ה אֱלֹהִ֔ים אַל תָּשֵׁ֖ב פְּנֵ֣י מְשִׁיחֶ֑י/ךָ זָכְרָ֕/ה לְ/חַֽסְדֵ֖י דָּוִ֥יד עַבְדֶּֽ/ךָ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/042.yaml
  text: O Yahweh God[a], do not turn away the face of your anointed one[c][b]; remember the steadfast love shown to David your servant.
translation:
  language: tl
  text: O Yahweh na Diyos, huwag mong tanggihan[a] ang iyong pinahiran[b]. Alalahanin mo ang tapat na pag-ibig na ipinakita kay David na iyong lingkod.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “huwag mong ibalik o italikod ang mukha ng iyong pinahiran.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “ang iyong Mesiyas” o, ayon sa konteksto, “ang iyong hari.”
    reason: alternative_reading
  - marker: c
    text: Maaari ring “ang mga awa kay David na iyong lingkod” o “ang katapatan mo sa tipan kay David na iyong lingkod.” Siksik ang pariralang Hebreo at maaari ding unawaing tumutukoy sa mga gawa ng tapat na pag-ibig ni David.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה אֱלֹהִים
  choice: Yahweh na Diyos
  rationale: Pinananatili ang tipang pangalan na Yahweh at isinasalin ang karaniwang titulong אֱלֹהִים bilang “Diyos”; natural sa makabagong Tagalog ang “Yahweh na Diyos” sa tuwirang pagtawag.
- source_word: אַל תָּשֵׁב פְּנֵי
  choice: huwag mong tanggihan
  rationale: Ang literal na larawang “huwag mong ibalik/italikod ang mukha” ay isang idyoma ng hindi pagtanggap o pagtanggi. Ang “huwag mong tanggihan” ang malinaw at natural na kahulugan sa Tagalog, habang inilalagay sa talababa ang literal na larawan.
- source_word: מְשִׁיחֶךָ
  choice: ang iyong pinahiran
  rationale: Tuwirang ipinahahayag nito ang taong itinalaga sa pamamagitan ng pagpapahid, na sa konteksto ay ang haring mula sa sambahayan ni David. Hindi nito nililimitahan ang salita sa “hari” ni tahasang ginagawa itong kalaunang titulong “Mesiyas.”
- source_word: זָכְרָה
  choice: Alalahanin mo
  rationale: Karaniwang pautos na gamit ng זכר sa panalangin; ang “alalahanin mo” ay natural at marangal sa Tagalog.
- source_word: לְחַסְדֵי דָּוִיד
  choice: ang tapat na pag-ibig na ipinakita kay David
  rationale: Ipinahahayag ng חֶסֶד ang matatag at tapat na pag-ibig, kadalasa’y may kaugnayan sa tipan. Ipinakikita ng pariralang “ipinakita kay David” na si David ang tumatanggap, ayon sa pinakamalamang na diwa sa konteksto, samantalang kinikilala sa talababa ang siksik at maaaring maunawa sa ibang paraan na pariralang Hebreo.
- source_word: עַבְדֶּךָ
  choice: na iyong lingkod
  rationale: Ang “lingkod” ang karaniwan at angkop na katumbas ng עבד para sa katayuan ni David sa harap ng Diyos.
theological_decisions:
- issue: Ang kahulugan ng מְשִׁיחֶךָ sa maharlikang panalangin
  choice: ang iyong pinahiran
  alternative: ang iyong Mesiyas; ang iyong hari
  rationale: Sa agarang konteksto, tumutukoy ito sa pinahirang haring Davidiko. Pinananatili ng “iyong pinahiran” ang leksikal na kahulugan at ang posibleng mas malawak na mesiyanikong ugnayan nang hindi ipinipilit ang isang mas tiyak na kristolohikal na pagbasa.
- issue: Ang pinagmulan o tumatanggap ng חַסְדֵי sa pariralang לְחַסְדֵי דָּוִיד
  choice: ang tapat na pag-ibig na ipinakita kay David
  alternative: ang mga awa kay David; ang katapatan sa tipan kay David; ang mga gawa ng tapat na pag-ibig ni David
  rationale: Pinakamalamang na hinihiling ng panalangin na alalahanin ng Diyos ang kaniyang tapat na pag-ibig o mga pangako kay David. Gayunman, siksik ang Hebreo at maaaring mabasa ang genitibong parirala sa ibang paraan, kaya hindi itinatago ang alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “tanggihan” sa pangunahing teksto upang maiwasan ang malabo o di-natural na literal na idyoma tungkol sa mukha, ngunit pinanatili ang larawang Hebreo sa talababa. Hindi nilagyan ng panghalip na “iyong” bago ang “tapat na pag-ibig” sa pangunahing teksto upang hindi lubusang burahin ang sintaktikong ambiguity, bagaman ipinahihiwatig ng konteksto na pag-ibig o katapatan ito ng Diyos kay David.
