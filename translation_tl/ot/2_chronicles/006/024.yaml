  text: וְֽ/אִם יִנָּגֵ֞ף עַמְּ/ךָ֧ יִשְׂרָאֵ֛ל לִ/פְנֵ֥י אוֹיֵ֖ב כִּ֣י יֶֽחֶטְאוּ לָ֑/ךְ וְ/שָׁ֨בוּ֙ וְ/הוֹד֣וּ אֶת שְׁמֶ֔/ךָ וְ/הִתְפַּֽלְל֧וּ וְ/הִֽתְחַנְּנ֛וּ לְ/פָנֶ֖י/ךָ בַּ/בַּ֥יִת הַ/זֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/024.yaml
  text: If your people Israel are struck down before an enemy because they have sinned against you[a], and they turn back and confess your name, and pray and plead for favor before you in this house[c][b],
translation:
  language: tl
  text: Kung matalo ang iyong bayang Israel sa harap ng isang kaaway dahil nagkasala sila sa iyo, at magbalik-loob sila, magpahayag ng pagkilala sa iyong pangalan, manalangin, at magsumamo sa harap mo sa bahay na ito,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יִנָּגֵף
  choice: malupig
  rationale: Ipinahahayag ng Nifal ang pagkatalo ng Israel sa labanan. Likas at dignified sa modernong Tagalog ang “malupig” at napananatili nito ang resultang diwa ng pandiwa.
- source_word: לִפְנֵי אוֹיֵב
  choice: sa harap ng isang kaaway
  rationale: Malapit ito sa literal na idyomang Hebreo at pinananatili ang di-tiyak na isahan ng אוֹיֵב.
- source_word: כִּי יֶחֶטְאוּ לָךְ
  choice: dahil nagkasala sila sa iyo
  rationale: Ang כִּי ay nagbibigay ng dahilan ng pagkatalo, at ang “nagkasala ... sa iyo” ay natural na paglalahad ng kasalanang nakatuon laban sa Diyos.
- source_word: וְשָׁבוּ
  choice: magbalik-loob
  rationale: Ipinahihiwatig nito ang pagbabalik sa Diyos at pagsisisi sa kontekstong tipan, ngunit hindi ito ginawang teknikal na terminong doktrinal.
- source_word: וְהוֹדוּ אֶת שְׁמֶךָ
  choice: magpahayag ng pagkilala sa iyong pangalan
  rationale: Maaaring mangahulugan ang Hifil ng ידה ng pagkilala, pagpapahayag, pagpuri, o pasasalamat. Ang napiling parirala ay angkop sa konteksto ng pagbabalik matapos magkasala at hindi lubusang ikinukulong ang salitang Hebreo sa iisang kahulugan.
- source_word: וְהִתְפַּלְלוּ
  choice: manalangin
  rationale: Karaniwan at malinaw na katumbas ng Hitpael ng פלל.
- source_word: וְהִתְחַנְּנוּ
  choice: magsumamo
  rationale: Inihahayag nito ang taimtim na paghingi ng awa o lingap nang hindi gumagamit ng lipas o sobrang teknikal na pananalita.
- source_word: לְפָנֶיךָ
  choice: sa harap mo
  rationale: Pinananatili ang karaniwang idyomang Hebreo para sa direktang paglapit sa Diyos sa panalangin.
- source_word: בַּבַּיִת הַזֶּה
  choice: sa bahay na ito
  rationale: Pinananatili ang literal na “bahay” at ang konteksto ng panalangin sa pagtatalaga; ang “templo” ay mas interpretatibo.
theological_decisions:
- issue: Diwa ng pagsisisi sa וְשָׁבוּ
  choice: magbalik-loob
  alternative: bumalik; magsisi
  rationale: Naroon sa konteksto ang pagsisisi at pagpapanumbalik ng tipan, ngunit mas malawak ang pandiwang Hebreo kaysa sa teknikal na “magsisi.” Napananatili ng “magbalik-loob” ang larawan ng pagbabalik at ang teolohikal na pahiwatig.
- issue: Saklaw ng kahulugan ng וְהוֹדוּ אֶת שְׁמֶךָ
  choice: magpahayag ng pagkilala sa iyong pangalan
  alternative: magpuri sa iyong pangalan; magpasalamat sa iyong pangalan; ipahayag ang iyong pangalan
  rationale: Hindi tiyak sa kontekstong ito kung pangunahing diin ay pagkilala, pagpuri, o pasasalamat. Ang salin at talababa ay nagpapanatili sa tunay na lawak ng kahulugan sa halip na ipasya ito ayon sa isang doktrinal na pagbasa.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa pampublikong pagbasa. Pinanatili ang “bahay” at “sa harap” upang maging malapit sa tekstong Hebreo, habang ginamit ang mga likas na pandiwang “malupig,” “magbalik-loob,” at “magsumamo.”
