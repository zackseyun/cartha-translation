base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/036.yaml
  text: When they sin against you—for there is no one who does not sin—and you are angry with them and give them over to an enemy[a], and their captors carry them away to a land far or near,
translation:
  language: tl
  text: Kapag nagkasala sila laban sa iyo—sapagkat walang taong hindi nagkakasala—at magalit ka sa kanila at ibigay mo sila sa isang kaaway, at dalhin silang bihag ng mga bumihag sa kanila sa isang lupaing malayo man o malapit,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי יֶחֶטְאוּ לָךְ
  choice: Kapag nagkasala sila laban sa iyo
  rationale: Ang pambungad na כִּי ay nagpapakilala ng isang kalagayang inaasahang maaaring mangyari; ang “kapag” ay natural sa konteksto, at ang חטא na may ל ay wastong ipinapahayag bilang pagkakasala “laban sa” Diyos.
- source_word: כִּי אֵין אָדָם אֲשֶׁר לֹא יֶחֱטָא
  choice: sapagkat walang taong hindi nagkakasala
  rationale: Ang אָדָם ay tumutukoy sa tao o sangkatauhan sa pangkalahatan. Pinananatili ng “taong” ang anyong pang-isahan at likas na pangkalahatan sa Tagalog, samantalang malinaw na ipinahahayag ng “sapagkat” ang paliwanag na gamit ng כִּי.
- source_word: וְאָנַפְתָּ בָם
  choice: at magalit ka sa kanila
  rationale: Ang אנף ay tumutukoy sa pagkagalit. Ang “magalit” ay malinaw at marangal nang hindi pinatitindi nang higit sa ipinahihiwatig ng Hebreo.
- source_word: וּנְתַתָּם לִפְנֵי אוֹיֵב
  choice: at ibigay mo sila sa isang kaaway
  rationale: Ipinahihiwatig ng נתן לפני אויב ang pagpapasailalim sa kapangyarihan ng kaaway. Ang “isang kaaway” ay nagpapanatili sa di-tiyak na pang-isahang אוֹיֵב.
- source_word: וְשָׁבוּם שׁוֹבֵיהֶם
  choice: at dalhin sila ng mga bumihag sa kanila
  rationale: Ang pandiwa at kaugnay na participle ay nagsasaad na dinadala sila ng mga bumihag sa kanila. Natural sa Tagalog ang pahayag at pinananatili ang tuwirang pagkakasunod ng mga sugnay.
- source_word: אֶל אֶרֶץ רְחוֹקָה אוֹ קְרוֹבָה
  choice: sa isang lupaing malayo man o malapit
  rationale: Pinananatili ng “malayo man o malapit” ang maikli at balanseng paghahambing ng Hebreo nang hindi tinutukoy kung saan ibinabatay ang layo.
theological_decisions:
- issue: Ang pangkalahatang אָדָם sa pahayag tungkol sa pagkakasala ng lahat ng tao
  choice: walang taong hindi nagkakasala
  alternative: walang sinumang hindi nagkakasala
  rationale: Ang “tao” sa Tagalog ay likas na walang tinutukoy na kasarian at tumutugma sa pangkalahatang pang-isahang אָדָם. Pinananatili rin nito ang tuwirang pahayag na walang taong ligtas sa pagkakasala, nang hindi nagdaragdag ng paliwanag na teolohikal.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang karaniwang bokabularyo at pinanatili ang mahabang kondisyunal na daloy ng panalangin, pati ang kuwit sa hulihan dahil nagpapatuloy ang pangungusap sa kasunod na talata.
