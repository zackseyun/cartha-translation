  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/אַתָּה֙ תִּשְׁמַ֣ע מִן הַ/שָּׁמַ֔יִם וְ/סָ֣לַחְתָּ֔ לְ/חַטַּ֖את עַמְּ/ךָ֣ יִשְׂרָאֵ֑ל וַ/הֲשֵׁיבוֹתָ/ם֙ אֶל הָ֣/אֲדָמָ֔ה אֲשֶׁר נָתַ֥תָּה לָ/הֶ֖ם וְ/לַ/אֲבֹתֵי/הֶֽם־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/025.yaml
  text: then you will hear from heaven[a], and forgive the sin of your people Israel[b], and bring them back to the land that you gave to them and to their fathers.
translation:
  language: tl
  text: Kung magkagayon, dinggin mo[a] mula sa langit, patawarin mo ang kasalanan ng iyong bayang Israel, at ibalik mo sila sa lupaing ibinigay mo sa kanila at sa kanilang mga ninuno.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “pakikinggan mo.”
    reason: Pinananatili ang posibilidad na ang anyong Hebreo ay nagsasaad ng inaasahang gagawin, sa halip na tuwirang pakiusap.
  - marker: b
    text: Sa Hebreo, “kanilang mga ama.”
    reason: Itinatala ang literal na katawagang pangkamag-anakan sa likod ng likas na saling “mga ninuno.”
lexical_decisions:
- source_word: תִּשְׁמַע
  choice: dinggin mo
  rationale: Sa konteksto ng panalangin, ang pandiwa ay humihiling ng maingat na pakikinig na may ipinahihiwatig na pagtugon. Likas sa Filipino ang “dinggin mo” at hindi nito kailangang tahasang idagdag ang pagtugon.
- source_word: מִן הַשָּׁמַיִם
  choice: mula sa langit
  rationale: Bagaman maramihan ang anyong Hebreo, “langit” ang karaniwang likas na tawag sa Filipino sa tahanan ng Diyos sa ganitong konteksto.
- source_word: סָלַחְתָּ
  choice: patawarin mo
  rationale: Ito ang malinaw at karaniwang katumbas sa Filipino ng pandiwang ginagamit para sa pagpapatawad ng Diyos.
- source_word: לְחַטַּאת
  choice: ang kasalanan
  rationale: Pinananatili ang isahang anyo ng Hebreo, na kolektibong tumutukoy sa pagkakasala ng Israel.
- source_word: עַמְּךָ יִשְׂרָאֵל
  choice: iyong bayang Israel
  rationale: Natural sa Filipino at pinananatili kapwa ang tipanang katawagan at ang pangalan ng bayan.
- source_word: וַהֲשֵׁיבוֹתָם
  choice: ibalik mo sila
  rationale: 'Causative ang anyo ng pandiwa: ang Diyos ang magpapabalik sa kanila. Malinaw itong naihahayag ng “ibalik mo sila.”'
- source_word: אֶל הָאֲדָמָה
  choice: sa lupain
  rationale: Sa kontekstong tipanan at pambansa, tumutukoy ito sa lupaing ipinagkaloob sa Israel, hindi lamang sa lupa o lupaing sakahan.
- source_word: אֲשֶׁר נָתַתָּה לָהֶם וְלַאֲבֹתֵיהֶם
  choice: na ibinigay mo sa kanila at sa kanilang mga ninuno
  rationale: Pinananatili ang pagkakaloob kapwa sa kasalukuyang salinlahi at sa mga naunang salinlahi. Mas natural at mas malinaw sa modernong Filipino ang “mga ninuno,” habang itinatala sa talababa ang literal na “mga ama.”
theological_decisions:
- issue: Puwersa ng mga pandiwa sa panalangin
  choice: dinggin mo … patawarin mo … ibalik mo
  alternative: pakikinggan mo … patatawarin mo … ibabalik mo
  rationale: Maaaring unawain ang magkakaugnay na anyong Hebreo bilang katiyakan sa hinaharap o bilang pakiusap sa loob ng panalangin. Pinili ang pakiusap dahil sa agarang konteksto, ngunit hindi itinago ang alternatibong pagbasa.
- issue: Kahulugan ng אֲבֹתֵיהֶם
  choice: kanilang mga ninuno
  alternative: kanilang mga ama
  rationale: Literal na “mga ama” ang Hebreo, ngunit sa kontekstong ito tumutukoy ito sa mga naunang salinlahing tumanggap ng lupain. Ang “mga ninuno” ay likas at malinaw sa Filipino nang hindi nagdaragdag ng denominasyonal na pakahulugan.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang magkakatugmang anyong pakiusap upang maging natural ang daloy ng panalangin, habang inilalahad sa talababa ang tunay na gramatikal at leksikal na mga alternatibo.
