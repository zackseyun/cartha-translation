base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/023.yaml
  text: then hear from heaven and act[a], and judge your servants, repaying the wicked by bringing his way upon his own head[b], and vindicating the righteous by giving to him according to his righteousness.
translation:
  language: tl
  text: 'kung magkagayon, dinggin mo mula sa langit at kumilos. Hatulan mo ang iyong mga lingkod: gantihan mo ang masama sa pamamagitan ng pagbabalik ng kanyang ginawa sa sarili niyang ulo,[a] at ipahayag na nasa tama ang matuwid[b] sa pamamagitan ng pagbibigay sa kanya ayon sa kanyang katuwiran.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “ibigay ang kanyang daan sa kanyang ulo.” Isa itong idyomang Hebreo para sa pagpaparanas sa isang tao ng bunga ng sarili niyang asal bilang hatol.
    reason: cultural_note
  - marker: b
    text: Maaari ring “pawalang-sala ang matuwid.” Ang pandiwang Hebreo ay salitang panghukuman na nangangahulugang ipahayag o ituring na nasa tama ang isang tao.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּשְׁמַע מִן הַשָּׁמַיִם
  choice: dinggin mo mula sa langit
  rationale: Sa panalanging nakatuon sa Diyos, ang שׁמע ay hindi lamang pisikal na pagkarinig kundi pakikinig na may pagtugon. Pinananatili ng “mula sa langit” ang idyoma at marangal na himig ng Hebreo.
- source_word: וְעָשִׂיתָ
  choice: at kumilos
  rationale: Malawak ang kahulugan ng pandiwa na “gawin,” ngunit sa konteksto ng panalangin para sa paghatol, malinaw at natural na ipinahihiwatig ng “kumilos” ang hinihiling na pagtugon ng Diyos.
- source_word: וְשָׁפַטְתָּ אֶת עֲבָדֶיךָ
  choice: Hatulan mo ang iyong mga lingkod
  rationale: Malinaw na hudisyal ang gamit ng שׁפט dahil sinusundan ito ng magkatugmang pasiya para sa masama at sa matuwid. Ang “mga lingkod” ay angkop sa mga taong nagpapasakop sa Diyos at hindi kinakailangang tumukoy sa pagkaalipin.
- source_word: לְהָשִׁיב לְרָשָׁע
  choice: gantihan mo ang masama
  rationale: Ipinapahayag dito ang makatarungang pagganti o paggawad ng kahihinatnan sa masama; nililinaw ng kasunod na parirala kung paano bumabalik sa kanya ang sarili niyang asal.
- source_word: לָתֵת דַּרְכּוֹ בְּרֹאשׁוֹ
  choice: sa pamamagitan ng pagbabalik ng kanyang ginawa sa sarili niyang ulo
  rationale: Ang “daan” ay tumutukoy sa asal o ginawa ng tao. Pinananatili ang larawang Hebreo na ang bunga ng kanyang asal ay bumabalik sa sarili niyang ulo, habang ginagawang mauunawaan sa modernong Tagalog.
- source_word: וּלְהַצְדִּיק צַדִּיק
  choice: at ipahayag na nasa tama ang matuwid
  rationale: 'Forensiko ang Hiphil ng צדק rito: hatulan o kilalaning nasa tama ang isang tao. Iniiwasan ng pariralang ito ang posibleng pagpasok ng mas huling teknikal na doktrina sa salitang “ariing-ganap,” ngunit pinananatili ang hudisyal na diwa.'
- source_word: לָתֵת לוֹ כְּצִדְקָתוֹ
  choice: sa pamamagitan ng pagbibigay sa kanya ayon sa kanyang katuwiran
  rationale: Tuwirang pinananatili nito ang ideya ng paggawad na naaayon sa katuwiran ng tao, nang hindi idinaragdag ang mas interpretibong salitang “gantimpala.”
theological_decisions:
- issue: Hudisyal na diwa ng paghatol ng Diyos
  choice: Ilarawan ang Diyos bilang humahatol, gumaganti sa masama, at nagpapahayag na nasa tama ang matuwid.
  alternative: Ilarawan lamang ang pangkalahatang pamamahala o pagkilos ng Diyos nang walang malinaw na diwang panghukuman.
  rationale: Ang שׁפט, ang magkatapat na masama at matuwid, at ang pandiwang הצדיק ay magkakasamang nagpapakita ng tagpong panghukuman.
- issue: Kahulugan ng הצדיק
  choice: ipahayag na nasa tama ang matuwid
  alternative: ariing-ganap ang matuwid; pawalang-sala ang matuwid; ipagtanggol ang matuwid
  rationale: Pinananatili ng napiling salin ang forensikong pagpapasiya na nasa tama ang tao. Hindi nito ipinapalagay na ang tinutukoy ay likas na pagbabago sa tao, at hindi rin nito ipinapasok ang mga doktrinal na kahulugang maaaring ikabit sa teknikal na “ariing-ganap.”
translation_notes:
  register: Modernong Filipino Tagalog na marangal at malinaw. Ginamit ang “dinggin” upang mapanatili ang himig ng panalangin, ngunit iniwasan ang labis na arkaikong ayos. Ang mga pandiwa ay tuwiran at hudisyal, alinsunod sa konteksto.
