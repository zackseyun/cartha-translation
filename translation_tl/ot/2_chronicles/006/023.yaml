  source_fidelity: 'Tapat ang salin sa Hebreo: pinananatili nito ang panawagang dinggin mula sa langit at kumilos, ang hudisyal na paghatol sa mga lingkod, ang pagganti sa masama sa anyong pagbabalik ng kanyang asal sa sarili niyang ulo, at ang forensikong pagpapahayag na nasa tama ang matuwid ayon sa kanyang katuwiran.'
  naturalness: Natural at marangal ang modernong Filipino Tagalog. Ang “dinggin mo,” “Hatulan mo,” at “ipahayag na nasa tama” ay malinaw, angkop sa panalangin, at hindi labis na arkaiko. Nauunawaan rin ang idyomang “sa sarili niyang ulo” dahil sa katabing talababa.
  terminology: Ang “mga lingkod,” “masama,” “matuwid,” at “katuwiran” ay pare-pareho at angkop sa kontekstong panghukuman. Ang “ipahayag na nasa tama ang matuwid” ay mahusay na salin ng forensic na הַצְדִּיק nang hindi nagpapasok ng teknikal na doktrinal na pakahulugan.
