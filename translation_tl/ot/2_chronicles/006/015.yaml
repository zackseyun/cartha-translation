base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/015.yaml
  text: You have kept for your servant David my father what you spoke to him[a]; with your mouth you have spoken, and with your hand you have fulfilled it[b], as it is this day.
translation:
  language: tl
  text: Tinupad mo para sa iyong lingkod na si David, na aking ama, ang sinabi mo sa kanya[a]. Nagsalita ka sa pamamagitan ng iyong bibig, at tinupad mo ito sa pamamagitan ng iyong kamay[b], gaya ng sa araw na ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang ipinangako mo sa kanya.” Literal sa Hebreo, “ang sinabi mo sa kanya”; nahihinuha sa konteksto ng katuparan na ito ay isang pangako.
    reason: lexical_alternative
  - marker: b
    text: Literal na “sa pamamagitan ng iyong bibig … at sa pamamagitan ng iyong kamay,” isang paraan ng pagpapahayag sa Hebreo na pinagtatambal ang sinalitang salita ng Diyos at ang kanyang mabisang pagkilos.
    reason: cultural_note
lexical_decisions:
- source_word: שָׁמַרְתָּ
  choice: Tinupad mo
  rationale: Sa konteksto ng pangako at katuparan, ang שׁמר ay tumutukoy sa matapat na pagtupad sa sinabi. Mas natural sa modernong Tagalog ang “tinupad” kaysa literal na “iningatan.”
- source_word: לְעַבְדְּךָ
  choice: sa iyong lingkod
  rationale: Ang עבד sa panalanging makahari ay angkop na isaling “lingkod”; hindi nangingibabaw rito ang diwang “alipin.”
- source_word: דָּוִיד אָבִי
  choice: si David na aking ama
  rationale: Pinananatili nito ang pagkakasunod ng Hebreo habang malinaw at marangal sa Tagalog.
- source_word: אֵת אֲשֶׁר דִּבַּרְתָּ לוֹ
  choice: ang sinabi mo sa kanya
  rationale: Tuwirang pinananatili ang “sinabi” sa Hebreo; ang diwa ng pangako ay nahihinuha mula sa pandiwang “tinupad.”
- source_word: וַתְּדַבֵּר בְּפִיךָ
  choice: Nagsalita ka sa pamamagitan ng iyong bibig
  rationale: Pinananatili ang kongkretong larawan at ang pagtutumbas nito sa kasunod na “kamay.”
- source_word: וּבְיָדְךָ מִלֵּאתָ
  choice: at tinupad mo iyon sa pamamagitan ng iyong kamay
  rationale: Ang מלא sa idyomang ito ay nangangahulugang isakatuparan o tuparin; pinananatili rin ang larawan ng kamay bilang mabisang pagkilos.
- source_word: כַּיּוֹם הַזֶּה
  choice: gaya ng nakikita sa araw na ito
  rationale: Ipinahihiwatig ng idyoma ang kasalukuyan at hayag na katibayan ng katuparan; ang salin ay natural sa Tagalog at hindi lamang tumutukoy sa petsa.
theological_decisions:
- issue: Antropomorpikong pananalita tungkol sa Diyos (“bibig” at “kamay”)
  choice: Panatilihin ang mga larawang “bibig” at “kamay”
  alternative: Isaling dinamiko bilang “sinabi mo at isinagawa mo”
  rationale: Sinasadyang itambal ng talata ang salita ng Diyos at ang kanyang mabisang pagkilos. Ang pagpapanatili sa mga larawan ay nag-iingat sa retorika ng Hebreo nang hindi nagdaragdag ng pahayag tungkol sa pisikal na anyo ng Diyos.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “sa pamamagitan ng” upang mapanatili ang bibig-kamay na paralelismo nang natural sa Tagalog; iniwasan ang sobrang arkaikong ayos at bokabularyo.
