review_pass:
  verdict: revise
  source_fidelity: 'Tumpak na naisasalin ng draft ang sunod-sunod na mga kapahamakan: taggutom, salot, pinsala/paninilaw ng pananim, balang, at ang isang insektong sumisira sa ani. Ang “kubkubin siya” ay makatwirang salin ng pandiwang Hebreo para sa paggipit o pagkubkob, at ang “mga lungsod ng kanyang lupain” ay wastong pagpapaliwanag sa metonimikong “mga pintuang-bayan.”'
  naturalness: Sa pangkalahatan ay malinaw at marangal ang Tagalog. Mas tuwiran at mas likas ang “mga insektong sumisira sa pananim” kaysa “mga insektong maninira.” Ang “sa isa sa mga lungsod ng kanyang lupain” ay mas malapit sa idiomatikong diwa ng parirala kaysa “sa alinman sa mga lungsod,” nang hindi inaalis ang lawak ng pahayag.
  terminology: 'Ang “taggutom,” “salot,” “pagkalanta,” “paninilaw ng mga pananim,” “balang,” at “karamdaman” ay angkop na modernong Filipino Tagalog. Kailangang itama ang talababa a: ang “balang na maninila” ay maaaring magpahiwatig ng balang na mandaragit, hindi insektong kumakain at sumisira sa pananim.'
  issues:
  - severity: medium
    issue: 'Maling semantikong alternatibo sa talababa a: “balang na maninila.”'
    rationale: Ang חָסִיל ay tumutukoy sa isang insektong sumisira o lumalamon ng pananim; ang “maninila” sa modernong Tagalog ay karaniwang tumutukoy sa mandaragit. Dapat gumamit ng alternatibong nagpapahayag ng pagsira sa ani nang hindi iginigiit ang tiyak na espesye.
  - severity: low
    issue: “Mga insektong maninira” at “sa alinman sa mga lungsod” ay bahagyang hindi gaanong tuwiran.
    rationale: Mas natural ang “mga insektong sumisira sa pananim.” Ang “sa isa sa mga lungsod” ay maayos na idiomatikong pagpapahayag ng lokasyong tinutukoy ng Hebreong parirala, habang ipinapaliwanag ng talababa ang literal na “mga pintuang-bayan.”
  revised_text: Kung magkaroon ng taggutom sa lupain, kung magkaroon ng salot, pagkalanta o paninilaw ng mga pananim, mga balang o mga insektong sumisira sa pananim[a]; kung kubkubin siya ng kanyang mga kaaway sa isa sa mga lungsod ng kanyang lupain[b]; anumang salot o karamdaman ang dumating—
