revisions:
- from: Kung magkaroon ng taggutom sa lupain, kung magkaroon ng salot, pagkalanta o paninilaw ng mga pananim, mga balang o mga insektong maninira[a]; kung kubkubin siya ng kanyang mga kaaway sa alinman sa mga lungsod ng kanyang lupain[b]; anumang salot o karamdaman ang dumating—
  to: Kung magkaroon ng taggutom sa lupain, kung magkaroon ng salot, pagkalanta o paninilaw ng mga pananim, mga balang o mga insektong sumisira sa pananim[a]; kung kubkubin siya ng kanyang mga kaaway sa isa sa mga lungsod ng kanyang lupain[b]; anumang salot o karamdaman ang dumating—
  rationale: Pinananatili ng rebisyon ang lawak at pagkakasunod ng listahan sa Hebreo, pati ang isahang panghalip at ang hindi pa tapos na sintaks na may em dash. Itinama nito ang mapanligaw na “maninila” sa talababa at pinakinis ang dalawang parirala para sa natural na modernong Tagalog.
