source:
  edition: WLC
  text: רָעָ֞ב כִּֽי יִהְיֶ֣ה בָ/אָ֗רֶץ דֶּ֣בֶר כִּֽי יִֽ֠הְיֶה שִׁדָּפ֨וֹן וְ/יֵרָק֜וֹן אַרְבֶּ֤ה וְ/חָסִיל֙ כִּ֣י יִהְיֶ֔ה כִּ֧י יָֽצַר ל֛/וֹ אוֹיְבָ֖י/ו בְּ/אֶ֣רֶץ שְׁעָרָ֑י/ו כָּל נֶ֖גַע וְ/כָֽל מַחֲלָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/028.yaml
  text: If there is famine in the land[a], if there is plague, blight, mildew, locust, or caterpillar; if his enemies besiege him in the land of his gates[b]; whatever plague and whatever sickness there may be—
translation:
  language: tl
  text: Kung magkaroon ng taggutom sa lupain, kung magkaroon ng salot, pagkalanta o paninilaw ng mga pananim, mga balang o mga insektong sumisira sa pananim[a]; kung kubkubin siya ng kanyang mga kaaway sa isa sa mga lungsod ng kanyang lupain[b]; anumang salot o karamdaman ang dumating—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hindi tiyak ang eksaktong uri ng insektong tinutukoy ng Hebreong חָסִיל; maaari rin itong isaling “insektong lumalamon sa pananim.”
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “sa lupain ng kanyang mga pintuang-bayan.” Ang “mga pintuang-bayan” ay kumakatawan sa mga lungsod o bayan ng lupain.
    reason: cultural_note
lexical_decisions:
- source_word: רָעָב
  choice: taggutom
  rationale: Sa talaan ng mga kapahamakang sumasaklaw sa lupain, ang salita ay tumutukoy sa malawakang taggutom, hindi lamang sa karaniwang gutom.
- source_word: דֶּבֶר
  choice: salot
  rationale: Tumutukoy ito sa malubha at laganap na nakahahawang sakit; likas at marangal na katumbas sa modernong Tagalog ang “salot.”
- source_word: שִׁדָּפוֹן
  choice: pagkalanta ng mga pananim
  rationale: Inilalarawan nito ang mapaminsalang pagkatuyo o pagkalanta ng pananim, marahil dahil sa nakapapasong hangin; iniiwasang tukuyin ang sanhi nang higit sa katiyakan ng Hebreo.
- source_word: יֵרָקוֹן
  choice: paninilaw ng mga pananim
  rationale: Ang literal na diwa ay pamumutla o paninilaw, lalo na ng halaman. Mas malinaw ito sa Tagalog kaysa sa pag-aangkat ng partikular na sakit na maaaring hindi tiyak.
- source_word: אַרְבֶּה
  choice: mga balang
  rationale: Sa konteksto ng pagkasira ng ani, tumutukoy ito sa mga balang na dumarating bilang mapaminsalang kawan.
- source_word: חָסִיל
  choice: mga insektong maninira
  rationale: Hindi tiyak ang eksaktong uri ng insektong tinutukoy, ngunit malinaw na kumakain at sumisira ito ng pananim; pinananatili ng pangkalahatang salin ang leksikal na kawalang-katiyakan.
- source_word: כִּי יָצַר לוֹ אֹיְבָיו
  choice: kung kubkubin siya ng kanyang mga kaaway
  rationale: Ang pandiwa ay nagsasaad ng paggipit o pagpapalibot ng kaaway; ang “kubkubin” angkop sa malinaw na kontekstong militar.
- source_word: בְּאֶרֶץ שְׁעָרָיו
  choice: sa alinman sa mga lungsod ng kanyang lupain
  rationale: Ang “mga pintuang-bayan” ay metonimiya para sa mga napapaderang lungsod o bayan. Isinalin ang diwa sa pangunahing teksto at itinabi sa talababa ang literal na larawan.
- source_word: כָּל נֶגַע
  choice: anumang salot
  rationale: Malawak ang kahulugan nito—hagupit, kapinsalaan, o salot. Sa paralelismo sa karamdaman at sa talaan ng mga kapahamakan, ang “anumang salot” ay angkop.
- source_word: וְכָל מַחֲלָה
  choice: o karamdaman
  rationale: Tumutukoy ito sa anumang sakit. Ginamit ang “o” sa likas na Tagalog upang ipahayag ang saklaw ng magkapares na pangkalahatang kategorya.
theological_decisions:
- issue: Ang isahang panghalip sa “kubkubin siya”
  choice: Pinanatili ang isahang “siya,” na maaaring tumukoy sa bayan o lupain bilang isang kolektibong persona.
  alternative: “kubkubin sila” o tahasang “kubkubin ang iyong bayan”
  rationale: Isahan ang panghalip sa Hebreo. Ang pagpapanatili nito ay umiiwas sa tahimik na paglutas kung sino ang eksaktong tinutukoy sa kolektibong konteksto.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Ginamit ang mga karaniwang salitang “taggutom,” “salot,” “balang,” at “karamdaman.” Nilinaw ang mga terminong pang-agrikultura nang hindi nagtakda ng sanhi o uri na hindi tiyak sa Hebreo. Ang em dash sa hulihan ay nagpapanatili sa di-tapos na sintaks na nagpapatuloy sa susunod na talata.
