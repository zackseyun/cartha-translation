translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Pinanatili ang pag-uulit ng ‘buong kapulungan ng Israel’ dahil kapansin-pansin din ito sa Hebreo. Ginawang hayag ang ipinahihiwatig na layon ng pagharap—ang kapulungan—upang maging natural sa Tagalog.
