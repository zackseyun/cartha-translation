  text: כִּֽי עָשָׂ֨ה שְׁלֹמֹ֜ה כִּיּ֣וֹר נְחֹ֗שֶׁת וַֽ/יִּתְּנֵ/הוּ֮ בְּ/ת֣וֹךְ הָ/עֲזָרָה֒ חָמֵ֨שׁ אַמּ֜וֹת אָרְכּ֗/וֹ וְ/חָמֵ֤שׁ אַמּוֹת֙ רָחְבּ֔/וֹ וְ/אַמּ֥וֹת שָׁל֖וֹשׁ קוֹמָת֑/וֹ וַ/יַּעֲמֹ֣ד עָלָ֗י/ו וַ/יִּבְרַ֤ךְ עַל בִּרְכָּי/ו֙ נֶ֚גֶד כָּל קְהַ֣ל יִשְׂרָאֵ֔ל וַ/יִּפְרֹ֥שׂ כַּפָּ֖י/ו הַ/שָּׁמָֽיְמָ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/013.yaml
  text: For Solomon had made a bronze platform and set it in the midst of the court; it was five cubits long[a], five cubits wide, and three cubits high. He stood on it, then knelt on his knees before all the assembly of Israel and spread out his hands toward heaven.
translation:
  language: tl
  text: Sapagkat gumawa si Solomon ng isang tansong plataporma[a] at inilagay niya ito sa gitna ng looban. Limang siko ang haba nito, limang siko ang lapad, at tatlong siko ang taas. Tumayo siya sa ibabaw nito, saka lumuhod sa harap ng buong kapulungan ng Israel at iniunat ang kanyang mga kamay patungo sa langit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Karaniwang nangangahulugang “palanggana” o “hugasan” ang salitang Hebreo, ngunit dito ay tumutukoy ito sa isang nakataas na estrukturang tinayuan ni Solomon; kaya isinaling “plataporma.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikilala nito ang paliwanag tungkol sa kinalalagyan at tindig ni Solomon; pinananatili ng “Sapagkat” ang paliwanag na ugnayan sa naunang talata.
- source_word: כִּיּוֹר נְחֹשֶׁת
  choice: isang platapormang tanso
  rationale: Bagaman karaniwang tumutukoy ang כִּיּוֹר sa palanggana o hugasan, ipinahihiwatig ng sukat at ng pagtayo ni Solomon sa ibabaw nito na isa itong nakataas na tuntungan o plataporma. Nililinaw sa talababa ang di-karaniwang gamit.
- source_word: בְּתוֹךְ הָעֲזָרָה
  choice: sa gitna ng looban
  rationale: Ang עֲזָרָה ay looban ng templo, at natural na ipinahahayag ng “sa gitna” ang lokasyong tinutukoy ng בְּתוֹךְ.
- source_word: חָמֵשׁ אַמּוֹת ... וְאַמּוֹת שָׁלֹשׁ
  choice: Limang siko ang haba nito, limang siko ang lapad, at tatlong siko ang taas
  rationale: Pinananatili ang sinaunang yunit na “siko” habang inilalahad ang mga sukat sa natural na Filipino.
- source_word: וַיַּעֲמֹד עָלָיו
  choice: Tumayo siya roon
  rationale: Ang “roon” ay natural na tumutukoy sa ibabaw ng plataporma nang hindi ipinahihiwatig na nanatili siyang nakatayo habang lumuluhod.
- source_word: וַיִּבְרַךְ עַל בִּרְכָּיו
  choice: saka lumuhod
  rationale: Sa anyo at kontekstong ito, ang ברך ay nangangahulugang lumuhod, hindi magpala. Ipinakikita ng “saka” ang pagkakasunod ng kilos.
- source_word: נֶגֶד כָּל קְהַל יִשְׂרָאֵל
  choice: sa harap ng buong kapulungan ng Israel
  rationale: Ang “kapulungan” ay angkop sa pampublikong pagtitipon ng Israel at malinaw na ipinahahayag ng “sa harap” ang נֶגֶד.
- source_word: וַיִּפְרֹשׂ כַּפָּיו הַשָּׁמָיְמָה
  choice: at iniunat ang kanyang mga kamay patungo sa langit
  rationale: Natural na Filipino ito para sa kilos ng pananalangin at pinananatili ng “patungo sa langit” ang direksiyonal na hulapi ng הַשָּׁמָיְמָה.
theological_decisions:
- issue: Kahulugan ng כִּיּוֹר sa kontekstong ito
  choice: Isinaling “platapormang tanso” ayon sa konteksto.
  alternative: palangganang tanso; tuntungang tanso
  rationale: Karaniwang nangangahulugang palanggana o hugasan ang salita, ngunit ang mga sukat at ang tahasang pagtayo ni Solomon sa ibabaw nito ay nagpapakitang isang nakataas na estruktura ang tinutukoy. Hindi inaalis ang leksikal na di-pangkaraniwan; itinatala ito sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “looban,” “kapulungan,” at “siko” upang mapanatili ang kontekstong pangtemplo, pampublikong pagtitipon, at sinaunang sukat nang hindi nagiging lipas o labis na teknikal.
