  terminology: Ang “bayan,” “lupain ng Ehipto,” “bahay,” “lalaki,” at “pinuno” ay angkop. Pinananatili ng “bahay” ang בַּיִת at hindi pinapalitan ng interpretibong “templo”; pinananatili rin ng “lalaki” ang panlalaking isahan ng אִישׁ.
