id: 2CH.6.5
reference: 2 Chronicles 6:5
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: מִן הַ/יּ֗וֹם אֲשֶׁ֨ר הוֹצֵ֣אתִי אֶת עַמִּ/י֮ מֵ/אֶ֣רֶץ מִצְרַיִם֒ לֹא בָחַ֣רְתִּֽי בְ/עִ֗יר מִ/כֹּל֙ שִׁבְטֵ֣י יִשְׂרָאֵ֔ל לִ/בְנ֣וֹת בַּ֔יִת לִ/הְי֥וֹת שְׁמִ֖/י שָׁ֑ם וְ/לֹא בָחַ֣רְתִּֽי בְ/אִ֔ישׁ לִ/הְי֥וֹת נָגִ֖יד עַל עַמִּ֥/י יִשְׂרָאֵֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/005.yaml
  text: From the day that I brought my people out of the land of Egypt[a], I have not chosen a city from any of the tribes of Israel to build a house for my name to be there[c][b], nor have I chosen a man to be ruler over my people Israel.
translation:
  language: tl
  text: Mula nang ilabas ko ang aking bayan mula sa lupain ng Ehipto,[a] hindi ako pumili ng isang lungsod mula sa alinman sa mga lipi ng Israel upang magtayo roon ng isang bahay,[b] upang ang aking pangalan ay naroon; at hindi rin ako pumili ng isang lalaki upang maging pinuno[c] ng aking bayang Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Mula noong araw na inilabas ko ang aking bayan mula sa lupain ng Ehipto, hindi ako pumili...”'
    reason: Ipinakikita ng alternatibo ang mas pormal na anyo ng pariralang temporal at ng mga pandiwang Hebreo.
  - marker: b
    text: Ang “bahay” ay tumutukoy sa templo; “bahay” mismo ang salitang ginamit sa Hebreo.
    reason: Pinananatili ng salin ang literal na katawagan sa halip na ang mas interpretibong “templo.”
  - marker: c
    text: Maaari ring isalin ang “pinuno” bilang “tagapamahala” o “prinsipe.”
    reason: May saklaw ng kahulugan ang נָגִיד para sa isang taong inilagay sa awtoridad.
lexical_decisions:
- source_word: מִן הַיּוֹם אֲשֶׁר
  choice: Mula nang
  rationale: Natural na panandang temporal sa modernong Tagalog na nagsasaad ng simulang punto at nagpapanatili sa patuloy na bisa ng kasunod na pagtanggi.
- source_word: הוֹצֵאתִי אֶת עַמִּי מֵאֶרֶץ מִצְרַיִם
  choice: ilabas ko ang aking bayan mula sa lupain ng Ehipto
  rationale: Pinananatili ang causative na diwa ng Hiphil at ang pormal na heograpikong pariralang 'lupain ng Ehipto.'
- source_word: לֹא בָחַרְתִּי בְעִיר
  choice: hindi ako pumili ng isang lungsod
  rationale: Sa pandiwang בחר, minamarkahan ng ב ang piniling bagay; likas sa Tagalog ang tuwirang layon.
- source_word: מִכֹּל שִׁבְטֵי יִשְׂרָאֵל
  choice: mula sa alinman sa mga lipi ng Israel
  rationale: Malinaw na ipinahahayag ang distributibong diwa sa loob ng negatibong pahayag.
- source_word: לִבְנוֹת בַּיִת
  choice: upang magtayo ng isang bahay
  rationale: Ang literal na 'bahay' ay pinanatili sa halip na ang mas interpretibong 'templo.'
- source_word: לִהְיוֹת שְׁמִי שָׁם
  choice: na kinaroroonan ng aking pangalan
  rationale: Natural sa Tagalog at malapit sa literal na 'upang ang pangalan ko ay naroon,' nang hindi idinaragdag ang konsepto ng paninirahan na wala sa pandiwa.
- source_word: וְלֹא בָחַרְתִּי בְאִישׁ
  choice: at hindi rin ako pumili ng isang lalaki
  rationale: Pinananatili ang magkatulad na pagtanggi at ang panlalaking isahan ng אִישׁ.
- source_word: נָגִיד
  choice: pinuno
  rationale: Malinaw at kasalukuyang salitang Tagalog para sa taong itinalaga sa awtoridad; hindi nito ipinapalagay ang maharlikang kahulugan ng 'prinsipe.'
- source_word: עַל עַמִּי יִשְׂרָאֵל
  choice: ng aking bayang Israel
  rationale: Sa pariralang 'maging pinuno ng,' natural na naihahayag sa Tagalog ang pamamahala sa bayan habang pinananatili ang tipanang katawagang 'aking bayang Israel.'
theological_decisions:
- issue: Tawag sa santuwaryo at wika tungkol sa banal na pangalan
  choice: Panatilihin ang 'bahay' at 'kinaroroonan ng aking pangalan.'
  alternative: Templo na pananahanan ng aking presensya/pangalan.
  rationale: Ginagamit ng Hebreo ang בַּיִת, 'bahay,' at ang pandiwang 'maging/naroon,' hindi 'manahan.' Pinananatili nito ang sariling mga kategorya at tensiyong teolohikal ng teksto.
- issue: Kasarian ng אִישׁ
  choice: isang lalaki
  alternative: isang tao o sinuman
  rationale: Panlalaking isahan ang Hebreo at tumutukoy sa isang lalaking mamumuno sa kasaysayan ng Israel; hindi ito dapat gawing neutral nang walang batayan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang 'bayan' para sa tipanang 'people,' 'lupain ng Ehipto' para sa pormal na heograpikong pahayag, at semicolon upang malinaw na pag-ugnayin ang dalawang magkatulad na pagtanggi.
