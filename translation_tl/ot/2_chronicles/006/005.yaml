revisions:
- from: Mula nang ilabas ko ang aking bayan mula sa lupain ng Ehipto,[a] hindi ako pumili ng isang lungsod mula sa alinman sa mga lipi ng Israel upang magtayo ng isang bahay[b] na kinaroroonan ng aking pangalan; at hindi rin ako pumili ng isang lalaki upang maging pinuno[c] ng aking bayang Israel.
  to: Mula nang ilabas ko ang aking bayan mula sa lupain ng Ehipto,[a] hindi ako pumili ng isang lungsod mula sa alinman sa mga lipi ng Israel upang magtayo roon ng isang bahay,[b] upang ang aking pangalan ay naroon; at hindi rin ako pumili ng isang lalaki upang maging pinuno[c] ng aking bayang Israel.
  rationale: Inayos ang sugnay na “upang ang aking pangalan ay naroon” upang tuwirang maipahayag ang לִהְיוֹת שְׁמִי שָׁם at maiwasang ikulong ang “doon” sa isang panuring ng “bahay.” Idinagdag ang “roon” sa “magtayo roon ng isang bahay” upang malinaw na ang bahay ay itinatayo sa piniling lungsod. Walang binagong kahulugan o doktrinal na pagpapakahulugan, at napanatili ang mga umiiral na talababa at ang kanilang mga pananda.
