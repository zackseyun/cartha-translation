base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/017.yaml
  text: Now[a], Yahweh, God of Israel, let your word that you spoke to your servant David be confirmed.
translation:
  language: tl
  text: Ngayon, Yahweh, Diyos ng Israel, mapagtibay nawa[a] ang iyong salita na sinabi mo sa iyong lingkod na si David.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “maitatag nawa ang iyong pangako” o “mapatunayang totoo ang iyong salita.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Ngayon
  rationale: Likas na panandang temporal at pandiskurso sa Filipino; hindi kailangang idagdag ang “at” upang ipakilala ang kasunod na pakiusap.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang transliterasyon ng banal na pangalang YHWH, sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Diyos ng Israel
  rationale: Malinaw at karaniwang anyo ng pariralang construct na kumikilala kay Yahweh bilang Diyos ng Israel.
- source_word: יֵאָמֵן
  choice: pagtibayin mo
  rationale: Ipinahahayag ng Niphal ng אמן ang kahilingang maging matatag o mapatunayang totoo ang sinabi ng Diyos. Ang pandiwang pakiusap na “pagtibayin mo” ay natural sa Filipino at angkop sa konteksto ng panalangin.
- source_word: דְּבָרְךָ
  choice: ang iyong salita
  rationale: Pinananatili ang literal na “salita”; bagaman tumutukoy ito sa isang pangako, hindi ipinapasok sa pangngalan ang interpretasyong ipinahihiwatig lamang ng konteksto.
- source_word: אֲשֶׁר דִּבַּרְתָּ
  choice: na sinabi mo
  rationale: Natural na sugnay na panumbalik sa Filipino at pinananatili ang ugnayang leksikal sa pagsasalita, sa halip na gawing “ipinangako mo.”
- source_word: לְעַבְדְּךָ
  choice: sa iyong lingkod
  rationale: Ang ל kasunod ng דבר ay tumutukoy sa pinagsabihan; “lingkod” ang marangal at angkop na katumbas sa kontekstong maharlika at tipanan.
- source_word: לְדָוִיד
  choice: na si David
  rationale: Ginagamit ang personal marker na “si” ayon sa likas na balarila ng Filipino, kasunod ng “iyong lingkod.”
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; ang PANGINOON
  rationale: Pangalan mismo ang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang personal at pangtipanang pangalan sa halip na palitan ito ng titulo.
- issue: Kung isasalin ang דְּבָרְךָ bilang “pangako”
  choice: ang iyong salita
  alternative: ang iyong pangako
  rationale: Tumpak sa konteksto ang “pangako,” ngunit mas direktang kumakatawan ang “salita” sa Hebreo at pinananatili ang puwang sa pagitan ng leksikal na kahulugan at ng kontekstuwal na bisa nito.
- issue: Diwa ng יֵאָמֵן
  choice: pagtibayin mo
  alternative: matupad; mapatunayang totoo
  rationale: Inilalarawan ng anyo ang pagiging matatag, tiyak, o napatunayang totoo ng salita. Ang “pagtibayin mo” ay nagpapanatili sa kahilingang ito nang hindi nililimitahan ang kahulugan sa katuparan lamang.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino para sa panalangin. Pinanatili ang pangalang Yahweh at ang literal na “salita,” habang ginawang natural sa Filipino ang pakiusap. Inilagay ang talababa pagkatapos ng buong pangungusap sapagkat nagpapaliwanag ito sa pariralang sentral ng kahilingan.
