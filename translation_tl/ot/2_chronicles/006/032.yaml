id: 2CH.6.32
reference: 2 Chronicles 6:32
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/גַ֣ם אֶל הַ/נָּכְרִ֗י אֲ֠שֶׁר לֹ֥א מֵ/עַמְּ/ךָ֣ יִשְׂרָאֵל֮ הוּא֒ וּ/בָ֣א מֵ/אֶ֣רֶץ רְחוֹקָ֗ה לְמַ֨עַן שִׁמְ/ךָ֤ הַ/גָּדוֹל֙ וְ/יָדְ/ךָ֣ הַ/חֲזָקָ֔ה וּֽ/זְרֽוֹעֲ/ךָ֖ הַ/נְּטוּיָ֑ה וּ/בָ֥אוּ וְ/הִֽתְפַּלְל֖וּ אֶל הַ/בַּ֥יִת הַ/זֶּֽה־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/032.yaml
  text: And also concerning the foreigner[a], who is not from your people Israel, but comes from a distant land because of your great name and your mighty hand and your outstretched arm, when they come and pray toward this house[b],
translation:
  language: tl
  text: Gayundin, tungkol sa dayuhang hindi kabilang sa iyong bayang Israel at dumarating mula sa malayong lupain dahil sa iyong dakilang pangalan, sa iyong makapangyarihang kamay, at sa iyong nakaunat na bisig—kapag dumating sila[a] at manalangin nang nakaharap sa bahay na ito[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, isahan muna ang “dayuhan” at “dumarating,” ngunit nagiging maramihan ang “dumating sila at manalangin.” Malamang na kumakatawan ang isang dayuhan sa pangkalahatang kaso.
    reason: alternative_reading
  - marker: b
    text: Maaari ring isalin nang mas literal na “manalangin patungo sa bahay na ito.” Sa konteksto, ang diwa ay pananalangin habang nakaharap sa templo.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנָּכְרִי
  choice: ang dayuhan
  rationale: Tumutukoy ito sa taong mula sa ibang bayan at hindi kabilang sa Israel. Likas at malinaw sa makabagong Filipino ang “dayuhan,” samantalang maaaring mangahulugan lamang ng hindi kakilala ang “estranghero.”
- source_word: אֲשֶׁר לֹא מֵעַמְּךָ יִשְׂרָאֵל הוּא
  choice: hindi kabilang sa iyong bayang Israel
  rationale: Malinaw nitong pinananatili ang pagkakaiba ng dayuhan at ng Israel bilang bayan ng Diyos, sa natural na ayos ng Filipino.
- source_word: וּבָא מֵאֶרֶץ רְחוֹקָה
  choice: kundi nagmula sa malayong lupain
  rationale: Ang “kundi” ay likas na kasunod ng negatibong paglalarawan, at tapat na inilalarawan ng “malayong lupain” ang אֶרֶץ רְחוֹקָה.
- source_word: לְמַעַן שִׁמְךָ הַגָּדוֹל
  choice: dahil sa iyong dakilang pangalan
  rationale: Ipinahihiwatig ng parirala ang dahilan ng paglapit ng dayuhan. Pinananatili ng “dakilang pangalan” ang biblikal na idyoma ng pagkakakilanlan at kabantugan ng Diyos.
- source_word: וְיָדְךָ הַחֲזָקָה
  choice: sa iyong makapangyarihang kamay
  rationale: Pinananatili nito ang kongkretong larawang tumutukoy sa makapangyarihang pagkilos ng Diyos.
- source_word: וּזְרוֹעֲךָ הַנְּטוּיָה
  choice: at sa iyong nakaunat na bisig
  rationale: Tapat nitong pinananatili ang karaniwang biblikal na larawang antropomorpiko para sa kapangyarihan ng Diyos na kumikilos.
- source_word: וּבָאוּ וְהִתְפַּלְלוּ
  choice: kapag dumating sila at manalangin
  rationale: Pinananatili ang paglipat ng Hebreo mula sa isahang kinatawang “dayuhan” tungo sa maramihang mga pandiwa, at maayos nitong inihahanda ang pagpapatuloy ng panalangin sa susunod na talata.
- source_word: אֶל הַבַּיִת הַזֶּה
  choice: nang nakaharap sa bahay na ito
  rationale: Sa konteksto ng panalangin sa templo, direksiyon ang diwa ng אֶל. Nililinaw ng “nang nakaharap” ang direksiyong iyon, habang pinananatili ng “bahay” ang literal at teolohikal na katawagan sa Hebreo.
theological_decisions:
- issue: Paglipat mula sa isahang “dayuhan” tungo sa maramihang mga pandiwa
  choice: Panatilihin ang isahang “dayuhan” at pagkatapos ay ang maramihang “sila.”
  alternative: 'Gawing pawang isahan: “kapag dumating siya at manalangin”; o pawang maramihan: “mga dayuhan ... dumating sila.”'
  rationale: Talagang nagpapalit ng bilang ang Hebreo. Ang pagpapanatili nito, na may paliwanag sa talababa, ay hindi nagtatago sa anyo ng pinagmulang teksto at nagpapakitang maaaring kinakatawan ng isang dayuhan ang pangkalahatang kaso.
- issue: Antropomorpikong paglalarawan sa kapangyarihan ng Diyos
  choice: Panatilihin ang “makapangyarihang kamay” at “nakaunat na bisig.”
  alternative: Ibuod bilang “dakilang kapangyarihan.”
  rationale: Mahalaga ang kongkretong larawang ito sa wikang biblikal tungkol sa makapangyarihang pagliligtas at pagkilos ng Diyos; hindi ito dapat gawing abstrakto.
- issue: Direksiyon ng panalangin kaugnay ng bahay
  choice: Isalin bilang “manalangin nang nakaharap sa bahay na ito.”
  alternative: “Manalangin sa bahay na ito.”
  rationale: Maaaring literal na “sa/patungo sa” ang pang-ukol, ngunit sa konteksto ay pinakamalamang na tumutukoy ito sa pagharap sa templo habang nananalangin, hindi kinakailangang sa pagpasok o pananalangin sa loob nito.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “dayuhan” sa halip na “estranghero,” at pinanatili ang biblikal na “bahay” para sa templo pati ang mga larawang “kamay” at “bisig.” Ang hulihang kuwit ay sinadyang panatilihin sapagkat nagpapatuloy ang pangungusap sa susunod na talata.
