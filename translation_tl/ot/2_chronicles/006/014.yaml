reference: 2 Chronicles 6:14
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יֹּאמַ֗ר יְהוָ֞ה אֱלֹהֵ֤י יִשְׂרָאֵל֙ אֵין כָּמ֣וֹ/ךָ אֱלֹהִ֔ים בַּ/שָּׁמַ֖יִם וּ/בָ/אָ֑רֶץ שֹׁמֵ֤ר הַ/בְּרִית֙ וְֽ/הַ/חֶ֔סֶד לַ/עֲבָדֶ֕י/ךָ הַ/הֹלְכִ֥ים לְ/פָנֶ֖י/ךָ בְּ/כָל לִבָּֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/014.yaml
  text: And he said[a], “O Yahweh, God of Israel, there is no God like you in heaven or on earth, keeping the covenant and the steadfast love for your servants who walk before you with all their heart.”
translation:
  language: tl
  text: At sinabi niya, “O Yahweh, Diyos ng Israel, walang Diyos na tulad mo sa langit man o sa lupa. Tinutupad mo ang tipan at ipinakikita ang iyong tapat na pag-ibig[a] sa iyong mga lingkod na lumalakad sa iyong harapan nang buong puso.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “katapatan sa tipan.”
    reason: Ipinakikita ang alternatibong covenantal na diin ng חֶסֶד, na maaaring tumukoy sa matatag na katapatan sa tipan gayundin sa tapat na pag-ibig.
lexical_decisions:
- source_word: וַיֹּאמַר
  choice: At sinabi niya
  rationale: Pinananatili ang karaniwang daloy ng Hebreong salaysay nang hindi ipinapalagay ang mas tiyak na pagkakasunod-sunod ng panahon.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat sa Tagalog ang personal na pangalang יהוה sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Diyos ng Israel
  rationale: Likas at malinaw na katumbas sa Tagalog ng pariralang konstrukto na kumikilala kay Yahweh bilang Diyos ng Israel.
- source_word: אֵין כָּמוֹךָ אֱלֹהִים
  choice: walang Diyos na tulad mo
  rationale: Malinaw na ipinahahayag ang kawalan ng katulad ni Yahweh habang pinananatili ang karaniwang ayos ng pangungusap sa Tagalog.
- source_word: בַּשָּׁמַיִם וּבָאָרֶץ
  choice: sa langit man o sa lupa
  rationale: Ang “man … o” ay likas sa negatibong paghahambing sa Tagalog at ipinahihiwatig ang kabuuang saklaw ng langit at lupa.
- source_word: שֹׁמֵר הַבְּרִית
  choice: Tinutupad mo ang tipan
  rationale: Ang participle ay naglalarawan ng palagian at katangiang pagkilos ng Diyos; ang “tinutupad” ang natural na paraan sa Tagalog upang sabihin na nananatili siyang tapat sa tipan.
- source_word: וְהַחֶסֶד
  choice: at ipinakikita ang iyong tapat na pag-ibig
  rationale: Ipinahahayag ng חֶסֶד ang matatag na pag-ibig at katapatan sa ugnayang tipan. Ginawang tahasan ang pandiwang “ipinakikita” upang maging natural ang Tagalog nang hindi binabago ang diwa.
- source_word: לַעֲבָדֶיךָ
  choice: sa iyong mga lingkod
  rationale: Ang “mga lingkod” ay angkop sa konteksto ng debosyon at paglilingkod at hindi labis na nagdidiin sa kalagayang alipin.
- source_word: הַהֹלְכִים לְפָנֶיךָ
  choice: na lumalakad sa iyong harapan
  rationale: Pinananatili ang Hebreong talinghaga ng paglakad bilang paraan ng pamumuhay at ang diwa ng pamumuhay sa presensiya ng Diyos.
- source_word: בְּכָל לִבָּם
  choice: nang buong puso
  rationale: Natural na idyomang Tagalog para sa lubos at hindi nahahating katapatan; naipahihiwatig na tumutukoy ito sa bawat lingkod.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יהוה
  choice: Yahweh
  alternative: Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo, kaya pinananatili ito sa transliterasyong “Yahweh” sa halip na palitan ng isang titulo.
- issue: Saklaw ng kahulugang חֶסֶד sa konteksto ng tipan
  choice: tapat na pag-ibig
  alternative: katapatan sa tipan
  rationale: Pinananatili ng “tapat na pag-ibig” ang parehong dimensiyon ng pagmamahal at matatag na katapatan. Inilalagay sa talababa ang mas tahasang pagbasa ukol sa tipan upang hindi paliitin ang mayamang saklaw ng salita.
- issue: Kahulugan ng paglakad sa harapan ng Diyos
  choice: lumalakad sa iyong harapan
  alternative: namumuhay sa iyong presensiya
  rationale: Pinananatili ang talinghaga at ang teolohikal na diwa ng tapat na pamumuhay sa harapan ng Diyos nang hindi ito ginagawang isang mas tiyak na doktrinal na pormulasyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang pangalang Yahweh at ang talinghaga ng “paglakad sa iyong harapan,” habang ginawang natural sa Tagalog ang pahayag tungkol sa pagtupad sa tipan.
