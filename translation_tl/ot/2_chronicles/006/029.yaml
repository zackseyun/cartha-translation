  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: כָּל תְּפִלָּ֣ה כָל תְּחִנָּ֗ה אֲשֶׁ֤ר יִהְיֶה֙ לְ/כָל הָ֣/אָדָ֔ם וּ/לְ/כֹ֖ל עַמְּ/ךָ֣ יִשְׂרָאֵ֑ל אֲשֶׁ֣ר יֵדְע֗וּ אִ֤ישׁ נִגְע/וֹ֙ וּ/מַכְאֹב֔/וֹ וּ/פָרַ֥שׂ כַּפָּ֖י/ו אֶל הַ/בַּ֥יִת הַ/זֶּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/029.yaml
  text: whatever prayer[a], whatever plea may be made by any man or by all your people Israel, each knowing his own affliction and his own pain, and spreading out his hands toward this house—
translation:
  language: tl
  text: Anumang panalangin, anumang pagsusumamo na maihain ng sinumang tao[a] o ng buong bayan mong Israel—kapag alam ng bawat isa ang sarili niyang kapighatian at kirot, at iniunat ang kaniyang mga kamay patungo sa bahay na ito—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, ang אָדָם ay anyong isahan na ginagamit dito sa pangkalahatang diwa; maaari rin itong isalin na “sinumang tao.”
    reason: Nililinaw ang generic na gamit ng אָדָם nang hindi ipinapalagay na lalaki lamang ang tinutukoy.
lexical_decisions:
- source_word: כָּל תְּפִלָּה
  choice: anumang panalangin
  rationale: Ang כָּל ay komprehensibo at di-tiyak dito; natural na ipinahahayag ito ng “anumang,” habang pinananatili ng “panalangin” ang tuwirang kahulugan ng תְּפִלָּה.
- source_word: כָל תְּחִנָּה
  choice: anumang pagsusumamo
  rationale: Ang תְּחִנָּה ay taimtim na paghingi ng awa o pabor. Ang pag-uulit ng “anumang” ay sumasalamin sa pag-uulit ng כָּל.
- source_word: אֲשֶׁר יִהְיֶה
  choice: na ihandog
  rationale: Sa konteksto, tumutukoy ito sa panalanging maaaring maganap o ialay. Ang “ihandog” ay likas sa Filipino at hindi nililimitahan ang uri ng panalangin.
- source_word: לְכָל הָאָדָם
  choice: ng sinumang tao
  rationale: Generic ang singular na אָדָם at tumutukoy sa sinumang indibidwal. Mas malinaw at likas sa modernong Tagalog ang “tao” kaysa “lalaki,” nang hindi binabago ang saklaw ng Hebreo.
- source_word: וּלְכֹל עַמְּךָ יִשְׂרָאֵל
  choice: o ng buong bayan mong Israel
  rationale: Pinalalawak ng parirala ang saklaw mula sa isang indibidwal tungo sa buong Israel. Ang “o” ay nagpapakita ng alternatibong indibidwal-kolektibong saklaw, at ang “buong” ay kumakatawan sa כֹל.
- source_word: אֲשֶׁר יֵדְעוּ אִישׁ
  choice: kapag batid ng bawat isa
  rationale: 'Distributibo ang אִישׁ: bawat taong nananalangin ay nakakikilala sa sarili niyang dinaranas. Pinananatili ng “kapag” ang bukas na ugnayan ng relative clause nang hindi ito tahasang ginagawang sanhi.'
- source_word: נִגְעוֹ
  choice: sarili niyang salot
  rationale: Maaaring mangahulugan ang נֶגַע ng salot, hampas, o kapighatian. Pinananatili ng “salot” ang mas kongkreto at matinding larawan ng salitang Hebreo at ang pagkakaugnay nito sa mga salot sa naunang konteksto, nang hindi kinakailangang tumukoy lamang sa epidemya.
- source_word: וּמַכְאֹבוֹ
  choice: at kirot
  rationale: Ang מַכְאוֹב ay sakit o pagdurusa. Ang “kirot” ay nagtatangi rito mula sa “salot” at nagpapahayag ng pansariling danas ng sakit; saklaw ng naunang “sarili niyang” ang dalawang magkaugnay na pangngalan.
- source_word: וּפָרַשׂ כַּפָּיו
  choice: at iniunat niya ang kanyang mga kamay
  rationale: Ang פרשׂ כפים ay kilos ng pagbubukas o pag-uunat ng mga palad sa pananalangin. Ang “iniunat ... ang mga kamay” ay dignified at malinaw na modernong Tagalog.
- source_word: אֶל הַבַּיִת הַזֶּה
  choice: patungo sa templong ito
  rationale: Ipinahihiwatig ng אֶל ang direksiyon ng pagharap sa panalangin. Bagaman literal na “bahay,” ang tinutukoy rito ay ang templong inilaan ni Solomon, kaya malinaw at natural ang “templo.”
theological_decisions:
- issue: Generic na gamit ng הָאָדָם
  choice: tao
  alternative: lalaki
  rationale: Generic at representative ang אָדָם, hindi isang pagtukoy sa kasariang lalaki. Sa modernong Tagalog, “tao” ang tumpak na generic na katumbas; ang “lalaki” ay maaaring maling magpaliit sa saklaw.
- issue: Saklaw ng נֶגַע
  choice: salot
  alternative: kapighatian
  rationale: Pinananatili ng “salot” ang kongkreto at maaaring panlabas na paghampas na taglay ng נֶגַע, samantalang ang kasunod na “kirot” ang nagsasaad ng pansariling sakit. Hindi tinutukoy ng salin kung sakit, kapahamakan, o ibang uri ng paghampas ang eksaktong nasa isip.
- issue: Pagkilala sa הַבַּיִת bilang templo
  choice: templong ito
  alternative: bahay na ito
  rationale: Sa konteksto ng panalangin ng pagtatalaga, malinaw na ang “bahay” ay ang templo. Ang “templo” ay contextually explicit ngunit hindi nagdaragdag ng denominasyonal na interpretasyon.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at angkop sa pampublikong pagbasa. Pinanatili ang patulang pag-uulit ng “anumang,” ang indibidwal-kolektibong saklaw, at ang nakabiting sintaks ng talata sa pamamagitan ng em dash dahil nagpapatuloy ang pangungusap sa susunod na talata.
