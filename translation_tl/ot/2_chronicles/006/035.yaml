  yaml_path: translation/ot/2_chronicles/006/035.yaml
  text: then hear from heaven their prayer and their plea for favor[a], and maintain their cause.
translation:
  language: tl
  text: kung magkagayon, dinggin mo mula sa langit ang kanilang panalangin at ang kanilang pagsusumamo, at igawad mo sa kanila ang katarungan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ipagtanggol mo ang kanilang usapin” o “pairalin mo ang hatol para sa kanila.” Literal sa Hebreo, “gawin mo ang kanilang katarungan/hatol.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמַעְתָּ
  choice: kung magkagayon, dinggin mo
  rationale: Ang Qal perfect na 2ms ay nasa konteksto ng panalangin at gumaganap bilang pakiusap sa Diyos. Ipinahihiwatig ng “kung magkagayon” ang ugnayan nito sa naunang kondisyong binanggit sa talata 34.
- source_word: מִן הַשָּׁמַיִם
  choice: mula sa langit
  rationale: Bagaman anyong maramihan ang Hebreo, karaniwang tumutukoy ang הַשָּׁמַיִם sa langit bilang tahanan ng Diyos; natural sa Filipino ang isahan.
- source_word: תְּפִלָּתָם
  choice: ang kanilang panalangin
  rationale: Ang תְּפִלָּה ay pangkalahatang salita para sa panalangin, at kolektibo ang isahang pangngalan na may hulaping 3mp.
- source_word: תְּחִנָּתָם
  choice: ang kanilang pagsusumamo
  rationale: Ang תְּחִנָּה ay taimtim na pakiusap para sa awa o lingap. Malinaw at marangal sa modernong Filipino ang “pagsusumamo.”
- source_word: וְעָשִׂיתָ מִשְׁפָּטָם
  choice: at igawad mo sa kanila ang katarungan
  rationale: Literal itong “gawin ang kanilang hatol/katarungan.” Sa konteksto, hinihiling na kumilos ang Diyos bilang hukom para sa kanila. Pinananatili ng salin ang legal na diwa nang hindi ipinapalagay na sila ay awtomatikong papanigan anuman ang nararapat na hatol.
theological_decisions:
- issue: Ang kahulugan ng pagkilos ng Diyos sa wikang panghukuman
  choice: igawad mo sa kanila ang katarungan
  alternative: ipagtanggol mo ang kanilang usapin; pairalin mo ang hatol para sa kanila
  rationale: Maaaring tumukoy ang מִשְׁפָּט sa hatol, katarungan, karapatan, o usapin. Ang “igawad mo sa kanila ang katarungan” ay nagpapanatili sa panghukumang lawak ng salita at hindi tahasang nagpapakahulugang papanigan sila ng Diyos kahit hindi makatarungan ang kanilang ipinaglalaban.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “dinggin” bilang likas na pananalita sa taimtim na panalangin at ang “pagsusumamo” upang maipakita ang masidhing paghingi ng awa o lingap. Inilagay ang talababa sa sugnay na may tunay na leksikal na kalabuan.
