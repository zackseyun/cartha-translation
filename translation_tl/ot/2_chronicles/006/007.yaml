base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/007.yaml
  text: It was in the heart of David my father to build a house for the name of Yahweh[b][a], the God of Israel.
translation:
  language: tl
  text: Nasa puso ng aking amang si David ang magtayo ng isang bahay para sa pangalan ni Yahweh[a], ang Diyos ng Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “isang bahay para sa pangalan ni Yahweh,” isang karaniwang pananalita para sa templo bilang lugar na kaugnay ng pangalan ng Diyos.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Nasa
  rationale: Kasama ng kasunod na pariralang עִם לְבַב, inilalahad nito ang isang kalagayan sa nakaraan. Hindi na kailangan ng hiwalay na panandang gaya ng “At nangyari” sa natural na Tagalog.
- source_word: עִם לְבַב
  choice: puso ng
  rationale: Ang idyoma ay tumutukoy sa hangarin o layuning nasa kalooban ng isang tao. Pinananatili ng “nasa puso” ang larawang Hebreo nang hindi ito nililimitahan sa intelektuwal na “isip.”
- source_word: דָּוִיד אָבִי
  choice: aking amang si David
  rationale: Ito ang natural at marangal na ayos sa modernong Tagalog para sa “David na aking ama.”
- source_word: לִבְנוֹת
  choice: magtayo
  rationale: Karaniwang katumbas ito ng pagtatayo ng isang gusali at natural sa konteksto.
- source_word: בַּיִת
  choice: isang bahay
  rationale: Bagaman templo ang tinutukoy, literal na “bahay” ang salitang Hebreo. Pinananatili nito ang mahalagang biblikal na katawagan sa templo.
- source_word: לְשֵׁם
  choice: para sa pangalan ni
  rationale: Pinananatili nito ang teolohikal na pormulang Hebreo tungkol sa bahay na iuugnay sa pangalan ng Diyos, sa halip na ipakahulugang “para sa karangalan.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin bilang transliterasyon ng personal na pangalang banal sa tekstong Hebreo, hindi bilang isang titulo.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ang Diyos ng Israel
  rationale: Natural at tuwirang katumbas ng pariralang konstruktong Hebreo.
theological_decisions:
- issue: Ang pariralang pangtemplo na בַּיִת לְשֵׁם יְהוָה
  choice: isang bahay para sa pangalan ni Yahweh
  alternative: isang templo para kay Yahweh
  rationale: Pinananatili ng napiling salin ang “bahay” at “pangalan,” na kapuwa may teolohikal na bigat sa Cronica at naglalarawan sa kaugnayan ng templo sa pangalan at presensiya ng Diyos nang hindi ito pinapasimple.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang Hebreong larawang “nasa puso” at ang pormulang “bahay para sa pangalan” upang hindi mawala ang kanilang teolohikal na saysay.
