  - severity: medium
    issue: Hindi likas ang “gumawa kami ng baluktot.”
    rationale: Bagaman sinusubukan nitong panatilihin ang imahen ng pagbaluktot, hindi ito karaniwang Filipino para sa moral na pagtatapat. “Gumawa kami ng kabaluktutan” ay mas malinaw at marangal.
