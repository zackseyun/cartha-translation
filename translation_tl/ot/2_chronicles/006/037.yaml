  source_fidelity: 'Tumpak ang pangunahing daloy ng talata: pagkilala sa kalagayan sa pagkabihag, pagbabalik, taimtim na pagsusumamo, at tatluhang pagtatapat. Gayunman, ang “pinagdalan sa kanila” ay mali ang anyo at hindi malinaw; kailangan itong gawing malinaw na sila ang dinalang bihag. Ang “gumawa kami ng baluktot” ay hindi likas na Filipino para sa moral na kahulugan ng הֶעֱוִינוּ.'
  naturalness: May ilang matibay na pagpili, gaya ng “natauhan sila” at “nagsumamo sa iyo.” Ngunit hindi natural ang “sa lupaing pinagdalan sa kanila bilang mga bihag” at “gumawa kami ng baluktot.” Ang rebisyon ay gumagamit ng malinaw, modernong Filipino habang pinananatili ang marangal na rehistro.
  terminology: Ang “lupain ng kanilang pagkabihag,” “nagkasala,” at “nagsumamo” ay angkop. Ang “bumalik” ay mas payak at mas natural kaysa “nanumbalik,” at pinananatili nito ang saklaw ng שׁוּב nang hindi sapilitang ginagawang teknikal na “magsisi.” Ang “gumawa kami ng kabaluktutan” at “nagpakasama kami” ay nagpapakita ng magkahiwalay ngunit papatinding puwersa ng huling dalawang pandiwa.
  issues:
