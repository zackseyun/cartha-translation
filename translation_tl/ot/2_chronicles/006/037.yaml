  text: וְ/הֵשִׁ֨יבוּ֙ אֶל לְבָבָ֔/ם בָּ/אָ֖רֶץ אֲשֶׁ֣ר נִשְׁבּוּ שָׁ֑ם וְ/שָׁ֣בוּ וְ/הִֽתְחַנְּנ֣וּ אֵלֶ֗י/ךָ בְּ/אֶ֤רֶץ שִׁבְיָ/ם֙ לֵ/אמֹ֔ר חָטָ֥אנוּ הֶעֱוִ֖ינוּ וְ/רָשָֽׁעְנוּ־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/037.yaml
  text: and if they come to their senses in the land where they were taken captive[a], and turn back and plead with you in the land of their captivity, saying, ‘We have sinned, we have acted perversely, and we have acted wickedly,’
translation:
  language: tl
  text: at kapag natauhan sila sa lupain kung saan sila dinalang bihag[a], at bumalik at nagsumamo sa iyo sa lupain ng kanilang pagkabihag, na sinasabi, ‘Nagkasala kami, gumawa kami ng kabaluktutan, at nagpakasama kami,’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “ibinalik nila sa kanilang puso,” isang idyomang tumutukoy sa malalim na pagninilay o pagsasapuso.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵשִׁיבוּ אֶל־לְבָבָם
  choice: natauhan sila
  rationale: Likas na idyomang Filipino para sa pagkilala at malalim na pagbabalik-isip; ipinapaliwanag sa talababa ang literal na larawang Hebreo ng pagbabalik sa puso.
- source_word: בָּאָרֶץ אֲשֶׁר נִשְׁבּוּ שָׁם
  choice: sa lupaing pinagdalan sa kanila bilang mga bihag
  rationale: 'Malinaw na ipinahahayag ang Niphal ng נשבה: sila ay dinala roon bilang mga bihag.'
- source_word: וְשָׁבוּ
  choice: nanumbalik
  rationale: Pinananatili ang saklaw ng שׁוּב bilang pagbabalik o pagtalikod mula sa maling landas, nang hindi ito nililimitahan sa tahasang terminong doktrinal na ‘nagsisi.’
- source_word: וְהִתְחַנְּנוּ אֵלֶיךָ
  choice: nagsumamo sa iyo
  rationale: Ang ‘nagsumamo’ ay dignificado at natural na katumbas ng taimtim na paghingi ng awa o pabor.
- source_word: בְּאֶרֶץ שִׁבְיָם
  choice: sa lupain ng kanilang pagkabihag
  rationale: Malapit sa konkretong kahulugan ng שְׁבִי at angkop sa konteksto ng sapilitang pagkadalang-bihag.
- source_word: לֵאמֹר
  choice: na sinasabi
  rationale: Karaniwang panandang panipi na nagpapakilala sa nilalaman ng kanilang pagtatapat.
- source_word: חָטָאנוּ
  choice: Nagkasala kami
  rationale: Tuwiran at karaniwang salin ng pormula ng pagtatapat.
- source_word: הֶעֱוִינוּ
  choice: gumawa kami ng baluktot
  rationale: Pinananatili ang larawang moral ng עוה—pagkabaluktot o paglihis—sa halip na palitan lamang ng pangkalahatang ‘gumawa ng mali.’
- source_word: וְרָשָׁעְנוּ
  choice: kumilos kami nang masama
  rationale: Pinananatili ang pandiwang puwersa at ang papatinding tatluhang pagtatapat.
theological_decisions:
- issue: Wika ng pagsisisi sa konteksto ng pagkabihag
  choice: Isinalin ang שׁוּב bilang ‘nanumbalik.’
  alternative: ‘bumalik’ o ‘nagsisi’
  rationale: Ang ‘nanumbalik’ ay nagpapahiwatig ng pagbabalik-loob ngunit hindi inaalis ang posibleng literal at espirituwal na saklaw ng salitang Hebreo.
translation_notes:
  register: Modernong Filipino na dignificado at madaling maunawaan. Ginamit ang ‘natauhan’ bilang likas na idyoma, habang pinanatili sa talababa ang larawang Hebreo. Ang ‘nanumbalik’ ay sadyang nagpapanatili sa ugnayan ng pagbabalik at pagsisisi.
