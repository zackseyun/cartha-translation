base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/017.yaml
  text: For many in the assembly had not sanctified themselves[a], and the Levites were over the slaughter of the Passover lambs for everyone who was not clean[c][b], to consecrate them to Yahweh.
translation:
  language: tl
  text: Sapagkat marami sa kapulungan ang hindi pa nagpakabanal[a], kaya ang mga Levita ang namahala sa pagkatay ng mga handog na pampaskuwa[b] para sa lahat ng hindi malinis ayon sa ritwal[c], upang maitalaga kay Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “hindi pa nagtalaga ng kanilang sarili.” Gumagamit ang Hebreo ng wika ng kabanalan o pagtatalaga, bagaman ritwal na paglilinis ang agarang usapin.
    reason: lexical_alternative
  - marker: b
    text: Literal na “mga Paskuwa”; iyon ay, ang mga hayop na inihahandog sa Paskuwa.
    reason: lexical_alternative
  - marker: c
    text: O “para sa lahat ng marumi.” Ang tinutukoy ay pagiging marumi ayon sa ritwal.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַבַּת בַּקָּהָל
  choice: marami sa kapulungan
  rationale: Ipinapahayag nito ang malaking bilang ng mga tao sa nagkakatipong sambayanan; natural at marangal sa modernong Tagalog ang “kapulungan.”
- source_word: הִתְקַדָּשׁוּ
  choice: hindi pa nakapaglaan ng kanilang sarili bilang banal
  rationale: Pinananatili nito ang wika ng kabanalan at pagtatalaga ng hitpael ng קדשׁ, nang hindi ito pinapaliit sa paglilinis lamang.
- source_word: הַלְוִיִּם
  choice: ang mga Levita
  rationale: Karaniwang katawagan sa Tagalog para sa pangkat na pantribo at panseremonya.
- source_word: עַל שְׁחִיטַת
  choice: ang namahala sa pagkatay
  rationale: Sa konteksto, ang עַל ay nagpapahiwatig ng pananagutan sa gawain; malinaw at natural ang “namahala,” habang ang “pagkatay” ay tumutukoy sa ritwal na pagpatay sa handog.
- source_word: הַפְּסָחִים
  choice: mga handog na pampaskuwa
  rationale: Literal itong maramihang “mga Paskuwa,” ngunit sa konteksto ay tumutukoy sa mga hayop na inihahandog sa Paskuwa; hindi nililimitahan ng salin sa “mga kordero” ang maaaring tukuyin.
- source_word: לְכֹל לֹא טָהוֹר
  choice: para sa lahat ng hindi malinis ayon sa ritwal
  rationale: Nililinaw ang seremonyal na kahulugan ng טָהוֹר upang hindi mapagkamalang karaniwang pisikal na kalinisan.
- source_word: לְהַקְדִּישׁ לַיהוָה
  choice: upang italaga ang mga iyon kay Yahweh
  rationale: Ang “italaga” ay natural na panseremonyang katumbas ng קדשׁ. Ipinahihiwatig ng “mga iyon” na ang pinakamalapit na tinutukoy ay ang mga handog, habang kinikilala sa talababa ang kawalan ng tahasang layon sa Hebreo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos na kinakatawan ng Tetragrammaton.
theological_decisions:
- issue: Wika ng kabanalan sa קדשׁ sa konteksto ng Paskuwa
  choice: Panatilihin ang konsepto ng paglalaan bilang banal sa unang gamit at pagtatalaga sa ikalawang gamit.
  alternative: Isalin ang una bilang “nakapaglinis ng kanilang sarili” at ang ikalawa bilang “gawing banal.”
  rationale: Bagaman ritwal na kalinisan ang agarang usapin, ang ugat na קדשׁ ay may kahulugan ng kabanalan at pagtatalaga; dapat panatilihin ang pagkakaiba ng kadalisayan at kabanalan.
- issue: Hindi tahasang layon ng לְהַקְדִּישׁ
  choice: Unawain ang ipinahihiwatig na layon bilang mga handog na pampaskuwa.
  alternative: Unawain ang layon bilang mga taong hindi malinis.
  rationale: Walang nakasaad na layon sa Hebreo. Ang mga handog ang pinakamalapit na posibleng tinutukoy at akma sa pagkatay ng mga Levita, ngunit pinananatili sa talababa ang tunay na kalabuan.
- issue: Ugnayan ng dalawang sugnay
  choice: Gamitin ang “kaya” upang natural na ipakita ang bunga ng hindi pagiging handa ng marami.
  alternative: Gamitin ang payak na “at,” gaya ng waw sa Hebreo.
  rationale: Sa salaysay, ipinapaliwanag ng unang sugnay kung bakit ang mga Levita ang gumawa ng pagkatay; ang “kaya” ay natural na naghahayag ng ugnayang iyon nang hindi nagdaragdag ng bagong pangyayari.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “kapulungan,” “mga Levita,” at “handog na pampaskuwa” bilang malinaw na bokabularyong panseremonya. Ang lahat ng marker na [a], [b], at [c] ay nasa pangunahing teksto.
