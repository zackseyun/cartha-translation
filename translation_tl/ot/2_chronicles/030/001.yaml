reference: 2 Chronicles 30:1
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יִּשְׁלַ֨ח יְחִזְקִיָּ֜הוּ עַל כָּל יִשְׂרָאֵ֣ל וִֽ/יהוּדָ֗ה וְ/גַֽם אִגְּרוֹת֙ כָּתַב֙ עַל אֶפְרַ֣יִם וּ/מְנַשֶּׁ֔ה לָ/ב֥וֹא לְ/בֵית יְהוָ֖ה בִּֽ/ירוּשָׁלִָ֑ם לַ/עֲשׂ֣וֹת פֶּ֔סַח לַ/יהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/001.yaml
  text: Then Hezekiah sent word to all Israel and Judah[a], and also wrote letters to Ephraim and Manasseh, to come to the house of Yahweh in Jerusalem to keep the Passover to Yahweh[c][b], the God of Israel.
translation:
  language: tl
  text: Pagkatapos, nagpadala si Hezekias ng mensahe sa buong Israel at Juda[a]. Sumulat din siya ng mga liham sa Efraim at Manases, na hinihimok silang pumunta sa bahay ni Yahweh sa Jerusalem upang ipagdiwang ang Paskuwa para kay Yahweh[b], ang Diyos ng Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “sa lahat ng Israel at Juda.” Maaaring tukuyin ng pang-ukol sa Hebreo kapuwa ang mga pinadalhan at ang malawak na lugar na inabot ng mensahe.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “upang gawin ang Paskuwa para kay Yahweh.” Ang “gawin ang Paskuwa” ay idyomang nangangahulugang ganapin o ipagdiwang ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח ... עַל כָּל יִשְׂרָאֵל וִיהוּדָה
  choice: nagpadala ... ng mensahe sa buong Israel at Juda
  rationale: Ang pandiwa ay literal na ‘nagpadala,’ ngunit ipinahihiwatig ng konteksto ang pagpapadala ng mensahe o panawagan. Ang ‘sa buong’ ay likas sa Filipino at naipahahayag ang lawak ng pagpapadala, habang itinatala sa talababa ang posibleng tuwirang pagbasa.
- source_word: אִגְּרוֹת כָּתַב
  choice: sumulat ... ng mga liham
  rationale: Tuwiran at natural na katumbas ng nakasulat na pakikipag-ugnayan.
- source_word: עַל אֶפְרַיִם וּמְנַשֶּׁה
  choice: sa Efraim at Manases
  rationale: Sa kontekstong ito, ang pang-ukol ay tumutukoy sa mga pinagpadalhan o sa mga rehiyong pinatutunguhan ng mga liham.
- source_word: לָבוֹא
  choice: na hinihimok silang pumunta
  rationale: Ang infinitive ay nagpapahayag ng layunin ng mensahe at mga liham. Ginawang hayag ang ipinahihiwatig na panawagan upang maging malinaw at natural sa Filipino nang hindi nagdaragdag ng bagong nilalaman.
- source_word: לְבֵית יְהוָה
  choice: sa bahay ni Yahweh
  rationale: Pinananatili ang literal na larawang ‘bahay ni Yahweh’ sa halip na gawing ‘templo,’ bagaman iyon ang tinutukoy sa konteksto.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang personal na pangalang kinakatawan ng tetragrammaton sa tekstong Hebreo.
- source_word: לַעֲשׂוֹת פֶּסַח
  choice: upang ipagdiwang ang Paskuwa
  rationale: Ang literal na ‘gawin ang Paskuwa’ ay isang idyoma para sa pagganap o pagdiriwang ng kapistahan; ‘ipagdiwang’ ang malinaw at likas na katumbas sa modernong Filipino.
- source_word: לַיהוָה
  choice: para kay Yahweh
  rationale: Ipinahahayag nito na ang pagdiriwang ay ukol o iniaalay kay Yahweh, habang iniiwasan ang di-likas na pariralang ‘sa kay Yahweh.’
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ang Diyos ng Israel
  rationale: Tuwirang katumbas na nagpapanatili sa pagkakakilanlan ng Diyos kaugnay ng Israel.
theological_decisions:
- issue: Paglalarawan sa ugnayan ng Paskuwa kay Yahweh sa pariralang לַיהוָה
  choice: para kay Yahweh
  alternative: kay Yahweh / bilang parangal kay Yahweh
  rationale: Ang לְ ay maaaring magpahiwatig na ang pagdiriwang ay ukol o iniaalay kay Yahweh. Pinili ang ‘para kay Yahweh’ dahil natural ito at hindi nito dinaragdagan ang teksto ng mas tiyak na interpretasyong ‘bilang parangal.’
- issue: Pagsasalin sa pangalang יְהוָה
  choice: Yahweh
  alternative: ANG PANGINOON
  rationale: Nasa tekstong Hebreo ang personal na pangalang YHWH; pinananatili ng ‘Yahweh’ ang pagkakaiba nito sa isang titulong gaya ng ‘Panginoon.’
translation_notes:
  register: Modernong Filipino na malinaw at marangal ang himig. Pinanatili ang ‘bahay ni Yahweh’ upang manatiling malapit sa larawang Hebreo, at ginamit ang mga karaniwang anyong Tagalog na Hezekias, Juda, Efraim, Manases, at Paskuwa.
