base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/012.yaml
  text: Also in Judah the hand of God was on them to give them one heart to carry out the command of the king and the officials[a], according to the word of Yahweh.
translation:
  language: tl
  text: Sa Juda rin, ang kamay ng Diyos ay nasa kanila upang bigyan sila ng iisang puso[a] na tuparin ang utos ng hari at ng mga pinuno, ayon sa salita ni Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “pusong nagkakaisa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם בִּיהוּדָה
  choice: Sa Juda rin
  rationale: Pinananatili ng “rin” ang pandagdag na diwa ng גַּם, at likas na ipinahahayag ng “sa Juda” ang lokasyon.
- source_word: הָיְתָה יַד הָאֱלֹהִים
  choice: kumilos ang kamay ng Diyos
  rationale: Pinananatili ang larawang Hebreo ng “kamay ng Diyos” habang malinaw at natural na ipinahahayag sa Filipino ang aktibong pagkilos ng Diyos.
- source_word: לָתֵת לָהֶם
  choice: upang bigyan sila
  rationale: Tuwirang ipinahahayag ang layunin ng pagkilos ng Diyos nang hindi dinaragdagan ang kahulugan.
- source_word: לֵב אֶחָד
  choice: iisang puso
  rationale: Pinananatili ang literal na metapora ng Hebreo, na tumutukoy sa nagkakaisang kalooban o pasiya.
- source_word: לַעֲשׂוֹת מִצְוַת
  choice: na tuparin ang utos
  rationale: Ang “tuparin” ay malinaw na nagsasaad ng pagsasagawa o pagsunod sa isang utos.
- source_word: הַמֶּלֶךְ וְהַשָּׂרִים
  choice: ng hari at ng mga pinuno
  rationale: Ang “mga pinuno” ay malawak at likas na katumbas ng שָּׂרִים sa kontekstong pampamahalaan.
- source_word: בִּדְבַר יְהוָה
  choice: ayon sa salita ni Yahweh
  rationale: Ipinahahayag ng “ayon sa” na ang utos ay nakaayon sa salita ni Yahweh, sa halip na ipakahulugang instrumento lamang ang salita.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang personal na pangalan ng Diyos bilang transliterasyon ng Tetragrammaton.
theological_decisions:
- issue: Ang likas na katangian ng pagkilos ng Diyos sa pariralang “kamay ng Diyos”
  choice: Isinalin bilang aktibong pagkilos ng Diyos na nagbigay sa bayan ng iisang puso.
  alternative: Maaaring pahinain bilang simpleng pagtulong ng Diyos o palawakin bilang isang tiyak at di-mapipigilang mekanismo ng biyaya.
  rationale: Malinaw na iniuugnay ng Hebreo sa Diyos ang pagkakaisa ng kanilang kalooban, ngunit hindi nito ipinaliliwanag ang eksaktong mekanismo; kaya pinananatili ang pahayag at tensiyong teolohikal nang walang dagdag na doktrina.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang metaporang “kamay ng Diyos” at “iisang puso,” ngunit ginawang natural ang daloy sa pamamagitan ng pandiwang “kumilos.”
