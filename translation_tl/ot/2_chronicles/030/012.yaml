    issue: Hindi tahasang nasasalin ang “was on them” sa “kumilos ang kamay ng Diyos.”
    rationale: Bagaman ipinahihiwatig ng “kumilos” ang aktibong impluwensiya ng Diyos, mas malapit sa הָיְתָה יַד־הָאֱלֹהִים לָהֶם ang pagpapanatili ng relasyong “ang kamay ng Diyos ay nasa kanila,” at malinaw nitong tinutukoy ang mga taga-Juda bilang tumatanggap ng pagkilos.
  revised_text: Sa Juda rin, ang kamay ng Diyos ay nasa kanila upang bigyan sila ng iisang puso[a] na tuparin ang utos ng hari at ng mga pinuno, ayon sa salita ni Yahweh.
