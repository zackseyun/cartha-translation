  naturalness: Likas at marangal sa modernong Filipino ang “bawat isa na naghanda ng kanyang puso upang hanapin ang Diyos.” Ang pangwakas na pariralang “bagaman hindi ayon sa paglilinis na hinihingi para sa banal na lugar” ay pinananatili ang ellipsis at concessive na ugnayan ng Hebreo nang hindi nagpapahiwatig ng dahilan ng kakulangan.
  terminology: Ang “Yahweh,” “Diyos ng kanyang mga ninuno,” “paglilinis,” at “banal na lugar” ay angkop. Ang talababa sa “banal na lugar” ay wastong kumikilala sa posibleng “santuwaryo.”
