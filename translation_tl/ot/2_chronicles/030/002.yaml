base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/002.yaml
  text: Then the king and his officials and all the assembly in Jerusalem decided to keep the Passover in the second month[a].
translation:
  language: tl
  text: Nagpasya ang hari, ang kanyang mga opisyal, at ang buong kapulungan sa Jerusalem na ipagdiwang ang Paskuwa sa ikalawang buwan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּוָּעַץ
  choice: Nagpasya
  rationale: Ang Niphal ng יעץ sa konteksto ay tumutukoy sa sama-samang pagsangguni na humantong sa isang pasya. Likas sa modernong Filipino ang “nagpasya,” at ipinakikita ng maramihang paksa na magkakasama silang nagpasya.
- source_word: הַמֶּלֶךְ
  choice: ang hari
  rationale: Tuwirang salin ng tiyak na pangngalan; pinananatili ang titulong ginamit sa Hebreo sa halip na idagdag ang pangalang Hezekias.
- source_word: וְשָׂרָיו
  choice: ang kanyang mga opisyal
  rationale: Ang שָׂרִים ay mga pinuno o matataas na opisyal. Malinaw ang “mga opisyal” at hindi nito ipinahihiwatig na mga anak sila ng hari.
- source_word: וְכָל הַקָּהָל
  choice: at ang buong kapulungan
  rationale: Ang קָהָל ay ang nagkatipong pamayanan. Pinananatili ng “kapulungan” ang kolektibong diwa nang hindi nagdaragdag ng partikular na kahulugang pangdenominasyon.
- source_word: בִּירוּשָׁלִָם
  choice: sa Jerusalem
  rationale: Karaniwan at tuwirang lokatibong salin ng pangalan ng lugar.
- source_word: לַעֲשׂוֹת הַפֶּסַח
  choice: na ipagdiwang ang Paskuwa
  rationale: Literal itong “gawin ang Paskuwa,” isang idyoma para sa pagsasagawa ng kapistahan. Ang “ipagdiwang ang Paskuwa” ay natural sa Filipino at malinaw na tumutukoy sa aktuwal na pagdaraos nito.
- source_word: בַּחֹדֶשׁ הַשֵּׁנִי
  choice: sa ikalawang buwan
  rationale: Tuwirang temporal na salin; hindi nagdaragdag ng paliwanag na karaniwang ginaganap ang Paskuwa sa unang buwan.
theological_decisions:
- issue: Pagsasalin sa idyoma tungkol sa pagdaraos ng Paskuwa nang walang dagdag na interpretasyon
  choice: ipagdiwang ang Paskuwa
  alternative: ganapin ang Paskuwa; sundin ang Paskuwa; literal, gawin ang Paskuwa
  rationale: Tumutukoy ang Hebreong idyoma sa pagsasagawa ng pagdiriwang ng Paskuwa. Natural at malinaw ang “ipagdiwang” sa modernong Filipino, habang iniiwasan ang di-likas na literalismo at anumang dagdag na detalyeng wala sa talata.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at madaling maunawaan. Ginamit ang “kapulungan” para sa nagkatipong pamayanan at “mga opisyal” para sa mga pinunong nasa ilalim ng hari. Hindi kailangan ang talababa sapagkat malinaw na naihahatid sa teksto ang Hebreong idyoma.
