  source_fidelity: Tumpak na isinasalin ng “Ngayon” ang tahasang עַתָּה sa WLC; hindi dapat sundin ang English audit trail na nag-aalis nito. Maayos ding naipapahayag ang mga utos, ang larawan ng ‘matigas na batok,’ ang idyomang ‘ibigay ang kamay,’ ang pagpapabanal ng santuwaryo, at ang nilalayong resultang paglayo ng galit. Gayunman, ang ‘pumasok kayo sa’ ay mas tiyak kaysa sa בּוֹאוּ לְ, na pangunahing ‘pumarito/pumunta sa’; hindi tahasang sinasabi ng Hebreo ang pagpasok sa loob.
  naturalness: Marangal at malinaw ang Tagalog. Natural ang ‘patigasin ang inyong batok’ bilang sinadyang pagpapanatili ng Hebreong larawan, at sapat ang paliwanag sa talababa. Ang ‘Pumarito kayo sa kanyang santuwaryo’ ay mas tapat sa pandiwang Hebreo at nananatiling angkop sa rehistrong ito.
  terminology: Wastong ginagamit ang ‘Yahweh,’ ‘santuwaryo,’ ‘Diyos,’ at ‘nag-aalab na galit.’ Katanggap-tanggap ang ‘mga ninuno’ para sa ‘mga ama’ sa kontekstong tumutukoy sa mga naunang salinlahi. Ang mga talababa ay wastong nakaangkla at maayos na ipinapaliwanag ang idyoma at alternatibong pagbasa.
