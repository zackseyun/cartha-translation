  text: עַתָּ֕ה אַל תַּקְשׁ֥וּ עָרְפְּ/כֶ֖ם כַּ/אֲבוֹתֵי/כֶ֑ם תְּנוּ יָ֣ד לַ/יהוָ֗ה וּ/בֹ֤אוּ לְ/מִקְדָּשׁ/וֹ֙ אֲשֶׁ֣ר הִקְדִּ֣ישׁ לְ/עוֹלָ֔ם וְ/עִבְדוּ֙ אֶת יְהוָ֣ה אֱלֹהֵי/כֶ֔ם וְ/יָשֹׁ֥ב מִ/כֶּ֖ם חֲר֥וֹן אַפּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/008.yaml
  text: Do not stiffen your neck as your fathers did[a]. Give your hand to Yahweh, and come to his sanctuary, which he has consecrated forever, and serve Yahweh your God[b], so that his burning anger may turn away from you.
translation:
  language: tl
  text: Ngayon, huwag ninyong patigasin ang inyong batok gaya ng ginawa ng inyong mga ninuno. Ibigay ninyo ang inyong kamay kay Yahweh[a], at pumarito kayo sa kanyang santuwaryo, na itinalaga niyang banal magpakailanman. Paglingkuran ninyo si Yahweh na inyong Diyos, upang ang nag-aalab niyang galit ay lumayo sa inyo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “Magpasakop kayo kay Yahweh” o “Ipangako ninyo ang inyong katapatan kay Yahweh.” Literal sa Hebreo: “Ibigay ninyo ang kamay kay Yahweh,” isang idyoma ng pagpapasakop o pangako.'
    reason: lexical_alternative
  - marker: b
    text: O “at lalayo sa inyo ang nag-aalab niyang galit.”
    reason: alternative_reading
lexical_decisions:
- source_word: עַתָּה
  choice: Ngayon
  rationale: Ang עַתָּה ay tahasang temporal na salita sa tekstong Hebreo, kaya isinalin itong “Ngayon.”
- source_word: תַּקְשׁוּ עָרְפְּכֶם
  choice: patigasin ang inyong batok
  rationale: Pinananatili nito ang konkretong Hebreong larawan ng matigas na batok bilang paglalarawan sa matigas na paglaban o pagmamatigas.
- source_word: כַּאֲבוֹתֵיכֶם
  choice: gaya ng ginawa ng inyong mga ninuno
  rationale: Ang “mga ninuno” ay natural at inklusibong katumbas sa modernong Tagalog para sa naunang mga salinlahi; idinagdag ang “ginawa” upang maging malinaw ang paghahambing sa kanilang asal.
- source_word: תְּנוּ יָד לַיהוָה
  choice: Ibigay ninyo ang inyong kamay kay Yahweh
  rationale: Pinananatili sa pangunahing teksto ang kapansin-pansing idyomang Hebreo. Ang diwang pagpapasakop o pangako ng katapatan ay ipinaliliwanag sa talababa.
- source_word: לַיהוָה / יְהוָה
  choice: kay Yahweh / si Yahweh
  rationale: Ginagamit ang personal na pangalang Yahweh bilang tuwirang representasyon ng tetragrammaton sa ibinigay na consultation layer at upang maiba ito sa karaniwang titulong “Panginoon.”
- source_word: מִקְדָּשׁוֹ
  choice: kanyang santuwaryo
  rationale: Ang “santuwaryo” ay nagpapanatili sa kahulugan ng banal na lugar nang hindi nililimitahan ang salita sa gusali lamang.
- source_word: הִקְדִּישׁ לְעוֹלָם
  choice: itinalaga niyang banal magpakailanman
  rationale: Ipinahahayag ng parirala ang pagbubukod ng lugar bilang banal at ang tuwirang diwa ng לְעוֹלָם bilang “magpakailanman.”
- source_word: וְעִבְדוּ
  choice: Paglingkuran ninyo
  rationale: Ang “paglingkuran” ang tuwirang katumbas ng עבד at pinananatiling bukas ang saklaw nito sa pagsamba at tapat na paglilingkod sa Diyos.
- source_word: וְיָשֹׁב מִכֶּם
  choice: upang ... lumayo sa inyo
  rationale: Sa hanay ng mga pautos, ipinahahayag nito ang inaasahan o nilalayong bunga, hindi kinakailangang isang mekanikal na garantiya.
- source_word: חֲרוֹן אַפּוֹ
  choice: ang nag-aalab niyang galit
  rationale: Pinananatili ng “nag-aalab na galit” ang metapora ng matinding init sa Hebreong idyoma nang hindi isinasalin nang asiwa ang literal na larawan ng ilong.
theological_decisions:
- issue: Kahulugan ng idyomang תְּנוּ יָד לַיהוָה
  choice: Ibigay ninyo ang inyong kamay kay Yahweh
  alternative: Magpasakop kayo kay Yahweh; Ipangako ninyo ang inyong katapatan kay Yahweh
  rationale: Maaaring tumukoy ang idyoma sa pagpapasakop o pangako ng katapatan. Pinanatili ang larawan sa teksto at inilagay sa talababa ang mga posibleng diwa upang hindi tahimik na pumili ng iisang pagpapakahulugan.
- issue: Lakas ng וְיָשֹׁב pagkatapos ng mga pautos
  choice: upang ang nag-aalab niyang galit ay lumayo sa inyo
  alternative: at lalayo sa inyo ang nag-aalab niyang galit
  rationale: Ang “upang” ay nagpapanatili sa diwa ng nilalayon o inaasahang resulta ng pagsisisi at paglilingkod, samantalang ang alternatibo ay maaaring basahin bilang mas tuwirang pangako.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang Hebreong larawan ng “matigas na batok” at “ibigay ang kamay,” habang ipinaliwanag sa talababa ang hindi agad malinaw na idyoma. Isinama ang “Ngayon” sapagkat tahasang naroon ang עַתָּה sa WLC.
