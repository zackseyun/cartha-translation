base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/003.yaml
  text: For they could not do it at that time[a], because the priests had not consecrated themselves sufficiently[b], and the people had not gathered to Jerusalem.
translation:
  language: tl
  text: Sapagkat hindi nila ito maisagawa noong panahong iyon[a], dahil hindi pa nagpakabanal nang sapat ang mga pari[b], at hindi pa nagtipon ang mga tao sa Jerusalem.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa takdang panahong iyon,” samakatuwid, sa karaniwang panahon ng pagdiriwang ng Paskuwa.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring unawain na “hindi pa sapat ang bilang ng mga paring nagpakabanal.” Maaaring tumukoy ang maikling pahayag sa antas ng kanilang paghahanda o sa kakulangan ng bilang ng mga handang pari.
    reason: lexical_alternative
  - marker: c
    text: Sa literal, “patungo sa Jerusalem.” Natural sa Filipino ang “nagtipon sa Jerusalem,” na tumutukoy sa lugar ng kanilang pagtitipon.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָכְלוּ
  choice: maisagawa
  rationale: Ang negatibong anyo ng pandiwa ay nagpapahayag ng kawalan ng kakayahang gawin ang pagdiriwang; likas sa Filipino ang “hindi nila iyon maisagawa.”
- source_word: לַעֲשֹׂתוֹ
  choice: iyon maisagawa
  rationale: Tumutukoy ang panghalip sa pagdiriwang ng Paskuwa sa konteksto. Mas malinaw at marangal ang “maisagawa” kaysa sa literal ngunit malabong “gawin.”
- source_word: בָּעֵת הַהִיא
  choice: sa panahong iyon
  rationale: Tumutukoy ito sa partikular na panahong itinakda para sa Paskuwa nang hindi tahasang idinaragdag sa pangunahing teksto ang salitang “takda.”
- source_word: הִתְקַדְּשׁוּ
  choice: nakapagpakabanal
  rationale: Sa kontekstong pansamba at pangpari, tumutukoy ito sa paghahanda at pagtatalaga ng sarili bilang banal. Pinananatili ng “nakapagpakabanal” ang panrelihiyong diwa nang hindi ito nililimitahan sa ritwal na paglilinis lamang.
- source_word: לְמַדַּי
  choice: nang sapat
  rationale: Malapit ito sa maikli at adberbiyal na anyo ng Hebreo. Hinahayaan din nitong manatili sa talababa ang posibilidad na ang tinutukoy ay hindi sapat na bilang ng mga paring nakapagpakabanal.
- source_word: נֶאֶסְפוּ
  choice: nagkakatipon
  rationale: Ang anyo ng Hebreo ay tumutukoy sa pagtitipon ng bayan. Ang “nagkakatipon” ay natural sa modernong Filipino at angkop sa pagpunta ng marami para sa kapistahan.
- source_word: לִירוּשָׁלִָם
  choice: sa Jerusalem
  rationale: Bagaman direksiyonal ang pang-ukol na Hebreo, natural sa Filipino ang “nagkakatipon sa Jerusalem” upang tukuyin ang lugar na pinagtitipunan.
theological_decisions:
- issue: Kung ang kakulangan ay antas ng pagpapakabanal o bilang ng mga paring nakapagpakabanal
  choice: Pinanatili sa pangunahing teksto ang adberbiyal na “nang sapat.”
  alternative: “Hindi pa sapat ang bilang ng mga paring nakapagpakabanal.”
  rationale: Maikli at maaaring unawain sa dalawang paraan ang Hebreong לְמַדַּי. Hindi dapat tahasang lutasin sa pangunahing teksto ang tunay na kalabuan nito.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “maisagawa” upang malinaw na tumukoy sa pagdiriwang na nabanggit sa konteksto, at “nakapagpakabanal” upang mapanatili ang panritwal at panrelihiyong diwa ng paghahanda ng mga pari. Hindi nilutas nang tahasan ang kalabuan ng לְמַדַּי.
