  text: אַךְ אֲנָשִׁ֛ים מֵ/אָשֵׁ֥ר וּ/מְנַשֶּׁ֖ה וּ/מִ/זְּבֻל֑וּן נִֽכְנְע֔וּ וַ/יָּבֹ֖אוּ לִ/ירוּשָׁלִָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/011.yaml
  text: Nevertheless, some men from Asher, Manasseh, and Zebulun humbled themselves and came to Jerusalem.
translation:
  language: tl
  text: Gayunman, may ilang lalaki mula sa Asher, Manases, at Zebulun na nagpakumbaba at pumunta sa Jerusalem.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַךְ
  choice: Gayunman
  rationale: Nagpapahayag ito ng pagsalungat sa pagtanggi at pangungutya ng marami sa naunang talata; natural na ipinakikita ng “Gayunman” ang gayong kaibahan.
- source_word: אֲנָשִׁים
  choice: may ilang lalaki
  rationale: Ang pangngalan ay panlalaking maramihan at tumutukoy sa di-tiyak na maliit na pangkat mula sa mga liping binanggit.
- source_word: מֵאָשֵׁר וּמְנַשֶּׁה וּמִזְּבֻלוּן
  choice: mula sa Asher, Manases, at Zebulun
  rationale: Ang mga pang-ukol ay nagsasaad ng pinagmulan. Ginamit ang mga karaniwang anyo sa Filipino ng mga pangalan ng lipi.
- source_word: נִכְנְעוּ
  choice: nagpakumbaba
  rationale: Ang Niphal ng כנע ay maaaring mangahulugang nagpakumbaba o napasakop. Sa konteksto, ang kusang pagtugon na sinundan ng pagpunta sa Jerusalem ay mahusay na naipahahayag ng “nagpakumbaba.”
- source_word: וַיָּבֹאוּ
  choice: at pumunta
  rationale: Isinasalaysay ng pandiwa ang pagkilos patungo sa Jerusalem. Mas natural sa kasalukuyang Filipino ang “pumunta” kaysa “dumating” sa pangungusap na ito.
- source_word: לִירוּשָׁלִָם
  choice: sa Jerusalem
  rationale: Karaniwang Filipino ang “pumunta sa Jerusalem” para sa direksiyonal na לְ.
theological_decisions:
- issue: Kung ang נִכְנְעוּ ay kusang pagpapakumbaba o pasibong pagpapasakop
  choice: nagpakumbaba
  alternative: napasakop / ibinaba ang kanilang sarili
  rationale: Pinananatili nito ang likas na reflexive na diwa na angkop sa kanilang positibong pagtugon, nang hindi nagdaragdag kung kanino sila nagpakumbaba.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Pinanatili ang tiyak na panlalaking pagtukoy ng אֲנָשִׁים at ang maikli, tuwirang ayos ng Hebreong salaysay.
