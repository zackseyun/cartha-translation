base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/009.yaml
  text: For when you return to Yahweh[a], your brothers and your sons will find compassion before their captors and return to this land. For Yahweh your God is gracious and compassionate[c][b], and he will not turn his face away from you if you return to him.
translation:
  language: tl
  text: Sapagkat kapag nanumbalik kayo kay Yahweh, kahahabagan ng mga bumihag sa kanila ang inyong mga kapatid na lalaki at mga anak na lalaki,[a] at makababalik sila sa lupaing ito. Sapagkat si Yahweh na inyong Diyos ay mapagbigay-loob at mahabagin. Hindi niya ilalayo ang kanyang mukha sa inyo[b] kung manunumbalik kayo sa kanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tahasan, “mga kapatid ninyong lalaki at mga anak ninyong lalaki” ang nasa Hebreo; maaaring tumukoy ang mga katawagang panlalaki sa mga kasapi ng mga pamilyang nabihag.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “hindi niya itatago ang kanyang mukha sa inyo” o, ayon sa diwa, “hindi niya kayo tatalikuran.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשׁוּבְכֶם עַל יְהוָה
  choice: kapag nanumbalik kayo kay Yahweh
  rationale: Ipinahahayag ng שׁוּב ang pagbabalik sa katapatan kay Yahweh. Ang “nanumbalik” ay likas sa Filipino at napananatili ang diwa ng muling pakikipag-ugnayan, hindi lamang pagharap sa isang direksiyon.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang personal na pangalan ng Diyos sa halip na palitan ito ng titulong “PANGINOON.”
- source_word: אֲחֵיכֶם וּבְנֵיכֶם
  choice: inyong mga kapatid at mga anak na lalaki
  rationale: Tiyak na panlalaki ang dalawang katawagang Hebreo; pinanatili ito sa pangunahing teksto sa halip na gawing neutral ang “mga anak.”
- source_word: לְרַחֲמִים לִפְנֵי שׁוֹבֵיהֶם
  choice: kahahabagan ng mga bumihag sa kanila
  rationale: Likas na ipinahahayag sa Filipino ang diwang sila ay magiging mga taong kinahahabagan sa paningin ng mga bumihag sa kanila. Ginawang tahasang tagaganap ang mga bumihag nang hindi binabago ang kahulugan.
- source_word: שׁוֹבֵיהֶם
  choice: mga bumihag sa kanila
  rationale: Tumpak nitong tinutukoy ang mga taong nagdala sa kanila bilang mga bihag.
- source_word: וְלָשׁוּב לָאָרֶץ הַזֹּאת
  choice: at makababalik sila sa lupaing ito
  rationale: Napananatili ang pagbabalik bilang bunga ng habag at hindi ipinapalagay kung sino ang tahasang magpapabalik sa kanila.
- source_word: חַנּוּן וְרַחוּם
  choice: mapagbigay-loob at mahabagin
  rationale: Pinagbubukod ng “mapagbigay-loob” ang חַנּוּן, na tumutukoy sa kusang pagbibigay ng pabor, mula sa רַחוּם, na tuwirang isinaling “mahabagin.”
- source_word: לֹא יָסִיר פָּנִים מִכֶּם
  choice: hindi niya ilalayo ang kanyang mukha sa inyo
  rationale: Pinanatili ang konkretong larawan ng mukha sa Hebreo at ang pahiwatig nitong hindi pagkakait ng pagtanggap at presensiya.
- source_word: אִם תָּשׁוּבוּ אֵלָיו
  choice: kung manunumbalik kayo sa kanya
  rationale: Inulit ang “manunumbalik” upang maipakita ang retorikal na pag-uulit ng ugat na שׁוּב sa simula at wakas ng talata.
theological_decisions:
- issue: Ang שׁוּב bilang panawagan sa pagsisisi at pagpapanumbalik ng katapatan
  choice: nanumbalik/manunumbalik kay Yahweh
  alternative: bumaling kay Yahweh
  rationale: Napananatili ng “manumbalik” ang motibo ng pagbabalik sa dating ugnayan at ang pag-uulit sa Hebreo, nang hindi nagdaragdag ng mas huling sistematikong terminolohiyang teolohikal.
- issue: Mga katawagang panlalaki para sa pamilya
  choice: mga kapatid at mga anak na lalaki
  alternative: mga kapatid at mga anak
  rationale: Tahasang panlalaki ang אֲחֵיכֶם at בְנֵיכֶם sa pinagmulang teksto. Pinanatili ang anyong iyon habang kinikilala sa talababa na maaaring mas malawak ang saklaw ayon sa konteksto.
- issue: Larawan ng mukha ng Diyos
  choice: hindi niya ilalayo ang kanyang mukha sa inyo
  alternative: hindi niya kayo tatalikuran
  rationale: Pinananatili nito ang relasyonal at tipanang larawan ng Hebreo sa halip na ipaliwanag o paliitin ang talinghaga.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “nanumbalik/manunumbalik” upang panatilihin ang pag-uulit at tipanang diwa ng שׁוּב; pinanatili rin ang matalinghagang “mukha” ng Diyos. Iniwasan ang labis na literal na “makatagpo ng habag sa harap ng” dahil hindi ito likas sa kasalukuyang Filipino.
