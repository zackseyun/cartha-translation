translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kapulungan” para sa nagkatipong pamayanan at “mga dayuhang naninirahan” upang maipaliwanag nang natural ang natatanging katayuang panlipunan ng גֵּרִים. Inilipat ang panandang [a] sa mismong salitang tinutukoy ng talababa.
