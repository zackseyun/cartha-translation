source:
  edition: WLC
  text: וַֽ/יִּשְׂמְח֣וּ כָּל קְהַ֣ל יְהוּדָ֗ה וְ/הַ/כֹּהֲנִים֙ וְ/הַ/לְוִיִּ֔ם וְ/כָל הַ/קָּהָ֖ל הַ/בָּאִ֣ים מִ/יִּשְׂרָאֵ֑ל וְ/הַ/גֵּרִ֗ים הַ/בָּאִים֙ מֵ/אֶ֣רֶץ יִשְׂרָאֵ֔ל וְ/הַ/יּוֹשְׁבִ֖ים בִּ/יהוּדָֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/025.yaml
  text: And all the assembly of Judah rejoiced[a], along with the priests and the Levites, and all the assembly who had come from Israel, and the sojourners who had come from the land of Israel, and those living in Judah.
translation:
  language: tl
  text: Nagalak ang buong kapulungan ng Juda, pati ang mga pari at mga Levita, ang buong kapulungang dumating mula sa Israel, ang mga dayuhang naninirahan[a] na dumating mula sa lupain ng Israel, at ang mga naninirahan sa Juda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “mga nakikipamayan.” Ang Hebreong גֵּרִים ay tumutukoy sa mga hindi katutubong naninirahan sa piling ng Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂמְחוּ
  choice: Nagalak
  rationale: Tuwirang ipinapahayag ng pandiwang שׂמח ang galak. Likas at marangal sa makabagong Filipino ang “nagalak” at hindi nito labis na tinutukoy kung paano ipinakita ang galak.
- source_word: כָּל קְהַל יְהוּדָה
  choice: ang buong kapulungan ng Juda
  rationale: Ang קהל ay tumutukoy sa pamayanang nagkatipon. Iniiwasan ng “kapulungan” ang posibleng makitid na eklesiyastikong pakahulugan ng “kongregasyon,” habang pinananatili ang diwa ng sama-samang pagtitipon.
- source_word: הַכֹּהֲנִים
  choice: ang mga pari
  rationale: Karaniwang katumbas sa Filipino ng כֹּהֲנִים at malinaw sa konteksto.
- source_word: הַלְוִיִּם
  choice: ang mga Levita
  rationale: Karaniwang katawagan sa pangkat ng mga Levita, na itinatanging pangkat mula sa mga pari sa talata.
- source_word: כָל הַקָּהָל הַבָּאִים מִיִּשְׂרָאֵל
  choice: ang buong kapulungang dumating mula sa Israel
  rationale: Pinananatili ang kolektibong kahulugan ng קהל at ang pagkakakilanlan ng mga nagmula sa Israel. Ang “dumating” ay natural na salin ng participle sa nagdaang salaysay.
- source_word: הַגֵּרִים
  choice: ang mga dayuhang naninirahan
  rationale: Ang גֵּרִים ay mga hindi katutubong naninirahan sa piling ng Israel, hindi lamang panandaliang bisita. Mas malinaw ito sa karaniwang mambabasang Filipino kaysa sa “nakikipamayan,” habang inilalahad sa talababa ang mas maikling alternatibo.
- source_word: הַבָּאִים מֵאֶרֶץ יִשְׂרָאֵל
  choice: na dumating mula sa lupain ng Israel
  rationale: Pinananatili ang heograpikong pariralang אֶרֶץ יִשְׂרָאֵל at ang pagkakaiba nito sa Juda.
- source_word: הַיּוֹשְׁבִים בִּיהוּדָה
  choice: ang mga naninirahan sa Juda
  rationale: Natural na Filipino ito para sa participle ng ישׁב at pinananatili ang diwa ng patuloy na paninirahan.
