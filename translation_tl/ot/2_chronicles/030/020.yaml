  yaml_path: translation/ot/2_chronicles/030/020.yaml
  text: And Yahweh listened to Hezekiah and healed the people[a][b].
translation:
  language: tl
  text: At dininig ni Yahweh si Hezekias, at pinagaling niya ang bayan.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “narinig ni Yahweh si Hezekias.” Ang pandiwang Hebreo sa ganitong pagkakagamit ay maaaring mangahulugang “marinig” o “pakinggan at tugunin nang may pagsang-ayon.”
    reason: lexical_alternative
  - marker: b
    text: Ang “pinagaling” ay maaaring tumukoy sa pag-aalis ni Yahweh ng kapighatian o hatol na kaugnay ng di-wastong kalagayan ng bayan sa rituwal, at hindi lamang sa pisikal na karamdaman.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: dininig
  rationale: Ang שׁמע na sinusundan ng אֶל ay maaaring mangahulugang hindi lamang narinig kundi pinakinggan at pinagbigyan. Sa konteksto ng panalangin ni Hezekias, natural sa Tagalog ang “dininig,” na nagpapahiwatig ng kanais-nais na tugon nang hindi ito labis na ipinapaliwanag.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang Hebreo sa pamamagitan ng karaniwang transliterasyong “Yahweh,” sa halip na palitan ito ng isang titulo.
- source_word: יְחִזְקִיָּהוּ
  choice: Hezekias
  rationale: Ginamit ang nakasanayang anyo ng pangalan sa modernong saling Tagalog.
- source_word: וַיִּרְפָּא
  choice: pinagaling
  rationale: Karaniwang kahulugan ng רפא ang “magpagaling.” Pinananatili nito ang larawan ng tekstong Hebreo nang hindi nililimitahan sa pisikal na karamdaman.
- source_word: הָעָם
  choice: ang bayan
  rationale: Sa konteksto, tumutukoy ang עַם sa nagkakatipong sambayanan ng Israel. Ang “bayan” ay natural at marangal na katumbas sa Tagalog.
theological_decisions:
- issue: Saklaw ng pagpapagaling sa bayan
  choice: Panatilihin ang salitang “pinagaling” nang hindi nililimitahan sa pisikal na paggaling.
  alternative: “pinatawad,” “iniligtas sa parusa,” o “ibinalik sa mabuting kalagayan”
  rationale: Kaugnay ng konteksto ang di-wastong rituwal na kalagayan ng mga kumain ng Paskuwa at ang panalangin ni Hezekias. Gayunman, רפא ang mismong pandiwang ginamit, kaya pinananatili ang teolohikal na tensiyon sa halip na paliitin ang kahulugan.
translation_notes:
  register: Maikli, natural, at marangal na modernong Tagalog. Ang “dininig” ay idiomatikong pananalitang panalangin ngunit madaling maunawaan; ipinaliliwanag ng talababa ang mas payak na alternatibong “narinig.”
