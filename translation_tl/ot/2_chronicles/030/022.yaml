base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/022.yaml
  text: And Hezekiah spoke encouragingly to all the Levites who showed good understanding in the service of Yahweh[a]. And they ate the feast for seven days, sacrificing peace offerings and giving thanks to Yahweh[d][c][b], the God of their fathers.
translation:
  language: tl
  text: At nagsalita si Ezequias upang palakasin ang loob[a] ng lahat ng Levitang nagpakita ng mahusay na pagkaunawa sa paglilingkod kay Yahweh.[b] Kumain sila sa kapistahan sa loob ng pitong araw, habang naghahandog ng mga handog na pangkapayapaan[c] at nagpapasalamat[d] kay Yahweh, ang Diyos ng kanilang mga ninuno.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “nagsalita sa puso” ng lahat ng Levita; isang idyoma para sa pananalitang nagbibigay-lakas o kaaliwan.'
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring isalin: “na may mahusay na pagkaunawa tungkol kay Yahweh” o “na mahusay sa mga bagay na nauukol kay Yahweh.”'
    reason: lexical_alternative
  - marker: c
    text: 'Hebreo: “mga handog na shĕlamim”; maaari ring tawaging “mga handog ng pakikipag-isa” o “mga handog para sa kagalingan.”'
    reason: lexical_alternative
  - marker: d
    text: Ang pandiwa ay maaari ring mangahulugang “nagtatapat” o “nagpupuri”; sa kontekstong ito, malamang na tumutukoy ito sa pagpapasalamat sa pagsamba.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר עַל־לֵב
  choice: nagsalita ... upang palakasin ang loob
  rationale: Inihahatid nito sa natural na Tagalog ang idyomang literal na ‘nagsalita sa puso,’ na tumutukoy sa pananalitang nagpapalakas o nagbibigay-loob.
- source_word: הַלְוִיִּם
  choice: mga Levita
  rationale: Karaniwang katawagan sa Tagalog para sa pangkat na mula sa lipi ni Levi at naglilingkod sa pagsamba.
- source_word: הַמַּשְׂכִּילִים שֵׂכֶל טוֹב לַיהוָה
  choice: nagpakita ng mahusay na pagkaunawa sa paglilingkod kay Yahweh
  rationale: Pinananatili ng ‘nagpakita’ ang aktibong diwa ng participle at ng ‘mahusay na pagkaunawa’ ang pag-uulit ng ugat שׂכל. Ipinahahayag ng ‘sa paglilingkod kay Yahweh’ ang malamang na kaugnayang panliturhiya, habang inilalagay sa talababa ang mas literal na mga posibilidad.
- source_word: וַיֹּאכְלוּ אֶת־הַמּוֹעֵד
  choice: Kumain sila sa kapistahan
  rationale: Pinananatili ang tahasang pandiwang ‘kumain’ at ang diwa ng מוֹעֵד bilang itinakdang kapistahan, ngunit gumagamit ng natural na kayariang Tagalog sa halip na literal ngunit alanganing ‘kinain nila ang kapistahan.’
- source_word: שִׁבְעַת הַיָּמִים
  choice: sa loob ng pitong araw
  rationale: Natural na pagpapahayag sa Tagalog ng tagal.
- source_word: מְזַבְּחִים זִבְחֵי שְׁלָמִים
  choice: naghahandog ng mga handog para sa kapayapaan
  rationale: Ipinakikita ang teknikal na uri ng hain na שְׁלָמִים nang hindi ipinapalagay na ito ay handog lamang ng pasasalamat; nililinaw sa talababa ang iba pang wastong paglalarawan.
- source_word: וּמִתְוַדִּים
  choice: nagpapasalamat
  rationale: Sa masayang konteksto ng kapistahan at paghahandog, malamang na tumutukoy ang hitpael ng ידה sa liturhikal na pasasalamat, bagaman maaari rin itong mangahulugang pagpupuri o pagtatapat.
- source_word: אֱלֹהֵי אֲבוֹתֵיהֶם
  choice: ang Diyos ng kanilang mga ninuno
  rationale: Natural at gender-accurate na Tagalog para sa pormulang tumutukoy sa Diyos ng naunang mga salinlahi ng Israel.
theological_decisions:
- issue: Pagpapahayag sa pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang pinananatili ang personal at tipanang pangalan sa tekstong Hebreo, sa halip na palitan ito ng isang titulo.
- issue: Kahulugan ng וּמִתְוַדִּים sa konteksto ng pagsamba
  choice: nagpapasalamat
  alternative: nagtatapat; nagpupuri
  rationale: Ang konteksto ng kapistahan at mga handog ay umaayon sa pasasalamat, ngunit hindi lubusang inaalis ang leksikal na posibilidad ng pagtatapat o pagpupuri; kaya nakatala ang mga ito sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Ezequias” at “Levita,” na pamilyar na mga anyong Tagalog ng mga pangalang biblikal. Iniwasan ang sobrang literal na “kinain ang kapistahan,” ngunit pinanatili ang tahasang kilos ng pagkain. Ang mga tunay na leksikal na kalabuan ay inilagay sa mga talababa sa halip na tahimik na lutasin.
