    issue: Idinagdag ang hayag na pagtanggap ng mga pari sa dugo.
    rationale: Ang "na tinanggap nila mula sa mga Levita" ay makatwirang hinuha ngunit hindi tahasang sinasabi ng מִיַּד הַלְוִיִּם. Mas ligtas na panatilihin sa pangunahing teksto ang "mula sa mga Levita" at ilahad ang literal na idyoma sa talababa.
  - severity: low
    issue: Ang aspektong pandiwa ng ritwal na kilos ay ginawang perpektibo.
    rationale: Ang זֹרְקִים ay participle na naglalarawan ng kasabay o nagpapatuloy na kilos sa salaysay. Ang "nagwiwisik" ay mas malapit dito kaysa "iwinisik."
  - severity: low
    issue: Maaaring luminaw ang appositional na titulo ni Moises.
    rationale: Ang kuwit sa "Moises, ang tao ng Diyos" ay malinaw na nagpapakitang ang "tao ng Diyos" ay titulo ni Moises, gaya ng אִישׁ הָאֱלֹהִים.
  revised_text: Tumayo sila sa kani-kanilang puwesto ayon sa itinakdang tuntunin para sa kanila, ayon sa Kautusan ni Moises, ang tao ng Diyos. Ang mga pari ay nagwiwisik ng dugo mula sa mga Levita.[a]
