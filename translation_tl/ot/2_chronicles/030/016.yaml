revisions:
- from: Tumayo sila sa kani-kanilang puwesto ayon sa itinakdang tuntunin para sa kanila, ayon sa Kautusan ni Moises na tao ng Diyos. Iwinisik ng mga pari ang dugo na tinanggap nila mula sa mga Levita.[a]
  to: Tumayo sila sa kani-kanilang puwesto ayon sa itinakdang tuntunin para sa kanila, ayon sa Kautusan ni Moises, ang tao ng Diyos. Ang mga pari ay nagwiwisik ng dugo mula sa mga Levita.[a]
  rationale: Inalis ang idinagdag na "tinanggap nila" upang huwag gawing hayag ang ipinahihiwatig lamang ng Hebreo. Pinalitan ang perpektibong "Iwinisik" ng "nagwiwisik" upang katawanin ang participial na paglalarawan ng kasabay na gawaing ritwal. Nilinaw rin sa bantas na ang "tao ng Diyos" ay titulo ni Moises. Napanatili ang preskriptibong diwa ng מִשְׁפָּטָם at ang talababa para sa literal na "mula sa kamay."
