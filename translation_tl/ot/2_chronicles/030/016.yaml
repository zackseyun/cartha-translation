base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/016.yaml
  text: They stood in their place according to their custom[a], according to the law of Moses the man of God. The priests were sprinkling the blood received from the hand of the Levites.
translation:
  language: tl
  text: Tumayo sila sa kani-kanilang puwesto ayon sa itinakdang tuntunin para sa kanila, ayon sa Kautusan ni Moises, ang tao ng Diyos. Ang mga pari ay nagwiwisik ng dugo mula sa mga Levita.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “mula sa kamay ng mga Levita.”
    reason: Pinananatili ang kongkretong idyomang Hebreo na מִיַּד הַלְוִיִּם bilang alternatibo sa natural na Tagalog na “mula sa mga Levita.”
lexical_decisions:
- source_word: וַיַּעַמְדוּ עַל־עָמְדָם
  choice: Tumayo sila sa kani-kanilang puwesto
  rationale: Ipinahihiwatig ng parirala ang pagtayo ng bawat pangkat sa nakatalagang puwesto nito sa paglilingkod; natural sa modernong Tagalog ang “kani-kanilang puwesto.”
- source_word: כְּמִשְׁפָּטָם
  choice: ayon sa itinakdang tuntunin para sa kanila
  rationale: Sa kontekstong ritwal, ang מִשְׁפָּט ay tumutukoy sa itinakdang pamamaraan o tuntunin, hindi lamang sa nakaugaliang gawain. Nililinaw ng “para sa kanila” ang hulaping panghalip nang hindi ipinapalagay kung aling pangkat ang tinutukoy.
- source_word: כְּתוֹרַת מֹשֶׁה
  choice: ayon sa Kautusan ni Moises
  rationale: Ang תּוֹרָה rito ay ang tagubiling legal at panritwal na iniugnay kay Moises; “Kautusan” ang malinaw at kinikilalang katumbas sa kontekstong ito.
- source_word: אִישׁ הָאֱלֹהִים
  choice: tao ng Diyos
  rationale: Pinananatili nito ang pormal na titulong biblikal para kay Moises nang hindi nagdaragdag ng paliwanag.
- source_word: הַכֹּהֲנִים זֹרְקִים אֶת־הַדָּם
  choice: Iwinisik ng mga pari ang dugo
  rationale: Bagaman maaaring mangahulugang “ihagis” ang זָרַק, tumutukoy ito rito sa ritwal na paglalapat ng dugo; “iwinisik” ang natural at tumpak na salin sa kontekstong paghahandog.
- source_word: מִיַּד הַלְוִיִּם
  choice: na tinanggap nila mula sa mga Levita
  rationale: Literal itong “mula sa kamay ng mga Levita.” Ginagawang natural sa Tagalog ng “tinanggap” ang ipinahihiwatig na pagpapasa ng dugo sa mga pari, habang inilalagay sa talababa ang literal na anyo.
theological_decisions:
- issue: Paglalarawan sa ritwal na paglalapat ng dugo
  choice: Iwinisik ng mga pari ang dugo
  alternative: Inihagis ng mga pari ang dugo
  rationale: Ang “iwinisik” ay umaayon sa gamit ng זָרַק sa paghahandog at hindi nagdaragdag ng teolohikal na kahulugang wala sa talata.
- issue: Lakas ng כְּמִשְׁפָּטָם bilang panritwal na termino
  choice: ayon sa itinakdang tuntunin para sa kanila
  alternative: ayon sa kanilang kaugalian
  rationale: Mas malinaw na ipinakikita ng “itinakdang tuntunin” na ang kilos ay alinsunod sa preskriptibong kaayusan ng paglilingkod, sa halip na isang karaniwang kaugaliang nabuo lamang sa paglipas ng panahon.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw ngunit marangal. Ginamit ang “kani-kanilang puwesto” at “itinakdang tuntunin” upang maging natural ang paglalarawan sa organisadong paglilingkod sa templo, habang pinanatili ang kinikilalang mga terminong “Kautusan,” “tao ng Diyos,” “mga pari,” at “mga Levita.”
