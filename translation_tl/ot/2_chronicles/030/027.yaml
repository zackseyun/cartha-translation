  text: וַ/יָּקֻ֜מוּ הַ/כֹּהֲנִ֤ים הַ/לְוִיִּם֙ וַ/יְבָרֲכ֣וּ אֶת הָ/עָ֔ם וַ/יִּשָּׁמַ֖ע בְּ/קוֹלָ֑/ם וַ/תָּב֧וֹא תְפִלָּתָ֛/ם לִ/מְע֥וֹן קָדְשׁ֖/וֹ לַ/שָּׁמָֽיִם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/027.yaml
  text: Then the priests[a], the Levites, stood up and blessed the people, and their voice was heard, and their prayer came to his holy dwelling[c][b], to heaven.
translation:
  language: tl
  text: Pagkatapos, tumayo ang mga pari—ang mga Levita[a]—at binasbasan nila ang bayan. Dininig ang kanilang tinig[b], at ang kanilang panalangin ay umabot sa banal niyang tahanan, sa langit[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang mga paring Levita.” Maaaring unawain ang pariralang Hebreo bilang apposisyon, na nagpapakilalang mga Levita ang mga paring tinutukoy.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “pinakinggan ang kanilang tinig.” Ipinahihiwatig ng pasibong anyo na dininig sila ng Diyos.
    reason: alternative_reading
  - marker: c
    text: Maaari ring “sa banal niyang tahanan, sa kalangitan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֻמוּ
  choice: tumayo
  rationale: Ang Qal na anyong nagsasalaysay ng קום ay tumutukoy sa pagbangon o pagtayo. Likas sa Filipino ang “tumayo” at pinananatili nito ang kongkretong kilos bago ang pagbabasbas.
- source_word: הַכֹּהֲנִים הַלְוִיִּם
  choice: ang mga pari—ang mga Levita
  rationale: Ipinakikita ng gitling na ang “mga Levita” ay panumbas na nagpapakilala nang mas tiyak sa mga pari, sa halip na magdagdag ng ikalawang hiwalay na pangkat.
- source_word: וַיְבָרֲכוּ אֶת־הָעָם
  choice: binasbasan nila ang bayan
  rationale: Sa kontekstong ito, ang ברך ay pagsambit ng pagpapala sa bayan. Karaniwan at marangal sa kasalukuyang Filipino ang “binasbasan,” habang ang “bayan” ay nagpapanatili sa malawak na kahulugan ng עָם.
- source_word: וַיִּשָּׁמַע בְּקוֹלָם
  choice: Dininig ang kanilang tinig
  rationale: Pinananatili ng pasibong “dininig” ang anyong Niphal ng שמע at hindi tahasang nagdaragdag ng Diyos bilang paksa, bagaman malinaw siyang ipinahihiwatig ng konteksto.
- source_word: תְפִלָּתָם
  choice: ang kanilang panalangin
  rationale: Ang pang-isahang pangngalan na may hulaping pangmaramihan ay natural na naihahayag bilang sama-samang “kanilang panalangin.”
- source_word: וַתָּבוֹא ... לִמְעוֹן קָדְשׁוֹ
  choice: umabot sa banal niyang tahanan
  rationale: Ang “umabot” ay natural na Filipino para sa pagdating ng panalangin sa patutunguhan nito, at ang “banal niyang tahanan” ay nagpapanatili sa larawang panlunan ng מָעוֹן קָדְשׁוֹ.
- source_word: לַשָּׁמָיִם
  choice: sa langit
  rationale: Ang parirala ay kasunod na paglilinaw sa “banal niyang tahanan.” Pinananatili ng “sa langit” ang hiwalay na elemento ng Hebreo nang hindi inuulit nang alanganin ang diwang patungo.
theological_decisions:
- issue: Kung tahasang gagawing Diyos ang gumaganap sa pagdinig
  choice: Panatilihin ang pasibong “Dininig ang kanilang tinig.”
  alternative: “Dininig ng Diyos ang kanilang tinig” o “Narinig ng PANGINOON ang kanilang tinig.”
  rationale: Hindi tahasang pinapangalanan ng Hebreo ang Diyos sa sugnay na ito. Pinananatili ng pasibo ang pahiwatig na dininig sila ng Diyos nang hindi nagdaragdag ng pangalang wala sa mismong sugnay.
- issue: Ang ugnayan ng “mga pari” at “mga Levita”
  choice: 'Ituring na apposisyon: “ang mga pari—ang mga Levita.”'
  alternative: “ang mga paring Levita” o “ang mga pari at ang mga Levita.”
  rationale: Malamang na higit na tiyak na pagkakakilanlan ng mga pari ang “mga Levita,” hindi dalawang magkahiwalay na pangkat. Gayunman, inilalahad sa talababa ang mas siksik na alternatibo.
- issue: Ang ugnayan ng banal na tahanan at langit
  choice: 'Panatilihin ang dalawang parirala: “sa banal niyang tahanan, sa langit.”'
  alternative: “sa banal niyang tahanan sa kalangitan.”
  rationale: Pinananatili nito ang pag-uulit ng pang-ukol at ang appositional na paglilinaw sa Hebreo, nang hindi lubusang pinagsasanib ang dalawang parirala.
translation_notes:
  register: Makabago ngunit marangal na Filipino ang ginamit. Ang “binasbasan” at “panalangin” ay pamilyar sa karaniwang mambabasa; ang em dash ay malinaw na naghahayag ng apposisyon. Hinati sa dalawang pangungusap upang maging natural ang daloy nang hindi binabago ang lohika ng talata.
