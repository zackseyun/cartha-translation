base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/024.yaml
  text: For Hezekiah king of Judah gave to the assembly one thousand bulls and seven thousand sheep[a], and the officials gave to the assembly one thousand bulls and ten thousand sheep[b]; and priests consecrated themselves in great numbers.
translation:
  language: tl
  text: Sapagkat si Haring Hezekias ng Juda ay nagbigay sa kapulungan ng isang libong toro at pitong libong hayop mula sa kawan[a], at ang mga pinuno naman ay nagbigay sa kapulungan ng isang libong toro at sampung libong hayop mula sa kawan. At napakaraming pari ang nagpakabanal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “sa kapulungan” ay maaari ring isaling “para sa kapulungan”; maaaring taglayin ng pang-ukol sa Hebreo ang alinmang diwa sa kontekstong ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Nagbibigay ito ng paliwanag sa naunang salaysay at likas na nag-uugnay sa talata sa konteksto.
- source_word: הֵרִים / הֵרִימוּ
  choice: nagbigay
  rationale: Sa kontekstong ito, ang hiphil ng רום ay tumutukoy sa paglalaan o pagbibigay ng mga hayop para sa kapulungan, hindi sa literal na pagtataas.
- source_word: לַקָּהָל
  choice: sa kapulungan
  rationale: Pinananatili nito ang posibleng diwa ng pagbibigay sa nagkakatipong pamayanan; maaari rin itong unawain bilang pagbibigay para sa kapulungan, kaya inilalahad ang alternatibo sa talababa.
- source_word: פָּרִים
  choice: mga toro
  rationale: Tuwirang tumutukoy sa mga bakang lalaki na angkop sa konteksto ng paghahandog.
- source_word: צֹאן
  choice: mga hayop mula sa kawan
  rationale: Masaklaw ang terminong Hebreo at maaaring tumukoy kapwa sa mga tupa at kambing; iniiwasan ng salin na paliitin ito sa tupa lamang.
- source_word: הַשָּׂרִים
  choice: mga pinuno
  rationale: Natural at madaling maunawaang tawag sa matataas na pinunong pampamahalaan, nang hindi ipinapalagay na mga prinsipeng maharlika sila.
- source_word: וַיִּתְקַדְּשׁוּ כֹהֲנִים
  choice: napakaraming pari ang nagtalaga ng kanilang sarili
  rationale: 'Pinananatili ang reflexive at ritwal na diwa ng anyong Hebreo: inihanda at ibinukod ng mga pari ang kanilang sarili para sa banal na paglilingkod.'
- source_word: לָרֹב
  choice: napakarami
  rationale: Likas na Filipino para sa diwa ng malaking bilang ng mga pari.
theological_decisions:
- issue: Ang ritwal na kahulugan ng התקדשׁ
  choice: nagtalaga ng kanilang sarili
  alternative: naglinis ng kanilang sarili
  rationale: Hindi nililimitahan ng salin ang kilos sa paglilinis lamang; pinananatili nito ang mas malawak na diwa ng ritwal na pagpapakabanal o pagbubukod para sa paglilingkod.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “hayop mula sa kawan” upang mapanatili ang lawak ng צֹאן, na maaaring kabilang ang mga tupa at kambing. Iisa lamang ang talababa at ang pananda nitong [a] ay nasa pangunahing teksto.
