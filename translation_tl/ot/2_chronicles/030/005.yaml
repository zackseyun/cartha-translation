revisions:
- from: Kaya nagtakda sila na ipahayag sa buong Israel, mula sa Beer-seba hanggang Dan, na pumunta ang mga tao sa Jerusalem upang ipagdiwang ang Paskuwa para kay Yahweh, ang Diyos ng Israel; sapagkat hindi ito ipinagdiwang ng marami ayon sa nakasulat.[a]
  to: Kaya nagpasiya silang magpalaganap ng isang pahayag sa buong Israel, mula sa Beer-seba hanggang Dan, na pumunta ang mga tao sa Jerusalem upang ipagdiwang ang Paskuwa para kay Yahweh, ang Diyos ng Israel; sapagkat hindi ito ipinagdiwang ng marami ayon sa nakasulat.[a]
  rationale: Pinalitan ang hindi kumpletong “nagtakda sila na ipahayag” ng mas natural na pananalitang naghahayag kapwa ng opisyal na pasiya at ng pagpapalaganap ng proklamasyon. Hindi binago ang daming pagbasa ng לָרֹב, at hindi idinagdag ang di-tiyak na kahulugang temporal na “sa mahabang panahon.”
