  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יַּֽעֲמִ֣ידוּ דָבָ֗ר לְ/הַעֲבִ֨יר ק֤וֹל בְּ/כָל יִשְׂרָאֵל֙ מִ/בְּאֵֽר שֶׁ֣בַע וְ/עַד דָּ֔ן לָ/ב֞וֹא לַ/עֲשׂ֥וֹת פֶּ֛סַח לַ/יהוָ֥ה אֱלֹהֵֽי יִשְׂרָאֵ֖ל בִּ/ירוּשָׁלִָ֑ם כִּ֣י לֹ֥א לָ/רֹ֛ב עָשׂ֖וּ כַּ/כָּתֽוּב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/005.yaml
  text: So they established a decree to send a proclamation throughout all Israel[a], from Beersheba to Dan, that they should come to keep the Passover to Yahweh, the God of Israel, at Jerusalem; for they had not kept it in great numbers as it is written.
translation:
  language: tl
  text: Kaya nagpasiya silang magpalaganap ng isang pahayag sa buong Israel, mula sa Beer-seba hanggang Dan, na pumunta ang mga tao sa Jerusalem upang ipagdiwang ang Paskuwa para kay Yahweh, ang Diyos ng Israel; sapagkat hindi ito ipinagdiwang ng marami ayon sa nakasulat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Siksik ang Hebreo sa pangwakas na sugnay. Maaari rin itong unawain na, “sapagkat kakaunti lamang ang nagdiwang nito ayon sa nakasulat.” Maaaring idiin ng parirala ang kakaunting nakibahagi, o na ang pagdiriwang ay hindi naisagawa nang sagana ayon sa nakasulat.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעֲמִידוּ דָבָר
  choice: nagtakda sila
  rationale: Ang idyoma ay literal na ‘pinatayo nila ang isang bagay’ at sa konteksto ay tumutukoy sa pagpapatibay ng isang opisyal na pasiya. Natural at may pormal na dating ang ‘nagtakda sila.’
- source_word: לְהַעֲבִיר קוֹל
  choice: na ipahayag
  rationale: Literal itong pagpaparaan ng isang tinig o balita; sa kontekstong administratibo, tumutukoy ito sa pagpapalaganap ng isang pampublikong pahayag.
- source_word: בְּכָל יִשְׂרָאֵל
  choice: sa buong Israel
  rationale: Ipinapakita nito na saklaw ng pahayag ang buong Israel.
- source_word: מִבְּאֵר שֶׁבַע וְעַד דָּן
  choice: mula sa Beer-seba hanggang Dan
  rationale: Pinananatili ang karaniwang heograpikong parirala para sa buong lupain, mula timog hanggang hilaga.
- source_word: לָבוֹא
  choice: na pumunta ang mga tao
  rationale: Ipinahahayag ng pawatas ang nilalaman o layunin ng pahayag. Nilinaw ang ipinahihiwatig na mga taong inaanyayahang pumunta.
- source_word: לַעֲשׂוֹת פֶּסַח
  choice: upang ipagdiwang ang Paskuwa
  rationale: Bagaman literal na ‘gawin ang Paskuwa,’ ang ‘ipagdiwang’ ay natural na Filipino para sa pagganap sa kapistahang ito nang hindi nililimitahan iyon sa isang gawain lamang.
- source_word: לַיהוָה
  choice: para kay Yahweh
  rationale: Pinananatili ang personal na pangalang יהוה bilang ‘Yahweh’; ipinahahayag ng ‘para kay’ ang pag-uukol ng pagdiriwang sa kanya.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ang Diyos ng Israel
  rationale: Tuwirang salin ng pariralang konstrakto.
- source_word: בִּירוּשָׁלָ͏ִם
  choice: sa Jerusalem
  rationale: Natural na Filipino para sa lugar at destinasyon ng pagdiriwang.
- source_word: כִּי לֹא לָרֹב עָשׂוּ
  choice: sapagkat hindi ito ipinagdiwang ng marami
  rationale: Ang לָרֹב ay pangunahing dami ang ipinahahayag. Inuugnay ng salin ang kakulangan sa bilang ng mga nakibahagi, habang kinikilala sa talababa ang siksik at hindi ganap na tiyak na sintaks.
- source_word: כַּכָּתוּב
  choice: ayon sa nakasulat
  rationale: Tumutukoy ito sa pagsunod sa nakasulat na tuntunin; natural at malinaw ang ‘ayon sa nakasulat.’
theological_decisions:
- issue: Pagpapahayag sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Personal na pangalan ang nasa tekstong Hebreo. Pinananatili ng ‘Yahweh’ ang pangalang tipan nang hindi ito pinapalitan ng titulo.
- issue: Ugnayan ng לָרֹב at כַּכָּתוּב sa pangwakas na sugnay
  choice: hindi ito ipinagdiwang ng marami ayon sa nakasulat
  alternative: matagal na nila itong hindi ipinagdiriwang ayon sa nakasulat; hindi ito ipinagdiwang nang lubos ayon sa nakasulat
  rationale: Mas tuwirang nagpapahiwatig ng dami ang לָרֹב kaysa tagal. Gayunman, siksik ang Hebreo at maaaring pagtalunan kung binibigyang-diin ang kakaunting kalahok o ang di-pagsunod sa itinakdang paraan, kaya hindi tahimik na nilulutas ang tensiyon at inilalahad ito sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘Paskuwa’ bilang kilalang katawagang biblikal at ang ‘Beer-seba’ bilang natural na transliterasyon. Iniwasan ang sobrang legalistikong ‘nagpalabas ng kautusan’ dahil ang Hebreo ay tumutukoy sa isang opisyal na pasiya ngunit hindi kinakailangang teknikal na batas.
