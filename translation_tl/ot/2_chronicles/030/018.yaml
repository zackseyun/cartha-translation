  text: כִּ֣י מַרְבִּ֣ית הָ/עָ֡ם רַ֠בַּת מֵֽ/אֶפְרַ֨יִם וּ/מְנַשֶּׁ֜ה יִשָּׂשכָ֤ר וּ/זְבֻלוּן֙ לֹ֣א הִטֶּהָ֔רוּ כִּֽי אָכְל֥וּ אֶת הַ/פֶּ֖סַח בְּ/לֹ֣א כַ/כָּת֑וּב כִּי֩ הִתְפַּלֵּ֨ל יְחִזְקִיָּ֤הוּ עֲלֵי/הֶם֙ לֵ/אמֹ֔ר יְהוָ֥ה הַ/טּ֖וֹב יְכַפֵּ֥ר בְּעַֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/018.yaml
  text: For a great many of the people[a], many from Ephraim and Manasseh, Issachar and Zebulun, had not purified themselves, yet they ate the Passover otherwise than as it is written. But Hezekiah prayed for them, saying, “May Yahweh, who is good[b], make atonement for them—”
translation:
  language: tl
  text: Sapagkat napakarami sa mga tao—marami mula sa Efraim, Manases, Isacar, at Zebulun—ang hindi naglinis ng kanilang sarili. Gayunman, kinain nila ang Paskuwa nang hindi ayon sa nasusulat. Ngunit ipinanalangin sila ni Ezequias, na nagsabi, “Nawa’y si Yahweh, na mabuti, ay magkaloob ng pagbabayad-sala para sa—”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nagpapatuloy sa talata 19 ang panalangin; hindi kumpleto ang pangungusap na Hebreo sa dulo ng talatang ito.
    reason: cross_reference
lexical_decisions:
- source_word: מַרְבִּית הָעָם רַבַּת
  choice: napakarami sa mga tao—marami
  rationale: Pinananatili nito ang partitive na diwa at ang pag-uulit na nagbibigay-diin sa napakalaking bilang, nang hindi ipinapalagay na tiyak na karamihan sila.
- source_word: מֵאֶפְרַיִם וּמְנַשֶּׁה יִשָּׂשכָר וּזְבֻלוּן
  choice: mula sa Efraim, Manases, Isacar, at Zebulun
  rationale: Ginamit ang karaniwang makabagong anyong Tagalog ng mga pangalan ng lipi at nilinaw ang talaan sa pamamagitan ng mga kuwit.
- source_word: לֹא הִטֶּהָרוּ
  choice: hindi nakapaglinis ng kanilang sarili
  rationale: Ipinahahayag ang reflexive na anyo at ang ritwal na paglilinis, hindi lamang pangkalahatang kalinisan.
- source_word: אָכְלוּ אֶת הַפֶּסַח
  choice: kinain nila ang Paskuwa
  rationale: Pinananatili ang tuwirang bagay na ‘Paskuwa,’ na maaaring tumukoy sa handa o hain, nang hindi idinaragdag ang ‘kordero’ na wala sa Hebreo.
- source_word: בְּלֹא כַכָּתוּב
  choice: nang hindi ayon sa nasusulat
  rationale: Malapit ito sa Hebreo at malinaw na tumutukoy sa nakasulat na tuntunin nang hindi dinaragdagan ang kahulugan.
- source_word: הִתְפַּלֵּל ... עֲלֵיהֶם
  choice: ipinanalangin sila
  rationale: Natural na Tagalog para sa pananalangin alang-alang sa ibang tao, nang hindi kinakailangang gumamit ng mas teknikal na ‘namagitan.’
- source_word: יְהוָה הַטּוֹב
  choice: Yahweh, na mabuti
  rationale: Pinananatili ang personal na pangalan at inilalahad nang natural ang pang-uri bilang paglalarawan kay Yahweh.
- source_word: יְכַפֵּר בְּעַד
  choice: magkaloob ng pagtubos para sa—
  rationale: Pinananatili ang kultiko at teolohikal na diwa ng כפר nang hindi ito pinapaliit sa ‘magpatawad.’ Hindi tinutukoy rito ang layon ng ‘para sa’ sapagkat nagpapatuloy ito sa kasunod na talata.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehova
  rationale: Personal na pangalan ang nasa tekstong Hebreo; ang transliterasyong ‘Yahweh’ ang tuwirang nagpapanatili nito sa halip na palitan ng titulo.
- issue: Kultikong kahulugan ng יְכַפֵּר
  choice: magkaloob ng pagtubos
  alternative: magpatawad / magbayad-sala
  rationale: Ang konteksto ay Paskuwa at ritwal na paglilinis. Pinananatili ng ‘pagtubos’ ang diwa ng atonement nang hindi ginagawang simpleng kapatawaran o ipinahihiwatig na si Yahweh mismo ang nagbabayad-sala dahil sa sariling kasalanan.
- issue: Hindi kumpletong panalangin sa dulo ng talata
  choice: para sa—
  alternative: para sa kanila
  rationale: Ang Hebreong בְּעַד ay naghihintay ng layon na lumilitaw sa talata 19. Hindi dinaragdagan ng ‘kanila’ ang talata at pinananatili ang sintaktikong pagpapatuloy.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang ‘Paskuwa’ bilang pamilyar na katawagang biblikal; iniwasan ang sobrang teknikal o denominasyonal na pananalita. Ang em dash sa unang pangungusap ay nagpapanatili sa pagbibigay-diin ng Hebreo nang natural sa Filipino.
