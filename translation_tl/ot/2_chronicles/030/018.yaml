  source_fidelity: 'Ang pangunahing diwa ay tapat sa Hebreo: marami mula sa apat na lipi ang hindi ritwal na naglinis ng sarili, ngunit kumain ng Paskuwa hindi ayon sa nasusulat; ipinanalangin sila ni Ezequias. Gayunman, ang “hindi nakapaglinis” ay karaniwang nagpapahiwatig ng hindi pagkakaya o hindi pagkakaroon ng pagkakataon, samantalang ang Hebreo ay payak na nagsasabing hindi nila nilinis ang kanilang sarili. Ang “pagtubos” ay mas malapit sa redemption/ransom kaysa sa כפר, na tumutukoy rito sa paggawa o pagkakaloob ng pagbabayad-sala.'
  naturalness: Malinaw at marangal ang kabuuang Tagalog. Mas tumpak at natural sa kontekstong ritwal ang “hindi naglinis ng kanilang sarili” kaysa “hindi nakapaglinis ng kanilang sarili.” Ang “magkaloob ng pagbabayad-sala” ay mas angkop na katumbas ng cultic atonement kaysa “magkaloob ng pagtubos.”
  terminology: Wasto ang mga pangalang Efraim, Manases, Isacar, Zebulun, Ezequias, at Yahweh. Ang “Paskuwa” ay angkop. Pinananatili ng “pagbabayad-sala” ang kultikong saklaw ng כפר nang hindi ito binabawasan sa simpleng pagpapatawad o inililihis sa kahulugang “pagtubos.”
