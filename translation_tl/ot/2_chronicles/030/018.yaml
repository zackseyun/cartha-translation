    rationale: Sa konteksto ng Paskuwa at ritwal na paglilinis, ang piel ng כפר ay tumutukoy sa paggawa/pagkakaloob ng pagbabayad-sala. Ang “pagtubos” ay maaaring ilihis ang kahulugan tungo sa ransom o redemption.
