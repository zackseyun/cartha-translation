  terminology: Wasto ang mga pangalang Efraim, Manases, at Zebulun. Ang “mga tagapagdala ng mensahe” ay mahusay na salin ng הָרָצִים; pinananatili ng talababa ang “mga mananakbo” at “mga sugo” bilang mga maaaring salin.
