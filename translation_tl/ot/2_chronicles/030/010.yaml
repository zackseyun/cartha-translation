base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/010.yaml
  text: So the couriers went from city to city in the land of Ephraim and Manasseh[a], as far as Zebulun[b]; but they were laughing at them and mocking them.
translation:
  language: tl
  text: Kaya naglakbay ang mga tagapagdala ng mensahe[a] mula sa isang lungsod patungo sa iba sa lupain ng Efraim at Manases, hanggang sa Zebulun. Ngunit pinagtatawanan at kinukutya sila.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “mga mananakbo” o “mga sugo.” Ang salitang Hebreo ay tumutukoy sa mga opisyal na tagapagdala ng mensahe, na malamang ay mabilis na naglalakbay.
    reason: lexical_alternative
  - marker: b
    text: 'Gumagamit ang Hebreo ng dalawang pandiwa ng paghamak: pinagtatawanan ang mga tagapagdala ng mensahe at kinukutya sila.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרָצִים
  choice: mga tagapagdala ng mensahe
  rationale: Ang participial noun mula sa רוץ (“tumakbo”) ay tumutukoy sa mga opisyal na inatasang mabilis na maghatid ng mensahe. Mas malinaw ito sa karaniwang mambabasang Filipino kaysa sa literal na “mga mananakbo,” habang pinananatili ang tungkulin nila.
- source_word: עֹבְרִים
  choice: naglakbay
  rationale: Ang salita ay literal na nagsasaad ng pagdaan o pagtawid; sa konteksto ng pagpunta sa sunod-sunod na lungsod, natural na ipinahahayag ng “naglakbay” ang kanilang pagkilos nang hindi nililimitahan sa simpleng pagdaan lamang.
- source_word: מֵעִיר לָעִיר
  choice: sa bawat lungsod
  rationale: Ipinahahayag nito ang distributibong diwa ng paglalakbay mula sa isang lungsod patungo sa kasunod. Ang “sa bawat lungsod” ay natural sa Filipino at malinaw na nagsasaad ng paulit-ulit na pagdalaw.
- source_word: בְּאֶרֶץ אֶפְרַיִם וּמְנַשֶּׁה וְעַד זְבֻלוּן
  choice: sa lupain ng Efraim at Manases, hanggang sa Zebulun
  rationale: Pinananatili ang heograpikong saklaw at ang tahasang hangganang ipinakikita ng וְעַד (“hanggang sa”).
- source_word: מַשְׂחִיקִים עֲלֵיהֶם
  choice: pinagtatawanan sila
  rationale: Ang Hiphil participle ng שׂחק ay nagpapahiwatig dito ng mapanlibak na pagtawa, hindi lamang simpleng kasiyahan. Ang anyong “pinagtatawanan” ay natural at maaari ring magpahiwatig ng patuloy na pagkilos.
- source_word: וּמַלְעִגִים בָּם
  choice: kinukutya sila
  rationale: Ang לעג ay malakas na salitang tumutukoy sa pangungutya o panlilibak. Kasama ng “pinagtatawanan,” pinananatili nito ang dalawang magkaugnay ngunit magkahiwalay na kilos ng paghamak.
- source_word: וַיִּהְיוּ ... וַיִּהְיוּ
  choice: Kaya ... Ngunit ...
  rationale: Ginagamit ang “Kaya” upang ipagpatuloy ang salaysay at “Ngunit” upang malinaw na ihayag ang salungat na tugon ng mga tao. Ang mga pandiwang “pinagtatawanan” at “kinukutya” ay nagpapanatili sa duratibo o nagpapatuloy na diwa ng היה kasama ng mga participle.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “mga tagapagdala ng mensahe” sa halip na teknikal o literal na “mga mananakbo.” Pinanatili ang dalawang pandiwa ng paghamak at ang nagpapatuloy na diwa ng tugon. Ang “mga tao” ay tahasang idinagdag bilang likas na Filipino na paksa ng pangungusap; tinutukoy nito ang mga taong nasa mga lungsod na dinaanan, na implicit sa Hebreo.
