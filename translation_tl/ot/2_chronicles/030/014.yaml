base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/014.yaml
  text: They arose and removed the altars that were in Jerusalem[b][a], and they removed all the incense altars and threw them into the Kidron Valley.
translation:
  language: tl
  text: Tumayo sila at inalis ang mga altar na nasa Jerusalem. Inalis din nila ang lahat ng mga sunugan ng insenso[a] at itinapon ang mga iyon sa Lambak ng Kidron.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “lahat ng mga altar ng insenso” o “lahat ng mga patungan ng insenso.” Ang salitang Hebreo ay tumutukoy sa mga kagamitang o pook na ginagamit sa pagsusunog ng insenso.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “wadi/batis/lambak ng Kidron.” Ang tinutukoy ay isang lambak o bangin na maaaring daluyan ng tubig.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֻמוּ
  choice: Tumayo sila
  rationale: Ang קום sa salaysay ay nagpapakilala ng isang tiyak at kusang pagkilos. Pinananatili ng “Tumayo sila” ang galaw ng Hebreo nang hindi nagiging lipas o labis na pormal.
- source_word: וַיָּסִירוּ / הֵסִירוּ
  choice: inalis / Inalis
  rationale: Ang Hiphil ng סור ay karaniwang nangangahulugang alisin o iligpit. Ang “inalis” ay malinaw at natural, at pareho itong ginamit sa dalawang paglitaw ng pandiwa.
- source_word: הַמִּזְבְּחוֹת
  choice: mga altar
  rationale: Ang מִזְבְּחוֹת ay karaniwang pangmaramihang katawagan para sa mga altar. Ang “altar” ay madaling maunawaan sa modernong Filipino at hindi nagdaragdag ng paliwanag na wala sa talata.
- source_word: אֲשֶׁר בִּירוּשָׁלָם
  choice: na nasa Jerusalem
  rationale: Pinananatili ang tahasang sugnay na panuring ng Hebreo upang tukuyin kung aling mga altar ang inalis.
- source_word: הַמְקַטְּרוֹת
  choice: mga sunugan ng insenso
  rationale: Ang salita, mula sa ugat na קטר, ay tumutukoy sa mga kagamitang o pook-kultong kaugnay ng pagsusunog ng insenso. Ang “mga sunugan ng insenso” ay natural at hindi nagpapasya nang higit sa pinahihintulutan ng malawak na kahulugan ng termino.
- source_word: וַיַּשְׁלִיכוּ
  choice: itinapon
  rationale: Ang שׁלך ay nangangahulugang ihagis o itapon. Ang “itinapon” ay natural sa Filipino at ipinahihiwatig ang mariing pagtatanggal sa mga bagay na ito.
- source_word: לְנַחַל קִדְרוֹן
  choice: sa Lambak ng Kidron
  rationale: Ang נחל ay maaaring tumukoy sa lambak, bangin, o batis na pana-panahong dinadaluyan ng tubig. Ang “Lambak ng Kidron” ay madaling maunawaan bilang heograpikong pangalan, habang inilalahad sa talababa ang tunay na lawak ng salitang Hebreo.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na marangal ngunit payak. Ginamit ang “altar” at “insenso,” na pamilyar sa karaniwang mambabasa. Hinati sa dalawang pangungusap ang mahabang koordinasyon ng Hebreo upang maging malinaw, habang pinanatili ang pagkakasunod-sunod at diin ng mga kilos.
