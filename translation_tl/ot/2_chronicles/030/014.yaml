  source_fidelity: 'Tumpak na naipapahayag ang sunod-sunod na kilos sa Hebreo: sila ay tumayo, inalis ang mga altar sa Jerusalem, inalis ang lahat ng mga instalasyong kaugnay ng pagsusunog ng insenso, at itinapon ang mga ito sa Nahal Kidron. Ang “Lambak ng Kidron” ay isang katanggap-tanggap na pangunahing salin para sa נחל, habang pinananatili ng talababa ang mas malawak na saklaw nito.'
  naturalness: Natural at malinaw ang modernong Filipino. Ang paghahati sa dalawang pangungusap ay hindi nakasisira sa daloy o ugnayan ng mga kilos. Ang “Tumayo sila” ay marangal ngunit hindi lipas sa kontekstong pasalaysay.
  terminology: Ang “mga altar,” “insenso,” at “Lambak ng Kidron” ay angkop at pare-pareho ang rehistro. Ang “mga sunugan ng insenso” ay maingat na salin ng malabong הַמְקַטְּרוֹת; maayos ding inilalahad ng talababa ang mga posibleng alternatibo nang hindi pinipilit ang isang tiyak na uri ng instalasyon.
