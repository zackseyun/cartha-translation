  source_fidelity: 'Tumpak ang pangunahing diwa: pagbabawal na tularan ang mga ninuno at kapatid na nagtaksil kay Yahweh, na siyang Diyos ng kanilang mga ninuno, at ang naging resulta ay hayag na nakikita. Gayunman, ang “kapanglawan” ay karaniwang tumutukoy sa lungkot, dalamhati, o kalumbayan, hindi sa pagkawasak/tiwangwang na kalagayan o sa kahindik-hindik na tanawing saklaw ng לְשַׁמָּה.'
  naturalness: Natural ang karamihan ng pangungusap sa modernong Filipino. Mas angkop at mas malinaw sa kontekstong ito ang “kasiraan” kaysa “kapanglawan.” Hindi kailangan ang tuldok-kuwit bago ang “at”; isang kuwit ang mas likas para sa magkaugnay na sugnay.
  terminology: Ang “Yahweh,” “Diyos,” “mga ninuno,” “mga kapatid,” at “nagtaksil” ay angkop at pinananatili ang tipan at pampamilyang retorika ng Hebreo. Ang “kasiraan” ay nakapaghahatid ng pagkawasak at ng pagiging isang babalang kahindik-hindik, habang pinananatili ng talababa ang alternatibong saklaw ng termino.
  issues:
