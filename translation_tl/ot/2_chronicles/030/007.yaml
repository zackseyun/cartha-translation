    issue: Hindi angkop ang “kapanglawan” para sa לְשַׁמָּה.
    rationale: Ang “kapanglawan” ay chiefly sadness or mournfulness. Ang Hebreo ay tumutukoy sa desolation/ruin at maaari ring sa isang bagay na nagdudulot ng sindak o pagkagimbal. Ang “kasiraan” ay mas tapat sa pangunahing kahulugan.
  - severity: low
