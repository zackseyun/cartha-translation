base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/007.yaml
  text: Do not be like your fathers and like your brothers[a], who were unfaithful to Yahweh, the God of their fathers, and he made them a desolation, as you see.
translation:
  language: tl
  text: Huwag kayong tumulad sa inyong mga ninuno at sa inyong mga kapatid, na nagtaksil kay Yahweh, ang Diyos ng kanilang mga ninuno, at ginawa niya silang isang kasiraan, gaya ng nakikita ninyo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאַל תִּהְיוּ
  choice: Huwag kayong tumulad
  rationale: Ang אַל na may imperfect ay nagpapahayag ng pagbabawal. Sa Filipino, mas natural ang “huwag kayong tumulad” kaysa sa literal na “huwag kayong maging gaya,” at malinaw nitong naihahatid ang paghahambing.
- source_word: כַאֲבוֹתֵיכֶם
  choice: sa inyong mga ninuno
  rationale: Maaaring mangahulugan ang אָבוֹת ng mga ama o mga ninuno. Sa pagtukoy sa naunang mga salinlahi, malinaw at natural sa modernong Filipino ang “mga ninuno.”
- source_word: וְכַאֲחֵיכֶם
  choice: at sa inyong mga kapatid
  rationale: Pinananatili ng “mga kapatid” ang pampamilyang pananalita at pagkakaugnay ng bayang tipan; sa konteksto, maaari itong tumukoy nang mas malawak sa mga kalahi.
- source_word: מָעֲלוּ
  choice: nagtaksil
  rationale: Ang מעל ay tumutukoy sa paglabag sa katapatan, lalo na sa ugnayang tipan. Ang “nagtaksil” ay malinaw, mariin, at likas sa Filipino.
- source_word: בַּיהוָה
  choice: kay Yahweh
  rationale: Sa Filipino, “nagtaksil kay” ang natural na parirala. Isinasalin ang banal na pangalang יהוה bilang “Yahweh.”
- source_word: אֱלֹהֵי אֲבוֹתֵיהֶם
  choice: ang Diyos ng kanilang mga ninuno
  rationale: Pinananatili nito ang pormulang tipan at ang pag-uulit ng pagtukoy sa naunang mga salinlahi.
- source_word: וַיִּתְּנֵם
  choice: at ginawa niya silang
  rationale: Bagaman literal na “ibinigay niya sila,” resultative ang gamit kasama ng לְשַׁמָּה. Ang “ginawa niya silang” ay natural at hindi nagdaragdag ng ugnayang layunin o sanhi na wala sa waw sequence.
- source_word: לְשַׁמָּה
  choice: isang kapanglawan
  rationale: Naipahahayag ng “kapanglawan” ang pagkawasak at mapanglaw na kalagayan. Inilalagay sa talababa ang saklaw na maaari ring magpahiwatig ng pangingilabot o pagkabigla sa tanawin.
- source_word: כַּאֲשֶׁר אַתֶּם רֹאִים
  choice: gaya ng nakikita ninyo
  rationale: Direkta nitong ipinahihiwatig na ang sinapit nila ay isang kasalukuyang nakikitang katibayan.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang ginagamit sa talata ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalang tipan nang hindi ito pinapalitan ng isang titulo.
- issue: Ang katangian ng kasalanang tinutukoy ng מעל
  choice: nagtaksil kay Yahweh
  alternative: nagkasala laban kay Yahweh; hindi naging tapat kay Yahweh
  rationale: Pinananatili ng “nagtaksil” ang bigat ng paglabag sa katapatan sa Diyos nang hindi nililimitahan ang salita sa isang teknikal o denominasyonal na paliwanag.
translation_notes:
  register: Modernong Filipino na malinaw ngunit marangal. Ginamit ang “mga ninuno” para sa natural na makabagong pagtukoy sa mga naunang salinlahi, at pinanatili ang “mga kapatid” upang maingatan ang pampamilyang retorika. Inilagay ang talababa sa “kapanglawan,” ang salitang talagang may leksikal na alternatibo.
