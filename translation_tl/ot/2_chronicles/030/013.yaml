base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/013.yaml
  text: A great many people gathered in Jerusalem to keep the Festival of Unleavened Bread in the second month[b][a], a very great assembly.
translation:
  language: tl
  text: Napakaraming tao ang nagtipon sa Jerusalem upang ipagdiwang[a] ang Pista ng Tinapay na Walang Pampaalsa[b] sa ikalawang buwan—isang napakalaking kapulungan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ganapin” o “ipangilin”; literal na “gawin” ang pista.
    reason: lexical_alternative
  - marker: b
    text: O “Kapistahan ng Tinapay na Walang Pampaalsa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּאָסְפוּ
  choice: nagtipon
  rationale: Ang Niphal ng אסף ay nagsasaad ng pagtitipon o pagkakatipon. Likas sa modernong Tagalog ang “nagtipon” at malinaw nitong inilalarawan ang sama-samang pagdating ng mga tao.
- source_word: יְרוּשָׁלִַם
  choice: Jerusalem
  rationale: Ginamit ang karaniwang anyo ng pangalan ng lungsod sa Filipino.
- source_word: עַם רָב
  choice: napakaraming tao
  rationale: Ipinahahayag ng parirala ang malaking bilang ng mga tao. Pinananatili ng “napakaraming tao” ang diin sa dami at natural itong basahin.
- source_word: לַעֲשׂוֹת
  choice: upang ipagdiwang
  rationale: Bagaman literal na “gawin,” sa idyomang Hebreo na may pista bilang layon ay tumutukoy ito sa pagdiriwang o pagtupad sa kapistahan. Ang “ipagdiwang” ang pinakanatural sa kasalukuyang Tagalog.
- source_word: חַג הַמַּצּוֹת
  choice: ang Pista ng Tinapay na Walang Pampaalsa
  rationale: Ang חַג ay isang relihiyosong kapistahan, at ang מַצּוֹת ay tinapay na walang pampaalsa. Ang “Pista” ay malinaw at madaling maunawaan sa modernong Filipino.
- source_word: בַּחֹדֶשׁ הַשֵּׁנִי
  choice: sa ikalawang buwan
  rationale: Tuwirang salin na nagpapanatili sa mahalagang pagtukoy sa panahon sa konteksto.
- source_word: קָהָל
  choice: kapulungan
  rationale: Tumutukoy ang קָהָל sa nagkakatipong pamayanan. Ang “kapulungan” ay marangal at hindi nagdaragdag ng partikular na eklesiastikong kahulugan.
- source_word: לָרֹב מְאֹד
  choice: napakalaking
  rationale: Matinding pagpapahayag ito ng laki o dami ng kapulungan. Natural na naihahatid ng “napakalaking” ang diin ng Hebreo.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa pampublikong pagbasa. Pinanatili ang pag-uulit ng diwa ng napakaraming tao at napakalaking kapulungan dahil naroon din ang retorikal na diin sa Hebreo.
