  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang pag-uulit ng “sa Jerusalem” at ang malawak na saklaw ng “kagalakan”; walang idinagdag na denominasyonal o interpretatibong paliwanag.
