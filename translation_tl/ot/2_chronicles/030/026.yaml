base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/026.yaml
  text: So there was great joy in Jerusalem, for since the days of Solomon son of David, king of Israel, there had been nothing like this in Jerusalem.
translation:
  language: tl
  text: Kaya nagkaroon ng malaking kagalakan sa Jerusalem, sapagkat mula pa noong panahon ni Solomon na anak ni David, hari ng Israel, ay wala pang nangyaring tulad nito sa Jerusalem.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתְּהִי
  choice: Kaya nagkaroon
  rationale: Ang waw-consecutive na may היה ay nagpapatuloy sa salaysay at dito ay likas na nagpapahiwatig ng bunga ng naunang mga pangyayari. Ipinahahayag ito ng “Kaya nagkaroon” sa natural na modernong Tagalog.
- source_word: שִׂמְחָה גְדוֹלָה
  choice: malaking kagalakan
  rationale: Tuwirang pinananatili ang pangngalan at panuring, pati ang diwa ng matindi at sama-samang kagalakan, nang hindi ito nililimitahan sa isang partikular na anyo ng pagdiriwang.
- source_word: בִּירוּשָׁלָם
  choice: sa Jerusalem
  rationale: Karaniwang lokatibong salin ng ב sa natural na Tagalog.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala ng כִּי ang paliwanag o batayan ng naunang pahayag. Ang “sapagkat” ay malinaw, marangal, at angkop sa rehistro.
- source_word: מִימֵי
  choice: mula pa noong panahon ni
  rationale: Ipinahahayag nito ang panahong nagsisimula sa nakaraan at umaabot hanggang sa pangyayaring tinutukoy. Mas natural sa Tagalog ang isahang “panahon” kaysa literal na “mga araw” sa ganitong idyoma.
- source_word: שְׁלֹמֹה בֶן דָּוִיד
  choice: Solomon na anak ni David
  rationale: Tuwirang pinananatili ang ugnayang construct at gumagamit ng karaniwang anyo ng pangalan sa Tagalog na tradisyong biblikal.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: hari ng Israel
  rationale: Pinananatili bilang appositional na titulo ni Solomon, gaya ng Hebreo.
- source_word: לֹא כָזֹאת
  choice: wala pang nangyaring tulad nito
  rationale: Literal na “hindi gaya nito,” na may ipinahihiwatig na pangyayari mula sa konteksto. Ang “wala pang nangyaring tulad nito” ay natural sa Tagalog at pinananatili ang paghahambing nang hindi tinutukoy nang higit sa teksto kung aling aspeto ang natatangi.
- source_word: בִּירוּשָׁלָם
  choice: sa Jerusalem
  rationale: Inuulit ang lokatibong parirala upang mapanatili ang pag-uulit at retorikal na balangkas ng Hebreo.
theological_decisions: []
