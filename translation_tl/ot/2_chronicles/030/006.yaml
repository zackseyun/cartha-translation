source:
  edition: WLC
  text: וַ/יֵּלְכוּ֩ הָ/רָצִ֨ים בָּֽ/אִגְּר֜וֹת מִ/יַּ֧ד הַ/מֶּ֣לֶךְ וְ/שָׂרָ֗י/ו בְּ/כָל יִשְׂרָאֵל֙ וִֽ/יהוּדָ֔ה וּ/כְ/מִצְוַ֥ת הַ/מֶּ֖לֶךְ לֵ/אמֹ֑ר בְּנֵ֣י יִשְׂרָאֵ֗ל שׁ֚וּבוּ אֶל יְהוָ֗ה אֱלֹהֵי֙ אַבְרָהָם֙ יִצְחָ֣ק וְ/יִשְׂרָאֵ֔ל וְ/יָשֹׁב֙ אֶל הַ/פְּלֵיטָ֔ה הַ/נִּשְׁאֶ֣רֶת לָ/כֶ֔ם מִ/כַּ֖ף מַלְכֵ֥י אַשּֽׁוּר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/006.yaml
  text: So the couriers went with the letters from the hand of the king and his officials throughout all Israel and Judah[a], according to the command of the king, saying, “Sons of Israel, return to Yahweh, the God of Abraham, Isaac, and Israel[b], that he may return to the remnant that has escaped and remains to you from the hand of the kings of Assyria.”
translation:
  language: tl
  text: Kaya naglakbay ang mga sugo sa buong Israel at Juda, dala ang mga sulat mula sa kamay ng hari at ng kanyang mga pinuno. Ayon sa utos ng hari, sinabi nila, “Mga anak ng Israel, manumbalik kayo kay Yahweh, ang Diyos nina Abraham, Isaac, at Israel[a], upang manumbalik siya sa nalalabing pangkat ng mga nakaligtas sa inyo[b] mula sa kamay ng mga hari ng Asiria.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: “Israel,” hindi ang mas pamilyar na “Jacob.”'
    reason: alternative_reading
  - marker: b
    text: 'Maaari ring isalin: “sa pangkat ng mga nakaligtas na nananatili sa inyo.”'
    reason: previous_rendering
lexical_decisions:
- source_word: הָרָצִים
  choice: mga sugo
  rationale: Literal itong tumutukoy sa ‘mga mananakbo,’ ngunit sa konteksto ay mga opisyal na tagapagdala sila ng mga sulat ng hari. Ang ‘mga sugo’ ay natural sa Filipino at angkop sa kanilang tungkulin.
- source_word: בָּאִגְּרוֹת
  choice: dala ang mga sulat
  rationale: Ang אִגְּרוֹת ay mga liham o opisyal na sulat. Ipinahahayag ng ‘dala ang mga sulat’ ang instrumental na gamit ng pang-ukol at malinaw na inilalarawan ang gawain ng mga sugo.
- source_word: מִיַּד הַמֶּלֶךְ וְשָׂרָיו
  choice: mula sa kamay ng hari at ng kanyang mga pinuno
  rationale: Pinananatili ng ‘mula sa kamay’ ang Hebreong larawan ng tuwirang pagkakaloob at kapahintulutan. Ang שָׂרָיו ay isinaling ‘kanyang mga pinuno’ bilang pangkalahatang tawag sa matataas na opisyal.
- source_word: בְּכָל יִשְׂרָאֵל וִיהוּדָה
  choice: sa buong Israel at Juda
  rationale: Ipinahahayag ng ‘sa buong’ ang lawak ng paglalakbay ng mga sugo sa mga lupaing ito.
- source_word: וּכְמִצְוַת הַמֶּלֶךְ
  choice: Ayon sa utos ng hari
  rationale: Dito ang מִצְוָה ay utos ng isang hari, kaya ‘utos’ ang malinaw at natural na katumbas.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: Mga anak ng Israel
  rationale: Malapit itong sumusunod sa anyong panlalaking maramihan ng Hebreo at pinananatili ang nakaugaliang katawagan sa sambayanang nagmula kay Israel.
- source_word: שׁוּבוּ אֶל יְהוָה
  choice: manumbalik kayo kay Yahweh
  rationale: Ang ‘manumbalik’ ay naghahatid ng diwa ng pagbabalik-loob at pagpapanumbalik ng ugnayang tipan, at kasabay nito ay tumutugma sa kasunod na paggamit ng parehong pandiwang Hebreo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasatitik ang personal na pangalang banal sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֵי אַבְרָהָם יִצְחָק וְיִשְׂרָאֵל
  choice: ang Diyos nina Abraham, Isaac, at Israel
  rationale: Israel ang tahasang nakasulat sa Hebreo, hindi Jacob; hindi ito itinugma sa mas pamilyar na pormula.
- source_word: וְיָשֹׁב
  choice: upang manumbalik siya
  rationale: Ang pandiwang kasunod ng pautos ay maaaring magpahayag ng layunin o bunga. Pinananatili rin ng ‘manumbalik’ ang sadyang pag-uulit ng ugat na שׁוב.
- source_word: הַפְּלֵיטָה הַנִּשְׁאֶרֶת לָכֶם
  choice: sa mga nakaligtas na natitira sa inyo
  rationale: Pinagsasama ng parirala ang ideya ng mga nakatakas sa kapahamakan at ng nalalabing bahagi ng sambayanan. Ang ‘sa inyo’ ay likas na pagpapahayag ng לָכֶם sa kontekstong ito.
- source_word: מִכַּף מַלְכֵי אַשּׁוּר
  choice: mula sa kamay ng mga hari ng Asiria
  rationale: Pinananatili ang konkretong Hebreong larawan ng ‘kamay’ bilang kapangyarihan o paghahari, pati ang maramihang ‘mga hari.’
theological_decisions:
- issue: Pagpapahayag sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo. Pinananatili ng ‘Yahweh’ ang pangalan sa halip na palitan ito ng titulo.
- issue: Israel o Jacob sa talaan ng mga patriyarka
  choice: Israel
  alternative: Jacob
  rationale: Tahasan at di-karaniwan ang ‘Israel’ sa tekstong Hebreo. Hindi ito dapat itugma sa mas pamilyar na ‘Abraham, Isaac, at Jacob.’
- issue: Ugnayan ng pagbabalik ng bayan at ng pagbabalik ni Yahweh
  choice: upang manumbalik siya
  alternative: at manunumbalik siya
  rationale: Maaaring magpahiwatig ang וְיָשֹׁב ng layunin o bunga kasunod ng pautos. Ang salin ay hindi ginagawang ganap na walang pasubali ang tugon ni Yahweh at pinananatili ang katumbasang ‘manumbalik … manumbalik.’
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang ‘manumbalik’ upang maipakita ang tipanang diwa at ang pag-uulit ng Hebreong שׁוב. Hinati sa dalawang pangungusap ang mahabang panimulang sugnay para sa malinaw at natural na pagbasa nang hindi binabago ang lohika ng teksto.
