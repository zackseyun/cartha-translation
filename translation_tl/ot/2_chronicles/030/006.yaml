  terminology: 'Wasto ang “Yahweh,” “Diyos,” “Asiria,” at “Mga anak ng Israel.” Dapat itama ang talababa b: ang kasalukuyang “para sa inyo” ay hindi likas na paglalarawan ng nalalabi at ang dahilan nito ay isang alternatibong pagsasalin, hindi textual ambiguity.'
