  text: וַ/יַּעֲשׂ֣וּ בְנֵֽי יִ֠שְׂרָאֵל הַ/נִּמְצְאִ֨ים בִּ/ירוּשָׁלִַ֜ם אֶת חַ֧ג הַ/מַּצּ֛וֹת שִׁבְעַ֥ת יָמִ֖ים בְּ/שִׂמְחָ֣ה גְדוֹלָ֑ה וּֽ/מְהַלְלִ֣ים לַ֠/יהוָה י֣וֹם בְּ/י֞וֹם הַ/לְוִיִּ֧ם וְ/הַ/כֹּהֲנִ֛ים בִּ/כְלֵי עֹ֖ז לַ/יהוָֽה־־׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/021.yaml
  text: And the sons of Israel who were found in Jerusalem kept the Feast of Unleavened Bread for seven days with great joy[b][a], and the Levites and the priests praised Yahweh day by day with mighty instruments to Yahweh.
translation:
  language: tl
  text: Ipinagdiwang ng mga Israelitang naroon sa Jerusalem ang Kapistahan ng Tinapay na Walang Pampaalsa sa loob ng pitong araw nang may malaking kagalakan. Araw-araw, nagpuri kay Yahweh ang mga Levita at mga pari sa pamamagitan ng malalakas na instrumento[a] para kay Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literal: “mga instrumento ng lakas.” Maaari ring “mga instrumentong malakas ang tunog.”'
    reason: Pinananatili ang leksikal na kalabuan ng בִּכְלֵי עֹז, na maaaring tumukoy sa makapangyarihan o malakas-tunog na mga instrumento.
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: ipinagdiwang
  rationale: Kapag ang עשה ay may layong חַג, tumutukoy ito sa pagdiriwang o pangingilin ng isang kapistahan; natural sa makabagong Tagalog ang “ipinagdiwang.”
- source_word: בְנֵי יִשְׂרָאֵל
  choice: mga Israelita
  rationale: Bagaman literal na “mga anak na lalaki ng Israel,” ang parirala rito ay katawagan sa bayang Israel; malinaw at likas sa Tagalog ang “mga Israelita.”
- source_word: הַנִּמְצְאִים בִּירוּשָׁלִַם
  choice: naroon sa Jerusalem
  rationale: Ang literal na “mga natagpuan sa Jerusalem” ay idyomatikong tumutukoy sa mga taong naroon; iniiwasan ng salin ang di-likas na pahayag sa Tagalog.
- source_word: חַג הַמַּצּוֹת
  choice: Kapistahan ng Tinapay na Walang Pampaalsa
  rationale: Kinikilalang pangalan ng kapistahan at malinaw sa karaniwang mambabasa.
- source_word: בְּשִׂמְחָה גְדוֹלָה
  choice: nang may malaking kagalakan
  rationale: Tuwirang ipinapahayag ang tindi ng kanilang kagalakan sa marangal at likas na Tagalog.
- source_word: וּמְהַלְלִים
  choice: nagpuri
  rationale: Ang participle ay nagsasaad ng nagpapatuloy na gawain habang idinaraos ang kapistahan; sapat itong naipahihiwatig ng konteksto at ng “araw-araw.”
- source_word: יוֹם בְּיוֹם
  choice: araw-araw
  rationale: Likas na katumbas sa Tagalog ng distributibong idyomang Hebreo.
- source_word: בִּכְלֵי עֹז
  choice: sa pamamagitan ng malalakas na instrumento
  rationale: Mahirap at bahagyang malabo ang parirala, na literal na “mga instrumento ng lakas.” Ang “malalakas na instrumento” ay nagpapanatili sa diwa ng עֹז nang hindi tiyak na nililimitahan ito sa lakas ng tunog; inilalahad sa talababa ang ibang posibilidad.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang Hebreo sa halip na palitan ito ng isang titulo.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Personal na pangalan ang nasa tekstong Hebreo; pinananatili ng “Yahweh” ang kaibhan nito sa titulong “Panginoon.”
- issue: Kaugnayan ng לַיהוָה sa hulihan ng talata
  choice: para kay Yahweh
  alternative: kay Yahweh
  rationale: Maaaring ipahiwatig ng לְ ang patutunguhan, layunin, o kapakinabangan. Ang “para kay Yahweh” ay natural sa Tagalog at naglalarawan na ang pagtugtog ay ukol sa kanyang pagsamba nang hindi ito ginagawang hiwalay na doktrinal na pahayag.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mga Israelita” at “naroon” sa halip na mga sobrang literal ngunit di-likas na anyo. Hinati sa dalawang pangungusap upang maging madaling basahin habang pinananatili ang ugnayan at pagkakasunod ng mga sugnay sa Hebreo.
