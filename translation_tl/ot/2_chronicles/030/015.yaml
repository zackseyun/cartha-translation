  text: וַ/יִּשְׁחֲט֣וּ הַ/פֶּ֔סַח בְּ/אַרְבָּעָ֥ה עָשָׂ֖ר לַ/חֹ֣דֶשׁ הַ/שֵּׁנִ֑י וְ/הַ/כֹּהֲנִ֨ים וְ/הַ/לְוִיִּ֤ם נִכְלְמוּ֙ וַ/יִּֽתְקַדְּשׁ֔וּ וַ/יָּבִ֥יאוּ עֹל֖וֹת בֵּ֥ית יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/015.yaml
  text: And they slaughtered the Passover lamb on the fourteenth day of the second month. Then the priests and the Levites were ashamed and consecrated themselves[a], and they brought burnt offerings to the house of Yahweh.
translation:
  language: tl
  text: At kinatay nila ang handog na Paskuwa[a] sa ikalabing-apat na araw ng ikalawang buwan. Napahiya ang mga pari at ang mga Levita; naging banal sila at nagdala ng mga handog na sinusunog sa bahay ni Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “ang Paskuwa”; dito, tumutukoy ito sa hayop o handog na Paskuwa na kinatay.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁחֲטוּ
  choice: kinatay nila
  rationale: Tuwirang ipinapahayag ng pandiwa ang pagkatay ng hayop sa konteksto ng paghahandog, nang hindi idinaragdag na ang mga gumagawa nito ay mga pari o Levita.
- source_word: הַפֶּסַח
  choice: ang kordero ng Paskuwa
  rationale: Sa kontekstong ito, ang Paskuwa ang mismong hayop na kinakatay. Nililinaw ng “kordero ng Paskuwa” ang tinutukoy sa likas na Tagalog, habang itinatala sa talababa ang literal na anyo.
- source_word: בְּאַרְבָּעָה עָשָׂר לַחֹדֶשׁ הַשֵּׁנִי
  choice: nang ikalabing-apat na araw ng ikalawang buwan
  rationale: Likas at malinaw na pagpapahayag sa Tagalog ng petsang nasa tekstong Hebreo.
- source_word: הַכֹּהֲנִים
  choice: ang mga pari
  rationale: Karaniwang katumbas sa Tagalog para sa mga tauhang naglilingkod bilang saserdote.
- source_word: הַלְוִיִּם
  choice: ang mga Levita
  rationale: Karaniwang katawagan sa mga kabilang sa lipi ni Levi na may natatanging tungkulin sa paglilingkod.
- source_word: נִכְלְמוּ
  choice: napahiya
  rationale: Ipinapakita ang kanilang pagkaranas ng hiya o kahihiyan; mas likas ito sa makabagong Tagalog kaysa sa mas mabigat na “hinamak.”
- source_word: וַיִּתְקַדְּשׁוּ
  choice: itinalaga nila ang kanilang sarili
  rationale: Ipinahahayag ang ritwal na paghahanda o pagtatalaga ng sarili para sa banal na paglilingkod nang hindi ipinapalagay ang mga hakbang na hindi tahasang binanggit.
- source_word: וַיָּבִיאוּ עֹלוֹת
  choice: nagdala sila ng mga handog na sinusunog
  rationale: Pinananatili ang teknikal na diwa ng עֹלוֹת bilang mga handog na lubusang sinusunog, sa malinaw na Tagalog.
- source_word: בֵּית יְהוָה
  choice: sa bahay ni Yahweh
  rationale: Pinananatili ang literal at pormal na katawagang “bahay” sa halip na palitan ito ng interpretibong “templo,” at isinasalin ang banal na pangalan bilang Yahweh.
theological_decisions:
- issue: Pagpapahayag sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Ang Hebreo ay tahasang gumagamit ng Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalang tipan sa halip na palitan ito ng isang titulo.
- issue: Kahulugan ng וַיִּתְקַדְּשׁוּ sa ritwal na konteksto
  choice: itinalaga nila ang kanilang sarili
  alternative: nilinis nila ang kanilang sarili; pinabanal nila ang kanilang sarili
  rationale: Ipinakikita ng anyo ng pandiwa ang kanilang sariling pagkilos upang maging handa sa banal na paglilingkod. Ang “itinalaga” ay nagpapanatili sa ritwal na diwa nang hindi nililimitahan ito sa pisikal na paglilinis o nagmumungkahi ng lubos na moral na kabanalan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Paskuwa,” “mga Levita,” at “mga handog na sinusunog” bilang madaling makilalang mga terminong biblikal. Ang “kaya” ay nagpapahayag ng likas na ugnayan ng kanilang pagkapahiya at kasunod na pagtatalaga, bagaman simpleng pang-ugnay lamang ang nasa Hebreo.
