  source_fidelity: Kailangang alisin ang “kordero,” dahil ang הַפֶּסַח ay tumutukoy sa hayop o handog ng Paskuwa ngunit hindi nito tinutukoy ang uri ng hayop sa talatang ito. Mas tumpak ang “handog na Paskuwa.” Ang “kaya” ay nagdaragdag ng hayagang ugnayang sanhi-bunga na wala sa simpleng sunod-sunod na וַ sa Hebreo.
  naturalness: Natural at marangal ang pangungusap pagkatapos palitan ang “nang ikalabing-apat na araw” ng mas karaniwang “sa ikalabing-apat na araw” at alisin ang di-kinakailangang “kaya.”
  terminology: Panatilihin ang “Paskuwa,” “mga pari,” “mga Levita,” “mga handog na sinusunog,” at “Yahweh.” Ang “naging banal” ay isang malinaw at tuwirang modernong Filipino na katumbas ng ritwal na pagsasatalaga/pagpapabanal ng sarili.
  issues:
  - severity: medium
    issue: Ang “kordero ng Paskuwa” ay mas tiyak kaysa sa Hebreo.
    rationale: Ang הַפֶּסַח sa kontekstong ito ay ang hayop o handog na Paskuwa, ngunit hindi tinutukoy ng salita mismo na ito ay kordero. Maaari ring saklawin ng tradisyong ritwal ang ibang hayop; kaya hindi dapat ipasok ang espesipikasyong wala sa talata.
  - severity: low
    issue: Ang “kaya” ay nagdaragdag ng ugnayang sanhi-bunga.
    rationale: Ang Hebreo ay gumagamit lamang ng pang-ugnay na waw para sa kasunod na pangyayari. Maaaring lohikal ang ugnayan sa mas malawak na konteksto, ngunit hindi ito dapat gawing tahasang sanhi sa salin.
  - severity: low
    issue: Ang “itinalaga nila ang kanilang sarili” ay hindi gaanong tuwiran para sa ritwal na reflexive na pandiwa.
    rationale: Ang וַיִּתְקַדְּשׁוּ ay tumutukoy sa kanilang pagpapabanal o ritwal na paghahanda ng sarili. Ang “naging banal” ay mas maikli, likas, at pinananatili ang saklaw ng pandiwa.
