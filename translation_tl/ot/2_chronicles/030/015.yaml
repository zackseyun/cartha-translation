revisions:
- from: At kinatay nila ang kordero ng Paskuwa[a] nang ikalabing-apat na araw ng ikalawang buwan. Napahiya ang mga pari at ang mga Levita, kaya itinalaga nila ang kanilang sarili at nagdala sila ng mga handog na sinusunog sa bahay ni Yahweh.
  to: At kinatay nila ang handog na Paskuwa[a] sa ikalabing-apat na araw ng ikalawang buwan. Napahiya ang mga pari at ang mga Levita; naging banal sila at nagdala ng mga handog na sinusunog sa bahay ni Yahweh.
