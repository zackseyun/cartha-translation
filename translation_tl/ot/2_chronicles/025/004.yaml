  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/אֶת בְּנֵי/הֶ֖ם לֹ֣א הֵמִ֑ית כִּ֣י כַ/כָּת֣וּב בַּ/תּוֹרָ֡ה בְּ/סֵ֣פֶר מֹשֶׁה֩ אֲשֶׁר צִוָּ֨ה יְהוָ֜ה לֵ/אמֹ֗ר לֹא יָמ֨וּתוּ אָב֤וֹת עַל בָּנִים֙ וּ/בָנִים֙ לֹא יָמ֣וּתוּ עַל אָב֔וֹת כִּ֛י אִ֥ישׁ בְּ/חֶטְא֖/וֹ יָמֽוּתוּ־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/004.yaml
  text: But he did not put their sons to death[a], because it is written in the Law, in the Book of Moses, where Yahweh commanded, saying, “Fathers shall not be put to death for sons, and sons shall not be put to death for fathers, but each man shall die for his own sin.”
translation:
  language: tl
  text: 'Ngunit hindi niya ipinatay ang mga anak nilang lalaki, sapagkat ayon sa nakasulat sa Kautusan, sa Aklat ni Moises, kung saan iniutos ni Yahweh: “Hindi dapat ipapatay ang mga ama dahil sa kanilang mga anak na lalaki, at hindi rin dapat ipapatay ang mga anak na lalaki dahil sa kanilang mga ama.[a] Kundi ang bawat isa ay mamamatay dahil sa sarili niyang kasalanan.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “Hindi mamamatay ang mga ama dahil sa mga anak na lalaki, at hindi mamamatay ang mga anak na lalaki dahil sa mga ama.” Isinalin sa teksto na “hindi dapat ipapatay” upang linawin ang legal na diwa ng Hebreong pananalita.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֶת בְּנֵי/הֶם לֹא הֵמִית
  choice: Ngunit hindi niya ipinapatay ang mga anak nila
  rationale: Ipinahihiwatig ng וְ ang pagsalungat sa pagpatay sa mga salarin sa naunang talata, kaya natural ang “Ngunit.” Ang Hiphil na הֵמִית ay causative at may hudisyal na diwa, kaya “ipinapatay” ang ginamit. Ang בְּנֵיהֶם ay pinanatiling “mga anak nila”; sa Filipino, ang “anak” ay natural na katawagang hindi kailangang tukuyin ang kasarian kahit maaaring tumukoy sa mga anak na lalaki sa konteksto.
- source_word: כִּי כַ/כָּתוּב
  choice: sapagkat ayon sa nakasulat
  rationale: Pinananatili nito ang sanhi na ipinahihiwatig ng כִּי at ang pag-apela sa isang nakasulat na pamantayan sa כַכָּתוּב, sa natural na modernong Filipino.
- source_word: בַּ/תּוֹרָה בְּ/סֵפֶר מֹשֶׁה
  choice: sa Kautusan, sa Aklat ni Moises
  rationale: Ang “Kautusan” ay malinaw at pamilyar na salin ng תּוֹרָה sa kontekstong legal at kasulatan; pinananatili ng “Aklat ni Moises” ang pormal na pagtukoy ng Hebreo.
- source_word: אֲשֶׁר צִוָּה יְהוָה לֵ/אמֹר
  choice: 'iniutos ni Yahweh:'
  rationale: Malinaw na ipinakikilala ng pandiwa ang kasunod na tuwirang sipi bilang utos ni Yahweh. Ginagampanan ng tutuldok ang tungkulin ng Hebreong לֵאמֹר sa mas natural na Filipino.
- source_word: לֹא יָמ֨וּתוּ אָב֤וֹת עַל בָּנִים֙ וּ/בָנִים֙ לֹא יָמ֣וּתוּ עַל אָב֔וֹת
  choice: Hindi dapat ipapatay ang mga ama dahil sa kanilang mga anak, at hindi rin dapat ipapatay ang mga anak dahil sa kanilang mga ama
  rationale: Bagaman literal na “mamamatay” ang יָמוּתוּ, legal at hudisyal ang gamit dito, kaya “hindi dapat ipapatay” ang malinaw na katumbas. Ang עַל ay nagpapahayag ng pananagutan o dahilan at isinaling “dahil sa.” Pinanatili ang simetriya ng dalawang sugnay.
- source_word: כִּי אִ֥ישׁ בְּ/חֶטְא֖/וֹ יָמֽוּתוּ
  choice: Sa halip, ang bawat isa ay mamamatay dahil sa sarili niyang kasalanan
  rationale: Kontrastibo ang כִּי rito, kaya “Sa halip.” Ang אִישׁ ay distributibo, at ang “bawat isa” ay natural at inklusibong Filipino nang hindi binabago ang indibidwal na pananagutan. Bagaman maramihan ang anyo ng pandiwa, distributibo ang kahulugan kaya ang isahang “mamamatay” ang angkop.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang ginagamit sa Hebreo ang Tetragrammaton. Ang “Yahweh” ay nagpapanatili rito bilang personal na tipang pangalan sa halip na palitan ng titulo.
- issue: Saklaw ng indibidwal na pananagutan sa sipi
  choice: Pinanatili bilang tuntuning legal tungkol sa pagpapataw ng kamatayan
  alternative: Basahin bilang ganap na pahayag na walang anumang kaugnayan ang kasalanan ng isang salinlahi sa iba
  rationale: Ang agarang konteksto at ang idyomang legal ay tungkol sa hindi pagpatay sa isang tao dahil sa ginawa ng kamag-anak. Hindi pinalawak ng salin ang pahayag tungo sa ibang usaping teolohikal na hindi tahasang tinatalakay ng talata.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “ipinapatay/hindi dapat ipapatay” para sa hudisyal na konteksto, habang iniwasan ang mas teknikal na “bitayin” o “hatulan ng kamatayan,” na maaaring magdagdag ng paraang hindi tinukoy sa Hebreo.
