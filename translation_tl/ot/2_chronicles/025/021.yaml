translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Pinanatili ang Hebreong pagkakasunod na “siya at si Amazias” at ang pag-ahon ni Joas, habang ginawang natural ang idyomang tumutukoy sa harapang engkuwentro.
