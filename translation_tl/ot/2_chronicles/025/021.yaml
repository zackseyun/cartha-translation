base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/021.yaml
  text: So Joash king of Israel went up[a], and he and Amaziah king of Judah faced one another at Beth-shemesh, which belongs to Judah.
translation:
  language: tl
  text: Kaya umakyat si Joas na hari ng Israel, at siya at si Amazias na hari ng Juda ay nagharap[a] sa Bet-semes, na sakop ng Juda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “nagkita nang harapan.” Literal na, “nakita ang mga mukha.”
    reason: Ipinatatalâ ang literal na idyomang Hebreo sa וַיִּתְרָאוּ פָנִים at ang natural na alternatibong salin nito.
lexical_decisions:
- source_word: וַיַּעַל
  choice: umahon
  rationale: Karaniwang salaysay na gamit ng עלה ang pag-ahon o pagpunta paitaas. Pinananatili ng “umahon” ang larawang Hebreo nang hindi tahasang idinaragdag ang diwang militar na “sumalakay,” bagaman naroon iyon sa konteksto.
- source_word: וַיִּתְרָאוּ פָנִים
  choice: nagharap
  rationale: Ang idyoma ay literal na tumutukoy sa pagkikita ng mga mukha. Sa konteksto ng labanan, natural na ipinahahayag ng “nagharap” ang harapang engkuwentro at ang bahid ng komprontasyon.
- source_word: הוּא וַאֲמַצְיָהוּ
  choice: siya at si Amazias
  rationale: Pinananatili ang tahasang panghalip na הוּא, na nagtatampok sa dalawang panig. Malinaw na si Joas ang tinutukoy ng “siya” dahil siya ang naunang paksa.
- source_word: בְּבֵית שֶׁמֶשׁ
  choice: sa Bet-semes
  rationale: Ang “sa” ang natural na pananda ng lugar sa modernong Tagalog. Isinalin sa karaniwang anyong Tagalog ang pangalan ng pook.
- source_word: אֲשֶׁר לִיהוּדָה
  choice: na sakop ng Juda
  rationale: Ipinahahayag nito ang teritoryal na pagkakabilang ng Bet-semes sa Juda. Mas natural sa Tagalog ang “sakop ng Juda” kaysa literal na “pag-aari ng Juda.”
- source_word: מֶלֶךְ יִשְׂרָאֵל / מֶלֶךְ יְהוּדָה
  choice: hari ng Israel / hari ng Juda
  rationale: Tuwirang salin ng mga titulong maharlika sa malinaw at dignified na modernong Tagalog.
