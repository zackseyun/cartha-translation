base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/010.yaml
  text: So Amaziah separated them[a], the troops that had come to him from Ephraim, to go to their place. And they became very angry with Judah and returned to their place in fierce anger.
translation:
  language: tl
  text: Kaya pinaalis ni Amazias ang pangkat ng mga kawal na dumating sa kanya mula sa Efraim upang bumalik sa kanilang lugar. Galit na galit sila sa Juda[a], at bumalik sila sa kanilang lugar na nagngangalit sa galit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: laban sa Juda.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּבְדִּילֵם
  choice: pinauwi
  rationale: Ang literal na diwa ay ‘inihiwalay sila,’ ngunit sa kontekstong militar ay pinaalis sila ni Amazias sa hukbo upang bumalik sa kanilang lugar. Likas at malinaw sa modernong Tagalog ang ‘pinauwi.’
- source_word: לְהַגְּדוּד
  choice: ang mga kawal
  rationale: Ang גְּדוּד ay isang pangkat o yunit ng mga mandirigma. Ang ‘mga kawal’ ay malinaw at angkop sa kontekstong militar.
- source_word: אֲשֶׁר בָּא אֵלָיו מֵאֶפְרַיִם
  choice: na dumating sa kanya mula sa Efraim
  rationale: Tuwirang tinutukoy ng sugnay ang mga kawal na dating dumating kay Amazias mula sa Efraim.
- source_word: לָלֶכֶת לִמְקוֹמָם
  choice: pinauwi
  rationale: Ang pariralang ‘upang pumunta sa kanilang lugar’ ay isinama sa pandiwang ‘pinauwi’ upang maging natural sa Tagalog nang hindi binabago ang kilos na inilalarawan.
- source_word: וַיִּחַר אַפָּם מְאֹד
  choice: galit na galit sila
  rationale: Natural na salin ito ng idyomang Hebreo tungkol sa matinding pag-alab ng galit.
- source_word: בִּיהוּדָה
  choice: sa Juda
  rationale: Minamarkahan ng pang-ukol ang Juda bilang tudlaan ng kanilang galit; sapat at likas sa Tagalog ang ‘sa Juda.’
- source_word: וַיָּשׁוּבוּ לִמְקוֹמָם
  choice: umuwi sila
  rationale: Ang שׁוב ay ‘bumalik.’ Sa konteksto, malinaw na bumalik sila sa sarili nilang lugar, kaya natural ang ‘umuwi.’
- source_word: בָּחֳרִי אָף
  choice: na nagngangalit sa galit
  rationale: Pinananatili nito ang matinding init at bagsik ng galit na ipinahahayag ng pariralang Hebreo.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na dignified ngunit madaling maunawaan. Pinagsama sa ‘pinauwi’ ang paghihiwalay sa hukbo at ang layuning bumalik sila sa kanilang lugar, upang maiwasan ang alanganing literalismo. Iningatan ang pag-uulit at paglala ng galit sa huling dalawang sugnay.
