  yaml_path: translation/ot/2_chronicles/025/002.yaml
  text: He did what was right in the eyes of Yahweh[a], yet not with a whole heart.
translation:
  language: tl
  text: Ginawa niya ang tama sa paningin ni Yahweh, ngunit hindi nang buong puso.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin na “hindi nang may ganap na puso” o “hindi buong-puso.” Literal sa Hebreo: “hindi sa isang buo/ganap na puso,” na tumutukoy sa hindi lubos na debosyon.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Ginawa niya
  rationale: Ang waw-consecutive imperfect ay nagsasalaysay ng naganap na kilos. Hindi na kailangang isalin ang panimulang waw bilang “at” upang maging natural sa Tagalog.
- source_word: הַיָּשָׁר
  choice: ang tama
  rationale: Ang pang-uring may pantukoy ay ginagamit bilang pangngalan at tumutukoy sa bagay na matuwid o tama; natural sa modernong Tagalog ang “ang tama.”
- source_word: בְּעֵינֵי יְהוָה
  choice: sa paningin ni Yahweh
  rationale: Pinananatili nito ang malinaw na Hebreong idyoma ng pagsusuri ayon sa pananaw ni Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasatitik ang personal na pangalan sa Tetragrammaton sa halip na palitan ito ng isang titulo.
- source_word: רַק
  choice: ngunit
  rationale: Dito ay nililimitahan o kinukuwalipika ng רַק ang naunang positibong pahayag; malinaw at natural na ipinahahayag ito ng “ngunit.”
- source_word: לֹא
  choice: hindi
  rationale: Tuwirang katumbas ng payak na pagtanggi.
- source_word: בְּלֵבָב שָׁלֵם
  choice: nang buong puso
  rationale: Pinananatili ang metapora ng buo o ganap na puso habang natural na ipinahahayag sa Tagalog ang kakulangan ng lubos na debosyon.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; ang PANGINOON
  rationale: Tuwirang ginagamit ng Hebreo ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng titulo.
- issue: Antas ng debosyon ni Amazias
  choice: hindi nang buong puso
  alternative: hindi nang may ganap na puso; hindi buong-puso
  rationale: 'Pinananatili nito ang tensiyon sa teksto: tama ang kanyang ginawa ayon sa panlabas na pagsusuri, ngunit hindi buo ang kanyang panloob na katapatan. Hindi nito pinalalakas ang pahayag tungo sa tahasang pagkukunwari o kawalan ng anumang katapatan.'
translation_notes:
  register: Modernong Filipino Tagalog na simple ngunit marangal. Pinanatili ang Hebreong idyomang “sa paningin” at ang metapora ng “buong puso,” habang ginamit ang natural na ayos na “nang buong puso.”
