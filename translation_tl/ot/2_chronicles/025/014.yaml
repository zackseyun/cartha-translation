base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/014.yaml
  text: It happened[a], after Amaziah came from striking down the Edomites, that he brought the gods of the sons of Seir and set them up for himself as gods; and before them he bowed down[c][b], and to them he burned incense.
translation:
  language: tl
  text: Matapos bumalik si Amazias mula sa pagpabagsak sa mga Edomita, dinala niya ang mga diyos ng mga anak ni Seir[a] at itinayo ang mga ito bilang mga diyos niya. Yumukod siya sa harap ng mga ito[b] at nagsunog ng insenso para sa mga ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “mga diyos ng mga tao ng Seir.” Sa Hebreo: “mga diyos ng mga anak ni Seir.”'
    reason: lexical_alternative
  - marker: b
    text: O “Nagpatirapa siya sa harap ng mga ito.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי בּוֹא
  choice: Pagkabalik ... matapos
  rationale: Ipinahahayag ng parirala ang sumunod na pangyayari nang makabalik si Amazias. Natural sa modernong Tagalog ang “pagkabalik ... matapos” at hindi kailangang tumbasan nang hiwalay ang pormulang pasalaysay na וַיְהִי.
- source_word: מֵהַכּוֹת אֶת אֲדוֹמִים
  choice: matapos niyang pabagsakin ang mga Edomita
  rationale: Ang נכה ay may diwang humampas o nagpabagsak. Pinananatili ng “pabagsakin” ang kongkretong puwersa ng pandiwa nang hindi sinasabing nilipol silang lahat.
- source_word: אֱלֹהֵי בְּנֵי שֵׂעִיר
  choice: mga diyos ng mga anak ni Seir
  rationale: Maramihan at tumutukoy sa mga diyos na pagano ang אֱלֹהֵי. Pinananatili sa pangunahing teksto ang literal na idyomang pangangkan na “mga anak ni Seir,” habang ibinibigay sa talababa ang likas na kahulugang “mga tao ng Seir.”
- source_word: וַיַּעֲמִידֵם לוֹ לֵאלֹהִים
  choice: itinayo ang mga iyon upang maging mga diyos niya
  rationale: Sinasalamin ng “itinayo” ang Hiphil ng עמד, na maaaring tumukoy sa pisikal na paglalagay o pagtatatag ng mga imahen, at ng “upang maging mga diyos niya” ang pag-angkin niya sa mga iyon bilang mga diyos.
- source_word: וְלִפְנֵיהֶם יִשְׁתַּחֲוֶה
  choice: Yumukod siya sa harap ng mga iyon
  rationale: Ang השתחוה ay pagyukod o pagpapatirapa, madalas bilang pagsamba. Pinananatili ng “yumukod” ang pisikal na kilos at hinahayaan ang konteksto na magpahayag ng pagsamba.
- source_word: וְלָהֶם יְקַטֵּר
  choice: nagsunog ng insenso para sa mga iyon
  rationale: Karaniwang tumutukoy ang Piel ng קטר sa pagsusunog ng insenso o handog na pinauusok. Natural at tuwiran sa Tagalog ang napiling parirala.
theological_decisions:
- issue: Paglalarawan sa אֱלֹהִים/אֱלֹהֵי na tumutukoy sa mga diyos na pagano
  choice: mga diyos
  alternative: mga nilalang na banal
  rationale: Malinaw na mga diyos ng Seir na inangkin at sinamba ni Amazias ang tinutukoy. Ang “mga diyos” ang tuwiran at natural na salin at pinananatili ang kabalintunaan at apostasya sa salaysay.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “mga iyon” sa halip na “sila” para malinaw na mga diyus-diyosan o imahen ang tinutukoy. Hindi isinama ang isang talababa ng English consultation layer na mali ang pagkakalugar at inuulit lamang ang unang temporal na sugnay.
