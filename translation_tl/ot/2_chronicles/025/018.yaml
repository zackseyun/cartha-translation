  register: Modernong Filipino Tagalog na malinaw at marangal. Pinanatili ang anyong talinghaga, ang pag-uulit ng Lebanon, at ang payak na pagkakasunod-sunod ng mga pangyayari nang hindi binibigyan ng paliwanag ang simbolismo.
