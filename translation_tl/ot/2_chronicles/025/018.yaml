    issue: Hindi naisasalin ang “ng parang/bukirin” sa חַיַּת הַשָּׂדֶה.
    rationale: Ang Hebreo ay tumutukoy sa hayop ng parang/bukirin, hindi lamang sa isang mabangis na hayop na nasa Lebanon. Maidaragdag ito nang hindi nagiging di-natural ang Tagalog.
  - severity: low
    issue: Ang “nagpasabi” ay mas di-tuwiran kaysa sa inuulit na pandiwang “nagpadala” sa talinghaga.
    rationale: Mas malinaw na “nagpadala ng mensahe” ang pagtutumbas sa שָׁלַח ... לֵאמֹר at pinananatili ang sinadyang pag-uulit ng larawan.
