  to: Pagkatapos ay nagpadala si Joas na hari ng Israel ng mensahe kay Amazias na hari ng Juda. Sinabi niya, “Ang matinik na palumpong[a] sa Lebanon ay nagpadala ng mensahe sa sedro sa Lebanon, ‘Ibigay mo ang anak mong babae sa anak kong lalaki bilang asawa.’ Pagkatapos, dumaan ang isang mabangis na hayop na nasa parang sa Lebanon at niyurakan ang matinik na palumpong.”
