  text: וַ/יִּשְׁלַ֞ח יוֹאָ֣שׁ מֶֽלֶךְ יִשְׂרָאֵ֗ל אֶל אֲמַצְיָ֣הוּ מֶֽלֶךְ יְהוּדָה֮ לֵ/אמֹר֒ הַ/ח֜וֹחַ אֲשֶׁ֣ר בַּ/לְּבָנ֗וֹן שָׁ֠לַח אֶל הָ/אֶ֜רֶז אֲשֶׁ֤ר בַּ/לְּבָנוֹן֙ לֵ/אמֹ֔ר תְּנָֽ/ה אֶת בִּתְּ/ךָ֥ לִ/בְנִ֖/י לְ/אִשָּׁ֑ה וַֽ/תַּעֲבֹ֞ר חַיַּ֤ת הַ/שָּׂדֶה֙ אֲשֶׁ֣ר בַּ/לְּבָנ֔וֹן וַ/תִּרְמֹ֖ס אֶת הַ/חֽוֹחַ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/018.yaml
  text: Then Joash king of Israel sent to Amaziah king of Judah[a], saying, “The thornbush that was in Lebanon sent to the cedar that was in Lebanon, saying, ‘Give your daughter to my son as a wife.’ Then a wild beast of the field that was in Lebanon passed by and trampled the thornbush.”
translation:
  language: tl
  text: Pagkatapos ay nagpadala si Joas na hari ng Israel ng mensahe kay Amazias na hari ng Juda. Sinabi niya, “Ang matinik na palumpong[a] sa Lebanon ay nagpadala ng mensahe sa sedro sa Lebanon, ‘Ibigay mo ang anak mong babae sa anak kong lalaki bilang asawa.’ Pagkatapos, dumaan ang isang mabangis na hayop na nasa parang sa Lebanon at niyurakan ang matinik na palumpong.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “dawag” o “tistle.” Isang halamang matinik ang tinutukoy ng salitang Hebreo; hindi matiyak ang eksaktong uri nito.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחוֹחַ
  choice: ang matinik na palumpong
  rationale: Tumutukoy ang חוֹחַ sa isang halamang matinik na hindi matiyak ang eksaktong uri. Likas sa modernong Tagalog ang “matinik na palumpong” at malinaw ang kaibahan nito sa mataas at matibay na sedro.
- source_word: הָאֶרֶז
  choice: ang sedro
  rationale: Tuwirang tumutukoy ang אֶרֶז sa punong sedro; pinananatili nito ang larawan ng taas at lakas na kasalungat ng mababang palumpong.
- source_word: בַּלְּבָנוֹן
  choice: sa Lebanon
  rationale: Ipinakikita ng parirala ang kinaroroonan ng dalawang halaman at ng hayop. Ang “sa Lebanon” ang natural na anyo sa Tagalog.
- source_word: שָׁלַח ... לֵאמֹר
  choice: nagpadala ... ng mensahe ... Sinabi niya / nagpasabi
  rationale: Ginawang natural sa Tagalog ang Hebreong pormulang “nagpadala ... na sinasabi” habang pinananatili ang kilos ng pagpapadala ng mensahe sa pambungad at sa talinghaga.
- source_word: תְּנָה אֶת־בִּתְּךָ לִבְנִי לְאִשָּׁה
  choice: Ibigay mo ang anak mong babae sa anak kong lalaki bilang asawa
  rationale: Malinaw at likas na ipinahahayag nito ang pormula ng kasunduang pangkasal at pinananatili ang ugnayang ipinahihiwatig ng לְאִשָּׁה.
- source_word: חַיַּת הַשָּׂדֶה
  choice: isang mabangis na hayop
  rationale: Tumutukoy ang parirala sa isang mailap o ligaw na hayop sa lupa. Ang “mabangis na hayop” ay malinaw, marangal, at hindi nagpapalagay ng tiyak na uri.
- source_word: וַתַּעֲבֹר
  choice: dumaan
  rationale: Maikli at natural na inilalarawan nito ang pagdaan ng hayop nang hindi nagdaragdag ng di-tiyak na direksiyon.
- source_word: וַתִּרְמֹס
  choice: niyurakan
  rationale: Matingkad at tuwirang inilalarawan ng “niyurakan” ang pagtapak at pagdurog na ipinahihiwatig ng רמס.
- source_word: וַיִּשְׁלַח ... אֶל ... לֵאמֹר
  choice: nagpadala ... ng mensahe kay ... Sinabi niya
  rationale: Pinananatili ang kahulugan ng pormulang Hebreo ngunit hinati sa dalawang natural na pangungusap upang maiwasan ang alanganing “na sinasabi” sa Tagalog.
