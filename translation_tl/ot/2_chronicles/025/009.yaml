  text: וַ/יֹּ֤אמֶר אֲמַצְיָ֨הוּ֙ לְ/אִ֣ישׁ הָ/אֱלֹהִ֔ים וּ/מַֽה לַּ/עֲשׂוֹת֙ לִ/מְאַ֣ת הַ/כִּכָּ֔ר אֲשֶׁ֥ר נָתַ֖תִּי לִ/גְד֣וּד יִשְׂרָאֵ֑ל וַ/יֹּ֨אמֶר֙ אִ֣ישׁ הָֽ/אֱלֹהִ֔ים יֵ֚שׁ לַֽ/יהוָ֔ה לָ֥/תֶת לְ/ךָ֖ הַרְבֵּ֥ה מִ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/009.yaml
  text: Amaziah said to the man of God[a], “But what should be done about the hundred talents that I have given to the troops of Israel?” The man of God said[b], “Yahweh is able to give you much more than this.”
translation:
  language: tl
  text: Sinabi ni Amazias sa tao ng Diyos, “Pero ano ang gagawin sa isandaang talento[a] na ibinigay ko sa mga kawal ng Israel?” Sumagot ang tao ng Diyos, “Kayang bigyan ka ni Yahweh ng higit pa rito.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo: “ang isandaang talento.” Tinukoy sa naunang talata na mga talento ng pilak ang mga ito.'
    reason: cross_reference
  - marker: b
    text: 'Maaari ring isalin: “May sapat si Yahweh upang bigyan ka ng higit pa rito.” Idiniriin ng pananalitang Hebreo ang kakayahan ni Yahweh na maglaan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ הָאֱלֹהִים
  choice: tao ng Diyos
  rationale: Pinananatili nito ang karaniwang titulong Hebreo para sa isang sugo na inatasan ng Diyos, nang hindi ito nililimitahan sa tungkuling ‘propeta.’
- source_word: וּמַה לַּעֲשׂוֹת
  choice: Pero ano ang gagawin
  rationale: Ipinahihiwatig ng idyoma ang pagtatanong kung ano ang dapat gawin; ang ‘Pero’ ay likas na nagpapakita ng pagtutol ni Amazias sa konteksto.
- source_word: מְאַת הַכִּכָּר
  choice: isandaang talento
  rationale: Ang כִּכָּר ay yunit ng timbang na karaniwang tinatawag na ‘talento.’ Hindi idinagdag sa talata ang ‘pilak’ sapagkat nasa naunang talata lamang ito tahasang binanggit.
- source_word: גְדוּד יִשְׂרָאֵל
  choice: mga kawal ng Israel
  rationale: Sa konteksto, tumutukoy ito sa pangkat ng mga sundalong inupahan mula sa Israel. Ang ‘mga kawal’ ay malinaw at likas sa modernong Filipino.
- source_word: יֵשׁ לַיהוָה לָתֶת לְךָ
  choice: Kayang bigyan ka ni Yahweh
  rationale: 'Likas na ipinapahayag sa Filipino ang diwa ng konstruksiyong Hebreo: may kakayahan at sapat na mapagkukunan si Yahweh upang magbigay.'
- source_word: הַרְבֵּה מִזֶּה
  choice: nang higit pa rito
  rationale: Ipinapahayag nito ang paghahambing at kasaganaan nang malinaw at natural, nang hindi tinutukoy kung gaano kalaki ang higit.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang transliterasyon ng banal na pangalang nasa tekstong Hebreo sa halip na palitan ito ng isang titulo.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; ang PANGINOON
  rationale: Tahasang ginagamit ng talata ang Tetragrammaton; pinananatili ng ‘Yahweh’ ang personal na pangalan sa halip na palitan ito ng titulo.
- issue: Diwa ng kakayahan ni Yahweh na maglaan
  choice: Kayang bigyan ka ni Yahweh nang higit pa rito
  alternative: May sapat si Yahweh upang bigyan ka nang higit pa rito
  rationale: Ipinahihiwatig ng Hebreong konstruksiyon ang kakayahan o mga mapagkukunan ni Yahweh. Pinananatili sa pangunahing teksto ang likas na Filipino, habang inilalagay sa talababa ang mas literal na alternatibo.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang ‘tao ng Diyos’ upang panatilihin ang titulong Hebreo, ‘mga kawal’ para sa likas na katawagang militar, at ‘talento’ bilang tradisyonal na tawag sa sinaunang yunit ng timbang. Inilipat ang panandang [a] sa ‘isandaang talento,’ na siyang aktuwal na tinutukoy ng talababa.
