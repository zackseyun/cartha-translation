base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/025.yaml
  text: Amaziah son of Joash[a], king of Judah, lived fifteen years after the death of Joash son of Jehoahaz, king of Israel.
translation:
  language: tl
  text: Nabuhay pa si Amazias, anak ni Joas at hari ng Juda, nang labinlimang taon matapos mamatay si Joas, anak ni Jehoahaz at hari ng Israel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “nabuhay … nang labinlimang taon matapos mamatay si Joas.” Ibig sabihin, nabuhay si Amazias nang labinlimang taon pa pagkatapos mamatay si Joas ng Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחִי
  choice: Nabuhay pa
  rationale: Ipinahahayag ng pandiwa rito ang patuloy na pagkabuhay ni Amazias sa loob ng isang takdang panahon. Likas sa Filipino ang “nabuhay pa” at ipinakikita nitong lumampas ang buhay niya sa kamatayan ni Joas ng Israel nang hindi gumagamit ng mas interpretatibong “nalampasan niya ang buhay.”
- source_word: אֲמַצְיָהוּ
  choice: Amazias
  rationale: Ginamit ang nakikilalang anyong Filipino ng pangalan, na malapit din sa anyong Hebreo.
- source_word: בֶן
  choice: anak ni
  rationale: Ito ang natural na anyong Filipino para sa genealogical na pagkakakilanlan.
- source_word: יוֹאָשׁ
  choice: Joas
  rationale: Ginamit ang karaniwang anyong Filipino ng pangalan. Ang dalawang Joas sa talata ay malinaw na pinag-iiba sa pamamagitan ng pangalan ng ama at ng kaharian.
- source_word: מֶלֶךְ יְהוּדָה
  choice: hari ng Juda
  rationale: Tuwirang salin ng katungkulan at kahariang pinamumunuan.
- source_word: אַחֲרֵי מוֹת
  choice: pagkamatay ni
  rationale: Natural at maikli sa Filipino, habang pinananatili ang ugnayang kronolohikal ng pariralang Hebreo.
- source_word: יְהוֹאָחָז
  choice: Jehoahaz
  rationale: Transliterasyong malinaw at malapit sa pangalang Hebreo.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: hari ng Israel
  rationale: Tuwirang salin ng katungkulan at kahariang pinamumunuan.
- source_word: חֲמֵשׁ עֶשְׂרֵה שָׁנָה
  choice: nang labinlimang taon
  rationale: Likas na pagpapahayag sa Filipino ng haba ng panahong patuloy siyang nabuhay.
