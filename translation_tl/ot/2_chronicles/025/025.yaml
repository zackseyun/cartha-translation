  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang kronolohikal na anyo ng Hebreo, samantalang ginamit ang natural na “nabuhay pa” upang maipahayag ang patuloy na buhay ni Amazias matapos mamatay ang hari ng Israel.
