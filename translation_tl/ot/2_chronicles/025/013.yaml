base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/013.yaml
  text: But the men of the troop whom Amaziah had sent back from going with him to battle raided the cities of Judah[a], from Samaria to Beth-horon[b], and struck down three thousand of them and took much plunder.
translation:
  language: tl
  text: Ngunit ang mga tauhan ng pangkat na pinabalik ni Amazias at hindi isinama sa kanyang pakikidigma ay sumalakay sa mga lungsod ng Juda, mula sa Samaria hanggang sa Bet-horon.[a] Pumatay sila ng tatlong libo sa kanila[b] at kumuha ng napakaraming samsam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ipinakikita ng pariralang Hebreo ang lawak ng kanilang pagsalakay: “mula sa Samaria hanggang sa Bet-horon.”'
    reason: Nililinaw ang gamit ng heograpikong parirala bilang saklaw ng pagsalakay.
  - marker: b
    text: O “sinaktan nila ang tatlong libo sa kanila.” Malawak ang kahulugan ng pandiwang Hebreo, bagaman sa kontekstong ito ay ipinahihiwatig na napatay ang mga biktima.
    reason: Pinananatili ang leksikal na lawak ng נכה habang ginagamit sa pangunahing teksto ang malinaw na kahulugan nito sa konteksto.
lexical_decisions:
- source_word: וּבְנֵי הַגְּדוּד
  choice: ang mga tauhan ng pangkat
  rationale: Ang literal na “mga anak ng pangkat” ay isang idyoma para sa mga kasapi ng isang pangkat ng mga kawal. Likas sa modernong Tagalog ang “mga tauhan ng pangkat” at hindi nito ipinapalagay ang mas tiyak na laki o organisasyon ng yunit.
- source_word: אֲשֶׁר הֵשִׁיב אֲמַצְיָהוּ מִלֶּכֶת עִמּוֹ לַמִּלְחָמָה
  choice: na pinabalik ni Amazias upang hindi sumama sa kanya sa digmaan
  rationale: Ang Hiphil ng שׁוב ay nangangahulugang “pinabalik,” at ang kasunod na parirala ay nagpapahayag na hindi sila pinasama ni Amazias sa kampanya.
- source_word: וַיִּפְשְׁטוּ
  choice: sumalakay
  rationale: Sa kontekstong militar, ang פשט ay tumutukoy sa biglaang paglusob o pandarambong. Sapat na malinaw at likas ang “sumalakay,” habang ang pagkuha ng samsam ay tahasang binabanggit sa hulihan.
- source_word: בְּעָרֵי יְהוּדָה
  choice: sa mga lungsod ng Juda
  rationale: Tuwirang katumbas ito ng parirala at angkop sa marangal ngunit madaling maunawaang rehistro.
- source_word: מִשֹּׁמְרוֹן וְעַד בֵּית חוֹרוֹן
  choice: mula sa Samaria hanggang sa Bet-horon
  rationale: Pinananatili nito ang heograpikong saklaw na ipinahihiwatig ng מִן ... וְעַד at ang mga pangalang pantangi sa transliterasyon.
- source_word: וַיַּכּוּ מֵהֶם שְׁלֹשֶׁת אֲלָפִים
  choice: Pumatay sila roon ng tatlong libong tao
  rationale: Malawak ang saklaw ng נכה, ngunit sa salaysay ng marahas na pagsalakay at sa pagkakagamit nito kasama ng bilang ng mga biktima, likas na ipinahihiwatig ang nakamamatay na pananakit. Nililinaw ito ng “pumatay,” habang itinatala sa talababa ang mas malapit na alternatibo.
- source_word: וַיָּבֹזּוּ בִּזָּה רַבָּה
  choice: at kumuha ng napakaraming samsam
  rationale: Ang magkaugnay na pandiwa at pangngalan sa Hebreo ay nagbibigay-diin sa lawak ng pandarambong. Inihahatid ng “napakaraming samsam” ang diin nang hindi pilit ang pag-uulit.
