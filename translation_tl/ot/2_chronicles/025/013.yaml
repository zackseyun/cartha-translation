translation_notes:
  register: Modernong Filipino Tagalog na marangal at tuwiran. Ginamit ang “digmaan,” “sumalakay,” at “samsam” bilang mga salitang pamilyar sa biblikal na salaysay ngunit malinaw pa rin sa ordinaryong mambabasa. Ang pangalan ay isina-Tagalog bilang “Amazias,” “Juda,” “Samaria,” at “Bet-horon.”
