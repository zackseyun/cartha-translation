base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/016.yaml
  text: And it happened[a], as he was speaking to him, that the king said to him, “Have we made you the king’s adviser? Stop! Why should they strike you down?” So the prophet stopped and said, “I know that God has determined to destroy you[c][b], because you have done this and have not listened to my counsel.”
translation:
  language: tl
  text: Habang nagsasalita ang propeta sa hari, sinabi ng hari sa kanya, “Itinalaga ka ba naming tagapayo ng hari? Tumigil ka! Bakit ka nila sasaktan[a]?” Kaya tumigil ang propeta at sinabi, “Alam kong ipinasiya[b] ng Diyos na lipulin ka, dahil ginawa mo ito at hindi ka nakinig sa payo ko.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “Bakit ka nila hahampasin?” Hindi tinutukoy kung sino ang maramihang tagaganap; malamang na mga taong magpaparusa sa kanya ayon sa utos ng hari.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “binalak” o “nilayong.” Ang pandiwang Hebreo ay kaugnay ng pagpapayo o pagpaplano.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַלְיוֹעֵץ לַמֶּלֶךְ נְתַנּוּךָ
  choice: Itinalaga ka ba naming tagapayo ng hari?
  rationale: Pinananatili ang retorikal na tanong, ang unang panauhang maramihan sa נְתַנּוּךָ, at ang diwa ng isang opisyal na tagapayo sa hari. Likas at malinaw sa modernong Filipino ang “itinalaga” at “tagapayo.”
- source_word: חֲדַל
  choice: Tumigil ka!
  rationale: Tuwiran at mariing utos na ihinto ng propeta ang pagsasalita.
- source_word: לָמָּה יַכּוּךָ
  choice: Bakit ka pa nila sasaktan?
  rationale: Pinananatili ang di-tiyak na maramihang tagaganap ng pandiwa at ang nagbabantang tono, nang hindi tiyakang ipinapalagay na kamatayan ang ibig sabihin ng paghampas o pananakit.
- source_word: יָעַץ אֱלֹהִים
  choice: ipinasiya ng Diyos
  rationale: Sa kontekstong sinusundan ng infinitibong “lipulin ka,” ang pandiwang יעץ ay tumutukoy sa layunin o pasiya ng Diyos. Ipinahihiwatig ng “ipinasiya” ang matatag na layunin habang iniuugnay pa rin ito sa larangan ng pagpapayo at pagpaplano.
- source_word: לְהַשְׁחִיתֶךָ
  choice: na lipulin ka
  rationale: Tuwiran nitong ipinapahayag ang pagdadala sa kapahamakan o pagkawasak na tinutukoy ng Hiphil ng שׁחת.
- source_word: וְלֹא שָׁמַעְתָּ לַעֲצָתִי
  choice: at hindi ka nakinig sa payo ko
  rationale: Ang “nakinig” ay nagpapanatili sa diwa ng pakikinig at pagsunod, samantalang ang “payo” ay tumutugma sa salitang-ugat na inuulit sa יָעַץ.
theological_decisions:
- issue: Ang layunin ng Diyos sa יָעַץ אֱלֹהִים לְהַשְׁחִיתֶךָ
  choice: ipinasiya ng Diyos na lipulin ka
  alternative: binalak ng Diyos na lipulin ka
  rationale: Inilalahad ng Hebreo ang paglipol bilang tiyak na layunin ng Diyos bilang tugon sa ginawa ng hari at sa pagtanggi nitong makinig. Hindi ito pinalalambot o ipinaliliwanag sa pamamagitan ng isang partikular na sistemang teolohikal.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Nilinaw sa pambungad ang mga tinutukoy ng mga panghalip ayon sa konteksto upang maiwasan ang kalituhan sa Tagalog. Pinanatili ang mariing banta ng hari, ang di-tiyak na maramihang tagaganap sa “nila,” at ang teolohikal na bigat ng ipinahayag na pasiya ng Diyos.
