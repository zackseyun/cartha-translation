  text: וַ/עֲשֶׂ֨רֶת אֲלָפִ֜ים חַיִּ֗ים שָׁבוּ֙ בְּנֵ֣י יְהוּדָ֔ה וַ/יְבִיא֖וּ/ם לְ/רֹ֣אשׁ הַ/סָּ֑לַע וַ/יַּשְׁלִיכ֛וּ/ם מֵֽ/רֹאשׁ הַ/סֶּ֖לַע וְ/כֻלָּ֥/ם נִבְקָֽעוּ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/012.yaml
  text: And the sons of Judah captured ten thousand alive[a], brought them to the top of the cliff, and threw them down from the top of the cliff[b], and all of them were dashed to pieces.
translation:
  language: tl
  text: At sampung libo ang binihag nang buháy ng mga taga-Juda. Dinala nila ang mga ito sa tuktok ng bangin[a] at inihagis pababa mula sa tuktok ng bangin; nabiyak-biyak silang lahat.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “bato” o “matarik na batuhan” (Hebreo: selaʿ).'
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “nabiyak silang lahat” o “nabiyak-biyak.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁבוּ
  choice: binihag
  rationale: Sa kontekstong militar at kasunod ng חַיִּים, tumutukoy ito sa pagkuha ng mga bihag, hindi sa ibang kahulugan ng ugat na ‘bumalik.’
- source_word: חַיִּים
  choice: nang buháy
  rationale: 'Predikatibo o pang-abay ang gamit: ang sampung libo ay nahuling buháy, hindi napatay sa labanan.'
- source_word: בְּנֵי יְהוּדָה
  choice: mga taga-Juda
  rationale: Bagaman literal na ‘mga anak ni Juda,’ ang parirala rito ay tumutukoy sa mga mamamayan o kawal ng Juda; ‘mga taga-Juda’ ang likas na modernong Tagalog.
- source_word: וַיְבִיאוּם
  choice: Dinala nila ang mga ito
  rationale: Tuwirang inilalarawan ng hiphil ng בוא ang pagdadala sa mga bihag sa isang lugar.
- source_word: לְרֹאשׁ
  choice: sa tuktok ng
  rationale: Ang רֹאשׁ ay literal na ‘ulo,’ ngunit kapag heograpikong anyo ang tinutukoy, ang kahulugan ay ‘tuktok.’
- source_word: הַסָּלַע / הַסֶּלַע
  choice: bangin
  rationale: Maaaring tumukoy ang סֶלַע sa malaking bato, batuhan, o matarik na batong bangin. Dahil inihagis ang mga bihag mula sa tuktok nito, malinaw at natural sa Tagalog ang ‘bangin,’ habang pinananatili sa talababa ang mga alternatibo.
- source_word: וַיַּשְׁלִיכוּם
  choice: inihagis pababa
  rationale: Ang שלך ay ‘ihagis.’ Ang ‘pababa’ ay likas na ipinahihiwatig ng kasunod na pariralang mula sa tuktok ng bangin.
- source_word: וְכֻלָּם
  choice: silang lahat
  rationale: Pinananatili nito ang tahasang kabuuan at panghalip na nasa Hebreo.
- source_word: נִבְקָעוּ
  choice: nagkabiyak-biyak
  rationale: Ang niphal ng בקע ay ‘mabiyak’ o ‘mawasak nang magkakahiwalay.’ Ang ‘nagkabiyak-biyak’ ay tuwiran, marahas, at hindi pinahihina ang paglalarawan.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang ‘mga taga-Juda’ sa halip na literal na ‘mga anak ni Juda’ dahil pambansa o pangkat-etnikong katawagan ang diwa rito. Nilagyan ng tuldik ang ‘buháy’ upang maiwasan ang maling pagbasa bilang ‘búhay.’ Pinanatili ang sunod-sunod na koordinasyon ng Hebreo at hindi ginawang pahayag ng layunin o resulta ang huling sugnay.
