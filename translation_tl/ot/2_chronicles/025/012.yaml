  naturalness: Malinaw at moderno ang Tagalog. Ang binagong huling sugnay na 'nabiyak-biyak silang lahat' ay likas at mas tuwirang nagsasaad ng resultang dinanas ng mga bihag.
  terminology: Ang 'mga taga-Juda,' 'bihag,' at 'bangin' ay angkop. Pinanatili ang leksikal na alternatibo para sa selaʿ sa talababa, ngunit inayos ito upang maging mas likas at hindi magmungkahi ng sukat na wala sa Hebreo.
