  to: At sampung libo ang binihag nang buháy ng mga taga-Juda. Dinala nila ang mga ito sa tuktok ng bangin[a] at inihagis pababa mula sa tuktok ng bangin; nabiyak-biyak silang lahat.[b]
  rationale: Inulit ang 'mula sa tuktok ng bangin' upang masundan ang tahasang pag-uulit sa Hebreo. Pinalitan ang mas kusang 'nagkabiyak-biyak' ng 'nabiyak-biyak' upang maipakita ang pasibong resulta ng נִבְקָעוּ nang hindi pinahihina ang marahas na paglalarawan. Inayos din ang unang alternatibo sa talababa upang iwasan ang dagdag na kahulugang 'malaki.'
