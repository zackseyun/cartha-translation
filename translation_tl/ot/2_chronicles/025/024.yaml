base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/024.yaml
  text: And he took all the gold and the silver[a], and all the vessels found in the house of God with Obed-edom, and the treasures of the king’s house, and hostages[b], and returned to Samaria.
translation:
  language: tl
  text: Kinuha niya ang lahat ng ginto at pilak, ang lahat ng kagamitang nasa bahay ng Diyos, kasama ni Obed-edom[a], ang mga kayamanan sa palasyo ng hari, at ang mga bihag[b]. Pagkatapos, bumalik siya sa Samaria.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “na nasa pangangalaga ni Obed-edom.” Literal sa Hebreo, “kasama ni Obed-edom.”
    reason: lexical_alternative
  - marker: b
    text: Literal sa Hebreo, “mga anak ng mga panagot,” na malamang ay tumutukoy sa mga taong hinawakan bilang garantiya, samakatuwid ay mga bihag.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הַזָּהָב וְהַכֶּסֶף
  choice: lahat ng ginto at pilak
  rationale: Pinananatili ang kabuuang diwa ng כָּל at malinaw na binabanggit ang dalawang mahalagang metal sa likas na Filipino.
- source_word: כָּל הַכֵּלִים
  choice: lahat ng kagamitan
  rationale: Malawak ang saklaw ng כֵּלִים; ang “kagamitan” ay natural at angkop sa mga bagay na ginagamit sa bahay ng Diyos nang hindi labis na nililimitahan ang uri ng mga ito.
- source_word: הַנִּמְצְאִים
  choice: natagpuan
  rationale: Tuwirang ipinapahayag ang participle na tumutukoy sa mga kagamitang naroon o natagpuan sa lugar.
- source_word: בֵּית הָאֱלֹהִים
  choice: bahay ng Diyos
  rationale: Malapit ito sa anyong Hebreo at malinaw sa modernong Filipino; hindi agad pinapalitan ng mas interpretatibong “templo ng Diyos.”
- source_word: עִם עֹבֵד אֱדוֹם
  choice: na kay Obed-edom
  rationale: Ang “kay” ay natural na Filipino para sa maluwag na ugnayang ipinahihiwatig ng literal na “kasama ni Obed-edom,” habang hindi tahasang nagpapasiya kung pag-iingat o simpleng pagkakaugnay ang ibig sabihin; nililinaw ang posibleng diwa sa talababa.
- source_word: אֹצְרוֹת בֵּית הַמֶּלֶךְ
  choice: mga kayamanan sa palasyo ng hari
  rationale: Sa konteksto ng mga bagay na sinamsam, mas malamang na ang אֹצְרוֹת ay mga kayamanan kaysa mga imbakan; ang “palasyo” ang likas na Filipino para sa bahay ng hari sa kontekstong ito.
- source_word: בְּנֵי הַתַּעֲרֻבוֹת
  choice: mga bihag na panagot
  rationale: Ipinahihiwatig ng mahirap na parirala ang mga taong hawak bilang garantiya. Ang “mga bihag na panagot” ay malinaw ngunit pinananatili ang konsepto ng panagot, na ipinapaliwanag pa sa talababa.
- source_word: וַיָּשָׁב שֹׁמְרוֹן
  choice: Pagkatapos, bumalik siya sa Samaria
  rationale: Ipinagpapatuloy ng wayyiqtol ang salaysay; likas na ipinahahayag sa Filipino ang paksa at ang Samaria bilang patutunguhan.
theological_decisions: []
translation_notes:
  register: Makabago at marangal na Filipino, na may malinaw na daloy ng salaysay. Ginamit ang “bahay ng Diyos” upang manatiling malapit sa Hebreo, ngunit “palasyo ng hari” upang maging natural at malinaw sa konteksto. Ang mga di-tiyak na pariralang nauugnay kay Obed-edom at sa mga taong panagot ay hindi tahimik na nilutas; minarkahan at ipinaliwanag ang mga ito sa mga talababa.
