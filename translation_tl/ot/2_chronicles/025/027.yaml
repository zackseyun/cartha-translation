base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/027.yaml
  text: From the time that Amaziah turned away from following Yahweh[a], they conspired against him in Jerusalem, and he fled to Lachish; but they sent after him to Lachish and put him to death there.
translation:
  language: tl
  text: Mula nang tumalikod si Amasias sa pagsunod kay Yahweh[a], nagsabwatan sila laban sa kanya sa Jerusalem. Tumakas siya patungong Lakis, ngunit nagpadala sila sa Lakis upang tugisin siya, at doon nila siya pinatay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal na Hebreo, “tumalikod mula sa likuran ni Yahweh,” isang idyomang nangangahulugang tumigil siya sa pagsunod kay Yahweh.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֵעֵת אֲשֶׁר
  choice: Mula nang
  rationale: Likas at maikli itong panandang temporal sa Tagalog para sa panahong pinagmulan ng sumunod na sabwatan.
- source_word: סָר מֵאַחֲרֵי יְהוָה
  choice: tumalikod ... sa pagsunod kay Yahweh
  rationale: Ipinahihiwatig ng pandiwa at idyoma ang pagtalikod sa katapatan at pagtigil sa pagsunod, hindi simpleng pisikal na pag-alis.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang kinakatawan ang banal na pangalang YHWH sa tekstong Hebreo.
- source_word: וַיִּקְשְׁרוּ עָלָיו קֶשֶׁר
  choice: nagsabwatan sila laban sa kanya
  rationale: Natural na ipinapahayag sa Tagalog ang pinagsamang pandiwa at pangngalang Hebreo na tumutukoy sa pagbubuo ng sabwatan.
- source_word: וַיָּנָס לָכִישָׁה
  choice: Tumakas siya patungong Lakis
  rationale: Ipinananatili ang pagtakas mula sa panganib at ang direksiyon patungo sa Lakis.
- source_word: וַיִּשְׁלְחוּ אַחֲרָיו לָכִישָׁה
  choice: nagpadala sila ng mga tao sa Lakis upang habulin siya
  rationale: Bagaman hindi tahasang binanggit ang mga taong isinugo, likas na ipinahihiwatig sila ng Hebreong 'nagsugo sila kasunod niya'; nililinaw ito sa natural na Tagalog nang hindi binabago ang kilos.
- source_word: וַיְמִיתֻהוּ שָׁם
  choice: at doon nila siya pinatay
  rationale: Malinaw na ipinapahayag ang sinadya at causative na pagpatay, habang ang 'doon' ay tumutukoy pabalik sa Lakis.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehova
  rationale: Pangngalang pantangi ang YHWH sa pinagmulang teksto; pinananatili ng 'Yahweh' ang tahasang banal na pangalan nang hindi ito pinapalitan ng isang titulo.
- issue: Likas na kahulugan ng pagtalikod ni Amasias
  choice: tumalikod ... sa pagsunod kay Yahweh
  alternative: lumayo kay Yahweh
  rationale: Pinananatili nito ang ugnayan sa pagsunod na nasa Hebreong idyoma at hindi pinalalabo ang pagtalikod bilang basta paglayo lamang.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang karaniwang anyong Tagalog na Amasias at Lakis, at hinati sa dalawang pangungusap upang maging madaling basahin nang hindi binabago ang daloy ng salaysay.
