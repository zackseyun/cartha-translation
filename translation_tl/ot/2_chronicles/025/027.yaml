  to: Mula nang tumalikod si Amasias sa pagsunod kay Yahweh[a], nagsabwatan sila laban sa kanya sa Jerusalem. Tumakas siya patungong Lakis, ngunit nagpadala sila sa Lakis upang tugisin siya, at doon nila siya pinatay.
