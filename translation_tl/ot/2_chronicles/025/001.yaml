base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/001.yaml
  text: Amaziah was twenty-five years old when he became king[a], and he reigned twenty-nine years in Jerusalem. His mother’s name was Jehoaddan[b], from Jerusalem.
translation:
  language: tl
  text: Si Amazias ay dalawampu't limang taong gulang nang siya ay maging hari[a], at dalawampu't siyam na taon siyang naghari sa Jerusalem. Ang kanyang ina ay si Jehoaddan, na mula sa Jerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “anak ng dalawampu't limang taon.” Maaari ring isalin ang “nang magsimula siyang maghari.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן עֶשְׂרִים וְחָמֵשׁ שָׁנָה
  choice: dalawampu't limang taong gulang
  rationale: Karaniwang idyomang Hebreo ito para sa edad, literal na “anak ng dalawampu't limang taon.” Ang napiling salin ang natural at malinaw na katumbas sa modernong Tagalog.
- source_word: מָלַךְ (unang paglitaw)
  choice: maging hari siya
  rationale: Sa pormula ng edad, tumutukoy ang pandiwa sa pagluklok ni Amazias bilang hari; natural itong ipinahahayag sa Tagalog bilang “maging hari.”
- source_word: וְעֶשְׂרִים וָתֵשַׁע שָׁנָה מָלַךְ
  choice: dalawampu't siyam na taon siyang naghari
  rationale: Ipinahahayag ng parirala ang haba ng kanyang paghahari, kaya ang “naghari” ang tuwirang katumbas sa kontekstong pangmaharlika.
- source_word: בִּירוּשָׁלִָם
  choice: sa Jerusalem
  rationale: Tuwirang locative na parirala para sa lugar ng paghahari.
- source_word: וְשֵׁם אִמּוֹ
  choice: Jehoaddan ang pangalan ng kanyang ina
  rationale: Natural na ayos sa modernong Tagalog na lubos na pinananatili ang kahulugan ng Hebreong parirala.
- source_word: יְהוֹעַדָּן
  choice: Jehoaddan
  rationale: Pinanatili ang kinikilalang transliterasyon ng pangalang pantangi.
- source_word: מִירוּשָׁלָיִם
  choice: mula sa Jerusalem
  rationale: Karaniwang ipinahihiwatig ng pang-ukol na מִן ang pinagmulan; dito ay tinutukoy nito ang pinanggalingan ng ina ni Amazias.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “naghari” para sa tagal ng pamumuno at “maging hari” para sa pagluklok, habang pinanatili sa talababa ang literal na idyoma ng edad at ang posibleng alternatibong salin.
