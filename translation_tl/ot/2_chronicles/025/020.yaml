base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/020.yaml
  text: But Amaziah would not listen[a], for it was from God, in order to give them into the hand of their enemies, because they had sought the gods of Edom.
translation:
  language: tl
  text: Ngunit hindi nakinig si Amazias, sapagkat ito ay mula sa Diyos, upang ibigay sila ng Diyos sa kamay ng kanilang mga kaaway[a], dahil hinanap nila ang mga diyos ng Edom.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “sa kamay”; isang idyoma na nangangahulugang mapasailalim sa kapangyarihan ng iba. Ang “ng kanilang mga kaaway” ay nilinaw mula sa konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמַע
  choice: hindi nakinig
  rationale: Sa konteksto, tumutukoy ito sa hindi pagpansin o pagsunod sa babala, hindi lamang sa pisikal na pagdinig. Likas at malinaw sa modernong Tagalog ang “hindi nakinig.”
- source_word: מֵהָאֱלֹהִים הִיא
  choice: ito ay mula sa Diyos
  rationale: Pinananatili nito ang di-tiyak na tinutukoy ng pambabaeng panghalip—ang pangyayari o kalagayan—at ang tahasang pagkilos ng Diyos nang hindi dinaragdagan ang paliwanag.
- source_word: לְמַעַן
  choice: upang
  rationale: Malinaw na ipinahahayag ng “upang” ang layunin o resultang nakapaloob sa pariralang Hebreo.
- source_word: תִּתָּם
  choice: ibigay sila
  rationale: Pinananatili ang karaniwang diwa ng נתן at ang kaugnayan nito sa kasunod na idyomang “sa kamay.”
- source_word: בְּיָד
  choice: sa kamay ng kanilang mga kaaway
  rationale: Ang “sa kamay” ay idyomang Hebreo para sa pagpapasailalim sa kapangyarihan ng iba. Idinagdag ang “ng kanilang mga kaaway” mula sa agarang konteksto upang maging malinaw sa Tagalog; ipinaliliwanag sa talababa ang literal na anyo.
- source_word: דָרְשׁוּ
  choice: hinanap nila
  rationale: Malawak na naipahahayag nito ang paglapit at pag-asa sa mga diyos sa relihiyosong diwa, nang hindi nililimitahan sa pagsangguni lamang.
- source_word: אֱלֹהֵי אֱדוֹם
  choice: ang mga diyos ng Edom
  rationale: Tuwirang salin ng construct chain at malinaw sa karaniwang mambabasa.
theological_decisions:
- issue: Ang pagkilos ng Diyos sa hindi pakikinig at pagkatalo ni Amazias
  choice: Tahasan pa ring sinasabi na ang pangyayari ay mula sa Diyos at may layuning maibigay sila sa kapangyarihan ng kanilang mga kaaway dahil sa paghahanap nila sa mga diyos ng Edom.
  alternative: Unawain ito bilang pagpapahintulot lamang ng Diyos at hindi bilang aktibong layunin.
  rationale: Malinaw sa Hebreo ang “mula sa Diyos” at ang layuning ipinakikilala ng לְמַעַן. Pinananatili ng salin ang teolohikal na tensiyon nang hindi ito pinahihina o ipinapaliwanag nang lampas sa teksto.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang tradisyonal at karaniwang anyong “Amazias,” habang pinanatili ang payak na sintaks at ang tahasang ugnayan ng pagkilos ng Diyos, layunin, at idolatriya.
