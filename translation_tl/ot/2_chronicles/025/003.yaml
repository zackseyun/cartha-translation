translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “kaharian” sa pangunahing teksto ngunit inilagay sa talababa ang posibleng diwang “paghahari,” sapagkat maaaring tumukoy ang הַמַּמְלָכָה sa sakop na kaharian o sa kapangyarihan ng hari.
