translation:
  language: tl
  text: Nang matatag na ang kaharian sa ilalim ng kanyang pamamahala[a], pinatay niya ang kanyang mga lingkod na pumatay sa kanyang amang hari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Nang maging matatag ang kanyang paghahari.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: Nang
  rationale: Ipinapahayag nito nang natural sa modernong Tagalog ang temporal na paglipat sa kasunod na pangyayari, nang hindi nagdaragdag ng tahasang salitang katumbas ng “ngayon.”
- source_word: חָזְקָה הַמַּמְלָכָה עָלָיו
  choice: matatag na ang kaharian sa ilalim ng kanyang pamamahala
  rationale: Sa konteksto, tumutukoy ang חזק sa pagkakatatag o pagkakonsolida ng kapangyarihang maharlika, at ang עָלָיו ay nagpapahiwatig na ang kaharian ay ligtas nang nasa ilalim ng kanyang kontrol. Ang salin ay natural sa Tagalog at hindi nag-aangkat ng metaporang “sa kanyang kamay,” na wala sa Hebreo.
- source_word: וַיַּהֲרֹג
  choice: pinatay niya
  rationale: Tuwiran, malinaw, at makabagong katumbas ng הרג.
- source_word: עֲבָדָיו
  choice: kanyang mga lingkod
  rationale: Sa konteksto ng maharlikang sambahayan, maaaring tumukoy ang עבד sa mga lingkod o tauhan ng hari; hindi ipinapalagay ng “mga lingkod” na sila ay mga alipin o tiyak na mga opisyal.
- source_word: הַמַּכִּים
  choice: na pumaslang
  rationale: Ipinakikilala ng participle ang mga lingkod bilang mga pumatay sa hari. Napananatili ng “pumaslang” ang marahas na diwa ng נכה at naiiwasan ang magkasunod na pag-uulit ng “pinatay” at “pumatay.”
- source_word: אֶת־הַמֶּלֶךְ אָבִיו
  choice: sa kanyang amang hari
  rationale: Natural na Tagalog itong katumbas ng Hebreong apposition na “ang hari, ang kanyang ama,” habang pinananatili ang parehong pagkakakilanlan.
