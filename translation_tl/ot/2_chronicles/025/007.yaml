  text: וְ/אִ֣ישׁ הָ/אֱלֹהִ֗ים בָּ֤א אֵלָי/ו֙ לֵ/אמֹ֔ר הַ/מֶּ֕לֶךְ אַל יָבֹ֥א עִמְּ/ךָ֖ צְבָ֣א יִשְׂרָאֵ֑ל כִּ֣י אֵ֤ין יְהוָה֙ עִם יִשְׂרָאֵ֔ל כֹּ֖ל בְּנֵ֥י אֶפְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/007.yaml
  text: But a man of God came to him[a], saying, “O king, do not let the army of Israel go with you, for Yahweh is not with Israel, with all the sons of Ephraim.”
translation:
  language: tl
  text: Ngunit isang tao ng Diyos ang dumating sa kanya at nagsabi, “O hari, huwag mong isama sa iyo ang hukbo ng Israel, sapagkat hindi kasama ng Israel si Yahweh—iyon ay, ng lahat ng anak ni Efraim[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “lahat ng Efraimita.” Sa Hebreo, “lahat ng anak ni Efraim.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ הָאֱלֹהִים
  choice: isang lingkod ng Diyos
  rationale: Ang parirala ay isang kinikilalang titulo para sa taong inatasan ng Diyos. Mas natural sa makabagong Tagalog ang “lingkod ng Diyos” kaysa sa literal ngunit malamya na “tao ng Diyos,” nang hindi ito nililimitahan sa mas tiyak na titulong “propeta.”
- source_word: בָּא אֵלָיו
  choice: dumating sa kanya
  rationale: Ang בוא na may אֶל ay karaniwang nagsasaad ng paglapit o pagpunta sa isang tao.
- source_word: לֵאמֹר
  choice: at nagsabi
  rationale: Natural na salin sa Tagalog ng karaniwang pormula sa pagpapakilala ng tuwirang pananalita.
- source_word: הַמֶּלֶךְ
  choice: O hari
  rationale: Ginagamit dito ang pangngalan bilang tuwirang pantawag sa hari.
- source_word: אַל יָבֹא עִמְּךָ
  choice: huwag mong pasamahin sa iyo
  rationale: Ipinahahayag ng אַל at anyong jussive ang pagbabawal. Sa konteksto ng isang kampanyang militar, malinaw na tumutukoy ito sa hindi pagsama ng hukbo sa hari.
- source_word: צְבָא יִשְׂרָאֵל
  choice: ang hukbo ng Israel
  rationale: Ang צָבָא ay tumutukoy rito sa organisadong puwersang militar.
- source_word: כִּי אֵין יְהוָה עִם יִשְׂרָאֵל
  choice: sapagkat hindi kasama ng Israel si Yahweh
  rationale: Pinananatili ang tahasang dahilan at ang diwa ng presensiya at pagsang-ayon ng Diyos, nang hindi ito pinalalawak sa paliwanag na wala sa teksto.
- source_word: כֹּל בְּנֵי אֶפְרָיִם
  choice: ng lahat ng anak ni Efraim
  rationale: Pinananatili ang pampamilyang larawan ng Hebreong “mga anak ni Efraim.” Ang pang-ukol na “ng” pagkatapos ng gitling ay inuugnay ang parirala sa naunang “Israel” bilang paglilinaw sa tinutukoy na Israel sa konteksto.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Ginagamit ng tekstong Hebreo ang Tetragrammaton, kaya pinananatili ang personal na pangalang tipan bilang “Yahweh” sa halip na palitan ito ng isang titulo.
- issue: Kahulugan ng pagiging “kasama” ni Yahweh
  choice: hindi kasama ng Israel si Yahweh
  alternative: hindi sinasang-ayunan ni Yahweh ang Israel
  rationale: Pinananatili ang konkretong pananalita ng Hebreo tungkol sa banal na presensiya at tulong; ang alternatibo ay maaaring magpaliit sa mas malawak na teolohikal na diwa ng parirala.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “hukbo,” “O hari,” at “Yahweh” para sa pormal na himig, habang pinili ang likas na ayos ng pangungusap sa Tagalog. Pinanatili ng gitling ang hulíng parirala bilang paglilinaw sa “Israel” nang hindi lubusang inaalis ang bahagyang siksik na pagkakaugnay ng mga parirala sa Hebreo.
