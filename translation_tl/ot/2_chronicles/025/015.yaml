  text: וַ/יִּֽחַר אַ֥ף יְהוָ֖ה בַּ/אֲמַצְיָ֑הוּ וַ/יִּשְׁלַ֤ח אֵלָי/ו֙ נָבִ֔יא וַ/יֹּ֣אמֶר ל֗/וֹ לָ֤/מָּה דָרַ֨שְׁתָּ֙ אֶת אֱלֹהֵ֣י הָ/עָ֔ם אֲשֶׁ֛ר לֹא הִצִּ֥ילוּ אֶת עַמָּ֖/ם מִ/יָּדֶֽ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/015.yaml
  text: Then Yahweh’s anger burned against Amaziah[a], and he sent a prophet to him, who said to him, “Why have you sought the gods of the people who did not deliver their people from your hand?”
translation:
  language: tl
  text: Nag-alab ang galit ni Yahweh laban kay Amazias, at nagsugo siya ng isang propeta sa kanya. Sinabi ng propeta sa kanya, “Bakit mo hinanap[a] ang mga diyos ng bayang iyon, na hindi nakapagligtas sa bayan nila mula sa kamay mo?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sinangguni” o “pinagtanungan.”
    reason: Ipinapakita ang mga posibleng kahulugan ng Hebreong דָּרַשׁ sa relihiyosong kontekstong ito.
lexical_decisions:
- source_word: וַיִּחַר אַף יְהוָה
  choice: nag-alab ang galit ni Yahweh
  rationale: Pinananatili ang matingkad na idyomang Hebreo tungkol sa pag-aalab ng galit habang nananatiling natural sa makabagong Tagalog.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ang personal na pangalang nasa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: בַּאֲמַצְיָהוּ
  choice: laban kay Amazias
  rationale: Sa konteksto ng galit, ipinahihiwatig ng pang-ukol na ang galit ay nakatuon laban kay Amazias.
- source_word: נָבִיא
  choice: isang propeta
  rationale: Karaniwan at malinaw na katawagan sa Tagalog para sa mensaherong propetiko.
- source_word: דָרַשְׁתָּ
  choice: hinanap
  rationale: Pinananatili ang malawak na kahulugan ng paghanap o pagbaling sa mga diyos nang hindi nililimitahan ito sa pagsamba o pagsangguni lamang.
- source_word: אֱלֹהֵי הָעָם
  choice: ang mga diyos ng bayan
  rationale: Tuwirang ipinapahayag ang ugnayan ng mga diyos sa natalong bayan.
- source_word: אֲשֶׁר לֹא הִצִּילוּ
  choice: na hindi nagligtas
  rationale: Inilalahad ang aktuwal na hindi nila pagliligtas; hindi idinaragdag ang interpretasyong wala silang kakayahang magligtas.
- source_word: עַמָּם
  choice: kanilang bayan
  rationale: Malinaw na ipinapakita ang pag-aari habang pinananatili ang kolektibong diwa ng Hebreong עַם.
- source_word: מִיָּדֶךָ
  choice: mula sa kamay mo
  rationale: Pinananatili ang konkretong idyoma ng Hebreo para sa kapangyarihan o kontrol, na nauunawaan din sa Tagalog.
theological_decisions:
- issue: Pagtutumbas sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Personal na pangalan ang tuwirang lumilitaw sa tekstong Hebreo, kaya pinananatili ito bilang Yahweh sa halip na palitan ng titulo.
- issue: Saklaw ng דָרַשְׁתָּ sa relihiyosong konteksto
  choice: hinanap
  alternative: sinangguni; pinagtanungan; sinamba
  rationale: Hindi tiyak sa pandiwa lamang kung pagsangguni, pagtatanong, o mas malawak na relihiyosong pagbaling ang tinutukoy; pinananatili ng “hinanap” ang saklaw at tensiyong ito.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog. Ginamit ang “nag-alab ang galit” upang mapanatili ang larawan ng Hebreo, at ang “mula sa kamay mo” upang mapanatili ang idyomang tumutukoy sa kapangyarihan. Inilagay ang panandang [a] pagkatapos ng “hinanap,” ang salitang aktuwal na tinutukoy ng talababa.
