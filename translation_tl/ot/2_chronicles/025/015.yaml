revisions:
- from: Kaya nag-alab ang galit ni Yahweh laban kay Amazias, at nagsugo siya ng isang propeta sa kanya. Sinabi nito sa kanya, “Bakit mo hinanap[a] ang mga diyos ng bayang hindi nagligtas sa kanilang bayan mula sa kamay mo?”
  to: Nag-alab ang galit ni Yahweh laban kay Amazias, at nagsugo siya ng isang propeta sa kanya. Sinabi ng propeta sa kanya, “Bakit mo hinanap[a] ang mga diyos ng bayang iyon, na hindi nakapagligtas sa bayan nila mula sa kamay mo?”
  rationale: Inalis ang dagdag na inferensiyal na “Kaya,” nilinaw na ang propeta ang nagsalita, at inayos ang huling sugnay upang ang mga diyos—hindi ang bayan—ang malinaw na paksa ng hindi pagliligtas. Pinanatili ang lahat ng pangunahing kahulugan, ang ambiguidad ng דָּרַשׁ, at ang angkla ng talababa.
