  yaml_path: translation/ot/2_chronicles/025/028.yaml
  text: They carried him on horses and buried him with his fathers in the city of Judah[a].
translation:
  language: tl
  text: Dinala nila siya sakay ng mga kabayo[a] at inilibing kasama ng kanyang mga ninuno sa lungsod ng Juda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “sa ibabaw ng mga kabayo.” Tahasang pangmaramihan sa Hebreo ang “mga kabayo.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂאֻהוּ
  choice: Dinala nila siya
  rationale: Ang pandiwang נשׂא na may hulaping tumutukoy sa panlalaking isahan ay nangangahulugang binuhat o dinala siya. Sa konteksto ng pagdadala sa bangkay, natural at malinaw sa modernong Tagalog ang “dinala nila siya.”
- source_word: עַל הַסּוּסִים
  choice: sakay ng mga kabayo
  rationale: Literal itong “sa ibabaw ng mga kabayo.” Pinananatili ng “sakay ng mga kabayo” ang tahasang pangmaramihang “mga kabayo” nang hindi nagdaragdag ng karwahe, karo, o andas na wala sa Hebreo.
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: at inilibing
  rationale: Tuwirang salin ng קבר kasama ang layong tumutukoy sa kanya. Hindi na kailangang ulitin ang “nila siya” dahil malinaw at natural sa Tagalog ang pinagsamang sugnay.
- source_word: עִם אֲבֹתָיו
  choice: kasama ng kanyang mga ninuno
  rationale: Literal na “kasama ng kanyang mga ama,” ngunit isa itong pormula tungkol sa paglilibing na tumutukoy sa mga naunang salinlahi ng kanyang angkan. Mas malinaw sa karaniwang modernong Tagalog ang “mga ninuno” habang napapanatili ang pampamilya at pandinastiyang diwa.
- source_word: בְּעִיר יְהוּדָה
  choice: sa lungsod ng Juda
  rationale: Sinusunod nito nang tuwiran ang Masoretikong tekstong “sa lungsod ng Juda” at hindi ito itinutugma sa mas pamilyar na “Lungsod ni David.”
theological_decisions:
- issue: Pormula ng paglilibing at pangalan ng lugar
  choice: Panatilihin ang pagbasa ng MT na “sa lungsod ng Juda.”
  alternative: Gawing “sa Lungsod ni David” o gawing pangkalahatan na “sa Juda.”
  rationale: Bagaman hindi ito pangunahing usaping doktrinal, mahalagang huwag itugma ang teksto sa ibang pamilyar na pormula. Ang ibinigay na tekstong Hebreo ay tahasang nagsasabing “lungsod ng Juda.”
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “mga ninuno” bilang malinaw na katumbas ng Hebreong pormula sa paglilibing, samantalang pinanatili ang di-karaniwang “lungsod ng Juda” at ang pangmaramihang “mga kabayo.”
