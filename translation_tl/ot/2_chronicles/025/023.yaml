base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/023.yaml
  text: And Joash king of Israel captured Amaziah king of Judah[a], the son of Joash, son of Jehoahaz, at Beth-shemesh, and brought him to Jerusalem. Then he broke down the wall of Jerusalem from the Ephraim Gate to the Corner Gate, four hundred cubits.
translation:
  language: tl
  text: At binihag ni Joas na hari ng Israel si Amazias na hari ng Juda, na anak ni Joas, na anak ni Jehoahaz, sa Bet-semes. Dinala niya ito sa Jerusalem at gumawa siya ng siwang sa pader ng Jerusalem mula sa Pintuan ng Efraim hanggang sa Pintuang Panulok[a]—na may habang apatnaraang siko.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “hanggang sa pintuang nakaharap” o “pintuang lumiliko.” Ang saling “Pintuang Panulok” ay batay sa malamang na pagkakakilanlan nito sa kaagapay na salaysay sa 2 Hari 14:13.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּפַשׂ
  choice: binihag
  rationale: Ipinahihiwatig ng pandiwa ang pagdakip at pagkuha sa kustodiya; ang “binihag” ay natural sa konteksto ng digmaan.
- source_word: בְּבֵית שָׁמֶשׁ
  choice: sa Bet-semes
  rationale: Ang pang-ukol ay tumutukoy sa lugar kung saan dinakip si Amazias; isinalin ang pangalan ng lugar ayon sa karaniwang baybay sa Filipino.
- source_word: וַיְבִיאֵהוּ
  choice: Dinala niya ito
  rationale: Ang hiphil ng בוא ay karaniwang nangangahulugang “dalhin”; hindi nito labis na tinutukoy ang paraan ng pagdadala.
- source_word: וַיִּפְרֹץ בְּחוֹמַת יְרוּשָׁלִַם
  choice: giniba ang pader ng Jerusalem
  rationale: Sa konstruksiyong ito, tumutukoy ang פרץ sa pagbutas o paggiba ng pader; malinaw at natural sa Filipino ang “giniba.”
- source_word: מִשַּׁעַר אֶפְרַיִם עַד שַׁעַר הַפּוֹנֶה
  choice: mula sa Pintuan ng Efraim hanggang sa Pintuan sa Panulukan[a]
  rationale: Malinaw na pangalan ng pintuan ang una. Ang ikalawa ay literal na kaugnay ng pagharap o pagliko, ngunit malamang na tumutukoy sa Pintuan sa Panulukan batay sa kaagapay na salaysay sa 2 Hari 14:13; inilagay sa talababa ang tunay na leksikal na kalabuan.
- source_word: אַרְבַּע מֵאוֹת אַמָּה
  choice: apatnaraang siko ang haba
  rationale: Pinananatili ang sinaunang yunit na “siko”; idinagdag ang “ang haba” upang maging malinaw sa natural na Filipino ang gamit ng sukat.
- source_word: בֶּן יוֹאָשׁ בֶּן יְהוֹאָחָז
  choice: anak ni Joas at apo ni Jehoahaz
  rationale: Pinananatili ang dalawang salinlahi habang natural na nililinaw sa Filipino na si Jehoahaz ang lolo ni Amazias.
