translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “binihag” para sa konteksto ng digmaan, “pader” sa halip na mas teknikal na “muog,” at tradisyonal na yunit na “siko.” Pinanatili sa talababa ang kalabuan ng pangalan ng ikalawang pintuan.
