revisions:
- from: At binihag ni Joas na hari ng Israel si Amazias na hari ng Juda, na anak ni Joas at apo ni Jehoahaz, sa Bet-semes. Dinala niya ito sa Jerusalem at giniba ang pader ng Jerusalem mula sa Pintuan ng Efraim hanggang sa Pintuan sa Panulukan[a]—apatnaraang siko ang haba.
  to: At binihag ni Joas na hari ng Israel si Amazias na hari ng Juda, na anak ni Joas, na anak ni Jehoahaz, sa Bet-semes. Dinala niya ito sa Jerusalem at gumawa siya ng siwang sa pader ng Jerusalem mula sa Pintuan ng Efraim hanggang sa Pintuang Panulok[a]—na may habang apatnaraang siko.
  rationale: Pinalitan ang “giniba ang pader” ng “gumawa siya ng siwang sa pader” upang mas tumpak na katawanin ang paglabag sa isang bahagi ng pader. Ibinalik ang anyong “anak ni Joas, na anak ni Jehoahaz” upang mapanatili ang pagkakasunud-sunod ng Hebreong genealohiya. Inayos ang pangalan ng ikalawang pintuan sa mas likas na “Pintuang Panulok,” at pinanatili ang talababa upang hindi mawala ang pinagtatalunang kahulugan ng termino.
