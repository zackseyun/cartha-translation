revisions:
- from: Pagkatapos, tinipon ni Amazias ang Juda at inayos sila ayon sa mga sambahayan ng kanilang mga ninuno, sa ilalim ng mga pinuno ng libu-libo at mga pinuno ng daan-daan, para sa buong Juda at Benjamin. Itinala niya ang mga lalaking dalawampung taong gulang pataas, at nabilang niya ang 300,000 piling lalaki[a] na maaaring lumabas sa digmaan[b] at may hawak na sibat at malaking kalasag[c].
  to: Pagkatapos, tinipon ni Amazias ang Juda at inayos sila ayon sa mga sambahayan ng kanilang mga ninuno, sa ilalim ng mga pinuno ng libu-libo at mga pinuno ng daan-daan, sa buong Juda at Benjamin. Itinala niya ang mga lalaking dalawampung taong gulang pataas, at natagpuan niyang may 300,000 piling lalaki[a] na lumalabas upang makidigma[b] at may hawak na sibat at malaking kalasag[c].
  rationale: Pinalitan ang modal na “maaaring lumabas” ng mas tapat na “lumalabas upang makidigma,” habang iniingatan ng talababa ang idiomatikong gamit nito sa kontekstong militar. Inayos din ang pagpapahayag ng saklaw at ang resulta ng bilang upang maging mas likas at mas malapit sa Hebreong pandiwang “natagpuan.”
