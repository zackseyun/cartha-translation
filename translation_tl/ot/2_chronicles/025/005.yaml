translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang 'Amazias' bilang nakaugaliang anyong Filipino ng pangalang biblikal, at iniwasan ang teknikal o makalumang bokabularyong militar. Ang mga bilang ay ginawang numerals para sa malinaw at mabilis na pagbasa.
