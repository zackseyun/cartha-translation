  text: וַ/יִּקְבֹּ֤ץ אֲמַצְיָ֨הוּ֙ אֶת יְהוּדָ֔ה וַ/יַּֽעֲמִידֵ֣/ם לְ/בֵית אָב֗וֹת לְ/שָׂרֵ֤י הָ/אֲלָפִים֙ וּ/לְ/שָׂרֵ֣י הַ/מֵּא֔וֹת לְ/כָל יְהוּדָ֖ה וּ/בִנְיָמִ֑ן וַֽ/יִּפְקְדֵ֗/ם לְ/מִ/בֶּ֨ן עֶשְׂרִ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה וַ/יִּמְצָאֵ֗/ם שְׁלֹשׁ מֵא֨וֹת אֶ֤לֶף בָּחוּר֙ יוֹצֵ֣א צָבָ֔א אֹחֵ֖ז רֹ֥מַח וְ/צִנָּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/005.yaml
  text: Then Amaziah gathered Judah and appointed them by fathers’ houses under commanders of thousands and commanders of hundreds[a], for all Judah and Benjamin. He mustered them from twenty years old and upward, and found them to be three hundred thousand choice men, going out to war[c][b], able to handle spear and shield.
translation:
  language: tl
  text: Pagkatapos, tinipon ni Amazias ang Juda at inayos sila ayon sa mga sambahayan ng kanilang mga ninuno, sa ilalim ng mga pinuno ng libu-libo at mga pinuno ng daan-daan, sa buong Juda at Benjamin. Itinala niya ang mga lalaking dalawampung taong gulang pataas, at natagpuan niyang may 300,000 piling lalaki[a] na lumalabas upang makidigma[b] at may hawak na sibat at malaking kalasag[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga kabataang lalaki.” Ang Hebreong בָּחוּר ay maaaring tumukoy sa kabataan, ngunit sa talaang militar na ito ay malamang na tumutukoy sa mga piling lalaking may kakayahang lumaban.
    reason: lexical_alternative
  - marker: b
    text: Literal na “lumalabas sa hukbo” o “lumalabas upang makidigma,” isang idyomang Hebreo para sa mga handa o karapat-dapat na maglingkod sa hukbo.
    reason: lexical_alternative
  - marker: c
    text: Ang Hebreong צִנָּה ay tumutukoy sa isang malaking uri ng kalasag.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְבֹּץ
  choice: tinipon
  rationale: Likas na katumbas ng pagkilos na tipunin o sama-samahin ang mga tao.
- source_word: וַיַּעֲמִידֵם לְבֵית אָבוֹת
  choice: inayos sila ayon sa mga sambahayan ng kanilang mga ninuno
  rationale: Ipinahihiwatig ng Hiphil ng עמד ang paglalagay o pag-oorganisa, at ang בֵית אָבוֹת ay mga pangkat na nakabatay sa angkan o sambahayan ng ama; mas malinaw sa modernong Tagalog ang 'mga sambahayan ng kanilang mga ninuno' kaysa literal na 'mga bahay ng mga ama.'
- source_word: לְשָׂרֵי הָאֲלָפִים וּלְשָׂרֵי הַמֵּאוֹת
  choice: sa ilalim ng mga pinuno ng libu-libo at mga pinuno ng daan-daan
  rationale: Pinananatili ang estrukturang militar at ang mga yunit na binanggit sa Hebreo nang hindi gumagamit ng makalumang titulong militar.
- source_word: וַיִּפְקְדֵם
  choice: Itinala niya
  rationale: Sa kontekstong militar, ang פקד ay pagrehistro o pagbilang sa mga maaaring maglingkod; iniiwasan ng 'itinala' ang di-likas na 'minuster' habang malinaw na ipinakikita ang pagsusuri sa hukbo.
- source_word: וַיִּמְצָאֵם שְׁלֹשׁ מֵאוֹת אֶלֶף
  choice: nabilang niya ang 300,000
  rationale: Ipinapahayag nang natural sa Tagalog ang kinalabasan ng pagtatala, na siyang gamit ng מצא rito.
- source_word: בָּחוּר
  choice: piling lalaki
  rationale: Maaaring tumukoy ang salita sa mga kabataang lalaki o sa mga piling lalaking malalakas at angkop sa hukbo; ang pangunahing salin ay sumusunod sa kontekstong militar habang inilalagay sa talababa ang tunay na alternatibo.
- source_word: יוֹצֵא צָבָא
  choice: na maaaring lumabas sa digmaan
  rationale: Malapit ito sa literal na larawan ng 'lumalabas sa hukbo/digmaan' at hindi lubusang nilulutas ang idyoma bilang simpleng pisikal na kaangkupan.
- source_word: אֹחֵז רֹמַח וְצִנָּה
  choice: may hawak na sibat at malaking kalasag
  rationale: Pinananatili ang konkretong diwa ng participle na 'humahawak' at tinutukoy na malaking uri ng kalasag ang צִנָּה.
