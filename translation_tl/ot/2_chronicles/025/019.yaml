revisions:
- from: Sinabi mo, ‘Tingnan mo, tinalo mo ang Edom,’ at nagmataas ang puso mo upang magmalaki.[a] Ngayon, manatili ka na lang sa bahay mo. Bakit mo hahamunin ang kapahamakan at hahantong sa pagbagsak—ikaw at ang Juda na kasama mo?
  to: Sinabi mo, ‘Tingnan mo, tinalo mo ang Edom, at itinaas ka ng puso mo upang magmalaki.’ Ngayon, manatili ka sa bahay mo. Bakit mo hahamunin ang kapahamakan, upang ikaw ay mabuwal—ikaw at ang Juda na kasama mo?
  rationale: Inayos ang saklaw ng tuwirang sipi upang tumugma sa Hebreo, ibinalik ang ugnayang ‘itinaas ka ng puso mo,’ at ginawang mas tuwiran ang ibubungang pagkabuwal. Pinanatili ang pagkilala sa alternatibong kahulugan ng infinitive sa talababa nang hindi ipinipilit ang isang doktrinal na pakahulugan.
