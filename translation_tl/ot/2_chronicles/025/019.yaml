base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/019.yaml
  text: You said[a], ‘Look, you have struck Edom, and your heart has lifted you up to boast.’ Now stay at home. Why should you provoke disaster, so that you fall—you and Judah with you?
translation:
  language: tl
  text: Sinabi mo, ‘Tingnan mo, tinalo mo ang Edom, at itinaas ka ng puso mo upang magmalaki.’ Ngayon, manatili ka sa bahay mo. Bakit mo hahamunin ang kapahamakan, upang ikaw ay mabuwal—ikaw at ang Juda na kasama mo?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָמַרְתָּ
  choice: Sinabi mo
  rationale: Ang Qal perfect na ikalawang panauhang panlalaki ay nagpapakilala sa ipinahayag na palagay ng hari; natural sa salaysay ang payak na nagdaang panahon.
- source_word: הִנֵּה
  choice: Tingnan mo
  rationale: Pinananatili nito ang mariing pantukoy na puwersa ng Hebreo sa isang kasalukuyan at madaling maunawaang pananalita.
- source_word: הִכִּיתָ אֶת־אֱדוֹם
  choice: tinalo mo ang Edom
  rationale: Sa kontekstong militar, ang Hiphil ng נכה ay tumutukoy sa pananakit o paggapi. Mas malinaw at natural sa Filipino ang “tinalo” kaysa sa literal na “hinampas.”
- source_word: וּנְשָׂאֲךָ לִבְּךָ
  choice: at nagmataas ang puso mo
  rationale: Pinananatili ang metapora ng puso at ang diwa ng pagmamataas bunga ng tagumpay, habang natural ang anyo sa Filipino.
- source_word: לְהַכְבִּיד
  choice: upang magmalaki
  rationale: Sa konteksto ng pagsaway, ipinahihiwatig ng infinitive ang pagpaparangal o pagpapakitang-dakila sa sarili. Ang “magmalaki” ay malinaw, ngunit itinatala sa talababa ang tunay na lawak ng idyoma.
- source_word: עַתָּה שְׁבָה בְּבֵיתֶךָ
  choice: Ngayon, manatili ka na lang sa bahay mo
  rationale: Ang utos ay nangangahulugang manatili sa sariling lugar at huwag lumabas upang makipagdigma. Ipinahahayag ng “na lang” ang mapigil na babala nang hindi dinaragdagan ang pangunahing diwa.
- source_word: לָמָּה תִתְגָּרֶה בְּרָעָה
  choice: Bakit mo hahamunin ang kapahamakan
  rationale: Ang Hitpael ng גרה ay pag-uudyok o pagsuong sa alitan; ang רעה rito ay mas malamang na kapahamakan kaysa moral na kasamaan. Ang “hamunin ang kapahamakan” ay natural at pinananatili ang retorikal na babala.
- source_word: וְנָפַלְתָּ
  choice: at hahantong sa pagbagsak
  rationale: Ipinakikita nito ang ibubungang pagbagsak ng mapanghamong pagkilos, nang hindi ginagawang tiyak na hula ang retorikal na babala.
- source_word: אַתָּה וִיהוּדָה עִמָּךְ
  choice: ikaw at ang Juda na kasama mo
  rationale: Pinananatili ang diin na hindi lamang ang hari kundi pati ang Juda ay madadamay sa kanyang pagbagsak.
