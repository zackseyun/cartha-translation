  yaml_path: translation/ot/2_chronicles/025/008.yaml
  text: But if you do go[a], act resolutely in battle; God will make you stumble before the enemy[b], for there is power in God to help and to make stumble.
translation:
  language: tl
  text: Ngunit kung talagang pupunta ka[a], magpakatatag ka sa labanan. Ibubuwal ka ng Diyos sa harap ng kaaway[b], sapagkat may kapangyarihan ang Diyos na tumulong at magbuwal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kung sasama ka.”
    reason: lexical_alternative
  - marker: b
    text: 'Inuulit sa Hebreo ang parehong pandiwa: ibubuwal ka ng Diyos, at may kapangyarihan siyang “magbuwal.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: Ngunit kung
  rationale: Ipinahahayag nito ang kondisyong salungat sa naunang tagubilin.
- source_word: בֹּא אַתָּה
  choice: talagang sasama ka
  rationale: Pinananatili ng “talagang” ang diin ng tahasang panghalip; ang “sasama” ay likas sa konteksto ng pagsama sa hukbo sa labanan.
- source_word: עֲשֵׂה חֲזַק לַמִּלְחָמָה
  choice: magpakatatag ka sa labanan
  rationale: Likas at marangal na Filipino para sa idyomang literal na “gumawa/maging malakas,” nang hindi dinaragdagan ang kahulugan.
- source_word: יַכְשִׁילְךָ
  choice: Ibubuwal ka
  rationale: Ipinahahayag ang causative na “magpatisod/magpabagsak”; mas natural sa konteksto ng pagkatalo sa digmaan at naiuugnay sa inuulit na ugat sa hulihan.
- source_word: לִפְנֵי אוֹיֵב
  choice: sa harap ng kaaway
  rationale: Tuwirang pinananatili ang larawan ng pagbagsak sa harapan ng kalaban.
- source_word: יֶשׁ כֹּחַ בֵּאלֹהִים
  choice: may kapangyarihan ang Diyos
  rationale: Natural na Filipino na tapat sa pahayag na nasa Diyos ang kakayahang kumilos.
- source_word: לַעְזֹר וּלְהַכְשִׁיל
  choice: na tumulong at magbuwal
  rationale: Pinananatili ang balanseng magkatambal na kilos at ang pag-uulit ng ugat na כשל sa pamamagitan ng “ibubuwal/magbuwal.”
theological_decisions:
- issue: Tuwirang pagkilos ng Diyos sa pagkatalo sa digmaan
  choice: Tahasan na ang Diyos ang magbubuwal at may kapangyarihan siyang tumulong o magbuwal.
  alternative: Palambutin ang pahayag upang sabihing pinahihintulutan lamang ng Diyos ang pagkatalo.
  rationale: Tuwirang iniuugnay ng Hebreo sa Diyos ang causative na kilos. Pinananatili ng salin ang tensiyong teolohikal sa halip na ipaliwanag o palambutin ito.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “magpakatatag” bilang likas na utos sa konteksto ng labanan, at ang “ibubuwal/magbuwal” upang mapanatili ang mahalagang pag-uulit sa Hebreo.
