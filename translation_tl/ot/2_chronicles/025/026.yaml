base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/026.yaml
  text: The rest of the acts of Amaziah[a], from first to last[b], are they not written in the Book of the Kings of Judah and Israel?
translation:
  language: tl
  text: Ang iba pang mga ginawa[a] ni Amazias, mula sa simula hanggang sa wakas, hindi ba nakasulat ang mga iyon sa Aklat[b] ng mga Hari ng Juda at Israel?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “mga salita” o “mga usapin”; sa ganitong buod tungkol sa isang hari, saklaw nito ang kanyang mga ginawa at ang mga pangyayari sa kanyang paghahari.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “sa ibabaw ng aklat”; ang “sa Aklat” ang likas na idyoma para sa isang nakasulat na tala.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר
  choice: Ang iba pang
  rationale: Likas na Filipino para sa natitirang bahagi ng ulat; hindi dinagdagan ng tahasang temporal na panandang wala sa Hebreo.
- source_word: דִּבְרֵי
  choice: mga ginawa
  rationale: Bagaman literal na “mga salita” o “mga usapin,” sa pormulang pangwakas tungkol sa isang hari ay tumutukoy ito sa kanyang mga gawa at pangyayari sa paghahari.
- source_word: אֲמַצְיָהוּ
  choice: Amazias
  rationale: Ginamit ang nakaugaliang anyo ng pangalan sa modernong saling Filipino.
- source_word: הָרִאשֹׁנִים וְהָאַחֲרוֹנִים
  choice: mula sa simula hanggang sa wakas
  rationale: Natural na Filipino na naghahayag ng buong saklaw ng mga ginawa, habang pinananatili ang pares na una at huli.
- source_word: הֲלֹא ... הִנָּם כְּתוּבִים
  choice: hindi ba nakasulat ang mga iyon
  rationale: Pinananatili ang retorikal na tanong na umaasa ng positibong sagot at ang maramihang reperensiya sa mga ginawa.
- source_word: עַל סֵפֶר
  choice: sa Aklat
  rationale: Ang literal na pang-ukol ay “sa ibabaw ng,” ngunit sa pormulang dokumentaryo, “nakasulat sa Aklat” ang malinaw at likas na idyomang Filipino.
- source_word: מַלְכֵי יְהוּדָה וְיִשְׂרָאֵל
  choice: ng mga Hari ng Juda at Israel
  rationale: Pinanatili ang pagkakasunod na Juda at Israel at itinuring na pamagat ang tinutukoy na aklat.
