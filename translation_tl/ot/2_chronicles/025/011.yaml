  register: Makabago at marangal na Filipino na madaling maunawaan. Pinanatili ang Hebreong idyomang “mga anak ni Seir” sa pangunahing teksto, habang ibinigay sa talababa ang mas likas na mga katumbas. Ginamit ang “Amazias” bilang anyong madaling bigkasin sa Filipino.
