base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/011.yaml
  text: Then Amaziah strengthened himself[a], led his people, and went to the Valley of Salt, where he struck down ten thousand of the sons of Seir.
translation:
  language: tl
  text: Pagkatapos, nagpatatag si Amazias, pinangunahan ang kanyang bayan, at nagtungo sa Lambak ng Asin, kung saan pinabagsak niya ang sampung libong anak ni Seir.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “mga taga-Seir” o “mga inapo ni Seir.” Literal sa Hebreo: “mga anak ni Seir,” isang etniko-genealogical na pananalita.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִתְחַזַּק
  choice: nagpakalakas
  rationale: 'Pinananatili nito ang reflexive na diwa ng Hitpael: sadyang pinalakas o pinatatag ni Amazias ang kanyang sarili, nang hindi nililimitahan ang kahulugan sa tapang lamang.'
- source_word: וַיִּנְהַג אֶת־עַמּוֹ
  choice: pinangunahan niya ang kanyang bayan
  rationale: Maaaring mangahulugan ang נהג ng pangunguna, paggabay, o pagpapasulong. Ang “pinangunahan” ay natural sa kontekstong militar ngunit hindi nagdaragdag ng tiyak na taktikang wala sa Hebreo.
- source_word: גֵּיא הַמֶּלַח
  choice: Lambak ng Asin
  rationale: Tuwirang salin ito ng pangalan ng lugar; ang malaking titik ay nagpapakitang kinikilalang heograpikong pangalan ito.
- source_word: וַיַּךְ
  choice: pinabagsak
  rationale: Malawak ang saklaw ng נכה—maaaring humampas, lumupig, o pumatay. Ang “pinabagsak” ay angkop sa labanan at hindi labis na nagpapakitid sa kahulugan.
- source_word: בְּנֵי שֵׂעִיר
  choice: mga anak ni Seir
  rationale: Pinananatili nito ang literal na etniko-genealogical na idyoma ng Hebreo. Ipinaliliwanag sa talababa ang mas likas na alternatibo sa Filipino.
- source_word: עֲשֶׂרֶת אֲלָפִים
  choice: sampung libo
  rationale: Ito ang tuwiran at karaniwang salin ng bilang sa Hebreo.
- source_word: וַאֲמַצְיָהוּ
  choice: Pagkatapos, nagpakalakas si Amazias
  rationale: Ang “Pagkatapos” ay natural na naghuhudyat ng pagpapatuloy at pagkakasunod-sunod ng salaysay na ipinahihiwatig ng waw.
