  yaml_path: translation/ot/2_chronicles/025/022.yaml
  text: And Judah was defeated before Israel[a], and each man fled to his tent.
translation:
  language: tl
  text: At natalo ang Juda sa harap ng Israel, at tumakas ang bawat lalaki patungo sa sarili niyang tolda.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “bawat lalaki sa kanyang tolda,” isang idyoma para sa pagkakawatak-watak at pag-urong ng bawat isa sa sarili niyang lugar.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּנָּגֶף
  choice: natalo
  rationale: Sa konteksto ng labanan, ang Niphal ng נָגַף ay tumutukoy sa pagkatalo, hindi lamang sa pisikal na pagkakasugat o pagkabuwal.
- source_word: יְהוּדָה
  choice: Juda
  rationale: Karaniwang anyong Tagalog ng pangalan ng katimugang kaharian.
- source_word: לִפְנֵי
  choice: sa harap ng
  rationale: Pinananatili nito ang Hebreong paglalarawan ng pagkatalo sa harap ng kalaban, habang malinaw pa rin sa konteksto na Israel ang tumalo sa Juda.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Karaniwang anyong Tagalog ng pangalan ng hilagang kaharian.
- source_word: וַיָּנֻסוּ
  choice: tumakas
  rationale: Tuwirang ipinapahayag ang paglikas mula sa labanan at natural sa makabagong salaysay na Tagalog.
- source_word: אִישׁ
  choice: ang bawat lalaki
  rationale: Distributibo ang isahang אִישׁ at sa konteksto ay tumutukoy sa mga lalaking mandirigma; pinananatili ang kasarian at indibidwal na diwa ng Hebreo.
- source_word: לְאֹהָלָיו
  choice: patungo sa sarili niyang tolda
  rationale: Pinananatili ang literal na larawan ng tolda at nililinaw ang distributibong pag-uwi o pagbalik ng bawat isa sa kani-kaniyang lugar.
