  yaml_path: translation/ot/2_chronicles/025/006.yaml
  text: And he hired from Israel one hundred thousand mighty men of valor for one hundred talents of silver[a].
translation:
  language: tl
  text: Nag-upa siya mula sa Israel ng 100,000 magigiting na mandirigma kapalit ng 100 talento ng pilak.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “malalakas na mandirigma” o “mahuhusay na kawal.” Ang ekspresyon sa Hebreo ay tumutukoy sa mga lalaking may kakayahang lumaban.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂכֹּר
  choice: kumuha siya ... sa halagang
  rationale: Ang Qal ng שׂכר ay tumutukoy sa pagkuha o pag-upa kapalit ng bayad. Sa Filipino, ang pagkakaugnay ng “kumuha” at “sa halagang” ay malinaw na nagpapahayag na binayaran ang mga kawal nang hindi idinaragdag ang mas interpretibong katawagang “mersenaryo.”
- source_word: מִיִּשְׂרָאֵל
  choice: mula sa Israel
  rationale: Ang מן ay nagsasaad ng pinagmulan; tumutukoy rito ang Israel sa hilagang kaharian na pinanggalingan ng mga kinuha.
- source_word: מֵאָה אֶלֶף
  choice: 100,000
  rationale: Tuwirang inililipat ang bilang sa karaniwang makabagong anyong numerikal para madaling mabasa.
- source_word: גִּבּוֹר חָיִל
  choice: magigiting na mandirigma
  rationale: Ang parirala ay tumutukoy sa malalakas, may kakayahan, at magigiting na lalaking panlaban. Natural sa modernong Filipino ang “magigiting na mandirigma” at napapanatili nito ang diwang militar.
- source_word: בְּמֵאָה כִכַּר כָּסֶף
  choice: sa halagang 100 talentong pilak
  rationale: Ang בְּ ay nagsasaad dito ng presyo o kabayaran. Pinananatili ang sinaunang yunit na “talento” sa halip na tantiyahin ito sa modernong timbang o salapi.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mandirigma” upang natural na maipahayag ang diwang militar ng pariralang Hebreo, at pinanatili ang “talento” bilang sinaunang yunit.
