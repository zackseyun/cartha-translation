base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/017.yaml
  text: Then Amaziah king of Judah took counsel and sent to Joash son of Jehoahaz[a], son of Jehu, king of Israel, saying, “Come, let us face one another.”
translation:
  language: tl
  text: 'Pagkatapos makipagsanggunian, nagpasabi si Amazias na hari ng Juda kay Joas, na hari ng Israel at anak ni Jehoahaz na anak naman ni Jehu: “Halika, magharap tayo.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “magkita tayo nang harapan.” Ang idyomang Hebreo ay literal na tumutukoy sa pagkakita sa mukha ng isa’t isa at, sa kontekstong ito, malamang na nagpapahiwatig ng tuwirang paghaharap.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּוָּעַץ
  choice: Pagkatapos makipagsanggunian
  rationale: Ipinahahayag ng Niphal ng יעץ ang pagsangguni o maingat na pag-uusap bago kumilos. Likas sa makabagong Tagalog ang pariralang ito at pinananatili nito ang pagkakasunod ng mga pangyayari.
- source_word: וַיִּשְׁלַח אֶל ... לֵאמֹר
  choice: 'nagpasabi ... kay ... :'
  rationale: Sa Hebreo, literal na nagsugo si Amazias patungo kay Joas upang sabihin ang mensahe. Ang “nagpasabi” ay likas na paraan sa Tagalog upang ipahiwatig ang ipinadalang mensahe nang hindi maling sinasabing personal na pumunta si Amazias.
- source_word: יוֹאָשׁ בֶּן־יְהוֹאָחָז בֶּן־יֵהוּא מֶלֶךְ יִשְׂרָאֵל
  choice: Joas, na hari ng Israel at anak ni Jehoahaz na anak naman ni Jehu
  rationale: Pinananatili ang buong angkan at titulo. Inuna ang titulong “hari ng Israel” pagkatapos ng pangalan upang luminaw na si Joas, hindi si Jehu, ang tinutukoy na hari sa sugnay.
- source_word: לְךָ
  choice: Halika
  rationale: Ang pautos ay isang maikli at tuwirang paanyaya o hamon. Ang “Halika” ang pinakanatural na katumbas sa Tagalog.
- source_word: נִתְרָאֶה פָנִים
  choice: magharap tayo
  rationale: Ang idyoma ay literal na tumutukoy sa pagkikita ng mga mukha ngunit sa konteksto ay nagpapahiwatig ng tuwirang paghaharap. Pinananatili ng “magharap tayo” ang maikli at mapanghamong tono.
theological_decisions: []
translation_notes:
  register: Makabago, dignificado, at madaling maunawaang Tagalog. Ginamit ang “nagpasabi” para sa natural na salaysay at ang “magharap tayo” para sa maikli ngunit mapanghamong pahayag; inilagay sa talababa ang mas literal na anyo upang mapanatili ang saklaw ng idyomang Hebreo.
