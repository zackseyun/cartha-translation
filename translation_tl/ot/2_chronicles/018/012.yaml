  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang magalang na panghihikayat ng mensahero at ang pag-uulit ng “mabuti,” habang ipinaliwanag sa talababa ang larawang Hebreo na “iisang bibig.”
