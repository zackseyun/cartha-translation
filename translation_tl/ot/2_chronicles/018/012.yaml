base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/012.yaml
  text: The messenger who had gone to summon Micaiah spoke to him[a], saying, “Look, the words of the prophets are unanimously favorable to the king. Please let your word be like one of theirs, and speak favorably.”
translation:
  language: tl
  text: Ang mensaherong pumunta upang ipatawag si Micaias ay nagsabi sa kanya, “Tingnan mo, ang mga salita ng mga propeta ay pawang[a] pabor sa hari. Nawa’y ang iyong salita ay maging gaya ng sa isa sa kanila, at magsalita ka nang pabor.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “iisang bibig,” isang idyomang nangangahulugang lubos na pagkakaisa o pagsasalita nang may iisang tinig.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּלְאָךְ
  choice: mensahero
  rationale: Sa kontekstong ito, isa siyang taong isinugo upang ipatawag si Micaias; kaya mas angkop ang “mensahero” kaysa “anghel.”
- source_word: לִקְרֹא
  choice: ipatawag
  rationale: Ipinahihiwatig ng anyo at konteksto ang opisyal na pagpapapunta kay Micaias sa harap ng hari.
- source_word: לְמִיכָיְהוּ
  choice: Micaias
  rationale: Ginamit ang nakasanayang anyo ng pangalang biblikal sa Filipino.
- source_word: הִנֵּה
  choice: Tingnan mo
  rationale: Pinananatili nito ang pantawag-pansing lakas ng Hebreo sa natural at makabagong Filipino.
- source_word: דִּבְרֵי הַנְּבִאִים
  choice: ang mga propeta sa pagsasalita
  rationale: Natural nitong ipinapahayag sa Filipino ang tinutukoy na magkakatulad na pahayag ng mga propeta.
- source_word: פֶּה אֶחָד
  choice: nagkakaisa
  rationale: Ito ang likas na katumbas sa Filipino ng idyomang Hebreo na literal na “isang bibig”; ipinaliliwanag sa talababa ang larawan ng orihinal.
- source_word: טוֹב אֶל הַמֶּלֶךְ
  choice: mabuti tungkol sa hari
  rationale: Ipinahihiwatig dito ang pahayag na paborable sa hari, habang pinananatili ang payak na salitang “mabuti.”
- source_word: וִיהִי נָא
  choice: Pakiusap, ... sana
  rationale: Magkasamang ipinahahayag ng “pakiusap” at “sana” ang magalang ngunit mapilit na pakiusap ng sugo.
- source_word: דְבָרְךָ כְּאַחַד מֵהֶם
  choice: ang sabihin mo sana ay maging tulad ng sa isa sa kanila
  rationale: Pinananatili ang isahang diwa ng propetikong pahayag at ang paghahambing sa pahayag ng isa sa ibang mga propeta.
- source_word: וְדִבַּרְתָּ טּוֹב
  choice: at magsalita ka ng mabuti
  rationale: Tuwirang pinananatili ang pag-uutos na magbigay ng positibo o paborableng pahayag.
