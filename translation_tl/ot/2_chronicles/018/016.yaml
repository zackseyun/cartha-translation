base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/016.yaml
  text: And he said[a], “I saw all Israel scattered on the mountains, like sheep that have no shepherd. And Yahweh said, ‘These have no master[b]; let each man return to his house in peace.’”
translation:
  language: tl
  text: At sinabi niya, “Nakita ko ang buong Israel na nakakalat sa mga bundok, gaya ng mga tupang walang pastol. At sinabi ni Yahweh, ‘Walang mga panginoon ang mga ito[a]. Bumalik ang bawat isa sa kanyang tahanan nang payapa.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo, “Walang mga panginoon ang mga ito.” Maaari ring unawain nang kolektibo: “Walang panginoon ang mga ito.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: נְפוֹצִים
  choice: nakakalat
  rationale: Ipinahihiwatig ng pasibong pandiwaring ito na ang Israel ay nagkawatak-watak at nagkalat; natural sa Filipino ang “nakakalat” at pinananatili nito ang larawan ng pagkatalo at ng kawan.
- source_word: עַל הֶהָרִים
  choice: sa mga bundok
  rationale: Tuwirang lokatibong salin ito ng parirala at mas malapit ang “mga bundok” kaysa “mga burol.”
- source_word: כַּצֹּאן אֲשֶׁר אֵין לָהֶן רֹעֶה
  choice: gaya ng mga tupang walang pastol
  rationale: Natural at maikli sa Filipino habang pinananatili ang paghahambing at ang pamilyar na larawang biblikal.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang transliterasyon ng banal na pangalan sa halip na palitan ito ng isang titulo.
- source_word: לֹא אֲדֹנִים לָאֵלֶּה
  choice: Walang mga panginoon ang mga ito
  rationale: Pinananatili ang tahasang maramihang anyo ng אֲדֹנִים, kahit medyo di-karaniwan sa Filipino, sapagkat tumutukoy ito sa pagkawala ng namumunong awtoridad.
- source_word: יָשׁוּבוּ אִישׁ לְבֵיתוֹ
  choice: Umuwi nawa ang bawat isa sa kanyang bahay
  rationale: Ipinahahayag ng “nawa” ang pahintulot o utos na taglay ng jussive, at ipinananatili ng “bawat isa” ang distributibong diwa ng אִישׁ.
- source_word: בְּשָׁלוֹם
  choice: nang payapa
  rationale: Natural na Filipino itong katumbas na pinananatili ang diwa ng ligtas at mapayapang pag-uwi.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Personal na pangalan ang nasa tekstong Hebreo; pinananatili ito bilang “Yahweh” sa halip na palitan ng titulong “PANGINOON.”
- issue: Bilang at diwa ng אֲדֹנִים
  choice: mga panginoon
  alternative: panginoon
  rationale: Maramihan ang anyong Hebreo at maaaring tumukoy sa mga namumuno o may kapangyarihan. Pinanatili ang maramihan sa teksto, habang nililinaw sa talababa ang posibleng kolektibong salin sa isahan.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “gaya ng mga tupang walang pastol” bilang likas na idyoma. Sadyang pinanatili ang bahagyang di-karaniwang maramihang “mga panginoon” upang katawanin ang anyong Hebreo at ang tunay na kalabuan nito.
