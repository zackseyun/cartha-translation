base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/008.yaml
  text: Then the king of Israel called one officer and said[a], “Quickly bring Micaiah son of Imla.”
translation:
  language: tl
  text: At tinawag ng hari ng Israel ang isang opisyal[a] at sinabi, “Dalhin mo agad si Micaias na anak ni Imla.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “isang eunuko” o “isang opisyal ng palasyo”; ang salitang Hebreo ay maaaring tumukoy sa literal na eunuko o, sa mas pangkalahatan, sa isang opisyal ng hari.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: tinawag
  rationale: Karaniwang salaysay na pandiwa ito; sa konteksto, tinawag ng hari ang isang tagapaglingkod upang utusan.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: ang hari ng Israel
  rationale: Tuwirang salin ng pariralang tumutukoy sa nagsasalita.
- source_word: אֶל סָרִיס אֶחָד
  choice: ang isang opisyal
  rationale: Ang סָרִיס ay maaaring tumukoy sa isang literal na eunuko o, sa mas malawak na gamit, sa opisyal ng hari. Dito, ang tungkulin niya bilang inuutusang tauhan ng hari ang mahalaga; pinananatili sa talababa ang leksikal na alternatibo.
- source_word: וַיֹּאמֶר
  choice: at sinabi
  rationale: Likas na salin ng karaniwang pandiwa sa pagpapakilala ng tuwirang pananalita.
- source_word: מַהֵר
  choice: Dalhin mo agad
  rationale: Ang pautos na anyo ay naghahayag ng pagmamadali. Ang “agad” ay natural na Filipino at malinaw na naghahatid ng apurahang utos.
- source_word: מיכהו
  choice: Micaias
  rationale: Ginamit ang nakaugaliang anyong Filipino ng pangalang Micaiah, na naiiba rin sa anyong Mikas para sa propeta ng aklat na Mikas.
- source_word: בֶן יִמְלָא
  choice: anak ni Imla
  rationale: Natural at tuwirang salin sa Filipino ng patronimikong parirala.
