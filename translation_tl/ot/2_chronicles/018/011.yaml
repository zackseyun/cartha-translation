id: 2CH.18.11
reference: 2 Chronicles 18:11
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/כָל הַ֨/נְּבִאִ֔ים נִבְּאִ֥ים כֵּ֖ן לֵ/אמֹ֑ר עֲלֵ֞ה רָמֹ֤ת גִּלְעָד֙ וְ/הַצְלַ֔ח וְ/נָתַ֥ן יְהוָ֖ה בְּ/יַ֥ד הַ/מֶּֽלֶךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/011.yaml
  text: And all the prophets were prophesying thus[a], saying, “Go up to Ramoth-gilead and succeed, and Yahweh will give it into the hand of the king.”
translation:
  language: tl
  text: 'At ang lahat ng propeta ay nagpapahayag nang gayon: “Umakyat ka sa Ramot-Gilead at magtagumpay, at ibibigay[a] ito ni Yahweh sa kamay ng hari.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “ibinigay na ito ni Yahweh sa kamay ng hari.” Maaaring ihayag ng anyong Hebreo ang isang mangyayari sa hinaharap bilang tiyak nang naganap.
    reason: Pinananatili ang aspektuwal na kalabuan ng וְנָתַן sa propetikong konteksto.
lexical_decisions:
- source_word: וְ/כָל הַנְּבִאִים
  choice: At ... ng lahat ng propeta
  rationale: Pinananatili ang koordinasyon at ang kabuuang pangkat na tinutukoy ng Hebreo.
- source_word: נִבְּאִים כֵּן
  choice: ganito rin ang ipinahahayag
  rationale: Ang participle ay nagpapahiwatig ng kasabay at nagpapatuloy na pagsasalita; ang כֵּן ay tumutukoy sa magkakatulad na paraan o nilalaman ng kanilang pahayag. Ang “ipinahahayag” ay natural sa makabagong Tagalog at angkop sa propetikong konteksto.
- source_word: לֵ/אמֹר
  choice: colon before direct quotation
  rationale: Sa natural na Tagalog, sapat at mas maayos ang tutuldok upang ipakilala ang tuwirang sinabi kaysa ulitin ang “na sinasabi.”
- source_word: עֲלֵה
  choice: Umakyat ka
  rationale: Pinananatili ang literal na diwa ng pag-akyat o pagpunta paitaas, na maaari ring tumukoy sa pagsalakay sa kontekstong militar.
- source_word: רָמֹת גִּלְעָד
  choice: Ramot-gilead
  rationale: Transliterasyon ng pangalang-pook ayon sa karaniwang anyong madaling bigkasin sa Filipino.
- source_word: וְ/הַצְלַח
  choice: at magtagumpay
  rationale: Tuwirang ipinapahayag ang tagumpay o pagiging matagumpay sa ipinag-uutos na kilos.
- source_word: וְ/נָתַן
  choice: at ibibigay
  rationale: Sa pagkakasunod sa mga pautos at sa propetikong konteksto, ang qatal na ito ay natural na maipahayag bilang tiyak na hinaharap sa Tagalog, habang itinatala sa talababa ang posibleng pagbasa bilang naganap nang tiyak.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang personal na pangalang kinakatawan ng Tetragrammaton sa halip na palitan ito ng isang titulo.
- source_word: בְּ/יַד הַ/מֶּלֶךְ
  choice: sa kamay ng hari
  rationale: Pinananatili ang Hebreong idyoma ng paglalagay sa kamay, na malinaw sa Tagalog bilang pagbibigay sa kapangyarihan o pamamahala ng hari.
theological_decisions:
- issue: Pagpapahayag sa pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Personal na pangalan ang nasa tekstong Hebreo; pinananatili ito bilang Yahweh nang hindi pinapalitan ng titulo.
- issue: Aspekto ng וְנָתַן sa propetikong pahayag
  choice: ibibigay
  alternative: ibinigay na
  rationale: Maaaring katawanin ng Hebreong anyo ang hinaharap na inihahayag nang may katiyakan. Ang pangunahing salin ay gumagamit ng natural na tiyak na hinaharap sa Tagalog, at hindi itinatago ng talababa ang posibilidad na inilalarawan ang tagumpay na para bang naibigay na.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Iniwasan ang labis na arkaikong pananalita; pinanatili ang Hebreong larawang “sa kamay ng hari” at ang personal na pangalang Yahweh.
