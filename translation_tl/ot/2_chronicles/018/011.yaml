  terminology: Ang “Yahweh” ay wastong salin ng יהוה. Ang “magtagumpay,” “Ramot-Gilead,” at “sa kamay ng hari” ay angkop at malinaw sa modernong Filipino Tagalog. Pinananatili ng talababa ang lehitimong aspektuwal na posibilidad ng Hebreong qatal.
