  terminology: Ang “Micaias” ay katanggap-tanggap na nakaugaliang anyo sa Filipino. Ang “pinakaloob na silid” ay malinaw at naaayon sa malamang na kahulugan ng idiom. Inilipat ang talababa sa mismong pariralang ipinaliliwanag nito.
