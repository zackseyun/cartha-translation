translation:
  language: tl
  text: Sinabi ni Micaias, “Makikita mo nga sa araw na iyon, kapag pumasok ka sa pinakaloob na silid[a] upang magtago.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “silid sa loob ng silid” o “silid sa silid”; maaari itong magpahiwatig ng pagpasok sa mas panloob na silid.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Sinabi
  rationale: Likas na salaysay sa Filipino para sa karaniwang Hebreong pormula ng pagsasalita.
- source_word: מִיכָיְהוּ
  choice: Micaias
  rationale: Ginamit ang nakaugaliang anyo ng pangalang biblikal sa Tagalog.
- source_word: הִנְּךָ רֹאֶה
  choice: Makikita mo
  rationale: Ang הִנְּךָ kasama ng participle ay may mapanghulang diwa rito. Sapat nang ipinahahayag ng panghinaharap na 'makikita mo' ang diin at katiyakan nang hindi gumagamit ng matigas o makalumang interjection.
- source_word: בַּיּוֹם הַהוּא
  choice: sa araw na iyon
  rationale: Natural at tuwirang katumbas ng Hebreong pariralang panahunan.
- source_word: אֲשֶׁר תָּבוֹא
  choice: kapag pumasok ka
  rationale: Ipinakikita ng kasunod na parirala ang pagpasok sa isang silid; ang 'kapag' ay nagpapanatili sa ugnayang panahunan ng pangyayari at katuparan.
- source_word: חֶדֶר בְּחֶדֶר
  choice: sa pinakaloob na silid
  rationale: Ipinahihiwatig ng inuulit na pangngalan na may pang-ukol ang pag-urong sa isang silid na nasa loob pa ng ibang silid. Dahil maaari rin itong unawain bilang paglipat-lipat sa mga silid, pinanatili ang alternatibo sa talababa.
- source_word: לְהֵחָבֵא
  choice: upang magtago
  rationale: Natural na Filipino para sa Niphal infinitive; malinaw na ang tinutukoy na paksa ang siyang magtatago.
