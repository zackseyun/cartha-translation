  source_fidelity: Tumpak ang pangunahing diwa at ayos ng pagsasalita. Gayunman, ang “nanghuhula” ay karaniwang tumutukoy sa panghuhula o fortune-telling sa modernong Tagalog, hindi sa propetikong pagpapahayag. Mas tapat at malinaw ang “nagpapahayag ng mabuting hula.”
  naturalness: Karaniwang natural ang salin, ngunit mas maayos ang ayos na “maaari tayong sumangguni kay Yahweh sa pamamagitan niya.” Ang “kundi laging masama” ay kulang ang ipinahihiwatig na pangngalan at maaaring ayusin bilang “kundi laging masamang hula.”
  terminology: Pinananatili ang “Yahweh,” gayundin ang mga pangalang Jehosafat, Micaias, at Imla. Ang “sumangguni kay Yahweh” ay angkop para sa דרשׁ sa kontekstong ito; ang “magpahayag ng hula” ay umiiwas sa maling konotasyon ng “manghula.”
