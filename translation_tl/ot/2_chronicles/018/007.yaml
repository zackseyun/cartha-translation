    issue: “kundi laging masama”
    rationale: Bagaman mauunawaan mula sa naunang pandiwa, hindi ganap na natural ang elliptical na pang-uri. Ang “kundi laging masamang hula” ay malinaw at pinananatili ang habitual na di-paborableng nilalaman.
  - severity: low
