reference: 2 Chronicles 18:7
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר מֶֽלֶךְ יִשְׂרָאֵ֣ל אֶֽל יְהוֹשָׁפָ֡ט ע֣וֹד אִישׁ אֶחָ֡ד לִ/דְרוֹשׁ֩ אֶת יְהוָ֨ה מֵֽ/אֹת֜/וֹ וַ/אֲנִ֣י שְׂנֵאתִ֗י/הוּ כִּֽי אֵ֠ינֶ/נּוּ מִתְנַבֵּ֨א עָלַ֤/י לְ/טוֹבָה֙ כִּ֣י כָל יָמָ֣י/ו לְ/רָעָ֔ה ה֖וּא מִיכָ֣יְהוּ בֶן יִמְלָ֑א וַ/יֹּ֨אמֶר֙ יְה֣וֹשָׁפָ֔ט אַל יֹאמַ֥ר הַ/מֶּ֖לֶךְ כֵּֽן־׀־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/007.yaml
  text: Then the king of Israel said to Jehoshaphat[a], “There is still one man by whom we may inquire of Yahweh, but I hate him, because he never prophesies good concerning me, but always evil. He is Micaiah son of Imla.” Jehoshaphat said, “Let not the king say so.”
translation:
  language: tl
  text: Sinabi ng hari ng Israel kay Jehosafat, “May isa pang lalaki na maaari tayong sumangguni kay Yahweh[a] sa pamamagitan niya, ngunit kinamumuhian ko siya, sapagkat hindi siya kailanman nagpapahayag ng mabuting hula tungkol sa akin, kundi laging masamang hula. Siya si Micaias na anak ni Imla.” Sinabi ni Jehosafat, “Hindi dapat magsalita nang ganyan ang hari.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “May isa pang lalaki na sa pamamagitan niya ay maaari tayong magtanong kay Yahweh.”
    reason: Ipinahihiwatig ng Hebreong מֵאֹתוֹ na ang pagsangguni kay Yahweh ay ginagawa sa pamamagitan ng lalaking ito.
lexical_decisions:
- source_word: ע֣וֹד אִישׁ אֶחָד
  choice: May isa pang lalaki
  rationale: Ipinahihiwatig ng עוֹד kasama ng אִישׁ אֶחָד na mayroon pang isang natitirang taong maaaring lapitan. Likas at malinaw sa modernong Tagalog ang “may isa pang lalaki.”
- source_word: לִדְרוֹשׁ אֶת־יְהוָה מֵאֹתוֹ
  choice: na sa pamamagitan niya ay maaari tayong sumangguni kay Yahweh
  rationale: Sa kontekstong propetiko, ang דרשׁ אֶת־יְהוָה ay tumutukoy sa pagsangguni o pagtatanong kay Yahweh, at ipinakikita ng מֵאֹתוֹ na ang lalaki ang tagapamagitan. Pinananatili ng salin ang dalawang sangkap nang hindi labis na nagpapaliwanag.
- source_word: וַאֲנִי שְׂנֵאתִיהוּ
  choice: ngunit kinamumuhian ko siya
  rationale: Ang anyong ganap ay nagpapahayag dito ng matatag at nagpapatuloy na saloobin. Ang kasalukuyang “kinamumuhian ko” ang likas na katumbas sa Tagalog, at ang “ngunit” ay nagpapakita ng pagsalungat sa konteksto.
- source_word: כִּי אֵינֶנּוּ מִתְנַבֵּא עָלַי לְטוֹבָה
  choice: sapagkat hindi siya kailanman nanghuhula ng mabuti tungkol sa akin
  rationale: Ang negatibo at participle ay naglalarawan ng kinaugaliang kilos, hindi lamang ng isang pangyayari sa kasalukuyan. Kaya ang “hindi ... kailanman” ay angkop sa reklamo ng hari.
- source_word: כִּי כָל־יָמָיו לְרָעָה
  choice: kundi laging masama
  rationale: Ang literal na “masama sa lahat ng kanyang mga araw” ay idyomatikong tumutukoy sa palagiang di-kanais-nais na hula. Ang pandiwang “nanghuhula” ay nauunawaan mula sa naunang sugnay.
- source_word: מִיכָיְהוּ בֶן־יִמְלָא
  choice: Micaias na anak ni Imla
  rationale: Ginamit ang nakikilalang anyong Tagalog ng pangalang Micaias at pinanatili ang tuwirang patronimikong “anak ni Imla.”
- source_word: אַל יֹאמַר הַמֶּלֶךְ כֵּן
  choice: Hindi dapat magsalita nang ganyan ang hari
  rationale: Ang אַל at imperfect ay magalang na pagbabawal. Pinananatili ng ikatlong panauhang “ang hari” ang magalang at di-tuwirang pagsaway ni Jehosafat, habang natural ang anyo sa modernong Tagalog.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang isinalin ang Tetragrammaton bilang personal na pangalang “Yahweh,” sa halip na palitan ito ng isang titulo.
theological_decisions:
- issue: Paglalarawan sa mensahe ni Micaias bilang mabuti o masama
  choice: 'Pinanatili ang pananaw ng hari: “mabuti tungkol sa akin” at “laging masama.”'
  alternative: Ipaliwanag ang “masama” bilang hatol o kapahamakang ipinahayag ng propeta.
  rationale: Hindi sinasabi ng teksto na mali o masama sa moral ang hula; inilalahad nito ang reklamo ng hari na hindi paborable sa kanya ang mga hula. Hindi nilutas ng salin ang tensiyon sa pamamagitan ng pagdaragdag ng interpretasyon.
- issue: Pag-render sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehovah
  rationale: Personal na pangalan ang tuwirang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang pangalang tipan sa halip na palitan ito ng titulo.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang magalang na pagtukoy ni Jehosafat sa hari sa ikatlong panauhan at iniwasan ang masyadong makalumang “Huwag nawang sabihin ng hari.”
