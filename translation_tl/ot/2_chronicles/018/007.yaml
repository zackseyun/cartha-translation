    issue: “nanghuhula ng mabuti”
    rationale: Sa modernong Filipino, ang “manghula” ay madalas na nauugnay sa panghuhula o panghuhulang okulto. Ang Hebreong מתנבא ay tumutukoy rito sa propetikong pagpapahayag; kailangang ipahayag ito nang mas malinaw.
