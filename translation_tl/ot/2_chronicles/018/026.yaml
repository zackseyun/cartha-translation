base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/026.yaml
  text: 'and say[a], ‘Thus says the king: Put this man in the prison, and feed him with bread of affliction and water of affliction until I return in peace.’'
translation:
  language: tl
  text: 'at sabihin ninyo, “Ganito ang sabi ng hari: Ibilanggo ninyo ang taong ito, at pakainin siya ng tinapay ng paghihirap at painumin ng tubig ng paghihirap[a] hanggang sa makabalik akong ligtas.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “tinapay ng kagipitan at tubig ng kagipitan”; malamang na tumutukoy ito sa kakaunting rasyong ibinibigay sa bilanggo sa panahon ng paghihirap.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲמַרְתֶּם
  choice: at sabihin ninyo
  rationale: Ang anyong pangmaramihan ay nagpapatuloy sa utos ng hari; natural sa Filipino ang tahasang pautos na “sabihin ninyo.”
- source_word: כֹּה אָמַר הַמֶּלֶךְ
  choice: Ganito ang sabi ng hari
  rationale: Karaniwang pormula ito ng opisyal na mensahe. Pinananatili ng salin ang bigat ng pahayag ngunit natural sa modernong Filipino.
- source_word: שִׂימוּ זֶה בֵּית הַכֶּלֶא
  choice: Ibilanggo ninyo ang taong ito
  rationale: Ang literal na “ilagay ang taong ito sa bahay-kulungan” ay ginawang likas na Filipino nang hindi inaalis ang bahagyang mapanghamak na pagtukoy na “ang taong ito.”
- source_word: וְהַאֲכִלֻהוּ
  choice: pakainin siya ... at painumin
  rationale: Bagaman iisang pandiwang causative ang ginagamit sa Hebreo bago ang tinapay at tubig, kailangang gumamit ng magkatugmang pandiwa sa Filipino para sa pagkain at inumin.
- source_word: לֶחֶם לַחַץ וּמַיִם לַחַץ
  choice: tinapay ng paghihirap at tubig ng paghihirap
  rationale: Pinananatili nito ang inuulit na idyoma at paralelismo ng Hebreo. Maaaring tumukoy ang parirala sa kakaunti o maralitang rasyon sa bilangguan, kaya ipinaliliwanag ang posibilidad na iyon sa talababa sa halip na gawing tiyak sa teksto.
- source_word: עַד שׁוּבִי בְשָׁלוֹם
  choice: hanggang sa makabalik akong ligtas
  rationale: Sa konteksto ng pagbabalik mula sa digmaan, ang בְשָׁלוֹם ay likas na nangangahulugang ligtas at walang pinsala; pinananatili rin nito ang kabalintunaan ng sinabi ng hari.
