  yaml_path: translation/ot/2_chronicles/018/001.yaml
  text: Jehoshaphat had great wealth and honor[a], and he allied himself by marriage with Ahab.
translation:
  language: tl
  text: Napakarami ng kayamanan ni Jehosafat at napakataas ng kanyang karangalan, at nakipag-alyansa siya kay Ahab sa pamamagitan ng kasal.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “naging magkamag-anak sila ni Ahab sa pamamagitan ng kasal,” o “nakipag-alyansa siya kay Ahab sa pamamagitan ng kasal.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי לִיהוֹשָׁפָט
  choice: Napakarami ... ni Jehosafat
  rationale: Ang konstruksyong may היה at לְ ay nagpapahayag ng pag-aari. Likas sa modernong Tagalog ang ganitong ayos, at hindi na dinagdagan ng tahasang panandang panahong wala naman sa Hebreo.
- source_word: עֹשֶׁר וְכָבוֹד לָרֹב
  choice: Napakarami ng kayamanan at karangalan
  rationale: Ang עֹשֶׁר ay materyal na kayamanan, samantalang ang כָבוֹד sa kontekstong maharlika ay karangalan o mataas na katayuan. Ang לָרֹב ay nagsasaad ng labis na kasaganaan at likas na naipapahayag ng “napakarami.”
- source_word: וַיִּתְחַתֵּן
  choice: nakipag-alyansa ... sa pamamagitan ng pag-aasawa
  rationale: Ang hitpael ng חתן ay tumutukoy sa pagpasok sa ugnayang pampamilya sa pamamagitan ng kasal, hindi kinakailangang sa personal na pag-aasawa ni Jehosafat mismo. Naipapakita rin ng “alyansa” ang dinastiko at pampolitikang diwa sa konteksto.
- source_word: לְאַחְאָב
  choice: kay Ahab
  rationale: Sa Tagalog, ang “nakipag-alyansa kay Ahab” ang likas na paraan ng pagpapahayag ng relasyong ipinakikita ng Hebreong לְ.
theological_decisions:
- issue: Saklaw ng וַיִּתְחַתֵּן לְאַחְאָב
  choice: Nakipag-alyansa siya kay Ahab sa pamamagitan ng pag-aasawa
  alternative: Naging kamag-anak siya ni Ahab dahil sa pag-aasawa
  rationale: Hindi sinasabi ng talata na si Jehosafat mismo ang nag-asawa. Pinananatili ng salin ang dinastikong ugnayan nang hindi tinutukoy kung aling mga miyembro ng pamilya ang ikinasal.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “pag-aasawa” sa malawak na diwang ugnayang dulot ng kasal; inilagay ang talababa upang mapanatili ang saklaw at bahagyang kalabuan ng pandiwang Hebreo.
