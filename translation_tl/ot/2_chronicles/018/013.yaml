  rationale: Pinalitan ang hindi likas at may idinagdag na konseptong “Saksi ang buhay ni Yahweh” ng tuwirang Tagalog na “Buhay si Yahweh!” Pinananatili nito ang panunumpang puwersa ng חַי יְהוָה, ang pangalan na Yahweh, at ang taimtim na rehistro. Ang “Anuman” ay malinaw na sumasaklaw sa אֵת אֲשֶׁר, samantalang ang “iyon” ay pinananatili ang resumptive na panghalip אֹתוֹ.
