base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/013.yaml
  text: But Micaiah said[a], “As Yahweh lives, whatever my God says, that I will speak.”
translation:
  language: tl
  text: Ngunit sinabi ni Micaias, “Buhay si Yahweh[a]! Anuman ang sabihin ng aking Diyos, iyon ang sasabihin ko.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isang pormula ng taimtim na panunumpa; maaari ring ipahayag na, “Kasingtotoong buhay si Yahweh.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Ngunit sinabi
  rationale: Ang waw-consecutive ay nagpapatuloy sa salaysay, ngunit ang tugon ni Micaias ay tahasang sumasalungat sa paghimok ng mensahero sa naunang talata; kaya likas sa Filipino ang “Ngunit sinabi.”
- source_word: מִיכָיְהוּ
  choice: Micaias
  rationale: Ginamit ang kinagawiang anyo ng pangalang biblikal sa Filipino.
- source_word: חַי יְהוָה
  choice: Saksi ang buhay ni Yahweh
  rationale: Isa itong pormulang panunumpa sa Hebreo. Ipinahahayag ng saling ito ang lakas ng panunumpa sa likas at marangal na Filipino, habang inilalagay sa talababa ang mas literal na anyo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang ipinahahayag ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: אֵת אֲשֶׁר
  choice: kung ano ang
  rationale: Likas nitong ipinahahayag sa Filipino ang di-tiyak ngunit ganap na saklaw ng bagay na sasabihin ng Diyos.
- source_word: יֹאמַר
  choice: sabihin
  rationale: Ang aspektong di-ganap ay tumutukoy sa anumang ihahayag ng Diyos sa kasalukuyang sitwasyon; ang “kung ano ang sabihin” ang idiomatikong katumbas sa Filipino.
- source_word: אֱלֹהַי
  choice: aking Diyos
  rationale: Pinananatili ang tahasang panlaping unang panauhan at ang personal na katapatan ni Micaias.
- source_word: אֹתוֹ
  choice: iyon
  rationale: Ang panghalip ay muling tumutukoy sa mismong nilalaman ng sasabihin ng Diyos at malinaw itong naipapahayag ng “iyon.”
- source_word: אֲדַבֵּר
  choice: sasabihin ko
  rationale: Sa kontekstong propetiko, natural sa Filipino ang “sasabihin ko” at pinananatili nito ang matibay na pangako ni Micaias na ihahayag lamang ang sinabi ng Diyos.
theological_decisions:
- issue: Pagpapahayag sa pangalang יהוה sa pormulang panunumpa
  choice: Yahweh
  alternative: PANGINOON
  rationale: Tuwirang ginagamit sa Hebreo ang Tetragrammaton bilang personal na pangalan; pinananatili itong “Yahweh” upang hindi mapalitan ng isang titulo.
- issue: Lakas ng pariralang חַי יְהוָה
  choice: 'Pormulang panunumpa: “Saksi ang buhay ni Yahweh”'
  alternative: 'Payak na pahayag: “Buhay si Yahweh”'
  rationale: Sa konteksto, ang parirala ay isang taimtim na panunumpa. Gayunman, dahil maaari itong ilarawan nang mas literal bilang pahayag na “Buhay si Yahweh,” pinanatili ang anyong iyon sa talababa.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang diin at kaayusan ng panunumpa, pati ang pag-uulit na “kung ano… iyon,” nang hindi ginagawang kahoy ang pangungusap.
