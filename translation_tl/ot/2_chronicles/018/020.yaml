base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/020.yaml
  text: Then the spirit came forward and stood before Yahweh and said[a], ‘I will entice him.’ And Yahweh said to him, ‘By what means?’
translation:
  language: tl
  text: Pagkatapos, lumapit ang espiritu at tumayo sa harap ni Yahweh. Sinabi nito[a], “Aakitin ko siya.” Sinabi ni Yahweh sa espiritu, “Sa anong paraan?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “Lilinlangin ko siya” o “Hihikayatin ko siya.” Ang pandiwang Hebreo ay maaaring mangahulugang mang-akit, manghikayat, o manlinlang, depende sa konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרוּחַ
  choice: ang espiritu
  rationale: Bagaman maaaring mangahulugan ang רוּחַ ng hangin, hininga, o espiritu, ang pagkilos, pagtayo, at pagsasalita nito sa kapulungang makalangit ay nagpapakitang isang personal na espirituwal na nilalang ang tinutukoy.
- source_word: וַיֵּצֵא
  choice: lumapit
  rationale: Literal itong ‘lumabas,’ ngunit sa tagpong parang hukuman, ipinahihiwatig nito ang pagharap o paglapit ng espiritu upang magprisinta sa harap ni Yahweh.
- source_word: וַיַּעֲמֹד לִפְנֵי
  choice: tumayo sa harap
  rationale: Pinananatili nito ang pormal na tagpo ng pagharap at paglilingkod sa presensiya ni Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
- source_word: אֲפַתֶּנּוּ
  choice: Aakitin ko siya
  rationale: Ang piel ng פתה ay maaaring mangahulugang mang-akit, manghikayat, o mandaya. Ang ‘aakitin’ ay nagpapanatili sa lawak at tensiyon ng kahulugan habang hindi pa inuunahan ang paraang ipaliliwanag sa kasunod na talata.
- source_word: בַּמָּה
  choice: Sa anong paraan?
  rationale: Natural na itinatanong nito ang paraan o kasangkapang gagamitin ng espiritu.
theological_decisions:
- issue: Paglalapat ng pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; ang PANGINOON
  rationale: Pinananatili ang personal na pangalang nasa tekstong Hebreo at hindi ito pinapalitan ng titulo.
- issue: Moral at teolohikal na pahiwatig ng פתה sa kapulungang makalangit
  choice: Aakitin ko siya
  alternative: Hihikayatin ko siya; Dadayain ko siya
  rationale: Hindi pa tahasang sinasabi sa talatang ito ang eksaktong paraan. Ang napiling salita ay nagpapanatili sa tunay na kalabuan at tensiyong nililinaw pa sa kasunod na talata.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “nito” para sa espiritu upang hindi magtakda ng kasariang hindi ipinahahayag ng Hebreo. Ang “lumapit” ay natural sa isang pormal na tagpo ng pagharap, samantalang ang “Sa anong paraan?” ay malinaw na nagsasaad ng tanong tungkol sa pamamaraan.
