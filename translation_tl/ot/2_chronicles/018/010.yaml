  naturalness: Malinaw at likas ang modernong Filipino. Ang “Ganito ang sabi ni Yahweh” ay mas tuwiran at mas idiomatiko para sa כֹּה אָמַר kaysa “Ganito ang sinabi ni Yahweh,” habang pinananatili ang marangal na rehistro.
