  text: וַ/יַּ֥עַשׂ ל֛/וֹ צִדְקִיָּ֥הוּ בֶֽן כְּנַעֲנָ֖ה קַרְנֵ֣י בַרְזֶ֑ל וַ/יֹּ֨אמֶר֙ כֹּֽה אָמַ֣ר יְהוָ֔ה בְּ/אֵ֛לֶּה תְּנַגַּ֥ח אֶת אֲרָ֖ם עַד כַּלּוֹתָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/010.yaml
  text: 'Then Zedekiah son of Chenaanah made horns of iron for himself and said[b][a], “Thus says Yahweh: With these you will gore Aram until they are finished off.”'
translation:
  language: tl
  text: 'Pagkatapos, gumawa si Zedekias na anak ni Quenaana ng mga sungay na bakal para sa sarili niya. Sinabi niya, “Ganito ang sabi ni Yahweh: Sa pamamagitan ng mga ito, susuwagin[a] mo ang Aram[b] hanggang sa maubos sila.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “susuwagin” ay maaari ring isaling “itutulak.” Ang pandiwang Hebreo ay tumutukoy sa pag-ulos o pagtulak ng isang hayop gamit ang sungay nito.
    reason: lexical_alternative
  - marker: b
    text: Ang “Aram” ay maaari ring isaling “mga Arameo” o, gamit ang mas huling katawagan, “Siria.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ לוֹ
  choice: gumawa ... para sa sarili niya
  rationale: 'Ipinahahayag nito ang natural na reflexive na diwa ng לּוֹ sa konteksto: si Zedekias ang gumawa at gumamit ng mga sungay bilang tandang propetiko.'
- source_word: צִדְקִיָּהוּ בֶן כְּנַעֲנָה
  choice: Zedekias na anak ni Quenaana
  rationale: Pinananatili ang personal na pangalan at ang Hebreong patronimikong ayos sa anyong pamilyar at nababasa sa Filipino.
- source_word: קַרְנֵי בַרְזֶל
  choice: mga sungay na bakal
  rationale: Direktang pinananatili ang larawan ng mga sungay at ang materyal na bakal nang walang dagdag na interpretasyon.
- source_word: כֹּה אָמַר יְהוָה
  choice: Ganito ang sinabi ni Yahweh
  rationale: Natural at marangal na Filipino para sa pormulang mensaherong propetiko, habang pinananatili ang banal na pangalan.
- source_word: בְּאֵלֶּה
  choice: Sa pamamagitan ng mga ito
  rationale: Ipinapakita ang instrumental na gamit ng pang-ukol at ang plural na pagtukoy sa mga sungay.
- source_word: תְּנַגַּח
  choice: susuwagin mo
  rationale: Ang pandiwa ay tumutukoy sa pagsuwag o pag-ulos ng hayop gamit ang sungay; pinananatili ng “susuwagin” ang konkretong larawan ng tandang propetiko.
- source_word: אֶת אֲרָם
  choice: ang Aram
  rationale: Pinananatili ang makasaysayang pangalan ng bayan o kaharian sa halip na palitan ito ng mas huling katawagang “Siria.”
- source_word: עַד כַּלּוֹתָם
  choice: hanggang sa maubos sila
  rationale: Natural na ipinahahayag ang ganap na pagkaubos o pagkalipol, habang hindi tahasang dinaragdagan ang simuno ng pagtatapos na iniwang di-tiyak sa Hebreo.
theological_decisions:
- issue: Paglalarawan sa pahayag ni Zedekias bilang salita ni Yahweh
  choice: 'Pinanatili bilang tuwirang pag-aangkin: “Ganito ang sinabi ni Yahweh”'
  alternative: Lagyan sa salin ng paliwanag na ito ay maling propesiya
  rationale: Hindi hinahatulan sa mismong talata ang pahayag; ang konteksto ang naglalantad sa katangian nito. Ang pagdaragdag ng paliwanag sa teksto ay magpapasya para sa mambabasa nang higit sa sinabi ng talata.
- issue: Pag-render sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo, kaya pinananatili ito bilang “Yahweh” sa halip na palitan ng titulo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Hinati sa dalawang pangungusap ang salaysay at pahayag upang maging natural basahin. Pinanatili ang konkretong larawan ng mga sungay, ang kolektibong “Aram” na sinusundan ng pangmaramihang “sila,” at ang di-tahasang gumagawa ng ganap na pag-ubos.
