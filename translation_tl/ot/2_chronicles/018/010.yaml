revisions:
- from: 'Pagkatapos, gumawa si Zedekias na anak ni Quenaana ng mga sungay na bakal para sa sarili niya. Sinabi niya, “Ganito ang sinabi ni Yahweh: Sa pamamagitan ng mga ito, susuwagin mo ang Aram[a] hanggang sa maubos sila.”[b]'
  to: 'Pagkatapos, gumawa si Zedekias na anak ni Quenaana ng mga sungay na bakal para sa sarili niya. Sinabi niya, “Ganito ang sabi ni Yahweh: Sa pamamagitan ng mga ito, susuwagin[a] mo ang Aram[b] hanggang sa maubos sila.”'
