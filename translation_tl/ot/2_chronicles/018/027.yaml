  text: וַ/יֹּ֣אמֶר מִיכָ֔יְהוּ אִם שׁ֤וֹב תָּשׁוּב֙ בְּ/שָׁל֔וֹם לֹא דִבֶּ֥ר יְהוָ֖ה בִּ֑/י וַ/יֹּ֕אמֶר שִׁמְע֖וּ עַמִּ֥ים כֻּלָּֽ/ם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/027.yaml
  text: And Micaiah said[a], “If you indeed return in peace, Yahweh has not spoken by me.” Then he said, “Hear[b], all you peoples!”
translation:
  language: tl
  text: Sinabi ni Micaías, “Kung makakabalik ka ngang ligtas, hindi nagsalita si Yahweh sa pamamagitan ko.[a]” At sinabi niya, “Makinig kayo, lahat kayong mga bayan![b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “hindi nagsalita si Yahweh sa akin”; ang diwa rito ay “sa pamamagitan ko.”
    reason: Ipinapakita ng tala ang literal na anyo ng Hebreo habang nililinaw ang instrumental na diwa nito sa konteksto.
  - marker: b
    text: Maramihan sa Hebreo ang “mga bayan,” kaya mas malawak ang propetikong panawagan kaysa sa “bayan” lamang.
    reason: Pinananatili ng tala ang gramatikal na maramihan at ang posibleng mas malawak na saklaw ng pahayag.
lexical_decisions:
- source_word: מִיכָיְהוּ
  choice: Micaias
  rationale: Ginamit ang nakaugaliang anyo ng pangalang ito sa Tagalog upang maging madaling makilala ng mga mambabasa, sa halip na isalin ang kahulugan ng pangalan.
- source_word: אִם שׁוֹב תָּשׁוּב
  choice: Kung makakabalik ka nga
  rationale: Ang infinitive absolute na kasunod ng pandiwa ay nagbibigay-diin sa kondisyon; likas na naihahatid ito sa Tagalog ng “nga.”
- source_word: בְּשָׁלוֹם
  choice: nang ligtas
  rationale: Sa kontekstong ito, ang שָׁלוֹם ay tumutukoy sa pagbabalik na hindi napinsala. Mas natural sa modernong Tagalog ang “nang ligtas” kaysa sa literal na “sa kapayapaan.”
- source_word: לֹא דִבֶּר יְהוָה בִּי
  choice: hindi nagsalita si Yahweh sa pamamagitan ko
  rationale: Ipinahahayag nito na magiging huwad ang propesiya ni Micaias kung ligtas na makababalik ang hari. Ang “sa pamamagitan ko” ay malinaw na naghahatid ng instrumental na diwa ng בִּי.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: שִׁמְעוּ
  choice: Makinig kayo
  rationale: Ang maramihang pautos ay isang taimtim na panawagan upang magbigay-pansin; natural at malinaw sa kasalukuyang Tagalog ang “Makinig kayo.”
- source_word: עַמִּים כֻּלָּם
  choice: kayong lahat, mga bayan
  rationale: Pinananatili ang maramihang עַמִּים bilang “mga bayan,” habang inihahatid ng “kayong lahat” ang kabuuang saklaw at tuwirang pagtawag.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang ginagamit sa Hebreo ang Tetragrammaton. Ang “Yahweh” ay nagpapanatili rito bilang personal na pangalan, nang hindi ito ginagawang pangkalahatang titulo.
- issue: Tagapagsalita sa huling sugnay na וַיֹּאמֶר
  choice: Si Micaias pa rin ang tagapagsalita
  alternative: Isang bagong tagapagsalita na hindi tinukoy
  rationale: Walang bagong paksa na tahasang binanggit sa Hebreo, kaya ang pinakamalapit na tagapagsalita—si Micaias—ang likas na tinutukoy, bagaman nananatiling panghalip ang salin upang huwag magdagdag nang higit sa teksto.
- issue: Saklaw ng עַמִּים sa pangwakas na panawagan
  choice: mga bayan
  alternative: mga tao; buong bayan
  rationale: Maramihan ang anyong Hebreo at may malawak na himig ng isang propetikong panawagan. Hindi ito pinasimple bilang iisang “bayan” o bilang mga tao lamang na nasa hukuman.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “nang ligtas” para sa likas na pagpapahayag ng konteksto, ngunit pinanatili ang diin ng kondisyong Hebreo sa “nga,” ang banal na pangalang “Yahweh,” at ang maramihang “mga bayan.”
