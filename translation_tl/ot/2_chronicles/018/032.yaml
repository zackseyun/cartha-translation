  yaml_path: translation/ot/2_chronicles/018/032.yaml
  text: And when the commanders of the chariots saw that he was not the king of Israel[a], they turned back from following him.
translation:
  language: tl
  text: Nang makita ng mga pinuno ng mga karwaheng pandigma na hindi siya ang hari ng Israel, tumigil sila sa paghabol sa kanya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “bumalik sila mula sa likuran niya,” isang idyomang nangangahulugang itinigil nila ang pagsunod o paghabol sa kanya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּרְאוֹת
  choice: Nang makita
  rationale: Ang וַיְהִי ay nagpapatuloy sa salaysay, at ang infinitive construct na כִּרְאוֹת ay bumubuo ng temporal na sugnay. Likas at malinaw sa Tagalog ang “Nang makita.”
- source_word: שָׂרֵי הָרֶכֶב
  choice: mga pinuno ng mga karwaheng pandigma
  rationale: Ang שָׂרֵי ay tumutukoy sa mga pinunong militar, at ang הָרֶכֶב ay sa mga karwahe o hukbong gumagamit ng mga ito. Nililinaw ng “pandigma” ang kontekstong militar.
- source_word: כִּי לֹא הָיָה מֶלֶךְ יִשְׂרָאֵל
  choice: na hindi siya ang hari ng Israel
  rationale: Walang hayag na paksa sa Hebreo, ngunit ang panlalaking hulapi sa kasunod na מֵאַחֲרָיו ay tumutukoy sa lalaking hinahabol. Kailangan sa natural na Tagalog ang “siya.”
- source_word: וַיָּשֻׁבוּ מֵאַחֲרָיו
  choice: tumigil sila sa paghabol sa kanya
  rationale: Literal itong nagsasaad na tumalikod o bumalik sila mula sa pagsunod sa likuran niya. Sa konteksto ng paglusob at pagtugis, malinaw na ipinahihiwatig na itinigil nila ang paghabol.
theological_decisions: []
translation_notes:
  register: Gumamit ng makabago, malinaw, at marangal na Filipino. Ang “karwaheng pandigma” ay mas madaling maunawaan kaysa sa payak na “karwahe” sa kontekstong militar, at ang “tumigil sila sa paghabol” ay natural na pagpapahayag ng idyomang Hebreo.
