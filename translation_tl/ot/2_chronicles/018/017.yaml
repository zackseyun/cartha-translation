  text: וַ/יֹּ֥אמֶר מֶֽלֶךְ יִשְׂרָאֵ֖ל אֶל יְהוֹשָׁפָ֑ט הֲ/לֹא֙ אָמַ֣רְתִּי אֵלֶ֔י/ךָ לֹא יִתְנַבֵּ֥א עָלַ֛/י ט֖וֹב כִּ֥י אִם לְ/רָֽע־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/017.yaml
  text: Then the king of Israel said to Jehoshaphat[a], “Did I not tell you that he would not prophesy good concerning me, but only evil?”
translation:
  language: tl
  text: Pagkatapos ay sinabi ng hari ng Israel kay Jehosafat, “Hindi ba sinabi ko sa iyo na hindi siya magpropesiya ng mabuti tungkol sa akin, kundi masama lamang?[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Hindi siya magpropesiya ng anumang mabuti tungkol sa akin, kundi kapahamakan lamang.”
    reason: Ipinakikita ng alternatibo ang substantibong gamit ng טוֹב at ang kontekstuwal na diwa ng רָע bilang kapahamakan, hindi kinakailangang moral na kasamaan.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Pagkatapos ay sinabi
  rationale: Isinusulong ng waw-consecutive ang salaysay; natural sa Filipino ang “Pagkatapos ay sinabi” upang ipakita ang pagkakasunod-sunod.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: ang hari ng Israel
  rationale: Tuwirang salin ng construct chain at karaniwang katawagan sa hari sa salaysay.
- source_word: אֶל יְהוֹשָׁפָט
  choice: kay Jehosafat
  rationale: Tinutukoy ng אֶל ang kinakausap. Hindi idinagdag ang titulong “Haring” sapagkat pangalan lamang ang nasa Hebreo.
- source_word: הֲלֹא
  choice: Hindi ba
  rationale: Naghuhudyat ito ng retorikal na tanong na umaasang sasang-ayon ang kausap.
- source_word: אָמַרְתִּי אֵלֶיךָ
  choice: sinabi ko sa iyo
  rationale: Natural at tuwirang Filipino para sa Hebreong parirala, habang pinananatili ang personal na pakikipag-usap.
- source_word: לֹא יִתְנַבֵּא
  choice: hindi siya magpopropesiya
  rationale: Ang imperfect kasunod ng nakaraang pandiwa ng pagsasalita ay tumutukoy sa inaasahang kilos mula sa pananaw ng naunang sinabi ni Ahab.
- source_word: עָלַי
  choice: tungkol sa akin
  rationale: Ipinapakita rito ng עַל ang paksa o tinutukoy ng propesiya, hindi ang makikinabang dito.
- source_word: טוֹב
  choice: mabuti
  rationale: Ginagamit ang pang-uri bilang pangngalan; pinananatili nito ang maikli at mariing pagsalungat sa רָע.
- source_word: כִּי אִם
  choice: kundi ... lamang
  rationale: Ipinahahayag ng parirala ang matinding pagtatangi o pagsalungat; idiomatiko ito sa Filipino.
- source_word: לְרָע
  choice: masama
  rationale: Pinananatili nito ang tahasang antitesis na “mabuti ... masama,” habang nililinaw ng talababa na maaari itong tumukoy sa kapahamakan o masamang pangyayari.
theological_decisions:
- issue: Uri ng mensaheng ipinopropesiya
  choice: mabuti ... kundi masama lamang
  alternative: anumang mabuti ... kundi kapahamakan lamang
  rationale: Hindi kinakailangang tumukoy ang רָע dito sa moral na kasamaan; reklamo ito ng hari na laging salungat o mapaminsala para sa kaniya ang propesiya ni Mikas. Pinananatili sa teksto ang tunay na antitesis ng Hebreo at inilalagay sa talababa ang mas kontekstuwal na kahulugan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang retorikal na tanong at ang maigting na Hebreong pagsalungat na “mabuti ... masama,” nang hindi dinaragdagan ng titulong wala sa pinagmulang teksto.
