base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/002.yaml
  text: After some years[a], he went down to Ahab in Samaria, and Ahab slaughtered sheep and cattle in abundance for him and for the people who were with him[b], and urged him to go up against Ramoth-gilead.
translation:
  language: tl
  text: Pagkalipas ng ilang taon, bumaba si Jehoshafat kay Ahab sa Samaria. Nagkatay si Ahab ng napakaraming tupa at baka para kay Jehoshafat at sa mga taong kasama niya, at inudyukan[a] niya si Jehoshafat na umakyat upang salakayin ang Ramot-gilead[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “hinimok,” “inakit,” o “sinulsulan.”
    reason: lexical_alternative
  - marker: b
    text: Literal na, “umakyat patungo sa Ramot-gilead”; ayon sa konteksto, isang pagsalakay sa lunsod ang tinutukoy.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרֶד
  choice: bumaba siya
  rationale: Pinananatili ang direksiyonal at topograpikong diwa ng pandiwang ירד, mula Juda patungong Samaria.
- source_word: לְקֵץ שָׁנִים
  choice: Pagkalipas ng ilang taon
  rationale: Likas na salin sa modernong Tagalog ng idyomang tumutukoy sa pagdaan ng isang di-tiyak na bilang ng mga taon.
- source_word: אֶל אַחְאָב לְשֹׁמְרוֹן
  choice: patungo kay Ahab sa Samaria
  rationale: Malinaw na ipinakikita kapwa ang taong pinuntahan at ang kinaroroonan niya.
- source_word: וַיִּזְבַּח לוֹ אַחְאָב
  choice: Nagkatay si Ahab ... para sa kanya
  rationale: Maaaring mangahulugan ang זבח ng pagkatay o paghahandog; sa konteksto ng maharlikang pagtanggap at handaan, ang konkretong “nagkatay” ay hindi nagpapalagay ng tahasang ritwal na paghahandog.
- source_word: צֹאן וּבָקָר
  choice: tupa at baka
  rationale: Direkta at karaniwang mga katawagan sa dalawang uri ng hayop.
- source_word: לָרֹב
  choice: napakaraming
  rationale: Natural na inilalarawan sa Tagalog ang saganang dami ng mga kinatay.
- source_word: וְלָעָם אֲשֶׁר עִמּוֹ
  choice: at sa mga taong kasama niya
  rationale: Pinananatili ang malawak na kahulugan ng עָם at hindi ito nililimitahan sa mga kawal.
- source_word: וַיְסִיתֵהוּ
  choice: hinimok[a]
  rationale: Ipinahahayag ang malakas na pag-uudyok nang hindi tiyak na ipinapasok sa pangunahing teksto ang mas negatibong diwa ng panunulsol o pang-aakit; inilalahad ang mga iyon sa talababa.
- source_word: לַעֲלוֹת אֶל רָמוֹת גִּלְעָד
  choice: umakyat upang salakayin ang Ramot-gilead[b]
  rationale: Pinananatili ng “umakyat” ang direksiyonal na larawan ng עלה, samantalang nililinaw ng “upang salakayin” ang kontekstong militar; ang mas literal na anyo ng אֶל ay nasa talababa.
theological_decisions:
- issue: Kung ritwal na paghahandog o paghahandang handaan ang וַיִּזְבַּח
  choice: nagkatay
  alternative: naghandog
  rationale: Hindi tahasang sinasabi ng konteksto na kultikong paghahandog ito; iniiwasan ng “nagkatay” ang pagpasok ng gayong pagpapakahulugan habang pinananatili ang konkretong kilos.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “patungo kay Ahab” upang maging natural ang direksiyon ng paglalakbay, at pinanatili ang “umakyat” bilang mahalagang larawan ng tekstong Hebreo. Ang pangalang-lugar ay isinaling-baybay bilang “Ramot-gilead.”
