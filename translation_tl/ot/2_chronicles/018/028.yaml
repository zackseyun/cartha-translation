base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/028.yaml
  text: So the king of Israel and Jehoshaphat king of Judah went up to Ramoth-gilead.
translation:
  language: tl
  text: Kaya umakyat patungong Ramot-gilead ang hari ng Israel at si Jehoshafat, hari ng Juda.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַל
  choice: pumunta
  rationale: Ang עלה ay literal na ‘umakyat,’ ngunit sa salaysay maaari itong tumukoy sa pagpunta sa isang lugar. Mas natural sa modernong Tagalog ang ‘pumunta’; hindi idinagdag ang di-tiyak na diwang militar ng ‘lumusob.’
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: ang hari ng Israel
  rationale: Tuwirang isinasalin ang karaniwang titulong maharlika, at ang pantukoy na ‘ang’ ay angkop dahil kilala na sa konteksto ang tinutukoy na hari.
- source_word: וִיהוֹשָׁפָט
  choice: at si Jehoshafat
  rationale: Ang וְ ay pandugtong na ‘at,’ at ginamit ang personal marker na ‘si’ na likas sa Tagalog bago ang pangalan.
- source_word: מֶלֶךְ יְהוּדָה
  choice: na hari ng Juda
  rationale: Ginawang pariralang panuring ang kasunod na titulo upang maging malinaw at natural sa Tagalog habang pinananatili ang appositional na ugnayan sa pangalang Jehoshafat.
- source_word: אֶל
  choice: sa
  rationale: Sa pandiwang ‘pumunta,’ ang ‘sa’ ang natural na panandang Tagalog para sa destinasyon.
- source_word: רָמֹת גִּלְעָד
  choice: Ramot-gilead
  rationale: Tinumbasan ang Hebreong pangalan ng lugar sa anyong transliterasyong madaling basahin sa Filipino; pinanatili ng gitling ang pagkakabuo ng tambalang toponimo.
