  text: וַ/יֹּ֣אמֶר יְהוָ֗ה מִ֤י יְפַתֶּה֙ אֶת אַחְאָ֣ב מֶֽלֶךְ יִשְׂרָאֵ֔ל וְ/יַ֕עַל וְ/יִפֹּ֖ל בְּ/רָמ֣וֹת גִּלְעָ֑ד וַ/יֹּ֕אמֶר זֶ֚ה אֹמֵ֣ר כָּ֔כָה וְ/זֶ֖ה אֹמֵ֥ר כָּֽכָה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/019.yaml
  text: And Yahweh said[a], ‘Who will entice Ahab king of Israel, so that he may go up and fall at Ramoth-gilead?’ And one said this, and another said that.
translation:
  language: tl
  text: At sinabi ni Yahweh[a], “Sino ang aakit kay Ahab na hari ng Israel upang umahon at mabuwal siya sa Ramot-Gilead?” At ganito ang sinabi ng isa, at ganoon naman ang sinabi ng iba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “hihikayat” o “lilinlang” sa halip na “aakit.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang personal na pangalan ng Diyos bilang tuwirang transliterasyon ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: יְפַתֶּה
  choice: hihikayat
  rationale: Maaaring mangahulugan ang piel ng פתה na hikayatin, akitin, o linlangin. Pinananatili ng “hihikayat” ang ideya ng pag-uudyok nang hindi agad nililimitahan ang salita sa tahasang panlilinlang; nakatala sa talababa ang mga alternatibo.
- source_word: אַחְאָב מֶלֶךְ יִשְׂרָאֵל
  choice: Ahab na hari ng Israel
  rationale: Natural na apposisyon sa modernong Tagalog na tapat sa titulong maharlika sa Hebreo.
- source_word: וְיַעַל
  choice: upang umahon siya
  rationale: Ipinapahayag ng waw at imperfect ang layunin o inaasahang resulta ng paghihikayat. Ang “umahon” ay angkop sa pagpunta sa lugar ng labanan.
- source_word: וְיִפֹּל
  choice: at mabuwal
  rationale: Pinananatili ang literal at idyomatikong larawan ng נפל na “mahulog/mabuwal,” na sa konteksto ng labanan ay nagpapahiwatig ng pagkatalo o kamatayan nang hindi iyon labis na ipinapaliwanag.
- source_word: בְּרָמוֹת גִּלְעָד
  choice: sa Ramot-Gilead
  rationale: Karaniwang pang-ukol sa Tagalog para sa lokasyon; ang pangalang-pook ay isinalin sa anyong madaling basahin sa Filipino.
- source_word: זֶה אֹמֵר כָּכָה וְזֶה אֹמֵר כָּכָה
  choice: At ganito ang sinabi ng isa, at ganoon naman ang sinabi ng iba
  rationale: Pinananatili ang magkatimbang na estruktura at pagkakaiba ng mga mungkahi sa makalangit na kapulungan, habang natural ang daloy sa Tagalog.
theological_decisions:
- issue: Ang pagkakasangkot ng Diyos sa pagbagsak ni Ahab
  choice: Tuwirang inilalarawan si Yahweh na nagtatanong kung sino ang hihikayat kay Ahab.
  alternative: Palambutin bilang “sino ang pahihintulutan kong makaimpluwensiya” o katulad nito.
  rationale: Tuwirang inihaharap ng Hebreo si Yahweh bilang nagpasimula ng pag-uusap. Pinananatili ang teolohikal na tensiyon at hindi binabawasan ang kaniyang pagkilos.
- issue: Ang moral na diwa ng פתה
  choice: “hihikayat” sa pangunahing teksto
  alternative: “lilinlang” o “aakit”
  rationale: Kabilang sa konteksto ang mapanlinlang na payo na hahantong sa kamatayan ni Ahab, ngunit may mas malawak na saklaw ang pandiwa. Hindi tahasang nilulutas sa pangunahing teksto ang leksikal at moral na ambiguwidad; inilalagay ang mga alternatibo sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang pangalang Yahweh, ang idyomang “mabuwal” sa konteksto ng labanan, at ang balanseng paralelismo ng huling sugnay.
