revisions:
- from: At sinabi ni Yahweh[a], “Sino ang hihikayat kay Ahab na hari ng Israel upang umahon siya at mabuwal sa Ramot-Gilead?” At ganito ang sinabi ng isa, at ganoon naman ang sinabi ng iba.
  to: At sinabi ni Yahweh[a], “Sino ang aakit kay Ahab na hari ng Israel upang umahon at mabuwal siya sa Ramot-Gilead?” At ganito ang sinabi ng isa, at ganoon naman ang sinabi ng iba.
  rationale: Pinalitan ang “hihikayat” ng “aakit” upang mas matapat na maipahayag ang saklaw ng פתה (‘entice’) sa pangunahing teksto, nang hindi ipinipilit na ‘lilinlang’ lamang ang kahulugan. Inayos din ang anyo ng pandiwa sa sugnay ng layunin para sa mas natural na modernong Tagalog. Walang binago sa teolohikal na tensiyon ng talata o sa paralelismong nasa huling sugnay.
