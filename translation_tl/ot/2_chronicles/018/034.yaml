revisions:
- from: Tumindi ang labanan nang araw na iyon. Nanatiling nakatayo sa karwahe ang hari ng Israel, na nakaharap sa Aram, hanggang sa gabi; at namatay siya sa oras ng paglubog ng araw.[a]
  to: Tumindi ang labanan noong araw na iyon. Nanatiling nakatayo sa karwahe ang hari ng Israel, na nakaharap sa Aram, hanggang kinagabihan; at namatay siya sa oras ng paglubog ng araw.[a]
  rationale: Pinalitan ang temporal na “nang araw na iyon” ng mas idiomatikong “noong araw na iyon,” at ang “hanggang sa gabi” ng “hanggang kinagabihan” upang maipakita nang mas tiyak ang עַד הָעָרֶב. Walang binagong kahulugan o idinagdag na interpretasyon.
