base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/034.yaml
  text: And the battle intensified on that day[a], and the king of Israel remained standing in the chariot facing Aram until the evening; and he died at the time of the sun’s going down.
translation:
  language: tl
  text: Tumindi ang labanan noong araw na iyon. Nanatiling nakatayo sa karwahe ang hari ng Israel, na nakaharap sa Aram, hanggang kinagabihan; at namatay siya sa oras ng paglubog ng araw.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “nang lumubog ang araw.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעַל הַמִּלְחָמָה
  choice: Tumindi ang labanan
  rationale: Ang literal na “umakyat ang labanan” ay idyomatikong nagsasaad na lumala o tumindi ang sagupaan. Ang “tumindi” ay likas at malinaw sa modernong Tagalog.
- source_word: בַּיּוֹם הַהוּא
  choice: nang araw na iyon
  rationale: Karaniwang panandang temporal na natural na isinasalin sa Tagalog bilang “nang araw na iyon.”
- source_word: וּמֶלֶךְ יִשְׂרָאֵל
  choice: ang hari ng Israel
  rationale: Tuwiran at pormal na salin ng pariralang konstruktibo.
- source_word: הָיָה מַעֲמִיד
  choice: Nanatiling nakatayo
  rationale: Ang היה kasama ng participle ay nagpapahayag ng patuloy na kalagayan o kilos. May causative na anyo ang מַעֲמִיד, ngunit hindi tahasang sinasabi kung sino ang nagpapanatili sa hari na nakatayo; kaya hindi idinagdag na siya ay “isinandig” o “inalalayan.”
- source_word: בַּמֶּרְכָּבָה
  choice: sa karwahe
  rationale: Ang “karwahe” ay malinaw at karaniwang katumbas ng sasakyang pandigma sa kontekstong biblikal; hindi idinagdag ang “kanyang” na hindi tahasang nasa Hebreo.
- source_word: נֹכַח אֲרָם
  choice: na nakaharap sa Aram
  rationale: Pinananatili ang pangalang Aram at ang diwang nasa tapat o nakaharap dito, nang hindi ipinapalit ang interpretatibong “mga Arameo.”
- source_word: עַד הָעָרֶב
  choice: hanggang sa gabi
  rationale: Natural na Tagalog para sa hangganang temporal na ipinahahayag ng Hebreo.
- source_word: וַיָּמָת
  choice: at namatay siya
  rationale: Tuwirang ipinagpapatuloy ang salaysay at pinananatili ang payak at mariing pahayag ng pagkamatay.
- source_word: לְעֵת בּוֹא הַשָּׁמֶשׁ
  choice: sa oras ng paglubog ng araw
  rationale: Pinananatili ang mas tahasang parirala ng Hebreo tungkol sa oras ng pagdating ng paglubog ng araw, sa halip na paikliin lamang bilang “sa dapithapon.”
theological_decisions: []
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog. Gumamit ng maiikling sugnay at pinanatili ang Aram bilang pangalang pantangi. Inilipat ang talababa sa pariralang talagang tinutukoy nito, ang paglubog ng araw.
