    issue: Ang “nang araw na iyon” ay hindi ang pinakanatural na temporal na pahayag sa kontekstong ito.
    rationale: Ang “noong araw na iyon” ang karaniwang modernong Tagalog para sa “on that day” sa salaysay.
  - severity: medium
    issue: Ang “hanggang sa gabi” ay maaaring magpahiwatig ng hanggang nightfall kaysa sa “hanggang evening.”
    rationale: Ang Hebreong עַד הָעָרֶב ay tumutukoy sa evening; ang “hanggang kinagabihan” ay mas tumpak at natural.
