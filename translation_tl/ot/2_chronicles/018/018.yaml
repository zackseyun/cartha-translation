  text: וַ/יֹּ֕אמֶר לָ/כֵ֖ן שִׁמְע֣וּ דְבַר יְהוָ֑ה רָאִ֤יתִי אֶת יְהוָה֙ יוֹשֵׁ֣ב עַל כִּסְא֔/וֹ וְ/כָל צְבָ֤א הַ/שָּׁמַ֨יִם֙ עֹֽמְדִ֔ים עַל יְמִינ֖/וֹ וּ/שְׂמֹאלֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/018.yaml
  text: 'And he said[a], “Therefore hear the word of Yahweh: I saw Yahweh sitting on his throne, and all the host of heaven standing at his right hand and at his left.”'
translation:
  language: tl
  text: 'Sinabi niya, “Kaya nga, pakinggan ninyo ang salita ni Yahweh: Nakita ko si Yahweh na nakaupo sa kanyang trono, at ang buong hukbo ng langit[a] ay nakatayo sa kanyang kanan at kaliwa.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “ang buong makalangit na hukbo” o “ang lahat ng hukbo sa langit.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Kaya nga
  rationale: Ipinapakita ang bunga o kongklusyon mula sa naunang pag-uusap at pinananatili ang mariing tono ng pahayag ng propeta.
- source_word: שִׁמְעוּ
  choice: pakinggan ninyo
  rationale: Ang pandiwa ay pautos at maramihan; natural sa makabagong Tagalog ang tahasang panawagang ito upang bigyang-pansin ang pahayag.
- source_word: דְבַר יְהוָה
  choice: ang salita ni Yahweh
  rationale: Pinananatili ng “salita” ang karaniwang pormula ng propetikong pagpapahayag, at ang pangalang יהוה ay isinasaling Yahweh.
- source_word: רָאִיתִי
  choice: Nakita ko
  rationale: Tuwirang inilalahad ang pangitain bilang naganap na karanasan ng nagsasalita.
- source_word: יוֹשֵׁב עַל כִּסְאוֹ
  choice: nakaupo sa kanyang trono
  rationale: Likas at tuwirang inilalarawan ang maharlikang larawan ni Yahweh na nasa trono.
- source_word: כָל צְבָא הַשָּׁמַיִם
  choice: ang buong hukbo ng langit
  rationale: Ang צָבָא ay tumutukoy sa isang natipong hukbo o kalipunan; pinananatili ng “hukbo ng langit” ang kolektibo at makalangit na diwa nang hindi tinutukoy nang higit sa sinasabi ng Hebreo kung sino ang mga kasapi nito.
- source_word: עֹמְדִים
  choice: nakatayo
  rationale: Tuwirang tumutugma sa posisyon ng makalangit na hukbo sa tagpo ng korte.
- source_word: עַל יְמִינוֹ וּשְׂמֹאלוֹ
  choice: sa kanyang kanan at kaliwa
  rationale: Natural na Tagalog para sa dalawang panig ng trono at sapat na pinananatili ang simetrikong paglalarawan ng Hebreo.
theological_decisions:
- issue: Pagbanggit sa banal na pangalang יהוה sa pormula ng propeta at sa pangitain
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Tuwirang ginagamit ng Hebreo ang Tetragrammaton. Ang “Yahweh” ay nagpapanatili rito bilang personal na pangalan sa halip na palitan ng isang titulo.
- issue: Pagkakakilanlan ng צְבָא הַשָּׁמַיִם
  choice: hukbo ng langit
  alternative: makalangit na hukbo; lahat ng hukbo sa langit
  rationale: Hindi tahasang tinutukoy ng talata ang eksaktong mga kasapi ng kalipunang ito. Pinananatili ng salin ang malawak na katawagan at hindi ito nililimitahan sa isang partikular na uri ng makalangit na nilalang.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “pakinggan ninyo” bilang natural na maramihang pautos, habang pinanatili ang pormal at propetikong bigat ng pangungusap. Ang talababa [a] ay inilagay mismo pagkatapos ng pariralang tinutukoy nito.
