revisions:
- from: Ngunit isang lalaki ang basta na lamang nagpana at tinamaan ang hari ng Israel sa pagitan ng magkakadugtong na mga piraso ng baluti at ng panangga sa dibdib[a]. Kaya sinabi ng hari sa tagapagmaneho ng karwahe, “Ipihit mo ang iyong kamay[b] at ilabas mo ako sa labanan[c], sapagkat nasugatan ako.”
  to: Ngunit isang lalaki ang nagpaputok ng palaso nang walang tiyak na puntirya at tinamaan niya ang hari ng Israel sa pagitan ng magkakadugtong na mga bahagi ng baluti at ng baluting pantakip sa dibdib[a]. Kaya sinabi ng hari sa tagapagmaneho ng karwahe, “Pihitin mo ang karwahe[b] at ilabas mo ako sa labanan[c], sapagkat nasugatan ako.”
  rationale: Inayos ang pokus ng pandiwa upang malinaw at wastong Filipino ang ugnayan ng mamamana at ng hari. Pinalitan ang di-likas na literal na idyoma ng kontekstuwal na kahulugan nito sa pangunahing teksto, habang inilagay ang literal na Hebreo sa talababa. Bahagyang pinasimple at pinanatiling maingat ang katawagang pangbaluti upang hindi magkunwaring tiyak ang pinagtatalunang terminolohiya.
