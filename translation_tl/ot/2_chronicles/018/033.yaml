translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “karwahe” at “baluti” bilang pamilyar na katawagang makasaysayan. Pinanatili sa pangunahing teksto ang idyomang “Ipihit mo ang iyong kamay,” na may paliwanag sa talababa. Lahat ng marker na [a], [b], at [c] ay nasa pangunahing teksto at nakaayos ayon sa unang paglitaw.
