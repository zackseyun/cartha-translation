    issue: Hindi tugma ang pokus ng pandiwa sa “isang lalaki ... tinamaan ang hari.”
    rationale: 'Sa modernong Filipino, ang “tinamaan” ay karaniwang patient-focus (“tinamaan ang hari”), kaya kailangan ng “niya” upang malinaw na ang lalaki ang ahente: “tinamaan niya ang hari.”'
  - severity: medium
    issue: Hindi natural ang literal na “Ipihit mo ang iyong kamay” sa pangunahing teksto.
    rationale: Ang Hebreong idyoma ay tumutukoy sa pagliko o pagmaniobra ng karwahe. Maaaring ilagay ang natural na kahulugan sa teksto at ang literal na anyo sa talababa, nang hindi nawawala ang ambigwidad.
  - severity: low
    issue: Ang “panangga sa dibdib” ay hindi gaanong natural na katawagan para sa isang bahagi ng baluti.
    rationale: Ang “baluting pantakip sa dibdib” ay mas natural at nananatiling sapat na malawak para sa hindi tiyak na terminolohiyang pangbaluti.
