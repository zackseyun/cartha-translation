base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/033.yaml
  text: But a man drew his bow at random and struck the king of Israel between the scale armor and the breastplate[a]. So he said to the charioteer, “Turn your hand and take me out of the camp[c][b], for I am wounded.”
translation:
  language: tl
  text: Ngunit isang lalaki ang nagpaputok ng palaso nang walang tiyak na puntirya at tinamaan niya ang hari ng Israel sa pagitan ng magkakadugtong na mga bahagi ng baluti at ng baluting pantakip sa dibdib[a]. Kaya sinabi ng hari sa tagapagmaneho ng karwahe, “Pihitin mo ang karwahe[b] at ilabas mo ako sa labanan[c], sapagkat nasugatan ako.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hindi tiyak ang eksaktong tawag sa mga bahaging ito ng sinaunang baluti. Maaari ring isalin, “sa pagitan ng mga dugtungan ng baluti at ng baluting pantakip sa dibdib.” Ipinahihiwatig ng parirala na ang palaso ay tumama sa isang puwang ng baluti ng hari.
    reason: cultural_note
  - marker: b
    text: Literal, “Ipihit mo ang iyong kamay.” Malamang na ang ibig sabihin ay ipihit o imaniobra ang karwahe palayo sa labanan.
    reason: lexical_alternative
  - marker: c
    text: Literal, “mula sa kampo.” Sa kontekstong ito, maaari itong tumukoy sa hukbo o sa pook ng labanan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ
  choice: Ngunit isang lalaki
  rationale: Ang וְ ay nagpapatuloy sa salaysay ngunit may biglang pagsalungat sa inaasahan, kaya natural ang “Ngunit”; ang אִישׁ ay isang di-tiyak na lalaki.
- source_word: מָשַׁךְ בַּקֶּשֶׁת
  choice: nagpana
  rationale: Ito ang natural na modernong Tagalog para sa pagbanat at pagpapakawala ng palaso; hindi kailangang gawing literal na “bumanat ng busog.”
- source_word: לְתֻמּוֹ
  choice: basta na lamang
  rationale: Sa konteksto ng labanan, ipinahihiwatig nito na walang partikular na pinuntirya ang mamamana. Iniiwasan nito ang moral na pakahulugang “sa kanyang kawalang-malay.”
- source_word: וַיַּךְ
  choice: tinamaan
  rationale: Ipinapahayag nito ang aktuwal na pagtama ng palaso, samantalang hiwalay na sinasabi sa hulihan ng talata ang naging sugat.
- source_word: בֵּין הַדְּבָקִים וּבֵין הַשִּׁרְיָן
  choice: sa pagitan ng magkakadugtong na mga piraso ng baluti at ng panangga sa dibdib
  rationale: Pinananatili nito ang posibilidad na ang דְּבָקִים ay mga magkakabit na bahagi o kaliskis ng baluti at na ang שִׁרְיָן ay panangga o baluting pantorso, nang hindi kunwaring tiyak ang eksaktong sinaunang terminolohiya.
- source_word: לָרַכָּב
  choice: sa tagapagmaneho ng karwahe
  rationale: Malinaw at karaniwang Filipino para sa taong nagmamaneho ng karwaheng pandigma.
- source_word: הֲפֹךְ יָדֶיךָ
  choice: Ipihit mo ang iyong kamay
  rationale: Pinananatili ang larawang Hebreo, habang ipinapaliwanag sa talababa na malamang na utos itong imaniobra o ipihit ang karwahe.
- source_word: וְהוֹצֵאתַנִי מִן הַמַּחֲנֶה
  choice: at ilabas mo ako sa labanan
  rationale: Sa kontekstong ito, ang מַחֲנֶה ay tumutukoy sa hukbo o pook ng labanan, hindi lamang sa literal na kampo; mas malinaw sa mambabasa ang “labanan.”
- source_word: כִּי הָחֳלֵיתִי
  choice: sapagkat nasugatan ako
  rationale: Sa agarang konteksto ng pagtama ng palaso, tumutukoy ito sa pagkakasugat o paghina dahil sa sugat. Hindi dinaragdagan ng “malubha” ang teksto, bagaman maaaring ipinahihiwatig ng anyo at konteksto ang seryosong kalagayan.
