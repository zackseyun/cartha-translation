base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/030.yaml
  text: The king of Aram had commanded the commanders of the chariots that were his[a], saying, “Do not fight with either small or great, but only with the king of Israel alone.”
translation:
  language: tl
  text: 'Inutusan ng hari ng Aram ang mga pinuno ng kanyang mga karwahe: “Huwag kayong makipaglaban kaninuman, mababa man o mataas ang katayuan[a], kundi sa hari ng Israel lamang.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal na, “maliit man o dakila.”
    reason: Ipinapakita ang Hebreong idyoma na tumutukoy sa sinuman, anuman ang ranggo o katayuan.
lexical_decisions:
- source_word: וּ/מֶלֶךְ אֲרָם
  choice: ang hari ng Aram
  rationale: Pinanatili ang pangalang “Aram” at hindi na ginamitan ng lantad na panandang pandiskurso; sapat ang daloy ng salaysay sa Tagalog.
- source_word: צִוָּה
  choice: Iniutos
  rationale: Ang pandiwa ay nangangahulugang mag-utos. Ang aspektong perpektibo ng Tagalog ay natural sa pagbibigay ng naunang tagubilin sa loob ng salaysay.
- source_word: שָׂרֵי הָרֶכֶב אֲשֶׁר לוֹ
  choice: ang mga kumander ng kanyang mga karwahe
  rationale: Ang שָׂרֵי ay mga pinunong militar, at ang הָרֶכֶב ay tumutukoy sa mga karwahe o hukbong nakakarwahe. Likas at malinaw sa modernong Tagalog ang piniling anyo.
- source_word: לֵאמֹר
  choice: tuwirang sipi pagkatapos ng kuwit
  rationale: Hindi kailangang isalin nang hiwalay bilang “na sinasabi”; natural sa Tagalog na ipakilala ang mismong utos sa pamamagitan ng tuwirang sipi.
- source_word: לֹא תִּלָּחֲמוּ
  choice: Huwag kayong makipaglaban
  rationale: Malinaw na ipinagbabawal ng anyong pandiwa ang pakikipaglaban ng maramihang kausap.
- source_word: אֶת הַקָּטֹן אֶת הַגָּדוֹל
  choice: sa maliit man o dakila
  rationale: Pinananatili ang Hebreong idyomang sumasaklaw sa tao anuman ang katayuan o ranggo, habang nagbibigay ng talababa para sa tahasang diwa nito.
- source_word: כִּי אִם
  choice: kundi
  rationale: Ipinahahayag ng “kundi” ang pagtatangi at eksklusibong kaibahan pagkatapos ng negatibong utos.
- source_word: אֶת מֶלֶךְ יִשְׂרָאֵל לְבַדּוֹ
  choice: sa hari lamang ng Israel
  rationale: Ang “lamang” ay natural na naghahatid ng eksklusibong diin ng לְבַדּוֹ nang hindi inuulit nang di-likas ang konsepto ng pag-iisa.
