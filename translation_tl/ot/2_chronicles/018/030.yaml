    issue: Hindi wastong gamit ng “Iniutos” sa “Iniutos ng hari ... ang mga kumander.”
    rationale: Ang “iniutos” ay karaniwang kumukuha ng nilalaman ng utos o ng tatanggap na may “sa”; dahil mga tao ang direktang layon sa Hebreo, “Inutusan ... ang mga pinuno” ang wastong Tagalog.
  - severity: low
    issue: Ang “sa maliit man o dakila” ay maaaring tunog literal o hindi ganap na natural sa Tagalog.
    rationale: Ang Hebreong idyoma ay tumutukoy sa sinuman anuman ang ranggo o katayuan. Ang tahasang pagsasalin ay mas malinaw, at ang literal na anyo ay maaaring ilagay sa talababa.
