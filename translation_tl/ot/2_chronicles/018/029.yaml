base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/029.yaml
  text: Then the king of Israel said to Jehoshaphat[a], “Disguise yourself and go into the battle, but you, put on your robes.” So the king of Israel disguised himself, and they went into the battle.
translation:
  language: tl
  text: Sinabi ng hari ng Israel kay Jehosafat, “Magbabalatkayo ako[a] at sasabak sa labanan, ngunit ikaw, isuot mo ang iyong kasuotang panghari.” Kaya nagbalatkayo ang hari ng Israel, at sumabak sila sa labanan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaaring basahin ang maikling anyong Hebreo bilang “Magbalatkayo ka.” Ngunit ipinahihiwatig ng kasunod na sugnay at ng salaysay na ang hari ng Israel ang nagsasabing siya ang magbabalatkayo.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִתְחַפֵּשׂ
  choice: Magbabalatkayo ako
  rationale: Bagaman anyong infinitive absolute ang Hebreo at napakaikli ng pahayag, pinakamalamang na tumutukoy ito sa gagawin mismo ng hari ng Israel. Pinagtitibay ito ng kasunod na salaysay na siya nga ang nagbalatkayo, gayundin ng tahasang paghahambing sa pananamit ni Jehosafat. Isinaad sa talababa ang posibleng mas literal na pagbasa.
- source_word: וָבֹא בַמִּלְחָמָה
  choice: at sasabak sa labanan
  rationale: Likas sa makabagong Tagalog ang “sasabak sa labanan” para sa pagpasok at pakikilahok sa digmaan. Pinananatili nito ang galaw na ipinahihiwatig ng בוא.
- source_word: וְאַתָּה
  choice: ngunit ikaw
  rationale: 'Kontrastibo ang panghalip: magbabalatkayo ang hari ng Israel, samantalang mananatiling makikilala bilang hari si Jehosafat.'
- source_word: לְבַשׁ בְּגָדֶיךָ
  choice: isuot mo ang iyong damit-hari
  rationale: Karaniwang nangangahulugang “mga damit” ang בְּגָדִים, ngunit sa konteksto ay ang makikilalang kasuotang maharlika ni Jehosafat ang tinutukoy. Maikli at natural sa Tagalog ang “damit-hari.”
- source_word: וַיָּבֹאוּ בַּמִּלְחָמָה
  choice: at sumabak sila sa labanan
  rationale: Tumutukoy ang pandiwang maramihan sa dalawang hari. Ang “sumabak” ay natural na salaysay ng pagpasok nila sa aktuwal na labanan.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: hari ng Israel
  rationale: Tuwiran at karaniwang salin ng titulo, at pare-parehong ginamit sa dalawang paglitaw nito.
- source_word: יְהוֹשָׁפָט
  choice: Jehosafat
  rationale: Ginamit ang nakaugaliang anyo ng pangalan sa mga saling Tagalog.
theological_decisions:
- issue: Sino ang magbabalatkayo sa tuwirang pahayag?
  choice: 'Ang hari ng Israel: “Magbabalatkayo ako”'
  alternative: 'Utos kay Jehosafat: “Magbalatkayo ka”'
  rationale: Maaaring magmukhang utos sa ikalawang panauhan ang walang panandang Hebreong anyo, ngunit ang kasunod na “ngunit ikaw, isuot mo ang iyong damit” at ang salaysay na nagbalatkayo ang hari ng Israel ay malakas na nagpapahiwatig ng unang-panauhang diwa. Hindi itinago ang tunay na kahirapang panggramatika; inilagay ang alternatibo sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “magbalatkayo” at “sumabak sa labanan” bilang likas ngunit hindi kolokyal na mga pahayag. Ang “damit-hari” ay nagpapalinaw sa kontekstong maharlika nang hindi pinahahaba ang talata.
