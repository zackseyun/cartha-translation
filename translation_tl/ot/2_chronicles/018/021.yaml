base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/021.yaml
  text: And he said[a], ‘I will go out and become a lying spirit in the mouth of all his prophets.’ And he said, ‘You will entice him, and you will also succeed[b]. Go out and do so.’
translation:
  language: tl
  text: At sinabi niya, “Lalabas ako at magiging espiritu ng kasinungalingan[a] sa bibig ng lahat ng kaniyang mga propeta.” At sinabi niya, “Hihikayatin mo siya[b], at magtatagumpay ka rin. Lumabas ka at gawin mo iyon.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “espiritung nagsisinungaling.”
    reason: lexical_alternative
  - marker: b
    text: O, “Lilinlangin mo siya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵצֵא
  choice: Lalabas ako
  rationale: Tuwirang ipinapahayag ng Qal na anyong unang panauhan ng יצא ang balak ng nagsasalita; pinananatili ng “lalabas” ang diwa ng pagkilos palabas.
- source_word: וְהָיִיתִי
  choice: at magiging
  rationale: Ipinahihiwatig dito ng היה ang pagpasok sa isang bagong papel; likas sa Tagalog ang “magiging” at hindi nito kailangang dagdagan ang teksto.
- source_word: לְרוּחַ שֶׁקֶר
  choice: espiritung nagsisinungaling
  rationale: Inilalarawan ng parirala ang isang espiritung may katangian o gawaing mapanlinlang. Malinaw ito sa karaniwang mambabasa, habang inilalahad sa talababa ang mas pormal na alternatibo.
- source_word: בְּפִי
  choice: sa bibig ng
  rationale: Pinananatili ang kongkretong larawan ng Hebreo, kung saan ang mapanlinlang na pahayag ay nasa bibig ng mga propeta.
- source_word: כָּל נְבִיאָיו
  choice: lahat ng kaniyang mga propeta
  rationale: Pinananatili ang kabuuang saklaw ng כָּל at ang panlalaking pang-isahang hulaping tumutukoy kay Ahab ayon sa konteksto.
- source_word: תְּפַתֶּה
  choice: Hihikayatin mo siya
  rationale: Maaaring mangahulugan ang Piel ng פתה na manghikayat o manlinlang. Pinananatili sa pangunahing teksto ang hindi lubusang tiyak na paraan, at inilalagay sa talababa ang mas tahasang mapanlinlang na kahulugan.
- source_word: וְגַם תּוּכָל
  choice: at magtatagumpay ka rin
  rationale: Sa kontekstong ito, ang יכל ay tumutukoy hindi lamang sa kakayahan kundi sa pagiging mabisa ng gagawing misyon; ang “rin” ay kumakatawan sa וְגַם.
- source_word: צֵא
  choice: Lumabas ka
  rationale: Pinananatili ng pautos ang pag-uulit sa naunang pandiwang יצא.
- source_word: וַעֲשֵׂה כֵן
  choice: at gawin mo iyon
  rationale: Likas na salin ito ng idyomang עשה כן, na nag-uutos na isagawa ang paraang kasasabi lamang.
theological_decisions:
- issue: Ang pahintulot o pag-aatas ng Diyos sa isang mapanlinlang na misyon sa loob ng pangitain
  choice: Tuwirang isinalin ang pagsang-ayon at utos na magpatuloy ang espiritu, nang hindi pinahihina ang pagkakasangkot ng nagsasalita sa pangitain.
  alternative: Palambutin ang pananalita upang magmukhang basta pinahintulutan lamang ang panlilinlang o walang kaugnayan dito ang Diyos.
  rationale: Tahasan sa Hebreo ang mungkahi ng espiritu, ang pahayag na magtatagumpay ito, at ang utos na lumabas at gawin iyon. Dapat panatilihin ng salin ang teolohikal na tensiyon sa halip na lutasin iyon sa pamamagitan ng pagpapaliwanag.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang larawang “sa bibig” mula sa Hebreo at ang magkasunod na “sinabi niya” upang hindi magdagdag ng mga pangalang wala sa talata. Ginamit ang “kaniyang” ayon sa pormal na ortograpiyang Filipino.
