  terminology: Ginamit ang "espiritu ng kasinungalingan" bilang pangunahing katumbas ng לְרוּחַ שֶׁקֶר. Pinananatili ang "sa bibig ng" bilang tahasang larawan ng Hebreo at ang "Hihikayatin mo siya" para sa פָּתָה, na may talababa para sa mas tahasang "Lilinlangin mo siya."
