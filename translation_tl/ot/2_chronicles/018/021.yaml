  source_fidelity: 'Tumpak ang daloy at karamihan ng mga katumbas: ang espiritu ay lalabas, gaganap bilang mapanlinlang na espiritu sa pamamagitan ng mga propeta ni Ahab, hihikayatin ang hari, magtatagumpay, at uutusan na gawin ito. Gayunman, ang pangunahing "espiritung nagsisinungaling" ay mas madaling mabasa bilang isang espiritung personal na nagsasalita ng kasinungalingan, samantalang ang רוּחַ שֶׁקֶר ay mas natural na inilalarawan bilang "espiritu ng kasinungalingan" o isang espiritung nailalarawan ng kabulaanan. Ang rebisyon ay pinananatili ang saklaw at tensiyong teolohikal ng Hebreo.'
