  text: וַ/יֹּ֨אמֶר֙ מֶ֣לֶךְ יִשְׂרָאֵ֔ל קְחוּ֙ אֶת מִיכָ֔יְהוּ וַ/הֲשִׁיבֻ֖/הוּ אֶל אָמ֣וֹן שַׂר הָ/עִ֑יר וְ/אֶל יוֹאָ֖שׁ בֶּן הַ/מֶּֽלֶךְ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/025.yaml
  text: Then the king of Israel said[a], “Take Micaiah and return him to Amon, the governor of the city[b], and to Joash the king’s son.”
translation:
  language: tl
  text: Pagkatapos ay sinabi ng hari ng Israel, “Kunin ninyo si Micaias at ibalik siya kay Amon, na pinuno ng lungsod[a], at kay Joas na anak ng hari.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “tagapamahala ng lungsod” o “kumandante ng lungsod.” Ang titulong Hebreo ay maaaring tumukoy sa isang pinunong sibiko o militar.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Pagkatapos ay sinabi
  rationale: Ipinahihiwatig ng waw-consecutive ang pagsulong ng salaysay; natural sa makabagong Tagalog ang “Pagkatapos ay sinabi” habang pinananatili ang pagkakasunod-sunod.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: ang hari ng Israel
  rationale: Tuwirang salin ng parirala. Hindi ginamit ang pangalang Ahab sapagkat titulo ang nasa Hebreo.
- source_word: קְחוּ
  choice: Kunin ninyo
  rationale: Ang pautos na maramihan ng לקח ay karaniwang nangangahulugang “kunin.” Ipinakikita ng “ninyo” na higit sa isang tao ang inuutusan.
- source_word: מִיכָיְהוּ
  choice: Micaias
  rationale: Ginamit ang nakaugaliang anyong Filipino ng pangalan sa Bibliya.
- source_word: וַהֲשִׁיבֻהוּ
  choice: ibalik siya
  rationale: Ang Hiphil ng שוב ay nangangahulugang pangyarihing makabalik ang isang tao; malinaw at likas sa Tagalog ang “ibalik siya.”
- source_word: אָמ֣וֹן
  choice: Amon
  rationale: Karaniwang transliterasyon ng pangalan sa Filipino.
- source_word: שַׂר הָעִיר
  choice: pinuno ng lungsod
  rationale: Malawak ang saklaw ng שַׂר at maaari itong tumukoy sa isang pinunong sibiko o militar. Hindi labis na nililimitahan ng “pinuno” ang tungkulin.
- source_word: וְאֶל יוֹאָשׁ
  choice: at kay Joas
  rationale: Pinanatili ang inuulit na pang-ukol upang malinaw na ikalawang taong pagdadalhan kay Micaias si Joas.
- source_word: בֶּן הַמֶּלֶךְ
  choice: anak ng hari
  rationale: Tuwirang pinananatili ang ugnayang ipinahayag ng Hebreo sa halip na ipakahulugang “prinsipe.”
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “lungsod” at “pinuno” bilang madaling maunawaang mga salita, habang ang talababa ay nagpapanatili sa lawak at di-tiyak na katangian ng titulong Hebreo.
