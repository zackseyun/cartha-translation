base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/006.yaml
  text: But Jehoshaphat said[a], “Is there not still here a prophet of Yahweh[b], that we may inquire of him?”
translation:
  language: tl
  text: Ngunit sinabi ni Jehosafat, “Hindi ba mayroon pang propeta ni Yahweh rito na maaari nating sangguniin?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Ngunit sinabi
  rationale: Isinusulong ng waw-consecutive ang salaysay, ngunit malinaw na pasalungat ang tugon ni Jehosafat sa nagkakaisang pahayag ng mga naunang propeta; natural itong ipinahahayag ng “Ngunit.”
- source_word: יְהוֹשָׁפָט
  choice: Jehosafat
  rationale: Ginamit ang nakaugaliang anyo ng pangalan sa modernong saling Filipino.
- source_word: הַאֵין ... עוֹד
  choice: Wala na bang ibang
  rationale: Sa konteksto, nagtatanong si Jehosafat kung may isa pang propeta bukod sa mga nakonsulta na. Ang “wala na bang ibang” ay natural sa Filipino at pinagsasama ang retorikal na tanong at diwa ng עוֹד.
- source_word: פֹּה
  choice: rito
  rationale: Karaniwang panumbas sa payak na pang-abay na panlunan na “dito/rito”; ang “rito” ay angkop pagkatapos ng katinig.
- source_word: נָבִיא לַיהוָה
  choice: propeta ni Yahweh
  rationale: Ipinahahayag ng lamed ang kaugnayan o pag-aari—isang propetang kumakatawan kay Yahweh. Likas at maikli sa Filipino ang “propeta ni Yahweh.”
- source_word: וְנִדְרְשָׁה מֵאֹתוֹ
  choice: na maaari nating sangguniin
  rationale: Ang דרשׁ sa kontekstong ito ay paghingi ng sagot mula sa Diyos sa pamamagitan ng propeta. Ang cohortative na unang panauhang maramihan ay natural na naipahahayag bilang mungkahing “maaari nating,” habang ang “sangguniin” ay malinaw sa ordinaryong Filipino.
theological_decisions:
- issue: Pagpapahayag sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang ginagamit ng tekstong Hebreo ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal at tipanang pangalan nang hindi ito pinapalitan ng isang titulo.
- issue: Ugnayan ng propeta kay Yahweh sa לַיהוָה
  choice: propeta ni Yahweh
  alternative: propetang para kay Yahweh; propeta ng PANGINOON
  rationale: Pinananatili ng “ni Yahweh” ang malawak na ugnayang maaaring tumukoy sa pag-aari, katapatan, o pagkatawan, sa halip na paliitin ito sa iisang tungkulin.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ang “Wala na bang ibang…” ay mas likas kaysa sa literal na “Hindi ba mayroon pang…,” at tumpak na ipinahahayag ang paghahanap ng karagdagang propetikong tinig. Walang footnote dahil walang kailangang alternatibong pagbasa upang mapanatili ang tunay na kalabuan ng talata.
