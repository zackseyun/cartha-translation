base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/003.yaml
  text: And Ahab king of Israel said to Jehoshaphat king of Judah[a], “Will you go with me to Ramoth-gilead?” And he said to him, “I am as you are, and my people as your people[b], and I am with you in the battle.”
translation:
  language: tl
  text: Sinabi ni Ahab na hari ng Israel kay Jehosafat na hari ng Juda, “Sasama ka ba sa akin sa Ramot-Gilead?” Sinabi niya kay Ahab, “Ako ay gaya mo, at ang bayan ko ay gaya ng bayan mo[a]; kasama mo ako sa digmaan[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas idyomatiko ring maaaring isalin na “ang bayan mo ay bayan ko.” Gayunman, paghahambing ang literal na anyo ng Hebreo: “at gaya ng bayan mo, ang bayan ko.”'
    reason: lexical_alternative
  - marker: b
    text: Eliptiko ang huling sugnay sa Hebreo; literal itong “at kasama mo sa digmaan,” na walang tahasang simuno o pandiwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתֵלֵךְ עִמִּי
  choice: Sasama ka ba sa akin
  rationale: Likas na ipinahahayag sa Filipino ng “sasama” ang pagpunta kasama ng nagsasalita; pinananatili ng tanong at anyong panghinaharap ang paanyaya ni Ahab.
- source_word: רָמֹת גִּלְעָד
  choice: Ramot-Gilead
  rationale: Isinalin sa baybay na angkop sa Filipino ang pangalang pantangi at pinanatili ang gitling upang makilalang iisang pangalan ng lugar.
- source_word: כָּמוֹנִי כָמוֹךָ
  choice: Ako ay gaya mo
  rationale: Pinananatili nito ang paghahambing at pagpapahayag ng pakikiisa nang hindi ito pinatitindi tungo sa ganap na pagkakakilanlan.
- source_word: וּכְעַמְּךָ עַמִּי
  choice: at ang bayan ko ay gaya ng bayan mo
  rationale: Nililinaw sa natural na Filipino ang sugnay na walang tahasang pandiwa habang pinananatili ang paghahambing at ayos ng diwa sa Hebreo.
- source_word: וְעִמְּךָ בַּמִּלְחָמָה
  choice: kasama mo ako sa digmaan
  rationale: Ang Hebreo ay eliptiko at walang tahasang simuno o pandiwa. Ang pagdaragdag ng “ako” sa Filipino ay nagpapalinaw sa ipinangakong pakikiisa nang hindi kinakailangang magdagdag ng tahasang panghinaharap.
- source_word: וַיֹּאמֶר ... וַיֹּאמֶר
  choice: Sinabi ... Sinabi
  rationale: Pinananatili ang karaniwang pandiwa ng pagsasalita sa dalawang sugnay, gaya ng salaysay sa Hebreo.
