base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/014.yaml
  text: So he came to the king[a], and the king said to him, “Micaiah, should we go to Ramoth-gilead for battle, or should I refrain?” And he said, “Go up and prosper, and they will be given into your hand.”
translation:
  language: tl
  text: Nang dumating siya sa hari, sinabi ng hari sa kanya, “Micaías, pupunta ba tayo sa Ramot-Gilead upang makipaglaban, o magpipigil ako?” Sumagot siya, “Umakyat kayo at magtagumpay; ibibigay sila sa inyong kamay.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Malamang na ironiko o mapanuyang sinabi ni Micaías ang sagot na ito, ayon sa konteksto; ngunit hindi tahasang ipinahihiwatig ng tekstong Hebreo ang ironiya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא אֶל־הַמֶּלֶךְ
  choice: Nang dumating siya sa hari
  rationale: Inihahayag ang kasunod na pangyayari sa salaysay sa natural na Tagalog habang pinananatili ang payak na diwa ng pagdating niya sa hari.
- source_word: מִיכָה
  choice: Micaías
  rationale: Ginamit ang nakaugaliang anyong Filipino ng pangalan ng propeta sa salaysay na ito, na naiiba sa pangalang Mikas ng ibang propeta.
- source_word: הֲנֵלֵךְ
  choice: pupunta ba tayo
  rationale: Pinananatili ang deliberatibong tanong at ang unang panauhang maramihan ng Hebreo.
- source_word: רָמֹת גִּלְעָד
  choice: Ramot-Gilead
  rationale: Makikilalang transliterasyong Filipino ng pangalan ng lugar.
- source_word: לַמִּלְחָמָה
  choice: upang makipaglaban
  rationale: Natural na ipinahahayag sa Tagalog ang layunin ng pagpunta roon at ang kontekstong militar.
- source_word: אִם־אֶחְדָּל
  choice: o hindi na ako tutuloy
  rationale: Inilalarawan ang pagtigil o pagpipigil sa balak sa natural na Tagalog, at pinananatili ang kapansin-pansing paglipat mula sa maramihang “tayo” tungo sa isahang “ako.”
- source_word: עֲלוּ
  choice: Umahon kayo
  rationale: Pinananatili ang literal na larawang pag-ahon o pagpunta paitaas, na karaniwang gamit para sa paglusob o pagpunta sa isang lugar.
- source_word: וְהַצְלִיחוּ
  choice: at magtagumpay
  rationale: Ang pandiwa ay tumutukoy sa pagtatagumpay o pagiging matagumpay sa kampanya; malinaw at likas ang “magtagumpay” sa makabagong Tagalog.
- source_word: וְיִנָּתְנוּ בְּיֶדְכֶם
  choice: ibibigay sila sa inyong kamay
  rationale: Pinananatili ang balintiyak na anyo, ang di-tiyak na maramihang tinutukoy ng “sila,” at ang Hebreong idyoma ng pagkakaloob sa kapangyarihan ng isang tao.
theological_decisions:
- issue: Kung tahasang mamarkahan sa pangunahing teksto na mapanlibak o ironiko ang sagot ni Micaías
  choice: Panatilihin ang positibong anyo ng sagot nang walang idinagdag na salitang nagsasaad ng panunuya
  alternative: Idagdag ang “pabalang,” “may panunuya,” o ibang tahasang pananda ng ironiya
  rationale: Ipinahihiwatig ng mas malawak na konteksto na hindi tuwiran o taimtim ang unang sagot ni Micaías, ngunit walang tahasang pananda ng ironiya sa mga salitang Hebreo mismo. Pinananatili ng salin ang tensiyon at iniiwan sa konteksto ang pagpapakita nito.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang paglipat mula “tayo” tungo sa “ako,” ang utos na “Umahon kayo,” at ang bahagyang malabong tinutukoy ng “sila” sa hulíng sugnay.
