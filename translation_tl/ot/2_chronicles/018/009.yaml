  source_fidelity: Tumpak na naipapahayag ng draft ang dalawang hari, ang kani-kanilang trono, damit, giikan, tarangkahan ng Samaria, at gawaing propetiko. Gayunman, ang וְכָל (“at ang lahat”) ay mas mabuting isalin bilang tuwirang “at,” sa halip na “habang,” upang hindi gawing pansamantalang pantulong na pangyayari ang malayang iniuugnay na sugnay sa Hebreo.
  naturalness: Natural at malinaw ang modernong Tagalog. Ang paghahati sa dalawang pangungusap ay katanggap-tanggap at pinananatili ang inuulit na “nakaupo.” Ang kuwit sa appositional na titulong “hari ng Juda” ay nagpapalinaw ng daloy.
  terminology: Ang “Jehosafat,” “Juda,” “Samaria,” “trono,” “giikan,” “pintuang-bayan,” at “nagpopropesiya” ay angkop sa marangal ngunit madaling maunawaang rehistro. Ang “pintuang-bayan” ay wastong naglilinaw na tarangkahan ng lungsod ang tinutukoy.
