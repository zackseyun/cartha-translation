base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/009.yaml
  text: The king of Israel and Jehoshaphat king of Judah were sitting[a], each on his throne, clothed in garments, and sitting at the threshing floor at the entrance of the gate of Samaria[b], and all the prophets were prophesying before them.
translation:
  language: tl
  text: Ang hari ng Israel at si Jehosafat, hari ng Juda, ay nakaupo, bawat isa sa kanyang trono, at nakasuot ng mga kasuotan. Nakaupo sila sa giikan sa bungad ng pintuang-bayan ng Samaria, at ang lahat ng propeta ay nagpopropesiya sa harap nila.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמֶלֶךְ יִשְׂרָאֵל
  choice: Ang hari ng Israel
  rationale: Hindi isinalin nang tahasan ang panimulang ו bilang “At” sapagkat maaari itong magsilbing karaniwang pang-ugnay sa salaysay; natural sa modernong Tagalog ang pagsisimula sa “Ang” nang hindi nagdaragdag ng di-hayag na panandang pamanahon.
- source_word: וִיהוֹשָׁפָט מֶלֶךְ יְהוּדָה
  choice: at si Jehosafat na hari ng Juda
  rationale: Ginamit ang “si” para sa personal na pangalan at “na hari ng Juda” bilang natural na appositional na titulo sa Tagalog.
- source_word: יוֹשְׁבִים ... וְיֹשְׁבִים
  choice: ay nakaupo ... Nakaupo sila
  rationale: Pinanatili ang pag-uulit ng pandiwang Hebreo upang maipakita muna ang pagkakaupo ng bawat hari sa trono at pagkatapos ay ang kinaroroonan nilang dalawa.
- source_word: אִישׁ עַל־כִּסְאוֹ
  choice: bawat isa sa kanyang trono
  rationale: Distributibo ang אִישׁ dito, at sa kontekstong maharlika ay “trono” ang angkop na kahulugan ng כִּסֵּא.
- source_word: מְלֻבָּשִׁים בְּגָדִים
  choice: nakasuot ng mga kasuotan
  rationale: Malapit ito sa literal na “clothed in garments” at hindi idinaragdag ang ideya ng “maharlikang mga balabal,” na hindi tahasang nasa Hebreo.
- source_word: בְּגֹרֶן
  choice: sa giikan
  rationale: Ang גֹּרֶן ay lugar na pinaggigiikan; “giikan” ang maikli at likas na katumbas sa Tagalog.
- source_word: פֶּתַח שַׁעַר שֹׁמְרוֹן
  choice: sa bungad ng pintuang-bayan ng Samaria
  rationale: Ang “bungad” ay natural na katumbas ng פֶּתַח, at ipinakikita ng “pintuang-bayan” na ang שַׁעַר ay tarangkahan ng lungsod, hindi karaniwang pinto lamang.
- source_word: מִתְנַבְּאִים לִפְנֵיהֶם
  choice: nagpopropesiya sa harap nila
  rationale: Tumutukoy ang anyong Hitpael sa aktuwal na gawaing propetiko; pinananatili ng “sa harap nila” ang spatial at representasyonal na diwa ng לִפְנֵיהֶם.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang kapansin-pansing pag-uulit ng “nakaupo” dahil naroon din ito sa Hebreo, ngunit hinati sa dalawang pangungusap upang maging malinaw. Hindi ginamit ang “nanghuhula” sapagkat maaari itong magpahiwatig lamang ng panghuhula sa hinaharap at paliitin ang kahulugan ng gawaing propetiko.
