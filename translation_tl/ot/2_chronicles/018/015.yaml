base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/015.yaml
  text: Then the king said to him, “How many times must I make you swear that you tell me nothing but the truth in the name of Yahweh?”
translation:
  language: tl
  text: Pagkatapos ay sinabi sa kanya ng hari, “Ilang ulit ba kitang kailangang pasumpain na wala kang sasabihin sa akin kundi ang katotohanan sa pangalan ni Yahweh?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Pagkatapos ay sinabi
  rationale: Isinusulong ng waw-consecutive ang salaysay; natural sa modernong Filipino ang “Pagkatapos ay” upang ipakita ang kasunod na pangyayari.
- source_word: הַמֶּלֶךְ
  choice: ang hari
  rationale: Tuwirang salin ng tiyak na pangngalan; hindi kailangang idagdag ang pangalan ng hari.
- source_word: עַד כַּמֶּה פְעָמִים
  choice: Ilang ulit ba
  rationale: Likas na ekspresyon sa Filipino para sa retorikal na tanong na nagpapahiwatig ng pagkainis dahil sa pag-uulit.
- source_word: מַשְׁבִּיעֶךָ
  choice: kitang dapat pasumpain
  rationale: Ang Hiphil ng שבע ay nangangahulugang pagpanumpain o paglagay sa isang tao sa ilalim ng panunumpa; malinaw at kasalukuyan ang “pasumpain.”
- source_word: אֲשֶׁר לֹא תְדַבֵּר אֵלַי רַק אֱמֶת
  choice: na wala kang sasabihin sa akin kundi ang katotohanan
  rationale: Pinananatili ang negatibong anyo at ang eksklusibong puwersa ng רַק, habang natural pa rin sa Filipino ang kabuuang pahayag.
- source_word: בְּשֵׁם יְהוָה
  choice: sa pangalan ni Yahweh
  rationale: Ipinahahayag ng בְּשֵׁם ang awtoridad o banal na batayan ng pagsasalita, at ang tetragrammaton ay tinutumbasan ng “Yahweh.”
theological_decisions:
- issue: Pagbibigay-katinig sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang ginagamit ng Hebreo ang personal na banal na pangalan. Pinananatili ng “Yahweh” ang pagkakaiba nito sa titulong “Panginoon” nang hindi nagdaragdag ng interpretasyong denominasyonal.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “pasumpain” upang malinaw na maipakita ang sapilitang panunumpa, at “wala kang sasabihin sa akin kundi” upang mapanatili ang anyong negatibo at eksklusibong diin ng Hebreo.
