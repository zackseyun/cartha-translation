base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/023.yaml
  text: Then Zedekiah son of Chenaanah came near and struck Micaiah on the cheek[a], and said, “Which way did the Spirit of Yahweh pass from me to speak to you?”
translation:
  language: tl
  text: Pagkatapos, lumapit si Zedekias na anak ni Kenaanah at hinampas si Micaias sa pisngi.[a] Sinabi niya, “Sa anong daan dumaan ang Espiritu ni Yahweh mula sa akin upang magsalita sa iyo?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “sa panga.”
    reason: Maaaring tumukoy ang Hebreong לֶחִי sa pisngi o sa bahagi ng panga.
lexical_decisions:
- source_word: וַיִּגַּשׁ
  choice: lumapit
  rationale: Likas at tuwirang katumbas ito ng pagkilos na paglapit, at angkop sa biglang komprontasyon.
- source_word: צִדְקִיָּהוּ בֶן כְּנַעֲנָה
  choice: Zedekias na anak ni Quenaan
  rationale: Isinalin ang ugnayang pampamilya sa karaniwang modernong Tagalog at tinumbasan ang mga pangalang Hebreo sa malinaw na anyong Filipino.
- source_word: וַיַּךְ אֶת מִיכָיְהוּ עַל הַלֶּחִי
  choice: hinampas si Micaias sa pisngi
  rationale: Malawak ang kahulugan ng נכה bilang paghampas o pananakit. Pinananatili ng “hinampas” ang pisikal na kilos nang hindi tiyakang ipinapalagay na bukas-palad ang sampal. Ang לֶחִי ay maaaring tumukoy sa pisngi o panga.
- source_word: אֵי זֶה הַדֶּרֶךְ
  choice: Saang daan
  rationale: Pinananatili nito ang literal at mapanuyang larawan ng isang rutang dinaanan, sa halip na gawing payak na “paano.”
- source_word: עָבַר
  choice: dumaan
  rationale: Tapat ito sa larawan ng pagdaan o paglipat mula sa isang tao patungo sa iba.
- source_word: רוּחַ יְהוָה
  choice: ang Espiritu ni Yahweh
  rationale: Sa konteksto ng propesiya, tumutukoy ang רוּחַ sa banal na Espiritu; ang pangalang tipan na יהוה ay isinaling “Yahweh.”
- source_word: מֵאִתִּי
  choice: mula sa akin
  rationale: Malinaw nitong ipinapahayag ang pinagmulan at pinananatili ang panunuya ni Zedekias na para bang dating nagsasalita ang Espiritu sa pamamagitan niya.
- source_word: לְדַבֵּר אֹתָךְ
  choice: upang magsalita sa iyo
  rationale: Natural itong Tagalog para sa diwang pakay ng parirala at hindi ipinipilit ang di-karaniwang konstruksiyon ng Hebreo.
theological_decisions:
- issue: Paglalarawan sa רוּחַ יהוה
  choice: ang Espiritu ni Yahweh
  alternative: ang espiritu ni Yahweh
  rationale: Ipinahihiwatig ng kontekstong propetiko na ang tinutukoy ay ang banal na Espiritu, hindi hangin o saloobin; hindi naman pinatutunayan ng pangungutya ni Zedekias na tunay na nasa kaniya ang Espiritu.
- issue: Pagsasalin sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Ginagamit ng tekstong Hebreo ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalang nasa pinagmulan.
translation_notes:
  register: Gumamit ng natural ngunit marangal na modernong Tagalog. Pinanatili ang bahagyang di-pangkaraniwang larawang “Saang daan dumaan” dahil mahalaga ito sa mapanuyang hamon ni Zedekias at sa larawan ng Espiritung lumilipat mula sa isang tagapagsalita patungo sa iba.
