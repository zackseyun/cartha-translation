  to: Pagkatapos, lumapit si Zedekias na anak ni Kenaanah at hinampas si Micaias sa pisngi.[a] Sinabi niya, “Sa anong daan dumaan ang Espiritu ni Yahweh mula sa akin upang magsalita sa iyo?”
  rationale: Inayos ang transliterasyon ng pangalan ni Chenaanah/Kena'anah upang higit na tumugma sa Hebreo, at pinakinis ang ayos ng retorikal na tanong. Pinanatili ang neutral na "hinampas," ang malaking-titik na "Espiritu," ang pangalang Yahweh, at ang talababa sa לֶחִי.
