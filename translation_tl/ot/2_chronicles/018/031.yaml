  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יְהִ֡י כִּ/רְאוֹת֩ שָׂרֵ֨י הָ/רֶ֜כֶב אֶת יְהוֹשָׁפָ֗ט וְ/הֵ֤מָּה אָֽמְרוּ֙ מֶ֣לֶךְ יִשְׂרָאֵ֣ל ה֔וּא וַ/יָּסֹ֥בּוּ עָלָ֖י/ו לְ/הִלָּחֵ֑ם וַ/יִּזְעַ֤ק יְהֽוֹשָׁפָט֙ וַֽ/יהוָ֣ה עֲזָר֔/וֹ וַ/יְסִיתֵ֥/ם אֱלֹהִ֖ים מִמֶּֽ/נּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/031.yaml
  text: And it happened that when the commanders of the chariots saw Jehoshaphat[a], they said, “It is the king of Israel.” So they turned against him to fight, but Jehoshaphat cried out, and Yahweh helped him[b], and God drew them away from him.
translation:
  language: tl
  text: Nang makita ng mga pinuno ng mga karwahe si Jehoshafat, sinabi nila, “Siya ang hari ng Israel.” Kaya bumaling sila sa kanya upang makipaglaban. Ngunit sumigaw si Jehoshafat, at tinulungan siya ni Yahweh. Inilayo sila ng Diyos sa kanya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “pinalihis sila ng Diyos palayo sa kanya.”
    reason: Pinahihintulutan ng pandiwang Hebreo ang diwang ilihis o pagalawin ang isang tao palayo sa isang puntirya.
lexical_decisions:
- source_word: שָׂרֵי הָרֶכֶב
  choice: mga pinuno ng mga karwahe
  rationale: Tumutukoy ang שָׂרֵי sa mga pinunong militar, at tinutukoy ng הָרֶכֶב ang hukbong gumagamit ng mga karwahe. Malinaw at likas sa modernong Tagalog ang pariralang ito.
- source_word: מֶלֶךְ יִשְׂרָאֵל הוּא
  choice: Siya ang hari ng Israel
  rationale: Tuwirang ipinakikilala ng nominal na sugnay si Jehoshafat bilang taong inakala nilang hari ng Israel. Likas sa Tagalog ang “Siya ang…” at hindi kailangang tumbasan ang idiomatikong Ingles na “It is…”
- source_word: וַיָּסֹבּוּ עָלָיו
  choice: bumaling sila sa kanya
  rationale: Maaaring mangahulugan ang סבב ng pagliko o pagpalibot. Sa konteksto, ginawa nilang puntirya si Jehoshafat; pinananatili ng “bumaling” ang kilos nang hindi tiyakang sinasabing lubusan nila siyang pinalibutan.
- source_word: לְהִלָּחֵם
  choice: upang makipaglaban
  rationale: Ipinapahayag ng infinitibo ang layunin ng kanilang paglapit. Tuwiran at natural ang “upang makipaglaban.”
- source_word: וַיִּזְעַק
  choice: sumigaw
  rationale: Ang זעק ay matinding pagsigaw, madalas dahil sa kagipitan. Hindi idinagdag ang hindi tahasang binanggit na pinagsigawan o layunin ng sigaw.
- source_word: וַיהוָה עֲזָרוֹ
  choice: tinulungan siya ni Yahweh
  rationale: Tuwirang nangangahulugang “tumulong” ang עזר. Ginamit ang personal na pangalang “Yahweh” para sa יהוה.
- source_word: וַיְסִיתֵם אֱלֹהִים מִמֶּנּוּ
  choice: Inilayo sila ng Diyos sa kanya
  rationale: Sa kontekstong ito, ipinahihiwatig ng hiphil ng סות ang pagpapalihis o pagpapalayo sa isang puntirya. Malinaw na pinananatili ng “inilayo” ang pagkilos ng Diyos nang hindi nagdaragdag ng moral na diwa ng panunukso o pang-uudyok.
- source_word: וַיְהִי כִּרְאוֹת
  choice: Nang makita
  rationale: Karaniwang pormula ito ng salaysay sa Hebreo. Ang payak na “Nang makita” ay likas sa Tagalog at naihahatid ang pagkakasunod ng pangyayari nang hindi nagiging mabigat o paulit-ulit.
theological_decisions:
- issue: Magkaibang banal na katawagang יהוה at אֱלֹהִים sa iisang talata
  choice: Yahweh … Diyos
  alternative: PANGINOON … Diyos
  rationale: Pinananatili ng “Yahweh” ang personal na pangalan sa יהוה, samantalang natural na isinasalin ang אֱלֹהִים bilang “Diyos.” Hindi pinag-iisa ang dalawang magkaibang katawagang nasa Hebreo.
- issue: Kung tahasang gagawing panalangin ang sigaw ni Jehoshafat
  choice: sumigaw si Jehoshafat
  alternative: humingi ng tulong si Jehoshafat kay Yahweh
  rationale: Hindi tinutukoy ng sugnay sa Hebreo kung kanino siya sumigaw. Ipinakikita ng kasunod na sugnay ang tulong ni Yahweh, ngunit hindi idinaragdag sa sigaw ang isang tahasang layon na wala sa tekstong ito.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa pampublikong pagbasa. Iniwasan ang mga lipas o labis na teknikal na salitang militar at pinanatili ang maikli at mabilis na daloy ng salaysay.
