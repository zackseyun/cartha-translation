  text: וַ/יִּקְבֹּ֨ץ מֶֽלֶךְ יִשְׂרָאֵ֥ל אֶֽת הַ/נְּבִאִים֮ אַרְבַּ֣ע מֵא֣וֹת אִישׁ֒ וַ/יֹּ֣אמֶר אֲלֵ/הֶ֗ם הֲ/נֵלֵ֞ךְ אֶל רָמֹ֥ת גִּלְעָ֛ד לַ/מִּלְחָמָ֖ה אִם אֶחְדָּ֑ל וַ/יֹּאמְר֣וּ עֲלֵ֔ה וְ/יִתֵּ֥ן הָ/אֱלֹהִ֖ים בְּ/יַ֥ד הַ/מֶּֽלֶךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/005.yaml
  text: So the king of Israel gathered the prophets[a], four hundred men, and said to them, “Should we go to Ramoth-gilead for battle, or should I refrain?” And they said, “Go up[b], and God will give it into the hand of the king.”
translation:
  language: tl
  text: Tinipon ng hari ng Israel ang mga propeta—apatnaraang lalaki—at sinabi sa kanila, “Pupunta ba tayo sa Ramot-gilead upang makipagdigma, o hindi ako tutuloy?” Sumagot sila, “Sumulong ka, at ibibigay iyon ng Diyos sa kamay ng hari.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “sa kamay ng hari” ay idyomang nangangahulugang “sa kapangyarihan o pamamahala ng hari.” Hindi tinutukoy ng Hebreo kung sinong hari ang tinutukoy.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְבֹּץ
  choice: tinipon
  rationale: Karaniwang kahulugan ng קבץ ang tipunin o pagtulungin sa isang lugar. Natural sa makabagong Filipino ang “tinipon.”
- source_word: הַנְּבִאִים
  choice: mga propeta
  rationale: Ito ang karaniwan at tuwirang salin ng נביאים, nang walang dagdag na pagpapakahulugan sa kanilang katayuan.
- source_word: אַרְבַּע מֵאוֹת אִישׁ
  choice: apatnaraang lalaki
  rationale: Hayagang kasama sa Hebreo ang אִישׁ (“lalaki”) matapos ang bilang, kaya pinanatili ito.
- source_word: הֲנֵלֵךְ ... אִם אֶחְדָּל
  choice: Pupunta ba tayo ... o hindi ako tutuloy?
  rationale: Pinananatili ang kapansin-pansing paglipat mula sa unang panauhang maramihan (“tayo”) tungo sa unang panauhang isahan (“ako”). Ang “hindi ako tutuloy” ay natural na Filipino para sa pagpipigil o hindi pagpapatuloy sa balak.
- source_word: רָמֹת גִּלְעָד
  choice: Ramot-gilead
  rationale: Pangalan ito ng lugar kaya tinumbasan sa transliterasyong angkop sa Filipino.
- source_word: לַמִּלְחָמָה
  choice: upang makipagdigma
  rationale: Ipinahahayag ng parirala ang layunin ng pagpunta. Malinaw at natural ang “upang makipagdigma.”
- source_word: עֲלֵה
  choice: Umahon ka
  rationale: Ang עלה ay literal na “umahon” o “pumaitaas” at maaari ring tumukoy sa pagsulong sa kontekstong militar. Pinananatili ng salin ang larawan sa Hebreo.
- source_word: וְיִתֵּן
  choice: at ibibigay iyon
  rationale: Walang hayag na layon sa Hebreo. Ang “iyon” ay likas na kailangang idagdag sa Filipino at hindi tiyak kung tumutukoy sa lunsod o sa kalalabasan ng labanan.
- source_word: הָאֱלֹהִים
  choice: Diyos
  rationale: Bagaman anyong maramihan ang pangngalan, isahan ang pandiwang יִתֵּן, kaya iisang Diyos ang tinutukoy rito.
- source_word: בְּיַד הַמֶּלֶךְ
  choice: sa kamay ng hari
  rationale: Pinananatili ang karaniwang idyomang Hebreo tungkol sa pagpapasailalim sa kapangyarihan ng isang tao, habang nananatiling mauunawaan sa Filipino.
theological_decisions:
- issue: Kung sinong hari ang tinutukoy sa sagot ng mga propeta
  choice: Pinanatili ang payak na “hari” nang hindi tinutukoy kung sino siya.
  alternative: Gawing “sa iyong kamay” o “sa kamay ng hari ng Israel.”
  rationale: Ang tekstong Hebreo ay nagsasabing הַמֶּלֶךְ, “ang hari,” hindi “iyong kamay.” Hindi dapat linawin ng salin ang referent nang higit sa paglilinaw ng pinagmulan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang pagbabago mula “tayo” tungong “ako,” ang literal na larawan ng “umahon,” at ang hindi tiyak na tinutukoy ng “hari.”
