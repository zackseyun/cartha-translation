revisions:
- from: Kaya tinipon ng hari ng Israel ang mga propeta—apatnaraang lalaki—at sinabi sa kanila, “Pupunta ba tayo sa Ramot-gilead upang makipagdigma, o hindi ako tutuloy?” Sumagot sila, “Umahon ka, at ibibigay iyon ng Diyos sa kamay ng hari.”[a]
  to: Tinipon ng hari ng Israel ang mga propeta—apatnaraang lalaki—at sinabi sa kanila, “Pupunta ba tayo sa Ramot-gilead upang makipagdigma, o hindi ako tutuloy?” Sumagot sila, “Sumulong ka, at ibibigay iyon ng Diyos sa kamay ng hari.”[a]
  rationale: Pinalitan ang hindi likas na “Umahon ka” ng “Sumulong ka” upang maipahayag nang natural ang panawagan na עֲלֵה sa kontekstong militar, nang hindi ginagawang mas tiyak na “lusubin.” Inalis ang “Kaya” para sa mas tuwirang pagsasalaysay. Pinanatili ang lahat ng mahalagang ambiguity, lalo na ang paglipat ng panauhan at ang di-tiyak na “hari.”
