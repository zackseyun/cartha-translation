  naturalness: Natural ang kabuuang pangungusap, ngunit hindi idiomatiko sa modernong Filipino ang “Umahon ka” sa ganitong utos. Ang “Sumulong ka” ay malinaw at marangal na Filipino sa kontekstong militar.
  terminology: Ang “mga propeta,” “Diyos,” “Ramot-gilead,” at ang hindi nilinaw na “hari” ay angkop. Pinananatili ng tala ang literal na “sa kamay ng hari” at ang hindi tiyak na referent.
