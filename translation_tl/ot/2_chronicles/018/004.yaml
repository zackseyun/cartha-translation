base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/004.yaml
  text: And Jehoshaphat said to the king of Israel[a], “Please inquire today for the word of Yahweh.”
translation:
  language: tl
  text: Sinabi ni Jehoshafat sa hari ng Israel, “Pakisangguni mo ngayon ang salita ni Yahweh.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Humingi ka ngayon ng isang pahayag mula kay Yahweh.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Sinabi
  rationale: Likas na panimulang salaysay sa modernong Tagalog; hindi kailangang laging katawanin ang waw sa hiwalay na “at.”
- source_word: יְהוֹשָׁפָט
  choice: Jehoshafat
  rationale: Transliterasyon ng pangalang pantangi, na pinananatiling nakikilala ang anyong Hebreo.
- source_word: אֶל מֶלֶךְ יִשְׂרָאֵל
  choice: sa hari ng Israel
  rationale: Tuwiran at natural na katumbas ng pariralang Hebreo at pinananatili ang maharlikang titulo.
- source_word: דְּרָשׁ נָא
  choice: Pakisangguni mo muna
  rationale: Sa kontekstong propetiko, ang דרש ay paghahanap ng pahayag mula sa Diyos. Ipinahahayag ng “paki-” ang magalang na bisa ng נָא, samantalang ang “muna” ay nagbibigay ng natural na himig ng agarang kahilingan nang hindi ginagawa itong simpleng pagtatanong lamang.
- source_word: כַיּוֹם
  choice: ngayon
  rationale: Gumaganap itong pang-abay na humihiling ng agarang pagsangguni; “ngayon” ang malinaw at natural na salin.
- source_word: אֶת דְּבַר יְהוָה
  choice: ang salita ni Yahweh
  rationale: Pinananatili ang tiyak na propetikong pormulang “ang salita ni Yahweh.” Posible rin ayon sa gamit ng דרש ang diwang “isang pahayag mula kay Yahweh,” kaya inilagay iyon sa talababa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang transliterasyon ng banal na pangalang YHWH sa halip na palitan ito ng isang titulo.
theological_decisions:
- issue: Paglalarawan sa hinihinging banal na pahayag
  choice: ang salita ni Yahweh
  alternative: isang pahayag mula kay Yahweh
  rationale: Ang Hebreo ay may tiyak na דְּבַר יְהוָה, kaya pinanatili sa pangunahing teksto ang pormulang “ang salita ni Yahweh”; gayunman, maaaring idiomatikong tumukoy ang buong parirala sa paghingi ng isang pahayag mula sa kanya.
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehovah
  rationale: Pangalan mismo ang nasa tekstong Hebreo; pinananatili ng “Yahweh” ang katangian nito bilang personal na banal na pangalan nang hindi ito pinapalitan ng titulo.
translation_notes:
  register: Modernong Filipino Tagalog na magalang at marangal. Ginamit ang “pakisangguni” upang katawanin ang propetikong pagkonsulta, hindi lamang pangkaraniwang pagtatanong. Ang marker na [a] ay inilagay mismo sa pangunahing teksto.
