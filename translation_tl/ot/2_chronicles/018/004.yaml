  naturalness: Natural at magalang ang “Pakisangguni mo ...,” at ang transitive nitong gamit sa “ang salita ni Yahweh” ay katanggap-tanggap sa modernong Filipino. Mas tapat at mas masinop ang pangungusap kapag inalis ang “muna.”
