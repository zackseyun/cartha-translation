id: 2CH.18.22
reference: 2 Chronicles 18:22
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/עַתָּ֗ה הִנֵּ֨ה נָתַ֤ן יְהוָה֙ ר֣וּחַ שֶׁ֔קֶר בְּ/פִ֖י נְבִיאֶ֣י/ךָ אֵ֑לֶּה וַֽ/יהוָ֔ה דִּבֶּ֥ר עָלֶ֖י/ךָ רָעָֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/022.yaml
  text: And now, look, the LORD has put a lying spirit in the mouth of these prophets of yours, and the LORD has spoken disaster against you.
translation:
  language: tl
  text: At ngayon, tingnan mo! Naglagay si Yahweh ng espiritu ng kasinungalingan sa bibig ng mga propeta mong ito, at nagsalita si Yahweh ng kapahamakan laban sa iyo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה הִנֵּה
  choice: At ngayon, tingnan mo!
  rationale: Pinananatili ang panawag-pansing diin ng הִנֵּה sa natural at makabagong Tagalog.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inilalarawan ang personal na pangalan ng Diyos sa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: רוּחַ שֶׁקֶר
  choice: espiritu ng kasinungalingan
  rationale: Malapit sa anyo ng Hebreo at hindi labis na nililinaw kung ang espiritu ay likas na sinungaling o instrumento ng panlilinlang.
- source_word: בְּפִי נְבִיאֶיךָ אֵלֶּה
  choice: sa bibig ng mga propeta mong ito
  rationale: Pinananatili ang larawang Hebreo ng iisang 'bibig' bilang daluyan ng magkakatulad nilang pahayag, pati ang diin ng 'mga propeta mong ito.'
- source_word: דִּבֶּר עָלֶיךָ רָעָה
  choice: nagsalita ... ng kapahamakan laban sa iyo
  rationale: Pinananatili ang matinding diwa ng עַל at ang sakunang kahulugan ng רָעָה sa kontekstong ito, nang hindi ito ginagawang simpleng moral na 'kasamaan.'
theological_decisions:
- issue: Ang pagkilos ni Yahweh kaugnay ng espiritu ng kasinungalingan
  choice: Naglagay si Yahweh ng espiritu ng kasinungalingan
  alternative: Pinahintulutan ni Yahweh ang isang espiritung magsinungaling
  rationale: Ang tahasang causative na pahayag ng talata ay pinanatili; hindi ito pinalambot tungo sa pahintulot lamang, kaya nananatili ang teolohikal na tensiyon ng orihinal.
- issue: Ang pahayag ng kapahamakan
  choice: nagsalita si Yahweh ng kapahamakan laban sa iyo
  alternative: ipinasiya ni Yahweh na mapahamak ka
  rationale: Hindi ginawang tahasang utos o pasiya ang pandiwang 'nagsalita'; pinananatili ang anyo at saklaw ng Hebreo.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang 'tingnan mo' bilang tuwirang panawag-pansin at ang 'Yahweh' bilang transliterasyon ng banal na pangalan.
