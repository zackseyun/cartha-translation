  source_fidelity: 'Tapat ang salin sa Hebreo: ang וְעַתָּה הִנֵּה ay naipahayag bilang panawag-pansin, ang נָתַן ay napanatili bilang tahasang “Naglagay,” at ang “espiritu ng kasinungalingan,” “sa bibig ng mga propeta mong ito,” at “kapahamakan laban sa iyo” ay wastong tumutugma sa mga pangunahing parirala ng talata. Hindi nito pinapalambot ang sanhi o ipinapasok ang dagdag na paliwanag.'
