  terminology: Ang “Yahweh” ay pare-pareho para sa יהוה. Ang “espiritu ng kasinungalingan” ay maingat na pinananatili ang hindi lubos na tinutukoy na katangian ng רוּחַ שֶׁקֶר, at ang “kapahamakan” ay angkop sa רָעָה sa kontekstong ito.
