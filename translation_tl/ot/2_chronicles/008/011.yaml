source:
  edition: WLC
  text: וְ/אֶת בַּת פַּרְעֹ֗ה הֶעֱלָ֤ה שְׁלֹמֹה֙ מֵ/עִ֣יר דָּוִ֔יד לַ/בַּ֖יִת אֲשֶׁ֣ר בָּֽנָה לָ֑/הּ כִּ֣י אָמַ֗ר לֹא תֵשֵׁ֨ב אִשָּׁ֥ה לִ/י֙ בְּ/בֵית֙ דָּוִ֣יד מֶֽלֶךְ יִשְׂרָאֵ֔ל כִּי קֹ֣דֶשׁ הֵ֔מָּה אֲשֶׁר בָּֽאָ֥ה אֲלֵי/הֶ֖ם אֲר֥וֹן יְהוָֽה־־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/008/011.yaml
  text: And Solomon brought Pharaoh’s daughter up from the city of David to the house that he had built for her[a], for he said, “My wife shall not live in the house of David king of Israel, because the places to which the ark of Yahweh has come are holy.”
translation:
  language: tl
  text: Dinala ni Solomon ang anak na babae ng Paraon mula sa Lunsod ni David paakyat sa bahay na itinayo niya para sa kanya[a], sapagkat sinabi niya, “Hindi maninirahan ang asawa ko sa bahay ni David, na hari ng Israel, sapagkat banal ang mga lugar na narating ng Kaban ni Yahweh.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo, literal: “sapagkat banal sila, na pinuntahan ng Kaban ni Yahweh.” Ipinahihiwatig ng maramihang panghalip na ang tinutukoy ay mga lugar.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶעֱלָה
  choice: dinala ... paakyat
  rationale: Pinananatili ang direksiyonal na diwa ng Hiphil ng עלה habang gumagamit ng likas na pananalita sa modernong Tagalog.
- source_word: מֵעִיר דָּוִיד
  choice: mula sa Lunsod ni David
  rationale: Tuwiran at karaniwang salin ng heograpikong katawagan.
- source_word: לַבַּיִת אֲשֶׁר בָּנָה לָהּ
  choice: sa bahay na itinayo niya para sa kanya
  rationale: Ang בַּיִת ay pinanatiling “bahay” sa halip na gawing “palasyo”; malinaw sa konteksto na tirahang maharlika ito.
- source_word: לֹא תֵשֵׁב אִשָּׁה לִי
  choice: Hindi maninirahan ang asawa ko
  rationale: Sa konteksto, ang אִשָּׁה ay tumutukoy sa asawa ni Solomon, at ang ישׁב ay may diwang paninirahan.
- source_word: בְּבֵית דָּוִיד מֶלֶךְ יִשְׂרָאֵל
  choice: sa bahay ni David, na hari ng Israel
  rationale: Pinananatili ang “bahay” at nililinaw sa natural na Tagalog na si David ang hari ng Israel.
- source_word: קֹדֶשׁ הֵמָּה
  choice: banal ang mga lugar
  rationale: Ang panghalip ay maramihan; idinagdag ang ipinahihiwatig na “mga lugar” upang maging malinaw ang gramatika sa Tagalog.
- source_word: אֲשֶׁר בָּאָה אֲלֵיהֶם אֲרוֹן יְהוָה
  choice: na narating ng Kaban ni Yahweh
  rationale: Natural na inilalarawan ang mga lugar na pinuntahan o narating ng Kaban, nang hindi dinaragdagan ang teolohikal na kahulugan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang personal na pangalan sa halip na palitan ito ng titulong “PANGINOON.”
theological_decisions:
- issue: Ang ipinahihiwatig na maramihang tinutukoy sa paliwanag tungkol sa kabanalan
  choice: mga lugar na narating ng Kaban
  alternative: literal na “banal ang mga iyon na pinuntahan ng Kaban” o pangkalahatang pagtukoy sa bahay ni David
  rationale: Ang הֵמָּה at אֲלֵיהֶם ay kapwa maramihan. Ang “mga lugar” ang pinakamalinaw na ipinahihiwatig na tinutukoy, ngunit ipinapaliwanag ito sa talababa dahil hindi tahasang nasa Hebreo ang pangngalan.
- issue: Kahulugan ng אִשָּׁה sa pahayag ni Solomon
  choice: asawa
  alternative: babae
  rationale: Ang tinutukoy ay ang anak na babae ng Paraon bilang asawa ni Solomon; iniiwasan ng “asawa” ang maling pahiwatig na lahat ng babae ay saklaw ng pagbabawal.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “Kaban” bilang maikli at pamilyar na katawagan sa kaban ng tipan, at pinanatili ang pangalang Yahweh.
