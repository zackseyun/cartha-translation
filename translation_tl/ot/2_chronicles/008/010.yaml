  text: 'These were the chiefs of King Solomon’s deputies: two hundred and fifty[b][a], who ruled over the people.'
translation:
  language: tl
  text: Ito ang mga pinuno ng mga opisyal[a] ni Haring Solomon. May 250 sa kanila na namamahala sa bayan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga tagapangasiwa.” Ang salitang Hebreo ay tumutukoy sa mga opisyal na hinirang sa ilalim ng kapangyarihan ng hari.
    reason: lexical_alternative
  - marker: b
    text: O “na namumuno sa bayan” o “na may kapangyarihan sa bayan.” Maaari ring tumukoy ang pandiwa sa pangangasiwa sa isang administratibong diwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Ito ang
  rationale: Likas na panimula ito sa makasaysayang salaysay at malinaw na ipinakikilala ang tinutukoy na pangkat; hindi kailangang isalin nang hiwalay ang pang-ugnay na וְ sa Filipino.
- source_word: שָׂרֵי הַנְּצִיבִים
  choice: mga pinuno ng mga opisyal
  rationale: 'Pinananatili nito ang ugnayan ng ranggo: ang שָׂרֵי ang mga pinuno, at ang נְצִיבִים ang mga opisyal na itinalaga sa ilalim ng kapangyarihan ng hari.'
- source_word: אֲשֶׁר לַמֶּלֶךְ שְׁלֹמֹה
  choice: ni Haring Solomon
  rationale: Natural at maikli itong pagpapahayag sa Filipino ng kaugnayan ng mga opisyal sa hari.
- source_word: חֲמִשִּׁים וּמָאתָיִם
  choice: '250'
  rationale: Tuwirang katumbas ng bilang sa Hebreo at madaling basahin sa modernong Filipino.
- source_word: הָרֹדִים
  choice: na namamahala
  rationale: Ipinahahayag nito ang paggamit ng awtoridad sa kontekstong administratibo nang hindi ipinapalagay na malupit ang pamumuno.
- source_word: בָּעָם
  choice: sa mga tao
  rationale: Sa piling ng pandiwang רדה, tinutukoy nito ang mga taong saklaw ng kanilang kapangyarihan. Hindi ginawang “mga manggagawa” sapagkat hindi iyon tahasang sinasabi sa talata.
