  text: וּ/בִ/דְבַר י֣וֹם בְּ/י֗וֹם לְ/הַעֲלוֹת֙ כְּ/מִצְוַ֣ת מֹשֶׁ֔ה לַ/שַּׁבָּתוֹת֙ וְ/לֶ֣/חֳדָשִׁ֔ים וְ/לַ/מּ֣וֹעֲד֔וֹת שָׁל֥וֹשׁ פְּעָמִ֖ים בַּ/שָּׁנָ֑ה בְּ/חַ֧ג הַ/מַּצּ֛וֹת וּ/בְ/חַ֥ג הַ/שָּׁבֻע֖וֹת וּ/בְ/חַ֥ג הַ/סֻּכּֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/008/013.yaml
  text: 'according to the daily requirement for offering up sacrifices[a], as Moses commanded, for the Sabbaths, the new moons, and the appointed feasts three times in the year: at the Feast of Unleavened Bread, at the Feast of Weeks[c][b], and at the Feast of Booths.'
translation:
  language: tl
  text: 'ayon sa kinakailangan sa bawat araw[a] upang maghandog ng mga hain, gaya ng iniutos ni Moises, para sa mga Sabbath, mga bagong buwan, at mga takdang kapistahan—tatlong beses sa isang taon: sa Pista ng Tinapay na Walang Pampaalsa, sa Pista ng mga Linggo[b], at sa Pista ng mga Kubol[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “ayon sa bagay ng bawat araw sa araw nito”; maaari ring isalin na “ayon sa tuntunin para sa bawat araw.”
    reason: lexical_alternative
  - marker: b
    text: Ang “Pista ng mga Linggo” ay tinawag na “Pentecostes” sa mas huling katawagang Griyego.
    reason: cross_reference
  - marker: c
    text: 'Tinatawag din itong “Pista ng mga Tabernakulo” o “Pista ng mga Silungan.” Hebreo: “mga kubol.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִדְבַר יוֹם בְּיוֹם
  choice: ayon sa kinakailangan sa bawat araw
  rationale: Ang idyoma ay literal na tumutukoy sa “bagay ng isang araw sa araw nito” at sa konteksto ay nagpapahiwatig ng itinakdang gawain o handog para sa bawat araw. Likas sa modernong Tagalog ang “kinakailangan sa bawat araw,” habang pinananatili sa talababa ang literal na anyo.
- source_word: לְהַעֲלוֹת
  choice: upang maghandog
  rationale: Sa kontekstong pangsakripisyo, ang Hiphil ng עלה ay nangangahulugang maghandog o magpausok ng handog. Sapat na malinaw ang “maghandog” dahil naitakda na ng konteksto ang uri ng gawain, nang hindi nagdaragdag ng tahasang layon na wala sa parirala.
- source_word: כְּמִצְוַת מֹשֶׁה
  choice: gaya ng iniutos ni Moises
  rationale: Natural at tuwirang ipinahahayag nito na ang mga paghahandog ay alinsunod sa utos na ibinigay ni Moises.
- source_word: לַשַּׁבָּתוֹת
  choice: para sa mga Sabbath
  rationale: Tinutukoy ng pang-ukol ang mga okasyong pinagtatakdaan ng handog. Pinanatili ang kilalang katawagang “Sabbath.”
- source_word: וְלֶחֳדָשִׁים
  choice: mga Bagong Buwan
  rationale: Sa wikang pangkalendaryo at pangkulto, tumutukoy ito sa pagdiriwang sa pagsisimula ng buwan, hindi lamang sa mga buwan sa pangkalahatan.
- source_word: וְלַמּוֹעֲדוֹת
  choice: mga takdang kapistahan
  rationale: Pinagsasama nito ang diwa ng itinakdang panahon at ng kapistahan; pinatutunayan ng kasunod na talaan na mga kapistahan ang tinutukoy.
- source_word: שָׁלֹשׁ פְּעָמִים בַּשָּׁנָה
  choice: tatlong beses sa isang taon
  rationale: Ito ang tuwiran at natural na modernong Tagalog para sa pahayag na temporal.
- source_word: בְּחַג הַמַּצּוֹת
  choice: sa Pista ng Tinapay na Walang Pampaalsa
  rationale: Malinaw nitong isinasalin ang pangalan ng kapistahan at pinananatili ang konkretong pagtukoy sa tinapay na walang lebadura o pampaalsa.
- source_word: וּבְחַג הַשָּׁבֻעוֹת
  choice: sa Pista ng mga Linggo
  rationale: Isinasalin nito ang mismong Hebreong pangalan sa halip na ipalit ang mas huling Griyegong katawagang Pentecostes.
- source_word: וּבְחַג הַסֻּכּוֹת
  choice: sa Pista ng mga Kubol
  rationale: Ang סֻכּוֹת ay mga pansamantalang kubol o silungan. Ang “mga Kubol” ay malinaw, konkreto, at mas malapit sa Hebreo kaysa sa tradisyonal na “Tabernakulo.”
theological_decisions:
- issue: Pagpapangalan sa tatlong kapistahan ng Israel
  choice: Pista ng Tinapay na Walang Pampaalsa / Pista ng mga Linggo / Pista ng mga Kubol
  alternative: Panahon ng Paskuwa / Pentecostes / Pista ng mga Tabernakulo
  rationale: Tuwirang pinangalanan ng Hebreo ang mga kapistahan. Ginamit sa pangunahing teksto ang malinaw na salin ng mga pangalang Hebreo, habang inilagay sa talababa ang mga tradisyonal o mas huling katawagan kung makatutulong.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “pampaalsa” sa halip na ang mas teknikal na “lebadura” sa pangalan ng kapistahan, at “kubol” upang mapanatili ang konkretong larawan ng Hebreo. Ang talata ay pinanatiling sintaktikong kaugnay ng naunang konteksto sa pamamagitan ng panimulang “ayon,” gaya ng anyong Hebreo.
