  text: And they did not turn aside from the king’s command concerning the priests and the Levites in any matter[a], or concerning the treasuries.
translation:
  language: tl
  text: Hindi sila lumihis sa utos ng hari tungkol sa mga pari at mga Levita sa anumang bagay at sa mga kabang-yaman.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga imbakan.” Maaaring tumukoy ang salitang Hebreo sa mga kabang-yaman o sa mga imbakan; ang “mga kabang-yaman” ay angkop sa konteksto ng pangangasiwa sa templo.
    reason: lexical_alternative
lexical_decisions:
- source_word: סָרוּ
  choice: lumihis
  rationale: Ang סור ay nangangahulugang lumihis o tumalikod. Ang “lumihis” ay likas sa Filipino at pinananatili ang larawang Hebreo ng hindi paglihis sa isang utos.
- source_word: מִצְוַת הַמֶּלֶךְ
  choice: utos ng hari
  rationale: Ang מִצְוָה ay utos o kautusan. Sa kontekstong pang-administrasyon, malinaw at natural ang “utos ng hari.”
- source_word: עַל הַכֹּהֲנִים וְהַלְוִיִּם
  choice: tungkol sa mga pari at mga Levita
  rationale: Dito, ipinakikilala ng עַל ang saklaw ng utos. Ang pag-uulit ng “mga” ay nagpapanatili sa pagkakahiwalay ng dalawang pangkat sa Hebreo.
- source_word: לְכָל דָּבָר
  choice: sa anumang bagay
  rationale: Sa negatibong pangungusap, natural na ipinahahayag nito na hindi sila lumihis sa alinmang bahagi o usapin.
- source_word: וְלָאֹצָרוֹת
  choice: pati sa mga kabang-yaman
  rationale: Maaaring tumukoy ang אֹצָרוֹת sa mga kabang-yaman o mga imbakan. Ang “kabang-yaman” ay angkop sa pangangasiwa sa templo, at ipinahihiwatig ng “pati” na kabilang ito sa lahat ng sinunod nilang tagubilin.
