  text: He built Tadmor in the wilderness[a], and all the storage cities that he built in Hamath.
translation:
  language: tl
  text: Itinayo niya ang Tadmor sa ilang[a], at lahat ng lunsod-imbakan na itinayo niya sa Hamat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Tadmor ay tradisyonal na kinikilala bilang Palmyra.
