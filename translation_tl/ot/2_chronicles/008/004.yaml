lexical_decisions:
- source_word: וַיִּבֶן
  choice: Itinayo niya
  rationale: Ang wayyiqtol ng בנה ay nagsasaad ng naganap na kilos sa daloy ng salaysay; natural sa modernong Tagalog ang aspektong naganap nang hindi na tahasang isinasalin ang pang-ugnay.
- source_word: תַּדְמֹר
  choice: Tadmor
  rationale: Pangalan ito ng lugar, kaya tinumbasan sa pamamagitan ng transliterasyon at hindi pinalitan ng mas huling pangalang Palmyra.
- source_word: בַּמִּדְבָּר
  choice: sa ilang
  rationale: Ang מִדְבָּר ay tumutukoy sa ilang o tigang na lupain; ang “sa ilang” ay maikli, natural, at hindi nililimitahan ang kahulugan sa mabuhanging disyerto lamang.
- source_word: כָּל עָרֵי הַמִּסְכְּנוֹת
  choice: lahat ng mga lunsod-imbakan
  rationale: Tumutukoy ang parirala sa mga lunsod na ginagamit sa pag-iimbak ng mga panustos. Malinaw at makabago ang tambalang “lunsod-imbakan.”
- source_word: אֲשֶׁר בָּנָה
  choice: na itinayo niya
  rationale: Direktang isinasalin ang sugnay na naglalarawan sa mga lunsod-imbakan.
- source_word: בַּחֲמָת
  choice: sa Hamat
  rationale: Pinananatili ang pangalang lugar at ang malawak na saklaw ng pang-ukol na ב; hindi tiyak na nilulutas kung lungsod o teritoryo ng Hamat ang tinutukoy.
