  text: וְ/הֶ/עָרִ֗ים אֲשֶׁ֨ר נָתַ֤ן חוּרָם֙ לִ/שְׁלֹמֹ֔ה בָּנָ֥ה שְׁלֹמֹ֖ה אֹתָ֑/ם וַ/יּ֥וֹשֶׁב שָׁ֖ם אֶת בְּנֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/008/002.yaml
  text: As for the cities that Huram had given to Solomon[c][b][a], Solomon rebuilt them and settled the people of Israel there.
translation:
  language: tl
  text: At ang mga lungsod na ibinigay ni Huram[a] kay Solomon ay muling itinayo[b] ni Solomon, at pinatira niya roon ang mga Israelita[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: Huram; tradisyonal na Hiram.'
    reason: alternative_reading
  - marker: b
    text: O “itinayo.” Ang pandiwang Hebreo ay maaaring mangahulugang “itinayo” o, ayon sa konteksto, “muling itinayo/ipinanumbalik.”
    reason: lexical_alternative
  - marker: c
    text: Sa literal, “mga anak na lalaki ng Israel.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֶעָרִים
  choice: At ang mga lungsod
  rationale: Pinananatili ang pang-ugnay at tiyak na pagtukoy ng Hebreo; natural din itong nagsisimula ng kasunod na pangyayari sa Filipino.
- source_word: אֲשֶׁר נָתַן
  choice: na ibinigay
  rationale: Ang sugnay na panuring ay tumutukoy sa mga lungsod, at ang naganap na pagbibigay ay nauna sa muling pagtatayo.
- source_word: חוּרָם
  choice: Huram
  rationale: Tuwirang tinutumbasan ang anyong Hebreo na חוּרָם sa halip na gamitin ang tradisyonal na Hiram.
- source_word: לִשְׁלֹמֹה
  choice: kay Solomon
  rationale: Ipinapakita ng ל ang tumanggap ng mga lungsod.
- source_word: בָּנָה
  choice: muling itinayo
  rationale: Pangunahing nangangahulugang 'itinayo' ang pandiwa, ngunit dahil umiiral nang mga lungsod ang ibinigay, makatuwirang ipahiwatig sa konteksto ang pagtatayong muli o pagpapanumbalik; pinananatili sa talababa ang literal na alternatibo.
- source_word: וַיּוֹשֶׁב שָׁם
  choice: at pinanirahan niya roon
  rationale: 'Ang Hiphil ng ישׁב ay sanhi: pinatira ni Solomon ang mga tao sa mga lungsod. Ang ''pinanirahan niya roon'' ay maikli at likas sa Filipino habang pinananatili ang sanhi.'
- source_word: אֶת בְּנֵי יִשְׂרָאֵל
  choice: ang mga Israelita
  rationale: Bagaman literal na 'mga anak na lalaki ng Israel,' tumutukoy dito ang parirala sa sambayanan ng Israel sa pangkalahatan, kaya malinaw at likas ang 'mga Israelita.'
