id: 2CH.8.14
reference: 2 Chronicles 8:14
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יַּעֲמֵ֣ד כְּ/מִשְׁפַּ֣ט דָּֽוִיד אָ֠בִי/ו אֶת מַחְלְק֨וֹת הַ/כֹּהֲנִ֜ים עַל עֲבֹדָתָ֗/ם וְ/הַ/לְוִיִּ֣ם עַל מִ֠שְׁמְרוֹתָ/ם לְ/הַלֵּ֨ל וּ/לְ/שָׁרֵ֜ת נֶ֤גֶד הַ/כֹּֽהֲנִים֙ לִ/דְבַר י֣וֹם בְּ/יוֹמ֔/וֹ וְ/הַ/שּׁוֹעֲרִ֥ים בְּ/מַחְלְקוֹתָ֖/ם לְ/שַׁ֣עַר וָ/שָׁ֑עַר כִּ֣י כֵ֔ן מִצְוַ֖ת דָּוִ֥יד אִישׁ הָ/אֱלֹהִֽים־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/008/014.yaml
  text: And according to the ordinance of David his father[a], he appointed the divisions of the priests for their service, and the Levites for their duties, to praise and to minister before the priests, as each day required, and the gatekeepers in their divisions for each gate; for so was the commandment of David[b], the man of God.
translation:
  language: tl
  text: At ayon sa tuntunin ni David na kanyang ama[a], itinalaga niya ang mga pangkat ng mga pari para sa kanilang paglilingkod, at ang mga Levita para sa kanilang mga tungkulin—upang magpuri at maglingkod sa harap ng mga pari ayon sa kinakailangan sa bawat araw[b]—at ang mga bantay ng pintuan ayon sa kanilang mga pangkat para sa bawat pintuan; sapagkat gayon ang utos ni David, ang tao ng Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “David na kanyang ninuno.” Sa gamit ng Hebreo sa mga talaangkanan at sa paghahari, ang “ama” ay maaari ring tumukoy sa isang ninuno.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “ayon sa gawain ng isang araw sa araw nito,” ibig sabihin, ayon sa nakatakdang kinakailangan sa bawat araw.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֵד
  choice: itinalaga niya
  rationale: Ang Hiphil ng עמד ay nangangahulugang maglagay o magtalaga sa isang tungkulin; ang “itinalaga” ay natural sa kontekstong administratibo.
- source_word: כְּמִשְׁפַּט
  choice: ayon sa tuntunin
  rationale: Sa kontekstong ito, tumutukoy ang מִשְׁפָּט sa itinakdang kaayusan o tuntunin, hindi sa hatol ng hukuman.
- source_word: דָּוִיד אָבִיו
  choice: David na kanyang ama
  rationale: Pinananatili nito ang literal na pananalita ng Hebreo; sa gamit na panghari at pangangkanan, ang “ama” ay maaari ring tumukoy sa isang ninuno.
- source_word: מַחְלְקוֹת
  choice: mga pangkat
  rationale: Tumutukoy ito sa organisadong mga pangkat o dibisyon ng mga tauhan sa templo; mas malinaw sa karaniwang mambabasa ang “mga pangkat.”
- source_word: עַל עֲבֹדָתָם
  choice: para sa kanilang paglilingkod
  rationale: Ipinahihiwatig nito ang pagkakatalaga sa larangan ng kanilang sagradong paglilingkod.
- source_word: מִשְׁמְרוֹתָם
  choice: kanilang mga tungkulin
  rationale: Maaaring mangahulugan ng mga pagbabantay o iniatang na pananagutan; akma rito ang pangkalahatang “mga tungkulin.”
- source_word: לְהַלֵּל וּלְשָׁרֵת
  choice: upang magpuri at maglingkod
  rationale: Tuwirang isinasalin ang dalawang layunin, habang ang “maglingkod” ay natural at saklaw ang paglilingkod sa templo.
- source_word: נֶגֶד הַכֹּהֲנִים
  choice: sa harap ng mga pari
  rationale: Pinananatili ang karaniwang kahulugan ng נֶגֶד bilang “sa harap” o “sa presensya ng,” nang hindi nililinaw nang higit sa teksto ang ugnayan nila sa mga pari.
- source_word: לִדְבַר יוֹם בְּיוֹמוֹ
  choice: ayon sa kinakailangan sa bawat araw
  rationale: Natural na ipinahahayag ang idyomang Hebreo na tumutukoy sa nakatakdang gawain o pangangailangan ng bawat araw.
- source_word: הַשּׁוֹעֲרִים
  choice: mga bantay ng pintuan
  rationale: Malinaw na tumutukoy sa mga inatasang magbantay o mangasiwa sa mga pintuan ng templo.
- source_word: לְשַׁעַר וָשָׁעַר
  choice: para sa bawat pintuan
  rationale: 'Ipinapakita ang distributibong diwa: may itinakdang pangkat sa bawat pintuan.'
- source_word: מִצְוַת
  choice: utos
  rationale: Nagpapahayag ito ng may-awtoridad na tagubilin; ang “utos” ay dignified at mas natural sa modernong Tagalog kaysa “kautusan” sa pangungusap na ito.
- source_word: אִישׁ הָאֱלֹהִים
  choice: ang tao ng Diyos
  rationale: Ito ang pormal at kinikilalang katumbas ng titulong Hebreo, nang hindi dinaragdagan ang teolohikal na kahulugan.
theological_decisions:
- issue: Ang katawagang pangangkanan na “David na kanyang ama”
  choice: Pinanatili ang “ama” sa pangunahing teksto.
  alternative: David na kanyang ninuno
  rationale: Maaaring gamitin sa Hebreo ang “ama” para sa isang naunang ninuno o maharlikang hinalinhan. Ang pagpapanatili nito ay gumagalang sa anyo at tunay na lawak ng kahulugan ng pinagmulan; nililinaw ng talababa ang posibleng diwa.
translation_notes:
  register: Modernong Filipino Tagalog na pormal ngunit madaling maunawaan. Ginamit ang “mga pangkat” sa halip na teknikal o makalumang katawagan, at pinanatili ang “tao ng Diyos” bilang dignified na titulong biblikal.
