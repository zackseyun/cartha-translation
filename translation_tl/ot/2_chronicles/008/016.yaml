  yaml_path: translation/ot/2_chronicles/008/016.yaml
  text: Thus all the work of Solomon was prepared from the day the house of Yahweh was founded until it was finished[b][a]. So the house of Yahweh was completed.
translation:
  language: tl
  text: Sa gayon, naihanda ang lahat ng gawain ni Solomon mula sa araw na inilatag ang pundasyon ng bahay ni Yahweh hanggang sa matapos ito.[a][b] Sa gayon, ganap nang natapos ang bahay ni Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “naitatag” o “naisaayos ang lahat ng gawain ni Solomon.” Ang pandiwang Hebreo ay maaaring tumukoy sa pagtatatag, paghahanda, o pagsasaayos.
    reason: lexical_alternative
  - marker: b
    text: 'Mas literal: “mula sa araw ng paglalatag ng pundasyon ng bahay ni Yahweh hanggang sa pagkakatapos nito.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּכֹּן
  choice: naihanda
  rationale: Ang Niphal ng כון ay maaaring mangahulugang naitatag, naihanda, o naisaayos. Sa buod na ito ng proyekto, natural sa Tagalog ang “naihanda” habang pinananatili ang pasibo at resultang diwa.
- source_word: כָּל מְלֶאכֶת שְׁלֹמֹה
  choice: ang lahat ng gawain ni Solomon
  rationale: Malawak ang saklaw ng מְלָאכָה at maaaring tumukoy sa buong gawain o proyekto; malinaw at natural ang saling ito.
- source_word: עַד הַיּוֹם מוּסַד בֵּית יְהוָה וְעַד כְּלֹתוֹ
  choice: mula sa araw na inilatag ang pundasyon ng bahay ni Yahweh hanggang sa matapos ito
  rationale: Ipinahahayag nito sa natural na Tagalog ang panahong saklaw mula sa paglalatag ng pundasyon hanggang sa pagkakatapos, habang itinatala sa talababa ang mas literal na ayos.
- source_word: בֵּית יְהוָה
  choice: bahay ni Yahweh
  rationale: Pinananatili ang literal na larawang “bahay” sa halip na gawing “templo,” at isinasalin ang banal na pangalan bilang Yahweh.
- source_word: שָׁלֵם
  choice: lubos na natapos
  rationale: Ang predikatibong שָׁלֵם ay nagsasaad na ang bahay ay ganap o buo nang natapos; ipinakikita ng “lubos” ang diwa ng pagiging kumpleto.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Personal na banal na pangalan ang יְהוָה sa tekstong Hebreo. Pinananatili ng “Yahweh” ang pangalan sa halip na palitan ito ng isang titulo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “bahay ni Yahweh” upang manatiling malapit sa Hebreo, bagaman templo ang tinutukoy. Ang “Sa gayon” at “Kaya” ay nagpapanatili sa buod at pangwakas na diin ng talata.
