base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/008/017.yaml
  text: Then Solomon went to Ezion-geber and to Eloth[a], on the shore of the sea in the land of Edom.
translation:
  language: tl
  text: Pagkatapos nito, pumunta si Solomon sa Ezion-geber at sa Elot[a], sa baybayin ng dagat sa lupain ng Edom.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring baybayin ang Elot bilang Elat o Elath.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: Pagkatapos
  rationale: Nagsisilbing panandang temporal na nag-uugnay sa susunod na pangyayari sa salaysay; natural ito sa makabagong Tagalog.
- source_word: הָלַךְ
  choice: pumunta
  rationale: Karaniwang tumutukoy ang pandiwa sa pagpunta o paglalakbay; mas tumpak dito ang “pumunta” kaysa literal na “lumakad.”
- source_word: לְעֶצְיוֹן גֶּבֶר
  choice: sa Ezion-geber
  rationale: Isinalin ang pang-ukol at tinumbasan sa baybay-Latin ang pangalan ng lugar, habang pinananatili ang nakasanayang gitling sa tambalang pangalan.
- source_word: וְאֶל אֵילוֹת
  choice: at sa Elot
  rationale: Pinananatili ang pangatnig at direksiyon ng parirala. Ang “Elot” ay malapit na transliterasyon sa anyong Hebreo na אֵילוֹת at madaling bigkasin sa Filipino.
- source_word: עַל שְׂפַת הַיָּם
  choice: na nasa baybayin ng dagat
  rationale: Ang שְׂפָה ay tumutukoy sa gilid o baybay. Ang sugnay na “na nasa” ay natural na ikinakabit sa dalawang bayang binanggit.
- source_word: בְּאֶרֶץ אֱדֹום
  choice: sa lupain ng Edom
  rationale: Pinananatili ang tahasang salitang “lupain” sa Hebreo sa halip na paikliin bilang “sa Edom.”
