  terminology: Ang “Solomon,” “Ezion-geber,” “Elot,” at “Edom” ay angkop na mga transliterasyon sa modernong Filipino Tagalog. Ang talababa ay dapat magpaliwanag na mga alternatibong baybay ang Elat at Elath, sa halip na ipahiwatig na simpleng mga katawagang ginagamit lamang ng “ibang salin.”
