  to: pati ang Baalat, ang lahat ng lunsod na imbakan[a] na pag-aari ni Solomon, ang lahat ng lunsod para sa mga karwahe, ang mga lunsod para sa mga mangangabayo[c], at ang lahat ng ninanais ni Solomon[b] na itayo sa Jerusalem, sa Lebanon, at sa buong lupaing nasasakupan niya.
