translation_notes:
  register: Modernong Filipino na malinaw at marangal ang tono. Pinanatili ang anyong patuloy na talaan sa pagsisimula sa “pati,” sapagkat bahagi ang talata ng pangungusap mula sa naunang talata. Inilagay ang mga talababa kaagad sa mga salitang tinutukoy ng bawat isa.
