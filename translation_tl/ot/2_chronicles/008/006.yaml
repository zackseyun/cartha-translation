source:
  edition: WLC
  text: וְ/אֶֽת בַּעֲלָ֗ת וְ/אֵ֨ת כָּל עָרֵ֤י הַֽ/מִּסְכְּנוֹת֙ אֲשֶׁ֣ר הָי֣וּ לִ/שְׁלֹמֹ֔ה וְ/אֵת֙ כָּל עָרֵ֣י הָ/רֶ֔כֶב וְ/אֵ֖ת עָרֵ֣י הַ/פָּרָשִׁ֑ים וְ/אֵ֣ת כָּל חֵ֣שֶׁק שְׁלֹמֹ֗ה אֲשֶׁ֤ר חָשַׁק֙ לִ/בְנ֤וֹת בִּ/ירֽוּשָׁלִַ֨ם֙ וּ/בַ/לְּבָנ֔וֹן וּ/בְ/כֹ֖ל אֶ֥רֶץ מֶמְשַׁלְתּֽ/וֹ־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/008/006.yaml
  text: and Baalath[a], and all the storage cities that belonged to Solomon, and all the chariot cities, and the cities of the horsemen[c][b], and all that Solomon desired to build in Jerusalem and in Lebanon and throughout all the land of his dominion.
translation:
  language: tl
  text: pati ang Baalat, ang lahat ng lunsod na imbakan[a] na pag-aari ni Solomon, ang lahat ng lunsod para sa mga karwahe, ang mga lunsod para sa mga mangangabayo[c], at ang lahat ng ninanais ni Solomon[b] na itayo sa Jerusalem, sa Lebanon, at sa buong lupaing nasasakupan niya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga lunsod ng panustos” o, marahil, “mga lunsod ng kayamanan.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “ang lahat ng pagnanais ni Solomon na ninais niyang itayo,” isang pag-uulit ng magkaugnay na mga salita na nagbibigay-diin sa kanyang nais o kinalulugdan.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “mga lunsod para sa mga kabayo”; ngunit ang salitang Hebreo ay mas karaniwang tumutukoy sa mga mangangabayo o kabalyerya.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּעֲלָת
  choice: Baalat
  rationale: Pangalan ito ng isang lugar; ginamit ang tuwirang transliterasyong angkop sa Filipino.
- source_word: עָרֵי הַמִּסְכְּנוֹת
  choice: mga lunsod na imbakan
  rationale: Tumutukoy ang parirala sa mga lunsod na ginagamit sa pag-iimbak ng panustos o mga kagamitan; malinaw at natural ito sa modernong Filipino.
- source_word: אֲשֶׁר הָיוּ לִשְׁלֹמֹה
  choice: na pag-aari ni Solomon
  rationale: Likas na ipinapahayag nito sa Filipino ang pagmamay-aring nasa Hebreo.
- source_word: עָרֵי הָרֶכֶב
  choice: mga lunsod para sa mga karwaheng pandigma
  rationale: Ipinakikita nitong ang mga lunsod ay kaugnay ng mga karwaheng ginagamit sa hukbo, nang hindi dinaragdagan ang tungkulin ng mga ito nang lampas sa konteksto.
- source_word: עָרֵי הַפָּרָשִׁים
  choice: mga lunsod para sa mga mangangabayo
  rationale: Ang פָּרָשִׁים ay karaniwang tumutukoy sa mga mangangabayo o kabalyerya, hindi lamang sa mga kabayo.
- source_word: כָּל חֵשֶׁק שְׁלֹמֹה אֲשֶׁר חָשַׁק
  choice: ang lahat ng nais ni Solomon
  rationale: Natural nitong naihahatid ang kahulugan ng magkaugnay na pangngalan at pandiwa sa Hebreo, habang ipinaliliwanag sa talababa ang sadyang pag-uulit.
- source_word: לִבְנוֹת
  choice: na itayo
  rationale: Ang pandiwa ay nangangahulugang magtayo o bumuo; walang hinihinging kahulugang muling pagtatayo sa mismong teksto.
- source_word: בִּירוּשָׁלִַם
  choice: sa Jerusalem
  rationale: Karaniwang anyo ng pangalang heograpiko sa Filipino.
- source_word: וּבַלְּבָנוֹן
  choice: sa Lebanon
  rationale: Karaniwang anyo ng pangalang heograpiko sa Filipino.
- source_word: בְכֹל אֶרֶץ מֶמְשַׁלְתּוֹ
  choice: sa buong lupaing nasasakupan niya
  rationale: Pinananatili nito kapwa ang teritoryal na diwa at ang ideya ng pamamahala o kapangyarihan.
