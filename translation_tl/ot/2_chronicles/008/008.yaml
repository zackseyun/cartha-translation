revisions:
- from: Mula sa kanilang mga inapo na naiwan sa lupain pagkamatay ng kanilang mga ninuno—yaong hindi nilipol ng mga Israelita[a]—pinilit sila ni Solomon na magtrabaho para sa pamahalaan[b], at nagpatuloy ito hanggang sa araw na ito.
  to: Mula sa kanilang mga inapo na naiwan sa lupain pagkaraan nila—yaong hindi nilipol ng mga Israelita[a]—ipinailalim sila ni Solomon sa sapilitang paggawa[b] hanggang sa araw na ito.
  rationale: Inalis ang hindi ipinahihiwatig na “pagkamatay” at ang dagdag na “para sa pamahalaan.” Pinalitan ang pandiwa upang malinaw na maipahayag ang pagpapailalim sa compulsory labor levy, habang pinananatili ang daloy, rehistro, at makabagong Filipino ng draft.
