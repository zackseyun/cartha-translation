  text: מִן בְּנֵי/הֶ֗ם אֲשֶׁ֨ר נוֹתְר֤וּ אַחֲרֵי/הֶם֙ בָּ/אָ֔רֶץ אֲשֶׁ֥ר לֹֽא כִלּ֖וּ/ם בְּנֵ֣י יִשְׂרָאֵ֑ל וַ/יַּעֲלֵ֤/ם שְׁלֹמֹה֙ לְ/מַ֔ס עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/008/008.yaml
  text: From their descendants who were left after them in the land—those whom the sons of Israel had not destroyed—Solomon conscripted them for forced labor[b][a], to this day.
translation:
  language: tl
  text: Mula sa kanilang mga inapo na naiwan sa lupain pagkaraan nila—yaong hindi nilipol ng mga Israelita[a]—ipinailalim sila ni Solomon sa sapilitang paggawa[b] hanggang sa araw na ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “mga anak ni Israel,” isang karaniwang katawagan sa bansang Israel.
    reason: lexical_alternative
  - marker: b
    text: O “sa paggawa bilang sapilitang buwis.” Ang salitang Hebreo ay tumutukoy sa sapilitang serbisyong paggawa na ipinapataw ng estado.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִן בְּנֵיהֶם
  choice: Mula sa kanilang mga inapo
  rationale: Bagaman literal na “mga anak na lalaki,” ang בְּנֵיהֶם ay tumutukoy rito sa mga sumunod na salinlahi; malinaw at likas sa Filipino ang “mga inapo.”
- source_word: אֲשֶׁר נוֹתְרוּ אַחֲרֵיהֶם
  choice: na naiwan sa lupain pagkamatay ng kanilang mga ninuno
  rationale: Pinananatili ng “naiwan” ang resultative na diwa ng נוֹתְרוּ. Sa konteksto, ang אַחֲרֵיהֶם ay nangangahulugang nanatili sila matapos mawala o mamatay ang naunang salinlahi; nilinaw ito upang maiwasan ang malabong “naiwan pagkatapos nila.”
- source_word: בָּאָרֶץ
  choice: sa lupain
  rationale: Ang “lupain” ay natural at angkop sa heograpiko at pangkasaysayang konteksto.
- source_word: אֲשֶׁר לֹא כִלּוּם בְּנֵי יִשְׂרָאֵל
  choice: yaong hindi nilipol ng mga Israelita
  rationale: Sa konteksto ng pananakop, ang Piel ng כלה ay may diwang “lipulin” o “ubusin.” Ang “mga Israelita” ang natural na makabagong katumbas ng pambansang katawagang “mga anak ni Israel.”
- source_word: וַיַּעֲלֵם שְׁלֹמֹה לְמַס
  choice: pinilit sila ni Solomon na magtrabaho para sa pamahalaan
  rationale: Ang kombinasyon ng causative וַיַּעֲלֵם at לְמַס ay tumutukoy sa pagpapataw ng sapilitang serbisyong paggawa. Ipinahahayag ito sa malinaw na Filipino nang hindi gumagamit ng teknikal na terminong “corvée.”
- source_word: עַד הַיּוֹם הַזֶּה
  choice: at nagpatuloy ito hanggang sa araw na ito
  rationale: Ipinakikita ng idyoma na ang kalagayan o kaayusan ng sapilitang paggawa ay nagpatuloy hanggang sa panahon ng manunulat; ang tahasang pandiwang “nagpatuloy” ay natural sa Filipino.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mga Israelita” bilang likas na pambansang katawagan at ipinaliwanag sa talababa ang literal na Hebreo. Iniwasan ang teknikal na “corvée” at ginawang tahasan ang administratibong diwa ng sapilitang paggawa.
