base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/008/018.yaml
  text: And Huram sent him[a], by the hand of his servants, ships and servants who knew the sea. They went with Solomon’s servants to Ophir, took from there four hundred and fifty talents of gold[c][b], and brought them to King Solomon.
translation:
  language: tl
  text: At ipinadala ni Huram sa kanya, sa pamamagitan ng kanyang mga lingkod, ang mga barko at mga lingkod na bihasa sa paglalayag.[a] Sumama sila sa mga lingkod ni Solomon papuntang Ofir. Kumuha sila roon ng apat na raan at limampung talento[b] ng ginto at dinala iyon kay Haring Solomon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal na “mga lingkod na nakaaalam sa dagat”; maaari ring isaling “mga lingkod na sanay sa dagat” o “mga mandaragat.”
    reason: lexical_alternative
  - marker: b
    text: Ang talento ay sinaunang yunit ng timbang; nag-iiba ang eksaktong bigat nito ayon sa panahon at pamantayang ginamit.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: ipinadala
  rationale: Karaniwang salin ng שלח sa salaysay; ipinahihiwatig ng anyong sanhi na ipinadala ni Huram ang mga bagay at tauhan kay Solomon.
- source_word: חוּרָם
  choice: Huram
  rationale: Sinusunod ang anyong Hebreo ng pangalan sa talatang ito.
- source_word: בְּיַד עֲבָדָיו
  choice: sa pamamagitan ng kanyang mga lingkod
  rationale: Natural na salin ng idyomang literal na 'sa kamay ng kanyang mga lingkod,' na tumutukoy sa ahensiya o paraan.
- source_word: אֳנִיּוֹת
  choice: mga barko
  rationale: Ang konteksto ay paglalayag patungong Ofir; ang 'mga barko' ay malinaw at pangkaraniwan.
- source_word: וַעֲבָדִים יֹדְעֵי יָם
  choice: mga lingkod na bihasa sa paglalayag
  rationale: Pinananatili ang tahasang katayuan nilang mga lingkod at ipinahahayag sa natural na Tagalog ang literal na 'nakaaalam sa dagat.'
- source_word: אוֹפִירָה
  choice: papuntang Ofir
  rationale: Ipinahahayag ang direksiyon na nakapaloob sa hulaping locative/directional -ָה.
- source_word: וַיִּקְחוּ מִשָּׁם
  choice: kumuha sila roon
  rationale: Direktang salin ng karaniwang pandiwang לקח nang hindi tinutukoy kung paano nakuha ang ginto.
- source_word: אַרְבַּע מֵאוֹת וַחֲמִשִּׁים כִּכַּר זָהָב
  choice: apat na raan at limampung talento ng ginto
  rationale: Pinananatili ang sinaunang yunit upang maiwasan ang di-tiyak na modernong konbersiyon.
- source_word: וַיָּבִיאוּ אֶל הַמֶּלֶךְ שְׁלֹמֹה
  choice: at dinala iyon kay Haring Solomon
  rationale: Ang isahang panghalip na 'iyon' ay natural na tumutukoy sa kabuuang dami ng gintong nabanggit.
