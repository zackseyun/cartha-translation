base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/008/005.yaml
  text: And he built Upper Beth-horon and Lower Beth-horon[a], fortified cities with walls, doors[c][b], and bars.
translation:
  language: tl
  text: Itinayo niya ang Bet-horon sa Itaas at ang Bet-horon sa Ibaba bilang mga lungsod na tanggulan[a], na may mga pader, mga pinto[b], at mga halang[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga pinatibay na lungsod.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “mga pinto”; malamang na tumutukoy ito sa mga pinto ng mga tarangkahan ng mga lungsod.
    reason: lexical_alternative
  - marker: c
    text: O “mga trangka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶן
  choice: Itinayo rin niya
  rationale: Ang pandiwa ay tuwirang nangangahulugang “itinayo” o “ginawa.” Hindi nito kinakailangang ipahiwatig na muling itinayo ang mga lugar. Ginamit ang “rin” upang likas na ipagpatuloy sa Filipino ang sunod-sunod na salaysay ng Hebreo.
- source_word: בֵּית חוֹרוֹן הָעֶלְיוֹן
  choice: Mataas na Bet-horon
  rationale: Pangalan ito ng lugar; isinalin ang panuring na tumutukoy sa mas mataas na kinalalagyan upang maiba ito sa kaparehang bayan.
- source_word: בֵּית חוֹרוֹן הַתַּחְתּוֹן
  choice: Mababang Bet-horon
  rationale: Kaagapay ito ng naunang pangalan at likas na ipinapahayag sa Filipino ang pagkakaiba ng dalawang bayan ayon sa taas ng kinalalagyan.
- source_word: עָרֵי מָצוֹר
  choice: mga lungsod na tanggulan
  rationale: Ipinahahayag ng parirala na ang mga lungsod ay ginawang matitibay na sentro ng depensa. Ang “mga lungsod na tanggulan” ay malinaw at hindi paulit-ulit sa kasunod na pagbanggit sa mga pader.
- source_word: חוֹמוֹת
  choice: mga pader
  rationale: Tumutukoy ito sa mga pader na depensa sa palibot ng mga lungsod.
- source_word: דְּלָתַיִם
  choice: mga pinto
  rationale: Ang karaniwang kahulugan ay “mga pinto” o “dobleng pinto,” hindi ang karaniwang salitang Hebreo para sa mismong tarangkahan ng lungsod. Sa konteksto, malamang na mga pinto ito ng mga tarangkahan.
- source_word: וּבְרִיחַ
  choice: at mga halang
  rationale: Ang salita ay tumutukoy sa baras o halang na ginagamit upang isara at patibayin ang mga pinto. Likas sa Filipino ang “halang” sa kontekstong ito.
