  register: Makabago ngunit marangal na Filipino. Pinanatili ang mga pangalan ng lugar bilang Bet-horon at ginawang likas sa Filipino ang pagkakaiba ng Mataas at Mababang bayan. Ang ayos na “bilang mga lungsod na tanggulan” ay malinaw na nag-uugnay sa dalawang bayan sa appositional na paglalarawan ng Hebreo.
