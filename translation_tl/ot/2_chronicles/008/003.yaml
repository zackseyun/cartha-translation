  source_fidelity: 'Tumpak ang pangunahing diwa: pumunta si Solomon sa Hamat-zoba at nanaig laban dito. Gayunman, ang ''nanaig dito'' ay maaaring mangahulugang ''excelled there'' sa Filipino at hindi sapat na malinaw na ang panghalip ay layon ng pagsalungat/pagpapailalim. Ang ''laban dito'' ay mas malinaw na tumutugma sa עָלֶיהָ nang hindi ipinipilit ang ''sinakop'' o ''pinasuko.'''
