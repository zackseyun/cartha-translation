  yaml_path: translation/ot/2_chronicles/008/003.yaml
  text: Then Solomon went to Hamath-zobah and prevailed against it[a].
translation:
  language: tl
  text: Pagkatapos, pumunta si Solomon sa Hamat-zoba at nanaig laban dito.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nanaig dito” o “kinontrol ito.” Sa literal, ang idyomang Hebreo ay “naging malakas laban dito.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: pumunta
  rationale: Ang salitang הלך ay payak na nangangahulugang “pumunta.” Bagaman militar ang konteksto, hindi tahasang nakapaloob sa pandiwa ang diwang “sumalakay,” kaya pinananatili ang mas payak na kahulugan.
- source_word: חֲמָת צוֹבָה
  choice: Hamat-zoba
  rationale: Itinuturing ang dalawang pangalan bilang iisang tambalang pangalan ng lugar at isinasalin sa anyong madaling basahin sa Filipino.
- source_word: וַיֶּחֱזַק עָלֶיהָ
  choice: nanaig dito
  rationale: Ang idyomang חזק על ay nagpapahayag ng pagiging malakas laban o ibabaw sa isang lugar, kaya ang “nanaig dito” ay likas sa Filipino at pinananatili ang saklaw sa pagitan ng pagtatagumpay at pagkontrol.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “dito” bilang panghalip para sa lugar at iniwasang gawing mas tiyak kaysa sa Hebreo ang uri ng militar o pampolitikang pagkapanalo.
