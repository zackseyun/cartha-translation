  text: כָּל הָ֠/עָם הַ/נּוֹתָ֨ר מִן הַ/חִתִּ֜י וְ/הָ/אֱמֹרִ֤י וְ/הַ/פְּרִזִּי֙ וְ/הַ/חִוִּ֣י וְ/הַ/יְבוּסִ֔י אֲשֶׁ֛ר לֹ֥א מִ/יִּשְׂרָאֵ֖ל הֵֽמָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/008/007.yaml
  text: As for all the people who were left from the Hittites[a], the Amorites, the Perizzites, the Hivites, and the Jebusites, who were not from Israel—
translation:
  language: tl
  text: Tungkol naman sa lahat ng taong nalabi mula sa mga Heteo, mga Amoreo, mga Perezeo, mga Heveo, at mga Jebuseo—na hindi nagmula sa Israel—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּל הָעָם
  choice: lahat ng taong
  rationale: Tumutukoy ang parirala sa kabuuan ng nalabing populasyong tinatalakay. Ang “lahat ng taong” ay likas na kolektibong pananalita sa modernong Filipino at maayos na nag-uugnay sa kasunod na “nalabi.”
- source_word: הַנּוֹתָר
  choice: nalabi
  rationale: Ang Niphal na anyong pandiwari ay tumutukoy sa mga naiwan o nanatili. Ang “nalabi” ay maikli, dignificado, at angkop sa pagbabalik-tanaw na pangkasaysayan.
- source_word: מִן
  choice: mula sa
  rationale: Ipinahihiwatig dito ng מִן ang pinagmulan o pagkaanib sa mga nakalistang bayan; tuwirang naipapahayag ito ng “mula sa.”
- source_word: הַחִתִּי וְהָאֱמֹרִי וְהַפְּרִזִּי וְהַחִוִּי וְהַיְבוּסִי
  choice: mga Heteo, mga Amoreo, mga Perezeo, mga Heveo, at mga Jebuseo
  rationale: Ginamit ang karaniwang Filipino na anyo ng mga pangalang etniko. Bagaman isahan ang anyong Hebreo, kolektibo ang gamit nito, kaya ang maramihang “mga” ay natural at tumpak.
- source_word: אֲשֶׁר לֹא מִיִּשְׂרָאֵל הֵמָּה
  choice: na hindi nagmula sa Israel
  rationale: Pinananatili nito ang diwa ng pang-ukol na מִן at ang pahayag tungkol sa pinagmulan, nang hindi ito pinaiikli agad sa mas interpretatibong “hindi mga Israelita.”
theological_decisions: []
translation_notes:
  register: Modernong Filipino na malinaw at dignificado. Pinanatili ang nakabiting sintaks ng talata sa pamamagitan ng mga gitling sapagkat nagpapatuloy ang pangungusap sa kasunod na talata. Walang talababa dahil sapat na natural at tumpak ang literal na “hindi nagmula sa Israel.”
