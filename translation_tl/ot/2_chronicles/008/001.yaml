  text: וַ/יְהִ֞י מִ/קֵּ֣ץ עֶשְׂרִ֣ים שָׁנָ֗ה אֲשֶׁ֨ר בָּנָ֧ה שְׁלֹמֹ֛ה אֶת בֵּ֥ית יְהוָ֖ה וְ/אֶת בֵּיתֽ/וֹ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/008/001.yaml
  text: And it happened at the end of twenty years[a], during which Solomon had built the house of Yahweh and his own house,
translation:
  language: tl
  text: At nang matapos ang dalawampung taon, kung kailan itinayo ni Solomon ang bahay ni Yahweh at ang sarili niyang bahay[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “palasyo niya.” Literal sa Hebreo, “bahay niya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: At nang
  rationale: Ipinahahayag ng anyong pasalaysay ang paglipat sa isang bagong pangyayari; natural sa Filipino ang “At nang” kapag sinusundan ito ng takdang panahon.
- source_word: מִקֵּץ
  choice: matapos
  rationale: Tumutukoy ito sa puntong naabot sa katapusan ng isang yugto ng panahon. Ang “matapos” ay malinaw at likas sa modernong Filipino.
- source_word: עֶשְׂרִים שָׁנָה
  choice: dalawampung taon
  rationale: Tuwirang salin ng pananalitang tumutukoy sa haba ng panahon.
- source_word: אֲשֶׁר בָּנָה
  choice: na ginugol ni Solomon sa pagtatayo
  rationale: Iniuugnay ng אֲשֶׁר ang dalawampung taon sa gawain ng pagtatayo ni Solomon. Ipinapahayag ng saling ito ang temporal na ugnayan nang natural sa Filipino nang hindi ipinapalagay na tuloy-tuloy ang paggawa sa bawat sandali ng buong panahon.
- source_word: בֵּית יְהוָה
  choice: bahay ni Yahweh
  rationale: Pinananatili ang literal na larawang “bahay” sa halip na ang mas interpretatibong “templo,” at tuwirang isinasalin ang banal na pangalan.
- source_word: בֵּיתוֹ
  choice: sarili niyang bahay
  rationale: Malinaw nitong ipinakikita ang kaibahan sa bahay ni Yahweh habang pinananatili ang literal na “bahay.” Posible sa konteksto ang “palasyo,” kaya inilagay iyon sa talababa.
theological_decisions:
- issue: Pagbaybay sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Nasa tekstong Hebreo ang Tetragrammaton bilang sariling pangalan. Pinananatili ng “Yahweh” ang pagkakakilanlan nito bilang banal na pangalan sa halip na palitan ito ng isang titulo.
- issue: Paglalarawan sa gusali ni Solomon
  choice: sarili niyang bahay
  alternative: palasyo niya
  rationale: Ang Hebreo ay literal na “bahay niya.” Bagaman malamang na ang tinutukoy ay ang palasyo ng hari, hindi iyon tahasang sinasabi ng salitang ginamit, kaya pinanatili ang literal na diwa sa pangunahing teksto.
translation_notes:
  register: Modernong Filipino na may marangal na himig. Ginamit ang “At nang” upang maipagpatuloy ang salaysay, at pinanatili ang kuwit sa hulihan dahil nagpapatuloy ang pangungusap sa susunod na talata.
