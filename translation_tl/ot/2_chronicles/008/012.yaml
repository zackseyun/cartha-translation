id: 2CH.8.12
reference: 2 Chronicles 8:12
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: אָ֣ז הֶעֱלָ֧ה שְׁלֹמֹ֛ה עֹל֖וֹת לַ/יהוָ֑ה עַ֚ל מִזְבַּ֣ח יְהוָ֔ה אֲשֶׁ֥ר בָּנָ֖ה לִ/פְנֵ֥י הָ/אוּלָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/008/012.yaml
  text: Then Solomon offered up burnt offerings to Yahweh on the altar of Yahweh that he had built before the vestibule[a].
translation:
  language: tl
  text: Pagkatapos, naghandog si Solomon kay Yahweh ng mga handog na sinusunog sa altar ni Yahweh na itinayo niya sa harap ng bulwagan[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “portiko” o “beranda.” Ang salitang Hebreo ay tumutukoy sa bulwagan sa pasukan ng templo.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: Pagkatapos
  rationale: Nagsisilbing panandang temporal na nag-uugnay sa kasunod na kilos sa daloy ng salaysay.
- source_word: הֶעֱלָה
  choice: naghandog
  rationale: Ang Hiphil ng עלה kapag may handog na pansunog bilang layon ay tumutukoy sa paghahandog nito sa altar; natural at malinaw ang pandiwang Filipino.
- source_word: שְׁלֹמֹה
  choice: Solomon
  rationale: Karaniwang anyo ng pangalan sa modernong saling Filipino.
- source_word: עֹלוֹת
  choice: mga handog na sinusunog
  rationale: Tumutukoy sa mga handog na sinusunog sa altar; pinananatili ang kultikong kahulugan sa paraang madaling maunawaan.
- source_word: לַיהוָה
  choice: kay Yahweh
  rationale: Ipinahihiwatig ng ל ang pinag-uukulan ng handog, at ang pangalang tipan na יהוה ay tuwirang isinaling Yahweh.
- source_word: עַל מִזְבַּח יְהוָה
  choice: sa altar ni Yahweh
  rationale: Natural na Filipino para sa lokasyon ng paghahandog at sa ugnayang ipinapahayag ng construct chain.
- source_word: אֲשֶׁר בָּנָה
  choice: na itinayo niya
  rationale: Malinaw na tumutukoy ang sugnay sa altar na nauna nang itinayo ni Solomon.
- source_word: לִפְנֵי הָאוּלָם
  choice: sa harap ng bulwagan
  rationale: Pinananatili ang lokatibong kahulugan ng לִפְנֵי, habang ang 'bulwagan' ay natural na katawagan sa pasukan o entrance hall ng templo.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang ginagamit sa Hebreo ang Tetragrammaton; pinananatili ng 'Yahweh' ang natatanging pangalang tipan sa halip na palitan ito ng isang titulo.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang 'bulwagan' sa pangunahing teksto bilang likas na katumbas ng entrance hall, habang inilagay sa talababa ang mga alternatibong katawagang arkitektural.
