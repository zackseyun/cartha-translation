translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “alipin” upang hindi palambutin ang sapilitang katayuan sa paggawa, at “opisyal” upang mapanatili ang tunay na leksikal na kawalang-katiyakan ng terminong militar.
