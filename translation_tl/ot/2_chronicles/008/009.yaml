  text: וּ/מִן בְּנֵי֙ יִשְׂרָאֵ֔ל אֲ֠שֶׁר לֹא נָתַ֧ן שְׁלֹמֹ֛ה לַ/עֲבָדִ֖ים לִ/מְלַאכְתּ֑/וֹ כִּי הֵ֜מָּה אַנְשֵׁ֤י מִלְחָמָה֙ וְ/שָׂרֵ֣י שָׁלִישָׁ֔י/ו וְ/שָׂרֵ֥י רִכְבּ֖/וֹ וּ/פָרָשָֽׁי/ו־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/008/009.yaml
  text: But from the sons of Israel Solomon did not make servants for his work[a], for they were men of war, and his officers[c][b], and the commanders of his chariots and his horsemen.
translation:
  language: tl
  text: Ngunit hindi ginawang mga alipin ni Solomon para sa kanyang gawain ang sinuman sa mga anak ni Israel[a], sapagkat sila ay mga mandirigma, mga opisyal niya[b], at mga pinuno ng kanyang mga karwahe at mga mangangabayo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga Israelita.” Sa Hebreo, “mga anak ni Israel.”
    reason: lexical_alternative
  - marker: b
    text: Ang salitang isinaling “mga opisyal” ay malamang na tumutukoy sa matataas na opisyal o mga katuwang sa hukbo; posible rin ang mas tiyak na saling “mga kapitan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מִן בְּנֵי יִשְׂרָאֵל
  choice: Ngunit ... ang sinuman sa mga anak ni Israel
  rationale: Ipinahahayag ng וּמִן ang pagsalungat sa naunang talata; pinananatili ng “mga anak ni Israel” ang Hebreong anyo at pambansa-etnikong diwa, habang nililinaw ng “ang sinuman sa” ang partitive construction sa natural na Tagalog.
- source_word: לֹא נָתַן ... לַ/עֲבָדִים לִ/מְלַאכְתּוֹ
  choice: hindi ginawang mga alipin ni Solomon para sa kanyang gawain
  rationale: Ang parirala ay tumutukoy sa paglalagay sa katayuan o paggawa ng alipin, hindi lamang sa karaniwang paglilingkod; natural at tuwiran sa Tagalog ang “ginawang mga alipin ... para sa kanyang gawain.”
- source_word: כִּי הֵמָּה אַנְשֵׁי מִלְחָמָה
  choice: sapagkat sila ay mga mandirigma
  rationale: Ang כִּי ay nagbibigay ng dahilan, at ang “mga mandirigma” ay malinaw at likas na katumbas ng Hebreong idyomang “mga lalaki ng digmaan.”
- source_word: שָׂרֵי שָׁלִישָׁיו
  choice: mga opisyal niya
  rationale: Hindi tiyak ang espesipikong ranggo ng שָׁלִישׁ; pinananatili ng malawak na “mga opisyal” ang militar-administratibong diwa nang hindi nagbibigay ng huwad na katiyakan.
- source_word: שָׂרֵי רִכְבּוֹ
  choice: mga pinuno ng kanyang mga karwahe
  rationale: Tumutukoy ito sa mga namamahala sa pangkat ng mga karwaheng pandigma; malinaw ang “mga pinuno” at hindi labis na espesipiko.
- source_word: וּפָרָשָׁיו
  choice: mga mangangabayo
  rationale: Karaniwang modernong Tagalog para sa mga sundalong nakasakay sa kabayo o cavalry, at ang pag-aari ay nauunawaan sa saklaw ng “kanyang” sa magkakaugnay na listahan.
