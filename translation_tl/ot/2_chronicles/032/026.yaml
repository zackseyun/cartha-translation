base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/026.yaml
  text: But Hezekiah humbled himself for the pride of his heart[a], he and the inhabitants of Jerusalem, so the wrath of Yahweh did not come upon them in the days of Hezekiah.
translation:
  language: tl
  text: Ngunit nagpakumbaba si Ezequias dahil sa pagmamataas ng kanyang puso[a]—siya at ang mga naninirahan sa Jerusalem—kaya hindi dumating sa kanila ang poot ni Yahweh noong panahon ni Ezequias.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring ‘tungkol sa pagmamataas ng kanyang puso.’ Literal sa Hebreo: ‘sa/dahil sa kataasan ng kanyang puso,’ isang idyoma para sa kapalaluan o pagmamataas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכָּנַע
  choice: nagpakumbaba
  rationale: 'Ang Niphal na anyo ay may reflexive o middle na diwa sa konteksto: kusang nagpakumbaba si Ezequias bilang tugon sa kanyang kasalanan, hindi lamang siya basta ipinahiya.'
- source_word: בְּגֹבַהּ לִבּוֹ
  choice: dahil sa pagmamataas ng kanyang puso
  rationale: Ang גֹבַהּ ay literal na ‘kataasan,’ ngunit kapag kaugnay ng puso ay tumutukoy sa kapalaluan o pagmamataas. Ang ‘dahil sa’ ay natural na nagpapahayag ng malamang na sanhi, habang itinatala sa talababa ang saklaw ng pang-ukol.
- source_word: הוּא וְיֹשְׁבֵי יְרוּשָׁלִָם
  choice: siya at ang mga naninirahan sa Jerusalem
  rationale: Tahasang isinasama ng emphatic na הוּא si Ezequias sa mga mamamayan; natural at tumpak sa civic na konteksto ang ‘mga naninirahan.’
- source_word: קֶצֶף יְהוָה
  choice: ang poot ni Yahweh
  rationale: Ang קֶצֶף ay matinding galit na kaugnay ng hatol ng Diyos; pinananatili ng ‘poot’ ang bigat nito. Isinasalin ang pangalang יְהוָה bilang ‘Yahweh.’
- source_word: וְלֹא בָא עֲלֵיהֶם
  choice: hindi dumating sa kanila
  rationale: Pinananatili nito ang Hebreong idyoma ng hatol na ‘dumarating sa’ mga tao nang hindi nagdaragdag ng kahulugang wala sa teksto.
- source_word: בִּימֵי יְחִזְקִיָּהוּ
  choice: noong panahon ni Ezequias
  rationale: Natural itong katumbas sa modernong Tagalog ng panahong saklaw ng kanyang buhay o paghahari, nang hindi higit na tinutukoy kung alin sa dalawa.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Tuwirang ginagamit sa Hebreo ang Tetragrammaton. Pinananatili ng ‘Yahweh’ ang natatanging pangalan ng Diyos sa halip na palitan ito ng isang titulo.
- issue: Ugnayan ng pagpapakumbaba at hindi pagdating ng poot
  choice: kaya hindi dumating sa kanila ang poot ni Yahweh
  alternative: at hindi dumating sa kanila ang poot ni Yahweh
  rationale: Sa konteksto, ang sunod na pangyayari ay inilalahad bilang bunga ng pagpapakumbaba. Ang ‘kaya’ ay nagpapalinaw sa lohikal na ugnayan nang hindi sinasabing ganap nang inalis ang hatol; nililimitahan mismo ng teksto ang hindi pagdating nito sa panahon ni Ezequias.
translation_notes:
  register: Gumamit ng natural, kasalukuyan, at marangal na Filipino. Pinili ang ‘Ezequias,’ ang karaniwang anyo ng pangalan sa tradisyong Filipino, at ginamit ang mga gitling upang malinaw na ipakitang kapwa nagpakumbaba ang hari at ang mga naninirahan sa Jerusalem.
