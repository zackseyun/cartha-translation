  text: וַ/יִּשְׁכַּ֨ב יְחִזְקִיָּ֜הוּ עִם אֲבֹתָ֗י/ו וַֽ/יִּקְבְּרֻ/הוּ֮ בְּֽ/מַעֲלֵה֮ קִבְרֵ֣י בְנֵי דָוִיד֒ וְ/כָבוֹד֙ עָֽשׂוּ ל֣/וֹ בְ/מוֹת֔/וֹ כָּל יְהוּדָ֖ה וְ/יֹשְׁבֵ֣י יְרוּשָׁלִָ֑ם וַ/יִּמְלֹ֛ךְ מְנַשֶּׁ֥ה בְנ֖/וֹ תַּחְתָּֽי/ו־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/033.yaml
  text: And Hezekiah slept with his fathers[a], and they buried him in the upper part of the tombs of the sons of David. And all Judah and the inhabitants of Jerusalem honored him at his death, and Manasseh his son reigned in his place.
translation:
  language: tl
  text: At nahimlay si Ezequias kasama ng kanyang mga ninuno, at inilibing nila siya sa mataas na bahagi[a] ng mga libingan ng mga anak ni David.[b] Pinarangalan siya sa kanyang pagkamatay ng buong Juda at ng mga naninirahan sa Jerusalem. At ang anak niyang si Manases ang naghari bilang kapalit niya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “sa paakyat na daan patungo sa.”'
    reason: Pinananatili ang topograpikong kalabuan ng Hebreong מַעֲלֵה, na maaaring mangahulugang mataas na bahagi o paakyat na daan.
  - marker: b
    text: O “mga inapo ni David”; ang “mga anak ni David” dito ay tumutukoy sa maharlikang angkan ni David.
    reason: Nililinaw ang mas malawak na dinastikong gamit ng literal na pariralang Hebreo.
lexical_decisions:
- source_word: וַיִּשְׁכַּב ... עִם אֲבֹתָיו
  choice: nahimlay ... kasama ng kanyang mga ninuno
  rationale: Pinananatili ng “nahimlay” ang magalang na Hebreong eupemismo para sa kamatayan, samantalang natural na ipinahahayag ng “mga ninuno” ang dinastikong saklaw ng אֲבֹתָיו sa makabagong Tagalog.
- source_word: וַיִּקְבְּרֻהוּ
  choice: inilibing nila siya
  rationale: Pinananatili ang aktibong pandiwang maramihan at ang di-tiyak na gumagawa ng kilos sa Hebreo.
- source_word: בְּמַעֲלֵה
  choice: sa mataas na bahagi
  rationale: Ang מַעֲלֵה ay maaaring tumukoy sa mataas na lugar o sa paakyat na daan. Ang pangunahing salin ay umaangkop sa konteksto ng libingan nang hindi nagbibigay ng tiyak na rekonstruksiyong arkitektural; inilalahad sa talababa ang ibang posibilidad.
- source_word: קִבְרֵי בְנֵי דָוִיד
  choice: mga libingan ng mga anak ni David
  rationale: Pinananatili ang literal na dinastikong pananalita ng Hebreo; nililinaw sa talababa na maaari itong tumukoy sa mga inapo ni David o sa maharlikang angkan niya.
- source_word: וְכָבוֹד עָשׂוּ לוֹ
  choice: Pinarangalan siya
  rationale: Natural at tuwirang Tagalog para sa Hebreong idyomang “gumawa ng karangalan para sa kanya.”
- source_word: בְּמוֹתוֹ
  choice: sa kanyang pagkamatay
  rationale: Tumpak na pinananatili ang temporal na kaugnayan sa pampublikong pagpaparangal.
- source_word: כָּל יְהוּדָה וְיֹשְׁבֵי יְרוּשָׁלִָם
  choice: buong Juda at ng mga naninirahan sa Jerusalem
  rationale: Ipinahahayag ang malawak at pampublikong saklaw ng pagpaparangal sa natural na Tagalog.
- source_word: וַיִּמְלֹךְ ... תַּחְתָּיו
  choice: ang naghari bilang kapalit niya
  rationale: Natural na pormula ng paghalili sa trono na pinananatili ang diwa ng paghahari sa lugar ng naunang hari.
theological_decisions:
- issue: Eupemismo para sa kamatayan sa pormula tungkol sa hari
  choice: Panatilihin ang eupemismo sa pamamagitan ng “nahimlay ... kasama ng kanyang mga ninuno.”
  alternative: “namatay”
  rationale: Hindi pinapantay sa karaniwang “namatay” ang nakaugaliang pormulang Hebreo; napapanatili nito ang pampanitikan at dinastikong ugnayan sa mga salaysay tungkol sa mga hari nang hindi ipinahihiwatig ang isang natatanging doktrina tungkol sa kalagayan ng mga patay.
- issue: Saklaw ng “mga anak ni David”
  choice: Panatilihin sa teksto ang literal na “mga anak ni David,” na may paliwanag sa talababa.
  alternative: “mga inapo ni David”
  rationale: Pinananatili nito ang anyo ng Hebreo habang kinikilala sa talababa ang mas malawak na dinastikong kahulugan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “nahimlay” bilang nauunawaang eupemismo sa halip na ang artipisyal na literal na “natulog,” at iniwasan ang labis na arkaikong bokabularyo. Pinanatili ang mga pangalang Ezequias, Juda, David, Jerusalem, at Manases ayon sa karaniwang anyong Tagalog.
