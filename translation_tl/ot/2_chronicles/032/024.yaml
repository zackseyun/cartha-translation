base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/024.yaml
  text: In those days Hezekiah became sick to the point of death[a], and he prayed to Yahweh[b], and he answered him and gave him a sign.
translation:
  language: tl
  text: Noong mga araw na iyon, nagkasakit si Ezequias at nalagay sa bingit ng kamatayan. Nanalangin siya kay Yahweh, at sinagot siya ni Yahweh[a] at binigyan siya ng isang tanda[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literal: “sinabi niya sa kanya.” Ang pandiwang Hebreo ay literal na “sinabi,” ngunit sa kontekstong ito ay tumutukoy ito sa tugon ni Yahweh sa panalangin ni Ezequias.'
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “kababalaghan” o “palatandaan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיָּמִים הָהֵם
  choice: Nang mga araw na iyon
  rationale: Likas na salin ng karaniwang pariralang Hebreo para sa panahong tinutukoy, habang pinananatili ang anyo ng idyoma.
- source_word: חָלָה
  choice: nagkasakit
  rationale: Ipinapahayag ng pandiwa ang pagkakaroon ng karamdaman; malinaw at karaniwan ito sa modernong Filipino.
- source_word: עַד לָמוּת
  choice: nalagay sa bingit ng kamatayan
  rationale: Ipinahihiwatig ng parirala ang karamdamang umabot sa puntong malapit nang mamatay; natural itong pahayag sa Filipino nang hindi sinasabing aktuwal na namatay siya.
- source_word: וַיִּתְפַּלֵּל אֶל יְהוָה
  choice: Nanalangin siya kay Yahweh
  rationale: Ang הִתְפַּלֵּל ang karaniwang pandiwa para sa pananalangin, at ang pangalang tipan na יְהוָה ay tinumbasan bilang Yahweh.
- source_word: וַיֹּאמֶר לוֹ
  choice: sinagot siya nito
  rationale: Literal na ‘sinabi niya sa kanya,’ ngunit sa konteksto ay tugon ni Yahweh sa panalangin ni Ezequias. Pinananatili sa talababa ang mas pormal na alternatibo.
- source_word: מוֹפֵת
  choice: tanda
  rationale: Maaaring tumukoy sa tanda, kababalaghan, o palatandaan. Sa salaysay, ito ay tandang nagpapatibay sa tugon ng Diyos, kaya malinaw at hindi labis na interpretatibo ang ‘tanda.’
- source_word: נָתַן לוֹ
  choice: binigyan
  rationale: Tuwirang katumbas ng נתן na may tumatanggap na tinutukoy ng hulaping panghalip.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Pangalan mismo na יְהוָה ang nasa tekstong Hebreo. Ang ‘Yahweh’ ay tuwirang transliterasyon na pinananatili ang natatanging pangalang tipan nang hindi ito pinapalitan ng titulo.
- issue: Pagkilala sa simuno ng וַיֹּאמֶר לוֹ
  choice: Si Yahweh ang tumugon kay Ezequias
  alternative: Panatilihin lamang ang literal na ‘sinabi niya sa kanya’ nang hindi nililinaw ang simuno
  rationale: Ang pinakamalapit at lohikal na simuno ay si Yahweh, na siyang dinasalan; sinusuportahan din ito ng kasunod na pagbibigay niya ng tanda. Gayunman, itinatala sa talababa ang literal na anyo upang hindi maitago ang leksikal na detalye.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at madaling basahin. Ginamit ang ‘nasa bingit ng kamatayan’ bilang likas na paglalahad ng Hebreong idyoma, at inayos ang mga panandang [a] at [b] upang tumapat sa mismong mga salitang tinatalakay ng bawat talababa.
