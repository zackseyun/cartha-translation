  text: וַֽ/יְדַבְּר֔וּ אֶל אֱלֹהֵ֖י יְרוּשָׁלִָ֑ם כְּ/עַ֗ל אֱלֹהֵי֙ עַמֵּ֣י הָ/אָ֔רֶץ מַעֲשֵׂ֖ה יְדֵ֥י הָ/אָדָֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/019.yaml
  text: And they spoke against the God of Jerusalem as against the gods of the peoples of the earth[b][a], the work of human hands.
translation:
  language: tl
  text: At nagsalita sila laban sa Diyos ng Jerusalem, gaya ng pagsasalita nila laban sa mga diyos ng mga bansa sa daigdig, na gawa ng mga kamay ng tao.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “gawa ng mga kamay ng tao.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבְּרוּ
  choice: nagsalita sila
  rationale: Ang piel ng דבר ay karaniwang nangangahulugang “magsalita.” Hindi isiningit sa pandiwa mismo ang paghamak; ipinahahayag iyon ng pariralang “laban sa” at ng konteksto.
- source_word: אֶל
  choice: laban sa
  rationale: Bagaman karaniwang “sa/patungo sa” ang אֶל, malinaw na mapanlait at salungat ang pagsasalita sa konteksto, kaya natural sa Filipino ang “laban sa.”
- source_word: אֱלֹהֵי יְרוּשָׁלָם
  choice: Diyos ng Jerusalem
  rationale: Ang anyong אֱלֹהֵי ay maaaring magkaroon ng isahang diwa kapag tumutukoy sa Diyos ng Israel; hinihingi rin ng paghahambing sa mga diyos na gawa ng tao ang isahang kahulugan dito.
- source_word: כְּעַל
  choice: gaya ng pagsasalita nila laban sa
  rationale: Ginawang hayag ang ipinahihiwatig na pandiwa upang maging malinaw at natural ang paghahambing sa Filipino habang pinananatili ang mapanlabang diwa ng עַל.
- source_word: אֱלֹהֵי עַמֵּי הָאָרֶץ
  choice: mga diyos ng mga bayan sa lupa
  rationale: Maramihan ang diwa ng אֱלֹהֵי rito. Pinananatili ng “mga bayan sa lupa” ang pagkakaiba ng עַמִּים at אֶרֶץ nang hindi nililimitahan ito sa isang lupain lamang.
- source_word: מַעֲשֵׂה יְדֵי הָאָדָם
  choice: mga gawang kamay ng tao
  rationale: Natural na idyoma ito sa Filipino para sa mga bagay na ginawa ng tao at pinananatili ang tuwirang kaibahan ng Diyos sa mga diyos na nilikha ng tao.
theological_decisions:
- issue: Kung ang pananalita ay “sa” o “laban sa” Diyos ng Jerusalem
  choice: laban sa
  alternative: sa
  rationale: Maaaring literal na isalin ang אֶל bilang “sa,” ngunit ang agarang konteksto ay panunuya at paglapastangan. Ang “laban sa” ang natural na nagpapakita ng pagkapoot nang hindi dinaragdagan ang teolohikal na nilalaman.
- issue: Kung isahan o maramihan ang אֱלֹהֵי יְרוּשָׁלָם
  choice: Diyos ng Jerusalem
  alternative: mga diyos ng Jerusalem
  rationale: Bagaman anyong maramihan ang salita, regular itong ginagamit na may isahang diwa para sa Diyos ng Israel. Inihahambing siya rito sa maraming diyos ng mga bayan, na tahasang inilalarawang gawa ng tao.
- issue: Saklaw ng pariralang “mga gawang kamay ng tao”
  choice: Tumutukoy sa mga diyos ng mga bayan, hindi sa Diyos ng Jerusalem
  alternative: Maaaring ipagbintang sa lahat ng naunang binanggit na mga diyos
  rationale: Sa balarila at argumento ng talata, inilalarawan ng parirala ang mga diyos ng mga bayan bilang mga bagay na ginawa ng tao; ito mismo ang maling paghahambing na ginawa ng mga nagsalita laban sa Diyos ng Jerusalem.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “Diyos” para sa Diyos ng Jerusalem at “mga diyos” para sa mga diyos ng mga bayan. Ang em dash ay nililinaw na ang huling parirala ay paglalarawan sa mga diyos ng mga bayan. Inilagay ang marker [a] sa mismong teksto gaya ng hinihingi.
