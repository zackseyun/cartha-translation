base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/025.yaml
  text: But Hezekiah did not repay according to the benefit done to him[a], because his heart was proud; therefore wrath came upon him and upon Judah and Jerusalem.
translation:
  language: tl
  text: Ngunit hindi tinumbasan ni Ezekias nang nararapat ang kabutihang ginawa sa kanya[a], sapagkat nagmataas ang kanyang puso. Kaya dumating ang poot sa kanya at sa Juda at Jerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “hindi tumugon ayon sa kabutihang ipinakita sa kanya.” Malawak ang saklaw ng pananalitang Hebreo: ang paggawa ng angkop na tugon sa kabutihang tinanggap.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִגְמֻל עָלָיו
  choice: nang nararapat ang kabutihang ginawa sa kanya
  rationale: Ang גְּמוּל sa kontekstong ito ay tumutukoy sa kabutihang tinanggap ni Ezekias, samantalang ipinahihiwatig ng כִּ ang isang tugon na naaayon o katumbas nito. Likas sa modernong Tagalog ang pariralang ito at hindi nito nililimitahan ang pagkukulang sa kawalan lamang ng pasasalamat.
- source_word: הֵשִׁיב
  choice: hindi sinuklian
  rationale: Ang Hiphil ng שׁוב kasama ng גְּמוּל ay nangangahulugang gumawa ng angkop na tugon o ganti. Ang “sinuklian” ay malinaw at natural sa Tagalog at maaaring tumukoy sa anumang nararapat na pagtugon sa kabutihang tinanggap.
- source_word: גָבַהּ לִבּוֹ
  choice: nagmataas ang kanyang puso
  rationale: Pinananatili nito ang larawan ng Hebreo tungkol sa pusong naging mataas habang malinaw na ipinahahayag ang pagmamataas.
- source_word: קֶצֶף
  choice: poot
  rationale: Ang “poot” ay nagpapahayag ng matinding galit at ng bigat ng hatol na nasa konteksto.
- source_word: וַיְהִי עָלָיו קֶצֶף
  choice: dumating ang poot sa kanya
  rationale: Likas na ipinahahayag ng “dumating” ang pagsapit ng hatol nang hindi nagdaragdag ng tahasang pinagmulan na hindi binanggit sa sugnay na Hebreo.
- source_word: יְחִזְקִיָּהוּ
  choice: Ezekias
  rationale: Ginamit ang makabagong anyong Filipino ng pangalan na madaling makilala at malapit sa tradisyong biblikal sa Tagalog.
- source_word: יְהוּדָה וִירוּשָׁלִָם
  choice: Juda at Jerusalem
  rationale: Mga karaniwang anyong Filipino ng mga pangalang pook.
theological_decisions:
- issue: Saklaw ng pagkukulang ni Ezekias bilang tugon sa kabutihang tinanggap
  choice: Hindi niya sinuklian nang nararapat ang kabutihang ginawa sa kanya, nang hindi tinutukoy ang isang natatanging kilos lamang.
  alternative: Hindi siya nagpasalamat para sa kabutihang ginawa sa kanya.
  rationale: Mas malawak ang pananalita ng Hebreo kaysa sa pasasalamat lamang. Pinananatili ng salin ang moral na pagtatasa ngunit hindi nito pinapakitid ang kahulugan.
- issue: Pinagmulan ng poot
  choice: Iniwan na hindi tahasang pinangalanan ang pinagmulan ng poot.
  alternative: Dumating sa kanila ang poot ng PANGINOON.
  rationale: Bagaman malinaw sa konteksto na banal ang poot, walang tahasang paksa o pangalang banal sa sugnay na ito. Pinananatili ng salin ang pagkakabuo at pag-igting ng orihinal.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “sinuklian” sa positibong diwa ng angkop na pagtugon, at pinanatili ang idyomang “nagmataas ang kanyang puso” upang mapanatili ang larawan at diin ng Hebreo.
