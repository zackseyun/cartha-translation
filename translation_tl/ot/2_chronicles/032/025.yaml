  terminology: Ang mga pangalang Ezekias, Juda, at Jerusalem ay angkop. Ang "poot" ay sapat na matindi para sa קֶצֶף, at ang "nagmataas ang kanyang puso" ay matapat na modernong paglalarawan ng idyoma.
  issues:
