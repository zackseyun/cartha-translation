  source_fidelity: 'Tumpak na naipapahayag ng draft ang malawak na diwa ng Hebreong כִּגְמֻל עָלָיו הֵשִׁיב: hindi gumawa si Ezekias ng tugong katumbas ng kabutihang natanggap niya. Napananatili rin nito ang idyoma ng pusong nagmataas at ang hindi tahasang pagtukoy sa pinagmulan ng poot.'
