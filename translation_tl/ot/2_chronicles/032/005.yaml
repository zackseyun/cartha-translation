  to: Nagpakatatag si Hezekias at muling itinayo ang lahat ng nasirang bahagi ng pader. Itinaas niya ito hanggang sa mga tore,[a] at nagtayo siya ng isa pang pader sa labas. Pinatibay niya ang Milo[b] ng Lungsod ni David, at gumawa siya ng napakaraming sandata[c] at kalasag.
