base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/005.yaml
  text: And he strengthened himself[a], and built up all the wall that was broken down, and raised it up to the towers, and outside he built another wall, and he strengthened the Millo of the city of David[b], and made weapons and shields in abundance.
translation:
  language: tl
  text: Nagpakatatag si Hezekias at muling itinayo ang lahat ng nasirang bahagi ng pader. Itinaas niya ito hanggang sa mga tore,[a] at nagtayo siya ng isa pang pader sa labas. Pinatibay niya ang Milo[b] ng Lungsod ni David, at gumawa siya ng napakaraming sandata[c] at kalasag.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “nagtayo siya ng mga tore sa ibabaw nito.” Siksik at hindi ganap na tiyak ang pagkakabuo ng pariralang Hebreo.
    reason: textual_or_syntactic_ambiguity
  - marker: b
    text: Ang “Milo” ay maaaring mangahulugang “bunton,” “tambak,” o “teras,” at malamang na isang pinatibay na tambak ng lupa o estrukturang pansuporta sa Jerusalem.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “mga sandatang inihahagis,” “mga sibat,” o “mga suligi.” Mas malawak ang kahulugan ng salitang Hebreo kaysa sa isang partikular na uri ng sandata.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְחַזַּק
  choice: Nagpakatatag si Hezekias
  rationale: Ipinahahayag ng Hitpael ng חזק ang mapagpasyang pagpapatatag ng sarili. Natural sa makabagong Filipino ang “nagpakatatag,” at hindi nito nililimitahan ang diwa sa lakas ng loob lamang.
- source_word: וַיִּבֶן אֶת כָּל הַחוֹמָה הַפְּרוּצָה
  choice: muling itinayo ang buong pader na gumuho
  rationale: Sa konteksto, ang בנה ay pagkukumpuni o muling pagtatayo ng nasirang tanggulan, at ang הַפְּרוּצָה ay tumutukoy sa pader na nabutas, nagiba, o nagkaroon ng siwang.
- source_word: וַיַּעַל עַל הַמִּגְדָּלוֹת
  choice: Itinaas niya ito hanggang sa mga tore
  rationale: Siksik at mahirap ang Hebreong parirala. Pinananatili ng salin ang pader bilang ipinapalagay na layon at iniiwasang gawing tiyak sa pangunahing teksto ang alternatibong pagbasa na nagtayo siya ng mga tore sa ibabaw nito.
- source_word: וְלַחוּצָה הַחוֹמָה אַחֶרֶת
  choice: nagtayo siya ng isa pang pader sa labas
  rationale: Ipinahihiwatig ng לַחוּצָה ang panlabas na bahagi; likas sa Filipino na ulitin ang pandiwang “nagtayo” na ipinahihiwatig ng konteksto.
- source_word: וַיְחַזֵּק אֶת הַמִּלּוֹא עִיר דָּוִיד
  choice: Pinatibay niya ang Milo sa Lungsod ni David
  rationale: Ang מִלּוֹא ay isang teknikal na tawag sa isang estruktura o lugar sa Jerusalem na hindi tiyak ang eksaktong anyo. Pinananatili ang pangalang “Milo” upang maiwasan ang maling katiyakan.
- source_word: שֶׁלַח
  choice: sandata
  rationale: Malawak ang saklaw ng salitang Hebreo at maaaring tumukoy sa mga sandatang inihahagis o ipinapana. Ang “sandata” ay hindi labis na nagpapatiyak sa isang partikular na uri.
- source_word: לָרֹב וּמָגִנִּים
  choice: napakaraming sandata at kalasag
  rationale: Natural na ipinahahayag ng “napakarami” ang masaganang bilang na tinutukoy ng לָרֹב, at “kalasag” ang karaniwang makabagong katumbas ng מָגֵן.
