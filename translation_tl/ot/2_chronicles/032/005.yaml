translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Hezekias” at “Lungsod ni David” bilang madaling makilalang anyo ng mga pangalan. Pinanatili ang “Milo” bilang makasaysayang katawagan, habang ipinaliwanag sa talababa ang posibleng kahulugan. Ang tatlong talababa ay nakamarka sa pangunahing teksto bilang [a], [b], at [c].
