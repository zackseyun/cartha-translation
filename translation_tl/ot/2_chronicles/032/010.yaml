  text: 'Ganito ang sabi ni Senakerib, hari ng Asiria: “Ano ang pinagtitiwalaan ninyo at nananatili kayo sa Jerusalem habang kinukubkob ang lungsod?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: Ganito ang sinabi
  rationale: Likas at marangal na katumbas ng pormulang Hebreo na nagpapakilala sa mismong pahayag ng nagsasalita.
- source_word: עַל מָה אַתֶּם בֹּטְחִים
  choice: Ano ang pinagtitiwalaan ninyo
  rationale: Pinananatili ang tanong tungkol sa saligan o bagay ng kanilang pagtitiwala nang hindi dinaragdagan kung sino o ano iyon.
- source_word: וְיֹשְׁבִים בְּמָצוֹר בִּירוּשָׁלִָם
  choice: at nananatili kayo sa Jerusalem habang kinukubkob ito
  rationale: Ang יֹשְׁבִים ay ipinahayag bilang pananatili, at ang בְּמָצוֹר bilang kalagayan ng pagkubkob; natural ito sa Filipino at hindi nagpapahiwatig na sila ang kumukubkob.
