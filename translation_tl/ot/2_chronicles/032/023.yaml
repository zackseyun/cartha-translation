source:
  edition: WLC
  text: וְ֠/רַבִּים מְבִיאִ֨ים מִנְחָ֤ה לַ/יהוָה֙ לִ/יר֣וּשָׁלִַ֔ם וּ/מִ֨גְדָּנ֔וֹת לִֽ/יחִזְקִיָּ֖הוּ מֶ֣לֶךְ יְהוּדָ֑ה וַ/יִּנַּשֵּׂ֛א לְ/עֵינֵ֥י כָל הַ/גּוֹיִ֖ם מֵ/אַֽחֲרֵי כֵֽן־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/023.yaml
  text: And many were bringing an offering to Yahweh in Jerusalem[a], and choice gifts to Hezekiah king of Judah[b], and after this he was exalted in the sight of all the nations.
translation:
  language: tl
  text: Marami ang nagdadala ng handog kay Yahweh sa Jerusalem[a], at ng mahahalagang regalo kay Hezekias, na hari ng Juda[b]. Pagkatapos nito, mataas ang pagtingin sa kaniya ng lahat ng bansa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “patungo sa Jerusalem” o “sa Jerusalem.” Maaaring ipahiwatig ng pang-ukol sa Hebreo ang patutunguhan o ang kinaroroonan sa kontekstong ito.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “mga piling regalo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: רַבִּים
  choice: marami
  rationale: Ginamit ang pang-uri bilang pangngalan para tumukoy sa maraming tao; likas at maikli sa Tagalog ang “marami.”
- source_word: מְבִיאִים
  choice: patuloy na nagdadala
  rationale: Ang participle sa salaysay ay nagpapahiwatig ng nagpapatuloy o paulit-ulit na kilos, hindi lamang isang minsanang pagdadala.
- source_word: מִנְחָה
  choice: handog
  rationale: Maaari itong mangahulugang regalo o tributo, ngunit dahil si Yahweh ang tumatanggap, ang pangkultong diwang “handog” ang pinakaangkop nang hindi nililimitahan ang uri nito.
- source_word: לַיהוָה
  choice: kay Yahweh
  rationale: Tahasang isinalin ang tipang pangalan na יהוה bilang “Yahweh”; ipinakikita ng pang-ukol na siya ang tumatanggap ng handog.
- source_word: לִירוּשָׁלִַם
  choice: sa Jerusalem
  rationale: Pinananatili ng “sa” ang posibleng diwang patutunguhan o kinaroroonan ng Hebreong pang-ukol at natural ito sa Tagalog.
- source_word: מִגְדָּנוֹת
  choice: mahahalagang regalo
  rationale: Tumutukoy ito sa mga piling o mamahaling bagay na inihahandog bilang regalo; hindi ito pinakikitid sa mga pagkain lamang.
- source_word: לִיחִזְקִיָּהוּ מֶלֶךְ יְהוּדָה
  choice: kay Hezekias na hari ng Juda
  rationale: Malinaw na ipinakikita si Hezekias bilang tumatanggap at ang “hari ng Juda” bilang paglalarawan sa kaniya.
- source_word: וַיִּנַּשֵּׂא
  choice: lubos siyang pinarangalan
  rationale: Ang Niphal ay nagsasaad ng pagtaas sa katayuan o reputasyon. Ang “pinarangalan” ay natural sa konteksto ng pagkilala ng mga bansa, samantalang ang “lubos” ay nagpapahayag ng pagtaas nang hindi ipinapasok ang pagmamataas.
- source_word: לְעֵינֵי כָל הַגּוֹיִם
  choice: sa paningin ng lahat ng bansa
  rationale: Pinananatili nito ang Hebreong idyoma ng hayag na pagkilala o pagtatangi ng mga bansa.
- source_word: מֵאַחֲרֵי כֵן
  choice: pagkatapos nito
  rationale: Natural at tumpak na panandang temporal na inuugnay ang pagkilala kay Hezekias sa naunang mga pangyayari.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Nasa teksto ang mismong Tetragrammaton; pinananatili ng “Yahweh” ang natatanging tipang pangalan sa halip na palitan ito ng titulo.
- issue: Kahulugan ng pagtaas kay Hezekias sa וַיִּנַּשֵּׂא
  choice: lubos siyang pinarangalan
  alternative: siya ay itinaas; naging mataas ang tingin sa kaniya
  rationale: Inilalarawan ng anyong pasibo ang pagtaas ng kaniyang katayuan sa harap ng mga bansa. Hindi ito isinalin bilang espirituwal na pagmamataas, sapagkat hindi iyon tahasang sinasabi sa sugnay na ito.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “patuloy na nagdadala” upang ihayag ang durative na participle, at hinati sa dalawang pangungusap upang maging natural ang mahabang Hebreong koordinasyon nang hindi binabago ang ugnayan ng mga sugnay.
