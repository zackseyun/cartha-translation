revisions:
- from: At marami ang patuloy na nagdadala ng handog kay Yahweh sa Jerusalem[a], at ng mahahalagang regalo kay Hezekias na hari ng Juda[b]. Pagkatapos nito, lubos siyang pinarangalan sa paningin ng lahat ng bansa.
  to: Marami ang nagdadala ng handog kay Yahweh sa Jerusalem[a], at ng mahahalagang regalo kay Hezekias, na hari ng Juda[b]. Pagkatapos nito, mataas ang pagtingin sa kaniya ng lahat ng bansa.
  rationale: Inalis ang hindi kinakailangang pambungad na pangatnig at ang “patuloy na,” na maaaring magbigay ng mas malakas na aspektuwal na diin kaysa kinakailangan. Pinalitan ang “lubos siyang pinarangalan” ng “mataas ang pagtingin sa kaniya,” isang likas na Filipino na naghahatid ng pagtaas ng reputasyon sa paningin ng mga bansa nang walang dagdag na antas ng tindi. Nilinaw rin ang apposition sa pamamagitan ng kuwit sa “Hezekias, na hari ng Juda.”
