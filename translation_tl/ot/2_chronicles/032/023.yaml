  terminology: Ang “Yahweh,” “handog,” “Hezekias,” at “Juda” ay angkop. Ang “mahahalagang regalo” ay katanggap-tanggap para sa מִגְדָּנוֹת; pinananatili ng talababa ang alternatibong “mga piling regalo.”
