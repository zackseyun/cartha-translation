  yaml_path: translation/ot/2_chronicles/032/003.yaml
  text: And he consulted with his officials and his mighty men about stopping up the waters of the springs that were outside the city[a], and they helped him.
translation:
  language: tl
  text: Sumangguni siya sa kanyang mga pinuno at magigiting na mandirigma tungkol sa pagharang sa tubig ng mga bukal na nasa labas ng lungsod,[a] at tinulungan nila siya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Sumangguni siya sa kanyang mga pinuno at magigiting na mandirigma upang harangan ang tubig ng mga bukal sa labas ng lungsod.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּוָּעַץ
  choice: Sumangguni siya
  rationale: Ang Niphal ng יעץ ay tumutukoy sa paghingi o pakikipagpalitan ng payo. Likas at malinaw sa modernong Filipino ang “sumangguni,” at pinananatili nito ang sama-samang pagpapasya.
- source_word: שָׂרָיו
  choice: kanyang mga pinuno
  rationale: Maaaring tumukoy ang שַׂר sa opisyal, tagapamahala, pinuno, o kumander. Ang “mga pinuno” ay angkop sa malawak na administratibo at militar na konteksto nang hindi nagpapahiwatig na mga prinsipe sila.
- source_word: גִבֹּרָיו
  choice: magigiting na mandirigma
  rationale: Ang גִּבּוֹר ay maaaring mangahulugang makapangyarihang lalaki o mandirigma. Inihahayag ng “magigiting na mandirigma” ang malamang na militar na diwa sa natural na Filipino.
- source_word: לִסְתּוֹם
  choice: tungkol sa pagharang
  rationale: Ang pawatas ay maaaring maglahad ng nilalaman o layunin ng pagsangguni. Ang “tungkol sa pagharang” ay natural kasunod ng “sumangguni” at inilalarawan ang pisikal na pagpigil sa daloy o pagkuha ng tubig.
- source_word: מֵימֵי הָעֲיָנוֹת
  choice: tubig ng mga bukal
  rationale: Tuwirang ipinahahayag ng parirala ang tubig na nagmumula sa mga bukal; malinaw at karaniwan ang “tubig ng mga bukal” sa heograpikal na konteksto.
- source_word: אֲשֶׁר מִחוּץ לָעִיר
  choice: na nasa labas ng lungsod
  rationale: Malinaw nitong inilalagay ang mga bukal sa labas ng hangganan ng lungsod.
- source_word: וַיַּעְזְרֻהוּ
  choice: at tinulungan nila siya
  rationale: Tuwirang kahulugan ng עזר na may panghalip na isahan ang pagbibigay nila ng tulong sa kanya; bumabalik ang maramihang simuno sa mga pinuno at mandirigma.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at madaling maunawaan. Ginamit ang “lungsod” at “mga bukal” bilang likas na mga katumbas, at pinanatili sa talababa ang posibilidad na layunin, sa halip na paksa lamang, ang ipinahahayag ng pawatas.
