  to: Si Hezekias mismo ang bumara sa itaas na labasan ng tubig ng Gihon[a] at itinuwid niya ang daloy nito[b] pababa, patungong kanluran, sa Lunsod ni David. Nagtagumpay si Hezekias sa lahat ng kanyang gawain.
