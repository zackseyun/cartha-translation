base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/030.yaml
  text: It was Hezekiah who stopped up the upper outlet of the waters of Gihon and directed them down to the west side of the city of David[b][a]. And Hezekiah prospered in all his work.
translation:
  language: tl
  text: Si Hezekias mismo ang bumara sa itaas na labasan ng tubig ng Gihon[a] at itinuwid niya ang daloy nito[b] pababa, patungong kanluran, sa Lunsod ni David. Nagtagumpay si Hezekias sa lahat ng kanyang gawain.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “itaas na bukal ng Gihon.” Ang salitang Hebreo ay maaaring tumukoy sa bukana na nilalabasan ng tubig o, sa mas malawak na diwa, sa bukal o sa mismong pagdaloy nito.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “pinadaloy niya ito” o “pinatuwid niya ang daloy nito.” Ipinahihiwatig ng pandiwang Hebreo ang pagpapadaloy ng tubig sa tuwid o itinakdang direksiyon.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוּא יְחִזְקִיָּהוּ
  choice: Si Hezekias mismo ang
  rationale: Ipinahahayag ng panghalip na sinusundan ng pangalan ang pagdidiin sa simuno; likas sa modernong Tagalog ang hulma na “Si Hezekias mismo ang.”
- source_word: סָתַם
  choice: humarang
  rationale: Tumutukoy ang pandiwa sa pagsasara o pagbara sa isang bukana. Ang “humarang” ay malinaw sa konteksto ng pagpigil sa dating labasan ng tubig.
- source_word: מוֹצָא מֵימֵי גִיחוֹן הָעֶלְיוֹן
  choice: itaas na labasan ng tubig ng Gihon
  rationale: Pinananatili nito ang ideya ng bukana o lugar na nilalabasan ng tubig at ang topograpikong paglalarawang “itaas,” nang hindi tiyakang ipinapakahulugan na buong bukal ang tinutukoy.
- source_word: וַיַּישְּׁרֵם
  choice: itinuwid niya ang daloy nito
  rationale: Ang causative na anyo ng ישר ay nagpapahiwatig ng pagpapadaan sa tuwid o itinakdang ruta. Ang salin ay natural sa konteksto ng gawaing patubig habang pinananatili ang larawan ng sadyang pag-aayos ng daloy.
- source_word: לְמַטָּה מַּעְרָבָה לְעִיר דָּוִיד
  choice: pababa sa gawing kanluran ng Lunsod ni David
  rationale: Naipapakita nito kapwa ang pababang direksiyon at ang lokasyong pakanluran na kaugnay ng Lunsod ni David, nang hindi ipinahihiwatig na ang tubig ay basta lamang dumaloy papasok sa lungsod.
- source_word: וַיַּצְלַח ... בְּכָל מַעֲשֵׂהוּ
  choice: Nagtagumpay ... sa lahat ng kanyang ginawa
  rationale: Saklaw ng וַיַּצְלַח ang pagtatagumpay o pag-unlad sa mga gawain. Ang “lahat ng kanyang ginawa” ay natural na kolektibong pagpapahayag sa Tagalog para sa isahang מַעֲשֵׂהוּ.
