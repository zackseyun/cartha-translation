translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “Lunsod ni David” bilang nakasanayang pangalang pantangi, at pinanatili ang diin kay Hezekias at ang bahagyang kalabuan tungkol sa eksaktong anyo ng labasan at paraan ng pagdadala sa tubig.
