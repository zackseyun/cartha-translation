base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/032.yaml
  text: The rest of the acts of Hezekiah and his faithful deeds—behold[a], they are written in the vision of Isaiah son of Amoz, the prophet, in the Book of the Kings of Judah and Israel.
translation:
  language: tl
  text: Ang iba pang mga ginawa ni Ezequias at ang kanyang mga gawa ng katapatan—narito[a], nakasulat ang mga ito sa pangitain ni Isaias na anak ni Amoz, ang propeta, sa Aklat ng mga Hari ng Juda at Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “tunay ngang.” Ang salitang Hebreo ay pantawag-pansin sa kasunod na pahayag.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי
  choice: Ang iba pang mga ginawa
  rationale: Sa pormulang pangkasaysayan tungkol sa mga hari, ang דִּבְרֵי ay tumutukoy sa mga ginawa o pangyayari sa pamumuno, hindi lamang sa mga salitang binigkas. Likas sa modernong Tagalog ang “iba pang mga ginawa.”
- source_word: יְחִזְקִיָּהוּ
  choice: Ezequias
  rationale: Ginamit ang tradisyonal at madaling makilalang anyo ng pangalan sa Bibliyang Tagalog.
- source_word: וַחֲסָדָיו
  choice: at ang kanyang mga gawa ng katapatan
  rationale: Ang חֶסֶד dito ay tumutukoy sa mga kilos na may katapatan o matapat na loob. Pinananatili ng parirala ang moral at panrelasyong diwa nang hindi ipinapalagay na teknikal na katawagan ito para sa tipan.
- source_word: הִנָּם
  choice: masdan, ... ang mga iyon
  rationale: Ang presentational particle ay tumatawag ng pansin sa kasunod na pahayag. Ang “masdan” ay marangal at mas malapit sa retorikal na diin kaysa sa ganap na pag-aalis nito.
- source_word: כְּתוּבִים
  choice: nakasulat
  rationale: Tuwirang katumbas ng pasibong anyong nangangahulugang nakasulat o naitala.
- source_word: בַּחֲזוֹן
  choice: sa pangitain
  rationale: Pinananatili ang pangunahing kahulugan ng חָזוֹן sa halip na ipakahulugang “talaan” o “hula.”
- source_word: יְשַׁעְיָהוּ בֶן אָמוֹץ הַנָּבִיא
  choice: ni propeta Isaias na anak ni Amoz
  rationale: Natural na ayos sa Tagalog na pinananatili kapwa ang tungkulin at ang angkan ng propeta.
- source_word: עַל סֵפֶר מַלְכֵי יְהוּדָה וְיִשְׂרָאֵל
  choice: sa Aklat ng mga Hari ng Juda at Israel
  rationale: Sa pormulang bibliograpiko, natural na ipinahihiwatig ng “sa” na ang binanggit na pangitain o tala ay matatagpuan o kaugnay ng pinangalanang aklat. Ang “Aklat” ay pinanatili sa halip na mas interpretatibong “mga talaan.”
theological_decisions:
- issue: Diwa ng חֶסֶד kapag tumutukoy sa mga ginawa ni Ezequias
  choice: mga gawa ng katapatan
  alternative: mga gawa ng katapatan sa tipan; mabubuting gawa; mga gawang nagpapakita ng tapat na loob
  rationale: Ipinahahayag nito ang tapat at mabuting pagkilos ng hari ngunit hindi nito sapilitang ginagawang teknikal na pagtukoy sa tipan ang salita.
translation_notes:
  register: Modernong Filipino na may marangal na himig na angkop sa pangwakas na tala tungkol sa isang hari. Pinanatili ang “pangitain” at ang pantawag-pansing “masdan” upang hindi mapawi ang anyo at diin ng Hebreo.
