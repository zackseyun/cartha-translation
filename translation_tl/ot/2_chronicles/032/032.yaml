  source_fidelity: Tumpak na naihahatid ng draft ang pormulang pangkasaysayan na “iba pang mga ginawa,” ang magkahiwalay na pagtukoy sa mga gawa ni Ezequias at sa kaniyang חֲסָדִים, ang pantawag-pansing הִנָּם, at ang mga sanggunian sa pangitain ni Isaias at sa Aklat ng mga Hari. Gayunman, ang pagkakalagay ng “masdan” sa loob ng pangungusap ay hindi likas sa modernong Tagalog.
