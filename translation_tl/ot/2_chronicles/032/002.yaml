lexical_decisions:
- source_word: וַיַּרְא
  choice: Nang makita
  rationale: Pinananatili ang karaniwang diwa ng ראה sa salaysay, habang natural na iniuugnay sa kasunod na nilalaman ng napansin ni Hezekias.
- source_word: כִּי
  choice: na
  rationale: Ipinakikilala nito ang nilalaman ng nakita o napagtanto ni Hezekias.
- source_word: בָא
  choice: dumating na
