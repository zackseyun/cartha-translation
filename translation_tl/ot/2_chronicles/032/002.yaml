- source_word: לַמִּלְחָמָה
  choice: makipagdigma
  rationale: Natural na salin ng layuning pumasok sa digmaan, nang hindi pinahihina ang puwersang militar ng parirala.
- source_word: עַל
  choice: laban sa
  rationale: Ipinahahayag ang mapanlabang direksiyon ng digmaan patungo sa lungsod.
- source_word: יְרוּשָׁלִָם
  choice: Jerusalem
  rationale: Karaniwang anyo ng pangalan ng lugar sa modernong Filipino.
