revisions:
- from: At nagsugo ang PANGINOON ng isang anghel, na lumipol sa bawat makapangyarihang mandirigma, pinuno, at opisyal sa kampo ng hari ng Asiria. Kaya bumalik ang hari sa sarili niyang lupain na kahihiyan ang nasa mukha. Nang pumasok siya sa templo ng kanyang diyos, pinaslang siya roon sa pamamagitan ng espada ng ilan sa sarili niyang mga anak.[a]
  to: At nagsugo ang PANGINOON ng isang anghel, na lumipol sa bawat makapangyarihang mandirigma, pinuno, at opisyal sa kampo ng hari ng Asiria. Kaya bumalik siya sa sarili niyang lupain na puno ng kahihiyan. Nang pumasok siya sa templo ng kanyang diyos, doon siya pinaslang sa pamamagitan ng espada ng ilan sa sarili niyang mga supling.[a]
  rationale: Inayos ang idyomang tumutukoy sa kahihiyan tungo sa likas na Filipino at muling inayos ang huling sugnay upang malinaw na ang sariling mga supling ng hari ang pumatay sa kanya gamit ang espada. Pinalitan ang “mga anak” ng mas maingat na “mga supling,” na mas malapit sa saklaw ng Hebreong idyoma.
