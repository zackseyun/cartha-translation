base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/021.yaml
  text: And the LORD sent an angel, who wiped out every mighty warrior, commander, and officer in the camp of the king of Assyria. So he returned to his own land with shame on his face. And when he entered the house of his god, some of those who came from his own body struck him down there with the sword.
translation:
  language: tl
  text: At nagsugo ang PANGINOON ng isang anghel, na lumipol sa bawat makapangyarihang mandirigma, pinuno, at opisyal sa kampo ng hari ng Asiria. Kaya bumalik siya sa sarili niyang lupain na puno ng kahihiyan. Nang pumasok siya sa templo ng kanyang diyos, doon siya pinaslang sa pamamagitan ng espada ng ilan sa sarili niyang mga supling.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “ilan sa mga lumabas mula sa kanyang mga laman-loob,” isang idyoma para sa sarili niyang mga supling.
    reason: Nililinaw ang matalinghagang pahayag ng orihinal at ipinakikita ang batayan ng saling “mga supling.”
lexical_decisions:
- source_word: מַלְאָךְ
  choice: anghel
  rationale: Bagaman maaari itong mangahulugang mensahero, sa kontekstong ito ang sugo ng PANGINOON na lumilipol sa hukbo ay likas at malinaw na isinasaling “anghel.”
- source_word: וַיַּכְחֵד
  choice: lumipol
  rationale: Ipinahahayag ng pandiwa ang ganap na pag-aalis o paglipol; ang “lumipol” ay natural at matindi nang hindi nagdaragdag ng detalye.
- source_word: גִּבּוֹר חַיִל
  choice: makapangyarihang mandirigma
  rationale: Pinananatili ang diwa ng lakas at kahusayan sa pakikidigma.
- source_word: נָגִיד וְשָׂר
  choice: pinuno, at opisyal
  rationale: Pinananatili ang dalawang magkaibang tungkulin kahit may bahagyang pagsasanib ang saklaw ng mga terminong Hebreo.
- source_word: בְּבֹשֶׁת פָּנִים
  choice: na kahihiyan ang nasa mukha
  rationale: Malapit sa konkretong idyomang Hebreo at nauunawaan sa modernong Filipino.
- source_word: בֵּית אֱלֹהָיו
  choice: templo ng kanyang diyos
  rationale: Sa kontekstong panrelihiyon, ang literal na “bahay ng kanyang diyos” ay natural na tumutukoy sa templo.
- source_word: מֵעָיו
  choice: sarili niyang mga anak
  rationale: Literal na “mula sa kanyang mga laman-loob,” isang Hebreong pahayag para sa sariling supling; “mga anak” ang malinaw at natural na katumbas.
- source_word: הִפִּילֻהוּ בֶחָרֶב
  choice: pinaslang siya ... sa pamamagitan ng espada
  rationale: Ipinakikita ang nakamamatay na pag-atake at pinananatili ang tahasang sandatang binanggit.
theological_decisions:
- issue: Pangalan ng Diyos, יהוה
  choice: PANGINOON
  alternative: Yahweh
  rationale: Ginagamit ang tradisyonal at madaling makilalang representasyon sa malaking titik, nang hindi binabago ang pagkakakilanlan ng banal na pangalan.
- issue: Pagkakakilanlan ng מַלְאָךְ
  choice: isang anghel
  alternative: isang mensahero
  rationale: Ang konteksto ng makapangyarihang gawa ng sugo ng PANGINOON ay sumusuporta sa “anghel,” ngunit hindi dinaragdagan ng anumang paliwanag tungkol sa kalikasan o ranggo nito.
- issue: Pagkakakilanlan ng pumatay sa hari
  choice: ilan sa sarili niyang mga anak
  alternative: ilan sa kanyang sariling mga supling
  rationale: Ipinakikita ng idyomang Hebreo na mga pisikal na supling niya ang tinutukoy. Hindi tinutukoy ng talata ang mga pangalan o motibo nila.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit tuwiran. Ginamit ang “PANGINOON” para sa banal na pangalan at “Asiria” bilang karaniwang anyong Filipino. Nilinaw ang panghalip sa ikalawang pangungusap bilang “ang hari” upang maiwasang mapagkamalang ang anghel ang bumalik, nang hindi nagdaragdag ng bagong tauhan.
