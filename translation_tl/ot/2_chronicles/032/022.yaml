  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יּוֹשַׁע֩ יְהוָ֨ה אֶת יְחִזְקִיָּ֜הוּ וְ/אֵ֣ת יֹשְׁבֵ֣י יְרוּשָׁלִַ֗ם מִ/יַּ֛ד סַנְחֵרִ֥יב מֶֽלֶךְ אַשּׁ֖וּר וּ/מִ/יַּד כֹּ֑ל וַֽ/יְנַהֲלֵ֖/ם מִ/סָּבִֽיב־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/022.yaml
  text: So Yahweh saved Hezekiah and the inhabitants of Jerusalem from the hand of Sennacherib king of Assyria and from the hand of all others[b][a], and he guided them on every side.
translation:
  language: tl
  text: Kaya iniligtas ni Yahweh si Ezequias at ang mga naninirahan sa Jerusalem mula sa kamay ni Senaquerib na hari ng Asiria at mula sa kamay ng lahat ng iba pa,[a] at pinatnubayan niya sila sa lahat ng dako.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “at mula sa kamay ng lahat.” Hindi tinutukoy ng Hebreo kung sino o ano ang saklaw ng “lahat”; malamang na tumutukoy ito sa lahat ng iba pang kaaway o mapanlabang kapangyarihan.
    reason: lexical_alternative
  - marker: b
    text: O, “at inakay niya sila sa palibot.” Nauunawaan naman ng ilan ang parirala bilang pagbibigay sa kanila ng katiwasayan sa lahat ng panig.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיּוֹשַׁע
  choice: iniligtas
  rationale: Ang pandiwang mula sa ישׁע ay tumutukoy sa pagsagip o pagliligtas. Likas sa modernong Tagalog ang “iniligtas” at pinananatili nito ang bigat ng pagkilos ng Diyos nang hindi nililimitahan sa tagumpay militar.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinalin bilang personal na pangalan ng Diyos sa halip na palitan ng isang titulo.
- source_word: יֹשְׁבֵי יְרוּשָׁלִַם
  choice: ang mga naninirahan sa Jerusalem
  rationale: Tuwirang ipinahahayag ng participial construction ang mga taong nakatira sa Jerusalem; natural at malinaw ito sa kasalukuyang Tagalog.
- source_word: מִיַּד
  choice: mula sa kamay ng
  rationale: Pinananatili ang larawang Hebreo ng pagliligtas mula sa kamay, kapangyarihan, o kontrol ng isang kaaway; nauunawaan din ito sa Tagalog.
- source_word: סַנְחֵרִיב מֶלֶךְ אַשּׁוּר
  choice: Senaquerib na hari ng Asiria
  rationale: Ginamit ang nakaugaliang Tagalog na anyo ng mga pangalang biblikal at pinanatili ang pamagat ng hari.
- source_word: וּמִיַּד כֹּל
  choice: at mula sa kamay ng lahat ng iba pa
  rationale: Walang tahasang layon ang כֹּל. Ipinahihiwatig ng konteksto ang lahat ng iba pang kalaban o kapangyarihang mapanlaban, ngunit inilalagay sa talababa ang literal na alternatibo upang mapanatili ang pagkaelliptical ng Hebreo.
- source_word: וַיְנַהֲלֵם
  choice: at pinatnubayan niya sila
  rationale: Ang נהל ay karaniwang nangangahulugang umakay o pumatnubay. Ang “pinatnubayan” ay marangal at likas sa tekstong biblikal, at hindi nito ginagawang tahasang “binigyan ng kapahingahan” ang maaaring implikasyon lamang.
- source_word: מִסָּבִיב
  choice: sa lahat ng dako
  rationale: Ipinahahayag ang saklaw sa palibot nila. Malinaw ito sa Tagalog habang pinananatili sa talababa ang mas literal na posibilidad na tumutukoy sa pag-akay sa palibot.
theological_decisions:
- issue: Paglalahad sa pangalang יהוה
  choice: Yahweh
  alternative: Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo, kaya pinanatili ito bilang Yahweh sa halip na palitan ng isang titulong gaya ng “PANGINOON.”
- issue: Kahulugan ng וַיְנַהֲלֵם מִסָּבִיב
  choice: at pinatnubayan niya sila sa lahat ng dako
  alternative: at inakay niya sila sa palibot; at binigyan niya sila ng katiwasayan sa lahat ng panig
  rationale: Mas tuwirang sinusuportahan ng נהל ang pag-akay o pagpapatnubay. Maaaring ipahiwatig ng parirala ang pag-iingat o katiwasayan sa lahat ng panig, ngunit hindi iyon ginawang tahasang pahayag sa pangunahing teksto.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Pinanatili ang idyomang “mula sa kamay” dahil nauunawaan ito at taglay nito ang larawan ng pinagmulang teksto. Ginamit ang “pinatnubayan” upang ilahad ang leksikal na diwa nang hindi tahasang nilulutas ang posibilidad ng proteksiyon o katiwasayan.
