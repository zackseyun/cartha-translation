  source_fidelity: 'Tapat ang salin sa Hebreo: naitalaga ang mga pinunong militar na mamahala sa mga tao, tinipon sila ni Hezekias sa pampublikong liwasan na kaugnay ng pintuan ng lungsod, at nagsalita siya sa paraang nagpapalakas ng loob bilang panimula sa kasunod na pananalita. Ang “sa harap niya” ay isang katanggap-tanggap na natural na pagpapahayag ng personal na pagtitipon “sa kaniya.”'
