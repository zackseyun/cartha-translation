  text: וַ/יִּתֵּ֛ן שָׂרֵ֥י מִלְחָמ֖וֹת עַל הָ/עָ֑ם וַ/יִּקְבְּצֵ֣/ם אֵלָ֗י/ו אֶל רְחוֹב֙ שַׁ֣עַר הָ/עִ֔יר וַ/יְדַבֵּ֥ר עַל לְבָבָ֖/ם לֵ/אמֹֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/006.yaml
  text: And he appointed military commanders over the people[a], gathered them to himself in the square at the city gate, and spoke to their hearts, saying,
translation:
  language: tl
  text: Nagtalaga siya ng mga kumander ng hukbo na mamamahala sa mga tao. Tinipon niya ang mga ito sa harap niya sa liwasan sa may pintuan ng lungsod, at pinalakas niya ang kanilang loob[a] sa pagsasabing,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “nagsalita siya sa kanilang puso,” isang idyoma para sa pagsasalitang nagpapalakas o nagbibigay-lakas ng loob.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: Nagtalaga siya
  rationale: Bagaman literal na ‘naglagay/nagbigay,’ ang pandiwa sa konstruksiyong ito ay tumutukoy sa pagtatalaga sa isang tungkulin.
- source_word: שָׂרֵי מִלְחָמוֹת
  choice: mga kumander ng hukbo
  rationale: Ipinahahayag nito sa natural na modernong Tagalog ang tungkulin ng mga pinunong militar.
- source_word: עַל הָעָם
  choice: na mamamahala sa mga tao
  rationale: Ipinakikita ng עַל sa konteksto ng pagtatalaga ang awtoridad o pangangasiwa sa mga tao.
- source_word: וַיִּקְבְּצֵם אֵלָיו
  choice: Tinipon niya ang mga ito sa harap niya
  rationale: Pinananatili ang diwa na personal na ipinatawag at tinipon ni Hezekias ang mga kumander sa kinaroroonan niya.
- source_word: אֶל רְחוֹב שַׁעַר הָעִיר
  choice: sa liwasan sa may pintuan ng lungsod
  rationale: Ang רְחוֹב ay isang maluwang na pampublikong lugar o liwasan na kaugnay ng pintuan ng lungsod.
- source_word: וַיְדַבֵּר עַל לְבָבָם
  choice: pinalakas niya ang kanilang loob[a]
  rationale: Isinasalin ang idyomatikong kahulugan sa natural na Tagalog habang inilalagay sa talababa ang literal na larawan ng Hebreo.
- source_word: לֵאמֹר
  choice: sa pagsasabing,
  rationale: Natural na panimula ito sa tuwirang pananalitang sumusunod sa susunod na talata.
