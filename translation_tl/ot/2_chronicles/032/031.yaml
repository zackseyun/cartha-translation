source:
  edition: WLC
  text: וְ/כֵ֞ן בִּ/מְלִיצֵ֣י שָׂרֵ֣י בָּבֶ֗ל הַֽ/מְשַׁלְּחִ֤ים עָלָי/ו֙ לִ/דְרֹ֗שׁ הַ/מּוֹפֵת֙ אֲשֶׁ֣ר הָיָ֣ה בָ/אָ֔רֶץ עֲזָב֖/וֹ הָֽ/אֱלֹהִ֑ים לְ/נַ֨סּוֹת֔/וֹ לָ/דַ֖עַת כָּל בִּ/לְבָבֽ/וֹ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/031.yaml
  text: And so[a], in the matter of the envoys of the princes of Babylon, who had been sent to him to inquire about the sign that had happened in the land, God left him, to test him[b], to know all that was in his heart.
translation:
  language: tl
  text: Gayundin, tungkol sa mga sugo ng mga pinuno ng Babilonia na ipinadala sa kanya upang siyasatin ang tanda[a] na nangyari sa lupain, iniwan siya ng Diyos upang subukin siya[b] at malaman ang lahat ng nasa puso niya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “kababalaghan” o “pambihirang tanda.”
    reason: lexical_alternative
  - marker: b
    text: Pinananatili rito ang pananalitang “malaman ang lahat ng nasa puso niya,” gaya ng nasa Hebreo. Nauunawaan naman ito ng ilan bilang “ihayag” o “ilantad” ang nasa puso niya.
    reason: alternative_reading
lexical_decisions:
- source_word: וְכֵן
  choice: Gayundin
  rationale: Nag-uugnay ito sa naunang salaysay at nagpapakilala ng isa pang kaugnay na pangyayari.
- source_word: בִּמְלִיצֵי
  choice: tungkol sa mga sugo
  rationale: Ang מְלִיצִים dito ay mga tagapamagitan o diplomatikong sugo; natural sa Filipino ang pariralang “tungkol sa mga sugo” para sa saklaw ng pangyayari.
- source_word: שָׂרֵי בָּבֶל
  choice: mga pinuno ng Babilonia
  rationale: Maaaring tumukoy ang שָׂרִים sa mga prinsipe, opisyal, o pinuno; ang “mga pinuno” ay malinaw at hindi labis na tiyak.
- source_word: הַמְשַׁלְּחִים עָלָיו
  choice: na ipinadala sa kanya
  rationale: Bagaman aktibo ang anyong Hebreo, idiomatiko itong tumutukoy sa mga sugong ipinadala kay Hezekias.
- source_word: לִדְרֹשׁ
  choice: upang siyasatin
  rationale: Ang דרש ay may diwang mag-usisa o magsiyasat, na angkop sa diplomatikong pagdalaw.
- source_word: הַמּוֹפֵת
  choice: ang tanda
  rationale: Saklaw ng מוֹפֵת ang tanda, kababalaghan, o pambihirang pangyayari; pinananatili ng “tanda” ang lawak ng kahulugan.
- source_word: אֲשֶׁר הָיָה בָאָרֶץ
  choice: na nangyari sa lupain
  rationale: Ipinahahayag nang natural ang pangyayaring naganap at naging dahilan ng pagsisiyasat.
- source_word: עֲזָבוֹ
  choice: hinayaan siya ... na mag-isa
  rationale: Ipinahahayag nito ang pag-iwan ng Diyos kay Hezekias nang hindi pinatitindi tungo sa ganap na pagtatakwil.
- source_word: לְנַסּוֹתוֹ
  choice: upang subukin siya
  rationale: Tuwirang ipinapahayag ng נסה ang pagsubok o paglalagay sa pagsubok.
- source_word: לָדַעַת
  choice: at malaman
  rationale: Pinananatili ang tahasang layuning “malaman” sa Hebreo at ang kaakibat nitong teolohikal na tensiyon.
- source_word: כָּל בִּלְבָבוֹ
  choice: ang lahat ng nasa puso niya
  rationale: Ang “puso” sa Hebreo ay tumutukoy sa panloob na pagkatao, kabilang ang mga isip, hangarin, at motibo.
theological_decisions:
- issue: Ang pagsubok ng Diyos at ang wikang tumutukoy sa kanyang pagkaalam
  choice: hinayaan siya ng Diyos na mag-isa upang subukin siya at malaman ang lahat ng nasa puso niya
  alternative: iniwan siya ng Diyos upang ihayag o ilantad ang lahat ng nasa puso niya
  rationale: Tahasang sinasabi ng Hebreo na iniwan siya ng Diyos upang subukin siya at malaman ang nasa puso niya. Pinananatili ng salin ang tekstuwal na pahayag at teolohikal na tensiyon sa halip na ipaliwanag agad ang “malaman” bilang “ihayag.”
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “sugo” at “pinuno” bilang madaling maunawaang mga katawagang diplomatiko at pampolitika. Iniwasan ang labis na teknikal o denominasyonal na pagpapaliwanag, at pinanatili ang teolohikal na tensiyon ng orihinal.
