revisions:
- from: Hindi ba si Ezequias mismo ang nag-alis ng kanyang matataas na sambahan at ng kanyang mga altar, at nagsabi sa Juda at Jerusalem, ‘Sa harap ng iisang altar kayo yuyukod, at doon kayo magsusunog ng insenso[a]’?”
  to: Hindi ba si Hezekias mismo ang nag-alis ng kanyang mga dambana sa matataas na lugar at ng kanyang mga altar, at nagsabi sa Juda at Jerusalem, ‘Sa harap ng iisang altar kayo yuyukod, at sa ibabaw nito kayo magsusunog ng insenso[a]’?”
  rationale: Pinalitan ang hindi gaanong likas na “matataas na sambahan” ng “mga dambana sa matataas na lugar” upang malinaw na maipahayag ang kultikong kahulugan ng בָּמֹת. Pinalitan ang “doon” ng “sa ibabaw nito” upang maipakita ang וְעָלָיו. Napanatili ang mga hulaping paari bilang retorika ng nagsasalita, ang diin sa iisang altar, at ang leksikal na alternatibo sa talababa.
