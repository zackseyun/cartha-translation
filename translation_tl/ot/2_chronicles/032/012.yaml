id: 2CH.32.12
reference: 2 Chronicles 32:12
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: הֲ/לֹא הוּא֙ יְחִזְקִיָּ֔הוּ הֵסִ֥יר אֶת בָּמֹתָ֖י/ו וְ/אֶת מִזְבְּחֹתָ֑י/ו וַ/יֹּ֨אמֶר לִֽ/יהוּדָ֤ה וְ/לִֽ/ירוּשָׁלִַ֨ם֙ לֵ/אמֹ֔ר לִ/פְנֵ֨י מִזְבֵּ֧חַ אֶחָ֛ד תִּֽשְׁתַּחֲו֖וּ וְ/עָלָ֥י/ו תַּקְטִֽירוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/012.yaml
  text: Was it not Hezekiah himself who removed his high places and his altars[a], and said to Judah and Jerusalem, saying, ‘Before one altar you shall bow down, and on it you shall burn incense’?”
translation:
  language: tl
  text: Hindi ba si Hezekias mismo ang nag-alis ng kanyang mga dambana sa matataas na lugar at ng kanyang mga altar, at nagsabi sa Juda at Jerusalem, ‘Sa harap ng iisang altar kayo yuyukod, at sa ibabaw nito kayo magsusunog ng insenso[a]’?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Sa harap ng iisang altar kayo sasamba, at sa ibabaw nito kayo magpapausok ng mga handog.”
    reason: 'Ipinakikita ang leksikal na lawak ng תִּשְׁתַּחֲווּ at תַּקְטִירוּ: ang una ay maaari ring tumukoy sa pagsamba, at ang ikalawa sa pagpapausok ng mga handog, hindi lamang sa pagsusunog ng insenso.'
lexical_decisions:
- source_word: הֲלֹא
  choice: Hindi ba
  rationale: Nagpapakilala ito ng retorikal na tanong na umaasang sasang-ayon ang kausap.
- source_word: הוּא יְחִזְקִיָּהוּ
  choice: si Ezequias mismo
  rationale: Pinananatili ng “mismo” ang diin ng panghalip na kasama ng pangalang pantangi.
- source_word: הֵסִיר
  choice: nag-alis
  rationale: Tuwirang salin ito ng Hiphil ng סור sa konteksto ng pagpawi sa mga pook ng pagsamba.
- source_word: בָּמֹתָיו
  choice: kanyang matataas na sambahan
  rationale: Ipinahihiwatig ng terminong Hebreo ang mga lokal na pook-sambahan; pinananatili ang hulaping paari bilang bahagi ng mapanuyang paglalarawan ng nagsasalita.
- source_word: מִזְבְּחֹתָיו
  choice: kanyang mga altar
  rationale: Hayag sa Hebreo ang hulaping paari, kaya pinananatili ito nang hindi ipinahihiwatig na sinasang-ayunan ng tagapagsalaysay ang pananaw ng nagsasalita.
- source_word: וַיֹּאמֶר לִיהוּדָה וְלִירוּשָׁלִַם לֵאמֹר
  choice: at nagsabi sa Juda at Jerusalem
  rationale: Natural sa modernong Tagalog at sapat nang ipinakikilala ang tuwirang sipi; hindi kailangang ulitin ang literal na “na sinasabi.”
- source_word: לִפְנֵי מִזְבֵּחַ אֶחָד
  choice: Sa harap ng iisang altar
  rationale: Pinananatili ng “sa harap” ang batayang diwa ng לִפְנֵי at ng “iisang” ang diin sa sentralisadong pagsamba.
- source_word: תִּשְׁתַּחֲווּ
  choice: kayo yuyukod
  rationale: Pinananatili nito ang pisikal na larawan ng pagpapatirapa o pagyukod sa pagsamba.
- source_word: וְעָלָיו תַּקְטִירוּ
  choice: at doon kayo magsusunog ng insenso
  rationale: Karaniwang tumutukoy ang Hiphil ng קטר sa pagsusunog ng insenso, ngunit may mas malawak na posibilidad na magpausok ng handog; inilalahad iyon sa talababa.
theological_decisions:
- issue: Pananaw ng nagsasalita sa mga hulaping paari ng “matataas na sambahan” at “mga altar”
  choice: Pinanatili ang “kanyang” sa dalawang parirala bilang paglalarawan ng sugo ng Asiria.
  alternative: “ang matataas na sambahan at mga altar”
  rationale: Hayag ang mga hulaping paari sa Hebreo. Hindi dapat alisin ang mapanuyang pagpapalagay ng nagsasalita na ang mga inalis na sambahan ay pag-aari ng Diyos ni Juda.
- issue: Wika tungkol sa sentralisasyon ng pagsamba
  choice: Isinalin bilang pagyukod sa harap ng iisang altar nang walang paliwanag o pagtatanggol sa reporma ni Ezequias sa pangunahing teksto.
  alternative: Ipaliwanag bilang eksklusibong pagsamba sa altar ng templo.
  rationale: Paratang ng kaaway ang talata, hindi paliwanag ng tagapagsalaysay. Pinananatili nito ang tensiyon sa pagitan ng retorika ng Asiria at ng mas malawak na pagtataya ng salaysay sa reporma ni Ezequias.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “matataas na sambahan” upang maipahayag ang kultikong kahulugan ng בָּמוֹת, at pinanatili ang retorikal at polemikal na tono ng nagsasalita.
