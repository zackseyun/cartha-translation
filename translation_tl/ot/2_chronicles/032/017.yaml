id: 2CH.32.17
reference: 2 Chronicles 32:17
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וּ/סְפָרִ֣ים כָּתַ֔ב לְ/חָרֵ֕ף לַ/יהוָ֖ה אֱלֹהֵ֣י יִשְׂרָאֵ֑ל וְ/לֵֽ/אמֹ֨ר עָלָ֜י/ו לֵ/אמֹ֗ר כֵּֽ/אלֹהֵ֞י גּוֹיֵ֤ הָ/אֲרָצוֹת֙ אֲשֶׁ֨ר לֹא הִצִּ֤ילוּ עַמָּ/ם֙ מִ/יָּדִ֔/י כֵּ֣ן לֹֽא יַצִּ֞יל אֱלֹהֵ֧י יְחִזְקִיָּ֛הוּ עַמּ֖/וֹ מִ/יָּדִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/017.yaml
  text: He also wrote letters to mock Yahweh[a], the God of Israel, and to speak against him, saying, “Just as the gods of the nations of the lands have not delivered their people from my hand, so the God of Hezekiah will not deliver his people from my hand.”
translation:
  language: tl
  text: 'Sumulat din siya ng mga liham upang lapastanganin si Yahweh[a], ang Diyos ng Israel, at magsalita laban sa kanya, na nagsasabi: “Kung paanong hindi nailigtas ng mga diyos ng mga bansa sa iba''t ibang lupain ang kani-kanilang bayan mula sa kamay ko, gayon ay hindi maililigtas ng Diyos ni Hezekias ang kanyang bayan mula sa kamay ko.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “hamakin,” “insultuhin,” o “hamunin.” Ang pandiwang Hebreo ay tumutukoy sa mapang-insultong paglapastangan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּסְפָרִים כָּתַב
  choice: Sumulat din siya ng mga liham
  rationale: Ang סְפָרִים ay tumutukoy rito sa mga nakasulat na liham, at ang prefixed ו ay likas na ipinahayag sa Filipino sa pamamagitan ng “din.”
- source_word: לְחָרֵף
  choice: upang lapastanganin
  rationale: Ang חרף ay nangangahulugang hamakin, insultuhin, o hamunin nang may paglapastangan. Ang “lapastanganin” ay angkop sa tahasang paghamak na nakatuon kay Yahweh.
- source_word: לַיהוָה
  choice: si Yahweh
  rationale: Tuwirang isinasalin ang pangalang tipan na יהוה bilang “Yahweh.” Ginamit ang pantukoy na “si” dahil pangalan ito.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ang Diyos ng Israel
  rationale: Tuwirang ipinapahayag ng construct chain na si Yahweh ang Diyos ng Israel.
- source_word: וְלֵאמֹר עָלָיו
  choice: at magsalita laban sa kanya
  rationale: 'Sa konteksto, ang עָלָיו ay may salungat na diwa: ang mga salita ay laban kay Yahweh, hindi lamang tungkol sa kanya.'
- source_word: כֵּאלֹהֵי גּוֹיֵי הָאֲרָצוֹת
  choice: Kung paanong ... ang mga diyos ng mga bansa sa iba't ibang lupain
  rationale: Ang כֵּ ay nagpapasimula ng paghahambing. Ang “sa iba't ibang lupain” ay natural na Filipino para sa maramihang הָאֲרָצוֹת habang pinananatili ang saklaw nito.
- source_word: אֲשֶׁר לֹא הִצִּילוּ עַמָּם
  choice: hindi nailigtas ... ang kani-kanilang bayan
  rationale: Ang Hiphil ng נצל ay “magligtas” o “magligtas mula sa panganib.” Nililinaw ng “kani-kanilang” na bawat sinasabing diyos ay kaugnay ng sariling bayan, gaya ng distributive sense ng singular suffix sa collective plural antecedent.
- source_word: מִיָּדִי
  choice: mula sa kamay ko
  rationale: Pinananatili ang Hebreong metapora ng kamay bilang kapangyarihan o kontrol.
- source_word: כֵּן לֹא יַצִּיל
  choice: gayon din, hindi maililigtas
  rationale: Ang כֵּן ang katugmang bahagi ng paghahambing; ang pag-uulit ng “iligtas” ay nagpapanatili sa retorikal na paralelismo.
- source_word: אֱלֹהֵי יְחִזְקִיָּהוּ
  choice: ang Diyos ni Hezekias
  rationale: Natural sa Filipino ang “Diyos ni Hezekias” at pinananatili nito ang mapanuyang pagtukoy ng nagsasalita.
- source_word: עַמּוֹ
  choice: ang kanyang bayan
  rationale: Ang suffix ay tumutukoy sa bayang pag-aari o kinikilala ng Diyos ni Hezekias.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Pangalan mismo ang יהוה sa teksto. Ang “Yahweh” ay nagpapanatili sa pagkakakilanlan nito bilang banal na pangalan sa halip na palitan ito ng isang titulo.
- issue: Paglalarawan sa sinabi tungkol sa Diyos ni Hezekias
  choice: Pinanatili bilang tuwirang mapanuyang pahayag ng mananakop
  alternative: Palambutin o iwasto ang maling teolohikal na pahayag sa loob ng sipi
  rationale: Iniuulat ng talata ang paglapastangan ng kaaway; hindi nito pinagtitibay ang paghahambing ni Yahweh sa mga diyos ng mga bansa. Dapat manatili ang tensiyon at kayabangan ng mismong sinabi.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “bayan” para sa עַם at pinanatili ang metaporang “mula sa kamay ko.” Ang “Hezekias” ay ang nakaugaliang anyong Filipino ng pangalang Hezekiah.
