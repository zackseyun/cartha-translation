- from: Sumulat din siya ng mga liham upang lapastanganin si Yahweh[a], ang Diyos ng Israel, at magsalita laban sa kanya. Sinabi niya, “Kung paanong hindi nailigtas ng mga diyos ng mga bansa sa iba't ibang lupain ang kani-kanilang bayan mula sa kamay ko, gayon din, hindi maililigtas ng Diyos ni Hezekias ang kanyang bayan mula sa kamay ko.”
  to: 'Sumulat din siya ng mga liham upang lapastanganin si Yahweh[a], ang Diyos ng Israel, at magsalita laban sa kanya, na nagsasabi: “Kung paanong hindi nailigtas ng mga diyos ng mga bansa sa iba''t ibang lupain ang kani-kanilang bayan mula sa kamay ko, gayon ay hindi maililigtas ng Diyos ni Hezekias ang kanyang bayan mula sa kamay ko.”'
  rationale: Inayos ang pagkakaugnay ng sipi sa mga liham, alinsunod sa Hebreong וְלֵאמֹר ... לֵאמֹר, at pinalitan ang “gayon din” ng “gayon ay” upang malinaw na maipakita ang paghahambing at ang konklusyon nito. Walang binagong kahulugan, pangalan, o footnote anchor.
