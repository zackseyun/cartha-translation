base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/016.yaml
  text: And his servants spoke further against Yahweh God and against his servant Hezekiah[a].
translation:
  language: tl
  text: Nagsalita pa ang kanyang mga lingkod laban kay Yahweh na Diyos at laban sa lingkod niyang si Ezequias.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “nagsalita pa tungkol kay Yahweh na Diyos at tungkol sa lingkod niyang si Ezequias.” Maaaring maging mas neutral ang pang-ukol sa Hebreo, ngunit pinapaboran ng konteksto rito ang diwang “laban kay.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעוֹד
  choice: pa
  rationale: Ipinahihiwatig ng “pa” na nagpatuloy at nadagdagan ang naunang mapanirang pananalita.
- source_word: דִּבְּרוּ
  choice: nagsalita
  rationale: Tuwirang katumbas ito ng karaniwang kahulugan ng pandiwang דבר sa piel at natural sa kasunod na pariralang “laban kay.”
- source_word: עֲבָדָיו
  choice: ang kanyang mga lingkod
  rationale: Tumutukoy ito sa mga tauhan o kinatawan ng hari ng Asiria. Pinananatili ng “mga lingkod” ang lawak ng salitang עבד nang hindi ito nililimitahan sa “mga opisyal” o pinalalakas bilang “mga alipin.”
- source_word: עַל
  choice: laban kay
  rationale: Bagaman maaari itong mangahulugang “tungkol kay,” malinaw na mapanlaban at mapamusong ang pananalita sa konteksto.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang personal na pangalang nasa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: הָאֱלֹהִים
  choice: na Diyos
  rationale: Natural na ikinakabit sa Tagalog ang titulong “Diyos” sa pangalang Yahweh sa anyong “Yahweh na Diyos,” habang pinananatili ang appositional na ugnayan.
- source_word: וְעַל
  choice: at laban sa
  rationale: Pinananatili ang pag-uulit ng mapanlaban na pang-ukol at ang paralelismo ng dalawang pinatutungkulan.
- source_word: יְחִזְקִיָּהוּ
  choice: Ezequias
  rationale: Ito ang nakikilalang tradisyonal na anyo ng pangalan sa makabagong Filipino.
- source_word: עַבְדּוֹ
  choice: lingkod niyang
  rationale: Inilalarawan si Ezequias bilang lingkod ni Yahweh. Ang “lingkod” ay angkop sa maharlika at teolohikal na konteksto at hindi nagpapahiwatig ng katayuang alipin.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Personal na pangalan ang tahasang nasa tekstong Hebreo; pinananatili ito bilang “Yahweh” sa halip na palitan ng titulo.
- issue: Diwa ng עבד para kay Ezequias
  choice: lingkod
  alternative: alipin
  rationale: Ang salita rito ay tumutukoy sa tapat na paglilingkod ni Ezequias kay Yahweh sa kontekstong maharlika at tipan, hindi sa paggigiit ng katayuang panlipunan bilang alipin.
- issue: Diwa ng pang-ukol עַל kasunod ng דִּבְּרוּ
  choice: laban kay
  alternative: tungkol kay
  rationale: Maaaring maging neutral ang pang-ukol, ngunit pinapaboran ng konteksto ng panlalait at paghamon ang mapanlaban na diwa. Itinatala sa talababa ang tunay na alternatibong pagbasa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Ezequias,” ang pamilyar na anyo ng pangalan sa Filipino, at pinanatili ang “Yahweh” bilang banal na pangalan. Ang ayos na “lingkod niyang si Ezequias” ay natural sa Tagalog at inuugnay ang paglilingkod kay Yahweh.
