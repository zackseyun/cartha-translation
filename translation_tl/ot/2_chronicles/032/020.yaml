base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/020.yaml
  text: Then Hezekiah the king and Isaiah son of Amoz[a], the prophet, prayed because of this and cried out to heaven.
translation:
  language: tl
  text: Nanalangin tungkol dito si Haring Hezekias at ang propetang si Isaias na anak ni Amoz, at dumaing sila sa langit[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa mga langit.” Maramihan ang anyo ng pangngalang Hebreo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְפַּלֵּל
  choice: Nanalangin
  rationale: Ang hitpael ng פלל ay karaniwang nangangahulugang manalangin. Bagaman isahan ang unang pandiwa sa Hebreo bago ang tambalang simuno, natural sa Tagalog na unawain itong kilos nina Hezekias at Isaias, gaya ng maramihang pandiwang sumusunod.
- source_word: יְחִזְקִיָּהוּ הַמֶּלֶךְ
  choice: si Haring Hezekias
  rationale: Pinananatili ang pangalan at hayag na titulong hari sa natural na ayos ng modernong Tagalog.
- source_word: וִישַׁעְיָהוּ בֶן־אָמוֹץ הַנָּבִיא
  choice: ang propetang si Isaias na anak ni Amoz
  rationale: Pinananatili ang pangalang Isaias, ang pagkakakilanlang anak ni Amoz, at ang hayag na titulong propeta.
- source_word: עַל־זֹאת
  choice: tungkol dito
  rationale: Maaaring tukuyin ng parirala ang bagay na ipinanalangin o ang pangyayaring nag-udyok sa panalangin. Ang “tungkol dito” ay malapit sa anyo ng Hebreo at hindi labis na nagpapasya sa ugnayang sanhi.
- source_word: וַיִּזְעֲקוּ
  choice: at dumaing sila
  rationale: Ang זעק ay isang masidhi at apurahang pagdaing o paghingi ng tulong. Mas naipapakita ng “dumaing” ang bigat nito kaysa sa payak na “tumawag.”
- source_word: הַשָּׁמָיִם
  choice: sa langit
  rationale: Ang pangngalang Hebreo ay maramihan sa anyo, ngunit karaniwang ginagamit sa Tagalog ang isahang “langit” para sa dakong pinatutungkulan ng panalangin.
theological_decisions:
- issue: Ang pinatutungkulan ng pagdaing sa pariralang הַשָּׁמָיִם
  choice: sa langit
  alternative: sa mga langit
  rationale: Inilalarawan ng parirala ang pagdaing na nakatuon sa langit nang hindi gumagawa ng karagdagang doktrinal na pahayag tungkol sa kaayusan ng kalangitan. Natural sa modernong Tagalog ang “sa langit,” habang inilalagay sa talababa ang literal na maramihang anyo.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “Haring Hezekias” at “propetang si Isaias” bilang natural na appositional na mga titulo, at “dumaing” upang mapanatili ang tindi ng Hebreong pandiwa.
