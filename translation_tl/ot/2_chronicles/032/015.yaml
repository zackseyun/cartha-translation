revisions:
- from: Kaya ngayon, huwag kayong magpalinlang kay Hezekias, at huwag ninyo siyang hayaang hikayatin kayo nang ganito,[a] at huwag kayong maniwala sa kanya. Sapagkat walang diyos ng alinmang bansa o kaharian ang nakapagligtas sa kanyang bayan mula sa kamay ko at sa kamay ng aking mga ninuno.[b] Lalo nang hindi kayo maililigtas ng inyong Diyos mula sa kamay ko![c]
  to: Kaya ngayon, huwag ninyong hayaang linlangin kayo ni Hezekias, at huwag ninyong hayaang hikayatin niya kayo nang ganito,[a] at huwag kayong maniwala sa kanya. Sapagkat walang diyos ng alinmang bansa o kaharian ang nakapagligtas sa kanyang bayan mula sa kamay ko at sa kamay ng aking mga ninuno.[b] Lalo nang hindi kayo maililigtas ng inyong Diyos mula sa kamay ko![c]
  rationale: Isang maliit na pag-aayos sa unang utos ang ginawa upang maging malinaw at likas ang aktibong papel ni Hezekias bilang diumano'y nanlilinlang. Walang binago sa saklaw, retorikal na lakas, o teolohikong sanggunian ng talata; pinanatili rin ang lahat ng talababa at ang mga angkla nito.
