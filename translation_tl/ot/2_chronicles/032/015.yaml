id: 2CH.32.15
reference: 2 Chronicles 32:15
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/עַתָּ֡ה אַל יַשִּׁיא֩ אֶתְ/כֶ֨ם חִזְקִיָּ֜הוּ וְ/אַל יַסִּ֨ית אֶתְ/כֶ֣ם כָּ/זֹאת֮ וְ/אַל תַּאֲמִ֣ינוּ ל/וֹ֒ כִּי לֹ֣א יוּכַ֗ל כָּל אֱל֨וֹהַ֙ כָּל גּ֣וֹי וּ/מַמְלָכָ֔ה לְ/הַצִּ֥יל עַמּ֛/וֹ מִ/יָּדִ֖/י וּ/מִ/יַּ֣ד אֲבוֹתָ֑/י אַ֚ף כִּ֣י אֱֽלֹהֵי/כֶ֔ם לֹא יַצִּ֥ילוּ אֶתְ/כֶ֖ם מִ/יָּדִֽ/י־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/015.yaml
  text: So now[a], do not let Hezekiah deceive you, and do not let him persuade you like this, and do not believe him; for no god of any nation or kingdom has been able to deliver his people from my hand and from the hand of my fathers[c][b]. How much less will your God deliver you from my hand!
translation:
  language: tl
  text: Kaya ngayon, huwag ninyong hayaang linlangin kayo ni Hezekias, at huwag ninyong hayaang hikayatin niya kayo nang ganito,[a] at huwag kayong maniwala sa kanya. Sapagkat walang diyos ng alinmang bansa o kaharian ang nakapagligtas sa kanyang bayan mula sa kamay ko at sa kamay ng aking mga ninuno.[b] Lalo nang hindi kayo maililigtas ng inyong Diyos mula sa kamay ko![c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin ang “hikayatin” bilang “udyukan” o “akitin.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “mula sa kamay ko at sa kamay ng aking mga ninuno.” Ang “kamay” ay larawan ng kapangyarihan o kontrol.
    reason: cultural_note
  - marker: c
    text: 'Maaari ring isalin: “tiyak na hindi kayo ililigtas,” bilang pinatinding negatibong kongklusyon ng idyomang Hebreo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Kaya ngayon
  rationale: Likas na panandang panretorika na nagpapanatili sa paglipat tungo sa agarang babala.
- source_word: יַשִּׁיא
  choice: magpalinlang
  rationale: Ipinahahayag ang diwang mailigaw sa pamamagitan ng panlilinlang, habang natural ang konstruksiyong ‘huwag kayong magpalinlang kay Hezekias.’
- source_word: יַסִּית
  choice: hikayatin
  rationale: Tumutukoy sa pag-impluwensiya o panghihikayat sa mga tao; iniiwasang ulitin lamang ang kahulugan ng naunang pandiwa at hindi nagdaragdag ng diwang paghihimagsik.
- source_word: כָּזֹאת
  choice: nang ganito
  rationale: Pinananatili ang demonstratibong pagtukoy sa ganitong paraan o ganitong sinasabi ni Hezekias.
- source_word: תַּאֲמִינוּ לוֹ
  choice: maniwala sa kanya
  rationale: Ang usapin ay kung paniniwalaan ng bayan ang sinasabi ni Hezekias; ito ang pinakanatural na modernong Tagalog.
- source_word: לֹא יוּכַל
  choice: walang ... nakapagligtas
  rationale: Ang aspektong nakumpleto ay angkop sa pag-angkin ng tagapagsalita batay sa mga nagdaang pananakop.
- source_word: כָּל אֱלוֹהַ כָּל גּוֹי וּמַמְלָכָה
  choice: walang diyos ng alinmang bansa o kaharian
  rationale: Malinaw na inililipat sa Tagalog ang pangkalahatang negatibong pahayag tungkol sa mga diyos ng mga bansa at kaharian.
- source_word: לְהַצִּיל
  choice: magligtas
  rationale: Angkop sa konteksto ng pagsagip sa bayan mula sa kapangyarihang militar.
- source_word: עַמּוֹ
  choice: kanyang bayan
  rationale: Pinananatili ang isahang panghalip na tumutukoy sa bawat diyos at sa bayang kaugnay nito.
- source_word: מִיַּדִי וּמִיַּד אֲבוֹתָי
  choice: mula sa kamay ko at sa kamay ng aking mga ninuno
  rationale: Pinananatili ang pag-uulit ng ‘kamay,’ isang Hebreong talinghaga para sa kapangyarihan o kontrol; ang ‘mga ninuno’ ay maaaring tumukoy sa mga naunang hari o mga ninunong maharlika.
- source_word: אַף כִּי
  choice: Lalo nang hindi
  rationale: 'Natural na Tagalog para sa pinatinding negatibong kongklusyon: kung hindi nagawa ng ibang diyos, lalong hindi raw ito magagawa ng Diyos ng Juda.'
- source_word: אֱלֹהֵיכֶם
  choice: inyong Diyos
  rationale: Bagaman anyong maramihan sa morpolohiya, tumutukoy ito sa iisang Diyos ng Juda sa kontekstong ito.
theological_decisions:
- issue: Tinutukoy ng אֱלֹהֵיכֶם
  choice: isahang ‘inyong Diyos,’ ang Diyos ng Juda/Israel
  alternative: maramihang ‘inyong mga diyos’
  rationale: Ginagamit dito ang karaniwang anyong אֱלֹהִים para sa iisang Diyos ng Israel. Ang maramihang salin ay magpapalabo sa malinaw na pinatutungkulan ng paghamon.
- issue: Katayuan ng pag-angkin tungkol sa Diyos
  choice: Iniharap bilang mapanuyang salita ng tagapagsalitang Asirio, hindi bilang pagsang-ayon ng tagapagsalaysay
  alternative: Ipaliwanag sa mismong talata na mali ang pag-angkin
  rationale: Pinananatili ng salin ang lakas ng tuwirang pananalita at hindi nilulutas sa teksto ang teolohikong tensiyon; malinaw sa konteksto na ito ay paghamon ng kaaway.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang ‘kamay’ bilang mahalagang larawang Hebreo at ginamitan ng talababa upang ipaliwanag ito. Ang ‘Hezekias’ ay anyong pangalang pamilyar sa tradisyong Tagalog; ang pangungusap ay inayos sa natural na daloy nang hindi pinapahina ang mapanuyang banta.
