base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/004.yaml
  text: So many people gathered together[a], and they stopped up all the springs and the stream that flowed through the land, saying[b], “Why should the kings of Assyria come and find abundant water?”
translation:
  language: tl
  text: Nagtipon ang napakaraming tao, at hinarangan nila ang lahat ng bukal at ang batis na dumadaloy[a] sa lupain. Sinabi nila, “Bakit pa darating ang mga hari ng Asiria[b] at makasusumpong ng saganang tubig?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang sapa/wadi na dumadaloy sa lupain.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “mga hari ng Asiria.” Maaaring tumukoy ang pangmaramihang anyo sa kapangyarihang maharlika o dinastiya ng Asiria; isinasalin naman ito ng ilan bilang “hari ng Asiria” ayon sa agarang kontekstong pangkasaysayan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקָּבְצוּ עַם רָב
  choice: Nagtipon ang napakaraming tao
  rationale: Ipinahahayag ng anyong Niphal ang sama-samang pagtipon, at ang עַם רָב ay tumutukoy sa maraming tao, hindi sa isang pangkat-etniko.
- source_word: וַיִּסְתְּמוּ אֶת כָּל הַמַּעְיָנוֹת
  choice: hinarangan nila ang lahat ng bukal
  rationale: Sa konteksto ng mga pinagkukunan ng tubig, ang סתם ay nangangahulugang harangan o patigilin ang daloy; malinaw at natural ang “hinarangan” sa Filipino.
- source_word: הַנַּחַל הַשּׁוֹטֵף
  choice: ang batis na dumadaloy
  rationale: Ang נַחַל ay maaaring batis, sapa, o wadi, at inilalarawan ng participleng הַשּׁוֹטֵף bilang aktuwal na dumadaloy. Pinananatili ng salin ang malawak na kahulugan nang hindi gumagamit ng di-karaniwang terminong “wadi” sa pangunahing teksto.
- source_word: בְּתוֹךְ הָאָרֶץ
  choice: sa lupain
  rationale: Natural na ipinahahayag nito na ang daluyan ay nasa loob o dumaraan sa nasasakupang lupain, nang hindi labis na tinutukoy ang eksaktong ruta nito.
- source_word: לֵאמֹר
  choice: Sinabi nila
  rationale: Ginagawang likas na Filipino ang karaniwang panandang Hebreo na nagpapakilala sa tuwirang sinabi, habang pinananatili ang kolektibong tagapagsalita.
- source_word: לָמָּה יָבֹאוּ
  choice: Bakit pa darating
  rationale: 'Ang “Bakit pa” ay natural na naghahatid ng retorikal at deliberatibong puwersa: walang dahilan upang hayaang makinabang ang darating na kaaway.'
- source_word: מַלְכֵי אַשּׁוּר
  choice: mga hari ng Asiria
  rationale: Pinananatili ang tahasang pangmaramihang anyo ng Hebreo sa halip na gawing isahan ayon lamang sa agarang kontekstong pangkasaysayan.
- source_word: וּמָצְאוּ מַיִם רַבִּים
  choice: at makasusumpong ng saganang tubig
  rationale: Ang מַיִם רַבִּים ay tumutukoy sa maraming suplay ng tubig; ang “saganang tubig” ay malinaw, maikli, at angkop sa estratehikong suliranin.
