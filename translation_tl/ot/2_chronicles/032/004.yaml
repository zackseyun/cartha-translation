  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang pangmaramihang “mga hari” at nilagyan ng talababa ang mga tunay na alternatibong leksikal. Inilipat ang mga pananda ng talababa sa mga salitang aktuwal na tinatalakay ng bawat tala.
