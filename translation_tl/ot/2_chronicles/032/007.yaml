  text: חִזְק֣וּ וְ/אִמְצ֔וּ אַל תִּֽירְא֣וּ וְ/אַל תֵּחַ֗תּוּ מִ/פְּנֵי֙ מֶ֣לֶךְ אַשּׁ֔וּר וּ/מִ/לִּ/פְנֵ֖י כָּל הֶ/הָמ֣וֹן אֲשֶׁר עִמּ֑/וֹ כִּֽי עִמָּ֥/נוּ רַ֖ב מֵ/עִמּֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/007.yaml
  text: Be strong and courageous[a]. Do not fear or be dismayed before the king of Assyria or before all the multitude that is with him[b], for there are more with us than with him.
translation:
  language: tl
  text: Magpakatatag kayo at lakasan ninyo ang inyong loob. Huwag kayong matakot o panghinaan ng loob sa harap ng hari ng Asiria o ng buong karamihang kasama niya[a], sapagkat mas marami ang kasama natin kaysa sa kasama niya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ng buong hukbong kasama niya.” Ang salitang Hebreo ay maaaring tumukoy sa isang karamihan o, sa kontekstong ito, sa malaking pulutong ng mga kawal.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “sapagkat kasama natin ay higit kaysa kasama niya.” Eliptikal ang paghahambing sa Hebreo, at nililinaw ito ng kasunod na talata.
    reason: lexical_alternative
lexical_decisions:
- source_word: חִזְקוּ
  choice: Magpakatatag kayo
  rationale: Ang Qal imperative na maramihan ay isang tuwirang panawagan na maging malakas o matatag. Ang “magpakatatag” ay natural sa makabagong Tagalog at angkop sa paghahanda sa harap ng banta.
- source_word: וְאִמְצוּ
  choice: at lakasan ninyo ang inyong loob
  rationale: Ang אמץ sa nakaugaliang tambalang חזק ואמץ ay tumutukoy sa katapangan at tibay ng loob. Pinananatili ng parirala ang ikalawang utos at iniiwasan ang di-natural na pag-uulit ng “magpakalakas.”
- source_word: אַל תִּירְאוּ
  choice: Huwag kayong matakot
  rationale: Tuwirang katumbas ito ng negatibong pautos mula sa ירא at malinaw sa karaniwang Tagalog.
- source_word: וְאַל תֵּחַתּוּ
  choice: o panghinaan ng loob
  rationale: Ang Niphal ng חתת ay maaaring magpahiwatig ng pagkawasak, pagkasindak, o pagkawala ng tapang. Sa kontekstong militar, natural na ipinapahayag ng “panghinaan ng loob” ang emosyonal na puwersa nito nang hindi labis na pinatitindi.
- source_word: מִפְּנֵי
  choice: sa harap ng
  rationale: Pinananatili nito ang larawang “mula sa mukha/presensiya ng” habang malinaw na tumutukoy sa pagharap sa kinatatakutang kaaway.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: hari ng Asiria
  rationale: Tuwirang salin ng pariralang konstrukt at karaniwang anyo ng pangalan sa Tagalog.
- source_word: וּמִלִּפְנֵי כָּל הֶהָמוֹן אֲשֶׁר עִמּוֹ
  choice: o ng buong karamihang kasama niya
  rationale: Ang הָמוֹן ay maaaring tumukoy sa karamihan, malaking pulutong, o masa ng mga kawal. Pinananatili ng “karamihan” ang lawak ng salita; nililinaw ng talababa ang posibleng militar na diwa.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala nito ang dahilan ng naunang paghihikayat at nagbibigay ng marangal ngunit natural na daloy.
- source_word: עִמָּנוּ רַב מֵעִמּוֹ
  choice: mas marami ang kasama natin kaysa sa kasama niya
  rationale: Eliptikal ang Hebreo, na literal na “kasama natin [ay] higit kaysa kasama niya.” Ang paghahambing na maramihan ay akma sa kagyat na konteksto at hindi ipinapasok nang maaga ang paliwanag ng kasunod na talata.
theological_decisions:
- issue: Eliptikal na paghahambing sa huling sugnay
  choice: “mas marami ang kasama natin kaysa sa kasama niya,” bilang paghahambing ng mga kasama o sumusuportang puwersa
  alternative: “mas dakila ang kasama natin kaysa sa kasama niya,” bilang paghahambing ng dalawang indibidwal
  rationale: Singular ang anyong רַב ngunit eliptikal ang pagkakabuo. Inihahambing ng agarang konteksto ang karamihang kasama ng hari ng Asiria at ang nasa panig ng Juda; sa susunod na talata pa tahasang ipinaliliwanag kung sino o ano ang kanilang sandigan. Kaya hindi ipinapasok sa talatang ito ang mas tiyak na singular-personal na pagbasa.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog. Ginamit ang mga anyong maramihan upang tumbasan ang mga pautos sa Hebreo. Iniwasan ang sobrang literal na ayos na magiging asiwa sa Tagalog, ngunit pinanatili sa mga talababa ang tunay na lawak at elipsis ng orihinal.
