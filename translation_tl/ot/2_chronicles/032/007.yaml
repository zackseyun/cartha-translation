  source_fidelity: Tapat ang salin sa mga pautos na maramihan na חִזְקוּ וְאִמְצוּ, sa dobleng pagbabawal na huwag matakot o masiraan ng loob, sa hari ng Asiria at sa karamihang kasama niya, at sa eliptikal na paghahambing sa hulihan. Ang “mas marami ang kasama natin kaysa sa kasama niya” ay wastong paglilinaw ng elipsis nang hindi ipinapasok ang tahasang paliwanag ng kasunod na talata.
  naturalness: Natural, malinaw, at marangal ang makabagong Tagalog. Ang pares na “Magpakatatag kayo at lakasan ninyo ang inyong loob” ay idiomatiko at angkop sa panawagang panghihikayat. Maayos ang daloy ng mga sugnay at malinaw ang mga panghalip na maramihan.
  terminology: Ang “hari ng Asiria,” “karamihang kasama niya,” at “panghinaan ng loob” ay angkop sa konteksto at rehistro. Wastong inilalagay ng talababa ang posibleng pakahulugang militar ng הָמוֹן nang hindi ito ipinipilit sa pangunahing teksto. Ang mga pananda ng talababa ay nakakabit sa mga pariralang tinutukoy ng kani-kanilang paliwanag.
