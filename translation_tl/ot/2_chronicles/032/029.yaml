revisions:
- from: Gumawa rin siya ng mga lunsod para sa sarili niya at nagkaroon ng napakaraming kawan at bakahan, sapagkat binigyan siya ng Diyos ng napakaraming ari-arian.[a]
  to: Gumawa rin siya ng mga lunsod para sa kanyang sarili at nagkaroon ng napakaraming kawan ng maliliit na alagang hayop at mga baka, sapagkat binigyan siya ng Diyos ng napakaraming ari-arian.[a]
  rationale: Pinalitan ang “bakahan” ng “mga baka” upang matukoy ang mga hayop, hindi ang lugar ng pag-aalaga sa mga ito. Idinagdag ang “maliliit na alagang hayop” upang katawanin ang saklaw ng צֹאן nang hindi nililimitahan ito sa tupa lamang. Bahagyang inayos ang panghalip para sa mas angkop na rehistro. Ang talababa ay pinanatili sa “ari-arian” at inayos ang mga alternatibo upang maging likas na Filipino.
