  text: He also made cities for himself[a], and acquired flocks and herds in abundance, for God had given him very great wealth.
translation:
  language: tl
  text: Gumawa rin siya ng mga lunsod para sa kanyang sarili at nagkaroon ng napakaraming kawan ng maliliit na alagang hayop at mga baka, sapagkat binigyan siya ng Diyos ng napakaraming ari-arian.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “napakalaking kayamanan” o “malalaking pag-aari.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָרִים עָשָׂה לוֹ
  choice: Gumawa rin siya ng mga lunsod para sa sarili niya
  rationale: Pinananatili ng “gumawa” ang malawak na diwa ng עָשָׂה sa halip na paliitin agad sa “nagtayo,” habang likas na ipinahahayag ng “rin” ang kaugnayang pandagdag sa naunang talata. Ang לוֹ ay nauunawaan dito bilang para sa kapakinabangan o pag-aari ni Hezekias.
- source_word: וּמִקְנֵה צֹאן וּבָקָר
  choice: at nagkaroon ng ... kawan at bakahan
  rationale: Ang מִקְנֶה ay tumutukoy sa pag-aaring hayop; ang “nagkaroon ng” ay natural sa Filipino at hindi nagsasaad ng tiyak na paraan ng pagkakamit. Ang “kawan at bakahan” ay nagpapanatili sa pagkakaiba ng צֹאן, maliliit na alagang hayop gaya ng tupa at kambing, at בָּקָר, mga baka.
- source_word: לָרֹב
  choice: napakaraming
  rationale: Ipinahahayag nito ang lubhang malaking dami ng mga alagang hayop sa maikli at natural na Filipino.
- source_word: כִּי
  choice: sapagkat
  rationale: Malinaw na ipinakikita ang sanhi o paliwanag ng kasaganaan ni Hezekias sa isang marangal ngunit madaling maunawaang anyo.
- source_word: נָתַן לוֹ אֱלֹהִים
  choice: binigyan siya ng Diyos
  rationale: Tuwirang pinananatili ang Diyos bilang gumagawa at si Hezekias bilang tumatanggap, ayon sa Hebreong sugnay.
- source_word: רְכוּשׁ רַב מְאֹד
  choice: napakaraming ari-arian
  rationale: Ang רְכוּשׁ ay materyal na pag-aari o mga tinatangkilik; mas tuwiran dito ang “ari-arian” kaysa “kayamanan,” at ipinapakita ng “napakaraming” ang diin ng רַב מְאֹד.
theological_decisions:
- issue: Ang pinagmulan ng kasaganaan ni Hezekias
  choice: Tahasang iniuugnay sa kaloob ng Diyos ang napakaraming ari-arian ni Hezekias.
  alternative: Ilarawan lamang ang kasaganaan nang hindi binibigyang-diin ang banal na pagkilos.
  rationale: Maliwanag na sinasabi ng כִּי נָתַן לוֹ אֱלֹהִים na ang Diyos ang nagbigay nito. Hindi pinalalawak ng salin ang pahayag tungo sa isang pangkalahatang doktrina tungkol sa materyal na kasaganaan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “lunsod,” “kawan,” at “bakahan” bilang madaling maunawaang mga terminong angkop sa salaysay. Inilagay ang talababa sa “ari-arian,” ang salitang tinutukoy ng leksikal na alternatibo.
