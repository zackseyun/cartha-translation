base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/027.yaml
  text: And Hezekiah had very great wealth and honor[a], and he made storehouses for silver and gold, precious stones, spices, shields[b], and every desirable article.
translation:
  language: tl
  text: Nagkaroon si Ezequias ng napakaraming kayamanan at napakalaking karangalan. Gumawa siya para sa sarili niya ng mga imbakan[a] para sa pilak, ginto, mahahalagang bato, mga aromatikong sangkap, mga kalasag, at lahat ng kanais-nais na mga bagay.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga silid-yaman.” Ang salitang Hebreo ay maaaring tumukoy sa mga pangkalahatang imbakan o, nang mas tiyak, sa mga taguan ng kayamanan ng hari.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “bawat mahalagang bagay” o “lahat ng uri ng mamahaling sisidlan.” Malawak ang pariralang Hebreo at maaaring sumaklaw sa iba’t ibang mamahalin o mararangyang bagay.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי לִיחִזְקִיָּהוּ
  choice: Nagkaroon si Ezequias
  rationale: Likas na ipinapahayag sa Tagalog ang Hebreong konstruksiyon ng pag-aari sa pamamagitan ng “nagkaroon”; pinananatili rin nito ang daloy ng salaysay.
- source_word: עֹשֶׁר וְכָבוֹד הַרְבֵּה מְאֹד
  choice: napakaraming kayamanan at malaking karangalan
  rationale: Ipinahahayag ng “napakarami” ang matinding diin ng הַרְבֵּה מְאֹד. Ang “karangalan” ay angkop sa katayuan at dangal ng hari, samantalang ang “kayamanan” ay malinaw sa materyal na konteksto.
- source_word: וְאֹצָרוֹת עָשָׂה לוֹ
  choice: Nagpagawa siya para sa sarili niya ng mga imbakan
  rationale: Ang “mga imbakan” ay sapat na malawak para sa sari-saring nakalistang bagay. Ipinakikita ng “nagpagawa” ang gawaing iniutos ng isang hari, at tahasang pinananatili ng “para sa sarili niya” ang לוֹ.
- source_word: לְכֶסֶף וּלְזָהָב
  choice: para sa pilak, ginto
  rationale: Natural sa Tagalog na isang “para sa” ang mamahala sa buong listahan, habang nananatiling malinaw ang bawat bagay.
- source_word: וּלְאֶבֶן יְקָרָה
  choice: mahahalagang bato
  rationale: Bagaman pang-isahan ang anyong Hebreo, kolektibo ang diwa at natural sa Tagalog ang pangmaramihan.
- source_word: וְלִבְשָׂמִים
  choice: mga sangkap na mabango
  rationale: Sinasaklaw nito ang mga aromatikong sangkap nang hindi nililimitahan ang kahulugan sa pampalasa o likidong pabango lamang.
- source_word: וּלְמָגִנִּים
  choice: mga kalasag
  rationale: Tiyak na tumutukoy ang salitang Hebreo sa mga kalasag, hindi sa kagamitang pandigma sa pangkalahatan.
- source_word: וּלְכֹל כְּלֵי חֶמְדָּה
  choice: lahat ng uri ng mahahalagang kagamitan
  rationale: Ang “kagamitan” ay nagpapanatili sa malawak na saklaw ng כְּלֵי, at ang “mahahalaga” ay natural na naghahatid sa ideya ng kanais-nais o mamahaling mga bagay.
