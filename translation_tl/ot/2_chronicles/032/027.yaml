translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang karaniwang baybay na “Ezequias.” Pinagaan ang pag-uulit ng pang-ukol sa mahabang talaan upang maging natural sa Tagalog, ngunit pinanatili ang lahat ng sangkap at ang inventaryong himig ng Hebreo. Inilagay ang mga panandang talababa sa mismong mga salitang tinatalakay ng bawat tala.
