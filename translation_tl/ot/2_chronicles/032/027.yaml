revisions:
- from: Nagkaroon si Ezequias ng napakaraming kayamanan at malaking karangalan. Nagpagawa siya para sa sarili niya ng mga imbakan[a] para sa pilak, ginto, mahahalagang bato, mga sangkap na mabango, mga kalasag, at lahat ng uri ng mahahalagang kagamitan.[b]
  to: Nagkaroon si Ezequias ng napakaraming kayamanan at napakalaking karangalan. Gumawa siya para sa sarili niya ng mga imbakan[a] para sa pilak, ginto, mahahalagang bato, mga aromatikong sangkap, mga kalasag, at lahat ng kanais-nais na mga bagay.[b]
  rationale: Inayos ang saklaw ng diin sa “kayamanan at karangalan,” ibinalik ang di-tiyak na pandiwang “gumawa,” pinalitan ang di-natural na “mga sangkap na mabango,” at inalis ang idinagdag na ideyang “mga uri.” Inilipat din ang talababa b sa pariralang כְּלֵי חֶמְדָּה na siya nitong tinatalakay. Pinanatili ang kahulugan at ang malawak na leksikal na saklaw ng orihinal.
