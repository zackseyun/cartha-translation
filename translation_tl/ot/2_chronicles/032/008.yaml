  text: עִמּ/וֹ֙ זְר֣וֹעַ בָּשָׂ֔ר וְ/עִמָּ֜/נוּ יְהוָ֤ה אֱלֹהֵ֨י/נוּ֙ לְ/עָזְרֵ֔/נוּ וּ/לְ/הִלָּחֵ֖ם מִלְחֲמֹתֵ֑/נוּ וַ/יִּסָּמְכ֣וּ הָ/עָ֔ם עַל דִּבְרֵ֖י יְחִזְקִיָּ֥הוּ מֶֽלֶךְ יְהוּדָֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/008.yaml
  text: With him is an arm of flesh[a], but with us is Yahweh our God, to help us and to fight our battles. And the people relied on the words of Hezekiah king of Judah.
translation:
  language: tl
  text: Sa panig niya ay bisig lamang ng tao[a], ngunit kasama natin si Yahweh na ating Diyos upang tulungan tayo at lumaban sa ating mga digmaan. At sumandig ang bayan sa mga salita ni Hezekias na hari ng Juda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Lit. “bisig ng laman”; o “lakas ng tao.” Pinananatili ng Hebreo ang larawan ng bisig upang ihambing ang kapangyarihan lamang ng tao sa tulong ni Yahweh.
    reason: lexical_alternative
lexical_decisions:
- source_word: עִמּוֹ
  choice: Kasama niya
  rationale: Tuwirang ipinapahayag ang pakikisama o panig at pinananatili ang pagkakapantay ng parirala sa “kasama natin.”
- source_word: זְרוֹעַ בָּשָׂר
  choice: ang bisig na laman
  rationale: Pinananatili ang matalinghagang larawan ng kapangyarihang pantao, na ikinokontra sa tulong ni Yahweh; nililinaw sa talababa ang di-matalinghagang kahulugan.
- source_word: וְעִמָּנוּ
  choice: ngunit kasama natin
  rationale: Ang “ngunit” ay likas na nagpapahayag sa Filipino ng matinding pagsalungat sa lakas na kasama ng kaaway.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֵינוּ
  choice: ating Diyos
  rationale: Likas at tuwirang salin ng pananalitang tipan.
- source_word: לְעָזְרֵנוּ
  choice: upang tulungan tayo
  rationale: Ipinahahayag ang layunin ng infinitive na may ל sa malinaw at natural na Filipino.
- source_word: וּלְהִלָּחֵם מִלְחֲמֹתֵינוּ
  choice: at ipaglaban ang ating mga labanan
  rationale: Pinananatili ang pandiwa at kaugnay nitong pangngalan sa Hebreo, pati ang ideyang ang mga labanan ay sa Juda; ang “ipaglaban” ay nagpapahiwatig na si Yahweh ang kumikilos alang-alang sa kanila.
- source_word: וַיִּסָּמְכוּ
  choice: nagtiwala
  rationale: Ang literal na pag-asa o pagsandig ay matalinghagang tumutukoy rito sa pagtitiwala sa sinabi ni Hezekias.
- source_word: הָעָם
  choice: ang bayan
  rationale: Ang kolektibong pangngalan ay natural na tumutukoy sa sambayanan ng Juda bilang isang kabuuan.
- source_word: עַל דִּבְרֵי
  choice: sa mga salita
  rationale: Kasama ng “nagtiwala,” natural nitong ipinapahayag ang pinagbabatayan ng tiwala habang pinananatili ang pangmaramihang “mga salita.”
- source_word: יְחִזְקִיָּהוּ
  choice: Hezekias
  rationale: Ginagamit ang nakaugaliang anyo ng pangalan sa Tagalog na salin ng Bibliya.
- source_word: מֶלֶךְ יְהוּדָה
  choice: hari ng Juda
  rationale: Tuwirang pinananatili ang katungkulan at kaharian ni Hezekias.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehovah
  rationale: Pangalan mismo ang nasa tekstong Hebreo; ang “Yahweh” ay nagpapanatili nito sa halip na palitan ng titulo.
- issue: Lakas ng pagsalungat sa pagitan ng tulong ng tao at ng Diyos
  choice: “ngunit kasama natin”
  alternative: “at kasama natin”
  rationale: 'Bagaman וְ ang pangatnig, malinaw na salungatan ang retorika: lakas lamang ng tao ang kasama ng kaaway, samantalang si Yahweh ang kasama ng Juda.'
- issue: Diwa ng pakikipaglaban ni Yahweh
  choice: “ipaglaban ang ating mga labanan”
  alternative: “labanan ang ating mga labanan”
  rationale: Iniiwasan ang lubhang alanganing pag-uulit sa Filipino at ipinahahayag na si Yahweh ang nakikipaglaban alang-alang sa bayan, nang hindi inaalis ang pagmamay-ari nilang ipinahahayag ng hulaping Hebreo.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang Hebreong metapora sa pangunahing teksto, samantalang ibinigay sa talababa ang malinaw na kahulugan nito. Ginamit ang “Hezekias” at “Juda” bilang pamilyar na mga anyong Tagalog.
