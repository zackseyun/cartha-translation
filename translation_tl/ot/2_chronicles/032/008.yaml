revisions:
- from: Kasama niya ang bisig na laman[a], ngunit kasama natin si Yahweh na ating Diyos upang tulungan tayo at ipaglaban ang ating mga labanan. At nagtiwala ang bayan sa mga salita ni Hezekias na hari ng Juda.
  to: Sa panig niya ay bisig lamang ng tao[a], ngunit kasama natin si Yahweh na ating Diyos upang tulungan tayo at lumaban sa ating mga digmaan. At sumandig ang bayan sa mga salita ni Hezekias na hari ng Juda.
  rationale: Inayos ang dalawang hindi likas na parirala nang hindi binabago ang kahulugan. Ang “bisig lamang ng tao” ay isang natural na Filipino na pagpapanatili ng imaheng Hebreo at ng contrast nito sa banal na tulong; ipinaliliwanag ng talababa ang literal na “bisig ng laman.” Ang “lumaban sa ating mga digmaan” ay nagpapanatili sa pandiwa at kaugnay na pangngalan ng Hebreo sa natural na Tagalog. Pinalitan din ang “nagtiwala” ng “sumandig” upang masalamin ang pandiwa ng pagsandig sa mga salita ni Hezekias.
