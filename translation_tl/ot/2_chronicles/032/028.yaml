translation:
  language: tl
  text: mga imbakan[a] para sa ani ng butil, bagong alak[b], at langis; mga silungan para sa bawat uri ng alagang hayop; at mga kulungan[c] para sa mga kawan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga lunsod na imbakan.” Maaaring tumukoy ang מִסְכְּנוֹת sa mas malalaking sentro o lunsod na pinag-iimbakan, hindi lamang sa mga gusaling imbakan.
    reason: lexical_alternative
  - marker: b
    text: Ang “bagong alak” ay salin ng תִירוֹשׁ, isang salitang madalas na ginagamit sa mga talaan ng ani at naiiba sa mas pangkalahatang mga salita para sa alak.
    reason: lexical_alternative
  - marker: c
    text: O “mga bakuran” para sa mga kawan.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִסְכְּנוֹת
  choice: mga imbakan
  rationale: Tumutukoy sa mga pasilidad na pinaglalagyan ng ani. Malinaw at likas sa modernong Filipino ang “mga imbakan,” at hindi nito nililimitahan ang laman sa butil lamang.
- source_word: תְבוּאַת דָּגָן
  choice: ani ng butil
  rationale: Ipinahahayag nito ang agrikultural na ani o bunga ng mga halamang butil sa maikli at natural na paraan.
- source_word: תִירוֹשׁ
  choice: bagong alak
  rationale: Pinananatili nito ang karaniwang pagkakaiba ng salitang ito sa mas pangkalahatang katawagan para sa alak, lalo na sa tradisyonal na hanay na butil, alak, at langis.
- source_word: יִצְהָר
  choice: langis
  rationale: Sa agrikultural na hanay na ito, tumutukoy ito sa langis, karaniwang langis ng olibo; sapat at hindi labis na nagpapaliwanag ang “langis.”
- source_word: אֻרָוֹת
  choice: mga silungan
  rationale: Tumutukoy sa mga lugar na kinalalagyan o kinakainan ng mga alagang hayop. Mas malawak ang “silungan” kaysa “kuwadra,” na maaaring ipalagay na para lamang sa kabayo.
- source_word: לְכָל בְּהֵמָה וּבְהֵמָה
  choice: para sa bawat uri ng alagang hayop
  rationale: Ang pag-uulit ng בְּהֵמָה ay may distributibong diwa. Likas na naipapahayag iyon sa Filipino bilang “bawat uri,” habang nililinaw ng “alagang hayop” na mga hayop sa sakahan ang tinutukoy.
- source_word: עֲדָרִים
  choice: mga kawan
  rationale: Karaniwang tumutukoy sa mga pangkat ng maliliit na alagang hayop gaya ng tupa at kambing. Ang “mga kawan” ay dignified at nauunawaan sa kontekstong biblikal.
- source_word: אֲוֵרוֹת
  choice: mga kulungan
  rationale: Tumutukoy sa mga bakod o nakapaloob na lugar para sa mga kawan. Natural at malinaw sa modernong Filipino ang “mga kulungan.”
