base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/018.yaml
  text: And they called out loudly in Judean to the people of Jerusalem who were on the wall, to frighten them and to terrify them, so that they might capture the city.
translation:
  language: tl
  text: At sumigaw sila nang malakas sa wikang Judio sa mga taga-Jerusalem na nasa ibabaw ng pader, upang takutin at sindakin sila, nang sa gayon ay masakop nila ang lungsod.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוּדִית
  choice: sa wikang Judio
  rationale: Tumutukoy ito sa wika ng Juda, malamang sa Hebreo o lokal na wikang ginagamit noon; pinananatili ng saling ito ang katawagang nasa pinagmulan nang hindi labis na tinutukoy ang eksaktong lingguwistikong anyo.
- source_word: לְיָרְאָם וּלְבַהֲלָם
  choice: upang takutin at sindakin sila
  rationale: 'Pinananatili ang dalawang magkaugnay ngunit magkahiwalay na pandiwa: ang una ay pagdudulot ng takot, at ang ikalawa ay matinding pagkagulat o panghihilakbot.'
- source_word: יִלְכְּדוּ
  choice: masakop nila
  rationale: Sa konteksto ng isang lungsod na kinukubkob, natural na ipinahihiwatig ng pandiwa ang pagsakop o pagbihag sa lungsod.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang sunod-sunod na layunin ng pananakot at pagsakop, gayundin ang tahasang pagbanggit sa wikang ginamit upang maunawaan ng mga nasa pader.
