  source_fidelity: Tumpak ang pangunahing retorikal na tanong, ang “mga diyos,” “mga ninuno,” “kanyang bayan,” at ang idyomang “mula sa aking kamay.” Gayunman, ang “upang” ay karaniwang nagsasaad ng layunin, samantalang ang כִּי rito ay nag-uugnay ng mapanuyang hinuha o hamon. Ang sugnay na may אֲשֶׁר הֶחֱרִימוּ ay maaaring iugnay sa “mga diyos” o sa “mga bansang ito”; hindi dapat piliting ipakahulugan sa pamamagitan ng pag-uulit ng “mga bansang.”
  naturalness: Marangal at likas sa makabagong Filipino ang salin. Mas natural at mas tumpak sa retorikal na lohika ang “na magagawa ng inyong Diyos” kaysa “upang magawa ng inyong Diyos.”
  terminology: Ang “mga diyos,” “Diyos,” “mga ninuno,” “bayan,” at “pagkalipol” ay angkop. Pinananatili ng talababa ang natatanging bigat ng חרם nang hindi nagdaragdag ng teolohikal na paghatol.
