  edition: WLC
  text: מִ֠י בְּֽ/כָל אֱלֹהֵ֞י הַ/גּוֹיִ֤ם הָ/אֵ֨לֶּה֙ אֲשֶׁ֣ר הֶחֱרִ֣ימוּ אֲבוֹתַ֔/י אֲשֶׁ֣ר יָכ֔וֹל לְ/הַצִּ֥יל אֶת עַמּ֖/וֹ מִ/יָּדִ֑/י כִּ֤י יוּכַל֙ אֱלֹ֣הֵי/כֶ֔ם לְ/הַצִּ֥יל אֶתְ/כֶ֖ם מִ/יָּדִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/014.yaml
  text: Who among all the gods of these nations that my fathers devoted to destruction was able to deliver his people from my hand[a], that your God should be able to deliver you from my hand?
translation:
  language: tl
  text: Sino sa lahat ng diyos ng mga bansang ito na itinalaga ng aking mga ninuno sa pagkalipol[a] ang nakayang magligtas sa kanyang bayan mula sa aking kamay, na magagawa ng inyong Diyos na iligtas kayo mula sa aking kamay?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nilipol” o “isinailalim sa ganap na paglipol.” Ang pandiwang Hebreo ay tumutukoy sa pagtatalaga ng isang bagay o bayan sa pagwasak.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי בְּכָל אֱלֹהֵי הַגּוֹיִם הָאֵלֶּה
  choice: Sino sa lahat ng mga diyos ng mga bansang ito
  rationale: Ang “sino sa lahat” ay likas na partitive na tanong sa Tagalog at pinananatili ang mapanuyang hamon ng nagsasalita. Isinalin nang tuwiran ang אֱלֹהֵי bilang “mga diyos” nang walang idinagdag na editoryal na paglalarawan.
- source_word: אֲשֶׁר הֶחֱרִימוּ אֲבוֹתַי
  choice: mga bansang itinalaga ng aking mga ninuno sa pagkalipol
  rationale: 'Ang חרם ay higit sa karaniwang pagwasak: ipinahahayag nito ang pagtatalaga o pagsasailalim sa lubos na paglipol. Nilinaw ng pag-uulit na “mga bansang” ang natural na kaugnayan ng sugnay sa pinakamalapit na makatuwirang antecedent, nang hindi sinasabing ang mga diyos mismo ang nilipol.'
- source_word: אֲבוֹתַי
  choice: aking mga ninuno
  rationale: Sa retorika ng hari, tumutukoy ito sa mga nauna sa kanya o mga ninuno. Mas natural at malinaw sa modernong Tagalog ang “mga ninuno” kaysa literal na “mga ama.”
- source_word: יָכוֹל לְהַצִּיל
  choice: nakapagligtas
  rationale: Ipinahahayag ng anyong ito ang aktuwal na kakayahang magligtas sa nakaraang sitwasyon at ang retorikal na paghamon.
- source_word: עַמּוֹ
  choice: kanyang bayan
  rationale: Ang bawat diyos ay tinutukoy bilang isang indibiduwal sa tanong, kaya ang panghalip ay isahan. Ang “bayan” ay angkop sa kolektibong kahulugan ng עם sa kontekstong pambansa.
- source_word: מִיָּדִי
  choice: mula sa aking kamay
  rationale: Pinananatili ang malinaw na metapora ng kamay bilang kapangyarihan o kontrol, sa halip na palitan ito agad ng pagpapakahulugan.
- source_word: כִּי יוּכַל אֱלֹהֵיכֶם
  choice: upang magawa ng inyong Diyos
  rationale: 'Ipinapakita ng “upang” ang mapanuyang lohika ng bunga o paghihinuha: walang naunang diyos na nakapagligtas, kaya hinahamon ang posibilidad na magagawa ito ng Diyos ng Juda. Hindi ito ginawang payak na pahayag ng hinaharap.'
- source_word: לְהַצִּיל אֶתְכֶם
  choice: na iligtas kayo
  rationale: Ginamit ang “iligtas” nang pareho sa dalawang paglitaw ng נצל, ayon sa kontekstong militar ng pagliligtas mula sa kapangyarihan ng kaaway.
theological_decisions:
- issue: Kahulugan ng חרם sa mapanuyang pananalita ng haring Asiryano
  choice: itinalaga ... sa pagkalipol
  alternative: nilipol; isinailalim sa pagbabawal
  rationale: Pinananatili nito ang natatanging diwa ng paghahandog o pagtatalaga tungo sa ganap na pagwasak, nang hindi ito pinapantay sa pangkaraniwang “sinira” at nang hindi gumagamit ng teknikal ngunit di-likas na “ban.”
- issue: Pagtukoy sa mga diyos ng ibang mga bansa
  choice: mga diyos
  alternative: mga diumano'y diyos; mga diyus-diyosan
  rationale: Tuwirang “mga diyos” ang sabi ng nagsasalita. Hindi dapat dagdagan ng salin ang teolohikal na pagtatama o editoryal na paghusga na wala sa mismong pananalita.
- issue: Pagpapanatili sa mapanuyang pag-aangkin na kaya ng hari ang hindi kaya ng mga diyos
  choice: isang retorikal na tanong na nag-uugnay sa dalawang bahagi
  alternative: dalawang magkahiwalay na tanong
  rationale: 'Pinananatili ang sintaktikong ugnayan at teolohikal na tensiyon ng Hebreo: ginagamit ng nagsasalita ang sinapit ng ibang mga bansa upang hamunin ang kakayahan ng Diyos ng Juda, nang hindi sinasang-ayunan ng tagapagsalaysay ang kanyang pag-aangkin.'
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “mga ninuno” para sa malinaw na royal/ancestral sense, “bayan” para sa kolektibong sambayanan, at pinanatili ang idyomang “mula sa aking kamay.” Ang mga gitling-pahaba ay tumutulong na malinaw na iugnay ang sugnay tungkol sa pagkalipol sa mga bansa.
