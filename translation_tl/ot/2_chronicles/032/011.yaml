base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/011.yaml
  text: Is not Hezekiah misleading you[a], to give you over to die by famine and by thirst, saying, ‘Yahweh our God will deliver us from the hand of the king of Assyria’?”
translation:
  language: tl
  text: Hindi ba kayo inililigaw ni Ezequias[a] upang ibigay kayo sa kamatayan sa pamamagitan ng taggutom at uhaw, sa pagsasabing, ‘Ililigtas tayo ni Yahweh na ating Diyos mula sa kamay ng hari ng Asiria’?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “dinadaya kayo” o “inuudyukan kayo.” Ang pandiwang Hebreo ay maaaring mangahulugang pag-akay sa isang tao sa maling landas o maling panghihikayat.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: Hindi ba
  rationale: Pinananatili ang retorikal na tanong na naghihintay ng pagsang-ayon at ang maparatang na tono.
- source_word: מַסִּית
  choice: inililigaw
  rationale: Ipinahihiwatig ng Hiphil ng סות ang pag-akay sa iba tungo sa maling paniniwala o landas; natural ito sa modernong Tagalog nang hindi nililimitahan sa tahasang panlilinlang o pang-uudyok.
- source_word: לָתֵת אֶתְכֶם לָמוּת
  choice: upang pabayaan kayong mamatay
  rationale: Ipinapahayag ang pagbibigay sa mga tao sa kapalarang kamatayan. Mas natural sa Tagalog ang 'pabayaan kayong mamatay' kaysa literal na 'ibigay kayo upang mamatay,' habang pinananatili ang layuning ibinibintang kay Ezequias.
- source_word: בְּרָעָב וּבְצָמָא
  choice: sa gutom at uhaw
  rationale: Tumutukoy sa mga paraan ng kamatayan sa kalagayan ng pagkubkob. Ang 'gutom' ay mas karaniwang natural sa Tagalog at maaari ring saklawin ang matinding kakulangan ng pagkain.
- source_word: לֵאמֹר
  choice: sa pagsasabing
  rationale: Malinaw at natural na ipinakikilala ang siniping pahayag bilang paraan ng diumano'y panliligaw.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Direktang tinutumbasan ang personal na pangalang tetragrammaton sa pamamagitan ng transliterasyon, sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֵינוּ
  choice: ating Diyos
  rationale: Pinananatili ang panghalip na unang panauhang maramihan at ang pag-aangking tipanan sa loob ng sipi.
- source_word: יַצִּילֵנוּ
  choice: Ililigtas tayo
  rationale: Ang Hiphil ng נצל ay nangangahulugang sagipin o iligtas mula sa kapangyarihan o panganib; akma ang 'ililigtas' sa militar at teolohikal na konteksto.
- source_word: מִכַּף
  choice: mula sa kamay ng
  rationale: Pinananatili ang malinaw at nauunawaang Hebreong idyoma para sa kapangyarihan o kontrol.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: hari ng Asiria
  rationale: Likas at tuwirang salin ng construct chain sa Tagalog.
theological_decisions:
- issue: Paglalarawan sa motibo ni Ezequias
  choice: inililigaw
  alternative: dinadaya / inuudyukan
  rationale: Hindi nilulutas nang higit sa teksto kung sinasabi ng tagapagsalita na sadyang nandaraya si Ezequias o maling nanghihikayat lamang; ang 'inililigaw' ay nagpapanatili ng saklaw ng pandiwa.
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehova
  rationale: Nasa teksto ang personal na pangalang יְהוָה; pinananatili ito bilang pangalan sa transliterasyong 'Yahweh' sa halip na palitan ng titulo.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang 'Ezequias' at 'Asiria,' mga anyong pamilyar sa tradisyong Biblikal sa Tagalog, habang pinanatiling natural ang sintaks at malinaw ang maparatang na retorikal na tanong.
