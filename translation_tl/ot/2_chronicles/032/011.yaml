  naturalness: Natural at marangal ang kabuuang Tagalog. Ang "ibigay kayo sa kamatayan sa pamamagitan ng taggutom at uhaw" ay malinaw na modernong Filipino habang mas malapit sa puwersa ng pinagmulan.
  terminology: Ang "Ezequias," "Yahweh," "Diyos," at "Asiria" ay angkop at magkakatugma. Ang talababa ay angkop na nagpapakita ng mga alternatibong saklaw ng "inililigaw" nang hindi nagsasara sa isang interpretasyon.
