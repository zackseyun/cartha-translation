  to: Hindi ba kayo inililigaw ni Ezequias[a] upang ibigay kayo sa kamatayan sa pamamagitan ng taggutom at uhaw, sa pagsasabing, ‘Ililigtas tayo ni Yahweh na ating Diyos mula sa kamay ng hari ng Asiria’?
