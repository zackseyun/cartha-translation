revisions:
- from: Pagkatapos ng mga bagay na ito at ng katapatang ito[a], dumating si Senakerib na hari ng Asiria at pumasok sa Juda. Nagkampo siya laban sa mga napapaderang lungsod at binalak na pasukin ang mga iyon para mapasakanya.[b]
  to: Pagkatapos ng mga pangyayaring ito at ng katapatang ito[a], dumating si Senakerib na hari ng Asiria at pumasok sa Juda. Nagkampo siya laban sa mga napapaderang lungsod at binalak na pasukin ang mga ito upang maagkin niya ang mga ito.[b]
  rationale: Ang rebisyon ay para lamang sa likas na modernong Tagalog at sa paglilinaw ng pangwakas na idiomang Hebreo. Hindi nito binabago ang pagkakasunod-sunod, antas ng katiyakan, o kahulugan ng pinagmulan.
