base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/001.yaml
  text: After these things and this faithfulness[a], Sennacherib king of Assyria came and entered Judah[c][b], and he encamped against the fortified cities and intended to break into them for himself.
translation:
  language: tl
  text: Pagkatapos ng mga pangyayaring ito at ng katapatang ito[a], dumating si Senakerib na hari ng Asiria at pumasok sa Juda. Nagkampo siya laban sa mga napapaderang lungsod at binalak na pasukin ang mga ito upang maagkin niya ang mga ito.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “at ng katotohanang ito” o “at ng mga tapat na gawaing ito.” Ang salitang Hebreo ay maaaring mangahulugang “katotohanan” o “katapatan”; dito, malamang na tumutukoy ito sa tapat na pagkilos ni Hezekias na isinalaysay sa naunang bahagi.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “at binalak na puwersahang pasukin ang mga ito.” Ang huling parirala sa Hebreo ay nagpapahayag ng layunin ni Senakerib na buksan o pasukin ang mga pinatibay na lungsod upang maagkin ang mga ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֲרֵי הַדְּבָרִים
  choice: Pagkatapos ng mga bagay na ito
  rationale: Pinananatili ang malawak na pagsangguni ng דְּבָרִים sa naunang mga pangyayari at ang temporal na diwa ng אַחֲרֵי.
- source_word: וְהָאֱמֶת הָאֵלֶּה
  choice: at ng katapatang ito
  rationale: Ang אֱמֶת ay maaaring mangahulugang katotohanan o katapatan; sa konteksto, malamang na tumutukoy ito sa tapat na pagkilos ni Hezekias, habang pinananatili ng talababa ang tunay na leksikal na posibilidad.
- source_word: סַנְחֵרִיב מֶלֶךְ אַשּׁוּר
  choice: si Senakerib na hari ng Asiria
  rationale: Gumagamit ng nakaugaliang makabagong anyong Tagalog ng pangalan at tuwirang isinasalin ang titulong maharlika.
- source_word: וַיָּבֹא בִיהוּדָה
  choice: pumasok sa Juda
  rationale: Malinaw na ipinahahayag ang paggalaw papasok sa lupain na minamarkahan ng בְּ.
- source_word: וַיִּחַן עַל
  choice: Nagkampo siya laban sa
  rationale: Tuwirang inilalarawan ang pagtatayo ng kampo laban sa isang target nang hindi pa ipinapalagay ang mas interpretatibong 'kinubkob.'
- source_word: הֶעָרִים הַבְּצֻרוֹת
  choice: mga napapaderang lungsod
  rationale: Natural at malinaw na Filipino para sa mga lungsod na may pananggalang o muog.
- source_word: וַיֹּאמֶר לְבִקְעָם אֵלָיו
  choice: at binalak na pasukin ang mga iyon para mapasakanya
  rationale: Ang וַיֹּאמֶר ay idiomatikong naghahayag ng balak; ang בקע ay pagwasak o pagbubukas upang makapasok, at ang אֵלָיו ay nagpapahiwatig ng pag-angkin o pakinabang para sa sarili.
