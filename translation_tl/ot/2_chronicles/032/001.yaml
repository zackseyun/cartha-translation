translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog. Hinati sa dalawang pangungusap ang mahabang Hebreong sugnay para sa likas na daloy, nang hindi binabago ang pagkakasunod-sunod o ugnayan ng mga pangyayari. Ginamit ang “napapaderang” bilang karaniwang paglalarawan sa fortified cities at iniwasan ang mas interpretatibong “kinubkob.”
