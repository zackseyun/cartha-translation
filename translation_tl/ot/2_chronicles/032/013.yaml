  text: הֲ/לֹ֣א תֵדְע֗וּ מֶ֤ה עָשִׂ֨יתִי֙ אֲנִ֣י וַ/אֲבוֹתַ֔/י לְ/כֹ֖ל עַמֵּ֣י הָ/אֲרָצ֑וֹת הֲ/יָכ֣וֹל יָֽכְל֗וּ אֱלֹהֵי֙ גּוֹיֵ֣ הָ/אֲרָצ֔וֹת לְ/הַצִּ֥יל אֶת אַרְצָ֖/ם מִ/יָּדִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/013.yaml
  text: Do you not know what I and my fathers have done to all the peoples of the lands? Were the gods of the nations of the lands at all able to deliver their land from my hand?[a]
translation:
  language: tl
  text: “Hindi ba ninyo alam kung ano ang ginawa ko at ng aking mga ninuno sa lahat ng mamamayan ng mga lupain? May kakayahan ba talagang iligtas ng mga diyos ng mga bansa sa mga lupaing iyon ang kanilang lupain mula sa aking kamay?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “aking mga ama.” Gumagamit ang Hebreo ng pananalitang pampamilya na tumutukoy rito sa mga ninuno o naunang kasapi ng dinastiya.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא תֵדְעוּ
  choice: Hindi ba ninyo alam
  rationale: Pinananatili ang retorikal na tanong na umaasang sasang-ayon ang kausap, sa natural na modernong Tagalog.
- source_word: מֶה עָשִׂיתִי
  choice: kung ano ang ginawa ko
  rationale: Tumutukoy sa natapos na mga gawa na ginagamit ngayon bilang batayan ng pagyayabang; natural sa Tagalog ang aspektong perpektibo.
- source_word: אֲנִי וַאֲבוֹתַי
  choice: ako at ang aking mga ninuno
  rationale: Sa kontekstong dinastiko, ang אבות ay tumutukoy sa mga naunang salinlahi o maharlikang nauna sa nagsasalita. Mas malinaw sa karaniwang mambabasa ang “mga ninuno” kaysa literal na “mga ama.”
- source_word: לְכֹל עַמֵּי הָאֲרָצוֹת
  choice: sa lahat ng mga bayan sa iba’t ibang lupain
  rationale: Ipinakikita ang maramihang konkretong lupain at ang mga bayang naninirahan sa mga iyon, nang hindi pinapantay ang הָאֲרָצוֹת sa buong daigdig.
- source_word: הֲיָכוֹל יָכְלוּ
  choice: Talaga bang nailigtas
  rationale: Ang infinitive absolute kasama ng finite verb ay nagbibigay-diin sa kakayahan. Naipahihiwatig ng “Talaga bang” ang mariing, mapanuyang tanong sa natural na Tagalog.
- source_word: אֱלֹהֵי גּוֹיֵ הָאֲרָצוֹת
  choice: mga diyos ng mga bansang iyon
  rationale: Tuwirang isinasalin ang אֱלֹהֵי bilang “mga diyos” at malinaw na iniuugnay ang mga bansa sa naunang binanggit na mga lupain.
- source_word: לְהַצִּיל אֶת־אַרְצָם
  choice: nailigtas ... ang kanilang lupain
  rationale: Ang נצל ay angkop na “iligtas” sa konteksto ng panganib at pananakop; pinananatili ng “kanilang lupain” ang kolektibong anyo ng Hebreo.
- source_word: מִיָדִי
  choice: mula sa aking kamay
  rationale: Pinananatili ang malinaw na Hebreong metapora ng kamay bilang kapangyarihan o kontrol.
theological_decisions:
- issue: Ang pagtukoy sa “mga diyos” sa pagyayabang ng isang paganong hari
  choice: Isinalin nang tuwiran bilang “mga diyos,” nang walang dagdag na pang-uri.
  alternative: “mga tinatawag na diyos” o “mga huwad na diyos”
  rationale: Inihahayag ng talata ang mapanuyang pag-angkin ng nagsasalita. Hindi dapat ipasok sa mismong salin ang teolohikal na komentaryong wala sa Hebreo.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “ninuno” para sa malinaw na dinastikong kahulugan, habang inilagay sa talababa ang mas literal na “mga ama.” Napanatili ang mapanuyang diin ng dalawang retorikal na tanong at ang metaporang “mula sa aking kamay.”
