revisions:
- from: “Hindi ba ninyo alam kung ano ang ginawa ko at ng aking mga ninuno sa lahat ng mga bayan sa iba’t ibang lupain? Talaga bang nailigtas ng mga diyos ng mga bansang iyon ang kanilang lupain mula sa aking kamay?”[a]
  to: “Hindi ba ninyo alam kung ano ang ginawa ko at ng aking mga ninuno sa lahat ng mamamayan ng mga lupain? May kakayahan ba talagang iligtas ng mga diyos ng mga bansa sa mga lupaing iyon ang kanilang lupain mula sa aking kamay?”[a]
  rationale: Inayos ang ikalawang retorikal na tanong upang malinaw na isalin ang mariing diin ng Hebreo sa kakayahan ng mga diyos na magligtas, hindi lamang sa resulta ng isang pagliligtas. Pinalitan din ang “mga bayan” ng “mga mamamayan” upang maipakita ang עַמֵּי nang walang kalabuan. Nananatili ang dinastikong “mga ninuno,” ang plural na “mga lupain,” ang walang-kwalipikasyong “mga diyos,” at ang metaporang “mula sa aking kamay.”
