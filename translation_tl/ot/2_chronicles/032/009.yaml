translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Hinati sa maiikling pangungusap ang mahabang estrukturang Hebreo para sa linaw, habang pinanatili ang mapanlabang direksiyon ng utos at ang leksikal na kalabuan ng mga pariralang militar. Ginamit ang tradisyonal at karaniwang anyong Filipino ng mga pangalang Senaquerib, Asiria, Lakis, Ezequias, at Juda.
