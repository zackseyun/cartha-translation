  to: Pagkatapos nito, ipinadala ni Senaquerib, na hari ng Asiria, ang kanyang mga lingkod sa Jerusalem—habang siya ay nasa harap ng Lakis[a], kasama ang buong nasasakupan niya[b]—laban kay Ezequias na hari ng Juda at laban sa lahat ng taga-Juda na nasa Jerusalem, na sinasabi,
