  - severity: medium
    issue: Ang “buong kapangyarihang nasasakupan niya” ay malabo at hindi natural.
    rationale: Ang מֶמְשָׁלָה ay maaaring tumukoy sa paghahari, kapangyarihan, o nasasakupan/realm. Hindi malinaw ang pinagsamang “kapangyarihang nasasakupan.” Ang “buong nasasakupan niya” ay tuwirang salin na may talababa para sa kontekstuwal na kahulugang “hukbo.”
  - severity: low
    issue: Hindi kailangan at nakapagpapabigat ang pag-uulit na “nagsugo ... Isinugo niya sila.”
    rationale: Iisang kilos ng pagpapadala ang nasa Hebreo. Ang pag-uugnay ng mga parirala sa isang pangungusap ay mas matapat sa estruktura at mas maayos sa Tagalog.
