base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/009.yaml
  text: After this[a], Sennacherib king of Assyria sent his servants to Jerusalem—while he was before Lachish with all his dominion with him—against Hezekiah king of Judah and against all Judah who were in Jerusalem, saying[b],
translation:
  language: tl
  text: Pagkatapos nito, ipinadala ni Senaquerib, na hari ng Asiria, ang kanyang mga lingkod sa Jerusalem—habang siya ay nasa harap ng Lakis[a], kasama ang buong nasasakupan niya[b]—laban kay Ezequias na hari ng Juda at laban sa lahat ng taga-Juda na nasa Jerusalem, na sinasabi,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nakapuwesto laban sa Lakis” o “kinukubkob ang Lakis.” Literal na “laban sa Lakis” ang Hebreo, isang pananalitang militar.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “kasama ang lahat ng kanyang hukbo.” Ang Hebreong salita ay maaaring tumukoy sa kanyang pamamahala o nasasakupan, o, sa kontekstong ito, sa buong puwersang nasa ilalim ng kanyang kapangyarihan.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחַר זֶה
  choice: Pagkatapos nito
  rationale: Likas na panandang temporal sa modernong Tagalog at pinananatili ang pagkakasunod-sunod ng salaysay.
- source_word: שָׁלַח
  choice: nagsugo
  rationale: Angkop sa hari na nagpapadala ng mga tauhan at malinaw sa kasalukuyang Tagalog.
- source_word: עֲבָדָיו
  choice: kanyang mga lingkod
  rationale: Pinananatili ang batayang kahulugan ng עבד; maaaring mga opisyal sila sa kontekstong maharlika, ngunit hindi kailangang gawing mas tiyak ang salin.
- source_word: יְרוּשָׁלַיְמָה
  choice: sa Jerusalem
  rationale: Ipinapahayag ng directional he ang pagpunta patungo sa Jerusalem; sapat at natural ang “sa Jerusalem” pagkatapos ng “nagsugo.”
- source_word: וְהוּא עַל לָכִישׁ
  choice: nakikipagdigma siya laban sa Lakis
  rationale: Ang עַל kasama ng pangalan ng lungsod sa kontekstong militar ay nagpapahiwatig ng mapanlabang pagkilos. Iniiwasan nitong tukuyin nang labis na tiyak na pagkubkob ang mismong kilos.
- source_word: וְכָל מֶמְשַׁלְתּוֹ עִמּוֹ
  choice: kasama ang buong kapangyarihang nasasakupan niya
  rationale: Sinisikap nitong panatilihin ang saklaw ng מֶמְשָׁלָה bilang pamamahala, kapangyarihan, o nasasakupan, habang nananatiling mauunawaan sa kontekstong militar.
- source_word: עַל יְחִזְקִיָּהוּ ... וְעַל כָּל יְהוּדָה
  choice: laban kay Ezequias ... at laban sa lahat ng taga-Juda
  rationale: Pinananatili ang mapanlabang diwa ng inuulit na עַל sa konteksto, sa halip na ilarawan lamang ang neutral na pagpapahatid ng mensahe.
- source_word: אֲשֶׁר בִּירוּשָׁלִַם
  choice: na nasa Jerusalem
  rationale: Malinaw nitong tinutukoy ang mga taga-Juda na naroon sa Jerusalem.
- source_word: לֵאמֹר
  choice: na sinasabi,
  rationale: Karaniwang panimula sa tuwirang pananalita na magpapatuloy sa susunod na talata.
