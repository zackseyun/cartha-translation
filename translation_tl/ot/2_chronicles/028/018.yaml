  text: וּ/פְלִשְׁתִּ֣ים פָּשְׁט֗וּ בְּ/עָרֵ֨י הַ/שְּׁפֵלָ֣ה וְ/הַ/נֶּגֶב֮ לִֽ/יהוּדָה֒ וַֽ֠/יִּלְכְּדוּ אֶת בֵּֽית שֶׁ֨מֶשׁ וְ/אֶת אַיָּל֜וֹן וְ/אֶת הַ/גְּדֵר֗וֹת וְ/אֶת שׂוֹכ֤וֹ וּ/בְנוֹתֶ֨י/הָ֙ וְ/אֶת תִּמְנָ֣ה וּ/בְנוֹתֶ֔י/הָ וְ/אֶת גִּמְז֖וֹ וְ/אֶת בְּנֹתֶ֑י/הָ וַ/יֵּשְׁב֖וּ שָֽׁם־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/018.yaml
  text: And the Philistines had raided the cities of the lowland and the Negeb of Judah[a], and they captured Beth-shemesh, Aijalon, Gederoth, Soko and its villages, Timnah and its villages, and Gimzo and its villages; and they settled there.
translation:
  language: tl
  text: Sinalakay ng mga Filisteo ang mga bayan sa mababang lupain at sa Negev ng Juda, at sinakop nila ang Bet-semes, Aijalon, Gederot, Soco at ang mga nayong sakop nito, Timna at ang mga nayong sakop nito, at Gimzo at ang mga nayong sakop nito. At nanirahan sila roon.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּפְלִשְׁתִּים פָּשְׁטוּ
  choice: Sinalakay ng mga Filisteo
  rationale: Sa kontekstong militar, ang פָּשַׁט ay tumutukoy sa pagsalakay o pandarambong. Likas sa modernong Tagalog ang aktibong ayos na ito, at hindi kailangang ipilit ang pang-ugnay na ו bilang “At” sa simula.
- source_word: בְּעָרֵי הַשְּׁפֵלָה
  choice: ang mga bayan sa mababang lupain
  rationale: Ang הַשְּׁפֵלָה ay heograpikong rehiyon ng mababang lupain o paanan ng mga burol sa kanlurang Juda. Malinaw sa karaniwang mambabasa ang “mababang lupain,” samantalang pinananatili ng “mga bayan” ang saklaw ng עָרֵי.
- source_word: וְהַנֶּגֶב לִיהוּדָה
  choice: at sa Negev ng Juda
  rationale: Ang נֶגֶב ay pangalan ng isang heograpikong rehiyon, kaya tinumbasan ito bilang “Negev” sa halip na gawing simpleng “timog.” Ang לִיהוּדָה ay nagpapakitang ang mga lugar na ito ay sakop ng Juda.
- source_word: וַיִּלְכְּדוּ
  choice: Sinakop nila
  rationale: Sa pagkuha ng mga bayan sa digmaan, ang לָכַד ay nangangahulugang sakupin o bihagin. Mas natural ang “sinakop” para sa mga lugar.
- source_word: בֵּית שֶׁמֶשׁ / אַיָּלוֹן / הַגְּדֵרוֹת / שׂוֹכוֹ / תִּמְנָה / גִּמְזוֹ
  choice: Bet-semes / Aijalon / Gederot / Soco / Timna / Gimzo
  rationale: Isinalin sa konsistenteng anyong Filipino ang mga pangalang pantangi, habang malapit pa rin sa tunog ng Hebreo. Ginamit ang “Soco” bilang lehitimong transliterasyon ng שׂוֹכוֹ; walang tekstuwal na alternatibo sa talata na nangangailangan ng talababa.
- source_word: וּבְנוֹתֶיהָ / בְּנֹתֶיהָ
  choice: at ang mga nayong sakop nito
  rationale: Literal itong “mga anak na babae nito,” ngunit idyoma ito para sa maliliit at nakadependeng pamayanan sa paligid ng isang pangunahing bayan. Inihahayag ng “mga nayong sakop nito” ang ugnayang iyon nang malinaw.
- source_word: וַיֵּשְׁבוּ שָׁם
  choice: Pagkatapos, nanirahan sila roon
  rationale: Ang יָשַׁב dito ay tumutukoy sa paninirahan ng mga Filisteo sa mga nasakop na lugar. Ipinahihiwatig ng “Pagkatapos” ang kasunod na pangyayari nang hindi dinaragdagan ang teolohikal na diwa.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Hinati sa tatlong pangungusap ang mahabang sugnay na Hebreo upang maging malinaw ang daloy at listahan ng mga bayan. Hindi isinama ang talababa ng English POB na “Or Soco” sapagkat mali ang pagkakabit nito sa English text at isa lamang itong alternatibong baybay, hindi tunay na leksikal o tekstuwal na kalabuan sa Hebreo.
