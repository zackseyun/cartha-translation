base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/024.yaml
  text: Ahaz gathered the vessels of the house of God and cut up the vessels of the house of God, and he shut the doors of the house of the LORD and made for himself altars in every corner of Jerusalem.
translation:
  language: tl
  text: Tinipon ni Ahaz ang mga kagamitan ng bahay ng Diyos at pinutol-putol niya ang mga kagamitan ng bahay ng Diyos. Isinara niya ang mga pinto ng bahay ng PANGINOON at gumawa siya ng mga altar para sa sarili niya sa bawat sulok ng Jerusalem.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֶּאֱסֹף
  choice: Tinipon
  rationale: Tuwirang ipinapahayag ang pagtipon o pagkolekta ni Ahaz sa mga kagamitan.
- source_word: כְּלֵי בֵית הָאֱלֹהִים
  choice: mga kagamitan sa bahay ng Diyos
  rationale: Ang כְּלֵי ay malawak na tumutukoy sa mga sisidlan o kagamitang ginagamit sa templo; ang 'mga kagamitan' ay likas at hindi labis na nagpapakitid ng kahulugan.
- source_word: וַיְקַצֵּץ
  choice: pinagputul-putol
  rationale: Ang pandiwa ay nagsasaad ng pagputol o paghiwa-hiwalay; pinananatili nito ang marahas at sinasadyang pagsira sa mga kagamitan.
- source_word: בֵּית יְהוָה
  choice: bahay ng PANGINOON
  rationale: Ginagamit ang nakaugaliang representasyon ng banal na pangalang YHWH bilang PANGINOON, habang pinananatili ang 'bahay' bilang termino para sa templo.
- source_word: מִזְבְּחוֹת
  choice: mga altar
  rationale: Karaniwan at malinaw na salitang Filipino para sa mga dambanang pinaghahandugan.
- source_word: בְּכָל פִּנָּה
  choice: sa bawat sulok
  rationale: Pinananatili ang konkretong larawan ng Hebreo at ang diwang laganap ang mga altar sa Jerusalem.
theological_decisions:
- issue: Paglalarawan sa gusaling banal
  choice: bahay ng Diyos / bahay ng PANGINOON
  alternative: templo ng Diyos / templo ng PANGINOON
  rationale: Pinananatili ang magkaparehong salitang Hebreo na בֵּית at ang pagbabago mula אֱלֹהִים tungo sa banal na pangalang יהוה, nang hindi ipinapantay ang dalawang parirala.
- issue: Layunin ng mga altar
  choice: Hindi tinukoy kung para kaninong pagsamba ang mga altar
  alternative: mga altar para sa ibang mga diyos
  rationale: Hindi tahasang sinasabi ng talata ang pinag-alayan ng mga altar; iniiwasang idagdag mula sa konteksto ang hindi nakasaad sa mismong teksto.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginawang panghalip ang ikalawang pagbanggit sa 'mga kagamitan sa bahay ng Diyos' upang maging likas sa Tagalog nang hindi binabago ang referent. Ang 'nagpagawa siya' ay natural na causative rendering ng וַיַּעַשׂ לוֹ at hindi kinakailangang mangahulugang siya mismo ang pisikal na gumawa.
