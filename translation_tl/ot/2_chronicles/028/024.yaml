  to: Tinipon ni Ahaz ang mga kagamitan ng bahay ng Diyos at pinutol-putol niya ang mga kagamitan ng bahay ng Diyos. Isinara niya ang mga pinto ng bahay ng PANGINOON at gumawa siya ng mga altar para sa sarili niya sa bawat sulok ng Jerusalem.
