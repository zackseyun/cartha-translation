source:
  edition: WLC
  text: וַ/יַּהֲרֹג֩ פֶּ֨קַח בֶּן רְמַלְיָ֜הוּ בִּֽ/יהוּדָ֗ה מֵאָ֨ה וְ/עֶשְׂרִ֥ים אֶ֛לֶף בְּ/י֥וֹם אֶחָ֖ד הַ/כֹּ֣ל בְּנֵי חָ֑יִל בְּ/עָזְבָ֕/ם אֶת יְהוָ֖ה אֱלֹהֵ֥י אֲבוֹתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/006.yaml
  text: And Pekah son of Remaliah killed in Judah one hundred twenty thousand in a single day[a], all of them valiant men, because they had forsaken Yahweh[c][b], the God of their fathers.
translation:
  language: tl
  text: At pumatay si Peka na anak ni Remalias ng 120,000 katao sa Juda sa loob ng isang araw[a]. Lahat sila ay magigiting na mandirigma[b]. Nangyari ito dahil tinalikuran nila si Yahweh[c], ang Diyos ng kanilang mga ninuno.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa isang araw.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “mga anak ng lakas”; ibig sabihin, magigiting na lalaking mandirigma.
    reason: lexical_alternative
  - marker: c
    text: O “nang talikuran nila si Yahweh.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּהֲרֹג
  choice: pumatay
  rationale: Tuwirang ipinapahayag ng הרג ang pagpatay; natural at malinaw ang “pumatay” sa modernong Filipino.
- source_word: בִּיהוּדָה
  choice: sa Juda
  rationale: Ang בְּ ay panandang panlunan dito, at “Juda” ang karaniwang tawag sa kaharian o lupain sa panahong ito.
- source_word: מֵאָה וְעֶשְׂרִים אֶלֶף
  choice: 120,000 katao
  rationale: Tuwirang bilang ito; idinagdag ang “katao” upang maging malinaw at natural sa Filipino ang tinutukoy na mga napatay.
- source_word: בְּיוֹם אֶחָד
  choice: sa loob ng isang araw
  rationale: Natural na katumbas ng literal na “sa isang araw” at naipakikita ang lawak ng pangyayari nang hindi dinaragdagan ang kahulugan.
- source_word: הַכֹּל
  choice: Lahat sila
  rationale: Binubuod nito ang lahat ng 120,000 na naunang binanggit.
- source_word: בְּנֵי חָיִל
  choice: magigiting na mandirigma
  rationale: Literal itong “mga anak ng lakas/katapangan,” isang idyomang tumutukoy sa matatapang at may kakayahang lalaking mandirigma; natural at malinaw ang salin.
- source_word: בְּעָזְבָם
  choice: dahil tinalikuran nila
  rationale: Maaaring sanhi o kasabay na pangyayari ang בְּ + infinitive construct. Ang sanhi ang mas angkop sa paliwanag ng talata, habang itinatala sa talababa ang temporal na posibilidad.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang Hebreo sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֵי אֲבוֹתָם
  choice: ang Diyos ng kanilang mga ninuno
  rationale: Tumpak at natural na modernong Filipino para sa pormulang tumutukoy sa Diyos na sinamba ng mga naunang salinlahi ng Israel.
theological_decisions:
- issue: Kabuluhan ng בְּעָזְבָם kaugnay ng pagpatay
  choice: 'Sanhi: “dahil tinalikuran nila”'
  alternative: 'Panahon o kasabay na pangyayari: “nang talikuran nila”'
  rationale: Pinahihintulutan ng Hebreo ang dalawang ugnayan. Umaayon sa konteksto ng Mga Cronica ang sanhi, kung saan ipinaliliwanag ang pagkatalo bilang bunga ng pagtatakwil kay Yahweh, ngunit pinananatili sa talababa ang tunay na alternatibo.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at madaling maunawaan. Ginamit ang “Yahweh” para sa pangalan ng Diyos. Ang hiwalay na pangungusap para sa הַכֹּל בְּנֵי חָיִל ay nagpapalinaw sa mahabang pangungusap nang hindi binabago ang lohika nito; pinanatili ng mga talababa ang literal at alternatibong pagbasa.
