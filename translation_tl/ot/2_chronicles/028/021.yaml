id: 2CH.28.21
reference: 2 Chronicles 28:21
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: כִּֽי חָלַ֤ק אָחָז֙ אֶת בֵּ֣ית יְהוָ֔ה וְ/אֶת בֵּ֥ית הַ/מֶּ֖לֶךְ וְ/הַ/שָּׂרִ֑ים וַ/יִּתֵּן֙ לְ/מֶ֣לֶךְ אַשּׁ֔וּר וְ/לֹ֥א לְ/עֶזְרָ֖ה לֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/021.yaml
  text: For Ahaz plundered the house of Yahweh[a], and the house of the king and the princes, and gave it to the king of Assyria[c][b], but it did not help him.
translation:
  language: tl
  text: Sapagkat sinamsaman ni Ahaz ang bahay ni Yahweh[a], ang bahay ng hari, at ang mga pinuno[b], at ibinigay niya ang mga nasamsam sa hari ng Asiria; ngunit hindi iyon nakatulong sa kanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “sinamsaman” ay maaari ring isaling “hinati” o “ibinahagi”; sa kontekstong ito, ang diwa ay kinuha ni Ahaz ang mahahalagang pag-aari mula sa mga ito.
    reason: lexical_alternative
  - marker: b
    text: O “mga opisyal” o “mga maharlika.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikita ang paliwanag o dahilan kaugnay ng naunang pahayag, habang nananatiling natural ang daloy sa Tagalog.
- source_word: חָלַק
  choice: sinamsaman
  rationale: Bagaman pangunahing maaaring mangahulugang 'hinati' o 'ibinahagi,' ipinahihiwatig ng konteksto na kinuha ni Ahaz ang mahahalagang pag-aari mula sa templo, palasyo, at mga pinuno upang ipambayad sa Asiria.
- source_word: בֵּית יְהוָה
  choice: ang bahay ni Yahweh
  rationale: Pinananatili ang konkretong Hebreong idyomang 'bahay' sa halip na gawing tahasang 'templo.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat ang banal na pangalang YHWH sa anyong Yahweh.
- source_word: בֵּית הַמֶּלֶךְ
  choice: ang bahay ng hari
  rationale: Pinananatili ang paralelismo sa 'bahay ni Yahweh'; mauunawaan sa konteksto bilang palasyo ng hari.
- source_word: הַשָּׂרִים
  choice: ang mga pinuno
  rationale: Likas at malawak na salin para sa matataas na opisyal o maharlika; hindi ipinapalagay na mga anak sila ng hari.
- source_word: וַיִּתֵּן
  choice: at ibinigay niya
  rationale: Tuwirang isinasalin ang kasunod na kilos sa salaysay.
- source_word: לְמֶלֶךְ אַשּׁוּר
  choice: sa hari ng Asiria
  rationale: Karaniwang modernong Tagalog para sa tumatanggap ng ibinigay na kayamanan.
- source_word: וְלֹא לְעֶזְרָה לוֹ
  choice: ngunit hindi iyon nakatulong sa kanya
  rationale: 'Natural na ipinahahayag ang bunga: ang ibinigay na kayamanan o tributo ay hindi naghatid ng tulong kay Ahaz.'
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Nasa tekstong Hebreo ang sariling pangalang YHWH; pinananatili itong tahasan sa halip na palitan ng titulo.
- issue: Referente ng panghalip sa pangwakas na sugnay
  choice: '''iyon'' ay tumutukoy nang kolektibo sa ibinigay na samsam o tributo'
  alternative: Ang hari ng Asiria ang hindi tumulong sa kanya
  rationale: Hindi tahasang pinapangalanan ng Hebreo ang simuno ng 'hindi nakatulong.' Pinananatili ng 'iyon' ang gramatikal na kalabuan habang likas na maiuugnay sa naunang ibinigay.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang 'bahay ni Yahweh' at 'bahay ng hari' upang mapanatili ang Hebreong paralelismo; nilinaw lamang ang kolektibong layon ng 'ibinigay' bilang 'mga nasamsam' upang maging natural at hindi malabo ang Tagalog.
