translation_notes:
  register: Makabagong, marangal, at madaling maunawaang Filipino. Pinanatili ang Hebreong pariralang “mga anak ni Efraim” sa teksto para sa pormal na pagkakatugma, habang ibinigay sa talababa ang mas likas na etnikong pagpapahayag. Ang mga pangalan ay ginawang madaling bigkasin sa Filipino.
