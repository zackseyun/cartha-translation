revisions:
- from: 'Kaya tumindig ang ilang lalaki mula sa mga pinuno ng mga anak ni Efraim[a] upang salubungin ang mga dumarating mula sa hukbo: si Azarias na anak ni Jehohanan, si Berekias na anak ni Mesilemot, si Jehizkias na anak ni Salum, at si Amasa na anak ni Hadlai.'
  to: 'At tumindig ang ilang lalaking kabilang sa mga pinuno ng mga anak ni Efraim[a] laban sa mga dumarating mula sa hukbo: si Azarias na anak ni Jehohanan, si Berekias na anak ni Mesilemot, si Jehizkias na anak ni Salum, at si Amasa na anak ni Hadlai.'
  rationale: Pinalitan ang pariralang maaaring magpahiwatig lamang ng pagsalubong ng tuwirang “laban sa,” upang maihatid ang puwersa ng Hebreong konstruksyong “tumindig laban sa.” Inayos din ang paglalarawan sa mga lalaki upang maging mas likas sa makabagong Filipino, nang hindi binabago ang saklaw ng “mula sa mga pinuno.”
