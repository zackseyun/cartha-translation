base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/012.yaml
  text: 'Then some men from the heads of the sons of Ephraim stood up against those coming from the army: Azariah son of Jehohanan[a], Berechiah son of Meshillemoth, Hezekiah son of Shallum, and Amasa son of Hadlai.'
translation:
  language: tl
  text: 'At tumindig ang ilang lalaking kabilang sa mga pinuno ng mga anak ni Efraim[a] laban sa mga dumarating mula sa hukbo: si Azarias na anak ni Jehohanan, si Berekias na anak ni Mesilemot, si Jehizkias na anak ni Salum, at si Amasa na anak ni Hadlai.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “mula sa mga pinuno ng mga Efraimita.” Literal sa Hebreo: “mula sa mga ulo ng mga anak ni Efraim.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֻמוּ
  choice: tumindig
  rationale: Ipinahahayag ng pandiwang קום ang tiyak na pagkilos at, sa konteksto, ang pagtutol; pinananatili ng “tumindig” ang dalawang pahiwatig nang hindi labis na nagpapaliwanag.
- source_word: אֲנָשִׁים
  choice: ang ilang lalaki
  rationale: Ang di-tiyak na maramihan ay tumutukoy sa isang pangkat mula sa mga pinuno ng Efraim.
- source_word: מֵרָאשֵׁי בְנֵי אֶפְרַיִם
  choice: mula sa mga pinuno ng mga anak ni Efraim
  rationale: Isinasalin ang רָאשֵׁי bilang natural na “mga pinuno” at pinananatili ang Hebreong etnikong pariralang “mga anak ni Efraim”; inilalahad sa talababa ang mas natural na alternatibo.
- source_word: עֲזַרְיָהוּ ... בֶּרֶכְיָהוּ ... יְחִזְקִיָּהוּ ... עֲמָשָׂא
  choice: Azarias ... Berekias ... Jehizkias ... Amasa
  rationale: Ginamit ang mga anyo ng pangalang angkop at madaling basahin sa Filipino habang tinutumbasan ang mga pangalang Hebreo.
- source_word: בֶן
  choice: anak ni
  rationale: Karaniwang natural na anyo sa Filipino para sa patronimiko.
- source_word: עַל
  choice: upang salubungin
  rationale: Kasama ng קום, ipinahihiwatig ng עַל ang pagharap o pagsalungat. Ang “upang salubungin” ay natural sa Filipino at hindi kinakailangang magpahiwatig ng marahas na pagsalakay.
- source_word: הַבָּאִים
  choice: mga dumarating
  rationale: Pinananatili ang nagpapatuloy na diwa ng substantibong participle ng בוא.
- source_word: מִן הַצָּבָא
  choice: mula sa hukbo
  rationale: Sa konteksto, ang צָבָא ay tumutukoy sa puwersang militar na bumabalik mula sa pakikidigma; “hukbo” ang malinaw at marangal na katumbas.
