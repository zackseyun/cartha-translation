  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Edomita,” “sinalakay,” at “mga bihag” bilang mga salitang madaling maunawaan sa kasalukuyang gamit habang pinananatili ang diing militar ng Hebreo.
