  text: The Edomites had also come and attacked Judah and carried away captives[a].
translation:
  language: tl
  text: Dumating din ang mga Edomita at sinalakay ang Juda, at kumuha sila ng mga bihag.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sinaktan ang Juda at kumuha ng mga bihag.” Sa Hebreo, ang “sinaktan” ay pandiwang karaniwang ginagamit sa kontekstong militar, at magkaugnay ang pandiwa at pangngalan para sa pagkuha ng mga bihag.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעוֹד
  choice: din
  rationale: Ipinakikita nito na isa pa itong karagdagang pagsalakay sa sunod-sunod na kapahamakang sinapit ng Juda.
- source_word: אֲדוֹמִים
  choice: ang mga Edomita
  rationale: Ang anyong maramihan ay tumutukoy sa mga taong mula sa Edom, hindi lamang sa lupain.
- source_word: בָּאוּ
  choice: Dumating
  rationale: Tuwirang inilalahad ng ganap na pandiwa ang natapos na pangyayari; natural sa salaysay na Tagalog ang payak na aspektong naganap.
- source_word: וַיַּכּוּ
  choice: sinalakay
  rationale: Bagaman literal na 'sinaktan' o 'hinampas,' sa kontekstong militar ay malinaw na tumutukoy ito sa armadong pagsalakay at hindi kinakailangang sa ganap na pagkatalo.
- source_word: בִיהוּדָה
  choice: ang Juda
  rationale: Kasama ng pandiwang militar, natural sa Tagalog na gawing layon ang Juda; hindi nito ipinipilit kung lupain o bayan ang pangunahing diin.
- source_word: וַיִּשְׁבּוּ שֶׁבִי
  choice: nagdala sila ng mga bihag
  rationale: Likas itong salin ng magkaugnay na pandiwa at pangngalang Hebreo para sa pagkuha at pagdadala ng mga tao bilang bihag, nang hindi lumilikha ng alanganing pag-uulit.
