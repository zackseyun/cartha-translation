  naturalness: Natural ang karamihan ng talata. Mas malinaw at mas likas sa modernong Filipino ang “kumuha ng mga bihag” para sa pagkabihag kaysa “nagdala ... ng mga bihag.”
  terminology: Ang “mga Edomita,” “Juda,” “sinalakay,” at “mga bihag” ay angkop, malinaw, at nasa marangal na modernong rehistro. Ang paliwanag sa talababa ay dapat iwasan ang “humampas” at “manakit,” na hindi angkop na paglalarawan sa leksikal na gamit-militar sa talatang ito.
