translation:
  language: tl
  text: Ang iba pa niyang mga ginawa at lahat ng kanyang mga paraan, ang mga nauna at ang mga huli—masdan, ang mga ito ay nakasulat sa Aklat ng mga Hari ng Juda at Israel.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְיֶתֶר דְּבָרָיו
  choice: Ang iba pa niyang mga ginawa
  rationale: Sa pormulang pangkasaysayan tungkol sa isang hari, ang דְּבָרָיו ay tumutukoy sa kanyang mga gawain o ginawa, hindi lamang sa kanyang mga salita. Likas sa Filipino ang “iba pa niyang mga ginawa.”
- source_word: וְכָל דְּרָכָיו
  choice: at ang lahat ng kanyang mga gawi
  rationale: Ang דְּרָכָיו ay literal na “kanyang mga daan,” ngunit dito ay tumutukoy sa takbo ng kanyang asal at pamumuhay. Iniiwasan ng “mga gawi” ang maling pagkaunawa na mga paglalakbay ang tinutukoy, habang pinananatili ang diwa ng ugali o pamumuhay.
- source_word: הָרִאשֹׁנִים וְהָאַחֲרוֹנִים
  choice: ang mga nauna at ang mga nahuli
  rationale: Pinananatili nito ang magkatambal na anyo ng Hebreo at ang kronolohikal na saklaw nito, sa halip na gawing mas malayang “mula simula hanggang wakas.”
- source_word: הִנָּם כְּתוּבִים
  choice: naroon ang mga iyon, nakasulat
  rationale: Ang “naroon ang mga iyon” ay natural na paraang Filipino upang maipahayag ang deiktiko at madiing puwersa ng הִנָּם; ang “nakasulat” ay tuwirang kumakatawan sa participle na כְּתוּבִים.
- source_word: עַל סֵפֶר מַלְכֵי יְהוּדָה וְיִשְׂרָאֵל
  choice: sa Aklat ng mga Hari ng Juda at Israel
  rationale: Sa pormulang bibliograpiko, natural sa Filipino ang “sa Aklat.” Ang malaking titik sa “Aklat” ay nagpapakitang pamagat ng binanggit na sanggunian ang parirala.
theological_decisions: []
translation_notes:
  register: Makabago at marangal na Filipino. Ginamit ang gitling na em upang malinaw na ihiwalay ang madiing pahayag na “naroon ang mga iyon” nang hindi gumagamit ng masyadong makaluma o teatrikal na “narito” o “masdan.”
