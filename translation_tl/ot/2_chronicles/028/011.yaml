base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/011.yaml
  text: Now listen to me[a], and return the captives whom you have taken from your brothers, for the burning anger of Yahweh is upon you.
translation:
  language: tl
  text: Ngayon, makinig kayo sa akin. Ibalik ninyo ang mga bihag na kinuha ninyo mula sa inyong mga kapatid[a], sapagkat ang nag-aalab na galit ni Yahweh ay nakatuon sa inyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga kapwa Israelita ninyo.” Literal na “mga kapatid ninyo” ang Hebreo, na gumagamit ng pananalitang pampamilya para sa mga kabilang sa iisang bayang tipan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Kaya ngayon
  rationale: Naghuhudyat ito ng apurahang paglipat sa tuwirang pananalita. Likas sa Filipino ang “Kaya ngayon” sa kontekstong nag-uugnay ng naunang dahilan sa kasunod na utos.
- source_word: שְׁמָעוּנִי
  choice: makinig kayo sa akin
  rationale: Ang pautos na anyo ng שׁמע na may hulaping unang panauhan ay humihiling ng masusing pakikinig, hindi lamang pisikal na pagdinig.
- source_word: וְהָשִׁיבוּ
  choice: Ibalik ninyo
  rationale: Ang Hiphil ng שוב ay nangangahulugang ipabalik o maging sanhi ng pagbabalik. Ang “Ibalik ninyo” ay tuwiran at natural na utos sa Filipino.
- source_word: הַשִּׁבְיָה
  choice: ang mga bihag
  rationale: Bagaman maaaring tumukoy ang pangngalan sa kalagayan o kabuuan ng pagkabihag, malinaw sa konteksto na mga taong dinakip ang tinutukoy.
- source_word: אֲשֶׁר שְׁבִיתֶם
  choice: na kinuha ninyo
  rationale: Tinutukoy ng sugnay ang mga taong nabihag ng mga kausap. Iniiwasan ng “kinuha” ang mabigat na pag-uulit na “mga bihag na binihag,” habang malinaw pa rin ang diwa sa konteksto.
- source_word: מֵאֲחֵיכֶם
  choice: mula sa inyong mga kapatid
  rationale: Pinananatili ng “mga kapatid” ang tahasang wikang pampamilya ng אָח. Ipinapaliwanag sa talababa na sa kontekstong ito ay tumutukoy ito sa mga kapwa kabilang sa Israel.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala nito ang dahilan ng naunang utos. Ang “sapagkat” ay malinaw, marangal, at angkop sa kasalukuyang Filipino.
- source_word: חֲרוֹן אַף
  choice: ang nag-aalab na galit
  rationale: Pinananatili nito ang larawan ng init o pag-aalab sa idyomang Hebreo at ang tindi ng galit, sa halip na gawing pangkalahatang “poot” lamang.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasatitik nito ang personal na pangalang Hebreo sa halip na palitan ng isang titulo.
- source_word: עֲלֵיכֶם
  choice: nakatuon sa inyo
  rationale: Sa konteksto ng galit, ipinahihiwatig ng עַל na ang galit ay nakaharap o nakatuon sa kanila. Mas natural ito sa modernong Filipino kaysa sa literal ngunit alanganing “nasa ibabaw ninyo.”
theological_decisions:
- issue: Pagsasalin ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Tuwirang ginagamit ng talata ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
- issue: Saklaw ng “mga kapatid” sa מֵאֲחֵיכֶם
  choice: mga kapatid, na may paliwanag sa talababa
  alternative: mga kapwa Israelita
  rationale: Pinananatili sa pangunahing teksto ang tunay na wikang pampamilya ng Hebreo, habang nililinaw sa talababa ang pambansa at tipanang saklaw nito nang hindi agad pinapaliit ang talinghaga.
translation_notes:
  register: Modernong Filipino na tuwiran, marangal, at madaling maunawaan. Ginamit ang maramihang “kayo/ninyo” upang maipakita ang maramihang utos at mga kausap. Pinanatili ang matinding larawang “nag-aalab na galit,” ngunit ginawang natural ang ugnayang ipinahihiwatig ng עַל sa pamamagitan ng “nakatuon sa inyo.”
