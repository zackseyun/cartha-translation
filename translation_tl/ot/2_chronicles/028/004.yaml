base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/004.yaml
  text: He sacrificed and burned incense on the high places[a], on the hills, and under every green tree.
translation:
  language: tl
  text: Naghandog siya ng mga hain at nagsunog ng insenso sa mga mataas na lugar[a], sa mga burol, at sa ilalim ng bawat luntiang punongkahoy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “sa mga pook-sambahan sa matataas na lugar.” Maaari ring isalin ang unang bahagi: “Naghandog siya ng mga hain at nagpausok ng mga handog sa mga mataas na lugar.”'
    reason: Nililinaw ang teknikal na kultikong diwa ng בָּמוֹת at pinananatili ang lehitimong mas malawak na kahulugan ng קטר.
lexical_decisions:
- source_word: וַיְזַבֵּחַ
  choice: Naghandog siya ng mga hain
  rationale: Ang piel na anyong wayyiqtol ng זבח ay tumutukoy sa paghahandog ng hain. Mas likas at malinaw sa modernong Tagalog ang “naghandog ng mga hain” kaysa sa literal ngunit hindi gaanong natural na “naghain.”
- source_word: וַיְקַטֵּר
  choice: at nagsunog ng insenso
  rationale: Ang piel ng קטר ay maaaring tumukoy sa pagsusunog ng insenso o sa pagpapausok ng handog. Sa konteksto ng pagsambang labag sa kautusan, ang “nagsunog ng insenso” ang likas na salin habang pinananatili sa talababa ang mas malawak na alternatibo.
- source_word: בַּבָּמוֹת
  choice: sa matataas na sambahan
  rationale: Ang בָּמוֹת ay mga lokal na pook-sambahan, madalas nasa mataas na lugar ngunit may teknikal na kahulugang panrelihiyon. Ang “matataas na sambahan” ay nagpapanatili sa pisikal at kultikong diwa nang hindi lamang tinutukoy ang anyong-lupa.
- source_word: וְעַל הַגְּבָעוֹת
  choice: sa mga burol
  rationale: Ang גְּבָעוֹת ay karaniwang salitang Hebreo para sa mga burol. Inihihiwalay ito sa teknikal na בָּמוֹת upang mapanatili ang paglawak ng talaan ng mga lugar.
- source_word: וְתַחַת כָּל עֵץ רַעֲנָן
  choice: at sa ilalim ng bawat luntiang punongkahoy
  rationale: Ang רַעֲנָן ay nangangahulugang sariwa, mayabong, o luntian. Pinananatili ng “luntiang punongkahoy” ang matalinghagang larawan at ang pormulang pananalita ng Hebreo.
theological_decisions:
- issue: Paglalarawan sa mga lugar ng pagsambang labag sa kautusan
  choice: Panatilihin ang kultikong diwa sa “matataas na sambahan” at ang pormulang “sa ilalim ng bawat luntiang punongkahoy.”
  alternative: Isalin nang mas tahasan bilang “mga paganong dambana” o “sa ilalim ng bawat malagong puno.”
  rationale: Hindi tahasang gumagamit ang Hebreo ng salitang “pagano,” kaya hindi iyon idinagdag. Ang napiling salin ay naghahayag ng gamit ng mga lugar bilang sambahan at pinananatili ang ugnayang pampanitikan sa kaparehong pananalita sa Lumang Tipan.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Ginamit ang “punongkahoy” para sa malinaw at bahagyang pormal na biblikal na himig; iniwasan ang labis na teknikal o denominasyonal na pananalita.
