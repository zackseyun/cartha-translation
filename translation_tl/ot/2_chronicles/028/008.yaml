- from: Binihag ng mga Israelita mula sa kanilang mga kapatid[a] ang dalawang daang libong babae, mga anak na lalaki, at mga anak na babae. Kumuha rin sila sa mga ito ng napakaraming samsam at dinala ang mga samsam sa Samaria.
  to: Binihag ng mga Israelita ang dalawang daang libong babae, mga anak na lalaki, at mga anak na babae mula sa kanilang mga kapatid[a]. Kumuha rin sila mula sa kanila ng napakaraming samsam at dinala ang samsam sa Samaria.
  rationale: Inayos ang ayos ng mga parirala upang alisin ang posibleng kalabuan kung sino ang tinutukoy ng “mula sa kanilang mga kapatid,” inilipat ang panandang talababa sa salitang tinatalakay nito, at ginawang mas tuwiran ang “mula sa kanila.” Hindi binago ang bilang, mga pangkat ng bihag, ugnayang pagkakamag-anak, o kahulugan ng pagkuha at pagdala ng samsam.
