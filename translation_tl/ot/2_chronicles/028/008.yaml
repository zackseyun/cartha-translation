base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/008.yaml
  text: And the sons of Israel took captive from their brothers two hundred thousand women[a], sons, and daughters. They also took much spoil from them and brought the spoil to Samaria.
translation:
  language: tl
  text: Binihag ng mga Israelita ang dalawang daang libong babae, mga anak na lalaki, at mga anak na babae mula sa kanilang mga kapatid[a]. Kumuha rin sila mula sa kanila ng napakaraming samsam at dinala ang samsam sa Samaria.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mula sa kanilang mga kaanak” o “mula sa kapwa nila mga Israelita.” Sa Hebreo, “mula sa kanilang mga kapatid,” na nagbibigay-diin sa kanilang pagkakamag-anak.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁבּוּ
  choice: Binihag
  rationale: Ipinahihiwatig ng pandiwang שבה ang pagkuha ng mga bihag sa digmaan; malinaw at likas sa Filipino ang “binihag.”
- source_word: בְנֵי יִשְׂרָאֵל
  choice: mga Israelita
  rationale: Ito ang natural at dignified na modernong Filipino para sa kolektibong katawagang “mga anak ng Israel,” habang naipakikita pa rin ng kasunod na “mga kapatid” ang ugnayang pampamilya.
- source_word: מֵאֲחֵיהֶם
  choice: mula sa kanilang mga kapatid
  rationale: Pinananatili ng “mga kapatid” ang tahasang larawang pampamilya at ang bigat ng pagkuha ng mga bihag mula sa sarili nilang kaanak o kapwa Israelita.
- source_word: מָאתַיִם אֶלֶף
  choice: dalawang daang libo
  rationale: Tuwirang salin ng bilang.
- source_word: נָשִׁים בָּנִים וּבָנוֹת
  choice: babae, mga anak na lalaki, at mga anak na babae
  rationale: Pinananatili ang tatlong pangkat na tahasang binabanggit sa Hebreo sa halip na pagsamahin ang huling dalawa bilang “mga anak” lamang.
- source_word: שָׁלָל רָב
  choice: napakaraming samsam
  rationale: Ang שָׁלָל ay mga ari-ariang kinuha bilang samsam sa digmaan; likas na ipinahahayag ng “napakaraming samsam” ang dami at kontekstong militar.
- source_word: בָּזְזוּ
  choice: Kumuha ... ng ... samsam
  rationale: Natural sa Filipino ang pariralang ito at malinaw na inilalarawan ang pagkuha ng mga ari-arian bilang samsam, nang hindi gumagamit ng mabigat o di-karaniwang anyo.
- source_word: וַיָּבִיאוּ אֶת־הַשָּׁלָל לְשֹׁמְרוֹן
  choice: dinala ang mga samsam sa Samaria
  rationale: Tuwirang isinasalin ang kilos at pinananatili ang pag-uulit sa salitang “samsam” na nasa Hebreo.
theological_decisions:
- issue: Wikang nagpapahayag ng pagkakamag-anak sa tunggaliang panloob ng Israel
  choice: mula sa kanilang mga kapatid
  alternative: mula sa kanilang mga kaanak / mula sa kapwa nila mga Israelita
  rationale: 'Pinananatili ng “mga kapatid” ang etikal at teolohikal na bigat ng teksto: ang mga binihag ay hindi dayuhan kundi mga kabilang sa iisang bayang magkakamag-anak. Hindi nito nilulutas nang palihim kung ang diin ay biyolohikal, panlipi, o pambansa.'
translation_notes:
  register: Modernong Filipino na natural, malinaw, at marangal. Ginamit ang “mga Israelita” sa halip na ang mas literal ngunit di-gaanong likas na “mga anak ng Israel”; pinanatili naman ang “mga kapatid” upang huwag mawala ang mahalagang tensiyon ng salaysay.
