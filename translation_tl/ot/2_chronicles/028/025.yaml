base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/025.yaml
  text: And in every city of Judah he made high places to burn incense to other gods[a], and he provoked Yahweh, the God of his fathers.
translation:
  language: tl
  text: At sa bawat lungsod[a] ng Juda ay gumawa siya ng mga dambana sa matataas na lugar upang magsunog ng insenso para sa ibang mga diyos, at ginalit niya si Yahweh, ang Diyos ng kanyang mga ninuno.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “sa bawat lungsod at lungsod ng Juda,” isang distributibong paraan ng pagsasabi na ginawa niya ito sa lahat ng lungsod ng Juda.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְכָל עִיר וָעִיר לִיהוּדָה
  choice: At sa bawat lungsod ng Juda
  rationale: Ang pag-uulit na עִיר וָעִיר ay isang distributibong pahayag. Likas na naihahatid sa modernong Tagalog ng “bawat lungsod,” habang ipinapaliwanag sa talababa ang anyo at diin ng Hebreo.
- source_word: עָשָׂה בָמוֹת
  choice: gumawa siya ng mga dambana sa matataas na lugar
  rationale: Pinananatili ng “gumawa” ang malawak na kahulugan ng עָשָׂה. Nililinaw ng “mga dambana sa matataas na lugar” na ang בָּמוֹת ay mga pook ng pagsamba, hindi lamang matataas na lokasyon.
- source_word: לְקַטֵּר
  choice: upang magsunog ng insenso
  rationale: Sa kontekstong pangkulto, ang piel ng קטר ay karaniwang tumutukoy sa pagsusunog ng insenso o pagpapausok ng handog. Ang “magsunog ng insenso” ang malinaw at karaniwang salin dito.
- source_word: לֵאלֹהִים אֲחֵרִים
  choice: para sa ibang mga diyos
  rationale: Tuwirang ipinahahayag nito na ang pagsamba ay inialay sa mga diyos maliban kay Yahweh; hindi idinaragdag ang di-tiyak na diwang “dayuhan.”
- source_word: וַיַּכְעֵס אֶת־יְהוָה
  choice: Sa gayon, ginalit niya si Yahweh
  rationale: Ang hiphil ng כעס ay nangangahulugang mag-udyok ng galit. Ang “ginalit” ay tuwiran, natural, at malinaw na nagpapakita ng sanhi at bunga.
- source_word: אֱלֹהֵי אֲבֹתָיו
  choice: ang Diyos ng kanyang mga ninuno
  rationale: Ang “mga ninuno” ay natural sa modernong Tagalog at tumpak na naghahatid sa kolektibong אֲבֹתָיו nang hindi nililimitahan sa agarang mga ama.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehova
  rationale: Personal na pangalan ang Tetragrammaton sa teksto. Pinananatili ng “Yahweh” ang pangalang tipan sa halip na palitan ito ng isang titulo.
- issue: Paglalarawan kay Yahweh bilang אֱלֹהֵי אֲבֹתָיו
  choice: ang Diyos ng kanyang mga ninuno
  alternative: ang Diyos ng kanyang mga ama
  rationale: Pinananatili ang ugnayang pangkasaysayan at pangtipan sa naunang mga salinlahi, habang gumagamit ng natural at hindi malabong modernong Tagalog.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “mga dambana sa matataas na lugar” upang maipakita ang kultikong diwa ng בָּמוֹת; iniwasan ang sobrang literal at di-likas na pag-uulit na “lungsod at lungsod” sa pangunahing teksto.
