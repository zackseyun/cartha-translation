  to: May isang propeta ng PANGINOON doon na ang pangalan ay Oded. Lumabas siya upang salubungin ang hukbong dumarating sa Samaria at sinabi sa kanila, “Tingnan ninyo! Dahil galit ang PANGINOON, ang Diyos ng inyong mga ninuno, sa Juda, ibinigay niya sila sa inyong kamay, at pinatay ninyo sila sa galit na umabot hanggang langit.”
