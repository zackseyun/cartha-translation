base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/009.yaml
  text: There was a prophet of the LORD there, whose name was Oded; and he went out before the army that came to Samaria and said to them, “Look, because the LORD, the God of your fathers, was angry with Judah, he gave them into your hand, but you have killed them in a rage that has reached up to heaven.”
translation:
  language: tl
  text: May isang propeta ng PANGINOON doon na ang pangalan ay Oded. Lumabas siya upang salubungin ang hukbong dumarating sa Samaria at sinabi sa kanila, “Tingnan ninyo! Dahil galit ang PANGINOON, ang Diyos ng inyong mga ninuno, sa Juda, ibinigay niya sila sa inyong kamay, at pinatay ninyo sila sa galit na umabot hanggang langit.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְשָׁם
  choice: May ... doon
  rationale: Ipinahahayag ang pag-iral at lokasyon ng propeta nang natural sa Tagalog, nang hindi nagdaragdag ng tahasang salitang panahong wala sa Hebreo.
- source_word: נָבִיא לַיהוָה
  choice: isang propeta ng PANGINOON
  rationale: Ang לַיהוָה ay nagpapahiwatig na ang propeta ay nauukol o naglilingkod kay YHWH; ginamit ang nakaugaliang marangal na anyong “PANGINOON” para sa banal na pangalan.
- source_word: וַיֵּצֵא לִפְנֵי הַצָּבָא
  choice: Lumabas siya upang salubungin ang hukbo
  rationale: Ang literal na paglabas “sa harap ng hukbo” ay likas na tumutukoy rito sa pagharap o pagsalubong dito.
- source_word: הִנֵּה
  choice: Tingnan ninyo!
  rationale: Pinananatili ang pantawag-pansing lakas ng Hebreong interjection sa tuwirang pananalita.
- source_word: נְתָנָם בְּיֶדְכֶם
  choice: ibinigay niya sila sa inyong kamay
  rationale: Pinananatili ang konkretong idyomang Hebreo, na malinaw rin sa Tagalog bilang pagpapasailalim sa kapangyarihan ng iba.
- source_word: בְזַעַף עַד לַשָּׁמַיִם הִגִּיעַ
  choice: sa tindi ng galit na umabot hanggang langit
  rationale: Iniuugnay ang pag-abot sa langit sa matinding galit, ayon sa gramatikal na isahang pandiwa at panlalaking pangngalang זַעַף, habang pinananatili ang matinding larawang Hebreo.
theological_decisions:
- issue: Ugnayan ng galit ng PANGINOON at pananagutan ng Israel
  choice: Dahil sa galit ng PANGINOON ay ibinigay niya ang Juda sa kanilang kamay, ngunit hinatulan ang marahas nilang pagpatay.
  alternative: Ilarawan ang tagumpay ng hukbo bilang ganap na pagsang-ayon ng Diyos sa lahat ng ginawa nila.
  rationale: Hayagang pinagsasabay ng teksto ang makadiyos na paghatol sa Juda at ang moral na pananagutan ng mga nagwagi; hindi dapat burahin ang tensiyong ito.
- issue: Referent ng “Diyos ng inyong mga ninuno”
  choice: Panatilihin ang “inyong mga ninuno.”
  alternative: Gawing “Diyos ng Israel” o tukuyin ang isang partikular na pangkat ng mga ninuno.
  rationale: Ang teksto ay tuwirang nakikipag-usap sa hukbo ng hilagang kaharian at ginagamit ang tipanang pananalitang אֱלֹהֵי אֲבוֹתֵיכֶם; hindi kailangan ng dagdag na interpretasyon.
translation_notes:
  register: Modernong Filipino na marangal at malinaw para sa karaniwang mambabasa. Ginamit ang “hukbo,” “mga ninuno,” at “hanggang langit” bilang likas ngunit mataas na pananalita. Ang PANGINOON ay nasa malalaking titik upang kumatawan sa tetragrammaton na יהוה.
