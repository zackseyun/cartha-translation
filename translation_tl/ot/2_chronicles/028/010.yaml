id: 2CH.28.10
reference: 2 Chronicles 28:10
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ֠/עַתָּה בְּנֵֽי יְהוּדָ֤ה וִֽ/ירוּשָׁלִַ֨ם֙ אַתֶּ֣ם אֹמְרִ֔ים לִ/כְבֹּ֛שׁ לַ/עֲבָדִ֥ים וְ/לִ/שְׁפָח֖וֹת לָ/כֶ֑ם הֲ/לֹ֤א רַק אַתֶּם֙ עִמָּ/כֶ֣ם אֲשָׁמ֔וֹת לַ/יהוָ֖ה אֱלֹהֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/010.yaml
  text: And now[a], you are saying that you will subdue the people of Judah and Jerusalem as male and female servants for yourselves[c][b]. But do not you yourselves also have guilt before Yahweh your God?
translation:
  language: tl
  text: At ngayon, sinasabi ninyong aalipinin ninyo ang mga taga-Juda at Jerusalem bilang inyong mga aliping lalaki at babae.[a] Ngunit hindi ba kayo rin ay may mga pagkakasala laban kay Yahweh na inyong Diyos?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “susupilin ninyo ang mga taga-Juda at Jerusalem upang maging inyong mga aliping lalaki at babae.”'
    reason: Pinananatili sa tala ang hiwalay na diwa ng pandiwang 'supilin' at ng resultang pagiging alipin.
  - marker: b
    text: 'Mas literal at siksik ang Hebreo: “Hindi ba, tunay nga, nasa inyo rin ang mga pagkakasala laban kay Yahweh na inyong Diyos?”'
    reason: Ipinapakita ang siksik at bahagyang di-tiyak na ayos ng retorikal na tanong sa Hebreo.
lexical_decisions:
- source_word: וְעַתָּה
  choice: At ngayon
  rationale: Pinananatili nito ang pang-ugnay at ang paglipat sa kasalukuyang pagsaway.
- source_word: בְּנֵי יְהוּדָה וִירוּשָׁלַם
  choice: ang mga taga-Juda at Jerusalem
  rationale: Ang literal na 'mga anak na lalaki ng Juda at Jerusalem' ay kolektibong tumutukoy sa mga mamamayan; natural at hindi eksklusibo sa lalaki ang 'mga taga-'.
- source_word: אַתֶּם אֹמְרִים
  choice: sinasabi ninyong
  rationale: Inilalarawan ng panghalip at participle ang ipinahahayag o binabalak nila sa kasalukuyan.
- source_word: לִכְבֹּשׁ
  choice: aalipinin
  rationale: Pangunahing diwa nito ang pagsupil o pagpapasakop; sa kasunod na pariralang tahasang tumutukoy sa mga alipin, natural na ipinahahayag sa Filipino ang layuning gawing alipin.
- source_word: לַעֲבָדִים וְלִשְׁפָחוֹת
  choice: bilang inyong mga aliping lalaki at babae
  rationale: Pinananatili ang pagkakaiba ng dalawang uring pangkasarian at ang sapilitang katayuan bilang alipin.
- source_word: לָכֶם
  choice: inyong
  rationale: 'Ipinahihiwatig nito ang pag-aangkin at pansariling pakinabang: gagawin nila ang mga bihag na sarili nilang alipin.'
- source_word: הֲלֹא רַק אַתֶּם עִמָּכֶם אֲשָׁמוֹת
  choice: Ngunit hindi ba kayo rin ay may mga pagkakasala
  rationale: Pinananatili ang retorikal na tanong at ang diin na ang mga sumasaway o nang-aalipin ay may sarili ring pagkakasala; ang maramihang אֲשָׁמוֹת ay kinatawan ng 'mga pagkakasala'.
- source_word: לַיהוָה אֱלֹהֵיכֶם
  choice: laban kay Yahweh na inyong Diyos
  rationale: Sa konteksto ng אֲשָׁמוֹת, ang ל ay nagpapahayag ng pananagutan o pagkakasala laban sa Diyos; pinananatili ang pangalang tipan na Yahweh.
theological_decisions:
- issue: Paglalarawan sa sapilitang katayuan ng עֲבָדִים at שְׁפָחוֹת
  choice: mga aliping lalaki at babae
  alternative: mga lingkod na lalaki at babae
  rationale: Mga bihag sa digmaan ang sapilitang pasasakop dito, kaya mas tumpak ang 'alipin' kaysa sa mas banayad at maaaring kusang-loob na 'lingkod'.
- issue: Pag-render sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Direktang ginagamit sa Hebreo ang Tetragrammaton; pinananatili ng 'Yahweh' ang natatanging pangalang tipan.
- issue: Ugnayan ng mga pagkakasala sa Diyos sa pariralang לַיהוָה
  choice: laban kay Yahweh
  alternative: sa harap ni Yahweh
  rationale: Ang parehong pagbasa ay posible sa diwa ng pananagutan, ngunit mas natural sa Filipino ang 'mga pagkakasala laban kay' at malinaw nitong ipinapahayag ang moral na paglabag nang hindi binabago ang retorikal na punto.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang 'ninyo/inyong' para sa maramihang kausap at ang 'mga taga-Juda at Jerusalem' bilang natural na kolektibong tawag. Ang pangunahing teksto ay idiomatiko, habang inilalagay sa mga talababa ang mas pormal na pagkakabuo at ang siksik na Hebreo.
