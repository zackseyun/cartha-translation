  text: So the armed men left the captives and the plunder before the officials and all the assembly[a][b].
translation:
  language: tl
  text: Kaya iniwan ng mga armadong mandirigma ang mga bihag at ang nasamsam sa harap ng mga pinuno at ng buong kapulungan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲזֹב
  choice: iniwan
  rationale: Karaniwang kahulugan ng עזב ang ‘iwan.’ Sa konteksto, isinuko o binitiwan ng hukbo ang pagkakahawak sa mga bihag at nasamsam; pinananatili ng ‘iniwan’ ang payak at malawak na diwa ng Hebreo.
- source_word: הֶחָלוּץ
  choice: mga armadong mandirigma
  rationale: Ang anyong pangngalan ay tumutukoy sa mga lalaking nasasandatahan o nakahandang lumaban. Likas at malinaw sa modernong Filipino ang ‘mga armadong mandirigma’ sa kontekstong militar.
- source_word: הַשִּׁבְיָה
  choice: mga bihag
  rationale: 'Bagaman maaari itong tumukoy sa kalagayan ng pagkabihag, kongkreto rito ang gamit: ang mga taong nabihag sa digmaan.'
- source_word: הַבִּזָּה
  choice: nasamsam
  rationale: Tumutukoy ito sa mga ari-ariang kinuha sa digmaan. Ang ‘nasamsam’ ay malinaw at karaniwang gamit sa modernong Filipino.
- source_word: לִפְנֵי
  choice: sa harap ng
  rationale: Pinananatili nito kapuwa ang posibleng lokasyong pisikal at ang diwang ginawa ito sa presensya ng mga kinauukulan.
- source_word: הַשָּׂרִים
  choice: mga pinuno
  rationale: 'Malawak ang saklaw ng שׂרים: mga opisyal, pinuno, o mga prinsipe. Ang ‘mga pinuno’ ay natural at hindi nagpapahiwatig na mga anak sila ng hari o pawang mga kumander ng hukbo.'
- source_word: כָל הַקָּהָל
  choice: buong kapulungan
  rationale: Ang קהל ay ang nagkatipong pamayanan. Ang ‘buong kapulungan’ ay malinaw, marangal, at hindi labis na naglilimita sa kahulugan sa isang pagsambang pagtitipon.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran at marangal. Ginamit ang ‘Kaya’ upang iugnay ang kilos sa naunang utos at pangyayari. Walang footnote dahil ang mga alternatibong ‘buong kapulungan’ at ‘nasamsam’ ay naipahayag na mismo sa pangunahing teksto at hindi kinakailangan ang hiwalay na tala upang mapanatili ang mahalagang ambiguity.
