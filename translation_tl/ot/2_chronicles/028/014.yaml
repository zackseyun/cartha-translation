  source_fidelity: 'Tumpak ang salin sa lahat ng pangunahing yunit ng Hebreo: ang הֶחָלוּץ ay naipahayag bilang mga armadong mandirigma, ang הַשִּׁבְיָה bilang mga bihag, ang הַבִּזָּה bilang nasamsam, at ang לִפְנֵי bilang sa harap ng. Ang “iniwan” ay angkop na malawak na katumbas ng וַיַּעֲזֹב at hindi nagdaragdag ng hindi kinakailangang paliwanag.'
