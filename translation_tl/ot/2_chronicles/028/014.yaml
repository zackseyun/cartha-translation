  terminology: Ang “mga bihag,” “nasamsam,” “mga pinuno,” at “buong kapulungan” ay angkop sa kontekstong militar at pampamayanan ng Mga Cronica. Hindi ipinapasok ng mga ito ang partikular na doktrinal o interpretatibong kahulugan.
