source:
  edition: WLC
  text: וַ/יָּקֻ֣מוּ הָ/אֲנָשִׁים֩ אֲשֶׁר נִקְּב֨וּ בְ/שֵׁמ֜וֹת וַ/יַּחֲזִ֣יקוּ בַ/שִּׁבְיָ֗ה וְ/כָֽל מַעֲרֻמֵּי/הֶם֮ הִלְבִּ֣ישׁוּ מִן הַ/שָּׁלָל֒ וַ/יַּלְבִּשׁ֣וּ/ם וַ֠/יַּנְעִלוּ/ם וַ/יַּאֲכִל֨וּ/ם וַ/יַּשְׁק֜וּ/ם וַ/יְסֻכ֗וּ/ם וַ/יְנַהֲל֤וּ/ם בַּ/חֲמֹרִים֙ לְ/כָל כּוֹשֵׁ֔ל וַ/יְבִיא֛וּ/ם יְרֵח֥וֹ עִיר הַ/תְּמָרִ֖ים אֵ֣צֶל אֲחֵי/הֶ֑ם וַ/יָּשׁ֖וּבוּ שֹׁמְרֽוֹן־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/015.yaml
  text: Then the men who had been designated by name stood up and took charge of the captives[a], and from the spoil they clothed all who were naked among them. They clothed them, put sandals on them, fed them, gave them drink, anointed them, and led all the feeble among them on donkeys. They brought them to Jericho, the city of palm trees, to their brothers; then they returned to Samaria.
translation:
  language: tl
  text: Pagkatapos, tumayo ang mga lalaking itinalaga ayon sa pangalan at inalagaan ang mga bihag. Mula sa samsam ay dinamitan nila ang lahat ng bihag na walang damit. Dinamtan nila ang mga ito, sinuotan ng mga sandalyas, pinakain, pinainom, at pinahiran ng langis. Isinakay nila sa mga asno ang lahat ng nanghihina at inihatid sa Jerico, ang lungsod ng mga punong palma, sa kanilang mga kapatid[a]. Pagkatapos, bumalik sila sa Samaria.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kanilang mga kamag-anak” o “kapwa nila Israelita.”
    reason: Ipinapakita ang mas malawak na posibleng saklaw ng אֲחֵיהֶם nang hindi inaalis sa pangunahing teksto ang literal na “mga kapatid.”
lexical_decisions:
- source_word: נִקְּבוּ בְשֵׁמוֹת
  choice: itinalaga ayon sa pangalan
  rationale: Ipinahihiwatig ng Niphal ng נקב na ang mga lalaki ay tahasang tinukoy o itinalaga. Likas sa Filipino ang “itinalaga ayon sa pangalan” at hindi nito ipinapalagay kung sino ang nagtalaga.
- source_word: וַיַּחֲזִיקוּ בַשִּׁבְיָה
  choice: pinangasiwaan ang mga bihag
  rationale: Maaaring mangahulugan ang החזיק ב ng paghawak, pagsuporta, o pag-aako ng pananagutan. Sa konteksto ng pagkalinga, malinaw na ipinapahayag ng “pinangasiwaan” ang aktibong pag-aasikaso nang hindi ito ginagawang panibagong marahas na pagsunggab.
- source_word: מַעֲרֻמֵּיהֶם
  choice: lahat ng walang damit
  rationale: Tumutukoy ito sa mga hubad o hinubaran sa pangkat ng mga bihag. Ang “walang damit” ay natural at malinaw sa modernong Filipino.
- source_word: הִלְבִּישׁוּ מִן הַשָּׁלָל
  choice: Dinamtan nila mula sa nasamsam
  rationale: Pinananatili nito na ang damit ay kinuha mula sa samsam, habang gumagamit ng maikli at marangal na pananalita.
- source_word: וַיַּלְבִּשׁוּם
  choice: Dinamtan nila ang mga ito
  rationale: Pinananatili ang pag-uulit ng Hebreo upang maipakita ang diin nito.
- source_word: וַיַּנְעִלוּם
  choice: sinuotan ng mga sandalyas
  rationale: Tiyak na tumutukoy ang pandiwa sa pagsusuot ng panapin sa paa; ang “sandalyas” ay malinaw at angkop sa sinaunang tagpuan.
- source_word: וַיַּאֲכִלוּם
  choice: pinakain
  rationale: Tuwirang salin ng causative na anyo ng אכל at likas sa Filipino.
- source_word: וַיַּשְׁקוּם
  choice: pinainom
  rationale: Hindi tinutukoy ng Hebreo kung anong inumin, kaya hindi ito nilimitahan sa tubig.
- source_word: וַיְסֻכוּם
  choice: pinahiran ng langis
  rationale: Sa kontekstong ito, ang סוך ay malamang na restorative na pagpahid ng langis, hindi seremonyal na pagpapahid. Iniiwasan ng saling ito ang di-kinakailangang rituwal na pahiwatig.
- source_word: וַיְנַהֲלוּם בַּחֲמֹרִים לְכָל כּוֹשֵׁל
  choice: Isinakay nila sa mga asno ang lahat ng nanghihina at inihatid
  rationale: Ang נהל ay pag-akay o maingat na paghahatid, at ang כושל ay taong natitisod o nanghihina. Ipinapahayag ng salin ang mahabaging pagpapasakay at paghahatid sa mga hindi na makalakad nang maayos.
- source_word: יְרֵחוֹ עִיר הַתְּמָרִים
  choice: Jerico, ang lungsod ng mga palma
  rationale: Tuwirang isinasalin ang kilalang bansag sa Jerico sa malinaw na modernong Filipino.
theological_decisions:
- issue: Saklaw ng אֲחֵיהֶם sa konteksto ng pagkakamag-anak at bayang tipan
  choice: kanilang mga kapatid
  alternative: kanilang mga kamag-anak; kapwa nila Israelita
  rationale: Ang pangngalan ay panlalaking maramihan at literal na “mga kapatid,” ngunit maaari itong tumukoy nang mas malawak sa mga kalahi o kapwa Israelita. Pinanatili sa pangunahing teksto ang konkretong katawagang pangkamag-anak at inilagay sa talababa ang mas malawak na posibilidad.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “Jerico” at “Samaria” bilang karaniwang anyong Filipino ng mga pangalan. Pinanatili ang sunod-sunod na mga kilos at ang pag-uulit ng “dinamtan” upang masalamin ang diin at ritmo ng Hebreo.
