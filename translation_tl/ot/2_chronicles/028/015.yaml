revisions:
- from: Pagkatapos, tumayo ang mga lalaking itinalaga ayon sa pangalan at pinangasiwaan ang mga bihag. Dinamtan nila mula sa nasamsam ang lahat ng walang damit. Dinamtan nila ang mga ito, sinuotan ng mga sandalyas, pinakain, pinainom, at pinahiran ng langis. Isinakay nila sa mga asno ang lahat ng nanghihina at inihatid sa Jerico, ang lungsod ng mga palma, sa kanilang mga kapatid[a]. Pagkatapos, bumalik sila sa Samaria.
  to: Pagkatapos, tumayo ang mga lalaking itinalaga ayon sa pangalan at inalagaan ang mga bihag. Mula sa samsam ay dinamitan nila ang lahat ng bihag na walang damit. Dinamtan nila ang mga ito, sinuotan ng mga sandalyas, pinakain, pinainom, at pinahiran ng langis. Isinakay nila sa mga asno ang lahat ng nanghihina at inihatid sa Jerico, ang lungsod ng mga punong palma, sa kanilang mga kapatid[a]. Pagkatapos, bumalik sila sa Samaria.
  rationale: Pinalitan ang administratibong “pinangasiwaan” ng “inalagaan” upang maipahayag ang aktibong pagkalingang ipinakikita ng konteksto. Nilinaw ang saklaw ng “walang damit” bilang mga bihag at ang pagtukoy sa mga palma bilang mga puno. Walang binagong kahulugan, pangalan, pagkakasunod-sunod ng mga kilos, o kahulugang teolohikal.
