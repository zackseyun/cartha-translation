  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: כִּֽי הִכְנִ֤יעַ יְהוָה֙ אֶת יְהוּדָ֔ה בַּ/עֲב֖וּר אָחָ֣ז מֶֽלֶךְ יִשְׂרָאֵ֑ל כִּ֤י הִפְרִ֨יעַ֙ בִּֽ/יהוּדָ֔ה וּ/מָע֥וֹל מַ֖עַל בַּ/יהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/019.yaml
  text: For Yahweh humbled Judah because of Ahaz king of Israel[b][a], for he had cast off restraint in Judah and had acted very unfaithfully against Yahweh.
translation:
  language: tl
  text: Sapagkat ibinaba ni Yahweh ang Juda sa abang kalagayan dahil kay Ahaz na hari ng Israel[a], sapagkat nagdulot siya ng kawalan ng pagpipigil sa Juda[b] at lubha siyang nagtaksil kay Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo: “Ahaz na hari ng Israel.” Si Ahaz ay hari ng Juda; pinanatili rito ang pananalita ng manunulat ng Mga Cronica sa halip na iayon ito sa kaniyang makasaysayang titulo.'
    reason: alternative_reading
  - marker: b
    text: 'Maaari ring isalin: “kumilos siya nang walang ingat sa Juda” o “pinakawalan niya ang pagpipigil sa Juda.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִכְנִיעַ
  choice: ibinaba
  rationale: Ipinahahayag ng Hiphil ng כנע na si Yahweh ang nagdala sa Juda sa abang kalagayan. Ang “ibinaba” ay natural sa Tagalog at nagpapanatili sa diwang causative nang hindi ito nililimitahan sa pagsupil na militar.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinanatili ang personal na pangalan ng Diyos na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: בַּעֲבוּר
  choice: dahil kay
  rationale: Dito, ang parirala ay nagpapahayag ng sanhi; malinaw at likas sa Tagalog ang “dahil kay” kapag tao ang tinutukoy.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: hari ng Israel
  rationale: Ganito ang tahasang pagbasa ng tekstong Hebreo. Hindi ito iniayon sa historikal na titulong “hari ng Juda”; ipinaliwanag ang tensiyon sa talababa.
- source_word: הִפְרִיעַ
  choice: naghasik siya ng kawalan ng pagpipigil
  rationale: Maaaring ipahiwatig ng Hiphil ng פרע ang pagpapakawala ng kaayusan o pagpipigil. Inihahatid ng parirala ang causative at panlipunang bunga nito sa natural na Tagalog, habang inilalahad sa talababa ang iba pang posibleng pagbasa.
- source_word: בִּיהוּדָה
  choice: sa Juda
  rationale: Tinutukoy ng ב ang lugar o saklaw kung saan naganap ang ginawa ni Ahaz.
- source_word: וּמָעוֹל מַעַל
  choice: at lubha siyang nagtaksil
  rationale: Ang magkaugnay na anyo mula sa מעל ay nagpapalakas sa diwa ng pagtataksil o matinding kawalang-katapatan sa tipan. Pinananatili ng “lubha” ang intensipikasyon.
- source_word: בַּיהוָה
  choice: kay Yahweh
  rationale: Kasama ng מעל, ang parirala ay tumutukoy sa Diyos bilang pinagtaksilan; malinaw ito sa pandiwang Tagalog na “nagtaksil kay.”
theological_decisions:
- issue: Tinawag si Ahaz na “hari ng Israel”
  choice: Pinanatili sa pangunahing teksto ang “Ahaz na hari ng Israel.”
  alternative: Gawing “Ahaz na hari ng Juda” upang iayon sa historikal niyang kaharian.
  rationale: Tahasan ang Masoretic Text na “hari ng Israel.” Maaaring may retorikal o teolohikal na kabuluhan ang katawagang ito sa Mga Cronica, kaya hindi dapat alisin sa pamamagitan ng tahimik na pag-aayon; ang historikal na paglilinaw ay inilagay sa talababa.
- issue: Saklaw ng הִפְרִיעַ בִּיהוּדָה
  choice: Isinalin bilang “naghasik siya ng kawalan ng pagpipigil sa Juda.”
  alternative: “Kumilos siya nang walang ingat sa Juda” o “namuhay siya nang walang pagpipigil sa Juda.”
  rationale: May tunay na leksikal na kalabuan kung ang diin ay nasa sariling walang-patumanggang kilos ni Ahaz o sa kaguluhang pinakawalan niya sa Juda. Pinananatili ng pangunahing salin ang causative na anyo, at kinikilala ng talababa ang mas di-causative na pagbasa.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “Sapagkat” at “Ito ay dahil” upang luminaw ang magkasunod na כִּי nang hindi pinapawi ang ugnayang sanhi. Pinanatili ang “Juda,” “Israel,” at “Yahweh” bilang mga pangalang pantangi.
