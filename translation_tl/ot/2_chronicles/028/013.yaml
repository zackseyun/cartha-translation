base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/013.yaml
  text: And they said to them[a], “Do not bring the captives here, for you are proposing to add to our sins and to our guilt, bringing guilt from Yahweh upon us, because our guilt is already great[b], and there is fierce anger against Israel.”
translation:
  language: tl
  text: At sinabi nila sa kanila, “Huwag ninyong dalhin dito ang mga bihag. Sapagkat balak ninyong dagdagan ang aming mga kasalanan at ang aming sala, at magdulot sa amin ng pananagutang mula kay Yahweh.[a] Malaki na nga ang aming sala, at nag-aalab ang galit[b] laban sa Israel.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin, “sapagkat nasa amin ang sala laban kay Yahweh.” Masinsin at maaaring unawain sa dalawang paraan ang pariralang Hebreo: maaaring idiin ang pananagutang dulot ng hatol ni Yahweh o ang sala nila laban kay Yahweh.'
    reason: alternative_reading
  - marker: b
    text: Sa Hebreo, “pag-aalab ng galit,” isang idyoma para sa napakatinding poot.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשִּׁבְיָה
  choice: mga bihag
  rationale: Tumutukoy rito sa mga taong nabihag, hindi lamang sa kalagayan ng pagkabihag, sapagkat sila ang dadalhin sa isang lugar.
- source_word: הֵנָּה
  choice: dito
  rationale: Likas na katumbas sa Tagalog ng pang-abay na nagsasaad ng paglapit sa kinaroroonan ng mga nagsasalita.
- source_word: לְאַשְׁמַת יְהוָה עָלֵינוּ
  choice: magdulot sa amin ng pananagutan mula kay Yahweh
  rationale: Pinananatili ang diwa ng salang o pananagutang mapapasakanila kaugnay ng hatol ni Yahweh, habang kinikilala sa talababa ang kasiksikan at tunay na kalabuan ng pariralang Hebreo.
- source_word: אַתֶּם אֹמְרִים
  choice: balak ninyo
  rationale: Bagaman literal na ‘sinasabi ninyo,’ ipinapahayag ng parirala sa konteksto ang nilalayong gawin; natural sa modernong Tagalog ang ‘balak ninyo.’
- source_word: לְהֹסִיף עַל
  choice: dagdagan
  rationale: Tuwirang ipinahahayag ang pagdaragdag sa umiiral nang mga kasalanan at sala.
- source_word: חַטֹּאתֵינוּ
  choice: aming mga kasalanan
  rationale: Pinananatili ang pangmaramihang mga ginawang paglabag.
- source_word: אַשְׁמָתֵינוּ / אַשְׁמָה
  choice: aming sala / ang aming sala
  rationale: Ang ‘sala’ ay nakikilala sa ‘mga kasalanan’ at maaaring tumukoy sa kalagayan ng pagiging may-sala o pananagutan.
- source_word: רַבָּה
  choice: malaki na nga
  rationale: Ang ‘malaki’ ang pangunahing kahulugan; ipinahihiwatig ng ‘na nga’ na umiiral na ang mabigat na sala bago pa ang panibagong gawa.
- source_word: וַחֲרוֹן אָף
  choice: nag-aalab ang galit
  rationale: Malapit sa larawang Hebreo ng ‘pag-aalab ng galit’ at likas pa rin sa marangal na Tagalog.
- source_word: עַל יִשְׂרָאֵל
  choice: laban sa Israel
  rationale: Sa konteksto ng banal na galit, malinaw na ipinahahayag ng ‘laban sa’ ang tunguhin ng galit nang hindi pinapaliit ang pangalang Israel.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehovah
  rationale: Tahasang ginagamit ng tekstong Hebreo ang tipanang pangalan; pinananatili itong Yahweh sa salin.
- issue: Kahulugan ng ‘Israel’ sa konteksto ng hilagang kaharian at hatol ng tipan
  choice: Israel
  alternative: Efraim / hilagang kaharian
  rationale: Pinananatili ang mismong tawag ng tekstong Hebreo at hindi nililimitahan sa isang interpretatibong katawagan.
- issue: Ugnayan ng sala, ni Yahweh, at ng mga nagsasalita sa לְאַשְׁמַת יְהוָה עָלֵינוּ
  choice: pananagutan mula kay Yahweh na sasapit sa kanila
  alternative: sala laban kay Yahweh na nasa kanila
  rationale: Kaayon ito ng kasunod na babala tungkol sa pagdaragdag sa umiiral nilang kasalanan at sala, ngunit inilalahad sa talababa ang alternatibong ugnayan upang hindi ikubli ang kalabuan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang ‘mga bihag,’ ‘sala,’ at ‘nag-aalab ang galit’ upang manatiling malapit sa kongkretong larawan at pagkakaiba ng mga terminong Hebreo nang hindi nagiging artipisyal ang pangungusap.
