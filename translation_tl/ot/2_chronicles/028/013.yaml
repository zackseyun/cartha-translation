revisions:
- from: At sinabi nila sa mga iyon, “Huwag ninyong dalhin dito ang mga bihag. Sapagkat balak ninyong dagdagan ang aming mga kasalanan at ang aming sala, at magdulot sa amin ng pananagutan mula kay Yahweh.[a] Malaki na nga ang aming sala, at nag-aalab ang galit[b] laban sa Israel.”
  to: At sinabi nila sa kanila, “Huwag ninyong dalhin dito ang mga bihag. Sapagkat balak ninyong dagdagan ang aming mga kasalanan at ang aming sala, at magdulot sa amin ng pananagutang mula kay Yahweh.[a] Malaki na nga ang aming sala, at nag-aalab ang galit[b] laban sa Israel.”
  rationale: Pinalitan ang hindi likas na “sa mga iyon” ng “sa kanila.” Inilipat ang panandang b upang tumukoy nang wasto sa idyomang Hebreo para sa matinding galit. Ang natitirang salin at talababa ay pinanatili, sapagkat tapat ang mga ito sa teksto at maingat na tinatrato ang pinagtatalunang ugnayan ng sala, ni Yahweh, at ng mga nagsasalita.
