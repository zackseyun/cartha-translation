  text: וַ/יִּזְבַּ֗ח לֵֽ/אלֹהֵ֣י דַרְמֶשֶׂק֮ הַ/מַּכִּ֣ים בּ/וֹ֒ וַ/יֹּ֗אמֶר כִּ֠י אֱלֹהֵ֤י מַלְכֵֽי אֲרָם֙ הֵ֚ם מַעְזְרִ֣ים אוֹתָ֔/ם לָ/הֶ֥ם אֲזַבֵּ֖חַ וְ/יַעְזְר֑וּ/נִי וְ/הֵ֛ם הָֽיוּ ל֥/וֹ לְ/הַכְשִׁיל֖/וֹ וּ/לְ/כָל יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/023.yaml
  text: And he sacrificed to the gods of Damascus that had struck him[a], and he said, “Because the gods of the kings of Aram help them, I will sacrifice to them[c][b], so that they may help me.” But they became the downfall of him and of all Israel.
translation:
  language: tl
  text: Naghandog siya ng mga hain sa mga diyos ng Damasco na gumapi sa kanya[a]. Sinabi niya, “Dahil tinutulungan sila ng mga diyos ng mga hari[b] ng Aram, maghahandog ako sa mga diyos na iyon upang tulungan nila ako.” Ngunit ang mga iyon ang naging sanhi ng pagbagsak niya at ng buong Israel[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “na patuloy na gumagapi sa kanya.” Ang anyong Hebreo ay maaaring tumukoy sa nagpapatuloy o kinagawiang pagkilos.
    reason: lexical_alternative
  - marker: b
    text: 'Nasa pangmaramihan sa Hebreo: “mga hari ng Aram.”'
    reason: lexical_alternative
  - marker: c
    text: 'Sa mas literal na salin: “Sila ay naging para sa kanya na maging sanhi ng kanyang pagkabuwal, at para sa buong Israel.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְבַּח
  choice: Naghandog siya ng mga hain
  rationale: Malinaw at likas na ipinapahayag sa Filipino ang gawaing panrelihiyon ng pag-aalay ng hain.
- source_word: לֵאלֹהֵי דַרְמֶשֶׂק
  choice: sa mga diyos ng Damasco
  rationale: Pinananatili ang pangmaramihang anyo ng אֱלֹהֵי sa konteksto ng pagsamba sa mga diyos-diyosan, at ginagamit ang karaniwang pangalang Filipino na Damasco.
- source_word: הַמַּכִּים בּוֹ
  choice: na tumalo sa kanya
  rationale: Ipinahahayag ang ideya ng pananakit o paggapi sa konteksto ng pagkatalo ni Ahaz; inilalahad sa talababa ang maaaring patuloy na aspekto ng participle.
- source_word: אֱלֹהֵי מַלְכֵי אֲרָם
  choice: mga diyos ng mga hari ng Aram
  rationale: Pinananatili ang pangmaramihang מַלְכֵי, ‘mga hari,’ nang hindi ito pinapakinis tungo sa isahan.
- source_word: מַעְזְרִים אוֹתָם
  choice: tinutulungan sila
  rationale: Ang aspektong patuloy o pangkaraniwan ng participle ay natural na naipapahayag ng Filipino na ‘tinutulungan.’
- source_word: לָהֶם אֲזַבֵּחַ וְיַעְזְרוּנִי
  choice: maghahandog ako sa mga diyos na iyon upang tulungan nila ako
  rationale: 'Pinananatili ang layunin ni Ahaz: naghahandog siya sa pag-asang tutulungan siya ng mga diyos na iyon.'
- source_word: וְהֵם הָיוּ לוֹ לְהַכְשִׁילוֹ וּלְכָל יִשְׂרָאֵל
  choice: Ngunit ang mga iyon ang naging sanhi ng pagbagsak niya at ng buong Israel
  rationale: Natural na ipinahahayag ang mapaminsalang bunga ng Hiphil הכשיל, habang pinananatili ang pagbaligtad sa inaasahang tulong ni Ahaz.
theological_decisions:
- issue: Kung kaninong pananaw ang nagsasabing tinalo si Ahaz ng mga diyos ng Damasco
  choice: Pinanatili ang pahayag bilang bahagi ng salaysay at ng paganong pangangatwiran ni Ahaz, nang hindi sinasabing tunay na banal na mga tagagawa ang mga diyos na iyon.
  alternative: Maaaring ipaliwanag sa mismong teksto na inakala lamang ni Ahaz na sila ang tumalo sa kanya.
  rationale: Hindi tahasang nilalagyan ng Hebreo ng ‘akala niya’ ang unang sugnay. Ang huling sugnay ang nagbibigay ng mapanuyang hatol ng tagapagsalaysay, kaya hindi dapat idagdag sa pangunahing teksto ang isang paglilinaw na wala roon.
- issue: Lakas ng pangwakas na וְ bilang pagsalungat
  choice: Ngunit
  alternative: At
  rationale: 'Bagaman payak na waw ang anyo, malinaw na salungat ang kinahinatnan sa inaasahan ni Ahaz: ang inaasahang tutulong sa kanya ang naging sanhi ng pagbagsak.'
translation_notes:
  register: Makabago at marangal na Filipino, na may payak na pangungusap at bokabularyong madaling maunawaan. Ginamit ang ‘mga diyos na iyon’ sa ikalawang pagbanggit upang maging malinaw ang tinutukoy ng panghalip nang hindi binabago ang lohika ng Hebreo.
