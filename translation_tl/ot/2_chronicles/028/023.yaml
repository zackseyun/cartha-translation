  naturalness: Likas at marangal ang modernong Filipino. Ang “mga diyos na iyon” ay malinaw na katumbas ng panghalip na “kanila” sa Hebreo. Inayos ang puwesto ng talababa at ang literal na paliwanag sa talababa c upang maging malinaw at kumpleto.
  terminology: Ang “mga hain,” “mga diyos,” “Damasco,” at “Aram” ay wasto at pare-pareho. Napananatili ang mahalagang pangmaramihang “mga hari.”
