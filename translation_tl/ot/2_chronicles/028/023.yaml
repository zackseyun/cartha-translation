revisions:
- from: Naghandog siya ng mga hain sa mga diyos ng Damasco na tumalo sa kanya[a]. Sinabi niya, “Dahil tinutulungan sila ng mga diyos ng mga hari[b] ng Aram, maghahandog ako sa mga diyos na iyon upang tulungan nila ako.” Ngunit ang mga iyon ang naging sanhi ng pagbagsak niya at ng buong Israel.[c]
  to: Naghandog siya ng mga hain sa mga diyos ng Damasco na gumapi sa kanya[a]. Sinabi niya, “Dahil tinutulungan sila ng mga diyos ng mga hari[b] ng Aram, maghahandog ako sa mga diyos na iyon upang tulungan nila ako.” Ngunit ang mga iyon ang naging sanhi ng pagbagsak niya at ng buong Israel[c].
  rationale: Pinalitan ang “tumalo” ng “gumapi” para sa mas tuwirang pormal na katumbas sa kontekstong ito. Higit na mahalaga, inayos ang talababa c upang hindi maiwang bitin ang kaugnayan ng “buong Israel” sa kapahamakan, at inilipat ang panandang c bago ang tuldok. Walang binagong kahulugan ng talata.
