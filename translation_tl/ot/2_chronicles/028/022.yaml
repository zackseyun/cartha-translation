  yaml_path: translation/ot/2_chronicles/028/022.yaml
  text: In the time of his distress[a], he continued to act unfaithfully against Yahweh—he, King Ahaz.
translation:
  language: tl
  text: At sa panahon ng kanyang kagipitan, nagpatuloy pa siyang magtaksil kay Yahweh[a]—siya mismo, si Haring Ahaz.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “nagpatuloy pa siyang magtaksil kay Yahweh.” Ang pandiwang literal na “nagdagdag” na sinusundan ng pawatas ay isang idyomang nangangahulugang nagpatuloy o lalo pang naging di-tapat.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְעֵת
  choice: At sa panahon ng
  rationale: Pinananatili ang pang-ugnay na וּ at ang malinaw na panahong ipinahihiwatig ng pariralang may בְּ.
- source_word: הָצֵר לוֹ
  choice: kanyang kagipitan
  rationale: Ipinahihiwatig ng anyo na siya ay nasa gipit o matinding hirap; ang “kagipitan” ay maikli, natural, at marangal sa modernong Tagalog.
- source_word: וַיּוֹסֶף לִמְעוֹל
  choice: nagpatuloy siyang magtaksil
  rationale: Ang יסף na sinusundan ng pawatas ay idyomang nangangahulugang nagpatuloy o gumawa pa; ang מעל ay paglabag sa katapatan, lalo na sa ugnayang tipan.
- source_word: בַּיהוָה
  choice: kay Yahweh
  rationale: Sa konstruksiyong מעל ב, si Yahweh ang pinagtaksilan. Ginamit ang pangalang “Yahweh” upang tuwirang katawanin ang יהוה.
- source_word: הוּא הַמֶּלֶךְ אָחָז
  choice: siya mismo, si Haring Ahaz
  rationale: Ang hiwalay na panghalip na הוּא ay mariin; ipinahahayag ng “siya mismo” ang diin bago ang nakagugulat na pagkakakilanlan sa hari.
theological_decisions:
- issue: Paglalarawan sa מעל bilang pagtataksil
  choice: magtaksil kay Yahweh
  alternative: maging di-tapat kay Yahweh
  rationale: Ang “magtaksil” ay malinaw na naghahayag ng paglabag sa katapatan at tumutugma sa moral at pangtipang bigat ng salita nang hindi nagdaragdag ng tiyak na denominasyonal na pakahulugan.
- issue: Pagbigkas sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Tuwirang ginagamit sa tekstong Hebreo ang pangalang tipan na יהוה; pinananatili ito bilang “Yahweh” sa salin.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “kagipitan” at “magtaksil” bilang mga salitang madaling maunawaan ngunit sapat ang bigat; pinanatili ng gitling at “siya mismo” ang mariing pagtatapos ng Hebreo.
