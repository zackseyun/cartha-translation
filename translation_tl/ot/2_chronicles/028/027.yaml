  source_fidelity: 'Tapat ang salin sa Masoretikong Hebreo: napananatili ang pormulang pangkamatayan, ang aktibong “inilibing nila siya,” ang dobleng panlunan na “sa lungsod—sa Jerusalem,” ang sanhi, at ang tekstuwal na “mga hari ng Israel” nang hindi ito hinaharmonisa sa “Juda.” Ang “bilang kahalili niya” ay wastong naghahatid ng תַּחְתָּיו.'
  naturalness: Natural at marangal ang makabagong Filipino. Ang “nahimlay” at “mga ninuno” ay maayos na katumbas ng pormulang Hebreo sa isang saling pampanitikan; malinaw rin ang daloy ng salaysay. Ang mga gatlang ay katanggap-tanggap na paraan upang mapanatili ang pag-uulit ng panlunan.
  terminology: Wasto at pare-pareho ang mga pangalang Ahaz, Jerusalem, Israel, Juda, at Hezekias. Ang “mga libingan ng mga hari” ay angkop para sa mga maharlikang pook-libingan, at maingat na pinananatili ng talababa ang problematikong “Israel” nang hindi nagtatakda ng isang doktrinal o mapagpasyang interpretasyon.
