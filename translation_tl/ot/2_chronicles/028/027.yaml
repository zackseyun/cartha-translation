base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/027.yaml
  text: And Ahaz lay down with his fathers[a], and they buried him in the city, in Jerusalem, for they did not bring him into the tombs of the kings of Israel. And Hezekiah his son reigned in his place.
translation:
  language: tl
  text: At nahimlay si Ahaz kasama ng kanyang mga ninuno. Inilibing nila siya sa lungsod—sa Jerusalem—sapagkat hindi nila siya dinala sa mga libingan ng mga hari ng Israel.[a] At ang anak niyang si Hezekias ang naghari bilang kahalili niya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ganito sa Hebreo: “mga hari ng Israel.” Dahil hari ng Juda si Ahaz, nauunawaan ito ng ilan bilang pagtukoy sa mga maharlikang libingan ng angkan ni David; inaasahan naman ng iba ang “mga hari ng Juda.”'
    reason: Pinananatili ang pagbasa ng Hebreo habang ipinababatid ang kontekstuwal na kahirapan at ang alternatibong pagkaunawa.
lexical_decisions:
- source_word: וַיִּשְׁכַּב ... עִם אֲבֹתָיו
  choice: nahimlay ... kasama ng kanyang mga ninuno
  rationale: Pinananatili ng “nahimlay” ang magalang na idyoma ng pormulang pangkamatayan, samantalang mas malinaw sa karaniwang mambabasa ang “mga ninuno” kaysa sa literal na “mga ama.”
- source_word: וַיִּקְבְּרֻהוּ
  choice: inilibing nila siya
  rationale: Tumutugma ito sa tahasang aktibong pandiwang maramihan at sa layong panghalip ng Hebreo.
- source_word: בָעִיר בִּירוּשָׁלִַם
  choice: sa lungsod—sa Jerusalem
  rationale: Pinananatili ang dalawang pariralang panlunan ng Hebreo at ang diin na inilibing siya sa loob ng lungsod, ngunit hindi sa mga libingang maharlika.
- source_word: כִּי לֹא הֱבִיאֻהוּ
  choice: sapagkat hindi nila siya dinala
  rationale: Ipinahahayag ng “sapagkat” ang sanhi, at pinananatili ng “dinala” ang konkretong diwa ng Hiphil ng בוא sa halip na palitan ito ng “inilibing.”
- source_word: לְקִבְרֵי
  choice: sa mga libingan
  rationale: Ang “mga libingan” ay natural sa Filipino at angkop sa mga pook-libingan ng mga hari.
- source_word: מַלְכֵי יִשְׂרָאֵל
  choice: mga hari ng Israel
  rationale: Tapat itong nagpapanatili sa tahasang pagbasa ng tekstong Masoretiko at hindi ito itinatama sa inaasahang “Juda.”
- source_word: וַיִּמְלֹךְ ... תַּחְתָּיו
  choice: ang naghari bilang kahalili niya
  rationale: Natural na ipinahahayag sa Filipino ang pormula ng paghalili sa trono habang pinananatili ang diwa ng paghahari kapalit ng naunang hari.
theological_decisions:
- issue: Kung papalitan ng “mga hari ng Juda” ang “mga hari ng Israel” upang umayon sa kontekstong pangkasaysayan
  choice: Panatilihin sa pangunahing teksto ang “mga hari ng Israel”
  alternative: mga hari ng Juda
  rationale: Maliwanag na “Israel” ang nasa tekstong Masoretiko. Hindi dapat tahimik na ituwid o ipagkasundo ng salin ang tunay na tensiyon sa teksto; sa halip, ipinaliliwanag sa talababa ang inaasahang alternatibo.
translation_notes:
  register: Makabagong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “nahimlay” bilang magalang na idyoma at “mga ninuno” para sa likas na Filipino. Ang mga gatlang sa “sa lungsod—sa Jerusalem—” ay nagpapanatili sa pag-uulit at diin ng Hebreo nang hindi nagiging malamya.
