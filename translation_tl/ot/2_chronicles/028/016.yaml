base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/016.yaml
  text: At that time King Ahaz sent to the kings of Assyria for help[a].
translation:
  language: tl
  text: Nang panahong iyon, nagpadala si Haring Ahaz sa mga hari ng Asiria upang tulungan siya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “mga hari ng Asiria”; isinasalin naman ito ng ilan na “hari ng Asiria” upang iayon sa kalagayang pangkasaysayan.
    reason: alternative_reading
lexical_decisions:
- source_word: בָּעֵת הַהִיא
  choice: Nang panahong iyon
  rationale: Likas na panandang temporal sa makabagong Tagalog na malinaw na nagpapatuloy sa salaysay.
- source_word: שָׁלַח
  choice: nagsugo
  rationale: Pinananatili ang payak na diwa ng pagpapadala nang hindi tahasang nagdaragdag ng mga sugo o mensahero, na ipinahihiwatig lamang ng konteksto.
- source_word: הַמֶּלֶךְ אָחָז
  choice: si Haring Ahaz
  rationale: Natural sa Tagalog ang titulong “Haring” bago ang pangalang pantangi, kasama ang panandang “si.”
- source_word: עַל מַלְכֵי אַשּׁוּר
  choice: sa mga hari ng Asiria
  rationale: Sa konstruksiyong ito, ang עַל ay tumutukoy sa pinadalhan o nilapitan. Pinananatili rin ang tahasang maramihang anyo ng Masoretic Text.
- source_word: לַעְזֹר לוֹ
  choice: upang tulungan siya
  rationale: Tuwirang ipinapahayag ang layunin ng infinitive at ang panghalip na tumutukoy kay Ahaz, nang hindi nililinaw kung paano isasagawa ang tulong.
theological_decisions:
- issue: Kung iaayon sa inaasahang pangkasaysayang isahan ang maramihang “mga hari ng Asiria”
  choice: Panatilihin sa pangunahing teksto ang “mga hari ng Asiria.”
  alternative: ang hari ng Asiria
  rationale: Maramihan ang anyo ng tekstong Hebreo. Hindi ito dapat tahimik na gawing isahan para lamang iangkop sa ipinapalagay na kalagayang pangkasaysayan; inilalagay sa talababa ang karaniwang alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “nagsugo” sa halip na “nagpadala” upang hindi magmukhang kulang sa layon ang pangungusap, ngunit hindi tahasang idinagdag ang “mga mensahero.”
