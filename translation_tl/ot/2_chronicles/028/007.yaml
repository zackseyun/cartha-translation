base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/007.yaml
  text: And Zikri[a], a mighty man of Ephraim, killed Maaseiah the king’s son, Azrikam the overseer of the house, and Elkanah[c][b], second to the king.
translation:
  language: tl
  text: At pinatay ni Zikri, isang makapangyarihang lalaki ng Efraim,[a] si Maaseias na anak ng hari, si Azrikam na tagapangasiwa ng sambahayan,[b] at si Elkana na pangalawa sa hari.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “isang magiting na mandirigma ng Efraim” o “isang bayani ng Efraim.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “tagapangasiwa ng bahay”; malamang na tumutukoy ito sa palasyo o sambahayan ng hari.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “pangalawang pinakamataas na pinuno sa ilalim ng hari.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּהֲרֹג
  choice: pinatay
  rationale: Tuwirang ipinapahayag ng הרג ang pagpatay; malinaw at likas sa makabagong Filipino ang “pinatay.”
- source_word: זִכְרִי
  choice: Zikri
  rationale: Isinalin sa baybay-Filipino ang personal na pangalan nang malapit sa anyong Hebreo.
- source_word: גִּבּוֹר אֶפְרַיִם
  choice: isang magiting na mandirigma ng Efraim
  rationale: Maaaring mangahulugan ang גִּבּוֹר ng makapangyarihang lalaki, mandirigma, o bayani. Ang “magiting na mandirigma” ay natural at pinananatili ang diwang militar sa konteksto.
- source_word: מַעֲשֵׂיָהוּ
  choice: Maaseias
  rationale: Personal na pangalang tinumbasan ayon sa karaniwang baybay na angkop sa Filipino.
- source_word: בֶּן הַמֶּלֶךְ
  choice: anak ng hari
  rationale: Malapit at natural na katumbas ng konstruktong Hebreo, nang hindi ipinapasok kung nag-iisa o isa lamang siya sa mga anak.
- source_word: עַזְרִיקָם
  choice: Azrikam
  rationale: Personal na pangalang transliterado mula sa Hebreo.
- source_word: נְגִיד הַבָּיִת
  choice: tagapangasiwa ng palasyo
  rationale: Ang נְגִיד ay pinuno o mataas na opisyal, at sa kontekstong maharlika ang הַבָּיִת ay malamang na tumutukoy sa palasyo o sambahayan ng hari. Nauunawaan sa Filipino ang “tagapangasiwa ng palasyo” nang hindi labis na tinutukoy ang eksaktong tungkulin.
- source_word: אֶלְקָנָה
  choice: Elkana
  rationale: Personal na pangalang transliterado mula sa Hebreo.
- source_word: מִשְׁנֵה הַמֶּלֶךְ
  choice: pangalawa sa hari
  rationale: Pinananatili nito ang kahulugang ikalawa sa ranggo nang hindi naglalagay ng mas tiyak at posibleng anakronistikong titulo.
