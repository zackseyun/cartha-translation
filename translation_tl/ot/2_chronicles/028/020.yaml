base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/020.yaml
  text: Then Tiglath-pileser king of Assyria came against him and distressed him[a], but did not strengthen him.
translation:
  language: tl
  text: Dumating laban sa kanya si Tiglat-Pileser na hari ng Asiria at ginipit siya[a], ngunit hindi siya pinalakas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “at ginipit siya at hindi siya pinalakas.” Maaaring isalin nang mas pormal ang mga pang-ugnay sa Hebreo nang hindi tahasang ipinapakita ang pagsalungat.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא עָלָיו
  choice: sinalakay siya
  rationale: Sa kontekstong militar at pampolitika, ang idyomang בוא על ay may diwang pagdating laban sa isang tao. Ang “sinalakay siya” ay natural na Filipino at malinaw na ipinahahayag ang pagkapoot ng pagkilos, sa halip na ang neutral na “pumunta sa kanya.”
- source_word: תִּלְּגַת פִּלְנְאֶסֶר
  choice: Tiglat-Pileser
  rationale: Ginamit ang karaniwang anyo ng pangalan sa Filipino at sa mga saling biblikal, habang pinananatili itong transliterasyon ng pangalan ng haring Asirio.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: hari ng Asiria
  rationale: Tuwirang salin ng pariralang konstrakto; “Asiria” ang karaniwang Filipino na pangalan ng sinaunang kaharian.
- source_word: וַיָּצַר לוֹ
  choice: ginipit siya
  rationale: Maaaring tumukoy ang צרר sa pagdiin, panggigipit, o pagdudulot ng matinding hirap. Sinasaklaw ng “ginipit” ang mapaminsalang presyur nang hindi ito nililimitahan sa teknikal na pagkubkob.
- source_word: וְלֹא חֲזָקוֹ
  choice: ngunit hindi siya pinalakas
  rationale: Pinananatili ng “pinalakas” ang pangunahing diwa ng חזק. Ginagawang malinaw ng “ngunit” ang likas na pagsalungat sa konteksto—humingi si Ahaz ng tulong, ngunit hindi siya pinatatag o sinuportahan ng hari ng Asiria.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinili ang “ginipit” bilang karaniwang salitang may sapat na lakas para sa mapaminsalang presyur, at pinanatili ang “pinalakas” upang hindi paliitin ang saklaw ng Hebreo tungo lamang sa “tinulungan.”
