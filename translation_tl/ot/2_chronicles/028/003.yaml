  text: וְ/ה֥וּא הִקְטִ֖יר בְּ/גֵ֣יא בֶן הִנֹּ֑ם וַ/יַּבְעֵ֤ר אֶת בָּנָי/ו֙ בָּ/אֵ֔שׁ כְּ/תֹֽעֲבוֹת֙ הַ/גּוֹיִ֔ם אֲשֶׁר֙ הֹרִ֣ישׁ יְהוָ֔ה מִ/פְּנֵ֖י בְּנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/003.yaml
  text: He also burned incense in the Valley of Ben-hinnom[a], and he burned his sons in the fire, according to the abominations of the nations whom Yahweh had driven out before the sons of Israel.
translation:
  language: tl
  text: Nagsunog din siya ng insenso sa Lambak ng Ben-hinom, at sinunog niya sa apoy ang kanyang mga anak na lalaki[a], ayon sa kasuklam-suklam na mga gawain ng mga bansang pinalayas ni Yahweh mula sa harap ng mga anak ni Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O kaya, “pinaraan niya sa apoy ang kanyang mga anak na lalaki.” Mas tuwirang sinasabi ng Hebreo rito, “sinunog niya sa apoy ang kanyang mga anak na lalaki.”
    reason: alternative_reading
lexical_decisions:
- source_word: הִקְטִיר
  choice: nagsunog ng insenso
  rationale: Ang Hiphil ng קטר ay tumutukoy sa pagpapausok ng handog at madalas sa pagsusunog ng insenso. Ang pariralang ito ay likas sa modernong Tagalog at angkop sa kontekstong panrelihiyon.
- source_word: בְּגֵיא בֶן־הִנֹּם
  choice: sa Lambak ng Ben-hinom
  rationale: Isinalin ang heograpikong katawagan na גיא bilang “Lambak” at tinumbasan sa baybay-Tagalog ang pangalang Ben-hinnom. Hindi ginamit ang “Gehenna” upang maiwasang ipasok ang mga kaugnayang nabuo sa kalaunang panahon.
- source_word: וַיַּבְעֵר אֶת־בָּנָיו בָּאֵשׁ
  choice: sinunog niya sa apoy ang kanyang mga anak na lalaki
  rationale: Ang Hiphil ng בער kasama ng בָּאֵשׁ ay tuwirang nagpapahayag ng pagsunog. Pinanatili ang tahasang “mga anak na lalaki” para sa panlalaking maramihang anyo ng בָּנָיו, sa halip na gawing pangkalahatang “mga anak.”
- source_word: כְּתוֹעֲבוֹת
  choice: ayon sa kasuklam-suklam na mga gawain
  rationale: Ipinahihiwatig ng כ ang pagsunod o pagtulad, samantalang ang תועבות ay may matinding moral at panrelihiyong bigat. Nilinaw ng “mga gawain” ang tinutukoy nang hindi pinahihina ang paghatol ng teksto.
- source_word: הַגּוֹיִם
  choice: mga bansa
  rationale: Sa makasaysayang konteksto, tumutukoy ito sa mga bansang dating naninirahan sa lupain. Ang “mga bansa” ay malinaw at hindi nagdadala ng di-kailangang teolohikal na kulay.
- source_word: הֹרִישׁ
  choice: pinalayas
  rationale: Ang Hiphil ng ירש dito ay tumutukoy sa pagpapaalis o pag-aalis sa dating mga naninirahan sa lupain. Natural at malinaw sa Tagalog ang “pinalayas.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinanatili ang personal na pangalan ng Diyos sa pamamagitan ng transliterasyong “Yahweh,” sa halip na palitan ito ng isang titulo.
- source_word: מִפְּנֵי בְּנֵי יִשְׂרָאֵל
  choice: sa harap ng mga anak ni Israel
  rationale: Pinananatili nito ang larawan ng Hebreong idyoma at ang pormulang “mga anak ni Israel,” habang nananatiling mauunawaan sa Filipino ang pagpapaalis sa mga bansa mula sa kanilang harapan.
theological_decisions:
- issue: Kung palalambutin ang tahasang paglalarawan sa paghahandog ng mga anak sa apoy
  choice: “sinunog niya sa apoy ang kanyang mga anak na lalaki” sa pangunahing teksto
  alternative: “pinaraan niya sa apoy ang kanyang mga anak na lalaki”
  rationale: Ginagamit dito ang mas mariing pandiwang בער, hindi ang karaniwang pormulang tahasang nagsasabing “pinaraan sa apoy.” Kaya pinananatili sa pangunahing teksto ang tindi ng pananalita, habang inilalagay sa talababa ang tradisyonal na alternatibong pagbasa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang mga pangalang Yahweh, Ben-hinom, at Israel; iniwasan ang arkaikong pananalita at ang pagpapalambot sa tahasang karahasan ng Hebreo.
