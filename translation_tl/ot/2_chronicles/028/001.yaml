revisions:
- from: Dalawampung taong gulang si Ahaz nang maging hari siya, at naghari siya sa Jerusalem nang labing-anim na taon. Hindi niya ginawa ang matuwid sa paningin ni Yahweh, gaya ng ginawa ng ninuno niyang si David.[a]
  to: Si Ahaz ay dalawampung taong gulang nang siya ay maging hari, at naghari siya sa Jerusalem nang labing-anim na taon. Hindi niya ginawa ang tama sa paningin ni Yahweh, gaya ng ginawa ng ninuno niyang si David.[a]
  rationale: Inayos ang ayos ng pangungusap at ang katumbas ng Hebreong idiom para maging mas natural sa modernong Filipino Tagalog. Nilinaw din ang talababa sa pamamagitan ng pagtukoy sa “agarang ama,” na siyang tiyak na posibleng maling pagkaunawa sa literal na “ama.” Hindi binago ang kahulugan, ang pangalang Yahweh, o ang dinastikong ambigwidad ng orihinal.
