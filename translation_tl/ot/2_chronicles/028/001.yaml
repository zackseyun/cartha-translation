id: 2CH.28.1
reference: 2 Chronicles 28:1
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: בֶּן עֶשְׂרִ֤ים שָׁנָה֙ אָחָ֣ז בְּ/מָלְכ֔/וֹ וְ/שֵׁשׁ עֶשְׂרֵ֣ה שָׁנָ֔ה מָלַ֖ךְ בִּ/ירוּשָׁלִָ֑ם וְ/לֹא עָשָׂ֧ה הַ/יָּשָׁ֛ר בְּ/עֵינֵ֥י יְהוָ֖ה כְּ/דָוִ֥יד אָבִֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/001.yaml
  text: Ahaz was twenty years old when he became king[a], and he reigned sixteen years in Jerusalem. He did not do what was right in the eyes of Yahweh, as David his father had done.
translation:
  language: tl
  text: Si Ahaz ay dalawampung taong gulang nang siya ay maging hari, at naghari siya sa Jerusalem nang labing-anim na taon. Hindi niya ginawa ang tama sa paningin ni Yahweh, gaya ng ginawa ng ninuno niyang si David.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “ama niyang si David.” Ang “ama” rito ay nangangahulugang ninuno sa maharlikang angkan, hindi ang kaniyang agarang ama.
    reason: cultural_note
lexical_decisions:
- source_word: בֶּן עֶשְׂרִים שָׁנָה
  choice: Dalawampung taong gulang
  rationale: Karaniwang pormula ito sa Hebreo para tukuyin ang edad. Likas at eksakto sa modernong Tagalog ang napiling anyo.
- source_word: בְּמָלְכוֹ
  choice: nang maging hari siya
  rationale: Ipinahihiwatig ng parirala ang panahon ng pagluklok ni Ahaz bilang hari; malinaw at natural ito sa Tagalog.
- source_word: וְשֵׁשׁ עֶשְׂרֵה שָׁנָה מָלַךְ
  choice: at naghari siya ... nang labing-anim na taon
  rationale: Ang מָלַךְ ay tumutukoy sa aktuwal na paghahari, at ang 'nang labing-anim na taon' ay likas na pagpapahayag ng tagal.
- source_word: בִּירוּשָׁלִָם
  choice: sa Jerusalem
  rationale: Tuwirang lokatibong parirala na tumutukoy sa sentro ng kanyang paghahari.
- source_word: לֹא עָשָׂה הַיָּשָׁר
  choice: Hindi niya ginawa ang matuwid
  rationale: Pinananatili nito ang pormulang moral na pagsusuri ng Mga Hari at Mga Cronica, habang nananatiling malinaw sa Tagalog.
- source_word: בְּעֵינֵי יְהוָה
  choice: sa paningin ni Yahweh
  rationale: Pinananatili ang Hebreong idyomang nagsasaad ng pagsusuri ng Diyos.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasatitik ang personal na pangalang banal na nasa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: כְּדָוִיד אָבִיו
  choice: gaya ng ginawa ng ninuno niyang si David
  rationale: Sa kontekstong maharlika at dinastiko, ang אָבִיו ('kanyang ama') ay tumutukoy kay David bilang ninuno, hindi bilang agarang ama. Ginagawang malinaw ng salin ang nilalayong ugnayan nang hindi binabago ang paghahambing.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Tahasang ginagamit ng talata ang Tetragrammaton. Pinananatili ng 'Yahweh' ang banal na pangalan sa halip na palitan ito ng titulong 'PANGINOON.'
- issue: Kahulugan ng אָבִיו kaugnay ni David
  choice: ninuno niyang si David
  alternative: ama niyang si David
  rationale: Hindi agarang ama ni Ahaz si David; ginagamit dito ang 'ama' sa malawak na dinastikong diwa. Iniiwasan ng 'ninuno' ang maling pagkaunawa habang tapat sa referensiya ng Hebreo.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa pampublikong pagbasa. Ginamit ang karaniwang bokabularyong 'naghari,' 'matuwid,' at 'sa paningin,' at inilagay ang talababa sa pariralang aktuwal nitong nililinaw.
