id: 2CH.28.5
reference: 2 Chronicles 28:5
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַֽ/יִּתְּנֵ֜/הוּ יְהוָ֣ה אֱלֹהָי/ו֮ בְּ/יַ֣ד מֶ֣לֶךְ אֲרָם֒ וַ/יַּ֨כּוּ ב֔/וֹ וַ/יִּשְׁבּ֤וּ מִמֶּ֨/נּוּ֙ שִׁבְיָ֣ה גְדוֹלָ֔ה וַ/יָּבִ֖יאוּ דַּרְמָ֑שֶׂק וְ֠/גַם בְּ/יַד מֶ֤לֶךְ יִשְׂרָאֵל֙ נִתָּ֔ן וַ/יַּךְ בּ֖/וֹ מַכָּ֥ה גְדוֹלָֽה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/005.yaml
  text: Therefore Yahweh his God gave him into the hand of the king of Aram[a], and they struck him and took from him a great number of captives and brought them to Damascus. He was also given into the hand of the king of Israel[c][b], who struck him with a great blow.
translation:
  language: tl
  text: Kaya si Yahweh, na kanyang Diyos, ay nagbigay sa kanya sa kamay ng hari ng Aram[a]. Sinalakay siya ng mga ito at kinuha nila mula sa kanya ang malaking bilang ng mga bihag[b], at dinala ang mga ito sa Damasco. Ibinigay rin siya sa kamay ng hari ng Israel, na humampas sa kanya nang matindi[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Syria”; sa Hebreo, “Aram.”
    reason: lexical_alternative
  - marker: b
    text: O “kumuha sila mula sa kanya ng maraming bihag.”
    reason: lexical_alternative
  - marker: c
    text: O “nagbigay sa kanya ng isang malaking dagok.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנֵהוּ ... בְּיַד
  choice: ibinigay siya ... sa kamay
  rationale: Pinananatili ang Hebreong idyoma ng pagbibigay sa kapangyarihan ng iba, habang malinaw at likas pa rin sa Tagalog.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ang banal na pangalang YHWH sa pamamagitan ng transliterasyong karaniwang nauunawaan sa modernong Tagalog.
- source_word: אֱלֹהָיו
  choice: na kanyang Diyos
  rationale: Pinananatili ang panghalip na paari at ang ugnayang tipan kahit nasa konteksto ng paghatol.
- source_word: מֶלֶךְ אֲרָם
  choice: hari ng Aram
  rationale: Pinananatili ang pangalang Hebreo na Aram; ibinibigay sa talababa ang alternatibong tradisyonal na Syria.
- source_word: וַיַּכּוּ בוֹ
  choice: Tinalo siya ng mga Arameo
  rationale: Sa kontekstong militar at dahil maramihan ang pandiwa, nililinaw ang ipinahihiwatig na hukbo o mga tauhan ng hari ng Aram. Ang 'tinalo' ay likas na Tagalog para sa malawak na diwa ng נכה rito.
- source_word: וַיִּשְׁבּוּ מִמֶּנּוּ שִׁבְיָה גְדוֹלָה
  choice: kumuha sila sa kanya ng napakaraming bihag
  rationale: Ipinapahayag nang kongkreto ang malaking bilang ng mga bihag, habang ang talababa ay nagpapanatili ng alternatibong pag-unawa sa kolektibong pangngalan.
- source_word: וַיָּבִיאוּ דַּרְמָשֶׂק
  choice: dinala ang mga ito sa Damasco
  rationale: Ang layon ay di-binanggit sa Hebreo ngunit malinaw na tumutukoy sa mga bihag; idinagdag ang 'mga ito' para sa natural na Tagalog.
- source_word: וְגַם ... נִתָּן
  choice: Ibinigay rin siya
  rationale: Pinananatili ang pandiwang inuulit mula sa unang sugnay at ang dagdag na paghatol na ipinahihiwatig ng וְגַם.
- source_word: וַיַּךְ בּוֹ מַכָּה גְדוֹלָה
  choice: nagdulot sa kanya ng matinding pagkatalo
  rationale: Sa kontekstong militar, natural nitong naihahatid ang idyomatikong diwa ng 'humampas ng malaking hampas'; pinananatili sa talababa ang mas literal na larawan.
theological_decisions:
- issue: Ang ahensiya sa pagkatalo ni Ahaz
  choice: Tahasan na si Yahweh ang nagbigay kay Ahaz sa kapangyarihan ng mga dayuhang hari.
  alternative: Ilarawan lamang ito bilang pangyayaring pampolitika o pangmilitar.
  rationale: Dalawang ulit ginagamit ng Hebreo ang נתן upang balangkasin ang mga pagkatalo bilang paghatol ng Diyos; hindi ito dapat alisin o palabuin.
- issue: Pagtutumbas sa banal na pangalan
  choice: Yahweh
  alternative: PANGINOON o Jehovah
  rationale: Ang pinagmulan ay tahasang gumagamit ng Tetragrammaton יהוה, kaya pinananatili ang personal na pangalan sa transliterasyon.
- issue: Referente ng isahang panghalip
  choice: Pinanatiling 'siya/kanya,' na sa daloy ng salaysay ay tumutukoy kay Ahaz habang saklaw ng pagkatalo ang kanyang kaharian at mga tauhan.
  alternative: Palitan nang tahasan ng 'Juda' o 'hukbo ng Juda.'
  rationale: Pinananatili nito ang anyong isahan ng Hebreo at iniiwasang palitan ang referente ng isang interpretatibong pangngalan.
translation_notes:
  register: Modernong Filipino Tagalog na dignificado at madaling basahin. Ginamit ang 'napakaraming bihag' at 'matinding pagkatalo' para sa natural na daloy, samantalang inilagay sa mga talababa ang mahahalagang literal o leksikal na alternatibo. Lahat ng marker na [a], [b], at [c] ay nasa pangunahing teksto.
