revisions:
- from: Kaya ibinigay siya ni Yahweh na kanyang Diyos sa kamay ng hari ng Aram[a]. Tinalo siya ng mga Arameo at kumuha sila sa kanya ng napakaraming bihag[b], at dinala ang mga ito sa Damasco. Ibinigay rin siya sa kamay ng hari ng Israel, na nagdulot sa kanya ng matinding pagkatalo[c].
  to: Kaya si Yahweh, na kanyang Diyos, ay nagbigay sa kanya sa kamay ng hari ng Aram[a]. Sinalakay siya ng mga ito at kinuha nila mula sa kanya ang malaking bilang ng mga bihag[b], at dinala ang mga ito sa Damasco. Ibinigay rin siya sa kamay ng hari ng Israel, na humampas sa kanya nang matindi[c].
  rationale: Inayos ang sintaksis para sa mas natural na Tagalog at pinalitan ang mga salitang nagtatakda ng “pagkatalo” upang mapanatili ang mas malawak at matalinghagang lakas ng Hebreong “sumalakay/humampas” at “malaking dagok.” Pinananatili ang isahang panghalip, ang pag-uulit ng “ibinigay,” at ang mga anchor ng talababa.
