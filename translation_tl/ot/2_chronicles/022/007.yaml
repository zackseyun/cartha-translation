  to: Ang kapahamakan ni Ahazias sa pagpunta niya kay Joram ay mula sa Diyos. Nang dumating siya, lumabas siyang kasama ni Jehoram patungo kay Jehu[a] na anak ni Nimsi, na pinahiran na ni Yahweh upang lipulin ang sambahayan ni Ahab.
