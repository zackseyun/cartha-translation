  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וּ/מֵֽ/אֱלֹהִ֗ים הָיְתָה֙ תְּבוּסַ֣ת אֲחַזְיָ֔הוּ לָ/ב֖וֹא אֶל יוֹרָ֑ם וּ/בְ/בֹא֗/וֹ יָצָ֤א עִם יְהוֹרָם֙ אֶל יֵה֣וּא בֶן נִמְשִׁ֔י אֲשֶׁ֣ר מְשָׁח֣/וֹ יְהוָ֔ה לְ/הַכְרִ֖ית אֶת בֵּ֥ית אַחְאָֽב־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/022/007.yaml
  text: Ahaziah’s downfall[a], by his going to Joram, was from God; and when he came, he went out with Jehoram to Jehu son of Nimshi, whom Yahweh had anointed to cut off the house of Ahab.
translation:
  language: tl
  text: Ang kapahamakan ni Ahazias sa pagpunta niya kay Joram ay mula sa Diyos. Nang dumating siya, lumabas siyang kasama ni Jehoram patungo kay Jehu[a] na anak ni Nimsi, na pinahiran na ni Yahweh upang lipulin ang sambahayan ni Ahab.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “laban kay Jehu” o “upang salubungin si Jehu.” Sa literal na Hebreo, “patungo kay Jehu,” bagaman ipinahihiwatig ng konteksto ang isang marahas na pagharap.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֵאֱלֹהִים
  choice: ay mula sa Diyos
  rationale: Ipinahahayag ng מִן ang pinagmulan. Pinananatili ng parirala ang tuwirang pag-uugnay sa Diyos nang hindi tinutukoy kung ito ay tahasang pagtatakda, pagkilos ng probidensiya, o pagpapahintulot.
- source_word: תְּבוּסַת
  choice: pagkabuwal
  rationale: Saklaw ng salita ang pagkatalo, kapahamakan, at tuluyang pagbagsak. Ang “pagkabuwal” ay natural sa Filipino at sapat na malawak para sa masamang sinapit ni Ahazias.
- source_word: לָבוֹא אֶל יוֹרָם
  choice: sa pagpunta niya kay Joram
  rationale: Pinananatili nito ang ugnayan ng pagpunta kay Joram at ng pagkabuwal ni Ahazias nang hindi ginagawang mas tiyak ang uri ng sanhi kaysa sa Hebreo.
- source_word: וּבְבֹאוֹ
  choice: Nang dumating siya
  rationale: Ang בְּ na kasama ng infinitive construct at hulaping panghalip ay temporal; natural itong ipinahahayag sa Filipino sa pamamagitan ng “nang.”
- source_word: יָצָא עִם יְהוֹרָם אֶל יֵהוּא
  choice: lumabas siyang kasama ni Jehoram patungo kay Jehu
  rationale: Ang יָצָא ay “lumabas” o “humayo,” at ang אֶל ay literal na “patungo kay.” Hindi tahasang inilalagay sa pangunahing teksto ang diwang “laban kay,” bagaman posible iyon sa konteksto at inilalahad sa talababa.
- source_word: יְהוֹרָם / יוֹרָם
  choice: Joram / Jehoram
  rationale: Pinananatili ang dalawang anyo ng pangalan na ginamit sa tekstong Hebreo, kahit iisang hari ang tinutukoy.
- source_word: מְשָׁחוֹ
  choice: pinahiran
  rationale: Ito ang karaniwang biblikal na pananalita para sa paghirang sa pamamagitan ng pagpapahid. Ipinahihiwatig ng sugnay na nauna na ang pagpapahid kay Jehu bago ang tagpong ito.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin ang Tetragrammaton bilang personal na pangalang “Yahweh” sa halip na palitan ito ng isang titulo.
- source_word: לְהַכְרִית אֶת בֵּית אַחְאָב
  choice: upang lipulin ang sambahayan ni Ahab
  rationale: Ang Hiphil ng כרת ay nangangahulugang alisin, putulin, o lipulin. Ang “sambahayan” ay nagpapanatili sa dinastiko at pampamilyang diwa ng בֵּית.
theological_decisions:
- issue: Ang pagkilos ng Diyos sa pagkabuwal ni Ahazias
  choice: “Ang pagkabuwal ... ay mula sa Diyos”
  alternative: “Itinakda ng Diyos ang pagkabuwal” o “Pinahintulutan ng Diyos ang mga pangyayaring humantong sa pagkabuwal”
  rationale: Tahasang iniuugnay ng Hebreo sa Diyos ang pinagmulan ng pagkabuwal, ngunit hindi nito nililinaw ang eksaktong paraan ng banal na pagkilos. Pinananatili ng salin ang teolohikal na tensiyong iyon.
translation_notes:
  register: Makabago at marangal na Filipino na madaling maunawaan. Pinanatili ang “Joram/Jehoram” bilang magkaibang anyo sa Hebreo, ang personal na pangalang “Yahweh,” at ang dinastikong pariralang “sambahayan ni Ahab.”
