  text: וַ/יַּמְלִיכוּ֩ יוֹשְׁבֵ֨י יְרוּשָׁלִַ֜ם אֶת אֲחַזְיָ֨הוּ בְנ֤/וֹ הַ/קָּטֹן֙ תַּחְתָּ֔י/ו כִּ֤י כָל הָ/רִאשֹׁנִים֙ הָרַ֣ג הַ/גְּד֔וּד הַ/בָּ֥א בָֽ/עַרְבִ֖ים לַֽ/מַּחֲנֶ֑ה וַ/יִּמְלֹ֛ךְ אֲחַזְיָ֥הוּ בֶן יְהוֹרָ֖ם מֶ֥לֶךְ יְהוּדָֽה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/022/001.yaml
  text: Then the inhabitants of Jerusalem made Ahaziah[a], his youngest son, king in his place, because the raiding band that came with the Arabs into the camp had killed all the older sons. So Ahaziah son of Jehoram, king of Judah, became king.
translation:
  language: tl
  text: Iniluklok ng mga naninirahan sa Jerusalem si Ahazias[a], ang bunsong anak ni Jehoram, bilang hari na kahalili ni Jehoram, sapagkat pinatay ng pangkat ng mga mananalakay na dumating sa kampo kasama ng mga Arabe ang lahat ng nakatatandang anak ni Jehoram. Kaya naging hari si Ahazias, na anak ni Jehoram na hari ng Juda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang pangkat na dumating sa kampo sa gitna ng mga Arabe.” Maaaring magkaiba ang pag-unawa sa pariralang Hebreo depende sa kahulugan ng pang-ukol na kasama ng “mga Arabe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּמְלִיכוּ
  choice: ginawang hari
  rationale: 'Ipinahahayag nito ang causative na diwa ng Hiphil ng מלך: iniluklok o itinalaga nila siya bilang hari.'
- source_word: יוֹשְׁבֵי יְרוּשָׁלִַם
  choice: mga naninirahan sa Jerusalem
  rationale: Natural at malinaw na salin ng literal na 'mga nananahan sa Jerusalem.'
- source_word: בְנוֹ הַקָּטֹן
  choice: ang bunsong anak ni Jehoram
  rationale: Sa paghahambing sa nakatatandang mga anak sa kasunod na parirala, ang קטן ay tumutukoy sa pinakabata; nilinaw ang tinutukoy ng panghalip nang hindi binabago ang kahulugan.
- source_word: תַּחְתָּיו
  choice: bilang kahalili niya
  rationale: Ipinahahayag ang paghalili sa trono nang natural sa modernong Tagalog.
- source_word: כִּי
  choice: sapagkat
  rationale: Nagpapakilala sa dahilan kung bakit si Ahazias ang ginawang hari.
- source_word: כָל הָרִאשֹׁנִים
  choice: ang lahat ng nakatatanda niyang anak
  rationale: Literal itong 'lahat ng mga nauna,' ngunit sa agarang konteksto ay ang mga anak ni Jehoram na mas matanda kay Ahazias.
- source_word: הָרַג
  choice: pinatay
  rationale: Ang payak na aspektong naganap ay malinaw sa Tagalog; ipinahihiwatig na ng sugnay na dahilan na nauna ang pagpatay sa pagluklok.
- source_word: הַגְּדוּד
  choice: pangkat ng mga mananalakay
  rationale: Ang גדוד ay pangkat o hukbong nagsasagawa ng pagsalakay; pinananatili ng salin ang konotasyong militar at mapanamsam.
- source_word: הַבָּא בָעַרְבִים
  choice: na pumasok ... kasama ng mga Arabe
  rationale: Itinuturing ang ב bilang nagsasaad ng pagsama, habang itinatala sa talababa ang tunay na alternatibong pagbasa na 'kabilang sa mga Arabe.'
- source_word: לַמַּחֲנֶה
  choice: sa kampo
  rationale: Natural na ipinahahayag ang patutunguhan o pagpasok sa kampo kasunod ng 'pumasok.'
- source_word: וַיִּמְלֹךְ
  choice: naging hari
  rationale: Ang pandiwa sa pormulang ito ng paghalili ay may ingressive na diwa ng pag-akyat sa trono, hindi lamang tagal ng paghahari.
- source_word: אֲחַזְיָהוּ בֶן יְהוֹרָם מֶלֶךְ יְהוּדָה
  choice: si Ahazias na anak ni Jehoram, na hari ng Juda
  rationale: Nililinaw ng balangkas na si Jehoram ang tinutukoy na hari ng Juda.
