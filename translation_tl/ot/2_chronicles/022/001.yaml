translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “sapagkat” at “nakatatanda” para sa dignidad ng salaysay, habang iniwasan ang lipas o labis na teknikal na pananalita. Inilagay ang talababa sa “Ahazias” bilang marker ng alternatibong pag-unawa sa pariralang lilitaw sa kasunod na sugnay, alinsunod sa ibinigay na marker.
