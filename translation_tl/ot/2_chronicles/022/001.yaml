revisions:
- from: Pagkatapos, ginawang hari ng mga naninirahan sa Jerusalem si Ahazias[a], ang bunsong anak ni Jehoram, bilang kahalili niya, sapagkat pinatay ng pangkat ng mga mananalakay na pumasok sa kampo kasama ng mga Arabe ang lahat ng nakatatanda niyang anak. Kaya naging hari si Ahazias na anak ni Jehoram, na hari ng Juda.
  to: Iniluklok ng mga naninirahan sa Jerusalem si Ahazias[a], ang bunsong anak ni Jehoram, bilang hari na kahalili ni Jehoram, sapagkat pinatay ng pangkat ng mga mananalakay na dumating sa kampo kasama ng mga Arabe ang lahat ng nakatatandang anak ni Jehoram. Kaya naging hari si Ahazias, na anak ni Jehoram na hari ng Juda.
  rationale: Inayos ang ayos ng pangungusap para maging natural sa modernong Filipino at nilinaw ang mga antecedent ng panghalip. Hindi binago ang kahulugan, ang ugnayang pangkasaysayan, o ang umiiral na alternatibong pagbasa sa talababa.
