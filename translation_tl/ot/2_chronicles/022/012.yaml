id: 2CH.22.12
reference: 2 Chronicles 22:12
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יְהִ֤י אִתָּ/ם֙ בְּ/בֵ֣ית הָֽ/אֱלֹהִ֔ים מִתְחַבֵּ֖א שֵׁ֣שׁ שָׁנִ֖ים וַ/עֲתַלְיָ֖ה מֹלֶ֥כֶת עַל הָ/אָֽרֶץ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/022/012.yaml
  text: And he was with them in the house of God[a], hiding himself for six years[b], while Athaliah was reigning over the land.
translation:
  language: tl
  text: At nanatili siyang kasama nila sa bahay ng Diyos[a], na nagtatago[b] sa loob ng anim na taon, habang naghahari si Atalia sa lupain.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ibig sabihin, sa loob ng nasasakupan ng templo; literal, “bahay ng Diyos.”
    reason: cultural_note
  - marker: b
    text: Maaari ring “nakatago.” Maaaring unawain ang Hebreong participle bilang reflexive (“nagtatago”) o bilang paglalarawan sa kaniyang nakukubling kalagayan sa konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: At nanatili siya
  rationale: Sa konteksto, ipinagpapatuloy ng anyong ito ang salaysay at ipinahihiwatig ang patuloy na pananatili ni Joas; mas natural sa Tagalog ang “nanatili” kaysa sa literal na “siya ay naroon.”
- source_word: אִתָּם
  choice: kasama nila
  rationale: Tuwirang ipinahahayag nito na si Joas ay kapiling ng mga taong nagkukubli sa kaniya.
- source_word: בְּבֵית הָאֱלֹהִים
  choice: sa bahay ng Diyos
  rationale: Pinananatili nito ang literal at makabuluhang Hebreong pahayag na “bahay ng Diyos”; nililinaw sa talababa na templo ang tinutukoy sa konteksto.
- source_word: מִתְחַבֵּא
  choice: na nagtatago
  rationale: Ang hitpael participle ay likas na mababasang reflexive o middle, kaya ang “nagtatago” ang pangunahing salin; nananatiling posible sa konteksto ang kalagayang “nakatago,” yamang may ibang nagkubli sa kaniya.
- source_word: שֵׁשׁ שָׁנִים
  choice: sa loob ng anim na taon
  rationale: Natural na Tagalog ito para sa tuloy-tuloy na haba ng panahon.
- source_word: וַעֲתַלְיָה מֹלֶכֶת
  choice: habang naghahari si Atalia
  rationale: Ipinakikita ng participle ang nagpapatuloy at kasabay na paghahari ni Atalia sa anim na taong pagkukubli.
- source_word: עַל הָאָרֶץ
  choice: sa lupain
  rationale: Ang “lupain” ay tuwirang katumbas ng הָאָרֶץ sa kontekstong tumutukoy sa nasasakupan ng Juda, nang hindi idinaragdag sa teksto ang pangalang “Juda.”
theological_decisions:
- issue: Kung aktibong nagtatago si Joas o inilalarawan siyang nakatago
  choice: nagtatago
  alternative: nakatago / itinatago
  rationale: Sinusuportahan ng hitpael participle ang reflexive o middle na pagbasa, ngunit hindi inaalis ang posibilidad na ang diin ay nasa nakukubling kalagayan niya. Inilalahad ang alternatibo sa talababa upang mapanatili ang tunay na kalabuan.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang tradisyonal ngunit madaling maunawaang “bahay ng Diyos,” at ginamit ang “habang naghahari” upang natural na maipakita ang magkasabay at nagpapatuloy na mga pangyayari.
