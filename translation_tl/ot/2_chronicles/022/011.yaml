id: 2CH.22.11
reference: 2 Chronicles 22:11
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/תִּקַּח֩ יְהוֹשַׁבְעַ֨ת בַּת הַ/מֶּ֜לֶךְ אֶת יוֹאָ֣שׁ בֶּן אֲחַזְיָ֗הוּ וַ/תִּגְנֹ֤ב אֹת/וֹ֙ מִ/תּ֤וֹךְ בְּנֵֽי הַ/מֶּ֨לֶךְ֙ הַ/מּ֣וּמָתִ֔ים וַ/תִּתֵּ֥ן אֹת֛/וֹ וְ/אֶת מֵֽינִקְתּ֖/וֹ בַּ/חֲדַ֣ר הַ/מִּטּ֑וֹת וַ/תַּסְתִּירֵ֡/הוּ יְהוֹשַׁבְעַ֣ת בַּת הַ/מֶּ֣לֶךְ יְהוֹרָ֡ם אֵשֶׁת֩ יְהוֹיָדָ֨ע הַ/כֹּהֵ֜ן כִּ֣י הִיא֩ הָיְתָ֨ה אֲח֧וֹת אֲחַזְיָ֛הוּ מִ/פְּנֵ֥י עֲתַלְיָ֖הוּ וְ/לֹ֥א הֱמִיתָֽתְ/הוּ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/022/011.yaml
  text: But Jehoshabeath[a], the king’s daughter, took Joash son of Ahaziah and stole him away from among the king’s sons who were being put to death, and she put him and his nurse in the bedroom. So Jehoshabeath, the daughter of King Jehoram, the wife of Jehoiada the priest, hid him from Athaliah[c][b], and she did not put him to death.
translation:
  language: tl
  text: Ngunit kinuha ni Jehosabeat, na anak ng hari, si Joas na anak ni Ahazias, at palihim niya itong inilayo mula sa mga anak ng hari na pinapatay[a]. Inilagay niya si Joas at ang tagapagpasuso nito sa silid-tulugan[b]. Itinago ni Jehosabeat, na anak ni Haring Jehoram at asawa ng paring si Jehoiada, si Joas mula kay Atalia, sapagkat kapatid siya ni Ahazias; at hindi siya pinatay ni Atalia.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “na papatayin.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “sa silid ng mga higaan”; samakatuwid, isang silid-tulugan.
    reason: lexical_alternative
  - marker: c
    text: 'Hindi hayag sa Hebreo ang paksa ng “hindi siya pinatay.” Malamang na si Atalia ang tinutukoy: itinago ni Jehosabeat si Joas upang hindi siya mapatay ni Atalia.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַתִּקַּח
  choice: kinuha
  rationale: Karaniwang salaysay na kahulugan ng לקח; hindi idinaragdag sa mismong pandiwa ang interpretasyong “iniligtas.”
- source_word: וַתִּגְנֹב אֹתוֹ
  choice: palihim niya itong inilayo
  rationale: Ipinahahayag ang literal na diwa ng גנב na pagkuha nang palihim, ngunit iniiwasan ang “ninakaw,” na sa modernong Tagalog ay madaling magpahiwatig ng masamang pag-agaw sa bata.
- source_word: מִתּוֹךְ בְּנֵי הַמֶּלֶךְ הַמּוּמָתִים
  choice: mula sa mga anak ng hari na pinapatay
  rationale: Pinananatili ang pasibong participle bilang nagaganap na pagpatay; inilalagay sa talababa ang posibleng prospective na diwa.
- source_word: מֵינִקְתּוֹ
  choice: ang tagapagpasuso nito
  rationale: Tiyak na tumutukoy sa babaeng nagpapasuso sa batang si Joas; mas eksakto kaysa sa pangkalahatang “yaya.”
- source_word: בַּחֲדַר הַמִּטּוֹת
  choice: sa silid-tulugan
  rationale: Natural na katumbas ng literal na “silid ng mga higaan,” na ipinaliliwanag sa talababa.
- source_word: וַתַּסְתִּירֵהוּ
  choice: itinago ... si Joas
  rationale: Payak at natural na salin ng סתר; inulit ang pangalan upang maging malinaw ang tinutukoy sa mahabang pangungusap.
- source_word: אֵשֶׁת יְהוֹיָדָע הַכֹּהֵן
  choice: asawa ng paring si Jehoiada
  rationale: Pinananatili ang pagkakakilanlan at ugnayang ibinibigay ng tekstong Hebreo sa natural na ayos ng Tagalog.
- source_word: כִּי הִיא הָיְתָה אֲחוֹת אֲחַזְיָהוּ
  choice: at kapatid ni Ahazias
  rationale: Isinama sa magkakasunod na paglalarawan kay Jehosabeat. Ang כִּי ay nagbibigay ng paliwanag o dahilan, na naipahihiwatig ng appositional na ayos nang hindi pinabibigat ang pangungusap.
- source_word: מִפְּנֵי עֲתַלְיָהוּ
  choice: mula kay Atalia
  rationale: Natural na Tagalog para sa pagtatago sa bata mula sa presensiya at abot ni Atalia.
- source_word: וְלֹא הֱמִיתָתְהוּ
  choice: kaya hindi siya napatay nito
  rationale: Ipinahahayag ang malamang na resultang diwa at ginagawang si Atalia ang pinakamalapit na referent ng “nito,” habang itinatala sa talababa ang gramatikal na kalabuan ng paksa.
theological_decisions:
- issue: Paksa ng pangwakas na וְלֹא הֱמִיתָתְהוּ
  choice: 'Si Atalia ang malamang na ipinahihiwatig na paksa: hindi niya napatay si Joas.'
  alternative: Maaaring unawain sa mahigpit na gramatikal na pagkakasunod na si Jehosabeat ang paksa, bagaman hindi ito ang natural na kahulugan sa konteksto.
  rationale: Walang hayag na paksa ang pandiwang pambabae sa Hebreo. Dahil kaagad na binanggit ang pagtatago kay Joas mula kay Atalia, kontekstuwal na mas malamang na si Atalia ang hindi nakapatay sa kanya. Pinananatili sa talababa ang tunay na kalabuan.
translation_notes:
  register: 'Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “tagapagpasuso” para sa tiyak na papel ng מֵינֶקֶת, at “palihim na inilayo” upang mapanatili ang lihim na pagkilos ng גנב nang hindi magdulot ng di-angkop na negatibong pahiwatig ng “ninakaw.” Ang mga pangalan ay nasa karaniwang anyong Tagalog: Jehosabeat, Joas, Ahazias, Jehoram, Jehoiada, at Atalia.'
