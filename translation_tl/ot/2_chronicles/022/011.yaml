  source_fidelity: Kailangan ang maliit ngunit mahalagang rebisyon. Ang draft ay tumpak sa pangunahing kilos at mga ugnayan, ngunit ang כִּי ('sapagkat/dahil') sa paliwanag na si Jehosabeat ay kapatid ni Ahazias ay napahina sa simpleng appositional na paglalarawan. Dapat itong katawanin bilang dahilan. Ang pangwakas na pambabaeng paksa ay hindi hayag sa Hebreo; ang pagtukoy kay Atalia ang pinakamalamang na pagbasa, basta itala ang kalabuan.
  naturalness: Malinaw at modernong Tagalog ang karamihan ng draft. Mas natural at mas tapat ang paghihiwalay ng mahabang unang salaysay sa dalawang pangungusap at ang tahasang paglalagay ng relasyong sanhi sa 'sapagkat kapatid siya ni Ahazias.'
  terminology: Ang 'palihim na inilayo,' 'tagapagpasuso,' 'silid-tulugan,' at 'paring si Jehoiada' ay angkop at marangal na modernong Tagalog. Pinanatili ang mga anyo ng pangalan na ginamit sa draft para sa pagkakapare-pareho.
