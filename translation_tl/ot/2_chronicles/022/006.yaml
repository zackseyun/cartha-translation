  text: וַ/יָּ֜שָׁב לְ/הִתְרַפֵּ֣א בְ/יִזְרְעֶ֗אל כִּ֤י הַ/מַּכִּים֙ אֲשֶׁ֣ר הִכֻּ֣/הוּ בָֽ/רָמָ֔ה בְּ/הִלָּ֣חֲמ֔/וֹ אֶת חֲזָהאֵ֖ל מֶ֣לֶךְ אֲרָ֑ם וַ/עֲזַרְיָ֨הוּ בֶן יְהוֹרָ֜ם מֶ֣לֶךְ יְהוּדָ֗ה יָרַ֡ד לִ/רְא֞וֹת אֶת יְהוֹרָ֧ם בֶּן אַחְאָ֛ב בְּ/יִזְרְעֶ֖אל כִּי חֹלֶ֥ה הֽוּא־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/022/006.yaml
  text: So he returned to Jezreel to recover[a], because of the wounds that they had inflicted on him at Ramah when he fought against Hazael king of Aram. And Azariah son of Jehoram, king of Judah, went down to see Jehoram son of Ahab in Jezreel[b], because he was sick.
translation:
  language: tl
  text: Kaya bumalik siya sa Jezreel upang gumaling mula sa mga sugat na idinulot nila sa kanya sa Rama, nang makipaglaban siya kay Hazael na hari ng Aram. At bumaba si Azaria[a] na anak ni Jehoram, na hari ng Juda, upang makita[b] si Jehoram na anak ni Ahab sa Jezreel, sapagkat may sakit ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Azaria ang pangalang nakasulat dito sa Mga Cronica; ang hari ring ito ay tinatawag na Ahazias sa ibang bahagi.
    reason: alternative_reading
  - marker: b
    text: O “upang dalawin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: Kaya bumalik siya
  rationale: Ang wayyiqtol ng שׁוב ay nagpapatuloy sa salaysay at may pangunahing diwang “bumalik.” Ipinahahayag ng “kaya” ang likas na ugnayan sa naunang pangyayari nang hindi nagdaragdag ng tiyak na paliwanag.
- source_word: לְהִתְרַפֵּא
  choice: upang magpagaling
  rationale: Ang hitpael infinitive ng רפא ay tumutukoy sa pagpapagaling o pagpapalakas matapos masugatan. Likas sa modernong Filipino ang “magpagaling” sa ganitong konteksto.
- source_word: כִּי הַמַּכִּים אֲשֶׁר הִכֻּהוּ
  choice: sa mga sugat na idinulot nila sa kanya
  rationale: 'Ang הַמַּכִּים ay literal na mga hampas o sugat, at ang הִכֻּהוּ ay nagpapanatili sa di-tiyak na maramihang gumawa: “nila.” Ang “idinulot” ay malinaw at natural kaugnay ng mga sugat.'
- source_word: בָרָמָה
  choice: sa Rama
  rationale: Pinanatili ang pangalang-lugar ayon sa anyong nakasulat sa tekstong Hebreo, nang hindi ito inihaharmonisa sa mas mahabang pangalan sa ibang salaysay.
- source_word: בְּהִלָּחֲמוֹ אֶת חֲזָהאֵל
  choice: nang makipaglaban siya kay Hazael
  rationale: Ang בְּ kasama ng infinitive construct ay nagsasaad ng panahong kalagayan. Sa Filipino, malinaw sa konteksto na ang “makipaglaban kay” ay pakikipaglaban laban kay Hazael.
- source_word: וַעֲזַרְיָהוּ
  choice: At bumaba si Azaria
  rationale: Pinanatili ang pangalang nakasulat sa Chronicles, עֲזַרְיָהוּ, sa halip na iharmonisa ito sa Ahazias na ginagamit para sa haring ito sa ibang talata.
- source_word: יָרַד
  choice: bumaba
  rationale: Pinananatili nito ang direksiyonal na diwa ng ירד, hindi lamang ang pangkalahatang “pumunta.”
- source_word: לִרְאוֹת
  choice: upang makita
  rationale: Ito ang tuwirang diwa ng ראה. Posible rin sa konteksto ang idyomatikong “upang dalawin,” kaya inilagay iyon sa talababa.
- source_word: כִּי חֹלֶה הוּא
  choice: sapagkat may sakit ito
  rationale: Ang חֹלֶה ay nangangahulugang may sakit o nasa mahinang kalagayan. Hindi nilimitahan ng salin ang sanhi sa mga sugat, bagaman iyon ang konteksto.
theological_decisions:
- issue: Pagkakaiba-iba ng pangalan ng hari sa salaysay ng Chronicles
  choice: Azaria sa pangunahing teksto
  alternative: Ahazias
  rationale: Ang tekstong Hebreo ng talatang ito ay may anyong Azariahu. Pinananatili ito bilang usapin ng katapatan sa pinagmulang teksto, habang ipinababatid sa talababa na Ahazias ang tawag sa hari ring ito sa ibang mga talata.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “magpagaling,” “idinulot,” at “may sakit” bilang natural na pananalita, habang pinanatili ang mga direksiyonal at leksikal na detalye ng Hebreo. Inilagay ang panghalip na “ito” sa hulihan upang malinaw na si Jehoram na anak ni Ahab ang may sakit.
