  text: וַ/עֲתַלְיָ֨הוּ֙ אֵ֣ם אֲחַזְיָ֔הוּ רָאֲתָ֖ה כִּ֣י מֵ֣ת בְּנָ֑/הּ וַ/תָּ֗קָם וַ/תְּדַבֵּ֛ר אֶת כָּל זֶ֥רַע הַ/מַּמְלָכָ֖ה לְ/בֵ֥ית יְהוּדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/022/010.yaml
  text: Athaliah[a], the mother of Ahaziah, saw that her son was dead, and she arose and destroyed all the royal offspring of the house of Judah.
translation:
  language: tl
  text: Nakita ni Atalia[a], ang ina ni Ahazias, na patay na ang kaniyang anak. Bumangon siya at nilipol ang lahat ng maharlikang supling ng sambahayan ni Juda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mahirap ang anyo ng pandiwang Hebreo rito; sa literal ay “nagsalita.” Ngunit sinusuportahan ng konteksto at ng kaagapay na salaysay sa 2 Hari 11:1 ang diwang “nilipol” o “pinatay.”
    reason: textual_variant
lexical_decisions:
- source_word: וַעֲתַלְיָהוּ
  choice: Nang makita ni Atalia
  rationale: Ginamit ang karaniwang anyong Tagalog ng pangalang Athaliah. Ang waw ay likas na naipaloob sa sugnay na pasalaysay at hindi isinalin bilang isang tahasang salitang panahunan.
- source_word: אֵם אֲחַזְיָהוּ
  choice: na ina ni Ahazias
  rationale: Malinaw at natural na ipinahahayag ang ugnayang construct at ang appositional na pagkakakilanlan.
- source_word: רָאֲתָה כִּי מֵת בְּנָהּ
  choice: makita ... na patay na ang kanyang anak
  rationale: Ang ראה na sinusundan ng כי ay tumutukoy sa pagkilala sa isang katotohanan. Pinananatili ng “patay na” ang estadong nasa Hebreo at ipinahihiwatig ang naganap nang kamatayan.
- source_word: וַתָּקָם
  choice: kumilos siya
  rationale: Sa salaysay, ang קום ay maaaring magpakilala ng tiyak at mapagpasiyang pagkilos, hindi lamang literal na pagtayo. Mas natural dito ang “kumilos siya” kaysa “tumayo siya.”
- source_word: וַתְּדַבֵּר
  choice: pinatay
  rationale: Bagaman mahirap ang anyong Masoretiko at sa literal na anyo ay kaugnay ng “magsalita,” hinihingi ng tuwirang layon at ng kaagapay na salaysay sa 2 Hari 11:1 ang diwang paglipol o pagpatay. Ang “pinatay” ay malinaw sa modernong Tagalog nang hindi tinutukoy ang paraan.
- source_word: אֵת כָּל זֶרַע הַמַּמְלָכָה
  choice: ang lahat ng supling ng maharlikang angkan
  rationale: Ang זרע ay literal na “binhi” at sa kontekstong dinastiko ay “supling.” Nililinaw ng “maharlikang angkan” na ang tinutukoy ay ang linya ng mga tagapagmana ng kaharian.
- source_word: לְבֵית יְהוּדָה
  choice: ng sambahayan ni Juda
  rationale: Ipinahahayag nito ang dinastikong sambahayan na kinabibilangan ng mga maharlikang supling; pinananatili rin ang imahen ng “sambahayan” sa Hebreo.
theological_decisions:
- issue: Pagpapakahulugan sa mahirap na pandiwang וַתְּדַבֵּר
  choice: Isinalin ayon sa konteksto bilang “pinatay.”
  alternative: “nagsalita laban sa” o “ipinapatay”
  rationale: Hindi makabuluhan sa tuwirang layong “lahat ng supling” ang literal na “nagsalita.” Sinusuportahan ng 2 Hari 11:1 ang diwang paglipol. Gayunman, inilalahad sa talababa ang kahirapan ng anyong Hebreo upang hindi maitago ang tekstuwal na usapin.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “Atalia” at “Ahazias” bilang likas na anyong Tagalog ng mga pangalan. Iniwasan ang sobrang literal na “tumayo” kung saan ang pandiwa ay nagpapakilala ng mapagpasiyang pagkilos, at pinanatili sa talababa ang tunay na kahirapan ng tekstong Hebreo.
