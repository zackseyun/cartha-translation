  to: Nakita ni Atalia[a], ang ina ni Ahazias, na patay na ang kaniyang anak. Bumangon siya at nilipol ang lahat ng maharlikang supling ng sambahayan ni Juda.
  rationale: Inayos ang estruktura upang manatiling pangunahing sugnay ang “nakita,” pinalitan ang malabong “kumilos siya” ng “bumangon siya” para sa וַתָּקָם, at pinasimple ang pariralang para sa maharlikang binhi. Pinanatili ang kontekstuwal na “nilipol” para sa pinagtatalunang וַתְּדַבֵּר at tahasang ipinaliwanag sa talababa ang literal na anyo at ang batayan ng salin.
