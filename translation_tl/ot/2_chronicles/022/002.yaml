base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/022/002.yaml
  text: Ahaziah was forty-two years old when he became king[a], and he reigned one year in Jerusalem. His mother’s name was Athaliah[b], the daughter of Omri.
translation:
  language: tl
  text: Apatnapu't dalawang taong gulang si Ahazias nang siya'y maging hari[a], at isang taon siyang naghari sa Jerusalem. Ang pangalan ng kanyang ina ay Atalia[b], na anak na babae ni Omri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “apatnapu't dalawang taong gulang.” Sa katulad na salaysay sa 2 Hari 8:26 ay “dalawampu't dalawang taong gulang,” kaya itinuturing ito ng ilan na isang suliraning pangteksto o iminumungkahi ang ibang paraan ng pagtutuos sa bilang.
    reason: textual_variant
  - marker: b
    text: O “inapo ni Omri.” Kung minsan, ang Hebreong salita para sa “anak na babae” ay ginagamit nang mas malawak para sa isang babaeng inapo.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אַרְבָּעִים וּשְׁתַּיִם שָׁנָה
  choice: Apatnapu't dalawang taong gulang
  rationale: Karaniwang idyomang Hebreo ito para sa edad. Ang ganitong anyo ang natural at malinaw sa modernong Tagalog.
- source_word: בְמָלְכוֹ
  choice: nang maging hari siya
  rationale: Ipinahihiwatig ng anyong Hebreo ang panahon ng pagluklok niya bilang hari; natural itong ipinapahayag sa Tagalog sa ganitong paraan.
- source_word: וְשָׁנָה אַחַת מָלַךְ
  choice: at isang taon siyang naghari
  rationale: Pinananatili ang tahasang bilang at ang tagal ng kanyang paghahari.
- source_word: בִּירוּשָׁלָם
  choice: sa Jerusalem
  rationale: Karaniwang locative na gamit ng pang-ukol sa pangalan ng lugar.
- source_word: וְשֵׁם אִמּוֹ
  choice: Ang pangalan ng kanyang ina ay
  rationale: Malinaw at marangal na modernong Tagalog para sa pormulang ginagamit sa mga ulat tungkol sa mga hari.
- source_word: עֲתַלְיָהוּ
  choice: Atalia
  rationale: Ginamit ang nakaugaliang anyo ng pangalan sa Tagalog.
- source_word: בַּת עָמְרִי
  choice: na anak ni Omri
  rationale: Ang payak na kahulugan ng בַּת ay “anak na babae”; sa Tagalog, sapat ang “anak” dahil malinaw na babae si Atalia. Ang mas malawak na kahulugang “inapo” ay inilagay sa talababa.
theological_decisions:
- issue: Pagkakaiba sa edad ni Ahazias nang lumuklok
  choice: Pinanatili sa pangunahing teksto ang “apatnapu't dalawang taong gulang,” ayon sa tekstong Masoretiko.
  alternative: “Dalawampu't dalawang taong gulang,” gaya ng nasa 2 Hari 8:26, o ibang paraan ng pagtutuos sa bilang.
  rationale: Ang ibinigay na Hebreong pinagmulan ay tahasang nagsasaad ng apatnapu't dalawa. Hindi dapat tahimik na baguhin o pagtugmain ng salin ang magkaibang pahayag; ipinaliliwanag ang suliranin sa talababa.
- issue: Saklaw ng katawagang “anak ni Omri”
  choice: Isinalin bilang “anak ni Omri.”
  alternative: “Inapo ni Omri.”
  rationale: Pinananatili sa pangunahing teksto ang karaniwang kahulugan ng salitang Hebreo nang hindi nilulutas ang tanong sa tiyak na ugnayang pampamilya; binanggit sa talababa ang posibleng mas malawak na gamit.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Pinanatili ang maigsi at pormulang estilo ng ulat tungkol sa paghahari, kasama ang tunay na tekstuwal at genealogical na tensiyon sa mga talababa.
