  text: וַ/יְבַקֵּשׁ֩ אֶת אֲחַזְיָ֨הוּ וַֽ/יִּלְכְּדֻ֜/הוּ וְ/ה֧וּא מִתְחַבֵּ֣א בְ/שֹֽׁמְר֗וֹן וַ/יְבִאֻ֣/הוּ אֶל יֵהוּא֮ וַ/יְמִתֻ/הוּ֒ וַֽ/יִּקְבְּרֻ֔/הוּ כִּ֤י אָֽמְרוּ֙ בֶּן יְהוֹשָׁפָ֣ט ה֔וּא אֲשֶׁר דָּרַ֥שׁ אֶת יְהוָ֖ה בְּ/כָל לְבָב֑/וֹ וְ/אֵין֙ לְ/בֵ֣ית אֲחַזְיָ֔הוּ לַ/עְצֹ֥ר כֹּ֖חַ לְ/מַמְלָכָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/022/009.yaml
  text: And he sought Ahaziah[a], and they captured him while he was hiding in Samaria, and they brought him to Jehu and put him to death. Then they buried him, for they said, “He is the son of Jehoshaphat[b], who sought Yahweh with all his heart.” And the house of Ahaziah had no power to retain the kingdom.
translation:
  language: tl
  text: Hinanap niya si Ahazias, at nahuli nila siya habang nagtatago siya sa Samaria. Dinala nila siya kay Jehu at pinatay nila siya. Pagkatapos, inilibing nila siya, sapagkat sinabi nila, “Anak siya ni Jehoshafat, na naghanap kay Yahweh nang buong puso.” At ang sambahayan ni Ahazias ay walang kapangyarihang mapanatili ang kaharian.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְבַקֵּשׁ אֶת אֲחַזְיָהוּ
  choice: Hinanap niya si Ahazias
  rationale: Pinananatili ang isahang paksa ng pandiwang Hebreo nang hindi tinutukoy kung si Jehu mismo o ang kumikilos sa ilalim ng kanyang kapangyarihan ang tinutukoy.
- source_word: וַיִּלְכְּדֻהוּ
  choice: nahuli nila ito
  rationale: Ang לכד ay tumutukoy sa paghuli o pagdakip; pinananatili ng “nila” ang maramihang anyo ng pandiwa.
- source_word: וְהוּא מִתְחַבֵּא בְשֹׁמְרוֹן
  choice: habang nagtatago sa Samaria
  rationale: Ipinahihiwatig ng participle ang nagpapatuloy na pagtatago ni Ahazias nang siya ay mahuli.
- source_word: וַיְבִאֻהוּ אֶל יֵהוּא
  choice: Dinala nila siya kay Jehu
  rationale: Likas at tuwirang salin ng causative na anyo ng בוא sa kontekstong pasalaysay.
- source_word: וַיְמִתֻהוּ
  choice: pinatay
  rationale: Ang causative na anyo ng מות ay nangangahulugang naging sanhi sila ng kanyang kamatayan. Ang “pinatay” ay malinaw at natural, habang ang posibleng mas tahasang causative na pagbasa ay inilalagay sa talababa.
- source_word: וַיִּקְבְּרֻהוּ
  choice: inilibing nila siya
  rationale: Tuwirang salin ng קבר na pinananatili ang maramihang tagaganap.
- source_word: כִּי אָמְרוּ
  choice: sapagkat sinabi nila
  rationale: Ipinakikilala ng כִּי ang dahilan kung bakit nila siya inilibing.
- source_word: בֶּן יְהוֹשָׁפָט הוּא
  choice: Anak siya ni Jehoshafat
  rationale: Natural na makabagong Tagalog para sa nominal na sugnay at pinananatili ang tuwirang pananalita.
- source_word: אֲשֶׁר דָּרַשׁ אֶת יְהוָה
  choice: na naghanap kay Yahweh
  rationale: Sa kaugnayan sa Diyos, ang דרש ay nagsasaad ng taimtim na paghahanap, paglapit, o paghingi ng patnubay; “naghanap” ang pinakapayak na saling hindi labis na nagpapaliwanag.
- source_word: בְּכָל לְבָבוֹ
  choice: nang buong puso
  rationale: Natural na salin ng idyomang Hebreo para sa lubos at tapat na debosyon.
- source_word: וְאֵין לְבֵית אֲחַזְיָהוּ לַעְצֹר כֹּחַ לְמַמְלָכָה
  choice: ang sambahayan ni Ahazias ay wala nang lakas upang panghawakan ang kaharian
  rationale: Pinananatili ang dinastikong diwa ng “sambahayan,” ang kawalan ng kakayahan o kapangyarihan, at ang kaugnayan nito sa pagpapanatili ng paghahari.
theological_decisions:
- issue: Paglalapat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah o PANGINOON
  rationale: Pangalan mismo ng Diyos ang nasa tekstong Hebreo, kaya tinutumbasan ito ng transliterasyong “Yahweh” sa halip na palitan ng isang titulo.
- issue: Diwa ng huling sugnay tungkol sa sambahayan ni Ahazias
  choice: Wala itong lakas upang panghawakan ang kaharian
  alternative: Wala itong sinumang may kakayahang mamahala sa kaharian
  rationale: Ang Hebreo ay maaaring tumukoy sa dinastikong kawalan ng lakas o sa kawalan ng taong may sapat na kakayahang maghari. Pinananatili sa pangunahing teksto ang mas malapit na larawan ng kawalan ng lakas at itinatala sa talababa ang personal na pagbasa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “sambahayan” para sa dinastikong kahulugan ng בֵּית at iniwasang tukuyin nang tahasan ang hindi pinangalanang isahang paksa ng unang pandiwa.
