revisions:
- from: Hinanap niya si Ahazias, at nahuli nila ito habang nagtatago sa Samaria. Dinala nila siya kay Jehu at pinatay[a]. Pagkatapos, inilibing nila siya, sapagkat sinabi nila, “Anak siya ni Jehoshafat, na naghanap kay Yahweh nang buong puso.” At ang sambahayan ni Ahazias ay wala nang lakas upang panghawakan ang kaharian.[b]
  to: Hinanap niya si Ahazias, at nahuli nila siya habang nagtatago siya sa Samaria. Dinala nila siya kay Jehu at pinatay nila siya. Pagkatapos, inilibing nila siya, sapagkat sinabi nila, “Anak siya ni Jehoshafat, na naghanap kay Yahweh nang buong puso.” At ang sambahayan ni Ahazias ay walang kapangyarihang mapanatili ang kaharian.
  rationale: Inalis ang hindi sinusuportahang aspektong "nang," ginawang mas natural ang panghalip para kay Ahazias, at inalis ang mga talababa na hindi kinakailangan o maaaring magpahiwatig ng kahulugang wala sa Hebreo. Pinananatili ng huling sugnay ang dinastikong kawalan ng kakayahang mapanatili ang paghahari nang hindi nililimitahan ito sa kawalan ng isang indibidwal na karapat-dapat mamuno.
