  source_fidelity: Tumpak na naihahatid ng draft ang panghukumang diwa ng כְּהִשָּׁפֵט, ang sambahayang/dinastikong idyoma ng בֵּית אַחְאָב, ang mataas na katayuan ng שָׂרֵי יְהוּדָה, ang patuloy na paglilingkod, at ang tuwirang pagpatay. Gayunman, ang pangunahing teksto ay isinasalin ang בְּנֵי bilang payak na “mga anak,” samantalang malinaw na “mga anak na lalaki” ang Hebreo. Dapat mapanatili ang detalyeng ito sa mismong teksto, hindi lamang sa talababa.
  naturalness: Hindi natural sa makabagong Filipino ang sunod na “Nangyari na habang.” Ang “Nangyari ito habang” ay malinaw, natural, at pinananatili ang tungkulin ng pormulang pasalaysay.
  terminology: Ang “paghatol,” “sambahayan,” “mga pinuno,” “naglilingkod,” at “pinatay” ay angkop sa konteksto at rehistro. Pinananatili ang “Ahazias” at “Juda” nang pare-pareho.
