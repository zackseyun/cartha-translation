  text: וַ/יְהִ֕י כְּ/הִשָּׁפֵ֥ט יֵה֖וּא עִם בֵּ֣ית אַחְאָ֑ב וַ/יִּמְצָא֩ אֶת שָׂרֵ֨י יְהוּדָ֜ה וּ/בְנֵ֨י אֲחֵ֧י אֲחַזְיָ֛הוּ מְשָׁרְתִ֥ים לַ/אֲחַזְיָ֖הוּ וַ/יַּהַרְגֵֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/022/008.yaml
  text: And it happened[a], when Jehu was executing judgment on the house of Ahab, that he found the officials of Judah and the sons of Ahaziah’s brothers, serving Ahaziah[b], and he killed them.
translation:
  language: tl
  text: Nangyari ito habang isinasagawa ni Jehu ang paghatol sa sambahayan ni Ahab,[a] natagpuan niya ang mga pinuno ng Juda at ang mga anak na lalaki ng mga kapatid ni Ahazias[b] na naglilingkod kay Ahazias, at pinatay niya sila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “habang hinahatulan ni Jehu ang sambahayan ni Ahab.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “mga anak na lalaki ng mga kapatid ni Ahazias”; samakatuwid, mga pamangkin niyang lalaki.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Nangyari na
  rationale: Pinananatili nito ang pormulang pasalaysay na nag-uugnay sa talata sa nagpapatuloy na salaysay, nang hindi gumagamit ng makalumang pananalita.
- source_word: כְּהִשָּׁפֵט
  choice: habang isinasagawa ... ang paghatol
  rationale: Ipinahahayag ng temporal na כְּ at ng anyong infinitive ang panahong isinasagawa ni Jehu ang isang kilos na may hukom o maparusang diwa; pinananatili ng ‘paghatol’ ang legal na puwersa nang hindi tahasang nagdaragdag ng pagsang-ayon ng Diyos.
- source_word: עִם בֵּית אַחְאָב
  choice: sa sambahayan ni Ahab
  rationale: Sa kontekstong ito, ang עִם ay tumutukoy sa sambahayang pinatutungkulan ng paghatol. Ang ‘sambahayan ni Ahab’ ay nagpapanatili sa pamilyang-dinastikong idyoma ng Hebreo.
- source_word: שָׂרֵי יְהוּדָה
  choice: mga pinuno ng Juda
  rationale: Malawak ang saklaw ng שָׂרִים at maaaring tumukoy sa matataas na pinuno o opisyal. Natural sa Filipino ang ‘mga pinuno’ at hindi nito nililimitahan ang tinutukoy sa mga prinsipeng maharlika.
- source_word: וּבְנֵי אֲחֵי אֲחַזְיָהוּ
  choice: mga anak ng mga kapatid ni Ahazias
  rationale: Pinananatili ang tahasang ugnayang pampamilya ng Hebreo sa halip na palitan agad ng ‘mga pamangkin’; nililinaw sa talababa ang mas maikling katumbas.
- source_word: מְשָׁרְתִים לַאֲחַזְיָהוּ
  choice: na naglilingkod kay Ahazias
  rationale: Ipinakikita ng participle ang nagpapatuloy nilang tungkulin o paglilingkod. Malawak at natural ang ‘naglilingkod’ at hindi ito nagdaragdag ng kultikong kahulugan.
- source_word: וַיַּהַרְגֵם
  choice: at pinatay niya sila
  rationale: Direkta at malinaw nitong isinasalin ang karaniwang pandiwang הרג, nang walang pagpapalabnaw o pagpapalabis.
theological_decisions:
- issue: Ang katangian ng ginawa ni Jehu kaugnay ng wikang panghukuman
  choice: Isinalin ang שׁפט bilang ‘isinasagawa ... ang paghatol,’ na nagpapanatili sa panghukumang diwa ngunit hindi tahasang nagsasabing sinang-ayunan ng Diyos ang bawat pagpatay sa sugnay.
  alternative: ‘hinahatulan’ o ‘pinarurusahan,’ na maaaring maging mas payak o mas mariing maparusahan ang dating.
  rationale: Panghukuman ang paglalarawan ng talata sa kilos ni Jehu, ngunit hindi nito mismo tahasang sinusuri sa teolohikal na paraan ang bawat pagpatay. Kaya pinananatili ang tensiyon nang walang dagdag na interpretasyon.
translation_notes:
  register: Makabagong, malinaw, at marangal na Filipino. Ginamit ang ‘sambahayan’ para sa biblikal na idyomang tumutukoy sa pamilya o dinastiya, at iniwasan ang makaluma o labis na teknikal na pananalita.
