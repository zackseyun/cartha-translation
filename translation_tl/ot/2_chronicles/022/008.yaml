revisions:
- from: Nangyari na habang isinasagawa ni Jehu ang paghatol sa sambahayan ni Ahab,[a] natagpuan niya ang mga pinuno ng Juda at ang mga anak ng mga kapatid ni Ahazias[b] na naglilingkod kay Ahazias, at pinatay niya sila.
  to: Nangyari ito habang isinasagawa ni Jehu ang paghatol sa sambahayan ni Ahab,[a] natagpuan niya ang mga pinuno ng Juda at ang mga anak na lalaki ng mga kapatid ni Ahazias[b] na naglilingkod kay Ahazias, at pinatay niya sila.
  rationale: Inayos ang pambungad upang maging natural na Filipino at idinagdag ang “na lalaki” upang buong maipahayag ang tahasang panlalaking anyo ng Hebreo. Walang binagong kahulugan tungkol sa saklaw ng paghatol, sa ugnayang pampamilya, o sa paglilingkod kay Ahazias.
