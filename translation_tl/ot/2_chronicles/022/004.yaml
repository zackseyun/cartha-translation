language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יַּ֧עַשׂ הָ/רַ֛ע בְּ/עֵינֵ֥י יְהוָ֖ה כְּ/בֵ֣ית אַחְאָ֑ב כִּי הֵ֜מָּה הָֽיוּ ל֣/וֹ יֽוֹעֲצִ֗ים אַחֲרֵ֛י מ֥וֹת אָבִ֖י/ו לְ/מַשְׁחִ֥ית לֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/022/004.yaml
  text: He did what was evil in the sight of Yahweh[a], like the house of Ahab, because they were his counselors after the death of his father, to his destruction.
translation:
  language: tl
  text: Ginawa niya ang masama sa paningin ni Yahweh, gaya ng sambahayan ni Ahab, sapagkat sila ang naging mga tagapayo niya pagkamatay ng kanyang ama, na humantong sa kanyang kapahamakan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “para sa kanyang kapahamakan” o “upang ipahamak siya.” Maaaring tumukoy ang pananalitang Hebreo sa naging bunga ng kanilang payo o sa mapaminsalang layunin nito.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ הָרַע
  choice: Ginawa niya ang masama
  rationale: Likas sa modernong Tagalog at pinananatili ang karaniwang pormulang Hebreo ng negatibong pagsusuri sa ginawa ng isang hari.
- source_word: בְּעֵינֵי יְהוָה
  choice: sa paningin ni Yahweh
  rationale: Pinananatili ang metapora ng Hebreong idyoma para sa pagsusuri ng Diyos at isinasalin nang tuwiran ang pangalang יְהוָה bilang Yahweh.
- source_word: כְּבֵית אַחְאָב
  choice: gaya ng sambahayan ni Ahab
  rationale: Ang בֵּית dito ay tumutukoy sa pamilya o dinastiya ni Ahab, hindi lamang sa isang gusali; ang “sambahayan” ay dignificado at malinaw sa konteksto.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala nito ang dahilan ng naunang pahayag; ang “sapagkat” ay malinaw at angkop sa dignipikadong salaysay.
- source_word: הֵמָּה הָיוּ לוֹ יוֹעֲצִים
  choice: sila ang naging mga tagapayo niya
  rationale: Pinananatili ang pagkakakilanlan ng mga kasapi ng sambahayan ni Ahab bilang kanyang mga tagapayo, at natural itong basahin sa Tagalog.
- source_word: אַחֲרֵי מוֹת אָבִיו
  choice: pagkamatay ng kanyang ama
  rationale: Maikli, natural, at tumpak na katumbas ng Hebreong parirala.
- source_word: לְמַשְׁחִית לוֹ
  choice: na humantong sa kanyang kapahamakan
  rationale: Ipinahahayag ang mapaminsalang bunga nang hindi tiyakang ipinapalagay na tahasang layunin ng mga tagapayo ang sirain siya; ang posibleng pagbasa bilang layunin ay inilalahad sa talababa.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Ginagamit ng tekstong Hebreo ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalang tipan sa halip na palitan ito ng isang titulo.
- issue: Kung ang לְמַשְׁחִית לוֹ ay bunga o layunin
  choice: 'mapaminsalang bunga: “na humantong sa kanyang kapahamakan”'
  alternative: 'layunin: “upang ipahamak siya”'
  rationale: Maaaring ipahiwatig ng pariralang Hebreo ang bunga o layunin. Hindi dapat tahimik na lutasin ang tunay na kalabuan, kaya pinili sa teksto ang likas na pagbasa bilang bunga at itinabi sa talababa ang alternatibong pagbasa bilang layunin.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at dignificado. Ginamit ang “sambahayan” para sa dinastiyang בית at “kapahamakan” para sa mapaminsalang dulo, habang pinananatili sa talababa ang kalabuan sa pagitan ng bunga at layunin.
