  yaml_path: translation/ot/2_chronicles/022/003.yaml
  text: He too walked in the ways of the house of Ahab[a], because his mother was his counselor to act wickedly.
translation:
  language: tl
  text: Siya rin ay namuhay ayon sa mga pamamaraan ng sambahayan ni Ahab, sapagkat ang kanyang ina ang tagapayo niya sa paggawa ng masama.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גַּם הוּא
  choice: Siya rin
  rationale: Pinananatili ang pandagdag at bahagyang mapagdiing diwa ng גַּם kasama ng malayang panghalip.
- source_word: הָלַךְ בְּדַרְכֵי
  choice: namuhay ayon sa mga lakad ng
  rationale: Moral na pamumuhay ang tinutukoy, hindi literal na paglalakad. Ang “mga lakad” ay nagpapanatili sa metapora ngunit nililinaw ng “namuhay ayon sa” ang etikal na diwa.
- source_word: בֵּית אַחְאָב
  choice: sambahayan ni Ahab
  rationale: Saklaw ng בֵּית ang pamilya o dinastikong sambahayan; mas malapit ito sa Hebreo kaysa sa tahasang interpretasyong “dinastiya.”
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinahahayag dito ang dahilan ng kanyang asal sa dignidad ngunit likas na modernong Tagalog.
- source_word: אִמּוֹ
  choice: ang kanyang ina
  rationale: Tuwirang katumbas ng possessive noun.
- source_word: הָיְתָה יוֹעַצְתּוֹ
  choice: ang nagpapayo sa kanya
  rationale: Bagaman nominal ang Hebreong konstruksyon, mas natural sa Tagalog ang pandiwang anyo at naipahihiwatig ng aspektong “nagpapayo” ang nagpapatuloy na papel niya bilang tagapayo.
- source_word: לְהַרְשִׁיעַ
  choice: na gumawa ng masama
  rationale: Malinaw na pinananatili ang moral na hatol at ang layon o bunga ng pagpapayo, nang hindi nagdaragdag ng sikolohikal na paliwanag.
theological_decisions:
- issue: Ang masamang asal ng hari sa ilalim ng impluwensiya ng kanyang ina
  choice: Tahasang sabihin na pinapayuhan siya ng kanyang ina na gumawa ng masama.
  alternative: “Hinihikayat siya ng kanyang ina sa kasamaan” o “ang kanyang ina ang kanyang tagapayo sa paggawa ng masama.”
  rationale: Tahasang hinahatulan ng לְהַרְשִׁיעַ ang asal bilang masama. Hindi ito dapat palambutin, ngunit hindi rin dapat dagdagan ng motibo o lawak ng impluwensiyang hindi sinasabi ng teksto.
translation_notes:
  register: Modernong Filipino Tagalog na dignidad at madaling maunawaan. Ginamit ang “namuhay ayon sa mga lakad” upang mapanatili ang Hebreong metapora habang iniiwasan ang maling pagkaunawa na literal na paglalakad ang tinutukoy. Walang footnote dahil walang mahalagang tekstuwal o semantikong kalabuan na kailangang ilagay sa tala para sa talatang ito.
