  source_fidelity: 'Tumpak na naihahatid ng salin ang lahat ng pangunahing yunit ng Hebreo: ang karagdagang pagkilos ("din"), pagkilos ayon sa payo ng iba, pagsama kay Jehoram upang lumaban kay Hazael sa Ramot-gilead, at pagkakasugat ni Joram sa kamay ng mga Arameo. Napanatili rin ang dalawang anyo ng pangalan, Jehoram at Joram, gaya ng nasa pinagmulan.'
  naturalness: Natural at malinaw ang modernong Tagalog. Ang “sumunod din siya sa payo nila” ay isang idiomatikong paglalahad ng Hebreong metapora; ang “sumama siya kay” at “upang makipagdigma kay” ay angkop sa salaysay. Maayos din ang pasibong “nasugatan ng mga Arameo si Joram.”
