  text: גַּ֣ם בַּ/עֲצָתָ/ם֮ הָלַךְ֒ וַ/יֵּלֶךְ֩ אֶת יְהוֹרָ֨ם בֶּן אַחְאָ֜ב מֶ֣לֶךְ יִשְׂרָאֵ֗ל לַ/מִּלְחָמָ֛ה עַל חֲזָאֵ֥ל מֶֽלֶךְ אֲרָ֖ם בְּ/רָמ֣וֹת גִּלְעָ֑ד וַ/יַּכּ֥וּ הָֽ/רַמִּ֖ים אֶת יוֹרָֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/022/005.yaml
  text: He also walked by their counsel[a], and he went with Jehoram son of Ahab, king of Israel, to war against Hazael king of Aram at Ramoth-gilead[c][b]; and the Arameans wounded Joram.
translation:
  language: tl
  text: Sumunod din siya sa payo nila[a], at sumama siya kay Jehoram na anak ni Ahab, na hari ng Israel, upang makipagdigma kay Hazael na hari ng Aram[b] sa Ramot-gilead. At nasugatan ng mga Arameo si Joram.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “lumakad din siya sa payo nila”; ibig sabihin, kumilos siya ayon sa kanilang payo.
    reason: lexical_alternative
  - marker: b
    text: 'Hebreo: “Aram”; tradisyonal na isinasaling “Siria.” Gayundin, ang “mga Arameo” ay tradisyonal na “mga Siriano.”'
    reason: alternative_reading
  - marker: c
    text: 'Dalawang magkaugnay na anyo ng pangalan ang ginamit sa Hebreo: “Jehoram” sa unang bahagi ng talata at “Joram” sa hulihan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם בַּעֲצָתָם הָלַךְ
  choice: Sumunod din siya sa payo nila
  rationale: Ipinahahayag ng idyomang Hebreo na kumilos siya ayon sa kanilang payo. Mas natural at malinaw sa modernong Tagalog ang “sumunod sa payo” kaysa literal na “lumakad sa payo,” habang napapanatili ang diwang ginabayan ng kanilang payo ang kanyang kilos.
- source_word: וַיֵּלֶךְ אֶת
  choice: sumama siya kay
  rationale: Tuwirang ipinapahayag ng parirala ang pagsama niya kay Jehoram; natural ito sa salaysay na Tagalog.
- source_word: יְהוֹרָם ... יוֹרָם
  choice: Jehoram ... Joram
  rationale: Pinananatili ang magkaugnay ngunit magkaibang anyo ng pangalan na ginamit sa tekstong Hebreo sa simula at dulo ng talata.
- source_word: לַמִּלְחָמָה עַל
  choice: upang makipagdigma kay
  rationale: Ang layunin at salungatang militar ng parirala ay natural na naihahayag sa Tagalog sa “upang makipagdigma kay.”
- source_word: אֲרָם
  choice: Aram
  rationale: Ginagamit ang makasaysayang pangalang nasa Hebreo sa halip na ang tradisyonal ngunit mas huling katawagang “Siria.”
- source_word: בְּרָמוֹת גִּלְעָד
  choice: sa Ramot-gilead
  rationale: Ang “sa” ang natural na panandang Tagalog para sa lugar ng labanan; ang pangalan ng lugar ay tinumbasan ayon sa karaniwang anyong Filipino.
- source_word: וַיַּכּוּ
  choice: nasugatan
  rationale: Bagaman maaaring literal na “sinaktan” o “hinampas,” ipinakikita ng kasunod na konteksto na pinsalang natamo ni Joram ang tinutukoy, kaya “nasugatan” ang pinakamalinaw na katumbas.
- source_word: הָרַמִּים
  choice: mga Arameo
  rationale: Ito ang likas na katawagang Filipino para sa mga taong mula sa Aram at kaayon ng pagpapanatili sa pangalang “Aram.”
theological_decisions:
- issue: 'Pangalan ng bansa at ng mga mamamayan: אֲרָם / הָרַמִּים'
  choice: Aram / mga Arameo
  alternative: Siria / mga Siriano
  rationale: Pinananatili nito ang makasaysayang katawagang Hebreo at iniiwasang ipalit ang mas huling pangalang heopolitikal. Hindi nito binabago ang anumang doktrinal na kahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa pampublikong pagbasa. Ginamit ang “sumunod sa payo” bilang natural na katumbas ng idyomang Hebreo, habang inilagay sa talababa ang literal na metapora. Pinanatili ang Aram/mga Arameo at ang pagkakaiba ng Jehoram/Joram.
