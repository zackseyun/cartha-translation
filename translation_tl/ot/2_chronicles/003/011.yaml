base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/003/011.yaml
  text: 'The wings of the cherubim were twenty cubits long: one wing was five cubits[a], reaching to the wall of the house, and the other wing was five cubits[b], reaching to the wing of the other cherub.'
translation:
  language: tl
  text: Ang haba ng mga pakpak ng mga kerubin ay dalawampung siko. Ang isang pakpak ay limang siko[a] at umaabot sa dingding ng templo[b], at ang kabilang pakpak ay limang siko at umaabot sa pakpak ng kabilang kerubin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “dumidikit sa dingding ng templo ... dumidikit sa pakpak ng kabilang kerubin.” Maaaring idiin ng mga pandiwaring Hebreo ang aktuwal na pagdikit, hindi lamang ang pag-abot.
    reason: lexical_alternative
  - marker: b
    text: Literal na “bahay”; ang tinutukoy dito ay ang gusali ng templo.
    reason: cultural_note
lexical_decisions:
- source_word: וְכַנְפֵי הַכְּרוּבִים
  choice: Ang mga pakpak ng mga kerubin
  rationale: Pinanatili ang maramihang anyo at ang nakagawiang transliterasyong “kerubin” para sa mga makalangit na nilalang; hindi kailangang isalin ang panimulang waw bilang “at” sa natural na Filipino.
- source_word: אָרְכָּם אַמּוֹת עֶשְׂרִים
  choice: ay dalawampung siko ang kabuuang haba
  rationale: Ipinahahayag ng hulaping panghalip ang pinagsamang sukat ng mga pakpak sa kontekstong ang bawat isa sa apat na pakpak ay limang siko; nililinaw ng “kabuuang” ang natural na diwa nang hindi binabago ang sinaunang yunit.
- source_word: כְּנַף הָאֶחָד לְאַמּוֹת חָמֵשׁ
  choice: Ang isang pakpak ay limang siko
  rationale: Natural na Filipino para sa eliptikong pariralang Hebreo na nagsasaad ng sukat.
- source_word: מַגַּעַת / מַגִּיעַ
  choice: umaabot
  rationale: Ang נגע ay maaaring magpahiwatig ng pag-abot hanggang sa isang bagay o aktuwal na pagdikit. Pinananatili ng “umaabot” ang natural na paglalarawang pang-arkitektura, habang itinatala sa talababa ang “dumidikit.”
- source_word: לְקִיר הַבַּיִת
  choice: sa dingding ng templo
  rationale: Bagaman literal na “bahay” ang בַּיִת, malinaw sa konteksto ng Cronica na gusali ng templo ang tinutukoy; mas malinaw ito sa ordinaryong mambabasang Filipino.
- source_word: וְהַכָּנָף הָאַחֶרֶת
  choice: at ang isa pang pakpak
  rationale: Malapit sa kahulugan ng אַחֶרֶת na “iba/isa pa,” nang hindi ito ginagawang interpretibong “ikalawang pakpak.”
- source_word: לִכְנַף הַכְּרוּב הָאַחֵר
  choice: sa pakpak ng isa pang kerubin
  rationale: Pinanatili ang isahan na “kerubin” at ang diwa ng הָאַחֵר bilang “isa pa.”
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “siko” bilang tradisyonal na katawagan sa cubit at “kerubin” bilang nakagawiang biblikal na transliterasyon. Inilipat ang marker [b] sa mismong “templo,” na siyang paliwanag ng talababa.
