  to: Ang haba ng mga pakpak ng mga kerubin ay dalawampung siko. Ang isang pakpak ay limang siko[a] at umaabot sa dingding ng templo[b], at ang kabilang pakpak ay limang siko at umaabot sa pakpak ng kabilang kerubin.
