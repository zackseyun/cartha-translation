base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/003/008.yaml
  text: He made the Most Holy Place[a], its length corresponding to the width of the house, twenty cubits, and its width twenty cubits; and he overlaid it with fine gold[b], six hundred talents.
translation:
  language: tl
  text: Ginawa niya ang Pinakabanal na Lugar[a]. Ang haba nito ay dalawampung siko, kasukat ng lapad ng templo, at ang lapad nito ay dalawampung siko. Binalutan niya ito ng mainam na ginto na tumitimbang ng animnaraang talento.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Banal ng mga Banal.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּית קֹדֶשׁ הַקֳּדָשִׁים
  choice: Kabanal-banalang Lugar
  rationale: Ipinahahayag nito nang natural sa modernong Tagalog ang Hebreong superlatibong idyoma para sa pinakaloob na santuwaryo.
- source_word: אָרְכּוֹ עַל פְּנֵי רֹחַב הַבַּיִת
  choice: Ang haba nito, na kaayon ng lapad ng templo
  rationale: 'Pinananatili ang ugnayang pang-arkitektura: ang haba ng silid ay nakaayon o katumbas ng lapad ng gusali. Ginamit ang “templo” para malinaw ang tinutukoy na בַּיִת sa konteksto.'
- source_word: אַמּוֹת עֶשְׂרִים
  choice: dalawampung siko
  rationale: Pinanatili ang sinaunang yunit na siko sa halip na tantiyahang gawing modernong sukat.
- source_word: וְרָחְבּוֹ אַמּוֹת עֶשְׂרִים
  choice: at ang lapad nito ay dalawampung siko
  rationale: Tuwiran at natural na paglalahad ng ikalawang dimensiyon.
- source_word: וַיְחַפֵּהוּ
  choice: Binalutan niya ito
  rationale: Sa konteksto ng pagtatayo, tumutukoy ang pandiwa sa paglalapat ng ginto bilang panakip o overlay; natural sa Tagalog ang “binalutan.”
- source_word: זָהָב טוֹב
  choice: mainam na ginto
  rationale: Ipinahahayag ang mataas na kalidad ng ginto nang hindi ipinapalagay ang eksaktong antas ng kadalisayan na hindi tahasang sinasabi ng Hebreo.
- source_word: לְכִכָּרִים שֵׁשׁ מֵאוֹת
  choice: ng animnaraang talento
  rationale: Ipinakikita ang dami o bigat ng gintong ginamit, habang pinananatili ang yunit na talento.
theological_decisions:
- issue: Pangalan ng pinakaloob na santuwaryo
  choice: Kabanal-banalang Lugar
  alternative: Banal ng mga Banal
  rationale: Ang pinili ay malinaw at dignidad sa kasalukuyang Tagalog, samantalang nasa talababa ang mas literal na anyo upang mapanatili ang Hebreong idyoma.
translation_notes:
  register: Modernong Filipino Tagalog na dignidad ngunit madaling maunawaan. Gumamit ng maiikling pangungusap para luminaw ang masinsing paglalarawang pang-arkitektura; pinanatili ang mga sinaunang yunit na siko at talento.
