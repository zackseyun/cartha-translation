  source_fidelity: 'Tumpak ang pangunahing nilalaman: ang pinakaloob na santuwaryo ay may habang at lapad na tig-dalawampung siko at binalutan ng de-kalidad na ginto. Gayunman, mas malinaw na ilahad ang animnaraang talento bilang bigat/dami ng gintong ginamit, sa halip na ipabasa ito na tila tuwirang kasangkapan ng pandiwang “binalutan.”'
