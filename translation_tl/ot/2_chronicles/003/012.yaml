base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/003/012.yaml
  text: The wing of the one cherub was five cubits[a], reaching to the wall of the house; and the other wing was five cubits[b], touching the wing of the other cherub.
translation:
  language: tl
  text: Ang isang pakpak ng kerubin ay limang siko[a] ang haba at umaabot sa dingding ng templo; at ang isa pang pakpak ay limang siko ang haba at nakadikit sa pakpak ng isa pang kerubin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang isang siko ay humigit-kumulang 45 sentimetro.
    reason: measurement_note
lexical_decisions:
- source_word: כְנַף
  choice: pakpak
  rationale: Sa paglalarawan sa mga kerubin sa templo, malinaw na literal na pakpak ang tinutukoy.
- source_word: כְּרוּב
  choice: kerubin
  rationale: Karaniwang katawagang Filipino para sa cherub; bagaman anyong singular ang Hebreo, natural sa Filipino ang 'kerubin' para sa isang nilalang.
- source_word: אַמּוֹת חָמֵשׁ
  choice: limang siko
  rationale: Pinananatili ang sinaunang yunit ng sukat; ang 'siko' ang nakaugaliang katumbas ng cubit sa saling Filipino.
- source_word: מַגִּיעַ
  choice: umaabot
  rationale: Natural na ipinahahayag ang paglawak ng pakpak hanggang sa dingding.
- source_word: קִיר הַבָּיִת
  choice: dingding ng templo
  rationale: Literal na 'dingding ng bahay,' ngunit sa konteksto ang bahay ay ang gusali ng templo; malinaw at natural ang tahasang pagtukoy rito.
- source_word: הַכָּנָף הָאַחֶרֶת
  choice: ang isa pang pakpak
  rationale: Natural na Filipino para sa pakpak na kapareha ng unang binanggit.
- source_word: דְּבֵקָה
  choice: nakadikit
  rationale: Ipinahahayag ang malapit na pagdaiti ng mga pakpak nang hindi kinakailangang magpahiwatig na ikinabit ang mga ito.
- source_word: הַכְּרוּב הָאַחֵר
  choice: isa pang kerubin
  rationale: Pinananatili ang ugnayan ng dalawang magkatambal na kerubin.
