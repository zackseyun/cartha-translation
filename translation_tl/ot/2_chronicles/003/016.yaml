base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/003/016.yaml
  text: He made chains in the inner sanctuary and put them on the tops of the pillars[b][a]; he also made one hundred pomegranates and put them on the chains.
translation:
  language: tl
  text: Gumawa siya ng mga tanikalang palamuti[b] sa panloob na santuwaryo[a] at inilagay ang mga iyon sa mga tuktok ng mga haligi. Gumawa rin siya ng isang daang palamuting hugis-granada at ikinabit ang mga iyon sa mga tanikala.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa panloob na silid”; ayon sa tradisyon, “sa Kabanal-banalang Lugar.” Tumutukoy ang salitang Hebreo sa panloob na santuwaryo ng templo, bagaman inuunawa ng ilan na mas malawak ang kaugnayan ng parirala rito sa gawaing pandekorasyon.
    reason: alternative_reading
  - marker: b
    text: Maaari ring isalin ang salitang Hebreo bilang “palamuting magkakawing” o “mga girnalda.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׁרְשְׁרוֹת
  choice: mga tanikalang palamuti
  rationale: Tumutukoy ang salita sa palamuting kawangis ng mga magkakawing na tanikala. Nililinaw ng “palamuti” ang gamit nito sa arkitektura habang pinananatili ng “tanikala” ang konkretong larawan.
- source_word: בַּדְּבִיר
  choice: sa panloob na santuwaryo
  rationale: Karaniwang tumutukoy ang דְּבִיר sa pinakaloob na silid ng templo. Ang saling ito ay malinaw at hindi agad nagpapasok ng tradisyonal na katawagang liturhikal.
- source_word: רֹאשׁ הָעַמֻּדִים
  choice: mga tuktok ng mga haligi
  rationale: Bagaman literal na “mga ulo,” ang “mga tuktok” ang likas na salin sa Filipino kapag bahagi ng gusali ang tinutukoy.
- source_word: רִמּוֹנִים
  choice: mga palamuting hugis-granada
  rationale: Sa kontekstong ito, hindi tunay na mga bunga kundi mga palamuting anyong granada ang tinutukoy; ginagawa itong tahasang malinaw sa salin.
- source_word: מֵאָה
  choice: isang daan
  rationale: Tuwirang salin ng bilang at natural sa modernong Filipino.
- source_word: וַיִּתֵּן בַּשַּׁרְשְׁרוֹת
  choice: ikinabit ang mga iyon sa mga tanikala
  rationale: Maaaring mangahulugan ang parirala ng paglalagay o pagsasama sa palamuting tanikala. Ang “ikinabit” ay angkop sa pandekorasyong konteksto ngunit hindi isinasara ang alternatibong pagkaunawa, na inilalahad sa talababa.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “tanikalang palamuti” upang iwasang mapagkamalang karaniwang tanikalang gamit sa paggapos, at “palamuting hugis-granada” upang ipakita ang arkitektural na konteksto. Ang lahat ng marker ng talababa ay nasa pangunahing teksto.
