translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang 'noong' sa pagtukoy sa buwan at 'sa' sa araw at taon upang maging natural ang mahabang pormula ng petsa. Pinanatili sa talababa ang tunay na elipsis ng tekstong Hebreo.
