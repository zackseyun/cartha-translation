base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/003/002.yaml
  text: He began to build in the second month[a], on the second day, in the fourth year of his reign.
translation:
  language: tl
  text: Nagsimula siyang magtayo noong ikalawang buwan, sa ikalawang araw,[a] sa ikaapat na taon ng kanyang paghahari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “noong ikalawang buwan, sa ikalawa”; karaniwang inuunawa ang huling parirala na “sa ikalawang araw.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּחֶל
  choice: Nagsimula siya
  rationale: Ang pandiwang hifil na may waw-consecutive ay nagsasaad ng pagsisimula ng gawain. Hindi na isinalin nang hiwalay ang pang-ugnay upang maging natural ang salaysay sa Tagalog.
- source_word: לִבְנוֹת
  choice: magtayo
  rationale: Karaniwang pandiwa ito para sa pagtatayo ng isang gusali at tuwirang katumbas ng infinitibong Hebreo.
- source_word: בַּחֹדֶשׁ הַשֵּׁנִי
  choice: noong ikalawang buwan
  rationale: Malinaw at likas na paraan sa Tagalog ng pagtukoy sa buwan kung kailan nagsimula ang gawain.
- source_word: בַּשֵּׁנִי
  choice: sa ikalawang araw
  rationale: Eliptiko ang Hebreo, na literal na 'sa ikalawa.' Batay sa karaniwang pagkaunawa sa pormula ng petsa, ipinahahayag ang ipinahiwatig na 'araw,' habang itinatala sa talababa ang literal na anyo.
- source_word: בִּשְׁנַת אַרְבַּע
  choice: sa ikaapat na taon
  rationale: Likas at tumpak na katumbas ng karaniwang pormula sa pagbilang ng taon ng paghahari.
- source_word: לְמַלְכוּתוֹ
  choice: ng kanyang paghahari
  rationale: Tinutukoy nito ang pamumuno ng hari bilang batayan ng petsa; 'paghahari' ang natural na terminong Tagalog.
