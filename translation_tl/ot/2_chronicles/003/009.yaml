translation:
  language: tl
  text: Ang bigat ng mga pako ay limampung siklo ng ginto, at binalutan niya ng ginto ang mga silid sa itaas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaaring mas malawak na tumukoy ang salitang Hebreo sa matataas na bahagi o mga silid ng templo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִשְׁקָל
  choice: Ang bigat
  rationale: Ang מִשְׁקָל ay tumutukoy sa bigat o timbang. Hindi kailangang isalin nang hiwalay ang pang-ugnay na ו sa simula upang maging natural ang Filipino.
- source_word: לְמִסְמְרוֹת
  choice: ng mga pako
  rationale: Sa pariralang may מִשְׁקָל, likas sa Filipino ang “bigat ng mga pako.” Ang “pako” ang pinakanaaangkop sa konteksto ng pagtatayo ng templo, bagaman maaari ring mangahulugang tulos o pegs ang salita.
- source_word: לִשְׁקָלִים חֲמִשִּׁים זָהָב
  choice: ay limampung siklo ng ginto
  rationale: Ipinahahayag ng parirala ang sukat ng bigat. Pinananatili ang sinaunang yunit na “siklo,” at nililinaw na ginto ang materyal na tinimbang.
- source_word: וְהָעֲלִיּוֹת
  choice: ang mga silid sa itaas
  rationale: Karaniwang tumutukoy ang עֲלִיּוֹת sa mga silid o bahagi sa itaas. Ang “mga silid sa itaas” ay malinaw ngunit hindi labis na tiyak; inilalahad sa talababa ang mas malawak na posibleng kahulugan.
- source_word: חִפָּה זָהָב
  choice: binalutan niya ng ginto
  rationale: Sa kontekstong pang-arkitektura, ang חפה ay pagtakip o pagbalot ng isang ibabaw sa isang materyal. Natural sa modernong Filipino ang “binalutan ... ng ginto.”
theological_decisions: []
