  text: The wings of these cherubim spread twenty cubits[a], and they stood on their feet, with their faces toward the house.
translation:
  language: tl
  text: Ang mga pakpak ng mga kerubing ito ay nakabuka nang dalawampung siko. Nakatayo sila sa kanilang mga paa, at nakaharap sa bahay ang kanilang mga mukha.[a]
  philosophy: optimal-equivalence
  footnotes:
