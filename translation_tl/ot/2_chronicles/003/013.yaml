lexical_decisions:
- source_word: כַּנְפֵי
  choice: Ang mga pakpak ng
  rationale: Isinasalin ang construct plural bilang likas na pariralang Filipino na nagpapakita na ang mga pakpak ay pag-aari ng mga kerubin.
- source_word: הַכְּרוּבִים הָאֵלֶּה
  choice: mga kerubing ito
  rationale: Pinananatili ang demonstratibong “ito” at ginagamit ang kinikilalang terminong biblikal na “kerubin,” na nilalagyan ng “mga” para sa maramihan.
- source_word: פֹּרְשִׂים
  choice: nakabuka
  rationale: Ang participle ay naglalarawan sa kalagayan o posisyon ng mga pakpak, hindi kinakailangang sa kilos ng pagbubuka sa sandaling iyon.
- source_word: אַמּוֹת עֶשְׂרִים
  choice: nang dalawampung siko
  rationale: Pinananatili ang sinaunang sukat na “siko” at hindi nagdaragdag ng salitang gaya ng “lapad,” na hindi tahasang nasa Hebreo.
- source_word: וְהֵם עֹמְדִים
  choice: Nakatayo sila
  rationale: Malinaw na inililipat ng panghalip ang paksa mula sa mga pakpak tungo sa mismong mga kerubin; natural sa Filipino ang hiwalay na pangungusap.
- source_word: עַל רַגְלֵיהֶם
  choice: sa kanilang mga paa
  rationale: Tuwirang inilalarawan ang tuwid na tindig ng mga kerubin sa natural na Filipino.
- source_word: וּפְנֵיהֶם לַבָּיִת
  choice: at nakaharap sila sa bahay
  rationale: Ipinahahayag nang natural ang direksiyon ng kanilang mga mukha habang pinananatili ang literal na “bahay” bilang tawag sa gusali ng templo.
theological_decisions:
- issue: Pagpapakahulugan sa בַּיִת sa konteksto ng pagtatayo ng templo
  choice: bahay
  alternative: templo
  rationale: Karaniwang salita para sa “bahay” ang ginamit sa Hebreo, bagaman tumutukoy ito rito sa gusali ng templo. Pinananatili sa teksto ang anyo ng pinagmulang wika at nililinaw ang tinutukoy sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kerubin” bilang pamilyar na terminong biblikal, “siko” para sa cubit, at maiikling pangungusap upang luminaw ang paglipat ng paksa mula sa mga pakpak tungo sa mga kerubin.
