  text: In the Most Holy Place he made two cherubim[a], the work of an image-maker[b], and overlaid them with gold.
translation:
  language: tl
  text: Sa Kabanal-banalang Lugar, gumawa siya ng dalawang kerubin—mga eskultura[a]—at binalutan ng ginto ang mga ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga inukit na likha” o “masining na gawa.” Bihira at hindi tiyak ang kahulugan ng salitang Hebreo.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּבֵית קֹדֶשׁ הַקֳּדָשִׁים
  choice: Sa Kabanal-banalang Lugar
  rationale: Ipinahahayag nito sa natural na modernong Tagalog ang Hebreong idyoma para sa pinakaloob at pinakabanal na bahagi ng templo, habang pinananatili ang superlatibong diwa.
- source_word: כְּרוּבִים שְׁנַיִם
  choice: dalawang kerubin
  rationale: Ang “kerubin” ang nakaugaliang terminong Filipino para sa Hebreong כְּרוּבִים at angkop sa konteksto ng mga banal na kasangkapan at arkitektura.
- source_word: מַעֲשֵׂה צַעֲצֻעִים
  choice: gawang nililok[a]
  rationale: Inilalarawan ang mga kerubin bilang produktong nililok o eskultura, hindi bilang mga tagagawa. Dahil napakadalang at hindi tiyak ang צַעֲצֻעִים, inilalagay sa talababa ang ibang posibleng pakahulugan.
- source_word: וַיְצַפּוּ אֹתָם זָהָב
  choice: at binalutan ng ginto ang mga ito
  rationale: Ang צפה ay tumutukoy sa pagpapatong o pagbabalot ng metal. Ang konstruksiyong walang tahasang tagaganap sa Tagalog ay natural at hindi sapilitang itinutumbas sa naunang isahang tagaganap ang maramihang pandiwa sa Hebreo.
