base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/003/006.yaml
  text: He overlaid the house with precious stones for beauty[b][a], and the gold was gold from Parvaim.
translation:
  language: tl
  text: Binalutan niya ang bahay[a] ng mahahalagang bato upang pagandahin ito, at ang gintong ginamit ay ginto mula sa Parvaim.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “templo.” Literal na “bahay” ang Hebreo, isang karaniwang tawag sa templo sa Mga Cronica.
    reason: lexical_alternative
  - marker: b
    text: Hindi tiyak kung saang lugar tumutukoy ang Parvaim. Maaari ring isalin ang parirala bilang “ginto ng Parvaim” o “gintong Parvaim.”
    reason: cultural_note
lexical_decisions:
- source_word: וַיְצַף
  choice: Binalutan niya
  rationale: Ang pandiwang צפה sa konteksto ng pagtatayo ay tumutukoy sa paglalagay ng isang pantakip o pandekorasyong suson sa isang gusali.
- source_word: הַבַּיִת
  choice: ang bahay
  rationale: Literal na “ang bahay” ang Hebreo. Karaniwang tawag ito sa templo sa Mga Cronica, kaya pinanatili sa teksto ang anyo ng pinagmulan at nilinaw sa talababa.
- source_word: אֶבֶן יְקָרָה
  choice: mahahalagang bato
  rationale: Bagaman pang-isahan ang anyo sa Hebreo, kolektibo ang gamit nito rito; natural sa Filipino ang pangmaramihang “mahahalagang bato.”
- source_word: לְתִפְאָרֶת
  choice: upang pagandahin ito
  rationale: Ipinahahayag ng parirala ang layunin ng paggamit sa mga bato bilang palamuti. Natural at malinaw ito sa modernong Filipino nang hindi pinalalabis ang diwang teolohikal ng “kaluwalhatian.”
- source_word: וְהַזָּהָב
  choice: at ang gintong ginamit
  rationale: Nililinaw ng sugnay ang uri o pinagmulan ng gintong ginamit; ang pagdaragdag ng “ginamit” ay likas sa Filipino at ipinahihiwatig ng konteksto.
- source_word: זְהַב פַּרְוָיִם
  choice: ginto mula sa Parvaim
  rationale: Ang pariralang konstrukt ay malamang na nagsasaad ng pinagmulan o kaugnayan. Pinananatili ang Parvaim bilang pangalang-pook na hindi tiyak ang pagkakakilanlan.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Pinanatili ang literal na “bahay” dahil makahulugan ito sa bokabularyo ng Mga Cronica, habang ang talababa ay nagbibigay ng mas malinaw na alternatibong “templo.”
