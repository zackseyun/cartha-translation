  text: He overlaid the house with gold—the beams[a], the thresholds, its walls[d][c][b], and its doors—and he engraved cherubim on the walls.
translation:
  language: tl
  text: Binalutan niya ng ginto ang templo—ang mga biga[a], mga pasimano[b], mga dingding nito, at mga pinto nito—at umukit siya ng mga kerubin sa mga dingding.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga tahilan.” Tumutukoy ang salitang Hebreo sa mga kahoy na bahagi ng estruktura.
