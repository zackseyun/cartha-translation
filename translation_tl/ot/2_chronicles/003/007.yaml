    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחַף
  choice: Binalutan niya
  rationale: Ipinahihiwatig ng pandiwa ang pagtatakip sa isang kayarian sa pamamagitan ng isang materyal; natural sa Filipino ang “binalutan” kasunod ng “ng ginto.”
- source_word: הַבַּיִת
  choice: ang templo
  rationale: Literal itong “ang bahay,” ngunit sa konteksto ay malinaw na gusali ng templo ang tinutukoy; iniiwasan ng “templo” ang posibleng maling pagkaunawa sa modernong Filipino.
- source_word: הַקֹּרוֹת
  choice: ang mga biga
  rationale: Tumutukoy ang salita sa mga kahoy na estruktural; ang “biga” ay eksakto at karaniwang terminong panggusali nang hindi nililimitahan sa tahilan ng bubong.
- source_word: הַסִּפִּים
  choice: mga bungad
  rationale: Maaaring tumukoy ang terminong Hebreo sa threshold, sill, o bahagi ng balangkas ng pintuan. Pinananatili ng “bungad” ang pangkalahatang diwa ng lugar ng pasukan nang hindi nagpapasiya kung pahalang o patayong bahagi iyon.
- source_word: קִירוֹתָיו
  choice: mga dingding nito
  rationale: Tuwirang salin ng pangmaramihang “mga dingding” na may hulaping tumutukoy pabalik sa templo.
- source_word: דַלְתוֹתָיו
  choice: mga pinto nito
  rationale: Malinaw at natural na salin ng mga pinto o panel ng pinto.
- source_word: זָהָב
  choice: ng ginto
  rationale: Ipinakikita ng panandang “ng” ang materyal na ipinambalot sa templo at sa mga nakalistang bahagi nito.
- source_word: וּפִתַּח
  choice: at umukit siya
  rationale: Ang pandiwa ay tumutukoy sa pag-ukit o pag-engrave ng palamuti. Ang “umukit” ay natural at sapat na malawak para sa gawaing pandekorasyon sa mga dingding.
- source_word: כְּרוּבִים
  choice: mga kerubin
  rationale: Pinananatili ang natatanging terminong biblikal para sa makalangit na mga nilalang na kaugnay ng templo, sa halip na ang popular na larawang ipinahihiwatig ng “kerub.”
- source_word: עַל הַקִּירוֹת
  choice: sa mga dingding
  rationale: Natural na ipinahihiwatig ng pariralang Filipino ang lokasyon o ibabaw na pinag-ukitan.
