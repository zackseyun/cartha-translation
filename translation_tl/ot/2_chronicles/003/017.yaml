id: 2CH.3.17
reference: 2 Chronicles 3:17
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יָּ֤קֶם אֶת הָֽ/עַמּוּדִים֙ עַל פְּנֵ֣י הַ/הֵיכָ֔ל אֶחָ֥ד מִ/יָּמִ֖ין וְ/אֶחָ֣ד מֵֽ/הַ/שְּׂמֹ֑אול וַ/יִּקְרָ֤א שֵׁם ה/ימיני יָכִ֔ין וְ/שֵׁ֥ם הַ/שְּׂמָאלִ֖י בֹּֽעַז־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/003/017.yaml
  text: He set up the pillars in front of the nave[a], one on the right and one on the left; and he called the name of the one on the right Jachin, and the name of the one on the left Boaz.
translation:
  language: tl
  text: Itinayo niya ang mga haligi sa harap ng bulwagan ng templo[a], ang isa sa kanan at ang isa sa kaliwa. Pinangalanan niyang Jakin ang nasa kanan at Boaz ang nasa kaliwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pangunahing bulwagan ng templo.” Ang salitang Hebreo na heikhal ay tumutukoy rito sa pangunahing bulwagan ng gusali ng templo, hindi kinakailangang sa buong kompleks ng templo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֶם
  choice: Itinayo niya
  rationale: Ang Hiphil ng קום ay nangangahulugang pinatayo o inilagay nang nakatayo ang mga haligi. Likas at malinaw sa Filipino ang “itinayo” sa konteksto ng pagtatayo.
- source_word: הָעַמּוּדִים
  choice: ang mga haligi
  rationale: Ang עַמּוּדִים ay mga haligi o kolum; “mga haligi” ang mas karaniwan at angkop sa marangal na wikang pang-arkitektura ng templo.
- source_word: עַל־פְּנֵי הַהֵיכָל
  choice: sa harap ng bulwagan ng templo
  rationale: Ipinahihiwatig ng עַל־פְּנֵי ang lokasyong nasa harap, at ang הֵיכָל dito ay ang pangunahing bulwagan ng gusali ng templo, hindi kinakailangang ang buong kompleks.
- source_word: אֶחָד מִיָּמִין וְאֶחָד מֵהַשְּׂמֹאול
  choice: ang isa sa kanan at ang isa sa kaliwa
  rationale: Tuwirang pinananatili nito ang ordinaryong pananalita tungkol sa kanan at kaliwa nang hindi ginagawang tahasang timog at hilaga ang mga direksiyong hindi binanggit sa Hebreo.
- source_word: וַיִּקְרָא שֵׁם
  choice: Pinangalanan niyang
  rationale: Bagaman literal na “tinawag ang pangalan,” ang “pinangalanan” ang natural na katumbas sa modernong Filipino at malinaw na naghahayag ng pagbibigay ng pangalan.
- source_word: הַיְמִינִי
  choice: ang nasa kanan
  rationale: Natural at malinaw itong katumbas ng pang-uring tumutukoy sa nasa kanang panig.
- source_word: יָכִין
  choice: Jakin
  rationale: Isinalin sa anyong transliterado mula sa Hebreong Yakhin/Jakhin; ang “Jakin” ay madaling basahin sa Filipino at umaayon sa tunog na karaniwang ibinibigay sa letrang J sa mga pangalang biblikal sa Filipino.
- source_word: הַשְּׂמָאלִי
  choice: ang nasa kaliwa
  rationale: Natural at kapantay ng “ang nasa kanan,” habang tapat sa pang-uring Hebreo para sa kaliwang panig.
- source_word: בֹּעַז
  choice: Boaz
  rationale: Pinanatili ang kinikilalang transliterasyon ng pangalang Hebreo.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at likas basahin. Ginamit ang “bulwagan ng templo” sa halip na teknikal na “nabe,” at pinanatili ang kanan/kaliwa nang hindi ipinapalit ang ipinapalagay na mga direksiyong heograpiko.
