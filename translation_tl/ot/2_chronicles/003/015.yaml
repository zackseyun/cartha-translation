base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/003/015.yaml
  text: In front of the house he made two pillars[a], thirty-five cubits high[b], and the capital that was on the top of each was five cubits.
translation:
  language: tl
  text: Sa harap ng templo ay gumawa siya ng dalawang haligi na tatlumpu't limang siko ang haba[a]. Ang kapitel na nasa tuktok ng bawat isa[b] ay limang siko.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “tatlumpu't limang siko ang haba.” Sa 1 Hari 7:15, labingwalong siko ang taas ng bawat haligi. Dahil dito, inuunawa ng ilan na pinagsamang sukat ng dalawang haligi ang ibinibigay rito, samantalang nakikita naman ng iba na may suliranin sa tekstong naipasa.
    reason: cross_reference
  - marker: b
    text: Sa Hebreo, “nasa tuktok nito.” Malamang na ang isahang panghalip ay ginagamit nang pamahagi, kaya tumutukoy ito sa kapitel sa tuktok ng bawat haligi.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִפְנֵי הַבַּיִת
  choice: Sa harap ng templo
  rationale: Ang לִפְנֵי ay tumutukoy sa puwesto sa harap, at sa konteksto ng pagtatayo ng gusaling banal, likas at malinaw sa modernong Tagalog ang “templo” para sa הַבַּיִת.
- source_word: עַמּוּדִים שְׁנַיִם
  choice: dalawang haligi
  rationale: Karaniwang salitang pang-arkitektura ang “haligi” at tuwirang katumbas ng עַמּוּדִים sa kontekstong ito.
- source_word: אַמּוֹת שְׁלֹשִׁים וְחָמֵשׁ אֹרֶךְ
  choice: tatlumpu't limang siko ang haba
  rationale: Pinananatili ng “haba” ang tahasang אֹרֶךְ ng tekstong Hebreo, sa halip na ipakahulugang “taas”; pinananatili rin ang sinaunang yunit na siko.
- source_word: הַצֶּפֶת
  choice: ang kapitel
  rationale: Ang “kapitel” ang tiyak na terminong pang-arkitektura para sa bahaging nasa pinakatuktok ng haligi.
- source_word: אֲשֶׁר עַל רֹאשׁוֹ
  choice: na nasa tuktok ng bawat isa
  rationale: Likas sa Tagalog ang “tuktok” para sa רֹאשׁ kapag bagay ang tinutukoy. Ginagawang malinaw ng “bawat isa” ang malamang na pamamahaging diwa ng isahang hulaping Hebreo, habang itinatala sa talababa ang literal na anyo.
- source_word: אַמּוֹת חָמֵשׁ
  choice: limang siko ang taas
  rationale: Tumutukoy ang sukat sa kapitel na nasa ibabaw ng haligi; idinagdag ang “taas” upang maging natural at malinaw sa Tagalog nang hindi binabago ang bilang o yunit.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “templo” para sa kontekstuwal na linaw, “haligi” bilang karaniwang termino, at “kapitel” bilang tumpak na katawagang pang-arkitektura. Pinanatili sa pangunahing teksto ang literal na “haba” at inilagay sa talababa ang paghahambing sa 1 Hari 7:15 upang hindi tahimik na lutasin ang suliraning tekstuwal.
