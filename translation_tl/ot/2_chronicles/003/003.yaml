base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/003/003.yaml
  text: 'These are the foundations Solomon laid for building the house of God: the length in cubits[a], according to the former measure, was sixty cubits[c][b], and the width twenty cubits.'
translation:
  language: tl
  text: 'Ito ang mga batayang itinakda ni Solomon[a] para sa pagtatayo ng bahay ng Diyos: ang haba, ayon sa dating panukat[b], ay animnapung siko[c], at ang lapad ay dalawampung siko.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “Ito ang saligang itinakda ni Solomon para sa pagtatayo ng bahay ng Diyos.” Medyo mahirap ang Hebreo para sa “mga batayang itinakda,” kaya isinasalin ito ng ilan bilang plano o pundasyon ng templo.
    reason: lexical_alternative
  - marker: b
    text: Ang “dating panukat” ay maaaring tumukoy sa isang mas lumang pamantayan ng siko.
    reason: cultural_note
  - marker: c
    text: 'Mas literal: “ang haba sa mga siko, ayon sa dating panukat, ay animnapung siko.” Inuulit sa Hebreo ang salitang “siko.”'
    reason: previous_rendering
lexical_decisions:
- source_word: הוּסַד
  choice: mga saligang inilatag
  rationale: Mahirap ang anyong Hebreo mula sa יסד sa kontekstong ito. Ipinahihiwatig nito ang paglalatag ng pundasyon o ang saligang mga detalye ng pagtatayo; pinananatili ng salin ang larawang ito nang hindi ito nililimitahan sa ‘plano’ lamang.
- source_word: לִבְנוֹת
  choice: para sa pagtatayo
  rationale: Ang infinitive na may ל ay nagpapahayag ng layunin; natural itong naipapahayag sa Filipino sa ‘para sa pagtatayo.’
- source_word: בֵּית הָאֱלֹהִים
  choice: bahay ng Diyos
  rationale: Malapit ito sa idyomang Hebreo at pinananatili ang larawan ng templo bilang bahay ng Diyos.
- source_word: הָאֹרֶךְ
  choice: ang haba
  rationale: Karaniwang terminong pangsukat na angkop sa konteksto ng gusali.
- source_word: אַמּוֹת
  choice: mga siko / siko
  rationale: Pinananatili ang sinaunang yunit na ‘siko’ sa halip na tantiyahin o gawing modernong sukat.
- source_word: בַּמִּדָּה הָרִאשׁוֹנָה
  choice: ayon sa dating panukat
  rationale: Malapit ito sa Hebreo at hindi tiyak na ipinapakahulugan kung anong makasaysayang pamantayan ang tinutukoy.
- source_word: שִׁשִּׁים
  choice: animnapu
  rationale: Tuwirang salin ng bilang para sa haba.
- source_word: וְרֹחַב
  choice: at ang lapad
  rationale: Natural na katambal ng ‘ang haba’ sa paglalahad ng mga sukat.
- source_word: עֶשְׂרִים
  choice: dalawampu
  rationale: Tuwirang salin ng bilang para sa lapad.
