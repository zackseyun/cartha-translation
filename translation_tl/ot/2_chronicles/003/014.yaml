base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/003/014.yaml
  text: He made the curtain of blue[a], purple, crimson, and fine linen[c][b], and worked cherubim on it.
translation:
  language: tl
  text: Ginawa niya ang tabing[a] mula sa sinulid na asul, purpura, at matingkad na pula[b], at sa pinong lino; at nilagyan niya ito ng mga larawan ng kerubin[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kurtina.”
    reason: lexical_alternative
  - marker: b
    text: O “iskarlata” o “krimson.”
    reason: lexical_alternative
  - marker: c
    text: Sa literal, “pinaakyat niya rito ang mga kerubin”; ibig sabihin, pinalamutian niya ang tabing ng mga larawan ng kerubin. Hindi tinutukoy ng Hebreo ang eksaktong paraan ng paggawa.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַפָּרֹכֶת
  choice: ang tabing
  rationale: Tumutukoy ito sa panloob na tabing na naghihiwalay sa mga bahagi ng santuwaryo. Likas at malinaw sa modernong Filipino ang “tabing,” habang inilalagay sa talababa ang “kurtina” bilang posibleng katawagan.
- source_word: תְּכֵלֶת
  choice: sinulid na asul
  rationale: Tumutukoy ang salita sa materyal na tinina ng asul o asul-lila. Ang “sinulid na asul” ay likas sa talaan ng mga materyales at nililinaw na hindi lamang abstraktong kulay ang tinutukoy.
- source_word: אַרְגָּמָן
  choice: purpura
  rationale: Karaniwang katawagan ito sa mamahaling materyal na tinina ng kulay purpura at angkop sa marangal na konteksto ng templo.
- source_word: כַרְמִיל
  choice: matingkad na pula
  rationale: Tumutukoy ito sa materyal na tinina ng isang matingkad na kulay pula. Hindi tiyak kung “krimson” o “iskarlata” ang eksaktong modernong katumbas, kaya pinanatili sa talababa ang alternatibo.
- source_word: בּוּץ
  choice: pinong lino
  rationale: Ipinahihiwatig ng salita ang mataas na uri ng lino, hindi lamang pangkalahatang telang lino.
- source_word: וַיַּעַל עָלָיו כְּרוּבִים
  choice: nilagyan niya iyon ng mga kerubin
  rationale: Literal na inilalarawan ng parirala ang pagpapalitaw o paglalagay ng mga kerubin sa tabing. Ang saling ito ay natural at hindi nagpapasya kung burda, habi, o ibang paraan ang ginamit.
- source_word: כְּרוּבִים
  choice: mga kerubin
  rationale: Pinananatili nito ang nakaugaliang terminong biblikal para sa mga nilalang na kaugnay ng presensiya at santuwaryo ng Diyos, nang hindi iniuugnay sa makabagong larawan ng “cherub.”
