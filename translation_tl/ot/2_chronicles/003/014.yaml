translation_notes:
  register: Modernong Filipino na malinaw, marangal, at angkop sa tekstong pangsantuwaryo. Ginamit ang “mula sa sinulid” upang maging natural ang talaan ng mga kulay at materyales; hindi inulit ang “sinulid na” sa bawat kulay upang maiwasan ang kabigatan. Pinanatili sa talababa ang literal na idyoma at ang hindi katiyakan tungkol sa pamamaraang ginamit sa mga larawan ng kerubin.
