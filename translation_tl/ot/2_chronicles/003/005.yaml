translation_notes:
  register: Makabago at marangal na Filipino; ginamit ang “bulwagan” upang maging malinaw ang gamit ng בַּיִת sa arkitektura ng templo. Iniwasan ang sobrang teknikal na “pinanelan,” at pinanatili sa pangunahing teksto ang literal na mga larawang “puno ng palma” at “tanikala,” kasama ang paliwanag sa talababa.
