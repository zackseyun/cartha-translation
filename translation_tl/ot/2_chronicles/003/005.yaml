base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/003/005.yaml
  text: He paneled the great house with cypress wood[a], overlaid it with fine gold[b], and put palm trees and chains on it.
translation:
  language: tl
  text: Binalutan niya ng kahoy na sipres[a] ang malaking bulwagan, binalutan niya ito ng mainam na ginto, at nilagyan niya ito ng mga punong palma at mga tanikala.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “kahoy na enebro” o “kahoy na abeto.” Pinagtatalunan ang eksaktong uri ng punong tinutukoy ng salitang Hebreo.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “mga punong palma at mga tanikala.” Malamang na tumutukoy ang mga ito sa mga disenyong pandekorasyon o mga palamuting inilagay sa bulwagan.
    reason: cultural_note
lexical_decisions:
- source_word: הַבַּיִת הַגָּדוֹל
  choice: ang malaking bulwagan
  rationale: Sa konteksto ng pagtatayo ng templo, ang בַּיִת ay tumutukoy rito sa isang pangunahing silid o bulwagan. Mas malinaw sa karaniwang mambabasa ang “bulwagan” kaysa literal na “bahay,” habang tuwirang isinasalin ng “malaking” ang הַגָּדוֹל.
- source_word: חִפָּה
  choice: binalutan
  rationale: Ang pandiwa ay nangangahulugang takpan o balutan. Ipinahihiwatig ng kasunod na materyal na kahoy na nilinyahan o binalutan ng kahoy ang bulwagan.
- source_word: עֵץ בְּרוֹשִׁים
  choice: kahoy na sipres
  rationale: Karaniwang kinikilalang posibleng kahulugan ng בְּרוֹשׁ ang sipres, ngunit hindi tiyak ang eksaktong uri ng puno; pinananatili sa talababa ang mga alternatibo.
- source_word: וַיְחַפֵּהוּ זָהָב טוֹב
  choice: pinatungan ito ng mainam na ginto
  rationale: Ipinapahayag ng parirala ang pagtakip sa kahoy gamit ang mataas na uri ng ginto. Ang “mainam na ginto” ay malapit sa literal na זָהָב טוֹב nang hindi ipinapalagay na “dalisay” ang tiyak na kahulugan.
- source_word: וַיַּעַל עָלָיו
  choice: nilagyan
  rationale: Sa kontekstong pandekorasyon, ang Hiphil ng עלה ay tumutukoy sa paglalagay o pagkakabit sa ibabaw.
- source_word: תִּמֹרִים
  choice: mga puno ng palma
  rationale: Tuwirang pinananatili ang larawan ng tekstong Hebreo. Malamang na mga disenyong hugis puno ng palma ang tinutukoy, ngunit hindi ito tahasang sinasabi ng teksto.
- source_word: שַׁרְשְׁרוֹת
  choice: mga tanikala
  rationale: Tuwirang katumbas ito ng pangngalang tumutukoy sa mga tanikala o palamuting kahawig ng tanikala.
