revisions:
- from: Pagkatapos, sinimulan ni Solomon na itayo ang bahay ni Yahweh sa Jerusalem, sa Bundok Moria, kung saan nagpakita si Yahweh kay David na kanyang ama.[a] Itinayo niya iyon sa lugar na inihanda ni David, sa giikan ni Ornan na Jebuseo.[b]
  to: Pagkatapos, sinimulan ni Solomon na itayo ang bahay ni Yahweh sa Jerusalem, sa Bundok Moria, kung saan nagpakita si Yahweh sa kanyang amang si David,[a] sa lugar na inihanda ni David, sa giikan ni Ornan na Jebuseo.[b]
  rationale: Pinag-isa ang pangungusap upang maipakita ang siksik at magkakaugnay na mga pariralang panlugar ng Hebreo, at inalis ang dagdag na panghalip na maaaring magpahiwatig ng isang hiwalay na pahayag. Pinalinaw ang ugnayang ama-anak sa 'sa kanyang amang si David.' Iningatan ang tahasang 'si Yahweh' bilang simuno ng 'nagpakita,' habang itinatala ng talababa na implicit ang simuno sa Hebreo.
