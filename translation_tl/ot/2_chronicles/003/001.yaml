  - severity: medium
    issue: Malabo ang 'David na kanyang ama.'
    rationale: Sa kasalukuyang ayos, ang 'kanyang' ay maaaring pansamantalang iugnay kay Yahweh, ang pinakamalapit na pangngalan. Ang 'sa kanyang amang si David' ay natural na nagtatakda na si David ang ama ni Solomon.
