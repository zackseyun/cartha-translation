  verdict: revise
  source_fidelity: 'Tumpak ang karamihan ng draft: naipapahayag nito na sinimulan ni Solomon ang pagtatayo ng bahay ni Yahweh sa Jerusalem, sa Bundok Moria, na lugar ng pagpapakita ni Yahweh kay David at ng giikan ni Ornan na Jebuseo. Gayunman, ang paghahati sa dalawang pangungusap at ang ''Itinayo niya iyon'' ay nagdaragdag ng isang hiwalay at mas tiyak na pahayag na hindi kinakailangan sa masiksik na estruktura ng Hebreo. Maaari rin nitong gawing hindi malinaw ang tinutukoy ng ''niya.'''
  naturalness: Likas ang karamihan ng bokabularyo, kabilang ang 'giikan.' Ngunit mas malinaw at mas maayos sa modernong Filipino na panatilihin ang mga pariralang panlugar sa iisang pangungusap at sabihin ang 'sa kanyang amang si David,' upang malinaw na si David ang ama ni Solomon, hindi ni Yahweh.
  terminology: Ang 'bahay ni Yahweh,' 'Bundok Moria,' 'Ornan,' at 'Jebuseo' ay angkop at tapat sa teksto. Ang paggamit ng 'Yahweh' ay pare-pareho. Nananatili ang anyong 'Ornan' ng Mga Cronica, at ang talababa tungkol sa Arauna ay kapaki-pakinabang.
