id: 2CH.3.1
reference: 2 Chronicles 3:1
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יָּ֣חֶל שְׁלֹמֹ֗ה לִ/בְנ֤וֹת אֶת בֵּית יְהוָה֙ בִּ/יר֣וּשָׁלִַ֔ם בְּ/הַר֙ הַ/מּ֣וֹרִיָּ֔ה אֲשֶׁ֥ר נִרְאָ֖ה לְ/דָוִ֣יד אָבִ֑י/הוּ אֲשֶׁ֤ר הֵכִין֙ בִּ/מְק֣וֹם דָּוִ֔יד בְּ/גֹ֖רֶן אָרְנָ֥ן הַ/יְבוּסִֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/003/001.yaml
  text: Then Solomon began to build the house of Yahweh in Jerusalem on Mount Moriah[a], where Yahweh had appeared to David his father, at the place that David had prepared[b], on the threshing floor of Ornan the Jebusite.
translation:
  language: tl
  text: Pagkatapos, sinimulan ni Solomon na itayo ang bahay ni Yahweh sa Jerusalem, sa Bundok Moria, kung saan nagpakita si Yahweh sa kanyang amang si David,[a] sa lugar na inihanda ni David, sa giikan ni Ornan na Jebuseo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, walang tahasang simuno sa pariralang “kung saan siya nagpakita sa kanyang amang si David.” Sa konteksto, si Yahweh ang tinutukoy.
    reason: alternative_reading
  - marker: b
    text: Ornan ang anyo ng pangalan na ginagamit sa Mga Cronica; ihambing ang Arauna sa 2 Samuel 24:16, 18.
    reason: cross_reference
lexical_decisions:
- source_word: וַיָּחֶל
  choice: Pagkatapos, sinimulan
  rationale: Ipinahihiwatig ng anyong pandiwa ang kasunod na pangyayari sa salaysay, at ang “sinimulan” ang tuwirang diwa nito.
- source_word: לִבְנוֹת
  choice: na itayo
  rationale: Likas na Filipino ito pagkatapos ng “sinimulan” at malinaw na tumutukoy sa pagtatayo ng gusali.
- source_word: בֵּית יְהוָה
  choice: bahay ni Yahweh
  rationale: Pinananatili nito ang konkretong larawang “bahay” sa Hebreo sa halip na agad itong ipakahulugang “templo,” at ginagamit ang pangalang Yahweh para sa tetragrammaton.
- source_word: בְּהַר הַמּוֹרִיָּה
  choice: sa Bundok Moria
  rationale: Ito ang natural at nakikilalang anyo sa modernong Filipino para sa tiyak na bundok na tinutukoy.
- source_word: אֲשֶׁר נִרְאָה לְדָוִיד אָבִיהוּ
  choice: kung saan nagpakita si Yahweh kay David na kanyang ama
  rationale: Karaniwang nangangahulugang “nagpakita” ang Niphal ng ראה sa ganitong konteksto. Ginawang tahasan ang nauunawaang simuno upang maging malinaw sa Filipino, habang itinatala sa talababa na hindi ito tahasang inuulit sa Hebreo.
- source_word: אֲשֶׁר הֵכִין בִּמְקוֹם דָּוִיד
  choice: sa lugar na inihanda ni David
  rationale: Siksik ang pariralang Hebreo; ipinahahayag ng saling ito ang natural na ugnayan ng “inihanda” at “lugar” nang hindi nagdaragdag ng tiyak na uri ng paghahanda.
- source_word: בְּגֹרֶן
  choice: sa giikan
  rationale: Ang “giikan” ang karaniwang salitang Filipino para sa threshing floor; ang “sa” ay natural na pantukoy ng lokasyon.
- source_word: אָרְנָן הַיְבוּסִי
  choice: Ornan na Jebuseo
  rationale: Sinusunod ang anyo ng pangalan sa Mga Cronica at ginagamit ang natural na katawagan sa Filipino para sa isang Jebusite.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Pangngalang pantangi ang nasa tekstong Hebreo, kaya pinananatili ang pangalang Yahweh sa halip na palitan ito ng titulo.
- issue: Simuno ng נִרְאָה (“nagpakita”)
  choice: Ginawang tahasan si Yahweh bilang simuno
  alternative: “kung saan siya nagpakita kay David na kanyang ama”; “na ipinakita kay David na kanyang ama”
  rationale: Hindi tahasang inuulit sa sugnay ang simuno, ngunit sa konteksto si Yahweh ang natural na tinutukoy. Pinipigil ng tahasang pangalan ang malabong pagtukoy sa Bundok Moria, samantalang pinananatili ng talababa ang pormal na pagiging implicit ng simuno.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Pinanatili ang “bahay ni Yahweh” upang maingatan ang larawang Hebreo, ngunit hinati sa dalawang pangungusap ang napakahabang estruktura para sa natural na pagbasa. Inilagay ang mga panandang talababa sa mismong pahayag na nililinaw ng bawat isa.
