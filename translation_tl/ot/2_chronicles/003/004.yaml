translation_notes:
  register: Makabago at marangal na Filipino na madaling maunawaan. Ginamit ang “portiko” bilang karaniwang terminong pang-arkitektura, “siko” para mapanatili ang sinaunang yunit, at buong baybay ng mga bilang upang bumagay sa tekstong pampanitikan at panrelihiyon.
