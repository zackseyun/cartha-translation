base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/003/004.yaml
  text: The portico that was in front of the house was twenty cubits long[a], corresponding to the width of the house, and its height was one hundred and twenty cubits; and he overlaid its interior with pure gold.
translation:
  language: tl
  text: Ang portiko sa harap ng templo ay dalawampung siko ang haba—katumbas ng lapad ng templo—at isang daan at dalawampung siko ang taas.[a] Pinahiran niya ng dalisay na ginto ang loob nito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ayon sa tekstong Hebreo, “isang daan at dalawampu” ang taas ng portiko. Sa kahalintulad na paglalarawan sa 1 Hari 6:3, binanggit ang haba at lapad ng portiko ngunit hindi ang taas nito. Dahil dito, ipinapalagay ng ilang tagapagpaliwanag na maaaring may kahirapang tekstuwal sa bahaging ito; gayunman, sinusunod ng saling ito ang napreserbang Tekstong Masoretiko.
    reason: textual_variant
lexical_decisions:
- source_word: הָאוּלָם
  choice: ang portiko
  rationale: Tumutukoy ito sa pasukan o bulwagang nasa harap ng pangunahing gusali. Ang “portiko” ay maikli, malinaw, at angkop sa estruktura sa harap ng templo.
- source_word: אֲשֶׁר עַל־פְּנֵי
  choice: sa harap ng
  rationale: Likas na ipinahahayag nito sa Filipino ang posisyon ng portiko kaugnay ng templo nang hindi dinaragdagan ang di-tiyak na direksiyon o oryentasyon.
- source_word: הָאֹרֶךְ עַל־פְּנֵי רֹחַב הַבַּיִת אַמּוֹת עֶשְׂרִים
  choice: dalawampung siko ang haba—katumbas ng lapad ng templo
  rationale: Siksik ang Hebreong parirala at iniuugnay ang sukat ng portiko sa lapad ng gusali. Nililinaw ng “katumbas ng lapad” ang ugnayang ito habang pinananatili ang sinaunang yunit na “siko.”
- source_word: הַבַּיִת
  choice: templo
  rationale: Bagaman literal na “bahay” o “gusali,” malinaw sa konteksto na ang tinutukoy ay ang templong itinatayo; “templo” ang pinakanatural at tiyak na tawag sa Filipino.
- source_word: וְהַגֹּבַהּ מֵאָה וְעֶשְׂרִים
  choice: at isang daan at dalawampung siko ang taas
  rationale: Sinusunod nito ang bilang sa Masoretic Text at tahasang inuulit ang yunit upang maging malinaw sa Filipino.
- source_word: וַיְצַפֵּהוּ מִפְּנִימָה
  choice: Binalutan niya ... ang loob nito
  rationale: Ang pandiwa ay tumutukoy sa paglalagay ng sapin o balot na materyal sa isang ibabaw. Natural sa Filipino ang “binalutan ... ang loob nito” para sa panloob na patong na ginto.
- source_word: זָהָב טָהוֹר
  choice: dalisay na ginto
  rationale: Tuwiran at marangal na salin ito ng pariralang tumutukoy sa purong ginto.
