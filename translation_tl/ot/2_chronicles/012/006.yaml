  edition: WLC
  text: וַ/יִּכָּנְע֥וּ שָׂרֵֽי יִשְׂרָאֵ֖ל וְ/הַ/מֶּ֑לֶךְ וַ/יֹּאמְר֖וּ צַדִּ֥יק יְהוָֽה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/012/006.yaml
  text: Then the leaders of Israel and the king humbled themselves and said[a], “Yahweh is righteous.”
translation:
  language: tl
  text: Kaya nagpakumbaba ang mga pinuno ng Israel[a] at ang hari, at sinabi nila, “Matuwid si Yahweh.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: “Israel.” Sa kontekstong ito, nauunawaan ito ng ilan bilang tiyak na pagtukoy sa mga pinuno ng Juda sa ilalim ni Rehoboam, ngunit “Israel” mismo ang sinasabi ng teksto.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּכָּנְעוּ
  choice: nagpakumbaba
  rationale: Ipinahihiwatig ng Niphal ng כנע rito ang kusang pagpapakumbaba o pagpapasakop bilang tugon sa pagsaway ng propeta. Likas at malinaw sa modernong Tagalog ang “nagpakumbaba.”
- source_word: שָׂרֵי
  choice: mga pinuno
  rationale: Ang שָׂרִים ay tumutukoy sa mga namumuno, maharlika, o mataas na opisyal. Ang “mga pinuno” ay malinaw, makabago, at hindi labis na tiyak.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Tahasang “Israel” ang nasa tekstong Hebreo. Hindi ito pinalitan ng “Juda,” kahit iyon ang agarang kontekstong pangkasaysayan, upang hindi lutasin sa salin ang tensiyong nasa teksto.
- source_word: וְהַמֶּלֶךְ
  choice: at ang hari
  rationale: Tuwirang isinasalin ang katagang ito at malinaw na ibinubukod ang hari sa mga pinuno.
- source_word: וַיֹּאמְרוּ
  choice: at sinabi nila
  rationale: Ang tahasang “nila” ay natural sa Tagalog at nililinaw na kapuwa ang mga pinuno at ang hari ang nagsalita.
- source_word: צַדִּיק
  choice: Matuwid
  rationale: Ang צַדִּיק ay nagpapahayag na tama at makatarungan si Yahweh, lalo na sa kaniyang hatol. Pinananatili ng “matuwid” ang moral at teolohikal na bigat ng salita.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang transliterasyon ng personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
theological_decisions:
- issue: Kung pananatilihin ang banal na pangalan o papalitan ito ng titulong “Panginoon”
  choice: Yahweh
  alternative: Panginoon; Jehovah
  rationale: Ang pinagmulang teksto ay tahasang gumagamit ng Tetragrammaton na יְהוָה, kaya pinananatili ang personal na pangalan bilang “Yahweh.”
- issue: Kung papalitan ang “Israel” ng “Juda” para umayon sa agarang kontekstong pangkasaysayan
  choice: Israel
  alternative: Juda
  rationale: Tahasang “Israel” ang mababasa sa Hebreo. Ang pagpapalit dito ng “Juda” ay magiging interpretatibong paghaharmonisa; sa halip, pinanatili ang salita at ipinaliwanag ang usapin sa talababa.
translation_notes:
  register: Makabago, natural, at marangal na Filipino. Ginamit ang “nagpakumbaba” para sa malinaw na kusang tugon, “mga pinuno” sa halip na mas makaluma o mas tiyak na “mga prinsipe,” at ang payak na pahayag na “Matuwid si Yahweh” upang mapanatili ang diin ng Hebreong panaguri.
