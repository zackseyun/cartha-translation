base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/012/008.yaml
  text: For they will become his servants[a], so that they may know my service and the service of the kingdoms of the lands.
translation:
  language: tl
  text: Sapagkat sila'y magiging mga alipin niya[a], upang malaman nila ang paglilingkod sa akin at ang paglilingkod sa mga kaharian ng mga lupain.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga lingkod niya.” Ang salitang Hebreo ay maaaring mangahulugang mga alipin o mga lingkod; dito, tumutukoy ito sa pagpapasakop sa isang dayuhang hari.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Nagbibigay ito ng dahilan para sa naunang ipinahayag na kilos ng Diyos.
- source_word: יִהְיוּ לוֹ לַעֲבָדִים
  choice: sila'y magiging mga alipin niya
  rationale: Ang konstruksiyon ay nagpapahayag ng pagiging o pagkakaroon ng bagong kalagayan. Sa konteksto ng pagpapasakop kay Sisak, malinaw ang sapilitang pampolitikang paglilingkod, kaya pinili ang 'mga alipin' kaysa sa mas banayad na 'mga lingkod.'
- source_word: וְיֵדְעוּ
  choice: upang malaman nila ang kaibahan
  rationale: Maaaring magpahayag ang anyo ng layunin o bunga. Ang idinagdag na 'ang kaibahan' ay natural na ipinahihiwatig ng paghahambing ng dalawang uri ng paglilingkod.
- source_word: עֲבוֹדָתִי
  choice: paglilingkod sa akin
  rationale: Pinananatili ng 'paglilingkod' ang lawak ng salita, na maaaring tumukoy sa paglilingkod, katapatan, at pagsamba.
- source_word: וַעֲבוֹדַת
  choice: at ng paglilingkod sa
  rationale: Inuulit ang parehong salitang 'paglilingkod' upang mapanatili ang sinadyang paghahambing sa Hebreo.
- source_word: מַמְלְכוֹת הָאֲרָצוֹת
  choice: mga kaharian ng ibang mga lupain
  rationale: Ipinapahayag ang maramihang mga dayuhang kaharian sa natural na modernong Tagalog; ipinahihiwatig ng konteksto ang 'ibang' mga lupain.
theological_decisions:
- issue: Kung ang עֲבוֹדָה na tumutukoy sa Diyos ay isasaling 'paglilingkod' o mas tiyak na 'pagsamba'
  choice: paglilingkod
  alternative: pagsamba
  rationale: Pinananatili ng 'paglilingkod' ang parehong panrelihiyon at pampolitikang dimensiyon at ang paralelismo sa paglilingkod sa mga kaharian.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang 'alipin' upang ilantad ang bigat ng sapilitang pagpapasakop, at 'paglilingkod' upang mapanatili ang mahalagang pag-uugnay at tensiyon sa pagitan ng paglilingkod sa Diyos at paglilingkod sa mga kaharian.
