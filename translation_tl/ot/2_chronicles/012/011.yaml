id: 2CH.12.11
reference: 2 Chronicles 12:11
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יְהִ֛י מִ/דֵּי ב֥וֹא הַ/מֶּ֖לֶךְ בֵּ֣ית יְהוָ֑ה בָּ֤אוּ הָ/רָצִים֙ וּ/נְשָׂא֔וּ/ם וֶ/הֱשִׁב֖וּ/ם אֶל תָּ֥א הָ/רָצִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/012/011.yaml
  text: And whenever the king entered the house of Yahweh[a], the guards would come and carry them[c][b], and then return them to the guards’ chamber.
translation:
  language: tl
  text: Tuwing pumapasok ang hari sa bahay ni Yahweh, dumarating ang mga bantay[a] at dinadala ang mga iyon[b]. Pagkatapos, ibinabalik nila ang mga iyon sa silid ng mga bantay[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “mga mananakbo”; tumutukoy ito rito sa maharlikang bantay.
    reason: lexical_alternative
  - marker: b
    text: Ang “mga iyon” ay tumutukoy sa mga kalasag na tanso na binanggit sa talata 10.
    reason: cross_reference
  - marker: c
    text: Maaari ring “silid-bantayan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִדֵּי בּוֹא
  choice: Tuwing pumapasok
  rationale: Ipinahahayag ng idyomang מִדֵּי kasunod ng pawatas ang paulit-ulit na pangyayari; likas at malinaw itong naihahatid ng “tuwing.”
- source_word: בֵּית יְהוָה
  choice: bahay ni Yahweh
  rationale: Pinananatili ang literal at karaniwang Hebreong katawagan sa templo bilang “bahay,” habang tahasang isinasalin ang banal na pangalan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ang Tetragrammaton bilang pangalan ng Diyos sa halip na palitan ito ng isang titulo.
- source_word: הָרָצִים
  choice: mga bantay
  rationale: Bagaman literal na “mga mananakbo,” tumutukoy ang salita sa kontekstong maharlika sa pangkat ng mga tagapagbantay ng hari.
- source_word: וּנְשָׂאוּם
  choice: dinadala ang mga iyon
  rationale: Ang pandiwa ay nangangahulugang buhatin o dalhin; ang hulaping panghalip ay tumutukoy sa mga kalasag na tanso sa naunang talata.
- source_word: וֶהֱשִׁיבוּם
  choice: ibinabalik nila ang mga iyon
  rationale: Ang Hiphil ng שׁוב ay nagpapahayag ng pagpapabalik sa mga bagay sa pinaglalagyan ng mga ito matapos gamitin.
- source_word: תָּא
  choice: silid
  rationale: Ang תָּא ay isang nakahiwalay na silid o chamber; natural at sapat ang “silid” sa modernong Tagalog.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Pangalan mismo ang nasa tekstong Hebreo, kaya pinananatili itong “Yahweh” sa halip na palitan ng titulong “PANGINOON.”
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “bahay ni Yahweh” upang mapanatili ang larawan ng Hebreo, at hinati sa dalawang pangungusap ang sugnay upang maging natural ang daloy nang hindi binabago ang pagkakasunod ng mga kilos.
