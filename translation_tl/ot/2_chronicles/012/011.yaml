  source_fidelity: 'Tapat ang salin sa paulit-ulit na aspekto ng מִדֵּי בּוֹא sa “Tuwing pumapasok,” sa literal na “bahay ni Yahweh,” at sa sunod-sunod na pagkilos ng mga bantay: pagdating, pagdadala ng mga kalasag, at pagbabalik ng mga ito sa kanilang silid. Wasto ring nilinaw sa talababa na ang panghalip ay tumutukoy sa mga tansong kalasag sa naunang talata.'
