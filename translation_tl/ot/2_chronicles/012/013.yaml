  text: וַ/יִּתְחַזֵּ֞ק הַ/מֶּ֧לֶךְ רְחַבְעָ֛ם בִּ/ירוּשָׁלִַ֖ם וַ/יִּמְלֹ֑ךְ כִּ֣י בֶן אַרְבָּעִ֣ים וְ/אַחַ֣ת שָׁנָה֩ רְחַבְעָ֨ם בְּ/מָלְכ֜/וֹ וּֽ/שֲׁבַ֨ע עֶשְׂרֵ֥ה שָׁנָ֣ה מָלַ֣ךְ בִּֽ/ירוּשָׁלִַ֗ם הָ֠/עִיר אֲשֶׁר בָּחַ֨ר יְהוָ֜ה לָ/שׂ֨וּם אֶת שְׁמ֥/וֹ שָׁם֙ מִ/כֹּל֙ שִׁבְטֵ֣י יִשְׂרָאֵ֔ל וְ/שֵׁ֣ם אִמּ֔/וֹ נַעֲמָ֖ה הָֽ/עַמֹּנִֽית־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/012/013.yaml
  text: So King Rehoboam strengthened himself in Jerusalem and reigned[a]. Rehoboam was forty-one years old when he began to reign, and he reigned seventeen years in Jerusalem, the city that Yahweh had chosen from all the tribes of Israel to put his name there[b]. And his mother’s name was Naamah the Ammonite.
translation:
  language: tl
  text: Pinagtibay ni Haring Rehoboam ang kanyang paghahari sa Jerusalem, at naghari siya. Apatnapu’t isang taong gulang si Rehoboam nang magsimula siyang maghari, at naghari siya sa Jerusalem nang labimpitong taon. Ang Jerusalem ang lungsod na pinili ni Yahweh mula sa lahat ng lipi ng Israel upang ilagay roon ang kanyang pangalan. Ang pangalan ng kanyang ina ay si Naama na Ammonita.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O kaya, “Naama na babaeng Ammonita.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְחַזֵּק
  choice: pinatatag ... ang kanyang kapangyarihan
  rationale: Ang hitpael ng חזק ay nagpapahiwatig ng pagpapalakas o pagpapatatag sa sarili. Sa konteksto ng paghahari, ang likas na Tagalog na parirala ay tumutukoy sa pagpapatatag ni Rehoboam ng kanyang kapangyarihan, hindi lamang sa pisikal na lakas.
- source_word: וַיִּמְלֹךְ
  choice: at naghari siya roon
  rationale: Pinananatili nito ang kasunod na kilos sa salaysay nang hindi ipinapalagay na dito pa lamang nagsimula ang kanyang paghahari.
- source_word: בְּמָלְכוֹ
  choice: nang magsimula siyang maghari
  rationale: Ang infinitive construct na may בְּ ay nagsasaad ng panahon ng pagluklok o pagsisimula ng paghahari.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin bilang personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
- source_word: לָשׂוּם אֶת־שְׁמוֹ שָׁם
  choice: upang ilagay roon ang kanyang pangalan
  rationale: Pinananatili ang kongkretong idyomang Hebreo at iniiwasang palawakin ito bilang paliwanag tungkol sa presensiya o pananahan ng Diyos.
- source_word: הָעַמֹּנִית
  choice: isang Ammonita
  rationale: Likas at makabagong Tagalog para sa pambabaeng katawagang etniko na tumutukoy sa pinagmulan ni Naama.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehovah
  rationale: Personal na pangalan ang tuwirang nasa tekstong Hebreo; pinananatili ito bilang Yahweh sa halip na palitan ng titulo.
- issue: 'Pormula ng pagkahirang sa Jerusalem: לָשׂוּם אֶת־שְׁמוֹ שָׁם'
  choice: upang ilagay roon ang kanyang pangalan
  alternative: upang itatag doon ang kanyang presensiya
  rationale: Pinananatili ang pahayag ng teksto at hindi nagdaragdag ng isang tiyak na teolohikal na pagpapakahulugan tungkol sa presensiya o pananahan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “pinatatag ... ang kanyang kapangyarihan” upang natural na maipahayag ang kontekstuwal na diwa ng reflexive na pandiwa, habang inilalahad sa talababa ang mas tuwirang alternatibo. Ang “lipi” ay ginamit para sa mga tribo ng Israel, at pinanatili ang idyomang “ilagay ... ang kanyang pangalan.”
