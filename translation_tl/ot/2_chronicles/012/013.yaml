revisions:
- from: Kaya pinatatag ni Haring Rehoboam ang kanyang kapangyarihan sa Jerusalem, at naghari siya roon.[a] Apatnapu’t isang taong gulang si Rehoboam nang magsimula siyang maghari, at naghari siya sa Jerusalem nang labimpitong taon. Ang Jerusalem ang lungsod na pinili ni Yahweh mula sa lahat ng lipi ng Israel upang ilagay roon ang kanyang pangalan. Ang pangalan ng kanyang ina ay Naama, isang Ammonita.
  to: Pinagtibay ni Haring Rehoboam ang kanyang paghahari sa Jerusalem, at naghari siya. Apatnapu’t isang taong gulang si Rehoboam nang magsimula siyang maghari, at naghari siya sa Jerusalem nang labimpitong taon. Ang Jerusalem ang lungsod na pinili ni Yahweh mula sa lahat ng lipi ng Israel upang ilagay roon ang kanyang pangalan. Ang pangalan ng kanyang ina ay si Naama na Ammonita.[a]
  rationale: 'Inalis ang inferensiyang “Kaya” at ginawang mas natural ang unang pahayag sa Tagalog, habang pinananatili ang kontekstuwal na reflexive/inchoative na diwa ng pandiwang Hebreo: ang pagpapatatag ni Rehoboam ng kanyang paghahari. Inilipat ang talababa sa katawagang etniko upang magbigay ng malinaw na alternatibong anyong pambabae; walang kailangang talababa para sa unang pandiwa dahil ang pangunahing salin ay tapat na nitong naipapahayag ang kontekstong pampolitika.'
