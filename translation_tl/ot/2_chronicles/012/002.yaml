base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/012/002.yaml
  text: And in the fifth year of King Rehoboam[a], Shishak king of Egypt came up against Jerusalem, because they had acted unfaithfully against Yahweh.
translation:
  language: tl
  text: Noong ikalimang taon ng paghahari ni Haring Rehoboam, lumusob si Sisak, hari ng Ehipto, laban sa Jerusalem, sapagkat hindi sila naging tapat sa PANGINOON.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “sapagkat nagtaksil sila sa PANGINOON” o “sapagkat nagkasala sila laban sa PANGINOON.” Ang pandiwang Hebreo ay tumutukoy sa paglabag sa katapatan o pagtataksil, lalo na sa ugnayang tipan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַּשָּׁנָה הַחֲמִישִׁית לַמֶּלֶךְ רְחַבְעָם
  choice: Nang ikalimang taon ng paghahari ni Haring Rehoboam
  rationale: Likas na pormula sa Filipino para sa pagpepetsa ayon sa taon ng paghahari; ipinahihiwatig ng לַמֶּלֶךְ ang kaugnayan sa paghahari ni Rehoboam.
- source_word: עָלָה ... עַל יְרוּשָׁלִָם
  choice: sinalakay ... ang Jerusalem
  rationale: Sa kontekstong militar, ang עָלָה עַל ay paglusob o pagsalakay laban sa isang lugar. Ang “sinalakay” ay malinaw at natural, nang hindi ipinapalagay na nasakop na ang lungsod.
- source_word: שִׁישַׁק מֶלֶךְ מִצְרַיִם
  choice: Sisak na hari ng Egipto
  rationale: Isinasalin sa karaniwang anyong Filipino ang pangalan at tuwirang pinananatili ang titulong nasa construct chain.
- source_word: כִּי
  choice: sapagkat
  rationale: Malinaw na ipinakikita ang sanhi ng pagsalakay ayon sa teolohikal na paglalahad ng Cronista.
- source_word: מָעֲלוּ בַּיהוָה
  choice: nagtaksil sila kay Yahweh
  rationale: Ang מעל ay tumutukoy sa paglabag sa katapatan, lalo na sa ugnayang tipan. Ang “nagtaksil” ay likas at matindi sa Filipino; pinananatili sa talababa ang mas tahasang alternatibong “hindi naging tapat.”
- source_word: יהוה
  choice: Yahweh
  rationale: Tuwirang kinakatawan ang personal na pangalan ng Diyos sa tekstong Hebreo, alinsunod sa source-grounded na pagsasalin.
theological_decisions:
- issue: Ang pagsalakay bilang bunga ng paglabag sa katapatan kay Yahweh
  choice: sapagkat nagtaksil sila kay Yahweh
  alternative: sapagkat hindi sila naging tapat kay Yahweh; sapagkat nagkasala sila laban kay Yahweh
  rationale: Pinananatili ang tahasang ugnayang sanhi sa כִּי at ang dimensiyong relasyonal at tipan ng מעל, nang hindi nilalabnaw ito bilang pangkalahatang pagkakasala lamang.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “Nang ikalimang taon ng paghahari” bilang likas na pormula ng regnal dating at “nagtaksil” upang maipahayag ang bigat ng covenantal unfaithfulness.
