id: 2CH.12.9
reference: 2 Chronicles 12:9
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יַּ֨עַל שִׁישַׁ֥ק מֶֽלֶךְ מִצְרַיִם֮ עַל יְרוּשָׁלִַם֒ וַ/יִּקַּ֞ח אֶת אֹצְר֣וֹת בֵּית יְהוָ֗ה וְ/אֶת אֹֽצְרוֹת֙ בֵּ֣ית הַ/מֶּ֔לֶךְ אֶת הַ/כֹּ֖ל לָקָ֑ח וַ/יִּקַּח֙ אֶת מָגִנֵּ֣י הַ/זָּהָ֔ב אֲשֶׁ֥ר עָשָׂ֖ה שְׁלֹמֹֽה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/012/009.yaml
  text: So Shishak king of Egypt came up against Jerusalem and took the treasuries of the house of Yahweh and the treasuries of the king’s house[a]. He took everything[b]; he also took the gold shields that Solomon had made.
translation:
  language: tl
  text: Kaya sinalakay ni Sisak, na hari ng Ehipto, ang Jerusalem at kinuha niya ang mga kayamanan sa bahay ni Yahweh[a] at ang mga kayamanan sa bahay ng hari.[b] Kinuha niya ang lahat, pati ang mga kalasag na ginto na ginawa ni Solomon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “templo ni Yahweh.”
    reason: lexical_alternative
  - marker: b
    text: O “palasyo ng hari.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל ... עַל יְרוּשָׁלִַם
  choice: sinalakay ... ang Jerusalem
  rationale: Sa kontekstong militar, ang עָלָה kasunod ng עַל ay tumutukoy sa paglusob o pagsalakay laban sa isang lunsod. Ang “sinalakay” ay likas at malinaw sa modernong Filipino.
- source_word: שִׁישַׁק
  choice: Sisak
  rationale: Isinalin sa karaniwang anyong transliterado sa Filipino ang pangalan.
- source_word: מֶלֶךְ מִצְרַיִם
  choice: hari ng Ehipto
  rationale: Tuwirang ipinapahayag ng pariralang konstrakto ang katungkulan at kaharian ni Sisak.
- source_word: אֹצְרוֹת
  choice: mga kayamanan
  rationale: Sa konteksto, ang tinangay ay ang mahahalagang pag-aari na nasa templo at palasyo. Mas natural sa Filipino ang “mga kayamanan” kaysa sabihing mismong mga silid ng kabang-yaman ang kinuha.
- source_word: בֵּית יְהוָה
  choice: bahay ni Yahweh
  rationale: Pinananatili nito ang konkretong Hebreong ekspresyong “bahay ni Yahweh,” habang inilalahad sa talababa ang mas interpretatibong “templo ni Yahweh.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ang banal na pangalang יהוה sa pamamagitan ng transliterasyong “Yahweh.”
- source_word: בֵּית הַמֶּלֶךְ
  choice: bahay ng hari
  rationale: Pinananatili ang literal na parirala at ang pagkakapantay ng anyo nito sa “bahay ni Yahweh”; ang “palasyo” ay inilalagay bilang malinaw na alternatibo.
- source_word: אֶת־הַכֹּל לָקָח
  choice: Kinuha niya ang lahat
  rationale: Napananatili ang mariing paglalagom na lubusang tinangay ang mga kayamanan.
- source_word: מָגִנֵּי הַזָּהָב
  choice: mga kalasag na ginto
  rationale: Likas na Filipino ito para sa mga kalasag na yari sa ginto.
- source_word: אֲשֶׁר עָשָׂה שְׁלֹמֹה
  choice: na ginawa ni Solomon
  rationale: Tuwirang pinananatili ang pangungusap na nag-uugnay sa mga kalasag sa naunang ginawa ni Solomon, nang hindi dinaragdagan ang teksto ng ideya na ipinagawa lamang niya ang mga iyon.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehovah
  rationale: Pangalan mismo ang nasa tekstong Hebreo, kaya pinananatili ito bilang “Yahweh” sa halip na palitan ng titulo.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Pinanatili ang magkaparis na “bahay ni Yahweh” at “bahay ng hari,” ngunit nagbigay ng mas karaniwang mga katumbas sa mga talababa. Inilipat ang mga marker sa mismong mga pariralang tinutukoy ng bawat talababa upang maiwasan ang hindi malinaw na pagtuturo.
