  source_fidelity: 'Tumpak ang salin sa pangunahing mga bahagi ng Hebreo: gumawa si Rehoboam ng mga kalasag na tanso bilang pamalit, inilagay ang mga ito sa pangangalaga ng mga pinuno ng mga bantay, at ang mga bantay ang nagbabantay sa pasukan ng tirahan/palasyo ng hari. Ang “tanso” ay angkop na pangkalahatang salin ng נְחֹשֶׁת at hindi pilit na nilulutas ang posibleng copper/bronze na saklaw ng salita.'
