  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יַּ֨עַשׂ הַ/מֶּ֤לֶךְ רְחַבְעָם֙ תַּחְתֵּי/הֶ֔ם מָגִנֵּ֖י נְחֹ֑שֶׁת וְ/הִפְקִ֗יד עַל יַד֙ שָׂרֵ֣י הָ/רָצִ֔ים הַ/שֹּׁ֣מְרִ֔ים פֶּ֖תַח בֵּ֥ית הַ/מֶּֽלֶךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/012/010.yaml
  text: So King Rehoboam made bronze shields in their place and committed them to the care of the commanders of the guards[b][a], who kept watch at the entrance of the king’s house.
translation:
  language: tl
  text: Kaya gumawa si Haring Rehoboam ng mga kalasag na tanso bilang kapalit ng mga iyon[b] at ipinagkatiwala ang mga ito sa mga pinuno ng mga bantay[a] na nagbabantay sa pasukan ng palasyo ng hari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “mga mananakbo,” na malamang ay tumutukoy sa mga tagapaghatid o maharlikang bantay na naglilingkod bilang mga bantay ng palasyo.
    reason: lexical_alternative
  - marker: b
    text: Ibig sabihin, ang mga kalasag na tanso ang ipinalit sa mga kalasag na ginto na kinuha ni Sisak; tingnan ang naunang talata.
    reason: cross_reference
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: gumawa
  rationale: Karaniwang kahulugan ng עשה sa kontekstong ito at natural sa makabagong Tagalog.
- source_word: תַּחְתֵּיהֶם
  choice: bilang kapalit ng mga iyon
  rationale: Malinaw na ipinahahayag ang pagpapalit at tumutukoy pabalik sa mga kalasag na ginto sa naunang talata.
- source_word: מָגִנֵּי נְחֹשֶׁת
  choice: mga kalasag na tanso
  rationale: Maaaring tumukoy ang נְחֹשֶׁת sa copper o bronze; ang 'tanso' ang natural at malawak na terminong Filipino sa ganitong sinaunang konteksto.
- source_word: וְהִפְקִיד עַל יַד
  choice: ipinagkatiwala ... sa
  rationale: Naihahatid ang diwa ng paglalagay ng mga bagay sa pangangalaga o pananagutan ng iba.
- source_word: שָׂרֵי
  choice: mga pinuno
  rationale: Ang שָׂרֵי ay mga namumuno o opisyal; ang 'mga pinuno' ay malinaw at hindi labis na nagtatakda ng ranggong militar.
- source_word: הָרָצִים
  choice: mga bantay
  rationale: Literal itong 'mga mananakbo,' ngunit sa konteksto ng korte ng hari ay tumutukoy sa pangkat na nagsisilbing mga tagapaghatid o bantay; ang literal na anyo ay pinananatili sa talababa.
- source_word: הַשֹּׁמְרִים
  choice: na nagbabantay
  rationale: Pinananatili ang tuloy-tuloy na tungkuling ipinahihiwatig ng participle.
- source_word: פֶּתַח בֵּית הַמֶּלֶךְ
  choice: pasukan ng palasyo ng hari
  rationale: Literal na 'pasukan ng bahay ng hari'; sa konteksto, ang bahay ng hari ay ang maharlikang tirahan o palasyo.
theological_decisions: []
translation_notes:
  register: Makabagong Filipino Tagalog na malinaw at marangal. Ginamit ang 'palasyo ng hari' upang likas na maipahayag ang kontekstuwal na kahulugan ng בֵּית הַמֶּלֶךְ, at iniwasan ang sobrang teknikal o makalumang pananalita.
