revisions:
- from: 'Pagkatapos, pumunta kay Rehoboam ang propetang si Semaias at sa mga pinuno ng Juda na nagtipon sa Jerusalem dahil kay Sisak[a]. Sinabi niya sa kanila, “Ganito ang sinabi ni Yahweh: ‘Tinalikuran ninyo ako, kaya tinalikuran ko rin kayo at ipinaubaya sa kamay ni Sisak.’”'
  to: 'Pagkatapos, dumating kay Roboam at sa mga pinuno ng Juda na nagtipon sa Jerusalem dahil kay Sisak[a] ang propetang si Semaias. Sinabi niya sa kanila, “Ganito ang sinabi ni Yahweh: ‘Tinalikuran ninyo ako, kaya tinalikuran ko rin kayo at ibinigay ko kayo sa kamay ni Sisak.’”'
  rationale: Inayos ang sintaks ng pagdating ni Semaias, ginamit ang karaniwang Filipino anyong “Roboam,” at nilinaw ang idiom na “sa kamay ni Sisak” nang hindi binabago ang hatol o ang retorikal na pagtutumbas ng “tinalikuran.” Pinanatili ang talababa upang hindi mawala ang saklaw ng מִפְּנֵי (“mula sa harap ng”).
