  - severity: medium
    issue: Hindi ganap na malinaw ang paghahatid sa בְּיַד שִׁישָׁק.
    rationale: Ang “ipinaubaya sa kamay ni Sisak” ay walang hayag na layon at maaaring mabasa bilang hiwalay na kilos. Ang “ibinigay ko kayo sa kamay ni Sisak” ay nagbibigay ng natural na Filipino para sa idiom ng pagkakaloob sa kapangyarihan ni Sisak, habang pinananatili ang larawang “kamay.”},{
