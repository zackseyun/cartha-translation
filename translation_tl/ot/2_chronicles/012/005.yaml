source:
  edition: WLC
  text: וּֽ/שְׁמַֽעְיָ֤ה הַ/נָּבִיא֙ בָּ֣א אֶל רְחַבְעָ֔ם וְ/שָׂרֵ֣י יְהוּדָ֔ה אֲשֶׁר נֶאֶסְפ֥וּ אֶל יְרוּשָׁלִַ֖ם מִ/פְּנֵ֣י שִׁישָׁ֑ק וַ/יֹּ֨אמֶר לָ/הֶ֜ם כֹּה אָמַ֣ר יְהוָ֗ה אַתֶּם֙ עֲזַבְתֶּ֣ם אֹתִ֔/י וְ/אַף אֲנִ֛י עָזַ֥בְתִּי אֶתְ/כֶ֖ם בְּ/יַד שִׁישָֽׁק־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/012/005.yaml
  text: 'Then Shemaiah the prophet came to Rehoboam and the officials of Judah who had gathered in Jerusalem because of Shishak[a], and he said to them, “Thus says Yahweh: You have forsaken me, so I also have forsaken you into the hand of Shishak.”'
translation:
  language: tl
  text: 'Pagkatapos, dumating kay Roboam at sa mga pinuno ng Juda na nagtipon sa Jerusalem dahil kay Sisak[a] ang propetang si Semaias. Sinabi niya sa kanila, “Ganito ang sinabi ni Yahweh: ‘Tinalikuran ninyo ako, kaya tinalikuran ko rin kayo at ibinigay ko kayo sa kamay ni Sisak.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “mula sa harap ni Sisak,” na maaaring mangahulugang dahil kay Sisak o dahil sa takot sa kanya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁמַעְיָה הַנָּבִיא
  choice: Pagkatapos ... ang propetang si Semaias
  rationale: Ang וּ ay nagpapatuloy sa salaysay, kaya natural ang “Pagkatapos.” Pinanatili ang tiyak na katawagan sa tungkuling propeta; ginamit ang nakaugaliang anyong Filipino na “Semaias.”
- source_word: בָּא אֶל רְחַבְעָם וְשָׂרֵי יְהוּדָה
  choice: pumunta kay Rehoboam ... at sa mga pinuno ng Juda
  rationale: Ang בָּא אֶל ay paglapit o pagpunta sa mga taong tinutukoy. Ang שָׂרֵי ay mga pinunong may kapangyarihang pampamahalaan; malinaw at hindi makaluma ang “mga pinuno.”
- source_word: אֲשֶׁר נֶאֶסְפוּ אֶל יְרוּשָׁלַםִ
  choice: na nagtipon sa Jerusalem
  rationale: Natural na ipinahahayag sa Filipino ang pagtitipon at ang kinalalagyan nito sa pamamagitan ng “nagtipon sa.”
- source_word: מִפְּנֵי שִׁישָׁק
  choice: dahil kay Sisak
  rationale: Sa konteksto, ang literal na “mula sa harap ni Sisak” ay nagpapahiwatig ng dahilan o banta na dulot niya. Pinananatili sa talababa ang mas literal at posibleng takot na diwa.
- source_word: כֹּה אָמַר יְהוָה
  choice: Ganito ang sinabi ni Yahweh
  rationale: Natural at marangal na katumbas ng pormulang propetiko, habang tuwirang pinananatili ang pangalang tipan na יהוה bilang “Yahweh.”
- source_word: עֲזַבְתֶּם אֹתִי ... עָזַבְתִּי אֶתְכֶם
  choice: Tinalikuran ninyo ako ... tinalikuran ko rin kayo
  rationale: Ang “tinalikuran” ay may sapat na bigat para sa pagtatakwil sa ugnayang tipan. Ang pag-uulit ng iisang salita ay nagpapanatili sa malinaw na retorikal na pagtutumbas ng Hebreo.
- source_word: בְּיַד שִׁישָׁק
  choice: ipinaubaya sa kamay ni Sisak
  rationale: Ang “sa kamay ni” ay nagpapanatili sa larawang Hebreo tungkol sa pagkasailalim sa kapangyarihan ng iba. Idinagdag ang “ipinaubaya” upang maging buo at natural ang diwa sa Filipino.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Pangalan mismo na יהוה ang nasa tekstong Hebreo. Ang “Yahweh” ay tuwirang transliterasyon at hindi pinapalitan ng isang titulo.
- issue: Katumbas na pagtalikod ng Diyos bilang hatol
  choice: tinalikuran ko rin kayo at ipinaubaya sa kamay ni Sisak
  alternative: iniwan ko rin kayo sa kapangyarihan ni Sisak
  rationale: Pinananatili ang iisang pandiwang עזב sa ginawa ng bayan at sa tugon ng Diyos, nang hindi pinapahina ang simetriya o nilulutas nang lampas sa sinasabi ng teksto kung ano ang saklaw ng pagtalikod.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Iniwasan ang makalumang “mga prinsipe” para sa שָׂרֵי at pinanatili ang biblikal na larawang “sa kamay ni Sisak.”
