  text: He captured the fortified cities that belonged to Judah and came as far as Jerusalem[a].
translation:
  language: tl
  text: Sinakop niya ang mga nakukutaang lungsod ng Juda at nakarating hanggang sa Jerusalem.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “at sumulong hanggang sa Jerusalem.” Literal sa Hebreo, “at dumating hanggang sa Jerusalem”; idinidiin nito na umabot siya hanggang Jerusalem matapos sakupin ang mga nakukutaang lungsod ng Juda.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלְכֹּד
  choice: Sinakop
  rationale: Ang לכד ay tumutukoy sa pagsakop o pag-agaw sa isang lungsod sa digmaan. Likas sa modernong Filipino ang “sinakop” at malinaw ang diwang militar.
- source_word: עָרֵי הַמְּצֻרוֹת
  choice: ang mga napapaderang lungsod
  rationale: Tahasang binabanggit ng Hebreo ang mga lungsod na may tanggulan. Ipinahihiwatig ng “napapaderang lungsod” ang mga sentrong urban na pinatibay para sa pagtatanggol, nang hindi ginagawang mas pangkalahatang “mga kuta.”
- source_word: אֲשֶׁר לִיהוּדָה
  choice: na sakop ng Juda
  rationale: Ang ל ay nagpapahayag dito ng pag-aari o pampolitikang kaugnayan. Ang “sakop ng Juda” ay malinaw at natural, at hindi nililimitahan ang kahulugan sa lokasyong heograpiko lamang.
- source_word: וַיָּבֹא עַד יְרוּשָׁלִָם
  choice: at nakarating hanggang sa Jerusalem
  rationale: Ang בוא na may עַד ay nagsasaad ng pag-abot sa isang hangganan. Pinananatili ng “nakarating hanggang sa” ang posibilidad na umabot siya sa Jerusalem nang hindi tiyak na sinasabing pumasok o nasakop niya ito.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “napapaderang lungsod” para sa madaling pagkaunawa sa mga lungsod na pinatibay, at “nakarating hanggang sa” upang mapanatili ang hangganang ipinahihiwatig ng עַד.
