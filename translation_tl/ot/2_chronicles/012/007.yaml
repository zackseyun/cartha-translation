id: 2CH.12.7
reference: 2 Chronicles 12:7
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וּ/בִ/רְא֤וֹת יְהוָה֙ כִּ֣י נִכְנָ֔עוּ הָיָה֩ דְבַר יְהוָ֨ה אֶל שְׁמַֽעְיָ֧ה לֵ/אמֹ֛ר נִכְנְע֖וּ לֹ֣א אַשְׁחִיתֵ֑/ם וְ/נָתַתִּ֨י לָ/הֶ֤ם כִּ/מְעַט֙ לִ/פְלֵיטָ֔ה וְ/לֹא תִתַּ֧ךְ חֲמָתִ֛/י בִּ/ירוּשָׁלִַ֖ם בְּ/יַד שִׁישָֽׁק־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/012/007.yaml
  text: When Yahweh saw that they had humbled themselves[a], the word of Yahweh came to Shemaiah, saying, “They have humbled themselves; I will not destroy them, but I will grant them some deliverance, and my wrath will not be poured out on Jerusalem by the hand of Shishak.”
translation:
  language: tl
  text: 'Nang makita ni Yahweh na nagpakumbaba sila, dumating kay Semaya ang salita ni Yahweh: “Nagpakumbaba sila. Hindi ko sila lilipulin, kundi pagkakalooban ko sila ng bahagyang pagliligtas[a]. Hindi ibubuhos ang poot ko sa Jerusalem sa pamamagitan ni Sisak.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “kaunting pagkakataong makatakas” o “ilang makaliligtas.” Masinsin ang pariralang Hebreo at maaaring idiin ang limitadong pagliligtas sa halip na ganap na pagkalipol.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִרְאוֹת
  choice: Nang makita
  rationale: Ang ב na kasama ng infinitive construct ng ראה ay nagpapakilala ng sugnay na panahunan; natural sa Tagalog ang “Nang makita.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Direktang tinutumbasan ng transliterasyong “Yahweh” ang banal na pangalang YHWH sa halip na palitan ito ng isang titulo.
- source_word: נִכְנָעוּ
  choice: nagpakumbaba sila
  rationale: Sa konteksto, ipinahihiwatig ng Niphal ng כנע ang kusang pagpapakumbaba o pagpapasakop bilang tugon sa babala ng propeta.
- source_word: הָיָה דְבַר יְהוָה אֶל
  choice: dumating kay ... ang salita ni Yahweh
  rationale: Pinananatili nito ang karaniwang pormulang propetiko sa Hebreo habang nananatiling natural sa Tagalog.
- source_word: לֹא אַשְׁחִיתֵם
  choice: Hindi ko sila lilipulin
  rationale: Ang Hiphil ng שׁחת ay tumutukoy sa pagwasak o paglipol; ang “lilipulin” ay angkop sa konteksto ng hatol.
- source_word: וְנָתַתִּי לָהֶם כִּמְעַט לִפְלֵיטָה
  choice: kundi pagkakalooban ko sila ng bahagyang pagliligtas
  rationale: Ipinahahayag ng masinsing parirala ang limitadong pagliligtas sa halip na ganap na pagkaligtas; ang “kundi” ay natural na naghahayag ng pagsalungat sa naunang “hindi.”
- source_word: תִתַּךְ חֲמָתִי
  choice: ibubuhos ang poot ko
  rationale: Pinananatili ang larawang Hebreo ng poot na ibinubuhos at ang mabigat na rehistro ng hatol.
- source_word: בְּיַד שִׁישָׁק
  choice: sa pamamagitan ni Sisak
  rationale: Natural na ipinahahayag sa Tagalog ang Hebreong idyoma ng kamay bilang kasangkapan o tagapamagitan ng pagkilos.
- source_word: שְׁמַעְיָה / שִׁישָׁק
  choice: Semaya / Sisak
  rationale: Mga transliterasyong madaling basahin sa modernong Filipino at malapit sa anyong Hebreo.
theological_decisions:
- issue: Paglalarawan sa tugon ng mga pinuno sa hatol
  choice: nagpakumbaba sila
  alternative: nagpasakop sila / ibinaba sila
  rationale: Pinananatili ang posibleng pansariling pagpapakumbaba ng Niphal sa konteksto, nang hindi ito ginagawang sapilitang pagpapababa.
- issue: Lawak ng ipinangakong pagliligtas
  choice: bahagyang pagliligtas
  alternative: kaunting pagtakas / ilang nakaligtas
  rationale: Hindi nilulutas nang tahasan kung ang פְלֵיטָה ay tumutukoy sa gawa ng pagliligtas, pagkakataong makatakas, o mga taong makaliligtas; inilalagay sa talababa ang tunay na leksikal na kalabuan.
- issue: Pangalan ng Diyos na יְהוָה
  choice: Yahweh
  alternative: Jehovah / ang PANGINOON
  rationale: Pangngalang pantangi ang nasa tekstong Hebreo, kaya pinananatili ang banal na pangalan sa transliterasyon sa halip na palitan ng titulo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang pormulang propetiko at ang larawan ng poot na “ibinubuhos,” ngunit ginawang natural ang Hebreong idyoma ng ahensiya bilang “sa pamamagitan ni Sisak.”
