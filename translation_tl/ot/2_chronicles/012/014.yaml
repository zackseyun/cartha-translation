base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/012/014.yaml
  text: And he did what was evil[a], because he had not set his heart to seek Yahweh.
translation:
  language: tl
  text: At gumawa siya ng masama sapagkat hindi niya inihanda ang kanyang puso upang hanapin si Yahweh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: At gumawa siya
  rationale: Pinananatili ng “At” ang pagkakasunod-sunod ng salaysay, at tuwirang isinasalin ng “gumawa” ang Qal na anyo ng עשה.
- source_word: הָרָע
  choice: ng masama
  rationale: Likas sa modernong Tagalog ang “gumawa ng masama” bilang moral na pagtataya, nang hindi kailangang gayahin nang alanganin ang artikulo sa Hebreo.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinahahayag dito ng כִּי ang dahilan ng naunang moral na pagtataya; ang “sapagkat” ay malinaw at marangal sa rehistro.
- source_word: לֹא הֵכִין
  choice: hindi niya itinuon
  rationale: Ang Hiphil ng כון ay maaaring mangahulugang ihanda, itatag, o itakda. Sa kaugnayan ng puso at layuning hanapin ang Diyos, ipinakikita ng “itinuon” ang sinasadyang panloob na pagpapasiya.
- source_word: לִבּוֹ
  choice: ang kanyang puso
  rationale: Pinananatili ng “puso” ang Hebreong larawan ng kalooban at panloob na layunin, sa halip na paliitin ito sa isip lamang.
- source_word: לִדְרוֹשׁ
  choice: sa paghahanap
  rationale: Ang דרשׁ na ang Diyos ang layon ay tumutukoy sa paghahanap sa kanya, kasama ang diwa ng paglapit, pagsangguni, at debosyon. Hindi nililimitahan ng “paghahanap” ang saklaw nito.
- source_word: אֶת יְהוָה
  choice: kay Yahweh
  rationale: Isinasalin ang Tetragrammaton bilang “Yahweh,” at ginagamit ang “kay” bilang likas na pananda sa personal na layon ng paghahanap.
theological_decisions:
- issue: Paglalarawan sa sanhi ng paggawa ng masama
  choice: sapagkat hindi niya itinuon ang kanyang puso sa paghahanap kay Yahweh
  alternative: sapagkat hindi niya inihanda ang kanyang puso upang hanapin si Yahweh
  rationale: Pinananatili ang tuwirang ugnayang sanhi sa Hebreo ngunit hindi pinalalawak kung ang kakulangan ay kawalan ng matatag na pasiya, paghahanda, o pareho. Ang “itinuon” ay natural na Tagalog at sumasaklaw sa kusang disposisyon ng puso.
- issue: Paglilipat ng pangalang יְהוָה
  choice: Yahweh
  alternative: ang PANGINOON
  rationale: Ginagamit ng pinagmulang teksto ang personal na banal na pangalan. Ang “Yahweh” ay tuwirang transliterasyon at hindi pinapalitan ang pangalan ng isang titulo.
translation_notes:
  register: Modernong Filipino Tagalog na maikli, malinaw, at marangal. Ginamit ang “sapagkat” sa halip na mas kolokyal na “dahil,” at iniwasan ang sobrang literal ngunit di-likas na “inihanda ang kanyang puso.”
