  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וּ/בְ/הִכָּֽנְע֗/וֹ שָׁ֤ב מִמֶּ֨/נּוּ֙ אַף יְהוָ֔ה וְ/לֹ֥א לְ/הַשְׁחִ֖ית לְ/כָלָ֑ה וְ/גַם֙ בִּֽ/יהוּדָ֔ה הָיָ֖ה דְּבָרִ֥ים טוֹבִֽים־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/012/012.yaml
  text: And when he humbled himself[a], the anger of Yahweh turned away from him, so as not to destroy him completely[b]; and also in Judah there were good things.
translation:
  language: tl
  text: Nang magpakumbaba siya[a], lumayo sa kanya ang galit ni Yahweh, kaya hindi siya lubusang nilipol; at mayroon ding mabubuting bagay sa Juda[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “nang pasakop siya” o “nang magpakababa siya.”
    reason: lexical_alternative
  - marker: b
    text: Malawak ang pariralang Hebreo na “mabubuting bagay”; maaaring tumukoy ito sa mabubuting kalagayan, gawa, o iba pang bagay sa Juda.
    reason: lexical_ambiguity
lexical_decisions:
- source_word: וּבְהִכָּנְעוֹ
  choice: Nang magpakumbaba siya
  rationale: 'Ang ב na ikinabit sa infinitive construct ay may temporal na diwa, at ang hitpael ng כנע ay reflexive: kusang nagpakumbaba si Rehoboam, hindi lamang siya ipinahiya.'
- source_word: שָׁב מִמֶּנּוּ אַף יְהוָה
  choice: lumayo sa kanya ang galit ni Yahweh
  rationale: Inilalarawan ng שָׁב kasama ng מִמֶּנּוּ ang pagtalikod o paglayo ng galit mula kay Rehoboam. Pinananatili ng “lumayo” ang direksiyonal na larawan nang hindi ito pinapakahulugang lubos na pagkansela sa hatol.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang personal na pangalang Yahweh bilang transliterasyon ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: וְלֹא לְהַשְׁחִית לְכָלָה
  choice: kaya hindi siya lubusang nilipol
  rationale: Ipinahahayag ng negatibo at infinitive ang naging resulta o layunin ng paglayo ng galit. Pinatitindi ng לְכָלָה ang pagkawasak bilang lubusan; ang “siya” ay ipinahiwatig mula sa konteksto.
- source_word: וְגַם בִּיהוּדָה הָיָה דְּבָרִים טוֹבִים
  choice: at mayroon ding mabubuting bagay sa Juda
  rationale: Pinananatili ng “mabubuting bagay” ang malawak na saklaw ng דְּבָרִים טוֹבִים at hindi ito nililimitahan sa mga gawa, kalagayan, o pangyayari lamang.
theological_decisions:
- issue: Paglalarawan sa paghupa ng banal na galit at sa natitirang hatol
  choice: lumayo sa kanya ang galit ni Yahweh, kaya hindi siya lubusang nilipol
  alternative: nagbago ang pasiya ni Yahweh at hindi na siya nilipol
  rationale: Ipinakikita ng teksto ang tunay na pagpapagaan ng hatol bilang tugon sa pagpapakumbaba, ngunit hindi nito sinasabing nawala ang lahat ng kaparusahan. Iniiwasan ng salin ang labis na pagpapakahulugang kinansela ang buong hatol.
- issue: Saklaw ng mabuti sa Juda
  choice: mayroon ding mabubuting bagay sa Juda
  alternative: mabuti ang kalagayan sa Juda
  rationale: Malawak at hindi tiyak ang pariralang Hebreo. Hindi ito dapat tahasang ipakahulugan bilang repormang moral, kasaganaan, o mabubuting gawa lamang.
translation_notes:
  register: Makabago ngunit marangal na Filipino ang ginamit. Ang “magpakumbaba,” “lumayo ang galit,” at “lubusang nilipol” ay madaling maunawaan habang nananatiling malapit sa estruktura at mga larawan ng Hebreo. Pinanatili ang pangalang “Juda” at ang banal na pangalang “Yahweh.”
