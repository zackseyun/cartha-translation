translation_notes:
  register: Makabago ngunit marangal na Filipino ang ginamit. Pinanatili ang anyong dugtong ng pambungad na “kasama ang” dahil nagpapatuloy ang talata sa kilos at paksa ng naunang bersikulo. Ginamit ang em dash upang malinaw na ipakilala ang talaan ng mga pangkat.
