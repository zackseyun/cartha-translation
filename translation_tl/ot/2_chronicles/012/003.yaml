  text: בְּ/אֶ֤לֶף וּ/מָאתַ֨יִם֙ רֶ֔כֶב וּ/בְ/שִׁשִּׁ֥ים אֶ֖לֶף פָּרָשִׁ֑ים וְ/אֵ֣ין מִסְפָּ֗ר לָ/עָ֞ם אֲשֶׁר בָּ֤אוּ עִמּ/וֹ֙ מִ/מִּצְרַ֔יִם לוּבִ֥ים סֻכִּיִּ֖ים וְ/כוּשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/012/003.yaml
  text: 'with 1,200 chariots and 60,000 horsemen[a], and the people who came with him from Egypt were without number: Libyans, Sukkites[c][b], and Cushites.'
translation:
  language: tl
  text: kasama ang 1,200 karwahe at 60,000 mangangabayo. Hindi mabilang[a] ang mga taong sumama sa kanya mula sa Ehipto—mga Libiano, mga Sukita,[b] at mga Kusita.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “walang bilang ang mga tao.”
    reason: lexical_alternative
  - marker: b
    text: Ang “mga Sukita” ay salin-tunog ng pangalan ng isang pangkat na hindi tiyak ang eksaktong pagkakakilanlan.
    reason: cultural_note
  - marker: c
    text: Maaari ring “mga Etiope,” ngunit mas tuwirang kumakatawan ang “mga Kusita” sa katawagang Hebreo para sa pangkat na mula sa Cush.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּאֶלֶף וּמָאתַיִם רֶכֶב
  choice: kasama ang 1,200 karwahe
  rationale: Ang בְּ sa talaan ng hukbo ay nagpapahiwatig ng kasamang puwersa. Ginawang mabibilang na “karwahe” ang kolektibong רֶכֶב upang maging natural kasunod ng tiyak na bilang.
- source_word: וּבְשִׁשִּׁים אֶלֶף פָּרָשִׁים
  choice: at 60,000 mangangabayo
  rationale: Ang פָּרָשִׁים ay tumutukoy sa mga mandirigmang nakasakay sa kabayo; malinaw at karaniwan sa salaysay na pangkasaysayan ang “mangangabayo.”
- source_word: וְאֵין מִסְפָּר לָעָם
  choice: Hindi mabilang ang mga tao
  rationale: Natural na ipinahahayag ng “Hindi mabilang” ang Hebreong idyomang literal na nagsasabing walang bilang ang mga tao, habang pinananatili ng “mga tao” ang pangkalahatang עָם sa halip na gawin itong tahasang “hukbo.”
- source_word: אֲשֶׁר בָּאוּ עִמּוֹ מִמִּצְרַיִם
  choice: na sumama sa kanya mula sa Ehipto
  rationale: Tuwirang inilalarawan ng parirala ang pagsama nila sa kanya at ang kanilang pinanggalingan.
- source_word: לוּבִים
  choice: mga Libiano
  rationale: Ito ang natural na katawagang Filipino sa pangkat na karaniwang iniuugnay sa Libya.
- source_word: סֻכִּיִּים
  choice: mga Sukita
  rationale: Isinalin bilang transliteradong pangalan ng pangkat sapagkat hindi tiyak ang eksaktong pagkakakilanlan nito.
- source_word: וְכוּשִׁים
  choice: at mga Kusita
  rationale: Pinananatili ng “Kusita” ang makasaysayang-etnograpikong katawagang כוש at iniiwasang ipantay ito nang walang pasubali sa makabagong Ethiopia.
