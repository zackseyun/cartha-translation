  source_fidelity: 'Tumpak na naihahatid ang lahat ng elemento ng Hebreo: 1,200 karwahe, 60,000 mangangabayo, ang di-mabilang na mga taong sumama sa kanya mula sa Ehipto, at ang tatlong pangkat na Libiano, Sukita, at Kusita. Hindi nito ginagawang mas tiyak ang עָם bilang hukbo o ang di-tiyak na pagkakakilanlan ng mga Sukita.'
