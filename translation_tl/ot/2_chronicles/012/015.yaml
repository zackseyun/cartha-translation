  - severity: low
    issue: Bahagyang di-natural ang ayos ng mga pamagat kasunod ng pangalan.
    rationale: Mas karaniwan at marangal sa Filipino ang “ang propetang si Semaias” at “ang tagakitang si Iddo.”
