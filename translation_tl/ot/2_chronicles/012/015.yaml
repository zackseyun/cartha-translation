  text: וְ/דִבְרֵ֣י רְחַבְעָ֗ם הָ/רִאשֹׁנִים֙ וְ/הָ/אֲ֣חַרוֹנִ֔ים הֲ/לֹא הֵ֨ם כְּתוּבִ֜ים בְּ/דִבְרֵ֨י שְׁמַֽעְיָ֧ה הַ/נָּבִ֛יא וְ/עִדּ֥וֹ הַ/חֹזֶ֖ה לְ/הִתְיַחֵ֑שׂ וּ/מִלְחֲמ֧וֹת רְחַבְעָ֛ם וְ/יָרָבְעָ֖ם כָּל הַ/יָּמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/012/015.yaml
  text: The acts of Rehoboam[a], the first and the last, are they not written in the records of Shemaiah the prophet and of Iddo the seer, according to genealogical enrollment? And there were wars between Rehoboam and Jeroboam all their days.
translation:
  language: tl
  text: Ang mga ginawa ni Rehoboam, mula sa una hanggang sa huli, hindi ba nakasulat ang mga iyon sa mga tala ng propetang si Semaias at ng tagakitang si Iddo, ayon sa pagpapatala ng angkan?[a] At nagkaroon ng mga digmaan sa pagitan nina Rehoboam at Jeroboam sa buong panahon nila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa mga talaangkanan” o “para sa pagpapatala ayon sa angkan.” Mahirap tiyakin ang kahulugan at saklaw ng pariralang Hebreo; maaaring inilalarawan nito ang anyo o layunin ng mga tala na kaugnay ni Iddo.
    reason: lexical_alternative
lexical_decisions:
- source_word: דִבְרֵי רְחַבְעָם
  choice: ang mga ginawa ni Rehoboam
  rationale: Sa pormulang nagbubuod sa paghahari, ang דִבְרֵי ay tumutukoy sa mga ginawa o pangyayari sa buhay at paghahari ng hari, hindi lamang sa kaniyang mga salita.
- source_word: הָרִאשֹׁנִים וְהָאֲחַרוֹנִים
  choice: mula sa una hanggang sa huli
  rationale: Natural na Filipino para sa pormulang sumasaklaw sa kabuuan ng paghahari, habang pinananatili ang dalawang dulo ng Hebreong pananalita.
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: hindi ba nakasulat ang mga iyon
  rationale: Pinananatili ang retorikal na tanong at ang pormal na pormula ng pagtukoy sa isang nakasulat na sanggunian.
- source_word: בְּדִבְרֵי
  choice: sa mga tala
  rationale: Sa kontekstong ito, tumutukoy ito sa nakasulat na materyal na pangkasaysayan; mas malinaw ang 'mga tala' kaysa sa literal na 'mga salita.'
- source_word: הַנָּבִיא
  choice: na propeta
  rationale: Karaniwang salin ng נָבִיא at natural bilang pamagat kasunod ng pangalan.
- source_word: הַחֹזֶה
  choice: na tagakita
  rationale: Pinananatili ang pagkakaiba ng חֹזֶה sa נָבִיא sa pamamagitan ng kinikilalang katawagang 'tagakita.'
- source_word: לְהִתְיַחֵשׂ
  choice: may kaugnayan sa pagtatala ng angkan
  rationale: Ang anyo ay tumutukoy sa pag-uuri o pagpapatala ayon sa talaangkanan. Sadyang maluwag nang kaunti ang parirala upang mapanatili ang tunay na kalabuan kung inilalarawan nito ang anyo o layunin ng mga tala.
- source_word: וּמִלְחֲמוֹת
  choice: At nagkaroon ng mga digmaan
  rationale: Ginagawang hayag sa natural na Filipino ang ipinahihiwatig na predikasyon ng Hebreong pariralang pangngalan.
- source_word: כָּל הַיָּמִים
  choice: sa buong panahon nila
  rationale: Ipinahahayag ang patuloy na alitan sa panahon ng kanilang magkasabay na buhay o paghahari nang hindi ipinapalagay na eksaktong magkapantay ang haba ng kanilang mga paghahari.
