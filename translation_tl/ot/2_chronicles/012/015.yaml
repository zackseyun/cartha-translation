revisions:
- from: Ang mga ginawa ni Rehoboam, mula sa una hanggang sa huli, hindi ba nakasulat ang mga iyon sa mga tala ni Semaias na propeta at ni Iddo na tagakita, may kaugnayan sa pagtatala ng angkan?[a] At nagkaroon ng mga digmaan sa pagitan nina Rehoboam at Jeroboam sa buong panahon nila.
  to: Ang mga ginawa ni Rehoboam, mula sa una hanggang sa huli, hindi ba nakasulat ang mga iyon sa mga tala ng propetang si Semaias at ng tagakitang si Iddo, ayon sa pagpapatala ng angkan?[a] At nagkaroon ng mga digmaan sa pagitan nina Rehoboam at Jeroboam sa buong panahon nila.
  rationale: Ginawang mas tiyak ang salin ng mahirap na pariralang לְהִתְיַחֵשׂ bilang “ayon sa pagpapatala ng angkan,” ngunit pinanatili sa talababa ang iba pang posibleng pagbasa at ang hindi tiyak na saklaw nito. Pinakinis din ang pagkakasunod ng mga pangalan at titulo para sa natural na modernong Filipino.
