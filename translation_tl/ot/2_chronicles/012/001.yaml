  text: וַ/יְהִ֗י כְּ/הָכִ֞ין מַלְכ֤וּת רְחַבְעָם֙ וּ/כְ/חֶזְקָת֔/וֹ עָזַ֖ב אֶת תּוֹרַ֣ת יְהוָ֑ה וְ/כָל יִשְׂרָאֵ֖ל עִמּֽ/וֹ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/012/001.yaml
  text: And when Rehoboam’s kingdom was established[a], and he had become strong, he abandoned the law of Yahweh—and all Israel with him.
translation:
  language: tl
  text: Nang matatag na ang paghahari ni Rehoboam at naging makapangyarihan na siya, tinalikuran niya ang kautusan[a] ni Yahweh—at gayon din ang ginawa ng buong Israel kasama niya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “tagubilin.” Ang Hebreong torah ay maaaring mangahulugang “kautusan” o “tagubilin,” depende sa konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְּהָכִין
  choice: Nang matatag na
  rationale: Ipinahahayag ng parirala ang kalagayang panahunan sa pasimula ng salaysay. Likas sa modernong Tagalog ang “Nang,” at ang כון dito ay tumutukoy sa pagiging matatag o matibay ng paghahari.
- source_word: מַלְכוּת רְחַבְעָם
  choice: ang paghahari ni Rehoboam
  rationale: Sa kontekstong ito, mas malinaw na tumutukoy ang מַלְכוּת sa pamamahala o paghahari ni Rehoboam kaysa sa lupain lamang ng kaharian.
- source_word: וּכְחֶזְקָתוֹ
  choice: at naging makapangyarihan na siya
  rationale: Tumutukoy ang חזק sa pagtatamo ni Rehoboam ng lakas at matatag na kapangyarihan. Ginawang tahasan ang personal na reperente na likas sa Tagalog.
- source_word: עָזַב
  choice: tinalikuran
  rationale: Malinaw nitong ipinahahayag ang sadyang pagtalikod sa tipan at mas natural sa kasalukuyang Tagalog kaysa sa “pinabayaan” o sa makalumang mga katumbas.
- source_word: תּוֹרַת
  choice: kautusan
  rationale: Sa historikal at tipanang konteksto, ang “kautusan” ang pinakapamilyar na katumbas, habang kinikilala sa talababa na maaari ring mangahulugang “tagubilin” ang תּוֹרָה.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinumbasan ang personal na banal na pangalan sa tekstong Hebreo.
- source_word: וְכָל יִשְׂרָאֵל עִמּוֹ
  choice: at gayundin ang buong Israel na kasama niya
  rationale: Pinananatili ang “buong Israel” at hindi nililimitahan sa Juda. Ipinakikita ng “gayundin” na nakibahagi sila sa pagtalikod ni Rehoboam.
theological_decisions:
- issue: Saklaw ng “buong Israel” sa panahon ng nahating kaharian
  choice: buong Israel
  alternative: buong Juda; lahat ng kanyang nasasakupan
  rationale: Israel mismo ang ginamit ng Hebreo. Pinananatili ng salin ang posibleng tensiyon sa katawagang ito sa halip na paliitin ang saklaw nito sa pamamagitan ng interpretasyon.
- issue: Kahulugan ng תּוֹרָה
  choice: kautusan
  alternative: tagubilin
  rationale: Ang kontekstong tipanan ay sumusuporta sa “kautusan,” ngunit tunay na saklaw ng salitang Hebreo ang “tagubilin,” kaya inilalahad ang alternatibo sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na dignificado ngunit madaling maunawaan. Ginamit ang “paghahari” upang idiin ang matatag na pamamahala ni Rehoboam, at pinanatili ang pangalang Yahweh at ang literal na katawagang “buong Israel.”
