base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/012/016.yaml
  text: And Rehoboam slept with his fathers and was buried in the city of David[a], and Abijah his son reigned in his place.
translation:
  language: tl
  text: At nahimlay si Rehoboam kasama ng kanyang mga ninuno[a] at inilibing sa Lungsod ni David. Ang anak niyang si Abias ay naghari bilang kapalit niya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “natulog kasama ng kanyang mga ama,” isang karaniwang Hebreong pahayag para sa pagkamatay at pagsama sa hanay ng mga ninuno.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: nahimlay
  rationale: Bahagi ito ng karaniwang pormula tungkol sa pagkamatay ng isang hari. Pinananatili ng “nahimlay” ang matalinghagang anyo ng Hebreo habang malinaw sa kasunod na pagbanggit sa paglilibing na namatay si Rehoboam.
- source_word: עִם אֲבֹתָיו
  choice: kasama ng kanyang mga ninuno
  rationale: Ang “mga ninuno” ang natural at malinaw na modernong Tagalog para sa mga ama o mga naunang salinlahi sa pormulang dinastiko.
- source_word: וַיִּקָּבֵר
  choice: inilibing
  rationale: Natural na Tagalog na katumbas ng Hebreong pandiwang pasibo; hindi na kailangang tahasang banggitin ang di-tukoy na tagaganap.
- source_word: בְּעִיר דָּוִיד
  choice: sa Lungsod ni David
  rationale: Pinananatili ang kinikilalang katawagan sa pook at ginagawang natural sa Tagalog ang ugnayang ipinahahayag ng Hebreo.
- source_word: וַיִּמְלֹךְ
  choice: naghari
  rationale: Karaniwang katumbas ng מלך sa mga salaysay tungkol sa paghalili sa trono.
- source_word: אֲבִיָּה
  choice: Abias
  rationale: Ginagamit ang nakaugaliang anyong Tagalog ng pangalang Abijah na nasa tekstong Hebreo rito.
- source_word: בְנוֹ
  choice: ang anak niyang
  rationale: Tuwirang ipinahahayag ang kaugnayang anak at ama sa natural na ayos ng pangungusap sa Tagalog.
- source_word: תַּחְתָּיו
  choice: bilang kapalit niya
  rationale: Malinaw na ipinahahayag ang paghalili ni Abias sa trono at malapit sa literal na diwang “sa lugar niya.”
