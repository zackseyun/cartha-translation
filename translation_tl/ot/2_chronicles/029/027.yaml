  text: וַ/יֹּ֨אמֶר֙ חִזְקִיָּ֔הוּ לְ/הַעֲל֥וֹת הָ/עֹלָ֖ה לְ/הַ/מִּזְבֵּ֑חַ וּ/בְ/עֵ֞ת הֵחֵ֣ל הָֽ/עוֹלָ֗ה הֵחֵ֤ל שִׁיר יְהוָה֙ וְ/הַ/חֲצֹ֣צְר֔וֹת וְ/עַ֨ל יְדֵ֔י כְּלֵ֖י דָּוִ֥יד מֶֽלֶךְ יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/027.yaml
  text: Then Hezekiah commanded to offer up the burnt offering on the altar[a]. And at the time the burnt offering began, the song of Yahweh began also[b], with the trumpets and by means of the instruments of David king of Israel.
translation:
  language: tl
  text: Pagkatapos, iniutos[a] ni Ezekias na ialay sa altar ang handog na sinusunog. Nang magsimula ang handog na sinusunog, nagsimula rin ang awit ni Yahweh,[b] kasabay ng tunog ng mga trumpeta at sa saliw ng mga instrumento ni David na hari ng Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “sinabi ... na ialay.” Sa kontekstong ito, ang konstruksiyon sa Hebreo ay naghahayag ng isang utos.
    reason: literal_rendering
  - marker: b
    text: O, “ang awit para kay Yahweh.” Sa literal, “ang awit ni Yahweh.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר ... לְהַעֲלוֹת
  choice: iniutos ... na ialay
  rationale: Bagaman karaniwang nangangahulugang “sinabi” ang וַיֹּאמֶר, ang pagkakasunod nito sa infinitibong may לְ ay naghahayag dito ng utos. Ang “iniutos ... na ialay” ay likas na Filipino at pinananatili ang sakripisyal na diwa ng causative na לְהַעֲלוֹת.
- source_word: הָעֹלָה
  choice: ang handog na sinusunog
  rationale: Ito ang malinaw at kinikilalang katumbas sa Filipino ng עֹלָה, isang handog na lubusang sinusunog sa altar.
- source_word: לַמִּזְבֵּחַ
  choice: sa altar
  rationale: Likas na ipinapahayag sa Filipino ang pag-aalay sa altar gamit ang “sa altar,” nang hindi binabago ang lugar ng paghahandog.
- source_word: הֵחֵל ... הֵחֵל
  choice: magsimula ... nagsimula rin
  rationale: 'Inulit ang pandiwa upang mapanatili ang sinadyang pagtutugma sa Hebreo: kasabay ng pagsisimula ng handog ang pagsisimula rin ng awit.'
- source_word: שִׁיר יְהוָה
  choice: ang awit ni Yahweh
  rationale: Pinananatili ng “awit ni Yahweh” ang anyong construct ng Hebreo at ang tunay na kalabuan nito kung ang awit ay pag-aari, nauukol, o iniuukol kay Yahweh.
- source_word: הַחֲצֹצְרוֹת
  choice: mga trumpeta
  rationale: Eksaktong tumutukoy ang salita sa mga trumpeta; hindi idinagdag ang “pilak” sapagkat hindi iyon tahasang binanggit sa talata.
- source_word: וְעַל יְדֵי כְּלֵי דָּוִיד
  choice: sa saliw ng mga instrumento ni David
  rationale: Sa kontekstong pangmusika, ipinahihiwatig ng idyoma ang instrumental na pagsali ng mga instrumentong kaugnay ni David. Likas sa Filipino ang “sa saliw ng” at hindi na kailangang idagdag ang salitang “pangmusika.”
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: hari ng Israel
  rationale: Tuwirang pinanatili ang pamagat ni David sa tekstong Hebreo.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Ginamit ang personal na pangalang “Yahweh” upang katawanin ang Tetragrammaton sa halip na palitan ito ng isang titulo.
- issue: Kahulugan ng שִׁיר יְהוָה
  choice: ang awit ni Yahweh
  alternative: ang awit para kay Yahweh
  rationale: Hindi tiyak sa Hebreong construct kung pag-aari o kaugnayan ang diin, o kung ang awit ay iniuukol kay Yahweh. Pinanatili sa pangunahing teksto ang pormal na kalabuan at inilagay sa talababa ang posibleng direksiyon ng awit.
- issue: Lakas ng utos sa וַיֹּאמֶר ... לְהַעֲלוֹת
  choice: iniutos ... na ialay
  alternative: sinabi ... na ialay
  rationale: Ang buong konstruksiyon ay gumaganap bilang isang utos ng hari, kahit “sinabi” ang payak na leksikal na kahulugan ng וַיֹּאמֶר. Itinatala sa talababa ang mas literal na anyo upang hindi maitago ang pagkakaiba.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Ezekias,” “altar,” at “trumpeta,” na pamilyar sa karaniwang mambabasang Filipino. Pinanatili ang pag-uulit ng “magsimula/nagsimula” bilang mahalagang estilistikong katangian ng Hebreo, habang ginawang likas ang pariralang musikal sa pamamagitan ng “sa saliw ng.”
