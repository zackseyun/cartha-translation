- from: Pagkatapos, iniutos ni Ezekias na ialay sa altar ang handog na sinusunog.[a] Nang magsimula ang handog na sinusunog, nagsimula rin ang awit ni Yahweh,[b] kasabay ng mga trumpeta at sa saliw ng mga instrumento ni David na hari ng Israel.
  to: Pagkatapos, iniutos[a] ni Ezekias na ialay sa altar ang handog na sinusunog. Nang magsimula ang handog na sinusunog, nagsimula rin ang awit ni Yahweh,[b] kasabay ng tunog ng mga trumpeta at sa saliw ng mga instrumento ni David na hari ng Israel.
