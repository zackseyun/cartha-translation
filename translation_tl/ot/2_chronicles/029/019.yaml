  text: וְ/אֵ֣ת כָּל הַ/כֵּלִ֗ים אֲשֶׁ֣ר הִזְנִיחַ֩ הַ/מֶּ֨לֶךְ אָחָ֧ז בְּ/מַלְכוּת֛/וֹ בְּ/מַעֲל֖/וֹ הֵכַ֣נּוּ וְ/הִקְדָּ֑שְׁנוּ וְ/הִנָּ֕/ם לִ/פְנֵ֖י מִזְבַּ֥ח יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/019.yaml
  text: And all the vessels that King Ahaz cast aside during his reign in his unfaithfulness[a], we have prepared and consecrated; and behold[b], they are before the altar of Yahweh.
translation:
  language: tl
  text: At ang lahat ng kagamitang isinentabi[a] ni Haring Ahaz noong panahon ng kanyang paghahari, sa kanyang paglabag sa katapatan[b], ay inihanda namin at itinalagang banal. At narito, ang mga ito ay nasa harap ng altar ni Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “pinabayaan” o “itinabi.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “sa kanyang pagtataksil” o “sa kanyang kawalan ng katapatan.” Idinidiin ng Hebreo ang paglabag ni Ahaz sa katapatan.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֵּלִים
  choice: mga kagamitan
  rationale: Malawak ang kahulugan ng כֵּלִים bilang mga kasangkapan o bagay na ginagamit; sa konteksto ng templo, malinaw at likas sa modernong Filipino ang “mga kagamitan.”
- source_word: הִזְנִיחַ
  choice: itinabi
  rationale: Ipinahihiwatig ng pandiwa ang aktibong pagsasantabi o pagtalikod sa mga kagamitan. Ang “itinabi” ay natural ngunit pinananatili ang diwang hindi na ginamit ang mga ito.
- source_word: בְּמַלְכוּתוֹ
  choice: noong panahon ng kanyang paghahari
  rationale: Temporal ang gamit ng parirala at malinaw itong naipapahayag sa natural na Filipino.
- source_word: בְּמַעֲלוֹ
  choice: sa kanyang pagtataksil
  rationale: Ang מַעַל ay tumutukoy sa paglabag sa katapatan, lalo na sa ugnayang panrelihiyon o tipan. Mas naipapakita ng “pagtataksil” ang bigat nito kaysa simpleng kapabayaan.
- source_word: הֵכַנּוּ
  choice: inihanda namin
  rationale: Tuwirang ipinapahayag nito ang paggawa sa mga kagamitan na handa nang gamitin muli.
- source_word: וְהִקְדָּשְׁנוּ
  choice: at itinalagang banal
  rationale: Ipinapahayag ng קדשׁ sa anyong hiphil ang pagbubukod ng isang bagay bilang banal. Nauunawaan ng karaniwang mambabasa ang “itinalagang banal” at angkop ito sa konteksto ng templo.
- source_word: וְהִנָּם
  choice: At narito, ... ang mga iyon
  rationale: Pinananatili ng “narito” ang pantawag-pansing lakas ng הִנֵּה at itinuturo ang kasalukuyang kinaroroonan ng mga kagamitan.
- source_word: לִפְנֵי מִזְבַּח יְהוָה
  choice: sa harap ng altar ni Yahweh
  rationale: Likas na salin ng lokatibong parirala ang “sa harap ng,” at pinananatili ang pangalang Yahweh para sa יהוה.
theological_decisions:
- issue: Pagpapahayag sa מַעַל bilang paglabag sa katapatan
  choice: pagtataksil
  alternative: kawalan ng katapatan; paglabag
  rationale: Ang “pagtataksil” ay nagpapanatili sa moral at panrelihiyong bigat ng salita nang hindi tinutukoy nang higit sa sinasabi ng teksto ang eksaktong uri ng paglabag.
- issue: Pagpapahayag sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Isinasatitik ang personal na pangalang nasa tekstong Hebreo at iniiwasang palitan ito ng isang titulo.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “altar” bilang karaniwang terminong panrelihiyon, at “itinalagang banal” upang maging malinaw ang kultikong diwa ng konsekrasyon.
