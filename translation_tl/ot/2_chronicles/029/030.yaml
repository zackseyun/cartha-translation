source:
  edition: WLC
  text: וַ֠/יֹּאמֶר יְחִזְקִיָּ֨הוּ הַ/מֶּ֤לֶךְ וְ/הַ/שָּׂרִים֙ לַ/לְוִיִּ֔ם לְ/הַלֵּל֙ לַֽ/יהוָ֔ה בְּ/דִבְרֵ֥י דָוִ֖יד וְ/אָסָ֣ף הַ/חֹזֶ֑ה וַֽ/יְהַלְלוּ֙ עַד לְ/שִׂמְחָ֔ה וַֽ/יִּקְּד֖וּ וַ/יִּֽשְׁתַּחֲוֽוּ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/030.yaml
  text: Then Hezekiah the king and the officials told the Levites to praise Yahweh with the words of David and of Asaph the seer[a]. So they praised with gladness[b], and they bowed down and worshiped.
translation:
  language: tl
  text: Pagkatapos, sinabi ni Haring Hezekias at ng mga pinuno sa mga Levita na purihin si Yahweh gamit ang mga salita ni David at ni Asaf na tagakita[a]. Kaya nagpuri sila nang may kagalakan[b], at yumukod sila at sumamba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ayon sa mga salita ni David at ni Asaf na tagakita.”
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “hanggang sa kagalakan” o “tungo sa kagalakan”; ipinahihiwatig na ang kanilang pagpupuri ay may kasamang pagsasaya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: sinabi ... na
  rationale: Likas na paraan sa Tagalog upang ihayag ang isang tagubilin nang hindi pinatitindi bilang tahasang utos.
- source_word: הַמֶּלֶךְ וְהַשָּׂרִים
  choice: Haring Hezekias at ng mga pinuno
  rationale: Ang שׂרים ay tumutukoy sa mga pinuno o opisyal; malinaw at kasalukuyan ang “mga pinuno” sa konteksto.
- source_word: לְהַלֵּל לַיהוָה
  choice: purihin si Yahweh
  rationale: Tuwirang ipinapahayag ang liturhikal na pagpupuri at pinananatili ang pangalang tipan na יהוה.
- source_word: בְּדִבְרֵי דָוִיד וְאָסָף הַחֹזֶה
  choice: gamit ang mga salita ni David at ni Asaf na tagakita
  rationale: Pinananatili ang literal na “mga salita” at ang instrumental na diwa ng ב; hindi ito pinakikitid sa “mga awit.”
- source_word: הַחֹזֶה
  choice: tagakita
  rationale: Karaniwang salin sa Tagalog ng makasaysayang titulong propetiko na חֹזֶה.
- source_word: עַד לְשִׂמְחָה
  choice: nang may kagalakan
  rationale: Natural na Tagalog para sa diwa ng pagpuring may kasamang pagsasaya, habang itinatala sa talababa ang di-pangkaraniwang literal na anyo.
- source_word: וַיִּקְּדוּ וַיִּשְׁתַּחֲווּ
  choice: yumukod sila at sumamba
  rationale: 'Pinananatiling magkahiwalay ang dalawang pandiwa: ang kilos ng pagyukod at ang gawa ng pagsamba.'
theological_decisions:
- issue: Paglalapat ng banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang ginagamit ng Hebreo ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalang tipan.
- issue: Ugnayan ng dalawang huling kilos
  choice: yumukod sila at sumamba
  alternative: yumukod sila sa pagsamba
  rationale: Dalawang magkaugnay ngunit hiwalay na pandiwa ang nasa Hebreo, kaya hindi pinagsasanib ang mga ito sa iisang kilos.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “tagakita” bilang biblikal ngunit malinaw na titulong propetiko, at pinanatili ang tunay na kalabuan ng mga pariralang בְּדִבְרֵי at עַד לְשִׂמְחָה sa pamamagitan ng mga talababa.
