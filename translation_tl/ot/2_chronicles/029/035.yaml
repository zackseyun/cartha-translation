base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/035.yaml
  text: And the burnt offerings were also in abundance[a], with the fat of the peace offerings and the drink offerings for the burnt offerings. So the service of the house of Yahweh was established.
translation:
  language: tl
  text: Napakarami rin ng mga handog na sinusunog, kasama ang mga taba ng mga handog pangkapayapaan[a] at ang mga handog na inumin para sa mga handog na sinusunog. Kaya naisaayos ang paglilingkod sa bahay ni Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga handog para sa pakikisama.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: rin
  rationale: Ipinahahayag ang pandagdag na kaugnayan sa naunang talata sa natural na ayos ng pangungusap sa Tagalog.
- source_word: עֹלָה
  choice: mga handog na sinusunog
  rationale: Bagaman anyong isahan sa Hebreo, kolektibo ang gamit nito rito at tumutukoy sa maraming handog.
- source_word: לָרֹב
  choice: Napakarami
  rationale: Natural na Tagalog para sa diwang napakarami o sagana ang bilang.
- source_word: בְּחֶלְבֵי
  choice: kasama ang mga taba ng
  rationale: Ipinakikita ang pagsama ng mga bahaging taba na inihahandog sa ritwal.
- source_word: הַשְּׁלָמִים
  choice: mga handog pangkapayapaan
  rationale: Pinananatili ang kinikilalang kategorya ng handog nang hindi nililimitahan ang kahulugan sa pakikisama lamang.
- source_word: וּבַנְּסָכִים
  choice: at ang mga handog na inumin
  rationale: Malinaw na tumutukoy sa mga likidong ibinubuhos bilang handog.
- source_word: לָעֹלָה
  choice: para sa mga handog na sinusunog
  rationale: Ipinahahayag ang kaugnayan ng mga handog na inumin sa mga handog na sinusunog.
- source_word: וַתִּכּוֹן
  choice: naisaayos
  rationale: Sinasalamin ang resultang ang paglilingkod ay naihanda at nailagay sa wastong kaayusan; hindi tahasang nagdaragdag ng ideya ng pagpapanumbalik.
- source_word: עֲבוֹדַת בֵּית יְהוָה
  choice: ang paglilingkod sa bahay ni Yahweh
  rationale: Pinananatili ang kultikong kahulugan ng paglilingkod at ang malinaw na ugnayan nito sa bahay ni Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat ang personal na banal na pangalan sa halip na palitan ito ng isang titulo.
theological_decisions:
- issue: Pag-render sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo; pinananatili ito bilang Yahweh.
- issue: Kultikong terminong שְׁלָמִים
  choice: mga handog pangkapayapaan
  alternative: mga handog para sa pakikisama
  rationale: Pinananatili ng pangunahing salin ang tradisyonal at malawak na katawagan, habang inilalahad sa talababa ang lehitimong alternatibo nang hindi ipinipilit ang mas makitid na paliwanag.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang karaniwang bokabularyong panrelihiyon ngunit iniwasan ang lipas o labis na teknikal na pananalita.
