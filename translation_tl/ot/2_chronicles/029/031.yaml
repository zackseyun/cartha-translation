base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/031.yaml
  text: Then Hezekiah answered and said[a], “Now you have filled your hand for Yahweh. Come near and bring sacrifices and thank offerings to the house of Yahweh.” And the assembly brought sacrifices and thank offerings, and all who were willing of heart brought burnt offerings.
translation:
  language: tl
  text: Sumagot si Ezequias at sinabi, “Ngayon ay itinalaga na ninyo ang inyong sarili kay Yahweh.[a] Lumapit kayo at magdala ng mga hain at mga handog ng pasasalamat sa bahay ni Yahweh.” Nagdala ang kapulungan ng mga hain at mga handog ng pasasalamat, at lahat ng may kusang-loob ay nagdala ng mga handog na sinusunog.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa literal na Hebreo: “pinuno na ninyo ang inyong kamay para kay Yahweh,” isang idyoma para sa pagtatalaga o pagluklok sa banal na paglilingkod.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: sinabi
  rationale: Ang tambalang Hebreong pormula ay literal na ‘sumagot at nagsabi,’ ngunit walang binanggit na tanong o tuwirang kausap dito; ang payak na ‘sinabi’ ay natural sa modernong Tagalog at tumpak sa tungkuling pasalaysay.
- source_word: מִלֵּאתֶם יֶדְכֶם
  choice: itinalaga na ninyo ang inyong sarili
  rationale: Literal itong ‘pinuno ninyo ang inyong kamay,’ isang idyoma para sa pagtatalaga sa banal na paglilingkod. Isinalin ang kahulugan sa pangunahing teksto at inilagay ang literal na anyo sa talababa upang maiwasan ang malabong Tagalog.
- source_word: לַיהוָה
  choice: kay Yahweh
  rationale: Ipinahahayag ng ל ang patutunguhan o pinag-uukulan ng pagtatalaga; natural sa Tagalog ang ‘kay Yahweh.’
- source_word: גֹּשׁוּ
  choice: Lumapit kayo
  rationale: Pinananatili nito ang diwa ng paglapit para sa pagsamba, hindi lamang ng pangkalahatang pagpunta.
- source_word: זְבָחִים
  choice: mga handog na hain
  rationale: Tumutukoy sa mga haing kinakatay. Ang ‘handog na hain’ ay malinaw na kategoryang pangritwal sa Tagalog.
- source_word: תוֹדוֹת
  choice: mga handog ng pasasalamat
  rationale: Ipinakikita nito na ang tinutukoy ay mga haing inihahandog bilang pasasalamat, hindi basta mga pananalitang nagpapasalamat.
- source_word: לְבֵית יְהוָה
  choice: sa bahay ni Yahweh
  rationale: Pinananatili ang literal at teolohikal na makabuluhang Hebreong ekspresyong ‘bahay ni Yahweh’ sa halip na gawing ‘templo.’
- source_word: הַקָּהָל
  choice: ang kapulungan
  rationale: Natural at marangal na tawag sa nagkatipong sambayanan.
- source_word: כָל נְדִיב לֵב
  choice: ang lahat ng kusang-loob
  rationale: Ipinahahayag ang boluntaryong kahandaan ng kalooban sa natural na Tagalog nang hindi ipinapalagay na pananalaping pagkabukas-palad lamang ang tinutukoy.
- source_word: עֹלוֹת
  choice: mga handog na sinusunog
  rationale: Tumpak at madaling maunawaang katawagan para sa handog na sinusunog nang buo sa dambana.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Pangalan ng Diyos ang יהוה sa teksto; pinananatili ng ‘Yahweh’ ang personal na pangalang tipan nang hindi ito pinapalitan ng isang titulo.
- issue: Kahulugan ng idyomang מִלֵּאתֶם יֶדְכֶם
  choice: itinalaga na ninyo ang inyong sarili
  alternative: pinuno na ninyo ang inyong kamay
  rationale: Ang parirala ay pormula ng pagtatalaga para sa banal na paglilingkod. Ang pagsasalin ng idyomatikong kahulugan ay nauunawaan sa Tagalog, habang pinananatili sa talababa ang literal na larawan at ang saklaw ng kahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na natural, marangal, at angkop sa pampublikong pagbasa. Ginamit ang ‘Ezequias,’ ‘kapulungan,’ at mga malinaw na katawagang panghandog; iniwasan ang sobrang literal na idyomang hindi mauunawaan nang walang paliwanag.
