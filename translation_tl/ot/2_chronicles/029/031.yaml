revisions:
- from: Pagkatapos, sinabi ni Ezequias, “Ngayon ay itinalaga na ninyo ang inyong sarili kay Yahweh.[a] Lumapit kayo at magdala ng mga handog na hain at mga handog ng pasasalamat sa bahay ni Yahweh.” Kaya nagdala ang kapulungan ng mga handog na hain at mga handog ng pasasalamat, at ang lahat ng kusang-loob ay nagdala ng mga handog na sinusunog.
  to: Sumagot si Ezequias at sinabi, “Ngayon ay itinalaga na ninyo ang inyong sarili kay Yahweh.[a] Lumapit kayo at magdala ng mga hain at mga handog ng pasasalamat sa bahay ni Yahweh.” Nagdala ang kapulungan ng mga hain at mga handog ng pasasalamat, at lahat ng may kusang-loob ay nagdala ng mga handog na sinusunog.
  rationale: Ginawang mas malapit sa pinagmulan ang pambungad sa pamamagitan ng pagsasama ng ‘sumagot,’ at pinahusay ang naturalness at linaw ng mga katawagan para sa mga kusang naghandog at para sa mga hain. Hindi binago ang kahulugan ng idyoma, ang banal na pangalan, o ang mga kategorya ng handog.
