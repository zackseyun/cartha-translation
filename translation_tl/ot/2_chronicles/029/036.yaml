base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/036.yaml
  text: And Hezekiah rejoiced[a], and all the people, because God had prepared for the people, for the matter had happened suddenly.
translation:
  language: tl
  text: At nagalak si Hezekias, pati ang buong bayan, dahil sa inihanda ng Diyos para sa bayan,[a] sapagkat biglang nangyari ang bagay na ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “dahil inihanda ng Diyos ang bayan” o “dahil itinatag ito ng Diyos para sa bayan.”
    reason: Pinananatili ang posibleng mga pagbasa ng הֵכִין ... לָעָם at ang hindi binanggit na layon ng pandiwa.
lexical_decisions:
- source_word: וַיִּשְׂמַח
  choice: nagalak
  rationale: Ang שׂמח ay nagpapahayag ng tuwa o galak; ang “nagalak” ay natural at marangal sa salaysay.
- source_word: יְחִזְקִיָּהוּ
  choice: Hezekias
  rationale: Ginamit ang nakaugaliang anyo ng pangalan sa mga saling Tagalog.
- source_word: וְכָל הָעָם
  choice: pati ang buong bayan
  rationale: Ang עָם ay tumutukoy sa buong sambayanang kasangkot; ipinakikita ng “pati” na kasama silang nagalak.
- source_word: עַל
  choice: dahil sa
  rationale: Pagkatapos ng pandiwa ng pagkagalak, ipinakikilala ng עַל ang sanhi o dahilan ng galak.
- source_word: הֵכִין
  choice: inihanda
  rationale: Ang Hiphil ng כון ay maaaring mangahulugang maghanda, gawing handa, o magtatag. Ang “inihanda” ang pinakaangkop sa konteksto, habang pinananatili ang hindi tiyak na layon.
- source_word: הָאֱלֹהִים
  choice: Diyos
  rationale: Tumutukoy ito sa Diyos ng Israel.
- source_word: לָעָם
  choice: para sa bayan
  rationale: Pinananatili nito ang lamed bilang pahiwatig ng kapakinabangan o patutunguhan at iniiwasang ipalagay na ang bayan mismo ang tuwirang layon ng paghahanda.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala nito ang paliwanag kung bakit nagalak ang hari at ang bayan.
- source_word: בְּפִתְאֹם
  choice: biglang
  rationale: Malinaw at likas nitong ipinahahayag ang di-inaasahang bilis ng pangyayari.
- source_word: הָיָה הַדָּבָר
  choice: nangyari ang bagay na ito
  rationale: Pinananatili ng “bagay” ang malawak na saklaw ng דָּבָר, na tumutukoy sa kabuuang pangyayari sa konteksto.
theological_decisions:
- issue: Ang pagkilos ng Diyos sa paghahanda
  choice: inihanda ng Diyos para sa bayan
  alternative: inihanda ng Diyos ang bayan; itinatag ng Diyos ito para sa bayan
  rationale: Hindi tahasang binanggit sa Hebreo ang layon ng הֵכִין, at ang לָעָם ay maaaring magpahiwatig ng kapakinabangan o kaugnayan. Pinananatili ng pangunahing salin ang tunay na kalabuan at ang banal na pagkilos nang hindi ipinapalagay na ang bayan mismo ang tuwirang inihanda.
translation_notes:
  register: Makabagong Filipino na may marangal na himig sa salaysay. Ang “pati ang buong bayan” ay likas na nagpapakitang kapwa nagalak si Hezekias at ang bayan. Inilagay ang talababa pagkatapos ng pariralang may leksikal na kalabuan.
