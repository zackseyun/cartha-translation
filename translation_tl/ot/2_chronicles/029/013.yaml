base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/013.yaml
  text: and from the sons of Elizaphan[a], Shimri and Jeiel; and from the sons of Asaph[b], Zechariah and Mattaniah.
translation:
  language: tl
  text: at mula sa mga anak ni Elizafan[a], sina Simri at Jeuel[b]; at mula sa mga anak ni Asaf, sina Zacarias at Matanias.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “mga anak ni” sa Hebreo ay maaari ring tumukoy sa mas malawak na angkan o sa mga inapo, hindi lamang sa mga tuwirang anak.
    reason: lexical_alternative
  - marker: b
    text: Ang anyo ng pangalan sa Hebreo rito ay “Jeuel”; naiiba ito sa “Jeiel,” isang katulad na pangalang makikita sa ibang talata.
    reason: textual_clarity
lexical_decisions:
- source_word: וּמִן
  choice: at mula sa
  rationale: Pinananatili ang pang-ugnay at pang-ukol upang maipakita na karugtong ito ng naunang talaan.
- source_word: בְּנֵי
  choice: mga anak ni
  rationale: Ito ang tuwirang katumbas ng Hebreong idyoma, bagaman sa talaang angkan maaari rin itong tumukoy sa mga inapo o kasapi ng angkan.
- source_word: אֱלִיצָפָן
  choice: Elizafan
  rationale: Isinatinig ang pangalang Hebreo ayon sa karaniwang anyong Filipino.
- source_word: שִׁמְרִי
  choice: Simri
  rationale: Isinatinig ang pangalang pantangi sa likas na baybay Filipino.
- source_word: יעואל
  choice: Jeuel
  rationale: Ang mga katinig ng tekstong Hebreo rito ay sumusuporta sa anyong Jeuel, hindi Jeiel.
- source_word: בְּנֵי אָסָף
  choice: mga anak ni Asaf
  rationale: Pinananatili ang Hebreong pananalitang pang-angkan; maaaring si Asaf ang ninuno o pinuno ng pangkat.
- source_word: זְכַרְיָהוּ
  choice: Zacarias
  rationale: Ginamit ang kinikilalang tradisyonal na anyong Filipino ng pangalang Hebreo.
- source_word: מַתַּנְיָהוּ
  choice: Matanias
  rationale: Ginamit ang natural at nakikilalang anyong Filipino ng pangalang Hebreo.
