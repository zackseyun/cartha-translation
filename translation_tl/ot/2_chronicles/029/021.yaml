source:
  edition: WLC
  text: וַ/יָּבִ֣יאוּ פָרִים שִׁבְעָה֩ וְ/אֵילִ֨ים שִׁבְעָ֜ה וּ/כְבָשִׂ֣ים שִׁבְעָ֗ה וּ/צְפִירֵ֨י עִזִּ֤ים שִׁבְעָה֙ לְ/חַטָּ֔את עַל הַ/מַּמְלָכָ֥ה וְ/עַל הַ/מִּקְדָּ֖שׁ וְ/עַל יְהוּדָ֑ה וַ/יֹּ֗אמֶר לִ/בְנֵ֤י אַהֲרֹן֙ הַ/כֹּ֣הֲנִ֔ים לְ/הַעֲל֖וֹת עַל מִזְבַּ֥ח יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/021.yaml
  text: They brought seven bulls, seven rams, seven lambs, and seven male goats as a sin offering for the kingdom, for the sanctuary, and for Judah. And he told the sons of Aaron, the priests, to offer them on the altar of Yahweh.
translation:
  language: tl
  text: Nagdala sila ng pitong toro, pitong lalaking tupa, pitong kordero, at pitong lalaking kambing bilang handog para sa kasalanan, alang-alang sa kaharian, sa santuwaryo, at sa Juda. Sinabi niya sa mga anak ni Aaron, na mga pari, na ihandog ang mga iyon sa altar ni Yahweh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבִיאוּ
  choice: Nagdala sila
  rationale: Tuwirang salaysay ito ng pagdadala ng mga hayop na ihahandog; natural at hindi labis na interpretatibo ang “nagdala.”
- source_word: פָרִים
  choice: mga toro
  rationale: Sa konteksto ng paghahandog, tumutukoy ito sa mga lalaking baka; hindi tahasang tinutukoy ng anyo rito ang edad.
- source_word: אֵילִים
  choice: mga lalaking tupa
  rationale: Malinaw at pangkaraniwang katumbas ito ng mga adultong lalaking tupa sa kontekstong panghandog.
- source_word: כְבָשִׂים
  choice: mga kordero
  rationale: Ang “kordero” ay natural at kinikilalang tawag sa batang tupa, nang hindi nagdaragdag ng kasariang hindi kailangang tahasang ipahayag dito.
- source_word: צְפִירֵי עִזִּים
  choice: mga lalaking kambing
  rationale: Tahasang ipinahihiwatig ng parirala ang kasariang lalaki; malinaw ito sa modernong Tagalog.
- source_word: לְחַטָּאת
  choice: bilang handog para sa kasalanan
  rationale: Sa kontekstong kultiko, ang חַטָּאת ay pangalan ng isang uri ng handog, hindi lamang abstraktong “kasalanan.”
- source_word: עַל הַמַּמְלָכָה ... וְעַל הַמִּקְדָּשׁ וְעַל יְהוּדָה
  choice: alang-alang sa kaharian, sa santuwaryo, at sa Juda
  rationale: Ipinapahayag ng “alang-alang sa” ang kinatawan o kapakinabangang puwersa ng עַל sa kontekstong paghahandog.
- source_word: הַמִּקְדָּשׁ
  choice: santuwaryo
  rationale: Pinananatili nito ang diwang banal at kultiko ng מִקְדָּשׁ nang hindi agad pinapantay sa mas malawak na gusali ng templo.
- source_word: לִבְנֵי אַהֲרֹן הַכֹּהֲנִים
  choice: sa mga anak ni Aaron, na mga pari
  rationale: Pinananatili ang ugnayang pampamilya at ang kasunod na paglalarawan sa kanila bilang mga pari.
- source_word: לְהַעֲלוֹת
  choice: na ihandog ang mga iyon
  rationale: Sa gamit na pansakripisyo, ang עלה ay nangangahulugang ihandog sa altar; idinagdag ang likas na layong “ang mga iyon” mula sa malinaw na konteksto.
- source_word: מִזְבַּח יְהוָה
  choice: altar ni Yahweh
  rationale: Natural na Tagalog para sa construct phrase at pinananatili ang personal na pangalang banal.
theological_decisions:
- issue: Pagpapahayag sa pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Tahasang nasa Hebreong teksto ang Tetragrammaton; pinananatili ng “Yahweh” ang pangalang tipan nang hindi ito pinapalitan ng titulo.
- issue: Kahulugan ng חַטָּאת sa kontekstong pansakripisyo
  choice: handog para sa kasalanan
  alternative: handog na pambayad-sala
  rationale: Tinutukoy rito ang espesipikong uring handog. Iniiwasan ng napiling anyo ang pagpasok ng mas tiyak na paliwanag teolohiko kaysa sa sinasabi ng termino.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa pampublikong pagbasa. Ginamit ang “santuwaryo” at “kordero” bilang mga salitang pamilyar sa kontekstong biblikal ngunit nauunawaan pa rin ng karaniwang mambabasa.
