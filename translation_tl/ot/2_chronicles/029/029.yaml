base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/029.yaml
  text: And when they had finished offering[b][a], the king and all who were present with him knelt down and worshiped.
translation:
  language: tl
  text: Nang matapos nilang maghandog[a], lumuhod ang hari at ang lahat ng naroon kasama niya, at sumamba.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “nang matapos nilang ipaakyat.” Sa konteksto ng paghahandog, tumutukoy ito sa pagtatapos ng pag-aalay; ang handog na sinusunog ay ipinahihiwatig ng naunang konteksto.
    reason: lexical_alternative
  - marker: b
    text: O “yumukod” o “nagpatirapa.” Maaaring tukuyin ng pandiwang Hebreo ang pisikal na pagyukod bilang pagpipitagan; dito ay isinaling “sumamba” dahil sa konteksto ng templo at paghahandog.
    reason: alternative_reading
lexical_decisions:
- source_word: וּ/כְ/כַלּוֹת
  choice: Nang matapos nilang
  rationale: Ang pang-ugnay, pang-ukol, at infinitive construct ng כלה ay bumubuo ng sugnay na panahunan. Likas sa modernong Tagalog ang “Nang matapos nilang” at malinaw nitong ipinapakita ang pagkakasunod ng mga pangyayari.
- source_word: לְ/הַעֲל֑וֹת
  choice: ihandog ang handog na sinusunog
  rationale: Ang Hiphil infinitive ng עלה ay literal na “paakyatin,” ngunit sa konteksto ng paghahandog ay tumutukoy sa paghahandog ng handog na sinusunog. Bagaman hindi inuulit sa talata ang tahasang layon, malinaw ito mula sa agarang konteksto; nililinaw ito sa salin at itinatala sa talababa ang literal na anyo.
- source_word: כָּרְע֗וּ
  choice: lumuhod
  rationale: Ang כרע ay tumutukoy sa pagluhod o pagbaluktot ng tuhod. Pinananatili ng “lumuhod” ang pisikal na kilos at naihihiwalay ito sa kasunod na kilos ng pagsamba.
- source_word: הַ/מֶּ֛לֶךְ
  choice: ang hari
  rationale: Tuwirang salin ng tiyak na pangngalan.
- source_word: וְ/כָֽל הַ/נִּמְצְאִ֥ים אִתּ֖/וֹ
  choice: at ang lahat ng naroon na kasama niya
  rationale: Ang Niphal participle ng מצא ay idyomatikong tumutukoy sa mga naroon o dumalo. Ang pariralang ito ay malinaw at natural sa Tagalog habang pinananatili ang diwang “kasama niya.”
- source_word: וַ/יִּֽשְׁתַּחֲוֽוּ
  choice: at sumamba
  rationale: Ang anyo ng שחה ay maaaring tumukoy sa pagyukod o pagpapatirapa bilang pagpipitagan o pagsamba. Sa konteksto ng templo at paghahandog, ipinahahayag ng “sumamba” ang relihiyosong kabuluhan, samantalang naipahayag na ng “lumuhod” ang pisikal na tindig.
theological_decisions:
- issue: Pagpapakahulugan sa שחה sa konteksto ng pagsamba sa templo
  choice: sumamba
  alternative: yumukod / nagpatirapa
  rationale: Ang tugon ng hari at ng kapulungan sa pagtatapos ng paghahandog ay isang gawa ng pagsamba. Pinananatili ng “sumamba” ang liturhikal na puwersa ng teksto nang hindi itinatanggi ang pisikal na pagyukod o pagpapatirapa, na binabanggit bilang alternatibo sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa pagbasa sa banal na kasulatan. Ginamit ang “handog na sinusunog” bilang madaling maunawaang katawagan sa burnt offering; iniwasan ang mas teknikal o di-likas na pananalita. Ang dalawang pandiwa ay sadyang pinag-iba bilang “lumuhod” at “sumamba” upang mapanatili ang pisikal at panrelihiyong mga dimensiyon ng Hebreo.
