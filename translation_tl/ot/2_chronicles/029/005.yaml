source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר לָ/הֶ֖ם שְׁמָע֣וּ/נִי הַ/לְוִיִּ֑ם עַתָּ֣ה הִֽתְקַדְּשׁ֗וּ וְ/קַדְּשׁוּ֙ אֶת בֵּ֤ית יְהוָה֙ אֱלֹהֵ֣י אֲבֹתֵי/כֶ֔ם וְ/הוֹצִ֥יאוּ אֶת הַ/נִּדָּ֖ה מִן הַ/קֹּֽדֶשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/005.yaml
  text: And he said to them[a], “Listen to me, Levites. Now consecrate yourselves, and consecrate the house of Yahweh, the God of your fathers[b], and remove the uncleanness from the holy place.”
translation:
  language: tl
  text: At sinabi niya sa kanila, “Makinig kayo sa akin, mga Levita. Ngayon, italaga ninyo ang inyong mga sarili, at italaga rin ninyo ang bahay ni Yahweh, ang Diyos ng inyong mga ninuno. Alisin ninyo ang karumihan[a] mula sa banal na lugar[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang dumi”; tumutukoy ang salitang Hebreo sa karumihang nagpaparumi sa santuwaryo.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “mula sa santuwaryo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁמָעוּנִי
  choice: Makinig kayo sa akin
  rationale: Likas at tuwirang salin ng pautos na may hulaping unang panauhan; pinananatili nito ang mariing panawagan ni Hezekias.
- source_word: הַלְוִיִּם
  choice: mga Levita
  rationale: Karaniwang katawagan sa Filipino para sa pangkat na Levitico na tuwirang kinakausap.
- source_word: עַתָּה
  choice: Ngayon
  rationale: Pinananatili ang panandang temporal at ang diwa ng agarang pagkilos nang hindi dinaragdagan ang tindi nito.
- source_word: הִתְקַדְּשׁוּ / וְקַדְּשׁוּ
  choice: italaga ninyo ang inyong sarili / italaga rin ninyo
  rationale: Iisang salitang-ugat sa Filipino ang ginamit upang katawanin ang pag-uulit ng קדשׁ. Sa konteksto, ang pagtatalaga ay banal at panseremonyang paghahanda, hindi lamang pangkalahatang pag-aalay ng panahon o kakayahan.
- source_word: בֵּית יְהוָה
  choice: bahay ni Yahweh
  rationale: Pinananatili ang literal at teolohikal na makabuluhang larawang 'bahay' sa halip na agad itong gawing 'templo.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ang personal na pangalang banal na nasa tekstong Hebreo, sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֵי אֲבֹתֵיכֶם
  choice: ang Diyos ng inyong mga ninuno
  rationale: Ang 'mga ninuno' ay natural sa makabagong Filipino at saklaw ang Hebreong אָבוֹת bilang mga ama o mga ninuno sa kasaysayan ng tipan.
- source_word: וְהוֹצִיאוּ
  choice: Alisin ninyo
  rationale: Malinaw at natural na ipinahahayag ang causative na diwa ng pagpapalabas o pag-aalis sa loob ng santuwaryo.
- source_word: הַנִּדָּה
  choice: ang karumihan
  rationale: Ipinahahayag ang bagay o kalagayang nagpaparumi sa santuwaryo; hindi nito nililimitahan ang kahulugan sa pisikal na dumi lamang.
- source_word: מִן הַקֹּדֶשׁ
  choice: mula sa banal na lugar
  rationale: Pinananatili ang konkretong panlugar na kahulugan ng קֹדֶשׁ sa kontekstong ito, habang kinikilala sa talababa ang posibleng 'santuwaryo.'
theological_decisions:
- issue: Pagbibigay-kahulugan sa banal na pagtatalaga sa קדשׁ
  choice: italaga ... italaga
  alternative: pakabanalin ... pabanalin
  rationale: Pinananatili ng 'italaga' ang panseremonyang diwa sa paglilinis ng templo at iniiwasang ipakahulugan ang unang utos bilang moral na pagpapakabuti lamang. Ang pag-uulit ay sumasalamin din sa magkaugnay na mga pandiwang Hebreo.
- issue: Pag-render sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Personal na pangalan ang nasa tekstong Hebreo; ang transliterasyong 'Yahweh' ay hindi nagpapalit dito ng titulong wala sa mismong talata.
- issue: Saklaw ng אֲבֹתֵיכֶם
  choice: inyong mga ninuno
  alternative: inyong mga ama
  rationale: Sa pormulang pangkasaysayan at pangtipan, maaaring tumukoy ang אָבוֹת sa mga naunang salinlahi. Pinananatili ng 'mga ninuno' ang saklaw na iyon nang hindi nilulutas ito bilang mga agarang ama lamang.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mga Levita,” “bahay ni Yahweh,” at “banal na lugar” upang mapanatili ang bokabularyong panseremonya nang hindi nagiging lipas o labis na teknikal. Inilipat ang mga pananda ng talababa sa mismong mga salitang tinutukoy ng bawat tala.
