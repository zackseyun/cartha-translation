  text: גַּ֣ם סָֽגְר֞וּ דַּלְת֣וֹת הָ/אוּלָ֗ם וַ/יְכַבּוּ֙ אֶת הַ/נֵּר֔וֹת וּ/קְטֹ֖רֶת לֹ֣א הִקְטִ֑ירוּ וְ/עֹלָה֙ לֹא הֶעֱל֣וּ בַ/קֹּ֔דֶשׁ לֵ/אלֹהֵ֖י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/007.yaml
  text: They also shut the doors of the vestibule[a], put out the lamps, did not burn incense[b], and did not offer up burnt offerings in the sanctuary to the God of Israel.
translation:
  language: tl
  text: Isinara rin nila ang mga pinto ng bulwagan sa pasukan[a], pinatay ang mga ilawan, hindi nagsunog ng insenso, at hindi naghandog ng handog na sinusunog sa santuwaryo[b] sa Diyos ng Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “bulwagan sa harapan” o “pasilyong pasukan”; ang salitang Hebreo ay tumutukoy sa bulwagan sa pasukan ng templo.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “banal na dako”; maaaring tumukoy ang salitang Hebreo sa sagradong lugar ng templo.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: rin
  rationale: Ipinagdurugtong nito ang mga pagkukulang dito sa mga naunang paratang at pinananatili ang naiipong diin ng talata.
- source_word: סָגְרוּ
  choice: isinara
  rationale: Ito ang likas at tuwirang salin kapag mga pinto ang layon.
- source_word: דַּלְתוֹת הָאוּלָם
  choice: mga pinto ng bulwagan sa pasukan
  rationale: Ang אוּלָם ay ang bulwagan o bahaging pasukan ng templo; malinaw ito sa karaniwang mambabasang Filipino nang hindi ginagamit ang posibleng nakalilitong 'beranda.'
- source_word: וַיְכַבּוּ אֶת הַנֵּרוֹת
  choice: pinatay ang mga ilawan
  rationale: Tumutukoy ito sa pagpuksa sa apoy ng mga ilawang ginagamit sa paglilingkod sa templo; natural at kongkreto ang 'pinatay ang mga ilawan.'
- source_word: וּקְטֹרֶת לֹא הִקְטִירוּ
  choice: hindi nagsunog ng insenso
  rationale: Ang Hiphil ng קטר kasama ng קְטֹרֶת ay tumutukoy sa rituwal na pagsusunog o paghahandog ng insenso.
- source_word: וְעֹלָה לֹא הֶעֱלוּ
  choice: hindi naghandog ng handog na sinusunog
  rationale: Pinananatili ng 'handog na sinusunog' ang teknikal na kahulugan ng עֹלָה bilang handog na lubusang sinusunog, habang ipinahahayag ng 'naghandog' ang sakripisyal na gamit ng pandiwa.
- source_word: בַקֹּדֶשׁ
  choice: sa santuwaryo
  rationale: Tumutukoy ang termino sa sagradong lugar ng paglilingkod sa templo; ang 'santuwaryo' ay malinaw ngunit hindi labis na tumutukoy sa isang mas makitid na bahagi nito.
- source_word: לֵאלֹהֵי יִשְׂרָאֵל
  choice: para sa Diyos ng Israel
  rationale: Ipinahahayag ng 'para sa' ang pag-aalay at pagtatalaga ng handog sa Diyos ng Israel nang natural sa Filipino.
theological_decisions:
- issue: Mga terminong kaugnay ng pagsamba sa templo
  choice: 'Panatilihin ang tiyak at kongkretong wika ng paglilingkod sa templo: ''nagsunog ng insenso,'' ''handog na sinusunog,'' at ''santuwaryo.'''
  alternative: Gumamit ng mas pangkalahatang pananalita gaya ng 'sumamba' o 'nag-alay.'
  rationale: Inililista ng talata ang mga partikular na pagpapabaya sa paglilingkod sa templo, hindi lamang ang pangkalahatang kawalan ng pagsamba. Pinananatili ng mga tiyak na termino ang historikal at teolohikal na diwa ng teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang mga konkretong terminong pangtemplo, ngunit iniwasan ang lubhang teknikal o makalumang pananalita. Inilipat ang panandang [b] sa 'santuwaryo,' sapagkat iyon ang salitang tinutukoy ng kaukulang talang leksikal.
