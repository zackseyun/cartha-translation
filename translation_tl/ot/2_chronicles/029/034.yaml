revisions:
- from: Ngunit kulang sa bilang ang mga pari, kaya hindi nila kayang balatan ang lahat ng handog na sinusunog. Tinulungan[a] sila ng mga kapatid nilang Levita hanggang sa matapos ang gawain at hanggang sa maitalaga ng mga pari ang kanilang sarili. Sapagkat mas tapat ang puso[b] ng mga Levita sa pagtatalaga ng kanilang sarili kaysa sa mga pari.
  to: Ngunit kulang ang bilang ng mga pari, at hindi nila kayang balatan ang lahat ng handog na sinusunog nang buo. Kaya inalalayan[a] sila ng mga kapatid nilang Levita hanggang sa matapos ang gawain at hanggang sa italaga ng mga pari ang kanilang sarili. Sapagkat mas matuwid ang kalooban[b] ng mga Levita sa pagtalaga ng kanilang sarili kaysa sa mga pari.
  rationale: Nilinaw ang reflexive na ritwal na pagtalaga ng mga pari, ginawang mas idiomatiko ang Hebreong idyoma tungkol sa puso/kalooban, at ipinakita sa teksto ang katangiang ganap na sinusunog ng עֹלָה. Nananatiling tahasan ngunit di-pinalalawak ang lokal na paghahambing ng mga Levita at mga pari.
  reviewer_model: gpt-5.6-terra
