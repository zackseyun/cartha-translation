  text: רַ֤ק הַ/כֹּֽהֲנִים֙ הָי֣וּ לִ/מְעָ֔ט וְ/לֹ֣א יָֽכְל֔וּ לְ/הַפְשִׁ֖יט אֶת כָּל הָ/עֹל֑וֹת וַֽ/יְּחַזְּק֞וּ/ם אֲחֵי/הֶ֣ם הַ/לְוִיִּ֗ם עַד כְּל֤וֹת הַ/מְּלָאכָה֙ וְ/עַ֣ד יִתְקַדְּשׁ֣וּ הַ/כֹּֽהֲנִ֔ים כִּ֤י הַ/לְוִיִּם֙ יִשְׁרֵ֣י לֵבָ֔ב לְ/הִתְקַדֵּ֖שׁ מֵֽ/הַ/כֹּהֲנִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/034.yaml
  text: Only the priests were too few[a], and they were not able to skin all the burnt offerings, so their brothers the Levites supported them until the work was finished and until the priests had consecrated themselves[b]. For the Levites were more upright in heart to consecrate themselves than the priests.
translation:
  language: tl
  text: Ngunit kulang ang bilang ng mga pari, at hindi nila kayang balatan ang lahat ng handog na sinusunog nang buo. Kaya inalalayan[a] sila ng mga kapatid nilang Levita hanggang sa matapos ang gawain at hanggang sa italaga ng mga pari ang kanilang sarili. Sapagkat mas matuwid ang kalooban[b] ng mga Levita sa pagtalaga ng kanilang sarili kaysa sa mga pari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “pinalakas.” Maaari ring isaling “tinulungan” o “inalalayan.”
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “mas matuwid ang puso.” Maaari ring isaling “mas tapat ang kalooban” o “mas taos-puso.”
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: Ngunit
  rationale: Naghuhudyat ito rito ng paglilimita o pagsalungat sa naunang salaysay. Likas sa Tagalog ang “Ngunit” bilang panimula ng paliwanag tungkol sa kakulangan ng mga pari.
- source_word: הַכֹּהֲנִים הָיוּ לִמְעָט
  choice: kulang sa bilang ang mga pari
  rationale: Ipinahihiwatig ng parirala hindi lamang na kakaunti sila kundi hindi sapat ang kanilang bilang para sa gawain.
- source_word: לְהַפְשִׁיט
  choice: balatan
  rationale: Tumutukoy sa pag-aalis ng balat ng mga hayop na ihahandog; malinaw at karaniwan ang “balatan” sa modernong Tagalog.
- source_word: הָעֹלוֹת
  choice: mga handog na sinusunog
  rationale: Likas at malinaw na salin ng terminong panghandog na tumutukoy sa handog na sinusunog nang buo.
- source_word: וַיְחַזְּקוּם
  choice: Tinulungan sila
  rationale: Literal na may diwang “pinalakas sila,” ngunit sa konteksto ay praktikal na pag-alalay sa gawain. Pinananatili sa talababa ang literal na larawan.
- source_word: אֲחֵיהֶם הַלְוִיִּם
  choice: mga kapatid nilang Levita
  rationale: Pinananatili ang katawagang pampamilya na “mga kapatid” at malinaw na tinutukoy ang mga Levita.
- source_word: עַד כְּלוֹת הַמְּלָאכָה
  choice: hanggang sa matapos ang gawain
  rationale: Tumpak at natural na ipinapahayag ang pagpapatuloy ng tulong hanggang sa makumpleto ang gawain.
- source_word: יִתְקַדְּשׁוּ / לְהִתְקַדֵּשׁ
  choice: maitalaga ang kanilang sarili / pagtatalaga ng kanilang sarili
  rationale: Sa konteksto ng templo, tumutukoy ito sa ritwal na paghahanda at pagtatalaga ng sarili para sa banal na paglilingkod.
- source_word: יִשְׁרֵי לֵבָב
  choice: mas tapat ang puso
  rationale: Ipinahahayag nito ang panloob na katapatan o katuwiran. Ang “mas” ay nagpapanatili sa paghahambing na ipinahihiwatig ng kasunod na מִן.
theological_decisions:
- issue: Paghahambing sa mga Levita at mga pari
  choice: Mas tapat ang puso ng mga Levita sa pagtatalaga ng kanilang sarili kaysa sa mga pari.
  alternative: Mas mabilis o mas masigasig na nagtalaga ng kanilang sarili ang mga Levita kaysa sa mga pari.
  rationale: Binibigyang-diin ng יִשְׁרֵי לֵבָב ang katapatan o katuwiran ng kalooban, hindi lamang ang bilis o kahandaan. Pinananatili ang tahasang paghahambing nang hindi pinalalawak ito bilang pangkalahatang paghatol sa lahat ng pari.
translation_notes:
  register: Modernong Filipino Tagalog na dignified ngunit madaling maunawaan. Ginamit ang likas na ayos ng pangungusap at malinaw na bokabularyong panghandog, habang pinananatili sa mga talababa ang literal na larawan at tunay na saklaw ng mga alternatibong salita.
