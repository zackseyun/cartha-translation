base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/001.yaml
  text: Hezekiah became king when he was twenty-five years old, and he reigned twenty-nine years in Jerusalem. His mother’s name was Abijah daughter of Zechariah.
translation:
  language: tl
  text: Dalawampu't limang taong gulang si Hezekias nang maging hari siya, at dalawampu't siyam na taon siyang naghari sa Jerusalem. Ang kanyang ina ay si Abias, anak na babae ni Zacarias.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְחִזְקִיָּהוּ
  choice: Hezekias
  rationale: Ginamit ang nakasanayang anyo ng pangalang biblikal sa modernong Tagalog, sa halip na isalin ang kahulugan ng pangalan.
- source_word: מָלַךְ
  choice: maging hari
  rationale: Ang unang paglitaw ay tumutukoy sa pagluklok o pagsisimula niya bilang hari; natural itong ipinahahayag sa Tagalog bilang “maging hari.”
- source_word: בֶּן עֶשְׂרִים וְחָמֵשׁ שָׁנָה
  choice: Dalawampu't limang taong gulang
  rationale: Idyomang Hebreo ito para sa edad, kaya ginamit ang likas na katumbas sa Tagalog.
- source_word: וְעֶשְׂרִים וָתֵשַׁע שָׁנָה
  choice: dalawampu't siyam na taon
  rationale: Tuwirang ipinahahayag ang tagal ng paghahari.
- source_word: מָלַךְ
  choice: naghari
  rationale: Ang ikalawang paglitaw ay tumutukoy sa tagal ng kanyang pamamahala, kaya “naghari” ang angkop na pandiwa.
- source_word: בִּירוּשָׁלִָם
  choice: sa Jerusalem
  rationale: Pinananatili ang lugar bilang luklukan ng kanyang paghahari.
- source_word: וְשֵׁם אִמּוֹ
  choice: Ang pangalan ng kanyang ina ay
  rationale: Natural at malinaw na Tagalog para sa karaniwang pormulang biyograpikal sa Hebreo.
- source_word: אֲבִיָּה
  choice: Abias
  rationale: Ginamit ang tradisyonal at madaling makilalang anyo ng pangalan sa Tagalog.
- source_word: בַּת
  choice: anak ni
  rationale: Sa kontekstong genealogical, malinaw nang tumutukoy ito sa pagiging anak na babae dahil si Abias ang ina; mas natural sa Tagalog ang “anak ni.”
- source_word: זְכַרְיָהוּ
  choice: Zacarias
  rationale: Ginamit ang nakasanayang anyo ng pangalang biblikal sa Tagalog.
