  naturalness: Natural at angkop sa modernong Filipino Tagalog ang pangkalahatang daloy. Mas tuwiran at natural ang “Ang kanyang ina ay si Abias, anak na babae ni Zacarias” kaysa sa “Ang pangalan ng kanyang ina ay Abias, na anak ni Zacarias,” habang pinananatili ang impormasyong nasa Hebreo.
