  text: וַ/יְהִ֞י מִסְפַּ֣ר הָ/עֹלָה֮ אֲשֶׁ֣ר הֵבִ֣יאוּ הַ/קָּהָל֒ בָּקָ֣ר שִׁבְעִ֔ים אֵילִ֥ים מֵאָ֖ה כְּבָשִׂ֣ים מָאתָ֑יִם לְ/עֹלָ֥ה לַ/יהוָ֖ה כָּל אֵֽלֶּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/032.yaml
  text: And the number of the burnt offerings that the assembly brought was seventy cattle, one hundred rams, and two hundred lambs; all these were for a burnt offering to the LORD.
translation:
  language: tl
  text: Ang bilang ng mga handog na sinusunog na dinala ng kapulungan ay pitumpung baka, isandaang lalaking tupa, at dalawang daang batang tupa. Ang lahat ng ito ay handog na sinusunog para sa PANGINOON.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָעֹלָה / לְעֹלָה
  choice: mga handog na sinusunog / handog na sinusunog
  rationale: Ipinahahayag ang pangunahing diwa ng עֹלָה bilang handog na lubusang sinusunog, sa natural at madaling maunawaang modernong Tagalog.
- source_word: הַקָּהָל
  choice: kapulungan
  rationale: Tumutukoy sa nagkakatipong sambayanan bilang isang kolektibong pangkat at angkop sa marangal na rehistro ng salaysay.
- source_word: בָּקָר
  choice: baka
  rationale: Ang terminong Hebreo ay pangkalahatang tumutukoy sa mga bovine o cattle at hindi tahasang nililimitahan sa mga toro; pinananatili ng “baka” ang lawak nito.
- source_word: אֵילִים
  choice: lalaking tupa
  rationale: Tiyak na tinutukoy ng salita ang mga adultong lalaking tupa; mas malinaw ito sa ordinaryong mambabasa kaysa sa hiram o teknikal na termino.
- source_word: כְּבָשִׂים
  choice: batang tupa
  rationale: Natural na salin para sa mga kordero o batang tupa sa konteksto ng paghahandog.
- source_word: לַיהוָה
  choice: para sa PANGINOON
  rationale: Sinusunod ang nakaugaliang saling Tagalog para sa banal na pangalang YHWH, gamit ang malalaking titik upang maipakita ang pagkakaiba nito sa karaniwang titulong “Panginoon.”
theological_decisions:
- issue: Pagkakakilanlan ng pitumpung בָּקָר
  choice: baka
  alternative: mga toro
  rationale: Hindi tinutukoy ng anyong Hebreo sa talatang ito ang kasarian; kaya hindi idinaragdag ang higit na tiyak na “mga toro,” kahit maaaring ganoon ang mga hayop ayon sa mas malawak na kontekstong panghandog.
- issue: Paglalahad sa banal na pangalang יהוה
  choice: PANGINOON
  alternative: Yahweh
  rationale: Pinananatili ang tradisyonal at malawak na nauunawaang representasyon ng Tetragrammaton nang hindi nagtatakda ng isang pinagtatalunang rekonstruksiyon ng bigkas.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa pampublikong pagbasa. Ginamit ang “kapulungan” at “handog na sinusunog” bilang pormal ngunit madaling maunawaang mga parirala; walang kinakailangang talababa.
