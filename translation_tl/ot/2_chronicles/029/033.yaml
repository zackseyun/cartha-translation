  text: And the consecrated offerings were six hundred cattle and three thousand sheep[a][b].
translation:
  language: tl
  text: At ang mga handog na itinalaga ay animnaraang baka at tatlong libong tupa[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “ang mga banal na bagay”; ibig sabihin, mga hayop na ibinukod bilang mga banal na handog.
    reason: lexical_alternative
  - marker: b
    text: Ang salitang Hebreo na צֹאן ay maaaring tumukoy sa mga hayop ng kawan sa pangkalahatan, kabilang ang mga tupa at kambing.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַקֳּדָשִׁים
  choice: At ang mga handog na itinalaga
  rationale: Sa konteksto ng paglilingkod sa templo at ng kasunod na talaan ng mga hayop, ang pangmaramihang anyo ay tumutukoy sa mga bagay na ibinukod para sa banal na paghahandog. Natural sa modernong Tagalog ang “mga handog na itinalaga,” habang ipinapaliwanag sa talababa ang mas literal na anyo.
- source_word: בָּקָר
  choice: baka
  rationale: Kolektibong tawag ito sa mga bovine at hindi tiyak sa kasarian o gamit; ang “baka” ang karaniwan at sapat na malawak na salin.
- source_word: שֵׁשׁ מֵאוֹת
  choice: animnaraan
  rationale: Tuwirang salin ng bilang na anim na raan.
- source_word: וְצֹאן
  choice: at tatlong libong tupa
  rationale: Ang צֹאן ay kolektibong tawag sa maliliit na alagang hayop ng kawan at maaaring sumaklaw sa tupa at kambing. Ginamit ang natural na “tupa” sa pangunahing teksto, ngunit pinanatili sa talababa ang mas malawak na kahulugan.
- source_word: שְׁלֹשֶׁת אֲלָפִים
  choice: tatlong libo
  rationale: Tuwirang salin ng bilang na tatlong libo.
