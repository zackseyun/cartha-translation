  source_fidelity: 'Tumpak na naipapakita ng salin ang dalawang pangkat sa Hebreo: mula sa mga anak ni Heman ay Jehuel at Shimei, at mula sa mga anak ni Jedutun ay Shemaya at Uziel. Napanatili ang pandugtong na וְ sa pambungad at sa loob ng talaan. Ang “mga anak ni” ay tuwiran at angkop sa ganitong talaang pampamilya o pangkat.'
