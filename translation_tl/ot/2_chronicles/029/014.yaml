base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/014.yaml
  text: 'And from the sons of Heman: Jehuel and Shimei[a]; and from the sons of Jeduthun: Shemaiah and Uzziel.'
translation:
  language: tl
  text: 'At mula sa mga anak ni Heman: sina Jehuel[a] at Shimei; at mula sa mga anak ni Jedutun: sina Shemaya at Uziel.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Jehuel ay maaari ring baybayin na Jahiel sa ilang tradisyon ng pagsasalin.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִן
  choice: At mula sa
  rationale: Pinananatili ng “At” ang pandugtong at pandagdag na daloy ng talaan mula sa naunang talata.
- source_word: בְּנֵי
  choice: mga anak ni
  rationale: Ito ang tuwiran at malinaw na katumbas sa talaang angkan; maaari rin nitong tukuyin ang mga kabilang sa linya ng pamilya o pangkat.
- source_word: הֵימָן
  choice: Heman
  rationale: Isinalin sa anyong transliterasyon na karaniwan at madaling makilala sa Filipino.
- source_word: יחואל
  choice: Jehuel
  rationale: Transliterasyon ng pangalang Hebreo; pinananatili ang anyong gamit sa konsultasyong salin, habang itinatala sa talababa ang ibang posibleng anyo.
- source_word: וְשִׁמְעִי
  choice: at Shimei
  rationale: Pinananatili ang pang-ugnay upang maipakita ang ayos ng talaan, at tinatranslitera ang pangalan.
- source_word: יְדוּתוּן
  choice: Jedutun
  rationale: Transliterasyong angkop sa baybay at bigkas ng modernong Filipino.
- source_word: שְׁמַעְיָה
  choice: Shemaya
  rationale: Transliterasyong malapit sa anyong Hebreo at natural basahin sa Filipino.
- source_word: וְעֻזִּיאֵל
  choice: at Uziel
  rationale: Pinananatili ang pang-ugnay sa huling pangalan at gumagamit ng transliterasyong natural sa Filipino.
