  text: Then he brought in the priests and the Levites and assembled them in the eastern square[a].
translation:
  language: tl
  text: Pagkatapos, pinapunta niya ang mga pari at ang mga Levita at tinipon sila sa liwasan sa silangan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa silangang liwasan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֵא
  choice: ipinatawag niya
  rationale: Ang Hiphil ng בוא ay causative, ‘pinapunta/pinaroon’ o ‘dinala.’ Sa konteksto ng pagtitipon ng mga tauhan, natural sa Filipino ang ‘ipinatawag,’ nang hindi ipinapalagay na siya mismo ang pisikal na naghatid sa kanila.
- source_word: הַכֹּהֲנִים
  choice: ang mga pari
  rationale: Karaniwang salin ng כהנים at malinaw sa modernong Filipino.
- source_word: הַלְוִיִּם
  choice: ang mga Levita
  rationale: Karaniwang katawagan sa mga kasapi ng lipi ni Levi na may tungkulin sa paglilingkod sa templo, at pinananatili ang pagkakaiba nila sa mga pari.
- source_word: וַיַּאַסְפֵם
  choice: tinipon sila
  rationale: Tuwirang ipinahahayag ang kahulugan ng אסף na ‘tipunin’ at ang hulaping tumutukoy sa kanila.
- source_word: לִרְחוֹב
  choice: sa liwasan
  rationale: Ang רחוב ay maluwang at bukás na pook o plaza; ang ‘liwasan’ ay natural at tiyak na katumbas sa Filipino.
- source_word: הַמִּזְרָח
  choice: sa silangan
  rationale: Ipinahahayag ang lokasyon ng liwasan sa dakong silangan habang pinananatili ang posibleng ugnayan ng dalawang pangngalan sa Hebreo.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang ‘Pagkatapos’ para sa tuloy-tuloy na salaysay, ‘ipinatawag’ para sa causative na kilos, at ‘liwasan’ para sa maluwang na pampublikong pook. Pinanatili sa talababa ang alternatibong pagbasa sa ugnayan ng ‘liwasan’ at ‘silangan.’
