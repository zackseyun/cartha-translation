translation_notes:
  register: Modernong Filipino na may marangal ngunit payak na himig. Ginamit ang “altar,” na malawak na nauunawaan sa Filipino, at iniwasan ang mas teknikal o makalumang mga pananalita. Inilagay ang mga talababa sa mismong salitang o pariralang kanilang nililinaw.
