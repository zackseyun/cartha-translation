  to: Pagkatapos, kinatay nila ang mga baka[a], at tinanggap ng mga pari ang dugo at isinaboy[b] iyon sa altar. Kinatay nila ang mga lalaking tupa at isinaboy ang dugo sa altar. Kinatay nila ang mga kordero at isinaboy ang dugo sa altar.
