base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/022.yaml
  text: Then they slaughtered the cattle[a], and the priests received the blood and splashed it against the altar. They slaughtered the rams and splashed the blood against the altar[b]. They slaughtered the lambs and splashed the blood against the altar.
translation:
  language: tl
  text: Pagkatapos, kinatay nila ang mga baka[a], at tinanggap ng mga pari ang dugo at isinaboy[b] iyon sa altar. Kinatay nila ang mga lalaking tupa at isinaboy ang dugo sa altar. Kinatay nila ang mga kordero at isinaboy ang dugo sa altar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Hebreo ay kolektibong tawag sa mga hayop na baka. Maaari rin itong isaling “mga toro” ayon sa konteksto ng paghahandog, ngunit hindi tahasang tinutukoy ng salitang Hebreo ang kasarian ng mga hayop.
    reason: lexical_alternative
  - marker: b
    text: O “itinapon laban sa altar” o “isinaboy laban sa altar.” Ang pandiwang Hebreo ay tumutukoy sa mariing ritwal na paglalapat ng dugo, hindi sa marahang pagwiwisik.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁחֲטוּ
  choice: kinatay nila
  rationale: Sa konteksto ng paghahandog, ang שׁחט ay ritwal na pagkatay, hindi basta pagpatay lamang. Likas at tiyak sa Filipino ang “kinatay.”
- source_word: הַבָּקָר
  choice: mga baka
  rationale: Kolektibong tawag ang בָּקָר sa mga bovine na hayop. Hindi nito tahasang nililimitahan ang mga ito sa mga toro.
- source_word: וַיְקַבְּלוּ
  choice: tinanggap
  rationale: Pangunahing diwa ng קבל ang pagtanggap. Pinananatili nito ang paglalarawan sa tungkulin ng mga pari nang hindi nagdaragdag ng detalyeng wala sa teksto.
- source_word: הַכֹּהֲנִים
  choice: mga pari
  rationale: Karaniwan at malinaw na katumbas ng כֹּהֲנִים sa modernong Filipino.
- source_word: הַדָּם
  choice: ang dugo
  rationale: Tuwiran at likas na salin ng דָּם sa konteksto ng paghahandog.
- source_word: וַיִּזְרְקוּ
  choice: isinaboy
  rationale: Sa ritwal ng paghahandog, ang זרק ay tumutukoy sa paghagis o mariing paglalapat ng dugo. Mas angkop ang “isinaboy” kaysa “iwinisik,” na maaaring magpahiwatig ng marahan at pinong pagwiwisik.
- source_word: הַמִּזְבֵּחָה
  choice: sa altar
  rationale: Ipinahihiwatig ng anyong paturol ang galaw patungo sa altar, at sa konteksto ay ang paglalapat ng dugo sa ibabaw o tagiliran nito. Natural sa Filipino ang “sa altar.”
- source_word: הָאֵלִים
  choice: mga lalaking tupa
  rationale: Tiyak na tumutukoy ang אֵילִים sa mga ram; “mga lalaking tupa” ang malinaw na karaniwang salin sa Filipino.
- source_word: הַכְּבָשִׂים
  choice: mga batang tupa
  rationale: Sa mga talaan ng handog, karaniwang tumutukoy ang כְּבָשִׂים sa mga kordero o batang tupa. Mas madaling maunawaan ng pangkalahatang mambabasa ang “mga batang tupa.”
