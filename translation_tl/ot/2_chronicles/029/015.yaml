source:
  edition: WLC
  text: וַ/יַּֽאַסְפ֤וּ אֶת אֲחֵי/הֶם֙ וַ/יִּֽתְקַדְּשׁ֔וּ וַ/יָּבֹ֥אוּ כְ/מִצְוַת הַ/מֶּ֖לֶךְ בְּ/דִבְרֵ֣י יְהוָ֑ה לְ/טַהֵ֖ר בֵּ֥ית יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/015.yaml
  text: They gathered their brothers[a], consecrated themselves, and came, according to the command of the king by the words of Yahweh[c][b], to cleanse the house of Yahweh.
translation:
  language: tl
  text: Tinipon nila ang kanilang mga kapatid, nagpakabanal sila, at dumating sila ayon sa utos ng hari, alinsunod sa mga salita ni Yahweh,[a] upang linisin ang bahay ni Yahweh.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mas literal, “sa pamamagitan ng mga salita ni Yahweh.” Maaaring tumukoy ang parirala sa utos ng hari o sa pagkilos ng mga Levita.
    reason: Pinananatili ang sintaktikong kalabuan ng בְּדִבְרֵי יְהוָה at itinatala ang mas literal na anyo nito.
  - marker: b
    text: Ang “bahay ni Yahweh” ay ang templo.
    reason: Nililinaw ang literal na katawagang Hebreo nang hindi ito pinapalitan sa pangunahing teksto.
lexical_decisions:
- source_word: וַיַּאַסְפוּ
  choice: Tinipon nila
  rationale: Tuwirang ipinapahayag ang aktibong diwa ng אסף na ‘tipunin’ o ‘buuin sa isang lugar,’ at natural ito sa modernong Tagalog.
- source_word: אֲחֵיהֶם
  choice: ang kanilang mga kapatid
  rationale: Pinananatili ang literal na pananalitang pangkamag-anakan. Sa konteksto, ang tinutukoy ay kapwa nila lalaking Levita, ngunit hindi iyon tahasang ipinangalan sa talata.
- source_word: וַיִּתְקַדְּשׁוּ
  choice: pinabanal ang kanilang sarili
  rationale: Ipinahihiwatig ng anyong hitpael ang paghahanda o pagtatalaga ng sarili para sa banal na paglilingkod. Pinananatili ng saling ito ang sakral at ritwal na diwa nang hindi nagdaragdag ng tiyak na seremonya.
- source_word: וַיָּבֹאוּ
  choice: at dumating
  rationale: Ang payak na kahulugan ng בוא ay ‘dumating’ o ‘pumarito.’ Hindi tahasang sinasabi ng pandiwa na pumasok sila sa templo, kaya hindi idinagdag ang ideyang iyon.
- source_word: כְמִצְוַת הַמֶּלֶךְ
  choice: ayon sa utos ng hari
  rationale: Malinaw at natural na ipinapakita ang pagsunod sa tagubilin ng hari.
- source_word: בְּדִבְרֵי יְהוָה
  choice: alinsunod sa mga salita ni Yahweh
  rationale: Pinananatili ang maramihang ‘mga salita’ at inilalahad ang mga ito bilang batayan o pamantayan ng utos at pagkilos. Nilalagyan ng talababa ang mas literal na anyo dahil maaaring iugnay ang parirala sa utos ng hari o sa pagdating/pagkilos ng mga Levita.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin ang Tetragrammaton bilang personal na pangalang ‘Yahweh’ sa halip na palitan ito ng isang titulo.
- source_word: לְטַהֵר
  choice: upang linisin
  rationale: Sa konteksto ng templo, ang piel ng טהר ay tumutukoy sa ritwal na paglilinis o pagpapadalisay. Ang ‘linisin’ ay malinaw at hindi labis na teknikal.
- source_word: בֵּית יְהוָה
  choice: ang bahay ni Yahweh
  rationale: Pinananatili ang literal at teolohikal na mahalagang katawagang ‘bahay ni Yahweh’; ipinapaliwanag sa talababa na ang tinutukoy ay ang templo.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehova
  rationale: Personal na pangalan ang nasa tekstong Hebreo, kaya pinananatili ito bilang ‘Yahweh’ sa halip na palitan ng titulong ‘PANGINOON.’
- issue: Saklaw ng pariralang בְּדִבְרֵי יְהוָה
  choice: ayon sa utos ng hari, alinsunod sa mga salita ni Yahweh
  alternative: ayon sa utos ng hari sa pamamagitan ng mga salita ni Yahweh
  rationale: Ang Hebreo ay maaaring unawain na ang utos ng hari ay nakabatay sa mga salita ni Yahweh, o na ang buong pagkilos ay isinagawa alinsunod sa mga iyon. Pinili ang natural na pangunahing salin at pinanatili sa talababa ang mas literal at hindi gaanong tiyak na pagkakaugnay.
- issue: Paglalarawan sa אֲחֵיהֶם
  choice: kanilang mga kapatid
  alternative: kanilang mga kapwa Levita
  rationale: Bagaman mga kapwa lalaking Levita ang tinutukoy sa konteksto, ‘mga kapatid’ ang mismong katawagang ginamit ng Hebreo; hindi pinalitan ng mas tahasang paliwanag sa pangunahing teksto.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw ngunit marangal ang himig. Pinanatili ang mga terminong ‘mga kapatid,’ ‘pinabanal,’ at ‘bahay ni Yahweh’ upang manatiling malapit sa Hebreo, habang gumamit ng maiikling talababa para sa sintaktikong kalabuan at kontekstuwal na paliwanag.
