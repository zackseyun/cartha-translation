  text: עַתָּה֙ עִם לְבָבִ֔/י לִ/כְר֣וֹת בְּרִ֔ית לַ/יהוָ֖ה אֱלֹהֵ֣י יִשְׂרָאֵ֑ל וְ/יָשֹׁ֥ב מִמֶּ֖/נּוּ חֲר֥וֹן אַפּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/010.yaml
  text: Now it is in my heart to make a covenant with Yahweh[a], the God of Israel, so that his burning anger may turn away from us.
translation:
  language: tl
  text: Ngayon, nasa kalooban kong makipagtipan kay Yahweh, ang Diyos ng Israel, upang lumayo sa atin ang nag-aalab niyang galit.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עַתָּה
  choice: Ngayon
  rationale: Tuwirang panandang temporal na nagpapahayag ng agarang pasiya ni Hezekias.
- source_word: עִם לְבָבִי
  choice: nasa puso ko
  rationale: Pinananatili ang larawang Hebreo ng panloob na hangarin o matibay na pasiya, at likas itong pakinggan sa modernong Tagalog.
- source_word: לִכְרֹת בְּרִית
  choice: makipagtipan
  rationale: Likas at malinaw na salin ng idyomang Hebreo na literal na nangangahulugang 'pumutol ng tipan'; ipinahihiwatig rin nito na si Yahweh ang kabilang panig sa tipan.
- source_word: לַיהוָה
  choice: kay Yahweh
  rationale: Pinananatili ang personal na pangalang banal na יהוה; ang 'kay' ay likas na pananda sa Tagalog para sa kapareha sa pakikipagtipan.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ang Diyos ng Israel
  rationale: Tuwirang salin ng titulong nagpapakilala kay Yahweh bilang Diyos ng Israel.
- source_word: וְיָשֹׁב מִמֶּנּוּ
  choice: upang maalis sa atin
  rationale: Binabasa ang waw at jussive/imperfect bilang layunin o inaasahang bunga. Ang 'maalis' ay natural na Tagalog para sa pagtalikod o paglayo ng galit sa bayan.
- source_word: חֲרוֹן אַפּוֹ
  choice: ang nag-aalab niyang galit
  rationale: Pinananatili ang metapora ng init at tindi ng galit sa pariralang Hebreo.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang ginagamit sa talata ang Tetragrammaton; pinananatili ng 'Yahweh' ang personal at tipanang pangalan nang hindi nag-aangkat ng denominasyonal na pagpapakahulugan.
- issue: Ugnayan ng tipan sa pag-alis ng galit
  choice: upang maalis sa atin
  alternative: at aalis sa atin
  rationale: Maaaring magpahiwatig ang anyong pandiwa ng layunin o inaasahang bunga. Ang 'upang' ay umaayon sa konteksto ngunit hindi nagsasaad na mekanikal o tiyak na mapipilit ng tipan ang Diyos.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang Hebreong larawang 'nasa puso ko' at ang init-metapora sa 'nag-aalab na galit.' Hindi nilagyan ng talababa ang literal na 'pumutol ng tipan' sapagkat hindi ito natural na alternatibong pagbasa sa Tagalog at walang marker na kailangan sa pangunahing teksto.
