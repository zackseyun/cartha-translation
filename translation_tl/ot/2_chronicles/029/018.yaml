base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/018.yaml
  text: Then they went in to King Hezekiah and said[a], “We have cleansed all the house of Yahweh, the altar of burnt offering and all its utensils, and the table of the rows and all its utensils.”
translation:
  language: tl
  text: Pagkatapos, pumasok sila sa kinaroroonan ni Haring Hezekias at sinabi, “Nilinis na namin ang buong bahay ni Yahweh, pati ang altar ng handog na sinusunog at lahat ng kagamitan nito, at ang mesa ng mga hanay[a] at lahat ng kagamitan nito.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mesa ng tinapay na inihahandog,” samakatuwid, ang mesa para sa tinapay na inayos sa harap ni Yahweh.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְנִימָה
  choice: pumasok sila sa kinaroroonan
  rationale: Ipinahihiwatig ng pang-abay ang pagpasok paloob. Nililinaw ng pariralang ito sa natural na Tagalog na pumasok sila upang humarap at mag-ulat sa hari.
- source_word: טִהַרְנוּ
  choice: Nilinis na namin
  rationale: Tumutukoy ang pandiwa sa ritwal na paglilinis ng templo. Ang “nilinis na” ay malinaw sa karaniwang mambabasa at nagpapahayag ng gawaing katatapos na may kasalukuyang resulta.
- source_word: בֵּית יְהוָה
  choice: buong bahay ni Yahweh
  rationale: Pinananatili ang literal na larawang “bahay” sa Hebreo sa halip na agad itong gawing “templo,” habang malinaw pa rin sa konteksto.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasatitik ang personal na pangalang nasa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: מִזְבַּח הָעוֹלָה
  choice: altar ng handog na sinusunog
  rationale: Malinaw na tinutukoy ang altar para sa handog na lubusang sinusunog, nang hindi gumagamit ng labis na teknikal na pananalita.
- source_word: כֵּלָיו
  choice: lahat ng kagamitan nito
  rationale: Sa konteksto ng santuwaryo, saklaw ng כֵּלִים ang mga sisidlan at iba pang kagamitang ginagamit sa pagsamba; ang “kagamitan” ay natural at sapat na malawak.
- source_word: שֻׁלְחַן הַמַּעֲרֶכֶת
  choice: mesa ng mga hanay
  rationale: Pinananatili ang diwa ng mga bagay na maayos na nakahanay nang hindi tahasang idinaragdag sa pangunahing teksto ang “tinapay,” na nauunawaan lamang mula sa kontekstong pangkulto.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Personal na pangalan ang tahasang nasa tekstong Hebreo. Ang “Yahweh” ay nagpapanatili rito bilang pangalan sa halip na palitan ng titulong “PANGINOON.”
- issue: Pagpapakahulugan sa שֻׁלְחַן הַמַּעֲרֶכֶת
  choice: mesa ng mga hanay
  alternative: mesa ng tinapay na inihahandog
  rationale: Hindi tahasang lumilitaw ang salitang “tinapay” sa pariralang Hebreo sa talatang ito. Pinananatili sa pangunahing teksto ang anyong tumutukoy sa pagkakahanay, at inilalagay sa talababa ang kinikilalang kontekstuwal na paliwanag.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “pati” upang natural na ipakita na ang sumusunod na mga bagay ay kabilang sa nilinis na buong bahay, habang pinanatili ang pag-uulit ng “lahat ng kagamitan nito” mula sa Hebreo.
