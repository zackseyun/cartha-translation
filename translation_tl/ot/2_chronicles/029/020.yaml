base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/020.yaml
  text: Then King Hezekiah rose early[a], gathered the officials of the city, and went up to the house of Yahweh.
translation:
  language: tl
  text: Maagang bumangon si Haring Ezequias, tinipon ang mga pinuno ng lungsod, at umakyat sa bahay ni Yahweh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּשְׁכֵּם
  choice: Kinaumagahan, maagang bumangon
  rationale: Ang Hiphil ng שׁכם ay nagpapahiwatig ng maagang pagbangon o maagang pagsisimula. Pinananatili ng salin ang temporal na diin sa natural na Filipino.
- source_word: יְחִזְקִיָּהוּ הַמֶּלֶךְ
  choice: si Haring Ezequias
  rationale: Ginamit ang karaniwang anyong Filipino ng pangalan at ang natural na ayos ng titulo bago ang pangalang pantangi.
- source_word: וַיֶּאֱסֹף
  choice: tinipon
  rationale: Sa konteksto, ang אָסַף ay tumutukoy sa pagsasama-sama ng mga tao; malinaw at likas dito ang “tinipon.”
- source_word: אֵת שָׂרֵי הָעִיר
  choice: ang mga pinuno ng lungsod
  rationale: Ang שָׂרִים ay maaaring tumukoy sa mga opisyal, tagapamahala, o pinuno. Ang “mga pinuno” ay malinaw at hindi nagpapahiwatig ng namamanang maharlikang katayuan.
- source_word: וַיַּעַל
  choice: umakyat
  rationale: Pinananatili nito ang literal na larawang pag-akyat sa pook ng templo na taglay ng עָלָה.
- source_word: בֵּית יְהוָה
  choice: bahay ni Yahweh
  rationale: Pinananatili ang konkretong ekspresyong Hebreo na “bahay,” sa halip na gawing “templo,” at isinasalin ang banal na pangalan bilang Yahweh.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Tuwirang nasa tekstong Hebreo ang Tetragrammaton. Ang “Yahweh” ay nagpapanatili rito bilang pangalang pantangi sa halip na palitan ng isang titulo.
- issue: Pagpapakahulugan sa בֵּית יְהוָה
  choice: bahay ni Yahweh
  alternative: templo ni Yahweh
  rationale: Ang literal na “bahay” ay malinaw sa Filipino at pinananatili ang pormulasyon ng pinagmulan nang hindi inaalis ang kontekstuwal na kahulugang templo.
translation_notes:
  register: Modernong Filipino na payak ngunit marangal. Ginamit ang “lungsod” at “mga pinuno” para sa malinaw na pampublikong pagbasa, habang pinanatili ang Hebreong larawan ng pag-akyat at ng bahay ni Yahweh.
