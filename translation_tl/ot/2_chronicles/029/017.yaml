base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/017.yaml
  text: They began to consecrate on the first day of the first month[a], and on the eighth day of the month they came to the vestibule of Yahweh. Then they consecrated the house of Yahweh in eight days, and on the sixteenth day of the first month they finished.
translation:
  language: tl
  text: Nagsimula sila sa pagpapabanal noong unang araw ng unang buwan. Pagsapit ng ikawalong araw ng buwan, nakarating sila sa bulwagan sa harap ng templo ni Yahweh.[a] Walong araw nilang pinabanal ang templo ni Yahweh, at natapos nila ito noong ikalabing-anim na araw ng unang buwan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “portiko” o “beranda ng templo ni Yahweh.”
    reason: Iba pang posibleng salin ng אוּלָם, ang bulwagan o nakatakip na bahagi sa harap ng templo.
lexical_decisions:
- source_word: וַיָּחֵלּוּ ... לְקַדֵּשׁ
  choice: Nagsimula sila sa pagpapabanal
  rationale: Tapat ito sa kahulugang “nagsimula” ng Hiphil na חלל at sa ritwal na pagpapabanal/pagtatalaga ng קדשׁ, nang hindi nagdaragdag ng tahasang layon na wala sa sugnay na Hebreo.
- source_word: בְּאֶחָד לַחֹדֶשׁ הָרִאשׁוֹן
  choice: noong unang araw ng unang buwan
  rationale: Likas na salin sa Filipino ng Hebreong pormula ng petsa.
- source_word: בָּאוּ לְאוּלָם יְהוָה
  choice: nakarating sila sa bulwagan sa harap ng templo ni Yahweh
  rationale: Ang אוּלָם ay ang bulwagan o portiko sa harap ng templo. Ipinananatili ng “nakarating sa” ang direksiyonal na diwa ng בָּאוּ לְ nang hindi ipinapalagay na pumasok sila sa pinakabanal na bahagi.
- source_word: וַיְקַדְּשׁוּ אֶת בֵּית יְהוָה
  choice: pinabanal ang templo ni Yahweh
  rationale: Sa kontekstong ito, ang בֵּית יְהוָה ay ang templo. Ang “pinabanal” ay nagpapanatili sa salita at konsepto ng קדשׁ, kabilang ang ritwal na paglilinis at pagtatalaga para sa banal na gamit.
- source_word: לְיָמִים שְׁמוֹנָה
  choice: Walong araw nilang
  rationale: Malinaw at natural na ipinahahayag ang tagal ng gawain, habang naaayon sa pagkakasunod ng mga petsa.
- source_word: כִּלּוּ
  choice: natapos sila
  rationale: Maikli at likas na katumbas ng Piel ng כלה, “tapusin/makumpleto,” at hindi nagdaragdag ng layon na hindi tahasang inuulit sa Hebreo.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Pangalang pantangi ang tetragrammaton sa tekstong Hebreo. Pinananatili ng “Yahweh” ang banal na pangalan sa halip na palitan ito ng isang titulo.
- issue: Saklaw ng קדשׁ sa paglilingkod sa templo
  choice: pagpapabanal / pinabanal
  alternative: paglilinis; pagtatalaga
  rationale: Maaaring kasangkot sa konteksto ang ritwal na paglilinis at pagtatalaga, ngunit “pagpapabanal” ang nagpapanatili sa mas malawak na kahulugan ng ugat at hindi nililimitahan ito sa isa lamang sa mga aspektong iyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “templo” sa halip na literal na “bahay” dahil iyon ang likas at tiyak na tinutukoy ng בֵּית יְהוָה sa konteksto. Inilagay ang panandang [a] kaagad pagkatapos ng pariralang tinutukoy nito.
