base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/003.yaml
  text: In the first year of his reign[a], in the first month, he opened the doors of the house of Yahweh and repaired them.
translation:
  language: tl
  text: Noong unang taon ng kanyang paghahari, sa unang buwan, binuksan niya ang mga pinto ng bahay ni Yahweh at inayos ang mga ito.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pinatibay ang mga ito,” ibig sabihin, muling ginawang matibay o maayos ang mga pinto.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוּא
  choice: niya
  rationale: Ang hiwalay na panghalip ay muling tumutukoy sa hari bilang paksa. Sa natural na Filipino, sapat ang “niya” at hindi kailangang gawing mariin na “siya mismo.”
- source_word: בַשָּׁנָה הָרִאשׁוֹנָה לְמָלְכוֹ
  choice: Nang unang taon ng kanyang paghahari
  rationale: Natural na temporal na pahayag ito sa Filipino para sa unang taon ng pamumuno niya bilang hari.
- source_word: בַּחֹדֶשׁ הָרִאשׁוֹן
  choice: sa unang buwan
  rationale: Tuwirang salin ng pariralang tumutukoy sa unang buwan ng taon.
- source_word: פָּתַח
  choice: binuksan
  rationale: Ito ang payak at kontekstuwal na kahulugan ng pandiwa kaugnay ng mga pinto.
- source_word: דַּלְתוֹת
  choice: mga pinto
  rationale: Tumutukoy ang salita sa mga pinto o mga dahon ng pinto, hindi sa malalaking tarangkahan ng lunsod.
- source_word: בֵּית יְהוָה
  choice: bahay ni Yahweh
  rationale: Pinananatili ang konkretong ekspresyong Hebreo na “bahay ni Yahweh”; malinaw sa konteksto na ito ang templo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin ang Tetragrammaton bilang personal na pangalang “Yahweh,” sa halip na palitan ito ng isang titulo.
- source_word: וַיְחַזְּקֵם
  choice: at ipinaayos ang mga iyon
  rationale: Literal na ipinahihiwatig ng piel ng חזק ang pagpapalakas o pagpapatibay. Dahil mga pinto ng templong ibinabalik sa maayos na kalagayan ang tinutukoy, malinaw at natural sa Filipino ang “ipinaayos,” habang inilalahad sa talababa ang mas literal na posibilidad.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; ang PANGINOON
  rationale: Personal na pangalan ang tahasang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang pagkakaiba nito sa mga titulong gaya ng “Panginoon.”
- issue: Saklaw ng בֵּית יְהוָה
  choice: bahay ni Yahweh
  alternative: templo ni Yahweh
  rationale: Pinananatili sa pangunahing teksto ang metaporang “bahay” ng Hebreo nang hindi ikinukubli na templo ang tinutukoy sa konteksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kanyang” at “mga iyon” para sa maayos na daloy, at iniwasan ang sobrang teknikal o makalumang pananalita.
