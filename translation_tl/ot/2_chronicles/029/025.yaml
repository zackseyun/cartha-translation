  source_fidelity: Tumpak na naipapahayag ng draft ang pagpupuwesto sa mga Levita, ang tatlong magkakaibang instrumento, ang utos nina David, Gad, at Natan, at ang pinagmulan ng utos kay Yahweh sa pamamagitan ng mga propeta. Ang “kani-kanilang puwesto” ay katanggap-tanggap, ngunit ang “pinuwesto” ay mas tuwirang katumbas ng causative na וַיַּעֲמֵד nang walang dagdag na distributive nuance.
  naturalness: Marangal at likas ang pangkalahatang Tagalog. Ang inayos na ayos ng unang pangungusap ay mas malinaw na ang mga Levita, hindi ang bahay, ang may mga instrumento.
  terminology: Ang “Levita,” “Yahweh,” “tagakita,” at “propeta” ay angkop. Pinananatili ng “tagakita” ang pagkakaiba ng חֹזֶה sa נָבִיא. Ang “pompyang,” “alpa,” at “lira” ay pinananatiling magkakaibang katawagan para sa tatlong instrumentong nasa Hebreo.
  issues:
