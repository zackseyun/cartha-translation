revisions:
- from: Inilagay niya ang mga Levita sa kani-kanilang puwesto sa bahay ni Yahweh, na may mga pompiyang, alpa, at lira, ayon sa utos ni David, ni Gad na tagakita ng hari,[a] at ni Natan na propeta. Sapagkat ang utos ay mula kay Yahweh sa pamamagitan ng kanyang mga propeta.[b]
  to: Pinuwesto niya sa bahay ni Yahweh ang mga Levita na may mga pompyang, alpa, at lira, ayon sa utos ni David, ni Gad na tagakita ng hari,[a] at ni Natan na propeta. Sapagkat ang utos ay mula kay Yahweh sa pamamagitan ng kanyang mga propeta.[b]
  rationale: Bahagyang inayos ang unang pangungusap upang maging mas tuwiran ang pandiwang “pinuwesto” at malinaw na ang mga Levita ang may mga instrumento. Itinama rin ang literal na pahayag sa talababa [b], habang pinanatili sa pangunahing teksto ang natural na Tagalog na nagpapakita kapwa ng pinagmulan ng utos kay Yahweh at ng pamamagitan ng kanyang mga propeta.
