language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יַּֽעֲמֵ֨ד אֶת הַ/לְוִיִּ֜ם בֵּ֣ית יְהוָ֗ה בִּ/מְצִלְתַּ֨יִם֙ בִּ/נְבָלִ֣ים וּ/בְ/כִנֹּר֔וֹת בְּ/מִצְוַ֥ת דָּוִ֛יד וְ/גָ֥ד חֹזֵֽה הַ/מֶּ֖לֶךְ וְ/נָתָ֣ן הַ/נָּבִ֑יא כִּ֧י בְ/יַד יְהוָ֛ה הַ/מִּצְוָ֖ה בְּ/יַד נְבִיאָֽי/ו־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/025.yaml
  text: He stationed the Levites in the house of Yahweh with cymbals[a], harps, and lyres, according to the command of David and of Gad the king’s seer and Nathan the prophet[b], for the command was from Yahweh through his prophets.
translation:
  language: tl
  text: Pinuwesto niya sa bahay ni Yahweh ang mga Levita na may mga pompyang, alpa, at lira, ayon sa utos ni David, ni Gad na tagakita ng hari,[a] at ni Natan na propeta. Sapagkat ang utos ay mula kay Yahweh sa pamamagitan ng kanyang mga propeta.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “tagakita” ay salin ng Hebreong חֹזֶה (ḥozeh), isang titulong naiiba sa salitang isinaling “propeta,” bagaman magkaugnay ang kanilang gawain.
    reason: lexical_alternative
  - marker: b
    text: 'Mas literal: “sapagkat ang utos ay sa kamay ni Yahweh, sa kamay ng kanyang mga propeta.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֵד
  choice: Inilagay niya ... sa kani-kanilang puwesto
  rationale: Ang Hiphil ng עמד ay nagsasaad na pinuwesto niya ang mga Levita para sa kanilang opisyal na paglilingkod; malinaw at natural ito sa modernong Tagalog.
- source_word: הַלְוִיִּם
  choice: ang mga Levita
  rationale: Karaniwang katawagan sa pangkat na pantribo at panrelihiyon.
- source_word: בֵּית יְהוָה
  choice: sa bahay ni Yahweh
  rationale: Pinananatili ang pormal na larawang Hebreo na 'bahay' sa halip na palitan agad ng 'templo.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang personal na pangalan na kinakatawan ng Tetragrammaton sa tekstong Hebreo.
- source_word: בִּמְצִלְתַּיִם
  choice: na may mga pompiyang
  rationale: Ang instrumental na בְּ ay tumutukoy sa mga instrumentong ipinagamit; 'pompiyang' ang malinaw na katawagang Filipino para sa cymbals.
- source_word: בִּנְבָלִים
  choice: alpa
  rationale: Ang נבל ay isang instrumentong de-kuwerdas; hindi tiyak ang eksaktong modernong katumbas, ngunit nakaugaliang malinaw na salin ang 'alpa.'
- source_word: וּבְכִנֹּרוֹת
  choice: at lira
  rationale: Karaniwang kinikilalang lira ang כִּנּוֹר; pinananatili itong naiiba sa נבל.
- source_word: בְּמִצְוַת
  choice: ayon sa utos ni
  rationale: Ipinapahayag nito na ang kaayusan ay alinsunod sa ibinigay na awtorisasyon.
- source_word: גָּד חֹזֵה הַמֶּלֶךְ
  choice: Gad na tagakita ng hari
  rationale: Pinananatili ng 'tagakita' ang natatanging titulong חֹזֶה at hindi ito ipinapantay sa salitang 'propeta.'
- source_word: נָתָן הַנָּבִיא
  choice: Natan na propeta
  rationale: Tuwirang salin ng pangalan at kasunod nitong titulo.
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikilala nito ang dahilan kung bakit may awtoridad ang naunang utos.
- source_word: בְיַד יְהוָה ... בְיַד נְבִיאָיו
  choice: mula kay Yahweh sa pamamagitan ng kanyang mga propeta
  rationale: Natural na ipinahahayag sa Tagalog ang parehong pinagmulan ng utos at ang mga propetang naging tagapamagitan nito, habang ang mas literal na idyoma ay inilalagay sa talababa.
theological_decisions:
- issue: Ugnayan ng kaayusang liturhikal ni David at ng banal na awtoridad
  choice: Ang utos ay nagmula kay Yahweh at ipinaabot sa pamamagitan ng kanyang mga propeta, habang sina David, Gad, at Natan ay tahasang kaugnay sa utos.
  alternative: Ituring ang kaayusan bilang patakaran lamang ni David na nilapatan kalaunan ng banal na pagsang-ayon.
  rationale: Malinaw na iniuugnay ng כִּי בְיַד יְהוָה הַמִּצְוָה בְּיַד נְבִיאָיו ang utos kay Yahweh bilang tunay na pinagmulan at sa mga propeta bilang mga tagapamagitan; hindi inaalis ang papel ni David o ang tensiyon ng dalawang antas ng awtoridad.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw ngunit marangal. Pinanatili ang 'bahay ni Yahweh' upang makita ang pormal na Hebreong parirala, at ginamit ang 'tagakita' upang huwag pag-isahin ang dalawang magkaibang titulong Hebreo. Ang mga panandang [a] at [b] ay inilagay sa mismong bahaging nililinaw ng bawat talababa.
