base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/016.yaml
  text: Then the priests went into the inner part of the house of the LORD to cleanse it, and they brought out to the court of the house of the LORD all the uncleanness that they found in the temple of the LORD. Then the Levites received it to carry it outside to the Kidron Valley.
translation:
  language: tl
  text: Pumasok ang mga pari sa pinakaloob na bahagi ng bahay ng PANGINOON upang linisin ito, at dinala nila sa patyo ng bahay ng PANGINOON ang lahat ng karumihang natagpuan nila sa templo ng PANGINOON. Tinanggap naman ito ng mga Levita upang dalhin sa labas patungo sa Lambak ng Kidron.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִפְנִימָה בֵית יְהוָה
  choice: sa pinakaloob na bahagi ng bahay ng PANGINOON
  rationale: Ipinahahayag ang direksiyon patungo sa loob at ang panloob na bahagi ng gusali nang hindi tinutukoy nang higit sa sinasabi ng Hebreo kung aling silid iyon.
- source_word: לְטַהֵר
  choice: upang linisin iyon
  rationale: Sa konteksto, tumutukoy ito sa ritwal at pisikal na paglilinis ng bahay ng PANGINOON; pinananatili ng payak na 'linisin' ang dalawang aspekto.
- source_word: כָּל־הַטֻּמְאָה
  choice: ang lahat ng karumihan
  rationale: Ang 'karumihan' ay natural ngunit may kakayahang magpahiwatig ng ritwal na pagkadungis, gaya ng טֻמְאָה sa kontekstong ito.
- source_word: בְּהֵיכַל יְהוָה
  choice: sa templo ng PANGINOON
  rationale: Ang הֵיכָל dito ay ang banal na gusali o templo, na naiiba sa mas malawak na 'bahay' at patyo.
- source_word: לְנַחַל קִדְרוֹן חוּצָה
  choice: sa labas, sa Lambak ng Kidron
  rationale: Ang נַחַל ay maaaring tumukoy sa lambak o batis; sa pangalang heograpiko, 'Lambak ng Kidron' ang malinaw at karaniwang salin. Ang חוּצָה ay tahasang pinananatili bilang 'sa labas.'
theological_decisions:
- issue: Pangalan ng Diyos na יהוה
  choice: PANGINOON
  alternative: Yahweh
  rationale: Ginagamit ang nakaugaliang anyong PANGINOON sa publikasyong Tagalog, habang malinaw na ipinakikitang ito ang banal na pangalan sa pamamagitan ng malalaking titik; hindi nito dinaragdagan o binabago ang diwa ng talata.
- issue: Saklaw ng paglilinis
  choice: linisin iyon
  alternative: linisin ito sa ritwal na paraan
  rationale: Hindi idinagdag ang salitang 'ritwal' upang mapanatili ang lawak ng טהר, na sa konteksto ay kinabibilangan ng pag-aalis ng karumihan ngunit hindi kailangang paliitin sa isang teknikal na paliwanag.
translation_notes:
  register: Makabagong, marangal, at madaling maunawaang Filipino. Ginamit ang 'bahay ng PANGINOON' para sa בֵית יְהוָה at 'templo' para sa הֵיכָל upang mapanatili ang leksikal na pagkakaiba ng tekstong Hebreo. Ang 'Tinanggap naman iyon' ay natural na naghahayag ng paglipat ng karumihan mula sa mga pari tungo sa mga Levita.
