  text: וַ/יָּקֻ֣מוּ הַ֠/לְוִיִּם מַ֣חַת בֶּן עֲמָשַׂ֞י וְ/יוֹאֵ֣ל בֶּן עֲזַרְיָהוּ֮ מִן בְּנֵ֣י הַ/קְּהָתִי֒ וּ/מִן בְּנֵ֣י מְרָרִ֔י קִ֚ישׁ בֶּן עַבְדִּ֔י וַ/עֲזַרְיָ֖הוּ בֶּן יְהַלֶּלְאֵ֑ל וּ/מִן הַ/גֵּ֣רְשֻׁנִּ֔י יוֹאָח֙ בֶּן זִמָּ֔ה וְ/עֵ֖דֶן בֶּן יוֹאָֽח־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/012.yaml
  text: 'Then the Levites arose: Mahath son of Amasai and Joel son of Azariah[a], from the sons of the Kohathites; and from the sons of Merari, Kish son of Abdi and Azariah son of Jehallelel; and from the Gershonites[b], Joah son of Zimmah and Eden son of Joah.'
translation:
  language: tl
  text: 'Pagkatapos, tumayo ang mga Levita: sina Mahat na anak ni Amasai at Joel na anak ni Azarias, mula sa mga anak ni Kohat[a]; at mula sa mga anak ni Merari, sina Kis na anak ni Abdi at Azarias na anak ni Jehallelel; at mula sa mga Gersonita[b], sina Joa na anak ni Zima at Eden na anak ni Joa.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “mula sa mga anak ng Kohatita ... mula sa mga anak ni Merari.” Ipinakikita ng pananalitang ito sa talaangkanan na ang mga lalaking pinangalanan ay kabilang sa mga angkang iyon ng mga Levita.
    reason: cultural_note
  - marker: b
    text: Maaari ring isalin na “mula sa mga anak ni Gerson.” Katawagang pang-angkan ang ginamit dito sa Hebreo sa halip na ulitin ang eksaktong naunang pormula.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֻמוּ
  choice: Kaya tumayo
  rationale: Ang wayyiqtol ng קום ay nagsasaad ng pagsisimula ng pagkilos bilang tugon sa naunang utos. Likas sa Filipino ang “Kaya tumayo” at pinananatili nito ang ugnayang pasalaysay.
- source_word: הַלְוִיִּם
  choice: ang mga Levita
  rationale: Karaniwang katawagan sa Filipino para sa mga kabilang sa lipi ni Levi; ipinahahayag ng “mga” ang kolektibong anyo.
- source_word: מִן בְּנֵי הַקְּהָתִי
  choice: mula sa mga anak ni Kohat
  rationale: Pinananatili ang Hebreong pormulang pangangkan na “mula sa mga anak,” habang ginagamit ang pangalan ng ninunong si Kohat sa natural na Filipino.
- source_word: וּמִן בְּנֵי מְרָרִי
  choice: at mula sa mga anak ni Merari
  rationale: Inililipat nang tuwiran ang inulit na pormulang pangangkan at iniuugnay ang mga lalaking binanggit sa angkan ni Merari.
- source_word: וּמִן הַגֵּרְשֻׁנִּי
  choice: at mula sa mga Gersonita
  rationale: Ang may-artikulong pang-angkan na katawagan ay kolektibo. Ang “mga Gersonita” ay malinaw at natural na tawag sa angkan sa Filipino.
- source_word: בֶּן
  choice: anak ni
  rationale: Ito ang karaniwan at malinaw na katumbas sa talaangkanan; walang dahilan sa konteksto upang palawakin ito bilang “inapo ni.”
- source_word: מַחַת; עֲמָשַׂי; יוֹאֵל; עֲזַרְיָהוּ; קִישׁ; עַבְדִּי; יְהַלֶּלְאֵל; יוֹאָח; זִמָּה; עֵדֶן
  choice: Mahat; Amasai; Joel; Azarias; Kis; Abdi; Jehallelel; Joa; Zima; Eden
  rationale: Isinatinig ang mga pangalang pantangi ayon sa mga anyong madaling basahin sa Filipino, nang hindi isinasalin ang kahulugan ng mga pangalan.
