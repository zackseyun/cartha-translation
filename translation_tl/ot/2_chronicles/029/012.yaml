translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “sina” bago ang magkakaparis na pangalan upang maging natural ang mahabang talaan, habang pinanatili ang estruktura at mga pagkakaibang pang-angkan ng Hebreo.
