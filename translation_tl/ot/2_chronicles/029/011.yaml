  text: בָּנַ֕/י עַתָּ֖ה אַל תִּשָּׁל֑וּ כִּֽי בָ/כֶ֞ם בָּחַ֣ר יְהוָ֗ה לַ/עֲמֹ֤ד לְ/פָנָי/ו֙ לְ/שָׁ֣רְת֔/וֹ וְ/לִ/הְי֥וֹת ל֖/וֹ מְשָׁרְתִ֥ים וּ/מַקְטִרִֽים־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/011.yaml
  text: My sons[a], do not be negligent now, for Yahweh has chosen you to stand before him, to minister to him[d][c][b], and to be his ministers and burners of incense.
translation:
  language: tl
  text: Mga anak ko, huwag kayong magpabaya ngayon[a], sapagkat kayo ang pinili ni Yahweh upang tumayo sa harap niya[b], maglingkod sa kanya, at maging mga tagapaglingkod niya at mga tagapagsunog ng insenso[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “huwag kayong maging pabaya” o “huwag kayong magpakakupad.”'
    reason: lexical_alternative
  - marker: b
    text: Ang “tumayo sa harap niya” ay pananalitang pangpari para sa paglilingkod sa presensiya ng Diyos.
    reason: cultural_note
  - marker: c
    text: 'Maaari ring isalin: “mga naghahandog ng insenso.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּנַי
  choice: Mga anak ko
  rationale: Tuwirang panawagan na literal na nangangahulugang “mga anak kong lalaki.” Sa konteksto, ang kinakausap ay mga lalaking Levita at pari; ang “Mga anak ko” ay likas at marangal sa Filipino nang hindi nawawala ang ugnayang ipinahihiwatig ng Hebreo.
- source_word: עַתָּה
  choice: ngayon
  rationale: Pinananatili ang agarang diin ng panawagan.
- source_word: אַל תִּשָּׁלוּ
  choice: huwag kayong magpabaya
  rationale: Sa kontekstong ito, ang pandiwa ay tumutukoy sa pagiging pabaya, maluwag, o kulang sa pagtupad ng tungkulin. Ang “magpabaya” ay malinaw at natural sa modernong Filipino.
- source_word: בָכֶם בָּחַר יְהוָה
  choice: kayo ang pinili ni Yahweh
  rationale: Ipinakikita ng ayos na ito ang diin ng Hebreo sa “kayo” bilang mga pinili.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang transliterasyon ng personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
- source_word: לַעֲמֹד לְפָנָיו
  choice: upang tumayo sa harap niya
  rationale: Pinananatili ang larawang Hebreo at ang pariralang panseremonya tungkol sa paglilingkod sa presensiya ng Diyos.
- source_word: לְשָׁרְתוֹ
  choice: maglingkod sa kanya
  rationale: Natural sa Filipino at sapat na naipapahayag ang paglilingkod na panrelihiyon sa konteksto ng templo.
- source_word: וְלִהְיוֹת לוֹ מְשָׁרְתִים
  choice: at maging mga tagapaglingkod niya
  rationale: Pinananatili ang ipinagkaloob na katayuan at gawain ng mga inatasang maglingkod kay Yahweh.
- source_word: וּמַקְטִרִים
  choice: at mga tagapagsunog ng insenso
  rationale: 'Malapit sa anyong participle ng Hebreo at pinananatili ang pagkakapantay ng dalawang tungkulin: mga tagapaglingkod at mga tagapagsunog ng insenso.'
theological_decisions:
- issue: Paglalahad sa pangalang יְהוָה
  choice: Yahweh
  alternative: ANG PANGINOON
  rationale: Personal na pangalan ang nasa tekstong Hebreo. Ang “Yahweh” ay nagpapanatili rito sa halip na tahimik na palitan ng titulong “PANGINOON.”
- issue: Kahulugan ng “tumayo sa harap niya”
  choice: Pinanatili ang literal na larawan at ipinaliwanag sa talababa bilang pananalitang pangpari
  alternative: maglingkod sa presensiya niya
  rationale: Ang literal na parirala ay nauunawaan sa Filipino at pinananatili ang natatanging larawang panseremonya nang hindi nilulutas sa mismong teksto ang buong saklaw ng idyoma.
- issue: Saklaw ng וּמַקְטִרִים
  choice: mga tagapagsunog ng insenso
  alternative: mga naghahandog ng insenso
  rationale: Ang konteksto ng templo ay sumusuporta sa insenso, ngunit maaaring bigyang-diin ng pandiwa ang pagpapataas ng usok bilang handog. Pinanatili sa pangunahing teksto ang mas malapit na paglalarawan at inilagay sa talababa ang natural na alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang magalang ngunit malapit na panawagang “Mga anak ko,” ang personal na pangalang “Yahweh,” at ang larawang panseremonya ng pagtayo sa harap ng Diyos. Iniwasan ang labis na teknikal o makalumang bokabularyo, ngunit pinanatili ang pag-uulit ng paglilingkod dahil sinasalamin nito ang estruktura at diin ng Hebreo.
