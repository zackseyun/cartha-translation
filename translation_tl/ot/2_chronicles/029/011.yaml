  source_fidelity: 'Tapat ang salin sa Hebreo: ang בָּנַי ay maayos na “Mga anak ko”; ang utos na אַל תִּשָּׁלוּ ay likas na naipahayag sa “huwag kayong magpabaya”; at napapanatili ang diin ng בָכֶם sa “kayo ang pinili ni Yahweh.” Wasto ring napanatili ang magkakasunod na layunin: tumayo sa harap niya, maglingkod sa kanya, at maging kanyang mga tagapaglingkod at tagapagsunog ng insenso. Hindi nito isinasara ang anumang pinagtatalunang kahulugan nang lampas sa hinihingi ng konteksto.'
