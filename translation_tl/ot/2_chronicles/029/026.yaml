base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/026.yaml
  text: Then the Levites stood with the instruments of David[b][a], and the priests with the trumpets.
translation:
  language: tl
  text: Pagkatapos ay pumuwesto ang mga Levita dala ang mga instrumento ni David[a], at ang mga pari naman ay dala ang mga trumpeta.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga instrumentong iniatas o iniugnay kay David.” Maaaring tumukoy ang pariralang Hebreo sa mga instrumentong pag-aari, iniatas, o iniugnay kay David.
    reason: lexical_alternative
  - marker: b
    text: Ang tinutukoy ay mga trumpetang ginagamit ng mga pari sa pagsamba. Sa ibang konteksto, tinutukoy ang mga ito bilang yari sa pilak, ngunit hindi binabanggit iyon dito.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַמְדוּ
  choice: Pagkatapos ay pumuwesto
  rationale: Isinusulong ng waw-consecutive ang salaysay. Ang “pumuwesto” ay likas sa modernong Tagalog at ipinahihiwatig na tumayo sila sa kani-kanilang itinakdang lugar para sa paglilingkod.
- source_word: הַלְוִיִּם
  choice: ang mga Levita
  rationale: Karaniwang katawagan sa Tagalog para sa tiyak na pangkat na Levitico; pinananatili ang tiyak na pantukoy.
- source_word: בִּכְלֵי דָוִיד
  choice: dala ang mga instrumento ni David
  rationale: Sa konteksto ng musika sa templo, ang malawak na salitang כְּלִי ay tumutukoy sa mga instrumentong pangmusika. Pinananatili ng “ni David” ang maluwag na ugnayang genitibo nang hindi tiyak na sinasabing personal niyang pag-aari ang mga ito.
- source_word: וְהַכֹּהֲנִים
  choice: at ang mga pari naman
  rationale: Tuwirang salin ng ikalawang pangkat; tumutulong ang “naman” na ipakita ang magkatugmang ayos ng dalawang pangkat.
- source_word: בַּחֲצֹצְרוֹת
  choice: dala ang mga trumpeta
  rationale: Tuwirang tumutukoy ang חֲצֹצְרוֹת sa mga trumpetang ginagamit ng mga pari. Hindi idinagdag sa pangunahing teksto ang “pilak” sapagkat wala iyon sa talatang ito.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “pumuwesto” sa halip na payak na “tumayo” upang likas na maipahayag ang pagkuha nila ng kani-kanilang lugar sa paglilingkod. Inulit ang “dala” sa ikalawang sugnay para sa kalinawan sa Tagalog, bagaman eliptikal ang Hebreo.
