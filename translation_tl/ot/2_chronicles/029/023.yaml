  yaml_path: translation/ot/2_chronicles/029/023.yaml
  text: Then they brought near the goats for the sin offering before the king and the assembly[b][a], and they laid their hands on them.
translation:
  language: tl
  text: Pagkatapos, inilapit nila sa harap ng hari at ng kapulungan ang mga lalaking kambing na handog para sa kasalanan,[a] at ipinatong nila ang kanilang mga kamay sa mga kambing.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “iniharap nila sa hari at sa kapulungan ang mga lalaking kambing na handog para sa kasalanan.”'
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “ipinatong nila ang kanilang mga kamay sa mga kambing.” Pinakanatural na tumutukoy ang “nila” sa hari at sa kapulungan, na maaaring kumilos sa pamamagitan ng mga kinatawan.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּגִּישׁוּ
  choice: inilapit nila
  rationale: Ang Hiphil ng נגשׁ ay nangangahulugang maglapit o magharap. Pinananatili ng “inilapit” ang konkretong pagkilos sa konteksto ng paghahandog at natural ito sa makabagong Tagalog.
- source_word: שְׂעִירֵי הַחַטָּאת
  choice: mga lalaking kambing para sa handog para sa kasalanan
  rationale: Ang שְׂעִירֵי ay tumutukoy sa mga lalaking kambing, at ang הַחַטָּאת sa kontekstong ito ay isang handog para sa kasalanan, hindi ang kasalanan mismo.
- source_word: לִפְנֵי
  choice: sa harap ng
  rationale: Sa seremonyal na konteksto, ipinahihiwatig nito na ang mga kambing ay iniharap sa presensiya ng hari at ng kapulungan.
- source_word: הַמֶּלֶךְ וְהַקָּהָל
  choice: ang hari at ang kapulungan
  rationale: Ang קָהָל ay ang nagkatipong pamayanan. Ang “kapulungan” ay malinaw at marangal nang hindi nagdaragdag ng natatanging kahulugang pansimbahan.
- source_word: וַיִּסְמְכוּ יְדֵיהֶם
  choice: ipinatong nila ang kanilang mga kamay
  rationale: Sa konteksto ng paghahandog, ang סמך na may “mga kamay” ay tumutukoy sa ritwal na pagpapatong ng mga kamay sa hayop.
- source_word: עֲלֵיהֶם
  choice: sa mga iyon
  rationale: Tumutukoy ang panlalaking maramihang hulapi sa mga lalaking kambing. Ang “sa mga iyon” ay natural at malinaw na tumutukoy sa mga hayop.
theological_decisions:
- issue: Kahulugan ng חַטָּאת sa konteksto ng paghahandog
  choice: handog para sa kasalanan
  alternative: kasalanan
  rationale: Sa mga tekstong panritwal, madalas na tumutukoy ang חַטָּאת sa handog na inihahandog dahil sa kasalanan. Pinagtitibay ito rito ng mga kambing na inilalapit at pinapatungan ng mga kamay.
- issue: Tinutukoy ng simuno sa “ipinatong nila ang kanilang mga kamay”
  choice: Hindi tahasang tinukoy; pinakamalapit na tumutukoy sa hari at sa kapulungan, marahil sa pamamagitan ng mga kinatawan
  alternative: Ang mga pari ang nagpatong ng mga kamay
  rationale: Ang pinakamalapit na mga naunang tinukoy ay ang hari at ang kapulungan, at natural na bumabalik sa kanila ang “kanilang mga kamay.” Gayunman, hindi nililinaw ng Hebreo kung paano isinagawa ng buong kapulungan ang kilos, kaya pinananatili ng salin ang di-tiyak na simuno at ipinapaliwanag ito sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kapulungan” para sa pampublikong pagtitipon at ang “handog para sa kasalanan” upang malinaw na maipahayag ang panritwal na kahulugan. Inilagay ang mga talababa sa mismong puntong kaugnay ng bawat paliwanag.
