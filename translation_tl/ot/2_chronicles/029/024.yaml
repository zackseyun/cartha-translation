base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/024.yaml
  text: The priests slaughtered them and applied their blood to the altar to make atonement for all Israel[b][a], because the king had said that the burnt offering and the sin offering were for all Israel.
translation:
  language: tl
  text: Kinatay ng mga pari ang mga iyon at ipinahid ang dugo ng mga iyon sa altar[a] upang magbayad-sala para sa buong Israel, sapagkat sinabi ng hari na ang handog na sinusunog at ang handog para sa kasalanan[b] ay para sa buong Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nilinis ang altar sa pamamagitan ng dugo ng mga iyon”; ang pandiwang Hebreo ay maaari ring tumukoy sa pagsasagawa ng ritwal ng paglilinis o ng handog para sa kasalanan.
    reason: lexical_alternative
  - marker: b
    text: O “handog para sa paglilinis.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁחָטוּם
  choice: Pinatay ng mga pari ang mga iyon bilang handog
  rationale: Sa konteksto ng paghahandog, ang שׁחט ay tumutukoy sa ritwal na pagpatay sa hayop. Nililinaw ng “bilang handog” ang sakripisyal na konteksto nang hindi gumagamit ng di-likas na “kinatay” para sa karaniwang mambabasa.
- source_word: וַיְחַטְּאוּ אֶת־דָּמָם הַמִּזְבֵּחָה
  choice: inilagay ang dugo ng mga iyon sa altar
  rationale: Ipinapahayag nito ang konkretong ritwal na paggamit ng dugo sa altar, habang ang mas tiyak na diwang paglilinis na maaaring taglay ng Hiphil ng חטא ay pinananatili sa talababa.
- source_word: לְכַפֵּר
  choice: upang magbayad-sala
  rationale: Ang “magbayad-sala” ay isang pamilyar at maikli ngunit marangal na salin ng כפר sa kontekstong sakripisyal.
- source_word: עַל כָּל־יִשְׂרָאֵל
  choice: para sa buong Israel
  rationale: Ipinakikita ng עַל dito kung sino ang saklaw at nakikinabang sa ritwal ng pagbabayad-sala.
- source_word: כִּי
  choice: sapagkat
  rationale: Malinaw nitong ipinakikilala ang dahilan ng pagkakasaklaw ng mga handog sa buong Israel.
- source_word: לְכָל־יִשְׂרָאֵל אָמַר הַמֶּלֶךְ
  choice: sinabi ng hari na ... ay para sa buong Israel
  rationale: Natural na isinasaayos sa Tagalog ang Hebreong ayos ng mga salita nang hindi ginagawang tahasang utos ang simpleng אָמַר.
- source_word: הָעוֹלָה
  choice: ang handog na sinusunog
  rationale: Karaniwang nauunawaang katawagan ito para sa עוֹלָה, ang handog na sinusunog sa altar.
- source_word: וְהַחַטָּאת
  choice: ang handog para sa kasalanan
  rationale: Sa kontekstong sakripisyal, ang חַטָּאת ay tumutukoy sa isang uri ng handog. Pinananatili sa talababa ang alternatibong diin sa paglilinis.
theological_decisions:
- issue: Kahulugan ng ritwal na pandiwang וַיְחַטְּאוּ
  choice: Ilagay sa pangunahing teksto ang konkretong kilos na “inilagay ang dugo ... sa altar.”
  alternative: “nilinis ang altar sa pamamagitan ng dugo ng mga iyon”
  rationale: Maaaring tumukoy ang Hiphil ng חטא sa pagsasagawa ng ritwal ng paglilinis o handog para sa kasalanan. Hindi tahasang nilulutas ng pangunahing teksto kung ang altar ang tuwirang nililinis; pinananatili ang mahalagang alternatibo sa talababa.
- issue: Pagpapakahulugan sa חַטָּאת
  choice: handog para sa kasalanan
  alternative: handog para sa paglilinis
  rationale: Ang tradisyonal at madaling maunawaang “handog para sa kasalanan” ay angkop sa pangunahing teksto, ngunit maaaring idiin ng termino ang ritwal na paglilinis kaya itinatala ang alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “buong Israel” para sa כָּל־יִשְׂרָאֵל at pinanatili ang mga terminong panghandog sa anyong madaling maunawaan ng karaniwang mambabasa. Ang mga marker na [a] at [b] ay inilagay kaagad pagkatapos ng mga pariralang tinutukoy ng kani-kanilang talababa.
