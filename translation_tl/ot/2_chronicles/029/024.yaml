- from: Pinatay ng mga pari ang mga iyon bilang handog at inilagay ang dugo ng mga iyon sa altar upang magbayad-sala para sa buong Israel,[a] sapagkat sinabi ng hari na ang handog na sinusunog at ang handog para sa kasalanan[b] ay para sa buong Israel.
