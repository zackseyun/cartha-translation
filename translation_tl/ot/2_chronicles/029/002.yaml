id: 2CH.29.2
reference: 2 Chronicles 29:2
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ הַ/יָּשָׁ֖ר בְּ/עֵינֵ֣י יְהוָ֑ה כְּ/כֹ֥ל אֲשֶׁר עָשָׂ֖ה דָּוִ֥יד אָבִֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/002.yaml
  text: He did what was right in the eyes of Yahweh[a], according to all that David his father had done.
translation:
  language: tl
  text: Ginawa niya ang matuwid sa paningin ni Yahweh, ayon sa lahat ng ginawa ni David na kanyang ninuno[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal na “David na kanyang ama.” Sa pormulang dinastiko, ang “ama” ay maaaring tumukoy sa isang ninuno o tagapagmula ng angkan, hindi sa agarang ama.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Ginawa niya
  rationale: Ang Qal wayyiqtol ng עשה ay karaniwang anyong pasalaysay na nangangahulugang “at ginawa niya.” Hindi na kailangang isalin nang tahasan ang pang-ugnay upang maging natural sa Tagalog.
- source_word: הַיָּשָׁר
  choice: ang matuwid
  rationale: 'Ang pang-uring may pantukoy ay ginagamit bilang pangngalan: “ang matuwid” o “ang bagay na tama.” Ang “ang matuwid” ay maikli, marangal, at likas sa pormulang sumusuri sa isang hari.'
- source_word: בְּעֵינֵי
  choice: sa paningin ni
  rationale: Pinananatili nito ang Hebreong metapora ng pagtataya mula sa pananaw ng isang tao, at natural din ito sa modernong Tagalog.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat ang personal na pangalang יהוה sa halip na palitan ito ng isang titulo.
- source_word: כְּכֹל אֲשֶׁר
  choice: gaya ng lahat ng
  rationale: Ipinapahayag nito kapwa ang paghahambing at ang kabuuang saklaw ng halimbawang ibinigay ng ginawa ni David.
- source_word: עָשָׂה
  choice: ginawa
  rationale: Ang aspektong tapos na at ang mas naunang kilos ni David ay malinaw na sa konteksto; hindi nangangailangan ang Tagalog ng katumbas na past perfect.
- source_word: דָּוִיד
  choice: David
  rationale: Karaniwang anyo ng pangalang pantangi sa Tagalog.
- source_word: אָבִיו
  choice: kanyang ninuno
  rationale: Bagaman literal na “kanyang ama,” maaaring tukuyin ng אָב ang isang ninuno. Si David ay dinastikong ninuno ni Hezekias, hindi ang kanyang agarang ama; kaya iniiwasan ng “ninuno” ang maling pagkaunawa habang pinananatili ang ugnayang angkan.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo; pinananatili ng “Yahweh” ang pangalan sa halip na halinhan ito ng titulo.
- issue: Kahulugan ng אָבִיו sa ugnayan ni David kay Hezekias
  choice: kanyang ninuno
  alternative: kanyang ama
  rationale: May saklaw ang Hebreong אָב na “ama” o “ninuno.” Sa dinastikong pormulang ito, ang tinutukoy ay ang pagkamag-anak sa angkan; pinipili ng salin ang kontekstuwal na kahulugan nang hindi ipinahihiwatig na si David ang agarang ama ni Hezekias.
translation_notes:
  register: Modernong Filipino Tagalog na dignified ngunit madaling maunawaan. Pinanatili ang pormulang “sa paningin ni Yahweh,” habang ginamit ang “ninuno” upang maging malinaw ang dinastikong ugnayan.
