base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/028.yaml
  text: And all the assembly was bowing down[a], while the song was being sung and the trumpets were sounding—all this continued until the burnt offering was finished.
translation:
  language: tl
  text: At ang buong kapulungan ay yumuyukod sa pagsamba, habang inaawit ang awit[a] at pinatutunog ang mga trumpeta. Nagpatuloy ang lahat ng ito hanggang sa matapos ang handog na sinusunog.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal na Hebreo, “ang awit ay umaawit/tumutunog,” isang idyomang mas natural isalin bilang “inaawit ang awit.”
    reason: lexical_alternative
lexical_decisions:
- source_word: קָּהָל
  choice: kapulungan
  rationale: Tumutukoy sa buong pamayanang nagkatipon para sa pagsamba; pinananatili ng “kapulungan” ang kolektibong diwa nang hindi nagdaragdag ng tiyak na katawagang pangdenominasyon.
- source_word: מִשְׁתַּחֲוִים
  choice: yumuyukod sa pagsamba
  rationale: Ipinahahayag ng pandiwa ang pisikal na pagyukod o pagpapatirapa bilang pagsamba. Pinananatili ng salin ang kilos at nililinaw ang layunin nito sa konteksto.
- source_word: הַשִּׁיר מְשׁוֹרֵר
  choice: inaawit ang awit
  rationale: Literal na “ang awit ay umaawit/tumutunog,” isang Hebreong paraan ng pagpapahayag na mas natural sa Tagalog bilang balintiyak na “inaawit ang awit.”
- source_word: חֲצֹצְרוֹת מחצצרים
  choice: pinatutunog ang mga trumpeta
  rationale: Ang mga trumpeta ang tinutukoy na patuloy na hinihipan o pinatutunog; ang balintiyak na anyo ay likas sa Tagalog at hindi nagdaragdag kung sino ang humihip.
- source_word: הַכֹּל
  choice: lahat ng ito
  rationale: Pangbuod ito sa magkakasabay na kilos ng pagyukod, pag-awit, at pagpapatunog ng mga trumpeta.
- source_word: עַד לִכְלוֹת
  choice: hanggang sa matapos
  rationale: Malinaw at likas na ipinahahayag ang hangganan ng nagpapatuloy na mga kilos.
- source_word: הָעֹלָה
  choice: handog na sinusunog
  rationale: Karaniwang katumbas sa modernong Tagalog ng teknikal na katawagang Hebreo para sa handog na lubusang sinusunog sa altar.
theological_decisions:
- issue: Pisikal na kilos at kahulugan ng מִשְׁתַּחֲוִים
  choice: yumuyukod sa pagsamba
  alternative: sumasamba
  rationale: Hindi lamang pangkalahatang pagsamba ang ipinahahayag ng Hebreo kundi isang pisikal na pagyukod; pinananatili ng napiling salin ang parehong kilos at kontekstong panrelihiyon.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “kapulungan,” “trumpeta,” at “handog na sinusunog” bilang malinaw na mga katawagang angkop sa pampublikong pagbasa. Inilagay ang talababa sa “awit,” ang mismong pariralang ipinaliliwanag nito.
