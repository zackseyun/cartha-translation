base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/008.yaml
  text: So the wrath of Yahweh came upon Judah and Jerusalem[a], and he made them a horror, a desolation, and an object of hissing[b], as you see with your own eyes.
translation:
  language: tl
  text: Dahil dito, dumating ang poot ni Yahweh laban sa Juda at Jerusalem, at ginawa niya silang isang kahindik-hindik na tanawin,[a] isang pagkatiwangwang, at tampulan ng mapanlibak na pagsipol,[b] gaya ng nakikita ninyo sa sarili ninyong mga mata.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “isang bagay na nagdudulot ng pangingilabot.” Ang salitang Hebreo ay tumutukoy sa isang bagay na nagdudulot ng pangingilabot o pagkasindak.
    reason: lexical_alternative
  - marker: b
    text: Ang “pagsipol” dito ay tumutukoy sa mapanlibak na reaksiyon ng mga nakakakita sa pagkawasak; maaari ring isaling “tampulan ng panunuya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: קֶצֶף
  choice: matinding galit
  rationale: Ipinahahayag ang tindi ng banal na galit sa paghatol nang natural sa makabagong Tagalog.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang isinasalin ang banal na pangalan sa halip na palitan ito ng isang titulo.
- source_word: וַיְהִי ... עַל
  choice: ibinuhos ... sa
  rationale: Natural na idyomang Tagalog para sa pagdating ng matinding galit laban sa Juda at Jerusalem, bagaman mas literal ang 'napasa kanila.'
- source_word: וַיִּתְּנֵם
  choice: ginawa niya silang
  rationale: Sa pagkakasunod ng ל at mga kalagayang ibinunga, ipinakikita ng pandiwa na inilagay sila ng Diyos sa hayag na kalagayang ito.
- source_word: לְזוֹעָה
  choice: isang kakila-kilabot na tanawin
  rationale: Sinasaklaw ang diwa ng isang bagay na nagdudulot ng pangingilabot o pagkasindak, hindi lamang ang sariling takot ng Juda at Jerusalem.
- source_word: לְשַׁמָּה
  choice: isang lugar na wasak
  rationale: Natural sa Tagalog at malinaw na tumutukoy sa lantad na pagkawasak at pagkatiwangwang.
- source_word: וְלִשְׁרֵקָה
  choice: tampulan ng mapanlibak na pagsipol
  rationale: Pinananatili ang kongkretong larawan ng pagsipol at nililinaw ang mapanlibak na reaksiyon ng mga nakakakita.
- source_word: כַּאֲשֶׁר אַתֶּם רֹאִים בְּעֵינֵיכֶם
  choice: gaya ng nakikita ninyo mismo
  rationale: Pinananatili ang mariing pagtukoy sa tuwirang nasasaksihan ng mga kausap nang hindi nagiging mabigat ang Tagalog.
theological_decisions:
- issue: Hindi pagpapalambot sa wika ng banal na paghatol
  choice: ibinuhos ni Yahweh ang kanyang matinding galit ... at ginawa niya silang
  alternative: nagalit si Yahweh ... at hinayaan niya silang maging
  rationale: Tahasan sa Hebreo na ang pagkawasak at kahihiyan ay bunga ng aktibong paghatol ni Yahweh. Hindi ito pinalalambot bilang payak na pagpapahintulot lamang.
- issue: Kalikasang pampubliko ng kahihiyan sa paghatol
  choice: kakila-kilabot na tanawin ... tampulan ng mapanlibak na pagsipol
  alternative: takot ... panunuya
  rationale: Pinananatili ang larawan ng Juda at Jerusalem bilang nakikitang halimbawa ng pagkawasak na nagdudulot ng pagkasindak at paglibak, nang walang idinadagdag na doktrinal na paliwanag.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “Yahweh” para sa banal na pangalan. Ang “kakila-kilabot na tanawin” at “mapanlibak na pagsipol” ay nagpapanatili sa matingkad at pampublikong larawan ng tatlong Hebreong parirala habang iniiwasan ang lipas o di-natural na pananalita.
