  to: At narito[a], nabuwal sa tabak ang aming mga ama, at ang aming mga anak na lalaki, mga anak na babae, at mga asawang babae ay nasa pagkabihag dahil dito.
  rationale: Pinalitan ang imperatibong “masdan ninyo” ng “narito” upang hindi magdagdag ng kausap na wala sa Hebreo. Pinalitan ang “namatay” ng “nabuwal” upang higit na mapanatili ang Hebreong pananalita sa konteksto ng tabak. Nilinaw ang “mga asawa” bilang “mga asawang babae” upang mapanatili ang tiyak na kasarian ng pinagmulang teksto.
