base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/009.yaml
  text: And behold[a], our fathers have fallen by the sword[b], and our sons and our daughters and our wives are in captivity because of this.
translation:
  language: tl
  text: At narito[a], nabuwal sa tabak ang aming mga ama, at ang aming mga anak na lalaki, mga anak na babae, at mga asawang babae ay nasa pagkabihag dahil dito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Masdan.” Ang salitang Hebreo ay mariing nagtutuon ng pansin sa kasunod na pahayag.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: At masdan ninyo
  rationale: Nagbibigay-diin ito at itinutuon ang pansin sa kasunod na pahayag. Ang “masdan ninyo” ay marangal at nauunawaan sa makabagong Filipino, habang pinananatili ng “At” ang pang-ugnay.
- source_word: נָפְלוּ
  choice: namatay
  rationale: Literal na “nabuwal,” ngunit sa konteksto ng tabak at digmaan, ang likas na kahulugan ay namatay. Iniiwasan ng “namatay” ang posibleng maling pagkaunawa sa literal na pagkadapa.
- source_word: אֲבוֹתֵינוּ
  choice: aming mga ama
  rationale: Pinananatili ang tiyak na panlalaking katawagang pangkamag-anak ng Hebreo at ang pagtukoy sa naunang salinlahi.
- source_word: בֶּחָרֶב
  choice: sa tabak
  rationale: Likas na katumbas ng Hebreong idyoma para sa marahas na kamatayan sa digmaan, nang hindi ginagawang mas pangkalahatan bilang “sa labanan.”
- source_word: וּבָנֵינוּ
  choice: aming mga anak na lalaki
  rationale: Pinananatili ang pagkakaiba ng mga anak na lalaki at mga anak na babae na tahasang nakalista sa Hebreo.
- source_word: וּבְנוֹתֵינוּ
  choice: mga anak na babae
  rationale: Tuwirang katumbas at malinaw na naiiba sa mga anak na lalaki.
- source_word: וְנָשֵׁינוּ
  choice: mga asawa
  rationale: Sa listahang pampamilya na may panghalip na paari, “mga asawa” ang pinakatiyak na kahulugan; sa konteksto, tumutukoy ito sa mga asawang babae.
- source_word: בַּשְּׁבִי
  choice: nasa pagkabihag
  rationale: Pinananatili ang nominal at stative na anyo ng Hebreo—literal na sila ay nasa kalagayan ng pagkabihag—sa halip na gawing tahasang pandiwang “binihag.”
- source_word: עַל זֹאת
  choice: dahil dito
  rationale: Malinaw na ipinapahayag ang sanhi at tumutukoy pabalik sa kasalanan at kawalang-katapatan na binanggit sa konteksto.
theological_decisions:
- issue: Mga katawagang pangkamag-anak na may tiyak na kasarian sa konteksto ng hatol
  choice: aming mga ama ... mga anak na lalaki, mga anak na babae, at mga asawa
  alternative: aming mga ninuno ... mga anak ... mga kababaihan
  rationale: Sadyang inililista ng Hebreo ang magkakaibang pangkat ng pamilya. Pinananatili ng salin ang mga pagkakaibang ito sa halip na pagsamahin ang mga ito sa mga katawagang walang tiyak na kasarian.
- issue: Ugnayang sanhi sa עַל זֹאת
  choice: dahil dito
  alternative: dahil sa bagay na ito / dahil sa lahat ng ito
  rationale: Ipinahahayag ang hatol bilang bunga ng naunang inilarawang kawalang-katapatan, ngunit hindi dinaragdagan ang teksto ng mas tiyak na doktrinal na paliwanag.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “masdan ninyo” upang ihatid ang mariing pantawag-pansin nang hindi gumagamit ng lubhang arkaikong pananalita. Ang “namatay sa tabak” ay natural sa Filipino at naghahatid ng kahulugan ng Hebreong idyomang “nabuwal sa tabak.”
