source:
  edition: WLC
  text: כִּֽי מָעֲל֣וּ אֲבֹתֵ֗י/נוּ וְ/עָשׂ֥וּ הָ/רַ֛ע בְּ/עֵינֵ֥י יְהוָֽה אֱלֹהֵ֖י/נוּ וַ/יַּֽעַזְבֻ֑/הוּ וַ/יַּסֵּ֧בּוּ פְנֵי/הֶ֛ם מִ/מִּשְׁכַּ֥ן יְהוָ֖ה וַ/יִּתְּנוּ עֹֽרֶף־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/006.yaml
  text: For our fathers acted unfaithfully and did what was evil in the eyes of Yahweh our God[a]. They abandoned him, turned their faces away from the dwelling place of Yahweh[c][b], and turned their backs.
translation:
  language: tl
  text: Sapagkat nagtaksil ang ating mga ninuno[a] at ginawa nila ang masama sa paningin ni Yahweh na ating Diyos. Iniwan nila siya, ibinaling nila ang kanilang mga mukha palayo sa tahanan ni Yahweh[b], at tumalikod sila[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “hindi naging tapat” o “gumawa nang may pagtataksil.” Madalas tumukoy ang pandiwang Hebreo sa paglabag sa katapatan, lalo na kaugnay ng tipan o pagsamba.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “mula sa tirahan ni Yahweh.” Maaari ring isaling “tabernakulo,” ngunit ang tinutukoy dito ay ang templo bilang tahanan ni Yahweh.
    reason: lexical_alternative
  - marker: c
    text: Literal na “ibinigay ang batok.” Ipinahihiwatig ng idyoma ang sadyang pagtanggi o paghihimagsik.
    reason: lexical_alternative
lexical_decisions:
- source_word: מָעֲלוּ
  choice: nagtaksil
  rationale: Ipinahahayag ng pandiwa ang paglabag sa katapatan, kadalasan sa konteksto ng tipan o pagsamba. Ang “nagtaksil” ay malinaw at likas sa modernong Tagalog, at pinananatili ang bigat ng sinadyang kawalang-katapatan.
- source_word: הָרַע
  choice: ang masama
  rationale: Kasama ng pandiwang עשה, nangangahulugan itong paggawa ng masama. Likas sa Tagalog ang “ginawa nila ang masama” at pinananatili nito ang malinaw na moral na paghatol.
- source_word: בְּעֵינֵי יְהוָה
  choice: sa paningin ni Yahweh
  rationale: Pinananatili nito ang karaniwang metaporang Hebreo at malinaw din sa kasalukuyang Tagalog.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang transliterasyon ng banal na pangalang YHWH sa halip na palitan ito ng isang titulo.
- source_word: וַיַּעַזְבֻהוּ
  choice: Iniwan nila siya
  rationale: Tuwirang ipinahahayag ng “iniwan” ang relihiyoso at kaugnayang pagtalikod sa Diyos nang hindi gumagamit ng makalumang pananalita.
- source_word: וַיַּסֵּבּוּ פְנֵיהֶם
  choice: inilayo nila ang kanilang mga mukha
  rationale: Pinananatili ang larawan ng sadyang pagharap palayo, habang natural ang pagkakabuo sa Tagalog.
- source_word: מִמִּשְׁכַּן יְהוָה
  choice: sa tahanan ni Yahweh
  rationale: Ang מִשְׁכָּן ay literal na tirahan o tahanan. Sa kontekstong ito, tumutukoy ito sa templo bilang tahanan ni Yahweh, hindi kinakailangang sa tabernakulo sa ilang.
- source_word: וַיִּתְּנוּ עֹרֶף
  choice: tumalikod sila
  rationale: Ang literal na pagbibigay ng batok ay idyoma ng pagtanggi o paghihimagsik. Ang “tumalikod sila” ang malinaw at likas na katumbas sa Tagalog at kaagapay ng naunang larawan ng paglalayo ng mukha.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang ginagamit sa talata ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalang nasa tekstong Hebreo sa halip na palitan ito ng titulo.
- issue: Kahulugan ng מִשְׁכָּן sa konteksto ng templo
  choice: tahanan ni Yahweh
  alternative: tabernakulo ni Yahweh; santuwaryo ni Yahweh
  rationale: Pinananatili ng “tahanan” ang batayang kahulugan ng salita at iniiwasang ipahiwatig na ang tinutukoy ay ang naunang tabernakulo sa ilang, samantalang ang konteksto ay ang templo.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang magkaugnay na larawang “inilayo ang kanilang mga mukha” at “tumalikod,” gayundin ang pangalang Yahweh at ang diwang may kaugnayan sa tipan ng pagtataksil.
