  text: וַ/יַּעֲל֤וּ בִֽ/יהוּדָה֙ וַ/יִּבְקָע֔וּ/הָ וַ/יִּשְׁבּ֗וּ אֵ֤ת כָּל הָ/רְכוּשׁ֙ הַ/נִּמְצָ֣א לְ/בֵית הַ/מֶּ֔לֶךְ וְ/גַם בָּנָ֖י/ו וְ/נָשָׁ֑י/ו וְ/לֹ֤א נִשְׁאַר ל/וֹ֙ בֵּ֔ן כִּ֥י אִם יְהוֹאָחָ֖ז קְטֹ֥ן בָּנָֽי/ו־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/017.yaml
  text: They came up against Judah and invaded it[a], and carried away all the possessions found in the king’s house, and also his sons and his wives, so that no son was left to him except Jehoahaz, the youngest of his sons.
translation:
  language: tl
  text: Sinalakay nila ang Juda at sapilitang pinasok ito. Tinangay nila ang lahat ng ari-ariang natagpuan sa palasyo ng hari, pati ang kanyang mga anak na lalaki at mga asawa. Kaya wala siyang natirang anak na lalaki maliban kay Jehoahaz[a], ang pinakabata sa kanyang mga anak na lalaki.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Malamang na si Jehoahaz din ang tinatawag na Ahaziah sa ibang mga talata. Ihambing ang 2 Hari 8:24–26 at 2 Cronica 22:1.
    reason: Pinananatili sa pangunahing teksto ang pangalang nasa Masoretic Text, habang nililinaw ang malamang na pagkakakilanlan nito sa pangalang ginagamit sa mga kaugnay na salaysay.
lexical_decisions:
- source_word: וַיַּעֲלוּ בִיהוּדָה
  choice: Sinalakay nila ang Juda
  rationale: Sa kontekstong militar, ang pag-akyat o pagpasok sa teritoryo ay isang paglusob. Ang “sinalakay” ay natural sa modernong Filipino at malinaw na ipinahahayag ang mapanlabang pagkilos.
- source_word: וַיִּבְקָעוּהָ
  choice: at sapilitang pinasok iyon
  rationale: Ang pandiwa ay may diwang pagbiyak o pagbutas upang makapasok. Ipinakikita ng “sapilitang pinasok” na nilampasan ng mga mananalakay ang mga depensa ng Juda nang hindi ipinapalagay ang isang tiyak na uri ng tanggulan.
- source_word: וַיִּשְׁבּוּ
  choice: Tinangay nila
  rationale: Karaniwang tumutukoy ang salita sa pagkuha bilang bihag. Dahil kapuwa ari-arian at mga tao ang kasunod na saklaw nito, ang “tinangay” ay angkop sa pandarambong at sapilitang pagdadala.
- source_word: כָּל הָרְכוּשׁ
  choice: ang lahat ng ari-arian
  rationale: Malawak na katawagan ang רְכוּשׁ para sa mga pag-aari o kayamanang maaaring kunin; malinaw at karaniwan ang “ari-arian.”
- source_word: הַנִּמְצָא לְבֵית הַמֶּלֶךְ
  choice: na natagpuan sa palasyo ng hari
  rationale: Pinananatili ng “natagpuan” ang tahasang diwa ng Hebrew, samantalang natural na ipinahahayag ng “palasyo” ang maharlikang tirahang tinutukoy ng “bahay ng hari.”
- source_word: וְגַם בָּנָיו וְנָשָׁיו
  choice: pati ang kanyang mga anak na lalaki at mga asawa
  rationale: Ipinahahayag ng “pati” ang idinagdag at bahagyang mariing puwersa ng גַּם. Nililinaw ng “anak na lalaki” ang kasarian na mahalaga sa kasunod na pangungusap.
- source_word: וְלֹא נִשְׁאַר לוֹ בֵּן
  choice: Kaya wala siyang natirang anak na lalaki
  rationale: 'Natural nitong ipinahahayag sa Filipino ang naging resulta: walang anak na lalaking naiwan sa kanya.'
- source_word: כִּי אִם
  choice: maliban kay
  rationale: Tuwirang ipinakikilala nito ang nag-iisang eksepsiyon.
- source_word: יְהוֹאָחָז
  choice: Jehoahaz
  rationale: Ito ang pangalang nasa Masoretic Text. Hindi ito tahimik na pinapalitan ng Ahaziah; inilalagay sa talababa ang posibleng pagkakakilanlan.
- source_word: קְטֹן בָּנָיו
  choice: ang bunso sa kanyang mga anak
  rationale: Sa konteksto ng magkakapatid, tumutukoy ang קָטֹן sa pinakabata, hindi sa pisikal na kaliitan.
theological_decisions:
- issue: Anyo ng pangalan ng natitirang anak ni Jehoram
  choice: Panatilihin ang “Jehoahaz” sa pangunahing teksto
  alternative: Gamitin ang “Ahaziah” ayon sa mga kaugnay na salaysay
  rationale: Jehoahaz ang pagbasa ng ibinigay na tekstong Hebrew. Upang hindi pag-isahin nang palihim ang magkaugnay na tradisyon ng pangalan, nananatili ito sa pangunahing teksto at ipinaliliwanag sa talababa ang malamang na pagkakakilanlan kay Ahaziah.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “palasyo” bilang natural na katumbas ng maharlikang “bahay,” at ang “sapilitang pinasok” upang mapanatili ang hiwalay na puwersa ng ikalawang pandiwang militar.
