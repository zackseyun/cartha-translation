  text: וַ/יָּ֨קָם יְהוֹרָ֜ם עַל מַמְלֶ֤כַת אָבִי/ו֙ וַ/יִּתְחַזַּ֔ק וַ/יַּהֲרֹ֥ג אֶת כָּל אֶחָ֖י/ו בֶּ/חָ֑רֶב וְ/גַ֖ם מִ/שָּׂרֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/004.yaml
  text: When Jehoram had risen over his father's kingdom and had strengthened himself[a], he killed all his brothers with the sword, and also some of the princes of Israel.
translation:
  language: tl
  text: Nang maluklok na si Jehoram bilang hari sa kaharian ng kanyang ama at napagtibay na niya ang kanyang kapangyarihan, pinatay niya sa tabak ang lahat ng kapatid niyang lalaki, pati ang ilan sa mga pinuno[a] ng Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Hebreo na isinaling “mga pinuno” ay maaari ring tumukoy sa “mga prinsipe” o “mga opisyal.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם עַל מַמְלֶכֶת אָבִיו
  choice: Nang maghari na si Jehoram sa kaharian ng kanyang ama
  rationale: Sa kontekstong maharlika, ang קום na may עַל ay tumutukoy sa pag-akyat o paghawak sa pamamahala. Likas sa modernong Tagalog ang “maghari ... sa kaharian,” at naipapahayag nito ang awtoridad nang hindi ginagawang simpleng pagdating lamang.
- source_word: וַיִּתְחַזַּק
  choice: mapatatag na niya ang kanyang kapangyarihan
  rationale: Ang hitpael ng חזק ay may reflexive na diwa ng pagpapalakas o pagpapatatag sa sarili. Sa kontekstong ito, malinaw at natural ang pagtukoy sa pagpapatatag ng kapangyarihan, ngunit hindi ito nililimitahan sa paraang militar lamang.
- source_word: וַיַּהֲרֹג
  choice: pinatay niya
  rationale: Tuwiran, malinaw, at kasalukuyang katumbas ng pandiwang Hebreo.
- source_word: אֶת כָּל אֶחָיו
  choice: ang lahat ng kanyang mga kapatid na lalaki
  rationale: Tiyak na mga lalaking kapatid ang tinutukoy ng Hebreo, kaya hindi ito pinalawak sa lahat ng uri ng kamag-anak o kapatid.
- source_word: בֶּחָרֶב
  choice: sa pamamagitan ng espada
  rationale: Pinananatili nito ang instrumental na diwa ng parirala at malinaw na inilalarawan ang paraan ng pagpatay.
- source_word: וְגַם מִשָּׂרֵי יִשְׂרָאֵל
  choice: pati ang ilan sa mga pinuno ng Israel
  rationale: Isinasalin ng “ilan sa” ang partitive na מִן. Malawak ang saklaw ng שָׂרִים—maaaring mga prinsipe, opisyal, o pinuno—kaya “mga pinuno” ang natural at hindi labis na tiyak na salin.
theological_decisions:
- issue: Tinutukoy ng “Israel” sa pariralang “mga pinuno ng Israel”
  choice: Pinanatili ang “Israel” nang hindi ito pinalitan ng “Juda.”
  alternative: mga pinuno ng Juda; mga pinuno ng bansa
  rationale: Maaaring gamitin ng Mga Cronica ang “Israel” sa mas malawak na diwang tipanan o dinastiko kahit nasa konteksto ng Juda. Dapat panatilihin ng salin ang katawagan at tensiyon ng pinagmulang teksto.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “maghari” para sa pag-akyat sa kapangyarihan, “mapatatag ... ang kanyang kapangyarihan” para sa reflexive na pagpapatibay ng posisyon, at “mga pinuno” bilang malawak at natural na katumbas ng שָׂרִים. Ang talababa ay inilagay pagkatapos ng “Israel” at may katugmang marker na [a] sa pangunahing teksto.
