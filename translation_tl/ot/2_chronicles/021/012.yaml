  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יָּבֹ֤א אֵלָי/ו֙ מִכְתָּ֔ב מֵֽ/אֵלִיָּ֥הוּ הַ/נָּבִ֖יא לֵ/אמֹ֑ר כֹּ֣ה אָמַ֣ר יְהוָ֗ה אֱלֹהֵי֙ דָּוִ֣יד אָבִ֔י/ךָ תַּ֗חַת אֲשֶׁ֤ר לֹֽא הָלַ֨כְתָּ֙ בְּ/דַרְכֵי֙ יְהוֹשָׁפָ֣ט אָבִ֔י/ךָ וּ/בְ/דַרְכֵ֖י אָסָ֥א מֶֽלֶךְ יְהוּדָֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/012.yaml
  text: 'Then a letter came to him from Elijah the prophet[a], saying, “Thus says Yahweh, the God of David your father: Because you have not walked in the ways of Jehoshaphat your father or in the ways of Asa king of Judah,”'
translation:
  language: tl
  text: 'Dumating sa kanya ang isang liham mula kay propeta Elias, na may ganitong nakasulat: “Ganito ang sabi ni Yahweh, ang Diyos ng ninuno mong si David: Dahil hindi ka lumakad sa mga daan ng iyong amang si Jehoshafat, ni[a] sa mga daan ni Asa na hari ng Juda,”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literal na “at sa mga daan ni Asa na hari ng Juda.” Sa Tagalog, natural gamitin ang “ni” pagkatapos ng isang negatibong pahayag: “hindi … ni …”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא אֵלָיו מִכְתָּב
  choice: Dumating sa kanya ang isang liham
  rationale: Pinananatili nito ang liham bilang simuno ng pandiwa at natural itong pakinggan sa makabagong Tagalog. Hindi na tahasang isinalin ang waw bilang “At” dahil sapat na ang pagkakasunod ng salaysay sa konteksto.
- source_word: מֵאֵלִיָּהוּ הַנָּבִיא
  choice: mula kay propeta Elias
  rationale: Karaniwang anyong Tagalog ang “Elias,” at malinaw at natural na isinasama ang titulong “propeta.”
- source_word: לֵאמֹר
  choice: na nagsasabi
  rationale: Tuwirang ipinakikilala nito ang nilalaman ng liham at pinananatili ang pormula ng siniping pananalita.
- source_word: כֹּה אָמַר
  choice: Ganito ang sabi
  rationale: Ito ang natural at marangal na katumbas sa Tagalog ng pormulang ginagamit sa pagpapahayag ng mensahe ng Diyos.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasatitik nito ang personal na pangalang banal sa halip na palitan ng isang titulo.
- source_word: אֱלֹהֵי דָּוִיד אָבִיךָ
  choice: ang Diyos ni David na iyong ninuno
  rationale: Sa kontekstong dinastiko, ang אָבִיךָ ay tumutukoy kay David bilang ninuno, hindi bilang agarang ama ni Jehoram. Nililinaw ito nang hindi binabago ang kaugnayang ipinahahayag ng Hebreo.
- source_word: תַּחַת אֲשֶׁר
  choice: Dahil
  rationale: Ipinakikilala ng parirala ang dahilan ng hatol na kasunod; “Dahil” ang malinaw at likas na katumbas sa makabagong Tagalog.
- source_word: לֹא הָלַכְתָּ בְּדַרְכֵי
  choice: hindi ka lumakad sa mga daan
  rationale: Pinananatili ang karaniwang metaporang Hebreo ng paglakad at mga daan bilang larawan ng asal at pamumuhay.
- source_word: יְהוֹשָׁפָט אָבִיךָ
  choice: iyong amang si Jehoshafat
  rationale: Dito ay ang aktuwal na ama ni Jehoram ang tinutukoy, kaya ang “ama” ang tuwiran at wastong salin.
- source_word: וּבְדַרְכֵי אָסָא מֶלֶךְ יְהוּדָה
  choice: ni sa mga daan ni Asa na hari ng Juda
  rationale: Bagaman literal na “at” ang וּ, likas sa Tagalog ang “ni” pagkatapos ng negatibong sugnay upang ipahayag na hindi niya sinunod ang alinman sa dalawang halimbawa.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehovah
  rationale: Tuwirang ginagamit sa tekstong Hebreo ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng titulo.
- issue: Kahulugan ng אָבִיךָ kaugnay ni David
  choice: iyong ninuno
  alternative: iyong ama
  rationale: Maaaring mangahulugan ang salitang Hebreo ng ama o ninuno. Dahil kabilang si Jehoram sa angkan ni David ngunit hindi niya agarang anak, “ninuno” ang malinaw na kontekstuwal na salin.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang biblikal na metapora ng “paglakad sa mga daan,” habang ginawang malinaw ang dinastikong gamit ng “ninuno” para kay David. Inilagay ang talababa sa mismong pangatnig na tinatalakay nito.
