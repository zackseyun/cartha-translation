revisions:
- from: 'Dumating sa kanya ang isang liham mula kay propeta Elias na nagsasabi, “Ganito ang sabi ni Yahweh, ang Diyos ni David na iyong ninuno: Dahil hindi ka lumakad sa mga daan ng iyong amang si Jehoshafat, ni[a] sa mga daan ni Asa na hari ng Juda,”'
  to: 'Dumating sa kanya ang isang liham mula kay propeta Elias, na may ganitong nakasulat: “Ganito ang sabi ni Yahweh, ang Diyos ng ninuno mong si David: Dahil hindi ka lumakad sa mga daan ng iyong amang si Jehoshafat, ni[a] sa mga daan ni Asa na hari ng Juda,”'
  rationale: Inayos ang pagpapakilala sa sipi upang malinaw na ang liham ang naglalaman ng mensahe, hindi upang magmukhang si Elias ang tinutukoy ng “na nagsasabi.” Inayos din ang ayos ng parirala tungkol kay David para sa mas malinaw na dinastikong kahulugan. Walang binagong kahulugan, antas ng register, pangalang pantangi, o talababang alternatibo.
