base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/013.yaml
  text: but you have walked in the way of the kings of Israel[a], and have led Judah and the inhabitants of Jerusalem into sexual immorality, as the house of Ahab led them into sexual immorality; and you have also killed your brothers of your father’s house[b], who were better than you.
translation:
  language: tl
  text: kundi namuhay ka ayon sa landas ng mga hari ng Israel, at inudyukan mo ang Juda at ang mga naninirahan sa Jerusalem na magpatutot[a], gaya ng pag-uudyok ng sambahayan ni Ahab sa kanila na magpatutot; pinatay mo rin ang iyong mga kapatid na kabilang sa sambahayan ng iyong ama, na mas mabubuti kaysa sa iyo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ang “magpatutot” ay propetikong larawan ng pagtataksil sa Diyos, na madalas na nahahayag sa pagsamba sa mga diyus-diyosan. Maaari ring isalin nang mas pormal: “ipinagpatutot.”'
    reason: lexical_alternative
  - marker: b
    text: Ang “sambahayan ni Ahab” ay tumutukoy sa naghaharing angkan o dinastiya ni Ahab.
    reason: cultural_note
lexical_decisions:
- source_word: וַתֵּלֶךְ בְּדֶרֶךְ
  choice: namuhay ka ayon sa landas ng
  rationale: Pinananatili ang metapora ng paglakad sa isang landas bilang paraan ng pamumuhay, ngunit ginagamit ang likas na modernong Tagalog na “namuhay ayon sa landas.”
- source_word: מַלְכֵי יִשְׂרָאֵל
  choice: mga hari ng Israel
  rationale: Tuwirang salin na nagpapanatili sa mahalagang makasaysayang pagkakaiba ng Israel at Juda.
- source_word: וַתַּזְנֶה אֶת יְהוּדָה וְאֶת יֹשְׁבֵי יְרוּשָׁלַם
  choice: itinulak mo ang Juda at ang mga naninirahan sa Jerusalem na magpatutot
  rationale: Ang anyong sanhi at matinding metapora ng זנה ay pinananatili. Sa kontekstong propetiko, tumutukoy ito sa pagtataksil sa Diyos, lalo na sa pagsamba sa mga diyus-diyosan, nang hindi pinapaliit ang salita sa isang interpretasyon lamang.
- source_word: כְּהַזְנוֹת בֵּית אַחְאָב
  choice: gaya ng ginawa ng sambahayan ni Ahab
  rationale: Ang paghahambing ay malinaw sa Tagalog; ang “ginawa” ay tumutukoy pabalik sa pagpapapatutot at umiiwas sa mabigat na pag-uulit.
- source_word: בֵּית אַחְאָב
  choice: sambahayan ni Ahab
  rationale: Ang “sambahayan” ay maaaring tumukoy sa pamilya at dinastiya, gaya ng saklaw ng Hebreong בֵּית.
- source_word: וְגַם
  choice: rin
  rationale: Ipinapakita ang dagdag at pinalalalang paratang pagkatapos ng pagtataksil.
- source_word: אַחֶיךָ בֵית אָבִיךָ
  choice: iyong mga kapatid na kabilang sa sambahayan ng iyong ama
  rationale: Nililinaw ang ugnayan ng mga kapatid sa maharlikang sambahayan ng ama nang hindi inaalis ang parehong sangkap ng Hebreo.
- source_word: הַטּוֹבִים מִמְּךָ
  choice: na mas mabubuti kaysa sa iyo
  rationale: Pinananatili ang tuwirang paghahambing at bagsik ng pagsaway, nang hindi dinaragdagan ng “karapat-dapat” o ibang pagpapakahulugan.
- source_word: הָרָגְתָּ
  choice: pinatay mo
  rationale: Tuwirang katumbas ng pandiwang “pumatay”; hindi ginawang “pinaslang” o “minurder” upang hindi magdagdag sa leksikal na kahulugan.
theological_decisions:
- issue: Metaporikal na puwersa ng זנה sa konteksto ng pagtalikod ng hari
  choice: Panatilihin sa pangunahing teksto ang matinding larawang “magpatutot,” na may talababa tungkol sa pagtataksil sa Diyos at idolatriya.
  alternative: Isalin lamang bilang “magtaksil sa Diyos” o “sumamba sa mga diyus-diyosan.”
  rationale: Ang tahasang interpretasyon bilang idolatriya lamang ay magpapakitid sa tunay na metapora. Ang literal na larawan, na ipinaliliwanag sa talababa, ay nagpapanatili sa propetikong tindi at teolohikal na lawak.
- issue: Kahulugan ng בֵּית אַחְאָב
  choice: “sambahayan ni Ahab,” na ipinaliliwanag bilang naghaharing angkan o dinastiya
  alternative: “dinastiya ni Ahab” sa pangunahing teksto
  rationale: Pinananatili ng “sambahayan” ang biblikal na larawan ng בית, samantalang nililinaw ng talababa ang pampolitika at pampamilyang saklaw nito.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog. Pinanatili ang biblikal na metapora ng “landas” at ang matinding larawan ng pagpapatutot, habang inilagay sa talababa ang kinakailangang paliwanag. Ang mga panandang talababa [a] at [b] ay kapwa nasa pangunahing teksto.
