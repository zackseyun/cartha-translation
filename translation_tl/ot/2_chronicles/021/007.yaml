id: 2CH.21.7
reference: 2 Chronicles 21:7
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/לֹא אָבָ֣ה יְהוָ֗ה לְ/הַשְׁחִית֙ אֶת בֵּ֣ית דָּוִ֔יד לְמַ֣עַן הַ/בְּרִ֔ית אֲשֶׁ֥ר כָּרַ֖ת לְ/דָוִ֑יד וְ/כַ/אֲשֶׁ֣ר אָמַ֗ר לָ/תֵ֨ת ל֥/וֹ נִ֛יר וּ/לְ/בָנָ֖י/ו כָּל הַ/יָּמִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/007.yaml
  text: Yet Yahweh was not willing to destroy the house of David[a], because of the covenant that he had made with David[c][b], and as he had said that he would give to him and to his sons a lamp for all days.
translation:
  language: tl
  text: Gayunman, hindi niloob ni Yahweh na wasakin ang sambahayan ni David dahil sa tipang ginawa niya kay David, at gaya ng sinabi niya, bibigyan niya si David at ang mga anak nitong lalaki ng isang ilawan[a] sa lahat ng panahon.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “liwanag.” Ang ilawan ay malamang na larawan ng patuloy na angkan o paghahari ni David.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “sa lahat ng mga araw”; maaari ding isalin na “magpakailanman.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא אָבָה
  choice: Gayunman, hindi niloob
  rationale: Ipinahahayag ng אָבָה ang pasiya o pagkukusang pumayag, hindi lamang damdamin o pagnanais. Likas at marangal sa Tagalog ang “hindi niloob,” at ipinakikita ng “Gayunman” ang bahagyang pagsalungat sa naunang salaysay ng paghatol.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
- source_word: לְהַשְׁחִית
  choice: lipulin
  rationale: Sa kontekstong ito, tumutukoy ang pandiwa sa lubusang pagkawasak ng sambahayan o angkan ni David. Malinaw at natural ang “lipulin.”
- source_word: בֵּית דָּוִיד
  choice: ang sambahayan ni David
  rationale: Pinananatili ng “sambahayan” ang biblikal na idyoma ng בֵּית habang maaari rin itong tumukoy sa angkan at dinastiya, nang hindi tahasang pinapalitan ang talinghaga ng “dinastiya.”
- source_word: לְמַעַן הַבְּרִית
  choice: dahil sa tipan
  rationale: Ipinahahayag ng לְמַעַן ang dahilan o batayan ng hindi paglipol ni Yahweh.
- source_word: כָּרַת ... לְדָוִיד
  choice: ginawa niya kay David
  rationale: Ang literal na Hebreong idyomang “pumutol ng tipan” ay likas na isinasalin sa Tagalog bilang “gumawa ng tipan.” Ang “kay David” ay nagpapanatili sa anyo ng pariralang Hebreo nang hindi nagpapasiya nang higit sa kinakailangan kung ito ay “sa” o “para kay” David.
- source_word: וְכַאֲשֶׁר אָמַר
  choice: at dahil sinabi niyang
  rationale: Pinananatili ang karaniwang kahulugan ng אָמַר na “sinabi” sa halip na gawing mas interpretibong “ipinangako.” Sa pangungusap, ang naunang sinabi ng Diyos ay isa ring batayan ng kanyang pagkilos.
- source_word: לָתֵת לוֹ נִיר
  choice: bibigyan niya si David ... ng isang ilawan
  rationale: Ang נִיר ay isang ilawan bilang talinghaga sa pagpapatuloy ng linya at paghahari ni David. Pinananatili ang kongkretong larawan sa halip na palitan ito ng paliwanag na “dinastiya.” Inulit ang pangalang David upang maging malinaw ang tinutukoy ng panghalip sa natural na Tagalog.
- source_word: וּלְבָנָיו
  choice: at ang mga anak nito
  rationale: Tuwirang tinutukoy ng Hebreo ang “mga anak na lalaki,” ngunit sa modernong Tagalog, karaniwang naipahahayag ng “mga anak” ang mga anak na lalaki ayon sa konteksto. Ang “nito” ay umiiwas sa sunod-sunod na malabong “niya” at tumutukoy kay David.
- source_word: כָּל הַיָּמִים
  choice: habang panahon
  rationale: Natural na Tagalog ito para sa nagpapatuloy na tagal ng Hebreong “lahat ng mga araw,” ngunit hindi kasing tahasang sistematikong pahayag ng “magpakailanman.” Inilalagay sa talababa ang literal na anyo.
theological_decisions:
- issue: Ang dinastikong talinghaga ng נִיר sa konteksto ng tipan kay David
  choice: ilawan
  alternative: liwanag; nagpapatuloy na angkan o paghahari
  rationale: Pinananatili ng “ilawan” ang talinghaga at ang kaugnayan nito sa ibang biblikal na pahayag tungkol sa pagpapatuloy ng linya ni David, nang hindi nilulutas ang larawan sa isang paliwanag lamang.
- issue: Ang tagal na ipinahahayag ng כָּל הַיָּמִים
  choice: habang panahon
  alternative: sa lahat ng mga araw; magpakailanman
  rationale: Ang “habang panahon” ay natural at malapit sa diwa ng idyoma. Hindi nito pinalalakas nang walang paliwanag ang literal na “lahat ng mga araw” tungo sa mas abstraktong “magpakailanman,” kaya nakatala ang literal na anyo sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “sambahayan” at “ilawan” upang mapanatili ang mahahalagang idyoma at talinghaga ng Hebreo, samantalang inayos ang mga panghalip para maiwasan ang kalabuan sa Tagalog.
