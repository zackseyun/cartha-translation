- from: Gayunman, hindi niloob ni Yahweh na lipulin ang sambahayan ni David dahil sa tipang ginawa niya kay David at dahil sinabi niyang bibigyan niya si David at ang mga anak nito ng isang ilawan[a] habang panahon.[b]
  to: Gayunman, hindi niloob ni Yahweh na wasakin ang sambahayan ni David dahil sa tipang ginawa niya kay David, at gaya ng sinabi niya, bibigyan niya si David at ang mga anak nitong lalaki ng isang ilawan[a] sa lahat ng panahon.[b]
  rationale: Inayos ang pangatnig upang maipakita ang “gaya ng sinabi niya” sa halip na isang dagdag na dahilang ipinakilala ng “dahil.” Nilinaw rin ang “mga anak na lalaki,” pinili ang mas neutral na “wasakin,” at pinanatili ang dinastikong talinghaga ng “ilawan” at ang maingat na pagpapahayag ng tagal sa pangunahing teksto at talababa.
