  source_fidelity: 'Tapat ang salin sa Hebreo: naipapahayag ang pagsunod niya sa masamang huwaran ng mga hari ng Israel at ng sambahayan ni Ahab, ang pag-aasawa niya sa anak ni Ahab, at ang moral na pagsusuri ni Yahweh. Ang ''sambahayan ni Ahab'' ay angkop na malawak na katumbas ng בֵּית אַחְאָב at hindi labis na nagtatakda kung sambahayan o dinastiya ang diin.'
