id: 2CH.21.6
reference: 2 Chronicles 21:6
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יֵּ֜לֶךְ בְּ/דֶ֣רֶךְ מַלְכֵ֣י יִשְׂרָאֵ֗ל כַּ/אֲשֶׁ֤ר עָשׂוּ֙ בֵּ֣ית אַחְאָ֔ב כִּ֚י בַּת אַחְאָ֔ב הָ֥יְתָה לּ֖/וֹ אִשָּׁ֑ה וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֥י יְהוָֽה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/006.yaml
  text: He walked in the way of the kings of Israel, as the house of Ahab had done, for Ahab’s daughter was his wife; and he did what was evil in the eyes of Yahweh.
translation:
  language: tl
  text: Namuhay siya ayon sa landas ng mga hari ng Israel, gaya ng ginawa ng sambahayan ni Ahab, sapagkat ang anak na babae ni Ahab ang kanyang asawa. Ginawa niya ang masama sa paningin ni Yahweh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּלֶךְ בְּדֶרֶךְ
  choice: Namuhay siya ayon sa landas
  rationale: Ang tambalang idyoma ay tumutukoy sa asal o paraan ng pamumuhay. Pinananatili ng “landas” ang metapora, samantalang nililinaw ng “namuhay” ang di-literal na diwa sa natural na Tagalog.
- source_word: מַלְכֵי יִשְׂרָאֵל
  choice: ng mga hari ng Israel
  rationale: Tuwirang inilalarawan ang mga pinuno ng hilagang kaharian bilang huwarang sinundan niya.
- source_word: כַּאֲשֶׁר עָשׂוּ בֵּית אַחְאָב
  choice: gaya ng ginawa ng sambahayan ni Ahab
  rationale: Ang בֵּית sa kontekstong maharlika ay maaaring tumukoy sa sambahayan o dinastiya. Ang “sambahayan” ay natural sa Tagalog at hindi labis na nililimitahan ang saklaw sa pormal na dinastiya lamang.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala nito ang paliwanag kung bakit nakaayon ang kanyang asal sa sambahayan ni Ahab.
- source_word: בַּת אַחְאָב הָיְתָה לּוֹ אִשָּׁה
  choice: ang anak na babae ni Ahab ang kanyang asawa
  rationale: Tapat itong nagsasaad ng ugnayang mag-asawa nang hindi ipinahihiwatig na noon lamang naganap ang kasal. Hindi idinagdag ang pangalang Atalia sapagkat hindi ito binanggit sa talata.
- source_word: וַיַּעַשׂ הָרַע
  choice: Ginawa niya ang masama
  rationale: Inilalarawan ng may-artikulong הָרַע ang bagay na masama; ang parirala ay malinaw, maikli, at likas sa Tagalog.
- source_word: בְּעֵינֵי יְהוָה
  choice: sa paningin ni Yahweh
  rationale: Pinananatili ang karaniwang Hebreong idyoma ng pagsusuring moral at ang personal na pangalan ng Diyos.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasatitik ang Tetragrammaton bilang personal na pangalan sa halip na palitan ito ng titulong “PANGINOON.”
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Tuwirang ginagamit ng tekstong Hebreo ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalan at iniiwasang palitan ito ng isang titulo.
- issue: Saklaw ng בֵּית אַחְאָב
  choice: sambahayan ni Ahab
  alternative: dinastiya ni Ahab; angkan ni Ahab
  rationale: Maaaring tumukoy ang salita sa maharlikang sambahayan o dinastiya. Ang “sambahayan” ay nagpapanatili ng lawak ng kahulugan nang hindi tahasang nagpapasya na pormal na dinastiya lamang ang tinutukoy.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “namuhay ayon sa landas” upang mapanatili ang Hebreong metapora habang malinaw na asal at paraan ng buhay ang tinutukoy. Walang kinakailangang talababa.
