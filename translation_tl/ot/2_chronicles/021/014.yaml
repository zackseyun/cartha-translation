id: 2CH.21.14
reference: 2 Chronicles 21:14
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: הִנֵּ֣ה יְהוָ֗ה נֹגֵ֛ף מַגֵּפָ֥ה גְדוֹלָ֖ה בְּ/עַמֶּ֑/ךָ וּ/בְ/בָנֶ֥י/ךָ וּ/בְ/נָשֶׁ֖י/ךָ וּ/בְ/כָל רְכוּשֶֽׁ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/014.yaml
  text: Behold[a], Yahweh is striking your people, your sons, your wives, and all your possessions with a great plague.
translation:
  language: tl
  text: Narito[a], malapit nang hampasin ni Yahweh ng matinding salot ang iyong bayan, ang iyong mga anak na lalaki, ang iyong mga asawa, at ang lahat ng iyong ari-arian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Narito, sasalutin ni Yahweh … ng matinding salot,” o “Narito, hahampasin ni Yahweh … ng isang matinding hampas/kapighatian.” Ang anyong participle sa Hebreo ay maaaring tumukoy sa nalalapit na pagkilos, kasalukuyang pagkilos, o payak na hinaharap; ang מַגֵּפָה ay maaaring mangahulugang salot o matinding hampas na ipinataw ng Diyos.'
    reason: Pinananatili ang gramatikal na kalabuan ng נֹגֵף at ang leksikal na saklaw ng מַגֵּפָה, nang hindi nagdaragdag ng bilang ng mga kausap.
lexical_decisions:
- source_word: הִנֵּה
  choice: Narito
  rationale: Nananawagan ito ng pansin at nagbibigay ng taimtim at agarang diin sa pahayag ng propeta.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang pinananatili ang pangalang tipan na nasa tekstong Hebreo.
- source_word: נֹגֵף
  choice: malapit nang salutin
  rationale: Ang participle kasunod ng הִנֵּה ay maaaring magpahiwatig ng pagkilos na nalalapit na; natural na ipinahahayag ito sa Tagalog ng “malapit nang,” samantalang ang “salutin” ay angkop sa kasunod na מַגֵּפָה.
- source_word: מַגֵּפָה גְדוֹלָה
  choice: ng matinding salot
  rationale: Maaaring tumukoy ang parirala sa malubhang salot o sa isang matinding hampas na ipinataw ng Diyos. Ang “matinding salot” ay natural sa modernong Tagalog at angkop sa konteksto ng hatol.
- source_word: בְּעַמְּךָ
  choice: ang iyong bayan
  rationale: Ang בְּ sa konstruksiyong ito ay tumutukoy sa tatamaan o daranas ng salot; ang “bayan” ay angkop para sa people bilang pangkat na nasasakupan.
- source_word: וּבְבָנֶיךָ
  choice: ang iyong mga anak na lalaki
  rationale: Tiyak na panlalaking maramihan ang בָּנִים, kaya pinananatili ang kahulugang “mga anak na lalaki” sa halip na gawing pangkalahatang “mga anak.”
- source_word: וּבְנָשֶׁיךָ
  choice: ang iyong mga asawa
  rationale: Sa kontekstong may hulaping paari at maramihan, ang נָשִׁים ay tumutukoy sa mga asawa, hindi sa kababaihan sa pangkalahatan.
- source_word: וּבְכָל רְכוּשֶׁךָ
  choice: at ang lahat ng iyong ari-arian
  rationale: Saklaw ng רְכוּשׁ ang mga pag-aari, kayamanan, o kagamitan; malinaw at malawak ang “ari-arian” sa kasalukuyang Tagalog.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehovah
  rationale: Pangalan mismo na יְהוָה ang nasa Hebreo, kaya pinananatili ang Yahweh sa halip na palitan ng titulo.
- issue: Puwersa ng participle na נֹגֵף sa pahayag ng propeta
  choice: 'nalalapit na hinaharap: “malapit nang salutin”'
  alternative: 'kasalukuyang nagaganap: “sinasalot” o payak na hinaharap: “sasalutin”'
  rationale: Ang הִנֵּה na sinusundan ng participle ay karaniwang nagpapahayag ng nalalapit na pagkilos. Gayunman, tunay na posible rin ang kasalukuyan o payak na hinaharap, kaya itinatala ang mga iyon sa talababa.
- issue: Saklaw ng מַגֵּפָה bilang hatol
  choice: salot
  alternative: matinding hampas o kapighatian
  rationale: Pinakamalinaw sa konteksto ang “salot,” ngunit hindi nililimitahan ng salitang Hebreo ang diwa sa epidemya lamang; maaari rin itong tumukoy sa mabigat na hampas na ipinataw ng Diyos.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “Narito” bilang taimtim na panawag-pansin, “malapit nang” para sa agarang pahayag ng propeta, at “ari-arian” bilang malawak at kasalukuyang katawagan sa mga pag-aari.
