base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/001.yaml
  text: And Jehoshaphat slept with his fathers and was buried with his fathers in the city of David[b][a], and Jehoram his son reigned in his place.
translation:
  language: tl
  text: At si Jehosafat ay namahinga kasama ng kanyang mga ninuno[a], at inilibing siyang kasama ng kanyang mga ninuno sa Lungsod ni David. Ang anak niyang si Jehoram ang naghari bilang kahalili niya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “namatay”; literal na “nahiga kasama ng kanyang mga ninuno.” Ang idyomang Hebreo ay tumutukoy sa pagkamatay at pakikiisa sa mga ninunong yumao.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב ... עִם אֲבֹתָיו
  choice: namahinga kasama ng kanyang mga ninuno
  rationale: Ang parirala ay nakaugaliang pormula sa mga ulat tungkol sa pagkamatay ng mga hari. Pinananatili ng “namahinga” ang banayad at marangal na talinghaga ng Hebreo, habang ipinapaliwanag ng talababa na kamatayan ang tinutukoy.
- source_word: עִם אֲבֹתָיו
  choice: kasama ng kanyang mga ninuno
  rationale: Sa modernong Tagalog, mas malinaw at likas ang “mga ninuno” kaysa literal na “mga ama” para sa dinastikong idyomang tumutukoy sa mga yumaong salinlahi.
- source_word: וַיִּקָּבֵר
  choice: inilibing siya
  rationale: Tuwirang salin ng pasibong pandiwa na angkop sa sunod-sunod na salaysay.
- source_word: בְּעִיר דָּוִיד
  choice: sa Lungsod ni David
  rationale: Ginamit bilang nakikilalang pangalang pantangi ng lugar at natural na anyo sa Tagalog.
- source_word: וַיִּמְלֹךְ
  choice: naghari
  rationale: Pinananatili ang karaniwang pormula ng paghaharing maharlika sa halip na palawakin ito bilang “naging hari.”
- source_word: תַּחְתָּיו
  choice: bilang kahalili niya
  rationale: Natural na ipinahahayag sa Tagalog ang paghalili sa trono at hindi nagkakaroon ng labis na kontrast na maaaring idulot ng “sa halip niya.”
- source_word: יְהוֹשָׁפָט
  choice: Jehosafat
  rationale: Ginamit ang nakaugaliang anyo ng pangalang biblikal sa Filipino.
- source_word: יְהוֹרָם
  choice: Jehoram
  rationale: Malapit na transliterasyon ng buong anyong Hebreo na יְהוֹרָם.
