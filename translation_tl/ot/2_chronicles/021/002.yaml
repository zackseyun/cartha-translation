source:
  edition: WLC
  text: וְ/לֽ/וֹ אַחִ֞ים בְּנֵ֣י יְהוֹשָׁפָ֗ט עֲזַרְיָ֤ה וִֽ/יחִיאֵל֙ וּ/זְכַרְיָ֣הוּ וַ/עֲזַרְיָ֔הוּ וּ/מִיכָאֵ֖ל וּ/שְׁפַטְיָ֑הוּ כָּל אֵ֕לֶּה בְּנֵ֥י יְהוֹשָׁפָ֖ט מֶ֥לֶךְ יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/002.yaml
  text: 'And he had brothers[a], the sons of Jehoshaphat: Azariah, Jehiel, Zechariah, Azariahu, Michael, and Shephatiah[b]. All these were the sons of Jehoshaphat king of Israel.'
translation:
  language: tl
  text: 'At mayroon siyang mga kapatid na lalaki, na mga anak ni Josafat: sina Azaria, Jehiel, Zacarias, Azariahu[b], Micael, at Sefatias. Lahat sila ay mga anak ni Josafat, na hari ng Israel.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “hari ng Israel.” Mas karaniwang kinikilalang hari ng Juda si Josafat sa kasaysayan; maaaring ginagamit dito ng Mga Cronica ang “Israel” sa mas malawak na diwang tumutukoy sa bayang tipan.
    reason: alternative_reading
  - marker: b
    text: Iba ang baybay sa Hebreo ng ikaapat na pangalan kaysa sa unang Azaria; pinanatili rito ang pagkakaiba sa anyong “Azariahu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/לֽ/וֹ אַחִים
  choice: At mayroon siyang mga kapatid na lalaki
  rationale: Ang literal na “at sa kaniya ay may mga kapatid” ay isang Hebreong idyoma ng pagmamay-ari. Ang “mayroon siyang” ay natural sa Tagalog, at nililinaw ng “mga kapatid na lalaki” ang panlalaking anyo ng אַחִים.
- source_word: בְּנֵי יְהוֹשָׁפָט
  choice: na mga anak ni Josafat
  rationale: Pinananatili ang tahasang ugnayang pangangkanan at ang pormal na genealogical na estilo ng Hebreo.
- source_word: עֲזַרְיָה
  choice: Azaria
  rationale: Malapit na transliterasyon ng unang pangalan, habang pinananatiling naiiba sa kasunod na anyong עֲזַרְיָהוּ.
- source_word: וִֽיחִיאֵל
  choice: Jehiel
  rationale: Ginamit ang nakikilalang anyong biblikal ng personal na pangalan sa Filipino.
- source_word: וּ/זְכַרְיָהוּ
  choice: Zacarias
  rationale: Ginamit ang karaniwang nakikilalang anyong biblikal sa Filipino.
- source_word: וַ/עֲזַרְיָהוּ
  choice: Azariahu
  rationale: Pinananatili ang mas mahabang anyo ng pangalang Hebreo upang maiba ito sa unang Azaria sa talaan.
- source_word: וּ/מִיכָאֵל
  choice: Micael
  rationale: Ginamit ang natural at nakikilalang transliterasyong Filipino.
- source_word: וּ/שְׁפַטְיָהוּ
  choice: Sefatias
  rationale: Ginamit ang nakikilalang anyong biblikal na angkop sa baybay at bigkas ng Filipino.
- source_word: כָּל אֵלֶּה
  choice: Lahat sila
  rationale: Natural na resumptibong parirala sa Tagalog para sa lahat ng lalaking bagong binanggit.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: hari ng Israel
  rationale: Tuwirang sinusunod ang WLC, na nagsasabing Israel at hindi Juda; hindi ito iniayon sa karaniwang historikal na titulo ni Josafat.
theological_decisions:
- issue: Ang titulo ni Josafat bilang מֶלֶךְ יִשְׂרָאֵל
  choice: hari ng Israel
  alternative: hari ng Juda
  rationale: Tahasan ang “Israel” sa tekstong Hebreo. Ang pagpapalit nito ng “Juda” ay magiging interpretatibong pagharmonisa; pinananatili ng salin ang posibleng mas malawak na tipanang gamit ng “Israel” sa Mga Cronica.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang payak na daloy ng talaangkanan, nilinaw ang kasarian ng “mga kapatid,” at iniwasang baguhin ang “Israel” tungo sa “Juda.”
