base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/009.yaml
  text: So Jehoram crossed over with his commanders and all the chariots with him. And it happened that he arose by night and struck Edom[a], which had surrounded him, and the commanders of the chariots.
translation:
  language: tl
  text: Kaya tumawid si Jehoram kasama ang kanyang mga pinuno at ang lahat ng karwaheng pandigma na kasama niya. Nang gabi ay bumangon siya at sinalakay ang mga Edomita na nakapaligid sa kanya, pati ang mga pinuno ng mga karwaheng pandigma.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga kumandante ng mga karwahe.” Maaaring tumukoy ang pariralang Hebreo sa mga opisyal ng puwersang gumagamit ng mga karwahe.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲבֹר
  choice: tumawid
  rationale: Pinananatili nito ang konkretong diwa ng pagdaan o pagtawid nang hindi tinutukoy ang destinasyon o taktikang hindi sinabi sa Hebreo.
- source_word: שָׂרָיו
  choice: kanyang mga pinuno
  rationale: Maaaring tumukoy ang שַׂר sa pinuno, opisyal, o kumandante. Ang “mga pinuno” ay likas sa Filipino at hindi labis na nililimitahan ang tungkulin nila.
- source_word: הָרֶכֶב
  choice: mga karwaheng pandigma
  rationale: Ang רֶכֶב ay maaaring kolektibong tumukoy sa mga karwahe o hukbong gumagamit ng mga ito. Nililinaw ng “pandigma” ang kontekstong militar.
- source_word: וַיְהִי קָם לַיְלָה
  choice: Pagsapit ng gabi, bumangon siya
  rationale: Natural itong salaysay sa modernong Filipino at pinananatili ang kilos na ginawa sa gabi, bagaman hindi literal na isinasalin ang pormulang וַיְהִי.
- source_word: וַיַּךְ
  choice: sinalakay
  rationale: Sa kontekstong militar, natural na katumbas ito ng malawak na pandiwang נכה. Hindi nito ipinapalagay na ganap niyang tinalo ang kalaban.
- source_word: אֱדוֹם
  choice: mga Edomita
  rationale: Ang pangalang-bansa na Edom ay ginagamit dito bilang kolektibong tumutukoy sa mga puwersa nito; mas natural sa Filipino ang “mga Edomita.”
- source_word: הַסּוֹבֵב אֵלָיו
  choice: na nakapaligid sa kanya
  rationale: Tuwirang ipinahahayag nito ang larawan ng mga puwersang pumalibot kay Jehoram.
- source_word: שָׂרֵי הָרָכֶב
  choice: mga pinuno ng mga karwaheng pandigma
  rationale: Malapit ito sa estruktura ng Hebreo at hindi tiyak na nagpapasya kung ang mga opisyal ay mga pinuno ng buong chariot corps o mga pinunong sakay ng mga karwahe.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “karwaheng pandigma” upang maiwasan ang karaniwang modernong kahulugan ng “karwahe” bilang sasakyang panglibing. Napanatili ang payak na pagkakasunod-sunod ng salaysay at ang hindi tiyak na lawak ng tagumpay ni Jehoram.
