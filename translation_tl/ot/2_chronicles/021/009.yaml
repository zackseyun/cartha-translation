revisions:
- from: Kaya tumawid si Jehoram kasama ang kanyang mga pinuno at ang lahat ng karwaheng pandigma na kasama niya. Pagsapit ng gabi, bumangon siya at sinalakay ang mga Edomita na nakapaligid sa kanya, pati ang mga pinuno ng mga karwaheng pandigma.[a]
  to: Kaya tumawid si Jehoram kasama ang kanyang mga pinuno at ang lahat ng karwaheng pandigma na kasama niya. Nang gabi ay bumangon siya at sinalakay ang mga Edomita na nakapaligid sa kanya, pati ang mga pinuno ng mga karwaheng pandigma.[a]
  rationale: Binago ang pantukoy ng panahon upang maipahayag na ang pagbangon ay naganap sa gabi, nang hindi ipinapalagay na naganap ito mismo sa pagsapit ng gabi. Inayos din ang alternatibo sa talababa upang manatiling malapit sa hindi tiyak na saklaw ng pariralang Hebreo.
