  text: בְּ/יָמָי/ו֙ פָּשַׁ֣ע אֱד֔וֹם מִ/תַּ֖חַת יַד יְהוּדָ֑ה וַ/יַּמְלִ֥יכוּ עֲלֵי/הֶ֖ם מֶֽלֶךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/008.yaml
  text: In his days Edom rebelled from under the hand of Judah and made a king over themselves[a].
translation:
  language: tl
  text: Noong panahon niya, naghimagsik ang Edom at kumawala sa kapangyarihan ng Juda[a]. Nagluklok sila ng hari upang mamuno sa kanila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal na Hebreo, “mula sa ilalim ng kamay ng Juda.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּיָמָיו
  choice: Noong panahon niya
  rationale: Likas na salin ng temporal na idyomang tumutukoy sa panahon ng paghahari ni Jehoram, nang hindi ipinapasok sa talata ang pangalang wala sa Hebreo.
- source_word: פָּשַׁע
  choice: naghimagsik
  rationale: Sa kontekstong pampolitika, tumutukoy ito sa pag-aalsa o pagrerebelde ng Edom laban sa kapangyarihan ng Juda, hindi lamang sa pangkalahatang pagkakasala.
- source_word: אֱדוֹם
  choice: Edom
  rationale: Karaniwang transliterasyon sa Filipino ng pangalan ng bayan at lupain.
- source_word: מִתַּחַת יַד יְהוּדָה
  choice: kumawala sa kapangyarihan ng Juda
  rationale: Ipinahahayag sa natural na modernong Filipino ang Hebreong idyoma na literal na ‘mula sa ilalim ng kamay ng Juda,’ na nangangahulugang pagkalas sa pamamahala o kontrol nito.
- source_word: וַיַּמְלִיכוּ
  choice: Nagluklok sila
  rationale: Ang Hiphil ng מלך ay nangangahulugang maglagay o magtalaga ng isang tao bilang hari; ang ‘nagluklok’ ay malinaw at angkop sa dignidad ng salaysay.
- source_word: עֲלֵיהֶם מֶלֶךְ
  choice: ng hari upang mamuno sa kanila
  rationale: Nililinaw nito na naglagay ang mga Edomita ng isang hari sa ibabaw nila, habang pinananatili ang di-tiyak na ‘isang hari’ na natural na ipinahahayag sa Filipino nang walang pantukoy.
