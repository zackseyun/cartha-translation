translation_notes:
  register: Modernong Filipino na natural at marangal. Ginamit ang ‘naghimagsik’ upang mapanatili ang lakas ng pandiwang pampolitika, at ‘kumawala sa kapangyarihan’ upang malinaw na maipahayag ang kahulugan ng Hebreong idyoma. Hinati sa dalawang pangungusap para sa malinaw at madaling pagbasa.
