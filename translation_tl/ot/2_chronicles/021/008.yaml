  source_fidelity: 'Tumpak ang salin sa Hebreo: ang temporal na “Noong panahon niya” ay tumutugon sa בְּיָמָיו; ang “naghimagsik” sa פָּשַׁע sa kontekstong pampolitika; ang “kumawala sa kapangyarihan ng Juda” ay wastong pagpapahayag ng מִתַּחַת יַד יְהוּדָה; at ang pagluklok ng hari upang mamuno sa kanila ay tumutugon sa וַיַּמְלִיכוּ עֲלֵיהֶם מֶלֶךְ. Hindi nito ipinapasok ang pangalan ni Jehoram na wala sa mismong talata.'
