  yaml_path: translation/ot/2_chronicles/021/005.yaml
  text: Jehoram was thirty-two years old when he became king, and he reigned eight years in Jerusalem.
translation:
  language: tl
  text: Si Jehoram ay tatlumpu't dalawang taong gulang nang magsimula siyang maghari. Naghari siya sa Jerusalem sa loob ng walong taon.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן שְׁלֹשִׁים וּשְׁתַּיִם שָׁנָה
  choice: Tatlumpu't dalawang taong gulang
  rationale: Ang בֶּן kasama ng bilang at שָׁנָה ay karaniwang pormula sa Hebreo para tukuyin ang edad; natural itong ipinahahayag sa Tagalog bilang “... taong gulang.”
- source_word: יְהוֹרָם
  choice: Jehoram
  rationale: Pinananatili ang karaniwang anyo ng pangalang ginamit sa sangguniang Ingles at malinaw nitong kinakatawan ang buong anyong Hebreo na יְהוֹרָם.
- source_word: בְּמָלְכוֹ
  choice: nang siya ay maging hari
  rationale: Ang בְּ na sinusundan ng infinitive construct at hulaping panghalip ay tumutukoy sa panahon ng pagluklok niya bilang hari; malinaw at natural ang ganitong pahayag sa makabagong Tagalog.
- source_word: וּשְׁמוֹנֶה שָׁנִים
  choice: at walong taon
  rationale: Tuwirang ipinahahayag nito ang tagal ng paghahari.
- source_word: מָלַךְ
  choice: siyang naghari
  rationale: Ang pandiwa ay nangangahulugang maghari o maging hari; ang “naghari” ang natural na anyo kapag may binabanggit na tagal.
- source_word: בִּירוּשָׁלִָם
  choice: sa Jerusalem
  rationale: Ang pang-ukol ay lokatibo at tumutukoy sa Jerusalem bilang lugar o sentro ng kanyang paghahari.
