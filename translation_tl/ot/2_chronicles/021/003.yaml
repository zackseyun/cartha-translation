base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/003.yaml
  text: Their father gave them many gifts of silver[a], gold, and precious things, along with fortified cities in Judah; but he gave the kingdom to Jehoram, because he was the firstborn.
translation:
  language: tl
  text: Binigyan sila ng kanilang ama ng maraming kaloob na pilak, ginto, at mahahalagang bagay[a], pati ng mga pinatibay na lungsod sa Juda. Ngunit ibinigay niya kay Jehoram ang kaharian sapagkat siya ang panganay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga piling bagay” o “mamahaling kaloob.” Malawak ang saklaw ng salitang Hebreo at maaari itong tumukoy sa mahahalaga o piling mga bagay.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן לָהֶם אֲבִיהֶם
  choice: Binigyan sila ng kanilang ama
  rationale: Likas na ayos sa makabagong Tagalog para sa payak na kilos sa salaysay; malinaw na ang ama ang nagbigay at sila ang tumanggap.
- source_word: מַתָּנוֹת רַבּוֹת
  choice: maraming kaloob
  rationale: Pinananatili ang diwang dami ng רַבּוֹת at ang marangal ngunit madaling maunawaang kahulugan ng מַתָּנוֹת.
- source_word: לְכֶסֶף וּלְזָהָב
  choice: na pilak, ginto
  rationale: Ipinakikita ang mga uri o nilalaman ng mga kaloob nang hindi labis na nililimitahan ang gamit ng lemed.
- source_word: וּלְמִגְדָּנוֹת
  choice: at mahahalagang bagay[a]
  rationale: Ang מִגְדָּנוֹת ay maaaring tumukoy sa mahahalaga, piling, o mamahaling bagay. Malawak at natural ang 'mahahalagang bagay,' habang inilalahad sa talababa ang tunay na saklaw ng salita.
- source_word: עִם עָרֵי מְצֻרוֹת בִּיהוּדָה
  choice: pati ng mga pinatibay na lungsod sa Juda
  rationale: Natural na ipinahahayag ng 'pati' ang karagdagang kaloob; malinaw na inilalarawan ng 'pinatibay na lungsod' ang mga lungsod na inihanda para sa pagtatanggol.
- source_word: וְאֶת הַמַּמְלָכָה נָתַן לִיהוֹרָם
  choice: Ngunit ibinigay niya kay Jehoram ang kaharian
  rationale: Bagaman karaniwang 'at' ang וְ, malinaw na may paghahambing dito sa mga kaloob sa magkakapatid at sa kahariang ibinigay kay Jehoram; natural na ipinahahayag iyon ng 'ngunit.'
- source_word: כִּי הוּא הַבְּכוֹר
  choice: sapagkat siya ang panganay
  rationale: Ipinahahayag ng כִּי ang dahilan, at pinananatili ng 'panganay' ang katayuang pampamilya ng הַבְּכוֹר.
