  terminology: Wasto at pare-pareho ang mga katawagang “kaloob,” “kaharian,” “panganay,” at “Juda.” Ang “mahahalagang bagay” ay maingat na malawak na salin para sa מִגְדָּנוֹת, at sinusuportahan nang sapat ng talababa.
