  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang 'kaloob' sa halip na mas kolokyal na 'regalo,' at 'pinatibay na lungsod' bilang madaling maunawaang paglalarawan ng mga lungsod na may tanggulan.
