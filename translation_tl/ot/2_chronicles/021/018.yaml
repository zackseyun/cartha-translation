id: 2CH.21.18
reference: 2 Chronicles 21:18
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/אַחֲרֵ֖י כָּל זֹ֑את נְגָפ֨/וֹ יְהוָ֧ה בְּ/מֵעָ֛י/ו לָ/חֳלִ֖י לְ/אֵ֥ין מַרְפֵּֽא־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/018.yaml
  text: And after all this[a], Yahweh struck him in his intestines with an incurable disease.
translation:
  language: tl
  text: At pagkatapos ng lahat ng ito, sinalot siya ni Yahweh ng isang sakit sa bituka na walang lunas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “na hindi mapagagaling”; literal, “na walang kagalingan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחֲרֵי כָּל זֹאת
  choice: At pagkatapos ng lahat ng ito
  rationale: Pinananatili ang pang-ugnay na וְ at ang malinaw na temporal na pagkakasunod-sunod ng salaysay; ang “lahat ng ito” ay likas na kolektibong pagtukoy sa mga naunang pangyayari.
- source_word: נְגָפוֹ
  choice: sinalot siya
  rationale: Ipinapahayag ng pandiwa ang tuwirang matinding pagpaparusa o pagpapahirap na ipinataw sa kanya. Ang “sinalot” ay natural sa makabagong Filipino at angkop sa pagkakasakit nang hindi ipinapalagay na literal na pisikal na paghampas.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin bilang transliterasyon ng personal na pangalan ng Diyos sa tekstong Hebreo, sa halip na palitan ito ng isang titulo.
- source_word: בְּמֵעָיו
  choice: sa bituka
  rationale: Ang מֵעֶה ay tumutukoy sa mga panloob na bahagi ng katawan, lalo na sa bituka. Ang “sa bituka” ay malinaw at natural sa kasalukuyang Filipino.
- source_word: לָחֳלִי
  choice: ng isang sakit
  rationale: Ipinakikita rito ang karamdamang naging paraan o bunga ng paghampas; ang “isang sakit” ay payak at malinaw sa konteksto.
- source_word: לְאֵין מַרְפֵּא
  choice: na walang lunas
  rationale: Natural nitong ipinahahayag ang literal na diwa na walang kagalingan o lunas, habang pinananatili ang kawalang-pag-asa ng kalagayan.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Tuwirang ginagamit sa talata ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng titulong “Panginoon.”
- issue: Tuwirang pagkilos ng Diyos sa karamdaman
  choice: sinalot siya ni Yahweh
  alternative: nagkasakit siya
  rationale: Tahasan sa Hebreo na si Yahweh ang simuno ng pagkilos. Hindi ito pinahina sa isang di-tiyak o likas lamang na pagkakasakit.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “sinalot” upang mapanatili ang bigat ng banal na paghampas nang hindi magmukhang literal na hampas sa katawan. Inilagay ang talababa pagkatapos ng “walang lunas,” ang pariralang aktuwal nitong nililinaw.
