source:
  edition: WLC
  text: וַ/יִּפְשַׁ֨ע אֱד֜וֹם מִ/תַּ֣חַת יַד יְהוּדָ֗ה עַ֚ד הַ/יּ֣וֹם הַ/זֶּ֔ה אָ֣ז תִּפְשַׁ֥ע לִבְנָ֛ה בָּ/עֵ֥ת הַ/הִ֖יא מִ/תַּ֣חַת יָד֑/וֹ כִּ֣י עָזַ֔ב אֶת יְהוָ֖ה אֱלֹהֵ֥י אֲבֹתָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/010.yaml
  text: So Edom rebelled from under the hand of Judah to this day[a]. At that time Libnah also rebelled from under his hand, because he had forsaken Yahweh[c][b], the God of his fathers.
translation:
  language: tl
  text: Kaya naghimagsik ang Edom laban sa Juda at hindi na nasakop ng Juda hanggang sa araw na ito.[a] Nang panahong iyon, naghimagsik din ang Libna laban sa pamamahala niya.[b] Sapagkat tinalikuran niya si Yahweh, ang Diyos ng kanyang mga ninuno.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin ang “naghimagsik” bilang “nag-alsa” o “kumalas.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “mula sa ilalim ng kamay ng Juda” at “mula sa ilalim ng kanyang kamay”—isang idyoma para sa pagkalas sa kapangyarihan o pamamahala.
    reason: cultural_note
  - marker: c
    text: Maaaring ipinaliliwanag ng sugnay na ito ang mga kaguluhan ni Jehoram sa kabuuan, o mas partikular ang paghihimagsik ng Libna.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּפְשַׁע / תִּפְשַׁע (פשע)
  choice: naghimagsik
  rationale: Sa kontekstong pampolitika, tumutukoy ang pandiwa sa pag-aalsa o pagkalas sa kapangyarihan ng isang namumuno. Ang “naghimagsik” ay malinaw at may sapat na bigat sa makabagong Tagalog.
- source_word: מִתַּחַת יַד / מִתַּחַת יָדוֹ
  choice: laban sa pamamahala ng / laban sa pamamahala niya
  rationale: Ang literal na “mula sa ilalim ng kamay” ay idyoma para sa pagkalas sa kapangyarihan o paghahari. Isinalin itong likas sa Tagalog bilang paglaban sa pamamahala, habang ipinaliliwanag sa talababa ang larawang Hebreo.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: at gayon pa rin hanggang sa araw na ito
  rationale: Ipinahihiwatig ng pormulang Hebreo na nagpatuloy hanggang sa panahon ng manunulat ang kalagayang bunga ng paghihimagsik. Nilinaw ito nang hindi tinutukoy kung ano ang eksaktong petsa ng “araw na ito.”
- source_word: אָז
  choice: Nang panahong iyon
  rationale: Likas na ipinapahayag nito sa Tagalog ang panahong tinutukoy at ang kaugnayan sa naunang paghihimagsik.
- source_word: לִבְנָה
  choice: Libna
  rationale: Karaniwang anyong Tagalog ng pangalan ng lugar.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinahahayag nito ang ugnayang sanhi na nasa Hebreo, nang hindi nilulutas kung isa o kapwa paghihimagsik ang saklaw ng paliwanag.
- source_word: עָזַב
  choice: tinalikuran
  rationale: Pinananatili nito ang relasyonal at teolohikal na bigat ng pag-iwan ni Jehoram sa Diyos, at mas natural sa Tagalog kaysa sa literal na “iniwan” sa ganitong konteksto.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang personal na pangalan ng Diyos na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֵי אֲבֹתָיו
  choice: ang Diyos ng kanyang mga ninuno
  rationale: Tumpak at likas na makabagong Tagalog para sa Diyos na sinamba ng mga naunang salinlahi ni Jehoram; mas inklusibo sa diwa ng salinlahi kaysa sa literal na “mga ama.”
theological_decisions:
- issue: Saklaw ng sanhi sa pangwakas na sugnay
  choice: Pinanatili ang sanhi bilang pangkalahatang paliwanag na maaaring tumukoy sa mga kaguluhang isinalaysay, nang hindi tahasang nililimitahan ang saklaw nito.
  alternative: Maaaring ang “sapagkat tinalikuran niya si Yahweh” ay tumutukoy lamang sa paghihimagsik ng Libna, ang pinakamalapit na pangyayari sa sugnay.
  rationale: Sa pananaw ng Chronicler, ang mga suliraning pampolitika ay inuugnay sa pagtataksil ni Jehoram sa Diyos, ngunit hindi ganap na tiyak sa sintaks kung ang pangwakas na sugnay ay nagpapaliwanag sa dalawang paghihimagsik o sa Libna lamang. Itinatala ng talababa ang tunay na kalabuan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “pamamahala” upang likas na maipahayag ang idyomang Hebreo, habang pinanatili sa talababa ang literal na larawan ng “kamay.” Ang “mga ninuno” ay mas karaniwan at madaling maunawaan ngayon kaysa “mga ama” para sa sunod-sunod na salinlahi.
