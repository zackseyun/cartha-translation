base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/019.yaml
  text: And after some time[a], at the end of two years, his bowels came out because of his sickness, and he died of severe diseases[b]. And his people made no burning for him like the burning for his fathers.
translation:
  language: tl
  text: At nang makalipas ang ilang panahon—nang sumapit ang katapusan ng dalawang taon—lumabas ang kanyang mga bituka[a] dahil sa kanyang karamdaman, at namatay siya sa matitinding karamdaman. Hindi nagsagawa ang kanyang bayan ng pagsusunog[b] para sa kanya, gaya ng pagsusunog para sa kanyang mga ninuno.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga laman-loob.” Ang Hebreo ay literal na tumutukoy sa mga panloob na sangkap ng katawan.
    reason: lexical_alternative
  - marker: b
    text: Ang “pagsusunog” dito ay malamang na parangal na kaugnay ng paglilibing, gaya ng pagsusunog ng mga sangkap na mabango, at hindi literal na pagsusunog sa kanyang bangkay. Ihambing ang mga kaugalian sa maharlikang paglilibing sa ibang bahagi ng Mga Cronica.
    reason: cultural_note
lexical_decisions:
- source_word: לְיָמִים מִיָּמִים
  choice: nang makalipas ang ilang panahon
  rationale: Ang Hebreong idyoma ay nagsasaad ng paglipas ng di-tiyak na haba ng panahon. Ang idiomatikong salin ay malinaw at likas sa modernong Tagalog.
- source_word: וּכְעֵת צֵאת הַקֵּץ לְיָמִים שְׁנַיִם
  choice: nang sumapit ang katapusan ng dalawang taon
  rationale: Pinananatili nito ang tiyak na hangganang dalawang taon at ang diwa ng pagdating ng takdang wakas.
- source_word: מֵעָיו
  choice: kanyang mga bituka
  rationale: Tumutukoy ang salita sa mga panloob na sangkap ng katawan, lalo na sa mga bituka. Ang “mga bituka” ay kongkreto, malinaw, at hindi pinapalambot ang graphic na paglalarawan.
- source_word: יָצְאוּ מֵעָיו
  choice: lumabas ang kanyang mga bituka
  rationale: Pinananatili ang karaniwang kahulugan ng יצא na “lumabas” at ang tahasang pisikal na pangyayari sa teksto.
- source_word: עִם חָלְיוֹ
  choice: dahil sa kanyang karamdaman
  rationale: Bagaman karaniwang nangangahulugang “kasama” ang עִם, sa kontekstong ito ay natural itong nagpapahayag ng kaakibat na sanhi o kalagayan.
- source_word: בְּתַחֲלֻאִים רָעִים
  choice: sa matitinding karamdaman
  rationale: Pinananatili ang maramihang anyo at ang bigat ng pang-uri, habang gumagamit ng malinaw na modernong Tagalog.
- source_word: שְׂרֵפָה
  choice: pagsusunog
  rationale: Malapit ito sa leksikal na anyo ng Hebreo at hindi agad nagpapasya sa mismong bagay na sinunog; nililinaw ng talababa ang malamang na kontekstong pampaglibing.
- source_word: כִּשְׂרֵפַת אֲבֹתָיו
  choice: gaya ng pagsusunog para sa kanyang mga ninuno
  rationale: Pinananatili ang paghahambing sa parangal na ibinigay sa mga naunang hari o ninuno nang hindi ipinahihiwatig na sinunog ang kanilang mga bangkay.
theological_decisions:
- issue: Kalikasan ng שְׂרֵפָה sa konteksto ng paglilibing sa hari
  choice: Pinanatili sa pangunahing teksto ang di-tiyak na “pagsusunog,” at ipinaliwanag sa talababa na malamang itong parangal sa paglilibing, gaya ng pagsusunog ng mga pabango.
  alternative: Pagkremang literal sa bangkay, o isang ganap na di-tiyak na ritwal ng pagsusunog.
  rationale: Sa konteksto ng Mga Cronica, ang diin ay nasa parangal na ipinagkait kay Jehoram ngunit ibinigay sa mga naunang hari. Ang salin ay nagpapanatili ng leksikal na lapit at hindi lubusang isinasara ang tunay na saklaw ng termino.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang graphic na paglalarawan at ang maramihang “mga karamdaman.” Ginamit ang mga gitling na pahaba upang malinaw na iugnay ang di-tiyak na paglipas ng panahon sa tiyak na pagtatapos ng dalawang taon. Inilagay ang bawat talababa sa mismong pariralang tinutukoy nito.
