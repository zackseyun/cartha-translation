base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/020.yaml
  text: He was thirty-two years old when he began to reign[a], and he reigned eight years in Jerusalem. Then he departed with no regret, and they buried him in the city of David, but not in the tombs of the kings.
translation:
  language: tl
  text: Tatlumpu’t dalawang taong gulang siya nang magsimula siyang maghari, at walong taon siyang naghari sa Jerusalem. Pagkatapos, pumanaw siya nang hindi pinanghinayangan.[a] Inilibing siya sa Lungsod ni David, ngunit hindi sa mga libingan ng mga hari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pumanaw siya nang walang pagnanais,” ayon sa mas literal na diwa ng pariralang Hebreo.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן שְׁלֹשִׁים וּשְׁתַּיִם
  choice: Tatlumpu’t dalawang taong gulang
  rationale: Karaniwang idyomang Hebreo ito para tukuyin ang edad; ang natural na katumbas sa modernong Tagalog ay malinaw na naghahayag na siya ay 32 taong gulang.
- source_word: בְמָלְכוֹ
  choice: nang magsimula siyang maghari
  rationale: Sa pormulang nagsasaad ng edad ng hari, tinutukoy nito ang panahon ng pagluklok o pagsisimula ng paghahari.
- source_word: וּשְׁמוֹנֶה שָׁנִים מָלַךְ
  choice: walong taon siyang naghari
  rationale: Natural at tuwirang salin ng pormulang panghari.
- source_word: בִּירוּשָׁלִָם
  choice: sa Jerusalem
  rationale: Tuwirang gamit na panlunan.
- source_word: וַיֵּלֶךְ
  choice: pumanaw siya
  rationale: Sa konteksto ng pangwakas na ulat tungkol sa buhay ng hari, ang ‘umalis’ ay isang eupemismo para sa kamatayan. Pinananatili ng ‘pumanaw’ ang mahinahong tono nang hindi gumagamit ng tahasang ‘namatay.’
- source_word: בְּלֹא חֶמְדָּה
  choice: at walang nanghinayang sa kanya
  rationale: Ang חֶמְדָּה ay may diwang pagnanais, kasiyahan, o pagpapahalaga. Sa konteksto, ipinahihiwatig na walang nagluksa o nakadama ng panghihinayang sa kanyang pagpanaw; inilalahad sa talababa ang mas literal na anyo upang mapanatili ang leksikal na posibilidad.
- source_word: וַיִּקְבְּרֻהוּ
  choice: Inilibing siya
  rationale: Ang maramihang pandiwang Hebreo na walang tiyak na simuno ay natural na maisasalin sa Tagalog sa balintiyak na anyo.
- source_word: בְּעִיר דָּוִיד
  choice: sa Lungsod ni David
  rationale: Karaniwang katawagan sa pook na ito sa Jerusalem; ginamit ang malaking titik bilang pangalan ng lugar.
- source_word: וְלֹא בְּקִבְרוֹת הַמְּלָכִים
  choice: ngunit hindi sa mga libingan ng mga hari
  rationale: Ang ‘libingan’ ay malinaw at natural para sa קִבְרוֹת sa konteksto ng maharlikang paglilibing.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang ‘pumanaw’ upang mapanatili ang eupemismo ng Hebreo, at inilagay ang talababa sa mismong pariralang may leksikal na kalabuan.
