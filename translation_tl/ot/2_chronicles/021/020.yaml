  naturalness: Natural at marangal ang Tagalog ng talata. Ang “Pumanaw siya nang hindi pinanghinayangan” ay mas maayos na daloy kaysa sa “pumanaw siya, at walang nanghinayang sa kanya.”
  terminology: Ang “Lungsod ni David” at “mga libingan ng mga hari” ay angkop at pare-pareho sa karaniwang gamit. Ang “pumanaw” ay wastong eupemismo para sa וַיֵּלֶךְ sa kontekstong ito.
