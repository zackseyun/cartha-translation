base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/015.yaml
  text: And you yourself will suffer many illnesses[a], with a disease of your bowels, until your bowels come out because of the disease[b], day after day.
translation:
  language: tl
  text: At ikaw mismo ay daranas ng maraming karamdaman, kabilang ang sakit sa iyong mga bituka[a], hanggang sa lumabas ang iyong mga bituka dahil sa sakit, sa loob ng maraming araw.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Hebreo ay maaaring tumukoy nang mas malawak sa mga panloob na sangkap ng katawan.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “mga araw sa ibabaw ng mga araw,” isang idyomang maaaring mangahulugang “araw-araw” o “sa loob ng maraming araw.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה
  choice: At ikaw mismo
  rationale: Ang hiwalay na panghalip ay nagbibigay-diin sa mismong kausap; pinananatili ito ng “ikaw mismo.”
- source_word: בָּחֳלָיִם רַבִּים
  choice: ay daranas ng maraming karamdaman
  rationale: Walang tahasang pandiwa sa Hebreo, kaya ipinahiwatig ang kalagayang daranasin. Pinananatili ng “maraming karamdaman” ang maramihang anyo at natural ito sa Filipino.
- source_word: בְּמַחֲלֵה מֵעֶיךָ
  choice: kabilang ang sakit sa iyong mga bituka
  rationale: Ipinakikilala ng parirala ang tiyak na karamdamang kaugnay ng naunang pangkalahatang pahayag. Ang “kabilang ang” ay likas na Filipino at hindi ginagawang separative ang pang-ukol na בְּ.
- source_word: מֵעֶיךָ
  choice: iyong mga bituka
  rationale: Ang מֵעֶה ay tumutukoy sa mga panloob na sangkap ng katawan, lalo na sa bituka. Ang “mga bituka” ay malinaw at karaniwang katawagan sa modernong Filipino, bagaman mas malawak nang bahagya ang saklaw ng Hebreo.
- source_word: עַד יֵצְאוּ מֵעֶיךָ
  choice: hanggang sa lumabas ang iyong mga bituka
  rationale: Tuwirang inilalarawan ng Hebreo ang malagim na bunga ng sakit; hindi ito pinalalambot sa salin.
- source_word: מִן הַחֹלִי
  choice: dahil sa sakit
  rationale: 'Ang מִן ay may sanhiang diwa rito: ang paglabas ng mga bituka ay bunga ng sakit.'
- source_word: יָמִים עַל יָמִים
  choice: sa paglipas ng mga araw
  rationale: Ipinahihiwatig ng idyoma ang tuloy-tuloy na paglala sa magkakasunod na mga araw. Iniiwasan ng pariralang ito ang maling pahiwatig na paulit-ulit na lalabas ang mga bituka araw-araw.
