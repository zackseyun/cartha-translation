  register: Makabagong Filipino na marangal ngunit tuwiran. Pinanatili ang diin sa “ikaw mismo” at ang tahasang paglalarawan sa malubhang bunga ng sakit. Ginamit ang “sa paglipas ng mga araw” upang maging natural at malinaw ang duratibong idyoma.
