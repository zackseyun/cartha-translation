  text: וַ/יָּ֨עַר יְהוָ֜ה עַל יְהוֹרָ֗ם אֵ֣ת ר֤וּחַ הַ/פְּלִשְׁתִּים֙ וְ/הָ֣/עַרְבִ֔ים אֲשֶׁ֖ר עַל יַ֥ד כּוּשִֽׁים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/016.yaml
  text: And Yahweh stirred up against Jehoram the spirit of the Philistines and of the Arabians who were near the Cushites[a][b][c].
translation:
  language: tl
  text: At pinukaw ni Yahweh laban kay Jehoram ang espiritu ng mga Filisteo at ng mga Arabe na malapit sa mga Cusita.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “pinukaw” ay maaari ring isaling “inudyukan” o “ginising upang kumilos.” Ipinahihiwatig ng pandiwang Hebreo na si Yahweh ang nagbangon sa mga bayang ito upang kumilos laban kay Jehoram.
    reason: lexical_alternative
  - marker: b
    text: O “na nasa tabi ng mga Cusita.” Maaari ring ilarawan ng parirala ang mga Arabe bilang mga karatig ng mga Cusita.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּעַר
  choice: pinukaw
  rationale: Ipinahahayag ng pandiwa na si Yahweh ang nag-udyok sa mga bayan na kumilos nang may pagkapoot; natural sa Filipino ang “pinukaw” at hindi nito nililimitahan ang kilos sa pahintulot lamang.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: עַל יְהוֹרָם
  choice: laban kay Jehoram
  rationale: Sa konteksto ng pag-uudyok sa mapanlabang pagkilos, ang עַל ay nagpapahiwatig ng pagsalungat.
- source_word: רוּחַ
  choice: ang espiritu
  rationale: Pinananatili ang malawak at matalinghagang saklaw ng רוּחַ bilang puwersa o saloobing nagtutulak sa pagkilos, sa halip na ipakahulugan lamang bilang “poot.”
- source_word: הַפְּלִשְׁתִּים
  choice: mga Filisteo
  rationale: Karaniwang modernong Tagalog na tawag sa sinaunang pangkat-etniko.
- source_word: וְהָעַרְבִים
  choice: at ng mga Arabe
  rationale: Ang pag-uulit ng “ng” ay malinaw na inuugnay kapwa ang mga Filisteo at mga Arabe sa “espiritu,” at ang “mga Arabe” ay natural sa modernong Filipino.
- source_word: אֲשֶׁר עַל יַד כּוּשִׁים
  choice: na naninirahan malapit sa mga Cusita
  rationale: Ang עַל יַד ay pinakamalamang na lokatibo rito, “malapit sa” o “katabi ng.” Idinagdag ang “naninirahan” upang maging natural at malinaw sa Filipino na ang parirala ay tumutukoy sa heograpikong kinaroroonan ng mga Arabe.
theological_decisions:
- issue: Ang pagkilos ng Diyos sa pagbangon ng mga kaaway laban kay Jehoram
  choice: Tahasang sinabi na si Yahweh ang pumukaw sa espiritu ng mga bayan laban kay Jehoram.
  alternative: Pinahintulutan lamang ni Yahweh na lumitaw ang dati nang pagkapoot.
  rationale: Direktang iniuugnay ng pandiwang Hebreo kay Yahweh ang pagkilos. Pinananatili ng salin ang teolohikal na tensiyong ito nang hindi dinaragdagan ng paliwanag tungkol sa paraan o lawak ng banal na pagkilos.
- issue: Kahulugan ng רוּחַ sa konteksto
  choice: espiritu
  alternative: saloobin o pagkapoot
  rationale: Ang literal na larawan ay sadyang pinanatili dahil maaaring tumukoy ang salita sa panloob na udyok o disposisyong nagtutulak sa mga bayan; hindi ito pinatapang bilang “pagkapoot” lamang.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang pangalang “Yahweh” at ang larawang “espiritu,” habang ginawang likas sa Filipino ang heograpikong parirala.
