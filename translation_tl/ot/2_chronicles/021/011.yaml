base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/011.yaml
  text: He also made high places in the hill country of Judah[a], led the inhabitants of Jerusalem into prostitution[b], and led Judah astray.
translation:
  language: tl
  text: Nagtayo rin siya ng mga sambahan sa matataas na lugar sa kabundukan ng Juda. Inudyukan niyang magpatutot ang mga naninirahan sa Jerusalem[a], at iniligaw niya ang Juda[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “inudyukan niyang makiapid ang mga naninirahan sa Jerusalem.” Gumagamit ang Hebreo ng pananalitang tumutukoy sa prostitusyon na maaari ring maglarawan ng pagtataksil sa tipan at pagtalikod sa Diyos.
    reason: lexical_alternative
  - marker: b
    text: O “itinaboy niya ang Juda” o “inilayo niya ang Juda sa PANGINOON.” Hindi tahasang binabanggit sa Hebreo ang PANGINOON bilang pinagtalikuran, ngunit ipinahihiwatig ito ng konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם הוּא
  choice: rin siya
  rationale: Pinananatili ng “rin” ang diwang pandagdag at pagbibigay-diin ng גַּם kasabay ng panghalip.
- source_word: עָשָׂה בָמוֹת
  choice: nagtayo ... ng mga sambahan sa matataas na lugar
  rationale: Bagaman karaniwang “gumawa” ang עָשָׂה, mas likas sa Filipino ang “nagtayo” para sa mga lugar ng pagsamba. Nililinaw ng “mga sambahan sa matataas na lugar” ang teknikal na gamit ng בָמוֹת bilang mga pook-sambahan, na sa kontekstong ito ay di-nararapat na pagsamba.
- source_word: בְּהָרֵי יְהוּדָה
  choice: sa kabundukan ng Juda
  rationale: Maaaring tumukoy ang הָרִים sa mga bundok o sa isang bulubunduking rehiyon; maikli at natural ang “kabundukan ng Juda.”
- source_word: וַיֶּזֶן
  choice: inudyukan ... na magpatutot
  rationale: Causative ang anyo ng pandiwang mula sa זנה. Pinananatili ng “magpatutot” ang matapang na larawan ng prostitusyon na maaari ring tumukoy sa pagtataksil sa tipan at pagtalikod sa Diyos.
- source_word: יֹשְׁבֵי יְרוּשָׁלִַם
  choice: ang mga naninirahan sa Jerusalem
  rationale: Tuwirang ipinapahayag nito ang kolektibong kahulugan ng “mga naninirahan” at natural sa makabagong Filipino.
- source_word: וַיַּדַּח
  choice: iniligaw
  rationale: Sa causative na gamit, maaaring mangahulugan ang נדח na iligaw o itaboy. Ang “iniligaw” ang pinakanatural dito at angkop sa konteksto ng pagtalikod sa wastong katapatan.
- source_word: אֶת יְהוּדָה
  choice: ang Juda
  rationale: Pinananatili ang Juda bilang kolektibong tawag sa bayan o kaharian.
theological_decisions:
- issue: Kung tahasang sasabihing inilayo ni Jehoram ang Juda sa PANGINOON
  choice: 'Panatilihing di-binabanggit sa pangunahing teksto ang pinagmulan o layon ng pagkaligaw: “iniligaw niya ang Juda.”'
  alternative: “inilayo niya ang Juda sa PANGINOON”
  rationale: Malinaw sa konteksto na pagtalikod sa PANGINOON ang tinutukoy, ngunit walang tahasang katumbas ng “sa PANGINOON” sa Hebreo. Pinananatili ng salin ang ikli at di-tahasang anyo ng pinagmulan.
- issue: Kung literal na seksuwal na prostitusyon lamang o espirituwal na pagtataksil ang וַיֶּזֶן
  choice: Gamitin ang larawan ng prostitusyon sa pangunahing teksto at ipaliwanag sa talababa ang saklaw nito.
  alternative: “inudyukan niyang magtaksil sa Diyos”
  rationale: Ang זנה ay maaaring tumukoy sa prostitusyon o seksuwal na imoralidad at ginagamit din bilang larawan ng relihiyosong pagtalikod. Hindi nilulutas ng salin ang sadyang magkasanib na pahiwatig.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mga sambahan sa matataas na lugar” sa halip na literal ngunit malabong “matataas na lugar.” Pinanatili ang matapang na larawan ng prostitusyon at ang di-tahasang layon ng pagkaligaw sa Hebreo.
