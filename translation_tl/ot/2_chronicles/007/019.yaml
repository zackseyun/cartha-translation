    issue: Ang “upang maglingkod” ay nagpapasok ng ugnayang layunin.
    rationale: 'Ang Hebreo ay may magkasunod na mga pandiwa: “pumunta/kumalakad” at “maglingkod.” Mas tapat na panatilihin ang koordinasyon sa Tagalog.'
  - severity: low
    issue: Medyo literal at hindi gaanong likas ang “inilagay ko sa harapan ninyo.”
    rationale: Ang “iniharap ko sa inyo” ay natural na katumbas ng idyomang “set before you” at pinananatili ang diwa na ang mga tuntunin at utos ay inilahad sa kanila.
  revised_text: Ngunit kung tatalikod kayo at iiwan ninyo ang aking mga tuntunin at mga utos na iniharap ko sa inyo, at pupunta kayo at maglilingkod sa ibang mga diyos at yuyukod sa kanila,
