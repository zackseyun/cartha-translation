base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/019.yaml
  text: But if you turn away and abandon my statutes and my commandments that I have set before you, and go and serve other gods and bow down to them,
translation:
  language: tl
  text: Ngunit kung tatalikod kayo at iiwan ninyo ang aking mga tuntunin at mga utos na iniharap ko sa inyo, at pupunta kayo at maglilingkod sa ibang mga diyos at yuyukod sa kanila,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תְּשׁוּבוּן
  choice: tatalikod
  rationale: Sa kontekstong ito, ang pandiwa ay tumutukoy sa pagtalikod sa Diyos at sa kaniyang mga utos; likas at malinaw itong ipinahahayag ng “tatalikod.”
- source_word: וַעֲזַבְתֶּם
  choice: iiwan ninyo
  rationale: Pinananatili ang tuwirang diwa ng pag-abandona o pag-iwan sa mga tuntunin at utos.
- source_word: חֻקּוֹתַי
  choice: aking mga tuntunin
  rationale: Ang “mga tuntunin” ay dignidad at madaling maunawaang katumbas ng mga itinakdang alituntunin.
- source_word: מִצְוֹתַי
  choice: mga utos
  rationale: Tuwirang katumbas ng mga ipinag-uutos ng Diyos.
- source_word: נָתַתִּי לִפְנֵיכֶם
  choice: inilagay ko sa harapan ninyo
  rationale: Pinananatili ang konkretong Hebreong idyoma at ang diwang malinaw na iniharap sa kanila ang mga utos.
- source_word: וַהֲלַכְתֶּם וַעֲבַדְתֶּם
  choice: hahayo kayo upang maglingkod
  rationale: Ipinakikita ang sunod-sunod na kilos ng paghayo at paglilingkod nang natural sa Tagalog.
- source_word: וְהִשְׁתַּחֲוִיתֶם
  choice: yumukod
  rationale: Pinananatili ang pisikal na larawan ng pagpapatirapa o pagyukod bilang pagsamba, nang hindi dinaragdagan ang teksto.
theological_decisions:
- issue: Ugnayan ng pagtalikod, paglilingkod, at pagyukod sa ibang mga diyos
  choice: 'Panatilihin ang magkakaugnay ngunit magkakaibang kilos: tatalikod, iiwan, maglilingkod, at yuyukod.'
  alternative: Ibuod ang lahat bilang “sasamba sa ibang mga diyos.”
  rationale: Mahalagang mapanatili ang retorikal na pag-iipon ng mga pandiwa sa Hebreo at huwag paliitin ang babala sa iisang pangkalahatang termino.
translation_notes:
  register: Modernong Filipino Tagalog na dignidad at malinaw sa karaniwang mambabasa. Ginamit ang pangmaramihang “kayo/ninyo” ayon sa Hebreo. Pinanatili ang hulihang kuwit dahil nagpapatuloy ang pangungusap sa kasunod na talata.
