  text: וַ/הֲקִ֣ימוֹתִ֔י אֵ֖ת כִּסֵּ֣א מַלְכוּתֶ֑/ךָ כַּ/אֲשֶׁ֣ר כָּרַ֗תִּי לְ/דָוִ֤יד אָבִ֨י/ךָ֙ לֵ/אמֹ֔ר לֹֽא יִכָּרֵ֤ת לְ/ךָ֙ אִ֔ישׁ מוֹשֵׁ֖ל בְּ/יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/018.yaml
  text: then I will establish the throne of your kingdom[a], as I covenanted with David your father, saying, ‘A man to rule over Israel will not be cut off from you.’
translation:
  language: tl
  text: Kung gayon, itatatag ko ang trono ng iyong kaharian, gaya ng tipang ginawa ko kay David na iyong ama, nang sabihin ko, ‘Hindi ka mawawalan ng lalaking mamamahala sa Israel.’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַהֲקִימוֹתִי
  choice: kung gayon, itatatag ko
  rationale: Ang Hiphil ng קום ay nangangahulugang ‘itayo/itatag.’ Ipinahihiwatig ng pang-ugnay at ng kondisyong nasa naunang talata ang bunga, kaya natural ang ‘kung gayon.’
- source_word: כִּסֵּא מַלְכוּתֶךָ
  choice: ang trono ng iyong kaharian
  rationale: Pinananatili ang dalawang pangngalan sa Hebreo—‘trono’ at ‘kaharian/paghahari’—nang hindi ito pinaiikli bilang ‘maharlikang trono.’
- source_word: כַּאֲשֶׁר כָּרַתִּי
  choice: gaya ng pakikipagtipan ko
  rationale: Ang כרת sa kontekstong ito ay idyoma ng paggawa ng tipan. Ang ‘pakikipagtipan’ ay natural sa Tagalog at pinananatili ang puwersang tipan ng pahayag.
- source_word: לְדָוִיד אָבִיךָ
  choice: kay David na iyong ama
  rationale: Tumutukoy ang ‘ama’ sa ninuno at pinagmulan ng dinastiya, ngunit pinananatili ang literal at malinaw na katawagan.
- source_word: לֵאמֹר
  choice: nang sabihin ko
  rationale: Natural na pambungad sa tuwirang sipi at malinaw na Diyos ang nagsasalita.
- source_word: לֹא יִכָּרֵת לְךָ
  choice: Hindi mawawalan mula sa iyo
  rationale: Ang literal na ‘hindi mapuputol mula sa iyo’ ay di-likas at maaaring malabo sa Tagalog. Ang ‘hindi mawawalan mula sa iyo’ ay naghahatid ng idyomatikong dinastikong diwa habang pinananatili ang pinagmulan sa angkan ni Solomon.
- source_word: אִישׁ מוֹשֵׁל
  choice: isang lalaking mamamahala
  rationale: Pinananatili ng ‘lalaki’ ang panlalaking anyo at dinastikong tagapagmana; ang panghinaharap na ‘mamamahala’ ay natural na naghahayag ng tungkuling ipinangako.
- source_word: בְּיִשְׂרָאֵל
  choice: sa Israel
  rationale: Sa Tagalog, natural ang ‘mamamahala sa Israel’ para sa paghahari sa bayan; hindi kailangang tumbasan nang mekanikal ang Hebreong pang-ukol.
theological_decisions:
- issue: Pananalita ng pangakong dinastiko
  choice: Hindi mawawalan mula sa iyo ng isang lalaking mamamahala sa Israel
  alternative: Hindi mapuputol mula sa iyo ang isang lalaking mamamahala sa Israel
  rationale: Ang napiling anyo ay nagpapahayag ng idyomatikong kahulugan ng לֹא יִכָּרֵת לְךָ nang hindi nagpapasok ng paliwanag tungkol sa katuparan o saklaw ng pangako. Ang mas literal na ‘mapuputol’ ay maaaring ipakahulugang marahas na kamatayan ng isang tao sa halip na pagpapatuloy ng dinastiya.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang ‘iyong’ sa halip na kolokyal na ‘mo’ upang bumagay sa solemne at tipanang pahayag, ngunit iniwasan ang lipas o labis na pormal na bokabularyo.
