  text: וַ/יִּזְבַּ֞ח הַ/מֶּ֣לֶךְ שְׁלֹמֹה֮ אֶת זֶ֣בַח הַ/בָּקָ֗ר עֶשְׂרִ֤ים וּ/שְׁנַ֨יִם֙ אֶ֔לֶף וְ/צֹ֕אן מֵאָ֥ה וְ/עֶשְׂרִ֖ים אָ֑לֶף וַֽ/יַּחְנְכוּ֙ אֶת בֵּ֣ית הָֽ/אֱלֹהִ֔ים הַ/מֶּ֖לֶךְ וְ/כָל הָ/עָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/005.yaml
  text: And King Solomon sacrificed twenty-two thousand cattle and one hundred twenty thousand sheep[a], and the king and all the people dedicated the house of God.
translation:
  language: tl
  text: Naghandog si Haring Solomon ng dalawampu't dalawang libong baka at isang daan at dalawampung libong tupa[a]. At itinalaga ng hari at ng buong bayan ang bahay ng Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “maliliit na alagang hayop,” sapagkat maaaring saklaw ng salitang Hebreo ang mga tupa at kambing bilang isang pangkat.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְבַּח
  choice: Naghandog
  rationale: Sa kontekstong paghahandog, ang זבח ay tumutukoy sa pagkatay o pag-aalay bilang handog. Likas at malinaw sa Filipino ang “naghandog” at pinananatili nito ang kahulugang panrelihiyon.
- source_word: זֶבַח הַבָּקָר
  choice: baka
  rationale: Ang בָּקָר ay kolektibong katawagan sa malalaking alagang hayop, lalo na sa mga baka. Ang “baka” ang pinakanatural na modernong katumbas sa talaang ito.
- source_word: עֶשְׂרִים וּשְׁנַיִם אֶלֶף
  choice: dalawampu't dalawang libo
  rationale: Karaniwang makabagong Filipino na pagpapahayag ng bilang na 22,000.
- source_word: וְצֹאן
  choice: tupa
  rationale: Ang צֹאן ay maaaring tumukoy nang kolektibo sa maliliit na alagang hayop, kabilang ang mga tupa at kambing. Ginamit ang natural na maikling “tupa,” habang inilagay sa talababa ang mas malawak na kahulugan.
- source_word: מֵאָה וְעֶשְׂרִים אָלֶף
  choice: isang daan at dalawampung libo
  rationale: Malinaw at karaniwang Filipino na pagpapahayag ng bilang na 120,000.
- source_word: וַיַּחְנְכוּ
  choice: itinalaga
  rationale: Ang חנך dito ay tumutukoy sa pormal na pagtatalaga o pagpapasinaya sa templo. Ang “itinalaga” ay dignified, malinaw, at angkop sa konteksto.
- source_word: בֵּית הָאֱלֹהִים
  choice: bahay ng Diyos
  rationale: Tuwirang pinananatili ang Hebreong idyomang “bahay ng Diyos” sa halip na gawing interpretibong “templo ng Diyos.” Natural pa rin ito sa Filipino.
- source_word: הַמֶּלֶךְ וְכָל הָעָם
  choice: ang hari at ang buong bayan
  rationale: Matapos pangalanan si Solomon, bumabalik ang Hebreo sa titulong “ang hari.” Ang “buong bayan” ay natural na katumbas ng כָּל־הָעָם sa pambansang konteksto.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang literal na “bahay ng Diyos” at ang koordinasyon ng dalawang pangyayari, ngunit hinati sa dalawang pangungusap upang maging natural at madaling basahin sa Filipino.
