  source_fidelity: 'Tapat ang salin sa Hebreo: malinaw ang sakripisyong inihandog ni Solomon, ang dalawang bilang ng hayop, at ang sama-samang pagtatalaga ng bahay ng Diyos ng hari at buong bayan. Ang “naghandog” ay katanggap-tanggap sa kontekstong panrelihiyon para sa וַיִּזְבַּח, at ang talababa ay wastong nag-iingat sa mas malawak na saklaw ng צֹאן.'
