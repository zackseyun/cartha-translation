    rationale: Ang “kamay” sa pariralang Hebreo ay idiomatikong pantukoy sa pamamagitan o ahensiya. Mas malinaw sa Tagalog na ilahad ang literal na anyo at pagkatapos ay ipaliwanag ang idyoma.
