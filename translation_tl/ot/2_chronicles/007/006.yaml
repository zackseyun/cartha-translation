  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/הַ/כֹּהֲנִ֞ים עַל מִשְׁמְרוֹתָ֣/ם עֹמְדִ֗ים וְ/הַ/לְוִיִּ֞ם בִּ/כְלֵי שִׁ֤יר יְהוָה֙ אֲשֶׁ֨ר עָשָׂ֜ה דָּוִ֣יד הַ/מֶּ֗לֶךְ לְ/הֹד֤וֹת לַ/יהוָה֙ כִּֽי לְ/עוֹלָ֣ם חַסְדּ֔/וֹ בְּ/הַלֵּ֥ל דָּוִ֖יד בְּ/יָדָ֑/ם וְ/הַ/כֹּהֲנִים֙ מחצצרים נֶגְדָּ֔/ם וְ/כָל יִשְׂרָאֵ֖ל עֹמְדִֽים־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/006.yaml
  text: And the priests were standing at their posts[a], and the Levites with the instruments for the song of Yahweh, which David the king had made to give thanks to Yahweh, for his steadfast love endures forever, when David offered praise by their hand; and the priests were blowing trumpets opposite them[c][b], while all Israel was standing.
translation:
  language: tl
  text: Ang mga pari ay nakatayo sa kani-kanilang puwesto, at ang mga Levita naman ay may mga instrumento para sa awit kay Yahweh[a], na ginawa ni Haring David upang magpasalamat kay Yahweh, sapagkat ang kanyang tapat na pag-ibig ay nananatili magpakailanman[b], habang nagpupuri si David sa pamamagitan nila[c]. Humihip naman ng mga trumpeta ang mga pari sa tapat nila, habang nakatayo ang buong Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga instrumentong pangmusika ni Yahweh.” Maaaring tumukoy ang pariralang Hebreo sa mga instrumentong nakatalaga kay Yahweh o ginagamit para sa awit na iniaalay sa kanya.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “sapagkat magpakailanman ang kanyang tapat na pag-ibig.”
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “nang magpuri si David sa pamamagitan nila.” Literal na “sa pamamagitan ng kanilang mga kamay”; siksik ang Hebreo at malamang na nangangahulugang inihahatid ng mga Levita ang papuring iniugnay kay David bilang kanyang mga kinatawan.
    reason: alternative_reading
lexical_decisions:
- source_word: מִשְׁמְרוֹתָם
  choice: kani-kanilang puwesto
  rationale: Tumutukoy ang salita sa nakatalagang puwesto o pangkat ng paglilingkod. Likas sa modernong Tagalog ang “kani-kanilang puwesto” at pinananatili nito ang larawan ng organisadong paglilingkod.
- source_word: בִּכְלֵי שִׁיר יְהוָה
  choice: mga instrumento para sa awit kay Yahweh
  rationale: Pinananatili nito ang ugnayan ng mga instrumento, awit, at Yahweh nang hindi ipinapalagay kung pag-aari, pagtatalaga, o gamit sa pagsamba ang eksaktong diwa ng parirala.
- source_word: לְהוֹדוֹת לַיהוָה
  choice: magpasalamat kay Yahweh
  rationale: Sa kontekstong sinusundan ng pormula tungkol sa tapat na pag-ibig ng Diyos, “magpasalamat” ang pinakatumpak at natural na katumbas ng Hiphil ng ידה.
- source_word: כִּי לְעוֹלָם חַסְדּוֹ
  choice: sapagkat ang kanyang tapat na pag-ibig ay magpakailanman
  rationale: Sinasaklaw ng “tapat na pag-ibig” ang kabutihan at matibay na katapatan ng חֶסֶד. Ang “ay magpakailanman” ay malapit sa tahasang Hebreong idyoma at hindi nagdaragdag ng pandiwang wala sa teksto.
- source_word: בְּהַלֵּל דָּוִיד בְּיָדָם
  choice: habang nagpupuri si David sa pamamagitan nila
  rationale: 'Pinananatili ang siksik at bahagyang malabong konstruksiyon: si David ang paksa ng pagpupuri, ngunit ang mga Levita ang paraang ginagamit o mga kinatawan nito.'
- source_word: מחצצרים
  choice: humihip ... ng mga trumpeta
  rationale: Tiyak na tumutukoy ang pandiwa sa pagpapatunog ng mga trumpeta; malinaw at karaniwan sa Tagalog ang “humihip ng mga trumpeta.”
- source_word: נֶגְדָּם
  choice: sa tapat nila
  rationale: Natural nitong ipinapahayag ang lokasyong kaharap o katapat ng mga Levita nang hindi nagdaragdag ng seremonyal na kahulugan.
- source_word: עֹמְדִים
  choice: nakatayo
  rationale: Naipapakita ng aspektong ito ang nagpapatuloy na kalagayan sa tagpo, kapwa para sa mga pari at sa buong Israel.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tahasang ginagamit ng Hebreo ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal at tipanang pangalan sa halip na palitan ito ng isang titulo.
- issue: Saklaw ng חֶסֶד
  choice: tapat na pag-ibig
  alternative: awa; kagandahang-loob; katapatan sa tipan
  rationale: Hindi nililimitahan ang salita sa awa lamang o ginagawang tahasang teknikal ang “tipan”; pinananatili nito ang pinagsamang diwa ng pag-ibig, kabutihan, at matibay na katapatan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “mga Levita,” “mga pari,” at “mga trumpeta” bilang pamilyar na bokabularyong biblikal. Pinanatili ang mahabang daloy ng Hebreo ngunit hinati sa dalawang pangungusap upang maging malinaw sa karaniwang mambabasa.
