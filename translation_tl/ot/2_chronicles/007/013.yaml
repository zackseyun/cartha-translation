base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/013.yaml
  text: When I shut up the heavens so that there is no rain[a], or command the locust to devour the land, or send pestilence among my people[b],
translation:
  language: tl
  text: Kapag isasara ko ang langit upang hindi umulan[a], o uutusan ko ang mga balang na lamunin ang lupain, o magpapadala ako ng salot sa gitna ng aking bayan[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Kung isasara ko ang langit upang hindi umulan.” Maaari ring unawain nang mas literal ang pambungad na salitang Hebreo bilang “kung tunay ngang” o “masdan, kung.”
    reason: lexical_alternative
  - marker: b
    text: Ang “salot” dito ay maaaring tumukoy sa epidemya o nakahahawang sakit.
    reason: lexical_clarification
lexical_decisions:
- source_word: הֵן
  choice: Kapag
  rationale: Ipinakikilala ng הֵן dito ang isang posibleng kalagayan sa serye ng mga kondisyong kaugnay ng kasunod na talata. Likas sa modernong Tagalog ang “Kapag,” habang inilalagay sa talababa ang mas tahasang kondisyunal na alternatibo.
- source_word: אֶעֱצֹר הַשָּׁמַיִם
  choice: isinara ko ang langit
  rationale: Pinananatili nito ang kongkretong larawang Hebreo ng pagsasara sa langit, sa halip na palitan agad ng pagpapaliwanag na “pinigil ko ang ulan.”
- source_word: וְלֹא יִהְיֶה מָטָר
  choice: upang hindi umulan
  rationale: Natural na ipinahahayag sa Tagalog ang bunga o layon ng pagsasara sa langit; katumbas ito ng literal na “at walang magiging ulan.”
- source_word: וְהֵן
  choice: o
  rationale: Ipinakikilala nito ang ikalawang alternatibong hatol at malinaw na naihahanay sa unang kondisyon.
- source_word: אֲצַוֶּה עַל חָגָב
  choice: inutusan ko ang mga balang
  rationale: Bagaman pang-isahang kolektibo ang חָגָב, mas natural sa Tagalog ang maramihang “mga balang” para sa mapaminsalang kumpol.
- source_word: לֶאֱכֹל הָאָרֶץ
  choice: na lamunin ang lupain
  rationale: Ang “lamunin” ay naghahatid ng mapaminsalang lakas ng pagkain ng mga balang; ang “lupain” ay angkop sa konteksto kaysa sa mas malawak na “daigdig.”
- source_word: וְאִם אֲשַׁלַּח
  choice: o nagpadala ako
  rationale: Ipinagpapatuloy ng “o” ang serye ng mga alternatibong kalagayan at pinananatili ng “nagpadala ako” ang tuwirang pagkilos ng Diyos.
- source_word: דֶּבֶר
  choice: salot
  rationale: Ang דֶּבֶר ay tumutukoy sa nakamamatay o epidemikong sakit bilang hatol. Ang “salot” ay dignified, malinaw, at karaniwan sa biblikal na Tagalog.
- source_word: בְּעַמִּי
  choice: sa gitna ng aking bayan
  rationale: Ipinahihiwatig ng ב ang paglaganap sa loob o gitna ng bayan; mas tiyak ito kaysa sa maaaring malabong “sa aking bayan.”
theological_decisions:
- issue: Paglalahad sa mga hatol ng Diyos bilang mga kondisyunal na kalagayan
  choice: “Kapag ... o ... o ...”
  alternative: “Kung isasara ko ...” o “Masdan, kung isasara ko ...”
  rationale: Maaaring ipakilala ng הֵן ang kondisyon o inaakalang kalagayan. Ang “Kapag” ay natural sa Tagalog at hindi pinahihina ang tuwirang pagkilos ng Diyos, samantalang pinananatili sa talababa ang tunay na posibilidad ng pagbasa na “Kung.”
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Pinanatili ang biblikal na larawang “isinara ... ang langit,” habang ginawang natural ang sintaks sa “upang hindi umulan.” Ang talata ay sadyang nagtatapos sa kuwit dahil nagpapatuloy ang kondisyon sa 2 Cronica 7:14.
