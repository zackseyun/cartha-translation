base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/020.yaml
  text: then I will uproot them from my land that I have given them[a], and this house that I have consecrated for my name I will cast out of my sight[c][b], and I will make it a proverb and a byword among all peoples.
translation:
  language: tl
  text: kung magkagayon, bubunutin ko sila mula sa aking lupain na ibinigay ko sa kanila. At ang bahay na ito[a], na itinalaga kong banal para sa aking pangalan, ay itatapon ko mula sa aking harapan[b]. Gagawin ko itong kasabihan at tampulan ng paglibak[c] sa gitna ng lahat ng mga bayan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “templong ito.” Sa Hebreo, “bahay na ito.”
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “mula sa harap ng aking mukha.”
    reason: lexical_alternative
  - marker: c
    text: Maaari ring isalin na “tudyo at bukambibig ng paghamak.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּנְתַשְׁתִּים
  choice: kung magkagayon, bubunutin ko sila
  rationale: Ang pandiwang נתשׁ ay tumutukoy sa pagbunot o pag-alis na parang halamang binubunot sa lupa. Pinananatili ng “bubunutin” ang larawan ng sapilitang pag-aalis sa lupa; ipinahahayag ng “kung magkagayon” ang bunga ng pasubaling nasa naunang talata.
- source_word: מֵעַל אַדְמָתִי
  choice: mula sa aking lupain
  rationale: Sa kontekstong ito, ang אֲדָמָה ay ang lupaing pag-aari ng Diyos at ipinagkaloob niya sa bayan; mas natural dito ang “lupain” kaysa “lupa” o “bunton ng lupa.”
- source_word: אֲשֶׁר נָתַתִּי לָהֶם
  choice: na ibinigay ko sa kanila
  rationale: Tuwirang isinasalin ang sugnay at pinananatili ang diin na ang lupain ay kaloob ng Diyos.
- source_word: הַבַּיִת הַזֶּה
  choice: ang bahay na ito
  rationale: Literal na “bahay” ang בַּיִת, bagaman templo ang tinutukoy. Pinananatili nito ang karaniwang biblikal na katawagan nang hindi ikinukubli ang posibleng saling “templo.”
- source_word: הִקְדַּשְׁתִּי לִשְׁמִי
  choice: itinalaga kong banal para sa aking pangalan
  rationale: Ipinahahayag ng hiphil ng קדשׁ ang pagbubukod bilang banal. Pinananatili ang “para sa aking pangalan” bilang mahalagang pormulang teolohikal sa teksto.
- source_word: אַשְׁלִיךְ מֵעַל פָּנַי
  choice: itatapon ko palayo sa aking paningin
  rationale: Pinananatili ng “itatapon” ang lakas ng השליך, samantalang natural na ipinapahayag ng “palayo sa aking paningin” ang idyomang Hebreo tungkol sa pagtatakwil mula sa harapan ng Diyos.
- source_word: וְאֶתְּנֶנּוּ
  choice: gagawin ko itong
  rationale: Sa konstruksyong ito, ang נתן ay nangangahulugang ilagay o gawing nasa isang kalagayan; malinaw at natural ang “gagawin ko itong.”
- source_word: לְמָשָׁל
  choice: kasabihan
  rationale: Maaaring mangahulugan ang מָשָׁל ng salawikain, kasabihan, o mapanuyang halimbawa. Ang “kasabihan” ay natural at nagpapahintulot sa kasunod na salita na magdala ng malinaw na diwa ng paghamak.
- source_word: לִשְׁנִינָה
  choice: tampulan ng paglibak
  rationale: Ang שְׁנִינָה ay tumutukoy sa isang mapanuyang bukambibig o bagay na hinahamak. Mas malinaw sa makabagong Filipino ang “tampulan ng paglibak” kaysa sa isang literal ngunit malabong katumbas.
- source_word: בְּכָל הָעַמִּים
  choice: sa lahat ng mga bayan
  rationale: Ang עַמִּים ay maramihang “mga bayan” o “mga sambayanan.” Pinananatili ng salin ang kolektibong diwa nang hindi ito nililimitahan sa mga estadong pampolitika.
theological_decisions:
- issue: Katawagan sa templo
  choice: ang bahay na ito
  alternative: ang templong ito
  rationale: “Bahay” ang mismong salitang Hebreo at karaniwang katawagan sa templo. Pinananatili ito sa teksto, habang inilalagay sa talababa ang mas malinaw na kontekstuwal na alternatibo.
- issue: Idyoma ng pagtanggi ng Diyos
  choice: itatapon ko palayo sa aking paningin
  alternative: itatapon ko mula sa harap ng aking mukha / itatakwil ko mula sa aking presensya
  rationale: Ipinahahayag nito ang matinding pagtanggi ng Diyos at ang puwersa ng pandiwang “itatapon,” ngunit hindi nito pinipilit ang idyomang tungkol sa mukha na maging isang teknikal na pahayag hinggil sa presensya ng Diyos.
- issue: Magkapares na mga salita ng pampublikong kahihiyan
  choice: kasabihan at tampulan ng paglibak
  alternative: tudyo at bukambibig ng paghamak
  rationale: May malawak at bahagyang magkasanib na saklaw ang מָשָׁל at שְׁנִינָה. Ang piniling salin ay nagpapanatili sa ideya ng pagiging kilalang halimbawa at ng pampublikong pangungutya nang hindi binubura ang leksikal na kalabuan.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang malinaw na mga pandiwang “bubunutin” at “itatapon” upang mapanatili ang lakas ng mga larawang Hebreo. Ang “bahay” at “pangalan” ay pinanatili bilang mahahalagang katawagang biblikal, samantalang ipinaliliwanag sa mga talababa ang literal at alternatibong mga pagbasa.
