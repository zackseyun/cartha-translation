  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יְקַדֵּ֣שׁ שְׁלֹמֹ֗ה אֶת תּ֤וֹךְ הֶֽ/חָצֵר֙ אֲשֶׁר֙ לִ/פְנֵ֣י בֵית יְהוָ֔ה כִּֽי עָ֤שָׂה שָׁם֙ הָֽ/עֹל֔וֹת וְ/אֵ֖ת חֶלְבֵ֣י הַ/שְּׁלָמִ֑ים כִּֽי מִזְבַּ֤ח הַ/נְּחֹ֨שֶׁת֙ אֲשֶׁ֣ר עָשָׂ֣ה שְׁלֹמֹ֔ה לֹ֣א יָכ֗וֹל לְ/הָכִ֛יל אֶת הָ/עֹלָ֥ה וְ/אֶת הַ/מִּנְחָ֖ה וְ/אֶת הַ/חֲלָבִֽים־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/007.yaml
  text: Then Solomon consecrated the middle of the court that was before the house of Yahweh[a], because there he offered the burnt offerings and the fat portions of the peace offerings, because the bronze altar that Solomon had made could not hold the burnt offering, the grain offering[c][b], and the fat portions.
translation:
  language: tl
  text: Pagkatapos, itinalaga ni Solomon bilang banal ang gitnang bahagi ng patyo sa harap ng bahay ni Yahweh, sapagkat doon niya inihandog ang mga handog na sinusunog at ang mga bahaging taba ng mga handog pangkapayapaan.[a] Sapagkat hindi magkasya sa tansong altar na ginawa ni Solomon ang handog na sinusunog, ang handog na butil, at ang mga bahaging taba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga handog para sa mabuting ugnayan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְקַדֵּשׁ
  choice: itinalaga ... bilang banal
  rationale: Ipinahahayag ng Hiphil ng קדשׁ ang pagtatalaga ng isang lugar para sa banal na gamit. Malinaw at likas sa makabagong Tagalog ang pariralang ito.
- source_word: תּוֹךְ הֶחָצֵר
  choice: ang gitnang bahagi ng patyo
  rationale: Ang תּוֹךְ ay tumutukoy sa gitna o loob na bahagi; pinananatili rito ang mas tiyak na diwang 'gitnang bahagi' kaysa gawing buong patyo lamang.
- source_word: לִפְנֵי בֵית יְהוָה
  choice: sa harap ng bahay ni Yahweh
  rationale: Panglokasyon ang לִפְנֵי. Pinananatili ng 'bahay ni Yahweh' ang karaniwang metapora sa Hebreo para sa templo at ang personal na pangalan ng Diyos.
- source_word: עָשָׂה שָׁם
  choice: Doon niya inihandog
  rationale: Bagaman karaniwang nangangahulugang 'gumawa' ang עשה, idiomatiko itong tumutukoy sa paghahandog sa kontekstong pansakripisyo.
- source_word: הָעֹלוֹת / הָעֹלָה
  choice: mga handog na sinusunog / handog na sinusunog
  rationale: Sinasalamin nito ang maramihan sa unang paglitaw at ang isahang kolektibong anyo sa ikalawa, habang malinaw na tumutukoy sa uring pansakripisyo.
- source_word: חֶלְבֵי הַשְּׁלָמִים
  choice: mga taba ng mga handog para sa mabuting ugnayan
  rationale: Ang חלב ay ang mga bahaging taba na inihahandog. Ang שְׁלָמִים ay may diwa ng kapayapaan, kabuuan, at maayos na ugnayan; ang salin ay malinaw sa karaniwang mambabasa nang hindi nililimitahan sa isang denominasyonal na katawagan.
- source_word: מִזְבַּח הַנְּחֹשֶׁת
  choice: tansong altar
  rationale: Ang נְחֹשֶׁת sa mga kagamitang pan-templo ay karaniwang tumutukoy sa bronze; 'tansong altar' ang maikli at likas na katawagan sa Filipino.
- source_word: לֹא יָכוֹל לְהָכִיל
  choice: hindi magkasya sa
  rationale: Likas nitong ipinahahayag sa Tagalog na hindi sapat ang kapasidad ng altar para sa dami ng mga handog.
- source_word: הַמִּנְחָה
  choice: handog na butil
  rationale: Sa kontekstong pansakripisyo, teknikal na tumutukoy ang מִנְחָה sa handog na mula sa butil, hindi lamang sa isang pangkalahatang regalo.
- source_word: הַחֲלָבִים
  choice: mga taba
  rationale: Tumutukoy ang maramihan sa mga bahaging taba ng mga hayop na inilalagay sa altar.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Personal na pangalan ang יְהוָה sa teksto. Pinananatili ng 'Yahweh' ang pangalan sa halip na palitan ito ng titulong 'PANGINOON'.
- issue: Kahulugan ng שְׁלָמִים
  choice: mga handog para sa mabuting ugnayan
  alternative: mga handog pangkapayapaan
  rationale: May saklaw na kapayapaan, kagalingan, at maayos na ugnayan ang katawagan. Pinili ang malinaw na parirala sa pangunahing teksto at inilagay sa talababa ang nakaugaliang alternatibo upang hindi itago ang saklaw ng termino.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang mga karaniwang katawagang pansakripisyo ngunit iniwasan ang labis na teknikal o makalumang pananalita. Ang kuwit bago ang talababa ay kasunod ng buong pariralang ipinapaliwanag.
