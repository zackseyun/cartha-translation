id: 2CH.7.22
reference: 2 Chronicles 7:22
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/אָמְר֗וּ עַל֩ אֲשֶׁ֨ר עָֽזְב֜וּ אֶת יְהוָ֣ה אֱלֹהֵ֣י אֲבֹתֵי/הֶ֗ם אֲשֶׁ֣ר הוֹצִיאָ/ם֮ מֵ/אֶ֣רֶץ מִצְרַיִם֒ וַֽ/יַּחֲזִ֨יקוּ֙ בֵּ/אלֹהִ֣ים אֲחֵרִ֔ים וַ/יִּשְׁתַּחֲו֥וּ לָ/הֶ֖ם וַ/יַּֽעַבְד֑וּ/ם עַל כֵּן֙ הֵבִ֣יא עֲלֵי/הֶ֔ם אֵ֥ת כָּל הָ/רָעָ֖ה הַ/זֹּֽאת־׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/022.yaml
  text: And they will say[a], ‘Because they forsook Yahweh, the God of their fathers, who brought them out of the land of Egypt, and embraced other gods, and bowed down to them and served them[b], therefore he has brought all this disaster on them.’
translation:
  language: tl
  text: At sasabihin nila, “Dahil iniwan nila si Yahweh, ang Diyos ng kanilang mga ninuno, na naglabas sa kanila mula sa lupain ng Ehipto, at kumapit sila sa ibang mga diyos[a], yumukod sa mga iyon at naglingkod sa mga iyon, kaya pinasapit niya sa kanila ang lahat ng kapahamakang ito[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nanghawakan sa ibang mga diyos.” Literal na tumutukoy ang pandiwang Hebreo sa mahigpit na paghawak, kaya ipinahihiwatig nito ang kusang pakikiugnay sa kanila.
    reason: lexical_alternative
  - marker: b
    text: Ang “kapahamakan” dito ay tumutukoy sa sakuna o paghatol, hindi sa kasamaang moral.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמְרוּ
  choice: At sasabihin nila
  rationale: Ang anyong pandiwa sa kontekstong ito ay nagpapatuloy sa hulang nasa naunang talata; likas sa Tagalog ang hinaharap na “sasabihin.”
- source_word: עַל אֲשֶׁר
  choice: Dahil
  rationale: Ipinakikilala ng parirala ang dahilan ng kapahamakang sinapit; malinaw at natural ang “Dahil.”
- source_word: עָזְבוּ
  choice: iniwan
  rationale: Ipinahahayag nito ang mabigat na pagtalikod kay Yahweh nang hindi nagdaragdag ng paliwanag na wala sa teksto.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos na nasa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֵי אֲבֹתֵיהֶם
  choice: ang Diyos ng kanilang mga ninuno
  rationale: Natural ito sa modernong Tagalog at pinananatili ang diwa ng pagpapatuloy ng tipan sa mga naunang salinlahi.
- source_word: הוֹצִיאָם מֵאֶרֶץ מִצְרַיִם
  choice: na naglabas sa kanila mula sa lupain ng Ehipto
  rationale: Tuwirang inilalarawan ang pagkilos ng Diyos sa karaniwang pormula tungkol sa Exodo.
- source_word: וַיַּחֲזִיקוּ בֵּאלֹהִים אֲחֵרִים
  choice: at kumapit sila sa ibang mga diyos
  rationale: Pinananatili ng “kumapit” ang kongkretong larawan ng sadyang paghawak at matibay na pakikiugnay sa ibang mga diyos.
- source_word: וַיִּשְׁתַּחֲווּ לָהֶם
  choice: yumukod sa mga iyon
  rationale: Pinananatili ang pisikal na kilos ng pagyukod sa halip na agad itong gawing pangkalahatang “sumamba.”
- source_word: וַיַּעַבְדוּם
  choice: at naglingkod sa mga iyon
  rationale: Pinananatili ang leksikal na pagkakaiba nito sa naunang pagyukod, habang malinaw pa rin ang relihiyosong paglilingkod.
- source_word: עַל כֵּן
  choice: kaya
  rationale: Maikli at likas na panandang Tagalog para sa bunga o kahihinatnan.
- source_word: הֵבִיא עֲלֵיהֶם
  choice: pinasapit niya sa kanila
  rationale: Natural na ipinahahayag sa Tagalog ang pagpapadating ng kapahamakan sa kanila.
- source_word: כָּל הָרָעָה הַזֹּאת
  choice: ang lahat ng kapahamakang ito
  rationale: Sa konteksto ng paghatol, ang רָעָה ay sakuna o kapahamakan, hindi kasamaang moral.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehovah
  rationale: Ang pinagmulang teksto ay tahasang gumagamit ng Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalang nasa Hebreo nang hindi ito pinapalitan ng titulo.
- issue: Kahulugan ng רָעָה sa paghatol
  choice: kapahamakan
  alternative: kasamaan o kalamidad
  rationale: Tinutukoy rito ang mapaminsalang kahihinatnan ng paghatol, hindi ang moral na kasamaan; ang “kapahamakan” ay malinaw ngunit pinananatili ang bigat ng pahayag.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang magkaibang kilos na “yumukod” at “naglingkod,” gayundin ang kongkretong larawan ng “kumapit,” nang hindi pinapakinis ang mga ito tungo sa iisang salitang “sumamba.”
