source:
  edition: WLC
  text: וְ/לֹ֤א יָֽכְלוּ֙ הַ/כֹּ֣הֲנִ֔ים לָ/ב֖וֹא אֶל בֵּ֣ית יְהוָ֑ה כִּֽי מָלֵ֥א כְבוֹד יְהוָ֖ה אֶת בֵּ֥ית יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/002.yaml
  text: And the priests were not able to enter the house of Yahweh[a], because the glory of Yahweh filled the house of Yahweh.
translation:
  language: tl
  text: At hindi makapasok ang mga pari sa bahay ni Yahweh[a], sapagkat ang kaluwalhatian ni Yahweh ay pumuno sa bahay ni Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “bahay ni Yahweh”; ibig sabihin, ang templo. Pinanatili rito ang “bahay” upang maipakita ang pagkakasabi sa Hebreo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא יָכְלוּ
  choice: At hindi makapasok
  rationale: Ipinagpapatuloy ng וְ ang salaysay, at ang יכל na may negasyon ay nagsasaad ng kawalan ng kakayahan. Sa natural na Filipino, ang “hindi makapasok” ay malinaw at tuwirang naghahatid ng diwang “were not able to enter.”
- source_word: הַכֹּהֲנִים
  choice: ang mga pari
  rationale: Karaniwang katawagan sa Filipino para sa mga kohanim sa konteksto ng paglilingkod sa templo.
- source_word: לָבוֹא אֶל
  choice: makapasok sa
  rationale: Sa kontekstong ito, ang בוא na sinusundan ng אֶל ay tumutukoy sa pagpasok sa isang lugar; natural itong ipahayag sa Filipino bilang “makapasok sa.”
- source_word: בֵּית יְהוָה
  choice: bahay ni Yahweh
  rationale: Pinananatili ang literal na larawang “bahay” sa Hebreo sa halip na ipalit ang interpretatibong “templo,” habang malinaw pa rin ang tinutukoy sa konteksto.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasatitik ang banal na pangalang יהוה bilang “Yahweh” sa halip na palitan ito ng titulong “PANGINOON.”
- source_word: כִּי
  choice: sapagkat
  rationale: Nagbibigay ito ng dahilan kung bakit hindi makapasok ang mga pari. Ang “sapagkat” ay malinaw, marangal, at angkop sa salaysay.
- source_word: מָלֵא
  choice: pinuno
  rationale: Ang pandiwa ay nagsasaad na ang kaluwalhatian ni Yahweh ang pumuno sa bahay. Ang “pinuno” ay natural na pandiwang palipat sa Filipino at tumutugma sa tuwirang layon na may אֶת.
- source_word: כְבוֹד יְהוָה
  choice: ang kaluwalhatian ni Yahweh
  rationale: Tuwirang pinananatili ang ugnayang konstruktong Hebreo at ang karaniwang biblikal na kahulugan ng כבוד bilang “kaluwalhatian.”
- source_word: אֶת בֵּית יְהוָה
  choice: ang bahay ni Yahweh
  rationale: Inuulit ang parehong parirala gaya ng Hebreo, sa halip na pag-iba-ibahin ang salita para lamang sa estilo.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tahasang ginagamit ng teksto ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng titulo.
- issue: Kahulugan ng בֵּית יְהוָה sa konteksto ng templo
  choice: bahay ni Yahweh
  alternative: templo ni Yahweh
  rationale: Tumutukoy ang parirala sa templo, ngunit pinananatili ng “bahay” ang mismong metapora at pag-uulit ng Hebreo nang hindi inaalis ang kahulugang pangtemplo.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang pag-uulit ng “bahay ni Yahweh” at iniwasan ang mas interpretatibong pagpapalit nito ng “templo” sa pangunahing teksto.
