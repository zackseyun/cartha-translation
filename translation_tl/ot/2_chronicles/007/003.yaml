id: 2CH.7.3
reference: 2 Chronicles 7:3
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/כֹ֣ל בְּנֵ֣י יִשְׂרָאֵ֗ל רֹאִים֙ בְּ/רֶ֣דֶת הָ/אֵ֔שׁ וּ/כְב֥וֹד יְהוָ֖ה עַל הַ/בָּ֑יִת וַ/יִּכְרְעוּ֩ אַפַּ֨יִם אַ֤רְצָ/ה עַל הָ/רִֽצְפָה֙ וַ/יִּֽשְׁתַּֽחֲו֔וּ וְ/הוֹד֤וֹת לַ/יהוָה֙ כִּ֣י ט֔וֹב כִּ֥י לְ/עוֹלָ֖ם חַסְדּֽ/וֹ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/003.yaml
  text: 'And all the sons of Israel[a], seeing the fire come down and the glory of Yahweh upon the house, bowed down with their faces to the ground on the pavement, and they worshiped and gave thanks to Yahweh: “For he is good[c][b], for his steadfast love endures forever.”'
translation:
  language: tl
  text: 'At nang makita ng lahat ng Israelita[a] ang apoy na bumababa at ang kaluwalhatian ni Yahweh sa ibabaw ng bahay[b], nagpatirapa sila, nakaharap sa lupa, sa sahig na bato. Sumamba sila at nagpasalamat kay Yahweh: “Sapagkat siya ay mabuti; sapagkat ang kanyang tapat na pag-ibig ay magpakailanman.”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “lahat ng mga anak na lalaki ng Israel,” isang karaniwang kolektibong katawagan sa buong sambayanang Israel.
    reason: lexical_alternative
  - marker: b
    text: Ang “bahay” ay tumutukoy sa templo.
    reason: cultural_note
  - marker: c
    text: Ang “tapat na pag-ibig” ay maaari ring isaling “awa” o “katapatan sa tipan.” Malawak ang kahulugan ng salitang Hebreo na חֶסֶד.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֹל בְּנֵי יִשְׂרָאֵל
  choice: at ... lahat ng Israelita
  rationale: Ang literal na “mga anak na lalaki ng Israel” ay isang karaniwang kolektibong katawagan sa buong sambayanang Israel; natural at tumpak sa makabagong Filipino ang “lahat ng Israelita.”
- source_word: רֹאִים בְּרֶדֶת הָאֵשׁ
  choice: nang makita ... ang apoy na bumababa
  rationale: Ipinahahayag ng participle at infinitive construct ang magkasabay na pagkakita at pagbaba; pinananatili ng salin ang aktuwal na pababang kilos.
- source_word: וּכְבוֹד יְהוָה עַל הַבָּיִת
  choice: ang kaluwalhatian ni Yahweh sa ibabaw ng bahay
  rationale: Ang כָּבוֹד ay tumutukoy sa hayag na kaluwalhatian o presensiya ng Diyos. Pinanatili ang “bahay” para sa בַּיִת, habang nililinaw sa talababa na templo ang tinutukoy.
- source_word: וַיִּכְרְעוּ אַפַּיִם אַרְצָה עַל הָרִצְפָה
  choice: yumukod sila nang nakasubsob sa lupa sa ibabaw ng sahig na bato
  rationale: Ipinahahayag nito ang buong pagpapakumbabang posisyon na nakaharap sa lupa; ang רִצְפָה ay isang sementado o batong sahig sa bakuran ng templo.
- source_word: וַיִּשְׁתַּחֲווּ
  choice: sumamba sila
  rationale: Dahil nailarawan na ang pisikal na pagyukod, malinaw na ipinahahayag ng “sumamba” ang debosyonal na diwa nang hindi inuulit ang kilos.
- source_word: וְהוֹדוֹת לַיהוָה
  choice: nagpasalamat kay Yahweh
  rationale: Sa liturhikong pormulang ito, ang Hiphil ng ידה ay angkop na unawain bilang pagpapasalamat, bagaman maaari rin itong magtaglay ng diwa ng pagpupuri.
- source_word: כִּי טוֹב
  choice: Sapagkat siya ay mabuti
  rationale: Pinananatili nito ang paliwanag na gamit ng כִּי at ang nakaugaliang pormula ng pagsamba.
- source_word: כִּי לְעוֹלָם חַסְדּוֹ
  choice: sapagkat ang kanyang tapat na pag-ibig ay magpakailanman
  rationale: Ang “tapat na pag-ibig” ay sumasaklaw sa pag-ibig at matibay na katapatan ng חֶסֶד. Walang tahasang pandiwang “nananatili” sa Hebreo, kaya pinanatili ang payak na nominal na pahayag na “ay magpakailanman.”
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Ginagamit ng talata ang Tetragrammaton; pinananatili ng “Yahweh” ang personal at tipanang pangalan nang hindi ito pinapalitan ng titulo.
- issue: Pagsasalin sa חַסְדּוֹ
  choice: ang kanyang tapat na pag-ibig
  alternative: ang kanyang awa; ang kanyang katapatan sa tipan
  rationale: May lawak ang חֶסֶד na kinabibilangan ng kabutihang-loob, awa, pag-ibig, at matatag na katapatan. Hindi ito nilimitahan sa iisang aspekto lamang.
- issue: Di-hayag na pandiwa sa לְעוֹלָם חַסְדּוֹ
  choice: ang kanyang tapat na pag-ibig ay magpakailanman
  alternative: ang kanyang tapat na pag-ibig ay nananatili magpakailanman
  rationale: Walang nakasulat na pandiwang “nananatili” sa Hebreo. Ang nominal na salin ay natural sa Filipino at higit na pormal na tumutugma sa pinagmulan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Israelita” sa halip na literal ngunit di-natural na “mga anak na lalaki ng Israel.” Pinanatili ang “bahay” at ang banal na pangalang “Yahweh,” at iniwasang dagdagan sa pangunahing teksto ang pandiwang wala sa Hebreo.
