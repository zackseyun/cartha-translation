revisions:
- from: At nang makita ng lahat ng Israelita[a] ang apoy na bumababa at ang kaluwalhatian ni Yahweh sa ibabaw ng bahay[b], yumukod sila nang nakasubsob sa lupa sa ibabaw ng sahig na bato. Sumamba sila at nagpasalamat kay Yahweh, na sinasabi, “Sapagkat siya ay mabuti; sapagkat ang kanyang tapat na pag-ibig ay magpakailanman.”[c]
  to: 'At nang makita ng lahat ng Israelita[a] ang apoy na bumababa at ang kaluwalhatian ni Yahweh sa ibabaw ng bahay[b], nagpatirapa sila, nakaharap sa lupa, sa sahig na bato. Sumamba sila at nagpasalamat kay Yahweh: “Sapagkat siya ay mabuti; sapagkat ang kanyang tapat na pag-ibig ay magpakailanman.”[c]'
  rationale: Inayos ang paglalarawan ng postura upang malinaw na maipakita ang pagpapatirapa nang nakaharap sa lupa sa sementadong sahig, alinsunod sa Hebreo. Inalis ang di-kailangang pandiwang pang-ulat bago ang sipi. Walang binago sa kahulugan, mga pangalan, o pangunahing terminolohiyang teolohikal.
