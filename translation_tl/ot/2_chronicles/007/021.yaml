  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/הַ/בַּ֤יִת הַ/זֶּה֙ אֲשֶׁ֣ר הָיָ֣ה עֶלְי֔וֹן לְ/כָל עֹבֵ֥ר עָלָ֖י/ו יִשֹּׁ֑ם וְ/אָמַ֗ר בַּ/מֶּ֨ה עָשָׂ֤ה יְהוָה֙ כָּ֔כָה לָ/אָ֥רֶץ הַ/זֹּ֖את וְ/לַ/בַּ֥יִת הַ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/021.yaml
  text: And this house[a], which was exalted, will become a horror to everyone passing by it, and they will say[b], 'Why has Yahweh done thus to this land and to this house?'
translation:
  language: tl
  text: At ang bahay na ito[a], na dating maringal, ay magiging kagimbal-gimbal[b] sa bawat dumaraan dito, at sasabihin nila, “Bakit ginawa ni Yahweh ang ganito sa lupaing ito at sa bahay na ito?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “bahay” ay tumutukoy rito sa templo.
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring isalin: “ay mawawasak” o “ay magiging kasindak-sindak.” Saklaw ng pandiwang Hebreo ang pagkawasak at ang pagkagimbal na dulot nito.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַבַּיִת הַזֶּה
  choice: At ang bahay na ito
  rationale: Ang בַּיִת ay literal na “bahay.” Bagaman tumutukoy ito rito sa templo, pinananatili ng “bahay” ang salita at pag-uulit ng Hebreo; nililinaw sa talababa ang konteksto.
- source_word: אֲשֶׁר הָיָה עֶלְיוֹן
  choice: na dating maringal
  rationale: Ang עֶלְיוֹן ay “mataas” o “dakila.” Sa konteksto, inilalarawan nito ang dating prominenteng kalagayan ng templo; natural na ipinahahayag ito ng “dating maringal” sa Filipino nang hindi nililimitahan sa pisikal na taas.
- source_word: לְכָל עֹבֵר עָלָיו יִשֹּׁם
  choice: ay ikagigimbal ng bawat daraan dito
  rationale: Ang יִשֹּׁם mula sa שמם ay maaaring tumukoy sa pagkawasak o sa pagkagimbal na dulot nito. Itinatampok ng salin ang reaksiyon ng mga nagdaraan, habang inilalaan sa talababa ang saklaw na “mawawasak” o “magiging kagimbal-gimbal.”
- source_word: וְאָמַר
  choice: at sasabihin nila
  rationale: Bagaman pang-isahan ang anyong Hebreo, tumutukoy ito nang pamahagi sa “bawat daraan.” Natural sa Filipino ang maramihang “nila” para sa lahat ng naturang nagdaraan.
- source_word: בַּמֶּה
  choice: Bakit
  rationale: Ang literal na diwang “dahil sa ano?” ay natural at tumpak na naihahayag ng “Bakit” sa tanong tungkol sa paghatol.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang personal na pangalang Yahweh bilang tuwirang transliterasyon ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: כָּכָה
  choice: ang ganito
  rationale: Ang demonstratibong pang-abay ay idiomatikong naihahayag sa Filipino sa “ginawa … ang ganito,” na tumutukoy sa nakikitang sinapit ng lupain at bahay.
- source_word: לָאָרֶץ הַזֹּאת וְלַבַּיִת הַזֶּה
  choice: sa lupaing ito at sa bahay na ito
  rationale: Pinananatili ng “lupain” ang covenantal at heograpikong diwa ng אֶרֶץ, at inuulit ang “bahay” gaya ng Hebreo.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehovah
  rationale: Nasa teksto ang personal na pangalang יְהוָה; pinananatili ito bilang Yahweh upang hindi mapalitan ng titulo ang pangalan.
- issue: Diwa ng kapalaran ng templo sa יִשֹּׁם
  choice: ikagigimbal ng bawat daraan dito
  alternative: mawawasak / magiging kagimbal-gimbal
  rationale: Pinagsasama ng ugat ang ideya ng pagkawasak at pagkagimbal. Itinatampok ng pangunahing salin ang hayag na reaksiyon ng mga nagdaraan, ngunit hindi ipinipilit na iyon lamang ang kahulugan; nakatala sa talababa ang lexical na tensiyon.
- issue: Pagkilala sa בַּיִת bilang templo
  choice: bahay
  alternative: templo
  rationale: Tumutukoy ang salita sa templo sa kontekstong ito, ngunit pinananatili ng “bahay” ang literal na katawagan at posibleng covenantal na alingawngaw. Nililinaw ito sa talababa.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “maringal” sa halip na literal na “mataas” upang malinaw na tumukoy sa dating katanyagan ng templo. Pinanatili ang “bahay” at “lupain” dahil mahalaga ang pag-uulit at covenantal na himig ng Hebreo; ang mga posibleng kalabuan ay ipinaliwanag sa maiikling talababa.
