base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/012.yaml
  text: Then Yahweh appeared to Solomon by night and said to him[b][a], “I have heard your prayer and have chosen this place for myself as a house of sacrifice.”
translation:
  language: tl
  text: At nagpakita si Yahweh kay Solomon sa gabi at sinabi sa kanya, “Narinig ko ang iyong panalangin at pinili ko ang lugar na ito upang maging bahay ng paghahain para sa akin.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּרָא
  choice: nagpakita
  rationale: Ang Niphal ng ראה ay tumutukoy rito sa pagpapakita ni Yahweh kay Solomon; natural at hindi nito tinutukoy nang higit sa teksto ang paraan ng pagpapakita.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang ipinahahayag ng Tetragrammaton sa halip na palitan ito ng isang titulo.
- source_word: בַּלָּיְלָה
  choice: nang gabi
  rationale: Natural na salaysay sa modernong Tagalog para sa pangyayaring naganap sa gabi.
- source_word: שָׁמַעְתִּי אֶת־תְּפִלָּתֶךָ
  choice: Narinig ko ang iyong panalangin
  rationale: Tuwirang ipinapahayag ang natapos na pakikinig na may kaugnayan sa kasalukuyang tugon ni Yahweh.
- source_word: וּבָחַרְתִּי
  choice: at pinili ko
  rationale: Pinananatili ang magkatugmang ganap na kilos ng pandiwa at ang diwang may bisa pa ang pagpili.
- source_word: בַּמָּקוֹם הַזֶּה לִי
  choice: pinili ko para sa akin ang lugar na ito
  rationale: Inilalahad ang lugar bilang pinili para kay Yahweh, habang nananatiling malinaw at natural sa Tagalog.
- source_word: לְבֵית זָבַח
  choice: upang maging bahay ng paghahain
  rationale: Pinananatili ang larawan ng isang ‘bahay’ na itinalaga para sa paghahain, nang hindi ito pinapalitan ng mas interpretatibong salitang ‘templo.’
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehova
  rationale: Personal na pangalan ang nasa Hebreong teksto; pinananatili itong transliterasyon upang hindi mapalitan ng titulo.
- issue: Kahulugan ng לְבֵית זָבַח
  choice: upang maging bahay ng paghahain
  alternative: bilang bahay ng paghahain
  rationale: Maaaring ipahiwatig ng לְ ang layunin o itinakdang gamit. Ang ‘upang maging’ ay malinaw sa Tagalog ngunit hindi nagdaragdag ng denominasyonal na pakahulugan.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang ‘nang gabi’ para sa natural na daloy ng salaysay at ‘bahay ng paghahain’ upang manatiling malapit sa kongkretong pananalita ng Hebreo.
