  source_fidelity: 'Tumpak sa kabuuan ang draft: naipapahayag nito ang pagpapakita ni Yahweh, ang panalangin ni Solomon, ang pagpili sa lugar, at ang layunin nitong maging bahay ng paghahain. Gayunman, ang “Pagkatapos” ay mas tahasang nagsasaad ng pagkakasunod na ‘afterward’ kaysa sa simpleng pang-ugnay na וַ־; mas ligtas ang “At.”'
  naturalness: Natural ang karamihan ng pananalita. Ang “sa gabi” ay mas neutral at karaniwang modernong Filipino kaysa “nang gabi” sa ganitong pangungusap. Mas malinaw rin ang ayos na inilalapit ang “para sa akin” sa itinalagang gamit ng lugar.
  terminology: Ang “Yahweh” ay wastong pananatili ng banal na pangalan. Ang “bahay ng paghahain” ay malapit sa לְבֵית זָבַח at iniiwasang ipalit ang mas interpretatibong “templo.”
