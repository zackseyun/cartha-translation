- from: Pagkatapos, nagpakita si Yahweh kay Solomon nang gabi at sinabi sa kanya, “Narinig ko ang iyong panalangin, at pinili ko para sa akin ang lugar na ito upang maging bahay ng paghahain.”
  to: At nagpakita si Yahweh kay Solomon sa gabi at sinabi sa kanya, “Narinig ko ang iyong panalangin at pinili ko ang lugar na ito upang maging bahay ng paghahain para sa akin.”
  rationale: Pinalitan ang “Pagkatapos” ng “At” upang hindi higit na tukuyin ang ugnayang pangkronolohiya kaysa sa Hebreo. Inayos ang parirala para sa layunin ng lugar upang maging mas malinaw at natural sa modernong Filipino, habang pinananatili ang “Yahweh” at ang malapit-sa-singaw na “bahay ng paghahain.”
