  yaml_path: translation/ot/2_chronicles/007/015.yaml
  text: Now my eyes will be open and my ears attentive to the prayer offered in this place[a].
translation:
  language: tl
  text: Ngayon, ang aking mga mata ay magiging bukás, at ang aking mga tainga ay makikinig nang mabuti sa panalanging iniaalay sa lugar na ito.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring “sa panalanging nauugnay sa lugar na ito” o “sa panalanging nagmumula sa lugar na ito.” Mas literal sa Hebreo: “sa panalangin ng lugar na ito.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַתָּה
  choice: Ngayon
  rationale: Tumutukoy sa kasalukuyang bunga ng naunang pagtatalaga. Likas at tuwiran ang “Ngayon”; ang “Mula ngayon” ay posible ngunit mas interpretatibo.
- source_word: עֵינַי
  choice: ang aking mga mata
  rationale: Pinananatili ang kongkretong antropomorpikong larawan sa Hebreo sa halip na gawing abstraktong “babantayan ko.”
- source_word: יִהְיוּ פְתֻחוֹת
  choice: ay mananatiling bukás
  rationale: Ang imperfect ng היה kasama ng participle na “bukás” ay naglalarawan ng nagpapatuloy na kalagayan. Ipinahihiwatig ng “mananatiling” ang kontekstuwal na saysay nang natural sa Tagalog.
- source_word: וְאָזְנַי קַשֻּׁבוֹת
  choice: at ang aking mga tainga ay makikinig nang mabuti
  rationale: Pinananatili ang larawan ng mga tainga at malinaw na ipinahahayag ang masusing pakikinig na saklaw ng קַשֻּׁבוֹת.
- source_word: לִתְפִלַּת
  choice: sa panalangin
  rationale: Ipinapakita ng ל ang pagtutuon ng pansin sa panalangin; natural sa Tagalog ang “makikinig ... sa panalangin.”
- source_word: הַמָּקוֹם הַזֶּה
  choice: na iniaalay sa lugar na ito
  rationale: Ang literal na pariralang “panalangin ng lugar na ito” ay di-likas at maaaring malabo sa Tagalog. Inilalarawan ng salin ang panalanging kaugnay ng lugar, habang inilalagay sa talababa ang tunay na mga posibilidad ng ugnayang construct.
theological_decisions:
- issue: Antropomorpikong pananalita tungkol sa pandama ng Diyos
  choice: Panatilihin ang “aking mga mata” at “aking mga tainga”
  alternative: “Babantayan ko at pakikinggan”
  rationale: Gumagamit ang Hebreo ng makatawang larawan upang ipahayag ang maingat na pagtugon ng Diyos. Ang pagpapanatili nito ay umiiwas sa pagpapahina ng relasyonal at tipanang puwersa ng pahayag.
- issue: Ugnayan ng panalangin at ng lugar sa pariralang לִתְפִלַּת הַמָּקוֹם הַזֶּה
  choice: “sa panalanging iniaalay sa lugar na ito” sa teksto, kalakip ang mga alternatibo sa talababa
  alternative: “sa panalangin ng lugar na ito” o “sa panalanging nagmumula sa lugar na ito”
  rationale: Hindi tahasang tinutukoy ng construct chain kung ang panalangin ay iniaalay sa lugar, nauugnay rito, o nagmumula rito. Natural ang pangunahing salin, ngunit pinananatili ng talababa ang leksikal na kalabuan.
translation_notes:
  register: Makabagong Filipino na marangal at madaling maunawaan. Ginamit ang “bukás” na may tuldik upang malinaw na tumukoy sa pagiging open, hindi sa tomorrow. Pinanatili ang parallel na larawan ng mga mata at mga tainga, ngunit ginawang natural sa Tagalog ang panaguri.
