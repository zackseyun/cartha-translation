  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וּ/כְ/כַלּ֤וֹת שְׁלֹמֹה֙ לְ/הִתְפַּלֵּ֔ל וְ/הָ/אֵ֗שׁ יָֽרְדָה֙ מֵֽ/הַ/שָּׁמַ֔יִם וַ/תֹּ֥אכַל הָ/עֹלָ֖ה וְ/הַ/זְּבָחִ֑ים וּ/כְב֥וֹד יְהוָ֖ה מָלֵ֥א אֶת הַ/בָּֽיִת־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/001.yaml
  text: And when Solomon finished praying[a], the fire came down from heaven and consumed the burnt offering and the sacrifices[b], and the glory of Yahweh filled the house.
translation:
  language: tl
  text: Nang matapos manalangin si Solomon, bumaba mula sa langit ang apoy at tinupok ang handog na sinusunog at ang mga hain. At napuno ng kaluwalhatian ni Yahweh ang bahay.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “bahay” ay tumutukoy sa templo.
    reason: cultural_note
lexical_decisions:
- source_word: וּכְכַלּוֹת
  choice: Nang matapos
  rationale: Ang temporal na parirala ay likas na isinasalin sa Filipino bilang “Nang matapos,” na nagpapanatili sa pagkakasunod ng mga pangyayari nang hindi ipinipilit na kagyat na kagyat ang sumunod.
- source_word: שְׁלֹמֹה
  choice: Solomon
  rationale: Ito ang nakagawiang anyo ng pangalan sa makabagong Filipino.
- source_word: לְהִתְפַּלֵּל
  choice: manalangin
  rationale: Kasama ng “matapos,” natural at tuwirang ipinapahayag nito ang pagtatapos ng panalangin ni Solomon.
- source_word: וְהָאֵשׁ
  choice: ang apoy
  rationale: Pinananatili ng tiyak na pantukoy ang partikular na apoy na bumaba mula sa langit.
- source_word: יָרְדָה מֵהַשָּׁמַיִם
  choice: bumaba mula sa langit
  rationale: Likas itong Filipino at tapat sa kilos na pababa at sa pinagmulan nitong makalangit.
- source_word: וַתֹּאכַל
  choice: tinupok
  rationale: Bagaman literal na may diwang “kinain,” ang “tinupok” ang natural na pandiwa sa Filipino kapag apoy ang gumagawa ng kilos.
- source_word: הָעֹלָה
  choice: ang handog na sinusunog
  rationale: Ito ang malinaw at nakikilalang katawagan sa uring hain na lubusang sinusunog sa altar.
- source_word: וְהַזְּבָחִים
  choice: at ang mga hain
  rationale: Pinananatili nitong mas malawak ang kahulugan ng זבחים at ang pagkakaiba nito sa espesipikong handog na sinusunog.
- source_word: וּכְבוֹד יְהוָה
  choice: At napuno ng kaluwalhatian ni Yahweh
  rationale: Ang hulma na “napuno ng” ay natural sa Filipino habang malinaw na ang pumuspos sa bahay ay ang nahayag na kaluwalhatian ni Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang transliterasyon ng personal na pangalang Hebreo sa halip na palitan ito ng isang titulo.
- source_word: מָלֵא אֶת־הַבָּיִת
  choice: napuno ... ang bahay
  rationale: Pinananatili ang literal na “bahay,” samantalang ipinapaliwanag sa talababa na templo ang tinutukoy sa konteksto.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo. Ang “Yahweh” ay tuwirang transliterasyon at hindi pinapalitan ang pangalan ng titulong “PANGINOON.”
- issue: Tinutukoy ng הַבָּיִת
  choice: ang bahay
  alternative: ang templo
  rationale: “Bahay” ang literal na salita sa Hebreo at mahalagang katawagan sa salaysay ng Mga Cronica; nililinaw ng talababa na ang templong itinayo ni Solomon ang tinutukoy.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mga hain” upang iwasan ang mabigat na pag-uulit ng “mga handog,” at hinati sa dalawang pangungusap upang maging natural ang daloy nang hindi binabago ang ugnayan ng mga pangyayari.
