base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/011.yaml
  text: So Solomon finished the house of Yahweh and the house of the king[c][b][a], and everything that came upon Solomon’s heart to do in the house of Yahweh and in his own house he successfully accomplished.
translation:
  language: tl
  text: Kaya natapos ni Solomon ang bahay ni Yahweh at ang bahay ng hari.[a] Matagumpay niyang naisagawa ang lahat ng pumasok sa isip ni Solomon[b] na gawin sa bahay ni Yahweh at sa sarili niyang bahay.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “palasyo ng hari.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “lahat ng dumating sa puso ni Solomon,” isang idyoma para sa lahat ng binalak o hinangad niyang gawin.
    reason: cultural_note
  - marker: c
    text: Maaari ring isalin ang huling pandiwa na “nagtagumpay siya” o “ipinagtagumpay niya ito.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְכַל
  choice: natapos
  rationale: Ang pandiwang כלה sa anyong pasalaysay ay tumutukoy sa pagdadala ng gawain hanggang sa lubos na pagkakatapos. Likas sa Filipino ang “natapos ni Solomon” at malinaw ang mga tuwirang layon nito.
- source_word: בֵּית יְהוָה
  choice: bahay ni Yahweh
  rationale: Pinananatili ng “bahay” ang literal na בית at ang pag-uulit nito sa talata; ang “templo” ay tama sa konteksto ngunit higit na interpretatibo. Isinasalin ang pangalang יהוה bilang “Yahweh.”
- source_word: בֵּית הַמֶּלֶךְ
  choice: bahay ng hari
  rationale: Ito ang tuwirang katumbas ng Hebreo at pinananatili ang pag-uulit ng “bahay.” Malamang na tumutukoy ito sa palasyo, kaya inilagay ang mas natural na alternatibo sa talababa.
- source_word: כָּל הַבָּא עַל לֵב שְׁלֹמֹה
  choice: lahat ng sumaisip niyang gawin
  rationale: Ang idyomang על לב ay tumutukoy sa mga balak o hangarin. Ang “sumaisip” ay natural sa modernong Filipino at hindi nagpapasya kung pangunahing diin ay intensiyon o pagnanais.
- source_word: לַעֲשׂוֹת
  choice: gawin
  rationale: Malawak ang saklaw ng עשה; ang “gawin” ang pinakadirekta at angkop sa mga gawaing binalak ni Solomon.
- source_word: וּבְבֵיתוֹ
  choice: sa sarili niyang bahay
  rationale: Nililinaw nito na kay Solomon tumutukoy ang hulaping panghalip at itinatangi ang bahay niya sa bahay ni Yahweh.
- source_word: הִצְלִיחַ
  choice: matagumpay niyang naisagawa
  rationale: Maaaring mangahulugan ang Hiphil ng הצליח na magtagumpay o magpasumpay. Sa konteksto ng mga proyektong isinagawa, ipinahahayag ng parirala ang matagumpay na pagtupad nang hindi ito pinalalawak tungo sa pangkalahatang kasaganaan.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Tuwirang ginagamit sa tekstong Hebreo ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalang tipan sa halip na palitan ito ng isang titulo.
- issue: Saklaw ng הִצְלִיחַ
  choice: matagumpay niyang naisagawa
  alternative: nagtagumpay siya; pinaunlad niya
  rationale: Pinananatili ng salin ang kaugnayan ng pandiwa sa lahat ng binalak gawin ni Solomon, habang kinikilala sa talababa ang ambiguwidad kung tagumpay niya o ang pagpapasumpay sa gawain ang binibigyang-diin.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang pag-uulit ng “bahay” mula sa Hebreo, ngunit isinalin nang likas ang idyoma tungkol sa puso. Ang mga panandang talababa [a], [b], at [c] ay nasa pangunahing teksto at tumutugma sa mga tala.
