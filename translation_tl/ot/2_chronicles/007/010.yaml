base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/010.yaml
  text: And on the twenty-third day of the seventh month he sent the people to their tents[b][a], rejoicing and glad of heart because of the goodness that Yahweh had shown to David and to Solomon and to Israel his people.
translation:
  language: tl
  text: At noong ikadalawampu't tatlong araw ng ikapitong buwan, pinauwi niya ang bayan sa kani-kanilang tolda[a]. Umalis silang nagagalak at masaya ang puso dahil sa kabutihang ginawa ni Yahweh para kay David, kay Solomon, at sa Israel na kanyang bayan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa kani-kanilang tahanan”; literal, “sa kani-kanilang tolda.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְיוֹם עֶשְׂרִים וּשְׁלֹשָׁה לַחֹדֶשׁ הַשְּׁבִיעִי
  choice: At noong ikadalawampu't tatlong araw ng ikapitong buwan
  rationale: Ginamit ang likas na anyo ng petsa sa modernong Tagalog habang pinananatili ng “At” ang pagpapatuloy ng salaysay.
- source_word: שִׁלַּח אֶת־הָעָם
  choice: pinauwi niya ang bayan
  rationale: Sa konteksto, ang piel ng שלח ay pagpapahayo sa nagkakatipong bayan upang bumalik sa kanilang tirahan; mas malinaw at natural dito ang “pinauwi” kaysa literal na “ipinadala.”
- source_word: לְאָהֳלֵיהֶם
  choice: sa kani-kanilang tolda
  rationale: Pinananatili ang kongkretong larawan ng Hebreong “kanilang mga tolda,” habang ang “kani-kanilang” ay likas na pamamahagi sa Tagalog. Ipinaliliwanag sa talababa ang idyomatikong kahulugang tahanan.
- source_word: שְׂמֵחִים וְטוֹבֵי לֵב
  choice: nagagalak at masaya ang puso
  rationale: Ipinahahayag ng una ang aktibong kagalakan at pinananatili ng ikalawa ang Hebreong larawan ng puso sa isang natural na pariralang Tagalog.
- source_word: עַל הַטּוֹבָה אֲשֶׁר עָשָׂה
  choice: dahil sa kabutihang ginawa
  rationale: Tuwirang pinananatili ang pangngalang “kabutihan” at ang karaniwang kahulugan ng עשה na “ginawa”; natural sa Tagalog ang “gumawa ng kabutihan para sa” mga benepisyaryo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasatitik ang personal na pangalang banal na יהוה sa halip na palitan ito ng isang titulo.
- source_word: לְדָוִיד וְלִשְׁלֹמֹה וּלְיִשְׂרָאֵל עַמּוֹ
  choice: para kay David, kay Solomon, at sa Israel na kanyang bayan
  rationale: Ang inuulit na ל ay nagpapakilala sa mga tumanggap ng kabutihan. Likas sa Tagalog ang “para kay/sa,” at malinaw na pinananatili ang Israel bilang kanyang bayan.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Pangalan mismo ang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang pagkakakilanlan nito bilang personal na pangalan nang hindi ito ginagawang titulo.
- issue: Ugnayan ng kabutihan sa tatlong benepisyaryo
  choice: kabutihang ginawa ni Yahweh para kay David, kay Solomon, at sa Israel na kanyang bayan
  alternative: kabutihang ipinakita ni Yahweh kay David, kay Solomon, at sa Israel na kanyang bayan
  rationale: Pinananatili ng “ginawa ... para” ang payak na puwersa ng עשה at ang benepaktibong gamit ng ל. Hindi nito nililinaw nang higit sa teksto kung anong tiyak na mga gawa ang tinutukoy.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “bayan” para sa kolektibong עָם, “tolda” upang mapanatili ang larawang Hebreo, at malinaw na hinati sa dalawang pangungusap para sa likas na daloy nang hindi binabago ang ugnayang pangyayari at dahilan.
