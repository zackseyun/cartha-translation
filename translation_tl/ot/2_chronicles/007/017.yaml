base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/017.yaml
  text: And as for you[a], if you walk before me as your father David walked, doing all that I have commanded you, and if you keep my statutes and my judgments,
translation:
  language: tl
  text: Ikaw naman, kung mamumuhay ka sa harapan ko, gaya ng pamumuhay ng iyong amang si David, at gagawin mo ang lahat ng iniutos ko sa iyo at susundin mo ang aking mga tuntunin at mga hatol[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga pasiya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה
  choice: Ikaw naman
  rationale: Pinananatili nito ang mariing tuwirang pagtukoy kay Solomon at ang paglipat ng paksa, sa natural na modernong Tagalog.
- source_word: אִם
  choice: kung
  rationale: Tuwirang ipinakikita ang kondisyong ipinahahayag ng talata.
- source_word: תֵּלֵךְ לְפָנַי
  choice: mamumuhay ka sa harapan ko
  rationale: Ang literal na larawan ay ‘lalakad sa harapan ko,’ ngunit dito ang paglakad ay idyoma para sa paraan ng pamumuhay sa presensiya ng Diyos. Pinananatili ng salin ang diwa at ang pariralang ‘sa harapan ko’ sa natural na Tagalog.
- source_word: כַּאֲשֶׁר הָלַךְ דָּוִיד אָבִיךָ
  choice: gaya ng pamumuhay ng iyong amang si David
  rationale: Pinananatili ang tahasang paghahambing kay David at inuulit ang diwa ng naunang idyoma.
- source_word: וְלַעֲשׂוֹת כְּכֹל אֲשֶׁר צִוִּיתִיךָ
  choice: na ginagawa ang lahat ng iniutos ko sa iyo
  rationale: Isinasalamin ng sugnay ang infinitive construct bilang kasamang paglalarawan sa hinihinging pamumuhay, sa halip na gawin itong hiwalay na pandiwang may panahunan. Pinananatili rin ang saklaw na ‘lahat.’
- source_word: חֻקַּי
  choice: aking mga tuntunin
  rationale: Natural at malinaw na katawagan para sa itinakdang mga kautusang pangtipan, habang ibinubukod sa kasunod na מִשְׁפָּטַי.
- source_word: וּמִשְׁפָּטַי
  choice: mga hatol
  rationale: Pinananatili ang legal o hudisyal na kulay ng מִשְׁפָּטִים at ang pagkakaiba nito sa ‘mga tuntunin.’
- source_word: תִּשְׁמֹר
  choice: tutuparin mo
  rationale: Sa kontekstong pangtipan, ipinahahayag nito ang masunuring pag-iingat at pagsasagawa ng mga utos sa natural na Tagalog.
theological_decisions:
- issue: Paglalahad ng kondisyong may kinalaman sa pagsunod sa tipan nang hindi nagdaragdag ng teolohiya tungkol sa pagkamit ng biyaya
  choice: Pinanatili ang tunay na kondisyong ‘kung’ at ang tahasang panawagan na mamuhay, gawin ang lahat ng iniutos, at tuparin ang mga tuntunin at hatol.
  alternative: Palabuin ito bilang pangkalahatang katapatan o hinaan ang kondisyong ipinahahayag ng teksto.
  rationale: Tuwirang inihaharap ng Hebreo kay Solomon ang isang kondisyon. Dapat manatili ang bigat at tensiyon nito nang hindi ipinapasok ang anumang sistemang doktrinal na wala sa talata.
- issue: Ugnayang sintaktiko ng huling pandiwa sa nag-iisang kondisyon
  choice: Isinalin bilang ‘at tutuparin mo’ sa loob ng saklaw ng naunang ‘kung.’
  alternative: Ulitin ang ‘kung’ bago ang ‘tutuparin mo.’
  rationale: Iisa lamang ang אִם sa Hebreo; ang huling finite verb ay kasama sa magkakaugnay na nilalaman ng kondisyon. Hindi kailangang magdagdag ng ikalawang panandang kondisyon sa Tagalog.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang ‘mamumuhay’ sa halip na literal na ‘lalakad’ upang malinaw ang Hebreong idyoma, habang pinanatili ang ‘sa harapan ko.’ Ang pangwakas na kuwit ay pinanatili dahil nagpapatuloy ang kondisyong pangungusap sa susunod na talata.
