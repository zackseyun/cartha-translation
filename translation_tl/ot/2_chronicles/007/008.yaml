source:
  edition: WLC
  text: וַ/יַּ֣עַשׂ שְׁלֹמֹ֣ה אֶת הֶ֠/חָג בָּ/עֵ֨ת הַ/הִ֜יא שִׁבְעַ֤ת יָמִים֙ וְ/כָל יִשְׂרָאֵ֣ל עִמּ֔/וֹ קָהָ֖ל גָּד֣וֹל מְאֹ֑ד מִ/לְּב֥וֹא חֲמָ֖ת עַד נַ֥חַל מִצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/008.yaml
  text: At that time Solomon kept the feast for seven days[a], and all Israel with him, a very great assembly[b], from Lebo-hamath to the Brook of Egypt.
translation:
  language: tl
  text: Nang panahong iyon, ipinagdiwang ni Solomon ang kapistahan sa loob ng pitong araw. Kasama niya ang buong Israel—isang napakalaking kapulungan mula sa Lebo-hamat[a] hanggang sa Batis ng Ehipto.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pasukan ng Hamat.” Maaaring unawain ang Hebreo bilang pangalan ng lugar (“Lebo-hamat”) o bilang paglalarawan sa isang hangganan.
    reason: alternative_reading
  - marker: b
    text: O “Wadi ng Ehipto.” Ang salitang Hebreo ay maaaring tumukoy sa isang daluyang pana-panahong may tubig o sa isang batis, sa halip na sa isang malaking ilog.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: ipinagdiwang
  rationale: Bagaman literal na “ginawa,” kapag ang layon ay חָג, ang pandiwa ay tumutukoy sa pagdiriwang o pagtupad ng isang kapistahan. Likas at malinaw sa makabagong Tagalog ang “ipinagdiwang.”
- source_word: הֶחָג
  choice: ang kapistahan
  rationale: Ang חָג ay isang kapistahan o pistang panrelihiyon, lalo na yaong dinarayo. Pinananatili ng “kapistahan” ang tiyak at marangal na diwa nang hindi nagdaragdag ng denominasyonal na kahulugan.
- source_word: בָּעֵת הַהִיא
  choice: Nang panahong iyon
  rationale: Tuwirang salin ng pahayag na panahunan at natural na pambungad sa salaysay sa Tagalog.
- source_word: שִׁבְעַת יָמִים
  choice: sa loob ng pitong araw
  rationale: Malinaw nitong ipinahahayag ang tagal ng pagdiriwang at natural sa Tagalog.
- source_word: וְכָל יִשְׂרָאֵל עִמּוֹ
  choice: Kasama niya ang buong Israel
  rationale: Pinananatili ang kolektibong pagtukoy sa bansang Israel at ang diwa ng pakikisama kay Solomon.
- source_word: קָהָל גָּדוֹל מְאֹד
  choice: isang napakalaking kapulungan
  rationale: Ang קָהָל ay naglalarawan sa nagkakatipong bayan. Ang “kapulungan” ay marangal at hindi labis na eklesiyastikal; ang “napakalaki” ay kumakatawan sa mariing גָּדוֹל מְאֹד.
- source_word: מִלְּבוֹא חֲמָת
  choice: mula sa Lebo-hamat
  rationale: Maaaring unawain ang parirala bilang pangalan ng lugar o nakapirming heograpikong katawagan sa hilagang hangganan. Pinananatili sa pangunahing teksto ang anyong pangalang-pook at inilalahad sa talababa ang tunay na alternatibo.
- source_word: עַד נַחַל מִצְרַיִם
  choice: hanggang sa Batis ng Ehipto
  rationale: Ang נַחַל ay karaniwang batis, bangbang, o daluyang may tubig sa ilang panahon, hindi kinakailangang malaking ilog. Madaling maunawaan ang “Batis ng Ehipto,” habang itinatala sa talababa ang mas teknikal na alternatibo.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Hinati sa dalawang pangungusap upang maging natural ang daloy, habang pinananatili ang ugnayang appositional ng “buong Israel” at “isang napakalaking kapulungan.” Inilagay ang mga pananda ng talababa sa mismong mga heograpikong pariralang tinatalakay ng mga ito.
