translation:
  language: tl
  text: Pagkatapos, ang hari at ang buong bayan ay nag-alay ng mga hain sa harap ni Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “naghahain ng hain,” isang magkaugat na pananalita na nangangahulugang nag-aalay sila ng mga hain.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַמֶּלֶךְ
  choice: Pagkatapos, ang hari
  rationale: Ang וְ ay nagpapatuloy sa salaysay; natural na ipinahahayag ng “Pagkatapos” ang pagkakasunod ng pangyayari, at tuwirang katumbas ng הַמֶּלֶךְ ang “ang hari.”
- source_word: וְכָל הָעָם
  choice: at ang buong bayan
  rationale: Karaniwang tumutukoy ang עָם sa sambayanan o mga tao bilang isang kabuuan. Ang “buong bayan” ay likas at marangal na Filipino para sa lahat ng nagkakatipong mamamayan.
- source_word: זֹבְחִים זֶבַח
  choice: ay nag-aalay ng mga hain
  rationale: Ang participle na זֹבְחִים ay naglalarawan ng nagpapatuloy na gawain, kaya ginamit ang aspektong “nag-aalay.” Ang “mga hain” ay natural na pagpapahayag sa Filipino ng cognate construction na literal na “naghahain ng hain.”
- source_word: לִפְנֵי
  choice: sa harap ni
  rationale: Pinananatili nito ang pangunahing kahulugan na ang paghahandog ay ginawa sa harapan o presensya ng Diyos.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinalin ang Tetragrammaton bilang personal na pangalang “Yahweh,” sa halip na palitan ito ng isang titulo.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehovah
  rationale: Personal na pangalan ang tahasang nasa tekstong Hebreo; pinananatili ng “Yahweh” ang pangalan nang hindi ito pinapalitan ng titulo.
- issue: Kahulugan ng לִפְנֵי sa konteksto ng pagsamba
  choice: sa harap ni Yahweh
  alternative: kay Yahweh
  rationale: Pinananatili ng “sa harap ni” ang diwa ng pagkilos sa presensya ng Diyos at hindi lamang ang direksiyon o tumatanggap ng handog.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “nag-aalay” upang ipakita ang nagpapatuloy na kilos ng participle, habang iniwasan sa pangunahing teksto ang alanganing literal na pag-uulit na “naghahain ng hain.”
