  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/יִכָּנְע֨וּ עַמִּ֜/י אֲשֶׁ֧ר נִֽקְרָא שְׁמִ֣/י עֲלֵי/הֶ֗ם וְ/יִֽתְפַּֽלְלוּ֙ וִֽ/יבַקְשׁ֣וּ פָנַ֔/י וְ/יָשֻׁ֖בוּ מִ/דַּרְכֵי/הֶ֣ם הָ/רָעִ֑ים וַ/אֲנִי֙ אֶשְׁמַ֣ע מִן הַ/שָּׁמַ֔יִם וְ/אֶסְלַח֙ לְ/חַטָּאתָ֔/ם וְ/אֶרְפָּ֖א אֶת אַרְצָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/014.yaml
  text: if my people[a], who are called by my name, humble themselves, and pray and seek my face, and turn from their evil ways, then I will hear from heaven, and I will forgive their sin and heal their land.
translation:
  language: tl
  text: kung ang aking bayan[a], na tinatawag sa aking pangalan, ay magpakumbaba, manalangin, hanapin ang aking mukha, at talikuran ang kanilang masasamang landas, pakikinggan ko mula sa langit, patatawarin ko ang kanilang kasalanan, at pagagalingin ko ang kanilang lupain.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “na ang aking pangalan ay itinawag sa kanila,” isang idyomang Hebreo na nagpapahayag na sila ay pag-aari ng Diyos o nagtataglay ng kanyang pangalan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִכָּנְעוּ
  choice: magpakumbaba
  rationale: Ang Niphal ng כנע ay may kusang-loob o reflexive na diwa rito. Natural sa modernong Tagalog ang “magpakumbaba” at hindi ito ginagawang lubos na pasibo.
- source_word: עַמִּי
  choice: ang aking bayan
  rationale: Tumutukoy ito sa sambayanang kinikilala ng Diyos bilang kanya. Ang “bayan” ay natural na kolektibong katawagan sa kontekstong ito.
- source_word: אֲשֶׁר נִקְרָא שְׁמִי עֲלֵיהֶם
  choice: na tinatawag sa aking pangalan
  rationale: Natural na katumbas ito ng idyomang Hebreo na nagpapahayag ng pag-aari at pagkakakilanlan sa Diyos; inilalahad sa talababa ang mas literal na anyo.
- source_word: וְיִתְפַּלְלוּ
  choice: manalangin
  rationale: Karaniwang kahulugan ng Hitpael ng פלל ang pananalangin. Hindi na idinagdag ang tahasang layon sapagkat malinaw ito sa konteksto.
- source_word: וִיבַקְשׁוּ פָנַי
  choice: hanapin ang aking mukha
  rationale: Pinananatili nito ang kongkretong metapora ng Hebreo tungkol sa paghahangad sa presensya o lingap ng Diyos, sa halip na gawing simpleng “hanapin ako.”
- source_word: וְיָשֻׁבוּ מִדַּרְכֵיהֶם הָרָעִים
  choice: talikuran ang kanilang masasamang landas
  rationale: Ipinahahayag ng שׁוב ang moral na pagtalikod o pagbabalik-loob. Natural sa Tagalog ang “talikuran,” at pinananatili ng “mga landas” ang maramihang metapora para sa pamumuhay.
- source_word: וַאֲנִי אֶשְׁמַע מִן הַשָּׁמַיִם
  choice: diringgin ko sila mula sa langit
  rationale: Ang “diringgin” ay hindi lamang pisikal na pagkarinig kundi mapagkalingang pagtugon. Ginagawang tahasan ng “sila” ang likas na layon sa Tagalog, at pinananatili ng “mula sa langit” ang מן השמים.
- source_word: וְאֶסְלַח לְחַטָּאתָם
  choice: patatawarin ko ang kanilang kasalanan
  rationale: Pinananatili ang isahang kolektibong חטאת bilang “kasalanan,” na natural din sa Tagalog para sa sama-samang pagkakasala.
- source_word: וְאֶרְפָּא אֶת אַרְצָם
  choice: pagagalingin ko ang kanilang lupain
  rationale: Pinananatili ng “pagagalingin” ang metapora ng רפא at ang larawan ng lupaing nasaktan ngunit ibinabalik ng Diyos sa kalagayang maayos.
theological_decisions:
- issue: Kondisyon at tugon ng Diyos
  choice: 'Isinalin ang unang hanay bilang kondisyon sa pamamagitan ng “kung,” at ang kasunod bilang resulta: “diringgin ko…”'
  alternative: Pagdugtungin ang lahat ng sugnay sa pamamagitan lamang ng “at.”
  rationale: Bagaman magkakasunod na pang-ugnay ang gamit sa Hebreo, malinaw sa sintaks at konteksto ang ayos na kondisyon at resulta. Ang “kung” ay likas na paraan upang maipakita ito sa Tagalog nang walang idinadagdag na doktrina.
- issue: Idyoma ng pangalan ng Diyos
  choice: “na tinatawag sa aking pangalan,” na may talababa tungkol sa literal na anyo at diwa ng pag-aari o pagkakakilanlan
  alternative: “na tinatawag ang aking pangalan sa kanila” o “na ang aking pangalan ay itinawag sa kanila”
  rationale: Hindi lamang pagbigkas sa pangalan ang tinutukoy kundi ang pagkakabilang at pagkakakilanlan ng bayan sa Diyos. Pinananatili ng pangunahing salin ang natural na Tagalog habang ipinapaliwanag ng talababa ang idyomang Hebreo.
- issue: Paghanap sa mukha ng Diyos
  choice: Pinanatili ang “hanapin ang aking mukha.”
  alternative: “hanapin ako” o “hanapin ang aking lingap”
  rationale: Ang mas kongkretong pahayag ay tapat sa Hebreo at nagpapanatili sa saklaw ng kahulugan—presensya, pakikipagharap, at lingap—nang hindi pumipili lamang ng isa.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “bayan” bilang kolektibong tawag sa sambayanan ng Diyos, pinanatili ang mga biblikal na metaporang “mukha,” “mga landas,” at “pagagalingin ang lupain,” at iniwasan ang denominasyonal na pagpapakahulugan.
