  text: וַֽ/יַּעֲשׂ֛וּ בַּ/יּ֥וֹם הַ/שְּׁמִינִ֖י עֲצָ֑רֶת כִּ֣י חֲנֻכַּ֣ת הַ/מִּזְבֵּ֗חַ עָשׂוּ֙ שִׁבְעַ֣ת יָמִ֔ים וְ/הֶ/חָ֖ג שִׁבְעַ֥ת יָמִֽים׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/009.yaml
  text: On the eighth day they held a solemn assembly[b][a], for they observed the dedication of the altar for seven days and the feast for seven days.
translation:
  language: tl
  text: Sa ikawalong araw, nagdaos sila ng isang solemne na pagtitipon[a], sapagkat pitong araw nilang idinaos[b] ang pagtatalaga ng altar at pitong araw nilang idinaos ang kapistahan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “pagtitipon” o “pangwakas na pagtitipon.” Ang Hebreong עֲצָרֶת ay tumutukoy sa isang natatanging pagtitipon, lalo na sa pangwakas na bahagi ng isang kapistahang panrelihiyon.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “ipinagdiwang”; mas literal, “ginawa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲצָרֶת
  choice: banal na pangwakas na pagtitipon
  rationale: Tumutukoy ang salita sa isang natatanging pagtitipon na nagtatapos sa isang sagradong kapistahan. Ipinahahayag ng saling ito kapwa ang banal na konteksto at ang pangwakas na katangian nito nang hindi nagiging teknikal o lipas sa pandinig.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala rito ng pangatnig ang paliwanag o dahilan ng pagtitipon sa ikawalong araw.
- source_word: חֲנֻכַּת הַמִּזְבֵּחַ
  choice: ang pagtatalaga ng altar
  rationale: Ang parirala ay tumutukoy sa seremonyal na paglalaan o pagpapasinaya sa altar. Natural at malinaw sa makabagong Filipino ang “pagtatalaga.”
- source_word: עָשׂוּ
  choice: ipinagdiwang
  rationale: Bagaman literal na “ginawa” ang pandiwa, sa konteksto ng seremonyal na pagtatalaga ay mas natural ang “ipinagdiwang,” habang inilalahad sa talababa ang higit na literal na posibilidad.
- source_word: וְהֶחָג
  choice: at ... ang kapistahan
  rationale: Tiyak ang anyo ng Hebreo ngunit hindi nito pinapangalanan ang kapistahan sa talatang ito; kaya pinanatili ang “ang kapistahan” nang hindi idinaragdag ang pangalan nito mula sa konteksto.
- source_word: שִׁבְעַת יָמִים
  choice: pitong araw
  rationale: Malinaw sa ayos ng pangungusap na ito ang tagal, kaya hindi kailangang ulitin ang “sa loob ng” sa bawat parirala.
- source_word: בַּיּוֹם הַשְּׁמִינִי
  choice: Sa ikawalong araw
  rationale: Tuwirang sinasalamin nito ang Hebreo at hindi idinaragdag ang “ng kapistahan,” na wala sa mismong talata.
theological_decisions:
- issue: Pagkakakilanlan ng kapistahan
  choice: Hindi pinangalanan ang kapistahan sa salin.
  alternative: Tawagin itong Kapistahan ng mga Kubol batay sa konteksto.
  rationale: Bagaman matutukoy mula sa mas malawak na konteksto ang kapistahan, “ang kapistahan” lamang ang sinasabi ng Hebreo rito; iniiwasan ng salin ang pagpasok ng impormasyong wala sa talata.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “banal na pangwakas na pagtitipon” upang maipakita ang sagradong konteksto at pangwakas na diwa ng עֲצָרֶת. Pinanatili ang magkatabing dalawang yugto na tigpitong araw at hindi pinangalanan ang kapistahan mula lamang sa konteksto.
