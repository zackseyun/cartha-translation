base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/016.yaml
  text: And now I have chosen and consecrated this house[a], that my name may be there forever[b], and my eyes and my heart will be there all the days.
translation:
  language: tl
  text: At ngayon, pinili ko at itinalaga ko bilang banal ang bahay na ito[a] upang ang aking pangalan ay naroon magpakailanman[b]; at ang aking mga mata at puso ay naroon sa lahat ng araw.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “ibinukod bilang banal.”
    reason: lexical_alternative
  - marker: b
    text: Ang “bahay na ito” ay tumutukoy sa templo.
    reason: cultural_note
lexical_decisions:
- source_word: וְעַתָּה
  choice: At ngayon
  rationale: Pinananatili nito ang pang-ugnay at ang paglipat sa bagong bahagi ng pahayag ng Diyos.
- source_word: בָּחַרְתִּי
  choice: pinili ko
  rationale: Tuwirang ipinapahayag ang natapos na pagpili ng Diyos; natural ito sa modernong Tagalog sa kontekstong ito.
- source_word: וְהִקְדַּשְׁתִּי
  choice: itinalaga
  rationale: Ipinahihiwatig nito ang pagbubukod sa gusali para sa banal na layunin nang hindi gumagamit ng labis na teknikal na salita.
- source_word: הַבַּיִת הַזֶּה
  choice: ang bahay na ito
  rationale: Pinananatili ang literal na 'bahay' ng Hebreo; sa konteksto, ito ang templo.
- source_word: לִהְיוֹת שְׁמִי שָׁם
  choice: upang ang aking pangalan ay naroon
  rationale: Pinananatili ang layunin ng konstruksiyon at ang mahalagang teolohikal na larawan ng pangalan ng Diyos na naroon.
- source_word: עַד עוֹלָם
  choice: magpakailanman
  rationale: Natural at marangal na katumbas ng patuloy at walang-hanggang tagal.
- source_word: וְהָיוּ עֵינַי וְלִבִּי שָׁם
  choice: at ang aking mga mata at aking puso ay naroon
  rationale: Pinananatili ang antropomorpikong larawan ng mapagmasid na malasakit at tapat na pagtatalaga ng Diyos.
- source_word: כָּל הַיָּמִים
  choice: sa lahat ng araw
  rationale: Malapit na sinusundan ang kongkretong idyomang Hebreo sa halip na gawing payak na 'palagi,' habang nananatiling nauunawaan sa Tagalog.
theological_decisions:
- issue: 'Antropomorpikong pananalita tungkol sa Diyos: ''aking mga mata at aking puso'''
  choice: Panatilihin nang tuwiran ang dalawang larawan.
  alternative: Isalin bilang 'ang aking pansin at malasakit.'
  rationale: Sadyang gumagamit ang Hebreo ng mga larawang pangkatawan upang ipahayag ang mapagmasid na presensiya at tapat na malasakit ng Diyos; hindi dapat burahin ang teksturang ito sa pamamagitan ng pagpapaliwanag sa mismong teksto.
- issue: Teolohiya ng templo sa 'aking pangalan ay naroon'
  choice: Panatilihin ang 'aking pangalan.'
  alternative: Isalin bilang 'ako ay naroon' o 'ang aking presensiya ay naroon.'
  rationale: Ang 'pangalan' ay sadyang gamit ng teksto at kaugnay ng pagpapakilala at tipanang presensiya ng Diyos. Ang pagpapalit dito ng 'presensiya' o ng mismong 'ako' ay magpapasya sa isang interpretasyong hindi tahasang sinabi.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at malinaw. Pinanatili ang biblikal na mga larawang “pangalan,” “mga mata,” “puso,” at “lahat ng araw,” ngunit inayos ang pangungusap ayon sa likas na daloy ng Tagalog.
