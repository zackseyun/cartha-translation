  text: Naging ama si Eleazar ni Finehas; naging ama si Finehas ni Abisua.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֶלְעָזָר
  choice: Eleazar
  rationale: Ginamit ang karaniwang anyo ng pangalang ito sa makabagong saling Tagalog at pinanatili itong pantanging pangalan.
- source_word: הוֹלִיד / הֹלִיד
  choice: naging anak ni
  rationale: Sa talaangkanan, ipinahahayag ng Hiphil ng ילד ang ugnayang ama-anak. Ang konstruksiyong “naging anak ni X si Y” ay likas at malinaw sa modernong Tagalog, at hindi nagpapasok ng dagdag na detalye tungkol sa paraan ng pagiging magulang.
- source_word: אֵת
  choice: hindi isinalin nang hiwalay
  rationale: Pananda ito ng tiyak na layon sa Hebreo at walang hiwalay na katumbas sa Tagalog; naipakikita ang tungkulin nito sa ayos ng pangungusap.
- source_word: פִּינְחָס
  choice: Finehas
  rationale: Pinili ang kinagawiang anyong Tagalog ng pangalang biblikal at inulit ito upang mapanatili ang sunod-sunod na anyo ng talaangkanan.
- source_word: אֲבִישׁוּעַ
  choice: Abisua
  rationale: Ginamit ang natural at kinagawiang transliterasyon sa Tagalog.
