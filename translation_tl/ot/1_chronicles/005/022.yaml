  text: For many slain fell[a], because the battle was from God; and they lived in their place until the exile.
translation:
  language: tl
  text: Sapagkat maraming napatay ang nabuwal, dahil ang labanan ay mula sa Diyos; at nanirahan sila roon kapalit nila hanggang sa pagkakatapon.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “hanggang sa pagkabihag.”
    reason: Pinananatili ang alternatibong diwa ng הַגּוֹלָה bilang kalagayan ng pagkabihag o pangyayaring deportasyon.
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ang unang כִּי ay nagpapaliwanag sa naunang ulat ng tagumpay at nagpapanatili ng ugnayang sanhi.
- source_word: חֲלָלִים רַבִּים
  choice: maraming napatay
  rationale: Tumutukoy ang parirala sa maraming nasawi sa labanan, hindi lamang sa pangkalahatang mga patay.
- source_word: נָפָלוּ
  choice: ang nabuwal
  rationale: Karaniwang gamit sa konteksto ng digmaan ang נפל para sa pagkabuwal sa kamatayan; dala na ng “napatay” ang tahasang diwa ng kamatayan.
- source_word: כִּי
  choice: dahil
  rationale: Ang ikalawang כִּי ay tahasang nagbibigay ng dahilan sa malaking bilang ng napatay.
- source_word: מֵהָאֱלֹהִים
  choice: mula sa Diyos
  rationale: Pinananatili nito ang מִן bilang pahiwatig ng pinagmulan nang hindi pinalalawak ang sinabi tungkol sa paraan ng pagkilos ng Diyos.
- source_word: הַמִּלְחָמָה
  choice: ang labanan
  rationale: Tumutukoy ito sa tiyak na sagupaang militar na isinasalaysay sa konteksto.
- source_word: וַיֵּשְׁבוּ
  choice: nanirahan sila
  rationale: Natural na modernong Tagalog ito para sa paninirahan sa nasakop na lupain.
- source_word: תַחְתֵּיהֶם
  choice: sa lugar ng mga iyon
  rationale: Ipinahahayag ng idyoma na pumalit sila bilang mga naninirahan, hindi na literal silang nasa ilalim ng mga natalo.
- source_word: עַד הַגֹּלָה
  choice: hanggang sa pagkakatapon
  rationale: Malinaw na ipinahahayag nito ang deportasyon o pagdadala sa mga lipi mula sa kanilang lupain.
theological_decisions:
- issue: Pakikilahok ng Diyos sa digmaan
  choice: ang labanan ay mula sa Diyos
  alternative: ang labanan ay sa Diyos
  rationale: Pinananatili ng salin ang pahayag ng Hebreo na sa Diyos nagmula ang mapagpasiyang katangian o kinalabasan ng labanan, nang hindi nagdaragdag ng mas malawak na doktrina tungkol sa digmaan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mga iyon” upang maging natural ang pagtukoy sa mga dating naninirahan; iniwasan ang literal ngunit mapanlinlang na “sa ilalim nila.”
