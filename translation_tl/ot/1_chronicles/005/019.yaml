base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/019.yaml
  text: They made war against the Hagrites[a], Jetur, Naphish, and Nodab.
translation:
  language: tl
  text: Nakipagdigma sila laban sa mga Hagrita[a], Jetur, Nafis, at Nodab.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga Hagarita.” Maaaring tumbasan sa dalawang paraang ito ang etnonimong Hebreo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ מִלְחָמָה
  choice: Nakipagdigma sila
  rationale: Ang idyomang Hebreo ay literal na “gumawa ng digmaan,” ngunit ang natural at tumpak na katumbas sa modernong Tagalog ay “nakipagdigma,” na nagpapanatili sa mas malawak na diwa ng pakikidigma at hindi lamang ng isang labanan.
- source_word: עִם
  choice: laban sa
  rationale: Bagaman karaniwang nangangahulugang “kasama/sa,” adversatibo ang gamit nito sa idyoma ng pakikidigma; malinaw itong naihahayag ng “laban sa.”
- source_word: הַגְרִיאִים
  choice: mga Hagrita
  rationale: Pangalan ito ng isang pangkat ng mga tao. Ang “mga Hagrita” ay tuwirang transliterasyon ng anyong Hebreo at likas ang hulaping -ita sa Filipino para sa ganitong etnonimo.
- source_word: וִיטוּר
  choice: kay Jetur
  rationale: Isinalin bilang pangalang pantangi ayon sa karaniwang anyong Filipino; ginamit ang “kay” dahil pangalan ng tao o ninunong kumakatawan sa isang pangkat ang anyo ng talaan.
- source_word: וְנָפִישׁ
  choice: kay Nafis
  rationale: Isinalin ang pangalang pantangi sa anyong madaling bigkasin sa Filipino, kasama ang pang-ukol na “kay” upang maging natural ang talaan.
- source_word: וְנוֹדָב
  choice: at kay Nodab
  rationale: Pinanatili ang pangatnig sa huling pangalan at ginamit ang karaniwang anyong Filipino ng pangalang pantangi.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “nakipagdigma” sa halip na literal na “gumawa ng digmaan.” Pinanatili ang anyong talaan at ang posibleng alternatibong transliterasyon ng etnonimo sa talababa.
