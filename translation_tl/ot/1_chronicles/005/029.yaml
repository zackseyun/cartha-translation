base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/029.yaml
  text: 'The sons of Amram: Aaron[a], Moses, and Miriam; and the sons of Aaron: Nadab and Abihu, Eleazar and Ithamar.'
translation:
  language: tl
  text: 'Ang mga anak ni Amram: sina Aaron[a], Moises, at Miriam; at ang mga anak ni Aaron: sina Nadab, Abihu, Eleazar, at Itamar.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “mga anak na lalaki ni.” Gayunman, kasama sa talaan si Miriam, kaya ang “mga anak” ang ginamit dito bilang panlahatang katawagan sa mga anak ni Amram.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי עַמְרָם
  choice: Ang mga anak ni Amram
  rationale: Ang בְּנֵי ay construct plural ng בֵּן. Sa talaangkanan, natural itong isalin bilang panimulang pariralang “Ang mga anak ni,” habang hindi na kailangang ilantad ang unang pang-ugnay na וּ sa Filipino.
- source_word: אַהֲרֹן וּמֹשֶׁה וּמִרְיָם
  choice: sina Aaron, Moises, at Miriam
  rationale: Ginamit ang “sina” para sa likas na paglilista ng mga pangalang pantangi sa Filipino. Ang paulit-ulit na waw sa Hebreo ay ipinahayag sa natural na bantas at “at” bago ang huling pangalan.
- source_word: וּבְנֵי אַהֲרֹן
  choice: at ang mga anak ni Aaron
  rationale: Pinanatili ang pang-ugnay upang malinaw na maidugtong ang ikalawang sangay ng talaangkanan.
- source_word: נָדָב וַאֲבִיהוּא אֶלְעָזָר וְאִיתָמָר
  choice: sina Nadab, Abihu, Eleazar, at Itamar
  rationale: Isinalin ang listahan sa natural na ayos ng Filipino at ginamit ang karaniwang anyo ng mga pangalang biblikal sa modernong Tagalog.
