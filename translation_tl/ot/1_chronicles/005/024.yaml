base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/024.yaml
  text: 'These were the heads of their fathers’ houses: Epher[a], Ishi, Eliel, Azriel, Jeremiah, Hodaviah, and Jahdiel, mighty men of valor, men of renown[b], heads of their fathers’ houses.'
translation:
  language: tl
  text: 'Ito ang mga pinuno ng mga sambahayan ng kanilang mga ninuno[a]: sina Efer, Ishi, Eliel, Azriel, Jeremias, Hodaviah, at Yahdiel—mga lalaking makapangyarihan at magigiting, mga lalaking bantog[b], at mga pinuno ng mga sambahayan ng kanilang mga ninuno.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Hebreong pananalita ay tumutukoy sa mga sambahayang bumubuo sa isang angkan na nagmula sa iisang ninuno.
    reason: cultural_note
  - marker: b
    text: Sa literal, “mga lalaking may mga pangalan,” ibig sabihin, mga lalaking kilala o natatangi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Ito ang
  rationale: Likas na panimula sa Filipino para sa isang talaan; ipinahihiwatig na ng daloy ang pang-ugnay na וְ nang hindi kailangang isaling literal bilang “At.”
- source_word: רָאשֵׁי בֵית אֲבוֹתָם
  choice: mga pinuno ng mga sambahayan ng kanilang mga ninuno
  rationale: Pinananatili ang estrukturang angkan at sambahayan ng Hebreong parirala, ngunit ipinapahayag sa malinaw na modernong Filipino.
- source_word: עֵפֶר
  choice: Efer
  rationale: Tuwirang transliterasyon sa ortograpiyang Filipino, kung saan ang titik f ang kumakatawan sa tunog ng פ na walang dagesh.
- source_word: יִשְׁעִי
  choice: Yis-i
  rationale: Malapit na transliterasyon ng anyong Hebreo at pinananatili ang paghihiwalay ng mga pantig sa pagitan ng שׁ at ע.
- source_word: אֱלִיאֵל
  choice: Eliel
  rationale: Malinaw at karaniwang transliterasyon ng personal na pangalan.
- source_word: עַזְרִיאֵל
  choice: Azriel
  rationale: Malapit sa Hebreo at madaling basahin sa Filipino.
- source_word: יִרְמְיָה
  choice: Jeremias
  rationale: Ginamit ang pamilyar na anyong Filipino ng pangalan habang kinikilala ang Hebreong pinaikling anyo.
- source_word: הוֹדַוְיָה
  choice: Hodavias
  rationale: Transliterasyong angkop sa Filipino na nagpapanatili sa pangunahing tunog ng Hebreong pangalan.
- source_word: יַחְדִּיאֵל
  choice: Yahdiel
  rationale: Ang paunang y ay sumusunod sa tunog ng Hebreong י; pinananatili rin ang hulaping -el.
- source_word: אֲנָשִׁים גִּבּוֹרֵי חַיִל
  choice: mga makapangyarihan at magigiting na lalaki
  rationale: Sinasaklaw ang lakas, tapang, at kakayahang pandigma ng parirala nang hindi ito nililimitahan lamang sa terminong “mandirigma.”
- source_word: אַנְשֵׁי שֵׁמוֹת
  choice: mga lalaking bantog
  rationale: Natural na Filipino para sa idyomang literal na “mga lalaking may mga pangalan,” na tumutukoy sa mga kilala at natatanging tao.
- source_word: רָאשִׁים לְבֵית אֲבוֹתָם
  choice: mga pinuno ng mga sambahayan ng kanilang mga ninuno
  rationale: Pinanatili ang sinasadyang pag-uulit sa Hebreo at ang kanilang katayuan sa loob ng angkan.
