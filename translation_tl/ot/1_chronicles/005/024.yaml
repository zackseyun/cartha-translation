- from: 'Ito ang mga pinuno ng mga sambahayan ng kanilang mga ninuno[a]: sina Efer, Yis-i, Eliel, Azriel, Jeremias, Hodavias, at Yahdiel. Sila ay mga makapangyarihan at magigiting na lalaki, mga lalaking bantog[b], at mga pinuno ng mga sambahayan ng kanilang mga ninuno.'
  to: 'Ito ang mga pinuno ng mga sambahayan ng kanilang mga ninuno[a]: sina Efer, Ishi, Eliel, Azriel, Jeremias, Hodaviah, at Yahdiel—mga lalaking makapangyarihan at magigiting, mga lalaking bantog[b], at mga pinuno ng mga sambahayan ng kanilang mga ninuno.'
