translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “sambahayan ng kanilang mga ninuno” upang linawin ang sinaunang kaayusang pangangkan nang hindi pinapantay lamang sa modernong nuklear na pamilya. Pinanatili ang pag-uulit ng parirala sa simula at wakas gaya ng nasa Hebreo.
