translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “mga bayang nasasakupan” upang natural na maipahayag ang Hebreong idyoma, habang inilagay sa talababa ang literal na larawan. Iniwasang gawing sobrang tiyak ang tinutukoy ng pangmaramihang hulapi sa huling parirala.
