base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/016.yaml
  text: They lived in Gilead[a], in Bashan and its towns, and in all the pasturelands of Sharon[c][b], as far as their borders.
translation:
  language: tl
  text: Nanirahan sila sa Gilead, sa Bashan at sa mga bayang nasasakupan nito,[a] at sa lahat ng pastulan ng Sharon,[b] hanggang sa kanilang mga hangganan.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal na “mga anak na babae nito,” isang Hebreong idyoma para sa mga bayang nakaugnay o nasasakupan nito.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “mga bukás na lupain” o “mga lupang panlahat” ng Sharon.
    reason: lexical_alternative
  - marker: c
    text: Literal na “sa mga labasan nila”; ibig sabihin, hanggang sa kanilang panlabas na saklaw o mga hangganan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשְׁבוּ
  choice: Nanirahan sila
  rationale: Karaniwang ipinahihiwatig ng יָשַׁב ang paninirahan o pagtira. Likas sa modernong Tagalog ang “nanirahan” at hindi nito labis na idinidiin ang unang pagtatatag ng isang pamayanan.
- source_word: בַּגִּלְעָד
  choice: sa Gilead
  rationale: Pangalan ng lugar; pinanatili sa karaniwang transliterasyon.
- source_word: בַּבָּשָׁן
  choice: sa Bashan
  rationale: Pangalan ng lugar; pinanatili sa karaniwang transliterasyon.
- source_word: וּבִבְנֹתֶיהָ
  choice: at sa mga bayang nasasakupan nito
  rationale: Literal na “at sa mga anak na babae nito,” ngunit isang Hebreong idyoma ito para sa mga bayang nakaugnay o nasasakupan ng pangunahing lugar. Ang hulaping pambabae na isahan ay pinakamalamang na tumutukoy sa Bashan.
- source_word: וּבְכָל מִגְרְשֵׁי
  choice: at sa lahat ng pastulan ng
  rationale: Ang מִגְרָשׁ ay bukás na lupa sa paligid ng mga pamayanan, na madalas gamitin bilang pastulan. Ang “lahat ng pastulan” ay malinaw at angkop sa talaang panteritoryo.
- source_word: שָׁרוֹן
  choice: Sharon
  rationale: Pangalan ng rehiyon; pinanatili sa transliterasyon.
- source_word: עַל תּוֹצְאוֹתָם
  choice: hanggang sa mga dulong hangganan ng mga iyon
  rationale: Literal itong may diwang “sa/ayon sa mga labasan ng mga iyon.” Sa kontekstong heograpikal, tumutukoy ito sa panlabas na saklaw o hangganan. Pinananatili ng “mga iyon” ang pangmaramihang hulapi nang hindi tiyakang nilulutas ang maaaring tinutukoy nito.
