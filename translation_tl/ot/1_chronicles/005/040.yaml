  text: Azariah fathered Seraiah, and Seraiah fathered Jehozadak.
translation:
  language: tl
  text: Si Azarias ang ama ni Seraias, at si Seraias ang ama ni Jehozadak.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַ/עֲזַרְיָה
  choice: Azarias
  rationale: Pangalan ng tao; ginamit ang anyong karaniwan at madaling makilala sa tradisyong biblikal sa Filipino.
- source_word: הוֹלִיד
  choice: naging anak ni
  rationale: Sa talaangkanan, ipinahahayag ng Hiphil ng ילד ang ugnayang ama-anak. Ang likas na pariralang Filipino na “naging anak ni X si Y” ay malinaw, maikli, at hindi lipas, bagaman binabago nito ang pananaw ng pandiwang Hebreo.
- source_word: אֶת
  choice: '[hindi hiwalay na isinalin]'
  rationale: Pananda ng tuwirang layon na walang hiwalay na katumbas sa Filipino; naipahahayag ang tungkulin nito sa ayos ng pangungusap.
- source_word: שְׂרָיָה
  choice: Seraias
  rationale: Pangalan ng tao; isina-Filipino ang baybay habang pinananatiling makikilala ang pangalan.
- source_word: וּ/שְׂרָיָה
  choice: at ... ni Seraias
  rationale: Isinalin ang pang-ugnay na ו bilang “at,” samantalang iniangkop ang pangalan sa likas na kayariang Filipino ng ikalawang sugnay.
- source_word: יְהוֹצָדָק
  choice: Jehozadak
  rationale: Pangalan ng tao; transliterasyong malapit sa anyong Hebreo at karaniwang anyong biblikal.
