base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/007.yaml
  text: 'And his brothers by their clans[a], in the genealogy of their generations: the chief was Jeiel, and Zechariah.'
translation:
  language: tl
  text: 'At ang mga kapatid niya, ayon sa kani-kanilang angkan, nang maitala sila ayon sa kanilang mga salinlahi[a]: ang pinuno ay si Jeiel, at si Zacarias.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa talaan ng kanilang mga salinlahi.”
    reason: Maaaring basahin ang בְּהִתְיַחֵשׂ לְתֹלְדוֹתָם bilang isang nominal na parirala tungkol sa genealogical na talaan, sa halip na bilang temporal na sugnay tungkol sa pagkakatala.
lexical_decisions:
- source_word: וְאֶחָיו
  choice: At ang mga kapatid niya
  rationale: Ang אָח ay tuwirang nangangahulugang “kapatid,” bagaman maaari itong tumukoy nang mas malawak sa mga lalaking kamag-anak sa kontekstong genealogical. Pinanatili ang pinakadirektang kahulugan.
- source_word: לְמִשְׁפְּחֹתָיו
  choice: ayon sa kani-kanilang angkan
  rationale: Sa mga talaan ng lipi, ang מִשְׁפָּחָה ay tumutukoy sa angkan, hindi lamang sa sambahayan. Ginamit ang “kani-kanilang” upang natural na ipahayag sa Filipino ang distributibong kaugnayan nito sa maramihang “mga kapatid,” kahit 3ms ang hulapi sa Hebreo.
- source_word: בְּהִתְיַחֵשׂ לְתֹלְדוֹתָם
  choice: sa talaan ng kanilang mga salinlahi
  rationale: Ang hitpael ng יחס sa Mga Cronica ay tumutukoy sa pagtatala batay sa angkan o talaangkanan, at ang תּוֹלְדוֹת ay mga salinlahi o linya ng pinagmulan. Ang parirala ay pormal ngunit malinaw at pinananatili ang nominal na anyo at bahagyang sintaktikong kalabuan ng Hebreo.
- source_word: הָרֹאשׁ
  choice: ang pinuno ay
  rationale: Ang רֹאשׁ ay maaaring “ulo,” “pinuno,” o pangunahing tao. Ang “pinuno” ang natural na katawagan para sa taong nangunguna sa angkan.
- source_word: יְעִיאֵל
  choice: Jeiel
  rationale: Isinatinig ang pangalang Hebreo sa kinikilalang anyong ginagamit sa mga saling Filipino.
- source_word: וּזְכַרְיָהוּ
  choice: at si Zacarias
  rationale: Ginamit ang tradisyonal at madaling makilalang anyong Filipino ng pangalang Zechariah; idinagdag ang pantukoy na “si” ayon sa natural na balarilang Filipino.
theological_decisions: []
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “angkan,” “talaan,” at “salinlahi” upang mapanatili ang genealogical na himig nang hindi maging teknikal o lipas. Pinanatili sa talababa ang alternatibong temporal na pagbasa sa halip na tuluyang lutasin ang sintaktikong kalabuan.
