  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וִ/יהוֹצָדָ֣ק הָלַ֔ךְ בְּ/הַגְל֣וֹת יְהוָ֔ה אֶת יְהוּדָ֖ה וִ/ירוּשָׁלִָ֑ם בְּ/יַ֖ד נְבֻכַדְנֶאצַּֽר־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/041.yaml
  text: And Jehozadak went away when Yahweh sent Judah and Jerusalem into exile by the hand of Nebuchadnezzar[a].
translation:
  language: tl
  text: At umalis si Jehozadak nang ipatapon ni Yahweh ang Juda at Jerusalem sa pamamagitan ni Nebucadnezar.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O, sa mas pormal na pananalita: “At umalis si Jehozadak nang ipatapon ni Yahweh ang Juda at Jerusalem sa kamay ni Nebucadnezar.”'
    reason: Alternatibong mas literal para sa idyomang Hebreo na בְּיַד, “sa kamay ni.”
lexical_decisions:
- source_word: וִ/יהוֹצָדָק
  choice: At ... si Jehozadak
  rationale: Pinanatili ang pang-ugnay na ו bilang “At,” at isinalin ang buong anyo ng pangalang Hebreo bilang “Jehozadak.”
- source_word: הָלַךְ
  choice: umalis
  rationale: Ang הָלַךְ ay karaniwang “pumunta/lumakad,” ngunit sa konteksto ng pagpapatapon, natural na ipinahihiwatig ng “umalis” ang paglayo niya sa lupain nang hindi sinasabing kusa niyang pinangunahan ang pag-alis.
- source_word: בְּ/הַגְלוֹת
  choice: nang ipatapon
  rationale: 'Ang ב na may infinitive construct ng גלה ay temporal: “nang ipatapon.” Likas ito sa modernong Tagalog at malinaw na ipinakikitang si Yahweh ang pangunahing kumilos.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tinumbasan ang tetragrammaton ng transliterasyon ng personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
- source_word: אֶת יְהוּדָה וִ/ירוּשָׁלָם
  choice: ang Juda at Jerusalem
  rationale: Tuwirang pinangalanan sa Hebreo ang Juda at Jerusalem bilang mga layon; hindi idinagdag ang “mga mamamayan ng” upang maiwasan ang pagpapakahulugang lampas sa anyo ng teksto.
- source_word: בְּ/יַד
  choice: sa pamamagitan ni
  rationale: Ang idyomang “sa kamay ni” ay tumutukoy rito sa ahensiya o kasangkapan. Mas malinaw sa karaniwang modernong Tagalog ang “sa pamamagitan ni,” habang inilalagay sa talababa ang mas pormal na anyo.
- source_word: נְבֻכַדְנֶאצַּר
  choice: Nebucadnezar
  rationale: Ginamit ang nakaugaliang anyo ng pangalan sa mga saling Tagalog, na malinaw na tumutukoy sa hari ng Babilonia.
theological_decisions:
- issue: Ang banal at pantao na pagkilos sa pagpapatapon
  choice: Si Yahweh ang ipinakikitang nagpatapon sa Juda at Jerusalem, at si Nebucadnezar ang taong ginamit bilang kasangkapan.
  alternative: Si Nebucadnezar lamang ang ituring na gumawa ng pagpapatapon.
  rationale: Sa sintaks ng Hebreo, si YHWH ang gumagawa ng kilos ng pagpapatapon, samantalang ang בְּיַד נְבֻכַדְנֶאצַּר ay nagpapahayag ng pantulong na ahensiya. Pinananatili ng salin ang dalawang antas ng pagkilos nang hindi binabawasan ang makasaysayang papel ng Babilonia.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “umalis” at “sa pamamagitan ni” para sa likas na daloy, habang pinanatili sa talababa ang mas pormal na idyomang “sa kamay ni.”
