base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/035.yaml
  text: Ahimaaz fathered Azariah, and Azariah fathered Johanan.
translation:
  language: tl
  text: Si Ahimaaz ay naging ama ni Azarias, at si Azarias ay naging ama ni Johanan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַ/אֲחִימַעַץ
  choice: Ahimaaz
  rationale: Pangalan ng tao; tinumbasan sa pamamagitan ng transliterasyong karaniwang ginagamit sa Bibliyang Tagalog. Ang unang pang-ugnay ay hindi na hiwalay na isinalin sapagkat simula ito ng pangungusap.
- source_word: הוֹלִיד
  choice: naging anak ni … si …
  rationale: Sa talaangkanan, ang Hiphil ng ילד ay tumutukoy sa pagiging ama o pag-aanak. Ang hulma na “naging anak ni X si Y” ay natural at malinaw sa modernong Tagalog, habang pinananatili ang ugnayang genealogical nang hindi gumagamit ng lipas na “ipinanganak ni,” na maaari ring magpahiwatig na si X ang ina.
- source_word: אֶת
  choice: '[hindi hiwalay na isinalin]'
  rationale: Pananda ito ng tiyak na layon sa Hebreo at walang direktang katumbas na kailangang ilantad sa Tagalog.
- source_word: עֲזַרְיָה
  choice: Azarias
  rationale: Pangalan ng tao; ginamit ang anyong pamilyar at natural sa tradisyong Tagalog.
- source_word: וַ/עֲזַרְיָה
  choice: at … ni Azarias
  rationale: Isinalin ang prefixed conjunction na וַ bilang “at” upang malinaw na pagdugtungin ang dalawang sugnay ng talaangkanan.
- source_word: יוֹחָנָן
  choice: Johanan
  rationale: Pangalan ng tao; transliterasyon ng Hebreong יוֹחָנָן, na pinananatiling naiiba sa ibang kaugnay na pangalan.
theological_decisions: []
translation_notes:
