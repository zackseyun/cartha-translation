base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/009.yaml
  text: To the east he settled as far as the entrance to the wilderness from the river Euphrates[a], because their livestock had multiplied in the land of Gilead.
translation:
  language: tl
  text: Sa dakong silangan, nanirahan siya hanggang sa pasukan ng ilang mula sa Ilog Eufrates[a], sapagkat dumami ang kanilang mga alagang hayop sa lupain ng Gilead.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari rin: “hanggang sa ilang mula sa Ilog Eufrates.” Masinsin ang paglalarawan ng hangganan sa Hebreo at maaari itong unawain sa higit sa isang paraan.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְלַמִּזְרָח
  choice: Sa dakong silangan
  rationale: Likas na panandang heograpiko sa modernong Tagalog; hindi na tahasang isinalin ang pangatnig sapagkat nagsisimula rito ang bagong sugnay.
- source_word: יָשַׁב
  choice: nanirahan siya
  rationale: Pinananatili ang isahang pandiwa ng Hebreo, na kolektibong tumutukoy sa angkan sa pamamagitan ng kinatawan nito; ang “nanirahan” ay angkop sa pananakop at pagtira sa teritoryo.
- source_word: עַד לְבוֹא מִדְבָּרָה
  choice: hanggang sa pasukan ng ilang
  rationale: Pinananatili ang kongkretong diwa ng hangganan o paglapit sa ilang, sa halip na payaking “hanggang sa ilang.”
- source_word: לְמִן הַנָּהָר פְּרָת
  choice: mula sa Ilog Eufrates
  rationale: Malapit sa anyo ng Hebreo at sadyang hindi nilulutas ang masikip at maaaring iba-ibang unawaing paglalarawan ng hangganan.
- source_word: כִּי
  choice: sapagkat
  rationale: Malinaw na ipinakikilala ang dahilan ng paglawak patungong silangan sa isang marangal ngunit karaniwang rehistro.
- source_word: מִקְנֵיהֶם
  choice: kanilang mga alagang hayop
  rationale: Saklaw nito ang sari-saring hayop na pag-aari, hindi lamang baka; mas madaling maunawaan kaysa sa teknikal na “mga hayupan.”
- source_word: רָבוּ
  choice: dumami
  rationale: Tuwirang ipinahahayag ang pagdami; sapat ang aspektong naganap sa Tagalog upang maipakita ang sanhi ng naunang paninirahan.
- source_word: בְּאֶרֶץ גִּלְעָד
  choice: sa lupain ng Gilead
  rationale: Pinananatili ang tahasang heograpikong diwa ng אֶרֶץ bilang lupain o teritoryo.
