  yaml_path: translation/ot/1_chronicles/005/012.yaml
  text: Joel the chief[a], Shapham the second, and Jaanai and Shaphat in Bashan.
translation:
  language: tl
  text: Sa Basan, si Joel ang pinuno, si Safam ang pangalawa sa ranggo,[a] at sina Jaanai at Safat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang pangalawang pinuno” o “ang kinatawan.”
    reason: Pinahihintulutan ng Hebreong הַמִּשְׁנֶה ang diwang ikalawa sa ranggo o isang katulong/kinatawan, ngunit hindi tiyak ang eksaktong tungkulin.
lexical_decisions:
- source_word: יוֹאֵל
  choice: Joel
  rationale: Pangalang pantangi; tinumbasan ayon sa karaniwang anyong ginagamit sa modernong saling Tagalog.
- source_word: הָרֹאשׁ
  choice: ang pinuno
  rationale: Bagaman literal na nangangahulugang “ulo” ang רֹאשׁ, tumutukoy ito rito sa pangunahing katayuan o pamumuno; natural at malinaw sa Tagalog ang “pinuno.”
- source_word: וְשָׁפָם
  choice: Safam
  rationale: Pangalang pantangi; isinalin sa anyong madaling basahin at angkop sa ponolohiya ng Tagalog.
- source_word: הַמִּשְׁנֶה
  choice: ang pangalawa sa ranggo
  rationale: Ipinahihiwatig ng מִשְׁנֶה ang ikalawang posisyon o ranggo. Pinananatili ng saling ito ang di-tiyak na tungkulin nang hindi agad ipinapalagay na siya ay isang pormal na kinatawan.
- source_word: וְיַעְנַי
  choice: Jaanai
  rationale: Pangalang pantangi; pinanatili ang malinaw na transliterasyon ng anyong Hebreo.
- source_word: וְשָׁפָט
  choice: Safat
  rationale: Pangalang pantangi; isinalin sa anyong madaling bigkasin sa Tagalog.
- source_word: בַּבָּשָׁן
  choice: sa Basan
  rationale: Pangalan ng lugar na may pang-ukol; natural sa Tagalog ang “sa Basan.”
