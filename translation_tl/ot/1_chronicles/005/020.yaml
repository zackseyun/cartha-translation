id: 1CH.5.20
reference: 1 Chronicles 5:20
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יֵּעָזְר֣וּ עֲלֵי/הֶ֔ם וַ/יִּנָּתְנ֤וּ בְ/יָדָ/ם֙ הַֽ/הַגְרִיאִ֔ים וְ/כֹ֖ל שֶׁ֣/עִמָּ/הֶ֑ם כִּ֠י לֵ/אלֹהִ֤ים זָעֲקוּ֙ בַּ/מִּלְחָמָ֔ה וְ/נַעְתּ֥וֹר לָ/הֶ֖ם כִּי בָ֥טְחוּ בֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/020.yaml
  text: They were helped against them[a], and the Hagrites and all who were with them were given into their hand, because they cried out to God in the battle[c][b], and he answered them because they trusted in him.
translation:
  language: tl
  text: Tinulungan sila laban sa mga iyon, at ibinigay sa kanilang kamay[a] ang mga Hagrita[b] at ang lahat ng kasama ng mga ito, sapagkat humiyaw sila sa Diyos sa gitna ng labanan, at dininig niya sila[c] sapagkat nagtiwala sila sa kanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “ibinigay sa kanilang kamay” ay isang Hebreong idyoma na nangangahulugang ipinaubaya sa kanila upang matalo.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “mga Hagarita.”
    reason: alternative_reading
  - marker: c
    text: O “pinakinggan niya ang kanilang pagsusumamo”; ipinahihiwatig ng Hebreo na kanais-nais na tumugon ang Diyos sa kanilang panalangin.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּעָזְרוּ עֲלֵיהֶם
  choice: Tinulungan sila laban sa mga iyon
  rationale: Pinananatili ang balintiyak na diwa ng Niphal at hindi tahasang pinapangalanan ang tagatulong sa sugnay, bagaman ipinakikita ng kasunod na konteksto na ang Diyos ang tumulong.
- source_word: וַיִּנָּתְנוּ בְיָדָם
  choice: ibinigay sa kanilang kamay
  rationale: Pinananatili ang Hebreong larawang-idiomatiko para sa pagpapasailalim o pagkatalo sa digmaan; nililinaw ito sa talababa.
- source_word: הַהַגְרִיאִים
  choice: mga Hagrita
  rationale: Likas na anyong Tagalog ng pangalan ng pangkat-etniko, batay sa transliterasyong Hagrite; itinatala sa talababa ang alternatibong Hagarita.
- source_word: וְכֹל שֶׁעִמָּהֶם
  choice: at ang lahat ng kasama ng mga ito
  rationale: Malinaw na tumutukoy sa mga kakampi o puwersang kasama ng mga Hagrita.
- source_word: כִּי לֵאלֹהִים זָעֲקוּ
  choice: sapagkat humiyaw sila sa Diyos
  rationale: Ipinahahayag ng זעק ang apurahan at marubdob na paghingi ng tulong.
- source_word: בַּמִּלְחָמָה
  choice: sa gitna ng labanan
  rationale: Tumutukoy sa tiyak na labanang isinasalaysay, hindi sa digmaan sa pangkalahatan.
- source_word: וְנַעְתּוֹר לָהֶם
  choice: at dininig niya sila
  rationale: Ipinahahayag nang natural sa Tagalog ang kanais-nais na pagtugon ng Diyos sa kanilang pagsusumamo, habang hindi nagdaragdag ng tahasang layon na wala sa Hebreo.
- source_word: כִּי בָטְחוּ בוֹ
  choice: sapagkat nagtiwala sila sa kanya
  rationale: Tapat at natural na katumbas ng pagtitiwala o pananalig sa Diyos, at pinananatili ang ugnayang sanhi.
theological_decisions:
- issue: Ang kumilos bilang tagatulong sa labanan
  choice: 'Pinanatiling hindi tahasang binanggit sa unang sugnay ang tagatulong: “Tinulungan sila.”'
  alternative: “Tinulungan sila ng Diyos laban sa mga iyon.”
  rationale: Balintiyak ang anyong Hebreo at hindi nito tahasang binabanggit ang tagaganap sa sugnay. Gayunman, malinaw sa mga kasunod na sugnay na ang Diyos ang sukdulang pinagmulan ng tulong.
- issue: Ang kanais-nais na tugon ng Diyos sa panalangin
  choice: “dininig niya sila”
  alternative: “hinayaan niyang mapakiusapan nila siya” o “sinagot niya ang kanilang pagsusumamo”
  rationale: Ang Niphal ng עתר ay nagsasaad na pinakinggan at kanais-nais na tinugon ng Diyos ang kanilang pagsusumamo. Ang “dininig” ay dignified, natural, at hindi labis na nagpapaliwanag.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang balintiyak na pahayag at ang Hebreong idyoma, na may maiikling talababa para sa mga tunay na alternatibo at paglilinaw.
