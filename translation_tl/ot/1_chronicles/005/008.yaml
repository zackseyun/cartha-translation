base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/008.yaml
  text: and Bela son of Azaz[a], son of Shema, son of Joel; he lived in Aroer, as far as Nebo and Baal-meon.
translation:
  language: tl
  text: At si Bela, anak ni Azaz, anak ni Sema, anak ni Joel—siya ay nanirahan[a] sa Aroer hanggang sa Nebo at Baal-meon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “tumira”; ang pandiwang participle sa Hebreo ay nagpapahiwatig ng paninirahan sa isang lugar.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבֶלַע
  choice: At si Bela
  rationale: Pinanatili ang pang-ugnay upang maipakita ang pagpapatuloy ng talaan; ang pangalang בלע ay tinumbasan sa anyong Bela.
- source_word: בֶּן
  choice: anak ni
  rationale: Ito ang natural at pormal na katumbas sa Filipino para sa ugnayang ipinahahayag ng genealogical na בֶּן.
- source_word: עָזָז
  choice: Azaz
  rationale: Isinulat ang personal na pangalan ayon sa malapit na transliterasyon.
- source_word: שֶׁמַע
  choice: Sema
  rationale: Isinulat ang personal na pangalan sa anyong madaling bigkasin sa Filipino habang sinusundan ang Hebreong tunog.
- source_word: יוֹאֵל
  choice: Joel
  rationale: Ginamit ang nakasanayang anyo ng pangalang ito sa Filipino.
- source_word: הוּא
  choice: siya ay
  rationale: Pinanatili ang panibagong pagtukoy at bahagyang diin sa tauhan pagkatapos ng talaangkanan.
- source_word: יוֹשֵׁב
  choice: nanirahan
  rationale: Ang Qal participle ay tumutukoy sa paninirahan o pagtira sa isang lugar; natural sa Filipino ang 'nanirahan' sa salaysay na ito.
- source_word: בַּעֲרֹעֵר
  choice: sa Aroer
  rationale: Ang בְּ ay panandang lokatibo; ang 'sa' ang likas na katumbas nito sa Filipino.
- source_word: וְעַד
  choice: hanggang sa
  rationale: Malinaw nitong ipinahahayag ang hangganan o lawak ng teritoryo mula Aroer patungo sa mga sumunod na lugar.
- source_word: נְבוֹ
  choice: Nebo
  rationale: Isinulat ang pangalan ng lugar ayon sa karaniwang transliterasyon.
- source_word: וּבַעַל מְעוֹן
  choice: at Baal-meon
  rationale: Pinanatili ang pang-ugnay sa dalawang pangalan ng lugar at ang tambalang anyo ng Baal-meon.
