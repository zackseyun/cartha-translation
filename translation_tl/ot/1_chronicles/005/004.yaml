  text: 'The sons of Joel: Shemaiah his son[a], Gog his son, Shimei his son.'
translation:
  language: tl
  text: 'Ang mga anak ni Joel: si Semaias na anak niya[a], si Gog na anak nito, at si Simei na anak nito.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga inapo ni Joel.” Kung minsan, ang pormulang Hebreo sa mga talaangkanan ay maaaring tumukoy sa mas malawak na salinlahi, ngunit ang paulit-ulit na pormulang “anak ...” rito ay sumusuporta sa tuwirang linya ng mga anak.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: mga anak ni
  rationale: Tuwirang katumbas ng construct plural na בְּנֵי at likas na panimula ng talaangkanan sa Filipino; maaari rin itong tumukoy sa mas malawak na mga inapo sa ilang konteksto.
- source_word: יוֹאֵל
  choice: Joel
  rationale: Pangalang pantangi; ginamit ang karaniwang anyo sa mga saling Bibliya sa Filipino.
- source_word: שְׁמַעְיָה
  choice: Semaias
  rationale: Pangalang pantangi; ginamit ang kinikilalang anyong Filipino upang maging pamilyar at madaling basahin.
- source_word: בְנוֹ
  choice: anak niya / anak nito
  rationale: Ang pangngalan na may hulaping ikatlong panauhang panlalaki ay nagpapahayag ng ugnayang anak. Ginamit ang “niya” sa unang banggit at “nito” sa mga sumunod upang maging malinaw at natural ang sunod-sunod na salinlahi.
- source_word: גּוֹג
  choice: Gog
  rationale: Tuwirang transliterasyon ng pangalang pantangi; wala itong ipinahihiwatig na pagkakakilanlan sa ibang Gog sa Kasulatan.
- source_word: שִׁמְעִי
  choice: Simei
  rationale: Pangalang pantangi; ginamit ang karaniwang anyong Filipino ng pangalang biblikal.
