source:
  edition: WLC
  text: כִּ֤י יְהוּדָה֙ גָּבַ֣ר בְּ/אֶחָ֔י/ו וּ/לְ/נָגִ֖יד מִמֶּ֑/נּוּ וְ/הַ/בְּכֹרָ֖ה לְ/יוֹסֵֽף׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/002.yaml
  text: For Judah prevailed over his brothers[a], and from him came the ruler, though the birthright belonged to Joseph.
translation:
  language: tl
  text: Sapagkat higit na naging makapangyarihan si Juda kaysa sa kanyang mga kapatid, at mula sa kanya nagmula ang pinuno[a], bagaman kay Jose napunta ang karapatan ng panganay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “tagapamahala” o “prinsipe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Nagpapakilala ito ng paliwanag kaugnay ng naunang pahayag tungkol kay Ruben at sa pagkawala ng kanyang katayuan bilang panganay.
- source_word: יְהוּדָה
  choice: Juda
  rationale: Karaniwang anyo sa makabagong saling Tagalog ng pangalang pantangi.
- source_word: גָּבַר
  choice: nanaig
  rationale: Ipinahihiwatig ng pandiwa ang pagiging malakas o nakahihigit; likas na ipinapahayag ng “nanaig” ang pangingibabaw ni Juda sa kanyang mga kapatid.
- source_word: בְּאֶחָיו
  choice: sa kanyang mga kapatid
  rationale: Kasama ng גבר, ipinapahayag ng parirala ang pangingibabaw ni Juda kung ihahambing sa kanyang mga kapatid.
- source_word: וּלְנָגִיד מִמֶּנּוּ
  choice: at sa kanya nagmula ang pinuno
  rationale: Ipinapanatili ang pinagmulan ng pinuno kay Juda at isinasalin ang נָגִיד sa likas na Tagalog nang hindi tinutukoy kung sinong pinuno ang tinutukoy.
- source_word: וְהַבְּכֹרָה
  choice: bagaman ... napunta ang karapatan ng panganay
  rationale: Ipinakikita ng “bagaman” ang pagsalungat sa pagitan ng pamumuno ni Juda at ng pribilehiyo ng pagkapanganay na ibinigay kay Jose.
- source_word: לְיוֹסֵף
  choice: kay Jose
  rationale: Ipinahihiwatig ng lamed dito ang pag-aari o pagkakaloob ng karapatan ng panganay kay Jose.
theological_decisions:
- issue: Ugnayan ng pangingibabaw ni Juda at ng karapatan ng panganay ni Jose
  choice: Pinaghihiwalay ng talata ang pangingibabaw at pamumunong nagmula kay Juda mula sa karapatan ng panganay na napunta kay Jose.
  alternative: Maaaring unawain nang mas maluwag na si Juda ang naging pinakamakapangyarihan samantalang kay Jose nanatili ang mga pribilehiyo sa mana.
  rationale: Magkatabing inilalahad ng Hebreo ang pangingibabaw ni Juda at ang paglitaw ng isang נָגִיד mula sa kanya, ngunit sinasabing kay Jose ang בְּכֹרָה. Pinananatili ng salin ang tensiyong ito sa halip na pagsamahin ang dalawang magkaibang katayuan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “nanaig” para sa maikli ngunit matibay na paghahambing, at “karapatan ng panganay” upang malinaw na tukuyin ang legal at pampamilyang katayuan, hindi lamang ang pagiging unang ipinanganak.
