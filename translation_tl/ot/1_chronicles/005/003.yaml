  text: 'The sons of Reuben, the firstborn of Israel: Hanoch, Pallu, Hezron, and Carmi.'
translation:
  language: tl
  text: 'Ang mga anak ni Ruben, ang panganay ni Israel: sina Hanoc, Pallu, Hezron, at Carmi.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: mga anak ni
  rationale: Sa talaangkanan, ang construct plural ng בֵּן ay tumutukoy sa mga lalaking anak; natural sa modernong Tagalog ang “mga anak ni” nang hindi pinalalawak sa “mga inapo.”
- source_word: רְאוּבֵן
  choice: Ruben
  rationale: Ginamit ang nakagawiang anyo ng pangalang biblikal sa Tagalog.
- source_word: בְּכֹר יִשְׂרָאֵל
  choice: na panganay ni Israel
  rationale: Pinananatili ang appositional na pagkakakilanlan kay Ruben bilang panganay ni Israel; malinaw at natural ang sugnay na may “na” sa Tagalog.
- source_word: חֲנוֹךְ
  choice: Hanoc
  rationale: Transliterasyong angkop sa ortograpiyang Filipino at malapit sa tunog ng Hebreo.
- source_word: פַלּוּא
  choice: Pallu
  rationale: Direktang transliterasyon ng pangalang Hebreo, na pinananatili ang dobleng katinig sa nakagawiang anyong biblikal.
- source_word: חֶצְרוֹן
  choice: Hezron
  rationale: Pinanatili ang nakikilalang transliterasyon ng pangalang biblikal.
- source_word: כַרְמִי
  choice: Carmi
  rationale: Pinanatili ang nakikilalang transliterasyon ng pangalang biblikal.
