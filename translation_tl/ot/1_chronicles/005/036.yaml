translation_notes:
  register: Modernong Filipino na simple ngunit marangal. Ginamit ang “bahay” sa pangunahing teksto upang mapanatili ang salita ng Hebreo, habang nililinaw sa talababa ang tiyak na tinutukoy. Ginamit ang tradisyonal at pamilyar na anyong Filipino na “Azarias.”
