base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/036.yaml
  text: And Johanan fathered Azariah[a]; he was the one who served as priest in the house that Solomon built in Jerusalem.
translation:
  language: tl
  text: At si Johanan ang naging ama ni Azarias; siya ang naglingkod bilang pari sa bahay[a] na itinayo ni Solomon sa Jerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa templo.” Sa Hebreo, “sa bahay,” isang karaniwang tawag sa templo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/יוֹחָנָן
  choice: At ... ni Johanan
  rationale: Pinanatili ang pang-ugnay na ו bilang “At” upang maipagpatuloy ang daloy ng talaangkanan; ginamit ang karaniwang anyong Filipino ng pangalang Johanan.
- source_word: הוֹלִיד אֶת עֲזַרְיָה
  choice: naging anak ni Johanan si Azarias
  rationale: Sa konteksto ng talaangkanan, ipinapahayag ng Hiphil ng ילד ang pagiging ama o pag-aanak. Ang “naging anak ni ... si ...” ay likas at malinaw sa modernong Filipino, at iniiwasan ang mas luma o teknikal na “ipinanganak” na maaaring magpalabo sa aktibong anyo ng Hebreo.
- source_word: הוּא אֲשֶׁר
  choice: siya ang
  rationale: Ipinakikita ng parirala ang pagbibigay-diin at pagtukoy kay Azarias; likas na naihahayag ito sa Filipino sa pamamagitan ng “siya ang.”
- source_word: כִּהֵן
  choice: naglingkod bilang pari
  rationale: Ipinahihiwatig ng pandiwa ang aktuwal na pagtupad ng tungkulin bilang pari, hindi lamang ang pagkakaroon ng titulong pari.
- source_word: בַּ/בַּיִת
  choice: sa bahay
  rationale: Pinanatili ang literal na “bahay” ng Hebreo. Malinaw sa kasunod na sugnay na ang tinutukoy ay ang templong itinayo ni Solomon, kaya inilagay ang mas tiyak na kahulugan sa talababa.
- source_word: אֲשֶׁר בָּנָה שְׁלֹמֹה
  choice: na itinayo ni Solomon
  rationale: 'Natural na pasibong sugnay sa Filipino na tapat sa ugnayan ng orihinal: si Solomon ang nagtayo sa bahay.'
- source_word: בִּ/ירוּשָׁלִָם
  choice: sa Jerusalem
  rationale: Karaniwang salin ng pang-ukol at pangalan ng lugar.
