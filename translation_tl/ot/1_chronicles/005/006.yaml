base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/006.yaml
  text: Beerah his son[a], whom Tilgath-pilneser king of Assyria carried away into exile—he was a chief of the Reubenites.
translation:
  language: tl
  text: Si Beera, na kanyang anak, na ipinatapon ni Tilgat-pilneser[a], hari ng Asiria—siya ay isang pinuno ng mga Rubenita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang anyo ng pangalan ng hari ng Asiria sa Hebreo rito ay “Tilgat-pilneser”; mas kilala siya sa anyong “Tiglat-pileser.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּאֵרָה
  choice: Beera
  rationale: Isinalin sa baybay-Filipino ang pangalang Hebreo, habang pinananatiling malinaw at madaling bigkasin.
- source_word: בְנוֹ
  choice: anak niya
  rationale: Likas na katumbas sa Filipino ng pangngalang may hulaping panlalaking isahan; tumutukoy ito sa naunang binanggit na ninuno sa talaangkanan.
- source_word: אֲשֶׁר הֶגְלָה
  choice: na ipinatapon
  rationale: Ipinahahayag ng Hiphil ng גלה ang pagpapadala sa isang tao sa pagkatapon. Ang “ipinatapon” ay natural at malinaw sa kontekstong historikal.
- source_word: תִּלְגַת פִּלְנְאֶסֶר
  choice: Tilgat-pilneser
  rationale: Malapit itong kumakatawan sa anyo ng pangalan sa tekstong Hebreo ng talatang ito, sa halip na iayon sa mas pamilyar na ibang anyo ng pangalan.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: hari ng Asiria
  rationale: Direkta at likas na salin ng pariralang konstrukto.
- source_word: הוּא
  choice: siya
  rationale: Pinananatili ang nagsasarili at pansuming panghalip na muling nagtutuon kay Beera matapos ang sugnay na naglalarawan sa pagpapatapon sa kanya.
- source_word: נָשִׂיא
  choice: pinuno
  rationale: Sa kontekstong pantribo, tumutukoy ito sa kinikilalang lider. Iniiwasan ng “pinuno” ang posibleng makapamilyang kahulugang maharlika ng “prinsipe.”
- source_word: לָרְאוּבֵנִי
  choice: ng mga Rubenita
  rationale: Ipinahahayag ng lamed ang pangkat na kanyang pinamumunuan; ito ang pinakanatural na ugnayan sa Filipino.
