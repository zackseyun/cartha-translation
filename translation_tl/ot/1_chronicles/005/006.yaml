translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang bahagyang pansuming ayos ng Hebreo sa “siya ay isang pinuno” upang maibalik nang malinaw ang pokus kay Beera matapos ang mahabang sugnay na pang-ugnay.
