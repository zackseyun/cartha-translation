base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/011.yaml
  text: And the sons of Gad lived opposite them in the land of Bashan[b][a], as far as Salecah.
translation:
  language: tl
  text: At ang mga anak ni Gad ay nanirahan sa tapat nila[a], sa lupain ng Basan hanggang Salca[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “katabi nila” o “nakaharap sa kanila.” Ipinahahayag ng Hebreo ang kaugnay na kinalalagyan nila sa pangkat na binanggit sa naunang talata.
    reason: lexical_alternative
  - marker: b
    text: Ang Salca ay isinusulat ding “Saleka” o “Salecah” sa ibang mga salin.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְנֵי גָד
  choice: At ang mga anak ni Gad
  rationale: Pinananatili ng “mga anak ni Gad” ang anyong Hebreo at likas din itong tumutukoy sa pangkat na nagmula kay Gad sa kontekstong pantribo.
- source_word: לְ/נֶגְדָּ/ם
  choice: sa tapat nila
  rationale: Ipinahahayag nito ang kaugnay na kinalalagyan ng mga Gadita sa pangkat na binanggit sa naunang talata, nang hindi labis na nililinaw ang tiyak na heograpikong ugnayan.
- source_word: יָשְׁבוּ
  choice: nanirahan
  rationale: Sa ulat tungkol sa teritoryo, likas na ipinahahayag ng “nanirahan” ang patuloy na paninirahan, hindi lamang ang unang pagkakatatag ng pamayanan.
- source_word: בְּ/אֶרֶץ הַ/בָּשָׁן
  choice: sa lupain ng Basan
  rationale: Ang אֶרֶץ ay tumutukoy rito sa isang pinangalanang rehiyon; ang “lupain” ay malinaw at marangal na katumbas sa modernong Filipino.
- source_word: עַד
  choice: hanggang
  rationale: Nagsasaad ito ng hangganan o lawak ng teritoryo at natural na naipahahayag sa Filipino sa pamamagitan ng “hanggang.”
- source_word: סַלְכָה
  choice: Salca
  rationale: Ang “Salca” ay tuwirang transliterasyon ng pangalang Hebreo na angkop sa ortograpiyang Filipino; kinikilala sa talababa ang alternatibong anyo.
