base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/010.yaml
  text: In the days of Saul they made war with the Hagrites[a], and they fell into their hand[b]; and they lived in their tents throughout all the region east of Gilead.
translation:
  language: tl
  text: Noong panahon ni Saul, nakipagdigma sila sa mga Hagrita[a]. Natalo nila ang mga ito[b], at nanirahan sila sa mga tolda ng mga ito sa buong lupain sa silangan ng Gilead.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga Hagarita.” Malamang na tumutukoy ang katawagang Hebreo sa isang bayang may kaugnayan kay Hagar.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “nahulog sila sa kanilang kamay,” ibig sabihin, napasailalim sila sa kanilang kapangyarihan. Ang mga Hagrita ang ipinahiwatig na mga natalo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִימֵי שָׁאוּל
  choice: Noong panahon ni Saul
  rationale: Ang pariralang בימי ay idyomang tumutukoy sa isang yugto; natural at marangal sa modernong Tagalog ang “noong panahon ni.”
- source_word: עָשׂוּ מִלְחָמָה עִם
  choice: nakipagdigma sila sa
  rationale: Ang עשה מלחמה ay nangangahulugang makipagdigma, at ang עִם ay likas na naipapahayag na “sa” sa ganitong konteksto sa Tagalog.
- source_word: הַהַגְרִאִים
  choice: mga Hagrita
  rationale: Isang tuwirang anyong Tagalog ng etnonimong Hebreo; pinananatili ng talababa ang posibleng mas malinaw na kaugnayan nito kay Hagar.
- source_word: וַיִּפְּלוּ בְּיָדָם
  choice: Natalo nila ang mga ito
  rationale: Ang literal na “nahulog sa kanilang kamay” ay idyoma para sa pagkasadlak sa kapangyarihan ng iba. Malinaw at natural ang “natalo nila,” habang ipinapaliwanag sa talababa ang larawan at ang ipinahiwatig na simuno.
- source_word: וַיֵּשְׁבוּ בְּאָהֳלֵיהֶם
  choice: nanirahan sila sa mga tolda ng mga ito
  rationale: Pinananatili ang konkretong larawan ng mga tolda at nililinaw sa pamamagitan ng “mga ito” na malamang na ang tinutukoy ay ang mga Hagrita.
- source_word: עַל כָּל פְּנֵי מִזְרָח לַגִּלְעָד
  choice: sa buong lupain sa silangan ng Gilead
  rationale: Natural na inilalarawan nito ang lawak ng lugar na nasa silangan ng Gilead nang hindi ginagawang literal at mabigat ang idyomang “sa buong mukha ng.”
