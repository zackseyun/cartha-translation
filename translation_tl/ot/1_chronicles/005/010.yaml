  source_fidelity: 'Tumpak ang pagsasalin sa Hebreo. Ang “nakipagdigma sila sa,” “Natalo nila ang mga ito,” at “nanirahan sila sa mga tolda ng mga ito” ay wastong nagpapahayag ng daloy ng salaysay: nakidigma ang pangkat na tinutukoy sa naunang konteksto laban sa mga Hagrita, natalo ang mga Hagrita, at inookupahan ng mga nagwagi ang kanilang mga tolda. Ang “Natalo nila” ay isang natural na pagpapahayag ng idyomang “nahulog sila sa kanilang kamay”; ipinaliliwanag ng talababa ang mas literal na larawan at ang ipinahiwatig na simuno. Wasto rin ang saklaw na “sa buong lupain sa silangan ng Gilead.”'
