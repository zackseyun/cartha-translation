  terminology: Ang “Saul,” “Gilead,” at “mga Hagrita” ay pare-pareho at katanggap-tanggap na mga anyo. Ang alternatibong “mga Hagarita” sa talababa ay kapaki-pakinabang upang maipakita ang posibleng kaugnayan ng etnonimo kay Hagar nang hindi ipinipilit ang isang tiyak na historikal na pagbasa.
