  yaml_path: translation/ot/1_chronicles/005/038.yaml
  text: Ahitub fathered Zadok, and Zadok fathered Shallum.
translation:
  language: tl
  text: Si Ahitub ang naging ama ni Zadok, at si Zadok ang naging ama ni Shallum.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַ/אֲחִיטוּב
  choice: Si Ahitub
  rationale: Ang pangalang pantangi ay tinumbasan sa karaniwang anyong ginagamit sa Tagalog; ang panimulang pang-ugnay ay hindi na hiwalay na isinalin upang maging natural ang simula ng pangungusap.
- source_word: הוֹלִיד
  choice: ang naging ama ni
  rationale: Sa talaangkanan, ang Hiphil ng ילד ay nangangahulugang ‘magkaanak bilang ama’ o ‘maging ama ni.’ Natural at malinaw ito sa modernong Tagalog at hindi kasing-arkaiko ng ‘ipinanganak’ o ‘begat.’
- source_word: אֶת
  choice: '[hindi hiwalay na isinalin]'
  rationale: Pananda ito ng tiyak na layon sa Hebreo at walang tuwirang katumbas na salita sa Tagalog.
- source_word: צָדוֹק
  choice: Zadok
  rationale: Pangalang pantangi na isinalin sa pamamagitan ng transliterasyong karaniwang ginagamit sa Tagalog.
- source_word: וְ/צָדוֹק
  choice: at si Zadok
  rationale: Ang וְ ay isinaling ‘at’ upang pagdugtungin ang magkasunod na salinlahi; ginamit ang ‘si’ bilang natural na pananda sa pangalang pantao.
- source_word: הוֹלִיד
  choice: ang naging ama ni
  rationale: Inulit ang parehong salin upang mapanatili ang linaw at pagkakapare-pareho ng pormula sa talaangkanan.
- source_word: שַׁלּוּם
  choice: Shallum
  rationale: Pangalang pantangi na isinalin sa pamamagitan ng transliterasyong karaniwang ginagamit sa Tagalog.
