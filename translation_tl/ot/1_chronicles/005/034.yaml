  text: Si Ahitub ang ama ni Zadok, at si Zadok ang ama ni Ahimaaz.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲחִיטוּב
  choice: Ahitub
  rationale: Pangalang pantangi; isinalin sa karaniwang anyong transliterado sa Filipino.
- source_word: הוֹלִיד
  choice: naging anak ni
  rationale: Sa talaangkanan, ipinahahayag ng Hiphil ng ילד ang ugnayan ng ama at anak. Ang likas na pariralang Filipino na “naging anak ni … si …” ay malinaw at marangal, at iniiwasan ang lipas na “ipinanganak” na maaaring magpahiwatig na ang ama mismo ang nanganak.
- source_word: אֶת
  choice: '[hindi tuwirang isinalin]'
  rationale: Pananda ito ng tiyak na layon sa Hebreo at walang hiwalay na katumbas na salita sa Filipino; naipakikita ang tungkulin nito sa ayos ng pangungusap.
- source_word: צָדוֹק
  choice: Zadok
  rationale: Pangalang pantangi; pinanatili sa karaniwang transliteradong anyo.
- source_word: וְ
  choice: at
  rationale: Payak na pangatnig na nag-uugnay sa dalawang sugnay ng talaangkanan.
- source_word: הוֹלִיד
  choice: naging anak ni
  rationale: Inulit nang pareho ang salin ng pandiwang pang-talaangkanan upang maging malinaw at magkakatugma ang dalawang sugnay.
- source_word: אֲחִימָעַץ
  choice: Ahimaaz
  rationale: Pangalang pantangi; pinanatili sa karaniwang transliteradong anyo.
