base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/014.yaml
  text: These were the sons of Abihail son of Huri[a], son of Jaroah, son of Gilead, son of Michael, son of Jeshishai, son of Jahdo, son of Buz.
translation:
  language: tl
  text: Ito ang mga anak ni Abihail,[a] anak ni Huri, anak ni Jaroah, anak ni Gilead, anak ni Micael, anak ni Jesisai, anak ni Jahdo, anak ni Buz.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa mga talaangkanan, ang Hebreong “mga anak ni” at ang paulit-ulit na “anak ni” ay maaaring tumukoy sa linya ng angkan; hindi nito laging ipinahihiwatig na nakatala ang bawat salinlahi.
    reason: cultural_note
lexical_decisions:
- source_word: אֵלֶּה
  choice: Ito ang
  rationale: Ang pangmaramihang demonstratibo ay nagpapakilala sa talaan; likas sa modernong Filipino ang “Ito ang” kahit maramihan ang kasunod.
- source_word: בְּנֵי
  choice: mga anak ni
  rationale: Pinananatili ang tuwirang genealogical na pormula ng Hebreo, habang kinikilala sa talababa na maaari itong tumukoy nang mas malawak sa mga inapo.
- source_word: אֲבִיחַיִל
  choice: Abihail
  rationale: Transliterasyon ng personal na pangalan ayon sa karaniwang anyong ginagamit sa Filipino.
- source_word: בֶּן
  choice: anak ni
  rationale: Pinananatili ang paulit-ulit na singular na pormulang genealogical ng pinagmulang teksto nang hindi ipinapalagay na bawat salinlahi ay tahasang nakatala.
- source_word: חוּרִי
  choice: Huri
  rationale: Tuwirang transliterasyon ng personal na pangalan.
- source_word: יָרוֹחַ
  choice: Jaroah
  rationale: Transliterasyon na kumakatawan sa mga katinig at patinig ng pangalang Hebreo at madaling basahin sa Filipino.
- source_word: גִּלְעָד
  choice: Gilead
  rationale: Ginamit ang nakaugaliang anyo ng pangalang ito sa mga saling Filipino.
- source_word: מִיכָאֵל
  choice: Micael
  rationale: Ang “Micael” ay malinaw at karaniwang anyong Filipino ng pangalang Hebreo, na iniiwasan ang bigkas-Ingles ng “Michael.”
- source_word: יְשִׁישַׁי
  choice: Jesisai
  rationale: Inangkop ang transliterasyon sa natural na baybay at bigkas sa Filipino habang pinananatili ang anyo ng pangalang Hebreo.
- source_word: יַחְדּוֹ
  choice: Jahdo
  rationale: Transliterasyon ng personal na pangalan na pinananatili ang pagkakakilanlan nito at maihihiwalay sa ibang pangalan.
- source_word: בּוּז
  choice: Buz
  rationale: Tuwirang transliterasyon ng personal na pangalan.
