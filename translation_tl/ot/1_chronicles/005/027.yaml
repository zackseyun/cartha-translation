base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/027.yaml
  text: 'The sons of Levi: Gershon[a], Kohath, and Merari.'
translation:
  language: tl
  text: 'Ang mga anak ni Levi: sina Gershon[a], Kohat, at Merari.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga inapo ni Levi.” Sa mga talaangkanan, ang “mga anak ni” ay maaari ring tumukoy nang mas malawak sa isang linya ng angkan, bagaman dito ay pinakanatural itong tumukoy sa tatlong tuwirang anak ni Levi.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: mga anak ni
  rationale: Ang construct plural ng בֵּן ay karaniwang tumutukoy sa “mga anak ni.” Sa talaangkanang ito, pinakanatural itong unawain bilang tatlong tuwirang anak ni Levi, bagaman maaari rin itong gamitin nang mas malawak para sa mga inapo.
- source_word: לֵוִי
  choice: Levi
  rationale: Pangngalang pantangi; pinanatili ang nakasanayang anyo sa Filipino.
- source_word: גֵּרְשׁוֹן
  choice: Gershon
  rationale: Pangngalang pantangi ng isa sa mga anak ni Levi; inililipat ayon sa anyong Hebreo rito at hindi ipinagpapalit sa kaugnay ngunit naiibang pangalang Gershom.
- source_word: קְהָת
  choice: Kohat
  rationale: Pangngalang pantangi; ginamit ang natural na transliterasyong Filipino, na hindi nangangailangan ng panghuling h upang katawanin ang Hebreong katinig.
- source_word: מְרָרִי
  choice: Merari
  rationale: Pangngalang pantangi; ginamit ang malinaw at nakasanayang transliterasyon.
- source_word: וּ
  choice: at
  rationale: Payak na pangatnig na nag-uugnay sa huling pangalan sa talaan.
