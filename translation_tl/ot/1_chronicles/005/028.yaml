  text: 'At ang mga anak ni Kohat: sina Amram, Izhar, Hebron, at Uziel.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/בְנֵי
  choice: At ang mga anak ni
  rationale: Pinananatili ng “At” ang pagpapatuloy ng talaangkanan, at ang “mga anak ni” ang tuwirang kahulugan ng anyong construct na בְנֵי sa kontekstong ito.
- source_word: קְהָת
  choice: Kohat
  rationale: Isinatinig ang pangalang Hebreo sa paraang likas sa modernong Filipino, kung saan karaniwang hindi binibigkas ang hulíng Hebreong th bilang tunog-Ingles.
- source_word: עַמְרָם
  choice: Amram
  rationale: Tuwirang pagsasatitik ng pangalang pantangi.
- source_word: יִצְהָר
  choice: Izhar
  rationale: Pinananatili ang anyong malapit sa Hebreo at madaling makilala sa tradisyong biblikal.
- source_word: וְ/חֶבְרוֹן
  choice: Hebron
  rationale: Pangalan ito ng tao sa talaangkanan, hindi ng lugar; ang unlaping pang-ugnay ay likas na naipahahayag sa ayos ng listahan.
- source_word: וְ/עֻזִּיאֵל
  choice: at Uziel
  rationale: Isinatinig ang pangalang pantangi bilang “Uziel,” at tahasang isinalin ang pang-ugnay bago ang huling pangalan.
