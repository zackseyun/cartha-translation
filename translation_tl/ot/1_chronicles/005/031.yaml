  text: Abishua fathered Bukki, and Bukki fathered Uzzi.
translation:
  language: tl
  text: Nagkaanak si Abisua ng Buki, at nagkaanak si Buki ng Uzi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַ/אֲבִישׁוּעַ
  choice: Abisua
  rationale: Pangalan ng tao; isina-Filipino ang baybay ayon sa likas na pagbigkas at karaniwang anyo ng mga pangalang biblikal sa Tagalog.
- source_word: הוֹלִיד
  choice: naging anak ni ... si
  rationale: Ang Hiphil ng ילד sa talaangkanan ay nangangahulugang nagkaanak o naging ama. Ang hulma na “naging anak ni X si Y” ay malinaw at natural sa modernong Tagalog, habang pinananatili ang ugnayang genealogical nang hindi gumagamit ng makalumang “ipinanganak ni,” na maaaring ipahiwatig na ang ama mismo ang nanganak.
- source_word: אֶת
  choice: '[hindi isinalin]'
  rationale: Pananda ito ng tiyak na tuwirang layon sa Hebreo at wala itong likas na katumbas na kailangang ilantad sa Tagalog.
- source_word: בֻּקִּי
  choice: Buki
  rationale: Pangalan ng tao; tuwirang transliterasyon sa baybay na madaling basahin sa Tagalog.
- source_word: וּ/בֻקִּי
  choice: at ... ni Buki
  rationale: Isinalin ang pang-ugnay na ו bilang “at” upang mapanatili ang sunod-sunod na daloy ng talaangkanan.
- source_word: הוֹלִיד
  choice: naging anak ni ... si
  rationale: Inulit ang parehong hulma upang maging pare-pareho at malinaw ang dalawang salinlahing binanggit.
- source_word: עֻזִּי
  choice: Uzi
  rationale: Pangalan ng tao; ang dobleng z ng karaniwang anyong Ingles ay hindi kailangan sa ortograpiyang Filipino, kaya “Uzi” ang natural na transliterasyon.
