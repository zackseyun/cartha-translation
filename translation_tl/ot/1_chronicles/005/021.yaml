  text: וַ/יִּשְׁבּ֣וּ מִקְנֵי/הֶ֗ם גְּֽמַלֵּי/הֶ֞ם חֲמִשִּׁ֥ים אֶ֨לֶף֙ וְ/צֹ֗אן מָאתַ֤יִם וַ/חֲמִשִּׁים֙ אֶ֔לֶף וַ/חֲמוֹרִ֖ים אַלְפָּ֑יִם וְ/נֶ֥פֶשׁ אָדָ֖ם מֵ֥אָה אָֽלֶף׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/021.yaml
  text: 'They captured their livestock: 50,000 camels[a], 250,000 sheep, 2,000 donkeys, and 100,000 people.'
translation:
  language: tl
  text: 'Sinamsam nila ang kanilang mga alagang hayop: 50,000 kamelyo, 250,000 tupa[a], at 2,000 asno. Binihag din nila ang 100,000 tao.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Hebreo ay kolektibong tumutukoy sa maliliit na hayop ng kawan, karaniwang mga tupa at maaari ring kabilang ang mga kambing.
    reason: lexical_ambiguity
  - marker: b
    text: Sa literal, “kaluluwa ng tao,” ibig sabihin, 100,000 kataong dinalang bihag.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁבּוּ
  choice: Sinamsam ... Binihag
  rationale: Ang שׁבה ay tumutukoy sa pagkuha bilang samsam o bihag. Hinati sa dalawang likas na pandiwang Filipino upang malinaw na ang mga hayop ay sinamsam at ang mga tao ay binihag, nang hindi binabago ang saklaw ng iisang pandiwang Hebreo.
- source_word: מִקְנֵיהֶם
  choice: kanilang mga alagang hayop
  rationale: Bagaman maaari itong tumukoy sa ari-arian, nililinaw ng kasunod na talaan na mga hayop ang tinutukoy.
- source_word: גְּמַלֵּיהֶם
  choice: kamelyo
  rationale: Tuwirang salin ng pangmaramihang anyo; naipapahiwatig na ng pariralang “kanilang mga alagang hayop” ang pag-aari.
- source_word: וְצֹאן
  choice: tupa
  rationale: Karaniwan at madaling maunawaang salin sa talaan ng mga hayop. Yamang maaaring kolektibong tumukoy ang salitang Hebreo sa maliliit na hayop ng kawan, pinananatili sa talababa ang posibilidad na kasama ang mga kambing.
- source_word: וַחֲמוֹרִים
  choice: asno
  rationale: Malinaw at dignified na katawagang Filipino para sa mga donkey.
- source_word: וְנֶפֶשׁ אָדָם
  choice: tao
  rationale: Ang literal na pariralang “kaluluwa ng tao” ay isang idyoma para sa mga taong binibilang. Ang “tao” ang natural na katumbas sa modernong Filipino; ipinapaliwanag sa talababa ang literal na anyo at ang pagiging mga bihag nila.
- source_word: מֵאָה אָלֶף
  choice: 100,000
  rationale: Ginamit ang bilang para sa madaling pagbasa at pagkakapare-pareho ng lahat ng dami sa talata.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na tuwiran, dignified, at madaling maunawaan. Ginamit ang “sinamsam” para sa mga hayop at “binihag” para sa mga tao upang maging natural sa Filipino habang pinananatili ang kahulugan ng iisang pandiwang Hebreo.
