  text: Azariah fathered Amariah, and Amariah fathered Ahitub.
translation:
  language: tl
  text: Naging anak ni Azarias si Amarias, at naging anak ni Amarias si Ahitub.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיּוֹלֶד
  choice: naging anak ni
  rationale: Ang Hiphil ng ילד sa pormulang talaangkanan ay nagsasaad ng pagiging ama o paglitaw ng isang inapo. Ang “naging anak ni” ay natural at marangal sa makabagong Filipino at malinaw na naghahayag ng ugnayang talaangkanan.
- source_word: עֲזַרְיָה
  choice: Azarias
  rationale: Pangalan ng tao; ginamit ang anyong matagal nang natural sa tradisyong Filipino at malinaw na kumakatawan sa pangalang Hebreo.
- source_word: אֶת
  choice: '[hindi isinalin nang hiwalay]'
  rationale: Pananda ito ng tiyak na tuwirang layon sa Hebreo at walang hiwalay na katumbas sa Filipino; naipahahayag ang tungkulin nito sa ayos ng pangungusap.
- source_word: אֲמַרְיָה
  choice: Amarias
  rationale: Pangalan ng tao; isinalin sa anyong Filipino na kaayon ng pagbaybay sa Azarias.
- source_word: הוֹלִיד
  choice: naging anak ni
  rationale: Kaparehong pandiwang talaangkanan mula sa ילד. Pinanatili ang pare-parehong natural na pahayag sa dalawang sugnay.
- source_word: אֲחִיטוּב
  choice: Ahitub
  rationale: Pangalan ng tao; tinumbasan sa malinaw at karaniwang transliterasyon sa Filipino.
theological_decisions:
- issue: Saklaw ng ugnayang ipinahahayag ng genealogical ילד
  choice: naging anak ni
  alternative: naging ama ni / ipinanganak kay
  rationale: Hindi dinagdagan ng paliwanag kung tuwirang anak o mas malayong inapo; pinanatili ang payak na pormulang talaangkanan ng teksto, bagaman sa karaniwang pagbasa ay tumutukoy ito sa ama at anak.
translation_notes:
  register: Maikli, dignified, at natural na makabagong Filipino. Ginamit ang inuulit na pormulang “naging anak ni” upang maging malinaw ang talaangkanan at maiwasan ang luma o teknikal na “ipinanganak.”
