  text: וּ/בְנֵ֨י רְאוּבֵ֥ן בְּכֽוֹר יִשְׂרָאֵל֮ כִּ֣י ה֣וּא הַ/בְּכוֹר֒ וּֽ/בְ/חַלְּל/וֹ֙ יְצוּעֵ֣י אָבִ֔י/ו נִתְּנָה֙ בְּכֹ֣רָת֔/וֹ לִ/בְנֵ֥י יוֹסֵ֖ף בֶּן יִשְׂרָאֵ֑ל וְ/לֹ֥א לְ/הִתְיַחֵ֖שׂ לַ/בְּכֹרָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/001.yaml
  text: The sons of Reuben[a], the firstborn of Israel—for he was the firstborn, but because he defiled his father’s bed, his birthright was given to the sons of Joseph son of Israel[b], though not to be enrolled by birthright—
translation:
  language: tl
  text: Ang mga anak ni Ruben, na panganay ni Israel—sapagkat siya ang panganay, ngunit dahil dinungisan niya ang higaan ng kanyang ama[a], ang kanyang karapatan bilang panganay ay ibinigay sa mga anak ni Jose, na anak ni Israel; gayunman, hindi upang maitala sa talaangkanan batay sa karapatan ng panganay[b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “mga higaan ng kanyang ama.” Ang anyong maramihan sa Hebreo ay isang idyoma na tumutukoy sa higaan ng mag-asawa.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin, “ngunit hindi upang ituring sa talaangkanan ayon sa karapatan ng panganay.” Ipinahihiwatig ng sugnay na napunta sa mga anak ni Jose ang karapatan ng panganay nang hindi sila ginagawang panganay sa pormal na talaangkanan.
    reason: alternative_reading
lexical_decisions:
- source_word: וּבְנֵי
  choice: Ang mga anak ni
  rationale: Ipinakikilala nito ang mga anak ni Ruben bilang paksa ng talaangkanan. Hindi na isinalin nang hiwalay ang waw bilang “at” sapagkat natural na naipagpapatuloy ng konteksto ang ugnayan.
- source_word: בְּכוֹר יִשְׂרָאֵל
  choice: na panganay ni Israel
  rationale: Ang בְּכוֹר ay tumutukoy sa panganay ayon sa kapanganakan at katayuan; pinananatili ng “panganay ni Israel” ang tuwirang ugnayang genealogical.
- source_word: כִּי הוּא הַבְּכוֹר
  choice: sapagkat siya ang panganay
  rationale: Ang כִּי ay nagpapakilala rito ng paliwanag. Ang “sapagkat” ay malinaw at marangal nang hindi dinaragdagan ang kahulugan.
- source_word: וּבְחַלְּלוֹ
  choice: ngunit dahil dinungisan niya
  rationale: Ang infinitive construct na may בְּ ay nagpapahayag ng sanhi o kalagayan. Ang “dinungisan” ay likas na Filipino para sa seksuwal at moral na paglapastangan sa higaan ng ama.
- source_word: יְצוּעֵי אָבִיו
  choice: ang higaan ng kanyang ama
  rationale: Bagaman maramihan sa anyong Hebreo ang יְצוּעֵי, idyoma ito para sa higaan ng mag-asawa. Ang isahang “higaan” ang natural na katumbas sa Filipino; inilalahad sa talababa ang literal na maramihan.
- source_word: נִתְּנָה בְּכֹרָתוֹ
  choice: ang kanyang karapatan bilang panganay ay ibinigay
  rationale: Ang בְּכֹרָה ay tumutukoy sa mga karapatan at pribilehiyo ng panganay, hindi lamang sa pagkakasunod ng kapanganakan.
- source_word: לִבְנֵי יוֹסֵף בֶּן יִשְׂרָאֵל
  choice: sa mga anak ni Jose na anak ni Israel
  rationale: Pinananatili ang tahasang pagkakakilanlan kay Jose bilang anak ni Israel, ayon sa pormulang genealogical ng Hebreo.
- source_word: וְלֹא לְהִתְיַחֵשׂ לַבְּכֹרָה
  choice: gayunman, hindi upang itala sa talaangkanan ayon sa pagkapanganay
  rationale: Ang הִתְיַחֵשׂ ay teknikal na salitang genealogical para sa pagtatala ayon sa angkan. Iniwasang magdagdag ng tahasang simuno o layon na wala sa Hebreo, upang mapanatili ang bahagyang kalabuan ng sugnay.
theological_decisions:
- issue: Pagkakaiba ng likas na pagkapanganay ni Ruben at ng inilipat na karapatan ng panganay
  choice: Pinanatiling panganay si Ruben ayon sa kapanganakan, samantalang ang karapatan bilang panganay ay inilipat sa mga anak ni Jose; hindi ipinantay ang paglilipat na ito sa pagiging unang nakatala sa talaangkanan.
  alternative: Unawaing ganap na pinalitan ng angkan ni Jose si Ruben bilang panganay sa lahat ng kahulugan.
  rationale: Hayagang pinaghihiwalay ng talata ang katayuan ni Ruben ayon sa kapanganakan, ang paglilipat ng karapatan, at ang pagtatala sa talaangkanan. Pinananatili ng salin ang tensiyong ito sa halip na pag-isahin ang tatlong kategorya.
translation_notes:
  register: Makabago ngunit marangal na Filipino ang ginamit. Pinanatili ang anyong putol na pangungusap at pangwakas na gatlang sapagkat nagpapatuloy ang kaisipan sa kasunod na talata. Ang “talaangkanan” ay pormal ngunit karaniwang nauunawaang termino para sa genealogical enrollment.
