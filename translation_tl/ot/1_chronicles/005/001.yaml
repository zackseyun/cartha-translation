revisions:
- from: Ang mga anak ni Ruben, na panganay ni Israel—sapagkat siya ang panganay, ngunit dahil dinungisan niya ang higaan ng kanyang ama[a], ang kanyang karapatan bilang panganay ay ibinigay sa mga anak ni Jose na anak ni Israel; gayunman, hindi upang itala sa talaangkanan ayon sa pagkapanganay[b]—
  to: Ang mga anak ni Ruben, na panganay ni Israel—sapagkat siya ang panganay, ngunit dahil dinungisan niya ang higaan ng kanyang ama[a], ang kanyang karapatan bilang panganay ay ibinigay sa mga anak ni Jose, na anak ni Israel; gayunman, hindi upang maitala sa talaangkanan batay sa karapatan ng panganay[b]—
  rationale: Pinalitan ang aktibong “upang itala” ng “upang maitala” upang maging natural ang Filipino at maipahayag ang genealogical enrollment na tinutukoy ng Hebreo. Ginawang “batay sa karapatan ng panganay” ang pangwakas na parirala upang tumugma sa “by birthright” at maiwasang ipakahulugang ang simpleng kapanganakan lamang ang batayan. Nagdagdag ng kuwit sa appositional na “ni Jose, na anak ni Israel” para sa mas malinaw na pagbasa.
