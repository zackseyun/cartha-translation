  yaml_path: translation/ot/1_chronicles/005/005.yaml
  text: Micah his son[a], Reaiah his son, Baal his son.
translation:
  language: tl
  text: Si Mica, ang anak niya; si Reaya, ang anak ni Mica; si Baal[a], ang anak ni Reaya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Hebreong “Baal” dito ay pangalan ng isang tao sa talaangkanan, hindi titulong isinasaling “panginoon.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִיכָה
  choice: Mica
  rationale: Pangalan ng tao; ginamit ang anyong natural at nakasanayan sa Filipino para sa Hebreong pangalan.
- source_word: בְנוֹ
  choice: anak niya / anak nito
  rationale: Tuwirang nangangahulugang “anak niya.” Ang salit-salitang “anak nito” sa kasunod na mga pangalan ay malinaw na nagpapakita ng sunod-sunod na ugnayan sa talaangkanan nang hindi dinaragdagan ang teksto ng mga pangalang hindi inuulit sa Hebreo.
- source_word: רְאָיָה
  choice: Reaya
  rationale: Isinatinig bilang pangalan ng tao sa paraang madaling basahin sa Filipino habang pinananatili ang anyo ng Hebreo.
- source_word: בַּעַל
  choice: Baal
  rationale: Sa kontekstong ito, pangalan ito ng tao sa talaangkanan. Pinanatili itong pangalan sa halip na isaling “panginoon.”
theological_decisions:
- issue: Kung ang בַּעַל ay isasalin bilang titulo o pananatilihin bilang pangalan ng tao
  choice: Pinanatili bilang pangalang “Baal”
  alternative: Isalin bilang titulong “panginoon” o unawain bilang tuwirang pagtukoy sa diyos na si Baal
  rationale: Nasa hanay ito ng mga pangalang pantangi sa isang talaangkanan. Ang pagsasalin dito bilang titulo ay magpapalabo sa balangkas at sintaks ng talata at magpapasok ng kahulugang hindi hinihingi ng teksto.
translation_notes:
  register: Maikli at tuwiran ang pagkakasalin upang mapanatili ang payak na pormula ng talaangkanan. Ginamit ang makabagong Filipino at ang “nito” upang maipakita ang magkakasunod na salinlahi nang natural.
