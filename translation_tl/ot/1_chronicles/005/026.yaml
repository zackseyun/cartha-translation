source:
  edition: WLC
  text: וַ/יָּעַר֩ אֱלֹהֵ֨י יִשְׂרָאֵ֜ל אֶת ר֣וּחַ פּ֣וּל מֶֽלֶךְ אַשּׁ֗וּר וְ/אֶת ר֨וּחַ֙ תִּלְּגַ֤ת פִּלְנֶ֨סֶר֙ מֶ֣לֶךְ אַשּׁ֔וּר וַ/יַּגְלֵ/ם֙ לָ/ראוּבֵנִ֣י וְ/לַ/גָּדִ֔י וְ/לַ/חֲצִ֖י שֵׁ֣בֶט מְנַשֶּׁ֑ה וַ֠/יְבִיאֵ/ם לַ/חְלַ֨ח וְ/חָב֤וֹר וְ/הָרָא֙ וּ/נְהַ֣ר גּוֹזָ֔ן עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/026.yaml
  text: So the God of Israel stirred up the spirit of Pul king of Assyria[a], even the spirit of Tilgath-pilneser king of Assyria, and he took the Reubenites, the Gadites, and the half-tribe of Manasseh into exile, and brought them to Halah, Habor, Hara, and the river Gozan[b], to this day.
translation:
  language: tl
  text: Kaya pinukaw ng Diyos ng Israel ang diwa ni Pul na hari ng Asiria, maging ang diwa ni Tilgat-Pilneser na hari ng Asiria[a][b]. Ipinatapon niya ang mga Rubenita, ang mga Gadita, at ang kalahating lipi ni Manases, at dinala sila sa Halah, Habor, Hara, at sa ilog ng Gozan, hanggang sa araw na ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaaring tumukoy ang “Pul” at “Tilgat-Pilneser” sa dalawang pangalan ng iisang hari ng Asiria. Maaari ring basahin ang Hebreo bilang pagtukoy sa dalawang magkaibang hari: “ang diwa ni Pul ... at ang diwa ni Tilgat-Pilneser.”'
    reason: alternative_reading
  - marker: b
    text: Ang “Tilgat-Pilneser” ay sumusunod sa anyo ng pangalan sa Hebreo rito; mas kilala rin ito sa anyong “Tiglat-Pileser.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּעַר
  choice: pinukaw
  rationale: Ipinahihiwatig ng pandiwa ang paggising o pag-udyok sa isang tao upang kumilos. Natural ang “pinukaw” sa makabagong Tagalog at hindi nito nilalagyan ng negatibong kulay ang pagkilos ng Diyos.
- source_word: רוּחַ ... רוּחַ
  choice: ang diwa ni ... ang diwa ni
  rationale: Sa kontekstong ito, tumutukoy ang רוּחַ sa panloob na disposisyon o udyok ng hari. Pinananatili ng “diwa” ang lalim ng salita nang mas natural kaysa sa literal na “espiritu” kapag tumutukoy sa kalooban ng isang pinuno.
- source_word: פּוּל
  choice: Pul
  rationale: Tuwirang transliterasyon ng personal na pangalan.
- source_word: תִּלְּגַת פִּלְנֶסֶר
  choice: Tilgat-Pilneser
  rationale: Malapit itong sumusunod sa anyong Hebreo sa Cronica. Inilalagay sa talababa ang mas pamilyar na anyong Tiglat-Pileser.
- source_word: וַיַּגְלֵם
  choice: ipinatapon niya
  rationale: Ang Hiphil ng גלה ay nangangahulugang dalhin o paalisin tungo sa pagkakatapon. Maikli, natural, at malinaw ang “ipinatapon” sa Tagalog.
- source_word: לָראוּבֵנִי וְלַגָּדִי
  choice: ang mga Rubenita, ang mga Gadita
  rationale: Karaniwang Tagalog na katawagan sa mga kabilang sa mga lipi nina Ruben at Gad.
- source_word: וְלַחֲצִי שֵׁבֶט מְנַשֶּׁה
  choice: ang kalahating lipi ni Manases
  rationale: Malinaw na tumutukoy sa kalahati ng lipi ni Manases na nanirahan sa silangan ng Jordan.
- source_word: וַיְבִיאֵם
  choice: at dinala sila
  rationale: Tuwiran at natural na katumbas ng Hiphil ng בוא sa sunod-sunod na pagkakatapon at paglilipat.
- source_word: לַחְלַח וְחָבוֹר וְהָרָא וּנְהַר גּוֹזָן
  choice: sa Hala, Habor, Hara, at sa ilog ng Gozan
  rationale: Ang mga pangalan ng lugar ay isinalin sa pamamagitan ng transliterasyon; natural sa Tagalog ang “ilog ng Gozan” para sa נְהַר גּוֹזָן.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: hanggang sa araw na ito
  rationale: Karaniwan at malinaw na katumbas ng idyomang Hebreo. Idinagdag ang “kung saan nananatili sila” bilang likas na pagpapahayag sa Tagalog ng ipinahihiwatig na patuloy nilang kinaroroonan.
theological_decisions:
- issue: Ugnayan nina Pul at Tilgat-Pilneser
  choice: Ginamit ang “maging” sa pagitan ng dalawang buong katawagan upang hindi tahasang sabihing iisang hari lamang sila.
  alternative: Maaaring unawain ang dalawang pangalan bilang dalawang pangalan ng iisang hari, o bilang dalawang magkaibang hari ng Asiria.
  rationale: Inuulit ng Hebreo ang “diwa ni” at ikinakabit ang dalawang pangalan sa pamamagitan ng וְ. Hindi sapat ang sintaksis lamang upang ganap na pasiyahan kung apposisyon ito o pagtukoy sa dalawang pinuno, kaya pinananatili sa teksto ang kalabuan at ipinaliliwanag sa talababa.
- issue: Tinukoy ng panghalip sa mga kilos ng pagpapatapon at pagdadala
  choice: Pinanatili ang “niya” nang hindi inuulit ang tiyak na pangalan ng gumagawa.
  alternative: Maaaring gawing tahasan na ang Diyos ang nagpapatapon, o unawain na ang hari ng Asiria ang agarang tagapagpatupad.
  rationale: Walang hayag na bagong simuno sa Hebreo. Pinananatili ng panghalip ang anyo ng salaysay at ang tensiyon sa pagitan ng pagkilos ng Diyos at ng pagkilos ng haring Asirio bilang instrumento.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog. Ginamit ang “diwa” para sa panloob na udyok ng hari, at pinanatili sa pamamagitan ng “maging” at ng talababa ang tunay na kalabuan tungkol sa ugnayan ng dalawang pangalan. Inilagay ang parehong pananda ng talababa kaagad sa pangalang kaugnay ng mga tala.
