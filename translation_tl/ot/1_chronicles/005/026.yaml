  to: Kaya pinukaw ng Diyos ng Israel ang diwa ni Pul na hari ng Asiria, maging ang diwa ni Tilgat-Pilneser na hari ng Asiria[a][b]. Ipinatapon niya ang mga Rubenita, ang mga Gadita, at ang kalahating lipi ni Manases, at dinala sila sa Halah, Habor, Hara, at sa ilog ng Gozan, hanggang sa araw na ito.
