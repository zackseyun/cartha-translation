  naturalness: Marangal at malinaw ang Tagalog. Natural ang “pinukaw ... ang diwa” at “ipinatapon niya.” Ang pangwakas na “hanggang sa araw na ito” ay maaaring panatilihing malapit sa idyomang Hebreo nang walang karagdagang paliwanag sa katawan ng talata.
  terminology: Ang “diwa” ay katanggap-tanggap para sa רוּחַ bilang panloob na udyok. Ang “maging” ay maayos na maingat na katumbas sa audit trail at hindi lubusang nagpapasiya kung iisa o dalawang hari ang tinutukoy. Panatilihin ang “Tilgat-Pilneser,” kasama ang talababa para sa mas pamilyar na “Tiglat-Pileser.” Ginawang “Halah” ang baybay upang mas malapit sa anyong Hebreo at sa audit trail.
  issues:
