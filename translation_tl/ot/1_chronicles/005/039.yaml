  text: At si Shallum ay naging ama ni Hilkias, at si Hilkias ay naging ama ni Azarias.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ
  choice: At
  rationale: Pinananatili ang payak na pang-ugnay ng talaangkanan sa naunang talata.
- source_word: שַׁלּוּם
  choice: Shallum
  rationale: Isinatinig ang pangalang Hebreo sa anyong madaling makilala at basahin sa Filipino.
- source_word: הוֹלִיד
  choice: naging anak ni … si
  rationale: Sa konteksto ng talaangkanan, nangangahulugan itong ‘nagkaanak’ o ‘naging ama ni.’ Ang ganitong ayos ay natural at malinaw sa modernong Filipino habang pinananatili ang ugnayang ama-anak.
- source_word: אֶת
  choice: '[hindi isinalin]'
  rationale: Pananda ito ng tiyak na layon sa Hebreo at walang hiwalay na katumbas na salita sa Filipino.
- source_word: חִלְקִיָּה
  choice: Hilkias
  rationale: Ginamit ang karaniwang anyong Filipino ng pangalang biblikal.
- source_word: וְ
  choice: at
  rationale: Payak nitong pinag-uugnay ang sumunod na salinlahi nang hindi nagdaragdag ng kahulugang tulad ng ‘pagkatapos.’
- source_word: עֲזַרְיָה
  choice: Azarias
  rationale: Ginamit ang karaniwang anyong Filipino ng pangalang biblikal.
