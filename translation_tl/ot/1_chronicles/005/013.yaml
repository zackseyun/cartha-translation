base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/013.yaml
  text: 'And their brothers[a], according to their fathers’ houses: Michael, Meshullam, Sheba, Jorai, Jachan, Zia[d][c][b], and Eber—seven.'
translation:
  language: tl
  text: At ang kanilang mga kapatid[a], ayon sa mga sambahayan ng kanilang mga ama[b], ay sina Mikael, Mesulam, Sheba, Yorai, Yakan, Zia[c], at Eber—pito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga kamag-anak.” Sa mga talaangkanan, ang Hebreong “mga kapatid” ay maaaring tumukoy sa mas malawak na mga kamag-anak sa angkan.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “ayon sa mga sambahayan ng kanilang mga ama,” isang pagtukoy sa sambahayan o angkang nagmumula sa panig ng ama.
    reason: cultural_note
  - marker: c
    text: Sa ilang salin, “Ziza,” dahil sa pagkakaiba sa teksto o transliterasyon.
    reason: alternative_reading
lexical_decisions:
- source_word: וַאֲחֵיהֶם
  choice: At ang kanilang mga kapatid
  rationale: Pinananatili ng “mga kapatid” ang tuwirang kahulugan ng Hebreo, habang kinikilala sa talababa na maaari itong tumukoy nang mas malawak sa mga kamag-anak sa angkan sa kontekstong talaangkanan.
- source_word: לְבֵית אֲבוֹתֵיהֶם
  choice: ayon sa mga sambahayan ng kanilang mga ama
  rationale: Inilalarawan nito ang pagkakahati ayon sa sambahayan o angkang mula sa panig ng ama; pinananatili ang paternal na anyo ng Hebreong pormula nang hindi ito ginagawang labis na teknikal.
- source_word: מִיכָאֵל
  choice: Mikael
  rationale: Malapit na transliterasyon ng Hebreong personal na pangalan at natural basahin sa Filipino.
- source_word: וּמְשֻׁלָּם
  choice: Mesulam
  rationale: Filipinong transliterasyon ng Hebreong personal na pangalan.
- source_word: וְשֶׁבַע
  choice: Sheba
  rationale: Itinuturing itong personal na pangalan sa talaan at pinananatili ang katinig na shin sa anyong “Sh.”
- source_word: וְיוֹרַי
  choice: Yorai
  rationale: Tuwirang transliterasyon na angkop sa bigkas at baybay sa Filipino.
- source_word: וְיַעְכָּן
  choice: Yakan
  rationale: Malapit na transliterasyon ng Masoretikong anyo ng pangalan.
- source_word: וְזִיעַ
  choice: Zia
  rationale: Sinusunod ang patinig ng Masoretikong teksto; ang variant na “Ziza” ay inilagay sa talababa.
- source_word: וָעֵבֶר
  choice: at Eber
  rationale: Tuwirang transliterasyon ng Hebreong עֵבֶר, nang hindi idinaragdag ang “H” na karaniwan sa ilang tradisyong Ingles.
- source_word: שִׁבְעָה
  choice: pito
  rationale: Pinananatili bilang maikling pangwakas na bilang ng pitong pangalang nakatala; ang gitling ay naghihiwalay dito bilang buod.
