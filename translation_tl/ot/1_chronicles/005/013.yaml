translation_notes:
  register: Gumamit ng moderno ngunit marangal na Filipino. Pinanatili ang maikli at pormal na anyo ng talaangkanan, ang pambungad na “At,” at ang pangwakas na bilang na “pito.” Isinalin ang mga pangalan nang malapit sa Hebreo sa halip na umasa sa nakaugaliang anyong Ingles.
