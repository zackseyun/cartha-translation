translation_notes:
  register: Modernong Filipino na dignificado at madaling maunawaan. Ginamit ang “mga anak” upang mapanatili ang estilong pangangkanan ng salaysay, at “nanirahan” sa halip na mas makaluma o mas teknikal na mga katumbas. Inayos ang mga talababa upang tumugma ang bawat marker sa paksang ipinaliliwanag nito.
