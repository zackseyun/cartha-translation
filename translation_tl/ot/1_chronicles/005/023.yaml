base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/023.yaml
  text: And the sons of the half-tribe of Manasseh lived in the land from Bashan as far as Baal-hermon[a], Senir, and Mount Hermon[b]; they became numerous.
translation:
  language: tl
  text: At ang mga anak ng kalahating lipi ni Manases ay nanirahan sa lupain mula sa Basan hanggang sa Baal-Hermon, Senir, at Bundok Hermon[a]. Dumami sila.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Baal-Hermon, Senir, at Bundok Hermon ay mga pangalang heograpiko na tumutukoy sa hilagang hangganan ng kanilang lupain.
    reason: cultural_note
  - marker: b
    text: Maaari ring isalin na “lumago ang kanilang bilang” o “sila ay naging napakarami.” Idiniriin ng pandiwang Hebreo ang pagdami nila.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי
  choice: At ang mga anak ng
  rationale: Pinananatili ang anyong pangangkanang “mga anak ng,” na sa kontekstong panlipi ay tumutukoy sa mga kaanib o inapo ng lipi.
- source_word: חֲצִי שֵׁבֶט מְנַשֶּׁה
  choice: kalahating lipi ni Manases
  rationale: Likas na pariralang Filipino para sa kinikilalang kalahati ng lipi ni Manases; pinananatili ang ugnayang ipinahihiwatig ng konstruktong Hebreo.
- source_word: יָשְׁבוּ
  choice: nanirahan
  rationale: Ang pandiwa ay tumutukoy sa paninirahan sa isang lugar; natural at marangal ang “nanirahan” sa modernong Filipino.
- source_word: בָּאָרֶץ
  choice: sa lupain
  rationale: Pinananatili ang pangkalahatang kahulugan ng אֶרֶץ bilang lupain o teritoryong tinitirhan.
- source_word: מִבָּשָׁן עַד
  choice: mula sa Basan hanggang sa
  rationale: Malinaw na ipinahahayag ang saklaw na heograpiko ng mga pang-ukol sa Hebreo.
- source_word: בַּעַל חֶרְמוֹן
  choice: Baal-Hermon
  rationale: Transliterasyon ng pangalan ng lugar; ang gitling ay nagpapakitang tambalang pangalang pantangi ito.
- source_word: וּשְׂנִיר
  choice: Senir
  rationale: Karaniwang transliterasyon ng pangalang heograpiko.
- source_word: וְהַר חֶרְמוֹן
  choice: at Bundok Hermon
  rationale: Ang הַר ay “bundok,” at natural sa Filipino ang anyong “Bundok Hermon.”
- source_word: הֵמָּה רָבוּ
  choice: Dumami sila roon
  rationale: Ipinahahayag ng רָבוּ ang paglaki ng bilang. Inilipat sa hiwalay na pangungusap para sa natural na daloy; ang “roon” ay nililinaw ang kaugnayan sa binanggit na lupain nang hindi binabago ang diwa.
