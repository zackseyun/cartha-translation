  text: אֲחִי֙ בֶּן עַבְדִּיאֵ֣ל בֶּן גּוּנִ֔י רֹ֖אשׁ לְ/בֵ֥ית אֲבוֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/015.yaml
  text: Ahi son of Abdiel[a], son of Guni, was head of their fathers’ houses.
translation:
  language: tl
  text: Si Ahi na anak ni Abdiel, na anak ni Guni, ang pinuno ng kanilang mga angkan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “bahay ng kanilang mga ama”; tumutukoy ito sa sambahayan o angkan batay sa ninuno.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲחִי
  choice: Ahi
  rationale: Pangalang pantangi; tinumbasan sa karaniwang anyong transliterado sa Filipino.
- source_word: בֶּן
  choice: anak ni
  rationale: Sa pormulang pangangkanang ito, ang karaniwang kahulugan ay tuwirang anak; likas sa Filipino ang “anak ni.”
- source_word: עַבְדִּיאֵל
  choice: Abdiel
  rationale: Pangalang pantangi; pinanatili sa kinikilalang anyong transliterado.
- source_word: גּוּנִי
  choice: Guni
  rationale: Pangalang pantangi; pinanatili sa kinikilalang anyong transliterado.
- source_word: רֹאשׁ
  choice: pinuno
  rationale: Tumutukoy sa ulo o namumuno ng isang pangkat; mas natural sa modernong Filipino ang “pinuno” kaysa literal na “ulo.”
- source_word: לְבֵית אֲבוֹתָם
  choice: ng kanilang mga angkan
  rationale: Ang idyomang “bahay ng mga ama” ay tumutukoy sa mga sambahayang ninuno o pangkat ng magkakamag-anak. Malinaw at natural itong naihahayag ng “mga angkan,” habang inilalagay sa talababa ang mas literal na anyo.
