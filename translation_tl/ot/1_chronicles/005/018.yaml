translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “espada” bilang karaniwang kasalukuyang katawagan, “pakikipagdigma” para sa pormal na kontekstong militar, at mga footnote upang mapanatili ang mga alternatibong leksikal at ang kongkretong Hebreong idyoma.
