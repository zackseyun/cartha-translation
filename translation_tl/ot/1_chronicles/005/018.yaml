  text: בְּנֵֽי רְאוּבֵ֨ן וְ/גָדִ֜י וַ/חֲצִ֥י שֵֽׁבֶט מְנַשֶּׁה֮ מִן בְּנֵי חַיִל֒ אֲ֠נָשִׁים נֹשְׂאֵ֨י מָגֵ֤ן וְ/חֶ֨רֶב֙ וְ/דֹ֣רְכֵי קֶ֔שֶׁת וּ/לְמוּדֵ֖י מִלְחָמָ֑ה אַרְבָּעִ֨ים וְ/אַרְבָּעָ֥ה אֶ֛לֶף וּ/שְׁבַע מֵא֥וֹת וְ/שִׁשִּׁ֖ים יֹצְאֵ֥י צָבָֽא־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/018.yaml
  text: The sons of Reuben and the Gadites and the half-tribe of Manasseh[a], valiant men, men who carried shield and sword, who drew the bow, and who were trained for war, were forty-four thousand seven hundred sixty[c][b], able to go out to war.
translation:
  language: tl
  text: Ang mga anak ni Ruben, ang mga Gadita, at ang kalahati ng lipi ni Manases—mga magigiting na lalaki[a], mga lalaking may dalang kalasag at espada, bumabanat ng busog[b], at sinanay sa pakikipagdigma—ay may bilang na 44,760, na maaaring lumabas upang makipagdigma[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “malalakas na lalaki” o “mga lalaking may katapangan.”
    reason: lexical_alternative
  - marker: b
    text: Literal na “bumabanat/tumatapak sa busog,” isang Hebreong idyoma para sa pagbabanat ng busog upang pumana.
    reason: cultural_note
  - marker: c
    text: Maaari ring “karapat-dapat sa paglilingkod-militar” o “maaaring lumabas upang makipagdigma.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי רְאוּבֵן
  choice: mga anak ni Ruben
  rationale: Pinananatili ang tahasang katawagang pangkanak sa Hebreo, habang natural pa rin sa salaysay na Tagalog.
- source_word: וְגָדִי
  choice: mga Gadita
  rationale: Ang anyong gentilic ay tumutukoy sa mga kabilang sa lipi ni Gad, hindi sa mismong taong si Gad.
- source_word: וַחֲצִי שֵׁבֶט מְנַשֶּׁה
  choice: ang kalahating lipi ni Manases
  rationale: Malinaw at likas na katumbas ng pariralang tumutukoy sa kalahati ng lipi.
- source_word: מִן בְּנֵי חַיִל
  choice: magigiting na mandirigma
  rationale: Sa kontekstong militar, inilalarawan ng idyoma ang malalakas, may kakayahan, at magigiting na lalaking pandigma; ang prefixed מִן ay inuunawang partitive o descriptive.
- source_word: אֲנָשִׁים
  choice: mga lalaking
  rationale: Pinananatili ang tahasang panlalaking pagtukoy ng Hebreo, kasunod ng pangkalahatang paglalarawan sa mga mandirigma.
- source_word: נֹשְׂאֵי מָגֵן וְחֶרֶב
  choice: may dalang kalasag at espada
  rationale: Natural na Tagalog na nagpapanatili sa kongkretong larawan ng pagdadala o paghawak ng mga sandata.
- source_word: וְדֹרְכֵי קֶשֶׁת
  choice: humahawak ng busog upang pumana
  rationale: Ipinahahayag ang kahulugan ng Hebreong idyoma tungkol sa pagbabanat o pagtapak sa busog upang magamit ito sa pagpana, nang hindi nagpapahiwatig na ang paghatak lamang ng bagting ang literal na sinasabi.
- source_word: וּלְמוּדֵי מִלְחָמָה
  choice: sinanay sa pakikipagdigma
  rationale: Pinananatili ang passive/resultative na diwa ng pagiging naturuan o nasanay sa digmaan.
- source_word: אַרְבָּעִים וְאַרְבָּעָה אֶלֶף וּשְׁבַע מֵאוֹת וְשִׁשִּׁים
  choice: 44,760
  rationale: Ang numerong anyo ay malinaw at madaling basahin sa modernong Tagalog.
- source_word: יֹצְאֵי צָבָא
  choice: handang lumahok sa hukbo
  rationale: Natural na inilalahad ang Hebreong katawagang militar para sa mga maaaring o karapat-dapat sumama sa isang kampanyang pandigma.
