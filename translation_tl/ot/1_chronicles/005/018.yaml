revisions:
- from: Ang mga anak ni Ruben, ang mga Gadita, at ang kalahating lipi ni Manases ay may 44,760 magigiting na mandirigma[a]—mga lalaking may dalang kalasag at espada, humahawak ng busog upang pumana[b], sinanay sa pakikipagdigma, at handang lumahok sa hukbo[c].
  to: Ang mga anak ni Ruben, ang mga Gadita, at ang kalahati ng lipi ni Manases—mga magigiting na lalaki[a], mga lalaking may dalang kalasag at espada, bumabanat ng busog[b], at sinanay sa pakikipagdigma—ay may bilang na 44,760, na maaaring lumabas upang makipagdigma[c].
  rationale: Inayos ang teksto upang malinaw na mapanatili ang dalawang magkahiwalay na katawagang Hebreo para sa mga lalaki, ang mga kongkretong paglalarawang militar, at ang kahulugan ng yotse tsava bilang pagiging maaaring lumabas para sa pakikidigma. Inayos din ang pagkakabit ng bilang sa mga taong inilalarawan.
