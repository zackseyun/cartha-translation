  text: Si Merayot ay ama ni Amarias, at si Amarias ay ama ni Ahitub.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מְרָיוֹת
  choice: Merayot
  rationale: Pangalan ng tao; isinalin sa baybay na malapit sa Hebreo at natural basahin sa Filipino.
- source_word: הוֹלִיד
  choice: naging anak ni
  rationale: Sa talaangkanan, ipinahihiwatig ng anyong ito ng ילד ang ugnayang ama at anak. Ang pariralang “naging anak ni” ay natural at dignidadong Filipino, at hindi nagpapasok ng di-tiyak na detalye tungkol sa paraan ng pagsilang.
- source_word: אֶת
  choice: '[hindi hiwalay na isinalin]'
  rationale: Pananda ng tuwirang layon sa Hebreo; naipapakita ang tungkulin nito sa karaniwang ayos ng pangungusap sa Filipino.
- source_word: אֲמַרְיָה
  choice: Amarias
  rationale: Pangalan ng tao; ginamit ang anyong pamilyar sa tradisyong biblikal sa Filipino.
- source_word: וַ/אֲמַרְיָה
  choice: at ... ni Amarias
  rationale: Isinalin ang waw bilang payak na pang-ugnay na “at,” habang iniangkop ang pangalan sa natural na sintaks ng Filipino.
- source_word: אֲחִיטוּב
  choice: Ahitub
  rationale: Pangalan ng tao; tuwirang transliterasyon na natural basahin sa Filipino.
