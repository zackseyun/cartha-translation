base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/032.yaml
  text: Uzzi fathered Zerahiah, and Zerahiah fathered Meraioth.
translation:
  language: tl
  text: Si Uzi ang naging ama ni Zerahias, at si Zerahias ang naging ama ni Merayot.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/עֻזִּי
  choice: Uzi
  rationale: Pangngalang pantangi; tinumbasan sa karaniwang anyong Filipino at hindi isinalin ang kahulugan. Ang וְ ay likas na hindi na kailangang ilantad sa simula ng hiwalay na talata.
- source_word: הוֹלִיד
  choice: naging anak ni
  rationale: Sa talaangkanan, ang Hiphil ng ילד ay tumutukoy sa pagkakaroon o pagiging ama ng anak. Ang hulma na “naging anak ni X si Y” ay natural sa modernong Filipino at hindi sapilitang nagdaragdag ng teknikal o makalumang pananalita.
- source_word: אֶת
  choice: '[hindi hiwalay na isinalin]'
  rationale: Pananda ito ng tiyak na tuwirang layon sa Hebreo at walang tuwirang katumbas sa Filipino; naipahihiwatig ito ng ayos ng pangungusap.
- source_word: זְרַחְיָה
  choice: Zeraias
  rationale: Pangngalang pantangi; ginamit ang natural na biblikal na anyong Filipino.
- source_word: וּֽ/זְרַֽחְיָה
  choice: at ... ni Zeraias
  rationale: Pinanatili ang pang-ugnay at ang inuulit na pangalan upang malinaw ang sunod-sunod na ugnayan sa talaangkanan.
- source_word: הוֹלִיד
  choice: naging anak ni
  rationale: Parehong genealogical na pandiwa; pareho rin ang salin upang mapanatili ang malinaw na parallelism.
- source_word: מְרָיֽוֹת
  choice: Merayot
  rationale: Pangngalang pantangi; transliterasyon na malapit sa tunog ng Hebreo at madaling bigkasin sa Filipino.
theological_decisions:
- issue: Saklaw ng genealogical na pandiwang הוֹלִיד
  choice: naging anak ni
  alternative: ipinanganak ni / naging ama ni
  rationale: Hindi ipinahihiwatig na ang ama mismo ang nanganak, at hindi rin nilulutas kung tuwirang anak o inapo ang tinutukoy; pinananatili ang karaniwang lawak ng pananalita sa talaangkanan.
translation_notes:
  register: Maikli, marangal, at natural na modernong Filipino. Pinanatili ang paulit-ulit na estruktura ng Hebreong talaangkanan nang hindi gumagamit ng makalumang “ipinanganak” o “nagkaanak.”
