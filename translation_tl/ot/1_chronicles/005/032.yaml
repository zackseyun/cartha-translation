  source_fidelity: Ang “naging anak ni X si Y” ay naibabaligtad ang pananaw ng Hebreong הוֹלִיד, na aktibong itinatanghal si Uzi, at pagkatapos si Zerahias, bilang ama. Bagaman maaaring mahinuha ang ugnayang anak-singaw, dapat panatilihin sa salin ang direksiyong ama-singaw ng pandiwa.
  naturalness: Mas natural at malinaw sa modernong Filipino ang “Si Uzi ang naging ama ni Zerahias” kaysa sa paulit-ulit na “naging anak ni.” Nanatili ang maikli at pormal na himig na angkop sa talaangkanan.
  terminology: 'Pinanatili ang mga pangalan sa mga anyong Filipino: Uzi, Zerahias, at Merayot. Ang “naging ama ni” ay tumpak na genealogical na katumbas ng Hebreong Hiphil ng ילד at iniiwasan ang makalumang “ipinanganak” o “nagkaanak.”'
