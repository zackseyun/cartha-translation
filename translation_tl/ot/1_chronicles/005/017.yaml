  text: All of them were enrolled by genealogy in the days of Jotham king of Judah[a], and in the days of Jeroboam king of Israel.
translation:
  language: tl
  text: Silang lahat ay naitala ayon sa talaangkanan[a] noong panahon ni Jotam na hari ng Juda, at noong panahon ni Jeroboam na hari ng Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ipinatala sa mga talaangkanan” o “ibinilang ayon sa talaangkanan.” Ang pandiwang Hebreo ay tumutukoy sa pagtatala o pagpaparehistro sa isang talaangkanan.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֻּלָּם
  choice: Silang lahat
  rationale: Ipinahahayag ang kabuuan at pinananatili ang puwersa ng panghalip na nasa hulapi ng Hebreo.
- source_word: הִתְיַחְשׂוּ
  choice: itinala ayon sa kanilang angkan
  rationale: Ang hitpael ng יחשׂ sa Mga Cronica ay tumutukoy sa pagtatala o pagkilala sa loob ng talaangkanan. Likas sa modernong Tagalog ang pariralang ito at malinaw na ipinahihiwatig ang genealogical na talaan.
- source_word: בִּימֵי
  choice: noong panahon ni
  rationale: Natural na katumbas sa Tagalog ng idyomang Hebreo na literal na 'sa mga araw ni,' nang hindi ipinapalagay na ang tinutukoy ay ang buong paghahari.
- source_word: יוֹתָם
  choice: Jotam
  rationale: Karaniwang anyong Filipino ng pangalang Hebreo.
- source_word: מֶלֶךְ יְהוּדָה
  choice: hari ng Juda
  rationale: Tuwirang salin ng pariralang konstruktibo.
- source_word: וּבִימֵי
  choice: at noong panahon ni
  rationale: Pinananatili ang pangatnig at ang inuulit na temporal na parirala ng Hebreo.
- source_word: יָרָבְעָם
  choice: Jeroboam
  rationale: Karaniwang anyong Filipino ng pangalang Hebreo.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: hari ng Israel
  rationale: Tuwirang salin ng pariralang konstruktibo.
