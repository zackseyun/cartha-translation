translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “noong panahon ni” sa halip na literal na “sa mga araw ni” upang maging natural, habang pinanatili ang inuulit na estruktura ng talata. Ang “angkan” sa pangunahing teksto ay mas karaniwan sa ordinaryong mambabasa; inilagay sa talababa ang mas teknikal na “talaangkanan.”
