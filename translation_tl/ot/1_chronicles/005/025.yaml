revisions:
- from: Ngunit nagtaksil sila sa Diyos ng kanilang mga ninuno at nagputa sila sa pagsunod sa mga diyos ng mga bayan sa lupaing iyon[a], na nilipol ng Diyos sa harap nila.
  to: Ngunit nagtaksil sila sa Diyos ng kanilang mga ninuno at nagpatutot sila sa mga diyos ng mga mamamayan ng lupain[a], na nilipol ng Diyos sa harap nila.
  rationale: Pinalitan ang hindi idiomatikong “nagputa sila sa pagsunod sa” ng “nagpatutot sila sa,” na nagpapanatili sa matinding metapora ng Hebreo at mas likas sa marangal na modernong Tagalog. Ginawang “mga mamamayan ng lupain” ang עַמֵּי הָאָרֶץ at inilagay ang sugnay na “na nilipol...” kaagad pagkatapos nito upang malinaw na ang mga mamamayan ang tinutukoy.
