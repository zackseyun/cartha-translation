base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/025.yaml
  text: But they acted unfaithfully against the God of their fathers and prostituted themselves after the gods of the peoples of the land[b][a], whom God had destroyed before them.
translation:
  language: tl
  text: Ngunit nagtaksil sila sa Diyos ng kanilang mga ninuno at nagpatutot sila sa mga diyos ng mga mamamayan ng lupain[a], na nilipol ng Diyos sa harap nila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ang “nagpatutot” ay seksuwal na talinghaga para sa pagsamba sa ibang mga diyos at pagtataksil sa Diyos. Maaari ring isalin: “umasta silang parang mga patutot sa pagsunod sa mga diyos.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמְעֲלוּ
  choice: nagtaksil sila
  rationale: Ipinahahayag ng מעל ang pagtataksil o pagsira sa katapatan, lalo na sa ugnayang tipan. Likas at mariin sa Tagalog ang “nagtaksil” nang hindi ito ginagawang karaniwang pagsuway lamang.
- source_word: בֵּאלֹהֵי אֲבוֹתֵיהֶם
  choice: sa Diyos ng kanilang mga ninuno
  rationale: Ang ב kasunod ng מעל ay tumutukoy sa Diyos bilang pinagtaksilan. Sa Tagalog, sapat na ang “nagtaksil ... sa” upang malinaw ang relasyonal na paglabag.
- source_word: וַיִּזְנוּ אַחֲרֵי
  choice: nagputa sila sa pagsunod sa
  rationale: Pinananatili ng “nagputa” ang sinadyang seksuwal na talinghaga ng Hebreo para sa idolatriya, samantalang ipinahahayag ng “sa pagsunod sa” ang direksiyon at paghahabol na taglay ng אַחֲרֵי.
- source_word: אֱלֹהֵי עַמֵּי הָאָרֶץ
  choice: mga diyos ng mga bayan sa lupaing iyon
  rationale: Ang “mga bayan” ay tuwirang kumakatawan sa עַמֵּי, at ang “lupaing iyon” ay likas na Tagalog para sa tiyak na lupaing tinutukoy sa konteksto.
- source_word: אֲשֶׁר הִשְׁמִיד אֱלֹהִים מִפְּנֵיהֶם
  choice: na nilipol ng Diyos sa harap nila
  rationale: Ang panghalip na “na” ay sadyang nagpapanatili ng posibleng kalabuan ng saklaw ng Hebreong אֲשֶׁר, bagaman malamang na mga bayan ang tinutukoy. Ang isahang pandiwa sa Hebreo ay nagpapakitang ang אֱלֹהִים dito ay ang Diyos, at ang “nilipol” ay angkop sa causative na שׁמד.
theological_decisions:
- issue: Pagpapanatili sa seksuwal na talinghaga para sa idolatriya
  choice: nagputa sila sa pagsunod sa mga diyos
  alternative: sumunod sila sa mga diyos / nagtaksil sila sa pamamagitan ng pagsamba sa mga diyos
  rationale: Sinasadya ng זנה ang matinding talinghaga ng prostitusyon upang ilarawan ang pagtataksil sa tipan. Ang tahasang salin ay nagpapanatili sa bigat nito; ipinapaliwanag ng talababa ang matalinghagang gamit.
- issue: Kahulugan ng אֱלֹהִים sa sugnay na may הִשְׁמִיד
  choice: Diyos
  alternative: mga diyos
  rationale: Isahan ang pandiwang הִשְׁמִיד, kaya ang tinutukoy ay ang iisang Diyos, hindi ang mga diyos ng mga bayan.
- issue: Pinatutungkulan ng אֲשֶׁר sa hulíng sugnay
  choice: pinanatiling bahagyang malabo sa pamamagitan ng “na”
  alternative: ang mga bayang nilipol ng Diyos
  rationale: Sa balarila at konteksto, malamang na ang “mga bayan” ang antecedent, ngunit maaaring mapagkamalang tumutukoy ang sugnay sa pinakamalapit na “mga diyos.” Hindi tahasang nilutas sa pangunahing teksto ang likas na pagkakadugtong ng Hebreo.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit tuwiran. Ginamit ang “mga ninuno” sa halip na mas literal na “mga ama” dahil kolektibong mga salinlahi ang tinutukoy. Pinanatili ang matinding talinghaga ng orihinal sa halip na palambutin bilang simpleng kawalang-katapatan.
