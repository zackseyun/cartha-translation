  text: וַֽ/יִּמְצְא֤וּ מִרְעֶה֙ שָׁמֵ֣ן וָ/ט֔וֹב וְ/הָ/אָ֨רֶץ֙ רַחֲבַ֣ת יָדַ֔יִם וְ/שֹׁקֶ֖טֶת וּ/שְׁלֵוָ֑ה כִּ֣י מִן חָ֔ם הַ/יֹּשְׁבִ֥ים שָׁ֖ם לְ/פָנִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/040.yaml
  text: And they found rich and good pasture[a], and the land was broad, quiet, and peaceful, for those from Ham who had lived there formerly were there before.
translation:
  language: tl
  text: At nakatagpo sila ng sagana at magandang pastulan, at ang lupain ay malawak, tahimik, at payapa, sapagkat ang mga nagmula kay Ham ay nanirahan doon noong unang panahon.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִרְעֶה
  choice: pastulan
  rationale: Tumutukoy ang pangngalan sa lugar na pinanginginainan ng mga kawan; “pastulan” ang natural at tiyak na katumbas sa modernong Filipino.
- source_word: שָׁמֵן
  choice: sagana
  rationale: Literal itong “mataba,” ngunit kapag inilalarawan ang pastulan ay nangangahulugang mayaman o masagana sa pagkain; iniiwasan ng “sagana” ang alanganing literalismo.
- source_word: טוֹב
  choice: maganda
  rationale: Pinananatili nito ang payak at malawak na positibong pagtataya ng salitang Hebreo at natural na kaakibat ng “sagana.”
- source_word: רַחֲבַת יָדַיִם
  choice: malawak
  rationale: Ang idyoma ay nangangahulugang maluwang o malawak ang sakop ng lupain; “malawak” ang malinaw at karaniwang Filipino.
- source_word: שֹׁקֶטֶת
  choice: tahimik
  rationale: Ipinahihiwatig nito na ang lupain ay hindi ginagambala at panatag; “tahimik” ang tuwirang katumbas na hindi labis ang pagpapakahulugan.
- source_word: שְׁלֵוָה
  choice: payapa
  rationale: Maaaring mangahulugan ng panatag, ligtas, o maalwan. Sa pagkakapares nito sa “tahimik,” ang “payapa” ang pinakamahusay na nagpapanatili sa diwa ng kapanatagan.
- source_word: כִּי מִן חָם הַיֹּשְׁבִים שָׁם לְפָנִים
  choice: sapagkat ang mga nagmula kay Ham ay nanirahan doon noong unang panahon
  rationale: Ang מִן חָם ay natural na ipinapahayag bilang pinagmulang angkan, samantalang ang לְפָנִים ay “noong unang panahon.” Pinananatili ng ayos ang tunay na diwa nang hindi nagdaragdag ng “ilan” o inuulit nang di-natural ang konsepto ng nakaraan.
- source_word: חָם
  choice: Ham
  rationale: Pangngalang pantangi; tinumbasan sa karaniwang transliterasyong Filipino.
theological_decisions: []
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang tatluhang paglalarawan sa lupain—“malawak, tahimik, at payapa”—at ginawang natural ang panghuling sugnay nang walang denominasyonal o teolohikal na pagpapalagay.
