base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/018.yaml
  text: And his wife the Jewess bore Jered the father of Gedor[a], Heber the father of Soco, and Jekuthiel the father of Zanoah. These are the sons of Bithiah daughter of Pharaoh[c][b], whom Mered took as wife.
translation:
  language: tl
  text: At ang asawa niyang babaeng taga-Juda[a] ay nagsilang kina Jered, na ama ng Gedor[b], Heber, na ama ng Soco, at Jekutiel, na ama ng Zanoa. Ito ang mga anak na lalaki ni Bitia, anak ni Faraon, na kinuha ni Mered bilang asawa.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Judiong babae” o “babaeng taga-Judea.”
    reason: lexical_alternative
  - marker: b
    text: Sa Mga Cronica, ang “ama ng” ay maaari ring mangahulugang tagapagtatag, ninuno, o pinuno ng angkan na kaugnay ng isang lugar.
    reason: lexical_alternative
  - marker: c
    text: 'Mahirap unawain ang Hebreo: pinagtatalunan kung ang “asawa niyang babaeng taga-Juda” at si Bitia, anak ni Faraon, ay iisang babae o magkaibang asawa ni Mered.'
    reason: alternative_reading
lexical_decisions:
- source_word: הַיְהֻדִיָּה
  choice: babaeng taga-Juda
  rationale: Ang pambabaeng katawagang pantao ay maaaring tumukoy sa isang babaeng Judeano o Judio. Ang “babaeng taga-Juda” ay natural sa modernong Filipino at pinananatili ang posibleng heograpiko-etnikong diwa.
- source_word: יָלְדָה
  choice: ipinanganak
  rationale: Karaniwang pormula ito sa talaangkanan para sa panganganak; ang aktibong pariralang “ipinanganak ng” ay malinaw at likas sa Filipino.
- source_word: אֲבִי
  choice: ama ng
  rationale: Pinananatili nito ang Hebreong idyoma, na sa Mga Cronica ay maaari ring mangahulugang tagapagtatag, ninuno, o pinuno ng angkan na kaugnay ng isang lugar.
- source_word: שׂוֹכוֹ
  choice: Soco
  rationale: Transliterasyon ng pangalan ng lugar na angkop sa Filipino at kaayon ng anyong ibinigay sa consultation layer.
- source_word: יְקוּתִיאֵל
  choice: Jekutiel
  rationale: Isina-Filipinong transliterasyon ng personal na pangalan, na gumagamit ng J para sa paunang yod ayon sa karaniwang tradisyon ng mga pangalang biblikal sa Filipino.
- source_word: זָנוֹחַ
  choice: Zanoa
  rationale: Transliterasyon ng pangalan ng lugar sa anyong madaling bigkasin sa Filipino.
- source_word: בְּנֵי
  choice: mga anak na lalaki
  rationale: Tahasang panlalaki ang Hebreo; hindi ito ginawang pangkalahatang “mga anak” upang mapanatili ang anyo ng pinagmulang teksto.
- source_word: בִּתְיָה בַת פַּרְעֹה
  choice: Bitia, na anak na babae ng Faraon
  rationale: Malinaw na pinananatili ang ugnayang ipinahahayag ng apposition sa Hebreo.
- source_word: לָקַח
  choice: kinuha ... bilang asawa
  rationale: Bagaman literal na “kinuha,” karaniwan itong tumutukoy sa pagkuha ng babae upang mapangasawa sa ganitong konteksto.
- source_word: וְאֵלֶּה
  choice: Ang mga ito
  rationale: Natural na panimulang pagbubuod sa Filipino; hindi kailangang isalin nang hiwalay ang pangatnig upang maihatid ang ugnayan.
theological_decisions:
- issue: Kaugnayan ng “asawa niyang babaeng taga-Juda” kay Bitia na anak na babae ng Faraon
  choice: Pinanatili ang pagkakasunod at hindi tiyak na ugnayan sa Hebreo nang hindi tahasang pinag-isa o pinaghiwalay ang dalawang pagtukoy.
  alternative: Unawain ang babaeng taga-Juda at si Bitia bilang iisang babae, o baguhin ang paghahati ng pangungusap upang malinaw na gawing magkaibang asawa sila ni Mered.
  rationale: Mahirap ang sintaks ng talata at hindi tiyak kung iisang babae o magkaibang asawa ang tinutukoy. Hindi dapat lutasin ng salin ang hindi nilulutas ng tekstong Hebreo.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Pinanatili ang maigsi at pormulang estilo ng talaangkanan, habang inilagay sa talababa ang mahahalagang alternatibong leksikal at ang tunay na sintaktikong kalabuan.
