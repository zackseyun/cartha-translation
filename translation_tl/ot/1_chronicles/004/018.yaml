  source_fidelity: Tumpak na naihahatid ng draft ang pangunahing talaangkanan, ang idyomang “ama ng,” at ang hindi tiyak na kaugnayan ng babaeng taga-Juda kay Bitia. Gayunman, ang “ipinanganak ng ... si” ay hindi ang pinakanatural na paraan upang isalin ang aktibong Hebreong “nagsilang,” at ang talababa a ay may maling anyong “babaeng Judeano.”
  naturalness: Mas natural at malinaw sa modernong Filipino ang “ay nagsilang kina ...” para sa isang inang nagsilang ng ilang anak. Ang “anak ni Faraon” ay likas na katumbas ng “daughter of Pharaoh” sa ganitong talaangkanan, nang hindi nawawala ang kasarian dahil pinangalanan si Bitia at malinaw ang konteksto.
  terminology: Pinanatili ang “babaeng taga-Juda,” “ama ng,” “mga anak na lalaki,” at “kinuha ... bilang asawa.” Inayos ang mga alternatibo sa talababa upang maging wastong modernong Filipino at hindi ulitin ang napiling salin.
  issues:
