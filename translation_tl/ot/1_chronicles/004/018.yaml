    rationale: Ang “Judeano” ay hindi ang angkop na pambabaeng anyo sa pariralang ito at hindi rin ito ang karaniwang modernong Filipino. “Judiong babae” o “babaeng taga-Judea” ang mas natural na mga alternatibo.
