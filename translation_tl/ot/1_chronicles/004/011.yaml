id: 1CH.4.11
reference: 1 Chronicles 4:11
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וּ/כְל֥וּב אֲחִֽי שׁוּחָ֖ה הוֹלִ֣יד אֶת מְחִ֑יר ה֖וּא אֲבִ֥י אֶשְׁתּֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/011.yaml
  text: Chelub[a], the brother of Shuhah, fathered Mehir; he was the father of Eshton.
translation:
  language: tl
  text: Si Kelub, na kapatid ni Suha, ay naging ama ni Mehir; si Mehir ang ama[a] ni Eston.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ninuno” o “tagapagtatag” ni Eston. Sa mga talaangkanan, ang “ama” ay maaari ring tumukoy sa ninuno ng isang angkan o sa tagapagtatag ng isang pamayanan, hindi lamang sa tuwirang biyolohikal na ama.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/כְל֥וּב
  choice: Kelub
  rationale: Pangngalang pantangi; tinumbasan ayon sa mas tuwirang anyong Hebreo. Hindi na hiwalay na isinalin ang prefiks na וּ dahil likas na nagsisimula ang talata bilang isang tala sa talaangkanan.
- source_word: אֲחִֽי שׁוּחָ֖ה
  choice: na kapatid ni Suha
  rationale: Tuwirang ipinahahayag ang ugnayang pampamilya at natural ang ayos sa modernong Tagalog.
- source_word: הוֹלִ֣יד
  choice: ay naging ama ni
  rationale: Sa kontekstong talaangkanan, ang Hiphil ng ילד ay tumutukoy sa pag-aanak o pagkakaroon ng inapo. Natural at marangal ito sa Tagalog nang hindi gumagamit ng makalumang pananalita.
- source_word: מְחִ֑יר
  choice: Mehir
  rationale: Pangngalang pantangi; transliterasyon mula sa Hebreo.
- source_word: ה֖וּא
  choice: si Mehir
  rationale: Inulit ang pangalan sa halip na gumamit lamang ng “siya” upang malinaw na si Mehir, hindi si Kelub, ang simuno ng kasunod na sugnay.
- source_word: אֲבִ֥י
  choice: ang ama
  rationale: Pinananatili ang pangunahing kahulugan ng Hebreong אב, habang ang talababa ay nagpapakita ng posibleng mas malawak na gamit nito sa mga talaangkanan.
- source_word: אֶשְׁתּֽוֹן
  choice: Eston
  rationale: Pangngalang pantangi; iniangkop ang transliterasyon sa karaniwang baybay at tunog sa Tagalog.
theological_decisions:
- issue: Saklaw ng kahulugang אֲבִי sa isang talaangkanan
  choice: ama
  alternative: ninuno o tagapagtatag
  rationale: Hindi tiyak sa konteksto kung agarang biyolohikal na ama ang ibig sabihin o mas malawak na ninuno/tagapagtatag. Pinanatili sa teksto ang pinakapayak na kahulugan at inilagay sa talababa ang lehitimong alternatibo.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, maikli, at marangal. Ginamit ang “naging ama ni” bilang natural na pahayag sa talaangkanan; inulit ang “si Mehir” upang maiwasan ang kalituhan sa tinutukoy ng panghalip.
