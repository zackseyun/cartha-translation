  text: וְ/ק֣וֹץ הוֹלִ֔יד אֶת עָנ֖וּב וְ/אֶת הַ/צֹּבֵבָ֑ה וּ/מִשְׁפְּח֥וֹת אֲחַרְחֵ֖ל בֶּן הָרֽוּם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/008.yaml
  text: Koz fathered Anub[a], Hazzobebah[b], and the families of Aharhel son of Harum.
translation:
  language: tl
  text: Naging ama si Koz ni Anub at ni Hazzobebah[a], at ng mga angkan[b] ni Aharhel na anak ni Harum.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Zobebah” kung hindi isasama sa transliterasyon ang nakadugtong na pantukoy sa Hebreo.
    reason: lexical_alternative
  - marker: b
    text: Maaari ding “mga pamilya” sa kontekstong ito ng talaangkanan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ק֣וֹץ
  choice: Koz
  rationale: Pangngalang pantangi; tuwirang transliterasyon ng anyong Hebreo, na walang pantukoy na magbibigay ng anyong “Hakkoz.”
- source_word: הוֹלִ֔יד
  choice: naging ama
  rationale: Sa talaangkanan, ang Hiphil ng ילד ay tumutukoy sa pagiging ama o ninuno. Likas at marangal sa makabagong Tagalog ang “naging ama,” habang hindi nililimitahan ang ugnayan sa agarang kapanganakan lamang.
- source_word: עָנ֖וּב
  choice: Anub
  rationale: Pangngalang pantangi na isinalin sa pamamagitan ng transliterasyon.
- source_word: הַצֹּבֵבָ֑ה
  choice: Hazzobebah
  rationale: Pinananatili sa transliterasyon ang paunang tunog mula sa nakadugtong na pantukoy sa anyong Masoretiko. Posible rin ang “Zobebah,” kaya inilagay ito sa talababa.
- source_word: מִשְׁפְּח֥וֹת
  choice: mga angkan
  rationale: Sa konteksto ng talaangkanan, tumutukoy ito sa malalawak na pangkat ng magkakamag-anak. Mas tiyak dito ang “mga angkan” kaysa sa karaniwang “mga pamilya,” ngunit itinatala ang huli bilang alternatibo.
- source_word: אֲחַרְחֵ֖ל
  choice: Aharhel
  rationale: Pangngalang pantangi na tuwirang isinalin sa pamamagitan ng transliterasyon.
- source_word: בֶּן
  choice: anak ni
  rationale: Karaniwang panandang pangtalaangkanan na nag-uugnay kay Aharhel kay Harum.
- source_word: הָרֽוּם
  choice: Harum
  rationale: Sinusunod ang pagbigkas na ipinahihiwatig ng Masoretikong paglalagay ng mga patinig.
