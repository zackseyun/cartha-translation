  text: וּ/רְאָיָ֤ה בֶן שׁוֹבָל֙ הוֹלִ֣יד אֶת יַ֔חַת וְ/יַ֣חַת הֹלִ֔יד אֶת אֲחוּמַ֖י וְ/אֶת לָ֑הַד אֵ֖לֶּה מִשְׁפְּח֥וֹת הַ/צָּֽרְעָתִֽי־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/002.yaml
  text: Reaiah son of Shobal fathered Jahath[a], and Jahath fathered Ahumai and Lahad. These were the clans of the Zorathites.
translation:
  language: tl
  text: Si Reaya na anak ni Sobal ay naging ama ni Jahat, at si Jahat ay naging ama nina Ahumai at Lahad. Sila ang mga angkan[a] ng mga taga-Zora.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga pamilya.” Ang salitang Hebreo ay maaaring tumukoy sa malalawak na pangkat ng magkakamag-anak; ginamit dito ang “mga angkan” dahil ito ay nasa konteksto ng talaangkanan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּרְאָיָה
  choice: Reaya
  rationale: Pangngalang pantangi; tuwirang transliterasyon ng anyong Hebreo sa baybay na natural basahin sa Filipino.
- source_word: בֶן
  choice: anak ni
  rationale: Pinananatili ang pormal na ugnayang genealogical; gaya sa ibang talaangkanan, maaari rin itong tumukoy sa mas malayong inapo ayon sa konteksto.
- source_word: הוֹלִיד / הֹלִיד
  choice: naging ama ni/nina
  rationale: Ang Hiphil ng ילד sa talaangkanan ay nangangahulugang magkaanak o maging ama. Natural ito sa modernong Filipino at hindi kasing-arkaiko ng “ipinanganak ni” sa ganitong gamit.
- source_word: יַחַת
  choice: Jahat
  rationale: Pangngalang pantangi na isinalin sa titik ayon sa tunog ng Hebreo.
- source_word: אֲחוּמַי
  choice: Ahumai
  rationale: Pangngalang pantangi na transliterado mula sa Hebreo.
- source_word: לָהַד
  choice: Lahad
  rationale: Pangngalang pantangi na transliterado mula sa Hebreo.
- source_word: אֵלֶּה
  choice: Sila
  rationale: Ang panghalip ay tumutukoy sa mga taong kababanggit lamang; mas natural sa Filipino ang “Sila” kaysa literal na “Ang mga ito.”
- source_word: מִשְׁפְּחֹות
  choice: mga angkan
  rationale: Sa kontekstong pantribo at genealogical, tumutukoy ito sa malalawak na pangkat na magkakamag-anak, hindi lamang sa nukleyar na pamilya.
- source_word: הַצָּרְעָתִי
  choice: mga taga-Zora
  rationale: Pangngalang tumutukoy sa mga taong kaugnay ng Zora; malinaw at natural sa Filipino ang lokatibong anyong “mga taga-Zora.”
theological_decisions: []
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “naging ama” upang malinaw na maipahayag ang genealogical na Hiphil, at “mga taga-Zora” sa halip na isang di-likas na hiniram na gentilic.
