  source_fidelity: 'Tapat ang salin sa Hebreo: malinaw na inihahayag ang ugnayang “anak ni” at ang dalawang sunod na pormulang genealogical na “naging ama.” Wasto ring naipapasa ang plural na “mga angkan” para sa מִשְׁפְּחוֹת at ang kaugnayan ng pangkat sa Zora sa “mga taga-Zora.”'
