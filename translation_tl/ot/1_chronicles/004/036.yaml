  text: and Elioenai, and Jaakobah, and Jeshohaiah, and Asaiah, and Adiel, and Jesimiel, and Benaiah.
translation:
  language: tl
  text: at sina Elioenai, Yaakoba, Yesohaya, Asaya, Adiel, Yesimiel, at Benaya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֶלְיוֹעֵינַי
  choice: Elioenai
  rationale: Pangalan ng tao; tinumbasan sa paraang transliterasyon at pinanatiling malapit sa anyong Hebreo, na angkop sa makabagong pagbabaybay sa Filipino.
- source_word: יַעֲקֹבָה
  choice: Jaakoba
  rationale: Pangalan ng tao; ang dobleng a ay nagpapahiwatig ng magkahiwalay na patinig sa anyong Hebreo, samantalang ang hulíng h na hindi binibigkas ay hindi na isinama.
- source_word: יְשׁוֹחָיָה
  choice: Jesohaias
  rationale: Pangalan ng tao; ginamit ang nakagawiang anyong biblikal sa Filipino habang pinananatili ang mahahalagang tunog ng pangalang Hebreo.
- source_word: עֲשָׂיָה
  choice: Asaias
  rationale: Pangalan ng tao; ginamit ang nakagawiang anyong biblikal sa Filipino, sa halip na ang anyong Ingles na Asaiah.
- source_word: עֲדִיאֵל
  choice: Adiel
  rationale: Pangalan ng tao; tuwirang transliterasyon na natural basahin sa Filipino.
- source_word: יְשִׂימִיאֵל
  choice: Jesimiel
  rationale: Pangalan ng tao; transliterasyong madaling basahin sa Filipino at umaayon sa tradisyong gumagamit ng J para sa paunang yod sa mga pangalang biblikal.
- source_word: בְנָיָה
  choice: Benaias
  rationale: Pangalan ng tao; ginamit ang nakagawiang anyong biblikal sa Filipino sa halip na kopyahin ang anyong Ingles na Benaiah.
- source_word: וְ / וַ / וִ / וּ
  choice: at / sina
  rationale: Ang mga waw ay nag-uugnay sa sunod-sunod na pangalan. Sa Filipino, likas ang “sina” sa talaan ng mga tao at ang “at” sa simula at bago ang huling pangalan; hindi kailangang ulitin ang “at” sa bawat pangalan upang maipahayag ang parehong ugnayan nang malinaw.
