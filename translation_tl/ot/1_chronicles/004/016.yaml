lexical_decisions:
- source_word: וּבְנֵי
  choice: At ang mga anak ni
  rationale: Ang בְנֵי ay anyong construct na nangangahulugang “mga anak ni,” at pinananatili ng “At” ang ugnayang pang-talaan ng panlaping וּ.
- source_word: יְהַלֶּלְאֵל
  choice: Jehallelel
  rationale: Pangalang pantangi na isinalin sa paraang transliterasyon, hindi ayon sa kahulugan.
- source_word: זִיף
  choice: Zif
  rationale: Tuwirang transliterasyon ng pangalang Hebreo; ginagamit ang “f” para sa tunog na kinakatawan ng פ.
- source_word: וְזִיפָה
  choice: Zifa
  rationale: Tuwirang transliterasyon ng pangalang Hebreo; ang pang-ugnay ay ipinahayag sa ayos ng listahan sa Filipino.
- source_word: תִּירְיָא
  choice: Tiria
  rationale: Tuwirang transliterasyon ng pangalang pantangi ayon sa mga katinig at patinig ng tekstong Masoretiko.
- source_word: וַאֲשַׂרְאֵל
  choice: at Asarel
  rationale: Tuwirang transliterasyon ng pangalang pantangi, kasama ang pang-ugnay na וַ bilang “at.”
