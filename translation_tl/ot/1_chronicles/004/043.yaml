  naturalness: Likas ang kabuuang rehistro, ngunit mas malinaw at mas natural ang 'kabilang sa Amalek' para sa ugnayan ng mga nakaligtas sa Amalek. Ang alternatibong tala sa b ay dapat gumamit ng mas tuwirang mga pandiwang gaya ng 'nanahan' o 'namalagi'; ang paliwanag na 'mga bagong nanirahan' ay hindi likas at hindi kinakailangan.
  terminology: Pinananatili ang 'Amalek' sa pangunahing teksto, alinsunod sa Hebreo at nang hindi agad ginagawang 'mga Amalekita.' Ang 'pinabagsak' ay katanggap-tanggap na pagsasalin ng נכה sa kontekstong militar, sapagkat hindi nito tahasang idinidikta ang 'pinatay.'
