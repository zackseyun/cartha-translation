  text: And they struck down the remnant of the survivors of Amalek[b][a], and they lived there to this day.
translation:
  language: tl
  text: Pinabagsak nila ang nalabi sa mga nakaligtas na kabilang sa Amalek[a], at nanirahan sila roon[b] hanggang sa araw na ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “ang nalabi sa Amalek na nakatakas” o “ang nalabi sa mga nakaligtas na Amalekita.” Pinagsasama ng Hebreo ang dalawang magkalapit na katawagan para sa mga naiwan matapos ang pagkawasak.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “at doon sila nanahan” o “at doon sila namalagi.” Ang pandiwa ay maaaring tumukoy sa paninirahan o sa pananatili sa isang lugar.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכּוּ
  choice: Pinabagsak nila
  rationale: Ang pandiwang נכה ay tumutukoy sa pananakit o pagpapabagsak, lalo na sa laban. Ipinahihiwatig ng konteksto ang nakamamatay na bunga nang hindi ito higit na tinutukoy kaysa sa Hebreo.
- source_word: שְׁאֵרִית הַפְּלֵטָה
  choice: ang nalabi sa mga nakaligtas
  rationale: Pinananatili nito ang dalawang magkalapit na ideya sa Hebreo—ang nalabi at ang mga nakaligtas—sa natural na modernong Tagalog.
- source_word: לַעֲמָלֵק
  choice: sa Amalek
  rationale: Pinananatili ang pangalang Amalek, na sa konteksto ay maaaring tumukoy sa bayang kaugnay ng taong iyon; hindi tahasang ginagawang “mga Amalekita” sa pangunahing teksto.
- source_word: וַיֵּשְׁבוּ
  choice: nanirahan sila
  rationale: Ang ישב ay maaaring mangahulugang manirahan o mamalagi, at maaari ring magpahiwatig ng paninirahan bilang pag-okupa sa isang lugar.
- source_word: שָׁם
  choice: roon
  rationale: Likas na pang-abay na pamatlig para sa lugar na nabanggit sa naunang konteksto.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: hanggang sa araw na ito
  rationale: Karaniwang katumbas sa salaysay ng Hebreong pahayag na tumutukoy sa pagpapatuloy hanggang sa panahon ng tagapagsalaysay.
