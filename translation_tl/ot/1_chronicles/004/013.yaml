base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/013.yaml
  text: 'The sons of Kenaz: Othniel and Seraiah[a]. And the sons of Othniel: Hathath.'
translation:
  language: tl
  text: 'Ang mga anak ni Kenaz ay sina Otniel at Seraias. Ang mga anak ni Otniel: si Hatat.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי קְנַז
  choice: Ang mga anak ni Kenaz
  rationale: Ang בְנֵי ay pangmaramihang anyong construct ng בֵּן. Pinanatili ang karaniwang pormulang pangangkanan na “mga anak ni”; hindi tahasang isinalin ang panimulang וּ dahil nagsisimula rito ang bagong tala sa loob ng angkan.
- source_word: עָתְנִיאֵל
  choice: Otniel
  rationale: Pangngalang pantangi; ginamit ang tuwirang transliterasyong angkop sa makabagong Filipino.
- source_word: וּשְׂרָיָה
  choice: at Seraias
  rationale: Pangngalang pantangi na may pang-ugnay na וּ. Ginamit ang anyong “Seraias,” na madaling basahin sa Filipino at malinaw na kumakatawan sa pangalang Hebreo.
- source_word: וּבְנֵי עָתְנִיאֵל
  choice: Ang anak ni Otniel
  rationale: Bagaman pangmaramihan sa anyo ang בְנֵי, iisang pangalan lamang—Hatat—ang nakatala. Likas sa Filipino ang kolektibong pormula, ngunit ang isahang “anak” ay mas malinaw dito at hindi nagdaragdag ng mga di-pinangalanang anak.
- source_word: חֲתַת
  choice: Hatat
  rationale: Pangngalang pantangi; tuwirang transliterasyon ayon sa bigkas ng Hebreo.
