translation:
  language: tl
  text: 'Ang mga anak ni Juda: sina Perez,[a] Hezron, Carmi, Hur, at Shobal.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa mga talaangkanan, ang Hebreong “mga anak ni” ay maaaring tumukoy sa mga tuwirang anak o, sa mas malawak na diwa, sa mga inapo.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: mga anak ni
  rationale: Tuwirang katumbas ito ng construct plural ng בֵּן at likas sa talaangkanan sa Filipino. Maaari rin itong tumukoy nang mas malawak sa mga inapo, kaya nilinaw iyon sa talababa.
- source_word: יְהוּדָה
  choice: Juda
  rationale: Karaniwang anyong Filipino ng pangalan ng patriyarka at lipi.
- source_word: פֶּרֶץ
  choice: Perez
  rationale: Makabagong transliterasyon ng pangalang Hebreo na karaniwan sa Filipino.
- source_word: חֶצְרוֹן
  choice: Hezron
  rationale: Transliterasyon ng pangalang Hebreo ayon sa karaniwang gamit.
- source_word: כַרְמִי
  choice: Carmi
  rationale: Transliterasyon ng pangalang Hebreo ayon sa karaniwang gamit.
- source_word: חוּר
  choice: Hur
  rationale: Transliterasyon ng pangalang Hebreo ayon sa karaniwang gamit.
- source_word: שׁוֹבָל
  choice: Shobal
  rationale: Transliterasyon ng pangalang Hebreo ayon sa karaniwang gamit.
- source_word: וְ
  choice: at
  rationale: Ang inuulit na pangatnig sa Hebreo ay natural na kinakatawan sa Filipino ng mga kuwit at ng “at” bago ang huling pangalan.
theological_decisions:
- issue: Saklaw ng genealogical na בְּנֵי
  choice: Pinanatili sa pangunahing teksto ang literal na “mga anak,” na may talababa tungkol sa mas malawak na genealogical na gamit.
  alternative: mga inapo
  rationale: Hindi tiyak sa mismong parirala kung tuwirang mga anak o mas malalayong inapo ang tinutukoy; pinananatili ng salin at talababa ang saklaw na ito nang hindi ito ipinapasya nang labis.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “sina” upang maging natural ang pagpapakilala ng talaan ng mga pangalan, habang pinanatili ang maikli at pormal na anyo ng talata.
