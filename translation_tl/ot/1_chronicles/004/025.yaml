lexical_decisions:
- source_word: שַׁלֻּם
  choice: Sallum
  rationale: Pangalan ng tao; isinalin sa karaniwang anyong transliterado sa Filipino, na gumagamit ng “S” para sa letrang shin at pinananatili ang dobleng katinig.
- source_word: בְּנוֹ
  choice: anak niya
  rationale: Ang pangngalang בֵּן na may hulaping panlalaking pangatlong panauhan ay literal na “anak niya.” Sa talaangkanang ito, ipinahihiwatig ng paulit-ulit na pormula ang sunod-sunod na ugnayang ama at anak.
- source_word: מִבְשָׂם
  choice: Mibsam
  rationale: Pangalan ng tao; tinumbasan sa isang malinaw at karaniwang transliterasyong Filipino.
- source_word: מִשְׁמָע
  choice: Misma
  rationale: Pangalan ng tao; ang tunog na shin ay kinakatawan ng “s” sa natural na baybay-Filipino.
