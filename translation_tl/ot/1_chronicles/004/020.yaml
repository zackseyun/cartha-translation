base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/020.yaml
  text: 'The sons of Shimon: Amnon and Rinnah[a], Ben-Hanan and Tilon[b]. And the sons of Ishi: Zoheth and Ben-Zoheth.'
translation:
  language: tl
  text: Ang mga anak na lalaki ni Shimon ay sina Amnon, Rina, Ben-Hanan[a], at Tilon. Ang mga anak na lalaki naman ni Ishi ay sina Zohet at Ben-Zohet[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O maaaring unawain ang “Ben-Hanan” bilang “anak ni Hanan,” bagaman sa talaang ito ng lahi ay malamang na isa itong pangalang pantangi.
    reason: lexical_alternative
  - marker: b
    text: O maaaring unawain ang “Ben-Zohet” bilang “anak ni Zohet,” bagaman sa talaang ito ng lahi ay malamang na isa itong pangalang pantangi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי שִׁימוֹן
  choice: Ang mga anak na lalaki ni Shimon
  rationale: Ang בְּנֵי ay tuwirang pormulang pang-talaan ng lahi na nangangahulugang “mga anak na lalaki ni.” Hindi na tahasang isinalin ang panimulang וּ bilang “at” dahil pagpapatuloy ito ng talaan at mas natural sa Filipino ang pagsisimulang “Ang.”
- source_word: אַמְנוֹן וְרִנָּה
  choice: Amnon, Rina
  rationale: Mga pangalang pantangi ang mga ito. Ginamit ang “Rina” bilang payak na transliterasyon sa Filipino ng רִנָּה, samantalang ang pang-ugnay ay naipahahayag sa hulíng “at” ng serye.
- source_word: בֶּן חָנָן
  choice: Ben-Hanan
  rationale: Sa pagkakasunod-sunod ng mga pangalan, malamang na gumaganap ang buong parirala bilang tambalang pangalang pantangi. Pinananatili ng gitling ang elementong ben nang hindi ipinapalagay na hiwalay itong pahayag na “anak ni Hanan.”
- source_word: וְתולון
  choice: at Tilon
  rationale: Pangalang pantangi ito; ang וְ ay isinaling “at” bilang panghuling pang-ugnay sa serye.
- source_word: וּבְנֵי יִשְׁעִי
  choice: Ang mga anak na lalaki naman ni Ishi
  rationale: Inuulit ng Hebreo ang pormulang pang-talaan ng lahi. Ipinahahayag ng “naman” ang pagpapatuloy at paglipat sa susunod na sambahayan nang natural sa Filipino.
- source_word: זוֹחֵת
  choice: Zohet
  rationale: Pangalang pantangi; ang hulíng ת ay tinumbasan ng “t” ayon sa bigkas na mas angkop sa ortograpiyang Filipino.
- source_word: וּבֶן זוֹחֵת
  choice: at Ben-Zohet
  rationale: Dahil walang kasunod na personal na pangalan matapos ang “anak ni,” mas malamang na ang buong anyo ay pangalang pantangi sa talaan. Gayunman, inilalahad sa talababa ang tunay na posibleng alternatibo.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “sina” upang natural na ipakilala ang sunod-sunod na mga pangalan, habang pinanatili ang pormulang “mga anak na lalaki” upang huwag palawakin nang walang batayan ang kahulugan tungo sa lahat ng inapo. Inilipat ang mga pananda ng talababa sa mismong mga pangalang Ben-Hanan at Ben-Zohet, na siyang tinutukoy ng mga paliwanag.
