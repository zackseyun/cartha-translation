base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/017.yaml
  text: 'The sons of Ezrah: Jether[a], Mered, Epher, and Jalon; and she conceived Miriam, Shammai, and Ishbah[c][b], the father of Eshtemoa.'
translation:
  language: tl
  text: 'Ang mga anak ni Ezrah: sina Jeter[a], Mered, Efer, at Jalon; at nagbuntis siya[b] kina Miriam, Samai, at Isba, na ama ng Estemoa.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “At ang anak ni Ezrah.” Dahil maraming pangalan ang kasunod, karaniwan itong inuunawa bilang “ang mga anak ni Ezrah.”
    reason: textual_variant
  - marker: b
    text: Sa Hebreo, “at nagbuntis siya”; hindi pinangalanan sa sugnay na ito ang babaeng paksa.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “na tagapagtatag ng Estemoa,” kung ang Estemoa ay pangalan ng isang angkan o pamayanan sa halip na isang tao.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבֶן
  choice: Ang mga anak ni
  rationale: Bagaman isahan ang anyong Hebreo na ben, maraming pangalan ang kasunod nito; kaya ang maramihang pambungad ang pinakamalinaw sa konteksto ng talaangkanan. Nasa talababa ang literal na anyong isahan.
- source_word: עֶזְרָה
  choice: Ezra
  rationale: Pangalang pantangi; isina-Tagalog ang transliterasyon nang hindi ito ipinagkakamali sa mas kilalang Esdras/Ezra sa ibang konteksto.
- source_word: יֶתֶר וּמֶרֶד וְעֵפֶר וְיָלוֹן
  choice: Jeter, Mered, Efer, at Jalon
  rationale: Mga pangalang pantangi na isinalin sa baybay na natural sa Filipino habang pinananatiling nakikilala ang mga anyong Hebreo.
- source_word: וַתַּהַר
  choice: At ipinaglihi niya
  rationale: Tuwirang ipinahahayag ng pandiwa ang paglilihi o pagbubuntis, hindi ang panganganak. Hindi tinukoy sa sugnay ang babaeng paksa, kaya hindi nagdagdag ng pangalan.
- source_word: מִרְיָם וְאֶת שַׁמַּי וְאֶת יִשְׁבָּח
  choice: sina Miriam, Samai, at Isba
  rationale: Mga pangalang pantangi; pinanatili ang Miriam gaya ng nasa tekstong Hebreo kahit karaniwan itong pangalang pambabae.
- source_word: אֲבִי אֶשְׁתְּמֹעַ
  choice: na ama ng Estemoa
  rationale: Pormal at malinaw na salin ng 'ama ng.' Maaaring tumukoy ang ama sa ninuno o tagapagtatag ng angkan o pamayanan, kaya inilagay ang alternatibo sa talababa.
