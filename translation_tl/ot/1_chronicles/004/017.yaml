translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “sina” para sa listahan ng mga pangalan at pinanatili ang kapansin-pansing kalabuan ng di-pinangalanang babaeng paksa. Iniwasang gawing “ipinanganak” ang pandiwa sapagkat ang Hebreo ay tahasang tumutukoy sa paglilihi.
