  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וּ/פְנוּאֵל֙ אֲבִ֣י גְדֹ֔ר וְ/עֵ֖זֶר אֲבִ֣י חוּשָׁ֑ה אֵ֤לֶּה בְנֵי חוּר֙ בְּכ֣וֹר אֶפְרָ֔תָה אֲבִ֖י בֵּ֥ית לָֽחֶם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/004.yaml
  text: Penuel[a], the father of Gedor, and Ezer, the father of Hushah—these were the sons of Hur, the firstborn of Ephrathah[b], the father of Bethlehem.
translation:
  language: tl
  text: Si Penuel[a], na ama[b] ng Gedor, at si Ezer, na ama ng Husa—sila ang mga anak ni Hur, na panganay ni Efrata at ama ng Bethlehem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “Penuel” ay binabaybay na “Peniel” sa ilang ibang talata; magkaibang anyo ito ng iisang pangalan.
    reason: lexical_alternative
  - marker: b
    text: Sa kontekstong ito ng talaangkanan, ang Hebreong “ama ng” ay maaari ring mangahulugang “ninuno ng” o “tagapagtatag ng,” lalo na kapag bayan o angkan ang tinutukoy. Ganito rin ang posibleng saklaw ng iba pang paglitaw ng “ama” sa talata.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְנוּאֵל
  choice: Penuel
  rationale: Pangalang pantangi; tinumbasan sa baybay na malapit sa anyong Hebreo sa talatang ito. Ang Peniel ay ibang anyo ng pangalan.
- source_word: אֲבִי
  choice: ama ng
  rationale: Pinananatili ang idyomang Hebreo. Sa talaangkanan at kaugnay ng mga bayan o angkan, maaari rin itong mangahulugang ninuno, tagapagtatag, o pinunong kaugnay ng lugar.
- source_word: גְדֹר
  choice: Gedor
  rationale: Pangalan ng lugar o angkan; isinalin sa pamamagitan ng transliterasyon.
- source_word: עֵזֶר
  choice: Ezer
  rationale: Pangalang pantangi; isinalin sa pamamagitan ng transliterasyon.
- source_word: חוּשָׁה
  choice: Husa
  rationale: Pangalan ng lugar o angkan; ginamit ang natural na transliterasyong Filipino.
- source_word: אֵלֶּה
  choice: sila ang
  rationale: Walang tahasang pandiwa ang sugnay sa Hebreo; ang ganitong pagbubuo ay natural sa Filipino at akma sa talaangkanang salaysay.
- source_word: בְנֵי
  choice: mga anak ni
  rationale: Pinananatili ang literal na ugnayang 'mga anak,' bagaman maaari itong tumukoy nang mas malawak sa mga inapo sa konteksto ng talaangkanan.
- source_word: חוּר
  choice: Hur
  rationale: Pangalang pantangi; isinalin sa pamamagitan ng transliterasyon.
- source_word: בְּכֹר
  choice: panganay ni
  rationale: Tumpak na ipinahahayag ang katayuan ni Hur kaugnay ni Efrata nang hindi idinaragdag ang salitang 'anak' na hindi tahasang inuulit sa Hebreo.
- source_word: אֶפְרָתָה
  choice: Efrata
  rationale: Pangalang pantangi; ginamit ang malinaw at karaniwang baybay sa Filipino.
- source_word: בֵּית לָחֶם
  choice: Bethlehem
  rationale: Pinanatili ang nakaugaliang pangalan ng lugar sa halip na isalin nang literal bilang 'bahay ng tinapay.'
theological_decisions:
- issue: Saklaw ng אֲבִי ('ama ng') kapag bayan o angkan ang kasunod
  choice: Pinanatili ang 'ama ng' sa pangunahing teksto at ipinaliwanag ang mas malawak na kahulugan sa talababa.
  alternative: Isalin bilang 'tagapagtatag ng' o 'ninuno ng.'
  rationale: Hindi tiyak sa teksto kung biyolohikal na ama, ninuno, tagapagtatag, o pinuno ng isang pamayanan o angkan ang ibig sabihin. Pinananatili ng pormal na idyoma ang tunay na kalabuan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang maikli at sunod-sunod na anyo ng talaangkanan, ang mga pangalang pantangi, at ang kalabuan ng Hebreong idyomang “ama ng.”
