  text: and in Bethuel, and in Hormah, and in Ziklag,
translation:
  language: tl
  text: at sa Betuel, at sa Horma, at sa Ziklag,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/בִ/בְתוּאֵל
  choice: at sa Betuel
  rationale: Ang וּ ay ipinahayag na “at,” na nagpapatuloy sa talaan ng mga pamayanan; ang ב ay “sa,” ang likas na panandang Filipino para sa lokasyon. Ang בְתוּאֵל ay pangalan ng lugar kaya tinumbasan bilang “Betuel.”
- source_word: וּ/בְ/חָרְמָה
  choice: at sa Horma
  rationale: Pinananatili ng “at sa” ang paulit-ulit na anyo ng listahan sa Hebreo. Ang חָרְמָה ay pangalan ng lugar at isinalin sa baybay na “Horma,” ayon sa karaniwang anyong Filipino.
- source_word: וּ/בְ/צִיקְלָג
  choice: at sa Ziklag
  rationale: Ang parehong pormula ng listahan ay ipinahayag na “at sa.” Ang צִיקְלָג ay pangalan ng lugar kaya tinumbasan bilang “Ziklag.”
theological_decisions: []
translation_notes:
  register: Maikli, tuwiran, at marangal na modernong Tagalog. Pinanatili ang koordinasyong paulit-ulit ng tekstong Hebreo; ang “sa” ay likas na tumutugma sa lokatibong ב nang hindi kailangang pagpilian sa Tagalog ang English na “in” at “at.”
