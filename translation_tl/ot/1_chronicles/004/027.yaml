base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/027.yaml
  text: Shimei had sixteen sons and six daughters[a], but his brothers did not have many sons, and all their clans did not multiply as much as the sons of Judah.
translation:
  language: tl
  text: Si Simei ay nagkaroon ng labing-anim na anak na lalaki at anim na anak na babae. Ngunit hindi nagkaroon ng maraming anak na lalaki ang kanyang mga kapatid, at ang lahat ng kanilang mga angkan ay hindi umabot sa dami ng mga anak ni Juda.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ay hindi naging kasingdami ng mga anak ni Juda.”
    reason: Pinananatili ang alternatibong paghahayag ng paghahambing ng antas o dami sa עַד.
lexical_decisions:
- source_word: וּלְשִׁמְעִי
  choice: Si Simei ay nagkaroon
  rationale: Ang לְ sa pormulang pangtalaangkanan ay nagpapahayag ng pag-aari o pagkakaroon; natural itong isinasalin sa Filipino bilang “nagkaroon.” Ginamit ang karaniwang anyong Filipino na “Simei” para sa pangalan.
- source_word: בָּנִים שִׁשָּׁה עָשָׂר וּבָנוֹת שֵׁשׁ
  choice: labing-anim na anak na lalaki at anim na anak na babae
  rationale: Pinananatili ang eksaktong bilang at tahasang pagkakaiba ng mga anak na lalaki at babae, sa natural na ayos ng Filipino.
- source_word: וּלְאֶחָיו אֵין בָּנִים רַבִּים
  choice: Ngunit hindi nagkaroon ng maraming anak na lalaki ang kanyang mga kapatid
  rationale: Bagaman literal na “at” ang pang-ugnay, malinaw na pasalungat ang kaugnayan ng sugnay. Ang existential na אֵין kasama ng לְ ay natural na ipinahahayag bilang “hindi nagkaroon.”
- source_word: וְכֹל מִשְׁפַּחְתָּם
  choice: at ang lahat ng kanilang mga angkan
  rationale: Sa kontekstong talaangkanan, ang מִשְׁפָּחָה ay tumutukoy sa mas malawak na pangkat ng magkakamag-anak, kaya “angkan” ang mas angkop kaysa modernong nuklear na “pamilya.”
- source_word: לֹא הִרְבּוּ
  choice: hindi dumami
  rationale: Ipinahahayag ng Hiphil ng רבה rito ang pagdami o paglaki sa bilang; “dumami” ang malinaw at natural na katumbas sa Filipino.
- source_word: עַד בְּנֵי יְהוּדָה
  choice: nang gaya ng mga anak ni Juda
  rationale: 'Ang עַד ay nagpapahayag dito ng antas o sukat: hindi umabot ang kanilang bilang sa bilang ng mga inapo ni Juda. Pinananatili ng “mga anak ni Juda” ang anyong pangtalaangkanan ng Hebreo.'
