  to: Si Simei ay nagkaroon ng labing-anim na anak na lalaki at anim na anak na babae. Ngunit hindi nagkaroon ng maraming anak na lalaki ang kanyang mga kapatid, at ang lahat ng kanilang mga angkan ay hindi umabot sa dami ng mga anak ni Juda.[a]
