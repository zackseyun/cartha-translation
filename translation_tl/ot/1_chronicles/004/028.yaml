  text: They lived in Beer-sheba[a], Moladah[b], and Hazar-shual.
translation:
  language: tl
  text: Tumira sila sa Beer-seba[a], Molada, at Hazar-sual[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ding baybayin ang Beer-seba bilang “Beerseba.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ding isulat ang Hazar-sual bilang “Hazor-sual” o “Hazar Sual,” ayon sa tradisyon ng transliterasyon.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשְׁבוּ
  choice: Tumira sila
  rationale: Ang pandiwang יָשַׁב sa anyong wayyiqtol na maramihan ay tumutukoy sa paninirahan. Likas at malinaw sa modernong Tagalog ang “Tumira sila”; hindi nito ipinahihiwatig nang di-kailangan na sila ang unang nagtatag ng mga pamayanan.
- source_word: בִּבְאֵר שֶׁבַע
  choice: sa Beer-seba
  rationale: Pangalan ng lugar na isinalin sa baybay na madaling basahin sa Tagalog, sa halip na isalin ang kahulugan ng pangalan.
- source_word: וּמוֹלָדָה
  choice: Molada
  rationale: Isang pangalang pantangi ng lugar; pinanatili sa transliterasyong angkop sa bigkas at baybay sa Tagalog.
- source_word: וַחֲצַר שׁוּעָל
  choice: at Hazar-sual
  rationale: Pangalan ng lugar na may dalawang sangkap sa Hebreo. Ginamit ang gitling upang maipakitang iisang pangalan ito, at ang “sual” ay sumusunod sa karaniwang pag-angkop ng tunog na sh sa mga pangalang biblikal sa Tagalog.
