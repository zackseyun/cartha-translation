translation_notes:
  register: Gumamit ng payak, dignificado, at kasalukuyang Tagalog. Pinanatili bilang mga pangalang pantangi ang tatlong lugar at iniangkop lamang ang baybay sa mambabasang Tagalog. Inilagay ang ikalawang talababa sa Hazar-sual, ang pangalang tunay na tinutukoy ng tala.
