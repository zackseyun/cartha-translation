  yaml_path: translation/ot/1_chronicles/004/023.yaml
  text: These were the potters and the inhabitants of Netaim and Gederah[a]; they lived there with the king for his work.
translation:
  language: tl
  text: Sila ang mga magpapalayok at ang mga naninirahan sa Netaim at Gederah.[a] Nanirahan sila roon kasama ng hari para sa gawain ng hari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O maaaring: “Sila ang mga magpapalayok at ang mga naninirahan sa mga taniman at mga bakod o kulungan.” Ang mga salitang Hebreo na Netaim at Gederah ay maaaring unawain bilang mga pangalan ng lugar o bilang mga pangngalang pambalana.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵמָּה
  choice: Sila ang
  rationale: Tumutukoy ang panghalip sa pangkat na binanggit sa naunang talaangkanan; natural sa Filipino ang hulma na “Sila ang” sa sugnay na pagkakakilanlan.
- source_word: הַיּוֹצְרִים
  choice: mga magpapalayok
  rationale: Ang יצר ay tumutukoy rito sa mga manggagawang humuhubog ng luwad; “mga magpapalayok” ang tiyak at karaniwang kahulugan sa konteksto.
- source_word: וְיֹשְׁבֵי
  choice: at ang mga naninirahan sa
  rationale: Pinananatili nito ang nominal na diwa ng participle na tumutukoy sa mga permanenteng residente.
- source_word: נְטָעִים
  choice: Netaim
  rationale: Sa kontekstong heograpikal at talaangkanan, malamang na pangalan ito ng lugar, bagaman maaari rin itong mangahulugang “mga taniman”; inilalahad sa talababa ang tunay na kalabuan.
- source_word: וּגְדֵרָה
  choice: at Gederah
  rationale: Malamang na pangalan ito ng lugar na nakahanay sa Netaim, bagaman posible rin ang karaniwang kahulugang “pader” o “bakod”; pinananatili sa talababa ang alternatibo.
- source_word: עִם הַמֶּלֶךְ
  choice: kasama ng hari
  rationale: Tuwirang pinananatili ang karaniwang kahulugan ng עִם na “kasama,” nang hindi tahasang ginagawang “naglilingkod sa hari” ang ipinahihiwatig lamang ng konteksto.
- source_word: בִּמְלַאכְתּוֹ
  choice: upang gawin ang gawain nito
  rationale: Ang מְלָאכָה ay maaaring tumukoy sa gawain, hanapbuhay, o paglilingkod. Nililinaw ng “nito” na ang hari ang tinutukoy, habang hindi nililimitahan sa isang espesipikong uri ng paglilingkod.
- source_word: יָשְׁבוּ שָׁם
  choice: Doon sila nanirahan
  rationale: Natural na modernong Filipino para sa paninirahan sa tinukoy na lugar, at napapanatili ang diin ng שָׁם na “doon.”
