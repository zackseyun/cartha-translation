translation_notes:
  register: Modernong Filipino na natural at marangal. Ginamit ang “magpapalayok” sa halip na mas malawak na “mga manggagawa,” at pinanatili sa pangunahing teksto ang malamang na pagbasa sa Netaim at Gederah bilang mga pangalan ng lugar. Ang “kasama ng hari” ay sadyang literal upang hindi labis na tukuyin kung ang kaugnayan ay paninirahan, pagtatrabaho, o paglilingkod.
