  source_fidelity: Tumpak na naisalin ang sunod-sunod na kilos na וַיֵּלְכוּ bilang “Pumunta sila,” ang layuning ipinahahayag ng לְבַקֵּשׁ bilang “upang humanap,” at ang מִרְעֶה לְצֹאנָם bilang “pastulan para sa kanilang mga kawan.” Pinananatili ng “pasukan ng Gedor” ang pangunahing spatial na diwa ng לִמְבוֹא גְדֹר, at ang “hanggang sa silangang bahagi ng lambak” ay isang katanggap-tanggap na pagbasa ng pinagtatalunang/masinsing pariralang topograpiko.
