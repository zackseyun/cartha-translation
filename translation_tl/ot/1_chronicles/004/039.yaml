  text: וַ/יֵּלְכוּ֙ לִ/מְב֣וֹא גְדֹ֔ר עַ֖ד לְ/מִזְרַ֣ח הַ/גָּ֑יְא לְ/בַקֵּ֥שׁ מִרְעֶ֖ה לְ/צֹאנָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/039.yaml
  text: They went to the entrance of Gedor[a], as far as the east side of the valley[b], to seek pasture for their flocks.
translation:
  language: tl
  text: Pumunta sila sa pasukan ng Gedor[a], hanggang sa silangang bahagi ng lambak[b], upang humanap ng pastulan para sa kanilang mga kawan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa daanang papunta sa Gedor”; ang salitang Hebreo ay maaaring mangahulugang pasukan, daanang papasok, o lugar na nilalapitan upang makapasok.
    reason: lexical_alternative
  - marker: b
    text: O “sa silangan ng lambak” o “patungo sa silangan ng lambak”; maikli at maaaring unawain sa ilang paraan ang pariralang topograpiko sa Hebreo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: Pumunta sila
  rationale: Tuwirang nagsasaad ng kasunod na kilos sa salaysay; natural ito sa modernong Filipino.
- source_word: לִמְבוֹא
  choice: sa pasukan ng
  rationale: Ang מָבוֹא ay maaaring tumukoy sa pasukan, daanan papasok, o lapit sa isang lugar. Pinananatili ng “pasukan” ang pangunahing diwang heograpiko.
- source_word: גְדֹר
  choice: Gedor
  rationale: Pangalan ng lugar, kaya tinumbasan sa pamamagitan ng transliterasyon.
- source_word: עַד
  choice: hanggang sa
  rationale: Nagsasaad dito ng hangganang pangkalawakan, hindi ng tagal ng panahon.
- source_word: לְמִזְרַח הַגָּיְא
  choice: sa silangang bahagi ng lambak
  rationale: Natural na Filipino para sa maikling pariralang topograpiko, habang inilalahad sa talababa ang iba pang posibleng ugnayang pangkalawakan.
- source_word: לְבַקֵּשׁ
  choice: upang humanap
  rationale: Ipinahahayag ng infinitive ang layunin; ang “humanap” ay malinaw at likas sa kasalukuyang Filipino.
- source_word: מִרְעֶה
  choice: pastulan
  rationale: Tumutukoy sa lugar na mapagpapastulan o mapanginginainan ng mga alagang hayop.
- source_word: לְצֹאנָם
  choice: para sa kanilang mga kawan
  rationale: Maaaring saklawin ng צֹאן ang mga tupa at kambing; hindi nililimitahan ng “mga kawan” sa iisang uri ng hayop.
