  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “pastulan” at “mga kawan” bilang karaniwang bokabularyong pastoral, at pinanatili sa mga talababa ang tunay na kalabuan ng mga pariralang pangheograpiya.
