base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/031.yaml
  text: and in Beth-marcaboth[a], and in Hazar-susim, and in Beth-biri, and in Shaaraim[d][c][b]. These were their cities until David reigned.
translation:
  language: tl
  text: at sa Bet-markabot[a], sa Hazar-susim[b], sa Bet-biri[c], at sa Shaaraim[d]. Ang mga ito ang kanilang mga lungsod hanggang sa paghahari ni David.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Bet-markabot ay maaari ring isalin nang mas literal na “Bahay ng mga Karwahe,” ngunit dito ay itinuring itong pangalan ng lugar.
    reason: lexical_alternative
  - marker: b
    text: Ang Hazar-susim ay maaari ring isalin nang mas literal na “Bakuran ng mga Kabayo” o “Nayon ng mga Kabayo,” ngunit dito ay itinuring itong pangalan ng lugar.
    reason: lexical_alternative
  - marker: c
    text: Ang Bet-biri ay maaari ring isulat na “Bet-birei” sa transliterasyon.
    reason: alternative_reading
  - marker: d
    text: Maaaring ipinahihiwatig ng pinagmulan ng pangalang Shaaraim ang kahulugang “Dalawang Tarangkahan,” ngunit dito ay itinuring itong pangalan ng lugar.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְ/בֵית מַרְכָּבוֹת
  choice: at sa Bet-marcabot
  rationale: Pangalan ito ng lugar sa talaan ng mga pamayanan, kaya isinalin sa paraang transliterasyon sa halip na isalin ang mga bahagi nito bilang “Bahay ng mga Karwahe.”
- source_word: וּ/בַ/חֲצַר סוּסִים
  choice: Hazar-susim
  rationale: Itinuring itong pangalan ng lugar; pinanatili ang pangalan sa transliterasyon sa halip na piliin ang posibleng literal na kahulugang “Bakuran ng mga Kabayo” o “Nayon ng mga Kabayo.”
- source_word: וּ/בְ/בֵית בִּרְאִי
  choice: Bet-biri
  rationale: Pangalan ito ng lugar na kahilera ng ibang mga pangalan. Ang posibleng pagkakaiba sa pagbigkas o transliterasyon ay inilagay sa talababa.
- source_word: וּֽ/בְ/שַׁעֲרָיִם
  choice: at Saaraim
  rationale: Pinanatili bilang pangalan ng lugar. Hindi isinalin sa posibleng etimolohikal na kahulugang “Dalawang Tarangkahan,” sapagkat nasa talaan ito ng mga lungsod.
- source_word: אֵלֶּה עָרֵי/הֶם
  choice: Ang mga ito ang kanilang mga lungsod
  rationale: Tumutukoy ang demonstratibo sa mga naunang binanggit na lugar. Ang “mga lungsod” ay tuwirang katumbas ng עָרִים at angkop sa pormal na konteksto ng Cronica.
- source_word: עַד מְלֹךְ דָּוִיד
  choice: hanggang sa paghahari ni David
  rationale: Ipinahahayag nito ang hangganang panahunan nang hindi labis na tinutukoy kung simula lamang o buong panahon ng paghahari ang nasa isip.
theological_decisions: []
translation_notes:
  register: Makabago ngunit marangal na Filipino. Pinanatili sa transliterasyon ang mga pangalan ng lugar, gamit ang baybay na madaling basahin ng Tagalog. Hindi inulit ang “sa” bago sa bawat pangalan dahil natural sa Filipino na saklawin nito ang magkakasunod na talaan, habang pinanatili ang pang-ugnay na “at” sa simula at bago sa huling pangalan.
