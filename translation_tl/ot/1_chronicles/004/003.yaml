base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/003.yaml
  text: 'These were the sons of the father of Etam: Jezreel[a], Ishma, and Idbash[b]; and the name of their sister was Hazzelelponi.'
translation:
  language: tl
  text: Ito ang mga anak ng ama ng Etam:[a] sina Jezreel, Isma, at Idbas; at ang pangalan ng kapatid nilang babae ay Hazelelponi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “Ito ang ama ng Etam,” ngunit ang isahang “ama” ay kasunod ng pangmaramihang “ito” at ng talaan ng mga pangalan. Kaya isinasalin dito ang mga pangalan bilang “mga anak” ng ama ng Etam. Ang “ama ng Etam” ay maaari ring tumukoy sa ninuno o tagapagtatag ng Etam.
    reason: textual_and_lexical_ambiguity
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Ito ang
  rationale: Ipinakikilala ng parirala ang susunod na talaangkanan. Hindi na kailangang isalin nang hiwalay ang panimulang pangatnig upang maging natural sa makabagong Tagalog.
- source_word: אֲבִי עֵיטָם
  choice: ama ng Etam
  rationale: Pinananatili nito ang tuwirang kahulugan ng konstruktong Hebreo. Sa mga talaangkanan ng Cronica, ang ‘ama’ ay maaari ring tumukoy sa ninuno o tagapagtatag, kaya inilalahad sa talababa ang saklaw ng kahulugan.
- source_word: יִזְרְעֶאל
  choice: Jezreel
  rationale: Karaniwang transliterasyon sa Filipino ng pangalang pantangi.
- source_word: וְיִשְׁמָא
  choice: Isma
  rationale: Transliterasyong angkop sa bigkas at baybay ng Filipino, nang hindi idinaragdag ang tunog na wala sa anyong Hebreo.
- source_word: וְיִדְבָּשׁ
  choice: at Idbas
  rationale: Isinasalin ang pangatnig at itinatranslitera ang pangalang pantangi ayon sa likas na baybay sa Filipino.
- source_word: וְשֵׁם אֲחוֹתָם
  choice: at ang pangalan ng kapatid nilang babae ay
  rationale: Malapit ito sa nominal na pahayag ng Hebreo at malinaw na ipinahihiwatig ng ‘nilang’ na ang babae ay kapatid ng tatlong lalaking nabanggit.
- source_word: הַצְלֶלְפּוֹנִי
  choice: Hazelelponi
  rationale: Transliterasyong madaling basahin sa Filipino at kumakatawan sa mga katinig ng pangalang Hebreo nang hindi pinananatili ang dobleng katinig na hindi karaniwan sa ortograpiyang Filipino.
theological_decisions: []
translation_notes:
  register: Gumamit ng natural ngunit marangal na makabagong Tagalog. Pinanatili ang mga pangalang pantangi sa anyong madaling basahin ng karaniwang mambabasang Filipino. Ang salitang ‘mga anak’ ay ipinahiwatig upang maging maayos ang sintaks at ugnayan ng mga tauhan, habang tahasang pinananatili sa talababa ang anomalya at mas malawak na kahulugan ng tekstong Hebreo.
