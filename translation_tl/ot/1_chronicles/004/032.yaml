base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/032.yaml
  text: And their settlements were Etam[a], Ain, Rimmon, Tochen, and Ashan—five cities.
translation:
  language: tl
  text: At ang kanilang mga pamayanan[a] ay Etam, Ain, Rimon, Token, at Asan—limang lunsod.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga nayon.” Ang salitang Hebreo ay maaaring tumukoy sa maliliit na pamayanan o sa mga tirahang napaliligiran ng bakod o pader.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַצְרֵיהֶם
  choice: kanilang mga pamayanan
  rationale: Ang חָצֵר ay maaaring tumukoy sa pamayanan, nayon, o nakukulong na tirahan. Ang “mga pamayanan” ay likas at sapat na malawak sa modernong Filipino para sa talaang heograpikal na ito.
- source_word: עֵיטָם
  choice: Etam
  rationale: Pangalan ng lugar; tinumbasan sa paraang transliterasyon.
- source_word: עַיִן
  choice: Ain
  rationale: Sa konteksto, pangalan ito ng lugar sa talaan ng mga lunsod, hindi ang karaniwang pangngalang nangangahulugang “mata” o “bukal.”
- source_word: רִמּוֹן
  choice: Rimon
  rationale: Pangalan ng lugar; pinanatili bilang transliterasyon sa Filipino, bagaman ang karaniwang pangngalan ay maaaring mangahulugang “granada.”
- source_word: תֹכֶן
  choice: Token
  rationale: Pangalan ng lugar; ang “Token” ay tuwirang transliterasyon ng mga katinig at patinig sa anyong Hebreo.
- source_word: עָשָׁן
  choice: Asan
  rationale: Pangalan ng lugar; transliterasyong angkop sa karaniwang ortograpiyang Filipino.
- source_word: עָרִים חָמֵשׁ
  choice: limang lunsod
  rationale: Karaniwang nangangahulugan ang עִיר ng lunsod o bayan. Pinananatili ng “limang lunsod” ang karaniwang leksikal na diwa at ang pangwakas na bilang ng mga lugar.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “pamayanan” bilang malawak at natural na katumbas; ang mga pangalan ng lugar ay iniangkop sa ortograpiyang Filipino. Ang panandang [a] ay inilagay agad pagkatapos ng Etam upang tumugma sa ibinigay na lokasyon ng talababa, bagaman ang leksikal na paliwanag ay tumutukoy sa “mga pamayanan.”
