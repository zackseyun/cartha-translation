revisions:
- from: Isinilang ni Naara para sa kanya sina Ahuzam, Hefer, Temeni[a], at Haahastari[b]. Sila ang mga anak na lalaki ni Naara.
  to: Ipinanganak ni Naara sa kaniya sina Ahuzam, Hefer, Temeni[a], at Haahashtari[b]. Sila ang mga anak na lalaki ni Naara.
  rationale: Pinalitan ang “para sa kanya” ng “sa kaniya” upang maging mas natural ang genealogical na konstruksyon at mapanatili ang tungkulin ng לוֹ. Itinama ang Haahashtari upang katawanin ang shin (שׁ) bilang “sh,” at inayon ang talababa rito. Nananatili ang mga footnote anchor sa Temeni at Haahashtari, ang mismong mga pangalang tinatalakay ng mga talababa.
