translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang payak na pormula ng talaangkanan at mga pangalang may baybay na angkop sa Filipino. Inilipat ang marker [a] sa Temeni sapagkat ang nilalaman ng talababa ay tumutukoy sa pangalang iyon; nanatili ang [b] sa Haahastari.
