base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/006.yaml
  text: Naarah bore to him Ahuzzam[a], Hepher, Temeni, and Haahashtari[b]. These were the sons of Naarah.
translation:
  language: tl
  text: Ipinanganak ni Naara sa kaniya sina Ahuzam, Hefer, Temeni[a], at Haahashtari[b]. Sila ang mga anak na lalaki ni Naara.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring unawain ang Temeni bilang pangalang may diwang pang-uri, gaya ng “taga-Teman” o “taga-timog,” ngunit itinuturing dito na personal na pangalan dahil nasa talaangkanan ito.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin-sulat ang Haahashtari bilang “Ahashtari.” May paunang pantukoy ang anyong Hebreo, at maaaring naging nakapirming bahagi iyon ng pangalan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּלֶד
  choice: Isinilang
  rationale: Tuwirang ipinapahayag ng pandiwa ang panganganak ni Naara bilang ina at angkop ito sa maikling pormula ng talaangkanan.
- source_word: לוֹ
  choice: para sa kanya
  rationale: Pinananatili ang pagtukoy sa lalaking magulang nang hindi ipinapasok ang pangalan nito mula sa naunang talata.
- source_word: נַעֲרָה
  choice: Naara
  rationale: Isinalin-sulat ang pangalang pantangi ayon sa likas na baybay at bigkas sa Filipino; hindi na kinakatawan ng h ang tahimik na hulíng ה.
- source_word: אֶת ... וְאֶת ...
  choice: sina ... at
  rationale: Ang paulit-ulit na pananda ng tuwirang layon ay likas na ipinahahayag sa Filipino sa pamamagitan ng pantukoy na “sina” at ng pagkakasunod-sunod ng mga pangalan.
- source_word: אֲחֻזָּם
  choice: Ahuzam
  rationale: Isinalin-sulat bilang pangalang pantangi sa baybay na madaling basahin sa Filipino; hindi kailangang katawanin ng dobleng z ang Hebrew consonant doubling.
- source_word: חֵפֶר
  choice: Hefer
  rationale: Ginamit ang f upang katawanin ang Hebrew פ sa pangalang ito at maiwasan ang baybay-Ingles na “ph.”
- source_word: תֵּימְנִי
  choice: Temeni
  rationale: Itinuring itong personal na pangalan dahil bahagi ito ng listahan ng mga anak, habang pinananatili sa talababa ang posibleng pang-uring diwa nito.
- source_word: הָאֲחַשְׁתָּרִי
  choice: Haahastari
  rationale: Pinanatili ang paunang “Ha-” na nasa anyong Hebrew at isinalin-sulat ang שׁ bilang s para sa likas na baybay sa Filipino.
- source_word: אֵלֶּה
  choice: Sila
  rationale: Natural na panghalip sa Filipino para lagumin ang mga lalaking kapapangalan pa lamang.
- source_word: בְּנֵי
  choice: mga anak na lalaki ni
  rationale: Tiyak na ipinahahayag ang panlalaking kahulugan ng בְּנֵי sa kontekstong talaangkanan sa halip na palawakin ito bilang mga anak sa pangkalahatan.
