  naturalness: Marangal at madaling unawain ang register. Mas natural at mas malinaw ang “samahan nawa ako ng iyong kamay” kaysa “Samahan mo ako ng iyong makapangyarihang kamay,” na medyo hindi likas ang pagkakabit at nagdaragdag ng “makapangyarihang,” na wala sa mismong teksto.
  terminology: Ang “Diyos ng Israel,” “nasasakupan,” “kapahamakan,” at “ipinagkaloob” ay angkop. Pinanatili ang “kamay” bilang mahalagang idyomatikong larawan nang hindi dinaragdagan ng paliwanag sa pangunahing teksto.
