  to: 'At nanalangin si Jabez sa Diyos ng Israel: “Pagpalain mo sana ako nang lubos[a] at palawakin mo ang aking nasasakupan. Samahan nawa ako ng iyong kamay, at ilayo mo ako sa kapahamakan[b] upang hindi ako makaranas ng sakit.[c]” At ipinagkaloob ng Diyos ang hiniling niya.'
