  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יִּקְרָ֣א יַ֠עְבֵּץ לֵ/אלֹהֵ֨י יִשְׂרָאֵ֜ל לֵ/אמֹ֗ר אִם בָּרֵ֨ךְ תְּבָרֲכֵ֜/נִי וְ/הִרְבִּ֤יתָ אֶת גְּבוּלִ/י֙ וְ/הָיְתָ֤ה יָדְ/ךָ֙ עִמִּ֔/י וְ/עָשִׂ֥יתָ מֵּ/רָעָ֖ה לְ/בִלְתִּ֣י עָצְבִּ֑/י וַ/יָּבֵ֥א אֱלֹהִ֖ים אֵ֥ת אֲשֶׁר שָׁאָֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/010.yaml
  text: And Jabez called on the God of Israel[a], saying, “If you would indeed bless me and enlarge my territory, and let your hand be with me[b], and keep me from harm so that I may not suffer pain!” And God granted what he asked.
translation:
  language: tl
  text: 'At nanalangin si Jabez sa Diyos ng Israel: “Pagpalain mo sana ako nang lubos[a] at palawakin mo ang aking nasasakupan. Samahan nawa ako ng iyong kamay, at ilayo mo ako sa kapahamakan[b] upang hindi ako makaranas ng sakit.[c]” At ipinagkaloob ng Diyos ang hiniling niya.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “Kung pagpapalain mo nga ako.” Ang anyong Hebreo ay isang mariing kahilingan o paghahangad.
    reason: source_ambiguity
  - marker: b
    text: Maaari ring isalin na “sa kasamaan.” Ang Hebreong רָעָה ay maaaring tumukoy sa moral na kasamaan o sa nakapipinsalang kasawian; sa kontekstong ito, mas malamang ang kapahamakan.
    reason: lexical_alternative
  - marker: c
    text: Ang pananalitang “makaranas ng sakit” ay umaalingawngaw sa paliwanag sa pangalan ni Jabez sa naunang talata.
    reason: cross_reference
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: nanalangin
  rationale: Sa kontekstong ito, ang pagtawag ni Jabez sa Diyos ay isang taimtim na pagdalangin. Mas likas ito sa makabagong Tagalog kaysa sa literal na “tumawag.”
- source_word: אִם בָּרֵךְ תְּבָרֲכֵנִי
  choice: Pagpalain mo sana ako nang lubos
  rationale: Ang infinitive absolute na kasunod ng pandiwa ay nagpapasidhi sa kahilingan. Ipinahahayag ng “sana” ang taimtim na paghahangad, at ng “nang lubos” ang diin ng Hebreo.
- source_word: וְהִרְבִּיתָ אֶת גְּבוּלִי
  choice: at palawakin ang aking nasasakupan
  rationale: Ang גְּבוּל ay hangganan o teritoryo. Ang “nasasakupan” ay natural na tumutukoy sa lupaing saklaw ni Jabez nang hindi ito ginagawang makabagong metapora tungkol sa impluwensiya.
- source_word: וְהָיְתָה יָדְךָ עִמִּי
  choice: Samahan mo ako ng iyong makapangyarihang kamay
  rationale: Pinananatili ang larawan ng kamay ng Diyos bilang kapangyarihan at tulong, habang nililinaw sa natural na Tagalog ang kahulugan ng idyoma.
- source_word: וְעָשִׂיתָ מֵּרָעָה
  choice: at ilayo mo ako sa kapahamakan
  rationale: Pinaikli at mahirap ang Hebreong pananalita. Dahil sinusundan ito ng layuning huwag makaranas ng sakit, malamang na tumutukoy ang רָעָה sa nakapipinsalang kasawian; pinananatili sa talababa ang alternatibong “kasamaan.”
- source_word: לְבִלְתִּי עָצְבִּי
  choice: upang hindi ako makaranas ng sakit
  rationale: Ipinahahayag nito ang sakit o dalamhati at inuulit ang diwa ng paliwanag sa pangalan ni Jabez sa naunang talata.
- source_word: וַיָּבֵא אֱלֹהִים אֵת אֲשֶׁר שָׁאָל
  choice: At ipinagkaloob ng Diyos ang kanyang hiniling
  rationale: Ang idyomang may בוא ay nangangahulugang pinangyari o ibinigay ng Diyos ang kahilingan; natural at tumpak ang “ipinagkaloob.”
theological_decisions:
- issue: Kahulugan ng pinalawak na גְּבוּל
  choice: Isinalin bilang literal na “nasasakupan,” na tumutukoy sa teritoryo o lupaing saklaw.
  alternative: “lawak ng impluwensiya”
  rationale: Teritoryal ang pinakanatural na kahulugan ng Hebreo. Iniiwasan nitong ipasok sa teksto ang prosperity theology o isang makabagong espirituwal na metapora.
- issue: Kahulugan ng רָעָה sa panalangin
  choice: “kapahamakan” sa pangunahing teksto
  alternative: “kasamaan”
  rationale: Sa pagkakaugnay nito sa sakit, malamang na tumutukoy ito sa nakapipinsalang pangyayari o kasawian. Gayunman, maaari ring mangahulugan ng moral na kasamaan ang salita, kaya nakatala ang alternatibo sa talababa.
- issue: Larawan ng kamay ng Diyos
  choice: Pinanatili ang “kamay” at nilinaw ang ipinahihiwatig nitong kapangyarihan.
  alternative: Isalin lamang bilang “tulungan mo ako”
  rationale: Mahalagang larawan sa Hebreo ang kamay ng Diyos. Ang saling ito ay nagpapanatili sa larawan nang hindi ipinahihiwatig na pisikal na kamay lamang ang tinutukoy.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “nanalangin” para sa konteksto ng pag-apela sa Diyos at “nasasakupan” para sa teritoryal na diwa. Pinanatili ang mahalagang larawang “kamay” ngunit nilinaw ang idyomatikong kahulugan nito.
