base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/019.yaml
  text: And the sons of the wife of Hodiah[a], the sister of Naham[b], were the father of Keilah the Garmite and Eshtemoa the Maacathite.
translation:
  language: tl
  text: At ang mga anak ng asawa ni Hodia—ang kapatid na babae ni Naham—ay ang ama[a] ni Keila na Garmita at ni Estemoa na Maacatita.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa mga talaangkanan, ang “ama” ay maaari ring mangahulugang ninuno, tagapagtatag, o pinuno ng isang angkan o pamayanan, hindi lamang tuwirang ama.
    reason: lexical_alternative
  - marker: b
    text: “Mga anak” ang maramihan sa Hebreo, ngunit “ama” ang isahan. Siksik ang pagkakabuo ng pangungusap at maaaring nagbubuod ito ng ugnayan ng mga angkan, hindi lamang ng payak na sunod-sunod na ama at anak.
    reason: cultural_note
lexical_decisions:
- source_word: וּבְנֵי
  choice: At ang mga anak ng
  rationale: Pinananatili ang karaniwang kahulugan na “mga anak,” bagaman maaari rin itong tumukoy nang mas malawak sa mga inapo sa talaangkanan.
- source_word: אֵשֶׁת הוֹדִיָּה
  choice: asawa ni Hodia
  rationale: Ipinahahayag ng anyong construct ang ugnayang “asawa ni Hodia.” Sa konteksto, ang tinutukoy ay ang babaeng asawa, gaya ng nililinaw ng kasunod na “kapatid na babae.”
- source_word: אֲחוֹת נַחַם
  choice: na kapatid na babae ni Naham
  rationale: Malinaw at natural na tinutukoy nito nang higit ang asawa ni Hodia.
- source_word: אֲבִי
  choice: ay ang ama
  rationale: Pinananatili ang literal na isahang “ama” kahit maramihan ang simuno. Sa mga talaangkanan, maaari itong mangahulugang ama, ninuno, tagapagtatag, o pinuno ng angkan.
- source_word: קְעִילָה
  choice: Keila
  rationale: Transliterasyon ng pangalang Hebreo nang hindi ipinapasiya kung tao, angkan, o pamayanang kaugnay ng lugar ang tinutukoy.
- source_word: הַגַּרְמִי
  choice: na Garmita
  rationale: Ginagamit ang natural na anyong Filipino para sa katawagang pang-angkan o pangkat, nang hindi ito ginagawang tahasang “inapo ni Garm.”
- source_word: וְאֶשְׁתְּמֹעַ
  choice: at ni Estemoa
  rationale: Transliterasyon ng pangalan; inuugnay ito ng pangatnig bilang ikalawang katawagang nasa ilalim ng “ama.”
- source_word: הַמַּעֲכָתִי
  choice: na Maacatita
  rationale: Pinananatili bilang katawagang pang-angkan o pangkat sa natural na anyong Filipino.
theological_decisions:
- issue: Hindi pagtutugma ng maramihang “mga anak” at isahang “ama”
  choice: Pinanatili sa pangunahing teksto ang “mga anak … ay ang ama.”
  alternative: Ipaliwanag bilang “ang mga inapo … ang naging mga pinuno/tagapagtatag.”
  rationale: Ang Hebreo ay siksik at hindi karaniwan ang balangkas. Ang pag-aayos ng bilang o pagpapalit sa “tagapagtatag” ay maaaring tahimik na magpasya sa isang ugnayang pang-angkan na nananatiling malabo sa pinagmulan.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Pinanatili ang kapansin-pansing di-pagtutugma ng bilang sa Hebreo upang hindi sapilitang linawin ang malabong talaangkanan; ipinaliwanag ito sa talababa. Ang mga pangalan at katawagang pang-angkan ay isina-Filipinong transliterasyon.
