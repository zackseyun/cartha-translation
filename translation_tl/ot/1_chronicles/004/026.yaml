base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/026.yaml
  text: 'The sons of Mishma: Hammuel his son, Zaccur his son, Shimei his son.'
translation:
  language: tl
  text: 'Ang mga anak ni Misma: si Hamuel na anak ni Misma, si Zacur na anak ni Hamuel, at si Simei na anak ni Zacur.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי
  choice: Ang mga anak ni
  rationale: Ang בְנֵי ay construct plural na nangangahulugang “mga anak ni.” Hindi na tahasang isinalin ang prefixed conjunction na וּ upang maging natural ang talaang genealogical sa Tagalog.
- source_word: מִשְׁמָע
  choice: Misma
  rationale: Pangalang pantangi; tinumbasan ayon sa bigkas ng Hebreo at sa likas na baybay sa Tagalog.
- source_word: חַמּוּאֵל
  choice: Hamuel
  rationale: Pangalang pantangi; ang “Hamuel” ay natural na transliterasyon sa Tagalog ng anyong Masoretiko.
- source_word: בְּנוֹ
  choice: na anak niya / na anak nito
  rationale: Tuwirang nangangahulugang “anak niya.” Ginamit ang “nito” sa mga sumunod na salinlahi upang malinaw na ang tinutukoy ay ang pangalang kaagad na nauna.
- source_word: זַכּוּר
  choice: Zacur
  rationale: Pangalang pantangi; pinanatili ang tunog ng Hebreo sa baybay na madaling basahin sa Tagalog.
- source_word: שִׁמְעִי
  choice: Simei
  rationale: Pangalang pantangi; transliterasyong angkop sa makabagong Tagalog at malapit sa Hebreong vocalization.
