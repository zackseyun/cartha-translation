translation_notes:
  register: Maikli at marangal na estilong genealogical. Ginamit ang “si” bago ang mga pangalan at ang “nito” upang malinaw ang sunod-sunod na ugnayang ama-anak nang hindi dinaragdagan ang kahulugan ng tekstong Hebreo.
