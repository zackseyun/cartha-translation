  text: וְ/זִיזָ֨א בֶן שִׁפְעִ֧י בֶן אַלּ֛וֹן בֶּן יְדָיָ֥ה בֶן שִׁמְרִ֖י בֶּן שְׁמַֽעְיָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/037.yaml
  text: and Ziza son of Shiphi[a], son of Allon, son of Jedaiah, son of Shimri, son of Shemaiah.
translation:
  language: tl
  text: at si Ziza na anak ni Sifi, na anak ni Allon, na anak ni Jedaias, na anak ni Simri, na anak ni Semaias.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/זִיזָא
  choice: at si Ziza
  rationale: Isinalin ang pang-ugnay na וְ bilang “at” upang ipagpatuloy ang talaan. Isinatinig ang personal na pangalan bilang “Ziza,” ayon sa anyong Hebreo na nagtatapos sa aleph.
- source_word: בֶן
  choice: na anak ni
  rationale: Sa talaangkanan, malinaw at likas sa modernong Tagalog ang “na anak ni.” Inulit ito upang mapanatili ang sunod-sunod na ugnayang makikita sa Hebreo.
- source_word: שִׁפְעִי
  choice: Sifi
  rationale: Isinatinig ang personal na pangalan sa paraang madaling basahin ng nagsasalita ng Tagalog, gamit ang “S” para sa shin at “f” para sa pe na may dagesh-less pronunciation.
- source_word: אַלּוֹן
  choice: Allon
  rationale: Personal na pangalan ito sa konteksto, kaya isinatinig at hindi isinaling “punong ensina.” Pinanatili ang dobleng l upang masundan ang katinig ng Hebreo.
- source_word: יְדָיָה
  choice: Jedaias
  rationale: Ginamit ang pamilyar at madaling basahing anyo sa tradisyong Filipino para sa pangalang Hebreo, habang pinananatili ang pagkakakilanlan nito bilang personal na pangalan.
- source_word: שִׁמְרִי
  choice: Simri
  rationale: Isinatinig sa natural na ortograpiyang Filipino; ang Hebreong shin ay kinakatawan ng “S” sa halip na ng di-karaniwang “Sh” sa mga salitang Filipino.
- source_word: שְׁמַעְיָה
  choice: Semaias
  rationale: Ginamit ang natural at nakikilalang anyong Filipino ng pangalan, na umaangkop sa ortograpiya at pagbigkas ng Tagalog.
theological_decisions: []
translation_notes:
  register: Payak ngunit marangal na wikang pang-talaangkanan. Pinanatili ang pag-uulit ng “na anak ni” upang maging malinaw ang bawat salinlahi at manatiling malapit sa estruktura ng Hebreo. Walang idinagdag na pantukoy sa kasarian o interpretasyong hindi tahasang kailangan ng teksto.
