  naturalness: Natural at marangal ang pangkalahatang Filipino. Mas pare-pareho sa modernong baybay-Filipino ang “Leka” kaysa “Leca.” Ang “mga angkan ng sambahayan ng mga manggagawa ng pinong lino” ay katanggap-tanggap na paraan upang ilahad ang siksik na pariralang Hebreo.
  terminology: Ang “mga angkan,” “sambahayan,” at “pinong lino” ay angkop sa talaang pangangkanan at sa terminong בּוּץ. Ang mga pangalang Sela, Juda, Laada, Maresa, at Bet-Asbea ay angkop na mga transliterasyon sa Filipino.
