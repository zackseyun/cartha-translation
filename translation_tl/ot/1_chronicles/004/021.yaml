  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “angkan” at “sambahayan” upang mapanatili ang katangiang pangangkanan at pangkat-gawain ng talata nang hindi labis na ipinapaliwanag ang siksik na sintaks ng Hebreo.
