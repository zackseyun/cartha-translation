base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/021.yaml
  text: 'The sons of Shelah son of Judah: Er the father of Lecah[a], and Laadah the father of Mareshah, and the clans of the house of linen workers of the house of Ashbea.'
translation:
  language: tl
  text: 'Ang mga anak ni Sela na anak ni Juda: si Er, na ama ng Leka, at si Laada, na ama ng Maresa, at ang mga angkan ng sambahayan ng mga manggagawa ng pinong lino sa Bet-Asbea.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Siksik at maaaring unawain sa iba’t ibang paraan ang pariralang Hebreo. Maaari ring isalin ang huling bahagi: “ang mga angkan ng sambahayan ng paggawa ng pinong lino, ng Bet-Asbea.” Ang “ama ng” ay maaari ring mangahulugang “ninuno ng” o “tagapagtatag ng.”'
    reason: Pinananatili ang kalabuan ng Hebreo sa kaugnayan ng mga angkan, ng gawaing pinong lino, at ng Bet-Asbea, gayundin ang mas malawak na kahulugan ng אֲבִי.
lexical_decisions:
- source_word: בְּנֵי
  choice: mga anak
  rationale: Pinananatili ang tahasang wikang pangangkanan ng Hebreo; sa ganitong talaan maaari rin itong tumukoy sa mga inapo.
- source_word: שֵׁלָה בֶן יְהוּדָה
  choice: Sela na anak ni Juda
  rationale: Natural na Filipino habang malinaw na pinananatili ang ugnayang pangangkanan.
- source_word: אֲבִי
  choice: ama ng
  rationale: Ito ang tuwirang katumbas, ngunit sa talaang pangangkanan o pamayanan maaari rin itong mangahulugang ninuno o tagapagtatag; nililinaw ito sa talababa.
- source_word: לֵכָה
  choice: Leca
  rationale: Transliterasyon ng pangalan ayon sa bigkas na angkop sa Filipino.
- source_word: לַעְדָּה
  choice: Laada
  rationale: Transliterasyon ng personal na pangalan sa natural na baybay-Filipino.
- source_word: מָרֵשָׁה
  choice: Maresa
  rationale: Transliterasyon ng pangalan ng lugar o angkan sa natural na baybay-Filipino.
- source_word: מִשְׁפְּחוֹת
  choice: mga angkan
  rationale: Mas angkop kaysa “mga pamilya” para sa malalawak na pangkat na magkakamag-anak sa kontekstong pantribo at pangangkanan.
- source_word: בֵּית
  choice: sambahayan
  rationale: Ipinahahayag ang isang angkan o organisadong pangkat, hindi lamang isang pisikal na bahay.
- source_word: עֲבֹדַת הַבֻּץ
  choice: mga manggagawa ng pinong lino
  rationale: Inilalahad ang hanapbuhay at ang posibleng diwa ng בּוּץ bilang pinong lino.
- source_word: לְבֵית אַשְׁבֵּעַ
  choice: na kabilang sa sambahayan ni Asbea
  rationale: Pinananatili ang kaugnayan sa “sambahayan ni Asbea” nang hindi tiyak na ginagawang pangalan ng lugar ang parirala.
