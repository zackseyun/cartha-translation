  - severity: low
    issue: Hindi pare-pareho ang baybay na “Leca” sa layuning natural na baybay-Filipino.
    rationale: Mas malinaw na kumakatawan ang “Leka” sa tunog /k/ at umaayon sa iba pang isina-Filipinong transliterasyon sa draft.
