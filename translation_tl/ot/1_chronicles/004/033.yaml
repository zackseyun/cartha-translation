translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “lungsod,” “nayon,” at “tirahan” upang mapanatili ang pagkakaiba ng mga terminong heograpiko; pinanatili ang Baal bilang pangalan ng lugar.
