base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/033.yaml
  text: And all their villages that were around these cities, as far as Baal—these were their settlements, and they had their genealogy recorded.
translation:
  language: tl
  text: At ang lahat ng kanilang mga nayon[a] na nasa palibot ng mga lungsod na ito, hanggang sa Baal—ito ang kanilang mga pamayanan, at nagpatala sila ayon sa kanilang talaangkanan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “maliliit na pamayanan” o “mga pamayanan.”
    reason: lexical_alternative
  - marker: b
    text: O “at ang kanilang talaangkanan ay naitala.” Ang Hebreong pananalita ay tumutukoy sa pagpapatalang ayon sa talaangkanan.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַצְרֵיהֶם
  choice: kanilang mga nayon
  rationale: Sa konteksto ng mga pook na nakapalibot sa mga lungsod, ang חָצֵר ay tumutukoy sa maliliit na pamayanan o nayon, hindi sa literal na bakuran.
- source_word: אֲשֶׁר סְבִיבוֹת הֶעָרִים הָאֵלֶּה
  choice: na nasa palibot ng mga lungsod na ito
  rationale: Natural at malinaw nitong ipinahahayag ang lokasyon ng mga nayon kaugnay ng naunang binanggit na mga lungsod.
- source_word: עַד בָּעַל
  choice: hanggang sa Baal
  rationale: Ang עַד ay nagsasaad ng hangganan o lawak, at ang בָּעַל ay pinananatiling pangalan ng lugar.
- source_word: זֹאת מוֹשְׁבֹתָם
  choice: ang mga ito ang kanilang mga tirahan
  rationale: Bagaman pormal na isahan ang זֹאת, ginagamit ito rito bilang panlahatang pagtukoy sa naunang listahan; ang maramihang 'mga ito' ay natural sa Tagalog. Ang מוֹשָׁב ay lugar na tinitirhan o pamayanan.
- source_word: וְהִתְיַחְשָׂם לָהֶם
  choice: at nagpatala sila ayon sa kanilang angkan
  rationale: Ang Hitpael ng יחס ay tumutukoy sa pagtatala o pagpapatunay batay sa talaangkanan. Pinananatili ng salin ang aktibong anyo at ang bahagyang siksik na diwa ng Hebreo.
