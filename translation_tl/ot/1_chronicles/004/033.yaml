    issue: “mga tirahan” para sa מוֹשְׁבֹתָם
    rationale: Bagaman maaaring tumukoy ang termino sa mga lugar na tinitirhan, ang konteksto ay talaan ng mga pook at pamayanan. Ang “mga pamayanan” ay mas tumpak at hindi nagpapahiwatig lamang ng mga bahay o personal na tirahan.
  - severity: low
    issue: “angkan” sa sugnay ng genealogical registration
    rationale: Ang “angkan” ay mas malawak na katagang pampamilya. Ang “talaangkanan” ay mas tuwirang nagpapahayag ng batayan ng pagpapatala na nasa Hebreong יחס.
  - severity: low
    issue: Hindi ganap na tugma ang alternatibong salin sa talababa b sa aktibong pangunahing salin
    rationale: Ang “itinala ang kanilang talaangkanan” ay nagpapalit sa ipinahihiwatig na pagpapatala ng mga tao tungo sa simpleng pagtatala ng dokumento. Mas mainam na magbigay ng alternatibong nagpapanatili sa genealogical enrollment.
