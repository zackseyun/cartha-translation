  naturalness: Likas at malinaw ang pangungusap na “At ang mga anak ni Hela ay sina …” para sa talaan ng angkan. Inilipat ang talababa tungkol sa saklaw ng “mga anak ni” upang nakapulupot ito sa mismong pariralang ipinaliliwanag, sa halip na sa hulíng pangalan ng talaan.
