translation:
  language: tl
  text: At ang mga anak ni Hela[a][b] ay sina Zeret, Yitshar, at Etnan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring baybayin ang pangalan bilang “Hele,” depende sa paraan ng transliterasyon.
    reason: lexical_alternative
  - marker: b
    text: Sa mga talaan ng angkan sa Hebreo, ang “mga anak ni” ay maaaring tumukoy sa mga tuwirang anak o, sa mas malawak na diwa, sa mga inapo sa isang linya ng pamilya.
    reason: cultural_note
lexical_decisions:
- source_word: וּ/בְנֵי
  choice: At ang mga anak ni
  rationale: Pinananatili ng “At” ang payak na ugnayang ipinahihiwatig ng וּ; ang “mga anak ni” ang likas na salin ng pormulang pangangkan na בְנֵי, na maaaring tumukoy sa mga tuwirang anak o, sa ganitong talaan, sa mga inapo.
- source_word: חֶלְאָה
  choice: Hela
  rationale: Pangngalang pantangi ito, kaya tinumbasan sa baybay na madaling basahin sa Filipino; ang huling patinig ay kumakatawan sa anyong Hebreo ng pangalan.
- source_word: צֶרֶת
  choice: Zeret
  rationale: Tuwirang transliterasyon sa Filipino; ang huling ת ay kinakatawan ng “t,” hindi ng kombensiyong Ingles na “th.”
- source_word: יצחר
  choice: Izhar
  rationale: Isinunod sa ibinigay na anyong Hebreo at sa kinikilalang transliterasyon ng pangalan; ang “zh” ay iniiwasan at pinananatili ang “z-h” na pagkakasunod sa baybay na Izhar.
- source_word: וְ/אֶתְנָן
  choice: at Etnan
  rationale: Ang prefiks na וְ ay likas na “at” sa huling pangalan ng talaan; ang pangalan ay isinalin sa baybay-Filipino bilang Etnan.
theological_decisions:
- issue: Saklaw ng pormulang pangangkan na “mga anak ni”
  choice: Pinanatili sa pangunahing teksto ang literal na “mga anak ni,” na may paliwanag sa talababa na maaari rin itong tumukoy sa mga inapo.
  alternative: Isalin agad bilang “mga inapo ni.”
  rationale: Hindi tiyak sa pormulang Hebreo kung tuwirang mga anak o mas malawak na linya ng angkan ang tinutukoy; pinananatili ng salin ang tunay na kalabuan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “sina” upang natural na ipakilala ang talaan ng mga pangalan. Isina-Filipino ang transliterasyon ng mga pangalan, lalo na ang Hebreong ת bilang “t” sa halip na Ingles na “th,” habang pinananatili ang anyo ng pormulang pangangkan.
