base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/022.yaml
  text: and Jokim[a], and the men of Cozeba, and Joash, and Saraph, who ruled in Moab and returned to Lehem[c][b]. These records are ancient.
translation:
  language: tl
  text: at sina Jokim, ang mga lalaking taga-Cozeba, sina Joas at Saraf, na namahala sa Moab[a], at si Jasubi-lehem[b]. Ang mga salaysay na ito ay mula pa noong unang panahon.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “na nagmay-ari sa Moab,” “na naging mga panginoon sa Moab,” o marahil “na nakipag-asawa sa mga taga-Moab.” Maikli at hindi tiyak ang pariralang Hebreo.
    reason: lexical_alternative
  - marker: b
    text: Hindi tiyak ang Hebreo. Maaari rin itong unawain bilang “at bumalik sa Lehem”; iniuugnay din ng ilan ang lugar sa Bethlehem.
    reason: alternative_reading
  - marker: c
    text: Maaari ring “Ang mga bagay na ito ay sinauna” o “Ang mga usaping ito ay mula pa noong unang panahon.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹקִים
  choice: Jokim
  rationale: Pangalang pantao; isina-Filipino ang transliterasyon nang hindi isinasalin ang kahulugan.
- source_word: אַנְשֵׁי כֹזֵבָא
  choice: ang mga lalaki ng Cozeba
  rationale: Tuwirang ipinapakita ng אַנְשֵׁי ang panlalaking maramihan na nasa anyong construct, at itinuring na pangalan ng lugar ang כֹזֵבָא.
- source_word: יוֹאָשׁ
  choice: Joas
  rationale: Ginamit ang likas at nakasanayang anyong Filipino ng pangalang pantao.
- source_word: שָׂרָף
  choice: Saraf
  rationale: Sa kontekstong talaangkanan, pangalan ito ng tao at hindi karaniwang pangngalang nangangahulugang kaugnay ng pagsunog.
- source_word: אֲשֶׁר בָּעֲלוּ לְמוֹאָב
  choice: na namahala sa Moab
  rationale: Maaaring tumukoy ang בעל sa pagiging panginoon, pamamahala, o pag-aangkin. Ang “namahala” ay maikli at natural, samantalang inilalahad sa talababa ang tunay na kawalang-katiyakan ng parirala.
- source_word: יָשֻׁבִי לָחֶם
  choice: Jasubi-lehem
  rationale: Ang anyo ng Hebreo ay mahirap tiyakin at maaaring unawain bilang tambalang pangalang pantao. Pinili sa pangunahing teksto ang pagbasa bilang pangalan upang hindi gawing karaniwang pandiwa ang anyong hindi malinaw; nasa talababa ang alternatibong pagbasa.
- source_word: הַדְּבָרִים עַתִּיקִים
  choice: Ang mga salaysay na ito ay mula pa noong unang panahon
  rationale: Maaaring mangahulugan ang דְּבָרִים ng mga salita, bagay, usapin, o salaysay. Sa kontekstong ito, natural na ipinahihiwatig ng “mga salaysay” ang sinaunang impormasyong inilalahad nang hindi tahasang ipinapalagay na nakasulat na mga rekord.
