base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/009.yaml
  text: Jabez was more honored than his brothers[a], and his mother called his name Jabez, saying[b], “Because I bore him in pain.”
translation:
  language: tl
  text: Si Jabez[a] ay higit na pinarangalan kaysa sa kanyang mga kapatid, at pinangalanan siya ng kanyang ina na Jabez at sinabi, “Sapagkat ipinanganak ko siya nang may hirap[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang pangalang Jabez ay kahawig sa tunog ng salitang Hebreo para sa sakit, lungkot, o hirap sa paliwanag ng kanyang ina.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “sa sakit” o “sa lungkot.” Ang salitang Hebreo ay maaaring tumukoy sa sakit, lungkot, o paghihirap.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  choice: ay
  rationale: Ipinahahayag ng anyong pandiwa ang kalagayan ni Jabez sa salaysay; hindi na dinagdagan ng tahasang panandang temporal na wala naman sa Hebreo.
- source_word: יַעְבֵּץ
  choice: Jabez
  rationale: Isinalin sa karaniwang transliterasyong Filipino ang pangalang pantangi at pinanatili ang pag-uulit nito sa pormula ng pagpapangalan.
- source_word: נִכְבָּד מֵאֶחָיו
  choice: higit na pinarangalan kaysa sa kanyang mga kapatid
  rationale: Pinananatili nito ang paghahambing at ang diwa ng כבד bilang pagiging marangal o pinag-uukulan ng parangal.
- source_word: קָרְאָה שְׁמוֹ
  choice: Pinangalanan siya
  rationale: Likas na modernong Filipino ito para sa Hebreong idyomang literal na ‘tinawag ang kanyang pangalan,’ habang malinaw na pinananatili ang kilos ng pagpapangalan.
- source_word: לֵאמֹר
  choice: na sinasabi
  rationale: Ipinakikilala nito ang paliwanag ng ina sa ibinigay na pangalan.
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinahahayag ang sanhi o dahilan ng pagpapangalan.
- source_word: יָלַדְתִּי
  choice: isinilang ko siya
  rationale: Direktang ipinahahayag ang panganganak at ginagawang tahasan ang bagay na malinaw sa konteksto.
- source_word: בְּעֹצֶב
  choice: nang may hirap
  rationale: Ang עֹצֶב ay maaaring tumukoy sa sakit, lungkot, o paghihirap. Ang ‘hirap’ ay likas sa konteksto ng panganganak at hindi labis na nililimitahan ang lawak ng salita.
