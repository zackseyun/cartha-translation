revisions:
- from: Si Jabez ay higit na pinarangalan kaysa sa kanyang mga kapatid[a]. Pinangalanan siya ng kanyang ina na Jabez, na sinasabi, “Sapagkat isinilang ko siya nang may hirap[b].”
  to: Si Jabez[a] ay higit na pinarangalan kaysa sa kanyang mga kapatid, at pinangalanan siya ng kanyang ina na Jabez at sinabi, “Sapagkat ipinanganak ko siya nang may hirap[b].”
  rationale: Inalis ang di-sinuportahang pagpapalawak ng “mga kapatid” at pinalitan ito ng angkop na talababa tungkol sa paglalaro ng tunog ng pangalang Jabez. Isinaayos ang aktibong pandiwa para sa panganganak at ang pagpapakilala sa sinabi ng ina, nang hindi binabago ang kahulugan o ang pagpapanatili ng lawak ng עֹצֶב.
