  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang ‘pinangalanan’ sa halip na literal na ‘tinawag ang kanyang pangalan,’ at pinanatili sa talababa ang lawak ng kahulugan at paglalaro sa tunog ng pangalan.
