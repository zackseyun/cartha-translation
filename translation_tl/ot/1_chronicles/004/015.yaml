  text: וּ/בְנֵי֙ כָּלֵ֣ב בֶּן יְפֻנֶּ֔ה עִ֥ירוּ אֵלָ֖ה וָ/נָ֑עַם וּ/בְנֵ֥י אֵלָ֖ה וּ/קְנַֽז־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/015.yaml
  text: 'And the sons of Caleb son of Jephunneh: Iru[a], Elah, and Naam; and the sons of Elah: Kenaz.'
translation:
  language: tl
  text: At ang mga anak ni Caleb na anak ni Jefune ay sina Iru,[a] Ela, at Naam. At ang mga anak ni Ela ay si Kenaz.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa mga talaangkanan, ang “mga anak” ay maaari ring mangahulugang “mga inapo,” ngunit mas malamang na mga tuwirang anak ang tinutukoy rito.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי כָּלֵב
  choice: At ang mga anak ni Caleb
  rationale: Ang בְּנֵי ay pinakadirektang nangangahulugang “mga anak na lalaki,” ngunit sa likas na Filipino, sapat at mas maayos ang “mga anak” sa talaangkanan. Pinananatili ng “At” ang pang-ugnay na וּ.
- source_word: בֶּן יְפֻנֶּה
  choice: na anak ni Jefune
  rationale: Likas na genealogical na parirala sa Filipino upang tukuyin kung aling Caleb ang tinutukoy.
- source_word: עִירוּ
  choice: Iru
  rationale: Transliterasyon ng pangalang Hebreo ayon sa bigkas na ipinahihiwatig ng Masoretic na teksto.
- source_word: אֵלָה
  choice: Ela
  rationale: Pangalan ng tao sa konteksto; ang “Ela” ay payak na transliterasyong angkop sa Filipino.
- source_word: וָנָעַם
  choice: at Naam
  rationale: Sinusuportahan ng katinig at pagbigkas sa WLC ang panlalaking pangalang Naam, hindi Naama.
- source_word: וּבְנֵי אֵלָה
  choice: At ang anak ni Ela
  rationale: Bagaman nasa anyong maramihan ang בְּנֵי, iisa lamang ang nakatalang pangalan. Ginamit ang likas na isahan sa Filipino habang inilalagay sa talababa ang literal na anyo upang hindi maitago ang tensiyon ng teksto.
- source_word: וּקְנַז
  choice: si Kenaz
  rationale: Ang וּ ay nauunawaan bilang panandang nag-uugnay sa ipinakilalang sangay ng talaangkanan; idinagdag ang “si” bilang likas na pananda sa personal na pangalan sa Filipino.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang karaniwang anyong Filipino ng mga pangalang Caleb at Jefune, at payak na transliterasyon para sa Iru, Ela, Naam, at Kenaz. Kailangang idagdag ang marker na [b] sa pangunahing teksto upang tumugma sa talababa.
