  yaml_path: translation/ot/1_chronicles/004/034.yaml
  text: and Meshobab[a], and Jamlech, and Joshah son of Amaziah.
translation:
  language: tl
  text: at si Mesobab, at si Yamlec, at si Josa na anak ni Amazias.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מְשׁוֹבָב
  choice: Mesobab
  rationale: Pangalang pantangi; isinalin sa baybay na angkop sa modernong Filipino habang malapit sa anyong Hebreo.
- source_word: יַמְלֵךְ
  choice: Yamlec
  rationale: Pangalang pantangi; pinanatili ang paunang tunog na Y ng titik Hebreong yod, at ginamit ang c para sa pangwakas na tunog /k/ alinsunod sa tradisyonal na baybay ng ilang pangalang biblikal sa Filipino.
- source_word: יוֹשָׁה
  choice: Josa
  rationale: Pangalang pantangi; ginamit ang nakaugaliang Filipinong anyo na may J para sa Hebreong yod at s para sa shin.
- source_word: בֶּן
  choice: anak ni
  rationale: Karaniwan at natural na panandang pangangkan sa Filipino; ipinahahayag nito ang 'son of' nang hindi kailangang idagdag ang salitang 'lalaki,' na malinaw na sa konteksto ng talaan.
- source_word: אֲמַצְיָה
  choice: Amazias
  rationale: Ginamit ang nakaugaliang Filipinong anyo ng pangalang biblikal.
- source_word: וְ
  choice: at / sina
  rationale: Ang unang pang-ugnay ay natural na naipahayag sa Filipinong panandang maramihang pantangi na 'sina' kasunod ng naunang talata, samantalang pinanatili ang 'at' bago ang huling pangalan upang malinaw ang ayos ng talaan.
theological_decisions: []
translation_notes:
  register: Maikli at marangal na wikang Filipino para sa talaang pangangkan. Ginamit ang 'sina' upang likas na maipagpatuloy ang listahan mula sa naunang talata; walang kuwit bago ang huling 'at' ayon sa karaniwang bantas sa Filipino.
