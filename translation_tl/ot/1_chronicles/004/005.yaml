  source_fidelity: 'Tumpak ang salin sa Hebreo: ipinahahayag nito na si Ashur ay “ama ng Tekoa” at may dalawang asawa, sina Hela at Naara. Ang “ay may” ay idiomatikong katumbas ng Hebreong konstruksyong may pandiwang “were,” at ang “mga asawa” ang wastong diwa ng נָשִׁים sa kontekstong ito.'
  naturalness: 'Malinaw, maikli, at natural ang modernong Filipino: “Si Ashur na ama ng Tekoa ay may dalawang asawa: sina Hela at Naara.” Ang paggamit ng “sina” para sa dalawang pangalan ay wasto at ang estilo ay angkop sa talaangkanan.'
  terminology: Ang “ama ng Tekoa” ay maingat na pinananatili ang malawak na genealogical na gamit ng אָב nang hindi pinipilit ang “tagapagtatag” bilang tanging kahulugan. Wasto at sapat ang talababa upang ilahad ang mga posibleng saklaw. Ang mga baybay na Ashur, Hela, at Naara ay katanggap-tanggap na Filipino rendering ng mga pangalan.
