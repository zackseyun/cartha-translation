source:
  edition: WLC
  text: וּ/לְ/אַשְׁחוּר֙ אֲבִ֣י תְק֔וֹעַ הָי֖וּ שְׁתֵּ֣י נָשִׁ֑ים חֶלְאָ֖ה וְ/נַעֲרָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/005.yaml
  text: 'Ashhur the father of Tekoa had two wives: Helah and Naarah[a].'
translation:
  language: tl
  text: 'Si Ashur na ama ng Tekoa[a] ay may dalawang asawa: sina Hela at Naara.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “tagapagtatag ng Tekoa” o “ninuno ng Tekoa.” Sa mga talaangkanan, ang “ama ng” ay maaaring tumukoy sa tagapagtatag ng isang angkan o pamayanan, hindi lamang sa tuwirang biyolohikal na ama.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְאַשְׁחוּר
  choice: Si Ashur
  rationale: Ang nakakabit na pangatnig at pang-ukol ay nagsisilbing panandang nag-uugnay sa daloy ng talaangkanan. Sa natural na Filipino, sapat ang pagpapakilala sa pangunahing tauhan bilang “Si Ashur.”
- source_word: אֲבִי תְקוֹעַ
  choice: ama ng Tekoa
  rationale: Pinananatili nito ang tuwirang larawan ng Hebreong אָב habang hindi nilulutas ang posibilidad na ang Tekoa ay isang tao, angkan, o pamayanan, at na ang “ama” ay maaaring mangahulugang ninuno o tagapagtatag.
- source_word: הָיוּ
  choice: ay may
  rationale: Bagaman “naging/naroon” ang literal na anyo ng pandiwa, ang konstruksyon ay nagpapahayag ng pagmamay-ari; “ay may” ang natural na katumbas sa Filipino.
- source_word: שְׁתֵּי נָשִׁים
  choice: dalawang asawa
  rationale: Sa konteksto ng talaangkanan at ng konstruksyong tumutukoy kay Ashur, ang נָשִׁים ay tumutukoy sa mga asawa, hindi lamang sa dalawang babae.
- source_word: חֶלְאָה
  choice: Hela
  rationale: Isinalin sa baybay na natural sa Filipino ang pangalang Hebreo, nang hindi pinananatili ang tahimik na h sa hulihan ng anyong Ingles.
- source_word: וְנַעֲרָה
  choice: at Naara
  rationale: Pinanatili ang pangatnig sa payak na talaan, at isina-Filipino ang transliterasyon ng pangalang Hebreo.
theological_decisions:
- issue: Saklaw ng titulong “ama ng Tekoa”
  choice: Pinanatili sa pangunahing teksto ang “ama ng Tekoa,” na may talababa tungkol sa mas malawak na kahulugan.
  alternative: tagapagtatag ng Tekoa / ninuno ng Tekoa
  rationale: Sa mga talaangkanan, maaaring tumukoy ang “ama” sa biyolohikal na ama, ninuno, o tagapagtatag ng isang angkan o pamayanan. Hindi sapat ang talata upang tiyak na pumili lamang ng isa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “sina” para sa natural na pagpapakilala sa dalawang pangalang pantangi, at pinanatili ang maikli at payak na estilo ng talaangkanan.
