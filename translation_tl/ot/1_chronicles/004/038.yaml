base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/038.yaml
  text: These[a], who were mentioned by name, were leaders in their clans[b], and their ancestral houses increased greatly.
translation:
  language: tl
  text: Ang mga ito[a], na binanggit ayon sa pangalan, ay mga pinuno sa kani-kanilang angkan, at ang mga sambahayan ng kanilang mga ninuno ay lubhang dumami.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Ang mga ito na dumating, na nakatala ayon sa pangalan.” Literal na “mga dumarating” ang Hebreong pandiwari, ngunit dito ay malamang na tumutukoy ito sa mga ipinasok o tinukoy sa talaangkanan.
    reason: lexical_alternative
  - marker: b
    text: 'Mas literal: “at ang mga sambahayan ng kanilang mga ninuno ay lumaganap tungo sa karamihan.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: Ang mga ito
  rationale: Ipinakikilala ng pangmaramihang demonstratibo ang pangkat na tinukoy sa naunang talaan; natural at sapat ang “Ang mga ito” sa Filipino.
- source_word: הַבָּאִים
  choice: na binanggit
  rationale: Bagaman literal na tumutukoy sa “mga dumarating,” sa konteksto ng talaangkanan at kasama ng בְּשֵׁמוֹת, malamang na tumutukoy ito sa mga itinala o tinukoy sa pangalan.
- source_word: בְּשֵׁמוֹת
  choice: ayon sa pangalan
  rationale: Ipinahihiwatig ng parirala na ang mga tao ay isa-isang tinukoy o itinala sa pangalan.
- source_word: נְשִׂיאִים
  choice: mga pinuno
  rationale: Tumutukoy ito sa mga nangunguna sa angkan o lipi; mas malinaw at hindi monarkikal ang “mga pinuno” kaysa “mga prinsipe.”
- source_word: בְּמִשְׁפְּחוֹתָם
  choice: sa kani-kanilang angkan
  rationale: Sa kontekstong talaangkanan, ang מִשְׁפָּחָה ay isang mas malawak na pangkat ng magkakamag-anak kaysa makabagong nukleyar na pamilya.
- source_word: וּבֵית אֲבוֹתֵיהֶם
  choice: ang kanilang mga sambahayan ng ninuno
  rationale: Pinananatili nito ang diwa ng mga sambahayan o linyang nagmula sa mga ama, sa natural na makabagong Filipino.
- source_word: פָּרְצוּ
  choice: dumami
  rationale: Ang pandiwa ay literal na may larawan ng paglaganap o paglawak, at dito ay nagpapahiwatig ng malaking pagdami ng mga sambahayan.
- source_word: לָרֹב
  choice: lubhang
  rationale: Pinatitindi nito ang lawak o dami ng paglago; malinaw na ipinapahayag ng “lubhang dumami” ang numerikal na diwa.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “angkan” para sa malawak na pangkat ng magkakamag-anak at “sambahayan ng ninuno” para sa patrilinyal na yunit, habang pinanatili sa talababa ang literal na larawan at tunay na kalabuan ng הַבָּאִים at פָּרְצוּ לָרֹב.
