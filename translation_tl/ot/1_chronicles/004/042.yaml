  text: וּ/מֵ/הֶ֣ם מִן בְּנֵ֣י שִׁמְע֗וֹן הָלְכוּ֙ לְ/הַ֣ר שֵׂעִ֔יר אֲנָשִׁ֖ים חֲמֵ֣שׁ מֵא֑וֹת וּ/פְלַטְיָ֡ה וּ֠/נְעַרְיָה וּ/רְפָיָ֧ה וְ/עֻזִּיאֵ֛ל בְּנֵ֥י יִשְׁעִ֖י בְּ/רֹאשָֽׁ/ם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/042.yaml
  text: And some of them[a], from the sons of Simeon, went to Mount Seir—five hundred men—with Pelatiah, Neariah, Rephaiah, and Uzziel, sons of Ishi, at their head.
translation:
  language: tl
  text: At mula sa kanila, limang daang lalaki—mula sa mga anak ni Simeon—ang pumunta sa Bundok Seir, sa pangunguna[a] nina Pelatias, Nearias, Refaias, at Uziel, mga anak ni Isi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “na nasa kanilang unahan.” Maaari ring isalin, “bilang mga pinuno nila.”
    reason: Pinananatili ang literal na larawan at ang posibleng idyomatikong pagpapakahulugan ng בְּרֹאשָׁם.
lexical_decisions:
- source_word: וּמֵהֶם
  choice: Mula sa kanila
  rationale: 'Pinananatili ang partitive na diwa: ang pangkat na ito ay nagmula sa mga taong binanggit sa naunang konteksto.'
- source_word: מִן בְּנֵי שִׁמְעוֹן
  choice: mula sa mga anak ni Simeon
  rationale: Pinananatili ang paraang pangangkanan ng Hebreo sa halip na gawing simpleng pangalang-etniko.
- source_word: הָלְכוּ
  choice: ang pumunta
  rationale: Payak at walang dagdag na pahiwatig ng pagmamartsa o pakikidigma, gaya ng karaniwang kahulugan ng pandiwa.
- source_word: לְהַר שֵׂעִיר
  choice: sa Bundok Seir
  rationale: Ginagamit ang karaniwang anyo ng pangalan ng lugar at tapat sa payak na pariralang Hebreo.
- source_word: אֲנָשִׁים חֲמֵשׁ מֵאוֹת
  choice: 500 lalaki
  rationale: Tuwirang inilalahad ang bilang nang hindi nagdaragdag ng tahasang militar na kahulugan.
- source_word: וּפְלַטְיָה וּנְעַרְיָה וּרְפָיָה וְעֻזִּיאֵל
  choice: nina Pelatias, Nearias, Refaias, at Uziel
  rationale: Isinaayos ang mga pangalan ayon sa likas na sintaks ng Tagalog habang pinananatili ang apat na pinunong nakapangalan sa Hebreo.
- source_word: בְּנֵי יִשְׁעִי
  choice: mga anak ni Isi
  rationale: Pinananatili ang pagkakakilanlang pangangkanan ng apat na lalaking binanggit.
- source_word: בְּרֹאשָׁם
  choice: sa pangunguna
  rationale: Likas na idyomang Tagalog para sa literal na larawang 'nasa kanilang unahan/ulo,' na sa konteksto ay nagpapahayag ng pamumuno.
