base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/012.yaml
  text: Eshton fathered Beth-rapha[a], Paseah, and Tehinnah, the father of Ir-nahash[b]. These were the men of Rekah.
translation:
  language: tl
  text: Naging ama si Eshton nina Bet-rafa, Pasea, at Tehina. Si Tehina ang ama[a] ng Ir-nahas[b]. Sila ang mga taga-Reka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “tagapagtatag ng Ir-nahas.” Sa mga talaangkanan, ang “ama ng” ay maaari ring tumukoy sa isang ninuno o tagapagtatag, hindi lamang sa mismong ama.
    reason: lexical_alternative
  - marker: b
    text: Ang Ir-nahas ay maaaring mangahulugang “lunsod ni Nahas,” ngunit malamang na ginagamit dito bilang pangalan ng isang lugar.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶשְׁתּוֹן הוֹלִיד
  choice: Si Eston ang naging ama
  rationale: Sa talaangkanan, ang Hiphil ng ילד ay tumutukoy sa pagkakaroon ng anak o pagpapatuloy ng angkan. Ang “naging ama” ay natural sa makabagong Filipino at hindi kasinsinauna ng “ipinanganak kay” o “nagkaanak.”
- source_word: בֵּית רָפָא
  choice: Bet-rafa
  rationale: Itinuring itong pangalang pantangi ayon sa konteksto at paralelismo sa mga kasunod na pangalan, sa halip na isaling literal bilang “bahay ni Rafa.”
- source_word: פָּסֵחַ
  choice: Pasea
  rationale: Pangalang pantangi; ginamit ang baybay na madaling bigkasin sa Filipino habang kinakatawan ang Hebreong pangalan.
- source_word: תְּחִנָּה
  choice: Tehina
  rationale: Pangalang pantangi sa kontekstong ito, kaya isinalin sa pamamagitan ng transliterasyon at hindi ayon sa karaniwang kahulugang “pagsusumamo.”
- source_word: אֲבִי עִיר נָחָשׁ
  choice: ang ama ng Ir-nahas
  rationale: Pinananatili ng “ama” ang Hebreong idyoma at ang posibilidad na tumukoy ito sa literal na ama, ninuno, o tagapagtatag. Itinuring ang Ir-nahas bilang pangalan ng lugar dahil sa kontekstong onomastiko.
- source_word: אֵלֶּה אַנְשֵׁי רֵכָה
  choice: Sila ang mga lalaki ng Reka
  rationale: Ang אַנְשֵׁי ay literal na “mga lalaki ng” at maaaring tumukoy sa mga kasapi ng isang angkan o pamayanan. Pinananatili ng salin ang pormal na ugnayan nang hindi nilulutas ang eksaktong uri nito.
- source_word: רֵכָה
  choice: Reka
  rationale: Pangalang pantangi o pangalan ng lugar; tinumbasan sa baybay na angkop sa Filipino.
theological_decisions:
- issue: Saklaw ng katawagang “ama” sa talaangkanan
  choice: Pinanatili sa teksto ang “ama” at ipinaliwanag sa talababa ang mas malawak na gamit nito.
  alternative: Isalin nang tuwiran bilang “tagapagtatag.”
  rationale: Hindi tiyak sa Hebreo kung literal na ama, ninuno, o tagapagtatag ang ibig sabihin. Ang pagpapanatili sa “ama” ay hindi sapilitang nagtatakda ng isang interpretasyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang mga anyong Eston, Bet-rafa, Pasea, Tehina, Ir-nahas, at Reka upang maging madaling basahin at bigkasin ng karaniwang mambabasang Filipino. Inilagay ang parehong pananda ng talababa sa mismong pariralang “ama ng Ir-nahas,” kung saan matatagpuan ang dalawang tunay na kalabuan.
