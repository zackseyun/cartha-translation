  text: וּ/מְעוֹנֹתַ֖י הוֹלִ֣יד אֶת עָפְרָ֑ה וּ/שְׂרָיָ֗ה הוֹלִ֤יד אֶת יוֹאָב֙ אֲבִי֙ גֵּ֣יא חֲרָשִׁ֔ים כִּ֥י חֲרָשִׁ֖ים הָיֽוּ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/014.yaml
  text: Meonothai fathered Ophrah[a], and Seraiah fathered Joab, the father of Ge-harashim[b], for they were craftsmen.
translation:
  language: tl
  text: Si Meonotai ang naging ama ni Ofra, at si Seraya naman ang naging ama ni Joab, na ama ng Ge-Harasim[b].[a] Sapagkat mga bihasang manggagawa sila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Ge-Harasim ay malamang na nangangahulugang “Lambak ng mga Bihasang Manggagawa.” Pinanatili rito bilang pangalan ng lugar ang anyong Hebreo, at ipinaliliwanag ng kasunod na sugnay ang pangalan.
    reason: lexical_alternative
  - marker: b
    text: Ang “ama ng” ay maaari ring isaling “tagapagtatag ng.” Sa mga talaangkanan, maaari itong tumukoy sa isang tagapagtatag o ninunong pinuno.
    reason: alternative_reading
lexical_decisions:
- source_word: מְעוֹנֹתַי
  choice: Meonotai
  rationale: Pangalan ng tao; tinumbasan sa baybay na natural sa modernong Filipino.
- source_word: הוֹלִיד
  choice: naging anak ni
  rationale: Sa talaangkanan, ipinahahayag ng Hiphil ng ילד ang pag-aanak o pagiging ama. Ang pariralang ito ay natural at marangal sa Filipino nang hindi gumagamit ng makalumang 'ipinanganak kay.'
- source_word: עָפְרָה
  choice: Ofra
  rationale: Pangngalang pantangi; isinalin sa baybay-Filipino.
- source_word: שְׂרָיָה
  choice: Seraya
  rationale: Pangngalang pantangi; isinalin sa baybay-Filipino.
- source_word: יוֹאָב
  choice: Joab
  rationale: Pangngalang pantangi; pinanatili ang karaniwang anyo sa Filipino.
- source_word: אֲבִי
  choice: ang ama ng
  rationale: Pinananatili ang literal na ugnayang 'ama ng,' habang inilalahad sa talababa na maaari rin itong tumukoy sa tagapagtatag o pinunong ninuno.
- source_word: גֵּיא חֲרָשִׁים
  choice: Ge-Harasim
  rationale: Tinuring na pangalan ng lugar at tinumbasan sa transliterasyon; ipinapaliwanag sa talababa ang kahulugan nitong malamang ay 'Lambak ng mga Bihasang Manggagawa.'
- source_word: כִּי
  choice: sapagkat
  rationale: Malinaw na ipinakikita ang paliwanag o dahilan ng pangalan ng lugar.
- source_word: חֲרָשִׁים
  choice: mga bihasang manggagawa
  rationale: Malawak ang saklaw ng salita para sa mga artisan o manggagawang may kasanayan; iniiwasang paliitin ito sa mga panday lamang.
- source_word: הָיוּ
  choice: sila
  rationale: Ipinahihiwatig ng pandiwa ang 'sila ay'; sa natural na Filipino, sapat ang 'mga bihasang manggagawa sila.'
theological_decisions:
- issue: Saklaw ng אֲבִי sa pahayag na 'ama ng Ge-Harasim'
  choice: ang ama ng Ge-Harasim
  alternative: ang tagapagtatag ng Ge-Harasim
  rationale: Hindi tiyak kung literal na pagkaama, pagiging ninuno, o pagtatatag ang tinutukoy. Pinananatili ng pangunahing teksto ang anyong Hebreo at inilalagay sa talababa ang posibleng kahulugang tagapagtatag.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang mga baybay na Meonotai, Ofra, Seraya, Joab, at Ge-Harasim. Iniwasan ang makalumang 'ipinanganak kay' at ang sobrang tiyak na 'panday.'
