base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/024.yaml
  text: 'The sons of Simeon: Nemuel[a], Jamin, Jarib, Zerah[c][b], and Shaul.'
translation:
  language: tl
  text: Ang mga anak ni Simeon ay sina Nemuel[a], Jamin, Jarib, Zera[b], at Shaul[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Nemuel ay tinatawag na Jemuel sa Genesis 46:10; Nemuel ang anyong Hebreo rito.
    reason: alternative_reading
  - marker: b
    text: Ang Zera rito ay tumutugma sa Zohar sa kahilerang talaan sa Genesis 46:10 at Exodo 6:15.
    reason: textual_variant
  - marker: c
    text: Ang Shaul ang anyong Hebreo ng pangalang karaniwang isinusulat na Saul.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: mga anak ni
  rationale: Ang construct plural na “mga anak” ang tuwirang panimula sa talaan ng mga lalaking pinangalanan; hindi kailangang palawakin bilang “mga inapo.”
- source_word: שִׁמְעוֹן
  choice: Simeon
  rationale: Pangngalang pantangi na isinalin ayon sa kinagawiang anyo sa modernong Tagalog na Bibliya.
- source_word: נְמוּאֵל
  choice: Nemuel
  rationale: Tuwirang transliterasyon ng anyong Hebreo sa talatang ito; ang Jemuel ay kaugnay na anyo sa Genesis 46:10.
- source_word: וְיָמִין
  choice: Jamin
  rationale: Transliterasyon ng pangngalang pantangi; ang pang-ugnay na וְ ay likas na ipinahahayag sa Tagalog sa huling bahagi ng serye sa pamamagitan ng “at.”
- source_word: יָרִיב
  choice: Jarib
  rationale: Tuwirang transliterasyon ng pangngalang pantangi, sa halip na isalin ang posibleng kahulugan ng pangalan.
- source_word: זֶרַח
  choice: Zera
  rationale: Transliterasyon na angkop sa tunog at baybay ng modernong Filipino para sa Hebreong Zeraḥ; hindi pinili ang Zohar na nasa mga kahilerang talaan.
- source_word: שָׁאוּל
  choice: Shaul
  rationale: Malapit na transliterasyon ng Hebreong pangalan; pinananatili nito ang anyo ng pinagmulang teksto sa halip na gamitin ang karaniwang Ingles na Saul.
theological_decisions: []
translation_notes:
  register: Natural at marangal na modernong Tagalog. Ginamit ang hulma na “Ang mga anak ni … ay sina …” upang maging malinaw at likas ang talaang genealogical. Inilagay ang “at” bago ang huling pangalan ayon sa karaniwang ayos ng serye sa Tagalog.
