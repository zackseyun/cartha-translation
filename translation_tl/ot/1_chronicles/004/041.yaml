revisions:
- from: Dumating noong panahon ni Ezequias na hari ng Juda ang mga lalaking ito na nakatala ayon sa pangalan. Nilusob nila ang mga tolda ng mga iyon at pinabagsak ang mga Meunita[a] na natagpuan doon. Itinalaga nila ang mga ito sa ganap na pagkalipol, gaya ng kalagayan hanggang sa araw na ito. Pagkatapos, nanirahan sila sa lugar ng mga iyon, sapagkat may pastulan doon para sa kanilang mga kawan.
  to: Noong panahon ni Ezequias na hari ng Juda, dumating ang mga lalaking ito na nakatala ayon sa pangalan. Nilusob nila ang kanilang mga tolda at ang mga Meunita[a] na natagpuan doon, at itinalaga nila ang mga ito sa ganap na pagkalipol hanggang sa araw na ito. Pagkatapos, nanirahan sila sa kanilang lugar, sapagkat may pastulan doon para sa kanilang mga kawan.
  rationale: Inalis ang dagdag na pagpapaliwanag sa “hanggang sa araw na ito,” pinasimple ang paglalarawan ng pagsalakay upang sundin ang isang pandiwang Hebreo, at pinahusay ang mga panghalip na tumutukoy sa mga dating naninirahan. Napanatili ang sinadyang kalabuan ng הַמְּעִינִים sa talababa at ang teknikal na diwa ng חרם sa pangunahing teksto.
