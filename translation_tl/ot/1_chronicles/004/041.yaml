id: 1CH.4.41
reference: 1 Chronicles 4:41
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יָּבֹ֡אוּ אֵלֶּה֩ הַ/כְּתוּבִ֨ים בְּ/שֵׁמ֜וֹת בִּ/ימֵ֣י יְחִזְקִיָּ֣הוּ מֶֽלֶךְ יְהוּדָ֗ה וַ/יַּכּ֨וּ אֶת אָהֳלֵי/הֶ֜ם וְ/אֶת ה/מעינים אֲשֶׁ֤ר נִמְצְאוּ שָׁ֨מָּ/ה֙ וַ/יַּחֲרִימֻ/ם֙ עַד הַ/יּ֣וֹם הַ/זֶּ֔ה וַ/יֵּשְׁב֖וּ תַּחְתֵּי/הֶ֑ם כִּֽי מִרְעֶ֥ה לְ/צֹאנָ֖/ם שָֽׁם׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/041.yaml
  text: These[a], who were recorded by name, came in the days of Hezekiah king of Judah, and they struck down their tents and the Meunites who were found there, and devoted them to destruction to this day. Then they settled in their place, because there was pasture there for their flocks.
translation:
  language: tl
  text: Noong panahon ni Ezequias na hari ng Juda, dumating ang mga lalaking ito na nakatala ayon sa pangalan. Nilusob nila ang kanilang mga tolda at ang mga Meunita[a] na natagpuan doon, at itinalaga nila ang mga ito sa ganap na pagkalipol hanggang sa araw na ito. Pagkatapos, nanirahan sila sa kanilang lugar, sapagkat may pastulan doon para sa kanilang mga kawan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mahirap unawain ang Hebreong הַמְּעִינִים. Ayon sa tradisyonal na pagbasa, tumutukoy ito sa “mga Meunita,” isang pangkat ng mga tao; maaari rin itong unawain bilang “mga tirahan” o “mga dako ng tirahan.”
    reason: alternative_reading
lexical_decisions:
- source_word: הַכְּתוּבִים בְּשֵׁמוֹת
  choice: nakatalâ ayon sa pangalan
  rationale: Ipinahihiwatig ng pasibong participle at ng pariralang בְּשֵׁמוֹת na ang mga taong ito ay nakasulat sa isang talaan o talaangkanan. Likas sa modernong Tagalog ang 'nakatalâ ayon sa pangalan' at napananatili nito ang administratibong diwa.
- source_word: וַיָּבֹאוּ
  choice: dumating
  rationale: Karaniwang nangangahulugang 'dumating' ang בוא, at ang anyong ito ay angkop sa pagkakasunod-sunod ng salaysay.
- source_word: וַיַּכּוּ
  choice: nilusob ... at pinabagsak
  rationale: Sa kontekstong militar, ang נכה ay tumutukoy sa marahas na pagsalakay na humahantong sa pagkatalo o pagkamatay. Ginamit ang pares na pandiwa upang maging malinaw na ang mga tolda ay nilusob at ang mga tao ay pinabagsak, nang hindi ipinapalagay na ang tolda mismo ay 'pinatay.'
- source_word: אָהֳלֵיהֶם
  choice: mga tolda ng mga iyon
  rationale: Ang אָהֶל ay karaniwang salita para sa tolda at angkop sa malamang na pamumuhay ng mga pangkat na nagpapastol.
- source_word: המעינים
  choice: mga Meunita
  rationale: Mahirap ang anyo sa tekstong Hebreo, ngunit maaari itong unawain bilang katawagan sa isang pangkat ng tao, ayon sa tradisyonal na pagbasa. Pinanatili sa talababa ang posibleng pagbasa na 'mga tirahan.'
- source_word: אֲשֶׁר נִמְצְאוּ שָׁמָּה
  choice: na natagpuan doon
  rationale: Dahil tinanggap sa pangunahing teksto ang pagbasa na isang pangkat ng tao ang tinutukoy, natural ang personal na kaugnay na sugnay sa Tagalog.
- source_word: וַיַּחֲרִימֻם
  choice: itinalaga ... sa ganap na pagkalipol
  rationale: Ang Hiphil ng חרם ay may teknikal na diwa ng paglalagay sa ḥerem—pagtatalaga sa pagkalipol. Napananatili ng salin ang ideya ng pagtatalaga at ang marahas na kinahinatnan nito.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: gaya ng kalagayan hanggang sa araw na ito
  rationale: Ang payak na 'hanggang sa araw na ito' ay maaaring magmukhang patuloy ang kilos ng paglipol. Nililinaw ng parirala na ang bunga o kalagayan nito ang nananatili hanggang sa panahon ng tagapagsalaysay.
- source_word: וַיֵּשְׁבוּ תַּחְתֵּיהֶם
  choice: nanirahan sila sa lugar ng mga iyon
  rationale: Ang תַּחְתֵּי sa ganitong konteksto ay nangangahulugang 'kapalit ng' o 'sa lugar ng.' Malinaw at natural sa Tagalog ang napiling anyo.
- source_word: מִרְעֶה לְצֹאנָם
  choice: pastulan ... para sa kanilang mga kawan
  rationale: Ang מִרְעֶה ay pastulan o lupaing mapagpapastulan, at ang צֹאן ay maaaring tumukoy sa kawan ng mga tupa at kambing, kaya mas angkop ang mas malawak na 'mga kawan.'
theological_decisions:
- issue: Teknikal na diwa ng חרם at saklaw ng pagkalipol
  choice: itinalaga ... sa ganap na pagkalipol
  alternative: lubusang nilipol
  rationale: Pinananatili ng salin ang konsepto ng pagtatalaga sa ḥerem sa halip na gawing karaniwang pandiwa lamang para sa pagwasak. Hindi nito dinaragdagan ang teksto ng paliwanag tungkol sa teolohikal na katwiran ng kilos.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang 'tolda,' 'pastulan,' at 'kawan' bilang karaniwang bokabularyo. Iniwasan ang lumang 'nilipol nang lubusan' bilang tanging pagpapahayag upang mapanatili ang teknikal na diwa ng חרם. Ang marker na [a] ay nakalagay sa pangunahing teksto.
