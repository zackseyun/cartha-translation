  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/בְ/בִלְהָה
  choice: at sa Bilha
  rationale: Ang וּ ay ipinahayag bilang “at,” at ang בְּ bilang “sa,” na likas sa Filipino para sa talaan ng mga bayan. Ang בִלְהָה ay pangalang-pook at tinumbasan bilang “Bilha.”
- source_word: וּ/בְ/עֶצֶם
  choice: sa Ezem
  rationale: Ang בְּ ay isinaling “sa.” Hindi na inulit ang “at” sa Filipino upang maging natural ang tatluhang talaan, bagaman naroon ang וּ sa Hebreo. Ang עֶצֶם ay pangalang-pook at tinumbasan bilang “Ezem.”
- source_word: וּ/בְ/תוֹלָד
  choice: at sa Tolad
  rationale: Ang וּבְּ ay isinaling “at sa,” at ang תוֹלָד ay pinanatili bilang pangalang-pook na “Tolad.”
theological_decisions: []
translation_notes:
  register: Maikli, marangal, at natural na modernong Filipino. Ginamit ang “sa” dahil hindi kailangang pagpilian sa Filipino ang English na “in” at “at”; ipinapaliwanag ng talababa ang posibleng mas tahasang pagbasa na “nasa.”
