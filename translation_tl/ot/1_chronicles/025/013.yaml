  naturalness: Mas malinaw at likas sa modernong Filipino ang “Ang ikaanim ay kay Bukias,” dahil ipinahihiwatig nito ang pagtatalaga ng kapalaran nang hindi kailangang ilahad ang salitang “kapalaran” sa pangunahing teksto. Ang “mga anak niyang lalaki at mga kapatid niyang lalaki” ay mas maayos kaysa paulit-ulit na “kanyang ... na lalaki.”
  terminology: Ang “Bukias” ay katanggap-tanggap na nakaugaliang anyong Filipino ng pangalan. Napananatili ang tiyak na panlalaking saklaw ng בָּנָיו at וְאֶחָיו sa “mga anak niyang lalaki” at “mga kapatid niyang lalaki.”
