  text: the sixth[a], Bukkiah; his sons and his brothers, twelve.
translation:
  language: tl
  text: Ang ikaanim[a] ay kay Bukias; ang mga anak niyang lalaki at mga kapatid niyang lalaki, labindalawa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas tahasang ayon sa konteksto, “Ang ikaanim na kapalaran ay napunta kay Bukias, kasama ang mga anak niyang lalaki at mga kapatid niyang lalaki—labindalawa silang lahat.” Hindi inuulit sa Hebreong talaan ang “kapalaran ay napunta,” sapagkat ipinahihiwatig ito ng mga nakapaligid na talata.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשִּׁשִּׁי
  choice: ang ikaanim
  rationale: Pinananatili ang maikli at eliptikong anyo ng talaan sa Hebreo; ipinahihiwatig ng konteksto ang ‘kapalaran’ at ang ‘napunta.’
- source_word: בֻקִּיָּהוּ
  choice: Bukias
  rationale: Ginamit ang nakaugaliang anyong Filipino ng pangalang biblikal, sa halip na isalin ang kahulugan nito.
- source_word: בָּנָיו
  choice: ang kanyang mga anak na lalaki
  rationale: Tiyak na mga anak na lalaki ang tinutukoy ng Hebreo, kaya hindi ginamit ang mas malawak na ‘mga anak.’
- source_word: וְאֶחָיו
  choice: at mga kapatid na lalaki
  rationale: Tuwirang ipinahahayag ang panlalaking anyo ng Hebreo; bagaman maaari itong lumawak sa mga kamag-anak o kasamahan sa ganitong talaan, hindi iyon tahasang nililinaw ng teksto.
- source_word: שְׁנֵים עָשָׂר
  choice: labindalawa
  rationale: Pinananatili ang walang pandiwang kabuuang bilang at ang maigsi, talaang estilo ng Hebreo.
