  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang putol at maikling estilo ng Hebreong talaan, habang ginamit ang tuldok-kuwit upang maging malinaw ang pagkakahati ng ordinal, pangalan, at pangkat.
