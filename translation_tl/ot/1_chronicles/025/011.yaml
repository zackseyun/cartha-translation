  text: The fourth[a], to Izri, his sons and his brothers, twelve.
translation:
  language: tl
  text: Ang ikaapat[a] ay para kay Izri; ang kanyang mga anak na lalaki at mga kapatid na lalaki ay labindalawa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas tahasan ayon sa konteksto, “Ang ikaapat na bunot ay napunta kay Izri.” Ipinahihiwatig ng nakapaligid na talaan ang “bunot,” ngunit hindi ito binanggit sa talatang ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרְבִיעִי
  choice: Ang ikaapat
  rationale: Nakatayong mag-isa ang ordinal bilang elipsis sa talaan. Pinananatili ng salin ang maikling anyo ng Hebreo; ipinahihiwatig ng konteksto ang “palabunutan” ngunit hindi ito tahasang binanggit sa talata.
- source_word: לַיִּצְרִי
  choice: para kay Izri
  rationale: Ang unlaping ל ay nagpapahiwatig ng pagtatalaga o pagkakaloob sa talaang ito; natural itong isalin na “para kay.”
- source_word: בָּנָיו
  choice: ang kanyang mga anak na lalaki
  rationale: Tiyak na mga anak na lalaki ang tinutukoy ng Hebreo, kaya hindi ginamit ang mas malawak na “mga anak.”
- source_word: וְאֶחָיו
  choice: at mga kapatid na lalaki
  rationale: Ang karaniwang kahulugan ay mga kapatid na lalaki. Bagaman maaari itong tumukoy sa malalapit na lalaking kamag-anak o kasamahan sa ganitong talaan, pinili ang tuwirang kahulugan.
- source_word: שְׁנֵים עָשָׂר
  choice: labindalawa
  rationale: Ibinibigay ng bilang ang kabuuang dami ng pangkat. Pinanatili ang maigsi at walang pandiwang ayos ng Hebreo.
