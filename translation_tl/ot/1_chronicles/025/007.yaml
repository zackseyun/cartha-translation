  text: וַ/יְהִ֤י מִסְפָּרָ/ם֙ עִם אֲחֵי/הֶ֔ם מְלֻמְּדֵי שִׁ֖יר לַ/יהוָ֑ה כָּל הַ֨/מֵּבִ֔ין מָאתַ֖יִם שְׁמוֹנִ֥ים וּ/שְׁמוֹנָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/025/007.yaml
  text: Their number[a], together with their brothers who were trained in singing to Yahweh, all who were skillful[b], was two hundred eighty-eight.
translation:
  language: tl
  text: Ang bilang nila, kasama ng kanilang mga kapatid na sinanay sa pag-awit kay Yahweh[a]—lahat ng bihasa[b]—ay dalawang daan at walumpu't walo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “para kay Yahweh.” Maaaring magpahayag ang pang-ukol na Hebreo ng direksiyon o layunin sa kontekstong ito ng paglilingkod sa musika.
    reason: lexical_alternative
  - marker: b
    text: O “lahat ng may pagkaunawa,” samakatuwid, lahat ng may sapat na kakayahan o dalubhasa sa gawaing musikal.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִסְפָּרָם
  choice: ang bilang nila
  rationale: Tuwirang ipinahahayag ang kabuuang bilang at natural ang ayos sa makabagong Tagalog.
- source_word: עִם אֲחֵיהֶם
  choice: kasama ng kanilang mga kapatid
  rationale: Ipinahahayag ng עִם ang pagsama. Ang “mga kapatid” ay malapit sa literal na kahulugan at angkop sa konteksto ng mga lalaking Levitang naglilingkod.
- source_word: מְלֻמְּדֵי שִׁיר
  choice: na sinanay sa pag-awit
  rationale: Pinananatili ng “sinanay” ang pasibong diwa ng participle mula sa למד, at natural na ipinahahayag ng “pag-awit” ang gawaing musikal.
- source_word: לַיהוָה
  choice: kay Yahweh
  rationale: Sa pariralang may pag-awit, natural sa Tagalog ang “kay” para sa awit na iniuukol sa Diyos; maaari ring ipahiwatig ng ל ang layunin, kaya inilakip ang alternatibo sa talababa.
- source_word: כָּל־הַמֵּבִין
  choice: lahat ng bihasa
  rationale: Sa kontekstong musikal, ang participle ng בין ay tumutukoy sa pagkaunawa na nahahayag bilang kakayahan o kahusayan, hindi lamang sa pangkalahatang kaalaman.
- source_word: מָאתַיִם שְׁמוֹנִים וּשְׁמוֹנָה
  choice: dalawang daan at walumpu't walo
  rationale: Ito ang tuwirang katumbas ng bilang na 288 at ang pagbabaybay sa salita ay angkop sa estilong biblikal.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Ginagamit ng tekstong Hebreo ang Tetragrammaton bilang personal na pangalan ng Diyos. Pinananatili ng “Yahweh” ang pagkakakilanlan nito bilang pangalang tipan nang hindi ito pinapalitan ng titulo.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “pag-awit” at “bihasa” upang maging madaling maunawaan nang hindi inaalis ang teknikal na diwa ng pagsasanay at kakayahang musikal. Inilipat ang panandang [a] sa “Yahweh,” sapagkat ang talababang iyon ay nagpapaliwanag sa pang-ukol na לַ, hindi sa salitang “bilang.”
