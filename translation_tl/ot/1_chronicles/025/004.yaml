base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/025/004.yaml
  text: 'To Heman: the sons of Heman: Bukkiah[a], Mattaniah, Uzziel, Shebuel, and Jerimoth, Hananiah, Hanani, Eliathah, Giddalti, and Romamti-ezer, Joshbekashah, Mallothi, Hothir[c][b], Mahazioth.'
translation:
  language: tl
  text: 'Para kay Heman: ang mga anak ni Heman ay sina Bukias, Matanias, Uziel, Sebuel[c], Jerimot[b], Hananias, Hanani, Eliata, Gidalti[a], Romamti-ezer, Josbekasa, Maloti, Hotir, at Mahaziot.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Iminumungkahi ng ilang tagapagpaliwanag na ang bahagi ng talaang ito—lalo na sa Gidalti at Romamti-ezer—ay maaaring basahin bilang isang parirala at hindi lamang bilang mga pangalan. Dito, itinuring ang mga ito bilang mga personal na pangalan dahil talaan ng mga anak ang konteksto.
    reason: alternative_reading
  - marker: b
    text: Ang “Jerimot” ay maaari ding baybayin na “Jeremot.”
    reason: lexical_alternative
  - marker: c
    text: Ang “Sebuel” ay maaari ding baybayin na “Subael.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לְ/הֵימָן
  choice: Para kay Heman
  rationale: Ang לְ ay nagpapahiwatig ng pagtatalaga sa loob ng talaan ng mga pangkat; natural itong ipinahahayag sa Filipino bilang “Para kay Heman.”
- source_word: בְּנֵי הֵימָן
  choice: ang mga anak ni Heman
  rationale: Karaniwang nangangahulugang “mga anak” ang בְּנֵי; ito ang pinakatuwirang salin sa konteksto ng talaan ng mga anak ni Heman.
- source_word: שְׁבוּאֵל
  choice: Sebuel
  rationale: Tuwirang transliterasyon na angkop sa palabaybayang Filipino; pinananatili sa talababa ang ibang posibleng anyo.
- source_word: וִֽ/ירִימוֹת
  choice: Jerimot
  rationale: Ipinapakita ng “Jerimot” ang patinig na i at hulaping -ot ng anyong Hebreo; hindi na kailangang isalin nang hiwalay ang waw dahil natural na ginagamit ang “at” bago ang huling pangalan sa listahang Filipino.
- source_word: גִדַּלְתִּי
  choice: Gidalti
  rationale: Bagaman maaaring magmukhang anyong pandiwa, gumaganap ito rito bilang pangalang pantangi sa talaan.
- source_word: וְ/רֹמַמְתִּי עֶזֶר
  choice: Romamti-ezer
  rationale: Sa konteksto ng talaan, pinakamainam itong unawain bilang tambalang pangalang pantangi; ipinakikita ng gitling ang pagkakaugnay ng dalawang bahagi.
theological_decisions:
- issue: Kung ang ilan sa mga anyo sa hulihan ng talata ay mga pangalan o bahagi ng isang makahulugang pangungusap
  choice: Ituring ang buong sunuran bilang talaan ng mga personal na pangalan
  alternative: Basahin ang ilan, lalo na ang Gidalti at Romamti-ezer, bilang pariralang pandiwa gaya ng “pinalaki ko at itinaas ko ang tulong”
  rationale: Ang agarang konteksto ay talaan ng mga anak at mga kasapi ng mga pangkat. Gayunman, binabanggit sa talababa ang tunay na posibilidad na mabasa bilang parirala ang ilan sa mga anyo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “sina” upang natural na ipakilala ang talaan ng mga pangalan, at iniangkop sa palabaybayang Filipino ang mga transliterasyon habang pinananatiling madaling makilala ang mga pangalang Hebreo.
