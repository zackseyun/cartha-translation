translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang maikli at pormulang anyo ng talaan; ang gitling bago ang “labindalawa” ay nagpapakitang ito ang kabuuang bilang ng naunang dalawang pangkat.
