translation:
  language: tl
  text: 'Para sa ikadalawampu''t tatlo[a]: si Mahazioth; ang kanyang mga anak na lalaki at mga kapatid na lalaki, labindalawa.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Sa ikadalawampu't tatlong lot, si Mahazioth.” Maaaring unawain ang panlaping pang-ukol bilang tanda ng pagkakatalaga sa pagkakasunod-sunod ng mga lot.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִשְׁלֹשָׁה וְעֶשְׂרִים
  choice: Para sa ikadalawampu't tatlo
  rationale: Sa talaan ng mga palabunutan, ang unlaping לְ ay nagpapahiwatig ng pagkakatalaga, at ang pariralang bilang ay gumaganap bilang ordinal na “ikadalawampu't tatlo.”
- source_word: לְמַחֲזִיאוֹת
  choice: si Mahaziot
  rationale: Pangalan ito ng tao kaya tinumbasan sa paraang transliterasyon. Ginamit ang “si” upang maging natural sa Tagalog, samantalang ang לְ ay kaugnay ng pagkakatalaga sa ayos ng palabunutan.
- source_word: בָּנָיו
  choice: ang kanyang mga anak na lalaki
  rationale: Tiyak na mga anak na lalaki ang kahulugan ng Hebreo, kaya hindi ginamit ang mas malawak na “mga anak.”
- source_word: וְאֶחָיו
  choice: at mga kapatid na lalaki
  rationale: Direktang tumutukoy ang salita sa mga kapatid na lalaki sa konteksto ng talaang ito.
- source_word: שְׁנֵים עָשָׂר
  choice: labindalawa
  rationale: Ito ang kabuuang bilang ng mga anak na lalaki at mga kapatid na lalaki ni Mahaziot sa pangkat.
