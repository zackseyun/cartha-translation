translation:
  language: tl
  text: 'Para sa ika-dalawampu''t apat[a]: si Romamti-ezer, ang kanyang mga anak na lalaki at kanyang mga kapatid, labindalawa.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
