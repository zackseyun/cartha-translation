lexical_decisions:
- source_word: לְ/אַרְבָּעָה וְ/עֶשְׂרִים
  choice: para sa ikadalawampu't apat
  rationale: Ang לְ ay nagpapahiwatig ng pagkakatalaga, at ang bilang ay ginagamit bilang ordinal ayon sa konteksto ng sunud-sunod na palabunutan. Hindi idinagdag sa pangunahing teksto ang salitang “palabunutan” sapagkat ipinahihiwatig lamang ito ng konteksto.
- source_word: לְ/רוֹמַמְתִּי עָזֶר
  choice: si Romamti-ezer
  rationale: Pangalang pantangi ito kaya tinumbasan sa pamamagitan ng transliterasyon; idinagdag ang pantukoy na “si” upang maging natural sa Tagalog.
- source_word: בָּנָיו
  choice: ang kanyang mga anak na lalaki
  rationale: Tiyak na tumutukoy ang Hebreo sa mga anak na lalaki, kaya hindi ginamit ang mas malawak na “mga anak.”
- source_word: וְ/אֶחָיו
  choice: at mga kapatid
  rationale: Ang literal na kahulugan ay “kanyang mga kapatid.” Hindi nilimitahan sa salitang “lalaki” sa Tagalog dahil sa roster na ito ay malinaw sa konteksto ang pangkat na tinutukoy, habang napapanatili ang natural na pananalita.
- source_word: שְׁנֵים עָשָׂר
  choice: labindalawa
  rationale: Ito ang kabuuang bilang ng grupo, gaya ng pormula sa buong seksiyon.
