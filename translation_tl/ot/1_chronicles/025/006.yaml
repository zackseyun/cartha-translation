  text: כָּל אֵ֣לֶּה עַל יְדֵי֩ אֲבִי/הֶ֨ם בַּ/שִּׁ֜יר בֵּ֣ית יְהוָ֗ה בִּ/מְצִלְתַּ֨יִם֙ נְבָלִ֣ים וְ/כִנֹּר֔וֹת לַ/עֲבֹדַ֖ת בֵּ֣ית הָ/אֱלֹהִ֑ים עַ֚ל יְדֵ֣י הַ/מֶּ֔לֶךְ אָסָ֥ף וִ/ידוּת֖וּן וְ/הֵימָֽן־־ס׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/025/006.yaml
  text: 'All these were under the direction of their father in the music of the house of Yahweh[a], with cymbals, harps, and lyres, for the service of the house of God, under the direction of the king: Asaph, Jeduthun[c][b], and Heman.'
translation:
  language: tl
  text: Ang lahat ng ito ay pinangangasiwaan ng kani-kanilang ama sa musikang[a] panlilingkod sa bahay ni Yahweh, na may mga pompiyang, mga alpa, at mga lira[b], para sa paglilingkod sa bahay ng Diyos; at sina Asaf, Jedutun, at Heman ay pinangangasiwaan ng hari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “sa awit” o “sa pag-awit.”
    reason: lexical_alternative
  - marker: b
    text: Hindi tiyak ang eksaktong pagkakaiba ng dalawang sinaunang instrumentong de-kuwerdas na isinaling “alpa” at “lira.”
    reason: cultural_note
lexical_decisions:
- source_word: עַל יְדֵי אֲבִיהֶם
  choice: nasa ilalim ng pamamahala ng kani-kanilang ama
  rationale: Ang idyomang literal na tumutukoy sa ‘kamay’ ay nagpapahayag dito ng pangangasiwa o pamamahala. Ang distributibong ‘kani-kanilang’ ay natural sa Tagalog at umaangkop sa tatlong pangkat na pinamumunuan ng kani-kanilang ama.
- source_word: בַּשִּׁיר
  choice: sa pag-awit
  rationale: Maaaring tumukoy ang שׁיר sa awit o sa gawaing pag-awit. Pinananatili ng ‘pag-awit’ ang tuwirang diwa at ang bahagyang ambiguwidad kung vocal o mas malawak na musikal na gawain ang tinutukoy.
- source_word: בֵּית יְהוָה
  choice: bahay ni Yahweh
  rationale: Pinananatili ang pormal na larawang ‘bahay’ at isinasalin ang banal na pangalang יהוה bilang Yahweh.
- source_word: בִּמְצִלְתַּיִם
  choice: na may mga pompiyang
  rationale: Instrumental ang gamit ng pang-ukol, at ang מְצִלְתַּיִם ay mga pompiyang na ginagamit sa musikang panambahang Israelita.
- source_word: נְבָלִים וְכִנֹּרוֹת
  choice: alpa, at lira
  rationale: Pinag-iiba ang dalawang sinaunang instrumentong de-kuwerdas sa pamamagitan ng karaniwang katumbas na ‘alpa’ at ‘lira,’ habang itinatala sa talababa na hindi tiyak ang eksaktong modernong pagkakakilanlan ng mga ito.
- source_word: לַעֲבֹדַת בֵּית הָאֱלֹהִים
  choice: para sa paglilingkod sa bahay ng Diyos
  rationale: Ang עֲבֹדָה ay tumutukoy sa gawain o paglilingkod, lalo na sa kontekstong panambahan. Ang ‘paglilingkod’ ay malinaw nang hindi nag-aangkat ng mas huling terminolohiyang pang-eklesiya.
- source_word: עַל יְדֵי הַמֶּלֶךְ
  choice: nasa ilalim ng pamamahala ng hari
  rationale: Gaya ng unang paglitaw ng idyoma, ipinahihiwatig nito ang pangangasiwa o awtoridad. Ang pag-uulit ng ‘nasa ilalim ng pamamahala’ ay sumasalamin sa pag-uulit sa Hebreo.
- source_word: אָסָף וִידוּתוּן וְהֵימָן
  choice: Asaf, Jedutun, at Heman
  rationale: Isinalin sa baybay na angkop at madaling bigkasin sa Filipino ang mga pangalang pantangi.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Tuwirang ginagamit ng teksto ang Tetragrammaton. Pinananatili ng ‘Yahweh’ ang personal na pangalang tipan sa halip na palitan ito ng titulo.
- issue: Ugnayan ng hari kina Asaf, Jedutun, at Heman
  choice: Sina Asaf, Jedutun, at Heman ay nasa ilalim ng pamamahala ng hari
  alternative: sa ilalim ng pamamahala ng hari—Asaf, Jedutun, at Heman
  rationale: Siksik at maaaring pagmulan ng maling pag-uugnay ang ayos ng Hebreo. Ginawang hiwalay na pangungusap upang malinaw na ang tatlong ama ang nasa ilalim ng pangangasiwa ng hari, nang hindi ipinapalagay na sila ang mga hari o na ang hari ang direktang ama ng lahat.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang ‘bahay’ sa halip na ‘templo’ upang mapanatili ang konkretong larawan ng Hebreo, at ‘pamamahala’ upang natural na maipahayag ang idyomang ‘sa ilalim ng kamay.’
