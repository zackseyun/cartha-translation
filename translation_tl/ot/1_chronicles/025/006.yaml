revisions:
- from: Ang lahat ng ito ay nasa ilalim ng pamamahala ng kani-kanilang ama sa pag-awit[a] sa bahay ni Yahweh, na may mga pompiyang, alpa, at lira[b], para sa paglilingkod sa bahay ng Diyos. Sina Asaf, Jedutun, at Heman ay nasa ilalim ng pamamahala ng hari.
  to: Ang lahat ng ito ay pinangangasiwaan ng kani-kanilang ama sa musikang[a] panlilingkod sa bahay ni Yahweh, na may mga pompiyang, mga alpa, at mga lira[b], para sa paglilingkod sa bahay ng Diyos; at sina Asaf, Jedutun, at Heman ay pinangangasiwaan ng hari.
  rationale: Pinalitan ang “sa pag-awit” ng “sa musikang panlilingkod” upang maipahayag ang mas malawak na diwa ng שִׁיר sa kontekstong may mga instrumento. Ginawang magkakaugnay ang pangwakas na pagtukoy kina Asaf, Jedutun, at Heman at sa hari, habang pinananatili ang maingat na paglilinaw na sila ang nasa ilalim ng pangangasiwa ng hari. Idinagdag ang “mga” sa bawat uri ng instrumento upang malinaw na maipakita ang mga pangmaramihang anyo sa Hebreo.
