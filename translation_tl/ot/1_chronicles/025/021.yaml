translation:
  language: tl
  text: Ang ikalabing-apat ay kay Matitias[a], kasama ang kanyang mga anak na lalaki at mga kapatid na lalaki; labindalawa silang lahat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa literal: “Para sa ikalabing-apat, si Matitias.” Sa konteksto ng talaang ito, ang bilang ay tumutukoy sa ikalabing-apat na palabunutan o pangkat.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְאַרְבָּעָה עָשָׂר
  choice: Ang ikalabing-apat ay para kay
  rationale: Sa paulit-ulit na pormula ng kabanata, ang לְ na sinusundan ng bilang ay tumutukoy sa pagkakaloob ng ika-labing-apat na palabunutan o pangkat. Natural sa Filipino ang “ay para kay,” habang hindi tahasang idinaragdag sa pangunahing teksto ang salitang “palabunutan,” na ipinahihiwatig lamang ng konteksto.
- source_word: מַתִּתְיָהוּ
  choice: Matitias
  rationale: Ginamit ang kinagawiang anyong Filipino ng pangalang biblikal na Mattithiah.
- source_word: בָּנָיו
  choice: kanyang mga anak na lalaki
  rationale: Tiyak na mga anak na lalaki ang kahulugan ng Hebreo, kaya hindi ginamit ang mas malawak na “mga anak.”
- source_word: וְאֶחָיו
  choice: at sa kanyang mga kapatid
  rationale: Ang “mga kapatid” ang natural na modernong salin sa Filipino; sa kontekstong Hebreo, mga lalaking kapatid o kasamahan sa pangkat ang tinutukoy.
- source_word: שְׁנֵים עָשָׂר
  choice: labindalawa silang lahat
  rationale: Ipinahahayag nito ang kabuuang bilang ng pangkat. Nilinaw ng “silang lahat” ang tungkulin ng bilang sa natural na Filipino nang hindi binabago ang diwa.
