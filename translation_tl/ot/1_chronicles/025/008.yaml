base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/025/008.yaml
  text: And they cast lots for duties[a], the small as well as the great[b], the teacher with the student.
translation:
  language: tl
  text: Nagpalabunutan sila para sa kani-kanilang tungkulin—ang mababa gayundin ang mataas[a], ang bihasa kasama ng mag-aaral.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “ang maliit gaya ng malaki,” isang idyomang tumutukoy sa magkapantay na pagtrato anuman ang ranggo o katayuan.
    reason: cultural_note
  - marker: b
    text: Ang “bihasa” ay maaari ring isaling “ang nakauunawa” o, ayon sa ugnayan nito sa mag-aaral, “ang guro.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּפִּילוּ גּוֹרָלוֹת
  choice: Nagpalabunutan sila
  rationale: Ang Hiphil ng נפל kasama ng גּוֹרָלוֹת ay idyoma para sa pagtatakda sa pamamagitan ng palabunutan. Likas at malinaw sa modernong Filipino ang pandiwang “nagpalabunutan.”
- source_word: מִשְׁמֶרֶת
  choice: para sa kani-kanilang tungkulin
  rationale: Sa konteksto ng paglilingkod na pangmusika sa templo, tumutukoy ito sa nakatalagang tungkulin o turno. Ipinahihiwatig ng “kani-kanilang” na ang palabunutan ang nagtakda ng takdang gawain, bagaman walang tahasang panghalip na paari sa Hebreo.
- source_word: לְעֻמַּת
  choice: gayundin
  rationale: Dito ay ipinapakita nito ang magkatumbas na paglahok ng dalawang pangkat, hindi lokasyong magkaharap.
- source_word: כַּקָּטֹן כַּגָּדוֹל
  choice: ang mababa gayundin ang mataas
  rationale: Pinananatili nito ang Hebreong pares na tumutukoy sa katayuan o ranggo, sa halip na ipakahulugang edad gaya ng “bata at matanda.”
- source_word: מֵבִין
  choice: ang bihasa
  rationale: Literal itong “ang nakauunawa” at sa kontekstong pangmusika ay malamang na tumutukoy sa taong may kaalaman o kasanayan. Mas pinananatili ng “bihasa” ang leksikal na lawak kaysa tiyak na “guro.”
- source_word: עִם תַּלְמִיד
  choice: kasama ng mag-aaral
  rationale: Direktang inuugnay ng עִם ang bihasa sa תַּלְמִיד, isang nag-aaral o tinuturuan. Ang “mag-aaral” ay natural at hindi nag-aangkat ng ibang relihiyosong kahulugan ng “alagad.”
theological_decisions: []
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “palabunutan” bilang likas na katumbas ng paghahagis ng mga palabunot, at pinanatili ang pagkakaiba ng katayuan at antas ng kasanayan nang hindi ito nililimitahan sa edad o pormal na pagiging guro.
