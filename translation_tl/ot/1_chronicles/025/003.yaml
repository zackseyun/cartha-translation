revisions:
- from: 'Para kay Jedutun: ang mga anak ni Jedutun—sina Gedalias, Zeri, Isaias, Hasabias, at Matitias—anim[a], sa ilalim ng pamamahala ng kanilang amang si Jedutun, na nagpropesiya sa saliw ng lira sa pagpapasalamat at pagpupuri kay Yahweh.[b]'
  to: 'Para kay Jedutun: ang mga anak ni Jedutun—sina Gedalias, Zeri, Isaias, Hasabias, at Matitias—anim[a], sa ilalim ng patnubay ng kanilang amang si Jedutun, na nagpropesiya sa saliw ng lira sa pagpapasalamat at pagpupuri sa PANGINOON.[b]'
  rationale: Pinalitan ang “Yahweh” ng “PANGINOON” sa teksto at talababa upang umayon sa nakasaad na POB rendering ng tetragrammaton. Pinalitan din ang “pamamahala” ng “patnubay” bilang mas likas na Filipino para sa pangangasiwa o direksiyong ipinahihiwatig ng Hebreo. Pinanatili ang “anim” at ang talababa nito upang hindi takpan ang tekstuwal na suliranin, at pinanatili ang “nagpropesiya” upang igalang ang terminolohiyang propetiko ng pinagmulan.
