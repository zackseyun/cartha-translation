  text: לִ/ידוּת֑וּן בְּנֵ֣י יְדוּת֡וּן גְּדַלְיָ֡הוּ וּ/צְרִ֡י וִֽ֠/ישַׁעְיָהוּ חֲשַׁבְיָ֨הוּ וּ/מַתִּתְיָ֜הוּ שִׁשָּׁ֗ה עַל֩ יְדֵ֨י אֲבִי/הֶ֤ם יְדוּתוּן֙ בַּ/כִּנּ֔וֹר הַ/נִּבָּ֕א עַל הֹד֥וֹת וְ/הַלֵּ֖ל לַ/יהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/025/003.yaml
  text: 'Of Jeduthun: the sons of Jeduthun—Gedaliah, Zeri, Jeshaiah, Hashabiah, and Mattithiah, six—under the direction of their father Jeduthun, who prophesied with the lyre in giving thanks and praise to Yahweh.'
translation:
  language: tl
  text: 'Para kay Jedutun: ang mga anak ni Jedutun—sina Gedalias, Zeri, Isaias, Hasabias, at Matitias—anim[a], sa ilalim ng patnubay ng kanilang amang si Jedutun, na nagpropesiya sa saliw ng lira sa pagpapasalamat at pagpupuri sa PANGINOON.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Limang pangalan lamang ang nakatala sa tekstong Hebreo, ngunit kasunod nito ang salitang “anim.” Ipinapalagay ng ilan na may isang anak na hindi naisama sa talaan, o na kabilang sa bilang si Jedutun mismo.
    reason: textual_variant
  - marker: b
    text: 'Maaari ring isalin: “na nagpopropesiya sa saliw ng lira para sa pagpapasalamat at pagpupuri sa PANGINOON.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִידוּתוּן
  choice: Para kay Jedutun
  rationale: Ang lamed ay nagpapakilala sa pangkat o bahagi ni Jedutun sa talaan; natural at maikli sa Filipino ang “Para kay Jedutun.”
- source_word: בְּנֵי יְדוּתוּן
  choice: ang mga anak ni Jedutun
  rationale: Pinananatili ang tuwirang katawagang pampamilya, na sa konteksto ay maaari ring tumukoy sa kaniyang sambahayan o angkan na naglilingkod bilang mga musikero.
- source_word: גְּדַלְיָהוּ וּצְרִי וִישַׁעְיָהוּ חֲשַׁבְיָהוּ וּמַתִּתְיָהוּ
  choice: Gedalias, Zeri, Isaias, Hasabias, at Matitias
  rationale: Ginamit ang mga anyong pangalang pamilyar at likas sa tradisyong Filipino habang malinaw na kinakatawan ang limang pangalang Hebreo.
- source_word: שִׁשָּׁה
  choice: anim
  rationale: Tahasang sinasabi ng tekstong Hebreo na “anim,” kaya pinanatili ito kahit limang pangalan lamang ang nakatala; ipinaliliwanag ang suliranin sa talababa.
- source_word: עַל יְדֵי אֲבִיהֶם
  choice: sa ilalim ng pamamahala ng kanilang ama
  rationale: Ang idyomang “sa pamamagitan/sa kamay ng” ay nagpapahiwatig dito ng pangangasiwa o pamumuno sa gawaing pangmusika.
- source_word: בַּכִּנּוֹר
  choice: sa saliw ng lira
  rationale: Ang כִּנּוֹר ay isang sinaunang lira, hindi tiyak na modernong alpa; ipinahahayag ng “sa saliw” ang paggamit nito sa gawaing musikal.
- source_word: הַנִּבָּא
  choice: na nagpropesiya
  rationale: Pinananatili ang karaniwang diwa ng pandiwang נבא at ang tahasang pag-uugnay ng Cronista sa musika at gawaing propetiko.
- source_word: עַל הֹדוֹת וְהַלֵּל
  choice: sa pagpapasalamat at pagpupuri
  rationale: Pinananatili ang dalawang kilos at ang maaaring ugnayan ng nilalaman o layunin sa pagpopropesiya sa pamamagitan ng musika.
- source_word: לַיהוָה
  choice: kay Yahweh
  rationale: Tuwirang kinakatawan ang personal na pangalang יהוה alinsunod sa ibinigay na konsultasyong teksto at nang hindi ito pinapalitan ng isang titulo.
theological_decisions:
- issue: Kahulugan ng musikal na “pagpopropesiya” sa pagsamba
  choice: nagpropesiya
  alternative: tumugtog ng musikang kinasihan / umawit nang propetiko
  rationale: Tahasang gumagamit ang Cronista ng terminolohiyang propetiko para sa mga musikero. Pinananatili ng salin ang teolohikal na tensiyon sa halip na ipakahulugan ito bilang karaniwang pagtatanghal lamang.
- issue: Ugnayan ng pagpopropesiya, lira, pagpapasalamat, at pagpupuri
  choice: nagpropesiya sa saliw ng lira sa pagpapasalamat at pagpupuri
  alternative: nagpopropesiya sa saliw ng lira para sa pagpapasalamat at pagpupuri
  rationale: Hindi ganap na tinutukoy ng עַל kung nilalaman, paraan, o layunin ang pasasalamat at papuri; pinananatili sa pangunahing teksto ang isang natural ngunit hindi labis na mapagpasiyang ugnayan, at ibinibigay ang alternatibo sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang anyong talaan ng talata, ang tahasang salungatan sa bilang, at ang terminong “nagpropesiya.” Ginamit ang “lira” bilang mas tiyak na katawagan sa sinaunang instrumentong כִּנּוֹר.
