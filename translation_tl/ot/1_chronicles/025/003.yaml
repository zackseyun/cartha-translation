  source_fidelity: Tumpak na naipapahayag ng draft ang limang pangalang nakalista, ang problematikong bilang na “anim,” ang pangangasiwa ni Jedutun, at ang pagpopropesiya na kaugnay ng lira, pasasalamat, at papuri. Gayunman, ang יהוה ay dapat isalin bilang “PANGINOON,” alinsunod sa English POB audit trail, sa halip na transliterahing “Yahweh.”
  naturalness: Malinaw at marangal ang Filipino. Ang “sa ilalim ng patnubay” ay mas natural at mas malapit sa diwa ng idiomang עַל־יְדֵי kaysa “sa ilalim ng pamamahala,” na maaaring magpahiwatig ng mas malawak na administratibong awtoridad.
  terminology: Ang “nagpropesiya,” “lira,” at mga tradisyonal na anyo ng mga pangalan ay angkop. Ginawang “PANGINOON” ang banal na pangalan upang maging pare-pareho sa itinakdang POB rendering ng יהוה.
