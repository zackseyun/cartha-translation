  text: for the twenty-first[a], Hothir; his sons and his brothers, twelve.
translation:
  language: tl
  text: Ang ikadalawampu't isa[a] ay para kay Hotir; ang kanyang mga anak na lalaki at mga kapatid niyang lalaki—labindalawa lahat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “para sa isa at dalawampu, para kay Hotir.” Ipinakikita ng anyong Hebreo ang pagkakasunod-sunod ng palabunutan sa kabanatang ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְ/אֶחָד וְ/עֶשְׂרִים
  choice: Ang ikadalawampu't isa
  rationale: Ipinahihiwatig ng konteksto ang pagkakasunod-sunod ng palabunutan. Hindi idinagdag sa pangunahing teksto ang salitang “palabunutan” sapagkat wala itong tahasang katumbas sa talata.
- source_word: לְ/הוֹתִיר
  choice: ay para kay Hotir
  rationale: Pangalang pantangi ang הוֹתִיר, at ang unlaping לְ ay likas na isinalin bilang “para kay” sa talaan ng mga naatasan sa pamamagitan ng palabunutan.
- source_word: בָּנָיו
  choice: ang kanyang mga anak na lalaki
  rationale: Tiyak na mga anak na lalaki ang tinutukoy ng בנים sa kontekstong ito, kaya hindi ito ginawang pangkalahatang “mga anak.”
- source_word: וְאֶחָיו
  choice: at mga kapatid na lalaki
  rationale: Pinanatili ang literal na kahulugang “mga kapatid na lalaki”; bagaman maaari itong tumukoy nang mas malawak sa mga kamag-anak o kasamahan sa ganitong talaan, hindi iyon malinaw na hinihingi ng konteksto.
- source_word: שְׁנֵים עָשָׂר
  choice: labindalawa lahat
  rationale: Ito ang kabuuang bilang ng mga anak na lalaki at mga kapatid na lalaki. Nilinaw ng “lahat” ang tungkuling pambilang nang hindi dinaragdagan ang diwa.
theological_decisions: []
translation_notes:
  register: Makabagong Filipino na marangal at madaling maunawaan. Ginamit ang natural na ordinal na “ikadalawampu't isa,” habang pinanatili sa talababa ang literal na ayos ng Hebreo. Ang gitling-pahaba ay naghihiwalay sa pangkat at sa kabuuang bilang nito.
