  naturalness: Likas at angkop sa marangal na modernong Tagalog ang estruktura ng pangungusap at ang “labindalawa silang lahat.” Ang pagdaragdag ng “kasama ang” ay maingat na paraan upang maging malinaw ang bumubuo sa pangkat. Ang dating pananalita sa talababa na “ikalabing-anim na palabunutan” ay hindi gaanong natural, dahil ang “palabunutan” ay karaniwang tumutukoy sa proseso, hindi sa nakatalagang lot o bahagi.
