  text: The sixteenth was for Hananyahu[a], his sons and his brothers[b], twelve.
translation:
  language: tl
  text: Ang ikalabing-anim[a] ay para kay Hananyahu, kasama ang kanyang mga anak na lalaki at mga kapatid na lalaki—labindalawa silang lahat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa konteksto, maaari ring gawing mas tahas: “Ang ikalabing-anim na bunutan ay para kay Hananyahu.” Ipinahihiwatig ng mga nakapaligid na talata ang “bunutan,” ngunit hindi ito tahasang nakasaad sa Hebreo ng talatang ito.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְשִׁשָּׁה עָשָׂר
  choice: Ang ikalabing-anim ay para kay
  rationale: Ipinahihiwatig ng לְ at ng ordinal na parirala ang pagkakatalaga ayon sa sunod-sunod na palabunutan. Hindi isinama sa pangunahing teksto ang “palabunutan” dahil wala itong tahasang katumbas sa talata.
- source_word: לַחֲנַנְיָהוּ
  choice: Hananyahu
  rationale: Transliterasyon ito na malapit sa anyong Hebreo na חֲנַנְיָהוּ at hindi isinasalin ang kahulugan ng pangalang pantangi.
- source_word: בָּנָיו
  choice: kanyang mga anak na lalaki
  rationale: Tiyak na mga anak na lalaki ang tinutukoy ng בָּנִים sa konteksto ng talaan.
- source_word: וְאֶחָיו
  choice: at mga kapatid
  rationale: Ang tuwirang kahulugan ng אָח ay kapatid; sa ganitong talaan maaari rin itong tumukoy sa malalapit na lalaking kamag-anak o kasamahan, ngunit “mga kapatid” ang pinakatapat na salin.
- source_word: שְׁנֵים עָשָׂר
  choice: labindalawa silang lahat
  rationale: Ibinibigay ng bilang ang kabuuang dami ng pangkat. Ang “silang lahat” ay likas sa Tagalog at malinaw na iniuugnay ang labindalawa sa naunang pangkat.
theological_decisions:
- issue: Saklaw ng bilang na labindalawa
  choice: Inilahad bilang kabuuang bilang ng pangkat ni Hananyahu.
  alternative: Maaaring basahin ang bilang na para lamang sa kanyang mga anak at mga kapatid.
  rationale: Sa paulit-ulit na pormula ng kabanata, ang labindalawa ang bilang ng buong pangkat na nakatalaga sa bawat pinuno; hindi ito isang natatanging doktrinal na pagpapakahulugan.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang maikling anyo ng talaan, habang ginamit ang “kasama” at “silang lahat” upang maging natural at hindi putol ang pangungusap sa Tagalog.
