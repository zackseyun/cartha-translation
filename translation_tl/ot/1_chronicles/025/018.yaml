translation:
  language: tl
  text: Ang ikalabing-isang bahagi ay napunta kay Azarel[a], sa kanyang mga anak na lalaki at mga kapatid niyang lalaki—labindalawa silang lahat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, Azareel.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַשְׁתֵּי עָשָׂר
  choice: ika-labing-isa
  rationale: 'Ang anyong Hebreo ay nangangahulugang labing-isa; sa konteksto ng sunud-sunod na palabunutan, ginagamit ito bilang ordinal: “ika-labing-isa.”'
- source_word: עֲזַרְאֵל
  choice: Azarel
  rationale: Isinalin sa pamamagitan ng transliterasyon ang pangalang pantangi; pinananatili ng “Azarel” ang anyo ng pangalang Hebreo sa natural na baybay para sa Filipino.
- source_word: בָּנָיו
  choice: kanyang mga anak
  rationale: Sa kontekstong ito, tumutukoy ang Hebreo sa kanyang mga anak na lalaki. Natural sa Filipino ang “mga anak,” at malinaw sa talaang ito na mga lalaking mang-aawit ang tinutukoy.
- source_word: וְאֶחָיו
  choice: at mga kapatid
  rationale: Direktang katumbas ng Hebreo ang “mga kapatid”; maaaring saklawin ng salita sa ganitong talaan ang malalapit na lalaking kamag-anak o kasamahan, kaya hindi dinagdagan ng mas tiyak na paliwanag sa pangunahing teksto.
- source_word: שְׁנֵים עָשָׂר
  choice: labindalawa silang lahat
  rationale: Ipinahihiwatig ng pangwakas na bilang ang kabuuang dami ng pangkat ni Azarel; ang “silang lahat” ay natural na Filipino para sa eliptikong pahayag ng Hebreo.
