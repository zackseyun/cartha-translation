translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Idinagdag ang “bahagi ay napunta” upang maipahayag ang eliptikong balangkas ng talaan ng mga palabunutan. Sinunod ang Hebreong bilang na “ika-labing-isa,” sa halip na ang “the twelfth” ng English consultation layer, sapagkat עַשְׁתֵּי עָשָׂר at ang pagkakasunod-sunod ng konteksto ay kapwa tumutukoy sa ikalabing-isang bahagi.
