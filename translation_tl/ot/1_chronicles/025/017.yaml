translation:
  language: tl
  text: Ang ikasampu[a] ay napunta kay Shimei; ang kanyang mga anak na lalaki at mga kapatid na lalaki ay labindalawa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas tahasang ayon sa konteksto, “Ang ikasampung palabunot ay napunta kay Shimei.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעֲשִׂירִי
  choice: ang ikasampu
  rationale: Ang may-artikulong ordinal ay nagpapatuloy sa pagkakasunod-sunod ng mga palabunutan o pangkat sa konteksto. Hindi na kailangang ulitin sa pangunahing teksto ang salitang “palabunutan,” sapagkat malinaw ito sa talaan.
- source_word: שִׁמְעִי
  choice: Shimei
  rationale: Pangalan ng tao; tinumbasan sa pamamagitan ng transliterasyong karaniwang ginagamit sa mga saling Filipino.
- source_word: בָּנָיו
  choice: ang kanyang mga anak na lalaki
  rationale: Tiyak na “mga anak na lalaki” ang kahulugan dito, na angkop sa talaang ito.
- source_word: וְאֶחָיו
  choice: at mga kapatid na lalaki
  rationale: Ito ang tuwiran at karaniwang kahulugan. Bagaman maaari itong tumukoy nang mas malawak sa mga lalaking kamag-anak o kasapi ng angkan sa ganitong konteksto, hindi iyon tahasang nilinaw sa Hebreo.
- source_word: שְׁנֵים עָשָׂר
  choice: labindalawa
  rationale: Karaniwang bilang na tumutukoy sa kabuuang dami ng mga anak at kapatid na lalaking kaugnay ni Shimei.
