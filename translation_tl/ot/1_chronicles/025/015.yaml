  text: Ang ikawalo ay kay Jesaias; ang kanyang mga anak na lalaki at mga kapatid na lalaki ay labindalawa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַשְּׁמִינִי
  choice: ang ikawalo
  rationale: May tiyak na pantukoy ang bilang na panunuran at gumaganap itong bahagi ng talaan ng mga napili sa pamamagitan ng palabunutan. Hindi isinama sa pangunahing teksto ang salitang “palabunot” sapagkat ipinahihiwatig lamang ito ng konteksto at wala sa mismong talata.
- source_word: יְשַׁעְיָהוּ
  choice: Jesaias
  rationale: Isinatinig ang pangalang Hebreo sa anyong pamilyar at likas sa makabagong gamit sa Bibliyang Tagalog.
- source_word: בָּנָיו
  choice: ang kanyang mga anak na lalaki
  rationale: Tiyak na tumutukoy ang בנים sa mga anak na lalaki sa kontekstong ito, kaya pinanatili ang kasarian ng salitang Hebreo.
- source_word: וְאֶחָיו
  choice: at mga kapatid na lalaki
  rationale: Ang אחים ay tuwirang nangangahulugang mga kapatid na lalaki rito; walang sapat na dahilan sa konteksto upang palawakin ito bilang mga kamag-anak o kasamahan.
- source_word: שְׁנֵים עָשָׂר
  choice: labindalawa
  rationale: Ibinibigay ng bilang ang kabuuang dami ng pangkat. Pinanatili ang maikli at parang-talaang ayos ng Hebreo nang hindi nagdaragdag ng pandiwa.
