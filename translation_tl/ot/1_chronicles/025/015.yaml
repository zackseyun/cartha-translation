    rationale: Ang dash construction na walang pandiwa ay masyadong putol sa modernong Filipino. Ang pagdaragdag ng “ay” ay hindi nagdaragdag ng bagong kahulugan; nililinaw lamang nito ang predikasyong ipinahihiwatig ng Hebreo.
  - severity: low
