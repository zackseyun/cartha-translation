  source_fidelity: Tumpak na naipapahayag ng draft ang ordinal na “ang ikawalo,” ang pangalang Jesaias, ang “mga anak na lalaki,” “mga kapatid na lalaki,” at ang kabuuang labindalawa. Gayunman, ang kasalukuyang bantas ay nag-iiwan sa huling parirala na hindi ganap na malinaw sa Filipino; ligtas na idagdag ang “ay” upang ipakita na ang labindalawa ang bilang ng pangkat, gaya ng ipinahihiwatig ng Hebreo.
  naturalness: 'Ang “ang ikawalo ay kay Jesaias” ay katanggap-tanggap sa pormulang talaan. Mas natural at malinaw ang pangungusap kung ang bilang ay may hayag na pang-ugnay: “ang kanyang mga anak na lalaki at mga kapatid na lalaki ay labindalawa.” Hindi likas ang “palabunot” bilang katawagan para sa isang lot sa footnote.'
  terminology: Ang “mga anak na lalaki” at “mga kapatid na lalaki” ay wastong gender-accurate na katumbas. Ang Jesaias ay katanggap-tanggap na anyo ng pangalan sa Filipino. Para sa ipinahihiwatig na “lot,” mas malinaw ang “kapalaran” sa paliwanag kaysa “palabunot,” na karaniwang tumutukoy sa proseso o paraan ng pagpili.
