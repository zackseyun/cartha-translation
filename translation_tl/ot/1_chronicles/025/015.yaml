    rationale: Ang “palabunot” ay mas karaniwang tawag sa pamamaraan ng pagkuha sa bunutan, hindi sa mismong lot/allotment. Ang “kapalaran” ay mas angkop na maikling pantukoy sa lot sa ganitong talaan.
