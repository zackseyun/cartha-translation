  text: For the seventeenth[a], Joshbekashah, his sons and his brothers, twelve.
translation:
  language: tl
  text: Para sa ikalabimpito[a], kay Jasbekasa, ang kanyang mga anak na lalaki at ang kanyang mga kapatid na lalaki—labindalawa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “para sa ikalabimpito, kay Jasbekasa”; ipinahihiwatig ng konteksto ang “kapalaran” o “pangkat.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לְשִׁבְעָה עָשָׂר
  choice: Para sa ikalabimpito
  rationale: Sa talaang ito, ang לְ kasama ng bilang na panunuran ay nagpapahiwatig ng pagkakatalaga ayon sa pagkakasunod-sunod. Hindi tahasang binanggit sa Hebreo ang “palabunutan” o “pangkat,” kaya pinanatili itong ipinahiwatig at ipinaliwanag sa talababa.
- source_word: לְיָשְׁבְּקָשָׁה
  choice: kay Jasbekasa
  rationale: Ang pang-ukol na לְ ay tumutukoy sa taong pinaglaanan ng ikalabimpitong pagkakatalaga; likas sa Tagalog ang “kay” bago ang pangalan.
- source_word: בָּנָיו
  choice: ang kanyang mga anak na lalaki
  rationale: Tiyak na mga anak na lalaki ang tinutukoy ng בנים sa kontekstong ito, kaya hindi ginamit ang mas malawak na “mga anak.”
- source_word: וְאֶחָיו
  choice: at ang kanyang mga kapatid na lalaki
  rationale: Ang אחים ay tuwirang nangangahulugang mga kapatid na lalaki, bagaman maaari rin itong tumukoy sa malalapit na lalaking kamag-anak sa ilang konteksto.
- source_word: שְׁנֵים עָשָׂר
  choice: labindalawa
  rationale: Ito ang kabuuang bilang ng grupong binubuo ni Jasbekasa, ng kanyang mga anak na lalaki, at ng kanyang mga kapatid na lalaki.
theological_decisions: []
translation_notes:
  register: Makabago at marangal na Filipino. Ginamit ang gitling bago ang “labindalawa” upang malinaw na ipakilala ang kabuuang bilang habang pinananatili ang maikling anyo ng talaan sa Hebreo.
