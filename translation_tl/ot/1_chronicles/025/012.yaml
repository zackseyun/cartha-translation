  terminology: Ang “Netanias” ay katanggap-tanggap na anyong Filipino ng pangalan. Ang “mga anak na lalaki” ay wastong katumbas ng בָּנָיו. Sa talababa, mas likas ang “kapalaran” kaysa “palabunutan” bilang katawagang tumutukoy sa lot sa konteksto ng talaan.
