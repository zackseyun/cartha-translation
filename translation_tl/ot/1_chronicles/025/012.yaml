  text: The fifth was Nethaniah[a]; his sons and his brothers were twelve.
translation:
  language: tl
  text: Ang ikalima ay si Netanias[a]; labindalawa ang kanyang mga anak na lalaki at mga kapatid niyang lalaki.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, ayon sa konteksto, “Ang ikalimang kapalaran ay para kay Netanias; labindalawa ang kanyang mga anak na lalaki at mga kapatid niyang lalaki.” Hindi tahasang nakasulat sa Hebreo ang mga salitang tulad ng “kapalaran” o “ay para kay”; ipinahihiwatig ang mga ito ng nakapaligid na talaan.
    reason: alternative_reading
lexical_decisions:
- source_word: הַחֲמִישִׁי
  choice: Ang ikalima
  rationale: Tiyak na pang-uring pamilang na ginagamit nang patalinghaga sa talaan; hindi tahasang binabanggit sa talata ang “palabunutan” o “pangkat,” kaya hindi iyon idinagdag sa pangunahing teksto.
- source_word: נְתַנְיָהוּ
  choice: Netanias
  rationale: Isinalin sa karaniwang anyong Tagalog ang personal na pangalang Hebreo.
- source_word: בָּנָיו
  choice: kanyang mga anak na lalaki
  rationale: Ang panlalaking maramihan ng בֵּן na may hulaping panghalip ay tumutukoy rito sa kanyang mga anak na lalaki.
- source_word: וְאֶחָיו
  choice: at mga kapatid
  rationale: Ang אחים ay karaniwang nangangahulugang mga kapatid na lalaki; sa likas na gamit ng modernong Tagalog, sapat ang “mga kapatid” sa kontekstong ito.
- source_word: שְׁנֵים עָשָׂר
  choice: labindalawa
  rationale: Ito ang kabuuang bilang ng kanyang mga anak na lalaki at mga kapatid sa pormula ng talaan.
