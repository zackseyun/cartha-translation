    rationale: Ang Hebreong וְאֶחָיו ay “at ang kanyang mga kapatid na lalaki.” Sa modernong Filipino, maaaring kabilang sa “mga kapatid” ang lahat ng kasarian; kailangang linawin ang panlalaking saklaw upang mapanatili ang pagkakaiba ng pinagmulan.
  - severity: low
    issue: Medyo di-likas ang “ikalimang palabunutan” sa talababa.
    rationale: Ang “kapalaran” ay mas maikli at mas karaniwang katumbas para sa inferred na “lot” sa ganitong talaan, nang hindi ipinipilit na literal na nasa talata ang salita.
