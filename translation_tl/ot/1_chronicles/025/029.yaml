translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang maikli at siksik na anyo ng Hebreong talaan, ngunit idinagdag ang “bahagi” sa pangunahing teksto para sa natural na pagbasa; inilalahad sa talababa ang mas tahasang “palabunot.”
