  text: 'For the twenty-second[a], to Giddalti: his sons and his brothers, twelve.'
translation:
  language: tl
  text: 'Ang ikadalawampu’t dalawa[a] ay para kay Giddalti: ang kanyang mga anak na lalaki at mga kapatid niya, labindalawa.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O, “Para sa ikadalawampu’t dalawang kapalaran, kay Giddalti: ang kanyang mga anak na lalaki at mga kapatid niya, labindalawa.” Pinaikli ang estilo ng talaan sa Hebreo, at ipinahihiwatig ng konteksto ang “kapalaran.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִשְׁנַיִם וְעֶשְׂרִים
  choice: Ang ikadalawampu't dalawang bahagi
  rationale: Sa sunod-sunod na talaan ng kabanata, tumutukoy ang parirala sa ika-22 atas ayon sa palabunutan. Ginamit ang ordinal na likas sa Filipino; ang “bahagi” ay malinaw sa konteksto ngunit tinandaan sa talababa dahil ipinahihiwatig lamang ito ng Hebreo.
- source_word: לְגִדַּלְתִּי
  choice: ay kay Gidalti
  rationale: Ipinahahayag ng prefixed ל ang pagkakatalaga ng bahaging ito kay Gidalti. Ang “kay” ang natural na pananda ng pag-uukol sa Filipino.
- source_word: בָּנָיו
  choice: ang kanyang mga anak na lalaki
  rationale: Tiyak na mga anak na lalaki ang kahulugan ng Hebreong plural, kaya hindi ito pinalawak bilang mga anak sa pangkalahatan.
- source_word: וְאֶחָיו
  choice: at mga kapatid
  rationale: Pinanatili ang karaniwang kahulugan na mga kapatid; sa kontekstong ito ng pangkat ng mga lalaking mang-aawit, nauunawaan ang panlalaking sanggunian nang hindi kailangang ulitin ang “na lalaki.”
- source_word: שְׁנֵים עָשָׂר
  choice: labindalawa
  rationale: Ang panghuling bilang ang kabuuang dami ng pangkat. Pinanatili ang maikling appositional na estilo ng talaang Hebreo nang hindi nagdaragdag ng pandiwang wala sa teksto.
