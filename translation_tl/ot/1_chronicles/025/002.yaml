base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/025/002.yaml
  text: 'Of the sons of Asaph: Zaccur[a], Joseph, Nethaniah, and Asharelah, sons of Asaph, under the direction of Asaph, who prophesied under the direction of the king.'
translation:
  language: tl
  text: 'Sa mga anak ni Asaf: sina Zacur, Jose, Netanias, at Asarela. Mga anak sila ni Asaf at nasa ilalim ng pamamahala ni Asaf.[a] Nagpropesiya si Asaf sa ilalim ng pamamahala ng hari.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “sa kamay ni Asaf … sa kamay ng hari.” Ang idyomang Hebreo ay maaaring tumukoy sa pagkilos sa pamamagitan ng isang tao, pangangasiwa, o pamamahala.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי
  choice: Sa mga anak ni
  rationale: Sa konteksto ng talaan, ipinakikilala ng לִ ang pangkat na inililista. Likas sa Filipino ang “Sa mga anak ni” bilang panimula ng isang dibisyon sa talaan.
- source_word: אָסָף
  choice: Asaf
  rationale: Pangngalang pantangi; isinalin sa karaniwang anyong madaling bigkasin at makilala sa Filipino.
- source_word: זַכּוּר
  choice: Zacur
  rationale: Pangngalang pantangi; tinumbasan ayon sa tunog ng Hebreo sa anyong angkop sa ortograpiyang Filipino.
- source_word: יוֹסֵף
  choice: Jose
  rationale: Ginamit ang nakagawiang anyong Filipino ng pangalang ito.
- source_word: נְתַנְיָה
  choice: Netanias
  rationale: Pangngalang pantangi; pinanatili ang pagkakakilanlan ng Hebreong pangalan sa likas na anyong Filipino.
- source_word: אֲשַׂרְאֵלָה
  choice: Asarela
  rationale: Tuwirang transliterasyon ng anyo sa tekstong Hebreo, na iniangkop sa pagbabaybay sa Filipino.
- source_word: בְּנֵי אָסָף
  choice: mga anak ni Asaf
  rationale: Pinanatili ang pag-uulit sa Hebreo upang malinaw na ang mga nakalistang lalaki ay kabilang sa mga anak o pangkat ni Asaf.
- source_word: עַל יַד
  choice: sa ilalim ng pamamahala ni
  rationale: Ang idyomang literal na “sa kamay ni” ay maaaring magpahiwatig ng pangangasiwa, kapamahalaan, o pagkilos sa pamamagitan ng isang tao. Ang “sa ilalim ng pamamahala ni” ang malinaw at natural na katumbas dito.
- source_word: הַנִּבָּא
  choice: na nagpropesiya
  rationale: Pinananatili nito ang tahasang katawagang propetiko ng Chronicler at hindi ito pinapaliit tungo lamang sa pag-awit o pagtugtog.
- source_word: עַל יְדֵי הַמֶּלֶךְ
  choice: sa ilalim ng pamamahala ng hari
  rationale: Pinananatili ang pagkakatulad sa naunang idyoma at ipinahihiwatig ang kapamahalaang namamagitan sa gawain ni Asaf.
theological_decisions:
- issue: Kahulugan ng “nagpropesiya” sa konteksto ng musikang pangtemplo
  choice: Pinanatili ang “nagpropesiya” para sa gawain ni Asaf.
  alternative: “tumugtog o umawit nang may propetikong pahayag”
  rationale: Ginagamit ng teksto ang נבא, kaya hindi dapat tahimik na ipakahulugan ito bilang karaniwang pagtatanghal lamang. Hinahayaan ng salin na manatili ang ugnayan at tensiyon sa pagitan ng propesiya at ministeryong musikal.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang anyong talaan at ang pag-uulit ng “mga anak ni Asaf,” habang ginawang natural ang sintaks. Ginamit ang “nagpropesiya” upang mapanatili ang teolohikal na bigat ng orihinal.
