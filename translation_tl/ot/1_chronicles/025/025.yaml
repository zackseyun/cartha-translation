  yaml_path: translation/ot/1_chronicles/025/025.yaml
  text: For the eighteenth[a], Hanani; his sons and his brothers, twelve.
translation:
  language: tl
  text: 'Para sa ikalabingwalo: si Hanani, ang kanyang mga anak na lalaki at mga kapatid na lalaki—labindalawa.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִשְׁמוֹנָה עָשָׂר
  choice: Para sa ikalabingwalong bahagi
  rationale: Ang לְ ay nagpapahiwatig ng pagtatalaga sa ikalabingwalong pangkat sa sunod-sunod na tala. Idinagdag ang “bahagi” para maging likas at malinaw sa Filipino; ipinapaliwanag sa talababa na hindi tahasang nasa talata ang salitang ito.
- source_word: לַחֲנָנִי
  choice: si Hanani
  rationale: Pangalan ng tao na isinalin sa karaniwang transliterasyon; ang “si” ay likas na pananda sa Filipino.
- source_word: בָּנָיו
  choice: ang kanyang mga anak na lalaki
  rationale: Tiyak na tumutukoy ang Hebrew sa mga anak na lalaki, kaya pinanatili ang kasarian sa salin.
- source_word: וְאֶחָיו
  choice: at mga kapatid na lalaki
  rationale: Ang payak na kahulugan ay mga kapatid na lalaki; hindi ito pinalawak tungo sa mga kamag-anak o kasamahan.
- source_word: שְׁנֵים עָשָׂר
  choice: labindalawa lahat
  rationale: Ibinibigay nito ang kabuuang bilang ng mga anak at kapatid ni Hanani sa pangkat; nilinaw ng “lahat” ang gamit nito bilang kabuuan.
