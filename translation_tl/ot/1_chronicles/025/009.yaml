base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/025/009.yaml
  text: The first lot came out for Asaph[a], for Joseph; Gedaliah the second, he and his brothers and his sons[b], twelve.
translation:
  language: tl
  text: Ang unang bunot ay napunta kay Asaf, para kay Jose; ang ikalawa ay para kay Gedalias—siya, ang kanyang mga kapatid, at ang kanyang mga anak na lalaki—labindalawa silang lahat.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּצֵא הַגּוֹרָל
  choice: ang palabunutan ay lumabas
  rationale: Pinananatili nito ang konkretong larawan ng Hebreong pandiwa na ‘lumabas’ sa konteksto ng pagtatalaga sa pamamagitan ng palabunutan.
- source_word: לְאָסָף לְיוֹסֵף
  choice: para kay Asaf, para kay Jose
  rationale: Ang inuulit na ‘para kay’ ay sumasalamin sa dalawang לְ at nagpapakitang si Jose ang partikular na kinatawan ng sambahayan ni Asaf.
- source_word: גְּדַלְיָהוּ
  choice: Gedalias
  rationale: Ginamit ang nakaugaliang anyong Filipino ng pangalan upang maging natural at madaling makilala ng mga mambabasang Tagalog.
- source_word: הוּא וְאֶחָיו וּבָנָיו
  choice: siya, ang kanyang mga kapatid, at ang kanyang mga anak na lalaki
  rationale: Pinananatili ang panghalip na tumutukoy kay Gedalias at ang tiyak na kahulugan ng בנים bilang mga anak na lalaki.
- source_word: שְׁנֵים עָשָׂר
  choice: labindalawa silang lahat
  rationale: Malinaw na ipinahahayag na labindalawa ang kabuuang bilang ng buong pangkat, ayon sa di-berbal na sugnay sa Hebreo.
