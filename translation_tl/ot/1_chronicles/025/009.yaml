  source_fidelity: Ang “palabunutan” ay karaniwang tumutukoy sa proseso o gawain ng pagbunot, samantalang ang הַגּוֹרָל ay ang indibidwal na bunot/lot na lumabas o itinalaga. Ang “unang bunot” ay mas tumpak at mas natural sa konteksto. Napananatili ng iba pang bahagi ang pagkakasunod at saklaw ng Hebreo, kabilang ang paulit-ulit na pagtatalaga kina Asaf at Jose at ang kabuuang bilang na labindalawa.
  naturalness: Hindi likas ang “Ang unang palabunutan ay lumabas,” dahil ang isang palabunutan ay isang pangyayari o proseso, hindi ang bagay na lumalabas. Ang “Ang unang bunot ay napunta” ay karaniwang modernong Filipino para sa resulta ng pagbunot ng kapalaran.
  terminology: Ang Asaf, Jose, at Gedalias ay katanggap-tanggap na mga anyong Filipino ng mga pangalan. Ang “mga anak na lalaki” ay wastong tumutumbas sa בָּנָיו at ang “mga kapatid” ay maingat na pinananatili nang walang di-kailangang pagpapakahulugan.
