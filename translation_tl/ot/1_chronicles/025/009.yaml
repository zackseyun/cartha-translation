translation_notes:
  register: Makabago at marangal na Filipino, na may malinaw na sintaks para sa siksik at bahagyang eliptikong talaan sa Hebreo. Ang mga pangalang Asaf, Jose, at Gedalias ay nasa karaniwang anyong Filipino.
