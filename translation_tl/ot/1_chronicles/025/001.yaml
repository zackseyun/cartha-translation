  text: וַ/יַּבְדֵּ֣ל דָּוִיד֩ וְ/שָׂרֵ֨י הַ/צָּבָ֜א לַ/עֲבֹדָ֗ה לִ/בְנֵ֤י אָסָף֙ וְ/הֵימָ֣ן וִֽ/ידוּת֔וּן ה/נביאים בְּ/כִנֹּר֥וֹת בִּ/נְבָלִ֖ים וּ/בִ/מְצִלְתָּ֑יִם וַֽ/יְהִי֙ מִסְפָּרָ֔/ם אַנְשֵׁ֥י מְלָאכָ֖ה לַ/עֲבֹדָתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/025/001.yaml
  text: 'And David and the commanders of the army set apart for the service the sons of Asaph[a], Heman, and Jeduthun, who prophesied with lyres, harps, and cymbals; and their number, the men for the work of their service[b], was:'
translation:
  language: tl
  text: 'Ibinukod nina David at ng mga pinuno ng hukbo para sa paglilingkod ang mga anak[a] nina Asaf, Heman, at Jedutun, na nagpapahayag ng propesiya[b] gamit ang mga lira, alpa, at pompiyang. Ang bilang ng mga lalaking gumaganap sa gawain ng kanilang paglilingkod ay:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “mga anak” ay maaari ring tumukoy sa mga inapo o mga kasapi ng mga pangkat na kaugnay nina Asaf, Heman, at Jedutun, hindi lamang sa kanilang mismong mga anak.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring unawain ang Hebreo bilang “ang mga propeta,” na nakatayo bilang aposisyon kina Asaf, Heman, at Jedutun at kaugnay ng pagtugtog ng mga lira, alpa, at pompiyang.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּבְדֵּל
  choice: ibinukod
  rationale: Tumpak na ipinahahayag ang Hifil na diwang ‘ihiwalay para sa isang natatanging layunin’ at angkop ito sa organisadong paglilingkod sa templo.
- source_word: שָׂרֵי הַצָּבָא
  choice: mga pinuno ng hukbo
  rationale: Karaniwang tumutukoy ang צָבָא sa hukbo at ang שָׂרִים sa mga pinuno o opisyal; hindi ginawang ‘mga pinuno ng paglilingkod’ upang maiwasang ipasok ang isang di-tiyak na pakahulugan.
- source_word: לַעֲבֹדָה
  choice: para sa paglilingkod
  rationale: Sa kontekstong pangtemplo, ang עֲבֹדָה ay organisadong paglilingkod o tungkulin, hindi lamang pangkalahatang paggawa.
- source_word: לִבְנֵי אָסָף וְהֵימָן וִידוּתוּן
  choice: ang mga anak nina Asaf, Heman, at Jedutun
  rationale: Pinananatili ang konkretong idyomang ‘mga anak,’ habang nililinaw sa talababa na maaari itong sumaklaw sa mga inapo o kasapi ng kanilang pangkat.
- source_word: הַנְּבִיאִים
  choice: na nagpapahayag ng propesiya
  rationale: Ang anyo ay maaaring unawaing substantibong participle o katawagang panuring. Ang pandiwang parirala ay natural sa Tagalog at pinananatili ang kaugnayan ng gawaing propetiko sa pagtugtog.
- source_word: בְּכִנֹּרוֹת
  choice: gamit ang mga lira
  rationale: Ang כִּנּוֹר ay isang instrumentong de-kuwerdas na karaniwang tinutumbasan ng ‘lira’; ipinahahayag ng ‘gamit ang’ ang instrumental na gamit ng בְּ.
- source_word: בִּנְבָלִים
  choice: alpa
  rationale: Ang נֵבֶל ay instrumentong de-kuwerdas na naiiba sa כִּנּוֹר. Ang ‘alpa’ ay malinaw at kasalukuyang katawagan, bagaman hindi tiyak ang eksaktong modernong katumbas ng sinaunang instrumento.
- source_word: וּבִמְצִלְתָּיִם
  choice: at pompiyang
  rationale: Ang מְצִלְתַּיִם ay mga cymbal; ang ‘pompiyang’ ang natural at madaling maunawaang katawagang Filipino.
- source_word: וַיְהִי מִסְפָּרָם
  choice: 'Ang bilang ... ay:'
  rationale: Ipinakikita ng tutuldok na ang sugnay ay pambungad sa talaan o pagbilang na sumusunod sa mga kasunod na talata.
- source_word: אַנְשֵׁי מְלָאכָה לַעֲבֹדָתָם
  choice: mga lalaking gumaganap sa gawain ng kanilang paglilingkod
  rationale: Malapit ito sa diwa ng mga taong nakikibahagi sa itinakdang gawain, nang hindi ipinapalagay na ang מְלָאכָה ay tahasang nangangahulugang natatanging teknikal na kasanayan.
theological_decisions:
- issue: Kung ang הַנְּבִיאִים ay dapat ihayag bilang pangngalang ‘mga propeta’ o bilang paglalarawan sa kanilang gawain
  choice: Isinalin bilang ‘na nagpapahayag ng propesiya’ upang ipahayag ang gawaing propetiko na kaugnay ng paggamit ng mga instrumento.
  alternative: ‘ang mga propeta’ o ‘na mga propeta’
  rationale: Maaaring basahin ang Hebreo bilang substantibong participle o bilang aposisyon. Ang napiling salin ay natural sa Tagalog ngunit hindi itinatago ng talababa ang posibilidad ng pangngalang pagbasa at hindi rin tinutukoy nang higit sa teksto ang eksaktong kalikasan ng propetikong musika.
translation_notes:
  register: Gumamit ng makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang mga pangalang Asaf, Heman, at Jedutun sa karaniwang anyong biblikal sa Filipino, at gumamit ng ‘pompiyang’ sa halip na hiram na ‘cymbals.’ Ang pangungusap ay nagtatapos sa tutuldok dahil ipinagpapatuloy ng mga kasunod na talata ang bilang.
