    issue: Ang “mga kapatid” ay hindi tahasang panlalaki.
    rationale: Ang אֶחָיו ay literal na “kanyang mga kapatid na lalaki”; ang walang kasariang “mga kapatid” ay nagpapalawak sa saklaw ng pinagmulan.
  - severity: low
    issue: Ang “kasama ang” ay hindi kailangan sa listahang Hebreo.
    rationale: Ang Hebreo ay nagtatala lamang ng “kanyang mga anak na lalaki at kanyang mga kapatid, labindalawa.” Ang mas tuwirang sintaks ay mas malapit sa pinagmulan at mas malinaw ang saklaw ng bilang.
  - severity: low
    issue: Ang “palabunot” sa talababa ay hindi likas na katawagan para sa ipinahihiwatig na lot.
    rationale: Mas malinaw ang “kapalaran” sa pagpapaliwanag ng lot sa kontekstong ito, nang hindi ipinapasok ang salita sa pangunahing teksto.
