  source_fidelity: Tumpak ang pangunahing pagkilala kay Zacur at ang kabuuang bilang na labindalawa. Gayunman, ang “kasama ang” ay bahagyang nagdaragdag ng ugnayang pangpagsama na wala sa mas tuwirang, listahang Hebreo. Hindi rin naipapakita ng “mga kapatid” ang panlalaking tinutukoy ng אֶחָיו.
  naturalness: 'Mas natural at malinaw sa modernong Filipino ang dalawang sugnay na may semicolon: malinaw nitong ipinapakitang ang pinagsamang mga anak na lalaki at mga kapatid na lalaki ang bumubuo sa labindalawa.'
  terminology: Ang “mga anak na lalaki” ay angkop para sa בָּנָיו. Para sa אֶחָיו, “mga kapatid na lalaki” ang pinakamalapit at iniiwasan ang pagpapalawak sa pangkalahatang mga kapatid. Pinanatili ang pangalang “Zacur,” isang katanggap-tanggap na baybay sa Filipino.
  issues:
