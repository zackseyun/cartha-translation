translation:
  language: tl
  text: Ang ikatlo ay si Zacur; ang kanyang mga anak na lalaki at mga kapatid na lalaki ay labindalawa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, ayon sa konteksto, “Ang ikatlong kapalaran ay napunta kay Zacur; ang kanyang mga anak na lalaki at mga kapatid na lalaki ay labindalawa.” Ipinahihiwatig ng mga talata sa paligid ang salitang “kapalaran,” ngunit hindi ito inuulit dito.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשְּׁלִשִׁי
  choice: Ang ikatlo
  rationale: Ang ordinal na may pantukoy ay nagsisilbing pananda sa pagkakasunod-sunod ng mga pangkat o palabunutan. Hindi inuulit sa Hebreo ang pangngalang 'palabunutan,' kaya pinanatiling pahiwatig lamang ito at ipinaliwanag sa talababa.
- source_word: זַכּוּר
  choice: Zacur
  rationale: Pangngalang pantangi ito at tinumbasan sa baybay na madaling basahin sa Filipino habang kinakatawan ang Hebreong זַכּוּר.
- source_word: בָּנָיו
  choice: kanyang mga anak na lalaki
  rationale: Ang panlalaking pangmaramihang anyo ng בן na may hulaping panghalip ay tiyak na tumutukoy sa 'kanyang mga anak na lalaki,' hindi lamang sa pangkalahatang 'mga anak.'
- source_word: וְאֶחָיו
  choice: at mga kapatid
  rationale: Ang אֶחָיו ay tuwirang 'kanyang mga kapatid na lalaki.' Sa kontekstong kasama na ang 'kanyang,' natural sa Filipino ang 'at mga kapatid,' at malinaw sa pangkat na tinutukoy ang mga lalaking kasamang tagapaglingkod.
- source_word: שְׁנֵים עָשָׂר
  choice: labindalawa silang lahat
  rationale: Ibinibigay ng bilang ang kabuuang dami ng pangkat. Walang pandiwa sa Hebreo; ang 'silang lahat' ay natural na panustos sa Filipino upang luminaw na labindalawa ang kabuuan, hindi labindalawa ang bawat uri ng kamag-anak.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang 'kasama' upang natural na maipahayag ang ugnayang appositional ng maikling talaan, at ang gitling bago ang bilang upang mapanatili ang siksik na estilong pansenso ng Hebreo.
