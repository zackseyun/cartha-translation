  yaml_path: translation/ot/1_chronicles/025/014.yaml
  text: The seventh fell to Jesharelah[a]; his sons and his brothers were twelve.
translation:
  language: tl
  text: Ang ikapito ay napunta kay Jesarela[a]; labindalawa ang kanyang mga anak na lalaki at mga kapatid na lalaki.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa literal: “Ang ikapito, si Jesarela, ang kanyang mga anak na lalaki at mga kapatid na lalaki, labindalawa.” Ang “ay napunta kay” ay idinagdag ayon sa paulit-ulit na pormula ng pagbabahagi sa pamamagitan ng palabunutan sa mga nakapaligid na talata.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשְּׁבִעִי
  choice: Ang ikapito
  rationale: Ang ordinal ay ginagamit bilang pangngalan sa talaan ng mga pangkat na itinakda sa pamamagitan ng palabunutan. Pinananatili ang maikling anyo at ipinahihiwatig ng pandiwa ang bahagi o takdang napunta sa kanya.
- source_word: יְשַׂרְאֵלָה
  choice: Jesarela
  rationale: Pangalan ng tao ito, kaya tinumbasan sa anyong transliterado na natural sa baybay at bigkas ng Filipino, sa halip na isalin ang kahulugan nito.
- source_word: בָּנָיו
  choice: kanyang mga anak na lalaki
  rationale: Tiyak na mga anak na lalaki ang ibig sabihin ng Hebreo; pinananatili ang pagtukoy sa kasarian ng orihinal.
- source_word: וְאֶחָיו
  choice: at mga kapatid na lalaki
  rationale: Karaniwang nangangahulugang mga kapatid na lalaki ang pangngalan. Bagaman maaari itong tumukoy nang mas malawak sa mga lalaking kamag-anak o kasamahan sa pangkat, ang tuwirang kahulugan ang pinanatili.
- source_word: שְׁנֵים עָשָׂר
  choice: labindalawa
  rationale: Ito ang kabuuang bilang ng mga anak na lalaki at mga kapatid na lalaki sa pangkat.
- source_word: '[implied allotment formula]'
  choice: ay napunta kay
  rationale: Walang tahasang pandiwa sa maikling linyang Hebreo, ngunit ipinahihiwatig ito ng paulit-ulit na pormula ng palabunutan sa mga nakapaligid na talata. Likas sa Filipino ang 'napunta kay' at hindi nito dinaragdagan nang labis ang teksto.
theological_decisions: []
translation_notes:
  register: Makabagong Filipino na malinaw at marangal. Ginamit ang “anak na lalaki” at “kapatid na lalaki” upang mapanatili ang tiyak na kasarian sa Hebreo. Ang semicolon ay naghihiwalay sa ipinahiwatig na resulta ng palabunutan at sa bilang ng pangkat.
