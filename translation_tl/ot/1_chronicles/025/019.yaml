translation:
  language: tl
  text: Ang ikalabindalawa ay para kay Hashabias[a], sa kanyang mga anak na lalaki at mga kapatid niyang lalaki—labindalawa silang lahat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa mas literal na pagbasa, “ang labindalawa.” Mas pinapaboran ng konteksto ang ordinal na kahulugang “ang ikalabindalawa,” sapagkat sunod-sunod na inililista sa kabanatang ito ang mga bunutan.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשְּׁנֵים עָשָׂר
  choice: ang ikalabindalawa
  rationale: Bagaman kardinal ang anyong Hebreo sa literal na pagbasa, gumaganap itong ordinal sa sunod-sunod na talaan ng mga palabunutan; natural sa Filipino ang “ang ikalabindalawa.”
- source_word: לַחֲשַׁבְיָה
  choice: ay para kay Hashabias
  rationale: Ang prefiks na ל ay nagpapahayag ng pagkakatalaga ng palabunot sa taong pinangalanan; malinaw at natural sa Filipino ang “para kay.”
- source_word: חֲשַׁבְיָה
  choice: Hashabias
  rationale: Isinalin sa karaniwang anyong Filipino ang personal na pangalang Hebreo.
- source_word: בָּנָיו
  choice: kanyang mga anak na lalaki
  rationale: Tiyak na mga lalaking anak ang tinutukoy ng בנים sa talaang ito, kaya pinanatili ang kasarian sa salin.
- source_word: וְאֶחָיו
  choice: at mga kapatid
  rationale: Ang pangunahing kahulugan ng אחים ay mga kapatid na lalaki, ngunit sa natural na modernong Filipino ay karaniwang sapat ang “mga kapatid” sa kontekstong pangkat ng kalalakihan.
- source_word: שְׁנֵים עָשָׂר
  choice: labindalawa silang lahat
  rationale: Ibinibigay ng pangwakas na bilang ang kabuuang laki ng pangkat; idinagdag ang “silang lahat” upang maging malinaw at natural ang putol-putol na pormula ng talaan sa Filipino.
