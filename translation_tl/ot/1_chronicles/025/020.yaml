  text: The thirteenth[a], Shubael; his sons and his brothers, twelve.
translation:
  language: tl
  text: Ang ikalabintatlo[a] ay si Shubael; ang kanyang mga anak na lalaki at ang kanyang mga kapatid na lalaki—labindalawa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “Para sa ikalabintatlo, si Shubael.” Nauunawaan mula sa konteksto ang salitang “palabunutan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לִשְׁלֹשָׁה עָשָׂר
  choice: Ang ikalabintatlo
  rationale: Sa talaan ng mga palabunutan, ang unlaping לְ ay nagpapahiwatig ng pagkakatalaga sa ikalabintatlong bahagi. Likas sa Filipino ang “Ang ikalabintatlo,” habang ipinauunawa ng konteksto ang salitang “palabunot” na hindi tahasang nasa talata.
- source_word: שׁוּבָאֵל
  choice: Shubael
  rationale: Isinatinig ang pangalang pantangi ayon sa karaniwang anyong ginagamit sa Bibliyang Filipino, sa halip na isalin ang kahulugan nito.
- source_word: בָּנָיו
  choice: kanyang mga anak na lalaki
  rationale: Tiyak na mga anak na lalaki ang tinutukoy ng Hebrew, kaya hindi ginamit ang mas malawak na “mga anak.”
- source_word: וְאֶחָיו
  choice: at mga kapatid na lalaki
  rationale: Ang pangngalan ay panlalaki at tuwirang nangangahulugang “mga kapatid na lalaki,” bagaman sa ganitong konteksto maaari rin itong sumaklaw sa mga lalaking kamag-anak o kasamahan.
- source_word: שְׁנֵים עָשָׂר
  choice: labindalawa
  rationale: Ibinibigay ng bilang ang kabuuang pangkat na kaugnay ni Shubael. Pinanatili ang maikli at eliptikong estilo ng talaan.
theological_decisions: []
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang maikling anyo ng talaan at ang elipsis ng Hebrew, ngunit gumamit ng “ay” upang maging natural ang pangungusap.
