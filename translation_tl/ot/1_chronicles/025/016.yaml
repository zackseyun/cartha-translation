  text: The ninth was Mattanyahu[a], his sons and his brothers, twelve.
translation:
  language: tl
  text: Ang ikasiyam ay si Matanyahu[a], kasama ang kanyang mga anak na lalaki at mga kapatid na lalaki—labindalawa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: Matanyahu; karaniwang isinusulat na Matanias sa ilang saling Tagalog.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַתְּשִׁיעִי
  choice: Ang ikasiyam
  rationale: Ang ordinal na may pantukoy ay ginagamit nang eliptikal sa talaan; hindi na tahasang idinagdag ang “pangkat” o “palabunutan,” gaya ng maikling anyo ng Hebreo.
- source_word: מַתַּנְיָהוּ
  choice: Matanyahu
  rationale: Direktang transliterasyon ito ng Hebreong pangalan at pinananatili ang hulaping -yahu.
- source_word: בָּנָיו
  choice: kanyang mga anak na lalaki
  rationale: Tiyak na mga anak na lalaki ang kahulugan ng Hebreo, kaya hindi ginamit ang mas malawak na “mga anak.”
- source_word: וְאֶחָיו
  choice: mga kapatid na lalaki
  rationale: Pinananatili ang payak na leksikal na kahulugan, bagaman maaari itong tumukoy nang mas malawak sa mga kasamang kamag-anak sa ganitong talaan.
- source_word: שְׁנֵים עָשָׂר
  choice: labindalawa silang lahat
  rationale: Nililinaw sa natural na Tagalog na ito ang kabuuang bilang ng pinunong binanggit at ng mga kasama niya, ayon sa paulit-ulit na pormula ng kabanata.
