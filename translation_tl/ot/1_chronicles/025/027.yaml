translation:
  language: tl
  text: 'Para sa ikadalawampu[a]: si Eliata, ang mga anak niyang lalaki at mga kapatid niyang lalaki—labindalawa.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O, mas tahasang, “Para sa ikadalawampung palabunot: si Eliata, ang mga anak niyang lalaki at mga kapatid niyang lalaki—labindalawa.” Ipinahihiwatig ng paulit-ulit na balangkas ng kabanata ang salitang “palabunot.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְ/עֶשְׂרִים
  choice: para sa ikadalawampu
  rationale: Sa talaan ng mga palabunutan sa kabanata, ang לְ ay nagpapahiwatig ng pagtatalaga, at ang עֶשְׂרִים ay tumutukoy sa ikadalawampung puwesto. Pinananatili ng salin ang maikli at paulit-ulit na pormula ng Hebreo.
- source_word: לֶאֱלִיָּתָה
  choice: si Eliata
  rationale: Isinalin sa baybay-Tagalog ang pangalang pantangi, samantalang ang prefiks na לְ ay naipahayag na sa pormulang “para sa ikadalawampu”; kaya appositional ang pangalan.
- source_word: בָּנָיו
  choice: ang kanyang mga anak na lalaki
  rationale: Ang maramihang anyo ng בֵּן na may hulaping panghalip ay tumutukoy sa mga lalaking anak; tahasang pinananatili ito sa Tagalog.
- source_word: וְאֶחָיו
  choice: at mga kapatid na lalaki
  rationale: Ang אחים ay likas na tumutukoy rito sa mga kapatid na lalaki, bagaman maaari rin itong magkaroon ng mas malawak na kahulugang kamag-anak sa angkan. Hindi pinalawak ang kahulugan nang walang pangangailangan.
- source_word: שְׁנֵים עָשָׂר
  choice: labindalawa
  rationale: Ibinibigay ng bilang ang kabuuang laki ng pangkat. Pinananatili ang walang-pandiwang estilo ng listahang Hebreo sa pamamagitan ng gitling bago ang bilang.
