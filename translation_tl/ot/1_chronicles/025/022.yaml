  text: 'For the fifteenth[a], to Jeremoth: his sons and his brothers[b], twelve.'
translation:
  language: tl
  text: 'Para sa ikalabinlima[a], kay Jeremot[b]: ang kanyang mga anak na lalaki at mga kapatid na lalaki, labindalawa.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “Para sa ikalabinlima, kay Jeremot.” Ipinahihiwatig ng paulit-ulit na ayos ng kabanatang ito ang “palabunot,” ngunit hindi ito tahasang nakasaad dito sa Hebreo.
    reason: cross_reference
  - marker: b
    text: Maaari ring isalin na “para kay Jeremot.” Ang pang-ukol na Hebreo ay maaaring magpahiwatig ng pagtatalaga sa talaang ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַחֲמִשָּׁה עָשָׂר
  choice: Para sa ikalabinlima
  rationale: Ang parirala ay may diwang ordinal sa paulit-ulit na talaan ng pagtatalaga sa pamamagitan ng palabunutan. Pinananatili ang pang-ukol na ל sa “para sa,” at hindi idinaragdag sa pangunahing teksto ang “palabunot” dahil ipinahihiwatig lamang ito ng konteksto.
- source_word: לִירֵמוֹת
  choice: kay Jeremot
  rationale: Ang prefiks na ל ay nagpapahiwatig ng pagtatalaga sa talaang ito. Ang “kay” ang likas na anyong Filipino bago ang pangalan ng tao.
- source_word: בָּנָיו
  choice: ang kanyang mga anak na lalaki
  rationale: Tiyak na mga anak na lalaki ang kahulugan ng Hebreo, hindi ang mas malawak na “mga anak.”
- source_word: וְאֶחָיו
  choice: at mga kapatid
  rationale: Tuwirang nangangahulugang mga kapatid na lalaki ang pangngalan, bagaman sa ganitong konteksto maaari rin itong tumukoy sa malalapit na lalaking kamag-anak o kasapi ng angkan. Sa Filipino, natural ang “mga kapatid,” at ipinapaliwanag sa talababa ang saklaw.
- source_word: שְׁנֵים עָשָׂר
  choice: labindalawa
  rationale: Karaniwang bilang na nagsasaad sa kabuuang pangkat na kaugnay ni Jeremot.
