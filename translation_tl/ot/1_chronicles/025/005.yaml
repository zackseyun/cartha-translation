  text: כָּל אֵ֨לֶּה בָנִ֜ים לְ/הֵימָ֗ן חֹזֵ֥ה הַ/מֶּ֛לֶךְ בְּ/דִבְרֵ֥י הָ/אֱלֹהִ֖ים לְ/הָרִ֣ים קָ֑רֶן וַ/יִּתֵּ֨ן הָ/אֱלֹהִ֜ים לְ/הֵימָ֗ן בָּנִ֛ים אַרְבָּעָ֥ה עָשָׂ֖ר וּ/בָנ֥וֹת שָׁלֽוֹשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/025/005.yaml
  text: All these were sons of Heman[a], the king’s seer in the words of God, to exalt the horn[b]. And God gave Heman fourteen sons and three daughters.
translation:
  language: tl
  text: Ang lahat ng ito ay mga anak na lalaki ni Heman, ang tagapangitain ng hari sa mga salita ng Diyos,[a] upang itaas ang sungay.[b] Binigyan ng Diyos si Heman ng labing-apat na anak na lalaki at tatlong anak na babae.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang tagapangitain ng hari sa mga bagay ng Diyos” o “ang tagapangitain ng hari sa pamamagitan ng mga salita ng Diyos.” Maikli at siksik ang pariralang Hebreo at maaaring tumukoy sa tungkulin ni Heman kaugnay ng pahayag ng Diyos.
    reason: alternative_reading
  - marker: b
    text: Maaari ring “upang itaas ang lakas.” Ang “sungay” sa Hebreo ay larawang tumutukoy sa lakas, karangalan, o mataas na katayuan.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֹזֵה
  choice: tagapangitain
  rationale: Tumutukoy ito sa isang taong tumatanggap ng pahayag o pangitain mula sa Diyos. Pinananatili ng “tagapangitain” ang natatanging tungkuling makahula at ang kaugnayan nito sa hari, sa halip na gamitin ang mas malawak na “propeta.”
- source_word: בְּדִבְרֵי הָאֱלֹהִים
  choice: sa mga salita ng Diyos
  rationale: Malapit ito sa anyo ng Hebreo at hindi nito nilulutas nang labis ang masinsing parirala, na maaaring tumukoy sa saklaw o paraan ng tungkulin ni Heman bilang tagapangitain.
- source_word: לְהָרִים קָרֶן
  choice: upang itaas ang sungay
  rationale: Pinananatili ang layuning ipinahihiwatig ng לְ at ang metaporang Hebreo. Hindi tinutukoy ng salin kung kaninong sungay ito o kung kapangyarihan, karangalan, o katayuan ang tiyak na diin.
- source_word: קָרֶן
  choice: sungay
  rationale: Ang “sungay” ay larawang biblikal para sa lakas, karangalan, o mataas na katayuan. Ang tuwirang salin ay nagpapanatili sa larawan sa halip na palitan ito ng isang makitid na pagpapakahulugan.
- source_word: וַיִּתֵּן הָאֱלֹהִים לְהֵימָן
  choice: Binigyan ng Diyos si Heman
  rationale: Natural na Filipino ito para sa pahayag na ipinagkaloob ng Diyos kay Heman ang mga anak, habang malinaw na nananatiling Diyos ang gumagawa.
- source_word: בָנִים ... וּבָנוֹת
  choice: mga anak na lalaki ... mga anak na babae
  rationale: Tahasang pinag-iiba ng Hebreo ang mga anak na lalaki at babae; malinaw at natural itong naipapahayag sa modernong Filipino.
- source_word: אַרְבָּעָה עָשָׂר וּבָנוֹת שָׁלֹשׁ
  choice: labing-apat na anak na lalaki at tatlong anak na babae
  rationale: Tumpak na pinananatili ang bilang at pagkakasunod ng dalawang pangkat.
- source_word: כָּל אֵלֶּה
  choice: Ang lahat ng ito
  rationale: Karaniwan at natural na panimulang buod ng mga naunang binanggit.
theological_decisions:
- issue: Kahulugan ng “tagapangitain ng hari sa mga salita ng Diyos”
  choice: Inilalarawan si Heman bilang tagapangitain ng hari na may kaugnayan sa mga salita o pahayag ng Diyos.
  alternative: Maaaring unawain na siya ang tagapangitain ng hari “sa mga bagay ng Diyos” o na ginampanan niya ang tungkulin “sa pamamagitan ng mga salita ng Diyos.”
  rationale: Masinsin at bukás sa higit sa isang ugnayang sintaktiko ang pariralang Hebreo. Pinananatili ng pangunahing salin ang pagkabukás na ito nang hindi nagdaragdag ng mas tiyak na teolohikal na paliwanag.
- issue: Kahulugan ng “upang itaas ang sungay”
  choice: Pinanatili ang sungay bilang metapora ng lakas, karangalan, o mataas na katayuan.
  alternative: Maaaring ipakahulugang “upang dagdagan ang kapangyarihan” o “upang parangalan,” ngunit hindi sinasabi ng teksto kung kaninong sungay ang itinataas o kung alin sa mga kahulugang ito ang nangingibabaw.
  rationale: Ang pagpapanatili sa metapora ay umiiwas sa pagpapakitid ng tunay na maluwag na kahulugan ng orihinal.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “tagapangitain” bilang tumpak na terminong biblikal; pinanatili ang di-karaniwang larawang “sungay” dahil mahalaga ang metapora at ipinaliwanag ito sa talababa. Itinugma ang mga pananda ng talababa sa mismong mga pariralang nililinaw nila.
