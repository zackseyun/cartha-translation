  terminology: Napananatili nang wasto ang “Diyos,” “tagapangitain,” at “sungay.” Ang “anak na lalaki” at “anak na babae” ay malinaw na tumutugon sa hayagang pagkakaiba ng Hebreo na בָנִים at בָנוֹת.
