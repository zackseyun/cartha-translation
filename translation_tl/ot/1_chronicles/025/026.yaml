translation:
  language: tl
  text: Para sa ikalabinsiyam[a], si Maloti; ang kanyang mga anak na lalaki at mga kapatid niyang lalaki—labindalawa silang lahat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “para sa ikalabinsiyam.” Sa paulit-ulit na pormula ng kabanatang ito, tumutukoy ito sa ikalabinsiyam na takdang pangkat o kapalarang itinalaga sa pamamagitan ng palabunutan.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְ/תִשְׁעָה עָשָׂר
  choice: Para sa ikalabinsiyam
  rationale: 'Sa paulit-ulit na pormula ng talaan, ordinal ang diwa: ito ang ikalabinsiyam na takdang bahagi o palabunutan. Pinananatili ng “para sa” ang gamit ng prefixed לְ nang hindi idinaragdag sa pangunahing teksto ang salitang “palabunutan,” na ipinahihiwatig lamang ng konteksto.'
- source_word: לְ/מַלּוֹתִי
  choice: si Maloti
  rationale: Pangalan ng tao ito at isinalin sa baybay na natural sa Filipino. Ang “si” ay idinagdag bilang kinakailangang panandang pantangi sa Tagalog.
- source_word: בָּנָיו
  choice: ang kanyang mga anak na lalaki
  rationale: Tiyak na “mga anak na lalaki” ang kahulugan ng Hebreo, kaya hindi ginawang pangkalahatang “mga anak.”
- source_word: וְ/אֶחָיו
  choice: at mga kapatid
  rationale: Ang payak na kahulugan ay mga kapatid na lalaki. Sa Filipino, karaniwang maaaring gamitin ang “mga kapatid” sa ganitong talaan; malinaw sa Hebreong anyong panlalaki at sa konteksto na mga lalaking kabilang sa pangkat ang tinutukoy.
- source_word: שְׁנֵים עָשָׂר
  choice: labindalawa silang lahat
  rationale: Ipinahahayag nito ang kabuuang bilang ng mga anak na lalaki at mga kapatid sa pangkat. Ang “silang lahat” ay natural na Tagalog na paglilinaw ng eliptikong Hebreong talaan.
