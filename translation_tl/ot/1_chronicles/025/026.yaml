translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang maikli at pormulang estilo ng talaan, habang ginawang natural ang eliptikong hulihan sa pamamagitan ng “labindalawa silang lahat.”
