base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/020/005.yaml
  text: And there was war with the Philistines again[a], and Elhanan son of Jair struck down Lahmi, the brother of Goliath the Gittite, whose spear shaft was like a weaver’s beam.
translation:
  language: tl
  text: Muling nagkaroon ng digmaan laban sa mga Filisteo.[a] Pinabagsak ni Elhanan na anak ni Jair si Lahmi, na kapatid ni Goliat na taga-Gat. Ang baras ng sibat ni Lahmi ay gaya ng biga ng habihan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mahirap ang tekstong Hebreo ng kahilerang salaysay sa 2 Samuel 21:19 at madalas itong tinatalakay kaugnay ng talatang ito. Tahasang sinasabi rito sa Mga Cronica na pinatay ni Elhanan si Lahmi, na kapatid ni Goliat.
    reason: textual_variant
lexical_decisions:
- source_word: וַתְּהִי עוֹד מִלְחָמָה
  choice: Muling nagkaroon ng digmaan
  rationale: Ipinahihiwatig ng עוֹד na isa na naman itong digmaan sa sunod-sunod na pangyayari; natural itong ipinapahayag sa Filipino sa pamamagitan ng “muling.”
- source_word: אֶת פְּלִשְׁתִּים
  choice: laban sa mga Filisteo
  rationale: Sa konteksto ng digmaan, tinutukoy ng אֶת ang kalabang panig. Mas natural sa Filipino ang “digmaan laban sa” kaysa literal na “digmaan kasama ng.”
- source_word: וַיַּךְ
  choice: Pinabagsak
  rationale: Pinananatili nito ang larawan ng נכה na paghampas o pagpapabagsak, habang malinaw sa konteksto na napatay ang kalaban.
- source_word: אֶלְחָנָן בֶּן יעור
  choice: Elhanan na anak ni Jair
  rationale: Direkta at natural na anyo ng patronimiko sa Filipino; sinusunod ang tradisyonal na pagkakakilanlan sa pangalang Jair.
- source_word: אֶת לַחְמִי
  choice: si Lahmi
  rationale: Itinuturing ang לַחְמִי ayon sa pagbigkas at ayos ng tekstong Masoretiko bilang pangalang pantangi; ang pantukoy na si ang natural na pananda sa Filipino.
- source_word: אֲחִי גָּלְיָת
  choice: na kapatid ni Goliat
  rationale: Malinaw na pinananatili ang tahasang ugnayang ipinapahayag ng construct phrase sa Hebreo.
- source_word: הַגִּתִּי
  choice: na taga-Gat
  rationale: Mas madaling maunawaan ng karaniwang mambabasang Filipino kaysa isang hiniram na katawagang tulad ng “Gitita,” habang tumpak na ipinapahayag ang kaugnayan sa Gat.
- source_word: וְעֵץ חֲנִיתוֹ
  choice: Ang hawakan ng sibat ni Lahmi
  rationale: Ang עֵץ ay tumutukoy sa kahoy o baras ng sibat. Ginawang tahasan ang reperente ng panghalip upang maging malinaw at natural sa Filipino.
- source_word: כִּמְנוֹר אֹרְגִים
  choice: ay kasinlaki ng biga ng habihan
  rationale: Ipinapahayag ng paghahambing ang pambihirang laki ng hawakan. Ang “biga ng habihan” ay kongkreto at malapit sa larawang Hebreo.
theological_decisions:
- issue: Ugnayan sa kahilerang salaysay sa 2 Samuel 21:19, na may mahirap na tekstong Hebreo at maaaring magmukhang si Goliat mismo ang pinatay ni Elhanan
  choice: 'Sinunod ang tahasang pahayag ng Mga Cronica: pinabagsak ni Elhanan si Lahmi, na kapatid ni Goliat.'
  alternative: Baguhin o dagdagan ang teksto batay sa mungkahing pagsasaayos sa Samuel, o unawain ang Lahmi bilang bahagi ng katawagang “taga-Betlehem.”
  rationale: Dapat isalin ang mismong malinaw na anyo ng tekstong Hebreo sa Mga Cronica at huwag ipasok sa talata ang suliraning tekstuwal ng Samuel. Binabanggit ang kaugnay na usapin sa talababa nang hindi binabago ang pangunahing teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “taga-Gat” para sa madaling pag-unawa at iniwasan ang lipas na “sinalanta” o “sinaktan.” Pinanatili ang konkretong larawan ng napakalaking hawakan ng sibat.
