revisions:
- from: Nang sumapit ang pag-ikot ng taon[a], sa panahong lumalabas ang mga hari, pinangunahan ni Joab ang hukbo at sinalanta ang lupain ng mga Ammonita. Pagkatapos, pumunta siya sa Rabba at kinubkob iyon. Ngunit nanatili si David sa Jerusalem. Nilusob ni Joab ang Rabba at giniba iyon.
  to: Nang sumapit ang pag-ikot ng taon[a], sa panahong lumalabas ang mga hari, pinangunahan ni Joab ang hukbo at sinalanta ang lupain ng mga Ammonita. Dumating siya sa Rabba at kinubkob ito. Ngunit nanatili si David sa Jerusalem. Nilusob ni Joab ang Rabba at giniba ito.
  rationale: Pinalitan ang pang-abay na “Pagkatapos” ng payak na salaysay na mas malapit sa Hebreo at inayos ang pandiwang “pumunta” tungo sa “dumating.” Walang binagong kahulugan o talababa.
