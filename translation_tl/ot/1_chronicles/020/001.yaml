base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/020/001.yaml
  text: And it happened at the time of the turning of the year[a], at the time when kings go out, that Joab led out the army and devastated the land of the Ammonites, and he came and besieged Rabbah. But David stayed in Jerusalem. And Joab struck Rabbah and tore it down.
translation:
  language: tl
  text: Nang sumapit ang pag-ikot ng taon[a], sa panahong lumalabas ang mga hari, pinangunahan ni Joab ang hukbo at sinalanta ang lupain ng mga Ammonita. Dumating siya sa Rabba at kinubkob ito. Ngunit nanatili si David sa Jerusalem. Nilusob ni Joab ang Rabba at giniba ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas pakahulugan, “nang tagsibol, kapag lumalabas ang mga hari upang makipagdigma.” Mas literal na mababasa sa Hebreo, “sa pag-ikot ng taon, sa panahong lumalabas ang mga hari.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּשׁוּבַת הַשָּׁנָה
  choice: ang pag-ikot ng taon
  rationale: Pinananatili nito ang konkretong idyomang Hebreo tungkol sa pagbalik o pag-ikot ng taon nang hindi agad ipinapakahulugang tagsibol.
- source_word: לְעֵת צֵאת הַמְּלָכִים
  choice: sa panahong lumalabas ang mga hari
  rationale: Iniiwang di-binanggit ang layon ng paglabas gaya sa Hebreo; malinaw naman sa konteksto ang gawaing militar.
- source_word: וַיִּנְהַג
  choice: pinangunahan
  rationale: Likas na Filipino para sa pag-akay o paglabas ni Joab kasama ng puwersang militar.
- source_word: חֵיל הַצָּבָא
  choice: ang hukbo
  rationale: Sapat at natural na katumbas ng tambalang tumutukoy sa puwersang militar.
- source_word: וַיַּשְׁחֵת אֶת אֶרֶץ בְּנֵי עַמּוֹן
  choice: sinalanta ang lupain ng mga Ammonita
  rationale: Ipinahahayag ng “sinalanta” ang malawakang pagkawasak sa isang kampanyang militar; natural ang “mga Ammonita” para sa literal na “mga anak ni Ammon.”
- source_word: וַיָּצַר
  choice: kinubkob
  rationale: Tuwirang modernong terminong militar para sa paglalagay ng isang lungsod sa ilalim ng pagkubkob.
- source_word: וְדָוִיד יֹשֵׁב בִּירוּשָׁלִָם
  choice: Ngunit nanatili si David sa Jerusalem
  rationale: Ipinakikita ng “nanatili” ang tuloy-tuloy na kalagayan at ng “ngunit” ang kaibahan sa pagkilos ni Joab.
- source_word: וַיַּךְ
  choice: nilusob
  rationale: Sa konteksto ng pagkubkob sa lungsod, natural na inilalarawan nito ang pag-atake nang hindi ipinapalagay na ang pandiwa lamang ay nangangahulugang ganap na pagkatalo.
- source_word: וַיֶּהֶרְסֶהָ
  choice: giniba iyon
  rationale: Tiyak na ipinahahayag ang paggiba o pagwasak sa lungsod at naiiba sa naunang pagsalanta sa lupain.
- source_word: רַבָּה
  choice: Rabba
  rationale: Karaniwang transliterasyon sa Filipino ng pangalan ng lungsod.
