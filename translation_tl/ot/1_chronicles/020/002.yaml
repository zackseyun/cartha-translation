revisions:
- from: Kinuha ni David mula sa ulo ng kanilang hari[a] ang korona nito. Natuklasan niyang ang bigat nito ay isang talentong ginto[b], at may isang mahalagang bato roon. Inilagay iyon sa ulo ni David. Napakarami ring samsam na inilabas niya mula sa lungsod.
  to: Kinuha ni David ang korona ng kanilang hari[a] mula sa ulo nito. Natuklasan niyang ang bigat nito ay isang talentong ginto[b], at may isang mahalagang bato rito. Ito ay nasa ulo ni David. Naglabas din siya mula sa lungsod ng napakaraming samsam.
  rationale: Inalis ang di-sinasabing kilos sa “Inilagay iyon” at pinalitan ito ng “Ito ay nasa ulo ni David,” na mas tuwirang katumbas ng Hebreo. Inayos ang huling pangungusap para sa mas malinaw na modernong Filipino nang hindi binabago ang kahulugan. Pinanatili ang mga talababa at ang mga anchor nito.
