base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/020/002.yaml
  text: And David took the crown of their king from his head and found that it weighed a talent of gold, and in it was a precious stone; and it was placed on David’s head. And he carried off very much plunder from the city.
translation:
  language: tl
  text: Kinuha ni David ang korona ng kanilang hari[a] mula sa ulo nito. Natuklasan niyang ang bigat nito ay isang talentong ginto[b], at may isang mahalagang bato rito. Ito ay nasa ulo ni David. Naglabas din siya mula sa lungsod ng napakaraming samsam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang korona ni Milcom” (o “Malcam”), kung ituturing ang מַלְכָּם bilang pangalan ng diyos ng mga Ammonita sa halip na “kanilang hari.”
    reason: alternative_reading
  - marker: b
    text: Ang talento ay isang malaking sinaunang yunit ng timbang. Madalas itong tinatayang mga 34 na kilo, ngunit nagkakaiba-iba ang eksaktong halaga nito.
    reason: cultural_note
lexical_decisions:
- source_word: עֲטֶרֶת
  choice: korona
  rationale: Karaniwan at malinaw na tawag sa maharlikang putong sa modernong Filipino.
- source_word: מַלְכָּם
  choice: kanilang hari
  rationale: Likas itong mabasa bilang מֶלֶךְ na may hulaping panghalip na pangmaramihan, at sinusuportahan ng kasunod na 'mula sa ulo nito' ang pagtukoy sa hari; pinanatili sa talababa ang posibleng pangalan ng diyos.
- source_word: מֵעַל רֹאשׁוֹ
  choice: mula sa ulo nito
  rationale: Direkta at natural na salin ng kongkretong pariralang Hebreo; ang 'nito' ay malinaw na tumutukoy sa hari.
- source_word: וַיִּמְצָאָהּ
  choice: Natuklasan niyang ang bigat nito ay
  rationale: Ipinahahayag ang natuklasang timbang nang malinaw at hindi nagdaragdag ng di-nakasulat na kilos.
- source_word: מִשְׁקַל כִּכַּר זָהָב
  choice: ang bigat nito ay isang talentong ginto
  rationale: Pinananatili ang sinaunang yunit sa halip na magtakda ng isang tiyak na makabagong katumbas.
- source_word: אֶבֶן יְקָרָה
  choice: isang mahalagang bato
  rationale: Tuwirang salin ng isahang parirala nang hindi tinutukoy kung anong uri ng hiyas.
- source_word: וַתְּהִי עַל רֹאשׁ דָּוִיד
  choice: Inilagay iyon sa ulo ni David
  rationale: Natural na Filipino para sa kinalabasang kalagayan na ang korona ay nasa ulo ni David, bagaman ang Hebreo ay literal na 'at iyon ay nasa ulo ni David.'
- source_word: וּשְׁלַל הָעִיר
  choice: samsam ... mula sa lungsod
  rationale: Ang 'samsam' ang malinaw at kasalukuyang salita para sa ari-ariang nakuha sa digmaan.
- source_word: הוֹצִיא
  choice: inilabas niya
  rationale: Malapit sa payak na diwa ng pandiwang Hebreo at akma sa pag-aalis ng samsam mula sa lungsod.
- source_word: הַרְבֵּה מְאֹד
  choice: Napakarami
  rationale: Natural at mariing pagpapahayag ng napakalaking dami.
theological_decisions:
- issue: Kung ang מַלְכָּם ay nangangahulugang 'kanilang hari' o tumutukoy sa diyos ng mga Ammonita na si Milcom/Malcam
  choice: kanilang hari
  alternative: Milcom o Malcam
  rationale: Mas likas sa morpolohiya at sa pariralang 'mula sa ulo nito' ang pagtukoy sa isang hari, ngunit tunay na posible ang pagbasa rito bilang pangalan ng diyos kaya hindi ito inalis at inilagay sa talababa.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang 'korona,' 'mahalagang bato,' at 'samsam' bilang malinaw na karaniwang salita; pinanatili ang 'talento' bilang makasaysayang yunit at ipinaliwanag sa talababa.
