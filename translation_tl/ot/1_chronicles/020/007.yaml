base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/020/007.yaml
  text: And when he taunted Israel[a], Jonathan son of Shimea, David’s brother, struck him down.
translation:
  language: tl
  text: At nang hamakin niya ang Israel[a], pinabagsak siya ni Jonatan, anak ni Simea na kapatid ni David.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O kaya, “hamunin.” Ang pandiwang Hebreo ay maaaring tumukoy sa mapanlait na paghamak o hayagang paghamon.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחָרֵף
  choice: hamakin
  rationale: Ang pandiwang חרף ay tumutukoy rito sa mapanlait at mapanghamong pananalita laban sa Israel. Likas sa modernong Tagalog ang “hamakin” at napananatili nito ang parehong pag-alipusta at paghamon.
- source_word: אֶת יִשְׂרָאֵל
  choice: ang Israel
  rationale: Tuwirang tumutukoy ang Hebreo sa bansang Israel, na kumakatawan din sa bayan nito; pinananatili ng salin ang anyong “Israel.”
- source_word: וַיַּכֵּהוּ
  choice: pinabagsak siya
  rationale: Sa konteksto ng labanan, ang נכה ay tumutukoy sa isang hampas na nagpabuwal at pumatay sa kalaban. Ang “pinabagsak siya” ay likas at marangal na salin nang hindi ginagawang lantad ang resultang higit sa mismong pandiwa.
- source_word: יְהוֹנָתָן
  choice: Jonatan
  rationale: Karaniwang anyong Tagalog ng pangalang Hebreo.
- source_word: בֶּן שִׁמְעָא
  choice: anak ni Simea
  rationale: Direktang isinasalin ang ugnayang pampamilya at ginagamit ang likas na anyong Tagalog ng pangalan.
- source_word: אֲחִי דָוִיד
  choice: na kapatid ni David
  rationale: Pinananatili ang literal na ugnayan sa Hebreo. Ang sugnay na may “na” ay nagpapalinaw na si Simea ang kapatid ni David, gaya ng hinihingi ng balarila at kaayon ng 1 Cronica 2:13.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na payak ngunit marangal. Ginamit ang “pinabagsak” bilang likas na salaysay-pandigma, at inayos ang pariralang pampamilya upang maiwasan ang maling pag-unawang si Jonatan ang kapatid ni David.
