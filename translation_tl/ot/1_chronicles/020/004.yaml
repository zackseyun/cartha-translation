  text: וַ/יְהִי֙ אַחֲרֵי כֵ֔ן וַ/תַּעֲמֹ֧ד מִלְחָמָ֛ה בְּ/גֶ֖זֶר עִם פְּלִשְׁתִּ֑ים אָ֣ז הִכָּ֞ה סִבְּכַ֣י הַ/חֻֽשָׁתִ֗י אֶת סִפַּ֛י מִ/ילִדֵ֥י הָ/רְפָאִ֖ים וַ/יִּכָּנֵֽעוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/020/004.yaml
  text: After this[a], war arose at Gezer with the Philistines. Then Sibbecai the Hushathite struck down Sippai, one of the descendants of the Rephaim[b], and they were subdued.
translation:
  language: tl
  text: Pagkatapos nito, sumiklab ang digmaan sa Gezer laban sa mga Filisteo. Nang magkagayon, pinabagsak ni Sibecai na Husatita si Sipai[a], isa sa mga inapo ng mga Refaim[b], at nasupil sila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Safai” ang anyo ng pangalang isinaling “Sipai.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “mga Refaim”; ayon sa tradisyon, isinasalin din itong “mga higante.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי כֵן
  choice: Pagkatapos nito
  rationale: Likas na salin ng pormulang panlipat sa salaysay na malinaw na nagpapanatili sa pagkakasunod-sunod ng mga pangyayari.
- source_word: וַתַּעֲמֹד מִלְחָמָה
  choice: sumiklab ang digmaan
  rationale: Sa kontekstong militar, ipinahihiwatig ng עמד kasama ng מִלְחָמָה ang pagsisimula o paglitaw ng labanan; natural sa makabagong Tagalog ang “sumiklab ang digmaan.”
- source_word: בְּגֶזֶר
  choice: sa Gezer
  rationale: Ang “sa” ang likas na pananda ng lugar ng labanan, at pinanatili bilang transliterasyon ang pangalang Gezer.
- source_word: עִם פְּלִשְׁתִּים
  choice: laban sa mga Filisteo
  rationale: Bagaman literal na “kasama ng” ang עִם, malinaw na kaaway ang tinutukoy sa konteksto ng digmaan; “laban sa” ang natural at tumpak na pagpapahayag sa Tagalog.
- source_word: אָז
  choice: Nang magkagayon
  rationale: Nagpapahayag ng kasunod na pangyayari sa salaysay nang hindi nagdaragdag ng paliwanag.
- source_word: הִכָּה
  choice: pinabagsak
  rationale: Pinananatili ang puwersang militar ng “humampas/nagpabagsak” nang hindi tahasang nililimitahan ang kahulugan sa “pinatay.”
- source_word: סִבְּכַי הַחֻשָׁתִי
  choice: Sibecai na Husatita
  rationale: Isinalin sa karaniwang anyong Tagalog ang personal na pangalan at katawagang nag-uugnay sa pinagmulan o pangkat.
- source_word: סִפַּי
  choice: Sipai
  rationale: Malapit na transliterasyon ng anyong Masoretiko; inilagay sa talababa ang alternatibong anyo.
- source_word: מִילִדֵי הָרְפָאִים
  choice: isa sa mga inapo ng mga Refaim
  rationale: Ipinahahayag ng יְלִידֵי ang pinagmulan o pagkamag-anak. Ang “Refaim” ay pinanatiling pangalan ng pangkat upang hindi agad ipakahulugang “mga higante.”
- source_word: וַיִּכָּנֵעוּ
  choice: at nasupil sila
  rationale: Ang Niphal ng כנע sa kontekstong militar ay tumutukoy sa pagkasupil o pagkailalim; pinananatili rin ang pangmaramihang panghalip ng Hebreo.
theological_decisions:
- issue: Pagpapakahulugan sa הָרְפָאִים
  choice: mga Refaim
  alternative: mga higante
  rationale: Maaaring pangalan ito ng isang lahi o pangkat, hindi tuwirang paglalarawan sa kanilang laki. Ang transliterasyon ay nagpapanatili sa pagiging bukas ng kahulugan, habang nasa talababa ang tradisyonal na salin.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang natural na wikang pansalaysay habang pinananatili ang mga pangalan at ang hindi ganap na tiyak na kahulugan ng “Refaim.”
