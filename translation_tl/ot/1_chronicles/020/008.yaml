source:
  edition: WLC
  text: אֵ֛ל נוּלְּד֥וּ לְ/הָ/רָפָ֖א בְּ/גַ֑ת וַ/יִּפְּל֥וּ בְ/יַד דָּוִ֖יד וּ/בְ/יַד עֲבָדָֽי/ו־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/020/008.yaml
  text: These were born to Rapha in Gath[a], and they fell by the hand of David and by the hand of his servants.
translation:
  language: tl
  text: Ang mga ito ay ipinanganak kay Rafa sa Gat[a], at nabuwal sila sa kamay ni David at sa kamay ng kanyang mga lingkod.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “nagmula sa angkan ni Rafa”; maaaring tumukoy sa mga inapo ng mga Refaim, isang angkan ng mga higante sa Gat.
    reason: alternative_reading
lexical_decisions:
- source_word: אֵל
  choice: Ang mga ito
  rationale: Tumutukoy pabalik sa mga mandirigmang kababanggit lamang at hindi nagdaragdag ng pangngalang wala sa Hebreo.
- source_word: נוּלְּדוּ
  choice: ay ipinanganak
  rationale: Pinananatili ang karaniwang kahulugan ng Nifal ng ילד, habang hinahayaan ang konteksto na magpahiwatig ng angkan o pinagmulan.
- source_word: לְהָרָפָא
  choice: kay Rafa
  rationale: Likas itong paraan sa Tagalog upang ipahayag ang kaugnayang pinagmulan o pagiging anak, nang hindi tahasang ginagawang ‘higante’ o maramihang ‘mga Refaim’ ang anyong isahan sa Hebreo.
- source_word: בְּגַת
  choice: sa Gat
  rationale: Karaniwang lokatibong salin ng pang-ukol na בְּ kasama ng pangalan ng lugar.
- source_word: וַיִּפְּלוּ
  choice: at nabuwal sila
  rationale: Pinananatili ang larawan ng pandiwang נפל, na sa konteksto ng labanan ay nagpapahiwatig ng pagkamatay o pagkatalo.
- source_word: בְיַד
  choice: sa kamay ni
  rationale: Pinananatili ang idyomang Hebreo para sa ahensiya o gumagawa ng pagkilos.
- source_word: עֲבָדָיו
  choice: kanyang mga lingkod
  rationale: Tuwirang pinananatili ang leksikal na kahulugan ng עבד; sa kontekstong militar, maaaring kabilang dito ang mga tauhang mandirigma ni David.
theological_decisions:
- issue: Pagkakakilanlan ng הָרָפָא
  choice: Rafa, na maaaring personal na ninuno o tawag sa isang angkan
  alternative: ang higante; ang mga Refaim
  rationale: Ang Hebreo ay may anyong isahan at pantukoy, ngunit hindi nito tahasang nilulutas kung isang ninuno o isang angkan ang tinutukoy. Ang ‘Rafa’ at ang talababa ay nagpapanatili sa kalabuan nang hindi ipinapasok ang mas tiyak na katawagang ‘higante.’
translation_notes:
  register: Makabagong Filipino na marangal at madaling maunawaan. Pinanatili ang idyomang “sa kamay” at ang larawang “nabuwal” upang manatiling malapit sa Hebreo, habang nililinaw sa talababa ang hindi tiyak na pagkakakilanlan ni Rafa.
