base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/020/006.yaml
  text: And there was war again at Gath[a], and there was a man of great size whose fingers and toes were six each, twenty-four in all; he also was born to Rapha.
translation:
  language: tl
  text: Muli na namang nagkaroon ng digmaan sa Gat. May isang lalaking napakalaki; tig-aanim ang daliri niya sa bawat kamay at tig-aanim din sa bawat paa—dalawampu't apat lahat. Ipinanganak din siya kay Rapha.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literal: “ipinanganak kay Rapha.” Maaari ring isalin na “nagmula sa higante” o “isa sa mga Rephaim.”'
    reason: Pinananatili ang kalabuan kung ang Rapha ay pangalan ng ninuno, tawag sa isang angkan, o kaugnay ng mga Rephaim.
lexical_decisions:
- source_word: עוֹד
  choice: muli na naman
  rationale: Ipinahihiwatig ng salita sa salaysay na naulit ang digmaan; likas sa modernong Tagalog ang “muli na naman.”
- source_word: מִלְחָמָה
  choice: digmaan
  rationale: Tumutukoy ito sa malawak na armadong labanan o pakikidigma, kaya mas angkop ang “digmaan” kaysa sa isang tiyak na “labanan.”
- source_word: בְּגַת
  choice: sa Gat
  rationale: Ang pang-ukol na בְּ ay nagsasaad dito ng lugar; natural sa Tagalog ang “sa Gat.”
- source_word: אִישׁ מִדָּה
  choice: isang lalaking napakalaki
  rationale: Literal itong “lalaking may sukat/tindig,” ngunit sa konteksto ay tumutukoy sa pambihirang laki ng katawan. Malinaw at natural ang “napakalaki” nang hindi tahasang tinatawag siyang higante.
- source_word: אֶצְבְּעֹתָיו שֵׁשׁ וָשֵׁשׁ
  choice: tig-aanim ang daliri niya sa bawat kamay at tig-aanim din sa bawat paa
  rationale: Bagaman “mga daliri” ang tuwirang salita, ipinakikita ng kabuuang dalawampu't apat at ng kaagapay na salaysay na kasama ang mga daliri sa paa. Nililinaw ng salin ang pamamahaging anim sa bawat kamay at paa.
- source_word: עֶשְׂרִים וְאַרְבַּע
  choice: dalawampu't apat lahat
  rationale: Ibinibigay ng parirala ang kabuuang bilang; natural na ipinapakita ng “lahat” ang pagsuma.
- source_word: וְגַם הוּא
  choice: din siya
  rationale: Iniuugnay siya nito sa iba pang tauhan sa konteksto na mula sa parehong pinagmulan.
- source_word: נוֹלַד לְהָרָפָא
  choice: ipinanganak sa angkan ni Rapha
  rationale: Ang literal na anyo ay “ipinanganak sa/kay Rapha.” Ang “angkan ni Rapha” ay natural sa Tagalog at pinananatili ang Rapha bilang pangalang maaaring tumukoy sa ninuno o pangkat; inilalahad sa talababa ang tunay na kalabuan.
theological_decisions:
- issue: Pagkakakilanlan ng הָרָפָא
  choice: Rapha bilang pangalan ng ninuno o angkan
  alternative: ang higante; isa sa mga Rephaim
  rationale: Ang anyong Hebreo ay isahan at may pantukoy, ngunit maaaring tumukoy sa isang ninuno, angkan, o pangkat na kaugnay ng mga Rephaim. Pinananatili ang transliterasyong “Rapha” at inilalahad ang ibang posibleng pagbasa sa talababa sa halip na gawing tiyak ang hindi tiyak sa teksto.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang “Gat” at “Rapha” bilang mga transliteradong pantanging pangalan. Hinati sa maiikling pangungusap ang mahabang Hebreong koordinasyon upang maging natural sa Tagalog nang hindi binabago ang pagkakasunod ng impormasyon.
