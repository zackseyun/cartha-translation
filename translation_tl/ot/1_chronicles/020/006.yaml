  naturalness: Natural at malinaw ang daloy ng modernong Tagalog. Ang “tig-aanim” at “dalawampu't apat lahat” ay malinaw na naghahayag ng pamamahagi at kabuuan. Ang “ipinanganak kay Rapha” ay natural ding Tagalog at mas tuwirang katapat ng Hebreo.
  terminology: Ang “Gat” at “Rapha” ay angkop na transliterasyon. Pinananatili ng talababa ang mga posibleng pagbasa—isang higante o kaugnayan sa mga Rephaim—nang hindi ipinipilit ang alinman sa pangunahing teksto.
