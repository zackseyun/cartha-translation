base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/020/003.yaml
  text: He brought out the people who were in it and put them to work with saws[a], iron tools, and axes. Thus David did to all the cities of the Ammonites[b]. Then David and all the people returned to Jerusalem.
translation:
  language: tl
  text: Inilabas ni David ang mga taong naroon at pinagtrabaho sila gamit ang mga lagari[a], mga kasangkapang bakal, at mga palakol[b]. Gayon ang ginawa ni David sa lahat ng lungsod ng mga Ammonita. Pagkatapos, bumalik sa Jerusalem si David at ang lahat ng kanyang mga tauhan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O maaaring, “inilagay sila sa ilalim ng mga lagari, mga panggiik na bakal, at mga kasangkapang pamputol.” Dahil sa 2 Samuel 12:31, inuunawa ng ilan na pinatay ni David ang mga tao gamit ang gayong mga kasangkapan.
    reason: alternative_reading
  - marker: b
    text: Hindi tiyak ang eksaktong kahulugan ng ilang salitang Hebreo para sa mga kagamitang ito; maaaring tumukoy ang mga ito sa iba’t ibang matatalim na kagamitang bakal o kasangkapang pamputol.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹצִיא
  choice: inilabas
  rationale: Ang Hiphil ng יצא ay karaniwang nangangahulugang ilabas o pangunahan palabas; tuwirang ipinapahayag ng “inilabas” ang pag-aalis sa mga naninirahan mula sa lungsod.
- source_word: וַיָּשַׂר
  choice: pinagtrabaho sila
  rationale: Mahirap tiyakin ang pandiwa. Ang pagbasa bilang pagtatalaga sa sapilitang paggawa ay angkop sa sariling anyo ng teksto sa Mga Cronica at hindi basta nag-aangkat ng mas marahas na unawa mula sa 2 Samuel 12:31.
- source_word: בַּמְּגֵרָה
  choice: gamit ang mga lagari
  rationale: Ang מְגֵרָה ay lagari. Ginamit ang maramihan bilang likas na Filipino sa talaan ng mga kagamitang pantrabaho.
- source_word: בַּחֲרִיצֵי הַבַּרְזֶל
  choice: mga kasangkapang bakal
  rationale: Tumutukoy ang parirala sa matatalim o pamputol na kagamitang bakal, ngunit hindi tiyak ang eksaktong uri; iniiwasan ng pangkalahatang salin ang labis na katiyakan.
- source_word: וּבַמְּגֵרוֹת
  choice: mga palakol
  rationale: Hindi tiyak ang anyo at kahulugan ng salita; sa konteksto, maaaring ibang uri ito ng kagamitang pamputol. Ang “mga palakol” ay malinaw ngunit nilalakipan ng talababa tungkol sa kawalang-katiyakan.
- source_word: וְכֵן יַעֲשֶׂה
  choice: Gayon ang ginawa
  rationale: Likas at maikli itong paraan upang ibuod ang ginawa ni David sa lahat ng lungsod ng mga Ammonita.
- source_word: לְכֹל עָרֵי בְנֵי עַמּוֹן
  choice: sa lahat ng lungsod ng mga Ammonita
  rationale: Ang “mga Ammonita” ang karaniwang modernong katawagan sa bayang tinutukoy ng בְנֵי עַמּוֹן.
- source_word: וַיָּשָׁב דָּוִיד וְכָל הָעָם יְרוּשָׁלִָם
  choice: bumalik sa Jerusalem si David at ang buong hukbo
  rationale: Ang שוב kasama ng patutunguhan ay “bumalik.” Sa kontekstong militar, ang הָעָם ay mas malinaw na tumutukoy sa mga tauhang kasama ni David kaysa sa lahat ng mamamayan sa pangkalahatan.
theological_decisions:
- issue: Kung sapilitang paggawa o pagpatay gamit ang mga kasangkapan ang inilalarawan
  choice: Isinalin sa pangunahing teksto na pinagtrabaho ni David ang mga bihag gamit ang mga nakalistang kagamitan.
  alternative: Maaaring unawain, lalo na sa impluwensiya ng kahawig na pahayag sa 2 Samuel 12:31, na inilagay sila sa ilalim ng mga lagari at iba pang kasangkapan upang patayin.
  rationale: Naiiba ang mismong pananalita ng Mga Cronica at maaari itong tumukoy sa sapilitang paggawa. Hindi dapat ipasok sa talatang ito ang mas marahas na pagbasa na hindi tiyak sa sariling tekstong Hebreo nito; gayunman, pinananatili sa talababa ang tunay at mahalagang alternatibong pagbasa.
translation_notes:
  register: Modernong Filipino na tuwiran, marangal, at madaling maunawaan. Pinanatili ang karaniwang pangalang “David” at ang etnonimong “mga Ammonita.” Ginamit ang “buong hukbo” para sa הָעָם ayon sa kontekstong militar. Ang mga panandang [a] at [b] ay kapuwa nasa pangunahing teksto at nakalagay sa mga bahaging tinatalakay ng kani-kanilang talababa.
