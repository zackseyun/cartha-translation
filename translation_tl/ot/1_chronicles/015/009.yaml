  text: 'For the sons of Hebron: Eliel the chief[a], and eighty of his brothers.'
translation:
  language: tl
  text: 'Sa mga anak ni Hebron: si Eliel, ang pinuno, kasama ang walumpung kapatid niya.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kamag-anak.” Literal sa Hebreo, “mga kapatid niya,” ngunit malamang na tumutukoy rito sa mga lalaking kabilang sa angkang kinakatawan ni Eliel.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי
  choice: Sa mga anak ni
  rationale: Ang לְ ay nagpapakilala sa pangkat ng angkan sa loob ng talaan. Pinananatili ng “mga anak ni” ang Hebreong katawagang pampagkamag-anak at natural ito sa ganitong listahan.
- source_word: חֶבְרוֹן
  choice: Hebron
  rationale: Pangngalang pantangi na isinalin sa karaniwang anyong Filipino.
- source_word: אֱלִיאֵל
  choice: Eliel
  rationale: Pangngalang pantangi na tinumbasan sa karaniwang transliterasyong Filipino.
- source_word: הַשָּׂר
  choice: na pinuno
  rationale: Sa konteksto ng mga kinatawan ng angkan, ang שַׂר ay tumutukoy sa taong namumuno o opisyal; hindi nito kinakailangang ipahiwatig ang pagiging prinsipe o pinunong militar.
- source_word: וְאֶחָיו
  choice: at ang ... niyang kapatid
  rationale: Literal na “at ang kaniyang mga kapatid.” Ang isahang anyo ng “kapatid” pagkatapos ng bilang ay likas sa Filipino at pinananatili ang konkretong katawagang pampagkamag-anak ng Hebreo.
- source_word: שְׁמוֹנִים
  choice: walumpu
  rationale: Pamilang na nagsasaad kung ilan ang mga lalaking kasama o kinakatawan ni Eliel.
