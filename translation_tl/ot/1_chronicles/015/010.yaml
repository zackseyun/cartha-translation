lexical_decisions:
- source_word: לִ/בְנֵי
  choice: Sa mga anak ni
  rationale: Ipinakikilala ng ל ang kasunod na pangkat sa talaan; natural sa Filipino ang “Sa mga anak ni,” habang pinananatili ang pananalitang pangangkan.
- source_word: עֻזִּיאֵל
  choice: Uziel
  rationale: Isinatinig ang pangalang pantangi ayon sa karaniwang anyo nito sa Filipino.
- source_word: עַמִּינָדָב
  choice: Aminadab
  rationale: Isinatinig ang pangalang pantangi ayon sa karaniwang anyo nito sa Filipino.
- source_word: הַ/שָּׂר
  choice: na pinuno
  rationale: Sa konteksto ng talaan ng mga pangkat ng Levita, tumutukoy ang שַׂר sa taong namumuno; malinaw at natural sa makabagong Filipino ang “pinuno.”
- source_word: וְ/אֶחָי/ו
  choice: at ang ... niyang mga kapatid
  rationale: Pinananatili ng “mga kapatid” ang pampamilyang katawagan ng אָח, na maaari ring sumaklaw sa mga lalaking kamag-anak o kasapi ng angkan sa ganitong konteksto.
- source_word: מֵאָה וּ/שְׁנֵים עָשָׂר
  choice: '112'
  rationale: Tuwirang paglalahad ng bilang sa paraang madaling basahin sa isang talaan.
