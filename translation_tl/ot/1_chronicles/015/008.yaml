  text: 'For the sons of Elizaphan: Shemaiah the chief[a], and two hundred of his brothers.'
translation:
  language: tl
  text: 'Sa mga anak ni Elizafan: si Semaya ang pinuno, at ang kanyang dalawang daang kapatid.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga kaangkan”; ang salitang Hebreo ay maaaring tumukoy hindi lamang sa literal na magkakapatid kundi pati sa mga kasapi ng iisang angkan sa mga talaang gaya nito.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי
  choice: Sa mga anak ni
  rationale: Ipinakikilala ng ל ang pangkat ng angkan sa talaan; pinananatili ng “mga anak” ang literal na anyo ng בְּנֵי habang natural sa Filipino ang “Sa mga anak ni.”
- source_word: אֱלִיצָפָן
  choice: Elizafan
  rationale: Transliterasyong angkop sa Filipino, kung saan karaniwang kinakatawan ng f ang tunog ng פ na may dagesh sa pangalang ito.
- source_word: שְׁמַעְיָה
  choice: Semaias
  rationale: Ginamit ang kinagawiang anyong Filipino ng pangalang biblikal, na malinaw at madaling basahin.
- source_word: הַשָּׂר
  choice: na pinuno
  rationale: Sa konteksto ng talaan ng mga angkan, tumutukoy ang שַׂר sa namumuno sa pangkat, nang hindi ipinahihiwatig ang ranggong maharlika o tiyak na tungkuling militar.
- source_word: וְאֶחָיו
  choice: at ang ... niyang mga kapatid
  rationale: Pinananatili ang literal na pangunahing diwa ng אָח, ngunit nilalagyan ng talababa dahil maaari rin itong tumukoy sa mas malawak na mga kaangkan sa ganitong talaan.
- source_word: מָאתָיִם
  choice: '200'
  rationale: Tuwirang bilang; ang numerong anyo ay natural at madaling makita sa makabagong talaang Filipino.
