base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/011.yaml
  text: 'Then David called for Zadok and Abiathar the priests, and for the Levites: Uriel, Asaiah, Joel, Shemaiah, Eliel, and Amminadab.'
translation:
  language: tl
  text: Pagkatapos, ipinatawag ni David ang mga paring sina Zadok at Abiatar, at ang mga Levitang sina Uriel, Asaias, Joel, Semaias, Eliel, at Aminadab.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: ipinatawag
  rationale: Sa kontekstong ito, ang wayyiqtol ng קרא ay tumutukoy sa pagpapatawag ni David sa mga taong kailangang humarap sa kaniya. Likas at malinaw sa modernong Tagalog ang “ipinatawag.”
- source_word: לְצָדוֹק וּלְאֶבְיָתָר הַכֹּהֲנִים
  choice: ang mga paring sina Zadok at Abiatar
  rationale: Ipinakikilala ng הַכֹּהֲנִים ang tungkulin nina Zadok at Abiatar. Ang hulma na “mga paring sina” ay natural sa Tagalog at malinaw na kapuwa sila ang tinutukoy.
- source_word: וְלַלְוִיִּם
  choice: at ang mga Levitang
  rationale: Inuulit ng Hebreo ang pang-ukol ל bilang kapantay na layon ng pagpapatawag. Sapat na ipinahihiwatig ito ng iisang pandiwang “ipinatawag” sa natural na sintaks ng Tagalog.
- source_word: לְאוּרִיאֵל עֲשָׂיָה וְיוֹאֵל שְׁמַעְיָה וֶאֱלִיאֵל וְעַמִּינָדָב
  choice: sina Uriel, Asaias, Joel, Semaias, Eliel, at Aminadab
  rationale: Ang anim na pangalang ito ang tumutukoy sa mga Levitang ipinatawag. Ginamit ang “sina” upang malinaw na ipakitang mga pangalan ng tao ang kasunod; ang mga anyo ng pangalan ay umaayon sa nakaugaliang biblikal na baybay sa Filipino.
- source_word: דָוִיד
  choice: David
  rationale: Karaniwang anyo ng pangalang ito sa Filipino.
theological_decisions: []
