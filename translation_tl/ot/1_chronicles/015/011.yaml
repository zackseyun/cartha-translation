  register: Modernong Filipino Tagalog na malinaw, marangal, at likas basahin. Pinanatili ang tuwirang pagkakasunod ng mga taong ipinatawag nang hindi ginagawang mabigat ang paulit-ulit na pang-ukol ng Hebreo.
