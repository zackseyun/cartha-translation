  yaml_path: translation/ot/1_chronicles/015/006.yaml
  text: 'For the sons of Merari: Asaiah the chief[a], and 220 of his brothers.'
translation:
  language: tl
  text: 'Sa mga anak ni Merari: ang pinunong si Asaias at ang 220 niyang mga kapatid.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga kaanak”; maaaring tumukoy ang salitang Hebreo sa mga lalaking kabilang sa iisang angkan o pangkat ng pamilya.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִ/בְנֵי מְרָרִי
  choice: Sa mga anak ni Merari
  rationale: Ang ל ay nagpapakilala sa kasunod na pangkat sa talaan. Pinananatili ng “mga anak ni Merari” ang karaniwang pananalitang pangangkan sa Hebreo.
- source_word: עֲשָׂיָה
  choice: Asaias
  rationale: Isinalin ang pangalang Hebreo ayon sa kinagawiang anyo nito sa mga saling Tagalog.
- source_word: הַ/שָּׂר
  choice: ang pinuno
  rationale: Sa kontekstong ito, ang שַׂר ay tumutukoy sa kinikilalang namumuno sa pangkat; hindi kailangan ang maharlikang pahiwatig ng “prinsipe.”
- source_word: וְ/אֶחָי/ו
  choice: at ang ... niyang mga kapatid
  rationale: Ang “mga kapatid” ang tuwirang katumbas, bagaman maaaring mas malawak ang saklaw ng salitang Hebreo at tumukoy sa mga lalaking kamag-anak o kaangkan.
- source_word: מָאתַיִם וְ/עֶשְׂרִים
  choice: '220'
  rationale: Ginamit ang bilang na numerikal para sa malinaw at makabagong pagbasa nang walang pagbabago sa kahulugan.
