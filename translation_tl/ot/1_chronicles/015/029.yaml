  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יְהִ֗י אֲרוֹן֙ בְּרִ֣ית יְהוָ֔ה בָּ֖א עַד עִ֣יר דָּוִ֑יד וּ/מִיכַ֨ל בַּת שָׁא֜וּל נִשְׁקְפָ֣ה בְּעַ֣ד הַ/חַלּ֗וֹן וַ/תֵּ֨רֶא אֶת הַ/מֶּ֤לֶךְ דָּוִיד֙ מְרַקֵּ֣ד וּ/מְשַׂחֵ֔ק וַ/תִּ֥בֶז ל֖/וֹ בְּ/לִבָּֽ/הּ־־׀־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/029.yaml
  text: And as the ark of the covenant of Yahweh came to the city of David[a], Michal the daughter of Saul looked out through the window and saw King David dancing and playing, and she despised him in her heart.
translation:
  language: tl
  text: Nang makarating sa Lungsod ni David ang kaban ng tipan ni Yahweh, dumungaw sa bintana si Mical na anak ni Saul. Nakita niya si Haring David na sumasayaw at nagsasaya[a], at hinamak niya ito sa kanyang puso.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “naglalaro” o “nagpapakita ng masayang kilos.”
    reason: Ipinakikita ang leksikal na lawak ng מְשַׂחֵק, na maaaring tumukoy sa paglalaro o sa masaya at pampistang pagkilos.
lexical_decisions:
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: ang kaban ng tipan ni Yahweh
  rationale: Pinananatili ang magkakaugnay na mga pangngalang “kaban,” “tipan,” at ang personal na pangalan ng Diyos sa natural na ayos sa Tagalog.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ang Tetragrammaton bilang personal na pangalan ng Diyos, sa halip na palitan ito ng isang titulo.
- source_word: בָּא עַד עִיר דָּוִיד
  choice: makarating sa Lungsod ni David
  rationale: Likas na ipinahahayag ng בוא na may עַד ang pagdating sa patutunguhan, nang hindi iginigiit na nakapasok na ang kaban sa loob ng lungsod.
- source_word: מִיכַל בַּת שָׁאוּל
  choice: si Mical na anak ni Saul
  rationale: Pinananatili ang pagkakakilanlan kay Mical bilang anak ni Saul, na mahalaga sa diin ng salaysay.
- source_word: נִשְׁקְפָה בְּעַד הַחַלּוֹן
  choice: dumungaw sa bintana
  rationale: Natural na Tagalog para sa pagtanaw mula sa bintana; hindi nito labis na tinutukoy kung ang tingin ay pababa o palabas.
- source_word: וַתֵּרֶא אֶת הַמֶּלֶךְ דָּוִיד
  choice: Nakita niya si Haring David
  rationale: Ang “Haring David” ang natural na anyo sa modernong Tagalog para sa titulong kasunod ng pangalan.
- source_word: מְרַקֵּד
  choice: sumasayaw
  rationale: Tumpak at madaling maunawaang katumbas ng masiglang galaw na parang sayaw sa konteksto ng prusisyon.
- source_word: וּמְשַׂחֵק
  choice: nagkakasayahan
  rationale: Ipinahahayag ang masaya at mapaglarong kilos sa pagdiriwang nang hindi ito nililimitahan sa literal na paglalaro; inilalahad sa talababa ang ibang posibleng mga kahulugan.
- source_word: וַתִּבֶז לוֹ
  choice: hinamak niya ito
  rationale: Malakas at maikli itong katumbas ng pandiwang nagsasaad ng paghamak o pagtingin nang may pag-alipusta.
- source_word: בְּלִבָּהּ
  choice: sa kanyang puso
  rationale: Pinananatili ang idyomang Hebreo at ang diin na panloob lamang ang kanyang paghamak.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Personal na pangalan ang nasa tekstong Hebreo. Ang “Yahweh” ay nagpapanatili rito bilang pangalan sa halip na palitan ng titulong “PANGINOON.”
- issue: Likas na katangian ng kilos ni David sa וּמְשַׂחֵק
  choice: nagkakasayahan
  alternative: naglalaro; nagagalak
  rationale: Hindi tahasang hinahatulan o pinupuri ng pandiwa ang kilos; pinananatili ng napiling salita ang masaya at pampistang diwa habang iniiwasang lutasin nang labis ang saklaw nito.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at natural. Hinati sa dalawang pangungusap ang mahabang sugnay na Hebreo upang maging madaling basahin nang hindi binabago ang daloy ng salaysay. Ginawang malaking titik ang “Lungsod” bilang bahagi ng nakaugaliang pantanging katawagang “Lungsod ni David.”
