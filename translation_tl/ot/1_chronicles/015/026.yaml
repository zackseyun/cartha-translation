  text: וַֽ/יְהִי֙ בֶּ/עְזֹ֣ר הָֽ/אֱלֹהִ֔ים אֶ֨ת הַ/לְוִיִּ֔ם נֹשְׂאֵ֖י אֲר֣וֹן בְּרִית יְהוָ֑ה וַ/יִּזְבְּח֥וּ שִׁבְעָֽה פָרִ֖ים וְ/שִׁבְעָ֥ה אֵילִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/026.yaml
  text: And when God helped the Levites who were carrying the ark of the covenant of Yahweh[a], they sacrificed seven bulls and seven rams.
translation:
  language: tl
  text: Nang tulungan ng Diyos ang mga Levitang nagdadala ng kaban ng tipan ni Yahweh, naghandog sila ng pitong toro at pitong lalaking tupa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּעְזֹר
  choice: nang tulungan
  rationale: 'Ang ב na nakakabit sa infinitive construct pagkatapos ng ויהי ay bumubuo ng sugnay na panahunan: “nang tulungan” o “habang tinutulungan.” Natural at tuwiran sa modernong Filipino ang “nang tulungan.”'
- source_word: הָאֱלֹהִים
  choice: ang Diyos
  rationale: Tumutukoy ito sa Diyos ng Israel. Ang “ang Diyos” ang likas na anyo sa Filipino kahit may pantukoy ang Hebreo.
- source_word: הַלְוִיִּם
  choice: ang mga Levita
  rationale: Karaniwang tawag sa mga kabilang sa lipi ni Levi; natural na ipinahahayag sa Filipino sa pamamagitan ng maramihang “mga.”
- source_word: נֹשְׂאֵי
  choice: nagdadala
  rationale: Ang participle ay naglalarawan sa patuloy nilang gawain sa tagpo. Ang “nagdadala” ay malinaw at likas sa Filipino.
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: kaban ng tipan ni Yahweh
  rationale: Pinananatili nito ang hanay ng mga construct sa Hebreo at ang nakaugaliang terminong “kaban ng tipan,” nang hindi labis na ipinapaliwanag ang ugnayan ng tipan at ni Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang personal na pangalan ng Diyos na nasa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: וַיִּזְבְּחוּ
  choice: naghandog sila
  rationale: Sa kontekstong pansakripisyo, malinaw na ipinahahayag ng “naghandog” ang ritwal na pag-aalay. Pinananatili ng “sila” ang maramihang paksa ng pandiwang Hebreo nang hindi tinutukoy nang higit sa teksto kung aling pangkat ang gumawa nito.
- source_word: שִׁבְעָה פָרִים
  choice: pitong toro
  rationale: Ang פָרִים ay karaniwang tumutukoy sa mga toro sa kontekstong pansakripisyo; tuwiran at natural ang salin.
- source_word: וְשִׁבְעָה אֵילִים
  choice: at pitong lalaking tupa
  rationale: Ang אֵילִים ay mga ram. Mas madaling maunawaan ng karaniwang mambabasa ang “lalaking tupa” kaysa sa hiram na katawagang “ram,” at pinananatili ang inuulit na bilang.
theological_decisions:
- issue: Paksa ng paghahandog
  choice: naghandog sila
  alternative: naghandog siya
  rationale: Ang וַיִּזְבְּחוּ ay nasa ikatlong panauhang panlalaking maramihan. Kaya pinananatili ang “sila” at hindi ginagawang isahan o tahasang iniuugnay kay David.
- issue: Ugnayan ni Yahweh sa tipan
  choice: kaban ng tipan ni Yahweh
  alternative: kaban ng pakikipagtipan kay Yahweh
  rationale: Hindi tahasang nililinaw ng construct chain kung ang diin ay sa tipang nauukol kay Yahweh o sa pakikipagtipan sa kanya. Ang pangunahing salin ay pormal at likas; inilalagay sa talababa ang isa pang posibleng pagpapahayag.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “mga Levitang” bilang likas na pag-uugnay, “kaban ng tipan” bilang pamilyar na katawagang biblikal, at “lalaking tupa” para sa madaling pagkaunawa ng pangkalahatang mambabasa.
