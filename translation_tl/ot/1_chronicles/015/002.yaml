source:
  edition: WLC
  text: אָ֚ז אָמַ֣ר דָּוִ֔יד לֹ֤א לָ/שֵׂאת֙ אֶת אֲר֣וֹן הָֽ/אֱלֹהִ֔ים כִּ֖י אִם הַ/לְוִיִּ֑ם כִּי בָ֣/ם בָּחַ֣ר יְהוָ֗ה לָ/שֵׂ֞את אֶת אֲר֧וֹן יְהוָ֛ה וּֽ/לְ/שָׁרְת֖/וֹ עַד עוֹלָֽם־־־׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/002.yaml
  text: Then David said[a], “No one is to carry the ark of God except the Levites[b], for Yahweh has chosen them to carry the ark of Yahweh and to minister to him forever.”
translation:
  language: tl
  text: Pagkatapos ay sinabi ni David[a], “Walang sinuman ang dapat magbuhat ng Kaban ng Diyos maliban sa mga Levita, sapagkat sila ang pinili ni Yahweh upang magbuhat ng Kaban ni Yahweh at maglingkod sa kanya magpakailanman.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Hindi dapat buhatin ng sinuman ang Kaban ng Diyos maliban sa mga Levita.” May pagkakaltas ang Hebreo at hindi tahasang binabanggit ang simuno ng pandiwang “magbuhat.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: Pagkatapos ay
  rationale: Nagsisilbing panandang temporal na nag-uugnay sa sinabi ni David sa naunang mga pangyayari; natural ito sa makabagong Filipino at pinananatili ang pagkakasunod-sunod.
- source_word: לֹא לָשֵׂאת אֶת אֲרוֹן הָאֱלֹהִים כִּי אִם הַלְוִיִּם
  choice: Walang sinuman ang dapat magbuhat ng Kaban ng Diyos maliban sa mga Levita
  rationale: Elliptical ang Hebreo at walang hayag na simuno. Ang pagdaragdag ng “walang sinuman” ay malinaw na naghahatid ng eksklusibong tuntunin nang hindi nilulutas nang tahimik ang pagkaelliptical, na itinatala sa talababa.
- source_word: אֲרוֹן הָאֱלֹהִים / אֲרוֹן יְהוָה
  choice: Kaban ng Diyos / Kaban ni Yahweh
  rationale: Ang “Kaban” ang kinagawiang katawagan sa sagradong sisidlang ito. Ginamit ang “ng” sa titulong Diyos at “ni” sa personal na pangalang Yahweh ayon sa natural na balarilang Filipino.
- source_word: הַלְוִיִּם
  choice: mga Levita
  rationale: Karaniwan at madaling maunawaang katawagan sa mga kabilang sa lipi ni Levi.
- source_word: כִּי בָם בָּחַר יְהוָה
  choice: sapagkat sila ang pinili ni Yahweh
  rationale: Ipinahahayag ng כִּי ang dahilan ng naunang tuntunin, at binibigyang-diin ng hulma na sila ang bukod na pinili para sa gawaing ito.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos na kinakatawan ng Tetragrammaton sa tekstong Hebreo.
- source_word: לָשֵׂאת
  choice: magbuhat
  rationale: Tumutukoy rito sa pisikal na pagpasan at pagdadala sa Kaban; higit na tiyak ang “magbuhat” sa kontekstong ito kaysa sa pangkalahatang “magdala.”
- source_word: וּלְשָׁרְתוֹ
  choice: at maglingkod sa kanya
  rationale: Ang שרת ay tumutukoy sa paglilingkod, lalo na sa sagradong tungkulin. Natural sa Filipino ang “maglingkod sa kanya” at hindi nito nililimitahan ang kahulugan sa isang makitid na teknikal na termino.
- source_word: עַד עוֹלָם
  choice: magpakailanman
  rationale: Natural at marangal na katumbas ng pariralang nagsasaad ng patuloy at walang takdang paglilingkod.
theological_decisions:
- issue: Tinutukoy ng hulaping panghalip sa וּלְשָׁרְתוֹ
  choice: “maglingkod sa kanya,” na ang “kanya” ay tumutukoy kay Yahweh
  alternative: Maglingkod sa harap nito, na iniuugnay ang paglilingkod sa Kaban
  rationale: Si Yahweh ang hayag na personal na tinutukoy sa sugnay, at karaniwang inilalarawan ang tungkulin ng mga Levita bilang paglilingkod sa kanya. Gayunman, hindi dinaragdagan ng salin ang teksto ng mas tiyak na paliwanag kaysa sa ibinibigay ng panghalip.
- issue: Saklaw ng עַד עוֹלָם
  choice: magpakailanman
  alternative: sa habang panahon / palagian
  rationale: Pinananatili ang matinding temporal na pahayag ng Hebreo nang hindi ipinapaliwanag sa mismong talata kung paano ito nauugnay sa mas malawak na teolohiya ng Levitikong paglilingkod.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Kaban” bilang pamilyar na katawagang biblikal, “Yahweh” bilang personal na pangalan, at “maglingkod” bilang natural na salitang may sapat na lawak para sa sagradong paglilingkod. Iniwasan ang labis na teknikal o makalumang pananalita.
