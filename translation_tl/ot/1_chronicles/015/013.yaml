base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/013.yaml
  text: Because you were not there the first time[a], Yahweh our God broke out against us[b], because we did not seek him according to the ordinance.
translation:
  language: tl
  text: Sapagkat noong unang pagkakataon ay hindi kayo kasama[a], bigla niya tayong pinarusahan—si Yahweh na ating Diyos—dahil hindi natin siya hinanap ayon sa itinakdang tuntunin.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Sapagkat noong una ay hindi kayo.” Siksik ang Hebreo at maaaring ipahiwatig na hindi kasali ang mga Levita sa unang pagtatangkang dalhin ang Kaban.'
    reason: alternative_reading
  - marker: b
    text: O, “dahil hindi tayo sumangguni sa kanya ayon sa itinakdang paraan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַ בָּרִאשׁוֹנָה לֹא אַתֶּם
  choice: hindi kayo ang kasama noong unang pagkakataon
  rationale: Siksik at eliptikal ang Hebreo. Sa konteksto ng pananalita ni David sa mga Levita, ipinahihiwatig na hindi sila kasama sa unang pagtatangkang dalhin ang Kaban. Ginagawang malinaw ng salin ang pahiwatig nang hindi idinaragdag sa pangunahing teksto na sila mismo ang dapat magbuhat nito.
- source_word: פָּרַץ ... בָּנוּ
  choice: biglang kumilos laban sa atin
  rationale: Ipinahihiwatig ng pandiwa ang biglaan at matinding pagkilos ng Diyos bilang paghatol. Pinananatili ng parirala ang bigat ng pagkilos laban sa Israel habang natural at malinaw sa makabagong Tagalog.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang transliterasyon ng personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֵינוּ
  choice: ating Diyos
  rationale: Tuwirang isinasalin ang anyong may unang panauhang maramihang hulapi at pinananatili ang ugnayang tipan.
- source_word: דְרַשְׁנֻהוּ
  choice: hinanap natin siya
  rationale: Maaaring mangahulugan ang דרשׁ na hanapin, sumangguni, o magtanong. Ang “hinanap” ay nagpapanatili sa mas malawak na diwang espirituwal at panritwal nang hindi nililimitahan ang kahulugan sa paghingi lamang ng impormasyon.
- source_word: כַּמִּשְׁפָּט
  choice: ayon sa itinakdang tuntunin
  rationale: Tumutukoy rito ang מִשְׁפָּט sa iniatas na wastong paraan ng pagdadala sa Kaban. Ang “itinakdang tuntunin” ay malinaw, normatibo, at hindi labis na teknikal.
theological_decisions:
- issue: Ang ipinahihiwatig na kaisipan sa pambungad na sugnay
  choice: Tinutukoy ng sugnay ang hindi pagsama ng mga Levita sa unang pagtatangkang dalhin ang Kaban.
  alternative: 'Maaaring mas literal na basahin: “Sapagkat noong una ay hindi kayo,” o unawaing “hindi kayo ang nagbuhat nito noong una.”'
  rationale: Sinusuportahan ng 1 Cronica 15:2, 12–15 ang kaugnayan ng mga Levita sa wastong pagdadala ng Kaban. Nililinaw ng pangunahing salin ang elipsis ngunit iniiwasang idagdag ang mas tiyak na “nagbuhat” na wala sa mismong sugnay.
- issue: Ang uri ng pagkilos ng Diyos sa פָּרַץ
  choice: Biglaan at maparusang pagkilos ni Yahweh laban sa Israel
  alternative: “Gumawa si Yahweh ng pagkawasak sa gitna natin” o “sumalakay sa atin si Yahweh.”
  rationale: Pinananatili ang tindi at biglaan ng banal na paghatol, gayundin ang kaugnayan nito sa naunang pangyayari kay Uza, nang hindi nagdaragdag ng paliwanag na teolohikal sa talata.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “Sapagkat” at “ayon sa itinakdang tuntunin” upang mapanatili ang pormal na himig ng pahayag ni David, habang ang “biglang kumilos laban sa atin” ay nagpapahayag ng matinding banal na paghatol sa paraang nauunawaan ng karaniwang mambabasa.
