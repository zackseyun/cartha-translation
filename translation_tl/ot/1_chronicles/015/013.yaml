revisions:
- from: Sapagkat hindi kayo ang kasama noong unang pagkakataon[a], biglang kumilos laban sa atin si Yahweh na ating Diyos, dahil hindi natin siya hinanap ayon sa itinakdang tuntunin.[b]
  to: Sapagkat noong unang pagkakataon ay hindi kayo kasama[a], bigla niya tayong pinarusahan—si Yahweh na ating Diyos—dahil hindi natin siya hinanap ayon sa itinakdang tuntunin.[b]
  rationale: Inayos ang ayos ng pambungad para sa mas natural na Tagalog at pinalitan ang sobrang pangkalahatang “biglang kumilos laban sa atin” ng “bigla niya tayong pinarusahan.” Pinananatili nito ang biglaan at mapanghatol na puwersa ng פָּרַץ sa salaysay, samantalang hindi nito ipinipilit ang literal na metaporang “paglabag” na hindi natural sa Tagalog. Hindi binago ang kahulugan, mga pangalan, o mga angkla at nilalaman ng talababa maliban sa pagpapanatili ng mga ito sa binagong buong teksto.
