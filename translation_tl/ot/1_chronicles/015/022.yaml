base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/022.yaml
  text: And Chenaniah[a], chief of the Levites, directed the carrying[b], because he was skillful at it.
translation:
  language: tl
  text: Si Kenanias[a], pinuno ng mga Levita, ay namahala sa pagdadala[b], sapagkat bihasa siya rito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O kaya: “Si Kenanias, pinuno ng mga Levita, ay namahala sa pag-awit ... sapagkat bihasa siya rito.” Ang salitang Hebreo na מַשָּׂא ay karaniwang nangangahulugang “pasan” o “pagdadala,” ngunit inuunawa ito ng ilan dito sa diwang musikal dahil sa mga nakapaligid na pagbanggit sa mga mang-aawit at manunugtog.'
    reason: alternative_reading
  - marker: b
    text: 'Inuulit sa Hebreo ang parehong pangngalan: “sa pagdadala ... sa pagdadala.” Isinalin ang ikalawang paglitaw nito sa natural na Tagalog bilang “rito.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְנַנְיָהוּ
  choice: Kenanias
  rationale: Isinalin sa karaniwang anyong Filipino ng pangalang Hebreo, na angkop sa tradisyon ng mga pangalang biblikal sa Tagalog.
- source_word: שַׂר
  choice: pinuno
  rationale: Tumutukoy sa isang nangunguna o nangangasiwang opisyal; natural at malinaw ang “pinuno” sa makabagong Tagalog.
- source_word: הַלְוִיִּם
  choice: mga Levita
  rationale: Karaniwang katawagan sa Tagalog para sa mga kabilang sa lipi o pangkat ni Levi; ipinahihiwatig ng “mga” ang tiyak na pangkat sa konteksto.
- source_word: בְּמַשָּׂא
  choice: sa pagbubuhat
  rationale: Ang מַשָּׂא ay karaniwang nangangahulugang pasan, karga, o pagbubuhat. Sa konteksto ng paglilipat sa kaban, ang “pagbubuhat” ang tuwirang kahulugan, habang inilalahad sa talababa ang posibleng kahulugang musikal.
- source_word: יָסֹר
  choice: ang namamahala
  rationale: Ipinahihiwatig ng pandiwa ang pagbibigay-tagubilin o pangangasiwa. Ang “namamahala” ay natural sa Tagalog at nababagay sa tungkulin ni Kenanias bilang pinuno.
- source_word: בַּמַּשָּׂא
  choice: rito
  rationale: Inuulit sa Hebreo ang pangngalang מַשָּׂא. Ginamit ang “rito” upang maging natural sa Tagalog habang pinananatili ang pagtukoy sa gawain ng pagbubuhat; ipinaliliwanag sa talababa ang pag-uulit.
- source_word: כִּי
  choice: sapagkat
  rationale: Malinaw na nagpapakilala sa dahilan ng kanyang pangangasiwa at nagpapanatili ng marangal na himig.
- source_word: מֵבִין הוּא
  choice: bihasa siya
  rationale: Sa konteksto, ang participle ng בין ay nagpapahiwatig ng kakayahan o kadalubhasaan, hindi lamang pangkaisipang pagkaunawa.
theological_decisions:
- issue: Kung ang מַשָּׂא ay tumutukoy sa pagbubuhat o sa gawaing musikal
  choice: pagbubuhat sa pangunahing teksto
  alternative: pag-awit o musika
  rationale: Ang karaniwang leksikal na kahulugan ng מַשָּׂא at ang agarang konteksto ng pagdadala sa kaban ay pumapabor sa “pagbubuhat.” Gayunman, dahil napalilibutan ang talata ng mga sanggunian sa mga mang-aawit at manunugtog, pinananatili sa talababa ang tunay na alternatibong interpretasyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinili ang “namamahala” kaysa sa mas teknikal na “nangangasiwa” upang madaling maunawaan, at “bihasa” upang ipahayag ang praktikal na kasanayan. Napanatili sa mga talababa ang leksikal na pag-uulit at ang ambiguwidad tungkol sa posibleng musikal na kahulugan.
