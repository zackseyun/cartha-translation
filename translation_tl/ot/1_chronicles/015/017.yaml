base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/017.yaml
  text: So the Levites appointed Heman son of Joel[a], and from his brothers Asaph son of Berechiah, and from the sons of Merari, their brothers[b], Ethan son of Kushaiah.
translation:
  language: tl
  text: Kaya itinalaga[a] ng mga Levita si Heman na anak ni Joel; mula naman sa kanyang mga kapatid ay si Asaf na anak ni Berekias; at mula sa mga anak ni Merari[b], na kanilang mga kapatid, ay si Etan na anak ni Kusaias.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “inilagay sa kani-kanilang puwesto” o “pinuwesto.” Ang pandiwang Hebreo ay maaaring mangahulugang pinatayo o inilagay ang isang tao sa isang itinakdang tungkulin.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “mula sa mga anak ni Merari,” ibig sabihin, mula sa angkan ni Merari.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעֲמִידוּ
  choice: itinalaga
  rationale: Ang Hiphil ng עמד ay tumutukoy rito sa pagpapalagay sa isang tao sa itinakdang tungkulin. Likas sa Filipino ang “itinalaga” sa konteksto ng pag-oorganisa sa mga musikero.
- source_word: הַלְוִיִּם
  choice: mga Levita
  rationale: Karaniwang katawagan sa Filipino para sa mga kabilang sa lipi ni Levi; ipinahihiwatig ng “mga” ang tiyak na pangkat sa konteksto.
- source_word: וּמִן אֶחָיו
  choice: mula sa kanyang mga kapatid
  rationale: Pinananatili ang ideya ng pagpili mula sa isang pangkat at ang isahang panghalip na tumutukoy kay Heman sa agarang balangkas ng pangungusap.
- source_word: וּמִן בְּנֵי מְרָרִי
  choice: at mula sa mga anak ni Merari
  rationale: Pinananatili ang literal na ekspresyong pangangkanan sa Hebreo sa halip na gawing mas interpretatibong “mga Merarita.”
- source_word: אֲחֵיהֶם
  choice: na mga kapatid nila
  rationale: Pinananatili ang tahasang katawagang pampamilya, na sa konteksto ay tumutukoy sa kanilang mga kapwa Levita.
- source_word: בֶּן
  choice: anak ni
  rationale: Malinaw at likas na pagpapahayag sa Filipino ng tahasang ugnayang pangangkanan.
theological_decisions: []
translation_notes:
  register: 'Gumamit ng makabago ngunit marangal na Filipino. Ang mga tuldok-kuwit ay nagpapalinaw na tatlong lalaking mula sa magkakaugnay na pangkat ang itinalaga, habang pinananatili ang eliptikong ayos ng Hebreo. Isinalin ang mga pangalan ayon sa karaniwang anyong Filipino: Heman, Joel, Asaf, Berekias, Merari, Etan, at Kusaias.'
