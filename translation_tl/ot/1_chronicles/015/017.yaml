revisions:
- from: Kaya itinalaga[a] ng mga Levita si Heman na anak ni Joel; mula sa kanyang mga kapatid, si Asaf na anak ni Berekias; at mula sa mga anak ni Merari[b], na mga kapatid nila, si Etan na anak ni Kusaias.
  to: Kaya itinalaga[a] ng mga Levita si Heman na anak ni Joel; mula naman sa kanyang mga kapatid ay si Asaf na anak ni Berekias; at mula sa mga anak ni Merari[b], na kanilang mga kapatid, ay si Etan na anak ni Kusaias.
  rationale: Bahagyang inayos ang pangungusap upang luminaw ang magkakatulad na pagpili kay Heman, Asaf, at Etan, at upang maging mas malinaw ang plural na “kanilang mga kapatid.” Walang binagong pangalan, ugnayang pangangkanan, o saklaw ng kahulugan ng pinagmulan.
