    issue: Hindi gaanong malinaw ang panghalip sa “na mga kapatid nila.”
    rationale: Bagaman posible ang kasalukuyang anyo, mas malinaw at mas maayos sa pormal na Filipino ang “na kanilang mga kapatid,” na pinananatili ang plural na panghalip ng Hebreo at ang kaugnayan nito sa naunang mga Levita.
  - severity: low
    issue: Kulang ang pangmarkang pangungusap sa magkakaparis na pariralang “mula sa … si ….”
    rationale: Ang “ay” pagkatapos ng mga pambungad na pariralang “mula sa” ay nagpapadulas at nagpapalinaw sa Filipino, samantalang ang Hebreong elipsis at ang kahulugan ay nananatiling buo.
