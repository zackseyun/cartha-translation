  text: Berechiah and Elkanah were gatekeepers for the ark[a].
translation:
  language: tl
  text: Sina Berekias at Elkana ay mga bantay-pinto para sa Kaban[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga bantay-pinto sa Kaban.” Maaaring ipahiwatig ng pang-ukol sa Hebreo ang atas na may kaugnayan sa Kaban o ang lokasyon sa Kaban.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּרֶכְיָה
  choice: Berekias
  rationale: Isinalin sa anyong pangalang karaniwang ginagamit sa tradisyong biblikal na Tagalog, habang pinananatili ang pagkakakilanlan ng pangalang Hebreo.
- source_word: אֶלְקָנָה
  choice: Elkana
  rationale: Tuwirang transliterasyon sa natural na baybay-Tagalog ng pangalang Hebreo.
- source_word: שֹׁעֲרִים
  choice: mga bantay sa pasukan
  rationale: Tumutukoy sa mga taong nagbabantay o nangangasiwa sa pintuan o pasukan. Mas malinaw ito sa karaniwang modernong Filipino kaysa sa literal ngunit di-gaanong natural na 'mga bantay-pinto,' at mas tiyak kaysa sa pangkalahatang 'mga bantay.'
- source_word: לָאָרוֹן
  choice: para sa Kaban
  rationale: Ipinahahayag ng ל ang kaugnayan o atas ng paglilingkod nila sa Kaban. Pinananatili sa talababa ang posibleng lokatibong pagkaunawa na 'sa tabi ng Kaban.'
- source_word: וְ
  choice: at
  rationale: Likas na pangatnig sa Filipino na nag-uugnay sa dalawang pangalan.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang 'Sina' upang likas na ipakilala ang dalawang taong sabay na paksa. Naka-capitalize ang 'Kaban' bilang pinaikling pantukoy sa Kaban ng Tipan; iniwasan ang masyadong teknikal o lipas na 'mga bantay-pinto.'
