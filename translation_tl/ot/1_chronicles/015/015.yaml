  to: At pinasan ng mga anak ng mga Levita ang kaban ng Diyos sa kanilang mga balikat, gamit ang mga pinggang nakapatong sa mga balikat na iyon, gaya ng iniutos ni Moises ayon sa salita ni Yahweh.
