base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/015.yaml
  text: And the sons of the Levites carried the ark of God on their shoulders with the poles upon them[a], just as Moses had commanded according to the word of Yahweh.
translation:
  language: tl
  text: At pinasan ng mga anak ng mga Levita ang kaban ng Diyos sa kanilang mga balikat, gamit ang mga pinggang nakapatong sa mga balikat na iyon, gaya ng iniutos ni Moises ayon sa salita ni Yahweh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׂאוּ
  choice: pinasan
  rationale: Sa konteksto, ang נָשָׂא ay tumutukoy sa pagdadala ng kaban, at malinaw na balikat ang sumusuporta rito. Ang “pinasan” ay natural at mas tiyak kaysa sa pangkalahatang “dinala.”
- source_word: בְנֵי הַלְוִיִּם
  choice: mga anak ng mga Levita
  rationale: Pinananatili nito ang tahasang panlalaki at pampamilyang anyo ng Hebreong parirala sa halip na paikliin lamang bilang “mga Levita.”
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: kaban ng Diyos
  rationale: Ito ang tuwirang kahulugan ng teksto; hindi idinagdag ang “tipan,” na wala sa talata.
- source_word: כַּאֲשֶׁר צִוָּה מֹשֶׁה
  choice: gaya ng iniutos ni Moises
  rationale: Ipinahahayag ng “gaya ng” ang pagsunod o pagtutugma sa naunang utos, at natural ito sa modernong Filipino.
- source_word: כִּדְבַר יְהוָה
  choice: ayon sa salita ni Yahweh
  rationale: Pinananatili ng “salita” ang literal na ugnayan sa דָּבָר at hindi ito tahimik na nililimitahan sa “utos” lamang.
- source_word: בִּכְתֵפָם
  choice: sa kanilang mga balikat
  rationale: Natural at tiyak nitong ipinapakita kung saan pinasan ang kaban.
- source_word: בַּמֹּטוֹת עֲלֵיהֶם
  choice: na ang mga pingga ay nakapatong sa mga ito
  rationale: Ipinapakita nito na ang mga pingga ang nakapatong sa mga balikat habang dinadala ang kaban, habang pinananatili ang maaaring pag-ugnayan ng panghalip sa naunang “mga balikat.”
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Ginagamit mismo ng talata ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng titulo.
- issue: Panlalaking katawagang panlipi sa בְנֵי הַלְוִיִּם
  choice: mga anak ng mga Levita
  alternative: mga Levita
  rationale: Pinananatili ang tahasang filial at panlalaking pahayag ng Hebreo nang hindi ito ginagawang pangkalahatang kolektibo.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “pinasan” upang maging kongkreto ang paraan ng pagdadala; ang “pingga” ay ang karaniwang terminong angkop sa mga mahabang kahoy na ginagamit sa pagbuhat o pagdadala.
