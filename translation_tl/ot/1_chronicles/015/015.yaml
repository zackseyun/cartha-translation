    rationale: Ang “mga ito” ay walang malinaw na iisang pangngalang pinatutungkulan sa Filipino. Sa Hebreo, ang panghalip sa עֲלֵיהֶם ay tumutukoy sa mga tagapasan, at ang parirala ay nagpapahiwatig na ang mga pingga ay nasa kanilang mga balikat. Kailangang linawin ito sa salin nang hindi nagdaragdag ng kahulugan.
  revised_text: At pinasan ng mga anak ng mga Levita ang kaban ng Diyos sa kanilang mga balikat, gamit ang mga pinggang nakapatong sa mga balikat na iyon, gaya ng iniutos ni Moises ayon sa salita ni Yahweh.
