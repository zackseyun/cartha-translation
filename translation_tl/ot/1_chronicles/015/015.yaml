  verdict: revise
  source_fidelity: 'Tumpak na naisasalin ng draft ang pangunahing diwa: ang mga anak ng mga Levita ang nagpasan ng kaban ng Diyos sa kanilang mga balikat, alinsunod sa utos ni Moises at sa salita ni Yahweh. Gayunman, ang “mga ito” sa pangunahing teksto ay maaaring maling iugnay sa “pingga” o sa “balikat”; dapat tahasang tukuyin na ang mga pingga ay nakapatong sa mga balikat.'
  naturalness: Marangal at nauunawaan ang rehistro. Ang pagpapalit ng malabong panghalip na “mga ito” sa “mga balikat na iyon” ay mas malinaw at nananatiling natural sa modernong Filipino.
  terminology: Ang “kaban ng Diyos,” “mga anak ng mga Levita,” at “Yahweh” ay angkop at tapat sa anyo ng pinagmulang Hebreo. Ang “mga pingga” ay katanggap-tanggap na termino para sa mga pambuhat na kahoy.
  issues:
