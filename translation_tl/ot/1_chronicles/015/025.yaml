    rationale: Maaaring tanggapin ang “iahon,” ngunit madalas itong nagpapahiwatig ng pag-ahon o paghango mula sa isang mababang kalagayan o lugar. “Iakyat” ang mas tuwirang salin ng layuning magdala paitaas.
  revised_text: Kaya pumunta si David, ang mga nakatatanda ng Israel, at ang mga pinuno ng libu-libo upang iakyat ang kaban ng tipan ni Yahweh mula sa bahay ni Obed-edom nang may kagalakan.
