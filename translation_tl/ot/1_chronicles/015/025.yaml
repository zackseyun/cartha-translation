base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/025.yaml
  text: So David, and the elders of Israel, and the commanders of the thousands went to bring up the ark of the covenant of Yahweh from the house of Obed-edom with joy.
translation:
  language: tl
  text: Kaya pumunta si David, ang mga nakatatanda ng Israel, at ang mga pinuno ng libu-libo upang iakyat ang kaban ng tipan ni Yahweh mula sa bahay ni Obed-edom nang may kagalakan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי ... הַהֹלְכִים
  choice: Kaya pumunta
  rationale: Ang וַיְהִי ay panimulang pangkuwento, samantalang ang participle na הַהֹלְכִים ang nagsasaad ng pagkilos ng pangkat. Pinagsama ang tungkulin ng dalawa sa natural na salaysay sa Tagalog.
- source_word: זִקְנֵי יִשְׂרָאֵל
  choice: ang matatandang pinuno ng Israel
  rationale: Sa kontekstong ito, ang זִקְנֵי ay hindi lamang tumutukoy sa matatanda sa edad kundi sa kinikilalang mga lider; nililinaw ito ng “matatandang pinuno.”
- source_word: שָׂרֵי הָאֲלָפִים
  choice: ang mga pinuno ng libu-libo
  rationale: Pinananatili ang anyo at posibleng militar o administratibong saklaw ng Hebreo nang hindi labis na tinutukoy kung anong uri ng yunit ang mga “libu-libo.”
- source_word: לְהַעֲלוֹת
  choice: upang iahon
  rationale: Ang causative na anyo ng עלה ay nangangahulugang dalhin o paakyatin; ang “iahon” ay maikli at angkop sa pagdadala ng kaban patungo sa Jerusalem.
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: ang kaban ng tipan ni Yahweh
  rationale: Natural na Tagalog na pagpapahayag ng construct chain habang pinananatili ang ugnayan ng kaban, tipan, at pangalang Yahweh.
- source_word: מִן בֵּית עֹבֵד אֱדֹם
  choice: mula sa bahay ni Obed-edom
  rationale: Tuwirang salin ng pariralang Hebreo at likas na anyo ng pagmamay-ari sa Tagalog.
- source_word: בְּשִׂמְחָה
  choice: nang may kagalakan
  rationale: Ginagawang pang-abay ang parirala upang ilarawan ang masayang paraan o kalagayan ng pag-ahon sa kaban.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; PANGINOON
  rationale: Personal na pangalan ang tahasang nasa tekstong Hebreo. Ang “Yahweh” ay nagpapanatili rito bilang pangalan sa halip na palitan ng isang titulo.
- issue: Ugnayan sa pariralang אֲרוֹן בְּרִית יְהוָה
  choice: kaban ng tipan ni Yahweh
  alternative: kaban ng tipan ni Yahweh / kaban ng tipan kay Yahweh
  rationale: Pinananatili ang siksik na ugnayang gramatikal ng Hebreo nang hindi ipinapaliwanag kung ang tipan ay pag-aari, itinatag, o kaugnay ni Yahweh.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “matatandang pinuno” upang malinaw ang institusyonal na diwa ng elders, at pinanatili ang “mga pinuno ng libu-libo” upang hindi patawan ng mas makitid na interpretasyong militar ang Hebreo.
