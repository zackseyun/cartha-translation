  source_fidelity: 'Tumpak ang pangunahing nilalaman ng draft: kasama si David, ang mga elder ng Israel, at ang mga pinuno ng mga libo sa pagdadala ng kaban mula sa bahay ni Obed-edom nang may kagalakan. Gayunman, ang “matatandang pinuno” ay nagdaragdag ng “pinuno” sa זִקְנֵי at maaaring magmukhang paglalarawan ng edad sa halip na kinikilalang pangkat. Ang “iahon” ay maaari ring magpahiwatig ng paghango o pag-ahon mula sa kinalalagyan, samantalang ang Hebreo ay tumutukoy sa pagpapaiakyat/pagdala paitaas.'
  naturalness: Natural at marangal ang kabuuang daloy, ngunit mas malinaw at mas likas sa modernong Filipino ang “mga nakatatanda ng Israel” para sa institusyonal na pangkat. Ang “upang iakyat” ay mas tuwirang katumbas ng layuning ipahiwatig ng להביא/להעלות sa kontekstong ito.
  terminology: Pinanatili ang “Yahweh,” “kaban ng tipan,” at “Obed-edom.” Ang “mga nakatatanda” ay pinananatiling sapat na malapit sa Hebrew elders nang hindi nagdaragdag ng isang tiyak na tungkuling wala sa teksto. Ang “mga pinuno ng libu-libo” ay angkop at hindi labis na nagpapakahulugan sa mga yunit.
  issues:
