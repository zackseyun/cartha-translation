  text: 'For the sons of Kohath: Uriel the chief[a], and 120 of his brothers.'
translation:
  language: tl
  text: 'Sa mga anak ni Kohat: si Uriel na pinuno, at ang 120 niyang mga kapatid.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga kaanak.” Malamang na ang “mga kapatid” dito ay tumutukoy sa kapwa mga miyembro ng angkan ni Kohat, hindi lamang sa mga kapatid sa laman.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי קְהָת
  choice: Sa mga anak ni Kohat
  rationale: Ang לְ ay nagpapakilala sa pangkat ng angkan sa talaan, at ang בְּנֵי ay pinanatiling “mga anak” sapagkat karaniwang katawagan ito sa linya o angkan ng isang ninuno.
- source_word: אוּרִיאֵל
  choice: Uriel
  rationale: Pangalan ng tao na isinalin sa karaniwang transliterasyong Filipino.
- source_word: הַשָּׂר
  choice: na pinuno
  rationale: Ang שַׂר ay tumutukoy sa namumuno o pangulo ng pangkat; ang “pinuno” ay likas at hindi nagpapahiwatig ng pagkahari.
- source_word: וְאֶחָיו
  choice: at ang ... niyang mga kapatid
  rationale: Literal na “mga kapatid niya,” ngunit maaari ring tumukoy sa mga lalaking kaanak o kapwa miyembro ng angkan; pinanatili sa teksto ang konkretong salita ng Hebreo.
- source_word: מֵאָה וְעֶשְׂרִים
  choice: '120'
  rationale: Ginamit ang numerong anyo para sa malinaw at natural na pagbasa sa isang talaang nagbibilang ng mga pangkat.
