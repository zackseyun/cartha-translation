base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/018.yaml
  text: 'And with them were their brothers of the second rank: Zechariah[a], Ben-Jaaziel, and Shemiramoth, and Jehiel, and Unni, Eliab, and Benaiah, and Maaseiah, and Mattithiah, and Eliphelehu, and Mikneiah, and Obed-edom, and Jeiel, the gatekeepers.'
translation:
  language: tl
  text: Kasama nila ang kanilang mga kapatid na nasa ikalawang hanay:[a] sina Zacarias, Ben, Jaaziel, Semiramot, Jehiel, Uni, Eliab, Benaias, Maasias, Matatias, Elifelehu, Mikneias, Obed-Edom, at Jeiel, na mga bantay ng pintuan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kanilang mga kapatid, ang ikalawang pangkat” o “kanilang mga kapatid na nasa ikalawang antas.” Malamang na ipinakikilala ng Hebreo ang isang pangalawang hanay ng mga Levita o musikero.
    reason: Pinananatili ang maaaring tumukoy sa ranggo, kaayusan, o pangkat.
lexical_decisions:
- source_word: וְעִמָּהֶם
  choice: Kasama nila
  rationale: Natural na salin ng pariralang nagpapakilala sa isa pang pangkat na kasama ng mga naunang binanggit; ipinahihiwatig lamang sa Hebreo ang pandiwang ‘ay/naroon.’
- source_word: אֲחֵיהֶם
  choice: kanilang mga kapatid
  rationale: Pinananatili ang literal na ugnayang ‘mga kapatid,’ na sa kontekstong Levitico ay maaari ring tumukoy sa mga kapwa Levita.
- source_word: הַמִּשְׁנִים
  choice: nasa ikalawang hanay
  rationale: Ipinahihiwatig ng salita ang pagiging pangalawa o nasa pangalawang antas/pangkat; ang ‘hanay’ ay malinaw ngunit hindi lubusang nagtatakda kung ranggo o pangkat ang tinutukoy.
- source_word: בֵּן
  choice: Ben
  rationale: Sa anyo ng tekstong Masoretiko, nakahanay ito sa mga pangalang pinag-uugnay at walang kasunod na pangalan na malinaw na magsisilbing ama; kaya pinanatili bilang hiwalay na pangalang pantangi, kasabay ng talababa tungkol sa kahirapan ng pagbasa.
- source_word: הַשֹּׁעֲרִים
  choice: mga bantay ng pintuan
  rationale: Tumutukoy sa mga taong nakatalaga sa pagbabantay sa mga pasukan; ginamit ang karaniwang makabagong Filipino.
- source_word: זְכַרְיָהוּ … יַעֲזִיאֵל … שְׁמִירָמוֹת
  choice: Zacarias … Jaaziel … Semiramot
  rationale: Ginamit ang mga anyong madaling basahin sa Filipino, na sumusunod sa nakaugaliang biblikal na pagsasalin ng mga pangalan habang kinakatawan ang mga pangalang Hebreo.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang anyong talaan ng mga pangalan ngunit binawasan ang paulit-ulit na pangatnig upang maging natural sa Tagalog. Ang “na mga bantay ng pintuan” ay natural na inuugnay sa dalawang huling pangalan, sina Obed-Edom at Jeiel.
