  yaml_path: translation/ot/1_chronicles/015/019.yaml
  text: The singers were Heman[a], Asaph, and Ethan, with bronze cymbals to sound aloud.
translation:
  language: tl
  text: Ang mga mang-aawit na sina Heman, Asaf, at Etan ay may mga pompiya na tanso upang magpatunog.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “upang iparinig” o “upang pagtunugin upang marinig.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַמְשֹׁרְרִים
  choice: Ang mga mang-aawit
  rationale: Tumutukoy ang may-artikulong participle sa mga taong umaawit. Mas tiyak ang “mga mang-aawit” kaysa “mga musikero”; hindi na tahasang isinalin ang panimulang pangatnig upang maging natural ang daloy sa Filipino.
- source_word: הֵימָן אָסָף וְאֵיתָן
  choice: sina Heman, Asaf, at Etan
  rationale: Isinalin ang mga pangalang pantangi sa karaniwang anyong Filipino at ginamit ang “sina” para sa likas na talaan ng mga pangalan ng tao.
- source_word: בִּמְצִלְתַּיִם
  choice: may mga pompiyang
  rationale: Ang מְצִלְתַּיִם ay mga cymbal; “pompiyang” ang malinaw at karaniwang katawagang Filipino. Ipinahahayag ng parirala na ito ang instrumentong taglay at ginagamit nila.
- source_word: נְחֹשֶׁת
  choice: tanso
  rationale: Maaaring tumukoy ang salita sa copper o bronze. Ang “tanso” ang natural na malawak na katawagang Filipino para sa metal na ito at hindi nagpapasok ng anakronistikong “brass.”
- source_word: לְהַשְׁמִיעַ
  choice: upang magpatunog nang malakas
  rationale: Ang Hiphil infinitive ng שׁמע ay literal na “upang iparinig” o “upang maging maririnig.” Sa kontekstong pangmusika, likas na ipinahahayag ng “magpatunog nang malakas” ang kapansin-pansing pagpapatunog nang hindi nagdaragdag ng tahasang layon.
