base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/003.yaml
  text: And David assembled all Israel at Jerusalem to bring up the ark of Yahweh to its place[b][a], which he had prepared for it.
translation:
  language: tl
  text: Tinipon ni David ang buong Israel sa Jerusalem upang iakyat ang Kaban ni Yahweh sa lugar nito, na inihanda niya para rito.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “na inihanda niya para sa kanya.” Panlalaki ang hulaping panghalip na לוֹ sa Hebreo; sa konteksto, pinakamalamang na tumutukoy ito sa Kaban.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְהֵל
  choice: Tinipon
  rationale: Ang Hiphil ng קהל ay nangangahulugang pinangyari ni David na magtipon ang bayan. Likas at tuwiran sa modernong Tagalog ang “tinipon.”
- source_word: כָּל יִשְׂרָאֵל
  choice: ang buong Israel
  rationale: Pinananatili nito ang kolektibong pagtukoy sa bansang Israel nang hindi ipinipilit kung bawat indibidwal o mga kinatawan nito ang naroon.
- source_word: אֶל יְרוּשָׁלִָם
  choice: sa Jerusalem
  rationale: Bagaman karaniwang may diwang patungo ang אֶל, likas sa Tagalog na sabihin na tinipon ang mga tao “sa” isang lugar; ipinahahayag nito ang lugar ng pagtitipon.
- source_word: לְהַעֲלוֹת
  choice: upang iahon
  rationale: Pinananatili ng “iahon” ang diwa ng pagpapataas o pagdadala paitaas na taglay ng עלה sa kontekstong ito.
- source_word: אֲרוֹן יְהוָה
  choice: ang Kaban ni Yahweh
  rationale: Ang “Kaban” ay malinaw at marangal na katawagan sa banal na sisidlan, at ang kayariang “ni Yahweh” ay likas na katumbas ng Hebrew construct.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang transliterasyon ng banal na pangalang יהוה sa halip na palitan ito ng isang titulo.
- source_word: אֶל מְקוֹמוֹ
  choice: sa lugar nito
  rationale: Ang panlalaking hulapi ay pinakalikas na tumutukoy sa Kaban, na panlalaki rin sa Hebreo; hindi idinaragdag ang diwang “wastong” na wala sa teksto.
- source_word: אֲשֶׁר הֵכִין לוֹ
  choice: na inihanda niya para rito
  rationale: Ipinahihiwatig ng “inihanda” na nauna na ang paghahanda, at ang “para rito” ay pinakalikas na tumutukoy sa Kaban habang kinikilala sa talababa ang anyong hindi tahasang pinapangalanan ng Hebreo.
theological_decisions:
- issue: Pagpapahayag sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang ginagamit ng talata ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng titulong “PANGINOON.”
- issue: Tinutukoy ng hulaping לוֹ
  choice: ang Kaban (“para rito”)
  alternative: si Yahweh o ibang panlalaking tinutukoy (“para sa kanya”)
  rationale: Sa daloy ng pangungusap, ang Kaban at ang lugar nito ang pinakamalapit at pinakalikas na tinutukoy, ngunit hindi tahasang inuulit ng Hebreo ang pangngalan kaya pinananatili sa talababa ang pormal na posibilidad.
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran ngunit marangal. Ginamit ang “Kaban” bilang pamilyar na katawagan sa ark at “iahon” upang mapanatili ang kilos na paitaas. Hindi nilagyan ng talababa ang “sa Jerusalem” sapagkat ito ang likas na Tagalog sa pandiwang “tinipon,” kahit אֶל ay karaniwang nagpapahiwatig ng direksiyon.
