source:
  edition: WLC
  text: וְ/דָוִ֞יד מְכֻרְבָּ֣ל בִּ/מְעִ֣יל בּ֗וּץ וְ/כָל הַ/לְוִיִּם֙ הַ/נֹּשְׂאִ֣ים אֶת הָ/אָר֔וֹן וְ/הַ/מְשֹׁ֣רְרִ֔ים וּ/כְנַנְיָ֛ה הַ/שַּׂ֥ר הַ/מַּשָּׂ֖א הַ/מְשֹֽׁרְרִ֑ים וְ/עַל דָּוִ֖יד אֵפ֥וֹד בָּֽד׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/027.yaml
  text: David was clothed with a robe of fine linen[a], as were all the Levites who were carrying the ark, and the singers, and Chenaniah, the leader of the singing of the singers; and on David was a linen ephod.
translation:
  language: tl
  text: Si David, ang lahat ng Levitang nagdadala ng Kaban ng Tipan, ang mga mang-aawit, at si Kenanias, ang pinuno ng pagdadala sa mga mang-aawit,[a] ay nakasuot ng balabal na pinong lino. Bukod dito, nakasuot si David ng efod na lino.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mahirap ang pariralang Hebreo. Maaari rin itong isalin na “ang pinuno ng pag-awit” o “ang pinuno ng musika.”
    reason: alternative_reading
lexical_decisions:
- source_word: מְכֻרְבָּל בִּמְעִיל בּוּץ
  choice: nakasuot ng balabal na pinong lino
  rationale: Ipinapahayag ng pasibong anyo na nadaramtan si David; natural sa modernong Tagalog ang “nakasuot,” habang pinananatili ng “balabal na pinong lino” ang uri at mataas na kalidad ng kasuotan.
- source_word: הַלְוִיִּם הַנֹּשְׂאִים אֶת־הָאָרוֹן
  choice: ang lahat ng Levitang nagdadala ng Kaban
  rationale: Tuwirang inilalarawan ang nagpapatuloy na kilos ng mga Levita sa prusisyon. Ginamit ang “Kaban” bilang maikli ngunit kinikilalang katawagan sa banal na kaban sa konteksto.
- source_word: הַמְשֹׁרְרִים
  choice: ang mga mang-aawit
  rationale: Partikular na tumutukoy ang ugat sa pag-awit, kaya mas eksakto ito kaysa sa mas malawak na “mga musikero.”
- source_word: כְנַנְיָה
  choice: Kenanias
  rationale: Ang anyong “Kenanias” ay natural at nakaugaliang transliterasyon sa Tagalog ng pangalang Hebreo.
- source_word: הַשַּׂר הַמַּשָּׂא הַמְשֹׁרְרִים
  choice: ang pinuno sa pagdadala ng mga mang-aawit
  rationale: Pinananatili sa pangunahing teksto ang karaniwang kahulugan ng מַשָּׂא bilang “pagdadala,” kahit mahirap at maaaring unawain sa ibang paraan ang buong pariralang Hebreo; inilalahad sa talababa ang mga pangunahing alternatibo.
- source_word: אֵפוֹד בָּד
  choice: efod na lino
  rationale: Pinananatili ang tiyak na katawagang “efod” sa halip na bigyan ito ng interpretasyong makapari; malinaw na isinasaad ng “na lino” ang materyal.
- source_word: וְעַל דָּוִיד
  choice: Nakasuot din si David
  rationale: Natural na Tagalog para sa literal na “at nasa ibabaw ni David,” habang ipinakikitang karagdagang kasuotan ang efod.
theological_decisions:
- issue: Ang kahulugan ng pagsusuot ni David ng efod sa kontekstong liturhikal
  choice: Panatilihin ang “efod” bilang pangalan ng kasuotan nang hindi sinasabing gumaganap si David bilang pari.
  alternative: Isalin bilang “kasuotang makapari” o tahasang ipahiwatig na pari ang ginagampanan ni David.
  rationale: Sinasabi lamang ng talata kung ano ang suot ni David; hindi nito tahasang iginagawad sa kaniya ang katungkulang makapari.
- issue: Ang mahirap na pariralang הַשַּׂר הַמַּשָּׂא הַמְשֹׁרְרִים
  choice: Panatilihin sa teksto ang “pinuno sa pagdadala ng mga mang-aawit” at ilagay sa talababa ang ibang posibleng pagbasa.
  alternative: “pinuno sa pag-awit” o “pinuno ng musika.”
  rationale: Mahirap ang sintaks ng tekstong Masoretiko at hindi dapat itago ang tunay na kalabuan sa pamamagitan ng pagpili lamang ng isang makinis na interpretasyon.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “nakasuot” sa halip na mas lumang “nararamtan,” at pinanatili ang mga teknikal na katawagang “Kaban” at “efod” nang walang labis na pagpapaliwanag sa pangunahing teksto.
