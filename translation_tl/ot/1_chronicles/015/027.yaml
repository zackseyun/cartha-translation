revisions:
- from: Nakasuot si David ng balabal na pinong lino, gayundin ang lahat ng Levitang nagdadala ng Kaban, ang mga mang-aawit, at si Kenanias, ang pinuno sa pagdadala[a] ng mga mang-aawit. Nakasuot din si David ng efod na lino.
  to: Si David, ang lahat ng Levitang nagdadala ng Kaban ng Tipan, ang mga mang-aawit, at si Kenanias, ang pinuno ng pagdadala sa mga mang-aawit,[a] ay nakasuot ng balabal na pinong lino. Bukod dito, nakasuot si David ng efod na lino.
  rationale: Inayos ang estruktura upang malinaw na ang balabal na pinong lino ay suot ng lahat ng grupong binanggit, hindi lamang ni David. Pinalinaw ang “Kaban” bilang “Kaban ng Tipan.” Binago ang paglalapat sa mahirap na pariralang Hebreo upang hindi ipahiwatig na ang mga mang-aawit ang dinadala, habang pinananatili ng talababa ang mga makatwirang alternatibong pagbasa. Hindi ipinapakahulugan ang efod bilang katibayan ng tungkuling makapari.
