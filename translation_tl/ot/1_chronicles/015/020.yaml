base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/020.yaml
  text: and Zechariah[a], Aziel, Shemiramoth, Jehiel, Unni, Eliab, Maaseiah, and Benaiah, with harps according to Alamoth.
translation:
  language: tl
  text: at sina Zacarias, Aziel, Semiramot, Jehiel, Uni, Eliab, Maaseias, at Benaias, na may mga alpa ayon sa Alamot.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “na may mga alpa sa mataas na rehistro.” Ang salitang Hebreo na “Alamot” ay maaaring isang panutong musikal na kaugnay ng mga dalaga o ng mataas na tono.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּנְבָלִים
  choice: na tumutugtog ng mga alpa
  rationale: Ang נְבָלִים ay mga instrumentong de-kuwerdas, karaniwang inuunawang mga alpa o lira. Sa konteksto ng talaan ng mga musikero, malinaw at natural sa Filipino ang aktibong pariralang “na tumutugtog ng mga alpa,” habang ipinahahayag ng בִּ ang instrumentong ginagamit.
- source_word: עַל
  choice: ayon sa
  rationale: Sa kontekstong musikal, malamang na ipinakikilala ng עַל ang paraan, himig, o rehistrong kaugnay ng עֲלָמוֹת. Pinananatili ng “ayon sa” ang lawak ng kahulugan nang hindi tiyakang nilulutas ang teknikal na direksiyon.
- source_word: עֲלָמוֹת
  choice: Alamot
  rationale: Bagaman kaugnay ang salita sa “mga dalaga,” ginagamit ito rito bilang teknikal na terminong musikal na hindi tiyak ang kahulugan, marahil ay tumutukoy sa mataas na rehistro. Pinanatili ang anyong transliterado upang hindi magpanggap ng katiyakan.
- source_word: וּ/זְכַרְיָה וַ/עֲזִיאֵל וּ/שְׁמִירָמוֹת וִֽ/יחִיאֵל וְ/עֻנִּי וֶֽ/אֱלִיאָב וּ/מַעֲשֵׂיָהוּ וּ/בְנָיָהוּ
  choice: at sina Zacarias, Aziel, Semiramot, Jehiel, Uni, Eliab, Maaseias, at Benaias
  rationale: Isinalin ang mga pangalang pantangi sa mga anyong pamilyar sa tradisyong Tagalog/Filipino, habang pinanatili ang unang pangatnig at ginawang natural ang koordinasyon ng talaan sa Filipino.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “sina” para sa natural na talaan ng mga tao at ang aktibong “na tumutugtog” upang maging malinaw ang gamit ng mga instrumento. Pinanatili ang teknikal na terminong “Alamot” at ipinaliwanag sa talababa dahil hindi tiyak ang eksaktong kahulugan nito.
