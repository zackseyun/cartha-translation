  text: And David gathered the sons of Aaron and the Levites.
translation:
  language: tl
  text: Tinipon ni David ang mga anak ni Aaron at ang mga Levita.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֶּאֱסֹף
  choice: Tinipon
  rationale: Ang pandiwang אסף sa anyong pasalaysay ay nangangahulugang pinagsama-sama o tinawag upang magtipon ang mga tao. Natural at tuwiran sa makabagong Tagalog ang “tinipon.”
- source_word: דָּוִיד
  choice: David
  rationale: Ito ang karaniwang anyo ng pangalang Hebreo sa mga saling Tagalog.
- source_word: בְּנֵי אַהֲרֹן
  choice: mga anak ni Aaron
  rationale: Pinananatili nito ang literal at genealogical na diwa ng Hebreong “mga anak ni Aaron,” sa halip na tahasang ipakahulugang “mga pari” o gawing mas malawak na “mga inapo.”
- source_word: הַלְוִיִּם
  choice: mga Levita
  rationale: Ito ang nakagawiang katawagan sa Tagalog para sa pangkat na nagmula kay Levi at angkop sa kontekstong panrelihiyon.
- source_word: אֵת ... וְאֵת
  choice: hindi hiwalay na isinalin; ipinahayag sa koordinasyong “... at ...”
  rationale: Ang אֵת ay pananda ng tiyak na tuwirang layon at walang kailangang hiwalay na katumbas sa Tagalog. Ang dalawang layon ay natural na pinag-ugnay ng “at.”
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang payak na estruktura ng Hebreo at ang genealogical na katawagang “mga anak ni Aaron,” nang hindi nagdaragdag ng interpretasyong hindi tahasang nasa teksto.
