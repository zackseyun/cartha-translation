  text: וַ/יִּֽתְקַדְּשׁ֔וּ הַ/כֹּהֲנִ֖ים וְ/הַ/לְוִיִּ֑ם לְ/הַעֲל֕וֹת אֶת אֲר֥וֹן יְהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/014.yaml
  text: So the priests and the Levites consecrated themselves to bring up the ark of Yahweh[a], the God of Israel.
translation:
  language: tl
  text: Kaya nagpakabanal ang mga pari at mga Levita upang iakyat ang Kaban ni Yahweh, ang Diyos ng Israel.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּתְקַדְּשׁוּ
  choice: itinalaga ... ang kanilang sarili
  rationale: Ang Hitpael ng קדשׁ ay nagpapahayag ng pansariling paghahanda para sa banal na paglilingkod. Likas sa modernong Filipino ang pariralang ito at nananatili rito ang ritwal na diwa ng pagtatalaga.
- source_word: הַכֹּהֲנִים
  choice: ang mga pari
  rationale: Karaniwang salin ng כהנים sa konteksto ng paglilingkod sa Diyos.
- source_word: וְהַלְוִיִּם
  choice: at ang mga Levita
  rationale: Karaniwan at malinaw na katawagan sa mga kabilang sa lipi ni Levi na may tungkuling panrelihiyon.
- source_word: לְהַעֲלוֹת
  choice: upang iahon
  rationale: Ang Hiphil ng עלה ay nangangahulugang paakyatin o dalhin paitaas. Ang 'iahon' ay maikli at natural, at hindi nito labis na tinutukoy ang paraan ng pagdadala.
- source_word: אֶת אֲרוֹן
  choice: ang Kaban
  rationale: Ang 'Kaban' ang nakaugaliang katawagan sa sagradong kaban sa kontekstong ito; ginamit ang malaking titik bilang tiyak na katawagan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ng 'Yahweh' ang banal na pangalang YHWH sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ang Diyos ng Israel
  rationale: Tuwirang salin ng construct chain at paglalarawan kay Yahweh bilang Diyos ng Israel.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יהוה
  choice: Yahweh
  alternative: Jehovah; ang PANGINOON
  rationale: Personal na pangalan ang nasa tekstong Hebreo, kaya pinanatili ito bilang 'Yahweh' sa halip na palitan ng titulo.
- issue: Ritwal na diwa ng וַיִּתְקַדְּשׁוּ
  choice: itinalaga ... ang kanilang sarili
  alternative: pinabanal nila ang kanilang sarili; nagpakabanal sila
  rationale: Pinananatili ng napiling salin ang reflexive na pagkilos at paghahanda para sa banal na tungkulin nang hindi ipinahihiwatig na sila ang ultimong pinagmumulan ng kabanalan.
translation_notes:
  register: Modernong Filipino na dignified at madaling maunawaan. Pinanatili ang tahasang 'ang kanilang sarili' upang katawanin ang reflexive na anyo ng pandiwa. Hindi isinama ang ibinigay na English footnote dahil mali ang pagkakalagay ng marker nito sa English main text at hindi kailangan ang lexical alternative para maging malinaw ang talata.
