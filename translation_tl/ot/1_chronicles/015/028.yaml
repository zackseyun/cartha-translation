  text: וְ/כָל יִשְׂרָאֵ֗ל מַעֲלִים֙ אֶת אֲר֣וֹן בְּרִית יְהוָ֔ה בִּ/תְרוּעָה֙ וּ/בְ/ק֣וֹל שׁוֹפָ֔ר וּ/בַ/חֲצֹצְר֖וֹת וּ/בִ/מְצִלְתָּ֑יִם מַשְׁמִעִ֕ים בִּ/נְבָלִ֖ים וְ/כִנֹּרֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/028.yaml
  text: And all Israel was bringing up the ark of the covenant of Yahweh with shouting[a], with the sound of a horn, with trumpets, and with cymbals[b], making music with harps and lyres.
translation:
  language: tl
  text: At inaakyat ng buong Israel ang kaban ng tipan ni Yahweh, kasabay ng hiyawan[a], ng tunog ng tambuli[b], ng mga trumpeta, at ng mga pompiyang, habang tumutugtog ng mga alpa at mga lira.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sigaw”; maaaring tumukoy ang salitang Hebreo sa isang malakas na sigaw ng pagdiriwang o pagpupugay.
    reason: lexical_alternative
  - marker: b
    text: 'Hebreo: shofar, isang tambuli na karaniwang yari sa sungay; naiiba ito sa “mga trumpeta” na kasunod na binanggit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַעֲלִים
  choice: inaahon
  rationale: Ang Hiphil participle ay nagpapahayag ng nagpapatuloy na pag-aakyat sa kaban; likas sa Filipino ang aspektong imperpektibo ng “inaahon.”
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: ang kaban ng tipan ni Yahweh
  rationale: Pinananatili nito ang tuwirang ugnayan ng kaban, tipan, at personal na pangalan ng Diyos.
- source_word: תְרוּעָה
  choice: hiyawan
  rationale: Tumutukoy ito sa malakas na sama-samang sigaw o aklamasyon; ang “hiyawan” ay angkop sa masayang prusisyon nang hindi tahasang idinaragdag ang salitang “masaya.”
- source_word: קוֹל שׁוֹפָר
  choice: tunog ng tambuli
  rationale: Isinasalin ang קוֹל bilang “tunog” at ang שׁוֹפָר bilang “tambuli,” na malinaw na naiiba sa mga trumpetang kasunod.
- source_word: חֲצֹצְרוֹת
  choice: mga trumpeta
  rationale: Karaniwang katumbas para sa mga tuwid na trumpetang panseremonya; hindi idinagdag ang “pilak” sapagkat wala iyon sa talata.
- source_word: מְצִלְתַּיִם
  choice: mga pompiyang
  rationale: Likas at kilalang salitang Filipino para sa cymbals.
- source_word: מַשְׁמִיעִים
  choice: habang tinutugtog
  rationale: Sa konteksto ng mga instrumentong de-kuwerdas, natural nitong ipinahahayag ang pagpaparinig ng tunog nang hindi ikinakabit lamang sa mga pompiyang.
- source_word: נְבָלִים
  choice: mga alpa
  rationale: Nakaugaliang katumbas na nagpapanatili ng pagkakaiba nito sa כִנֹּרוֹת, bagaman tinatayang modernong katawagan lamang ang eksaktong uri ng sinaunang instrumento.
- source_word: כִנֹּרוֹת
  choice: mga lira
  rationale: Pinananatiling hiwalay sa נְבָלִים sa pamamagitan ng ibang katawagan sa instrumentong de-kuwerdas.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo, kaya pinanatili ang transliterasyong “Yahweh” sa halip na palitan ito ng isang titulo.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “inaahon” upang mapanatili ang nagpapatuloy na kilos, at ang “sa gitna ng” at “habang” upang maging natural ang mahabang talaan ng mga tunog at instrumento.
