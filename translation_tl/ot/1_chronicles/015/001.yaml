id: 1CH.15.1
reference: 1 Chronicles 15:1
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יַּֽעַשׂ ל֥/וֹ בָתִּ֖ים בְּ/עִ֣יר דָּוִ֑יד וַ/יָּ֤כֶן מָקוֹם֙ לַֽ/אֲר֣וֹן הָֽ/אֱלֹהִ֔ים וַ/יֶּט ל֖/וֹ אֹֽהֶל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/001.yaml
  text: And he made houses for himself in the city of David[a], and he prepared a place for the ark of God and pitched a tent for it.
translation:
  language: tl
  text: Nagtayo si David ng mga bahay para sa sarili niya sa Lungsod ni David. Naghanda rin siya ng isang lugar para sa Kaban ng Diyos at nagtayo ng tolda para rito.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “nagtayo siya ng tolda para sa sarili niya.” Maaaring tumukoy kay David o sa Kaban ang hulaping panghalip sa Hebreo, bagaman mas pinapaboran ng agarang konteksto ang Kaban.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַשׂ ... בָתִּים
  choice: Nagtayo ... ng mga bahay
  rationale: Bagaman malawak ang kahulugan ng עשה na ‘gumawa,’ ang ‘nagtayo’ ang natural na pandiwa sa Tagalog kapag mga bahay ang layon at malinaw nitong ipinapahayag ang gawaing pagtatayo nang hindi dinaragdagan ang diwa.
- source_word: לֹו
  choice: para sa sarili niya
  rationale: Ang unang hulaping panghalip ay tumutukoy kay David; ang tahasang ‘sarili niya’ ay natural sa Tagalog at pinananatili ang reflexive na diwa.
- source_word: בְּעִיר דָּוִיד
  choice: sa Lungsod ni David
  rationale: Ito ang tuwirang at karaniwang salin ng pangalang heograpiko.
- source_word: וַיָּכֶן מָקוֹם
  choice: Naghanda ... ng isang lugar
  rationale: Ang Hiphil ng כון ay nangangahulugang ‘ihanda’ o ‘gawing handa’; ang ‘isang lugar’ ay tapat sa di-tiyak na מָקוֹם.
- source_word: לַאֲרוֹן הָאֱלֹהִים
  choice: para sa Kaban ng Diyos
  rationale: Ang ‘Kaban ng Diyos’ ay malinaw at tradisyonal na tawag sa sagradong kaban nang hindi nagpapasok ng paliwanag na wala sa Hebreo.
- source_word: וַיֶּט ... אֹהֶל
  choice: nagtayo ng tolda
  rationale: Kapag tolda ang layon, ang נטה ay idyomatikong nangangahulugang magtayo o maglatag ng tolda; ‘nagtayo ng tolda’ ang natural na modernong Tagalog.
- source_word: לֹו (וַיֶּט לֹו אֹהֶל)
  choice: para rito
  rationale: Sa agarang konteksto, pinakamalamang na ang hulaping panghalip ay tumutukoy sa Kaban ng Diyos. Ang ‘rito’ ay likas na tumutukoy sa pinakamalapit na bagay sa pangungusap habang nananatiling panghalip ang anyo.
theological_decisions:
- issue: Tinutukoy ng hulaping panghalip sa וַיֶּט לֹו אֹהֶל
  choice: 'Ang Kaban ng Diyos: ‘nagtayo ng tolda para rito’'
  alternative: 'Si David: ‘nagtayo siya ng tolda para sa sarili niya’'
  rationale: Nakatuon ang agarang konteksto sa paghahanda para sa Kaban, kaya magkakaugnay ang paghahanda ng lugar at pagtatayo ng tolda para rito. Gayunman, maaaring tumukoy kay David ang panlalaking isahang hulapi, kaya pinanatili sa talababa ang tunay na kalabuan ng Hebreo.
translation_notes:
  register: Modernong Filipino Tagalog na payak ngunit marangal. Ginamit ang ‘si David’ sa unang sugnay sa halip na hubad na ‘siya’ upang maging malinaw ang talata kapag binasang mag-isa; walang idinagdag na titulong maharlika o detalyeng hindi nakasaad sa Hebreo. Inilagay ang panandang [a] sa mismong pariralang may kalabuan.
