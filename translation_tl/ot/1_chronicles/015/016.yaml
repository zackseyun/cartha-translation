revisions:
- from: Pagkatapos, sinabi ni David sa mga pinuno ng mga Levita na italaga ang kanilang mga kapatid[a] na mang-aawit, kasama ang mga instrumentong pangmusika—mga alpa, lira, at pompiyang—upang magpatunog nang malakas at magtaas ng tinig sa kagalakan.[b]
  to: Pagkatapos, sinabi ni David sa mga pinuno ng mga Levita na italaga ang kanilang mga kapatid[a] na mga mang-aawit, na may mga instrumentong pangmusika—mga alpa, lira, at pompiyang—upang magparinig ng malakas na tunog at magtaas ng tinig sa kagalakan.[b]
  rationale: Bahagyang inayos ang sintaks upang maging mas likas at malinaw ang Filipino, at itinama ang alternatibong salin sa talababa upang mas malapit ito sa pandiwang Hebreo na “itaas.” Hindi binago ang kahulugan, ang kalabuan ng “tinig/tunog,” o ang pagkakakilanlan ng mga instrumentong binanggit.
