base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/016.yaml
  text: Then David told the leaders of the Levites to appoint their brothers, the singers, with musical instruments—harps, lyres, and cymbals—sounding aloud, to raise songs of joy.
translation:
  language: tl
  text: Pagkatapos, sinabi ni David sa mga pinuno ng mga Levita na italaga ang kanilang mga kapatid[a] na mga mang-aawit, na may mga instrumentong pangmusika—mga alpa, lira, at pompiyang—upang magparinig ng malakas na tunog at magtaas ng tinig sa kagalakan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “kanilang mga kapatid” ay tumutukoy sa mga kapwa nila Levita.
    reason: cultural_note
  - marker: b
    text: Maaari ring isalin na “upang itaas ang tinig nang may kagalakan.” Sa literal, ang Hebreo ay “upang magtaas sa pamamagitan ng tinig o tunog para sa kagalakan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Pagkatapos, sinabi ni David
  rationale: Ang waw-consecutive ay nagpapatuloy sa salaysay. Likas na ipinahahayag ng “Pagkatapos” ang pagkakasunod-sunod, habang tapat ang “sinabi” sa pandiwa.
- source_word: לְשָׂרֵי הַלְוִיִּם
  choice: sa mga pinuno ng mga Levita
  rationale: Ang שָׂרִים ay tumutukoy sa mga pinuno o pangunahing tagapangasiwa; malinaw at likas sa modernong Filipino ang “mga pinuno.”
- source_word: לְהַעֲמִיד
  choice: na italaga
  rationale: Sa kontekstong pang-organisasyon, ang Hiphil ng עמד ay nagpapahiwatig ng paglalagay o pagtatalaga sa isang tungkulin, hindi lamang ng pisikal na pagpapatayo.
- source_word: אֶת אֲחֵיהֶם
  choice: ang kanilang mga kapatid
  rationale: Pinananatili nito ang literal na katawagang pampamilya sa Hebreo; nililinaw sa talababa na ang tinutukoy ay mga kapwa Levita.
- source_word: הַמְשֹׁרְרִים
  choice: na mang-aawit
  rationale: Ang participle mula sa שׁיר ay partikular na tumutukoy sa mga umaawit, bagaman tumutugtog din sila ng mga instrumento.
- source_word: בִּכְלֵי שִׁיר
  choice: kasama ang mga instrumentong pangmusika
  rationale: Likas itong salin ng pariralang tumutukoy sa mga instrumentong ginagamit sa musika.
- source_word: נְבָלִים
  choice: mga alpa
  rationale: Hindi ganap na tiyak ang eksaktong anyo ng sinaunang instrumento, ngunit ang “alpa” ang malinaw at nakikilalang katumbas.
- source_word: וְכִנֹּרוֹת
  choice: lira
  rationale: Karaniwang kinikilalang lira ang כִּנּוֹר; ibinubukod ito sa נֶבֶל upang mapanatili ang dalawang magkaibang instrumento.
- source_word: וּמְצִלְתָּיִם
  choice: pompiyang
  rationale: Ang salita ay tumutukoy sa cymbals; ang “pompiyang” ay karaniwan at madaling maunawaang katawagan sa Filipino.
- source_word: מַשְׁמִיעִים
  choice: upang magpatunog nang malakas
  rationale: Ang Hiphil participle ng שׁמע ay nangangahulugang magparinig o lumikha ng naririnig na tunog. Ipinahahayag ng salin ang hayag at malakas na pagtugtog nang hindi labis na tinutukoy ang paraan.
- source_word: לְהָרִים בְּקוֹל לְשִׂמְחָה
  choice: at magtaas ng tinig sa kagalakan
  rationale: Malapit ito sa literal na “magtaas sa pamamagitan ng tinig/tunog para sa kagalakan” at pinananatili ang maaaring pagtukoy sa tinig, tunog, o sama-samang musikang masaya.
