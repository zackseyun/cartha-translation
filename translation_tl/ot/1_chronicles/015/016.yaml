translation_notes:
  register: Modernong Filipino na malinaw at marangal. Pinanatili ang katawagang “mga kapatid” at ang bahagyang kalabuan ng huling pariralang Hebreo, habang ipinaliwanag ang mga ito sa mga talababa.
