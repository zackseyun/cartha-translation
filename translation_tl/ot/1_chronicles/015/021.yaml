base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/021.yaml
  text: and Mattithiah[a], Eliphelehu, Mikneiah, Obed-edom, Jeiel, and Azaziah were to lead with lyres according to the Sheminith.
translation:
  language: tl
  text: Sina Matitias, Elifelehu, Mikneias, Obed-edom, Jeiel, at Azazias ay mangunguna sa pagtugtog ng mga lira ayon sa Sheminith[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa ikawalo” o “sa mababang oktaba.” Ang Hebreong pariralang “ayon sa Sheminith” ay isang terminong pangmusika na hindi tiyak ang eksaktong kahulugan.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַתִּתְיָהוּ
  choice: Matitias
  rationale: Isinalin sa anyong pangalang pamilyar at madaling bigkasin sa modernong Filipino, habang tinutumbasan ang Hebreong pangalan.
- source_word: אֱלִיפְלֵהוּ
  choice: Elifelehu
  rationale: Transliterasyon ng buong Hebreong anyo, kasama ang hulaping -hu.
- source_word: מִקְנֵיָהוּ
  choice: Mikneias
  rationale: Anyong Filipino ng Hebreong pangalan, na pinananatili ang pagkakakilanlan nito bilang pangalang pantangi.
- source_word: עֹבֵד אֱדֹם
  choice: Obed-edom
  rationale: Pinanatili ang tambalang pangalan at gitling para sa malinaw na pagbasa.
- source_word: יעִיאֵל
  choice: Jeiel
  rationale: Transliterasyon na tumutugma sa karaniwang anyo ng pangalang ito sa Filipino.
- source_word: עֲזַזְיָהוּ
  choice: Azazias
  rationale: Anyong Filipino ng Hebreong pangalang pantangi.
- source_word: בְּכִנֹּרוֹת
  choice: tutugtog ng mga lira
  rationale: Ang כִּנּוֹר ay isang instrumentong de-kuwerdas na mas tiyak na tinutukoy bilang lira kaysa alpa; ginawang likas sa Filipino ang instrumental na gamit ng pang-ukol.
- source_word: עַל הַשְּׁמִינִית
  choice: ayon sa Sheminith
  rationale: Teknikal na terminong pangmusika na hindi tiyak ang eksaktong kahulugan; pinanatili ang transliterasyon upang huwag piliting lutasin ang kalabuan.
- source_word: לְנַצֵּחַ
  choice: upang manguna
  rationale: Sa kontekstong pangmusika, maaaring tumukoy sa pamumuno o pangangasiwa sa pagtatanghal; pinili ang maikli at likas na katumbas nang hindi labis na tinutukoy ang tungkulin.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang teknikal na terminong Sheminith at ipinaliwanag sa talababa ang mga posibleng kahulugan. Ang ayos ng pangungusap ay ginawang natural sa Filipino nang hindi inaalis ang tungkulin ng mga musikero na manguna.
