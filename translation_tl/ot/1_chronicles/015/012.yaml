  text: וַ/יֹּ֣אמֶר לָ/הֶ֔ם אַתֶּ֛ם רָאשֵׁ֥י הָ/אָב֖וֹת לַ/לְוִיִּ֑ם הִֽתְקַדְּשׁוּ֙ אַתֶּ֣ם וַ/אֲחֵי/כֶ֔ם וְ/הַֽעֲלִיתֶ֗ם אֵ֣ת אֲר֤וֹן יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל אֶל הֲכִינ֖וֹתִי לֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/012.yaml
  text: And he said to them[a], “You are the heads of the fathers’ houses of the Levites. Sanctify yourselves, you and your brothers, and bring up the ark of Yahweh, the God of Israel, to the place I have prepared for it.”
translation:
  language: tl
  text: Sinabi niya sa kanila, “Kayo ang mga pinuno ng mga angkan ng mga Levita. Magpakabanal kayo[a], kayo at ang inyong mga kapatid, at dalhin ninyo paakyat ang kaban ni Yahweh, ang Diyos ng Israel, sa lugar na inihanda ko para rito.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Italaga ninyo ang inyong sarili.” Ang pandiwang Hebreo ay tumutukoy sa ritwal na paghahanda o pagtatalaga bilang banal.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאשֵׁי הָאָבוֹת לַלְוִיִּם
  choice: mga pinuno ng mga angkan ng mga Levita
  rationale: Ang parirala ay tumutukoy sa mga pinuno ng mga yunit ng angkan o sambahayang nagmula sa mga ninuno. Mas natural sa modernong Tagalog ang “mga angkan” kaysa sa literal na “mga sambahayan ng mga ama,” habang pinananatili ang panlipunang diwa ng Hebreo.
- source_word: הִתְקַדְּשׁוּ
  choice: Magpakabanal kayo[a]
  rationale: Ang hitpael ng קדשׁ ay tumutukoy dito sa paghahanda o pagtatalaga ng sarili bilang banal para sa isang gawaing panrelihiyon. Pinananatili ng “magpakabanal” ang ugnay sa kabanalan, at nililinaw ng talababa ang ritwal na diwa.
- source_word: וַאֲחֵיכֶם
  choice: kayo at ang inyong mga kapatid
  rationale: Tuwirang pinananatili ang “mga kapatid”; sa konteksto, tumutukoy ito sa kanilang mga kapwa Levita o kamag-anak.
- source_word: וְהַעֲלִיתֶם
  choice: dalhin ninyo paakyat
  rationale: Ang causative na anyo ng עלה ay nangangahulugang magdala paakyat. Natural sa Tagalog ang pariralang ito at pinananatili ang direksiyonal na diwa.
- source_word: אֲרוֹן יְהוָה אֱלֹהֵי יִשְׂרָאֵל
  choice: ang kaban ni Yahweh, ang Diyos ng Israel
  rationale: Pinananatili ang buong appositional na paglalarawan at isinasalin ang banal na pangalan bilang “Yahweh.”
- source_word: אֶל הֲכִינוֹתִי לוֹ
  choice: sa lugar na inihanda ko para rito
  rationale: Bagaman walang hayag na salitang “lugar” sa Hebreo, ipinahihiwatig ito ng pang-ukol na אֶל at ng konteksto. Kailangan itong gawing tahas upang maging malinaw at natural sa Tagalog.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Tuwirang ginagamit sa talata ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalang tipan sa halip na palitan ito ng isang titulo.
- issue: Diwa ng הִתְקַדְּשׁוּ
  choice: Magpakabanal kayo
  alternative: Italaga ninyo ang inyong sarili; Ihanda ninyo ang inyong sarili bilang banal
  rationale: Ang utos ay may ritwal at panrelihiyong diwa, hindi lamang pangkalahatang moral na pagpapakabuti. Hindi nilulutas ng salin nang higit sa teksto kung anong tiyak na mga ritwal ang sangkot.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “angkan” upang likas na maipahayag ang sinaunang yunit ng pamilyang Levita, at “dalhin paakyat” upang mapanatili ang direksiyonal na diwa ng pandiwang Hebreo.
