base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/024.yaml
  text: And Shebaniah[a], Jehoshaphat, Nethanel, Amasai, Zechariah, Benaiah, and Eliezer the priests were blowing the trumpets before the ark of God[c][b], and Obed-edom and Jehiah were gatekeepers for the ark.
translation:
  language: tl
  text: Sina Sebanias, Josafat, Netanel, Amasai, Zacarias, Benaias, at Eliezer na mga pari ay humihip ng mga trumpeta[a] sa harap ng Kaban ng Diyos. Sina Obed-edom at Jehias naman ay mga bantay-pinto[b] para sa Kaban.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Hebreo ay karaniwang tumutukoy sa tuwid na mga trumpetang ginagamit ng mga pari sa pagsamba.
    reason: cultural_note
  - marker: b
    text: Maaari ring isaling “mga tagapagbantay sa pintuan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֹּהֲנִים
  choice: na mga pari
  rationale: Iniuugnay ng pariralang ito ang pitong naunang pangalan sa pangkat ng mga pari; natural sa Tagalog ang pang-ugnay na “na” pagkatapos ng talaan ng mga pangalan.
- source_word: מחצצרים
  choice: ay humihip
  rationale: Ang participle ay naglalarawan ng patuloy o kasabay na kilos sa prusisyon. Likas at malinaw sa Tagalog ang “humihip ng mga trumpeta.”
- source_word: בַּחֲצֹצְרוֹת
  choice: ng mga trumpeta
  rationale: Tuwirang tumutukoy sa mga trumpeta, lalo na sa tuwid na mga trumpetang ginagamit ng mga pari sa pagsamba. Hindi idinagdag ang “pilak” sapagkat hindi iyon tahasang binanggit sa talata.
- source_word: לִפְנֵי
  choice: sa harap ng
  rationale: 'Pinananatili nito ang karaniwang kahulugang panlunan: nasa unahan o harapan ng Kaban ang mga paring tumutugtog.'
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: Kaban ng Diyos
  rationale: Ito ang tuwiran at pamilyar na salin ng construct phrase; ginamit ang malaking titik sa “Kaban” bilang pantukoy sa sagradong Kaban.
- source_word: שֹׁעֲרִים
  choice: mga bantay-pinto
  rationale: Pinananatili ang institusyonal na tungkulin ng mga tagapag-ingat ng pasukan sa kontekstong sagrado, sa halip na gawing pangkalahatang “mga bantay.”
- source_word: לָאָרוֹן
  choice: para sa Kaban
  rationale: Ipinapahayag ng lamed ang tungkulin o pananagutang may kaugnayan sa Kaban nang hindi ipinapalagay ang eksaktong pisikal na puwesto.
- source_word: וְעֹבֵד אֱדֹם
  choice: Obed-edom
  rationale: Malapit na transliterasyon ng pangalang Hebreo at madaling makilala sa tradisyong biblikal sa Filipino.
- source_word: וִיחִיָּה
  choice: Jehias
  rationale: Transliterasyong angkop sa nakaugaliang anyo ng mga pangalang biblikal sa Filipino habang nananatiling malapit sa Hebreo.
theological_decisions: []
translation_notes:
  register: Gumamit ng makabago ngunit marangal at madaling maunawaang Filipino. Pinanatili ang serye ng mga pangalan at ang bahagyang di-tiyak na ugnayan ng mga bantay-pinto sa Kaban; hindi ito pinalawak bilang mga guwardiya o binigyan ng hindi binanggit na lokasyon.
