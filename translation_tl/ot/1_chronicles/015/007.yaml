lexical_decisions:
- source_word: לִ/בְנֵי
  choice: Sa mga anak ni
  rationale: Ang לְ ay nagpapakilala sa susunod na pangkat sa talaan. Pinananatili ng “Sa mga anak ni” ang anyong pangangkan ng בְּנֵי at natural itong pambungad sa Filipino.
- source_word: גֵּרְשׁוֹם
  choice: Gersom
  rationale: Tuwirang transliterasyon sa modernong Filipino ng anyong Hebreo na Gershom; hindi ito ginawang Gerson sapagkat may m ang tekstong Hebreo sa talatang ito.
- source_word: יוֹאֵל
  choice: Joel
  rationale: Karaniwan at nakikilalang anyong Filipino ng pangalang Hebreo.
- source_word: הַ/שָּׂר
  choice: na pinuno
  rationale: Sa konteksto ng talaan ng mga pangkat na Levitico, ang שַׂר ay tumutukoy sa namumuno sa pangkat, hindi kinakailangang sa isang prinsipe o maharlika.
- source_word: וְ/אֶחָי/ו
  choice: at 130 sa kaniyang mga kapatid
  rationale: Pinananatili ang batayang kahulugan ng אחים bilang “mga kapatid,” ngunit ang “sa kaniyang” ay nagpapalinaw na 130 ang kabilang sa mas malawak na pangkat ng kaniyang mga kamag-anak na lalaki, hindi 130 bukod pa sa kanila.
- source_word: מֵאָה וּ/שְׁלֹשִׁים
  choice: '130'
  rationale: Tuwiran ang bilang sa Hebreo; ginamit ang mga tambilang para sa malinaw at madaling basahing talaan.
