  text: 'Sa mga anak ni Gersom: si Joel ang pinuno, kasama ang 130 niyang mga kapatid.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “mga kapatid” dito ay tumutukoy sa mga lalaking kabilang sa iisang angkan o pangkat na Levitico, hindi kinakailangang sa mga kapatid mismo ni Joel.
