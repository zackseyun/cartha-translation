  text: 'From Naphtali: 1,000 commanders[b][a], and with them 37,000 with shield and spear.'
translation:
  language: tl
  text: 'Mula sa Neftali: 1,000 pinuno[a], at kasama nila ang 37,000 na may kalasag[b] at sibat.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “mga kumander” o “mga kapitan.”
    reason: lexical_alternative
  - marker: b
    text: Ang salitang Hebreo para sa “kalasag” ay maaaring tumukoy nang mas tiyak sa isang malaking kalasag.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִנַּפְתָּלִי
  choice: Mula sa Neftali
  rationale: Ang parirala ay literal na “at mula sa Neftali.” Sa talaang ito, natural sa Tagalog na alisin ang panimulang “at” habang malinaw na pinananatili ang pinagmulan sa lipi ni Neftali.
- source_word: שָׂרִים
  choice: pinuno
  rationale: Tumutukoy ito sa mga nakatataas o mga lider, at sa kontekstong militar ay maaaring mangahulugang mga kumander. Pinananatili ng “pinuno” ang lawak ng salitang Hebreo nang hindi nagtatakda ng tiyak na ranggo.
- source_word: אָלֶף
  choice: 1,000
  rationale: Ginamit ang bilang na numerikal para madaling basahin sa isang talaan ng mga hukbo.
- source_word: וְעִמָּהֶם
  choice: at kasama nila
  rationale: Pinananatili nito ang pang-ugnay at malinaw na iniuugnay ang mas malaking pangkat sa 1,000 pinuno.
- source_word: בְּצִנָּה
  choice: na may kalasag
  rationale: Ang צִנָּה ay kalasag at madalas tumutukoy sa isang malaking uri nito. Ang “kalasag” ay malinaw at natural, samantalang inilalahad sa talababa ang mas tiyak na posibilidad.
- source_word: וַחֲנִית
  choice: at sibat
  rationale: Ang חֲנִית ay karaniwang salitang Hebreo para sa sibat; ito ang malinaw at likas na katumbas sa Tagalog.
- source_word: שְׁלֹשִׁים וְשִׁבְעָה אָלֶף
  choice: 37,000
  rationale: Ginamit ang numerikal na anyo para sa linaw at pagkakapare-pareho sa talaan.
