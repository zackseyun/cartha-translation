translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Maikli ang ayos upang mapanatili ang anyo ng talaang militar. Ang “pinuno” ay mas natural at hindi gaanong tiyak kaysa “kumander,” kaya napapanatili ang saklaw ng Hebreo; nasa talababa ang mga alternatibo.
