lexical_decisions:
- source_word: יִרְמְיָהוּ
  choice: Jeremias
  rationale: Ginamit ang nakaugaliang anyo ng pangalang biblikal sa Tagalog.
- source_word: הָעֲשִׂירִי
  choice: ang ikasampu
  rationale: May tiyak na pantukoy ang ordinal sa Hebreo at tumutukoy sa puwesto ni Jeremias sa talaan.
- source_word: מַכְבַּנַּי
  choice: Macbanai
  rationale: Tuwirang transliterasyon sa paraang natural basahin sa Tagalog, habang pinananatili ang mga pangunahing katinig ng pangalang Hebreo.
- source_word: עַשְׁתֵּי עָשָׂר
  choice: ang ikalabing-isa
  rationale: Bagaman kardinal na “labing-isa” ang literal na anyo sa Hebreo, ginagamit ito nang eliptiko at kaagapay ng naunang ordinal sa talaan; kaya ordinal ang likas na salin sa Tagalog.
