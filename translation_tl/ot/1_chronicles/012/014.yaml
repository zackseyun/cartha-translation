  text: Si Jeremias ang ikasampu, at si Macbanai ang ikalabing-isa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “labing-isa”; sa konteksto ng talaang ito, ang ibig sabihin ay “ikalabing-isa.”
