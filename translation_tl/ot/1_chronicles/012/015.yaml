base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/015.yaml
  text: These were from the sons of Gad[a], heads of the army; the least was for a hundred, and the greatest for a thousand.
translation:
  language: tl
  text: Ang mga ito ay mula sa mga anak ni Gad, mga pinuno ng hukbo. Ang pinakamababa ay katumbas ng isang daan, at ang pinakadakila ay katumbas ng isang libo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “ang isa ay para sa isang daan, at ang dakila ay para sa isang libo.” Eliptiko ang pahayag sa Hebreo; ipinahihiwatig nito ang proporsiyon o bisa ng mga taong ito sa kontekstong militar.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה מִבְּנֵי גָד
  choice: Ang mga ito ay mula sa mga anak ni Gad
  rationale: Pinananatili ang pantribo at pampamilyang pananalitang “mga anak ni Gad,” sa halip na gawing “mga Gadita,” at natural na dinaragdagan ng pang-angkop na pandiwa sa Filipino ang sugnay na walang hayag na pandiwa sa Hebreo.
- source_word: רָאשֵׁי הַצָּבָא
  choice: mga pinuno ng hukbo
  rationale: Ang רָאשֵׁי ay literal na “mga ulo” ngunit sa kontekstong militar ay tumutukoy sa mga pinuno; ito ang malinaw at dignified na modernong Filipino.
- source_word: הַקָּטָן
  choice: ang pinakamababa sa kanila
  rationale: Ipinahihiwatig ng paghahambing sa הַגָּדוֹל ang pinakamababa sa antas, lakas, o kahalagahan sa pangkat, hindi kinakailangang pinakamaliit ang katawan.
- source_word: אֶחָד לְמֵאָה ... וְהַגָּדוֹל לְאָלֶף
  choice: katumbas ng isang daan, at ang pinakadakila ay katumbas ng isang libo
  rationale: Ginagawang nauunawaan sa Filipino ang eliptikong proporsiyon ng Hebreo nang hindi tahasang nagpapasiya kung ito ay kakayahang lumaban o saklaw ng pamumuno. Inilalahad sa talababa ang mas literal na anyo at ang tunay na interpretatibong posibilidad.
theological_decisions:
- issue: Kahulugan ng pormulang “isa para sa isang daan ... para sa isang libo”
  choice: Panatilihin sa pangunahing teksto ang pangkalahatang diwang “katumbas,” na may talababa tungkol sa elipsis.
  alternative: Isalin bilang “kayang lumaban sa isang daan/isang libo” o “namumuno sa isang daan/isang libo.”
  rationale: Hindi tahasang sinasabi ng Hebreo kung ang bilang ay tumutukoy sa pambihirang husay sa pakikipaglaban o sa bilang ng mga tauhang napamumunuan. Ang salin ay hindi dapat tahimik na magpasya sa pagitan ng mga ito.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “hukbo” at “mga pinuno” bilang karaniwang salitang militar. Ang “pinakadakila” ay nagpapanatili sa tuwirang pagsalungat ng “pinakamababa” at “pinakadakila,” habang ang talababa ang nag-iingat sa kalabuan ng eliptikong Hebreo.
