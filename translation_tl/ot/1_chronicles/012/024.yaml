base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/024.yaml
  text: And these are the numbers of the heads of the armed troops for war[a], who came to David at Hebron to turn Saul’s kingdom over to him, according to the word of Yahweh.
translation:
  language: tl
  text: Ito ang mga bilang ng mga pinuno ng mga armadong mandirigma para sa labanan na pumunta kay David sa Hebron upang ilipat sa kanya ang paghahari ni Saul, ayon sa sinabi ni Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “ayon sa bibig ni Yahweh,” isang idyomang nangangahulugang “ayon sa sinabi ni Yahweh” o “gaya ng sinabi ni Yahweh.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִסְפְּרֵי
  choice: mga bilang
  rationale: Pinananatili ang anyong maramihan na nagpapakilala sa sunod-sunod na talaan ng bilang ayon sa bawat pangkat.
- source_word: רָאשֵׁי
  choice: mga pinuno
  rationale: Karaniwang kahulugan nito ang mga ulo o pinuno. Ang “mga pinuno” ay malinaw at marangal sa modernong Tagalog, habang pinananatili ang ugnayang militar-administratibo ng parirala.
- source_word: הֶחָלוּץ לַצָּבָא
  choice: hukbong nasasandatahan para sa digmaan
  rationale: Tumutukoy ang הֶחָלוּץ sa kolektibong pangkat na nasangkapan o handa para sa pakikipagdigma, at nililinaw ng לַצָּבָא ang layuning militar.
- source_word: בָּאוּ עַל דָּוִיד
  choice: pumunta kay David
  rationale: Sa kontekstong ito, ang עַל kasunod ng בוא ay nagpapahiwatig ng paglapit at pakikiisa kay David, hindi ng pagsalakay laban sa kanya.
- source_word: חֶבְרוֹנָה
  choice: sa Hebron
  rationale: May panandang patungo sa Hebron ang anyong Hebreo, ngunit likas sa Tagalog ang “pumunta kay David sa Hebron,” na ipinakikitang naroon si David nang lapitan siya.
- source_word: לְהָסֵב
  choice: upang ilipat
  rationale: Ang causative na anyo ay nagsasaad ng pagpapalipat o pagpapasa ng kapangyarihan; malinaw at hindi labis na teknikal ang “ilipat.”
- source_word: מַלְכוּת שָׁאוּל
  choice: ang paghahari ni Saul
  rationale: Maaaring tumukoy ang מַלְכוּת sa kaharian o sa mismong paghaharing maharlika. Mas angkop dito ang “paghahari” sapagkat ang inililipat kay David ay ang pamamahala bilang hari.
- source_word: כְּפִי יְהוָה
  choice: ayon sa sinabi ni Yahweh
  rationale: Literal itong “ayon sa bibig ni Yahweh,” isang idyoma para sa ipinahayag o sinabi niya. Natural sa Tagalog ang “ayon sa sinabi” habang pinananatili ang diwang may banal na kapahayagan.
theological_decisions:
- issue: Paglilipat ng מַלְכוּת שָׁאוּל
  choice: ang paghahari ni Saul
  alternative: ang kaharian ni Saul
  rationale: Hindi tinutukoy ng salin kung ang lupain, institusyon, o katungkulan lamang ang inilipat; gayunman, higit na nahuhuli ng “paghahari” ang pagpapasa ng kapangyarihang maharlika kay David sa konteksto.
- issue: Pagpapangalan sa יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Ginagamit ang personal na pangalan ng Diyos na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
translation_notes:
  register: Makabago at marangal na Filipino; pinanatili ang pormal na himig ng talaang militar. Ginamit ang “nasasandatahan” sa halip na mas kolokyal na “armado,” at “paghahari” upang maging malinaw ang paglilipat ng kapangyarihang maharlika.
