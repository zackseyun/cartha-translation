  yaml_path: translation/ot/1_chronicles/012/006.yaml
  text: Eluzai[a], Jerimoth, Bealiah, Shemariahu, and Shephatiah the Haruphite.
translation:
  language: tl
  text: Sina Eluzai, Jerimot, Bealia, Semariahu, at Sefatias na Harifita.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Harufita.” Maaaring tumukoy ang anyong Hebreo sa pangalan ng angkan na lumilitaw din sa ibang bahagi sa anyong Harif.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶלְעוּזַי
  choice: Eluzai
  rationale: Pangalan ng tao; tinumbasan sa paraang transliterasyon at pinanatiling malapit sa anyong Hebreo.
- source_word: וִירִימוֹת
  choice: Jerimot
  rationale: Pangalan ng tao na may nakakabit na pangatnig sa Hebreo; ang pangatnig ay ipinahayag sa likas na ayos ng talaan sa Tagalog.
- source_word: וּבְעַלְיָה
  choice: Bealia
  rationale: Pangalan ng tao; ginamit ang malinaw at madaling basahing transliterasyon sa Tagalog.
- source_word: וּשְׁמַרְיָהוּ
  choice: Semariahu
  rationale: Pangalan ng tao; pinanatili ang buong hulaping -yahu bilang pagsunod sa tahasang anyo ng tekstong Hebreo.
- source_word: וּשְׁפַטְיָהוּ
  choice: Sefatias
  rationale: Pangalan ng tao; ginamit ang anyong madaling bigkasin sa Tagalog habang kinakatawan ang pangalang Hebreo.
- source_word: הַחֲרִיפִי
  choice: na Harufita
  rationale: May tiyak na pantukoy ang katawagang gentiliko at tumutukoy sa kaugnayan sa angkan o pamilya; ginamit ang hulaping -ita na likas sa mga ganitong katawagan sa Tagalog.
