translation_notes:
  register: Makabago, marangal, at madaling basahing Filipino. Ginamit ang “Sina” para sa likas na pagpapakilala ng talaan ng mga tao. Ang mga pangatnig na inuulit sa Hebreo ay isinaayos bilang karaniwang listahan sa Tagalog. Pinanatili sa talababa ang tunay na pag-aalinlangan sa anyong Harufita/Harifita.
