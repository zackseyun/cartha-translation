base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/033.yaml
  text: 'From the sons of Issachar[a], men who understood the times, to know what Israel should do: their chiefs were two hundred[b], and all their brothers were under their command.'
translation:
  language: tl
  text: Mula sa mga anak ni Isacar ay mga lalaking may pag-unawa sa mga panahon, upang malaman kung ano ang dapat gawin ng Israel. Dalawang daan ang kanilang mga pinuno, at ang lahat ng kanilang mga kapatid ay nasa ilalim ng kanilang utos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “ayon sa kanilang bibig,” isang Hebreong idyoma na nangangahulugang sumusunod sila sa kanilang tagubilin o pamumuno.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִבְּנֵי יִשָּׂשכָר
  choice: Mula sa mga anak ni Isacar
  rationale: Ang מִן kasama ng בְּנֵי ay tumutukoy sa pinagmulan sa loob ng talaan ng mga pangkat mula sa bawat lipi. Pinananatili ng “mga anak ni Isacar” ang karaniwang Hebreong katawagan sa lipi.
- source_word: יוֹדְעֵי בִינָה לָעִתִּים
  choice: mga lalaking nakauunawa sa mga panahon
  rationale: Ipinahihiwatig ng participial na parirala ang mga taong may pagkaunawa o matalinong pagkilala sa kahulugan ng kasalukuyang panahon. Likas sa modernong Tagalog ang “nakauunawa,” habang pinananatili ng “mga panahon” ang lawak ng עִתִּים.
- source_word: לָדַעַת מַה־יַּעֲשֶׂה יִשְׂרָאֵל
  choice: kaya alam nila kung ano ang dapat gawin ng Israel
  rationale: Ang infinitive na לָדַעַת ay nagpapakita ng bunga o layunin ng kanilang pagkaunawa. Sa konteksto, ang imperfect na יַעֲשֶׂה ay tumutukoy sa angkop na hakbang, kaya “dapat gawin” sa halip na hulang “gagawin.”
- source_word: רָאשֵׁיהֶם מָאתַיִם
  choice: Dalawang daan ang kanilang mga pinuno
  rationale: Ang רָאשִׁים ay mga ulo sa diwang mga pinuno. Ang ayos na ito ay natural sa Tagalog at malinaw na ang bilang ng mga pinuno ay dalawang daan.
- source_word: וְכָל־אֲחֵיהֶם
  choice: at ang lahat ng kanilang mga kapatid
  rationale: Literal na “mga kapatid” ang אֲחִים, ngunit maaari itong tumukoy sa mga kapwa kasapi ng lipi. Pinananatili sa teksto ang konkretong larawan ng Hebreo.
- source_word: עַל־פִּיהֶם
  choice: ay nasa ilalim ng kanilang utos
  rationale: Literal itong “ayon sa kanilang bibig,” isang idyoma para sa pagpapasakop sa pasiya, tagubilin, o awtoridad ng isang tao. Malinaw at angkop sa konteksto ng mga pinuno ang “nasa ilalim ng kanilang utos.”
