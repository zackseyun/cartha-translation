  text: and Ishmaiah the Gibeonite[b][a], a mighty man among the Thirty and over the Thirty.
translation:
  language: tl
  text: at si Ismaya, ang Gibeonita, isang magiting na mandirigma na kabilang sa Tatlumpu[a] at namumuno sa Tatlumpu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ng Tatlumpu”; ang pang-ukol sa Hebreo ay maaari ring magpahiwatig ng pagiging kabilang sa natatanging pangkat na tinatawag na Tatlumpu.
    reason: lexical_alternative
  - marker: b
    text: Ang “namumuno sa Tatlumpu” ay malamang na tumutukoy sa tungkulin ng pamumuno o sa mas mataas na ranggo kaugnay ng Tatlumpu.
    reason: cultural_note
lexical_decisions:
- source_word: וְ/יִֽשְׁמַֽעְיָ֧ה
  choice: at si Ismaya
  rationale: Isinasalin ang pang-ugnay na וְ bilang “at” upang ipagpatuloy ang talaan, at inililipat sa baybay-Filipino ang pangalang Hebreo na יִשְׁמַעְיָה bilang “Ismaya.”
- source_word: הַ/גִּבְעוֹנִי
  choice: na Gibeonita
  rationale: Tinutukoy ng anyong gentiliko ang pinagmulan o kaugnayan ni Ismaya sa Gibeon; natural at malinaw sa Filipino ang “Gibeonita.”
- source_word: גִּבּוֹר
  choice: isang magiting na mandirigma
  rationale: Sa kontekstong militar, ang גִּבּוֹר ay tumutukoy sa isang malakas, matapang, o kilalang mandirigma. Pinagsasama ng salin ang kagitingan at tungkuling militar nang hindi nagpapasok ng dagdag na titulong wala sa teksto.
- source_word: בַּ/שְּׁלֹשִׁים
  choice: sa Tatlumpu
  rationale: Pinananatili ng “sa” ang maigsi at bahagyang malabong ugnayang ipinahihiwatig ng pang-ukol na בְּ, habang ang malaking titik ay nagpapakitang pangalan ito ng natatanging pangkat.
- source_word: וְ/עַל הַ/שְּׁלֹשִׁים
  choice: at namumuno sa Tatlumpu
  rationale: Sa kontekstong ito, ipinahihiwatig ng עַל ang pamumuno o awtoridad kaugnay ng pangkat. Mas natural sa modernong Filipino ang “namumuno sa” kaysa sa literal ngunit malabong “nasa ibabaw ng.”
