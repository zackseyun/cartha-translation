translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “magiting na mandirigma” para sa malinaw na kontekstong militar, at pinanatiling maikli ang ayos upang umangkop sa anyo ng talaan.
