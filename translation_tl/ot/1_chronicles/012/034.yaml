  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: מִ/זְּבֻל֞וּן יוֹצְאֵ֣י צָבָ֗א עֹרְכֵ֧י מִלְחָמָ֛ה בְּ/כָל כְּלֵ֥י מִלְחָמָ֖ה חֲמִשִּׁ֣ים אָ֑לֶף וְ/לַ/עֲדֹ֖ר בְּ/לֹא לֵ֥ב וָ/לֵֽב־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/034.yaml
  text: From Zebulun[a], fifty thousand men fit for military service, prepared for battle with every kind of weapon of war[b], to help without a divided heart.
translation:
  language: tl
  text: Mula sa Zebulun, limampung libong lalaking maaaring maglingkod sa hukbo, na nakahanay para sa labanan at taglay ang lahat ng kagamitang pandigma, upang tumulong[a] nang walang hati ang katapatan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “upang sumama sa hanay” o “upang sumuporta.” Hindi pangkaraniwan ang pandiwang Hebreo rito.
    reason: alternative_reading
  - marker: b
    text: Sa literal, “nang walang puso at puso,” isang idyomang Hebreo na nangangahulugang walang hati o dobleng katapatan.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְּבֻלוּן
  choice: Mula sa Zebulun
  rationale: Ang pang-ukol na מִן ay nagsasaad ng pinagmulan; likas sa modernong Tagalog ang “Mula sa Zebulun.”
- source_word: יוֹצְאֵי צָבָא
  choice: mga lalaking maaaring maglingkod sa hukbo
  rationale: Idyoma ito para sa mga lalaking karapat-dapat o handang tumupad ng tungkuling militar, hindi lamang sa mga literal na lumalabas kasama ng hukbo.
- source_word: עֹרְכֵי מִלְחָמָה
  choice: mga nakahanay sa pakikipagdigma
  rationale: Pinananatili nito ang larawan ng pag-aayos o paghanay para sa labanan, sa halip na gawing pangkalahatan lamang na “handa.”
- source_word: בְּכָל כְּלֵי מִלְחָמָה
  choice: na taglay ang lahat ng uri ng sandata
  rationale: Ang כְּלֵי מִלְחָמָה ay kagamitang pandigma o mga sandata; malinaw at natural ang pariralang ito sa Tagalog.
- source_word: חֲמִשִּׁים אָלֶף
  choice: 50,000
  rationale: Tuwirang paglalahad ng bilang sa paraang madaling basahin.
- source_word: וְלַעֲדֹר
  choice: upang tumulong
  rationale: Hindi pangkaraniwan at di-ganap na tiyak ang pandiwa sa kontekstong ito. Ipinahahayag ng “tumulong” ang pangunahing diwa nang hindi ipinipilit ang mas teknikal na kahulugang gaya ng pag-anib sa hanay.
- source_word: בְּלֹא לֵב וָלֵב
  choice: nang buong katapatan
  rationale: Ang literal na “walang puso at puso” ay idyomang tumutukoy sa hindi hati o dobleng katapatan. Natural sa Tagalog ang positibong paglalahad na “buong katapatan,” habang inilalagay sa talababa ang literal na larawan.
theological_decisions:
- issue: Ang pinag-uukulan ng tulong at katapatan
  choice: Hindi tahasang idinagdag ang pangalang David sa talata.
  alternative: “upang tulungan si David nang buong katapatan”
  rationale: Maliwanag si David sa mas malawak na konteksto, ngunit hindi siya tahasang binabanggit sa Hebreo ng talatang ito. Ang hindi pagdaragdag sa pangalan ay nagpapanatili sa anyo at bahagyang implicit na katangian ng pinagmulan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang militar na larawan ng paghanay, ngunit iniwasan ang lipas o labis na teknikal na bokabularyo. Ang “buong katapatan” ay natural na salin ng idyoma, at ang literal na anyo at ambiguwidad ng bihirang pandiwa ay pinangalagaan sa mga talababa.
