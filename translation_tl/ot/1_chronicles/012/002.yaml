base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/002.yaml
  text: They were archers[a], able to use both the right hand and the left in hurling stones and shooting arrows with the bow; they were from Saul’s brothers, from Benjamin.
translation:
  language: tl
  text: Sila ay mga mamamana, na bihasang gumamit ng kanang kamay at kaliwang kamay sa paghagis ng mga bato at pagpapakawala ng mga palaso gamit ang pana. Sila ay mula sa mga kapatid[a] ni Saul, mula sa Benjamin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga kaanak” o “mga kalahi.” Ang salitang Hebreo para sa “mga kapatid” ay maaari ring tumukoy sa mga kabilang sa mas malawak na angkan o lipi.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹשְׁקֵי קֶשֶׁת
  choice: May sandata silang mga pana
  rationale: Malapit ito sa literal na diwang ‘mga may dalang sandatang pana’ at hindi nililimitahan ang kasunod na paglalarawan sa pagpapana lamang.
- source_word: מַיְמִינִים וּמַשְׂמִאלִים
  choice: bihasa silang gumamit ng kanan o kaliwang kamay
  rationale: Ipinahahayag nito ang kakayahang gumamit ng alinmang kamay, hindi lamang ang likas na pagiging kananero o kaliwete.
- source_word: בָּאֲבָנִים
  choice: sa paghagis ng mga bato
  rationale: Nililinaw ang ipinahihiwatig na kilos sa kontekstong pandigma ngunit hindi nagdaragdag ng tirador, na hindi tahasang binanggit sa Hebreo.
- source_word: וּבַחִצִּים בַּקָּשֶׁת
  choice: at pagpapana
  rationale: Natural at maikli sa Tagalog; malinaw na tumutukoy sa pagpapatama ng mga palaso gamit ang pana.
- source_word: מֵאֲחֵי שָׁאוּל
  choice: sa mga kapatid[a] ni Saul
  rationale: Pinananatili ang tuwirang kahulugan ng אחים habang inilalagay sa talababa ang posibleng mas malawak na kahulugang mga kaanak o kalahi.
- source_word: מִבִּנְיָמִן
  choice: mula sa Benjamin
  rationale: Pinananatili ang anyong pinagmulan o kaugnayang pantribo ng pariralang Hebreo.
