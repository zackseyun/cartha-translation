base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/009.yaml
  text: Some of the Gadites separated themselves to David at the stronghold in the wilderness[a], mighty warriors, men of the army for battle, able to handle shield and spear, whose faces were like the faces of lions[c][b], and who were as swift as gazelles on the mountains.
translation:
  language: tl
  text: May ilan sa mga Gadita na humiwalay at pumunta kay David sa moog sa ilang.[a] Sila ay magigiting na mandirigma, mga kawal na handa sa labanan, at sanay gumamit ng kalasag at sibat.[b] Ang kanilang mga mukha ay parang mga mukha ng leon, at mabilis silang kumilos na gaya ng mga gasela sa mga bundok.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “patungo sa moog sa ilang.” Maaaring unawain ang pagkakasunod ng mga pang-ukol sa Hebreo bilang pagkilos patungo sa moog o bilang pagdating doon.
    reason: alternative_reading
  - marker: b
    text: Sa literal, “nag-aayos ng kalasag at sibat.” Ang pananalita ay tumutukoy sa mga lalaking handa at bihasa sa pakikipaglaban.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “gaya ng mga gasela sa mga bundok, mabilis kumilos.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִן הַגָּדִי
  choice: May ilan sa mga Gadita
  rationale: Ang מִן kasama ng katawagang pangkatutubo ay nagpapahiwatig na isang bahagi lamang ng lipi ni Gad ang tinutukoy. Likas sa modernong Tagalog ang “may ilan sa mga Gadita.”
- source_word: נִבְדְּלוּ אֶל דָּוִיד
  choice: humiwalay at pumunta kay David
  rationale: Pinananatili ng “humiwalay” ang diwa ng Niphal ng בדל. Isinalin nang tuwiran ang אֶל bilang pagkilos patungo kay David, nang hindi tahasang ipinapasok ang motibong “pumanig.”
- source_word: לַמְצַד מִדְבָּרָה
  choice: sa moog sa ilang
  rationale: Ang מְצַד ay isang moog o tanggulang matibay, at ang מִדְבָּרָה ay tumutukoy sa ilang. Ang “sa” ay natural para sa pagdating sa isang pook, habang inilalahad sa talababa ang posibleng direksiyonal na pagbasa.
- source_word: גִּבֹּרֵי הַחַיִל
  choice: magigiting na mandirigma
  rationale: Ipinahahayag nito ang lakas, tapang, at kakayahang militar sa natural at marangal na Tagalog.
- source_word: אַנְשֵׁי צָבָא לַמִּלְחָמָה
  choice: mga kawal na handa sa labanan
  rationale: Ang parirala ay naglalarawan sa kanila bilang mga taong panghukbo na nakahanda para sa digmaan; malinaw at hindi mabigat ang ganitong salin.
- source_word: עֹרְכֵי צִנָּה וָרֹמַח
  choice: sanay gumamit ng kalasag at sibat
  rationale: Sa kontekstong militar, ang participle ng ערך ay nagpapahiwatig ng paghahanda o mahusay na paghawak ng mga sandata. Inilalahad sa talababa ang mas literal na anyo.
- source_word: וּפְנֵי אַרְיֵה פְּנֵיהֶם
  choice: Ang kanilang mga mukha ay parang mga mukha ng leon
  rationale: Pinananatili ang tahasang paghahambing at ang pag-uulit ng “mukha” sa Hebreo, nang hindi ipinapaliwanag kung bangis, tapang, o anyo ang partikular na diin.
- source_word: וְכִצְבָאִים עַל הֶהָרִים לְמַהֵר
  choice: mabilis silang kumilos na gaya ng mga gasela sa mga bundok
  rationale: Ang צְבָאִים ay mga gasela, at nililinaw ng לְמַהֵר na bilis o liksi ang punto ng paghahambing. Ang “mabilis silang kumilos” ay natural na Tagalog at hindi nililimitahan ang kilos sa pagtakbo lamang.
