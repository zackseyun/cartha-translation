translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “moog,” “ilang,” “kalasag,” at “sibat” bilang pamilyar na bokabularyong biblikal na nananatiling malinaw sa kasalukuyang mambabasa. Pinanatili ang mga larawang leon at gasela at hindi nilutas nang labis ang kanilang ipinahihiwatig.
