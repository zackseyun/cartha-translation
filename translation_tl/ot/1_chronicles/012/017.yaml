  source_fidelity: 'Tumpak ang pangunahing diwa ng draft: partitibo ang מִן, at ang מְצָד ay tumutukoy sa isang tanggulan. Gayunman, ang “sa Juda” ay hindi parallel sa “mga anak ni Benjamin,” at ang paghihiwalay na “sa tanggulan, kay David” ay hindi likas at malabo sa Filipino. Ang binagong ayos ay malinaw na naghahatid na ang mga tao ay lumapit kay David, na nasa tanggulan, nang hindi ipinagpapalagay na pag-aari ni David ang tanggulan.'
  naturalness: Mas natural at malinaw sa makabagong marangal na Filipino ang “mga anak ni Benjamin at Juda” at “dumating kay David sa tanggulan.” Iniiwasan nito ang di-parallel na “mga anak ni Benjamin at sa Juda” at ang putol-putol na paglalagay ng “kay David” pagkatapos ng kuwit.
  terminology: Ang “tanggulan” ay angkop para sa מְצָד. Pinanatili ang “mga anak ni Benjamin at Juda” upang igalang ang pormal at elliptical na pananalita ng Hebreo. Ang pangalang “Juda” ay ang karaniwang anyong Filipino.
