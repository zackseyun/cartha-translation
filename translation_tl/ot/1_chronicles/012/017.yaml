  text: And some of the sons of Benjamin and Judah came to the stronghold[b][a], to David.
translation:
  language: tl
  text: May ilang mula sa mga anak ni Benjamin at Juda ang dumating kay David sa tanggulan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kuta.” Ang salitang Hebreo ay tumutukoy sa isang pinatibay na kanlungan o lugar na maipagtatanggol.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: dumating
  rationale: Ang wayyiqtol ng בוא ay nagsusulong ng salaysay at nagsasaad ng paglapit sa kinaroroonan ni David; natural dito ang “dumating.”
- source_word: מִן
  choice: may ilan mula sa
  rationale: 'Partitibo ang gamit: mga miyembro lamang mula sa mga pangkat na ito, hindi ang lahat. Nililinaw ito ng “may ilan mula sa.”'
- source_word: בְּנֵי בִנְיָמִן
  choice: mga anak ni Benjamin
  rationale: Pinananatili ang pormal na pananalitang pangkamag-anakan ng Hebreo, na malinaw at marangal din sa Filipino.
- source_word: וִיהוּדָה
  choice: at sa Juda
  rationale: 'Elliptical ang Hebreo: iniuugnay ang Juda sa “mga anak ni Benjamin” nang hindi inuulit ang “mga anak.” Ang “at sa Juda” ay nagpapanatili sa ikli nito habang malinaw na tumutukoy sa mga taong mula sa Juda.'
- source_word: עַד
  choice: sa
  rationale: Sa konteksto ng pagkilos, tinutukoy nito ang destinasyon; likas sa Filipino ang “dumating sa tanggulan.”
- source_word: הַמְצָד
  choice: tanggulan
  rationale: Ang מְצָד ay isang pinatibay na kanlungan o lugar na maipagtatanggol; ang “tanggulan” ay maikli at angkop sa konteksto ni David.
- source_word: לְדָוִיד
  choice: kay David
  rationale: Iniuugnay ng parirala ang destinasyon kay David bilang taong nilapitan. Pinananatili ng kuwit ang posibleng ugnayan nito sa pandiwang “dumating,” sa halip na ipakahulugang pag-aari ni David ang tanggulan.
theological_decisions: []
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginawang hayag ang partitibong diwa ng מִן sa “may ilan mula sa,” habang pinanatili ang pormal na “mga anak ni Benjamin” at ang elliptical na pagtukoy sa Juda. Iniwasang palawakin ang לְדָוִיד bilang “kung saan naroon si David” upang huwag alisin ang sintaktikong pagiging maigsi ng Hebreo.
