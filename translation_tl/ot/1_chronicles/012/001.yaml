  terminology: Ang “Ziklag,” “David,” “Saul na anak ni Kish,” at “magigiting na mandirigma” ay angkop. Ang “mga bayani” sa talababa ay katanggap-tanggap bilang leksikal na alternatibo para sa גִּבּוֹרִים.
