translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “napipigilan” upang mapanatili ang lawak ng kahulugan ng Hebreong עָצוּר, at “magigiting na mandirigma” upang maging malinaw ang militar na diwa ng גִּבּוֹרִים.
