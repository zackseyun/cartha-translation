  text: וְ/אֵ֗לֶּה הַ/בָּאִ֤ים אֶל דָּוִיד֙ לְ/צִ֣יקְלַ֔ג ע֣וֹד עָצ֔וּר מִ/פְּנֵ֖י שָׁא֣וּל בֶּן קִ֑ישׁ וְ/הֵ֨מָּה֙ בַּ/גִּבּוֹרִ֔ים עֹזְרֵ֖י הַ/מִּלְחָמָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/001.yaml
  text: These are the men who came to David at Ziklag while he was still kept back because of Saul son of Kish[a]; and they were among the mighty warriors[b], helpers in war.
translation:
  language: tl
  text: Ito ang mga lalaki na pumunta kay David sa Ziklag habang hindi pa siya malayang makakilos dahil kay Saul na anak ni Kish[a]. Kabilang sila sa magigiting na mandirigma[b] na tumutulong sa digmaan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “napipigilan” o “nakapigil” dahil kay Saul na anak ni Kish.
    reason: lexical_alternative
  - marker: b
    text: Ang salitang Hebreo ay tumutukoy sa magigiting na mandirigma o mga bayani.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Ito ang mga
  rationale: Likas na panimula ito sa isang talaan sa modernong Tagalog. Hindi na kailangang tumbasan nang hiwalay ang pang-ugnay na וְ sa simula.
- source_word: הַבָּאִים אֶל דָּוִיד
  choice: mga lalaking pumunta kay David
  rationale: Ang participle ay tumutukoy sa pangkat ng mga taong dumating kay David; nilinaw ng “mga lalaking” ang tinutukoy sa kontekstong militar.
- source_word: לְצִיקְלַג
  choice: sa Ziklag
  rationale: Sa konteksto, ipinakikilala ng parirala ang lugar kung saan nila pinuntahan si David, bagaman maaari ring idiin ng לְ ang patutunguhan.
- source_word: עוֹד עָצוּר
  choice: napipigilan pa
  rationale: Pinananatili nito ang ideya ng patuloy na pagkakait ng kalayaan o pagkilos nang hindi ipinapalagay na literal na nakabilanggo si David.
- source_word: מִפְּנֵי שָׁאוּל בֶּן קִישׁ
  choice: dahil kay Saul na anak ni Kish
  rationale: Ipinahahayag dito ng מִפְּנֵי ang sanhi o banta na nagmumula kay Saul.
- source_word: בַּגִּבּוֹרִים
  choice: kabilang sa magigiting na mandirigma
  rationale: Ang גִּבּוֹרִים sa kontekstong ito ay mga bantog o magigiting na mandirigma, hindi lamang malalakas na lalaki.
- source_word: עֹזְרֵי הַמִּלְחָמָה
  choice: na tumutulong sa digmaan
  rationale: Natural na Tagalog na nagpapanatili sa papel nila bilang mga tumutulong o sumusuporta sa pakikipagdigma.
