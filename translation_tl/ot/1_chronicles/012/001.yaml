  source_fidelity: 'Ang pangkalahatang diwa ay tapat sa Hebreo: isang pangkat ang dumating kay David sa Ziklag habang siya ay nasa kalagayang ipinataw ng banta ni Saul, at sila ay mga magigiting na mandirigma na tumutulong sa digmaan. Gayunman, ang “napipigilan pa siya” ay maaaring magpahiwatig na may pumipigil sa isang tiyak na kilos, samantalang ang עָצוּר ay mas malawak na nagsasaad ng pagiging napipigilan o hindi malayang makakilos. Ang binagong anyo ay pinananatili ang lawak na ito nang hindi inaangking siya ay literal na nakabilanggo.'
