lexical_decisions:
- source_word: עַתַּי
  choice: Atai
  rationale: Pangngalang pantangi; tinumbasan sa karaniwang baybay sa modernong saling Tagalog, na malapit sa tunog ng Hebreo.
- source_word: הַשִּׁשִּׁי
  choice: ang ikaanim
  rationale: Ang ordinal na may pantukoy ay nagsasaad ng puwesto ni Atai sa talaan; likas sa Tagalog ang pariralang “ang ikaanim.”
- source_word: אֱלִיאֵל
  choice: Eliel
  rationale: Pangngalang pantangi; pinanatili ang nakaugaliang anyong Eliel, na malapit sa Hebreo.
- source_word: הַשְּׁבִעִי
  choice: ang ikapito
  rationale: Ang ordinal na may pantukoy ay nagsasaad ng puwesto ni Eliel sa pagkakasunod-sunod; malinaw at natural sa Tagalog ang “ang ikapito.”
