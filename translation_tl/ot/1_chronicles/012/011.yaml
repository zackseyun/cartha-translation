lexical_decisions:
- source_word: מִשְׁמַנָּה
  choice: Mismana
  rationale: Pangalan ng tao; isinatitik sa anyong natural sa makabagong Tagalog, kung saan ang Hebrew sh ay karaniwang kinakatawan ng s.
- source_word: הָרְבִיעִי
  choice: ang ikaapat
  rationale: Ang pang-uring pamilang na may pantukoy ay tumutukoy sa ranggo niya sa talaan; pinananatili ng “ang ikaapat” ang tiyak na ayos ng Hebrew.
- source_word: יִרְמְיָה
  choice: Jeremias
  rationale: Ginamit ang nakaugaliang anyong Tagalog ng pangalang biblikal upang maging madaling makilala at natural basahin.
- source_word: הַחֲמִשִׁי
  choice: ang ikalima
  rationale: Ang pang-uring pamilang na may pantukoy ay nagsasaad ng susunod na ranggo sa talaan; malinaw itong naihahayag ng “ang ikalima.”
