  - severity: low
    issue: Hindi likas ang alternatibo sa talababa [b].
    rationale: Ang “makapangyarihan at magigiting na mga lalaki” ay mabigat sa Tagalog at ang “mga lalaki” ay hindi kailangang idagdag. Ang “makapangyarihang mandirigma” ay mas likas na alternatibo.
