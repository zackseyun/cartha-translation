- from: At sila ang tumulong kay David laban sa pangkat ng mga mananalakay[a], sapagkat silang lahat ay magigiting na mandirigma[b], at sila ay naging mga pinuno[c] sa hukbo.
  to: At tumulong sila kay David laban sa pangkat ng mga mananalakay[a], sapagkat silang lahat ay magigiting na mandirigma[b], at naging mga pinuno[c] sila sa hukbo.
  rationale: Inalis ang “ang” matapos ang “sila” upang maiwasan ang hindi kinakailangang eksklusibong diin, habang pinanatili ang tahasang pagtukoy sa pangkat. Pinahusay din ang likas na anyo ng alternatibong salin sa talababa [b]. Walang pagbabagong ginawa sa pangunahing kahulugan, sa kawalang-katiyakan ng גְּדוּד, o sa mga panandang-talababa.
