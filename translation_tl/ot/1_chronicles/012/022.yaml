base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/022.yaml
  text: And they helped David against the raiding band[a], for all of them were mighty men of valor[c][b], and they became commanders in the army.
translation:
  language: tl
  text: At tumulong sila kay David laban sa pangkat ng mga mananalakay[a], sapagkat silang lahat ay magigiting na mandirigma[b], at naging mga pinuno[c] sila sa hukbo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “laban sa pangkat” o “laban sa pulutong.” Ang Hebreong גְּדוּד ay maaaring tumukoy sa isang pangkat ng kawal o pangkat na sumasalakay.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “makapangyarihang mandirigma.” Ang pariralang Hebreo na גִבּוֹרֵי חַיִל ay karaniwang tawag sa matatapang at mahuhusay na mandirigma.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “mga kumander,” “mga kapitan,” o “mga pinunong kawal.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵמָּה
  choice: At sila ang
  rationale: Pinananatili ng tahasang panghalip at ng hulma na “sila ang” ang pagbibigay-diin sa pangkat bilang simuno.
- source_word: עָזְרוּ עִם דָּוִיד
  choice: tumulong kay David
  rationale: Bagaman karaniwang nangangahulugang “kasama” ang עִם, likas sa Tagalog na tukuyin sa “kay David” ang taong tinulungan; hindi nito inaalis ang diwa ng pakikiisa sa kaniya.
- source_word: עַל הַגְּדוּד
  choice: laban sa pangkat ng mga mananalakay
  rationale: Maaaring tumukoy ang גְּדוּד sa isang pangkat ng kawal o pangkat na sumasalakay. Ang kontekstong militar ay malinaw na naipahahayag ng “pangkat ng mga mananalakay,” habang nasa talababa ang mas malawak na saklaw.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikita nito ang paliwanag o dahilan na ipinapasok ng כִּי at pinananatili ang marangal na himig ng salaysay.
- source_word: גִבּוֹרֵי חַיִל
  choice: magigiting na mandirigma
  rationale: Ito ay likas at malinaw na katumbas ng karaniwang Hebreong parirala para sa malalakas, may kakayahan, at matatapang na lalaking panlaban.
- source_word: כֻּלָּם
  choice: silang lahat
  rationale: Tahasang ipinahahayag nito na ang buong pangkat, walang itinatangi, ay mga magigiting na mandirigma.
- source_word: וַיִּהְיוּ
  choice: sila ay naging
  rationale: Ipinahahayag ng “naging” ang kinalabasang kalagayan at pag-usad ng salaysay, sa halip na ang payak at di-gumagalaw na “sila ay.”
- source_word: שָׂרִים
  choice: mga pinuno
  rationale: Sa kontekstong militar, tumutukoy ang שָׂרִים sa mga namumuno o may katungkulan. Malinaw at hindi labis na espesipiko ang “mga pinuno.”
- source_word: בַּצָּבָא
  choice: sa hukbo
  rationale: Ang צָבָא ay tumutukoy rito sa organisadong puwersang militar; ang “hukbo” ay likas at marangal na katumbas sa Tagalog.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog ang ginamit. Pinili ang “mandirigma” at “hukbo” upang mapanatili ang tiyak na kontekstong militar nang hindi nagiging teknikal. Inayos ang mga panandang-talababa upang ang [b] ay tumukoy sa “magigiting na mandirigma” at ang [c] sa “mga pinuno.”
