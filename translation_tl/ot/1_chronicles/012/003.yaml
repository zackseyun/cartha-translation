base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/003.yaml
  text: The chief was Ahiezer[a], then Joash, the sons of Shemaah the Gibeathite; and Jeziel and Pelet, the sons of Azmaveth[b]; and Beracah and Jehu the Anathothite.
translation:
  language: tl
  text: Ang pinuno ay si Ahiezer, at si Joas, na mga anak ni Semaas na taga-Gibea; sina Jeziel[a] at Pelet ay mga anak ni Azmavet; at sina Beraca[b] at Jehu ay taga-Anatot.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isatinig ang pangalang ito bilang “Iziel.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring baybayin ang pangalang ito na “Beraka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרֹאשׁ
  choice: Ang pinuno ay
  rationale: Sa konteksto ng talaan, ang רֹאשׁ ay tumutukoy sa nangunguna sa pangkat, hindi sa literal na ulo. Idinagdag ang pang-ugnay na “ay” upang maging natural sa Tagalog ang sugnay na walang pandiwa sa Hebreo.
- source_word: אֲחִיעֶזֶר
  choice: Ahiezer
  rationale: Isinatinig ang pangalang Hebreo sa anyong malinaw at madaling basahin sa modernong Tagalog.
- source_word: וְיוֹאָשׁ
  choice: at sumunod si Joas
  rationale: Ang וְ ay literal na “at,” ngunit sa pagkakasunod ng talaan, nililinaw ng “sumunod” na si Joas ang kasunod ng pinunong si Ahiezer nang hindi binabago ang diwa.
- source_word: בְּנֵי הַשְּׁמָעָה
  choice: mga anak ni Semaas
  rationale: Ang בְּנֵי ay karaniwang pormulang pangangkan na “mga anak ni.” Tinumbasan ang pangalan ayon sa bigkas na angkop sa Tagalog.
- source_word: הַגִּבְעָתִי
  choice: na taga-Gibea
  rationale: Ang pang-uring gentiliko ay nagsasaad ng pinagmulan sa Gibea. Mas natural at madaling maunawaan sa Tagalog ang “taga-Gibea” kaysa sa hiniram na anyong gentiliko.
- source_word: ויזואל
  choice: Jeziel
  rationale: Pangalan itong walang patinig sa anyong masoretiko rito; pinili ang karaniwang rekonstruksiyong Jeziel, habang itinatala sa talababa ang alternatibong Iziel.
- source_word: וָפֶלֶט
  choice: at Pelet
  rationale: Tuwirang pagsasatinig ng pangalang pantangi; walang idinagdag na pagpapakahulugan sa kahulugan ng pangalan.
- source_word: בְּנֵי עַזְמָוֶת
  choice: mga anak ni Azmavet
  rationale: Pinanatili ang karaniwang pormulang pangangkan at isinatinig ang pangalang עַזְמָוֶת sa paraang angkop sa Tagalog.
- source_word: וּבְרָכָה
  choice: at sina Beraca
  rationale: Isinatinig ang pangalang בְּרָכָה bilang Beraca ayon sa tunog ng Hebreo; inilagay sa talababa ang alternatibong baybay na Beraka.
- source_word: וְיֵהוּא
  choice: at Jehu
  rationale: Ginamit ang pamilyar na anyong Jehu para sa pangalang Hebreo.
- source_word: הָעֲנְּתֹתִי
  choice: na taga-Anatot
  rationale: Ang gentiliko ay tumutukoy sa isang taong mula sa Anatot. Ang “taga-Anatot” ay natural, malinaw, at tapat sa ugnayang heograpiko.
theological_decisions: []
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “taga-” para sa mga pang-uring nagsasaad ng lugar na pinagmulan, at mga anyong pangalan na angkop sa ortograpiyang Tagalog. Pinanatiling maikli ang estilo bilang talaan ng mga pangalan.
