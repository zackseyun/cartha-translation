revisions:
- from: Ang pinuno ay si Ahiezer, at sumunod si Joas—mga anak ni Semaas na taga-Gibea; sina Jeziel[a] at Pelet na mga anak ni Azmavet; at sina Beraca[b] at Jehu na taga-Anatot.
  to: Ang pinuno ay si Ahiezer, at si Joas, na mga anak ni Semaas na taga-Gibea; sina Jeziel[a] at Pelet ay mga anak ni Azmavet; at sina Beraca[b] at Jehu ay taga-Anatot.
  rationale: Inayos ang unang pangkat upang malinaw na kapwa sina Ahiezer at Joas ang “mga anak ni Semaas na taga-Gibea,” at pinalitan ang idinagdag na “sumunod” ng payak na “at.” Nilinaw rin sa pamamagitan ng “ay” ang dalawang kasunod na pangkat. Hindi binago ang kahulugan, mga pangalan, o wastong mga angkla ng talababa.
