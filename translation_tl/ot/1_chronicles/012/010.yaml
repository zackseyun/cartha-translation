  text: Ezer the chief[a], Obadiah the second, Eliab the third.
translation:
  language: tl
  text: Si Ezer ang pinuno[a], si Obadias ang ikalawa, at si Eliab ang ikatlo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nangunguna”; sa Hebreo, literal na “ulo.”
