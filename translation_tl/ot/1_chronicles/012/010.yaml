lexical_decisions:
- source_word: עֵזֶר
  choice: Ezer
  rationale: Pangalan ng tao; tinumbasan sa karaniwang anyong ginagamit sa modernong saling Tagalog.
- source_word: הָרֹאשׁ
  choice: ang pinuno
  rationale: Literal na “ang ulo,” ngunit sa konteksto ng talaan ay tumutukoy sa nangunguna o may pangunahing ranggo. Likas at malinaw sa Tagalog ang “pinuno,” habang inilalahad sa talababa ang literal na larawan.
- source_word: עֹבַדְיָה
  choice: Obadias
  rationale: Pangalan ng tao; ginamit ang nakaugaliang anyong Tagalog ng pangalang biblikal.
- source_word: הַשֵּׁנִי
  choice: ang ikalawa
  rationale: Tuwirang katumbas ng ordinal na tumutukoy sa ayos o ranggo sa talaan.
- source_word: אֱלִיאָב
  choice: Eliab
  rationale: Pangalan ng tao; ang anyong “Eliab” ay malinaw at nakaugaliang transliterasyon sa Tagalog.
- source_word: הַשְּׁלִשִׁי
  choice: ang ikatlo
  rationale: Tuwirang katumbas ng ordinal at pinananatili ang maikling estruktura ng talaan.
