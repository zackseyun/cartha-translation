  text: בְּ/לֶכְתּ֣/וֹ אֶל צִֽיקְלַ֗ג נָפְל֣וּ עָלָ֣י/ו מִֽ/מְּנַשֶּׁ֡ה עַ֠דְנַח וְ/יוֹזָבָ֤ד וִ/ידִֽיעֲאֵל֙ וּ/מִיכָאֵ֣ל וְ/יוֹזָבָ֔ד וֶ/אֱלִיה֖וּא וְ/צִלְּתָ֑י רָאשֵׁ֥י הָ/אֲלָפִ֖ים אֲשֶׁ֥ר לִ/מְנַשֶּֽׁה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/021.yaml
  text: 'As he went to Ziklag[a], some from Manasseh defected to him: Adnah, Jozabad, Jediael, Michael, another Jozabad, Elihu, and Zillethai[c][b], chiefs of the thousands that belonged to Manasseh.'
translation:
  language: tl
  text: 'Habang naglalakbay siya patungong Ziklag, may ilang taga-Manases na pumanig sa kanya[a]: sina Adna, Jozabad, Jediael, Micael, Jozabad[b], Elihu, at Ziletai. Sila ang mga pinuno ng mga libo[c] na kabilang sa Manases.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “nahulog sa kanya,” isang idyomang nangangahulugang lumipat sila sa panig ni David.
    reason: lexical_alternative
  - marker: b
    text: Dalawang beses lumilitaw sa tekstong Hebreo ang pangalang Jozabad, kaya dalawang magkaibang lalaking magkapangalan ang tinutukoy.
    reason: cultural_note
  - marker: c
    text: Ang “mga pinuno ng mga libo” ay maaaring tumukoy sa mga kumander ng mga yunit militar o sa mga pinuno ng mga pangkat ng angkan sa Manases.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּלֶכְתּוֹ
  choice: Nang papunta siya
  rationale: Ang ב na sinusundan ng infinitive construct ng הלך at hulaping panghalip ay nagsasaad ng panahong kasabay ng pagkilos. Likas sa modernong Tagalog ang “Nang papunta siya” at napapanatili nito ang diwang nasa paglalakbay pa siya.
- source_word: אֶל צִיקְלַג
  choice: sa Ziklag
  rationale: Ang אֶל ay tumutukoy sa patutunguhan. Sa Tagalog, sapat at natural ang “sa Ziklag” kasunod ng “papunta.”
- source_word: נָפְלוּ עָלָיו
  choice: pumanig sa kanya
  rationale: Sa kontekstong militar at pampolitika, ang idyomang ito ay nangangahulugang lumipat o sumapi sa panig ng isang tao. Malinaw na ipinahahayag ng “pumanig sa kanya” ang pagbabago ng katapatan nang hindi masyadong nagpapakahulugan sa motibo.
- source_word: מִמְּנַשֶּׁה
  choice: mula sa Manases
  rationale: Ipinakikilala ng parirala ang kanilang pinagmulang lipi. Hindi na kailangang idagdag sa pangunahing teksto ang salitang “lipi,” yamang nililinaw ng huling sugnay ang kanilang kaugnayan sa Manases.
- source_word: עַדְנַח וְיוֹזָבָד וִידִיעֲאֵל וּמִיכָאֵל וְיוֹזָבָד וֶאֱלִיהוּא וְצִלְּתָי
  choice: Adna, Jozabad, Jediael, Micael, Jozabad, Elihu, at Ziletai
  rationale: Isinalin sa baybay na madaling basahin sa Filipino ang mga pangalang Hebreo. Pinanatili ang dalawang paglitaw ng Jozabad sa halip na idagdag sa teksto ang “isa pang,” at ipinaliwanag ito sa talababa.
- source_word: רָאשֵׁי הָאֲלָפִים
  choice: mga pinuno ng mga libo-libo
  rationale: Pinananatili ng salin ang sadyang malawak na kahulugan ng אֲלָפִים, na maaaring tumukoy sa mga yunit militar o sa mga pangkat ng angkan. Inilalagay sa talababa ang mga posibilidad upang hindi pumili ng isa nang walang katiyakan.
- source_word: אֲשֶׁר לִמְנַשֶּׁה
  choice: na kabilang sa Manases
  rationale: Ipinakikita ng pariralang ito na ang mga pangkat o yunit na pinamumunuan nila ay kaugnay ng Manases. Ang “kabilang sa” ay natural at hindi labis na tumutukoy kung militar o pang-angkan ang kaayusan.
