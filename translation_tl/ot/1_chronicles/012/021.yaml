translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “pumanig” para sa idyomang militar-pampolitika, ngunit pinanatili sa talababa ang literal na larawan. Hindi nilutas nang sapilitan ang kalabuan ng “mga libo-libo.”
