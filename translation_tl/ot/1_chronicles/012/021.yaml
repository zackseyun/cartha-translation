  source_fidelity: 'Tumpak ang pangunahing diwa: habang nagtutungo si David sa Ziklag, may mga mula sa Manases na lumipat sa kaniyang panig, at inilista ang pitong pangalan. Napanatili rin ang pag-uulit ng Jozabad at ang sinadyang kalabuan ng רָאשֵׁי הָאֲלָפִים. Gayunman, ang “mga libo-libo” ay karaniwang nangangahulugang napakaraming libo sa modernong Tagalog, samantalang ang Hebreo ay isang teknikal o pangkatang katawagang “mga libo,” na maaaring yunit o dibisyong pang-angkan.'
