base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/032.yaml
  text: And from the half-tribe of Manasseh[a], eighteen thousand, who were designated by name, came to make David king.
translation:
  language: tl
  text: Mula naman sa kalahating lipi ni Manases ay labingwalong libo, na tinukoy sa pangalan[a] upang pumunta at gawing hari si David.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “na itinalaga sa pangalan,” samakatuwid, mga indibiduwal na tinukoy o tahasang itinala.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מֵ/חֲצִי מַטֵּה מְנַשֶּׁה
  choice: Mula naman sa kalahating lipi ni Manases
  rationale: Ang וּמֵ ay ipinahayag bilang “mula naman,” habang ang חֲצִי מַטֵּה ay likas na isinalin na “kalahating lipi.” Ang מַטֶּה ay tumutukoy sa lipi sa kontekstong pantribo at pangmilitar.
- source_word: שְׁמוֹנָה עָשָׂר אָלֶף
  choice: 18,000
  rationale: Tuwirang paglalahad ng bilang sa anyong madaling basahin sa makabagong Filipino.
- source_word: אֲשֶׁר נִקְּבוּ בְּשֵׁמוֹת
  choice: mga itinalaga ayon sa pangalan
  rationale: Pinananatili ng “itinalaga” ang pasibong anyo ng Niphal na נִקְּבוּ, at ipinahihiwatig ng “ayon sa pangalan” na ang mga tao ay indibidwal na tinukoy o itinala, nang hindi labis na nililimitahan ang parirala sa isang teknikal na talaan.
- source_word: לָבוֹא
  choice: upang pumaroon
  rationale: Bagaman infinitive ang anyo, natural na ipinapahayag sa Filipino ang layunin ng kanilang pagpunta sa pamamagitan ng “upang pumaroon.”
- source_word: לְהַמְלִיךְ אֶת דָּוִיד
  choice: gawing hari si David
  rationale: 'Tuwirang ipinapahayag ang causative na kahulugan ng Hiphil ng מלך: gawin o italaga bilang hari. Iniiwasan ng “gawing hari” ang mas makitid na seremonyal na kahulugan ng “koronahan.”'
