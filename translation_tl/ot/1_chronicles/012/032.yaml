  - severity: low
    issue: Mas arkaiko ang “pumaroon” kaysa sa karaniwang modernong Filipino.
    rationale: Ang “pumunta” ay natural na modernong katumbas ng לָבוֹא at pinananatili ang layuning ipinahahayag ng infinitive.
