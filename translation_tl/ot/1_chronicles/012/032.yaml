translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “lipi” para sa pantribong kahulugan ng מַטֶּה at “pumaroon” bilang dignidad na hindi naman lipas. Inilagay ang talababa sa mismong pariralang נִקְּבוּ בְּשֵׁמוֹת na nililinaw nito.
