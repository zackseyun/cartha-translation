  source_fidelity: 'Tumpak ang pangunahing diwa: mula sa kalahating lipi ni Manases, labingwalong libo ang tahasang tinukoy sa pangalan upang lumahok sa paggawa kay David bilang hari. Gayunman, mas malinaw na ilahad ang kaugnay na sugnay na אֲשֶׁר נִקְּבוּ בְּשֵׁמוֹת bilang “na tinukoy sa pangalan.”'
  naturalness: Ang “mga itinalaga ayon sa pangalan” ay medyo mabigat at maaaring magpahiwatig na ang pagtatalaga ay ginawa batay sa kanilang mga pangalan. Ang “na tinukoy sa pangalan” ay mas likas at tuwirang nagpapahayag ng indibiduwal na pagkakakilanlan. Ang “pumunta” ay mas makabago kaysa “pumaroon” nang hindi ibinababa ang rehistro.
  terminology: Ang “kalahating lipi,” “Manases,” at “gawing hari si David” ay angkop. Pinananatili ng “tinukoy sa pangalan” ang pasibong diwa ng נִקְּבוּ at ang kahulugang “by name,” nang hindi ipinipilit na teknikal na pagpapatala ito.
