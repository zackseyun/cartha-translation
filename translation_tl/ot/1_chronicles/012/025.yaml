base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/025.yaml
  text: From the sons of Judah[a], carrying shield and spear, there were 6,800 equipped for battle.
translation:
  language: tl
  text: Mula sa mga anak ni Juda, 6,800 ang may dalang kalasag at sibat at nakahanda para sa digmaan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “may kagamitang pandigma.” Ang pariralang Hebreo na חֲלוּצֵי צָבָא ay tumutukoy sa mga lalaking may kagamitan o nakahanda para sa pakikipaglaban.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי יְהוּדָה
  choice: Mula sa mga anak ni Juda
  rationale: Pinananatili ng “mga anak ni Juda” ang anyong Hebreo at ang diwang tumutukoy sa mga kabilang sa lipi ni Juda; ang “mula sa” ay angkop sa talaan ng mga pangkat mula sa bawat lipi.
- source_word: נֹשְׂאֵי
  choice: may dalang
  rationale: Natural sa modernong Filipino at malinaw na tumutukoy sa pagdadala ng kagamitang pandigma.
- source_word: צִנָּה
  choice: kalasag
  rationale: Karaniwan at malinaw na katumbas; bagaman maaari itong tumukoy sa malaking kalasag, hindi kailangang idagdag ang sukat sa pangunahing teksto.
- source_word: וָרֹמַח
  choice: at sibat
  rationale: Ang “sibat” ang pinakapamilyar at tuwirang katumbas ng sandatang רמח.
- source_word: שֵׁשֶׁת אֲלָפִים וּשְׁמוֹנֶה מֵאוֹת
  choice: 6,800
  rationale: Tuwiran ang bilang sa Hebreo, at madaling basahin ang mga numerong Arabiko sa ganitong talaang militar.
- source_word: חֲלוּצֵי צָבָא
  choice: nasasandatahan para sa labanan
  rationale: Ipinahihiwatig ng parirala ang mga lalaking may kagamitan at nakahanda para sa pakikipaglaban. Pinananatili ng salin ang diwang militar nang hindi labis na nililimitahan ito sa simpleng kahandaang pangkaisipan.
