  to: Lumabas si David sa harap nila at sumagot at sinabi niya sa kanila, “Kung naparito kayo sa akin nang mapayapa upang tulungan ako, makikiisa sa inyo ang puso ko. Ngunit kung naparito kayo upang ipagkanulo ako sa mga kaaway ko, gayong wala akong ginawang karahasan,[a] makita sana ng Diyos ng ating mga ninuno at humatol siya.”[b]
  rationale: Inalis ang dagdag na “ito” upang hindi ipataw ang isang tiyak na layon sa bukas na pandiwang Hebreo na “makita.” Ibinalik ang “at sinabi niya” upang katawanin ang dalawang pandiwa sa pinagmulan nang nananatiling natural ang daloy ng modernong Tagalog. Pinanatili ang iba pang salin at mga talababa, kabilang ang maingat na paglalarawan sa idyomang “karahasan sa aking mga palad” at sa saklaw ng pangwakas na pandiwang Hebreo.
