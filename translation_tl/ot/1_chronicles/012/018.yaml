    issue: May idinagdag na malabong layon sa “makita sana ito ng Diyos.”
    rationale: Walang hayag na bagay ang יֵרֶא (“makita”) sa Hebreo. Ang “ito” ay maaaring ipalagay na tumutukoy sa kanilang pagtataksil o sa kawalang-sala ni David, samantalang ang Hebreo ay sadyang hindi tumutukoy nang tuwiran.
  - severity: low
    issue: Hindi ganap na naipahayag ang pormulang “sumagot at sinabi.”
    rationale: May dalawang pandiwa sa Hebreo, וַיַּעַן וַיֹּאמֶר. Bagaman posible ang pagpapaikli sa Tagalog, ligtas at natural na isalin ang kapwa pandiwa sa salaysay na ito.
