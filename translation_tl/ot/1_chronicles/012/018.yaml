base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/018.yaml
  text: David went out before them and answered and said to them[a], “If you have come to me in peace to help me, my heart will be united with you; but if you have come to betray me to my enemies, though there is no violence in my hands[b], may the God of our fathers see and judge.”
translation:
  language: tl
  text: Lumabas si David sa harap nila at sumagot at sinabi niya sa kanila, “Kung naparito kayo sa akin nang mapayapa upang tulungan ako, makikiisa sa inyo ang puso ko. Ngunit kung naparito kayo upang ipagkanulo ako sa mga kaaway ko, gayong wala akong ginawang karahasan,[a] makita sana ng Diyos ng ating mga ninuno at humatol siya.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “walang karahasan sa aking mga palad.”
    reason: literal_rendering
  - marker: b
    text: Ang huling pandiwang Hebreo ay maaari ring isaling “sumaway” o “magpasya.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּצֵא דָוִיד לִפְנֵיהֶם
  choice: Lumabas si David sa harap nila
  rationale: Pinananatili ang kilos ng יצא at ang spatial na diwa ng לִפְנֵיהֶם nang hindi idinaragdag ang mas interpretibong “upang salubungin sila.”
- source_word: וַיַּעַן וַיֹּאמֶר לָהֶם
  choice: at sumagot sa kanila
  rationale: Sa natural na modernong Tagalog, sapat nang ipahayag ng “sumagot” ang pormulang Hebreo na “sumagot at sinabi,” na magiging mabigat kung ililipat nang salita-sa-salita.
- source_word: לְשָׁלוֹם בָּאתֶם אֵלַי
  choice: Kung mapayapa ang pagpunta ninyo sa akin
  rationale: Ipinahahayag ang mapayapa at tapat na layunin ng paglapit, habang pinananatili ang kondisyunal na pahayag.
- source_word: לְעָזְרֵנִי
  choice: upang tulungan ako
  rationale: Tuwirang infinitive of purpose at likas sa Tagalog.
- source_word: יִהְיֶה לִּי עֲלֵיכֶם לֵבָב לְיָחַד
  choice: makikiisa sa inyo ang puso ko
  rationale: Inihahatid ang idyomatikong diwa ng nagkakaisang puso at buong-loob na pakikiisa nang hindi ginagawang teknikal o denominasyonal.
- source_word: לְרַמּוֹתַנִי לְצָרַי
  choice: upang ipagkanulo ako sa mga kaaway ko
  rationale: Sa kontekstong militar at pampolitika, ang Piel ng רמה ay tumutukoy sa mapandayang pagtataksil na naghahatid kay David sa kaniyang mga kaaway.
- source_word: בְּלֹא חָמָס בְּכַפַּי
  choice: gayong wala akong ginawang karahasan
  rationale: Inihahatid ang pag-angkin ni David na wala siyang kasalanang marahas. Ang literal na “walang karahasan sa aking mga palad” ay hindi likas sa kasalukuyang Tagalog, kaya inililipat ang idyoma bilang gawa.
- source_word: אֱלֹהֵי אֲבוֹתֵינוּ
  choice: Diyos ng ating mga ninuno
  rationale: Likas, marangal, at saklaw ang salin; tinutukoy nito ang mga naunang salinlahi sa tipanang pahayag.
- source_word: יֵרֶא ... וְיוֹכַח
  choice: makita sana ito ... at humatol siya
  rationale: Ang mga imperfect ay binabasa bilang taimtim na panawagan sa Diyos. Ang “humatol” ay akma sa forensic na konteksto, ngunit itinatala ang lawak ng kahulugan ng יכח.
theological_decisions:
- issue: Pagkilos ng Diyos sa pangwakas na panawagan
  choice: makita sana ito ng Diyos ng ating mga ninuno at humatol siya
  alternative: makikita ito ng Diyos ng ating mga ninuno at hahatol siya; o makita sana niya at sawayin
  rationale: Pinananatili ng optative na “sana” ang anyo ng panawagan sa banal na paghatol sa halip na gawing tiyak na prediksiyon. Ang “humatol” ay umaangkop sa usapin ng kawalang-sala at pagtataksil, samantalang kinikilala sa talababa na maaari ring mangahulugan ang pandiwa ng pagsaway o pagpapasya.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Iniwasan ang makalumang “mga magulang” para sa ancestors at ang sobrang literal na mga idyomang magiging malabo. Nakalagay sa pangunahing teksto ang lahat ng marker na [a] at [b].
