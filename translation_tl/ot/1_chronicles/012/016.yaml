base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/016.yaml
  text: These are the men who crossed the Jordan in the first month[a], when it was overflowing all its banks, and they put to flight all those in the valleys, to the east and to the west.
translation:
  language: tl
  text: Ito ang mga lalaking tumawid sa Jordan noong unang buwan, nang umaapaw ito sa lahat ng pampang nito. Pinatakas nila ang lahat ng nasa mga libis[a] patungo sa silangan at sa kanluran.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “ang lahat ng mga libis.” Ang tinutukoy ay ang mga taong nasa mga libis, sapagkat ang pandiwa ay nangangahulugang “pinatakas” o “itinaboy.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה הֵם
  choice: Ito ang mga lalaking
  rationale: Ang demonstratibo at panghalip ay isang mariing pormula ng pagkilala. Idinagdag ang “mga lalaki” mula sa konteksto ng mga mandirigma upang maging likas at malinaw sa Tagalog.
- source_word: אֲשֶׁר עָבְרוּ אֶת הַיַּרְדֵּן
  choice: tumawid sa Jordan
  rationale: Tuwirang ipinahahayag ng עָבַר ang pagtawid; ito ang pinakanatural na modernong Tagalog.
- source_word: בַּחֹדֶשׁ הָרִאשׁוֹן
  choice: noong unang buwan
  rationale: Pinananatili ang katawagang Hebreo sa kalendaryo nang hindi ipinapalagay ang katumbas nitong modernong buwan.
- source_word: וְהוּא מְמַלֵּא עַל כָּל גְּדִיתָיו
  choice: nang umaapaw ito sa lahat ng pampang nito
  rationale: Inilalarawan ang Jordan sa panahon ng pagbaha. Ang “umaapaw” ay malinaw na naghahatid ng diwang lumalampas ang tubig sa mga pampang.
- source_word: וַיַּבְרִיחוּ
  choice: Itinaboy nila
  rationale: 'Ang anyong Hiphil ng ברח ay causative: pinatakas o pinaurong nila ang iba. Ang “itinaboy” ay natural sa Tagalog at hindi labis na nagpapalaki sa tagumpay militar.'
- source_word: אֶת כָּל הָעֲמָקִים
  choice: ang lahat ng nasa mga libis
  rationale: Literal na “ang lahat ng mga libis,” ngunit mga tao ang maaaring itaboy. Inihahayag ng salin ang metonimiya nang hindi tinutukoy nang mas tiyak kung sino ang mga taong iyon.
- source_word: לַמִּזְרָח וְלַמַּעֲרָב
  choice: sa silangan at sa kanluran
  rationale: Pinananatili ang dalawang direksiyon at ang bahagyang kalabuan kung inilalarawan nito ang kinaroroonan ng mga nasa libis o ang lawak ng pagtataboy.
