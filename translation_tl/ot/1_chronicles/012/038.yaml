base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/038.yaml
  text: And from beyond the Jordan[a], from the Reubenites, the Gadites, and the half-tribe of Manasseh, with every kind of military equipment for war, there were one hundred twenty thousand.
translation:
  language: tl
  text: At mula sa kabilang panig ng Jordan[a]—mula sa mga Rubenita, mga Gadita, at kalahating lipi ni Manases—ay may 120,000 na may dalang lahat ng kagamitang pandigma.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mula sa ibayo ng Jordan.” Maaaring unawain ang pananalitang Hebreo mula sa magkaibang heograpikong pananaw bilang “mula sa kabilang panig ng Jordan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֵעֵבֶר לַיַּרְדֵּן
  choice: At mula sa kabila ng Jordan
  rationale: Ang מֵעֵבֶר ay tumutukoy sa pook sa ibayo o kabilang panig ng Jordan. Ang “sa kabila ng Jordan” ay natural sa modernong Tagalog at hindi tiyak sa heograpikong pananaw.
- source_word: מִן הָראוּבֵנִי וְהַגָּדִי וַחֲצִי שֵׁבֶט מְנַשֶּׁה
  choice: mula sa mga Rubenita, mga Gadita, at kalahating lipi ni Manases
  rationale: Bagaman anyong isahan ang mga katawagang gentiliko sa Hebreo, kolektibo ang gamit ng mga ito. Malinaw at likas sa Tagalog ang maramihang “mga Rubenita” at “mga Gadita,” habang pinananatili ng “kalahating lipi ni Manases” ang estruktura ng Hebreo.
- source_word: בְּכֹל כְּלֵי צְבָא מִלְחָמָה
  choice: dala ang lahat ng uri ng kagamitang pandigma
  rationale: Ang כְּלֵי ay malawak na tumutukoy sa mga kagamitan o kasangkapan, kabilang ang mga sandata. Pinananatili ng “lahat ng uri ng kagamitang pandigma” ang lawak ng kahulugan at ang diwa ng בְּכֹל nang hindi nililimitahan sa sandata lamang.
- source_word: מֵאָה וְעֶשְׂרִים אָלֶף
  choice: 120,000
  rationale: Tuwirang katumbas ng bilang na isang daan at dalawampung libo; ang numerong anyo ay malinaw at madaling basahin sa modernong Filipino.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “Jordan,” “Rubenita,” “Gadita,” at “Manases” bilang pamilyar na anyo ng mga pangalang biblikal. Inayos ang pangungusap upang maging natural sa Tagalog habang pinananatili ang listahan at bilang sa Hebreo.
