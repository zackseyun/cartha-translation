  text: וְ/גַ֣ם הַ/קְּרֽוֹבִים אֲ֠לֵי/הֶם עַד יִשָׂשכָ֨ר וּ/זְבֻל֜וּן וְ/נַפְתָּלִ֗י מְבִיאִ֣ים לֶ֡חֶם בַּ/חֲמוֹרִ֣ים וּ/בַ/גְּמַלִּ֣ים וּ/בַ/פְּרָדִ֣ים וּֽ/בַ/בָּקָ֡ר מַאֲכָ֡ל קֶ֠מַח דְּבֵלִ֨ים וְ/צִמּוּקִ֧ים וְ/יַֽיִן וְ/שֶׁ֛מֶן וּ/בָקָ֥ר וְ/צֹ֖אן לָ/רֹ֑ב כִּ֥י שִׂמְחָ֖ה בְּ/יִשְׂרָאֵֽל־־׀־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/041.yaml
  text: 'Also those near them[a], as far as Issachar and Zebulun and Naphtali, were bringing food on donkeys, camels, mules, and cattle: provisions of flour, fig cakes, raisin cakes, wine, oil, cattle, and sheep in abundance[c][b], for there was joy in Israel.'
translation:
  language: tl
  text: 'Maging ang mga malapit sa kanila, hanggang sa Isacar, Zebulun, at Neftali,[a] ay nagdadala ng pagkain[b] sa pamamagitan ng mga asno, kamelyo, mula, at baka: mga panustos na harina, mga igos na pinipi, pinatuyong ubas,[c] alak, langis, at napakaraming baka at tupa. Sapagkat may kagalakan sa Israel.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “maging hanggang sa Isacar, Zebulun, at Neftali.” Ipinakikita ng parirala ang lawak ng lugar na pinanggalingan ng mga nagdala ng panustos.
    reason: alternative_reading
  - marker: b
    text: Ang salitang Hebreo ay literal na “tinapay,” ngunit tumutukoy rito sa pagkain sa pangkalahatan, gaya ng ipinakikita ng kasunod na talaan ng mga panustos.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring isalin na “mga binilog na pinatuyong ubas.” Maaaring tumukoy ang salitang Hebreo sa mga pinatuyong ubas o sa mga ito na pinipi at binubuo upang madaling dalhin.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: Maging
  rationale: Likas na ipinahahayag ang pandagdag at pagbibigay-diin kaugnay ng naunang talata.
- source_word: הַקְּרֹבִים אֲלֵיהֶם
  choice: ang mga nakatira malapit sa kanila
  rationale: Ipinahahayag ang mga taong malapit sa kanila nang hindi nililimitahan sa pormal na kahulugang 'mga kapitbahay.' Idinagdag ang 'nakatira' para maging malinaw at natural sa Tagalog ang heograpikong diwa.
- source_word: עַד יִשָׂשכָר וּזְבֻלוּן וְנַפְתָּלִי
  choice: hanggang sa Isacar, Zebulun, at Neftali
  rationale: Pinananatili ng 'hanggang sa' ang diwa ng עַד bilang hangganan o lawak ng lugar.
- source_word: מְבִיאִים
  choice: ay patuloy na nagdadala
  rationale: Ang participle ay nagpapahiwatig ng nagpapatuloy o paulit-ulit na pagkilos sa salaysay.
- source_word: לֶחֶם
  choice: pagkain
  rationale: Bagaman literal na 'tinapay,' ginagamit ito rito sa mas malawak na diwa, gaya ng ipinakikita ng kasunod na talaan ng sari-saring panustos.
- source_word: בַּחֲמוֹרִים וּבַגְּמַלִּים וּבַפְּרָדִים וּבַבָּקָר
  choice: na nakasakay sa mga asno, kamelyo, mula, at baka
  rationale: Ang pang-ukol ay nagsasaad ng paraan ng paghahatid. Hindi binago ang בָּקָר tungo sa 'kariton' sapagkat mga baka mismo ang binabanggit ng teksto.
- source_word: מַאֲכָל
  choice: mga panustos
  rationale: Ang salita ay nagpapakilala sa detalyadong talaan ng pagkaing inilaan para sa malaking pagtitipon.
- source_word: קֶמַח
  choice: harina
  rationale: Karaniwang katumbas ng pinong giniling na butil.
- source_word: דְּבֵלִים
  choice: binilog na igos
  rationale: Tumutukoy sa mga igos na pinipi o binubuo upang madaling itago at dalhin; mas malinaw ito kaysa sa literal ngunit di-likas na 'keyk ng igos.'
- source_word: צִמּוּקִים
  choice: pinatuyong ubas
  rationale: Pinananatili ang tiyak na leksikal na diwa nang hindi ipinapalagay sa pangunahing teksto na hinubog ang mga ito bilang mga binilog na kumpol.
- source_word: יַיִן
  choice: alak
  rationale: Karaniwang natural na salin sa kontekstong biblikal.
- source_word: שֶׁמֶן
  choice: langis
  rationale: Hindi tinukoy ng Hebreo na langis ng olibo, kaya pinanatili ang mas malawak na katawagan.
- source_word: לָרֹב
  choice: napakaraming
  rationale: Ipinahahayag ang kasaganaan ng mga baka at tupa sa natural na Tagalog.
- source_word: כִּי שִׂמְחָה בְּיִשְׂרָאֵל
  choice: Sapagkat may kagalakan sa Israel
  rationale: Pinananatili ang sanhi at ang payak ngunit mariing pangwakas na pahayag ng Hebreo.
