translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang heograpikong gamit ng 'hanggang sa,' ang nagpapatuloy na aspekto ng pagdadala, at ang hindi espesipikong 'langis.' Iniwasan ang di-natural na 'keyk ng igos' at 'keyk ng pasas,' habang inilagay sa talababa ang posibleng anyong binilog ng pinatuyong ubas.
