- from: 'Maging ang mga nakatira malapit sa kanila, hanggang sa Isacar, Zebulun, at Neftali,[a] ay patuloy na nagdadala ng pagkain[b] na nakasakay sa mga asno, kamelyo, mula, at baka: mga panustos na harina, binilog na igos, pinatuyong ubas,[c] alak, langis, at napakaraming baka at tupa. Sapagkat may kagalakan sa Israel.'
  to: 'Maging ang mga malapit sa kanila, hanggang sa Isacar, Zebulun, at Neftali,[a] ay nagdadala ng pagkain[b] sa pamamagitan ng mga asno, kamelyo, mula, at baka: mga panustos na harina, mga igos na pinipi, pinatuyong ubas,[c] alak, langis, at napakaraming baka at tupa. Sapagkat may kagalakan sa Israel.'
