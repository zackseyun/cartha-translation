base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/031.yaml
  text: And from the sons of Ephraim[a], twenty thousand eight hundred mighty men of valor, men of renown according to their fathers’ houses.
translation:
  language: tl
  text: 'At mula sa mga anak ni Efraim: 20,800 magigiting na mandirigma, mga lalaking bantog[a] sa kani-kanilang angkan.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “mga lalaking may mga pangalan,” isang idyoma para sa mga kilala o natatanging lalaki.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִן
  choice: At mula sa
  rationale: Ipinagpapatuloy ng pangatnig at pang-ukol ang talaan ng mga lipi sa naunang konteksto.
- source_word: בְּנֵי אֶפְרַיִם
  choice: mga anak ni Efraim
  rationale: Pinananatili ang anyong pangangkan ng Hebreo; sa kontekstong ito, tumutukoy ito sa mga kaanib o inapo ng lipi ni Efraim.
- source_word: עֶשְׂרִים אֶלֶף וּשְׁמוֹנֶה מֵאוֹת
  choice: 20,800
  rationale: Tumpak na inilalahad ang bilang sa malinaw at karaniwang modernong anyo.
- source_word: גִּבּוֹרֵי חַיִל
  choice: magigiting na mandirigma
  rationale: Ipinahahayag nito ang lakas, tapang, at husay sa pakikidigma na taglay ng idyomang Hebreo.
- source_word: אַנְשֵׁי שֵׁמוֹת
  choice: mga lalaking bantog
  rationale: Ang literal na ‘mga lalaking may mga pangalan’ ay isang idyoma para sa mga kilala, tanyag, o natatanging tao.
- source_word: לְבֵית אֲבוֹתָם
  choice: sa kani-kanilang angkan
  rationale: Likas na salin ito ng pag-uuri ayon sa sambahayan o angkan ng mga ninuno, nang hindi ipinapalagay na tumutukoy lamang sa agarang ama.
