base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/036.yaml
  text: From Dan[a], twenty-eight thousand six hundred prepared for battle.
translation:
  language: tl
  text: Mula sa Dan, 28,600 ang nakahanda para sa labanan[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nakahanay para sa labanan” o “humahanay para sa labanan.” Binibigyang-diin ng pariralang Hebreo ang kahandaang militar o ang pagkakaayos sa hanay ng pakikipaglaban.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִן
  choice: Mula sa
  rationale: Ang pang-ugnay at pang-ukol ay literal na “at mula sa,” ngunit sa tuloy-tuloy na talaan ng mga lipi, natural sa Tagalog ang “Mula sa” at hindi nawawala ang diwa.
- source_word: הַדָּנִי
  choice: Dan
  rationale: Bagaman anyong gentiliko ang Hebreo, tumutukoy ito rito sa lipi ni Dan bilang pangkat na kinakatawan sa talaang militar; mas malinaw at natural ang “Dan” kaysa sa anyong tila iisang tao.
- source_word: עֹרְכֵי מִלְחָמָה
  choice: nakahanda para sa labanan
  rationale: Ang pariralang participial ay nagsasaad ng mga taong nakaayos sa hanay o handang lumaban. Malinaw sa modernong Tagalog ang “nakahanda para sa labanan,” habang inilalagay sa talababa ang mas tiyak na larawan ng paghanay.
- source_word: עֶשְׂרִים וּשְׁמוֹנָה אֶלֶף וְשֵׁשׁ מֵאוֹת
  choice: 28,600
  rationale: Tuwirang bilang ito na dalawampu’t walong libo at animnaraan; ang numerong anyo ay madaling basahin at angkop sa talaan.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na maikli at marangal, alinsunod sa anyo ng talaang militar. Pinanatili ang tunay na saklaw ng pariralang Hebreo sa pamamagitan ng talababa.
