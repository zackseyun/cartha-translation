  text: וְ/יוֹעֵאלָ֧ה וּ/זְבַדְיָ֛ה בְּנֵ֥י יְרֹחָ֖ם מִן הַ/גְּדֽוֹר־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/008.yaml
  text: and Joelah and Zebadiah[a], the sons of Jeroham from Gedor.
translation:
  language: tl
  text: at sina Joela[a] at Zebadias, na mga anak ni Jeroham na mula sa Gedor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring baybayin ang pangalang ito na “Joelah.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/יוֹעֵאלָה
  choice: at sina Joela
  rationale: Pinanatili ang pang-ugnay na וְ bilang “at” dahil karugtong ito ng naunang talaan. Isinulat ang personal na pangalan sa anyong likas basahin sa Filipino.
- source_word: וּ/זְבַדְיָה
  choice: at Zebadias
  rationale: Isinalin ang pang-ugnay na וּ bilang “at” at ginamit ang nakasanayang anyong Filipino ng personal na pangalan.
- source_word: בְּנֵי
  choice: mga anak ni
  rationale: Ang construct plural ng בֵּן ay tuwirang tumutukoy rito sa mga anak na lalaki ni Jeroham; ang “mga anak ni” ay natural sa Filipino at hindi kailangang ulitin ang kasarian dahil mga pangalang panlalaki ang tinutukoy.
- source_word: יְרֹחָם
  choice: Jeroham
  rationale: Tinumbasan ang pangalang pantangi sa malapit na transliterasyon sa Hebreo.
- source_word: מִן הַ/גְּדֽוֹר
  choice: na mula sa Gedor
  rationale: Ipinahahayag ng מִן ang pinagmulan o kaugnayan sa lugar. Itinuring ang גְּדוֹר na pangalang pook at hindi literal na isinalin ang artikulong Hebreo.
theological_decisions: []
translation_notes:
  register: Makabago at marangal na Filipino para sa isang nagpapatuloy na talaan ng mga pangalan. Ginamit ang “sina” upang maging natural ang pagbanggit sa dalawang tao, habang pinanatili ang panimulang “at” ng tekstong Hebreo.
