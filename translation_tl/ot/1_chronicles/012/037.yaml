  text: And from Asher[a], forty thousand who went out for military service, to array themselves for battle.
translation:
  language: tl
  text: At mula sa Asher, apatnapung libong nakatakda para sa tungkuling militar, upang humanay para sa labanan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “apatnapung libong may kakayahang humanay para sa digmaan.” Pinagsasama ng Hebreo ang pananalitang tumutukoy sa mga lumalabas para sa tungkuling militar at ang pandiwang nangangahulugang “mag-ayos” o “humanay” sa pormasyon para sa labanan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מֵ/אָשֵׁר
  choice: Mula naman sa Asher
  rationale: Ang “mula” ang natural na katumbas ng pang-ukol, samantalang ipinahihiwatig ng “naman” ang pagpapatuloy ng talaan na dala ng pangatnig. Pinanatili ang Asher bilang pangalan ng lipi nang hindi idinaragdag sa pangunahing teksto ang salitang “lipi.”
- source_word: יוֹצְאֵי צָבָא
  choice: ang lumalabas kasama ng hukbo
  rationale: Pinananatili ng “lumalabas” ang participial na diwa ng יצא, at ipinakikita ng “kasama ng hukbo” ang kontekstong militar ng צבא nang hindi nililimitahan ito sa isang makabagong teknikal na termino.
- source_word: לַ/עֲרֹךְ מִלְחָמָה
  choice: upang humanay sa labanan
  rationale: Sa kontekstong militar, ang ערך ay tumutukoy sa pag-aayos o paghanay sa pormasyon; natural na ipinahahayag ito sa Tagalog bilang “humanay.” Ang מִלְחָמָה ay maaaring “digmaan” o “labanan”; pinili ang “labanan” dahil tumutukoy ang parirala sa aktuwal na paghahanay para makipaglaban.
- source_word: אַרְבָּעִים אָלֶף
  choice: 40,000
  rationale: Tuwirang katumbas ng bilang na “apatnapung libo”; ginamit ang mga numero para sa malinaw at madaling basahing talaan.
