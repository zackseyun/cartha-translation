translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang anyong talaan at ang dalawang magkaugnay na larawang militar—ang paglabas kasama ng hukbo at ang paghanay para sa labanan—habang inilagay sa talababa ang lehitimong alternatibong pagbasa.
