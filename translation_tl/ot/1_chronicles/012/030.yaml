base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/030.yaml
  text: And from the sons of Benjamin[a], Saul’s brothers, three thousand[b]; until then most of them had been keeping watch over the house of Saul.
translation:
  language: tl
  text: At mula sa mga anak ni Benjamin, mga kapatid ni Saul[a], ay tatlong libo; hanggang noon, karamihan sa kanila ay nagbabantay pa rin sa sambahayan ni Saul.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “mga kapatid” ay maaari ring mangahulugang “mga kaanak” o “mga kamag-anak ni Saul.”
    reason: lexical_alternative
  - marker: b
    text: Ang “sambahayan ni Saul” ay maaaring tumukoy sa sambahayan o angkan ni Saul, o sa kapakanan ng kaniyang maharlikang linya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִן
  choice: At mula sa
  rationale: Pinananatili ang pang-ugnay at pang-ukol na nagpapatuloy sa talaan ng mga pangkat na sumuporta kay David.
- source_word: בְּנֵי בִנְיָמִן
  choice: mga anak ni Benjamin
  rationale: Pinananatili ang Hebreong pantribo at pangangkanang paraan ng pagsasabi, sa halip na gawing mas tuwirang 'mga Benjaminita.'
- source_word: אֲחֵי שָׁאוּל
  choice: mga kapatid ni Saul
  rationale: Ito ang tuwirang katumbas ng Hebreo, ngunit maaaring tumukoy sa mas malawak na mga kaanak; nililinaw ang saklaw na iyon sa talababa.
- source_word: שְׁלֹשֶׁת אֲלָפִים
  choice: tatlong libo
  rationale: Likas at eksaktong paglalahad ng bilang.
- source_word: וְעַד הֵנָּה
  choice: hanggang sa panahong iyon
  rationale: Ipinahihiwatig ng kontekstong pasalaysay ang panahong iyon sa nakaraan, hindi ang kasalukuyan ng mambabasa.
- source_word: מַרְבִּיתָם
  choice: karamihan sa kanila
  rationale: Malinaw na ipinapahayag ang mas malaking bahagi o mayorya.
- source_word: שֹׁמְרִים מִשְׁמֶרֶת
  choice: patuloy na nagbabantay
  rationale: Ang participle at kaugnay na pangngalan ay nagpapahiwatig ng nagpapatuloy na tungkulin o katayuan ng pagbabantay hanggang sa panahong iyon.
- source_word: בֵּית שָׁאוּל
  choice: sambahayan ni Saul
  rationale: Ang 'sambahayan' ay natural sa modernong Tagalog at maaari pa ring sumaklaw sa pamilya, sambahayan, o pangangkanang kapakanan ni Saul; pinananatili sa talababa ang mas malawak na posibilidad.
theological_decisions:
- issue: Saklaw ng בֵּית שָׁאוּל
  choice: sambahayan ni Saul
  alternative: angkan o dinastiya ni Saul
  rationale: Hindi tiyak kung ang tinutukoy ay ang mismong sambahayan, ang angkan, o ang kapakanan ng maharlikang linya ni Saul. Iniiwasan ng pangunahing salin ang tahasang pagpili sa 'dinastiya,' at inilalahad sa talababa ang tunay na kalabuan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang anyong talaan ng talata at ang pangangkanang idyomang 'mga anak ni Benjamin,' habang ginawang natural ang aspektong nagpapatuloy sa 'patuloy na nagbabantay.'
