  to: At mula sa mga anak ni Benjamin, mga kapatid ni Saul[a], ay tatlong libo; hanggang noon, karamihan sa kanila ay nagbabantay pa rin sa sambahayan ni Saul.[b]
  rationale: Ang rebisyon ay itinutuwid ang “para sa” tungo sa “sa” upang maipahayag ang pagbabantay sa bahay/sambahayan ni Saul, gaya ng Hebreo. Pinananatili nito ang kalabuan ng “mga kapatid” at ng “sambahayan ni Saul” sa pamamagitan ng mga talababa, gayundin ang historikal na aspektong nagpapatuloy sa “hanggang noon” at “pa rin.”
