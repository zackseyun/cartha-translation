translation:
  language: tl
  text: sina Jeremias, Jahaziel, Johanan, at Jozabad na Gederatita.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “taga-Gedera”; maaaring tukuyin ng salitang Hebreo ang lugar na pinagmulan ni Jozabad o ang kaugnayan niya sa isang angkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרְמְיָה
  choice: Jeremias
  rationale: Ginamit ang nakaugaliang anyo ng pangalang ito sa mga saling Tagalog upang maging pamilyar at madaling makilala.
- source_word: יַחֲזִיאֵל
  choice: Jahaziel
  rationale: Isinulat ang pangalang Hebreo ayon sa karaniwang anyong ginagamit sa mga saling biblikal sa Filipino.
- source_word: יוֹחָנָן
  choice: Johanan
  rationale: Pinanatili ang karaniwang transliterasyon ng pangalang pantangi nang hindi labis na iniangkop o isinasalin ang kahulugan nito.
- source_word: יוֹזָבָד
  choice: Jozabad
  rationale: Ginamit ang kinikilalang transliterasyon sa Filipino ng pangalang pantangi.
- source_word: הַגְּדֵרָתִי
  choice: na Gederatita
  rationale: Pinananatili ng anyong gentiliko ang pagkakaugnay ni Jozabad sa Gedera nang hindi tiyak na nililimitahan ito sa lugar na pinagmulan lamang, sapagkat maaari rin itong tumukoy sa kaugnayang pangangkan.
