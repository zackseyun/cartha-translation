  source_fidelity: Ang “hukbo” sa pangunahing teksto ay masyadong nagpapaliit sa מַחֲנֶה, na pangunahing nangangahulugang “kampo/encampment,” bagaman maaari itong tumukoy sa isang pangkat na militar. Hindi rin dapat magkaiba ang pangunahing imahen sa teksto at sa talababa nang walang malinaw na dahilan. Ang “nabuo ang isang malaking kampo” ay maingat na naghahayag ng resultang ipinahihiwatig ng עַד nang hindi ginagawang tahasang “hukbo” ang kampo.
  naturalness: Likas at marangal ang pangungusap pagkatapos ng pagbabago. Mas malinaw ang “hanggang sa nabuo ang isang malaking kampo” kaysa “hanggang sa naging isang malaking hukbo sila,” na nagdaragdag ng tahasang panghalip at nagpapalit ng larawan mula kampo tungo sa hukbo.
  terminology: Panatilihin ang “kampo” para sa מַחֲנֶה sa kapuwa pangunahing teksto at talababa. Ang “Diyos” para sa אֱלֹהִים ay tapat sa Hebreo at pinananatili ang sadyang masidhing, maaaring “banal/makalangit,” na paghahambing.
