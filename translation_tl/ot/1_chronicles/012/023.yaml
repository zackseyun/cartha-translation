base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/023.yaml
  text: For day by day they came to David to help him[a], until there was a great camp, like the camp of God.
translation:
  language: tl
  text: Sapagkat araw-araw ay may dumarating kay David upang tulungan siya, hanggang sa nabuo ang isang malaking kampo, tulad ng kampo ng Diyos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring unawain na “tulad ng isang banal o makalangit na kampo.” Maikli at masidhi ang pahayag sa Hebreo.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Nagpapakilala ito ng paliwanag na kaugnay ng naunang salaysay; pinananatili ng “sapagkat” ang ugnayang iyon nang hindi ginagawang labis na mariin.
- source_word: לְעֶת יוֹם בְּיוֹם
  choice: araw-araw
  rationale: Likas na pariralang Filipino ito para sa paulit-ulit at nagpapatuloy na pangyayari sa magkakasunod na araw.
- source_word: יָבֹאוּ
  choice: may mga dumarating
  rationale: Ipinahihiwatig ng imperfect sa kontekstong pasalaysay ang paulit-ulit na pagdating. Natural na naipapahayag sa Filipino ng “may mga dumarating” ang patuloy na pagdami nang hindi tinutukoy ang kasarian ng mga dumating.
- source_word: עַל דָּוִיד
  choice: kay David
  rationale: Sa kasunod na layuning tulungan siya, direksiyon patungo kay David ang kahulugan ng pang-ukol, hindi pagkilos laban sa kanya.
- source_word: לְעָזְרוֹ
  choice: upang tulungan siya
  rationale: Malinaw na ipinapahayag ng infinitive construct ang layunin ng kanilang pagdating.
- source_word: עַד לְמַחֲנֶה גָדוֹל
  choice: hanggang sa naging isang malaking hukbo sila
  rationale: Ipinapakita ng parirala ang kinalabasan o antas na naabot dahil sa patuloy nilang pagdating. Ang מַחֲנֶה ay maaaring tumukoy sa kampo o sa nakahimpil na hukbo; “hukbo” ang mas natural dito dahil mga mandirigma ang tinutukoy, habang pinananatili sa talababa ang kongkretong larawang “kampo.”
- source_word: כְּמַחֲנֵה אֱלֹהִים
  choice: tulad ng hukbo ng Diyos
  rationale: Pinananatili ang tahasang pagtukoy sa Diyos at ang maikli ngunit masidhing paghahambing ng Hebreo, nang hindi ipinapaliwanag kung laki, kapangyarihan, o makalangit na katangian ang pangunahing diin.
theological_decisions:
- issue: Kahulugan ng אֱלֹהִים sa paghahambing na כְּמַחֲנֵה אֱלֹהִים
  choice: Diyos
  alternative: banal o makalangit
  rationale: Pinakanatural ang genitibong “hukbo ng Diyos.” Nananatili rito ang teolohikal na dating at posibleng alusyon ng Hebreo, sa halip na paliitin ang kahulugan sa isang pang-uri lamang.
translation_notes:
  register: Makabagong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “hukbo” sa pangunahing teksto dahil mas natural ito sa konteksto ng dumaraming mga mandirigma; inilagay sa talababa ang literal na larawang “kampo.”
