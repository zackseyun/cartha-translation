base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/029.yaml
  text: And Zadok[a], a young man mighty in valor[b], and from his father’s house twenty-two commanders.
translation:
  language: tl
  text: At si Zadok, isang binatang malakas at magiting,[a] at mula sa sambahayan ng kanyang ama ay dalawampu't dalawang pinuno.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “isang makapangyarihang mandirigma.”'
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring isalin: “mula sa angkan ng kanyang ama, dalawampu''t dalawang pinuno.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: צָדוֹק
  choice: Zadok
  rationale: Pangalang pantangi; tinumbasan sa pamamagitan ng tuwirang transliterasyon mula sa Hebreo.
- source_word: נַעַר
  choice: kabataan
  rationale: Sa kontekstong militar, tumutukoy ito sa isang lalaking bata pa ang edad, hindi sa isang lingkod. Pinananatili ng “kabataan” ang diin sa kanyang murang edad.
- source_word: גִּבּוֹר חָיִל
  choice: magiting sa labanan
  rationale: Ipinahahayag ng parirala ang lakas at kagitingan, lalo na sa kontekstong militar. Likas ito sa makabagong Tagalog nang hindi labis na nililimitahan ang kahulugan sa isang tiyak na ranggo.
- source_word: בֵית אָבִיו
  choice: sambahayan ng kanyang ama
  rationale: Pinananatili nito ang larawan ng Hebreong “bahay ng ama,” na maaaring tumukoy sa sambahayan, linya ng pamilya, o angkan sa panig ng ama.
- source_word: שָׂרִים
  choice: mga pinuno
  rationale: Tumutukoy ito sa mga taong may kapangyarihan o pamumuno. Ang “mga pinuno” ay malinaw at hindi nagdaragdag ng isang tiyak na ranggong militar na hindi tahasang nakasaad.
- source_word: עֶשְׂרִים וּשְׁנָיִם
  choice: dalawampu't dalawa
  rationale: Tuwirang salin ng bilang sa likas na anyong Tagalog.
- source_word: וְ
  choice: At
  rationale: Pinananatili ang pagkakaugnay nito sa naunang talaan at ang sunod-sunod na kayarian ng pinagmulang teksto.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang anyong parang talaan ng Hebreo at ang bahagyang putol na sintaks nito, sa halip na magdagdag ng pandiwang wala sa teksto. Ginamit ang “sambahayan” sa pangunahing teksto at inilagay sa talababa ang mas malawak na kahulugang “angkan.”
