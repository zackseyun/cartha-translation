base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/007.yaml
  text: Elkanah[a], Isshiah, Azarel, Joezer, and Jashobeam, the Korahites.
translation:
  language: tl
  text: Sina Elkana, Yishiyahu, Azarel, Joezer, at Jashobeam—ang mga Korahita.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “mga inapo ni Korah.”
    reason: Ipinakikita ang mas malinaw ngunit mas interpretibong paraan ng pagpapahayag sa katawagang pang-angkan na הַקָּרְחִים.
lexical_decisions:
- source_word: אֶלְקָנָה
  choice: Elkana
  rationale: Pangngalang pantangi; isinalin sa baybay na madaling basahin sa Filipino habang pinananatili ang anyong Hebreo.
- source_word: יִשִּׁיָּהוּ
  choice: Yishiyahu
  rationale: Tuwirang transliterasyon ng pangalang Hebreo; pinananatili ang hulaping -yahu at iniiwasang ipagkamali ito sa ibang pangalan.
- source_word: עֲזַרְאֵל
  choice: Azarel
  rationale: Pangngalang pantangi na tuwirang isinatitik ayon sa anyong Hebreo.
- source_word: יוֹעֶזֶר
  choice: Joezer
  rationale: Ginamit ang nakaugaliang anyong biblikal na Joezer, na natural basahin sa Filipino.
- source_word: יָשָׁבְעָם
  choice: Jashobeam
  rationale: Isinatitik ang mismong anyo ng pangalan sa talatang ito at hindi ang ibang anyong matatagpuan sa ibang teksto.
- source_word: הַקָּרְחִים
  choice: ang mga Korahita
  rationale: Pangmaramihang katawagan ito sa angkan o pangkat na kaugnay ni Korah. Natural sa Filipino ang hulaping -ita para sa kasapi ng isang angkan o pangkat.
theological_decisions: []
translation_notes:
  register: Maikli at marangal na talaan ng mga pangalan. Ginamit ang “Sina” upang likas na ipakilala sa Filipino ang maraming pangalan, at em dash upang malinaw na iugnay silang lahat sa katawagang “mga Korahita.” Inilagay ang talababa sa katawagang tinutukoy nito.
