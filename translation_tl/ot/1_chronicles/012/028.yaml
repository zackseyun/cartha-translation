  yaml_path: translation/ot/1_chronicles/012/028.yaml
  text: and Jehoiada[a], the leader of Aaron, and with him three thousand seven hundred.
translation:
  language: tl
  text: at si Joiada, ang pinuno ng mga Aaronita, kasama niya ang tatlong libo at pitong daan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וִיהוֹיָדָע
  choice: at si Joiada
  rationale: Isinasalin ang pang-ugnay na ו bilang “at” upang ipagpatuloy ang talaan, at ginagamit ang karaniwang anyong Filipino ng pangalang Jehoiada.
- source_word: הַנָּגִיד
  choice: ang pinuno
  rationale: Ang נָגִיד ay tumutukoy sa isang pinuno o namumuno; malinaw at natural sa makabagong Filipino ang “pinuno” nang hindi nagpapahiwatig na siya ay hari.
- source_word: לְאַהֲרֹן
  choice: ng sambahayan ni Aaron
  rationale: Ipinahihiwatig ng לְ ang kaugnayan o kinatawang papel ni Joiada sa angkan ng mga paring mula kay Aaron. Idinagdag ang “sambahayan” para maging malinaw sa Filipino ang ipinahihiwatig na ugnayan, habang itinatala sa talababa ang mas literal na anyo.
- source_word: וְעִמּוֹ
  choice: kasama ang
  rationale: Natural na ipinakikilala sa Filipino ng “kasama ang” ang bilang ng mga lalaking kasama ni Joiada; hindi na kailangang ulitin ang panghalip na “niya.”
- source_word: שְׁלֹשֶׁת אֲלָפִים וּשְׁבַע מֵאוֹת
  choice: 3,700 tauhan
  rationale: Pinananatili ang eksaktong bilang. Ang “tauhan” ay nilinaw mula sa konteksto ng talaan ng mga lalaking sumama kay David.
theological_decisions:
- issue: Ang ugnayang ipinahahayag ng לְאַהֲרֹן
  choice: ang pinuno ng sambahayan ni Aaron
  alternative: ang pinuno para kay Aaron
  rationale: Maaaring ipakahulugan ang לְ bilang kaugnayan o pagkatawan. Ipinapahayag ng pangunahing salin ang kontekstuwal na kahulugan na ang tinutukoy ay ang sambahayan o angkan ng mga paring Aaronita, ngunit pinananatili sa talababa ang mas literal at tunay na posibleng pagbasa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang numerong 3,700 para madaling mabasa ang bilang; ang “sambahayan” at “tauhan” ay kontekstuwal na paglilinaw, hindi pagbabago sa diwa.
