source:
  edition: WLC
  text: כָּל אֵ֜לֶּה אַנְשֵׁ֣י מִלְחָמָה֮ עֹדְרֵ֣י מַעֲרָכָה֒ בְּ/לֵבָ֤ב שָׁלֵם֙ בָּ֣אוּ חֶבְר֔וֹנָ/ה לְ/הַמְלִ֥יךְ אֶת דָּוִ֖יד עַל כָּל יִשְׂרָאֵ֑ל וְ֠/גַם כָּל שֵׁרִ֧ית יִשְׂרָאֵ֛ל לֵ֥ב אֶחָ֖ד לְ/הַמְלִ֥יךְ אֶת דָּוִֽיד־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/039.yaml
  text: All these were men of war[a], arrayed for battle, who came to Hebron with a whole heart to make David king over all Israel; and also all the rest of Israel were of one heart to make David king.
translation:
  language: tl
  text: Ang lahat ng ito ay mga lalaking mandirigma na nakahanay para sa labanan; buong puso silang pumunta sa Hebron upang gawing hari si David ng buong Israel. Ang lahat ng iba pang Israelita[a] ay nagkaisang-loob ding gawing hari si David.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang lahat ng nalalabi sa Israel.”
    reason: Ipinakikita ang mas literal na katumbas ng שְׁאֵרִית, na maaari ring isaling “nalalabi,” samantalang mas angkop sa konteksto ang “iba pang Israelita.”
lexical_decisions:
- source_word: אַנְשֵׁי מִלְחָמָה
  choice: mga lalaking mandirigma
  rationale: Tuwirang ipinahahayag ng pariralang Hebreo ang mga lalaking nauukol sa digmaan. Pinananatili ng salin ang panlalaking anyo at malinaw na diwang militar.
- source_word: עֹדְרֵי מַעֲרָכָה
  choice: nakahanay para sa labanan
  rationale: Ipinahihiwatig ng participial na parirala ang pagbuo o pag-aayos ng hanay-panlaban. Natural sa modernong Filipino ang saling ito at pinananatili nito ang larawan ng pormasyong militar.
- source_word: בְּלֵבָב שָׁלֵם
  choice: buong puso
  rationale: Ipinahahayag ng Hebreo ang buo at hindi hating kalooban. Ang 'buong puso' ay natural na idyomang Filipino na nananatili sa larawan ng puso.
- source_word: בָּאוּ חֶבְרוֹנָה
  choice: pumunta sa Hebron
  rationale: Ang hulaping direksiyonal sa Hebreo ay nagpapakita ng pagkilos patungo sa Hebron. Ang 'pumunta' ang likas na salaysay sa Filipino.
- source_word: לְהַמְלִיךְ אֶת דָּוִיד
  choice: gawing hari si David
  rationale: Ang Hiphil ng מלך ay nangangahulugang itatag o iluklok ang isang tao bilang hari. Hindi idinaragdag ng salin ang seremonya ng pagpuputong na hindi tahasang binanggit.
- source_word: עַל כָּל יִשְׂרָאֵל
  choice: sa buong Israel
  rationale: Sa Filipino, ang 'hari sa buong Israel' ay natural na nagpapahayag ng paghahari ni David sa kabuuan ng bansa.
- source_word: כָּל שֵׁרִית יִשְׂרָאֵל
  choice: ang lahat ng iba pa sa Israel
  rationale: Bagaman maaaring mangahulugan ang שֵׁרִית ng 'nalalabi,' sa kontekstong ito tinutukoy nito ang mga Israelitang hindi kabilang sa mga naunang itinala. Iniiwasan ng 'iba pa' ang di-kinakailangang teknikal o propetikong pahiwatig.
- source_word: לֵב אֶחָד
  choice: nagkaisa ... sa layunin
  rationale: Literal na 'iisang puso' ang Hebreo at tumutukoy sa nagkakaisang hangarin. Ginawang natural sa Filipino ang pangungusap habang pinananatili ang ideya ng sama-samang layunin.
theological_decisions:
- issue: Posibleng teolohikal na pahiwatig ng שֵׁרִית bilang 'nalabi' o 'natira'
  choice: ang lahat ng iba pa sa Israel
  alternative: ang lahat ng nalalabi sa Israel
  rationale: Sa agarang konteksto, isa itong buod ng malawak na pagsuporta ng bansa kay David, hindi isang tahasang pagtukoy sa propetikong konsepto ng isang teolohikal na 'nalabi.' Pinananatili sa talababa ang leksikal na alternatibo.
- issue: Ugnayan ng בְּלֵבָב שָׁלֵם at לֵב אֶחָד
  choice: buong puso ... nagkaisa rin sa layunin
  alternative: may pusong buo ... may iisang puso
  rationale: Pinananatili ng salin ang pagkakaiba ng ganap na katapatan ng mga mandirigma at ng nagkakaisang hangarin ng ibang Israelita, nang hindi ipinipilit na eksaktong magkapareho ang dalawang parirala.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang 'mga lalaking mandirigma' upang mapanatili ang tahasang panlalaking anyo ng Hebreo, at ang semicolon upang maipakita ang magkaugnay ngunit magkaibang pangkat. Ang 'buong puso' ay likas na idyoma; ang 'nagkaisa ... sa layunin' ay umiwas sa mas pilit na pag-uulit ng 'puso' habang pinananatili ang kahulugan ng nagkakaisang kalooban.
