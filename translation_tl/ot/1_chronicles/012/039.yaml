revisions:
- from: Ang lahat ng ito ay mga lalaking mandirigma na nakahanay para sa labanan. Buong puso silang pumunta sa Hebron upang gawing hari si David sa buong Israel; at ang lahat ng iba pa sa Israel[a] ay nagkaisa rin sa layuning gawing hari si David.
  to: Ang lahat ng ito ay mga lalaking mandirigma na nakahanay para sa labanan; buong puso silang pumunta sa Hebron upang gawing hari si David ng buong Israel. Ang lahat ng iba pang Israelita[a] ay nagkaisang-loob ding gawing hari si David.
