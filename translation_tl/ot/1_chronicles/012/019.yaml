language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/ר֣וּחַ לָבְשָׁ֗ה אֶת עֲמָשַׂי֮ רֹ֣אשׁ ה/שלושים לְ/ךָ֤ דָוִיד֙ וְ/עִמְּ/ךָ֣ בֶן יִשַׁ֔י שָׁל֨וֹם שָׁל֜וֹם לְ/ךָ֗ וְ/שָׁלוֹם֙ לְ/עֹ֣זְרֶ֔/ךָ כִּ֥י עֲזָרְ/ךָ֖ אֱלֹהֶ֑י/ךָ וַ/יְקַבְּלֵ֣/ם דָּוִ֔יד וַֽ/יִּתְּנֵ֖/ם בְּ/רָאשֵׁ֥י הַ/גְּדֽוּד־־׀׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/019.yaml
  text: And the Spirit clothed Amasai, chief of the Thirty, and he said, “Yours are we, David, and with you, son of Jesse! Peace, peace to you, and peace to your helpers, for your God helps you.” Then David received them and made them chiefs of the troops.
translation:
  language: tl
  text: At binalot ng Espiritu si Amasai[a], ang pinuno ng Tatlumpu, at sinabi niya, “Kami’y iyo, David, at kasama mo kami, anak ni Jesse! Kapayapaan, kapayapaan sa iyo, at kapayapaan sa mga tumutulong sa iyo[b], sapagkat tinutulungan ka ng iyong Diyos[c].” Tinanggap sila ni David at itinalaga silang mga pinuno ng pangkat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “isang espiritu ang bumalot kay Amasai” o “nilukuban ng Espiritu si Amasai.” Literal sa Hebreo, “binalot ng espiritu si Amasai.”
    reason: alternative_reading
  - marker: b
    text: Maaari ring “sa tumutulong sa iyo.” Isahan ang anyo sa Hebreo ngunit maaari itong gamitin sa pangkatang diwa.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “sapagkat tinulungan ka na ng iyong Diyos.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרוּחַ לָבְשָׁה
  choice: binalot ng Espiritu
  rationale: Pinananatili ang tahasang metapora ng Hebreo na ang espiritu ay ‘nagsuot’ o ‘bumalot’ kay Amasai. Ginamit ang malaking titik dahil malamang na Espiritu ng Diyos ang tinutukoy, ngunit inilalahad sa talababa ang tunay na kalabuan ng parirala.
- source_word: אֶת עֲמָשַׂי
  choice: si Amasai
  rationale: Pangalan ng taong tuwirang layon ng pandiwa; isinalin ayon sa karaniwang anyo ng pangalan.
- source_word: רֹאשׁ הַשְּׁלֹשִׁים
  choice: ang pinuno ng Tatlumpu
  rationale: Ang רֹאשׁ ay ‘ulo’ o ‘pinuno,’ at malamang na pangalan ng isang kinikilalang pangkat-militar ang ‘Tatlumpu.’
- source_word: לְךָ דָוִיד
  choice: Kami’y iyo, David
  rationale: Pinananatili ang maikli at mariing pormula ng katapatan habang gumagamit ng natural na ayos sa modernong Tagalog.
- source_word: וְעִמְּךָ בֶן יִשַׁי
  choice: at kasama mo kami, anak ni Jesse
  rationale: Ang pariralang Hebreo ay walang tahasang pandiwa; idinagdag ang ‘kami’ upang maging malinaw at natural sa Tagalog nang hindi dinaragdagan ang diwa.
- source_word: שָׁלוֹם שָׁלוֹם לְךָ
  choice: Kapayapaan, kapayapaan sa iyo
  rationale: Pinananatili ang pag-uulit na nagbibigay-diin sa pagpapala.
- source_word: וְשָׁלוֹם לְעֹזְרֶךָ
  choice: at kapayapaan sa mga tumutulong sa iyo
  rationale: Bagaman isahan ang anyong Hebreo, maaari itong tumukoy nang pangkatan sa mga tagasuporta ni David; ang maramihan ay natural sa konteksto.
- source_word: כִּי עֲזָרְךָ אֱלֹהֶיךָ
  choice: sapagkat tinutulungan ka ng iyong Diyos
  rationale: Ipinahahayag ang patuloy na pagtulong ng Diyos bilang batayan ng pagpapala, habang itinatala sa talababa ang posibleng aspektong ganap.
- source_word: וַיְקַבְּלֵם
  choice: tinanggap sila
  rationale: Tumpak na saklaw ng קבל ang pagtanggap o pagkilala sa kanila.
- source_word: וַיִּתְּנֵם בְּרָאשֵׁי הַגְּדוּד
  choice: ginawa silang mga pinuno ng mga pangkat ng hukbo
  rationale: Ipinahahayag ng idyoma ang pagtatalaga sa pamumuno; ang גְּדוּד ay maaaring pangkat, hukbo, o pangkat na sumasalakay.
theological_decisions:
- issue: Kung ang רוּחַ ay tumutukoy sa Espiritu ng Diyos o sa isang espiritu lamang
  choice: Espiritu
  alternative: isang espiritu
  rationale: Ang konteksto sa Mga Cronica at ang idyomang ‘bumalot’ sa isang taong nagsasalita sa ilalim ng banal na pagkilos ay malakas na nagpapahiwatig sa Espiritu ng Diyos. Gayunman, walang pantukoy ang salitang Hebreo, kaya pinanatili sa talababa ang alternatibo.
- issue: Kung ang עֲזָרְךָ ay kasalukuyan o ganap na pagtulong
  choice: tinutulungan ka
  alternative: tinulungan ka na
  rationale: Ang ganap na pandiwang Hebreo ay maaaring ilarawan ang naranasan nang tulong o ang matatag at patuloy na pagtulong ng Diyos. Mas angkop sa agarang pahayag ang kasalukuyang diwa, ngunit hindi inaalis ang alternatibo.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang makatang pag-uulit ng ‘Kapayapaan’ at ang metaporang ‘binalot ng Espiritu,’ habang gumamit ng natural na pormang ‘Kami’y iyo’ para sa pahayag ng katapatan.
