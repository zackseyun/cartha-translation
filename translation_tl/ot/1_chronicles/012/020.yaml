revisions:
- from: May ilan din mula sa Manases na pumanig kay David[a] nang sumama siya sa mga Filisteo upang makipagdigma laban kay Saul. Ngunit hindi nila natulungan ang mga Filisteo, sapagkat matapos mag-usap-usap, pinaalis si David ng mga pinuno ng mga Filisteo. Sinabi nila, “Baka pumanig siya sa panginoon niyang si Saul, kapalit ng aming mga ulo.”[b]
  to: May ilan din mula sa Manases na pumanig kay David[a] nang sumama siya sa mga Filisteo upang makipagdigma laban kay Saul. Ngunit hindi nila tinulungan ang mga Filisteo, sapagkat matapos magsanggunian, pinaalis si David ng mga pinuno ng mga Filisteo. Sinabi nila, “Baka pumanig siya sa panginoon niyang si Saul, sa panganib ng aming buhay.”[b]
