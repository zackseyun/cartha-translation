  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וּ/מִֽ/מְּנַשֶּׁ֞ה נָפְל֣וּ עַל דָּוִ֗יד בְּ/בֹא֨/וֹ עִם פְּלִשְׁתִּ֧ים עַל שָׁא֛וּל לַ/מִּלְחָמָ֖ה וְ/לֹ֣א עֲזָרֻ֑/ם כִּ֣י בְ/עֵצָ֗ה שִׁלְּחֻ֜/הוּ סַרְנֵ֤י פְלִשְׁתִּים֙ לֵ/אמֹ֔ר בְּ/רָאשֵׁ֕י/נוּ יִפּ֖וֹל אֶל אֲדֹנָ֥י/ו שָׁאֽוּל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/020.yaml
  text: Some from Manasseh also defected to David when he came with the Philistines against Saul for battle[a], though they did not help them, because the lords of the Philistines, after taking counsel, sent him away, saying[b], “He may defect to his master Saul at the cost of our heads.”
translation:
  language: tl
  text: May ilan din mula sa Manases na pumanig kay David[a] nang sumama siya sa mga Filisteo upang makipagdigma laban kay Saul. Ngunit hindi nila tinulungan ang mga Filisteo, sapagkat matapos magsanggunian, pinaalis si David ng mga pinuno ng mga Filisteo. Sinabi nila, “Baka pumanig siya sa panginoon niyang si Saul, sa panganib ng aming buhay.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “nahulog kay David”; isang idyomang Hebreo na nangangahulugang lumipat o pumanig sa kaniya.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “sa pamamagitan ng aming mga ulo”; isang idyomang nangangahulugang sa panganib o kapalit ng aming buhay.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִמְּנַשֶּׁה
  choice: May ilan din mula sa Manases
  rationale: Ginagawang hayag ang ipinahihiwatig na partitive—ilan mula sa lipi ni Manases—at pinananatili ng “din” ang dagdag na diwa ng pang-ugnay.
- source_word: נָפְלוּ עַל דָּוִיד
  choice: pumanig kay David
  rationale: Ang נפל על sa kontekstong militar at pampolitika ay idyomang tumutukoy sa paglipat o pagpanig sa isang panig, hindi sa literal na pagkahulog.
- source_word: בְּבֹאוֹ עִם פְּלִשְׁתִּים עַל שָׁאוּל לַמִּלְחָמָה
  choice: nang sumama siya sa mga Filisteo upang makipagdigma laban kay Saul
  rationale: Likas sa Tagalog ang “sumama” para sa pagdating o paglakad na kasama ng mga Filisteo; malinaw na ipinahahayag ng “upang makipagdigma laban” ang layunin at masamang direksiyon ng parirala.
- source_word: וְלֹא עֲזָרֻם
  choice: Ngunit hindi nila natulungan ang mga Filisteo
  rationale: Ang hulaping pangmaramihan ay pinakamalamang na tumutukoy sa mga Filisteo. Inuulit ang pangngalan sa halip na gumamit ng malabong panghalip na “sila.”
- source_word: כִּי בְעֵצָה
  choice: sapagkat matapos mag-usap-usap
  rationale: Ipinahahayag nang natural ang pagpapasiya matapos ang sama-samang pagsangguni, nang hindi dinaragdagan ang teksto ng pormal na kasunduang hindi tahasang nakasaad.
- source_word: שִׁלְּחֻהוּ
  choice: pinaalis si David
  rationale: Ang Piel ng שלח dito ay pagpapauwi o pagpapaalis kay David mula sa hukbo; ang pagbanggit sa pangalan ay nag-aalis ng kalabuan sa Tagalog.
- source_word: סַרְנֵי פְלִשְׁתִּים
  choice: mga pinuno ng mga Filisteo
  rationale: Malinaw at marangal na katumbas ito ng natatanging titulong ginagamit para sa mga tagapamahalang Filisteo, nang hindi sila labis na tinutukoy bilang mga kumandante lamang.
- source_word: בְּרָאשֵׁינוּ
  choice: kapalit ng aming mga ulo
  rationale: Pinananatili ang matingkad na larawan ng Hebreong idyoma, na nangangahulugang sa halaga ng kanilang buhay o sa ikapapahamak nila.
- source_word: יִפּוֹל אֶל אֲדֹנָיו שָׁאוּל
  choice: Baka pumanig siya sa panginoon niyang si Saul
  rationale: Ang “baka” ay natural na naghahatid ng pangambang ipinahihiwatig ng imperfect; inuulit ng “pumanig” ang pampolitika at militar na diwa ng נפל. Ang “panginoon” ay tumutukoy sa nakatataas na pinaglilingkuran, hindi sa banal na titulo.
theological_decisions:
- issue: Kahulugan ng אֲדֹנָיו para kay Saul
  choice: panginoon niyang si Saul
  alternative: amo niyang si Saul
  rationale: Pinananatili ang relasyon ng katapatan at paglilingkod sa isang hari o nakatataas nang hindi ito ginagawang teolohikong titulo; mas angkop sa marangal na salaysay ang “panginoon” kaysa “amo.”
- issue: Tinutukoy ng hulapi sa עֲזָרֻם
  choice: ang mga Filisteo
  alternative: hindi tukoy na “sila”
  rationale: Ito ang pinakamalapit at pinakanatural na maramihang tinutukoy sa konteksto, ngunit isa itong paglilinaw na gramatikal at hindi doktrinal.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Hinati sa maiikling pangungusap ang mahabang Hebreong sintaks upang madaling maunawaan, habang pinananatili ang ugnayang sanhi at ang pampolitika-militar na pag-uulit ng “pumanig.”
