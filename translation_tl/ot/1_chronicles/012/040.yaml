  yaml_path: translation/ot/1_chronicles/012/040.yaml
  text: They were there with David for three days[a], eating and drinking, because their brothers had prepared for them.
translation:
  language: tl
  text: Naroon sila kasama ni David sa loob ng tatlong araw, kumakain at umiinom, sapagkat naghanda para sa kanila ang kanilang mga kapatid.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga kaangkan” o “mga kamag-anak.” Literal sa Hebreo ang “mga kapatid,” ngunit sa kontekstong ito maaari itong tumukoy nang mas malawak sa mga kabilang sa iisang angkan o lipi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ שָׁם
  choice: Naroon sila
  rationale: Likas at maikli itong salin ng payak na pagsasalaysay na nagsasaad na nasa lugar na iyon sila.
- source_word: עִם דָּוִיד
  choice: kasama ni David
  rationale: Tuwirang ipinahahayag ng עִם ang pakikisama o pagiging kasama.
- source_word: יָמִים שְׁלוֹשָׁה
  choice: nang tatlong araw
  rationale: Ang pariralang Hebreo ay nagsasaad ng tagal; natural itong ipinahahayag sa modernong Tagalog sa pamamagitan ng “nang tatlong araw.”
- source_word: אֹכְלִים וְשׁוֹתִים
  choice: kumakain at umiinom
  rationale: Pinananatili ang dalawang tahasang kilos at ang patuloy na gawain sa loob ng panahong iyon, sa halip na ibuod bilang “nagpipista.”
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala nito ang dahilan ng kanilang pagkain at pag-inom; ang “sapagkat” ay malinaw at angkop sa marangal na rehistro.
- source_word: הֵכִינוּ לָהֶם
  choice: naghanda para sa kanila
  rationale: Ang Hiphil ng כון ay nangangahulugang maghanda o gawing handa. Hindi tahasang tinutukoy sa sugnay ang bagay na inihanda, kaya hindi ito dinagdagan sa pangunahing teksto.
- source_word: אֲחֵיהֶם
  choice: kanilang mga kapatid
  rationale: Pinananatili ang literal na katawagang panlalaking pangkamag-anakan, habang inilalahad sa talababa ang posibleng mas malawak na kahulugan nito sa kontekstong lipi at angkan.
theological_decisions:
- issue: Saklaw ng kahulugan ng אֲחֵיהֶם
  choice: kanilang mga kapatid
  alternative: kanilang mga kaangkan o kamag-anak
  rationale: Walang doktrinal na usaping dapat lutasin dito. Pinananatili ng pangunahing teksto ang literal na ugnayang “mga kapatid,” ngunit hindi itinatanggi ang mas malawak na panlipunan o panliping gamit ng salita sa konteksto.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang “Naroon sila” para sa natural na daloy ng salaysay at iniwasang idagdag ang “pagkain” bilang tahasang layon ng “naghanda,” yamang ipinahihiwatig lamang ito ng konteksto. Inilagay ang talababa pagkatapos ng “mga kapatid,” ang salitang talagang nililinaw nito.
