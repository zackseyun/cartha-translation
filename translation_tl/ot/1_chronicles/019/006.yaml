language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יִּרְאוּ֙ בְּנֵ֣י עַמּ֔וֹן כִּ֥י הִֽתְבָּאֲשׁ֖וּ עִם דָּוִ֑יד וַ/יִּשְׁלַ֣ח חָ֠נוּן וּ/בְנֵ֨י עַמּ֜וֹן אֶ֣לֶף כִּכַּר כֶּ֗סֶף לִ/שְׂכֹּ֣ר לָ֠/הֶם מִן אֲרַ֨ם נַהֲרַ֜יִם וּ/מִן אֲרַ֤ם מַעֲכָה֙ וּ/מִ/צּוֹבָ֔ה רֶ֖כֶב וּ/פָרָשִֽׁים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/006.yaml
  text: When the Ammonites saw that they had become odious to David[a], Hanun and the Ammonites sent a thousand talents of silver to hire for themselves chariots and horsemen from Aram-naharaim, from Aram-maacah[b], and from Zobah.
translation:
  language: tl
  text: Nang makita ng mga Ammonita na naging kasuklam-suklam sila kay David,[a] nagpadala si Hanun at ang mga Ammonita ng isang libong talentong pilak upang umupa para sa kanilang sarili ng mga karwahe at mangangabayo mula sa Aram-naharaim,[b] Aram-maaca, at Zoba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “naging kasuklam-suklam”—literal na “ginawa nilang mabaho ang kanilang sarili sa paningin ni David,” isang idyoma para sa pagiging kasuklam-suklam o lubhang nakayayamot sa isang tao.
    reason: lexical_alternative
  - marker: b
    text: Ang Aram-naharaim ay karaniwang inuunawang “Aram ng Dalawang Ilog,” samakatuwid ay Mesopotamia.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּרְאוּ
  choice: Nang makita
  rationale: Pinananatili ang karaniwang kahulugan ng ראה at likas ding nagpapahiwatig sa Filipino na naunawaan nila ang kanilang kalagayan.
- source_word: בְּנֵי עַמּוֹן
  choice: mga Ammonita
  rationale: Likas na katawagan sa pangkat-etniko sa modernong Filipino kaysa sa literal na “mga anak ni Ammon.”
- source_word: הִתְבָּאֲשׁוּ עִם דָּוִיד
  choice: naging kamuhi-muhi sila kay David
  rationale: Ipinahahayag ang idyomatikong diwa na naging lubhang kasuklam-suklam o nakayayamot sila kay David, habang inilalagay sa talababa ang literal na larawang “nagpabaho.”
- source_word: וַיִּשְׁלַח
  choice: nagpadala
  rationale: Ang tuwirang layon ay ang pilak, kaya tumutukoy ito sa pagpapadala ng bayad.
- source_word: חָנוּן וּבְנֵי עַמּוֹן
  choice: si Hanun at ang mga Ammonita
  rationale: Pinananatili si Hanun at ang kanyang bayan bilang magkasamang simuno, gaya ng Hebreo.
- source_word: אֶלֶף כִּכַּר כֶּסֶף
  choice: isang libong talentong pilak
  rationale: Pinananatili ang sinaunang yunit ng timbang nang hindi gumagawa ng di-tiyak na modernong conversion.
- source_word: לִשְׂכֹּר לָהֶם
  choice: upang umupa para sa kanilang sarili
  rationale: Isinasama ang diwa ng לָהֶם na ang pag-upa ay para sa sarili nilang kapakinabangan o paggamit.
- source_word: אֲרַם נַהֲרַיִם
  choice: Aram-naharaim
  rationale: Pinananatili bilang pangalang-heograpiko; ipinaliliwanag sa talababa ang tradisyonal na kahulugan nito.
- source_word: אֲרַם מַעֲכָה
  choice: Aram-maaca
  rationale: Ginagamit bilang tambalang pangalang panrehiyon, na may baybay na madaling basahin sa Filipino.
- source_word: מִצּוֹבָה
  choice: mula sa Zoba
  rationale: Transliterasyon ng pangalang-lugar na צובה.
- source_word: רֶכֶב
  choice: mga karwahe
  rationale: Bagaman anyong isahan at maaaring kolektibo ang salita, natural sa Filipino ang maramihan para sa hukbong inuupahan.
- source_word: וּפָרָשִׁים
  choice: at mangangabayo
  rationale: Konkretong tawag sa mga nakasakay na kawal at likas na kapares ng “mga karwahe.”
theological_decisions: []
translation_notes:
  register: 'Modernong Filipino na marangal ngunit madaling maunawaan. Pinanatili ang mga sinaunang pangalang-lugar at yunit ng timbang; isinalin nang idyomatiko ang metaporang Hebreo ngunit inilagay sa talababa ang literal na larawan. Itinama rin ang pagkakaugnay ng mga marker: ang tala tungkol sa idyoma ay nasa “kay David,” at ang tala tungkol sa Aram-naharaim ay nasa mismong pangalang iyon.'
