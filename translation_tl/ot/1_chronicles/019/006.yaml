revisions:
- from: Nang makita ng mga Ammonita na naging kamuhi-muhi sila kay David,[a] nagpadala si Hanun at ang mga Ammonita ng isang libong talentong pilak upang umupa para sa kanilang sarili ng mga karwahe at mangangabayo mula sa Aram-naharaim,[b] Aram-maaca, at Zoba.
  to: Nang makita ng mga Ammonita na naging kasuklam-suklam sila kay David,[a] nagpadala si Hanun at ang mga Ammonita ng isang libong talentong pilak upang umupa para sa kanilang sarili ng mga karwahe at mangangabayo mula sa Aram-naharaim,[b] Aram-maaca, at Zoba.
  rationale: Pinalitan ang hindi gaanong natural na 'kamuhi-muhi' ng 'kasuklam-suklam' at inayos ang literal na paliwanag sa talababa upang malinaw na ang mga Ammonita ang naglagay sa kanilang sarili sa masamang katayuan sa paningin ni David. Walang binagong kahulugan ng talata, mga pangalan, sukat, o mga ankla ng talababa.
