base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/017.yaml
  text: When it was reported to David[a], he gathered all Israel, crossed the Jordan, came against them, and drew up in battle formation against them. Then David drew up for battle to meet Aram, and they fought with him.
translation:
  language: tl
  text: Nang maibalita ito kay David, tinipon niya ang buong Israel, tumawid sa Jordan, lumapit sa kanila, at pumuwesto laban sa kanila. Pagkatapos, pumuwesto si David upang salubungin ang Aram sa labanan, at nakipaglaban sila sa kanya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “at nilabanan nila siya.” Literal na gumagamit ang Hebreo ng pananalitang “nakipaglaban sila sa kanya,” ngunit malinaw sa konteksto na si David ang kanilang kalaban.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֻּגַּד לְדָוִיד
  choice: Nang maibalita ito kay David
  rationale: Pinananatili ang balintiyak at di-tiyak na tagapagbalita ng Hebreo; ang “ito” ay likas sa Tagalog at tumutukoy sa naunang balita nang hindi nagdaragdag ng tahasang paksa.
- source_word: וַיֶּאֱסֹף אֶת כָּל יִשְׂרָאֵל
  choice: tinipon niya ang buong Israel
  rationale: Ang “tinipon” ay malinaw at natural, at maaari ring magpahiwatig ng pagtitipon ng hukbo nang hindi iyon labis na ipinapaliwanag.
- source_word: וַיַּעֲבֹר הַיַּרְדֵּן
  choice: tumawid sa Jordan
  rationale: Tuwiran at natural na salin ng kilos at ng pangalang heograpiko.
- source_word: וַיָּבֹא אֲלֵיהֶם
  choice: lumapit upang harapin sila
  rationale: Ipinapakita ang paglapit sa kanila at ang mapanlabang konteksto, ngunit hindi ginagamit ang di-likas na “dumating laban sa kanila.”
- source_word: וַיַּעֲרֹךְ אֲלֵיהֶם
  choice: inayos ang kanyang mga hukbo laban sa kanila
  rationale: Sa kontekstong militar, ang ערך ay tumutukoy sa pag-aayos o paghanay para sa labanan. Idinagdag ang “mga hukbo” bilang likas na ipinahihiwatig na layon sa Tagalog.
- source_word: וַיַּעֲרֹךְ דָּוִיד לִקְרַאת אֲרָם מִלְחָמָה
  choice: inayos ni David ang kanyang mga hukbo para makipaglaban sa Aram
  rationale: Pinananatili ang pag-uulit ng ערך at malinaw na inilalahad ang paghahanda sa pakikipaglaban; ang לִקְרַאת ay nauunawaan dito bilang pagharap o pagsalubong sa Aram sa labanan.
- source_word: אֲרָם
  choice: Aram
  rationale: Pinananatili ang pangalang Hebreo at iniiwasang ipalit ang mas huling pangalang heopolitikal na “Syria” o ang interpretatibong “mga Arameo.”
- source_word: וַיִּלָּחֲמוּ עִמּוֹ
  choice: nakipaglaban sila sa kanya
  rationale: Natural sa Tagalog at malapit sa literal na gamit ng עִם (“kasama/sa”), habang malinaw sa konteksto na ang ibig sabihin ay pakikipaglaban laban kay David.
theological_decisions: []
translation_notes:
  register: Makabagong Filipino na marangal at madaling maunawaan. Ginamit ang “hukbo” upang maipahayag nang natural ang militar na diwa ng ערך, habang pinanatili ang Aram at ang bahagyang kalabuan ng huling parirala sa pamamagitan ng talababa.
