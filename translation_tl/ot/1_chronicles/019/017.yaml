  terminology: Wasto ang “David,” “Israel,” “Jordan,” at “Aram.” Ang “nakipaglaban sila sa kanya” ay nananatiling malapit sa anyong Hebreo at malinaw na adversatibo sa konteksto; ang talababa ay angkop upang ipaliwanag ito.
