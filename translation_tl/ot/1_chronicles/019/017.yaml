revisions:
- from: Nang maibalita ito kay David, tinipon niya ang buong Israel, tumawid sa Jordan, lumapit upang harapin sila, at inayos ang kanyang mga hukbo laban sa kanila. Pagkatapos, inayos ni David ang kanyang mga hukbo para makipaglaban sa Aram, at nakipaglaban sila sa kanya.[a]
  to: Nang maibalita ito kay David, tinipon niya ang buong Israel, tumawid sa Jordan, lumapit sa kanila, at pumuwesto laban sa kanila. Pagkatapos, pumuwesto si David upang salubungin ang Aram sa labanan, at nakipaglaban sila sa kanya.[a]
  rationale: Inalis ang mga idinagdag na tahasang “hukbo” at ang pagmamay-aring “kanyang” upang hindi higitan ang ipinahahayag ng Hebreo. Pinanatili ang militar na diwa ng ערך sa “pumuwesto,” ang paglapit sa “lumapit sa kanila,” at ang diwa ng pagharap sa kaaway sa “salubungin ang Aram sa labanan.” Iningatan ang talababa at inilagay ang marka sa huling parirala na siyang tinutukoy nito.
