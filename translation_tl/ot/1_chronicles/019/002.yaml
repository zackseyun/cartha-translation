  text: וַ/יֹּ֨אמֶר דָּוִ֜יד אֶֽעֱשֶׂה חֶ֣סֶד עִם חָנ֣וּן בֶּן נָחָ֗שׁ כִּֽי עָשָׂ֨ה אָבִ֤י/ו עִמִּ/י֙ חֶ֔סֶד וַ/יִּשְׁלַ֥ח דָּוִ֛יד מַלְאָכִ֖ים לְ/נַחֲמ֣/וֹ עַל אָבִ֑י/ו וַ/יָּבֹאוּ֩ עַבְדֵ֨י דָוִ֜יד אֶל אֶ֧רֶץ בְּנֵי עַמּ֛וֹן אֶל חָנ֖וּן לְ/נַחֲמֽ/וֹ־׀־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/002.yaml
  text: And David said[a], “I will show kindness to Hanun son of Nahash, because his father showed kindness to me.” So David sent messengers to comfort him concerning his father. And David’s servants came to the land of the Ammonites, to Hanun, to comfort him.
translation:
  language: tl
  text: Sinabi ni David, “Magpapakita ako ng kabutihan kay Hanun na anak ni Nahas, sapagkat nagpakita sa akin ng kabutihan ang kanyang ama.” Kaya nagsugo si David ng mga mensahero upang aliwin siya dahil sa kanyang ama.[a] Dumating ang mga lingkod ni David sa lupain ng mga Ammonita upang aliwin si Hanun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “upang aliwin siya hinggil sa kanyang ama.” Ipinahihiwatig ng pananalitang Hebreo sa kontekstong ito na ang pag-aliw ay dahil sa pagkamatay ng kanyang ama.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶסֶד
  choice: kabutihan
  rationale: Sa ugnayang pampolitika at personal nina David, Nahas, at Hanun, tumutukoy ito sa kabutihang-loob na may diwa ng katapatan. Ang “kabutihan” ay natural sa Filipino at akma sa dalawang paglitaw, nang hindi ito nililimitahan sa isang teknikal na pakahulugang pangtipan.
- source_word: עָשָׂה ... חֶסֶד עִם
  choice: magpakita ng kabutihan kay / nagpakita sa akin ng kabutihan
  rationale: Idiomatiko sa Filipino ang “magpakita ng kabutihan kay” para sa Hebreong pariralang literal na “gumawa ng kabutihan kasama.”
- source_word: מַלְאָכִים
  choice: mga mensahero
  rationale: Mga taong isinugo ni David ang tinutukoy, hindi mga anghel. Hindi rin ipinagpapalagay ng salin ang mas tiyak na katayuang diplomatiko ng “mga sugo” o “mga embahador.”
- source_word: לְנַחֲמוֹ
  choice: upang aliwin siya
  rationale: Ang pandiwang נחם sa konteksto ng pagluluksa ay nangangahulugang magbigay-aliw o makiramay. Ang “aliwin” ay malinaw, dignified, at natural sa modernong Filipino.
- source_word: עַל אָבִיו
  choice: sa pagpanaw ng kanyang ama
  rationale: Ang עַל ay nagsasaad ng dahilan o okasyon ng pag-aliw. Bagaman “tungkol sa kanyang ama” ang mas literal na anyo, ipinahihiwatig ng konteksto ng pakikiramay na namatay ang ama; nililinaw ito ng “sa pagpanaw,” habang itinatala sa talababa ang mas literal na anyo.
- source_word: אֶרֶץ בְּנֵי עַמּוֹן
  choice: lupain ng mga Ammonita
  rationale: Ang “mga Ammonita” ang likas na etnonimo sa Filipino para sa “mga anak ni Ammon,” at pinananatili ng “lupain” ang heograpikong diwa ng אֶרֶץ.
- source_word: עַבְדֵי דָוִיד
  choice: mga lingkod ni David
  rationale: Tumutukoy ito sa mga taong naglilingkod kay David. Tapat ang “mga lingkod” sa malawak na saklaw ng salita at hindi nito labis na tinutukoy ang kanilang katungkulan bilang mga opisyal.
- source_word: וַיֹּאמֶר ... וַיִּשְׁלַח ... וַיָּבֹאוּ
  choice: Sinabi ... Kaya nagsugo ... Dumating
  rationale: Inihahatid ng mga pandiwang pasalaysay ang sunod-sunod na kilos. Ipinakikita ng “Kaya” na bunga ng ipinahayag na hangarin ni David ang pagpapadala ng mga mensahero.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na malinaw at marangal ang ginamit. Pinanatili ang payak na estilo ng salaysay at iniwasan ang labis na teknikal o denominasyonal na pananalita. Isinalin ang mga pangalan bilang Hanun at Nahas, at ang pangkat-etniko bilang mga Ammonita.
