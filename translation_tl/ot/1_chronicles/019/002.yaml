revisions:
- from: Sinabi ni David, “Magpapakita ako ng kabutihan kay Hanun na anak ni Nahas, sapagkat nagpakita sa akin ng kabutihan ang kanyang ama.” Kaya nagsugo si David ng mga mensahero upang aliwin siya sa pagpanaw ng kanyang ama.[a] Dumating ang mga lingkod ni David sa lupain ng mga Ammonita, kay Hanun, upang aliwin siya.
  to: Sinabi ni David, “Magpapakita ako ng kabutihan kay Hanun na anak ni Nahas, sapagkat nagpakita sa akin ng kabutihan ang kanyang ama.” Kaya nagsugo si David ng mga mensahero upang aliwin siya dahil sa kanyang ama.[a] Dumating ang mga lingkod ni David sa lupain ng mga Ammonita upang aliwin si Hanun.
  rationale: Pinalitan ang tahasang “sa pagpanaw ng kanyang ama” ng “dahil sa kanyang ama” upang mapanatili sa pangunahing teksto ang lawak ng Hebreong parirala, habang inilalagay sa talababa ang kontekstuwal na implikasyon ng kamatayan. Pinakinis din ang huling pangungusap para sa mas natural na Tagalog nang hindi binabago ang kahulugan.
