  source_fidelity: 'Tumpak ang karamihan ng salin: ang חֶסֶד ay angkop na “kabutihan,” ang מַלְאָכִים ay wastong “mga mensahero,” at ang “mga lingkod ni David” ay hindi labis na nagpapakahulugan sa עַבְדֵי דָוִד. Gayunman, ang “sa pagpanaw ng kanyang ama” ay tahasang nagsasaad ng kamatayan, samantalang ang עַל אָבִיו ay literal na tumutukoy sa ama bilang kaugnay o dahilan ng pag-aliw. Bagama’t malinaw ang konteksto ng pagluluksa, mas mainam na huwag gawing tahasan sa pangunahing teksto ang ipinahihiwatig lamang ng parirala.'
