translation_notes:
  register: Makabago, malinaw, at marangal na Filipino ang ginamit. Pinanatili ang maikling daloy ng salaysay, ang di-tiyak na layon ng “nagpadala,” at ang diin sa matinding kahihiyang dinanas ng mga lalaki.
