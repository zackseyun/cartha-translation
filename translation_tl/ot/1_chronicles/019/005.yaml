base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/005.yaml
  text: They went and told David about the men[a], and he sent to meet them, because the men were greatly humiliated. And the king said, “Stay in Jericho until your beards have grown back[b], then return.”
translation:
  language: tl
  text: Nagpunta sila at nag-ulat kay David tungkol sa mga lalaki. Kaya nagpadala siya upang salubungin sila[a], sapagkat labis na napahiya ang mga lalaki[b]. Sinabi ng hari, “Manatili kayo sa Jerico hanggang sa muling tumubo ang inyong mga balbas; saka kayo bumalik.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “nagpadala siya ng mga mensahero upang salubungin sila.” Hindi tahasang sinasabi sa Hebreo kung sino ang ipinadala, bagaman likas na ipinahihiwatig na may mga taong isinugo.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin ang “labis na napahiya” bilang “hiyang-hiya” o “lubhang nalagay sa kahihiyan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: Umalis sila
  rationale: Payak at natural na salin ng pandiwang nagsasaad ng kasunod na kilos sa salaysay; maaari rin itong unawaing “Pumunta sila,” ngunit ang pag-alis ang angkop sa daloy ng pangyayari.
- source_word: וַיַּגִּידוּ לְדָוִיד עַל הָאֲנָשִׁים
  choice: ibinalita kay David ang tungkol sa mga lalaki
  rationale: Pinananatili nito ang taong pinagsabihan at ang paksa ng ulat nang hindi dinaragdagan ang impormasyong wala sa Hebreo.
- source_word: וַיִּשְׁלַח לִקְרָאתָם
  choice: nagpadala siya upang salubungin sila
  rationale: Hindi tahasang binabanggit sa Hebreo kung sino ang ipinadala. Natural sa Filipino ang “nagpadala” kahit hindi tukuyin ang mga taong isinugo, kaya napapanatili ang pagiging di-tiyak ng orihinal.
- source_word: נִכְלָמִים מְאֹד
  choice: labis na napahiya
  rationale: Ipinahahayag ng anyong Niphal ng כלם ang pagkapahiya o pagkalagay sa kahihiyan, at pinalalakas ito ng מְאֹד. Ang “labis na napahiya” ay malinaw at angkop sa pampublikong paghamak na naranasan nila.
- source_word: שְׁבוּ
  choice: Manatili kayo
  rationale: Sa kontekstong ito, ang utos mula sa ישׁב ay nangangahulugang manatili sa isang lugar, hindi lamang literal na umupo.
- source_word: בִירֵחוֹ
  choice: sa Jerico
  rationale: Ginamit ang karaniwang anyong Filipino ng pangalan ng lugar.
- source_word: עַד אֲשֶׁר יְצַמַּח זְקַנְכֶם
  choice: hanggang sa muling tumubo ang inyong mga balbas
  rationale: Ang צמח ay “tumubo.” Idinagdag ang “muling” ayon sa malinaw na konteksto ng naunang talata, kung saan inahit ang kanilang mga balbas. Ginawang maramihan ang “mga balbas” upang maging natural sa Filipino para sa pangkat na kinakausap.
- source_word: וְשַׁבְתֶּם
  choice: saka kayo bumalik
  rationale: Ipinakikita ng “saka” ang kasunod na kilos pagkatapos tumubo muli ang kanilang mga balbas.
- source_word: הַמֶּלֶךְ
  choice: ang hari
  rationale: Pinananatili ang titulong ginamit ng tekstong Hebreo sa halip na palitan ito ng pangalang David.
