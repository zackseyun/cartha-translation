  terminology: Ang “isinugo,” “hukbo,” at “magigiting na mandirigma” ay angkop sa salaysay-militar. Wasto at nakaugaliang anyo ang “David” at “Joab.” Hindi labis na pinipirmi ng “magigiting na mandirigma” kung ang mga ito ay teknikal na piling pangkat, at maayos na tinatalakay ng talababa ang posibilidad na iyon.
