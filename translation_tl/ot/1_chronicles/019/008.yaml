  source_fidelity: 'Tumpak na naipapahayag ng salin ang dalawang pandiwa at ang dalawang layon: nang makatanggap si David ng balita, isinugo niya si Joab at ang buong hukbo na binubuo ng mga magigiting na mandirigma. Ang “mabalitaan” ay likas na pangkuwento para sa וַיִּשְׁמַע at hindi nagpapasok ng dagdag na kahulugan. Napananatili rin ng “hukbo ng magigiting na mandirigma” ang ugnayang construct ng כָּל צָבָא הַגִּבּוֹרִים.'
