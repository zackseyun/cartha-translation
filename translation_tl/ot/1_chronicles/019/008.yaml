translation_notes:
  register: Modernong Filipino Tagalog na malinaw, natural, at marangal ang himig. Ginamit ang “mabalitaan” para sa likas na daloy ng salaysay, “isinugo” para sa pormal na kontekstong militar, at “magigiting na mandirigma” upang mapanatili ang natatanging diwa ng הַגִּבּוֹרִים.
