base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/008.yaml
  text: When David heard, he sent Joab and all the army of the mighty men.
translation:
  language: tl
  text: Nang mabalitaan iyon ni David[a], isinugo niya si Joab at ang buong hukbo ng magigiting na mandirigma[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “Nang marinig ito ni David” o “Nang ipaalam ito kay David.”
    reason: lexical_alternative
  - marker: b
    text: Ang “magigiting na mandirigma” ay maaaring tumukoy sa matatapang na mandirigma ni David o sa kaniyang piling puwersang panlaban.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: Nang mabalitaan iyon
  rationale: Sa kontekstong pasalaysay, tumutukoy ang שׁמע sa pagtanggap ni David ng balita tungkol sa naunang pangyayari. Likas sa modernong Tagalog ang “mabalitaan iyon,” samantalang pinananatili sa talababa ang mas tuwirang “marinig.”
- source_word: וַיִּשְׁלַח
  choice: isinugo niya
  rationale: Ang שלח ay karaniwang nangangahulugang “ipadala” o “isugo.” Ang “isinugo” ay angkop sa pormal na salaysay at sa pagpapadala ng pinuno at hukbo para sa isang misyong militar.
- source_word: יוֹאָב
  choice: Joab
  rationale: Ginamit ang nakaugaliang anyo ng pangalang ito sa mga saling Tagalog ng Bibliya.
- source_word: כָּל
  choice: buong
  rationale: Natural na ipinapahayag ng “buong” ang saklaw ng כָּל kapag tumutukoy sa isang hukbo bilang kabuuan.
- source_word: צָבָא
  choice: hukbo
  rationale: Sa kontekstong militar, malinaw at dignified na katumbas ng צָבָא ang “hukbo.”
- source_word: הַגִּבּוֹרִים
  choice: magigiting na mandirigma
  rationale: Ipinapahayag nito ang lakas at kagitingang saklaw ng גִּבּוֹרִים, at maaari ring tumukoy sa natatanging pangkat ng mahuhusay na mandirigma ni David.
- source_word: וְאֵת כָּל צְבָא הַגִּבּוֹרִים
  choice: at ang buong hukbo ng magigiting na mandirigma
  rationale: Pinananatili ng parirala ang ugnayang construct sa Hebreo sa halip na gawing pangkalahatan lamang na “buong hukbo niya.”
