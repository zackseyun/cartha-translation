  text: וַ/יַּ֣רְא יוֹאָ֗ב כִּֽי הָיְתָ֧ה פְנֵי הַ/מִּלְחָמָ֛ה אֵלָ֖י/ו פָּנִ֣ים וְ/אָח֑וֹר וַ/יִּבְחַ֗ר מִ/כָּל בָּחוּר֙ בְּ/יִשְׂרָאֵ֔ל וַֽ/יַּעֲרֹ֖ךְ לִ/קְרַ֥את אֲרָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/010.yaml
  text: When Joab saw that the battle line was set against him in front and in the rear[b][a], he chose some of the best men from all Israel and arranged them to meet Aram.
translation:
  language: tl
  text: Nang makita ni Joab na may hanay ng mga mandirigma laban sa kanya sa harap at sa likuran, pumili siya ng ilan sa pinakamahuhusay na mandirigma mula sa buong Israel[a] at inihanay sila upang harapin ang Aram.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “mula sa lahat ng piling mandirigma ng Israel.” Maaari ring tumukoy ang salitang Hebreo sa mga kabataang lalaki, ngunit sa kontekstong ito ay mga piling mandirigma ang tinutukoy.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “Aram”; sa kontekstong ito, tumutukoy ito sa mga puwersang Arameo.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּרְא
  choice: Nang makita
  rationale: Pinananatili ang karaniwang pandiwang pandama ng ראה, na sa konteksto ay likas ding nagpapahiwatig na naunawaan ni Joab ang kalagayang pangmilitar.
- source_word: פְנֵי הַמִּלְחָמָה
  choice: hanay ng mga mandirigma
  rationale: Literal itong tumutukoy sa ‘harap ng labanan’; sa kontekstong pangmilitar, ang ‘hanay ng mga mandirigma’ ay malinaw at likas na paglalarawan sa puwersang nakapuwesto laban kay Joab.
- source_word: אֵלָיו פָּנִים וְאָחוֹר
  choice: laban sa kanya sa harap at sa likuran
  rationale: Pinananatili ang tahasang pagkakaiba ng dalawang direksiyon nang hindi dinaragdagan ang teksto ng ganap na pagkubkob.
- source_word: וַיִּבְחַר
  choice: pumili siya
  rationale: Tuwirang katumbas ng בחר at angkop sa payak na estilong pasalaysay.
- source_word: מִכָּל בָּחוּר בְּיִשְׂרָאֵל
  choice: ilan sa pinakamahuhusay na mandirigma mula sa buong Israel
  rationale: Ipinahihiwatig ng partitive na מִן na kumuha siya mula sa mas malaking pangkat; sa kontekstong pangmilitar, ang בָּחוּר ay tumutukoy sa mga piling o mahusay na mandirigma.
- source_word: וַיַּעֲרֹךְ
  choice: inihanay sila
  rationale: Sa konteksto ng digmaan, ang ערך ay pag-aayos o paglalagay ng mga kawal sa pormasyon; malinaw na naihahatid ito ng ‘inihanay.’
- source_word: לִקְרַאת אֲרָם
  choice: upang harapin ang Aram
  rationale: Ipinapakita ng לִקְרַאת ang pagharap o pagsalubong, at malinaw sa konteksto na ito ay pakikipaglaban.
- source_word: אֲרָם
  choice: Aram
  rationale: Pinananatili ang pangalang Hebreo sa halip na palitan ito ng mas huling heograpikong katawagan.
