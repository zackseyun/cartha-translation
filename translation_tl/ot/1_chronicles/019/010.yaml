translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘kanya’ sa halip na mas pormal na ‘kaniya’ para sa likas na daloy, habang pinanatili ang payak na himig ng salaysay at ang terminolohiyang pangmilitar.
