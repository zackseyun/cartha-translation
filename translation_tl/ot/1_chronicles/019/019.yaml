base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/019.yaml
  text: When the servants of Hadadezer saw that they had been defeated before Israel[a], they made peace with David and served him. And Aram was no longer willing to help the sons of Ammon.
translation:
  language: tl
  text: Nang makita ng mga lingkod ni Hadadezer na natalo sila ng Israel, nakipagpayapaan sila kay David at naglingkod sa kanya. Hindi na nagnais ang Aram na tulungan ang mga anak ni Ammon[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga Ammonita.” Literal sa Hebreo ang “mga anak ni Ammon,” na ginagamit bilang katawagang etniko.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַבְדֵי
  choice: mga lingkod
  rationale: Sa kontekstong maharlika at pampolitika, tumutukoy ito sa mga nasasakupan o tauhan ni Hadadezer; pinananatili ng “mga lingkod” ang diwa ng pagpapasakop nang hindi ipinapalagay na alipin sila.
- source_word: נִגְּפוּ
  choice: natalo
  rationale: Ang Niphal na anyo ay tumutukoy rito sa pagkatalo sa digmaan; natural at malinaw sa makabagong Tagalog ang “natalo.”
- source_word: לִפְנֵי יִשְׂרָאֵל
  choice: ng Israel
  rationale: Bagaman literal na “sa harap ng Israel,” ipinahihiwatig ng idyoma sa kontekstong militar na Israel ang tumalo sa kanila. Iniiwasan ng “ng Israel” ang posibleng maling pagkaunawa na presensiya lamang ng Israel ang tinutukoy.
- source_word: וַיַּשְׁלִימוּ עִם דָּוִיד
  choice: nakipagpayapaan sila kay David
  rationale: Ang Hiphil ng שלם kasama ng עִם ay nangangahulugang makipagkasundo o makipagpayapaan; malinaw at natural ang napiling parirala.
- source_word: וַיַּעַבְדֻהוּ
  choice: naglingkod sa kanya
  rationale: Ipinahahayag ng pandiwa ang pampolitikang paglilingkod o pagpapasakop kay David pagkatapos ng kasunduang pangkapayapaan.
- source_word: אָבָה
  choice: pumayag
  rationale: Ang pandiwa ay nangangahulugang maging handa o pumayag. Kasama ng pagtanggi at עוֹד, ipinahihiwatig nitong ayaw na nilang ipagpatuloy ang pagtulong.
- source_word: אֲרָם
  choice: Aram
  rationale: Pinananatili ang pangalang Hebreo sa halip na palitan ito ng “Siria”; ginagamit ito rito bilang kolektibong katawagan sa bayan o mga mamamayan nito.
- source_word: לְהוֹשִׁיעַ
  choice: tulungan
  rationale: Sa konteksto ng alyansang militar, tumutukoy ito sa pagdamay o pagbibigay-tulong, hindi sa isang espesipikong teolohikal na diwa ng pagliligtas.
- source_word: בְּנֵי עַמּוֹן
  choice: mga anak ni Ammon
  rationale: Pinananatili nito ang literal na anyo ng Hebreo, na ginagamit bilang katawagang etniko; inilalahad sa talababa ang mas idyomatikong alternatibo.
- source_word: עוֹד
  choice: hindi na
  rationale: Kapag kasama ng pagtanggi, nangangahulugan itong “hindi na” o “hindi na muli,” at natural ang pagkakalagay nito sa Tagalog.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang mga karaniwang salitang “natalo,” “nakipagpayapaan,” at “tulungan,” habang pinanatili ang mga pangalang Hadadezer, David, Aram, Israel, at Ammon. Inilipat ang marker ng talababa sa pariralang aktuwal nitong ipinapaliwanag.
