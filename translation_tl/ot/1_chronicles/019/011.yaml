  text: וְ/אֵת֙ יֶ֣תֶר הָ/עָ֔ם נָתַ֕ן בְּ/יַ֖ד אַבְשַׁ֣י אָחִ֑י/ו וַ/יַּ֣עַרְכ֔וּ לִ/קְרַ֖את בְּנֵ֥י עַמּֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/011.yaml
  text: He put the rest of the troops under the command of Abishai his brother[a], and they drew up in battle formation to meet the Ammonites.
translation:
  language: tl
  text: Ang natitirang mga kawal ay inilagay niya sa ilalim ng pamumuno ng kapatid niyang si Abisai[a], at pumuwesto sila sa hanay ng labanan upang harapin ang mga Ammonita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “ibinigay sa kamay ng kapatid niyang si Abisai,” isang idyoma na nangangahulugang ipinagkatiwala sa kanyang awtoridad o pamumuno.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֶתֶר הָעָם
  choice: ang natitirang mga kawal
  rationale: Ang יֶתֶר ay ‘natitira’ at ang הָעָם ay literal na ‘bayan/mga tao,’ ngunit sa kontekstong militar ay tumutukoy sa natitirang hukbo. Likas at malinaw sa Filipino ang ‘mga kawal.’
- source_word: נָתַן בְּיַד
  choice: inilagay ... sa ilalim ng pamamahala
  rationale: Ang literal na ‘ibinigay sa kamay’ ay isang idyomang Hebreo para sa pagtitiwala sa awtoridad o pamumuno ng isang tao. Ipinahahayag ng salin ang diwang militar nang hindi labis na nagpapaliwanag.
- source_word: אַבְשַׁי אָחִיו
  choice: kapatid niyang si Abisai
  rationale: Pinanatili ang ugnayang tahasang sinasabi ng Hebreo at ginamit ang karaniwang anyong Filipino ng pangalang Abishai, ‘Abisai.’
- source_word: וַיַּעַרְכוּ
  choice: pumuwesto sila sa hanay ng labanan
  rationale: Sa kontekstong militar, ang ערך ay tumutukoy sa pag-aayos o paghanay ng mga kawal para sa labanan. Malinaw at natural sa modernong Filipino ang napiling parirala.
- source_word: לִקְרַאת
  choice: upang harapin
  rationale: Maaaring mangahulugang ‘salubungin’ o ‘harapin.’ Sa konteksto ng labanan, likas ang ‘harapin’ at hindi nito dinaragdagan ang diwa ng teksto.
- source_word: בְּנֵי עַמּוֹן
  choice: mga Ammonita
  rationale: Ito ang natural na pang-etnikong salin sa Filipino ng literal na ‘mga anak ni Ammon.’
