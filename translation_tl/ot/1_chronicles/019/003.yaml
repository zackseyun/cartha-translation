base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/003.yaml
  text: But the princes of the Ammonites said to Hanun[a], “Is David honoring your father in your sight because he has sent comforters to you? Have not his servants come to you in order to search out, to overthrow[b], and to spy out the land?”
translation:
  language: tl
  text: Ngunit sinabi ng mga pinuno ng mga Ammonita kay Hanun, “Sa palagay mo ba'y pinararangalan ni David ang iyong ama kaya siya nagpadala sa iyo ng mga mang-aaliw? Hindi ba't pumunta sa iyo ang kanyang mga lingkod upang siyasatin, pabagsakin[a], at tiktikan ang lupain?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “baligtarin.” Ang pandiwang Hebreo ay maaaring mangahulugang baligtarin o ibagsak; sa kontekstong ito, malamang na tumutukoy ito sa mapanirang pagpapabagsak.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂרֵי
  choice: mga pinuno
  rationale: Tumutukoy sa matataas na tagapamahala o opisyal ng Ammon; natural at marangal sa modernong Filipino nang hindi nagpapahiwatig ng anak ng hari.
- source_word: הַמְכַבֵּד
  choice: pinararangalan
  rationale: Tumpak na naghahatid ng diwang paggalang at pagpaparangal sa konteksto ng pakikiramay.
- source_word: בְּעֵינֶיךָ
  choice: sa palagay mo
  rationale: Natural na salin ng Hebreong idyomang literal na 'sa iyong mga mata,' na tumutukoy sa pananaw o paghatol ni Hanun.
- source_word: מְנַחֲמִים
  choice: mga mang-aaliw
  rationale: Tumutukoy sa mga isinugo upang umaliw sa isang nagdadalamhati; pinananatili ang papel ng mga sugo.
- source_word: לַחְקֹר
  choice: siyasatin
  rationale: Saklaw ang masusing paggalugad o pagsisiyasat na kaugnay ng lihim na pagmamanman.
- source_word: וְלַהֲפֹךְ
  choice: pabagsakin
  rationale: Ipinahihiwatig ng pandiwang 'baligtarin/ibagsak' ang mapanirang layunin sa pampolitika at militar na konteksto, habang kinikilala sa talababa ang mas literal na alternatibo.
- source_word: וּלְרַגֵּל
  choice: tiktikan
  rationale: Karaniwang Filipino para sa lihim na pagmamanman o paniniktik sa isang lupain.
- source_word: הָאָרֶץ
  choice: ang lupain
  rationale: Pinananatili ang malawak na kahulugan ng teritoryo ng Ammon.
- source_word: עֲבָדָיו
  choice: kanyang mga lingkod
  rationale: Direktang salin na angkop sa mga tauhan o sugo ng hari nang hindi labis na tinutukoy ang kanilang katungkulan.
