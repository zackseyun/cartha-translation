revisions:
- from: Nang makita ng Aram[a] na natalo sila sa harap ng Israel, nagsugo sila ng mga mensahero at pinalabas ang mga Arameo mula sa ibayo ng Ilog[b]. Si Sofak, ang kumander ng hukbo ni Hadadezer, ang nasa unahan nila.
  to: Nang makita ng Aram[a] na natalo sila sa harap ng Israel, nagsugo sila ng mga mensahero at ipinatawag ang mga Arameo mula sa ibayo ng Ilog[b], kasama si Sofak, ang kumander ng hukbo ni Hadadezer, na nasa unahan nila.
  rationale: Pinalitan ang “pinalabas” ng “ipinatawag” upang maipahayag nang likas at malinaw ang pagpapakilos ng mga karagdagang Arameong puwersa sa kontekstong militar. Inayos ang ugnayan ni Sofak sa hukbo sa iisang pangungusap, ngunit pinanatili ang di-tiyak na “nasa unahan nila.” Pinakinis din ang pananalita ng talababa b nang hindi binabago ang saklaw ng Hebreo.
