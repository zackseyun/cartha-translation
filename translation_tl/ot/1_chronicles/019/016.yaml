  text: וַ/יַּ֣רְא אֲרָ֗ם כִּ֣י נִגְּפוּ֮ לִ/פְנֵ֣י יִשְׂרָאֵל֒ וַֽ/יִּשְׁלְחוּ֙ מַלְאָכִ֔ים וַ/יּוֹצִ֣יאוּ אֶת אֲרָ֔ם אֲשֶׁ֖ר מֵ/עֵ֣בֶר הַ/נָּהָ֑ר וְ/שׁוֹפַ֛ךְ שַׂר צְבָ֥א הֲדַדְעֶ֖זֶר לִ/פְנֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/016.yaml
  text: When Aram saw that they had been defeated before Israel[a], they sent messengers and brought out the Arameans who were from beyond the River[b], with Shophach the commander of Hadadezer’s army before them.
translation:
  language: tl
  text: Nang makita ng Aram[a] na natalo sila sa harap ng Israel, nagsugo sila ng mga mensahero at ipinatawag ang mga Arameo mula sa ibayo ng Ilog[b], kasama si Sofak, ang kumander ng hukbo ni Hadadezer, na nasa unahan nila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tradisyonal na “Siria”; sa Hebreo ay “Aram.”
    reason: lexical_alternative
  - marker: b
    text: Maaaring tumukoy sa kabilang panig ng Eufrates; “sa ibayo ng Ilog” lamang ang mababasa sa Hebreo.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲרָם
  choice: Aram / mga Arameo
  rationale: Ginamit ang “Aram” para sa lupain o bayang tinutukoy sa simula, at “mga Arameo” para sa mga tao o hukbong pinakilos. Pinananatili nito ang Hebreong pangalan sa halip na ang tradisyonal na “Siria/mga Siriano.”
- source_word: נִגְּפוּ
  choice: natalo
  rationale: Sa konteksto ng labanan, ang Niphal ay tumutukoy sa pagkatalo. Malinaw at likas sa makabagong Filipino ang “natalo” nang hindi ipinahihiwatig na lubusang nalipol sila.
- source_word: לִפְנֵי יִשְׂרָאֵל
  choice: sa harap ng Israel
  rationale: Pinananatili ang konkretong idyomang Hebreo na “sa harap ng Israel,” na sa konteksto ay nangangahulugang natalo sila sa pakikipaglaban sa Israel.
- source_word: מַלְאָכִים
  choice: mga mensahero
  rationale: Mga taong sugo sa isang usaping militar at pampolitika ang tinutukoy, hindi mga anghel.
- source_word: וַיּוֹצִיאוּ אֶת אֲרָם
  choice: pinalabas ang mga Arameo
  rationale: Ipinapahayag ng Hiphil ng יצא ang pagpapalabas o pagpapakilos sa karagdagang hukbo. Ang “pinalabas” ay nananatiling malapit sa anyo ng Hebreo, habang ang “mga Arameo” ay nililinaw na mga tao o puwersa ang tinutukoy.
- source_word: מֵעֵבֶר הַנָּהָר
  choice: mula sa ibayo ng Ilog
  rationale: Literal itong “mula sa ibayo ng Ilog.” Malamang na Eufrates ang tinutukoy, ngunit hindi ito tahasang pinangalanan sa Hebreo, kaya pinanatili sa pangunahing teksto ang “Ilog.”
- source_word: וְשׁוֹפַךְ
  choice: Si Sofak
  rationale: Ipinakikilala ng parirala si Sofak bilang kasama ng hukbo at nasa harapan nito. Ang hiwalay na pangungusap ay likas sa Filipino at malinaw ang ugnayan.
- source_word: שַׂר צְבָא הֲדַדְעֶזֶר
  choice: ang kumander ng hukbo ni Hadadezer
  rationale: Ang שַׂר צְבָא ay karaniwang titulong militar; malinaw at makabago ang “kumander ng hukbo.”
- source_word: לִפְנֵיהֶם
  choice: nasa unahan nila
  rationale: Literal na “nasa harap nila.” Sa kilos ng hukbo, tumutukoy ito sa puwesto ni Sofak sa unahan, ngunit hindi tahasang dinaragdagan ng pandiwang “namumuno” ang Hebreo.
theological_decisions: []
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang pangalang “Aram,” ang idyomang “sa harap ng Israel,” at ang di-tiyak na katawagang “Ilog.” Inilipat ang mga talababa sa mga salitang aktuwal na tinutukoy ng bawat paliwanag.
