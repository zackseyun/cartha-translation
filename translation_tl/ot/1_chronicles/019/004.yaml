base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/004.yaml
  text: So Hanun took David’s servants[a], shaved them, cut their garments in half up to the hips[b], and sent them away.
translation:
  language: tl
  text: Kaya kinuha ni Hanun ang mga lingkod ni David[a], inahitan sila, ginupit ang kanilang mga kasuotan sa kalahati hanggang sa puwitan[b], at pinaalis sila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa katulad na salaysay sa 2 Samuel 10:4, espesipikong sinasabing inahitan ni Hanun ang kalahati ng balbas ng bawat isa. Dito sa Cronica, sinasabi lamang na “inahitan sila.”
    reason: cross_reference
  - marker: b
    text: O “hanggang sa gawing likuran.” Ang salitang Hebreo ay tumutukoy sa gawing likuran o puwitan, at itinatampok ang hayagang pagpapahiya sa kanila sa pamamagitan ng paglalantad ng katawan.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַבְדֵי
  choice: mga lingkod
  rationale: Maaaring tumukoy ang salita sa mga alipin o lingkod. Sa kontekstong ito, sila ay mga sugo na naglilingkod kay David, kaya likas at angkop ang “mga lingkod.”
- source_word: וַיְגַלְּחֵם
  choice: inahitan sila
  rationale: Ang pandiwa ay nangangahulugang “ahitan.” Hindi tinukoy ng Cronica kung anong bahagi ang inahitan, kaya hindi isinama sa pangunahing teksto ang detalye tungkol sa kalahati ng balbas mula sa katulad na salaysay sa 2 Samuel 10:4.
- source_word: מַדְוֵיהֶם
  choice: kanilang mga kasuotan
  rationale: Tumutukoy ito sa mga damit o kasuotan, marahil ay damit ng mga opisyal na sugo. Ang “mga kasuotan” ay dignified at malinaw sa modernong Filipino.
- source_word: בַּחֵצִי
  choice: ginupit ... hanggang
  rationale: Sa konteksto, inilalarawan ng parirala ang pagputol sa kasuotan sa kalagitnaan o hanggang sa tinukoy na bahagi ng katawan. Isinaayos ang Filipino upang maging natural nang hindi ipinapalagay na hinati lamang sa dalawang magkasinglaking piraso ang damit.
- source_word: עַד הַמִּפְשָׂעָה
  choice: hanggang puwitan
  rationale: Ang pambihirang pangngalan ay tumutukoy sa gawing likuran o puwitan. Tumpak at madaling maunawaan ang “puwitan,” habang pinananatili ang diwa ng hayagang kahihiyan.
- source_word: וַיְשַׁלְּחֵם
  choice: pinaalis sila
  rationale: Ang pandiwa ay “magpadala,” ngunit matapos silang hamakin, ang “pinaalis sila” ay natural na naghahatid ng mapanghamak na pagpapaalis.
