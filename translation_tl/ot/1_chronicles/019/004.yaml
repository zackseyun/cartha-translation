  naturalness: Natural at marangal ang pangkalahatang daloy. Ang “hanggang sa puwitan” ay mas natural kaysa “hanggang puwitan,” at ang pagdaragdag ng “sa kalahati” ay nagbibigay ng malinaw at sapat na literal na paglalarawan.
  terminology: Ang “mga lingkod,” “inahitan,” “mga kasuotan,” at “pinaalis” ay angkop sa modernong Filipino Tagalog at sa konteksto ng mga sugo ng hari. Ang “puwitan” ay tumpak para sa pambihirang Hebreong termino at hindi kailangang palitan ng mas malabong “balakang.”
