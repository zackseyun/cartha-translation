translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang “Aram,” ginamit ang natural na etnonimong “mga Ammonita,” at isinalin ang idyomang may תְּשׁוּעָה sa paraang madaling maunawaan nang hindi ito binibigyan ng natatanging denominasyonal na kahulugan.
