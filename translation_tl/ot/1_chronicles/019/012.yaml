base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/012.yaml
  text: And he said[a], “If Aram is too strong for me, then you shall be my salvation; but if the Ammonites are too strong for you[b], then I will save you.”
translation:
  language: tl
  text: Sinabi niya, “Kung mas malakas sa akin ang Aram,[a] ikaw ang magliligtas sa akin;[b] ngunit kung mas malakas sa iyo ang mga Ammonita, ililigtas kita.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “Kung manaig laban sa akin ang Aram”; ang Hebreo ay literal na “kung maging mas malakas kaysa sa akin ang Aram.”
    reason: lexical_alternative
  - marker: b
    text: Literal na “ikaw ay magiging para sa akin ukol sa pagliligtas,” isang Hebreong paraan ng pagsasabing darating siya upang tumulong at magligtas sa labanan.
    reason: lexical_alternative
lexical_decisions:
- source_word: תֶּחֱזַק / יֶחֶזְקוּ (חזק)
  choice: mas malakas sa
  rationale: Sa konstruksyong may מִן at sa konteksto ng labanan, tumutukoy ito sa pagiging mas malakas o sa pananaig laban sa isang panig. Likas sa Tagalog ang “mas malakas sa” at hindi nito labis na nililinaw kung lakas o aktuwal na pananaig ang tinutukoy.
- source_word: אֲרָם
  choice: Aram
  rationale: Pinananatili ang sinaunang pangalan ng bayan o pangkat sa halip na gamitin ang mas huling heograpikong katawagang “Siria.”
- source_word: וְהָיִיתָ לִּי לִתְשׁוּעָה
  choice: ikaw ang magliligtas sa akin
  rationale: Ang literal na anyo ay “ikaw ay magiging para sa akin ukol sa pagliligtas.” Inihahayag ng napiling salin ang likas na diwang militar ng pagdating upang magligtas, habang pinananatili ang tuwirang pangako at ang ugnayan nito sa kasunod na pandiwang ישע.
- source_word: תְּשׁוּעָה
  choice: pagliligtas / magliligtas
  rationale: Sa konteksto, ito ay konkretong pagliligtas sa labanan. Ang “magliligtas” ay mas natural sa pangungusap kaysa sa literal ngunit mabigat na “magiging pagliligtas.”
- source_word: בְּנֵי עַמּוֹן
  choice: mga Ammonita
  rationale: Ito ang natural at karaniwang katawagan sa Tagalog para sa bayang literal na tinatawag na “mga anak ni Ammon.”
- source_word: וְהוֹשַׁעְתִּיךָ (ישע)
  choice: ililigtas kita
  rationale: Ang Hiphil ng ישע ay nangangahulugang magligtas o maghatid ng kaligtasan; ang “ililigtas kita” ay malinaw, natural, at angkop sa labanan.
- source_word: וַיֹּאמֶר
  choice: Sinabi niya
  rationale: Natural na pagsasalin ng karaniwang anyong pasalaysay sa Hebreo; hindi kailangang ulitin ang pangatnig na וַ sa Tagalog kapag nakahiwalay ang talata.
