base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/001.yaml
  text: After this, Nahash king of the Ammonites died, and his son reigned in his place.
translation:
  language: tl
  text: Pagkatapos nito, namatay si Nahas na hari ng mga Ammonita, at ang anak niya ang naghari bilang kapalit niya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי כֵן
  choice: Pagkatapos nito
  rationale: Likas na panandang temporal sa modernong Tagalog na pinananatili ang paglipat ng salaysay nang hindi isinasama ang matigas na literal na ‘at nangyari.’
- source_word: וַיָּמָת
  choice: namatay
  rationale: Tuwiran at tumpak na katumbas ng pandiwang מות; hindi nito pinalalambot ang pahayag.
- source_word: נָחָשׁ
  choice: Nahas
  rationale: Karaniwang anyong Tagalog ng pangalang Hebreo, na malapit sa bigkas ng pinagmulan.
- source_word: מֶלֶךְ בְּנֵי עַמּוֹן
  choice: hari ng mga Ammonita
  rationale: Ang בְּנֵי עַמּוֹן ay katawagang etniko; ang ‘mga Ammonita’ ay malinaw at likas sa Tagalog kaysa sa literal na ‘mga anak ni Ammon.’
- source_word: וַיִּמְלֹךְ
  choice: naghari
  rationale: Ipinahahayag ng מלך ang paghawak o pagsisimula ng pamamahala bilang hari; ang ‘naghari’ ay maikli at angkop sa salaysay.
- source_word: בְּנוֹ
  choice: ang anak niya
  rationale: Malinaw na tumutukoy kay Nahas ang hulaping panghalip; natural sa modernong Tagalog ang ‘anak niya.’
- source_word: תַּחְתָּיו
  choice: bilang kapalit niya
  rationale: Ipinahahayag ang paghalili sa posisyon ng hari, hindi lamang ang pagkakasunod sa panahon.
