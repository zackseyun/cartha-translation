  text: חֲזַ֤ק וְ/נִֽתְחַזְּקָה֙ בְּעַד עַמֵּ֔/נוּ וּ/בְעַ֖ד עָרֵ֣י אֱלֹהֵ֑י/נוּ וַֽ/יהוָ֔ה הַ/טּ֥וֹב בְּ/עֵינָ֖י/ו יַעֲשֶֽׂה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/013.yaml
  text: Be strong[a], and let us be strong for our people and for the cities of our God[b], and may Yahweh do what is good in his eyes.
translation:
  language: tl
  text: Magpakatatag ka, at magpakatatag tayo[a] alang-alang sa ating sambayanan at sa mga lungsod ng ating Diyos. Gawin nawa ni Yahweh ang mabuti sa kanyang paningin.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “at patibayin natin ang ating sarili.” Ang pandiwang Hebreo ay may reflexive/intensive na diwa.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin, “Gagawin ni Yahweh ang mabuti sa kanyang paningin.” Sa kontekstong ito, ang anyong Hebreo ay maaaring unawaing isang hangarin o isang pahayag tungkol sa mangyayari.
    reason: alternative_reading
lexical_decisions:
- source_word: חֲזַק
  choice: Magpakatatag ka
  rationale: Tuwirang salin ng Qal imperative na nag-uutos ng katatagan at lakas ng loob; natural ito sa makabagong Filipino sa konteksto ng nalalapit na labanan.
- source_word: וְנִתְחַזְּקָה
  choice: at magpakatatag tayo
  rationale: Ang Hitpael cohortative ay panawagang sama-samang magpakatatag. Ipinahihiwatig ng pandiwang “magpakatatag” ang kusang pagpapatibay sa sarili nang hindi nagiging mabigat ang pananalita.
- source_word: בְּעַד
  choice: alang-alang sa
  rationale: Ipinapahayag nito ang pagkilos para sa kapakanan o pagtatanggol ng iba. Ang “alang-alang sa” ay natural at saklaw ang layuning pansambayanan at pandepensa.
- source_word: עַמֵּנוּ
  choice: ating sambayanan
  rationale: Ang עַם ay tumutukoy sa buong bayan o mga mamamayan, hindi lamang sa hukbo. Ang “sambayanan” ay malinaw, marangal, at hindi nalilito sa heograpikong kahulugan ng “bayan.”
- source_word: עָרֵי אֱלֹהֵינוּ
  choice: mga lungsod ng ating Diyos
  rationale: Pinananatili ang konstruksiyong Hebreo at ang pahiwatig na ang mga lungsod ay nauukol sa Diyos.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin sa anyong transliterasyon ang personal na pangalang nasa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: הַטּוֹב בְּעֵינָיו
  choice: ang mabuti sa kanyang paningin
  rationale: Pinananatili ang larawang Hebreo habang malinaw na tumutukoy sa itinuturing ni Yahweh na mabuti o tama.
- source_word: יַעֲשֶׂה
  choice: Gawin nawa
  rationale: Ang imperfect sa kontekstong ito ay maaaring magkaroon ng volitional o jussive na diwa. Ipinahahayag ng “nawa” ang mapagpakumbabang pagpapaubaya ng kahihinatnan sa Diyos.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehovah
  rationale: Tahasang ginagamit ng pinagmulang teksto ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalan sa halip na ipalit ang isang titulo.
- issue: Diwa ng pangwakas na sugnay
  choice: Gawin nawa ni Yahweh ang mabuti sa kanyang paningin
  alternative: Gagawin ni Yahweh ang mabuti sa kanyang paningin
  rationale: Sa gitna ng panawagang magpakatatag, ang anyo ay maaaring unawaing mapagpaubayang hangarin o pahayag tungkol sa hinaharap. Pinili sa pangunahing teksto ang volitional na pagbasa at itinala ang predictive na pagbasa sa talababa upang mapanatili ang tunay na kalabuan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “magpakatatag” para sa natural na panawagang pandigma, “sambayanan” upang tukuyin ang buong mga mamamayan, at “sa kanyang paningin” upang mapanatili ang idyomang Hebreo nang nauunawaan pa rin ng karaniwang mambabasa.
