base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/015.yaml
  text: When the Ammonites saw that Aram had fled[a], they also fled before Abishai his brother and entered the city[b]. Then Joab came to Jerusalem.
translation:
  language: tl
  text: Nang makita ng mga Ammonita na tumakas ang Aram[a], tumakas din sila sa harap ni Abisai, na kapatid ni Joab,[b] at pumasok sa lunsod. Pagkatapos, pumunta si Joab sa Jerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “Aram”; tumutukoy ito rito sa mga puwersang Arameo, na tradisyonal na tinatawag na “mga Sirio.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “Abisai, ang kanyang kapatid”; ang “kanyang” ay tumutukoy kay Joab.
    reason: referent_clarification
lexical_decisions:
- source_word: וּבְנֵי עַמּוֹן
  choice: mga Ammonita
  rationale: Ang literal na “mga anak ni Ammon” ay katawagan sa sambayanan ng Ammon; ang “mga Ammonita” ang likas at tumpak na katawagan sa modernong Filipino.
- source_word: רָאוּ כִּי נָס
  choice: makita ... na tumakas
  rationale: Pinananatili nito ang karaniwang kahulugan ng ראה at ang כִּי bilang pananda ng nilalaman ng kanilang nakita. Hindi kailangan ang past perfect sa Filipino upang maipakita ang pagkakasunod-sunod.
- source_word: אֲרָם
  choice: hukbo ng Aram
  rationale: Ang pangalang Aram ay kolektibong tumutukoy rito sa mga puwersang Arameo; nililinaw ng “hukbo” ang tinutukoy nang hindi ginagamit ang tradisyonal ngunit anachronistic na “Siria.”
- source_word: וַיָּנוּסוּ גַם הֵם
  choice: tumakas din sila
  rationale: Likas nitong naihahayag ang pagpapatuloy ng salaysay at ang paghahambing na ipinahihiwatig ng גַם הֵם.
- source_word: מִפְּנֵי
  choice: mula kay
  rationale: Sa kontekstong militar, ipinahihiwatig nito ang pagtakas palayo sa humahabol o kalaban; natural sa Filipino ang “tumakas ... mula kay.”
- source_word: אַבְשַׁי אָחִיו
  choice: Abisai, na kapatid ni Joab
  rationale: Ang panghalip na hulapi sa אָחִיו ay pinakamalamang na tumutukoy kay Joab batay sa konteksto. Ginawang tahasan sa teksto para maiwasan ang malabong Filipino na “kapatid niya,” habang itinatala sa talababa ang anyo ng Hebreo.
- source_word: וַיָּבֹאוּ הָעִירָה
  choice: pumasok sa lunsod
  rationale: Ang hulaping paturol sa הָעִירָה ay nagpapahayag ng pagkilos papasok sa lunsod. Ang “pumasok” ay tuwiran at natural.
- source_word: וַיָּבֹא יוֹאָב יְרוּשָׁלִָם
  choice: Pagkatapos, pumunta si Joab sa Jerusalem
  rationale: Ipinapakita ng “Pagkatapos” ang pagsulong ng salaysay. Ang “pumunta” ay hindi nagdaragdag ng ideyang “bumalik,” na hindi tahasang nasa pandiwang Hebreo.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na may dignidad at malinaw na daloy ng salaysay. Ginamit ang “lunsod” bilang pormal ngunit karaniwang salita, at pinanatili ang mga pangalang Aram, Abisai, Joab, at Jerusalem sa nakagawiang anyong Filipino.
