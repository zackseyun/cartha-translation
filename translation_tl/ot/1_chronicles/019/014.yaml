  text: So Joab and the people who were with him advanced before Aram for battle[a], and they fled before him.
translation:
  language: tl
  text: At lumapit si Joab at ang mga taong kasama niya sa harap ng Aram upang makipaglaban[a], at tumakas sila mula sa harap niya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “laban sa Aram” o “sa harap ng mga Arameo.” Sa Hebreo, “sa harap ng Aram” ang mababasa; ginagamit ang pangalang pantangi at isang spatial na idyoma sa konteksto ng labanan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגַּשׁ
  choice: sumulong
  rationale: Ang נגשׁ ay ‘lumapit,’ ngunit sa konteksto ng pakikipaglaban, malinaw at natural na ipinahahayag ng “sumulong” ang paglapit upang makipagsagupaan.
- source_word: וְהָעָם אֲשֶׁר עִמּוֹ
  choice: at ang mga taong kasama niya
  rationale: Pinananatili nito ang literal na diwa ng הָעָם (‘mga tao/bayan’) nang hindi tahasang ginagawang ‘hukbo,’ bagaman mga mandirigma ang tinutukoy sa konteksto.
- source_word: לִפְנֵי אֲרָם
  choice: sa harap ng Aram
  rationale: Pinananatili ang spatial na idyomang לִפְנֵי at ang pangalang Aram; hindi nito tahasang nilulutas ang parirala bilang ‘laban sa Aram’ o ginagawang etnikong maramihan ang pangalan.
- source_word: אֲרָם
  choice: Aram
  rationale: Isinalin bilang pangalang pantangi at hindi bilang ‘Siria,’ na maaaring magpasok ng anakronistikong katawagan.
- source_word: לַמִּלְחָמָה
  choice: upang makipaglaban
  rationale: Likas sa modernong Tagalog at malinaw na ipinahahayag ang layunin ng pagsulong na nakapaloob sa parirala.
- source_word: וַיָּנוּסוּ
  choice: tumakas sila
  rationale: Direktang katumbas ng נוס na nangangahulugang tumakas; hindi pinalalambot bilang maayos na pag-urong.
- source_word: מִפָּנָיו
  choice: mula sa harap niya
  rationale: Pinananatili ang larawang ‘mula sa mukha/harap niya’ at ang pang-isahang panghalip, na pinakamalamang na tumutukoy kay Joab.
