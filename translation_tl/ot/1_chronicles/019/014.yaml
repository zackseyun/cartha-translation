translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ang “sumulong” at “upang makipaglaban” ay natural sa salaysay ng digmaan, samantalang pinananatili ng “sa harap ng Aram” at “mula sa harap niya” ang mahalagang spatial na wika ng Hebreo.
