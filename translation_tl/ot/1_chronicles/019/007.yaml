base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/007.yaml
  text: So they hired for themselves thirty-two thousand chariots[a], and the king of Maacah with his people. They came and camped before Medeba[b], and the sons of Ammon gathered from their cities and came to battle.
translation:
  language: tl
  text: Kaya umupa sila para sa kanilang sarili ng tatlumpu’t dalawang libong karwaheng pandigma[a], at ng hari ng Maaca kasama ang kanyang mga tao. Dumating sila at nagkampo sa tapat ng Medeba. Ang mga anak ni Ammon[b] naman ay nagtipon mula sa kanilang mga lungsod at dumating upang makipagdigma.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “karwaheng pandigma” ay maaari ring tumukoy nang sama-sama sa puwersa ng mga karwaheng pandigma, hindi lamang sa bilang ng mga sasakyan.
    reason: lexical_alternative
  - marker: b
    text: O “mga Ammonita.” Literal sa Hebreo ang “mga anak ni Ammon,” isang karaniwang katawagang etniko.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂכְּרוּ לָהֶם
  choice: umupa sila para sa kanilang sarili
  rationale: Ipinahahayag ng pandiwang שׂכר ang pagkuha kapalit ng bayad, at ang לָהֶם ay datibong nagsasaad ng kapakinabangan nila. Hindi ginamit ang “mga mersenaryo” sapagkat hindi tahasang iyon ang pangngalan sa Hebreo.
- source_word: שְׁנַיִם וּשְׁלֹשִׁים אֶלֶף
  choice: tatlumpu’t dalawang libo
  rationale: Likas na ayos ng bilang sa modernong Tagalog habang eksaktong pinananatili ang halagang 32,000.
- source_word: רֶכֶב
  choice: karwaheng pandigma
  rationale: Maaaring tumukoy ang רֶכֶב sa mga karwahe o sa sama-samang puwersang gumagamit ng mga ito. Nililinaw ng “pandigma” ang kontekstong militar nang hindi ginagawang tahasang mga kawal ang tinutukoy.
- source_word: מֶלֶךְ מַעֲכָה
  choice: hari ng Maaca
  rationale: Ang anyong construct ay tumutukoy sa hari na namamahala sa Maaca; isinalin ang pangalang pantangi sa karaniwang anyong Tagalog.
- source_word: עַמּוֹ
  choice: kanyang mga tauhan
  rationale: Literal na “kanyang bayan/mga tao,” ngunit sa kontekstong militar, ang “mga tauhan” ay natural at hindi kasingtiyak ng “hukbo” o “mga kawal.”
- source_word: וַיָּבֹאוּ וַיַּחֲנוּ
  choice: Dumating ang mga ito at nagkampo
  rationale: Pinananatili ang payak at sunod-sunod na kilos ng salaysay sa Hebreo.
- source_word: לִפְנֵי מֵידְבָא
  choice: sa tapat ng Medeba
  rationale: Sa heograpiko at militar na konteksto, ang לִפְנֵי ay maaaring mangahulugang nasa harap o katapat; natural sa Tagalog ang “sa tapat ng.”
- source_word: בְנֵי עַמּוֹן
  choice: mga anak ni Ammon
  rationale: Pinananatili ang literal na karaniwang katawagang etniko ng Hebreo at ang kaugnayan nito kay Ammon; inilalahad sa talababa ang mas karaniwang katumbas.
- source_word: נֶאֶסְפוּ מֵעָרֵיהֶם
  choice: nagtipon mula sa kanilang mga lungsod
  rationale: Tumpak na ipinapahayag ang pagtitipon o pagmamartsa mula sa kani-kanilang mga lungsod nang hindi nagdaragdag ng di-tahasang detalye.
- source_word: וַיָּבֹאוּ לַמִּלְחָמָה
  choice: dumating upang makipagdigma
  rationale: Natural sa modernong Tagalog at pinananatili ang layuning lumahok sa digmaan.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “nagkampo,” “mga tauhan,” at “makipagdigma” bilang natural na kasalukuyang pananalita, habang pinanatili sa pangunahing teksto ang literal na katawagang “mga anak ni Ammon.”
