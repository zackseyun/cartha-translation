revisions:
- from: Kaya umupa sila para sa kanilang sarili ng tatlumpu’t dalawang libong karwaheng pandigma[a], pati ng hari ng Maaca at ng kanyang mga tauhan. Dumating ang mga ito at nagkampo sa tapat ng Medeba. Ang mga anak ni Ammon[b] naman ay nagtipon mula sa kanilang mga lungsod at dumating upang makipagdigma.
  to: Kaya umupa sila para sa kanilang sarili ng tatlumpu’t dalawang libong karwaheng pandigma[a], at ng hari ng Maaca kasama ang kanyang mga tao. Dumating sila at nagkampo sa tapat ng Medeba. Ang mga anak ni Ammon[b] naman ay nagtipon mula sa kanilang mga lungsod at dumating upang makipagdigma.
  rationale: Pinalitan ang “kanyang mga tauhan” ng “kanyang mga tao” upang huwag tukuyin nang higit sa Hebreo ang עַמּוֹ. Inayos din ang pagkakaugnay ng hari ng Maaca sa bagay na inupahan. Hindi binago ang kahulugan, mga bilang, pangalang pantangi, o mga talababa.
