base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/009.yaml
  text: And the sons of Ammon came out and drew up for battle at the entrance of the city[d][c][b][a], while the kings who had come were by themselves in the field.
translation:
  language: tl
  text: Lumabas ang mga anak ni Ammon[a] at humanay para sa labanan[b] sa pasukan ng lungsod[c], samantalang ang mga haring dumating ay nakahiwalay sa kanila sa parang[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga Ammonita.” Mas literal sa Hebreo ang “mga anak ni Ammon.”
    reason: lexical_alternative
  - marker: b
    text: O “pumuwesto sa hanay para sa labanan.” Tumutukoy ang idyomang Hebreo sa pag-aayos ng mga kawal sa pormasyong panlaban.
    reason: lexical_alternative
  - marker: c
    text: O “sa tarangkahan ng lungsod,” bagaman ang salitang Hebreo ay mas pangkalahatang tumutukoy sa pasukan o bukana kaysa sa karaniwang salita para sa “tarangkahan.”
    reason: lexical_alternative
  - marker: d
    text: Ibig sabihin, nakapuwesto ang mga kaalyadong hari nang hiwalay sa hukbo ng Ammon, sa parang.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּצְאוּ
  choice: Lumabas
  rationale: Karaniwang salaysay na gamit ng יצא ang ‘lumabas’; natural ito sa tagpong militar nang hindi kailangang tukuyin ang pananaw na ‘pumaroon’ o ‘pumarito.’
- source_word: בְּנֵי עַמּוֹן
  choice: ang mga anak ni Ammon
  rationale: Pinananatili ang anyong Hebreo ng etnonimo; ipinaliliwanag sa talababa ang mas karaniwang ‘mga Ammonita.’
- source_word: וַיַּעַרְכוּ מִלְחָמָה
  choice: pumuwesto sa hanay para sa labanan
  rationale: Ipinahahayag ang idyomang militar na tumutukoy sa pag-aayos ng mga kawal sa pormasyon, hindi lamang sa pagsisimula ng pakikipaglaban.
- source_word: פֶּתַח הָעִיר
  choice: sa pasukan ng lungsod
  rationale: Ang פֶּתַח ay ‘pasukan/bukana,’ hindi ang karaniwang salitang Hebreo para sa mismong tarangkahan.
- source_word: וְהַמְּלָכִים אֲשֶׁר בָּאוּ
  choice: samantalang ang mga haring dumating
  rationale: Ipinakikita ng ‘samantalang’ ang paghahambing ng kinalalagyan ng mga Ammonita at ng mga kaalyadong hari.
- source_word: לְבַדָּם
  choice: nakahiwalay sa kanila
  rationale: Nililinaw ang pagkakahiwalay ng puwesto ng mga hari sa hukbo ng Ammon; hindi nito ipinahihiwatig na nag-iisa ang bawat hari.
- source_word: בַּשָּׂדֶה
  choice: sa parang
  rationale: Ang שׂדה rito ay bukas na lupain sa labas ng lungsod; ang ‘parang’ ay likas at maikli sa modernong Filipino.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang literal na ‘mga anak ni Ammon’ sa teksto, ngunit binigyan ng likas na alternatibo sa talababa. Ang ‘pumuwesto sa hanay’ ay malinaw na militar at hindi labis na teknikal; ang ‘parang’ ay kumakatawan sa bukas na lupain.
