  text: וַ/יָּ֣נָס אֲרָם֮ מִ/לִּ/פְנֵ֣י יִשְׂרָאֵל֒ וַ/יַּהֲרֹ֨ג דָּוִ֜יד מֵ/אֲרָ֗ם שִׁבְעַ֤ת אֲלָפִים֙ רֶ֔כֶב וְ/אַרְבָּעִ֥ים אֶ֖לֶף אִ֣ישׁ רַגְלִ֑י וְ/אֵ֛ת שׁוֹפַ֥ךְ שַֽׂר הַ/צָּבָ֖א הֵמִֽית־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/018.yaml
  text: And Aram fled before Israel[a], and David killed seven thousand chariot warriors from Aram and forty thousand foot soldiers[b], and he put Shophach the commander of the army to death.
translation:
  language: tl
  text: Tumakas ang hukbo ng Aram palayo sa Israel, at pinatay ni David ang pitong libong kawal ng mga karwahe mula sa Aram at apatnapung libong mga kawal na naglalakad.[a] Pinatay rin niya si Sofac, ang kumandante ng hukbo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa katumbas na salaysay sa 2 Samuel 10:18, mababasa ang “pitong daang karwahe at apatnapung libong mangangabayo.” Dito sa Mga Cronica, mababasa ang “pitong libong kawal ng mga karwahe at apatnapung libong mga kawal na naglalakad.”
    reason: textual_variant
  - marker: b
    text: Si Sofac ay tinatawag na Sobac sa katumbas na salaysay sa 2 Samuel 10:16, 18.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּנָס אֲרָם
  choice: Tumakas ang hukbo ng Aram
  rationale: Ang נוּס ay tuwirang nangangahulugang “tumakas.” Bagaman “Aram” lamang ang nasa Hebreo, malinaw sa konteksto ng labanan na tumutukoy ito sa hukbo o mga mandirigma ng Aram; idinagdag ang “hukbo ng” upang maging likas at malinaw sa Tagalog nang hindi ginagamit ang makabagong katawagang “Siria.”
- source_word: מִלִּפְנֵי יִשְׂרָאֵל
  choice: sa harap ng Israel
  rationale: Pinananatili nito ang larawang nasa idyomang Hebreo at ipinahihiwatig ang pagtakas dahil natalo sa labanan.
- source_word: וַיַּהֲרֹג דָּוִיד
  choice: pinatay ni David
  rationale: Tuwiran at makabagong katumbas ng הרג, na angkop sa salaysay ng labanan.
- source_word: שִׁבְעַת אֲלָפִים רֶכֶב
  choice: pitong libong kawal ng mga karwahe
  rationale: Ang רֶכֶב ay literal na tumutukoy sa mga karwahe o hukbong gumagamit ng karwahe. Ang “kawal ng mga karwahe” ay hindi naglilimita sa bilang sa mga tagapagmaneho lamang at ipinapakita ang metonimikong gamit para sa puwersang pandigma na may mga karwahe.
- source_word: וְאַרְבָּעִים אֶלֶף אִישׁ רַגְלִי
  choice: apatnapung libong kawal na naglalakad
  rationale: Ang אִישׁ רַגְלִי ay kawal na lumalaban nang naglalakad, kaiba sa puwersang gumagamit ng karwahe. Likas at madaling maunawaan ang parirala sa modernong Tagalog.
- source_word: שׁוֹפַךְ
  choice: Sofac
  rationale: Transliterasyon ito ng anyo ng pangalan sa Mga Cronica; ang naiibang anyong Shobac sa Samuel ay inilagay sa talababa.
- source_word: שַׂר הַצָּבָא
  choice: ang kumandante ng hukbo
  rationale: Malinaw at kasalukuyang katawagan para sa pinuno ng hukbo.
- source_word: הֵמִית
  choice: Pinatay rin niya
  rationale: Ang Hiphil ng מות ay “pinangyaring mamatay” o “pinatay.” Ang “rin” ay likas na nag-uugnay sa naunang pagpatay nang hindi nagdaragdag ng teolohikal na kahulugan.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “hukbo ng Aram” upang maipahayag ang kolektibong tinutukoy ng pangalang Aram sa konteksto, at inilagay ang mga tanda ng talababa kaagad pagkatapos ng mga bahaging tinatalakay ng mga ito.
