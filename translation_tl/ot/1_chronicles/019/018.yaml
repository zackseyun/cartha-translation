revisions:
- from: Tumakas ang hukbo ng Aram sa harap ng Israel, at pinatay ni David ang pitong libong kawal ng mga karwahe mula sa Aram at apatnapung libong kawal na naglalakad.[a] Pinatay rin niya si Sofac, ang kumandante ng hukbo.[b]
  to: Tumakas ang hukbo ng Aram palayo sa Israel, at pinatay ni David ang pitong libong kawal ng mga karwahe mula sa Aram at apatnapung libong mga kawal na naglalakad.[a] Pinatay rin niya si Sofac, ang kumandante ng hukbo.[b]
  rationale: Nilinaw ang idyomang Hebreo para sa pagkakataboy ng Aram sa labanan, pinakinis ang parirala para sa impanterya, at ginawang magkakatugma ang transliterasyon ng kaibang anyo ng pangalan. Napanatili ang mga bilang, saklaw ng puwersa, at mga talababa ng audit trail.
