  text: at sina Elisama, Eliada, at Elifelet—siyam lahat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ibig sabihin, sa mga pangalang nakalista sa talata 5–8, siyam lahat ang mga anak na lalaki.
