lexical_decisions:
- source_word: אֱלִישָׁמָע
  choice: Elisama
  rationale: Pangalan ng tao; isinalin sa baybay na natural sa Filipino habang pinananatili ang tunog ng Hebreo.
- source_word: אֶלְיָדָע
  choice: Eliada
  rationale: Pangalan ng tao; ang anyong Eliada ay malinaw at madaling bigkasin sa Filipino.
- source_word: אֱלִיפֶלֶט
  choice: Elifelet
  rationale: Pangalan ng tao; pinananatili ang mas buong anyo ng pangalang Hebreo sa talatang ito.
- source_word: וְ / וֶ
  choice: at / sina
  rationale: Ang mga pang-ugnay na Hebreo ay likas na ipinahayag bilang isang listahan sa Filipino; ginamit ang “sina” para sa maramihang pangalan at “at” bago ang huling pangalan.
- source_word: תִּשְׁעָה
  choice: siyam lahat
  rationale: Ang bilang ay nagsisilbing pangwakas na kabuuan ng mga anak na nakalista sa mga talata 5–8; nilinaw ng “lahat” ang tungkulin nito nang hindi dinaragdagan ang bilang.
