  text: וּ/בְנֵי֙ יְכָנְיָ֣ה אַסִּ֔ר שְׁאַלְתִּיאֵ֖ל בְּנֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/003/017.yaml
  text: 'And the sons of Jeconiah: Assir[a], Shealtiel his son.'
translation:
  language: tl
  text: 'At ang mga anak ni Jeconias: si Asir[a], si Sealtiel na anak niya.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O, “At ang mga anak ni Jeconias na bihag: si Sealtiel na anak niya.” Ang Hebreong אַסִּר ay maaaring basahin bilang pangalang Asir o bilang pangngalang nangangahulugang “bihag.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וּ/בְנֵי
  choice: At ang mga anak ni
  rationale: Pinananatili ng “At” ang pagpapatuloy ng talaangkanan, at ang “mga anak ni” ang likas na salin ng pariralang genealogical.
- source_word: יְכָנְיָה
  choice: Jeconias
  rationale: Ginamit ang anyong pangalan na pamilyar sa tradisyong biblikal sa Filipino, habang tinutumbasan ang Hebreong יְכָנְיָה.
- source_word: אַסִּר
  choice: Asir
  rationale: Sa pangunahing teksto, itinuring itong pangalang pantangi dahil sa anyo ng talaangkanan; gayunman, maaari rin itong unawain bilang pangngalang “bihag,” kaya pinanatili ang alternatibo sa talababa.
- source_word: שְׁאַלְתִּיאֵל
  choice: Sealtiel
  rationale: Malapit na transliterasyon ng pangalang Hebreo sa anyong natural basahin sa Filipino.
- source_word: בְּנוֹ
  choice: na anak niya
  rationale: Likas na Filipino para sa literal na “kanyang anak”; pinananatili rin nito ang posibilidad na si Sealtiel ang anak ni Jeconias ayon sa pagkakalahad.
theological_decisions:
- issue: Kung ang אַסִּר ay pangalang pantangi o katawagang nangangahulugang “bihag”
  choice: Asir bilang pangalang pantangi sa pangunahing teksto
  alternative: '“At ang mga anak ni Jeconias na bihag: si Sealtiel na anak niya.”'
  rationale: Pinahihintulutan ng Hebreo ang dalawang pagbasa. Ang anyo ng talaangkanan ay umaayon sa pagbasa rito bilang pangalan, ngunit hindi tiyak nang sapat upang alisin ang alternatibong pagbasa; kaya inilagay iyon sa talababa.
translation_notes:
  register: Modernong Filipino na may marangal at payak na himig. Ginamit ang “si” sa mga pangalan para sa natural na daloy, at pinanatili sa talababa ang tunay na kalabuan ng Hebreo.
