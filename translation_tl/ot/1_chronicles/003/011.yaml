lexical_decisions:
- source_word: יוֹרָם
  choice: Joram
  rationale: Ginamit ang nakaugaliang anyo ng pangalang ito sa mga saling Tagalog; tumutugma ito sa maikling anyong Hebreo na יוֹרָם.
- source_word: בְּנוֹ
  choice: anak niya
  rationale: Ang בֵּן na may hulaping panghalip para sa ikatlong panauhang panlalaki ay tuwirang nangangahulugang “anak niya.” Bagaman maaari itong tumukoy sa inapo sa ilang talaangkanan, dito ay sunod-sunod na paghahari ng ama at anak ang inilalahad.
- source_word: אֲחַזְיָהוּ
  choice: Ahazias
  rationale: Ginamit ang natural at nakaugaliang anyo ng pangalang biblikal sa Tagalog.
- source_word: יוֹאָשׁ
  choice: Joas
  rationale: Ginamit ang natural at nakaugaliang maikling anyo ng pangalang biblikal sa Tagalog; ang Jehoas ay isa ring anyo ng pangalan.
