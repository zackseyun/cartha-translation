  text: Joram his son[a], Ahaziah his son[c][b], Joash his son.
translation:
  language: tl
  text: Si Joram na anak niya[a], si Ahazias na anak niya, at si Joas na anak niya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa mga talaangkanan, ang salitang Hebreo para sa “anak” ay maaari kung minsan na tumukoy sa isang inapo. Dito, isinalin itong “anak” dahil maikli at sunod-sunod na tala ng mga hari ang ipinapakita ng talata.
    reason: lexical_alternative
  - marker: b
    text: Ang Joas ay tinatawag ding Jehoas sa ibang salin.
