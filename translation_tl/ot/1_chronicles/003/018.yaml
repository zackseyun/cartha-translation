base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/003/018.yaml
  text: Malchiram[a], Pedaiah, Shenazzar, Jekamiah, Hoshama, and Nedabiah.
translation:
  language: tl
  text: at sina Malkiram, Pedaya, Shenazar, Jekamias, Hoshama, at Nedabias.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַלְכִּירָם
  choice: Malkiram
  rationale: Pangalang pantangi sa talaangkanan; tinumbasan ayon sa tunog at anyong Hebreo. Ang k ay tuwirang kumakatawan sa כ at natural sa modernong Filipino.
- source_word: פְדָיָה
  choice: Pedaya
  rationale: Pangalang pantangi; ang hulaping -ya ay madaling basahin sa Filipino at kumakatawan sa maikling teoporikong anyo ng pangalan sa Hebreo.
- source_word: שֶׁנְאַצַּר
  choice: Shenazar
  rationale: Pangalang pantangi; pinananatili ang tunog na Shenazar sa paraang nababasa nang natural sa Filipino, nang hindi pinipilit katawanin sa baybay ang pagdodoble ng katinig sa Masoretikong pagtuldok.
- source_word: יְקַמְיָה
  choice: Jekamias
  rationale: Pangalang pantangi; ginamit ang nakaugaliang anyong Filipino na Jekamias, na malapit sa Hebreong pangalan at madaling makilala sa tradisyong biblikal sa Filipino.
- source_word: הוֹשָׁמָע
  choice: Hoshama
  rationale: Pangalang pantangi; tuwirang transliterasyon na malinaw at natural bigkasin sa Filipino.
- source_word: נְדַבְיָה
  choice: Nedabias
  rationale: Pangalang pantangi; ginamit ang nakaugaliang anyong Filipino na Nedabias, habang nananatiling malinaw ang pagkakaugnay nito sa Hebreong pangalan.
- source_word: וּ / וְ
  choice: at / sina
  rationale: Ang mga pang-ugnay na Hebreo ay nagdurugtong sa mga pangalan. Isinalin ang unang waw bilang 'at' dahil ipinagpapatuloy ng talata ang listahan mula sa naunang bersikulo; ginamit ang 'sina' bilang natural na pananda sa Filipino para sa maramihang pangalang pantangi, at 'at' bago ang huling pangalan.
theological_decisions: []
translation_notes:
  register: Maikli at marangal na estilong talaangkanan sa modernong Filipino. Pinanatili ang pambungad na 'at' sapagkat ang tekstong Hebreo ay nagpapatuloy sa listahan ng nakaraang talata. Gumamit ng mga anyong pangalang madaling basahin at pamilyar sa tradisyong biblikal sa Filipino.
