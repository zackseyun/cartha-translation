lexical_decisions:
- source_word: יִבְחָר
  choice: Ibhar
  rationale: Pangalan ng tao sa talaangkanan; tinumbasan sa pamamagitan ng transliterasyon. Pinananatili ng “Ibhar” ang tunog ng Hebreong yod bilang /y/ sa paraang hindi nangangailangan ng letrang J, na maaaring bigkasin nang /dy/ sa Filipino.
- source_word: אֱלִישָׁמָע
  choice: Elisama
  rationale: 'Likas na anyong Filipino ng transliterasyon: ang Hebreong שׁ ay kinakatawan ng “s” sa halip na Ingles na “sh,” at hindi na isinasama ang huling ayin na karaniwang hindi binibigkas sa mga pangalang biblikal sa Filipino.'
- source_word: אֱלִיפָלֶט
  choice: Elifelet
  rationale: Transliterasyong angkop sa ortograpiyang Filipino; ginagamit ang “f” para sa Hebreong pe na may tunog /f/, habang pinananatili ang mga patinig ng anyong Masoretiko.
- source_word: וְ
  choice: at / sina
  rationale: Ang mga pang-ugnay na nakalapi sa bawat pangalan ay nagsasaad ng koordinasyon sa listahan. Sa natural na Filipino, ang naunang ugnayan sa konteksto ay ipinahahayag sa “at sina,” at inuulit ang “at” bago ang huling pangalan.
theological_decisions: []
translation_notes:
  register: Makabago, marangal, at likas na Filipino para sa isang talaangkanan. Ginamit ang “sina” dahil maramihang pangalan ng mga tao ang kasunod. Ang panimulang “at” ay pinanatili sapagkat nasa tekstong Hebreo ang pang-ugnay at nagpapatuloy ang talahanayan mula sa naunang talata.
