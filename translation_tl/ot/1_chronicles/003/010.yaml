base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/003/010.yaml
  text: And the son of Solomon was Rehoboam; Abijah his son[a], Asa his son, Jehoshaphat his son.
translation:
  language: tl
  text: At ang anak ni Solomon ay si Rehoboam; ang anak niyang si Abias[a], ang anak niyang si Asa, ang anak niyang si Jehosafat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: “Abias.” Sa 1–2 Mga Hari, ang hari ring ito ay tinutukoy sa ibang anyo ng pangalan na “Abiam.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וּ/בֶן שְׁלֹמֹה
  choice: At ang anak ni Solomon
  rationale: Pinananatili ng “At” ang pang-ugnay na ו at ng “ang anak ni Solomon” ang estilong talaangkanan ng pariralang construct na בֶן שְׁלֹמֹה.
- source_word: רְחַבְעָם
  choice: Rehoboam
  rationale: Karaniwang anyo ng pangalang Hebreo sa makabagong saling Tagalog.
- source_word: אֲבִיָּה
  choice: Abias
  rationale: Itinatapat sa tradisyonal at madaling makilalang anyong Tagalog ng pangalang אֲבִיָּה; hindi ito pinapalitan ng anyong Abiam na matatagpuan sa ilang konteksto ng Mga Hari.
- source_word: בְנ/וֹ
  choice: ang anak niyang si
  rationale: Likas sa Tagalog ang konstruksiyong ito para sa pangngalang may ikatlong panauhang panlalaking hulapi, habang pinananatili ang paulit-ulit na indayog ng talaangkanan.
- source_word: אָסָא
  choice: Asa
  rationale: Karaniwang transliterasyon ng pangalang Hebreo sa Tagalog.
- source_word: יְהוֹשָׁפָט
  choice: Jehosafat
  rationale: Karaniwang anyong Tagalog ng pangalang Hebreo.
