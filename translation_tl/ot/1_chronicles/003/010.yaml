  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang maikli at paulit-ulit na anyo ng talaangkanan, ngunit ginamit ang likas na ayos na “ang anak niyang si” para hindi maging malamya sa Tagalog.
