  text: All these were David’s sons[a], besides the sons of the concubines; and Tamar was their sister.
translation:
  language: tl
  text: Lahat ng ito ay mga anak na lalaki ni David[a], bukod sa mga anak na lalaki ng mga konkubina; at si Tamar ang kanilang kapatid na babae.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “Lahat ng ito ay mga anak na lalaki ni David, hindi kabilang ang mga anak na lalaki ng mga konkubina.” Maaaring unawain ang pariralang Hebreo bilang hindi pagsasama sa mga anak na iyon sa naunang kabuuan, o bilang pagbanggit sa kanila bilang karagdagan sa pangunahing tala.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל
  choice: Ang lahat ng ito
  rationale: Ipinahihiwatig ng כֹּל ang kabuuan ng mga pangalang naunang itinala; likas sa Filipino ang “Ang lahat ng ito” bilang pagbubuod.
- source_word: בְּנֵי דָוִיד
  choice: mga anak na lalaki ni David
  rationale: Tiyak na panlalaking maramihan ang בְּנֵי, kaya pinanatili ang kasarian sa halip na gamitin lamang ang mas malawak na “mga anak.”
- source_word: מִלְּבַד
  choice: bukod pa sa
  rationale: Maaaring magpahiwatig ang salita ng pagbubukod o ng pagbanggit sa mga nasa labas ng pangunahing tala. Pinananatili ng “bukod pa sa” ang likas na kalabuan nito nang hindi tahasang nagpapasya kung kasama sila sa isang kabuuang bilang.
- source_word: בְּנֵי פִילַגְשִׁים
  choice: mga anak na lalaki ng kanyang mga asawang-lingkod
  rationale: Pinananatili ang panlalaking anyo ng בְּנֵי. Idinagdag ang “kanyang” ayon sa malinaw na konteksto upang hindi mapagkamalan kung kaninong sambahayan ang tinutukoy.
- source_word: פִילַגְשִׁים
  choice: mga asawang-lingkod
  rationale: Tinutukoy nito ang mga babaeng kinikilalang kabiyak ngunit may mas mababang katayuan kaysa pangunahing asawa. Mas malinaw at mas dignipikado sa karaniwang modernong Filipino ang “asawang-lingkod” kaysa sa hiram at maaaring di-pamilyar na “konkubina.”
- source_word: וְתָמָר
  choice: at si Tamar
  rationale: Payak na pang-ugnay at pangalang pantangi; ginamit ang karaniwang anyo ng pangalan at ang panandang personal na “si.”
- source_word: אֲחוֹתָם
  choice: kapatid nilang babae
  rationale: Tiyak na pambabae ang אֲחוֹת. Nililinaw ng “kapatid na babae” ang kasarian na hayag sa Hebreo, samantalang karaniwang walang kasarian ang salitang Filipino na “kapatid.”
