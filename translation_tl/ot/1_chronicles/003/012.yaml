  text: אֲמַצְיָ֧הוּ בְנ֛/וֹ עֲזַרְיָ֥ה בְנ֖/וֹ יוֹתָ֥ם בְּנֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/003/012.yaml
  text: Amaziah his son[a], Azariah his son, Jotham his son.
translation:
  language: tl
  text: Amasias na anak niya, Azarias[a] na anak niya, Jotam na anak niya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “Azarias”; ang haring ito ay kilala rin sa ibang mga talata bilang Uzias.
    reason: Ipinababatid ang alternatibong pangalan nang hindi pinapalitan ang pangalang nasa tekstong Hebreo. Inilagay ang pananda pagkatapos ng “Azarias,” ang pangalang tinutukoy ng talababa.
lexical_decisions:
- source_word: אֲמַצְיָהוּ
  choice: Amasias
  rationale: Pangalan ng tao; ginamit ang nakasanayang anyong Filipino na malapit sa pangalang Hebreo.
- source_word: בְנוֹ
  choice: anak niya
  rationale: Ang בֵּן na may hulaping ikatlong panauhang panlalaki ay tuwirang nangangahulugang “anak niya.” Bagaman maaaring lumaktaw ng mga salinlahi ang ilang talaangkanan, walang dahilan dito upang palitan ito ng mas malawak na “inapo niya.”
- source_word: עֲזַרְיָה
  choice: Azarias
  rationale: Sinusunod ang mismong anyo ng pangalan sa tekstong Hebreo sa halip na ihanay ito sa alternatibong pangalang Uzias.
- source_word: יוֹתָם
  choice: Jotam
  rationale: Pangalan ng tao; ginamit ang malinaw at nakasanayang anyong Filipino.
theological_decisions:
- issue: Wikang nagsasaad ng ugnayang ama at anak sa talaangkanan ng mga hari
  choice: Panatilihin ang “anak niya” sa bawat paglitaw.
  alternative: Gamitin ang “inapo niya” upang isaalang-alang ang posibleng paglaktaw ng mga salinlahi.
  rationale: Tatlong ulit na tahasang ginagamit ng Hebreo ang בְנוֹ (“anak niya”). Pinananatili nito ang anyo ng pinagmulan nang hindi ipinapasok ang interpretasyong may nilaktawang salinlahi.
- issue: Pagkakakilanlan ni Azarias bilang Uzias
  choice: Gamitin sa pangunahing teksto ang “Azarias” at ilagay sa talababa ang alternatibong pangalang “Uzias.”
  alternative: Gamitin ang “Uzias” sa pangunahing teksto upang itugma sa ibang mga talata.
  rationale: עֲזַרְיָה ang mismong pangalang nasa talatang ito. Ang paggamit ng Uzias sa pangunahing teksto ay magpapalit sa malinaw na pagbasa ng pinagmulan para sa layuning pag-isahin ang mga pangalan.
translation_notes:
  register: Maikli at marangal na modernong Filipino, ayon sa paulit-ulit na pormula ng talaangkanan. Hindi na idinagdag ang “si” upang mapanatili ang payak na anyo ng magkakasunod na pangalan sa pinagmulan.
