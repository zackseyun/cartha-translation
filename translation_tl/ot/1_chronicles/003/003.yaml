base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/003/003.yaml
  text: the fifth[a], Shephatiah, by Abital; the sixth, Ithream[b], by Eglah his wife.
translation:
  language: tl
  text: ang ikalima, si Sefatias, na anak ni Abital[a]; ang ikaanim, si Itream, na anak ni Egla, na asawa ni David.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “kay Abital.” Sa ganitong talaan ng angkan, ang ibig sabihin ay ipinanganak siya kay Abital, o si Abital ang kanyang ina. Gayundin ang pormula para kay Egla sa kasunod na parirala.
    reason: lexical_alternative
  - marker: b
    text: Iniuugnay ng ilang tagapagpaliwanag si Egla kay Mical, ngunit hindi ito sinasabi ng mismong teksto.
    reason: alternative_reading
lexical_decisions:
- source_word: הַחֲמִישִׁי
  choice: ang ikalima
  rationale: Tiyak na pamilang na nagpapatuloy sa nakaayos na talaan ng mga anak ni David.
- source_word: שְׁפַטְיָה
  choice: Sefatias
  rationale: Isinatinig ang pangalang Hebreo sa anyong natural at madaling basahin sa Filipino.
- source_word: לַאֲבִיטָל
  choice: na anak ni Abital
  rationale: Sa pormulang pangangkanan, ipinahihiwatig ng pang-ukol na ל ang pagiging ina; malinaw at likas sa Filipino ang 'anak ni' nang hindi gumagamit ng di-natural na literal na anyo.
- source_word: הַשִּׁשִּׁי
  choice: ang ikaanim
  rationale: Pinananatili ang pagkakapantay ng balangkas at ang pagkakasunod-sunod ng talaan.
- source_word: יִתְרְעָם
  choice: Itream
  rationale: Isinatinig ang personal na pangalan sa anyong angkop sa makabagong Filipino.
- source_word: לְעֶגְלָה
  choice: na anak ni Egla
  rationale: Gaya ng naunang parirala, ang ל sa kontekstong pangangkanan ay nagpapakilala sa ina ng anak.
- source_word: אִשְׁתּוֹ
  choice: na asawa niya
  rationale: Karaniwang kahulugan ng אִשָּׁה na may hulaping panlalaking isahan; pinakamalapit na tinutukoy si Egla, at si David ang tinutukoy ng 'niya' ayon sa konteksto.
theological_decisions:
- issue: Tinutukoy ng “asawa niya” at pagkakakilanlan ni Egla
  choice: Pinanatili ang tuwirang pahayag na si Egla ay asawa ni David, nang hindi siya iniuugnay kay Mical o binibigyan ng natatanging katayuan.
  alternative: Kilalanin si Egla bilang si Mical, o ipakahulugang may natatanging ranggo siya sa mga asawa ni David.
  rationale: Sinasabi lamang ng tekstong Hebreo na “Egla, na asawa niya.” Hindi nito ipinaliliwanag kung bakit idinagdag ang katawagang ito, kaya hindi dapat lutasin sa salin ang hindi sinasabi ng teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang paulit-ulit na hulma na “ang ikalima/ikaanim, si …, na anak ni …” upang mapanatili ang anyo ng talaang pangangkanan habang maging natural sa karaniwang mambabasa.
