lexical_decisions:
- source_word: אָחָז
  choice: Ahaz
  rationale: Pangngalang pantangi; ginamit ang anyong karaniwang kinikilala sa makabagong salin sa Filipino.
- source_word: בְּנוֹ
  choice: na kanyang anak
  rationale: Ang בֵּן na may hulaping pangatlong panauhang panlalaki ay tuwirang nangangahulugang “kanyang anak.” Pinananatili ng pariralang ito ang paulit-ulit na pormula ng talaangkanan.
- source_word: חִזְקִיָּהוּ
  choice: Ezequias
  rationale: Pangngalang pantangi; ginamit ang nakasanayang anyong Filipino para sa pagkilala at maayos na pagbasa.
- source_word: בְנוֹ
  choice: na kanyang anak
  rationale: Isinalin nang pare-pareho upang mapanatili ang estruktura at pag-uulit ng Hebreo.
- source_word: מְנַשֶּׁה
  choice: Manases
  rationale: Pangngalang pantangi; ginamit ang nakasanayang anyong Filipino.
- source_word: בְנוֹ
  choice: na kanyang anak
  rationale: Pinanatili ang literal at pare-parehong pormula ng talaangkanan; hindi ito pinalawak bilang “inapo” sa pangunahing teksto.
