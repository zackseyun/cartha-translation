translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “sina” para sa natural na pagpapakilala ng sunud-sunod na pangalan. Isina-Filipino ang ilang pangalang nagtatapos sa karaniwang Ingles na -iah bilang -ias, habang pinanatili ang ibang matatag at madaling basahing transliterasyon.
