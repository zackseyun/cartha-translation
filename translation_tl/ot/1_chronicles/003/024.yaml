base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/003/024.yaml
  text: 'And the sons of Elyoenai: Hodaviah[a], Eliashib, Pelaiah, Akkub, Johanan, Delaiah, and Anani—seven.'
translation:
  language: tl
  text: At ang mga anak na lalaki ni Elyoenai ay sina Hodavias[a], Eliashib, Pelaias, Akkub, Johanan, Delaias, at Anani—pito silang lahat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Di-pangkaraniwan ang baybay ng unang pangalang nakatala sa Hebreo. Ang “Hodavias” ay sumusunod sa pinakalamang na nakasanayang pagkakakilanlan; maaari ring basahin itong “Hodias” o transliterahing mas literal bilang “Hodevahu.”
    reason: textual_variant
lexical_decisions:
- source_word: וּבְנֵי
  choice: At ang mga anak ni
  rationale: Ang בְּנֵי ay construct plural na karaniwang tumutukoy sa “mga anak na lalaki” sa talaangkanan. Ginamit ang natural na Filipino na “mga anak,” habang pinananatili ng “At” ang pagpapatuloy ng listahan.
- source_word: אֶלְיוֹעֵינַי
  choice: Elyoenai
  rationale: Pangalang pantangi ito; ang anyo ay malapit sa bigkas na ipinahihiwatig ng Hebreong teksto.
- source_word: הדיוהו
  choice: Hodavias
  rationale: Di-pangkaraniwan ang baybay sa Hebreo. Ginamit ang nakasanayang anyong Filipino ng pinakalamang na pagkakakilanlang Hodaviah, at itinabi sa talababa ang kawalang-katiyakan.
- source_word: וְאֶלְיָשִׁיב
  choice: Eliashib
  rationale: Tuwirang transliterasyon ng pangalang pantangi ayon sa karaniwang anyo.
- source_word: וּפְלָיָה
  choice: Pelaias
  rationale: Pangalang pantangi; isina-Filipino ang karaniwang transliterasyong Pelaiah bilang Pelaias.
- source_word: וְעַקּוּב
  choice: Akkub
  rationale: Pinananatili ng dobleng k ang mariing katinig sa Hebreo nang hindi nagiging mahirap basahin sa Filipino.
- source_word: וְיוֹחָנָן
  choice: Johanan
  rationale: Karaniwang transliterasyon ng maikling anyo ng pangalang Hebreo.
- source_word: וּדְלָיָה
  choice: Delaias
  rationale: Pangalang pantangi; isina-Filipino ang karaniwang anyong Delaiah.
- source_word: וַעֲנָנִי
  choice: at Anani
  rationale: Isinalin ang pang-ugnay bago ang huling pangalan upang maging natural ang talaan sa Filipino.
- source_word: שִׁבְעָה
  choice: pito lahat
  rationale: Malinaw na pinananatili ang bilang na nagsisilbing kabuuang tala, sa natural na pariralang Filipino.
