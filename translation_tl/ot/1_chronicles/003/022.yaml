    issue: Ang pangalang “Barias” ay dapat na “Bariah.”
    rationale: Ang Masoretikong teksto ay may בָרִיחַ, na iniaudit sa English POB bilang “Bariah.” Ang -s sa “Barias” ay walang katumbas sa pangalan sa pinagmulan at maaaring makapagpalit ng pagkakakilanlan ng pangalan.
  - severity: low
