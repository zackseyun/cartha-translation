base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/003/022.yaml
  text: 'And the sons of Shecaniah: Shemaiah. And the sons of Shemaiah: Hattush[a], Igal, Bariah, Neariah, and Shaphat—six.'
translation:
  language: tl
  text: At ang mga anak ni Shecanias ay si Semaias. Ang mga anak naman ni Semaias ay sina Hatus[a], Igal, Bariah, Nearias, at Safat—anim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Anim” ang nakasulat sa tekstong Hebreo, ngunit limang pangalan lamang ang nakalista rito sa Tekstong Masoretiko. Maaaring may suliranin sa teksto o may pangalang nawala sa proseso ng pagkopya.
    reason: textual_variant
lexical_decisions:
- source_word: וּבְנֵי
  choice: At ang mga anak ni
  rationale: Tuwirang isinasalin ang anyong pangkanununuan na בְּנֵי bilang “mga anak,” habang pinananatili ng “At” ang pang-ugnay na וּ.
- source_word: שְׁכַנְיָה
  choice: Shecanias
  rationale: Pangngalang pantangi na tinumbasan ayon sa karaniwang anyong Filipino ng mga pangalang biblikal.
- source_word: שְׁמַעְיָה
  choice: Semaias
  rationale: Pangngalang pantangi na isina-Filipino ang baybay at ginamit nang pare-pareho sa dalawang paglitaw.
- source_word: חַטּוּשׁ
  choice: Hatus
  rationale: Malapit na transliterasyong angkop sa makabagong bigkas at baybay sa Filipino.
- source_word: יִגְאָל
  choice: Igal
  rationale: Pinananatili ang kumbensiyonal at madaling basahing anyo ng pangalan.
- source_word: בָרִיחַ
  choice: Barias
  rationale: Sinusundan ang mismong anyong Masoretiko sa talata at hindi ipinapalit ang mas pamilyar ngunit ibang pangalang Berias.
- source_word: נְעַרְיָה
  choice: Nearias
  rationale: Isina-Filipino ang transliterasyon ng pangalang pantangi.
- source_word: שָׁפָט
  choice: Safat
  rationale: Isina-Filipino ang tunog ng Hebreong pangalan sa malinaw at likas na baybay.
- source_word: שִׁשָּׁה
  choice: anim
  rationale: Tuwirang pinanatili ang bilang sa tekstong Hebreo kahit limang pangalan lamang ang nakatala.
