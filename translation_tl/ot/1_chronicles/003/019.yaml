base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/003/019.yaml
  text: 'The sons of Pedaiah: Zerubbabel and Shimei[a]. And the sons of Zerubbabel: Meshullam and Hananiah; and Shelomith was their sister.'
translation:
  language: tl
  text: Ang mga anak ni Pedaias ay sina Zerubabel at Simei. At ang mga anak ni Zerubabel[a] ay sina Mesulam at Hananias; kapatid nilang babae si Selomit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo, isahan ang mababasa: “ang anak ni Zerubabel.” Ngunit dahil sina Mesulam at Hananias ang kasunod na binanggit, nauunawaan ito ng marami bilang iregularidad sa teksto o bilang gamit sa talaangkanan na may kolektibong diwa; kaya “mga anak ni Zerubabel” ang nasa pangunahing teksto.'
    reason: textual_variant
lexical_decisions:
- source_word: וּבְנֵי פְדָיָה
  choice: Ang mga anak ni Pedaias
  rationale: Sa talaangkanan, ang בְּנֵי ay likas na tumutukoy sa mga anak na lalaki. Hindi na tahasang isinalin ang panimulang וּ upang maging natural ang paglipat sa bagong pangkat sa Filipino.
- source_word: זְרֻבָּבֶל וְשִׁמְעִי
  choice: sina Zerubabel at Simei
  rationale: Ginamit ang pantukoy na “sina” para sa dalawang personal na pangalan at pinanatili ang payak na pag-uugnay ng mga ito.
- source_word: וּבֶן זְרֻבָּבֶל
  choice: At ang mga anak ni Zerubabel[a]
  rationale: Isahan ang anyong בֶן sa tekstong Hebreo, ngunit dalawang lalaking pangalan ang kasunod at tinukoy rin ang kanilang kapatid na babae. Ginamit sa pangunahing teksto ang maramihan bilang pinakamalinaw na diwa ng talaan, habang pinanatili sa talababa ang tunay na iregularidad ng teksto.
- source_word: מְשֻׁלָּם וַחֲנַנְיָה
  choice: sina Mesulam at Hananias
  rationale: Isinalin ang dalawang pangalan ayon sa karaniwang anyong Filipino at ginamit ang “sina” para sa natural na talaan ng mga pangalan.
- source_word: וּשְׁלֹמִית אֲחוֹתָם
  choice: kapatid nilang babae si Selomit
  rationale: Ang hulaping maramihan sa אֲחוֹתָם ay tumutukoy nang pinakamalapit kina Mesulam at Hananias. Ang ayos na ito ay natural sa Filipino at malinaw na ipinahahayag na si Selomit ang kanilang kapatid na babae.
