translation_notes:
  register: Makabago, malinaw, at marangal na Filipino; ginamit ang karaniwang biblikal na anyong Filipino ng mga pangalan. Pinanatili sa talababa ang pag-igting sa pagitan ng isahang anyo sa Hebreo at ng maramihang listahang kasunod nito.
