  text: וְ/אֵ֥לֶּה נוּלְּדוּ ל֖/וֹ בִּ/ירוּשָׁלָ֑יִם שִׁ֠מְעָא וְ/שׁוֹבָ֞ב וְ/נָתָ֤ן וּ/שְׁלֹמֹה֙ אַרְבָּעָ֔ה לְ/בַת שׁ֖וּעַ בַּת עַמִּיאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/003/005.yaml
  text: 'These were born to him in Jerusalem: Shimea[a], Shobab, Nathan[b], and Solomon—four by Bath-shua daughter of Ammiel.'
translation:
  language: tl
  text: 'Ito ang mga isinilang sa kaniya sa Jerusalem: sina Simea[a], Sobab, Natan, at Solomon—apat na anak kay Bat-sua[b], na anak na babae ni Amiel.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa katumbas na tala sa 2 Samuel 5:14, Samua ang anyo ng pangalang ito.
    reason: textual_variant
  - marker: b
    text: Sa 2 Samuel 11:3 at kaugnay na mga talata, tinatawag siyang Batseba, na anak na babae ni Eliam.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Ang mga ito
  rationale: Likas na panimula sa susunod na pangkat ng talaangkanan at pinananatili ang puwersa ng demonstratibo.
- source_word: נוּלְּדוּ לוֹ
  choice: ang isinilang sa kaniya
  rationale: Pinananatili ang pasibong anyo ng Niphal at ang panghalip na tumutukoy kay David ayon sa konteksto, nang hindi inuulit ang pangalan niya.
- source_word: בִּירוּשָׁלָיִם
  choice: sa Jerusalem
  rationale: Tuwirang pariralang panlunan na nagsasaad kung saan isinilang ang mga anak.
- source_word: שִׁמְעָא
  choice: Simea
  rationale: Itinatanghal ang anyo ng pangalan sa tekstong Hebreo ng Mga Cronica, sa halip na itugma ito sa anyong nasa 2 Samuel.
- source_word: שׁוֹבָב
  choice: Sobab
  rationale: Karaniwang anyong Filipino ng pangalang Hebreo.
- source_word: נָתָן
  choice: Natan
  rationale: Karaniwang anyong Filipino ng pangalang Hebreo.
- source_word: שְׁלֹמֹה
  choice: Solomon
  rationale: Ginagamit ang nakasanayang anyong Filipino para sa kilalang hari.
- source_word: אַרְבָּעָה
  choice: apat
  rationale: Binubuod nito ang apat na anak na kababanggit lamang.
- source_word: לְבַת שׁוּעַ
  choice: apat na anak kay Bat-sua
  rationale: Sa natural na Tagalog, ipinahihiwatig ng “anak kay” na si Bat-sua ang ina ng apat, nang hindi gumagamit ng artipisyal na literalismo.
- source_word: בַּת עַמִּיאֵל
  choice: na anak na babae ni Amiel
  rationale: Malinaw na ipinahahayag ang ugnayang anak at ama at iniiwasan ang posibleng kalabuan ng payak na “anak ni.”
theological_decisions:
- issue: Anyo ng pangalan ng asawa ni David sa Mga Cronica kumpara sa katumbas na salaysay sa Samuel
  choice: Bat-sua, na anak na babae ni Amiel
  alternative: Batseba, na anak na babae ni Eliam
  rationale: Sinusunod ng salin ang mismong anyo sa tekstong Hebreo ng Mga Cronica at hindi ito tahimik na itinutugma sa 2 Samuel. Inilalagay sa talababa ang kilalang katumbas na anyo.
- issue: Anyo ng pangalan ni Simea kumpara sa katumbas na salaysay sa 2 Samuel 5:14
  choice: Simea
  alternative: Samua
  rationale: Ang WLC sa talatang ito ay may שִׁמְעָא, kaya iyon ang isinasalin sa pangunahing teksto; pinananatili sa talababa ang variant sa katumbas na salaysay.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “sina” sa listahan ng mga pangalan at ang natural na pariralang “apat na anak kay Bat-sua.” Itinama ang pagkakaugnay ng mga pananda ng talababa upang ang [a] ay tumukoy kay Simea at ang [b] kay Bat-sua.
