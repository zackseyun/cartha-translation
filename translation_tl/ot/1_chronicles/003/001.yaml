reference: 1 Chronicles 3:1
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/אֵ֤לֶּה הָיוּ֙ בְּנֵ֣י דָויִ֔ד אֲשֶׁ֥ר נֽוֹלַד ל֖/וֹ בְּ/חֶבְר֑וֹן הַ/בְּכ֣וֹר אַמְנֹ֗ן לַ/אֲחִינֹ֨עַם֙ הַ/יִּזְרְעֵאלִ֔ית שֵׁנִי֙ דָּנִיֵּ֔אל לַ/אֲבִיגַ֖יִל הַֽ/כַּרְמְלִֽית־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/003/001.yaml
  text: 'These were David’s sons who were born to him in Hebron: the firstborn[a], Amnon, by Ahinoam the Jezreelite; the second, Daniel, by Abigail the Carmelite.'
translation:
  language: tl
  text: 'Ito ang mga anak na lalaki ni David na ipinanganak sa kaniya sa Hebron: ang panganay[a] ay si Amnon, na anak niya kay Ahinoam na taga-Jezreel; ang ikalawa ay si Daniel, na anak niya kay Abigail na taga-Carmel.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa katulad na talaan sa 2 Samuel 3:3, Chileab ang tawag sa anak na ito sa halip na Daniel.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאֵלֶּה הָיוּ
  choice: Ito ang mga
  rationale: Natural na panimula ng talaan sa Filipino; ipinahihiwatig ng konteksto ang kaugnayan sa nauna nang hindi nagdaragdag ng temporal na “ngayon.”
- source_word: בְּנֵי דָוִיד
  choice: mga anak ni David
  rationale: Sa kontekstong ito, ang בְּנֵי ay tumutukoy sa mga lalaking anak; likas sa Filipino ang “mga anak ni David,” at nililinaw ng kasunod na mga pangalang panlalaki ang kasarian.
- source_word: אֲשֶׁר נוֹלַד לוֹ
  choice: na ipinanganak sa kaniya
  rationale: Pinananatili ang pasibong anyo ng נולד at ang kaugnayang ipinahahayag ng לוֹ, sa halip na gawing tahasang aktibong “naging anak niya.”
- source_word: בְּחֶבְרוֹן
  choice: sa Hebron
  rationale: Karaniwang lokatibong salin ng בְּ bago ang pangalan ng lungsod.
- source_word: הַבְּכוֹר
  choice: ang panganay
  rationale: Ang “panganay” ang natural na katumbas sa Filipino at pinananatili ang genealogical na katayuan, hindi lamang ang pagkakasunod sa edad.
- source_word: לַאֲחִינֹעַם הַיִּזְרְעֵאלִית
  choice: na anak niya kay Ahinoam na taga-Jezreel
  rationale: Sa pormulang genealogical, ipinakikilala ng לְ ang ina. Ang “anak niya kay” ay malinaw at natural sa modernong Filipino, at ang pambabaeng gentiliko ay maayos na naihahayag bilang “taga-Jezreel.”
- source_word: שֵׁנִי דָּנִיֵּאל
  choice: ang ikalawa ay si Daniel
  rationale: Pinananatili ang ordinal na ayos at natural na ipinakikilala ang personal na pangalan sa Filipino gamit ang “si.”
- source_word: לַאֲבִיגַיִל הַכַּרְמְלִית
  choice: na anak niya kay Abigail na taga-Carmel
  rationale: Kaparehong pormulang genealogical; ang “taga-Carmel” ay malinaw at kasalukuyang paraan ng pagtukoy sa pinagmulan.
theological_decisions:
- issue: Magkaibang pangalan sa magkatulad na talaan
  choice: Pinanatili sa pangunahing teksto ang “Daniel,” ayon sa tekstong Hebreo ng 1 Cronica 3:1.
  alternative: Chileab, ayon sa 2 Samuel 3:3.
  rationale: Hindi dapat pagtugmain nang palihim ang dalawang anyo; ang pagkakaiba ay tapat na itinatala sa talababa.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “anak niya kay” upang likas na tukuyin ang ina, at “taga-Jezreel/taga-Carmel” sa halip na mga arkaikong anyong gentiliko.
