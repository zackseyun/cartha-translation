base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/003/004.yaml
  text: Six were born to him in Hebron, and he reigned there seven years and six months; and in Jerusalem he reigned thirty-three years.
translation:
  language: tl
  text: Anim ang ipinanganak sa kaniya sa Hebron. Doon ay naghari siya nang pitong taon at anim na buwan, at sa Jerusalem ay naghari siya nang tatlumpu't tatlong taon.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שִׁשָּׁה
  choice: Anim
  rationale: Ang bilang ay nagsisilbing buod ng anim na anak na katatapos lamang ilista. Hindi idinagdag ang “Ang anim na ito” sapagkat hindi tahasang nasa Hebreo ang demonstratibo.
- source_word: נוֹלַד לוֹ
  choice: ang ipinanganak sa kaniya
  rationale: Pinananatili ang pasibong anyo ng ילד at ang diwa ng לֹו; mas malapit ito sa Hebreo kaysa sa aktibong “naging anak niya” o “ipinanganak niya.”
- source_word: בְחֶבְרוֹן
  choice: sa Hebron
  rationale: Likas na locative na salin ng pang-ukol at pangalan ng lugar.
- source_word: וַיִּמְלָךְ שָׁם
  choice: Doon ay naghari siya
  rationale: Ang מלך sa konteksto ay tumutukoy sa paghahari, at ang “doon” ay malinaw na tumutukoy sa Hebron.
- source_word: שֶׁבַע שָׁנִים וְשִׁשָּׁה חֳדָשִׁים
  choice: nang pitong taon at anim na buwan
  rationale: Ginamit ang “nang” upang natural na ipahayag sa Filipino ang tagal ng paghahari.
- source_word: וּשְׁלֹשִׁים וְשָׁלוֹשׁ שָׁנָה
  choice: tatlumpu't tatlong taon
  rationale: Natural na modernong Filipino para sa Hebreong tambalang bilang; maramihan ang “taon” ayon sa kahulugan.
- source_word: מָלַךְ בִּירוּשָׁלִָם
  choice: sa Jerusalem ay naghari siya
  rationale: Pinananatili ang diin ng Hebreo sa bagong lokasyon habang nananatiling natural at malinaw sa Filipino.
