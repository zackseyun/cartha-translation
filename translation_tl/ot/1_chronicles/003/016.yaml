  yaml_path: translation/ot/1_chronicles/003/016.yaml
  text: 'And the sons of Jehoiakim: Jeconiah his son[a], Zedekiah his son.'
translation:
  language: tl
  text: 'At ang mga anak ni Jehoiakim: si Jeconias na anak niya,[a] si Zedekias na anak niya.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maikli ang Hebreo: “si Jeconias na anak niya, si Zedekias na anak niya.” Maaaring ito ay payak na pagkakasunod-sunod ng salinlahi. Gayunman, magkakaiba ang pagkaunawa kung kapwa anak ni Jehoiakim ang dalawang binanggit o kung si Zedekias ay anak ni Jeconias ayon sa pagkakasabi rito.'
    reason: alternative_reading
lexical_decisions:
- source_word: וּ/בְנֵי
  choice: At ang mga anak ni
  rationale: Ang בְּנֵי ay construct plural na nangangahulugang “mga anak na lalaki ni”; sa kontekstong talaangkanan, natural sa modernong Tagalog ang “mga anak ni.” Pinanatili ang ו bilang “At” upang maipakita ang pagpapatuloy ng tala.
- source_word: יְהוֹיָקִים
  choice: Jehoiakim
  rationale: Isinalin sa baybay na karaniwang ginagamit sa mga saling Filipino para sa pangalang Hebreo.
- source_word: יְכָנְיָה
  choice: Jeconias
  rationale: Ginamit ang nakaugaliang anyong Filipino ng pangalang יְכָנְיָה, sa halip na ang anyong Ingles na “Jeconiah.”
- source_word: בְנ֖/וֹ
  choice: anak niya
  rationale: Tuwirang ipinahahayag ng pangngalang בֵּן na may panlaping ikatlong panauhang panlalaki ang “anak niya.” Hindi ito pinaikli upang mapanatili ang paulit-ulit at maigsi ngunit malabong kayarian ng Hebreo.
- source_word: צִדְקִיָּה
  choice: Zedekias
  rationale: Ginamit ang nakaugaliang anyong Filipino ng pangalang Hebreo.
- source_word: בְנֽ/וֹ
  choice: anak niya
  rationale: Pinanatili nang tahasan ang ikalawang pagbanggit sa “anak niya,” gaya ng Hebreo, nang hindi ipinapasiya sa salin kung kanino tumutukoy ang panghalip.
theological_decisions:
- issue: Malabong ugnayan sa talaangkanan dahil sa maigsi at sunod-sunod na pariralang Hebreo
  choice: 'Pinanatili ang literal na ayos: “si Jeconias na anak niya, at si Zedekias na anak niya.”'
  alternative: Maaaring unawain na kapwa anak ni Jehoiakim sina Jeconias at Zedekias; maaari ring unawain ang ikalawang “anak niya” bilang pagtukoy kay Jeconias, kaya sunod-sunod ang salinlahi.
  rationale: Hindi malinaw na tinutukoy ng tekstong Hebreo ang antecedent ng ikalawang panlaping “niya.” Ang pagpapanatili sa kayarian nito, kalakip ang talababa, ay umiiwas sa sapilitang pag-aayon sa ibang salaysay o sa pagpapasya sa isang ugnayang hindi tahasang nilulutas ng talata.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang anyong talaangkanan at ang tunay na kalabuan ng orihinal; ginamit ang “anak” sa halip na “anak na lalaki” sapagkat malinaw sa mga pangalang panlalaki ang tinutukoy at mas natural ito sa Tagalog.
