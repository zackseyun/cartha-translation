base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/003/002.yaml
  text: the third[a], Absalom son of Maacah, daughter of Talmai king of Geshur; the fourth, Adonijah son of Haggith.
translation:
  language: tl
  text: ang ikatlo[a] ay si Absalom na anak ni Maaca, na anak na babae ni Talmai na hari ng Gesur; ang ikaapat ay si Adonias na anak ni Haguit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O maaaring “babaeng inapo ni Talmai,” sapagkat sa mga talaangkanan, ang “anak na babae” ay maaari ring tumukoy sa isang babaeng inapo mula sa mas malayong salinlahi. Gayunman, ang pinakatuwirang kahulugan ng Hebreo rito ay “anak na babae ni Talmai na hari ng Gesur.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַ/שְּׁלִשִׁי
  choice: ang ikatlo
  rationale: Ang ordinal na may pantukoy ay nagpapatuloy sa talaan ng mga anak ni David; likas sa Filipino ang “ang ikatlo.”
- source_word: לְ/אַבְשָׁלוֹם
  choice: si Absalom
  rationale: Isinalin ang לְ bilang panandang nag-uugnay sa ordinal at sa pangalan; ginamit ang “si” na likas na pantukoy sa pangalan ng tao sa Filipino.
- source_word: בֶּן
  choice: anak ni
  rationale: Tumutukoy sa ugnayang magulang-anak. Sapat na ang “anak ni” dahil malinaw na lalaki si Absalom sa konteksto at mas natural ito kaysa “lalaking anak ni.”
- source_word: מַעֲכָה
  choice: Maaca
  rationale: Transliterasyon ng pangalang Hebreo sa anyong madaling bigkasin sa Filipino.
- source_word: בַּת
  choice: anak na babae ni
  rationale: Pinananatili ang tuwirang kahulugan ng Hebreo at nililinaw na babae ang tinutukoy; maaaring mas malawak ang gamit nito sa ilang talaangkanan, kaya nilagyan ng talababa.
- source_word: תַּלְמַי
  choice: Talmai
  rationale: Transliterasyon ng pangalang pantangi.
- source_word: מֶלֶךְ גְּשׁוּר
  choice: hari ng Gesur
  rationale: Tumpak at natural na pagpapahayag ng katayuang maharlika ni Talmai at ng kahariang pinamumunuan niya.
- source_word: הָ/רְבִיעִי
  choice: ang ikaapat
  rationale: Ang ordinal na may pantukoy ay nagpapatuloy sa estruktura ng talaan.
- source_word: אֲדֹנִיָּה
  choice: Adonias
  rationale: Transliterasyon sa karaniwang anyong Filipino ng pangalan.
- source_word: חַגִּית
  choice: Haguit
  rationale: Transliterasyon ng pangalang Hebreo sa ortograpiyang madaling basahin sa Filipino.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Iningatan ang maikli at sunod-sunod na anyo ng talaangkanan, habang gumamit ng “ay si” at “anak ni” para sa likas na daloy. Ang kuwit at sugnay na “na anak na babae ni Talmai” ay naglilinaw na si Maaca, hindi si Absalom, ang anak na babae ni Talmai.
