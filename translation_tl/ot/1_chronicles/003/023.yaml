  register: Maikli at marangal na estilong angkop sa talaangkanan, gamit ang natural na modernong Filipino. Ginamit ang “sina” bago ang serye ng mga pangalan at pinanatili ang pangwakas na bilang para maipakita ang anyo at diin ng Hebreo.
