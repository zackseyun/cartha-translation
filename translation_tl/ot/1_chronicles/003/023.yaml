  text: 'The sons of Neariah: Elioenai[a], Hezekiah, and Azrikam—three.'
translation:
  language: tl
  text: 'Ang mga anak ni Nearias: sina Elioenai[a], Ezequias, at Azricam—tatlo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “anak ni Nearias” ang nasa anyong isahan, ngunit sa kontekstong ito ng talaangkanan, nagsisilbi itong panimula sa talaan ng maraming anak; kaya “mga anak ni Nearias.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבֶן
  choice: Ang mga anak ni
  rationale: Bagaman nasa isahan ang anyong Hebreo na “anak ni,” nagsisilbi itong panimula sa talaan ng maraming anak sa kontekstong ito. Pinatutunayan ng tatlong pangalang kasunod at ng pangwakas na “tatlo” ang kolektibong diwa.
- source_word: נְעַרְיָה
  choice: Nearias
  rationale: Pangalang pantangi; ginamit ang anyong Filipino na naaayon sa nakaugaliang pagbaybay ng mga pangalang biblikal.
- source_word: אֶלְיוֹעֵינַי
  choice: Elioenai
  rationale: Pangalang pantangi; tinumbasan sa malinaw na transliterasyon.
- source_word: וְחִזְקִיָּה
  choice: Ezequias
  rationale: Pangalang pantangi; ginamit ang pamilyar na anyong Filipino ng pangalang biblikal.
- source_word: וְעַזְרִיקָם
  choice: at Azricam
  rationale: Pangalang pantangi na may pangatnig; ginamit ang baybay na natural sa Filipino.
- source_word: שְׁלֹשָׁה
  choice: tatlo
  rationale: Pinanatili ang tahasang bilang na nagbubuod sa tatlong nakatalang anak.
