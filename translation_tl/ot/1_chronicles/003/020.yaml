  text: and Hashubah[a], Ohel, Berekiah, Hasadiah[b], and Jushab-hesed—five.
translation:
  language: tl
  text: At sina Hashuba, Ohel, Berekias, Hasadias, at Yushab-hesed[b]—lima.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “lima” lamang ang nakasulat bilang buod ng limang pangalang kababanggit; hindi tahasang nakasulat ang “silang lahat ay.”
    reason: lexical_alternative
  - marker: b
    text: Ang huling pangalan ay nakasulat bilang dalawang bahagi sa Hebreo, “Yushab Hesed,” ngunit malamang na iisang tambalang pangalan; kaya isinulat dito na “Yushab-hesed.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַ/חֲשֻׁבָה
  choice: at sina Hasuba
  rationale: Pangalang pantangi na may pang-ugnay na ו. Ginamit ang “sina” upang natural na ipakilala sa Tagalog ang listahan ng mga tao; ang pangalan ay tinumbasan ayon sa bigkas sa Hebreo.
- source_word: וָ/אֹהֶל
  choice: Ohel
  rationale: Pangalang pantangi ito, hindi ang karaniwang pangngalang nangangahulugang “tolda,” kaya isinalin sa pamamagitan ng transliterasyon.
- source_word: וּ/בֶרֶכְיָה
  choice: Berekias
  rationale: Ang pangalang Hebreo ay tinumbasan sa anyong madaling basahin sa Tagalog; pinanatili ng hulaping “-ias” ang nakaugaliang anyo ng mga pangalang nagtatapos sa elementong יה.
- source_word: וַֽ/חֲסַדְיָה
  choice: Hasadias
  rationale: Transliterasyon ng pangalang pantangi sa makabagong ortograpiyang Filipino, na may “-ias” para sa hulaping יה.
- source_word: י֥וּשַׁב חֶ֖סֶד
  choice: Jusab-hesed
  rationale: Bagaman dalawang salitang Hebreo ang pagkakasulat, inuunawa itong isang tambalang pangalan; ipinakikita ng gitling na iisang tao ang tinutukoy.
- source_word: חָמֵשׁ
  choice: lima
  rationale: Tuwirang bilang na nagbubuod sa limang pangalang nakalista. Pinanatili ang eliptikong estilo ng Hebreo sa halip na idagdag ang “silang lahat ay.”
