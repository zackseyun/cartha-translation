base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/003/021.yaml
  text: 'And the sons of Hananiah: Pelatiah and Jeshaiah; the sons of Rephaiah[a], the sons of Arnan, the sons of Obadiah, the sons of Shecaniah.'
translation:
  language: tl
  text: 'At ang anak ni Hananias[a]: Pelatias at Jesaias; ang mga anak ni Refaias, ang mga anak ni Arnan, ang mga anak ni Obadias, ang mga anak ni Secanias.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Siksik at medyo mahirap unawain ang sintaks ng Hebreo. Literal itong mababasa: “At ang anak ni Hananias: Pelatias at Jesaias; ang mga anak ni Refaias, ang mga anak ni Arnan, ang mga anak ni Obadias, ang mga anak ni Secanias.” Nauunawaan ng ilan na ang bahagi ng pagkakasunod-sunod na ito ay tumutukoy sa isang linya ng mga inapo, hindi lamang sa mga tuwirang anak.'
    reason: alternative_reading
lexical_decisions:
- source_word: וּבֶן
  choice: At ang mga anak ni
  rationale: Ang Hebreo ay literal na nasa isahan, “at ang anak ni,” ngunit dalawang pangalan ang kasunod. Ginamit sa pangunahing teksto ang likas na maramihan sa Tagalog, habang pinanatili sa talababa ang tunay na suliranin sa sintaks.
- source_word: חֲנַנְיָה
  choice: Hananias
  rationale: Pangalan ng tao; ginamit ang anyong madaling bigkasin at pamilyar sa tradisyong Tagalog.
- source_word: פְּלַטְיָה
  choice: Pelatias
  rationale: Pangalan ng tao; isinalin sa anyong Tagalog na malapit sa tunog ng Hebreo.
- source_word: וִישַׁעְיָה
  choice: at Jesaias
  rationale: Pangalan ng tao na may pang-ugnay; pinanatiling Jesaias upang makilala ang anyong pangalang ginamit dito.
- source_word: בְּנֵי
  choice: ang mga anak ni
  rationale: Sa talaangkanan, karaniwang tumutukoy ito sa mga anak, ngunit maaari ring saklawin ang mas malalayong inapo. Pinanatili ang paulit-ulit na estruktura ng Hebreo.
- source_word: רְפָיָה
  choice: Refaias
  rationale: Pangalan ng tao; anyong Tagalog na malapit sa Hebreo.
- source_word: אַרְנָן
  choice: Arnan
  rationale: Pangalan ng tao; tuwirang transliterasyon.
- source_word: עֹבַדְיָה
  choice: Obadias
  rationale: Pangalan ng tao; ginamit ang kumbensiyonal na anyong Tagalog.
- source_word: שְׁכַנְיָה
  choice: Secanias
  rationale: Pangalan ng tao; ginamit ang malinaw at likas na anyong Tagalog.
