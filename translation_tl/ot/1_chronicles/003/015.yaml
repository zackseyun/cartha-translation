base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/003/015.yaml
  text: 'And the sons of Josiah: the firstborn[a], Johanan; the second, Jehoiakim; the third, Zedekiah; the fourth, Shallum.'
translation:
  language: tl
  text: 'At ang mga anak ni Josias: ang panganay[a] ay si Johanan; ang ikalawa ay si Jehoiakim; ang ikatlo ay si Zedekias; ang ikaapat ay si Shallum.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Si Shallum ay karaniwang itinuturing na siya ring Jehoahaz na binanggit sa 2 Hari 23:30–34 at Jeremias 22:11; ngunit sa talaangkanan ni Josias dito, ang pangalang Shallum ang ginamit ng manunulat ng Mga Cronica.
    reason: cross_reference
lexical_decisions:
- source_word: וּבְנֵי
  choice: At ang mga anak ni
  rationale: Pinanatili ang pang-ugnay na ו bilang “At” upang maipagpatuloy ang daloy ng talaangkanan, at ang בְנֵי ay isinaling “mga anak” dahil apat na tuwirang anak ang nakatala.
- source_word: יֹאשִׁיָּהוּ
  choice: Josias
  rationale: Ginamit ang nakaugaliang anyong Tagalog ng pangalan.
- source_word: הַבְּכוֹר
  choice: ang panganay
  rationale: Tuwirang ipinapahayag ng בכור ang kaayusan ng kapanganakan at katayuan bilang unang anak.
- source_word: יוֹחָנָן
  choice: Johanan
  rationale: Transliterasyon ng pangalang Hebreo sa anyong malinaw at karaniwang makikilala ng mambabasang Tagalog.
- source_word: הַשֵּׁנִי
  choice: ang ikalawa
  rationale: Tuwirang salin ng bilang-panunod na nagpapanatili sa ayos ng talaan.
- source_word: יְהוֹיָקִים
  choice: Jehoiakim
  rationale: Pinanatili ang anyo ng pangalang nasa tekstong Hebreo at hindi ang naunang pangalang Eliakim.
- source_word: הַשְּׁלִשִׁי
  choice: ang ikatlo
  rationale: Tuwirang salin ng bilang-panunod, kaayon ng estruktura ng talaan.
- source_word: צִדְקִיָּהוּ
  choice: Zedekias
  rationale: Ginamit ang nakaugaliang anyong Tagalog ng pangalan.
- source_word: הָרְבִיעִי
  choice: ang ikaapat
  rationale: Tuwirang salin ng bilang-panunod, kaayon ng naunang mga bilang.
- source_word: שַׁלּוּם
  choice: Shallum
  rationale: Transliterasyon ng mismong pangalang nakasaad sa tekstong Hebreo; hindi ito pinalitan sa pangunahing teksto ng pangalang Jehoahaz.
theological_decisions:
- issue: Ayos ng kapanganakan kumpara sa pagkakasunod sa paghahari
  choice: Inilahad ang mga anak ni Josias ayon sa mga bilang-panunod na ibinigay mismo ng tekstong Hebreo.
  alternative: Ayusin o baguhin ang talaan upang tumugma sa pagkakasunod ng mga haring namahala pagkamatay ni Josias.
  rationale: Ang talata ay isang talaangkanang may tahasang bilang-panunod. Hindi dapat baguhin ng salin ang presentasyon nito upang ipagkasundo sa mga salaysay tungkol sa paghalili sa trono; ang kaugnay na pagkakakilanlan ni Shallum ay inilagay sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “panganay, ikalawa, ikatlo, ikaapat” upang likas na maipahayag ang ayos ng kapanganakan. Pinanatili ang semicolon upang maging madaling sundan ang siksik na talaan ng mga pangalan.
