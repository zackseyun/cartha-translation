translation:
  language: tl
  text: Noga[a], Nefeg, at Yafia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mga transliterasyon ng mga pangalang Hebreo: ang “Noga” ay maaari ding baybaying “Nogah,” at ang “Yafia” ay maaari ding baybaying “Jafia” o “Yaphia.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹגַהּ
  choice: Noga
  rationale: Pangalang pantangi sa talaangkanan; tinumbasan sa paraang transliterasyon. Ang “Noga” ay natural sa baybay-Filipino at sapat na kumakatawan sa pangalang Hebreo.
- source_word: נֶפֶג
  choice: Nefeg
  rationale: Pangalang pantangi; transliterasyon ang angkop sa halip na pagsasalin ng posibleng kahulugan. Ginamit ang “f” para sa tunog ng Hebreong pe na walang dagesh.
- source_word: יָפִיעַ
  choice: Yafia
  rationale: Pangalang pantangi; ang unang yod ay kinakatawan ng “Y,” at ang baybay ay iniangkop sa malinaw at natural na pagbasa sa Filipino.
- source_word: וְ
  choice: at
  rationale: Ang inuulit na pang-ugnay na Hebreo ay likas na ipinahahayag sa Filipino sa pamamagitan ng mga kuwit at ng “at” bago ang huling pangalan.
theological_decisions: []
translation_notes:
  register: Maikli at marangal na anyo para sa talaangkanan, gamit ang makabagong baybay at bigkas na madaling maunawaan ng karaniwang mambabasang Filipino. Pinanatili ang mga pangalan bilang transliterasyon at hindi isinalin ang kanilang posibleng kahulugan.
