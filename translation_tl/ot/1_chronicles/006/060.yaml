  yaml_path: translation/ot/1_chronicles/006/060.yaml
  text: and Hukok with its pasturelands[a], and Rehob with its pasturelands.
translation:
  language: tl
  text: at ang Hukok, kasama ang mga pastulan nito,[a] at ang Rehob, kasama ang mga pastulan nito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: “Hukok.” Sa katumbas na tala sa Josue 21:31 ay “Helkat.”'
    reason: textual_variant
lexical_decisions:
- source_word: חוּקֹק
  choice: Hukok
  rationale: Pangalan ng lugar; tinumbasan sa transliterasyong malapit sa Hebreo. Ito ang pagbasa ng tekstong Masoretiko sa talatang ito.
- source_word: מִגְרָשֶׁיהָ
  choice: mga pastulan nito
  rationale: Tumutukoy sa bukas na lupa sa paligid na nakatalaga sa bayan, lalo na para sa pagpapastol at gamit ng pamayanan; natural at tiyak ang “mga pastulan” sa konteksto ng mga bayan ng mga Levita.
- source_word: רְחֹב
  choice: Rehob
  rationale: Pangalan ng lugar; pinanatili sa transliterasyon.
- source_word: וְאֶת
  choice: at … kasama ang
  rationale: Ang inuulit na pangatnig at pananda ng tuwirang layon ay likas na naipapahayag sa Filipino sa pamamagitan ng “at,” habang ang kaugnayan ng bayan sa mga pastulan nito ay malinaw na ipinahahayag ng “kasama ang.”
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang anyong talaan at ang pag-uulit ng parirala sa pinagmulang Hebreo; ginamit ang “pastulan” bilang pangkaraniwang salitang mauunawaan ng mga mambabasa.
