- source_word: ציף
  choice: Zif
  rationale: Pangalang pantangi; tinumbasan ayon sa bigkas ng Hebreo at sa natural na baybay sa Tagalog.
- source_word: אֶלְקָנָה
  choice: Elcana
  rationale: Pangalang pantangi; ginamit ang Tagalog na anyo ng transliterasyon mula sa Hebreo.
- source_word: מַחַת
  choice: Mahat
  rationale: Pangalang pantangi; direktang transliterasyon na angkop sa baybay at bigkas sa Tagalog.
- source_word: עֲמָשָׂי
  choice: Amasai
  rationale: Pangalang pantangi; direktang transliterasyon mula sa Hebreo.
