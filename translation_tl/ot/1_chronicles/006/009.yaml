  text: תַּ֤חַת בְּנ/וֹ֙ אוּרִיאֵ֣ל בְּנ֔/וֹ עֻזִּיָּ֥ה בְנ֖/וֹ וְ/שָׁא֥וּל בְּנֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/009.yaml
  text: Tahath his son[a], Uriel his son, Uzziah his son, and Shaul his son.
translation:
  language: tl
  text: si Tahat na anak niya, si Uriel na anak nito, si Uzias na anak nito, at si Shaul[a] na anak nito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Shaul ay ang pangalang Hebreo na mas karaniwang isinusulat na Saul.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּחַת
  choice: Tahat
  rationale: Pangalan ng tao sa talaangkanan; isinalin sa baybay na madaling basahin sa Filipino habang malapit sa tunog ng Hebreo.
- source_word: בְּנוֹ
  choice: anak niya / anak nito
  rationale: Ang בֵּן ay karaniwang nangangahulugang “anak na lalaki” at ito ang paulit-ulit na pormula sa talaangkanan. Ginamit ang “anak,” na likas at hindi kinakailangang tukuyin ang kasarian sa Filipino; ang “nito” ay malinaw na tumutukoy sa pangalang kaagad na nauna.
- source_word: אוּרִיאֵל
  choice: Uriel
  rationale: Transliterasyon ng pangalang Hebreo na natural na sa baybay-Filipino.
- source_word: עֻזִּיָּה
  choice: Uzias
  rationale: Karaniwang anyong Filipino ng pangalang Hebreo; malinaw at madaling bigkasin, habang kinakatawan ang pangalan sa pinagmulang teksto.
- source_word: וְשָׁאוּל
  choice: at si Shaul
  rationale: Pinanatili ng “Shaul” ang bigkas ng Hebreong שָׁאוּל nang mas tuwiran kaysa sa nakaugaliang “Saul”; isinaad sa talababa ang mas pamilyar na anyo.
theological_decisions: []
translation_notes:
  register: Makabago, payak, at marangal na Filipino. Pinanatili ang maikling pormula ng talaangkanan, ngunit ginamit ang “nito” upang maging malinaw sa Filipino na bawat tao ay anak ng pangalang kaagad na nauna. Inilagay ang panandang [a] pagkatapos ng “Shaul,” ang salitang aktuwal na ipinaliliwanag ng talababa.
