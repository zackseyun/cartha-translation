translation_notes:
  register: Maikli, marangal, at likas na Tagalog para sa talaangkanan. Idinagdag ang mga pantukoy na “si” at ang pang-ugnay na “na” para sa malinaw at natural na daloy, nang hindi nagdaragdag ng impormasyong wala sa Hebreo.
