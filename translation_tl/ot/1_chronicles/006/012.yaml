  text: Si Eliab na anak niya; si Jeroham na anak nito; si Elkana na anak nito.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֱלִיאָב
  choice: Eliab
  rationale: Pangalan ng tao; tinumbasan sa karaniwang anyong ginagamit sa modernong saling Tagalog.
- source_word: בְּנוֹ
  choice: na anak niya / na anak nito
  rationale: Literal na nangangahulugang “anak niya.” Ginamit ang “niya” sa unang banggit at “nito” sa mga sumunod upang malinaw na ang bawat pangalan ay anak ng kaagad na naunang tao, habang pinananatili ang paulit-ulit na hulma ng talaangkanan.
- source_word: יְרֹחָם
  choice: Jeroham
  rationale: Pangalan ng tao; transliterasyong umaayon sa nakaugaliang anyo sa Tagalog.
- source_word: אֶלְקָנָה
  choice: Elkana
  rationale: Pangalan ng tao; ginamit ang anyong “Elkana,” na natural basahin sa Tagalog at malapit sa bigkas ng Hebreo.
