translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “nasasakupan” para sa teritoryal na diwa at “palabunutan” para mapanatili ang konkretong paraan ng pagtatalaga ng bahagi. Ang mga gitling ay nilinaw ang mahaba at magkakaugnay na pangungusap.
