- from: Ito ang kanilang mga tirahan ayon sa kanilang mga pamayanan[a] sa loob ng kanilang nasasakupan—para sa mga anak ni Aaron na kabilang sa angkan ng mga Kohatita—sapagkat sa kanila ang palabunutan.
  to: Ito ang kanilang mga tirahan ayon sa kanilang mga pamayanan[a] sa loob ng kanilang teritoryo, para sa mga anak ni Aaron na kabilang sa angkan ng mga Kohatita; sapagkat sa kanila napunta ang bahagi sa palabunutan.
