review_pass:
  verdict: revise
  source_fidelity: Tumpak sa pangkalahatan ang mga katumbas para sa mga tirahan, pamayanan, teritoryo, mga anak ni Aaron, at angkan ng mga Kohatita. Gayunman, ang “sa kanila ang palabunutan” ay hindi likas at maaaring mangahulugang ang proseso ng pagbunot ang pag-aari nila. Ang הַגּוֹרָל ay ang lot/allotment na itinakda sa pamamagitan ng pagbunot; mas malinaw na ipahayag na sa kanila ito napunta.
  naturalness: Makabago at marangal ang rehistro. Ang “teritoryo” ay mas tuwiran at mas natural kaysa “nasasakupan” para sa heograpikong sakop. Ang binagong pangwakas na sugnay ay malinaw na Filipino at nananatiling malapit sa diwa ng Hebreo.
  terminology: Ang “mga tirahan,” “mga pamayanan,” “mga anak ni Aaron,” at “mga Kohatita” ay angkop. Pinananatili ng “bahagi sa palabunutan” ang allotment imagery nang hindi ipinahihiwatig na ang “palabunutan” mismo ang kanilang pag-aari.
  issues:
  - severity: medium
    issue: Hindi idiomatiko at posibleng malabo ang “sapagkat sa kanila ang palabunutan.”
    rationale: Ang “palabunutan” ay karaniwang tumutukoy sa paraan o proseso ng pagpili, samantalang ang Hebreong הַגּוֹרָל ay ang lot na napunta sa kanila sa konteksto ng pagtatalaga. Ang “sa kanila napunta ang bahagi sa palabunutan” ay nagbibigay ng wastong relasyon nang hindi nagpapasok ng doktrinal na pagpapakahulugan.
  revised_text: Ito ang kanilang mga tirahan ayon sa kanilang mga pamayanan[a] sa loob ng kanilang teritoryo, para sa mga anak ni Aaron na kabilang sa angkan ng mga Kohatita; sapagkat sa kanila napunta ang bahagi sa palabunutan.
