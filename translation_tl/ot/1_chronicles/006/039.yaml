base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/039.yaml
  text: These were their dwelling places according to their settlements within their territory[a], for the sons of Aaron, of the family of the Kohathites; for the lot was theirs.
translation:
  language: tl
  text: Ito ang kanilang mga tirahan ayon sa kanilang mga pamayanan[a] sa loob ng kanilang teritoryo, para sa mga anak ni Aaron na kabilang sa angkan ng mga Kohatita; sapagkat sa kanila napunta ang bahagi sa palabunutan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ayon sa kanilang mga kampamento” o “sa kanilang mga nayon.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מוֹשְׁבוֹתָם
  choice: kanilang mga tirahan
  rationale: Tumutukoy ito sa mga lugar na tinitirhan; natural at kongkreto ang “mga tirahan” sa makabagong Filipino.
- source_word: לְטִירוֹתָם
  choice: ayon sa kanilang mga pamayanan
  rationale: Maaaring tumukoy ang טִירָה sa pamayanan, kampamento, o nayon. Hindi labis na nililimitahan ng “mga pamayanan” ang uri ng mga lugar na tinutukoy.
- source_word: בִּגְבוּלָם
  choice: sa loob ng kanilang nasasakupan
  rationale: Dito, ang גְּבוּל ay tumutukoy sa teritoryo o sakop, hindi lamang sa linyang hangganan.
- source_word: לִבְנֵי אַהֲרֹן
  choice: para sa mga anak ni Aaron
  rationale: Pinananatili nito ang karaniwang biblikal na katawagang pampamilya at pangsaserdote.
- source_word: לְמִשְׁפַּחַת הַקְּהָתִי
  choice: na kabilang sa angkan ng mga Kohatita
  rationale: Ipinapahayag nito ang ugnayang pang-angkan at ang kolektibong diwa ng katawagang Kohatita.
- source_word: כִּי לָהֶם הָיָה הַגּוֹרָל
  choice: sapagkat sa kanila ang palabunutan
  rationale: Malapit ito sa Hebreong pahayag na ang lot/allotment ay kanila, habang pinananatili ang larawan ng pagtatalaga sa pamamagitan ng palabunutan.
