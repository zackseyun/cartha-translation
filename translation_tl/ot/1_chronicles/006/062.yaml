base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/062.yaml
  text: 'To the sons of Merari who remained[a], from the tribe of Zebulun: Rimmono and its pasturelands, Tabor and its pasturelands.'
translation:
  language: tl
  text: 'Sa mga anak ni Merari na nalalabi, mula sa lipi ni Zebulun: ang Rimono[a] at ang mga pastulan nito, at ang Tabor at ang mga pastulan nito.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Rimmono” ang nasa Hebreo; “Dimna” naman ang nasa kahawig na tala sa Josue 21:35.
    reason: textual_variant
lexical_decisions:
- source_word: לִבְנֵי מְרָרִי
  choice: Sa mga anak ni Merari
  rationale: Ang panlaping לְ ay nagpapahiwatig ng pinaglaanan sa talaan ng pamamahagi; natural sa Filipino ang “sa,” habang pinananatili ang anyong “mga anak ni Merari.”
- source_word: הַנּוֹתָרִים
  choice: na nalalabi
  rationale: Ipinahihiwatig ng pandiwaring anyo ang mga natira matapos ang naunang mga pamamahagi; ang “na nalalabi” ay malinaw at angkop sa marangal na rehistro.
- source_word: מִמַּטֵּה זְבוּלֻן
  choice: mula sa lipi ni Zebulun
  rationale: Sa konteksto ng paghahati ng lupain, ang מַטֶּה ay tumutukoy sa isang lipi, hindi sa literal na tungkod.
- source_word: רִמּוֹנוֹ
  choice: Rimono
  rationale: Isinalin sa titik-Filipino ang pangalang pook ayon sa tekstong Masoretiko, na may Rimmono; hindi ipinalit sa pangunahing teksto ang anyo sa kahawig na tala sa Josue.
- source_word: מִגְרָשֶׁיהָ
  choice: mga pastulan nito
  rationale: Sa mga tala ng mga lunsod ng mga Levita, tumutukoy ang מִגְרָשׁ sa bukas na lupaing nakapaligid sa lunsod at ginagamit bilang pastulan.
- source_word: תָּבוֹר
  choice: Tabor
  rationale: Pangalan ito ng pook sa talaan at pinanatili bilang transliterasyon, nang hindi ipinapalagay na bundok ang tinutukoy rito.
