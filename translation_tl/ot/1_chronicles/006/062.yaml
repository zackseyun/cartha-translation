  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang maikling estruktura ng talaan at ang hindi tahasang pandiwa ng Hebreo. Inilagay ang talababa pagkatapos ng “Rimono,” sapagkat doon nauukol ang tekstuwal na pagkakaiba.
