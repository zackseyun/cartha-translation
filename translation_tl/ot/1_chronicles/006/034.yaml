  source_fidelity: 'Ang pangunahing diwa ay tapat sa Hebreo: sina Aaron at ang kaniyang mga anak ang nagsasagawa ng ritwal na pagsusunog sa dalawang altar, para sa gawaing may kaugnayan sa kabanal-banalan at sa pagbabayad-sala para sa Israel, alinsunod sa iniutos ni Moises. Gayunman, ang “gawain sa Kabanal-banalan” ay maaaring magpahiwatig na ang gawain ay ginagawa sa loob ng pinakaloob na silid, samantalang ang Hebreo ay mas malawak na “lahat ng gawain ng/ukol sa kabanal-banalan.”'
  naturalness: Malinaw at marangal ang rehistro. Ang “Si Aaron at ang kaniyang mga anak ay” ay mas tuwirang modernong Filipino kaysa sa paksang may pantig na “ang” sa unang pangungusap. Ang “para sa lahat ng gawaing ukol sa Kabanal-banalan” ay natural at iniiwasan ang di-sinasadyang lokatibong pagbasa.
  terminology: Ang “altar ng handog na sinusunog,” “altar ng insenso,” “Kabanal-banalan,” “magbayad-sala,” at “lingkod ng Diyos” ay angkop at hindi nagdadagdag ng doktrinal na pagpapakahulugan. Pinananatili ng talababa ang posibleng kahulugang tumutukoy sa mga bagay na pinakabanal.
  issues:
