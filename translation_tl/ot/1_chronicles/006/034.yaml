revisions:
- from: Sina Aaron at ang kanyang mga anak ang nagsusunog ng mga handog sa altar ng handog na sinusunog at sa altar ng insenso, upang gampanan ang lahat ng gawain sa Kabanal-banalan[a] at magbayad-sala para sa Israel, ayon sa lahat ng iniutos ni Moises na lingkod ng Diyos.
  to: Si Aaron at ang kaniyang mga anak ay nagsusunog ng mga handog sa altar ng handog na sinusunog at sa altar ng insenso, para sa lahat ng gawaing ukol sa Kabanal-banalan[a] at upang magbayad-sala para sa Israel, ayon sa lahat ng iniutos ni Moises na lingkod ng Diyos.
  rationale: Binago ang panandang lokatibo na “sa Kabanal-banalan” tungo sa “ukol sa Kabanal-banalan” upang hindi ipahiwatig na ang lahat ng tinutukoy na gawain ay isinagawa sa loob ng pinakaloob na santuwaryo. Pinagaan din ang ayos ng simuno para sa likas na modernong Filipino. Hindi binago ang terminolohiyang pangkulto o ang pinananatiling ambigwidad sa talababa.
