  text: וְֽ/אַהֲרֹ֨ן וּ/בָנָ֜י/ו מַקְטִירִ֨ים עַל מִזְבַּ֤ח הָֽ/עוֹלָה֙ וְ/עַל מִזְבַּ֣ח הַ/קְּטֹ֔רֶת לְ/כֹ֕ל מְלֶ֖אכֶת קֹ֣דֶשׁ הַ/קֳּדָשִׁ֑ים וּ/לְ/כַפֵּר֙ עַל יִשְׂרָאֵ֔ל כְּ/כֹל֙ אֲשֶׁ֣ר צִוָּ֔ה מֹשֶׁ֖ה עֶ֥בֶד הָ/אֱלֹהִֽים־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/034.yaml
  text: And Aaron and his sons were offering on the altar of burnt offering and on the altar of incense[a], for all the work of the Most Holy Place and to make atonement for Israel, according to all that Moses the servant of God had commanded.
translation:
  language: tl
  text: Si Aaron at ang kaniyang mga anak ay nagsusunog ng mga handog sa altar ng handog na sinusunog at sa altar ng insenso, para sa lahat ng gawaing ukol sa Kabanal-banalan[a] at upang magbayad-sala para sa Israel, ayon sa lahat ng iniutos ni Moises na lingkod ng Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga bagay na pinakabanal.” Maaaring tumukoy ang pariralang Hebreo sa pinakabanal na bahagi ng santuwaryo o sa mga bagay na pinakabanal.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַקְטִירִים
  choice: nagsusunog ng mga handog
  rationale: Ang Hiphil participle ng קטר ay tumutukoy sa pagpapausok o pagsusunog ng inihahandog. Dahil kapuwa altar ng handog na sinusunog at altar ng insenso ang binabanggit, pinili ang malawak at likas na pariralang sumasaklaw sa dalawang gawaing pansamba.
- source_word: מִזְבַּח הָעוֹלָה
  choice: altar ng handog na sinusunog
  rationale: Tuwirang ipinahahayag nito na ang altar ay para sa עֹלָה, ang handog na lubos na sinusunog, nang hindi gumagamit ng di-pamilyar na teknikal na katawagan.
- source_word: מִזְבַּח הַקְּטֹרֶת
  choice: altar ng insenso
  rationale: Ito ang malinaw, maikli, at karaniwang katumbas sa modernong Filipino.
- source_word: לְכֹל מְלֶאכֶת
  choice: upang gampanan ang lahat ng gawain
  rationale: Sa konteksto ng santuwaryo, ang מְלָאכָה ay tumutukoy sa itinakdang gawain o paglilingkod. Ang pandiwang 'gampanan' ay natural sa Filipino at ipinahihiwatig ang tungkuling nakaatang sa mga pari.
- source_word: קֹדֶשׁ הַקֳּדָשִׁים
  choice: Kabanal-banalan
  rationale: Maaaring tumukoy ang pariralang Hebreo sa pinakabanal na bahagi ng santuwaryo o sa mga bagay na pinakabanal. Ang 'Kabanal-banalan' ay isang maikli at marangal na tawag sa lugar, habang pinananatili sa talababa ang ibang posibleng kahulugan.
- source_word: וּלְכַפֵּר עַל יִשְׂרָאֵל
  choice: at magbayad-sala para sa Israel
  rationale: Pinananatili ng 'magbayad-sala' ang malawak na kahulugang pansakripisyo ng כפר nang hindi itinatali ito sa isang partikular na teorya ng pagbabayad-sala.
- source_word: כְּכֹל אֲשֶׁר צִוָּה
  choice: ayon sa lahat ng iniutos
  rationale: Ipinahahayag nito ang ganap na pagsunod sa buong saklaw ng iniutos ni Moises.
- source_word: עֶבֶד הָאֱלֹהִים
  choice: lingkod ng Diyos
  rationale: Likas at marangal itong katumbas ng pormal na titulong ibinigay kay Moises.
theological_decisions:
- issue: Tinutukoy ng קֹדֶשׁ הַקֳּדָשִׁים
  choice: Kabanal-banalan bilang pinakabanal na bahagi ng santuwaryo
  alternative: mga bagay na pinakabanal
  rationale: Ang konteksto ng paglilingkod ng mga pari sa mga altar at ng pagbabayad-sala ay nagpapahintulot sa pagbasa bilang lugar, ngunit hindi ganap na nilulutas ng Hebreo ang sanggunian; kaya pinanatili sa talababa ang alternatibo.
- issue: Saklaw ng כפר
  choice: magbayad-sala
  alternative: gumawa ng pagtubos o magtakip ng kasalanan
  rationale: Ang piniling salita ay nagpapanatili sa malawak na diwang ritwal at tipanan ng pandiwa nang hindi nagdaragdag ng isang tiyak na paliwanag kung paano nagaganap ang pagbabayad-sala.
translation_notes:
  register: Modernong Filipino na malinaw at marangal ang ginamit. Pinanatili ang mga pamilyar na terminong biblikal na “altar,” “insenso,” “Kabanal-banalan,” at “magbayad-sala,” ngunit iniwasan ang labis na arkaiko o denominasyonal na pananalita.
