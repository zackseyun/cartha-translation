    rationale: Ang לְכֹל מְלֶאכֶת קֹדֶשׁ הַקֳּדָשִׁים ay hindi tahasang nagsasabing ang lahat ng gawain ay naganap sa loob ng Kabanal-banalan; maaari itong tumukoy sa lahat ng gawaing nauukol dito o sa mga bagay na pinakabanal. Ang “ukol sa” ay pinananatili ang lawak ng parirala.
  - severity: low
    issue: Hindi kinakailangang emphatic ang “ang” sa “Sina Aaron ... ang nagsusunog.”
    rationale: Walang pagbibigay-diin ang simpleng Hebreong sugnay na nangangailangan ng ganitong ayos. Mas tuwiran ang karaniwang pangungusap na may “ay.”
