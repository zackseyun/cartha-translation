translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang tuwirang pandiwang “ibinigay,” ang di-tiyak na simunong “nila,” at ang kontekstuwal na pagsalungat sa “Ngunit.”
