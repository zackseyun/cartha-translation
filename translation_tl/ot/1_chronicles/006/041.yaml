  text: But the fields of the city and its pasturelands they gave to Caleb son of Jephunneh[a].
translation:
  language: tl
  text: Ngunit ang bukirin ng lungsod at ang mga nayon nito[a] ay ibinigay nila kay Caleb na anak ni Jefune.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga pamayanan nito” o “mga lupaing nakapaligid dito.” Sa kontekstong ito ng paghahati ng lupain, maaaring tumukoy ang salitang Hebreo sa mga pook o lupaing nakaugnay sa lungsod, hindi sa mga bakuran sa loob nito.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂדֵה הָעִיר
  choice: ang mga bukid ng lungsod
  rationale: Ang שָׂדֶה ay tumutukoy sa bukid, lupang sakahan, o lantad na lupain. Bagaman anyong isahan, kolektibo ang diwa rito, kaya likas sa Tagalog ang “mga bukid ng lungsod” para sa lupaing kaugnay ng lungsod.
- source_word: חֲצֵרֶיהָ
  choice: ang mga pastulan nito
  rationale: Sa konteksto ng paghahati ng mga lungsod at kalapit na lupain, maaaring tumukoy ang חָצֵר sa mga pamayanang sakop o sa mga lupaing nakapaligid at ginagamit ng lungsod. Pinili ang “mga pastulan nito” bilang malinaw at angkop sa konteksto, habang pinananatili sa talababa ang mga posibleng alternatibo.
- source_word: נָתְנוּ
  choice: ibinigay nila
  rationale: Ang Qal perfect ng נתן ay payak na nangangahulugang “nagbigay.” Ang “ibinigay nila” ay natural sa Tagalog at pinananatili ang di-tiyak na pangmaramihang simuno ng Hebreo.
- source_word: לְכָלֵב בֶּן יְפֻנֶּה
  choice: kay Caleb na anak ni Jefune
  rationale: Ang לְ ay nagmamarka sa tumatanggap. Isinalin ang ugnayang בֶּן sa natural na Tagalog na “na anak ni,” at tinumbasan sa transliterasyon ang mga pangalang pantangi.
- source_word: וְאֶת ... וְאֶת
  choice: Ngunit ... at ...
  rationale: Ang unang וְ ay nagpapakita rito ng paghahambing o pagsalungat sa naunang pahayag tungkol sa lungsod mismo, kaya ang “Ngunit” ay natural; ang ikalawa ay payak na nag-uugnay ng dalawang bagay kaya “at” ang ginamit.
