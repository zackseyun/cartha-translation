    rationale: Maaaring tumukoy ang salita sa mga nayon o pamayanang kaugnay ng lungsod, at maaari ring magkaroon ng mas malawak na diwa ng mga kalapit na lupa. Ang “pastulan” ay nagdaragdag ng espesipikong gamit ng lupa na hindi malinaw na ipinahahayag ng Hebreo.
  - severity: low
