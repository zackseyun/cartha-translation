  text: and Hilen with its pasturelands[a], Debir with its pasturelands.
translation:
  language: tl
  text: at ang Hilen kasama ang mga pastulan nito,[a] at ang Debir kasama ang mga pastulan nito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang pangalang “Hilen” ay sumusunod sa anyong Hebreo sa Cronica. Sa katumbas na tala sa Josue 21:15, “Holon” ang nakasulat.
    reason: alternative_reading
lexical_decisions:
- source_word: חִילֵז
  choice: Hilen
  rationale: Pangalan ng lugar; direktang tinumbasan ayon sa anyong Masoretiko sa Cronica sa halip na palitan ng pangalan mula sa katumbas na tala sa Josue.
- source_word: מִגְרָשֶׁיהָ
  choice: mga pastulan nito
  rationale: Tumutukoy sa bukas na lupaing nakapaligid at nakatalaga sa isang Levitang lungsod, karaniwang ginagamit bilang pastulan.
- source_word: דְּבִיר
  choice: Debir
  rationale: Pangalan ng lugar; ginamit ang likas at nakaugaliang transliterasyon sa Filipino.
- source_word: וְ/אֶת
  choice: at … kasama ang
  rationale: Ang pang-ugnay at pananda ng tuwirang layon ay bahagi ng sunud-sunod na tala; ang pariralang Filipino ay malinaw na nag-uugnay sa bawat lungsod at sa mga pastulan nito.
- source_word: אֶת
  choice: —
  rationale: Walang tuwirang katumbas sa Filipino ang pananda ng tuwirang layon; ipinahihiwatig ang gamit nito sa kayarian ng tala.
