base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/018.yaml
  text: 'And these are the ones who stood[a], and their sons: from the sons of the Kohathites: Heman the singer, son of Joel[b], son of Samuel.'
translation:
  language: tl
  text: 'At ito ang mga nakatayo[a], at ang kanilang mga anak: mula sa angkan ni Kohat: si Heman na mang-aawit, anak ni Joel, anak ni Samuel.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “mga naglingkod”; ang Hebreong salita ay literal na “mga nakatayo” at maaaring tumukoy sa mga nakatayo upang gampanan ang isang itinalagang paglilingkod.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: At ito ang mga
  rationale: Pinananatili ang pang-ugnay na waw at ang pagpapakilala sa kasunod na talaan sa natural na Tagalog.
- source_word: הָעֹמְדִים
  choice: naglingkod[a]
  rationale: Literal itong tumutukoy sa ‘mga nakatayo,’ ngunit sa konteksto ng itinalagang paglilingkod, mas malinaw sa modernong Tagalog ang ‘naglingkod.’ Itinatala sa talababa ang kongkretong larawan ng Hebreo.
- source_word: וּבְנֵיהֶם
  choice: at ang kanilang mga anak
  rationale: Direktang pinananatili ang payak na pang-ugnay at ang maramihang ‘mga anak,’ nang hindi ipinapalagay kung ‘kasama’ ang eksaktong ugnayang nilalayong ipahayag.
- source_word: מִבְּנֵי הַקְּהָתִי
  choice: mula sa angkan ni Kohat
  rationale: Natural na Tagalog para sa katawagang naglalarawan ng lahing nagmula kay Kohat; iniiwasan nito ang alanganing literal na ‘mga anak ng Kohatita.’
- source_word: הַמְשׁוֹרֵר
  choice: mang-aawit
  rationale: Tuwirang katumbas ng tungkuling may kinalaman sa pag-awit at mas tiyak kaysa ‘musikero.’
- source_word: בֶּן יוֹאֵל בֶּן שְׁמוּאֵל
  choice: anak ni Joel, anak ni Samuel
  rationale: Pinananatili ang maikli at sunod-sunod na pormula ng talaangkanan sa Hebreo.
