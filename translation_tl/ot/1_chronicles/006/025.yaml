  yaml_path: translation/ot/1_chronicles/006/025.yaml
  text: son of Michael[a], son of Baaseiah[b], son of Malkijah.
translation:
  language: tl
  text: anak ni Micael, anak ni Baaseias[a], anak ni Malquias.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “Baaseias.” Sa ibang mga talaangkanan o tradisyon ng salin, maaaring makilala ng ilang mambabasa ang kahawig na pangalang “Maaseias.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ding isulat na “Malkiya,” isang mas tuwirang transliterasyon ng pangalang Hebreo.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן
  choice: anak ni
  rationale: Sa talaangkanan, tuwirang ipinahahayag ng בֶּן ang ugnayang anak sa ama. Pinananatili ng “anak ni” ang maikli at paulit-ulit na ayos ng Hebreo.
- source_word: מִיכָאֵל
  choice: Micael
  rationale: Ginamit ang anyong pangalang pamilyar at madaling basahin sa Filipino, na kumakatawan sa Hebreong מִיכָאֵל.
- source_word: בַּעֲשֵׂיָה
  choice: Baaseias
  rationale: Sinusunod nito ang natanggap na tekstong Hebreo na nagsisimula sa ב, habang ginagamit ang anyong angkop sa pagbasa sa Filipino. Hindi ito tahimik na pinapalitan ng mas pamilyar na “Maaseias.”
- source_word: מַלְכִּיָּה
  choice: Malquias
  rationale: Ginamit ang nakaugaliang anyong Filipino ng pangalan, na kumakatawan sa Hebreong מַלְכִּיָּה at natural basahin sa target na wika.
theological_decisions: []
translation_notes:
  register: Maikli at marangal ang anyo, gaya ng talaangkanan sa Hebreo. Ginamit ang natural na pariralang Filipino na “anak ni” at mga pangalang madaling basahin, habang nililinaw sa talababa ang mahahalagang alternatibong anyo.
