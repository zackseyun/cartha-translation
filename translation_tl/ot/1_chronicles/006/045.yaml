base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/045.yaml
  text: 'and from the tribe of Benjamin: Geba with its pasturelands[a], Alemeth with its pasturelands, and Anathoth with its pasturelands—all their cities were thirteen cities according to their families.'
translation:
  language: tl
  text: 'At mula sa lipi ni Benjamin: ang Geba kasama ng mga pastulan nito, ang Alemet[a] kasama ng mga pastulan nito, at ang Anatot kasama ng mga pastulan nito. Sa kabuuan, labintatlong lunsod ang lahat nila, ayon sa kani-kanilang angkan.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Alemet” ang nasa tekstong Hebreo; “Almon” naman ang mababasa sa katumbas na talaan sa Josue 21:18.
    reason: alternative_reading
lexical_decisions:
- source_word: וּמִמַּטֵּה בִנְיָמִן
  choice: At mula sa lipi ni Benjamin
  rationale: Ang מַטֶּה sa konteksto ng paghahati ng lupain ay tumutukoy sa isang lipi. Pinananatili ng “At mula sa” ang dugtong sa naunang talaan.
- source_word: גֶּבַע
  choice: Geba
  rationale: Pangalan ng lugar, kaya isinatitik sa anyong madaling basahin sa Filipino sa halip na isalin.
- source_word: מִגְרָשֶׁיהָ
  choice: mga pastulan nito
  rationale: Ang מִגְרָשׁ ay bukás na lupa sa paligid ng isang lungsod, lalo na para sa pagpapastol. Malinaw at likas sa Filipino ang “mga pastulan nito.”
- source_word: עָלֶמֶת
  choice: Alemet
  rationale: Sinusunod ang anyo ng pangalang nasa tekstong Hebreo ng Cronica; ang “Almon” ay nasa katumbas na talaan sa Josue 21:18 at inilagay sa talababa.
- source_word: עֲנָתוֹת
  choice: Anatot
  rationale: Pangalan ng lugar na isinatitik ayon sa anyong madaling bigkasin sa Filipino.
- source_word: כָּל עָרֵיהֶם שְׁלֹשׁ עֶשְׂרֵה עִיר
  choice: Labintatlo ang lahat ng kanilang lungsod
  rationale: Natural na Filipino para sa pangwakas na pagbubuod ng bilang, habang pinananatili ang “lahat ng kanilang lungsod.”
- source_word: בְּמִשְׁפְּחוֹתֵיהֶם
  choice: ayon sa kani-kanilang angkan
  rationale: Ang מִשְׁפָּחוֹת ay maaaring tumukoy sa malalaking pamilya o mga angkan. Ang “kani-kanilang angkan” ay malinaw na nagpapahiwatig ng pamamahagi ayon sa mga pangkat ng pamilya.
