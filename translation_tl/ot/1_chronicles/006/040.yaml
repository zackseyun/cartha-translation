  yaml_path: translation/ot/1_chronicles/006/040.yaml
  text: They gave them Hebron in the land of Judah[a], with its pasturelands around it.
translation:
  language: tl
  text: Ibinigay nila sa kanila ang Hebron sa lupain ng Juda, kasama ang mga pastulan[a] sa palibot nito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga lupaing panlahat.” Ang salitang Hebreo ay tumutukoy sa bukas na lupaing nakaugnay sa isang bayan at madalas gamitin para sa pagpapastol.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ
  choice: Ibinigay nila
  rationale: Ang Qal wayyiqtol ng נתן ay karaniwang anyong pasalaysay na nangangahulugang “at/pagkatapos ay ibinigay nila.” Likas sa Tagalog na hindi na tahasang isalin ang pang-ugnay dito.
- source_word: לָהֶם
  choice: sa kanila
  rationale: Ang ל ay tanda ng di-tuwirang layon; malinaw at natural sa Tagalog ang “ibinigay nila sa kanila.”
- source_word: חֶבְרוֹן
  choice: Hebron
  rationale: Pangalan ng lugar; pinanatili ang nakaugaliang transliterasyong Filipino.
- source_word: בְּאֶרֶץ יְהוּדָה
  choice: sa lupain ng Juda
  rationale: Ang אֶרֶץ ay maaaring mangahulugang “lupain” o “nasasakupan.” Pinananatili ng “lupain ng Juda” ang heograpikong katawagan nang hindi labis na tinutukoy ang uri ng hangganan.
- source_word: מִגְרָשֶׁיהָ
  choice: ang mga pastulan
  rationale: Ang מִגְרָשׁ ay bukas na lupaing nakalaan sa isang bayan, madalas para sa pagpapastol, lalo na sa konteksto ng mga bayan ng mga Levita. Madaling maunawaan sa modernong Tagalog ang “mga pastulan,” habang inilalahad sa talababa ang mas malawak na saklaw ng salita.
- source_word: סְבִיבֹתֶיהָ
  choice: sa palibot nito
  rationale: Tumutukoy ito sa nakapalibot na lugar ng lungsod. Ang “sa palibot nito” ay natural at malinaw na inuugnay ang mga pastulan sa Hebron.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang payak na ayos ng salaysay at ang heograpikong pariralang “lupain ng Juda.”
