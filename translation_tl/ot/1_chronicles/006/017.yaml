- from: At naglingkod sila sa harap ng tabernakulo, ang tolda ng pagpupulong, sa pamamagitan ng pag-awit[a], hanggang sa maitayo ni Solomon ang bahay ni Yahweh[b] sa Jerusalem. Ginampanan nila ang kanilang paglilingkod ayon sa itinakdang kaayusan[c].
  to: At naglingkod sila sa harap ng tabernakulo, ang tolda ng pagpupulong, sa pamamagitan ng pag-awit[a], hanggang sa itayo ni Solomon ang bahay ni Yahweh[b] sa Jerusalem. At tumayo sila ayon sa kanilang itinakdang tuntunin sa kanilang paglilingkod[c].
