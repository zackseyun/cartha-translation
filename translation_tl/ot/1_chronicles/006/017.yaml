id: 1CH.6.17
reference: 1 Chronicles 6:17
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יִּהְי֨וּ מְשָׁרְתִ֜ים לִ/פְנֵ֨י מִשְׁכַּ֤ן אֹֽהֶל מוֹעֵד֙ בַּ/שִּׁ֔יר עַד בְּנ֧וֹת שְׁלֹמֹ֛ה אֶת בֵּ֥ית יְהוָ֖ה בִּ/ירוּשָׁלִָ֑ם וַ/יַּעַמְד֥וּ כְ/מִשְׁפָּטָ֖/ם עַל עֲבוֹדָתָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/017.yaml
  text: They were ministering before the tabernacle[a], the tent of meeting, with song until Solomon built the house of Yahweh in Jerusalem[c][b], and they stood according to their ordinance over their service.
translation:
  language: tl
  text: At naglingkod sila sa harap ng tabernakulo, ang tolda ng pagpupulong, sa pamamagitan ng pag-awit[a], hanggang sa itayo ni Solomon ang bahay ni Yahweh[b] sa Jerusalem. At tumayo sila ayon sa kanilang itinakdang tuntunin sa kanilang paglilingkod[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa awit” o “sa pamamagitan ng pag-awit.”
    reason: lexical_alternative
  - marker: b
    text: Ang “bahay ni Yahweh” ay tumutukoy sa templo.
    reason: referent_clarification
  - marker: c
    text: Maaari ring “ayon sa kanilang tuntunin” o “ayon sa kanilang kaugalian.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מְשָׁרְתִים
  choice: naglingkod
  rationale: Tumutukoy ang participle sa pagganap ng tungkuling panrelihiyon; natural sa modernong Tagalog ang “naglingkod” at malinaw ito sa konteksto.
- source_word: לִפְנֵי
  choice: sa harap ng
  rationale: 'Pinananatili ang karaniwang diwang panlunan at ugnayan: ang paglilingkod ay isinasagawa sa harap ng santuwaryo.'
- source_word: מִשְׁכַּן אֹהֶל מוֹעֵד
  choice: tabernakulo, ang tolda ng pagpupulong
  rationale: Pinananatili ang dalawang magkaugnay na katawagan sa Hebreo, na ang ikalawa ay nagpapaliwanag sa una.
- source_word: בַּשִּׁיר
  choice: sa pamamagitan ng pag-awit
  rationale: Ipinahahayag nito ang paraan ng kanilang paglilingkod at mas natural kaysa literal na “sa awit” sa pangungusap na ito.
- source_word: עַד בְּנוֹת שְׁלֹמֹה
  choice: hanggang sa maitayo ni Solomon
  rationale: Malinaw na ipinakikita ang hangganang panahunan ng kaayusang ito habang natural ang anyong pandiwa sa Tagalog.
- source_word: בֵּית יְהוָה
  choice: bahay ni Yahweh
  rationale: Pinananatili ang literal na “bahay” sa pangunahing teksto sa halip na agad itong ipakahulugang templo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang transliterasyon ng banal na pangalan sa halip na palitan ito ng isang titulo.
- source_word: וַיַּעַמְדוּ
  choice: ginampanan nila
  rationale: Sa kontekstong administratibo at panliturhiya, ang literal na pagtayo ay nagpapahiwatig ng paghawak o pagtupad sa nakatalagang tungkulin; ang saling ito ay natural sa Tagalog.
- source_word: כְמִשְׁפָּטָם
  choice: ayon sa itinakdang kaayusan
  rationale: Ipinahahayag ang itinatag na tuntunin o ayos ng kanilang paglilingkod nang hindi nililimitahan sa kahulugang legal.
- source_word: עַל עֲבוֹדָתָם
  choice: ang kanilang paglilingkod
  rationale: Inilalahad nang natural sa Tagalog ang kaugnayan nila sa nakatalagang gawain, bagaman mas tuwiran ang anyo kaysa sa Hebreong preposisyonal na parirala.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Pinananatili ang personal na pangalan ng Diyos ng Israel; walang partikular na usaping doktrinal sa talata na nangangailangang palitan ito ng titulo.
- issue: Kahulugan ng bahay ni Yahweh
  choice: Pinanatili ang “bahay” sa teksto at ipinaliwanag bilang templo sa talababa
  alternative: templo ni Yahweh
  rationale: Pinangangalagaan nito ang leksikal na anyo ng Hebreo habang nililinaw ang tinutukoy nang hindi isinisiksik ang interpretasyon sa pangunahing teksto.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Pinanatili ang mga katawagang panrelihiyon na “tabernakulo” at “Yahweh,” at nilinaw sa apposition ang “tolda ng pagpupulong.”
