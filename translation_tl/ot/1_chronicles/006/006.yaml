  register: Maikli at marangal na estilong talaangkanan. Inulit ang “anak niya” gaya ng Hebreo upang mapanatili ang malinaw na sunod-sunod na ugnayan; idinagdag ang mga pantukoy at “at” para sa natural na daloy sa modernong Filipino.
