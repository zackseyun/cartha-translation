lexical_decisions:
- source_word: יוֹאָח
  choice: Joah
  rationale: Pangalang pantangi; tinumbasan sa pamamagitan ng transliterasyon at pinanatili ang karaniwang anyong biblikal.
- source_word: בְּנוֹ
  choice: anak niya
  rationale: Ang בֵּן na may hulaping ikatlong panauhang panlalaki ay likas na nangangahulugang “anak niya” sa talaangkanan. Bagaman maaaring lumaktaw ng salinlahi ang ilang talaangkanan, hindi iyon tahasang ipinahihiwatig rito.
- source_word: עִדּוֹ
  choice: Iddo
  rationale: Pangalang pantangi; transliterasyon ng pangalang Hebreo.
- source_word: זֶרַח
  choice: Zera
  rationale: Pangalang pantangi; ang anyong “Zera” ay natural na transliterasyon sa Filipino ng זֶרַח.
- source_word: יְאָתְרַי
  choice: Jeaterai
  rationale: Pangalang pantangi; malapit na kinakatawan ng “Jeaterai” ang binigkas na anyo ng tekstong Masoretiko.
