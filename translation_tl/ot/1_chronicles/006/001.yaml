  text: בְּנֵ֖י לֵוִ֑י גֵּרְשֹׁ֕ם קְהָ֖ת וּ/מְרָרִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/001.yaml
  text: 'The sons of Levi: Gershom[a], Kohath[b], and Merari.'
translation:
  language: tl
  text: 'Ang mga anak[a] ni Levi: sina Gersom[b], Kohat, at Merari.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa mga talaangkanang Hebreo, maaaring tumukoy ang “mga anak” sa mga tuwirang anak o, sa ilang konteksto, sa mas malalayong inapo. Dito, ang tinutukoy ay ang mga tuwirang anak ni Levi.
    reason: cultural_note
  - marker: b
    text: “Gersom” ang mababasa sa tekstong Hebreo; “Gerson” naman ang baybay na ginagamit sa ilang salin at sa kaugnay na mga talata.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: mga anak ni
  rationale: Ang construct plural ng בֵּן ay tumutukoy rito sa mga anak na lalaki ni Levi. Likas sa modernong Filipino ang pariralang “mga anak ni,” at malinaw sa kasunod na talaan na ang tinutukoy ay ang tatlo niyang tuwirang anak.
- source_word: לֵוִי
  choice: Levi
  rationale: Pangalang pantangi; pinanatili sa anyong karaniwang ginagamit sa Filipino.
- source_word: גֵּרְשֹׁם
  choice: Gersom
  rationale: Pangalang pantangi na isinalin ayon sa bigkas ng anyong Hebreo na Gershom; hindi ipinantay sa kaugnay na anyong Gershon.
- source_word: קְהָת
  choice: Kohat
  rationale: Pangalang pantangi; ang “Kohat” ay malinaw na transliterasyon sa Filipino ng pangalang Hebreo.
- source_word: וּ/מְרָרִי
  choice: at Merari
  rationale: Ang pang-ugnay na וּ ay isinaling “at,” kasunod ang transliterasyon ng pangalang pantangi.
