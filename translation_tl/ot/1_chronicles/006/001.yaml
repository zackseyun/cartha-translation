translation_notes:
  register: Gumamit ng maikli, marangal, at natural na anyong talaangkanan sa modernong Filipino. Idinagdag ang pantukoy na “sina” bago ang serye ng mga pangalan upang maging likas ang pangungusap sa Tagalog. Inilagay ang mga panandang talababa sa mismong salitang tinatalakay ng bawat paliwanag.
