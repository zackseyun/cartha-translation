  yaml_path: translation/ot/1_chronicles/006/059.yaml
  text: 'and from the tribe of Asher: Mashal with its pasturelands[a], and Abdon with its pasturelands.'
translation:
  language: tl
  text: 'at mula sa lipi ni Asher: Mashal[a] at mga pastulan nito, at Abdon at mga pastulan nito.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mashal ang anyo ng pangalan sa Mga Cronica; Mishal naman ang nasa katumbas na talaan sa Josue 21:30.
    reason: alternative_reading
lexical_decisions:
- source_word: וּ/מִ/מַּטֵּה אָשֵׁר
  choice: at mula sa lipi ni Asher
  rationale: Sa konteksto ng paghahati ng lupain, ang מַטֶּה ay tumutukoy sa isang lipi; pinanatili rin ang pang-ugnay at pang-ukol na 'at mula sa.'
- source_word: אֶת מָשָׁל
  choice: ang Mashal
  rationale: Hindi tuwirang isinasalin ang pananda ng layon na אֶת. Isinatinig ang pangalan ng lugar ayon sa anyong nasa Mga Cronica; iniingatan sa talababa ang ibang anyo sa Josue 21:30.
- source_word: מִגְרָשֶׁיהָ
  choice: ang mga pastulan nito
  rationale: Ang מִגְרָשׁ ay bukas na lupa sa palibot ng isang bayan, lalo na para sa pagpapastol sa mga talaan ng mga lungsod ng mga Levita. Likas at malinaw sa makabagong Filipino ang 'mga pastulan nito.'
- source_word: עַבְדּוֹן
  choice: Abdon
  rationale: Pangalan ito ng lugar at isinatitik sa karaniwang anyong Filipino.
