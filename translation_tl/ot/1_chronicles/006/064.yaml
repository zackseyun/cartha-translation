  text: and Kedemoth with its pasturelands[a], and Mephaath with its pasturelands.
translation:
  language: tl
  text: at ang Kedemot, kasama ang mga pastulan nito,[a] at ang Mefaat, kasama ang mga pastulan nito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga lupaing panlahat”; ang salitang Hebreo ay tumutukoy sa bukas na lupaing pag-aari o nakalaan sa isang bayan.
    reason: lexical_alternative
lexical_decisions:
- source_word: קְדֵמוֹת
  choice: Kedemot
  rationale: Pangalan ng lugar; tinumbasan sa paraang mas likas sa pagbabaybay at pagbigkas sa modernong Filipino, habang pinananatili ang tunog ng Hebreo.
- source_word: מִגְרָשֶׁיהָ
  choice: mga pastulan nito
  rationale: Tumutukoy ang מִגְרָשׁ sa bukas na lupaing nakaugnay sa isang bayan, karaniwang ginagamit bilang pastulan; ipinahihiwatig ng hulaping pambabae na ang lupa ay ukol sa bawat bayang nabanggit.
- source_word: מֵיפַעַת
  choice: Mefaat
  rationale: Pangalan ng lugar; direktang transliterasyon na angkop sa karaniwang ortograpiyang Filipino.
- source_word: וְאֶת ... וְאֶת
  choice: at ... at
  rationale: Ang inuulit na pangatnig at pananda ng tuwirang layon ay bumubuo ng sunod-sunod na talaan; ang payak na 'at' ang natural na katumbas sa Filipino.
