  source_fidelity: 'Tumpak na naihahatid ng salin ang magkakaugnay na talaan sa Hebreo: Kedemot at ang kaugnay nitong mga pastulan, at Mefaat at ang kaugnay nitong mga pastulan. Ang panghalip na “nito” ay wasto para sa bawat bayang nabanggit.'
