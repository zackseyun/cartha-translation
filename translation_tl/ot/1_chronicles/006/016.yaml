base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/016.yaml
  text: These are the men whom David appointed over the service of song in the house of Yahweh[b][a], after the ark came to rest.
translation:
  language: tl
  text: Ang mga sumusunod ang itinalaga ni David na mamahala sa pag-awit[a] sa bahay ni Yahweh, mula nang mailagak ang Kaban sa pahingahan nito.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “para sa pag-awit” o “namamahala sa pag-awit.” Malamang na tumutukoy ang pariralang Hebreo sa pananagutan sa gawaing musikal sa santuwaryo.
    reason: lexical_alternative
  - marker: b
    text: Literal na, “mula sa pamamahinga ng Kaban.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Ang mga sumusunod
  rationale: Likas na panimula ito sa listahang kasunod at pinananatili ang diwa ng demonstratibong “ang mga ito,” nang hindi na kailangang idagdag ang salitang “mga lalaki.”
- source_word: הֶעֱמִיד
  choice: itinalaga
  rationale: Ang Hiphil ng עמד sa kontekstong ito ay tumutukoy sa paglalagay ng mga tao sa isang opisyal na tungkulin, hindi lamang sa pisikal na pagpapatayo sa kanila.
- source_word: עַל יְדֵי שִׁיר
  choice: na mamahala sa pag-awit
  rationale: Ipinahihiwatig ng parirala ang pananagutan o pamamahala sa gawaing musikal; malinaw at natural ito sa modernong Filipino habang pinananatili ang administratibong diwa.
- source_word: בֵּית יְהוָה
  choice: sa bahay ni Yahweh
  rationale: Pinananatili ang literal na larawan ng בֵּית bilang “bahay” at ang personal na pangalan ng Diyos na יְהוָה bilang “Yahweh”; hindi ginamit ang “templo,” na mas interpretatibo sa kontekstong ito.
- source_word: מִמְּנוֹחַ הָאָרוֹן
  choice: mula nang mamahinga ang Kaban
  rationale: Ipinahahayag ng מִן kasama ng מְנוֹחַ ang panahong nagsimula nang mapirmi sa pahingahan ang Kaban. Ang “mula nang” ay kapuwa natural at malapit sa anyong Hebreo.
- source_word: הָאָרוֹן
  choice: ang Kaban
  rationale: “Kaban” lamang ang tahasang nasa teksto; hindi idinagdag ang “ng Tipan,” bagaman iyon ang malinaw na tinutukoy sa konteksto.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: ang PANGINOON / Jehovah
  rationale: Personal na pangalang יְהוָה ang tuwirang ginamit sa Hebreo. Pinananatili ng “Yahweh” ang pangalan sa halip na palitan ito ng isang titulo.
- issue: Saklaw ng tungkulin sa עַל יְדֵי שִׁיר
  choice: mamahala sa pag-awit
  alternative: para sa pag-awit / sa paglilingkod sa pamamagitan ng awit
  rationale: Pinananatili ang posibleng diwa ng pananagutan o pangangasiwa nang hindi nagdaragdag ng espesipikong doktrina tungkol sa uri ng ministeryo o pagsamba.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Kaban” bilang karaniwang katawagan sa sagradong ark at ang “bahay ni Yahweh” upang mapanatili ang larawan ng Hebreo. Inilagay ang mga talababa sa mismong pariralang nililinaw ng bawat isa.
