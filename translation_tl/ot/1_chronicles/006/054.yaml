  yaml_path: translation/ot/1_chronicles/006/054.yaml
  text: and Aijalon with its pasturelands[a], and Gath-rimmon with its pasturelands.
translation:
  language: tl
  text: at ang Aijalon, kasama ang mga pastulan nito,[a] at ang Gat-rimon, kasama ang mga pastulan nito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga lupang panlahat” o “mga lupain sa paligid.” Ang salitang Hebreo ay tumutukoy sa bukas na lupang pag-aari ng isang lungsod.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַיָּלוֹן
  choice: Aijalon
  rationale: Isinalin sa baybay bilang pangalang-pook; pinananatili ang karaniwang anyong biblikal sa Filipino.
- source_word: מִגְרָשֶׁיהָ
  choice: mga pastulan nito
  rationale: Tumutukoy sa bukas na lupa sa paligid na nakatalaga sa isang lungsod, karaniwang ginagamit bilang pastulan o lupang panlahat.
- source_word: גַּת רִמּוֹן
  choice: Gat-rimon
  rationale: Isinalin sa baybay bilang tambalang pangalang-pook; ang gitling ay nagpapakitang iisang pangalan ito.
- source_word: וְאֶת
  choice: at ... kasama ang
  rationale: Ang pangatnig at panandang pantukoy sa tuwirang layon ay likas na ipinahayag sa Filipino bilang magkakaugnay na talaan; hindi hiwalay na isinasalin ang אֶת.
theological_decisions: []
translation_notes:
  register: Makabagong, marangal, at madaling maunawaang Filipino. Ginamit ang “kasama ang” upang natural na maipahayag ang ugnayan ng lungsod at ng mga lupaing nakatalaga rito; pinanatili ang anyong talaan ng Hebreo.
