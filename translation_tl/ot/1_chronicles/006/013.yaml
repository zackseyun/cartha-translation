  yaml_path: translation/ot/1_chronicles/006/013.yaml
  text: 'And the sons of Samuel: the firstborn[a], Vashni, and Abijah.'
translation:
  language: tl
  text: 'At ang mga anak ni Samuel: ang panganay na si Vashni at si Abias.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי
  choice: At ang mga anak ni
  rationale: Pinananatili ng “At” ang dugtong sa talaangkanan, at likas sa Filipino ang “ang mga anak ni” para sa construct na sinusundan ng pangalang pantangi.
- source_word: שְׁמוּאֵל
  choice: Samuel
  rationale: Ginamit ang karaniwang anyo ng pangalang biblikal sa modernong Filipino.
- source_word: הַבְּכֹר
  choice: ang panganay
  rationale: Tiyak at natural na katumbas ito ng katawagang nagsasaad ng unang isinilang o ranggo sa magkakapatid.
- source_word: וַשְׁנִי
  choice: si Vashni
  rationale: Pinanatili bilang pangalang pantangi ayon sa patinig ng tekstong Masoretiko; ipinaliliwanag sa talababa ang posibleng pagbasa na “at ang ikalawa.”
- source_word: וַאֲבִיָּה
  choice: at si Abias
  rationale: Isinalin ang pang-ugnay at ginamit ang nakaugaliang anyong Filipino ng pangalang Abijah.
theological_decisions:
- issue: Suliranin sa pangalan at pagkakasunod-sunod ng mga anak ni Samuel
  choice: Panatilihin sa pangunahing teksto ang Masoretikong anyong “Vashni.”
  alternative: Basahin bilang “ang panganay, at ang ikalawa, si Abias,” o punan ang “Joel” batay sa 1 Samuel 8:2.
  rationale: Hindi tahimik na itinugma ang talata sa 1 Samuel 8:2. Sinusunod ng pangunahing teksto ang natanggap na anyong Hebreo, samantalang inilalahad sa talababa ang tunay na kalabuan sa teksto.
translation_notes:
  register: Maikli at marangal na estilong angkop sa talaangkanan. Ginamit ang natural na modernong Filipino at pinanatili sa talababa ang mahalagang kalabuan ng Hebreo.
