base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/014.yaml
  text: 'The sons of Merari: Mahli[a], Libni his son, Shimei his son, Uzzah his son.'
translation:
  language: tl
  text: 'Ang mga anak ni Merari[a]: si Mahli; si Libni na anak ni Mahli; si Simei na anak ni Libni; at si Uza na anak ni Simei.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, sa mas malawak na gamit sa talaangkanan, “mga inapo ni Merari.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: mga anak ni
  rationale: Ang construct plural ng בֵּן ay tuwirang nagpapakilala sa angkan. Likas sa Filipino ang “mga anak ni”; maaari rin itong tumukoy nang mas malawak sa mga inapo sa kontekstong talaangkanan.
- source_word: מְרָרִי
  choice: Merari
  rationale: Pangalang pantangi; isinalin sa karaniwang anyong ginagamit sa Filipino.
- source_word: מַחְלִי
  choice: Mahli
  rationale: Pangalang pantangi; pinanatili ang transliterasyong malapit sa Hebreo.
- source_word: לִבְנִי
  choice: Libni
  rationale: Pangalang pantangi; pinanatili ang transliterasyong malapit sa Hebreo.
- source_word: בְנוֹ
  choice: ang anak niyang / ang anak nitong
  rationale: Ang pangngalan na may hulaping panlalaking ikatlong panauhan ay nagsasaad ng ugnayang ama-anak. Ginamit ang “niyang” at “nitong” upang malinaw at natural na maipakita ang sunod-sunod na salinlahi.
- source_word: שִׁמְעִי
  choice: Simei
  rationale: Pangalang pantangi; ginamit ang karaniwang anyong Filipino sa Bibliya.
- source_word: עֻזָּה
  choice: Uza
  rationale: Pangalang pantangi; ang “Uza” ay natural na transliterasyon sa Filipino ng Hebreong pangalan.
