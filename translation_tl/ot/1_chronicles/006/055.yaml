base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/055.yaml
  text: 'And from the half-tribe of Manasseh: Aner with its pasturelands[a], and Bileam with its pasturelands, for the clan of the remaining sons of Kohath.'
translation:
  language: tl
  text: 'At mula sa kalahating lipi ni Manases: ang Aner kasama ang mga pastulan nito, at ang Bileam[a] kasama ang mga pastulan nito, para sa angkan ng mga natitirang anak ni Kohat.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bileam ang nasa tekstong Hebreo; Ibleam naman ang mababasa sa katulad na tala sa Josue 21:25.
    reason: textual_variant
lexical_decisions:
- source_word: וּמִמַּחֲצִית מַטֵּה מְנַשֶּׁה
  choice: At mula sa kalahating lipi ni Manases
  rationale: Ang מַחֲצִית ay “kalahati,” at ang מַטֶּה sa konteksto ng paghahati ng lupain ay “lipi.” Likas at malinaw sa Filipino ang “kalahating lipi.”
- source_word: אֶת עָנֵר
  choice: ang Aner
  rationale: Isinalin bilang pangalan ng lugar sa pamamagitan ng transliterasyon.
- source_word: מִגְרָשֶׁיהָ
  choice: kasama ang mga pastulan nito
  rationale: Ang מִגְרָשׁ ay tumutukoy sa bukas na lupa o pastulang nakapaligid at nakalaan sa isang bayan, lalo na sa mga bayang Levitico.
- source_word: בִּלְעָם
  choice: Bileam
  rationale: Pinananatili ang anyo ng pangalan ayon sa tekstong Hebreo; inilalahad sa talababa ang Ibleam na nasa katulad na tala sa Josue 21:25.
- source_word: לְמִשְׁפַּחַת לִבְנֵי קְהָת הַנּוֹתָרִים
  choice: para sa angkan ng mga natitirang anak ni Kohat
  rationale: Ang מִשְׁפָּחָה ay isang pamilya o angkan sa loob ng lipi; ang isahang anyo ay pinanatiling “angkan.” Ang הַנּוֹתָרִים ay tuwirang “mga natitira,” na tumutukoy sa mga anak ni Kohat na hindi pa nabibigyan sa naunang tala.
theological_decisions: []
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang karaniwang mga anyong Filipino ng Manases at Kohat, at ang “mga pastulan” para sa mga lupaing kalakip ng mga bayang Levitico. Inilagay ang pananda ng talababa pagkaraan ng “Bileam,” sapagkat sa pangalang iyon nauukol ang tekstuwal na pagkakaiba.
