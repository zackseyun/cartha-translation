  text: Ramoth with its pasturelands[a], and Anem with its pasturelands.
translation:
  language: tl
  text: ang Ramot at ang mga pastulan nito, at ang Anem[a] at ang mga pastulan nito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Anem ayon sa tekstong Hebreo; Aner naman ang mababasa sa katumbas na talaan sa Josue 21:25.
    reason: alternative_reading
lexical_decisions:
- source_word: רָאמוֹת
  choice: Ramot
  rationale: Pangalan ito ng lugar, kaya tinumbasan sa pamamagitan ng transliterasyong angkop sa pagbasa sa Filipino.
- source_word: מִגְרָשֶׁיהָ
  choice: mga pastulan nito
  rationale: Ang מִגְרָשׁ ay tumutukoy sa bukas na lupaing nakatalaga sa isang bayan, karaniwang ginagamit na pastulan; malinaw at natural ang “mga pastulan” sa konteksto ng mga bayan ng mga Levita.
- source_word: עָנֵם
  choice: Anem
  rationale: Pinanatili sa pangunahing teksto ang pagbasa ng tekstong Masoretiko, עָנֵם, sa pamamagitan ng transliterasyon.
- source_word: וְאֶת
  choice: at ang
  rationale: Hindi isinasalin nang hiwalay sa Filipino ang pananda ng tuwirang layon na אֶת; ang וְ ay ipinahahayag bilang “at,” at ang “ang” ay natural na pananda sa talaan ng mga bayan.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Ramot” sa halip na anyong Ingles na “Ramoth,” at inilagay ang talababa pagkatapos ng “Anem,” sapagkat ang alternatibong pagbasa ay tumutukoy sa pangalan ng bayang iyon.
