  text: וְ/לִ/בְנֵ֣י אַהֲרֹ֗ן נָתְנוּ֙ אֶת עָרֵ֣י הַ/מִּקְלָ֔ט אֶת חֶבְר֥וֹן וְ/אֶת לִבְנָ֖ה וְ/אֶת מִגְרָשֶׁ֑י/הָ וְ/אֶת יַתִּ֥ר וְ/אֶֽת אֶשְׁתְּמֹ֖עַ וְ/אֶת מִגְרָשֶֽׁי/הָ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/042.yaml
  text: 'And to the sons of Aaron they gave the cities of refuge: Hebron[a], and Libnah with its pasturelands, and Jattir, and Eshtemoa with its pasturelands.'
translation:
  language: tl
  text: 'At ibinigay nila sa mga anak ni Aaron ang mga lungsod na kanlungan: ang Hebron, ang Libna kasama ang lupang pastulan nito[a], ang Jatir, at ang Estemoa kasama ang lupang pastulan nito.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “bukas na lupain nito”; ang salitang Hebreo ay tumutukoy sa lupaing kaakibat ng isang lungsod.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/לִ/בְנֵי אַהֲרֹן
  choice: At ... sa mga anak ni Aaron
  rationale: Ang לְ ay nagmamarka sa tumatanggap. Ang “mga anak ni Aaron” ay likas sa Filipino at pinananatili ang konkretong anyo ng Hebreo sa kontekstong angkan.
- source_word: נָתְנוּ
  choice: ibinigay nila
  rationale: Karaniwang kahulugan ng נתן ang “magbigay.” Bagaman maaaring “itinalaga” sa konteksto ng paghahati ng lupain, mas tuwirang katumbas ang “ibinigay.”
- source_word: עָרֵי הַמִּקְלָט
  choice: mga lungsod na kanlungan
  rationale: Ipinahahayag nito ang mga lungsod na itinakda bilang lugar ng kanlungan ayon sa kautusan, nang hindi nagdaragdag ng paliwanag na wala sa talata.
- source_word: חֶבְרוֹן / לִבְנָה / יַתִּר / אֶשְׁתְּמֹעַ
  choice: Hebron / Libna / Jatir / Estemoa
  rationale: Isina-Filipino ang baybay ng mga pangalang pantangi ayon sa malinaw at karaniwang pagbigkas mula sa Hebreo.
- source_word: מִגְרָשֶׁיהָ
  choice: lupang pastulan nito
  rationale: Tumutukoy ang מִגְרָשׁ sa bukas na lupaing kaakibat ng isang lungsod, madalas para sa pagpapastol. Malinaw sa “nito” na ang lupa ay pag-aari o sakop ng kaagad na naunang lungsod.
theological_decisions:
- issue: Saklaw ng pariralang “mga lungsod na kanlungan” sa listahan
  choice: 'Pinanatili ang bantas at ayos ng Hebreo: “mga lungsod na kanlungan: ang Hebron, ang Libna...”'
  alternative: Ipaliwanag na Hebron lamang ang lungsod na kanlungan at ang iba ay karagdagang mga lungsod
  rationale: Ang anyo ng Masoretic Text ay may pangmaramihang “mga lungsod na kanlungan” bago ang listahan, kahit maaaring maunawaan mula sa mas malawak na konteksto na Hebron lamang ang tinutukoy na lungsod na kanlungan dito. Hindi tahasang nilutas ng salin ang tensiyong ito.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “lungsod na kanlungan” bilang madaling maunawaang katawagang legal, at “lupang pastulan” sa halip na mas lumang “mga kanugnog na lupain.”
