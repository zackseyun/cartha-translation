  source_fidelity: 'Tapat ang salin sa ibinigay na tekstong Hebreo: ang mga anak ni Aaron ang tumatanggap, ang pandiwa ay wastong naipahayag bilang “ibinigay nila,” at napanatili ang pagkakasunod ng mga lugar at ang dalawang pagbanggit ng lupaing kaugnay ng Libna at Estemoa. Hindi nito nilulutas nang lampas sa teksto ang posibleng tensiyon sa pariralang “mga lungsod na kanlungan.”'
