  text: 'At ang mga anak ni Kohat: sina Amram, Izhar, Hebron, at Uzziel.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי
  choice: At ang mga anak ni
  rationale: Pinananatili ng “At” ang ugnayan sa naunang talaangkanan, at ang construct na בְנֵי ay likas na isinasaling “mga anak ni” sapagkat ang apat na binanggit ay mga tuwirang anak ni Kohat.
- source_word: קְהָת
  choice: Kohat
  rationale: Isinatinig ang pangalang pantangi ayon sa karaniwang anyo nito sa makabagong saling Tagalog.
- source_word: עַמְרָם
  choice: Amram
  rationale: Isinatinig ang pangalang pantangi sa kinagawiang anyong Tagalog.
- source_word: וְיִצְהָר
  choice: Izhar
  rationale: Isinatinig ang pangalang pantangi; ipinahihiwatig na ng estruktura ng listahan ang prefixed conjunction.
- source_word: וְחֶבְרוֹן
  choice: Hebron
  rationale: Pangalan ito ng isang tao sa talaangkanan, hindi pagtukoy sa lungsod; pinananatili ang karaniwang anyo ng pangalan.
- source_word: וְעֻזִּיאֵל
  choice: Uziel
  rationale: Isinatinig ang pangalang pantangi sa anyong madaling basahin sa Tagalog, at ang pang-ugnay ay kinakatawan ng “at” bago ang huling pangalan.
