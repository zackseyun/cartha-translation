  text: 'And the sons of Elkanah: Amasai and Ahimoth[a].'
translation:
  language: tl
  text: 'At ang mga anak ni Elkana: sina Amasai at Ahimot.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/בְנֵי
  choice: At ang mga anak ni
  rationale: Pinananatili ng “At” ang pang-ugnay na וּ sa pagpapatuloy ng talaangkanan, at likas sa modernong Tagalog ang “mga anak ni” para sa construct na בְנֵי na sinusundan ng pangalang pantangi.
- source_word: אֶלְקָנָה
  choice: Elkana
  rationale: Pangalang pantangi; isinatitik ayon sa anyong Hebreo at inangkop sa karaniwang baybay sa Filipino, nang hindi isinasalin ang kahulugan nito.
- source_word: עֲמָשַׂי
  choice: Amasai
  rationale: Pangalang pantangi; ang “Amasai” ay malinaw na transliterasyon ng anyong Hebreo para sa mambabasang Filipino.
- source_word: וַ/אֲחִימוֹת
  choice: at Ahimot
  rationale: Isinalin ang prefixed conjunction bilang “at,” at isinatitik ang pangalang pantangi bilang “Ahimot,” na kumakatawan sa hulíng katinig na ת bilang t sa Filipino.
