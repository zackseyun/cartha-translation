  text: na anak ni Hasabias, na anak ni Amasias, na anak ni Hilkias.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן
  choice: anak ni
  rationale: Sa talaangkanan, maaaring tumukoy ang בֶּן sa tuwirang anak o sa inapo. Pinananatili ng “anak ni” ang paulit-ulit na pormula ng Hebreo at natural itong basahin sa Filipino sa loob ng talaan.
- source_word: חֲשַׁבְיָה
  choice: Hasabias
  rationale: Ginamit ang kinaugaliang anyong Filipino ng pangalang Hebreo, na madaling makilala at angkop sa tradisyon ng mga pangalang biblikal sa Tagalog.
- source_word: אֲמַצְיָה
  choice: Amasias
  rationale: Ginamit ang kinaugaliang anyong Filipino ng pangalang Hebreo sa halip na isalin ang kahulugan nito.
- source_word: חִלְקִיָּה
  choice: Hilkias
  rationale: Ginamit ang kinaugaliang anyong Filipino ng pangalang Hebreo upang mapanatili ang pagkakilala rito sa mga saling Tagalog.
theological_decisions: []
