base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/063.yaml
  text: 'And beyond the Jordan at Jericho[a], east of the Jordan, from the tribe of Reuben: Bezer in the wilderness, with its pasturelands, and Jahzah, with its pasturelands.'
translation:
  language: tl
  text: 'At mula sa kabilang panig ng Jordan, sa tapat ng Jerico—sa silangan ng Jordan—mula sa lipi ni Ruben: ang Bezer sa ilang, kasama ang mga pastulan nito, at ang Jahzah[a], kasama ang mga pastulan nito.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Jahzah ay tinatawag ding Jahaz sa ibang salin.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֵעֵבֶר לְיַרְדֵּן יְרֵחוֹ
  choice: At sa ibayo ng Jordan, sa tapat ng Jerico
  rationale: Ipinagpapatuloy ng וּ ang talaan, at ang מֵעֵבֶר ay nagsasaad ng kabilang panig. Ang Jerico ay nagsisilbing heograpikong pantukoy; ang “sa tapat ng Jerico” ay likas na Filipino at hindi nagpapahiwatig na nasa loob mismo ng Jerico ang mga lunsod.
- source_word: לְמִזְרַח הַיַּרְדֵּן
  choice: sa silangan ng Jordan
  rationale: Tuwirang ipinapahayag ang heograpikong direksiyon nang malinaw at natural.
- source_word: מִמַּטֵּה רְאוּבֵן
  choice: mula sa lipi ni Ruben
  rationale: Sa konteksto ng paghahati ng lupain, ang מַטֶּה ay tumutukoy sa lipi, hindi sa literal na tungkod.
- source_word: בֶּצֶר בַּמִּדְבָּר
  choice: ang Bezer sa ilang
  rationale: Pinananatili ang pangalang pook na Bezer at isinasalin ang מִדְבָּר bilang “ilang,” isang maikli, marangal, at karaniwang salin para sa lupaing hindi matao o hindi sinasaka.
- source_word: מִגְרָשֶׁיהָ
  choice: mga pastulan nito
  rationale: Sa mga talaan ng mga lunsod ng mga Levita, tumutukoy ang מִגְרָשׁ sa bukas na lupa sa paligid ng lunsod na ginagamit, bukod sa iba pa, sa pagpapastol.
- source_word: יַהְצָה
  choice: Jahza
  rationale: Ang anyong Hebreo ay Yahatsah/Jahzah; ang “Jahza” ay isang nababasang transliterasyon sa Filipino na pinananatili ang huling patinig ng anyong nasa talata.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na may dignidad at malinaw na anyong pangtalaan. Ginamit ang “sa ibayo” para sa heograpikong kabilang panig, “sa tapat ng Jerico” upang linawin ang kaugnayan ng Jerico, at “mga pastulan” bilang madaling maunawaang katawagan sa mga bukas na lupa ng lunsod.
