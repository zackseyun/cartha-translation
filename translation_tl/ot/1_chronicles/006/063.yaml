    rationale: Ang “sa ibayo ng Jordan” ay nauunawaan, ngunit ang “mula sa kabilang panig ng Jordan” ay mas ganap na kumakatawan sa anyong pang-ukol sa Hebreo at nananatiling natural sa Filipino.
