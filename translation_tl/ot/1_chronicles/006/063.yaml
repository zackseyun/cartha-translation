  source_fidelity: Tumpak sa kabuuan ang heograpikong ayos at ang mga lungsod/pastulan. Gayunman, ang anyong Hebreo na יַהְצָה ay mas wastong maisalin bilang “Jahzah,” hindi “Jahza.” Ang “mula sa kabilang panig ng Jordan” ay mas malinaw ding kumakatawan sa מֵעֵבֶר kaysa sa “sa ibayo ng Jordan.”
  naturalness: Natural at angkop sa modernong Filipino ang “sa tapat ng Jerico,” “sa silangan ng Jordan,” “lipi ni Ruben,” at “mga pastulan nito.” Ang binagong pagkakasunod na may gitling ay nagpapanatili ng pagiging talaan habang nililinaw ang heograpikong panuring.
  terminology: Ang “lipi,” “ilang,” at “mga pastulan” ay angkop sa konteksto ng talaan ng mga lunsod ng Levita. Pinananatili ang mga pangalang Bezer, Jerico, Ruben, at Jahzah sa pare-parehong transliterasyon.
