  text: and Jokmeam with its pasturelands[b][a], and Beth-horon with its pasturelands.
translation:
  language: tl
  text: at ang Jokmeam at ang mga pastulan nito[a][b], at ang Beth-horon at ang mga pastulan nito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “Jokmeam”; “Jokneam” ang mababasa sa ilang tradisyong Ingles dahil iniuugnay ito sa magkakatulad na pangalan ng lugar sa ibang mga talata.
    reason: alternative_reading
  - marker: b
    text: Maaari ring isalin na “mga lupang panlahat” o “mga lupaing nakapaligid”—ang mga lupaing nakatalaga sa bawat lungsod.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָקְמְעָם
  choice: Jokmeam
  rationale: Tinumbasan ayon sa anyong katinig ng pangalang Hebreo sa Chronicles. Bagaman may tradisyong gumagamit ng “Jokneam” kaugnay ng ibang pagbanggit sa Bibliya, “Jokmeam” ang sinusuportahan ng tekstong Masoretiko rito.
- source_word: מִגְרָשֶׁיהָ
  choice: mga pastulan nito
  rationale: Sa konteksto ng mga lungsod ng mga Levita, tumutukoy ang מִגְרָשׁ sa bukas na lupaing nakapaligid at nakatalaga sa lungsod, karaniwang ginagamit na pastulan. Likas at malinaw sa modernong Filipino ang “mga pastulan nito.”
- source_word: בֵּית חוֹרוֹן
  choice: Beth-horon
  rationale: Pinanatili ang kinikilalang transliterasyon ng tambalang pangalang Hebreo, na may gitling upang ipakita ang pagkakaugnay ng dalawang bahagi.
- source_word: וְאֶת
  choice: at … kasama ang
  rationale: Hindi isinasalin nang hiwalay ang pantukoy sa tuwirang layon. Sa konteksto ng talaan, natural na ipinapahayag ng “at” ang koordinasyon, samantalang nililinaw ng “kasama ang” ang ugnayan ng lungsod at ng mga pastulan nito.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na tuwiran at marangal. Pinanatili ang mga pangalan ng lugar sa transliteradong anyo, at ginamit ang “pastulan” bilang madaling maunawaang katumbas sa konteksto ng mga lungsod ng mga Levita.
