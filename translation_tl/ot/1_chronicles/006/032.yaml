lexical_decisions:
- source_word: בֶּן
  choice: anak ni
  rationale: Sa sunod-sunod na talaangkanan, likas at malinaw sa modernong Tagalog ang “anak ni.” Bagaman maaaring tumukoy ang בֶּן sa isang inapo kapag may nilalaktawang salinlahi, walang dahilan sa mismong hanay na ito upang iwan ang karaniwang tuwirang kahulugan.
- source_word: מַחְלִי
  choice: Mahli
  rationale: Isinalin sa baybay na angkop sa Tagalog ang pangalang pantangi, nang hindi isinasalin ang posibleng kahulugan nito.
- source_word: מוּשִׁי
  choice: Mushi
  rationale: Isinalin sa baybay na angkop sa Tagalog ang pangalang pantangi.
- source_word: מְרָרִי
  choice: Merari
  rationale: Isinalin sa baybay na angkop sa Tagalog ang pangalang pantangi.
- source_word: לֵוִי
  choice: Levi
  rationale: Pinanatili ang nakaugaliang anyong Tagalog ng pangalan ng patriyarka.
