revisions:
- from: Itinalaga nila sa pamamagitan ng palabunutan, mula sa lipi ng mga anak ni Juda, sa lipi ng mga anak ni Simeon, at sa lipi ng mga anak ni Benjamin, ang mga lunsod na ito, na tatawagin nila sa kani-kanilang pangalan.[a]
  to: Itinalaga nila sa pamamagitan ng palabunutan, mula sa lipi ng mga anak ni Juda, mula sa lipi ng mga anak ni Simeon, at mula sa lipi ng mga anak ni Benjamin, ang mga lunsod na ito na tinawag nila ayon sa pangalan.[a]
  rationale: Inulit ang “mula sa” upang tumbasan ang sintaks ng Hebreo at maiwasan ang kalabuan sa ugnayan ng mga lipi at lunsod. Pinalitan ang “na tatawagin nila sa kani-kanilang pangalan” ng “na tinawag nila ayon sa pangalan” upang maging likas sa modernong Filipino at upang mas tumpak na maihatid ang pormulang Hebreo, na ipinaliliwanag ng talababa.
