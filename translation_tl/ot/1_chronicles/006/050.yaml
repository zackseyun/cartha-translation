base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/050.yaml
  text: They assigned by lot from the tribe of the sons of Judah[a], and from the tribe of the sons of Simeon, and from the tribe of the sons of Benjamin, these cities, which they called by name.
translation:
  language: tl
  text: Itinalaga nila sa pamamagitan ng palabunutan, mula sa lipi ng mga anak ni Juda, mula sa lipi ng mga anak ni Simeon, at mula sa lipi ng mga anak ni Benjamin, ang mga lunsod na ito na tinawag nila ayon sa pangalan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, sa mas malayang salin, “na nakatalang ayon sa pangalan.” Literal na ginagamit sa Hebreo ang pandiwang “tawagin” kasama ng “ayon sa mga pangalan,” isang pormulang nagpapakilala sa sumusunod na talaan ng mga lunsod.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ
  choice: Itinalaga nila
  rationale: Bagaman karaniwang nangangahulugang “ibinigay” ang נתן, ipinahihiwatig ng konteksto ang pormal na pagtatalaga ng mga lunsod sa pamamagitan ng palabunutan.
- source_word: בַגּוֹרָל
  choice: sa pamamagitan ng palabunutan
  rationale: Malinaw at likas na Filipino para sa pamamaraang gumagamit ng sapalaran sa paghahati o pagtatalaga.
- source_word: מִמַּטֵּה
  choice: mula sa lipi ng
  rationale: Sa talaang panlipi, ang מַטֶּה ay tumutukoy sa “lipi,” hindi sa literal na tungkod.
- source_word: בְנֵי יְהוּדָה / בְנֵי שִׁמְעוֹן / בְּנֵי בִנְיָמִן
  choice: mga anak ni Juda / mga anak ni Simeon / mga anak ni Benjamin
  rationale: Pinananatili ang panlipi at angkang anyo ng Hebreong “mga anak ni,” na malinaw rin sa Filipino.
- source_word: הֶעָרִים הָאֵלֶּה
  choice: ang mga lunsod na ito
  rationale: Tuwirang salin ng pariralang demonstratibo; ang “lunsod” ang karaniwang katawagan sa ganitong konteksto ng paghahati ng lupain.
- source_word: אֲשֶׁר יִקְרְאוּ אֶתְהֶם בְּשֵׁמוֹת
  choice: na tatawagin nila sa kani-kanilang pangalan
  rationale: Pinananatili ang pandiwang קרא (“tumawag”) at ang di-ganap na anyong maaaring tumukoy sa kasunod na pagbabanggit ng mga pangalan, habang ginagawang mauunawaan sa Filipino ang Hebreong pormula.
