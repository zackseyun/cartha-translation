translation_notes:
  register: Makabago at marangal na Filipino; pinanatili ang pananalitang panlipi na “mga anak ni” at ang pormulang may pandiwang “tawagin,” ngunit inayos ang parirala upang maging malinaw sa karaniwang mambabasa.
