- from: At sa mga anak ni Kohat na natira[a], mula sa mga angkan ng lipi, mula sa kalahating lipi—ang kalahati ng Manases—ay sampung lungsod ang ibinigay sa pamamagitan ng palabunutan.
  to: At sa natitirang mga anak ni Kohat, mula sa mga angkan ng lipi, mula sa kalahating lipi—ang kalahati ng lipi ni Manases[a]—ay sampung lungsod ang ibinigay sa pamamagitan ng palabunutan.
