  text: And to the sons of Kohath[a] who remained, from the families of the tribe, from the half-tribe, the half of Manasseh, ten cities were given by lot.
translation:
  language: tl
  text: At sa natitirang mga anak ni Kohat, mula sa mga angkan ng lipi, mula sa kalahating lipi—ang kalahati ng lipi ni Manases[a]—ay sampung lungsod ang ibinigay sa pamamagitan ng palabunutan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal na Hebreo, “mula sa mga angkan ng lipi, mula sa kalahating lipi, ang kalahati ng Manases,” isang pormulang tumutukoy sa kalahating lipi ni Manases.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/לִ/בְנֵי קְהָת
  choice: At sa mga anak ni Kohat
  rationale: Pinananatili ang pang-ugnay, ang diwa ng paglalaan sa kanila, at ang pangangkanang idyomang “mga anak ni” sa natural na Tagalog.
- source_word: הַנּוֹתָרִים
  choice: na natira
  rationale: Tumutukoy sa natitirang mga Kohatita matapos ang naunang mga paglalaan; tuwiran at malinaw sa modernong Tagalog.
- source_word: מִ/מִּשְׁפַּחַת הַ/מַּטֶּה
  choice: mula sa mga angkan ng lipi
  rationale: Ang מִשְׁפָּחָה ay pangkat ng magkakamag-anak o angkan, at ang מַטֶּה sa kontekstong ito ay “lipi.” Ginamit ang maramihan ayon sa kolektibong konteksto ng pamamahagi.
- source_word: מִֽ/מַּחֲצִית מַטֵּה חֲצִי מְנַשֶּׁה
  choice: mula sa kalahating lipi—ang kalahati ng Manases
  rationale: Pinananatili ang kapansin-pansing pag-uulit ng Hebreo at nililinaw sa pamamagitan ng gatlang na tumutukoy ito sa kalahating lipi ni Manases.
- source_word: בַּ/גּוֹרָל
  choice: sa pamamagitan ng palabunutan
  rationale: Ipinapahayag ang paraan ng paglalaan sa pamamagitan ng sapalarang pagbunot, nang hindi ipinapalagay ang tiyak na pisikal na pamamaraan.
- source_word: עָרִים עָשֶׂר
  choice: sampung lungsod ang ibinigay
  rationale: Ang Hebreo ay walang hayag na pandiwa sa pormulang ito; idinagdag ang “ibinigay” mula sa malinaw na konteksto ng paglalaan.
