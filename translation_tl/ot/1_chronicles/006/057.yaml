lexical_decisions:
- source_word: וּ/מִ/מַּטֵּה
  choice: At mula sa lipi ni
  rationale: Ang מַטֶּה sa konteksto ng paghahati ng lupain ay tumutukoy sa lipi; pinananatili ng “At mula sa” ang pagpapatuloy ng talaan.
- source_word: יִשָׂשכָר
  choice: Isacar
  rationale: Karaniwang anyong Filipino ng pangalan ng lipi.
- source_word: קֶדֶשׁ
  choice: Kedesh
  rationale: Pangalan ng lugar na tinumbasan sa baybay-Latin nang hindi dinaragdagan ng panuring na wala sa Hebreo.
- source_word: מִגְרָשֶׁיהָ
  choice: ang mga pastulan nito
  rationale: Ang מִגְרָשׁ ay lupang bukás sa palibot ng isang lungsod, karaniwang ginagamit na pastulan; malinaw at natural sa modernong Filipino ang “mga pastulan nito.”
- source_word: דָּבְרַת
  choice: Daberat
  rationale: Malapit na transliterasyon sa anyong Hebreo; pinananatili sa talababa ang alternatibong baybay na makikita sa ilang salin at sa kahilerang talaan.
