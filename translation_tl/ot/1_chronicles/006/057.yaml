  text: 'And from the tribe of Issachar: Kedesh with its pasturelands[a], and Daberath with its pasturelands.'
translation:
  language: tl
  text: 'At mula sa lipi ni Isacar: Kedesh kasama ang mga pastulan nito, at Daberat[a] kasama ang mga pastulan nito.'
  philosophy: optimal-equivalence
  footnotes:
