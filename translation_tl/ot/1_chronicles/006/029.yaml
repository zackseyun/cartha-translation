base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/029.yaml
  text: 'And the sons of Merari[a], their brothers, were on the left: Ethan son of Kishi, son of Abdi, son of Malluch.'
translation:
  language: tl
  text: 'At ang mga anak ni Merari—ang kanilang mga kapatid[a]—ay nasa kaliwa: si Etan na anak ni Kisi, na anak ni Abdi, na anak ni Maluc.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga kaanak nila”; sa mga talaangkanan, ang salitang Hebreo para sa “mga kapatid” ay maaari ring tumukoy nang mas malawak sa mga kabilang sa iisang angkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי מְרָרִי
  choice: At ang mga anak ni Merari
  rationale: Pinananatili ang literal na anyong pangangkan na “mga anak ni,” na maaari ring tumukoy sa mga inapo o angkan sa ganitong konteksto.
- source_word: אֲחֵיהֶם
  choice: na kanilang mga kapatid
  rationale: Ang salitang Hebreo ay pangunahing nangangahulugang “mga kapatid,” ngunit maaari ring tumukoy nang mas malawak sa mga kaanak o kasamahan sa angkan; pinanatili sa teksto ang pampamilyang pananalita at inilagay sa talababa ang alternatibo.
- source_word: עַל הַשְּׂמֹאול
  choice: ay nasa kaliwa
  rationale: Tuwirang ipinahahayag ang puwesto sa kaliwa; idinagdag ang “ay nasa” upang maging likas at buo sa Filipino ang eliptikong pariralang Hebreo.
- source_word: אֵיתָן בֶּן קִישִׁי בֶּן עַבְדִּי בֶּן מַלּוּךְ
  choice: si Etan na anak ni Kisi, na anak ni Abdi, na anak ni Maluc
  rationale: Isinalin ang paulit-ulit na בֶּן bilang “anak ni” upang mapanatili ang malinaw na hanay ng angkan, at inangkop ang mga pangalang pantangi sa natural na baybay sa Filipino.
