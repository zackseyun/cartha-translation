base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/061.yaml
  text: 'And from the tribe of Naphtali: Kedesh in Galilee with its pasturelands[a], Hammon with its pasturelands, and Kiriathaim with its pasturelands.'
translation:
  language: tl
  text: 'At mula sa lipi ni Neftali: ang Kedes sa Galilea, kasama ang mga pastulan nito[a]; ang Hamon, kasama ang mga pastulan nito; at ang Kiriataim, kasama ang mga pastulan nito.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga lupaing panlahat.” Ang salitang Hebreo ay tumutukoy sa bukás na lupaing pag-aari o nakatalaga sa bawat lungsod.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִמַּטֵּה
  choice: At mula sa lipi ni
  rationale: Sa konteksto ng paghahati ng lupain, ang מַטֶּה ay tumutukoy sa isang lipi; likas sa Tagalog ang pariralang “mula sa lipi ni.”
- source_word: נַפְתָּלִי
  choice: Neftali
  rationale: Ginamit ang nakaugaliang anyo ng pangalan sa mga saling Tagalog.
- source_word: קֶדֶשׁ בַּגָּלִיל
  choice: Kedes sa Galilea
  rationale: Pinananatili ang pangalan ng lugar at likas na isinasalin ang panrehiyong pantukoy na בַּגָּלִיל bilang “sa Galilea.”
- source_word: מִגְרָשֶׁיהָ
  choice: mga pastulan nito
  rationale: Ang מִגְרָשׁ ay bukás na lupaing nakatalaga sa isang lungsod, karaniwang ginagamit bilang pastulan; malinaw at maikli ang “mga pastulan,” habang inilalahad sa talababa ang mas malawak na diwa.
- source_word: חַמּוֹן
  choice: Hamon
  rationale: Direktang transliterasyon sa makabagong baybay na madaling basahin sa Tagalog.
- source_word: קִרְיָתַיִם
  choice: Kiriataim
  rationale: Transliterasyong malapit sa Hebreo at angkop sa palatunugang Tagalog.
