base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/051.yaml
  text: And from the families of the sons of Kohath[b][a], the cities of their territory were from the tribe of Ephraim.
translation:
  language: tl
  text: At mula sa mga angkan ng mga anak ni Kohat, ang mga lunsod sa kanilang nasasakupan[a] ay mula sa lipi ni Efraim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang kanilang mga lunsod sa hangganan”; ang salitang Hebreo ay maaaring tumukoy sa “hangganan” o “nasasakupang lupain.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִמִּשְׁפְּחוֹת
  choice: At mula sa mga angkan ng
  rationale: Ang מִשְׁפָּחוֹת ay tumutukoy sa mga pangkat ng magkakamag-anak o mga angkan. Pinananatili ng “mula sa” ang puwersa ng מִן, at ng “At” ang tuloy-tuloy na daloy ng talaan.
- source_word: בְּנֵי קְהָת
  choice: mga anak ni Kohat
  rationale: Literal itong “mga anak ni Kohat.” Sa kontekstong angkan, maaari itong tumukoy sa mga inapo, ngunit pinananatili rito ang anyong Hebreo at ang estilong panggenealohiya ng Mga Cronica.
- source_word: וַיְהִי
  choice: ay
  rationale: Sa kontekstong ito, ang היה ay nagsisilbing payak na panandang kopular sa pahayag tungkol sa pagkakaloob ng mga lunsod; natural itong ipinahahayag sa Tagalog sa pamamagitan ng “ay.”
- source_word: עָרֵי גְבוּלָם
  choice: ang mga lunsod sa kanilang nasasakupan
  rationale: Ang עָרֵי ay “mga lunsod,” samantalang ang גְבוּל ay maaaring mangahulugang hangganan o nasasakupang lupain. Ang “sa kanilang nasasakupan” ay natural na nagpapahayag ng teritoryal na diwa nang hindi ito nililimitahan sa mga lunsod na nasa mismong hangganan.
- source_word: מִמַּטֵּה אֶפְרָיִם
  choice: mula sa lipi ni Efraim
  rationale: Sa konteksto ng paghahati ng lupain, ang מַטֶּה ay nangangahulugang “lipi.” Ang “mula sa lipi ni Efraim” ang malinaw at karaniwang katumbas sa modernong Tagalog.
theological_decisions: []
translation_notes:
  register: Makabagong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “angkan” para sa pangkat ng magkakamag-anak, “mga anak ni Kohat” upang mapanatili ang anyong panggenealohiya ng Hebreo, at “nasasakupan” upang maipakita ang malawak na saklaw ng גְבוּל.
