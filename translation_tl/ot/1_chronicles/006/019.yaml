  text: anak ni Elkana, anak ni Jeroham, anak ni Eliel, anak ni Toha.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ihambing ang kaugnay na talaangkanan sa 1 Samuel 1:1, kung saan ang Eliel at Toha ay lumilitaw bilang Elihu at Tohu.
