lexical_decisions:
- source_word: בֶּן
  choice: anak ni
  rationale: Sa talaangkanan, ang בֶּן ay karaniwang tumutukoy sa pagiging anak o kabilang sa tuwirang linya ng angkan. Ang paulit-ulit na “anak ni” ang likas at pormal na katumbas sa modernong Tagalog.
- source_word: אֶלְקָנָה
  choice: Elkana
  rationale: Isinalin sa baybay na malapit sa bigkas ng Hebreo at natural sa Tagalog.
- source_word: יְרֹחָם
  choice: Jeroham
  rationale: Pinanatili ang personal na pangalan sa transliterasyong angkop sa Tagalog.
- source_word: אֱלִיאֵל
  choice: Eliel
  rationale: Tuwirang transliterasyon ng pangalang Hebreo.
- source_word: תּוֹחַ
  choice: Toha
  rationale: Ang anyong Masoretiko na תּוֹחַ ay pinakamalapit na mailalarawan sa Tagalog bilang “Toha”; hindi pinalitan ng pangalang nasa kahawig na talaangkanan.
theological_decisions: []
translation_notes:
  register: Maikli at pormal ang ayos upang mapanatili ang paulit-ulit na estilo ng talaangkanan. Ginamit ang karaniwang Tagalog na “anak ni” at mga pangalang transliterado nang malapit sa Hebreo. Inilagay ang talababa sa “Toha,” ang pangalang aktuwal na may kaugnayan sa pagkakaiba ng mga talaangkanan.
