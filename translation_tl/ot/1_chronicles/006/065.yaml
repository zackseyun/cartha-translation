base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/065.yaml
  text: 'And from the tribe of Gad: Ramoth in Gilead with its pasturelands[a], and Mahanaim with its pasturelands.'
translation:
  language: tl
  text: 'At mula sa lipi ni Gad: ang Ramot sa Gilead[a] kasama ang mga pastulan nito, at ang Mahanaim kasama ang mga pastulan nito.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Ramot-Gilead.”
    reason: Pinananatili ang alternatibong paraan ng pagbuo sa pangalan ng lugar, bagaman mas tuwirang sinasalamin ng “Ramot sa Gilead” ang pang-ukol sa Hebreo.
lexical_decisions:
- source_word: וּמִמַּטֵּה
  choice: At mula sa lipi ni
  rationale: Sa konteksto ng paghahati ng lupain, ang מַטֶּה ay tumutukoy sa isang lipi. Ang mga unlapi na וּ at מִן ay likas na isinaling “At mula sa.” Ginamit ang “ni” dahil pangalang pantangi na Gad ang kasunod.
- source_word: גָד
  choice: Gad
  rationale: Pangalan ng lipi; pinanatili sa karaniwang anyong ginagamit sa Filipino.
- source_word: רָאמוֹת בַּגִּלְעָד
  choice: Ramot sa Gilead
  rationale: Tuwirang ipinakikita ng “sa Gilead” ang lokatibong diwa ng pang-ukol na בְּ, habang ang “Ramot” ay angkop na transliterasyon sa Filipino.
- source_word: מִגְרָשֶׁיהָ
  choice: mga pastulan nito
  rationale: Ang מִגְרָשׁ ay bukás na lupa sa paligid ng isang lunsod, lalo na para sa pagpapastol sa konteksto ng mga lunsod ng mga Levita. Malinaw at natural sa modernong Filipino ang “mga pastulan.”
- source_word: מַחֲנַיִם
  choice: Mahanaim
  rationale: Pangalan ng lugar; isinalin sa pamamagitan ng transliterasyon.
- source_word: וְאֶת
  choice: at ang
  rationale: Ang וְ ay nag-uugnay sa mga bagay na nakalista, samantalang ang אֵת ay pananda ng tiyak na layon. Sa Filipino, natural itong katawanin bilang “at ang.”
