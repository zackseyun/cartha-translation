base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/011.yaml
  text: Elkanah his son[a], Elkanah his son, Zophai his son, and Nahath his son.
translation:
  language: tl
  text: Si Elkana na anak niya, si Elkana na anak niya, si Zofai[a] na anak niya, at si Nahat na anak niya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Zupai,” ayon sa ibang tradisyon ng pagbigkas at transliterasyon ng pangalang צוֹפַי.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶלְקָנָה
  choice: Elkana
  rationale: Pangngalang pantangi; ginamit ang karaniwang anyong Filipino ng transliterasyon at pinanatili ang dalawang paglitaw nito sa ibinigay na tekstong Hebreo.
- source_word: בְּנוֹ / בנו
  choice: na anak niya
  rationale: Ang pangngalang may hulaping panlalaking ikatlong panauhan ay likas na isinasalin sa Filipino bilang “na anak niya”; inulit ito upang mapanatili ang indayog ng talaangkanan.
- source_word: צוֹפַי
  choice: Zofai
  rationale: Pangngalang pantangi na tinumbasan ayon sa ibinigay na pagbigkas ng tekstong Masoretiko; inilagay sa talababa ang alternatibong tradisyon ng transliterasyon.
- source_word: וְ
  choice: at
  rationale: Payak na pang-ugnay sa huling pangalan sa sunuran.
- source_word: נַחַת
  choice: Nahat
  rationale: Direktang transliterasyon ng pangngalang pantangi sa anyong madaling basahin sa Filipino.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang paulit-ulit na hulma ng talaangkanan. Inilagay ang [a] pagkatapos ng “Zofai,” dahil ang talababa ay tumutukoy sa pangalang iyon.
