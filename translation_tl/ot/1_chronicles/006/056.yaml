  source_fidelity: Tumpak na naihahatid ng draft ang pagtatalaga sa mga anak ni Gersom mula sa angkan ng kalahating lipi ni Manases, pati ang dalawang lungsod at ang kani-kanilang מִגְרָשׁ (mga lupang nakapaligid sa lungsod). Gayunman, ang 'pastulan' ay maaaring magpahiwatig na eksklusibong gamit-pastol ang tinutukoy, samantalang mas malawak ang Hebreong termino para sa nakalaang bukas na lupain ng lungsod.
  naturalness: Nauunawaan ang kasalukuyang listahan, ngunit mabigat at paulit-ulit ang anyong 'at ang ... at ang ... at ang.' Ang paggamit ng 'kasama ang' at ng kuwit ay mas likas sa modernong Filipino at malinaw na iniuugnay ang mga lupain sa bawat lungsod.
  terminology: Ang 'angkan,' 'kalahating lipi,' at mga pangalang Gersom, Manases, Golan, Basan, at Astarot ay katanggap-tanggap. Pinalitan ang pangunahing salin ng מִגְרָשֶׁיהָ ng 'mga lupain sa paligid nito' upang hindi paliitin ang saklaw; pinananatili ng talababa ang 'mga pastulan' bilang makatwirang leksikal na alternatibo.
  issues:
