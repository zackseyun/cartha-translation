base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/056.yaml
  text: 'To the sons of Gershom[a], from the clan of the half-tribe of Manasseh: Golan in Bashan with its pasturelands, and Ashtaroth with its pasturelands.'
translation:
  language: tl
  text: 'Sa mga anak ni Gersom, mula sa angkan ng kalahating lipi ni Manases: Golan sa Basan, kasama ang mga lupain sa paligid nito,[a] at Astarot, kasama ang mga lupain sa paligid nito.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga pastulan” o “mga lupaing panlahat.” Ang salitang Hebreo ay tumutukoy sa bukas na lupang nakatalaga sa isang lungsod, na madalas gamitin sa pagpapastol.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי גֵּרְשׁוֹם
  choice: Sa mga anak ni Gersom
  rationale: Pinananatili ang karaniwang pormulang pangangkan na “mga anak,” habang ipinapahayag ng “sa” ang pagtatalaga o pagbibigay sa kanila.
- source_word: מִמִּשְׁפַּחַת
  choice: mula sa angkan ng
  rationale: Sa kontekstong panlipi, tumutukoy ito sa isang pangkat na mas malawak sa sambahayan ngunit nasa loob ng isang lipi; natural at tumpak dito ang “angkan.”
- source_word: חֲצִי מַטֵּה מְנַשֶּׁה
  choice: kalahating lipi ni Manases
  rationale: Malinaw nitong inilalarawan ang bahaging panlipi ni Manases na pinagkunan ng mga lungsod.
- source_word: אֶת גּוֹלָן בַּבָּשָׁן
  choice: ang Golan sa Basan
  rationale: Ang Golan ay lungsod at ang Basan ay rehiyon; ang “sa” ay likas na nagpapahayag ng lokasyon.
- source_word: מִגְרָשֶׁיהָ
  choice: ang mga pastulan nito
  rationale: Tumutukoy ang salita sa bukas na lupa sa palibot ng lungsod, karaniwang ginagamit sa pagpapastol at iba pang gamit ng pamayanan.
- source_word: עַשְׁתָּרוֹת
  choice: Astarot
  rationale: Direkta at madaling basahing transliterasyon sa modernong Filipino ng pangalan ng lugar.
- source_word: וְאֶת ... וְאֶת
  choice: at ... at
  rationale: Pinananatili ang koordinasyon ng mga lungsod at ng kani-kanilang nakapaligid na lupain nang natural sa Filipino.
