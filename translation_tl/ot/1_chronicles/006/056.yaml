  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang anyong talaan ng pamamahagi, ang pormulang pangangkan na “mga anak,” at ang mga pangalang Gersom, Manases, Basan, at Astarot sa karaniwang anyong Filipino.
