  text: 'These are the names of the sons of Gershom: Libni and Shimei[a].'
translation:
  language: tl
  text: 'Ito ang mga pangalan ng mga anak ni Gersom: sina Libni at Simei.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gersom ang mababasa rito sa mga manuskritong Hebreo; Gershon naman ang ginagamit sa ilang tradisyong Ingles sa kaugnay na mga talaangkanan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Ito ang
  rationale: Ipinakikilala ng parirala ang isang talaan. Natural sa modernong Tagalog ang “Ito ang” at hindi kailangang isalin nang hiwalay ang panimulang pangatnig.
- source_word: שְׁמוֹת
  choice: mga pangalan
  rationale: Kasama ng בְּנֵי, bumubuo ito ng pariralang “mga pangalan ng mga anak ni,” na malinaw at natural sa Tagalog.
- source_word: בְּנֵי
  choice: mga anak ni
  rationale: Bagaman maaari itong mangahulugang mas malalayong inapo sa ibang talaangkanan, dito ay dalawang tuwirang anak ni Gersom ang tinutukoy.
- source_word: גֵרְשׁוֹם
  choice: Gersom
  rationale: Pangngalang pantangi ito; ang “Gersom” ay likas na transliterasyon sa Filipino ng anyong Hebreo rito.
- source_word: לִבְנִי
  choice: Libni
  rationale: Pangngalang pantangi na tinumbasan sa karaniwang transliterasyong Filipino.
- source_word: וְשִׁמְעִי
  choice: at Simei
  rationale: Ang panlaping pangatnig ay nag-uugnay sa ikalawang pangalan; “Simei” ang likas na transliterasyong Filipino.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “sina” bago ang dalawang pangalan upang maging natural ang talaan sa Tagalog, habang pinananatili ang payak na anyo ng genealogical notice.
