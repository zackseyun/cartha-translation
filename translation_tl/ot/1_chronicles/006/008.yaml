  text: Elkanah his son[a], and Ebiasaph his son, and Assir his son.
translation:
  language: tl
  text: Si Elkanah, ang kaniyang anak; si Ebiasaf[a], ang kaniyang anak; at si Asir, ang kaniyang anak.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Abiasaf,” ayon sa mas kilalang tradisyonal na transliterasyon sa ilang salin at sa katumbas na mga anyo sa magkakatulad na talaangkanan.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶלְקָנָה
  choice: Elkanah
  rationale: Pangngalang pantangi; tinumbasan sa pamamagitan ng transliterasyong angkop sa makabagong Filipino.
- source_word: בְנוֹ
  choice: anak niya
  rationale: Ang בֵּן na may hulaping panlalaking isahan ay tuwirang nangangahulugang “anak niya.” Bagaman maaari itong tumukoy sa inapo sa ilang talaangkanan, pinanatili rito ang lantad na ugnayang ipinahahayag ng anyo.
- source_word: וְ
  choice: at
  rationale: Karaniwang pang-ugnay sa magkakasunod na pangalan sa talaangkanan.
- source_word: אֶבְיָסָף
  choice: Ebiasaf
  rationale: Direktang transliterasyon ng anyong Hebreo sa talatang ito; inilagay sa talababa ang tradisyonal na alternatibong “Abiasaf.”
- source_word: אַסִּיר
  choice: Asir
  rationale: Pangngalang pantangi; direktang transliterasyon mula sa Hebreo gamit ang likas na baybay sa Filipino.
