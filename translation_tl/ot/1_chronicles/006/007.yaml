translation:
  language: tl
  text: 'Ang mga anak ni Kohat: si Aminadab, ang kanyang anak[a]; si Korah, ang kanyang anak; at si Asir, ang kanyang anak.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Inihahambing ng ilan ang magkakatulad na talaangkanan, kung saan Izhar ang pangalan ng katumbas na ninuno; ngunit Aminadab ang mababasa sa tekstong Hebreo rito.
    reason: textual_variant
lexical_decisions:
- source_word: בְּנֵי
  choice: Ang mga anak ni
  rationale: Pinananatili ang pangmaramihang anyong construct na nagpapakilala sa talaangkanan. Bagaman maaaring may nilalaktawang salinlahi ang mga talaangkanan, ang paulit-ulit na בְּנוֹ ay pumapabor sa tuwirang 'anak' kaysa sa mas malawak na 'mga inapo.'
- source_word: קְהָת
  choice: Kohat
  rationale: Karaniwang anyong Filipino ng pangalang Hebreo.
- source_word: עַמִּינָדָב
  choice: Aminadab
  rationale: Isinasalin sa baybay na natural sa Filipino habang tapat sa pangalang nasa tekstong Hebreo. Hindi ito pinalitan ng Izhar sa pangunahing teksto.
- source_word: בְּנוֹ
  choice: na kanyang anak
  rationale: Tuwirang pinananatili ang ugnayang filial at ang paulit-ulit na hulma ng talaangkanan; mas natural sa Filipino ang 'na kanyang anak' sa seryeng ito.
- source_word: קֹרַח
  choice: Korah
  rationale: Karaniwang anyong Filipino ng pangalang Hebreo.
- source_word: בְּנוֹ
  choice: na kanyang anak
  rationale: Pare-parehong salin upang mapanatili ang sunod-sunod na estruktura ng Hebreo.
- source_word: אַסִּיר
  choice: Asir
  rationale: Itinuturing itong pangalang pantangi at hindi isinasalin ayon sa posibleng karaniwang kahulugan ng salita.
- source_word: בְּנוֹ
  choice: na kanyang anak
  rationale: Pinananatili ang huling pag-uulit ng pormulang pang-talaangkanan sa Hebreo.
