  rationale: Tumutukoy ang pangngalang בֵּן na may panlaping ikatlong panauhang panlalaki sa tuwirang salinlahi; pinananatili ng “anak niya” ang paulit-ulit na pormulang pangtalaangkanan.
- source_word: חַגִּיָּה
