  terminology: Ang “Levita,” “itinalaga,” “paglilingkod,” “tabernakulo,” at “bahay ng Diyos” ay angkop sa makabagong Filipino Tagalog at sa kultikong konteksto. Maayos ding itinatala ng talababa ang literal na alternatibong “ibinigay” nang hindi itinatanggi ang idiomatikong diwa ng pagkakaatas.
