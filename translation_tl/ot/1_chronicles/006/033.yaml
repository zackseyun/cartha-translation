  source_fidelity: 'Tumpak na naipapahayag ng salin ang lahat ng pangunahing sangkap ng Hebreo: ang mga kapatid/kapanig na Levita, ang pagkakatalagang ipinahihiwatig ng נְתוּנִים, ang buong saklaw ng paglilingkod, at kapuwa ang “tabernakulo” at “bahay ng Diyos.” Hindi pinagsasama o pinapalitan ang dalawang huling katawagan.'
