  text: וַ/אֲחֵי/הֶ֖ם הַ/לְוִיִּ֑ם נְתוּנִ֕ים לְ/כָ֨ל עֲבוֹדַ֔ת מִשְׁכַּ֖ן בֵּ֥ית הָ/אֱלֹהִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/033.yaml
  text: And their brothers the Levites were appointed for all the service of the tabernacle of the house of God[a].
translation:
  language: tl
  text: At ang mga kapatid nilang Levita ay itinalaga[a] sa lahat ng paglilingkod sa tabernakulo ng bahay ng Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ibinigay”; literal na “ibinigay” ang Hebreo, dito sa diwang iniatas o itinalaga sa isang tungkulin.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲחֵיהֶם
  choice: At ang mga kapatid nila
  rationale: Pinananatili ng “At” ang pang-ugnay na waw sa konteksto ng talaan, at tuwirang isinasalin ng “mga kapatid nila” ang katawagang pampamilya, na maaari ring tumukoy sa mga kamag-anak o kapangkat.
- source_word: הַלְוִיִּם
  choice: mga Levita
  rationale: Ito ang karaniwan at tiyak na tawag sa mga kabilang sa lipi ni Levi; inilagay kasunod ng “mga kapatid nila” bilang paglilinaw sa kanilang pagkakakilanlan.
- source_word: נְתוּנִים
  choice: ay itinalaga
  rationale: Ang anyo ay literal na “ibinigay,” ngunit sa kontekstong tungkulin at paglilingkod, ipinahihiwatig nito ang pagkakatalaga o pagkakaatas. Inilalahad sa talababa ang literal na alternatibo.
- source_word: לְכָל
  choice: sa lahat ng
  rationale: Ipinahihiwatig ng parirala ang buong saklaw ng paglilingkod na iniatas sa kanila.
- source_word: עֲבוֹדַת
  choice: paglilingkod
  rationale: Sa kontekstong pangsamba, tumutukoy ito sa gawaing isinasagawa sa banal na lugar. Ang “paglilingkod” ay likas sa Filipino at hindi nag-aangkat ng mas huling terminolohiyang pansimbahan.
- source_word: מִשְׁכַּן
  choice: tabernakulo
  rationale: Ito ang kinikilalang katawagan sa banal na tolda o tahanang-dako ng Diyos at pinananatili ang natatanging terminong nasa Hebreo.
- source_word: בֵּית הָאֱלֹהִים
  choice: bahay ng Diyos
  rationale: Tuwirang pinananatili ang Hebreong “bahay ng Diyos” sa halip na palitan ito ng “templo,” upang hindi paliitin o baguhin ang saklaw ng pahayag.
theological_decisions:
- issue: Ugnayan ng “tabernakulo” at “bahay ng Diyos” sa pananalita ng Mga Cronica
  choice: tabernakulo ng bahay ng Diyos
  alternative: bahay ng Diyos; templong tolda ng Diyos
  rationale: Kapuwa tahasang nasa Hebreo ang מִשְׁכַּן at בֵּית הָאֱלֹהִים. Ang pagpapanatili sa dalawang katawagan ay gumagalang sa kakaibang pagkakaugnay at tensiyon ng mga ito sa teksto sa halip na pagsamahin ang mga ito sa “templo” lamang.
translation_notes:
  register: Makabagong Filipino na malinaw at marangal ang ginamit. Pinanatili ang “tabernakulo” at “bahay ng Diyos” bilang magkahiwalay na katawagan mula sa Hebreo, kahit bahagyang di-karaniwan ang pagsasama ng mga ito, upang hindi mawala ang tekstuwal na tensiyon.
