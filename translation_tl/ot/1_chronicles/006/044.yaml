translation_notes:
  register: Gumamit ng natural, makabago, at marangal na Filipino. Pinanatili ang anyong patuloy na talaan sa pamamagitan ng paunang “ang,” sapagkat bahagi ang talata ng mas mahabang pangungusap. Ginamit ang mga transliterasyong Filipino na “Ashan” at “Bet-semes.”
