  text: Ashan with its pasturelands[a], and Beth-shemesh with its pasturelands.
translation:
  language: tl
  text: ang Ashan, kasama ang mga pastulan nito,[a] at ang Bet-semes, kasama ang mga pastulan nito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ain” ang nakatala rito sa ilang magkakatulad na talaan at salin; “Ashan” naman ang mababasa sa Masoretic Text ng Mga Cronica.
    reason: textual_variant
lexical_decisions:
- source_word: עָשָׁן
  choice: Ashan
  rationale: Pangalan ng lugar; tinumbasan sa transliterasyong malapit sa anyong Hebreo. Sinusunod ng pangunahing teksto ang Masoretic Text ng Mga Cronica.
- source_word: מִגְרָשֶׁיהָ
  choice: mga pastulan nito
  rationale: Tumutukoy sa mga bukas na lupaing nakalaan sa isang bayan, lalo na sa konteksto ng mga bayan ng mga Levita. Natural at malinaw sa modernong Filipino ang “mga pastulan nito.”
- source_word: בֵּית שֶׁמֶשׁ
  choice: Bet-semes
  rationale: Pangalan ng lugar na isinalin sa transliterasyong Filipino batay sa bigkas ng Hebreo, sa halip na isalin ang literal na kahulugang “Bahay ng Araw.”
- source_word: וְאֶת
  choice: at
  rationale: Hindi tahasang tinutumbasan sa Filipino ang pananda ng tuwirang layon na אֶת, ngunit pinananatili ang pangatnig na וְ bilang “at” upang ipakita ang ayos ng talaan.
