  yaml_path: translation/ot/1_chronicles/006/004.yaml
  text: 'The sons of Merari: Mahli and Mushi[b][a]. These were the clans of the Levites according to their fathers’ houses.'
translation:
  language: tl
  text: Ang mga anak na lalaki ni Merari ay sina Mahli at Musi. Ito ang mga angkan[a] ng mga Levita, ayon sa kani-kanilang angkan sa panig ng ama[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga pamilya.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, literal na “ayon sa kanilang mga ama”; sa kontekstong ito, tumutukoy ito sa pag-uuri ayon sa angkan o linya sa panig ng ama.
    reason: cultural_note
lexical_decisions:
- source_word: בְּנֵי
  choice: mga anak na lalaki ni
  rationale: Sa talaangkanan, tumutukoy ang construct plural ng בֵּן sa mga lalaking anak. Nililinaw ng “anak na lalaki” ang kasarian na taglay ng salitang Hebreo, samantalang natural pa rin ito sa makabagong Filipino.
- source_word: מְרָרִי
  choice: Merari
  rationale: Pangalan ng tao; pinanatili sa karaniwang anyong transliterado.
- source_word: מַחְלִי
  choice: Mahli
  rationale: Pangalan ng tao; ang “Mahli” ay malapit sa anyong Hebreo at nakikilala sa tradisyong biblikal sa Filipino.
- source_word: וּמֻשִׁי
  choice: at Musi
  rationale: Isinalin ang pangatnig bilang “at” at ginamit ang natural na baybay-Filipino na “Musi” para sa pangalang Hebreo na מֻשִׁי.
- source_word: וְאֵלֶּה
  choice: Ito ang mga
  rationale: Ang demonstratibong maramihan ay nagpapakilala sa pangkalahatang buod. Sa Filipino, natural na gamitin ang “Ito ang mga” bago ang pangngalang maramihan; hindi na kailangang isalin nang hiwalay ang panimulang וְ.
- source_word: מִשְׁפְּחוֹת
  choice: mga angkan
  rationale: Sa kontekstong pantribo at talaangkanan, tumutukoy ito sa mga pangkat ng magkakamag-anak na mas malawak kaysa sa nukleyar na pamilya. Pinananatili sa talababa ang “mga pamilya” bilang posibleng alternatibo.
- source_word: הַלֵּוִי
  choice: ng mga Levita
  rationale: Bagaman nasa anyong isahan ang gentiliko sa Hebreo, kolektibo ang diwa nito rito at inilalarawan ang mga angkang kabilang sa lipi ni Levi. Ang maramihang “mga Levita” ang natural at malinaw sa Filipino.
- source_word: לַאֲבוֹתֵיהֶם
  choice: ayon sa mga sambahayan ng kanilang mga ninuno
  rationale: Literal itong “ayon sa kanilang mga ama,” ngunit sa kontekstong talaangkanan ay tumutukoy sa pag-uuri batay sa mga sambahayan o linya sa panig ng ama. Ginawang malinaw ang ipinahihiwatig na sambahayan nang hindi binabago ang batayang patrilinyal na diwa.
