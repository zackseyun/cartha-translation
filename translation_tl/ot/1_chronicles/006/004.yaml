translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “sina” sa pagbanggit sa dalawang pangalan at ang “mga Levita” para sa natural na kolektibong diwa. Inilagay ang bawat tanda ng talababa kaagad pagkatapos ng salitang o pariralang tinatalakay nito.
