  text: the son of Elkanah[a], the son of Joel, the son of Azariah, the son of Zephaniah.
translation:
  language: tl
  text: na anak ni Elcana[a], na anak ni Joel, na anak ni Azarias, na anak ni Zefanias.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O maaaring “inapo ni” sa bawat paglitaw ng “anak ni,” sapagkat kung minsan ay may nilalaktawang mga salinlahi sa mga talaangkanang Hebreo; gayunman, mas sinusuportahan dito ng magkakasunod na tala ang “anak ni.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן
  choice: anak ni
  rationale: Sa talaangkanan, ang בֶּן ay karaniwang tumutukoy sa ugnayang ama at anak. Pinananatili ng paulit-ulit na “anak ni” ang anyo at ritmo ng Hebreo, habang likas itong basahin sa modernong Tagalog. Posible rin ang “inapo ni” kapag nilalaktawan ng talaangkanan ang ilang salinlahi, ngunit mas sinusuportahan dito ng sunod-sunod na tala ang tiyak na “anak ni.”
- source_word: אֶלְקָנָה
  choice: Elcana
  rationale: Ginamit ang nakasanayang anyong Tagalog ng pangalang Hebreo.
- source_word: יוֹאֵל
  choice: Joel
  rationale: Ginamit ang pamilyar at nakasanayang anyo ng pangalan sa Tagalog.
- source_word: עֲזַרְיָה
  choice: Azarias
  rationale: Ginamit ang nakasanayang anyong Tagalog ng pangalan.
- source_word: צְפַנְיָה
  choice: Zefanias
  rationale: Ginamit ang nakasanayang anyong Tagalog ng pangalan, na malinaw at madaling makilala ng karaniwang mambabasa.
