  text: And the sons of Israel gave to the Levites the cities and their pasturelands[a][b].
translation:
  language: tl
  text: Ibinigay ng mga anak ni Israel[a] sa mga Levita ang mga lungsod at ang mga pastulan ng mga ito[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “mga Israelita.” Literal sa Hebreo: “mga anak ni Israel.”'
    reason: lexical_alternative
  - marker: b
    text: O “mga lupang panlahat ng mga ito” o “mga lupain sa paligid ng mga ito.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ
  choice: Ibinigay
  rationale: Ang Qal wayyiqtol ng נתן ay karaniwang nangangahulugang “nagbigay.” Ang “ibinigay” ang natural na anyong pandiwa sa salaysay at malinaw na ipinapakita ang bagay na ipinagkaloob.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Literal itong “mga anak ni Israel.” Pinananatili sa pangunahing teksto ang pormal at tradisyonal na katawagan, habang inilalagay sa talababa ang mas idyomatikong “mga Israelita.”
- source_word: לַלְוִיִּם
  choice: sa mga Levita
  rationale: Tuwirang katumbas ito ng pang-ukol na לְ at ng katawagang panlipi na לְוִיִּם. “Mga Levita” ang malinaw at nakaugaliang katawagan sa Filipino.
- source_word: הֶעָרִים
  choice: mga lungsod
  rationale: Ang עָרִים ay maaaring tumukoy sa mga lungsod o bayan. Pinili ang “mga lungsod” upang mapanatili ang terminolohiyang ginagamit para sa mga lungsod ng mga Levita sa konteksto.
- source_word: מִגְרְשֵׁיהֶם
  choice: mga pastulan ng mga iyon
  rationale: Ang מִגְרָשׁ ay bukás na lupain sa paligid ng isang lungsod, lalo na yaong ginagamit na pastulan. Ang hulaping pambabaeng maramihan ay tumutukoy sa mga lungsod, kaya nilinaw ng “ng mga iyon” na ang mga pastulan ay kaugnay ng mga lungsod, nang hindi inaalis ang iba pang posibleng lawak ng kahulugan.
