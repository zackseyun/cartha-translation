translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang literal na “mga anak ni Israel” at ang karaniwang katawagang “mga Levita,” habang ginamit ang “mga pastulan” bilang madaling maunawaang paglalarawan sa bukás na lupaing kalakip ng mga lungsod.
