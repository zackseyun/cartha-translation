  text: son of Ethan[a], son of Zimmah, son of Shimei.
translation:
  language: tl
  text: anak ni Etan[a], anak ni Zima, anak ni Simei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kung minsan, may mga salinlahing nilalaktawan sa mga talaangkanang Hebreo; kaya sa ilang konteksto, ang “anak ni” ay maaaring mangahulugang “inapo ni.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן
  choice: anak ni
  rationale: Sa talaangkanan, ang בֶּן ay likas na isinasaling “anak ni.” Maaari itong tumukoy nang mas malawak sa isang inapo kapag may nilalaktawang salinlahi, ngunit pinananatili rito ang karaniwang anyo ng tekstong Hebreo.
- source_word: אֵיתָן
  choice: Etan
  rationale: Pangalang pantangi na isinatinig sa paraang natural sa modernong Filipino, kung saan hindi karaniwang binibigkas ang titik h sa gitna ng pangalang Ethan.
- source_word: זִמָּה
  choice: Zima
  rationale: Pangalang pantangi na isinatinig mula sa Hebreo; hindi isinalin ang maaaring kahulugan ng kaugnay na salitang-ugat sapagkat pangalan ang gamit dito.
- source_word: שִׁמְעִי
  choice: Simei
  rationale: Pangalang pantangi na isinatinig sa kinikilalang anyong Filipino, na sapat na kumakatawan sa Hebreong Shim‘i.
