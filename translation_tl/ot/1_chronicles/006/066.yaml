  text: and Heshbon with its pasturelands[a], and Jazer with its pasturelands.
translation:
  language: tl
  text: at ang Hesbon kasama ang mga pastulan nito,[a] at ang Jazer kasama ang mga pastulan nito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga lupang panlahat” o “mga bukas na lupain sa paligid.” Ang salitang Hebreo ay tumutukoy sa bukas na lupaing pag-aari o nakatalaga sa isang lunsod.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶשְׁבּוֹן
  choice: Hesbon
  rationale: Pangalan ng lugar; tinumbasan sa karaniwang anyong ginagamit sa modernong saling Tagalog habang nananatiling malapit sa pangalang Hebreo.
- source_word: מִגְרָשֶׁיהָ
  choice: mga pastulan nito
  rationale: Sa konteksto ng mga lunsod ng mga Levita, tumutukoy ito sa bukas na lupaing nakatalaga sa isang lunsod, karaniwang ginagamit bilang pastulan. Ipinahihiwatig ng “nito” ang hulaping pambabae na tumutukoy sa bawat lunsod.
- source_word: יַעְזֵיר
  choice: Jazer
  rationale: Pangalan ng lugar; transliterasyon na angkop at madaling makilala sa Tagalog.
- source_word: וְאֶת
  choice: at ang
  rationale: Hindi tuwirang isinasalin ang panandang pantiyak sa layon na אֶת, ngunit ipinananatili ng “at” ang paulit-ulit na kayarian ng talaan; likas sa Tagalog ang “ang” bago ang mga pangalan sa ganitong parirala.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na payak ngunit marangal. Pinanatili ang anyong talaan at ang ugnayan ng bawat lunsod sa mga lupaing nakapaligid dito.
