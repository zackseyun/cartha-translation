  text: וְ/אֵ֖לֶּה בְּנֵ֣י אַהֲרֹ֑ן אֶלְעָזָ֥ר בְּנ֛/וֹ פִּֽינְחָ֥ס בְּנ֖/וֹ אֲבִישׁ֥וּעַ בְּנֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/035.yaml
  text: 'And these were the sons of Aaron: Eleazar his son, Phinehas his son, Abishua his son.'
translation:
  language: tl
  text: 'At ito ang mga anak ni Aaron: si Eleazar na kanyang anak, si Finehas na anak ni Eleazar, at si Abisua na anak ni Finehas.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: At ito ang
  rationale: Ipinakikilala ng pang-ugnay at panghalip pamatlig ang talaangkanan. Likas sa modernong Tagalog ang “At ito ang” at hindi kailangang lagyan ng pandiwang panahunan na wala naman sa pariralang Hebreo.
- source_word: בְּנֵי
  choice: mga anak ni
  rationale: Bagaman maaaring tumukoy ang בנים sa mas malawak na mga inapo, tuwirang paghalili ng ama at anak ang nakatala rito, kaya pinanatili ang “mga anak ni.”
- source_word: אַהֲרֹן
  choice: Aaron
  rationale: Ginamit ang nakaugaliang anyo ng pangalang biblikal sa Filipino.
- source_word: אֶלְעָזָר
  choice: Eleazar
  rationale: Ginamit ang nakaugaliang transliterasyon sa mga Bibliyang Filipino.
- source_word: בְּנוֹ
  choice: na anak niya / na anak nito
  rationale: Tuwirang ugnayang ama-anak ang ipinahihiwatig ng pangngalang may hulaping panghalip. Ang “nito” sa mga sumunod na pangalan ay malinaw na tumutukoy sa pinakamalapit na naunang pangalan at umiiwas sa malabong sunod-sunod na “anak niya.”
- source_word: פִּינְחָס
  choice: Finehas
  rationale: Ito ang nakaugaliang anyo ng pangalang biblikal sa Filipino at sapat na kumakatawan sa pangalang Hebreo.
- source_word: אֲבִישׁוּעַ
  choice: Abisua
  rationale: Ito ang natural at nakaugaliang anyo ng pangalan sa Filipino, na hinango sa Hebreong pangalan.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na may marangal at payak na estilong pang-talaangkanan. Gumamit ng “si” bago sa mga personal na pangalan at “nito” upang luminaw ang sunod-sunod na direktang pagmamana nang hindi nagdaragdag ng interpretasyong teolohikal.
