  text: son of Izhar[a], son of Kohath, son of Levi, son of Israel.
translation:
  language: tl
  text: anak ni Izhar, anak ni Kohat, anak ni Levi, anak ni Israel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Si Israel ay si Jacob, na binigyan ng pangalang ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן
  choice: anak ni
  rationale: Sa paulit-ulit na pormulang talaangkanan, ang בֶּן ay tuwirang nangangahulugang “anak ni.” Bagaman maaari itong tumukoy kung minsan sa isang inapo, walang dahilan sa talatang ito upang alisin ang tuwirang anyo.
- source_word: יִצְהָר
  choice: Izhar
  rationale: Isinalin sa baybay na karaniwang ginagamit sa makabagong Filipino para sa pangalang Hebreo.
- source_word: קְהָת
  choice: Kohat
  rationale: Ang pangalang Hebreo ay tinumbasan ayon sa nakagawiang baybay sa Filipino.
- source_word: לֵוִי
  choice: Levi
  rationale: Pinanatili ang kinikilalang anyo ng pangalang pantangi sa Filipino.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: “Israel” ang mismong pangalang nasa tekstong Hebreo; hindi ito pinalitan ng “Jacob,” kahit iisang tao ang tinutukoy.
theological_decisions:
- issue: Pagkakakilanlan ni Israel sa talaangkanan
  choice: Pinanatili sa pangunahing teksto ang “Israel.”
  alternative: Jacob
  rationale: Gumagamit ang Hebreo ng יִשְׂרָאֵל, kaya pinananatili ang pangalang iyon upang hindi mapalitan ng isang interpretatibong pagkakakilanlan ang mismong salita ng teksto. Ipinaliliwanag sa talababa na ito ang pangalang ibinigay kay Jacob.
translation_notes:
  register: Maikli at marangal na pormulang talaangkanan sa natural na modernong Filipino. Inulit ang “anak ni” upang mapanatili ang estruktura at diin ng Hebreo. Inilagay ang talababa pagkatapos ng “Israel,” ang salitang talagang nililinaw nito.
