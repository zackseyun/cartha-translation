  register: Maikli at dignified na anyo ng talaangkanan. Pinanatili ang bawat pag-ulit ng “anak niya” ayon sa Hebreo, sa halip na paikliin ang hanay. Idinagdag ang mga pantukoy na “si” at ang pang-ugnay na “at” upang maging natural ang daloy sa modernong Filipino nang hindi binabago ang ugnayang genealogical.
