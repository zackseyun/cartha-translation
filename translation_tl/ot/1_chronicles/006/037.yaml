lexical_decisions:
- source_word: מְרָיוֹת
  choice: Merayot
  rationale: Pangalan ng tao; isinalin sa baybay na natural sa makabagong Filipino habang malapit sa tunog ng Hebreo.
- source_word: בְּנוֹ
  choice: anak niya
  rationale: Ang בֵּן na may hulaping ikatlong panauhang panlalaki ay tumutukoy sa anak na lalaki sa talaangkanan. Natural sa Filipino ang “anak niya,” at malinaw na ang mga pangalang nakalista ay panlalaki.
- source_word: אֲמַרְיָה
  choice: Amarias
  rationale: Pangalan ng tao; ginamit ang anyong pamilyar at natural sa tradisyong biblikal na Filipino.
- source_word: אֲחִיטוּב
  choice: Ahitub
  rationale: Pangalan ng tao; tuwirang transliterasyon na madaling basahin sa Filipino.
