base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/047.yaml
  text: 'And to the sons of Gershom[a], according to their clans, from the tribe of Issachar, and from the tribe of Asher, and from the tribe of Naphtali[b], and from the tribe of Manasseh in Bashan: thirteen cities.'
translation:
  language: tl
  text: 'At sa mga anak ni Gersom[a], ayon sa kani-kanilang angkan, mula sa lipi ni Isacar, mula sa lipi ni Aser, mula sa lipi ni Neftali, at mula sa lipi ni Manases sa Basan[b]: labintatlong lungsod.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gersom ang baybay ng pangalan ng angkan sa Hebreo rito; sa ibang talata at salin, Gershon ang makikita.
    reason: alternative_reading
  - marker: b
    text: Pinalalawak ito ng ilang salin bilang “kalahating lipi ni Manases sa Basan” upang linawin ang heograpikong tinutukoy, ngunit hindi nakasulat sa Hebreo ng talatang ito ang “kalahating lipi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלִבְנֵי גֵרְשׁוֹם
  choice: At sa mga anak ni Gersom
  rationale: Pinananatili ang pormulang pangangkan na “mga anak ni” at ang anyong Gersom na nasa Hebreo ng talatang ito.
- source_word: לְמִשְׁפְּחוֹתָם
  choice: ayon sa kani-kanilang angkan
  rationale: Sa konteksto ng paghahati ayon sa tribo, ang מִשְׁפָּחָה ay tumutukoy sa mga angkan; nililinaw ng “kani-kanilang” ang distributibong diwa ng hulaping maramihan.
- source_word: מִמַּטֵּה
  choice: mula sa lipi ni
  rationale: Ang מַטֶּה rito ay tribo ng Israel. Ang “lipi” ang natural at karaniwang salin sa modernong Tagalog para sa kontekstong ito.
- source_word: מְנַשֶּׁה בַּבָּשָׁן
  choice: Manases sa Basan
  rationale: Mahigpit na sinusunod ang Hebreo, na hindi tahasang nagsasabing “kalahating lipi,” habang pinananatili ang heograpikong pagtukoy sa Basan.
- source_word: עָרִים שְׁלֹשׁ עֶשְׂרֵה
  choice: labintatlong lungsod
  rationale: Tuwirang salin ng bilang at pangngalan; ang “lungsod” ay dignified at madaling maunawaan.
