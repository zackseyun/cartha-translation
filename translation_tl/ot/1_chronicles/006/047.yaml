  - severity: low
    issue: Hindi eksakto ang alternatibong baybay sa talababa a.
    rationale: Ang tala ay dapat magbanggit ng “Gershon,” ang karaniwang alternatibong transliterasyon na kaugnay ng anyong Gersom/Gershom, sa halip na “Gersón.”
