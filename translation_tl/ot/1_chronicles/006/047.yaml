  source_fidelity: 'Tumpak ang pangunahing nilalaman: ang mga anak ni Gersom, ang mga angkan, apat na lipi, ang Basan, at labintatlong lungsod. Gayunman, ang paulit-ulit na מִן (‘mula sa’) sa Hebreo ay mas malinaw at mas malapit na maipapahayag sa pag-uulit ng “mula sa” sa bawat lipi.'
  naturalness: Natural ang register at pangunahing estruktura. Ang pag-uulit ng “mula sa” ay mas maayos sa modernong Filipino kaysa sa sunod-sunod na “sa lipi,” na maaaring magpalabo sa saklaw ng pinagmulan ng mga lungsod.
  terminology: Ang “angkan” para sa מִשְׁפָּחוֹת at “lipi” para sa מַטֶּה ay angkop at malinaw na magkaiba. Ang “Gersom” ay wastong kumakatawan sa baybay na גֵרְשׁוֹם sa talatang ito. Dapat itama ng talababa ang alternatibong anyo sa “Gershon,” hindi “Gersón,” upang tumugma sa usaping baybay na tinutukoy ng audit trail.
