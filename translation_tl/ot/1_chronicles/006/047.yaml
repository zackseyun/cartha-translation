translation_notes:
  register: 'Modernong Filipino Tagalog na may dignified na himig. Ginamit ang tradisyonal ngunit kasalukuyan pa ring makikilalang mga anyong Tagalog ng pangalang pantangi: Gersom, Isacar, Aser, Neftali, Manases, at Basan. Ang ayos ng pangungusap ay bahagyang inayos upang maging natural habang nananatiling malapit sa pormula ng paglalaan sa Hebreo.'
