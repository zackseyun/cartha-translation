  text: son of Jahath[a], son of Gershom[b], son of Levi.
translation:
  language: tl
  text: anak ni Jahat[a], anak ni Gersom[b], anak ni Levi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, sa mas malawak na gamit sa talaangkanan, “inapo ni Jahat … inapo ni Gersom … inapo ni Levi.”
    reason: lexical_alternative
  - marker: b
    text: “Gersom” ang mababasa sa Hebreo. Maaaring asahan ng ilan ang “Gerson” batay sa ibang mga talaangkanan, ngunit iba ang anyo ng pangalan sa pinagmulang teksto rito.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן
  choice: anak ni
  rationale: Sa talaangkanan, ang בֶּן ay pinakanatural na tumutukoy sa anak na lalaki. Gayunman, maaari itong gamitin nang mas malawak kapag may nilalaktawang mga salinlahi; kaya pinanatili ang tuwirang kahulugan sa teksto at inilagay sa talababa ang mas malawak na posibilidad.
- source_word: יַחַת
  choice: Jahat
  rationale: Isinatinig ang pangalang Hebreo sa paraang natural at nakikilala sa makabagong Tagalog, na ginagamit ang J para sa unang katinig at t para sa panghuling ת.
- source_word: גֵּרְשֹׁם
  choice: Gersom
  rationale: Tapat itong kumakatawan sa anyong גֵּרְשֹׁם sa talata at hindi ito ginawang 'Gerson,' na tumutugma sa ibang anyo ng pangalan.
- source_word: לֵוִי
  choice: Levi
  rationale: Ginamit ang karaniwan at kinikilalang anyo ng pangalang ito sa Tagalog.
