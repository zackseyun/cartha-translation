base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/048.yaml
  text: To the sons of Merari, according to their clans, from the tribe of Reuben, from the tribe of Gad, and from the tribe of Zebulun, twelve cities by lot.
translation:
  language: tl
  text: Sa mga anak ni Merari, ayon sa kanilang mga angkan, ay ibinigay sa pamamagitan ng palabunutan ang labindalawang lungsod mula sa lipi ni Ruben, mula sa lipi ni Gad, at mula sa lipi ni Zebulun.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִבְנֵי מְרָרִי
  choice: sa mga anak ni Merari
  rationale: Ang לְ ay tumutukoy sa tumanggap ng bahagi, at pinananatili ng “mga anak ni Merari” ang pormang pangangkan ng Hebreo habang likas pa rin sa Tagalog.
- source_word: לְמִשְׁפְּחוֹתָם
  choice: ayon sa kanilang mga angkan
  rationale: Sa konteksto ng paghahati ng lupain, ang מִשְׁפָּחָה ay tumutukoy sa mga sangay o angkan sa loob ng lipi, hindi lamang sa sambahayan.
- source_word: מִמַּטֵּה
  choice: mula sa lipi ni
  rationale: Ang מַטֶּה sa kontekstong ito ay “lipi”; ang paulit-ulit na parirala ay nagpapakita kung sa aling mga lipi nagmula ang mga lungsod.
- source_word: רְאוּבֵן / גָד / זְבוּלֻן
  choice: Ruben / Gad / Zebulun
  rationale: Ginamit ang mga pangalang karaniwan at madaling makilala sa modernong saling Tagalog.
- source_word: בַּגּוֹרָל
  choice: sa pamamagitan ng palabunutan
  rationale: Ipinahahayag nito ang paraang ginamit sa pagtatalaga; malinaw at natural sa Tagalog ang “sa pamamagitan ng palabunutan.”
- source_word: עָרִים שְׁתֵּים עֶשְׂרֵה
  choice: ang labindalawang lungsod
  rationale: Ang עִיר ay karaniwang “lungsod” sa mga talaan ng paghahati, at ang bilang ay isinaayos ayon sa natural na sintaks ng Tagalog.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Idinagdag ang pandiwang “ay ibinigay” bilang kinakailangang sintaktikong pagpuno sa Tagalog; eliptikal ang Hebreo at ipinagpapatuloy nito ang diwa ng naunang konteksto. Pinanatili ang tatlong pag-uulit ng “sa lipi ni” upang maipakita ang estruktura ng pinagmulan ng mga lungsod.
