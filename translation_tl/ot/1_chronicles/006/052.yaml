  yaml_path: translation/ot/1_chronicles/006/052.yaml
  text: 'They gave them the cities of refuge: Shechem with its pasturelands in the hill country of Ephraim[a], and Gezer with its pasturelands.'
translation:
  language: tl
  text: 'Ibinigay nila sa kanila ang mga lunsod na kanlungan: Shekem kasama ang mga pastulan nito sa kaburulan ng Efraim,[a] at Gezer kasama ang mga pastulan nito.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O, mas literal: “ang mga lunsod na kanlungan: ang Shekem at ang mga pastulan nito sa kaburulan ng Efraim, at ang Gezer at ang mga pastulan nito.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ
  choice: Ibinigay nila
  rationale: Ang wayyiqtol ng נתן ay nagsasaad ng kasunod na kilos sa salaysay; natural sa Tagalog na hindi na tahasang isalin ang panimulang waw.
- source_word: לָהֶם
  choice: sa kanila
  rationale: Tumutukoy ito sa mga tatanggap na binanggit sa mas malawak na konteksto.
- source_word: עָרֵי הַמִּקְלָט
  choice: mga lunsod na kanlungan
  rationale: Malinaw at likas na salin ng teknikal na katawagan para sa mga lunsod na itinakdang matakbuhan ng nanganganib.
- source_word: שְׁכֶם
  choice: Shekem
  rationale: Isinalin sa karaniwang anyong transliterado sa modernong Filipino.
- source_word: מִגְרָשֶׁיהָ
  choice: mga pastulan nito
  rationale: Tumutukoy sa mga bukas na lupaing nakapaligid at nakatalaga sa lunsod, lalo na para sa pagpapastol; mas tiyak ito kaysa sa pangkalahatang 'mga lupain.'
- source_word: בְּהַר אֶפְרָיִם
  choice: sa kaburulan ng Efraim
  rationale: Ang parirala ay tumutukoy sa bulubundukin o mataas na rehiyon ng Efraim, hindi sa iisang bundok.
- source_word: גֶּזֶר
  choice: Gezer
  rationale: Pinanatili ang pangalan ng lugar sa transliteradong anyo.
- source_word: וְאֶת ... וְאֶת
  choice: at ang ... at ang
  rationale: Pinananatili ang magkahanay na ayos ng dalawang lunsod at ng kani-kanilang pastulan sa malinaw na sintaks ng Tagalog.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “lunsod” para sa dignidad ng rehistro, “kanlungan” para sa teknikal na konsepto ng asylum, at “kaburulan” upang ipakitang rehiyon ang tinutukoy. Ang tandang talababa [a] ay inilagay sa pangunahing teksto.
