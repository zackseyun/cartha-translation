- source_word: בֶּן
  choice: anak ni
  rationale: Sa talaangkanan, ang בֶּן ay karaniwang tumutukoy sa anak o sa isang inapo sa linya ng angkan. Ang “anak ni” ang likas at pormal na katumbas sa Tagalog, habang inilalahad sa talababa ang posibilidad ng pinaikling salinlahi.
- source_word: אַמְצִי
  choice: Amzi
  rationale: Isinatinig ang pangalang Hebreo sa anyong madaling basahin at kaayon ng karaniwang anyo ng pangalan sa Bibliyang Tagalog.
- source_word: בָּנִי
  choice: Bani
  rationale: Tuwirang pagsasatinig sa modernong Tagalog ng personal na pangalang Hebreo.
- source_word: שָׁמֶר
  choice: Shemer
  rationale: Pinanatili ang kinikilalang anyong Shemer, na malinaw na kumakatawan sa mga katinig at patinig ng pangalang Hebreo.
