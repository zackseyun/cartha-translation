lexical_decisions:
- source_word: בֶּן
  choice: anak ni
  rationale: Sa anyong talaangkanan, tuwirang ipinahahayag ng בֶּן ang ugnayang anak at ama. Likas at malinaw sa modernong Tagalog ang paulit-ulit na “anak ni,” bagaman maaaring may nilalaktawang salinlahi ang ilang talaangkanan.
- source_word: תַּחַת
  choice: Tahat
  rationale: Pangalang pantangi; ang baybay ay malapit sa anyong Hebreo at madaling bigkasin sa Tagalog.
- source_word: אַסִּיר
  choice: Asir
  rationale: Pangalang pantangi; tuwirang transliterasyon na angkop sa baybay at bigkas ng Tagalog.
- source_word: אֶבְיָסָף
  choice: Ebiasaf
  rationale: Pangalang pantangi; malapit na transliterasyon ng anyong Hebreo. Ang “Abiasaf” ay isang alternatibong baybay ng pangalan.
- source_word: קֹרַח
  choice: Korah
  rationale: Pangalang pantangi; pinananatili ang karaniwang anyong “Korah,” na malinaw at pamilyar sa mga saling Tagalog.
