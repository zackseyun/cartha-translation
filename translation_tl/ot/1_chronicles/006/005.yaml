  yaml_path: translation/ot/1_chronicles/006/005.yaml
  text: 'To Gershom: Libni his son, Jahath his son, Zimmah his son.'
translation:
  language: tl
  text: 'Kay Gersom: ang anak niyang si Libni, ang anak nitong si Jahat, at ang anak nitong si Zima.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְגֵרְשׁוֹם
  choice: Kay Gersom
  rationale: Ang לְ ay nagpapakilala sa linyang genealogical ni Gersom. Likas sa Filipino ang “Kay Gersom” bilang maikling panimula sa talaan.
- source_word: לִבְנִי
  choice: Libni
  rationale: Pangalang pantangi; tinumbasan sa anyong transliterasyong madaling basahin sa Filipino.
- source_word: בְנוֹ
  choice: ang anak niyang / ang anak nitong
  rationale: Tumutukoy ito sa tuwirang ugnayang ama at anak. Ginamit ang nagbabagong panghalip upang malinaw na ang bawat pangalan ay anak ng pangalang kaagad na nauna rito.
- source_word: יַחַת
  choice: Jahat
  rationale: Pangalang pantangi; ang titik ח ay kinatawan ng “h” ayon sa karaniwang anyong biblikal na iniangkop sa baybay-Filipino.
- source_word: זִמָּה
  choice: Zima
  rationale: Pangalang pantangi sa kontekstong ito, kaya transliterado at hindi isinalin ayon sa posibleng kahulugan nito bilang karaniwang pangngalan.
