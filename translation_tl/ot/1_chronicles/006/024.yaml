  text: וְ/אָחִ֣י/ו אָסָ֔ף הָ/עֹמֵ֖ד עַל יְמִינ֑/וֹ אָסָ֥ף בֶּן בֶּרֶכְיָ֖הוּ בֶּן שִׁמְעָֽא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/024.yaml
  text: 'And his brother Asaph stood at his right hand: Asaph son of Berechiah[a], son of Shimea.'
translation:
  language: tl
  text: 'At ang kapatid niyang si Asaf ay nakatayo sa kanan niya: si Asaf na anak ni Berekias, na anak ni Shimea.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאָחִיו
  choice: At ang kapatid niya
  rationale: Ang וְ ay payak na pang-ugnay na “at,” at ang אָחִיו ay likas na nangangahulugang “kapatid niya.” Bagaman maaari ring tumukoy ang אָח sa kamag-anak o kasamahan sa ilang konteksto, walang sapat na dahilan dito upang talikuran ang payak na kahulugan.
- source_word: אָסָף
  choice: Asaf
  rationale: Pangngalang pantangi; isinalin sa anyong transliterasyong natural sa Filipino. Inulit ito gaya sa Hebreo bago ibigay ang angkan.
- source_word: הָעֹמֵד
  choice: nakatayo
  rationale: Ang Qal participle ng עמד ay naglalarawan sa pagiging nakapuwesto o nakatayo. Ang “nakatayo” ay natural sa Filipino at nananatiling malapit sa aspektong inilalarawan ng participle.
- source_word: עַל יְמִינוֹ
  choice: sa kanan niya
  rationale: Ang pariralang עַל + יָמִין ay tumutukoy sa posisyon sa kanang panig ng isang tao. Ang “sa kanan niya” ang malinaw at likas na katumbas sa modernong Filipino.
- source_word: בֶּן
  choice: anak ni
  rationale: 'Karaniwang pormulang pangangkan sa Filipino. Pinanatili ang dalawang sunod na salinlahi: “anak ni Berekias, na anak ni Shimea.”'
- source_word: בֶּרֶכְיָהוּ
  choice: Berekias
  rationale: Transliterasyong angkop sa nakaugaliang anyo ng mga pangalang biblikal sa Filipino.
- source_word: שִׁמְעָא
  choice: Shimea
  rationale: Malapit na transliterasyon ng pangalang Hebreo at malinaw na naiiba sa ibang kaugnay na pangalan.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang pag-uulit sa pangalang Asaf at ang estrukturang pangangkan ng Hebreo. Walang talababa dahil sapat na naipahahayag ng “sa kanan niya” ang kahulugang posisyonal ng parirala.
