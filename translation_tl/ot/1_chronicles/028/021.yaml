revisions:
- from: At tingnan mo[a], narito ang mga pangkat ng mga pari at ng mga Levita para sa lahat ng paglilingkod sa bahay ng Diyos. Sa bawat gawain ay kasama mo ang bawat lalaking kusang-loob at may kasanayan para sa bawat uri ng paglilingkod. Ang mga pinuno at ang buong bayan[b] ay handang sumunod sa lahat ng sasabihin mo.
  to: At narito[a], ang mga pangkat ng mga pari at mga Levita ay para sa lahat ng paglilingkod sa bahay ng Diyos; at sa bawat gawain ay kasama mo ang bawat lalaking kusang-loob na bihasa para sa bawat uri ng paglilingkod. Ang mga pinuno at ang buong bayan[b] ay handang tumupad sa lahat ng iyong mga tagubilin.
  rationale: Inalis ang dobleng pagsasalin ng וְהִנֵּה at inayos ang talababa nito upang huwag limitahan ang tinutukoy ng pantawag-pansin. Pinanatili ang organisadong mga pangkat, ang panlalaking anyo sa “bawat lalaking kusang-loob,” ang praktikal na diwa ng karunungan bilang pagiging bihasa, at ang idiomatikong diwa ng kahandaang kumilos ayon sa mga direktiba ni Solomon.
