  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/הִנֵּ֗ה מַחְלְקוֹת֙ הַ/כֹּהֲנִ֣ים וְ/הַ/לְוִיִּ֔ם לְ/כָל עֲבוֹדַ֖ת בֵּ֣ית הָ/אֱלֹהִ֑ים וְ/עִמְּ/ךָ֙ בְ/כָל מְלָאכָ֜ה לְ/כָל נָדִ֤יב בַּֽ/חָכְמָה֙ לְ/כָל עֲבוֹדָ֔ה וְ/הַ/שָּׂרִ֥ים וְ/כָל הָ/עָ֖ם לְ/כָל דְּבָרֶֽי/ךָ־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/021.yaml
  text: And behold[a], the divisions of the priests and the Levites are for all the service of the house of God, and with you in all the work will be every willing man skilled in wisdom for every kind of service; the officials also, and all the people[b], will be wholly at your command.
translation:
  language: tl
  text: At narito[a], ang mga pangkat ng mga pari at mga Levita ay para sa lahat ng paglilingkod sa bahay ng Diyos; at sa bawat gawain ay kasama mo ang bawat lalaking kusang-loob na bihasa para sa bawat uri ng paglilingkod. Ang mga pinuno at ang buong bayan[b] ay handang tumupad sa lahat ng iyong mga tagubilin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring, “At tingnan.” Ang Hebreo ay isang pantawag-pansing pahayag.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “para sa lahat ng iyong mga salita”; ibig sabihin, handang isagawa ang lahat ng iyong tagubilin o asikasuhin ang lahat ng iyong mga usapin.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: At tingnan mo, narito
  rationale: Pinananatili ang pantawag-pansing at deiktikong lakas ng הִנֵּה sa natural na makabagong Tagalog.
- source_word: מַחְלְקוֹת
  choice: mga pangkat
  rationale: Tumutukoy sa organisadong mga dibisyon o takdang pangkat ng mga pari at Levita; mas malinaw sa karaniwang mambabasa kaysa sa teknikal na 'mga hanay'.
- source_word: הַכֹּהֲנִים וְהַלְוִיִּם
  choice: mga pari at mga Levita
  rationale: Tuwirang pinananatili ang dalawang natatanging pangkat na naglilingkod sa bahay ng Diyos.
- source_word: לְכָל עֲבוֹדַת בֵּית הָאֱלֹהִים
  choice: para sa lahat ng paglilingkod sa bahay ng Diyos
  rationale: Pinananatili ang kongkretong pariralang 'bahay ng Diyos' at ang buong saklaw ng paglilingkod.
- source_word: וְעִמְּךָ
  choice: kasama mo
  rationale: Likas at tuwirang ipinahahayag ang pagsuporta at pakikipagtulungan kay Solomon.
- source_word: בְכָל מְלָאכָה
  choice: sa bawat gawain
  rationale: Sinasaklaw ang lahat ng praktikal na trabaho o tungkuling kaugnay ng proyekto.
- source_word: לְכָל נָדִיב בַּחָכְמָה
  choice: bawat lalaking kusang-loob at may kasanayan
  rationale: Pinananatili ang panlalaking anyo ng נָדִיב, ang kusang-loob na disposisyon, at ang praktikal na kasanayang ipinahihiwatig ng חָכְמָה.
- source_word: לְכָל עֲבוֹדָה
  choice: para sa bawat uri ng paglilingkod
  rationale: Ipinakikita ang malawak na kakayahan ng mga manggagawa sa sari-saring paglilingkod habang bahagyang iniiba sa naunang 'gawain' para sa מְלָאכָה.
- source_word: וְהַשָּׂרִים
  choice: ang mga pinuno
  rationale: Angkop sa mga namumuno o opisyal sa kontekstong maharlika at administratibo, nang hindi nagpapahiwatig ng namamanang pagkaprinsipe.
- source_word: וְכָל הָעָם
  choice: at ang buong bayan
  rationale: Tuwirang pinananatili ang kabuuan ng suportang mula sa bayan.
- source_word: לְכָל דְּבָרֶיךָ
  choice: handang sumunod sa lahat ng sasabihin mo
  rationale: 'Natural na inilalahad ang kontekstuwal na diwa ng literal na ''para sa lahat ng iyong mga salita'': kahandaang isagawa ang lahat ng tagubilin o usapin ni Solomon.'
theological_decisions:
- issue: Panlalaking pagtukoy sa נָדִיב
  choice: bawat lalaking kusang-loob
  alternative: bawat kusang-loob na tao / bawat boluntaryo
  rationale: Pinananatili ang panlalaking isahan ng Hebreo nang hindi ipinapalagay na may natatanging doktrinal na limitasyon lampas sa anyo ng teksto.
- issue: Paglalarawan sa בֵּית הָאֱלֹהִים
  choice: bahay ng Diyos
  alternative: templo
  rationale: Pinananatili ang kongkreto at panrelihiyong pananalita ng Hebreo; tama sa konteksto ang 'templo' ngunit mas interpretatibo.
- issue: Ugnayan ng kusang-loob at kasanayan sa לְכָל נָדִיב בַּחָכְמָה
  choice: bawat lalaking kusang-loob at may kasanayan
  alternative: bawat boluntaryong bihasa / bawat lalaking kusang-loob sa karunungan
  rationale: Inilalahad ang malamang na praktikal na diwa ng חָכְמָה ngunit pinananatili sa talababa ang literal at hindi ganap na tiyak na pagkakaugnay ng mga salita.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang 'mga pangkat' sa halip na mas teknikal o makalumang katawagan, at pinanatili ang 'bahay ng Diyos' bilang kongkretong larawan ng Hebreo. Ang dalawang pangungusap ay nagpapalinaw sa mahabang Hebreong pagkakasunod-sunod nang hindi binabago ang lohika nito.
