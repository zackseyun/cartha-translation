base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/015.yaml
  text: and the weight for the lampstands of gold and their lamps of gold[a], by the weight of each lampstand and its lamps; and for the lampstands of silver, by weight for each lampstand and its lamps, according to the service of each lampstand.
translation:
  language: tl
  text: at ang timbang para sa mga gintong patungan ng ilawan at sa mga gintong ilawan ng mga iyon, ayon sa timbang ng bawat patungan ng ilawan at ng mga ilawan nito; at para sa mga pilak na patungan ng ilawan, ayon sa timbang ng bawat patungan ng ilawan at ng mga ilawan nito, ayon sa gamit ng bawat patungan ng ilawan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “patungan ng ilawan at patungan ng ilawan” sa dalawang parirala; distributibong pagpapahayag ito na nangangahulugang bawat patungan ng ilawan nang paisa-isa.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁקָל
  choice: takdang timbang
  rationale: Sa konteksto ng mga materyales para sa templo, tumutukoy ito sa itinakdang dami ayon sa timbang. Nililinaw ng “takdang” na hindi lamang simpleng kilos ng pagtimbang ang tinutukoy.
- source_word: מְנֹרוֹת
  choice: mga patungan ng ilawan
  rationale: Ang מְנוֹרָה ay ang kinatatayuan o sisidlan ng magkakaugnay na mga ilawan, hindi lamang ang mismong ilaw. Mas madaling maunawaan ito ng karaniwang mambabasa kaysa sa transliterasyong “menora.”
- source_word: נֵרֹתֵיהֶם / נֵרֹתֶיהָ
  choice: mga ilawan
  rationale: Tumutukoy ito sa mga indibiduwal na ilawang nakakabit o kaugnay ng patungan, kaya malinaw na ibinukod sa patungan mismo.
- source_word: זָהָב
  choice: ginto / gintong
  rationale: Pinanatili ang pagbanggit sa ginto kapwa para sa mga patungan at sa mga ilawan, gaya ng tahasang pag-uulit sa Hebreo.
- source_word: בְּמִשְׁקַל מְנוֹרָה וּמְנוֹרָה
  choice: ang timbang ng bawat patungan
  rationale: 'Ang literal na pag-uulit na “patungan at patungan” ay distributibo: hiwalay na timbang para sa bawat isa. Likas itong ipinahahayag sa Tagalog sa pamamagitan ng “bawat.”'
- source_word: וְלִמְנֹרוֹת הַכֶּסֶף
  choice: at para sa mga pilak na patungan ng ilawan
  rationale: Pinananatili nito ang malinaw na pagkakatulad sa naunang mga gintong patungan habang natural sa makabagong Tagalog.
- source_word: כַּעֲבוֹדַת מְנוֹרָה וּמְנוֹרָה
  choice: ayon sa tungkulin ng bawat patungan
  rationale: Ang עֲבוֹדָה ay maaaring tumukoy sa gawain, paglilingkod, o gamit. Dito, ipinahihiwatig nito ang tungkulin ng bawat patungan sa paglilingkod sa templo nang hindi ginagawang abstrakto o mekanikal ang pahayag.
theological_decisions:
- issue: Saklaw ng עֲבוֹדָה sa konteksto ng templo
  choice: tungkulin
  alternative: gamit; paglilingkod
  rationale: Ang “tungkulin” ay nagpapanatili sa ideya ng itinakdang papel o serbisyo ng bawat patungan, ngunit hindi nito tiyakang nilulutas kung praktikal na gamit o liturhikal na paglilingkod ang pangunahing diin.
translation_notes:
  register: Makabago, marangal, at madaling basahin. Ginamit ang “patungan ng ilawan” upang malinaw na maiba ang menorah sa mga indibiduwal na ilawan nito. Ang em dash ay tumutulong na maipakita ang paliwanag ng timbang nang hindi pinuputol ang daloy ng mahabang pangungusap.
