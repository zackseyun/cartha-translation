  to: at ang timbang para sa mga gintong patungan ng ilawan at sa mga gintong ilawan ng mga iyon, ayon sa timbang ng bawat patungan ng ilawan at ng mga ilawan nito; at para sa mga pilak na patungan ng ilawan, ayon sa timbang ng bawat patungan ng ilawan at ng mga ilawan nito, ayon sa gamit ng bawat patungan ng ilawan.[a]
