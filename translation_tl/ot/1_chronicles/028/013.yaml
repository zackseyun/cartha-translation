base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/013.yaml
  text: for the divisions of the priests and the Levites[a], and for all the work of the service of the house of Yahweh[b], and for all the vessels of service of the house of Yahweh.
translation:
  language: tl
  text: para sa mga pangkat ng mga pari at mga Levita[a], para sa lahat ng gawain sa paglilingkod sa bahay ni Yahweh, at para sa lahat ng kagamitan[b] sa paglilingkod sa bahay ni Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “mga pangkat na nakatalaga sa kani-kanilang turno.”
    reason: lexical_alternative
  - marker: b
    text: Ang salitang Hebreo ay maaaring tumukoy sa mga sisidlan, kasangkapan, o iba pang gamit.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַחְלְקוֹת
  choice: mga pangkat
  rationale: Tumutukoy sa organisadong mga pangkat o yunit ng mga pari at Levita na may nakatalagang paglilingkod. Likas at malinaw sa modernong Filipino ang “mga pangkat.”
- source_word: הַכֹּהֲנִים
  choice: mga pari
  rationale: Karaniwang salin para sa uring saserdotal ng Israel; ipinahihiwatig na ng “mga” at ng konteksto ang tiyak na pangkat.
- source_word: הַלְוִיִּם
  choice: mga Levita
  rationale: Pinananatili ang kinikilalang katawagan sa mga kabilang sa lipi ni Levi at sa kanilang natatanging paglilingkod.
- source_word: מְלֶאכֶת עֲבוֹדַת
  choice: gawain sa paglilingkod
  rationale: Ipinapakita ang ugnayan ng malawak na “gawain” at ng nakatalagang paglilingkod sa templo nang hindi nagdaragdag ng makabagong eklesiastikong kahulugan.
- source_word: בֵּית יְהוָה
  choice: bahay ni Yahweh
  rationale: Pinananatili ang literal na larawang “bahay” sa halip na gawing “templo,” at isinasalin ang banal na pangalan bilang Yahweh.
- source_word: כְּלֵי
  choice: kagamitan
  rationale: Malawak ang saklaw ng salitang Hebreo at maaari itong tumukoy sa mga sisidlan, kasangkapan, o iba pang bagay na ginagamit sa paglilingkod; ang “kagamitan” ay hindi nagpapakitid sa kahulugan.
- source_word: לְכָל
  choice: para sa lahat ng
  rationale: Pinananatili ang paulit-ulit na balangkas ng talaan at ang saklaw na “lahat.”
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehova
  rationale: Tuwirang ginagamit sa tekstong Hebreo ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalang tipan nang hindi ito pinapalitan ng titulo.
- issue: Kahulugan ng עֲבוֹדָה sa konteksto ng bahay ni Yahweh
  choice: paglilingkod
  alternative: ministeryo / paggawa
  rationale: Sinasaklaw ng “paglilingkod” ang nakatalagang gawain sa santuwaryo nang hindi nag-aangkat ng mas huling terminolohiyang pang-iglesia.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinananatili ang anyong talaan ng Hebreo at ang pag-uulit ng “para sa lahat,” habang ginagamit ang likas na pariralang “gawain sa paglilingkod.”
