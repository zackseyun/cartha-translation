  yaml_path: translation/ot/1_chronicles/028/017.yaml
  text: and the forks, the basins, and the pitchers of pure gold; and for the golden bowls, by weight for each bowl and bowl; and for the silver bowls, by weight for each bowl and bowl.
translation:
  language: tl
  text: at ang mga tinidor, mga palanggana, at mga sisidlang pambuhos[b], na pawang yari sa purong ginto; at para sa mga mangkok na yari sa ginto, ang takdang timbang ng bawat mangkok[a]; at para sa mga mangkok na pilak, ang takdang timbang ng bawat mangkok[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, inuulit ang “mangkok”—literal na “para sa mangkok at mangkok”—upang ipahiwatig na may sariling takdang timbang ang bawat isa.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “mga pitsel.” Hindi tiyak ang eksaktong anyo ng sisidlan, ngunit malamang na ginagamit ito sa pagbuhos.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִּזְלָגוֹת
  choice: mga tinidor
  rationale: Tumutukoy sa mga kagamitang pansamba na may mga tulis. Ang “mga tinidor” ay malinaw at makabagong katawagan nang hindi gumagamit ng lipas na terminong teknikal.
- source_word: מִּזְרָקוֹת
  choice: mga palanggana
  rationale: Karaniwang tumutukoy ang salita sa mga malalapad na sisidlang ginagamit sa paghahandog. Ibinubukod ito ng “mga palanggana” sa כְפוֹרֵי, na isinaling “mga mangkok.”
- source_word: קְּשָׂוֹת
  choice: mga sisidlang pambuhos
  rationale: Hindi tiyak ang eksaktong anyo ng sisidlan, ngunit ipinahihiwatig ng gamit nito na ito ay sisidlang pambuhos. Pinananatili ng salin ang tungkulin nang hindi labis na tinutukoy ang hugis.
- source_word: זָהָב טָהוֹר
  choice: yari sa purong ginto
  rationale: Likas sa Tagalog ang pariralang ito at malinaw na itinatakda ang materyal ng mga kagamitang naunang binanggit.
- source_word: כְפוֹרֵי
  choice: mga mangkok
  rationale: Sa talaang ito ng mga kagamitan, tumutukoy ang salita sa isang sisidlang tila mangkok. Iniiwasan din nitong malito ito sa naunang מִּזְרָקוֹת, “mga palanggana.”
- source_word: בְּמִשְׁקָל
  choice: ang takdang timbang
  rationale: Ipinahihiwatig ng parirala na may nakalaang dami ng mahalagang metal batay sa timbang ng bawat kagamitan. Natural sa Tagalog ang “takdang timbang” sa kontekstong ito.
- source_word: לִכְפוֹר וּכְפוֹר
  choice: ng bawat mangkok
  rationale: Ang literal na pag-uulit na “para sa mangkok at mangkok” ay isang Hebreong paraang distributibo. Natural na naihahayag sa Tagalog ang kahulugan nito sa “bawat mangkok,” habang ipinaliliwanag sa talababa ang anyo ng orihinal.
- source_word: כֶּסֶף
  choice: pilak
  rationale: Karaniwang katumbas ito ng metal na pilak, na ikinokontra rito sa ginto.
