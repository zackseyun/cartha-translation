translation_notes:
  register: Makabago ngunit marangal na Filipino ang ginamit. Pinanatili ang ayos na tila bahagi ng nagpapatuloy na talaan, gaya ng ipinahihiwatig ng panimulang וְ (“at”). Isinalin nang natural ang Hebreong distributibong pag-uulit at inilagay sa talababa ang literal na anyo nito.
