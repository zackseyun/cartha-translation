  terminology: Wastong pinanatili ang “Yahweh,” “kaban ng tipan,” at “tuntungan ng mga paa.” Hindi pinipilit ng pangunahing teksto ang isang doktrinal na pagbasa sa ugnayan ng kaban at tuntungan; maingat na inilalahad ng talababa ang kaugnayan nito. Tama rin ang “mga kapatid ko,” na may angkop na paliwanag sa talababa.
