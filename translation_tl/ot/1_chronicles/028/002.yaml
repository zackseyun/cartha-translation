  text: וַ/יָּ֨קָם דָּוִ֤יד הַ/מֶּ֨לֶךְ֙ עַל רַגְלָ֔י/ו וַ/יֹּ֕אמֶר שְׁמָע֖וּ/נִי אַחַ֣/י וְ/עַמִּ֑/י אֲנִ֣י עִם לְבָבִ֡/י לִ/בְנוֹת֩ בֵּ֨ית מְנוּחָ֜ה לַ/אֲר֣וֹן בְּרִית יְהוָ֗ה וְ/לַ/הֲדֹם֙ רַגְלֵ֣י אֱלֹהֵ֔י/נוּ וַ/הֲכִינ֖וֹתִי לִ/בְנֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/002.yaml
  text: Then King David rose to his feet and said[a], “Hear me, my brothers and my people. It was in my heart to build a house of rest for the ark of the covenant of Yahweh, and for the footstool of our God[c][b], and I made preparations to build it.”
translation:
  language: tl
  text: At tumayo si Haring David at sinabi, “Pakinggan ninyo ako, mga kapatid ko[a] at bayan ko. Nasa puso kong magtayo ng isang bahay na pahingahan[b] para sa kaban ng tipan ni Yahweh at para sa tuntungan ng mga paa ng ating Diyos[c]. Naghanda ako upang itayo iyon.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga kamag-anak ko.” Literal na “mga kapatid ko” ang Hebreo, isang panlalaking anyong maramihan na ginamit sa pampublikong pananalita.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “isang lugar na pahingahan,” na tumutukoy sa isang matatag na tirahan para sa kaban.
    reason: lexical_alternative
  - marker: c
    text: Inilalarawan ang kaban bilang tuntungan na kaugnay ng presensiya ng Diyos ng Israel. Ihambing ang Awit 132:7.
    reason: cross_reference
lexical_decisions:
- source_word: וַיָּקָם ... עַל רַגְלָיו
  choice: At tumayo
  rationale: Likas na salin ng Hebreong kilos ng pagbangon at pagtayo; hindi na kailangang ulitin ang ‘sa kaniyang mga paa’ sa Tagalog.
- source_word: שְׁמָעוּנִי
  choice: Pakinggan ninyo ako
  rationale: Tuwirang ipinahahayag ang pautos na anyo at ang maringal na panawagan sa kapulungan.
- source_word: אַחַי וְעַמִּי
  choice: mga kapatid ko at bayan ko
  rationale: Pinananatili ang larawan ng pagkakapatid at ang hiwalay na pagtukoy sa bayan; ipinapaliwanag sa talababa ang gamit nito sa pampublikong pananalita.
- source_word: אֲנִי עִם לְבָבִי
  choice: Nasa puso ko
  rationale: Natural na idyomang Tagalog para sa panloob na hangarin o pasiya, nang hindi dinaragdagan ang tindi ng Hebreo.
- source_word: בֵּית מְנוּחָה
  choice: isang bahay na pahingahan
  rationale: Pinananatili ang parehong larawan ng ‘bahay’ at ‘pahinga,’ habang nauunawaan bilang matatag na tirahan ng kaban.
- source_word: לַאֲרוֹן בְּרִית יְהוָה
  choice: para sa kaban ng tipan ni Yahweh
  rationale: Malinaw na inililipat sa Tagalog ang Hebreong construct chain at pinananatili ang banal na pangalang Yahweh.
- source_word: וְלַהֲדֹם רַגְלֵי אֱלֹהֵינוּ
  choice: at para sa tuntungan ng mga paa ng ating Diyos
  rationale: Pinananatili ang metapora at ang koordinasyong ‘at para sa’ ng Hebreo sa halip na gawing tahasang apposisyon sa pangunahing teksto.
- source_word: וַהֲכִינוֹתִי לִבְנוֹת
  choice: Naghanda ako upang itayo iyon
  rationale: Ipinahahayag ang paghahandang ginawa ni David; ang ‘iyon’ ay natural na tumutukoy sa bahay na binanggit.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang pangalan ang nasa Hebreo; pinananatili ang personal na pangalang tipan nang walang denominasyonal na pagpapakahulugan.
- issue: Ugnayan ng kaban at ng ‘tuntungan ng mga paa’
  choice: Pinanatili ang ‘at para sa’ sa pangunahing teksto
  alternative: 'Gawing apposisyon: ‘ang tuntungan ng mga paa ng ating Diyos’'
  rationale: Maaaring unawain ang parirala bilang paglalarawan sa kaban, ngunit hindi kailangang alisin ang pormal na koordinasyon ng Hebreo; inililinaw sa talababa ang malamang na kaugnayan nang hindi isinasara ang sintaktikong puwang.
- issue: Saklaw ng אַחַי sa pampublikong pananalita
  choice: mga kapatid ko
  alternative: mga kamag-anak ko; mga kababayan ko
  rationale: Pinananatili ang literal na larawang panlalaki/pangkapatiran ng Hebreo, samantalang ipinapaliwanag sa talababa na ginagamit ito sa pagharap sa kapulungan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang mga larawang ‘nasa puso,’ ‘bahay na pahingahan,’ at ‘tuntungan ng mga paa,’ ngunit iniwasan ang sobrang literal na ayos na magiging alanganin sa karaniwang mambabasa.
