  source_fidelity: 'Tumpak ang salin sa pangunahing daloy ng Hebreo: tumindig si David, nanawagan sa kaniyang mga kapatid at bayan, ipinahayag ang hangaring magtayo ng isang tahanang pahingahan para sa kaban ng tipan ni Yahweh at sa tuntungan ng paa ng kanilang Diyos, at binanggit ang kaniyang paghahanda para rito. Ang hindi pagsasalin nang hiwalay sa “sa kaniyang mga paa” ay likas at hindi nakababawas sa diwa sa Tagalog.'
