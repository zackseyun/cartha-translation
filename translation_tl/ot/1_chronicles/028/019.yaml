base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/019.yaml
  text: All this he made clear to me in writing from the hand of Yahweh[b][a], all the works of the pattern.
translation:
  language: tl
  text: Ang lahat ng ito—lahat ng gawaing ayon sa plano[b]—ay ipinaunawa sa akin ni Yahweh sa pamamagitan ng nakasulat na pahayag; nasa akin ang kanyang kamay[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O maaaring isalin: “Ang lahat ng ito ay ipinaunawa sa akin ni Yahweh sa pamamagitan ng nakasulat na pahayag mula sa kanyang kamay.” Siksik ang pagbubuo ng Hebreo; maaaring iugnay ang “nasa akin” sa “kamay ni Yahweh” o sa paraan ng kanyang pagpapaliwanag.'
    reason: alternative_reading
  - marker: b
    text: Ang “plano” ay maaari ring isaling “huwaran” o “disenyo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֹּל
  choice: ang lahat ng ito
  rationale: Ipinahihiwatig ng konteksto na tinutukoy ni David ang kabuuan ng planong katatapos lamang niyang ilarawan.
- source_word: בִּכְתָב
  choice: sa pamamagitan ng isang kasulatan
  rationale: Ipinakikita ng בְּ at כְּתָב na ang kapahayagan ay nasa nakasulat na anyo; natural itong pahayag sa modernong Tagalog.
- source_word: מִיַּד יְהוָה
  choice: mula sa kanyang kamay
  rationale: Pinananatili ang larawang Hebreo ng tuwirang banal na pinagmulan at pagkilos; malinaw sa naunang Yahweh kung kaninong kamay ito.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang personal na pangalan ng Diyos ayon sa anyong Hebreo at sa patakaran ng proyekto.
- source_word: עָלַי הִשְׂכִּיל
  choice: ipinaunawa sa akin ni Yahweh
  rationale: Ang Hiphil ng שׂכל ay nagpapahayag ng pagsasanhi ng pagkaunawa. Isinasama ng 'sa akin' ang עָלַי sa natural na Tagalog, habang inilalagay sa talababa ang ibang posibleng pagbubuo ng siksik na parirala.
- source_word: כֹּל מַלְאֲכוֹת
  choice: ang lahat ng gawain
  rationale: Saklaw ng מְלָאכוֹת ang mga gawain o trabahong kailangan upang maisakatuparan ang disenyo.
- source_word: הַתַּבְנִית
  choice: ang plano
  rationale: Sa konteksto ng pagtatayo ng templo, malinaw at natural ang 'plano,' ngunit maaari ring mangahulugang huwaran o disenyo.
theological_decisions:
- issue: Pagbubuo sa siksik na pariralang עָלַי הִשְׂכִּיל
  choice: 'Si Yahweh ang ipinahiwatig na simuno: “ipinaunawa sa akin ni Yahweh”'
  alternative: “Nasa akin ang kamay ni Yahweh, at ipinaunawa niya sa akin ang lahat ng gawain ayon sa plano.”
  rationale: Pinananatili ng pangunahing salin ang banal na pagkilos at ang pagsasanhi ng pagkaunawa nang hindi ipinipilit na ang עָלַי ay tahasang kaugnay ng 'kamay.' Inilalahad sa talababa ang lehitimong alternatibong sintaktikong pagbasa.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Pinanatili ang metaporang “mula sa kanyang kamay,” ngunit gumamit ng “kasulatan” at “plano” upang maging malinaw sa karaniwang mambabasa. Ang mga markang [a] at [b] ay kapuwa nasa pangunahing teksto.
