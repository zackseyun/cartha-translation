- from: Ang lahat ng ito ay ipinaunawa sa akin ni Yahweh sa pamamagitan ng isang kasulatang mula sa kanyang kamay[a]—ang lahat ng gawaing ayon sa plano.[b]
  to: Ang lahat ng ito—lahat ng gawaing ayon sa plano[b]—ay ipinaunawa sa akin ni Yahweh sa pamamagitan ng nakasulat na pahayag; nasa akin ang kanyang kamay[a].
  rationale: Pinanatili ng rebisyon ang “lahat ng ito,” ang nakasulat na anyo ng kapahayagan, ang banal na pagkilos ni Yahweh, ang “kamay” na “nasa akin,” at ang lahat ng gawaing kaugnay ng plano. Hindi nito ipinipilit ang isang pinagtatalunang sintaktikong pagbubuo; ipinaliliwanag sa talababa ang pangunahing alternatibo.
