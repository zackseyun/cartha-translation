revisions:
- from: At ikaw, Solomon na anak ko, kilalanin mo ang Diyos ng iyong ama at paglingkuran mo siya nang buong puso at kusang-loob, sapagkat sinisiyasat ni Yahweh ang lahat ng puso at nauunawaan niya ang bawat layuning nasa isip. Kung hahanapin mo siya, hahayaan niyang matagpuan mo siya[a]; ngunit kung tatalikuran mo siya, itatakwil ka niya magpakailanman[b].
  to: At ikaw, Solomon, anak ko, kilalanin mo ang Diyos ng iyong ama at paglingkuran mo siya nang buong puso at kusang-loob, sapagkat sinisiyasat ni Yahweh ang lahat ng puso at nauunawaan niya ang bawat layunin ng isip. Kung hahanapin mo siya, matatagpuan mo siya[a]; ngunit kung tatalikuran mo siya, itatakwil ka niya magpakailanman[b].
  rationale: Inayos ang bokatibo para sa likas na Tagalog, pinalitan ang pangunahing salin ng Niphal ng isang hindi nagdaragdag ng causative na kahulugan, at nilinaw ang saklaw ng panloob na mga layunin/iniisip. Napanatili ang bigat ng babala, ang banal na pangalang Yahweh, at ang mga talababa sa wastong angkla.
  reviewer_model: gpt-5.6-terra
