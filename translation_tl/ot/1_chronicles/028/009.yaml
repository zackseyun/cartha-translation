  text: וְ/אַתָּ֣ה שְׁלֹמֹֽה בְנִ֡/י דַּע֩ אֶת אֱלֹהֵ֨י אָבִ֜י/ךָ וְ/עָבְדֵ֗/הוּ בְּ/לֵ֤ב שָׁלֵם֙ וּ/בְ/נֶ֣פֶשׁ חֲפֵצָ֔ה כִּ֤י כָל לְבָבוֹת֙ דּוֹרֵ֣שׁ יְהוָ֔ה וְ/כָל יֵ֥צֶר מַחֲשָׁב֖וֹת מֵבִ֑ין אִֽם תִּדְרְשֶׁ֨/נּוּ֙ יִמָּ֣צֵא לָ֔/ךְ וְ/אִם תַּֽעַזְבֶ֖/נּוּ יַזְנִיחֲ/ךָ֥ לָ/עַֽד־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/009.yaml
  text: And you[a], Solomon my son, know the God of your father and serve him with a whole heart and a willing soul, for Yahweh searches all hearts and understands every intention of the thoughts. If you seek him, he will let himself be found by you; but if you forsake him[b], he will cast you off forever.
translation:
  language: tl
  text: At ikaw, Solomon, anak ko, kilalanin mo ang Diyos ng iyong ama at paglingkuran mo siya nang buong puso at kusang-loob, sapagkat sinisiyasat ni Yahweh ang lahat ng puso at nauunawaan niya ang bawat layunin ng isip. Kung hahanapin mo siya, matatagpuan mo siya[a]; ngunit kung tatalikuran mo siya, itatakwil ka niya magpakailanman[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “hahayaan niyang matagpuan mo siya.” Ang pandiwang Hebreo ay nasa anyong pasibo/reflexive.
    reason: lexical_alternative
  - marker: b
    text: O, “itataboy ka niya magpakailanman.”
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּע
  choice: kilalanin mo
  rationale: Ang pautos na anyo ay tumutukoy hindi lamang sa kaalamang nasa isip kundi sa personal at tapat na pagkilala sa Diyos.
- source_word: אֱלֹהֵי אָבִיךָ
  choice: ang Diyos ng iyong ama
  rationale: Pinananatili nito ang likas na ayos at ang ugnayang pampamilya at pangtipan sa tagubilin ni David kay Solomon.
- source_word: וְעָבְדֵהוּ
  choice: at paglingkuran mo siya
  rationale: Saklaw ng pandiwa ang pagsamba, pagsunod, at tapat na paglilingkod; mas malawak ang “paglingkuran” kaysa “sambahin” lamang.
- source_word: בְּלֵב שָׁלֵם
  choice: nang buong puso
  rationale: Ipinahahayag nito ang kabuuan, katapatan, at hindi nahahating debosyon nang hindi ipinahihiwatig ang ganap na kawalan ng pagkukulang.
- source_word: וּבְנֶפֶשׁ חֲפֵצָה
  choice: at kusang-loob
  rationale: Natural itong Filipino para sa handa at nagnanais na panloob na pagkatao. Bagaman hindi tahasang inuulit ang “kaluluwa,” ipinahahayag ng parirala ang kusang pagnanais ng buong sarili.
- source_word: כִּי כָל לְבָבוֹת דּוֹרֵשׁ יְהוָה
  choice: sapagkat sinisiyasat ni Yahweh ang lahat ng puso
  rationale: Ang “sinisiyasat” ay nagpapahayag ng masusing pag-alam o pagsusuri, hindi ng paghahanap dahil hindi alam kung nasaan ang isang bagay.
- source_word: וְכָל יֵצֶר מַחֲשָׁבוֹת מֵבִין
  choice: at nauunawaan niya ang bawat layuning nasa isip
  rationale: Isinasalin nito sa natural na Filipino ang panloob na paghubog, hilig, o layunin ng mga iniisip nang hindi labis na nililimitahan ang kahulugan.
- source_word: אִם תִּדְרְשֶׁנּוּ
  choice: Kung hahanapin mo siya
  rationale: Ang paghahanap dito ay debosyonal at pangtipan—paglapit sa Diyos nang may pagsandig at katapatan.
- source_word: יִמָּצֵא לָךְ
  choice: hahayaan niyang matagpuan mo siya
  rationale: Pinananatili nito ang pasibo/reflexive na diwa at ang tensiyong ang Diyos ay tunay na matatagpuan ngunit hindi basta produkto ng pagsisikap ng tao.
- source_word: תַּעַזְבֶנּוּ
  choice: kung tatalikuran mo siya
  rationale: Natural at taimtim itong katumbas ng pag-iwan o pagtataksil sa katapatan sa Diyos sa kontekstong pangtipan.
- source_word: יַזְנִיחֲךָ לָעַד
  choice: itatakwil ka niya magpakailanman
  rationale: Pinananatili nito ang matindi at tahasang babala ng Hebreo nang hindi ito pinahihina.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang personal na pangalang Hebreo sa halip na palitan ito ng isang titulo.
theological_decisions:
- issue: Wika tungkol sa puso at kaluluwa/panloob na sarili
  choice: “nang buong puso at kusang-loob”
  alternative: “nang buong puso at may kaluluwang handang maglingkod”
  rationale: Pinananatili ng salin ang kabuuang debosyon at kusang pagnanais na nasa dalawang pariralang Hebreo, habang iniiwasan ang pilit at di-likas na pariralang Filipino.
- issue: Pagiging matatagpuan ng Diyos sa יִמָּצֵא לָךְ
  choice: “hahayaan niyang matagpuan mo siya”
  alternative: “matatagpuan mo siya”
  rationale: Ipinakikita ng Niphal ang pasibo/reflexive na diwa. Pinananatili ng pangunahing salin ang pagkilos ng naghahanap at ang kusang pagpapakilala o pagpapasumpong ng Diyos nang hindi bumubuo ng mas malawak na sistemang teolohikal.
- issue: Tindi ng babalang pangtipan
  choice: “itatakwil ka niya magpakailanman”
  alternative: “itataboy ka niya magpakailanman”
  rationale: Tahasang pinananatili ang bigat at pangmatagalang saklaw ng babala kay Solomon, nang hindi nilulutas ang mga tanong na teolohikal na hindi tinatalakay ng talata.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “kilalanin,” “sinisiyasat,” at “tatalikuran” upang mapanatili ang taimtim at pangtipang tono nang hindi nagiging lipas o sobrang teknikal.
