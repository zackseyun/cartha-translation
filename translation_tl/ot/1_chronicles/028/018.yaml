  to: at para sa altar ng insenso, dinalisay na ginto ayon sa timbang; at para sa huwaran ng karo[a]—ang mga kerubing yari sa ginto na nakabuka ang mga pakpak at nakalilim[b] sa ibabaw ng kaban ng tipan ni Yahweh.
  rationale: Inayos ang ayos ng unang parirala upang malinaw na ang dinalisay na ginto ang inilaan para sa altar at ang timbang ang batayan ng pagtukoy rito. Pinalitan ang “lumulukob” ng “nakalilim” upang tumpak na maipakita ang kilos ng mga pakpak na tumatakip mula sa itaas. Pinanatili ang ambigwidad ng “huwaran ng karo” at inayos ang talababa upang hindi ito magpahiwatig ng higit na tiyak na pagbasa kaysa sa pinahihintulutan ng Hebreo.
