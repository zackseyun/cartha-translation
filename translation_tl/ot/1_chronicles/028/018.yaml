base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/018.yaml
  text: and for the altar of incense[a], refined gold by weight; and for the pattern of the chariot[b], the cherubim of gold spreading out their wings and overshadowing the ark of the covenant of Yahweh.
translation:
  language: tl
  text: at para sa altar ng insenso, dinalisay na ginto ayon sa timbang; at para sa huwaran ng karo[a]—ang mga kerubing yari sa ginto na nakabuka ang mga pakpak at nakalilim[b] sa ibabaw ng kaban ng tipan ni Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “plano” o “modelo ng karo.” Mahirap ang pariralang Hebreo at maaaring tumukoy sa estrukturang tulad ng karong-trono na nauugnay sa mga kerubin at sa kaban.
    reason: alternative_reading
  - marker: b
    text: Maaari ring “tumatakip.” Inilalarawan dito ang mga kerubin na nakabuka ang mga pakpak sa ibabaw ng kaban.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְבַּח הַקְּטֹרֶת
  choice: altar ng insenso
  rationale: Tuwirang ipinapahayag ang ugnayang construct at malinaw na tumutukoy sa kagamitang pangtemplo.
- source_word: זָהָב מְזֻקָּק
  choice: dinalisay na ginto
  rationale: Pinananatili ng “dinalisay” ang diwang metalurhiko ng gintong nilinis sa pamamagitan ng pagdadalisay.
- source_word: בַּמִּשְׁקָל
  choice: ang timbang
  rationale: Sa konteksto ng talaan ng mga itinakdang materyales, natural na ipinahihiwatig nito ang tiyak na timbang o dami ng gintong ilalaan.
- source_word: תַבְנִית
  choice: huwaran
  rationale: Saklaw ng “huwaran” ang anyo, modelo, o planong sinusunod nang hindi nilulutas ang likas na lawak ng terminong Hebreo.
- source_word: הַמֶּרְכָּבָה
  choice: karo
  rationale: Ang karaniwang kahulugan ay “karo.” Pinananatili ito upang hindi agad bigyang-kahulugan bilang trono o estrukturang kerubin ang mahirap na parirala.
- source_word: הַכְּרֻבִים
  choice: mga kerubin
  rationale: Karaniwang salin-titik sa Bibliyang Filipino ang “kerubin”; nililinaw ng “mga” ang anyong maramihan.
- source_word: זָהָב
  choice: mga kerubing ginto
  rationale: Ipinakikitang ginto ang materyal ng mga kerubin, alinsunod sa pinakanatural na pagkakaugnay ng mga salita.
- source_word: לְפֹרְשִׂים
  choice: nakabuka ang kanilang mga pakpak
  rationale: Ang pandiwari ay nangangahulugang pag-uunat o pagbubuka; malinaw sa larawang pangtemplo na mga pakpak ang ipinahihiwatig na layon.
- source_word: וְסֹכְכִים
  choice: at lumulukob
  rationale: Naipahahayag ng “lumulukob” ang pagtakip mula sa ibabaw at ang larawang nililikha ng nakabukang mga pakpak, nang hindi ito ginagawang payak na pisikal na pagtakip lamang.
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: kaban ng tipan ni Yahweh
  rationale: Natural na Filipino ang anyong ito at pinananatili ang buong ugnayan ng construct chain at ang tahasang personal na pangalan na יהוה.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tahasang nasa tekstong Hebreo ang Tetragrammaton; pinananatili ng “Yahweh” ang pangalan sa halip na palitan ito ng isang titulo.
- issue: Kahulugan ng “huwaran ng karo” sa konteksto ng mga kerubin at kaban
  choice: Pinanatili sa pangunahing teksto ang literal at hindi ganap na tiyak na “huwaran ng karo.”
  alternative: disenyo/modelo ng karong-trono o estrukturang trono ng mga kerubin
  rationale: Mahirap ang pariralang Hebreo at maaaring tumukoy sa estrukturang kerubin na nauugnay sa kaban bilang trono o sasakyan ng presensiya ng Diyos. Hindi ito tahasang nilulutas ng salin.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Pinanatili ang anyong karugtong ng naunang listahan sa pamamagitan ng pambungad na “at.” Ginamit ang “karo” bilang malinaw na terminong biblikal, “kerubin” bilang kinikilalang salin-titik, at “lumulukob” upang ilarawan ang pagtakip ng mga pakpak mula sa ibabaw. Inilagay ang mga talababa sa mga salitang talagang tinatalakay ng mga ito.
