revisions:
- from: Ngunit pinili ako ni Yahweh, ang Diyos ng Israel, mula sa buong sambahayan ng aking ama upang maging hari sa Israel magpakailanman[a]. Sapagkat pinili niya ang Juda bilang pinuno[b]; at sa sambahayan ng Juda ay pinili niya ang sambahayan ng aking ama, at sa mga anak ng aking ama ay kinalugdan niya akong gawing hari sa buong Israel.
  to: Ngunit pinili ako ni Yahweh, ang Diyos ng Israel, mula sa buong sambahayan ng aking ama upang maging hari ng Israel magpakailanman[a]. Sapagkat sa Juda siya pumili ng pinuno[b]; at sa loob ng sambahayan ni Juda, pinili niya ang sambahayan ng aking ama; at sa mga anak ng aking ama, ako ang kinalugdan niya upang gawing hari ng buong Israel.
