id: 1CH.28.4
reference: 1 Chronicles 28:4
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יִּבְחַ֡ר יְהוָ֣ה אֱלֹהֵי֩ יִשְׂרָאֵ֨ל בִּ֜/י מִ/כֹּ֣ל בֵּית אָבִ֗/י לִ/הְי֨וֹת לְ/מֶ֤לֶךְ עַל יִשְׂרָאֵל֙ לְ/עוֹלָ֔ם כִּ֤י בִֽ/יהוּדָה֙ בָּחַ֣ר לְ/נָגִ֔יד וּ/בְ/בֵ֥ית יְהוּדָ֖ה בֵּ֣ית אָבִ֑/י וּ/בִ/בְנֵ֣י אָבִ֔/י בִּ֣/י רָצָ֔ה לְ/הַמְלִ֖יךְ עַל כָּל יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/004.yaml
  text: Yet Yahweh[a], the God of Israel, chose me from all my father's house to be king over Israel forever; for he chose Judah as leader, and in the house of Judah, my father's house, and among my father's sons[b], he took pleasure in me to make me king over all Israel.
translation:
  language: tl
  text: Ngunit pinili ako ni Yahweh, ang Diyos ng Israel, mula sa buong sambahayan ng aking ama upang maging hari ng Israel magpakailanman[a]. Sapagkat sa Juda siya pumili ng pinuno[b]; at sa loob ng sambahayan ni Juda, pinili niya ang sambahayan ng aking ama; at sa mga anak ng aking ama, ako ang kinalugdan niya upang gawing hari ng buong Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “magpakailanman” ay mula sa salitang Hebreo na maaari ring tumukoy sa namamalagi o walang takdang panahong pagpapatuloy; dito, nasa konteksto ito ng paghahari ng sambahayan ni David.
    reason: cultural_note
  - marker: b
    text: 'Maaari ring isalin ang “pinuno” bilang “prinsipe” o “tagapamahala” (Hebreo: nagid).'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang transliterasyon ng personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
- source_word: וַיִּבְחַר / בָּחַר
  choice: pinili
  rationale: Likas na katumbas ito ng pandiwang nangangahulugang pumili, at pinananatili ang pag-uulit sa Hebreo.
- source_word: בִּי מִכֹּל בֵּית אָבִי
  choice: pinili ako ... mula sa buong sambahayan ng aking ama
  rationale: Ipinakikita nitong si David ay pinili mula sa mas malawak na angkan o sambahayan ng kanyang ama.
- source_word: לִהְיוֹת לְמֶלֶךְ
  choice: upang maging hari
  rationale: Malinaw nitong ipinahahayag ang layunin o bunga ng pagpili.
- source_word: לְעוֹלָם
  choice: magpakailanman
  rationale: Pinananatili nito ang matimbang at posibleng dinastikong saklaw ng pahayag nang hindi nilulutas ang tensiyong teolohikal.
- source_word: לְנָגִיד
  choice: bilang pinuno
  rationale: Saklaw ng nagid ang itinalagang tagapanguna o pinuno; malinaw ito sa modernong Tagalog at hindi nag-aangkat ng mas makitid na kahulugan ng 'prinsipe.'
- source_word: וּבְבֵית יְהוּדָה בֵּית אָבִי
  choice: at sa sambahayan ng Juda ay pinili niya ang sambahayan ng aking ama
  rationale: Pinananatili ang Hebreong pang-ukol na 'sa' habang ginagawang malinaw sa Tagalog ang sunud-sunod na pagpapakitid ng pagpili. Ang ikalawang 'pinili niya' ay ipinahiwatig ng estruktura at idinagdag para sa likas na daloy.
- source_word: וּבִבְנֵי אָבִי
  choice: at sa mga anak ng aking ama
  rationale: Pinananatili ang tiyak na pananalitang pangangkan sa Hebreo sa halip na paikliin bilang 'mga kapatid ko.'
- source_word: בִּי רָצָה
  choice: kinalugdan niya ako
  rationale: Ipinahahayag nito ang pabor at kaluguran, hindi lamang ang pagpili na naipahayag na ng בחר.
- source_word: לְהַמְלִיךְ
  choice: gawing hari
  rationale: 'Tumpak na inihahayag ang anyong causative ng pandiwa: italaga o gawin ang isang tao bilang hari.'
- source_word: עַל כָּל יִשְׂרָאֵל
  choice: sa buong Israel
  rationale: Natural na Tagalog para sa saklaw ng paghahari sa lahat ng Israel.
theological_decisions:
- issue: Saklaw ng לְעוֹלָם sa paghahari ni David
  choice: magpakailanman
  alternative: sa mahabang panahon; palagian
  rationale: Pinananatili ang pangmatagalan o dinastikong abot ng pahayag at ang kaugnay na teolohikal na tensiyon, nang hindi tahasang ipinaliliwanag sa talata ang kalaunang katuparan.
- issue: Kahulugan ng נָגִיד
  choice: pinuno
  alternative: prinsipe; tagapamahala
  rationale: Malinaw nitong ipinahahayag ang itinalagang pamumuno nang hindi ipinapalagay na isang mababang katungkulan kaysa hari ang tinutukoy.
- issue: Relasyon ng רָצָה sa naunang pagpili
  choice: kinalugdan niya ako
  alternative: naging kalugod-lugod ako sa kanya; pinaboran niya ako
  rationale: Pinananatili ang personal na pabor o kaluguran at hindi ito pinapantay lamang sa naunang pandiwang 'pinili.'
translation_notes:
  register: 'Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “sambahayan” para sa genealogical na בית at pinanatili ang sunud-sunod na pagpili: Israel, Juda, sambahayan ng ama, at si David. Ang mga panandang [a] at [b] ay kapwa nasa pangunahing teksto at tumutugma sa mga talababa.'
