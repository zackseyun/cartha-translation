translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang terminong 'bigat' bilang kongkretong takdang sukat ng metal, at ginawang natural ang distributibong Hebreong parirala sa pamamagitan ng 'bawat mesa.'
