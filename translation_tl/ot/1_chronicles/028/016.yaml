  text: and the weight of the gold for the tables of the arrangement[a], for each table and table, and silver for the silver tables.
translation:
  language: tl
  text: at ang bigat ng ginto para sa mga mesa ng pagkakaayos[a], ang bigat para sa bawat mesa, at ang pilak para sa mga mesang pilak.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “mga mesa para sa nakahanay na tinapay”; tradisyonal na “mga mesa para sa tinapay na handog.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁקָל
  choice: bigat
  rationale: Tumutukoy ito sa takdang bigat ng mahalagang metal na ilalaan sa mga mesa, hindi sa halaga ng mga ito.
- source_word: שֻׁלְחֲנוֹת הַמַּעֲרֶכֶת
  choice: mga mesa ng tinapay na inayos sa hanay
  rationale: Ang מַעֲרֶכֶת ay tumutukoy sa isang maayos na pagkakahilera o pagkakaayos; sa kontekstong pangsantuwaryo, malamang na tinapay ang inilalagay sa mga mesa. Isinama ang 'tinapay' upang maging malinaw at natural sa Filipino, habang minarkahan sa talababa ang mas literal na pagbasa.
- source_word: לְשֻׁלְחָן וְשֻׁלְחָן
  choice: ang para sa bawat mesa
  rationale: Ang pag-uulit ng singular sa Hebreo ay distributibo. Natural na ipinahahayag ito sa Filipino bilang hiwalay na takdang bigat para sa bawat mesa.
- source_word: כֶּסֶף
  choice: pilak
  rationale: Payak na pangalan ito ng materyal at sadyang ikinukumpara sa ginto sa unang bahagi ng talata.
- source_word: שֻׁלְחֲנוֹת הַכָּסֶף
  choice: mga mesang pilak
  rationale: Maikli at natural itong salin ng construct phrase, na malamang na tumutukoy sa mga mesang yari sa pilak o kinikilalang mga mesang pilak.
