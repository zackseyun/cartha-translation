  text: וּ/מִ/כָּ֨ל בָּנַ֔/י כִּ֚י רַבִּ֣ים בָּנִ֔ים נָ֥תַן לִ֖/י יְהוָ֑ה וַ/יִּבְחַר֙ בִּ/שְׁלֹמֹ֣ה בְנִ֔/י לָ/שֶׁ֗בֶת עַל כִּסֵּ֛א מַלְכ֥וּת יְהוָ֖ה עַל יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/005.yaml
  text: And from among all my sons—for Yahweh has given me many sons—he chose Solomon my son to sit on the throne of the kingdom of Yahweh over Israel[a][b].
translation:
  language: tl
  text: At mula sa lahat ng mga anak kong lalaki—sapagkat binigyan ako ni Yahweh ng maraming anak na lalaki—pinili niya ang anak kong si Solomon upang maupo sa trono ng kaharian ni Yahweh at mamahala sa Israel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “trono ng kaharian ni Yahweh” ay nagbibigay-diin na ang paghahari sa Israel ay sa huli ay kay Yahweh, bagaman si Solomon ang haring tao.
    reason: cross_reference
lexical_decisions:
- source_word: וּמִכָּל בָּנַי
  choice: At mula sa lahat ng aking mga anak
  rationale: Ipinahahayag ang pagpili mula sa isang mas malaking pangkat. Likas sa Filipino ang “mula sa lahat,” at malinaw sa kasunod na sugnay na mga anak na lalaki ang tinutukoy.
- source_word: כִּי רַבִּים בָּנִים נָתַן לִי יְהוָה
  choice: sapagkat binigyan ako ni Yahweh ng maraming anak na lalaki
  rationale: Ang כִּי ay nagpapakilala rito ng paliwanag. Tiyak na panlalaki ang בָּנִים, kaya ginamit ang “anak na lalaki” sa sugnay na ito.
- source_word: וַיִּבְחַר בִּשְׁלֹמֹה בְנִי
  choice: pinili niya ang anak kong si Solomon
  rationale: Si Yahweh ang nananatiling simuno. Natural sa Filipino ang ayos na “ang anak kong si Solomon” para sa apposition na בְנִי.
- source_word: לָשֶׁבֶת עַל כִּסֵּא
  choice: upang maupo sa trono
  rationale: Sa konteksto ng paghahari, ang pag-upo sa trono ay tumutukoy sa pagluklok at pamamahala; pinanatili ang konkretong larawan ng Hebreo.
- source_word: מַלְכוּת יְהוָה
  choice: ng kaharian ni Yahweh
  rationale: Pinananatili ang construct chain at ang diin na ang kaharian ay kay Yahweh, hindi lamang sa Israel o sa sambahayan ni David.
- source_word: עַל יִשְׂרָאֵל
  choice: sa Israel
  rationale: Sa Filipino, natural ang “kaharian ... sa Israel” bilang paglalarawan sa saklaw ng paghahari. Ang alternatibong “na namamahala sa Israel” ay mas nagpapaliwanag kaysa sa mismong Hebreo.
theological_decisions:
- issue: Paglalarawan sa banal na pangalan na יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang tinutumbasan ang pangalang tipan at iniiwasang ipalit dito ang titulong “Panginoon.”
- issue: Kahulugan ng “trono ng kaharian ni Yahweh”
  choice: Pinanatili ang buong parirala
  alternative: trono ng Israel; maharlikang trono
  rationale: Malinaw na iniuugnay ng Hebreo ang kaharian kay Yahweh. Pinananatili nito ang tensiyon sa pagitan ng paghahari ni Yahweh at ng pag-upo ni Solomon bilang haring tao.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “anak na lalaki” kung saan kailangang ihayag ang panlalaking anyo ng Hebreo, ngunit “aking mga anak” sa unang parirala upang maiwasan ang mabigat na pag-uulit. Pinanatili ang parentetikong paliwanag sa pamamagitan ng mga gitling.
