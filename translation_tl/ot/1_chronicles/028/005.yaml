  to: At mula sa lahat ng mga anak kong lalaki—sapagkat binigyan ako ni Yahweh ng maraming anak na lalaki—pinili niya ang anak kong si Solomon upang maupo sa trono ng kaharian ni Yahweh at mamahala sa Israel.[a]
