  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/הָ/אֱלֹהִים֙ אָ֣מַר לִ֔/י לֹא תִבְנֶ֥ה בַ֖יִת לִ/שְׁמִ֑/י כִּ֣י אִ֧ישׁ מִלְחָמ֛וֹת אַ֖תָּה וְ/דָמִ֥ים שָׁפָֽכְתָּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/003.yaml
  text: But God said to me[a], ‘You shall not build a house for my name[b], because you are a man of wars and have shed blood.’
translation:
  language: tl
  text: Ngunit sinabi sa akin ng Diyos, “Hindi ka magtatayo ng bahay para sa aking pangalan[a], sapagkat isa kang taong nakikipagdigma[b] at nagbubo ng dugo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “bahay para sa aking pangalan” ay tumutukoy sa templo bilang lugar na natatanging kaugnay ng pangalan at presensiya ng Diyos.
    reason: cultural_note
  - marker: b
    text: Sa literal, “isang tao ng mga digmaan”; maaari ring isaling “isang mandirigma.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָאֱלֹהִים
  choice: Ngunit ... ang Diyos
  rationale: Ang אֱלֹהִים ay tumutukoy sa Diyos ng Israel. Bagaman karaniwang nangangahulugang “at” ang וְ, ang “ngunit” ay likas na nagpapahayag dito ng pagsalungat sa hangarin ni David na magtayo.
- source_word: אָמַר לִי
  choice: sinabi sa akin
  rationale: Tuwirang isinasalin ang pandiwang אמר at ang hulaping tumutukoy sa nagsasalita; pinananatili rin nito ang anyo ng pag-uulat ng sinabi ng Diyos.
- source_word: לֹא תִבְנֶה
  choice: Hindi ka magtatayo
  rationale: Maaaring magpahayag ang anyong ito kapuwa ng pagbabawal at ng tiyak na pahayag tungkol sa hindi ipahihintulot kay David. Pinananatili ng salin ang dalawang posibleng diin.
- source_word: בַיִת
  choice: bahay
  rationale: Literal na “bahay” ang בַיִת. Templo ang tinutukoy sa konteksto, ngunit pinananatili ang Hebreong larawang “bahay” sa halip na ipalit agad ang interpretasyong “templo.”
- source_word: לִשְׁמִי
  choice: para sa aking pangalan
  rationale: Pinananatili nito ang biblikal na pananalita tungkol sa santuwaryong kaugnay ng pangalan at presensiya ng Diyos nang hindi ito pinapakahulugan nang labis sa mismong talata.
- source_word: כִּי
  choice: sapagkat
  rationale: Malinaw nitong ipinakikilala ang dahilan ng hindi pagpapahintulot ng Diyos, habang angkop sa marangal na rehistro ng tuwirang pananalita.
- source_word: אִישׁ מִלְחָמוֹת
  choice: taong nakikipagdigma
  rationale: Likas sa modernong Tagalog ang pariralang ito at ipinahihiwatig ang pagkakakilanlan ni David sa paulit-ulit na pakikidigma. Ipinaliliwanag sa talababa na maramihan ang literal na Hebreo.
- source_word: וְדָמִים שָׁפָכְתָּ
  choice: at nagbubo ng dugo
  rationale: Ang “magbubo ng dugo” ang likas na idyomang Tagalog para sa דמים שפך. Hindi pinanatili ang maramihang anyo ng דמים sapagkat hindi iyon natural sa Tagalog.
theological_decisions:
- issue: Dahilan kung bakit hindi pinahintulutang itayo ni David ang bahay para sa pangalan ng Diyos
  choice: Inilalahad na ang pakikidigma ni David at ang pagbububo niya ng dugo ang mga dahilang ibinigay ng Diyos.
  alternative: Maaaring unawain ang pagbububo ng dugo bilang tiyak na makasalanang karahasan, o bilang dahilan lamang ng pagiging hindi angkop ni David sa papel ng tagapagtayo kahit lehitimo ang kaniyang mga digmaan.
  rationale: Hindi tahasang hinahatulan ng talata kung makasalanan ang pagbububo ng dugo, kung may usapin ng rituwal na pagiging di-angkop, o kung hindi lamang nababagay sa tagapagtayo ng templo ang buhay ng pakikidigma. Hindi nilulutas ng salin ang tensiyong ito.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “sapagkat” upang mapanatili ang solemne ngunit madaling maunawaang tono. Iniwasan ang di-likas na literalismong “tao ng mga digmaan” sa pangunahing teksto at inilagay ito sa talababa.
