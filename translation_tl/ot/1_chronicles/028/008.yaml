id: 1CH.28.8
reference: 1 Chronicles 28:8
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ֠/עַתָּה לְ/עֵינֵ֨י כָל יִשְׂרָאֵ֤ל קְהַל יְהוָה֙ וּ/בְ/אָזְנֵ֣י אֱלֹהֵ֔י/נוּ שִׁמְר֣וּ וְ/דִרְשׁ֔וּ כָּל מִצְוֺ֖ת יְהוָ֣ה אֱלֹהֵי/כֶ֑ם לְמַ֤עַן תִּֽירְשׁוּ֙ אֶת הָ/אָ֣רֶץ הַ/טּוֹבָ֔ה וְ/הִנְחַלְתֶּ֛ם לִ/בְנֵי/כֶ֥ם אַחֲרֵי/כֶ֖ם עַד עוֹלָֽם־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/008.yaml
  text: And now[a], in the sight of all Israel, the assembly of Yahweh, and in the hearing of our God, keep and seek all the commandments of Yahweh your God[b], so that you may possess the good land and leave it as an inheritance to your sons after you forever.
translation:
  language: tl
  text: At ngayon, sa harap ng buong Israel—ang kapulungan ni Yahweh—at sa pandinig ng ating Diyos, ingatan ninyo at pagsikapang sundin ang lahat ng utos ni Yahweh na inyong Diyos, upang mapasainyo[a] ang mabuting lupain at maipamana ninyo ito sa inyong mga anak na lalaki[b] na susunod sa inyo magpakailanman.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “manahin ninyo” o “ariin ninyo.” Ang pandiwang Hebreo ay maaaring mangahulugang magmana o magmay-ari, depende sa konteksto.
    reason: lexical_alternative
  - marker: b
    text: 'Hebreo: “mga anak na lalaki”; panlalaking maramihan ang salitang ginamit, hindi ang mas pangkalahatang “mga anak.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: At ngayon
  rationale: Pinananatili ang pang-ugnay at ang paglipat ng pananalita mula sa naunang pahayag.
- source_word: לְעֵינֵי כָל־יִשְׂרָאֵל
  choice: sa harap ng buong Israel
  rationale: Likas na salin ng idyomang literal na ‘sa mga mata ng buong Israel,’ na nagpapahiwatig ng hayag at pampublikong pahayag.
- source_word: קְהַל יְהוָה
  choice: ang kapulungan ni Yahweh
  rationale: Ang קהל ay tumutukoy sa sambayanang nagkatipon; malinaw at hindi labis na teknikal ang ‘kapulungan.’
- source_word: וּבְאָזְנֵי אֱלֹהֵינוּ
  choice: at sa pandinig ng ating Diyos
  rationale: Pinananatili ang diwa ng Hebreong idyomang ‘sa mga tainga ng ating Diyos’ sa likas na Tagalog.
- source_word: שִׁמְרוּ וְדִרְשׁוּ
  choice: ingatan ninyo at pagsikapang sundin
  rationale: Ang שׁמר ay pag-iingat o matapat na pagtupad, samantalang ang דרשׁ dito ay masidhing paghahangad at pagtatalaga ng sarili sa mga utos, hindi lamang intelektuwal na pagsisiyasat.
- source_word: כָּל־מִצְוֺת
  choice: ang lahat ng utos
  rationale: Tuwirang inilalarawan ang maramihang anyo na saklaw ng כָּל.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin ang banal na pangalang YHWH bilang ‘Yahweh’ sa halip na palitan ito ng isang titulo.
- source_word: תִּירְשׁוּ
  choice: mapasainyo
  rationale: Naipahahayag ang pagkakaroon o pagmamana ng lupain nang hindi lubusang nilulutas ang saklaw ng ירשׁ; inilalahad sa talababa ang posibleng alternatibo.
- source_word: הָאָרֶץ הַטּוֹבָה
  choice: ang mabuting lupain
  rationale: Tuwiran at biblikal na matunog na paglalarawan sa lupang ipinangako.
- source_word: וְהִנְחַלְתֶּם
  choice: at maipamana ninyo ito
  rationale: 'Ipinahahayag ang causative na diwa ng Hiphil: pangyarihing manahin ng mga anak ang lupain.'
- source_word: לִבְנֵיכֶם
  choice: sa inyong mga anak na lalaki
  rationale: Pinananatili ang tahasang panlalaking maramihang anyo ng בנים.
- source_word: עַד־עוֹלָם
  choice: magpakailanman
  rationale: Karaniwang salin ng pangmatagalang pormulang pangtipan sa kontekstong ito.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehovah
  rationale: Pangalan mismo ang nasa tekstong Hebreo, kaya pinananatili itong pangalan at hindi pinapalitan ng titulo.
- issue: Saklaw ng ירשׁ kaugnay ng lupain
  choice: mapasainyo
  alternative: manahin o ariin
  rationale: Maaaring tumukoy ang pandiwa sa pagmamana o pag-aangkin/pagmamay-ari. Ang ‘mapasainyo’ ay nagpapanatili ng sapat na lawak, at nililinaw ng talababa ang leksikal na alternatibo.
- issue: Kasarian ng בנים
  choice: mga anak na lalaki
  alternative: mga anak
  rationale: Tahasan ang panlalaking maramihang anyo sa Hebreo; hindi ito ginawang pangkalahatang katawagan nang walang pahiwatig sa teksto.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang mga gitling sa paligid ng appositive na ‘ang kapulungan ni Yahweh’ upang luminaw na ang buong Israel ang tinutukoy na kapulungan. Iniwasan ang sobrang literal at di-likas na ‘hanapin ang mga utos,’ ngunit pinanatili ang masidhing diwa ng דרשׁ sa ‘pagsikapang sundin.’
