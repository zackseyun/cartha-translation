  text: וַ/יִּתֵּ֣ן דָּוִ֣יד לִ/שְׁלֹמֹ֣ה בְנ֡/וֹ אֶת תַּבְנִ֣ית הָ/אוּלָם֩ וְֽ/אֶת בָּ֨תָּ֜י/ו וְ/גַנְזַכָּ֧י/ו וַ/עֲלִיֹּתָ֛י/ו וַ/חֲדָרָ֥י/ו הַ/פְּנִימִ֖ים וּ/בֵ֥ית הַ/כַּפֹּֽרֶת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/011.yaml
  text: Then David gave to Solomon his son the plan of the portico[a], its houses, its treasuries, its upper rooms, its inner chambers, and the house of the mercy seat.
translation:
  language: tl
  text: Pagkatapos, ibinigay ni David kay Solomon na kanyang anak ang plano ng bulwagan sa pasukan, ng mga gusali nito, ng mga silid-yaman nito, ng mga silid nito sa itaas, ng mga silid nito sa loob, at ng silid ng luklukan ng awa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “silid ng takip na pantubos.” Ang salitang Hebreo na כַּפֹּרֶת ay tumutukoy sa takip ng kaban na nasa Kabanal-banalang Lugar.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: Pagkatapos, ibinigay ni David
  rationale: Isinusulong ng waw-consecutive ang salaysay; likas sa modernong Tagalog ang “Pagkatapos” upang ipakita ang kasunod na kilos.
- source_word: תַּבְנִית
  choice: plano
  rationale: Sa konteksto ng pagtatayo ng templo, tumutukoy ito sa itinakdang huwaran o disenyong pang-arkitektura; malinaw at natural ang “plano.”
- source_word: הָאוּלָם
  choice: bulwagan sa pasukan
  rationale: Ang אוּלָם ay pasukan o maluwang na bulwagang nasa harap ng isang malaking gusali. Mas madaling maunawaan ang pariralang ito kaysa sa teknikal na “portiko.”
- source_word: בָּתָּיו
  choice: mga gusali nito
  rationale: Bagaman karaniwang nangangahulugang “mga bahay,” sa planong pangtemplo ay tumutukoy ito sa mga yunit o gusaling bahagi ng kabuuang estruktura.
- source_word: גַנְזַכָּיו
  choice: mga silid-yaman nito
  rationale: Tumutukoy ito sa mga silid na imbakan ng mahahalagang bagay o mga bagay na itinalaga para sa templo.
- source_word: עֲלִיֹּתָיו
  choice: mga silid nito sa itaas
  rationale: Tuwirang ipinahahayag ang mga silid o bahagi ng gusali na nasa itaas nang hindi ipinapalagay na buong palapag ang tinutukoy.
- source_word: חֲדָרָיו הַפְּנִימִים
  choice: mga silid nito sa loob
  rationale: Pinananatili nito ang kahulugan ng mga panloob na silid nang hindi ginagawang pasukdol na “pinakaloob,” na hindi tahasang nasa Hebreo.
- source_word: בֵית הַכַּפֹּרֶת
  choice: silid ng luklukan ng awa
  rationale: Ang literal na “bahay ng kapporet” ay tumutukoy sa silid na kinalalagyan ng כַּפֹּרֶת, ang takip ng kaban. Ginamit ang kinagawiang katawagang “luklukan ng awa,” habang nililinaw sa talababa ang pisikal at alternatibong kahulugan.
theological_decisions:
- issue: Pagsasalin sa כַּפֹּרֶת bilang terminong pan-santuwaryo
  choice: luklukan ng awa
  alternative: takip na pantubos; takip ng kaban
  rationale: Pinananatili ng “luklukan ng awa” ang kinikilalang terminong panrelihiyon, ngunit hindi ikinukubli na ang salitang Hebreo ay tumutukoy sa takip ng kaban at maaari ring isaling “takip na pantubos.” Inilalahad ang alternatibo sa talababa upang hindi lutasin nang palihim ang leksikal at teolohikal na saklaw nito.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Gumamit ng mga karaniwang salitang pang-arkitektura at iniwasan ang labis na teknikal o makalumang pananalita. Inilagay ang pananda ng talababa pagkatapos ng “luklukan ng awa,” ang mismong pariralang ipinapaliwanag nito.
