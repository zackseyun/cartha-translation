base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/007.yaml
  text: And I will establish his kingdom forever[a], if he is strong to do my commandments and my judgments[c][b], as at this day.
translation:
  language: tl
  text: At patatatagin ko ang kanyang kaharian magpakailanman[a], kung magpakatatag siya sa pagtupad ng aking mga utos at mga tuntunin[b], gaya ng ginagawa niya ngayon.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “pagtitibayin ko” o “pananatilihin kong matatag” ang kanyang kaharian.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “kung mananatili siyang matatag” o “kung maninindigan siya” sa pagtupad ng aking mga utos at mga tuntunin.
    reason: lexical_alternative
  - marker: c
    text: Sa Hebreo, “gaya sa araw na ito”; ibig sabihin, gaya ng ginagawa niya ngayon.
    reason: cultural_note
lexical_decisions:
- source_word: וַהֲכִינוֹתִי
  choice: At patatatagin ko
  rationale: Ang Hiphil ng כון ay tumutukoy sa pagpapapanatag o pagpapatibay. Likas sa konteksto ng kaharian ang “patatatagin” at naipapakita nito ang diwa ng paggawa ritong matibay.
- source_word: מַלְכוּתוֹ
  choice: ang kanyang kaharian
  rationale: Maaaring tumukoy ang מַלְכוּת sa paghahari, pagiging hari, o kaharian. Ang “kaharian” ay malinaw at sapat na malawak para sa konteksto ng pangmatagalang dinastiya.
- source_word: עַד לְעוֹלָם
  choice: magpakailanman
  rationale: Ipinahahayag ng parirala ang walang-hanggang pagpapatuloy; dignified at karaniwang salin sa modernong Filipino ang “magpakailanman.”
- source_word: אִם
  choice: kung
  rationale: Tuwirang naghahayag ng kondisyon ang אִם, kaya pinananatili ng “kung” ang kondisyunal na puwersa ng pangako.
- source_word: יֶחֱזַק
  choice: magpakatatag siya
  rationale: Ipinahihiwatig ng חזק ang pagiging matatag at determinado. Ang “magpakatatag” ay natural sa Filipino at pinananatili ang aktibong paninindigan sa pagsunod.
- source_word: לַעֲשׂוֹת
  choice: sa pagtupad
  rationale: Literal na “gawin” ang עשה, ngunit sa Filipino, “tuparin ang mga utos at tuntunin” ang natural na katumbas na hindi binabago ang kahulugan.
- source_word: מִצְוֺתַי
  choice: aking mga utos
  rationale: Malinaw at natural na katumbas ng covenantal na מִצְוֹת ang “mga utos.”
- source_word: וּמִשְׁפָּטַי
  choice: at mga tuntunin
  rationale: Maaaring mangahulugan ang מִשְׁפָּטִים ng mga hatol, batas, o tuntunin. Sa konteksto ng pagsunod, malinaw ang “mga tuntunin” habang nananatili ang legal na diwa.
- source_word: כַּיּוֹם הַזֶּה
  choice: gaya sa araw na ito
  rationale: Malapit ito sa idyomang Hebreo at tumutukoy sa kasalukuyang kalagayan o ginagawa ni Solomon, nang hindi isinasama sa pangunahing teksto ang ipinahihiwatig lamang ng konteksto.
theological_decisions:
- issue: Ang pagiging kondisyunal ng pangako tungkol sa kaharian ni Solomon
  choice: Pinanatili ang malinaw na kondisyong “kung magpakatatag siya.”
  alternative: Gawing pangkalahatang paglalarawan lamang ito sa ugali ni Solomon at palabuin ang kondisyon.
  rationale: Malinaw na nagpapasok ng kondisyon ang אִם. Dapat panatilihin ang tensiyong teolohikal sa halip na itugma nang sapilitan sa mga bahaging naglalahad ng walang-kondisyong aspekto ng pangako kay David.
translation_notes:
  register: Modernong Filipino na may marangal na himig. Ginamit ang “patatatagin,” “magpakatatag,” at “mga tuntunin” upang maging natural sa karaniwang mambabasa habang nananatiling malapit sa larawang leksikal at legal na tono ng Hebreo.
