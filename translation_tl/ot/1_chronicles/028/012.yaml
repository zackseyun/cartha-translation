  text: וְ/תַבְנִ֗ית כֹּל֩ אֲשֶׁ֨ר הָיָ֤ה בָ/ר֨וּחַ֙ עִמּ֔/וֹ לְ/חַצְר֧וֹת בֵּית יְהוָ֛ה וּ/לְ/כָל הַ/לְּשָׁכ֖וֹת סָבִ֑יב לְ/אֹֽצְרוֹת֙ בֵּ֣ית הָ/אֱלֹהִ֔ים וּ/לְ/אֹצְר֖וֹת הַ/קֳּדָשִֽׁים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/012.yaml
  text: 'and the plan of all that was in the Spirit with him: for the courts of the house of Yahweh[a], for all the surrounding chambers, for the treasuries of the house of God, and for the treasuries of the holy things.'
translation:
  language: tl
  text: at ang plano ng lahat ng bagay na taglay niya sa pamamagitan ng Espiritu[a]—para sa mga looban ng bahay ni Yahweh, para sa lahat ng silid sa palibot, para sa mga silid-imbakan ng bahay ng Diyos, at para sa mga silid-imbakan ng mga banal na bagay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “lahat ng bagay na nasa kaniyang espiritu,” ibig sabihin, ang nasa sariling isip o kalooban ni David.
    reason: alternative_reading
lexical_decisions:
- source_word: תַבְנִית
  choice: plano
  rationale: Sa konteksto ng pagtatayo ng templo, tumutukoy ito sa balangkas o disenyong susundin; natural at malinaw sa modernong Filipino ang “plano.”
- source_word: כֹּל אֲשֶׁר
  choice: lahat ng
  rationale: Pinananatili nito ang saklaw at kabuuang ipinahihiwatig ng parirala nang hindi nagiging mabigat sa Filipino.
- source_word: הָיָה בָרוּחַ עִמּוֹ
  choice: nasa Espiritu na kasama niya
  rationale: Malapit ito sa di-pangkaraniwang anyo ng Hebreo at pinananatiling bukas ang pangunahing pagbasa na tumutukoy sa banal na Espiritu, habang inilalahad sa talababa ang posibilidad na sariling espiritu o kalooban ni David ang tinutukoy.
- source_word: לְחַצְרוֹת
  choice: para sa mga looban
  rationale: Ang “looban” ay malinaw na tawag sa mga court ng kompleks ng templo.
- source_word: בֵּית יְהוָה
  choice: bahay ni Yahweh
  rationale: Pinananatili ng “bahay” ang metapora at paralelismo ng Hebreo, at ang personal na pangalang יהוה ay isinasalin bilang “Yahweh.”
- source_word: לְּשָׁכוֹת סָבִיב
  choice: mga silid sa palibot
  rationale: Likas sa Filipino at tumpak para sa mga kuwarto o silid na nakapaligid sa gusali.
- source_word: אֹצְרוֹת
  choice: mga imbakan-yaman / mga imbakan
  rationale: Ang salita ay tumutukoy sa mga treasury o silid-imbakan. Ginamit ang “imbakan-yaman” para sa bahay ng Diyos at mas payak na “imbakan” bago ang “mga banal na bagay” upang maiwasan ang mabigat na pag-uulit.
- source_word: בֵּית הָאֱלֹהִים
  choice: bahay ng Diyos
  rationale: Tuwirang pinananatili ang pananalita ng Hebreo at ang paralelismo sa “bahay ni Yahweh.”
- source_word: הַקֳּדָשִׁים
  choice: mga banal na bagay
  rationale: Ito ang pinakadirektang salin at hindi nito nililimitahan ang tinutukoy sa mga handog lamang.
theological_decisions:
- issue: Kahulugan ng בָרוּחַ עִמּוֹ
  choice: “nasa Espiritu na kasama niya,” na malamang ay tumutukoy sa banal na Espiritu
  alternative: “nasa kaniyang espiritu,” ibig sabihin, nasa sariling isip o kalooban ni David
  rationale: Ang konteksto ng mga planong ipinaunawa ng Diyos, lalo na sa talata 19, ay pumapabor sa banal na pinagmulan. Gayunman, tunay na maaaring basahin ang Hebreo bilang pagtukoy sa sariling espiritu o kalooban ni David, kaya hindi inalis ang alternatibo at inilagay ito sa talababa.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Pinanatili ang “bahay” sa halip na “templo” upang masalamin ang Hebreong paralelismo, at ginamit ang “Yahweh” para sa banal na pangalan. Ang bahagyang di-pangkaraniwang “nasa Espiritu na kasama niya” ay sinadyang panatilihin upang huwag burahin ang ambiguwidad ng pinagmulan.
