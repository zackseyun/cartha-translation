  naturalness: Mas natural at malinaw sa modernong Filipino ang “lahat ng bagay na taglay niya sa pamamagitan ng Espiritu” kaysa “lahat ng nasa Espiritu na kasama niya.” Pinag-isa rin ang salin ng אֹצְרוֹת upang mapanatili ang paralelismo ng Hebreo.
