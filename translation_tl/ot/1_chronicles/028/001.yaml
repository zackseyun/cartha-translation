- from: 'Tinipon ni David sa Jerusalem ang lahat ng pinuno ng Israel: ang mga pinuno ng mga lipi, ang mga pinuno ng mga pangkat na naglilingkod sa hari, ang mga kumander ng libu-libo at ng daan-daan, at ang mga namamahala sa lahat ng ari-arian at mga alagang hayop ng hari at ng kanyang mga anak. Tinipon din niya ang mga opisyal sa palasyo[a], ang mga bayaning mandirigma, at ang lahat ng magigiting na mandirigma.'
  to: 'Tinipon ni David sa Jerusalem ang lahat ng pinuno ng Israel: ang mga pinuno ng mga lipi, ang mga pinuno ng mga pangkat na naglilingkod sa hari, ang mga kumander ng libu-libo at ng daan-daan, ang mga namamahala sa lahat ng ari-arian at alagang hayop ng hari at ng kanyang mga anak, kasama ang mga opisyal sa palasyo[a], ang mga makapangyarihang mandirigma, at bawat magiting na mandirigma.'
