source:
  edition: WLC
  text: וַ/יַּקְהֵ֣ל דָּוִ֣יד אֶת כָּל שָׂרֵ֣י יִשְׂרָאֵ֡ל שָׂרֵ֣י הַ/שְּׁבָטִ֣ים וְ/שָׂרֵ֣י הַ/מַּחְלְק֣וֹת הַ/מְשָׁרְתִ֪ים אֶת הַ/מֶּ֟לֶךְ וְ/שָׂרֵ֣י הָ/אֲלָפִ֣ים וְ/שָׂרֵ֣י הַ/מֵּא֡וֹת וְ/שָׂרֵ֣י כָל רְכוּשׁ וּ/מִקְנֶה֩ לַ/מֶּ֨לֶךְ וּ/לְ/בָנָ֜י/ו עִם הַ/סָּרִיסִ֧ים וְ/הַ/גִּבּוֹרִ֛ים וּֽ/לְ/כָל גִּבּ֥וֹר חָ֖יִל אֶל יְרוּשָׁלִָֽם־־־־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/001.yaml
  text: 'Then David assembled at Jerusalem all the leaders of Israel: the leaders of the tribes[a], the leaders of the divisions that served the king, the commanders of thousands and of hundreds, and the leaders over all the property and livestock belonging to the king and to his sons, together with the officials, the mighty men, and every mighty man of valor.'
translation:
  language: tl
  text: 'Tinipon ni David sa Jerusalem ang lahat ng pinuno ng Israel: ang mga pinuno ng mga lipi, ang mga pinuno ng mga pangkat na naglilingkod sa hari, ang mga kumander ng libu-libo at ng daan-daan, ang mga namamahala sa lahat ng ari-arian at alagang hayop ng hari at ng kanyang mga anak, kasama ang mga opisyal sa palasyo[a], ang mga makapangyarihang mandirigma, at bawat magiting na mandirigma.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga eunuko.” Maaaring tumukoy ang salitang Hebreo sa mga lalaking kinapon o, sa mas malawak na diwa, sa mga opisyal ng palasyo.
    reason: Pinananatili ang leksikal na kalabuan ng הַסָּרִיסִים nang hindi ipinapalagay kung literal na mga eunuko ang tinutukoy rito.
lexical_decisions:
- source_word: וַיַּקְהֵל
  choice: Tinipon
  rationale: Ipinahahayag ng Hiphil na sadyang ipinatawag at pinagsama ni David ang isang pormal na kapulungan; natural at malinaw sa modernong Tagalog ang “tinipon.”
- source_word: שָׂרֵי יִשְׂרָאֵל
  choice: mga pinuno ng Israel
  rationale: Malawak ang saklaw ng שַׂר at kabilang sa kasunod na talaan ang mga pinunong panlipi, administratibo, at militar; “mga pinuno” ang angkop na panlahat na katawagan.
- source_word: שָׂרֵי הַשְּׁבָטִים
  choice: mga pinuno ng mga lipi
  rationale: Tuwirang ipinapakita ang ugnayang konstruktibo at gumagamit ng karaniwang salitang “lipi” para sa mga tribo ng Israel.
- source_word: הַמַּחְלְקוֹת הַמְשָׁרְתִים אֶת הַמֶּלֶךְ
  choice: mga pangkat na naglilingkod sa hari
  rationale: Ang מַחְלְקוֹת ay mga organisadong pangkat o dibisyon, at ang participle ay nagsasaad ng patuloy na paglilingkod sa hari.
- source_word: שָׂרֵי הָאֲלָפִים וְשָׂרֵי הַמֵּאוֹת
  choice: mga kumander ng libu-libo at ng daan-daan
  rationale: Militar-administratibo ang konteksto, kaya ang “kumander” ay mas tiyak dito kaysa “pinuno”; pinananatili ang mga yunit ng Hebreo nang hindi ipinapalagay na laging eksaktong bilang ang mga ito.
- source_word: רְכוּשׁ וּמִקְנֶה
  choice: ari-arian at mga alagang hayop
  rationale: Ang רְכוּשׁ ay mga pag-aari o kayamanan, samantalang ang מִקְנֶה ay tumutukoy sa mga hayop na pag-aari; malinaw sa karaniwang mambabasa ang tambalang salin.
- source_word: לַמֶּלֶךְ וּלְבָנָיו
  choice: ng hari at ng kanyang mga anak
  rationale: Sa konteksto, ipinahahayag ng ל ang pagmamay-ari o kaugnayan; sapat at natural sa Tagalog ang pang-ukol na “ng.”
- source_word: הַסָּרִיסִים
  choice: mga opisyal sa palasyo
  rationale: Maaaring tumukoy ang סָרִיס sa literal na mga eunuko o sa mga opisyal ng maharlikang sambahayan. Sa listahang administratibo, malinaw ang tungkulin sa saling ito, habang pinananatili sa talababa ang literal na posibilidad.
- source_word: הַגִּבּוֹרִים
  choice: mga bayaning mandirigma
  rationale: Sa Mga Cronica, madalas itong tumukoy sa mga kilalang mandirigma ni David; naipapahayag ng “bayaning mandirigma” ang lakas at natatanging katayuan nila.
- source_word: כָל גִּבּוֹר חָיִל
  choice: lahat ng magigiting na mandirigma
  rationale: Pinagsasama ng parirala ang lakas o katayuan ng גִּבּוֹר at ang tapang o kakayahang militar ng חַיִל; natural at matapat sa diwa ang salin.
