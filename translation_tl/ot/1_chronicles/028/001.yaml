translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Hinati sa dalawang pangungusap ang mahabang talaan upang maging malinaw, at inulit ang “Tinipon din niya” bilang likas na panandang pandiskurso. Inilagay ang talababa sa “mga opisyal sa palasyo,” ang mismong salin ng הַסָּרִיסִים, sa halip na sa “mga lipi.”
