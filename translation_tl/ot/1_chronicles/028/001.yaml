  - severity: low
    issue: Hindi gaanong napapanatili ang pagkakaiba ng dalawang katawagang militar
    rationale: Ang “mga bayaning mandirigma” at “lahat ng magigiting na mandirigma” ay kapwa maaaring maging katanggap-tanggap, ngunit ang binagong anyo ay mas tuwirang inihihiwalay ang kolektibong הַגִּבּוֹרִים mula sa כָל גִּבּוֹר חָיִל.
