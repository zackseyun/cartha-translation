  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mga kagamitang gagamitin” upang maipakita ang layunin ng mga bagay sa eliptikal na talaan, habang pinanatili sa talababa ang literal na pag-uulit at ang saklaw ng posibleng kahulugan nito.
