  text: the weight of the gold for all the articles of every kind of service[a], and the weight of the silver for all the articles of every kind of service.
translation:
  language: tl
  text: ang timbang ng ginto para sa lahat ng kagamitan sa bawat uri ng paglilingkod[a], at ang timbang ng pilak para sa lahat ng kagamitan sa bawat uri ng paglilingkod.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo, inuulit ang “paglilingkod”: “paglilingkod at paglilingkod.” Isa itong distributibong paraan ng pagsasabi na maaaring mangahulugang “para sa bawat uri ng paglilingkod” o “para sa bawat gamit.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: זָהָב
  choice: ginto
  rationale: Karaniwang tawag sa materyal; natural sa Tagalog na gamitin ito nang walang pantukoy sa pariralang nagsasaad ng timbang.
- source_word: בְּמִשְׁקָל / מִשְׁקָל
  choice: ang timbang
  rationale: Sa eliptikal at talaang anyo ng talata, ipinahihiwatig nito ang itinakdang timbang ng materyal para sa mga kagamitan.
- source_word: כְּלֵי
  choice: mga kagamitan
  rationale: Malawak at natural na salitang sumasaklaw sa iba't ibang bagay na ginagamit sa paglilingkod, hindi lamang mga sisidlan o kasangkapan.
- source_word: עֲבוֹדָה
  choice: paglilingkod
  rationale: Ang konteksto ay paglilingkod na kaugnay ng templo; pinananatili ng salitang ito ang kultiko at praktikal na diwa nang hindi nagpapasok ng denominasyonal na pakahulugan.
- source_word: עֲבוֹדָה וַעֲבוֹדָה
  choice: bawat uri ng paglilingkod
  rationale: Ang pag-uulit sa Hebreo ay distributibo. Likas itong ipinahahayag sa modernong Tagalog bilang pagkakaiba-iba ng mga uri o gamit ng paglilingkod.
- source_word: כֶּסֶף
  choice: pilak
  rationale: Tuwirang tawag sa materyal at kahanay ng ginto sa talaan.
- source_word: לְכָל / לְכֹל
  choice: para sa lahat
  rationale: Pinananatili ang saklaw ng parirala, samantalang ang kasunod na distributibong pag-uulit ay isinalin bilang 'bawat uri.'
