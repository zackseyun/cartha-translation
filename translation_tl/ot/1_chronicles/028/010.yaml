source:
  edition: WLC
  text: רְאֵ֣ה עַתָּ֗ה כִּֽי יְהוָ֛ה בָּ֧חַר בְּ/ךָ֛ לִ/בְנֽוֹת בַּ֥יִת לַ/מִּקְדָּ֖שׁ חֲזַ֥ק וַ/עֲשֵֽׂה׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/010.yaml
  text: See now[a], for Yahweh has chosen you to build a house for the sanctuary. Be strong[b], and do it.
translation:
  language: tl
  text: Bigyang-pansin mo ngayon[a], sapagkat pinili ka ni Yahweh upang magtayo ng isang bahay para sa santuwaryo[b]. Magpakatatag ka at gawin mo ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Isaalang-alang mo ngayon” o “Mag-ingat ka ngayon.” Ang utos ay panawagang magbigay ng masusing pansin, hindi lamang tumingin.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “isang bahay para sa santuwaryo.” Malamang na tumutukoy ito sa gusaling itatayo bilang banal na dako, samakatuwid ay sa templo.
    reason: lexical_alternative
lexical_decisions:
- source_word: רְאֵה עַתָּה
  choice: Bigyang-pansin mo ngayon
  rationale: Ang pautos na רְאֵה ay idyomatikong panawagan upang magbigay-pansin at magnilay, hindi lamang upang tumingin. Pinananatili ng “ngayon” ang diin ng עַתָּה sa agarang pananagutan ni Solomon.
- source_word: כִּי
  choice: sapagkat
  rationale: 'Ipinakikilala rito ng כִּי ang dahilan ng panawagan: dapat magbigay-pansin si Solomon dahil siya ang pinili ni Yahweh.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ng “Yahweh” ang personal na pangalang banal sa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: בָּחַר בְּךָ
  choice: pinili ka
  rationale: Ipinahahayag ng perpektong anyo ang natapos nang pagpili ng Diyos na may bisa sa kasalukuyang atas kay Solomon.
- source_word: לִבְנוֹת בַּיִת לַמִּקְדָּשׁ
  choice: upang magtayo ng isang bahay para maging santuwaryo
  rationale: Pinananatili ang dalawang konsepto ng Hebreo—“bahay” at “santuwaryo”—habang nililinaw sa natural na Tagalog na ang bahay na itatayo ang nakatalagang maging banal na dako.
- source_word: חֲזַק
  choice: Magpakatatag ka
  rationale: Ipinahahayag nito ang lakas ng loob, katatagan, at matibay na pasiyang hinihingi sa konteksto ng pag-aatas.
- source_word: וַעֲשֵׂה
  choice: at gawin mo ito
  rationale: Ang malawak na pandiwang עשה ay tumutukoy rito sa pagsasakatuparan ng atas na pagtatayo; natural na ipinahahayag ito sa Tagalog sa pamamagitan ng “gawin mo ito.”
theological_decisions:
- issue: Pagtutumbas sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Pangalan mismo ang nasa Hebreo, kaya pinananatili itong personal na pangalan at hindi pinapalitan ng titulong “PANGINOON.”
- issue: Kung isasalin ang בַּיִת לַמִּקְדָּשׁ bilang “templo” lamang
  choice: isang bahay para maging santuwaryo
  alternative: isang templo; isang bahay para sa santuwaryo
  rationale: Ang “templo” lamang ay magpapalabo sa dalawang magkaibang pangngalan ng Hebreo. Ang napiling anyo ay natural sa Tagalog at pinananatili ang larawang “bahay” at ang banal na layunin nito.
- issue: Saklaw ng utos na חֲזַק
  choice: Magpakatatag ka
  alternative: Magpakalakas ka; Lakasan mo ang iyong loob
  rationale: Hindi nililimitahan ng Hebreo ang utos sa pisikal na lakas o sa tapang lamang; ang “magpakatatag” ay nagpapanatili sa mas malawak na diwa ng lakas at matibay na pagpapasiya.
translation_notes:
  register: Makabago ngunit marangal na Filipino ang ginamit. Ang “Bigyang-pansin,” “magpakatatag,” at “santuwaryo” ay madaling maunawaan habang angkop sa taimtim na konteksto ng pag-aatas kay Solomon. Iniwasan ang sobrang literal na pariralang maaaring magpahiwatig na hiwalay ang bahay sa santuwaryo.
