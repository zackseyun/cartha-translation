base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/006.yaml
  text: And he said to me[a], ‘Solomon your son—he will build my house and my courts, for I have chosen him for myself as a son, and I will be to him as a father.’
translation:
  language: tl
  text: At sinabi niya sa akin, “Ang anak mong si Solomon—siya ang magtatayo ng aking bahay at ng aking mga looban, sapagkat pinili ko siyang maging anak ko[a], at ako ay magiging ama niya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, sa mas literal na paraan, “pinili ko siya para sa akin bilang anak.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר לִי
  choice: At sinabi niya sa akin
  rationale: Tuwirang inilalarawan ang nakaraang pananalita at ang di-tuwirang layon na ‘sa akin.’
- source_word: שְׁלֹמֹה בִנְךָ הוּא
  choice: Ang anak mong si Solomon—siya
  rationale: Natural sa modernong Tagalog ang ayos na ‘ang anak mong si Solomon,’ habang pinananatili ng ‘siya’ at ng gitling ang diin ng hiwalay na panghalip na הוּא.
- source_word: יִבְנֶה בֵיתִי
  choice: ang magtatayo ng aking bahay
  rationale: Pinanatili ang literal at teolohikal na mahalagang ‘bahay’ sa halip na ipakahulugang agad na ‘templo.’
- source_word: וַחֲצֵרוֹתָי
  choice: at ng aking mga bulwagan
  rationale: Sa konteksto ng templo, tumutukoy ito sa mga nakapaloob na court o looban; ang ‘mga bulwagan’ ay marangal ngunit maaari ring maunawaan bilang mga bahagi ng kompleks.
- source_word: כִּי בָחַרְתִּי בוֹ
  choice: sapagkat pinili ko siya
  rationale: Malinaw na ipinapakita ang dahilan at ang natapos ngunit nananatiling may bisa na pagpili.
- source_word: לִי לְבֵן
  choice: para sa akin bilang anak
  rationale: Pinananatili ang dalawang lamed at ang bahagyang di-karaniwang pormulang tipan, sa halip na lubusang gawing simpleng pagmamay-ari.
- source_word: וַאֲנִי אֶהְיֶה לוֹ לְאָב
  choice: at ako ay magiging ama niya
  rationale: Natural at malinaw sa Tagalog, habang tapat na ipinahahayag ang relasyong ama-anak ng pormulang Hebreo.
theological_decisions:
- issue: Ang wikang ama-anak sa kaugnayan ng Diyos kay Solomon
  choice: Pinili ko siya para sa akin bilang anak, at ako ay magiging ama niya
  alternative: Pinili ko siyang maging anak ko, at magiging ama niya ako
  rationale: Pinananatili ang tuwirang wika ng maharlikang tipan nang hindi ito pinahihina bilang tungkulin lamang o nilalagyan ng mga konklusyong lampas sa agarang konteksto.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang ‘bahay’ upang mapanatili ang larawan sa Hebreo. Ang ‘para sa akin bilang anak’ ay sinadyang bahagyang pormal upang mapanatili ang pormulang tipan at tunay na tensiyon ng orihinal.
