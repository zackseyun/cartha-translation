  text: וַ/יֹּ֨אמֶר דָּוִ֜יד לִ/שְׁלֹמֹ֣ה בְנ֗/וֹ חֲזַ֤ק וֶ/אֱמַץ֙ וַ/עֲשֵׂ֔ה אַל תִּירָ֖א וְ/אַל תֵּחָ֑ת כִּי֩ יְהוָ֨ה אֱלֹהִ֤ים אֱלֹהַ/י֙ עִמָּ֔/ךְ לֹ֤א יַרְפְּ/ךָ֙ וְ/לֹ֣א יַֽעַזְבֶ֔/ךָּ עַד לִ/כְל֕וֹת כָּל מְלֶ֖אכֶת עֲבוֹדַ֥ת בֵּית יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/020.yaml
  text: And David said to Solomon his son[a], “Be strong and courageous, and do it. Do not fear or be dismayed, for Yahweh God, my God, is with you. He will not fail you or forsake you until all the work for the service of the house of Yahweh is finished.”
translation:
  language: tl
  text: Sinabi ni David sa anak niyang si Solomon, “Magpakatatag ka at lakasan mo ang iyong loob, at gawin mo ito. Huwag kang matakot o panghinaan ng loob, sapagkat kasama mo si Yahweh na Diyos, ang aking Diyos. Hindi ka niya bibiguin[a] o pababayaan hanggang sa matapos ang lahat ng gawain para sa paglilingkod sa bahay ni Yahweh.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Hindi ka niya bibitawan”; ang pandiwang Hebreo ay maaaring tumukoy sa hindi pagluluwag o pagbitaw sa pagsuporta sa isang tao.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲזַק וֶאֱמַץ
  choice: Magpakatatag ka at lakasan mo ang iyong loob
  rationale: 'Pinananatili ang dalawang magkaugnay na pautos: maging matatag at magkaroon ng tapang o matibay na loob. Natural at marangal ang tambalang ito sa makabagong Filipino.'
- source_word: וַעֲשֵׂה
  choice: at gawin mo ito
  rationale: Tuwirang pautos na tumutukoy sa gawaing pagtatayo at paglilingkod sa templo na nasa konteksto.
- source_word: אַל תִּירָא וְאַל תֵּחָת
  choice: Huwag kang matakot o panghinaan ng loob
  rationale: Ang ירא ay takot, samantalang ang חתת sa ganitong pormula ay pagkawala o pagbagsak ng loob; malinaw na pinananatili ang dalawang diwa.
- source_word: יְהוָה אֱלֹהִים אֱלֹהַי
  choice: si Yahweh na Diyos, ang aking Diyos
  rationale: Pinananatili ang personal na pangalan na Yahweh at ang appositional na pag-uulit na nagbibigay-diin sa pagkilala ni David sa kanya bilang kanyang Diyos.
- source_word: עִמָּךְ
  choice: kasama mo
  rationale: Natural na Filipino para sa nominal clause na nagsasaad ng kasalukuyang presensiya at pagtulong ng Diyos.
- source_word: לֹא יַרְפְּךָ
  choice: Hindi ka niya bibiguin
  rationale: Ipinahahayag ng Hiphil ng רפה ang hindi pagluluwag o pagbitaw sa suporta. Ang 'hindi ka bibiguin' ay natural sa pares nito sa עזב, habang inilalagay sa talababa ang mas kongkretong alternatibo.
- source_word: וְלֹא יַעַזְבֶךָּ
  choice: o pababayaan
  rationale: Ang 'pababayaan' ay natural at may sapat na bigat para sa katiyakang hindi iiwan o tatalikuran si Solomon.
- source_word: עַד לִכְלוֹת כָּל מְלֶאכֶת עֲבוֹדַת בֵּית יְהוָה
  choice: hanggang sa matapos ang lahat ng gawain para sa paglilingkod sa bahay ni Yahweh
  rationale: Maayos na inilalahad sa Filipino ang masinsing construct chain habang kapuwa pinananatili ang 'gawain' at 'paglilingkod,' at ang bahay bilang tawag sa templo.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo; ang 'Yahweh' ay tuwirang transliterasyon at hindi ito pinapalitan ng isang titulo.
- issue: Saklaw ng pangakong presensiya hanggang matapos ang gawain
  choice: Pinanatili ang 'hanggang sa' nang hindi ipinahihiwatig na aalis ang Diyos pagkatapos
  alternative: Paraprasang tahasang nagsasabing mananatili rin ang Diyos pagkatapos
  rationale: Ang עַד ay tumutukoy sa tiyak na panahong kritikal sa atas, ngunit hindi nito kinakailangang limitahan ang presensiya ng Diyos pagkatapos. Hindi dinaragdagan ng salin ang hindi tahasang sinabi.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang 'bahay ni Yahweh' upang mapanatili ang metapora ng בֵּית, bagaman malinaw sa konteksto na tumutukoy ito sa templo. Ang lahat ng panghalip kay Yahweh ay nasa karaniwang maliit na titik ayon sa normal na ortograpiyang Filipino.
