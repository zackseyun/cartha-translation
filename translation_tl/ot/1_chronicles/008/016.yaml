  text: and Michael, Ishpah, and Joha, the sons of Beriah.
translation:
  language: tl
  text: at sina Micael, Ispa, at Joha, mga anak na lalaki ni Beria.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/מִיכָאֵל
  choice: at sina Micael
  rationale: Pangngalang pantangi na may pang-ugnay. Ginamit ang “sina” upang likas na ipakilala sa Filipino ang talaan ng maraming pangalan; ang “Micael” ay nakaugat sa anyong Hebreo at umaayon sa karaniwang baybay-Filipino.
- source_word: וְ/יִשְׁפָּה
  choice: Ispa
  rationale: Isinalin sa baybay na madaling bigkasin sa modernong Filipino, na kumakatawan sa Hebreong Yishpah/Ishpah nang hindi kinakailangang panatilihin ang titik h na hindi binibigkas.
- source_word: וְ/יוֹחָא
  choice: Joha
  rationale: Pinanatili ang nakikilalang anyo ng pangalan habang inililipat sa ortograpiyang madaling basahin sa Filipino.
- source_word: בְּנֵי
  choice: mga anak na lalaki ni
  rationale: Sa kontekstong talaangkanan, tuwirang tumutukoy ito sa mga lalaking anak, kaya mas tiyak kaysa sa pangkalahatang “mga anak” o “mga inapo.”
- source_word: בְרִיעָה
  choice: Beria
  rationale: Baybay-Filipino ng pangalang Hebreo, na inaalis ang di-kailangang h sa hulihan at pinananatili ang malinaw na pagbigkas.
theological_decisions: []
translation_notes:
  register: Maikli at dignified na estilong talaangkanan. Ang “sina” at “mga anak na lalaki ni” ay natural sa modernong Filipino, habang pinananatili ang eksaktong ugnayang pampamilya sa tekstong Hebreo.
