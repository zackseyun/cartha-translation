lexical_decisions:
- source_word: וּ/זְבַדְיָה
  choice: at sina Zebadias
  rationale: Isinalin ang pang-ugnay na וּ bilang “at.” Ginamit ang “sina” upang likas na ipakilala sa Tagalog ang magkakasunod na pangalan ng mga tao; ang זְבַדְיָה ay tinumbasan ng nakaugaliang anyong Tagalog na “Zebadias.”
- source_word: וַ/עֲרָד
  choice: Arad
  rationale: Ang pang-ugnay ay hindi na hiwalay na inulit dahil malinaw na ang ayos ng talaan; pinanatili ang pangalan bilang “Arad.”
- source_word: וָ/עָדֶר
  choice: at Eder
  rationale: Isinalin ang pang-ugnay bilang “at” bago ang huling pangalan. Ang עָדֶר ay itinumbas na “Eder,” habang ang posibleng anyong “Ader” ay inilagay sa talababa.
