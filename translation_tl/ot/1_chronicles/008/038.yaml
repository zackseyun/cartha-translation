translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang likas na hulma na “May … si” para sa pormulang Hebreo, at pinanatili ang “anak na lalaki” upang maging tiyak ang kasarian sa konteksto ng talaangkanan.
