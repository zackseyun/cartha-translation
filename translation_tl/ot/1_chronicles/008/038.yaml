base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/038.yaml
  text: 'Azel had six sons[a], and these were their names: Azrikam his firstborn, Ishmael, Sheariah, Obadiah, and Hanan. All these were the sons of Azel.'
translation:
  language: tl
  text: 'May anim na anak na lalaki si Azel[a], at ito ang mga pangalan nila: si Azrikam, ang kaniyang panganay, si Ismael, si Seharia, si Obadias, at si Hanan. Lahat sila ay mga anak na lalaki ni Azel.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “Kay Azel ay may anim na anak na lalaki.” Gumagamit ang Hebreo ng pormula sa talaangkanan na nagsasaad ng pagmamay-ari.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְאָצֵל
  choice: May … si Azel
  rationale: Ang לְ sa pormulang pangangkanan ay nagsasaad ng pag-iral o pagmamay-ari. Likas sa modernong Tagalog ang hulma na “May … si Azel,” samantalang pinananatili sa talababa ang mas literal na anyo.
- source_word: שִׁשָּׁה בָנִים
  choice: anim na anak na lalaki
  rationale: Sa talaangkanang ito, ang בָנִים ay tumutukoy sa mga lalaking anak, kaya mas tiyak ito kaysa sa pangkalahatang “mga anak.”
- source_word: וְאֵלֶּה שְׁמוֹתָם
  choice: at ito ang mga pangalan nila
  rationale: Pinananatili nito ang pangmaramihang hulapi ng Hebreo at natural itong pormula ng pagpapakilala ng mga pangalan sa Tagalog.
- source_word: עַזְרִיקָם
  choice: Azrikam
  rationale: Tuwirang transliterasyon ng pangalang Hebreo sa paraang madaling basahin sa Filipino.
- source_word: בֹּכְרוּ
  choice: na kaniyang panganay
  rationale: Tinutukoy ng anyo si Azrikam bilang panganay ni Azel. Ang “kaniyang panganay” ay malinaw at marangal na Tagalog.
- source_word: יִשְׁמָעֵאל
  choice: Ismael
  rationale: Ginamit ang nakaugaliang anyong Filipino ng pangalang ito.
- source_word: שְׁעַרְיָה
  choice: Searias
  rationale: Isina-Filipinong transliterasyon ng pangalang Hebreo, na umaayon sa karaniwang hulma ng mga pangalang biblikal sa Tagalog.
- source_word: עֹבַדְיָה
  choice: Obadias
  rationale: Ginamit ang nakaugaliang anyong Filipino ng pangalang biblikal.
- source_word: חָנָן
  choice: Hanan
  rationale: Tuwirang transliterasyon ng pangalang Hebreo.
- source_word: כָּל־אֵלֶּה בְּנֵי אָצַל
  choice: Lahat sila ay mga anak na lalaki ni Azel
  rationale: Natural na Tagalog na buod ito ng talaan at pinananatili ang tiyak na kahulugan ng בְּנֵי bilang mga lalaking anak.
