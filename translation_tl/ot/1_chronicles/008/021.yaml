base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/021.yaml
  text: Adaiah[a], Beraiah, and Shimrath, the sons of Shimei.
translation:
  language: tl
  text: at sina Adaya, Beraya[a], at Simrat, na mga anak na lalaki ni Simei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang anyong Hebreo ay Beraiah; sa ilang tradisyong Ingles, pinaikli ang pangalan bilang Beria.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲדָיָה
  choice: Adaya
  rationale: Isinalin sa baybay na madaling basahin sa Filipino habang malapit sa tunog ng pangalang Hebreo.
- source_word: בְרָאיָה
  choice: Beraya
  rationale: Pinananatili ang buong anyo ng pangalang Hebreo, kabilang ang tunog na kinakatawan ng panloob na aleph; mas angkop dito ang “Beraya” kaysa sa pinaikling “Beria.”
- source_word: שִׁמְרָת
  choice: Simrat
  rationale: Tuwirang transliterasyon sa makabagong baybay-Filipino; ang shin ay ginawang “s” at ang huling tav ay “t.”
- source_word: בְּנֵי
  choice: mga anak ni
  rationale: Bagaman literal na “mga anak na lalaki ni,” sapat at likas sa talaangkanan ang “mga anak ni,” at hindi kailangang ulitin ang kasarian dahil mga pangalang panlalaki ang nakatala.
- source_word: שִׁמְעִי
  choice: Simei
  rationale: Ginamit ang anyong pamilyar at madaling bigkasin sa Filipino para sa pangalang Hebreo.
- source_word: וַ / וּ / וְ
  choice: at sina …, …, at …
  rationale: Ang paulit-ulit na pang-ugnay sa Hebreo ay likas na ipinahayag sa Filipino sa pamamagitan ng pambungad na “at sina” at “at” bago ang huling pangalan, na nagpapanatili rin sa ugnayan ng talata sa naunang listahan.
theological_decisions: []
translation_notes:
  register: Makabago, marangal, at payak na Filipino. Ginamit ang “sina” para sa talaan ng mga tao at ang gitling na em dash upang malinaw na ipakilala ang kaugnayang pang-angkan. Inilipat ang talababa sa “Beraya,” sapagkat iyon ang pangalang tinutukoy ng paliwanag.
