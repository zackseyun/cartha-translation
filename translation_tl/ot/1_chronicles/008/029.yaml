  text: וּ/בְ/גִבְע֥וֹן יָשְׁב֖וּ אֲבִ֣י גִבְע֑וֹן וְ/שֵׁ֥ם אִשְׁתּ֖/וֹ מַעֲכָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/029.yaml
  text: In Gibeon lived the father of Gibeon[a], and his wife’s name was Maacah.
translation:
  language: tl
  text: Sa Gibeon nanirahan ang ama ng Gibeon[a], at Maaca ang pangalan ng kanyang asawa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “tagapagtatag ng Gibeon” o “pinuno ng Gibeon”; literal sa Hebreo, “ama ng Gibeon.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְ/גִבְעוֹן
  choice: Sa Gibeon
  rationale: Ang בְּ ay locative na “sa,” at hindi kailangang ilantad sa Filipino ang prefixed וּ bilang “at” sa simula ng maikling genealogical notice upang maging natural ang daloy.
- source_word: יָשְׁבוּ
  choice: nanirahan
  rationale: Karaniwang tumutukoy ang ישׁב sa paninirahan o pagtira; ang “nanirahan” ay likas at marangal sa modernong Filipino. Pinananatili rin nito ang anyong maramihan ng pandiwang Hebreo, na maaaring sumaklaw sa ama ng Gibeon at sa sambahayan o grupong kaugnay niya kahit iisang tauhan lamang ang tahasang kasunod na paksa.
- source_word: אֲבִי גִבְעוֹן
  choice: ang ama ng Gibeon
  rationale: Literal itong “ama ng Gibeon.” Maaaring mangahulugan ang “ama” ng tagapagtatag, ninuno, o pinuno ng isang lugar, kaya pinanatili sa pangunahing teksto ang tunay na anyo at inilagay sa talababa ang mga posibleng kahulugan.
- source_word: וְ/שֵׁם אִשְׁתּוֹ
  choice: at ... ang pangalan ng kanyang asawa
  rationale: Natural na Filipino ang hulma na “Maaca ang pangalan ng kanyang asawa,” habang malinaw na napapanatili ang ugnayang pag-aari at ang predikasyon ng Hebreo.
- source_word: מַעֲכָה
  choice: Maaca
  rationale: Isinalin sa karaniwang anyong Filipino ang pangalang Hebreo na מַעֲכָה.
