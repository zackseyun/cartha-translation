base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/040.yaml
  text: The sons of Ulam were mighty men of valor[a], drawers of the bow, and had many sons and grandsons, one hundred and fifty[c][b]. All these were from the sons of Benjamin.
translation:
  language: tl
  text: Ang mga anak ni Ulam ay magigiting na mandirigma at mga mamamana.[a] Marami ang kanilang mga anak at mga apo—150 lahat. Ang lahat ng ito ay mula sa mga anak ni Benjamin.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal, “mga nagbabanat ng busog.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “kabilang sa mga anak ni Benjamin,” ibig sabihin, mga inapo sa lipi ni Benjamin.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ בְנֵי אוּלָם
  choice: Ang mga anak ni Ulam ay
  rationale: Inihahayag ng wayyiqtol ng היה ang kalagayan ng mga anak ni Ulam sa buod na ito ng talaangkanan; natural sa Filipino ang payak na pangungusap na may “ay.”
- source_word: אֲנָשִׁים גִּבֹּרֵי חַיִל
  choice: magigiting na mandirigma
  rationale: Ipinapahayag ng nakaugaliang parirala ang lakas, tapang, at kakayahang pandigma; malinaw at marangal itong katumbas sa kasalukuyang Filipino.
- source_word: דֹּרְכֵי קֶשֶׁת
  choice: mga mamamana
  rationale: Literal na tumutukoy ang parirala sa mga nagbabanat o yumuyuko sa busog, isang idyoma para sa mga bihasa sa paggamit nito. “Mga mamamana” ang natural na katumbas, habang inilalahad sa talababa ang literal na larawan.
- source_word: וּמַרְבִּים בָּנִים וּבְנֵי בָנִים
  choice: Marami ang kanilang mga anak at mga apo
  rationale: Ipinahihiwatig ng Hiphil participle ng רבה ang pagpaparami o pagkakaroon ng maraming supling. Inililipat sa hiwalay na pangungusap para sa malinaw at natural na Filipino nang hindi binabago ang diwa.
- source_word: מֵאָה וַחֲמִשִּׁים
  choice: 150 lahat
  rationale: Ang bilang ay kasunod ng “mga anak at mga apo” at pinakanatural na nauunawaan bilang kabuuang bilang ng dalawang pangkat.
- source_word: כָּל אֵלֶּה מִבְּנֵי בִנְיָמִן
  choice: Ang lahat ng ito ay mula sa mga anak ni Benjamin
  rationale: Pinananatili ang pormal na pananalita ng talaangkanan at ang lawak ng gamit ng מן, na maaaring magpahiwatig ng pinagmulan o pagkabilang sa angkan.
theological_decisions:
- issue: Ugnayan ng lahat ng binanggit kay Benjamin
  choice: mula sa mga anak ni Benjamin
  alternative: kabilang sa mga anak ni Benjamin; mga inapo ni Benjamin
  rationale: Hindi ginagawang mas tiyak kaysa sa Hebreo kung ang diin ay tuwirang pinagmulan o pagkabilang sa lipi; kapuwa posibilidad ay kinikilala sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino na angkop sa talaangkanan. Ginamit ang “mandirigma” at “mamamana” bilang madaling maunawaang mga katawagang pandigma; pinanatili sa pangunahing teksto ang pormal na “mga anak ni Benjamin” upang tumugma sa konteksto ng talaangkanan.
