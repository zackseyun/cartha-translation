lexical_decisions:
- source_word: וֶ/אֱלִיעֵנַי
  choice: at sina Elienai
  rationale: Isinalin ang pang-ugnay na ו bilang “at.” Ginamit ang “sina” upang natural na ipagpatuloy sa Tagalog ang talaan ng mga pangalan. Isinatinig ang pangalang אֱלִיעֵנַי bilang “Elienai,” ayon sa anyong madaling basahin sa Filipino.
- source_word: וְ/צִלְּתַי
  choice: Ziletai
  rationale: Isinatinig ang צִלְּתַי bilang “Ziletai.” Ang iisang “l” ay umaayon sa karaniwang ortograpiyang Filipino, sapagkat hindi karaniwang ipinakikita sa baybay ang pagdodoble ng katinig; pinananatili naman ng “-tai” ang hulihang tunog ng pangalan.
- source_word: וֶ/אֱלִיאֵל
  choice: at Eliel
  rationale: Isinalin ang pang-ugnay na ו bilang “at,” at isinatinig ang אֱלִיאֵל bilang “Eliel.” Hindi isinalin ang mga sangkap ng pangalan dahil ito ay pangalang pantangi.
theological_decisions: []
translation_notes:
  register: Maikli at tuwirang pagpapatuloy ng talaangkanan, gamit ang natural at marangal na modernong Filipino. Ang “sina” ay inilagay bago ang magkakasunod na pangalan, at ang “at” ay pinanatili bago ang huling pangalan ayon sa natural na pag-iisa-isa sa Tagalog.
