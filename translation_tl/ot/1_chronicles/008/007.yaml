  yaml_path: translation/ot/1_chronicles/008/007.yaml
  text: and Naaman[a], Ahijah[b], and Gera—he carried them into exile and fathered Uzza and Ahihud.
translation:
  language: tl
  text: At sina Naaman, Ahias, at Gera—siya ang nagpatapon sa kanila[a][b] at naging ama nina Uza at Ahihud.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “siya” sa Hebreo ay isahan. Pinakamalamang na si Gera ang tinutukoy nito, bagaman mahirap ang teksto at balangkas ng talaangkanan sa bahaging ito.
    reason: alternative_reading
  - marker: b
    text: 'Maaari ring “ipinatapon niya sila” o “dinala niya sila sa pagkatapon.” Causative ang pandiwang Hebreo: pinangyari niyang mapunta sila sa pagkatapon.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נַעֲמָן
  choice: Naaman
  rationale: Pangalang pantangi; ginamit ang anyong madaling makilala at bigkasin sa modernong Filipino.
- source_word: אֲחִיָּה
  choice: Ahias
  rationale: Pangalang pantangi; pinili ang nakaugaliang anyong Filipino ng pangalan.
- source_word: גֵרָא
  choice: Gera
  rationale: Pangalang pantangi; tinumbasan sa pamamagitan ng transliterasyon.
- source_word: הוּא
  choice: siya
  rationale: Nagsasariling panghalip na panlalaki at isahan; pinananatili ang tahasang pagbabalik nito sa isang naunang pangalan nang hindi nilulutas ang sintaktikong kahirapan.
- source_word: הֶגְלָם
  choice: nagpatapon sa kanila
  rationale: 'Ang Hiphil ng גלה na may hulaping panghalip na pangmaramihan ay causative: pinangyari niyang mapatapon sila. Likas sa Filipino ang ''nagpatapon sa kanila'' at pinananatili nito ang layong ''kanila.'''
- source_word: וְהוֹלִיד
  choice: at naging ama nina
  rationale: Sa talaangkanan, ang Hiphil ng ילד ay tumutukoy sa pagiging ama o pag-aanak bilang ama. Ang 'naging ama nina' ay malinaw, marangal, at hindi lipas na pananalita.
- source_word: עֻזָּא
  choice: Uza
  rationale: Pangalang pantangi; ginamit ang payak na transliterasyong angkop sa ortograpiyang Filipino.
- source_word: אֲחִיחֻד
  choice: Ahihud
  rationale: Pangalang pantangi; tinumbasan sa pamamagitan ng transliterasyon.
