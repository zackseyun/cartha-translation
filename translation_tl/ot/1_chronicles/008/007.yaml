translation_notes:
  register: Modernong Filipino na maikli at marangal, na angkop sa isang talaangkanan. Ginamit ang gitling na em dash upang mapanatili ang biglang paglipat mula sa listahan ng mga pangalan tungo sa isahang panghalip ng Hebreo, nang hindi tahasang pinapalitan ang 'siya' ng 'Gera.'
