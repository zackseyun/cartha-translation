  text: and Zebadiah, and Meshullam, and Hizki, and Heber.
translation:
  language: tl
  text: at sina Zebadias, Mesulam, Hizki, at Heber.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/זְבַדְיָה
  choice: at sina Zebadias
  rationale: Pangngalang pantangi na may pang-ugnay na וּ. Ginamit ang anyong “Zebadias,” na pamilyar sa tradisyong biblikal sa Filipino; idinagdag ang “sina” bilang likas na pananda sa Filipino para sa sunod-sunod na pangalan ng mga tao.
- source_word: וּ/מְשֻׁלָּם
  choice: Mesulam
  rationale: Tuwirang pagsasalin-tunog ng pangalang Hebreo sa baybay na madaling basahin sa modernong Filipino. Saklaw na ito ng pang-ugnay at panandang “at sina” sa simula ng talaan.
- source_word: וְ/חִזְקִי
  choice: Hizki
  rationale: Malapit na pagsasalin-tunog ng חִזְקִי at hindi ito ipinagkamali sa mas mahaba at ibang pangalang Hezekias.
- source_word: וָ/חָבֶר
  choice: at Heber
  rationale: Ginamit ang nakaugaliang anyong biblikal na “Heber” para sa חָבֶר, kasama ang pang-ugnay na “at.”
theological_decisions: []
translation_notes:
  register: Maikli at marangal na estilong angkop sa talaangkanan. Ang “at sina” ay natural sa modernong Filipino at sama-samang nagmamarka sa magkakasunod na pangalan, sa halip na ulitin ang “at” bago ang bawat isa gaya sa Hebreo.
