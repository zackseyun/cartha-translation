  text: Iphdeiah and Penuel were the sons of Shashak[a].
translation:
  language: tl
  text: At sina Yifdeya at Penuel[a] ay mga anak ni Shashak.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring baybayin na “Peniel.” Maaaring katawanin sa alinmang anyo ang baybay Hebreo ng pangalang ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִפְדְיָה
  choice: Yifdeya
  rationale: Pangalang pantangi na tinumbasan ayon sa tunog ng Hebreo. Ginamit ang “Y” para sa unang katinig na yod at ang hulaping “-ya” para sa maikling anyo ng banal na pangalan sa pangalan.
- source_word: פניאל
  choice: Peniel
  rationale: Ang mga katinig sa ibinigay na tekstong Hebreo ay tuwirang kumakatawan sa Peniel. Pinanatili bilang pangalang pantangi at hindi isinalin ang kahulugan nito.
- source_word: בְּנֵי
  choice: mga anak ni
  rationale: Literal itong pangmaramihang construct ng “anak na lalaki.” Sa talaangkanan, malinaw sa mga pangalang binanggit na mga lalaki ang tinutukoy, habang mas natural sa modernong Tagalog ang “mga anak ni” kaysa “mga anak na lalaki ni.”
- source_word: שָׁשָׁק
  choice: Shashak
  rationale: Pangalang pantangi na transliterado nang malapit sa mga katinig at patinig ng Hebreo.
- source_word: וְ
  choice: At
  rationale: Pinanatili ang pang-ugnay na waw dahil ipinagpapatuloy ng talata ang naunang talaan.
theological_decisions: []
translation_notes:
  register: Natural at marangal na modernong Tagalog para sa isang talaangkanan. Ginamit ang “sina” at “mga anak ni” upang maging malinaw ang ugnayan ng mga pangalan sa pangungusap na walang tahasang pandiwa sa Hebreo.
