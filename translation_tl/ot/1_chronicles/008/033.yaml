  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/נֵר֙ הוֹלִ֣יד אֶת קִ֔ישׁ וְ/קִ֖ישׁ הוֹלִ֣יד אֶת שָׁא֑וּל וְ/שָׁא֗וּל הוֹלִ֤יד אֶת יְהֽוֹנָתָן֙ וְ/אֶת מַלְכִּי שׁ֔וּעַ וְ/אֶת אֲבִֽינָדָ֖ב וְ/אֶת אֶשְׁבָּֽעַל־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/033.yaml
  text: Ner fathered Kish[a], and Kish fathered Saul, and Saul fathered Jonathan, Malchi-shua, Abinadab, and Eshbaal.
translation:
  language: tl
  text: Si Ner ang ama ni Kis, si Kis ang ama ni Saul, at si Saul ang ama nina Jonatan, Malquisua, Abinadab, at Esbaal.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Si Esbaal ay tinatawag na Isboset sa 2 Samuel.
    reason: alternative_reading
lexical_decisions:
- source_word: הוֹלִיד
  choice: ang ama ni/nina
  rationale: Sa talaangkanan, ipinahihiwatig ng Hiphil ng ילד ang tuwirang ugnayan ng ama at anak. Ang pariralang “ang ama ni/nina” ay likas at malinaw sa modernong Tagalog, at iniiwasan ang makalumang “ipinanganak” na maaari ring magpahiwatig na ang ama ang nanganak.
- source_word: נֵר
  choice: Ner
  rationale: Pangalang pantangi na tinumbasan sa paraang madaling basahin sa Tagalog.
- source_word: קִישׁ
  choice: Kis
  rationale: Pangalang pantangi; ginamit ang baybay na angkop sa tunog at ortograpiyang Filipino.
- source_word: שָׁאוּל
  choice: Saul
  rationale: Nakaugaliang anyo ng pangalan sa Bibliyang Filipino at malinaw na tumutukoy sa kilalang hari.
- source_word: יְהוֹנָתָן
  choice: Jonatan
  rationale: Likas na transliterasyon sa Filipino ng pangalang Hebreo at nakikilalang pangalan ng anak ni Saul.
- source_word: מַלְכִּי שׁוּעַ
  choice: Malquisua
  rationale: Isina-Filipinong transliterasyon ng tambalang pangalang Hebreo; pinananatili ang pagkakakilanlan nito nang hindi isinasalin ang kahulugan.
- source_word: אֲבִינָדָב
  choice: Abinadab
  rationale: Karaniwang transliterasyon sa Filipino ng pangalang pantangi.
- source_word: אֶשְׁבָּעַל
  choice: Esbaal
  rationale: Tuwirang sinasalamin ang anyo ng pangalan sa tekstong Hebreo ng Mga Cronica sa halip na ipalit ang anyong Isboset na matatagpuan sa Samuel.
theological_decisions:
- issue: Anyo ng pangalan ng huling anak ni Saul
  choice: Esbaal sa pangunahing teksto
  alternative: Isboset
  rationale: Malinaw na אֶשְׁבָּעַל (Esbaal) ang nasa Hebreo ng Mga Cronica. Pinananatili ito sa pangunahing teksto upang sundin ang ebidensiya ng pinagmulang wika, habang inilalagay sa talababa ang pamilyar na ibang anyo sa 2 Samuel. Hindi nito ipinapasiya o pinapawi ang tensiyon sa pagitan ng dalawang anyo ng pangalan.
translation_notes:
  register: Modernong Filipino Tagalog na simple, marangal, at angkop sa talaangkanan. Ginamit ang paulit-ulit na hulma ng “ang ama ni” upang mapanatili ang sunod-sunod na ugnayang pampamilya sa Hebreo; ginamit ang “nina” bago ang listahan ng magkakapatid para sa likas na daloy sa Tagalog.
