lexical_decisions:
- source_word: וּגְדוֹר
  choice: at sina Gedor
  rationale: Isinalin ang pang-ugnay na ו bilang “at.” Ginamit ang “sina” sa simula ng magkakasunod na pangalan upang maging likas sa modernong Tagalog, at tinumbasan ang pangalang גְדוֹר sa anyong “Gedor.”
- source_word: וְאַחְיוֹ
  choice: Ahio
  rationale: Pinananatili ang personal na pangalang אַחְיוֹ bilang “Ahio.” Saklaw na ng pambungad na “sina” ang mga pangalang magkakasunod, habang ang kuwit ang nagpapanatili sa ayos ng talaan.
- source_word: וָזָכֶר
  choice: at Zeker
  rationale: Isinalin ang pang-ugnay na ו bilang “at,” at isinalin-titik ang זָכֶר na “Zeker” upang malapit na katawanin sa baybay-Filipino ang Masoretikong bigkas na Zeḵer.
theological_decisions: []
translation_notes:
  register: Maikli at marangal na anyo ng talaangkanan sa natural na modernong Tagalog. Ginamit ang “sina” para sa serye ng mga pangalan sa halip na ulitin ang “at” bago ang bawat pangalan; walang teolohikal na interpretasyong idinagdag.
