lexical_decisions:
- source_word: חֲנַנְיָה
  choice: Hanania
  rationale: Pangalang pantangi; isinalin sa paraang transliterasyon mula sa Hebreo at iniangkop sa likas na baybay ng Filipino.
- source_word: עֵילָם
  choice: Elam
  rationale: Sa talaangkanang ito, ang anyo ay pangalan ng tao, hindi pangalan ng isang lupain; pinanatili ito bilang Elam.
- source_word: עַנְתֹתִיָּה
  choice: Anatotias
  rationale: Pangalang pantangi na tinranslitera mula sa Hebreo. Ipinakikita ng “Anatotias” ang mahinang patinig sa ikalawang pantig at gumagamit ng baybay na madaling basahin sa Filipino.
- source_word: וְ
  choice: at
  rationale: Ang pang-ugnay na Hebreo ay nagdurugtong sa mga pangalan sa listahan. Sa natural na Filipino, “at” lamang bago ang huling pangalan ang kailangan; hindi na hiwalay na ipinahayag ang panimulang pang-ugnay.
theological_decisions: []
translation_notes:
  register: Maikli at marangal na anyo para sa talaangkanan, gamit ang makabagong baybay na madaling bigkasin ng karaniwang mambabasang Filipino. Inilipat ang talababa sa pangalang Anatotias, na siyang aktuwal na tinutukoy nito.
