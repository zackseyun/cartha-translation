  text: And by Hushim he fathered Abitub and Elpaal[a].
translation:
  language: tl
  text: At mula kay Husim ay nagkaanak siya kina Abitub at Elpaal.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “At kay Husim ay nagkaanak siya kina Abitub at Elpaal.” Ang pang-ukol na Hebreo ay maaaring mangahulugang “mula kay” o, sa talaangkanang ito, ugnayang pagiging magulang sa pamamagitan ni Husim.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מֵ/חֻשִׁים
  choice: At mula kay Husim
  rationale: Pinananatili ng “mula kay” ang karaniwang kahulugan ng pang-ukol מִן bilang pinagmulan o kaugnayan. Sa talaangkanan, ipinahihiwatig nitong si Husim ang ina, nang hindi dinaragdagan ang Hebreo ng tahasang katawagang wala sa teksto.
- source_word: הוֹלִיד
  choice: ay naging anak niya
  rationale: Ang Hiphil ng ילד ay tumutukoy sa pagiging magulang o pagkakaroon ng anak. Kasama ng “mula kay Husim,” natural itong nagpapahayag sa Filipino na ang dalawang pangalan ay mga anak niya, habang iniiwasan ang di-natural na literalismong “ipinanganak niya.”
- source_word: אֶת
  choice: '[hindi hiwalay na isinalin]'
  rationale: Pananda ito ng tiyak na tuwirang layon at walang bukod na katumbas sa Filipino.
- source_word: אֲבִיטוּב
  choice: Abitub
  rationale: Isinatinig ang personal na pangalan ayon sa anyong Hebreo at sa madaling basahing kumbensiyon sa Filipino.
- source_word: וְ/אֶת
  choice: at
  rationale: Isinalin ang pang-ugnay bilang “at”; hindi hiwalay na isinalin ang kasunod na pananda ng tuwirang layon.
- source_word: אֶלְפָּעַל
  choice: Elpaal
  rationale: Isinatinig ang personal na pangalan sa isang malinaw at madaling basahing anyo, nang hindi gumagamit ng kudlit na hindi kailangan sa karaniwang tekstong Filipino.
theological_decisions: []
translation_notes:
  register: Makabago at marangal na Filipino. Ginamit ang “sina” para sa dalawang personal na pangalan. Pinanatili ang bahagyang di-tiyak na ugnayang ipinahahayag ng pang-ukol sa Hebreo, sa halip na tahasang idagdag na si Husim ay asawa o ina.
