    issue: Mali ang pagsasalin ng הוֹלִיד bilang “ay naging anak niya.”
    rationale: Ang pandiwa ay nangangahulugang siya ang nagkaanak/naging ama, hindi na ang mga anak ay “naging anak niya.” Nababaligtad nito ang papel ng paksa sa talaangkanan.
  - severity: medium
    issue: Di-natural at maling balarila ang alternatibong “nagkaanak siya ng sina Abitub at Elpaal.”
    rationale: Hindi pinagsasama ang “ng” at “sina” sa ganitong kayarian. Sa “nagkaanak,” ang natural na pantukoy sa mga taong pinangalanan ay “kina.”
