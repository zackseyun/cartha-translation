  verdict: revise
  source_fidelity: 'Ang “ay naging anak niya” ay nagpapabaligtad sa ugnayang ipinahahayag ng Hebreong הוֹלִיד: si Shaharaim ang paksa at siya ang naging ama ng mga pinangalanan. Ang “mula kay Husim” ay maaaring panatilihin bilang maingat na katumbas ng מִן nang hindi tahasang tinatawag na ina o asawa si Husim.'
  naturalness: Hindi natural at hindi malinaw ang “mula kay Husim ay naging anak niya sina Abitub at Elpaal,” at mali rin ang direksiyon ng pagiging magulang. Ang “ay nagkaanak siya kina Abitub at Elpaal” ay malinaw at makabagong Filipino.
  terminology: Ang “nagkaanak” ay angkop na katumbas sa talaangkanan para sa Hiphil ng ילד. Pinanatili ang mga pangalang Husim, Abitub, at Elpaal. Ginamit ang “kina” pagkatapos ng “nagkaanak,” samantalang ang “nina” ay ginagamit sa ibang kayariang gaya ng “ama nina.”
  issues:
