  source_fidelity: 'Kawing na kawing ang estruktura at kahulugan sa Hebreo: ang tatlong pinangalanan ay mga בְּנֵי (‘mga anak na lalaki’) ni Jeroham. Gayunman, ang ‘Jaresias’ ay kulang sa unang patinig ng Hebreong יַעֲרֶשְׁיָה at hindi rin ang mas nakaugaliang anyong Filipino ng pangalan. Ang ‘Jaarecias’ ay mas tapat sa pangalan at likas sa nakasanayang Filipino na pagbabaybay ng mga pangalang biblikal.'
