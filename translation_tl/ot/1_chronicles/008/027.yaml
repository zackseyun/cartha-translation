  text: Jareshiah[a], Elijah, and Zichri were the sons of Jeroham.
translation:
  language: tl
  text: Sina Jaarecias, Elias, at Zicri ang mga anak na lalaki[a] ni Jeroham.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga anak” o, sa mas malawak na diwa ng talaangkanan, “mga inapo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעֲרֶשְׁיָה
  choice: Jaresias
  rationale: Pangalan ng tao; ginamit ang anyong madaling basahin at naaayon sa nakaugaliang pagsasalin ng mga pangalang Hebreo sa Filipino.
- source_word: אֵלִיָּה
  choice: Elias
  rationale: Pangalan ng tao; ginamit ang kinikilalang anyo sa Filipino sa halip na mekanikal na transliterasyong “Eliya.”
- source_word: זִכְרִי
  choice: Zicri
  rationale: Pangalan ng tao; transliterasyon itong malinaw at likas basahin sa Filipino.
- source_word: בְּנֵי
  choice: mga anak na lalaki
  rationale: Ang construct plural ng בֵּן ay tuwirang tumutukoy sa “mga anak na lalaki.” Bagaman maaari itong mangahulugang mga inapo sa talaangkanan, ang tatlong lalaking binanggit dito ay pumapabor sa mas tiyak na salin.
- source_word: יְרֹחָם
  choice: Jeroham
  rationale: Pangalan ng tao; pinanatili ang karaniwang transliterasyon na malapit sa anyong Hebreo.
