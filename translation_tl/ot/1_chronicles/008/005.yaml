lexical_decisions:
- source_word: גֵרָא
  choice: Gera
  rationale: Pangalan ng tao; isinalin sa baybay na madaling basahin sa modernong Filipino habang malapit sa anyong Hebreo.
- source_word: שְׁפוּפָן
  choice: Shefufan
  rationale: Tuwirang transliterasyon ng anyong Hebreo sa talatang ito, gamit ang “f” para sa tunog ng titik pe na may raphe at pinananatili ang pagkakaiba nito sa kaugnay na anyong Shufam.
- source_word: חוּרָם
  choice: Huram
  rationale: Tuwirang transliterasyon ng חוּרָם; hindi ginawang Hiram sapagkat Huram ang patinig na malinaw na nasa tekstong Hebreo rito.
- source_word: וְ
  choice: at
  rationale: Ang pang-ugnay na Hebreo ay nagdurugtong sa mga pangalan sa isang payak na talaan; natural sa Filipino ang kuwit at “at” bago ang huling pangalan.
theological_decisions: []
