  text: Gera, Shefufan[a], at Huram.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, Shefufan ang anyo ng pangalan; ihambing ang naiibang anyong Shufam sa mga kaugnay na talaan ng angkan.
