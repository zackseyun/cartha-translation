  text: Mikloth fathered Shimeah[a]. They too lived opposite their brothers in Jerusalem[b], with their brothers.
translation:
  language: tl
  text: Naging ama ni Simea si Miklot. Sila rin ay nanirahan sa Jerusalem, sa tapat[a] ng kanilang mga kapatid[b], kasama ng kanilang mga kapatid.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “malapit sa kanilang mga kapatid”; ang salitang Hebreo ay maaaring tumukoy sa kinalalagyang nasa harap, katapat, o malapit sa isang tao.
    reason: lexical_alternative
  - marker: b
    text: Ang “mga kapatid” dito ay malamang na tumutukoy sa mga kaangkan nila sa lipi ni Benjamin, hindi lamang sa magkakapatid na iisa ang mga magulang.
    reason: cultural_note
lexical_decisions:
- source_word: וּמִקְלוֹת
  choice: Miklot
  rationale: Isinalin ang pangalang pantangi ayon sa natural na transliterasyong Filipino. Hindi na hiwalay na isinalin ang panimulang pangatnig sapagkat malinaw sa konteksto ang pagpapatuloy ng talaangkanan.
- source_word: הוֹלִיד
  choice: naging ama ni
  rationale: Likas at dignified na pananalita sa modernong Filipino para sa pandiwang ginagamit sa talaangkanan, at pinananatili ang tiyak na ugnayang panlalaki.
- source_word: אֶת שִׁמְאָה
  choice: Simea
  rationale: Hindi isinasalin ang pananda ng tuwirang layon; ang pangalan ay isinulat ayon sa natural na anyong Filipino.
- source_word: וְאַף הֵמָּה
  choice: Sila rin
  rationale: Naipapahayag nito ang inklusibo at mariing diwa ng pinagsamang pangatnig at kataga.
- source_word: נֶגֶד
  choice: sa tapat
  rationale: Pinananatili ang pangunahing kahulugang panlunan na ‘sa harap’ o ‘katapat’ nang hindi ito nililimitahan sa kahulugang ‘malapit.’
- source_word: אֲחֵיהֶם
  choice: kanilang mga kapatid
  rationale: Pinananatili ang literal na katawagang pangkamag-anakan ng Hebreo; ipinapaliwanag sa talababa ang mas malawak na gamit nito sa konteksto ng angkan.
- source_word: יָשְׁבוּ
  choice: nanirahan
  rationale: Natural na modernong Filipino para sa paninirahan sa isang lugar at angkop sa aspektong nagsasaad ng nakaraang kalagayan.
- source_word: בִּירוּשָׁלִַם
  choice: sa Jerusalem
  rationale: Karaniwang anyong Filipino ng pangalan ng lugar.
- source_word: עִם אֲחֵיהֶם
  choice: kasama ng kanilang mga kapatid
  rationale: Tuwirang inilalarawan ang pagsasama at pinananatili ang pag-uulit sa Hebreo sa halip na pakinisin o alisin ito.
