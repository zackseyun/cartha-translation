  naturalness: Hindi natural at medyo malabo sa modernong Tagalog ang “At naging mga anak niya sa asawa niyang si Hodesh.” Mas malinaw at marangal sa talaangkanan ang “At naging ama siya kina … sa kanyang asawang si Hodesh.”
  terminology: Pinananatili ang mga pangalang Jobab, Zibia, Mesha, Malcam, at Hodesh. Ang “naging ama” ay angkop na katumbas sa pang-angkan na konteksto at hindi nagdadagdag ng doktrinal na kahulugan.
