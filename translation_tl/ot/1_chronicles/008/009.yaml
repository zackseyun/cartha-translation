base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/009.yaml
  text: And he fathered Jobab[a], Zibia, Mesha, and Malcam by Hodesh his wife.
translation:
  language: tl
  text: At naging ama siya kina Jobab, Zibia, Mesha, at Malcam sa kanyang asawang si Hodesh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “mula kay Hodesh, na kanyang asawa.” Maaaring ipahayag sa alinman sa dalawang paraang ito ang pang-ukol na Hebreo sa pormulang ito ng talaangkanan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹלֶד
  choice: naging mga anak niya
  rationale: Sa talaangkanan, ang Hiphil ng ילד ay tumutukoy sa pagiging ama ng mga anak. Ang pariralang ito ay natural sa modernong Tagalog at malinaw na pinananatili ang ugnayang pang-angkan.
- source_word: מִן
  choice: sa
  rationale: Ipinakikilala ng מִן si Hodesh bilang ina o pinagmulan sa pormulang pang-talaangkanan. Natural sa Tagalog ang “sa asawa niyang si Hodesh,” habang ang posibleng mas literal na “mula sa” ay inilagay sa talababa.
- source_word: חֹדֶשׁ
  choice: Hodesh
  rationale: Pangalang pantangi ito, kaya tinumbasan sa pamamagitan ng transliterasyon sa halip na isalin ang kahulugan nito.
- source_word: אִשְׁתּוֹ
  choice: asawa niyang
  rationale: Sa kontekstong ito, malinaw na ang אשה na may hulaping paari ay nangangahulugang asawa, hindi lamang babae.
- source_word: אֶת ... וְאֶת ... וְאֶת ... וְאֶת
  choice: sina ... at
  rationale: Walang tuwirang katumbas sa Tagalog ang inuulit na pananda ng layon. Ginamit ang “sina” at “at” upang likas na ilahad ang magkakaugnay na listahan ng mga pangalan.
- source_word: יוֹבָב
  choice: Jobab
  rationale: Karaniwang anyo ng pangalan sa mga saling biblikal at malinaw na transliterasyon ng pangalang Hebreo.
- source_word: צִבְיָא
  choice: Zibia
  rationale: Transliterasyon ng pangalang pantangi na kumakatawan sa mga katinig at sa huling aleph ng Hebreo.
- source_word: מֵישָׁא
  choice: Mesha
  rationale: Transliterasyon ng pangalang pantangi na pinananatili ang tunog na sh ng Hebreo.
- source_word: מַלְכָּם
  choice: Malcam
  rationale: Gumaganap itong pangalang pantangi sa talaangkanan, kaya isinalin sa pamamagitan ng transliterasyon.
