base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/036.yaml
  text: Ahaz fathered Jehoaddah[a], and Jehoaddah fathered Alemeth, Azmaveth, and Zimri; and Zimri fathered Moza.
translation:
  language: tl
  text: Si Ahaz ay naging ama ni Jehoaddah[a]. Si Jehoaddah ay naging ama nina Alemet, Azmavet, at Zimri; at si Zimri ay naging ama ni Moza.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: Jehoaddah; sa ilang tradisyon ng salin sa Ingles, Jehoadah.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹלִיד
  choice: naging ama ni/nina
  rationale: Sa talaangkanan, ang Hifil ng ילד ay nagpapahayag na ang isang lalaki ay naging ama ng binanggit na anak o mga anak. Likas at malinaw ito sa modernong Tagalog, nang hindi gumagamit ng makalumang pananalita.
- source_word: אֶת
  choice: '[hindi hiwalay na isinalin]'
  rationale: Pananda ito ng tiyak na tuwirang layon sa Hebreo at wala itong bukod na katumbas sa Tagalog; naipahahayag ang gamit nito sa kayarian ng pangungusap.
- source_word: יְהוֹעַדָּה
  choice: Jehoada
  rationale: Isinalin-titik ang pangalang pantangi ayon sa anyong katinig ng tekstong Hebreo; pinasimple ang dobleng katinig sa baybay na likas basahin sa Tagalog.
- source_word: עָלֶמֶת
  choice: Alemet
  rationale: Isinalin-titik ang pangalang pantangi sa anyong madaling basahin sa Tagalog.
- source_word: עַזְמָוֶת
  choice: Azmavet
  rationale: Isinalin-titik ang pangalang pantangi, na pinananatili ang mga pangunahing katinig ng Hebreo.
- source_word: זִמְרִי
  choice: Zimri
  rationale: Isinalin-titik nang pareho sa dalawang paglitaw nito.
- source_word: מוֹצָא
  choice: Moza
  rationale: Isinalin-titik ang pangalang pantangi sa malinaw at maikling anyong Tagalog.
- source_word: וְ
  choice: at / paghahati sa bagong pangungusap
  rationale: Nag-uugnay ito ng mga pangalan at sugnay sa talaangkanan. Ginamit ang “at” kung likas, at bagong pangungusap sa unang malaking hati upang maging malinaw sa Tagalog nang hindi dinaragdagan ang kahulugan.
theological_decisions: []
translation_notes:
  register: Makabago, marangal, at payak na Tagalog para sa isang talaangkanan. Ginamit ang “naging ama” sa halip na isang makalumang katumbas ng “begot.” Inangkop ang mga pangalang Hebreo sa baybay na madaling basahin sa Tagalog habang pinananatili ang pagkakakilanlan ng mga ito.
