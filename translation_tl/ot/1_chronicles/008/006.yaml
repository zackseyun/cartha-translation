  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “angkan” upang malinaw na ihatid ang sinaunang kaayusang panlipunan, at pinanatili sa talababa ang kalabuan ng mga panghalip sa Hebreo.
