source:
  edition: WLC
  text: וְ/אֵ֖לֶּה בְּנֵ֣י אֵח֑וּד אֵ֣לֶּה הֵ֞ם רָאשֵׁ֤י אָבוֹת֙ לְ/י֣וֹשְׁבֵי גֶ֔בַע וַ/יַּגְל֖וּ/ם אֶל מָנָֽחַת־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/006.yaml
  text: 'These were the sons of Ehud[a]. These were the heads of fathers’ houses for the inhabitants of Geba[b], and they carried them into exile to Manahath:'
translation:
  language: tl
  text: Ito ang mga anak ni Ehud. Sila ang mga pinuno ng mga angkan[a] ng mga naninirahan sa Geba, at ipinatapon nila ang mga ito sa Manahat:[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, ang parirala ay literal na tumutukoy sa “mga pinuno ng mga sambahayan ng mga ama,” samakatuwid, sa mga pinuno ng angkan o sambahayang ninuno.
    reason: cultural_note
  - marker: b
    text: 'Hindi tahasang tinutukoy sa Hebreo kung sino ang “nila” at kung sino ang “mga ito.” Maaari ring isalin: “at dinala nila ang mga ito sa pagkatapon sa Manahat.”'
    reason: textual_ambiguity
lexical_decisions:
- source_word: וְאֵלֶּה בְּנֵי אֵחוּד
  choice: Ito ang mga anak ni Ehud
  rationale: Likas na panimulang pormula sa talaangkanan; pinananatili ng “mga anak” ang maaaring mas malawak na diwa ng mga inapo sa kontekstong genealogical.
- source_word: אֵלֶּה הֵם
  choice: Sila ang
  rationale: Inihahatid ang mariing resumptibong pahayag sa natural na modernong Tagalog.
- source_word: רָאשֵׁי אָבוֹת
  choice: mga pinuno ng mga angkan
  rationale: Ang parirala ay tumutukoy sa mga namumuno sa mga sambahayang ninuno o angkan; mas malinaw ito sa karaniwang mambabasa kaysa literal na “mga ulo ng mga sambahayan ng ama.”
- source_word: לְיֹשְׁבֵי גֶבַע
  choice: ng mga naninirahan sa Geba
  rationale: Ipinapahayag ang ugnayan ng mga pinuno sa mga naninirahan sa Geba nang hindi labis na tinutukoy kung “para sa” o “kabilang sa” sila.
- source_word: וַיַּגְלוּם
  choice: at ipinatapon nila ang mga ito
  rationale: Ang Hiphil ng גלה na may hulaping layon ay nagpapahiwatig na may mga taong sapilitang dinala sa pagkatapon; pinananatili rin ang tunay na kalabuan kung sino ang gumagawa at sino ang tinutukoy ng panghalip.
- source_word: אֶל מָנָחַת
  choice: sa Manahat
  rationale: Karaniwang direksiyonal na gamit ng אֶל; isinalin ang pangalang pook sa anyong madaling bigkasin sa Filipino.
