translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang 'angkan' upang maipahayag nang natural ang sinaunang kaayusang pampamilya, habang inilagay sa talababa ang mas literal na anyo. Iningatan ang dalawang pagdidiin ng panghalip na הֵמָּה sa pamamagitan ng 'sila' at 'sila ang.'
