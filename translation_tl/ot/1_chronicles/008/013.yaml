base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/013.yaml
  text: And Beriah and Shema—they were heads of fathers’ houses among the inhabitants of Aijalon[b][a]; they were the ones who drove out the inhabitants of Gath.
translation:
  language: tl
  text: At sina Beria at Sema—sila ang mga pinuno ng mga angkan[a] kabilang sa mga naninirahan sa Ayalon; sila ang nagtaboy[b] sa mga naninirahan sa Gat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal na “mga pinuno ng mga sambahayan ng mga ama,” isang katawagan sa mga pinuno ng mga angkan o malalaking pamilya.
    reason: cultural_note
  - marker: b
    text: Maaari ring “nagpatakas” o “nagpaurong.” Binibigyang-diin ng pandiwang Hebreo na pinilit nilang tumakas ang mga naninirahan sa Gat.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְרִעָה וָשֶׁמַע
  choice: At sina Beria at Sema
  rationale: Isinalin ang pang-ugnay upang mapanatili ang daloy ng talaangkanan, at tinumbasan ang mga pangalang Hebreo sa anyong likas bigkasin sa Filipino.
- source_word: הֵמָּה
  choice: sila
  rationale: Pinananatili ang tahasang panghalip, na nagbibigay-diin sa dalawang lalaking binanggit.
- source_word: רָאשֵׁי הָאָבוֹת
  choice: mga pinuno ng mga angkan
  rationale: Ang parirala ay tumutukoy sa mga pinuno ng mga sambahayang nagmula sa iisang ninuno; mas malinaw sa karaniwang mambabasa ang 'mga angkan' kaysa literal na 'mga sambahayan ng mga ama.'
- source_word: לְיוֹשְׁבֵי אַיָּלוֹן
  choice: sa mga naninirahan sa Ayalon
  rationale: Pinananatili ang ugnayang malawak ang saklaw ng לְ; sa konteksto, ipinahihiwatig na sila ang mga pinuno kaugnay ng populasyon ng Ayalon, nang hindi labis na nililinaw kung 'sa gitna ng' o 'para sa' kanila.
- source_word: אַיָּלוֹן
  choice: Ayalon
  rationale: Transliterasyong malapit sa tunog Hebreo at likas basahin sa Filipino.
- source_word: הֵמָּה הִבְרִיחוּ
  choice: sila ang nagtaboy
  rationale: Ang ayos na 'sila ang' ay nagpapahayag ng diin ng ikalawang הֵמָּה, samantalang ang 'nagtaboy' ay natural na nagpapakita ng causative na diwa ng pandiwa.
- source_word: אֶת יֹשְׁבֵי גַת
  choice: sa mga naninirahan sa Gat
  rationale: Tuwirang salin ng layon at pare-pareho sa naunang paggamit ng 'mga naninirahan.'
