lexical_decisions:
- source_word: וְ/אַחְי֥וֹ
  choice: At sina Ahio
  rationale: Isinalin ang pang-ugnay na וְ bilang “At” upang mapanatili ang pagpapatuloy ng talaangkanan. Ginamit ang “sina” bilang likas na panandang Filipino para sa magkakasunod na pangalan ng mga tao, at tinumbasan ang אַחְיוֹ sa pangalang “Ahio.”
- source_word: שָׁשָׁ֖ק
  choice: Shashak
  rationale: Pangalang pantangi ito sa talaangkanan, kaya tinumbasan ito sa pamamagitan ng tuwirang transliterasyon.
- source_word: וִ/ירֵמֽוֹת
  choice: at Jeremot
  rationale: Isinalin ang prefixed na pang-ugnay bilang “at.” Ginamit ang “Jeremot” bilang malinaw na anyong Filipino ng pangalang Hebreo; ang “Jerimot” ay pinanatili sa talababa bilang posibleng alternatibong transliterasyon.
