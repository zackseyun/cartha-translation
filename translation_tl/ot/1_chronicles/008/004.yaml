lexical_decisions:
- source_word: וַ/אֲבִישׁוּעַ
  choice: at sina Abisua
  rationale: Isinalin ang pang-ugnay na ו bilang “at.” Ginamit ang “sina” upang natural na ipakilala sa Tagalog ang magkakasunod na pangalan ng mga tao sa talaangkanan; ang pangalan ay tinumbasan ayon sa karaniwang anyong Tagalog.
- source_word: וְ/נַעֲמָן
  choice: Naaman
  rationale: Bahagi ito ng magkakaugnay na listahan. Hindi na inulit ang “at” bago ang bawat pangalan upang maging natural ang ayos sa Tagalog, habang nananatiling malinaw ang pagkakaugnay ng mga pangalan.
- source_word: וַ/אֲחוֹחַ
  choice: at Ahoa
  rationale: Isinalin ang pang-ugnay sa huling pangalan bilang “at,” ayon sa likas na paraan ng paglilista sa Tagalog. Ang pangalang אֲחוֹחַ ay tinumbasan bilang “Ahoa.”
