lexical_decisions:
- source_word: וְ
  choice: at / sina
  rationale: Sa Hebreo, may pang-ugnay na וְ bago sa bawat pangalan. Sa natural na Tagalog, ginamit ang “sina” upang ipakilalang magkakasunod na pangalan ng mga tao, at “at” upang malinaw na pag-ugnayin ang listahan nang hindi paulit-ulit at mabigat ang pahayag.
- source_word: עַבְדּוֹן
  choice: Abdon
  rationale: Pangalang pantangi ito; tinumbasan sa pamamagitan ng transliterasyon. Ang “Abdon” ay malinaw at nakasanayan sa mga saling Tagalog.
- source_word: זִכְרִי
  choice: Zicri
  rationale: Pangalang pantangi ito; ang “Zicri” ay isang tuwirang anyong transliterado na angkop sa pagbasa sa Tagalog.
- source_word: חָנָן
  choice: Hanan
  rationale: Pangalang pantangi ito; pinanatili bilang “Hanan,” isang malinaw at tuwirang transliterasyon para sa mambabasang Tagalog.
