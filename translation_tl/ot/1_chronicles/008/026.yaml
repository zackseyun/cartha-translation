  text: at si Shamsherai, at si Seharya, at si Atalia.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שַׁמְשְׁרַי
  choice: Shamsherai
  rationale: Pangalan ng tao sa talaangkanan; tinumbasan sa pamamagitan ng transliterasyong malapit sa anyong Hebreo at natural basahin sa Filipino.
- source_word: שְׁחַרְיָה
  choice: Sheharia
  rationale: Pangalan ng tao; pinanatili sa transliterasyon ang mga pangunahing katinig at ang hulaping -ia, na kumakatawan sa elementong -yah ng Hebreo.
- source_word: עֲתַלְיָה
  choice: Atalia
  rationale: Pangalan ng tao; ginamit ang karaniwang anyong Filipino na walang Ingles na digrapong th, yamang ang Hebreong titik ay tav at hindi tunog na /th/.
- source_word: וְ / וּ / וַ
  choice: at / sina
  rationale: Ang waw ay pang-ugnay sa listahan. Isinalin ang una bilang “at,” habang ginamit ang “sina” bago ang magkakasunod na pangalan upang maging natural sa Filipino; muling ginamit ang “at” bago ang huling pangalan.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na angkop sa marangal na salaysay ng talaangkanan. Ginamit ang pantukoy na “sina” para sa maramihang pangalan at iniwasan ang mekanikal na pag-uulit ng “at” sa bawat pangalan, nang hindi binabago ang ayos o nilalaman ng listahan.
