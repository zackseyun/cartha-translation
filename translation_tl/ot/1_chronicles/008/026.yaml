  naturalness: Natural at marangal sa modernong Filipino ang “at si …, at si …, at si …” sa isang talaangkanan. Mas malinaw ito kaysa sa panggrupong “sina,” dahil magkakahiwalay na iniugnay ng Hebreo ang bawat pangalan.
