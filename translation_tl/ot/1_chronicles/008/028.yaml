  text: These were heads of fathers’ houses according to their generations[a], chief men. These lived in Jerusalem.
translation:
  language: tl
  text: Ang mga ito ang mga pinuno ng mga angkan ayon sa kanilang mga salinlahi—mga pinuno.[a] Ang mga ito ay nanirahan sa Jerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “mga pinuno ng mga sambahayan ng kanilang mga angkan ayon sa kanilang mga salinlahi—mga pinuno.” Inuulit sa Hebreo ang salitang-ugat para sa “ulo/pinuno” bilang pagbibigay-diin.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאשֵׁי אָבוֹת
  choice: mga pinuno ng mga angkan
  rationale: Ang parirala ay tumutukoy sa mga pinuno ng mga sambahayan o angkang nagmula sa iisang ninuno. Likas at malinaw sa modernong Tagalog ang “mga pinuno ng mga angkan,” habang pinananatili ang panlipunang diwa ng Hebreo.
- source_word: לְתֹלְדוֹתָם
  choice: ayon sa kanilang salinlahi
  rationale: Pinananatili nito ang pormal na genealogical na diwa ng תולדות nang hindi ipinapalagay na ang tinutukoy ay mga nakasulat na talaan.
- source_word: רָאשִׁים
  choice: mga pangunahin
  rationale: Inilalarawan nito ang kanilang mataas na katayuan at pinananatili ang pag-uulit ng ugat na רֹאשׁ sa pamamagitan ng kaugnay ngunit hindi lubhang alanganing pananalita.
- source_word: יָשְׁבוּ
  choice: nanirahan
  rationale: Sa kontekstong ito, ang pandiwa ay tumutukoy sa paninirahan, hindi sa literal na pag-upo.
- source_word: בִירוּשָׁלָם
  choice: sa Jerusalem
  rationale: Karaniwang salin ng pangalan ng lugar, kasama ang pang-ukol.
- source_word: אֵלֶּה ... אֵלֶּה
  choice: Ang mga ito ... Ang mga ito
  rationale: Pinananatili ang dalawang demonstratibo na nagbibigay-diin at naghahati sa dalawang pahayag ng talata.
