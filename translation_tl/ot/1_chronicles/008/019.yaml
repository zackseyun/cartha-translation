translation_notes:
  register: Maikli, dignified, at natural na modernong Filipino. Ginamit ang “sina” dahil serye ito ng mga pangalan ng tao; hindi na inulit ang “at” bago ang bawat pangalan sapagkat magiging mabigat iyon sa Tagalog, ngunit nananatili ang malinaw na estruktura ng talaan.
