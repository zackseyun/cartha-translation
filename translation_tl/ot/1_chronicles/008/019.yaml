lexical_decisions:
- source_word: וְ
  choice: at / sina
  rationale: Ang magkakasunod na pang-ugnay sa Hebreo ay likas na ipinahayag sa Tagalog sa pamamagitan ng “at” at ng pangmaramihang pantukoy na “sina,” habang pinananatili ang anyo ng talaan.
- source_word: יָקִים
  choice: Yakim
  rationale: Isinatinig ang pangalang Hebreo ayon sa karaniwang baybay sa modernong Filipino; ginagamit ang Y para sa unang katinig na yod.
- source_word: זִכְרִי
  choice: Zikri
  rationale: Isinatinig nang tuwiran ang pangalang Hebreo; ang “k” ay malinaw at likas na katumbas sa baybay-Filipino ng katinig na kaf.
- source_word: זַבְדִּי
  choice: Zabdi
  rationale: Isinatinig nang tuwiran ang pangalang pantangi sa paraang madaling basahin sa Filipino.
