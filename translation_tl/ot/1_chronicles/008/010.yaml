base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/010.yaml
  text: and Jeuz[a], and Sachia, and Mirmah. These were his sons, heads of fathers’ houses.
translation:
  language: tl
  text: at sina Jeuz, Sakia, at Mirma. Ang mga ito ang kanyang mga anak na lalaki, mga pinuno ng mga sambahayan ng kanilang angkan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “mga pinuno ng mga ama.” Idyoma ito para sa mga pinuno ng mga sambahayan o pangkat ng angkan na nagmula sa iisang ninuno.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְעוּץ
  choice: Jeuz
  rationale: Pangalang pantangi ito; ginamit ang anyong madaling basahin sa Filipino at malapit sa nakaugaliang transliterasyon.
- source_word: שָׂכְיָה
  choice: Sakia
  rationale: Pangalang pantangi ito; ang “Sakia” ay natural na transliterasyon sa Filipino ng mga katinig at patinig sa Hebreo.
- source_word: מִרְמָה
  choice: Mirma
  rationale: Sa talaangkanang ito, malinaw na pangalang pantangi ang salita, kaya isinalin ito sa tunog at hindi ayon sa posibleng kahulugan nitong karaniwang pangngalan.
- source_word: אֵלֶּה
  choice: Ang mga ito
  rationale: Tumutukoy ang pangmaramihang pamatlig sa mga pangalang kababanggit lamang at natural itong bumubuo sa sugnay na walang tahasang pandiwa sa Hebreo.
- source_word: בָנָיו
  choice: kanyang mga anak na lalaki
  rationale: Tiyak na panlalaking maramihan ang anyo sa konteksto ng talaangkanan; mas eksakto ito kaysa sa pangkalahatang “mga anak.”
- source_word: רָאשֵׁי אָבוֹת
  choice: mga pinuno ng mga sambahayan ng mga ninuno
  rationale: Idyoma itong tumutukoy sa mga lalaking namumuno sa mga angkan o sambahayang nagmula sa iisang ninuno. Pinananatili ng salin ang diwa ng pamumuno at ugnayang pangninuno nang hindi ginagamit ang di-natural na literal na “mga pinuno ng mga ama.”
theological_decisions: []
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “sambahayan ng mga ninuno” upang maging malinaw sa karaniwang mambabasa ang idyomang pangangkan sa Hebreo, habang inilagay sa talababa ang literal na anyo at ang alternatibong “mga angkan.”
