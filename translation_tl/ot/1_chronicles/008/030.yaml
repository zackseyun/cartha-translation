base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/030.yaml
  text: His firstborn son was Abdon[a], then Zur, Kish, Baal, and Nadab.
translation:
  language: tl
  text: Ang panganay niyang anak ay si Abdon; ang iba pa ay sina Zur, Kish, Baal, at Nadab.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas pormal: “At ang anak niyang panganay: si Abdon, at sina Zur, Kish, Baal, at Nadab.”'
    reason: Pinananatili ng mas pormal na salin ang walang-pandiwang ayos at magkakasunod na pang-ugnay sa Hebreo. Nililinaw ng pangunahing teksto na kabilang sa mga anak ang kasunod na mga pangalan, gaya ng hinihingi ng konteksto ng talaangkanan.
lexical_decisions:
- source_word: וּבְנוֹ
  choice: niyang anak
  rationale: Ang בְּנוֹ ay nangangahulugang “anak niya.” Hindi na hiwalay na isinalin ang panimulang וְ dahil likas na ipinagpapatuloy ng talata ang talaangkanan.
- source_word: הַבְּכוֹר
  choice: panganay
  rationale: Tuwirang ipinahahayag nito ang unang anak ayon sa pagkakasunod ng kapanganakan; “panganay” ang natural at eksaktong katumbas sa Tagalog.
- source_word: עַבְדּוֹן
  choice: Abdon
  rationale: Pangalan ng tao; tinumbasan ayon sa karaniwang anyo nito sa Tagalog na Bibliya.
- source_word: וְצוּר
  choice: Zur
  rationale: Pangalan ng tao. Ang pang-ugnay na וְ ay kinakatawan sa natural na ayos ng talaan.
- source_word: וְקִישׁ
  choice: Kish
  rationale: Pangalan ng tao; transliterasyon ayon sa karaniwang anyo sa Tagalog.
- source_word: וּבַעַל
  choice: Baal
  rationale: Ginagamit dito bilang pangalan ng tao sa isang talaangkanan, kaya isinalin bilang pangalan at hindi bilang karaniwang pangngalan o titulo.
- source_word: וְנָדָב
  choice: Nadab
  rationale: Pangalan ng tao; transliterasyon ayon sa karaniwang anyo sa Tagalog.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “ang iba pa” upang maging natural ang talaan pagkatapos tukuyin ang panganay, habang inilalahad sa talababa ang mas pormal at mas malapit sa estruktura ng Hebreo na pagbasa.
