  yaml_path: translation/ot/1_chronicles/008/034.yaml
  text: And the son of Jehonathan was Merib-baal[a], and Merib-baal fathered Micah.
translation:
  language: tl
  text: At ang anak ni Jehonatan ay si Merib-baal, at si Merib-baal ang naging ama ni Mica.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa 2 Samuel 9:12, ang pangalan ay may bahagyang naiibang baybay sa Hebreo: Mica (מִיכָא); dito ay Mica (מִיכָה).'
    reason: cross_reference
lexical_decisions:
- source_word: וּ/בֶן
  choice: At ang anak ni
  rationale: Pinananatili ng “At” ang payak na dugtong ng talaangkanan, at likas sa Filipino ang “ang anak ni” para sa ugnayang ipinahahayag ng בֶן.
- source_word: יְהוֹנָתָן
  choice: Jehonatan
  rationale: Isinasatitik ang anyong Yehonatan sa tekstong Hebreo sa halip na gawing mas pamilyar na “Jonatan.” Ginamit ang “J” ayon sa karaniwang anyo ng mga pangalang biblikal sa Filipino.
- source_word: מְרִיב בָּעַל / מְרִיב בַּעַל
  choice: Merib-baal
  rationale: Iisang pangalang pantangi ang dalawang salitang Hebreo; ipinakikita ng gitling na bumubuo ang mga ito ng isang pangalan. Ang pag-uulit nito sa talata ay tumutukoy sa iisang tao.
- source_word: הוֹלִיד
  choice: ang naging ama ni
  rationale: Sa konteksto ng talaangkanan, ang Hiphil ng ילד ay tumutukoy sa pagiging ama o pag-aanak. Ang “ang naging ama ni” ay malinaw, natural, at marangal sa modernong Filipino.
- source_word: אֶת מִיכָה
  choice: Mica
  rationale: Hindi isinasalin nang bukod ang pananda ng tuwirang layon na אֶת. Ang מִיכָה ay isinasatitik bilang “Mica,” ayon sa karaniwang baybay ng pangalang biblikal sa Filipino.
