translation_notes:
  register: Payak at marangal na wikang pang-talaangkanan. Inilipat ang talababa sa “Mica,” sapagkat ang paliwanag ay tungkol sa baybay ng pangalang iyon, hindi sa Merib-baal. Pinanatili sa talababa ang pagkakaiba ng mga anyong Hebreo kahit pareho silang likas na isinasatitik na “Mica” sa Filipino.
