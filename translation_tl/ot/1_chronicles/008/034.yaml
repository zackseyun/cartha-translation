  source_fidelity: 'Tumpak na naipapahayag ng salin ang magkakasunod na ugnayang talaangkanan sa Hebreo: si Jehonatan ang ama ni Merib-baal, at si Merib-baal ang ama ni Mica. Napananatili ang pangatnig na וְ sa payak na “At,” ang pag-uulit ng pangalang Merib-baal, at ang tuwirang genealogical na saysay ng הוֹלִיד.'
