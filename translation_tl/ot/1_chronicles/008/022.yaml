lexical_decisions:
- source_word: יִשְׁפָּן
  choice: Ishpan
  rationale: Pangalang pantangi ito, kaya tinumbasan sa pamamagitan ng transliterasyon. Ang “Ishpan” ay tuwirang kumakatawan sa anyong Hebreo at umaayon sa anyo sa konsultasyong Ingles.
- source_word: עֵבֶר
  choice: Eber
  rationale: Pangalang pantangi ito, kaya transliterasyon ang ginamit. Mas tuwirang ipinakikita ng “Eber” ang anyong Hebreo rito kaysa sa tradisyonal na “Heber.”
- source_word: אֱלִיאֵל
  choice: Eliel
  rationale: Tuwirang transliterasyon ng pangalang Hebreo; hindi isinalin ang mga bahaging bumubuo sa pangalan.
- source_word: וְ / וָ / וֶ
  choice: at / sina
  rationale: Ang mga unlaping waw ay nag-uugnay sa mga pangalan sa isang talaan. Sa natural na Filipino, pinananatili ang “at” sa simula dahil pagpapatuloy ito ng naunang talaan, ginagamit ang pantukoy na maramihang “sina,” at inilalagay ang huling “at” bago ang huling pangalan.
