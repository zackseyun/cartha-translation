  text: וְ/שַׁחֲרַ֗יִם הוֹלִיד֙ בִּ/שְׂדֵ֣ה מוֹאָ֔ב מִן שִׁלְח֖/וֹ אֹתָ֑/ם חוּשִׁ֥ים וְ/אֶֽת בַּעֲרָ֖א נָשָֽׁי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/008.yaml
  text: And Shaharaim fathered children in the country of Moab after he sent away Hushim and Baara[b][a], his wives.
translation:
  language: tl
  text: At nagkaanak si Shaharaim sa lupain ng Moab[a] matapos niyang paalisin[b] sina Hushim at Baara, na kanyang mga asawa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa bukid ng Moab” o “sa nasasakupan ng Moab.”
    reason: lexical_alternative
  - marker: b
    text: 'Literal: “mula sa pagpapaalis niya sa kanila.” Malamang na ang ibig sabihin ay “matapos niyang paalisin sila.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/שַׁחֲרַיִם
  choice: At ... si Shaharaim
  rationale: Ang וְ ay nag-uugnay sa talata sa nagpapatuloy na talaangkanan; pinanatili ang pangalan sa transliterasyon.
- source_word: הוֹלִיד
  choice: nagkaanak
  rationale: Sa kontekstong talaangkanan, ang Hiphil ng ילד ay tumutukoy sa pagiging ama o pag-aanak. Likas sa modernong Tagalog ang “nagkaanak” at hindi nito inuunahan ang pagkakakilanlan sa mga anak na babanggitin sa susunod na talata.
- source_word: בִּ/שְׂדֵה מוֹאָב
  choice: sa lupain ng Moab
  rationale: Bagaman literal na maaaring “bukid” ang שָׂדֶה, sa heograpikong parirala ay maaari itong mangahulugang lupain o nasasakupan. Ang “lupain” ay malinaw at natural sa Tagalog.
- source_word: מִן שִׁלְח/וֹ אֹתָם
  choice: matapos niyang paalisin
  rationale: Ang מִן kasama ng infinitive construct ay pinakamalamang na nagsasaad ng panahong sumunod sa pagpapaalis. Ang “paalisin” ay nagpapanatili sa pangkalahatang diwa ng pagpapalayo nang hindi tahasang nagpapasyang ito ay pormal na diborsiyo.
- source_word: חוּשִׁים
  choice: Hushim
  rationale: Pangalang pantangi na isinalin sa pamamagitan ng transliterasyon.
- source_word: וְ/אֶת בַּעֲרָא
  choice: at Baara
  rationale: Ang אֶת ay pananda ng tuwirang layon at hindi hiwalay na isinasalin; pinanatili ang pang-ugnay at transliterasyon ng pangalan.
- source_word: נָשָׁיו
  choice: ang kanyang mga asawa
  rationale: Sa konteksto, ang maramihang anyo ng אִשָּׁה na may hulaping panghalip ay malinaw na tumutukoy sa kanyang mga asawa; inilagay bilang paliwanag sa dalawang pangalan.
theological_decisions:
- issue: Kung ang שִׁלַּח ay tiyak na nangangahulugang diborsiyado
  choice: paalisin
  alternative: hiwalayan o diborsiyuhin
  rationale: Maaaring gamitin ang pandiwa sa pagpapaalis at, sa ilang konteksto, sa paghihiwalay sa asawa. Hindi sapat ang talata upang gawing tahasan ang pormal na diborsiyo, kaya pinanatili ang mas malawak na diwa.
translation_notes:
  register: Gumamit ng makabago ngunit marangal at payak na Tagalog. Ang “nagkaanak” ay natural sa salaysay ng talaangkanan, samantalang ang “lupain” at “paalisin” ay nagpapanatili sa saklaw at bahagyang kalabuan ng Hebreo.
