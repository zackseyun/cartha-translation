  naturalness: 'Mas likas at malinaw sa modernong Filipino ang tahasang pagtukoy sa ama-anak sa bawat ugnayan: “si Moza ang ama ni Binea; si Rafa ang anak ni Binea ...” Pinananatili nito ang maigsi at pormal na estilo ng talaangkanan nang walang posibleng kalabuan ng panghalip.'
