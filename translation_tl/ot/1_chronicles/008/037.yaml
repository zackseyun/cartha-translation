  text: And Moza fathered Binea; Rephah was his son, Eleasah his son, Azel his son.
translation:
  language: tl
  text: At si Moza ang ama ni Binea[a]; si Rafa[b] ang anak ni Binea, si Eleasa[c] ang anak ni Rafa, at si Azel ang anak ni Eleasa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Bina.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “Rapha.”
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “Elasa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מוֹצָא
  choice: At … ni Moza
  rationale: Isinalin ang pang-ugnay na ו bilang “At” upang mapanatili ang dugtungan ng talaangkanan; tinumbasan ang pangalang מוֹצָא bilang “Moza.”
- source_word: הוֹלִיד
  choice: naging anak ni Moza si
  rationale: Sa kontekstong talaangkanan, ipinahahayag ng Hiphil ng ילד ang pagiging ama o pagkakaroon ng anak. Ang ayos na “naging anak ni Moza si Binea” ay likas sa modernong Tagalog at malinaw na pinananatili ang ugnayang ama-anak.
- source_word: אֶת
  choice: '[hindi isinalin nang hiwalay]'
  rationale: Pananda ito ng tiyak na layon sa Hebreo at wala itong tuwirang katumbas na kailangang ilahad sa Tagalog.
- source_word: בִּנְעָא
  choice: Binea
  rationale: Transliterasyon ito ng pangalang Hebreo na pinananatili ang hulíng tunog na kinakatawan ng ע; posible rin ang pinasimpleng “Bina.”
- source_word: רָפָה
  choice: Rafa
  rationale: Tuwirang transliterasyon ito ayon sa patinig ng anyong Hebreo רָפָה at sa likas na baybay sa Filipino.
- source_word: בְנ/וֹ
  choice: ang anak niya / ang anak nito
  rationale: Ang literal na “anak niya” ay inuulit upang ipakita ang sunod-sunod na salinlahi. Ginamit ang “nito” sa mga kasunod upang malinaw na ang bawat pangalan ay anak ng kaagad na naunang pangalan.
- source_word: אֶלְעָשָׂה
  choice: Eleasa
  rationale: Inililipat nito sa baybay-Filipino ang mga tunog at patinig ng pangalang Hebreo; posible rin ang pinaikling “Elasa.”
- source_word: אָצֵל
  choice: Azel
  rationale: Tuwirang transliterasyon ng pangalang Hebreo sa likas na baybay sa Filipino.
