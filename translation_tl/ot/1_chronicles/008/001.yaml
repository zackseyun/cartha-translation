source:
  edition: WLC
  text: וּ/בִ֨נְיָמִ֔ן הוֹלִ֖יד אֶת בֶּ֣לַע בְּכֹר֑/וֹ אַשְׁבֵּל֙ הַ/שֵּׁנִ֔י וְ/אַחְרַ֖ח הַ/שְּׁלִישִֽׁי־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/001.yaml
  text: Benjamin fathered Bela his firstborn[a], Ashbel the second, and Aharah the third.
translation:
  language: tl
  text: Naging ama si Benjamin nina Bela na kanyang panganay, Asbel na ikalawa, at Ahara[a] na ikatlo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, Aharah; sa ilang salin, Ahrah.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִנְיָמִן
  choice: si Benjamin
  rationale: Ginamit ang karaniwang anyo ng pangalan sa Filipino. Hindi hiwalay na isinalin ang pang-ugnay na וּ sapagkat natural nang nagpapatuloy ang talaangkanan nang walang “at” o “naman” sa talatang ito.
- source_word: הוֹלִיד
  choice: naging ama
  rationale: Sa konteksto ng talaangkanan, tumutukoy ang Hiphil ng ילד sa pagiging ama o pag-aanak. Natural at malinaw sa makabagong Filipino ang “naging ama,” samantalang masyadong makaluma o di-likas ang literal na “ipinanganak.”
- source_word: אֶת
  choice: '[hindi hiwalay na isinalin]'
  rationale: Walang tuwirang katumbas sa Filipino ang pananda ng tuwirang layon; naipahahayag ito sa balangkas ng pangungusap.
- source_word: בֶּלַע
  choice: Bela
  rationale: Pangalan na isina-Filipino ayon sa karaniwang transliterasyon.
- source_word: בְּכֹרוֹ
  choice: na kanyang panganay
  rationale: Tuwirang pinananatili ng “panganay” ang katawagang tumutukoy sa kaayusan ng kapanganakan.
- source_word: אַשְׁבֵּל
  choice: Asbel
  rationale: Ang שׁ ay kinakatawan ng “s” sa karaniwang pagsasa-Filipino ng mga pangalang biblikal; malinaw at madaling bigkasin ang “Asbel.”
- source_word: הַשֵּׁנִי
  choice: na ikalawa
  rationale: Natural na Filipino para sa ordinal na tumutukoy sa ayos ng magkakapatid.
- source_word: וְאַחְרַח
  choice: at Ahara[a]
  rationale: Sinusunod ang anyong Masoretiko na אַחְרַח at isinasalin ang prefixed conjunction bilang “at.” Inilagay ang talababa sa mismong pangalan na may alternatibong anyo.
- source_word: הַשְּׁלִישִׁי
  choice: na ikatlo
  rationale: Pinananatili ang malinaw na pagkakasunod-sunod sa talaangkanan sa natural na anyong Filipino.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino para sa isang talaangkanan. Ginamit ang “naging ama” sa halip na makalumang katumbas ng “begot,” at pinanatili ang mga ordinal na panganay, ikalawa, at ikatlo. Ang marker ng talababa ay inilagay pagkatapos ng Ahara, ang salitang talagang tinatalakay ng talababa.
