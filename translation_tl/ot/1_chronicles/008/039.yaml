base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/039.yaml
  text: 'The sons of Eshek his brother: Ulam his firstborn[a], Jeush the second, and Eliphelet the third.'
translation:
  language: tl
  text: 'At ito ang mga anak ni Eshek, na kanyang kapatid: si Ulam, ang kanyang panganay; si Jeus, ang ikalawa; at si Elifelet, ang ikatlo.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי
  choice: At ang mga anak
  rationale: Pinanatili ang pang-ugnay na וּ bilang “At” at tuwirang isinalin ang anyong construct na בְנֵי bilang “ang mga anak.”
- source_word: עֵשֶׁק
  choice: Eshek
  rationale: Isinalin sa titik ang personal na pangalan mula sa Hebreo sa paraang malinaw sa makabagong mambabasang Filipino.
- source_word: אָחִיו
  choice: ng kapatid niyang
  rationale: Pinanatili ang karaniwang kahulugang “kapatid” at ang panghalip na panlalaki. Ang tinutukoy ng “niya” ay naiiwan sa konteksto, gaya sa Hebreo.
- source_word: אוּלָם
  choice: Ulam
  rationale: Tuwirang transliterasyon ng personal na pangalan.
- source_word: בְּכֹרוֹ
  choice: na panganay niya
  rationale: Ang “panganay” ang natural at tiyak na katumbas sa Filipino ng unang isinilang na anak; pinanatili rin ang hulaping panghalip na “niya.”
- source_word: יְעוּשׁ
  choice: Jeus
  rationale: Transliterasyong angkop sa karaniwang pagbasa sa Filipino ng personal na pangalang Hebreo.
- source_word: הַשֵּׁנִי
  choice: na ikalawa
  rationale: Tuwirang ipinapahayag ang pagkakasunod-sunod ng mga anak.
- source_word: וֶאֱלִיפֶלֶט
  choice: at si Elifelet
  rationale: Pinanatili ang pang-ugnay bago ang huling pangalan at ginamit ang natural na panandang “si” para sa personal na pangalan.
- source_word: הַשְּׁלִשִׁי
  choice: na ikatlo
  rationale: Tuwirang ipinapahayag ang ikatlong puwesto sa talaan.
