translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Inayos ang parirala bilang “ang mga anak ng kapatid niyang si Eshek” upang maging natural sa Tagalog, habang pinananatiling hindi tahasang tinutukoy sa mismong talata kung sino ang antecedent ng “niya.”
