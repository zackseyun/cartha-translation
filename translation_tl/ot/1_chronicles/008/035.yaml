base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/035.yaml
  text: 'And the sons of Micah: Pithon[a], Melech, Tarea, and Ahaz.'
translation:
  language: tl
  text: At ang mga anak ni Mica ay sina Piton, Melec, Tarea[a], at Ahaz.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ding baybayin ang pangalang ito na “Tahrea.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי
  choice: At ang mga anak ni
  rationale: Pinananatili ng “At” ang pang-ugnay na ו sa tuloy-tuloy na talaangkanan, at ang בְּנֵי ay isinasaling “mga anak ni” sapagkat mga tuwirang anak na lalaki ang isa-isang pinapangalanan sa konteksto.
- source_word: מִיכָה
  choice: Mica
  rationale: Isinatinig ang pangalang pantangi ayon sa anyong Hebreo at sa likas na baybay sa Filipino.
- source_word: פִּיתוֹן
  choice: Piton
  rationale: Tuwirang pagsasatinig ng pangalang pantangi sa anyong madaling basahin sa Filipino.
- source_word: וָמֶלֶךְ
  choice: Melec
  rationale: Itinuturing itong pangalang pantangi sa talaangkanan, hindi ang karaniwang pangngalang Hebreo na nangangahulugang “hari.” Hindi na inuulit ang pang-ugnay bago sa bawat pangalan upang maging likas ang talaan sa Filipino.
- source_word: וְתַאְרֵעַ
  choice: Tarea
  rationale: Isinatinig ang pangalang pantangi mula sa Hebreo; inilalagay sa talababa ang alternatibong baybay na “Tahrea.”
- source_word: וְאָחָז
  choice: Ahaz
  rationale: Tuwirang pagsasatinig ng personal na pangalan sa kontekstong ito.
theological_decisions: []
translation_notes:
  register: Makabagong Filipino na payak ngunit marangal. Ginamit ang hulma na “ay sina” upang maging malinaw at natural ang pagpapakilala sa talaan ng mga pangalan. Inilipat ang marker [a] sa “Tarea,” dahil ang alternatibong “Tahrea” ay tumutukoy sa Hebreong וְתַאְרֵעַ, hindi sa “Piton.”
