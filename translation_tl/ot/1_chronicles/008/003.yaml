lexical_decisions:
- source_word: וַיִּהְיוּ בָנִים לְבָלַע
  choice: Ang mga anak ni Bela ay
  rationale: Ang literal na anyong “at nagkaroon ng mga anak kay Bela” ay isang Hebreong pormulang pangtalaan ng lahi. Ang piniling salin ay natural sa modernong Tagalog at malinaw na ipinakikilalang mga anak ni Bela ang kasunod na mga pangalan.
- source_word: בָנִים
  choice: mga anak
  rationale: Sa kontekstong talaangkanan, tumutukoy ito sa mga lalaking anak na isa-isang pinangalanan. Natural sa Tagalog ang “mga anak,” at nililinaw ng mga pangalang sumusunod ang konteksto.
- source_word: בָלַע
  choice: Bela
  rationale: Pangalang pantangi na tinumbasan sa karaniwang anyong ginagamit sa Tagalog na transliterasyon ng mga pangalang biblikal.
- source_word: אַדָּר
  choice: Addar
  rationale: Pinananatili ng “Addar” ang dobleng katinig na makikita sa Hebreong baybay; posible rin ang pinasimpleng “Adar.”
- source_word: גֵרָא
  choice: Gera
  rationale: Pangalang pantangi na isinalin sa pamamagitan ng tuwirang transliterasyon.
- source_word: אֲבִיהוּד
  choice: Abihud
  rationale: Pangalang pantangi na isinalin sa pamamagitan ng tuwirang transliterasyon.
