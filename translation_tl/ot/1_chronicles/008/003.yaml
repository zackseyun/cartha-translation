translation_notes:
  register: Makabago, payak, at marangal na Tagalog para sa isang talaangkanan. Ginamit ang natural na hulma na “Ang mga anak ni … ay sina …” sa halip na ang kahoy na literal na Hebreong ayos. Hindi na kailangan ng talababa para sa literal na sintaks sapagkat walang mahalagang kahulugang nawawala; ang tunay na tekstuwal na alternatibo sa baybay ng Addar ang itinanda.
