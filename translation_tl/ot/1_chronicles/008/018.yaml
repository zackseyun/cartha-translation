  register: Maikli, marangal, at natural na modernong Filipino para sa isang talaangkanan. Ginamit ang pangmaramihang pantukoy na 'Sina' at ang hulma na 'ay mga anak ni' upang maipahayag nang malinaw ang sugnay na walang pandiwa sa Hebreo.
