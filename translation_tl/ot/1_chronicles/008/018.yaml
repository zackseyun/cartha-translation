  text: Sina Yishmerai, Yizliah, at Jobab ay mga anak ni Elpaal.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יִשְׁמְרַי
  choice: Yismerai
  rationale: Pangalang pantangi na tinumbasan sa baybay na angkop sa modernong Filipino; pinanatili ang unang tunog na yod bilang Y.
- source_word: יִזְלִיאָה
  choice: Yizlia
  rationale: Pangalang pantangi na transliterado ayon sa anyong Hebreo at sa likas na baybay sa Filipino.
- source_word: יוֹבָב
  choice: Jobab
  rationale: Ginamit ang nakaugaliang anyo ng pangalang biblikal sa Filipino.
- source_word: בְּנֵי
  choice: ay mga anak ni
  rationale: Ang construct plural na 'mga anak ng' ay isinaayos bilang likas na sugnay sa Filipino; idinagdag ang 'ay' upang malinaw ang ugnayang talaangkanan nang walang dagdag na kahulugan.
- source_word: אֶלְפָּעַל
  choice: Elpaal
  rationale: Pangalang pantangi na transliterado sa payak at madaling basahing anyo.
