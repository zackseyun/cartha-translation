base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/012.yaml
  text: 'The sons of Elpaal: Eber[a], Misham, and Shemed[b]; he built Ono and Lod and its villages.'
translation:
  language: tl
  text: Ang mga anak ni Elpaal ay sina Eber, Misam, at Semed. Siya[a] ang nagtayo ng Ono, Lod, at mga nayon nito.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Malamang na si Semed, ang huling binanggit, ang tinutukoy ng “Siya”; maaari rin itong unawain nang mas maluwag bilang pagtukoy sa angkan.
    reason: alternative_reading
  - marker: b
    text: Sa literal, “mga anak na babae nito,” isang idyomang Hebreo para sa mga nayon o pamayanang nasasakupan o nakapaligid sa isang bayan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי אֶלְפַּעַל
  choice: Ang mga anak ni Elpaal
  rationale: Ang construct plural na בְנֵי ay nagpapakilala ng talaangkanan. Hindi na isinama ang panimulang pangatnig upang maging natural sa Filipino, nang hindi binabago ang diwa.
- source_word: עֵבֶר וּמִשְׁעָם וָשָׁמֶד
  choice: Eber, Misam, at Semed
  rationale: Mga pangalang pantangi na tinumbasan ayon sa malinaw at karaniwang pagbabaybay sa Filipino; ang Hebrew na sh ay kinatawan ng s sa Misam at Semed.
- source_word: הוּא
  choice: Siya
  rationale: Malayang panghalip na panlalaking isahan. Pinananatili nito ang panghalip at ang bahagyang kalabuan ng tinutukoy nito sa halip na tahasang palitan ng pangalang Semed.
- source_word: בָּנָה
  choice: ang nagtayo
  rationale: Ang Qal perfect ng בנה ay karaniwang nangangahulugang ‘magtayo’ o ‘bumuo.’ Hindi ginawang ‘nagtatag’ o ‘muling nagtayo,’ sapagkat higit na mapagpakahulugan ang mga iyon.
- source_word: אֶת אוֹנוֹ וְאֶת לֹד
  choice: ng Ono, Lod
  rationale: Mga pangalan ng lugar ang Ono at Lod; hindi isinasalin ang mga direct-object marker sa Filipino.
- source_word: וּבְנֹתֶיהָ
  choice: at ng mga nayon nito
  rationale: Literal itong ‘at ang mga anak na babae nito,’ isang idyomang Hebreo para sa mga pamayanang nakaugnay o nasasakupan ng isang bayan. Ang ‘mga nayon nito’ ay natural ngunit malapit sa kahulugan ng idyoma.
theological_decisions:
- issue: Ang tinutukoy ng panghalip na הוּא
  choice: Pinanatili bilang ‘Siya,’ na may talababa tungkol sa malamang na tinutukoy.
  alternative: ‘Si Semed’ o ‘ang angkan nila’
  rationale: Pinakamalapit na antecedent si Semed, ngunit hindi tahasang inuulit ng tekstong Hebreo ang kaniyang pangalan. Kaya hindi dapat lubusang alisin ang posibleng mas maluwag na pagtukoy sa linya ng pamilya.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang hulma na “Ang mga anak ni… ay sina…” para sa natural na pagpapakilala ng talaan. Pinanatili ang mga pangalan bilang transliterasyon at ang kalabuan ng panghalip sa pamamagitan ng talababa.
