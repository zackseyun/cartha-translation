  text: וְ/עַתָּ֣ה אֱלֹהֵ֔י/נוּ מוֹדִ֥ים אֲנַ֖חְנוּ לָ֑/ךְ וּֽ/מְהַֽלְלִ֖ים לְ/שֵׁ֥ם תִּפְאַרְתֶּֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/013.yaml
  text: And now[a], our God, we give thanks to you and praise the name of your glory.
translation:
  language: tl
  text: At ngayon, aming Diyos, nagpapasalamat kami sa iyo at pinupuri namin ang iyong maluwalhating pangalan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: At ngayon
  rationale: Pinananatili nito ang pang-ugnay na waw at ang panandang pansamantalang naglalahad ng kasalukuyang tugon sa panalangin.
- source_word: אֱלֹהֵינוּ
  choice: aming Diyos
  rationale: Tuwirang inililipat ang pangngalang may hulaping unang panauhang maramihan at natural itong gamitin bilang pantawag sa makabagong Tagalog.
- source_word: מוֹדִים אֲנַחְנוּ לָךְ
  choice: nagpapasalamat kami sa iyo
  rationale: Sa konteksto ng pagsamba, ang Hiphil ng ידה ay tumutukoy sa pasasalamat o pagpupuri; ang 'nagpapasalamat' ay angkop dito at pinananatili ang pagkakaiba sa kasunod na pandiwang 'pinupuri.'
- source_word: וּמְהַלְלִים
  choice: at pinupuri namin
  rationale: Likas na katumbas ng Piel participle ng הלל at malinaw na kaagapay ng naunang sugnay.
- source_word: לְשֵׁם תִּפְאַרְתֶּךָ
  choice: ang iyong maluwalhating pangalan
  rationale: Pinananatili ang mahalagang konsepto ng 'pangalan' habang likas na inililipat sa Tagalog ang konstruksiyong 'pangalan ng iyong kaluwalhatian' bilang panuring na 'maluwalhating pangalan.'
theological_decisions:
- issue: Anyo ng tuwirang pagtawag sa Diyos
  choice: aming Diyos
  alternative: O aming Diyos
  rationale: Tuwiran ang pagtawag sa panalangin, ngunit walang hiwalay na katumbas ang Hebreo na nangangailangan ng idinagdag na 'O'; mas natural sa kasalukuyang Tagalog ang anyong walang liturhikong dagdag.
- issue: Paglilipat sa pariralang tumutukoy sa pangalan at kaluwalhatian ng Diyos
  choice: ang iyong maluwalhating pangalan
  alternative: ang pangalan ng iyong kaluwalhatian
  rationale: Pinananatili ng napiling anyo ang biblikal at teolohikal na kabuluhan ng 'pangalan' at ang diwa ng תִּפְאֶרֶת, habang iniiwasan ang hindi likas na konstruksiyon sa Tagalog.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino Tagalog. Gumagamit ng natural na ayos ng pangungusap sa panalangin nang hindi nagdaragdag ng arkaikong pantawag.
