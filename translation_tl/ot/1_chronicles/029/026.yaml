  yaml_path: translation/ot/1_chronicles/029/026.yaml
  text: And David son of Jesse reigned over all Israel.
translation:
  language: tl
  text: At si David na anak ni Jesse ay naghari sa buong Israel.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/דָוִיד
  choice: At si David
  rationale: Ang וְ ay payak na pang-ugnay sa pagpapatuloy ng salaysay, kaya natural itong isinalin na “At”; pinanatili ang pangalang David sa karaniwang anyong Filipino.
- source_word: בֶּן יִשָׁי
  choice: na anak ni Jesse
  rationale: Tuwirang ipinahahayag ng pariralang konstrakto ang ugnayang genealogical. Ang “na anak ni Jesse” ay natural at malinaw sa modernong Filipino.
- source_word: מָלַךְ
  choice: naghari
  rationale: Ang Qal perfect ng מלך sa kontekstong ito ay tumutukoy sa aktuwal na paghahari, hindi lamang sa pagiging o pagkakahirang na hari.
- source_word: עַל
  choice: sa
  rationale: Kasama ng “naghari,” ang “sa” ang natural na pang-ukol sa Filipino upang tukuyin ang bayan o nasasakupang pinaghaharian; hindi kailangang gayahin ang anyong “over” ng Ingles.
- source_word: כָּל יִשְׂרָאֵל
  choice: buong Israel
  rationale: Ipinahahayag ng כָּל ang kabuuan ng bansang Israel. Ang “buong Israel” ang maikli at likas na katumbas sa Filipino.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na payak ngunit marangal. Ginamit ang “naghari” upang panatilihin ang tiyak na kilos ng pandiwang Hebreo at ang “buong Israel” upang malinaw na maipahayag ang saklaw ng paghahari.
