base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/012.yaml
  text: Both riches and honor come from before you[a], and you rule over all. In your hand are power and might[c][b], and in your hand it is to make great and to strengthen all.
translation:
  language: tl
  text: Ang kayamanan at karangalan[a] ay nagmumula sa iyong harapan[b], at ikaw ang naghahari sa lahat. Nasa iyong kamay ang kapangyarihan at kalakasan, at nasa iyong kamay ang magdakila[c] at magpalakas sa lahat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isaling “kaluwalhatian.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isaling “mula sa iyo” o “mula sa iyong presensiya.” Literal sa Hebreo, “mula sa iyong harapan.”
    reason: lexical_alternative
  - marker: c
    text: Maaari ring isaling “gawing dakila” o “itaas.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעֹשֶׁר
  choice: kayamanan
  rationale: Tumutukoy ito sa materyal na kasaganaan o yaman; natural at marangal ang “kayamanan” sa konteksto ng panalangin.
- source_word: הַכָּבוֹד
  choice: karangalan
  rationale: Sa konteksto, tumutukoy ito sa dangal o mataas na katayuang ipinagkakaloob ng Diyos; pinananatili sa talababa ang posibleng “kaluwalhatian.”
- source_word: מִלְּפָנֶיךָ
  choice: nagmumula sa iyong harapan
  rationale: Pinananatili nito ang konkretong larawan ng Hebreong “mula sa harap/presensiya mo,” sa halip na paikliin lamang bilang “mula sa iyo.”
- source_word: מוֹשֵׁל בַּכֹּל
  choice: ikaw ang naghahari sa lahat
  rationale: Ipinahahayag ng participle ang patuloy at malawak na pamamahala; ang “naghahari” ay natural sa konteksto ng soberanya ng Diyos.
- source_word: בְיָדְךָ
  choice: nasa iyong kamay
  rationale: Pinananatili ang konkretong metapora ng pag-aari, kapamahalaan, at kakayahang kumilos.
- source_word: כֹּחַ
  choice: kapangyarihan
  rationale: Tumutukoy sa kakayahan o kapangyarihang taglay ng Diyos at naihihiwalay nang sapat sa kasunod na גְבוּרָה.
- source_word: גְבוּרָה
  choice: kalakasan
  rationale: Tumutukoy sa makapangyarihang lakas o puwersa; natural itong kapareha ng “kapangyarihan” nang hindi lubusang pinag-iisa ang dalawang salita.
- source_word: לְגַדֵּל
  choice: magpadakila
  rationale: Sa konteksto, ang pagpapaging dakila ay ang pagtataas o pagdakila; natural at maikli ang “magpadakila.”
- source_word: לְחַזֵּק
  choice: magpalakas
  rationale: Tuwirang ipinahahayag ang paggawa sa isang tao o bagay na malakas.
- source_word: לַכֹּל
  choice: sa lahat
  rationale: Pinananatili ang malawak at sadyang hindi tinutukoy na saklaw ng כֹּל, na maaaring tumukoy sa lahat ng tao o bagay.
theological_decisions:
- issue: Ang kaugnayan ng מִלְּפָנֶיךָ sa pinagmumulan ng kayamanan at karangalan
  choice: nagmumula sa iyong harapan
  alternative: nagmumula sa iyo; nagmumula sa iyong presensiya
  rationale: Pinananatili ang Hebreong larawan ng mga bagay na nagmumula sa harapan o presensiya ng Diyos nang hindi ito pinapaliit sa isang mas abstraktong pahayag.
- issue: Ang saklaw ng לַכֹּל
  choice: sa lahat
  alternative: sa bawat isa; sa lahat ng bagay
  rationale: Hindi tahasang nililinaw ng Hebreo kung mga tao lamang o lahat ng nilalang/bagay ang tinutukoy, kaya pinananatili ang tunay na lawak at kalabuan nito.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang dalawang ulit na “nasa iyong kamay” upang maingatan ang diin at konkretong larawan ng Hebreo. Inilagay ang mga talababa sa mismong salitang may alternatibong pagbasa.
