base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/020.yaml
  text: Then David said to all the assembly, “Now bless Yahweh your God.” And all the assembly blessed Yahweh, the God of their fathers, and bowed their heads and prostrated themselves before Yahweh and before the king.
translation:
  language: tl
  text: Pagkatapos, sinabi ni David sa buong kapulungan, “Purihin ninyo ngayon si Yahweh na inyong Diyos.”[a] At pinuri ng buong kapulungan si Yahweh, ang Diyos ng kanilang mga ninuno. Yumukod sila at nagpatirapa sa harap ni Yahweh at sa harap ng hari.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Mangyaring purihin ninyo si Yahweh na inyong Diyos.” Ang salitang Hebreo na נָא ay maaaring magpahiwatig ng pakiusap o agarang paghimok.'
    reason: lexical_alternative
  - marker: b
    text: Ayon sa Hebreo, nagpatirapa sila sa harap “ni Yahweh at ng hari.” Inilalarawan nito ang isang pisikal na pagpapakita ng paggalang; sa ilang salin, ang kilos na nakatuon sa hari ay ipinapahayag bilang “nagbigay-galang.”
    reason: alternative_reading
lexical_decisions:
- source_word: בָּרְכוּ נָא
  choice: Purihin ninyo ngayon
  rationale: Ang imperatibong בָּרְכוּ ay tumutukoy rito sa pagpuri o pagpapahayag ng pagpapala sa Diyos. Ipinahihiwatig ng נָא ang pakiusap o agarang paghimok; natural itong naipapahayag ng “ngayon,” habang inilalahad sa talababa ang “mangyaring” bilang alternatibo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang Hebreo sa transliterasyong karaniwang nauunawaan sa modernong Filipino, sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֵיכֶם
  choice: inyong Diyos
  rationale: Sa kontekstong tumutukoy kay Yahweh, iisa ang kahulugan ng אֱלֹהִים na may hulaping panghalip.
- source_word: הַקָּהָל
  choice: buong kapulungan
  rationale: Ang קָהָל ay ang sambayanang nagkatipon. Ang “kapulungan” ay marangal at malinaw sa pampublikong tagpong ito.
- source_word: אֱלֹהֵי אֲבֹתֵיהֶם
  choice: ang Diyos ng kanilang mga ninuno
  rationale: Ang “mga ninuno” ay natural at inklusibong katumbas sa modernong Filipino ng Hebreong idyomang tumutukoy sa mga ama o mga ninunong pinagmulan ng Israel.
- source_word: וַיִּקְּדוּ
  choice: yumukod sila
  rationale: Ang קדד ay nagsasaad ng pagyukod. Hindi idinaragdag ang “ulo,” na hindi tahasang nasa Hebreo, at napapanatili ang pagkakaiba nito sa kasunod na ganap na pagpapatirapa.
- source_word: וַיִּשְׁתַּחֲווּ
  choice: nagpatirapa
  rationale: Pinananatili nito ang kongkretong kilos ng שׁחה sa halip na agad itong bigyang-kahulugang “sumamba,” lalo na dahil kapuwa sina Yahweh at ang hari ang kasunod na tinutukoy.
- source_word: לַיהוָה וְלַמֶּלֶךְ
  choice: sa harap ni Yahweh at sa harap ng hari
  rationale: Sa kasamang pandiwang naglalarawan ng pagpapatirapa, natural ang “sa harap.” Ang pag-uulit nito ay nagpapanatili sa dalawang tahasang layon nang hindi nagpapahiwatig na magkapareho ang uri ng parangal sa Diyos at sa hari.
theological_decisions:
- issue: Ang kilos ng bayan na nakatuon kapuwa kay Yahweh at sa hari
  choice: 'Panatilihin ang pisikal na paglalarawan: “Yumukod sila at nagpatirapa sa harap ni Yahweh at sa harap ng hari.”'
  alternative: “Sumamba sila kay Yahweh at nagbigay-galang sa hari,” o “sumamba sila kay Yahweh at sa hari.”
  rationale: Iisang hanay ng mga pandiwang pisikal ang inilalahad ng Hebreo bago ang dalawang layon. Ang kongkretong salin ay hindi nagpapantay sa hari at sa Diyos, ngunit hindi rin nito hinahati o binibigyang-interpretasyon ang kilos nang higit sa sinasabi ng teksto.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “kapulungan” para sa pampublikong pagtitipon at “nagpatirapa” upang mapanatili ang pisikal na kilos at ang teolohikal na tensiyon ng Hebreo.
