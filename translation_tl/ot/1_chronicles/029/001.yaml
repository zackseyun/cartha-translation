base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/001.yaml
  text: Then King David said to all the assembly, “Solomon my son, the one God has chosen, is young and inexperienced, and the work is great; for the palace is not for man, but for the LORD God.”
translation:
  language: tl
  text: Pagkatapos, sinabi ni Haring David sa buong kapulungan, “Ang anak kong si Solomon, ang siyang pinili ng Diyos, ay bata pa at walang karanasan. Napakalaki ng gawain, sapagkat ang palasyo ay hindi para sa tao kundi para kay Yahweh na Diyos.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַקָּהָל
  choice: buong kapulungan
  rationale: Tumutukoy sa nagkakatipong sambayanan o opisyal na pagtitipon; ang “kapulungan” ay likas at marangal sa modernong Filipino.
- source_word: אֶחָד בָּחַר בּוֹ אֱלֹהִים
  choice: ang siyang pinili ng Diyos
  rationale: Pinananatili ang diin sa nag-iisang tinutukoy na si Solomon nang hindi ipinapakahulugang siya lamang sa lahat ng posibleng tao ang pinili ng Diyos.
- source_word: נַעַר וָרָךְ
  choice: bata pa at walang karanasan
  rationale: Ang tambalan ay nagpapahayag ng kabataan at pagiging hindi pa handa o sanay; mas natural ito kaysa literal na “bata at malambot.”
- source_word: הַמְּלָאכָה גְדוֹלָה
  choice: Napakalaki ng gawain
  rationale: Inihahatid ang laki at bigat ng proyektong pagtatayo.
- source_word: הַבִּירָה
  choice: templong ito
  rationale: Sa konteksto, tumutukoy ito sa dakilang gusaling inilaan para kay Yahweh; “templo” ang pinakamalinaw na tawag sa Filipino, bagaman maaari ring literal na “palasyo.”
- source_word: יהוה אֱלֹהִים
  choice: Yahweh na Diyos
  rationale: Isinasalin ang banal na pangalang יהוה bilang “Yahweh” at nililinaw ang appositional na ugnayan sa “Diyos.”
theological_decisions:
- issue: Saklaw ng אֶחָד sa pagpili kay Solomon
  choice: ang siyang pinili ng Diyos
  alternative: ang tanging pinili ng Diyos
  rationale: Hindi ipinipilit ang absolutong eksklusibidad; ang Hebreo ay maaaring magdiin na si Solomon, bagaman nag-iisa o bata, ang pinili para sa gawaing ito.
- issue: Paglalarawan sa gusali bilang הַבִּירָה
  choice: templong ito
  alternative: palasyo
  rationale: Ang kasunod na pahayag na ito ay para kay Yahweh, hindi para sa tao, ay nagpapakitang ang tinutukoy ay ang templo; gayunman, kinikilalang ang literal na termino ay maaaring mangahulugang palasyo o muog.
translation_notes:
  register: Modernong Filipino na malinaw, dignified, at angkop sa pampublikong pagbasa. Ginamit ang “Yahweh” para sa tetragrammaton at “kapulungan” para sa pormal na pagtitipon. Hinati sa dalawang pangungusap ang mahabang pahayag upang maging natural sa Filipino.
