  yaml_path: translation/ot/1_chronicles/029/024.yaml
  text: And all the officials[a], the mighty men, and also all the sons of King David pledged allegiance to King Solomon.
translation:
  language: tl
  text: At ang lahat ng mga pinuno, ang mga magigiting, at pati ang lahat ng mga anak ni Haring David ay nagpasakop at nangakong magiging tapat kay Haring Solomon.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “ibinigay ang kamay sa ilalim ni Haring Solomon”—isang idyomang Hebreo na nangangahulugang nagpasakop o nangakong magiging tapat sa isang pinuno.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָּׂרִים
  choice: mga pinuno
  rationale: Malawak ang saklaw ng salita—mga taong may mataas na katungkulan o kapangyarihan. Natural sa modernong Filipino ang “mga pinuno” at hindi nito nililimitahan ang tinutukoy sa mga opisyal ng hukbo.
- source_word: גִּבֹּרִים
  choice: mga magigiting na mandirigma
  rationale: Madalas tumukoy ang termino sa matatapang at makapangyarihang lalaki na may tungkuling militar. Ipinahahayag ng saling ito ang lakas ng loob at kontekstong pandigma sa natural na Filipino.
- source_word: בְּנֵי הַמֶּלֶךְ דָּוִיד
  choice: mga anak ni Haring David
  rationale: Tuwirang pinananatili ang ugnayang pampamilya at ang maharlikang titulo ni David.
- source_word: נָתְנוּ יָד תַּחַת
  choice: nagpasakop at nangakong magiging tapat kay
  rationale: Ang literal na idyomang “ibinigay ang kamay sa ilalim” ay nagpapahiwatig ng pagkilala sa awtoridad at matapat na pagsunod. Pinananatili ng dobleng parirala ang dalawang kaugnay na diwa nang hindi gumagamit ng di-natural na literal na salin.
- source_word: שְׁלֹמֹה הַמֶּלֶךְ
  choice: Haring Solomon
  rationale: Ito ang natural na ayos ng titulo at pangalan sa Filipino, habang malinaw na kinikilala ang maharlikang katayuan ni Solomon.
theological_decisions:
- issue: Saklaw ng idyomang נָתְנוּ יָד תַּחַת
  choice: nagpasakop at nangakong magiging tapat
  alternative: sumumpa ng katapatan; nagpasakop
  rationale: Hindi tahasang sinasabi ng Hebreo kung pormal na panunumpa ang ginawa. Ang piniling salin ay naghahatid ng pagpapasakop at katapatan nang hindi tiyakang ipinapalagay ang isang partikular na seremonya o pormula ng panunumpa.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “pati” upang natural na ipahayag ang mariing וְגַם, at inilagay ang talababa sa idyomang ipinaliliwanag nito.
