  to: Bukod dito, dahil nalulugod ako sa bahay ng aking Diyos, mayroon akong sarili kong kayamanan[a]—ginto at pilak—at ibinigay ko ito sa bahay ng aking Diyos, bukod pa sa lahat ng inihanda ko para sa banal na bahay[b].
