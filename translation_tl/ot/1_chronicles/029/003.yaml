  text: וְ/ע֗וֹד בִּ/רְצוֹתִ/י֙ בְּ/בֵ֣ית אֱלֹהַ֔/י יֶשׁ לִ֥/י סְגֻלָּ֖ה זָהָ֣ב וָ/כָ֑סֶף נָתַ֤תִּי לְ/בֵית אֱלֹהַ/י֙ לְ/מַ֔עְלָ/ה מִ/כָּל הֲכִינ֖וֹתִי לְ/בֵ֥ית הַ/קֹּֽדֶשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/003.yaml
  text: Moreover[a], because of my delight in the house of my God, I have a personal treasure of gold and silver, and I have given it to the house of my God[c][b], over and above all that I have prepared for the holy house.
translation:
  language: tl
  text: Bukod dito, dahil nalulugod ako sa bahay ng aking Diyos, mayroon akong sarili kong kayamanan[a]—ginto at pilak—at ibinigay ko ito sa bahay ng aking Diyos, bukod pa sa lahat ng inihanda ko para sa banal na bahay[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “natatangi kong kayamanan” o “sarili kong ari-arian.” Ang salitang Hebreo ay tumutukoy sa mahalagang personal na pag-aari.
    reason: lexical_alternative
  - marker: b
    text: O “santuwaryo.” Sa literal, “banal na bahay.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעוֹד
  choice: Bukod dito
  rationale: Ipinahihiwatig ang karagdagang ambag na idinaragdag ni David sa mga nabanggit na niyang paghahanda.
- source_word: בִּרְצוֹתִי בְּבֵית אֱלֹהַי
  choice: dahil nalulugod ako sa bahay ng aking Diyos
  rationale: Ipinapanatili ang sanhi o motibo at ang bahay ng Diyos bilang layon ng kasiyahan ni David; maaari ring unawain ang ב bilang ‘para sa.’
- source_word: יֶשׁ לִי סְגֻלָּה
  choice: sarili kong kayamanan
  rationale: Ang סְגֻלָּה rito ay mahalagang ari-ariang personal ni David, na itinatangi sa dati na niyang inihanda.
- source_word: זָהָב וָכָסֶף
  choice: ginto at pilak
  rationale: Tuwirang katumbas ng dalawang materyal na binanggit.
- source_word: נָתַתִּי
  choice: ibinibigay ko rin
  rationale: Sa konteksto ng pampublikong pahayag ni David, malinaw na ipinahahayag niya ang pagkakaloob ng personal niyang kayamanan; ang aspektong Filipino ay natural para sa kilos na ipinapahayag bilang kasalukuyang handog.
- source_word: לְמַעְלָה מִכָּל הֲכִינוֹתִי
  choice: bukod pa sa lahat ng inihanda ko
  rationale: Malinaw na ipinakikita ang dagdag na ambag higit sa naunang kabuuang paghahanda.
- source_word: לְבֵית הַקֹּדֶשׁ
  choice: para sa banal na bahay
  rationale: Pinananatili ang literal na ‘bahay’ at ang pagkakatalaga nito bilang banal; ang ‘santuwaryo’ ay mas natural na alternatibo.
theological_decisions:
- issue: Terminong tumutukoy sa templo sa pananalita ni David
  choice: bahay / banal na bahay
  alternative: templo / santuwaryo
  rationale: Paulit-ulit na בית ang gamit ng Hebreo. Pinananatili ng ‘bahay’ ang larawan ng tahanan ng Diyos nang hindi ipinapasok ang mas interpretatibong ‘templo.’
- issue: Kaugnayan ng kasiyahan ni David sa bahay ng Diyos
  choice: nalulugod ako sa bahay ng aking Diyos
  alternative: dahil sa pagmamahal ko para sa bahay ng aking Diyos
  rationale: Pinananatili ang posibleng diwa ng ב bilang saklaw o layon ng pagkalugod, habang kinikilala na maaari rin itong ipakahulugang ‘para sa.’
translation_notes:
  register: Makabagong Filipino na marangal ngunit madaling maunawaan. Ginamit ang ‘bahay’ upang mapanatili ang pag-uulit ng בית, at ‘sarili kong kayamanan’ upang malinaw ang kaibahan ng personal na handog ni David sa dati na niyang inihanda.
