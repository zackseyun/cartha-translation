  terminology: Ang "bayan," "kusang-loob na naghandog," at "Yahweh" ay angkop. Pinanatili ang pag-uulit ng kusang-loob na paghahandog, na sumasalamin sa pag-uulit ng ugat נדב sa Hebreo.
