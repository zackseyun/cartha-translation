base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/009.yaml
  text: Then the people rejoiced because they had offered willingly[a], for with a whole heart they had offered willingly to Yahweh[b]; and David the king also rejoiced with great joy.
translation:
  language: tl
  text: At nagalak ang bayan dahil kusang-loob silang naghandog[a], sapagkat nang buong puso[b] ay kusang-loob silang naghandog kay Yahweh; at si Haring David ay nagalak din nang lubos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “dahil sa kanilang kusang-loob na handog.” Binibigyang-diin ng salitang Hebreo ang malaya at bukal-sa-loob na pagbibigay.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “may buong puso,” na nagpapahayag ng tapat o hindi nahahating kalooban.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂמְחוּ הָעָם
  choice: Kaya nagalak ang bayan
  rationale: Ang “nagalak” ay tuwirang katumbas ng pandiwa ng kagalakan, at ang “kaya” ay maayos na nag-uugnay sa salaysay na nagpapatuloy mula sa naunang talata.
- source_word: עַל הִתְנַדְּבָם
  choice: dahil kusang-loob silang naghandog
  rationale: Ipinahahayag ng עַל dito ang dahilan ng kagalakan, samantalang binibigyang-diin ng Hitpael ng נדב ang malaya at bukal-sa-loob na pagbibigay sa konteksto ng mga ambag para sa templo.
- source_word: בְּלֵב שָׁלֵם
  choice: buong puso
  rationale: Pinananatili ang konkretong idyomang Hebreo at ang diwa ng tapat, buo, at hindi nahahating loob.
- source_word: הִתְנַדְּבוּ לַיהוָה
  choice: kusang-loob na naghandog kay Yahweh
  rationale: Inuulit ang parehong diwa ng ugat na נדב at malinaw na ipinakikitang si Yahweh ang pinag-ukulan ng handog.
- source_word: דָּוִיד הַמֶּלֶךְ
  choice: si David na hari
  rationale: Pinananatili ang Hebreong ayos na pangngalan kasunod ang titulo habang nananatiling natural sa Filipino.
- source_word: שָׂמַח שִׂמְחָה גְדוֹלָה
  choice: nagalak din nang labis
  rationale: Likas na Filipino para sa Hebreong masidhing pahayag na literal na ‘nagalak ng malaking kagalakan,’ nang hindi nagiging mabigat o artipisyal.
theological_decisions:
- issue: Pagbibigay-kahulugan sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Ginagamit ng tekstong Hebreo ang Tetragrammaton bilang personal na pangalan. Ang transliterasyong “Yahweh” ay pinananatili ang pagkakakilanlan nito bilang pangalan at hindi lamang titulo.
- issue: Kahulugan ng בְּלֵב שָׁלֵם
  choice: buong puso
  alternative: taos-puso / pusong hindi nahahati
  rationale: Hindi nililimitahan ang parirala sa damdamin lamang; pinananatili nito ang posibleng diwa ng ganap na katapatan, integridad, at hindi nahahating debosyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “bayan” para sa nagkakatipong sambayanan, “kusang-loob” para sa paulit-ulit na ugat ng boluntaryong pagbibigay, at “buong puso” upang mapanatili ang larawang Hebreo nang hindi tunog lipas.
