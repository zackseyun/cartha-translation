base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/022.yaml
  text: And they ate and drank before Yahweh on that day with great joy[a], and they made Solomon son of David king a second time, and they anointed him for Yahweh as ruler[d][c][b], and Zadok as priest.
translation:
  language: tl
  text: Noong araw na iyon, kumain sila at uminom sa harap ni Yahweh nang may malaking kagalakan. At sa ikalawang pagkakataon ay ginawa nilang hari si Solomon, na anak ni David. Pinahiran nila siya para kay Yahweh bilang pinuno, at si Zadok bilang pari.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִפְנֵי יְהוָה
  choice: sa harap ni Yahweh
  rationale: Tuwirang pinananatili ang diwang ‘sa harap’ o ‘sa presensya’ ni Yahweh at ang kontekstong pagsamba.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang transliterasyon ng banal na pangalan sa halip na palitan ito ng isang titulo.
- source_word: בְּשִׂמְחָה גְדוֹלָה
  choice: nang may malaking kagalakan
  rationale: Likas at marangal na Filipino para sa paraang inilalarawan ng parirala, habang pinananatili ang tindi ng kasiyahan.
- source_word: וַיַּמְלִיכוּ
  choice: ginawa nilang hari
  rationale: Ipinahahayag ng Hiphil ng מלך ang pagpapaghari o paggawa sa isang tao bilang hari; hindi nagdaragdag ng koronasyong hindi tahasang binanggit.
- source_word: שֵׁנִית
  choice: sa ikalawang pagkakataon
  rationale: Pinananatili ang tiyak na kahulugan ng pag-uulit, hindi lamang ang mas maluwag na ‘muli.’
- source_word: וַיִּמְשְׁחוּ
  choice: pinahiran nila
  rationale: Karaniwang salitang biblikal para sa ritwal na pagpapahid kaugnay ng pagtatalaga sa hari o pari.
- source_word: לַיהוָה
  choice: para kay Yahweh
  rationale: Pinananatili ang posibleng diwa ng paglalaan o pagtatalaga kaugnay kay Yahweh nang hindi nililimitahan sa lokasyong seremonyal.
- source_word: לְנָגִיד
  choice: bilang pinuno
  rationale: Malinaw na naghahatid ng awtoridad at pamumuno ng נָגִיד, nang hindi ipinahihiwatig ang makabagong kahulugan ng ‘prinsipe.’
- source_word: לְכֹהֵן
  choice: bilang pari
  rationale: Tuwirang tumutukoy sa katungkulan ni Zadok at kaagapay ng pagtatalaga kay Solomon.
- source_word: בֶן דָּוִיד
  choice: anak ni David
  rationale: Likas na Filipino na pinananatili ang ugnayang dinastiko ni Solomon kay David.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Ang tekstong Hebreo ay gumagamit ng Tetragrammaton; ang ‘Yahweh’ ay nagpapanatili rito bilang personal na pangalan sa halip na palitan ng titulo.
- issue: Kahulugan ng לַיהוָה sa sugnay tungkol sa pagpapahid
  choice: pinahiran nila siya para kay Yahweh
  alternative: pinahiran nila siya sa harap ni Yahweh; pinahiran nila siya ukol kay Yahweh
  rationale: Maaaring magpahiwatig ang lamed ng paglalaan kay Yahweh o ng kilos na isinagawa sa kanyang harapan. Pinananatili ng pangunahing salin ang kaugnayan at pagtatalaga kay Yahweh, habang itinatala sa talababa ang tunay na alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘nang araw na iyon’ bilang likas na panahong parirala at pinanatili ang magkatulad na pagtatalaga kina Solomon at Zadok. Isang talababa ang nag-iingat sa leksikal at teolohikal na kalabuan ng לַיהוָה at נָגִיד.
