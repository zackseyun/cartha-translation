base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/014.yaml
  text: But who am I[a], and who are my people, that we should be able to offer willingly like this? For everything comes from you, and from your hand we have given to you.
translation:
  language: tl
  text: Ngunit sino ba ako, at sino ang aking bayan, upang magkaroon kami ng kakayahang kusang-loob na maghandog nang ganito?[a] Sapagkat ang lahat ay mula sa iyo, at ang ibinigay namin sa iyo ay mula sa iyong kamay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O, mas literal: “upang magkaroon kami ng lakas na kusang-loob na maghandog nang ganito?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: Ngunit
  rationale: Ipinahihiwatig ng pang-ugnay ang mapagpakumbabang pagliko sa retorikal na tanong; natural itong naipapahayag ng “Ngunit” sa Filipino.
- source_word: מִי אֲנִי וּמִי עַמִּי
  choice: sino ba ako, at sino ang aking bayan
  rationale: Pinananatili ang tanong na “sino” at ang retorikal na diwa ng kababaan; ang “ba” ay nagbibigay ng natural na diin sa modernong Filipino.
- source_word: נַעְצֹר כֹּחַ
  choice: magkaroon kami ng kakayahan
  rationale: Ang literal na idyoma ay tungkol sa paghawak o pagtataglay ng lakas, ngunit sa konteksto ay tumutukoy sa kapasidad o kakayahang makapag-ambag.
- source_word: לְהִתְנַדֵּב
  choice: kusang-loob na maghandog
  rationale: Ipinapahayag ng hitpael ng נדב ang boluntaryo at bukal-sa-loob na paghahandog; ang “maghandog” ay angkop sa konteksto ng ambag para sa templo nang hindi nagiging labis na teknikal.
- source_word: כָּזֹאת
  choice: nang ganito
  rationale: Tumutukoy ito sa pambihirang paraan at laki ng kusang paghahandog na inilalarawan sa konteksto.
- source_word: מִמְּךָ הַכֹּל
  choice: ang lahat ay mula sa iyo
  rationale: Direktang pinananatili ang pahayag na ang Diyos ang pinagmumulan ng lahat, nang hindi nagdaragdag ng paliwanag na wala sa Hebreo.
- source_word: וּמִיָּדְךָ
  choice: mula sa iyong kamay
  rationale: Pinananatili ang malinaw na larawang Hebreo ng kamay bilang pinagmumulan ng ipinagkakaloob.
- source_word: נָתַנּוּ לָךְ
  choice: ang ibinigay namin sa iyo
  rationale: Natural na ipinapahayag sa Filipino ang natapos na pagbibigay at pinananatili ang diin sa “sa iyo.”
theological_decisions:
- issue: Pagmamay-ari ng Diyos at pagbibigay ng tao
  choice: Ipinahahayag na ang lahat ay mula sa Diyos at na ang ibinigay ng bayan ay nagmula rin sa kanyang kamay.
  alternative: “Ibinalik lamang namin sa iyo ang pag-aari mo na”
  rationale: Tapat ang piniling anyo sa tahasang sinasabi ng Hebreo tungkol sa pinagmulan ng lahat at sa pagbibigay mula sa kamay ng Diyos, habang iniiwasan ang interpretatibong pagpapalawak na “ibinalik lamang.”
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang retorikal na kababaan, ang kusang-loob na katangian ng handog, at ang larawang “mula sa iyong kamay.”
