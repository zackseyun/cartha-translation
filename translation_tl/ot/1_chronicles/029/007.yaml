base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/007.yaml
  text: And they gave for the service of the house of God five thousand talents of gold and ten thousand darics[a], and ten thousand talents of silver, and eighteen thousand talents of bronze[c][b], and one hundred thousand talents of iron.
translation:
  language: tl
  text: At nagbigay sila para sa paglilingkod sa bahay ng Diyos ng 5,000 talento ng ginto, 10,000 dariko[a], 10,000 talento ng pilak, 18,000 talento ng tanso, at 100,000 talento ng bakal.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang dariko ay isang gintong baryang Persiano.
    reason: cultural_note
  - marker: b
    text: Ang talento ay isang malaking sinaunang yunit ng timbang, hindi “talento” sa kahulugang likas na kakayahan.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּתְּנוּ
  choice: At nagbigay sila
  rationale: Tuwirang inilalahad ng pandiwa ang natapos na pagbibigay; hindi na dinaragdagan ng mas tiyak na kahulugang gaya ng “nag-abuloy.”
- source_word: לַעֲבוֹדַת בֵּית הָאֱלֹהִים
  choice: para sa paglilingkod sa bahay ng Diyos
  rationale: Pinananatili ng “paglilingkod” ang lawak ng עֲבוֹדָה, na maaaring tumukoy sa gawain at paglilingkod kaugnay ng bahay ng Diyos. Ang “bahay ng Diyos” ay malapit sa anyo ng Hebreo at hindi agad pinapalitan ng mas tiyak na “templo.”
- source_word: כִּכָּרִים
  choice: talento
  rationale: Tradisyonal na katawagan ito sa malaking sinaunang yunit ng timbang; nililinaw sa talababa upang hindi mapagkamalang likas na kakayahan.
- source_word: אֲדַרְכֹנִים
  choice: dariko
  rationale: Isinasalin sa anyong hiram ang tiyak na pangalan ng gintong baryang Persiano sa halip na gawing pangkalahatang “mga baryang ginto.”
- source_word: נְחֹשֶׁת
  choice: tanso
  rationale: Maaaring tumukoy ang salitang Hebreo sa copper o bronze. Ang “tanso” ay likas at malawak na katawagang Filipino para sa metal na ito sa kontekstong biblikal, nang hindi nagkukunwaring tiyak ang haluang metal.
- source_word: רִבּוֹ וּשְׁמוֹנַת אֲלָפִים
  choice: 18,000
  rationale: Ang literal na “sampung libo at walong libo” ay natural na ipinapahayag sa Filipino bilang kabuuang 18,000.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang mga numerong digit upang madaling mabasa ang mahahabang talaan ng dami. Pinanatili ang “bahay ng Diyos” at “paglilingkod” upang manatiling malapit sa Hebreo nang hindi nagiging di-likas.
