  source_fidelity: 'Tumpak na naipapahayag ang Hebreong talaan: ang pagbibigay para sa paglilingkod sa bahay ng Diyos, 5,000 talento ng ginto, 10,000 dariko, 10,000 talento ng pilak, 18,000 talento ng tanso, at 100,000 talento ng bakal. Wastong pinagsama ang ''isang sampung libo at walong libo'' bilang 18,000.'
