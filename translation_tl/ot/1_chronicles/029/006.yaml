id: 1CH.29.6
reference: 1 Chronicles 29:6
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יִּֽתְנַדְּבוּ֩ שָׂרֵ֨י הָ/אָב֜וֹת וְ/שָׂרֵ֣י שִׁבְטֵ֣י יִשְׂרָאֵ֗ל וְ/שָׂרֵ֤י הָ/אֲלָפִים֙ וְ/הַ/מֵּא֔וֹת וּ/לְ/שָׂרֵ֖י מְלֶ֥אכֶת הַ/מֶּֽלֶךְ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/006.yaml
  text: Then the leaders of the fathers’ houses[a], and the leaders of the tribes of Israel, and the commanders of the thousands and of the hundreds, and the overseers of the king’s work[c][b], gave willingly.
translation:
  language: tl
  text: Pagkatapos, kusang-loob na nagbigay[a] ang mga pinuno ng mga angkan[b], ang mga pinuno ng mga lipi ng Israel, ang mga pinuno ng mga pangkat na tig-iisang libo at tig-iisang daan[c], at ang mga tagapangasiwa sa gawain ng hari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “kusang-loob na naghandog.” Binibigyang-diin ng pandiwang Hebreo na malaya at bukal sa loob ang kanilang pagtugon; sa kontekstong ito, tumutukoy ito sa pagbibigay ng ambag.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “mga sambahayan ng mga ama,” na tumutukoy sa mga pangkat ng pamilya o angkan batay sa pinagmulang ninuno.
    reason: cultural_note
  - marker: c
    text: Ang “tig-iisang libo at tig-iisang daan” ay tumutukoy sa mga yunit na militar o administratibo, kaya ang tinutukoy rito ay ang mga pinuno ng mga yunit na iyon.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּתְנַדְּבוּ
  choice: kusang-loob na nagbigay
  rationale: Ang hitpael ng נדב ay nagpapahayag ng malayang pagkukusa. Dahil materyal na ambag ang tinatalakay sa konteksto, mas tiyak ang “kusang-loob na nagbigay” kaysa “nagboluntaryo.”
- source_word: שָׂרֵי
  choice: mga pinuno
  rationale: Malawak at natural na tawag ito sa mga taong may awtoridad at angkop sa iba’t ibang pangkat na nakatala sa talata.
- source_word: הָאָבוֹת
  choice: mga angkan
  rationale: Tumutukoy ito sa mga sambahayang nakabatay sa lahi ng ama o sa mga pangkat ng magkakamag-anak. Natural sa modernong Filipino ang “mga angkan,” habang nililinaw sa talababa ang estrukturang panlipunan.
- source_word: שִׁבְטֵי יִשְׂרָאֵל
  choice: mga lipi ng Israel
  rationale: Tuwiran at karaniwang salin para sa mga tribal na pangkat ng Israel.
- source_word: הָאֲלָפִים וְהַמֵּאוֹת
  choice: mga pangkat na tig-iisang libo at tig-iisang daan
  rationale: Ang mga bilang ay katawagan sa mga yunit na militar o administratibo. Inihahayag ng “mga pangkat” ang ipinahihiwatig na yunit nang hindi nililimitahan ito sa hukbo lamang.
- source_word: וּלְשָׂרֵי מְלֶאכֶת הַמֶּלֶךְ
  choice: at ang mga tagapangasiwa sa gawain ng hari
  rationale: Ipinagpapatuloy nito ang talaan ng mga opisyal. Ang “tagapangasiwa” ay angkop sa pananagutan nila sa gawain ng hari, at pinananatiling malawak ng “gawain” ang saklaw ng מְלָאכָה.
theological_decisions: []
translation_notes:
  register: Gumamit ng makabago, malinaw, at marangal na Filipino. Pinanatili ang sunod-sunod na talaan ng mga pinuno, ngunit ginawang likas sa Filipino ang pandiwa sa unahan at ipinaliwanag sa mga talababa ang sinaunang organisasyong pampamilya at pang-administratibo.
