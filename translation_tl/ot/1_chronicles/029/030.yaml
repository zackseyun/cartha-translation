  yaml_path: translation/ot/1_chronicles/029/030.yaml
  text: along with all his reign and his might[b][a], and the times that passed over him and over Israel and over all the kingdoms of the lands.
translation:
  language: tl
  text: kasama ang lahat ng kanyang paghahari at kapangyarihan, at ang mga panahong dumaan sa kanya[a], sa Israel, at sa lahat ng kaharian ng mga lupain[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “na sumapit sa kanya.” Literal sa Hebreo, “na dumaan sa kanya.”
    reason: lexical_alternative
  - marker: b
    text: O “lahat ng kaharian ng mga bansa.” Pangmaramihan sa Hebreo ang “mga lupain,” na tumutukoy sa mga nakapaligid na teritoryo o bansa.
    reason: lexical_alternative
lexical_decisions:
- source_word: עִם
  choice: kasama
  rationale: Likas na panandang nag-uugnay sa mga naunang nakatalang ginawa ni David at sa karagdagang buod na ito.
- source_word: מַלְכוּתוֹ
  choice: ang buong paghahari niya
  rationale: Sa buod ng buhay at pamumuno ni David, ang kahulugang tumutukoy sa panahon at gawain ng paghahari ay mas angkop kaysa sa teritoryal na “kaharian.” Isinasalamin ng “buong” ang כָּל.
- source_word: גְבוּרָתוֹ
  choice: ang kanyang kapangyarihan
  rationale: Maaaring tumukoy ang pangngalan sa lakas, kapangyarihan, o magigiting na gawa. Pinananatili ng “kapangyarihan” ang lawak ng salita nang hindi ito nililimitahan sa mga tiyak na gawa.
- source_word: הָעִתִּים
  choice: ang mga panahon
  rationale: Tuwirang salin ng pangmaramihang pangngalan, na maaaring sumaklaw sa mga yugto at kalagayan ng buhay ni David at ng kasaysayan ng Israel.
- source_word: אֲשֶׁר עָבְרוּ עָלָיו
  choice: na dumaan sa kanya
  rationale: Pinananatili ang larawan ng idyomang Hebreo na literal na nagsasabing ang mga panahon ay “dumaan” sa isang tao; inilalagay sa talababa ang mas malinaw na alternatibo.
- source_word: וְעַל יִשְׂרָאֵל
  choice: sa Israel
  rationale: Sa Filipino, hindi kailangang ulitin ang “dumaan” upang mapanatili ang paralelismo; nananatiling malinaw na saklaw ng pandiwa ang Israel.
- source_word: כָּל מַמְלְכוֹת הָאֲרָצוֹת
  choice: lahat ng kaharian ng mga lupain
  rationale: Pinananatili ang pangmaramihang “mga lupain,” na malamang na tumutukoy sa mga nakapaligid na teritoryo o bansa, sa halip na palawakin ito bilang buong daigdig.
