  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יִּזְבְּח֣וּ לַ/יהוָ֣ה זְ֠בָחִים וַ/יַּעֲל֨וּ עֹל֜וֹת לַ/יהוָ֗ה לְֽ/מָחֳרַת֮ הַ/יּ֣וֹם הַ/הוּא֒ פָּרִ֨ים אֶ֜לֶף אֵילִ֥ים אֶ֛לֶף כְּבָשִׂ֥ים אֶ֖לֶף וְ/נִסְכֵּי/הֶ֑ם וּ/זְבָחִ֥ים לָ/רֹ֖ב לְ/כָל יִשְׂרָאֵֽל׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/021.yaml
  text: 'They sacrificed sacrifices to Yahweh and offered up burnt offerings to Yahweh on the next day after that day: one thousand bulls[a], one thousand rams, one thousand lambs, and their drink offerings[c][b], and sacrifices in abundance for all Israel.'
translation:
  language: tl
  text: 'Kinabukasan ng araw na iyon, nag-alay sila ng mga hain kay Yahweh at naghandog ng mga handog na sinusunog kay Yahweh: isang libong toro, isang libong lalaking tupa, isang libong batang tupa, at ang mga handog na inumin na kasama ng mga iyon.[a] Nag-alay rin sila ng napakaraming hain para sa buong Israel.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “mga handog na inumin” ay mga likidong handog na ibinubuhos kasabay ng mga handog na hayop; maaari ring tawaging “mga libasyon.”
    reason: cultural_note
  - marker: b
    text: Maaari ring isalin na “alang-alang sa buong Israel.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּזְבְּחוּ ... זְבָחִים
  choice: nag-alay sila ng mga hain
  rationale: Likas sa makabagong Tagalog at malinaw na tumutukoy sa ritwal na paghahain; iniiwasan ang alanganing literal na pag-uulit na “naghain sila ng mga hain” nang hindi binubura ang kultikong diwa.
- source_word: לַיהוָה
  choice: kay Yahweh
  rationale: Pinananatili ang personal na pangalang tipan na יהוה at ang direksiyon o pagtatalaga ng handog sa kanya.
- source_word: עֹלוֹת
  choice: mga handog na sinusunog
  rationale: Ibinubukod ito sa pangkalahatang זְבָחִים at malinaw na tumutukoy sa handog na sinusunog sa altar.
- source_word: לְמָחֳרַת הַיּוֹם הַהוּא
  choice: Kinabukasan ng araw na iyon
  rationale: Natural ngunit malapit sa bahagyang mariing pormula ng Hebreo, sa halip na payak lamang na “kinabukasan.”
- source_word: פָּרִים אֶלֶף
  choice: isang libong toro
  rationale: Ang פָּרִים ay mga lalaking baka na angkop sa paghahain; “toro” ang maikli at karaniwang katumbas.
- source_word: אֵילִים אֶלֶף
  choice: isang libong lalaking tupa
  rationale: Tiyak na mga ram ang tinutukoy; mas madaling maunawaan ng karaniwang mambabasa ang “lalaking tupa” kaysa sa hiram o teknikal na salita.
- source_word: כְּבָשִׂים אֶלֶף
  choice: isang libong batang tupa
  rationale: Sa kontekstong panghandog, tumutukoy ito sa mga kordero o batang tupa; pinili ang pangkaraniwang makabagong pananalita.
- source_word: וְנִסְכֵּיהֶם
  choice: at ang mga handog na inumin na kasama ng mga iyon
  rationale: Ipinahahayag na ang mga likidong handog ay kaakibat ng nakalistang mga handog, habang pinananatili ang ugnayang ipinakikita ng hulaping “kanila” sa Hebreo.
- source_word: וּזְבָחִים לָרֹב
  choice: Nag-alay rin sila ng napakaraming hain
  rationale: Malinaw na ipinakikitang may marami pang hain bukod sa binilang na mga handog na sinusunog.
- source_word: לְכָל יִשְׂרָאֵל
  choice: para sa buong Israel
  rationale: Pinananatili ang malawak at hindi labis na tinukoy na gamit ng ל; hindi ipinipilit na ito ay teknikal na wikang pantubos o pangkinatawan.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang ginagamit ng teksto ang Tetragrammaton; ang “Yahweh” ay nagpapakilala rito bilang personal na pangalan nang hindi pinapalitan ng titulo.
- issue: Saklaw ng לְכָל יִשְׂרָאֵל
  choice: para sa buong Israel
  alternative: alang-alang sa buong Israel
  rationale: Ang “para sa” ay sadyang malawak at pinananatili ang posibilidad na tumukoy sa pakinabang, layunin, o kinatawang saklaw; ang “alang-alang sa” ay bahagyang mas tiyak.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog. Ginamit ang “nag-alay” at “handog na sinusunog” upang mapanatili ang pagkakaiba ng זְבָחִים at עֹלוֹת. Iniwasan ang sobrang teknikal na bokabularyo, ngunit ipinaliwanag sa talababa ang kaugaliang kaugnay ng likidong handog.
