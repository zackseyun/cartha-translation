  source_fidelity: 'Tapat ang salin sa pagkakasunod at saklaw ng Hebreo: mga hain at mga handog na sinusunog kay Yahweh, sa kinabukasan ng araw na iyon; tig-iisang libong toro, lalaking tupa, at batang tupa; mga handog na inumin; at napakaraming hain para sa buong Israel. Ang “kasama ng mga iyon” ay isang katanggap-tanggap na paglilinaw sa hulaping “kanila” sa “kanilang mga handog na inumin,” nang hindi binabago ang diwa.'
