base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/015.yaml
  text: For we are sojourners before you[a], and temporary residents, as all our fathers were. Our days on the earth are like a shadow[c][b], and there is no hope.
translation:
  language: tl
  text: Sapagkat kami ay mga dayuhan[a] sa harap mo at mga pansamantalang naninirahan[b], gaya ng lahat ng aming mga ninuno. Ang aming mga araw sa lupa ay parang anino, at walang pag-asa.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga banyaga.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “mga naninirahang dayuhan.”
    reason: lexical_alternative
  - marker: c
    text: Sa konteksto, ang “walang pag-asa” ay tumutukoy sa panandalian at lumilipas na buhay ng tao sa lupa; hindi nito tahasang itinatanggi ang pag-asa sa Diyos.
    reason: cross_reference
lexical_decisions:
- source_word: גֵרִים
  choice: mga dayuhan
  rationale: Tumutukoy ang גֵרִים sa mga taong naninirahan sa isang lugar na hindi nila sariling bayan at walang katayuan ng katutubo. Malinaw at likas sa modernong Tagalog ang “mga dayuhan,” habang ipinapahiwatig ng kasunod na parirala na hindi lamang sila mga dumaraan.
- source_word: לְפָנֶיךָ
  choice: sa harapan mo
  rationale: Pinananatili nito ang literal na larawang “sa harap ng iyong mukha” at ang tuwirang pagharap sa Diyos sa panalangin.
- source_word: תוֹשָׁבִים
  choice: mga pansamantalang naninirahan
  rationale: Ipinahahayag nito ang paninirahang walang ganap na pagiging permanente o katutubong katayuan, at pinananatili ang pagkakaparis ngunit bahagyang pagkakaiba nito sa גֵרִים.
- source_word: כְּכָל אֲבֹתֵינוּ
  choice: gaya ng lahat ng aming mga ninuno
  rationale: Sa kontekstong ito, ang אֲבֹתֵינוּ ay tumutukoy sa mga naunang salinlahi ng Israel. Mas malinaw sa karaniwang mambabasa ang “mga ninuno” kaysa sa literal na “mga ama.”
- source_word: כַּצֵּל
  choice: parang anino
  rationale: Pinananatili ang biblikal na talinghaga ng panandalian at mabilis lumipas na buhay sa likas na Tagalog.
- source_word: יָמֵינוּ עַל הָאָרֶץ
  choice: ang mga araw namin sa lupa
  rationale: Tuwiran at malinaw na salin ng temporal at panlugar na parirala.
- source_word: וְאֵין מִקְוֶה
  choice: at walang pag-asa
  rationale: Maaaring mangahulugan ang מִקְוֶה ng pag-asa o inaasahan. Pinananatili ng “walang pag-asa” ang matinding pahayag at teolohikal na tensiyon ng Hebreo nang hindi ito pinahihina sa mismong teksto.
theological_decisions:
- issue: Kahulugan ng וְאֵין מִקְוֶה sa konteksto ng ikli ng buhay ng tao
  choice: “at walang pag-asa,” na pinananatili ang tuwiran at matinding pahayag ng Hebreo
  alternative: “at walang inaasahan” o “at walang namamalaging pag-asa”
  rationale: Binibigyang-diin ng talata ang pagiging panandalian ng buhay ng tao sa lupa sa harap ng Diyos. Hindi dinagdagan ang pangunahing teksto upang tahasang limitahan ang pahayag, ngunit nililinaw sa talababa ang konteksto nang hindi ipinagkakait ang tunay na tensiyon nito.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa panalangin. Iniwasan ang arkaikong bokabularyo at pinanatili ang talinghaga, parallelism, at teolohikal na tensiyon ng Hebreo.
