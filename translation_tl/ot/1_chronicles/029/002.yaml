  text: וּֽ/כְ/כָל כֹּחִ֞/י הֲכִינ֣וֹתִי לְ/בֵית אֱלֹהַ֗/י הַ/זָּהָ֣ב לַ֠/זָּהָב וְ/הַ/כֶּ֨סֶף לַ/כֶּ֜סֶף וְ/הַ/נְּחֹ֣שֶׁת לַ/נְּחֹ֗שֶׁת הַ/בַּרְזֶל֙ לַ/בַּרְזֶ֔ל וְ/הָ/עֵצִ֖ים לָ/עֵצִ֑ים אַבְנֵי שֹׁ֨הַם וּ/מִלּוּאִ֜ים אַבְנֵי פ֣וּךְ וְ/רִקְמָ֗ה וְ/כֹ֨ל אֶ֧בֶן יְקָרָ֛ה וְ/אַבְנֵי שַׁ֖יִשׁ לָ/רֹֽב־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/002.yaml
  text: 'And with all my strength I have prepared for the house of my God: the gold for the things of gold[a], and the silver for the things of silver, and the bronze for the things of bronze, the iron for the things of iron, and the wood for the things of wood; onyx stones, settings, stones of antimony, variegated stones, every precious stone[d][c][b], and marble stones in abundance.'
translation:
  language: tl
  text: Sa buong lakas ko ay inihanda ko para sa bahay ng aking Diyos ang ginto para sa mga bagay na yari sa ginto, ang pilak para sa mga bagay na yari sa pilak, ang tanso para sa mga bagay na yari sa tanso, ang bakal para sa mga bagay na yari sa bakal, at ang kahoy para sa mga bagay na yari sa kahoy; mga batong onise,[a] mga kabitan,[b] mga batong antimonya,[c] mga batong sari-saring kulay,[d] lahat ng mahalagang bato, at napakaraming batong marmol.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hindi tiyak ang eksaktong pagkakakilanlan ng ilan sa mga bato sa talatang ito. Ang “onise” para sa שֹׁהַם at “marmol” para sa שַׁיִשׁ ay sumusunod sa karaniwang tradisyonal na mga salin, bagaman may iba pang mungkahing pagkakakilanlan.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “mga kalupkop,” “mga kabitan ng bato,” o “mga inlay” ang מִלּוּאִים.
    reason: lexical_alternative
  - marker: c
    text: Mahirap tiyakin ang pariralang isinaling “mga batong antimonya” (אַבְנֵי פוּךְ). Maaaring tumukoy ito sa mga batong kaugnay ng maitim na pigment, pandekorasyong inlay, o ibang materyal na pampalamuti.
    reason: lexical_alternative
  - marker: d
    text: Ang “mga batong sari-saring kulay” ay salin ng רִקְמָה ayon sa konteksto ng talaan ng mga bato at materyales sa pagtatayo. Sa ibang konteksto, maaari itong tumukoy sa burda o sa gawaing may masalimuot at makulay na disenyo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְכָל כֹּחִי
  choice: At buong lakas kong
  rationale: Ipinapahayag nito ang lubos na paggamit ni David ng kaniyang lakas at kakayahan; natural ito sa modernong Tagalog habang pinananatili ang personal na diin.
- source_word: הֲכִינוֹתִי
  choice: inihanda
  rationale: Ang aspektong perpektibo ay tumutukoy sa natapos na paghahanda na mahalaga sa kasalukuyang pahayag ni David.
- source_word: לְבֵית אֱלֹהַי
  choice: para sa bahay ng aking Diyos
  rationale: Pinananatili ang kongkretong Hebreong larawan at ang personal na debosyon; hindi ito agad pinapalitan ng mas interpretibong 'templo.'
- source_word: הַזָּהָב לַזָּהָב ... וְהָעֵצִים לָעֵצִים
  choice: ang ginto para sa mga bagay na yari sa ginto ... ang kahoy para sa mga bagay na yari sa kahoy
  rationale: Nililinaw ng 'mga bagay na yari sa' na ang bawat materyal ay inilaan sa mga kagamitang gagawin mula rito, habang pinananatili ang pag-uulit at paralelismo ng Hebreo.
- source_word: וְהַנְּחֹשֶׁת לַנְּחֹשֶׁת
  choice: ang tanso para sa mga bagay na yari sa tanso
  rationale: Maaaring tumukoy ang נְחֹשֶׁת sa copper o bronze; 'tanso' ang natural at malawak na katumbas sa Filipino para sa kontekstong ito.
- source_word: אַבְנֵי שֹׁהַם
  choice: mga batong onise
  rationale: Karaniwang tradisyonal na pagkakakilanlan ang onise, ngunit hindi tiyak ang eksaktong uri ng batong tinutukoy, kaya may talababa.
- source_word: וּמִלּוּאִים
  choice: mga pangkalupkop
  rationale: Ipinahihiwatig ng salita ang mga setting, mounting, o inlay para sa palamuting bato; ang 'pangkalupkop' ay nauunawaan ngunit hindi nagkukulong sa iisang teknikal na paraan.
- source_word: אַבְנֵי פוּךְ
  choice: mga batong antimonya
  rationale: Malapit ito sa karaniwang leksikal na diwa ng פּוּךְ bilang antimonya o maitim na mineral, nang hindi nilulutas ang mahirap na eksaktong reperente.
- source_word: וְרִקְמָה
  choice: mga batong sari-sari ang kulay
  rationale: Sa konteksto ng talaan ng mga bato at materyales, malamang na tumutukoy ito sa makulay o sari-saring batong pandekorasyon, bagaman maaari ring tumukoy ang salita sa masalimuot na burda o disenyong gawa.
- source_word: וְאַבְנֵי שַׁיִשׁ לָרֹב
  choice: at napakaraming batong marmol
  rationale: Ang marmol ang karaniwang tradisyonal na salin ng שַׁיִשׁ, at ang לָרֹב ay likas na naipapahayag bilang 'napakarami.'
