revisions:
- from: At buong lakas kong inihanda para sa bahay ng aking Diyos ang ginto para sa mga bagay na yari sa ginto, ang pilak para sa mga bagay na yari sa pilak, ang tanso para sa mga bagay na yari sa tanso, ang bakal para sa mga bagay na yari sa bakal, at ang kahoy para sa mga bagay na yari sa kahoy; mga batong onise,[a] mga pangkalupkop,[b] mga batong antimonya,[c] mga batong sari-sari ang kulay,[d] lahat ng uri ng mahalagang bato, at napakaraming batong marmol.
  to: Sa buong lakas ko ay inihanda ko para sa bahay ng aking Diyos ang ginto para sa mga bagay na yari sa ginto, ang pilak para sa mga bagay na yari sa pilak, ang tanso para sa mga bagay na yari sa tanso, ang bakal para sa mga bagay na yari sa bakal, at ang kahoy para sa mga bagay na yari sa kahoy; mga batong onise,[a] mga kabitan,[b] mga batong antimonya,[c] mga batong sari-saring kulay,[d] lahat ng mahalagang bato, at napakaraming batong marmol.
