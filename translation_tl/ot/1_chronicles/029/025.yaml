revisions:
- from: Lubhang dinakila ni Yahweh si Solomon sa paningin ng buong Israel, at ipinagkaloob niya kay Solomon ang karangyaan ng paghahari[a] na hindi tinaglay ng sinumang haring nauna sa kanya sa Israel.
  to: Lubhang dinakila ni Yahweh si Solomon sa paningin ng buong Israel, at ipinagkaloob niya kay Solomon ang maharlikang kamahalan[a] na hindi pa tinaglay ng sinumang haring namuno sa Israel bago siya.
  rationale: Pinalitan ang pangunahing salin ng הוֹד מַלְכוּת upang mas tuwirang maipahayag ang maharlikang ‘majesty,’ at inayos ang huling sugnay upang malinaw na ang tinutukoy ay mga haring namuno sa Israel bago si Solomon. Pinanatili ang pangalan na “Yahweh,” ang pagpapatingkad ng “Lubhang,” at ang footnote anchor sa terminong may leksikal na alternatibo.
