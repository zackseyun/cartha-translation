  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יְגַדֵּ֨ל יְהוָ֤ה אֶת שְׁלֹמֹה֙ לְ/מַ֔עְלָ/ה לְ/עֵינֵ֖י כָּל יִשְׂרָאֵ֑ל וַ/יִּתֵּ֤ן עָלָי/ו֙ ה֣וֹד מַלְכ֔וּת אֲ֠שֶׁר לֹֽא הָיָ֧ה עַל כָּל מֶ֛לֶךְ לְ/פָנָ֖י/ו עַל יִשְׂרָאֵֽל־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/025.yaml
  text: And Yahweh made Solomon exceedingly great in the sight of all Israel[a], and gave him royal majesty such as had not been on any king before him over Israel.
translation:
  language: tl
  text: Lubhang dinakila ni Yahweh si Solomon sa paningin ng buong Israel, at ipinagkaloob niya kay Solomon ang maharlikang kamahalan[a] na hindi pa tinaglay ng sinumang haring namuno sa Israel bago siya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “maharlikang karangalan” o “karangyaan ng paghahari.”
    reason: Ipinakikita ang saklaw ng kahulugan ng הוֹד מַלְכוּת, na maaaring tumukoy sa kamahalan, karangalan, o karangyaang kaugnay ng paghahari.
lexical_decisions:
- source_word: וַיְגַדֵּל ... לְמַעְלָה
  choice: Lubhang dinakila
  rationale: Ang Hifil ng גדל ay nagsasaad ng pagpapadakila, at ang לְמַעְלָה ay nagpapatingkad sa antas nito. Likas at marangal sa modernong Tagalog ang “lubhang dinakila.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang isinasalin ang banal na pangalang יהוה bilang “Yahweh,” sa halip na palitan ito ng isang titulo.
- source_word: לְעֵינֵי כָּל יִשְׂרָאֵל
  choice: sa paningin ng buong Israel
  rationale: Pinananatili nito ang Hebreong idyoma na tumutukoy sa hayag na pagkilala o pagtingin ng buong bayan.
- source_word: וַיִּתֵּן עָלָיו
  choice: ipinagkaloob niya kay Solomon
  rationale: Ang literal na “nagbigay sa ibabaw niya” ay idyoma ng pagkakaloob. Inulit ang pangalang Solomon upang maging malinaw ang tinutukoy sa Tagalog.
- source_word: הוֹד מַלְכוּת
  choice: karangyaan ng paghahari
  rationale: Ang הוֹד ay maaaring tumukoy sa karangyaan, karangalan, o kadakilaan, samantalang nililinaw ng מַלְכוּת na ito ay kaugnay ng paghahari. Pinananatili ng parirala ang lawak ng kahulugan.
- source_word: אֲשֶׁר לֹא הָיָה עַל כָּל מֶלֶךְ לְפָנָיו עַל יִשְׂרָאֵל
  choice: na hindi tinaglay ng sinumang haring nauna sa kanya sa Israel
  rationale: Likas na ipinahahayag ng “tinaglay” ang Hebreong larawan ng karangyaang nasa isang hari, at malinaw na iniuugnay ang “sa Israel” sa mga haring nauna kay Solomon.
theological_decisions:
- issue: Paglalapat ng banal na pangalang יהוה
  choice: Yahweh
  alternative: Jehovah; ang PANGINOON
  rationale: Pangalan mismo ang nasa tekstong Hebreo, kaya pinanatili itong personal na pangalan at hindi pinalitan ng titulong “ang PANGINOON.”
translation_notes:
  register: Gumamit ng moderno, malinaw, at marangal na Tagalog. Ang pag-uulit sa “Solomon” ay umiiwas sa malabong pagtukoy ng mga panghalip, at ang footnote marker [a] ay inilagay kaagad pagkatapos ng pariralang tinatalakay nito.
