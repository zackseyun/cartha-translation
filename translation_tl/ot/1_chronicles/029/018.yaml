source:
  edition: WLC
  text: יְהוָ֗ה אֱ֠לֹהֵי אַבְרָהָ֞ם יִצְחָ֤ק וְ/יִשְׂרָאֵל֙ אֲבֹתֵ֔י/נוּ שֳׁמְרָ/ה זֹּ֣את לְ/עוֹלָ֔ם לְ/יֵ֥צֶר מַחְשְׁב֖וֹת לְבַ֣ב עַמֶּ֑/ךָ וְ/הָכֵ֥ן לְבָבָ֖/ם אֵלֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/018.yaml
  text: O Yahweh[a], God of Abraham, Isaac, and Israel, our fathers, keep this forever in the intentions of the thoughts of the heart of your people[d][c][b], and direct their heart toward you.
translation:
  language: tl
  text: O Yahweh, Diyos nina Abraham, Isaac, at Israel na aming mga ninuno,[a] panatilihin mo magpakailanman sa puso ng iyong bayan ang ganitong hangarin at pag-iisip,[b] at ituon mo ang kanilang puso sa iyo.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Israel” ang nasa tekstong Hebreo; hindi “Jacob.”
    reason: lexical_alternative
  - marker: b
    text: 'Mas literal: “panatilihin mo ito magpakailanman bilang pagkiling ng mga kaisipan ng puso ng iyong bayan.”'
    reason: alternative_reading
  - marker: c
    text: O “patatagin mo ang kanilang puso sa iyo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang isinalin ang banal na pangalan sa karaniwang anyong “Yahweh,” sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֵי אַבְרָהָם יִצְחָק וְיִשְׂרָאֵל אֲבֹתֵינוּ
  choice: Diyos nina Abraham, Isaac, at Israel na aming mga ninuno
  rationale: Pinanatili ang “Israel” na nasa Hebreo at hindi ito iniayon sa mas pamilyar na “Jacob.” Ang “mga ninuno” ay likas sa modernong Tagalog at malinaw na tumutukoy rito sa tatlong patriyarka.
- source_word: שָׁמְרָה זֹּאת לְעוֹלָם
  choice: panatilihin mo magpakailanman
  rationale: Sa konteksto ng panalangin, ang שׁמר ay humihiling na ipagpatuloy o panatilihin ng Diyos ang ipinakitang saloobin ng bayan; isinasama ng “ang ganitong” sa kasunod na parirala ang reperensiya ng זֹאת.
- source_word: לְיֵצֶר מַחְשְׁבוֹת לְבַב עַמֶּךָ
  choice: sa puso ng iyong bayan ang ganitong hangarin at pag-iisip
  rationale: Ang יֵצֶר ay maaaring tumukoy sa hilig, balak, o panloob na hangarin, at ang מַחְשְׁבוֹת ay sa mga iniisip o panukala. Inayos ang masiksik na pariralang Hebreo sa likas na Tagalog habang pinananatili ang puso bilang sentro ng isip at kalooban.
- source_word: וְהָכֵן לְבָבָם אֵלֶיךָ
  choice: at ituon mo sa iyo ang kanilang puso
  rationale: Ang Hiphil ng כון ay maaaring mangahulugang ihanda, patatagin, o ituon. Ang “ituon” ay malinaw na nagpapahayag ng direksiyon ng puso patungo sa Diyos, samantalang pinananatili ang kolektibong isahan na “puso.”
theological_decisions:
- issue: Paglalahad sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Pangalan mismo ang nasa tekstong Hebreo; hindi ito tahimik na pinalitan ng titulong “Panginoon.”
- issue: Pangalan ng ikatlong patriyarka
  choice: Israel
  alternative: Jacob
  rationale: “Israel” ang tahasang nasa tekstong Hebreo. Hindi ito iniayon sa ibang anyo ng pormulang patriyarkal.
- issue: Saklaw ng לְיֵצֶר מַחְשְׁבוֹת לְבַב
  choice: ganitong hangarin at pag-iisip sa puso
  alternative: ganitong pagkiling ng mga kaisipan ng puso
  rationale: Hindi tiyak kung dapat unawain ang יֵצֶר bilang “hangarin,” “pagkiling,” o “hubog/disposisyon.” Pinili ang likas na pangunahing salin at inilagay sa talababa ang mas pormal na alternatibo.
- issue: Kahulugan ng וְהָכֵן
  choice: ituon
  alternative: patatagin
  rationale: Kapuwa posible ang oryentasyon at pagpapatatag ng puso. Ang pariralang אֵלֶיךָ (“sa iyo”) ay umaayon sa “ituon,” ngunit itinabi sa talababa ang “patatagin.”
translation_notes:
  register: Modernong Filipino Tagalog na may marangal na himig ng panalangin. Ginamit ang “nina” para sa likas na pag-uugnay ng “Diyos” sa magkakasunod na pangalan. Iniwasan ang sobrang literal at mabigat na salansan ng mga pangngalan sa pangunahing teksto, ngunit pinanatili sa talababa ang mas pormal na anyo at ang tunay na leksikal na kalabuan.
