  yaml_path: translation/ot/1_chronicles/029/028.yaml
  text: And he died in a good old age[a], full of days, riches, and honor; and Solomon his son reigned in his place.
translation:
  language: tl
  text: At namatay siya sa magandang katandaan, puspos ng mga araw[a], kayamanan, at karangalan; at naghari ang anak niyang si Solomon bilang kahalili niya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nasiyahan sa haba ng buhay.” Hebreong idyoma ang “puspos ng mga araw.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: At namatay siya
  rationale: Pinananatili ang payak na sunod-sunod na puwersang pasalaysay ng wayyiqtol ng מות nang hindi nagdaragdag ng interpretasyon.
- source_word: בְּשֵׂיבָה טוֹבָה
  choice: sa mabuting katandaan
  rationale: Malapit ito sa Hebreong parirala at malinaw na inilalarawan ang positibong kalagayan ng kanyang katandaan nang siya ay mamatay.
- source_word: שְׂבַע יָמִים
  choice: puspos ng mga araw
  rationale: Pinananatili ang larawan ng Hebreong idyoma para sa isang mahaba at ganap na buhay, sa halip na lubusang ipaliwanag ito sa pangunahing teksto.
- source_word: עֹשֶׁר וְכָבוֹד
  choice: kayamanan, at karangalan
  rationale: Ang עֹשֶׁר ay materyal na yaman, samantalang ang כָבוֹד sa kontekstong maharlika ay karangalan o mataas na pagkilala.
- source_word: וַיִּמְלֹךְ
  choice: naghari
  rationale: Tuwirang katumbas ng karaniwang kahulugan ng Qal na מלך sa konteksto ng paghalili sa trono.
- source_word: שְׁלֹמֹה בְנוֹ
  choice: ang anak niyang si Solomon
  rationale: Natural na ayos sa modernong Filipino habang malinaw na pinananatili ang ugnayan ni Solomon bilang anak niya.
- source_word: תַּחְתָּיו
  choice: bilang kahalili niya
  rationale: Natural na pormula sa Filipino para sa paghalili sa paghahari at tumpak na naghahatid ng diwang 'sa kanyang lugar.'
