id: 1CH.29.10
reference: 1 Chronicles 29:10
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יְבָ֤רֶךְ דָּוִיד֙ אֶת יְהוָ֔ה לְ/עֵינֵ֖י כָּל הַ/קָּהָ֑ל וַ/יֹּ֣אמֶר דָּוִ֗יד בָּר֨וּךְ אַתָּ֤ה יְהוָה֙ אֱלֹהֵי֙ יִשְׂרָאֵ֣ל אָבִ֔י/נוּ מֵ/עוֹלָ֖ם וְ/עַד עוֹלָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/010.yaml
  text: Then David blessed Yahweh in the sight of all the assembly[a], and David said, “Blessed are you, Yahweh, the God of Israel our father, from everlasting to everlasting.”
translation:
  language: tl
  text: At pinuri ni David si Yahweh sa harap ng buong kapulungan. At sinabi ni David, “Purihin ka, Yahweh, Diyos ni Israel na ating ama,[a] mula sa walang hanggan hanggang sa walang hanggan.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Diyos ng Israel, aming Ama,” kung ang “aming Ama” ay tuwirang tawag sa Diyos sa halip na paglalarawan kay Israel/Jacob bilang ating ama.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְבָרֶךְ
  choice: pinuri
  rationale: Kapag Diyos ang layon ng piel na ברך, tumutukoy ito sa pagpapahayag ng pagpapala o papuri sa Diyos. Mas natural at malinaw sa modernong Tagalog ang “pinuri” kaysa “binasbasan,” na maaaring magpahiwatig na si David ang nagbibigay ng biyaya sa Diyos.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang kinakatawan ng Tetragrammaton sa halip na palitan ito ng isang titulo.
- source_word: לְעֵינֵי
  choice: sa harap ng
  rationale: Natural na katumbas sa Tagalog ng idyomang literal na “sa mga mata ng,” at pinananatili ang diwang hayagan itong ginawa sa presensiya ng kapulungan.
- source_word: כָּל הַקָּהָל
  choice: buong kapulungan
  rationale: Ang קָהָל ay ang nagkakatipong pamayanan; malinaw at marangal sa modernong Tagalog ang “buong kapulungan.”
- source_word: בָּרוּךְ אַתָּה
  choice: Purihin ka
  rationale: Natural na pormulang papuri sa Diyos sa Tagalog. Iniiwasan nito ang di-likas na “Pinagpala ka” habang pinananatili ang tuwirang pakikipag-usap at doxolohikal na lakas.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Diyos ni Israel
  rationale: Sa piniling pagbasa, ang Israel ay ang patriyarkang tinutukoy bilang “ating ama,” kaya “ni Israel” ang natural na ugnayang Tagalog.
- source_word: אָבִינוּ
  choice: na ating ama
  rationale: Ikinakabit ito kay Israel/Jacob bilang ninuno ng bayan, alinsunod sa pinakanatural na sintaktikong pagbasa, ngunit itinatala sa talababa ang tunay na alternatibong pagbasa.
- source_word: מֵעוֹלָם וְעַד עוֹלָם
  choice: mula sa walang hanggan hanggang sa walang hanggan
  rationale: Pinananatili ang dalawang-hanggang pormula at ang marangal na tono ng walang takdang tagal.
theological_decisions:
- issue: Ang tinutukoy ng אָבִינוּ (“ating ama”)
  choice: 'Tumutukoy kay Israel/Jacob: “Diyos ni Israel na ating ama”'
  alternative: 'Tuwirang tawag sa Diyos bilang Ama: “Diyos ng Israel, aming Ama”'
  rationale: Pinakamadaling basahin ang אָבִינוּ bilang apposition kay Israel, ngunit maaaring hatiin ang parirala upang maging tuwirang pagtawag sa Diyos. Hindi nilulutas nang palihim ang tunay na sintaktiko at teolohikal na kalabuan; inilalahad ang alternatibo sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at angkop sa pampublikong panalangin. Ginamit ang “pinuri” at “Purihin ka” upang maging natural sa Tagalog, kahit hindi nito lubos na napapanatili ang leksikal na pag-uugnay ng dalawang anyo ng ברך. Inilagay ang [a] sa mismong pariralang may kalabuan.
