base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/029.yaml
  text: The acts of David the king[a], the former and the latter, are written in the records of Samuel the seer, and in the records of Nathan the prophet[c][b], and in the records of Gad the seer.
translation:
  language: tl
  text: Ang mga ginawa ni Haring David[a], mula sa una hanggang sa huli, ay nakasulat sa mga tala[b] ni Samuel na tagakita, sa mga tala ni Natan na propeta, at sa mga tala ni Gad na tagakita.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isaling “ang mga salita o mga usapin tungkol kay Haring David, ang una at ang huli.” Sa idyomang Hebreo, tumutukoy ito sa mga ginawa o pangyayari sa kanyang paghahari.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “nakasulat sa ibabaw ng mga salita nina Samuel … Natan … Gad.” Ipinahihiwatig dito ng “mga tala” ang nakasulat na mga sanggunian.
    reason: lexical_alternative
  - marker: c
    text: 'Magkaibang salitang Hebreo ang mga titulong isinaling “tagakita” para kina Samuel at Gad: רֹאֶה at חֹזֶה. Maaari ring isaling “tagapangitain” ang titulo ni Gad upang maipakita ang pagkakaiba.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דִּבְרֵי דָּוִיד הַמֶּלֶךְ
  choice: mga ginawa ni Haring David
  rationale: Bagaman maaaring literal na tumukoy ang דִּבְרֵי sa “mga salita” o “mga bagay,” sa buod ng paghahari ay tumutukoy ito sa mga ginawa o pangyayari sa buhay at paghahari ni David.
- source_word: הָרִאשֹׁנִים וְהָאֲחרֹנִים
  choice: mula sa una hanggang sa huli
  rationale: Pinananatili nito ang pares na Hebreo habang likas na ipinahahayag sa Tagalog ang buong saklaw ng mga ginawa ni David.
- source_word: הִנָּם כְּתוּבִים
  choice: ay nakasulat
  rationale: Natural na Tagalog ito para sa pahayag na ang mga bagay na iyon ay nasa nakasulat na mga sanggunian; hindi kailangang piliting isalin ang diin ng הִנָּם bilang “narito.”
- source_word: עַל דִּבְרֵי
  choice: sa mga tala
  rationale: Sa kontekstong ito, ang parirala ay tumutukoy sa mga nakasulat na sanggunian. Mas malinaw at natural ang “sa mga tala” kaysa sa literal na “sa mga salita.”
- source_word: הָרֹאֶה
  choice: tagakita
  rationale: Ang רֹאֶה ay isang titulong kaugnay ng gawaing propetiko; ang “tagakita” ay maikli, malinaw, at naiiba sa “propeta.”
- source_word: הַנָּבִיא
  choice: propeta
  rationale: Karaniwan at tumpak na salin ng נָבִיא sa makabagong Tagalog.
- source_word: הַחֹזֶה
  choice: tagakita
  rationale: Ang חֹזֶה ay isa ring titulong kaugnay ng propetikong pagkakita. Ginamit ang likas na “tagakita,” at ipinaliwanag sa talababa ang pagkakaiba nito sa salitang ginamit kay Samuel.
theological_decisions:
- issue: Paglalarawan sa tatlong propetikong pinagmulan
  choice: Pinanatili ang “tagakita” para kina Samuel at Gad at “propeta” para kay Natan.
  alternative: Isalin ang חֹזֶה para kay Gad bilang “tagapangitain” upang ipakita ang pagkakaiba nito sa רֹאֶה para kay Samuel.
  rationale: Mahalagang panatilihin ang natatanging titulong “propeta” ni Natan. Para kina Samuel at Gad, mas likas sa karaniwang Tagalog ang “tagakita” sa pangunahing teksto, ngunit hindi ikinukubli ang magkaibang salitang Hebreo dahil nakatala ang pagkakaiba sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “Haring David” bilang natural na ayos ng titulo at pangalan. Hindi dinagdagan ng panimulang “Ngayon” sapagkat walang katumbas na tahasang salitang pamanahon sa Hebreo.
