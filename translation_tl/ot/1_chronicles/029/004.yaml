base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/004.yaml
  text: three thousand talents of gold[a], from the gold of Ophir, and seven thousand talents of refined silver, to overlay the walls of the buildings[b],
translation:
  language: tl
  text: tatlong libong talento[b] ng ginto[a] mula sa ginto ng Ofir, at pitong libong talento ng dinalisay na pilak, upang balutan ng sapin ang mga dingding ng mga gusali,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “gintong Ofir.” Maaaring unawain ang Hebreo bilang pagtukoy sa gintong nagmula sa Ofir o bilang paglalarawan sa uri ng ginto.
    reason: lexical_alternative
  - marker: b
    text: Ang “talento” rito ay isang yunit ng timbang, hindi kakayahan o husay.
    reason: cultural_note
lexical_decisions:
- source_word: שְׁלֹשֶׁת אֲלָפִים
  choice: tatlong libo
  rationale: Tuwirang salin ng bilang sa likas na ayos ng modernong Tagalog.
- source_word: כִּכְּרֵי / כִּכַּר
  choice: talento
  rationale: Makasaysayang yunit ito ng timbang; pinananatili ng “talento” ang sinaunang sukat sa halip na magbigay ng di-tiyak na modernong katumbas.
- source_word: זָהָב
  choice: ginto
  rationale: Tuwirang katawagan sa materyal.
- source_word: מִזְּהַב אוֹפִיר
  choice: mula sa ginto ng Ofir
  rationale: Pinananatili ang pang-ukol na מִן bilang “mula sa” at ang Ofir bilang pangalan ng lugar, nang hindi inaalis ang maaaring pahiwatig ng pinagmulan o uri ng ginto.
- source_word: וְשִׁבְעַת אֲלָפִים
  choice: at pitong libo
  rationale: Tuwirang salin ng parirala ng bilang.
- source_word: כֶּסֶף
  choice: pilak
  rationale: Sa konteksto, mahalagang metal ang tinutukoy at hindi salapi.
- source_word: מְזֻקָּק
  choice: dinalisay
  rationale: Ipinapahayag ng anyong balintiyak na ang pilak ay dumaan sa paglilinis o pagpipino.
- source_word: לָטוּחַ
  choice: upang ipabalot
  rationale: Sa konteksto ng mahahalagang metal na inilalapat sa dingding, malinaw nitong ipinahihiwatig ang paglalagay ng sapin o balot na metal.
- source_word: קִירוֹת
  choice: mga dingding
  rationale: Karaniwang katumbas ng pangmaramihang pangngalan.
- source_word: הַבָּתִּים
  choice: mga gusali
  rationale: Bagaman literal na “mga bahay,” mas angkop sa konteksto ng templong itinatayo ang malawak na katawagang “mga gusali,” nang hindi ito nililimitahan sa mga tirahang bahay.
