base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/027.yaml
  text: The days that he reigned over Israel were forty years. In Hebron he reigned seven years, and in Jerusalem he reigned thirty-three years.
translation:
  language: tl
  text: Ang panahon ng paghahari niya sa Israel ay apatnapung taon. Sa Hebron ay naghari siya nang pitong taon, at sa Jerusalem ay naghari siya nang tatlumpu't tatlong taon.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהַיָּמִים אֲשֶׁר מָלַךְ
  choice: Ang panahon ng paghahari niya
  rationale: Ang literal na 'ang mga araw na naghari siya' ay di-likas sa modernong Tagalog. Ipinahahayag ng 'panahon ng paghahari niya' ang Hebreong idyoma tungkol sa haba ng paghahari nang malinaw at marangal.
- source_word: עַל יִשְׂרָאֵל
  choice: sa Israel
  rationale: Sa Tagalog, ang 'naghari sa Israel' ang likas na pagpapahayag ng pamamahala sa isang bayan. Hindi idinagdag ang 'buong' sapagkat wala itong tahasang katumbas sa talata.
- source_word: אַרְבָּעִים שָׁנָה
  choice: apatnapung taon
  rationale: Karaniwang anyong Tagalog para sa bilang at pangngalan.
- source_word: בְּחֶבְרוֹן מָלַךְ שֶׁבַע שָׁנִים
  choice: Sa Hebron ay naghari siya nang pitong taon
  rationale: Pinananatili ang lokasyon, pandiwang 'naghari,' at tagal, pati ang paralelismong makikita sa Hebreo.
- source_word: וּבִירוּשָׁלִַם מָלַךְ שְׁלֹשִׁים וְשָׁלוֹשׁ
  choice: at sa Jerusalem ay naghari siya nang tatlumpu't tatlong taon
  rationale: Direktang isinasalin ang pang-ugnay, lokasyon, inulit na pandiwa, at tambalang bilang sa likas na modernong Tagalog.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, dignified, at madaling maunawaan. Ginamit ang 'panahon ng paghahari' sa halip na literal na 'mga araw' upang maging likas ang idyoma, habang pinananatili ang pag-uulit at balanse ng dalawang huling sugnay.
