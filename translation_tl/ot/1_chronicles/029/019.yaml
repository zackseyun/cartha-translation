  text: וְ/לִ/שְׁלֹמֹ֣ה בְנִ֗/י תֵּ֚ן לֵבָ֣ב שָׁלֵ֔ם לִ/שְׁמוֹר֙ מִצְוֺתֶ֔י/ךָ עֵדְוֺתֶ֖י/ךָ וְ/חֻקֶּ֑י/ךָ וְ/לַ/עֲשׂ֣וֹת הַ/כֹּ֔ל וְ/לִ/בְנ֖וֹת הַ/בִּירָ֥ה אֲשֶׁר הֲכִינֽוֹתִי־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/019.yaml
  text: And give to Solomon my son a whole heart to keep your commandments[a], your testimonies, and your statutes, and to do all of them, and to build the fortress that I have prepared.
translation:
  language: tl
  text: At bigyan mo ang anak kong si Solomon ng pusong buo upang sundin ang iyong mga utos, mga patotoo, at mga tuntunin, at gawin ang lahat ng iyon, at itayo ang templong tanggulan[a] na inihanda ko.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “palasyo” o “templo” lamang. Di-pangkaraniwang salitang Hebreo ito para sa isang maringal o matibay na gusali; dito, tumutukoy ito sa santuwaryong ipinaghanda ni David at itatayo ni Solomon.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלִשְׁלֹמֹה בְנִי תֵּן
  choice: At bigyan mo ang anak kong si Solomon
  rationale: Ipinahahayag ng parirala ang di-tuwirang layon ng kahilingan. Likas sa makabagong Tagalog ang ayos na ito at malinaw na napapanatili ang ‘anak ko.’
- source_word: לֵבָב שָׁלֵם
  choice: pusong buo
  rationale: Pinananatili nito ang konkretong metapora ng puso at ang diwa ng kabuuan, katapatan, at hindi nahahating kalooban nang hindi ipinakahulugang kawalang-kasalanan.
- source_word: לִשְׁמוֹר
  choice: upang sundin
  rationale: Sa kaugnayan ng mga utos, ang pandiwa ay nangangahulugang ingatan o tuparin sa pamamagitan ng pagsunod. ‘Sundin’ ang pinakanatural at malinaw sa kasalukuyang Tagalog.
- source_word: מִצְוֺתֶיךָ
  choice: iyong mga utos
  rationale: Karaniwang katumbas ng מִצְוָה ang ‘utos’ at malinaw itong naiiba sa kasunod na mga terminong legal.
- source_word: עֵדְוֺתֶיךָ
  choice: mga patotoo
  rationale: Pinananatili ng ‘mga patotoo’ ang natatanging bokabularyong tipan at legal ng עֵדוּת sa halip na pagsamahin ito sa ‘mga utos’ o ‘mga tuntunin.’
- source_word: וְחֻקֶּיךָ
  choice: at mga tuntunin
  rationale: Ang חֻקִּים ay mga itinakdang alituntunin o batas. Natural ang ‘mga tuntunin’ at napananatili ang pagkakaiba nito sa ‘mga utos’ at ‘mga patotoo.’
- source_word: וְלַעֲשׂוֹת הַכֹּל
  choice: at gawin ang lahat ng iyon
  rationale: Tahasang pinananatili ang ikalawang layunin at ang kabuuang saklaw nito sa lahat ng naunang utos, patotoo, at tuntunin.
- source_word: וְלִבְנוֹת הַבִּירָה
  choice: at itayo ang templong tanggulan
  rationale: Ang bihirang בִּירָה ay maaaring tumukoy sa tanggulan o maringal na gusaling parang palasyo; sa kontekstong ito, ang tinutukoy ay ang santuwaryong itatayo ni Solomon. Pinananatili ng ‘templong tanggulan’ kapwa ang kontekstuwal na tinutukoy at ang natatanging kulay ng salita.
- source_word: אֲשֶׁר הֲכִינוֹתִי
  choice: na inihanda ko
  rationale: Tuwirang inililipat ang Hiphil perfect ng כון bilang natapos nang paghahanda ni David, nang hindi dinaragdagan kung mga materyales, plano, o lugar ang partikular na tinutukoy.
theological_decisions:
- issue: Kahulugan ng לֵבָב שָׁלֵם
  choice: pusong buo
  alternative: pusong ganap; pusong hindi nahahati
  rationale: Ang ‘pusong buo’ ay nagpapanatili sa saklaw ng salitang Hebreo—kabuuan, integridad, at buong katapatan—nang hindi ito nililimitahan sa isang interpretasyon o ipinahihiwatig na walang bahid na kasakdalan.
- issue: Paglalarawan sa בִּירָה bilang santuwaryo sa Jerusalem
  choice: templong tanggulan
  alternative: tanggulan; palasyo; templo
  rationale: May di-pangkaraniwang diwa ng maringal o matibay na gusali ang salita, ngunit ang santuwaryo ang malinaw na tinutukoy sa konteksto. Iniiwasan ng salin ang maling pagkaunawa na palasyo lamang ito ng hari habang hindi binubura ang natatanging leksikal na kulay.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang ‘pusong buo’ upang mapanatili ang metapora at ang tunay na saklaw ng kahulugan. Sadyang pinanatiling magkakaiba ang ‘mga utos,’ ‘mga patotoo,’ at ‘mga tuntunin.’ Ang panandang [a] ay inilagay kaagad pagkatapos ng salitang tinatalakay ng talababa.
