base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/005.yaml
  text: gold for the things of gold[a], and silver for the things of silver, and for every kind of work by the hands of craftsmen. And who is willing to fill his hand today for Yahweh?
translation:
  language: tl
  text: Ang ginto para sa mga bagay na yari sa ginto, at ang pilak para sa mga bagay na yari sa pilak, at para sa bawat uri ng gawaing isasagawa ng mga bihasang manggagawa. At sino ang kusang-loob na pupuno ng kanyang kamay[a] ngayong araw para kay Yahweh?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “punuin ang kanyang kamay.” Ang idyomang Hebreong ito ay maaaring tumukoy sa pagtatalaga ng sarili o sa paghahandog para sa banal na paglilingkod.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַזָּהָב לַזָּהָב
  choice: ang ginto para sa mga bagay na ginto
  rationale: 'Ang pag-uulit ay eliptikal: ang ginto ay nakalaan sa mga bagay na gagawin sa ginto. Nililinaw ito nang hindi pinapaliit sa isang tiyak na uri ng gawang-ginto.'
- source_word: וְלַכֶּסֶף לַכֶּסֶף
  choice: at ang pilak para sa mga bagay na pilak
  rationale: Pinananatili ang paralelismo sa parirala tungkol sa ginto at ipinahihiwatig na ang pilak ay para sa mga bagay na gagawin sa pilak.
- source_word: וּלְכָל מְלָאכָה
  choice: at para sa bawat uri ng gawain
  rationale: Malawak ang saklaw ng מְלָאכָה at tumutukoy dito sa lahat ng gawaing kailangan sa proyekto.
- source_word: בְּיַד חָרָשִׁים
  choice: gagawin ng mga bihasang manggagawa
  rationale: Ang literal na larawan ng 'kamay' ay isang Hebreong paraan ng pagtukoy sa pagsasagawa ng gawain; natural na ipinahahayag sa Tagalog ang ahensiya ng mga bihasang manggagawa.
- source_word: וּמִי מִתְנַדֵּב
  choice: At sino ang kusang-loob
  rationale: Ipinahahayag ng anyong pandiwa ang boluntaryong pag-aalay o kahandaang kumilos; ang 'kusang-loob' ay natural at angkop sa retorikal na panawagan.
- source_word: לְמַלֹּאות יָדוֹ
  choice: na pupuno ng kanyang kamay
  rationale: Pinananatili sa pangunahing teksto ang sadyang kapansin-pansing idyomang Hebreo upang hindi agad ipasiya kung ang diin ay pagtatalaga ng sarili, paglilingkod, o pagdadala ng handog; ipinapaliwanag ito sa talababa.
- source_word: הַיּוֹם
  choice: ngayong araw
  rationale: Tuwirang katumbas na malinaw sa modernong Tagalog at pinananatili ang diin ng agarang panawagan.
- source_word: לַיהוָה
  choice: para kay Yahweh
  rationale: Ang לְ ay angkop dito sa pinag-uukulan ng kusang pagtatalaga o handog, at ang personal na pangalang יהוה ay isinasalin bilang Yahweh.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Ginagamit ng Hebreong teksto ang Tetragrammaton bilang personal na pangalan; pinananatili itong Yahweh sa halip na palitan ng titulo.
- issue: Kahulugan ng idyomang לְמַלֹּאות יָדוֹ
  choice: pupuno ng kanyang kamay, na may paliwanag sa talababa
  alternative: itatalaga ang sarili; maghahandog nang lubos; ihahandog ang sarili
  rationale: Maaaring magpahiwatig ang idyoma ng pagtatalaga sa banal na paglilingkod o pagdadala ng handog. Ang literal na larawan sa pangunahing teksto, kalakip ang maikling talababa, ay nagpapanatili sa tunay na lawak at tensiyon ng kahulugan.
translation_notes:
  register: Makabago at marangal na Tagalog na madaling maunawaan. Ginamit ang “mga bihasang manggagawa” para sa natural na pagpapahayag ng חָרָשִׁים, habang sadyang pinanatili ang di-karaniwang larawang “pupuno ng kanyang kamay” dahil mahalaga ang kultikong idyoma at hindi tiyak na iisa lamang ang tinutukoy nito.
