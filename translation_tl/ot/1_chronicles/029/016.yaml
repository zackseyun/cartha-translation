  text: יְהוָ֣ה אֱלֹהֵ֔י/נוּ כֹ֣ל הֶ/הָמ֤וֹן הַ/זֶּה֙ אֲשֶׁ֣ר הֲכִינֹ֔נוּ לִ/בְנֽוֹת לְ/ךָ֥ בַ֖יִת לְ/שֵׁ֣ם קָדְשֶׁ֑/ךָ מִ/יָּדְ/ךָ֥ היא וּ/לְ/ךָ֥ הַ/כֹּֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/016.yaml
  text: O Yahweh our God[a], all this abundance that we have prepared to build you a house for your holy name is from your hand[c][b], and all things are yours.
translation:
  language: tl
  text: Yahweh, aming Diyos, ang lahat ng kayamanang ito[a] na inihanda namin upang magtayo para sa iyo ng isang bahay para sa iyong banal na pangalan ay mula sa iyong kamay, at sa iyo ang lahat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “lahat ng kasaganaang ito” o “lahat ng naipong bagay na ito.” Ang salitang Hebreo ay tumutukoy rito sa napakaraming handog at materyales na naipon para sa templo.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה אֱלֹהֵינוּ
  choice: Yahweh, aming Diyos
  rationale: Pinananatili ang personal na pangalang Yahweh at isinasalin ang אֱלֹהֵינוּ bilang ang likas at isahang titulong “aming Diyos.”
- source_word: כֹל הֶהָמוֹן הַזֶּה
  choice: ang lahat ng kayamanang ito
  rationale: Sa konteksto, ang הָמוֹן ay tumutukoy sa malaking dami ng naipong handog at materyales para sa templo. Likas sa modernong Tagalog ang “kayamanan,” habang inilalahad sa talababa ang lawak ng kahulugan.
- source_word: אֲשֶׁר הֲכִינֹנוּ
  choice: na inihanda namin
  rationale: Tumpak na ipinahahayag ang natapos nang paghahanda na may kaugnayan pa rin sa kasalukuyang panalangin.
- source_word: לִבְנוֹת לְךָ בַיִת
  choice: upang magtayo para sa iyo ng isang bahay
  rationale: Pinananatili ang “bahay” sa halip na gawing tahasang “templo,” sapagkat בַיִת ang nasa Hebreo at mahalaga ang larawan ng bahay ng Diyos.
- source_word: לְשֵׁם קָדְשֶׁךָ
  choice: para sa iyong banal na pangalan
  rationale: Likas at malinaw na salin ng pariralang nagpapahayag na ang bahay ay iniaalay sa banal na pangalan ng Diyos.
- source_word: מִיָּדְךָ הִיא
  choice: ay mula sa iyong kamay
  rationale: Pinananatili ang kongkretong larawan ng kamay bilang pinagmumulan ng ipinagkaloob ng Diyos at malapit ito sa anyo ng Hebreo.
- source_word: וּלְךָ הַכֹּל
  choice: at sa iyo ang lahat
  rationale: Maikli at tuwirang ipinahahayag ang ganap na pagmamay-ari ng Diyos, gaya ng Hebreo.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; PANGINOON
  rationale: Direktang ginagamit ng talata ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalang nasa tekstong Hebreo nang hindi nagdaragdag ng denominasyonal na pagpapakahulugan.
- issue: Kahulugan ng “bahay” para sa Diyos
  choice: bahay
  alternative: templo
  rationale: Bagaman templo ang tinutukoy sa konteksto, pinananatili ang salitang בַיִת (“bahay”) upang huwag alisin ang teolohikal na larawan ng pagtatayo ng bahay para sa pangalan ng Diyos.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang mga larawang “bahay,” “banal na pangalan,” at “mula sa iyong kamay” dahil mahalaga ang mga ito sa anyo at diwa ng Hebreo.
