id: 1CH.29.11
reference: 1 Chronicles 29:11
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: לְ/ךָ֣ יְ֠הוָה הַ/גְּדֻלָּ֨ה וְ/הַ/גְּבוּרָ֤ה וְ/הַ/תִּפְאֶ֨רֶת֙ וְ/הַ/נֵּ֣צַח וְ/הַ/ה֔וֹד כִּי כֹ֖ל בַּ/שָּׁמַ֣יִם וּ/בָ/אָ֑רֶץ לְ/ךָ֤ יְהוָה֙ הַ/מַּמְלָכָ֔ה וְ/הַ/מִּתְנַשֵּׂ֖א לְ/כֹ֥ל לְ/רֹֽאשׁ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/011.yaml
  text: Yours[a], O Yahweh, are the greatness and the power and the splendor and the victory and the majesty, for everything in the heavens and on the earth is yours. Yours, O Yahweh, is the kingdom, and you are exalted as head over all.
translation:
  language: tl
  text: Sa iyo, Yahweh, ang kadakilaan, ang kapangyarihan, ang karilagan, ang tagumpay[a], at ang kamahalan, sapagkat sa iyo ang lahat ng nasa langit at nasa lupa. Sa iyo, Yahweh, ang kaharian, at ikaw ay nakataas bilang pinuno ng lahat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang kawalang-hanggan” o “ang nangingibabaw na kataasan.” Ang Hebreong נֵצַח ay maaaring tumukoy rito sa namamalaging pangingibabaw, hindi lamang sa tagumpay.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ang banal na pangalang YHWH bilang “Yahweh,” alinsunod sa anyo ng pangalang nasa tekstong Hebreo.
- source_word: לְךָ
  choice: sa iyo
  rationale: Ipinapahayag ng anyong ito ang pag-aari o pagkanauukol. Ang pag-uulit ng “Sa iyo” ay nagpapanatili sa diin at liturhikal na ayos ng Hebreo.
- source_word: הַגְּדֻלָּה
  choice: ang kadakilaan
  rationale: Tuwirang katumbas ng abstraktong pangngalang tumutukoy sa greatness; likas at marangal sa modernong Filipino.
- source_word: הַגְּבוּרָה
  choice: ang kapangyarihan
  rationale: Saklaw nito ang lakas o kapangyarihan; ang “kapangyarihan” ay malinaw sa karaniwang mambabasa at angkop sa pagpupuring maharlika.
- source_word: הַתִּפְאֶרֶת
  choice: ang karilagan
  rationale: Maaaring tumukoy sa ganda, luwalhati, o ningning. Pinananatili ng “karilagan” ang maringal na diwa nang hindi inuulit ang kahulugan ng kamahalan.
- source_word: הַנֵּצַח
  choice: ang tagumpay
  rationale: Mahirap tiyakin ang eksaktong diwa rito; sa talaan ng mga katangiang maharlika, ang “tagumpay” ay angkop, habang inilalahad sa talababa ang mga posibleng diwang walang hanggan o nangingibabaw na kataasan.
- source_word: הַהוֹד
  choice: ang kamahalan
  rationale: Tumutukoy sa majesty, splendor, o honor. Ang “kamahalan” ay akma sa konteksto ng paghahari at naiiba sa “karilagan.”
- source_word: כִּי כֹל בַּשָּׁמַיִם וּבָאָרֶץ
  choice: sapagkat sa iyo ang lahat ng nasa langit at nasa lupa
  rationale: Binabasa ang כִּי bilang sanhi at ang כֹל bilang komprehensibong “lahat.” Idinagdag ang “sa iyo” bilang likas na Filipino na pagpapahayag ng ipinahihiwatig na pag-aari sa konteksto.
- source_word: הַמַּמְלָכָה
  choice: ang kaharian
  rationale: Maaaring tumukoy sa kaharian, paghahari, o pagkahari. Ang “kaharian” ang pinakadirekta at nananatiling bukas sa diwa ng sakop at paghaharing maharlika.
- source_word: וְהַמִּתְנַשֵּׂא
  choice: at ikaw ay itinataas
  rationale: Ang participle ay ginawang panaguring pandiwa sa Filipino. Pinananatili ng pasibong anyo ang leksikal na larawan ng pagiging mataas o dinakila nang hindi tahasang nagpapasiya kung reflexive o stative ang diin.
- source_word: לְכֹל לְרֹאשׁ
  choice: bilang pinuno ng lahat
  rationale: Ipinahahayag nito ang kataas-taasang katayuan bilang ulo o pinuno sa ibabaw ng lahat; ang “pinuno ng lahat” ay natural sa Filipino at pinananatili ang diwa ng headship.
theological_decisions:
- issue: Pagtutumbas sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; ang PANGINOON
  rationale: Pangalan mismo ang nasa tekstong Hebreo, kaya pinanatili ito sa transliterasyong “Yahweh” sa halip na palitan ng titulo.
- issue: Kahulugan ng נֵצַח sa talaan ng papuri
  choice: tagumpay
  alternative: kawalang-hanggan; nangingibabaw na kataasan
  rationale: Ang “tagumpay” ay angkop sa maharlika at doksolohikal na konteksto, ngunit tunay na malawak at pinagtatalunan ang saklaw ng salitang Hebreo; kaya pinananatili sa talababa ang ibang posibleng kahulugan.
- issue: Diwa ng וְהַמִּתְנַשֵּׂא
  choice: ikaw ay itinataas
  alternative: ikaw ang nakahihigit; itinataas mo ang iyong sarili
  rationale: Pinananatili ng salin ang anyong may diwang pagtaas/pagkadakila at iniiwasang gawing mas tiyak kaysa sa Hebreo ang ugnayan ng stative, passive, at reflexive na mga posibilidad.
translation_notes:
  register: Makabago ngunit marangal na Filipino, na may ritmong angkop sa panalangin at pampublikong pagbasa. Pinanatili ang paulit-ulit na “Sa iyo, Yahweh” at ang sunod-sunod na mga pangngalan upang masalamin ang diin at anyong doksolohikal ng Hebreo.
