  source_fidelity: Tumpak na naisasalin ng draft ang magkakasunod na katangiang nauukol kay Yahweh, ang saklaw na “lahat ng nasa langit at nasa lupa,” at ang inuulit na pagbibigay-pag-aari sa kanya. Ang “tagumpay” para sa נֵצַח ay katanggap-tanggap kung may talababa. Gayunman, ang “ikaw ay itinataas” ay karaniwang nagpapahiwatig sa Filipino na may ibang taong patuloy na nagtataas kay Yahweh. Hindi nito likas na naihahayag ang predikativong diwa ng participle na siya ay nakataas/dinakila higit sa lahat.
  naturalness: Marangal at malinaw ang karamihan ng salin. Mas likas at mas angkop sa pahayag ng pagpupuri ang “ikaw ay nakataas bilang pinuno ng lahat” kaysa “ikaw ay itinataas bilang pinuno ng lahat.”
  terminology: Ang “Yahweh,” “kadakilaan,” “kapangyarihan,” “karilagan,” “kamahalan,” at “kaharian” ay magkakaiba at angkop sa kontekstong maharlika. Ang talababa ay pinananatili ang leksikal na kalabuan ng נֵצַח nang hindi itinatanghal ang isang alternatibo bilang tiyak.
