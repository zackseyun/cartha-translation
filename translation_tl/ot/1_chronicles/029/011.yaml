  revised_text: Sa iyo, Yahweh, ang kadakilaan, ang kapangyarihan, ang karilagan, ang tagumpay[a], at ang kamahalan, sapagkat sa iyo ang lahat ng nasa langit at nasa lupa. Sa iyo, Yahweh, ang kaharian, at ikaw ay nakataas bilang pinuno ng lahat.
