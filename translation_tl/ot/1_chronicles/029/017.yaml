  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/יָדַ֣עְתִּי אֱלֹהַ֔/י כִּ֤י אַתָּה֙ בֹּחֵ֣ן לֵבָ֔ב וּ/מֵישָׁרִ֖ים תִּרְצֶ֑ה אֲנִ֗י בְּ/יֹ֤שֶׁר לְבָבִ/י֙ הִתְנַדַּ֣בְתִּי כָל אֵ֔לֶּה וְ/עַתָּ֗ה עַמְּ/ךָ֙ הַ/נִּמְצְאוּ פֹ֔ה רָאִ֥יתִי בְ/שִׂמְחָ֖ה לְ/הִֽתְנַדֶּב לָֽ/ךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/017.yaml
  text: And I know[a], my God, that you test the heart and take pleasure in uprightness. I, in the uprightness of my heart, have willingly offered all these things[b], and now I have seen your people who are present here willingly offer to you with joy.
translation:
  language: tl
  text: At alam ko, O Diyos ko, na sinusuri mo ang puso at nalulugod ka sa katapatan. Sa katapatan ng aking puso ay kusang-loob kong inihandog ang lahat ng ito. At ngayon, buong galak kong nakita ang iyong bayang naririto[a] na kusang-loob na naghahandog sa iyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “iyong bayang natagpuan dito,” ibig sabihin, “iyong bayang naririto.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בֹּחֵן לֵבָב
  choice: sinusuri mo ang puso
  rationale: Ipinahahayag ng בֹּחֵן ang masusing pagsisiyasat o pagsubok, at pinananatili ng “puso” ang Hebreong larawan ng panloob na pagkatao, pag-iisip, at kalooban.
- source_word: וּמֵישָׁרִים תִּרְצֶה
  choice: nalulugod ka sa katapatan
  rationale: Ang מֵישָׁרִים ay tumutukoy sa katuwiran o integridad, samantalang ang תִּרְצֶה ay nagpapahayag ng pagkalugod o pagtanggap. Natural sa modernong Tagalog ang “nalulugod ka sa katapatan.”
- source_word: בְּיֹשֶׁר לְבָבִי
  choice: sa katapatan ng aking puso
  rationale: Malapit itong sumusunod sa anyo ng Hebreo at ipinakikitang ang kusang paghahandog ay nagmula sa tapat na panloob na hangarin.
- source_word: הִתְנַדַּבְתִּי
  choice: kusang-loob kong inihandog
  rationale: Ang hitpael ng נדב ay tumutukoy sa kusang pagbibigay; ang “inihandog” ay angkop sa konteksto ng mga kaloob para sa templo.
- source_word: כָל אֵלֶּה
  choice: ang lahat ng ito
  rationale: Tumutukoy ang parirala sa mga handog na binanggit sa naunang konteksto nang hindi dinaragdagan ang detalye ng teksto.
- source_word: עַמְּךָ הַנִּמְצְאוּ פֹה
  choice: ang iyong bayang naririto
  rationale: Bagaman literal na “iyong bayang natagpuan dito,” idiomatiko ang nifal ng מצא sa kahulugang “naroroon” o “present.”
- source_word: רָאִיתִי בְשִׂמְחָה
  choice: buong galak kong nakita
  rationale: Pinananatili nitong ang galak ay pangunahing kaugnay ng pagkakita ni David, gaya ng ayos ng pariralang Hebreo.
- source_word: לְהִתְנַדֶּב לָךְ
  choice: na kusang-loob na naghahandog sa iyo
  rationale: Inuulit nito ang diwa ng נדב at natural na inilalarawan ang patuloy na nakikitang pagkilos ng bayan.
- source_word: אֱלֹהַי
  choice: O Diyos ko
  rationale: Ang “O” ay natural at marangal na pananda ng tuwirang pagtawag sa panalangin.
theological_decisions:
- issue: Saklaw ng לֵבָב sa antropolohiyang Hebreo
  choice: puso bilang panloob na pagkatao, kabilang ang layunin at kalooban
  alternative: isip o kalooban lamang
  rationale: Pinananatili ng “puso” ang metapora at malawak na saklaw ng Hebreo sa halip na paliitin ito sa damdamin, isip, o kalooban lamang.
- issue: Kahulugan ng מֵישָׁרִים
  choice: katapatan
  alternative: katuwiran o integridad
  rationale: Ang “katapatan” ay likas sa kontekstong tumutukoy sa tapat na motibo sa kusang pagbibigay, ngunit hindi nito itinatanggi ang mas malawak na diwa ng moral na katuwiran.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Pinanatili ang pag-uulit ng “katapatan” at “kusang-loob” upang maipakita ang mahahalagang leksikal na ugnayan sa Hebreo. Ginamit ang “bayang” bilang kolektibong tawag sa people, hindi sa lugar.
