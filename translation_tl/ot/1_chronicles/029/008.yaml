id: 1CH.29.8
reference: 1 Chronicles 29:8
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/הַ/נִּמְצָ֤א אִתּ/וֹ֙ אֲבָנִ֔ים נָתְנ֖וּ לְ/אוֹצַ֣ר בֵּית יְהוָ֑ה עַ֥ל יַד יְחִיאֵ֖ל הַ/גֵּרְשֻׁנִּֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/008.yaml
  text: Whoever had precious stones gave them to the treasury of the house of Yahweh, into the care of Jehiel the Gershonite.
translation:
  language: tl
  text: Ang sinumang may mahahalagang bato ay nagbigay ng mga iyon sa kabang-yaman ng bahay ni Yahweh, sa pangangalaga ni Jehiel na Gershonita.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal na Hebreo, “sa kamay ni Jehiel,” isang idyomang nangangahulugang nasa pangangalaga o pamamahala niya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַנִּמְצָא אִתּוֹ
  choice: Ang sinumang may
  rationale: Ang Niphal na participle ng מצא kasama ng אִתּוֹ ay isang idyomang nagsasaad na may isang bagay sa pag-aari ng isang tao. Likas itong ipinahahayag sa Filipino bilang “ang sinumang may.”
- source_word: אֲבָנִים
  choice: mahahalagang bato
  rationale: Bagaman literal na “mga bato,” ipinahihiwatig ng konteksto ng mga ambag para sa templo na mga batong may halaga ang tinutukoy. Hindi nito tinutukoy ang isang partikular na uri ng hiyas.
- source_word: נָתְנוּ
  choice: nagbigay
  rationale: Tuwirang ipinahahayag ng נתן ang pagbibigay ng mga bato bilang kusang ambag.
- source_word: לְאוֹצַר
  choice: sa kabang-yaman
  rationale: Sa konteksto ng mahahalagang handog sa bahay ni Yahweh, ang אוֹצָר ay tumutukoy sa imbakan o treasury ng kayamanan; “kabang-yaman” ang likas at institusyonal na katumbas.
- source_word: בֵּית יְהוָה
  choice: bahay ni Yahweh
  rationale: Pinananatili nito ang literal na larawang “bahay” sa Hebreo sa halip na gawing “templo,” habang malinaw pa rin sa konteksto.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin ang Tetragrammaton bilang personal na pangalang Yahweh sa halip na palitan ito ng isang titulo.
- source_word: עַל יַד
  choice: sa pangangalaga ni
  rationale: Ang literal na “sa pamamagitan ng kamay ni” ay idyomang nagsasaad dito ng pagkakatiwala o pamamahala. Malinaw itong naipapahayag ng “sa pangangalaga ni,” habang itinatala sa talababa ang literal na anyo.
- source_word: יְחִיאֵל
  choice: Jehiel
  rationale: Transliterasyon ng personal na pangalan ayon sa karaniwang anyong ginagamit sa Bibliyang Filipino.
- source_word: הַגֵּרְשֻׁנִּי
  choice: na Gershonita
  rationale: Tinutukoy ng gentiliko ang pagiging kabilang ni Jehiel sa angkan ni Gershon; “Gershonita” ang maikli at malinaw na katumbas.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang nasa talata ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng titulong “PANGINOON.”
- issue: Kahulugan ng אֲבָנִים sa konteksto ng handog
  choice: mahahalagang bato
  alternative: mga bato
  rationale: Literal na “mga bato” ang salita, ngunit sa konteksto ng mga iniambag sa kabang-yaman ng bahay ni Yahweh, malamang na mga batong may halaga ang tinutukoy. Hindi naman tinukoy ang eksaktong uri ng mga ito.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang Hebreong larawang “bahay ni Yahweh,” habang ginawang natural ang mga idyomang “ang sinumang may” at “sa pangangalaga ni.”
