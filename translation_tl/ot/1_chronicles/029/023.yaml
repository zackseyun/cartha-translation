base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/023.yaml
  text: Then Solomon sat on the throne of Yahweh as king in place of David his father[a], and he prospered, and all Israel listened to him.
translation:
  language: tl
  text: Pagkatapos, umupo si Solomon sa trono ni Yahweh bilang hari kapalit ng kanyang amang si David. Naging matagumpay siya, at nakinig sa kanya[a] ang buong Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isaling “sumunod sa kanya.” Sa kontekstong ito ng hari, ang Hebreo ay maaaring mangahulugan hindi lamang ng pakikinig kundi ng pagsunod sa kanyang awtoridad.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: umupo
  rationale: Pinananatili ang konkretong larawan ng Hebreong ישב, na sa kontekstong ito ay nagpapahiwatig din ng pagluklok sa trono.
- source_word: כִּסֵּא יְהוָה
  choice: trono ni Yahweh
  rationale: Tuwirang pinananatili ang pariralang ‘trono ni Yahweh’ at ang teolohikal na pahayag na ang paghahari ng angkan ni David ay nasa ilalim ng pamamahala ng Diyos.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang transliterasyon ng banal na pangalan sa halip na palitan ito ng isang titulo.
- source_word: לְמֶלֶךְ
  choice: bilang hari
  rationale: Likas na Filipino para sa ל na tumutukoy sa tungkulin o katungkulan.
- source_word: תַּחַת דָּוִיד אָבִיו
  choice: kapalit ng ama niyang si David
  rationale: Sa konteksto ng paghalili sa hari, ang תַּחַת ay nangangahulugang ‘kapalit ng’ o ‘bilang kahalili ng,’ hindi lamang ‘pagkatapos ng.’
- source_word: וַיַּצְלַח
  choice: umunlad siya
  rationale: Sinasaklaw ng ‘umunlad’ ang diwa ng צלח na pagtatagumpay o pagiging matagumpay nang hindi nagdaragdag ng paliwanag na wala sa teksto.
- source_word: וַיִּשְׁמְעוּ אֵלָיו
  choice: nakinig sa kanya
  rationale: Pinananatili ang pangunahing larawan ng ‘pakikinig’ sa שׁמע אל, habang ang konteksto ng pagkilala sa awtoridad ng hari ay maaari ring magpahiwatig ng pagsunod.
- source_word: כָּל יִשְׂרָאֵל
  choice: ang buong Israel
  rationale: Karaniwang kolektibong katawagan sa buong bayan; hindi kailangan ng pagpapalawak.
theological_decisions:
- issue: Kahulugan ng ‘trono ni Yahweh’ kaugnay ng paghahari ni Solomon
  choice: Panatilihin ang mismong parirala upang maipahayag na ang paghahari ni Solomon ay kumakatawan sa pamamahala ni Yahweh.
  alternative: Ipaliwanag ito bilang isang karaniwang tronong politikal lamang o palitan ng malayang paraprasis.
  rationale: Sadyang inilalarawan ng Cronista ang trono ng hari mula sa angkan ni David bilang trono ni Yahweh. Dapat mapanatili ang pahayag na ito nang hindi nilalagyan ng sistematikong paliwanag na wala sa talata.
- issue: Pakikinig o pagsunod ng buong Israel
  choice: nakinig sa kanya
  alternative: sumunod sa kanya
  rationale: Maaaring tumukoy ang Hebreong parirala sa maingat na pakikinig o sa pagsunod sa awtoridad. Pinananatili sa pangunahing teksto ang leksikal na larawan at inilalahad sa talababa ang kontekstuwal na diwa ng pagsunod.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘ama niyang si David’ bilang likas na ayos sa Tagalog, at pinanatili ang ‘Yahweh’ bilang personal na pangalan. Inilagay ang talababa sa pariralang aktuwal nitong nililinaw.
