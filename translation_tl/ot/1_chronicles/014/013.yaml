  text: And the Philistines again spread out in the valley[a].
translation:
  language: tl
  text: Muling kumalat sa lambak ang mga Filisteo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring, “Minsan pang kumalat sa lambak ang mga Filisteo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּסִיפוּ עוֹד
  choice: muling
  rationale: Magkasamang nagpapahayag ang וַיֹּסִיפוּ at עוֹד ng pag-uulit ng kilos. Likas at maikli itong naihahayag sa Tagalog sa pamamagitan ng “muling,” sa halip na isalin nang hiwalay at mekanikal ang dalawang salita.
- source_word: פְּלִשְׁתִּים
  choice: ang mga Filisteo
  rationale: Karaniwang anyong Tagalog ng pangalan ng pangkat, na may “ang mga” upang malinaw na tumukoy sa buong pangkat.
- source_word: וַיִּפְשְׁטוּ
  choice: kumalat
  rationale: Sa kontekstong militar, maaaring tumukoy ang פשט sa pagkalat o paghanay ng mga hukbo. Pinananatili ng “kumalat” ang larawang nasa Hebreo nang hindi ipinapalagay na sila ay nanalakay o nangloob.
- source_word: בָּעֵמֶק
  choice: sa lambak
  rationale: Ang בְּ ay pinakanatural na lokatibo rito, at ang tiyak na anyo ng עֵמֶק ay naihahayag bilang “sa lambak.”
