translation_notes:
  register: Modernong Filipino Tagalog na maikli, marangal, at madaling maunawaan. Inuna ang natural na ayos ng pangungusap habang pinananatili ang pag-uulit ng pagkilos at ang hindi lubusang tiyak na diwang militar ng פשט.
