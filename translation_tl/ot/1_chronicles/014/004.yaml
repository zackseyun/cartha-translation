  yaml_path: translation/ot/1_chronicles/014/004.yaml
  text: 'And these are the names of the children born to him in Jerusalem: Shammua[a], Shobab, Nathan, and Solomon.'
translation:
  language: tl
  text: 'At ito ang mga pangalan ng mga anak na isinilang sa kaniya sa Jerusalem: Samua, Sobab, Natan, at Solomon.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: At ito ang
  rationale: Pinananatili ng “At” ang pagkakaugnay sa naunang salaysay, at likas sa Filipino ang “ito ang” bilang pambungad sa talaan.
- source_word: שְׁמוֹת
  choice: mga pangalan ng
  rationale: Ang pangmaramihang anyong construct ng “pangalan” ay natural na isinasalin bilang “mga pangalan ng” bago tukuyin ang mga taong nakatala.
- source_word: הַיְלוּדִים אֲשֶׁר הָיוּ לוֹ
  choice: mga anak na isinilang sa kaniya
  rationale: Ang הַיְלוּדִים ay literal na “mga isinilang,” hindi ang karaniwang salitang Hebreo para sa “mga anak na lalaki.” Ang “mga anak na isinilang sa kaniya” ay malinaw at natural, at hindi higit na nagtutukoy kaysa sa anyong Hebreo.
- source_word: בִּירוּשָׁלִָם
  choice: sa Jerusalem
  rationale: Tuwirang pook na nagsasaad kung saan isinilang ang mga anak.
- source_word: שַׁמּוּעַ
  choice: Samua
  rationale: Transliterasyon sa paraang madaling basahin at bigkasin sa modernong Filipino.
- source_word: שׁוֹבָב
  choice: Sobab
  rationale: Transliterasyon ng personal na pangalan sa paraang angkop sa Filipino.
- source_word: נָתָן
  choice: Natan
  rationale: Malapit na transliterasyon ng pangalang Hebreo at karaniwang anyo sa mga saling Filipino.
- source_word: שְׁלֹמֹה
  choice: Solomon
  rationale: Ginamit ang matatag at malawak na kinikilalang anyo ng pangalan sa Filipino.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na tuwiran, marangal, at madaling maunawaan. Pinanatili ang ugnayang pasalaysay sa pamamagitan ng “At,” at isinalin ang participle bilang “mga anak na isinilang” upang maging natural nang hindi ipinapalit ang mas espesipikong “mga anak na lalaki.”
