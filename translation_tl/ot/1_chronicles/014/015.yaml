base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/014/015.yaml
  text: And when you hear the sound of marching in the tops of the balsam trees[a], then go out to battle, for God has gone out before you to strike down the camp of the Philistines.
translation:
  language: tl
  text: Kapag narinig mo ang tunog ng pagmamartsa sa mga tuktok ng mga punong balsamo[a], saka ka lumabas upang makipaglaban, sapagkat nauna nang lumabas ang Diyos sa unahan mo upang talunin ang hukbo ng mga Filisteo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga punong baca” o, ayon sa tradisyon, “mga punong mulberi”; hindi tiyak ang eksaktong uri ng punong tinutukoy ng Hebreo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וִיהִי כְּשָׁמְעֲךָ
  choice: Kapag narinig mo
  rationale: Ang waw na kasama ng היה at ang כ + infinitive construct ay nagpapakilala ng kalagayang temporal. Likas sa modernong Tagalog ang “Kapag narinig mo” at hindi nito dinaragdagan ang diwang “kaagad” na hindi tahasang nakasaad.
- source_word: קוֹל הַצְּעָדָה
  choice: tunog ng pagmamartsa
  rationale: Ang קוֹל dito ay naririnig na tunog, hindi tinig, at ang הַצְּעָדָה ay tumutukoy sa paghakbang o pagmamartsa. Ang kontekstong pandigma ay sumusuporta sa “pagmamartsa.”
- source_word: בְּרָאשֵׁי הַבְּכָאִים
  choice: sa mga tuktok ng mga punong balsamo
  rationale: Ang רָאשִׁים ay mga tuktok o itaas na bahagi. Hindi tiyak ang uri ng punong tinutukoy ng בְּכָאִים; ginamit ang karaniwang pagkakakilanlang “balsamo” at nilinaw ang kawalang-katiyakan sa talababa.
- source_word: אָז
  choice: saka
  rationale: Ipinakikita nito ang kasunod na kilos matapos marinig ang palatandaan. Ang “saka” ay natural na panandang temporal sa Tagalog.
- source_word: תֵּצֵא בַמִּלְחָמָה
  choice: lumabas upang makipaglaban
  rationale: Pinananatili ng “lumabas” ang payak na kahulugan ng יצא, habang malinaw na ipinahahayag ng “upang makipaglaban” ang kontekstong militar ng kasunod na parirala.
- source_word: כִּי יָצָא הָאֱלֹהִים לְפָנֶיךָ
  choice: sapagkat nauna na sa iyo ang Diyos
  rationale: Ang כִּי ay nagbibigay ng dahilan. Ipinakikita ng perfect na יָצָא na nagsimula na ang pagkilos ng Diyos; ang “nauna na sa iyo” ay natural sa Tagalog at pinananatili ang larawan ng Diyos na nauuna sa labanan.
- source_word: לְהַכּוֹת אֶת מַחֲנֵה פְלִשְׁתִּים
  choice: upang pabagsakin ang kampo ng mga Filisteo
  rationale: Ang hiphil ng נכה ay maaaring mangahulugang hampasin o gapiin. Ang “pabagsakin” ay naghahatid ng mapagpasyang pagkilos laban sa kampo nang hindi gumagamit ng lipas na pananalita.
theological_decisions:
- issue: Paglalarawan sa הָאֱלֹהִים
  choice: ang Diyos
  alternative: ang mga diyos
  rationale: Bagaman anyong maramihan ang אֱלֹהִים, singular ang pandiwa at malinaw sa konteksto na ang Diyos ng Israel ang tinutukoy, kaya singular ang salin.
- issue: Panahunan ng יָצָא
  choice: nauna na sa iyo ang Diyos
  alternative: nauuna sa iyo ang Diyos
  rationale: Pinananatili ng “nauna na” ang perfect na anyo at ang pahiwatig na kumikilos na ang Diyos kapag narinig ang palatandaan, nang hindi ginagawang pangkalahatang pahayag ang pangyayari.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang imaheng militar at ang pagkakasunod ng palatandaan, paglabas sa labanan, at pagkilos ng Diyos. Iniwasan ang sobrang literal na sintaks na magiging mahirap basahin.
