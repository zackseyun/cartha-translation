revisions:
- from: Kapag narinig mo ang tunog ng pagmamartsa sa mga tuktok ng mga punong balsamo[a], saka ka lumabas upang makipaglaban, sapagkat nauna na sa iyo ang Diyos upang pabagsakin ang kampo ng mga Filisteo.
  to: Kapag narinig mo ang tunog ng pagmamartsa sa mga tuktok ng mga punong balsamo[a], saka ka lumabas upang makipaglaban, sapagkat nauna nang lumabas ang Diyos sa unahan mo upang talunin ang hukbo ng mga Filisteo.
  rationale: Pinalitan ang nakalilitong “baka” ng “baca” bilang transliterasyon, habang pinanatili ang balsamo bilang pangunahing salin at ang tradisyonal na mulberi bilang alternatibo. Inayos din ang huling parirala upang maging likas sa modernong Tagalog at maipahayag ang pagkatalo ng puwersang Filisteo na ipinahihiwatig ng Hebreo.
