  text: The Philistines came and raided the Valley of Rephaim[a].
translation:
  language: tl
  text: Dumating ang mga Filisteo at nanalakay sa Lambak ng Refaim[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kumalat sa Lambak ng Refaim.” Ang pandiwang Hebreo ay maaaring tumukoy sa pagpapakalat o pagpapuwesto ng mga kawal, o sa pagsalakay; ipinahihiwatig ng konteksto ang isang paglusob ng kaaway.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/פְלִשְׁתִּים
  choice: ang mga Filisteo
  rationale: Ang פְלִשְׁתִּים ay pangalang-etniko. Hindi kailangang katawanin nang hiwalay ang וּ sa simula dahil natural na naipagpapatuloy ng pangungusap ang salaysay sa Tagalog.
- source_word: בָּאוּ
  choice: Dumating
  rationale: Ang Qal perfect na בוא ay tuwirang nagsasaad na sila ay dumating; natural itong anyong naganap sa salaysay.
- source_word: וַיִּפְשְׁטוּ
  choice: nanalakay
  rationale: Sa kontekstong militar, ang פשט ay maaaring tumukoy sa pagkalat o pagdeploy, ngunit maaari ring magpahiwatig ng mapanlabang pagsalakay. Ang “nanalakay” ay natural at angkop sa konteksto habang inilalagay sa talababa ang tunay na alternatibo.
- source_word: בְּ/עֵמֶק
  choice: sa Lambak ng
  rationale: Ang בְּ ay “sa,” at ang עֵמֶק ay “lambak.” Ginamit ang malaking titik sa “Lambak” bilang bahagi ng kinikilalang pangalan ng lugar.
- source_word: רְפָאִים
  choice: Refaim
  rationale: Dito, ang רְפָאִים ay bahagi ng pangalan ng lugar at kaya isinalin sa pamamagitan ng transliterasyong angkop sa bigkas at baybay sa Filipino.
