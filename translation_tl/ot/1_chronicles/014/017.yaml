  text: וַ/יֵּצֵ֥א שֵׁם דָּוִ֖יד בְּ/כָל הָֽ/אֲרָצ֑וֹת וַֽ/יהוָ֛ה נָתַ֥ן אֶת פַּחְדּ֖/וֹ עַל כָּל הַ/גּוֹיִֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/014/017.yaml
  text: And David’s name went out into all the lands[b][a], and Yahweh put the fear of him on all the nations.
translation:
  language: tl
  text: At lumaganap ang pangalan ni David sa lahat ng mga lupain,[a] at pinapangyari ni Yahweh na matakot kay David ang lahat ng bansa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kumalat ang katanyagan ni David sa lahat ng mga lupain.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “inilagay ni Yahweh ang kanyang takot sa lahat ng bansa.” Malamang na si David ang tinutukoy ng “kanyang”; maaari rin itong unawain na tumutukoy kay Yahweh.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּצֵא שֵׁם דָּוִיד
  choice: lumaganap ang pangalan ni David
  rationale: Ang יָצָא ay literal na “lumabas,” ngunit kapag ang paksa ay “pangalan,” ang idyoma ay tumutukoy sa paglaganap ng balita, katanyagan, o reputasyon. Pinananatili ng “pangalan” ang larawang Hebreo, samantalang natural na ipinahahayag ng “lumaganap” ang kahulugan nito sa Filipino.
- source_word: בְּכָל הָאֲרָצוֹת
  choice: sa lahat ng lupain
  rationale: Ang maramihang אֲרָצוֹת ay tumutukoy sa iba’t ibang lupain o teritoryo. Ang “mga lupain” ay mas malapit sa anyo ng Hebreo kaysa “mga bansa,” na ginagamit naman sa kasunod na parirala para sa גּוֹיִם.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang personal na pangalan ng Diyos na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: נָתַן אֶת־פַּחְדּוֹ עַל
  choice: pinapangyari ... na matakot kay David
  rationale: Literal itong “inilagay ang takot sa kanya sa ibabaw ng,” ngunit ang Filipino na “pinapangyari ... na matakot” ay malinaw at likas na katumbas ng idyomang nagsasaad na si Yahweh ang sanhi ng pagkatakot ng mga bansa.
- source_word: כָּל־הַגּוֹיִם
  choice: lahat ng bansa
  rationale: Ang גּוֹיִם ay tumutukoy rito sa nakapaligid na mga bayan o bansa; ang “lahat ng bansa” ay maikli, natural, at angkop sa konteksto.
theological_decisions:
- issue: Tinutukoy ng hulaping panghalip sa פַּחְדּוֹ
  choice: 'Si David ang tinutukoy: pinapangyari ni Yahweh na matakot kay David ang mga bansa.'
  alternative: 'Maaaring unawain ang hulapi bilang tumutukoy kay Yahweh: ang takot kay Yahweh ay inilagay sa mga bansa.'
  rationale: Si David ang pinakamalapit at pangunahing tinutukoy sa pangungusap, at ang konteksto ay tungkol sa paglaganap ng kanyang katanyagan matapos ang mga tagumpay na ipinagkaloob ng Diyos. Gayunman, dahil maaaring pagtalunan sa gramatika ang pinatutungkulan ng hulapi, itinatala sa talababa ang ibang pagbasa.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Pinanatili ang Hebreong larawan ng “pangalan” habang ginawang natural ang pandiwang idyoma. Tahasang binanggit si David sa ikalawang sugnay upang maiwasan ang di-likas at labis na malabong panghalip sa Filipino, habang inilalahad sa talababa ang literal na anyo at ang posibleng ibang pagbasa.
