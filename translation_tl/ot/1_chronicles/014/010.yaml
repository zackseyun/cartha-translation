  text: וַ/יִּשְׁאַ֨ל דָּוִ֤יד בֵּ/אלֹהִים֙ לֵ/אמֹ֔ר הַ/אֶֽעֱלֶה֙ עַל פלשתיים וּ/נְתַתָּ֖/ם בְּ/יָדִ֑/י וַ/יֹּ֨אמֶר ל֤/וֹ יְהוָה֙ עֲלֵ֔ה וּ/נְתַתִּ֖י/ם בְּ/יָדֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/014/010.yaml
  text: And David inquired of God[a], saying, “Shall I go up against the Philistines, and will you give them into my hand?” And Yahweh said to him, “Go up, and I will give them into your hand.”
translation:
  language: tl
  text: Nagtanong si David sa Diyos, “Sasalakayin ko ba ang mga Filisteo? Ibibigay mo ba sila sa aking kamay[a]?” Sinabi sa kanya ni Yahweh, “Sumalakay ka, at ibibigay ko sila sa iyong kamay.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O, “Ipapasailalim mo ba sila sa aking kapangyarihan?” Literal sa Hebreo: “ibibigay mo ba sila sa aking kamay?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁאַל ... בֵּאלֹהִים
  choice: Nagtanong ... sa Diyos
  rationale: Sa konteksto, humingi si David ng patnubay mula sa Diyos. Likas sa modernong Tagalog ang “nagtanong sa Diyos,” samantalang malinaw sa salaysay na hindi ito karaniwang pagtatanong lamang.
- source_word: הַאֶעֱלֶה עַל פלשתיים
  choice: Sasalakayin ko ba ang mga Filisteo?
  rationale: Ang עלה na may עַל at pangalan ng kaaway ay tumutukoy sa pagsulong upang lumaban. Inihahatid ng “sasalakayin” ang diwang militar nang mas natural kaysa sa literal na “aahon.”
- source_word: וּנְתַתָּם בְּיָדִי
  choice: Ibibigay mo ba sila sa aking kamay
  rationale: Pinananatili ang Hebreong larawan ng pagbibigay sa kamay, na nangangahulugang pagpapasailalim sa kapangyarihan o pagkakaloob ng tagumpay.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinalin bilang personal na pangalan ng Diyos, hindi pinalitan ng isang titulo.
- source_word: עֲלֵה
  choice: Sumalakay ka
  rationale: Sa kontekstong militar, ito ang natural na katumbas ng utos na sumulong laban sa mga Filisteo at tumutugma sa pandiwang ginamit sa tanong ni David.
- source_word: וּנְתַתִּים בְּיָדֶךָ
  choice: ibibigay ko sila sa iyong kamay
  rationale: Pinananatili ang pag-uulit at simetriya sa pagitan ng tanong ni David at ng sagot ni Yahweh.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Tuwirang ginagamit ng talata ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng titulo.
- issue: Kahulugan ng pagbibigay sa kamay
  choice: Pinanatili ang idyomang “sa kamay”
  alternative: “sa kapangyarihan” o “ipagkakaloob ang tagumpay laban sa kanila”
  rationale: Hindi nilulutas nang tahasan ang buong implikasyon ng idyoma; pinananatili ang konkretong larawan at ang eksaktong pagtutugma ng tanong at sagot.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “sasalakayin/sumalakay” para sa natural na pagpapahayag ng militar na gamit ng עלה, habang pinanatili ang Hebreong idyomang “sa kamay” at ang pangalang Yahweh.
