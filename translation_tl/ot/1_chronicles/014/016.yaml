  yaml_path: translation/ot/1_chronicles/014/016.yaml
  text: So David did as God had commanded him, and they struck down the Philistine army from Gibeon as far as Gezer.
translation:
  language: tl
  text: At ginawa ni David ang iniutos sa kanya ng Diyos, at tinalo nila ang hukbo ng mga Filisteo[a] mula sa Gibeon hanggang sa Gezer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kampo ng mga Filisteo.” Literal na “kampo” ang salitang Hebreo, ngunit sa kontekstong militar maaari itong tumukoy sa puwersang nakakampo roon.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ ... כַּאֲשֶׁר צִוָּהוּ
  choice: ginawa ... ang iniutos sa kanya
  rationale: Likas na pariralang Filipino para sa pagsunod ni David ayon sa iniutos sa kanya; pinananatili nito ang payak na estilong pasalaysay.
- source_word: הָאֱלֹהִים
  choice: Diyos
  rationale: Tumutukoy sa Diyos ng Israel sa konteksto; natural sa Filipino ang walang pantukoy na 'ang' sa loob ng pariralang ito.
- source_word: וַיַּכּוּ
  choice: nilupig nila
  rationale: Ang pandiwa ay maramihan, kaya tumutukoy kay David kasama ng kanyang mga tauhan. Sa kontekstong militar, ipinahahayag ng 'nilupig' ang diwa ng pananakit o pagtalo.
- source_word: מַחֲנֵה פְלִשְׁתִּים
  choice: ang kampo ng mga Filisteo
  rationale: Pinananatili ang lantad na kahulugan ng מַחֲנֶה na 'kampo' sa halip na tahasang gawing 'hukbo,' bagaman maaari itong tumukoy sa puwersang militar sa pamamagitan ng metonimiya.
- source_word: מִגִּבְעוֹן וְעַד גָּזְרָה
  choice: mula sa Gibeon hanggang sa Gezer
  rationale: Natural na Filipino para sa saklaw na ipinahihiwatig ng מִן ... עַד; pinananatili ang mga pangalang pantangi.
theological_decisions:
- issue: Simuno ng maramihang pandiwang וַיַּכּוּ
  choice: David at ang kanyang mga tauhan, na ipinahahayag sa 'nila'
  alternative: Si David lamang bilang kolektibong pinuno
  rationale: Malinaw na maramihan ang anyong Hebreo, kaya hindi ito pinapantay sa isahang simuno.
- issue: Tinutukoy ng מַחֲנֵה פְלִשְׁתִּים
  choice: literal na 'kampo ng mga Filisteo'
  alternative: '''hukbo ng mga Filisteo'' bilang metonimikong kahulugan'
  rationale: Pinananatili sa pangunahing teksto ang leksikal na anyo ng Hebreo habang inilalahad sa talababa ang posibleng militar na kahulugan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang 'Kaya' bilang natural na pang-ugnay sa salaysay, at iniwasan ang labis na teknikal o denominasyonal na pananalita.
