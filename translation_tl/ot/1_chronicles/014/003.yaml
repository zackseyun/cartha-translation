  text: וַ/יִּקַּ֨ח דָּוִ֥יד ע֛וֹד נָשִׁ֖ים בִּ/ירוּשָׁלִָ֑ם וַ/יּ֧וֹלֶד דָּוִ֛יד ע֖וֹד בָּנִ֥ים וּ/בָנֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/014/003.yaml
  text: And David took more wives in Jerusalem[a], and David fathered more sons and daughters.
translation:
  language: tl
  text: Kumuha pa si David ng mga asawa sa Jerusalem[a], at nagkaanak pa si David ng mga anak na lalaki at babae.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nag-asawa pa ng ibang mga babae”; literal na sinasabi ng Hebreo, “kumuha pa ng mga asawa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: Kumuha
  rationale: Pinananatili nito ang karaniwang kahulugan ng pandiwang לקח na ‘kumuha’ nang hindi ginagawang tahasang pandiwa para sa pag-aasawa.
- source_word: עוֹד
  choice: pa
  rationale: 'Sa dalawang paglitaw nito, ipinahihiwatig ng עוֹד ang karagdagan: kumuha pa ng mga asawa at nagkaanak pa.'
- source_word: נָשִׁים
  choice: mga asawa
  rationale: Bagaman maaari itong mangahulugang ‘mga babae,’ ang konteksto ng pagkuha ni David sa kanila ay nagpapahiwatig ng ugnayang pag-aasawa.
- source_word: בִּירוּשָׁלִָם
  choice: sa Jerusalem
  rationale: Likas na salin ng lokatibong pang-ukol ב kasama ng pangalan ng lugar.
- source_word: וַיּוֹלֶד
  choice: nagkaanak
  rationale: Kapag lalaki ang simuno, tumutukoy ang ילד sa pagiging ama o pagkakaroon ng mga anak. Ang ‘nagkaanak’ ay natural at malinaw sa modernong Filipino.
- source_word: בָּנִים וּבָנוֹת
  choice: mga anak na lalaki at babae
  rationale: Pinananatili nito ang tahasang pagbanggit ng Hebreo sa kapwa mga anak na lalaki at mga anak na babae.
- source_word: דָּוִיד
  choice: David
  rationale: Karaniwang anyo ng pangalan sa Filipino.
theological_decisions:
- issue: Pasalaysay na pagbanggit sa pagkakaroon ni David ng maraming asawa
  choice: Isinalin bilang payak na paglalahad, nang walang idinagdag na pagsang-ayon o pagsaway.
  alternative: Magdagdag ng moral na pahiwatig na sinasang-ayunan o hinahatulan ang ginawa ni David.
  rationale: Iniuulat lamang ng talata ang ginawa ni David at hindi ito tahasang sinusuri sa moral na paraan; kaya pinananatili ng salin ang tindig ng teksto.
translation_notes:
  register: Modernong Filipino na natural ngunit marangal. Ginamit ang ‘Kumuha ... ng mga asawa’ upang mapanatili ang anyo ng Hebreo, habang inilalahad sa talababa ang mas interpretatibo at mas malinaw na alternatibong ‘nag-asawa.’ Idinagdag ang ‘roon’ upang natural na maiugnay sa Jerusalem ang ikalawang sugnay, gaya ng daloy ng salaysay.
