  rationale: Pangalang pantangi; ginamit ang tuwirang transliterasyong angkop sa bigkas at baybay ng modernong Filipino. Hindi na idinagdag ang h sa hulihan sapagkat hindi ito natural sa Filipino.
- source_word: נֶפֶג
