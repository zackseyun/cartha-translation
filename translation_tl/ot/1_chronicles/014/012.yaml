base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/014/012.yaml
  text: And they left their gods there[a], and David gave the order[b], and they were burned with fire.
translation:
  language: tl
  text: At iniwan nila roon ang kanilang mga diyos[a]. Nag-utos si David, at sinunog ang mga iyon sa apoy.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kanilang mga diyus-diyosan.” Literal na “kanilang mga diyos” ang Hebreo, bagaman malamang na ang tinutukoy ay ang kanilang mga imaheng panrelihiyon.
    reason: lexical_alternative
  - marker: b
    text: 'Mas aktibo ang pagkakasabi sa kapantay na salaysay sa 2 Samuel 5:21: “Dinala ni David at ng kanyang mga tauhan ang mga iyon.” Sa Mga Cronica naman, sinunog ang mga iyon sa apoy ayon sa utos ni David.'
    reason: cross_reference
lexical_decisions:
- source_word: וַיַּעַזְבוּ
  choice: iniwan nila
  rationale: Karaniwang nangangahulugan ang עזב na ‘iwan’ o ‘pabayaan.’ Ang ‘iniwan nila’ ay natural at hindi nagdaragdag ng interpretasyong wala sa teksto.
- source_word: שָׁם
  choice: roon
  rationale: Payak na panandang pook ang adverbio; natural sa salaysay ang ‘roon.’
- source_word: אֶת אֱלֹהֵיהֶם
  choice: ang kanilang mga diyos
  rationale: Literal na sinasabi ng Hebreo na ‘kanilang mga diyos.’ Malamang na mga imaheng panrelihiyon ang tinutukoy, ngunit pinananatili sa pangunahing teksto ang mismong katawagan ng pinagmulan.
- source_word: וַיֹּאמֶר דָּוִיד
  choice: Nag-utos si David
  rationale: Literal itong ‘at sinabi ni David,’ ngunit walang nakasaad na direktang pananalita at ang kasunod na kilos ang nilalaman ng utos. Ipinahahayag ng ‘nag-utos’ ang gamit ng pandiwa sa konteksto.
- source_word: וַיִּשָּׂרְפוּ
  choice: sinunog ang mga iyon
  rationale: 'Ang anyo ay nauunawaang pasibo: ang naunang binanggit na mga diyos ang sinunog. Ang konstruksyong Filipino ay natural na pasibong pokus at hindi kailangang tukuyin kung sino ang nagsunog.'
- source_word: בָּאֵשׁ
  choice: sinunog
  rationale: Ang apoy bilang paraan ay likas nang ipinahahayag ng pandiwang Filipino na ‘sinunog’; ang pagdaragdag ng ‘sa apoy’ ay magiging paulit-ulit at hindi natural.
theological_decisions:
- issue: Paglalarawan sa אֱלֹהֵיהֶם sa konteksto ng mga bagay na ginagamit sa paganong pagsamba
  choice: kanilang mga diyos
  alternative: kanilang mga diyus-diyosan
  rationale: Pinananatili ng salin ang leksikal na anyo ng Hebreo at hindi tahimik na pinapalitan ito ng mas interpretatibong ‘mga diyus-diyosan.’ Ipinapaliwanag sa talababa na malamang na mga imaheng panrelihiyon ang tinutukoy.
- issue: Ugnayan sa magkaibang pananalita ng 2 Samuel 5:21
  choice: Nag-utos si David, at sinunog ang mga iyon
  alternative: Dinala ni David at ng kanyang mga tauhan ang mga iyon
  rationale: Sinusunod ang natatanging pananalita ng Mga Cronica sa halip na ipantay ito sa kapantay na salaysay sa Samuel; itinatala ang pagkakaiba sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘roon’ para sa natural na daloy ng salaysay at ang pasibong ‘sinunog ang mga iyon’ upang mapanatili ang hindi pagtukoy sa mga tagapagsagawa. Iniwasan ang paulit-ulit na ‘sinunog sa apoy,’ yamang taglay na ng pandiwang ‘sinunog’ ang paraang ipinahahayag ng בָּאֵשׁ.
