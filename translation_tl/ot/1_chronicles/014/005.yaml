translation:
  language: tl
  text: Yibhar, Elishua[a], at Elpelet.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa katumbas na tala sa 2 Samuel 5:16, “Elishama” ang lumilitaw sa bahaging ito sa halip na “Elishua.” “Elishua” ang mababasa rito sa tekstong Hebreo ng Mga Cronica.
    reason: textual_variant
  - marker: b
    text: Ang “Ibhar” o “Jibhar” at “Elpalet” ay mga alternatibong baybay ng “Yibhar” at “Elpelet” sa ibang tradisyon ng transliterasyon.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִבְחָר
  choice: Yibhar
  rationale: Pangalang pantangi na direktang isinalin sa baybay-Filipino mula sa Hebreo; ang unang י ay kinakatawan ng “Y,” na mas malinaw sa modernong Filipino kaysa sa baybay-Ingles na “Ibhar” o “Jibhar.”
- source_word: אֱלִישׁוּעַ
  choice: Elishua
  rationale: Tuwirang transliterasyon ng pangalang nasa tekstong Masoretiko ng Mga Cronica; hindi ito pinalitan ng “Elishama,” na nasa katumbas na tala sa 2 Samuel 5:16.
- source_word: אֶלְפָּלֶט
  choice: Elpelet
  rationale: Tuwirang transliterasyon na sumusunod sa pagbigkas ng tekstong Masoretiko; ang “Elpalet” ay alternatibong baybay sa ilang tradisyong Ingles.
- source_word: וְ
  choice: at
  rationale: Ang unlaping pang-ugnay ay nagdurugtong sa mga pangalan sa payak na talaan; likas itong isinalin na “at” bago ang huling pangalan.
