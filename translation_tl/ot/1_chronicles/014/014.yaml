  to: Muling sumangguni si David sa Diyos, at sinabi sa kanya ng Diyos, “Huwag kang sumulong kasunod nila. Lumibot ka palayo sa kanila, at salakayin mo sila sa tapat ng mga punong balsamo[a].”
