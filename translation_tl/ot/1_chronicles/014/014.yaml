base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/014/014.yaml
  text: So David inquired of God again[a], and God said to him, “You shall not go up after them. Circle around from behind them, and come against them opposite the balsam trees.”
translation:
  language: tl
  text: Muling sumangguni si David sa Diyos, at sinabi sa kanya ng Diyos, “Huwag kang sumulong kasunod nila. Lumibot ka palayo sa kanila, at salakayin mo sila sa tapat ng mga punong balsamo[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: “mga punong baca.” Hindi tiyak ang eksaktong uri ng puno; “mga punong mulberi” ang tradisyonal na salin sa ilang bersiyon.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁאַל ... בֵּאלֹהִים
  choice: sumangguni ... sa Diyos
  rationale: Ang שׁאל na may ב ay tumutukoy rito sa paghingi ng patnubay mula sa Diyos; mas malinaw ito sa “sumangguni” kaysa sa payak na “nagtanong.”
- source_word: עוֹד
  choice: muling
  rationale: Ipinahihiwatig nito na inulit ni David ang pagsangguni niya sa Diyos.
- source_word: לֹא תַעֲלֶה אַחֲרֵיהֶם
  choice: Huwag kang sumugod kasunod nila
  rationale: Pinananatili ng “sumugod” ang diwang militar ng עלה nang hindi tiyakang ipinapalagay na frontal na pagsalakay; ang “kasunod nila” ay tumutugma sa אַחֲרֵיהֶם.
- source_word: הָסֵב מֵעֲלֵיהֶם
  choice: Lumibot ka palayo sa kanila
  rationale: Ipinakikita ng הָסֵב ang pagliko o pag-ikot, at ng מֵעֲלֵיהֶם ang paglayo sa kasalukuyang direksiyon o posisyon kaugnay nila. Hindi idinagdag ang “sa likuran” sapagkat wala iyon sa tekstong WLC ng Cronica.
- source_word: וּבָאתָ לָהֶם
  choice: at salakayin mo sila
  rationale: Sa kontekstong militar, ang בוא + ל ay paglapit laban sa kaaway; likas sa Filipino ang “salakayin” at malinaw ang layuning militar.
- source_word: מִמּוּל
  choice: sa tapat ng
  rationale: Tumutukoy ito sa posisyong kaharap o katapat ng isang bagay.
- source_word: הַבְּכָאִים
  choice: mga punong balsamo
  rationale: Karaniwang ipinapalagay na isang uri ng punong naglalabas ng dagta, ngunit hindi tiyak ang eksaktong uri; inilalahad ang kawalang-katiyakan sa talababa.
