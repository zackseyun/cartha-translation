  text: וַ֠/יִּשְׁלַח חירם מֶֽלֶךְ צֹ֥ר מַלְאָכִים֮ אֶל דָּוִיד֒ וַ/עֲצֵ֣י אֲרָזִ֔ים וְ/חָרָשֵׁ֣י קִ֔יר וְ/חָרָשֵׁ֖י עֵצִ֑ים לִ/בְנ֥וֹת ל֖/וֹ בָּֽיִת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/014/001.yaml
  text: Then Hiram king of Tyre sent messengers to David[a], and cedar timber, masons, and carpenters[b], to build a house for him.
translation:
  language: tl
  text: Pagkatapos, nagpadala si Hiram na hari ng Tiro kay David[a] ng mga sugo, kahoy na sedro, mga mason, at mga karpintero, upang magtayo para sa kanya ng isang bahay[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga kinatawan.” Sa kontekstong maharlika, maaaring tumukoy ang salitang Hebreo sa mga opisyal na kinatawan.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “upang magtayo para sa kanya ng isang palasyo.” Ang salitang Hebreo para sa “bahay” ay maaari ring tumukoy sa tirahan ng hari.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: Pagkatapos, nagsugo
  rationale: Isinusulong ng waw-consecutive ang salaysay; natural sa modernong Tagalog ang “Pagkatapos” bilang panandang pagkakasunod, habang malinaw na nakaraang kilos ang “nagsugo.”
- source_word: חירם
  choice: Hiram
  rationale: Tuwirang transliterasyon ng anyong katinig sa talata at pangkaraniwang anyo ng pangalan sa Filipino.
- source_word: מֶלֶךְ צֹר
  choice: hari ng Tiro
  rationale: Tuwirang inilalarawan ng construct chain ang katungkulan at kaharian ni Hiram.
- source_word: מַלְאָכִים
  choice: mga sugo
  rationale: Malawak ang kahulugan nito bilang mga taong ipinadala upang kumatawan o maghatid ng mensahe; ang “mga sugo” ay dignified at hindi labis na nagtatakda ng diplomatikong ranggo.
- source_word: וַעֲצֵי אֲרָזִים
  choice: pati ng mga kahoy na sedro
  rationale: Sa konteksto ng pagtatayo, tumutukoy ito sa kahoy na materyales, hindi sa mga buhay na puno. Ipinakikita ng “pati” na kasama sa ipinadala ang mga materyales at manggagawa.
- source_word: חָרָשֵׁי קִיר
  choice: mga mason
  rationale: Ang literal na mga bihasang manggagawa sa pader ay likas na tinutukoy sa Filipino bilang mga mason sa konteksto ng konstruksiyon.
- source_word: חָרָשֵׁי עֵצִים
  choice: mga karpintero
  rationale: Ito ang natural na katawagan sa mga bihasang manggagawa sa kahoy sa konteksto ng pagtatayo.
- source_word: לִבְנוֹת לוֹ בָּיִת
  choice: upang ipagtayo siya ng isang bahay
  rationale: Pinananatili ang layunin ng infinitive at ang tuwirang kahulugan ng בָּיִת bilang “bahay,” habang natural sa Tagalog ang benefactive na “ipagtayo siya.”
theological_decisions:
- issue: Saklaw ng salitang בָּיִת sa kontekstong maharlika
  choice: bahay
  alternative: palasyo
  rationale: Maaaring tumukoy ang בָּיִת sa tirahang maharlika, ngunit hindi tahasang tinutukoy ng Hebreo ang isang “palasyo.” Pinananatili ng pangunahing teksto ang leksikal na lawak at inilalagay sa talababa ang kontekstuwal na posibilidad.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang “Tiro,” “sedro,” “mason,” at “karpintero” bilang karaniwang katawagang Filipino; pinanatili ang “bahay” upang huwag tahasang lutasin ang kontekstuwal na posibilidad na palasyo.
