  text: at sina Elisama, Beeliada[a], at Elifelet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa katumbas na tala sa 2 Samuel 5:16, “Eliada” ang anyo ng pangalan. Dito, “Beeliada” ang mababasa sa tekstong Hebreo.
    reason: alternative_reading
lexical_decisions:
- source_word: וֶ/אֱלִישָׁמָע
  choice: at sina Elisama
  rationale: Ang pang-ugnay na ו ay isinaling “at.” Ginamit ang “sina” bago ang magkakasunod na pangalan upang maging natural sa modernong Tagalog, at tinumbasan ang אֱלִישָׁמָע bilang “Elisama.”
- source_word: וּ/בְעֶלְיָדָע
  choice: Beeliada
  rationale: Sinunod ang anyong בְעֶלְיָדָע sa tekstong Hebreo at isinalin ang pangalan bilang “Beeliada.” Ang ibang anyong “Eliada” sa 2 Samuel 5:16 ay inilagay sa talababa.
- source_word: וֶ/אֱלִיפָלֶט
  choice: at Elifelet
  rationale: Ang pang-ugnay na ו ay isinaling “at,” at ang pangalang אֱלִיפָלֶט ay tinumbasan bilang “Elifelet,” ayon sa bigkas na angkop sa Filipino.
theological_decisions: []
translation_notes:
  register: Maikli, marangal, at natural na modernong Tagalog. Ginamit ang “sina” nang isang beses upang markahan ang serye ng mga pangalan, habang pinanatili ang mga pang-ugnay ng tekstong Hebreo. Ang panandang talababa [a] ay ikinabit sa “Elisama” alinsunod sa ibinigay na marker, bagaman ang nilalaman ng talababa ay tumutukoy sa pangalang Beeliada.
