  text: וַ/יֵּ֣דַע דָּוִ֔יד כִּֽי הֱכִינ֧/וֹ יְהוָ֛ה לְ/מֶ֖לֶךְ עַל יִשְׂרָאֵ֑ל כִּֽי נִשֵּׂ֤את לְ/מַ֨עְלָ/ה֙ מַלְכוּת֔/וֹ בַּ/עֲב֖וּר עַמּ֥/וֹ יִשְׂרָאֵֽל־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/014/002.yaml
  text: And David knew that Yahweh had established him as king over Israel[b][a], for his kingdom had been greatly exalted for the sake of his people Israel.
translation:
  language: tl
  text: At nalaman ni David na itinatag siya ni Yahweh bilang hari ng Israel, sapagkat ang kanyang paghahari[a] ay lubos na itinaas alang-alang sa kanyang bayang Israel[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin ang “kanyang paghahari” bilang “kanyang kaharian” o “kanyang pagkahari”; mas literal, “ang kanyang paghahari ay itinaas sa kaitaasan.”
    reason: lexical_alternative
  - marker: b
    text: Maaaring tumukoy ang “kanyang” kay Yahweh—samakatuwid, ang Israel bilang bayan ni Yahweh—o kay David bilang haring namamahala sa Israel.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּדַע
  choice: nalaman
  rationale: Ang Qal wayyiqtol ng ידע ay maaaring mangahulugang “nalaman” o “nakilala.” Ang “nalaman” ay tuwiran at angkop sa daloy ng salaysay.
- source_word: הֱכִינוֹ
  choice: itinatag siya
  rationale: Ang Hiphil ng כון ay nagpapahayag ng pagpapatatag o pagkumpirma. Sa konteksto ng paghahari, likas sa Filipino ang “itinatag siya … bilang hari.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: לְמֶלֶךְ עַל יִשְׂרָאֵל
  choice: bilang hari sa Israel
  rationale: Ipinahihiwatig ng לְמֶלֶךְ ang pagkakahirang sa katungkulan, at natural na ipinapahayag sa Filipino bilang “bilang hari”; ang “sa Israel” ay malinaw na nagsasaad ng saklaw ng paghahari.
- source_word: נִשֵּׂאת לְמַעְלָה
  choice: itinaas nang lubos
  rationale: Pinagsasama nito ang pasibong diwa ng נשׂא at ang pagpapalakas na hatid ng לְמַעְלָה, habang nananatiling natural sa makabagong Filipino.
- source_word: מַלְכוּתוֹ
  choice: ang kanyang paghahari
  rationale: Maaaring tumukoy ang מַלְכוּת sa kaharian, pagkahari, o pamamahalang maharlika. Mas malinaw dito ang “paghahari” bilang katayuan at pamamahala ni David, ngunit itinatala sa talababa ang ibang posibleng salin.
- source_word: בַּעֲבוּר
  choice: alang-alang sa
  rationale: 'Ipinapahayag nito ang layunin o kapakinabangan: ang pagtaas sa paghahari ni David ay para sa ikabubuti ng Israel.'
- source_word: עַמּוֹ יִשְׂרָאֵל
  choice: kanyang bayang Israel
  rationale: Likas sa Filipino ang “kanyang bayang Israel.” Sadyang pinananatili ng panghalip na “kanyang” ang posibleng pagtukoy kay Yahweh o kay David.
theological_decisions:
- issue: Ang tinutukoy ng panghalip sa עַמּוֹ (“kanyang bayan”)
  choice: Pinanatiling hindi tahasang tinutukoy sa pangunahing teksto sa pamamagitan ng “kanyang bayang Israel,” na maaaring unawaing bayan ni Yahweh.
  alternative: Maaaring tumukoy ang “kanyang” kay David at mangahulugang ang Israel ay bayang nasasakupan niya.
  rationale: Hindi tahasang nilulutas ng anyong Hebreo ang pinatutungkulan ng panghalip. Bagaman malakas ang kontekstuwal na pagbasa na si Yahweh ang tinutukoy, nararapat panatilihin ang tunay na kalabuan at banggitin ang alternatibo sa talababa.
- issue: Gamit ng ikalawang כִּי
  choice: sapagkat
  alternative: na / anupat
  rationale: Pinakamalamang na nagbibigay ang ikalawang sugnay ng dahilan o batayan kung bakit nalaman ni David na itinatag siya ni Yahweh. Gayunman, maaari rin itong basahing paliwanag o nilalaman ng kanyang pagkaalam.
- issue: Diwa ng מַלְכוּתוֹ
  choice: kanyang paghahari
  alternative: kanyang kaharian / kanyang pagkahari
  rationale: Ang salita ay maaaring tumukoy sa nasasakupang kaharian o sa mismong paghahari. Ang “paghahari” ay angkop sa konteksto ng pagtaas sa maharlikang katayuan nang hindi nagdaragdag ng denominasyonal na pagpapakahulugan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Yahweh” para sa banal na pangalan at pinanatili sa panghalip na “kanyang” ang kalabuan ng tekstong Hebreo. Ang “itinaas nang lubos” ay natural na katumbas ng idyomatikong Hebreo habang inilalagay sa talababa ang mas literal na anyo.
