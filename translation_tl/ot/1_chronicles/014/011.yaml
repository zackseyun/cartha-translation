  text: וַ/יַּעֲל֥וּ בְּ/בַֽעַל פְּרָצִים֮ וַ/יַּכֵּ֣/ם שָׁ֣ם דָּוִיד֒ וַ/יֹּ֣אמֶר דָּוִ֔יד פָּרַ֨ץ הָֽ/אֱלֹהִ֧ים אֶת אוֹיְבַ֛/י בְּ/יָדִ֖/י כְּ/פֶ֣רֶץ מָ֑יִם עַל כֵּ֗ן קָֽרְא֛וּ שֵֽׁם הַ/מָּק֥וֹם הַ/ה֖וּא בַּ֥עַל פְּרָצִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/014/011.yaml
  text: So they went up to Baal-perazim[a], and David struck them down there. And David said, “God has broken through my enemies by my hand, like a bursting flood of waters.” Therefore they called the name of that place Baal-perazim.
translation:
  language: tl
  text: Kaya pumunta sila sa Baal-perazim[a], at tinalo sila roon ni David. Sinabi ni David, “Binasag ng Diyos ang hanay ng aking mga kaaway sa pamamagitan ng aking kamay, gaya ng tubig na rumaragasa sa isang nabutas na harang.” Kaya tinawag nilang Baal-perazim ang lugar na iyon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Baal-perazim ay maaaring mangahulugang “panginoon ng mga pagbasag” o “lugar ng mga paglagpas.” Kaugnay ang pangalang ito sa sinabi ni David na binasag ng Diyos ang hanay ng kanyang mga kaaway.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: umahon sila
  rationale: Pinananatili ang direksiyonal na diwa ng עלה sa pagkilos ng hukbo nang hindi dinaragdagan ang taktikang hindi tahasang sinabi.
- source_word: בְּבַעַל פְּרָצִים / בַּעַל פְּרָצִים
  choice: Baal-perazim
  rationale: Pangalan ito ng lugar, kaya tinumbasan sa transliterasyon; ipinaliliwanag sa talababa ang kaugnayan nito sa salitang-ugat פרץ.
- source_word: וַיַּכֵּם
  choice: sila nilupig ni David
  rationale: Sa konteksto ng labanan, ang נכה ay tumutukoy sa pananakit o paggapi. Ang “nilupig” ay malinaw at likas sa makabagong Filipino nang hindi tahasang ipinapalagay na pinatay silang lahat.
- source_word: פָּרַץ
  choice: nilusob
  rationale: Ipinahahayag ang marahas na paglagpas o pagbulusok laban sa kaaway. Ang mas literal na larawang “bumubutas” ay pinananatili sa kasunod na paghahambing at sa talababa upang maipakita ang paglalaro sa salitang פרץ.
- source_word: הָאֱלֹהִים
  choice: ang Diyos
  rationale: Ang pandiwang nasa isahan ay nagpapakitang iisang banal na persona ang tinutukoy; likas sa Filipino ang “ang Diyos.”
- source_word: אֶת אֹיְבַי
  choice: ang aking mga kaaway
  rationale: Tuwirang salin na malinaw at karaniwan sa Filipino.
- source_word: בְּיָדִי
  choice: sa pamamagitan ng aking kamay
  rationale: Pinananatili ang imahen ng kamay at ang diwa ng pagiging kasangkapan ni David sa pagkilos ng Diyos.
- source_word: כְּפֶרֶץ מָיִם
  choice: gaya ng rumaragasang tubig na bumubutas sa isang harang
  rationale: Inilalarawan ang tubig na marahas na lumalagpas sa isang siwang o harang, habang inuulit ang diwa ng פרץ sa paraang malinaw sa Filipino.
- source_word: עַל כֵּן
  choice: Kaya
  rationale: Likas at malinaw na pang-ugnay na nagpapahayag ng dahilan at bunga sa makabagong salaysay.
- source_word: קָרְאוּ שֵׁם הַמָּקוֹם הַהוּא
  choice: tinawag nilang … ang lugar na iyon
  rationale: Pinananatili ang pandiwang maramihan ng Hebreo at isinasalin ang pormula ng pagpapangalan sa natural na ayos ng Filipino.
theological_decisions:
- issue: Ang tinutukoy ng אֱלֹהִים sa pahayag ni David
  choice: Ang Diyos ang iisang banal na gumagawa, at si David ang taong ginamit niya
  alternative: Isalin ang בְּיָדִי bilang “sa pamamagitan ko” at alisin ang imahen ng kamay
  rationale: Ang pandiwang isahan na פָּרַץ ay tumutukoy sa Diyos bilang simuno, samantalang ang “sa pamamagitan ng aking kamay” ay nagpapanatili sa sabayang banal na pagkilos at pagkakasangkapan kay David.
translation_notes:
  register: Makabago at marangal na Filipino, na may payak na daloy ng salaysay. Pinanatili ang pangalan ng lugar at ang imahen ng kamay; nilinaw sa talababa ang paglalaro sa salitang Hebreo na פרץ.
