base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/014/008.yaml
  text: When the Philistines heard that David had been anointed king over all Israel[a], all the Philistines went up to seek David. And David heard, and went out before them.
translation:
  language: tl
  text: Nang mabalitaan ng mga Filisteo na pinahiran si David bilang hari ng buong Israel, umakyat ang lahat ng Filisteo upang hanapin si David. Nang mabalitaan ito ni David, lumabas siya sa harap nila.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “lumabas siya upang harapin sila” o “lumabas siya laban sa kanila.” Literal sa Hebreo ang “lumabas siya sa harap nila,” na maaaring magpahiwatig ng pakikipagsagupa nang hindi ito tahasang sinasabi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמְעוּ
  choice: mabalitaan
  rationale: Sa salaysay, ang שׁמע ay tumutukoy sa pagkatanggap ng balita; mas natural sa modernong Tagalog ang “mabalitaan” kaysa literal na “marinig” sa kontekstong ito.
- source_word: פְלִשְׁתִּים
  choice: mga Filisteo
  rationale: Karaniwang katawagan sa Tagalog para sa pangkat na ito.
- source_word: נִמְשַׁח דָּוִיד לְמֶלֶךְ
  choice: pinahiran si David bilang hari
  rationale: Pinananatili ng “pinahiran” ang konkretong kilos at maharlikang pagtatalaga ng Niphal נמשׁח, habang malinaw na ipinapahayag ng “bilang hari” ang katungkulang tinutukoy ng לְמֶלֶךְ.
- source_word: עַל כָּל יִשְׂרָאֵל
  choice: sa buong Israel
  rationale: Natural na Tagalog para sa saklaw ng paghahari ni David; ipinahihiwatig ng parirala na siya ang hari ng lahat ng Israel.
- source_word: וַיַּעֲלוּ כָל פְּלִשְׁתִּים
  choice: umahon silang lahat
  rationale: Pinananatili ang pandiwang עלה na “umahon” at ang kolektibong diin ng כָל, nang hindi dinaragdagan ng tahasang salitang militar.
- source_word: לְבַקֵּשׁ אֶת דָּוִיד
  choice: upang hanapin si David
  rationale: Ang “hanapin” ay tuwirang katumbas ng בקשׁ at hindi tahasang nagtatakda kung ang layunin ay dakpin o patayin siya.
- source_word: וַיִּשְׁמַע דָּוִיד
  choice: Nabalitaan iyon ni David
  rationale: Pinananatili ang pag-uulit ng ugat na שׁמע habang natural na tinutukoy ng “iyon” ang pagkilos ng mga Filisteo.
- source_word: וַיֵּצֵא לִפְנֵיהֶם
  choice: lumabas siya upang harapin sila
  rationale: Ang לִפְנֵיהֶם ay literal na “sa harap nila.” Sa kontekstong militar, natural ang “upang harapin sila,” ngunit nilalagyan ng talababa upang mapanatili ang bahagyang kalabuan ng Hebreo.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “mabalitaan” para sa likas na daloy ng salaysay at “pinahiran” upang mapanatili ang mahalagang larawan ng orihinal. Inilagay ang talababa sa huling parirala upang hindi maitago ang kalabuan ng Hebreo.
