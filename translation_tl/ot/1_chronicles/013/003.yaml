base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/013/003.yaml
  text: And let us bring the ark of our God back to us[a], for we did not seek it in the days of Shaul.
translation:
  language: tl
  text: At ibalik natin sa ating piling ang kaban ng ating Diyos, sapagkat hindi natin ito hinanap[a] noong mga araw ni Shaul.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “hindi natin ito sinangguni” o “hindi natin siya hinanap.” Ang pandiwang Hebreo ay maaaring mangahulugang “hanapin” o “sanggunian.” Ang “ito” ay malamang tumutukoy sa kaban, ngunit maaaring maunawaan sa diwa ang paghahanap sa Diyos sa kaugnayan ng kaban.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָסֵבָּה
  choice: At ibalik natin
  rationale: Ang cohortative na unang panauhang maramihan ng סבב, kasama ng kaban bilang layon at ng pariralang אֵלֵינוּ, ay natural na nagpapahayag ng sama-samang mungkahing ibalik ang kaban.
- source_word: אֶת אֲרוֹן אֱלֹהֵינוּ
  choice: ang kaban ng ating Diyos
  rationale: Tuwirang pinananatili ang construct chain at ang panlaping unang panauhang maramihan; ang “kaban” ang karaniwang marangal na tawag sa sagradong bagay na ito.
- source_word: אֵלֵינוּ
  choice: sa atin
  rationale: Ipinapahayag nito ang direksiyon pabalik sa pamayanan ng mga nagsasalita. Bagaman inuulit ang “atin,” malinaw at malapit ito sa anyo ng Hebreo.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala nito ang dahilan ng mungkahi sa isang natural ngunit marangal na paraang Filipino.
- source_word: לֹא דְרַשְׁנֻהוּ
  choice: hindi natin ito hinanap
  rationale: Maaaring mangahulugan ang דרש ng paghahanap o pagsangguni. Ang hulaping panghalip ay pinakanatural na tumutukoy sa naunang “kaban”; pinananatili ng “ito” ang kongkretong sanggunian nang hindi ipinapasok sa teksto ang interpretasyong ang Diyos mismo ang tuwirang layon.
- source_word: בִּימֵי שָׁאוּל
  choice: noong mga araw ni Shaul
  rationale: Pinananatili ang Hebreong idyomang “sa mga araw ni” at inililipat ang pangalang שָׁאוּל nang tuwiran bilang “Shaul.”
theological_decisions:
- issue: Ang layon ng “hindi natin hinanap”
  choice: “ito,” na tumutukoy sa kaban
  alternative: “siya,” na tumutukoy sa Diyos; o “hindi tayo sumangguni sa pamamagitan nito”
  rationale: Ang panlalaking isahang hulapi sa Hebreo ay tumutugma sa gramatikal na kasarian ng אֲרוֹן (“kaban”) at pinakanatural na bumabalik dito. Hindi dapat tahimik na gawing Diyos ang tuwirang layon, kahit maaaring ipinahihiwatig ng pangungusap ang pagpapabaya ng Israel sa paghahanap sa Diyos kaugnay ng kaban.
translation_notes:
  register: Makabago at malinaw na Filipino na may marangal na himig. Pinanatili ang bahagyang pormal na “noong mga araw ni” at ang tunay na kalabuan ng pandiwang Hebreo sa pamamagitan ng talababa.
