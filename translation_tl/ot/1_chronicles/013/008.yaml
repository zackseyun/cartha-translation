  text: וְ/דָוִ֣יד וְ/כָל יִשְׂרָאֵ֗ל מְשַׂחֲקִ֛ים לִ/פְנֵ֥י הָ/אֱלֹהִ֖ים בְּ/כָל עֹ֑ז וּ/בְ/שִׁירִ֤ים וּ/בְ/כִנֹּרוֹת֙ וּ/בִ/נְבָלִ֣ים וּ/בְ/תֻפִּ֔ים וּ/בִ/מְצִלְתַּ֖יִם וּ/בַ/חֲצֹצְרֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/013/008.yaml
  text: And David and all Israel were celebrating before God with all their might[a], with songs, lyres, harps, tambourines, cymbals, and trumpets.
translation:
  language: tl
  text: At si David at ang buong Israel ay masayang nagdiriwang sa harap ng Diyos nang buong lakas[a], na may mga awit, lira, alpa, tamburin, pompiyang, at trumpeta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “naglalaro” o “nagsasaya”; ang pandiwang Hebreo ay maaaring tumukoy sa masigla at maligayang gawain.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְשַׂחֲקִים
  choice: masayang nagdiriwang
  rationale: Ang participle mula sa שׂחק ay maaaring tumukoy sa masaya, mapaglaro, o maligayang gawa. Sa konteksto ng prusisyong may musika, malinaw at natural na ipinahahayag ng “masayang nagdiriwang” ang pampublikong kasiyahan nang hindi nililimitahan ang kilos sa pagtugtog lamang.
- source_word: לִפְנֵי הָאֱלֹהִים
  choice: sa harap ng Diyos
  rationale: Tuwirang pinananatili nito ang larawan ng pagkilos sa presensiya ng Diyos at ang kontekstong pagsamba.
- source_word: בְּכָל עֹז
  choice: nang buong lakas
  rationale: Ang עֹז ay lakas o kapangyarihan. Ang “nang buong lakas” ay natural sa Filipino at naghahayag ng matinding sigla ng pagdiriwang.
- source_word: שִׁירִים
  choice: mga awit
  rationale: Pinananatili ang anyong pangngalan at maramihan ng salitang Hebreo.
- source_word: כִנֹּרוֹת
  choice: lira
  rationale: Ang כִּנּוֹר ay karaniwang kinikilalang instrumentong de-kuwerdas na uri ng lyre; “lira” ang mas tiyak na modernong katawagan kaysa “alpa.”
- source_word: נְבָלִים
  choice: alpa
  rationale: Isa itong instrumentong de-kuwerdas na naiiba sa כִּנּוֹר. Bagaman hindi tiyak ang eksaktong anyo nito, “alpa” ay pamilyar at pinananatili ang pagkakaiba sa lira.
- source_word: תֻפִּים
  choice: tamburin
  rationale: Ang תֹּף ay frame drum o instrumentong kahawig ng tamburin; “tamburin” ang madaling maunawaang modernong katumbas.
- source_word: מְצִלְתַּיִם
  choice: pompiyang
  rationale: Ang “pompiyang” ay karaniwan at madaling maunawaang katawagang Filipino para sa cymbals.
- source_word: חֲצֹצְרוֹת
  choice: trumpeta
  rationale: Tuwirang katumbas ng mga trumpetang panseremonya; hindi idinagdag ang “pilak” sapagkat wala iyon sa talata.
- source_word: וְדָוִיד וְכָל יִשְׂרָאֵל
  choice: At si David at ang buong Israel
  rationale: Pinananatili ang panimulang pangatnig para sa daloy ng salaysay at ang kolektibong saklaw ng “buong Israel.”
theological_decisions:
- issue: Paglilipat ng הָאֱלֹהִים
  choice: Diyos
  alternative: ang Diyos
  rationale: Bagaman may pantukoy sa Hebreo, karaniwang katawagan ito rito sa Diyos ng Israel. Natural sa Filipino ang “sa harap ng Diyos,” at hindi nito binabago ang tinutukoy.
- issue: Lawak ng מְשַׂחֲקִים sa konteksto ng pagsamba
  choice: masayang nagdiriwang
  alternative: naglalaro / nagsasaya
  rationale: Pinananatili ng pangunahing salin ang maligaya at pampublikong katangian ng kilos, habang inilalagay sa talababa ang tunay na saklaw ng pandiwang Hebreo upang hindi sapilitang paliitin ang kahulugan nito.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang mga pamilyar na pangalan ng instrumento habang pinanatili ang pagkakaiba ng dalawang instrumentong de-kuwerdas. Ang “nang buong lakas” ay mas likas kaysa sa literal ngunit matigas na “sa buong lakas.”
