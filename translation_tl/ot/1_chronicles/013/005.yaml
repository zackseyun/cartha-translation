id: 1CH.13.5
reference: 1 Chronicles 13:5
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יַּקְהֵ֤ל דָּוִיד֙ אֶת כָּל יִשְׂרָאֵ֔ל מִן שִׁיח֥וֹר מִצְרַ֖יִם וְ/עַד לְב֣וֹא חֲמָ֑ת לְ/הָבִיא֙ אֶת אֲר֣וֹן הָ/אֱלֹהִ֔ים מִ/קִּרְיַ֖ת יְעָרִֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/013/005.yaml
  text: So David assembled all Israel[a], from the Shihor of Egypt to Lebo-hamath[b], to bring the ark of God from Kiriath-jearim.
translation:
  language: tl
  text: Kaya tinipon ni David ang buong Israel, mula sa Sihor ng Ehipto[a] hanggang sa Lebo-hamat[b], upang dalhin ang kaban ng Diyos mula sa Kiriat-jearim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “Sihor ng Ehipto” ay katawagan sa hangganan sa timog; inuunawa ito ng ilan bilang “batis ng Ehipto.”
    reason: cultural_note
  - marker: b
    text: O, sa mas literal na salin, “hanggang sa pasukan ng Hamat.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְהֵל
  choice: tinipon
  rationale: Ang causative na anyo ng קהל ay nagsasaad na pinagsama ni David ang bayan para sa isang pambansang pagtitipon. Natural at malinaw sa modernong Tagalog ang “tinipon.”
- source_word: כָּל יִשְׂרָאֵל
  choice: ang buong Israel
  rationale: Pinananatili nito ang kolektibong katawagan sa bansa; hindi nito kinakailangang ipahiwatig na naroon ang bawat indibidwal.
- source_word: מִן שִׁיחוֹר מִצְרַיִם
  choice: mula sa Sihor ng Ehipto
  rationale: Pinananatili ang Sihor bilang pangalang heograpiko at hindi agad ipinapakahulugan bilang isang tiyak na batis o ilog.
- source_word: וְעַד לְבוֹא חֲמָת
  choice: hanggang sa Lebo-hamat
  rationale: Itinuturing ang parirala bilang kinikilalang katawagan sa lugar o hangganan. Inilalagay sa talababa ang mas literal na pagbasa.
- source_word: לְהָבִיא
  choice: upang dalhin
  rationale: Malinaw na ipinahahayag ng “upang” ang layunin ng pagtitipon, habang ang “dalhin” ay katumbas ng payak na diwa ng pandiwang Hebreo.
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: ang kaban ng Diyos
  rationale: Karaniwan, maikli, at tumpak na salin ng pariralang construct nang walang idinagdag na interpretasyong teolohikal.
- source_word: מִקִּרְיַת יְעָרִים
  choice: mula sa Kiriat-jearim
  rationale: Pinananatili ang pangalang Hebreo sa anyong madaling basahin sa Tagalog.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na may marangal ngunit payak na himig. Pinanatili ang mga pangalang heograpiko at ang kolektibong ekspresyong “buong Israel.” Inilagay ang mga pananda ng talababa sa mismong pariralang kanilang ipinapaliwanag.
