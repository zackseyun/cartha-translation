base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/013/009.yaml
  text: When they came to the threshing floor of Kidon[a], Uzza reached out his hand to take hold of the ark, because the oxen stumbled.
translation:
  language: tl
  text: Nang makarating sila sa giikan ng Kidon, iniunat ni Uza ang kaniyang kamay upang hawakan ang kaban, sapagkat natisod[a] ang mga baka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “nadulas.” Maaari ring magpahiwatig ang pandiwang Hebreo ng pagbitiw o pagpapahulog; dito ay inilalarawan nito ang pagkadulas o pagkatisod ng mga baka, na naglagay sa kaban sa panganib.
    reason: lexical_alternative
lexical_decisions:
- source_word: גֹּרֶן כִּידֹן
  choice: giikan ni Kidon
  rationale: Ang גֹּרֶן ay giikan, at ang כִּידֹן ay pangalang pantangi na isinaling-titik bilang Kidon. Pinananatili ng “ni Kidon” ang ugnayang ipinahihiwatig ng anyong konstrakto nang hindi dinaragdagan ang teksto.
- source_word: וַיִּשְׁלַח ... אֶת יָדוֹ
  choice: iniunat ... ang kamay niya
  rationale: Likas na katumbas ito sa modernong Tagalog ng idyomang tumutukoy sa pag-abot o pag-uunat ng kamay.
- source_word: לֶאֱחֹז
  choice: upang hawakan
  rationale: Ang אָחַז ay nangangahulugang humawak o kumapit. Ang “hawakan” ay angkop sa kilos na pagpapatatag sa kaban at hindi nagpapahiwatig ng marahas na pagsunggab.
- source_word: הָאָרוֹן
  choice: ang kaban
  rationale: “Ang kaban” lamang ang nasa Hebreo sa talatang ito; hindi idinagdag ang “ng Diyos” mula sa mas malawak na konteksto.
- source_word: כִּי
  choice: sapagkat
  rationale: Malinaw na ipinakikilala nito ang dahilan kung bakit iniunat ni Uza ang kaniyang kamay.
- source_word: שָׁמְטוּ
  choice: natisod
  rationale: Maaaring tumukoy ang pandiwa sa pagdulas o sa pagbitiw/pagkahulog. Dahil ang mga baka ang simuno, likas sa konteksto ang “natisod,” habang inilalahad sa talababa ang tunay na leksikal na alternatibo.
- source_word: הַבָּקָר
  choice: ang mga baka
  rationale: Bagaman maaaring tumukoy ang בָּקָר sa mga βοοειδή sa pangkalahatan, dito ay tumutukoy ito sa mga hayop na humihila sa karwahe. “Mga baka” ang malinaw at karaniwang katawagan sa Tagalog.
