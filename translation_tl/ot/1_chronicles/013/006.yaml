  text: וַ/יַּ֨עַל דָּוִ֤יד וְ/כָל יִשְׂרָאֵל֙ בַּעֲלָ֔תָ/ה אֶל קִרְיַ֥ת יְעָרִ֖ים אֲשֶׁ֣ר לִ/יהוּדָ֑ה לְ/הַעֲל֣וֹת מִ/שָּׁ֗ם אֵת֩ אֲר֨וֹן הָ/אֱלֹהִ֧ים יְהוָ֛ה יוֹשֵׁ֥ב הַ/כְּרוּבִ֖ים אֲשֶׁר נִקְרָ֥א שֵֽׁם־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/013/006.yaml
  text: So David and all Israel went up to Baalah[a], that is, to Kiriath-jearim, which belongs to Judah, to bring up from there the ark of God, Yahweh who is enthroned above the cherubim, whose name is called upon it.
translation:
  language: tl
  text: At umakyat si David at ang buong Israel patungong Baala, samakatuwid ay Kiriat-jearim, na sakop ng Juda, upang iakyat mula roon ang kaban ng Diyos, si Yahweh na nakaluklok sa ibabaw ng mga kerubin, na ang pangalan niya ay itinatawag sa kaban.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O, sa mas idyomatikong paraan: “ang kaban ng Diyos, si Yahweh na nakaluklok sa ibabaw ng mga kerubin—ang kaban na tinatawag sa pangalan niya.” Ihambing ang 2 Samuel 6:2.'
    reason: Pinananatili ang alternatibong pagbasa sa mahirap at elliptical na pangwakas na sugnay.
lexical_decisions:
- source_word: וַיַּעַל
  choice: umakyat
  rationale: Pinananatili nito ang direksiyonal na diwa ng עלה at natural ito sa salaysay ng paglalakbay.
- source_word: בַּעֲלָתָה
  choice: Baala
  rationale: Pangalan ito ng lugar; ginamit ang anyong angkop sa modernong baybay-Tagalog.
- source_word: אֶל קִרְיַת יְעָרִים
  choice: samakatuwid ay Kiriat-jearim
  rationale: Ipinakikita ng parirala na ang Baala ay siya ring Kiriat-jearim.
- source_word: אֲשֶׁר לִיהוּדָה
  choice: na sakop ng Juda
  rationale: Malinaw at likas na ipinahahayag nito ang kaugnayan ng lugar sa teritoryo ng Juda.
- source_word: לְהַעֲלוֹת מִשָּׁם
  choice: upang iahon mula roon
  rationale: Pinananatili ang ugnayang pandiwa sa naunang עלה at ipinahahayag ang pagdadala paakyat ng kaban.
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: ang kaban ng Diyos
  rationale: Tuwirang salin ng pariralang construct at karaniwang katawagan sa Kasulatan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tinutumbasan ang personal na pangalang banal sa Hebreo sa halip na palitan ito ng isang titulo.
- source_word: יוֹשֵׁב הַכְּרוּבִים
  choice: na nakaluklok sa ibabaw ng mga kerubin
  rationale: Ipinahahayag ang maharlikang larawan ng Diyos na nakaluklok kaugnay ng mga kerubin nang hindi ipinapasok ang mas tiyak na 'sa pagitan,' na wala sa Hebreo.
- source_word: אֲשֶׁר נִקְרָא שֵׁם
  choice: na ang pangalan niya ay itinatawag dito
  rationale: Pinananatili ang siksik at di-ganap na tiyak na pasibong pahayag ng Hebreo; inilalahad sa talababa ang mas idyomatikong posibilidad.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Personal na pangalan ang nasa tekstong Hebreo, kaya pinanatili ito bilang pangalan at hindi pinalitan ng titulo.
- issue: Kahulugan at tinutukoy ng pangwakas na sugnay אֲשֶׁר נִקְרָא שֵׁם
  choice: na ang pangalan niya ay itinatawag dito
  alternative: ang kaban na tinatawag sa Pangalan
  rationale: Elliptical at hindi ganap na malinaw ang Hebreo. Pinananatili ng pangunahing teksto ang anyong pasibo at ang kaugnayan ng pangalan sa kaban, habang inilalagay sa talababa ang isang mas idyomatikong pagbasa.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “umakyat/iahon” upang mapanatili ang pag-uulit ng Hebreong ugat, at “kerubin” bilang karaniwang anyong biblikal sa Filipino.
