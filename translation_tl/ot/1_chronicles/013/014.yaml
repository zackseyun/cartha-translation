  verdict: revise
  source_fidelity: Tumpak na naisasalin ang pagkakapanatili ng kaban, ang pagkakaiba ng sambahayan at pisikal na bahay, at ang pagpapala ni Yahweh. Gayunman, ang “lahat ng pag-aari niya” ay mas makitid kaysa sa כָּל אֲשֶׁר לוֹ (“lahat ng mayroon siya”), na maaaring sumaklaw hindi lamang sa mga ari-arian. Ang “nang tatlong buwan” ay posible ngunit hindi gaanong malinaw para sa tagal ng pananatili.
  naturalness: Marangal at natural sa modernong Tagalog ang pangunahing ayos. Mas malinaw at idiomatiko sa kontekstong ito ang “sa loob ng tatlong buwan.”
  terminology: Ang “kaban ng Diyos,” “sambahayan,” at “Yahweh” ay angkop at tugma sa Hebreo at sa proyekto. Ang anyong pangalang “Obed-Edom” ay pinananatili nang pare-pareho.
