base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/013/014.yaml
  text: And the ark of God remained with the household of Obed-edom[a], in his house, for three months. And Yahweh blessed the household of Obed-edom and all that belonged to him.
translation:
  language: tl
  text: Nanatili ang kaban ng Diyos sa sambahayan ni Obed-Edom[a], sa bahay niya, sa loob ng tatlong buwan. Pinagpala ni Yahweh ang sambahayan ni Obed-Edom at ang lahat ng mayroon siya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “bahay ni Obed-Edom” sa dalawang paglitaw; ang salitang Hebreo na בֵּית ay maaaring mangahulugang pisikal na bahay o sambahayan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: Nanatili
  rationale: Ipinahahayag ang patuloy ngunit pansamantalang pagkakalagay ng kaban; natural ito sa modernong Tagalog at hindi nagpapahiwatig ng permanenteng paninirahan.
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: ang kaban ng Diyos
  rationale: Tuwirang pinananatili ang eksaktong katawagang Hebreo; wala rito ang mas mahabang katawagang 'kaban ng tipan ng Diyos.'
- source_word: עִם בֵּית עֹבֵד אֱדֹם
  choice: sa sambahayan ni Obed-Edom
  rationale: Maaaring tumukoy ang בֵּית sa bahay o sambahayan. Dito, ang 'sambahayan' ay malinaw na naiiba sa kasunod na pisikal na lokasyong 'sa bahay niya.'
- source_word: בְּבֵיתוֹ
  choice: sa bahay niya
  rationale: Tumutukoy ito sa mismong gusali o tirahan at pinananatili ang pagkakaiba sa sambahayan.
- source_word: שְׁלֹשָׁה חֳדָשִׁים
  choice: nang tatlong buwan
  rationale: Natural na pagpapahayag sa Tagalog ng haba ng panahong nanatili roon ang kaban.
- source_word: וַיְבָרֶךְ יְהוָה
  choice: Pinagpala ni Yahweh
  rationale: Malinaw na si Yahweh ang gumagawa ng pagpapala; natural na aktibong ayos ito sa Tagalog.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili bilang pantanging pangalan ang Tetragrammaton sa halip na palitan ng titulong 'Panginoon.'
- source_word: אֶת בֵּית עֹבֵד אֱדֹם
  choice: ang sambahayan ni Obed-Edom
  rationale: Ang sambahayan, hindi lamang ang gusali, ang pinagpala; saklaw nito ang mga taong kaugnay sa kaniya.
- source_word: וְאֶת כָּל אֲשֶׁר לוֹ
  choice: at ang lahat ng pag-aari niya
  rationale: Natural na sinasaklaw nito ang lahat ng sa kaniya, lalo na ang kaniyang mga ari-arian, nang hindi nililimitahan sa isang partikular na uri ng pag-aari.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Pantanging pangalan ang nasa tekstong Hebreo. Pinananatili ng 'Yahweh' ang pangalan at iniiwasang palitan ito ng isang titulo.
- issue: Saklaw ng pagpapala sa בֵּית עֹבֵד אֱדֹם
  choice: sambahayan ni Obed-Edom
  alternative: bahay ni Obed-Edom
  rationale: Hindi tahasang nilulutas ng salin ang paraan ng pagpapala, ngunit ipinahihiwatig ng kasunod na 'lahat ng pag-aari niya' na higit sa gusali ang saklaw nito.
translation_notes:
  register: Modernong Filipino Tagalog na simple at marangal. Ginamit ang 'sambahayan' upang maiba sa pisikal na 'bahay,' habang ang talababa ay nagpapanatili sa tunay na leksikal na kalabuan ng Hebreo.
