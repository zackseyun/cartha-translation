base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/013/007.yaml
  text: So they set the ark of God on a new cart from the house of Abinadab[a], and Uzza and Ahio were guiding the cart.
translation:
  language: tl
  text: At isinakay nila ang kaban ng Diyos sa isang bagong kariton mula sa bahay ni Abinadab, at sina Uza at Ahio ang nagpapatakbo ng kariton.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “umaakay sa kariton.” Ang participle sa Hebreo ay maaaring tumukoy sa pagmamaneho ng sasakyan o pag-akay sa hayop na humihila rito.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְכִּיבוּ
  choice: isinakay
  rationale: Ang causative na anyo ng רכב ay nagsasaad na ang kaban ay ipinasakay o inilagay upang dalhin sa sasakyan. Likas at kongkreto sa Filipino ang “isinakay” sa kontekstong ito.
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: ang kaban ng Diyos
  rationale: Ang “kaban” ang malinaw at nakaugaliang salin ng אֲרוֹן sa kontekstong panrelihiyon; tuwirang pinananatili ng “ng Diyos” ang ugnayang construct.
- source_word: עַל עֲגָלָה חֲדָשָׁה
  choice: sa isang bagong kariton
  rationale: Tinutukoy ng עֲגָלָה ang kariton o bagon. Mas karaniwan at madaling maunawaan dito ang “kariton,” at hayagang pinananatili ang “bago.”
- source_word: מִבֵּית אֲבִינָדָב
  choice: mula sa bahay ni Abinadab
  rationale: Malinaw na ipinapahayag ng “mula sa” ang pinagmulan, habang natural sa Filipino ang “bahay ni Abinadab.”
- source_word: עֻזָּא
  choice: Uza
  rationale: Isinasalin sa baybay-Filipino ang pangalang Hebreo nang hindi dinaragdagan ang huling tahimik na titik ng anyong Ingles.
- source_word: אַחְיוֹ
  choice: Ahio
  rationale: Tuwirang transliterasyon ng personal na pangalan sa anyong madaling basahin sa Filipino.
- source_word: נֹהֲגִים
  choice: gumagabay
  rationale: Maaaring tumukoy ang participle ng נהג sa pag-akay o pagpapatakbo ng sasakyan. Pinananatili ng “gumagabay” ang mas malawak na diwa nang hindi tiyakang nilulutas kung inaakay nila ang mga hayop o mismong pinatatakbo ang kariton.
- source_word: בָּעֲגָלָה
  choice: sa kariton
  rationale: Sa pagkakagamit kasama ng נהג, tumutukoy ito sa sasakyang ginagabayan o pinatatakbo. Idiomatiko sa Filipino ang “gumagabay sa kariton.”
