revisions:
- from: Kaya isinakay nila ang kaban ng Diyos sa isang bagong kariton mula sa bahay ni Abinadab. Sina Uza at Ahio ang gumagabay sa kariton.[a]
  to: At isinakay nila ang kaban ng Diyos sa isang bagong kariton mula sa bahay ni Abinadab, at sina Uza at Ahio ang nagpapatakbo ng kariton.[a]
  rationale: Pinalitan ang pangatnig na may ipinahihiwatig na sanhi ng payak na “At,” at ginawang “nagpapatakbo ng kariton” ang pangunahing salin ng נֹהֲגִים upang maging mas tuwiran at natural. Iningatan ng talababa ang alternatibong saklaw ng pandiwang Hebreo.
