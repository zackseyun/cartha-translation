  text: וַ/יִּֽחַר אַ֤ף יְהוָה֙ בְּ/עֻזָּ֔א וַ/יַּכֵּ֕/הוּ עַ֛ל אֲשֶׁר שָׁלַ֥ח יָד֖/וֹ עַל הָ/אָר֑וֹן וַ/יָּ֥מָת שָׁ֖ם לִ/פְנֵ֥י אֱלֹהִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/013/010.yaml
  text: Then Yahweh’s anger burned against Uzza[a], and he struck him down because he had put out his hand to the ark; and he died there before God.
translation:
  language: tl
  text: Kaya nag-alab ang galit ni Yahweh laban kay Uza, at sinaktan niya si Uza dahil iniunat ni Uza ang kanyang kamay sa kaban[a]; at namatay siya roon sa harap ng Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “iniabot ni Uza ang kanyang kamay sa kaban.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר אַף יְהוָה
  choice: nag-alab ang galit ni Yahweh
  rationale: Pinananatili nito ang matinding larawang Hebreo ng pag-aalab ng galit, sa likas at marangal na modernong Tagalog.
- source_word: בְּעֻזָּא
  choice: laban kay Uza
  rationale: Ang בְּ ay tumutukoy sa taong pinatutungkulan ng galit; malinaw at natural ang “laban kay Uza.”
- source_word: וַיַּכֵּהוּ
  choice: pinabagsak niya ito
  rationale: Maaaring mangahulugan ang נכה ng paghampas o pagpapabagsak. Dahil kamatayan ang agarang kinalabasan, ipinahahayag ng “pinabagsak” ang bigat ng kilos nang hindi dinaragdagan ang salaysay.
- source_word: עַל אֲשֶׁר
  choice: dahil
  rationale: Tuwirang ipinakikilala ng parirala ang dahilan ng hatol.
- source_word: שָׁלַח יָדוֹ עַל הָאָרוֹן
  choice: iniunat nito ang kamay nito sa kaban
  rationale: Pinananatili ang pisikal na kilos at ang kaugnayan nito sa kaban nang hindi ipinapalagay ang layunin ni Uza.
- source_word: הָאָרוֹן
  choice: ang kaban
  rationale: “Kaban” ang karaniwang salin sa bagay na ito sa kontekstong biblikal; hindi idinagdag ang “ng Diyos,” na wala sa pariralang ito.
- source_word: וַיָּמָת שָׁם
  choice: at namatay ito roon
  rationale: Tuwirang pinananatili ang pagkakasunod ng salaysay at ang pang-abay na שָׁם, “roon.”
- source_word: לִפְנֵי אֱלֹהִים
  choice: sa harap ng Diyos
  rationale: Likas na Tagalog para sa “before God,” at pinananatili ang taimtim na diwa ng presensiya ng Diyos.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Tuwirang ginagamit ng Hebreo ang Tetragrammaton; pinananatili ng “Yahweh” ang natatanging pangalang tipan sa halip na palitan ito ng titulo.
- issue: Pagkakaiba ng יְהוָה at אֱלֹהִים sa iisang talata
  choice: “Yahweh” sa unang sugnay at “Diyos” sa hulihan
  alternative: Pag-isahin ang dalawa bilang “Yahweh” o “PANGINOON”
  rationale: Pinananatili ang sadyang leksikal na pagkakaiba ng tekstong Hebreo at hindi ito pinapakinis o pinag-iisa.
- issue: Dahilan ng hatol kay Uza
  choice: 'Panatilihin lamang ang tahasang dahilan: iniunat niya ang kamay niya sa kaban'
  alternative: Ipaliwanag itong kawalang-galang, pagsuway, o paghawak sa kaban
  rationale: Hindi tahasang tinutukoy sa talata ang motibo o mas malawak na teolohikal na paliwanag; iniiwasang magdagdag ng interpretasyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “ito/nito” para kay Uza upang luminaw ang pagpapalit ng paksa mula kay Yahweh at maiwasan ang kalabuan ng magkakasunod na panghalip na “niya.”
