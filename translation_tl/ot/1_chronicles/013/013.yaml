  source_fidelity: 'Tumpak ang pagsasalin ng pangunahing daloy ng Hebreo: hindi dinala ni David ang Kaban sa kaniyang sariling lungsod, kundi inilihis ito sa bahay ni Obed-edom na Geteo. Ang “Kaya” ay angkop sa kontekstong pagsunod mula sa naunang pangyayari, at ang “Sa halip” ay malinaw na naghahayag ng paglihis ng ruta nang hindi nagdaragdag ng kahulugang doktrinal.'
