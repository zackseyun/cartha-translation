  terminology: Ang “Kaban,” “Lungsod ni David,” “Obed-edom,” at “Geteo” ay pare-pareho at angkop sa rehistro ng salaysay-biblikal. Wasto ring pinananatili ng mga talababa ang saklaw ng mga alternatibong leksikal para sa הֵסִיר at וַיַּטֵּהוּ.
