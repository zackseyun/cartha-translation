source:
  edition: WLC
  text: וְ/לֹֽא הֵסִ֨יר דָּוִ֧יד אֶת הָ/אָר֛וֹן אֵלָ֖י/ו אֶל עִ֣יר דָּוִ֑יד וַ/יַּטֵּ֕/הוּ אֶל בֵּ֥ית עֹבֵֽד אֱדֹ֖ם הַ/גִּתִּֽי־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/013/013.yaml
  text: So David did not bring the ark to himself[a], into the City of David; instead[b], he turned it aside to the house of Obed-edom the Gittite.
translation:
  language: tl
  text: Kaya hindi dinala ni David ang Kaban sa sarili niyang lugar[a], sa Lungsod ni David. Sa halip, inilihis niya ito[b] patungo sa bahay ni Obed-edom na Geteo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “hindi inalis ni David ang Kaban upang dalhin sa kaniya.” Ang pandiwang Hebreo ay maaaring mangahulugang “alisin,” “ilayo,” o, ayon sa konteksto, “dalhin.”
    reason: lexical_alternative
  - marker: b
    text: O “ipinihit niya ito” o “dinala niya ito sa ibang dako.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵסִיר
  choice: hindi dinala
  rationale: Bagaman ang Hiphil ng סוּר ay maaaring mangahulugang “inalis” o “inilayo,” ipinahihiwatig ng konteksto at ng kasunod na patutunguhan na hindi itinuloy ni David ang pagdadala sa Kaban sa sarili niyang lugar.
- source_word: אֵלָיו
  choice: sa sarili niyang lugar
  rationale: Literal itong “sa kaniya,” ngunit si David din ang simuno. Nililinaw ng likas na Tagalog na tumutukoy ito sa lugar ni David, nang hindi inaalis ang kaugnayan nito sa kasunod na “Lungsod ni David.”
- source_word: עִיר דָּוִיד
  choice: Lungsod ni David
  rationale: Ito ang malinaw at kinikilalang anyo ng tiyak na pangalan ng lugar sa modernong Tagalog.
- source_word: וַיַּטֵּהוּ
  choice: inilihis niya ito
  rationale: Ang נָטָה ay may diwang pagpihit o paglihis. Dito, ang Kaban ay inilihis mula sa nilalayong ruta nito patungo sa ibang bahay.
- source_word: בֵּית
  choice: bahay
  rationale: Maaaring tumukoy ang בַּיִת sa bahay o sambahayan, ngunit dahil doon pansamantalang inilagay ang Kaban, ang pisikal na “bahay” ang pinakamalapit na kahulugan.
- source_word: עֹבֵד אֱדֹם
  choice: Obed-edom
  rationale: Direktang transliterasyon ng personal na pangalan, na may gitling upang malinaw ang dalawang bahagi.
- source_word: הַגִּתִּי
  choice: Geteo
  rationale: Karaniwang anyong Tagalog ng katawagang tumutukoy sa isang taga-Gat; pinananatili nito ang maikli at gentilikong anyo ng Hebreo.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Kaban” bilang maikling pagtukoy sa kaban na kilala na sa konteksto, at ang “sa sarili niyang lugar” upang likas na maipahayag ang reflexive na diwa ng אֵלָיו nang hindi paulit-ulit ang “David.”
