  text: וַ/יֹּ֨אמֶר דָּוִ֜יד לְ/כֹ֣ל קְהַ֣ל יִשְׂרָאֵ֗ל אִם עֲלֵי/כֶ֨ם ט֜וֹב וּ/מִן יְהוָ֣ה אֱלֹהֵ֗י/נוּ נִפְרְצָה֙ נִשְׁלְחָ֞ה עַל אַחֵ֣י/נוּ הַ/נִּשְׁאָרִ֗ים בְּ/כֹל֙ אַרְצ֣וֹת יִשְׂרָאֵ֔ל וְ/עִמָּ/הֶ֛ם הַ/כֹּהֲנִ֥ים וְ/הַ/לְוִיִּ֖ם בְּ/עָרֵ֣י מִגְרְשֵׁי/הֶ֑ם וְ/יִקָּבְצ֖וּ אֵלֵֽי/נוּ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/013/002.yaml
  text: And David said to all the assembly of Israel[a], “If it seems good to you, and if it is from Yahweh our God, let us send word to our brothers who remain in all the lands of Israel, and also to the priests and Levites with them in the cities of their pasturelands[d][c][b], that they may gather to us.”
translation:
  language: tl
  text: Sinabi ni David sa buong kapulungan ng Israel, “Kung mabuti ito para sa inyo at kung ito ay mula kay Yahweh na ating Diyos, magpadala tayo nang malawakan ng mensahe sa ating mga kapatid[b] na nananatili sa lahat ng lupain[c] ng Israel, pati na sa mga pari at mga Levita na kasama nila sa kanilang mga lungsod na may nakalaang pastulan[d], upang magtipon sila sa atin.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Ang “mga kapatid” dito ay tumutukoy sa mga kapwa Israelita bilang isang pangkat.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “mga rehiyon ng Israel”; maramihan ang “lupain” sa Hebreo.
    reason: lexical_alternative
  - marker: d
    text: Ibig sabihin, ang mga bukas na lupain o pastulang nakatalaga sa paligid ng kanilang mga lungsod.
    reason: cultural_note
lexical_decisions:
- source_word: קְהַל
  choice: kapulungan
  rationale: Tumutukoy ito sa pambansang pagtitipon ng Israel at hindi nag-aangkat ng mas makitid na kahulugang panrelihiyon.
- source_word: אִם עֲלֵיכֶם טוֹב
  choice: Kung mabuti ito para sa inyo
  rationale: Likas na Filipino para sa idyomang humihingi ng pagsang-ayon o pagsang-ayon ng mga kausap.
- source_word: וּמִן יְהוָה אֱלֹהֵינוּ
  choice: at kung ito ay mula kay Yahweh na ating Diyos
  rationale: Ipinahihiwatig ng Hebreo ang ikalawang kondisyon; pinananatili nitong magkatabi ang pagsang-ayon ng bayan at ang pahintulot ng Diyos.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat ang personal na banal na pangalan sa halip na palitan ito ng isang titulo.
- source_word: נִפְרְצָה נִשְׁלְחָה
  choice: magpadala tayo ng mensahe sa lahat ng dako
  rationale: Ang unang pandiwa ay literal na may diwang paglaganap o pagbulusok palabas at malamang na nagpapalawak sa saklaw ng pagpapadala; ang parirala ay inihayag sa natural na Filipino nang hindi ginagawang hiwalay na kilos.
- source_word: עַל אַחֵינוּ
  choice: sa ating mga kapatid
  rationale: Pinananatili ang larawang pampamilya para sa mga kapwa Israelita; malinaw sa konteksto na sila ang padadalhan.
- source_word: הַנִּשְׁאָרִים
  choice: na nananatili
  rationale: Tuwirang sinasabi kung sino ang naroon pa at iniiwasang ipasok ang posibleng teolohikal na bigat ng ‘nalabi.’
- source_word: בְּכֹל אַרְצוֹת יִשְׂרָאֵל
  choice: sa lahat ng lupain ng Israel
  rationale: Pinananatili ang maramihang anyo ng Hebreong אַרְצוֹת, na maaaring tumukoy sa mga teritoryo o rehiyon.
- source_word: מִגְרְשֵׁיהֶם
  choice: nakalaang pastulan
  rationale: Tumutukoy sa mga bukas na lupaing nakatalaga sa paligid ng mga lungsod, karaniwang ginagamit sa pagpapastol.
- source_word: וְיִקָּבְצוּ אֵלֵינוּ
  choice: upang magtipon sila sa atin
  rationale: Ipinapakita ang layunin ng pagpapadala at pinananatili ang direksiyong patungo kina David at sa kapulungan.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Personal na pangalan ang tahasang nasa tekstong Hebreo; pinananatili ito bilang Yahweh sa halip na palitan ng titulo.
- issue: Ugnayan ng pagsang-ayon ng bayan at pahintulot ng Diyos
  choice: Kung mabuti ito para sa inyo at kung ito ay mula kay Yahweh
  alternative: Kung mabuti ito para sa inyo at mula kay Yahweh
  rationale: Nililinaw lamang ang ipinahihiwatig na ikalawang kondisyon at hindi pinagpapasyahan kung talagang pinahintulutan na ng Diyos ang panukala.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “kapulungan,” “magpadala ng mensahe,” at “magtipon” para maging malinaw sa karaniwang mambabasa habang pinananatili ang pambansang saklaw, direksiyon, at kondisyunal na himig ng Hebreo.
