  text: And David consulted with the commanders of the thousands and the hundreds[a], with every leader.
translation:
  language: tl
  text: Sumangguni si David sa mga pinuno ng mga pangkat na tig-iisang libo at tig-iisang daan, at sa bawat pinuno[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa mga pinuno ng mga libo at mga daan, at sa bawat pinuno.” Ang “mga libo” at “mga daan” ay maaaring tumukoy sa mga yunit o pangkat.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּוָּעַץ
  choice: Sumangguni
  rationale: Ipinahahayag ng anyong Niphal ang pakikipagsanggunian o sama-samang pag-uusap; natural at marangal sa makabagong Filipino ang “sumangguni.”
- source_word: עִם
  choice: sa
  rationale: Sa pandiwang “sumangguni,” ang “sa” ang likas na panandang Filipino para sa mga taong kinonsulta, bagaman literal na “kasama” ang Hebreo.
- source_word: שָׂרֵי
  choice: mga pinuno
  rationale: Ang שָׂרֵי ay tumutukoy sa mga opisyal o kumander. Pinananatili ng “mga pinuno” ang lawak ng kahulugan habang nababagay sa organisasyong militar-administratibo ng talata.
- source_word: הָאֲלָפִים וְהַמֵּאוֹת
  choice: ng mga pangkat na tig-iisang libo at tig-iisang daan
  rationale: Ang mga bilang ay malamang na katawagan sa mga yunit, hindi simpleng bilang ng mga tao. Nililinaw ito ng “mga pangkat” nang hindi tiyak na ginagawang purong militar ang mga yunit.
- source_word: לְכָל נָגִיד
  choice: sa bawat pinuno
  rationale: Pinalalawak ng parirala ang saklaw ng mga sinangguni. Ang “bawat pinuno” ay tuwirang katumbas ng distributibong כָל at ng malawak na katawagang נָגִיד.
