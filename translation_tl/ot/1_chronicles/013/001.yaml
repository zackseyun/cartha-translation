translation_notes:
  register: Makabagong Filipino na malinaw at marangal. Ginamit ang “tig-iisang libo” at “tig-iisang daan” upang madaling maunawaan bilang laki o katawagan ng mga pangkat, habang inilalagay sa talababa ang higit na literal na anyo.
