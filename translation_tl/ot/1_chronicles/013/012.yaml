  yaml_path: translation/ot/1_chronicles/013/012.yaml
  text: And David feared God that day[a], saying, “How can I bring the ark of God to me?”
translation:
  language: tl
  text: Noong araw na iyon, natakot[a] si David sa Diyos at sinabi niya, “Paano ko madadala sa aking piling ang Kaban ng Diyos?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “nangamba sa Diyos.” Ang pandiwang Hebreo ay maaaring magpahiwatig ng takot, sindak, o pagpipitagan ayon sa konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּירָא
  choice: natakot
  rationale: Sa konteksto ng pagkamatay ni Uza bilang hatol ng Diyos, pangunahing ipinahihiwatig ng pandiwa ang tunay na pagkatakot. Hindi nito lubusang inaalis ang diwa ng mapitagang pangamba.
- source_word: אֶת הָאֱלֹהִים
  choice: sa Diyos
  rationale: Ang Diyos ang layon ng pagkatakot ni David; likas sa Tagalog ang hulma na “natakot ... sa Diyos.”
- source_word: בַּיּוֹם הַהוּא
  choice: nang araw na iyon
  rationale: Natural at tuwirang katumbas ng pariralang tumutukoy sa panahong naganap ang tugon ni David.
- source_word: לֵאמֹר
  choice: Sinabi niya
  rationale: Ipinakikilala nito ang tuwirang sinabi ni David. Ang hiwalay na pangungusap ay mas natural sa modernong Tagalog kaysa sa literal na “na sinasabi.”
- source_word: הֵיךְ
  choice: Paano ko madadala
  rationale: Ipinahahayag ng tanong ang suliranin tungkol sa posibilidad o wastong paraan ng pagdadala, nang hindi nilulutas kung alin ang pangunahing diin.
- source_word: אָבִיא
  choice: madadala
  rationale: Ang Hiphil ng בוא ay nangangahulugang “dalhin.” Ang anyong “madadala” ay natural na nagpapahayag ng posibilidad sa tanong.
- source_word: אֵלַי
  choice: sa akin
  rationale: Pinananatili ang literal na direksiyon patungo kay David nang hindi tiyakang ipinapalit ang kaniyang bahay, lungsod, o kinaroroonan.
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: ang Kaban ng Diyos
  rationale: Tuwirang pinananatili ang construct phrase at ang mahalagang katawagan sa salaysay.
theological_decisions:
- issue: Ang uri ng tugon ni David sa paghatol ng Diyos
  choice: natakot
  alternative: nagpitagan; nagkaroon ng mapitagang takot
  rationale: Dahil kasunod ito ng pagkamatay ni Uza, hindi dapat palambutin ang tugon ni David bilang pagpipitagan lamang. Gayunman, ipinakikita ng talababa na ang salitang Hebreo ay maaari ring maglaman ng diwa ng mapitagang pangamba.
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran, marangal, at madaling maunawaan. Ginamit ang “Kaban ng Diyos” bilang pormal at nakikilalang katawagan. Pinanatili ang bahagyang di-tiyak na “sa akin” upang hindi tukuyin kung ang ibig sabihin ay kay David mismo o sa kaniyang kinaroroonan.
