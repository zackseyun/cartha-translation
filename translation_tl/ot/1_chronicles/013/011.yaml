base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/013/011.yaml
  text: And David was angry because Yahweh had broken out against Uzza[a]; so he called that place Perez-uzza to this day.
translation:
  language: tl
  text: Nagalit si David dahil bumugso si Yahweh laban kay Uza. Kaya tinawag niyang Perez-Uza[a] ang lugar na iyon, at gayon pa rin ang tawag dito hanggang sa araw na ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Perez-Uza ay maaaring mangahulugang “pagbugso laban kay Uza” o “pagkakabutas laban kay Uza.” Inuulit ng pangalan ang salitang Hebreo na ginamit sa pagbugso ni Yahweh laban kay Uza.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר לְדָוִיד
  choice: Nagalit si David
  rationale: Ang idyomang Hebreo ay nagsasaad na nagningas ang galit ni David. Ang “nagalit” ay malinaw, natural, at hindi nagpapahina sa damdaming ipinahahayag.
- source_word: כִּי
  choice: dahil
  rationale: Ipinakikilala nito ang dahilan ng galit ni David; ang “dahil” ang natural na katumbas sa modernong Tagalog.
- source_word: פָרַץ יְהוָה פֶּרֶץ
  choice: bumugso si Yahweh
  rationale: Magkaugnay ang pandiwa at pangngalang mula sa ugat פרץ, na nagpapahiwatig ng biglaan at marahas na pagbugso o pagwasak. Pinananatili ng “bumugso” ang larawan ng biglaang pagsambulat nang hindi nagdaragdag ng tiyak na paraang hindi binanggit sa Hebreo; ipinapaliwanag sa talababa ang larong-salita sa pangalan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin ang Tetragrammaton bilang personal na pangalang “Yahweh,” sa halip na palitan ito ng isang titulo.
- source_word: בְּעֻזָּא
  choice: laban kay Uza
  rationale: Sa idyoma ng pagbugso, ipinakikita ng “laban kay” na si Uza ang pinuntirya ng pagkilos.
- source_word: וַיִּקְרָא לַמָּקוֹם הַהוּא
  choice: Kaya tinawag niyang … ang lugar na iyon
  rationale: Natural na pormula ito sa Tagalog para sa pagbibigay ng pangalan sa isang lugar; ipinahihiwatig rin ng “kaya” ang bunga ng naunang pangyayari.
- source_word: פֶּרֶץ עֻזָּא
  choice: Peres-Uza
  rationale: Itinumbas sa baybay-Tagalog ang pangalan ng lugar, samantalang inilalahad sa talababa ang kahulugan at larong-salita nito.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: hanggang sa araw na ito
  rationale: Pinananatili nito ang karaniwang idyomang nagsasaad na nanatili ang pangalan hanggang sa panahon ng pagsulat.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Personal na pangalan ang tuwirang nasa tekstong Hebreo. Ang “Yahweh” ay nagpapanatili rito sa halip na palitan ng titulong “PANGINOON.”
- issue: Uri ng pagkilos ni Yahweh laban kay Uza
  choice: bumugso si Yahweh laban kay Uza
  alternative: pinatay ni Yahweh si Uza
  rationale: Bagaman malinaw sa konteksto ang kinahinatnan, gumagamit ang talata ng larawang mula sa ugat פרץ. Hindi ito pinapaliit sa mismong resulta lamang, kaya napapanatili ang biglaan at marahas na pagbugso at ang ugnayan nito sa pangalan ng lugar.
translation_notes:
  register: Makabago at madaling maunawaang Filipino na may marangal na himig. Ginamit ang “bumugso” upang mapanatili hangga't maaari ang matinding larawan at larong-salita ng Hebreo; inilagay sa talababa ang mga posibleng kahulugan ng pangalan.
