    issue: 'Maling transliterasyon ng pangalan ng lugar: “Peres-Uza.”'
    rationale: Ang פֶּרֶץ ay Perez, gaya rin ng karaniwang anyo ng pangalang Perez sa Bibliya. Dapat pareho ang transliterasyon sa pangunahing teksto at talababa.
  - severity: medium
    issue: Ang “pagwasak kay Uza” sa talababa ay hindi sapat na tumpak na pagpapaliwanag ng pangalan.
    rationale: Ang Hebreong larong-salita ay nasa pandiwang/noun na “bumugso; pagbugso” o “pagkakaroon ng siwang/butas,” hindi sa tuwirang pandiwang “wasakin.” Mas mainam ang “pagbugso laban kay Uza” o “pagkawasak/pagbutas laban kay Uza,” habang kinikilala ang pagiging pagtatangkang isalin ang wordplay.
