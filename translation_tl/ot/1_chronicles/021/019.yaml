base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/019.yaml
  text: So David went up at the word of Gad[b][a], which he had spoken in the name of Yahweh.
translation:
  language: tl
  text: Kaya umakyat si David ayon sa salitang sinabi ni Gad sa pangalan ni Yahweh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַל
  choice: umakyat
  rationale: Pinananatili ng “umakyat” ang direksiyonal na diwa ng pandiwang עלה at natural ito sa konteksto ng pagpunta ni David sa giikan.
- source_word: בִּדְבַר גָּד
  choice: ayon sa salitang sinabi ni Gad
  rationale: Ang בְּ dito ay nagpapahayag ng batayan o pagsunod. Ang parirala ay tapat sa “ayon sa salita ni Gad” ngunit mas malinaw at natural sa modernong Tagalog.
- source_word: אֲשֶׁר דִּבֶּר
  choice: sinabi ni Gad
  rationale: Ginagawang malinaw ng Tagalog ang nakatagong simuno ng pandiwa, na sa konteksto ay si Gad, nang hindi dinaragdagan ang kahulugan.
- source_word: בְּשֵׁם יְהוָה
  choice: sa pangalan ni Yahweh
  rationale: Pinananatili nito ang pormal na pahayag na ang mensahe ay sinalita sa pangalan at awtoridad ni Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang transliterasyon ng personal na banal na pangalan sa tekstong Hebreo sa halip na palitan ito ng isang titulo.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: ang PANGINOON
  rationale: Tuwirang ginagamit ng talata ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalan habang ang “PANGINOON” ay tradisyonal na pamalit na titulo.
- issue: Sino ang nagsalita sa pangalan ni Yahweh
  choice: Si Gad
  alternative: Panatilihing walang tahasang simuno
  rationale: Walang nakasulat na panghalip sa Hebreo, ngunit ang pinakamalapit at likas na simuno ng דִּבֶּר ay si Gad. Ang tahasang pagbanggit sa kanya ay kailangan para sa malinaw at natural na Tagalog at hindi nagdaragdag ng doktrinal na interpretasyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang “umakyat” at “sa pangalan ni Yahweh” upang hindi mawala ang direksiyonal at propetikong anyo ng Hebreo; iniwasan naman ang sobrang pormal na “alinsunod sa salita.”
