  source_fidelity: 'Tumpak na naihahayag ang pangunahing nilalaman ng Hebreo: ang kahilingan ni David para sa lugar ng giikan, ang layuning magtayo ng altar para kay יהוה, ang pagbabayad ng buong presyo, at ang pagtigil ng salot sa bayan. Ang “upang matigil ang salot sa bayan” ay likas na Tagalog na pagsasalin ng layuning ang salot ay mapigil o maalis mula sa bayan, kahit hindi nito literal na inuulit ang idyomang “mula sa ibabaw ng bayan.”'
