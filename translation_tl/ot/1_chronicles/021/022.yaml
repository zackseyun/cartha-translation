base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/022.yaml
  text: Then David said to Ornan, “Give me the place of the threshing floor, so that I may build on it an altar to the LORD. Give it to me for the full price, so that the plague may be stopped from upon the people.”
translation:
  language: tl
  text: At sinabi ni David kay Ornan, “Ibigay mo sa akin ang lugar ng giikan upang makapagtayo ako roon ng altar para sa PANGINOON. Ibigay mo iyon sa akin sa buong halaga, upang matigil ang salot sa bayan.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מְקוֹם הַגֹּרֶן
  choice: ang lugar ng giikan
  rationale: Tuwirang pinananatili ang ‘lugar’ (מְקוֹם) at ginagamit ang likas na salitang Tagalog na ‘giikan’ para sa threshing floor.
- source_word: בְּכֶסֶף מָלֵא
  choice: sa buong halaga
  rationale: Ipinahahayag ang kabuuang presyong salapi nang hindi dinaragdagan ang teksto ng ideyang tawaran o pagtataya.
- source_word: וְתֵעָצַר
  choice: upang matigil
  rationale: Ang pandiwa ay nasa anyong pasibo at tumutukoy sa pagpigil o paghinto ng salot; natural itong naihahayag sa Tagalog bilang ‘matigil.’
- source_word: מֵעַל הָעָם
  choice: sa bayan
  rationale: Sa kontekstong ito, ang Hebreong idyomang ‘mula sa ibabaw ng bayan’ ay natural na tumutukoy sa pag-alis o pagtigil ng salot na sumasalanta sa bayan.
theological_decisions:
- issue: Paglalahad sa banal na pangalan יהוה
  choice: PANGINOON
  alternative: Yahweh
  rationale: Ginamit ang nakaugaliang anyong malalaking titik na kumakatawan sa Tetragrammaton, kaayon ng ibinigay na konsultasyong POB at nang hindi nagdaragdag ng denominasyonal na pagpapakahulugan.
- issue: Ugnayan ng pagtatayo ng altar at pagtigil ng salot
  choice: upang ... upang
  alternative: nang sa gayon ay
  rationale: Pinananatili ang dalawang layuning ipinahahayag ng mga sugnay sa Hebreo, nang hindi ipinapaliwanag nang higit sa teksto ang mekanismo ng pagtigil ng salot.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa pagbasa ng karaniwang mambabasa. Pinanatili ang pangalang Ornan at ang terminong altar, na parehong pamilyar sa gamit-Bibliya.
