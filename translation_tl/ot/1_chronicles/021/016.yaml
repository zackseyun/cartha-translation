- from: Tumingala si David at nakita niya ang anghel ni Yahweh na nakatayo sa pagitan ng lupa at ng kalangitan,[a] na hawak ang nakabunot niyang espada at nakaunat ito sa ibabaw ng Jerusalem. Kaya si David at ang matatandang pinuno, na nakasuot ng telang-sako, ay nagpatirapa.
  to: Tumingala si David at nakita niya ang anghel ni Yahweh na nakatayo sa pagitan ng lupa at ng kalangitan,[a] na may nakabunot na espada sa kaniyang kamay, na nakaunat sa ibabaw ng Jerusalem. At si David at ang mga nakatatanda, na nakabalot sa telang sako, ay nagpatirapa.
