    rationale: Bagaman ang mga nakatatanda ay maaaring may tungkuling pamumuno sa konteksto, hindi iyon tahasang inilalahad ng salita mismo. Ang “mga nakatatanda” ay mas tapat at hindi nagdaragdag ng paliwanag sa pangunahing teksto.
  - severity: medium
