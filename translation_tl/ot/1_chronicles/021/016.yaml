reference: 1 Chronicles 21:16
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יִּשָּׂ֨א דָוִ֜יד אֶת עֵינָ֗י/ו וַ/יַּ֞רְא אֶת מַלְאַ֤ךְ יְהוָה֙ עֹמֵ֗ד בֵּ֤ין הָ/אָ֨רֶץ֙ וּ/בֵ֣ין הַ/שָּׁמַ֔יִם וְ/חַרְבּ֤/וֹ שְׁלוּפָה֙ בְּ/יָד֔/וֹ נְטוּיָ֖ה עַל יְרוּשָׁלִָ֑ם וַ/יִּפֹּ֨ל דָּוִ֧יד וְ/הַ/זְּקֵנִ֛ים מְכֻסִּ֥ים בַּ/שַּׂקִּ֖ים עַל פְּנֵי/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/016.yaml
  text: David lifted up his eyes and saw the angel of Yahweh standing between the earth and the heavens[a], with his sword drawn in his hand, stretched out over Jerusalem. Then David and the elders, covered in sackcloth, fell on their faces.
translation:
  language: tl
  text: Tumingala si David at nakita niya ang anghel ni Yahweh na nakatayo sa pagitan ng lupa at ng kalangitan,[a] na may nakabunot na espada sa kaniyang kamay, na nakaunat sa ibabaw ng Jerusalem. At si David at ang mga nakatatanda, na nakabalot sa telang sako, ay nagpatirapa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “sa pagitan ng lupa at langit.” Sa Hebreo, “sa pagitan ng lupa at ng mga langit.”
    reason: Pinananatili sa pangunahing teksto ang natural na “kalangitan,” habang itinatala ang posibleng singular na salin at ang literal na plural na anyo ng Hebreo.
lexical_decisions:
- source_word: וַיִּשָּׂא דָוִיד אֶת־עֵינָיו
  choice: Tumingala si David
  rationale: Natural na salin ng idyomang Hebreo na literal na nagsasabing ‘itinaas ni David ang kaniyang mga mata’; pinananatili nito ang direksiyon ng pagtingin nang hindi nagiging alanganin sa modernong Tagalog.
- source_word: מַלְאַךְ יְהוָה
  choice: anghel ni Yahweh
  rationale: Tuwirang inililipat ang construct phrase at pinananatili ang personal na pangalang יהוה bilang Yahweh.
- source_word: עֹמֵד
  choice: nakatayo
  rationale: Malinaw na inilalarawan ng participle ang nakikitang tindig ng anghel.
- source_word: בֵּין הָאָרֶץ וּבֵין הַשָּׁמַיִם
  choice: sa pagitan ng lupa at ng kalangitan
  rationale: Ang ‘lupa’ at ‘kalangitan’ ay natural na kosmikong magkatambal sa Tagalog; ang ‘kalangitan’ ay angkop na kolektibong katumbas ng anyong Hebreo na שׁמים.
- source_word: וְחַרְבּוֹ שְׁלוּפָה בְּיָדוֹ
  choice: na hawak ang nakabunot niyang espada
  rationale: Ipinahahayag nang natural ang espada na nabunot na mula sa kaluban at nasa kamay ng anghel.
- source_word: נְטוּיָה עַל־יְרוּשָׁלִָם
  choice: nakaunat ito sa ibabaw ng Jerusalem
  rationale: Pinananatili ang nagbabantang larawan ng espadang iniunat sa ibabaw o laban sa lungsod nang hindi nilulutas nang labis ang saklaw ng עַל.
- source_word: וְהַזְּקֵנִים
  choice: ang matatandang pinuno
  rationale: Sa kontekstong pampamayanan, ang זקנים ay hindi lamang matatanda sa edad kundi kinikilalang mga pinuno; nililinaw ito ng natural na pariralang Tagalog.
- source_word: מְכֻסִּים בַּשַּׂקִּים
  choice: nakasuot ng telang-sako
  rationale: Ipinababatid ang magaspang na kasuotang kaugnay ng pagluluksa at pagpapakumbaba; mas nauunawaan sa modernong Tagalog kaysa sa ‘sackcloth’ na hindi isinalin.
- source_word: וַיִּפֹּל ... עַל־פְּנֵיהֶם
  choice: nagpatirapa
  rationale: Natural at dignified na katumbas ng pagbagsak nang pasubsob bilang kilos ng matinding pagpapakumbaba o paggalang.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo, kaya pinananatili itong Yahweh sa halip na palitan ng isang titulo.
- issue: Kahulugan ng pagpatirapa
  choice: nagpatirapa
  alternative: sumubsob sa lupa
  rationale: Pinananatili ng ‘nagpatirapa’ kapwa ang pisikal na kilos at ang pagpapakumbabang ipinahihiwatig nito, nang hindi tiyak na itinatakda kung pagsamba, takot, o pagsisisi lamang ang motibo.
- issue: Saklaw ng עַל kaugnay ng Jerusalem
  choice: sa ibabaw ng Jerusalem
  alternative: laban sa Jerusalem
  rationale: Ang pang-ukol ay maaaring magpahiwatig ng posisyon sa ibabaw at, sa konteksto, ng banta laban sa lungsod. Pinili ang mas kongkretong larawang spatial at iniwang mahihinuha ang banta.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Ginamit ang ‘telang-sako’ upang ipaliwanag nang maikli ang kasuotang penitensiyal, at ‘matatandang pinuno’ upang maiwasang ipakahulugang edad lamang ang זקנים.
