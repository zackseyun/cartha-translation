id: 1CH.21.28
reference: 1 Chronicles 21:28
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: בָּ/עֵ֣ת הַ/הִ֔יא בִּ/רְא֤וֹת דָּוִיד֙ כִּי עָנָ֣/הוּ יְהוָ֔ה בְּ/גֹ֖רֶן אָרְנָ֣ן הַ/יְבוּסִ֑י וַ/יִּזְבַּ֖ח שָֽׁם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/028.yaml
  text: At that time[a], when David saw that Yahweh had answered him at the threshing floor of Ornan the Jebusite, he sacrificed there.
translation:
  language: tl
  text: Noong panahong iyon, nang makita ni David na sinagot siya ni Yahweh sa giikan ni Ornan na Jebuseo, naghandog siya roon ng hain.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּעֵת הַהִיא
  choice: Noong panahong iyon
  rationale: Likas na katumbas sa modernong Tagalog ng karaniwang pariralang temporal, at pinananatili ang ugnayan nito sa naunang pangyayari.
- source_word: בִּרְאוֹת דָּוִיד
  choice: nang makita ni David
  rationale: Ang infinitive construct na may בְּ ay nagsasaad ng kalagayang temporal; malinaw at natural itong ipinapahayag sa Tagalog sa pamamagitan ng “nang makita.”
- source_word: כִּי
  choice: na
  rationale: Ipinakikilala rito ng כִּי ang nilalaman ng nakita ni David, hindi tahasang sanhi.
- source_word: עָנָהוּ
  choice: sinagot siya
  rationale: Ang ענה ay nangangahulugang sumagot o tumugon, at sa konteksto ay tumutukoy sa tugon ng Diyos sa panalangin o paghahandog ni David.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin sa titik ang personal na pangalang banal sa halip na palitan ito ng isang titulo.
- source_word: בְּגֹרֶן
  choice: sa giikan
  rationale: Ang גֹּרֶן ay lugar kung saan ginigiik ang ani; “giikan” ang tuwiran at natural na katumbas sa Tagalog.
- source_word: אָרְנָן הַיְבוּסִי
  choice: Ornan na Jebuseo
  rationale: Pinananatili ang pangalang Ornan at isinasalin ang katawagang etniko sa karaniwang anyong Tagalog.
- source_word: וַיִּזְבַּח שָׁם
  choice: naghandog siya roon
  rationale: Ipinahahayag ng זבח ang paghahandog ng hain. Sa kontekstong ito, sapat at natural ang “naghandog,” habang pinananatili ng “roon” ang lokatibong שָׁם.
theological_decisions:
- issue: Paglalarawan sa tugon ni Yahweh
  choice: sinagot siya
  alternative: tumugon sa kanya
  rationale: Pinananatili ng “sinagot siya” ang karaniwang kahulugan ng ענה at ang ugnayan nito sa naunang panalangin at handog, nang hindi nililimitahan kung paano dumating ang tugon.
- issue: Pagsasalin sa pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Personal na pangalan ang nasa tekstong Hebreo; ang “Yahweh” ay nagpapanatili rito sa halip na palitan ito ng titulong “PANGINOON.”
translation_notes:
  register: Gumamit ng makabago ngunit marangal at madaling maunawaang Tagalog. Ang “giikan” ay tiyak sa kulturang agrikultural at mas angkop kaysa sa isang mahabang paliwanag sa pangunahing teksto.
