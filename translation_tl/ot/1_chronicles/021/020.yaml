base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/020.yaml
  text: Ornan turned and saw the angel[a], and his four sons with him were hiding themselves, while Ornan was threshing wheat.
translation:
  language: tl
  text: Lumingon si Ornan at nakita niya ang anghel. Nagtatago[a] ang apat niyang anak na lalaki na kasama niya, habang naggigiik si Ornan ng trigo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaaring bigyang-diin ng anyong Hitpael sa Hebreo na sila mismo ang nagtatago.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: Lumingon
  rationale: Ang שׁוב ay nangangahulugang bumaling o bumalik. Sa tagpong ito, natural na ipinahihiwatig ng “lumingon” ang pisikal na pagbaling na humantong sa pagkakita sa anghel, nang hindi nagdaragdag ng di-tiyak na direksiyon.
- source_word: וַיַּרְא אֶת הַמַּלְאָךְ
  choice: nakita niya ang anghel
  rationale: Bagaman maaaring mangahulugang “mensahero” ang מַלְאָךְ, malinaw sa salaysay na isang makalangit na nilalang ang tinutukoy, kaya “anghel” ang tumpak at likas na salin.
- source_word: וְאַרְבַּעַת בָּנָיו
  choice: ang apat niyang anak
  rationale: Tuwirang tinutukoy ng parirala ang apat na anak na lalaki ni Ornan. Sa Filipino, sapat at natural ang “anak” rito; hindi kailangang idagdag ang “na lalaki” sapagkat walang salungat na pahiwatig sa konteksto.
- source_word: עִמּוֹ
  choice: na kasama niya
  rationale: Nililinaw ng maikling pariralang ito na kasama ni Ornan ang apat niyang anak. Ang sugnay na “na kasama niya” ay mas malinaw sa natural na ayos ng Filipino.
- source_word: מִתְחַבְּאִים
  choice: nagtatago
  rationale: Ang Hitpael na anyo ay may reflexive o middle na diwa. Likas nang maipinahihiwatig ng pandiwang Filipino na “nagtatago” na sila mismo ang kumikilos; inilalagay sa talababa ang mas tahasang posibilidad na “nagkukubli.”
- source_word: וְאָרְנָן דָּשׁ חִטִּים
  choice: samantalang naggigiik si Ornan ng trigo
  rationale: Ang sugnay ay nagbibigay ng kasabay at nagpapatuloy na kilos sa likuran ng tagpo. Ang “samantalang” at aspektong “naggigiik” ay malinaw na naghahatid nito.
- source_word: חִטִּים
  choice: trigo
  rationale: Partikular na trigo ang tinutukoy, hindi lamang butil sa pangkalahatan.
theological_decisions: []
translation_notes:
  register: Gumamit ng moderno, malinaw, at marangal na Filipino. Hinati sa dalawang pangungusap ang mahabang Hebreong koordinasyon upang maging madaling basahin nang hindi binabago ang ugnayan ng mga kilos. Inulit ang pangalang Ornan sa hulíng sugnay upang maiwasan ang kalituhan kung sino ang naggigiik.
