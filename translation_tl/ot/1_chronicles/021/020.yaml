  naturalness: Natural at malinaw ang rebisyon sa modernong Filipino Tagalog. Isang pangungusap ang nagpapanatili sa magkakaugnay na mga sugnay nang hindi nagiging mabigat.
  terminology: Ang “anghel” ay angkop sa kontekstong ito para sa מַלְאָךְ. Ang “trigo” ay tiyak na katumbas ng חִטִּים. Idinagdag ang “na lalaki” upang maipakita ang בָּנָיו.
