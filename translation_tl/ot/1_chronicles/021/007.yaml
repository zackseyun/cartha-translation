  text: וַ/יֵּ֨רַע֙ בְּ/עֵינֵ֣י הָ/אֱלֹהִ֔ים עַל הַ/דָּבָ֖ר הַ/זֶּ֑ה וַ/יַּ֖ךְ אֶת יִשְׂרָאֵֽל־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/007.yaml
  text: But this matter was evil in the sight of God[a], so he struck Israel.
translation:
  language: tl
  text: Ngunit masama sa paningin ng Diyos ang bagay na ito,[a] kaya hinampas niya ang Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “hindi nakalugod sa Diyos.” Literal sa Hebreo, “masama sa mga mata ng Diyos.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרַע
  choice: masama
  rationale: Pinananatili nito ang matinding negatibong paghatol ng pandiwang Hebreo at hindi ito pinahihina tungo sa simpleng pagkayamot o di-pagkalugod.
- source_word: בְּעֵינֵי הָאֱלֹהִים
  choice: sa paningin ng Diyos
  rationale: Likas at marangal na katumbas ito ng idyomang literal na 'sa mga mata ng Diyos,' at pinananatili ang pananaw ng Diyos bilang tagahatol.
- source_word: הָאֱלֹהִים
  choice: Diyos
  rationale: Elohim ang nasa teksto, hindi ang banal na pangalang YHWH; kaya 'Diyos,' hindi 'PANGINOON.'
- source_word: עַל הַדָּבָר הַזֶּה
  choice: ang bagay na ito
  rationale: Malawak ang saklaw ng דָּבָר; ang 'bagay na ito' ay natural at hindi labis na nagpapakahulugan, habang malinaw na tumutukoy sa naunang ginawa ni David.
- source_word: וַיַּךְ
  choice: hinampas
  rationale: Direktang ipinapahayag ang diwa ng נכה na 'humampas/sumakit' nang hindi idinaragdag na pinatay o nilipol ang lahat, na hindi tahasang sinasabi sa talatang ito lamang.
- source_word: אֶת יִשְׂרָאֵל
  choice: ang Israel
  rationale: Ang tuwirang layon ay ang bansang Israel; hindi kailangang palawakin bilang 'ang mga Israelita' o 'ang bayan ng Israel.'
- source_word: וַ ... וַ
  choice: Ngunit ... kaya
  rationale: Ipinahihiwatig ng unang waw ang pagsalungat sa naunang salaysay, samantalang natural na inihahayag ng 'kaya' ang bunga sa ikalawang sugnay.
theological_decisions:
- issue: Ang paghatol ng Diyos sa ginawa ni David at ang kasunod na paghampas sa Israel
  choice: Tahasang sinasabing masama sa paningin ng Diyos ang bagay na iyon, kaya hinampas niya ang Israel.
  alternative: Sabihing hindi lamang ito nakalugod sa Diyos, o palambutin ang 'hinampas' bilang isang di-mapanghatol na tugon.
  rationale: Malakas ang evaluative force ng Hebreo at tuwiran ang kasunod na kilos. Pinananatili ng salin ang tensiyon na ang gawa ni David ay hinatulan ngunit ang Israel ang hinampas, nang hindi nilulutas o ipinapaliwanag nang lampas sa sinasabi ng talata.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinili ang 'sa paningin ng Diyos' bilang natural na idyoma, habang inilagay sa talababa ang literal na anyo at ang mas banayad na alternatibo.
