base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/003.yaml
  text: But Joab said[a], “May Yahweh add to his people a hundred times as many as they are! Are they not all, my lord the king[c][b], servants of my lord? Why does my lord seek this? Why should it become guilt for Israel?”
translation:
  language: tl
  text: Ngunit sinabi ni Joab, “Nawa’y paramihin ni Yahweh ang kanyang bayan nang sandaang ulit kaysa sa kasalukuyan nilang bilang![a] Hindi ba silang lahat, panginoon kong hari, ay mga lingkod ng aking panginoon?[b] Bakit ito hinahangad ng aking panginoon? Bakit ito magiging pananagutan para sa Israel?”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “Nawa’y paramihin ni Yahweh ang kanyang bayan nang sandaang ulit.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin ang “mga lingkod” bilang “mga alipin.”
    reason: lexical_alternative
  - marker: c
    text: Ibig sabihin, ang pagkilos na ito ay magdadala ng pagkakasala o pananagutan sa Israel.
    reason: cultural_note
lexical_decisions:
- source_word: יוֹסֵף
  choice: Nawa’y dagdagan
  rationale: Ang anyong jussive ay nagpapahayag ng hiling o panalangin ni Joab. Likas na ipinahahayag ito sa Filipino sa pamamagitan ng “Nawa’y.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang transliterasyon ng personal na pangalan ng Diyos na nasa tekstong Hebreo, sa halip na palitan ito ng isang titulo.
- source_word: עַל עַמּוֹ כָּהֵם מֵאָה פְעָמִים
  choice: ang kanyang bayan hanggang maging sandaang ulit ang dami nila
  rationale: Ipinahahayag ng idyoma ang pagdami ng bayan batay sa kasalukuyan nilang bilang. Malinaw at natural ito sa modernong Filipino.
- source_word: הֲלֹא
  choice: Hindi ba
  rationale: Ipinananatili nito ang retorikal na tanong na umaasang sasang-ayon ang kausap.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: panginoon kong hari
  rationale: Isang marangal na katawagang angkop sa pagsasalita sa hari at malapit sa ayos ng Hebreo.
- source_word: כֻּלָּם לַאדֹנִי לַעֲבָדִים
  choice: silang lahat ... ay mga lingkod ng aking panginoon
  rationale: Sa konteksto, binibigyang-diin ang paglilingkod at pagpapasakop ng bayan sa hari. Posible rin ang “mga alipin,” ngunit maaaring magbigay iyon ng mas makitid na diin kaysa sa hinihingi ng konteksto.
- source_word: יְבַקֵּשׁ זֹאת
  choice: ito hinahangad
  rationale: Pinananatili ng “hinahangad” ang malawak na diwa ng paghahanap o pagtataguyod sa ipinag-uutos na sensus.
- source_word: לְאַשְׁמָה
  choice: sanhi ng pagkakasala
  rationale: Dito, ang salita ay tumutukoy sa pagkakasala o pananagutang idudulot sa Israel, hindi sa handog para sa pagkakasala.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehovah
  rationale: Tuwirang nasa Hebreo ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng titulo.
- issue: Kahulugan ng עֲבָדִים kaugnay ng hari
  choice: mga lingkod
  alternative: mga alipin
  rationale: Ang agarang konteksto ay tungkol sa pampolitika at maharlikang pagpapasakop ng bayan. Gayunman, nakatala sa talababa ang mas matinding posibleng salin upang hindi maitago ang saklaw ng salitang Hebreo.
- issue: Diwa ng אַשְׁמָה
  choice: sanhi ng pagkakasala
  alternative: pananagutan sa kasalanan
  rationale: Ang konteksto ay tumutukoy sa kasalanan at pananagutang sasapit sa Israel dahil sa pagkilos na ito, hindi sa isang handog na pansakripisyo.
translation_notes:
  register: Gumamit ng modernong Filipino na marangal ngunit madaling maunawaan. Pinanatili ang magalang na pananalita ni Joab sa hari, ang retorikal na tanong, at ang bahagyang tensiyon sa pagitan ng “lingkod” at “alipin.”
