revisions:
- from: Ngunit sinabi ni Joab, “Nawa’y dagdagan ni Yahweh ang kanyang bayan hanggang maging sandaang ulit ang dami nila![a] Hindi ba silang lahat, panginoon kong hari, ay mga lingkod ng aking panginoon?[b] Bakit ito hinahangad ng aking panginoon? Bakit ito magiging sanhi ng pagkakasala ng Israel?”[c]
  to: Ngunit sinabi ni Joab, “Nawa’y paramihin ni Yahweh ang kanyang bayan nang sandaang ulit kaysa sa kasalukuyan nilang bilang![a] Hindi ba silang lahat, panginoon kong hari, ay mga lingkod ng aking panginoon?[b] Bakit ito hinahangad ng aking panginoon? Bakit ito magiging pananagutan para sa Israel?”[c]
  rationale: Pinalinaw ang idiomang tumutukoy sa sandaang ulit na pagdami at pinalitan ang “sanhi ng pagkakasala” ng “pananagutan” upang mas malapit na maipakita ang אַשְׁמָה bilang guilt o liability para sa Israel. Pinanatili ang anyong magalang na pananalita ni Joab, ang ambiguity ng עֲבָדִים sa talababa, at ang lahat ng wastong footnote anchor.
