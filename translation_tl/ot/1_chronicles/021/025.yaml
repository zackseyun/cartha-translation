  text: And David gave Ornan six hundred shekels of gold by weight for the place[a].
translation:
  language: tl
  text: At nagbigay si David kay Ornan ng animnaraang siklo ng ginto ayon sa timbang bilang bayad sa lugar[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa katumbas na salaysay sa 2 Samuel 24:24, limampung siklong pilak ang binanggit. Dito sa Mga Cronica ay animnaraang siklo ng ginto ang nakasulat; maaaring magkaiba ang saklaw ng binili o ang tradisyon ng teksto.
    reason: cross_reference
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: ibinigay
  rationale: Pinananatili nito ang karaniwang kahulugan ng נתן na “magbigay,” habang nililinaw ng pariralang “bilang kabayaran” ang diwa ng pagbili sa konteksto.
- source_word: לְאָרְנָן
  choice: kay Ornan
  rationale: Ornan ang anyo ng pangalan sa tekstong Hebreo ng Mga Cronica; hindi ito pinalitan ng Arauna mula sa katumbas na salaysay sa 2 Samuel.
- source_word: בַּמָּקוֹם
  choice: bilang kabayaran sa lugar
  rationale: Sa konteksto ng bilihan, ipinahihiwatig ng בְּ na ang halagang ibinigay ay kapalit ng mismong lugar. Natural ito sa modernong Tagalog at hindi ipinapalagay na sahig-giikan lamang ang saklaw.
- source_word: שִׁקְלֵי זָהָב
  choice: siklong ginto
  rationale: Pinananatili ang sinaunang yunit ng timbang at malinaw na ginto ang materyal na tinimbang.
- source_word: מִשְׁקָל
  choice: ayon sa timbang
  rationale: Malinaw na ipinakikita na ang mga siklo ay tumutukoy sa timbang, ayon sa tahasang מִשְׁקָל ng Hebreo.
- source_word: שֵׁשׁ מֵאוֹת
  choice: animnaraan
  rationale: Tuwirang isinasalin ang bilang sa Mga Cronica nang hindi itinutugma sa naiibang bilang sa 2 Samuel 24:24.
theological_decisions:
- issue: Pagkakaiba ng bilang at uri ng metal kumpara sa 2 Samuel 24:24
  choice: Pinanatili ang “animnaraang siklong ginto” ng tekstong Hebreo sa Mga Cronica.
  alternative: Itugma sa limampung siklong pilak na nasa 2 Samuel 24:24.
  rationale: Hayagang binabanggit ng Mga Cronica ang animnaraang siklong ginto. Hindi dapat lutasin ng salin ang tensiyon sa magkatumbas na salaysay sa pamamagitan ng tahimik na pag-aayon.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “siklo” bilang karaniwang anyong Filipino ng sinaunang yunit at pinanatili ang pangalang Ornan mula sa agarang tekstong pinagmulan.
