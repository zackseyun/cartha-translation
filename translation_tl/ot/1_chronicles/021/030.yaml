id: 1CH.21.30
reference: 1 Chronicles 21:30
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/לֹא יָכֹ֥ל דָּוִ֛יד לָ/לֶ֥כֶת לְ/פָנָ֖י/ו לִ/דְרֹ֣שׁ אֱלֹהִ֑ים כִּ֣י נִבְעַ֔ת מִ/פְּנֵ֕י חֶ֖רֶב מַלְאַ֥ךְ יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/030.yaml
  text: But David could not go before it to seek God[a], because he was terrified by the sword of the angel of Yahweh.
translation:
  language: tl
  text: Ngunit hindi makapunta si David sa harap nito[a] upang dumulog sa Diyos, sapagkat takot na takot siya sa espada ng anghel ni Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa harap niya,” kung ang panghalip ay tumutukoy sa Diyos sa halip na sa tabernakulo sa Gibeon.
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/לֹא
  choice: Ngunit hindi
  rationale: Ipinagpapatuloy nito ang salaysay na may bahagyang pagsalungat sa naunang talata; natural itong ipinahahayag ng “Ngunit hindi” sa makabagong Tagalog.
- source_word: יָכֹל ... לָ/לֶכֶת
  choice: makapunta
  rationale: Ang pandiwa ay tumutukoy sa kakayahang pumunta sa isang lugar. Sapat at natural na naipapahayag ng “hindi makapunta” ang pinagsamang diwa ng pandiwa at pawatas.
- source_word: לְ/פָנָי/ו
  choice: sa harap nito[a]
  rationale: Malamang na tumutukoy ang panlalaking panghalip sa tabernakulo o toldang tipanan na binanggit sa talata 29. Pinananatili ng “nito” ang panghalip nang hindi ipinapasok ang pangngalan sa mismong teksto; inilalahad sa talababa ang tunay na posibilidad na Diyos ang tinutukoy.
- source_word: לִ/דְרֹשׁ אֱלֹהִים
  choice: upang dumulog sa Diyos
  rationale: Sa kontekstong ito, ang דרש na ang layon ay Diyos ay tumutukoy sa paghahanap o pagsangguni sa Diyos sa panalangin at pagsamba. Ang “dumulog sa Diyos” ay natural at marangal sa Tagalog at hindi ito nililimitahan sa paghingi lamang ng isang sagot.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala nito ang dahilan kung bakit hindi makapunta si David; malinaw at marangal na katumbas ang “sapagkat.”
- source_word: נִבְעַת
  choice: takot na takot
  rationale: Ipinahihiwatig ng anyong Niphal ang matinding pagkasindak o pagkatakot. Karaniwan at malinaw na ipinapahayag ng “takot na takot” ang tindi nito.
- source_word: מִ/פְּנֵי
  choice: sa
  rationale: Kasunod ng pahayag ng takot, ipinakikilala ng parirala ang sanhi ng takot. Likas sa Tagalog ang “natatakot sa” o “takot sa.”
- source_word: חֶרֶב
  choice: espada
  rationale: Literal na sandata ang tinutukoy, kaugnay ng nakabunot na espada ng anghel sa salaysay. Ang “espada” ay malinaw sa mga modernong mambabasa.
- source_word: מַלְאַךְ
  choice: anghel
  rationale: Bagaman maaari ring mangahulugang “sugo” ang salita, malinaw sa salaysay na isang makalangit na nilalang ang tinutukoy.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang personal na pangalang Yahweh upang katawanin nang tuwiran ang banal na pangalan sa tekstong Hebreo.
theological_decisions:
- issue: Ang tinutukoy ng panghalip sa לְפָנָיו
  choice: Ang panghalip ay tumutukoy sa tabernakulo o toldang tipanan sa Gibeon.
  alternative: 'Maaaring tumukoy ang panghalip sa Diyos: “sa harap niya.”'
  rationale: Ang pinakamalapit na konteksto sa talata 29 ay ang tabernakulo ni Yahweh at ang altar sa mataas na lugar sa Gibeon, at ipinaliliwanag ng talata 30 kung bakit hindi pumunta roon si David. Gayunman, posible ayon sa gramatika na Diyos ang tinutukoy, kaya pinananatili ang alternatibo sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino Tagalog. Ginamit ang “dumulog sa Diyos” bilang likas na pahayag para sa paghahanap o pagsangguni sa Diyos sa konteksto ng pagsamba, at pinanatili ang tunay na kalabuan ng panghalip sa pamamagitan ng talababa.
