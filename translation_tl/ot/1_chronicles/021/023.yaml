    issue: Hindi natural ang "Kunin mo ito para sa iyo."
    rationale: Ang konstruksyong ito ay tunog literal na salin. Ang "Kunin mo ito para sa sarili mo" ay natural at naipapahayag pa rin ang datibong לָךְ.
  - severity: medium
    issue: Ang "Ibinibigay ko" ay hindi tumutugma nang sapat sa נָתַתִּי.
    rationale: Parehong pagbanggit sa Hebreo ay perpektong anyo, na naglalahad ng ganap na pagbibigay. Ang "Ibinigay ko" ay mas malapit at natural sa konteksto.
  - severity: medium
    issue: Maling nililimitahan ng talababa b ang kahulugan sa "mga bakang pantrabaho."
    rationale: Ang בָּקָר ay tumutukoy sa mga hayop na baka/cattle at maaari ring tumukoy nang mas tiyak sa mga bakang lalaki o oxen; hindi nito mismong itinatakda na mga hayop silang ginagamit sa paggiik.
  - severity: low
    issue: Malabo at matigas ang "ang mabuti sa kanyang paningin."
    rationale: Ang "sa sarili niyang paningin" ay nagpapalinaw ng referent at pinananatili ang literal na imahen ng Hebreong idyoma.
