  to: Sinabi ni Ornan kay David, “Kunin mo ito para sa sarili mo, at gawin ng aking panginoong hari ang mabuti sa sarili niyang paningin.[a] Narito, ibinigay ko ang mga baka para sa mga handog na sinusunog,[b] ang mga kasangkapang panggiik bilang panggatong,[c] at ang trigo para sa handog na butil.[d] Ibinigay ko ang lahat ng ito.”
