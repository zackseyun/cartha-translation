  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang Hebreong idyoma sa pangunahing teksto at nilinaw sa talababa; iniwasan ang arkaikong pananalita at ang labis na pagtutukoy sa uri o kasarian ng mga baka.
