base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/023.yaml
  text: And Ornan said to David, “Take it for yourself, and let my lord the king do what is good in his eyes. See, I have given the cattle for burnt offerings, the threshing sledges for wood, and the wheat for the grain offering. I have given it all.”
translation:
  language: tl
  text: Sinabi ni Ornan kay David, “Kunin mo ito para sa sarili mo, at gawin ng aking panginoong hari ang mabuti sa sarili niyang paningin.[a] Narito, ibinigay ko ang mga baka para sa mga handog na sinusunog,[b] ang mga kasangkapang panggiik bilang panggatong,[c] at ang trigo para sa handog na butil.[d] Ibinigay ko ang lahat ng ito.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “gawin ng aking panginoong hari ang inaakala niyang mabuti.” Literal sa Hebreo: “ang mabuti sa kanyang mga mata.”'
    reason: lexical_alternative
  - marker: b
    text: O “mga bakang lalaki.” Ang salitang Hebreo ay maaaring tumukoy sa mga hayop na baka sa pangkalahatan o, sa ilang gamit, nang mas tiyak sa mga bakang lalaki.
    reason: lexical_alternative
  - marker: c
    text: Ibig sabihin, ang mga kasangkapang panggiik ay gagamiting panggatong para sa paghahandog.
    reason: cultural_note
  - marker: d
    text: O “handog” o “handog na alay.” Sa kontekstong pansakripisyo, ang salitang Hebreo ay karaniwang tumutukoy sa handog na butil.
    reason: lexical_alternative
lexical_decisions:
- source_word: קַח לָךְ
  choice: Kunin mo ito para sa iyo
  rationale: Pinananatili nito ang diwa ng personal na pag-angkin na ipinahihiwatig ng לָךְ, habang natural pa rin sa Tagalog.
- source_word: וְיַעַשׂ אֲדֹנִי הַמֶּלֶךְ הַטּוֹב בְּעֵינָיו
  choice: at gawin ng panginoon kong hari ang mabuti sa kanyang paningin
  rationale: Malapit ito sa Hebreong idyoma at pinananatili ang magalang na pahintulot kay David na kumilos ayon sa sarili niyang pasiya.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: panginoon kong hari
  rationale: Magalang na katawagan ito sa hari, hindi banal na titulo; ang maliit na titik sa “panginoon” ay tumutulong ipakita ang kaibahang iyon.
- source_word: רְאֵה
  choice: Narito
  rationale: Ginagamit dito bilang pantawag-pansin na nagpapakilala sa mariing paliwanag ni Ornan; mas natural ito sa kasalukuyang Tagalog kaysa literal na “Tingnan mo.”
- source_word: הַבָּקָר לָעֹלוֹת
  choice: ang mga baka para sa mga handog na sinusunog
  rationale: Ang בָּקָר ay maaaring kolektibong tumukoy sa mga baka o mas tiyak sa mga bakang pantrabaho; hindi labis na tinutukoy ng “mga baka” ang kasarian. Ang עֹלוֹת ay mga handog na lubos na sinusunog.
- source_word: הַמּוֹרִגִּים לָעֵצִים
  choice: ang mga panggiik bilang panggatong
  rationale: Ang מוֹרִגִּים ay mga kasangkapang panggiik; sa konteksto, ang kahoy ng mga ito ang gagamiting panggatong sa paghahandog.
- source_word: הַחִטִּים לַמִּנְחָה
  choice: ang trigo para sa handog na butil
  rationale: Tiyak na pinananatili ang trigo bilang materyal at ang teknikal na kahulugan ng מִנְחָה sa kontekstong pansakripisyo.
- source_word: הַכֹּל נָתָתִּי
  choice: Ibinibigay ko ang lahat ng ito
  rationale: Ang Hebreong ganap na pandiwa ay maaaring magpahayag ng alok na itinuturing nang tiyak at buo; ang pangkasalukuyang Tagalog ay natural sa aktuwal na sandali ng pagbibigay.
