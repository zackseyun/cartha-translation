base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/013.yaml
  text: Then David said to Gad[a], “I am in great distress. Please let me fall into the hand of Yahweh, for his mercies are very great; but do not let me fall into the hand of man.”
translation:
  language: tl
  text: At sinabi ni David kay Gad, “Nasa matinding kagipitan ako. Nawa’y mapasa-kamay ako ni Yahweh, sapagkat napakalaki ng kanyang habag; ngunit huwag nawa akong mapasa-kamay ng tao.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa mga kamay ng tao.” Isahan sa Hebreo ang “kamay ng tao,” na inihahambing ang kapangyarihan ng tao sa kamay ni Yahweh.
    reason: lexical_alternative
lexical_decisions:
- source_word: צַר לִי מְאֹד
  choice: Gulong-gulo ako
  rationale: Ipinahahayag ng idyoma ang matinding kagipitan at dalamhati. Likas ito sa modernong Filipino at malinaw ang bigat ng damdamin.
- source_word: אֶפְּלָה נָּא
  choice: Ipaubaya mo na sana ako
  rationale: Ang cohortative na may נָא ay isang apurahan ngunit magalang na pakiusap. Sa konteksto ng pagpili na ibinigay sa pamamagitan ni Gad, mas natural sa Filipino ang pormang ito kaysa literal na ‘mahulog sana ako.’
- source_word: בְיַד יְהוָה
  choice: sa kamay ni Yahweh
  rationale: Pinananatili ang larawang ‘kamay,’ na tumutukoy sa kapangyarihan o paghatol ng isang tao, at ang pangalang tipan na Yahweh.
- source_word: כִּי רַבִּים רַחֲמָיו מְאֹד
  choice: sapagkat napakasagana ng kanyang habag
  rationale: Ang רַחֲמִים ay tumutukoy sa mahabaging awa. Ipinahahayag ng ‘napakasagana’ ang pinagsamang diin ng רַבִּים at מְאֹד nang natural sa Filipino.
- source_word: וּבְיַד אָדָם אַל אֶפֹּל
  choice: ngunit huwag mo akong ipaubaya sa kamay ng tao
  rationale: Pinananatili ang parallel na larawan ng ‘kamay’ at ang singular na אָדָם bilang pangkalahatang pagtukoy sa isang taong may kapangyarihang manakit o humatol.
theological_decisions:
- issue: Paglalarawan sa banal na pangalan na יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Direktang ginagamit ng tekstong Hebreo ang Tetragrammaton; pinananatili ng ‘Yahweh’ ang natatanging pangalang tipan.
- issue: Ang kaibahan ng kamay ni Yahweh at kamay ng אָדָם
  choice: kamay ng tao
  alternative: mga kamay ng mga tao; kapangyarihan ng tao
  rationale: Pinananatili nito ang singular at ang sadyang parallel na metapora sa Hebreo, nang hindi ipinapakahulugang lalaki lamang ang tinutukoy.
translation_notes:
  register: Modernong Filipino na may marangal na tono. Pinanatili ang metaporang ‘kamay’ sa magkabilang bahagi. Ginamit ang ‘ipaubaya’ upang natural na maipahayag ang Hebreong idyomang ‘mahulog sa kamay’ habang hindi nawawala ang larawan nito.
