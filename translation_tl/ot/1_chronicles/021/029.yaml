id: 1CH.21.29
reference: 1 Chronicles 21:29
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וּ/מִשְׁכַּ֣ן יְ֠הוָה אֲשֶׁר עָשָׂ֨ה מֹשֶׁ֧ה בַ/מִּדְבָּ֛ר וּ/מִזְבַּ֥ח הָ/עוֹלָ֖ה בָּ/עֵ֣ת הַ/הִ֑יא בַּ/בָּמָ֖ה בְּ/גִבְעֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/029.yaml
  text: The tabernacle of Yahweh, which Moses had made in the wilderness, and the altar of burnt offering were at that time on the high place at Gibeon.
translation:
  language: tl
  text: Ang tabernakulo ni Yahweh, na ginawa ni Moises sa ilang, at ang altar para sa handog na sinusunog ay nasa mataas na lugar sa Gibeon nang panahong iyon.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִשְׁכַּן
  choice: tabernakulo
  rationale: Tumutukoy ito sa banal na toldang tirahan ni Yahweh na ginawa sa panahon ni Moises. Ang “tabernakulo” ang maikli at tiyak na katawagang nakikilala sa ganitong kontekstong panrelihiyon.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: אֲשֶׁר עָשָׂה מֹשֶׁה
  choice: na ginawa ni Moises
  rationale: Tuwirang inilalarawan ng sugnay ang tabernakulo; sapat na sa natural na Tagalog ang aspektong naganap upang tukuyin ang mas naunang paggawa rito.
- source_word: בַמִּדְבָּר
  choice: sa ilang
  rationale: Ang “ilang” ay natural at tradisyonal na salin para sa ilang na dinaanan ng Israel; hindi nito ipinapalagay na puro buhangin ang lugar.
- source_word: מִזְבַּח הָעוֹלָה
  choice: altar para sa handog na sinusunog
  rationale: Malinaw nitong ipinapahayag na ito ang altar na ginagamit para sa handog na lubusang sinusunog, nang hindi gumagamit ng mabigat o di-likas na tambalang salita.
- source_word: בָּעֵת הַהִיא
  choice: nang panahong iyon
  rationale: Natural na Tagalog na panandang temporal na tumutukoy sa kalagayan noong panahong isinasalaysay.
- source_word: בַּבָּמָה
  choice: nasa mataas na lugar
  rationale: Pinananatili ang literal na larawang spatial at ang teknikal na kahulugan ng isang mataas na pook na ginagamit sa pagsamba.
- source_word: בְּגִבְעוֹן
  choice: sa Gibeon
  rationale: Karaniwang gamit sa Tagalog ang “sa” para tukuyin ang kinaroroonang bayang pinangalanan.
- source_word: וּ
  choice: at
  rationale: Ang ikalawang waw ay natural na nag-uugnay sa tabernakulo at altar bilang magkasamang simuno. Hindi nilagyan ng “Ngayon” ang simula sapagkat walang tahasang salitang temporal na katumbas nito sa Hebreo.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo. Ang “Yahweh” ay mas tuwirang paglilipat nito kaysa sa pagpapalit ng titulong “PANGINOON,” samantalang ang “Jehovah” ay nakabatay sa mas huling pinagsamang anyo.
- issue: Kahulugan ng בָּמָה sa lugar ng pagsamba
  choice: mataas na lugar
  alternative: mataas na dambana
  rationale: Ang salita ay tumutukoy sa isang mataas na pook na panrelihiyon, ngunit hindi ito mismong katumbas lamang ng “dambana.” Pinananatili ng salin ang pagkakaiba nito sa altar na tahasang binanggit sa parehong talata.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang “tabernakulo” at “altar” bilang pamilyar at tiyak na mga terminong panrelihiyon, habang ginawang likas ang ayos ng buong pangungusap. Hindi isinalin ang panimulang waw bilang “Ngayon”; ang ugnayan nito sa konteksto ay naipahihiwatig ng tuloy-tuloy na salaysay.
