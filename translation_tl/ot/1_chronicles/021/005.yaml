base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/005.yaml
  text: Joab gave the number of the census of the people to David. All Israel was 1,100,000 men drawing the sword[a], and Judah was 470,000 men drawing the sword.
translation:
  language: tl
  text: Ibinigay ni Joab kay David ang bilang ng sensus ng mga tao. Sa buong Israel ay may 1,100,000[a] lalaking bumubunot ng tabak; sa Juda naman ay may 470,000 lalaking bumubunot ng tabak.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “isang libong mga libo at isang daang libo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִסְפַּר מִפְקַד הָעָם
  choice: ang bilang na nakuha sa sensus ng bayan
  rationale: Pinananatili nito ang diwa ng parehong מִסְפַּר ('bilang') at מִפְקַד ('sensus/pagtatala') sa likas at malinaw na Tagalog.
- source_word: וַיְהִי כָל יִשְׂרָאֵל
  choice: Ang kabuuang bilang sa Israel ay
  rationale: Ipinahahayag ng parirala ang kinalabasang kabuuan; malinaw sa Tagalog ang kolektibong kahulugan nang hindi ipinapalagay na lugar lamang o bawat indibidwal ang tinutukoy.
- source_word: אֶלֶף אֲלָפִים וּמֵאָה אֶלֶף
  choice: 1,100,000
  rationale: Mas madaling basahin ang malaking bilang sa numerong Arabe, habang inilalagay sa talababa ang literal na anyo ng Hebreo.
- source_word: אִישׁ
  choice: lalaking
  rationale: Sa konteksto ng sensus militar, tumutukoy ito sa mga lalaking kabilang sa puwersang pandigma.
- source_word: שֹׁלֵף חֶרֶב
  choice: humuhugot ng tabak
  rationale: Pinananatili ang matingkad at literal na idyomang Hebreo na 'humuhugot/bumubunot ng tabak' sa halip na gawing pangkalahatang 'may sandata.'
- source_word: וִיהוּדָה
  choice: at sa Juda ay
  rationale: Likas na ipinagpapatuloy sa Tagalog ang ikalawang kabuuan, na ang pandiwang diwa ay mula sa naunang sugnay.
- source_word: אַרְבַּע מֵאוֹת וְשִׁבְעִים אֶלֶף
  choice: 470,000
  rationale: Malinaw at natural sa modernong Tagalog ang paggamit ng numerong Arabe para sa malaking bilang.
