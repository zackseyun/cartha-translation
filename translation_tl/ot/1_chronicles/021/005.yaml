translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal ang ginamit. Pinanatili ang terminong “sensus” dahil karaniwan at tiyak ito sa kasalukuyang gamit, at ang “humuhugot ng tabak” upang maingatan ang kongkretong larawang militar ng Hebreo.
