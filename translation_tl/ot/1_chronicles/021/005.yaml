revisions:
- from: Ibinigay ni Joab kay David ang bilang na nakuha sa sensus ng bayan. Ang kabuuang bilang sa Israel ay 1,100,000[a] lalaking humuhugot ng tabak, at sa Juda ay 470,000 lalaking humuhugot ng tabak.
  to: Ibinigay ni Joab kay David ang bilang ng sensus ng mga tao. Sa buong Israel ay may 1,100,000[a] lalaking bumubunot ng tabak; sa Juda naman ay may 470,000 lalaking bumubunot ng tabak.
  rationale: Inalis ang dagdag na implikasyong “nakuha,” ginawang mas tapat ang pagpapahayag ng dalawang pangngalan sa Hebreo, at pinalitan ang posibleng heograpikal na “kabuuang bilang sa Israel” ng mas tuwirang “Sa buong Israel.” Pinanatili ang footnote anchor at ang literal na pagpapaliwanag sa anyo ng malaking bilang.
