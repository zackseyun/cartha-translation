base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/010.yaml
  text: 'Go and speak to David[a], saying, ‘Thus says Yahweh: I am setting three things before you. Choose one of them for yourself, and I will do it to you.’'
translation:
  language: tl
  text: '“Humayo ka at kausapin mo si David. Sabihin mo, ‘Ganito ang sabi ni Yahweh: Tatlo ang inilalagay ko sa harap mo.[a] Pumili ka para sa iyong sarili ng isa sa mga iyon, at gagawin ko iyon sa iyo.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “Tatlo ang iniuunat/inilalagay ko sa ibabaw mo.” Hindi binabanggit sa Hebreo kung ano ang tatlo; sa konteksto, tatlong mapagpipilian ang inilalagay sa harap ni David.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵךְ
  choice: Humayo ka
  rationale: Tuwirang pautos na anyo ng הלך. Ang “humayo” ay dignificado at malinaw sa makabagong Filipino.
- source_word: וְדִבַּרְתָּ אֶל דָּוִיד
  choice: at kausapin mo si David
  rationale: Pinananatili ang diwa ng דבר אֶל bilang pagsasalita sa isang tao, sa natural na Filipino.
- source_word: לֵאמֹר
  choice: Sabihin mo
  rationale: Natural na pambungad sa tuwirang sipi at ipinapahayag ang utos na ihatid ang mensahe.
- source_word: כֹּה אָמַר יְהוָה
  choice: Ganito ang sinabi ni Yahweh
  rationale: Pinananatili ang pormula ng mensaherong propetiko at ang pangalang tipan na Yahweh.
- source_word: שָׁלוֹשׁ אֲנִי נֹטֶה עָלֶיךָ
  choice: Tatlo ang inilalagay ko sa harap mo
  rationale: Hindi tinutukoy ng Hebreo ang pangngalan matapos ang “tatlo.” Iniiwasang idagdag sa teksto ang “bagay,” “parusa,” o “pagpipilian,” habang ipinahihiwatig ng “inilalagay ... sa harap mo” ang kontekstuwal na diwa ng נֹטֶה.
- source_word: בְּחַר לְךָ אַחַת מֵהֵנָּה
  choice: Pumili ka para sa iyong sarili ng isa sa mga iyon
  rationale: Ang “para sa iyong sarili” ay kumakatawan sa לְךָ, at ang “isa sa mga iyon” ay malinaw na partitive na katumbas ng אַחַת מֵהֵנָּה.
- source_word: וְאֶעֱשֶׂה לָּךְ
  choice: at gagawin ko iyon sa iyo
  rationale: Sa kontekstong may kaparusahan, ang לָךְ ay pinakamainam na unawaing “sa iyo,” nang hindi dinaragdagan ng mas interpretibong “ipapataw.”
theological_decisions:
- issue: Pagbibigay-kahulugan sa banal na pangalan na יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang pinananatili ang natatanging banal na pangalan sa tekstong Hebreo.
- issue: Hindi binanggit na bagay na tinutukoy ng “tatlo”
  choice: 'Panatilihing walang tahasang pangngalan: “Tatlo ang inilalagay ko sa harap mo”'
  alternative: tatlong bagay; tatlong pagpipilian; tatlong parusa
  rationale: Hindi binabanggit ng Hebreo ang bagay na tinutukoy. Pinananatili ng salin ang tunay na kakulangan ng pagtukoy at hindi inuunahan ang paglilinaw sa kasunod na talata.
translation_notes:
  register: Makabago, malinaw, at dignifikadong Filipino. Ginamit ang “humayo” para sa biblikal ngunit nauunawaang tono; iniwasan ang labis na arkaikong balangkas. Pinanatili ang bahagyang di-likas na “Tatlo ang...” upang maingatan ang sinadyang kawalan ng tahasang pangngalan sa Hebreo.
