  text: וּ/דְבַר הַ/מֶּ֖לֶךְ חָזַ֣ק עַל יוֹאָ֑ב וַ/יֵּצֵ֣א יוֹאָ֗ב וַ/יִּתְהַלֵּךְ֙ בְּ/כָל יִשְׂרָאֵ֔ל וַ/יָּבֹ֖א יְרוּשָׁלִָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/004.yaml
  text: But the king’s word prevailed against Joab[a]. So Joab went out and went throughout all Israel[b], and he came to Jerusalem.
translation:
  language: tl
  text: Ngunit nanaig kay Joab ang utos ng hari.[a] Kaya umalis si Joab at naglakbay sa buong Israel,[b] at pagkatapos ay dumating siya sa Jerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “salita ng hari.”
    reason: lexical_alternative
  - marker: b
    text: O “nag-ikot sa buong Israel.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּדְבַר הַמֶּלֶךְ
  choice: Ngunit ... ang utos ng hari
  rationale: Sa konteksto, ang דְבַר ay tumutukoy sa makapangyarihang ipinag-utos ng hari. Mas natural at malinaw sa modernong Tagalog ang “utos” kaysa literal na “salita,” habang ang “Ngunit” ay nagpapanatili ng pagsalungat sa pagtutol ni Joab sa naunang talata.
- source_word: חָזַק עַל יוֹאָב
  choice: nanaig kay Joab
  rationale: Ipinahahayag ng idyomang חָזַק עַל na nalampasan ng pasya ng hari ang pagtutol ni Joab. Ang “nanaig kay” ay natural at hindi labis na nagpapaliwanag.
- source_word: וַיֵּצֵא יוֹאָב
  choice: Kaya umalis si Joab
  rationale: Ang יָצָא ay karaniwang nangangahulugang lumabas o umalis. Ipinakikita ng “Kaya” na bunga ito ng pangingibabaw ng utos ng hari.
- source_word: וַיִּתְהַלֵּךְ בְּכָל יִשְׂרָאֵל
  choice: naglakbay sa buong Israel
  rationale: Ang anyong hitpael ng הָלַךְ dito ay nagpapahiwatig ng pag-iikot o paglalakbay sa isang malawak na lugar. Ang “naglakbay sa buong Israel” ay malinaw at natural nang hindi nagdaragdag ng di-tahasang detalye tungkol sa sensus.
- source_word: וַיָּבֹא יְרוּשָׁלִָם
  choice: at pagkatapos ay dumating siya sa Jerusalem
  rationale: Ang בּוֹא ay “dumating/pumasok.” Hindi ginamit ang “bumalik” dahil bagaman ipinahihiwatig iyon ng salaysay, “dumating” lamang ang tahasang sinasabi ng Hebreo. Ang “pagkatapos” ay nagpapalinaw sa sunod-sunod na kilos.
theological_decisions: []
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinili ang “utos” sa pangunahing teksto para sa likas na kahulugan sa konteksto, ngunit inilagay sa talababa ang literal na “salita.” Ang pangungusap ay nagpapanatili sa maikli at tuwirang daloy ng salaysay sa Hebreo.
