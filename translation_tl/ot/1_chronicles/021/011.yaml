base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/011.yaml
  text: So Gad came to David and said to him[a], “Thus says Yahweh, ‘Choose for yourself—’”
translation:
  language: tl
  text: 'Dumating si Gad kay David at sinabi sa kanya, “Ganito ang sabi ni Yahweh: ‘Pumili ka para sa iyong sarili[a]—’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O mas literal, “Tanggapin mo para sa iyong sarili—”; sa konteksto, ang diwa ay pumili sa mga pagpipiliang ilalahad sa kasunod na talata.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: pumunta
  rationale: Karaniwang pandiwang pasalaysay mula sa בוא na nagsasaad ng paglapit sa isang tao; natural sa Tagalog ang “pumunta ... kay David.”
- source_word: גָד
  choice: Gad
  rationale: Pangalan ng tao; pinanatili sa karaniwang transliterasyon.
- source_word: אֶל דָּוִיד
  choice: kay David
  rationale: Ang אֶל ay nagsasaad ng patungong direksiyon; “kay” ang likas na pananda sa Tagalog kapag tao ang nilalapitan.
- source_word: וַיֹּאמֶר לוֹ
  choice: sinabi sa kanya
  rationale: Tuwirang inilalarawan ang אמר na may di-tuwirang layon; hindi dinaragdagan ang kahulugan gaya ng maaaring gawin ng “ipinaalam.”
- source_word: כֹּה אָמַר
  choice: Ganito ang sinabi
  rationale: Likas at marangal na salin ng pormulang pangmensahero; pinananatili ang aspektong ganap ng אָמַר nang hindi ginagawang labis na pormal ang Filipino.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang transliterasyon ng banal na pangalang יהוה, sa halip na palitan ito ng isang titulo.
- source_word: קַבֶּל
  choice: Pumili
  rationale: Bagaman pangunahing nangangahulugang “tanggapin,” ipinakikita ng kasunod na konteksto na inuutusan si David na pumili sa mga ihaharap na kaparusahan. Inilalagay sa talababa ang mas literal na kahulugan.
- source_word: לָךְ
  choice: para sa iyong sarili
  rationale: Pinananatili ang pansariling diin ng datibong panghalip, bagaman medyo mas tahasan ito kaysa sa simpleng “pumili ka.”
theological_decisions:
- issue: Pagbibigay ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehova
  rationale: Pangalan mismo ang nasa tekstong Hebreo, kaya pinananatili itong pangalan sa transliterasyong “Yahweh” at hindi pinapalitan ng titulo.
- issue: Kahulugan ng utos na קַבֶּל
  choice: Pumili
  alternative: Tanggapin
  rationale: Ang agarang pagpapatuloy sa susunod na talata ay naglalahad ng mga pagpipilian. Gayunman, hindi ikinukubli ang literal na saklaw na “tanggapin,” kaya itinatala ito sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “pumunta ... kay” bilang natural na salaysay, at pinanatili ang pormulang “Ganito ang sinabi ni Yahweh.” Ang gitling sa dulo ay nagpapakitang nagpapatuloy ang pahayag sa kasunod na talata.
