revisions:
- from: Ipinadala ng Diyos ang isang anghel sa Jerusalem upang lipulin ito. Ngunit habang nililipol niya ito, nakita iyon ni Yahweh at nagbago ang pasiya niya tungkol sa kapahamakan.[a] Sinabi niya sa anghel na naglilipol, “Tama na! Iurong mo na ang iyong kamay.”[b] Ang anghel ni Yahweh ay nakatayo noon sa tabi ng giikan ni Ornan na Jebuseo.
  to: Ipinadala ng Diyos ang isang anghel sa Jerusalem upang lipulin ito. Ngunit habang nililipol niya ito, nakita ni Yahweh at nagbago ang pasiya niya tungkol sa kapahamakan.[a] Sinabi niya sa anghel na naglilipol, “Tama na! Iurong mo na ang iyong kamay.”[b] At ang anghel ni Yahweh ay nakatayo noon sa tabi ng giikan ni Ornan na Jebuseo.
  rationale: Inalis ang “iyon” pagkatapos ng “nakita” upang mapanatili ang di-tinukoy na layon ng Hebreo at mapahusay ang natural na daloy sa modernong Filipino. Idinagdag ang “At” sa huling pangungusap upang katawanin ang pang-ugnay na וְ nang hindi binabago ang kahulugan. Pinanatili ang iba pang salin at mga talababa dahil tapat, malinaw, at hindi nagpapataw ng teolohikal na pagpapasya.
