source:
  edition: WLC
  text: וַ/יִּשְׁלַח֩ הָ/אֱלֹהִ֨ים מַלְאָ֥ךְ לִֽ/ירוּשָׁלִַם֮ לְ/הַשְׁחִיתָ/הּ֒ וּ/כְ/הַשְׁחִ֗ית רָאָ֤ה יְהוָה֙ וַ/יִּנָּ֣חֶם עַל הָֽ/רָעָ֔ה וַ/יֹּ֨אמֶר לַ/מַּלְאָ֤ךְ הַ/מַּשְׁחִית֙ רַ֔ב עַתָּ֖ה הֶ֣רֶף יָדֶ֑/ךָ וּ/מַלְאַ֤ךְ יְהוָה֙ עֹמֵ֔ד עִם גֹּ֖רֶן אָרְנָ֥ן הַ/יְבוּסִֽי׀׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/015.yaml
  text: And God sent an angel to Jerusalem to destroy it[a], but as he was destroying it, Yahweh saw and relented concerning the calamity, and he said to the destroying angel, “Enough[b]; now withdraw your hand.” And the angel of Yahweh was standing by the threshing floor of Ornan the Jebusite.
translation:
  language: tl
  text: Ipinadala ng Diyos ang isang anghel sa Jerusalem upang lipulin ito. Ngunit habang nililipol niya ito, nakita ni Yahweh at nagbago ang pasiya niya tungkol sa kapahamakan.[a] Sinabi niya sa anghel na naglilipol, “Tama na! Iurong mo na ang iyong kamay.”[b] At ang anghel ni Yahweh ay nakatayo noon sa tabi ng giikan ni Ornan na Jebuseo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “kapahamakan” ay maaari ring isaling “sakuna.” Ang salitang Hebreo rito ay tumutukoy sa mapaminsalang hatol, hindi sa moral na kasamaan.
    reason: lexical_alternative
  - marker: b
    text: Sa idyomang Hebreo, ang pag-urong o pagpapahinga ng kamay ay nangangahulugang paghinto sa isinasagawang pagkilos.
    reason: idiom_clarification
lexical_decisions:
- source_word: הָאֱלֹהִים
  choice: Diyos
  rationale: Ang tiyak na pantukoy at ang isahang konteksto ay tumutukoy sa Diyos ng Israel; “Diyos” ang likas na salin sa Tagalog.
- source_word: מַלְאָךְ
  choice: anghel
  rationale: Sa kontekstong ito ng makalangit na tagapagpatupad ng hatol na isinugo ng Diyos, mas tiyak ang “anghel” kaysa sa pangkalahatang “mensahero.”
- source_word: לִירוּשָׁלִַם לְהַשְׁחִיתָהּ
  choice: sa Jerusalem upang lipulin ito
  rationale: Pinananatili ng “sa Jerusalem” ang direksiyon ng pagkilos, at malinaw na ipinahahayag ng “upang lipulin ito” ang layunin ng pagsusugo.
- source_word: וּכְהַשְׁחִית
  choice: Ngunit habang nililipol niya ito
  rationale: Ipinahihiwatig ng konstruksiyon ang kasabay at nagpapatuloy na kilos na nahinto; ang “ngunit” ay natural na naghuhudyat ng pagbabago sa salaysay.
- source_word: וַיִּנָּחֶם עַל הָרָעָה
  choice: nagbago ang pasiya niya tungkol sa kapahamakan
  rationale: Pinananatili nito ang tahasang paglalarawan ng teksto na tumugon ang Diyos at hindi itinuloy ang hatol, nang hindi ipinapakahulugang moral na kasamaan ang רָעָה o nilulutas ang teolohikal na tensiyon.
- source_word: הַמַּלְאָךְ הַמַּשְׁחִית
  choice: anghel na naglilipol
  rationale: Natural sa Tagalog ang sugnay na ito at pinananatili nito ang aktibong diwa ng participle.
- source_word: רַב
  choice: Tama na!
  rationale: Maikli at likas na padamdam ito para sa kahulugang “sapat na” o “itigil na.”
- source_word: הֶרֶף יָדֶךָ
  choice: Iurong mo na ang iyong kamay
  rationale: Pinananatili ang larawan ng kamay habang malinaw na ipinahihiwatig ang paghinto sa mapaminsalang pagkilos.
- source_word: גֹּרֶן אָרְנָן הַיְבוּסִי
  choice: giikan ni Ornan na Jebuseo
  rationale: Ang “giikan” ang karaniwang tawag sa threshing floor, at ang “Jebuseo” ay natural na anyong Tagalog ng pangkat-etniko.
theological_decisions:
- issue: Paglalarawan sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Tuwirang pinananatili ng “Yahweh” ang personal na pangalang nasa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- issue: Antropopatikong pananalita sa וַיִּנָּחֶם עַל הָרָעָה
  choice: nagbago ang pasiya niya tungkol sa kapahamakan
  alternative: nahabag siya dahil sa kapahamakan; hindi na niya itinuloy ang kapahamakan
  rationale: Pinananatili ng salin ang paglalarawan ng teksto sa pagtugon ng Diyos sa loob ng salaysay at hindi ito pinapaliwanag ayon sa isang pilosopikal o denominasyonal na sistema.
- issue: Pagkakakilanlan ng מַלְאַךְ יְהוָה
  choice: ang anghel ni Yahweh
  alternative: si Yahweh sa anyong anghel; isang nilikhang anghel
  rationale: Literal na isinasalin ang parirala nang hindi nagpapasiya sa pinagtatalunang ontolohikal na pagkakakilanlan ng tauhan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “lipulin” para sa matinding mapaminsalang kilos, “giikan” bilang pamilyar na terminong agrikultural, at “ni Yahweh” bilang natural na konstruksiyon sa Tagalog. Iniwasan ang masyadong arkaikong pananalita at ang anumang paliwanag na magpapasya sa teolohikal na tensiyong hindi nilulutas ng talata.
