base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/002.yaml
  text: Then David said to Joab and to the commanders of the people[a], “Go, count Israel from Beersheba to Dan, and bring it to me, so that I may know their number.”
translation:
  language: tl
  text: Pagkatapos, sinabi ni David kay Joab at sa mga pinuno ng bayan, “Humayo kayo at bilangin ang Israel mula sa Beer-seba hanggang Dan[a], at dalhin ninyo sa akin ang bilang upang malaman ko kung ilan sila.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “mula sa Beer-seba hanggang Dan” ay idyomang Hebreo na nangangahulugang mula sa isang dulo ng Israel hanggang sa kabilang dulo.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Pagkatapos, sinabi
  rationale: Isinusulong ng waw-consecutive ang salaysay; natural sa makabagong Filipino ang “Pagkatapos” bilang panandang sunod na pangyayari.
- source_word: שָׂרֵי הָעָם
  choice: mga pinuno ng bayan
  rationale: Maaaring tumukoy ang שָׂרִים sa mga pinuno, opisyal, o kumander. Pinananatili ng “mga pinuno” ang lawak ng kahulugan at hindi labis na nililimitahan ito sa militar.
- source_word: לְכוּ
  choice: Humayo kayo
  rationale: Tuwirang pautos na maramihan; dignified at malinaw sa Filipino, at ang “kayo” ay nagpapakita ng bilang.
- source_word: סִפְרוּ
  choice: bilangin
  rationale: Ang ספר sa kontekstong ito ay pagbilang o pagtatala ng populasyon. Ang “bilangin” ay tuwiran at hindi nagdaragdag ng teknikal na detalye.
- source_word: אֶת יִשְׂרָאֵל
  choice: ang Israel
  rationale: Pinananatili ang kolektibong katawagan ng Hebreo para sa bansa o sambayanan nang walang paliwanag na idinagdag sa pangunahing teksto.
- source_word: מִבְּאֵר שֶׁבַע וְעַד דָּן
  choice: mula sa Beer-seba hanggang Dan
  rationale: Pinananatili ang mga heograpikong hangganan at ang idyomang tumutukoy sa buong lawak ng Israel; ipinaliliwanag ito sa talababa.
- source_word: וְהָבִיאוּ אֵלַי
  choice: Pagkatapos, dalhin ninyo sa akin ang bilang
  rationale: Literal na “dalhin ninyo sa akin,” na may ipinahihiwatig na bagay. Nililinaw ng “ang bilang” ang natural na tinutukoy sa konteksto nang hindi ito ginagawang mas tiyak kaysa kinakailangan.
- source_word: וְאֵדְעָה אֶת מִסְפָּרָם
  choice: upang malaman ko kung ilan sila
  rationale: Ipinahahayag ng cohortative ang layunin o nais na resulta. Natural sa Filipino ang “upang malaman ko,” at malinaw na naihahatid ng “kung ilan sila” ang kanilang bilang.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mga pinuno” sa halip na “mga kumander” upang mapanatili ang posibleng administratibo at militar na saklaw ng terminong Hebreo. Inilipat ang talababa sa mismong idyomang heograpiko upang malinaw ang tinutukoy nito.
