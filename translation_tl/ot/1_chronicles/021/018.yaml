id: 1CH.21.18
reference: 1 Chronicles 21:18
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וּ/מַלְאַ֧ךְ יְהוָ֛ה אָמַ֥ר אֶל גָּ֖ד לֵ/אמֹ֣ר לְ/דָוִ֑יד כִּ֣י יַעֲלֶ֣ה דָוִ֗יד לְ/הָקִ֤ים מִזְבֵּ֨חַ֙ לַ/יהוָ֔ה בְּ/גֹ֖רֶן אָרְנָ֥ן הַ/יְבֻסִֽי־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/018.yaml
  text: And the angel of Yahweh said to Gad to tell David that David should go up to set up an altar to Yahweh on the threshing floor of Ornan the Jebusite[a][b].
translation:
  language: tl
  text: At sinabi ng anghel ni Yahweh[a] kay Gad na sabihin kay David na umakyat si David[b] upang magtayo ng isang altar para kay Yahweh sa giikan ni Ornan na Jebuseo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “mensahero ni Yahweh.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “na dapat umakyat si David” o “na kailangang umakyat si David.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מַלְאַךְ יְהוָה
  choice: At ang anghel ni Yahweh
  rationale: Maaaring mangahulugan ang מַלְאַךְ na “mensahero” o “anghel.” Sa konteksto ng salaysay, isang makalangit na nilalang ang tinutukoy, kaya “anghel” ang likas na pangunahing salin; pinanatili ang “mensahero” sa talababa.
- source_word: אָמַר אֶל גָּד
  choice: sinabi ... kay Gad
  rationale: Tuwirang salin ito ng karaniwang pandiwang אָמַר at natural sa modernong Tagalog.
- source_word: לֵאמֹר לְדָוִיד
  choice: na sabihin kay David
  rationale: Ipinakikilala ng לֵאמֹר kasama ng di-tuwirang layon ang mensaheng ipararating; malinaw at natural sa Tagalog ang “na sabihin kay David.”
- source_word: כִּי יַעֲלֶה דָוִיד
  choice: na umakyat si David
  rationale: Pinananatili ng “umakyat” ang literal na direksiyong ipinahihiwatig ng עלה. Sa balangkas na “sinabi ... na sabihin,” may puwersa itong utos nang hindi pinipili nang tahasan sa pagitan ng “dapat” at “kailangang.”
- source_word: לְהָקִים
  choice: upang magtayo
  rationale: Ang הקים ay “magtindig, magtayo, magtatag.” Ang “magtayo” ang natural na gamit para sa altar, at ipinakikita ng “upang” ang layunin ng pag-akyat.
- source_word: מִזְבֵּחַ
  choice: isang altar
  rationale: Karaniwan at malinaw na salin ng מִזְבֵּחַ ang “altar.”
- source_word: לַיהוָה
  choice: para kay Yahweh
  rationale: Ipinahihiwatig ng lamed ang pag-aalay o pagtatalaga ng altar kay Yahweh; natural sa Tagalog ang “para kay Yahweh.”
- source_word: בְּגֹרֶן
  choice: sa giikan
  rationale: Ang גֹרֶן ay lugar na pinaggigiikan; ang “giikan” ang maikli at karaniwang katumbas sa Tagalog.
- source_word: אָרְנָן הַיְבֻסִי
  choice: ni Ornan na Jebuseo
  rationale: Pinanatili ang pangalang Ornan at isinalin ang katawagang etniko bilang “Jebuseo”; ipinakikita ng “ni” na kay Ornan ang giikan.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang ginagamit sa talata ang Tetragrammaton. Pinananatili ng “Yahweh” ang natatanging pangalang tipan sa halip na palitan ito ng isang titulo.
- issue: Puwersa ng tagubiling כִּי יַעֲלֶה דָוִיד
  choice: na umakyat si David
  alternative: na dapat umakyat si David; na kailangang umakyat si David
  rationale: Ang sugnay ay nilalaman ng utos na ipararating, ngunit hindi kailangang gawing tahasan ng salin kung “dapat” o “kailangang” ang modal na diin. Pinananatili ng pangunahing salin ang puwersang direktibo at ang tunay na saklaw ng kahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “giikan,” isang maikli at tumpak na salitang biblikal na nauunawaan sa konteksto. Pinanatili ang pag-uulit ng pangalang David upang sundan ang diin at kayarian ng Hebreo.
