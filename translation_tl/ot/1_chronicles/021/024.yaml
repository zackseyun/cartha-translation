  to: Ngunit sinabi ni Haring David kay Ornan, “Hindi! Talagang bibilhin ko ito at babayaran nang buo sa pilak, sapagkat hindi ko kukunin para kay Yahweh ang pag-aari mo, ni maghahandog ng handog na sinusunog nang walang gugol.”
