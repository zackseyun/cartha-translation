base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/024.yaml
  text: But King David said to Ornan[a], “No, for I will surely buy it for the full price in silver, because I will not take for Yahweh what is yours[b], nor offer up a burnt offering for nothing.”
translation:
  language: tl
  text: Ngunit sinabi ni Haring David kay Ornan, “Hindi! Talagang bibilhin ko ito at babayaran nang buo sa pilak, sapagkat hindi ko kukunin para kay Yahweh ang pag-aari mo, ni maghahandog ng handog na sinusunog nang walang gugol.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֹא כִּי
  choice: Hindi! … sapagkat
  rationale: Ipinahahayag nito ang mariing pagtanggi at saka ang dahilan; natural sa modernong Tagalog ang paghihiwalay bilang padamdam.
- source_word: קָנֹה אֶקְנֶה
  choice: Talagang bibilhin ko
  rationale: Ang infinitive absolute na kasunod ng finite verb ay nagpapalakas sa katiyakan ng kilos.
- source_word: בְּכֶסֶף מָלֵא
  choice: sa buong halaga nito sa pilak
  rationale: Tumutukoy ito sa ganap na kabayaran, at pinananatili rin ang pilak bilang paraan ng pagbabayad.
- source_word: אֶשָּׂא
  choice: kukunin
  rationale: Sa konteksto, ang pandiwa ay nangangahulugang angkinin o tanggapin ang pag-aari ng iba.
- source_word: אֲשֶׁר לְךָ
  choice: ang pag-aari mo
  rationale: Malinaw at natural na pagpapahayag ng pagmamay-ari sa Tagalog.
- source_word: לַיהוָה
  choice: para kay Yahweh
  rationale: Ipinahihiwatig ng parirala ang paglalaan sa Diyos; pinananatili ang pangalang tipan na Yahweh.
- source_word: וְהַעֲלוֹת עוֹלָה
  choice: ni maghahandog ako ng handog na sinusunog
  rationale: Ang negatibong saklaw ng naunang לֹא ay likas na nagpapatuloy sa ikalawang kilos; inilalarawan ang עֹלָה bilang handog na sinusunog.
- source_word: חִנָּם
  choice: nang walang bayad
  rationale: Sa kontekstong pangkalakalan, malinaw nitong ipinahahayag na hindi binayaran ang ihahandog.
theological_decisions:
- issue: Pagbigkas sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Tuwirang ginagamit sa Hebreo ang Tetragrammaton; ang transliterasyong “Yahweh” ay nagpapanatili rito bilang pangalang pantangi.
- issue: Ugnayan ng pagkuha ng ari-arian at paghahandog
  choice: Pinanatiling magkaagapay ang “hindi ko kukunin … ni maghahandog”
  alternative: Ipaliwanag na ang pagkuha ang tanging ipinagbabawal at ang paghahandog ay bunga lamang nito
  rationale: Hinahayaan ng anyo ng Hebreo na manatili ang retorikal na pagkakaugnay ng dalawang kilos nang hindi nagpapasok ng dagdag na interpretasyong teolohikal.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “handog na sinusunog” bilang malinaw na katawagan sa עֹלָה, at iniwasan ang sobrang teknikal o denominasyonal na pananalita.
