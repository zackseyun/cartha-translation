id: 1CH.21.9
reference: 1 Chronicles 21:9
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יְדַבֵּ֤ר יְהוָה֙ אֶל גָּ֔ד חֹזֵ֥ה דָוִ֖יד לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/009.yaml
  text: And Yahweh spoke to Gad[a], David’s seer, saying,
translation:
  language: tl
  text: At nagsalita si Yahweh[a] kay Gad, na tagakita ni David, at sinabi niya,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: YHWH; maaari ring isalin na “Jehovah.”'
    reason: Ipinababatid ang anyong Hebreo ng banal na pangalan at ang isa pang kinikilalang transliterasyon.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: At nagsalita
  rationale: Inilalahad ng waw-consecutive ang kasunod na pangyayari sa salaysay, at tuwirang tinutumbasan ng “nagsalita” ang דּבר.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na banal na pangalan sa pamamagitan ng karaniwang transliterasyong “Yahweh,” sa halip na palitan ito ng isang titulo.
- source_word: אֶל־גָּד
  choice: kay Gad
  rationale: Ang אֶל ay tumutukoy sa taong kinausap; likas itong ipahayag sa Tagalog sa pamamagitan ng “kay.”
- source_word: חֹזֵה דָוִיד
  choice: tagakita ni David
  rationale: Ang “tagakita” ay tuwirang tumutukoy sa taong tumatanggap ng kapahayagan sa pamamagitan ng pangitain at pinananatili ang kaibhan nito sa mas malawak na katawagang “propeta.” Ang anyong “ni David” ay natural na naghahayag ng ugnayang construct.
- source_word: לֵאמֹר
  choice: at sinabi niya
  rationale: Ipinakikilala ng pormulang ito ang tuwirang pananalitang kasunod. Ang “at sinabi niya” ay natural sa modernong Tagalog at malinaw na si Yahweh pa rin ang nagsasalita.
theological_decisions:
- issue: Paglalarawan sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; ang PANGINOON
  rationale: Personal na pangalan ang tahasang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang pangalan sa halip na palitan ito ng titulo, nang hindi nagdaragdag ng denominasyonal na pagpapakahulugan.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “tagakita” upang mapanatili ang tiyak na kahulugan ng חֹזֵה at hindi ito gawing pangkalahatang “propeta.” Inilipat ang marker sa “Yahweh,” sapagkat ang talababa ay tungkol sa banal na pangalan, hindi kay Gad.
