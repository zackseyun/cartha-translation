base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/001.yaml
  text: Then Satan stood up against Israel and incited David to count Israel[a][b].
translation:
  language: tl
  text: Pagkatapos, tumindig si Satanas laban sa Israel at inudyukan niya si David na bilangin ang Israel.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O kaya, “isang kalaban.” Ang salitang Hebreo na satan ay maaaring mangahulugang “kalaban” o gamitin bilang personal na pangalan o titulong “Satanas.”
    reason: lexical_alternative
  - marker: b
    text: Sa 2 Samuel 24:1, ang pag-uudyok ay iniuugnay sa galit ng PANGINOON laban sa Israel. Sa Cronica, si Satanas ang ipinakikitang agarang tagapag-udyok; pinananatili nito ang teolohikal na tensiyon sa pagitan ng dalawang salaysay sa halip na ipagpareho ang mga ito.
    reason: cross_reference
lexical_decisions:
- source_word: וַיַּעֲמֹד
  choice: tumindig
  rationale: Pinananatili nito ang konkretong larawan ng pandiwang עמד, na nangangahulugang tumayo o pumuwesto, at likas ding nagpapahiwatig ng pagharap nang may pagkontra sa kontekstong ito.
- source_word: שָׂטָן
  choice: Satanas
  rationale: Bagaman maaaring mangahulugan ang salitang Hebreo ng isang karaniwang 'kalaban,' malamang na ginagamit ito rito bilang personal na katawagan. Inilalagay sa talababa ang tunay na alternatibong leksikal.
- source_word: עַל יִשְׂרָאֵל
  choice: laban sa Israel
  rationale: Sa konteksto ng pagkontra, malinaw at natural na ipinahahayag ng 'laban sa' ang gamit ng עַל.
- source_word: וַיָּסֶת
  choice: inudyukan niya
  rationale: Ang Hiphil ng סות ay nagsasaad ng pag-udyok o paghikayat tungo sa isang kilos nang hindi kinakailangang magpahiwatig ng lubos na pamimilit.
- source_word: לִמְנוֹת
  choice: na bilangin
  rationale: Tuwirang katumbas ito ng מנה at hindi pinalalawak ang diwa tungo sa mas interpretibong 'magsagawa ng sensus.'
- source_word: אֶת יִשְׂרָאֵל
  choice: ang Israel
  rationale: Pinananatili ang maikli at tuwirang layon ng Hebreo; sa konteksto, tumutukoy ito sa bayang Israel.
theological_decisions:
- issue: Pagkakakilanlan at diwa ng שָׂטָן
  choice: Satanas bilang personal na kalabang nilalang
  alternative: isang kalaban
  rationale: Maaaring tumukoy ang leksimang Hebreo sa isang karaniwang kalaban, ngunit sa kontekstong ito ay malamang na personal na katawagan ang gamit. Pinananatili sa talababa ang tunay na kalabuan sa halip na tuluyang alisin ito.
- issue: Ugnayan sa 2 Samuel 24:1
  choice: Ipakita si Satanas bilang agarang tagapag-udyok ayon sa Cronica
  alternative: Ipaliwanag ang pag-udyok bilang tuwirang gawa lamang ng galit ng PANGINOON
  rationale: Iniuugnay ng 2 Samuel 24:1 ang pag-uudyok sa galit ng PANGINOON laban sa Israel, samantalang si Satanas ang agarang kumikilos sa salaysay ng Cronica. Hindi nilulutas o pinapantay ng salin ang teolohikal na tensiyong ito.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ang 'tumindig' ay nagpapanatili ng kongkretong larawan at mapanlabang kilos; ang 'inudyukan' ay malinaw sa karaniwang mambabasa. Ginamit ang 'Israel' nang walang pagpapalawak sa 'bayang Israel' upang mapanatili ang kaiklian ng Hebreo.
