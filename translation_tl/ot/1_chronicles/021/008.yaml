  to: Pagkatapos ay sinabi ni David sa Diyos, “Lubha akong nagkasala sa ginawa kong ito. Ngunit ngayon, nakikiusap akong alisin mo ang kasalanan[a] ng iyong lingkod, sapagkat napakahangal ng ginawa ko.”
  rationale: Ginawang pandiwa ang unang pag-amin upang tapat na maipahayag ang “Ako ay lubhang nagkasala,” habang pinanatili ang natural at marangal na Tagalog. Nilinaw rin ang talababa para sa malawak na kahulugan ng עָוֹן nang hindi ipinipilit na tumukoy lamang ito sa kasalanan, guilt, o kaparusahan.
