base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/008.yaml
  text: Then David said to God[a], “I have sinned greatly in doing this thing. But now, please take away the guilt of your servant, for I have acted very foolishly.”
translation:
  language: tl
  text: Pagkatapos ay sinabi ni David sa Diyos, “Lubha akong nagkasala sa ginawa kong ito. Ngunit ngayon, nakikiusap akong alisin mo ang kasalanan[a] ng iyong lingkod, sapagkat napakahangal ng ginawa ko.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pagkakasala,” “pagiging may-sala,” o “pananagutang bunga ng pagkakasala.” Ang salitang Hebreo ay maaaring tumukoy sa masamang gawa, sa pagiging may-sala, o sa pananagutang kaakibat nito.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Pagkatapos ay sinabi
  rationale: Isinusulong ng waw-consecutive ang salaysay; likas sa modernong Tagalog ang “Pagkatapos ay” upang ipakita ang pagkakasunod-sunod.
- source_word: אֶל הָאֱלֹהִים
  choice: sa Diyos
  rationale: Tumutukoy ang אֱלֹהִים sa Diyos ng Israel; ang payak na “Diyos” ang natural na katumbas sa Tagalog.
- source_word: חָטָאתִי מְאֹד
  choice: Malubha ang pagkakasala ko
  rationale: Ipinahahayag nito ang pag-amin ni David at pinananatili ang diin ng מְאֹד nang hindi gumagamit ng lipas o di-likas na pananalita.
- source_word: אֲשֶׁר עָשִׂיתִי אֶת הַדָּבָר הַזֶּה
  choice: sa ginawa kong ito
  rationale: Iniuugnay nang tuwiran ang pagkakasala sa partikular na ginawa ni David at natural ang anyo sa Tagalog.
- source_word: וְעַתָּה
  choice: Ngunit ngayon
  rationale: Ipinakikita ang paglipat mula sa pag-amin tungo sa pakiusap.
- source_word: הַעֲבֶר נָא
  choice: nakikiusap akong alisin mo
  rationale: Ang Hiphil imperative ng עבר ay nangangahulugang alisin, at ang magalang na pakiusap ay naghahatid sa puwersa ng נָא.
- source_word: עֲוֹן
  choice: kasalanan
  rationale: Malawak ang saklaw ng salita—maaaring tumukoy sa kasamaan, pagkakasala, o pananagutang bunga nito. Ang “kasalanan” ay natural sa Tagalog, habang inilalahad sa talababa ang tunay na lawak ng kahulugan.
- source_word: עַבְדְּךָ
  choice: iyong lingkod
  rationale: Ito ay mapagpakumbabang pagtukoy ni David sa sarili sa harap ng Diyos; “lingkod” ang angkop kaysa “alipin” sa kontekstong ito.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala nito ang dahilan ng pakiusap at angkop sa marangal na rehistro.
- source_word: נִסְכַּלְתִּי מְאֹד
  choice: napakahangal ng ginawa ko
  rationale: Ipinahihiwatig ng pandiwa ang hangal na pagkilos, hindi lamang isang katangian; pinananatili ng “napaka-” ang diin ng מְאֹד.
theological_decisions:
- issue: Kahulugan ng עָוֹן sa pakiusap ni David
  choice: Isinalin bilang “kasalanan,” na may talababa tungkol sa “bigat ng pagkakasala” at pananagutan.
  alternative: “pagkakasala,” “bigat ng pagkakasala,” o “parusa dahil sa kasalanan”
  rationale: Hindi ganap na nilulutas ng konteksto kung ang diin ay nasa masamang gawa, sa kalagayan ng pagiging may-sala, o sa pananagutang kaakibat nito. Pinananatili ng pangunahing salin at talababa ang saklaw na ito nang hindi nililimitahan sa kaparusahan lamang.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang tuwirang pag-amin at pakiusap, iniwasan ang masyadong arkaikong mga anyo, at pinanatili sa talababa ang lawak ng kahulugan ng עָוֹן.
