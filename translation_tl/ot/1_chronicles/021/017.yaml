revisions:
- from: Pagkatapos, sinabi ni David sa Diyos, “Hindi ba ako ang nag-utos na bilangin ang bayan?[a] Ako ang nagkasala at gumawa ng napakasama. Ngunit ang mga tupang ito—ano ang ginawa nila?[b] O Yahweh na aking Diyos, nakikiusap ako, ang kamay mo nawa ay laban sa akin at sa sambahayan ng aking ama,[c] ngunit huwag mong padalhan ng salot ang iyong bayan.”[d]
  to: Pagkatapos, sinabi ni David sa Diyos, “Hindi ba ako ang nag-utos na bilangin ang bayan?[a] Ako ang nagkasala at gumawa ng napakasama. Ngunit ang mga tupang ito—ano ang ginawa nila?[b] O Yahweh na aking Diyos, nakikiusap ako, ang kamay mo nawa ay laban sa akin at sa sambahayan ng aking ama,[c] ngunit huwag mong parusahan ng salot ang iyong bayan.”[d]
