base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/017.yaml
  text: Then David said to God[a], “Was it not I who ordered the people to be counted? I am the one who has sinned and done great evil. But these sheep—what have they done? O Yahweh my God, please let your hand be against me and against my father’s house[d][c][b], but not against your people for a plague.”
translation:
  language: tl
  text: Pagkatapos, sinabi ni David sa Diyos, “Hindi ba ako ang nag-utos na bilangin ang bayan?[a] Ako ang nagkasala at gumawa ng napakasama. Ngunit ang mga tupang ito—ano ang ginawa nila?[b] O Yahweh na aking Diyos, nakikiusap ako, ang kamay mo nawa ay laban sa akin at sa sambahayan ng aking ama,[c] ngunit huwag mong parusahan ng salot ang iyong bayan.”[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “Hindi ba ako ang nagsabing bilangin ang bayan?”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “ang mga tupang ito,” isang talinghaga para sa bayan.
    reason: cultural_note
  - marker: c
    text: Maaari ring isalin, “mapasaakin at sa sambahayan ng aking ama ang kamay mo.” Ang “kamay” ay isang Hebreong larawan para sa aktibong kapangyarihan o paghatol.
    reason: lexical_alternative
  - marker: d
    text: 'Mas literal: “ngunit hindi laban sa iyong bayan para sa salot,” o “ngunit huwag laban sa iyong bayan upang magkaroon ng salot.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֱלֹהִים
  choice: Diyos
  rationale: Tumutukoy sa Diyos ng Israel; natural sa Tagalog ang simpleng “Diyos” sa kontekstong ito.
- source_word: הֲלֹא
  choice: Hindi ba
  rationale: Pinananatili ang retorikal na tanong na umaasang sasang-ayon ang kausap.
- source_word: אָמַרְתִּי לִמְנוֹת בָּעָם
  choice: ako ang nag-utos na bilangin ang bayan
  rationale: Literal na “ako ang nagsabing bilangin ang bayan,” ngunit sa konteksto ay utos ni David ang nagpasimula sa sensus; malinaw at natural ang “nag-utos.”
- source_word: וַאֲנִי הוּא אֲשֶׁר
  choice: Ako ang
  rationale: Ipinapahayag ang mariing pag-ako ni David sa pananagutan nang hindi nagiging mabigat sa Tagalog.
- source_word: חָטָאתִי
  choice: nagkasala
  rationale: Direkta at natural na katumbas ng ganap na kilos sa Hebreo.
- source_word: וְהָרֵעַ הֲרֵעוֹתִי
  choice: at gumawa ng napakasama
  rationale: Ang infinitive absolute na kasunod ng pandiwa ay nagpapasidhi; ipinahahayag ito ng “napakasama.”
- source_word: הַצֹּאן
  choice: ang mga tupang ito
  rationale: Pinananatili ang tahasang talinghagang pastoral para sa bayan.
- source_word: מֶה עָשׂוּ
  choice: ano ang ginawa nila?
  rationale: Natural na retorikal na tanong na nagpapahiwatig ng kawalang-sala ng bayan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasatitik ang personal na pangalang banal sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהַי
  choice: aking Diyos
  rationale: Natural na anyong paari sa tuwirang pagtawag.
- source_word: תְּהִי נָא יָדְךָ
  choice: nakikiusap ako, ang kamay mo nawa ay laban sa
  rationale: Pinananatili ang talinghagang “kamay” bilang kapangyarihang humahatol, habang ipinahahayag ng “nakikiusap ako” at “nawa” ang pakiusap na nasa נָא.
- source_word: בִּי וּבְבֵית אָבִי
  choice: laban sa akin at sa sambahayan ng aking ama
  rationale: Pinananatili ang inuulit na ugnayang preposisyonal at ang kolektibong diwa ng sambahayan o angkan ng ama.
- source_word: וּבְעַמְּךָ לֹא לְמַגֵּפָה
  choice: ngunit huwag mong padalhan ng salot ang iyong bayan
  rationale: Isinasalin sa natural na Tagalog ang hiling na huwag maging target ng salot ang bayan, bagaman mas literal ang putol-putol na Hebreong “at hindi sa iyong bayan para/sa salot.”
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; PANGINOON
  rationale: Personal na pangalan ang nasa tekstong Hebreo; pinananatili ito bilang “Yahweh” sa halip na palitan ng titulo.
- issue: Saklaw ng pananagutan ni David
  choice: laban sa akin at sa sambahayan ng aking ama
  alternative: sa akin at sa angkan ng aking ama
  rationale: Hindi nililimitahan kung sambahayan, pamilya, o dinastiyang linya ang eksaktong saklaw ng בֵּית אָבִי; ang “sambahayan” ay nagpapanatili ng malawak na kolektibong diwa.
- issue: Larawan ng mga tupa
  choice: ang mga tupang ito
  alternative: ang kawang ito
  rationale: Pinananatili ang metapora at hindi tahasang pinapalitan ng “mga tao,” kaya nananatili ang retorikal at teolohikal na tensiyon ng panawagan ni David.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “bayan” para sa עָם at “sambahayan ng aking ama” para mapanatili ang sinaunang kolektibong konsepto nang hindi maging malabo. Pinanatili ang metaporang “mga tupa” at “kamay,” habang ginawang natural sa Filipino ang huling pakiusap.
