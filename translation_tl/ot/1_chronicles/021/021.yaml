base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/021.yaml
  text: When David came to Ornan[a], Ornan looked and saw David, and he went out from the threshing floor and bowed down before David with his face to the ground.
translation:
  language: tl
  text: Nang makarating si David kay Ornan, tumingin si Ornan at nakita niya si David. Lumabas siya mula sa giikan at nagpatirapa sa harap ni David, na nakasubsob ang mukha sa lupa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “yumukod nang napakalalim sa harap ni David.” Inilalarawan ng Hebreo ang buong pagpapatirapa na ang mukha ay nasa lupa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא דָוִיד עַד אָרְנָן
  choice: Nang makarating si David kay Ornan
  rationale: Ang בוא ay maaaring ‘pumaroon,’ ‘dumating,’ o ‘makarating’ ayon sa pananaw ng salaysay. Likas sa Filipino ang ‘makarating kay Ornan’ para sa paglapit ni David sa kaniya.
- source_word: וַיַּבֵּט אָרְנָן וַיַּרְא אֶת דָּוִיד
  choice: tumingin si Ornan at nakita niya si David
  rationale: Pinananatili nito ang magkahiwalay na kilos ng נבט, ‘tumingin,’ at ראה, ‘nakita,’ sa halip na pagsamahin ang dalawa.
- source_word: וַיֵּצֵא מִן הַגֹּרֶן
  choice: Lumabas siya mula sa giikan
  rationale: Ang גורן ay giikan, ang patag na lugar na ginagamit sa paggiik; malinaw na ipinahahayag ng ‘mula’ ang pinanggalingan ng kilos.
- source_word: וַיִּשְׁתַּחוּ לְדָוִיד
  choice: nagpatirapa sa harap ni David
  rationale: Ang השתחוה ay tumutukoy sa malalim na pagyukod o pagpapatirapa. Dito, ang ‘nagpatirapa’ ay angkop dahil nililinaw ng kasunod na parirala na nakaharap siya sa lupa, nang hindi ipinahihiwatig na sinamba niya si David.
- source_word: אַפַּיִם אָרְצָה
  choice: na nakasubsob ang mukha sa lupa
  rationale: Ang literal na idyoma ay ‘mukha patungo sa lupa’ at naglalarawan ng buong pagpapatirapa. Natural at malinaw sa Filipino ang ‘nakasubsob ang mukha sa lupa.’
theological_decisions:
- issue: Kung ang kilos ni Ornan ay dapat isaling may pahiwatig ng pagsamba kay David
  choice: nagpatirapa sa harap ni David
  alternative: sumamba kay David; yumukod sa harap ni David
  rationale: Maaaring tumukoy ang השתחוה sa pagsamba o sa pagpapatirapa sa harap ng isang nakatataas, depende sa konteksto. Sapagkat si David ang pinatutungkulan at malinaw ang pisikal na kilos, inilalarawan ng salin ang pagpapatirapa nang hindi ipinapasok ang di-tiyak na kahulugang pagsamba.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘giikan,’ isang tiyak at karaniwang terminong biblikal-agrikultural. Ang ‘nagpatirapa’ at ‘nakasubsob ang mukha sa lupa’ ay konkretong naglalarawan sa kilos nang hindi ito binibigyan ng di-tiyak na teolohikal na kahulugan.
