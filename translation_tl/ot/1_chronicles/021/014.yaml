id: 1CH.21.14
reference: 1 Chronicles 21:14
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יִּתֵּ֧ן יְהוָ֛ה דֶּ֖בֶר בְּ/יִשְׂרָאֵ֑ל וַ/יִּפֹּל֙ מִ/יִּשְׂרָאֵ֔ל שִׁבְעִ֥ים אֶ֖לֶף אִֽישׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/014.yaml
  text: So Yahweh sent a plague on Israel[a], and seventy thousand men of Israel fell.
translation:
  language: tl
  text: Kaya nagpadala si Yahweh ng salot sa Israel[a], at pitumpung libong lalaki mula sa Israel ang nasawi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring ‘nakamamatay na epidemya.’ Ang salitang Hebreo ay tumutukoy sa nakamamatay na paglaganap ng sakit, na madalas lumilitaw sa konteksto ng hatol ng Diyos.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang personal na pangalan ng Diyos bilang transliterasyon ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: וַיִּתֵּן
  choice: nagpadala
  rationale: Bagaman literal na ‘nagbigay,’ ang pandiwa kasama ng דֶּבֶר ay likas na ipinapahayag sa Tagalog bilang ‘nagpadala ng salot,’ habang pinananatili ang tuwirang pagkilos ni Yahweh.
- source_word: דֶּבֶר
  choice: salot
  rationale: Ang ‘salot’ ay malinaw at dignified na modernong salitang Tagalog para sa nakamamatay na paglaganap ng sakit, lalo na sa konteksto ng hatol.
- source_word: בְּיִשְׂרָאֵל
  choice: sa Israel
  rationale: Sa pariralang ‘nagpadala ... sa Israel,’ natural na ipinahahayag ng ‘sa’ na dumating ang salot sa bayan, nang hindi labis na tinutukoy kung lokasyon o layon ang diin.
- source_word: וַיִּפֹּל
  choice: nasawi
  rationale: Literal itong ‘nahulog/buwal,’ isang idyoma para sa pagkamatay. Ang ‘nasawi’ ay likas sa modernong Tagalog at malinaw ang kahulugan sa konteksto, bagaman hindi nito ginagaya nang literal ang larawang Hebreo.
- source_word: מִיִּשְׂרָאֵל
  choice: mula sa Israel
  rationale: Pinananatili ng ‘mula sa Israel’ ang puwersa ng pang-ukol na מִן at ipinakikitang kabilang sa Israel ang mga nasawi.
- source_word: שִׁבְעִים אֶלֶף אִישׁ
  choice: pitumpung libong lalaki
  rationale: Tahasang gumagamit ang Hebreo ng אִישׁ (‘lalaki’) bilang kolektibong katawagan pagkatapos ng bilang, kaya hindi ito pinalawak sa mas neutral na ‘tao.’
theological_decisions:
- issue: Tuwirang pagkilos ng Diyos sa paghatol
  choice: nagpadala si Yahweh ng salot
  alternative: pinahintulutan ni Yahweh na magkaroon ng salot
  rationale: Tuwirang iniuugnay ng Hebreo kay Yahweh ang pagkilos at walang pandiwang nangangahulugang ‘pinahintulutan.’ Pinananatili ng salin ang teolohikal na tensiyon sa halip na palambutin ito.
- issue: Kahulugan ng וַיִּפֹּל sa konteksto
  choice: nasawi
  alternative: nabuwal
  rationale: Ang literal na ‘nabuwal’ ay maaaring mapagkamalang pisikal na pagkatumba lamang sa kasalukuyang Tagalog. Ipinahahayag ng ‘nasawi’ ang idyomatikong kahulugan na namatay sila dahil sa salot.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, dignified, at madaling maunawaan. Pinanatili ang pangalang ‘Yahweh,’ ang tahasang pagbanggit sa mga lalaki, at ang tuwirang banal na pagkilos; gumamit ng ‘nasawi’ upang maipahayag nang natural ang Hebreong idyoma para sa kamatayan.
