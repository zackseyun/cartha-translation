  text: וַ/יִּבֶן֩ שָׁ֨ם דָּוִ֤יד מִזְבֵּ֨חַ֙ לַ/יהוָ֔ה וַ/יַּ֥עַל עֹל֖וֹת וּ/שְׁלָמִ֑ים וַ/יִּקְרָא֙ אֶל יְהוָ֔ה וַ/יַּֽעֲנֵ֤/הוּ בָ/אֵשׁ֙ מִן הַ/שָּׁמַ֔יִם עַ֖ל מִזְבַּ֥ח הָ/עֹלָֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/026.yaml
  text: There David built an altar to Yahweh and offered up burnt offerings and peace offerings. He called on Yahweh[a], and he answered him with fire from heaven on the altar of burnt offering.
translation:
  language: tl
  text: Nagtayo roon si David ng isang altar para kay Yahweh at naghandog ng mga handog na sinusunog at mga handog pangkapayapaan.[a] Tumawag siya kay Yahweh, at sinagot siya ni Yahweh sa pamamagitan ng apoy mula sa langit, sa altar ng handog na sinusunog.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga handog para sa mabuting samahan.”
    reason: Ipinapakita ang alternatibong diin ng שְׁלָמִים sa pakikipag-ugnayan o pakikisama, hindi lamang sa “kapayapaan.”
lexical_decisions:
- source_word: וַיִּבֶן שָׁם דָּוִיד
  choice: Nagtayo roon si David
  rationale: Likas na ayos sa makabagong Tagalog para sa payak na salaysay; pinananatili ng “roon” ang pagtukoy sa lugar na kababanggit lamang.
- source_word: מִזְבֵּחַ לַיהוָה
  choice: isang altar para kay Yahweh
  rationale: Ang “altar” ang karaniwan at malinaw na katawagan sa estrukturang pinaghahandugan; ipinahihiwatig ng “para kay” ang paglalaan nito kay Yahweh.
- source_word: וַיַּעַל עֹלוֹת
  choice: naghandog ng mga handog na sinusunog
  rationale: Ipinapahayag nito ang natatanging uri ng handog na lubusang sinusunog nang hindi gumagamit ng lipas o di-pamilyar na salita.
- source_word: וּשְׁלָמִים
  choice: mga handog pangkapayapaan
  rationale: Pinananatili ang ugnayan ng שְׁלָמִים sa kapayapaan o kabuuang kagalingan; ibinibigay sa talababa ang posibleng diin sa mabuting samahan.
- source_word: וַיִּקְרָא אֶל יְהוָה
  choice: Tumawag siya kay Yahweh
  rationale: Pinananatili ang konkretong pandiwang “tumawag” at ang kahulugang paglapit o pagsusumamo sa Diyos nang hindi tahasang pinapalitan ng mas interpretatibong “nanalangin.”
- source_word: וַיַּעֲנֵהוּ
  choice: sinagot siya ni Yahweh
  rationale: Bagaman panghalip lamang ang simuno sa Hebreo, inuulit ang “Yahweh” upang maiwasan ang malabong reperensiya ng panghalip sa Tagalog.
- source_word: בָאֵשׁ מִן הַשָּׁמַיִם
  choice: sa pamamagitan ng apoy mula sa langit
  rationale: Ang “sa pamamagitan ng” ay malinaw na nagpapahayag ng instrumental na gamit ng ב, samantalang likas sa Tagalog ang isahang “langit.”
- source_word: עַל מִזְבַּח הָעֹלָה
  choice: na bumaba sa altar ng handog na sinusunog
  rationale: Ginagawang likas sa Tagalog ang lokasyong tinutukoy ng Hebreo. Ang “bumaba” ay ipinahihiwatig ng apoy na mula sa langit at nasa altar, ngunit hindi dinaragdagan ng simbolikong paliwanag ang pangyayari.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Tuwirang pinananatili ang personal na pangalang tipan na nasa tekstong Hebreo, sa halip na palitan ito ng titulo.
- issue: Paraan ng sagot ng Diyos
  choice: Sinagot ni Yahweh si David sa pamamagitan ng apoy mula sa langit na bumaba sa altar.
  alternative: Unawain ang apoy bilang sagisag lamang o dagdagan ng paliwanag tungkol sa kahulugan nito.
  rationale: Inilalahad ang mahimalang pangyayari ayon sa mismong salaysay, nang walang idinadagdag na doktrinal o simbolikong pagpapakahulugan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang pamilyar na “altar” at ang malinaw na pariralang “handog na sinusunog.” Inilagay ang talababa kaagad pagkatapos ng terminong tinutukoy nito.
