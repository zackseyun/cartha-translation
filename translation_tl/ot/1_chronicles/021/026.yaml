  revised_text: Nagtayo roon si David ng isang altar para kay Yahweh at naghandog ng mga handog na sinusunog at mga handog pangkapayapaan.[a] Tumawag siya kay Yahweh, at sinagot siya ni Yahweh sa pamamagitan ng apoy mula sa langit, sa altar ng handog na sinusunog.
  revised_footnotes:
