base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/027.yaml
  text: And Yahweh spoke to the angel[b][a], and he returned his sword to its sheath.
translation:
  language: tl
  text: At sinabi ni Yahweh sa anghel, at ibinalik nito ang kaniyang espada sa kaluban nito.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang transliterasyon ng personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
- source_word: וַיֹּאמֶר
  choice: sinabi
  rationale: Ang אמר ay pangunahing nangangahulugang “sabihin.” Natural sa Filipino ang “sinabi ... sa anghel” at hindi nito dinaragdagan ang diwa bilang tahasang “inutusan.”
- source_word: לַמַּלְאָךְ
  choice: sa anghel
  rationale: Bagaman maaari ring mangahulugang “mensahero” ang מַלְאָךְ, malinaw sa konteksto ng nilalang na may hawak na espada na isang makalangit na anghel ang tinutukoy.
- source_word: וַיָּשֶׁב
  choice: ibinalik
  rationale: Ang Hiphil ng שׁוב ay may diwang “ipabalik” o “ibalik.” Ang “ibinalik” ay natural at sapat na nagpapahayag na muling inilagay ang espada sa kinalalagyan nito.
- source_word: חַרְבּוֹ
  choice: ang kaniyang espada
  rationale: Tuwirang isinasalin ang panghalip na paari; tumutukoy ito sa espada ng anghel ayon sa agarang konteksto.
- source_word: אֶל נְדָנָהּ
  choice: sa kaluban nito
  rationale: Ang נְדָן ay kaluban o lalagyan ng espada. Karaniwan at malinaw sa modernong Filipino ang “kaluban,” at ang hulaping pambabae ay tumutukoy sa espada ayon sa gramatika ng Hebreo.
theological_decisions:
- issue: Simuno ng וַיָּשֶׁב (“at ibinalik”)
  choice: Ang anghel ang simuno, na ipinahihiwatig ng pinakamalapit na tinukoy na kalahok at ng “kaniyang espada.”
  alternative: Si Yahweh ang simuno at siya ang nagpabalik sa espada.
  rationale: Pinakamalinaw sa daloy ng salaysay na tumugon ang anghel sa sinabi ni Yahweh at ibinalik nito ang sarili nitong espada. Ginamit ang “nito” matapos ang “anghel” upang maging malinaw sa Filipino nang hindi nagdaragdag ng tahasang utos na wala sa Hebreo.
translation_notes:
  register: Modernong Filipino na payak ngunit marangal. Pinanatili ang pangalang “Yahweh.” Ginamit ang “kaniyang” para sa maayos na rehistro at “nito” upang malinaw na ang anghel ang gumagawa ng kilos at ang kaluban ay sa espada.
