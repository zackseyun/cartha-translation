  source_fidelity: 'Tumpak na naipapasa ang tatlong pagpipilian: tatlong taon ng taggutom, tatlong buwang pagkapuksa sa harap ng mga kaaway habang naaabutan ng tabak ng mga kalaban, at tatlong araw ng tabak ni Yahweh—ang salot sa lupain—kasabay ng paninira ng anghel ni Yahweh sa buong teritoryo ng Israel. Ang aspektong hindi ganap na tinutukoy ng נִסְפֶּה ay hindi labis na nililimitahan sa kamatayan lamang.'
  naturalness: Marangal at malinaw ang modernong Filipino. Ang magkatambal na “mga kaaway” at “mga kalaban” ay nakatutulong upang maipakita ang dalawang magkaibang salitang Hebreo nang hindi nagiging mabigat ang pag-uulit. Ang paggamit ng mga gitling sa “tabak ni Yahweh—salot sa lupain—” ay likas na nagpapahiwatig ng paliwanag na ugnayan.
  terminology: Ang “taggutom,” “tabak,” “salot,” “anghel ni Yahweh,” at “nasasakupan ng Israel” ay angkop sa pinagmulan at sa marangal na rehistro. Pare-parehong pinananatili ang pangalang “Yahweh.” Ang mga talababa ay wastong nakaangkla sa mga salitang may leksikal na alternatibo at hindi nagpapasok ng doktrinal na pagpapasya.
