id: 1CH.21.12
reference: 1 Chronicles 21:12
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: אִם שָׁל֨וֹשׁ שָׁנִ֜ים רָעָ֗ב וְ/אִם שְׁלֹשָׁ֨ה חֳדָשִׁ֜ים נִסְפֶּ֥ה מִ/פְּנֵי צָרֶי/ךָ֮ וְ/חֶ֣רֶב אוֹיְבֶ֣/ךָ לְ/מַשֶּׂגֶת֒ וְ/אִם שְׁלֹ֣שֶׁת יָ֠מִים חֶ֣רֶב יְהוָ֤ה וְ/דֶ֨בֶר֙ בָּ/אָ֔רֶץ וּ/מַלְאַ֣ךְ יְהוָ֔ה מַשְׁחִ֖ית בְּ/כָל גְּב֣וּל יִשְׂרָאֵ֑ל וְ/עַתָּ֣ה רְאֵ֔ה מָֽה אָשִׁ֥יב אֶת שֹׁלְחִ֖/י דָּבָֽר־־־׀־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/012.yaml
  text: either three years of famine[a], or three months of being swept away before your foes while the sword of your enemies overtakes you, or three days of the sword of Yahweh, even pestilence in the land, with the angel of Yahweh destroying throughout all the territory of Israel[b]. Now consider what answer I should return to the one who sent me.
translation:
  language: tl
  text: alinman sa tatlong taon ng taggutom, o tatlong buwang pagkapuksa[a] sa harap ng iyong mga kaaway habang inaabutan ka ng tabak ng iyong mga kalaban, o tatlong araw ng tabak ni Yahweh—salot[b] sa lupain—habang ang anghel ni Yahweh ay namumuksa sa buong nasasakupan ng Israel. Ngayon, pag-isipan mo kung anong sagot ang ibibigay ko sa nagsugo sa akin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “pagkatangay,” “pagkalipol,” o “pagkapahamak”; ang anyong Hebreo ay tumutukoy sa pagdadala sa pagkawasak sa labanan.
    reason: lexical_alternative
  - marker: b
    text: O “nakahahawang sakit”; ang salitang Hebreo ay tumutukoy sa epidemikong sakit na dumarating bilang hatol.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָעָב
  choice: taggutom
  rationale: Karaniwang salitang Filipino para sa malawakang kakulangan ng pagkain sa isang pambansa at panghatol na konteksto.
- source_word: נִסְפֶּה
  choice: pagkapuksa
  rationale: Ipinahahayag ng Niphal participle ang pagdadala sa kapahamakan o pagkawasak; ang “pagkapuksa” ay angkop sa konteksto ng pagkatalo at pagtugis nang hindi nililimitahan ang kahulugan sa pagkamatay lamang.
- source_word: מִפְּנֵי צָרֶיךָ
  choice: sa harap ng iyong mga kaaway
  rationale: Pinananatili ang larawang militar ng pagkapahamak o pag-urong sa harap ng mga kaaway.
- source_word: חֶרֶב אוֹיְבֶיךָ
  choice: tabak ng iyong mga kalaban
  rationale: Tuwirang pinananatili ang metapora ng tabak at iniiwasan ang paulit-ulit na paggamit ng “kaaway.”
- source_word: לְמַשֶּׂגֶת
  choice: inaabutan ka
  rationale: Likas na Filipino para sa paghabol na nagtatagumpay na maabot ang tinutugis.
- source_word: חֶרֶב יְהוָה
  choice: tabak ni Yahweh
  rationale: Pinananatili ang konstruktong metapora at ang paghahambing sa tabak ng mga kalaban.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ang banal na pangalang YHWH sa halip na palitan ito ng isang titulo.
- source_word: דֶבֶר
  choice: salot
  rationale: Sa konteksto ng hatol, tumutukoy ito sa nakamamatay at lumalaganap na sakit; malinaw at marangal ang “salot” sa modernong Filipino.
- source_word: מַלְאַךְ יְהוָה
  choice: anghel ni Yahweh
  rationale: Karaniwang salin sa kontekstong nagsasaad ng makalangit na tagapagpatupad, nang hindi tinutukoy nang higit sa sinasabi ng teksto ang kaniyang kalikasan.
- source_word: מַשְׁחִית
  choice: namumuksa
  rationale: Naipapakita ng aspektong nagpapatuloy ang mapanirang pagkilos ng anghel.
- source_word: בְּכָל גְּבוּל יִשְׂרָאֵל
  choice: sa buong nasasakupan ng Israel
  rationale: Dito ang גְּבוּל ay tumutukoy sa kabuuang teritoryo, hindi lamang sa mga guhit ng hangganan.
- source_word: רְאֵה
  choice: pag-isipan mo
  rationale: Sa usapang ito, hinihingi kay David ang maingat na pagpapasiya, hindi ang literal na pagtingin.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehovah
  rationale: Pangalan mismo ang nasa Hebreo; pinananatili ng “Yahweh” ang katangian nito bilang tipanang pangalan ng Diyos.
- issue: Pagkakakilanlan ng מַלְאַךְ יְהוָה
  choice: anghel ni Yahweh
  alternative: sugo ni Yahweh
  rationale: Pinananatili ang karaniwang leksikal na kahulugan at hindi nagpapasok ng tiyak na doktrina kung nilalang na anghel o natatanging pagpapakita ng Diyos ang tinutukoy.
- issue: Ugnayan ng “tabak ni Yahweh” at “salot”
  choice: tabak ni Yahweh—salot sa lupain
  alternative: tabak ni Yahweh at salot sa lupain
  rationale: Ipinakikita ng bantas na ang salot ay nagpapaliwanag o tumutukoy sa anyo ng “tabak ni Yahweh,” habang hindi lubusang isinasara ang bahagyang kalabuan ng pagkakaugnay ng mga parirala.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Pinanatili ang tatlong magkakatumbas na pagpipilian, ang larawang “tabak,” at ang pag-uulit sa pangalang Yahweh. Ginamit ang mga gitling upang ipakitang ang “salot sa lupain” ay pagpapaliwanag sa “tabak ni Yahweh.”
