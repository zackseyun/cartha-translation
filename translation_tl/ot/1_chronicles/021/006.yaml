base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/006.yaml
  text: But he did not count Levi and Benjamin among them[a], because the king’s command was detestable to Joab.
translation:
  language: tl
  text: Ngunit hindi isinama ni Joab sa bilang ang Levi at Benjamin, sapagkat kasuklam-suklam kay Joab ang utos ng hari.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kasuklam-suklam kay Joab ang salita ng hari.”
    reason: Pinananatili ang mas literal na posibilidad ng דְּבַר bilang “salita” at tahasang binabanggit si Joab.
lexical_decisions:
- source_word: וְ/לֵוִי֙ וּ/בִנְיָמִ֔ן
  choice: ang Levi at Benjamin
  rationale: Pinanatili ang mga pangalan ng dalawang lipi sa karaniwang anyong Filipino. Ang וְ ay ipinahiwatig ng “Ngunit” sa simula upang ipakita ang pagsalungat sa naunang tala ng sensus.
- source_word: לֹ֥א פָקַ֖ד
  choice: hindi isinama ni Joab sa bilang
  rationale: Sa konteksto ng sensus, ang פקד ay tumutukoy sa pagbibilang o pagtatala. Nilinaw ang ipinahihiwatig na simuno na si Joab mula sa hulihan ng talata, at natural sa Filipino ang “isinama sa bilang.”
- source_word: בְּ/תוֹכָ֑/ם
  choice: sa bilang
  rationale: Literal itong “sa gitna nila/kasama nila,” ngunit sa konteksto ay nangangahulugang hindi isinama ang dalawang lipi sa mga binilang. Isinama ang diwa nito sa pariralang “sa bilang.”
- source_word: כִּֽי
  choice: sapagkat
  rationale: Nagpapakilala ito ng dahilan; ang “sapagkat” ay malinaw, dignificado, at natural sa salaysay.
- source_word: נִתְעַ֥ב
  choice: kasuklam-suklam
  rationale: Pinananatili nito ang matinding negatibong pagtataya ng Niphal na anyo nang hindi gumagamit ng lipas o labis na teknikal na salita.
- source_word: דְּבַר הַ/מֶּ֖לֶךְ
  choice: ang utos ng hari
  rationale: Bagaman maaaring literal na “salita ng hari,” tumutukoy sa konteksto ang דְּבַר sa ipinag-utos na sensus, kaya “utos” ang pinakamalinaw na katumbas.
- source_word: אֶת יוֹאָֽב
  choice: sa kanya
  rationale: Pagkatapos ng pandiwang nagsasaad ng pagtataya o damdamin, itinuturo ng אֶת ang taong nakararanas nito. Ginamit ang “sa kanya” upang maiwasan ang di-natural na pag-uulit kay Joab.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na may dignidad at malinaw sa karaniwang mambabasa. Ginamit ang “Ngunit” upang ilantad ang kontrast, at inayos ang pagkakasunod ng pangungusap ayon sa natural na daloy sa Filipino. Lumilitaw ang panandang [a] sa pangunahing teksto.
