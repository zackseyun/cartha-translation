  text: And the son of Jehonathan was Merib-baal[b][a], and Merib-baal fathered Micah.
translation:
  language: tl
  text: At ang anak ni Jehonatan[b] ay si Merib-baal[a], at si Merib-baal ang naging ama ni Mica.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dalawang bahagyang magkaibang anyo ng pangalan ng ama ang ginamit sa Hebreo sa talatang ito: “Merib-baal” at ang pinaikling “Meri-baal.” Ginamit sa salin ang “Merib-baal” sa dalawang pagkakataon para sa kalinawan.'
    reason: textual_variant
  - marker: b
    text: Sa 1 Samuel 14:49, tinawag na “Jonatan” ang anak ni Saul. Dito, Jehonatan ang anyong Hebreo na ginamit ng manunulat ng Mga Cronica.
    reason: cross_reference
lexical_decisions:
- source_word: וּ/בֶן
  choice: At ang anak ni
  rationale: Ang בֶן ay nangangahulugang “anak,” at ang unlaping וּ ay isinaling “At” upang mapanatili ang pagkakaugnay ng talaangkanan sa naunang talata.
- source_word: יְהוֹנָתָן
  choice: Jehonatan
  rationale: Tinumbasan sa transliterasyong angkop sa Filipino ang mismong anyong Hebreo na יְהוֹנָתָן, sa halip na gawing mas pamilyar na Jonatan.
- source_word: מְרִיב בָּעַל
  choice: Merib-baal
  rationale: Pangalang pantangi itong binubuo ng dalawang sangkap sa Hebreo; pinanatili ng gitling ang malinaw na anyo ng tambalang pangalan.
- source_word: וּ/מְרִי בַעַל
  choice: at ... si Merib-baal
  rationale: Ang וּ ay “at.” Bagaman pinaikli rito sa מְרִי בַעַל ang baybay ng pangalan, ginamit sa teksto ang buong anyong Merib-baal para sa kalinawan, at ipinaliwanag ang pagkakaiba sa talababa.
- source_word: הוֹלִיד
  choice: naging ama ni
  rationale: Sa konteksto ng talaangkanan, ang Hiphil ng ילד ay tumutukoy sa pagiging ama o pag-aanak ng isang lalaki. Ang “naging ama ni” ay natural at marangal sa makabagong Filipino.
- source_word: אֶת מִיכָה
  choice: Mica
  rationale: Ang אֶת ay pananda ng tuwirang layon at hindi hiwalay na isinasalin; ang מִיכָה ay tinumbasan ng nakaugaliang anyong Filipino na “Mica.”
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang maikling estruktura ng talaangkanan at ang mga pangalang malapit sa anyong Hebreo; ang hindi likas na “inanak si” ay iniwasan pabor sa “naging ama ni.”
