base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/024.yaml
  text: 'The gatekeepers were at the four directions: east[a], west, north, and south.'
translation:
  language: tl
  text: 'Ang mga bantay sa pintuan ay nasa apat na dako[a]: silangan, kanluran, hilaga, at timog.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “sa apat na hangin”; dito, ang “mga hangin” ay tumutukoy sa apat na direksiyon o dako.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְאַרְבַּע רוּחוֹת
  choice: sa apat na dako
  rationale: Literal na tumutukoy sa “apat na hangin,” ngunit sa kontekstong heograpikal at sa kasunod na talaan ng mga pangunahing direksiyon, ang kahulugan ay apat na dako. Ang “sa” ay natural na nagpapahayag ng kinalalagyan o pagkakahati ng mga bantay.
- source_word: יִהְיוּ
  choice: ay nasa
  rationale: Pinananatili ang payak na diwa ng pandiwang “maging/naroon” at iniiwasang idagdag ang mas tiyak na ideya ng pormal na pagtatalaga na wala namang tahasang sinabi sa Hebreo.
- source_word: הַשֹּׁעֲרִים
  choice: ang mga bantay sa pintuan
  rationale: Ang pangngalan ay tumutukoy sa mga taong nagbabantay o nangangasiwa sa mga pintuan. Mas malinaw at natural sa modernong Filipino ang “mga bantay sa pintuan.”
- source_word: מִזְרָח יָמָּה צָפוֹנָה וָנֶגְבָּה
  choice: silangan, kanluran, hilaga, at timog
  rationale: Ang apat na anyo ay ginagamit dito bilang mga pangunahing direksiyon. Bagaman ang יָמָּה ay kaugnay ng “dagat” at ang נֶגְבָּה ay maaari ring tumukoy sa Negeb, hinihingi ng magkakaparis na talaan ang mga katumbas na direksiyong “kanluran” at “timog.”
