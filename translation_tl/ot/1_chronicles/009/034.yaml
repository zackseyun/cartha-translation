base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/034.yaml
  text: These were the heads of the fathers’ houses of the Levites[a], according to their generations, heads[b]. These lived in Jerusalem.
translation:
  language: tl
  text: Ang mga ito ang mga pinuno ng mga angkan[a] ng mga Levita ayon sa kanilang mga salinlahi—mga pinuno.[b] Sila ay nanirahan sa Jerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “mga angkan” ay mga pangkat ng pamilyang nagmula sa iisang ninuno, hindi lamang mga indibidwal na sambahayan.
    reason: cultural_note
  - marker: b
    text: Inuulit ng Hebreo ang salitang “mga pinuno” upang bigyang-diin ang kanilang katayuan.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאשֵׁי
  choice: mga pinuno ng
  rationale: Tumutukoy ang anyong construct sa mga taong namumuno sa isang pangkat. Likas sa modernong Tagalog ang “mga pinuno ng” at pinananatili nito ang ugnayang panlipunan sa teksto.
- source_word: הָאָבוֹת
  choice: mga angkan
  rationale: Sa konteksto ng Mga Cronica, tumutukoy ito sa mga yunit ng pamilyang nagmula sa iisang ninuno, hindi lamang sa kani-kaniyang sambahayan. Mas malinaw sa karaniwang mambabasa ang “mga angkan.”
- source_word: לַלְוִיִּם
  choice: ng mga Levita
  rationale: 'Ipinakikita rito ng ל ang kaugnayan o pagkakabilang: ang mga angkan ay kabilang sa mga Levita.'
- source_word: לְתֹלְדוֹתָם
  choice: ayon sa kanilang mga salinlahi
  rationale: Pinananatili ng “mga salinlahi” ang genealogical na diwa ng תֹּלְדוֹת nang hindi ipinapalagay na tiyak na nakasulat na talaan ang tinutukoy.
- source_word: רָאשִׁים
  choice: mga pinuno
  rationale: Inuulit sa Hebreo ang salitang mula sa parehong ugat upang idiin ang kanilang katayuan. Pinananatili rin ang pag-uulit sa salin sa halip na palitan ito ng mas interpretatibong katawagan.
- source_word: יָשְׁבוּ
  choice: nanirahan
  rationale: Ang pandiwa ay tumutukoy sa paninirahan sa isang lugar. Ang “nanirahan” ay malinaw, kasalukuyang gamit, at hindi nagpapahiwatig ng prosesong pagtatatag ng pamayanan.
- source_word: בִירוּשָׁלִָם
  choice: sa Jerusalem
  rationale: Karaniwang salin ng lokatibong parirala at ng pangalan ng lugar.
