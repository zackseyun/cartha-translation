translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “angkan” sa halip na literal na “bahay ng mga ama” upang malinaw na maipahayag ang sinaunang yunit ng pamilyang nagmula sa iisang ninuno. Sadyang pinanatili ang bahagyang mabigat na pag-uulit ng “mga pinuno” dahil naroon din ito sa Hebreo bilang pagdidiin.
