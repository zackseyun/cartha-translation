  text: Some of them were in charge of the vessels of service[a], for they brought them in by count and took them out by count.
translation:
  language: tl
  text: Ang ilan sa kanila ang namamahala sa mga kagamitang ginagamit sa paglilingkod[a], sapagkat ipinapasok nila ang mga iyon ayon sa bilang at inilalabas din nila ayon sa bilang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga sisidlan para sa paglilingkod” o “mga kasangkapan na ginagamit sa paglilingkod.” Malawak ang kahulugan ng salitang Hebreo at maaari itong tumukoy sa mga sisidlan, kasangkapan, o iba pang kagamitan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֵהֶם
  choice: Ang ilan sa kanila
  rationale: 'Ipinahahayag ang partitive na diwa ng מִן: isang bahagi mula sa naunang binanggit na pangkat.'
- source_word: עַל
  choice: ang namamahala sa
  rationale: Sa konteksto ng mga tao at tungkulin, ipinahihiwatig nito ang pangangasiwa at pananagutan.
- source_word: כְּלֵי הָעֲבוֹדָה
  choice: mga kagamitang ginagamit sa paglilingkod
  rationale: Malawak ang saklaw ng כְּלִי—sisidlan, kasangkapan, o kagamitan—at tumutukoy rito sa mga gamit para sa paglilingkod sa templo.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala nito ang paliwanag o dahilan ng kanilang pananagutan.
- source_word: בְמִסְפָּר
  choice: binibilang
  rationale: Natural na Filipino para sa eksaktong pagtatala o pag-iimbentaryo; pinananatili ng pag-uulit ang diin ng Hebreo sa pananagutan.
- source_word: יְבִיאוּם ... יוֹצִיאוּם
  choice: kapag inilalabas at kapag ibinabalik
  rationale: Inilalarawan ng mga imperfect ang nakagawiang proseso. Isinaayos ang pagkakasunod sa natural na Filipino bilang paglalabas at pagsasauli, habang pinananatili ang dalawang kilos at ang pagbilang sa bawat isa.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “paglilingkod” sa konteksto ng templo nang hindi nagdaragdag ng denominasyonal na terminolohiya. Ang “kagamitan” ay sadyang malawak upang mapanatili ang saklaw ng כְּלִי.
