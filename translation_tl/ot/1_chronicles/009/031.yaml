  naturalness: Malinaw at marangal ang pangungusap, ngunit hindi likas sa makabagong Filipino ang “mga tinapay na lapad.” Ang “mga malalapad na tinapay” ay ang karaniwang ayos ng pang-uri at pinananatili ang maingat na paglalarawan sa mga flat cakes.
