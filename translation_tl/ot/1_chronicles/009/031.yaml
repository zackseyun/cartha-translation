base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/031.yaml
  text: And Mattithiah[a], from the Levites, the firstborn of Shallum the Korahite[b], was entrusted with the work of the flat cakes.
translation:
  language: tl
  text: Si Matitias, na isa sa mga Levita at panganay ni Salum na Korahita, ay pinagkatiwalaang mamahala[a] sa paggawa ng mga malalapad na tinapay.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “ay tapat na namahala.” Maaaring ilarawan ng pariralang Hebreo ang matapat na paraan ng kanyang paglilingkod o ang pagkakapuwesto niya sa isang tungkuling ipinagkatiwala sa kanya.
    reason: lexical_alternative
  - marker: b
    text: Ang salitang Hebreo ay tumutukoy sa isang uri ng nilutong tinapay o cake, marahil ay niluluto sa kawali o parilya.
    reason: cultural_note
lexical_decisions:
- source_word: וּמַתִּתְיָה
  choice: Si Matitias
  rationale: Isinalin ang pangalang Hebreo sa anyong madaling basahin sa Filipino; hindi na tahasang isinalin ang pang-ugnay na וּ dahil natural na pagpapatuloy ng talaan ang pangungusap sa Filipino.
- source_word: מִן הַלְוִיִּם
  choice: na isa sa mga Levita
  rationale: Ipinahahayag ng מִן ang pagiging kabilang sa pangkat; mas natural sa Filipino ang “isa sa mga Levita” kaysa literal na “mula sa mga Levita.”
- source_word: הוּא הַבְּכוֹר לְשַׁלֻּם
  choice: at panganay ni Salum
  rationale: Pinananatili ng “panganay” ang karaniwang kahulugan ng בְּכוֹר at malinaw na ipinakikita ang kaugnayang pampamilya.
- source_word: הַקָּרְחִי
  choice: na Korahita
  rationale: Ginamit ang anyong pantawag sa kaangkanan upang tukuyin si Salum bilang kabilang sa angkan ni Korah.
- source_word: בֶּאֱמוּנָה עַל
  choice: ay pinagkatiwalaang mamahala
  rationale: Sa kontekstong pangangasiwa, maaaring tumukoy ang parirala sa isang responsibilidad na ipinagkatiwala. Natural na ipinahahayag ng “pinagkatiwalaang mamahala” ang ugnayan ng בֶּאֱמוּנָה at עַל nang hindi ikinukubli ang ibang posibleng basa, na inilagay sa talababa.
- source_word: מַעֲשֵׂה
  choice: sa paggawa
  rationale: Sa kontekstong pagkain, tumutukoy ang malawak na salitang מַעֲשֵׂה sa gawain ng paghahanda o paggawa.
- source_word: הַחֲבִתִּים
  choice: ng mga tinapay na lapad
  rationale: Tumutukoy ang bihirang salitang Hebreo sa isang uri ng nilutong tinapay o cake, malamang na inihahanda sa kawali o parilya. Ang “tinapay na lapad” ay kongkreto at madaling maunawaan nang hindi nagdaragdag ng di-tiyak na kahulugang panghandog.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang karaniwang bokabularyong “panganay,” “pinagkatiwalaang mamahala,” at “paggawa,” habang pinanatili sa talababa ang tunay na kalabuan ng בֶּאֱמוּנָה at ang di-tiyak na eksaktong anyo ng הַחֲבִתִּים.
