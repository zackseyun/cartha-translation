  text: וַ/עֲזַרְיָ֨ה בֶן חִלְקִיָּ֜ה בֶּן מְשֻׁלָּ֣ם בֶּן צָד֗וֹק בֶּן מְרָיוֹת֙ בֶּן אֲחִיט֔וּב נְגִ֖יד בֵּ֥ית הָ/אֱלֹהִֽים־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/011.yaml
  text: and Azariah son of Hilkiah[a], son of Meshullam, son of Zadok, son of Meraioth, son of Ahitub, chief officer of the house of God.
translation:
  language: tl
  text: at si Azarias na anak ni Hilkias, na anak ni Mesulam, na anak ni Zadok, na anak ni Merayot, na anak ni Ahitub, ang punong tagapangasiwa[a] ng bahay ng Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “pinuno,” “tagapamahala,” o “namumuno.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַ/עֲזַרְיָה
  choice: at si Azarias
  rationale: Isinalin ang pang-ugnay na ו bilang “at” upang ipakitang nagpapatuloy ang talaan. Ginamit ang karaniwang anyong Filipino ng pangalan.
- source_word: בֶן
  choice: anak ni
  rationale: Pinanatili ang paulit-ulit na anyong pangangkanan. Maaaring pinaikli ng sinaunang talaangkanan ang ilang salinlahi, ngunit “anak ni” ang tuwirang katumbas ng anyong Hebreo rito.
- source_word: חִלְקִיָּה; מְשֻׁלָּם; צָדוֹק; מְרָיוֹת; אֲחִיטוּב
  choice: Hilkias; Mesulam; Zadok; Merayot; Ahitub
  rationale: Isinulat ang mga pangalang pantangi sa mga anyong natural at madaling makilala ng mga mambabasang Filipino, habang malapit sa Hebreo.
- source_word: נְגִיד
  choice: punong tagapangasiwa
  rationale: Ipinahahayag nito ang isang taong inilagay sa mataas na pananagutan o pamamahala. Ang parirala ay angkop sa konteksto ng paglilingkod at pangangasiwa sa santuwaryo nang hindi nagpapahiwatig ng pagiging prinsipe.
- source_word: בֵּית הָאֱלֹהִים
  choice: bahay ng Diyos
  rationale: Pinananatili nito ang kongkretong Hebreong idyoma sa halip na agad itong gawing “templo ng Diyos,” bagaman iyon ang tinutukoy sa konteksto.
theological_decisions:
- issue: Kahulugan ng אֱלֹהִים sa tawag sa santuwaryo
  choice: Diyos
  alternative: mga diyos
  rationale: Sa konteksto ng santuwaryo ng Israel, tumutukoy ang אֱלֹהִים sa Diyos ng Israel; kaya kailangan ang isahang “Diyos.”
- issue: Saklaw ng tungkuling ipinahihiwatig ng נְגִיד
  choice: punong tagapangasiwa
  alternative: pinuno; tagapamahala; namumuno
  rationale: Hindi nililinaw ng talata ang eksaktong modernong katumbas ng posisyon. Ang “punong tagapangasiwa” ay naghahatid ng mataas na pananagutan nang hindi nagdaragdag ng isang tiyak na ranggong panrelihiyon o pampolitika.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang paulit-ulit na hulma ng talaangkanan at ang Hebreong ekspresyong “bahay ng Diyos.” Inilagay ang talababa sa “punong tagapangasiwa,” ang salitang aktuwal na tinutukoy ng alternatibong pagbasa.
