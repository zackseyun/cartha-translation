    rationale: Hindi ito maling salin, ngunit ang mga kuwit at appositive na „anak ni” ay mas idiomatiko sa Filipino at pinananatili ang estruktura ng talaangkanan.
  - severity: low
    issue: Nasa dulo ng pangungusap ang marker ng talababa sa halip na kasunod ng „mga Netofatita.”
    rationale: Ang lexical alternative ay partikular na tumutukoy sa gentiliko/pangalang-lugar at sa kaugnay na pariralang heograpiko; ang mas malapit na anchor ay mas malinaw.
  - severity: low
    issue: Hindi gaanong natural ang pariralang „katawanin sa salin” sa talababa.
    rationale: Mas malinaw ang „isalin gamit ang pangalang-lugar na Netofa.”
