  source_fidelity: Tumpak na naipapahayag ng draft ang dalawang pangalang pinag-uugnay, ang mga talaangkanan, at ang paglalarawan kay Berequias bilang naninirahan sa mga pamayanang kaugnay ng Netofa. Ang „mga Netofatita” ay wastong salin ng gentiliko, at ang alternatibong pagbasa gamit ang pangalang-lugar ay naaayon sa Hebreo.
  naturalness: Nauunawaan ang kasalukuyang salin, ngunit mas natural at mas malinaw sa modernong Filipino ang paggamit ng kuwit para sa sunod-sunod na patronymic kaysa sa paulit-ulit na „na anak ni.” Mas mabuting ilagay ang talababa kaagad kasunod ng „Netofatita,” ang bahaging saklaw ng alternatibong salin.
  terminology: Ang mga anyong Obadias, Semaias, Jedutun, Berequias, Elcana, at Netofa/Netofatita ay magkakatugma sa napiling Filipino na pagbaybay. Ang „nayon” ay angkop para sa חַצְרֵי sa kontekstong heograpiko.
