base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/016.yaml
  text: and Obadiah son of Shemaiah[a], son of Galal, son of Jeduthun, and Berechiah son of Asa, son of Elkanah, who lived in the villages of the Netophathites.
translation:
  language: tl
  text: at si Obadias, anak ni Semaias, anak ni Galal, anak ni Jedutun, at si Berequias, anak ni Asa, anak ni Elcana, na naninirahan sa mga nayon ng mga Netofatita[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “na naninirahan sa mga pamayanan ng Netofa.” Maaaring tumukoy ang salitang Hebreo sa mga Netofatita bilang pangkat ng mga tao o isalin gamit ang pangalang-lugar na Netofa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/עֹבַדְיָה
  choice: at si Obadias
  rationale: Pinanatili ang pang-ugnay na וְ upang maituwang ang talata sa naunang talaan. Ginamit ang anyong pangalang karaniwan sa tradisyong Filipino.
- source_word: בֶּן
  choice: anak ni
  rationale: Sa talaangkanan, ang tuwirang diwa ay ugnayang anak at ama. Likas sa Filipino ang “anak ni” sa halip na ang mas malabong “inapo ni.”
- source_word: שְׁמַעְיָה / גָּלָל / יְדוּתוּן
  choice: Semaias / Galal / Jedutun
  rationale: Isinalin ang mga pangalang pantangi sa mga anyong angkop sa pagbasa sa Filipino, nang hindi binabago ang kanilang papel sa talaangkanan.
- source_word: וּ/בֶרֶכְיָה
  choice: at si Berequias
  rationale: Pinanatili ang pang-ugnay na nagdaragdag ng ikalawang tao sa talaan.
- source_word: אָסָא / אֶלְקָנָה
  choice: Asa / Elcana
  rationale: Ginamit ang mga anyong pangalang madaling basahin at nakasanayan sa Filipino.
- source_word: הַ/יּוֹשֵׁב
  choice: na naninirahan
  rationale: Ang may-artikulong participle ay naglalarawan kay Berequias bilang residente; ipinahahayag ng “naninirahan” ang nagpapatuloy na paninirahan.
- source_word: בְּ/חַצְרֵי
  choice: sa mga nayon ng
  rationale: Sa heograpikong konteksto, ang חָצֵר ay tumutukoy sa maliliit na pamayanan o nayon, hindi sa literal na mga bakuran.
- source_word: נְטוֹפָתִי
  choice: mga Netofatita
  rationale: Ang anyong gentiliko ay tumutukoy sa mga taong kaugnay ng Netofa. Pinanatili sa talababa ang posibleng paglalahad gamit ang pangalan ng lugar.
