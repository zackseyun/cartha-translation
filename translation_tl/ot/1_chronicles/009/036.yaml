  text: וּ/בְנ֥/וֹ הַ/בְּכ֖וֹר עַבְדּ֑וֹן וְ/צ֣וּר וְ/קִ֔ישׁ וּ/בַ֥עַל וְ/נֵ֖ר וְ/נָדָֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/036.yaml
  text: And his firstborn son was Abdon[a], then Zur, Kish, Baal, Ner, and Nadab.
translation:
  language: tl
  text: At ang kaniyang panganay na anak ay si Abdon[a], kasunod sina Zur, Kish, Baal, Ner, at Nadab.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo: “At ang kaniyang anak, ang panganay: si Abdon, at Zur, at Kish, at Baal, at Ner, at Nadab.” Likas na isinalin sa Filipino bilang isang talaan ang pang-ugnay na inuulit bago ang bawat pangalan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנוֹ
  choice: At ang kaniyang ... anak
  rationale: Ipinagpapatuloy ng וּ ang talaangkanan, at tahasang pinananatili ng “kaniyang anak” ang ikatlong panauhang panlalaking panuring na paari.
- source_word: הַבְּכוֹר
  choice: panganay
  rationale: Ang “panganay” ang likas at pormal na katumbas sa Filipino ng terminong Hebreo para sa unang ipinanganak.
- source_word: עַבְדּוֹן
  choice: Abdon
  rationale: Pangalang pantangi na isinalin sa baybay na pamilyar sa Filipino.
- source_word: וְצוּר
  choice: kasunod sina Zur
  rationale: Likas na inilalahad sa Filipino ang sunod-sunod na pangalan bilang isang talaan; hindi nilalayong magpahiwatig ng kronolohikal na pagkakasunod bukod sa ayos ng listahan.
- source_word: וְקִישׁ
  choice: Kish
  rationale: Pangalang pantangi; ang pang-ugnay na Hebreo ay isinama sa estruktura ng talaan sa Filipino.
- source_word: וּבַעַל
  choice: Baal
  rationale: Pinananatili ang mismong personal na pangalang nasa tekstong Hebreo, sa halip na palitan o euphemistically baguhin.
- source_word: וְנֵר
  choice: Ner
  rationale: Pangalang pantangi; ang pang-ugnay ay natural na kinakatawan ng estruktura ng listahan.
- source_word: וְנָדָב
  choice: at Nadab
  rationale: Ginamit ang “at” bago ang huling pangalan ayon sa likas na ayos ng talaan sa Filipino.
theological_decisions:
- issue: Ang paggamit sa בַּעַל bilang personal na pangalan sa isang Israelitang talaangkanan
  choice: Baal bilang personal na pangalan
  alternative: Palitan ito ng ibang anyo o eupemismo upang maiwasan ang kaugnayan sa pangalan/titulo ng diyos ng Canaan
  rationale: Malinaw na personal na pangalan ang בַּעַל sa kontekstong ito. Tapat na pinananatili ng salin ang anyo ng tekstong Hebreo nang hindi ipinapalagay na pagsang-ayon ito sa idolatriya.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “kaniyang” para sa malinaw at pormal na pagtukoy, at inayos nang natural ang sunod-sunod na pangalan habang pinananatili sa talababa ang mas literal na anyo ng Hebreo.
