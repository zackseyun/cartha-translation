  text: וּ/סְבִיב֥וֹת בֵּית הָ/אֱלֹהִ֖ים יָלִ֑ינוּ כִּֽי עֲלֵי/הֶ֣ם מִשְׁמֶ֔רֶת וְ/הֵ֥ם עַל הַ/מַּפְתֵּ֖חַ וְ/לַ/בֹּ֥קֶר לַ/בֹּֽקֶר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/027.yaml
  text: They spent the night around the house of God[a], because the duty of guarding it was upon them, and they were in charge of opening it morning by morning.
translation:
  language: tl
  text: Nanunuluyan sila sa paligid ng bahay ng Diyos, sapagkat tungkulin nilang bantayan iyon. Sila ang namamahala sa pagbubukas nito[a] tuwing umaga.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa mas literal na salin, “sila ang namamahala sa susi.” Maaaring tumukoy ang Hebreo sa pag-iingat ng susi o sa pananagutang magbukas ng bahay ng Diyos.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּסְבִיבוֹת
  choice: sa paligid ng
  rationale: Ipinahahayag nito ang pook na nakapalibot sa bahay ng Diyos; natural at malinaw ang “sa paligid ng” sa makabagong Filipino.
- source_word: בֵּית הָאֱלֹהִים
  choice: bahay ng Diyos
  rationale: Pinananatili ang literal na Hebreong tawag, bagaman ang tinutukoy sa konteksto ay ang templo o kompleks nito.
- source_word: יָלִינוּ
  choice: nanunuluyan sila
  rationale: Ang pandiwa ay tumutukoy sa pananatili o pagtuloy nang magdamag, hindi lamang sa pagtulog.
- source_word: כִּי
  choice: sapagkat
  rationale: Malinaw nitong ipinakikita na ang kasunod ay dahilan ng kanilang panunuluyan doon.
- source_word: עֲלֵיהֶם מִשְׁמֶרֶת
  choice: tungkulin nilang bantayan iyon
  rationale: Natural nitong inilalahad ang idyomang literal na “nasa kanila ang pagbabantay,” bilang pananagutang iniatas sa kanila.
- source_word: וְהֵם עַל הַמַּפְתֵּחַ
  choice: sila ang namamahala sa pagbubukas nito
  rationale: Maaaring literal na tumukoy sa pangangalaga sa susi o metonimikong tumukoy sa pananagutang magbukas; ang konteksto ng paulit-ulit na gawain tuwing umaga ay sumusuporta sa ikalawang diwa.
- source_word: וְלַבֹּקֶר לַבֹּקֶר
  choice: tuwing umaga
  rationale: Natural na Filipino ito para sa paulit-ulit na Hebreong pariralang nagpapahayag ng regular na gawain bawat umaga.
