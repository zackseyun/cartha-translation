  text: 'And from the sons of Zerah: Jeuel and their brothers[a], six hundred and ninety.'
translation:
  language: tl
  text: At mula sa mga anak ni Zera ay si Jeuel at ang kanilang mga kapatid[a]—anim na raan at siyamnapu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “si Jeuel at ang kaniyang mga kapatid—anim na raan at siyamnapu,” kung si Jeuel ay itinuturing na kinatawan ng angkan. Pangmaramihan ang hulapi sa Hebreo sa literal na “kanilang mga kapatid.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מִן
  choice: At mula sa
  rationale: Pinananatili ng “At” ang pandugtong at dagdag na daloy ng talaan mula sa naunang talata, habang tuwirang isinasalin ng “mula sa” ang מִן.
- source_word: בְּנֵי
  choice: mga anak ni
  rationale: Ito ang tuwiran at nakaugaliang salin sa mga talaangkanan; maaari rin itong tumukoy nang mas malawak sa mga inapo o kaanib ng angkan.
- source_word: זֶרַח
  choice: Zera
  rationale: Isinalin sa karaniwang anyong Filipino ng pangalang Hebreo.
- source_word: יְעוּאֵל
  choice: Jeuel
  rationale: Tinumbasan sa malinaw na transliterasyon ng personal na pangalan.
- source_word: וַ/אֲחֵי/הֶם
  choice: at ang kanilang mga kapatid
  rationale: Pinananatili ang pangmaramihang hulaping Hebreo na nangangahulugang “kanilang,” sa halip na tahimik itong gawing pang-isahan. Sa konteksto, ang “mga kapatid” ay maaaring tumukoy sa mga kamag-anak o kasapi ng angkan.
- source_word: שֵׁשׁ מֵאוֹת וְ/תִשְׁעִים
  choice: animnaraan at siyamnapu
  rationale: Ibinigay sa salita ang kabuuang bilang, ayon sa natural na estilo ng saling Bibliya sa Filipino.
