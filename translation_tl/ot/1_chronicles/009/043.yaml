  source_fidelity: Kailangang itama ang unang sugnay. Ang "naging anak ni Moza si Binea" ay nagsasaad na si Binea ang naging anak ni Moza, ngunit hindi nito wastong isinasalin ang Hiphil na הוֹלִיד, na aktibong nagsasaad na si Moza ang naging ama ni Binea. Ang kasunod na hanay ay wastong nagpapakita ng sunod-sunod na ama-anak na ugnayan, ngunit mas malinaw at hindi malabo kung tuwirang uulitin ang "ang anak ni...".
  naturalness: Ang "sumunod ay" ay nauunawaan ngunit hindi kailangan at bahagyang nagpapahiwatig ng simpleng pagkakasunod kaysa sa tahasang talaangkanan. Ang "Naging ama si Moza ni Binea" at ang inuulit na "Ang anak ni... ay si..." ay natural, malinaw, at angkop sa modernong Filipino sa isang talaangkanan.
  terminology: Pinanatili ang mga transliterasyong Moza, Binea, Refaias, Eleasa, at Azel. Walang isyung teolohikal o footnote anchor sa talata.
