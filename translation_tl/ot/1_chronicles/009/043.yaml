  text: וּ/מוֹצָ֖א הוֹלִ֣יד אֶת בִּנְעָ֑א וּ/רְפָיָ֥ה בְנ֛/וֹ אֶלְעָשָׂ֥ה בְנ֖/וֹ אָצֵ֥ל בְּנֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/043.yaml
  text: And Moza fathered Binea[a], and his son was Rephaiah, his son Eleasah, his son Azel.
translation:
  language: tl
  text: At naging ama si Moza ni Binea; ang anak ni Binea ay si Refaias; ang anak ni Refaias ay si Eleasa; at ang anak ni Eleasa ay si Azel.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מוֹצָא
  choice: Moza
  rationale: Pangalan ng tao; isinalin sa karaniwang anyong transliterado sa Filipino.
- source_word: הוֹלִיד
  choice: naging anak ni
  rationale: Sa talaangkanan, tumutukoy ang Hiphil ng ילד sa pagiging ama o pag-aanak. Ang pariralang ito ay natural at marangal sa modernong Filipino, nang hindi gumagamit ng makalumang 'ipinanganak kay.'
- source_word: בִּנְעָא
  choice: Binea
  rationale: Transliterasyon ng pangalang Hebreo ayon sa bigkas na Masoretiko.
- source_word: וּרְפָיָה בְנוֹ
  choice: sumunod ay si Refaias na anak niya
  rationale: Walang tahasang pandiwa sa Hebreo sa bahaging ito. Ang 'sumunod ay' ay nagpapalinaw sa takbo ng talaangkanan nang hindi ipinapalagay na inuulit sa teksto ang pandiwang 'naging anak.'
- source_word: אֶלְעָשָׂה בְנוֹ
  choice: si Eleasa na anak nito
  rationale: Pinananatili ang paulit-ulit na ugnayang ama-anak at nililinaw ng 'nito' na si Eleasa ay anak ni Refaias.
- source_word: אָצֵל בְנוֹ
  choice: si Azel na anak nito
  rationale: Pinananatili ang huling kawing ng talaangkanan at ang ugnayang ipinahahayag ng בְנוֹ.
- source_word: אֶת
  choice: '[hindi hiwalay na isinalin]'
  rationale: Pananda ng tiyak na tuwirang layon na walang hiwalay na katumbas sa Filipino.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na angkop sa payak ngunit marangal na talaangkanan. Ginamit ang 'naging anak ni' sa halip na mas teknikal o makalumang 'ipinanganak kay' o 'naging ama ni.' Nilinaw ng mga panghalip ang sunod-sunod na salinlahi, habang iningatan ang pagkakaiba ng unang pandiwang sugnay at ng kasunod na mga pariralang walang tahasang pandiwa sa Hebreo.
