  naturalness: Malinaw, marangal, at likas ang daloy sa modernong Filipino Tagalog. Ang “ipinatapon sa Babilonia” ay angkop na balintiyak na paglalarawan ng deportasyon.
  terminology: Ang “talaangkanan,” “Aklat ng mga Hari ng Israel,” “Juda,” at “Babilonia” ay angkop. Mas tuwirang naihahatid ng “kawalang-katapatan” ang מַעַל kaysa “pagtataksil,” na sa modernong Tagalog ay maaaring magmungkahi ng mas tiyak na personal na pagtataksil.
