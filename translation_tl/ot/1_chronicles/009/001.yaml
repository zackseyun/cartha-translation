  to: Ang buong Israel ay itinala ayon sa talaangkanan[a], at narito, nakasulat sila sa Aklat ng mga Hari ng Israel; at ang Juda ay ipinatapon sa Babilonia dahil sa kanilang kawalang-katapatan.[b]
