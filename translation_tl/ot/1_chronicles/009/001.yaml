source:
  edition: WLC
  text: וְ/כָל יִשְׂרָאֵל֙ הִתְיַחְשׂ֔וּ וְ/הִנָּ֣/ם כְּתוּבִ֔ים עַל סֵ֖פֶר מַלְכֵ֣י יִשְׂרָאֵ֑ל וִ/יהוּדָ֛ה הָגְל֥וּ לְ/בָבֶ֖ל בְּ/מַעֲלָֽ/ם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/001.yaml
  text: So all Israel was enrolled by genealogy[a], and behold, they are written in the Book of the Kings of Israel[b]; and Judah was taken into exile to Babylon because of their unfaithfulness.
translation:
  language: tl
  text: Ang buong Israel ay itinala ayon sa talaangkanan[a], at narito, nakasulat sila sa Aklat ng mga Hari ng Israel; at ang Juda ay ipinatapon sa Babilonia dahil sa kanilang kawalang-katapatan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “itinala batay sa mga talaangkanan” o “ipinatala ayon sa angkan.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “dahil sa kanilang pagtataksil” o “dahil sa kanilang paglabag.” Ang salitang Hebreo ay tumutukoy sa paglabag sa katapatan o kawalang-katapatan, na madalas ay may diwang pangtipan.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִתְיַחְשׂוּ
  choice: itinala ayon sa talaangkanan
  rationale: Ipinahahayag ng anyong hitpael ang pagtatatag o pagtatala ng angkan, hindi lamang ang pagbibilang. Likas sa modernong Tagalog ang parirala at pinananatili nito ang diwang pangtalaangkanan.
- source_word: וְהִנָּם
  choice: at narito
  rationale: Pinananatili nito ang pantawag-pansing bisa ng presentatibong Hebreo nang hindi inaalis ang diin nito.
- source_word: כְּתוּבִים
  choice: nakasulat sila
  rationale: 'Ang balintiyak na pandiwaring Hebreo ay statibo: nasa nakasulat na kalagayan ang mga pangalan o tala nila.'
- source_word: עַל סֵפֶר
  choice: sa Aklat
  rationale: Bagaman literal na maaaring 'sa ibabaw ng balumbon,' ang natural na gamit sa kontekstong dokumentaryo ay 'sa aklat.'
- source_word: מַלְכֵי יִשְׂרָאֵל
  choice: mga Hari ng Israel
  rationale: Itinuturing itong pamagat ng isang makikilalang opisyal na tala, kaya ginamitan ng malaking titik bilang bahagi ng pamagat.
- source_word: וִיהוּדָה
  choice: at ang Juda
  rationale: Ipinakikilala ng pangatnig ang kasunod na sugnay at ang Juda ay tumutukoy nang kolektibo sa kaharian o bayan.
- source_word: הָגְלוּ
  choice: ipinatapon
  rationale: 'Ang hofal ay balintiyak na sanhi: ang Juda ay dumanas ng sapilitang pagpapatapon, hindi kusang umalis.'
- source_word: לְבָבֶל
  choice: sa Babilonia
  rationale: Natural na pagpapahayag sa Tagalog ng patutunguhan ng pagpapatapon.
- source_word: בְּמַעֲלָם
  choice: dahil sa kanilang pagtataksil
  rationale: Ang מַעַל ay paglabag sa katapatan o pagtataksil, kadalasa'y may kaugnayan sa tipan; ipinakikita rin ng 'dahil sa' ang sanhi.
theological_decisions:
- issue: Uri ng kasalanan ng Juda sa בְּמַעֲלָם
  choice: pagtataksil
  alternative: paglabag; kawalang-katapatan
  rationale: Pinananatili ng 'pagtataksil' ang diwa ng paglabag sa ipinagkatiwalang katapatan, kabilang ang posibleng dimensiyong pangtipan, nang hindi nagpapasok ng paliwanag na wala sa teksto.
- issue: Tinig ng הָגְלוּ
  choice: balintiyak na pagpapatapon ('ipinatapon')
  alternative: '''napatapon'' o ''yumaon sa pagkatapon'''
  rationale: Ipinakikita ng anyong hofal na ang Juda ay pinailalim sa pagpapatapon; hindi nito kusang pinasimulan ang pag-alis.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Pinanatili ang bahagyang pormal na “narito” upang maipakita ang pantawag-pansing bisa ng Hebreo. Ginamit ang kolektibong “Juda” kasabay ng panghalip na maramihang “kanilang,” na natural kapag ang tinutukoy ay ang bayan.
