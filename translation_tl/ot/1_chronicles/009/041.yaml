  text: 'And the sons of Micah: Pithon, Melech, and Tahrea.'
translation:
  language: tl
  text: 'At ang mga anak ni Mica: sina Piton, Melec, at Tahrea.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי
  choice: At ang mga anak ni
  rationale: Pinananatili ng “At” ang pang-ugnay na ו, at natural na ipinapahayag ng “ang mga anak ni” ang anyong pangkanunu-nunuan ng construct plural na בְּנֵי.
- source_word: מִיכָה
  choice: Mica
  rationale: Pangalang pantangi na isinalin sa baybay na madaling basahin sa modernong Filipino, habang pinananatili ang anyong Hebreo ng pangalan.
- source_word: פִּיתוֹן
  choice: Piton
  rationale: Tuwirang transliterasyon ng pangalang pantangi ayon sa baybay at bigkas ng Filipino.
- source_word: וָמֶלֶךְ
  choice: Melec
  rationale: Transliterasyon ng pangalang pantangi; ang pang-ugnay na ו ay likas na ipinahihiwatig sa talaan at hindi kailangang ulitin bago ang bawat pangalan sa Filipino.
- source_word: וְתַחְרֵעַ
  choice: at Tahrea
  rationale: Pinananatili ang pang-ugnay bago ang huling pangalan, ayon sa natural na ayos ng isang talaan sa Filipino; ang pangalan ay transliterado nang malapit sa Hebreo.
theological_decisions: []
