base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/039.yaml
  text: Ner fathered Kish[a], and Kish fathered Saul, and Saul fathered Jonathan, Malchi-shua, Abinadab, and Eshbaal.
translation:
  language: tl
  text: Si Ner ang ama ni Kish, at si Kish ang ama ni Saul. Si Saul ang ama nina Jonathan, Malki-sua, Abinadab, at Esbaal.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Si Esbaal ay tinatawag na Isboset sa 2 Samuel 2:8 at sa kaugnay na mga talata.
    reason: alternative_reading
lexical_decisions:
- source_word: הוֹלִיד
  choice: naging anak ni … si / ang mga naging anak ni
  rationale: Sa talaangkanan, ipinahihiwatig ng Hiphil ng ילד ang pagiging ama o pag-aanak. Ang hulmaing ito ay natural sa modernong Tagalog at malinaw na nagpapanatili sa ugnayang ama-anak nang hindi gumagamit ng masyadong teknikal o makalumang pananalita.
- source_word: נֵר
  choice: Ner
  rationale: Pangalang pantangi; tuwirang transliterasyon.
- source_word: קִישׁ
  choice: Kish
  rationale: Pangalang pantangi; pinanatili ang karaniwang anyong biblikal sa Tagalog.
- source_word: שָׁאוּל
  choice: Saul
  rationale: Pangalang pantangi; ito ang kinikilalang tradisyonal at madaling makilalang anyo sa Tagalog.
- source_word: יְהוֹנָתָן
  choice: Jonathan
  rationale: Pangalang pantangi; ginamit ang karaniwang anyong biblikal sa Tagalog.
- source_word: מַלְכִּי שׁוּעַ
  choice: Malki-sua
  rationale: Bagaman dalawang bahagi sa Hebreo, iisa itong pangalang pantangi. Pinanatili ang gitling upang ipakita ang tambalang pangalan, at inangkop ang baybay sa bigkas ng Tagalog.
- source_word: אֲבִינָדָב
  choice: Abinadab
  rationale: Pangalang pantangi; karaniwang anyong biblikal.
- source_word: אֶשְׁבָּעַל
  choice: Esbaal
  rationale: Sinusunod ang mismong pangalang nasa tekstong Hebreo ng Mga Cronica at hindi ito inihaharmonisa sa ibang anyo sa Samuel. Inangkop ang transliterasyon sa natural na ortograpiyang Tagalog.
- source_word: וְ
  choice: at
  rationale: Ang mga pang-ugnay na waw ay isinalin sa natural na koordinasyong Tagalog; hinati ang mahabang hanay sa dalawang pangungusap para sa linaw habang pinananatili ang genealogical na pagkakasunod.
- source_word: אֶת
  choice: '[hindi hiwalay na isinalin]'
  rationale: Walang tuwirang katumbas sa Tagalog ang pananda ng tiyak na layon; makikita ang tungkulin nito sa ayos ng pangungusap.
