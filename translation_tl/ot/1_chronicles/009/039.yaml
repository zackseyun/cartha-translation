translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang natural na hulmaing genealogical na “naging anak ni” sa halip na makalumang “ipinanganak” o teknikal na “naging ama ni.” Pinanatili ang mga pangalang ayon sa tekstong Hebreo, na may ortograpiyang angkop sa Tagalog.
