  text: וּ/בִ/ירוּשָׁלִַ֨ם֙ יָשְׁב֔וּ מִן בְּנֵ֥י יְהוּדָ֖ה וּ/מִן בְּנֵ֣י בִנְיָמִ֑ן וּ/מִן בְּנֵ֥י אֶפְרַ֖יִם וּ/מְנַשֶּֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/003.yaml
  text: And in Jerusalem some from the sons of Judah, and some from the sons of Benjamin, and some from the sons of Ephraim and Manasseh, lived there.
translation:
  language: tl
  text: At sa Jerusalem ay nanirahan ang ilan sa mga inapo ni Juda,[a] ang ilan sa mga inapo ni Benjamin, at ang ilan sa mga inapo nina Efraim at Manases.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “mula sa mga anak ni Juda … mula sa mga anak ni Benjamin … mula sa mga anak nina Efraim at Manases.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בִ/ירוּשָׁלִַם
  choice: At sa Jerusalem
  rationale: Pinananatili ng “At” ang ugnayan sa naunang salaysay, samantalang tuwirang ipinahahayag ng “sa Jerusalem” ang lokasyon.
- source_word: יָשְׁבוּ
  choice: nanirahan
  rationale: Ang pandiwang ישׁב ay tumutukoy rito sa paninirahan o pagtira; natural at malinaw sa makabagong Tagalog ang “nanirahan.”
- source_word: מִן
  choice: ang ilan sa
  rationale: Ipinahihiwatig ng inuulit na מִן na mga taong nagmula sa bawat pangkat, hindi ang buong tribo. Natural na ipinapahayag ito sa Tagalog bilang “ang ilan sa.”
- source_word: בְּנֵי יְהוּדָה / בְּנֵי בִנְיָמִן / בְּנֵי אֶפְרַיִם וּמְנַשֶּׁה
  choice: mga inapo ni Juda / ni Benjamin / nina Efraim at Manases
  rationale: Sa kontekstong pantribo at talaangkanan, ang בְּנֵי ay tumutukoy sa mga inapo o kaanib ng angkan, hindi lamang sa mga tuwirang anak. Iniiwasan ng “mga inapo” ang maling pagkaunawang literal na mga anak lamang sila, habang pinananatili ang genealogical na diwa.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang inuulit na balangkas ng Hebreo para sa tatlong pangkat, ngunit ginamit ang “mga inapo” bilang natural at wastong pantribong katumbas ng בְּנֵי.
