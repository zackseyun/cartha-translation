  source_fidelity: Tumpak na naihahatid ng draft ang ugnayang pangkuwento, ang pagkakakilanlan ni Finehas, ang kaniyang dating pamumuno sa mga naunang binanggit, at ang payak na pahayag na si Yahweh ay kasama niya. Gayunman, ang “dating pinuno nila” ay maaaring sa modernong Filipino ay masidiin na mangahulugang ‘dating/retiradong dating opisyal’ bilang titulo, samantalang ang לְפָנִים ay pang-abay na tumutukoy sa panahong nakaraan. Ang “noon ay pinuno nila” ay mas tuwirang pinananatili ang temporal na diwa at ang kaayusan ng Hebreo.
  naturalness: Mas likas at malinaw sa modernong Filipino ang “noon ay pinuno nila” kaysa “dating pinuno nila” para sa isang kalagayan noong nakaraan. Ang “si Yahweh ay kasama niya” ay maayos na buong sugnay at pinananatili ang hindi-pinalawak na kahulugan ng עִמּוֹ.
  terminology: Ang “Finehas,” “Eleazar,” “pinuno,” at “Yahweh” ay angkop. Ang “pinuno” ay sapat na malawak para sa נָגִיד at hindi nagpapahiwatig nang labis ng pagiging hari.
