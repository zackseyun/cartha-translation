base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/020.yaml
  text: And Phinehas son of Eleazar had formerly been chief over them[a]; Yahweh was with him.
translation:
  language: tl
  text: At si Finehas na anak ni Eleazar ay noon ay pinuno nila[a]; si Yahweh ay kasama niya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “At si Finehas na anak ni Eleazar ang pinuno nila noong una.” Dahil sa ayos ng mga salita sa Hebreo, ang “noong una” ay maaaring iugnay nang malapit sa pagiging pinuno niya o sa buong sugnay.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפִינְחָס
  choice: At si Finehas
  rationale: Pinanatili ang pang-ugnay na וּ bilang “At” at ginamit ang karaniwang anyong Tagalog ng pangalang Phinehas.
- source_word: בֶּן אֶלְעָזָר
  choice: na anak ni Eleazar
  rationale: Likas na pagpapahayag sa Tagalog ng ugnayang genealogical sa Hebrew construct.
- source_word: נָגִיד
  choice: pinuno
  rationale: Ipinahahayag ang katungkulan ng pamumuno o pangangasiwa nang hindi ipinapalagay na hari siya.
- source_word: הָיָה עֲלֵיהֶם לְפָנִים
  choice: ay dating pinuno nila
  rationale: Natural na Tagalog para sa naunang katayuan ng pamumuno; pinananatili sa talababa ang posibilidad na ang “noong una” ay tumutukoy sa buong sugnay.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang transliterasyon ng banal na pangalang יהוה sa halip na palitan ito ng isang titulo.
- source_word: עִמּוֹ
  choice: kasama niya
  rationale: Pinananatili ang payak ngunit teolohikong makabuluhang pahayag ng presensiya o pagsang-ayon ng Diyos nang walang dagdag na pagpapakahulugan.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Personal na pangalan ang tahasang nasa tekstong Hebrew; pinananatili ito bilang “Yahweh” sa halip na palitan ng titulong “Panginoon.”
- issue: Kahulugan ng presensiya ng Diyos sa עִמּוֹ
  choice: kasama niya si Yahweh
  alternative: sinusuportahan siya ni Yahweh
  rationale: Hindi nililinaw ng parirala kung presensiya, pagsang-ayon, o suporta ang pangunahing diin, kaya pinanatili ang tunay na lawak nito.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “pinuno nila” bilang likas na katumbas ng awtoridad sa kanila, at iniwasan ang mas mabigat na “tagapamahala” o maharlikang “hari.”
