  source_fidelity: 'Tapat ang salin sa Hebreo: napapanatili ang pandugtong na “At,” ang pinagmulan “mula sa mga Levita,” ang buong sunod-sunod na talaangkanan, at ang pangwakas na pagtukoy kay Merari. Ang “anak ni” ay angkop sa malinaw na genealogical chain, samantalang ang talababa ay maingat na nagsasaad ng posibleng mas malawak na saklaw ng “mga anak ni.”'
  naturalness: Natural at marangal ang modernong Filipino para sa isang talaang pangkan. Ang paggamit ng tutuldok pagkatapos ng “mga Levita” ay malinaw na nagpapakilala sa susunod na pangalan sa listahan. Ang paulit-ulit na “na anak ni” ay angkop at madaling sundan sa Filipino.
  terminology: Ang “mga Levita,” “anak ni,” at “mga anak ni Merari” ay pare-pareho at angkop sa rehistro ng tekstong talaangkanan. Ang mga anyong Semaias, Hasub, Azricam, Hasabias, at Merari ay magkakaugnay at makikilalang mga anyong Filipino ng mga pangalang biblikal.
