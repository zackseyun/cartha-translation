source:
  edition: WLC
  text: וּ/מִֽן הַ/לְוִיִּ֑ם שְׁמַֽעְיָ֧ה בֶן חַשּׁ֛וּב בֶּן עַזְרִיקָ֥ם בֶּן חֲשַׁבְיָ֖ה מִן בְּנֵ֥י מְרָרִֽי־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/014.yaml
  text: 'And from the Levites: Shemaiah son of Hasshub[a], son of Azrikam, son of Hashabiah, from the sons of Merari.'
translation:
  language: tl
  text: 'At mula sa mga Levita: si Semaias na anak ni Hasub, na anak ni Azricam, na anak ni Hasabias, mula sa mga anak ni Merari.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mula sa mga inapo ni Merari.” Maaaring tumukoy ang Hebreong pananalitang “mga anak ni” sa mas malawak na angkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִן
  choice: At mula sa
  rationale: Pinananatili ng “At” ang pandugtong at pandagdag na puwersa ng waw, habang tuwirang isinasalin ng “mula sa” ang min.
- source_word: הַלְוִיִּם
  choice: mga Levita
  rationale: Ito ang karaniwan at malinaw na katawagan sa modernong Filipino para sa pangkat na nagmula kay Levi.
- source_word: שְׁמַעְיָה
  choice: Semaias
  rationale: Ginamit ang nakaugaliang anyong Filipino ng pangalang biblikal.
- source_word: בֶן
  choice: anak ni
  rationale: Sa sunod-sunod na talaangkanan, natural nitong ipinahihiwatig ang ugnayang ama-anak; hindi ginawang “inapo” upang mapanatili ang mas tiyak na anyo ng Hebreo.
- source_word: חַשּׁוּב
  choice: Hasub
  rationale: Transliterasyong angkop sa baybay at bigkas ng Filipino; hindi kailangang katawanin ng dobleng katinig ang dagesh sa pangalang Hebreo.
- source_word: עַזְרִיקָם
  choice: Azricam
  rationale: Transliterasyong Filipino na gumagamit ng c bago ang a upang katawanin ang tunog /k/ ayon sa nakaugaliang anyo ng mga pangalang biblikal.
- source_word: חֲשַׁבְיָה
  choice: Hasabias
  rationale: Ginamit ang anyong pangalang natural sa tradisyong Filipino habang pinananatiling makikilala ang Hebreong pangalan.
- source_word: מִן בְּנֵי מְרָרִי
  choice: mula sa mga anak ni Merari
  rationale: Malapit ito sa pormal na anyo ng Hebreo at kinikilala ang pangkat ayon sa ninunong si Merari; maaaring mas malawak sa literal na mga anak ang saklaw nito.
theological_decisions: []
