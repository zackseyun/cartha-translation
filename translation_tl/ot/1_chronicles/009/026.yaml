translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “bantay ng pintuang-daan” para sa malinaw na tungkulin sa templo, “mga silid” sa halip na mas lumang “mga silid-kaban,” at “mga imbakan” bilang malawak at natural na katumbas ng אֹצָרוֹת.
