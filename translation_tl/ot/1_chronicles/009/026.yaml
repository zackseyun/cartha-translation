base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/026.yaml
  text: For these four mighty gatekeepers[a], who were Levites[b], were entrusted with the chambers and with the storehouses of the house of God.
translation:
  language: tl
  text: Sapagkat ang apat na magigiting na bantay-pinto, na mga Levita, ay pinagkatiwalaan ng pangangasiwa sa mga silid at mga imbakan[a] ng bahay ng Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga kabang-yaman.” Ang Hebreong salita ay maaari ring tumukoy sa mga kayamanang iniimbak o sa mga lugar na pinag-iingatan ng mga ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Nagpapakilala ito ng paliwanag na kaugnay ng naunang pagsasaayos ng mga tungkulin.
- source_word: בֶאֱמוּנָה
  choice: inilagay sa tungkuling ito dahil sa kanilang katapatan
  rationale: Pinananatili nito ang diwa ng אֱמוּנָה bilang katapatan o pagiging mapagkakatiwalaan, habang natural na ipinahahayag ang administratibong konteksto ng ipinagkatiwalang tungkulin.
- source_word: אַרְבַּעַת גִּבֹּרֵי הַשֹּׁעֲרִים
  choice: ang apat na makapangyarihang bantay ng pintuang-daan
  rationale: Ang “makapangyarihan” ay nagpapanatili sa lakas ng גִּבּוֹר, at ang “bantay ng pintuang-daan” ay malinaw na tumutukoy sa tauhan ng templo na nangangasiwa sa mga pasukan.
- source_word: הֵם הַלְוִיִּם
  choice: na mga Levita
  rationale: Natural na appositional na pagkakakilanlan sa Tagalog, nang hindi ipinahihiwatig na lahat ng Levita ay kabilang sa apat.
- source_word: וְהָיוּ עַל
  choice: Sila ang namamahala sa
  rationale: Ipinahahayag ang aktuwal na pangangasiwa at pananagutan nang hindi inuulit ang konsepto ng ipinagkatiwalang tungkulin sa unang pangungusap.
- source_word: הַלְּשָׁכוֹת
  choice: mga silid
  rationale: Karaniwan at malinaw na modernong Tagalog para sa mga silid na kaugnay ng paglilingkod sa templo.
- source_word: הָאֹצְרוֹת
  choice: mga imbakan
  rationale: Sapat na malawak upang tumukoy sa mga lugar na pinaglalagyan ng mga kagamitan, handog, o mahahalagang bagay; ang alternatibong “mga kabang-yaman” ay inilagay sa talababa.
- source_word: בֵּית הָאֱלֹהִים
  choice: bahay ng Diyos
  rationale: Malapit sa pormang Hebreo at pinananatili ang tradisyonal na katawagan sa templo bilang bahay ng Diyos.
