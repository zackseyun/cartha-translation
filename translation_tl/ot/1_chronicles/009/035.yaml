base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/035.yaml
  text: In Gibeon lived Jeiel the father of Gibeon[b][a], and his wife's name was Maacah.
translation:
  language: tl
  text: Sa Gibeon nanirahan si Jeiel[b], ang ama ng Gibeon[a]. Ang pangalan ng asawa niya ay Maaca.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang tagapagtatag ng Gibeon” o “ang pinuno ng Gibeon.” Sa Hebreo, literal na “ang ama ng Gibeon.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ding isulat ang pangalan bilang “Jeuel”; ihambing ang kahawig na tala sa 1 Cronica 8:29.
    reason: textual_variant
lexical_decisions:
- source_word: וּ/בְ/גִבְע֛וֹן
  choice: Sa Gibeon
  rationale: Inihahatid nito nang natural sa Filipino ang lokatibong pariralang “at/sa Gibeon”; hindi na kailangang ilantad ang panimulang pangatnig sa bagong pangungusap.
- source_word: יָשְׁב֥וּ
  choice: nanirahan
  rationale: Ang pandiwang ישב ay tumutukoy rito sa paninirahan. Bagaman maramihan ang anyong Hebreo, sinusundan ito ng pangalang Jeiel sa pormulang talaangkanan; pinananatiling natural sa Filipino ang isahang pagpapahayag.
- source_word: אֲבִֽי גִבְע֖וֹן
  choice: ang ama ng Gibeon
  rationale: Ito ang tuwirang kahulugan ng pariralang Hebreo. Maaaring tumukoy ang “ama” sa tagapagtatag o pinuno ng isang bayan o angkan, kaya inilagay sa talababa ang mga posibleng kahulugang iyon nang hindi nilulutas ang ambiguwidad sa pangunahing teksto.
- source_word: יעואל
  choice: Jeiel
  rationale: Ang Jeiel ang karaniwang anyo ng pangalan batay sa tradisyong pagbasa at sa kahawig na tala sa 1 Cronica 8:29; itinatala sa talababa ang alternatibong Jeuel.
- source_word: וְ/שֵׁ֥ם אִשְׁתּ֖/וֹ
  choice: Ang pangalan ng asawa niya ay
  rationale: Natural at malinaw na Filipino para sa literal na “at ang pangalan ng kanyang asawa,” habang pinananatili ang ugnayang paari.
- source_word: מַעֲכָֽה
  choice: Maaca
  rationale: Karaniwang anyong Filipino ng personal na pangalang Hebreo na Ma‘akah.
theological_decisions: []
translation_notes:
  register: Makabagong, natural, at marangal na Filipino. Ginamit ang “nanirahan” sa halip na mas makalumang “tumahan,” at pinanatili sa pangunahing teksto ang literal at sadyang malabong “ama ng Gibeon,” na may paliwanag sa talababa.
