base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/042.yaml
  text: Ahaz fathered Jarah[a], and Jarah fathered Alemeth, Azmaveth, and Zimri; and Zimri fathered Moza.
translation:
  language: tl
  text: Naging anak ni Ahaz si Jara[a]. Naging mga anak ni Jara sina Alemet, Azmavet, at Zimri; at naging anak ni Zimri si Moza.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa kahilerang talaangkanan sa 1 Cronica 8:36, “Jehoada” ang mababasa sa halip na “Jara.” “Jara” ang mababasa sa mga manuskrito ng Cronica sa talatang ito, kaya iyon ang pinanatili sa pangunahing teksto.
    reason: textual_variant
lexical_decisions:
- source_word: הוֹלִיד
  choice: naging anak ni
  rationale: Sa talaangkanan, ipinapahayag ng Hiphil ng ילד ang pagiging ama o pag-aanak. Ang hulma na “naging anak ni X si Y” ay likas at malinaw sa modernong Filipino, habang pinananatili ang ugnayang ama-anak.
- source_word: יַעְרָה
  choice: Jara
  rationale: Pangalan ng tao; tinumbasan ayon sa bigkas ng anyong Hebreo sa talatang ito, sa halip na ipalit ang pangalan sa kahilerang talaangkanan.
- source_word: עָלֶמֶת
  choice: Alemet
  rationale: Pangalan ng tao; tuwirang transliterasyon na angkop sa ortograpiyang Filipino.
- source_word: עַזְמָוֶת
  choice: Azmavet
  rationale: Pangalan ng tao; ang hulíng katinig ay isina-Filipino bilang t upang higit na tumugma sa bigkas ng Hebreo.
- source_word: זִמְרִי
  choice: Zimri
  rationale: Pangalan ng tao; tuwirang transliterasyon.
- source_word: מוֹצָא
  choice: Moza
  rationale: Pangalan ng tao; tuwirang transliterasyon.
- source_word: וְ
  choice: at
  rationale: Karaniwang pang-ugnay na nagpapatuloy sa sunod-sunod na talaangkanan.
- source_word: אֶת
  choice: '[hindi isinalin]'
  rationale: Pananda ito ng tiyak na tuwirang layon sa Hebreo at walang hiwalay na katumbas na kailangan sa Filipino.
