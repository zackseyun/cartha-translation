translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “mga anak ng mga pari” upang mapanatili ang anyong pampamilya ng Hebreo, at “mabangong timpla” upang hindi labis na tukuyin kung ito ay pamahid, pabango, o ibang kompuwestong aromatiko.
