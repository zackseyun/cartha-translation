  text: And some of the sons of the priests were compounders of the ointment of spices[a].
translation:
  language: tl
  text: At ilan sa mga anak ng mga pari ay mga tagapaghanda ng mabangong timpla ng mga espesya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga tagapaghanda ng mabangong timpla para sa mga mababangong sangkap.”
    reason: Pinananatili ang posibleng pagbasa sa לַבְּשָׂמִים bilang nagsasaad ng layunin o kaugnayan (“para sa”), sa halip na genitibong ugnayan (“ng mga espesya”).
lexical_decisions:
- source_word: וּמִן
  choice: At ang ilan sa
  rationale: 'Ipinahahayag nito nang natural sa Tagalog ang pang-ugnay at partitive na diwa ng Hebreo: may ilan mula sa pangkat na binanggit.'
- source_word: בְּנֵי הַכֹּהֲנִים
  choice: mga anak ng mga pari
  rationale: Pinananatili ang pampamilyang pananalita at genealogical na himig ng Mga Cronica; maaari rin itong tumukoy sa mga kabilang sa mga angkan ng mga pari.
- source_word: רֹקְחֵי
  choice: naghahanda
  rationale: Ang participle ay tumutukoy sa mga taong bihasa sa pagbuo o paghahalo ng isang inihandang kompuwesto. Mas likas sa modernong Tagalog ang pandiwang ito kaysa sa teknikal o makalumang katawagan.
- source_word: הַמִּרְקַחַת
  choice: mabangong timpla
  rationale: Ang pangngalan ay isang pinaghalong preparasyon, maaaring pamahid o pabango. Ang “timpla” ay nagpapanatili sa mas malawak na diwa nang hindi tiyak na ipinapalagay na pamahid ito.
- source_word: לַבְּשָׂמִים
  choice: mula sa mga sangkap na mabango
  rationale: Ang בְּשָׂמִים ay mga aromatikong sangkap o espesya. Ang pariralang ito ay natural sa Tagalog at nauunawaan bilang mga sangkap ng timpla, habang inilalahad sa talababa ang posibleng ibang ugnayan ng לְ.
