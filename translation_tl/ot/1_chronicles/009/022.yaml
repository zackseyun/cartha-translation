    issue: Ang “Itinalaga sila” ay maaaring magpahiwatig lamang ng paghirang.
    rationale: Ang יִסַּד ay pangunahing “itinatag”; bagaman katanggap-tanggap ang paghirang sa konteksto, mas mainam na ipakita ang pagtatatag ng kanilang tungkulin.
  - severity: low
    issue: Ang “ayon sa kanilang angkan” ay mas malawak kaysa genealogical record.
    rationale: Ang הִתְיַחְשָׂם ay tumutukoy sa pagiging nakatala o rehistrado sa pamamagitan ng talaangkanan.
