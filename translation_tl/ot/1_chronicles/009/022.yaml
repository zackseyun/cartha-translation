  text: כֻּלָּ֤/ם הַ/בְּרוּרִים֙ לְ/שֹׁעֲרִ֣ים בַּ/סִּפִּ֔ים מָאתַ֖יִם וּ/שְׁנֵ֣ים עָשָׂ֑ר הֵ֤מָּה בְ/חַצְרֵי/הֶם֙ הִתְיַחְשָׂ֔/ם הֵ֣מָּה יִסַּ֥ד דָּוִ֛יד וּ/שְׁמוּאֵ֥ל הָ/רֹאֶ֖ה בֶּ/אֱמוּנָתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/022.yaml
  text: All these who were chosen as gatekeepers at the thresholds were two hundred and twelve[a]. They were enrolled by genealogy in their villages. David and Samuel the seer established them in their office of trust.
translation:
  language: tl
  text: Ang lahat ng pinili bilang mga tagapagbantay sa mga bungad ay dalawang daan at labindalawa. Nakatala sila ayon sa kanilang talaangkanan sa kani-kanilang mga nayon. Itinatag sila ni David at ni Samuel na tagakita sa kanilang itinakdang tungkulin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Itinatag sila ni David at ni Samuel na tagakita dahil sa kanilang katapatan,” o “itinatag sila sa kanilang katapatan.”'
    reason: Pinananatili ang mga alternatibong kahulugan ng בֶּאֱמוּנָתָם, na maaaring tumukoy sa kanilang itinakdang tungkulin o sa kanilang katapatan.
lexical_decisions:
- source_word: הַבְּרוּרִים
  choice: mga pinili
  rationale: Ipinahahayag ng pasibong anyo ang pagpili sa kanila para sa isang tiyak na gawain nang hindi dinaragdagan kung paano isinagawa ang pagpili.
- source_word: לְשֹׁעֲרִים
  choice: bilang mga bantay sa mga pasukan
  rationale: Ang שֹׁעֵר ay taong nagbabantay ng pintuang-daan o pasukan; malinaw at likas ito sa makabagong Tagalog.
- source_word: בַּסִּפִּים
  choice: sa mga pasukan
  rationale: Bagaman literal na maaaring tumukoy ang סַף sa bungad o pasukan, sa konteksto ay ang mga lugar na binabantayan ang tinutukoy. Mas natural ang “mga pasukan” kaysa “mga bungad” habang pinananatili ang kahulugan.
- source_word: מָאתַיִם וּשְׁנֵים עָשָׂר
  choice: dalawang daan at labindalawa
  rationale: Tuwirang salin ng bilang.
- source_word: בְחַצְרֵיהֶם
  choice: sa kani-kanilang mga nayon
  rationale: Sa konteksto ng talaangkanan at tirahan, ang חָצֵר ay tumutukoy sa mga nayon o pamayanan, hindi sa mga looban ng templo.
- source_word: הִתְיַחְשָׂם
  choice: Nakatala sila ayon sa kanilang angkan
  rationale: Ang hitpael ng יחס ay tumutukoy sa pagkakatala batay sa talaangkanan; malinaw itong naipahahayag ng pariralang ito sa ordinaryong Tagalog.
- source_word: יִסַּד
  choice: Itinalaga
  rationale: Bagaman pangunahing nangangahulugang “itatag,” sa administratibong kontekstong ito ay tumutukoy ito sa paglalagay sa kanila sa isang itinatag na tungkulin. Iniiwasan ng “itinalaga” ang di-likas na pariralang “itinatag sila.”
- source_word: הָרֹאֶה
  choice: tagakita
  rationale: Pinananatili nito ang natatanging katawagang רֹאֶה sa halip na ipantay agad sa “propeta.”
- source_word: בֶּאֱמוּנָתָם
  choice: sa tungkuling ipinagkatiwala sa kanila
  rationale: Inihahatid nito ang posibleng administratibong diwa ng isang mapagkakatiwalaang pananagutan, habang inilalagay sa talababa ang mga posibleng pagbasa tungkol sa kanilang katapatan.
theological_decisions:
- issue: Kahulugan ng בֶּאֱמוּנָתָם sa hulihan ng talata
  choice: Itinalaga sila sa tungkuling ipinagkatiwala sa kanila
  alternative: Itinalaga sila dahil sa kanilang katapatan; o itinalaga sila sa kanilang katapatan
  rationale: Maikli at maraming maaaring kahulugan ang pariralang Hebreo. Ang konteksto ng mga bantay, pagkakatala, at tungkulin ay pumapabor sa administratibong diwa ng ipinagkatiwalang gawain, ngunit pinananatili sa talababa ang tunay na posibilidad na katapatan ang tuwirang tinutukoy.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “tagakita” upang mapanatili ang partikular na titulong Hebreo para kay Samuel. Ang “kani-kanilang mga nayon” ay natural na naghahatid ng distributibong diwa ng kanilang mga tirahan.
