revisions:
- from: Ang lahat ng pinili bilang mga bantay sa mga pasukan ay dalawang daan at labindalawa. Nakatala sila ayon sa kanilang angkan sa kani-kanilang mga nayon. Itinalaga sila ni David at ng tagakitang si Samuel sa tungkuling ipinagkatiwala sa kanila.[a]
  to: Ang lahat ng pinili bilang mga tagapagbantay sa mga bungad ay dalawang daan at labindalawa. Nakatala sila ayon sa kanilang talaangkanan sa kani-kanilang mga nayon. Itinatag sila ni David at ni Samuel na tagakita sa kanilang itinakdang tungkulin.[a]
  rationale: Pinaiigting ng rebisyon ang pagkakatumbas sa pagbanggit ng genealogical registration at sa diwa ng pagtatatag ng tungkulin. Pinanatili nito ang maingat na ambiguity ng pangwakas na pariralang Hebreo sa pamamagitan ng talababa at hindi ito nilulutas bilang isang doktrinal o iisang tiyak na pagbasa.
