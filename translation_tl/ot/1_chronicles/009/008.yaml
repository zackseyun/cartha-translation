translation_notes:
  register: Makabagong Filipino na may marangal at payak na himig. Ginamit ang paulit-ulit na “anak ni” upang malinaw na mapanatili ang bawat salinlahi sa talaan. Ang mga pangalan ay pangunahing ibinatay sa tunog ng tekstong Hebreo, habang kinikilala sa talababa ang mga nakaugaliang alternatibong baybay.
