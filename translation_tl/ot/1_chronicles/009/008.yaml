base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/008.yaml
  text: and Ibneiah son of Jeroham[a], and Elah son of Uzzi, son of Michri, and Meshullam son of Shephatiah, son of Reuel, son of Ibnijah.
translation:
  language: tl
  text: at si Yibneya na anak ni Yeroham[a], si Ela na anak ni Uzi, na anak ni Mikri, at si Meshulam na anak ni Shefatya, na anak ni Reuel, na anak ni Yibniya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang mga pangalang Hebreo ay isinalin-titik, hindi isinalin ayon sa kahulugan. Sa ibang salin, maaaring may ibang baybay ang ilan, gaya ng Jibneiah para sa Yibneya at Raguel para sa Reuel.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ
  choice: at / at si
  rationale: Ang pang-ugnay ay nagdurugtong sa talaan sa naunang konteksto at inuulit kung kailangan upang maging malinaw at natural sa Tagalog.
- source_word: יִבְנְיָה
  choice: Ibneya
  rationale: Pangalang pantangi na isinalin-titik ayon sa anyong Hebreo; hindi binigkas ang panimulang yod bilang hiwalay na katinig sa anyong ito, alinsunod sa isang kinikilalang tradisyon ng pagbabaybay.
- source_word: בֶּן
  choice: anak ni
  rationale: Sa talaangkanan, karaniwang tumutukoy ito sa ugnayang ama at anak. Ang “anak ni” ang likas at tumpak na anyo sa Tagalog.
- source_word: יְרֹחָם
  choice: Yerojam
  rationale: Isinalin-titik ang personal na pangalan mula sa Hebreo, gamit ang “Y” para sa yod at “j” para sa tunog ng titik na chet upang maging madaling bigkasin sa Filipino.
- source_word: אֵלָה
  choice: Ela
  rationale: Direktang salin-titik ng personal na pangalan.
- source_word: עֻזִּי
  choice: Uzi
  rationale: Direktang salin-titik; iisang “z” ang sapat sa karaniwang ortograpiyang Filipino.
- source_word: מִכְרִי
  choice: Mikri
  rationale: Direktang salin-titik na inuuna ang tunog ng Hebreo kaysa sa nakaugaliang pagbabaybay sa Ingles.
- source_word: מְשֻׁלָּם
  choice: Meshulam
  rationale: Direktang salin-titik ng personal na pangalan; pinananatili ang “sh” upang makilala ang katinig na shin.
- source_word: שְׁפַטְיָה
  choice: Shefatya
  rationale: Direktang salin-titik, kabilang ang hulaping -ya na kumakatawan sa teoporikong sangkap ng pangalan.
- source_word: רְעוּאֵל
  choice: Reuel
  rationale: Direktang salin-titik ng Masoretikong anyo; hindi pinili ang tradisyonal na alternatibong “Raguel.”
- source_word: יִבְנִיָּה
  choice: Yibniya
  rationale: Direktang salin-titik ng personal na pangalan; pinananatili ang panimulang yod bilang “Y” at ang hulaping -ya.
