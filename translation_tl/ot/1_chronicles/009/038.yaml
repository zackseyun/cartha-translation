  source_fidelity: Kailangang itama ang unang pangungusap. Ang Hiphil na הוֹלִיד ay ginagawang si Miklot ang ama/tagapag-anak ni Simeam; ang kasalukuyang “naging anak ni Miklot si Simeam” ay naglilipat ng pandiwang pananaw kay Simeam, bagaman ipinahihiwatig pa rin nito ang parehong ugnayan. Ang natitirang pagsasalin ay maayos na naghahatid ng additive na “rin,” ng spatial na kalabuan ng נֶגֶד, at ng inuulit na “kanilang mga kapatid.”
  naturalness: Mas natural at tuwiran sa modernong Filipino ang “Si Miklot ay naging ama ni Simeam.” Inilagay ang “sa Jerusalem” kasunod ng “nanirahan” upang malinaw na ang lugar ng paninirahan, hindi lamang ang mga kapatid, ang tinutukoy nito.
  terminology: Ang mga pangalang “Miklot” at “Simeam” ay maaaring panatilihin ayon sa napiling ortograpiyang Filipino. Ang “mga kapatid” ay wastong literal na katumbas ng אֲחֵיהֶם at hindi dapat palawakin nang walang batayan sa teksto.
