translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Pinanatili ang pag-uulit ng “kanilang mga kapatid” at ang bahagyang kalabuan ng spatial na נֶגֶד. Ginamit ang mga anyong pangalang “Miklot” at “Simeam” na angkop sa ortograpiyang Filipino.
