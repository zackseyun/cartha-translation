  text: וּ/מִקְל֖וֹת הוֹלִ֣יד אֶת שִׁמְאָ֑ם וְ/אַף הֵ֗ם נֶ֧גֶד אֲחֵי/הֶ֛ם יָשְׁב֥וּ בִ/ירֽוּשָׁלִַ֖ם עִם אֲחֵי/הֶֽם־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/038.yaml
  text: Mikloth fathered Shimeam[a]. They also lived opposite their brothers in Jerusalem[b], with their brothers.
translation:
  language: tl
  text: Si Miklot ay naging ama ni Simeam[a]. Sila rin ay nanirahan sa Jerusalem, sa tapat ng kanilang mga kapatid, kasama ng kanilang mga kapatid[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, Simeam; sa ilang salin ay “Simea,” malamang dahil itinugma ito sa mga katulad na anyo ng pangalan sa mga kaagapay na talaangkanan.
    reason: alternative_reading
  - marker: b
    text: O “sa harap ng kanilang mga kapatid” o “malapit sa kanilang mga kapatid.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִקְלוֹת
  choice: At … ni Miklot
  rationale: Ang prefixed conjunction ay isinaling “At” upang mapanatili ang pagpapatuloy ng talaangkanan; ang pangalang מִקְלוֹת ay tinumbasan sa natural na transliterasyong Filipino na “Miklot.”
- source_word: הוֹלִיד
  choice: naging anak ni
  rationale: Sa kontekstong talaangkanan, ipinahihiwatig ng Hiphil ng ילד ang pagiging ama o pag-aanak. Ang hulma na “naging anak ni Miklot si…” ay natural at malinaw sa modernong Tagalog habang pinananatili ang ugnayang ama-anak.
- source_word: אֶת שִׁמְאָם
  choice: si Simeam
  rationale: Hindi isinasalin ang pananda sa tuwirang layon na אֶת. Sinusunod ng “Simeam” ang anyong katinig ng pangalan sa talatang ito sa halip na itugma sa ibang anyong pangtalaangkanan.
- source_word: וְאַף הֵם
  choice: Sila rin
  rationale: Ang “rin” ay natural na naghahatid ng dagdag o emphatic na diwa ng וְאַף; ang paghahati sa bagong pangungusap ay akma sa modernong Tagalog.
- source_word: נֶגֶד
  choice: sa tapat ng
  rationale: Pinananatili ng “sa tapat ng” ang pangunahing spatial na diwa ng נֶגֶד nang hindi tiyakang ginagawang “malapit sa,” bagaman posible rin ang gayong pag-unawa sa konteksto.
- source_word: אֲחֵיהֶם
  choice: kanilang mga kapatid
  rationale: Literal na “kanilang mga kapatid.” Posibleng tumukoy ito sa mga kaanak sa kontekstong pantribo, ngunit hindi pinalalawak ang kahulugan nang walang malinaw na pangangailangan.
- source_word: יָשְׁבוּ
  choice: nanirahan
  rationale: Sa kontekstong ito, ang ישב ay tumutukoy sa paninirahan. Ang “nanirahan” ay dignified at karaniwang modernong Tagalog.
- source_word: בִירוּשָׁלִַם
  choice: sa Jerusalem
  rationale: Karaniwang anyong Filipino ng pangalan ng lugar, kasama ang angkop na pang-ukol.
- source_word: עִם אֲחֵיהֶם
  choice: kasama ng kanilang mga kapatid
  rationale: Ang עִם ay naghahayag ng pagsama o pakikisama. Pinanatili ang pag-uulit ng “kanilang mga kapatid” dahil inuulit din ito sa Hebreo at maaaring nagbibigay-diin sa ugnayang pampamilya at sa magkalapit na paninirahan.
