  source_fidelity: Tumpak sa kabuuan ang salin sa mga kapatid, nayon, pitong-araw na siklo, at demonstratibong pagtukoy sa mga kasalukuyang naglilingkod. Gayunman, ang "upang makasama ng mga ito" ay hindi wastong pagkakabuo sa Filipino at bahagyang ginagawang tahasang layunin ang simpleng "kasama ng mga ito" sa Hebreo.
  naturalness: Hindi likas at hindi balarila ang "makasama ng mga ito." Mas malinaw at natural ang "kasama ng mga ito." Ang "dapat pumunta" ay mas malinaw ring naghahayag ng nakatakdang tungkulin kaysa sa payak na "ay darating."
  terminology: Ang "mga kapatid," "mga nayon," at "mga ito" ay angkop at pinananatili ang antas at saklaw ng tekstong Hebreo.
  issues:
