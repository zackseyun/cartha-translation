  text: And their brothers in their villages were to come in every seven days[a], from time to time[b], with these.
translation:
  language: tl
  text: At ang kanilang mga kapatid na nasa kanilang mga nayon ay dapat pumunta tuwing ikapitong araw[a], sa pana-panahon, kasama ng mga ito.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa loob ng pitong araw.” Malamang na tumutukoy ang pariralang Hebreo sa pitong-araw na pagpapalitan ng tungkulin.
    reason: lexical_alternative
  - marker: b
    text: Ang “mga ito” ay tumutukoy sa mga naglilingkod na nabanggit na.
    reason: referential_clarification
lexical_decisions:
- source_word: וַאֲחֵיהֶם
  choice: At ang kanilang mga kapatid
  rationale: Pinananatili ang literal at panlipunang diwa ng אחים; sa konteksto maaari itong tumukoy sa mga kapwa Levita o kamag-anak.
- source_word: בְּחַצְרֵיהֶם
  choice: na nasa kanilang mga nayon
  rationale: Ang חצר ay maaaring tumukoy sa bakuran, pamayanan, o nayon; dito, ang tirahang nasa labas ng templo ang pinakaangkop na diwa.
- source_word: לָבוֹא
  choice: ay darating
  rationale: Ang infinitibong may ל ay nagpapahiwatig ng nakatakda o inaasahang pagdating; sa Filipino, likas na naipahihiwatig ng hinaharap na anyo ang iskedyul sa konteksto.
- source_word: לְשִׁבְעַת הַיָּמִים
  choice: tuwing ikapitong araw
  rationale: Ipinahahayag ang malamang na pitong-araw na pagitan ng pagpapalit sa tungkulin, habang inilalagay sa talababa ang posibleng kahulugang tagal na pitong araw.
- source_word: מֵעֵת אֶל עֵת
  choice: sa pana-panahon
  rationale: Likas na salin ng idyomang nagsasaad ng paulit-ulit o magkakasunod na takdang pagkakataon.
- source_word: עִם אֵלֶּה
  choice: upang makasama ng mga ito
  rationale: Pinananatili ang demonstratibong 'mga ito' at ipinahahayag sa likas na Filipino ang kaugnayan nila sa mga naglilingkod na nabanggit na.
