translation_notes:
  register: Makabagong Filipino na marangal at madaling maunawaan. Ginamit ang “mga kapatid” sa halip na paliitin agad sa “mga kamag-anak,” at “mga nayon” para sa tirahang kahulugan ng חצר. Ang dalawang talababa ay nagpapanatili sa tunay na temporal at referensiyal na kalabuan ng Hebreo.
