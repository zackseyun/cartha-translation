- from: At ang kanilang mga kapatid na nasa kanilang mga nayon ay darating tuwing ikapitong araw[a], sa pana-panahon, upang makasama ng mga ito.[b]
  to: At ang kanilang mga kapatid na nasa kanilang mga nayon ay dapat pumunta tuwing ikapitong araw[a], sa pana-panahon, kasama ng mga ito.[b]
