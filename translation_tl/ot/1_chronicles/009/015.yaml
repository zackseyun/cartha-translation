base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/015.yaml
  text: and Bakbakkar[a], Heresh, and Galal, and Mattaniah son of Mica, son of Zichri[b], son of Asaph.
translation:
  language: tl
  text: at sina Bakbakar, Heresh, Galal, at Matanya, na anak[a] ni Mika[b], na anak ni Zikri, na anak ni Asaf.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Hebreong salita ay karaniwang nangangahulugang “anak na lalaki,” ngunit sa mga talaangkanan ay maaari rin itong tumukoy sa mas malayong inapo. Dito ay “anak” ang ginamit sa buong hanay.
    reason: lexical_alternative
  - marker: b
    text: Ang anyo ng pangalang Hebreo rito ay Mika; maaari rin itong baybayin na Mica o Micah sa ibang mga salin.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בַקְבַּקַּר
  choice: at sina Bakbakar
  rationale: Isinalin ang pang-ugnay na ו bilang “at” upang ipagpatuloy ang talaan. Ginamit ang “sina” bilang likas na panandang Filipino para sa sunod-sunod na pangalan ng mga tao; ang pangalan ay tinumbasan ayon sa tunog ng Hebreo.
- source_word: חֶרֶשׁ
  choice: Heres
  rationale: Tuwirang transliterasyon ng pangalang Hebreo sa baybay na madaling basahin sa Filipino; ang hulíng שׁ ay tinumbasan ng “s.”
- source_word: וְ/גָלָל
  choice: Galal
  rationale: Pinanatili ang pangalan sa anyong malapit sa Hebreo. Ang pang-ugnay ay ipinahayag sa likas na seryeng Filipino sa pamamagitan ng mga kuwit at ng “at” bago ang huling pangalan.
- source_word: וּ/מַתַּנְיָה
  choice: at Matanya
  rationale: Isinalin ang pang-ugnay at ginamit ang “Matanya,” isang anyong malapit sa bigkas ng Hebreong מַתַּנְיָה at natural basahin sa Filipino.
- source_word: בֶּן
  choice: anak ni
  rationale: Ang בֶּן ay literal na “anak na lalaki,” ngunit sa Filipino ay sapat at mas likas ang “anak ni.” Pinanatili ang sunod-sunod na ugnayang pangangkan sa halip na gawing pangkalahatang “inapo.”
- source_word: מִיכָא
  choice: Mika
  rationale: Sinunod ang tiyak na anyong Hebreo rito at ginamit ang baybay na angkop sa Filipino.
- source_word: זִכְרִי
  choice: Zikri
  rationale: Malapit na transliterasyon ng pangalang Hebreo gamit ang malinaw na baybay sa Filipino.
- source_word: אָסָף
  choice: Asaf
  rationale: Malapit na transliterasyon ng pangalang Hebreo; ang pangwakas na פ ay binibigkas na /f/.
theological_decisions:
- issue: Saklaw ng בֶּן sa talaangkanan
  choice: Isinalin bilang “anak ni” sa bawat antas ng hanay.
  alternative: “inapo ni”
  rationale: Karaniwang nangangahulugang “anak” ang בֶּן sa ganitong hanay, ngunit hindi inaalis ng salin ang posibilidad na mas malawak ang gamit nito sa talaangkanan; ipinaliwanag ito sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “sina” upang maging natural ang talaan ng mga pangalan, habang pinanatili ang pagkakasunod-sunod at istruktura ng talaangkanan sa Hebreo.
