  text: and Gedor[a], and Ahio, and Zechariah, and Mikloth.
translation:
  language: tl
  text: at sina Gedor, Ahio, Zacarias, at Miklot.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/גְד֣וֹר
  choice: at sina Gedor
  rationale: Ang pangalang pantangi ay tinumbasan sa karaniwang anyong Filipino, at ang prefiks na וּ ay isinaling “at.” Ginamit ang “sina” bago ang talaan ng mga pangalan upang maging natural sa Tagalog.
- source_word: וְ/אַחְי֔וֹ
  choice: Ahio
  rationale: Pinanatili ang transliterasyon ng pangalang pantangi; saklaw na ito ng pangmaramihang pantukoy na “sina” sa simula ng talaan.
- source_word: וּ/זְכַרְיָ֖ה
  choice: Zacarias
  rationale: Ginamit ang matagal nang kinikilalang anyong Filipino ng pangalang Hebreo na זְכַרְיָה, sa halip na isang mahigpit na ponetikong transliterasyon.
- source_word: וּ/מִקְלֽוֹת
  choice: at Miklot
  rationale: Isinalin ang prefiks na וּ bilang “at” upang markahan ang huling pangalan sa talaan. Ang Miklot ay malapit sa anyong Hebreo at natural basahin sa Filipino.
theological_decisions: []
translation_notes:
  register: Maikli at dignified na modernong Filipino. Ginamit ang “sina” bilang natural na pantukoy sa magkakasunod na pangalan ng mga tao, habang pinanatili ang bawat pangalang pantangi.
