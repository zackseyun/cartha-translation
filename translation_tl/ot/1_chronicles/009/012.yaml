  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/עֲדָיָה֙ בֶּן יְרֹחָ֔ם בֶּן פַּשְׁח֖וּר בֶּן מַלְכִּיָּ֑ה וּ/מַעְשַׂ֨י בֶּן עֲדִיאֵ֧ל בֶּן יַחְזֵ֛רָה בֶּן מְשֻׁלָּ֥ם בֶּן מְשִׁלֵּמִ֖ית בֶּן אִמֵּֽר־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/012.yaml
  text: and Adaiah son of Jeroham[a], son of Pashhur, son of Malchijah, and Maasai son of Adiel, son of Jahzerah, son of Meshullam, son of Meshillemith, son of Immer.
translation:
  language: tl
  text: at si Adaya na anak ni Jeroham, na anak ni Pashur, na anak ni Malkias; at si Maasai na anak ni Adiel, na anak ni Jahzerah, na anak ni Mesulam, na anak ni Mesilemit[a], na anak ni Imer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang pangalang Hebreo na מְשִׁלֵּמִית ay isinalin-titik na “Mesilemit” dito; lumilitaw sa ibang talata ang kaugnay na anyong “Mesilemot.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַ/עֲדָיָה
  choice: at si Adaya
  rationale: Isinalin ang pang-ugnay na ו bilang “at” upang ipagpatuloy ang talaan mula sa naunang talata; isinalin-titik ang pangalan ayon sa bigkas na angkop sa Filipino.
- source_word: בֶּן
  choice: anak ni
  rationale: Sa talaangkanan, ang בֶּן ay likas na isinasaling “anak ni.” Pinananatili nito ang anyo ng Hebreo kahit maaari itong tumukoy kung minsan sa isang mas malayong inapo.
- source_word: יְרֹחָם
  choice: Jeroham
  rationale: Isinalin-titik ang pangalang Hebreo sa anyong madaling basahin sa Filipino.
- source_word: פַּשְׁחוּר
  choice: Pashur
  rationale: Ang “Pashur” ay malapit sa anyong Hebreo at natural basahin sa Filipino.
- source_word: מַלְכִּיָּה
  choice: Malkias
  rationale: Isinalin-titik ang pangalan sa anyong Filipino; ang hulaping -yah ng Hebreo ay kinakatawan ng pamilyar na hulaping -ias sa mga pangalang biblikal sa Filipino.
- source_word: וּ/מַעְשַׂי
  choice: at si Maasai
  rationale: Isinalin ang ו bilang “at” at pinanatili ang mas maikling anyo ng pangalang nasa tekstong Masoretiko, sa halip na iugnay ito sa mas mahabang Maaseias.
- source_word: עֲדִיאֵל
  choice: Adiel
  rationale: Direktang salin-titik ng pangalang Hebreo.
- source_word: יַחְזֵרָה
  choice: Jahzera
  rationale: Salin-titik na malapit sa Hebreo at sumusunod sa nakasanayang paggamit ng J sa mga pangalang biblikal sa Filipino.
- source_word: מְשֻׁלָּם
  choice: Mesulam
  rationale: Isinalin-titik ang pangalan gamit ang “s” para sa tunog na שׁ, ayon sa karaniwang baybay-Filipino.
- source_word: מְשִׁלֵּמִית
  choice: Mesilemit
  rationale: Sinusunod ang mismong anyo ng pangalang nasa tekstong Masoretiko rito, na nagtatapos sa -it, sa halip na ang kaugnay na anyong nagtatapos sa -ot.
- source_word: אִמֵּר
  choice: Imer
  rationale: Direktang salin-titik ng pangalang Hebreo sa baybay na natural sa Filipino.
theological_decisions: []
