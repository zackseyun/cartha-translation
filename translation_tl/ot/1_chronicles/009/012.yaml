  register: Gumamit ng moderno, malinaw, at marangal na Filipino. Ang paulit-ulit na “anak ni” ay sadyang pinanatili upang maipakita ang sunod-sunod na ugnayang pangangkanan sa Hebreo. Inilagay ang talababa pagkatapos ng “Mesilemit,” ang pangalang tunay na tinutukoy nito.
