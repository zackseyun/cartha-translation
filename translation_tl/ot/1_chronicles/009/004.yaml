  yaml_path: translation/ot/1_chronicles/009/004.yaml
  text: Uthai son of Ammihud[a], son of Omri, son of Imri, son of Bani, from the sons of Perez son of Judah.
translation:
  language: tl
  text: Si Utai ay anak ni Amihud, anak ni Omri, anak ni Imri, anak ni Bani[a], mula sa mga anak ni Perez, na anak ni Juda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mahirap tiyakin ang tekstong Hebreo rito. Ang salitang isinaling “Bani” ay maaari ring basahing “mula sa,” kaya magiging: “anak ni Imri, mula sa mga anak ni Perez, na anak ni Juda.” Sinusunod ng pangunahing teksto ang pagbasa bilang pangalan dahil ito ang higit na angkop sa sunod-sunod na mga pangalan.'
    reason: textual_variant
lexical_decisions:
- source_word: עוּתַי
  choice: Utai
  rationale: Isinalin sa baybay na angkop sa modernong Filipino habang pinananatili ang pagkakakilanlan ng pangalang Hebreo.
- source_word: בֶּן
  choice: anak ni
  rationale: Ito ang tuwirang at likas na katumbas sa Filipino sa talaangkanan; maaari ring tumukoy sa inapo kapag pinaikli ang mga salinlahi.
- source_word: עַמִּיהוּד
  choice: Amihud
  rationale: Transliterasyon ng pangalang pantangi sa baybay na madaling basahin sa Filipino.
- source_word: עָמְרִי
  choice: Omri
  rationale: Pinanatili ang nakaugaliang anyo ng pangalang pantangi.
- source_word: אִמְרִי
  choice: Imri
  rationale: Transliterasyon ng pangalang pantangi.
- source_word: בני/מן
  choice: Bani
  rationale: Sinusunod ng pangunahing teksto ang pagbasa bilang pangalang pantangi sapagkat angkop ito sa sunod-sunod na pangalan sa talaangkanan; inilalahad sa talababa ang posibleng pagbasa na 'mula sa.'
- source_word: בְּנֵי
  choice: mga anak ni
  rationale: Pinananatili ang anyong pangangkanan ng Hebreo; sa konteksto, tumutukoy ito sa mga inapo o angkan.
- source_word: פֶרֶץ
  choice: Perez
  rationale: Transliterasyon ng pangalang pantangi sa karaniwang anyong Filipino.
- source_word: יְהוּדָה
  choice: Juda
  rationale: Ginamit ang nakaugaliang anyong Filipino ng pangalan.
