  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/הֵ֨ם וּ/בְנֵי/הֶ֜ם עַל הַ/שְּׁעָרִ֧ים לְ/בֵית יְהוָ֛ה לְ/בֵ֥ית הָ/אֹ֖הֶל לְ/מִשְׁמָרֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/023.yaml
  text: They and their sons were over the gates of the house of Yahweh[a], that is, the house of the tent, as guards.
translation:
  language: tl
  text: Sila at ang kanilang mga anak na lalaki ang namamahala sa mga pintuang-daan ng bahay ni Yahweh—ang bahay ng tolda—bilang mga bantay.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin ang “bahay ng tolda” na “bahay ng tabernakulo.” Sa Hebreo, “bahay ng tolda.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵם
  choice: Sila
  rationale: Ang panghalip ang muling nagpapakilala sa simuno; hindi kailangang panatilihin ang panimulang pangatnig upang maging natural sa Tagalog.
- source_word: וּבְנֵיהֶם
  choice: at ang kanilang mga anak na lalaki
  rationale: Sa konteksto ng minanang tungkulin ng mga bantay-pinto, tumutukoy ang בנים sa mga lalaking anak o inapo; nilinaw ang kasarian nang hindi ginagawang teknikal ang pananalita.
- source_word: עַל הַשְּׁעָרִים
  choice: ang namamahala sa mga pintuang-daan
  rationale: Sa kontekstong ito, ipinahihiwatig ng עַל ang pananagutan o pangangasiwa, hindi lamang ang pisikal na pagkakatayo sa mga pintuan.
- source_word: לְבֵית יְהוָה
  choice: ng bahay ni Yahweh
  rationale: Iniuugnay ng parirala ang mga pintuang-daan sa bahay o santuwaryo ni Yahweh; pinanatili ang banal na pangalan bilang Yahweh.
- source_word: לְבֵית הָאֹהֶל
  choice: ang bahay ng tolda
  rationale: Malapit itong sumusunod sa Hebreong parirala at pinananatili ang ugnayan at tensiyon sa pagitan ng bahay at toldang santuwaryo, sa halip na agad itong ipakahulugang tabernakulo.
- source_word: לְמִשְׁמָרוֹת
  choice: bilang mga bantay
  rationale: Malinaw at natural nitong ipinapahayag ang tungkulin sa pagbabantay na tinutukoy ng pangngalan.
theological_decisions:
- issue: Ugnayan ng “bahay ni Yahweh” at “bahay ng tolda”
  choice: Iniharap ang ikalawang parirala bilang paglilinaw o appositive sa una sa pamamagitan ng gitling, habang pinananatili ang dalawang katawagan.
  alternative: Isalin ang “bahay ng tolda” bilang “tabernakulo,” o ituring ang dalawang parirala bilang dalawang magkaibang lugar.
  rationale: Malamang na iniuugnay ng teksto ang paglilingkod sa bahay ni Yahweh sa naunang toldang santuwaryo. Pinananatili ng salin ang ugnayang ito nang hindi lubusang nilulutas ang posibleng kahulugan.
translation_notes:
  register: Makabago at marangal na Filipino. Ginamit ang “pintuang-daan” para sa mga tarangkahan ng santuwaryo at “namamahala” upang natural na ipahayag ang pananagutan. Ang gitling ay nagpapakitang ang “bahay ng tolda” ay paglilinaw sa “bahay ni Yahweh” nang hindi labis na nagpapakahulugan.
