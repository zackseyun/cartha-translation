  yaml_path: translation/ot/1_chronicles/009/009.yaml
  text: And their brothers[a], according to their generations, were nine hundred and fifty-six[b]. All these men were heads of fathers’ houses in their fathers’ households.
translation:
  language: tl
  text: At ang kanilang mga kamag-anak, ayon sa kanilang mga talaangkanan[a], ay 956. Lahat ng lalaking ito ay mga pinuno ng mga angkan sa mga sambahayan ng kanilang mga ninuno[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ayon sa kanilang mga salinlahi.” Ang salitang Hebreo ay tumutukoy sa mga linya ng angkan o sa mga tala ng pamilya.
    reason: lexical_alternative
  - marker: b
    text: Ang Hebreo ay gumagamit ng isang teknikal na katawagang nangangahulugang “mga pinuno ng mga sambahayan ng mga ama”; tumutukoy ito sa mga angkang sinusundan sa ama.
    reason: cultural_note
lexical_decisions:
- source_word: וַאֲחֵיהֶם
  choice: At ang mga kamag-anak nila
  rationale: Bagaman karaniwang nangangahulugang “mga kapatid” ang אָח, mas malawak ang gamit nito sa kontekstong panlipi at talaangkanan at maaaring tumukoy sa mga kaangkan o kamag-anak.
- source_word: לְתֹלְדוֹתָם
  choice: ayon sa kanilang talaangkanan
  rationale: Sa kontekstong ito, ang תּוֹלְדוֹת ay tumutukoy sa mga linya ng angkan o mga tala ng salinlahi; natural at malinaw sa makabagong Filipino ang “talaangkanan.”
- source_word: תְּשַׁע מֵאוֹת וַחֲמִשִּׁים וְשִׁשָּׁה
  choice: '956'
  rationale: Tuwirang bilang ito; ginamit ang mga numero para sa malinaw at madaling pagbasa.
- source_word: כָּל אֵלֶּה אֲנָשִׁים
  choice: Ang lahat ng lalaking ito
  rationale: Tumutukoy ang panlalaking pangmaramihang אֲנָשִׁים sa mga lalaking kabilang sa talaangkanan.
- source_word: רָאשֵׁי אָבוֹת
  choice: mga pinuno ng mga angkan
  rationale: Isa itong teknikal na katawagang panlipi para sa mga lalaking namumuno sa mga pangkat na nakabatay sa lahi ng ama; mas natural sa Filipino ang “mga pinuno ng mga angkan” kaysa sa literal na “mga ulo ng mga ama.”
- source_word: לְבֵית אֲבֹתֵיהֶם
  choice: sa kani-kanilang sambahayan ng mga ninuno
  rationale: Pinananatili nito ang ideya ng mas malawak na sambahayan o yunit ng angkan na sinusundan ayon sa lahi ng mga ninuno.
