  register: Makabago, malinaw, at marangal na Filipino. Pinili ang “mga kamag-anak” upang maipahayag ang malawak na kahulugan ng terminong pangkamag-anakan sa kontekstong panlipi, at ang mga talababa ay inilagay sa mismong mga pariralang ipinaliliwanag ng mga ito.
