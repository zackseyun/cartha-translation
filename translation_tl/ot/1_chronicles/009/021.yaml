  yaml_path: translation/ot/1_chronicles/009/021.yaml
  text: Zechariah son of Meshelemiah was gatekeeper at the entrance to the tent of meeting[a].
translation:
  language: tl
  text: Si Zacarias na anak ni Meselemias ang bantay sa pasukan ng Toldang Tipanan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “bantay sa pintuan ng Toldang Tipanan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: זְכַרְיָה
  choice: Zacarias
  rationale: Ginamit ang nakaugaliang anyo ng pangalang biblikal sa Tagalog sa halip na isalin ang kahulugan nito.
- source_word: בֶּן
  choice: anak ni
  rationale: Sa kontekstong talaangkanan, ang karaniwang kahulugang tuwirang anak ang pinakamalamang.
- source_word: מְשֶׁלֶמְיָה
  choice: Meselemias
  rationale: Isinatinig ang personal na pangalan ayon sa nakaugaliang anyong biblikal sa Tagalog.
- source_word: שֹׁעֵר
  choice: bantay
  rationale: Tumutukoy ito sa taong nagbabantay ng isang pasukan; natural at malinaw ang 'bantay' sa modernong Tagalog.
- source_word: פֶּתַח
  choice: pasukan
  rationale: Tiyak at likas na katumbas ito ng bukana o lugar na dinaraanan papasok.
- source_word: לְאֹהֶל
  choice: ng Tolda
  rationale: Ang ל ay inuunawa rito bilang ugnayang nagdurugtong sa 'pasukan' at sa tolda; idiomatiko sa Tagalog ang 'pasukan ng.'
- source_word: מוֹעֵד
  choice: Tipanan
  rationale: Sa nakapirming katawagang אֹהֶל מוֹעֵד, pinili ang kinikilalang Tagalog na pangalang 'Toldang Tipanan,' na tumutukoy sa santuwaryong dako ng itinakdang pakikipagtagpo.
- source_word: אֹהֶל מוֹעֵד
  choice: Toldang Tipanan
  rationale: Pamilyar at marangal na katawagang Tagalog ito para sa santuwaryo, habang nananatiling mas malapit sa larawang 'tolda' kaysa sa salitang 'tabernakulo.'
