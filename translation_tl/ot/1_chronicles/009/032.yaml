  source_fidelity: 'Ang pangunahing diwa ay naipapahayag nang tapat: ilang Kohatita ang may pananagutan sa tinapay na nakahanay at inihahanda ito sa bawat Sabbath. Gayunman, ang “mula sa kanilang mga kapatid” ay hindi likas ang pagkakaugnay at hindi malinaw kung sino ang tinutukoy; kailangan itong isaayos habang pinananatili ang pangkan/partitibong diwa ng Hebreo. Ang “tinapay na inayos” ay maaari ring magmukhang tinapay na basta inihanda, sa halip na tinapay na inilatag nang may kaayusan.'
  naturalness: Marangal ang rehistro, ngunit mas natural sa modernong Filipino ang “ilan sa kanilang mga kapatid na mula sa angkan ni Kohat” kaysa sa pagsisingit ng “mula sa kanilang mga kapatid” pagkatapos ng “mga anak ni Kohat.” Ang “tuwing Araw ng Pamamahinga” ay malinaw at natural para sa distributibong “Sabbath by Sabbath.”
  terminology: Ang “Araw ng Pamamahinga” ay angkop na katumbas ng Sabbath. Para sa לֶחֶם הַמַּעֲרָכֶת, ang “tinapay na inilalatag nang maayos” ay mas malinaw na nagpapakita ng paglalatag o pagkakaayos. Pinanatili sa talababa ang mga tradisyonal na katawagang “tinapay na handog” at “tinapay ng Presensya” bilang mga alternatibo, hindi bilang sapilitang pagpapakahulugan.
