base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/032.yaml
  text: And some of the sons of the Kohathites[a], from among their brothers, were in charge of the bread of the arrangement, to prepare it Sabbath by Sabbath.
translation:
  language: tl
  text: At ilan sa kanilang mga kapatid na mula sa angkan ni Kohat[a] ang namamahala sa tinapay na inilalatag nang maayos, upang ihanda ito tuwing Araw ng Pamamahinga.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “mga mula sa angkan ni Kohat” ay mga Kohatita. Ang “tinapay na inilalatag nang maayos” ay tradisyonal ding tinatawag na “tinapay na handog” o “tinapay ng Presensya.” Literal itong tumutukoy sa tinapay na isinaayos o inilatag nang may kaayusan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִן
  choice: At ang ilan sa
  rationale: Ipinahihiwatig ng pang-ukol ang isang bahagi ng mas malaking pangkat; likas na ipinapahayag ito sa Filipino ng “ang ilan sa.”
- source_word: בְּנֵי הַקְּהָתִי
  choice: mga anak ni Kohat
  rationale: Pinananatili nito ang pampamilya at pangkan na pananalita ng Hebreo habang malinaw na tumutukoy sa mga kabilang sa angkan ni Kohat.
- source_word: מִן אֲחֵיהֶם
  choice: mula sa kanilang mga kapatid
  rationale: Malapit ito sa tahasang “kanilang mga kapatid” ng Hebreo at, sa konteksto, tumutukoy sa mga kapwa Levita.
- source_word: עַל
  choice: ang namamahala sa
  rationale: Sa kontekstong pangtungkulin, ipinapahayag ng עַל ang pananagutan o pangangasiwa.
- source_word: לֶחֶם הַמַּעֲרָכֶת
  choice: tinapay na inayos
  rationale: Ipinapakita nito ang literal na diwa ng tinapay na isinaayos o inilatag, nang hindi umaasa sa tradisyonal ngunit hindi agad malinaw na terminong “tinapay na handog.”
- source_word: לְהָכִין
  choice: upang ihanda iyon
  rationale: Ipinapahayag ng pawatas ang layunin ng kanilang tungkulin; ang “iyon” ay tumutukoy sa tinapay na binanggit.
- source_word: שַׁבַּת שַׁבָּת
  choice: sa bawat Araw ng Pamamahinga
  rationale: Ang pag-uulit sa Hebreo ay distributibo, kaya likas na ipinahahayag sa modernong Filipino bilang “sa bawat Araw ng Pamamahinga.”
