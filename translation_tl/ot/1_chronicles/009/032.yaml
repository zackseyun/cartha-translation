    rationale: Ang ikalawang partitibong parirala sa Hebreo ay tumutukoy sa mga kapatid/kapanalig na pangkan, ngunit ang kasalukuyang ayos sa Filipino ay maaaring magmukhang ang mga anak ni Kohat ay literal na nagmula sa kanilang sariling mga kapatid. Iniaayos ito bilang isang malinaw na paglalarawan ng pangkat.
  - severity: low
    issue: Ang “tinapay na inayos” ay maaaring hindi sapat na maipahiwatig ang teknikal na diwa ng tinapay na inilatag o nakaayos sa hanay.
    rationale: Ang מַעֲרָכֶת ay tumutukoy sa kaayusan o pagkakalatag. Ang “inilalatag nang maayos” ay nananatiling malapit sa literal na diwa at mas malinaw sa Filipino.
