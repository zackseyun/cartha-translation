  to: At si Shallum na anak ni Kore, na anak ni Ebiasaf, na anak ni Korah, at ang kanyang mga kapatid, na kabilang sa sambahayan ng kanyang ama—ang mga Korahita—ang namamahala sa gawain ng paglilingkod bilang mga bantay sa mga bungad[a] ng tolda. Ang kanilang mga ninuno naman ang namamahala noon sa kampo ni Yahweh[b] bilang mga bantay sa pasukan.
