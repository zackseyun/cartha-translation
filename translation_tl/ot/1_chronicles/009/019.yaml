  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/שַׁלּ֣וּם בֶּן ק֠וֹרֵא בֶּן אֶבְיָסָ֨ף בֶּן קֹ֜רַח וְֽ/אֶחָ֧י/ו לְ/בֵית אָבִ֣י/ו הַ/קָּרְחִ֗ים עַ֚ל מְלֶ֣אכֶת הָ/עֲבוֹדָ֔ה שֹׁמְרֵ֥י הַ/סִּפִּ֖ים לָ/אֹ֑הֶל וַ/אֲבֹֽתֵי/הֶם֙ עַל מַחֲנֵ֣ה יְהוָ֔ה שֹׁמְרֵ֖י הַ/מָּבֽוֹא־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/019.yaml
  text: And Shallum son of Kore[a], son of Ebiasaph, son of Korah, and his brothers from his father’s house, the Korahites, were over the work of the service, keepers of the thresholds of the tent; and their fathers had been over the camp of Yahweh[b], keepers of the entrance.
translation:
  language: tl
  text: At si Shallum na anak ni Kore, na anak ni Ebiasaf, na anak ni Korah, at ang kanyang mga kapatid, na kabilang sa sambahayan ng kanyang ama—ang mga Korahita—ang namamahala sa gawain ng paglilingkod bilang mga bantay sa mga bungad[a] ng tolda. Ang kanilang mga ninuno naman ang namamahala noon sa kampo ni Yahweh[b] bilang mga bantay sa pasukan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “mga threshold ng tolda”; maaari ring unawain na “mga bantay sa mga pasukan ng tolda.”
    reason: lexical_alternative
  - marker: b
    text: Ang YHWH ay personal na pangalan ng Diyos sa Hebreo; tradisyonal itong kinakatawan ng “PANGINOON.”
    reason: alternative_reading
lexical_decisions:
- source_word: וְשַׁלּוּם
  choice: At si Shallum
  rationale: Pinananatili ng “At” ang payak na pagkakaugnay ng talata sa naunang talaan.
- source_word: בֶּן ... בֶּן ... בֶּן
  choice: anak ni ... na anak ni ... na anak ni
  rationale: Tuwirang pinananatili ang paulit-ulit na pormulang pangangkan sa paraang natural sa Tagalog.
- source_word: וְאֶחָיו לְבֵית אָבִיו
  choice: at ang kanyang mga kapatid mula sa sambahayan ng kanyang ama
  rationale: Pinananatili ang “mga kapatid” at ang diwa ng pagkakabilang sa angkan o sambahayang nagmula sa ama.
- source_word: הַקָּרְחִים
  choice: ang mga Korahita
  rationale: Malinaw na tumutukoy sa mga kabilang sa angkan ni Korah.
- source_word: עַל מְלֶאכֶת הָעֲבוֹדָה
  choice: ang namamahala sa gawain ng paglilingkod
  rationale: Ipinahahayag ang pananagutan o pangangasiwang tinutukoy ng עַל, habang iniiwasan ang makabagong konotasyong eklesyal ng “ministeryo.”
- source_word: שֹׁמְרֵי הַסִּפִּים לָאֹהֶל
  choice: bilang mga bantay sa mga pintuan ng tolda
  rationale: Ang “mga pintuan” ay likas at malinaw sa Tagalog para sa tungkuling pagbabantay sa mga threshold; inilalagay sa talababa ang mas literal na larawan. Ang “tolda” ay nagpapanatili sa payak na אֹהֶל nang hindi ito ginagawang mas teknikal na “tabernakulo.”
- source_word: וַאֲבֹתֵיהֶם
  choice: Ang kanilang mga ninuno naman
  rationale: Sa paglingon sa mas naunang panahon, mas malinaw sa modernong Tagalog ang “mga ninuno” kaysa literal na “mga ama,” na maaaring mapagkamalang kanilang mga agarang ama lamang.
- source_word: עַל מַחֲנֵה יְהוָה
  choice: ang namamahala noon sa kampo ni Yahweh
  rationale: Ang “namamahala noon” ay nagpapakita ng dating tungkulin at inuulit ang diwa ng pangangasiwa; pinananatili ang personal na pangalang Yahweh.
- source_word: שֹׁמְרֵי הַמָּבוֹא
  choice: bilang mga bantay sa pasukan
  rationale: Pinananatili ang isahang “pasukan” ng Hebreo at ang pag-uulit ng tungkuling pagbabantay.
theological_decisions:
- issue: Pag-render sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo, kaya ginagamit ang transliterasyong “Yahweh” sa halip na palitan ito ng isang titulo.
- issue: Antas ng pagpapakahulugan sa אֹהֶל
  choice: tolda
  alternative: tabernakulo
  rationale: “Tolda” ang tuwirang kahulugan ng salita. Hinahayaang manatiling pahiwatig sa konteksto ang kaugnayan nito sa santuwaryo.
- issue: Paglalarawan sa הַסִּפִּים
  choice: mga pintuan sa pangunahing teksto, na may literal na paliwanag sa talababa
  alternative: mga bungad; mga threshold
  rationale: Tinutukoy ng salita nang literal ang mga threshold, ngunit sa konteksto ay tungkulin itong pagbabantay sa mga daanan ng tolda. Ang “mga pintuan” ay natural at malinaw, habang pinananatili ng talababa ang kongkretong larawang Hebreo.
translation_notes:
  register: 'Makabago, malinaw, at marangal na Filipino. Ginamit ang “sambahayan ng kanyang ama” para sa estrukturang pang-angkan, “paglilingkod” sa halip na “ministeryo,” at “mga ninuno” upang maging malinaw ang paglingon sa sinaunang tungkulin. Pinanatili ang dalawang magkaugnay ngunit hindi magkaparehong parirala: “mga pintuan ng tolda” at “pasukan.”'
