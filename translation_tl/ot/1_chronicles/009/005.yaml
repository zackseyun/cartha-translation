translation_notes:
  register: Makabago ngunit marangal na Filipino, na pinananatili ang maikli at talaang anyo ng Hebreo. Ginamit ang “mga anak na lalaki” para sa tiyak na kasarian ng בָּנִים at inilagay ang talababa matapos ang buong parirala.
