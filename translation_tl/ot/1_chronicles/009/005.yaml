  source_fidelity: 'Tapat ang salin sa Hebreo: naipapahayag ang pandugtong na וּ־, ang kolektibong gamit ng gentiliko sa talaan ng angkan, ang pangalang עֲשָׂיָה, ang katayuang הַבְּכוֹר bilang “panganay,” at ang tiyak na “mga anak na lalaki” para sa בָּנָיו.'
