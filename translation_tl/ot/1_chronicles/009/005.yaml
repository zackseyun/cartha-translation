base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/005.yaml
  text: 'And from the Shilonites: Asaiah the firstborn and his sons[a].'
translation:
  language: tl
  text: 'At mula sa mga Silonita: si Asaias na panganay, at ang kanyang mga anak na lalaki.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O maaaring “mga Selonita,” ayon sa ibang tradisyonal na pagkakakilanlan sa pangalan ng angkang ito.
    reason: alternative_reading
lexical_decisions:
- source_word: וּ/מִן
  choice: At mula sa
  rationale: Pinananatili ng “At” ang pandugtong at pandagdag na diwa ng waw sa talaan, samantalang tuwirang isinasalin ng “mula sa” ang preposisyon.
- source_word: הַ/שִּׁילוֹנִי
  choice: mga Silonita
  rationale: Bagaman anyong isahan ang gentiliko sa Hebreo, kolektibo ang gamit nito sa konteksto ng talaan ng mga angkan; natural sa Filipino ang maramihang “mga Silonita.”
- source_word: עֲשָׂיָה
  choice: Asaias
  rationale: Pangalan ito ng tao at tinumbasan sa anyong karaniwang ginagamit sa tradisyong Filipino ng mga pangalang biblikal.
- source_word: הַ/בְּכֹר
  choice: na panganay
  rationale: Ang “panganay” ay likas at eksaktong katumbas ng katayuang pampamilya na tinutukoy ng Hebreong בְּכוֹר.
- source_word: וּ/בָנָיו
  choice: at ang kanyang mga anak na lalaki
  rationale: Tahasan nitong pinananatili ang kahulugang “mga anak na lalaki,” hindi lamang ang mas malawak na “mga anak,” at ang waw ay isinaling “at.”
