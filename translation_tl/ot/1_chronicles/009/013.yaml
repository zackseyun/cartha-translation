base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/013.yaml
  text: And their brothers[a], heads of their fathers’ houses[c][b], were 1,760 mighty men of valor for the work of the service of the house of God.
translation:
  language: tl
  text: Ang kanilang mga kapatid[a]—mga pinuno ng kani-kanilang sambahayan ayon sa angkan ng kanilang mga ninuno—ay may bilang na 1,760, mga lalaking magigiting at may kakayahan[b] para sa gawain ng paglilingkod sa bahay ng Diyos.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga kamag-anak sa angkan.” Ang salitang Hebreo para sa “mga kapatid” ay maaari ring tumukoy sa mas malawak na ugnayan sa angkan, hindi lamang sa magkakapatid sa iisang magulang.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “mga magigiting na lalaki” o “mga lalaking malalakas at may kakayahan.” Ang ekspresyong Hebreo ay nagpapahiwatig ng lakas, kagitingan, o napatunayang kakayahan; sa kontekstong ito, hindi ito kinakailangang tumukoy sa pakikidigma.
    reason: lexical_alternative
  - marker: c
    text: Ang “bahay ng Diyos” ay tumutukoy sa templo.
    reason: clarification
lexical_decisions:
- source_word: וַאֲחֵיהֶם
  choice: Ang kanilang mga kapatid
  rationale: Pinananatili ang karaniwang kahulugan ng אָח at ang diwang pampamilya; nililinaw sa talababa na maaari rin itong tumukoy sa mas malawak na mga kamag-anak sa angkan.
- source_word: רָאשִׁים לְבֵית אֲבוֹתָם
  choice: mga pinuno ng kani-kanilang sambahayan ng mga ninuno
  rationale: Ipinapahayag ang genealogical at administratibong idyoma ng ‘bahay ng mga ama’ sa natural na makabagong Tagalog nang hindi ito pinapantay lamang sa ‘mga pamilya.’
- source_word: אֶלֶף וּשְׁבַע מֵאוֹת וְשִׁשִּׁים
  choice: 1,760
  rationale: Tuwirang kabuuan ito ng bilang sa Hebreo at gumagamit ng karaniwang modernong pagsulat ng numero.
- source_word: גִּבּוֹרֵי חֵיל
  choice: mga lalaking may pambihirang kakayahan
  rationale: Sa konteksto ng paglilingkod sa templo, ang parirala ay higit na tumutukoy sa lakas, husay, o napatunayang kakayahan kaysa tiyak na pakikidigma. Inilalagay sa talababa ang ibang posibleng kulay ng kahulugan.
- source_word: מְלֶאכֶת עֲבוֹדַת
  choice: sa gawaing paglilingkod
  rationale: Napananatili ang parehong ideya ng gawain at paglilingkod sa isang natural at malinaw na pariralang Tagalog.
- source_word: בֵּית הָאֱלֹהִים
  choice: bahay ng Diyos
  rationale: Pinananatili ang literal at teolohikal na matunog na ekspresyon ng Hebreo, habang nililinaw sa talababa na tumutukoy ito sa templo.
theological_decisions:
- issue: Wikang pampamilya para sa pangkat ng mga lalaking kabilang sa angkan
  choice: mga kapatid
  alternative: mga kamag-anak sa angkan
  rationale: Pinananatili ang panlalaking pampamilyang katawagan sa Hebreo sa kontekstong saserdotal at genealogical, ngunit hindi ipinagpapalagay na pawang magkakapatid sa iisang magulang ang tinutukoy.
- issue: Tawag sa templo
  choice: bahay ng Diyos
  alternative: templo ng Diyos
  rationale: Ang literal na ekspresyon ang pinili upang mapanatili ang larawan sa pinagmulang teksto; ang reperensiya nito sa templo ay ipinaliliwanag sa talababa.
- issue: Kahulugan ng גִּבּוֹרֵי חֵיל sa konteksto ng paglilingkod
  choice: mga lalaking may pambihirang kakayahan
  alternative: mga magigiting na lalaki
  rationale: Hindi ginawang militar ang parirala dahil paglilingkod sa bahay ng Diyos ang agarang konteksto, ngunit pinananatili sa talababa ang saklaw nitong maaaring magpahiwatig ng lakas o kagitingan.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang ‘sambahayan ng mga ninuno’ upang ihatid ang sinaunang yunit ng angkan nang hindi maging labis na literal, at ang gitling na em dash upang malinaw na iugnay ang 1,760 sa paglalarawan sa kanila.
