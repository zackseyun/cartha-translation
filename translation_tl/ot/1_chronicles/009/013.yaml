  naturalness: Marangal at makabagong Tagalog ang draft, ngunit medyo mabigat at hindi ganap na malinaw ang “kani-kanilang sambahayan ng mga ninuno.” Ang binagong ayos ay mas madaling basahin at malinaw pa ring tumutukoy sa mga sambahayang pang-angkan.
  terminology: Pinananatili ang “mga kapatid,” “bahay ng Diyos,” at ang literal na diin ng “gawain ng paglilingkod.” Ang “mga lalaking magigiting at may kakayahan” ay mas sapat na katumbas ng honorific na גִּבּוֹרֵי חַיִל sa kontekstong hindi kinakailangang militar.
