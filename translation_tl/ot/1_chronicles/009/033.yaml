  text: וְ/אֵ֣לֶּה הַ֠/מְשֹׁרְרִים רָאשֵׁ֨י אָב֧וֹת לַ/לְוִיִּ֛ם בַּ/לְּשָׁכֹ֖ת פטירים כִּֽי יוֹמָ֥ם וָ/לַ֛יְלָה עֲלֵי/הֶ֖ם בַּ/מְּלָאכָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/033.yaml
  text: These were the singers[a], heads of fathers’ houses of the Levites, in the chambers, free from other duties, for they were occupied in the work day and night.
translation:
  language: tl
  text: Ang mga ito ang mga mang-aawit, ang mga pinuno ng mga angkan ng mga Levita. Nasa mga silid sila at malaya sa ibang mga tungkulin,[a] sapagkat araw at gabi silang nakatalaga sa gawain.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “hindi saklaw ng ibang mga tungkulin” o “pinalaya sa ibang mga tungkulin.” Bihira ang salitang Hebreo at malamang na nangangahulugang hindi sila inatasan sa ibang gawain dahil sa kanilang patuloy na pananagutan sa pag-awit.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמְשֹׁרְרִים
  choice: mga mang-aawit
  rationale: Tuwirang tinutukoy ng participle mula sa שׁיר ang mga taong umaawit; mas tiyak ito kaysa sa mas malawak na “mga musikero.”
- source_word: רָאשֵׁי אָבוֹת
  choice: mga pinuno ng mga angkan
  rationale: Ipinahahayag nito sa likas na modernong Tagalog ang mga pinuno ng mga sambahayang ninuno o yunit ng angkan, nang hindi ginagamit ang di-likas na literal na “mga pinuno ng mga bahay ng mga ama.”
- source_word: לַלְוִיִּם
  choice: ng mga Levita
  rationale: Ipinakikitang ang mga pinunong ito ay kabilang sa mga Levita.
- source_word: בַּלְּשָׁכוֹת
  choice: nasa mga silid
  rationale: Ang לִשְׁכָה ay silid o kuwarto sa isang institusyonal na gusali; hindi idinagdag ang “templo” dahil hindi iyon tahasang nasa salita.
- source_word: פטירים
  choice: malaya sa ibang mga tungkulin
  rationale: Bihira at hindi ganap na tiyak ang anyo; malamang na nangangahulugang pinalaya o hindi inatasan sa iba pang gawain. Nililinaw ng “ibang” ang ipinahihiwatig ng konteksto nang hindi sinasabing wala silang anumang tungkulin.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala nito ang dahilan kung bakit sila malaya sa ibang mga tungkulin.
- source_word: יוֹמָם וָלַיְלָה
  choice: araw at gabi
  rationale: Pinananatili ang tuwirang Hebreong temporal na pares at ang diwa ng patuloy na pananagutan.
- source_word: עֲלֵיהֶם
  choice: silang nakatalaga
  rationale: Ang literal na “nasa kanila” ay idyoma ng pananagutan o obligasyon; ang “nakatalaga” ay natural sa Tagalog at hindi nangangahulugang walang patid silang gumagawa.
- source_word: בַּמְּלָאכָה
  choice: sa gawaing ito
  rationale: Ang מְלָאכָה ay gawain o trabaho. Ginawang “gawaing ito” upang natural na maiugnay sa kanilang tungkulin sa konteksto nang hindi labis na tinutukoy ang eksaktong anyo nito.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Hinati sa dalawang pangungusap ang mahabang Hebreong sugnay para sa linaw. Iniwasan ang sobrang literal na “mga bahay ng mga ama” at ang pagdaragdag ng “templo,” na hindi tahasang nasa talata.
