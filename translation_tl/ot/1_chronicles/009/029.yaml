source:
  edition: WLC
  text: וּ/מֵ/הֶ֗ם מְמֻנִּים֙ עַל הַ/כֵּלִ֔ים וְ/עַ֖ל כָּל כְּלֵ֣י הַ/קֹּ֑דֶשׁ וְ/עַל הַ/סֹּ֨לֶת֙ וְ/הַ/יַּ֣יִן וְ/הַ/שֶּׁ֔מֶן וְ/הַ/לְּבוֹנָ֖ה וְ/הַ/בְּשָׂמִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/029.yaml
  text: And some of them were appointed over the vessels[a], over all the holy vessels, and over the fine flour, the wine, the oil, the frankincense, and the spices.
translation:
  language: tl
  text: Ang ilan sa kanila ay itinalagang mamahala sa mga kagamitan, sa lahat ng banal na kagamitan[a], at sa pinong harina, alak, langis, kamangyan, at mga espesya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “lahat ng mga kagamitan ng santuwaryo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֵהֶם
  choice: Ang ilan sa kanila
  rationale: 'Pinananatili nito ang partitive na diwa ng מִן: ang mga tinutukoy ay bahagi ng mas malaking pangkat.'
- source_word: מְמֻנִּים עַל
  choice: itinalagang mamahala sa
  rationale: Ipinapahayag ng passive participle ang pagkatalaga sa isang pananagutan, at ng עַל ang saklaw ng pamamahala.
- source_word: הַכֵּלִים
  choice: mga kagamitan
  rationale: Malawak ang saklaw ng כְּלִי at maaaring tumukoy sa mga kasangkapan, sisidlan, o iba pang gamit; natural at hindi labis na tiyak ang “mga kagamitan” sa kontekstong ito.
- source_word: כָּל כְּלֵי הַקֹּדֶשׁ
  choice: lahat ng banal na kagamitan
  rationale: Pinananatili ng “banal” ang literal na diwa ng הַקֹּדֶשׁ nang hindi agad nililimitahan ito sa isang lokasyon; inilalahad sa talababa ang posibleng diwang “ng santuwaryo.”
- source_word: הַסֹּלֶת
  choice: pinong harina
  rationale: Ang סֹלֶת ay partikular na pinong harina na ginagamit sa mga handog, hindi basta anumang harina.
- source_word: הַיַּיִן
  choice: alak
  rationale: Tuwirang katumbas ng יַיִן at angkop sa konteksto ng mga panustos para sa pagsamba.
- source_word: הַשֶּׁמֶן
  choice: langis
  rationale: Hindi tahasang tinutukoy ng Hebreo na langis ng olibo, kaya hindi iyon idinagdag sa salin.
- source_word: הַלְּבוֹנָה
  choice: kamanyang
  rationale: Ang לְבוֹנָה ay frankincense; “kamanyang” ang natural at tiyak na katawagang Filipino rito.
- source_word: הַבְּשָׂמִים
  choice: mababangong sangkap
  rationale: Tumutukoy ang salita sa mga aromatikong materyal; mas malinaw ito kaysa “mga pabango” at mas malawak kaysa “mga espesya.”
theological_decisions:
- issue: Kahulugan ng הַקֹּדֶשׁ sa pariralang כְּלֵי הַקֹּדֶשׁ
  choice: banal na kagamitan
  alternative: mga kagamitan ng santuwaryo
  rationale: Maaaring ipahiwatig ng construct phrase ang banal na katangian ng mga kagamitan o ang kaugnayan ng mga ito sa santuwaryo. Pinanatili sa teksto ang mas pormal na “banal,” habang kinikilala sa talababa ang lokatibong pagbasa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mamahala sa” sa halip na mas literal ngunit hindi natural na “nasa ibabaw ng,” at pinanatiling maikli ang talaan ng mga panustos.
