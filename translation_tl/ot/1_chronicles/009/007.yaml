  text: 'And from the sons of Benjamin: Sallu son of Meshullam[a], son of Hodaviah[c][b], son of Hassenuah.'
translation:
  language: tl
  text: 'At mula sa mga anak ni Benjamin[a]: si Salu, anak ni Mesulam, anak ni Hodavias[c], anak ni Hasenua.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “mula sa mga anak ni Benjamin.” Tumutukoy ito sa mga kabilang sa lipi ni Benjamin.
    reason: lexical_alternative
  - marker: b
    text: Paulit-ulit sa Hebreo ang “anak ni” sa buong talaangkanan. Maaari itong tumukoy sa tuwirang anak o sa isang inapo.
    reason: cultural_note
  - marker: c
    text: Naiiba ang baybay ng pangalang Hodavias sa ilang kaugnay na tradisyon ng talaangkanan.
    reason: textual_variant
lexical_decisions:
- source_word: וּ/מִן
  choice: At mula sa
  rationale: Pinananatili ng “At” ang ugnayan ng talata sa naunang talaan, habang likas sa Filipino ang pariralang “mula sa.”
- source_word: בְּנֵי בִּנְיָמִן
  choice: mga anak ni Benjamin
  rationale: Ito ang pormal na katumbas ng idyomang Hebreo at angkop sa talaangkanan; maaaring tumukoy sa mga kabilang sa lipi o mga inapo ni Benjamin, hindi lamang sa mga tuwirang anak niya.
- source_word: סַלּוּא
  choice: Salu
  rationale: Isina-Filipino ang transliterasyon ng pangalang Hebreo ayon sa karaniwang bigkas at baybay.
- source_word: בֶּן
  choice: anak ni
  rationale: Pinananatili ang paulit-ulit na pormula ng talaangkanang Hebreo. Sa ganitong konteksto, maaari itong tumukoy sa tuwirang anak o sa isang inapo sa sumunod na salinlahi.
- source_word: מְשֻׁלָּם
  choice: Mesulam
  rationale: Transliterasyong angkop sa modernong Filipino para sa pangalang Hebreo.
- source_word: הוֹדַוְיָה
  choice: Hodavias
  rationale: Sinusunod ang anyo ng pangalang nasa tekstong Masoretiko, gamit ang pangkaraniwang anyong Filipino ng pangalan.
- source_word: הַ/סְּנֻאָה
  choice: Hasenua
  rationale: Itinuturing itong pangalang pantangi sa konteksto ng talaangkanan; kinakatawan ng “Ha-” ang artikulong Hebreo na nakalakip sa pangalan.
