  text: וְ/הַ/יּוֹשְׁבִים֙ הָ/רִ֣אשֹׁנִ֔ים אֲשֶׁ֥ר בַּ/אֲחֻזָּתָ֖/ם בְּ/עָרֵי/הֶ֑ם יִשְׂרָאֵל֙ הַ/כֹּ֣הֲנִ֔ים הַ/לְוִיִּ֖ם וְ/הַ/נְּתִינִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/002.yaml
  text: The first inhabitants who lived in their possessions in their cities were Israel[a], the priests, the Levites, and the temple servants.
translation:
  language: tl
  text: Ang mga unang naninirahan sa kani-kanilang pag-aari, sa kanilang mga lungsod, ay ang mga Israelita, mga pari, mga Levita, at mga lingkod sa templo[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Nethinim,” ang tradisyonal na transliterasyon para sa isang pangkat na itinalaga sa paglilingkod sa templo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַיּוֹשְׁבִים
  choice: ang mga nanirahan
  rationale: Ang participle ng ישׁב ay tumutukoy sa mga naninirahan o nananahan. Ang “mga nanirahan” ay natural sa kontekstong pangkasaysayan at hindi nagdaragdag ng tahasang panandang temporal na wala sa Hebreo.
- source_word: הָרִאשֹׁנִים
  choice: mga unang
  rationale: Pinananatili ang pangunahing kahulugang “una,” na sa konteksto ay tumutukoy sa unang mga nanirahan matapos ang pagkakatapon, nang hindi tahasang idinaragdag ang “muling.”
- source_word: אֲשֶׁר
  choice: '[ipinahayag sa pariralang “mga unang nanirahan”]'
  rationale: Hindi kailangan sa natural na Tagalog ang hiwalay na katumbas ng relative pronoun; naisama ang tungkulin nito sa payak na pariralang nominal.
- source_word: בַּאֲחֻזָּתָם
  choice: sa kani-kanilang ari-arian
  rationale: Ang אֲחֻזָּה ay lupain o pag-aaring hawak, madalas na minana. Ipinahihiwatig ng “kani-kanilang” ang distributibong anyo ng hulaping pangmaramihan nang hindi labis na nililimitahan sa isang teknikal na uri ng mana.
- source_word: בְּעָרֵיהֶם
  choice: sa kanilang mga lungsod
  rationale: Karaniwang katumbas ng עָרִים ang “mga lungsod”; pinananatili rin ang panghalip na “kanilang.”
- source_word: יִשְׂרָאֵל
  choice: mga Israelita
  rationale: Bagaman pangngalang “Israel” ang anyo sa Hebreo, mas malinaw at likas sa Tagalog ang “mga Israelita” bilang katawagan sa mga taong kabilang sa talaan.
- source_word: הַכֹּהֲנִים
  choice: mga pari
  rationale: Ito ang karaniwan at malinaw na salin ng כֹּהֲנִים.
- source_word: הַלְוִיִּם
  choice: mga Levita
  rationale: Pinananatili ang kinikilalang katawagan sa mga kabilang sa lipi o uring Levitiko.
- source_word: וְהַנְּתִינִים
  choice: at mga lingkod sa templo
  rationale: Ang נְתִינִים ay isang kinikilalang pangkat na itinalaga sa paglilingkod sa templo. Isinasalin ang tungkulin para maunawaan agad ng modernong mambabasa, habang inilalagay sa talababa ang tradisyonal na transliterasyon.
theological_decisions:
- issue: Ugnayan ng “Israel” sa mga pari, Levita, at lingkod sa templo
  choice: Iniharap ang mga ito bilang magkakasunod na katawagan sa talaan, gaya ng ayos ng Hebreo.
  alternative: Unawain ang “Israel” bilang pangkalahatang pangkat na tahasang sumasaklaw sa tatlong kasunod na uri.
  rationale: Walang pang-ugnay sa pagitan ng “Israel” at “mga pari” sa Hebreo, kaya maaaring basahin ang mga kasunod bilang magkakatabing pangkat o mas tiyak na mga uri. Hindi nilinaw nang higit sa pinagmulan ang kanilang lohikal na ugnayan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “lungsod,” “ari-arian,” at “lingkod sa templo” bilang mga salitang madaling maunawaan ngunit angkop sa tekstong pangkasaysayan. Inilagay ang talababa sa “mga lingkod sa templo,” ang mismong katumbas ng וְהַנְּתִינִים.
