base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/044.yaml
  text: 'Azel had six sons[a], and these were their names: Azrikam his firstborn, Ishmael, Sheariah, Obadiah, and Hanan[b]. These were the sons of Azel.'
translation:
  language: tl
  text: 'May anim na anak na lalaki si Azel[a], at ito ang mga pangalan nila: si Azrikam, ang kanyang panganay[b], si Ismael, si Searias, si Obadias, at si Hanan. Ito ang mga anak ni Azel.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “At kay Azel: anim na anak na lalaki.” Karaniwang pormula ito sa mga talaan ng angkan sa Hebreo.'
    reason: lexical_alternative
  - marker: b
    text: Literal na “kanyang panganay.” Sa binigkas na tekstong Hebreo, inilalarawan nito si Azrikam. Gayunman, dahil anim ang binanggit na anak ngunit lima lamang ang nakalistang pangalan, at dahil ang kahalintulad na tala sa 1 Cronica 8:38 ay maaaring basahing may pangalang “Bokeru,” may tekstuwal na kawalang-katiyakan sa bahaging ito.
    reason: textual_ambiguity
lexical_decisions:
- source_word: וּלְאָצֵל
  choice: May ... si Azel
  rationale: Ang ל sa pormulang pang-talaan ng angkan ay likas na nagpapahayag ng pag-aari o kaugnayang magulang-anak. Ang “May ... si Azel” ay natural sa makabagong Tagalog.
- source_word: שִׁשָּׁה בָנִים
  choice: anim na anak na lalaki
  rationale: Tiyak na mga anak na lalaki ang tinutukoy ng בָנִים; pinananatili rin ang bilang na anim sa Hebreo.
- source_word: וְאֵלֶּה שְׁמוֹתָם
  choice: at ito ang kanilang mga pangalan
  rationale: Ang hulaping maramihan sa שְׁמוֹתָם ay tumutukoy sa mga anak na kababanggit lamang.
- source_word: עַזְרִיקָם
  choice: Azrikam
  rationale: Malapit na transliterasyon ng pangalang Hebreo at madaling basahin sa Filipino.
- source_word: בֹּכְרוּ
  choice: Bokeru
  rationale: Itinuturing itong pangalang pantangi, gaya ng katumbas na tala sa 1 Cronica 8:38. Sa pagbasa ring ito, tumutugma ang anim na nakalistang pangalan sa sinabing anim na anak. Gayunman, posible rin sa anyong Hebreo ang kahulugang “kanyang panganay,” kaya inilalahad ang alternatibo sa talababa.
- source_word: יִשְׁמָעֵאל
  choice: Ismael
  rationale: Karaniwang anyong Filipino ng pangalang Hebreo.
- source_word: שְׁעַרְיָה
  choice: Searias
  rationale: Anyong Filipino na kumakatawan sa pangalang Hebreo at sumusunod sa dignidad ng mga pangalang biblikal.
- source_word: עֹבַדְיָה
  choice: Obadias
  rationale: Karaniwang anyong Filipino ng pangalang biblikal.
- source_word: חָנָן
  choice: Hanan
  rationale: Tuwirang transliterasyon na natural basahin sa Filipino.
- source_word: אֵלֶּה בְּנֵי אָצַל
  choice: Sila ang mga anak ni Azel
  rationale: Natural na pangwakas na pormulang pang-angkan na inuulit ang pangalan ni Azel para sa kalinawan.
theological_decisions:
- issue: Kung pangalan ba o paglalarawan ang בֹּכְרוּ
  choice: Isinalin bilang pangalang “Bokeru.”
  alternative: “ang kanyang panganay” bilang paglalarawan kay Azrikam
  rationale: Ang kaparehong tala sa 1 Cronica 8:38 at ang tahasang bilang na anim ay malakas na sumusuporta sa pagbasa rito bilang ikalawang pangalan. Hindi itinatago ang tunay na leksikal na posibilidad ng “kanyang panganay,” kaya isinama iyon sa talababa sa halip na tahimik na lutasin ang tensiyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “anak na lalaki” upang mapanatili ang tiyak na kasarian ng Hebreo, at mga anyong pangalang madaling basahin sa Filipino. Pinanatili sa talababa ang tunay na kalabuan ng בֹּכְרוּ.
