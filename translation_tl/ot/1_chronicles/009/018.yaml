base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/018.yaml
  text: Until then they were at the king’s gate on the east[b][a]; they were the gatekeepers for the camps of the sons of Levi.
translation:
  language: tl
  text: Hanggang sa panahong iyon[a], sila ay nasa tarangkahan ng hari sa silangan; sila ang mga bantay-pinto para sa mga pangkat[b] ng mga anak ni Levi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Hanggang ngayon” o “Hanggang sa puntong iyon.” Maaaring unawain ang idyomang Hebreo bilang pahiwatig ng pagpapatuloy hanggang sa isang panahon.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “para sa mga kampo” o “para sa mga pangkat na nakaayos.” Ang salitang Hebreo ay maaaring tumukoy sa mga kampo o sa organisadong mga pangkat, depende sa konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַד הֵנָּה
  choice: Hanggang sa panahong iyon
  rationale: Ipinahahayag ng idyoma ang pagpapatuloy hanggang sa tinutukoy na panahon. Likas ito sa Filipino at pinananatili ang posibleng retrospektibong diwa ng konteksto.
- source_word: בְּשַׁעַר הַמֶּלֶךְ
  choice: nasa pintuan ng hari
  rationale: Ang ב ay lokatibo rito, at ang שַׁעַר ay pintuan o tarangkahan. Ang 'pintuan ng hari' ay malinaw at malapit sa anyong construct ng Hebreo.
- source_word: מִזְרָחָה
  choice: sa silangan
  rationale: Tinutukoy ng anyong patungo/lokatibo ang silangang kinalalagyan o panig ng pintuan.
- source_word: הֵמָּה
  choice: sila ang
  rationale: Pinananatili ng tahasang panghalip ang pagbibigay-diin at pagkakakilanlan sa grupong nabanggit.
- source_word: הַשֹּׁעֲרִים
  choice: mga bantay-pinto
  rationale: Tumutukoy ito sa mga taong inatasang magbantay sa mga pintuan; mas malinaw ang 'bantay-pinto' kaysa sa literal ngunit malabong 'mga tagapinto.'
- source_word: לְמַחֲנוֹת
  choice: para sa mga pangkat
  rationale: Maaaring mangahulugang mga kampo o mga organisadong pangkat ang מַחֲנוֹת. Ang 'mga pangkat' ay natural sa kontekstong pang-organisasyon habang inilalahad sa talababa ang literal na alternatibo.
- source_word: בְּנֵי לֵוִי
  choice: mga anak ni Levi
  rationale: Pinananatili ang pormal na pananalitang pangangkanan sa Hebreo sa halip na paikliin bilang 'mga Levita.'
