  yaml_path: translation/ot/1_chronicles/009/017.yaml
  text: And the gatekeepers were Shallum[a], Akkub, Talmon, Ahiman, and their brothers; Shallum was the chief.
translation:
  language: tl
  text: Ang mga bantay sa mga pintuan ay sina Sallum, Akub, Talmon, Ahiman, at ang kanilang mga kapatid[a]. Si Sallum ang pinuno.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O, “mga kaangkan nila.” Literal sa Hebreo: “kanilang mga kapatid,” na sa ganitong talaan ay maaaring tumukoy sa mga tunay na kapatid o sa mga kabilang sa iisang angkan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשֹּׁעֲרִים
  choice: mga bantay ng pintuang-bayan
  rationale: Tumutukoy sa mga inatasang magbantay sa mga pintuan. Ang pariralang ito ay malinaw at likas sa modernong Filipino at angkop sa konteksto ng templo.
- source_word: שַׁלּוּם
  choice: Sallum
  rationale: Pangngalang pantangi; isinalin sa karaniwang anyong Filipino na sumusunod sa tunog ng Hebreo.
- source_word: עַקּוּב
  choice: Akub
  rationale: Pangngalang pantangi; tinumbasan ayon sa tunog ng Hebreo sa likas na baybay-Filipino.
- source_word: טַלְמֹן
  choice: Talmon
  rationale: Pangngalang pantangi; nilapitan ang transliterasyon ng Hebreo.
- source_word: אֲחִימָן
  choice: Ahiman
  rationale: Pangngalang pantangi; nilapitan ang transliterasyon ng Hebreo.
- source_word: אֲחִיהֶם
  choice: kanilang mga kapatid
  rationale: Literal na 'kanilang mga kapatid.' Maaari itong tumukoy sa mga tunay na kapatid o sa mga kaangkan, kaya pinanatili sa teksto ang literal at likas na katumbas at inilagay sa talababa ang saklaw ng kahulugan.
- source_word: הָרֹאשׁ
  choice: ang pinuno
  rationale: Dito, ang salita ay nagpapahayag ng ranggo o pamumuno, hindi literal na bahagi ng katawan. Ang 'pinuno' ay malinaw at natural sa Filipino.
- source_word: וְ...וְ...וַ...וַ
  choice: ay sina ... at
  rationale: Isinaayos ang magkakasunod na pang-ugnay bilang likas na talaan sa Filipino habang pinananatili ang ugnayang pandagdag ng mga pangalan.
