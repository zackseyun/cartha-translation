  register: Modernong Filipino na malinaw at marangal. Ginamit ang “bantay ng pintuang-bayan” upang ipakita ang tungkuling pagbabantay sa mga pasukan, at pinanatili sa talababa ang tunay na lawak ng kahulugan ng “mga kapatid.”
