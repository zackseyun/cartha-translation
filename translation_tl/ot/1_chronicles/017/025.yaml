base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/025.yaml
  text: For you[a], my God, have revealed to your servant that you will build him a house[b]; therefore your servant has found courage to pray before you.
translation:
  language: tl
  text: Sapagkat ikaw, Diyos ko, ang nagpahayag[a] sa iyong lingkod na magtatayo ka para sa kanya ng isang bahay[b]. Kaya nagkaroon ng lakas ng loob ang iyong lingkod na manalangin sa iyong harapan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “inilantad mo ang tainga ng iyong lingkod,” isang idyoma na nangangahulugang “ipinahayag mo sa iyong lingkod.”
    reason: lexical_alternative
  - marker: b
    text: O “magtatatag ka para sa kanya ng isang dinastiya.” Ang “bahay” dito ay maaari ring tumukoy sa sambahayan o sa nagpapatuloy na maharlikang angkan.
    reason: alternative_reading
lexical_decisions:
- source_word: גָּלִיתָ אֶת אֹזֶן עַבְדְּךָ
  choice: nagpahayag sa iyong lingkod
  rationale: Literal itong “inilantad ang tainga ng iyong lingkod,” isang idyomang Hebreo para sa pagsisiwalat o pagpapaalam. Isinalin ang diwa sa malinaw at likas na modernong Tagalog, habang inilagay sa talababa ang konkretong larawan ng Hebreo.
- source_word: לִבְנוֹת לוֹ בָּיִת
  choice: na ipagtatayo mo siya ng isang bahay
  rationale: Ang pawatas ay nagpapahayag ng nilalaman ng isiniwalat. Likas sa Tagalog ang “ipagtatayo mo siya,” at pinananatili ng “bahay” ang larawang ginamit sa Hebreo at ang posibleng paglalaro sa literal at dinastikong kahulugan.
- source_word: בָּיִת
  choice: bahay
  rationale: Pinananatili ang pangunahing larawan ng Hebreo sa halip na tahasang isalin bilang “dinastiya.” Sa konteksto ng pangako kay David, maaari rin itong tumukoy sa sambahayan, angkan, o nagpapatuloy na maharlikang linya.
- source_word: מָצָא ... לְהִתְפַּלֵּל
  choice: nagkaroon ng lakas ng loob ... na manalangin
  rationale: Ang literal na “nakasumpong upang manalangin” ay hindi likas sa Tagalog. Ipinahihiwatig ng idyoma sa konteksto ang pagkakaroon ng tapang o paninindigang lumapit sa Diyos sa panalangin.
- source_word: לְפָנֶיךָ
  choice: sa harapan mo
  rationale: Pinananatili nito ang relasyonal at debosyonal na diwa ng pananalangin sa presensiya ng Diyos sa isang malinaw at marangal na anyo.
- source_word: עַבְדְּךָ
  choice: iyong lingkod
  rationale: Sa panalanging maharlika, ito ay mapagpakumbabang pagtukoy ng nagsasalita sa sarili sa harap ng Diyos. Ang “lingkod” ay angkop sa rehistro at nagpapahayag ng pagpapasakop nang hindi nagdaragdag ng di-kinakailangang kahulugang panlipunan.
theological_decisions:
- issue: Kahulugan ng “bahay” sa pangako kay David
  choice: Panatilihin ang “bahay” sa pangunahing teksto at ipaliwanag sa talababa ang posibleng kahulugang dinastiko.
  alternative: Isalin nang tahasan bilang “dinastiya” o “maharlikang angkan.”
  rationale: May sadyang masaklaw na larawan ang Hebreong בָּיִת sa kontekstong ito. Ang “bahay” ay nagpapanatili sa ugnayan nito sa literal na gusali at hindi agad nilulutas ang kahulugan nito bilang sambahayan o nagpapatuloy na maharlikang linya.
translation_notes:
  register: Gumamit ng moderno, malinaw, at marangal na Filipino. Ang “Sapagkat ikaw, Diyos ko, ang…” ay nagpapanatili sa diin ng Hebreo sa Diyos bilang siyang nagpahayag. Iniwasan ang labis na literal na mga idyomang magiging malabo sa karaniwang mambabasa, ngunit pinanatili sa talababa ang mahahalagang larawang Hebreo at ang ambiguwidad ng “bahay.”
