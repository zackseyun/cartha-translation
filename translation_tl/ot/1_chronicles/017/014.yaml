  yaml_path: translation/ot/1_chronicles/017/014.yaml
  text: But I will establish him in my house and in my kingdom forever[c][b][a], and his throne will be established forever.
translation:
  language: tl
  text: Ngunit itatatag ko siya[b] sa aking bahay[c] at sa aking kaharian magpakailanman[a], at magiging matatag ang kanyang trono magpakailanman.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “At ilalagay ko siya sa aking bahay at sa aking kaharian magpakailanman.” Ang pandiwang Hebreo ay maaari ring isaling “ilalagay” o “patatatagin”; pinananatili ng pangunahing teksto ang diwa ng matatag na pagtatalaga.
    reason: lexical_alternative
  - marker: b
    text: Maaaring ang “siya” ay agarang tumukoy sa maharlikang inapo ni David, lalo na kay Solomon, habang bahagi rin ito ng mas malawak na pangako kay David na kalauna’y inuunawang may kaugnayan sa Mesiyas.
    reason: alternative_reading
  - marker: c
    text: Maaaring tumukoy ang “aking bahay” sa bahay ng Diyos sa malawak na diwa ng tipan; inuunawa rin ito ng ilan bilang templo o bilang maharlikang sambahayan ng Diyos.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהַעֲמַדְתִּיהוּ
  choice: Ngunit itatatag ko siya
  rationale: Ang Hiphil ng עמד ay nagsasaad ng pagpapapanatiling nakatayo o matatag sa isang katayuan. Ang “itatatag” ay likas sa kontekstong maharlika at tipan; ginawang “Ngunit” ang pangatnig upang maipakita ang pagsalungat sa babala sa naunang talata.
- source_word: בְּבֵיתִי
  choice: sa aking bahay
  rationale: Pinananatili ng “bahay” ang lawak ng בית, na maaaring tumukoy sa bahay, sambahayan, templo, o saklaw ng paghahari ng Diyos, nang hindi agad pinipili ang isang tiyak na pakahulugan.
- source_word: וּבְמַלְכוּתִי
  choice: at sa aking kaharian
  rationale: Tuwirang inilalarawan nito ang ב bilang “sa” at pinananatili ang pagkakapantay ng parirala sa “sa aking bahay.” Ang מלכות ay likas na isinasaling “kaharian.”
- source_word: עַד הָעוֹלָם / עַד עוֹלָם
  choice: magpakailanman
  rationale: Karaniwang ipinahahayag ng mga pariralang ito ang walang-hanggang pananatili; malinaw at marangal sa makabagong Filipino ang “magpakailanman.”
- source_word: וְכִסְאוֹ
  choice: at ang kanyang trono
  rationale: Ang כסא ay literal na “trono,” isang mahalagang larawang maharlika na hindi dapat gawing mas pangkalahatang “paghahari” o “dinastiya.”
- source_word: יִהְיֶה נָכוֹן
  choice: magiging matatag
  rationale: Ang נכון bilang panaguri ay nagpapahayag ng katatagan at katiyakan. Likas sa Filipino ang “magiging matatag” at hindi nito ipinapalagay kung paano isasakatuparan ang katatagang iyon.
theological_decisions:
- issue: Ang tinutukoy ng panghalip na “siya” sa konteksto ng tipan kay David
  choice: Panatilihin ang panghalip na “siya” nang hindi tahasang kinikilalang si Solomon o ang Mesiyas.
  alternative: Tukuyin siya bilang si Solomon, ang linya ng mga hari mula kay David, o ang Mesiyas.
  rationale: Panghalip na panlalaking isahan lamang ang nasa Hebreo. May agarang kaugnayan ito sa maharlikang inapo ni David at may mas malawak na kahulugang mesiyaniko sa kalaunang pagbasa, kaya hindi dapat lutasin ng pangunahing teksto ang tensiyong ito.
- issue: Saklaw ng “aking bahay”
  choice: Isalin bilang “aking bahay” nang hindi nililimitahan ang kahulugan.
  alternative: “aking templo” o “aking sambahayan”
  rationale: Maaaring tumukoy ang בית sa templo, sambahayan, o mas malawak na saklaw ng tipan at paghahari ng Diyos. Pinananatili ng literal na anyo ang magkakaugnay na posibilidad.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang mga pangunahing larawang “bahay,” “kaharian,” at “trono,” pati ang pag-uulit ng “magpakailanman.” Iniwasan ang paglalagay ng tiyak na denominasyonal na interpretasyon sa pangunahing teksto.
