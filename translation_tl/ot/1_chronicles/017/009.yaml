source:
  edition: WLC
  text: וְ/שַׂמְתִּ֣י מָ֠קוֹם לְ/עַמִּ֨/י יִשְׂרָאֵ֤ל וּ/נְטַעְתִּ֨י/הוּ֙ וְ/שָׁכַ֣ן תַּחְתָּ֔י/ו וְ/לֹ֥א יִרְגַּ֖ז ע֑וֹד וְ/לֹא יוֹסִ֤יפוּ בְנֵי עַוְלָה֙ לְ/בַלֹּת֔/וֹ כַּ/אֲשֶׁ֖ר בָּ/רִאשׁוֹנָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/009.yaml
  text: And I will appoint a place for my people Israel and will plant them[a], and they will dwell in their own place and be disturbed no more. And the sons of wickedness will no longer wear them down, as at the first[b],
translation:
  language: tl
  text: Magtatalaga ako ng isang lugar para sa aking bayang Israel at itatanim ko sila roon. Maninirahan sila sa sarili nilang lugar at hindi na mababagabag. Hindi na sila pahihinain ng masasamang tao[a], gaya noong una[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “mga anak ng kasamaan.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “gaya noong dating panahon.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתִּי מָקוֹם
  choice: Magtatalaga ako ng isang lugar
  rationale: Ang שׂוּם ay literal na ‘maglagay,’ ngunit kasama ng מָקוֹם ay tumutukoy sa pagtatalaga ng isang lugar. Natural sa modernong Tagalog ang ‘magtatalaga’ at malinaw na Diyos ang kumikilos.
- source_word: לְעַמִּי יִשְׂרָאֵל
  choice: para sa aking bayang Israel
  rationale: Pinananatili nito ang pag-aangkin ng Diyos sa Israel bilang kanyang bayan at natural ang ayos sa Tagalog.
- source_word: וּנְטַעְתִּיהוּ
  choice: at itatanim ko sila roon
  rationale: Pinananatili ng ‘itatanim’ ang metapora ng matatag at permanenteng pagkakalagay. Ang hulaping isahan sa Hebreo ay tumutukoy sa Israel bilang isang kolektibong bayan; ginamit ang ‘sila’ para sa malinaw at natural na Tagalog. Idinagdag ang ‘roon’ upang malinaw na ang pagtatanim ay sa itinalagang lugar.
- source_word: וְשָׁכַן תַּחְתָּיו
  choice: Maninirahan sila sa sarili nilang lugar
  rationale: Ang kolektibong isahan ay natural na isinalin sa maramihan. Sa konteksto, ang תַּחְתָּיו ay nagpapahayag ng paninirahan sa nakatalagang kinalalagyan, hindi literal na pagiging ‘sa ilalim nito.’
- source_word: וְלֹא יִרְגַּז עוֹד
  choice: at hindi na mababagabag
  rationale: Ang רגז ay maaaring mangahulugang mayanig, mabalisa, o magambala. Saklaw ng ‘mabagabag’ ang kawalan ng kapanatagan dahil sa mga kaaway nang hindi labis na nililinaw ang uri ng kaguluhan.
- source_word: בְנֵי עַוְלָה
  choice: masasamang tao
  rationale: Ito ang natural na kahulugan ng idyomang Hebreo sa kasalukuyang Tagalog. Inilagay sa talababa ang mas literal na anyo upang mapanatili ang kaalaman sa retorika ng pinagmulan.
- source_word: לְבַלֹּתוֹ
  choice: uubusin ... ang kanilang lakas
  rationale: Ang piel ng בלה ay may diwang unti-unting pag-ubos o pagpapanghina. Ang pariralang ito ay mas malinaw at mas malapit sa larawan ng patuloy na mapaniil na pinsala kaysa sa pangkalahatang ‘pahihirapan.’
- source_word: כַּאֲשֶׁר בָּרִאשׁוֹנָה
  choice: gaya noong una
  rationale: Malapit ito sa Hebreo at nauunawaan bilang pagtukoy sa naunang panahon ng karanasan ng Israel, nang hindi tinutukoy nang higit sa sinasabi ng talata.
theological_decisions:
- issue: Kolektibong isahan at maramihang pagtukoy sa Israel
  choice: Gamitin ang maramihang ‘sila’ at ‘kanilang’ habang pinananatili ang Israel bilang iisang bayang kolektibo.
  alternative: 'Panatilihin ang mahigpit na isahan: ‘ito,’ ‘nito,’ o ‘niya.’'
  rationale: Gumagamit ang Hebreo ng kolektibong isahan para sa Israel. Sa Tagalog, maaaring mapagkamalang isang indibidwal o bagay ang mahigpit na isahan; mas malinaw ang maramihan at hindi nito binabago ang saklaw ng pangako.
- issue: Kahulugan ng תַּחְתָּיו
  choice: Isalin bilang ‘sa sarili nilang lugar,’ na nagpapahayag ng matatag na paninirahan sa itinakdang lugar.
  alternative: Isalin nang literal bilang ‘sa ilalim nito/niya.’
  rationale: Malabo at maaaring magbigay ng maling larawan ang literal na anyo sa Tagalog. Ang konteksto ay ang panatag na paninirahan ng Israel sa lugar na itinalaga ng Diyos.
- issue: Metapora ng pagtatanim sa Israel
  choice: Panatilihin ang ‘itatanim ko sila’ sa halip na gawing ‘patitirahin’ o ‘itatatag.’
  alternative: Ipaliwanag ang metapora bilang ‘itatatag ko sila’ o ‘patitirahin ko sila.’
  rationale: Maliwanag sa Tagalog ang metapora at pinananatili nito ang larawan ng pagkakaugat at katatagan nang hindi nagdaragdag ng doktrinal na paliwanag.
translation_notes:
  register: Modernong Filipino Tagalog na may marangal ngunit madaling maunawaang himig. Pinanatili ang metaporang ‘itatanim,’ ginawang natural ang kolektibong pagtukoy sa Israel, at iniwasan ang sobrang literal na ‘sa ilalim nito.’ Ang kuwit sa hulihan ay pinanatili dahil nagpapatuloy ang pangungusap sa kasunod na talata.
