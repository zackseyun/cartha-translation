  text: בְּ/כֹ֥ל אֲשֶֽׁר הִתְהַלַּכְתִּי֮ בְּ/כָל יִשְׂרָאֵל֒ הֲ/דָבָ֣ר דִּבַּ֗רְתִּי אֶת אַחַד֙ שֹׁפְטֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁ֥ר צִוִּ֛יתִי לִ/רְע֥וֹת אֶת עַמִּ֖/י לֵ/אמֹ֑ר לָ֛/מָּה לֹא בְנִיתֶ֥ם לִ֖/י בֵּ֥ית אֲרָזִֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/006.yaml
  text: In all the places where I have walked among all Israel[a], did I ever speak a word to one of the judges of Israel, whom I commanded to shepherd my people, saying, ‘Why have you not built for me a house of cedar?’
translation:
  language: tl
  text: Sa lahat ng lugar na pinuntahan ko sa gitna ng buong Israel[a], may sinabi ba akong kahit isang salita sa isa man sa mga hukom ng Israel na inutusan kong magpastol sa aking bayan? Sinabi ko ba, ‘Bakit hindi ninyo ako ipinagtayo ng isang bahay na yari sa sedro?’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa paralel na talata sa 2 Samuel 7:7, “mga lipi ng Israel” ang mababasa, sa halip na “mga hukom ng Israel”; may ilang saksi na may “mga pinuno” o “mga setro.” “Mga hukom” ang mababasa rito sa tekstong Hebreo ng Cronica.
    reason: textual_variant
lexical_decisions:
- source_word: הִתְהַלַּכְתִּי
  choice: nilakaran ko
  rationale: Pinananatili nito ang metapora ng paglakad, habang ipinahihiwatig sa konteksto ang patuloy na pagkilos ng Diyos sa gitna ng kanyang bayan.
- source_word: בְּכָל יִשְׂרָאֵל
  choice: kasama ng buong Israel
  rationale: Ang בְּ kasunod ng pandiwang ito ay nagpapahiwatig ng paglakad na kasama o sa gitna ng buong sambayanan, hindi lamang ng pagdaan sa isang heograpikong saklaw.
- source_word: הֲדָבָר דִּבַּרְתִּי
  choice: nagsalita ba ako kailanman
  rationale: Natural na naihahatid sa Tagalog ang mariing retorikal na tanong at ang diwa ng Hebreong cognate construction nang hindi mekanikal na inuulit ang ‘salita.’
- source_word: אֶת אַחַד שֹׁפְטֵי יִשְׂרָאֵל
  choice: sa isa sa mga hukom ng Israel
  rationale: Sa pandiwang דבר, ang אֶת ay nagpapakilala rito sa taong kinakausap; malinaw at likas sa Tagalog ang ‘nagsalita sa.’
- source_word: שֹׁפְטֵי יִשְׂרָאֵל
  choice: mga hukom ng Israel
  rationale: Tuwirang isinasalin ang tekstong Hebreo ng Cronica at hindi ito itinutugma sa naiibang pagbasa ng paralel na talata sa 2 Samuel.
- source_word: צִוִּיתִי לִרְעוֹת
  choice: inutusan kong magpastol
  rationale: Pinananatili ng ‘magpastol’ ang pastoral na metapora para sa pamumuno at pangangalaga sa bayan ng Diyos.
- source_word: עַמִּי
  choice: aking bayan
  rationale: Likas at marangal na salin ng karaniwang pahayag ng ugnayang tipan.
- source_word: לָמָּה לֹא בְנִיתֶם לִי
  choice: Bakit hindi ninyo ako ipinagtayo
  rationale: Ang hulma na ‘ipinagtayo ako’ ay natural sa Tagalog at malinaw na ipinapakitang ang bahay ay itatayo para sa Diyos; pinananatili rin ng maramihang ‘ninyo’ ang anyo ng Hebreo.
- source_word: בֵּית אֲרָזִים
  choice: isang bahay na yari sa sedro
  rationale: Nililinaw na kahoy na sedro ang materyales ng bahay, sa natural at dignified na modernong Tagalog.
theological_decisions:
- issue: Ang ‘mga hukom’ sa Cronica kumpara sa ‘mga lipi’ sa paralel na teksto ng 2 Samuel 7:7
  choice: mga hukom ng Israel
  alternative: mga lipi ng Israel; mga pinuno ng Israel
  rationale: Ang WLC ng 1 Cronica 17:6 ay may שֹׁפְטֵי, ‘mga hukom.’ Dapat panatilihin sa pangunahing teksto ang pagbasa ng Cronica at ilahad sa talababa ang pagkakaiba ng paralel na teksto, sa halip na tahimik itong pagtugmain.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang mga metaporang ‘nilakaran’ at ‘magpastol,’ gayundin ang retorikal na tanong. Ginamit ang ‘sedro,’ ang karaniwang makabagong katawagan sa cedar.
