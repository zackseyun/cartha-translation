base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/005.yaml
  text: For I have not lived in a house from the day that I brought up Israel to this day[a], but I have gone from tent to tent and from dwelling place to dwelling place.
translation:
  language: tl
  text: Sapagkat hindi ako nanirahan sa isang bahay mula nang iahon ko ang Israel hanggang sa araw na ito, ngunit nagpalipat-lipat ako mula sa tolda patungo sa tolda at mula sa tirahan patungo sa tirahan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O: “Ako ay nagpalipat-lipat mula sa tolda patungo sa tolda at mula sa tabernakulo patungo sa tabernakulo.”'
    reason: Ginagamit ng alternatibong ito ang teknikal na “tabernakulo” para sa מִשְׁכָּן at tahasang inilalahad ang kilos na ipinahihiwatig ng pariralang “mula sa tolda patungo sa tolda.”
lexical_decisions:
- source_word: יָשַׁבְתִּי
  choice: nanirahan
  rationale: Kapag may kasamang pook, ang pandiwa ay tumutukoy sa paninirahan, hindi sa literal na pag-upo. Likas at dignidad ang “nanirahan” sa modernong Tagalog.
- source_word: בְּבַיִת
  choice: sa isang bahay
  rationale: Pangkalahatan at walang tiyak na pantukoy ang בַּיִת dito. Hindi ito isinaling “templo” upang hindi magpasok ng kahulugang higit sa tahasang sinasabi ng Hebreo.
- source_word: הֶעֱלֵיתִי אֶת יִשְׂרָאֵל
  choice: iahin ko ang Israel
  rationale: Ang Hiphil ng עלה ay “magpaahon/iahin.” Pinananatili ng “iahin” ang larawan ng pag-akyat at ang pagkilos ng Diyos, habang natural sa Tagalog ang “mula nang iahon ko.”
- source_word: וָאֶהְיֶה
  choice: nagpalipat-lipat ako
  rationale: Literal itong “at ako ay naging/naroon,” ngunit ipinahihiwatig ng kasunod na “mula…patungo…” ang paglipat-lipat. Ginawang tahasan ang kilos para sa malinaw at natural na Tagalog.
- source_word: מֵאֹהֶל אֶל אֹהֶל
  choice: mula sa tolda patungo sa tolda
  rationale: Pinananatili nito ang paulit-ulit na anyo at ang larawan ng mga pansamantalang tirahan.
- source_word: וּמִמִּשְׁכָּן
  choice: at mula sa isang tirahan patungo sa iba
  rationale: Maaaring mangahulugan ang מִשְׁכָּן ng tirahan o tabernakulo. Ang “tirahan” ay nagpapanatili sa karaniwang leksikal na diwa; ang ikalawang hantungan ay ipinahiwatig upang mabuo sa Tagalog ang paralel na pahayag.
theological_decisions:
- issue: Mga katawagan para sa banal na tirahan nang hindi ipinapasok ang kalaunang teolohiya tungkol sa templo
  choice: “bahay” at “tirahan” sa pangunahing teksto
  alternative: “templo” para sa בַּיִת at “tabernakulo” para sa מִשְׁכָּן
  rationale: Ikinukumpara ng talata ang isang permanenteng bahay sa naililipat na toldang tirahan. Hindi tahasang “templo” ang salitang Hebreo rito, at maaaring karaniwang “tirahan” o teknikal na “tabernakulo” ang מִשְׁכָּן. Inilagay sa talababa ang teknikal at mas pormal na alternatibo.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, magalang, at angkop sa publikong pagbasa. Ginamit ang “Sapagkat” at “Sa halip” para sa dignidad at malinaw na ugnayan ng mga sugnay; iniwasan ang arkaikong anyo at ang sobrang teknikal na “templo” sa pangunahing teksto.
