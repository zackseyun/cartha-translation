  text: But that night the word of God came to Nathan[a], saying,
translation:
  language: tl
  text: 'Ngunit nang gabing iyon, dumating kay Natan ang salita ng Diyos[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Isang salita mula sa Diyos ang dumating kay Natan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Ngunit … dumating
  rationale: Ang magkasunod na anyo ng היה ay nagsusulong ng salaysay. Ipinahihiwatig ng “Ngunit” ang banayad na pagsalungat sa sinabi ni Natan sa naunang konteksto, samantalang ang ikalawang וַיְהִי ay likas na naipapahayag sa “dumating.”
- source_word: בַּלַּיְלָה הַהוּא
  choice: nang gabing iyon
  rationale: Likas itong temporal na pahayag sa makabagong Tagalog at pinananatili ang demonstratibong diwa ng הַהוּא.
- source_word: דְּבַר אֱלֹהִים
  choice: ang salita ng Diyos
  rationale: Maaaring mangahulugan ang דָּבָר ng salita, bagay, o mensahe. Sa pormula ng propetikong paghahayag, pinananatili ng “ang salita ng Diyos” ang pormal at mabigat na diwa ng Hebreo nang hindi ito dinaragdagan.
- source_word: אֱלֹהִים
  choice: Diyos
  rationale: Tumutukoy ito rito sa Diyos ng Israel bilang iisang persona; “Diyos” ang tuwirang katumbas sa Tagalog.
- source_word: אֶל נָתָן
  choice: kay Natan
  rationale: Tinutukoy ng אֶל ang tumatanggap ng salita. Ang “kay Natan” ang likas na anyong Tagalog.
- source_word: לֵאמֹר
  choice: na sinasabi
  rationale: Ipinakikilala ng infinitive construct ang tuwirang pananalita. Ang “na sinasabi” ay malinaw na naghahanda sa kasunod na pahayag.
theological_decisions:
- issue: Paglilipat ng pormula ng paghahayag na דְּבַר אֱלֹהִים
  choice: ang salita ng Diyos
  alternative: isang salita mula sa Diyos / ang mensahe ng Diyos
  rationale: Pinananatili ng napiling anyo ang pormal na bigat ng propetikong paghahayag at ang ugnayang construct ng Hebreo, habang kinikilala sa talababa ang tunay na posibleng pagbasa nang hindi nilulutas nang sapilitan ang leksikal na saklaw.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “Ngunit” upang maipakita ang banayad na pagkontra sa naunang pahintulot ni Natan; iniwasan ang makahoy na pag-uulit ng “at nangyari.”
