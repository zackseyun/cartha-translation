  text: וְ/עַתָּ֣ה יְהוָ֔ה אַתָּה ה֖וּא הָ/אֱלֹהִ֑ים וַ/תְּדַבֵּר֙ עַֽל עַבְדְּ/ךָ֔ הַ/טּוֹבָ֖ה הַ/זֹּֽאת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/026.yaml
  text: And now[a], Yahweh, you are God, and you have spoken this good thing concerning your servant.
translation:
  language: tl
  text: At ngayon, Yahweh, ikaw nga ang Diyos, at sinabi mo ang mabuting bagay na ito[a] tungkol sa iyong lingkod.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring “ang mabuting pangakong ito.” Literal sa Hebreo: “ang mabuting bagay na ito.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: At ngayon
  rationale: Pinananatili nito ang pang-ugnay at ang paglipat ng daloy ng panalangin.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ang banal na pangalang YHWH sa halip na palitan ito ng isang titulo.
- source_word: אַתָּה הוּא הָאֱלֹהִים
  choice: ikaw nga ang Diyos
  rationale: Ang “nga” ay natural na naghahayag sa Filipino ng diin ng magkasunod na panghalip sa Hebreo, nang hindi ginagawang mabigat ang pangungusap.
- source_word: וַתְּדַבֵּר
  choice: sinabi mo
  rationale: Tumutukoy ito sa naunang pagsasalita ng Diyos. Iniiwasan ng “sinabi” ang pagpapakahulugang “ipinangako,” na hindi tahasang nasa pandiwang Hebreo.
- source_word: עַל
  choice: tungkol sa
  rationale: Sa konstruksiyong ito, tinutukoy ng עַל ang paksa o taong may kinalaman sa sinabi.
- source_word: עַבְדְּךָ
  choice: iyong lingkod
  rationale: Ang “lingkod” ay angkop na mapagpakumbabang pagtukoy ng hari sa sarili sa harap ng Diyos.
- source_word: הַטּוֹבָה הַזֹּאת
  choice: ang mabuting bagay na ito
  rationale: Pinananatili nito ang literal at sadyang malawak na kahulugan ng Hebreo; ang “pangako” ay malinaw sa konteksto ngunit mas interpretatibo.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehovah
  rationale: Pangalan mismo ang ginamit sa tekstong Hebreo, kaya pinananatili ito bilang “Yahweh” sa halip na palitan ng titulo.
- issue: Kung tahasang tatawaging pangako ang “mabuting bagay”
  choice: mabuting bagay
  alternative: mabuting pangako
  rationale: Hindi tahasang gumagamit ang Hebreo ng salitang “pangako.” Pinananatili sa pangunahing teksto ang lawak ng parirala, habang inilalagay sa talababa ang kontekstuwal na pagbasa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “ikaw nga” upang natural na mapanatili ang diin ng Hebreo, at iniwasan ang mas interpretatibong “ipinangako” sa pangunahing teksto.
