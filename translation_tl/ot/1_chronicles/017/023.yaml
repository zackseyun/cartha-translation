base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/023.yaml
  text: And now[a], Yahweh, let the word that you have spoken concerning your servant and concerning his house be established forever, and do as you have spoken.
translation:
  language: tl
  text: At ngayon, Yahweh, nawa'y manatiling matatag magpakailanman ang salitang sinabi mo tungkol sa iyong lingkod at sa kanyang sambahayan[a], at gawin mo ang iyong sinabi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “angkan” o “dinastiya.” Sa kontekstong ito, ang Hebreong “bahay” ay maaaring tumukoy sa sambahayan, linya ng lahi, o maharlikang dinastiya ni David.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: At ngayon
  rationale: Pinananatili ang pang-ugnay at panandang panahong naglilipat sa panalangin ni David mula sa naunang pahayag tungo sa kasalukuyang kahilingan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang transliterasyon ng personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
- source_word: הַדָּבָר אֲשֶׁר דִּבַּרְתָּ
  choice: ang salitang sinabi mo
  rationale: Ang “salita” ay tuwirang katumbas ng דָּבָר at pinananatili ang ugnayan nito sa pandiwang “sinabi,” bagaman sa konteksto ay isang pangako ang tinutukoy.
- source_word: עַל עַבְדְּךָ וְעַל בֵּיתוֹ
  choice: tungkol sa iyong lingkod at sa kanyang sambahayan
  rationale: Ang עַל ay tumutukoy rito sa paksa ng sinabi ng Diyos. Ang “sambahayan” ay likas sa Filipino at maaaring tumukoy sa pamilya o angkan, kabilang ang maharlikang linya sa kontekstong ito.
- source_word: יֵאָמֵן
  choice: nawa'y pagtibayin
  rationale: Ang Niphal ng אמן ay nagpapahayag ng pagiging matatag o pinagtitibay. Ang anyong “nawa'y pagtibayin” ay naghahatid ng pakiusap na ang salita ng Diyos ay gawing tiyak at matatag.
- source_word: עַד עוֹלָם
  choice: magpakailanman
  rationale: Karaniwan at marangal na katumbas sa modernong Filipino para sa walang hanggang pagpapatuloy.
- source_word: וַעֲשֵׂה כַּאֲשֶׁר דִּבַּרְתָּ
  choice: at gawin mo ang iyong sinabi
  rationale: Direktang ipinahahayag ang kahilingang kumilos ang Diyos ayon sa dati niyang sinabi at pinananatili ang pag-uulit ng pandiwang “sinabi.”
theological_decisions:
- issue: Kahulugan ng בֵּיתוֹ sa konteksto ng tipan kay David
  choice: sambahayan
  alternative: angkan o dinastiya
  rationale: Hindi pisikal na bahay lamang ang tinutukoy kundi ang pamilya at nagpapatuloy na maharlikang linya ni David. Pinananatili ng “sambahayan” ang lawak ng talinghaga nang hindi ito nililimitahan sa teknikal na salitang “dinastiya”; inilalahad sa talababa ang ibang posibleng pagpapahayag.
translation_notes:
  register: Makabago ngunit marangal na Filipino ang ginamit. Ang ayos ay nananatiling anyong panalangin, at ang “nawa'y” ay malinaw na naghahatid ng pakiusap nang hindi pinapawi ang solemne at tipanang himig.
