base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/020.yaml
  text: O Yahweh[a], there is none like you, and there is no God besides you, in all that we have heard with our own ears.
translation:
  language: tl
  text: O Yahweh, walang katulad mo, at walang Diyos[a] maliban sa iyo, sa lahat ng narinig namin sa sarili naming mga tainga.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “walang diyos bukod sa iyo.”
    reason: Pinananatili ang leksikal at ortograpikong posibilidad ng אֱלֹהִים, yamang walang malaki o maliit na titik sa Hebreo.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ang banal na pangalang YHWH sa paraang malinaw at kinikilala sa makabagong Filipino.
- source_word: אֵין כָּמוֹךָ
  choice: walang katulad mo
  rationale: Likas at maikli itong Filipino na nagpapahayag na walang sinumang maihahambing sa Diyos.
- source_word: וְאֵין אֱלֹהִים זוּלָתֶךָ
  choice: at walang ibang Diyos maliban sa iyo
  rationale: Pinananatili nito ang tuwirang pahayag ng pagiging natatangi ng Diyos, habang ang 'maliban sa iyo' ay malapit sa saklaw ng זוּלָתֶךָ.
- source_word: בְּכֹל אֲשֶׁר
  choice: ayon sa lahat ng
  rationale: Ipinahihiwatig ng parirala na ang pagpapahayag ay kaayon ng kabuuan ng patotoong narinig nila.
- source_word: שָׁמַעְנוּ בְּאָזְנֵינוּ
  choice: narinig namin sa sarili naming mga tainga
  rationale: Natural na idyomang Filipino ito na nagpapanatili sa tahasang pagbanggit ng mga tainga bilang paraan ng pagkarinig.
theological_decisions:
- issue: Pagpapahayag ng וְאֵין אֱלֹהִים זוּלָתֶךָ
  choice: walang ibang Diyos maliban sa iyo
  alternative: walang diyos bukod sa iyo
  rationale: Ang pangunahing salin ay nagpapanatili sa ganap na pahayag ng pagiging tanging Diyos, ngunit hindi itinatago ng talababa na walang pagkakaiba ang Hebreo sa malaki at maliit na titik.
translation_notes:
  register: Makabago ngunit marangal na Filipino; pinanatili ang panawagang “O Yahweh” at ang matibay na himig ng panalangin. Ginamit ang “sarili naming mga tainga” upang mapanatili ang idiomatikong diin ng Hebreo.
