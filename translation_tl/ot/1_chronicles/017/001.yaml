  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יְהִ֕י כַּ/אֲשֶׁ֛ר יָשַׁ֥ב דָּוִ֖יד בְּ/בֵית֑/וֹ וַ/יֹּ֨אמֶר דָּוִ֜יד אֶל נָתָ֣ן הַ/נָּבִ֗יא הִנֵּ֨ה אָנֹכִ֤י יוֹשֵׁב֙ בְּ/בֵ֣ית הָֽ/אֲרָזִ֔ים וַ/אֲר֥וֹן בְּרִית יְהוָ֖ה תַּ֥חַת יְרִיעֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/001.yaml
  text: It happened[a], when David was living in his house, that David said to Nathan the prophet, “Look, I am living in a house of cedar, but the ark of the covenant of Yahweh is under curtains.”
translation:
  language: tl
  text: Nang manirahan na si David sa kanyang bahay, sinabi ni David kay Natan, ang propeta, “Tingnan mo, nakatira ako sa isang bahay na yari sa sedro, ngunit ang kaban ng tipan ni Yahweh ay nasa ilalim ng mga tabing[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga tabing ng tolda.” Ang salitang Hebreo ay tumutukoy sa mga telang tabing, lalo na sa mga tabing ng tolda o tabernakulo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: Nang
  rationale: Ipinakikilala ng Hebreo ang bagong tagpo at ang kalagayang panahunan. Natural na naipapahayag ito sa modernong Tagalog sa pamamagitan ng “Nang,” nang hindi nagdaragdag ng tahasang salitang gaya ng “ngayon.”
- source_word: יָשַׁב ... יוֹשֵׁב
  choice: manirahan ... nakatira
  rationale: Sa konteksto ng paninirahan sa bahay, ang ישׁב ay tumutukoy sa pagtira, hindi lamang sa pag-upo. Pinananatili ng magkaugnay na salitang Tagalog ang pag-uulit sa Hebreo.
- source_word: בְּבֵיתוֹ
  choice: sa kanyang bahay
  rationale: Pinananatili ang literal na “bahay” sa halip na gawing “palasyo,” sapagkat mahalaga ang pag-uulit nito sa sinabi ni David.
- source_word: נָתָן הַנָּבִיא
  choice: Natan na propeta
  rationale: Likas na Tagalog na pagkakakilanlan sa pangalan at tungkulin ni Natan.
- source_word: הִנֵּה
  choice: Tingnan mo
  rationale: Tinatawag nito ang pansin ni Natan sa napansin ni David; malinaw at kasalukuyang pananalita ito sa Tagalog.
- source_word: בְּבֵית הָאֲרָזִים
  choice: sa isang bahay na yari sa sedro
  rationale: Ipinahihiwatig ng parirala ang bahay na gawa sa kahoy na sedro at pinananatili ang kaibahan sa tirahan ng kaban.
- source_word: וַאֲרוֹן בְּרִית יְהוָה
  choice: ngunit ang kaban ng tipan ni Yahweh
  rationale: Bagaman payak na waw ang pang-ugnay, malinaw na pagsalungat ang gamit nito rito. Ang “ngunit” ay natural na nagpapahayag ng pag-aalala ni David.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin sa transliterasyon ang personal na pangalang banal na יהוה, sa halip na palitan ito ng isang titulo.
- source_word: תַּחַת יְרִיעוֹת
  choice: nasa ilalim ng mga tabing
  rationale: Ang יְרִיעוֹת ay mga telang tabing, lalo na yaong ginagamit sa tolda o tabernakulo. Pinananatili ng pangunahing teksto ang mas malawak na kahulugan, habang nililinaw sa talababa ang posibleng espesipikong diwa.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יהוה
  choice: Yahweh
  alternative: Jehovah; PANGINOON
  rationale: Personal na pangalan ang nasa tekstong Hebreo. Ang “Yahweh” ay tuwirang transliterasyon at hindi pinapalitan ng titulo ang pangalan.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Pinanatili ang “bahay” at ang pag-uulit ng konsepto ng paninirahan, habang ginawang likas sa Tagalog ang daloy ng salaysay at tuwirang pananalita.
