  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/הָיָ֗ה כִּֽי מָלְא֤וּ יָמֶ֨י/ךָ֙ לָ/לֶ֣כֶת עִם אֲבֹתֶ֔י/ךָ וַ/הֲקִֽימוֹתִ֤י אֶֽת זַרְעֲ/ךָ֙ אַחֲרֶ֔י/ךָ אֲשֶׁ֥ר יִהְיֶ֖ה מִ/בָּנֶ֑י/ךָ וַ/הֲכִינוֹתִ֖י אֶת מַלְכוּתֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/011.yaml
  text: And it shall be[a], when your days are fulfilled to go to be with your fathers, that I will raise up your offspring after you, who shall be one of your sons, and I will establish his kingdom.
translation:
  language: tl
  text: At kapag nalubos na ang iyong mga araw at yumaon ka upang makasama ang iyong mga ninuno[a], ibabangon ko pagkatapos mong pumanaw ang iyong supling, na isa sa iyong mga anak na lalaki, at patatatagin ko ang kanyang kaharian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “sumama sa iyong mga ninuno,” isang idyomang Hebreo para sa pagkamatay at pagsama sa mga ninuno.
    reason: cultural_note
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: At kapag
  rationale: Likas na panandang temporal sa modernong Tagalog na pinananatili ang pagpapatuloy ng pahayag at ang diwang ‘kapag nangyari na.’
- source_word: מָלְאוּ יָמֶיךָ
  choice: nalubos na ang iyong mga araw
  rationale: Pinananatili ang marangal na idyomang Hebreo para sa pagkumpleto ng haba ng buhay nang hindi tahasang pinapalitan ng ‘namatay ka.’
- source_word: לָלֶכֶת עִם אֲבֹתֶיךָ
  choice: yumaon ka upang makasama ang iyong mga ninuno
  rationale: Ang ‘yumaon’ ay dignified at malinaw na pahiwatig ng kamatayan; ang ‘makasama ang iyong mga ninuno’ ay naghahatid ng natatanging idyoma ng Cronica.
- source_word: וַהֲקִימוֹתִי
  choice: ibabangon ko
  rationale: Ipinahahayag ang pagpapalitaw o pagtatalaga ng isang kahalili at iniiwasang pag-isahin ito sa kasunod na הכין.
- source_word: זַרְעֲךָ
  choice: iyong supling
  rationale: Ang ‘supling’ ay natural sa pangako tungkol sa angkan at naipapanatili ang posibleng kolektibo ngunit dito ay isahang sanggunian.
- source_word: אַחֲרֶיךָ
  choice: kasunod mo
  rationale: Pinananatili ang temporal at dinastikong diwa nang hindi nagdaragdag ng mas tahasang interpretasyong ‘pagkamatay mo.’
- source_word: אֲשֶׁר יִהְיֶה מִבָּנֶיךָ
  choice: na isa sa iyong mga anak na lalaki
  rationale: 'Malinaw at natural na inilalarawan ang partitive na diwa: ang ipinangakong supling ay kabilang sa sariling mga anak na lalaki ni David.'
- source_word: וַהֲכִינוֹתִי
  choice: patatatagin ko
  rationale: Ipinahahayag ang paggawa sa kaharian na matibay at matatag, at naihihiwalay sa ‘ibabangon’ para sa קום.
- source_word: מַלְכוּתוֹ
  choice: kanyang kaharian
  rationale: Saklaw nito ang dinastiko at pampolitikang paghahari, hindi lamang ang katungkulan ng hari.
theological_decisions:
- issue: Pangakong dinastiko at posibleng mesiyanikong pahiwatig
  choice: Isinalin ang tuwirang makasaysayang diwa ng isang kahalili ni David mula sa kanyang mga anak nang walang idinagdag na titulong mesiyaniko.
  alternative: Gawing tahasang mesiyaniko ang pangunahing teksto.
  rationale: Tinutukoy mismo ng talata ang supling mula sa mga anak ni David at ang pagpapatatag ng kanyang kaharian. Dapat manggaling sa mas malawak na konteksto at kanon ang pag-unlad na mesiyaniko, hindi sa dagdag na salita ng salin.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Pinanatili ang idyomang ‘nalubos ang mga araw’ at gumamit ng ‘yumaon’ para sa solemneng konteksto; iniwasan ang sobrang arkaiko o denominasyonal na pananalita.
