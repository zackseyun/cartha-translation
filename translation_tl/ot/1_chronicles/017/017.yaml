  text: וַ/תִּקְטַ֨ן זֹ֤את בְּ/עֵינֶ֨י/ךָ֙ אֱלֹהִ֔ים וַ/תְּדַבֵּ֥ר עַל בֵּֽית עַבְדְּ/ךָ֖ לְ/מֵ/רָח֑וֹק וּ/רְאִיתַ֗/נִי כְּ/ת֧וֹר הָ/אָדָ֛ם הַֽ/מַּעֲלָ֖ה יְהוָ֥ה אֱלֹהִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/017.yaml
  text: And this was a small thing in your eyes[a], O God; yet you have spoken concerning your servant’s house for a long time to come, and you have regarded me according to the rank of man on high, O Yahweh God.
translation:
  language: tl
  text: At maliit na bagay lamang ito sa iyong paningin[a], O Diyos; gayunman, nagsalita ka tungkol sa sambahayan ng iyong lingkod para sa malayong hinaharap, at itinuring mo ako ayon sa antas ng taong mataas ang kalagayan, O Yahweh na Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O kaya, “tila hindi ito mahalaga sa iyo.” Sa huling bahagi ng talata, maaari ring isalin: “ipinakita mo sa akin ang mga darating na salinlahi ng mga tao,” o “itinuring mo ako na gaya ng isang taong mataas ang katayuan.” Mahirap unawain ang Hebreo ng huling parirala at maaari itong bigyang-kahulugan sa iba''t ibang paraan.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַתִּקְטַן זֹאת
  choice: maliit na bagay lamang ito
  rationale: Pinananatili nito ang idyomang Hebreo na nagsasabing ang bagay ay maliit o hindi gaanong mahalaga sa pagtataya ng Diyos, habang natural pa rin sa Tagalog.
- source_word: בְּעֵינֶיךָ
  choice: sa iyong paningin
  rationale: Karaniwang katumbas sa Tagalog ng idyomang Hebreo tungkol sa pagtataya o pagtingin.
- source_word: אֱלֹהִים
  choice: O Diyos
  rationale: Tuwirang pagtawag sa Diyos sa panalangin ni David.
- source_word: וַתְּדַבֵּר עַל בֵּית עַבְדְּךָ
  choice: nagsalita ka tungkol sa sambahayan ng iyong lingkod
  rationale: Pinananatili ang pangunahing kahulugan ng דבר על nang hindi tahasang ginagawang “nangako”; ipinahihiwatig na ng konteksto ang bisa nitong pangako.
- source_word: לְמֵרָחוֹק
  choice: para sa malayong hinaharap
  rationale: Sa konteksto, temporal ang diwa ng “malayo” at tumutukoy sa kinabukasan ng sambahayan ni David.
- source_word: וּרְאִיתַנִי
  choice: itinuring mo ako
  rationale: Ang ראה rito ay higit sa literal na pagtingin at tumutukoy sa pagkilala o pakikitungo kay David sa isang tiyak na paraan.
- source_word: כְּתוֹר
  choice: ayon sa katayuan
  rationale: Maaaring tumukoy ang תור sa kaayusan, hanay, o antas. Ang “katayuan” ay nagpapanatili sa posibleng diwa ng ranggo nang hindi lubusang nilulutas ang malabong parirala.
- source_word: הָאָדָם
  choice: ng taong
  rationale: Isinasalin ang singular na אָדָם bilang “tao” sa loob ng paghahambing tungkol sa isang mataas na kalagayan.
- source_word: הַמַּעֲלָה
  choice: nasa mataas na kalagayan
  rationale: Ipinahahayag ang diwa ng pag-akyat o kadakilaan bilang mataas na posisyon o kalagayan.
- source_word: יְהוָה אֱלֹהִים
  choice: O Yahweh na Diyos
  rationale: Pinananatili ang personal na pangalang Yahweh at ang kasunod na titulong Diyos sa tuwirang pagtawag.
theological_decisions:
- issue: Kahulugan ng mahirap na pangwakas na pariralang וּרְאִיתַנִי כְּתוֹר הָאָדָם הַמַּעֲלָה
  choice: itinuring mo ako ayon sa katayuan ng taong nasa mataas na kalagayan
  alternative: ipinakita mo sa akin ang mga darating na salinlahi ng mga tao; o itinuring mo ako na gaya ng isang taong mataas ang katayuan
  rationale: Matatag ang tekstong Hebreo ngunit malabo ang kahulugan ng parirala. Ang pangunahing salin ay nananatiling malapit sa mga salita at posibleng diwa ng ranggo o kaayusan, samantalang inilalahad sa talababa ang mahahalagang alternatibo sa halip na tahimik na pumili ng iisang tiyak na pagpapakahulugan.
translation_notes:
  register: Makabago ngunit marangal na Tagalog. Ginamit ang “sambahayan” para sa dinastiko at pampamilyang diwa ng בַּיִת, at pinanatili ang pangalang Yahweh. Ang bahagyang pormal na ayos ng huling sugnay ay sinadya upang mapanatili ang tunay na kalabuan ng Hebreo.
