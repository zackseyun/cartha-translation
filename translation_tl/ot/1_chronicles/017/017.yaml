revisions:
- from: At maliit na bagay lamang ito sa iyong paningin[a], O Diyos; gayunman, nagsalita ka tungkol sa sambahayan ng iyong lingkod para sa malayong hinaharap, at itinuring mo ako ayon sa katayuan ng taong nasa mataas na kalagayan, O Yahweh na Diyos.
  to: At maliit na bagay lamang ito sa iyong paningin[a], O Diyos; gayunman, nagsalita ka tungkol sa sambahayan ng iyong lingkod para sa malayong hinaharap, at itinuring mo ako ayon sa antas ng taong mataas ang kalagayan, O Yahweh na Diyos.
  rationale: Pinalitan ang ‘katayuan’ ng ‘antas’ sa pangunahing salin upang maging mas natural ang Tagalog para sa posibleng diwa ng ranggo, at pinasimple ang kaugnay na parirala nang hindi inaalis ang sadyang kalabuan nito. Inayos din ang introduksiyon ng alternatibong salin sa talababa.
