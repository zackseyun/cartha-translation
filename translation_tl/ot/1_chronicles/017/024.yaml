  naturalness: Marangal at likas sa modernong Filipino ang kabuuang rehistro. Ang “sa pagsasabing” ay mas malapit sa Hebreo kaysa “upang sabihin ng mga tao,” at ang “sambahayan ni David na iyong lingkod” ay mas malinaw na ikinakabit ang “iyong lingkod” kay David.
  terminology: Ang “Yahweh,” “mga hukbo,” “Diyos para sa Israel,” at “sambahayan” ay angkop. Ang talababa sa “sambahayan” ay wastong nagpapaliwanag ng dinastikong saklaw nang hindi ipinapalit iyon sa mismong teksto.
