  text: וְ֠/יֵֽאָמֵן וְ/יִגְדַּ֨ל שִׁמְ/ךָ֤ עַד עוֹלָם֙ לֵ/אמֹ֔ר יְהוָ֤ה צְבָאוֹת֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל אֱלֹהִ֖ים לְ/יִשְׂרָאֵ֑ל וּ/בֵית דָּוִ֥יד עַבְדְּ/ךָ֖ נָכ֥וֹן לְ/פָנֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/024.yaml
  text: May it be established[a], and may your name be magnified forever, saying, ‘Yahweh of hosts, the God of Israel[b], is God to Israel,’ and may the house of David your servant be established before you.
translation:
  language: tl
  text: Nawa’y mapagtibay ito, at nawa’y dakilain ang pangalan mo magpakailanman sa pagsasabing, “Si Yahweh ng mga hukbo, ang Diyos ng Israel, ay Diyos para sa Israel[a].” At nawa’y maging matatag sa harap mo ang sambahayan ni David na iyong lingkod[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “ay Diyos ng Israel.” Mas literal ang “ay Diyos para sa Israel,” na nagpapanatili sa pang-ukol ng Hebreo at sa diwang pakikipag-ugnayan o pagkilos alang-alang sa Israel.'
    reason: lexical_alternative
  - marker: b
    text: Ang “sambahayan” dito ay tumutukoy sa maharlikang angkan o dinastiya ni David.
    reason: cultural_note
lexical_decisions:
- source_word: וְיֵאָמֵן
  choice: Nawa’y mapagtibay ito
  rationale: Ang Niphal na anyong may diwang paghiling ay tumutukoy sa pagpapatibay ng naunang pangako. Idinagdag ang “ito” bilang likas na pantukoy sa Filipino, nang hindi tahasang nililimitahan kung pangako, salita, o pahayag ang tinutukoy.
- source_word: וְיִגְדַּל שִׁמְךָ
  choice: nawa’y dakilain ang pangalan mo
  rationale: Pinananatili ng “dakilain” ang diwa ng pagpaparangal sa pangalan ng Diyos at ang mapanalanging lakas ng pandiwa.
- source_word: עַד עוֹלָם
  choice: magpakailanman
  rationale: Likas at marangal na salin sa modernong Filipino para sa walang-hanggang tagal.
- source_word: לֵאמֹר
  choice: upang sabihin ng mga tao
  rationale: Ipinahahayag nang natural sa Filipino ang kasunod na pampublikong pagkilala; ang di-tiyak na tagapagsalita sa Hebreo ay hindi tinukoy bilang isang partikular na pangkat.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh ng mga hukbo
  rationale: Pinananatili ang personal na pangalang Yahweh at ang malawak na larawan ng mga hukbo sa banal na titulo.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ang Diyos ng Israel
  rationale: Tuwirang inilalarawan ang tipanang kaugnayan ni Yahweh sa Israel.
- source_word: אֱלֹהִים לְיִשְׂרָאֵל
  choice: ay Diyos para sa Israel
  rationale: Pinananatili ng “para sa” ang puwersang relational o benefactive ng pang-ukol na לְ, sa halip na agad itong gawing pagmamay-ari.
- source_word: וּבֵית דָּוִיד עַבְדְּךָ
  choice: ang sambahayan ng lingkod mong si David
  rationale: Pinananatili ng “sambahayan” ang larawan ng בַּיִת habang pinahihintulutan ang kontekstuwal na kahulugang maharlikang angkan o dinastiya.
- source_word: נָכוֹן לְפָנֶיךָ
  choice: maging matatag sa harap mo
  rationale: Isinasalin ang kalagayang matibay at panatag ng sambahayan ni David sa presensiya at paningin ng Diyos.
theological_decisions:
- issue: Pagbibigay ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo, kaya pinanatili ito sa transliterasyong “Yahweh” sa halip na palitan ng titulo.
- issue: Lakas ng mga pandiwang di-ganap sa konteksto ng panalangin
  choice: Mga paghiling na may “Nawa’y”
  alternative: Mga tiyak na pahayag sa hinaharap
  rationale: Sapagkat nananalangin si David bilang tugon sa pangako ng Diyos, mas angkop ang optatibong diwa, ngunit hindi nito ginagawang utos ang mga pandiwa.
- issue: Kahulugan ng אֱלֹהִים לְיִשְׂרָאֵל
  choice: Diyos para sa Israel
  alternative: Diyos ng Israel
  rationale: Pinananatili ang tunay na kalabuan at relational na puwersa ng לְ; inilalagay sa talababa ang mas madulas ngunit mas interpretatibong alternatibo.
- issue: Kahulugan ng “sambahayan” ni David
  choice: Sambahayan, na maaaring tumukoy sa maharlikang angkan o dinastiya
  alternative: Pamilya lamang ni David
  rationale: Sa konteksto ng tipanang pangako, ang בַּיִת ay lumalampas sa kasalukuyang sambahayan at maaaring tumukoy sa nagpapatuloy na dinastiya.
translation_notes:
  register: Modernong Filipino na marangal at angkop sa panalangin. Ginamit ang “nawa’y” para sa mapanalanging paghiling, “dakilain” para sa pagpaparangal sa pangalan ng Diyos, at “sambahayan” upang mapanatili ang konkretong larawan ng Hebreo habang nililinaw sa talababa ang dinastikong diwa.
