  text: וַ/יָּבֹא֙ הַ/מֶּ֣לֶךְ דָּוִ֔יד וַ/יֵּ֖שֶׁב לִ/פְנֵ֣י יְהוָ֑ה וַ/יֹּ֗אמֶר מִֽי אֲנִ֞י יְהוָ֤ה אֱלֹהִים֙ וּ/מִ֣י בֵיתִ֔/י כִּ֥י הֲבִיאֹתַ֖/נִי עַד הֲלֹֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/016.yaml
  text: Then King David went in and sat before Yahweh and said[a], “Who am I, O Yahweh God, and what is my house, that you have brought me this far?”
translation:
  language: tl
  text: Pagkatapos, pumasok si Haring David, umupo sa harap ni Yahweh, at nagsabi, “Sino ba ako, O Yahweh na Diyos, at ano ba ang aking sambahayan[a], na dinala mo ako hanggang dito?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pamilya,” “angkan,” o “dinastiya.” Ang salitang Hebreo para sa “sambahayan” ay literal na “bahay” at maaari ring tumukoy, sa kontekstong ito, sa maharlikang linya ni David.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: pumasok
  rationale: Maaaring mangahulugang ‘dumating,’ ‘pumunta,’ o ‘pumasok’ ang בוא. Sa konteksto ng paglapit ni David sa presensiya ni Yahweh, malinaw at likas ang ‘pumasok’ nang hindi tinutukoy ang isang lugar na hindi tahasang binanggit.
- source_word: הַמֶּלֶךְ דָּוִיד
  choice: si Haring David
  rationale: Ito ang likas na ayos ng titulo at pangalang pantangi sa modernong Filipino.
- source_word: וַיֵּשֶׁב
  choice: umupo
  rationale: Bagaman maaari ring mangahulugang ‘manirahan’ o ‘manatili’ ang ישב, ang sunod-sunod na kilos sa salaysay ay pabor sa kongkretong kahulugang ‘umupo.’
- source_word: לִפְנֵי יְהוָה
  choice: sa harap ni Yahweh
  rationale: Pinananatili nito ang larawan ng pagharap sa presensiya ng Diyos at ang personal na pangalang יהוה bilang ‘Yahweh.’
- source_word: יְהוָה אֱלֹהִים
  choice: Yahweh na Diyos
  rationale: Tuwirang pagtawag ito kay Yahweh. Ang pang-ugnay na ‘na’ ay natural sa Filipino at malinaw na iniuugnay ang pangalang Yahweh sa titulong Diyos.
- source_word: מִי אֲנִי
  choice: Sino ba ako
  rationale: Natural na ipinahahayag ng ‘ba’ ang mapagpakumbabang pagtataka ng retorikal na tanong.
- source_word: וּמִי בֵיתִי
  choice: at ano ba ang aking sambahayan
  rationale: Literal na inuulit ng Hebreo ang ‘sino,’ ngunit natural sa Filipino ang ‘ano’ para sa sambahayan. Ang ‘sambahayan’ ay nagpapanatili sa malawak na saklaw ng בַּיִת bilang pamilya, sambahayan, at maharlikang angkan.
- source_word: כִּי
  choice: upang
  rationale: Sa retorikal na tanong, likas na ipinahahayag ng ‘upang’ ang diwa ng ‘ano ang aking kahalagahan kaya dinala mo ako…,’ bagaman maaari ring isalin ang ugnayan bilang ‘kaya.’
- source_word: הֲבִיאֹתַנִי
  choice: dalhin mo ako
  rationale: Ang Hiphil ng בוא ay sanhiang anyo; malinaw na ipinahahayag ng ‘dalhin’ na si Yahweh ang naghatid kay David sa kasalukuyan niyang kalagayan.
- source_word: עַד הֲלֹם
  choice: hanggang sa kalagayang ito
  rationale: Sa konteksto, hindi lamang layo ng lugar kundi ang puntong naabot ni David sa buhay at paghahari ang tinutukoy. Ginagawang malinaw ito ng ‘kalagayang ito’ nang hindi nilulutas nang labis ang lawak ng parirala.
theological_decisions:
- issue: Paglalarawan sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Pangalang tipan ang יְהוָה at tuwirang ginagamit sa talata; pinananatili ng ‘Yahweh’ ang katangian nito bilang pangalan sa halip na palitan ng titulo.
- issue: Saklaw ng ‘bahay’ ni David
  choice: sambahayan, na may paliwanag sa talababa
  alternative: bahay; pamilya; angkan; dinastiya
  rationale: Kasama sa בֵּיתִי ang pamilya at sambahayan ni David at, dahil sa pangako sa konteksto, maaari ring umabot sa kanyang maharlikang angkan. Hindi ito nilimitahan sa ‘dinastiya’ lamang.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang ‘Sino ba ako’ upang likas na maipahayag ang mapagpakumbabang pagtataka. Ang ‘sambahayan’ ay mas natural kaysa literal na ‘bahay’ sa tanong, habang pinananatili ng talababa ang buong saklaw at metapora ng Hebreo.
