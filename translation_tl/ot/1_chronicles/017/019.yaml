base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/019.yaml
  text: O Yahweh[a], for the sake of your servant and according to your heart, you have done all this greatness[b], to make known all these great things.
translation:
  language: tl
  text: Yahweh, alang-alang sa iyong lingkod at ayon sa iyong puso[a], ginawa mo ang lahat ng kadakilaang ito upang ipaalam ang lahat ng dakilang bagay.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ayon sa iyong kalooban.” Sa Hebreo, “ayon sa iyong puso.”
    reason: lexical_alternative
  - marker: b
    text: Mula sa isahang “ang lahat ng kadakilaang ito,” lumilipat ang Hebreo sa maramihang “ang lahat ng dakilang bagay.” Maaaring ang una ay kolektibong pagbubuod at ang ikalawa ay tumutukoy sa mga kapahayagan nito.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang personal na pangalan ng Diyos bilang tuwirang katumbas ng YHWH.
- source_word: בַּעֲבוּר עַבְדְּךָ
  choice: alang-alang sa iyong lingkod
  rationale: Ipinapahayag ng parirala ang pagsasaalang-alang o motibo; natural ito sa marangal na panalangin at pinananatili ang pagkilala ni David sa sarili bilang lingkod.
- source_word: וּכְלִבְּךָ
  choice: at ayon sa iyong puso
  rationale: Pinananatili ang Hebreong metapora ng puso bilang kalooban, hangarin, o panloob na layunin.
- source_word: עָשִׂיתָ
  choice: ginawa mo
  rationale: Payak at natural na katumbas ng perpektong pandiwa sa kontekstong tumutukoy sa nagawa na ng Diyos.
- source_word: כָּל הַגְּדוּלָּה הַזֹּאת
  choice: ang lahat ng kadakilaang ito
  rationale: Pinananatili ang isahang abstraktong pangngalan na nagbubuod sa dakilang ginawa ng Diyos.
- source_word: לְהֹדִיעַ
  choice: upang ipaalam
  rationale: 'Malinaw na ipinapahayag ang causative na diwa: gawing nalalaman o ipakilala.'
- source_word: כָּל הַגְּדֻלּוֹת
  choice: ang lahat ng dakilang bagay na ito
  rationale: Ginawang likas sa Tagalog ang maramihang anyo habang pinananatili ang ugnayang leksikal nito sa naunang 'kadakilaan.'
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; PANGINOON
  rationale: Pinananatili ang personal na banal na pangalan nang hindi ito pinapalitan ng isang titulo.
- issue: Antropomorpikong pariralang 'ayon sa iyong puso'
  choice: ayon sa iyong puso
  alternative: ayon sa iyong kalooban
  rationale: Pinananatili ang metapora at ang saklaw nitong maaaring tumukoy sa kalooban, hangarin, o layunin, sa halip na tahimik na paliitin ang kahulugan.
- issue: Paglipat mula isahang 'kadakilaan' tungo sa maramihang 'dakilang bagay'
  choice: panatilihin ang paglipat sa bilang
  alternative: gawing parehong maramihan ang dalawang parirala
  rationale: 'Sinasalamin nito ang tunay na anyo at retorikal na galaw ng Hebreo: isang kolektibong pagbubuod na sinusundan ng mga kapahayagan nito.'
translation_notes:
  register: Modernong Filipino Tagalog na marangal at angkop sa panalangin. Ginamit ang “alang-alang,” “lingkod,” at “ayon sa iyong puso” upang manatiling natural ngunit malapit sa Hebreo. Ang bawat panandang talababa ay nasa pangunahing teksto.
