  text: וְ֠/עַתָּה כֹּֽה תֹאמַ֞ר לְ/עַבְדִּ֣/י לְ/דָוִ֗יד כֹּ֤ה אָמַר֙ יְהוָ֣ה צְבָא֔וֹת אֲנִ֤י לְקַחְתִּ֨י/ךָ֙ מִן הַ/נָּוֶ֔ה מִֽן אַחֲרֵ֖י הַ/צֹּ֑אן לִ/הְי֣וֹת נָגִ֔יד עַ֖ל עַמִּ֥/י יִשְׂרָאֵֽל־ס־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/007.yaml
  text: 'Now therefore[a], this is what you shall say to my servant David: This is what Yahweh of hosts says: I took you from the pasture, from following the flock[b], to be ruler over my people Israel.'
translation:
  language: tl
  text: 'Kaya ngayon, ito ang sabihin mo sa lingkod kong si David: Ganito ang sabi ni Yahweh ng mga hukbo: “Kinuha kita mula sa pastulan, mula sa pagsunod sa kawan, upang maging pinuno ng bayan kong Israel.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: Kaya ngayon
  rationale: Ipinapahayag ang paglipat ng mensahe at ang bahagyang inferensiyal na puwersa ng pang-ugnay, hindi lamang ang pagkakasunod sa panahon.
- source_word: כֹּה תֹאמַר
  choice: ito ang sabihin mo
  rationale: Likas na makabagong Tagalog na nagpapanatili sa pautos na puwersa ng pormula ng mensahero.
- source_word: לְעַבְדִּי
  choice: sa lingkod kong
  rationale: Sa kontekstong ito, ang עֶבֶד ay marangal na katawagan kay David bilang naglilingkod sa Diyos, hindi pangunahing pagtukoy sa kalagayan ng isang alipin.
- source_word: כֹּה אָמַר
  choice: Ganito ang sinabi
  rationale: Pinananatili ang karaniwang pormulang propetiko; ang perpektong anyo ng אָמַר ay gumaganap bilang pagpapakilala sa tuwirang pahayag.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat ang pangalang tipan na kinakatawan ng Tetragrammaton.
- source_word: צְבָאוֹת
  choice: ng mga hukbo
  rationale: Pinananatili ang malawak na saklaw ng צְבָאוֹת at hindi ito nililimitahan sa mga hukbong tao lamang.
- source_word: לְקַחְתִּיךָ
  choice: Kinuha kita
  rationale: Tuwirang salin na nagbibigay-diin sa pagkilos ng Diyos sa pagtawag at pag-angat kay David.
- source_word: מִן הַנָּוֶה
  choice: mula sa pastulan
  rationale: Sa kontekstong pastoral, ang נָוֶה ay tumutukoy sa pastulan o lugar ng pagpapastol; malinaw at natural ang “pastulan” sa Tagalog.
- source_word: מִן אַחֲרֵי הַצֹּאן
  choice: mula sa pagsunod sa kawan
  rationale: Pinananatili ang kongkretong larawan ni David na nasa likuran at sumusunod sa kawan, sa halip na gawing mas interpretatibong “pag-aalaga.”
- source_word: לִהְיוֹת נָגִיד
  choice: upang maging pinuno
  rationale: Ang נָגִיד ay isang itinalagang namumuno; ang “pinuno” ay malinaw at hindi nagpapasok ng mas teknikal na titulong maharlika.
- source_word: עַל עַמִּי יִשְׂרָאֵל
  choice: ng bayan kong Israel
  rationale: Natural na Tagalog na nagpapanatili sa pamumuno ni David at sa pag-aangkin ng Diyos sa Israel bilang kanyang bayan.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; PANGINOON
  rationale: Ang Hebreo ay tahasang gumagamit ng Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalang tipan nang hindi ito pinapalitan ng titulo.
- issue: Diwa ng titulong עַבְדִּי para kay David
  choice: lingkod kong si David
  alternative: alipin kong si David
  rationale: Dito, marangal at tipanang paglilingkod ang nangingibabaw na diwa, bagaman maaaring tumukoy ang salita sa alipin sa ibang konteksto.
- issue: Saklaw ng נָגִיד
  choice: pinuno
  alternative: tagapamahala; prinsipe
  rationale: Ipinahahayag ng “pinuno” ang awtoridad na ipinagkaloob ng Diyos nang hindi ipinapalagay ang isang mas tiyak na teknikal o dinastikong titulo.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang dobleng pormula ng mensahe, ang imaheng pastoral, at ang banal na pangalang Yahweh. Walang talababa dahil malinaw na maisasalin sa pangunahing teksto ang mahahalagang leksikal na pagpapasya nang hindi kinakailangang lutasin ang anumang tunay na kalabuan.
