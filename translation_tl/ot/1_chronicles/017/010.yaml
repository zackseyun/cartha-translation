source:
  edition: WLC
  text: וּ/לְ/מִ/יָּמִ֗ים אֲשֶׁ֨ר צִוִּ֤יתִי שֹֽׁפְטִים֙ עַל עַמִּ֣/י יִשְׂרָאֵ֔ל וְ/הִכְנַ֖עְתִּי אֶת כָּל אוֹיְבֶ֑י/ךָ וָ/אַגִּ֣ד לָ֔/ךְ וּ/בַ֖יִת יִֽבְנֶה לְּ/ךָ֥ יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/010.yaml
  text: from the days when I appointed judges over my people Israel. And I will subdue all your enemies. Moreover[a], I tell you that Yahweh will build you a house.
translation:
  language: tl
  text: mula pa noong mga araw na nagtalaga ako ng mga hukom upang mamuno sa aking bayang Israel. Pasusukuin ko ang lahat ng iyong mga kaaway. At ipinahahayag ko sa iyo na si Yahweh ang magtatayo ng bahay para sa iyo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “bahay” ay maaaring tumukoy sa maharlikang sambahayan o dinastiya ni David. Pinananatili rin ng salita ang paglalaro ng salita sa konteksto tungkol sa pagtatayo ng bahay o templo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְמִיָּמִים
  choice: mula pa noong mga araw
  rationale: Likas na ipinahahayag sa Filipino ang panahong pinagmulan at ipinagpapatuloy ang kaugnayan sa naunang pangako.
- source_word: אֲשֶׁר צִוִּיתִי שֹׁפְטִים
  choice: na nagtalaga ako ng mga hukom
  rationale: Sa kontekstong pangkasaysayan, ang צוה ay tumutukoy sa pag-aatas o pagtatalaga ng mga hukom, hindi lamang sa pagbibigay sa kanila ng utos.
- source_word: עַל עַמִּי יִשְׂרָאֵל
  choice: sa aking bayang Israel
  rationale: Natural sa Filipino ang 'mga hukom sa aking bayan' bilang pahayag ng kanilang pamamahala; pinananatili ang mahalagang pag-angkin na 'aking bayan.'
- source_word: וְהִכְנַעְתִּי
  choice: Pasusukuin ko
  rationale: Ang anyo ay may puwersang panghinaharap sa sunod-sunod na pangako, at ang 'pasusukuin' ay angkop sa lahat ng kaaway bilang layon.
- source_word: אֶת כָּל אוֹיְבֶיךָ
  choice: ang lahat ng iyong mga kaaway
  rationale: Pinananatili ang kabuuang saklaw ng כָּל at ang ikalawang panauhang isahan.
- source_word: וָאַגִּד לָךְ
  choice: At ipinahahayag ko sa iyo
  rationale: Ipinakikita ang taimtim at gumaganap na pahayag ng Diyos nang hindi sapilitang nilalagyan ng panandang 'bukod dito' na wala namang hiwalay na salita sa Hebreo.
- source_word: וּבַיִת יִבְנֶה לְּךָ יְהוָה
  choice: na si Yahweh ang magtatayo ng isang sambahayan para sa iyo
  rationale: Pinananatili ang larawang 'magtatayo' at ang malawak na kahulugan ng בַּיִת. Mas malinaw sa modernong Filipino ang 'sambahayan' para sa angkan o dinastiya, habang ang talababa ay nagpapanatili sa mas literal na 'bahay' at sa sadyang paglalaro ng salita.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang personal na pangalang kinakatawan ng Tetragrammaton sa halip na palitan ito ng isang titulo.
theological_decisions:
- issue: Kahulugan ng בַּיִת sa pangwakas na sugnay
  choice: sambahayan
  alternative: bahay; angkan o dinastiya
  rationale: Sa konteksto, ang pangako ay tungkol sa pagpapatuloy ng maharlikang sambahayan ni David, ngunit ang salitang Hebreo ay may sadyang ugnayan sa pisikal na bahay o templo. Pinananatili ng 'sambahayan' ang metaporang pampamilya at pampamahalaan, at inilalahad sa talababa ang literal na 'bahay' at ang kahulugang dinastiko nang hindi nag-aangkat ng natatanging doktrina.
- issue: Panahunan ng וְהִכְנַעְתִּי
  choice: 'panghinaharap: Pasusukuin ko'
  alternative: pinasuko ko na; pinasusuko ko
  rationale: Ang sugnay ay bahagi ng pangakong banal at pinakamainam basahin na may puwersang panghinaharap, bagaman ang anyong perpekto ay maaaring magmukhang natapos kung ihihiwalay sa daloy.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang 'sambahayan' upang maging natural ang dinastikong diwa, na may talababa para sa literal na 'bahay' at sa mahalagang paglalaro ng salita. Ang marker na [a] ay nakalagay mismo sa pangunahing teksto.
