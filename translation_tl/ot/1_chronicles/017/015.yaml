  language: tl
  text: Alinsunod sa lahat ng salitang ito at sa buong pangitaing ito[a][b], ganito nagsalita si Natan kay David.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga bagay na ito” o “mga usaping ito”; ang Hebreong דְּבָרִים ay maaaring tumukoy sa mga salita, bagay, o usapin depende sa konteksto.
