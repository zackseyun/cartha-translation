lexical_decisions:
- source_word: כְּכֹל ... וּכְכֹל
  choice: Ayon sa lahat ... at ayon sa buong
  rationale: Pinananatili ng “ayon sa” ang diwa ng pagtutugma o pagsunod sa kabuuan ng mensahe at pangitain. Ginamit ang “buong” sa ikalawang parirala upang maging natural sa Filipino nang hindi nawawala ang kahulugang saklaw ang lahat ng nilalaman nito.
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: lahat ng salitang ito
  rationale: Maaaring mangahulugan ang דְּבָרִים ng mga salita, bagay, o usapin. Sa konteksto ng mensaheng ipinarating kay Natan, ang “mga salita” ang tuwirang pagpili, habang inilalahad sa talababa ang tunay na alternatibo.
- source_word: הֶחָזוֹן הַזֶּה
  choice: buong pangitaing ito
  rationale: Ang חָזוֹן ay tumutukoy sa propetikong pangitain o kapahayagan. Ang “pangitain” ay tuwiran, pamilyar sa wikang biblikal, at nauunawaan pa rin sa modernong Filipino.
- source_word: כֵּן
  choice: gayon
  rationale: 'Ipinahahayag ng כֵּן ang pagtutugma: kung ano ang mga salita at pangitain, iyon mismo ang sinabi ni Natan. Pinananatili ng “gayon” ang ugnayang ito nang maikli at marangal.'
- source_word: דִּבֶּר נָתָן אֶל דָּוִיד
  choice: nagsalita si Natan kay David
  rationale: Tuwirang isinasalin ang דִּבֶּר bilang “nagsalita,” at ang אֶל bilang “kay” upang ipakita ang taong pinatunguhan ng pagsasalita. Ginamit ang karaniwang anyong Filipino ng mga pangalang Natan at David.
