  register: Modernong Filipino na may dignidad at bahagyang pormal na himig. Pinanatili ang magkatimbang na pagkakabuo ng dalawang parirala at ang tahasang pagtutugma na ipinahahayag ng כֵּן. Ang mga talababa ay minarkahan sa pangunahing teksto at naglalahad ng tunay na mga alternatibong leksikal.
