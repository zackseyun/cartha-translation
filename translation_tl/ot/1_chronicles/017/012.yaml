  naturalness: Natural at marangal ang modernong Filipino Tagalog. Ang “Siya ang magtatayo” ay malinaw at angkop na pagpapahayag ng diin sa simuno. Ang “itatatag ko ang kanyang trono magpakailanman” ay maayos at madaling unawain sa kontekstong pangako tungkol sa hari.
