  text: ה֥וּא יִבְנֶה לִּ֖/י בָּ֑יִת וְ/כֹנַנְתִּ֥י אֶת כִּסְא֖/וֹ עַד עוֹלָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/012.yaml
  text: He will build a house for me[a], and I will establish his throne forever.
translation:
  language: tl
  text: Siya ang magtatayo ng isang bahay para sa akin[a], at itatatag ko ang kanyang trono magpakailanman.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “templo” sa halip na “bahay.” Literal na “bahay” ang salitang Hebreo, ngunit sa kontekstong ito ay tumutukoy ito sa santuwaryong itatayo ni Solomon.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוּא
  choice: Siya ang
  rationale: Ang tahasang panghalip na panlalaking isahan ay may pagbibigay-diin sa simuno; natural na naipahahayag ito sa Tagalog sa pamamagitan ng “Siya ang.”
- source_word: יִבְנֶה
  choice: magtatayo
  rationale: Ang Qal imperfect na ikatlong panauhang panlalaking isahan ng בנה ay tumutukoy rito sa kilos na mangyayari ayon sa pangako.
- source_word: לִּי
  choice: para sa akin
  rationale: 'Ang ל na may hulaping unang panauhang isahan ay nagpapahayag ng pakinabang o kaugnayan: ang bahay ay itatayo para sa nagsasalita.'
- source_word: בָּיִת
  choice: isang bahay
  rationale: Literal na “bahay” ang בַּיִת. Bagaman tumutukoy ito sa santuwaryong itatayo ni Solomon, pinananatili ng salin ang mas malawak na salita ng Hebreo at ang ugnayang pampanitikan nito sa konteksto.
- source_word: וְכֹנַנְתִּי
  choice: at itatatag ko
  rationale: Ipinahahayag ng pandiwa mula sa כון ang pagpapatibay o matatag na pagtatatag; ang “itatatag” ay natural sa konteksto ng pangakong maharlika.
- source_word: אֶת כִּסְאוֹ
  choice: ang kanyang trono
  rationale: Ang pangngalang may hulaping ikatlong panauhang panlalaking isahan ay likas na isinasaling “kanyang trono.”
- source_word: עַד עוֹלָם
  choice: magpakailanman
  rationale: Ang idyoma ay nagpapahayag ng walang hanggang pananatili; “magpakailanman” ang malinaw at marangal na katumbas sa modernong Tagalog.
theological_decisions:
- issue: Kung isasalin ang בָּיִת bilang “bahay” o bibigyang-kahulugang “templo”
  choice: bahay
  alternative: templo
  rationale: “Bahay” ang mismong salita sa Hebreo. Pinananatili nito ang ugnayang pampanitikan at teolohikal sa tipan kay David nang hindi nagdaragdag sa pangunahing teksto ng espesipikong katawagang ipinahihiwatig lamang ng konteksto.
- issue: Ang saklaw ng עַד עוֹלָם sa pangako tungkol sa trono ni David
  choice: magpakailanman
  alternative: nang walang hanggan
  rationale: Tuwirang pinananatili ang pahayag ng teksto nang hindi nilulutas sa salin ang mas malawak na usaping teolohikal tungkol sa katuparan ng pangako.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Ginamit ang “Siya ang” upang mapanatili ang diin ng tahasang panghalip sa Hebreo, at “bahay” upang hindi lampasan ang leksikal na saklaw ng orihinal.
