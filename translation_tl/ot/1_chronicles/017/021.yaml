base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/021.yaml
  text: And who is like your people Israel[a], one nation on the earth, whom God went to redeem for himself as a people, to make for yourself a name by great and fearsome deeds, driving out nations from before your people[b], whom you redeemed from Egypt?
translation:
  language: tl
  text: At sino ang katulad ng iyong bayang Israel—ang iisang bansa sa lupa na pinuntahan ng Diyos upang tubusin para sa kanyang sarili bilang isang bayan, upang itatag ang iyong pangalan sa pamamagitan ng mga dakila at kasindak-sindak na gawa[a], sa pagpapalayas ng mga bansa mula sa harap ng iyong bayan[b], na tinubos mo mula sa Ehipto?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “mga dakila at kasindak-sindak na bagay.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “sa pagpapalayas ng mga bansa mula sa harap ng iyong bayan.” Di-karaniwan ang ayos ng huling bahagi ng pangungusap; mahirap din ang kaugnay na teksto sa 2 Samuel 7:23, kaya may iba’t ibang pag-unawa sa sintaksis.
    reason: textual_variant
lexical_decisions:
- source_word: וּמִי כְעַמְּךָ יִשְׂרָאֵל
  choice: At sino ang katulad ng iyong bayang Israel
  rationale: Pinananatili ang retorikal na tanong, ang tahasang paghahambing, at ang pagtukoy sa Israel bilang bayan ng Diyos.
- source_word: גּוֹי אֶחָד בָּאָרֶץ
  choice: ang iisang bansa sa lupa
  rationale: Ang “iisang bansa” ay likas sa Filipino at pinananatili ang pahayag ng pagiging natatangi nang hindi dinaragdagan ng interpretasyon.
- source_word: אֲשֶׁר הָלַךְ הָאֱלֹהִים
  choice: na pinuntahan ng Diyos
  rationale: Pinananatili ang larawan ng Diyos na humayo o pumunta upang kumilos, sa halip na alisin ang wikang nagsasaad ng pagkilos.
- source_word: לִפְדּוֹת לוֹ עָם
  choice: upang tubusin para sa kanyang sarili bilang isang bayan
  rationale: Ang “tubusin” ay angkop sa פדה, at ipinahahayag ng “bilang isang bayan” ang layunin o bunga ng pagtubos.
- source_word: לָשׂוּם לְךָ שֵׁם
  choice: upang magtatag ka ng pangalan para sa iyong sarili
  rationale: Ang “magtatag ng pangalan” ay malinaw na tumutukoy sa pagtatamo ng pagkakilala o kadakilaan habang pinananatili ang ikalawang panauhan ng Hebreo.
- source_word: גְּדֻלּוֹת וְנוֹרָאוֹת
  choice: mga dakila at kasindak-sindak na gawa
  rationale: Ang “kasindak-sindak” ay nagpapanatili sa diwa ng pagkamangha na may kasamang takot; idinagdag ang “gawa” upang maging likas at malinaw sa Filipino.
- source_word: לְגָרֵשׁ
  choice: upang itaboy
  rationale: Ipinahahayag ang marahas na pagpapaalis o pagpapalayas na tinutukoy ng pandiwa.
- source_word: מִפְּנֵי עַמְּךָ
  choice: mula sa harap ng iyong bayan
  rationale: Pinananatili ang konkretong idyomang Hebreo at ang larawan ng mga bansang inaalis sa daraanan o kinaroroonan ng bayan.
- source_word: אֲשֶׁר פָּדִיתָ מִמִּצְרַיִם
  choice: na tinubos mo mula sa Ehipto
  rationale: Tuwirang pinananatili ang ikalawang panauhang pagtukoy sa ginawang pagtubos ng Diyos mula sa Ehipto.
- source_word: גּוֹיִם
  choice: ang mga bansa
  rationale: Itinuturing itong layon ng “itaboy,” ayon sa pinakamalamang na sintaktikong ugnayan, habang itinatala sa talababa ang di-karaniwang ayos ng Hebreo.
theological_decisions:
- issue: Ang pagtatatag ng Diyos ng pangalan para sa kanyang sarili
  choice: upang magtatag ka ng pangalan para sa iyong sarili
  alternative: upang makilala ang iyong pangalan
  rationale: Tahasan sa teksto na ang mga gawa ng pagtubos ay nagtatatag ng pangalan o katanyagan ng Diyos; hindi ito pinalalambot o nilalagyan ng ibang teolohikal na paliwanag.
- issue: Diwa ng נוֹרָאוֹת
  choice: kasindak-sindak
  alternative: kahanga-hanga
  rationale: Pinananatili ang tensiyon ng pagkamangha at pangamba sa mga makapangyarihang gawa ng Diyos; ang “kahanga-hanga” lamang ay maaaring maging napakahina.
- issue: Pagpapalit mula ikatlong panauhan tungo sa ikalawang panauhan para sa Diyos
  choice: pinuntahan ng Diyos… para sa kanyang sarili… magtatag ka… para sa iyong sarili
  alternative: pinuntahan mo… para sa iyong sarili
  rationale: Pinananatili ang kapansin-pansing pagpapalit ng panauhan sa Hebreo sa halip na tahimik itong gawing pare-pareho.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “bayan” para sa covenantal people at “bansa” para sa גוי/גוים. Hinati sa dalawang pangungusap ang mahabang tanong upang maging madaling maunawaan, ngunit nananatiling sakop ng retorikal na tanong ang buong pahayag. Ang mga panandang [a] at [b] ay kapuwa nasa mismong teksto sa kaukulang parirala.
