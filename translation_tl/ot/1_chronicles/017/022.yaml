  yaml_path: translation/ot/1_chronicles/017/022.yaml
  text: And you made your people Israel your people forever[a], and you, O Yahweh, became their God.
translation:
  language: tl
  text: At itinatag mo ang iyong bayang Israel bilang sarili mong bayan magpakailanman; at ikaw, Yahweh, ay naging Diyos nila.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “at ikaw, Yahweh, ay Diyos nila.” Maaaring unawain ang Hebreo bilang paglalarawan ng isang umiiral na kalagayan, samantalang ipinakikita ng pangunahing salin ang pagtatatag ng ugnayang tipan sa konteksto.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַתִּתֵּן
  choice: ginawa mo
  rationale: Bagaman literal na “ibinigay mo,” ang kayariang may dalawang ל ay nagsasaad ng pagtatatag o paglalagay sa isang katayuan; natural na ipinapahayag ito sa Filipino ng “ginawa mo ... na maging.”
- source_word: עַמְּךָ יִשְׂרָאֵל
  choice: ang iyong bayang Israel
  rationale: Pinananatili ang pagkakakilanlan ng Israel bilang bayan ng Diyos sa natural na ayos ng modernong Filipino.
- source_word: לְךָ לְעָם
  choice: na maging sarili mong bayan
  rationale: Ipinahahayag ng magkatambal na ל ang pag-aari at itinatag na katayuan. Nililinaw ng “sarili mong” ang emphatic na לְךָ nang hindi nagdaragdag ng bagong ideya.
- source_word: עַד עוֹלָם
  choice: magpakailanman
  rationale: Karaniwan, marangal, at malinaw na katumbas ng walang hanggang pagpapatuloy sa konteksto.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat ang personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
- source_word: הָיִיתָ לָהֶם לֵאלֹהִים
  choice: ay naging Diyos nila
  rationale: Pinananatili ang aspektong pasalaysay at ang pagtatatag ng ugnayang tipan; tumutukoy ito sa relasyonal na katayuan, hindi sa pagbabago ng likas ng Diyos.
theological_decisions:
- issue: Ang pormula ng tipan na היה + ל + אלהים
  choice: ay naging Diyos nila
  alternative: ay Diyos nila
  rationale: Ang “naging” ay nagpapanatili sa puwersa ng salaysay kung saan itinatag ang ugnayang tipan, ngunit maaari ring unawain ang Hebreo nang higit na stative bilang “ay Diyos nila.”
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “bayan” para sa עַם at pinanatili ang pangalang Yahweh. Ang panandang talababa [a] ay inilagay pagkatapos ng sugnay na tinutukoy nito.
