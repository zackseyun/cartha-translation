  text: וַ/יֹּ֤אמֶר נָתָן֙ אֶל דָּוִ֔יד כֹּ֛ל אֲשֶׁ֥ר בִּֽ/לְבָבְ/ךָ֖ עֲשֵׂ֑ה כִּ֥י הָ/אֱלֹהִ֖ים עִמָּֽ/ךְ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/002.yaml
  text: And Nathan said to David, “Do all that is in your heart, for God is with you.”
translation:
  language: tl
  text: Sinabi ni Natan kay David, “Gawin mo ang lahat ng nasa puso mo, sapagkat kasama mo ang Diyos.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Sinabi
  rationale: Isinusulong ng waw-consecutive ang salaysay. Likas sa makabagong salaysay sa Filipino ang “Sinabi” nang hindi na kailangang isalin nang hiwalay ang pang-ugnay.
- source_word: נָתָן
  choice: Natan
  rationale: Isinatinig ang pangalang Hebreo ayon sa karaniwang anyo nito sa Filipino.
- source_word: אֶל דָּוִיד
  choice: kay David
  rationale: Ang “kay” ang likas na panandang Filipino para sa taong pinagsasabihan; pinanatili ang kinagawiang anyong Filipino na “David.”
- source_word: כֹּל אֲשֶׁר
  choice: ang lahat ng
  rationale: Ipinahahayag nito ang kabuuan ng nilalaman ng kasunod na parirala at natural itong kaugnay ng “nasa puso mo.”
- source_word: בִּלְבָבְךָ
  choice: nasa puso mo
  rationale: Ang לֵבָב ay maaaring tumukoy sa kalooban, isip, o hangarin. Pinananatili ng “puso” ang larawang Hebreo at nauunawaan sa Filipino bilang panloob na balak o hangarin.
- source_word: עֲשֵׂה
  choice: Gawin mo
  rationale: Tuwirang pautos ang pandiwa; ang “Gawin mo” ang pinakanatural na katumbas kapag ang layon ay “ang lahat ng nasa puso mo.”
- source_word: כִּי
  choice: sapagkat
  rationale: Nagbibigay ito ng dahilan para sa naunang pautos. Ang “sapagkat” ay malinaw, marangal, at angkop sa rehistro ng salin.
- source_word: הָאֱלֹהִים
  choice: ang Diyos
  rationale: Tiyak ang pagtukoy sa Diyos. Hindi ito ang banal na pangalang YHWH, kaya “Diyos,” hindi “PANGINOON,” ang ginamit.
- source_word: עִמָּךְ
  choice: kasama mo
  rationale: Likas na katumbas sa Filipino ng presensiya at pagsuporta ng Diyos ang “kasama mo.”
theological_decisions:
- issue: Pagtutumbas sa הָאֱלֹהִים
  choice: ang Diyos
  alternative: ang PANGINOON
  rationale: Elohim ang nasa tekstong Hebreo, hindi YHWH. Kaya pinananatili ang titulo na “Diyos” at hindi ipinapalit ang banal na pangalang karaniwang isinasaling “PANGINOON.”
- issue: Saklaw ng “nasa puso mo”
  choice: Pinanatili ang matalinghagang “puso”
  alternative: nasa isip mo / balak mo
  rationale: Maaaring saklawin ng Hebreong לֵבָב ang isip, kalooban, hangarin, at pasiya. Ang “puso” ay nagpapanatili sa lawak at bahagyang kalabuan ng orihinal sa halip na paliitin ito sa iisang kakayahang panloob.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Tuwiran ang pagsasalaysay at payo, habang pinananatili ang Hebreong larawan ng “puso.”
