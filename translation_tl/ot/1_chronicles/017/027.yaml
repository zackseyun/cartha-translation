  text: וְ/עַתָּ֗ה הוֹאַ֨לְתָּ֙ לְ/בָרֵךְ֙ אֶת בֵּ֣ית עַבְדְּ/ךָ֔ לִ/הְי֥וֹת לְ/עוֹלָ֖ם לְ/פָנֶ֑י/ךָ כִּֽי אַתָּ֤ה יְהוָה֙ בֵּרַ֔כְתָּ וּ/מְבֹרָ֖ךְ לְ/עוֹלָֽם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/027.yaml
  text: And now[a], you have been pleased to bless the house of your servant, that it may be before you forever; for you, O Yahweh, have blessed it[c][b], and it is blessed forever.
translation:
  language: tl
  text: At ngayon, minabuti mong pagpalain ang sambahayan[a] ng iyong lingkod, upang manatili ito sa iyong harapan magpakailanman. Sapagkat ikaw, Yahweh, ang nagpala rito, at ito ay pinagpala magpakailanman.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “sambahayan” dito ay tumutukoy sa pamilya o dinastiya ni David, hindi lamang sa kanyang tirahan.
    reason: cultural_note
  - marker: b
    text: 'Maaari ring isalin: “at pagpalain nawa ito magpakailanman.” Maaaring unawain ng ilan ang Hebreo bilang pagpapahayag ng pagnanais, bagaman mas likas na basahin ang anyo nito bilang pahayag ng namamalaging pagpapala.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְעַתָּה
  choice: At ngayon
  rationale: Pinananatili ang pang-ugnay na וְ at ang panandang pamanahon na עַתָּה bilang likas na transisyon sa panalangin.
- source_word: הוֹאַלְתָּ
  choice: minabuti mo
  rationale: Ipinahahayag ang kusang-loob at mabuting pagsang-ayon ng Diyos; natural ito sa makabagong Tagalog nang hindi ginagawang mekanikal na 'isinagawa mo.'
- source_word: לְבָרֵךְ
  choice: pagpalain
  rationale: Tuwirang infinitibong kaganapan ng הוֹאַלְתָּ at karaniwang katumbas ng ugat na ברך.
- source_word: בֵּית עַבְדְּךָ
  choice: ang sambahayan ng iyong lingkod
  rationale: Sa konteksto ng pangako kay David, ang בֵּית ay tumutukoy sa pamilya o dinastiya, hindi lamang sa gusaling tinitirhan; nililinaw ito ng 'sambahayan' habang ipinapaliwanag sa talababa ang saklaw.
- source_word: לִהְיוֹת לְעוֹלָם לְפָנֶיךָ
  choice: upang manatili ito sa iyong harapan magpakailanman
  rationale: Ipinakikita ang layon o bunga ng pagpapala at pinananatili ang larawan ng patuloy na pag-iral sa harapan ng Diyos.
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikilala ang batayan ng naunang pahayag sa malinaw at marangal na Tagalog.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ang personal na pangalang banal sa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: בֵּרַכְתָּ
  choice: ang nagpala rito
  rationale: Ang perpektong pandiwa ay tumutukoy sa naganap nang pagpapala na siyang batayan ng pangwakas na kalagayan; ang 'ang' ay natural na nagbibigay-diin sa paksa sa Tagalog.
- source_word: וּמְבֹרָךְ לְעוֹלָם
  choice: at pinagpala ito magpakailanman
  rationale: Binabasa ang pasibong participle bilang pahayag ng nananatiling kalagayan bunga ng ginawa ng Diyos, nang hindi nagdaragdag ng tahasang pakiusap o utos.
theological_decisions:
- issue: Pagtutumbas sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehovah
  rationale: Personal na pangalan ang nasa pinagmulang teksto; pinananatili ng 'Yahweh' ang pagkakakilanlan nito sa halip na palitan ng titulong 'PANGINOON.'
- issue: Diwa ng pangwakas na וּמְבֹרָךְ לְעוֹלָם
  choice: 'Paturol at resultativo: “at pinagpala ito magpakailanman”'
  alternative: 'Pagnanais: “at pagpalain nawa ito magpakailanman”'
  rationale: Pasibong participle ang anyong Hebreo, hindi pautos o malinaw na jussive. Pinakamalikas itong pahayag na ang sambahayan ay nasa namamalaging kalagayang pinagpala, ngunit kinikilala sa talababa ang posibleng pagbasa bilang pagnanais.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang 'minabuti mong' upang ipahayag ang kusang-loob na pagsang-ayon ng Diyos, at 'sambahayan' upang natural na maipahiwatig ang dinastikong diwa ng בֵּית. Iniwasan ang sobrang arkaikong ayos ngunit pinanatili ang panalanging tono at ang pariralang 'sa iyong harapan.'
