base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/008.yaml
  text: And I have been with you wherever you have gone[a], and I have cut off all your enemies from before you[b], and I will make for you a name like the name of the great ones who are on the earth.
translation:
  language: tl
  text: Ako ay kasama mo noon saan ka man pumunta, at inalis ko mula sa harapan mo ang lahat ng iyong mga kaaway. Gagawin kong bantog ang iyong pangalan[a], gaya ng pangalan ng mga dakila sa daigdig[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “gagawa ako para sa iyo ng isang pangalan,” na nangangahulugang bibigyan kita ng katanyagan o reputasyon.
    reason: lexical_alternative
  - marker: b
    text: O “sa lupain.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶהְיֶה עִמְּךָ
  choice: Kasama mo ako
  rationale: Pinananatili nito ang diwa ng presensiya at pagsuporta ng Diyos nang hindi dinaragdagan ang Hebreo. Sa konteksto, tumutukoy ito sa nakaraang katapatan ng Diyos kay David.
- source_word: בְּכֹל אֲשֶׁר הָלַכְתָּ
  choice: saan ka man pumunta
  rationale: Likas na salin ng idyomang Hebreo na tumutukoy sa bawat lugar o pagkakataong pinuntahan ni David.
- source_word: וָאַכְרִית אֶת כָּל אוֹיְבֶיךָ מִפָּנֶיךָ
  choice: inalis ko sa harapan mo ang lahat ng iyong kaaway
  rationale: Ipinahahayag ng Hiphil ng כרת ang pag-aalis o paglipol sa mga kaaway. Ang “inalis” ay natural sa Filipino at pinananatili ang larawang sila ay inalis mula sa harapan ni David.
- source_word: וְעָשִׂיתִי לְךָ שֵׁם
  choice: Gagawin ko ring bantog ang iyong pangalan
  rationale: Ang “pangalan” dito ay reputasyon o kabantugan. Ginawang natural sa Filipino ang idyoma habang pinananatili ang mahalagang larawan ng pangalan; inilalahad sa talababa ang mas literal na anyo.
- source_word: כְּשֵׁם הַגְּדוֹלִים
  choice: gaya ng pangalan ng mga dakila
  rationale: Pinananatili ang paghahambing sa reputasyon ng mga prominente o makapangyarihan nang hindi nagdaragdag ng kasariang hindi tahasang nasa pang-uri.
- source_word: אֲשֶׁר בָּאָרֶץ
  choice: sa daigdig
  rationale: Maaaring mangahulugan ang אֶרֶץ ng “daigdig” o “lupain.” Ang “daigdig” ay angkop sa malawak na saklaw ng ipinangakong kabantugan, habang pinananatili sa talababa ang alternatibo.
theological_decisions:
- issue: Panahunan ng mga kilos ng Diyos
  choice: Ang unang dalawang kilos ay inilahad bilang naganap na, at ang huling kilos bilang pangako sa hinaharap.
  alternative: Maaaring unawain ang lahat ng sugnay bilang nakaraan o ang lahat bilang hinaharap.
  rationale: Sa daloy ng pahayag, binabalikan muna ng Diyos ang dati niyang katapatan kay David, saka siya nagbibigay ng pangako tungkol sa magiging pangalan nito.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Iniwasan ang labis na arkaikong pananalita at pinanatili ang idyoma ng “pangalan” sa isang likas na anyo. Ang mga panandang [a] at [b] ay inilagay mismo sa mga salitang tinutukoy ng kani-kanilang talababa.
