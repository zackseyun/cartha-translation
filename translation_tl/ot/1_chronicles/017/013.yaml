id: 1CH.17.13
reference: 1 Chronicles 17:13
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: אֲנִי֙ אֶֽהְיֶה לּ֣/וֹ לְ/אָ֔ב וְ/ה֖וּא יִֽהְיֶה לִּ֣/י לְ/בֵ֑ן וְ/חַסְדִּ/י֙ לֹא אָסִ֣יר מֵֽ/עִמּ֔/וֹ כַּ/אֲשֶׁ֣ר הֲסִיר֔וֹתִי מֵ/אֲשֶׁ֥ר הָיָ֖ה לְ/פָנֶֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/013.yaml
  text: I will be a father to him[a], and he will be a son to me. And I will not remove my steadfast love from him[b], as I removed it from the one who was before you.
translation:
  language: tl
  text: Ako'y magiging ama niya[a], at siya'y magiging anak ko. Hindi ko aalisin sa kanya ang aking tapat na pag-ibig, gaya ng pag-aalis ko nito sa taong nauna sa iyo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “Ako ay magiging ama sa kanya, at siya ay magiging anak sa akin.”
    reason: lexical_alternative
  - marker: b
    text: Ang “taong nauna sa iyo” ay tumutukoy kay Saul, ang haring nauna kay David.
    reason: cross_reference
lexical_decisions:
- source_word: אֶהְיֶה לּוֹ לְאָב
  choice: Ako'y magiging ama niya
  rationale: Likas at malinaw sa modernong Tagalog ang pahayag, habang pinananatili ang tuwirang ugnayang ama-anak ng Hebreo.
- source_word: וְהוּא יִהְיֶה לִּי לְבֵן
  choice: at siya'y magiging anak ko
  rationale: Pinananatili nito ang simetriya at ang wika ng tipanang pagiging anak nang hindi ito ginagawang malabong paghahambing lamang.
- source_word: חַסְדִּי
  choice: ang aking tapat na pag-ibig
  rationale: Sinasaklaw ng “tapat na pag-ibig” ang pagmamahal at nananatiling katapatan na ipinahihiwatig ng חֶסֶד sa konteksto ng tipan.
- source_word: לֹא אָסִיר מֵעִמּוֹ
  choice: Hindi ko aalisin sa kanya
  rationale: Tuwirang inililipat ang causative na diwa ng סור at natural na iniuugnay sa bagay na “aking tapat na pag-ibig.”
- source_word: כַּאֲשֶׁר הֲסִירוֹתִי
  choice: gaya ng pag-aalis ko nito
  rationale: Inuulit ang parehong pandiwa gaya ng sa naunang sugnay; ang “nito” ay tumutukoy sa tapat na pag-ibig na nauunawaan bilang layon sa Hebreo.
- source_word: מֵאֲשֶׁר הָיָה לְפָנֶיךָ
  choice: sa taong nauna sa iyo
  rationale: Pinananatili ang di-tahasang pagtukoy ng Hebreo sa hinalinhan ni David sa halip na ipasok ang pangalang Saul sa pangunahing teksto.
theological_decisions:
- issue: Wikang ama-anak sa tipan kay David
  choice: Panatilihin ang tuwirang “ama” at “anak.”
  alternative: Aalagaan ko siya na gaya ng isang ama, at ituturing ko siyang anak.
  rationale: Ang Hebreo ay nagpapahayag ng tunay na relasyong tipanan sa pamamagitan ng tuwirang wikang pampamilya; hindi ito dapat pahinain at gawing paghahambing lamang.
- issue: Paglilipat ng חֶסֶד sa konteksto ng tipan
  choice: tapat na pag-ibig
  alternative: habag; katapatan sa tipan; wagas na kagandahang-loob
  rationale: Pinananatili ng “tapat na pag-ibig” ang sabay na diwa ng pagmamahal at matatag na katapatan, nang hindi nililimitahan ang salita sa awa lamang o sa legal na obligasyon.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang mga pinaikling anyong “Ako'y” at “siya'y,” na karaniwan sa maayos na salaysay, at iniwasan ang arkaiko o labis na teknikal na pananalita.
