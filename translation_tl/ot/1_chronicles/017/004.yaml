base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/004.yaml
  text: 'Go and say to David my servant[b][a], ‘Thus says Yahweh: You shall not build for me the house to dwell in.’'
translation:
  language: tl
  text: 'Humayo ka at sabihin mo kay David na aking lingkod, ‘Ganito ang sabi ni Yahweh: Hindi ikaw ang magtatayo para sa akin ng bahay[a] na titirhan ko.[b]’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “bahay” dito ay ang gusaling nilalayong maging tahanan ni Yahweh—ang templo.
    reason: lexical_alternative
  - marker: b
    text: 'Mas literal: “Hindi ikaw ang magtatayo para sa akin ng bahay upang panirahan.” Ipinahihiwatig ng konteksto na si Yahweh ang mananahan; idiniriin ng Hebreo ang “ikaw.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵךְ
  choice: Humayo ka
  rationale: Tuwirang pautos ito na nagpapasimula sa atas ng Diyos. Ang “Humayo ka” ay marangal at likas sa salaysay ng Kasulatan.
- source_word: וְאָמַרְתָּ
  choice: at sabihin mo
  rationale: Kasunod ng pautos na לֵךְ, ang anyong ito ay may puwersa ring pautos; malinaw itong naihahatid ng “at sabihin mo.”
- source_word: דָּוִיד עַבְדִּי
  choice: David na aking lingkod
  rationale: Ang עֶבֶד sa kontekstong maharlika at tipan ay tumutukoy sa lingkod na inatasan ng Diyos, hindi kinakailangang sa isang aliping pag-aari.
- source_word: כֹּה אָמַר יְהוָה
  choice: Ganito ang sabi ni Yahweh
  rationale: Pinananatili nito ang nakaugaliang pormula ng mensahero ng Diyos at ang pangalang tipan na יְהוָה.
- source_word: לֹא אַתָּה תִּבְנֶה
  choice: Hindi ikaw ang magtatayo
  rationale: Ang hayag na panghalip na אַתָּה ay may diin. Ang ayos na “Hindi ikaw ang magtatayo” ay natural sa Tagalog at pinananatili ang pokus sa pagkakakilanlan ng tagapagtayo, sa halip na gawing payak lamang na pagbabawal.
- source_word: לִּי
  choice: para sa akin
  rationale: Likas na ipinahahayag nito ang diwa ng kapakinabangan o layunin ng pagtatayo.
- source_word: הַבַּיִת
  choice: ang bahay
  rationale: “Bahay” ang tuwirang katumbas at pinananatili ang metaporikal at teolohikal na ugnayan sa konteksto; ang “templo” ay mas tahasang pagpapakahulugan.
- source_word: לָשָׁבֶת
  choice: na matitirhan ko
  rationale: Ipinahahayag ng pawatas ang layunin ng bahay bilang tahanan ni Yahweh. Ang “matitirhan ko” ay malinaw at natural sa Tagalog, bagaman hindi tahasang nakasaad sa anyong Hebreo ang panghalip na unang panauhan.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Ang tekstong Hebreo ay tahasang gumagamit ng Tetragrammaton; pinananatili ng “Yahweh” ang natatanging pangalang tipan.
- issue: Diin ng לֹא אַתָּה sa pagkakakilanlan ng tagapagtayo
  choice: Hindi ikaw ang magtatayo
  alternative: Huwag kang magtayo; Hindi ka magtatayo
  rationale: Pinananatili ng napiling anyo ang diin sa “ikaw” at ang tensiyon sa pagitan ng pagbabawal, prediksiyon, at pagtatalaga kung sino ang magtatayo.
- issue: Kahulugan ng הַבַּיִת
  choice: bahay
  alternative: templo
  rationale: Sa konteksto, ang bahay ay ang templong inilaan bilang tahanan ni Yahweh, ngunit hindi pinapalitan ng salin ang mas malawak na salita ng orihinal.
- issue: Ipinahihiwatig na nananahan sa לָשָׁבֶת
  choice: na matitirhan ko
  alternative: na matitirhan; bilang tahanan
  rationale: Ipinakikita ng לִּי at ng konteksto na si Yahweh ang inilalarawang mananahan, ngunit itinatala sa talababa na hindi tahasang nasa pawatas ang “ko.”
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “Humayo” upang mapanatili ang solemneng himig ng atas ng Diyos, samantalang ang natitirang pangungusap ay nasa likas at kasalukuyang ayos ng Tagalog. Ang lahat ng talababa ay may katugmang pananda sa pangunahing teksto.
