  text: What more can David add before you for honoring your servant? You know your servant.
translation:
  language: tl
  text: Ano pa ang maidaragdag ni David sa iyo dahil sa pagpaparangal mo sa iyong lingkod?[a][b] Kilala mo ang iyong lingkod.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Ano pa ang masasabi ni David sa iyo dahil sa karangalang ipinakita mo sa iyong lingkod?” Ang pandiwang “masasabi” ay ipinapalagay lamang sa ilang salin upang gawing mas maayos ang pangungusap; hindi ito tahasang nasa Hebreo.
    reason: lexical_alternative
  - marker: b
    text: Mahirap ang pariralang Hebreo na isinaling “dahil sa pagpaparangal mo sa iyong lingkod.” Maaari rin itong unawain na “para sa karangalan ng iyong lingkod” o “upang parangalan ang iyong lingkod.”
    reason: alternative_reading
lexical_decisions:
- source_word: מַה יּוֹסִיף עוֹד
  choice: Ano pa ang maidaragdag
  rationale: Ipinahahayag nito ang retorikal na tanong at ang diwa ng יסף kasama ng עוד, ‘magdagdag pa,’ nang hindi tahasang idinaragdag ang pandiwang ‘sabihin,’ na wala sa Hebreo.
- source_word: דָּוִיד
  choice: David
  rationale: Karaniwang anyo ng pangalang pantangi sa modernong Filipino.
- source_word: אֵלֶיךָ
  choice: sa iyo
  rationale: Tuwirang ipinahahayag ang patutunguhan ng pagsasalita o pagdaragdag; malapit ito sa karaniwang kahulugan ng אֶל at natural sa Filipino.
- source_word: לְכָבוֹד אֶת עַבְדֶּךָ
  choice: dahil sa pagpaparangal mo sa iyong lingkod
  rationale: Ipinakikita ng konteksto na namamangha si David sa karangalang ibinigay sa kanya ng Diyos. Ginawang tahasan ang likas na ipinahihiwatig na tagaganap upang maging malinaw sa Filipino, habang itinatala sa talababa ang kahirapan at iba pang posibleng pagbasa ng siksik na pariralang Hebreo.
- source_word: וְאַתָּה אֶת עַבְדְּךָ יָדָעְתָּ
  choice: Kilala mo ang iyong lingkod
  rationale: Ang perpektong anyo ng ידע ay nagpapahayag dito ng matatag at personal na pagkakilala ng Diyos; ‘Kilala mo’ ang pinakanatural na katumbas sa Filipino.
theological_decisions:
- issue: Kahulugan ng mahirap na pariralang לְכָבוֹד אֶת עַבְדֶּךָ
  choice: dahil sa pagpaparangal mo sa iyong lingkod
  alternative: para sa karangalan ng iyong lingkod; upang parangalan ang iyong lingkod
  rationale: Sa mas malawak na konteksto, ang Diyos ang nagbigay ng karangalan kay David. Gayunman, siksik at hindi lubusang tiyak ang sintaks, kaya hindi itinatago ang mga tunay na alternatibo at inilalahad ang mga ito sa talababa.
translation_notes:
  register: Modernong Filipino na magalang at angkop sa panalangin. Pinanatili ang pagtukoy ni David sa sarili bilang ‘iyong lingkod.’ Ginamit ang ‘sa iyo’ sa halip na ‘sa harap mo’ dahil mas tuwiran itong tumutugma sa אֵלֶיךָ sa konteksto ng pakikipag-usap sa Diyos.
