base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/024/030.yaml
  text: 'And the sons of Mushi: Mahli[a], Eder, and Jeremoth. These were the sons of the Levites according to their fathers'' houses.'
translation:
  language: tl
  text: At ang mga anak ni Musi ay sina Mahli, Eder, at Jerimot.[a] Ang mga ito ang mga anak ng mga Levita ayon sa mga angkan ng kanilang mga ninuno.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring baybaying “Jeremot.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי מוּשִׁי
  choice: At ang mga anak ni Musi
  rationale: Pinananatili ng “At” ang pang-ugnay na ו, at likas sa Filipino ang pormulang “mga anak ni” sa talaangkanan. Iniangkop sa baybay-Filipino ang pangalang מוּשִׁי bilang “Musi.”
- source_word: מַחְלִי וְעֵדֶר וִירִימוֹת
  choice: sina Mahali, Eder, at Jerimot
  rationale: Ginamit ang “sina” para sa likas na paglilista ng mga pangalan ng tao sa Filipino. Ang mga pangalan ay isinalin sa karaniwang baybay-Filipino; inilagay ang mga pang-ugnay sa paraang natural sa isang listahan.
- source_word: אֵלֶּה בְּנֵי הַלְוִיִּם
  choice: Ang mga ito ang mga anak ng mga Levita
  rationale: Malapit nitong pinananatili ang literal na pananalitang “mga anak ng mga Levita” at ang pangwakas na pagtukoy sa mga kababanggit na pangalan.
- source_word: לְבֵית אֲבֹתֵיהֶם
  choice: ayon sa kani-kanilang angkan ng mga ninuno
  rationale: Ang בֵּית אָבוֹת ay pormulang pangtalaangkanan para sa sambahayan o angkang nagmumula sa mga ama. Ang “angkan ng mga ninuno” ay malinaw at natural sa modernong Filipino nang hindi nililimitahan ang kahulugan sa isang gusali o agarang sambahayan.
theological_decisions: []
translation_notes:
  register: Makabago ngunit marangal na Filipino; pinanatili ang anyong talaangkanan at ang teknikal na diwa ng pagkakahati ayon sa angkan. Inilipat ang panandang [a] sa pangalang Jerimot, sapagkat iyon ang pangalang tinutukoy ng alternatibong baybay.
