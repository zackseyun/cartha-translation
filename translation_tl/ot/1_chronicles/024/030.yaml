  source_fidelity: Kailangang itama ang "Mahali" tungo sa "Mahli," na mas malapit sa מַחְלִי (Maḥlî) at sa transliterasyong sinusundan ng audit trail. Tumpak na naihahatid ng natitirang talaan ang tatlong pangalan at ang pangwakas na pagtukoy sa mga Levita.
  naturalness: Likas ang pormulang "At ang mga anak ni Musi ay sina ..." sa makabagong Filipino. Ang "ayon sa kani-kanilang angkan ng mga ninuno" ay medyo mabigat at ang "kani-kanilang" ay maaaring magpahiwatig ng indibiduwal na paghahati. Mas malinaw ang "ayon sa mga angkan ng kanilang mga ninuno" para sa pangkatang genealogical formula.
  terminology: Ang "mga anak ng mga Levita" ay isang katanggap-tanggap na pormal na pagsasalin ng בְּנֵי הַלְוִיִּם. Ang "mga angkan ng kanilang mga ninuno" ay maingat na naghahatid ng לְבֵית אֲבֹתֵיהֶם bilang teknikal na pormulang talaangkanan nang hindi ito nililimitahan sa pisikal na bahay.
