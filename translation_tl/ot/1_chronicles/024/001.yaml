base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/024/001.yaml
  text: 'These were the divisions of the sons of Aaron: the sons of Aaron were Nadab and Abihu[a], Eleazar and Ithamar.'
translation:
  language: tl
  text: 'Ito ang mga pangkat[a] ng mga anak ni Aaron: ang mga anak ni Aaron ay sina Nadab at Abihu, Eleazar at Itamar.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga dibisyon”; tumutukoy ang Hebreo sa mga nakaayos na pangkat ng mga pari.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/לִ/בְנֵי
  choice: Ito ang ... ng mga anak ni Aaron
  rationale: Sa kontekstong nagsisilbing pamagat ng bagong seksiyon, natural sa Tagalog ang “Ito ang” upang ipakilala ang talaan. Hindi na hiwalay na isinalin ang pang-ugnay at pang-ukol sapagkat malinaw na ang kanilang tungkulin sa buong pangungusap.
- source_word: מַחְלְקוֹתָם
  choice: mga pangkat
  rationale: Tumutukoy ang salita sa organisadong mga dibisyon o pangkat para sa paglilingkod. Mas madaling maunawaan ng karaniwang mambabasa ang “mga pangkat” kaysa sa tradisyonal ngunit hindi gaanong malinaw na “mga kurso.”
- source_word: בְּנֵי אַהֲרֹן
  choice: mga anak ni Aaron
  rationale: Tuwiran at natural na salin ng pariralang Hebreo; pinananatili ang tahasang ugnayang pampamilya.
- source_word: נָדָב
  choice: Nadab
  rationale: Karaniwang anyo ng pangalang pantangi sa Tagalog na mga salin ng Biblia.
- source_word: וַאֲבִיהוּא
  choice: at Abihu
  rationale: Pinanatili ang pang-ugnay at ang kinikilalang anyo ng pangalan.
- source_word: אֶלְעָזָר
  choice: Eleazar
  rationale: Karaniwang anyo ng pangalang pantangi sa Tagalog na mga salin ng Biblia.
- source_word: וְאִיתָמָר
  choice: at Itamar
  rationale: Pinanatili ang pang-ugnay; “Itamar” ang natural na transliterasyon sa Tagalog.
