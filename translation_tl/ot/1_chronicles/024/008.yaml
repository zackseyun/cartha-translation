  yaml_path: translation/ot/1_chronicles/024/008.yaml
  text: the third to Harim[a], the fourth to Seorim.
translation:
  language: tl
  text: ang ikatlo ay kay Harim[a], at ang ikaapat ay kay Seorim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “para kay Harim … para kay Seorim”; maaaring tumukoy sa pagkakatalaga ang pang-ukol sa Hebreo, at isinalin dito bilang “kay” sa talaang ito ng mga palabunutan.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְחָרִם
  choice: kay Harim
  rationale: Ang unlaping לְ ay nagpapahayag ng pagkakatalaga sa talaan ng mga palabunutan. Likas sa Filipino ang “kay” kapag pangalan ng tao ang tumatanggap ng takdang bahagi.
- source_word: הַשְּׁלִישִׁי
  choice: ang ikatlo
  rationale: Tiyak na bilang na panunuran ito at tumutukoy sa ikatlong palabunot o pagkakatalaga; pinananatili ang maikling anyo ng listahan.
- source_word: לִשְׂעֹרִים
  choice: kay Seorim
  rationale: Gaya ng naunang parirala, ang לִ ay tanda ng pagkakatalaga. Isinulat ang pangalang Hebreo bilang “Seorim” sa paraang madaling basahin sa Filipino.
- source_word: הָרְבִעִי
  choice: ang ikaapat
  rationale: Tiyak na bilang na panunuran ito, kapantay ng “ang ikatlo,” at tumutukoy sa ikaapat na palabunot o pagkakatalaga.
theological_decisions: []
translation_notes:
  register: Makabago at marangal na Filipino; pinanatili ang maikli at eliptikong estilo ng Hebreong listahan. Idinagdag ang “ay” at “at” upang maging likas at malinaw ang daloy sa Filipino nang hindi ipinapasok sa talata ang ipinahihiwatig na salitang “palabunot.”
