base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/024/004.yaml
  text: 'The sons of Eleazar were found to be more numerous[a], as heads of the men, than the sons of Ithamar, and they divided them thus: for the sons of Eleazar, sixteen heads of fathers’ houses, and for the sons of Ithamar, according to their fathers’ houses[b], eight.'
translation:
  language: tl
  text: 'Napag-alamang mas marami ang mga pinuno mula sa mga anak ni Eleazar kaysa sa mga anak ni Itamar. Kaya hinati nila ang mga ito nang ganito: para sa mga anak ni Eleazar, labing-anim na pinuno ayon sa mga sambahayan ng mga ninuno; at para sa mga anak ni Itamar, walo ayon sa mga sambahayan ng kanilang mga ninuno.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Ang “mga sambahayan ng mga ninuno” ay mga angkan o malalaking sambahayang nagmula sa iisang ninuno, isang karaniwang yunit ng pamilya at pamamahala sa Israel.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּמָּצְאוּ
  choice: Napatunayang
  rationale: Ipinahahayag ng Niphal dito ang kalagayang natuklasan o natiyak, hindi ang literal na pagkakatagpo lamang.
- source_word: רַבִּים
  choice: mas marami
  rationale: Ginamit ang pahambing na diwa sapagkat tuwirang inihahambing ang mga anak ni Eleazar sa mga anak ni Itamar.
- source_word: לְרָאשֵׁי הַגְּבָרִים
  choice: na pinuno ng kalalakihan
  rationale: Pinananatili nito ang diwa ng רֹאשׁ bilang pinuno at ang karaniwang kahulugan ng גְּבָרִים bilang mga lalaki, habang inilalagay sa talababa ang posibleng diwang malalakas o mandirigma.
- source_word: וַיַּחְלְקוּם
  choice: Kaya hinati nila ang mga ito nang ganito
  rationale: Ipinakikita ng pandiwa ang paghahati o pagsasaayos sa mga pangkat at natural na ipinakikilala ang kasunod na bilang; hindi tinutukoy sa talata ang paksa ng pandiwa kaya pinanatili ang “nila.”
- source_word: רָאשִׁים
  choice: mga pinuno
  rationale: Mas natural sa makabagong Tagalog kaysa sa literal na “mga ulo” at pinananatili ang tungkuling pamunuan ng mga taong binibilang.
- source_word: לְבֵית אָבוֹת
  choice: ayon sa mga sambahayan ng mga ninuno
  rationale: Ipinapahayag ang kinship-administrative unit nang malinaw sa karaniwang mambabasa nang hindi ito nililimitahan sa isang nuclear family.
- source_word: שִׁשָּׁה עָשָׂר
  choice: labing-anim
  rationale: Tuwirang bilang ng mga pinuno mula sa mga anak ni Eleazar.
- source_word: לְבֵית אֲבוֹתָם
  choice: ayon sa mga sambahayan ng kanilang mga ninuno
  rationale: Isinasama ang pronominal suffix at ang distributibong pagsasaayos ayon sa kani-kanilang angkan.
- source_word: שְׁמוֹנָה
  choice: walo
  rationale: Tuwirang bilang para sa mga pangkat mula sa mga anak ni Itamar.
