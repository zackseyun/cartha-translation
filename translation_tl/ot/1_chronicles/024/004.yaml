    issue: Hindi malinaw at di-idiomatiko ang “mga anak ni Eleazar na pinuno ng kalalakihan.”
    rationale: Ang Tagalog na ayos na ito ay maaaring magpahiwatig na ang tinutukoy ay isang uri ng mga anak, at ang “pinuno ng kalalakihan” ay hindi likas na pananalita. Mas mabuting gawing malinaw na mas marami ang mga pinunong mula sa sangay ni Eleazar.
  - severity: low
