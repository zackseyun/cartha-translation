revisions:
- from: 'Ito ang mga itinakdang tungkulin nila sa kanilang paglilingkod: ang pumasok sa bahay ni Yahweh ayon sa itinakdang kaayusan para sa kanila[a], sa ilalim ng pamamahala ng ninuno nilang si Aaron[b], gaya ng iniutos sa kanya ni Yahweh, ang Diyos ng Israel.'
