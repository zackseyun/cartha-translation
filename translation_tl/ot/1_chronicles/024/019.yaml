  text: אֵ֣לֶּה פְקֻדָּתָ֞/ם לַ/עֲבֹדָתָ֗/ם לָ/ב֤וֹא לְ/בֵית יְהוָה֙ כְּ/מִשְׁפָּטָ֔/ם בְּ/יַ֖ד אַהֲרֹ֣ן אֲבִי/הֶ֑ם כַּ/אֲשֶׁ֣ר צִוָּ֔/הוּ יְהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/024/019.yaml
  text: These were their appointed duties for their service[a], to enter the house of Yahweh according to their ordinance, under the hand of Aaron their father, as Yahweh, the God of Israel[b], had commanded him.
translation:
  language: tl
  text: Ito ang mga itinakdang tungkulin nila sa kanilang paglilingkod sa pagpasok sa bahay ni Yahweh, ayon sa kanilang itinakdang kaayusan[a], sa ilalim ng pamamahala ng ninuno nilang si Aaron[b], gaya ng iniutos sa kanya ni Yahweh, ang Diyos ng Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ayon sa tuntuning itinakda para sa kanila.” Ang salitang Hebreo ay maaaring tumukoy sa tuntunin, ordinansa, o itinakdang paraan ng pagsasagawa.
    reason: lexical_alternative
  - marker: b
    text: Literal na “sa kamay ng kanilang amang si Aaron.” Ang idyoma ay maaaring mangahulugang sa pamamagitan ng pamamahala o sa ilalim ng awtoridad ng isang tao; dito, “ama” ay tumutukoy sa kanilang ninuno.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְקֻדָּתָם
  choice: mga itinakdang tungkulin nila
  rationale: Ipinahahayag nito kapwa ang pormal na pagkatalaga at ang mga pananagutang kaakibat ng paglilingkod ng mga pari.
- source_word: לַעֲבֹדָתָם
  choice: sa kanilang paglilingkod
  rationale: Sa kontekstong pangtemplo, tumutukoy ang עֲבֹדָה sa paglilingkod na panrelihiyon; malinaw at hindi labis na teknikal ang “paglilingkod.”
- source_word: לָבוֹא לְבֵית יְהוָה
  choice: ang pumasok sa bahay ni Yahweh
  rationale: Sa konteksto, ang literal na “pumarito” ng בוא ay tumutukoy sa pagpasok para maglingkod. Pinanatili ng “bahay ni Yahweh” ang karaniwang Hebreong katawagan sa templo.
- source_word: כְּמִשְׁפָּטָם
  choice: ayon sa itinakdang kaayusan para sa kanila
  rationale: Dito ang מִשְׁפָּט ay isang tuntunin o itinakdang paraan ng pagsasagawa, hindi isang hatol. Ang “kaayusan” ay natural sa Filipino at angkop sa paghahati-hati ng mga pari.
- source_word: בְּיַד אַהֲרֹן
  choice: sa ilalim ng pamamahala ... ni Aaron
  rationale: Ang idyomang “sa kamay ni Aaron” ay maaaring tumukoy sa pagkilos sa pamamagitan niya o sa ilalim ng awtoridad niya. Ipinahahayag ng “sa ilalim ng pamamahala” ang administratibong diwa habang itinatala sa talababa ang literal na larawan.
- source_word: אֲבִיהֶם
  choice: ninuno nilang
  rationale: Literal itong “kanilang ama,” ngunit si Aaron ang ninunong pinagmulan ng mga salinlahing pari; “ninuno” ang likas at tumpak na pagpapahayag sa modernong Filipino.
- source_word: כַּאֲשֶׁר צִוָּהוּ
  choice: gaya ng iniutos sa kanya
  rationale: Singular ang hulaping panghalip at natural na tumutukoy kay Aaron, na siyang inutusan ni Yahweh.
- source_word: יְהוָה אֱלֹהֵי יִשְׂרָאֵל
  choice: Yahweh, ang Diyos ng Israel
  rationale: Pinananatili ang personal na pangalang banal at ang kasunod na pariralang nagpapakilala sa kanya bilang Diyos ng Israel.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo. Ang “Yahweh” ay tuwirang transliterasyon na nagpapanatili sa katangiang pangtipan ng pangalan nang hindi ito pinapalitan ng isang titulo.
- issue: Diwa ng בְּיַד אַהֲרֹן sa kaayusan ng mga pari
  choice: sa ilalim ng pamamahala ng ... si Aaron
  alternative: sa pamamagitan ni Aaron; sa kamay ni Aaron
  rationale: Maaaring magpahiwatig ang idyoma ng ahensiya o awtoridad. Pinili ang administratibong diwa na pinakaangkop sa konteksto, habang pinananatili sa talababa ang tunay na saklaw ng kahulugan.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang tutuldok upang malinaw na iugnay ang mga itinakdang tungkulin sa pagpasok sa bahay ni Yahweh. Iniwasan ang mas teknikal na “ministeryo” at “ordinansa” sa pangunahing teksto, ngunit pinanatili sa talababa ang leksikal na saklaw at ang literal na Hebreong idyoma.
