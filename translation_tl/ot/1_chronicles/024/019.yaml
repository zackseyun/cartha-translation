  naturalness: 'Bahagyang pilit sa modernong Filipino ang “sa kanilang paglilingkod: ang pumasok.” Mas natural at malinaw ang “sa kanilang paglilingkod sa pagpasok,” nang hindi binabago ang saklaw ng Hebreo.'
  terminology: Ang “Yahweh,” “bahay ni Yahweh,” “itinakdang tungkulin,” “itinakdang kaayusan,” at “ninuno” ay angkop sa tekstong Hebreo at sa marangal na modernong rehistro. Ang “sa ilalim ng pamamahala” ay isang ligtas na pagpapakahulugan ng idiomang “sa kamay ni,” at ang literal at alternatibong saklaw nito ay maayos na nakatala sa talababa.
