  yaml_path: translation/ot/1_chronicles/024/018.yaml
  text: for Delaiah, the twenty-third; for Maaziah, the twenty-fourth.
translation:
  language: tl
  text: para kay Delaias, ang ika-dalawampu't tatlo; para kay Maazias, ang ika-dalawampu't apat.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִ/דְלָיָהוּ
  choice: para kay Delaias
  rationale: Ang panlaping לְ ay nagpapahiwatig ng pagkakatalaga sa talaan ng mga pangkat ng mga pari. Likas sa Tagalog ang “para kay,” at ang pangalang Hebreo ay isinalin sa anyong transliterasyong Delaias.
- source_word: שְׁלֹשָׁה וְ/עֶשְׂרִים
  choice: ang ikadalawampu't tatlo
  rationale: Bagaman kardinal ang anyong Hebreo, ginagamit ito rito bilang bilang-panunod ng pangkat o palabunutan. Malinaw at likas sa modernong Tagalog ang ordinal na “ikadalawampu't tatlo.”
- source_word: לְ/מַעַזְיָהוּ
  choice: para kay Maasias
  rationale: Tulad ng unang pangalan, ang לְ ay tumutukoy sa pagkakatalaga. Pinananatili ng “para kay” ang maikli at enumeratibong anyo ng Hebreo; ang pangalan ay transliterado bilang Maasias.
- source_word: אַרְבָּעָה וְ/עֶשְׂרִים
  choice: ang ikadalawampu't apat
  rationale: Ang literal na kardinal na “apat at dalawampu” ay gumaganap bilang ordinal sa sunod-sunod na talaan, kaya ang “ikadalawampu't apat” ang malinaw na katumbas.
theological_decisions: []
translation_notes:
  register: Maikli, marangal, at natural na pormang pangtalaan. Ginamit ang “para kay” upang ipahiwatig ang pagkakatalaga nang hindi inuulit ang salitang “pangkat” o “palabunutan,” na nauunawaan mula sa konteksto.
