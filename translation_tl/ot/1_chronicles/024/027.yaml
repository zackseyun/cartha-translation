  text: 'The sons of Merari: of Jaaziah, his son, Shoham, Zaccur, and Ibri.'
translation:
  language: tl
  text: 'Ang mga anak ni Merari: si Jaazias, ang kanyang anak[a], at sina Soham, Zacur, at Ibri.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “ang kanyang anak.” Mahirap ang pagkakabuo ng pangungusap; itinuturing ito ng ilan na pangalang pantanging “Beno,” samantalang inuunawa naman ng iba sa diwang maramihan na “ang mga anak niya.”
    reason: alternative_reading
lexical_decisions:
- source_word: בְּנֵי
  choice: Ang mga anak ni
  rationale: Tuwirang salin ng construct plural na nagpapakilala sa talaangkanan; maaari rin itong tumukoy sa mga inapo sa ganitong konteksto.
- source_word: מְרָרִי
  choice: Merari
  rationale: Pangngalang pantangi na tinumbasan sa karaniwang anyong Filipino.
- source_word: לְיַעֲזִיָּהוּ
  choice: mula kay Jaazias
  rationale: Ang prefixed לְ ay nauunawaan dito bilang pagtukoy sa sangay ng angkan na nagmula o nauugnay kay Jaazias. Ginagawang natural ng “mula kay” ang pira-pirasong anyo ng talaan nang hindi inaalis ang ugnayang genealogical.
- source_word: בְנוֹ
  choice: ang anak niya
  rationale: Ito ang tuwirang pagbasa sa nakapunting tekstong Masoretiko. Pinanatili sa pangunahing teksto kahit mahirap ang sintaks; inilalahad sa talababa ang posibleng pangalang “Beno” at ang pag-unawang maramihan.
- source_word: וְשֹׁהַם
  choice: Soham
  rationale: Pangngalang pantangi; isina-Filipino ang transliterasyon ayon sa tunog.
- source_word: וְזַכּוּר
  choice: Zacur
  rationale: Pangngalang pantangi; isina-Filipino ang transliterasyon ayon sa tunog.
- source_word: וְעִבְרִי
  choice: Ibri
  rationale: Pangngalang pantangi; transliterasyon na natural basahin sa Filipino.
