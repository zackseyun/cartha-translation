  register: Maikli, marangal, at natural na administratibong pahayag. Ginamit ang tradisyonal na anyong Tagalog na “Jedaias,” samantalang pinanatili ang “Jehoiarib” upang malinaw na katawanin ang pangalang Hebreo.
