  yaml_path: translation/ot/1_chronicles/024/007.yaml
  text: The first lot came out for Jehoiarib[a], the second for Jedaiah.
translation:
  language: tl
  text: Ang unang bunot ay napunta kay Jehoiarib, at ang ikalawang bunot ay kay Jedaias.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: napunta
  rationale: Sa konteksto ng palabunutan, likas na ipinapahayag sa Tagalog ng “napunta” ang kinalabasan at pagtatalaga, sa halip na literal ngunit di-likas na “lumabas.”
- source_word: הַגּוֹרָל
  choice: palabunutan
  rationale: Tumutukoy ang גּוֹרָל sa lot o resultang itinalaga sa pamamagitan nito. Malinaw at karaniwan sa makabagong Tagalog ang “palabunutan” para sa prosesong ito.
- source_word: הָרִאשׁוֹן
  choice: ang unang
  rationale: Pinananatili nito ang ordinal na pagkakasunod-sunod at ang tiyak na anyo ng Hebreo.
- source_word: לִיהוֹיָרִיב
  choice: kay Jehoiarib
  rationale: Ipinahihiwatig ng ל ang tumanggap ng unang pagtatalaga; likas sa Tagalog ang “kay” para sa pangalang pantangi.
- source_word: לִידַעְיָה
  choice: kay Jedaias
  rationale: Ipinahihiwatig ng ל ang tumanggap ng ikalawang pagtatalaga; ginamit ang “kay” bilang likas na pananda sa Tagalog.
- source_word: הַשֵּׁנִי
  choice: ang ikalawa
  rationale: Tumpak nitong ipinapakita ang kasunod na bilang at binabalanse ang “ang unang.”
