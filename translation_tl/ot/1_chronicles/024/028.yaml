  yaml_path: translation/ot/1_chronicles/024/028.yaml
  text: 'For Mahli: Eleazar[a], and he had no sons.'
translation:
  language: tl
  text: 'Kay Mahli: si Eleazar, at wala siyang mga anak na lalaki.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְמַחְלִי
  choice: Tungkol kay Mahli
  rationale: Ang prefiks na לְ ay malamang na nagsisilbing pananda ng paksa o pamagat sa talaan. Likas sa modernong Filipino ang “Tungkol kay Mahli” at pinananatili nito ang estruktura ng talaan.
- source_word: אֶלְעָזָר
  choice: Eleazar
  rationale: Ginamit ang nakaugaliang anyo ng pangalang pantangi sa Filipino na mga salin ng Bibliya.
- source_word: וְלֹא הָיָה לוֹ
  choice: at wala siyang
  rationale: Ang literal na idyomang Hebreo na “walang umiiral para sa kaniya” ay likas na ipinahahayag sa Filipino bilang “wala siyang.” Pinanatili ang payak na pang-ugnay na “at” upang hindi magdagdag ng diin sa pagsalungat.
- source_word: בָּנִים
  choice: mga anak na lalaki
  rationale: Tiyak na tumutukoy ang בָּנִים sa mga anak na lalaki sa kontekstong genealogical, kaya hindi ito pinalawak sa pangkalahatang “mga anak.”
