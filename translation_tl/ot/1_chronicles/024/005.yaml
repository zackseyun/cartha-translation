base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/024/005.yaml
  text: So they divided them by lots[a], these with those[b], because there were officers of the sanctuary and officers of God from the sons of Eleazar and from the sons of Ithamar.
translation:
  language: tl
  text: Kaya hinati nila ang mga ito sa pamamagitan ng palabunutan—ang mga ito kasama ng mga iyon[a]—sapagkat kapuwa sa mga anak ni Eleazar at sa mga anak ni Itamar ay may mga pinuno ng santuwaryo at mga pinuno ng Diyos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang isang pangkat kasama ng isa pang pangkat.” Literal sa Hebreo, “ang mga ito kasama ng mga iyon.”
    reason: lexical_alternative
  - marker: b
    text: O “mga prinsipe/mataas na opisyal ng santuwaryo at mga prinsipe/mataas na opisyal ng Diyos.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחְלְקוּם
  choice: hinati nila ang mga ito
  rationale: Tuwirang ipinapahayag ng piel na anyo ng חלק ang paghahati o pagtatalaga ng mga pangkat ng pari, nang hindi ito nilalabisan ng paliwanag bilang simpleng pag-oorganisa.
- source_word: בְּגוֹרָלוֹת
  choice: sa pamamagitan ng palabunutan
  rationale: Ipinahihiwatig ng גוֹרָל ang paggamit ng palabunutan bilang paraan ng pagtatalaga; ito ang likas at malinaw na katumbas sa modernong Filipino.
- source_word: אֵלֶּה עִם אֵלֶּה
  choice: ang mga ito kasama ng mga iyon
  rationale: Pinananatili ang maikli at bahagyang malabong paghahambing ng dalawang pangkat sa Hebreo sa halip na tahasang tukuyin kung alin ang bawat isa.
- source_word: שָׂרֵי קֹדֶשׁ
  choice: mga pinuno ng santuwaryo
  rationale: Maaaring tumukoy ang שָׂרֵי sa mga pinuno o mataas na opisyal. Sa kontekstong pangpari, ang קֹדֶשׁ ay likas na tumutukoy sa banal na santuwaryo.
- source_word: וְשָׂרֵי הָאֱלֹהִים
  choice: at mga pinuno ng Diyos
  rationale: Pinananatili ang literal at teolohikal na maigting na pariralang 'ng Diyos' at hindi idinaragdag ang salitang 'bahay' o 'paglilingkod,' na wala sa Hebreo.
- source_word: מִבְּנֵי אֶלְעָזָר וּבִבְנֵי אִיתָמָר
  choice: kapuwa sa mga anak ni Eleazar at sa mga anak ni Itamar
  rationale: Ipinakikita ng ayos na ito na ang dalawang angkan ay kapuwa may gayong mga pinuno. Pinananatili rin ng 'mga anak' ang karaniwang pananalitang pangangkan, na maaari ring sumaklaw sa mga inapo.
theological_decisions:
- issue: Kahulugan ng שָׂרֵי קֹדֶשׁ וְשָׂרֵי הָאֱלֹהִים
  choice: mga pinuno ng santuwaryo at mga pinuno ng Diyos
  alternative: mga opisyal ng mga banal na bagay at mga opisyal ng sambahayan o paglilingkod sa Diyos
  rationale: Pinananatili ang dalawang magkatulad ngunit hindi ganap na ipinaliliwanag na katawagan sa Hebreo. Hindi ipinapalagay na ang ikalawang parirala ay pinaikling anyo ng 'bahay ng Diyos,' at hindi rin pinagsasama ang dalawang tungkulin.
translation_notes:
  register: Makabago at marangal na Filipino ang ginamit. Ang “palabunutan” ay karaniwang nauunawaang paraan ng pagpapasiya sa pamamagitan ng bunot. Pinanatili ang “santuwaryo” dahil tiyak ang kontekstong panrelihiyon, at ang mga talababa ay nag-iingat sa literal na anyo at mga posibleng kahulugan ng Hebreo.
