  source_fidelity: 'Tumpak na isinasalin ng pangunahing teksto ang pagkakahati at sadyang problematikong anyo ng Hebreo: “mga anak ni Merari: Mahli at Musi; mga anak ni Jaazia: ang anak niya.” Hindi nito tahimik na inaayos ang hindi pagtutugma ng pangmaramihang “mga anak” at isahang “ang anak niya.” Ang talababa ay wastong nagtatala na ang בְּנוֹ ay maaari ring basahin bilang pangalang “Beno,” isang tunay na posibilidad sa tekstuwal na tradisyon at mga salin.'
  naturalness: 'Natural at angkop ang maikling talaangkanang ayos sa modernong Filipino. Ang “sina Mahli at Musi” ay maayos para sa mga personal na pangalan. Bagaman kakaiba ang “Ang mga anak ni Jaazia: ang anak niya,” ang pagkaasiwa nito ay kinakailangan upang huwag ikubli ang hirap ng Hebreo, at sapat itong nililinaw ng talababa.'
  terminology: Ang “mga anak” ay angkop na salin ng בְּנֵי sa talaangkanang konteksto. Ang mga pangalang Mahli, Musi, at Jaazia ay malinaw na transliterasyon; walang suliraning teolohikal o terminolohikal. Ang footnote marker ay wastong nakakabit sa problematikong huling parirala.
