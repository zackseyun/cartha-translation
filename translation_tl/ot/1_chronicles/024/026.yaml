base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/024/026.yaml
  text: 'The sons of Merari: Mahli and Mushi. The sons of Jaaziah: his son.'
translation:
  language: tl
  text: 'Ang mga anak ni Merari: sina Mahli at Musi. Ang mga anak ni Jaazia: ang anak niya.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hindi malinaw ang Hebreo sa huling parirala; maaari rin itong unawain na isang pangalang pantangi: “Beno.”'
    reason: Ipinapaalam ang tunay na tekstuwal at sintaktikong kalabuan sa halip na itago ito sa pangunahing salin.
lexical_decisions:
- source_word: בְּנֵי
  choice: mga anak
  rationale: Karaniwang salin ng pangmaramihang construct na maaaring tumukoy sa mga anak o mga inapo; pinananatili rito ang payak na anyong genealogical.
- source_word: בְנוֹ
  choice: ang anak niya
  rationale: Binabasa ang teksto bilang dalawang salita, בְּנוֹ, ‘ang anak niya,’ ayon sa ketiv at sa diwa ng English consultation layer, sa halip na ituring itong pangalang Beno.
- source_word: מַחְלִי וּמוּשִׁי
  choice: sina Mahli at Musi
  rationale: Gumagamit ng natural na pantukoy na ‘sina’ para sa dalawang pangalan ng tao at makabagong baybay-Tagalog.
- source_word: יַעֲזִיָּהוּ
  choice: Jaazia
  rationale: Transliterasyong madaling basahin sa modernong Filipino, na pinananatili ang pagkakakilanlan ng Hebreong pangalan.
theological_decisions:
- issue: Hindi pangkaraniwan at tila putol na pariralang בְּנֵי יַעֲזִיָּהוּ בְנוֹ
  choice: 'Ang mga anak ni Jaazia: ang anak niya.'
  alternative: 'Ang mga anak ni Jaazia: Beno.'
  rationale: Hindi ginagawang tiyak na personal na pangalan ang בְנוֹ; pinananatili ang literal na kahulugan at ang tunay na hirap ng tekstong Hebreo nang hindi tahimik na inaayos ang talaangkanan.
translation_notes:
  register: Natural, kasalukuyan, at marangal na Filipino. Pinanatili ang maikli at talaangkanang ayos ng talata, habang nililinaw sa talababa ang hindi pangkaraniwang huling parirala.
