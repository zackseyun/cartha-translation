base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/024/002.yaml
  text: But Nadab and Abihu died before their father[a], and they had no sons; so Eleazar and Ithamar served as priests.
translation:
  language: tl
  text: Ngunit namatay sina Nadab at Abihu bago ang kanilang ama[a], at wala silang mga anak na lalaki. Kaya naglingkod bilang mga pari sina Eleazar at Itamar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa harapan ng kanilang ama.” Maaaring unawain ang pariralang Hebreo bilang tumutukoy sa lugar o presensya (“sa harapan ng”) o sa panahon (“bago,” samakatuwid, habang nabubuhay pa ang kanilang ama).
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּמָת
  choice: namatay
  rationale: Ang wayyiqtol ng מוּת ay nagsasalaysay ng pangyayaring naganap na; natural itong isalin sa payak na nagdaang anyong “namatay.”
- source_word: לִפְנֵי
  choice: bago
  rationale: Sa pariralang kasama ang “kanilang ama,” maaaring tumukoy ito sa panahon—bago mamatay ang kanilang ama—ngunit maaari rin itong mangahulugang “sa harapan/presensya.” Pinananatili sa talababa ang tunay na kalabuan.
- source_word: אֲבִיהֶם
  choice: ang kanilang ama
  rationale: Tuwirang salin ng pangngalang may hulaping panghalip na tumutukoy kay Aaron bilang ama nina Nadab at Abihu.
- source_word: וּבָנִים לֹא הָיוּ לָהֶם
  choice: wala silang mga anak na lalaki
  rationale: Ang בָּנִים ay espesipikong “mga anak na lalaki,” hindi lamang pangkalahatang “mga anak.”
- source_word: וַיְכַהֲנוּ
  choice: naglingkod bilang mga pari
  rationale: Ang piel ng כָּהַן ay nagsasaad ng aktuwal na pagganap ng tungkuling pari, kaya mas angkop ang pandiwang parirala kaysa sa payak na “naging mga pari.”
- source_word: אֶלְעָזָר וְאִיתָמָר
  choice: Eleazar at Itamar
  rationale: Ginamit ang mga anyong karaniwan at madaling makilala sa modernong saling Tagalog ng mga pangalang ito.
