  text: לִֽ/פְתַחְיָה֙ תִּשְׁעָ֣ה עָשָׂ֔ר לִֽ/יחֶזְקֵ֖אל הָ/עֶשְׂרִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/024/016.yaml
  text: for Pethahiah[a], the nineteenth; for Jehezkel, the twentieth.
translation:
  language: tl
  text: para kay Petahias, ang ikalabinsiyam; para kay Jehezkel[a], ang ikadalawampu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Ezekiel.” Ang anyo ng pangalang Hebreo rito ay יְחֶזְקֵאל/יֶחֶזְקֵאל, na mas eksaktong kinakatawan ng “Jehezkel”; ginagawa naman itong mas pamilyar na “Ezekiel” sa ilang salin.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִפְתַחְיָה
  choice: para kay Petahias
  rationale: Ang unlaping ל sa talaang ito ay nagpapahiwatig ng pagkakatalaga ng bahagi o palabunutan sa sambahayan ng pinangalanang pari. Ginamit ang anyong “Petahias,” na natural na transliterasyon sa Filipino.
- source_word: תִּשְׁעָה עָשָׂר
  choice: ang ikalabinsiyam
  rationale: Bagaman kardinal ang anyo sa Hebreo, gumaganap ito bilang ordinal sa pagkakasunod-sunod ng mga pangkat ng pari.
- source_word: לִיחֶזְקֵאל
  choice: para kay Jehezkel[a]
  rationale: Ang ל ay muling nagpapahiwatig ng pagkakatalaga. Pinanatili ang mas tiyak na anyo ng pangalang Hebreo rito sa halip na awtomatikong itumbas sa mas pamilyar na Ezekiel.
- source_word: הָעֶשְׂרִים
  choice: ang ikadalawampu
  rationale: Ang bilang na may pantukoy ay ginagamit bilang ordinal sa talaan; ipinahihiwatig ng konteksto ang salitang “bahagi” o “pangkat.”
theological_decisions: []
translation_notes:
  register: Maikli at pormal na talaan, ngunit gumagamit ng likas at makabagong Filipino. Ang “para kay” ay malinaw na naghahayag ng pagkakatalaga, at ang mga ordinal ay nagpapanatili sa estruktura ng listahan.
