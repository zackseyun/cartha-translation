  text: לְ/יָכִין֙ אֶחָ֣ד וְ/עֶשְׂרִ֔ים לְ/גָמ֖וּל שְׁנַ֥יִם וְ/עֶשְׂרִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/024/017.yaml
  text: for Jakin, the twenty-first; for Gamul, the twenty-second.
translation:
  language: tl
  text: kay Jakin ang ikadalawampu't isa; kay Gamul ang ikadalawampu't dalawa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְ/יָכִין
  choice: kay Jakin
  rationale: Sa talaang ito, ang לְ ay nagpapakilala kung kanino nauukol ang bawat pagkakasunod; natural itong ipahayag sa Tagalog bilang “kay Jakin.” Pinanatili bilang transliterasyon ang pangalang pantangi.
- source_word: אֶחָד וְ/עֶשְׂרִים
  choice: ang ikadalawampu't isa
  rationale: Bagaman kardinal ang anyong Hebreo (“isa at dalawampu”), gumaganap itong ordinal sa talaan ng mga pangkat. Ang “ikadalawampu't isa” ang natural at malinaw na katumbas sa Tagalog.
- source_word: לְ/גָמוּל
  choice: kay Gamul
  rationale: Gaya sa unang sugnay, ipinahihiwatig ng לְ kung kanino nauukol ang puwesto o pangkat. Isinalin itong “kay,” at pinanatili bilang transliterasyon ang pangalang Gamul.
- source_word: שְׁנַיִם וְ/עֶשְׂרִים
  choice: ang ikadalawampu't dalawa
  rationale: Ang literal na kardinal na “dalawa at dalawampu” ay may ordinal na gamit sa konteksto ng sunud-sunod na talaan; kaya “ikadalawampu't dalawa” ang likas na salin.
theological_decisions: []
translation_notes:
  register: Maikli at dignified na modernong Tagalog na angkop sa anyo ng isang talaan. Ginamit ang “kay … ang” upang malinaw na maipakita ang pagkakatalaga, habang pinananatili ang paralelismo ng dalawang sugnay.
