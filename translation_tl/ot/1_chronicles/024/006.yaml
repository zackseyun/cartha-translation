base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/024/006.yaml
  text: Shemaiah son of Nethanel[a], the scribe from among the Levites, recorded them in the presence of the king, the officials, Zadok the priest, Ahimelech son of Abiathar, and the heads of the fathers’ houses of the priests and of the Levites—one father’s house being taken for Eleazar, and one being taken for Ithamar.
translation:
  language: tl
  text: Itinala sila ni Semaias na anak ni Natanael, ang eskriba na mula sa mga Levita, sa harap ng hari, ng mga pinuno, ni Zadok na pari, ni Ahimelec na anak ni Abiatar, at ng mga ulo ng sambahayan ng mga pari at ng mga Levita—isang sambahayan ang pinili para kay Eleazar, at isa ang pinili para kay Itamar.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Siksik ang Hebreo: “isang sambahayan na kinuha para kay Eleazar, at kinuha, kinuha para kay Itamar.” Ipinahihiwatig nito na ang mga sambahayan mula sa mga linya nina Eleazar at Itamar ay pinili o kinuha; hindi malinaw sa mismong pahayag ang eksaktong ayos ng pagpili.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכְתְּבֵם
  choice: Itinala sila
  rationale: Ipinahihiwatig ng כתב na isinulat o inirehistro ang mga pangkat na tinutukoy sa naunang konteksto; natural at may dokumentaryong diwa ang “itinala.”
- source_word: הַסּוֹפֵר
  choice: ang eskriba
  rationale: Tumutukoy ito sa opisyal na tagasulat; pinananatili ng “eskriba” ang makasaysayang tungkulin.
- source_word: מִן הַלֵּוִי
  choice: mula sa mga Levita
  rationale: 'Pinananatili nito ang partitive na diwa ng מן: kabilang si Semaias sa pangkat ng mga Levita.'
- source_word: לִפְנֵי
  choice: sa harap ng
  rationale: Sa kontekstong pampubliko at administratibo, nangangahulugan itong ginawa ang pagtatala sa kanilang presensya bilang mga saksi.
- source_word: הַשָּׂרִים
  choice: mga pinuno
  rationale: Ang שׂרים ay mga taong may katungkulan o kapangyarihan; malinaw ang “mga pinuno” at hindi nagpapahiwatig na mga anak sila ng hari.
- source_word: רָאשֵׁי הָאָבוֹת
  choice: mga pinuno ng mga sambahayan
  rationale: Ang teknikal na parirala ay tumutukoy sa mga pinuno ng mga yunit ng angkan; mas natural sa modernong Tagalog ang “mga sambahayan” kaysa literal na “mga bahay ng ama.”
- source_word: בֵּית אָב אֶחָד
  choice: isang sambahayan
  rationale: Tumutukoy ang parirala sa isang yunit ng angkan o angkaning sambahayan, hindi lamang sa isang pisikal na bahay.
- source_word: אָחֻז ... אָחֻז אָחֻז
  choice: isa ... at isa naman
  rationale: Siksik at eliptikal ang Hebreo. Ipinahihiwatig ng passive participle at pag-uulit ang pagpili nang salitan o ayon sa pagkakasunod, ngunit hindi tahasang nilulutas sa teksto ang eksaktong paraan.
- source_word: לְאֶלְעָזָר ... לְאִיתָמָר
  choice: para kay Eleazar ... para kay Itamar
  rationale: Ang לְ ay nag-uugnay sa mga napiling sambahayan sa dalawang linya ng mga pari.
theological_decisions: []
translation_notes:
  register: 'Makabago, malinaw, at marangal na Filipino. Ginamit ang mga nakasanayang anyong Tagalog ng mga pangalan: Semaias, Natanael, Zadok, Ahimelec, Abiatar, Eleazar, at Itamar. Iniwasan ang sobrang literal na “bahay ng ama” ngunit pinanatili ang organisasyong pang-angkan sa salitang “sambahayan.”'
