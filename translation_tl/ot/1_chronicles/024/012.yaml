  yaml_path: translation/ot/1_chronicles/024/012.yaml
  text: the eleventh to Eliashib[b][a], the twelfth to Jakim.
translation:
  language: tl
  text: ang ikalabing-isa ay kay Eliashib[a], at ang ikalabindalawa ay kay Jakim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “labing-isa … labindalawa”; sa konteksto, ginagamit ang mga ito bilang mga bilang na panunuran sa pagkakasunod-sunod ng mga palabunot.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְ/אֶלְיָשִׁיב
  choice: kay Eliashib
  rationale: Ang unlaping לְ ay nagsasaad ng pag-aatas sa talaan ng mga palabunutan; likas sa Tagalog ang “kay” para sa taong pinaglaanan. Tinumbasan ang pangalan ayon sa anyong Hebreo.
- source_word: עַשְׁתֵּי עָשָׂר
  choice: ang ikalabing-isa
  rationale: Bagaman kardinal ang anyong Hebreo (“labing-isa”), gumaganap itong ordinal sa sunod-sunod na talaan. Hindi idinagdag ang “palabunot” dahil ipinahihiwatig lamang iyon ng konteksto.
- source_word: לְ/יָקִים
  choice: kay Jakim
  rationale: Muli, ang לְ ay tanda ng pag-aatas. Ang “Jakim” ay malapit na transliterasyon ng Hebreong יָקִים.
- source_word: שְׁנֵים עָשָׂר
  choice: ang ikalabindalawa
  rationale: Ang kardinal na “labindalawa” ay ginagamit bilang ordinal sa administratibong listahang ito; hindi idinagdag sa teksto ang ipinahihiwatig na “palabunot.”
theological_decisions: []
translation_notes:
  register: Maikli at pormal na estilong pangtalaan, ngunit natural sa modernong Filipino. Ginamit ang “kay” bilang karaniwang pananda ng pag-aatas sa isang tao; hindi na kailangan ng hiwalay na talababa para sa alternatibong “para kay,” sapagkat pareho ang diwa at hindi mahalagang ambiguwidad sa Filipino.
