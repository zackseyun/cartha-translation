  text: para kay Bilga ang ikalabinlima; para kay Imer ang ikalabing-anim.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְ/בִלְגָּה
  choice: para kay Bilga
  rationale: Ang prefiks na לְ ay nagsasaad ng pagkakatalaga sa talaan ng mga pangkat ng mga pari; natural itong ipinapahayag sa Tagalog bilang “para kay.”
- source_word: חֲמִשָּׁה עָשָׂר
  choice: ang ikalabinlima
  rationale: Bagaman kardinal na “labinlima” ang anyong Hebreo, ordinal ang gamit nito sa konteksto ng sunod-sunod na palabunutan.
- source_word: לְ/אִמֵּר
  choice: para kay Imer
  rationale: Tulad sa Bilga, ipinahihiwatig ng לְ ang pagkakatalaga ng bahagi o palabunot kay Imer.
- source_word: שִׁשָּׁה עָשָׂר
  choice: ang ikalabing-anim
  rationale: Kardinal ang literal na anyo ngunit ordinal ang kahulugan sa talaang ito ng magkakasunod na pagkakatalaga.
