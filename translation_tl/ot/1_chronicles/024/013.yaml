  text: for Huppah[a], the thirteenth; for Jeshebeab, the fourteenth.
translation:
  language: tl
  text: para kay Hupa[a] ang ikalabintatlo; para kay Jesebeab ang ikalabing-apat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kay Hupa … kay Jesebeab.” Maaaring isalin sa alinman sa dalawang paraan ang pang-ukol sa Hebreo sa talaang ito ng mga atas.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְ/חֻפָּה
  choice: para kay Hupa
  rationale: Ang panlaping לְ ay nagpapahiwatig ng pag-aatas sa pinangalanang sambahayan ng mga pari. Likas sa modernong Tagalog ang “para kay” sa ganitong talaan.
- source_word: שְׁלֹשָׁה עָשָׂר
  choice: ang ikalabintatlo
  rationale: Bagaman kardinal ang anyong Hebreo, ordinal ang gamit nito sa pagkakasunod-sunod ng mga palabunutan.
- source_word: לְ/יֶשֶׁבְאָב
  choice: para kay Jesebeab
  rationale: Tulad sa unang pangalan, ipinahihiwatig ng לְ ang pag-aatas; ang “para kay” ang natural na katumbas sa Tagalog.
- source_word: אַרְבָּעָה עָשָׂר
  choice: ang ikalabing-apat
  rationale: Kardinal ang anyong Hebreo ngunit tumutukoy ito sa ordinal na puwesto sa talaan.
