source:
  edition: WLC
  text: וַ/יֶּֽחָלְקֵ֣/ם דָּוִ֔יד וְ/צָדוֹק֙ מִן בְּנֵ֣י אֶלְעָזָ֔ר וַ/אֲחִימֶ֖לֶךְ מִן בְּנֵ֣י אִיתָמָ֑ר לִ/פְקֻדָּתָ֖/ם בַּ/עֲבֹדָתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/024/003.yaml
  text: David[a], with Zadok from the sons of Eleazar and Ahimelech from the sons of Ithamar, divided them according to their appointment in their service.
translation:
  language: tl
  text: Hinati sila ni David, kasama sina Zadok, na mula sa mga anak ni Eleazar, at Ahimelec, na mula sa mga anak ni Itamar, ayon sa kani-kanilang atas[a] sa kanilang paglilingkod.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “ayon sa mga tungkuling itinalaga sa kanila.” Maaaring saklaw ng salitang Hebreo ang atas, tungkulin, pangangasiwa, o maayos na pagtatalaga.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּחָלְקֵם
  choice: Hinati sila
  rationale: Tuwirang isinasalin ang pandiwang חלק at ang hulaping tumutukoy sa kanila. Ipinahihiwatig ng konteksto ang paghahati sa mga pangkat, ngunit hindi iyon idinagdag sa pangunahing teksto.
- source_word: וְצָדוֹק ... וַאֲחִימֶלֶךְ
  choice: kasama sina Zadok ... at Ahimelec
  rationale: Ipinakikita ng natural na pariralang Filipino na nakibahagi sina Zadok at Ahimelec kay David sa paghahati, habang pinananatili ang payak na ugnayang ipinahahayag ng Hebreong pangatnig.
- source_word: מִן בְּנֵי אֶלְעָזָר
  choice: mula sa mga anak ni Eleazar
  rationale: Pinananatili ang pormang Hebreo na nagpapakilala kay Zadok bilang kabilang sa angkan o linya ni Eleazar nang hindi pinapalitan ang 'mga anak' ng mas interpretatibong 'mga inapo.'
- source_word: מִן בְּנֵי אִיתָמָר
  choice: mula sa mga anak ni Itamar
  rationale: Kaagapay ng naunang parirala, kinikilala nito si Ahimelec bilang kabilang sa linya ni Itamar.
- source_word: לִפְקֻדָּתָם
  choice: ayon sa kani-kanilang atas
  rationale: Ang פקדה ay maaaring tumukoy sa atas, tungkulin, pangangasiwa, o maayos na pagtatalaga. Ang 'kani-kanilang atas' ay natural sa Filipino at nagpapanatili sa administratibong diwa nang hindi labis na tinutukoy ang anyo ng institusyon.
- source_word: בַּעֲבֹדָתָם
  choice: sa kanilang paglilingkod
  rationale: Ang עבודה ay gawain o paglilingkod; sa konteksto, ito ay paglilingkod ng mga pari. Malinaw ang 'paglilingkod' at hindi nito dinaragdagan ang teksto ng mas tiyak na terminong panrelihiyon.
theological_decisions: []
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “kasama sina” upang maging natural ang pagkakaugnay ng tatlong gumaganap, at pinanatili ang “mga anak” upang hindi tahasang lutasin kung tuwirang mga anak o mas malawak na angkan ang tinutukoy.
