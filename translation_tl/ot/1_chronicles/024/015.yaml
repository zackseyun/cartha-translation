  text: to Hezir the seventeenth, to Happizzez the eighteenth.
translation:
  language: tl
  text: ang ikalabimpito ay kay Hezir, at ang ikalabingwalo ay kay Hapizez.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְחֵזִיר
  choice: ay kay Hezir
  rationale: Ang לְ ay nagpapahiwatig ng pagkakatalaga sa pagkakasunod-sunod ng mga pangkat. Likas sa Tagalog ang “ay kay” sa ganitong pinaikling talaan, at pinanatiling transliterasyon ang pangalang pantangi.
- source_word: שִׁבְעָה עָשָׂר
  choice: ang ikalabimpito
  rationale: Bagaman anyong kardinal ang Hebreo, ginagamit ito bilang ordinal sa konteksto ng sunod-sunod na palabunutan at mga pangkat.
- source_word: לְהַפִּצֵּץ
  choice: ay kay Hapizez
  rationale: Tulad sa unang sugnay, ang לְ ay tumutukoy sa pagkakatalaga. Ang “Hapizez” ay malinaw at madaling basahing transliterasyon sa modernong Filipino.
- source_word: שְׁמוֹנָה עָשָׂר
  choice: ang ikalabingwalo
  rationale: Gumaganap itong ordinal dahil inililista ng talata ang pagkakasunod-sunod ng mga pangkat.
