  register: Maikli at dignidad na modernong Tagalog, na pinananatili ang eliptikong anyo ng Hebreong talaan ngunit nililinaw ang ordinal na pagkakasunod. Ginamit ang karaniwang baybay na Filipino sa mga bilang at likas na konstruksiyong “ay kay.”
