  text: 'For the Izharite: Shelomoth[b][a]; for the sons of Shelomoth: Jahath.'
translation:
  language: tl
  text: 'Para sa Izharita: si Selomot; para sa mga anak[a] ni Selomot: si Jahat.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “mga anak” ay maaari ring mangahulugang “mga inapo” sa mga talaang pangangkan.
