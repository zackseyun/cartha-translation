lexical_decisions:
- source_word: לַיִּצְהָרִי
  choice: Sa mga Izharita
  rationale: Ang ל ay nagpapahiwatig ng pag-uukol o pagtatalaga sa konteksto ng talaan. Ang יִצְהָרִי ay katawagang pangangkan mula kay Izhar; natural itong isalin bilang maramihang pangkat na “mga Izharita” sa Filipino.
- source_word: שְׁלֹמוֹת
  choice: Selomot
  rationale: Pangalang pantangi ito at tinumbasan ayon sa bigkas na mas angkop sa ortograpiyang Filipino.
- source_word: לִבְנֵי
  choice: sa mga anak ni
  rationale: Pinananatili ng “mga anak” ang karaniwang kahulugan ng בנים, habang kinikilala sa talababa na maaari itong tumukoy nang mas malawak sa mga inapo sa talaang pangangkan.
- source_word: יָחַת
  choice: Jahat
  rationale: Pangalang pantangi ito; ang paunang Hebrew yod ay kinakatawan ng J ayon sa nakasanayang anyo ng maraming pangalang biblikal sa Filipino, at ang ח ay tinumbasan ng h.
