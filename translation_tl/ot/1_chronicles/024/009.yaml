  register: Maikli at pormal ang pagkakasalin, gaya ng pormulang Hebreo sa listahan. Idinagdag ang “ay” at “at” upang maging natural at malinaw sa makabagong Tagalog nang hindi ipinapaliwanag nang labis ang ipinahihiwatig na palabunutan.
