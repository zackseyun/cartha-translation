translation:
  language: tl
  text: Ang ikalimang palabunot ay kay Malkias[a], at ang ikaanim na palabunot ay kay Mijamin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “Para kay Malkias ang ikalimang palabunot … para kay Mijamin ang ikaanim na palabunot.” Maaaring isalin sa alinmang paraan ang pang-ukol sa Hebreo sa listahang ito ng mga pagtatalaga sa pamamagitan ng palabunutan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַלְכִּיָּה
  choice: kay Malkias
  rationale: Ang לְ ay nagsasaad ng pinagkalooban o napagtalagang saserdote sa paghahati-hati sa pamamagitan ng palabunutan. Likas sa Tagalog ang “kay” para sa ganitong pagtatalaga. Ginamit ang nakaugaliang anyong Tagalog na “Malkias.”
- source_word: הַחֲמִישִׁי
  choice: ang ikalima
  rationale: Ang ordinal na may pantukoy ay tumutukoy sa ikalimang palabunot o pagkakasunod-sunod; napapanatili ng maikling pariralang ito ang anyo ng Hebreo.
- source_word: לְמִיָּמִן
  choice: kay Mijamin
  rationale: Gaya sa unang parirala, ang לְ ay nagmamarka ng pagtatalaga. Isinalin itong “kay,” at tinumbasan ang pangalan ayon sa anyong Hebreo.
- source_word: הַשִּׁשִּׁי
  choice: ang ikaanim
  rationale: Ipinagpapatuloy ng ordinal ang pormula ng listahan at tumutukoy sa ikaanim na palabunot o pagkakasunod-sunod.
