  yaml_path: translation/ot/1_chronicles/024/023.yaml
  text: 'And the sons of Jeriah: Amariah the second[a], Jahaziel the third, Jekameam the fourth.'
translation:
  language: tl
  text: 'At ang mga anak ni Jerias: si Amarias ang ikalawa[a], si Jahaziel ang ikatlo, at si Jekameam ang ikaapat.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maikli at eliptiko ang ayos ng talaan sa Hebreo; literal itong: “At ang mga anak ni Jerias: si Amarias ang ikalawa, si Jahaziel ang ikatlo, si Jekameam ang ikaapat.” Maaari ring ipahayag ang ipinahihiwatig na pandiwa: “Si Amarias ay ikalawa,” at iba pa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנָי
  choice: At ang mga anak ni
  rationale: Pinananatili ng “At” ang ugnayan sa naunang talaan, at ang “mga anak ni” ang tuwirang katumbas ng construct plural sa kontekstong ito.
- source_word: יְרִיָּהוּ
  choice: Jerias
  rationale: Ginamit ang anyong pangalang pamilyar at natural sa tradisyong Tagalog para sa Jeriah.
- source_word: אֲמַרְיָהוּ
  choice: Amarias
  rationale: Isinalin sa karaniwang anyong Tagalog ng pangalang Amariah.
- source_word: הַשֵּׁנִי
  choice: ang ikalawa
  rationale: Pinananatili ang maikli at walang-pandiwang ayos ng talaang Hebreo; ipinahihiwatig ng ordinal ang pagkakasunod-sunod.
- source_word: יַחֲזִיאֵל
  choice: Jahaziel
  rationale: Tuwirang transliterasyon ng pangalang pantangi sa anyong madaling makilala sa Filipino.
- source_word: הַשְּׁלִישִׁי
  choice: ang ikatlo
  rationale: Tapat na pinananatili ang ordinal at ang maigsi, eliptikong anyo ng listahan.
- source_word: יְקַמְעָם
  choice: Jekameam
  rationale: Transliterasyong sumusunod sa Masoretikong pagbabaybay at sa nakikilalang anyo ng pangalan.
- source_word: הָרְבִיעִי
  choice: ang ikaapat
  rationale: Pinananatili ang ordinal nang hindi nagdaragdag ng tahasang pandiwa na wala sa Hebreo.
