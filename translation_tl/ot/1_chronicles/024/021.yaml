base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/024/021.yaml
  text: For Rehabiah[a], from the sons of Rehabiah, the chief was Isshiah.
translation:
  language: tl
  text: Tungkol kay Rehabias, sa mga anak ni Rehabias, si Isias ang pinuno.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִ/רְחַבְיָהוּ
  choice: Para kay Rehabias
  rationale: Ang panlaping לְ ay nagpapakilala sa susunod na sangay ng angkan sa talaan. Likas sa Filipino ang “Para kay” bilang panandang paksa o kaugnayan sa ganitong pag-iisa-isa.
- source_word: לִ/בְנֵי רְחַבְיָהוּ
  choice: mula sa mga anak ni Rehabias
  rationale: Ang בְּנֵי ay literal na “mga anak na lalaki/mga anak” at maaari ring tumukoy sa mga inapo. Pinananatili ng “mga anak” ang anyong genealogical, samantalang nililinaw ng “mula sa” na kabilang sa sangay na ito ang pinunong pinangalanan.
- source_word: הָ/רֹאשׁ
  choice: ang pinuno
  rationale: Literal na “ulo” ang רֹאשׁ, ngunit sa kontekstong administratibo at pang-angkan ay tumutukoy ito sa nangungunang kinatawan o pinuno. Ang “pinuno” ay malinaw, marangal, at likas sa modernong Filipino.
- source_word: יִשִּׁיָּה
  choice: Isias
  rationale: Pangalan itong isinasatitik sa anyong pamilyar sa tradisyong Filipino. Hindi ito isinasalin ayon sa kahulugan.
