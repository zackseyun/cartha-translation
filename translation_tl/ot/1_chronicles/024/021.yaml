translation_notes:
  register: Makabago ngunit marangal na Filipino; maikli at pormal upang umangkop sa anyo ng talaang genealogical at administratibo. Ginamit ang mga anyong pangalang Rehabias at Isias na madaling basahin sa Filipino.
