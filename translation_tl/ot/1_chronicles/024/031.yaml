base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/024/031.yaml
  text: These also cast lots alongside their brothers[a], the sons of Aaron, before King David, Zadok, Ahimelech[b], and the heads of the fathers’ houses of the priests and of the Levites—the chief fathers’ houses as well as those of their younger brothers.
translation:
  language: tl
  text: Nagpalabunutan din ang mga ito kasama ng kanilang mga kapatid[a], ang mga anak ni Aaron, sa harap ni Haring David, nina Zadok at Ahimelec, at ng mga pinuno ng mga angkan ng mga pari at mga Levita—ang mga pangunahing angkan ay kapantay ng mga angkan ng kanilang nakababatang mga kapatid.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “katapat ng kanilang mga kapatid, ang mga anak ni Aaron.” Ang salitang Hebreo ay maaaring mangahulugang katapat, kaayon, o kasama.
    reason: lexical_alternative
  - marker: b
    text: 'Sa literal, “ang mga angkan ng pinuno, katapat ng kaniyang nakababatang kapatid.” Malamang na distributibo ang mga anyong isahan: ang bawat pangunahing sangay ng angkan at ang kaugnay nitong nakababatang sangay ay magkapantay sa palabunutan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּפִּילוּ ... גּוֹרָלוֹת
  choice: nagpalabunutan
  rationale: Likas na katumbas sa modernong Tagalog ng Hebreong idyoma para sa pagpapasya sa pamamagitan ng palabunutan.
- source_word: גַם הֵם
  choice: din ang mga ito
  rationale: Tumutukoy sa mga pangkat ng mga Levita na kababanggit lamang at ipinakikitang lumahok din sila sa palabunutan.
- source_word: לְעֻמַּת אֲחֵיהֶם בְּנֵי אַהֲרֹן
  choice: kasama ng kanilang mga kapatid, ang mga anak ni Aaron
  rationale: Ipinahahayag ang magkatulad o magkatabing pakikilahok nang hindi labis na nililimitahan ang malawak na diwa ng לְעֻמַּת; inilalahad sa talababa ang ibang posibleng pagbasa.
- source_word: לִפְנֵי
  choice: sa harap ni
  rationale: Pinananatili ang diwa ng isang pampubliko at opisyal na gawaing isinagawa sa presensiya ng mga pinunong binanggit.
- source_word: רָאשֵׁי הָאָבוֹת
  choice: mga pinuno ng mga angkan
  rationale: Malinaw at likas sa Tagalog para sa mga pinuno ng mga sambahayang ninuno o yunit ng angkan.
- source_word: אָבוֹת הָרֹאשׁ
  choice: mga pangunahing angkan
  rationale: Pinananatili ang institusyonal na pagtukoy sa nakatataas o pangunahing mga sangay ng angkan, sa halip na gawing mga indibidwal lamang ang tinutukoy.
- source_word: לְעֻמַּת אָחִיו הַקָּטָן
  choice: kapantay ng mga angkan ng kanilang nakababatang mga kapatid
  rationale: Ginagawang likas sa Tagalog ang masinsin at isahang anyo ng Hebreo sa pamamagitan ng distributibong maramihan, habang pinananatili ang pagkakapantay sa palabunutan.
