translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “angkan” para sa sambahayang ninuno at “nagpalabunutan” para sa pormal na pamamaraang administratibo. Inilipat ang marker [b] sa hulihang sugnay na aktuwal nitong ipinaliliwanag.
