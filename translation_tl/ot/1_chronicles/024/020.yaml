translation_notes:
  register: Makabagong Filipino na marangal ngunit madaling maunawaan. Pinanatili ang maikli, paulit-ulit, at eliptikong estilo ng talaan, habang ginamit ang mga pantukoy na “si” upang maging likas sa Tagalog.
