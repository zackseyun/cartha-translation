review_pass:
  verdict: revise
  source_fidelity: Ang הַנּוֹתָרִים ay mas tuwirang nangangahulugang “natitira/natitirang” kaysa “iba pang,” na maaaring magpahiwatig ng mga karagdagang anak sa halip na mga natira sa talaan. Napananatili ng iba pang bahagi ang eliptikong ayos ng Hebreo at ang mga pangalang Shubael at Jehdeias.
  naturalness: Likas at angkop sa makabagong Filipino ang paulit-ulit na pormulang “sa mga anak ni …, si …” sa isang talaang pampamilya. Ang “natitirang” ay kapwa mas tumpak at natural sa kontekstong ito.
  terminology: Ang “mga anak ni Levi,” “mga anak ni Amram,” at mga transliterasyong Amram, Shubael, at Jehdeias ay angkop. Ang talababa b sa draft ay hindi dapat magmungkahi na ang “mga anak ni Shubael” mismo ay maaaring mangahulugang “iba pang mga anak ni Levi”; ang alternatibo ay nauukol sa pariralang nasa simula ng talata.
  issues:
  - severity: medium
    issue: “iba pang mga anak ni Levi” para sa הַנּוֹתָרִים
    rationale: Ang salitang Hebreo ay “mga natitira” o “mga nalalabi.” Bagaman puwedeng gamitin ang “iba pang” sa ilang maluwag na salin, hindi nito malinaw na naihahatid ang ideya ng mga natira mula sa naunang pag-uuri.
  - severity: medium
    issue: Hindi tumpak ang saklaw ng talababa b
    rationale: Ang paliwanag nito ay tila iniuugnay ang alternatibo sa “mga anak ni Shubael,” samantalang ang alternatibong “iba pang mga anak ni Levi” ay para sa unang parirala, “ang natitirang mga anak ni Levi.”
  revised_text: 'At para sa natitirang mga anak ni Levi: sa mga anak ni Amram[a], si Shubael; sa mga anak ni Shubael[b], si Jehdeias.'
