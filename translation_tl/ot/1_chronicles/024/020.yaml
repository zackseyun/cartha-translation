  yaml_path: translation/ot/1_chronicles/024/020.yaml
  text: 'And for the remaining sons of Levi: for the sons of Amram[a], Shubael; for the sons of Shubael[b], Jehdeiah.'
translation:
  language: tl
  text: 'At para sa natitirang mga anak ni Levi: sa mga anak ni Amram[a], si Shubael; sa mga anak ni Shubael[b], si Jehdeias.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maikli at di-ganap ang pagkakabuo ng mga parirala sa Hebreo sa talaang ito; malamang na ang mga pangalang binanggit ay kumakatawan sa pinuno o kinatawan ng bawat sangay ng angkan.
    reason: cultural_note
  - marker: b
    text: Ang pariralang “natitirang mga anak ni Levi” sa simula ng talata ay maaari ring isalin na “iba pang mga anak ni Levi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/לִ/בְנֵי לֵוִי הַנּוֹתָרִים
  choice: At para sa iba pang mga anak ni Levi
  rationale: Ang וְ ay nag-uugnay sa naunang talaan, ang לִבְנֵי ay pormula ng pag-uuri sa talaan, at ang הַנּוֹתָרִים ay tumutukoy sa mga natitira o iba pang hindi pa nababanggit.
- source_word: לִ/בְנֵי עַמְרָם
  choice: sa mga anak ni Amram
  rationale: Pinananatili ang maikli at eliptikong pormula ng talaangkanan nang hindi nagdaragdag ng pandiwang wala sa Hebreo.
- source_word: שׁוּבָאֵל
  choice: si Shubael
  rationale: Isinalin bilang pangalang pantangi sa anyong transliterado; ang pantukoy na “si” ay likas sa Tagalog at nililinaw na tao ang tinutukoy.
- source_word: לִ/בְנֵי שׁוּבָאֵל
  choice: sa mga anak ni Shubael
  rationale: Pinananatili ang inuulit na estruktura ng administratibong talaan sa Hebreo.
- source_word: יֶחְדְּיָהוּ
  choice: si Jehdeias
  rationale: Ginamit ang karaniwang anyong Filipino ng pangalang biblikal, na may pantukoy na “si” para sa likas na daloy ng Tagalog.
