  text: 'The brother of Micah: Isshiah; of the sons of Isshiah[a], Zechariah.'
translation:
  language: tl
  text: 'Kapatid ni Mica: si Isias; mula sa mga anak ni Isias[a]: si Zacarias.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Isias ay binabaybay rin bilang Ishiah o Jeshiah sa ilang tradisyon ng Ingles.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲחִי
  choice: Kapatid ni
  rationale: Anyo itong construct ng אָח at nagpapahayag ng ugnayang pampamilya. Ang maikling pariralang “Kapatid ni” ay angkop sa anyong talaan ng talata.
- source_word: מִיכָה
  choice: Mica
  rationale: Ginamit ang nakaugaliang anyong Filipino ng pangalang Hebreo, sa halip na isalin ang kahulugan nito.
- source_word: יִשִּׁיָּה
  choice: Isias
  rationale: Ginamit ang anyong pangalang madaling basahin at nakaugaliang gamitin sa Filipino; pinanatili sa talababa ang ibang anyo ng transliterasyon.
- source_word: לִבְנֵי
  choice: sa mga anak ni
  rationale: Sa kontekstong talaangkanan at pangkat, ipinahihiwatig ng לְ ang kaugnayan sa isang angkan o pangkat. Likas sa Filipino ang “sa mga anak ni” at hindi nito ipinapalagay na direksiyon ang tinutukoy.
- source_word: זְכַרְיָהוּ
  choice: Zacarias
  rationale: Ito ang nakaugaliang anyong Filipino ng pangalang Hebreo זְכַרְיָהוּ.
