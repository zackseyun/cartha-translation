  register: Maikli at may anyong talaan ang salin, gaya ng Hebreong pinagmulan. Ginamit ang tutuldok at tuldok-kuwit upang maging malinaw ang magkakaugnay na pangalan nang hindi ginagawang ganap na mga pangungusap ang mga pariralang genealogical.
