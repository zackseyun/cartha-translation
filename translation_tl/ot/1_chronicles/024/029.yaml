lexical_decisions:
- source_word: לְקִישׁ
  choice: Tungkol kay Kis
  rationale: Ang panlaping לְ ay gumaganap dito bilang pananda ng paksa o heading sa talaan; natural itong naipapahayag sa Filipino bilang “Tungkol kay Kis.”
- source_word: בְּנֵי
  choice: sa mga anak ni
  rationale: Literal itong “mga anak ni.” Ginamit ang “sa” upang likas na iugnay ang nag-iisang pangalang kasunod bilang kabilang sa mga anak ni Kis, nang hindi ginagawang tahasang nag-iisang anak siya.
- source_word: קִישׁ
  choice: Kis
  rationale: Pangngalang pantangi na isinalin ayon sa karaniwang anyong Filipino.
- source_word: יְרַחְמְאֵל
  choice: Jerameel
  rationale: Pangngalang pantangi na tinumbasan sa anyong madaling basahin at bigkasin sa Filipino.
