  yaml_path: translation/ot/1_chronicles/024/011.yaml
  text: to Jeshua the ninth, to Shecaniah the tenth.
translation:
  language: tl
  text: ang ikasiyam ay kay Jesua, at ang ikasampu ay kay Secanias.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְיֵשׁוּעַ
  choice: kay Jesua
  rationale: Ang לְ ay nagpapahiwatig kung kanino napunta ang takdang bahagi sa pagkakasunod-sunod; likas sa Filipino ang “kay.” Isinatinig ang pangalang יֵשׁוּעַ bilang “Jesua.”
- source_word: הַתְּשִׁעִי
  choice: ang ikasiyam
  rationale: Ang ordinal na may pantukoy ay tumutukoy sa ikasiyam na bahagi o puwesto sa talaan; pinananatili ng “ang ikasiyam” ang maikli at sunod-sunod na anyo ng Hebreo.
- source_word: לִשְׁכַנְיָהוּ
  choice: kay Secanias
  rationale: Gaya sa unang parirala, ipinahihiwatig ng לְ ang pinaglaanan ng bahagi. Ang “Secanias” ay isang malinaw at likas na anyong Filipino ng pangalang שְׁכַנְיָהוּ.
- source_word: הָעֲשִׂרִי
  choice: ang ikasampu
  rationale: Ang ordinal na may pantukoy ay nagsasaad ng ikasampung bahagi o puwesto sa pagkakasunod-sunod.
theological_decisions: []
translation_notes:
  register: Maikli at marangal ang pananalita, ayon sa anyo ng talaan sa konteksto. Ginamit ang “ay kay” upang maging malinaw sa karaniwang mambabasa na ang bawat bilang ay iniukol sa taong binanggit, nang hindi dinaragdagan ang Hebreong teksto ng salitang “palabunutan” o “pangkat.”
