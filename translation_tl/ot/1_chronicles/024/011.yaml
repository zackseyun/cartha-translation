  source_fidelity: 'Tumpak na naipapahayag ng salin ang dalawang pagkakatalaga sa sunod na bilang: ang ikasiyam para kay Jesua at ang ikasampu para kay Secanias. Bagaman binaligtad nito ang ayos ng Hebreo (bilang bago pangalan sa halip na pangalan bago bilang), walang nababago sa kahulugan o sa antas ng katiyakan.'
  naturalness: Likas at malinaw sa modernong Filipino ang hulmang “ang ikasiyam ay kay …, at ang ikasampu ay kay ….” Maikli ito at angkop sa estilong talaan ng talata.
  terminology: Ang “kay” ay wastong paraan upang ihayag ang pagkakatalaga ng lot o puwesto nang hindi nagdaragdag ng salitang wala sa teksto. Ang mga ordinal na “ikasiyam” at “ikasampu” ay wasto. Katanggap-tanggap ang mga anyong pangalang “Jesua” at “Secanias” para sa Filipino.
