  yaml_path: translation/ot/1_chronicles/011/039.yaml
  text: Zelek the Ammonite[a], Naharai the Beerothite, the armor-bearer of Joab son of Zeruiah;
translation:
  language: tl
  text: Si Zelek na Ammonita, si Naharai na taga-Beerot, ang tagapagdala ng mga sandata ni Joab na anak ni Zeruya;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: צֶלֶק
  choice: Zelek
  rationale: Pangalan ng tao; isinalin sa karaniwang anyong transliterado sa Filipino.
- source_word: הָעַמּוֹנִי
  choice: na Ammonita
  rationale: Ang gentiliko na may pantukoy ay tumutukoy sa lahi o pinagmulan ni Zelek; natural sa modernong Filipino ang hulaping -ita.
- source_word: נַחְרַי
  choice: Naharai
  rationale: Pinananatili ang buong transliterasyon ng pangalang Hebreo.
- source_word: הַבֵּרֹתִי
  choice: na Beerotita
  rationale: Gentilikong nagmula sa Beerot; pinananatili ang malinaw na kaugnayan sa pangalan ng lugar.
- source_word: נֹשֵׂא כְּלֵי
  choice: tagapagdala ng mga sandata
  rationale: Literal at malinaw na paglalarawan sa tungkuling ipinahihiwatig ng participle at ng pangngalang כְּלֵי; iniiwasang paliitin ito sa isang tiyak na uri lamang ng kagamitang pandigma.
- source_word: יוֹאָב
  choice: Joab
  rationale: Karaniwang transliterasyon ng pangalan sa Filipino.
- source_word: בֶּן צְרוּיָה
  choice: na anak ni Zeruiya
  rationale: Pinananatili ang pagkakakilanlan kay Joab sa pamamagitan ng kanyang ina, ayon sa konstruksiyong Hebreo.
