translation_notes:
  register: Natural, marangal, at madaling maunawaang Filipino. Ginamit ang tuwirang ‘tagapagdala ng mga sandata’ upang manatiling malapit sa Hebreo habang malinaw sa makabagong mambabasa. Pinanatili ang semicolon dahil bahagi ito ng nagpapatuloy na talaan.
