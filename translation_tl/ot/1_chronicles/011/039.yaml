    issue: Hindi ganap na malinaw ang pagkakabit ng “na tagapagdala ng mga sandata ni Joab.”
    rationale: Bagaman malamang na tumutukoy ito kay Naharai, ang magkakasunod na pariralang may “na” sa isang talaan ay maaaring magpahina sa apositibong ugnayan. Ang “ang tagapagdala...” ay tahasang ikinakabit ang katungkulan kay Naharai, gaya ng Hebreo.
  - severity: low
    issue: Ang “Zeruiya” ay hindi ang pinakamalapit o pinakakaraniwang anyong Filipino ng pangalan.
    rationale: Ang צְרוּיָה ay mas angkop na ilipat bilang “Zeruya.”
