base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/014.yaml
  text: And they took their stand in the middle of the plot and delivered it[a], and they struck down the Philistines, and Yahweh saved by a great victory.
translation:
  language: tl
  text: Tumindig sila sa gitna ng bahaging iyon ng bukid at iniligtas nila ito; pinabagsak nila ang mga Filisteo, at nagkaloob si Yahweh ng malaking tagumpay.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “nagdulot si Yahweh ng malaking pagliligtas”; o, “nagligtas si Yahweh sa pamamagitan ng malaking tagumpay.”
    reason: Ipinakikita ang saklaw ng kahulugan ng magkaugat na pandiwa at pangngalang Hebreo, na maaaring ipahayag bilang pagliligtas o tagumpay.
lexical_decisions:
- source_word: וַיִּתְיַצְּבוּ
  choice: Tumindig sila
  rationale: Ipinahihiwatig ng hitpael ng יצב ang sadyang pagpuwesto at paninindigan sa labanan. Likas sa Filipino ang “tumindig” at napananatili nito ang matatag na diwa.
- source_word: בְתוֹךְ הַחֶלְקָה
  choice: sa gitna ng bahagi ng bukid
  rationale: Ang תוך ay “gitna,” at ang חלקה ay isang takdang bahagi o parsela ng lupang sinasaka. Ang pariralang ito ay malinaw sa karaniwang mambabasa at hindi ginagawang buong bukid ang tinutukoy.
- source_word: וַיַּצִּילוּהָ
  choice: iniligtas iyon
  rationale: Ang נצל ay nangangahulugang iligtas o sagipin. Ang hulaping pambabae ay tumutukoy sa bahagi ng bukid; pinananatili ng “iyon” ang tahasang layon nang hindi ito itinuturing na tao.
- source_word: וַיַּכּוּ אֶת־פְּלִשְׁתִּים
  choice: Pinabagsak nila ang mga Filisteo
  rationale: Sa konteksto ng labanan, ang נכה ay pagpaslang o matinding paggapi sa pamamagitan ng paghampas. Ang “pinabagsak” ay naghahatid ng lakas ng pandiwa nang hindi nagdaragdag ng detalyeng wala sa teksto.
- source_word: וַיּוֹשַׁע יְהוָה תְּשׁוּעָה גְדוֹלָה
  choice: nagkaloob si Yahweh ng malaking tagumpay
  rationale: Ang pandiwang ישׁע at pangngalang תשועה ay bumubuo ng magkaugat na pahayag na maaaring tumukoy sa pagliligtas, kaligtasan, o tagumpay. Sa kontekstong militar, natural sa Filipino ang “nagkaloob … ng malaking tagumpay,” habang itinatala sa talababa ang ibang posibleng pagpapahayag.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin ang tetragramang YHWH bilang personal na pangalang “Yahweh,” hindi bilang pamagat.
theological_decisions:
- issue: Pagpapahayag sa magkaugat na וַיּוֹשַׁע ... תְּשׁוּעָה
  choice: nagkaloob si Yahweh ng malaking tagumpay
  alternative: nagdulot si Yahweh ng malaking pagliligtas; nagligtas si Yahweh sa pamamagitan ng malaking tagumpay
  rationale: Hindi tahasang sinasabi sa Hebreo kung sino ang layon ng “nagligtas,” at maaaring mangahulugan ang תשועה ng pagliligtas o tagumpay. Iniiwasang idagdag ang “sila” at pinananatili sa talababa ang leksikal na saklaw.
- issue: Pagbanggit sa banal na pangalan יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo, kaya transliterasyon ang ginamit sa halip na palitan ito ng isang titulo.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “bahagi ng bukid” sa halip na teknikal na “parsela,” at pinanatili ang maikli at masiglang pagkakasunod-sunod ng mga kilos sa salaysay.
