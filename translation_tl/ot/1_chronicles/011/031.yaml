  text: Ittai son of Ribai[a], from Gibeah of the sons of Benjamin; Benaiah the Pirathonite;
translation:
  language: tl
  text: Si Itai na anak ni Ribai, mula sa Gibea ng mga anak ni Benjamin[a]; si Benaya na Piratonita;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “mga anak ni Benjamin,” ibig sabihin, mga kabilang sa lipi ni Benjamin.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִיתַי
  choice: Itai
  rationale: Pangalan ng tao; tuwirang transliterasyon sa baybay na natural sa Filipino.
- source_word: בֶּן רִיבַי
  choice: anak ni Ribai
  rationale: Ang construct na בֶּן na sinusundan ng pangalan ay nagpapahayag ng ugnayang ama at anak; natural sa Filipino ang “anak ni.”
- source_word: מִ/גִּבְעַת
  choice: mula sa Gibea
  rationale: Ang מִן ay nagpapahiwatig ng pinagmulan, at ang גִּבְעַת ay pangalan ng lugar sa kontekstong ito.
- source_word: בְּנֵי בִנְיָמִן
  choice: ng mga anak ni Benjamin
  rationale: Pinananatili ang kongkretong Hebreong idyoma, na tumutukoy rito sa mga kabilang sa lipi ni Benjamin.
- source_word: בְּנָיָה
  choice: Benaya
  rationale: Pangalan ng tao; transliterasyon mula sa Hebreo na angkop sa bigkas at baybay ng Filipino.
- source_word: הַ/פִּרְעָתֹנִי
  choice: na Piratonita
  rationale: Ang gentilic ay tumutukoy sa taong mula sa Piraton o kaugnay nito; ang hulaping “-ita” ay malinaw at karaniwan sa Filipino para sa taga-isang lugar.
