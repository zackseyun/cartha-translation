translation:
  language: tl
  text: Si Ira na anak ni Ikkesh, na taga-Tekoa[a]; si Abiezer na taga-Anatot[b];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo, ginamit ang anyong gentiliko: “ang Tekoita,” ibig sabihin, isang taong mula sa Tekoa.'
    reason: lexical_alternative
  - marker: b
    text: 'Sa Hebreo, ginamit ang anyong gentiliko: “ang Anatotita,” ibig sabihin, isang taong mula sa Anatot.'
