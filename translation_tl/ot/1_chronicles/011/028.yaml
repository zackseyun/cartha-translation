lexical_decisions:
- source_word: עִירָא
  choice: Ira
  rationale: Pangalang pantangi; isinalin sa karaniwang anyong transliterado sa Filipino.
- source_word: בֶן
  choice: anak ni
  rationale: Likas na paraang Filipino upang ipahayag ang ugnayang anak at ama sa isang talaan ng mga pangalan.
- source_word: עִקֵּשׁ
  choice: Ikkesh
  rationale: Pangalang pantangi; pinanatili ang dobleng k upang katawanin ang madiing katinig sa Hebreo at malinaw na maiba sa ibang pangalan.
- source_word: הַתְּקוֹעִי
  choice: taga-Tekoa
  rationale: Ang anyong gentiliko sa Hebreo ay tumutukoy sa isang taong mula sa Tekoa; ang “taga-Tekoa” ang natural at maikli sa modernong Filipino.
- source_word: אֲבִיעֶזֶר
  choice: Abiezer
  rationale: Pangalang pantangi; transliterasyon na malinaw at pamilyar sa tradisyong biblikal sa Filipino.
- source_word: הָעֲנְּתוֹתִי
  choice: taga-Anatot
  rationale: Ang anyong gentiliko ay tumutukoy sa isang taong mula sa Anatot; natural itong ipinapahayag sa Filipino sa pamamagitan ng “taga-.”
