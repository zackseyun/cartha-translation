lexical_decisions:
- source_word: בְּנֵי
  choice: ang mga anak ni
  rationale: Pangmaramihang construct ng בּן; pinananatili ang tuwirang kahulugang “mga anak ni” at hindi itinutugma sa naiibang tala sa 2 Samuel 23:32.
- source_word: הָשֵׁם
  choice: Hashem
  rationale: Pangalang pantangi; isinalin sa karaniwang transliterasyong madaling basahin sa Filipino.
- source_word: הַגִּזוֹנִי
  choice: na Gizonita
  rationale: Gentiliko o katawagang nagsasaad ng angkan o pinagmulan. Natural sa Filipino ang hulaping “-ita”; ang “na” ay maayos na nag-uugnay nito kay Hashem.
- source_word: יוֹנָתָן
  choice: Jonatan
  rationale: Tuwirang transliterasyon ng pangalang Hebreo ayon sa karaniwang baybay sa Filipino.
- source_word: בֶּן
  choice: anak ni
  rationale: Sa talaan ng mga pangalan, natural na katumbas sa Filipino ng ugnayang pampamilya na ipinapahayag ng construct singular.
- source_word: שָׁגֵה
  choice: Shage
  rationale: Malapit na transliterasyon ng pangalang Hebreo, na pinananatiling pangalan sa halip na isalin.
- source_word: הַהֲרָרִי
  choice: na Hararita
  rationale: Gentiliko o katawagang maaaring tumukoy sa angkan o pinagmulan; ginagamit ang natural na anyong Filipino na “Hararita” nang hindi nilulutas ang eksaktong uri ng ugnayan.
