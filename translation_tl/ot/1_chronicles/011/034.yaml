  text: ang mga anak ni Hashem na Gizonita[a], si Jonatan, anak ni Shage na Hararita;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ganito ang mababasa sa tekstong Hebreo: “ang mga anak ni Hashem na Gizonita.” Iba ang pagkakasunod-sunod ng mga pangalan sa katumbas na tala sa 2 Samuel 23:32, na madalas sundan sa ilang salin o rekonstruksiyon.'
