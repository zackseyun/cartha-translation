  text: וְ/אֵ֛לֶּה מִסְפַּ֥ר הַ/גִּבֹּרִ֖ים אֲשֶׁ֣ר לְ/דָוִ֑יד יָשָׁבְעָ֣ם בֶּן חַכְמוֹנִ֗י רֹ֚אשׁ ה/שלושים הֽוּא עוֹרֵ֧ר אֶת חֲנִית֛/וֹ עַל שְׁלֹשׁ מֵא֥וֹת חָלָ֖ל בְּ/פַ֥עַם אֶחָֽת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/011.yaml
  text: 'And these are the number of David’s mighty men: Jashobeam son of Hachmoni[a], the chief of the Thirty; he wielded his spear against three hundred slain in one encounter.'
translation:
  language: tl
  text: 'Ito ang talaan ng mga magigiting na mandirigma ni David: si Jasobeam na anak ni Hacmoni, ang pinuno ng Tatlumpu. Iwinasiwas niya ang kanyang sibat[a] laban sa tatlong daan na napatay niya sa iisang pagkakataon.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “itinaas” o “iniunday niya ang kanyang sibat.” Maikli at masinsin ang idyomang Hebreo, kaya iba-iba ang paraan ng paglalarawan sa kilos ng sibat at sa pagkakapatay sa tatlong daan sa iisang pagkakataon.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִסְפַּר
  choice: talaan
  rationale: Pangunahing tumutukoy ang salita sa bilang o pagbilang, ngunit dito ay ipinakikilala nito ang isang nakatalang pangkat. Mas natural sa modernong Tagalog ang “talaan” kaysa “bilang” sa ganitong pambungad.
- source_word: הַגִּבֹּרִים
  choice: magigiting na tauhan
  rationale: Saklaw ng גִּבּוֹר ang makapangyarihan, magiting na mandirigma o bayani. Pinananatili ng “magigiting na tauhan” ang tradisyonal na diwa nang hindi nililimitahan ang katawagan sa simpleng “mga sundalo.”
- source_word: אֲשֶׁר לְדָוִיד
  choice: ni David
  rationale: Ipinahihiwatig ng לְ ang kaugnayan o pag-aari; natural itong ipinapahayag sa Tagalog bilang “mga tauhan ni David.”
- source_word: יָשָׁבְעָם בֶּן חַכְמוֹנִי
  choice: si Jasobeam na anak ni Hacmoni
  rationale: Isinalin sa karaniwang anyong Filipino ang mga pangalang pantangi at tahasang pinanatili ang ugnayang ama-anak.
- source_word: רֹאשׁ הַשלושים
  choice: ang pinuno ng Tatlumpu
  rationale: Sa konteksto ng ranggo, ang רֹאשׁ ay natural na “pinuno.” Ginawang pantanging tawag ang “Tatlumpu” sapagkat waring pangalan o katawagan ito sa piling pangkat.
- source_word: עוֹרֵר אֶת חֲנִיתוֹ
  choice: Iwinasiwas niya ang kanyang sibat
  rationale: Literal na may diwang “pukawin” o “paalabin” ang pandiwa, ngunit kapag sibat ang layon, inilalarawan nito ang aktibong pagtaas o paggamit ng sandata. Ang “iwinasiwas” ay natural na pariralang pandigma habang kinikilala sa talababa ang iba pang posibleng paglalarawan.
- source_word: עַל שְׁלֹשׁ מֵאוֹת
  choice: laban sa tatlong daan
  rationale: Sa konteksto ng sandata at labanan, ipinahihiwatig ng עַל ang kilos na nakatuon laban sa mga kalaban.
- source_word: חָלָל
  choice: napatay
  rationale: Tumutukoy ang חָלָל sa mga napatay o nabulagta, madalas sa pagkakasugat sa labanan. Malinaw at likas sa Tagalog ang “napatay.”
- source_word: בְּפַעַם אֶחָת
  choice: sa iisang labanan
  rationale: Literal itong “sa isang pagkakataon.” Ipinahahayag ng “sa iisang labanan” ang isang pangyayaring pandigma nang hindi nagpapahiwatig na napatay ang lahat sa iisang hampas.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “kanyang” bilang likas na anyo sa kasalukuyang gamit. Pinanatili ang “Tatlumpu” bilang katawagan sa piling pangkat at iniwasang dagdagan ang teksto ng paliwanag na wala sa Hebreo.
