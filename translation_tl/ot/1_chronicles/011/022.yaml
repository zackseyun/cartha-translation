  text: בְּנָיָ֨ה בֶן יְהוֹיָדָ֧ע בֶּן אִֽישׁ חַ֛יִל רַב פְּעָלִ֖ים מִֽן קַבְצְאֵ֑ל ה֣וּא הִכָּ֗ה אֵ֣ת שְׁנֵ֤י אֲרִיאֵל֙ מוֹאָ֔ב וְ֠/הוּא יָרַ֞ד וְ/הִכָּ֧ה אֶֽת הָ/אֲרִ֛י בְּ/ת֥וֹךְ הַ/בּ֖וֹר בְּ/י֥וֹם הַ/שָּֽׁלֶג־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/022.yaml
  text: Benaiah son of Jehoiada[a], son of a mighty man, a man of many deeds, from Kabzeel—he struck down the two heroes of Moab. He also went down and struck down the lion in the midst of a pit on a snowy day.
translation:
  language: tl
  text: Si Benaias na anak ni Joiada, na anak ng isang magiting na lalaking maraming dakilang gawa, mula sa Kabzeel—pinabagsak niya ang dalawang bayani ng Moab.[a] Bumaba rin siya at pinabagsak ang leon sa loob ng hukay noong araw na may niyebe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hindi tiyak ang Hebreong אֲרִיאֵל מוֹאָב. Maaari itong mangahulugang “ang dalawang anak ni Ariel ng Moab,” “ang dalawang Ariel ng Moab,” o “ang dalawang bayaning tulad ng leon ng Moab.”
    reason: alternative_reading
lexical_decisions:
- source_word: בְּנָיָה בֶן יְהוֹיָדָע
  choice: Si Benaias na anak ni Joiada
  rationale: Ginamit ang nakaugaliang anyong Tagalog ng mga pangalan at tuwirang isinalin ang ugnayang ama at anak.
- source_word: בֶּן אִישׁ חַיִל רַב פְּעָלִים
  choice: na anak ng isang magiting na lalaki at maraming nagawang kabayanihan
  rationale: Ipinapanatili ang pinakanatural na sintaktikong pagbasa na ang paglalarawan ay tumutukoy sa ama ni Joiada, habang inilalahad ang חַיִל bilang kagitingan at ang רַב פְּעָלִים bilang maraming pambihirang gawa.
- source_word: מִן קַבְצְאֵל
  choice: mula sa Kabzeel
  rationale: Tuwirang ipinahahayag ng מִן ang pinagmulan o bayang pinanggalingan.
- source_word: הִכָּה
  choice: pinabagsak / pinatay
  rationale: Malawak ang saklaw ng pandiwang נכה. Sa unang pangyayari, pinanatili ng “pinabagsak” ang hindi ganap na tiyak na pahiwatig ng pagpatay; sa malinaw na pakikipaglaban sa leon, natural ang “pinatay.”
- source_word: שְׁנֵי אֲרִיאֵל מוֹאָב
  choice: ang dalawang bayani ng Moab
  rationale: Malamang na katawagan sa dalawang kilalang mandirigma ang אֲרִיאֵל dito. Hindi tiyak ang anyo at kahulugan ng Hebreo, kaya inilalahad sa talababa ang mahahalagang alternatibo.
- source_word: יָרַד
  choice: bumaba
  rationale: Pinananatili ang payak na kilos ng pagbaba, malamang patungo sa loob ng hukay.
- source_word: בְּתוֹךְ הַבּוֹר
  choice: sa isang hukay … na naroon
  rationale: Natural na Filipino ito para sa lokasyon ng leon sa loob ng hukay nang hindi ginagawang balon o imbakan ng tubig ang hindi tiyak na בּוֹר.
- source_word: בְּיוֹם הַשָּׁלֶג
  choice: noong isang araw na may niyebe
  rationale: Likas sa modernong Filipino at hindi ipinapalagay kung kasalukuyang bumabagsak ang niyebe o nasa lupa na ito.
