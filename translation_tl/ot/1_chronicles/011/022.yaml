revisions:
- from: Si Benaias na anak ni Joiada, na anak ng isang magiting na lalaki at maraming nagawang kabayanihan, ay mula sa Kabzeel. Pinabagsak niya ang dalawang bayani ng Moab.[a] Bumaba rin siya sa isang hukay at pinatay ang leon na naroon, noong isang araw na may niyebe.
  to: Si Benaias na anak ni Joiada, na anak ng isang magiting na lalaking maraming dakilang gawa, mula sa Kabzeel—pinabagsak niya ang dalawang bayani ng Moab.[a] Bumaba rin siya at pinabagsak ang leon sa loob ng hukay noong araw na may niyebe.
  rationale: Inayos ang sintaks ng paglalarawan kay Benaias at sa kaniyang ama, ginawang mas maingat ang katumbas ng הִכָּה sa parehong pangyayari, at tahasang isinalin ang lokasyong “sa loob ng hukay.” Hindi binago ang pangunahing pagbasa na “dalawang bayani ng Moab,” ngunit inayos ang talababa upang malinaw na maipakita ang mga posibleng pagbasa nang hindi ipinipilit ang alinman.
