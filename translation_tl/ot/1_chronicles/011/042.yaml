translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Rubenita” bilang likas na katawagan sa kasapi ng lipi ni Ruben at “tauhan” upang maipahayag ang ipinahihiwatig na pangngalan sa kontekstong militar.
