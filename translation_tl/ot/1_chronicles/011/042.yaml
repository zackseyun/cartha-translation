  text: Adina son of Shiza the Reubenite[a], a chief of the Reubenites, and with him were thirty.
translation:
  language: tl
  text: Si Adina, anak ni Shiza, isang Rubenita, ay isang pinuno ng mga Rubenita; kasama niya ang tatlumpung tauhan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “at nasa ibabaw niya ang tatlumpu.” Maaaring literal na basahin ang pang-ukol sa Hebreo, ngunit sa talaang militar na ito, malamang na nangangahulugan itong may tatlumpung tauhang nakatalaga sa kaniya.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲדִינָא
  choice: Adina
  rationale: Pangalang pantangi; tinumbasan sa karaniwang transliterasyong Filipino.
- source_word: בֶן
  choice: anak ni
  rationale: Sa talaan ng mga mandirigma, karaniwang tumutukoy ito sa tuwirang kaugnayan ng ama at anak.
- source_word: שִׁיזָא
  choice: Shiza
  rationale: Pangalang pantangi; pinanatili sa transliterasyon.
- source_word: הָרְאוּבֵנִי
  choice: na Rubenita
  rationale: Ang anyong gentiliko ay nagpapahayag ng pagkakabilang sa lipi ni Ruben; natural at maikli sa Filipino ang “Rubenita.”
- source_word: רֹאשׁ
  choice: isang pinuno
  rationale: Sa konteksto ng talaang militar, tumutukoy ito sa katayuan sa pamumuno, hindi sa literal na “ulo.”
- source_word: לָרְאוּבֵנִי
  choice: ng mga Rubenita
  rationale: Ang ל ay nagpapakita rito ng pangkat na pinamumunuan o saklaw ng pamumuno.
- source_word: וְעָלָיו
  choice: kasama niya
  rationale: Bagaman literal na maaaring tumukoy sa “nasa ibabaw niya,” sa talaang militar ay malamang na nagpapahiwatig ito ng mga tauhang nakatalaga o nakaugnay sa kaniya; pinanatili sa talababa ang literal na posibilidad.
- source_word: שְׁלוֹשִׁים
  choice: tatlumpung tauhan
  rationale: Tatlumpu ang tahasang bilang; idinagdag ang “tauhan” bilang ipinahihiwatig na pangngalan sa kontekstong militar.
