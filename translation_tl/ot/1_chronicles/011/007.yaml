lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: Nanirahan
  rationale: Sa salaysay na may tinutukoy na lugar, ang ישב ay nangangahulugang manirahan o tumira, hindi lamang umupo. Ang “nanirahan” ay likas at marangal sa modernong Filipino.
- source_word: בַּמְצָד
  choice: sa muog
  rationale: Ang מְצָד ay isang pinatibay at depensibong lugar. Maikli at tuwirang ipinahahayag ng “muog” ang kahulugang ito; inilalahad sa talababa ang alternatibong “kuta.”
- source_word: עַל כֵּן
  choice: kaya
  rationale: Ipinahahayag ng parirala ang bunga o kinahinatnan ng naunang pangyayari. Ang “kaya” ay malinaw at natural sa modernong Filipino.
- source_word: קָרְאוּ לוֹ
  choice: tinawag nila itong
  rationale: Pinananatili nito ang aktibong pandiwang maramihan sa Hebreo at natural na inilalarawan ang pagbibigay ng tawag sa lugar.
- source_word: עִיר דָּוִיד
  choice: Lungsod ni David
  rationale: Itinuturing itong kinikilalang pantanging pangalan ng lugar, kaya ginamitan ng malaking titik.
