  yaml_path: translation/ot/1_chronicles/011/007.yaml
  text: David lived in the stronghold[a]; therefore they called it the City of David.
translation:
  language: tl
  text: Nanirahan si David sa muog[a]; kaya tinawag nila itong Lungsod ni David.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kuta.” Ang salitang Hebreo ay tumutukoy sa isang pinatibay na tanggulan.
