  text: וַ֠/יָּבֹאוּ כָּל זִקְנֵ֨י יִשְׂרָאֵ֤ל אֶל הַ/מֶּ֨לֶךְ֙ חֶבְר֔וֹנָ/ה וַ/יִּכְרֹת֩ לָ/הֶ֨ם דָּוִ֥יד בְּרִ֛ית בְּ/חֶבְר֖וֹן לִ/פְנֵ֣י יְהוָ֑ה וַ/יִּמְשְׁח֨וּ אֶת דָּוִ֤יד לְ/מֶ֨לֶךְ֙ עַל יִשְׂרָאֵ֔ל כִּ/דְבַ֥ר יְהוָ֖ה בְּ/יַד שְׁמוּאֵֽל־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/003.yaml
  text: So all the elders of Israel came to the king at Hebron[a], and David made a covenant with them at Hebron before Yahweh. Then they anointed David king over Israel, according to the word of Yahweh by Samuel.
translation:
  language: tl
  text: Kaya dumating ang lahat ng nakatatanda ng Israel sa hari sa Hebron. Nakipagtipan si David sa kanila sa Hebron sa harap ni Yahweh. Pagkatapos, pinahiran nila si David bilang hari ng Israel, ayon sa sinabi ni Yahweh sa pamamagitan ni Samuel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal na Hebreo, “sa kamay ni Samuel,” isang idyomang nangangahulugang “sa pamamagitan ni Samuel.”
    reason: lexical_alternative
lexical_decisions:
- source_word: זִקְנֵי
  choice: matatandang pinuno
  rationale: Ipinahahayag nito na ang tinutukoy ay kinikilalang mga kinatawan at pinuno ng Israel, hindi lamang matatanda sa edad.
- source_word: הַמֶּלֶךְ
  choice: ang hari
  rationale: Pinananatili ang tiyak na titulong nasa Hebreo; kinikilala si David sa kasunod na sugnay.
- source_word: חֶבְרוֹנָה / בְּחֶבְרוֹן
  choice: sa Hebron / Doon
  rationale: Ang unang anyo ay nagsasaad ng pagpunta sa Hebron, samantalang ang ikalawa ay tumutukoy sa lugar ng pakikipagtipan. Ginamit ang “Doon” sa ikalawang pangungusap upang maiwasan ang mabigat na pag-uulit nang hindi nawawala ang lokasyon.
- source_word: וַיִּכְרֹת ... בְּרִית
  choice: nakipagtipan
  rationale: Likas na salin sa Filipino ng idyomang literal na “pumutol ng tipan,” at pinananatili ang ugnayang tipan sa pagitan ni David at ng mga pinuno.
- source_word: לִפְנֵי יְהוָה
  choice: sa harap ni Yahweh
  rationale: Malapit sa anyo ng Hebreo at ipinahihiwatig ang presensiya at pagsaksi ni Yahweh sa tipan nang hindi ito labis na ipinapaliwanag.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang personal na pangalan ng Diyos na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: וַיִּמְשְׁחוּ
  choice: pinahiran nila
  rationale: Pinananatili ang kongkretong gawa ng pagpapahid na kaugnay ng pagtatalaga sa hari.
- source_word: לְמֶלֶךְ עַל יִשְׂרָאֵל
  choice: bilang hari ng Israel
  rationale: Natural na Filipino para sa pagkakatalaga kay David upang mamahala sa Israel.
- source_word: כִּדְבַר יְהוָה
  choice: ayon sa sinabi ni Yahweh
  rationale: Natural na ipinahahayag ang diwa ng “ayon sa salita ni Yahweh” bilang naunang pahayag ng Diyos, nang hindi ito nililimitahan sa kahulugang “pangako.”
- source_word: בְּיַד שְׁמוּאֵל
  choice: sa pamamagitan ni Samuel
  rationale: Ipinahahayag ang Hebreong idyoma ng pamamagitan o ahensiya sa malinaw at natural na Filipino.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehovah
  rationale: Direktang pangalan ang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang personal at pangtipang pangalan sa halip na palitan ito ng titulo.
- issue: Papel ni Samuel sa paghahayag
  choice: sa pamamagitan ni Samuel
  alternative: sa kamay ni Samuel
  rationale: Ang literal na “sa kamay ni Samuel” ay isang Hebreong idyoma para sa pamamagitan o ahensiya. Hindi nito sinasabing kay Samuel nagmula ang salita; si Yahweh ang nagsalita at si Samuel ang tagapamagitan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “matatandang pinuno” upang malinaw na tumukoy sa opisyal na mga kinatawan ng Israel. Inilipat ang talababa sa pariralang tungkol kay Samuel, na siyang aktuwal na tinutukoy nito sa Hebreo.
