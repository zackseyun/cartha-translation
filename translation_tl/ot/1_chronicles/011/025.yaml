    issue: Hindi malinaw ang tinutukoy ng “kaniyang sariling bantay.”
    rationale: Sa Tagalog, maaari itong tumukoy sa sariling bantay ng taong itinalaga. Sa Hebreo, ang hulapi sa עַל מִשְׁמַעְתּוֹ ay pinaka-natural na tumutukoy kay David, ang pinakahuling at pangunahing antecedent. Ang “sariling” ay dagdag ding diin na wala sa teksto.
