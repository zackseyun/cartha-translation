translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit bilang mga titulo ang “Tatlumpu” at “Tatlo.” Ang pangunahing salin ay nagpapanatili sa paghahambing ng mga ranggo, samantalang ang tunay na ambiguwidad ng מִן at מִשְׁמַעַת ay inilalahad sa mga talababa.
