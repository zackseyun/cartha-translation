  yaml_path: translation/ot/1_chronicles/011/025.yaml
  text: Among the Thirty[a], he was indeed honored, but he did not attain to the Three[b]; and David appointed him over his bodyguard.
translation:
  language: tl
  text: Tunay na higit siyang iginagalang kaysa sa Tatlumpu[a], ngunit hindi niya naabot ang antas ng Tatlo. Itinalaga siya ni David na mamahala sa bantay ni David[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “Kabilang sa Tatlumpu, tunay siyang iginagalang.” Maaaring unawain ang Hebreong pang-ukol bilang paghahambing o bilang pagtukoy sa pagiging kabilang sa pangkat.
    reason: lexical_alternative
  - marker: b
    text: 'O “pangkat ng bantay ni David” o “mga nasa ilalim ng utos ni David.” Malawak ang maaaring saklaw ng salitang Hebreo: isang yunit ng bantay, isang pangkat na nasa ilalim ng pamamahala, o isang ipinagkatiwalang tungkulin.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִן הַשְּׁלוֹשִׁים
  choice: kaysa sa Tatlumpu
  rationale: 'Ang מִן bago ang pangalan ng pangkat ay malamang na paghahambing dito: mas mataas ang kaniyang karangalan kaysa sa mga kabilang sa Tatlumpu. Pinanatili ang “Tatlumpu” bilang titulo ng kilalang pangkat ng mga mandirigma.'
- source_word: הִנּוֹ
  choice: Tunay na
  rationale: Nagbibigay ang partikula ng mariing diin; ang “Tunay na” ay likas at marangal sa modernong Tagalog kaysa sa literal na “narito.”
- source_word: נִכְבָּד
  choice: iginagalang
  rationale: Ang Niphal ng כבד ay tumutukoy sa pagkakaroon ng bigat, dangal, o mataas na pagkilala. Ang “iginagalang” ay malinaw sa konteksto ng ranggo at reputasyon.
- source_word: וְאֶל הַשְּׁלוֹשָׁה לֹא בָא
  choice: ngunit hindi niya naabot ang antas ng Tatlo
  rationale: 'Idyomatiko rito ang בוא אֶל: hindi simpleng paglapit sa lugar kundi pag-abot sa katayuan o ranggo. Nilinaw ng “ang antas” ang diwa nang hindi ipinapantay ang kaniyang ranggo sa Tatlo.'
- source_word: וַיְשִׂימֵהוּ דָוִיד
  choice: At itinalaga siya ni David
  rationale: Sa kontekstong militar at administratibo, ang שׂים ay pagtatalaga sa isang tungkulin, hindi lamang pisikal na paglalagay.
- source_word: עַל מִשְׁמַעְתּוֹ
  choice: na mamahala sa kaniyang sariling bantay
  rationale: Maaaring tukuyin ng מִשְׁמַעַת ang pangkat na nasa ilalim ng utos o ang yunit ng bantay. Ang “sariling bantay” ay angkop sa konteksto ni David ngunit nilalagyan ng talababa ang mas malawak na posibilidad.
