  source_fidelity: Kailangang baguhin ang pangunahing teksto. Ang Hebreo ay walang hiwalay na pandiwang tahasang nagsasabing si Abisai ang pumatay sa tatlong daan. Bagaman malakas ang implikasyong ito sa kontekstong pandigma, ang “napatay niya ang mga ito” ay nag-aalis ng sintaktikong pagpapaikli at ng kaunting natitirang kalabuan ng Hebreo. Ang ibang bahagi ay tapat sa pinagmulan, kabilang ang pagpapanatili ng “Tatlo” at ang pagmamarka sa ketiv/qere na usapin sa huling sugnay.
  naturalness: Likas at angkop sa modernong Filipino Tagalog ang “Si Abisai, na kapatid ni Joab” at “naging tanyag siya sa Tatlo.” Ang binagong “laban sa tatlong daan na napatay” ay mas natural kaysa sa lubhang literal na konstruksyong “laban sa tatlong daang napatay,” habang hindi nagdaragdag ng tahasang ahente ng pagpatay.
  terminology: Wasto ang “pinuno,” “Tatlo,” “sibat,” at “tanyag.” Ang “iwinasiwas” ay katanggap-tanggap na masiglang salin ng idyomang pandigma; ang mga alternatibong “itinaas” at “iniunday” ay maayos na nasa talababa. Wasto ang karaniwang Tagalog na anyong “Abisai.”
