base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/020.yaml
  text: And Abishai[a], the brother of Joab, was chief of the Three. He brandished his spear against three hundred slain[c][b], and had a name among the Three.
translation:
  language: tl
  text: Si Abisai, na kapatid ni Joab, ang pinuno ng Tatlo.[a] Iwinasiwas[b] niya ang kanyang sibat laban sa tatlong daan na napatay.[c] At naging tanyag siya sa Tatlo.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “ang Tatlo.” Sa katumbas na salaysay sa 2 Samuel 23:18 at sa mas malawak na talaan ng mga mandirigma ni David, may mga suliraning tekstuwal at pangkonteksto tungkol sa “tatlo” at “tatlumpu.” Dito ay pinanatili ang pagbasa ng tekstong Masoretiko.
    reason: textual_variant
  - marker: b
    text: Maaari ring isalin na “itinaas” o “iniunday.”
    reason: lexical_alternative
  - marker: c
    text: 'Mas literal sa Hebreo: “laban sa tatlong daang napatay.” Inilalarawan ng maikling parirala ang kinalabasan ng kanyang pakikipaglaban, ngunit hindi nito sinasabi sa hiwalay na pandiwa na siya ang pumatay sa kanila.'
    reason: source_idiom
  - marker: d
    text: Ang pangunahing salin ay sumusunod sa tradisyonal na pag-unawa na “nagkaroon siya ng pangalan,” samakatuwid, “naging tanyag siya.” Ang nakasulat na mga katinig ng tekstong Masoretiko ay maaari ring basahing “at walang pangalan,” ngunit sinusuportahan ng katumbas na pahayag sa 2 Samuel 23:18 ang tradisyonal na pagbasa.
    reason: textual_variant
lexical_decisions:
- source_word: רֹאשׁ
  choice: pinuno
  rationale: Sa kontekstong militar, tumutukoy ito sa katungkulan o pamumuno, hindi sa literal na ulo. Likas at malinaw sa modernong Tagalog ang “pinuno.”
- source_word: הַשְּׁלוֹשָׁה / בַּשְּׁלוֹשָׁה
  choice: ang Tatlo / sa Tatlo
  rationale: Malinaw na “tatlo” ang anyong Masoretiko sa talatang ito. Pinanatili ang katawagan bilang pangalan ng pangkat sa halip na itugma sa “tatlumpu” na makikita sa kaugnay na tradisyon ng mga mandirigma ni David.
- source_word: עוֹרֵר אֶת־חֲנִיתוֹ
  choice: Iwinasiwas niya ang kanyang sibat
  rationale: Ang pandiwa ay literal na may diwang paggising o pagpapakilos, ngunit sa kontekstong pandigma ay tumutukoy sa masiglang paggamit ng sibat. Napananatili ng “iwinasiwas” ang masiglang larawan nang natural sa Tagalog.
- source_word: עַל שְׁלֹשׁ מֵאוֹת חָלָל
  choice: laban sa tatlong daan at napatay niya ang mga ito
  rationale: Ang חָלָל ay “mga napatay” o “mga nasawi sa pagkakasugat.” Ginawang likas sa Tagalog ang resultang ipinahihiwatig ng maikling pariralang Hebreo, habang inilalahad sa talababa ang mas literal na kayarian.
- source_word: שֵׁם
  choice: naging tanyag
  rationale: Ang literal na “pangalan” ay isang idyoma para sa reputasyon o katanyagan. Mas malinaw sa karaniwang mambabasa ang “naging tanyag” habang pinananatili ang kahulugan.
- source_word: אַבְשַׁי
  choice: Abisai
  rationale: Ginamit ang karaniwang anyong Tagalog ng pangalang Hebreo.
- source_word: אֲחִי יוֹאָב
  choice: na kapatid ni Joab
  rationale: Tuwirang ipinapahayag ang ugnayang pampamilya at likas ang ayos sa Tagalog.
