  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa salaysay. Ginamit ang “kanyang” bilang karaniwang modernong anyo. Pinanatili bilang pantanging katawagan ang “Tatlo,” at inilagay sa mga talababa ang mahahalagang suliraning tekstuwal at leksikal sa halip na tahimik na lutasin ang mga ito.
