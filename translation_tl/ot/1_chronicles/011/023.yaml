  text: וְ/הֽוּא הִכָּה֩ אֶת הָ/אִ֨ישׁ הַ/מִּצְרִ֜י אִ֥ישׁ מִדָּ֣ה חָמֵ֣שׁ בָּ/אַמָּ֗ה וּ/בְ/יַ֨ד הַ/מִּצְרִ֤י חֲנִית֙ כִּ/מְנ֣וֹר אֹרְגִ֔ים וַ/יֵּ֥רֶד אֵלָ֖י/ו בַּ/שָּׁ֑בֶט וַ/יִּגְזֹ֤ל אֶֽת הַ/חֲנִית֙ מִ/יַּ֣ד הַ/מִּצְרִ֔י וַ/יַּהַרְגֵ֖/הוּ בַּ/חֲנִיתֽ/וֹ־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/023.yaml
  text: And he struck down the Egyptian[a], a man five cubits tall. In the Egyptian’s hand was a spear like a weaver’s beam, and he went down to him with a staff, snatched the spear from the Egyptian’s hand[c][b], and killed him with his own spear.
translation:
  language: tl
  text: Pinabagsak niya ang Ehipsiyo, isang lalaking limang siko[b] ang taas.[a] May hawak na sibat ang Ehipsiyo na parang biga ng habihan. Bumaba siya patungo sa Ehipsiyo na may dalang tungkod[c], inagaw ang sibat mula sa kamay ng Ehipsiyo, at pinatay niya ang Ehipsiyo gamit ang sarili nitong sibat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin na “isang lalaking pambihira ang laki, na limang siko ang taas.” Literal sa Hebreo: “isang lalaking may sukat.”'
    reason: lexical_alternative
  - marker: b
    text: Ang siko ay sinaunang yunit ng haba na humigit-kumulang sa distansiya mula sa siko ng braso hanggang sa dulo ng mga daliri.
    reason: cultural_note
  - marker: c
    text: Maaari ring “pamalo” o “baston.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הִכָּה
  choice: pinabagsak
  rationale: Ipinahihiwatig ang marahas na paggapi ngunit hindi pa ito isinasalin bilang “pinatay,” sapagkat tahasang binabanggit ang pagpatay sa hulihan ng talata.
- source_word: הָאִישׁ הַמִּצְרִי
  choice: ang Ehipsiyo
  rationale: Likas sa modernong Tagalog ang paggamit ng katawagang pambansa bilang pangngalan para sa taong tinutukoy; hindi kailangang ulitin ang “lalaki.”
- source_word: אִישׁ מִדָּה
  choice: isang lalaking … ang taas
  rationale: Kasama ng kasunod na sukat, malinaw nitong ipinapahayag ang di-pangkaraniwang tangkad, habang inilalagay sa talababa ang literal at posibleng mas malawak na kahulugan.
- source_word: חָמֵשׁ בָּאַמָּה
  choice: limang siko ang taas
  rationale: Pinananatili ang sinaunang yunit ng sukat at ipinapaliwanag ito sa talababa sa halip na palitan ng makabagong sukat sa pangunahing teksto.
- source_word: חֲנִית
  choice: sibat
  rationale: Ito ang karaniwan at angkop na katawagan sa sandata sa konteksto, lalo na dahil inihahambing ang katawan o tangkay nito sa biga ng habihan.
- source_word: כִּמְנוֹר אֹרְגִים
  choice: parang biga ng habihan
  rationale: Natural at malinaw na inilalarawan nito ang laki o kapal ng sibat sa pamamagitan ng bahagi ng habihan.
- source_word: וַיֵּרֶד אֵלָיו
  choice: bumaba siya patungo rito
  rationale: Pinananatili ang literal na kilos na “bumaba” at iniiwasang gawing “nilusob” o “sinalakay,” na higit na interpretatibo.
- source_word: בַּשָּׁבֶט
  choice: na may dalang tungkod
  rationale: Ang “tungkod” ang pinakamalawak at hindi gaanong interpretatibong katumbas; kinikilala sa talababa ang posibleng “pamalo” o “baston.”
- source_word: וַיִּגְזֹל
  choice: inagaw
  rationale: Ipinapahayag nito ang sapilitang pagkuha sa mabilis at marahas na tagpo ng labanan.
- source_word: וַיַּהַרְגֵהוּ
  choice: pinatay ito
  rationale: Ito ang tahasang pandiwa ng pagpatay at malinaw sa kasalukuyang Tagalog.
- source_word: בַּחֲנִיתוֹ
  choice: sa sarili nitong sibat
  rationale: Ang panghalip ay pinakamalamang na tumutukoy sa sibat ng Ehipsiyo na kagagaw lamang sa kaniya; nililinaw ng parirala ang reperensiya at kabalintunaan ng pangyayari.
