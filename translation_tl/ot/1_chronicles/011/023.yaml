  - severity: low
    issue: Ang “din” sa unang pangungusap ay hindi kailangan.
    rationale: Ang waw sa simula ng talata ay payak na pang-ugnay; ang “din” ay nagdaragdag ng diin na hindi kailangang ipahayag sa talatang ito.
