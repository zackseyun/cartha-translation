revisions:
- from: Pinabagsak din niya ang Ehipsiyo, isang lalaking limang siko[b] ang taas.[a] May hawak na sibat ang Ehipsiyo na parang biga ng habihan. Bumaba siya patungo rito na may dalang tungkod[c], inagaw ang sibat mula sa kamay ng Ehipsiyo, at pinatay ito sa sarili nitong sibat.
  to: Pinabagsak niya ang Ehipsiyo, isang lalaking limang siko[b] ang taas.[a] May hawak na sibat ang Ehipsiyo na parang biga ng habihan. Bumaba siya patungo sa Ehipsiyo na may dalang tungkod[c], inagaw ang sibat mula sa kamay ng Ehipsiyo, at pinatay niya ang Ehipsiyo gamit ang sarili nitong sibat.
  rationale: Nilinaw ang mga reperente sa kilos ng paglapit, pag-agaw, at pagpatay sa pamamagitan ng pag-uulit ng “Ehipsiyo,” at pinalitan ang di-angkop na panghalip na “nito” ng “niya” para sa pangunahing gumaganap. Pinanatili ang ambigwidad ng literal na “bumaba,” ang sinaunang sukat na “siko,” at ang sandatang “sibat.”
