translation_notes:
  register: Gumamit ng natural, marangal, at madaling maunawaang modernong Tagalog. Pinanatili ang sinaunang “siko,” ang konkretong larawan ng “biga ng habihan,” at ang literal na galaw na “bumaba” upang manatiling malapit sa Hebreo nang hindi nagiging lipas o artipisyal ang wika.
