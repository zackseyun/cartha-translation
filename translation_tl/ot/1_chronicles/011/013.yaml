base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/013.yaml
  text: He was with David at Pas-dammim[a], where the Philistines had gathered for battle. Now the plot of the field was full of barley[b], and the people fled from before the Philistines.
translation:
  language: tl
  text: Siya ay kasama ni David sa Pas-damim[a], kung saan nagtipon ang mga Filisteo para sa labanan. May isang bahagi ng bukid na puno ng sebada, at tumakas ang mga tao mula sa harap ng mga Filisteo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Pas-damim ay pangalan ng isang lugar. Ihambing ang katumbas na salaysay sa 1 Samuel 17:1, kung saan tinatawag ang lugar na Efes-damim.
    reason: cross_reference
  - marker: b
    text: 'Maaari ring isalin na “tumakas sa harap ng mga Filisteo.” Literal sa Hebreo: “tumakas mula sa harap ng mga Filisteo.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּפַּס דַּמִּים
  choice: sa Pas-damim
  rationale: Itinuring na pangalan ng lugar ang anyong Hebreo at isinalin sa pamamagitan ng transliterasyon, sa halip na gawing literal ang posibleng etimolohiya nito.
- source_word: נֶאֱסְפוּ
  choice: nagtipon
  rationale: Ang Niphal ng אסף ay tumutukoy sa sama-samang pagtitipon; natural sa salaysay ang aktibong anyong Filipino.
- source_word: לַמִּלְחָמָה
  choice: para sa labanan
  rationale: Tumutukoy ito sa isang tiyak na sagupaang militar, kaya mas angkop dito ang “labanan” kaysa sa mas malawak na “digmaan.”
- source_word: חֶלְקַת הַשָּׂדֶה
  choice: isang bahagi ng bukid
  rationale: Ang חלקה ay isang takdang parsela o bahagi ng lupang sinasaka; malinaw at natural ito sa modernong Filipino.
- source_word: מְלֵאָה שְׂעוֹרִים
  choice: puno ng sebada
  rationale: Tiyak na sebada ang binabanggit sa Hebreo, hindi lamang butil sa pangkalahatan.
- source_word: וְהָעָם
  choice: ang mga tao
  rationale: Pinananatili ang malawak na kahulugan ng עם nang hindi ito tahasang nililimitahan sa mga kawal, bagaman malamang na mga Israelitang mandirigma ang tinutukoy sa konteksto.
- source_word: נָסוּ מִפְּנֵי פְלִשְׁתִּים
  choice: tumakas ... mula sa harap ng mga Filisteo
  rationale: Pinananatili nito ang kongkretong idyomang Hebreo na מִפְּנֵי, habang ipinapahiwatig ang pag-atras o pagtakas sa harap ng kaaway.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang pangalan ng lugar at ang tiyak na pananim na sebada. Ginamit ang “mga tao” upang hindi paliitin ang saklaw ng Hebreong עם, at nilagyan ng talababa ang idyomang naglalarawan sa pagtakas sa harap ng kaaway.
