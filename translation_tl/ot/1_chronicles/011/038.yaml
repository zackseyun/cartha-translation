  text: Joel the brother of Nathan[a], Mibhar son of Hagri,
translation:
  language: tl
  text: Si Joel, kapatid ni Natan; si Mibhar, anak ni Hagri[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “si Mibhar, anak ng Hagrita.” Maaaring unawain ang Hebreong הַגְרִי bilang katawagang etniko sa halip na pangalan ng isang tao.
    reason: alternative_reading
lexical_decisions:
- source_word: יוֹאֵל
  choice: Joel
  rationale: Pangngalang pantangi; isinalin sa karaniwang anyong Filipino ng biblikal na pangalang ito.
- source_word: אֲחִי
  choice: na kapatid ni
  rationale: Anyo itong construct ng salitang ‘kapatid.’ Likas sa Filipino ang ‘na kapatid ni’ sa talaan ng mga pangalan at hindi kailangang palawakin bilang ‘kamag-anak’ nang walang kontekstuwal na dahilan.
- source_word: נָתָן
  choice: Natan
  rationale: Pangngalang pantangi; tinumbasan ayon sa karaniwang transliterasyong Filipino.
- source_word: מִבְחָר
  choice: Mibhar
  rationale: Pangngalang pantangi; isinalin sa pamamagitan ng transliterasyon.
- source_word: בֶּן
  choice: na anak ni
  rationale: Karaniwang panandang pangangkanan; ang ‘anak ni’ ang pinakamalinaw at pinakanatural sa talaang ito.
- source_word: הַגְרִי
  choice: Hagri
  rationale: Sa pangunahing teksto, itinuring itong pangalan ng tao, habang pinanatili sa talababa ang posibleng pagbasa rito bilang katawagang etniko.
