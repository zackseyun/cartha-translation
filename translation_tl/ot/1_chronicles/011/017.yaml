  naturalness: Marangal at malinaw ang register. Mas natural at mas tiyak ang “Kung may magbibigay lamang” kaysa “Kung may magbigay lamang” sa idyomatikong talababa. Ang “sisterna” ay mas tuwirang modernong katumbas ng alternatibong kahulugan ng בור kaysa sa mas maluwag na “imbakan ng tubig.”
  terminology: Ang “David,” “Bethlehem,” “balon,” at “pintuang-bayan” ay katanggap-tanggap sa modernong Filipino Tagalog. Walang isyung teolohikal o doktrinal. Napananatili ng talababa ang leksikal na kalabuan ng בור nang hindi iginigiit ang isang kahulugang hindi tiyak.
