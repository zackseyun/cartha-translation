  yaml_path: translation/ot/1_chronicles/011/017.yaml
  text: And David longed and said[b][a], “Who will give me water to drink from the well of Bethlehem that is by the gate?”
translation:
  language: tl
  text: At nanabik si David at sinabi, “Sino ang magbibigay sa akin ng tubig na maiinom ko mula sa balon[b] ng Bethlehem na nasa tabi ng pintuang-bayan?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O, mas idyomatiko: “Kung may magbibigay lamang sa akin ng tubig na maiinom ko mula sa balon ng Bethlehem sa tabi ng pintuang-bayan!”'
    reason: lexical_alternative
  - marker: b
    text: Ang salitang Hebreo na isinaling “balon” ay maaari ring mangahulugang “sisterna” o “hukay,” ngunit tumutukoy ito rito sa isang pinagmumulan ng tubig na maiinom.
    reason: lexical_alternative
lexical_decisions:
- source_word: ויתאו
  choice: nanabik
  rationale: Ang pandiwa ay nagpapahayag ng matinding pagnanais. Likas sa makabagong Tagalog ang “nanabik” at pinananatili nito ang tindi ng damdamin.
- source_word: מי
  choice: Sino ang
  rationale: Pinananatili nito ang anyong patanong ng Hebreo. Sa konteksto, ang tanong ay nagpapahayag din ng isang matinding kahilingan o hangarin.
- source_word: ישקני מים
  choice: magbibigay sa akin ng tubig na maiinom
  rationale: Natural itong pagpapahayag sa Tagalog ng causative na diwang “magbigay upang makainom,” habang tahasang pinananatili ang salitang “tubig.”
- source_word: מבּור
  choice: mula sa balon
  rationale: Maaaring tumukoy ang בור sa hukay, imbakan ng tubig, o balon. Dahil pinagmumulan ito rito ng tubig na maiinom, “balon” ang pinakamalinaw na salin sa konteksto; itinatala sa talababa ang ibang posibilidad.
- source_word: בית לחם
  choice: Bethlehem
  rationale: Ito ang nakagawiang anyo ng pangalan ng lugar sa Filipino.
- source_word: אשר בשער
  choice: na nasa tabi ng pintuang-bayan
  rationale: Malinaw at natural nitong inilalarawan ang lokasyon ng balon kaugnay ng tarangkahan ng bayan.
