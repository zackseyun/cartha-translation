  text: אֲחִיאָ֧ם בֶּן שָׂכָ֛ר הַ/הֲרָרִ֖י אֱלִיפַ֥ל בֶּן אֽוּר־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/035.yaml
  text: Ahiam son of Sachar the Hararite[a], Eliphal son of Ur.
translation:
  language: tl
  text: Si Ahiam na anak ni Sakar, na Hararita[a]; si Elifal na anak ni Ur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “anak ni” sa dalawang paglitaw nito ay maaari ring mangahulugang “inapo ni,” bagaman mas natural sa talaang ito ng mga mandirigma ang tuwirang pagiging anak.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲחִיאָם
  choice: Ahiam
  rationale: Pangalang pantangi; tinumbasan sa baybay na malinaw at likas basahin sa modernong Filipino.
- source_word: בֶּן
  choice: anak ni
  rationale: Sa talaang ito ng mga mandirigma, pinakamalamang na tumutukoy ang בֶּן sa tuwirang pagiging anak; maaari rin itong mangahulugang inapo sa mas malawak na gamit.
- source_word: שָׂכָר
  choice: Sakar
  rationale: Pangalang pantangi; ang titik na שׂ ay kinakatawan ng tunog na s, at ang k ay angkop sa Filipino para sa כּ/כ na tunog.
- source_word: הֲרָרִי
  choice: Hararita
  rationale: Anyong tumutukoy sa pangkat o pinagmulang heograpiko; pinananatili ang katawagang pantangi nang hindi tiyakang ipinapakahulugang taga-bundok o taga-Harar.
- source_word: אֱלִיפַל
  choice: Elifal
  rationale: Pangalang pantangi; malapit sa tunog ng Hebreo at likas sa ortograpiyang Filipino.
- source_word: אֽוּר
  choice: Ur
  rationale: Pangalang pantangi ng isang tao sa kontekstong ito, hindi pangalan ng lungsod sa Mesopotamia.
theological_decisions: []
translation_notes:
  register: Maikli at marangal na estilong angkop sa talaan ng mga pangalan. Ginamit ang makabagong Filipino na “anak ni” at ang natural na anyong “Hararita,” habang pinananatili ang pagkakasunod-sunod at anyong listahan ng Hebreo.
