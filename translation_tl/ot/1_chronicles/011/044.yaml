  text: Uzzia the Ashterathite[a], Shama and Jeiel[b], the sons of Hotham the Aroerite.
translation:
  language: tl
  text: Si Uzia na taga-Ashterat[a]; sina Shama at Jeuel[b], mga anak ni Hotam na taga-Aroer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “taga-Ashtarot.” Malamang na tumutukoy ito sa isang taong mula sa Ashterat o Ashtarot.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring baybayin ang pangalan na “Jeiel.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עֻזִּיָא
  choice: Uzia
  rationale: Isinalin sa baybay na madaling basahin sa Filipino habang malapit sa anyong Hebreo ng pangalang pantangi.
- source_word: הָעֲשְׁתְּרָתִי
  choice: Ashteratita
  rationale: Pangalan ng taong nagmula sa Ashterat/Ashtarot; ginamit ang hulaping Filipino na “-ita” upang ipahayag ang katawagang batay sa lugar.
- source_word: שָׁמָע
  choice: Shama
  rationale: Tuwirang transliterasyon ng pangalang pantangi ayon sa anyong Masoretiko sa talata.
- source_word: ויעואל
  choice: at Jeuel
  rationale: Ang ו ay isinaling “at,” at ang pangalan ay itinumbas na “Jeuel” ayon sa mga katinig ng tekstong Hebreo; inilagay sa talababa ang alternatibong tradisyon ng transliterasyon.
- source_word: בְּנֵי
  choice: mga anak ni
  rationale: Likas na katumbas sa Filipino ng pangmaramihang construct na “mga anak ni,” na tumutukoy kina Shama at Jeuel.
- source_word: חוֹתָם
  choice: Hotam
  rationale: Tuwirang transliterasyon ng pangalang pantangi sa paraang madaling bigkasin sa Filipino.
- source_word: הָעֲרֹעֵרִי
  choice: Aroerita
  rationale: Katawagan sa isang taong mula sa Aroer; ginamit ang hulaping “-ita” na natural sa Filipino para sa pinagmulan sa lugar.
