  source_fidelity: 'Tumpak ang mga pangalan at ang ugnayang sintaktiko: sina Shama at Jeuel ang mga anak ni Hotam, at si Hotam ang Aroerita. Gayunman, ang “na Aroerita” sa kasalukuyang ayos ay maaaring pansamantalang mabasa bilang paglalarawan sa mga anak. Ang “taga-” ay isang mas likas na modernong Filipino na katumbas ng mga gentilicio at mas malinaw na maikakabit kay Hotam.'
  naturalness: Ang “Si Uzia …, at sina Shama at Jeuel” ay hindi gaanong pantay na ayos para sa isang talaan ng mga pangalan. Ang paggamit ng semicolon at pag-aalis ng di-kailangang “at” ay mas malinaw at mas natural. Mas karaniwan rin sa modernong Filipino ang “taga-Ashterat/Aroer” kaysa sa mga anyong “Ashteratita/Aroerita.”
  terminology: Napanatili ang mga pangalang Uzia, Shama, Jeuel, at Hotam ayon sa transliterasyong nasa audit trail. Ang “taga-Ashterat” at “taga-Aroer” ay nagsasaad ng parehong pinagmulan na ipinahihiwatig ng mga Hebreong gentilicio, nang hindi nagdaragdag ng kahulugan.
