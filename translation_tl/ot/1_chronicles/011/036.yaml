  rationale: May artikulong katawagang nagsasaad ng kaugnayan sa isang lugar o angkan. Ginamit ang likas na hulma sa Filipino na “taga-” at pinanatiling transliterado ang di-tiyak na pangalang pinagmulan.
- source_word: אֲחִיָּה
