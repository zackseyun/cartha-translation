- source_word: הַפְּלֹנִי
  choice: na Pelonita
  rationale: May artikulong katawagang tumutukoy sa pinagmulan o pangkat. Sinunod ang Masoretikong anyo sa talatang ito at ginamit ang natural na hulma ng katawagang pangkat sa Filipino.
