  text: אֱלִיאֵל֙ הַֽ/מַּחֲוִ֔ים וִ/ירִיבַ֥י וְ/יוֹשַׁוְיָ֖ה בְּנֵ֣י אֶלְנָ֑עַם וְ/יִתְמָ֖ה הַ/מּוֹאָבִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/046.yaml
  text: Eliel the Mahavite[a], and Jeribai and Joshaviah, the sons of Elnaam[b], and Ithmah the Moabite.
translation:
  language: tl
  text: Si Eliel na Mahavita[a], sina Jeribai at Josavias na mga anak ni Elnaam, at si Itma na Moabita.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, Mahavita; hindi tiyak kung anong lugar o angkan ang tinutukoy ng katawagang ito.
    reason: cultural_note
  - marker: b
    text: Maaari ring baybayin ang Jeribai bilang Jaribai, at ang Itma bilang Jitma; mga alternatibong transliterasyon ang mga ito ng mga pangalang Hebreo.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלִיאֵל
  choice: Eliel
  rationale: Pangalang pantangi; isinalin sa baybay na madaling basahin sa modernong Filipino habang malapit sa anyong Hebreo.
- source_word: הַמַּחֲוִים
  choice: Mahavita
  rationale: Hindi tiyak na katawagan sa lugar o angkan. Pinanatili bilang transliteradong katawagan sa halip na tukuyin ang di-natitiyak na pinagmulan nito.
- source_word: וִירִיבַי
  choice: Jeribai
  rationale: Pangalang pantangi; pinanatili ang karaniwang anyong transliterasyon na Jeribai.
- source_word: וְיוֹשַׁוְיָה
  choice: Josavias
  rationale: Pangalang pantangi; ginamit ang natural at nakikilalang anyong Filipino na kumakatawan sa mga katinig ng pangalang Hebreo.
- source_word: בְּנֵי
  choice: mga anak ni
  rationale: Malinaw na ipinakikilalang kapwa anak ni Elnaam sina Jeribai at Josavias; likas sa Filipino ang 'mga anak ni'.
- source_word: אֶלְנָעַם
  choice: Elnaam
  rationale: Pangalang pantangi; direktang transliterasyon.
- source_word: וְיִתְמָה
  choice: at si Itma
  rationale: Pangalang pantangi; ang 'Itma' ay malapit sa bigkas ng Hebreo at natural basahin sa Filipino.
- source_word: הַמּוֹאָבִי
  choice: na Moabita
  rationale: Katawagan sa pinagmulan o bayan ni Itma; ang 'Moabita' ang likas na anyong Filipino para sa isang taga-Moab.
