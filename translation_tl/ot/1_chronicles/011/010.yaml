  terminology: Ang “mga pinuno ng magigiting na mandirigma,” “Yahweh,” at “Israel” ay angkop sa marangal ngunit malinaw na rehistro. Pinanatili ang “salita ni Yahweh” para sa דְבַר־יְהוָה.
