  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/אֵ֨לֶּה רָאשֵׁ֤י הַ/גִּבּוֹרִים֙ אֲשֶׁ֣ר לְ/דָוִ֔יד הַ/מִּתְחַזְּקִ֨ים עִמּ֧/וֹ בְ/מַלְכוּת֛/וֹ עִם כָּל יִשְׂרָאֵ֖ל לְ/הַמְלִיכ֑/וֹ כִּ/דְבַ֥ר יְהוָ֖ה עַל יִשְׂרָאֵֽל־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/010.yaml
  text: These were the chiefs of the mighty men who belonged to David[a], who strengthened themselves with him in his kingdom, together with all Israel, to make him king[b], according to the word of Yahweh concerning Israel.
translation:
  language: tl
  text: Ito ang mga pinuno ng magigiting na mandirigma ni David[a], na matatag na sumuporta sa kanya sa kanyang paghahari, kasama ng buong Israel, upang gawin siyang hari, ayon sa salita ni Yahweh tungkol sa Israel[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O kaya, “na nagpakalakas kasama niya” o “na nagpatibay ng kanilang sarili kasama niya.” Ang Hebreo ay maaaring basahin nang mas literal sa ganitong paraan; sa konteksto, malamang na tumutukoy ito sa matatag na pagsuporta kay David sa kanyang pagkahari.
    reason: lexical_alternative
  - marker: b
    text: O kaya, “ayon sa salita ni Yahweh ukol sa Israel.” Mas literal na “sa ibabaw ng Israel,” ngunit sa ayos na ito ay malamang na tumutukoy sa Israel bilang paksa ng salita ni Yahweh.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאשֵׁי הַגִּבּוֹרִים
  choice: mga pinuno ng magigiting na mandirigma
  rationale: Ang רָאשֵׁי ay tumutukoy sa mga nangungunang tauhan, at ang הַגִּבּוֹרִים sa kontekstong ito ay mga bantog at makapangyarihang mandirigma ni David. Likas at malinaw sa Filipino ang pinagsamang parirala.
- source_word: אֲשֶׁר לְדָוִיד
  choice: ni David
  rationale: Ipinahahayag ng lamed ang kaugnayan o pag-aari; sapat at natural sa Filipino ang hulaping pariralang “ni David” nang hindi nagpapahiwatig na sila ay literal na pag-aari niya.
- source_word: הַמִּתְחַזְּקִים עִמּוֹ
  choice: na buong-lakas na sumuporta sa kanya
  rationale: Ang hitpael ng חזק kasama ng עִם ay maaaring literal na tumukoy sa pagpapakalakas na kasama niya, ngunit sa konteksto ng pagluklok kay David ay nagpapahayag ng matatag at aktibong pagsuporta sa kanya.
- source_word: בְמַלְכוּתוֹ
  choice: sa kanyang paghahari
  rationale: Maaaring mangahulugan ang מַלְכוּת ng kaharian, pagkahari, o paghahari. Dahil ang konteksto ay ang pagtatatag ng pamumuno ni David, mas angkop dito ang “paghahari” kaysa sa teritoryal na “kaharian.”
- source_word: עִם כָּל יִשְׂרָאֵל
  choice: kasama ng buong Israel
  rationale: Tuwirang ipinapakita nito na kumilos ang mga mandirigma kaagapay ng buong Israel.
- source_word: לְהַמְלִיכוֹ
  choice: upang gawin siyang hari
  rationale: 'Tuwirang isinasalin nito ang causative na anyo ng מלך: ang gawin o italaga ang isang tao bilang hari.'
- source_word: כִּדְבַר יְהוָה
  choice: ayon sa salita ni Yahweh
  rationale: Pinananatili ng “salita” ang pormal na ugnayan sa ipinahayag ng Diyos, at ginagamit ang personal na pangalang Yahweh para sa Tetragrammaton.
- source_word: עַל יִשְׂרָאֵל
  choice: tungkol sa Israel
  rationale: Kasunod ng דְבַר, natural na ipinahahayag ng עַל ang paksa ng salita—“tungkol sa Israel”—sa halip na ang pamumuno “sa Israel.”
theological_decisions:
- issue: Kahulugan ng pagkilos ng mga tagasuporta sa הַמִּתְחַזְּקִים עִמּוֹ
  choice: matatag at aktibong pagsuporta kay David sa kanyang pagluklok
  alternative: pagpapakalakas sa kanilang sarili kasama ni David
  rationale: Sinusuportahan ng kasunod na layuning “upang gawin siyang hari” ang politikal-militar na diwa, ngunit hindi dinaragdagan ang teksto ng partikular na seremonya o paraan ng pagluklok.
- issue: Saklaw ng בְמַלְכוּתוֹ
  choice: sa kanyang paghahari
  alternative: sa kanyang kaharian; sa kanyang pagkahari
  rationale: Itinatampok ng konteksto ang pagtatatag ng pamumuno ni David. Ang “paghahari” ay natural sa Filipino at hindi nililimitahan ang parirala sa teritoryal na kaharian.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “magigiting na mandirigma” para sa malinaw na kontekstong militar, “buong-lakas na sumuporta” upang ihatid ang lakas ng reflexive na parirala nang hindi nagiging malamya, at “Yahweh” bilang personal na pangalan. Walang talababa dahil naihahatid sa pangunahing teksto ang pinakamalamang na diwa nang hindi kailangang lutasin ang talata sa paraang sektaryan.
