  to: Ito ang mga pinuno ng magigiting na mandirigma ni David[a], na matatag na sumuporta sa kanya sa kanyang paghahari, kasama ng buong Israel, upang gawin siyang hari, ayon sa salita ni Yahweh tungkol sa Israel[b].
