base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/005.yaml
  text: The inhabitants of Jebus said to David[a], “You will not come in here.” But David captured the stronghold of Zion, that is, the City of David.
translation:
  language: tl
  text: Sinabi ng mga naninirahan sa Jebus kay David, “Hindi ka makapapasok dito.”[a] Ngunit nakuha ni David ang tanggulan ng Zion, na siyang Lungsod ni David.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Hindi ka darating dito.” Literal na ganito ang Hebreo; sa konteksto, ito ay pagtanggi na makapasok si David.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹשְׁבֵי יְבוּס
  choice: mga naninirahan sa Jebus
  rationale: Tuwirang ipinahahayag ng pariralang konstruktibo ang mga taong naninirahan sa Jebus; natural at malinaw ito sa makabagong Tagalog.
- source_word: לֹא תָבוֹא הֵנָּה
  choice: Hindi ka makapapasok dito
  rationale: Bagaman literal na 'Hindi ka darating dito,' ang pahayag sa konteksto ay pagtanggi o paghamon na hindi makapapasok si David sa lunsod; pinananatili ng salin ang puwersang iyon.
- source_word: וַיִּלְכֹּד
  choice: sinakop
  rationale: Sa kontekstong militar, ang pandiwa ay tumutukoy sa pagkuha o pagbihag sa isang pinatibay na lugar; idiomatiko sa Tagalog ang 'sinakop.'
- source_word: מְצֻדַת צִיּוֹן
  choice: tanggulan ng Zion
  rationale: Ang מְצוּדָה ay isang pinatibay at maipagtatanggol na lugar; malinaw at dignificado ang 'tanggulan' nang hindi labis na tinutukoy ang tiyak na anyo ng kuta.
- source_word: הִיא עִיר דָּוִיד
  choice: na siyang Lungsod ni David
  rationale: Ipinakikilala ng sugnay ang tanggulan ng Zion bilang lugar na tinatawag na Lungsod ni David; natural na naihahatid ito ng 'na siyang.'
- source_word: עִיר דָּוִיד
  choice: Lungsod ni David
  rationale: Isa itong nakatalagang pangalan ng lugar sa konteksto, kaya ginamit ang malalaking titik.
