  language: tl
  text: Pagkatapos, nagtipon ang buong Israel kay David sa Hebron at sinabi, “Narito, kami ay iyong buto at laman.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקָּבְצוּ
  choice: nagtipon
  rationale: Likas na salin ng pandiwang nagsasaad na sama-samang lumapit o nagtipon ang Israel.
- source_word: כָל יִשְׂרָאֵל
  choice: ang buong Israel
  rationale: Pinananatili ang kolektibo at malawak na saklaw ng parirala.
- source_word: אֶל דָּוִיד חֶבְרוֹנָה
  choice: kay David sa Hebron
  rationale: Ipinapahayag ang paglapit kay David at ang patutunguhang lugar nang natural sa Tagalog.
- source_word: הִנֵּה
  choice: Tingnan mo
  rationale: Nagbibigay-pansin sa kasunod na pahayag at tumutugma sa tuwirang pakikipag-usap kay David.
- source_word: עַצְמְךָ וּבְשָׂרְךָ אֲנָחְנוּ
  choice: kami ay sarili mong buto at laman
  rationale: Pinananatili ang Hebreong idyoma ng pagkakamag-anak at pagkakaisa sa halip na palitan ito ng paliwanag lamang.
theological_decisions:
- issue: Saklaw ng “buong Israel”
  choice: Pinanatili bilang “ang buong Israel.”
  alternative: “ang lahat ng Israelita”
  rationale: Hindi nililimitahan o nilulutas ng salin kung ito ay bawat indibidwal o ang bansang kinakatawan bilang kabuuan.
- issue: Kahulugan ng idyomang “buto at laman”
  choice: Pinanatili ang mismong larawan bilang “sarili mong buto at laman.”
  alternative: “mga kamag-anak mo kami”
  rationale: Pinananatili nito ang teolohikal at pampamilyang bigat ng orihinal nang hindi kinikitid sa isang paliwanag.
translation_notes:
  register: Makabagong, dignified, at madaling maunawaang Filipino. Pinanatili ang matingkad na Semitikong idyoma, ngunit ginawang natural ang daloy ng pangungusap.
