lexical_decisions:
- source_word: אֽוּרִיָּה
  choice: Urias
  rationale: Karaniwang anyo ng pangalang biblikal na ito sa modernong Tagalog; pangalan ito kaya isinalin sa pamamagitan ng nakaugaliang transliterasyon.
- source_word: הַ/חִתִּי
  choice: na Heteo
  rationale: Ang gentilic na may pantukoy ay nagpapakilala sa lahi o bayang pinagmulan ni Urias. Ang “Heteo” ang malinaw at nakaugaliang katawagang Tagalog para sa Hittite.
- source_word: זָבָד
  choice: Zabad
  rationale: Pangalang pantangi kaya pinanatili sa transliterasyon.
- source_word: בֶּן
  choice: anak ni
  rationale: Likas na modernong Tagalog para sa ugnayang anak at magulang sa talaan ng mga pangalan; hindi kailangang tukuyin ang kasarian sa pariralang ito.
- source_word: אַחְלָי
  choice: Ahlai
  rationale: Pangalang pantangi kaya pinanatili sa transliterasyon.
theological_decisions: []
translation_notes:
  register: Maikli, marangal, at natural na modernong Tagalog para sa isang talaan ng mga pangalan. Ginamit ang “at” upang maipakitang magkahiwalay na pangalan sa listahan sina Urias at Zabad; ang marker na [a] ay inilagay agad pagkatapos ng “Heteo.”
