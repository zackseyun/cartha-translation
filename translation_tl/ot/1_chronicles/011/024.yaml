  text: These things Benaiah son of Jehoiada did[a], and he had a name among the three mighty men.
translation:
  language: tl
  text: Ito ang ginawa ni Benaya na anak ni Jehoiada, at nagkaroon siya ng katanyagan sa hanay ng tatlong magigiting na mandirigma.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “at may pangalan siya sa hanay ng tatlong magigiting na mandirigma.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה עָשָׂה
  choice: Ang mga gawang ito ay ginawa
  rationale: Tumutukoy pabalik ang pangmaramihang demonstratibo sa mga kabayanihang kagagawang isinalaysay. Likas sa Filipino ang pariralang ito at nananatiling malapit sa payak na pandiwang עשה.
- source_word: בְּנָיָהוּ בֶּן יְהוֹיָדָע
  choice: Benaya na anak ni Jehoiada
  rationale: Malapit sa anyong Hebreo ang transliterasyon ng mga pangalan, at malinaw na ipinapahayag ng “anak ni” ang ugnayang nasa construct form.
- source_word: וְלוֹ שֵׁם
  choice: at naging bantog siya
  rationale: Ang literal na “may pangalan siya” ay isang idyomang Hebreo para sa pagkakaroon ng reputasyon o kabantugan. Ipinahahayag ng salin ang kahulugan sa natural na Filipino, habang inilalagay sa talababa ang literal na anyo.
- source_word: בִּשְׁלוֹשָׁה
  choice: sa tatlong
  rationale: Pinananatili ang ugnayan niya sa grupong tinatawag na “tatlo” nang hindi dinaragdagan ang teksto ng tiyak na paliwanag tungkol sa eksaktong ranggo niya.
- source_word: הַגִּבֹּרִים
  choice: magigiting na mandirigma
  rationale: Sa konteksto, tumutukoy ito sa piling mga mandirigma ni David. Naipahahayag ng “magigiting na mandirigma” kapwa ang lakas o kabayanihan at ang militar na tungkulin nila.
theological_decisions: []
translation_notes:
  register: Gumamit ng moderno, malinaw, at marangal na Filipino. Isinalin nang idyomatiko ang Hebreong “may pangalan,” ngunit pinanatili sa talababa ang literal na pahayag at hindi nilinaw nang lampas sa teksto ang kaugnayan ni Benaya sa “tatlo.”
