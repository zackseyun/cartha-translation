  text: Hezro the Carmelite[a], Naarai son of Ezbai[b];
translation:
  language: tl
  text: Si Hezro na taga-Carmel[a], at si Naarai na anak ni Ezbai[b];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang Carmelita,” ibig sabihin, isang taong mula o kabilang sa Carmel.
    reason: lexical_alternative
  - marker: b
    text: 'Sa katumbas na tala sa 2 Samuel 23:35, iba ang mga pangalang nakasulat: “Si Hezrai na taga-Carmel, at si Paarai na Arbita.” Pinananatili rito ang natatanging anyo ng teksto sa Cronica.'
    reason: cross_reference
lexical_decisions:
- source_word: חֶצְרוֹ
  choice: Hezro
  rationale: Isinatinig ang pangalang Hebreo ayon sa anyong nasa Cronica, sa halip na ipalit ang naiibang anyo sa katumbas na tala sa 2 Samuel.
- source_word: הַכַּרְמְלִי
  choice: na taga-Carmel
  rationale: Ang pang-uri para sa pinagmulan na may pantukoy ay tumutukoy sa isang taong mula o kabilang sa Carmel. Mas natural at malinaw ito sa modernong Tagalog kaysa sa transliterasyong maaaring mapagkamalang tumutukoy sa isang orden ng relihiyon.
- source_word: נַעֲרַי
  choice: Naarai
  rationale: Tuwirang pagsasatinig sa pangalang Hebreo, na pinananatili ang natatanging anyo sa Cronica.
- source_word: בֶּן
  choice: anak ni
  rationale: Sa talaan ng mga pangalan, ang literal na ugnayang 'anak ni' ang pinakanatural; walang dahilan sa konteksto upang palawakin ito bilang 'inapo ni.'
- source_word: אֶזְבָּי
  choice: Ezbai
  rationale: Tuwirang pagsasatinig sa anyong Hebreo ng pangalan.
