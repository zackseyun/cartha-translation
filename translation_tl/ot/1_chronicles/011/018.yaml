  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יִּבְקְע֨וּ הַ/שְּׁלֹשָׁ֜ה בְּ/מַחֲנֵ֣ה פְלִשְׁתִּ֗ים וַ/יִּֽשְׁאֲבוּ מַ֨יִם֙ מִ/בּ֤וֹר בֵּֽית לֶ֨חֶם֙ אֲשֶׁ֣ר בַּ/שַּׁ֔עַר וַ/יִּשְׂא֖וּ וַ/יָּבִ֣אוּ אֶל דָּוִ֑יד וְ/לֹֽא אָבָ֤ה דָוִיד֙ לִ/שְׁתּוֹתָ֔/ם וַ/יְנַסֵּ֥ךְ אֹתָ֖/ם לַ/יהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/018.yaml
  text: So the three broke through into the camp of the Philistines and drew water from the well of Bethlehem that was by the gate[a], and carried it and brought it to David. But David was not willing to drink it; instead, he poured it out to Yahweh.
translation:
  language: tl
  text: Kaya nagpilit makalusot ang tatlo sa kampo ng mga Filisteo. Sumalok sila ng tubig mula sa balon sa Betlehem na nasa tabi ng pintuang-bayan, pinasan iyon, at dinala kay David. Ngunit ayaw itong inumin ni David; sa halip, ibinuhos niya iyon para kay Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas tahasan, “ibinuhos niya iyon bilang handog na inumin kay Yahweh.” Maaaring tumukoy ang pandiwang Hebreo sa ritwal na pagbubuhos bilang handog.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבְקְעוּ
  choice: nakapasok ... matapos nilang lusutan ang mga bantay
  rationale: Sa kontekstong militar, ipinahihiwatig ng pandiwa ang sapilitang paglusot sa hanay o depensa ng kaaway. Likas sa modernong Tagalog ang 'lusutan,' bagaman ang 'mga bantay' ay ipinahiwatig lamang ng konteksto ng kampo.
- source_word: הַשְּׁלֹשָׁה
  choice: ang tatlo
  rationale: Tanging 'ang tatlo' ang nasa Hebreo; hindi idinagdag sa salin ang 'magigiting na mandirigma,' na mula sa mas malawak na konteksto.
- source_word: בְּמַחֲנֵה פְלִשְׁתִּים
  choice: sa kampo ng mga Filisteo
  rationale: Direkta at natural na katumbas ng pariralang Hebreo sa konteksto ng pagpasok sa kuta ng kaaway.
- source_word: וַיִּשְׁאֲבוּ מַיִם
  choice: sumalok sila ng tubig
  rationale: Ang 'sumalok ng tubig' ang karaniwang modernong Tagalog para sa pagkuha ng tubig mula sa balon.
- source_word: מִבּוֹר בֵּית לֶחֶם אֲשֶׁר בַּשַּׁעַר
  choice: mula sa balon sa Betlehem na malapit sa pintuang-bayan
  rationale: Maaaring mangahulugang hukay, imbakan ng tubig, o balon ang בּוֹר. Dahil sumalok sila ng maiinom na tubig, 'balon' ang pinakaangkop. Nililinaw ng 'pintuang-bayan' na ang tinutukoy ay pasukan ng bayan.
- source_word: וַיִּשְׂאוּ
  choice: binuhat iyon
  rationale: Sa sunod-sunod na kilos, tumutukoy ito sa pagdadala ng tubig; ang 'iyon' ay likas na pantukoy sa tubig sa Tagalog.
- source_word: וַיָּבִיאוּ אֶל דָּוִיד
  choice: dinala kay David
  rationale: Payak na pagsasalin ng kilos at patutunguhan nang hindi idinaragdag ang 'pabalik,' na ipinahihiwatig lamang ng konteksto.
- source_word: וְלֹא אָבָה דָוִיד לִשְׁתּוֹתָם
  choice: ayaw itong inumin ni David
  rationale: Ipinapahayag ng אָבָה ang pagkukusa o pagpayag. Natural at malinaw ang 'ayaw itong inumin' nang hindi pinatitindi sa mas tahasang 'tumanggi.' Bagaman maramihan ang hulapi sa Hebreo, pang-isahan ang natural na pagtukoy sa tubig sa Tagalog.
- source_word: וַיְנַסֵּךְ אֹתָם לַיהוָה
  choice: ibinuhos niya iyon para kay Yahweh
  rationale: Pinananatili sa pangunahing teksto ang nakikitang kilos ng pagbubuhos. Maaaring taglay ng נסך ang kahulugang ritwal na pagbubuhos bilang handog, kaya inilagay ang mahalagang pahiwatig na iyon sa talababa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang transliterasyon ng banal na pangalan sa halip na palitan ito ng titulong 'PANGINOON.'
theological_decisions:
- issue: Ang ritwal o panghandog na kahulugan ng pagbubuhos ni David
  choice: Ilarawan sa pangunahing teksto ang kongkretong kilos bilang 'ibinuhos niya iyon para kay Yahweh,' at ipaliwanag sa talababa ang posibleng kahulugang handog na inumin.
  alternative: Isalin nang tahasan bilang 'ibinuhos niya iyon bilang handog na inumin kay Yahweh.'
  rationale: May pangsakripisyong puwersa ang pandiwang Hebreo, ngunit malinaw ring inilalarawan ng salaysay ang aktuwal na pagbubuhos. Pinananatili ng pangunahing teksto ang dalawang antas nang hindi lubusang ipinapasya ang pahiwatig, habang inilalahad ng talababa ang ritwal na kahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal ang himig. Ginamit ang 'Filisteo,' 'Betlehem,' at 'pintuang-bayan' bilang pamilyar ngunit dignified na mga anyo. Iniwasan ang labis na teknikal na 'libasyon' sa teksto at talababa.
