base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/004.yaml
  text: Then David and all Israel went to Jerusalem—that is[a], Jebus—where the Jebusites, the inhabitants of the land, were.
translation:
  language: tl
  text: Pagkatapos, pumunta si David at ang buong Israel sa Jerusalem—na siyang Jebus—kung saan naroon ang mga Jebuseo, mga naninirahan sa lupain.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo: “at doon ang Jebuseo, mga naninirahan sa lupain.” Ang “Jebuseo” ay anyong isahan na ginagamit bilang katawagang kolektibo, kaya isinaling “mga Jebuseo.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: Pagkatapos, pumunta
  rationale: Isinusulong ng waw-consecutive ang salaysay; natural na ipinahahayag ng “Pagkatapos” ang pagkakasunod-sunod ng pangyayari.
- source_word: וְכָל יִשְׂרָאֵל
  choice: at ang buong Israel
  rationale: Tuwirang pinananatili ang pang-ugnay at ang kolektibong katawagan sa bansang Israel.
- source_word: יְרוּשָׁלִַם הִיא יְבוּס
  choice: sa Jerusalem—iyon ay ang Jebus
  rationale: Ipinakikilala ng panghalip na הִיא ang Jerusalem sa mas naunang pangalan nitong Jebus; malinaw at natural sa Filipino ang paliwanag na nakapagitna sa gatlang.
- source_word: וְשָׁם
  choice: kung saan naroon
  rationale: Natural na inuugnay sa Filipino ang kasunod na paglalarawan sa lugar, habang pinananatili ang diwang literal na “at doon.”
- source_word: הַיְבוּסִי
  choice: ang mga Jebuseo
  rationale: Bagaman anyong isahan sa Hebreo, kolektibo ang gamit nito rito, gaya ng ipinakikita ng kasunod na pandiwaring maramihan; kaya maramihan ang likas na salin sa Filipino.
- source_word: יֹשְׁבֵי הָאָרֶץ
  choice: ang mga naninirahan sa lupain
  rationale: Pinananatili nito ang participial na diwa ng mga taong naninirahan at ang tuwirang kahulugan ng אָרֶץ bilang lokal na lupain.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Jebuseo” bilang likas na pangalang-etniko sa Tagalog at pinanatili ang “Jebus” bilang pangalan ng lugar. Ang “lupain” ay tumutukoy sa lokal na teritoryong tinitirhan ng mga Jebuseo.
