  register: Makabago ngunit marangal na Filipino. Ginamit ang karaniwang hulaping Filipino na “-ita” para sa katawagang tumutukoy sa pinanggalingang lugar o angkan. Inilagay ang talababa sa “Tizita,” ang salitang aktuwal na may alternatibong pagbasa.
