  source_fidelity: 'Tapat ang salin sa Hebreo: naipapahayag nito si Jediael bilang anak ni Simri at si Joha bilang kaniyang kapatid, na tinutukoy bilang Tizita. Hindi pinalalawak ang אָחִיו bilang mas malawak na kamag-anak, at nananatiling hindi tiyak ang batayan—lugar man o angkan—ng gentilicio.'
