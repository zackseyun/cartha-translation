base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/045.yaml
  text: Jediael son of Shimri[a], and Joha his brother, the Tizite;
translation:
  language: tl
  text: Si Jediael na anak ni Simri, at ang kapatid niyang si Joha, na Tizita[a];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Posible ring “Zizita,” depende sa pagbigkas at sa pag-uugnay sa הַתִּיצִי bilang pangalan ng isang lugar o angkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְדִיעֲאֵל
  choice: Jediael
  rationale: Pangalan ng tao; tinumbasan sa pamamagitan ng tuwirang transliterasyon sa paraang madaling basahin sa Filipino.
- source_word: בֶּן
  choice: anak ni
  rationale: Sa konteksto ng talaan, pinakanatural itong tumutukoy sa tuwirang ugnayan ng ama at anak.
- source_word: שִׁמְרִי
  choice: Simri
  rationale: Pangalan ng tao; ginamit ang anyong transliterado na angkop sa baybay at bigkas sa Filipino.
- source_word: וְיֹחָא
  choice: at … si Joha
  rationale: Isinalin ang pang-ugnay at tinranslitera ang pangalan nang hindi dinaragdagan ang kahulugan.
- source_word: אָחִיו
  choice: ang kapatid niyang
  rationale: Ang payak at pangunahing kahulugan ng אָח sa kontekstong ito ay kapatid; walang sapat na dahilan upang gawing mas malawak na “kamag-anak.”
- source_word: הַתִּיצִי
  choice: na Tizita
  rationale: Tawag ito batay sa angkan o pinanggalingang lugar. Pinanatili ang gayong pagtukoy nang hindi ipinapalagay kung alin ang tiyak na lugar o angkan.
