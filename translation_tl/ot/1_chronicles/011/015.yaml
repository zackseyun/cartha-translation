base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/015.yaml
  text: Then three of the thirty chiefs went down to the rock[a], to David, at the cave of Adullam, while the camp of the Philistines was encamped in the Valley of Rephaim.
translation:
  language: tl
  text: At bumaba ang tatlo sa tatlumpung pinuno sa bato[a], kay David, sa yungib ng Adulam, habang nakahimpil ang kampo ng mga Filisteo sa Lambak ng Refaim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas pormal, “bumaba ang tatlo sa tatlumpung pinuno sa ibabaw ng bato, kay David, patungo sa yungib ng Adulam.” Masinsin at maaaring unawain sa iba’t ibang paraan ang pagkakaayos ng pangungusap sa Hebreo; sa pangunahing teksto, nililinaw ng “sa yungib ng Adulam” ang kinaroroonan ni David.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרְדוּ
  choice: At bumaba
  rationale: Karaniwang salaysay na anyo ng ירד; pinananatili ng “bumaba” ang direksiyonal na diwa.
- source_word: שְׁלוֹשָׁה מִן־הַשְּׁלוֹשִׁים רֹאשׁ
  choice: ang tatlo sa tatlumpung pinuno
  rationale: Ipinakikitang ang tatlo ay kabilang sa kilalang pangkat ng tatlumpu; ang “pinuno” ay natural at hindi nagtatakda ng mas tiyak na ranggong militar kaysa sa Hebreo.
- source_word: עַל־הַצּוּר
  choice: papunta sa malaking bato
  rationale: Maaaring tumukoy ang עַל sa paggalaw patungo o paibabaw sa isang batuhan; pinananatili ng salin ang kongkretong topograpikong sanggunian nang hindi ito ginagawang “kuta.”
- source_word: אֶל־דָּוִיד אֶל־מְעָרַת עֲדֻלָּם
  choice: kay David, sa yungib ng Adulam
  rationale: Ang unang אֶל ay malinaw na direksiyon kay David; ang ikalawa ay isinasaad nang lokatibo upang natural na ipaliwanag kung nasaan siya, habang itinatala sa talababa ang mas pormal na ayos.
- source_word: וּמַחֲנֵה פְלִשְׁתִּים חֹנָה
  choice: habang nagkakampo ang hukbo ng mga Filisteo
  rationale: Ang sugnay ay nagbibigay ng kasabay na kalagayan. Sa konteksto, ang מַחֲנֶה ay tumutukoy sa nagkampong puwersa, kaya natural ang “hukbo” sa Filipino.
- source_word: בְּעֵמֶק רְפָאִים
  choice: sa Lambak ng Refaim
  rationale: Pangalan ng lugar; isinalin ang karaniwang pangngalan at tinransliterado ang Refaim.
