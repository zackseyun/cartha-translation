  naturalness: Natural at marangal ang ayos ng pangungusap. Mas natural at mas tumpak na gamitin ang “habang nakahimpil ang kampo ng mga Filisteo” kaysa “habang nagkakampo ang hukbo ng mga Filisteo,” sapagkat inilalarawan ng Hebreong pandiwari ang nagpapatuloy na kalagayan.
  terminology: Ang “yungib,” “Adulam,” at “Lambak ng Refaim” ay angkop. Ang “kampo” ang pinakamalapit na katumbas ng מַחֲנֶה sa talatang ito. Pinananatili ang “pinuno” para sa רֹאשׁ nang hindi nagpapataw ng isang partikular na ranggong militar.
