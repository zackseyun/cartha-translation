id: 1CH.11.8
reference: 1 Chronicles 11:8
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יִּ֤בֶן הָ/עִיר֙ מִ/סָּבִ֔יב מִן הַ/מִּלּ֖וֹא וְ/עַד הַ/סָּבִ֑יב וְ/יוֹאָ֕ב יְחַיֶּ֖ה אֶת שְׁאָ֥ר הָ/עִֽיר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/008.yaml
  text: He built the city all around[a], from the Millo even to the surrounding area[b], and Joab restored the rest of the city.
translation:
  language: tl
  text: Itinayo ni David ang lunsod sa buong palibot, mula sa Milo[a] hanggang sa nakapalibot na lugar; at ipinanumbalik ni Joab ang natitirang bahagi ng lunsod.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “Milo” ay isang katawagang pangheograpiya sa Jerusalem na hindi tiyak ang eksaktong kahulugan. Maaaring tumukoy ito sa isang estrukturang patong-patong o sa isang bahaging pinunô ng lupa.
    reason: cultural_note
  - marker: b
    text: Sa literal, “binuhay ni Joab ang natitirang bahagi ng lunsod”; malamang na idyoma ito para sa pagpapanumbalik o pagsasaayos nito.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶן
  choice: Itinayo ni David
  rationale: Ang Qal wayyiqtol ng בנה ay karaniwang nangangahulugang “nagtayo.” Ginawang tahas ang paksang si David mula sa naunang talata upang maging malinaw at natural sa Filipino, nang hindi ipinapalagay ang mas tiyak na “muling itinayo.”
- source_word: הָעִיר
  choice: ang lunsod
  rationale: Karaniwang tawag ang עִיר sa isang lungsod o lunsod; ang “lunsod” ay dignificado at angkop sa Jerusalem sa salaysay na ito.
- source_word: מִסָּבִיב
  choice: sa buong palibot
  rationale: Ipinahahayag ng pang-abay na סָבִיב ang saklaw sa palibot; natural na naihahatid ito ng “sa buong palibot.”
- source_word: מִן הַמִּלּוֹא
  choice: mula sa Milo
  rationale: Pinanatili ang מִלּוֹא bilang pangalang pangheograpiya sapagkat hindi tiyak ang eksaktong tinutukoy nito; iniiwasang ipataw sa pangunahing teksto ang interpretasyong “teras” o “tambak.”
- source_word: וְעַד הַסָּבִיב
  choice: hanggang sa nakapalibot na lugar
  rationale: Siksik at medyo malabo ang pariralang Hebreo. Ang saling ito ay natural na nagpapakita ng hangganan o lawak ng pagtatayo nang hindi labis na tinutukoy ang topograpiya.
- source_word: וְיוֹאָב
  choice: at ... ni Joab
  rationale: Pinanatili ang karaniwang anyong Filipino ng pangalang Joab at ang ugnayang pasalaysay na ipinahihiwatig ng וְ.
- source_word: יְחַיֶּה
  choice: ipinanumbalik
  rationale: Ang Piel ng חיה ay literal na “binuhay” o “ginawang buhay.” Kapag lunsod ang layon, malamang na idyomatiko itong tumutukoy sa pagpapanumbalik o pagsasaayos; ang “ipinanumbalik” ay mas natural kaysa “binuhay” ngunit pinananatili sa talababa ang literal na larawan.
- source_word: אֶת שְׁאָר הָעִיר
  choice: ang natitirang bahagi ng lunsod
  rationale: Tumpak at natural na katumbas ito ng שְׁאָר הָעִיר, “ang nalalabi o natitirang bahagi ng lunsod.”
theological_decisions: []
translation_notes:
  register: Modernong Filipino na dignificado at madaling maunawaan. Tahasang binanggit si David, na siyang paksa mula sa naunang talata, upang maiwasan ang malabong panghalip. Pinanatili ang “Milo” bilang hindi tiyak na katawagang topograpiko, at inilagay sa talababa ang literal na larawan ng pandiwang “ginawang buhay.”
