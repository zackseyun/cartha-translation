  text: גַּם תְּמ֣וֹל גַּם שִׁלְשׁ֗וֹם גַּ֚ם בִּ/הְי֣וֹת שָׁא֣וּל מֶ֔לֶךְ אַתָּ֛ה הַ/מּוֹצִ֥יא וְ/הַ/מֵּבִ֖יא אֶת יִשְׂרָאֵ֑ל וַ/יֹּאמֶר֩ יְהוָ֨ה אֱלֹהֶ֜י/ךָ לְ/ךָ֗ אַתָּ֨ה תִרְעֶ֤ה אֶת עַמִּ/י֙ אֶת יִשְׂרָאֵ֔ל וְ/אַתָּה֙ תִּהְיֶ֣ה נָגִ֔יד עַ֖ל עַמִּ֥/י יִשְׂרָאֵֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/002.yaml
  text: Even in times past[a], even before, when Saul was king, you were the one who led Israel out and brought them in; and Yahweh your God said to you, ‘You shall shepherd my people Israel[c][b], and you shall be ruler over my people Israel.’
translation:
  language: tl
  text: Noon pa man[a], noong hari pa si Saul, ikaw ang nangunguna sa Israel sa kanilang paglabas at pagpasok[b]. At sinabi sa iyo ni Yahweh na iyong Diyos, “Ikaw ang magpapastol sa bayan kong Israel, at ikaw ang magiging pinuno[c] ng bayan kong Israel.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “kahapon at bago ang kahapon,” isang idyomang Hebreo na nangangahulugang “noong una” o “sa mga panahong lumipas.”
    reason: lexical_alternative
  - marker: b
    text: Sa mas literal na pagkakasabi, “ikaw ang naglalabas at nagpapapasok sa Israel,” isang pahayag na tumutukoy sa pangunguna sa bayan.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “tagapamahala” o “prinsipe.” Ang salitang Hebreo rito ay hindi ang karaniwang salita para sa “hari.”
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם תְּמוֹל גַּם שִׁלְשׁוֹם
  choice: Noon pa man
  rationale: Ang literal na “kahapon at noong makalawang araw” ay isang idyomang Hebreo para sa panahong lumipas. Natural na ipinahahayag ng “Noon pa man” ang dating panahon at ang diin ng pahayag.
- source_word: בִּהְיוֹת שָׁאוּל מֶלֶךְ
  choice: kahit noong si Saul ang hari
  rationale: Ang בְּ na kasama ng infinitive construct ay bumubuo ng sugnay na panahunan. Ipinagpapatuloy ng “kahit noong” ang diin ng magkakasunod na גַּם.
- source_word: אַתָּה הַמּוֹצִיא וְהַמֵּבִיא אֶת יִשְׂרָאֵל
  choice: ikaw ang nangunguna sa Israel sa kanilang paglabas at pagpasok
  rationale: Pinananatili nito ang larawan ng paglabas at pagpasok, habang nililinaw ang gamit nito bilang pahayag tungkol sa pamumuno ni David sa bayan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang transliterasyon ng personal na pangalang Hebreo sa halip na palitan ito ng titulong “PANGINOON.”
- source_word: תִרְעֶה
  choice: magpapastol
  rationale: Pinananatili ang tahasang metapora ng pastol na ginagamit para sa maharlika at mapagkalingang pamumuno.
- source_word: נָגִיד
  choice: pinuno
  rationale: Ang נָגִיד ay tumutukoy sa itinalagang namumuno ngunit hindi kapareho ng karaniwang salitang Hebreo para sa “hari” (מֶלֶךְ). Iniiwasan ng “pinuno” na pag-isahin ang dalawang katawagan.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo; pinananatili ito sa transliterasyon nang hindi pinapalitan ng isang titulo.
- issue: Metapora ng pamumuno sa תִרְעֶה
  choice: magpapastol
  alternative: mamumuno o mag-aalaga
  rationale: Pinananatili ng “magpapastol” ang pastoral at maharlikang larawan ng orihinal sa halip na paliitin ito sa pangkalahatang gawain ng pamamahala.
- issue: Pagkakaiba ng נָגִיד at מֶלֶךְ
  choice: pinuno
  alternative: hari, prinsipe, o tagapamahala
  rationale: Hindi tinatawag na מֶלֶךְ si David sa hulang ito. Ang “pinuno” ay sapat na malawak upang mapanatili ang saklaw ng נָגִיד at ang pagkakaiba nito sa “hari” na ginamit para kay Saul.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang larawan ng pastol at, sa tulong ng talababa, ang idyoma ng paglabas at pagpasok. Ginamit ang “bayan” para sa עַם at “pinuno” para sa נָגִיד upang manatili ang pagkakaiba nito sa “hari.”
