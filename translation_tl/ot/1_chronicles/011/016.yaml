  yaml_path: translation/ot/1_chronicles/011/016.yaml
  text: David was in the stronghold[b][a], and the garrison of the Philistines was then in Bethlehem.
translation:
  language: tl
  text: Noon[a] ay nasa kuta[b] si David, at noon ay nasa Betlehem ang garison ng mga Filisteo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Inulit sa Hebreo ang “noon” sa dalawang sugnay: “Noon ay nasa kuta si David, at noon ay nasa Betlehem ang garison ng mga Filisteo.”'
    reason: source_structure
  - marker: b
    text: O “muog.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מְּצוּדָה
  choice: kuta
  rationale: Tumutukoy ito sa isang pinatibay at maipagtatanggol na lugar. Ang “kuta” ay natural at malinaw sa makabagong Filipino, habang pinananatili ang kongkretong diwang militar ng salita.
- source_word: נְצִיב
  choice: garison
  rationale: Sa kontekstong ito, tumutukoy ang salita sa puwersang militar na nakatalaga sa isang lugar, hindi sa isang gobernador o opisyal na sibil. Tumpak na ipinahihiwatig ng “garison” ang puwersang sumasakop o nagbabantay sa Betlehem.
- source_word: פְּלִשְׁתִּים
  choice: mga Filisteo
  rationale: Ito ang kinagawiang Filipino na pangalan para sa pangkat ng mga tao.
- source_word: בְּבֵית לָחֶם
  choice: nasa Betlehem
  rationale: Ang pang-ukol na בְּ ay nagsasaad ng lokasyon; natural sa Filipino ang hulmaing “nasa Betlehem.”
- source_word: אָז ... אָז
  choice: noon ... noon
  rationale: Inulit sa Hebreo ang temporal na salita sa dalawang sugnay. Pinanatili ang pag-uulit upang maipakita ang magkasabay na kalagayan ni David at ng garison ng mga Filisteo.
- source_word: וְדָוִיד
  choice: si David
  rationale: Hindi na isinalin nang hiwalay ang panimulang waw bilang “at” sapagkat ang unang sugnay ay likas na nagsisimula sa “Noon” sa Filipino; ang ugnayan ng mga sugnay ay malinaw na ipinahahayag ng “at” sa ikalawang sugnay.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang pag-uulit ng “noon” dahil kapansin-pansin at makahulugan ito sa estruktura ng Hebreo. Ginamit ang “garison” bilang tiyak na terminong militar; hindi ito pinalitan ng mas malabong “himpilan,” na maaaring tumukoy lamang sa lugar at hindi sa puwersang nakatalaga roon.
