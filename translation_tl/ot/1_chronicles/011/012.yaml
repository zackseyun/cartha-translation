  text: וְ/אַחֲרָ֛י/ו אֶלְעָזָ֥ר בֶּן דּוֹד֖וֹ הָ/אֲחוֹחִ֑י ה֖וּא בִּ/שְׁלוֹשָׁ֥ה הַ/גִּבֹּרִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/012.yaml
  text: After him was Eleazar son of Dodo the Ahohite[a]; he was among the three mighty men.
translation:
  language: tl
  text: Kasunod niya si Eleazar na anak ni Dodo, na Ahohita. Kabilang siya sa tatlong magigiting na mandirigma.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “isa siya sa tatlong magigiting na mandirigma.” Maaaring tukuyin ng pananalitang Hebreo ang pagiging kasapi sa natatanging pangkat ng tatlo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחֲרָיו
  choice: Kasunod niya
  rationale: Ipinahihiwatig ng parirala ang pagkakasunod sa talaan ng mga mandirigma. Likas ito sa modernong Tagalog at hindi nagpapahiwatig ng pisikal na pagkatabi.
- source_word: אֶלְעָזָר
  choice: Eleazar
  rationale: Isinalin sa pamamagitan ng karaniwang transliterasyon ng pangalang pantangi.
- source_word: בֶּן
  choice: anak ni
  rationale: Ang tuwirang ugnayang ama at anak ang pinakanatural sa konteksto ng talaan.
- source_word: דּוֹדוֹ
  choice: Dodo
  rationale: Sinusunod nito ang anyo ng pangalang nasa tekstong Hebreo sa talatang ito.
- source_word: הָאֲחוֹחִי
  choice: Ahohita
  rationale: Pinananatili bilang transliteradong katawagan sa angkan o pinagmulan, gamit ang likas na hulaping Filipino para sa ganitong katawagan.
- source_word: הוּא בִּשְׁלוֹשָׁה
  choice: Kabilang siya sa tatlo
  rationale: Ipinahahayag ng pang-ukol at bilang ang pagiging kasapi sa isang kilalang pangkat, nang hindi dinaragdagan ang sinasabi ng Hebreo.
- source_word: הַגִּבֹּרִים
  choice: magigiting na mandirigma
  rationale: Pinananatili ang diwa ng lakas at katapangan habang malinaw na ipinakikitang mga mandirigma ang tinutukoy.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “Kasunod niya” para sa natural na daloy ng talaan at “magigiting na mandirigma” upang mapanatili kapuwa ang militar na diwa at ang natatanging katangian ng pangkat.
