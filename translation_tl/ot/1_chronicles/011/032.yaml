translation_notes:
  register: Ginamit ang maikli at marangal na anyo ng talaan ng mga pangalan. Moderno at madaling maunawaan ang “mga lambak,” samantalang pinanatili sa talababa ang heograpikal na lawak at kalabuan ng salitang Hebreo. Inilagay ang mga pananda ng talababa sa mismong salitang tinutukoy ng bawat tala.
