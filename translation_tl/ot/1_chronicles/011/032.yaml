  text: Hurai from the wadis of Gaash[b][a], Abiel the Arbathite.
translation:
  language: tl
  text: Si Hurai na mula sa mga lambak ng Gaas[a], si Abiel na Arbatita.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mula sa mga bangin ng Gaas,” “mula sa mga batis ng Gaas,” o “mula sa mga agusan ng Gaas.” Ang salitang Hebreo ay maaaring tumukoy sa lambak o bangin na dinadaluyan ng tubig, lalo na kapag umuulan.
    reason: lexical_alternative
  - marker: b
    text: Ang “Arbatita” ay katawagang nagsasaad na si Abiel ay mula sa o kaugnay ng Arbat, na maaaring may kaugnayan sa Araba.
    reason: cultural_note
lexical_decisions:
- source_word: חוּרַי
  choice: Hurai
  rationale: Pangalang pantangi; tinumbasan sa paraang transliterasyon at pinanatili ang kinikilalang anyong Hurai.
- source_word: מִנַּחֲלֵי
  choice: mula sa mga lambak ng
  rationale: Ang נחל ay maaaring tumukoy sa lambak, bangin, batis, o tuyong agusan na dinadaluyan ng tubig kapag umuulan. Pinili ang “mga lambak” bilang malinaw at likas na salin sa modernong Filipino, habang inilalahad sa talababa ang lawak ng kahulugan.
- source_word: גָעַשׁ
  choice: Gaas
  rationale: Pangalan ng lugar; isina-Filipino ang transliterasyon, kung saan ang tunog na Hebreong sh ay karaniwang kinakatawan ng s.
- source_word: אֲבִיאֵל
  choice: Abiel
  rationale: Pangalang pantangi; tuwirang transliterasyon na natural basahin sa Filipino.
- source_word: הָעַרְבָתִי
  choice: Arbatita
  rationale: Pang-uring gentiliko na nagsasaad ng pinagmulan o kaugnayan sa Arbat; ginamit ang hulaping “-ita,” na likas sa tradisyong biblikal sa Filipino, nang hindi tiyakang ipinapakahulugan ang lokasyon.
