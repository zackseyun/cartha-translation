base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/006.yaml
  text: And David said[a], “Whoever strikes down a Jebusite first shall become chief and commander.” So Joab son of Zeruiah went up first[b], and he became chief.
translation:
  language: tl
  text: Sinabi ni David, “Ang sinumang unang tumalo sa isang Jebuseo ay magiging pinuno at kumander.[a]” Kaya si Joab na anak ni Zeruia ang unang umakyat,[b] at siya ay naging pinuno.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa mas literal na salin, “magiging ulo at kumander.”
    reason: lexical_alternative
  - marker: b
    text: Maaaring ipinahihiwatig ng “umakyat” ang pagsalakay paakyat sa kuta, ngunit “umakyat” lamang ang mismong sinasabi ng Hebreo.
    reason: cultural_note
lexical_decisions:
- source_word: כָּל מַכֵּה יְבוּסִי
  choice: Ang sinumang ... tumalo sa isang Jebuseo
  rationale: Ang כָּל na kasunod ang participle ay gumaganap bilang di-tiyak na panghalip na panumbas sa “sinuman.” Sa kontekstong militar, ang נכה ay tumutukoy sa paggapi o pagpapabagsak; natural na ipinahahayag ito ng “tumalo.” Ang isahang יְבוּסִי ay ginawang pangkalahatang “isang Jebuseo.”
- source_word: בָּרִאשׁוֹנָה
  choice: unang
  rationale: Ipinahihiwatig ng gamit na pang-abay ang pagiging una sa pagkilos, at likas itong naihahayag sa Filipino sa pamamagitan ng “unang.”
- source_word: יִהְיֶה לְרֹאשׁ וּלְשָׂר
  choice: ay magiging pinuno at kumander
  rationale: Ang היה + ל ay nagsasaad ng pagkakaroon ng isang katayuan, kaya “magiging.” Ang רֹאשׁ ay tumutukoy sa pangunahing pinuno, samantalang ang שַׂר sa kontekstong ito ay isang opisyal o kumander. Pinananatili ng salin ang dalawang magkaugnay ngunit magkahiwalay na katawagan.
- source_word: וַיַּעַל
  choice: umakyat
  rationale: Ang עלה ay literal na “umakyat.” Bagaman maaaring ipahiwatig ng kontekstong militar ang pagsalakay paakyat sa kuta, hindi iyon tahasang sinasabi ng pandiwa, kaya pinanatili ang mas payak na kahulugan.
- source_word: יוֹאָב בֶּן צְרוּיָה
  choice: Joab na anak ni Zeruia
  rationale: Karaniwan at natural na paraan ito sa Filipino ng pagpapahayag ng ugnayang binabanggit ng Hebreong בֶּן.
- source_word: וַיְהִי לְרֹאשׁ
  choice: at siya ay naging pinuno
  rationale: Inuulit nito ang רֹאשׁ sa naunang pangako, kaya inuulit din ang “pinuno.” Hindi idinagdag ang “kumander” dahil רֹאשׁ lamang ang nasa hulíng sugnay.
theological_decisions: []
translation_notes:
  register: Gumamit ng makabago, malinaw, at marangal na Filipino. Pinanatili ang konkretong pandiwang “umakyat” upang hindi gawing tahasang “sumalakay” ang ipinahihiwatig lamang ng konteksto. Inilagay ang talababa [a] pagkatapos ng katumbas nitong parirala, hindi pagkatapos ng “Sinabi ni David,” sapagkat tungkol ito sa mga katawagang רֹאשׁ at שָׂר.
