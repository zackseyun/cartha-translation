  text: Sibbecai the Hushathite[a], Ilai the Ahohite.
translation:
  language: tl
  text: Si Sibecai na Husatita, si Ilai na Ahohita.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ilai” ang mababasa sa tekstong Hebreo ng 1 Cronica 11:29. “Irai” ang mababasa sa ilang salin, dahil sa impluwensiya ng kahawig na tala sa 2 Samuel 23:26.
    reason: alternative_reading
lexical_decisions:
- source_word: סִבְּכַי
  choice: Sibecai
  rationale: Pangalang pantangi; tinumbasan sa baybay na madaling basahin sa modernong Filipino habang pinananatili ang anyong Hebreo.
- source_word: הַחֻשָׁתִי
  choice: na Husatita
  rationale: Katawagan sa pinagmulan o angkan na may tiyak na pantukoy; ginamit ang hulaping -ita, na likas sa Filipino para sa ganitong katawagan.
- source_word: עִילַי
  choice: Ilai
  rationale: Direktang transliterasyon ng pangalang nasa tekstong Hebreo ng 1 Cronica 11:29; hindi ito pinalitan ng Irai mula sa kahawig na tala sa 2 Samuel 23:26.
- source_word: הָאֲחוֹחִי
  choice: na Ahohita
  rationale: Katawagan sa angkan na may tiyak na pantukoy; pinanatili ang pangalang Ahoh at ginamit ang natural na hulaping Filipino na -ita.
theological_decisions: []
translation_notes:
  register: Maikli at marangal na anyo para sa talaan ng mga pangalan. Inulit ang “si” upang maging malinaw at natural sa modernong Filipino. Inilagay ang talababa pagkatapos ng buong sugnay, ngunit malinaw na tumutukoy ito sa pangalang Ilai.
