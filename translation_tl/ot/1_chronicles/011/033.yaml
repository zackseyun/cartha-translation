  text: Azmaveth the Baharumite[a], Eliyahba the Shaalbonite.
translation:
  language: tl
  text: Si Azmavet na Baharumita[a], at si Eliyahba na Shaalbonita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “Baharumita”; maaaring kaugnay ito ng Bahurim, kaya maaari ring “Bahurimita.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עַזְמָוֶת
  choice: Azmavet
  rationale: Pangalan ng tao; tuwirang transliterasyon sa paraang natural sa modernong Filipino, kung saan hindi kailangang panatilihin ang h sa hulí ng anyong Ingles na Azmaveth.
- source_word: הַבַּחֲרוּמִי
  choice: Baharumita
  rationale: May artikulo at pang-uring tumutukoy sa lugar o angkan. Pinananatili ng 'Baharumita' ang anyong binigkas sa Masoretic Text, samantalang inilalahad sa talababa ang posibleng kaugnayan nito sa Bahurim.
- source_word: אֶלְיַחְבָּא
  choice: Eliyahba
  rationale: Pangalan ng tao; transliterasyong malapit sa anyong Hebreo at malinaw na pinananatili ang bahaging 'Yah' ng pangalan.
- source_word: הַשַּׁעַלְבֹנִי
  choice: Shaalbonita
  rationale: Pang-uring tumutukoy sa pinagmulang lugar. Ang hulaping '-ita' ay likas na paraan sa Filipino upang tukuyin ang isang taong mula sa isang pook, habang pinananatili ang pangalang Shaalbon.
theological_decisions: []
translation_notes:
  register: Maikli at marangal ang anyo, angkop sa talaan ng mga pangalan. Ginamit ang 'Si ... na ...' upang maging natural sa Filipino habang malinaw na iuugnay ang bawat tao sa kaniyang lugar o angkan.
