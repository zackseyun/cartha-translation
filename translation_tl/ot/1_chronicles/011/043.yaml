  text: Hanan son of Maacah[a], and Joshaphat the Mithnite;
translation:
  language: tl
  text: Si Hanan na anak ni Maaca, at si Josafat na Mitnita.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חָנָן
  choice: Hanan
  rationale: Pangalan ng tao; itinumbas sa baybay na madaling basahin sa modernong Filipino habang malapit sa anyong Hebreo.
- source_word: בֶּן
  choice: anak ni
  rationale: Karaniwang Filipino na pahayag para sa patronimikong Hebreong tumutukoy sa pinagmulan o angkan.
- source_word: מַעֲכָה
  choice: Maaca
  rationale: Pangalan ng tao; ginamit ang natural na transliterasyong Filipino. Hindi nilinaw kung lalaki o babae ang tinutukoy sapagkat hindi iyon tahasang ipinapakita ng parirala.
- source_word: וְיוֹשָׁפָט
  choice: at si Josafat
  rationale: Isinalin ang pang-ugnay at ginamit ang transliterasyong Filipino ng mas maikling anyong Hebreo na Yošafat.
- source_word: הַמִּתְנִי
  choice: na Mitnita
  rationale: Gentiliko o katawagang nagsasaad ng kaugnayan sa isang lugar o angkan; ang hulaping -ita ay natural sa Filipino para sa ganitong katawagan.
