  register: Maikli at pormal na estilo na angkop sa talaan ng mga mandirigma. Ginamit ang mga pangalang may karaniwang baybay-Filipino at pinanatili ang hindi tiyak na uri ng ugnayang ipinahihiwatig ng gentiliko.
