translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang pag-uulit sa “tatlo” bilang katawagan sa natatanging pangkat at nilinaw lamang ang diwa ng ranggo sa huling sugnay.
