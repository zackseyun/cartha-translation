  yaml_path: translation/ot/1_chronicles/011/021.yaml
  text: He was more honored than the two among the three[a], and he became their commander; but he did not attain to the three.
translation:
  language: tl
  text: Higit siyang pinarangalan kaysa sa dalawa sa pangkat ng tatlo[a], at siya ang naging pinuno nila; ngunit hindi niya naabot ang antas ng tatlo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “Higit siyang pinarangalan kaysa sa tatlo dahil sa dalawa.” Siksik at mahirap unawain ang Hebreo; ang diwa ay mataas ang karangalan niya sa isang pangkat na may mga antas, ngunit hindi niya napantayan ang “tatlo.”'
    reason: alternative_reading
lexical_decisions:
- source_word: מִן הַשְּׁלוֹשָׁה בַשְּׁנַיִם
  choice: kaysa sa dalawa sa tatlo
  rationale: Siksik at mahirap ang Hebreong paghahambing. Pinananatili ng salin ang pagtukoy sa dalawa at sa tatlo nang hindi lubusang nilulutas ang di-tiyak na ugnayan ng mga pangkat.
- source_word: נִכְבָּד
  choice: Higit siyang pinarangalan
  rationale: Ang Niphal ng כבד ay tumutukoy sa pagiging pinarangalan o mataas ang pagkilala; hinihingi ng συγκ comparative na kayarian ang “higit.”
- source_word: וַיְהִי לָהֶם לְשָׂר
  choice: siya ang naging pinuno nila
  rationale: Ang שַׂר ay pinuno o kumander. Natural sa modernong Tagalog ang “pinuno” at angkop ito sa kontekstong militar.
- source_word: וְעַד הַשְּׁלוֹשָׁה לֹא בָא
  choice: ngunit hindi niya naabot ang antas ng tatlo
  rationale: Ang בוא kasama ng עַד ay matalinghagang tumutukoy sa pag-abot sa ranggo o katayuan, hindi sa pisikal na pagdating.
