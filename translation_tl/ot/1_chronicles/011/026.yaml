  source_fidelity: 'Tapat ang salin sa Hebreo: ipinagpapatuloy nito ang talaan ng mga magigiting na mandirigma at wastong kinikilala sina Asahel, kapatid ni Joab, at Elhanan, anak ni Dodo, na mula sa Bethlehem. Hindi nito binabago ang ugnayang pangangkanan o ang kahulugang pinagmulan ng מִבֵּית לָחֶם.'
