base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/026.yaml
  text: 'And the mighty warriors were: Asahel the brother of Joab[a], Elhanan son of Dodo, from Bethlehem.'
translation:
  language: tl
  text: At ang mga magigiting na mandirigma ay sina Asahel na kapatid ni Joab, at Elhanan na anak ni Dodo, na mula sa Bethlehem.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְגִבּוֹרֵי הַחֲיָלִים
  choice: At ang mga magigiting na mandirigma
  rationale: Tumutukoy ang parirala sa mga bantog at matatapang na mandirigma. Likas sa makabagong Filipino ang “mga magigiting na mandirigma,” at pinananatili ng “At” ang pagpapatuloy ng talaan.
- source_word: עֲשָׂה אֵל
  choice: Asahel
  rationale: Karaniwang transliterasyon sa Filipino ng pangalang Hebreo na Asahel.
- source_word: אֲחִי יוֹאָב
  choice: na kapatid ni Joab
  rationale: Tuwirang ipinapahayag ang kaugnayang pampamilya at natural itong ikinakabit sa pangalan sa Filipino.
- source_word: אֶלְחָנָן
  choice: Elhanan
  rationale: Transliterasyon ng pangalang pantangi ayon sa anyong karaniwang ginagamit sa mga saling Filipino.
- source_word: בֶּן דּוֹדוֹ
  choice: na anak ni Dodo
  rationale: Ang Dodo rito ay pangalan ng tao; pinananatili ang payak na pormulang pangangkanan.
- source_word: מִבֵּית לָחֶם
  choice: na mula sa Bethlehem
  rationale: Literal at natural na ipinahahayag ng מִן kasama ng pangalan ng lugar ang pinagmulan. Hindi kailangang gawing katawagang gentiliko.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “sina” upang natural na ipakilala ang mga pangalang nasa talaan, at inulit ang “at” bago ang ikalawang pangalan para malinaw ang paghihiwalay ng dalawang mandirigma.
