translation_notes:
  register: Maikli, marangal, at likas na modernong Filipino. Ginamit ang “Sina” para malinaw na ipakilala ang talaan ng mga tao, at inilagay ang talababa sa katawagang “taga-Mezoba,” na siyang tinutukoy nito.
