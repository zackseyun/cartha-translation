  text: Eliel[a], Obed, and Jaasiel the Mezobaite.
translation:
  language: tl
  text: Sina Eliel, Obed, at Jaasiel na taga-Mezoba[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Hebreong הַמְּצֹבָיָה ay isang katawagang pangkatutubo o panlugar na malamang tumutukoy kay Jaasiel bilang mula sa Mezoba o sa isang lugar o angkang may kahawig na pangalan. Hindi tiyak ang eksaktong pinagbabatayang pangalan, kaya maaari rin itong isatitik bilang “taga-Mitzoba.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלִיאֵל
  choice: Eliel
  rationale: Pangalang pantangi; tinumbasan sa karaniwang anyong transliterado sa Filipino.
- source_word: וְעוֹבֵד
  choice: Obed
  rationale: Pangalang pantangi na may pang-ugnay sa Hebreo; ipinahayag ang ugnayan nang natural sa talaang Filipino.
- source_word: וְיַעֲשִׂיאֵל
  choice: at Jaasiel
  rationale: Pangalang pantangi na transliterado; ginamit ang “at” upang likas na pag-ugnayin ang huling pangalan sa talaan.
- source_word: הַמְּצֹבָיָה
  choice: na taga-Mezoba
  rationale: Ang anyo ay katawagang tumutukoy sa pinagmulan ni Jaasiel sa isang lugar o angkan. Ang “taga-Mezoba” ay natural sa Filipino at hindi nagpapasya nang higit sa ipinahihiwatig ng Hebreo.
