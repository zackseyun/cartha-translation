  - severity: low
    issue: Hindi magkatulad ang dalawang pagsasalin ng inuulit na בְנַפְשׁוֹתָם.
    rationale: Ang “kapalit ng kanilang buhay” at “habang nakataya ang kanilang buhay” ay magkaibang antas ng kahulugan. Ang paggamit ng parehong pariralang “isinapanganib nila ang kanilang buhay” ay mas tapat sa pag-uulit at mas malinaw sa Tagalog.
