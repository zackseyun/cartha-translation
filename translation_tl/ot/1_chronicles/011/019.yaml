  verdict: revise
  source_fidelity: 'Ang pangunahing diwa ay tapat sa Hebreo: mariing tumanggi si David, pinanatili ang retorikal na tanong at literal na “dugo,” at malinaw na ang tinutukoy ng נֶפֶשׁ ay buhay, hindi kaluluwa. Gayunman, ang “kapalit ng kanilang buhay” ay maaaring magpahiwatig na naibigay o nawala na ang kanilang buhay, samantalang ang konteksto at ang kasunod na sugnay ay tumutukoy sa buhay na isinapanganib. Dapat ding panatilihin ang pag-uulit ng Hebreo sa magkatulad na pananalita.'
  naturalness: Marangal at natural ang karamihan ng Tagalog. Mas malinaw at mas natural sa modernong Filipino ang “isinapanganib nila ang kanilang buhay” kaysa “kapalit ng kanilang buhay,” at maiiwasan nito ang hindi sinasadyang pahiwatig na namatay ang mga lalaki.
  terminology: Ang “dugo,” “buhay,” at “magigiting na mandirigma” ay angkop. Ang panawagang “Huwag nawang ipahintulot ng aking Diyos” ay isang katanggap-tanggap na likas na pagsasalin ng mariing pagtanggi na may apela sa Diyos; hindi nito ipinipilit ang pinagtatalunang eksaktong puwersa ng מֵאֱלֹהַי.
  issues:
