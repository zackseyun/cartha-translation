base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/019.yaml
  text: And he said[a], “Far be it from me, by my God, to do this! Shall I drink the blood of these men at the cost of their lives? For they brought it at the cost of their lives.” So he was not willing to drink it[b]. These things the three mighty men did.
translation:
  language: tl
  text: At sinabi niya, “Huwag nawang ipahintulot ng aking Diyos na gawin ko ito![a] Iinumin ko ba ang dugo ng mga lalaking ito, gayong isinapanganib nila ang kanilang buhay? Sapagkat isinapanganib nila ang kanilang buhay upang dalhin ito.” Kaya ayaw niya itong inumin.[b] Ito ang ginawa ng tatlong magigiting na mandirigma.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Malayo nawa sa akin, dahil sa aking Diyos, na gawin ito!” Ang Hebreo ay isang mariing pagtanggi na may pag-apela sa Diyos.'
    reason: lexical_alternative
  - marker: b
    text: Tinawag ni David na “dugo” ang tubig sapagkat nakuha iyon ng mga lalaki habang isinapanganib nila ang kanilang buhay.
    reason: cultural_note
lexical_decisions:
- source_word: חָלִילָה לִּי מֵאֱלֹהַי
  choice: Huwag nawang ipahintulot ng aking Diyos
  rationale: Isinasalin nito sa likas at marangal na Tagalog ang mariing pagtanggi at ang pag-apela sa Diyos. Hindi ginamit ang literal ngunit di-likas na “Malayo sa akin mula sa aking Diyos.”
- source_word: מֵעֲשׂוֹת זֹאת
  choice: na gawin ko ito
  rationale: Ang infinitive na may מ pagkatapos ng חָלִילָה ay nagpapahayag ng mariing paglayo o pagpigil sa paggawa ng bagay na tinutukoy.
- source_word: הֲדַם הָאֲנָשִׁים הָאֵלֶּה אֶשְׁתֶּה
  choice: Iinumin ko ba ang dugo ng mga lalaking ito
  rationale: Pinananatili ang retorikal na tanong at ang tahasang larawang “dugo,” sa halip na palitan ito ng paliwanag tungkol sa tubig.
- source_word: בְנַפְשׁוֹתָם
  choice: kapalit ng kanilang buhay / habang nakataya ang kanilang buhay
  rationale: Ang נֶפֶשׁ ay tumutukoy rito sa pisikal na buhay. Ipinahahayag ng dalawang parirala ang halaga o mortal na panganib na kaakibat ng pagkuha sa tubig, habang pinananatili ang pag-uulit ng Hebreo sa paraang malinaw sa Tagalog.
- source_word: וְלֹא אָבָה לִשְׁתּוֹתָם
  choice: Kaya ayaw niya itong inumin
  rationale: Ang אָבָה ay tumutukoy sa pagkukusa o pagpayag. Ang “ayaw” ay tuwiran at natural, at ang “ito” ay tumutukoy sa tubig bilang isang kabuuan.
- source_word: אֵלֶּה עָשׂוּ שְׁלֹשֶׁת הַגִּבּוֹרִים
  choice: Ito ang ginawa ng tatlong magigiting na mandirigma
  rationale: Ang גִּבּוֹרִים ay tumutukoy sa mga bantog at piling mandirigma ni David; malinaw itong naipapahayag ng “magigiting na mandirigma.”
theological_decisions:
- issue: Kahulugan ng “dugo” sa sinabi ni David
  choice: Pinanatili ang literal na “dugo,” habang ipinakikita ng konteksto na itinuring ni David ang tubig na katumbas ng dugo dahil sa panganib sa buhay ng mga kumuha nito.
  alternative: Palitan ito sa pangunahing teksto ng “tubig na nakuha sa pagtataya ng kanilang buhay.”
  rationale: Tahasang “dugo” ang nasa Hebreo, at mahalaga ang matinding larawang ito sa moral na bigat ng pagtanggi ni David.
- issue: Kahulugan ng נֶפֶשׁ
  choice: buhay
  alternative: kaluluwa
  rationale: Pisikal na buhay na nalagay sa mortal na panganib ang tinutukoy, hindi ang di-materyal na kaluluwa.
- issue: Lakas ng pariralang מֵאֱלֹהַי
  choice: Isinalin bilang panawagan sa Diyos na huwag ipahintulot ang gawain.
  alternative: “Malayo sa akin sa harap ng aking Diyos” o “saksi ang aking Diyos.”
  rationale: May kahirapan sa eksaktong ugnayan ng מֵאֱלֹהַי sa idyomang חָלִילָה לִּי. Pinili ang natural na Tagalog na nagpapanatili sa banal na pag-apela nang hindi nagtatakda ng isang tiyak na pormulang panunumpa.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang retorikal na tanong, ang literal na “dugo,” at ang pag-uulit tungkol sa kanilang buhay, ngunit ginawang natural ang ikalawang parirala sa Tagalog.
