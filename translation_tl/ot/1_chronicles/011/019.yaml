revisions:
- from: At sinabi niya, “Huwag nawang ipahintulot ng aking Diyos na gawin ko ito![a] Iinumin ko ba ang dugo ng mga lalaking ito, kapalit ng kanilang buhay? Sapagkat dinala nila ito habang nakataya ang kanilang buhay.” Kaya ayaw niya itong inumin.[b] Ito ang ginawa ng tatlong magigiting na mandirigma.
  to: At sinabi niya, “Huwag nawang ipahintulot ng aking Diyos na gawin ko ito![a] Iinumin ko ba ang dugo ng mga lalaking ito, gayong isinapanganib nila ang kanilang buhay? Sapagkat isinapanganib nila ang kanilang buhay upang dalhin ito.” Kaya ayaw niya itong inumin.[b] Ito ang ginawa ng tatlong magigiting na mandirigma.
