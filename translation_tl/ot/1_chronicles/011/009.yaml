  yaml_path: translation/ot/1_chronicles/011/009.yaml
  text: And David became greater and greater[a], and Yahweh of hosts was with him.
translation:
  language: tl
  text: Lalo pang naging dakila si David[a], at kasama niya si Yahweh ng mga hukbo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na, “Si David ay lumakad, patuloy na lumalakad at nagiging dakila”—isang idyoma na nangangahulugang lalo siyang naging dakila.
    reason: Ipinapakita ang literal na anyo at progresibong diwa ng di-karaniwang idyomang Hebreo.
lexical_decisions:
- source_word: וַיֵּלֶךְ הָלוֹךְ וְגָדוֹל
  choice: Lalo pang naging dakila
  rationale: Ang pinagsamang pandiwang וַיֵּלֶךְ, pawatas na הָלוֹךְ, at גָדוֹל ay isang idyomang Hebreo na nagpapahayag ng patuloy na paglaki o pag-angat. Likas na ipinahahayag sa modernong Tagalog ng “lalo pang naging dakila,” nang hindi ito ipinakahulugang literal na paglakad.
- source_word: דָּוִיד
  choice: David
  rationale: Karaniwang anyo ng pangalan sa Tagalog at malawak na nakikilala ng mga mambabasa.
- source_word: וַיהוָה
  choice: at … si Yahweh
  rationale: Pinananatili ang payak na pang-ugnay na waw bilang “at” at isinasalin ang banal na pangalang יהוה bilang “Yahweh.”
- source_word: צְבָאוֹת
  choice: ng mga hukbo
  rationale: Tuwirang pinananatili ang larawan ng צְבָאוֹת bilang mga hukbo sa titulong “Yahweh ng mga hukbo,” sa halip na palitan ito ng mas mapagpaliwanag na titulo.
- source_word: עִמּוֹ
  choice: kasama niya
  rationale: Natural at tuwirang katumbas ng Hebreong pariralang nagsasaad ng presensiya o pakikisama.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Tahasang ginagamit sa tekstong Hebreo ang personal na pangalang יהוה; pinananatili itong “Yahweh” upang maipakita ang pangalang tipan nang hindi ito pinapalitan ng isang titulo.
- issue: Ugnayan ng pagdakila ni David at ng presensiya ni Yahweh
  choice: at
  alternative: sapagkat
  rationale: Ang waw sa Hebreo ay tuwirang nagdurugtong sa dalawang pahayag. Hindi ginagawang tahasang sanhi ang ikalawang sugnay, kaya napapanatili ang posibleng ugnayan nang hindi ito labis na binibigyang-kahulugan.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ang ayos na “kasama niya si Yahweh” ay natural at nagbibigay-diin sa presensiya ni Yahweh nang hindi nagdaragdag ng tahasang sanhi na wala sa pang-ugnay na Hebreo.
