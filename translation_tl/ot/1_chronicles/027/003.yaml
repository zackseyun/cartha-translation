  text: From the sons of Perez[b][a], the chief over all the commanders of the divisions for the first month.
translation:
  language: tl
  text: Mula sa mga anak ni Perez[a] ang pinuno sa lahat ng kumander ng mga pangkat ng hukbo[b] para sa unang buwan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga inapo ni Perez.” Literal sa Hebreo, “mga anak ni Perez,” isang pananalitang pangangkan na maaaring tumukoy sa mas malawak na linya ng mga inapo.
    reason: lexical_alternative
  - marker: b
    text: O “mga hukbo.” Madalas mangahulugan ang salitang Hebreo na “mga hukbo,” ngunit sa kabanatang ito ay tumutukoy ito sa mga organisadong pangkat militar na nakatalaga bawat buwan.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִן
  choice: Mula sa
  rationale: Ipinahihiwatig ng pang-ukol ang pinagmulan o angkan ng pinuno.
- source_word: בְּנֵי פֶרֶץ
  choice: mga anak ni Perez
  rationale: Pinananatili nito ang literal na anyong Hebreo, bagaman maaari itong tumukoy sa mas malawak na lahi o mga inapo.
- source_word: הָרֹאשׁ
  choice: ang pinuno
  rationale: Ginagamit dito ang רֹאשׁ bilang katawagan sa taong may pinakamataas na pamamahala.
- source_word: לְכָל
  choice: ng lahat ng
  rationale: Sa pariralang Filipino, ipinakikita ng pagkakaugnay nito sa 'pinuno' ang saklaw ng kaniyang pamamahala sa lahat ng kasunod na kumander.
- source_word: שָׂרֵי הַצְּבָאוֹת
  choice: mga kumander ng mga pangkat ng hukbo
  rationale: Ang שָׂרֵי ay mga pinunong militar; bagaman karaniwang 'mga hukbo' ang צְבָאוֹת, tumutukoy ang konteksto sa mga organisadong pangkat na salit-salitang naglilingkod bawat buwan.
- source_word: לַחֹדֶשׁ הָרִאשׁוֹן
  choice: para sa unang buwan
  rationale: Tinutukoy nito ang unang buwanang takdang paglilingkod sa kaayusang inilalarawan sa kabanata.
