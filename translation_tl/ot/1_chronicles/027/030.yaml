base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/030.yaml
  text: Over the camels was Obil the Ishmaelite[a], and over the female donkeys was Jehdeiah the Meronothite.
translation:
  language: tl
  text: Ang namamahala sa mga kamelyo ay si Obil na Ismaelita, at ang namamahala sa mga babaeng asno[a] ay si Jehdeias na Meronotita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Hebreo ay partikular na tumutukoy sa mga asnong babae.
    reason: lexical_clarification
lexical_decisions:
- source_word: וְעַל
  choice: ang namamahala sa
  rationale: Sa talaang administratibo, ang עַל ay nagpapahiwatig ng pangangasiwa o pananagutan. Mas natural sa modernong Tagalog ang “ang namamahala sa” kaysa sa literal na “nasa ibabaw ng.”
- source_word: הַגְּמַלִּים
  choice: mga kamelyo
  rationale: Tuwirang salin ng tiyak na pangmaramihang pangngalan para sa mga kamelyo; hindi kailangang tumbasan nang hiwalay ang pantukoy na Hebreo sa konstruksiyong Tagalog.
- source_word: אוֹבִיל
  choice: Obil
  rationale: Pangalang pantangi na isinalin sa pamamagitan ng transliterasyon.
- source_word: הַיִּשְׁמְעֵאלִי
  choice: Ismaelita
  rationale: Tawag na nagpapakilala kay Obil ayon sa kaniyang lahi o angkan; ang “Ismaelita” ang likas at nakaugaliang anyo sa Tagalog.
- source_word: הָאֲתֹנוֹת
  choice: mga babaeng asno
  rationale: Ang אָתוֹן ay partikular na tumutukoy sa babaeng asno, kaya pinanatili ang kasarian sa salin sa halip na gamitin lamang ang pangkalahatang “mga asno.”
- source_word: יֶחְדְּיָהוּ
  choice: Jehdeias
  rationale: Pangalang pantangi na tinumbasan sa anyong transliterado at madaling basahin sa Tagalog.
- source_word: הַמֵּרֹנֹתִי
  choice: Meronotita
  rationale: Malamang na katawagang hango sa pangalan ng lugar at ginagamit bilang pagkakakilanlan kay Jehdeias; pinanatili ang anyong gentiliko sa Tagalog.
theological_decisions: []
