base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/019.yaml
  text: for Zebulun, Ishmaiah son of Obadiah; for Naphtali, Jerimoth son of Azriel.
translation:
  language: tl
  text: Para sa lipi ni Zebulun, si Ismayahu na anak ni Obadias; para sa lipi ni Neftali, si Jerimot na anak ni Azriel.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִזְבוּלֻן
  choice: para sa lipi ni Zebulun
  rationale: Ang לְ ay nagpapahiwatig ng nakatalagang saklaw o kinatawang pangkat sa listahan ng mga pinuno. Idinagdag ang “lipi” upang maging malinaw at natural sa Tagalog ang metonimikong gamit ng pangalang Zebulun.
- source_word: יִשְׁמַעְיָהוּ
  choice: Ismayahu
  rationale: Isinalin sa baybay na madaling bigkasin sa Filipino habang pinananatili ang anyong Hebreo ng pangalang pantangi.
- source_word: בֶּן
  choice: anak ni
  rationale: Ito ang natural na katumbas sa Tagalog ng pormulang nagpapakilala sa isang lalaki sa pamamagitan ng kanyang ama.
- source_word: עֹבַדְיָהוּ
  choice: Obadias
  rationale: Ginamit ang karaniwang anyo ng pangalang biblikal sa Filipino para sa malinaw at pamilyar na pagbasa.
- source_word: לְנַפְתָּלִי
  choice: para sa lipi ni Neftali
  rationale: Tulad sa Zebulun, ang לְ ay tumutukoy sa pangkat na saklaw ng opisyal; nilinaw sa Tagalog sa pamamagitan ng “lipi.”
- source_word: יְרִימוֹת
  choice: Jerimot
  rationale: Malapit na transliterasyon sa anyong Hebreo, na iniangkop sa ortograpiya at bigkas ng Filipino.
- source_word: עַזְרִיאֵל
  choice: Azriel
  rationale: Direktang transliterasyon na malinaw at natural basahin sa Filipino.
