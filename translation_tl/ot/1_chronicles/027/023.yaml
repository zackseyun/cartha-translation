base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/023.yaml
  text: But David did not count them from twenty years old and under[b][a], because Yahweh had said he would multiply Israel like the stars of the heavens.
translation:
  language: tl
  text: Ngunit hindi isinama ni David sa bilang ang mga dalawampung taong gulang pababa[a], sapagkat sinabi ni Yahweh na pararamihin niya ang Israel gaya ng mga bituin sa langit.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “hindi itinaas ang kanilang bilang,” isang idyomang Hebreo na nangangahulugang hindi sila binilang o isinama sa sensus.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “gaya ng mga bituin sa kalangitan.” Umaalingawngaw ito sa pangako ni Yahweh na gagawing napakarami ang Israel.
    reason: cross_reference
lexical_decisions:
- source_word: וְלֹא
  choice: Ngunit hindi
  rationale: Sa konteksto ng naunang pagbilang, natural na ipinahahayag ng “ngunit” ang pagsalungat, habang pinananatili ng “hindi” ang tahasang negasyon.
- source_word: נָשָׂא ... מִסְפָּרָם
  choice: hindi isinama ... sa bilang
  rationale: Ang literal na idyomang Hebreo ay “hindi itinaas ang kanilang bilang,” ngunit tumutukoy ito sa hindi pagbilang o hindi pagsama sa sensus. Ang napiling parirala ay natural sa Filipino at malinaw sa konteksto.
- source_word: לְמִבֶּן עֶשְׂרִים שָׁנָה וּלְמָטָּה
  choice: ang mga dalawampung taong gulang pababa
  rationale: Tumpak at karaniwang Filipino ito para sa inklusibong saklaw ng edad mula dalawampu pababa.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala nito ang dahilan ng pasiya ni David; ang “sapagkat” ay marangal ngunit madaling maunawaan.
- source_word: אָמַר יְהוָה
  choice: sinabi ni Yahweh
  rationale: Pinananatili ang simpleng aspektong Hebreo at ang personal na banal na pangalan.
- source_word: לְהַרְבּוֹת אֶת יִשְׂרָאֵל
  choice: pararamihin niya ang Israel
  rationale: Ipinahahayag nito nang natural ang nilalaman ng naunang pangako nang hindi nililinaw nang higit sa sinasabi ng Hebreo kung ang “Israel” ay bayan o bansa.
- source_word: כְּכוֹכְבֵי הַשָּׁמָיִם
  choice: gaya ng mga bituin sa langit
  rationale: Natural na katumbas ito sa Filipino at pinananatili ang malinaw na alusyon sa pangakong magiging napakarami ang Israel.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Nasa tekstong Hebreo ang Tetragrammaton bilang personal na pangalan. Ang “Yahweh” ay tuwirang transliterasyon at hindi pinapalitan ang pangalan ng isang titulo.
- issue: Saklaw ng pangakong pararamihin ang Israel
  choice: pararamihin niya ang Israel
  alternative: gagawin niyang napakarami ang bayang Israel
  rationale: Pinananatiling maigsi ang pahayag at hindi dinaragdagan ang tahasang diwa ng אֶת יִשְׂרָאֵל, habang malinaw pa rin ang kaugnayan nito sa pangako ng Diyos.
translation_notes:
  register: Makabagong Filipino na marangal at madaling maunawaan. Ginamit ang “isinama sa bilang” upang idiomatikong ihatid ang konteksto ng sensus, at “dalawampung taong gulang pababa” bilang natural na pormula ng saklaw ng edad. Inilagay ang mga panandang [a] at [b] kaagad pagkatapos ng mga pariralang tinutukoy ng mga talababa.
