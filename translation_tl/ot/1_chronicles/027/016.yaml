  text: וְ/עַל֙ שִׁבְטֵ֣י יִשְׂרָאֵ֔ל לָ/רֽאוּבֵנִ֣י נָגִ֔יד אֱלִיעֶ֖זֶר בֶּן זִכְרִ֑י לַ/שִּׁ֨מְעוֹנִ֔י שְׁפַטְיָ֖הוּ בֶּֽן מַעֲכָֽה־ס־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/016.yaml
  text: 'And over the tribes of Israel: for the Reubenites[a], Eliezer son of Zichri was leader; for the Simeonites, Shephatiah son of Maacah.'
translation:
  language: tl
  text: 'At tungkol sa mga lipi ng Israel: para sa mga Rubenita, si Eliezer na anak ni Zicri ang pinuno; para sa mga Simeonita, si Sefatias na anak ni Maaca.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַל
  choice: At tungkol sa
  rationale: Ipinakikilala nito ang bagong bahagi ng talaan habang pinananatili ang ugnayan sa naunang konteksto. Sa Filipino, mas likas dito ang “tungkol sa” kaysa sa literal na “nasa ibabaw ng,” samantalang ang tungkulin ng pamumuno ay malinaw sa kasunod na נָגִיד.
- source_word: שִׁבְטֵי יִשְׂרָאֵל
  choice: mga lipi ng Israel
  rationale: Tuwirang salin ng construct chain at likas na katawagan sa modernong Filipino.
- source_word: לָרְאוּבֵנִי
  choice: para sa mga Rubenita
  rationale: Ang anyong gentilic ay tumutukoy sa mga kabilang sa lipi ni Ruben, hindi kay Ruben bilang isang indibidwal.
- source_word: נָגִיד
  choice: pinuno
  rationale: Tumutukoy sa isang taong inilagay sa kapangyarihan o pamamahala. Malinaw at marangal ang “pinuno” at hindi nito ipinapalagay ang maharlikang kahulugan ng “prinsipe.”
- source_word: אֱלִיעֶזֶר בֶּן זִכְרִי
  choice: si Eliezer na anak ni Zicri
  rationale: Isinalin nang tuwiran ang patronymic at ginamit ang karaniwang anyong Filipino ng mga pangalang biblikal.
- source_word: לַשִּׁמְעוֹנִי
  choice: para sa mga Simeonita
  rationale: Ang gentilic ay tumutukoy sa pangkat ng lipi at pinananatili ang paralel na ayos ng talaan.
- source_word: שְׁפַטְיָהוּ בֶּן מַעֲכָה
  choice: si Sefatias na anak ni Maaca
  rationale: Pinanatili ang simpleng pahayag ng pinagmulang magulang nang hindi tinutukoy ang kasarian ni Maaca, na hindi nililinaw ng teksto.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na malinaw, maikli, at marangal. Pinanatili ang anyo ng administratibong talaan at ang paralelismo ng dalawang sugnay. Walang talababa sapagkat sapat na naihahatid ng “pinuno” ang kahulugan ng נָגִיד sa kontekstong ito.
