base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/015.yaml
  text: The twelfth[a], for the twelfth month, was Heldai the Netophathite, of Othniel[b]; and over his division were twenty-four thousand.
translation:
  language: tl
  text: Ang ikalabindalawa, para sa ikalabindalawang buwan, ay si Heldai[a] na Netofatita, na kaugnay ni Otniel[b]. Ang pangkat niya ay may 24,000 tauhan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa ilang kaugnay na tradisyon, “Heled” ang anyo ng pangalan sa halip na “Heldai.”
    reason: cross_reference
  - marker: b
    text: Maaari ring “kabilang kay Otniel” o “nagmula kay Otniel.” Malamang na ang konstruksiyong Hebreo ay tumutukoy sa ugnayang pampamilya o pang-angkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשְּׁנֵים עָשָׂר
  choice: Ang ikalabindalawa
  rationale: Ginamit bilang ordinal sa talaan ng sunod-sunod na pangkat na nakatalaga sa bawat buwan. Pinananatili ang elipsis ng Hebreo sa halip na tahasang idagdag ang “pinuno.”
- source_word: לִשְׁנֵים עָשָׂר הַחֹדֶשׁ
  choice: para sa ikalabindalawang buwan
  rationale: Ang לְ ay nagsasaad ng pagkakatalaga sa buwan; natural sa Filipino at malapit sa estruktura ng Hebreo ang “para sa.”
- source_word: חֶלְדַּי
  choice: Heldai
  rationale: Tuwirang transliterasyon ng pangalang nasa tekstong Hebreo ng talatang ito; inilagay sa talababa ang anyong Heled sa ibang kaugnay na tradisyon.
- source_word: הַנְּטוֹפָתִי
  choice: na Netofatita
  rationale: Pang-uring gentiliko na tumutukoy sa isang taong mula sa Netofa; ang hulaping “-ita” ay karaniwang anyo sa Filipino para sa ganitong katawagan.
- source_word: לְעָתְנִיאֵל
  choice: mula sa angkan ni Otniel
  rationale: Sa konteksto, malamang na tumutukoy ang לְ sa ugnayang pampamilya o pang-angkan, hindi sa paglilingkod nang tuwiran sa matagal nang namatay na si Otniel. Nililinaw ng talababa ang iba pang posibleng pagbasa.
- source_word: וְעַל מַחֲלֻקְתּוֹ
  choice: Ang kanyang pangkat ay binubuo ng
  rationale: Ang מַחֲלֻקָה sa kabanatang ito ay isang nakatalagang pangkat o dibisyon. Ang parirala ay isinalin sa natural na Filipino upang ipakilala ang bilang ng mga tauhan.
- source_word: עֶשְׂרִים וְאַרְבָּעָה אָלֶף
  choice: 24,000 tauhan
  rationale: Tumpak na bilang ng mga kabilang sa pangkat; idinagdag ang “tauhan” mula sa malinaw na kontekstong militar upang maging natural at madaling maunawaan.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang maikling estilong administratibo ng talaan, ngunit ginawang natural ang pahayag tungkol sa bilang ng pangkat. Ang mga pangalang Heldai, Netofa/Netofatita, at Otniel ay isina-Filipino ang baybay nang hindi binabago ang pagkakakilanlan.
