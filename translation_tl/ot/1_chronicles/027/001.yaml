  text: וּ/בְנֵ֣י יִשְׂרָאֵ֣ל לְֽ/מִסְפָּרָ֡/ם רָאשֵׁ֣י הָ/אָב֣וֹת וְ/שָׂרֵ֣י הָֽ/אֲלָפִ֣ים וְ/הַ/מֵּא֡וֹת וְ/שֹׁטְרֵי/הֶם֩ הַ/מְשָׁרְתִ֨ים אֶת הַ/מֶּ֜לֶךְ לְ/כֹ֣ל דְּבַ֣ר הַֽ/מַּחְלְק֗וֹת הַ/בָּאָ֤ה וְ/הַ/יֹּצֵאת֙ חֹ֣דֶשׁ בְּ/חֹ֔דֶשׁ לְ/כֹ֖ל חָדְשֵׁ֣י הַ/שָּׁנָ֑ה הַֽ/מַּחֲלֹ֨קֶת֙ הָֽ/אַחַ֔ת עֶשְׂרִ֥ים וְ/אַרְבָּעָ֖ה אָֽלֶף׀׀־׀׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/001.yaml
  text: The sons of Israel according to their number—the heads of fathers’ houses[a], and the commanders of thousands and of hundreds[c][b], and their officers who served the king in every matter of the divisions that came in and went out month by month throughout all the months of the year—each division was twenty-four thousand.
translation:
  language: tl
  text: Ang mga Israelita, ayon sa kanilang bilang—ang mga pinuno ng mga sambahayan ng angkan[a], ang mga pinuno ng libu-libo at daan-daan, at ang kanilang mga opisyal—ay naglingkod sa hari sa lahat ng gawain ng mga pangkat na pumapasok at lumalabas sa paglilingkod buwan-buwan[b], sa lahat ng buwan ng taon. Bawat pangkat ay dalawampu't apat na libo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal na “mga pinuno ng mga sambahayan ng mga ama,” isang katawagang tumutukoy sa mga yunit ng angkan at sa kanilang mga pinuno.
    reason: cultural_note
  - marker: b
    text: Ibig sabihin, salit-salitang pumapasok at lumalabas sa paglilingkod sa hari ang mga pangkat bawat buwan.
    reason: clarification
lexical_decisions:
- source_word: וּבְנֵי יִשְׂרָאֵל
  choice: Ang mga Israelita
  rationale: Ang literal na ‘mga anak ni Israel’ ay isang kolektibong tawag sa bayang Israel; ‘mga Israelita’ ang natural at malinaw na modernong Tagalog.
- source_word: לְמִסְפָּרָם
  choice: ayon sa kanilang bilang
  rationale: Pinananatili nito ang diwang administratibo ng pagkakatala o pag-aayos batay sa bilang.
- source_word: רָאשֵׁי הָאָבוֹת
  choice: mga pinuno ng mga sambahayan ng angkan
  rationale: Inihahayag nito ang teknikal na yunit ng pagkakamag-anak at pamamahala nang hindi gumagamit ng di-likas na literal na ‘mga bahay ng ama.’
- source_word: וְשָׂרֵי הָאֲלָפִים וְהַמֵּאוֹת
  choice: mga kumander ng libu-libo at daan-daan
  rationale: Ang שרים ay mga pinunong militar o administratibo; pinananatili ng bilang ang organisasyonal na anyo ng teksto.
- source_word: וְשֹׁטְרֵיהֶם
  choice: kanilang mga opisyal
  rationale: Malawak ang saklaw ng שטרים at maaaring tumukoy sa mga tagapangasiwa o opisyal, kung minsan ay may tungkuling pansulat.
- source_word: הַמְשָׁרְתִים אֶת הַמֶּלֶךְ
  choice: naglingkod sa hari
  rationale: Natural na Tagalog ito para sa patuloy na opisyal na paglilingkod na inilalarawan ng participle.
- source_word: לְכֹל דְּבַר הַמַּחְלְקוֹת
  choice: sa lahat ng gawain ng mga pangkat
  rationale: Ang דבר ay ‘gawain,’ ‘usapin,’ o ‘kapakanan’; ang ‘gawain’ ay malinaw sa kontekstong administratibo.
- source_word: הַבָּאָה וְהַיֹּצֵאת
  choice: pumapasok at lumalabas sa paglilingkod
  rationale: Pinananatili ang konkretong pares ng pagpasok at paglabas habang nililinaw na tumutukoy ito sa salit-salitang paglilingkod.
- source_word: חֹדֶשׁ בְּחֹדֶשׁ
  choice: buwan-buwan
  rationale: Ito ang natural na Tagalog na katumbas ng distributibong idyoma.
- source_word: לְכֹל חָדְשֵׁי הַשָּׁנָה
  choice: sa buong taon
  rationale: Maikli at natural na ipinahahayag ang pag-ikot sa lahat ng buwan ng taon.
- source_word: הַמַּחֲלֹקֶת הָאַחַת
  choice: Bawat pangkat
  rationale: Bagaman literal na ‘ang isang pangkat,’ distributibo ang kahulugan sa konteksto.
- source_word: עֶשְׂרִים וְאַרְבָּעָה אָלֶף
  choice: dalawampu't apat na libong tauhan
  rationale: Tuwirang inililipat ang bilang; idinagdag ang ‘tauhan’ bilang likas na ipinahihiwatig na binibilang sa kontekstong militar-administratibo.
