base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/005.yaml
  text: The commander of the third division for the third month was Benaiah son of Jehoiada the chief[a], and in his division were twenty-four thousand.
translation:
  language: tl
  text: Ang pinuno ng ikatlong pangkat para sa ikatlong buwan ay si Benaias, anak ni Joiada na pari, ang pangunahing pinuno[a]. Ang kanyang pangkat ay may dalawampu't apat na libong tauhan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hindi ganap na tiyak ang pagkakaugnay ng mga salita sa Hebreo. Maaaring ang “pari” ay tumutukoy kay Joiada at ang “pinuno” ay kay Benaias. Maaari ring kapwa tumukoy ang mga ito kay Joiada, o mabasa bilang “si Benaias na anak ni Joiada na punong pari.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׂר הַצָּבָא
  choice: pinuno
  rationale: Tumutukoy ang שַׂר sa opisyal o kumandante; sa konteksto ng mga buwanang pangkat ng hukbo, malinaw at likas sa Filipino ang “pinuno.”
- source_word: הַשְּׁלִישִׁי לַחֹדֶשׁ הַשְּׁלִישִׁי
  choice: ng ikatlong pangkat para sa ikatlong buwan
  rationale: Elliptical ang unang ordinal sa Hebreo; idinagdag ang “pangkat” ayon sa paulit-ulit na balangkas ng kabanata, samantalang ang ikalawang ordinal ay tahasang tumutukoy sa buwan.
- source_word: בְּנָיָהוּ בֶן יְהוֹיָדָע
  choice: Benaias na anak ni Joiada
  rationale: Ginamit ang nakaugaliang anyong Filipino ng mga pangalang biblikal at ang natural na pariralang “anak ni.”
- source_word: הַכֹּהֵן רֹאשׁ
  choice: ang pari at pinuno
  rationale: Pinananatiling magkatabi ngunit hindi sapilitang pinagsasanib ang “pari” at “pinuno,” sapagkat maaaring iugnay sa iba’t ibang paraan ang mga salita sa Hebreo.
- source_word: וְעַל מַחֲלֻקְתּוֹ
  choice: Ang pangkat niya ay may
  rationale: Sa pormula ng listahang ito, ipinakikilala ng parirala ang bilang ng mga kabilang sa pangkat; natural itong ipinahayag sa Filipino nang hindi nawawala ang kaugnayan nito sa pamumuno ni Benaias.
- source_word: עֶשְׂרִים וְאַרְבָּעָה אָלֶף
  choice: dalawampu't apat na libong tauhan
  rationale: Tumpak ang bilang; idinagdag ang “tauhan” upang maging malinaw sa Filipino kung ano ang binibilang, ayon sa kontekstong militar.
theological_decisions:
- issue: Pagkakaugnay ng הַכֹּהֵן רֹאשׁ sa mga pangalan
  choice: “si Benaias na anak ni Joiada, ang pari at pinuno”
  alternative: “si Benaias na anak ni Joiada na punong pari” o “si Benaias na anak ni Joiada na pari, ang pinuno”
  rationale: Hindi ganap na tiyak sa sintaks kung sino ang tinutukoy ng mga titulong “pari” at “pinuno,” at kung bumubuo ang mga ito ng iisang titulong “punong pari.” Pinananatili ng salin at talababa ang tunay na kalabuan sa halip na magtakda ng isang interpretasyon.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “pangkat” sa halip na mas teknikal na “dibisyon,” at “tauhan” upang linawin ang ipinahihiwatig na bilang ng mga kawal. Pinanatili sa talababa ang sintaktikong kalabuan ng pariralang הַכֹּהֵן רֹאשׁ.
