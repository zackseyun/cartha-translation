  source_fidelity: Tumpak ang pangunahing salin sa Hebreo. Ang דּוֹד ay maingat na isinaling “tiyuhin” sa kontekstong ito, habang ang talababa ay kumikilala sa iba pang posibleng gamit. Napapanatili rin ng “tagapayo,” “lalaking may pang-unawa,” at “eskriba” ang tatlong paglalarawan kay Jonatan. Ang “ay kasama ng mga anak na lalaki ng hari” ay tapat sa hindi-tiyak na עִם at hindi nagdaragdag ng di-tahasang tungkuling pangangasiwa.
  naturalness: Malinaw, makabago, at marangal ang Filipino. Ang “isang lalaking may pang-unawa” ay bahagyang pormal ngunit angkop sa rehistro ng salaysay at pinananatili ang panlalaking paglalarawan ng Hebreo. Natural ang ayos ng ikalawang pangungusap.
  terminology: Ang “tagapayo” at “eskriba” ay angkop sa kontekstong panghukuman/palasyal. Ang “mga anak na lalaki ng hari” ay wastong pinananatili ang tahasang panlalaking בְּנֵי, nang hindi ito binibigyang-kahulugang “mga prinsipe.” Ang mga pangalang “Jonatan,” “Jehiel,” at “Hacmoni” ay katanggap-tanggap na anyo sa Filipino.
