base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/032.yaml
  text: Jonathan[a], David’s uncle, was a counselor, a man of understanding, and a scribe[b]; and Jehiel son of Hachmoni was with the king’s sons.
translation:
  language: tl
  text: Si Jonatan, na tiyuhin[a] ni David, ay isang tagapayo, isang lalaking may pang-unawa, at isang eskriba[b]. Si Jehiel naman na anak ni Hacmoni ay kasama ng mga anak na lalaki ng hari.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Hebreo ay karaniwang nangangahulugang “tiyuhin” dito, ngunit maaari rin itong tumukoy sa isang kamag-anak o matalik na kaibigan.
    reason: lexical_alternative
  - marker: b
    text: O “kalihim.” Maaaring tumukoy ang salitang Hebreo sa isang tagasulat o edukadong opisyal ng palasyo.
    reason: lexical_alternative
  - marker: c
    text: Literal na “kasama ng mga anak na lalaki ng hari.” Maaaring ipinahihiwatig ng konteksto na naglingkod siya sa kanila o nangasiwa sa kanila, ngunit hindi iyon tahasang sinasabi ng Hebreo.
    reason: lexical_alternative
lexical_decisions:
- source_word: דּוֹד
  choice: tiyuhin
  rationale: Sa konteksto ng talaan ng mga opisyal ng palasyo at sa tahasang pagbanggit kay David, pinakamalamang na tumutukoy ito sa ugnayang pampamilya. Gayunman, maaari ring magkaroon ang salita ng mas malawak na kahulugang gaya ng kamag-anak o matalik na kaibigan, kaya nilagyan ng talababa.
- source_word: יוֹעֵץ
  choice: tagapayo
  rationale: Tumutukoy ang anyong ito sa isang taong nagbibigay ng payo, malamang bilang opisyal sa korte. Natural at malinaw sa makabagong Filipino ang “tagapayo.”
- source_word: אִישׁ מֵבִין
  choice: isang lalaking may pang-unawa
  rationale: Pinananatili nito ang paglalarawan sa Hebreo kay Jonatan bilang lalaking may kakayahang umunawa at kumilatis, nang hindi dinaragdagan ang antas o uri ng kanyang karunungan.
- source_word: סוֹפֵר
  choice: eskriba
  rationale: Maaaring tumukoy ang salita sa tagasulat, kalihim, o edukadong opisyal. Ang “eskriba” ang pinakamalawak na katumbas na hindi labis na nagpapasya sa tiyak niyang tungkuling administratibo.
- source_word: עִם
  choice: ay kasama
  rationale: Literal na nangangahulugang “kasama” ang pang-ukol. Hindi tahasang sinasabi ng Hebreo na si Jehiel ang namamahala o nangangasiwa, kaya hindi iyon isinama sa pangunahing teksto.
- source_word: בְּנֵי הַמֶּלֶךְ
  choice: mga anak na lalaki ng hari
  rationale: Tahasang “mga anak na lalaki ng hari” ang Hebreo. Pinananatili nito ang kasarian at hindi awtomatikong binibigyang-kahulugang mga prinsipe.
- source_word: חַכְמוֹנִי
  choice: Hacmoni
  rationale: Isinalin sa baybay na madaling basahin sa Filipino ang pangalang Hebreo.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “tiyuhin” at “tagapayo” bilang mga karaniwang salitang madaling maunawaan; pinanatili ang “eskriba” upang huwag paliitin ang malawak na tungkuling ipinahihiwatig ng סוֹפֵר. Ang “ay kasama” ay sadyang literal upang mapanatili ang pag-iingat at kalabuan ng pinagmulang teksto.
