  text: לְ/לֵוִ֛י חֲשַׁבְיָ֥ה בֶן קְמוּאֵ֖ל לְ/אַהֲרֹ֥ן צָדֽוֹק־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/017.yaml
  text: for Levi[a], Hashabiah son of Kemuel; for Aaron, Zadok.
translation:
  language: tl
  text: Para kay Levi, si Hasabias na anak ni Kemuel; para kay Aaron[a], si Zadok.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Malamang na ang “Aaron” ay tumutukoy sa makasaserdoteng sambahayan o angkan ni Aaron.
    reason: cultural_note
lexical_decisions:
- source_word: לְ/לֵוִי
  choice: Para kay Levi
  rationale: Sa talaang ito ng mga pinuno, ipinakikita ng לְ ang pangkat na pinamumunuan o kinakatawan. Pinananatili ang pangalang Levi sa halip na gawing tahasang “mga Levita.”
- source_word: חֲשַׁבְיָה
  choice: Hasabias
  rationale: Isinalin sa baybay na likas at madaling bigkasin sa modernong Filipino ang personal na pangalan.
- source_word: בֶן קְמוּאֵל
  choice: anak ni Kemuel
  rationale: Likas na katumbas sa Filipino ng karaniwang Hebreong pariralang pangangkanan.
- source_word: לְ/אַהֲרֹן
  choice: para kay Aaron
  rationale: Pinananatili ang mismong anyo ng Hebreo at ang pagkakatulad nito sa “para kay Levi,” nang hindi tahasang idinaragdag sa teksto ang sambahayan o angkan ni Aaron.
- source_word: צָדוֹק
  choice: Zadok
  rationale: Personal na pangalang isinalin sa karaniwang baybay sa Filipino.
theological_decisions:
- issue: Kung dapat bang tahasang sabihing tumutukoy ang “Aaron” sa makasaserdoteng angkan ni Aaron
  choice: Panatilihin sa pangunahing teksto ang “para kay Aaron”
  alternative: para sa sambahayan ni Aaron; para sa mga Aaronita
  rationale: “Aaron” lamang ang nakasulat sa Hebreo. Malamang na ginagamit ito bilang pangalan ng angkan o sambahayang makasaserdote, ngunit higit na tapat na panatilihin ang anyo at ipaliwanag ang metonimiya sa talababa.
translation_notes:
  register: Maikli at marangal ang estilo, angkop sa isang talaang pampangasiwaan. Ginamit ang “para kay” upang natural na katawanin sa Filipino ang Hebreong לְ, at pinanatili ang mga pangalang ninuno upang hindi lumabis sa pagpapaliwanag.
