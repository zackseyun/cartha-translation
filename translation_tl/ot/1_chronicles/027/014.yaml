translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang 'namumuno' upang maipahayag ang tungkuling ipinakikita ng pormula ng talaan, at 'pangkat' sa halip na mas teknikal na 'dibisyon.'
