  naturalness: Natural at marangal ang rebisadong Filipino. Ang 'dibisyon' ay malinaw at angkop para sa organisasyong militar, at ang dalawang pangungusap ay mas maayos kaysa sa semicolon na naghihiwalay ng kumpletong mga sugnay.
  terminology: Pinanatili ang Benaias, taga-Piraton, at 'mga anak ni Efraim.' Ang huli ay may talababa upang maitala ang mas maikling alternatibo at ang pahiwatig ng lipi o angkan.
