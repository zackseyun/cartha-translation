base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/014.yaml
  text: For the twelfth month[a], Benaiah the Pirathonite, from the sons of Ephraim; and over his division were twenty-four thousand.
translation:
  language: tl
  text: Para sa ikalabindalawang buwan, ang pinuno ay si Benaias na taga-Piraton, mula sa mga anak ni Efraim[a]. Ang kanyang dibisyon ay may dalawampu't apat na libo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “mula sa Efraim.” Mas literal na “mula sa mga anak ni Efraim,” na nagpapahiwatig ng pagkamula sa lipi ni Efraim.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַשְׁתֵּי עָשָׂר לְעַשְׁתֵּי עָשָׂר הַחֹדֶשׁ
  choice: Sa ikalabindalawang buwan
  rationale: Ipinahihiwatig ng pormula sa konteksto ang pangkat na nakatalaga sa ikalabindalawang buwan; natural itong ipinahayag sa modernong Tagalog nang hindi inuulit ang alanganing literal na anyo ng Hebreo.
- source_word: בְּנָיָה
  choice: Benaias
  rationale: Ginamit ang kinagawiang anyong Tagalog ng pangalang biblikal na Benaiah.
- source_word: הַפִּרְעָתוֹנִי
  choice: taga-Piraton
  rationale: Likas sa Tagalog ang 'taga-' para sa gentilic at malinaw nitong pinananatili ang pagkakakilanlang batay sa lugar.
- source_word: מִן בְּנֵי אֶפְרָיִם
  choice: mula sa mga anak ni Efraim
  rationale: Pinanatili ang tahasang 'mga anak ni Efraim' ng Hebreo, na sa konteksto ay tumutukoy sa lahi o lipi, hindi kinakailangang sa mga tuwirang anak.
- source_word: וְעַל מַחֲלֻקְתּוֹ
  choice: at ang kanyang pangkat ay may
  rationale: Ang מַחֲלֻקָה ay isang pangkat o dibisyong militar sa paulit-ulit na pormula ng kabanata. Ang pariralang Tagalog ay natural at ipinakikitang siya ang namumuno rito.
- source_word: עֶשְׂרִים וְאַרְבָּעָה אָלֶף
  choice: dalawampu't apat na libong kawal
  rationale: Tuwirang isinalin ang bilang; idinagdag ang 'kawal' mula sa malinaw na kontekstong militar upang maging likas at tiyak sa Tagalog.
