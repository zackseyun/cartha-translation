base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/006.yaml
  text: This was Benaiah[a], a mighty man of the Thirty and over the Thirty; and his division was under Ammizabad his son.
translation:
  language: tl
  text: Ito si Benaias[a], isang magiting na mandirigma sa Tatlumpu at namumuno sa Tatlumpu. Ang dibisyong militar niya ay pinamunuan ng anak niyang si Amizabad.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Si Benaias ay isang magiting na mandirigma na kabilang sa Tatlumpu at namumuno sa Tatlumpu.”
    reason: Maaaring unawain ang הוּא bilang “Siya/Si Benaias ay,” at ang pariralang “magiting na mandirigma sa Tatlumpu” bilang pagiging kabilang sa pangkat.
lexical_decisions:
- source_word: הוּא
  choice: Ito si
  rationale: Ang panghalip ay muling tumutukoy sa opisyal na binanggit sa naunang talata; likas sa Tagalog ang “Ito si” bilang pagkilala sa kanya.
- source_word: גִּבּוֹר
  choice: magiting na mandirigma
  rationale: Sa kontekstong militar ng Mga Cronica, tumutukoy ito sa isang matapang at kilalang mandirigma; malinaw at marangal ang parirala sa modernong Tagalog.
- source_word: הַשְּׁלֹשִׁים
  choice: ang Tatlumpu
  rationale: Tumutukoy ito sa kinikilalang pangkat ng mga piling mandirigma ni David, kaya ginamit ang malaking titik upang ipakitang pangalan ito ng pangkat.
- source_word: וְעַל הַשְּׁלֹשִׁים
  choice: at namumuno sa Tatlumpu
  rationale: Ang עַל ay nagpapahiwatig dito ng kapangyarihan o pamamahala sa pangkat. Mas natural sa Tagalog ang “namumuno sa” kaysa sa literal na “nasa ibabaw ng.”
- source_word: מַחֲלֻקְתּוֹ
  choice: ang kanyang pangkat
  rationale: Sa kabanatang ito, ang salita ay tumutukoy sa isa sa mga salit-salitang pangkat militar. Ang “pangkat” ay malinaw sa ordinaryong mambabasa nang hindi labis na teknikal.
- source_word: עַמִּיזָבָד בְּנוֹ
  choice: ang anak niyang si Amizabad
  rationale: Inayos ayon sa likas na ayos ng Tagalog habang pinananatili ang ugnayang ama at anak.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “Tatlumpu” bilang pangalan ng kilalang piling pangkat militar. Ang “nasa ilalim ng pamamahala” ay nilinaw upang ipahayag na si Amizabad ang nangangasiwa sa pangkat, hindi na ang pangkat ay pag-aari lamang niya.
