revisions:
- from: Ito si Benaias[a], isang magiting na mandirigma sa Tatlumpu at namumuno sa Tatlumpu. Ang kanyang pangkat ay nasa ilalim ng pamamahala ng anak niyang si Amizabad.
  to: Ito si Benaias[a], isang magiting na mandirigma sa Tatlumpu at namumuno sa Tatlumpu. Ang dibisyong militar niya ay pinamunuan ng anak niyang si Amizabad.
  rationale: Pinalitan ang pangkalahatang “pangkat” ng “dibisyong militar” upang maipakita ang teknikal na gamit ng מַחֲלֻקְתּוֹ sa 1 Cronica 27. Inayos din ang huling sugnay upang malinaw ngunit hindi labis na mapaliwanag ang ipinahihiwatig na pamumuno ni Amizabad. Pinanatili ang pagkakakilanlan ng Tatlumpu bilang kinikilalang pangkat at ang maingat na talababa tungkol sa sintaks ng Hebreo.
