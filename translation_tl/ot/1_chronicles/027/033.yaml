  text: And Ahithophel was counselor to the king[a], and Hushai the Archite was the king’s friend.
translation:
  language: tl
  text: At si Ahitofel ay tagapayo ng hari, at si Husai na Arkita ay kaibigan[a] ng hari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kasama” o “kasamahan”; ang salitang Hebreo ay maaaring tumukoy sa isang kaibigan sa pangkalahatan, at sa konteksto ng palasyo ay maaari ring magpahiwatig ng isang pinagkakatiwalaang kasamahan ng hari.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲחִיתֹפֶל
  choice: Ahitofel
  rationale: Pangngalang pantangi; isina-Filipino ang transliterasyon upang maging natural basahin sa Tagalog.
- source_word: יוֹעֵץ
  choice: tagapayo
  rationale: Tumutukoy sa isang nagbibigay ng payo at angkop sa konteksto ng maharlikang paglilingkod.
- source_word: לַמֶּלֶךְ
  choice: ng hari
  rationale: Sa natural na Tagalog, ang ugnayan o paglilingkod sa hari ay malinaw na naipahahayag sa pariralang “tagapayo ng hari.”
- source_word: חוּשַׁי
  choice: Husai
  rationale: Pangngalang pantangi; direktang transliterasyon na angkop sa baybay ng Tagalog.
- source_word: הָאַרְכִּי
  choice: na Arkita
  rationale: Tawag na nagpapakilala kay Husai ayon sa angkan o lugar; ginamit ang hulaping -ita bilang natural na anyong gentiliko sa Filipino.
- source_word: רֵעַ
  choice: kaibigan
  rationale: Ito ang payak at pangunahing kahulugan; maaari rin itong tumukoy sa isang pinagkakatiwalaang kasamahan sa korte, kaya pinanatili ang lawak ng kahulugan sa talababa.
- source_word: הַמֶּלֶךְ
  choice: ng hari
  rationale: Natural na Tagalog na pagpapahayag ng kaugnayang ipinakikita ng Hebrew construct.
- source_word: וַ / וְ
  choice: At … at
  rationale: Pinananatili ang pagkakaugnay ng dalawang tala sa listahan at ang payak na koordinasyon ng Hebreo.
