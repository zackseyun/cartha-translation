  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “namahala,” “pangkat,” at “pinuno” para sa malinaw na kontekstong militar-administratibo, at iniwasan ang mga katawagang makaluma o labis na espesipiko sa ranggo.
