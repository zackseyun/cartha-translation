  text: Over the division for the second month was Dodai the Ahohite[a], and Mikloth was the leader over his division; and in his division were twenty-four thousand.
translation:
  language: tl
  text: Ang namahala sa pangkat para sa ikalawang buwan ay si Dodai na Ahohita[a], at si Miklot ang pinuno ng kanyang pangkat. Ang kanyang pangkat ay may dalawampu't apat na libong tauhan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring unawain ang Hebreo bilang: “at ang kanyang pangkat, at si Miklot na pinuno.” Masinsin at pinaikli ang pagkakasunod-sunod ng mga salita sa Hebreo, kaya pinagtatalunan kung si Miklot ay ikalawang pinuno sa pangkat ni Dodai o ang pinunong nakatalaga sa pangkat nito.'
    reason: alternative_reading
lexical_decisions:
- source_word: מַחֲלֹקֶת / מַחֲלֻקְתּוֹ
  choice: pangkat / kanyang pangkat
  rationale: Sa kontekstong militar at administratibo, tumutukoy ito sa yunit na salit-salitang naglilingkod bawat buwan. Likas at malinaw sa modernong Filipino ang “pangkat.”
- source_word: הַחֹדֶשׁ הַשֵּׁנִי
  choice: ikalawang buwan
  rationale: Tuwirang salin ng ordinal na pagtukoy sa buwan ng paglilingkod.
- source_word: דּוֹדַי
  choice: Dodai
  rationale: Pinanatili ang anyo ng pangalang nasa talatang Hebreo, sa halip na gamitin ang kaugnay na anyong Dodo.
- source_word: הָאֲחוֹחִי
  choice: na Ahohita
  rationale: Isinalin bilang katawagang angkan o pinagmulan sa paraang natural sa Filipino.
- source_word: וּמִקְלוֹת
  choice: Miklot
  rationale: Transliterasyon ng pangalang pantangi ayon sa natural na baybay Filipino.
- source_word: הַנָּגִיד
  choice: pinuno
  rationale: Sapat na malawak para sa papel na militar-administratibo nang hindi nagtatakda ng ranggong hindi tiyak sa teksto.
- source_word: וְעַל־מַחֲלֻקְתּוֹ
  choice: ng kanyang pangkat
  rationale: Sa pangunahing pagbasa, inilalarawan nito ang saklaw ng pamumuno ni Miklot. Inayos ang pangungusap upang maging natural sa Filipino habang pinananatili sa talababa ang sintaktikong kalabuan.
- source_word: עֶשְׂרִים וְאַרְבָּעָה אָלֶף
  choice: dalawampu't apat na libong tauhan
  rationale: Isinalin ang bilang sa mga salita; idinagdag ang “tauhan” bilang likas na ipinahihiwatig na binibilang sa kontekstong militar.
