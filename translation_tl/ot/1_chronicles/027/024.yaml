  terminology: Ang “poot,” “bilang,” “itinala,” at “opisyal na talaan” ay magkakatugma at angkop sa rehistro. Hindi idinagdag ang “sensus” o ang tahasang pangalan ng Diyos, kaya hindi nasosobrahan ang teksto. Maayos ang paggamit ng “Haring David” at “Zeruia.”
