  source_fidelity: Tapat ang salin sa Hebreo. Ang “Nagsimulang magbilang” at “hindi niya ito natapos” ay wastong naghahatid ng הֵחֵל לִמְנוֹת at וְלֹא כִלָּה. Napananatili rin ng “Dahil dito, dumating ang poot sa Israel” ang hindi tahasang pagpapangalan sa pinagmulan ng poot. Ang “hindi itinala” ay angkop na idyomatikong salin ng וְלֹא עָלָה sa kontekstong pangtalaan, at ang “ni Haring David” ay wastong kumakatawan sa ugnayang ipinahihiwatig ng לְ.
