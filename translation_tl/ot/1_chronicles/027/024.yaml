base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/024.yaml
  text: Joab son of Zeruiah began to count[a], but he did not finish; and because of this wrath came upon Israel[b]. And the number was not entered in the account of the chronicles of King David.
translation:
  language: tl
  text: Nagsimulang magbilang si Joab na anak ni Zeruia, ngunit hindi niya ito natapos. Dahil dito, dumating ang poot sa Israel. At ang bilang ay hindi itinala[a] sa opisyal na talaan[b] ni Haring David.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “hindi isinama” o “hindi ipinasok sa talaan.” Literal na sinasabi ng Hebreo na “hindi umakyat,” isang idyoma para sa pagpasok sa isang opisyal na rekord.
    reason: lexical_alternative
  - marker: b
    text: Ang “opisyal na talaan” ay tumutukoy sa mga annal o rekord ng kaharian na kaugnay ni Haring David.
    reason: cultural_note
lexical_decisions:
- source_word: הֵחֵל לִמְנוֹת
  choice: nagsimulang magbilang
  rationale: Tuwirang ipinapahayag ang pagsisimula ng pagbibilang nang hindi idinaragdag ang mas tiyak na salitang “sensus,” na wala mismo sa parirala.
- source_word: וְלֹא כִלָּה
  choice: ngunit hindi niya ito natapos
  rationale: Ang כִלָּה ay nangangahulugang tinapos o kinumpleto; nilinaw ng “niya” at “ito” ang likas na ugnayan nito sa naunang pagbibilang.
- source_word: וַיְהִי בָזֹאת קֶצֶף עַל יִשְׂרָאֵל
  choice: Dahil dito, dumating ang poot sa Israel
  rationale: Ipinapakita ng “dahil dito” ang ugnayang ipinahihiwatig ng בָזֹאת, habang pinananatiling hindi tahasang pinangalanan ang pinagmulan ng poot.
- source_word: הַמִּסְפָּר
  choice: ang bilang
  rationale: Pinananatili nito ang leksikal na kaugnayan sa naunang “magbilang” at tumutukoy sa resultang kabuuan.
- source_word: וְלֹא עָלָה
  choice: hindi itinala
  rationale: Bagaman literal na “hindi umakyat,” ang pandiwa ay idyomatikong tumutukoy rito sa hindi pagpasok ng impormasyon sa isang opisyal na rekord.
- source_word: בְּמִסְפַּר דִּבְרֵי הַיָּמִים
  choice: sa opisyal na talaan
  rationale: Ang דִּבְרֵי הַיָּמִים ay tumutukoy sa mga annal o kronikang opisyal; natural at malinaw sa modernong Filipino ang “opisyal na talaan.”
- source_word: לַמֶּלֶךְ דָּוִיד
  choice: ni Haring David
  rationale: Ang “ni” ay likas na nagpapahayag ng kaugnayan o pag-aari ng talaan kay David nang hindi ipinahihiwatig na personal na isinumite sa kaniya ang bilang.
theological_decisions:
- issue: Kung tahasang kikilalanin ang Diyos bilang pinagmulan ng poot
  choice: 'Pinanatiling di-tahas ang gumaganap: “dumating ang poot sa Israel.”'
  alternative: “Dumating sa Israel ang poot ng Panginoon” o “nagalit ang Diyos sa Israel.”
  rationale: Bagaman ipinahihiwatig ng mas malawak na salaysay na banal na paghatol ito, hindi tahasang pinangalanan ng sugnay na Hebreo ang Diyos; kaya pinananatili ng salin ang ambiguwidad ng teksto.
translation_notes:
  register: Modernong Filipino na dignificado at madaling maunawaan. Ginamit ang maiikling sugnay upang malinaw ang daloy, at iniwasang gawing mas tiyak kaysa sa Hebreo ang uri ng pagbibilang at ang tahasang pinagmulan ng poot.
