base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/029.yaml
  text: Over the herds grazing in Sharon was Shitrai the Sharonite[b][a], and over the herds in the valleys was Shaphat son of Adlai.
translation:
  language: tl
  text: Ang namamahala sa mga bakang nanginginain sa Sharon ay si Shitrai na taga-Sharon[b], at ang namamahala sa mga baka[a] sa mga lambak ay si Shafat na anak ni Adlai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga kawan ng baka.”
    reason: lexical_alternative
  - marker: b
    text: Ang Sharon ay ang kapatagang baybayin ng Israel; ang “taga-Sharon” ay isang taong mula sa rehiyong iyon.
    reason: cultural_note
lexical_decisions:
- source_word: וְעַל
  choice: ang namamahala sa
  rationale: Sa talaang administratibo, ipinahihiwatig ng עַל ang pananagutan o pangangasiwa. Likas at malinaw sa makabagong Tagalog ang “ang namamahala sa.”
- source_word: הַבָּקָר
  choice: mga baka
  rationale: Ang בָּקָר ay tumutukoy sa mga alagang hayop na bovine, bilang kolektibong pangngalan. Pinakatumpak at karaniwan sa Tagalog ang “mga baka”; maaari ring unawain bilang kawan ng mga baka.
- source_word: הָרֹעִים
  choice: nanginginain
  rationale: Ang participle ng רעה ay naglalarawan sa mga bakang kumakain sa pastulan. Direktang ipinahahayag ito ng “nanginginain.”
- source_word: בַּשָּׁרוֹן
  choice: sa Sharon
  rationale: Pangalan ng rehiyon ang Sharon, kaya pinanatili itong transliterado at nilagyan ng karaniwang panandang pook na “sa.”
- source_word: שטרי
  choice: Shitrai
  rationale: Personal na pangalan ito; ang “Shitrai” ay malapit na transliterasyon ng anyong Hebreo.
- source_word: הַשָּׁרוֹנִי
  choice: taga-Sharon
  rationale: Ipinakikilala ng anyong gentilic ang pinagmulan o kaugnayan ni Shitrai sa Sharon. Mas natural sa Tagalog ang “taga-Sharon” kaysa sa isang hiniram na katawagang gentiliko.
- source_word: בָּעֲמָקִים
  choice: sa mga lambak
  rationale: Ang עֲמָקִים ay pangmaramihan ng “lambak” o mababang malalim na lupain. Direktang salin ang “sa mga lambak.”
- source_word: שָׁפָט
  choice: Shafat
  rationale: Personal na pangalan; ginamit ang transliterasyong umaayon sa bigkas ng Hebreo at sa ortograpiyang Filipino.
- source_word: בֶּן עַדְלָי
  choice: anak ni Adlai
  rationale: Karaniwan at malinaw na salin sa Tagalog ng Hebreong patronimikong parirala.
theological_decisions: []
translation_notes:
  register: 'Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang buong pariralang “ang namamahala sa” upang malinaw na maipakita ang tungkuling administratibo, at pinanatili ang magkatulad na estruktura ng dalawang sugnay. Ang pagkakasunod ng mga panandang [b][a] ay sumusunod sa kanilang kaugnayan sa teksto: [b] sa taga-Sharon at [a] sa mga baka.'
