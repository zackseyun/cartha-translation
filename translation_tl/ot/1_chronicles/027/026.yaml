  text: And over those who did the work of the field for the cultivation of the ground was Ezri son of Chelub[a][b].
translation:
  language: tl
  text: Ang namamahala sa mga gumagawa ng gawaing bukid para sa paglilinang ng lupa[a][b] ay si Ezri na anak ni Kelub.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa mga manggagawa sa bukid.” Maaaring isalin nang mas maikli ang Hebreong pariralang participial.
    reason: lexical_alternative
  - marker: b
    text: O “para sa paggawa sa lupa.” Tumutukoy ang parirala sa gawaing pansakahan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל
  choice: Ang namamahala sa
  rationale: Sa talaan ng mga tungkulin, ipinapahiwatig ng עַל ang taong inilagay na tagapangasiwa sa isang larangan; natural itong ipinahayag sa Tagalog bilang “ang namamahala sa.”
- source_word: עֹשֵׂי מְלֶאכֶת הַשָּׂדֶה
  choice: mga gumagawa ng mga gawain sa bukid
  rationale: Pinananatili nito ang participial na pagtukoy sa mga taong gumagawa at ang malawak na diwa ng מְלָאכָה bilang gawain o paggawa sa bukid.
- source_word: לַעֲבֹדַת הָאֲדָמָה
  choice: upang bungkalin ang lupa
  rationale: Sa kontekstong pansakahan, ang עֲבֹדָה kasama ng אֲדָמָה ay tumutukoy sa paglinang o paggawa sa lupa; “bungkalin ang lupa” ay malinaw at likas sa modernong Tagalog.
- source_word: עֶזְרִי בֶּן כְּלוּב
  choice: Ezri na anak ni Kelub
  rationale: Isinalin ang בֶּן sa karaniwang anyong Tagalog na “anak ni,” at tinumbasan sa baybay-Tagalog ang pangalang כְּלוּב bilang “Kelub.”
