  text: וְ/עַל הַ/זֵּיתִ֤ים וְ/הַ/שִּׁקְמִים֙ אֲשֶׁ֣ר בַּ/שְּׁפֵלָ֔ה בַּ֥עַל חָנָ֖ן הַ/גְּדֵרִ֑י וְ/עַל אֹצְר֥וֹת הַ/שֶּׁ֖מֶן יוֹעָֽשׁ־ס־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/028.yaml
  text: Over the olive trees and the sycamore trees in the Shephelah was Baal-hanan the Gederite[b][a]; and over the stores of oil was Joash.
translation:
  language: tl
  text: Ang namamahala sa mga puno ng olibo at mga puno ng sikomoro[b] sa Shefela[a] ay si Baal-hanan na taga-Geder; at ang namamahala sa mga imbakan ng langis ay si Joas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa mababang lupain.” Ang Shefela ay ang rehiyon ng mga paanan ng bundok sa Juda.
    reason: cultural_note
  - marker: b
    text: Ang “mga puno ng sikomoro” ay maaari ding isaling “mga puno ng sikomorong igos.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל
  choice: Ang namamahala sa
  rationale: Sa konteksto ng talaan ng mga opisyal, ipinahihiwatig ng עַל ang pananagutan o pangangasiwa sa isang larangan; likas at malinaw ito sa modernong Tagalog.
- source_word: הַזֵּיתִים
  choice: mga puno ng olibo
  rationale: Sa konteksto ng pangangasiwa sa lupain, mga puno at hindi bunga ang tinutukoy.
- source_word: וְהַשִּׁקְמִים
  choice: at mga puno ng sikomoro
  rationale: Ang שִׁקְמִים ay tumutukoy sa sycamore-fig; ginamit ang maikli at kinikilalang pangalang 'sikomoro,' na may paliwanag sa talababa.
- source_word: אֲשֶׁר בַּשְּׁפֵלָה
  choice: sa Shefela
  rationale: Maaaring pangalang heograpikal ang שְׁפֵלָה; pinanatili ang pangalan ng rehiyon at ipinaliwanag ang kahulugan nito sa talababa.
- source_word: בַּעַל חָנָן
  choice: Baal-hanan
  rationale: Isinalin-titik ang personal na pangalan mula sa Hebreo, na pinananatili ang malinaw na dalawang bahagi nito.
- source_word: הַגְּדֵרִי
  choice: na taga-Geder
  rationale: Ang anyong gentilic ay likas na ipinahahayag sa Tagalog bilang pinagmulan o kaugnayan sa isang lugar.
- source_word: אֹצְרוֹת הַשֶּׁמֶן
  choice: mga imbakan ng langis
  rationale: Ang parirala ay maaaring tumukoy sa mga pasilidad o reserbang pinaglalagyan ng langis; sapat na malawak at natural ang 'mga imbakan.'
- source_word: יוֹעָשׁ
  choice: Joas
  rationale: Ginamit ang nakaugaliang anyong Tagalog ng personal na pangalang ito.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang paulit-ulit na 'ang namamahala' upang ihayag nang natural ang administratibong kayarian ng Hebreo. Ang mga panandang talababa [b] at [a] ay inilagay agad sa kaugnay na mga salita.
