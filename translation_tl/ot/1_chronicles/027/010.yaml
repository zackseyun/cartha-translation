base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/010.yaml
  text: 'The seventh[a], for the seventh month: Helez the Pelonite, from the sons of Ephraim; and over his division were twenty-four thousand.'
translation:
  language: tl
  text: Ang ikapito[a], para sa ikapitong buwan, ay si Helez na Pelonita, mula sa mga anak ni Efraim; ang kanyang pangkat ay may dalawampu't apat na libo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O maaaring “ang Paltita,” ayon sa ibang tradisyonal na pagkakakilanlan sa angkan ni Helez.
    reason: alternative_reading
lexical_decisions:
- source_word: הַשְּׁבִיעִי
  choice: Ang ikapito
  rationale: Pang-uring pamilang na ginagamit nang eliptikal sa talaan at tumutukoy sa ikapitong pinuno; pinananatili ang maikling anyo nang hindi nagdaragdag ng salitang wala sa Hebreo.
- source_word: לַחֹדֶשׁ הַשְּׁבִיעִי
  choice: para sa ikapitong buwan
  rationale: Ang לְ kasama ng חֹדֶשׁ ay nagpapahayag ng buwanang takdang paglilingkod sa konteksto ng kabanata.
- source_word: חֶלֶץ
  choice: Helez
  rationale: Pangalang pantangi na isinalin sa paraang transliterasyon.
- source_word: הַפְּלוֹנִי
  choice: na Pelonita
  rationale: Tawag sa angkan o pinagmulan ni Helez; sinusunod ng 'Pelonita' ang anyong katinig ng tekstong Masoretiko sa talatang ito.
- source_word: מִן בְּנֵי אֶפְרָיִם
  choice: mula sa mga anak ni Efraim
  rationale: Pinananatili ang Hebreong idyomang pantribo habang malinaw pa rin sa makabagong Tagalog.
- source_word: וְעַל מַחֲלֻקְתּוֹ
  choice: sa ilalim ng kanyang pangkat
  rationale: Ang מַחֲלֻקָה rito ay yunit o pangkat militar, at ang עַל ay nagpapahiwatig ng pamumuno o kapamahalaan ni Helez dito. Isinaayos nang natural sa Tagalog kasama ng kasunod na bilang.
- source_word: עֶשְׂרִים וְאַרְבָּעָה אָלֶף
  choice: dalawampu't apat na libo
  rationale: Karaniwang pagpapahayag sa Tagalog ng bilang na 24,000, na isinulat sa mga salita para sa estilong pampanitikan.
