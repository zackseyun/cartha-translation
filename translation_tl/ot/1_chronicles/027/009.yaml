base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/009.yaml
  text: 'The sixth, for the sixth month: Ira son of Ikkesh the Tekoite; and over his division were twenty-four thousand.'
translation:
  language: tl
  text: 'Ang ikaanim, para sa ikaanim na buwan: si Ira na anak ni Ikkesh, na taga-Tekoa; at ang kanyang pangkat ay may dalawampu''t apat na libo.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַשִּׁשִּׁי
  choice: Ang ikaanim
  rationale: Pinananatili ang maikling eliptikong pormula ng talaan; ipinahihiwatig ng konteksto kung ito ay pinuno o pangkat nang hindi iyon idinaragdag sa teksto.
- source_word: לַחֹדֶשׁ הַשִּׁשִּׁי
  choice: para sa ikaanim na buwan
  rationale: Ang ל sa kontekstong administratibo ay nagpapahiwatig ng pagkakatalaga sa buwan ng paglilingkod.
- source_word: עִירָא
  choice: Ira
  rationale: Tuwirang transliterasyon ng pangalang pantangi.
- source_word: בֶן עִקֵּשׁ
  choice: anak ni Ikes
  rationale: Likas na makabagong Tagalog para sa karaniwang pormulang Hebreo ng pagkamag-ama.
- source_word: הַתְּקוֹעִי
  choice: na taga-Tekoa
  rationale: Ang gentiliko ay tumutukoy sa taong mula sa Tekoa; mas natural sa Tagalog ang 'taga-Tekoa.'
- source_word: וְעַל מַחֲלֻקְתּוֹ
  choice: at ang kanyang pangkat ay may
  rationale: Ang מַחֲלֻקָה rito ay isang pangkat militar na salit-salitang naglilingkod; ang parirala ay natural na nagsasaad ng bilang ng mga tauhan sa ilalim niya.
- source_word: עֶשְׂרִים וְאַרְבָּעָה אָלֶף
  choice: dalawampu't apat na libo
  rationale: Karaniwang makabagong Tagalog na anyo ng bilang na 24,000.
