base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/022.yaml
  text: 'For Dan: Azarel son of Jeroham[a]. These were the leaders of the tribes of Israel.'
translation:
  language: tl
  text: 'Para sa lipi ni Dan: si Azarel na anak ni Jeroham. Ang mga ito ang mga pinuno[a] ng mga lipi ng Israel.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga pangulo” o “mga opisyal.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לְ/דָן
  choice: Para sa lipi ni Dan
  rationale: Ipinahihiwatig ng prefixed לְ ang liping saklaw ng tala. Idinagdag ang “lipi ni” upang maging natural at malinaw sa Tagalog ang maikling administratibong pamagat, nang hindi binabago ang diwa.
- source_word: עֲזַרְאֵל
  choice: Azarel
  rationale: Tuwirang transliterasyon ng pangalang Hebreo na angkop sa karaniwang baybay sa Bibliyang Tagalog.
- source_word: בֶּן
  choice: anak ni
  rationale: Karaniwan at malinaw na katumbas sa Tagalog ng ugnayang pampamilya na ipinahahayag ng construct form.
- source_word: יְרֹחָם
  choice: Jeroham
  rationale: Transliterasyong malapit sa Hebreo at naaayon sa kinaugaliang anyo ng pangalang biblikal.
- source_word: אֵלֶּה
  choice: Ang mga ito
  rationale: Tuwirang ipinapahayag ang pangmaramihang pantukoy na nagbubuod sa mga taong katatapos lamang ilista.
- source_word: שָׂרֵי
  choice: mga pinuno
  rationale: Malinaw at likas na katawagan para sa mga taong may pamumuno sa mga lipi; hindi nito ipinapalagay na sila ay mga maharlikang prinsipe o mga burukratikong opisyal lamang.
- source_word: שִׁבְטֵי
  choice: ng mga lipi ng
  rationale: Tuwirang salin ng construct plural at natural na bumubuo sa pariralang “mga lipi ng Israel.”
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Kinaugaliang transliterasyon sa Tagalog ng pangalang pambansa.
