  text: וְ/עַל֙ אֹצְר֣וֹת הַ/מֶּ֔לֶךְ עַזְמָ֖וֶת בֶּן עֲדִיאֵ֑ל וְ/עַ֣ל הָֽ/אֹצָר֡וֹת בַּ/שָּׂדֶ֞ה בֶּ/עָרִ֤ים וּ/בַ/כְּפָרִים֙ וּ/בַ/מִּגְדָּל֔וֹת יְהוֹנָתָ֖ן בֶּן עֻזִּיָּֽהוּ־ס־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/025.yaml
  text: Over the king’s treasuries was Azmaveth son of Adiel[a], and over the treasuries in the countryside, in the cities, in the villages, and in the towers[b], was Jehonathan son of Uzziah.
translation:
  language: tl
  text: Ang namamahala sa mga imbakan ng hari ay si Azmavet na anak ni Adiel. Ang namamahala naman sa mga imbakan sa kabukiran[a], sa mga lungsod, sa mga nayon, at sa mga tore ay si Yehonatan[b] na anak ni Uzias.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa bukid.” Isahan ang salitang Hebreo, ngunit malamang na kolektibo ang kahulugan nito rito at tumutukoy sa kabukiran bilang naiiba sa mga lungsod, nayon, at tore.
    reason: lexical_alternative
  - marker: b
    text: Ang “Yehonatan” ang mas buong anyo ng pangalan sa Hebreo rito; sa ibang salin ay pinaikli ito bilang “Jonatan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל
  choice: Ang namamahala sa ... ay
  rationale: Sa talaang administratibo, ang עַל ay nagpapahiwatig ng pangangasiwa o pananagutan. Natural sa modernong Tagalog ang hulma na ito habang pinananatili ang diwa ng pagkatalaga.
- source_word: אֹצְרוֹת / הָאֹצָרוֹת
  choice: mga imbakan / mga imbakan
  rationale: Maaaring tumukoy ang אֹצָר sa kabang-yaman, bodega, o mga nakaimbak na pag-aari. Ang “imbakan” ay sapat na malawak para sa kontekstong administratibo at hindi nililimitahan ang kahulugan sa salapi lamang.
- source_word: הַמֶּלֶךְ
  choice: ng hari
  rationale: Tuwiran at natural na salin ng pariralang konstruktong אֹצְרוֹת הַמֶּלֶךְ.
- source_word: עַזְמָוֶת
  choice: Azmavet
  rationale: Transliterasyon na malapit sa tunog ng pangalang Hebreo at madaling basahin sa Filipino.
- source_word: בֶּן עֲדִיאֵל
  choice: anak ni Adiel
  rationale: Karaniwang paraan sa Filipino ng pagtukoy sa anak at ama sa isang talaan ng mga pangalan.
- source_word: בַּשָּׂדֶה
  choice: sa kabukiran
  rationale: Bagaman isahan ang literal na “bukid,” kolektibo ang gamit dito at ikinokontra sa mga lungsod, nayon, at tore. Malinaw na ipinahahayag ng “kabukiran” ang mga lugar sa labas ng mga pamayanan.
- source_word: בֶּעָרִים
  choice: sa mga lungsod
  rationale: Tuwirang lokatibong salin na angkop sa talaan ng mga lugar.
- source_word: וּבַכְּפָרִים
  choice: sa mga nayon
  rationale: Ang כְּפָרִים ay tumutukoy sa maliliit na pamayanang rural; natural at dignificado sa Filipino ang “mga nayon.”
- source_word: וּבַמִּגְדָּלוֹת
  choice: sa mga tore
  rationale: Tore ang tiyak na sinasabi ng Hebreo. Hindi idinagdag ang “bantayan” o “pinatibay” sapagkat hindi iyon tahasang tinutukoy ng teksto.
- source_word: יְהוֹנָתָן
  choice: Yehonatan
  rationale: Pinananatili nito ang mas buong anyo ng pangalang Hebreo sa talata, sa halip na paikliin bilang Jonatan.
- source_word: בֶּן עֻזִּיָּהוּ
  choice: anak ni Uzias
  rationale: Ginamit ang nakaugaliang anyong Filipino na “Uzias” para sa pangalang עֻזִּיָּהוּ.
