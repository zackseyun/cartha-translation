  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/עַל הַ֨/כְּרָמִ֔ים שִׁמְעִ֖י הָ/רָֽמָתִ֑י וְ/עַ֤ל שֶׁ/בַּ/כְּרָמִים֙ לְ/אֹצְר֣וֹת הַ/יַּ֔יִן זַבְדִּ֖י הַ/שִּׁפְמִֽי־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/027.yaml
  text: Over the vineyards was Shimei the Ramathite[b][a]; and over the produce of the vineyards for the wine cellars was Zabdi the Shiphmite.
translation:
  language: tl
  text: Ang namamahala sa mga ubasan ay si Simei na Ramatita; at ang namamahala sa ani ng mga ubasan[a] na para sa mga imbakan ng alak[b] ay si Zabdi na Sifmita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “ang nasa mga ubasan”; malamang na tumutukoy ito sa ani o bunga ng mga ubasan.
    reason: lexical_alternative
  - marker: b
    text: O “mga bodega ng alak.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל
  choice: ang namamahala sa
  rationale: Sa talaan ng mga opisyal, ipinahihiwatig ng עַל ang pananagutan o pangangasiwa. Mas natural at malinaw ito sa modernong Tagalog kaysa sa literal na “nasa ibabaw ng.”
- source_word: הַכְּרָמִים
  choice: mga ubasan
  rationale: Karaniwang kahulugan ng כֶּרֶם ang ubasan; tumutukoy rito ang maramihan sa mga ubasang nasa ilalim ng pangangasiwa ng hari.
- source_word: שִׁמְעִי
  choice: Simei
  rationale: Isinalin sa karaniwang anyong ginagamit sa Tagalog para sa pangalang Hebreo.
- source_word: הָרָמָתִי
  choice: Ramatita
  rationale: Pinanatili bilang katawagang nagmula sa pangalan ng lugar, sa halip na ipalagay nang tahasan ang eksaktong Ramang tinutukoy.
- source_word: שֶׁבַּכְּרָמִים
  choice: ani ng mga ubasan
  rationale: Literal itong “ang nasa mga ubasan,” ngunit sa konteksto ng paggawa at pag-iimbak ng alak, malamang na tumutukoy sa ani o bunga ng mga ubasan. Nililinaw ng “ani” ang pagkakaiba nito sa mismong mga ubasan habang itinatala sa talababa ang literal na anyo.
- source_word: לְאֹצְרוֹת הַיַּיִן
  choice: na para sa mga imbakan ng alak
  rationale: Ang אֹצָר ay maaaring imbakan o kabang-yaman; dahil alak ang iniimbak, ang tinutukoy ay mga pasilidad na imbakan. Pinananatili ng “para sa” ang layuning ipinahihiwatig ng לְ.
- source_word: זַבְדִּי
  choice: Zabdi
  rationale: Tuwirang transliterasyon ng personal na pangalan sa anyong madaling basahin sa Tagalog.
- source_word: הַשִּׁפְמִי
  choice: Sifmita
  rationale: Pinanatili bilang katawagang kaugnay ng isang pangalan ng lugar, yamang hindi tiyak ang eksaktong pagkakakilanlan ng lugar at hindi nararapat magdagdag ng haka-hakang paliwanag sa pangunahing teksto.
theological_decisions: []
translation_notes:
  register: Gumamit ng makabago ngunit marangal na Tagalog. Ang paulit-ulit na “ang namamahala sa” ay likas sa isang administratibong talaan at malinaw na naghahayag ng tungkulin. Pinanatili bilang mga katawagang pantangi ang Ramatita at Sifmita upang hindi magtakda ng hindi tiyak na pagkakakilanlan ng mga lugar.
