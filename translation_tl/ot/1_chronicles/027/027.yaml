  source_fidelity: 'Tumpak ang pagsasalin sa estrukturang administratibo ng talata: si Simei ang nakatalaga sa mga ubasan, at si Zabdi ang nakatalaga sa ani/laman ng mga ubasan kaugnay ng mga imbakan ng alak. Ang “ani ng mga ubasan” ay isang ligtas at kontekstuwal na paglilinaw ng שֶׁבַּכְּרָמִים, habang pinananatili ng talababa ang literal at di-ganap na tiyak na saklaw ng parirala.'
