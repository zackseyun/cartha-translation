base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/007.yaml
  text: The fourth[a], for the fourth month, was Asahel the brother of Joab, and Zebadiah his son after him; and over his division were twenty-four thousand.
translation:
  language: tl
  text: Ang ikaapat, para sa ikaapat na buwan, ay si Asahel na kapatid ni Joab; kasunod niya ay ang anak niyang si Zebadias.[a] Ang kaniyang pangkat ay binubuo ng dalawampu't apat na libo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “at humalili sa kanya ang anak niyang si Zebadias.” Literal sa Hebreo, “pagkatapos niya,” na nagpapahiwatig ng paghalili.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרְבִיעִי
  choice: Ang ikaapat
  rationale: Ginamit ang pang-uring pamilang bilang pangngalan, gaya ng eliptikong pormula sa talaan; hindi tahasang sinasabi ng Hebreo kung ang tinutukoy ay pinuno, pangkat, o takdang paglilingkod.
- source_word: לַחֹדֶשׁ הָרְבִיעִי
  choice: para sa ikaapat na buwan
  rationale: Ipinahihiwatig ng ל ang pagkakatakda sa buwanang salitan ng paglilingkod.
- source_word: עֲשָׂהאֵל
  choice: Asahel
  rationale: Karaniwang anyong Filipino ng pangalang Hebreo.
- source_word: אֲחִי יוֹאָב
  choice: kapatid ni Joab
  rationale: Likas na Filipino para sa pariralang konstruktong tumutukoy sa kaugnayan ni Asahel kay Joab.
- source_word: וּזְבַדְיָה בְנוֹ אַחֲרָיו
  choice: at ang anak niyang si Zebadias pagkatapos niya
  rationale: Pinanatili ang literal at bahagyang eliptikong ‘pagkatapos niya’; sa konteksto, ipinahihiwatig nito na humalili si Zebadias kay Asahel.
- source_word: וְעַל מַחֲלֻקְתּוֹ
  choice: Ang pangkat niya ay binubuo ng
  rationale: Ang מַחֲלֻקָה sa kabanatang ito ay isang pangkat o dibisyong militar. Isinaayos ang idyomang Hebreo upang maging malinaw at likas sa Filipino nang hindi nagdaragdag ng hindi tahasang tungkulin.
- source_word: עֶשְׂרִים וְאַרְבָּעָה אָלֶף
  choice: 24,000 tauhan
  rationale: Makabagong pagsulat ng bilang; ang ‘tauhan’ ay likas sa konteksto ng talaang militar at hindi nililimitahan sa isang partikular na ranggo.
