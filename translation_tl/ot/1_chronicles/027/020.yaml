translation:
  language: tl
  text: 'Para sa mga anak ni Efraim: si Hosea na anak ni Azazias[a]; para sa kalahating lipi ni Manases: si Joel na anak ni Pedaias.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring baybayin ang Hosea bilang “Oseas.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לִ/בְנֵי
  choice: Para sa mga anak ni
  rationale: Ang ל ay nagpapahiwatig ng nakatalagang pananagutan para sa isang pangkat, at ang בְנֵי ay pinanatiling “mga anak” bilang karaniwang katawagan sa pangkat ng isang lipi.
- source_word: אֶפְרַיִם
  choice: Efraim
  rationale: Ginamit ang nakasanayang anyong Filipino ng pangalan ng lipi.
- source_word: הוֹשֵׁעַ
  choice: Hosea
  rationale: Malapit ito sa anyong Hebreo at madaling makilala ng makabagong mambabasang Filipino; binanggit sa talababa ang tradisyonal na anyong “Oseas.”
- source_word: בֶּן
  choice: anak ni
  rationale: Natural na katumbas sa Filipino para sa ugnayang genealogical sa ganitong talaan.
- source_word: עֲזַזְיָהוּ
  choice: Azazias
  rationale: Ginamit ang anyong pangalang angkop sa nakasanayang pagbaybay sa Filipino.
- source_word: לַ/חֲצִי שֵׁבֶט
  choice: para sa kalahating lipi
  rationale: Ang ל ay muling nagpapakita ng nakatalagang pananagutan, samantalang ang חֲצִי שֵׁבֶט ay tuwirang “kalahating lipi.”
- source_word: מְנַשֶּׁה
  choice: Manases
  rationale: Ginamit ang nakasanayang anyong Filipino ng pangalan ng lipi.
- source_word: יוֹאֵל
  choice: Joel
  rationale: Karaniwan at madaling makilalang anyong Filipino ng pangalang Hebreo.
- source_word: פְּדָיָהוּ
  choice: Pedaias
  rationale: Ginamit ang anyong pangalang angkop sa nakasanayang pagbaybay sa Filipino.
