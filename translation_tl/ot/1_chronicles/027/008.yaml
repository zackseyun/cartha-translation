translation_notes:
  register: Modernong Filipino Tagalog na maikli at marangal, angkop sa administratibo at militar na talaan. Pinanatili ang elipsis sa “Ang ikalima” dahil malinaw sa konteksto ng magkakasunod na pangkat.
