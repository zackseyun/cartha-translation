base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/008.yaml
  text: The fifth[a], for the fifth month, was the commander Shamhuth the Izrahite; and over his division were twenty-four thousand.
translation:
  language: tl
  text: Ang ikalimang dibisyon, para sa ikalimang buwan, ay pinamumunuan ni Shamhuth na Izrahita[a]; at ang kanyang dibisyon ay may 24,000 tauhan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Zerahita.” Ganito ito tradisyonal na isinasalin sa ilang salin.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֲמִישִׁי
  choice: Ang ikalima
  rationale: Ginamit ang ordinal bilang pangngalan, gaya sa Hebreo, at tumutukoy sa ikalimang pangkat sa sunod-sunod na talaan.
- source_word: לַחֹדֶשׁ הַחֲמִישִׁי
  choice: para sa ikalimang buwan
  rationale: Ipinahahayag ng ל ang pagkakatalaga ng pangkat sa buwang iyon; natural at malinaw ito sa modernong Tagalog.
- source_word: הַשַּׂר
  choice: pinamunuan ni
  rationale: Isinalin sa pandiwang anyo upang maging natural sa Tagalog habang pinananatili ang diwang si Shamhut ang pinuno o kumandante ng pangkat.
- source_word: שַׁמְהוּת
  choice: Shamhut
  rationale: Tuwirang transliterasyon ng pangalang Hebreo ayon sa Masoretikong pagbigkas.
- source_word: הַיִּזְרָח
  choice: Izrahita
  rationale: Malapit na transliterasyon ng gentiliko sa tekstong Hebreo; inilagay sa talababa ang tradisyonal na alternatibong Zerahita.
- source_word: וְעַל מַחֲלֻקְתּוֹ
  choice: at ang kanyang pangkat ay binubuo ng
  rationale: Ang מַחֲלֻקָה ay pangkat o dibisyong militar sa kabanatang ito. Ang parirala ay ginawang likas sa Tagalog nang hindi binabago ang ugnayan ni Shamhut at ng pangkat.
- source_word: עֶשְׂרִים וְאַרְבָּעָה אָלֶף
  choice: 24,000 tauhan
  rationale: Karaniwang anyo ng bilang sa modernong Tagalog; idinagdag ang 'tauhan' bilang likas na ipinahihiwatig ng talaang militar.
