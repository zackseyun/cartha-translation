base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/018.yaml
  text: For Judah[a], Elihu, one of David’s brothers; for Issachar, Omri son of Michael.
translation:
  language: tl
  text: Para sa Juda, si Elihu[a], na isa sa mga kapatid ni David; para sa Isacar, si Omri na anak ni Micael.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo: “Elihu.” “Eliab” ang mababasa sa ilang sinaunang salin at ayon sa ilang tagapagpaliwanag, marahil dahil iniangkop ito sa pangalan ng kapatid ni David na binanggit sa ibang bahagi.'
    reason: alternative_reading
lexical_decisions:
- source_word: לִיהוּדָה
  choice: Para sa Juda
  rationale: Ang unlaping לְ ay nagpapakilala sa tribong kinakatawan sa talaan; pinananatili ng “Para sa Juda” ang maikli at administratibong anyo ng Hebreo.
- source_word: אֱלִיהוּ
  choice: Elihu
  rationale: Malinaw na Elihu ang pangalan sa tekstong Masoretiko. Hindi ito pinalitan ng “Eliab,” na mababasa sa ilang sinaunang salin at maaaring bunga ng pag-aangkop sa pangalan ng kilalang kapatid ni David.
- source_word: מֵאֲחֵי דָוִיד
  choice: na isa sa mga kapatid ni David
  rationale: 'Ang מִן kasama ng pangmaramihang parirala ay partitive: si Elihu ay isa mula sa pangkat ng mga kapatid ni David. Likas at malinaw ito sa modernong Tagalog.'
- source_word: לְיִשָׂשכָר
  choice: para sa Isacar
  rationale: Gaya ng sa Juda, ipinakikilala ng לְ ang kinatawan ng tribo sa talaan.
- source_word: עָמְרִי
  choice: Omri
  rationale: Karaniwang transliterasyon sa Filipino ng pangalang Hebreo.
- source_word: בֶּן מִיכָאֵל
  choice: na anak ni Micael
  rationale: Karaniwang patronimikong parirala sa Hebreo; ang “anak ni Micael” ay natural sa Tagalog.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang maigsi at paralel na kayarian ng administratibong talaan. Inilagay ang talababa pagkatapos ng “Elihu,” sapagkat ang alternatibong pagbasa ay tumutukoy sa pangalan, hindi sa “Juda.”
