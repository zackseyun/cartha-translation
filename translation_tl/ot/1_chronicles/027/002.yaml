base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/002.yaml
  text: Over the first division for the first month was Jashobeam son of Zabdiel[a], and in his division were twenty-four thousand.
translation:
  language: tl
  text: Ang namamahala sa unang pangkat para sa unang buwan ay si Yasobeam na anak ni Zabdiel, at ang kanyang pangkat ay may dalawampu't apat na libo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literal: “at sa ibabaw ng kanyang pangkat, dalawampu''t apat na libo.” Eliptiko ang pangungusap sa Hebreo; ipinahihiwatig na ang bilang ay tumutukoy sa laki ng pangkat.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל הַמַּחֲלֹקֶת
  choice: Ang namamahala sa ... pangkat
  rationale: Sa talaang administratibo at militar, ang עַל ay nagpapahiwatig ng pamamahala sa isang yunit; ang pariralang ito ay natural sa modernong Tagalog. Ang מַחֲלֹקֶת ay tumutukoy sa organisadong pangkat na salit-salitang naglilingkod.
- source_word: הָרִאשׁוֹנָה
  choice: unang
  rationale: Ito ang panandang-ayos ng unang pangkat sa buwanang serye.
- source_word: לַחֹדֶשׁ הָרִאשׁוֹן
  choice: para sa unang buwan
  rationale: Ipinahihiwatig ng לְ ang pagkakatalaga ng pangkat sa unang buwan, hindi lamang ang kaugnayan nito sa buwan.
- source_word: יָשָׁבְעָם
  choice: Yasobeam
  rationale: Isinalin sa baybay na angkop sa tunog at ortograpiyang Filipino ang pangalang Hebreo.
- source_word: בֶּן זַבְדִּיאֵל
  choice: anak ni Zabdiel
  rationale: Ang בֶּן sa tuwirang pagkakakilanlang pampamilya ay natural na isinasaling “anak ni.”
- source_word: וְעַל מַחֲלֻקְתּוֹ
  choice: at ang kanyang pangkat ay may
  rationale: Eliptiko ang Hebreo, na literal na “at sa ibabaw ng kanyang pangkat”; ipinahihiwatig ng kasunod na bilang ang laki ng pangkat. Ang “ay may” ay maikli at natural na paglalantad sa ipinahiwatig na diwa.
- source_word: עֶשְׂרִים וְאַרְבָּעָה אָלֶף
  choice: dalawampu't apat na libo
  rationale: Karaniwang anyong pasulat sa marangal ngunit madaling basahing salin ng Kasulatan.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “pangkat” sa halip na teknikal o makalumang “dibisyon,” at “namamahala” upang ihayag ang administratibong diwa ng עַל. Ang panandang [a] ay inilagay pagkatapos ng sugnay na nililinaw nito.
