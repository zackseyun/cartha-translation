  yaml_path: translation/ot/1_chronicles/027/021.yaml
  text: 'for the half-tribe of Manasseh in Gilead: Iddo son of Zechariah[a]; for Benjamin: Jaasiel son of Abner.'
translation:
  language: tl
  text: 'para sa kalahating lipi ng Manases sa Gilead: si Ido na anak ni Zacarias; para sa Benjamin: si Jaasiel[a] na anak ni Abner.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Jashiel.”
    reason: alternatibong baybay ng pangalang Jaasiel
lexical_decisions:
- source_word: לַ/חֲצִי הַֽ/מְנַשֶּׁה
  choice: para sa kalahating lipi ni Manases
  rationale: Sa konteksto ng talaan ng mga pinuno, ang חֲצִי ay tumutukoy sa kalahati ng lipi ni Manases; idinagdag ang “lipi” upang maging malinaw at natural sa Tagalog.
- source_word: גִּלְעָדָ/ה
  choice: na nasa Gilead
  rationale: Bagaman may anyong lokatibo o patungo ang hulapi, sa konteksto ay tinutukoy nito ang kalahating lipi ni Manases na matatagpuan sa rehiyon ng Gilead.
- source_word: יִדּוֹ
  choice: Ido
  rationale: Isinalin sa payak na transliterasyong angkop sa baybay at bigkas ng Tagalog.
- source_word: בֶּן זְכַרְיָהוּ
  choice: anak ni Zacarias
  rationale: Ang בֶּן ay karaniwang pormulang pangangkan na “anak ni”; ginamit ang nakagawiang anyong Tagalog ng pangalang Zacarias.
- source_word: לְ/בִנְיָמִן
  choice: para sa Benjamin
  rationale: Ang pang-ukol na לְ ay nagpapakilala sa liping kinakatawan ng kasunod na pinuno; sapat at natural dito ang “para sa Benjamin” ayon sa inuulit na estruktura ng talaan.
- source_word: יַעֲשִׂיאֵל
  choice: Jaasiel
  rationale: Pinananatili ng “Jaasiel” ang mga patinig ng Masoretikong anyo nang mas malapit kaysa sa alternatibong “Jashiel.”
- source_word: בֶּן אַבְנֵר
  choice: anak ni Abner
  rationale: Likas na salin ng pormulang pangangkan, habang pinananatili ang nakagawiang anyo ng pangalang Abner.
theological_decisions: []
translation_notes:
  register: 'Makabago, malinaw, at marangal na Tagalog. Pinanatili ang maikling estruktura ng administratibong talaan at ang mga pangalang pantangi. Hindi isinama ang ibinigay na talababa sa English POB sapagkat mali ang pagkakalagay at nilalaman nito: ang “Jashiel son of Abner” ay alternatibo para sa ikalawang pangalan, hindi para kay Ido na anak ni Zacarias; hindi rin ito hinihingi ng tekstong WLC.'
