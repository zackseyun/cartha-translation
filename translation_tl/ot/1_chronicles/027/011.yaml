base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/011.yaml
  text: 'The eighth[a], for the eighth month: Sibbecai the Hushathite, of the Zerahites; and over his division were twenty-four thousand.'
translation:
  language: tl
  text: Ang ikawalo, para sa ikawalong buwan, ay si Sibecai na Husatita, ng mga Zerahita[a]; at ang kanyang pangkat ay may dalawampu't apat na libo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O, “para sa Zerahita.” Maaaring unawain nang higit na literal ang Hebreo bilang pang-isahang katawagang pangkat; ngunit sa kontekstong ito, malamang na tumutukoy ito sa kaugnayan sa angkan: “ng mga Zerahita.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשְּׁמִינִי
  choice: Ang ikawalo
  rationale: Pinananatili ang maikling anyong eliptikal ng talaan; mauunawaan sa konteksto na ito ang ikawalong pinuno o pangkat.
- source_word: לַחֹדֶשׁ הַשְּׁמִינִי
  choice: para sa ikawalong buwan
  rationale: Ipinahihiwatig ng ל sa administratibong talaan ang pagkakatalaga sa buwan ng paglilingkod.
- source_word: סִבְּכַי
  choice: Sibecai
  rationale: Malinaw na transliterasyon ng pangalang Hebreo na angkop sa karaniwang baybay sa Filipino.
- source_word: הַחֻשָׁתִי
  choice: na Husatita
  rationale: Isinasalin bilang katawagang tumutukoy sa pinagmulan o kaugnayang pampook/pangkan.
- source_word: לַזַּרְחִי
  choice: mula sa mga Zerahita
  rationale: Sa konteksto, malamang na ipinakikita ng anyo ang kaugnayan ni Sibecai sa angkan ng mga Zerahita.
- source_word: מַחֲלֻקְתּוֹ
  choice: ang kanyang pangkat
  rationale: Ang מַחֲלֻקָה rito ay organisadong yunit militar; natural at madaling maunawaan sa Filipino ang 'pangkat.'
- source_word: עֶשְׂרִים וְאַרְבָּעָה אָלֶף
  choice: dalawampu't apat na libo
  rationale: Tuwirang modernong Filipino para sa bilang na 24,000.
