  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang pahiwatig at kawalan ng tahasang pandiwa sa unang sugnay sa pamamagitan ng talababa; iniwasang gawing tiyak kung anong eksaktong tungkulin ang minana nina Jehoiada at Abiatar.
