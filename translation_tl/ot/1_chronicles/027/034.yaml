base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/034.yaml
  text: After Ahithophel came Jehoiada son of Benaiah and Abiathar[a]; and Joab was commander of the army for the king.
translation:
  language: tl
  text: At pagkatapos ni Ahitofel ay sina Jehoiada na anak ni Benaias at Abiatar[a]; at si Joab ang pinuno ng hukbo para sa hari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O, mas literal: “At pagkatapos ni Ahitofel, sina Jehoiada na anak ni Benaias at Abiatar.” Walang tahasang pandiwa sa Hebreo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַחֲרֵי אֲחִיתֹפֶל
  choice: Pagkatapos ni Ahitofel ay
  rationale: Ang אַחֲרֵי ay nangangahulugang “pagkatapos.” Walang tahasang pandiwa sa Hebreo; ginagamit ang “ay” upang maging natural sa Tagalog nang hindi masyadong tinutukoy ang uri ng paghalili.
- source_word: יְהוֹיָדָע בֶּן בְּנָיָהוּ
  choice: Jehoiada na anak ni Benaias
  rationale: Karaniwang patronimikong Hebreo; ang “na anak ni” ay natural at malinaw sa modernong Tagalog.
- source_word: וְ/אֶבְיָתָר
  choice: at Abiatar
  rationale: Pinananatili ang payak na pang-ugnay at ang pagkakaugnay ni Abiatar kay Jehoiada sa pariralang kasunod ni Ahitofel.
- source_word: וְ/שַׂר צָבָא
  choice: at ... ang pinuno ng hukbo
  rationale: Ang שַׂר צָבָא ay tumutukoy sa pinakamataas na pinunong militar. Ang kopulang “ang” sa sugnay na “si Joab ang...” ay likas sa Tagalog bagaman walang tahasang pandiwa sa Hebreo.
- source_word: לַ/מֶּלֶךְ
  choice: ng hari
  rationale: Ipinahihiwatig ng ל ang kaugnayan o paglilingkod sa hari; sa Tagalog, ang “hukbo ng hari” ay maikli at natural na nagpapahayag ng tungkuling militar sa ilalim ng hari.
- source_word: יוֹאָב
  choice: Joab
  rationale: Pangalan ng tao; isinalin sa nakaugaliang anyong Filipino.
