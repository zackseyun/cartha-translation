  naturalness: May kulang na “ay” sa “Ang lahat ng ito ang mga pinunong...,” kaya hindi ganap na natural at malinaw ang pangungusap sa modernong Filipino. Ang “mga opisyal na namamahala” ay mas tuwiran at mas angkop sa administratibong rehistro kaysa “mga pinunong namamahala.”
