  text: Over the flocks was Jaziz the Hagrite[a]. All these were officers over the property that belonged to King David.
translation:
  language: tl
  text: Ang namamahala sa mga kawan ay si Jaziz na Hagrita[a]. Ang lahat ng ito ay mga opisyal na namamahala sa mga ari-arian ni Haring David.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Hagarita.” Maaaring baybayin sa alinman sa dalawang paraan ang katawagang ito para kay Jaziz.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל הַצֹּאן
  choice: Ang namamahala sa mga kawan
  rationale: Sa talaang administratibo, ang עַל ay nagpapahayag ng pananagutan o pangangasiwa. Ang צֹאן ay maaaring tumukoy sa mga tupa o, nang mas malawak, sa maliliit na alagang hayop; pinananatili ng “mga kawan” ang lawak na ito nang hindi labis na nililimitahan.
- source_word: יָזִיז
  choice: Jaziz
  rationale: Pangalang pantangi na isinalin sa baybay na malapit sa anyong Hebreo at madaling basahin sa Filipino.
- source_word: הַהַגְרִי
  choice: na Hagrita
  rationale: Tawag ito sa pangkat na pinagmulan ni Jaziz. Ang “Hagrita” ay likas na anyong Filipino para sa gentilisyong Hebreo; inilalagay sa talababa ang alternatibong “Hagarita.”
- source_word: כָּל אֵלֶּה
  choice: Ang lahat ng ito
  rationale: Tuwirang panapos na pahayag na sumasaklaw sa lahat ng naunang binanggit sa talaan.
- source_word: שָׂרֵי הָרְכוּשׁ
  choice: mga pinunong namamahala sa mga ari-arian
  rationale: Sa konteksto, ang שָׂרֵי ay mga opisyal na may pananagutan sa mga yaman ng hari, hindi kinakailangang mga prinsipe. Nililinaw ng “namamahala” ang tungkuling administratibo, at ang “mga ari-arian” ay angkop sa רְכוּשׁ bilang kabuuan ng mga pag-aari o yaman.
- source_word: אֲשֶׁר לַמֶּלֶךְ דָּוִיד
  choice: ni Haring David
  rationale: Likas at maikli itong pagpapahayag sa Filipino ng pag-aaring isinasaad ng pariralang Hebreo.
