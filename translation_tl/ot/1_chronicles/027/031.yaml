translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “namamahala” upang gawing natural ang paulit-ulit na pormulang administratibo, at pinanatili ang malawak na kahulugan ng “mga kawan” at “mga ari-arian.”
