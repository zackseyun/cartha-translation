base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/013.yaml
  text: 'The tenth[a], for the tenth month: Mahrai the Netophathite, of the Zerahites; and over his division were twenty-four thousand.'
translation:
  language: tl
  text: Ang ikasampu, para sa ikasampung buwan, ay si Mahrai na taga-Netofa, mula sa angkan ni Zera; at ang pangkat niya ay may dalawampu't apat na libo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָעֲשִׂירִי
  choice: Ang ikasampu
  rationale: Pang-uring pamilang na ginamit bilang pangngalan sa talaan; ipinahihiwatig ng konteksto ang pinuno o pangkat nang hindi ito tahasang idinaragdag.
- source_word: לַחֹדֶשׁ הָעֲשִׂירִי
  choice: para sa ikasampung buwan
  rationale: Ang לְ sa kabanatang ito ay tumutukoy sa buwanang takdang paglilingkod o pag-ikot.
- source_word: מַהְרַי
  choice: Maharai
  rationale: Tuwirang transliterasyon ng pangalang Hebreo sa paraang natural basahin sa Filipino.
- source_word: הַנְּטוֹפָתִי
  choice: taga-Netofa
  rationale: Ang anyong nisbe ay nagpapahiwatig ng pinagmulan o kaugnayan sa Netofa; mas natural sa modernong Filipino ang 'taga-Netofa.'
- source_word: לַזַּרְחִי
  choice: mula sa angkan ni Zera
  rationale: Ipinahahayag ng katawagang gentiliko ang pagkakaugnay sa angkan ni Zera; nililinaw ang kolektibong diwa nang hindi nagdaragdag ng doktrina.
- source_word: וְעַל מַחֲלֻקְתּוֹ
  choice: at ang pangkat niya ay may
  rationale: Ang מַחֲלֻקָה rito ay isang pangkat o dibisyong militar. Ang pagkakabuo ay natural sa Filipino at inihahatid ang bilang ng mga tauhang nasasakupan niya.
- source_word: עֶשְׂרִים וְאַרְבָּעָה אָלֶף
  choice: dalawampu't apat na libo
  rationale: Karaniwang modernong Filipino para sa bilang na 24,000.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang 'pangkat' sa halip na mas teknikal na 'dibisyon,' at pinanatiling ipinahihiwatig lamang ang tungkulin sa 'Ang ikasampu' gaya ng tekstong Hebreo.
