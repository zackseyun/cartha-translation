  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יִּלְכֹּד֩ דָּוִ֨יד מִמֶּ֜/נּוּ אֶ֣לֶף רֶ֗כֶב וְ/שִׁבְעַ֤ת אֲלָפִים֙ פָּֽרָשִׁ֔ים וְ/עֶשְׂרִ֥ים אֶ֖לֶף אִ֣ישׁ רַגְלִ֑י וַ/יְעַקֵּ֤ר דָּוִיד֙ אֶת כָּל הָ/רֶ֔כֶב וַ/יּוֹתֵ֥ר מִמֶּ֖/נּוּ מֵ֥אָה רָֽכֶב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/018/004.yaml
  text: David captured from him 1,000 chariots, 7,000 horsemen, and 20,000 foot soldiers. Then David hamstrung all the chariot horses, but left from them enough for 100 chariots.
translation:
  language: tl
  text: Nabihag ni David mula sa kanya ang 1,000 karwahe, 7,000 mangangabayo[a], at 20,000 kawal na hindi nakasakay. Pagkatapos, pinutol ni David ang mga litid sa hulihang paa ng lahat ng kabayo ng mga karwahe[b], ngunit nagtira siya ng sapat na mga kabayo para sa 100 karwahe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa 2 Samuel 8:4 ay “1,700 mangangabayo” sa halip na “7,000 mangangabayo.” Isa itong pagkakaiba sa bilang sa tradisyon ng teksto ng magkatulad na salaysay.
    reason: textual_variant
  - marker: b
    text: Sa Hebreo, “lahat ng mga karwahe” o “buong puwersa ng mga karwahe.” Dahil ang pandiwa ay nangangahulugang putulin ang litid upang pilayin, metonimikong tumutukoy ang parirala sa mga kabayong ginagamit sa mga karwahe.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלְכֹּד
  choice: Nabihag
  rationale: Karaniwang tumutukoy ang לכד sa pagkuha o pagbihag sa konteksto ng digmaan. Likas at malinaw sa modernong Tagalog ang “nabihag.”
- source_word: מִמֶּנּוּ
  choice: mula sa kanya
  rationale: Isahan ang hulaping Hebreo at tumutukoy kay Hadadezer sa naunang konteksto; pinananatili ng salin ang isahang reperente.
- source_word: אֶלֶף רֶכֶב
  choice: 1,000 karwahe
  rationale: Maaaring kolektibong tumukoy ang רכב sa hukbo ng mga karwahe, ngunit kapag may bilang, natural itong unawain bilang mabibilang na mga karwahe.
- source_word: פָּרָשִׁים
  choice: mangangabayo
  rationale: Tumutukoy ito sa mga mandirigmang nakasakay sa kabayo. Ang “mangangabayo” ay tuwiran, natural, at hindi kasing teknikal ng “kabalyerya.”
- source_word: אִישׁ רַגְלִי
  choice: kawal na naglalakad
  rationale: Literal itong “lalaking naglalakad” o kawal na lumalaban nang hindi nakasakay. Malinaw sa karaniwang mambabasa ang “kawal na naglalakad.”
- source_word: וַיְעַקֵּר
  choice: pinutol ang mga litid sa paa
  rationale: Sa kontekstong militar, ang עקר ay tumutukoy sa pagpinsala sa mga kabayo sa pamamagitan ng pagputol sa litid ng mga paa. Mas tiyak ito kaysa sa pangkalahatang “pinilayan.”
- source_word: אֶת כָּל הָרֶכֶב
  choice: lahat ng kabayo ng mga karwahe
  rationale: Literal na “lahat ng mga karwahe/hukbo ng karwahe,” ngunit ang kilos na pagputol sa litid ay mailalapat sa mga kabayo, hindi sa sasakyan. Isinasalin dito ang metonimikong tinutukoy habang itinatala sa talababa ang literal na anyo.
- source_word: וַיּוֹתֵר מִמֶּנּוּ מֵאָה רָכֶב
  choice: ngunit nagtira siya ng sapat na mga kabayo para sa 100 karwahe
  rationale: Ipinahihiwatig ng sugnay na may itinira si David mula sa nabihag na puwersa, sapat upang magamit ang 100 karwahe. Nililinaw ng “mga kabayo” ang ipinahiwatig na tinutukoy pagkatapos ng metonimikong paggamit ng רכב.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang karaniwang bokabularyong militar at iniwasan ang arkaiko o labis na teknikal na pananalita. Pinanatili ang isahang “kanya” at hayagang minarkahan ang pagkakaiba ng bilang sa kaagapay na salaysay.
