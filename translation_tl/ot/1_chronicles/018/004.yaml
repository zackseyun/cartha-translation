revisions:
- from: Nabihag ni David mula sa kanya ang 1,000 karwahe, 7,000 mangangabayo[a], at 20,000 kawal na naglalakad. Pagkatapos, pinutol ni David ang mga litid sa paa ng lahat ng kabayo ng mga karwahe[b], ngunit nagtira siya ng sapat na mga kabayo para sa 100 karwahe.
  to: Nabihag ni David mula sa kanya ang 1,000 karwahe, 7,000 mangangabayo[a], at 20,000 kawal na hindi nakasakay. Pagkatapos, pinutol ni David ang mga litid sa hulihang paa ng lahat ng kabayo ng mga karwahe[b], ngunit nagtira siya ng sapat na mga kabayo para sa 100 karwahe.
  rationale: Pinalitan ang hindi likas na “kawal na naglalakad” ng “kawal na hindi nakasakay” upang maipahayag ang kahulugang mga kawal na paa. Ginawang mas tiyak ang paglalarawan ng paghamstring bilang pagputol sa mga litid sa hulihang paa. Hindi binago ang mga bilang, ang isahang reperente, o ang maingat na metonimikong pagpapaliwanag sa talababa.
