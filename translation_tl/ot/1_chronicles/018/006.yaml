  text: וַ/יָּ֤שֶׂם דָּוִיד֙ בַּ/אֲרַ֣ם דַּרְמֶ֔שֶׂק וַ/יְהִ֤י אֲרָם֙ לְ/דָוִ֔יד עֲבָדִ֖ים נֹשְׂאֵ֣י מִנְחָ֑ה וַ/יּ֤וֹשַׁע יְהוָה֙ לְ/דָוִ֔יד בְּ/כֹ֖ל אֲשֶׁ֥ר הָלָֽךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/018/006.yaml
  text: And David placed garrisons in Aram of Damascus[a], and the Arameans became David’s servants, bringing tribute[c][b]. And Yahweh gave victory to David wherever he went.
translation:
  language: tl
  text: Naglagay si David ng mga himpilan ng hukbo sa Aram ng Damasco[a], at ang mga Arameo[b] ay naging mga lingkod ni David na nagdadala ng tributo. Binigyan ni Yahweh ng tagumpay si David saanman siya pumunta.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “naglagay ng mga puwersa”; literal na “naglagay.” Hindi tahasang binabanggit sa Hebreo ang “mga himpilan ng hukbo,” ngunit nauunawaan ito mula sa kontekstong militar.
    reason: lexical_alternative
  - marker: b
    text: Hebreo, “Aram”; tradisyonal na “Siria” o “mga Siriano.”
    reason: alternative_reading
  - marker: c
    text: O “iniligtas si David” o “hinango si David sa panganib”; sa konteksto ng digmaan, ang “binigyan ng tagumpay” ay nagpapahayag ng diwa nito.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: naglagay ... ng mga himpilan ng hukbo
  rationale: Literal na ‘naglagay’ ang pandiwa; ipinahihiwatig ng kontekstong militar ang mga garison o himpilan ng hukbo, kaya ginawang tahasan ang nauunawaang layon.
- source_word: בַּאֲרָם דַּרְמֶשֶׂק
  choice: sa Aram ng Damasco
  rationale: Pinananatili nito ang katawagang Hebreo sa rehiyon o bayang Aram na kaugnay ng Damasco, sa halip na paikliin lamang bilang ‘Damasco.’
- source_word: אֲרָם
  choice: mga Arameo
  rationale: Sa ikalawang sugnay, tumutukoy ang pangalan sa mga taong napasailalim kay David; mas tuwirang kumakatawan ang ‘mga Arameo’ sa etnonimong Hebreo kaysa ‘mga Siriano.’
- source_word: עֲבָדִים
  choice: mga lingkod
  rationale: Malapit ito sa karaniwang saklaw ng עֶבֶד at hindi labis na nagpapasiya kung sila ay mga alipin o mga bayang nasasakupan; ipinakikita ng pagdadala ng tributo ang pampolitikang pagpapasakop.
- source_word: נֹשְׂאֵי מִנְחָה
  choice: na nagdadala ng tributo
  rationale: Ipinahahayag ng pariralang participyal ang patuloy na paghaharap ng tributo sa nakatataas na hari; ang ‘tributo’ ang angkop na diwa ng מִנְחָה sa kontekstong ito.
- source_word: וַיּוֹשַׁע
  choice: pinagtagumpay
  rationale: Ang hiphil ng יָשַׁע ay ‘nagligtas/naghatid,’ ngunit sa salaysay ng digmaan ay likas itong tumutukoy sa pagbibigay ng tagumpay.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasatitik ang personal na pangalang Hebreo sa halip na palitan ito ng isang titulo.
- source_word: בְּכֹל אֲשֶׁר הָלָךְ
  choice: saanman siya pumunta
  rationale: Natural na Filipino ito para sa idyomang nagsasaad ng kabuuang saklaw ng mga pinuntahan o kampanya ni David nang hindi nililimitahan sa pagmamartsa lamang.
theological_decisions:
- issue: Pagpapakahulugan sa וַיּוֹשַׁע sa salaysay ng digmaan
  choice: pinagtagumpay ni Yahweh si David
  alternative: iniligtas ni Yahweh si David
  rationale: Pinananatili ng ‘pinagtagumpay’ ang sanhi—si Yahweh ang nagbibigay ng tagumpay—habang ang talababa ay nag-iingat sa mas malawak at literal na diwang ‘iniligtas’ o ‘hinango sa panganib.’
- issue: Paglalahad sa pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Pangalang pantangi ang nasa tekstong Hebreo; ang ‘Yahweh’ ay tuwirang transliterasyon at hindi pagpapalit ng titulo.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang ‘himpilan ng hukbo’ bilang mas madaling maunawaang katumbas ng garison, ‘tributo’ para sa pampolitikang handog ng nasasakupan, at ‘mga lingkod’ upang mapanatili ang leksikal at pampolitikang tensiyon nang hindi awtomatikong tukuyin silang mga aliping ari-arian.
