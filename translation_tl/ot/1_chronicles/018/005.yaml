  source_fidelity: 'Tapat ang salin sa Hebreo: ang Aram ng Damasco ay dumating upang tumulong kay Hadadezer, hari ng Zoba, at si David ay nagpabagsak ng dalawampu''t dalawang libong lalaki ng Aram. Hindi nito dinaragdagan ang “mga kawal” o tahasang “pinatay,” na hindi kinakailangang ipinapahiwatig ng pandiwang Hebreo.'
