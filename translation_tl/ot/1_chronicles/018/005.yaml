  text: וַ/יָּבֹא֙ אֲרַ֣ם דַּרְמֶ֔שֶׂק לַ/עְז֕וֹר לַ/הֲדַדְעֶ֖זֶר מֶ֣לֶךְ צוֹבָ֑ה וַ/יַּ֤ךְ דָּוִיד֙ בַּ/אֲרָ֔ם עֶשְׂרִֽים וּ/שְׁנַ֥יִם אֶ֖לֶף אִֽישׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/018/005.yaml
  text: And Aram of Damascus came to help Hadadezer king of Zobah[b][a], and David struck down twenty-two thousand men of Aram.
translation:
  language: tl
  text: Dumating ang Aram ng Damasco[a] upang tulungan si Hadadezer[b], na hari ng Zoba, at pinabagsak ni David ang dalawampu't dalawang libong lalaki ng Aram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “ang mga Arameo ng Damasco”; ayon sa tradisyon, “ang mga Siriano ng Damasco.”
    reason: lexical_alternative
  - marker: b
    text: “Hadadezer” ang baybay ng pangalan dito; “Hadarezer” naman ang baryanteng makikita sa ilang kahilerang talata.
    reason: alternative_reading
lexical_decisions:
- source_word: אֲרַם דַּרְמֶשֶׂק
  choice: ang Aram ng Damasco
  rationale: Pinananatili ang Aram bilang sinaunang pangalang etnograpiko at heograpiko sa halip na gamitin ang mas huling katawagang Siria; likas sa Tagalog ang ugnayang ipinapahayag ng “ng Damasco.”
- source_word: לַעְזוֹר
  choice: upang tulungan
  rationale: Tuwirang ipinapahayag ang layunin ng pagdating at natural sa makabagong Tagalog.
- source_word: הֲדַדְעֶזֶר
  choice: Hadadezer
  rationale: Sinusunod ang anyo ng pangalan sa tekstong Hebreo ng talatang ito; binabanggit sa talababa ang baryanteng nasa ilang kahilerang talata.
- source_word: מֶלֶךְ צוֹבָה
  choice: na hari ng Zoba
  rationale: Pinananatili ang titulo at pangalan ng lugar habang ginagawang malinaw at natural ang apposition sa Tagalog.
- source_word: וַיַּךְ
  choice: pinabagsak
  rationale: Sa konteksto ng labanan at bilang ng mga nasawi, ipinahihiwatig nito ang marahas na paggapi nang hindi tahasang nililimitahan ang pandiwa sa “pinatay” lamang.
- source_word: בַּאֲרָם
  choice: ng Aram
  rationale: Pinananatili ang etnograpiko-heograpikong pagtukoy ng Hebreo at iniuugnay ito nang natural sa bilang ng mga lalaki.
- source_word: עֶשְׂרִים וּשְׁנַיִם אֶלֶף אִישׁ
  choice: dalawampu't dalawang libong lalaki
  rationale: Tumpak na inililipat ang bilang at ang pangkalahatang salitang אִישׁ nang hindi idinaragdag ang “kawal” o “mandirigma,” na hindi tahasang nasa teksto.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang mga sinaunang pangalang Aram, Damasco, at Zoba, at iniwasang magdagdag ng detalyeng hindi tahasang nasa Hebreo.
