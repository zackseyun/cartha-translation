base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/018/016.yaml
  text: Zadok son of Ahitub and Abimelech son of Abiathar were priests[a], and Shavsha was secretary.
translation:
  language: tl
  text: Si Zadok na anak ni Ahitub at si Abimelec na anak ni Abiatar ay mga pari[a], at si Savsa ang kalihim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa kaparehong tala sa 2 Samuel 8:17, “Ahimelec na anak ni Abiatar” ang mababasa sa halip na “Abimelec na anak ni Abiatar.” Sinusunod dito ng salin ang tekstong Hebreo ng Mga Cronica.
    reason: textual_variant
lexical_decisions:
- source_word: צָדוֹק
  choice: Zadok
  rationale: Isinatinig ang personal na pangalan sa anyong malinaw at nakasanayan sa Filipino.
- source_word: בֶּן
  choice: anak ni
  rationale: Sa talaang ito ng mga opisyal, ang salita ay likas na tumutukoy sa tuwirang kaugnayan ng ama at anak, hindi lamang sa isang inapo.
- source_word: אֲחִיטוּב
  choice: Ahitub
  rationale: Isinatinig ang personal na pangalan.
- source_word: אֲבִימֶלֶךְ
  choice: Abimelec
  rationale: Sinusunod ang pagbasa ng tekstong Hebreo ng Mga Cronica. Iningatan sa talababa ang pagkakaiba nito sa kaparehong tala sa 2 Samuel 8:17.
- source_word: אֶבְיָתָר
  choice: Abiatar
  rationale: Isinatinig ang personal na pangalan sa paraang natural sa Filipino.
- source_word: כֹּהֲנִים
  choice: mga pari
  rationale: Ito ang karaniwan at pangunahing kahulugan ng salita; pinagtitibay rin ng konteksto ng mga angkan nina Zadok at Abiatar ang tungkuling panrelihiyon.
- source_word: שַׁוְשָׁא
  choice: Savsa
  rationale: Isinatinig mula sa anyong Hebreo sa Mga Cronica gamit ang natural na baybay sa Filipino.
- source_word: סוֹפֵר
  choice: kalihim
  rationale: Sa pangasiwaan ng hari, tumutukoy ito sa opisyal na tagapagsulat o kalihim; malinaw na naipahahayag ng “kalihim” ang tungkuling pampamahalaan.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “anak ni” at “mga pari” bilang natural na pananalita, habang ang “kalihim” ay naghahatid ng diwa ng isang opisyal sa pangasiwaan ng hari.
