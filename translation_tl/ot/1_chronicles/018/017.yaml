  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang mga pangalan ng pangkat bilang transliterasyon at inilagay sa talababa ang mga literal na kahulugang maaaring magpahiwatig ng higit sa isang pagbasa.
