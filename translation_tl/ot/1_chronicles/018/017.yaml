base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/018/017.yaml
  text: And Benaiah son of Jehoiada was over the Kerethites and the Pelethites[c][b][a], and David’s sons were the chief officials at the king’s side.
translation:
  language: tl
  text: At si Benaias na anak ni Joiada ang namamahala sa mga Kereteo at mga Peleteo, at ang mga anak ni David ang mga pangunahing opisyal[a] sa tabi ng hari.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal na “mga una” o “mga nangunguna”; malamang na isang katawagan para sa matataas na opisyal sa korte.
    reason: lexical_alternative
  - marker: b
    text: Literal na “sa kamay ng hari,” isang idyoma para sa malapit na pagdalo o paglilingkod sa hari.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל
  choice: ang namamahala sa
  rationale: Sa kontekstong administratibo o militar, ipinahihiwatig ng עַל ang pamumuno o pangangasiwa. Likas sa modernong Tagalog ang “namamahala sa” at hindi nito dinaragdagan ang teksto ng tiyak na ranggong militar.
- source_word: הַכְּרֵתִי וְהַפְּלֵתִי
  choice: mga Kereteo at mga Peleteo
  rationale: Mga pangalan ito ng mga pangkat, kaya tinumbasan sa pamamagitan ng transliterasyong angkop sa baybay at bigkas ng Tagalog sa halip na bigyan ng mapagpalagay na kahulugan.
- source_word: הָרִאשֹׁנִים
  choice: mga pangunahing opisyal
  rationale: Literal itong “mga una” o “mga nangunguna.” Sa konteksto ng korte ng hari, malamang na tumutukoy ito sa mga taong may pangunahing katungkulan; nililinaw ng talababa ang tunay na saklaw ng Hebreo.
- source_word: לְיַד הַמֶּלֶךְ
  choice: sa tabi ng hari
  rationale: Pinananatili nito ang larawan ng Hebreong idyoma na literal na “sa kamay ng hari,” habang natural na ipinahihiwatig ang malapit na paglilingkod o pagdalo sa hari.
- source_word: וּבְנֵי דָוִיד
  choice: ang mga anak ni David
  rationale: Tuwirang salin ng pariralang konstrukto at natural sa modernong Tagalog.
- source_word: בְּנָיָהוּ בֶּן יְהוֹיָדָע
  choice: Benaias na anak ni Joiada
  rationale: Ginamit ang mga anyong pangalan na natural at pamilyar sa tradisyong Tagalog, kasama ang malinaw na ugnayang pampamilya.
theological_decisions: []
