base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/018/013.yaml
  text: He placed garrisons in Edom, and all Edom became servants to David. And the LORD gave David victory wherever he went.
translation:
  language: tl
  text: Naglagay siya ng mga himpilan ng hukbo sa Edom, at ang buong Edom ay naging mga lingkod ni David. Binigyan ni Yahweh ng tagumpay si David saanman siya pumunta.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נְצִיבִים
  choice: mga himpilan ng hukbo
  rationale: Sa konteksto ng pagsakop sa Edom, tumutukoy ito sa mga nakatalagang puwersa o garison; ang salin ay natural sa Filipino at malinaw ang tungkuling militar.
- source_word: עֲבָדִים
  choice: mga lingkod
  rationale: Maaaring mangahulugang mga alipin, lingkod, o mga bayang sakop. Dito ay inilalarawan ang pagpapasakop ng Edom kay David; pinananatili ng “mga lingkod” ang lawak ng salitang Hebreo nang hindi labis na tinutukoy ang uri ng pagkaalipin.
- source_word: וַיּוֹשַׁע
  choice: pinagtagumpay
  rationale: Ang pandiwa ay literal na kaugnay ng pagliligtas, ngunit sa salaysay ng mga digmaan ay ipinahihiwatig na binigyan ni Yahweh si David ng tagumpay.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin ang personal na pangalan ng Diyos bilang Yahweh upang maipakita ang pagkakaiba nito sa karaniwang titulong “Panginoon.”
- source_word: בְּכֹל אֲשֶׁר הָלָךְ
  choice: saanman siya pumunta
  rationale: Natural at tumpak na pagpapahayag ng saklaw ng tagumpay sa bawat pinuntahan ni David.
theological_decisions:
- issue: Ang Diyos bilang pinagmulan ng tagumpay ni David
  choice: Pinagtagumpay ni Yahweh si David
  alternative: Iniligtas ni Yahweh si David
  rationale: Pinananatili ang Diyos bilang tahasang kumikilos, habang ang kontekstong militar ang gumagabay sa kahulugang “pinagtagumpay.”
- issue: Kalagayan ng Edom sa ilalim ni David
  choice: naging mga lingkod ni David
  alternative: naging mga alipin ni David
  rationale: Hindi nilulutas nang labis ang saklaw ng עֲבָדִים; maaaring tumukoy ito sa sapilitang pagpapasakop o pagiging nasasakupang bayan, hindi lamang sa indibidwal na pagkaalipin.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Ginamit ang “himpilan ng hukbo” sa halip na hiram na “garison,” at pinanatili ang personal na pangalang Yahweh.
