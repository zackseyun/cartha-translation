  source_fidelity: 'Tumpak na naipapahayag ng salin ang panimulang temporal na sugnay, ang pagkakakilanlan kay Tou bilang hari ng Hamat, at ang nilalaman ng balita: nilupig ni David ang buong hukbo ni Hadadezer, hari ng Zoba. Ang "nilupig" ay isang angkop na pangmilitar na katumbas ng Hebreong pandiwa sa kontekstong ito at hindi nagpapasok ng di-tiyak na detalye tungkol sa mga napatay.'
  naturalness: Likas at marangal ang modernong Tagalog. Ang "Nang mabalitaan" ay angkop dahil ang Hebreong talata ay panimulang sugnay na itinutuloy ng kasunod na talata. Katanggap-tanggap ang pangwakas na kuwit sapagkat hindi pa tapos ang pangungusap sa saklaw ng talata.
  terminology: 'Wasto at pare-pareho ang mga pangalang Tou, Hamat, Hadadezer, at Zoba. Ang "hari," "hukbo," at "nilupig" ay angkop sa register at kontekstong pangkasaysayan. Wasto rin ang talababa: malinaw nitong itinatala ang anyong "Toi" sa paralelong ulat nang hindi binabago ang pangunahing tekstong Hebreo.'
