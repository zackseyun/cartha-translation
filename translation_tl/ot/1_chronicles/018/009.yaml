base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/018/009.yaml
  text: When Tou king of Hamath heard that David had struck down all the army of Hadadezer king of Zobah,[a]
translation:
  language: tl
  text: Nang mabalitaan ni Tou, na hari ng Hamat, na nilupig ni David ang buong hukbo ni Hadadezer, na hari ng Zoba,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Tou” ang nasa Hebreo; “Toi” naman ang nasa kahalintulad na ulat sa 2 Samuel 8:9.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: Nang mabalitaan
  rationale: Ipinahahayag ng waw-consecutive ang pagsulong ng salaysay, habang ang pandiwang שמע ay tumutukoy sa pagkarinig o pagkabalita. Likas sa Tagalog ang temporal na ‘Nang mabalitaan’ bilang panimulang sugnay para sa kasunod na kilos sa talata 10.
- source_word: תֹּעוּ
  choice: Tou
  rationale: Pangalang pantangi ito at isinalin sa pamamagitan ng transliterasyon ayon sa anyong Masoretiko sa 1 Cronica; ang ‘Toi’ ay nasa kahalintulad na ulat sa 2 Samuel 8:9.
- source_word: מֶלֶךְ חֲמָת
  choice: hari ng Hamat
  rationale: Tuwirang ipinapahayag ng construct chain ang katungkulan ni Tou at ang kahariang pinamumunuan niya.
- source_word: כִּי
  choice: na
  rationale: Ipinapakilala rito ng כִּי ang nilalaman ng nabalitaan ni Tou, kaya natural ang ‘na’ sa Tagalog.
- source_word: הִכָּה
  choice: nilupig
  rationale: Sa kontekstong militar, ang Hiphil ng נכה ay nagsasaad ng pananakit o paggapi. Malinaw at natural na ipinahahayag ng ‘nilupig’ ang pagkatalo ng hukbo nang hindi tiyakang dinaragdagan ang teksto na pinatay ang bawat kawal.
- source_word: כָּל
  choice: buong
  rationale: Pinananatili ang tahasang kabuuang saklaw ng Hebreong panukat.
- source_word: חֵיל
  choice: hukbo
  rationale: Sa kontekstong militar, tumutukoy ang חֵיל sa sandatahang puwersa; ang ‘hukbo’ ay dignidad at karaniwang salitang Tagalog.
- source_word: הֲדַדְעֶזֶר
  choice: Hadadezer
  rationale: Transliterasyon ito ng pangalang pantangi ayon sa anyo ng WLC sa talatang ito.
- source_word: מֶלֶךְ צוֹבָה
  choice: hari ng Zoba
  rationale: Tuwirang katumbas ng titulong maharlika at pangalan ng lugar, na iniangkop sa karaniwang baybay sa Tagalog.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na natural at marangal. Ginamit ang ‘Nang mabalitaan’ upang ipakitang ang talata ay panimulang sugnay na nagpapatuloy sa talata 10. Pinanatili ang mga pangalang Hebreo sa anyong malapit sa WLC at iniangkop lamang ang mga pangalan ng lugar sa baybay na madaling basahin sa Tagalog.
