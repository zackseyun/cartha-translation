  text: וַ/יַּ֖ךְ אֶת מוֹאָ֑ב וַ/יִּהְי֤וּ מוֹאָב֙ עֲבָדִ֣ים לְ/דָוִ֔יד נֹשְׂאֵ֖י מִנְחָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/018/002.yaml
  text: And he struck Moab[a], and the Moabites became servants to David, bringing tribute.
translation:
  language: tl
  text: At sinalakay niya ang Moab, at ang mga Moabita ay naging mga alipin ni David na nagdadala ng tributo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “mga lingkod ni David na nagdadala ng mga handog.” Sa konteksto ng pananakop, ang mga salitang Hebreo ay nagpapahiwatig ng pagpapasakop at ng tributong inihahatid ng isang bayang nasasakupan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּךְ
  choice: nilupig
  rationale: Ang נכה ay literal na ‘humampas’ o ‘sumalakay,’ ngunit kapag bansa ang layon sa salaysay ng digmaan, natural na ipinahahayag sa Tagalog bilang ‘nilupig.’ Inililinaw nito ang kinalabasan nang hindi dinaragdagan ang detalye.
- source_word: מוֹאָב
  choice: ang Moab / ang mga Moabita
  rationale: Sa unang banggit, tumutukoy ito sa bansang Moab bilang layon ng pananalakay; sa ikalawa, tumutukoy ito sa mga mamamayan kaya ‘ang mga Moabita’ ang likas na Tagalog.
- source_word: וַיִּהְיוּ
  choice: ay naging
  rationale: Ang היה na may panaguri sa ganitong salaysay ay nagpapahiwatig ng pagpasok sa isang bagong kalagayan matapos ang pananakop.
- source_word: עֲבָדִים
  choice: mga alipin
  rationale: Maaaring mangahulugang mga lingkod o mga alipin ang עֲבָדִים. Sa konteksto ng sapilitang pagpapasakop matapos ang digmaan, pinananatili ng ‘mga alipin’ ang matinding diwa ng katawagan, habang kinikilala sa talababa ang mas pangkalahatang salin.
- source_word: לְדָוִיד
  choice: ni David
  rationale: Sa pariralang ‘mga alipin ni David,’ likas na ipinapahayag ng ‘ni’ ang kaugnayan at pagpapasakop na tinutukoy ng לְ.
- source_word: נֹשְׂאֵי
  choice: naghahatid
  rationale: Ang participle ay literal na ‘nagdadala.’ Ang ‘naghahatid’ ay natural sa Tagalog para sa regular na pagdadala ng buwis sa isang nakatataas na hari.
- source_word: מִנְחָה
  choice: buwis
  rationale: Bagaman maaari itong mangahulugang handog o regalo, sa kontekstong pampolitika pagkatapos ng pananakop ay tumutukoy ito sa tributo. Ang ‘buwis’ ay malinaw at karaniwang salitang Filipino para sa bayad ng isang bayang nasasakop.
theological_decisions:
- issue: Tindi ng עֲבָדִים sa konteksto ng pananakop
  choice: mga alipin
  alternative: mga lingkod / mga sakop
  rationale: Hindi pinapalambot ang wikang nagsasaad ng sapilitang pagpapasakop, ngunit hindi rin ipinapalagay ang lahat ng detalye ng isang tiyak na sistemang pang-aalipin.
translation_notes:
  register: Makabago at marangal na Filipino. Ginamit ang ‘nilupig’ bilang natural na salaysay-militar, ‘mga alipin’ upang mapanatili ang tindi ng עֲבָדִים, at ‘buwis’ bilang madaling maunawaang katumbas ng tributong pampolitika.
