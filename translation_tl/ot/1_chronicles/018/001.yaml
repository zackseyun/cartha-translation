base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/018/001.yaml
  text: After this[a], David struck the Philistines and subdued them, and he took Gath and its surrounding towns from the hand of the Philistines.
translation:
  language: tl
  text: Pagkatapos nito, nilusob ni David ang mga Filisteo at pinasuko sila. Sinakop niya ang Gat at ang mga bayang sakop nito[a] mula sa mga Filisteo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal na “mga anak na babae nito,” isang idyoma para sa maliliit na bayan o pamayanang nasasakupan ng Gat.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי כֵן
  choice: Pagkatapos nito
  rationale: Likas na salaysay na panandang-panahon sa modernong Tagalog; pinananatili ang pagkakasunod-sunod nang hindi literal na inuulit ang Hebreong pormulang “at nangyari.”
- source_word: וַיַּךְ
  choice: nilupig
  rationale: Sa kontekstong militar, ipinahihiwatig ng נכה ang pananakit o paggapi. Ang “nilupig” ay marangal at malinaw, at hindi inuulit nang eksakto ang kasunod na ideya ng pagpapasuko.
- source_word: פְּלִשְׁתִּים
  choice: mga Filisteo
  rationale: Karaniwang salin sa Tagalog para sa pangkat ng mga tao sa sinaunang Filistia.
- source_word: וַיַּכְנִיעֵם
  choice: pinasuko sila
  rationale: Ang Hiphil ng כנע ay nagsasaad ng pagpapailalim o pagpapasakop. Malinaw na naihahayag ng “pinasuko” ang resultang militar at pampolitika.
- source_word: וַיִּקַּח
  choice: Sinakop niya
  rationale: Bagaman literal na “kinuha,” tumutukoy rito ang לקח sa pagkuha ng kontrol sa isang lungsod at mga nasasakupan nito; “sinakop” ang likas at tiyak na katumbas sa konteksto.
- source_word: גַּת
  choice: Gat
  rationale: Karaniwang anyong Tagalog ng pangalan ng lungsod na Gath.
- source_word: וּבְנֹתֶיהָ
  choice: ang mga bayang sakop nito
  rationale: Literal na “mga anak na babae nito,” ngunit isang idyoma ito para sa maliliit na pamayanang umaasa o nasasakupan ng pangunahing lungsod. Inihahayag ng salin ang ugnayang pampolitika, hindi lamang ang lapit sa lugar.
- source_word: מִיַּד פְּלִשְׁתִּים
  choice: mula sa mga Filisteo
  rationale: Ang literal na “mula sa kamay ng mga Filisteo” ay idyoma para sa pag-aalis mula sa kanilang pag-aari o kapangyarihan. Ang payak na “mula sa” ay natural sa Tagalog, habang malinaw na ang konteksto ng pagkakasakop.
