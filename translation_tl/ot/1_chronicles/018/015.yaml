base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/018/015.yaml
  text: And Joab son of Zeruiah was over the army[a], and Jehoshaphat son of Ahilud was recorder.
translation:
  language: tl
  text: At si Joab na anak ni Zeruya ang namamahala sa hukbo, at si Jehoshafat na anak ni Ahilud ang tagapagtala.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sekretaryo” o “tagapag-ingat ng mga tala.” Ang salitang Hebreo ay tumutukoy sa isang opisyal ng hari na may pananagutan sa pag-iingat ng mga tala at pag-uulat ng mga usapin sa hari.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/יוֹאָב
  choice: At si Joab
  rationale: Pinananatili ng “At” ang payak na pang-ugnay at ang anyong talaan ng mga opisyal; isinasatitik sa Filipino ang pangalang יוֹאָב bilang “Joab.”
- source_word: בֶּן צְרוּיָה
  choice: na anak ni Zeruya
  rationale: Likas na pagpapahayag sa modernong Filipino ng ugnayang pampamilya; ang צְרוּיָה ay isinasatitik bilang “Zeruya.”
- source_word: עַל הַצָּבָא
  choice: ang namamahala sa hukbo
  rationale: Ipinahahayag nito ang awtoridad ni Joab sa hukbo nang hindi higit na tinutukoy ang kaniyang opisyal na titulo kaysa sa Hebreo.
- source_word: וִ/יהוֹשָׁפָט
  choice: at si Jehoshafat
  rationale: Ipinagpapatuloy ng “at” ang talaan ng mga opisyal; ang יְהוֹשָׁפָט ay isinasatitik sa anyong madaling basahin sa Filipino.
- source_word: בֶּן אֲחִילוּד
  choice: na anak ni Ahilud
  rationale: Tuwirang salin ng pagkakakilanlang pampamilya sa likas na ayos ng Filipino.
- source_word: מַזְכִּיר
  choice: tagapagtala
  rationale: Sa kontekstong maharlikang administratibo, tumutukoy ito sa opisyal na nag-iingat ng mga tala at naghaharap o nagpapaalaala ng mga usapin; hindi nito labis na ipinapasok ang makabagong kahulugan ng “sekretaryo.”
