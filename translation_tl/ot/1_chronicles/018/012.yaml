id: 1CH.18.12
reference: 1 Chronicles 18:12
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/אַבְשַׁ֣י בֶּן צְרוּיָ֗ה הִכָּ֤ה אֶת אֱדוֹם֙ בְּ/גֵ֣יא הַמֶּ֔לַח שְׁמוֹנָ֥ה עָשָׂ֖ר אָֽלֶף־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/018/012.yaml
  text: And Abishai son of Zeruiah struck down eighteen thousand Edomites in the Valley of Salt[a].
translation:
  language: tl
  text: At pinabagsak ni Abisai na anak ni Zeruias ang labingwalong libong Edomita sa Libis ng Asin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “Edom”; nilinaw sa salin na ang tinutukoy rito ay ang mga Edomita sa konteksto ng labanan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַבְשַׁי
  choice: At ... ni Abisai
  rationale: Isinasalin ang ו bilang “At” upang mapanatili ang pagkakaugnay sa naunang salaysay; ang pangalang אַבְשַׁי ay tinumbasan bilang “Abisai,” ayon sa karaniwang anyong Filipino.
- source_word: בֶּן צְרוּיָה
  choice: na anak ni Zeruias
  rationale: Tuwirang pinananatili ang pagkakakilanlan kay Abisai sa pamamagitan ng pangalan ng kanyang magulang, sa natural na ayos ng Filipino.
- source_word: הִכָּה
  choice: pinabagsak
  rationale: Sa konteksto ng labanan at kasunod na bilang, ipinahihiwatig ng causative form ng נכה ang pagpatay o pagpabagsak sa mga kalaban. Ang “pinabagsak” ay nagpapanatili sa puwersang militar ng pandiwa nang hindi ipinapalagay na personal na pinatay ni Abisai ang bawat isa.
- source_word: אֶת אֱדוֹם
  choice: ang ... Edomita
  rationale: Literal na “Edom” ang Hebreo, ngunit ipinakikita ng pandiwang pandigma at ng bilang na ang tinutukoy ay ang mga taong mula sa Edom, hindi ang lupain mismo.
- source_word: בְּ/גֵיא הַמֶּלַח
  choice: sa Libis ng Asin
  rationale: Tuwirang isinasalin ang pariralang konstruktong גֵיא הַמֶּלַח bilang pangalan ng lugar na “Libis ng Asin.”
- source_word: שְׁמוֹנָה עָשָׂר אָלֶף
  choice: labingwalong libo
  rationale: Isinasalin sa salita ang eksaktong bilang, alinsunod sa marangal at panitikang estilo ng salin sa Bibliya.
theological_decisions:
- issue: Kung ang “Edom” ay tumutukoy sa bayan o sa mga tao nito
  choice: mga taong Edomita
  alternative: lupain o bayan ng Edom
  rationale: Ang pandiwang pandigma na may kasamang bilang na labingwalong libo ay pinakamalinaw na tumutukoy sa mga tao. Paglilinaw itong leksikal at kontekstuwal, hindi isang pagpapasyang doktrinal.
translation_notes:
  register: Modernong Filipino na natural ngunit marangal. Ginamit ang “pinabagsak” upang ihatid ang matinding diwa ng pandiwang pandigma nang hindi labis na tinutukoy ang personal na paraan ng pagkamatay ng bawat isa. Inilagay ang panandang talababa [a] pagkatapos ng buong pangungusap.
