base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/018/008.yaml
  text: And from Tibhath and from Cun, cities of Hadadezer, David took a very great amount of bronze; with it Solomon made the bronze sea, the pillars, and the bronze articles.
translation:
  language: tl
  text: Mula sa Tibhat at Cun, mga lungsod ni Hadadezer, kumuha si David ng napakaraming tanso. Gamit iyon, ginawa ni Solomon ang Dagat na Tanso, ang mga haligi, at ang mga kagamitang tanso.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נְחֹשֶׁת
  choice: tanso
  rationale: Karaniwang makabagong salin para sa bronze/copper alloy sa kontekstong ito; natural at malinaw sa Filipino.
- source_word: יָם הַנְּחֹשֶׁת
  choice: Dagat na Tanso
  rationale: Pinananatili ang teknikal na katawagang 'Dagat' para sa malaking tansong sisidlan sa templo at nililinaw ang materyal nito.
- source_word: כְּלֵי הַנְּחֹשֶׁת
  choice: mga kagamitang tanso
  rationale: Ang כְּלִי ay malawak na tumutukoy sa kagamitan o sisidlan; 'mga kagamitan' ang likas at hindi labis na tiyak na salin.
- source_word: בָּהּ
  choice: Gamit iyon
  rationale: Ipinahahayag ang instrumental na diwa ng parirala nang natural sa Filipino, nang hindi pinipilit kung mismong metal o ang nakuhang dami ang tinutukoy.
theological_decisions: []
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang maikli at tuwirang ayos ng salaysay at ang katawagang pang-templo na 'Dagat na Tanso.'
