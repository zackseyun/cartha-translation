  text: וַ/יִּשְׁלַ֣ח אֶת הֲדֽוֹרָם בְּנ֣/וֹ אֶל הַ/מֶּֽלֶךְ דָּ֠וִיד ל/שאול ל֨/וֹ לְ/שָׁל֜וֹם וּֽ/לְ/בָרֲכ֗/וֹ עַל֩ אֲשֶׁ֨ר נִלְחַ֤ם בַּ/הֲדַדְעֶ֨זֶר֙ וַ/יַּכֵּ֔/הוּ כִּי אִ֛ישׁ מִלְחֲמ֥וֹת תֹּ֖עוּ הָיָ֣ה הֲדַדְעָ֑זֶר וְ/כֹ֗ל כְּלֵ֛י זָהָ֥ב וָ/כֶ֖סֶף וּ/נְחֹֽשֶׁת־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/018/010.yaml
  text: So he sent Hadoram his son to King David to ask about his welfare and to bless him because he had fought against Hadadezer and struck him down[a], for Hadadezer had been at war with Tou[d][c][b]; and he sent all kinds of articles of gold and silver and bronze.
translation:
  language: tl
  text: Kaya ipinadala niya ang anak niyang si Hadoram kay Haring David upang kumustahin ang kalagayan nito[a] at batiin ito[b], dahil nakipaglaban si David kay Hadadezer at nilupig ito. Sapagkat nakikipagdigma si Hadadezer laban kay Tou.[c] Ipinadala rin ni Tou ang lahat ng uri ng kagamitang yari sa ginto, pilak, at tanso.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “upang tanungin siya tungkol sa kapayapaan.” Ginagamit dito ang “kapayapaan” sa kahulugang mabuting kalagayan o kapakanan.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “at pagpalain siya.” Sa kontekstong diplomatikong ito matapos ang tagumpay, ang pandiwa ay maaari ring mangahulugang batiin o papurihan.
    reason: lexical_alternative
  - marker: c
    text: Sa literal, “Sapagkat si Hadadezer ay isang taong may mga digmaan kay Tou,” isang idyomang nangangahulugang nakikipagdigma siya kay Tou.
    reason: lexical_alternative
  - marker: d
    text: Nagtatapos ang tekstong Hebreo sa “at lahat ng kagamitang ginto, pilak, at tanso.” Ang pandiwang “ipinadala” ay ipinahihiwatig ng konteksto.
    reason: textual_clarity
lexical_decisions:
- source_word: וַיִּשְׁלַח אֶת הֲדוֹרָם בְּנוֹ
  choice: Kaya ipinadala niya ang anak niyang si Hadoram
  rationale: Ipinapahayag ng anyong pasalaysay ang kasunod na pangyayari. Likas sa modernong Filipino ang “Kaya ipinadala niya,” at malinaw na napapanatili ang ugnayang ama-anak.
- source_word: אֶל הַמֶּלֶךְ דָּוִיד
  choice: kay Haring David
  rationale: Karaniwang ayos ito sa Filipino para sa titulo at pangalang pantangi.
- source_word: לִשְׁאוֹל לוֹ לְשָׁלוֹם
  choice: upang kumustahin ang kalagayan nito
  rationale: Ang Hebreong idyoma ay literal na pagtatanong tungkol sa kapayapaan o kabutihan ng kalagayan. Ang “kumustahin ang kalagayan” ay natural at saklaw ang diwa ng kabuuang kapakanan.
- source_word: וּלְבָרֲכוֹ
  choice: at batiin ito
  rationale: Bagaman literal na “pagpalain,” sa diplomatikong konteksto ng tagumpay ay tumutukoy ito sa pagbati o pagbibigay-pugay. Inilalagay sa talababa ang mas literal na kahulugan.
- source_word: עַל אֲשֶׁר נִלְחַם בַּהֲדַדְעֶזֶר וַיַּכֵּהוּ
  choice: dahil nakipaglaban si David kay Hadadezer at nilupig ito
  rationale: Nililinaw ang likas na paksa ng pandiwa upang maiwasan ang malabong panghalip sa Filipino. Ang “nilupig” ay nagpapahayag ng pagkatalo sa digmaan nang hindi ipinapalagay na napatay si Hadadezer.
- source_word: כִּי אִישׁ מִלְחֲמוֹת תֹּעוּ הָיָה הֲדַדְעָזֶר
  choice: Sapagkat nakikipagdigma noon si Hadadezer kay Tou
  rationale: Ang literal na “isang taong may mga digmaan” ay idyomang nagsasaad na magkalaban sa digmaan sina Hadadezer at Tou. Hindi dinaragdagan ang teksto ng tiyak na bilang ng mga labanan.
- source_word: וְכֹל כְּלֵי זָהָב וָכֶסֶף וּנְחֹשֶׁת
  choice: Nagpadala rin siya ng lahat ng uri ng kagamitang yari sa ginto, pilak, at tanso
  rationale: Walang nakasulat na pandiwa sa huling parirala ng Hebreo, ngunit ipinahihiwatig ng konteksto na ipinadala ang mga bagay na ito. Ang “kagamitan” ay malawak na katumbas ng כְּלֵי, at ang “tanso” ay angkop sa sinaunang metal na tinutukoy ng נְחֹשֶׁת.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “kumustahin ang kalagayan” bilang likas na katumbas ng Hebreong idyoma, at “nilupig” para sa malinaw na pagkatalo sa digmaan nang hindi nagpapahiwatig ng kamatayan. Ang “ito/nito” ay ginagamit para sa tao alinsunod sa karaniwang modernong gamit kapag kailangang iwasan ang kalituhan sa magkakasunod na panlalaking tauhan.
