  text: גַּם אֹתָ֗/ם הִקְדִּ֞ישׁ הַ/מֶּ֤לֶךְ דָּוִיד֙ לַ/יהוָ֔ה עִם הַ/כֶּ֨סֶף֙ וְ/הַ/זָּהָ֔ב אֲשֶׁ֥ר נָשָׂ֖א מִ/כָּל הַ/גּוֹיִ֑ם מֵֽ/אֱד֤וֹם וּ/מִ/מּוֹאָב֙ וּ/מִ/בְּנֵ֣י עַמּ֔וֹן וּ/מִ/פְּלִשְׁתִּ֖ים וּ/מֵֽ/עֲמָלֵֽק־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/018/011.yaml
  text: 'King David also dedicated these to Yahweh[a], along with the silver and the gold that he had taken from all the nations: from Edom, Moab, the Ammonites, the Philistines[c][b], and Amalek.'
translation:
  language: tl
  text: Ang mga iyon[a] ay itinalaga rin ni Haring David kay Yahweh, kasama ng pilak at ginto na nakuha[b] niya mula sa lahat ng bansa—mula sa Edom, Moab, mga Ammonita[c], mga Filisteo, at Amalek.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “mga iyon” ay tumutukoy sa mga kagamitang tanso na binanggit sa naunang talata.
    reason: cross_reference
  - marker: b
    text: Maaari ring isalin na “dinala” o “tinangay.” Ang pandiwang Hebreo ay literal na maaaring mangahulugang “buhatin” o “dalhin,” ngunit dito ay tumutukoy sa pagkuha ng samsam o tributo mula sa mga bansang natalo.
    reason: lexical_alternative
  - marker: c
    text: Sa Hebreo, “mga anak ni Ammon,” ibig sabihin, mga Ammonita.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: rin
  rationale: 'Ipinahihiwatig ang pagpapatuloy mula sa naunang talata: ang mga bagay na ito ay itinalaga rin.'
- source_word: אֹתָם
  choice: ang mga iyon
  rationale: Ang panghalip ay tumutukoy sa mga kagamitang tanso sa naunang talata; pinananatili ng “mga iyon” ang pabalik na pagtukoy nang hindi isinasama sa mismong talata ang paliwanag.
- source_word: הִקְדִּישׁ
  choice: itinalaga
  rationale: Natural at marangal na salin para sa pagbubukod ng isang bagay bilang ukol sa Diyos, lalo na sa konteksto ng mga handog o kayamanan.
- source_word: לַיהוָה
  choice: kay Yahweh
  rationale: Tuwirang isinasalin ang pangalang tipan na יהוה bilang “Yahweh”; ang “kay” ay angkop sa pandiwang “itinalaga.”
- source_word: עִם
  choice: kasama ng
  rationale: Ipinakikitang sabay na itinalaga ang mga naunang bagay at ang pilak at ginto.
- source_word: הַכֶּסֶף וְהַזָּהָב
  choice: ang pilak at ginto
  rationale: Pinananatili ang dalawang uri ng mahalagang metal sa isang natural na pariralang Tagalog.
- source_word: אֲשֶׁר נָשָׂא
  choice: na nakuha niya
  rationale: Sa kontekstong militar, ang נשׂא ay tumutukoy sa pagkuha o pagdadala ng samsam o tributo; neutral at natural ang “nakuha” habang ang mas literal na diwa ay inilalahad sa talababa.
- source_word: מִכָּל הַגּוֹיִם
  choice: mula sa lahat ng bansa
  rationale: Ang גּוֹיִם ay tumutukoy rito sa nakapaligid na mga bansang banyaga.
- source_word: מֵאֱדוֹם וּמִמּוֹאָב וּמִבְּנֵי עַמּוֹן וּמִפְּלִשְׁתִּים וּמֵעֲמָלֵק
  choice: mula sa Edom, Moab, mga Ammonita, mga Filisteo, at Amalek
  rationale: Gumagamit ng karaniwang modernong katawagan sa Tagalog; ang “mga Ammonita” ay likas na katumbas ng literal na “mga anak ni Ammon.”
theological_decisions:
- issue: Pagsasalin sa pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Pangngalang pantangi ang יהוה sa teksto; pinananatili ng “Yahweh” ang natatanging pangalang tipan nang hindi ito pinapalitan ng isang titulo.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “itinalaga” para sa kontekstong panrelihiyon, habang iniwasan ang sobrang teknikal o makalumang pananalita. Inayos ang mga pananda ng talababa upang mailagay sa mismong salitang kanilang ipinapaliwanag.
