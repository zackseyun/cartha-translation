base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/018/014.yaml
  text: So David reigned over all Israel[a], and he administered justice and righteousness to all his people.
translation:
  language: tl
  text: Naghari si David sa buong Israel, at lagi siyang nagpatupad ng katarungan at katuwiran[a] para sa buong bayan niya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “paghatol at katuwiran.” Pinagsasama ng dalawang salitang Hebreo ang makatarungang paghatol at moral na katuwiran sa paglalarawan sa pamamahala ni David.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמְלֹךְ
  choice: naghari
  rationale: Ang Qal na anyo ng מלך ay tumutukoy sa pamamahala bilang hari; tuwiran at natural itong ipinahahayag ng “naghari.”
- source_word: עַל כָּל יִשְׂרָאֵל
  choice: sa buong Israel
  rationale: Ang עַל kasunod ng מלך ay tumutukoy sa saklaw ng paghahari. Ang “buong Israel” ay nagpapanatili sa diin ng כָּל.
- source_word: וַיְהִי עֹשֶׂה
  choice: at patuloy niyang ipinatupad
  rationale: Ang היה kasama ng participle ay nagpapahayag ng nagpapatuloy o nakaugaliang pagkilos. Ipinapakita ng “patuloy niyang ipinatupad” ang duratibong diwa sa konteksto ng pamamahala nang hindi gumagamit ng asiwa at literal na “siya ay gumagawa.”
- source_word: מִשְׁפָּט
  choice: katarungan
  rationale: Sa konteksto ng maharlikang pamamahala, tumutukoy ito sa makatarungang paghatol at kaayusang legal; “katarungan” ang malinaw at likas na salin.
- source_word: וּצְדָקָה
  choice: at katuwiran
  rationale: Tumutukoy ang צְדָקָה sa pagiging matuwid at sa wastong kaayusan. Pinananatili ng “katuwiran” ang pagkakaiba nito sa מִשְׁפָּט habang kinikilala ang ugnayan ng dalawang salita.
- source_word: לְכָל עַמּוֹ
  choice: para sa buong bayan niya
  rationale: Ang לְ ay nauunawaan dito bilang pagtukoy sa mga nakikinabang sa makatarungang pamamahala, at pinananatili ng “bayan niya” ang panghalip na hulapi at ang pampolitikang diwa ng עַם.
theological_decisions:
- issue: Paglalahad sa tambalang מִשְׁפָּט וּצְדָקָה na naglalarawan sa matuwid na paghahari
  choice: katarungan at katuwiran
  alternative: paghatol at katuwiran
  rationale: Pinananatili ng saling ito ang magkaugnay ngunit hindi lubusang magkaparehong diwa ng legal na katarungan at moral na katuwiran, nang hindi pinag-iisa ang dalawa sa iisang konsepto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “patuloy” upang maipahayag ang nakaugaliang kilos ng konstruksiyong Hebreo, at inilagay ang talababa sa mismong tambalang “katarungan at katuwiran” na tinatalakay nito.
