  naturalness: Mas natural at marangal sa makabagong Filipino ang “Naghari si David ... at lagi siyang nagpatupad ...” kaysa “Kaya ... patuloy niyang ipinatupad.” Ang “lagi siyang” ay malinaw na naghahayag ng nakaugalian o nagpapatuloy na diwa ng היה + participle.
  terminology: Maaaring panatilihin ang “katarungan at katuwiran,” isang angkop at matatag na salin para sa מִשְׁפָּט וּצְדָקָה. Ang talababa ay nananatiling wastong nakaugnay sa pares ng mga salita.
