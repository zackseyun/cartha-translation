    rationale: Ang עֹשֶׂה ay tumutukoy sa patuloy o nakaugaliang pagsasagawa ng katarungan at katuwiran. Ang “lagi siyang nagpatupad” ay mas likas at ipinapahayag ang aspektong ito.
