  naturalness: Marangal at malinaw sa kabuuan, ngunit hindi natural ang “mga kalasag ... na nasa mga lingkod.” Ang “na dala ng mga lingkod” ay likas na Filipino at naaayon sa malamang na tungkulin ng עַל sa pariralang ito.
  terminology: Ang “kalasag,” “mga lingkod,” “Hadadezer,” at “Jerusalem” ay angkop. Pinananatili ng “mga kalasag na ginto” ang maigsi at bahagyang hindi-tiyak na katangian ng Hebreo; maayos ang talababa tungkol sa posibleng pagkakalupkop ng ginto.
