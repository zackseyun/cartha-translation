translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kalasag,” “lingkod,” at “dinala” bilang mga salitang madaling maunawaan habang pinananatili ang kalapitan sa Hebreo. Ang “na nasa” ay sadyang nagpapanatili sa bahagyang kalabuan ng עַל.
