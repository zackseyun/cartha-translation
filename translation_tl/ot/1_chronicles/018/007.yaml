  yaml_path: translation/ot/1_chronicles/018/007.yaml
  text: And David took the shields of gold that were on the servants of Hadadezer and brought them to Jerusalem[a][b][c].
translation:
  language: tl
  text: Kinuha ni David ang mga kalasag na ginto[a] na dala ng mga lingkod[b] ni Hadadezer[c], at dinala niya ang mga iyon sa Jerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga gintong kalasag”; maaaring tumukoy ang Hebreo sa mga kalasag na nababalutan ng ginto.
    reason: lexical_alternative
  - marker: b
    text: Ang “mga lingkod” dito ay malamang na mga tauhan ng hari o mga tagapaglingkod na militar ni Hadadezer, hindi kinakailangang mga alipin sa makitid na makabagong kahulugan.
    reason: cultural_note
  - marker: c
    text: Sa ilang tradisyon ng teksto at sa katumbas na salaysay sa 2 Samuel, ang pangalan ay binabaybay na “Hadarezer.”
    reason: textual_variant
lexical_decisions:
- source_word: וַיִּקַּח
  choice: Kinuha
  rationale: Karaniwang kahulugan ng לקח sa salaysay ang “kumuha.” Bagaman maaaring ipahiwatig ng kontekstong pandigma ang pagsamsam, hindi iyon kailangang idagdag sa mismong salin.
- source_word: שִׁלְטֵי הַזָּהָב
  choice: mga kalasag na ginto
  rationale: Ang שִׁלְטֵי ay tumutukoy sa mga kalasag, marahil ay maliliit na kalasag. Pinananatili ng “mga kalasag na ginto” ang anyong konstruktibo ng Hebreo nang hindi tiyak na nagpapasya kung purong ginto o nababalutan lamang ng ginto ang mga ito.
- source_word: אֲשֶׁר הָיוּ עַל
  choice: na nasa
  rationale: Malapit ito sa literal na “na nasa ibabaw/nasa” ngunit natural sa Filipino. Hindi nito ipinapalagay nang tahasan kung suot, hawak, o dala ng mga lalaki ang mga kalasag.
- source_word: עַבְדֵי הֲדַדְעָזֶר
  choice: mga lingkod ni Hadadezer
  rationale: Ang עֲבָדִים ay karaniwang “mga lingkod.” Sa maharlika at militar na konteksto, maaari itong tumukoy sa mga tauhan o tagapaglingkod ng hari, kaya hindi ginamit ang mas makitid na “mga alipin.”
- source_word: הֲדַדְעָזֶר
  choice: Hadadezer
  rationale: Ito ang anyo ng pangalan sa tekstong Masoretiko ng talatang ito.
- source_word: וַיְבִיאֵם יְרוּשָׁלִָם
  choice: at dinala niya ang mga iyon sa Jerusalem
  rationale: Ang Hiphil ng בוא ay “dalhin.” Nililinaw ng “ang mga iyon” ang panghalip na tumutukoy sa mga kalasag.
