translation_notes:
  register: Makabago at dignidad na Filipino, na may payak na ayos ng pangungusap. Ginamit ang “sa gawing Hamat” upang mapanatili ang direksiyonal na detalye ng Hebreo, at “kapangyarihan” upang maipahayag nang natural ang idyomang “itayo ang kamay.”
