base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/018/003.yaml
  text: David struck Hadadezer king of Zobah[b][a], as he went to establish his power at the Euphrates River.
translation:
  language: tl
  text: Sinalakay ni David si Hadadezer[a], hari ng Zoba patungong Hamat, nang magtungo si Hadadezer upang itatag ang kaniyang kapangyarihan sa Ilog Eufrates.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hadadezer ang baybay ng pangalan dito; sa katumbas na salaysay sa 2 Samuel 8:3 ay may ibang anyo ng pangalan na madalas na binabaybay na Hadarezer.
    reason: textual_variant
lexical_decisions:
- source_word: וַיַּךְ
  choice: sinalakay
  rationale: Sa kontekstong militar, likas na ipinahahayag ng “sinalakay” ang aktuwal na paglusob na saklaw ng נכה, nang hindi ipinapalagay ang ganap na pagkatalo na maaaring ipahiwatig ng “tinalo” o “nilupig.”
- source_word: הֲדַדְעֶזֶר
  choice: Hadadezer
  rationale: Tinutumbasan ayon sa anyo ng pangalan sa tekstong Hebreo ng Mga Cronica.
- source_word: מֶלֶךְ צוֹבָה
  choice: hari ng Zoba
  rationale: Tuwirang inililipat ang pariralang konstruktong tumutukoy sa katungkulan at kaharian ni Hadadezer.
- source_word: חֲמָתָה
  choice: sa gawing Hamat
  rationale: Pinananatili nito ang direksiyonal na hulaping ה, na nagpapahiwatig ng pagkilos patungo sa Hamat, habang nananatiling natural sa Filipino.
- source_word: בְּלֶכְתּוֹ
  choice: nang magtungo ito
  rationale: Ang infinitive construct na may ב ay nagsasaad ng kasabay o panahong pangyayari. Ang “ito” ay likas na tumutukoy sa pinakamalapit na tinukoy na tao, si Hadadezer, ayon sa konteksto, nang hindi inuulit nang mabigat ang pangalan.
- source_word: לְהַצִּיב יָדוֹ
  choice: upang itatag ang kapangyarihan nito
  rationale: Ang literal na “itayo ang kamay nito” ay isang idyomang pampolitika at pangmilitar para sa pagtatatag o muling paggigiit ng pamamahala. Inihahatid ng “itatag ang kapangyarihan” ang diwa nang malinaw at marangal.
- source_word: בִּנְהַר פְּרָת
  choice: sa Ilog Eufrates
  rationale: Malinaw na tinutukoy ang kilalang ilog at natural ang pang-ukol na “sa” para sa lokasyon o saklaw ng kapangyarihan.
