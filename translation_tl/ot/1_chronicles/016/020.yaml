translation:
  language: tl
  text: Naglakbay-lakbay sila mula sa isang bansa patungo sa iba, at mula sa isang kaharian patungo sa ibang sambayanan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּתְהַלְּכוּ
  choice: Nagpalipat-lipat sila
  rationale: Ang hitpael ng הלך ay nagpapahiwatig ng paulit-ulit na paggalaw o pagpunta sa iba’t ibang lugar. Likas sa modernong Tagalog ang “nagpalipat-lipat” at hindi nito nililimitahan ang kilos sa minsanang pagpunta.
- source_word: מִגּוֹי אֶל גּוֹי
  choice: mula sa isang bansa patungo sa isa pa
  rationale: Pinananatili ng “bansa” ang karaniwang kahulugan ng גּוֹי, habang malinaw at natural sa Tagalog ang distributibong hulma na “mula sa isang… patungo sa isa pa.”
- source_word: וּמִמַּמְלָכָה
  choice: at mula sa isang kaharian
  rationale: Tumpak na katumbas ng מַמְלָכָה ang “kaharian.” Idinagdag ang “isang” upang maging likas sa Tagalog at maipahayag ang ugnayang distributibo ng magkatulad na mga parirala.
- source_word: אֶל עַם אַחֵר
  choice: patungo sa ibang sambayanan
  rationale: Ipinapahayag ng “sambayanan” ang עַם bilang isang pangkat ng mga tao at pinananatili ang pagkakaiba nito sa naunang גּוֹי na isinaling “bansa.” Ang “ibang” ay tumutugma sa אַחֵר.
