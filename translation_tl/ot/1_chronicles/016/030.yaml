base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/030.yaml
  text: Tremble before him[a], all the earth; indeed, the world is established; it shall not be moved.
translation:
  language: tl
  text: Manginig sa harap niya, buong daigdig! Tunay na matatag ang sanlibutan; hindi ito matitinag.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring, “hindi ito gugumewang” o “hindi ito mayayanig.” Ipinahihiwatig ng Hebreong larawan ang matatag na katayuan.
    reason: lexical_alternative
lexical_decisions:
- source_word: חִילוּ
  choice: Manginig kayo
  rationale: Ang qal imperative ng חול ay maaaring tumukoy sa panginginig o pamimilipit; sa konteksto ng pagsamba at presensiya ng Diyos, natural na ipinahahayag ng “manginig” ang matinding pagpipitagan.
- source_word: מִלְּפָנָיו
  choice: sa harap niya
  rationale: Katumbas ito ng literal na “mula sa harap ng kaniyang mukha/presensiya,” ngunit ang “sa harap niya” ang natural at marangal na idyoma sa Filipino.
- source_word: כָּל הָאָרֶץ
  choice: buong daigdig
  rationale: Sa pangkalahatan at kosmikong panawagan ng awit, tumutukoy ang אֶרֶץ sa buong lupa, hindi sa isang partikular na lupain.
- source_word: אַף
  choice: Tunay na
  rationale: Nagbibigay rito ang particle ng diin at pagpapatibay, hindi lamang simpleng pagdaragdag.
- source_word: תִּכּוֹן
  choice: matatag
  rationale: Ang niphal ng כון ay nagpapahiwatig na naitatag at nananatiling matibay; ang “matatag” ay natural na stative na salin sa Filipino.
- source_word: תֵּבֵל
  choice: ang sanlibutan
  rationale: Tumutukoy ang תֵּבֵל sa maayos o tinatahanang mundo; malinaw na naihihiwalay ng “sanlibutan” ang termino mula sa naunang “buong daigdig” habang nananatiling natural.
- source_word: בַּל תִּמּוֹט
  choice: hindi ito mayayanig
  rationale: Ang מוט sa niphal ay nangangahulugang matinag, gumewang, o mayanig. Pinananatili ng “hindi ito mayayanig” ang larawan ng matatag na kalagayan nang hindi nagpapahiwatig ng siyentipikong pahayag tungkol sa kawalan ng anumang galaw.
theological_decisions:
- issue: Wika tungkol sa katatagan ng sanlibutan
  choice: Inilalarawan ang sanlibutan bilang matatag at hindi mayayanig sa ilalim ng paghahari ng Diyos.
  alternative: Maaaring isalin nang mas pisikal bilang “hindi ito gigewang” o “hindi ito matitinag.”
  rationale: Ang Hebreong patula ay nakatuon sa katatagan at kaayusan ng nilikha, hindi tahasang sa isang siyentipikong pag-angkin tungkol sa ganap na kawalang-galaw. Pinananatili ng salin ang larawan nang hindi ipinapasok ang mga sumunod na debateng kosmolohikal.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “Manginig kayo” bilang tuwirang maramihang utos, at pinanatili ang patulang paralelismo ng “daigdig” at “sanlibutan.”
