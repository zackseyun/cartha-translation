  to: Itinalaga niya ang ilan sa mga Levita upang maglingkod sa harap ng kaban ni Yahweh, gunitain[a], magpasalamat, at magpuri kay Yahweh, ang Diyos ng Israel.
  rationale: Pinalitan ang “magpaalaala” ng “gunitain” upang maging natural at kumpleto ang Tagalog na sintaks, alinsunod din sa kahulugang “to commemorate” sa English audit trail. Inililipat sa talababa ang iba pang posibleng, kabilang ang causative, na mga pakahulugan upang huwag labis na limitahan ang liturhikal na kalabuan ng Hebreo.
