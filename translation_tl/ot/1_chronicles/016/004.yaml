  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יִּתֵּ֞ן לִ/פְנֵ֨י אֲר֧וֹן יְהוָ֛ה מִן הַ/לְוִיִּ֖ם מְשָׁרְתִ֑ים וּ/לְ/הַזְכִּיר֙ וּ/לְ/הוֹד֣וֹת וּ/לְ/הַלֵּ֔ל לַ/יהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/004.yaml
  text: He appointed some of the Levites to minister before the ark of Yahweh[a], to commemorate, to give thanks, and to praise Yahweh, the God of Israel.
translation:
  language: tl
  text: Itinalaga niya ang ilan sa mga Levita upang maglingkod sa harap ng kaban ni Yahweh, gunitain[a], magpasalamat, at magpuri kay Yahweh, ang Diyos ng Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “magpaalaala” o “bumanggit.” Ang pandiwang Hebreo ay maaaring tumukoy sa pagpapagunita sa konteksto ng pagsamba.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: Itinalaga niya
  rationale: Bagaman literal na nangangahulugang “ibinigay” o “inilagay,” tumutukoy rito ang pandiwa sa pagtatalaga ng mga tao sa isang tungkulin.
- source_word: לִפְנֵי
  choice: sa harap ng
  rationale: Pinananatili nito ang diwang panlugar at panliturhiya ng paglilingkod sa kinaroroonan ng kaban.
- source_word: אֲרוֹן יְהוָה
  choice: kaban ni Yahweh
  rationale: Direktang ipinapahayag ang ugnayang construct at pinananatili ang personal na pangalan ng Diyos.
- source_word: מִן הַלְוִיִּם
  choice: ang ilan sa mga Levita
  rationale: 'Ipinapakita nito ang partitive na gamit ng מִן: isang bahagi lamang ng pangkat ng mga Levita.'
- source_word: מְשָׁרְתִים
  choice: upang maglingkod
  rationale: Ang participle ay naglalarawan sa kanilang tungkuling panrelihiyon; natural at malinaw sa modernong Tagalog ang “maglingkod.”
- source_word: וּלְהַזְכִּיר
  choice: magpaalaala
  rationale: Pinananatili ng causative na anyo ang ideya ng pagpapagunita o pagpapaalaala sa konteksto ng pagsamba, nang hindi nilulutas ang tiyak na liturhikal na kahulugan.
- source_word: וּלְהוֹדוֹת
  choice: magpasalamat
  rationale: Sa konteksto ng pagsamba, ang pandiwa ay tumutukoy sa pagpapasalamat sa halip na pagtatapat.
- source_word: וּלְהַלֵּל
  choice: magpuri
  rationale: Ito ang tuwiran at natural na katumbas ng pandiwa; hindi idinaragdag ang pag-awit na hindi tahasang binanggit.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ang Diyos ng Israel
  rationale: Tuwirang pinananatili ang pamagat at ugnayang nasa tekstong Hebreo.
theological_decisions:
- issue: Pagbaybay sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah o PANGINOON
  rationale: Personal na pangalan ang nasa tekstong Hebreo, kaya isinalin ito bilang “Yahweh” sa halip na palitan ng isang titulo.
- issue: Liturhikal na kahulugan ng וּלְהַזְכִּיר
  choice: magpaalaala
  alternative: gunitain o banggitin
  rationale: May saklaw ang pandiwang Hebreo na maaaring tumukoy sa pagpapagunita, paggunita, o pagbanggit sa pagsamba; pinananatili sa talababa ang tunay na kalabuan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kaban” bilang karaniwang katawagan sa kaban ng tipan, “maglingkod” para sa gawaing panrelihiyon ng mga Levita, at magkakatulad na anyong pandiwa sa tatlong layunin.
