id: 1CH.16.31
reference: 1 Chronicles 16:31
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: יִשְׂמְח֤וּ הַ/שָּׁמַ֨יִם֙ וְ/תָגֵ֣ל הָ/אָ֔רֶץ וְ/יֹאמְר֥וּ בַ/גּוֹיִ֖ם יְהוָ֥ה מָלָֽךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/031.yaml
  text: Let the heavens rejoice[a], and let the earth be glad; and let them say among the nations, “Yahweh reigns!”
translation:
  language: tl
  text: 'Magalak ang kalangitan, at magsaya ang lupa;

    at sabihin nila sa gitna ng mga bansa,

    “Si Yahweh ay naghahari!”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יִשְׂמְחוּ
  choice: Magalak
  rationale: 'Ang Qal imperfect na nasa patulang serye ng mga panawagan ay isinalin bilang pautos o paghahangad: “Magalak.”'
- source_word: הַשָּׁמַיִם
  choice: ang kalangitan
  rationale: Sa kaagapay nitong “ang lupa,” tumutukoy ito sa kalangitan bilang bahagi ng buong nilikha; natural din itong marangal na pananalita sa modernong Tagalog.
- source_word: וְתָגֵל
  choice: at magsaya
  rationale: Ipinahahayag ng גיל ang matinding kagalakan. Pinananatili ng “magsaya” ang patulang pagkakaagapay nang hindi inuulit ang “magalak.”
- source_word: הָאָרֶץ
  choice: ang lupa
  rationale: Dahil katambal ito ng “kalangitan” sa isang pansansinukob na panawagan ng papuri, “lupa” ang angkop kaysa sa lokal na “lupain.”
- source_word: וְיֹאמְרוּ
  choice: at sabihin nila
  rationale: Ipinagpapatuloy ng imperfect na pandiwa ang puwersa ng panawagan. Pinananatili ng “nila” ang pangmaramihang anyo nang hindi tahasang nilulutas kung sino ang tinutukoy na tagapagsalita.
- source_word: בַגּוֹיִם
  choice: sa gitna ng mga bansa
  rationale: Tumutukoy ang גּוֹיִם sa mga bansa o bayan ng daigdig. Ipinakikita ng “sa gitna ng” na ang pahayag ay maririnig sa kanilang kalipunan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang transliterasyon ng personal na banal na pangalan sa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: מָלָךְ
  choice: ay naghahari
  rationale: Sa pormulang ito ng papuri, ipinahahayag ng perfect ang umiiral na katotohanan ng paghahari ni Yahweh. Natural itong naihahayag sa Tagalog bilang “naghahari” nang hindi ipinapalagay na noon lamang siya naging hari.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Personal na pangalan ang nasa Hebreo. Pinananatili ng “Yahweh” ang pagkakaiba nito sa titulong “Panginoon” at hindi nagdaragdag ng denominasyonal na pagpapakahulugan.
- issue: Aspekto ng מָלָךְ
  choice: Si Yahweh ay naghahari
  alternative: Naging hari si Yahweh; Si Yahweh ang hari
  rationale: Maaaring magpahiwatig ang anyo ng pagkakaluklok o ng ganap na paghahari, ngunit sa konteksto ng papuri, ang “naghahari” ang natural na pahayag ng kasalukuyang soberanya at hindi sapilitang nagpapahiwatig ng pagsisimula ng pagiging hari.
translation_notes:
  register: Makata, marangal, at madaling maunawaan sa modernong Filipino. Pinanatili ang tatlong magkakaagapay na panawagan at ang pansansinukob na saklaw ng “kalangitan” at “lupa.” Hindi isinama ang footnote ng English consultation layer sapagkat hindi ito tugma sa English main text at hindi kailangan sa saling direktang gumagamit ng “Yahweh.”
