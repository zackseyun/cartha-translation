  source_fidelity: 'Tapat ang salin sa Hebreo: napanatili ang magkakatugmang panawagang volitive na “Magalak ... magsaya ... sabihin nila,” ang pansansinukob na pares na “kalangitan” at “lupa,” ang saklaw na “sa gitna ng mga bansa,” at ang pormula ng paghahari ni Yahweh. Ang “Si Yahweh ay naghahari” ay angkop na pagsasalin ng מָלָךְ sa kontekstong ito at hindi nagpapahiwatig na saka lamang siya naging hari.'
  naturalness: Makata, marangal, at natural ang daloy sa modernong Filipino. Katanggap-tanggap ang “sabihin nila” dahil pinananatili nito ang hindi tahasang tinutukoy na pangmaramihang tagapagsalita sa Hebreo at ang personipikasyong patula ng talata.
