base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/036.yaml
  text: Blessed be Yahweh[a], the God of Israel, from everlasting to everlasting. Then all the people said[b], “Amen!” and praised Yahweh.
translation:
  language: tl
  text: Purihin si Yahweh, ang Diyos ng Israel, mula sa walang hanggan hanggang sa walang hanggan.[a] At sinabi ng buong bayan, “Amen!” at nagpuri sila kay Yahweh.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “mula sa kawalang-hanggan hanggang sa kawalang-hanggan” o “magpakailanman.”
    reason: lexical_alternative
  - marker: b
    text: 'Siksik ang Hebreo at maaari ring unawain: “Amen, at purihin si Yahweh.” Ang diwa ay tumugon ang bayan ng amen at pagpuri.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרוּךְ
  choice: Purihin
  rationale: Sa pormulang doksolohikal, ipinahahayag nito ang pagpupuri o pagpapala sa Diyos. Ang “Purihin” ang natural at marangal na katumbas sa modernong Tagalog; iniiwasan din nito ang di-natural na impresyong ang tao ang magkakaloob ng pagpapala sa Diyos.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang isinasatitik ang banal na pangalang יהוה sa halip na palitan ito ng titulong “Panginoon.”
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ang Diyos ng Israel
  rationale: Tuwirang salin ng construct chain at natural na apposition sa Tagalog.
- source_word: מִן הָעוֹלָם וְעַד הָעֹלָם
  choice: mula sa walang hanggan hanggang sa walang hanggan
  rationale: Pinananatili ang magkatapat na temporal na mga parirala at ang saklaw na walang takda, nang hindi ito ginagawang mas pilosopikal kaysa sa Hebreong idyoma.
- source_word: וַיֹּאמְרוּ כָל הָעָם
  choice: At sinabi ng buong bayan
  rationale: Pinananatili ang pagsulong ng salaysay at ang kolektibong tugon ng lahat ng nagkakatipong bayan.
- source_word: אָמֵן
  choice: Amen!
  rationale: Pinananatili ang nakikilalang transliterasyon ng liturhikal na tugon at ang mariing himig nito.
- source_word: וְהַלֵּל לַיהוָה
  choice: at nagpuri sila kay Yahweh
  rationale: Ipinapahayag sa natural na Tagalog na ang bayan ay tumugon hindi lamang ng “Amen” kundi pati ng pagpuri, habang inilalagay sa talababa ang pagiging siksik at posibleng pautos na anyo ng Hebreo.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יהוה
  choice: Yahweh
  alternative: Jehovah; ang PANGINOON
  rationale: Personal na pangalan ang nasa tekstong Hebreo, kaya pinananatili ito bilang “Yahweh” sa halip na palitan ng titulo.
- issue: Saklaw ng עוֹלָם sa doksolohiya
  choice: mula sa walang hanggan hanggang sa walang hanggan
  alternative: magpakailanman; mula sa panahon hanggang sa panahon
  rationale: Pinananatili ng napiling anyo ang pag-uulit at malawak na temporal na puwersa ng Hebreo nang hindi nagpapataw ng labis na teknikal na pakahulugan sa eternidad.
- issue: Anyo ng huling tugon ng bayan
  choice: salaysay na “at nagpuri sila kay Yahweh”
  alternative: pautos o siniping tugon na “at purihin si Yahweh”
  rationale: Umaayon ang salaysay na anyo sa konteksto at malinaw sa Tagalog, ngunit hindi itinatago ang siksik at maaaring pautos na pagbasa ng Hebreo; nakatala ito sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at angkop sa pampublikong pagbasa. Ginamit ang “buong bayan” para sa kolektibong עָם, at pinanatili ang “Amen” bilang pamilyar na liturhikal na tugon. Ang mga pangungusap ay sadyang payak ngunit may doksolohikal na bigat.
