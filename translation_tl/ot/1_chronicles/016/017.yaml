  yaml_path: translation/ot/1_chronicles/016/017.yaml
  text: And he confirmed it to Jacob as a statute[a], to Israel as an everlasting covenant[b],
translation:
  language: tl
  text: At pinagtibay niya ito kay Jacob bilang isang tuntunin[a], kay Israel bilang isang walang-hanggang tipan[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “itinatag niya ito.” Ang pandiwang Hebreo ay maaaring mangahulugang ginawa niyang matatag o pinanatiling may bisa ang isang bagay.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “isang tipang walang hanggan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמִידֶהָ
  choice: At pinagtibay niya ito
  rationale: Ang Hiphil ng עמד ay nagpapahiwatig ng pagpapapanatiling matatag o may bisa. Likas na ipinahahayag ng “pinagtibay” ang diwang ito, habang ang “ito” ay nagpapanatili sa hindi tahasang tinutukoy ng pambabaeng hulapi sa Hebreo.
- source_word: לְיַעֲקֹב
  choice: kay Jacob
  rationale: Ang לְ ay tumutukoy sa di-tuwirang layon o pinaglaanan; ang “kay Jacob” ang natural na katumbas at kaagapay ng “kay Israel.”
- source_word: לְחֹק
  choice: bilang isang tuntunin
  rationale: Ang חֹק ay isang itinakda at may-bisang tuntunin o batas. Ang “tuntunin” ay malinaw sa modernong Filipino at pinananatili ang legal na himig nang hindi nagmumukhang utos lamang.
- source_word: לְיִשְׂרָאֵל
  choice: kay Israel
  rationale: Pinananatili nito ang estrukturang kaagapay ng “kay Jacob” at ang pag-uulit ng dalawang pangalang nasa tekstong Hebreo.
- source_word: בְּרִית עוֹלָם
  choice: bilang isang walang-hanggang tipan
  rationale: Pinananatili ng “tipan” ang mahalagang terminong pangkasunduan, at ipinahahayag ng “walang-hanggan” ang namamalaging bisa ng עוֹלָם sa kontekstong ito.
theological_decisions:
- issue: Tinutukoy ng hulaping pambabae sa וַיַּעֲמִידֶהָ
  choice: Isinalin bilang “ito,” na maaaring tumukoy sa tipan, pangako, o panunumpang binanggit sa naunang konteksto.
  alternative: Tahasan itong tukuyin bilang “ang tipan” o “ang panunumpa.”
  rationale: Hindi pinipili ng salin ang isang mas makitid na antecedent kaysa sa ibinibigay ng Hebreo; pinananatili nito ang tunay na anaporikong kalabuan.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang paralelismong “kay Jacob … kay Israel,” ang pambungad na pangatnig, at ang terminong teolohikal na “tipan.”
