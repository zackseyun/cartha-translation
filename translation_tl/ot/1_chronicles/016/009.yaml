  yaml_path: translation/ot/1_chronicles/016/009.yaml
  text: Sing to him[a]; sing praises to him; speak of all his wondrous deeds.
translation:
  language: tl
  text: Umawit kayo sa kanya; umawit kayo ng papuri sa kanya; magsalita kayo[a] tungkol sa lahat ng kanyang kamangha-manghang gawa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “isalaysay ninyo” o “pagbulay-bulayan ninyo.” Ang pandiwang Hebreo ay maaaring tumukoy sa pagsasalita o sa tahimik na pagbubulay, ngunit mas pinapaboran ng pampublikong panawagan sa kontekstong ito ang pasalitang diwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁירוּ
  choice: Umawit kayo
  rationale: Pautos na maramihan mula sa karaniwang pandiwa para sa pag-awit. Likas at tuwiran ang “umawit kayo” sa modernong Filipino.
- source_word: לֹו
  choice: sa kanya
  rationale: Ipinahihiwatig ng ל na ang Diyos ang pinatutungkulan ng pag-awit at papuri; natural itong ipinapahayag sa Filipino bilang “sa kanya.”
- source_word: זַמְּרוּ
  choice: umawit kayo ng papuri
  rationale: Ang piel ng זמר ay maaaring tumukoy sa paglikha ng musika o pag-awit ng papuri. Pinananatili ng salin ang diwang pagsamba at bahagyang ipinag-iiba ito sa naunang pangkalahatang utos na umawit.
- source_word: שִׂיחוּ
  choice: magsalita kayo
  rationale: Maaaring mangahulugan ang שׂיח ng pagsasalita, pagsasalaysay, o pagbubulay. Sa konteksto ng hayagang panawagan sa bayan, pinili ang panlabas na diwang pasalita, habang inilalahad sa talababa ang tunay na leksikal na saklaw.
- source_word: בְּכָל
  choice: tungkol sa lahat ng
  rationale: Bagaman karaniwang may diwang “sa/loob ng/kasama ng” ang ב, hinihingi ng likas na Filipino pagkatapos ng “magsalita” ang “tungkol sa”; pinananatili ng “lahat” ang ganap na saklaw ng כָּל.
- source_word: נִפְלְאֹתָיו
  choice: kanyang kamangha-manghang gawa
  rationale: Tumutukoy ang salita sa pambihira at makapangyarihang mga gawa na pumupukaw ng pagkamangha. Ang “kamangha-manghang gawa” ay malinaw, marangal, at hindi makaluma.
