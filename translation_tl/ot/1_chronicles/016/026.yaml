reference: 1 Chronicles 16:26
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: כִּ֠י כָּל אֱלֹהֵ֤י הָ/עַמִּים֙ אֱלִילִ֔ים וַ/יהוָ֖ה שָׁמַ֥יִם עָשָֽׂה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/026.yaml
  text: For all the gods of the peoples are idols[b][a], but Yahweh made the heavens.
translation:
  language: tl
  text: Sapagkat ang lahat ng diyos ng mga bayan ay mga diyus-diyosan, ngunit si Yahweh ang gumawa ng langit.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikita ang paliwanag o dahilan kaugnay ng panawagan sa pagsamba sa nakapaligid na konteksto.
- source_word: כָּל אֱלֹהֵי הָעַמִּים
  choice: ang lahat ng diyos ng mga bayan
  rationale: Pinananatili ang kabuuang saklaw ng כָּל at ang tuwirang kahulugan ng אֱלֹהֵי bilang mga diyos na sinasamba ng iba't ibang bayan.
- source_word: אֱלִילִים
  choice: mga diyus-diyosan
  rationale: Likas at malinaw na salin sa modernong Tagalog para sa mga idolo o huwad na diyos; sapat nitong naipahihiwatig ang mapanirang pagtataya ng salitang Hebreo nang hindi dinaragdagan ng tahasang 'walang halaga.'
- source_word: וַיהוָה
  choice: ngunit si Yahweh
  rationale: 'Bagaman literal na pang-ugnay ang וְ na ''at,'' malinaw na pasalungat ang gamit nito rito: ang mga diyus-diyosan ay itinatapat kay Yahweh na Maylikha.'
- source_word: שָׁמַיִם
  choice: ang langit
  rationale: Sa natural na Tagalog, ang kolektibong 'langit' ang karaniwang katumbas ng Hebreong שָׁמַיִם sa konteksto ng paglikha.
- source_word: עָשָׂה
  choice: gumawa
  rationale: Tuwirang pinananatili ang malawak na diwa ng pandiwang עשה at iniiwasang palitan ito ng mas tiyak na 'lumikha.'
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יהוה
  choice: Yahweh
  alternative: Jehovah; PANGINOON
  rationale: Ginagamit mismo ng teksto ang Tetragrammaton; ang 'Yahweh' ay nagpapanatili sa natatanging pangalang tipan sa halip na palitan ito ng titulo.
- issue: Lakas ng pang-ugnay na וְ bago ang יהוה
  choice: pasalungat na 'ngunit'
  alternative: payak na 'at'
  rationale: Ang dalawang sugnay ay naghahambing sa mga diyus-diyosan ng mga bayan at kay Yahweh na gumawa ng langit; likas na ipinahahayag ng 'ngunit' ang ugnayang ito sa Tagalog.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Pinili ang 'mga bayan' kaysa 'mga bansa' upang higit na mapanatili ang diwang etniko-kolektibo ng עַמִּים at maiwasan ang labis na makabagong pampolitikang pakahulugan. Walang talababa dahil hindi kailangan para sa malinaw na pag-unawa sa talata.
