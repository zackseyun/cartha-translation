  text: דִּרְשׁ֤וּ יְהוָה֙ וְ/עֻזּ֔/וֹ בַּקְּשׁ֥וּ פָנָ֖י/ו תָּמִֽיד׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/011.yaml
  text: Seek Yahweh and his strength[a]; seek his face continually.
translation:
  language: tl
  text: Hanapin ninyo si Yahweh at ang kanyang lakas; hanapin ninyo palagi ang kanyang mukha.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “kanyang presensya” (literal, “kanyang mukha”).
    reason: lexical_alternative
lexical_decisions:
- source_word: דִּרְשׁוּ
  choice: Hanapin ninyo
  rationale: Ipinahahayag ng pautos na anyo ang aktibong paglapit at paghahangad kay Yahweh, hindi lamang ang pagtatanong tungkol sa kanya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: וְעֻזּוֹ
  choice: at ang kanyang lakas
  rationale: Ang עֹז ay tuwirang tumutukoy sa lakas o kapangyarihan; pinananatili ng salin ang maikli at makatang pagkakahanay ng Hebreo.
- source_word: בַּקְּשׁוּ
  choice: hanapin ninyo
  rationale: Ipinahahayag ng בקש ang masigasig na paghahanap. Ang pag-uulit ng “hanapin” ay natural sa Filipino at nagpapanatili sa paralelismo ng dalawang pautos.
- source_word: פָנָיו
  choice: ang kanyang mukha
  rationale: Literal itong “kanyang mukha.” Pinananatili sa pangunahing teksto ang kongkretong larawan, habang inilalagay sa talababa ang idyomatikong kahulugang “presensya.”
- source_word: תָּמִיד
  choice: palagi
  rationale: Natural at malinaw na ipinahahayag ng “palagi” ang tuloy-tuloy o palagiang paghahangad na tinutukoy ng תָּמִיד.
theological_decisions:
- issue: Paglalarawan sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Tuwirang ginagamit ng talata ang Tetragrammaton; pinananatili ng “Yahweh” ang pangalang tipan sa halip na palitan ito ng isang titulo.
- issue: Kahulugan ng paghahanap sa “mukha” ng Diyos
  choice: Pinanatili ang “kanyang mukha” sa pangunahing teksto
  alternative: ang kanyang presensya
  rationale: Ang “mukha” ang literal at makapangyarihang larawan ng Hebreo, ngunit maaari rin itong idyomatikong tumukoy sa personal na presensya ng Diyos; hindi nilulutas nang tahimik ang dalawang antas ng kahulugan.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang pangmaramihang “ninyo” upang ipakita na ang dalawang pautos sa Hebreo ay para sa isang pangkat. Pinanatili ang maikli at makatang paralelismo ng talata.
