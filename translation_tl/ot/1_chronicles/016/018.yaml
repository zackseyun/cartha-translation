translation:
  language: tl
  text: na nagsasabi, “Sa iyo[a] ko ibibigay ang lupain ng Canaan, ang bahagi[b] ng inyong mana.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, isahan ang “sa iyo,” ngunit pangmaramihan ang “inyong mana.” Maaaring ipinakikita nito ang paglipat mula sa patriyarkang kinakausap tungo sa kanyang mga inapo bilang mga tagapagmana ng tipan.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “takdang bahagi.” Ang salitang Hebreo ay literal na tumutukoy sa lubid o linyang panukat, at sa pagpapalawak ng kahulugan ay sa isang sinukat at inilaan na bahagi ng lupa.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵאמֹר
  choice: na sinasabi
  rationale: Ang infinitive construct ng אמר ay nagpapakilala sa nilalaman ng sinabi sa tipan mula sa naunang talata. Likas sa Filipino ang “na sinasabi” bilang kawing sa sipi.
- source_word: לְךָ
  choice: sa iyo
  rationale: Pinananatili ang ikalawang panauhang isahan na tumutukoy sa patriyarkang direktang pinangakuan.
- source_word: אֶתֵּן
  choice: ko ibibigay
  rationale: Ang Qal imperfect sa konteksto ng pangako ay may hinaharap na diwa; malinaw itong naipahahayag ng “ibibigay.”
- source_word: אֶרֶץ כְּנָעַן
  choice: ang lupain ng Canaan
  rationale: Pinananatili ng “lupain” ang kongkretong teritoryal na kahulugan ng אֶרֶץ at likas na itinatambal sa pangalang Canaan.
- source_word: חֶבֶל
  choice: bahagi
  rationale: Bagaman literal itong lubid o panukat na pisi, sa konteksto ng lupa ay tumutukoy ito sa sukat o bahaging inilaan. Ang “bahagi” ay malinaw at natural habang pinananatili ang larawan ng paghahati ng lupain.
- source_word: נַחֲלַתְכֶם
  choice: inyong mana
  rationale: Ang נחלה ay minanang pag-aari, lalo na ang lupaing ipinagkaloob sa tipan. Pinananatili ng “inyong” ang pangmaramihang hulapi ng Hebreo.
theological_decisions:
- issue: Paglipat mula sa isahang kinakausap tungo sa pangmaramihang nagmamay-ari
  choice: Pinanatili ang “Sa iyo ... inyong mana.”
  alternative: Gawing isahan ang buong pangungusap, o ipaliwanag bilang “sa iyo at sa iyong mga inapo.”
  rationale: Magkatabi sa Hebreo ang isahang לְךָ at pangmaramihang נַחֲלַתְכֶם. Pinananatili ng salin ang paglipat sa bilang upang hindi tahimik na ipaliwanag o pagtugmain ang pangako sa patriyarka at ang mana ng komunidad ng kanyang mga inapo.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “lupain” at “mana” upang mapanatili ang kongkretong kaloob na teritoryo at ang diwang legal at tipan. Ang ayos na may kuwit bago ang “ang bahagi” ay nagpapanatili sa appositional na ugnayan ng Hebreo.
