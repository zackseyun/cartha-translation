revisions:
- from: Kaya iniwan ni David doon, sa harap ng kaban ng tipan ni Yahweh, si Asaf at ang mga kapatid niya upang patuloy na maglingkod sa harap ng kaban, ayon sa tungkulin sa bawat araw.[a]
  to: Kaya iniwan ni David doon, sa harap ng kaban ng tipan ni Yahweh, si Asaf at ang mga kapatid niya upang maglingkod sa harap ng kaban nang palagian, ayon sa kinakailangan sa bawat araw.[a]
  rationale: Pinalitan ang “tungkulin” ng “kinakailangan” upang hindi masyadong paliitin ang saklaw ng Hebreong idyoma. Ginawang “nang palagian” ang pag-render sa תָּמִיד upang malinaw na ipahayag ang regular at nagpapatuloy na paglilingkod. Walang pagbabago sa kahulugan, pangalan, banal na pangalan, o footnote anchor.
