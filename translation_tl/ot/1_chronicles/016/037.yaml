  text: וַ/יַּֽעֲזָב שָׁ֗ם לִ/פְנֵי֙ אֲר֣וֹן בְּרִית יְהוָ֔ה לְ/אָסָ֖ף וּ/לְ/אֶחָ֑י/ו לְ/שָׁרֵ֞ת לִ/פְנֵ֧י הָ/אָר֛וֹן תָּמִ֖יד לִ/דְבַר י֥וֹם בְּ/יוֹמֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/037.yaml
  text: So he left Asaph and his brothers there before the ark of the covenant of Yahweh[a], to minister before the ark continually, according to each day's requirement.
translation:
  language: tl
  text: Kaya iniwan ni David doon, sa harap ng kaban ng tipan ni Yahweh, si Asaf at ang mga kapatid niya upang maglingkod sa harap ng kaban nang palagian, ayon sa kinakailangan sa bawat araw.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal na Hebreo, “ayon sa bagay ng isang araw sa araw nito”; maaari ring isalin, “ayon sa kinakailangan sa bawat araw.”
    reason: Pinananatili ang literal na hugis at ang bahagyang kalabuan ng idyomang לִדְבַר יוֹם בְּיוֹמוֹ.
lexical_decisions:
- source_word: וַיַּעֲזָב
  choice: iniwan ni David
  rationale: Karaniwang kahulugan ng עזב ang “iwan.” Nilinaw ang ipinahihiwatig na simuno mula sa konteksto upang maging likas sa Filipino, nang hindi ginagawang mas interpretibo ang pandiwang “itinalaga.”
- source_word: שָׁם
  choice: doon
  rationale: Tuwirang katumbas ng lokatibong pang-abay na tumutukoy sa lugar kung saan sila iniwan.
- source_word: לִפְנֵי אֲרוֹן בְּרִית יְהוָה
  choice: sa harap ng kaban ng tipan ni Yahweh
  rationale: Pinananatili ang spatial at panliturhiyang diwa ng לִפְנֵי at ang buong construct chain. Isinalin ang banal na pangalan bilang “Yahweh.”
- source_word: לְאָסָף וּלְאֶחָיו
  choice: si Asaf at ang mga kapatid niya
  rationale: Ang אֶחָיו ay literal na “mga kapatid niya”; maaari itong tumukoy sa mga kapwa Levita, ngunit pinananatili ng salin ang sadyang malawak na katawagan ng Hebreo.
- source_word: לְשָׁרֵת
  choice: upang ... maglingkod
  rationale: Sa kontekstong panrelihiyon, ang שרת ay tumutukoy sa sagradong paglilingkod. Ang “maglingkod” ay natural at marangal sa modernong Filipino.
- source_word: תָּמִיד
  choice: patuloy
  rationale: Ipinahahayag ang tuloy-tuloy o palagiang kaayusan ng paglilingkod nang natural sa Filipino.
- source_word: לִדְבַר יוֹם בְּיוֹמוֹ
  choice: ayon sa tungkulin sa bawat araw
  rationale: Ipinahahayag ang idiomatikong diwa ng gawaing nararapat o itinakda para sa bawat araw, habang iniiwasan ang napakahilaw na literal na anyo.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tahasang ginagamit ng Hebreo ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal at tipanang pangalan sa halip na palitan ito ng titulo.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “kaban ng tipan,” “maglingkod,” at “tungkulin sa bawat araw” bilang madaling maunawaang mga pariralang angkop sa kontekstong panrelihiyon; pinanatili ang pangalang Asaf at Yahweh.
