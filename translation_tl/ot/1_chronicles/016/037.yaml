    issue: Ang “ayon sa tungkulin sa bawat araw” ay bahagyang nagpapakitid sa לִדְבַר יוֹם בְּיוֹמוֹ.
    rationale: Ang idyoma ay tumutukoy sa bagay o gawaing kinakailangan/nararapat sa takdang araw. Maaaring saklaw nito ang tungkulin, ngunit hindi ito tahasang nililimitahan sa ganoong termino.
