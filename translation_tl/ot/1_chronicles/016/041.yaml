  text: וְ/עִמָּ/הֶם֙ הֵימָ֣ן וִֽ/ידוּת֔וּן וּ/שְׁאָר֙ הַ/בְּרוּרִ֔ים אֲשֶׁ֥ר נִקְּב֖וּ בְּ/שֵׁמ֑וֹת לְ/הֹדוֹת֙ לַֽ/יהוָ֔ה כִּ֥י לְ/עוֹלָ֖ם חַסְדּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/041.yaml
  text: And with them were Heman and Jeduthun and the rest of those chosen, who were designated by name to give thanks to Yahweh, for his steadfast love endures forever.
translation:
  language: tl
  text: Kasama nila sina Heman at Jedutun, at ang natitirang mga pinili, na tinukoy sa pangalan[a] upang magpasalamat kay Yahweh, sapagkat ang kanyang tapat na pag-ibig ay magpakailanman.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “na tahasang pinangalanan” o “na isa-isang tinukoy sa pangalan.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “sapagkat ang kanyang tapat na pag-ibig ay magpakailanman,” isang pormulang paulit-ulit na ginagamit sa pagsamba.
    reason: cultural_note
lexical_decisions:
- source_word: וְעִמָּהֶם
  choice: Kasama nila
  rationale: Likas na pagpapahayag sa Filipino ng pariralang nagpapakilala sa mga taong kasama ng naunang binanggit na pangkat; hindi na kailangang tumbasan nang hiwalay ang ipinahihiwatig na pandiwang “naroon.”
- source_word: הֵימָן וִידוּתוּן
  choice: sina Heman at Jedutun
  rationale: Ginamit ang pantukoy na “sina” para sa dalawang pangalang pantangi at isinalin ang mga pangalan ayon sa karaniwang anyong Filipino.
- source_word: וּשְׁאָר הַבְּרוּרִים
  choice: at ang iba pang mga pinili
  rationale: Ang שְׁאָר ay tumutukoy sa nalalabi o iba pa, at ang pasibong participle na הַבְּרוּרִים ay sa mga taong pinili. Hindi idinagdag ang “mga lalaki” dahil hindi ito tahasang nasa Hebreo.
- source_word: אֲשֶׁר נִקְּבוּ בְּשֵׁמוֹת
  choice: na tinukoy sa pangalan
  rationale: Ipinananatili nito ang diwa na hayagang kinilala o itinalaga ang mga tao sa pamamagitan ng kanilang mga pangalan, nang hindi labis na tinutukoy kung kolektibo o isa-isa ang pagkakabanggit.
- source_word: לְהֹדוֹת
  choice: upang magpasalamat
  rationale: Sa kontekstong liturhikal, ang Hiphil ng ידה ay tumutukoy sa pagpapasalamat o pagpupuri; ang “magpasalamat” ay angkop sa kasunod na pormulang liturhikal.
- source_word: לַיהוָה
  choice: kay Yahweh
  rationale: Tuwirang isinalin ang banal na pangalang יהוה bilang “Yahweh”; ang “kay” ang likas na panandang Filipino para sa personal na pangalan.
- source_word: כִּי לְעוֹלָם חַסְדּוֹ
  choice: sapagkat ang kanyang tapat na pag-ibig ay magpakailanman
  rationale: Ang כִּי ay nagpapakilala sa dahilan o nilalaman ng pasasalamat. Ang חֶסֶד ay isinaling “tapat na pag-ibig” upang maipahayag ang matatag at mapagkakatiwalaang pag-ibig, at ang לְעוֹלָם ay “magpakailanman.”
theological_decisions:
- issue: Paglalarawan sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON / Jehova
  rationale: Pangalan mismo ng Diyos ang ginagamit sa tekstong Hebreo; pinananatili ng “Yahweh” ang katangian nito bilang personal na banal na pangalan nang hindi nagpapasok ng denominasyonal na katawagan.
- issue: Saklaw ng חֶסֶד
  choice: tapat na pag-ibig
  alternative: awa / kagandahang-loob / pag-ibig na tipan
  rationale: Sinasalamin ng “tapat na pag-ibig” ang katatagan at ugnayang bigat ng salita nang hindi nililimitahan ito sa awa lamang o tahasang idinaragdag ang salitang “tipan,” na wala sa parirala.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang liturhikal na himig at ang maikli ngunit mabigat na pahayag tungkol sa חֶסֶד. Ginamit ang “Jedutun,” na angkop sa karaniwang pagbaybay at pagbigkas sa Filipino.
