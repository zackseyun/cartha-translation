  verdict: revise
  source_fidelity: Ang “iba pang mga pinili” ay maaaring mangahulugang mga karagdagang pinili, samantalang ang שְׁאָר ay mas tiyak na “nalalabi” o “natitira.” Ang “natitirang mga pinili” ang mas tapat na naghahatid ng kahulugang ito. Ang natitirang bahagi ng salin ay wastong tumutugon sa Hebreo, kabilang ang pagtukoy sa mga tao sa pangalan, ang layuning magpasalamat, at ang liturhikal na pahayag tungkol sa tapat na pag-ibig ni Yahweh.
  naturalness: Likas at marangal ang daloy sa makabagong Filipino. Ang “Kasama nila sina …” ay katanggap-tanggap na paraan upang ipahayag ang pambungad na pariralang Hebreo. Ang pagpapalit sa “natitirang” ay parehong mas tumpak at natural sa kontekstong ito.
  terminology: Wasto ang “Yahweh” para sa יהוה, “magpasalamat” para sa לְהֹדוֹת sa kontekstong pagsamba, at “tapat na pag-ibig” bilang maingat na salin ng חֶסֶד. Ang mga pangalang Heman at Jedutun ay pinanatili nang pare-pareho.
