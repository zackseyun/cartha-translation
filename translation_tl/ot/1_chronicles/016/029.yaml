  text: הָב֥וּ לַ/יהוָ֖ה כְּב֣וֹד שְׁמ֑/וֹ שְׂא֤וּ מִנְחָה֙ וּ/בֹ֣אוּ לְ/פָנָ֔י/ו הִשְׁתַּחֲו֥וּ לַ/יהוָ֖ה בְּ/הַדְרַת קֹֽדֶשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/029.yaml
  text: Ascribe to Yahweh the glory due his name; bring an offering and come before him[a]. Bow down to Yahweh in holy splendor.
translation:
  language: tl
  text: Iukol ninyo kay Yahweh ang kaluwalhatiang nararapat sa kanyang pangalan. Magdala kayo ng handog at humarap sa kanya. Yumukod kayo kay Yahweh sa banal na karilagan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa karilagan ng kabanalan”; maaari ring “nakasuot ng banal na kasuotan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הָבוּ
  choice: Ibigay ninyo
  rationale: Pinananatili nito ang pangunahing diwa ng pandiwa na ‘magbigay,’ habang sa kontekstong liturhiko ay nauunawaang pagkilala at pag-uukol ng karangalan.
- source_word: לַיהוָה
  choice: kay Yahweh
  rationale: Tuwirang isinasalin ang pangalang tipan na יהוה bilang Yahweh.
- source_word: כְּבוֹד שְׁמוֹ
  choice: ang kaluwalhatiang nararapat sa kanyang pangalan
  rationale: Ipinahahayag ang idyomatikong diwa na ang kaluwalhatian ay ukol o nararapat sa kanyang pangalan, sa likas na modernong Tagalog.
- source_word: שְׂאוּ מִנְחָה
  choice: Magdala kayo ng handog
  rationale: Kasama ng מִנְחָה, ang literal na ‘buhatin/dalhin’ ay tumutukoy sa pagdadala ng handog; hindi tinutukoy nang labis ang uri nito.
- source_word: וּבֹאוּ לְפָנָיו
  choice: at lumapit sa kanyang harapan
  rationale: Inihahatid ang larawan ng paglapit sa presensiya ng Diyos sa pagsamba, habang pinananatili ang spatial na ‘sa kanyang harapan.’
- source_word: הִשְׁתַּחֲווּ
  choice: Yumukod kayo
  rationale: Pinananatili ang pisikal na kilos ng pagyukod bilang pagpapakumbaba at pagsamba, sa halip na gawing pangkalahatang ‘sumamba’ lamang.
- source_word: בְּהַדְרַת קֹדֶשׁ
  choice: sa banal na karilagan
  rationale: Pinananatili ang masining at siksik na parirala ng Hebreo nang hindi ipinipilit kung ito ay karilagan ng kabanalan o banal na kasuotan.
theological_decisions:
- issue: Pagsasalin sa pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Pinananatili ang personal na pangalang tipan sa tekstong Hebreo sa halip na palitan ito ng titulo.
- issue: Kahulugan ng בְּהַדְרַת קֹדֶשׁ
  choice: sa banal na karilagan
  alternative: sa karilagan ng kabanalan; nakasuot ng banal na kasuotan
  rationale: Ang parirala ay maaaring tumukoy sa maringal na kabanalan o sa banal na gayak/kasuotan. Pinananatili sa pangunahing teksto ang makatang kalabuan at inilalagay sa talababa ang mga posibleng pagbasa.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at angkop sa panawagan sa sama-samang pagsamba. Ginamit ang maramihang ‘ninyo/kayo’ upang ipakita ang mga pandiwang pautos na maramihan sa Hebreo; iniwasan ang sobrang teknikal o makalumang pananalita.
