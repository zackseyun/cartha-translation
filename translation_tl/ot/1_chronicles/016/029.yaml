revisions:
- from: Ibigay ninyo kay Yahweh ang kaluwalhatiang nararapat sa kanyang pangalan. Magdala kayo ng handog at lumapit sa kanyang harapan. Yumukod kayo kay Yahweh sa banal na karilagan.[a]
  to: Iukol ninyo kay Yahweh ang kaluwalhatiang nararapat sa kanyang pangalan. Magdala kayo ng handog at humarap sa kanya. Yumukod kayo kay Yahweh sa banal na karilagan.[a]
  rationale: Pinahusay ang idiomatikong Tagalog sa unang panawagan at sa pariralang tumutukoy sa pagharap sa Diyos, nang hindi binabago ang kahulugan o ang maramihang utos sa Hebreo. Pinanatili ang makatang kalabuan ng “sa banal na karilagan” at ang mga alternatibo nito sa talababa.
