  text: זִכְר֗וּ נִפְלְאֹתָי/ו֙ אֲשֶׁ֣ר עָשָׂ֔ה מֹפְתָ֖י/ו וּ/מִשְׁפְּטֵי פִֽי/הוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/012.yaml
  text: Remember his wondrous deeds that he has done[a], his signs[c][b], and the judgments of his mouth.
translation:
  language: tl
  text: Alalahanin ninyo ang mga kamangha-manghang gawa na ginawa niya[a], ang kanyang mga tanda[b], at ang mga hatol mula sa kanyang bibig[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang kanyang mga kababalaghan.”
    reason: lexical_alternative
  - marker: b
    text: O “ang kanyang mga pambihirang palatandaan.”
    reason: lexical_alternative
  - marker: c
    text: O “ang mga tuntunin” o “mga pasiya na binigkas niya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: זִכְרוּ
  choice: Alalahanin ninyo
  rationale: Ang maramihang pautos ng זכר ay nananawagan sa mga tagapakinig na aktibong isaisip ang ginawa ng Diyos. Likas at malinaw sa makabagong Filipino ang “Alalahanin ninyo.”
- source_word: נִפְלְאֹתָיו אֲשֶׁר עָשָׂה
  choice: ang mga kamangha-manghang gawa na ginawa niya
  rationale: Ipinahahayag ng נִפְלְאוֹת ang pambihirang mga gawa na pumupukaw ng paghanga, at pinananatili ng sugnay na “na ginawa niya” ang אֲשֶׁר עָשָׂה.
- source_word: מֹפְתָיו
  choice: ang kanyang mga tanda
  rationale: Ang מוֹפֵת ay tumutukoy sa tanda o pambihirang pangyayaring nagpapakita ng kapangyarihan ng Diyos. Hindi ito labis na tinutukoy bilang “himala,” at mas karaniwan kaysa “pangitain” o “palatandaang nagbababala.”
- source_word: וּמִשְׁפְּטֵי פִיהוּ
  choice: at ang mga hatol mula sa kanyang bibig
  rationale: Maaaring mangahulugan ang מִשְׁפָּטִים ng mga hatol, tuntunin, o pasiya. Pinananatili ng “mula sa kanyang bibig” ang matingkad na larawang Hebreo at ang diwang ang mga ito ay kanyang binigkas.
theological_decisions:
- issue: Pagkakaiba ng mga katawagan para sa mga gawa ng Diyos sa paralelismo
  choice: Pinag-iba ang נִפְלְאוֹת bilang “mga kamangha-manghang gawa” at מֹפְתִים bilang “mga tanda.”
  alternative: “mga kababalaghan” at “mga himala,” o “mga kahanga-hangang gawa” at “mga palatandaan”
  rationale: Magkaugnay ngunit magkaiba ang dalawang salitang Hebreo. Ang magkaibang salin ay nagpapanatili sa tekstura ng paralelismo nang hindi pinag-iisa ang kanilang saklaw ng kahulugan.
- issue: Saklaw ng מִשְׁפְּטִים
  choice: mga hatol
  alternative: mga tuntunin o mga pasiya
  rationale: Pinananatili ng “mga hatol” ang aspektong panghukuman, habang inilalahad sa talababa ang lehitimong saklaw na tumutukoy rin sa mga tuntunin o pasiya.
translation_notes:
  register: Makabagong Filipino na marangal at madaling maunawaan. Ginamit ang maramihang “ninyo” upang mapanatili ang bilang ng pautos. Pinanatili ang patulang pagkahanay ng tatlong bagay na dapat alalahanin at ang larawan ng mga salitang nagmumula sa bibig ng Diyos.
