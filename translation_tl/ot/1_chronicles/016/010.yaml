  yaml_path: translation/ot/1_chronicles/016/010.yaml
  text: Boast in his holy name[a]; let the hearts of those who seek Yahweh rejoice.
translation:
  language: tl
  text: Ipagmalaki ninyo ang kanyang banal na pangalan; magalak ang puso ng mga humahanap kay Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: “YHWH,” ang banal na pangalan ng Diyos, na tradisyonal na isinasaling “ang PANGINOON.”'
    reason: alternative_reading
lexical_decisions:
- source_word: הִתְהַלְלוּ
  choice: Ipagmalaki ninyo
  rationale: Ang Hitpael na pautos na maramihan ng הלל ay nangangahulugang magbunyi o magmalaki dahil sa isang tao o bagay. Likas sa modernong Tagalog ang “ipagmalaki,” at malinaw nitong pinananatili ang lakas ng pautos.
- source_word: בְּשֵׁם קָדְשׁוֹ
  choice: ang kanyang banal na pangalan
  rationale: Sa kontekstong ito, ang בְּ ay tumutukoy sa bagay o batayan ng pagmamalaki. Ang “banal na pangalan” ay tumpak, marangal, at likas na parirala sa Tagalog.
- source_word: יִשְׂמַח לֵב
  choice: magalak ang puso
  rationale: 'Bagaman anyong imperfect ang pandiwa, may diwang jussive ito sa patulang panawagan: “magalak.” Pinananatili ng “ang puso” ang kolektibong isahan ng Hebreo bilang sagisag ng kalooban o panloob na pagkatao.'
- source_word: מְבַקְשֵׁי
  choice: mga humahanap
  rationale: Ang substantibong participle ay naglalarawan sa mga taong patuloy na naghahanap o nagsisikap lumapit. Ang “mga humahanap” ay malinaw at hindi nagdaragdag ng kahulugang wala sa teksto.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin ang Tetragrammaton bilang personal na pangalang “Yahweh,” sa halip na palitan ito ng titulong “PANGINOON.”
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang ginagamit ng tekstong Hebreo ang Tetragrammaton. Pinananatili ng “Yahweh” ang katangian nito bilang personal na pangalan nang hindi ito pinapalitan ng isang titulo.
- issue: Kahulugan ng paghahanap kay Yahweh
  choice: mga humahanap kay Yahweh
  alternative: mga sumasamba kay Yahweh; mga nagtitiwala kay Yahweh
  rationale: Pinananatili ang malawak na kahulugan ng בקשׁ at hindi ito nililimitahan sa isang partikular na gawaing panrelihiyon o teolohikal na paliwanag.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “ipagmalaki” para sa matibay ngunit likas na pautos, at pinanatili ang kolektibong “puso” ng Hebreo sa halip na gawing “mga puso.”
