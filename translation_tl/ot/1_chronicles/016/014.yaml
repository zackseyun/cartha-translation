  text: ה֚וּא יְהוָ֣ה אֱלֹהֵ֔י/נוּ בְּ/כָל הָ/אָ֖רֶץ מִשְׁפָּטָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/014.yaml
  text: He is Yahweh our God[b][a]; his judgments are in all the earth.
translation:
  language: tl
  text: Siya si Yahweh[b], ang ating Diyos; ang kanyang mga hatol ay nasa buong daigdig.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa buong lupain,” kung ang אֶרֶץ ay inuunawa sa mas lokal na diwa. Mas pinili rito ang “daigdig” dahil binibigyang-diin ng konteksto ang pandaigdig na paghahari ni Yahweh.
    reason: lexical_alternative
  - marker: b
    text: Ang banal na pangalan sa Hebreo ay YHWH, na kinaugaliang isalin na “ang PANGINOON.”
    reason: alternative_reading
lexical_decisions:
- source_word: הוּא
  choice: Siya si
  rationale: Ang nagsasariling panghalip ay may diin at simuno ng sugnay na walang hayag na pandiwa; likas sa Tagalog ang “Siya si” bago ang pangalang pantangi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang banal na YHWH sa halip na palitan ito ng titulong “PANGINOON.”
- source_word: אֱלֹהֵינוּ
  choice: ating Diyos
  rationale: Bagaman maramihan ang anyong morpolohikal ng אֱלֹהִים, malinaw na tumutukoy ito rito sa iisang Diyos ng Israel; ang hulaping unang panauhang maramihan ay isinaling “ating.”
- source_word: בְּכָל הָאָרֶץ
  choice: nasa buong daigdig
  rationale: Ang בְּכָל ay nagsasaad ng saklaw sa kabuuan, at ang “daigdig” ay angkop sa pandaigdig na saklaw ng konteksto, habang kinikilala sa talababa ang posibleng lokal na diwa.
- source_word: מִשְׁפָּטָיו
  choice: ang kanyang mga hatol
  rationale: Pinananatili ng “mga hatol” ang malawak na diwa ng מִשְׁפָּט bilang mga pasiya o gawa ng makatarungang paghatol, nang hindi ito nililimitahan sa mga tuntunin o sa abstraktong katarungan lamang.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Tuwirang ginagamit ng tekstong Hebreo ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng titulo.
- issue: Saklaw ng הָאָרֶץ
  choice: daigdig
  alternative: lupain
  rationale: Mas naaayon ang pandaigdig na diwa sa malawak na pahayag ng pagpupuri sa konteksto, ngunit tunay na posible rin sa leksikon ang mas lokal na “lupain,” kaya inilagay ito sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “ating Diyos” bilang likas na inklusibong pahayag at ang “mga hatol” upang mapanatili ang lawak at bigat ng terminong Hebreo.
