  text: which he made with Abraham[a], and his oath to Isaac—
translation:
  language: tl
  text: 'na nakipagtipan siya kay Abraham[a],


    at ang kanyang sumpa kay Isaac—'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “na pinutol niya kasama ni Abraham”; isang Hebreong idyoma ito na nangangahulugang “nakipagtipan siya kay Abraham.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר
  choice: na
  rationale: Pang-ugnay na panumbalik sa “tipan” sa naunang talata; natural sa Filipino ang “na” sa pagpapatuloy ng sugnay.
- source_word: כָּרַת
  choice: ginawa
  rationale: Literal itong “pinutol,” ngunit bahagi ito ng Hebreong idyomang nangangahulugang gumawa o magtatag ng tipan. Ang “ginawa” ang malinaw at likas na katumbas sa konteksto.
- source_word: אֶת אַבְרָהָם
  choice: kay Abraham
  rationale: Bagaman pananda ng tuwirang layon ang אֶת, hinihingi ng likas na Filipino sa pariralang “gumawa ng tipan” ang “kay” para sa taong kinatipan.
- source_word: וּשְׁבוּעָתוֹ
  choice: at ang kanyang sumpa
  rationale: Pinananatili ang pangngalang “sumpa” at ang panlalaking panghalip na hulapi bilang “kanyang,” kasabay ng paralelismo sa tipan.
- source_word: לְיִצְחָק
  choice: kay Isaac
  rationale: Ipinahihiwatig ng לְ ang pinatutungkulan ng sumpa; “kay Isaac” ang natural na anyo sa Filipino.
theological_decisions:
- issue: Idyoma ng pakikipagtipan sa כָּרַת, na ang ipinahiwatig na layon ay ang “tipan” sa naunang talata
  choice: na ginawa niya kay Abraham
  alternative: na pinutol niya kay Abraham
  rationale: Isinasalin ang tunay na kahulugan ng Hebreong idyoma sa halip na ang di-likas na literal na anyo, habang nananatiling malinaw na ang tinutukoy ay ang tipan sa naunang talata.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang anyong putol na sugnay at ang gitling sa dulo dahil nagpapatuloy ito mula sa naunang talata at tungo sa kasunod na talata.
