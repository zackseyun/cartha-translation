base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/002.yaml
  text: When David finished offering up the burnt offering and the peace offerings[a], he blessed the people in the name of Yahweh.
translation:
  language: tl
  text: Nang matapos ni David ang paghahandog ng handog na sinusunog at ng mga handog para sa kapayapaan[a], binasbasan niya ang bayan sa pangalan ni Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga handog para sa pakikisama” o “mga handog para sa kapakanan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְכַל
  choice: Nang matapos
  rationale: Ipinahahayag ng anyong pandiwa ang pagkumpleto at inuugnay sa sumunod na kilos; natural sa salaysay na Tagalog ang “Nang matapos.”
- source_word: מֵהַעֲלוֹת
  choice: sa paghahandog
  rationale: Ang מִן kasunod ng כלה at ang infinitive ng עלה ay bumubuo ng diwang “matapos sa paghahandog”; hindi kailangang ulitin ang ideya ng pag-aakyat dahil malinaw na sakripisyo ang konteksto.
- source_word: הָעֹלָה
  choice: ang handog na sinusunog
  rationale: Ito ang karaniwan at malinaw na katawagan sa handog na lubusang sinusunog, na nauunawaan ng modernong mambabasa.
- source_word: וְהַשְּׁלָמִים
  choice: at ng mga handog para sa kapayapaan
  rationale: Ang שְׁלָמִים ay maramihan at maaaring tumukoy sa kapayapaan, kagalingan, o pakikisama; pinananatili ng pangunahing salin ang kinikilalang kategoryang pansakripisyo.
- source_word: וַיְבָרֶךְ
  choice: binasbasan niya
  rationale: Tumpak at likas na salin ng ברך sa konteksto ng pagbigkas ng pagpapala sa bayan.
- source_word: אֶת־הָעָם
  choice: ang bayan
  rationale: Walang tahasang “lahat” sa Hebreo; ang “bayan” ay angkop sa Israel bilang sambayanan.
- source_word: בְּשֵׁם יְהוָה
  choice: sa pangalan ni Yahweh
  rationale: Direktang pinananatili ang pariralang “sa pangalan” at ang personal na banal na pangalang יהוה.
theological_decisions:
- issue: Kahulugan ng שְׁלָמִים
  choice: mga handog para sa kapayapaan
  alternative: mga handog para sa pakikisama; mga handog para sa kagalingan
  rationale: Malawak ang saklaw ng terminong Hebreo—kapayapaan, kagalingan, at pakikisama—kaya pinili ang kinikilalang pangunahing katawagan at inilagay sa talababa ang mga lehitimong alternatibo.
- issue: Paglalahad sa pangalang יהוה
  choice: Yahweh
  alternative: Jehovah
  rationale: Personal na pangalan ang tahasang nasa Hebreo; pinananatili ito bilang “Yahweh” sa halip na palitan ng isang titulo.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “handog na sinusunog” para sa malinaw na katawagang pansakripisyo at “bayan” para sa kolektibong Israel. Ang marker na [a] ay inilagay kaagad pagkatapos ng terminong may mga lehitimong alternatibong salin.
