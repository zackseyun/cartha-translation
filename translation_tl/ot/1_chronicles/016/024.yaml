  source_fidelity: Tapat ang salin sa pautos na pangmaramihan, sa dalawang magkahanay na pahayag, at sa mga panghalip na tumutukoy sa Diyos. Gayunman, ang “sa gitna ng” ay masyadong kongkretong panglokasyon para sa pangkaraniwang saklaw na “among” ng בְּ sa talatang ito. Ang “sa mga” ay mas likas at sapat na sumasaklaw sa pagpapahayag sa/sa hanay ng mga bansa at mamamayan.
  naturalness: Marangal at malinaw ang pangkalahatang register. Mas natural at mas matipid sa modernong Filipino ang “sa mga bansa” at “sa lahat ng mamamayan” kaysa sa paulit-ulit na “sa gitna ng.” Ang “mamamayan” ay mas malinaw na katapat ng “peoples” kaysa “mga bayan,” na maaari ring mangahulugang mga pamayanan o bayan/town.
  terminology: 'Pinanatili ang “kaluwalhatian” para sa כָּבוֹד at “mga kamangha-manghang gawa” para sa נִפְלְאֹתָיו. Pinanatili rin ang pagkakaiba sa paralelismo: “mga bansa” para sa גּוֹיִם at “mamamayan” para sa עַמִּים, nang hindi ipinapasok ang huling-teknikal na kahulugang “mga Gentil.”'
