translation:
  language: tl
  text: Ipahayag ninyo sa mga bansa ang kanyang kaluwalhatian, at sa lahat ng mamamayan ang kanyang mga kamangha-manghang gawa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: סַפְּרוּ
  choice: Ipahayag ninyo
  rationale: Ang pangmaramihang pautos ng ספר ay nananawagan ng hayag na pagsasalaysay o pagpapahayag. Likas at marangal sa modernong Filipino ang “Ipahayag ninyo” at pinananatili nito ang pampublikong diwa.
- source_word: בַגּוֹיִם
  choice: sa gitna ng mga bansa
  rationale: Ang גּוֹיִם ay tumutukoy rito sa mga bansa o sambayanan sa malawak na kahulugan. Ang “sa gitna ng” ay malinaw na kumakatawan sa ב bilang saklaw o lugar ng pagpapahayag.
- source_word: כְּבוֹדוֹ
  choice: ang kanyang kaluwalhatian
  rationale: Ang כָּבוֹד ay nagpapahiwatig ng dangal, bigat, at kaningningang nahahayag; “kaluwalhatian” ang kinagawiang salitang Filipino na nagpapanatili sa lawak ng kahulugan nito.
- source_word: בְּכָל־הָעַמִּים
  choice: sa gitna ng lahat ng mga bayan
  rationale: Pinili ang “mga bayan” para maipakita ang leksikal na pagkakaiba ng עַמִּים sa naunang גּוֹיִם, habang pinananatili ang paralelismo at ang kahulugang tumutukoy sa mga pangkat ng tao.
- source_word: נִפְלְאֹתָיו
  choice: ang kanyang mga kamangha-manghang gawa
  rationale: Ang נִפְלָאוֹת ay tumutukoy sa mga pambihirang kilos na pumupukaw ng paghanga. Nililinaw ng “mga ... gawa” na mga ginawa, hindi lamang abstraktong kababalaghan, ang tinutukoy.
theological_decisions:
- issue: Tinutukoy ng mga hulaping panghalip na “kanyang”
  choice: Pinanatili ang panghalip na “kanyang”; sa konteksto, tumutukoy ito sa PANGINOON, ang Diyos ng Israel.
  alternative: Ulitin ang tahasang pangalang “PANGINOON” sa talata.
  rationale: Panghalip ang nasa tekstong Hebreo, at malinaw na ang PANGINOON ang tinutukoy sa agarang konteksto. Hindi kailangang gawing tahasan sa salin ang pangalang hindi inuulit sa mismong talata.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang dalawang magkahanay na parirala at ang pagkakaiba ng “mga bansa” at “mga bayan,” nang hindi nagdaragdag ng teknikal o denominasyonal na pagpapakahulugan.
