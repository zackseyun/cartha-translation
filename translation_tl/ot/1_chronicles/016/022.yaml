  source_fidelity: Tapat ang salin sa dalawang magkakatulad na pagbabawal sa Hebreo. Ang “Huwag ninyong galawin” ay angkop para sa תִּגְּעוּ at hindi nito labis na itinatakda ang uri ng mapaminsalang pakikialam; ang “huwag ninyong saktan” ay wastong katumbas ng תָּרֵעוּ. Napananatili ang maramihang mga anyo at ang hulaping “ko” sa “mga pinahiran ko” at “mga propeta ko.”
