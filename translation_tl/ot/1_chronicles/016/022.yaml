base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/022.yaml
  text: Do not touch my anointed ones[a], and do not harm my prophets.
translation:
  language: tl
  text: “Huwag ninyong galawin ang mga pinahiran ko[a], at huwag ninyong saktan ang mga propeta ko.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “mga pinahiran ko.” Ang salitang Hebreo ay kaugnay ng “Mesiyas,” ngunit dito ay mas malawak itong tumutukoy sa mga pinahiran ng Diyos, hindi partikular sa Mesiyas.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּגְּעוּ
  choice: galawin
  rationale: Tuwirang ipinapahayag ng נגע ang paghipo o paggalaw. Sa kontekstong ito ng pagbabawal at sa kaagapay na ‘saktan,’ ipinahihiwatig nito ang mapaminsalang pakikialam nang hindi nililimitahan sa pananakit lamang.
- source_word: בִּמְשִׁיחָי
  choice: ang mga pinahiran ko
  rationale: Ang מָשִׁיחַ ay ‘taong pinahiran,’ at malinaw na maramihan ang anyong may hulaping unang panauhan. Ang ‘mga pinahiran ko’ ay likas sa Filipino at hindi nagpapahiwatig na ang tinutukoy ay ang iisang Mesiyas.
- source_word: וּבִנְבִיאַי
  choice: ang mga propeta ko
  rationale: Tuwiran nitong inililipat ang maramihang נָבִיא na may hulaping ‘ko.’
- source_word: תָּרֵעוּ
  choice: saktan
  rationale: Sa anyong Hifil, ipinagbabawal ng רעע ang paggawa ng masama o pinsala sa isang tao. Ang ‘saktan’ ay maikli, natural, at sapat ang lawak para sa pisikal o iba pang kapinsalaan.
- source_word: אַל
  choice: Huwag
  rationale: Ang אַל kasunod ng di-ganap na pandiwa ay karaniwang pananda ng tuwirang pagbabawal; natural itong isinasalin na ‘huwag’ sa Filipino.
theological_decisions:
- issue: Paglilipat sa מְשִׁיחָי sa isang maramihan at hindi partikular na mesiyanikong konteksto
  choice: mga pinahiran ko
  alternative: mga mesiyas ko; pinahiran ko
  rationale: Bagaman kaugnay ang salitang Hebreo sa titulong ‘Mesiyas,’ maramihan ito rito at tumutukoy nang mas malawak sa mga taong pinahiran ng Diyos. Pinananatili ng salin ang maramihan at iniiwasang magpasok ng pagiging tiyak kay Mesiyas na hindi ipinahahayag ng talata.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang magkatugmang dalawang pagbabawal at ang maramihang kahulugan ng mga tinutukoy.
