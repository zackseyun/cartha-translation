source:
  edition: WLC
  text: לֹא הִנִּ֤יחַ לְ/אִישׁ֙ לְ/עָשְׁקָ֔/ם וַ/יּ֥וֹכַח עֲלֵי/הֶ֖ם מְלָכִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/021.yaml
  text: He allowed no man to oppress them[a], and he rebuked kings on their account,
translation:
  language: tl
  text: Hindi niya pinahintulutan ang sinuman na apihin sila, at sinaway niya ang mga hari alang-alang sa kanila.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “dahil sa kanila” o “para sa kanilang kapakanan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנִּיחַ
  choice: pinahintulutan
  rationale: Sa causative stem na may לֹא at infinitive, nangangahulugan itong ‘pahintulutan’ o ‘payagan.’ Ang ‘hindi niya pinahintulutan’ ay likas at malinaw sa modernong Filipino.
- source_word: אִישׁ
  choice: ang sinuman
  rationale: Bagaman literal na ‘lalaki’ o ‘tao’ ang pangngalang panlalaking isahan, generic ang gamit nito rito. Likas na ipinahahayag ng ‘ang sinuman’ ang diwang walang taong pinayagan.
- source_word: לְעָשְׁקָם
  choice: na apihin sila
  rationale: Ang עָשַׁק ay tumutukoy sa pang-aapi, pandaraya, o mapagsamantalang pagmamaltrato. Ang ‘apihin’ ang pinakamaikli at pinakamalawak na angkop sa konteksto.
- source_word: וַיּוֹכַח
  choice: sinaway
  rationale: Ang יכח dito ay nagpapahayag ng matinding pagsaway o pagsita. Dignified at madaling maunawaan ang ‘sinaway’ sa kasalukuyang Filipino.
- source_word: עֲלֵיהֶם
  choice: alang-alang sa kanila
  rationale: Ang עַל na may hulaping panghalip ay maaaring magpahiwatig ng pagkilos dahil sa kanila o para sa kanilang kapakanan. Pinananatili ng ‘alang-alang sa kanila’ ang proteksiyon at referensiyal na diwa.
- source_word: מְלָכִים
  choice: mga hari
  rationale: Tuwirang katumbas ito ng ‘kings’; walang dahilan sa konteksto upang gawing mas pangkalahatang ‘mga pinuno.’
theological_decisions:
- issue: Di-hayag na simuno ng mga pandiwa
  choice: Ginamit ang ‘niya,’ na tumutukoy sa Diyos ayon sa nakapaligid na konteksto.
  alternative: Iwanang hindi tiyak ang simuno.
  rationale: Ipinagpapatuloy ng talata ang paglalarawan sa mapag-ingat na pagkilos ng PANGINOON para sa mga patriyarka. Nangangailangan ang natural na Filipino ng hayag na panghalip, ngunit hindi na dinagdagan ang teolohikal na pahayag.
- issue: Saklaw ng עֲלֵיהֶם
  choice: ‘alang-alang sa kanila’
  alternative: ‘dahil sa kanila’ o ‘para sa kanilang kapakanan’
  rationale: 'May tunay na lawak ang parirala: maaaring tukuyin ang dahilan, kapakanan, o kaugnayan ng pagsaway. Pinili sa teksto ang natural na pahayag at itinabi sa talababa ang mga alternatibo.'
translation_notes:
  register: Modernong Filipino na malinaw, natural, at marangal. Ginamit ang ‘sinuman’ para sa generic na אִישׁ at ‘apihin’ para sa malawak na diwa ng mapagsamantalang pagmamaltrato. Inilagay ang talababa pagkatapos ng buong sugnay na inuunawa nito.
