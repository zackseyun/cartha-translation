  text: אָ֥ז יְרַנְּנ֖וּ עֲצֵ֣י הַ/יָּ֑עַר מִ/לִּ/פְנֵ֣י יְהוָ֔ה כִּי בָ֖א לִ/שְׁפּ֥וֹט אֶת הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/033.yaml
  text: Then the trees of the forest will sing for joy before Yahweh[c][b][a], for he comes to judge the earth.
translation:
  language: tl
  text: Sa gayon, aawit sa galak ang mga puno sa gubat[a] sa harap ni Yahweh, sapagkat dumarating siya[b] upang hatulan ang daigdig[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sisigaw sa galak.” Ang pandiwang Hebreo ay maaaring tumukoy sa masayang pag-alingawngaw, sa awit man o sigaw.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “darating siya upang hatulan ang daigdig.” Sa kontekstong patula, maaaring ilarawan ng anyong Hebreo ang isang darating na kilos bilang malinaw at tiyak.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “ang lupain” kung lokal ang tinutukoy; pinapaboran dito ng mas malawak na konteksto ng papuri ng sangnilikha ang “daigdig.”
    reason: alternative_reading
lexical_decisions:
- source_word: אָז
  choice: Kung magkagayon
  rationale: Ipinakikita ang kasunod na tagpo o bunga sa daloy ng awit; natural at marangal sa Filipino.
- source_word: יְרַנְּנוּ
  choice: aawit sa galak
  rationale: Ang Piel ng רנן ay tumutukoy sa masayang pag-alingawngaw na maaaring awit o sigaw; pinananatili ng salin ang makatang personipikasyon.
- source_word: עֲצֵי הַיָּעַר
  choice: ang mga puno sa gubat
  rationale: Tuwirang inililipat ang pariralang konstrukto sa natural na Filipino.
- source_word: מִלִּפְנֵי
  choice: sa harap ni
  rationale: Likas na Filipino para sa pagkilos sa presensiya ni Yahweh nang hindi ipinahihiwatig ang paglayo mula sa kaniya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang banal na nasa tekstong Hebreo sa halip na palitan ito ng titulo.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala ang dahilan ng kagalakan ng sangnilikha sa marangal at malinaw na paraan.
- source_word: בָא
  choice: dumarating siya
  rationale: Ang anyong qatal sa makatang konteksto ay maaaring maglarawan ng pagdating bilang nalalapit o tiyak; ang aspektong nagaganap ay nagpapanatili sa masiglang larawan.
- source_word: לִשְׁפּוֹט
  choice: upang hatulan
  rationale: Tuwirang ipinahahayag ang layuning hudisyal ng pagdating, kasama ang diwang pamamahala na taglay ng salitang Hebreo.
- source_word: הָאָרֶץ
  choice: ang buong lupa
  rationale: Sa konteksto ng papuri ng sangnilikha, tumutukoy ito sa daigdig sa malawak na saklaw; ang “buong” ay nililinaw ang kosmikong gamit ngunit hindi ginagawang “mundo,” na maaaring higit na malayang salin.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehova
  rationale: Personal na pangalan ang nasa tekstong Hebreo; pinananatili itong transliterasyon at hindi pinapalitan ng titulo.
- issue: Saklaw ng הָאָרֶץ
  choice: ang buong lupa
  alternative: ang lupain
  rationale: Ang nakapaligid na awit ay naglalarawan sa kagalakan ng sangnilikha, kaya mas malamang ang pandaigdig na saklaw; nananatiling nakatala sa talababa ang posibleng lokal na kahulugan.
- issue: Panahunan o aspekto ng בָא
  choice: dumarating siya
  alternative: darating siya
  rationale: Pinananatili nito ang makatang paglarawan sa tiyak na pagdating bilang kasalukuyang lumalapit, nang hindi ito ginagawang payak na nakaraan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang makatang personipikasyon ng mga puno at ang masiglang pagdating ni Yahweh. Ang lahat ng marker ng talababa ay inilagay sa pangunahing teksto sa dulo ng kaugnay na pangungusap.
