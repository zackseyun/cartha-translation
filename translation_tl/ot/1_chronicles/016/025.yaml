base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/025.yaml
  text: For Yahweh is great and greatly to be praised[a], and he is to be feared above all gods.
translation:
  language: tl
  text: Sapagkat dakila si Yahweh at lubhang dapat purihin; siya ay higit na dapat katakutan kaysa sa lahat ng diyos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikilala nito ang dahilan ng nakapaligid na panawagan sa pagsamba; natural sa Filipino ang “Sapagkat” at pinananatili nito ang paliwanag na ugnayan.
- source_word: גָדוֹל
  choice: dakila
  rationale: Tumutukoy ito sa kadakilaan sa katayuan at kamahalan; mas angkop sa Diyos ang dignidad ng “dakila” kaysa sa pangkalahatang “malaki.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang pinananatili ang personal na pangalan ng Diyos na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: מְהֻלָּל מְאֹד
  choice: lubos na dapat purihin
  rationale: Ang passive participle at pampalakas na מְאֹד ay nagsasaad na siya ay lubhang karapat-dapat tumanggap ng papuri; malinaw at natural itong ipinahahayag ng parirala.
- source_word: וְנוֹרָא הוּא
  choice: siya ay dapat katakutan
  rationale: Pinananatili nito ang diwa ng ירא—takot na may kasamang pagpipitagan at pagkamangha—nang hindi ito pinahihina tungo sa kolokyal na “kahanga-hanga” o nililimitahan sa sindak.
- source_word: עַל כָּל אֱלֹהִים
  choice: nang higit sa lahat ng mga diyos
  rationale: Ipinahahayag ng עַל dito ang paghahambing at kahigitan; ang “mga diyos” ang payak na kahulugan ng plural at umaayon sa konteksto tungkol sa mga diyos ng mga bansa.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Personal na pangalan ang nasa tekstong Hebreo, kaya pinananatili itong Yahweh sa halip na palitan ng titulo.
- issue: Kahulugan ng נוֹרָא kapag tumutukoy sa Diyos
  choice: dapat katakutan
  alternative: kasindak-sindak; kahanga-hanga
  rationale: Pinananatili ng napiling salin ang tensiyon ng takot, pagpipitagan, at pagkamangha. Ang “kasindak-sindak” ay maaaring magpahiwatig lamang ng teror, samantalang ang “kahanga-hanga” ay maaaring maging napakahina.
- issue: Pagkakakilanlan ng אֱלֹהִים sa plural
  choice: mga diyos
  alternative: mga banal na nilalang
  rationale: Hindi tahasang nilulutas ng talata ang ontolohikal na katayuan ng mga ito; ang literal na “mga diyos” ay nagpapanatili sa pahayag at sa polemikong paghahambing ng konteksto.
translation_notes:
  register: Makabagong Filipino na marangal at madaling maunawaan. Ginamit ang “dakila,” “lubos na dapat purihin,” at “dapat katakutan” upang mapanatili ang maikli, patula, at teolohikal na bigat ng Hebreo nang hindi nagdaragdag ng paliwanag sa mismong talata.
