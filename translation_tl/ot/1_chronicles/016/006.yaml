base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/006.yaml
  text: And Benaiah and Jahaziel the priests were continually with the trumpets before the ark of the covenant of God[a].
translation:
  language: tl
  text: At sina Benaias at Jahaziel, na mga pari, ay palaging nasa harap ng kaban ng tipan ng Diyos kasama ang mga trumpeta.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Palagi silang humihihip ng mga trumpeta sa harap ng kaban ng tipan ng Diyos.” Walang tahasang pandiwa sa Hebreo, bagaman malamang na ito ang ipinahihiwatig.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְנָיָהוּ
  choice: At si Benaias
  rationale: Isinalin ang pang-ugnay bilang “At” at ginamit ang nakaugaliang anyong Tagalog na “Benaias” para sa pangalang Hebreo.
- source_word: וְ/יַחֲזִיאֵל
  choice: at Jahaziel
  rationale: Pinanatili bilang transliterasyon ang pangalang pantangi; ang “Jahaziel” ay malapit sa anyong Hebreo at madaling makilala.
- source_word: הַ/כֹּהֲנִים
  choice: na mga pari
  rationale: Tumutukoy ito sa tungkulin nina Benaias at Jahaziel; natural sa Tagalog ang hulaping pariralang “na mga pari.”
- source_word: בַּ/חֲצֹצְרוֹת
  choice: taglay ang mga trumpeta
  rationale: Ang pangngalan ay tumutukoy sa mga trumpeta, hindi sa pangkalahatang mga tambuli. Ipinahahayag ng “taglay” ang pagkakaroon o paggamit ng instrumento nang hindi tahasang idinaragdag sa pangunahing teksto ang pandiwang “hinihipan,” na wala sa Hebreo.
- source_word: תָּמִיד
  choice: palaging
  rationale: Ipinahahayag nito ang tuloy-tuloy o regular na pagganap; natural at malinaw ang “palaging” sa modernong Tagalog.
- source_word: לִ/פְנֵי
  choice: sa harap ng
  rationale: Pinananatili nito ang pisikal at pansambang diwa ng pagkakalagay sa harap ng kaban.
- source_word: אֲרוֹן בְּרִית
  choice: kaban ng tipan
  rationale: Tumpak at nakaugaliang salin ng construct chain, at malinaw sa ordinaryong mambabasa.
- source_word: הָ/אֱלֹהִים
  choice: ng Diyos
  rationale: Ang tiyak na anyo rito ay tumutukoy sa Diyos ng Israel; hindi kailangan ang dagdag na pagpapaliwanag.
theological_decisions:
- issue: Kung tahasang sasabihing hinihipan ng mga pari ang mga trumpeta
  choice: Hindi idinagdag ang “hinihipan” sa pangunahing teksto; ginamit ang “palaging naroon, taglay ang mga trumpeta.”
  alternative: “palaging hinihipan ang mga trumpeta sa harap ng kaban ng tipan ng Diyos”
  rationale: Walang tahasang pandiwa para sa “humihip” sa tekstong Hebreo. Malamang na iyon ang ipinahihiwatig ng konteksto, ngunit pinananatili sa pangunahing teksto ang tunay na kakulangan ng pandiwa at inilalahad sa talababa ang malamang na kahulugan.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ang “naroon, taglay ang mga trumpeta” ay sadyang nagpapanatili sa pagkaelliptical ng Hebreo habang nananatiling natural sa Tagalog; ang mas tahasang kilos ay inilagay sa talababa.
