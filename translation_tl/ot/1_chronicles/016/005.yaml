base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/005.yaml
  text: Asaph was the chief[a], and second to him was Zechariah; then Jeiel, Shemiramoth, Jehiel, Mattithiah, Eliab, Benaiah, Obed-edom, and Jeiel, with instruments of harps and lyres[b]; and Asaph sounded the cymbals.
translation:
  language: tl
  text: Si Asaf ang pinuno,[a] at si Zacarias ang pangalawa sa kaniya; kasunod sina Jeiel, Semiramot, Jehiel, Matitias, Eliab, Benaias, Obed-edom, at Jeiel, na may mga alpa at lira;[b] at si Asaf ang nagpapatunog ng mga pompiyang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “at si Zacarias ang kaniyang pangalawa.” Ipinahihiwatig ng salitang Hebreo na si Zacarias ang ikalawa sa ranggo pagkatapos ni Asaf.
    reason: lexical_alternative
  - marker: b
    text: 'Dalawang magkaibang instrumentong may kuwerdas ang tinutukoy sa Hebreo: nebalim at kinnorot, na isinalin dito bilang “mga alpa” at “lira.”'
    reason: cultural_note
lexical_decisions:
- source_word: הָרֹאשׁ
  choice: ang pinuno
  rationale: Sa talaan ng mga tauhan, tumutukoy ang רֹאשׁ sa katungkulan o pangunahing ranggo, hindi sa bahagi ng katawan.
- source_word: וּמִשְׁנֵהוּ
  choice: at si Zacarias ang pangalawa sa kaniya
  rationale: Ipinahihiwatig ng panghalip na hulapi ang ikalawang ranggo ni Zacarias kaugnay ni Asaf; malinaw at natural ito sa Tagalog.
- source_word: יְעִיאֵל / וִיעִיאֵל
  choice: Jeiel
  rationale: Iisang anyong Tagalog ng pangalan ang ginamit sa dalawang paglitaw nito, habang pinananatili ang pagkakaiba nito sa pangalang Jehiel sa talata.
- source_word: בִּכְלֵי נְבָלִים וּבְכִנֹּרוֹת
  choice: na tumutugtog ng mga alpa at lira
  rationale: Natural na ipinahahayag sa Tagalog ang gamit ng mga instrumentong may kuwerdas, habang pinananatiling magkaiba ang נֵבֶל at כִּנּוֹר.
- source_word: בַּמְצִלְתַּיִם
  choice: ng mga pompiyang
  rationale: Ang 'pompiyang' ay karaniwan at malinaw na salitang Filipino para sa cymbals; likas sa Tagalog ang pangmaramihang anyo sa kontekstong ito.
- source_word: מַשְׁמִיעַ
  choice: nagpapatunog
  rationale: 'Pinananatili nito ang causative na diwa ng Hiphil: pinatutunog o ipinaparinig ni Asaf ang mga pompiyang.'
