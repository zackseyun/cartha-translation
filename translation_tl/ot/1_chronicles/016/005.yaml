  naturalness: Makabago at malinaw ang mga pangalan at pangungusap. Ang “na may mga alpa at lira” ay higit na tuwirang Tagalog para sa konstruksyong Hebreo at hindi gaanong nagpapalagay kaysa “na tumutugtog.”
  terminology: Ang “pinuno,” “pangalawa sa kaniya,” “alpa,” “lira,” at “mga pompiyang” ay angkop. Pinanatili ang magkaibang mga anyo ng Jeiel at Jehiel, pati ang pare-parehong transliterasyon ng mga pangalan.
