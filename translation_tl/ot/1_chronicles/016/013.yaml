  text: O offspring of Israel his servant[a], sons of Jacob[c][b], his chosen ones.
translation:
  language: tl
  text: 'Kayong mga inapo ni Israel, na kanyang lingkod;

    mga anak ni Jacob, na kanyang mga pinili.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: זֶרַע
  choice: mga lahi
  rationale: Tumutukoy ang kolektibong pangngalan sa mga inapo ni Israel. Likas sa makabagong Tagalog ang “mga lahi” sa ganitong patulang pagtawag, at hindi ito lumilikha ng maling literal na larawan gaya ng “binhi.”
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Karaniwang anyo ng pangalang pantangi sa Tagalog.
- source_word: עַבְדּוֹ
  choice: kanyang lingkod
  rationale: Pinananatili ang panlalaking isahang hulapi at ang tipanang diwa ng paglilingkod sa Diyos; hindi pangunahing binibigyang-diin dito ang kalagayang panlipunan ng isang alipin.
- source_word: בְּנֵי
  choice: mga anak ni
  rationale: Bagaman literal na “mga anak na lalaki,” karaniwang pananalitang Hebreo ito para sa mga inapo o kabilang sa sambahayan ni Jacob. Ang “mga anak ni” ay likas sa Tagalog at hindi di-kinakailangang naglilimita sa mga lalaki lamang.
- source_word: יַעֲקֹב
  choice: Jacob
  rationale: Karaniwang anyo ng pangalan ng patriyarka sa Tagalog.
- source_word: בְּחִירָיו
  choice: kanyang mga pinili
  rationale: Malinaw na ipinahahayag ang maramihang bilang at ang katotohanang sila ay pinili niya, nang hindi dinaragdagan ng mas mabigat na terminong teolohikal.
theological_decisions:
- issue: Tinutukoy ng mga hulaping panlalaking isahan sa “kanyang lingkod” at “kanyang mga pinili”
  choice: Pinanatili ang “kanyang,” na sa konteksto ay tumutukoy sa PANGINOON/Diyos.
  alternative: Maaaring ulitin ang “ng Diyos” o “ng PANGINOON” upang maging ganap na tahasan.
  rationale: Ang Hebreo ay gumagamit ng panghalip, at malinaw sa nakapaligid na konteksto na ang Diyos ang tinutukoy. Pinananatili ng “kanyang” ang anyo at bahagyang di-tahasang katangian ng pinagmulan.
translation_notes:
  register: Makabago, marangal, at patulang Tagalog. Idinagdag ang “Kayong” upang likas na maipahayag ang tuwirang pagtawag na ipinahihiwatig ng Hebreong pariralang walang lantad na pandiwa. Walang talababa dahil sapat na malinaw sa Tagalog ang mga piniling salita.
