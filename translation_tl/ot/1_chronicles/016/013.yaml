    issue: Ang “mga lahi” para sa זֶרַע ay maaaring magpahiwatig ng mga pangkat etniko o mga tribo sa halip na mga inapo/supling.
    rationale: Ang Hebreong זֶרַע ay kolektibong katawagan para sa posterity o descendants. Ang “mga inapo” ang mas tiyak at natural na modernong Tagalog na katumbas.
