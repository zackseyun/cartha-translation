  yaml_path: translation/ot/1_chronicles/016/007.yaml
  text: On that day then David first appointed Asaph and his brothers to give thanks to Yahweh[a].
translation:
  language: tl
  text: Noong araw na iyon, unang inatasan ni David si Asaf at ang mga kapatid ni Asaf na magpasalamat kay Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin ang bahaging ito na “inilagay ni David si Asaf at ang mga kapatid ni Asaf sa pangunguna sa pagpapasalamat kay Yahweh,” o “sa unang pagkakataon ay itinalaga ni David si Asaf at ang mga kapatid ni Asaf upang magpasalamat kay Yahweh.” Idyomatiko ang pariralang Hebreo at maaaring tumukoy sa pagkauna, pamumuno, o pasimulang pagtatatag ng gawaing ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא אָז
  choice: Nang araw na iyon
  rationale: Likas na panandang temporal sa modernong Tagalog; ang pagkakasunod na ipinahihiwatig ng אָז ay naihahatid ng daloy ng pangungusap nang hindi inuulit nang alanganin ang “noon.”
- source_word: נָתַן
  choice: inatasan
  rationale: Bagaman literal na “ibinigay,” tumutukoy rito ang pandiwa sa pagtatalaga ng isang tungkulin. Mas malinaw at natural sa Tagalog ang “inatasan.”
- source_word: בָּרֹאשׁ
  choice: sa unang pagkakataon
  rationale: Ipinahihiwatig sa konteksto ang pasimulang pagtatalaga sa gawaing ito, ngunit nananatiling bukás sa ibang pagbasa ang idyomang Hebreo; kaya inilalahad sa talababa ang mga posibleng kahulugan nito.
- source_word: לְהֹדוֹת
  choice: magpasalamat
  rationale: Sa kontekstong panliturhiya, ang Hiphil infinitive ng ידה ay tumutukoy sa pagpapahayag ng pasasalamat o papuri sa Diyos. “Magpasalamat” ang tuwirang katumbas habang hindi inaalis ang himig ng pagsamba.
- source_word: לַיהוָה
  choice: kay Yahweh
  rationale: Isinasalin ang banal na pangalang יהוה bilang “Yahweh,” anupat pinananatili ang personal na pangalang nasa tekstong Hebreo.
- source_word: בְּיַד אָסָף וְאֶחָיו
  choice: si Asaf at ang mga kapatid niya
  rationale: Ang literal na “sa pamamagitan ng kamay ni” ay idyoma para sa ahensiya o pananagutan. Isinama ito nang natural sa balangkas na “inatasan ... si Asaf at ang mga kapatid niya.”
theological_decisions:
- issue: Paglilipat sa banal na pangalang יהוה
  choice: Yahweh
  alternative: ang PANGINOON
  rationale: Personal na pangalan ang tahasang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang pagkakakilanlang iyon nang hindi ito pinapalitan ng isang titulo.
- issue: Saklaw ng לְהֹדוֹת sa kontekstong pagsamba
  choice: magpasalamat
  alternative: magpuri
  rationale: Maaaring saklawin ng salita kapwa ang pasasalamat at papuri. Pinili ang “magpasalamat” bilang pangunahing diwa rito, ngunit hindi ipinapalagay na walang kasamang papuri ang gawaing ito.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa salaysay. Ginamit ang “inatasan” sa halip na literal na “ibinigay” upang natural na maipahayag ang administratibong diwa, habang pinananatili sa talababa ang tunay na kalabuan ng בָּרֹאשׁ.
