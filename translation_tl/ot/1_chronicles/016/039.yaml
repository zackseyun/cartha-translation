base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/039.yaml
  text: And Zadok the priest and his fellow priests were before the tabernacle of Yahweh at the high place that was in Gibeon,[a]
translation:
  language: tl
  text: At iniwan din niya si Zadok na pari at ang mga kapwa niya pari sa harap ng tabernakulo ni Yahweh, sa mataas na dakong nasa Gibeon.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo: “ang mga kapatid niya, ang mga pari.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵת
  choice: At iniwan din niya
  rationale: Ang waw ay nag-uugnay sa naunang pangungusap, at ang pandiwang 'iniwan' ay likas na ipinagpapatuloy mula sa konteksto ng talata 37; walang tuwirang katumbas sa Tagalog ang direct-object marker na אֵת.
- source_word: צָדוֹק הַכֹּהֵן
  choice: si Zadok na pari
  rationale: Pinananatili ang pangalang pantangi at malinaw na inilalahad ang tungkulin ni Zadok sa natural na Tagalog.
- source_word: וְאֶחָיו הַכֹּהֲנִים
  choice: at ang mga kapwa niya pari
  rationale: Literal itong 'at ang kanyang mga kapatid, ang mga pari,' ngunit sa konteksto ay tumutukoy sa mga kasamahan niya sa paglilingkod bilang pari, hindi kinakailangang mga kapatid sa dugo.
- source_word: לִפְנֵי
  choice: sa harap ng
  rationale: Pinananatili ang karaniwang lokatibong diwa na nasa harapan o presensiya ng santuwaryo.
- source_word: מִשְׁכַּן יְהוָה
  choice: tabernakulo ni Yahweh
  rationale: Ang מִשְׁכָּן ay ang santuwaryong tirahan o tabernakulo; ang 'tabernakulo' ay tiyak at nakikilalang katawagan sa kontekstong ito.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin ang Tetragrammaton bilang pangalang tipan na Yahweh sa halip na palitan ito ng isang titulo.
- source_word: בַּבָּמָה
  choice: sa mataas na dako
  rationale: Ang בָּמָה ay isang mataas na lugar na ginagamit sa pagsamba. Pinananatili ang terminong ito nang hindi awtomatikong nilalagyan ng negatibong kahulugan, sapagkat ang tinutukoy rito ay ang lehitimong lugar ng pagsamba sa Gibeon.
- source_word: אֲשֶׁר בְּגִבְעוֹן
  choice: na nasa Gibeon
  rationale: Natural na Tagalog na tumutukoy sa lokasyon ng mataas na dako.
theological_decisions:
- issue: Pagpapahayag sa יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang ginagamit sa Hebreo ang banal na pangalan; pinananatili itong Yahweh upang hindi mapalitan ng isang titulo.
- issue: Diwa ng אֶחָיו sa konteksto ng mga pari
  choice: mga kapwa niya pari
  alternative: mga kapatid niya, ang mga pari
  rationale: Maaaring literal na mangahulugang 'mga kapatid niya,' ngunit sa administratibo at panambahang konteksto ay natural itong tumukoy sa mga kasamang pari. Inilalagay sa talababa ang literal na anyo upang mapanatili ang leksikal na posibilidad.
- issue: Ipinagpalagay na pandiwa mula sa naunang konteksto
  choice: iniwan din niya
  alternative: at si Zadok na pari... ay nasa harap
  rationale: Walang tahasang pandiwa sa talata; ipinagpapatuloy ng Hebreo ang kilos ng pag-iwan/pagtatalaga mula sa talata 37. Ang 'iniwan din niya' ang malinaw na pagpapatuloy sa Tagalog nang hindi ginagawang simpleng pahayag ng lokasyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang 'tabernakulo' at 'mataas na dako' bilang mga tiyak na terminong panrelihiyon, habang iniwasan ang labis na arkaikong ayos. Ang idinagdag na pandiwang 'iniwan' ay hango sa sintaktikong pagpapatuloy mula sa naunang talata.
