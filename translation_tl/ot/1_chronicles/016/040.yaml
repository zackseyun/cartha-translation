source:
  edition: WLC
  text: לְֽ/הַעֲלוֹת֩ עֹל֨וֹת לַ/יהוָ֜ה עַל מִזְבַּ֧ח הָ/עֹלָ֛ה תָּמִ֖יד לַ/בֹּ֣קֶר וְ/לָ/עָ֑רֶב וּ/לְ/כָל הַ/כָּתוּב֙ בְּ/תוֹרַ֣ת יְהוָ֔ה אֲשֶׁ֥ר צִוָּ֖ה עַל יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/040.yaml
  text: to offer burnt offerings to Yahweh on the altar of burnt offering continually[a], morning and evening, and according to all that is written in the law of Yahweh, which he commanded for Israel.
translation:
  language: tl
  text: upang maghandog nang palagian ng mga handog na sinusunog para kay Yahweh sa altar ng handog na sinusunog, tuwing umaga at gabi, ayon sa lahat ng nakasulat sa Kautusan[a] ni Yahweh na iniutos niya sa Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Tagubilin”; ang Hebreong torah ay maaaring mangahulugang “kautusan” o “tagubilin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לְהַעֲלוֹת
  choice: maghandog
  rationale: Ang Hiphil infinitive ng עלה ay literal na ‘paakyatin,’ ngunit sa kontekstong pansakripisyo ay idyomatikong nangangahulugang maghandog.
- source_word: עֹלוֹת
  choice: mga handog na sinusunog
  rationale: Karaniwang terminong pansakripisyo ito para sa handog na lubusang sinusunog; malinaw at natural ang salin sa modernong Tagalog.
- source_word: לַיהוָה
  choice: para kay Yahweh
  rationale: Ipinahihiwatig ng ל ang pinag-uukulan ng mga handog, at pinananatili ng ‘Yahweh’ ang personal na pangalan sa tekstong Hebreo.
- source_word: מִזְבַּח הָעֹלָה
  choice: altar ng handog na sinusunog
  rationale: Tinutukoy ng pariralang konstrukt ang altar na ginagamit para sa ganitong uri ng handog.
- source_word: תָּמִיד
  choice: palaging
  rationale: Ipinapahayag nito ang regular at tuloy-tuloy na pagsasagawa; nililinaw ng kasunod na ‘tuwing umaga at gabi’ ang takdang ritmo.
- source_word: לַבֹּקֶר וְלָעָרֶב
  choice: tuwing umaga at gabi
  rationale: Natural na Tagalog ito para sa paulit-ulit na pang-araw-araw na iskedyul.
- source_word: וּלְכָל הַכָּתוּב
  choice: ayon sa lahat ng nakasulat
  rationale: Ipinakikita ng ל dito ang pagsunod sa mga nakasulat na tuntunin, hindi lamang ang paksa o layon.
- source_word: בְּתוֹרַת יְהוָה
  choice: sa Kautusan ni Yahweh
  rationale: Sa kontekstong ito, tumutukoy ang תּוֹרָה sa nakasulat na mga tuntuning pansamba; maaaring mangahulugan din itong ‘tagubilin,’ kaya itinala ang alternatibo sa talababa.
- source_word: אֲשֶׁר צִוָּה עַל יִשְׂרָאֵל
  choice: na iniutos niya sa Israel
  rationale: Natural na ipinahahayag nito na ang utos ay ipinataw o ibinigay sa Israel nang hindi ginagawang kahulugan ang Hebreong preposisyon.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Tuwirang ginagamit ng talata ang Tetragrammaton; pinananatili ng ‘Yahweh’ ang personal na pangalang nasa tekstong Hebreo.
- issue: Saklaw ng תּוֹרָה
  choice: Kautusan
  alternative: tagubilin
  rationale: Ang kontekstong kultiko at ang pagtukoy sa ‘lahat ng nakasulat’ ay umaayon sa ‘Kautusan,’ habang kinikilala sa talababa na mas malawak din ang saklaw ng salitang Hebreo.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang karaniwang salitang ‘altar’ at ang malinaw na pariralang ‘handog na sinusunog.’ Pinanatili ang ritmong pangungusap at ang pagsunod sa nakasulat na tuntunin nang hindi dinaragdagan ang teolohikal na detalye.
