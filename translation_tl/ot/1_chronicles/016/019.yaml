  yaml_path: translation/ot/1_chronicles/016/019.yaml
  text: when you were few in number[a], very few, and sojourners in it,
translation:
  language: tl
  text: noong kakaunti pa lamang kayo[a]—talagang kakaunti—at mga dayuhang naninirahan doon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “iilan lamang” o “halos wala”; mariing binibigyang-diin ng Hebreo kung gaano sila kakaunti.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּהְיוֹתְכֶם
  choice: noong ... kayo
  rationale: Ang ב na sinusundan ng infinitive construct ng היה at hulaping pangalawang panauhang maramihan ay bumubuo ng sugnay na temporal; natural itong ipinahahayag sa Tagalog sa pamamagitan ng “noong ... kayo.”
- source_word: מְתֵי מִסְפָּר
  choice: kakaunti pa lamang
  rationale: Ang idyoma ay tumutukoy sa napakaliit at madaling bilangin na pangkat. Ang “kakaunti” ay malinaw at likas sa modernong Tagalog, at ipinahihiwatig ng “pa lamang” ang kanilang kalagayan noong panahong iyon.
- source_word: כִּמְעַט
  choice: talagang kakaunti
  rationale: Pinatitindi rito ng parirala ang naunang ideya ng pagiging kakaunti. Pinananatili ng “talagang kakaunti” ang pag-uulit at diin ng Hebreo nang hindi nagiging di-likas.
- source_word: וְגָרִים
  choice: at mga dayuhang naninirahan
  rationale: Ang participle mula sa גור ay tumutukoy sa mga taong naninirahan sa isang lupaing hindi kanila at walang katayuan bilang katutubong mamamayan. Mas malinaw sa karaniwang mambabasa ang “mga dayuhang naninirahan” kaysa sa arkaikong “mga nakikipamayan.”
- source_word: בָּהּ
  choice: doon
  rationale: Ang hulaping pambabaeng isahan ay tumutukoy sa lupaing binanggit sa konteksto. Likas sa Tagalog ang lokatibong “doon” at hindi kailangang ulitin ang “lupain.”
