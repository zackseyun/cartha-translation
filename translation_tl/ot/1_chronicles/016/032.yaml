base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/032.yaml
  text: Let the sea thunder[a], and all that fills it; let the field exult[b], and all that is in it.
translation:
  language: tl
  text: Dumagundong nawa ang dagat[a] at ang lahat ng pumupuno rito[b]; magbunyi nawa ang parang at ang lahat ng naroon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Umugong nawa ang dagat.” Ang pandiwang Hebreo ay maaaring tumukoy sa malakas na dagundong o ugong.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “ang kapuspusan nito”; ibig sabihin, lahat ng pumupuno sa dagat.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרְעַם
  choice: dumagundong
  rationale: Ang pandiwang רעם ay tumutukoy sa malakas at malalim na tunog na gaya ng kulog o dagundong. Likas sa Filipino ang “dumagundong ang dagat” at napapanatili nito ang masidhing larawang patula.
- source_word: הַיָּם
  choice: ang dagat
  rationale: Ang “dagat” ang tuwiran at karaniwang katumbas ng יָם at angkop sa pagtutulad nito sa kalupaan.
- source_word: וּמְלוֹאוֹ
  choice: at ang lahat ng pumupuno rito
  rationale: Literal itong “at ang kapuspusan nito,” ngunit sa konteksto ay tumutukoy sa lahat ng nilalaman o pumupuno sa dagat. Malinaw at kongkreto ang saling ito nang hindi inaalis ang imahen ng pagpuno.
- source_word: יַעֲלֹץ
  choice: magbunyi nawa
  rationale: Ang עלץ ay masigla at matagumpay na kagalakan. Ipinahahayag ng “magbunyi” ang matinding galak at pinananatili ang marangal na himig ng tula.
- source_word: הַשָּׂדֶה
  choice: ang parang
  rationale: Maaaring tumukoy ang שָׂדֶה sa bukid, parang, o lantad na lupain. Ang “parang” ay natural na katapat ng dagat sa masaklaw na larawan ng sangnilikha at hindi ipinapalagay na sakahang nilinang ang tinutukoy.
- source_word: וְכָל אֲשֶׁר בּוֹ
  choice: at ang lahat ng naroon
  rationale: Tumutukoy ang parirala sa lahat ng nasa parang. Ang “lahat ng naroon” ay natural sa modernong Filipino at pinananatili ang saklaw ng כָל.
theological_decisions: []
translation_notes:
  register: Makabagong Filipino na marangal at patula. Ginamit ang “nawa” upang ihayag ang Hebreong panawagan o paghiling, at pinanatili ang magkatimbang na mga larawan ng dagat at parang.
