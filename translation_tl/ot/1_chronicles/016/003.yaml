translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “bawat Israelita” bilang natural na pamamahaging pananalita, habang pinanatili ng “mula lalaki hanggang babae” ang tahasang saklaw ng tekstong Hebreo. Ang “tig-isa” ay maayos na nagpapakita na bawat tumanggap ay binigyan ng bawat nakalistang pagkain.
