base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/003.yaml
  text: He distributed to every person of Israel[a], from man to woman, to each one a loaf of bread, a portion of meat, and a raisin cake.
translation:
  language: tl
  text: Namahagi siya sa bawat Israelita, mula sa lalaki hanggang sa babae, ng isang tinapay, isang bahagi ng karne[a], at isang kakaning gawa sa pasas para sa bawat isa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O kaya, “isang bahagi” o ibang uri ng pagkain. Bihira ang salitang Hebreo na אֶשְׁפָּר, at hindi tiyak ang eksaktong kahulugan nito. Marami ang umuunawa rito bilang isang bahagi ng karne.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחַלֵּק
  choice: Namahagi siya
  rationale: Ang Piel na anyo ng חלק ay tumutukoy sa pamamahagi ng mga takdang pagkain sa maraming tao; natural at tuwiran ang “namahagi” sa modernong Tagalog.
- source_word: לְכָל אִישׁ יִשְׂרָאֵל
  choice: sa bawat Israelita
  rationale: Ginagamit dito ang אִישׁ nang pamahagi para sa bawat kabilang sa Israel. Malinaw na saklaw ang kapwa lalaki at babae dahil sa kasunod na parirala.
- source_word: מֵאִישׁ וְעַד אִשָּׁה
  choice: mula lalaki hanggang babae
  rationale: Pinananatili nito ang saklaw na hayagang binanggit sa Hebreo at hindi pinapawi ang anyo ng orihinal na pananalita.
- source_word: לְאִישׁ
  choice: tig-isa
  rationale: Ipinahahayag ng “tig-isa” ang pamamahaging para sa bawat indibidwal at iniiwasan ang paulit-ulit at mabigat na parirala sa Tagalog.
- source_word: כִּכַּר לֶחֶם
  choice: isang tinapay
  rationale: Ang כִּכָּר ay isang bilog o buong piraso ng tinapay; sapat at natural sa Tagalog ang “isang tinapay.”
- source_word: אֶשְׁפָּר
  choice: isang bahagi ng karne
  rationale: Bihira at hindi tiyak ang salita. Ang “bahagi ng karne” ay karaniwang pagkaunawa sa konteksto ng pamamahagi ng pagkaing pampista, ngunit minarkahan ang kawalang-katiyakan sa talababa.
- source_word: אֲשִׁישָׁה
  choice: isang kakaning pasas
  rationale: Ang salita ay tumutukoy sa pinisang kakanin o cake na karaniwang inuunawa bilang gawa sa pasas; malinaw at maikli ang “kakaning pasas.”
