base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/043.yaml
  text: Then all the people went[a], each man to his house, and David turned to bless his household.
translation:
  language: tl
  text: Pagkatapos, umuwi ang buong bayan, bawat isa sa sarili niyang bahay. At bumaling si David upang pagpalain ang kanyang sambahayan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “bahay.” Ang salitang Hebreo ay maaaring tumukoy sa mismong bahay o sa sambahayan o pamilyang kaugnay nito.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלְכוּ כָל־הָעָם
  choice: umuwi ang buong bayan
  rationale: Sa konteksto, ang paglakad ng bayan ay patungo sa kani-kanilang bahay; natural na ipinahahayag ito sa modernong Filipino bilang “umuwi,” habang ang כָל־הָעָם ay “ang buong bayan.”
- source_word: אִישׁ לְבֵיתוֹ
  choice: bawat isa sa sarili niyang bahay
  rationale: 'Distributibo ang אִישׁ: isa-isa silang nagtungo sa kani-kanilang tirahan. Ang “bawat isa” ay natural at saklaw ang buong bayang tinutukoy, samantalang pinananatili ng “bahay” ang kongkretong diwa ng בַּיִת.'
- source_word: וַיִּסֹּב דָּוִיד
  choice: bumaling si David
  rationale: Ang סבב ay nagsasaad dito ng pagliko o pagbabago ng direksiyon. Mas malapit sa anyo ng Hebreo ang “bumaling” kaysa sa mas interpretibong “bumalik.”
- source_word: לְבָרֵךְ
  choice: upang pagpalain
  rationale: Ang infinitibong may לְ ay nagpapahayag ng layunin; “upang pagpalain” ang malinaw at karaniwang salin ng ברך.
- source_word: אֶת־בֵּיתוֹ
  choice: ang kanyang sambahayan
  rationale: Sa ikalawang gamit, malamang na tumutukoy ang בַּיִת sa mga taong kabilang sa tahanan ni David, hindi lamang sa gusali. Ipinahihiwatig ito ng pandiwang “pagpalain,” ngunit inilalagay sa talababa ang tunay na alternatibong “bahay.”
theological_decisions:
- issue: Saklaw ng pagpapala ni David
  choice: sambahayan
  alternative: bahay
  rationale: Hindi nililinaw ng Hebreo kung ang בֵּיתוֹ ay gusali, pamilya, o mas malawak na sambahayan. Pinili ang “sambahayan” bilang pinakamalamang sa konteksto, nang hindi ginagawang mas tiyak na “pamilya”; pinananatili sa talababa ang leksikal na alternatibo.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “buong bayan,” “bawat isa,” at “sambahayan” bilang likas na pananalita, habang pinanatili ang pagkakaiba ng unang בֵּיתוֹ bilang tirahan at ng ikalawa bilang malamang na sambahayan.
