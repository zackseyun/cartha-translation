  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang anyong talaan at ang tunay na kalabuan ng pangmaramihang “kanilang,” habang ginawang natural ang pahayag tungkol sa tungkulin ng mga bantay.
