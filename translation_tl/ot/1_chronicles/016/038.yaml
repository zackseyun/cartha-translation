base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/038.yaml
  text: And Obed-edom and their brothers[a], sixty-eight; and Obed-edom son of Jeduthun and Hosah were gatekeepers.
translation:
  language: tl
  text: At si Obed-Edom at ang kanilang mga kapatid[a], animnapu't walo; at sina Obed-Edom, na anak ni Jedutun, at Hosa ay mga bantay sa pintuan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “kanilang mga kapatid.” Ginagawa itong “kanyang mga kapatid” ng ilang salin upang luminaw ang kaugnayan, ngunit sinusunod dito ang pangmaramihang hulaping panghalip ng tinanggap na tekstong Hebreo.
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/עֹבֵד אֱדֹם
  choice: At si Obed-Edom
  rationale: Pinananatili ng “At” ang pagpapatuloy ng talaan mula sa naunang talata; isinalin sa karaniwang baybay ang pangalang pantangi.
- source_word: וַ/אֲחֵי/הֶם
  choice: at ang kanilang mga kapatid
  rationale: Sinusunod ang pangmaramihang hulaping panghalip ng tinanggap na tekstong Hebreo. Hindi ito ginawang “kanyang” kahit hindi ganap na malinaw ang tinutukoy ng “kanilang.”
- source_word: שִׁשִּׁים וּ/שְׁמוֹנָה
  choice: animnapu't walo
  rationale: Likas na makabagong anyo sa Filipino para sa bilang na 68.
- source_word: וְ/עֹבֵד אֱדֹם
  choice: at sina Obed-Edom
  rationale: Inuulit ang pangalan gaya sa Hebreo at ginagamit ang “sina” dahil magkasamang tinutukoy si Obed-Edom at si Hosa.
- source_word: בֶּן יְדִיתוּן
  choice: na anak ni Jedutun
  rationale: Tuwirang pinananatili ang pagkakakilanlang pampamilya na mahalaga sa mga tala ng Mga Cronica.
- source_word: וְ/חֹסָה
  choice: at Hosa
  rationale: Isinalin sa karaniwang baybay ang pangalang pantangi at iniugnay kay Obed-Edom sa iisang tungkulin.
- source_word: לְ/שֹׁעֲרִים
  choice: ay mga bantay sa pintuan
  rationale: Ipinapahayag ng לְ ang tungkulin o pagkakahirang. Ang “mga bantay sa pintuan” ay malinaw at natural na katumbas sa Filipino.
