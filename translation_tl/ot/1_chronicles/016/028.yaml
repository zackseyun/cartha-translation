  text: הָב֤וּ לַֽ/יהוָה֙ מִשְׁפְּח֣וֹת עַמִּ֔ים הָב֥וּ לַ/יהוָ֖ה כָּב֥וֹד וָ/עֹֽז׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/028.yaml
  text: Ascribe to Yahweh[a], families of the peoples, ascribe to Yahweh glory and strength.
translation:
  language: tl
  text: Ibigay ninyo kay Yahweh, kayong mga angkan ng mga bayan, ibigay ninyo kay Yahweh ang kaluwalhatian at kalakasan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָבוּ
  choice: Ibigay ninyo
  rationale: Ang maramihang pautos ay literal na “ibigay,” ngunit sa konteksto ng pagpupuri ay nangangahulugang kilalanin at iukol kay Yahweh ang nararapat sa kanya. Likas at malinaw sa Tagalog ang “ibigay ninyo” habang pinananatili ang matalinghagang lakas ng Hebreo.
- source_word: לַיהוָה
  choice: kay Yahweh
  rationale: Ang ל ay nagmamarka sa pinag-uukulan ng pautos, at ang pangalang יהוה ay isinasalin bilang “Yahweh.”
- source_word: מִשְׁפְּחוֹת עַמִּים
  choice: kayong mga angkan ng mga bayan
  rationale: Ang מִשְׁפְּחוֹת ay tumutukoy sa mga pangkat na magkakamag-anak o mga angkan, samantalang ang עַמִּים ay maramihang “mga bayan.” Idinagdag ang “kayong” upang likas na maipahayag sa Tagalog ang tuwirang pagtawag.
- source_word: כָּבוֹד
  choice: kaluwalhatian
  rationale: Sa konteksto ng pagpupuri, tumutukoy ito sa dangal at kadakilaang kinikilalang nauukol sa Diyos; “kaluwalhatian” ang matatag at angkop na salin.
- source_word: וָעֹז
  choice: at kalakasan
  rationale: Ang עֹז ay lakas o kapangyarihan. Pinananatili ng “kalakasan” ang tuwirang pagkakahanay nito sa “kaluwalhatian.”
theological_decisions:
- issue: Pagsasalin ng banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tahasang ginagamit sa talata ang Tetragrammaton. Ang “Yahweh” ay nagpapanatili rito bilang personal at tipanang pangalan sa halip na palitan ng titulo.
- issue: Diwa ng pag-uutos na הָבוּ
  choice: Ibigay ninyo
  alternative: Kilalanin ninyo bilang taglay ni Yahweh
  rationale: Pinananatili ang konkretong idyoma ng Hebreo nang hindi tahasang nilulutas sa teksto kung ito ay pag-uukol, pagkilala, o kapuwa. Nauunawaan sa konteksto ng pagpupuri na hindi literal na inililipat sa Diyos ang mga katangiang ito.
translation_notes:
  register: Makabagong Filipino Tagalog na marangal at madaling maunawaan. Pinanatili ang magkatulad na dalawang pautos at ang maramihang anyo ng “mga bayan.”
