  text: וְ/עִמָּ/הֶם֩ הֵימָ֨ן וִֽ/ידוּת֜וּן חֲצֹצְר֤וֹת וּ/מְצִלְתַּ֨יִם֙ לְ/מַשְׁמִיעִ֔ים וּ/כְלֵ֖י שִׁ֣יר הָ/אֱלֹהִ֑ים וּ/בְנֵ֥י יְדוּת֖וּן לַ/שָּֽׁעַר׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/042.yaml
  text: And with them were Heman and Jeduthun with trumpets and cymbals for sounding aloud[a], and instruments for the songs of God; and the sons of Jeduthun were at the gate.
translation:
  language: tl
  text: Kasama nila sina Heman at Jedutun, na may mga trumpeta at mga pompiyang pinatutunog nang malakas, at mga instrumento para sa mga awit ng Diyos. Ang mga anak naman ni Jedutun ay nasa pintuan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nakatalaga sa pagbabantay sa pintuan.” Literal na “sa/para sa pintuan” ang Hebreo.
    reason: Pinananatili nito ang posibleng diwa ng opisyal na tungkulin sa pintuan habang hindi inaalis ang kaiklian at bahagyang kalabuan ng orihinal.
lexical_decisions:
- source_word: וְעִמָּהֶם
  choice: Kasama nila
  rationale: Natural na Filipino para sa pariralang nagpapakilala sa mga taong kasama ng naunang binanggit na pangkat; ipinahihiwatig na ng pangungusap ang pandiwang 'naroon'.
- source_word: הֵימָן וִידוּתוּן
  choice: sina Heman at Jedutun
  rationale: Ginamit ang pantukoy na 'sina' para sa dalawang pangalan at ang tuwirang transliterasyong Filipino na 'Jedutun' mula sa Hebreong Yedutun.
- source_word: חֲצֹצְרוֹת
  choice: mga trumpeta
  rationale: Karaniwang makabagong katawagan sa metal na instrumentong seremonyal na tinutukoy ng Hebreo.
- source_word: וּמְצִלְתַּיִם
  choice: mga pompiyang
  rationale: Ang 'pompiya' ay malinaw na katumbas sa Filipino ng mga cymbal at angkop sa kontekstong musikal.
- source_word: לְמַשְׁמִיעִים
  choice: pinatutunog nang malakas
  rationale: Ipinapahayag ang causative na diwa ng ugat na שמע, 'iparinig' o 'patunugin,' at ang hayag at malakas na tunog ng mga instrumento nang hindi ipinapalagay na melodiya ang tinutukoy.
- source_word: וּכְלֵי שִׁיר הָאֱלֹהִים
  choice: at mga instrumento para sa mga awit ng Diyos
  rationale: Pinananatili ang ugnayan ng 'mga instrumento' at 'awit' at ang literal na 'ng Diyos,' nang hindi pinapaliit ang kahulugan tungo lamang sa pagsamba o pagsaliw.
- source_word: וּבְנֵי יְדוּתוּן
  choice: Ang mga anak naman ni Jedutun
  rationale: Tapat sa genealogical at Levitikong gamit ng 'mga anak'; ang 'naman' ay likas na naghihiwalay sa kanilang tungkulin mula sa naunang mga musikero.
- source_word: לַשָּׁעַר
  choice: ay nasa pintuan
  rationale: Pinananatili ang maikling Hebreong 'sa/para sa pintuan' at hindi ginagawang tahasang 'mga bantay ng pintuan' sa pangunahing teksto.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang 'pompiya' bilang karaniwang salitang Filipino para sa cymbal at iniwasang dagdagan ng partikular na paliwanag tungkol sa uri ng pagsamba o tungkulin na hindi tahasang sinasabi ng Hebreo.
