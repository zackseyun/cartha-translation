base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/034.yaml
  text: Give thanks to Yahweh[a], for he is good[b]; for his steadfast love endures forever.
translation:
  language: tl
  text: Magpasalamat kayo kay Yahweh[a], sapagkat siya ay mabuti; sapagkat ang kanyang tapat na pag-ibig ay nananatili magpakailanman.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: “Yahweh,” ang personal na pangalan ng Diyos; madalas itong isalin na “ang PANGINOON.”'
    reason: alternative_reading
  - marker: b
    text: Maaari ring isalin ang “tapat na pag-ibig” na “katapatan sa tipan.” Ang salitang Hebreo na חֶסֶד (hesed) ay nagpapahiwatig ng matatag at mapagmahal na katapatan.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹד֤וּ
  choice: Magpasalamat kayo
  rationale: Pautos na maramihan ang anyo ng ידה sa Hiphil. Sa pormulang liturhikal na ito, likas at tumpak ang “Magpasalamat kayo,” at malinaw nitong pinananatili na maramihan ang kausap.
- source_word: לַ/יהוָה֙
  choice: kay Yahweh
  rationale: Tuwirang isinalin ang pangalang tipan na יהוה bilang “Yahweh”; ang “kay” ang likas na pananda sa Tagalog para sa personal na pangalan.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala ng parehong paglitaw ng כִּי ang mga dahilan ng utos. Ang pag-uulit ng “sapagkat” ay nagpapanatili sa paralelismo at marangal na indayog ng Hebreo.
- source_word: ט֔וֹב
  choice: mabuti
  rationale: Payak at sapat na katumbas ng טוֹב, na tumutukoy dito sa kabutihan ng Diyos.
- source_word: לְ/עוֹלָ֖ם
  choice: magpakailanman
  rationale: Ipinahahayag ang walang-hanggang pagpapatuloy; natural ito sa makabagong Tagalog at angkop sa pormulang papuri.
- source_word: חַסְדּֽ/וֹ
  choice: ang kanyang tapat na pag-ibig
  rationale: Pinananatili ng “tapat na pag-ibig” ang pinagsamang diwa ng pagmamahal at matatag na katapatan sa חֶסֶד nang hindi ito nililimitahan sa awa lamang.
- source_word: לְ/עוֹלָ֖ם חַסְדּֽ/וֹ
  choice: ang kanyang tapat na pag-ibig ay nananatili magpakailanman
  rationale: Walang tahasang pandiwa sa Hebreo, ngunit kailangan ito sa natural na Tagalog. Ang “nananatili” ay nagpapahayag ng ipinahihiwatig na patuloy na pag-iral ng kanyang חֶסֶד.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יהוה
  choice: Yahweh
  alternative: ang PANGINOON; Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang tahasang pangalang ginamit sa talata sa halip na palitan ito ng isang titulo.
- issue: Saklaw ng kahulugan ng חֶסֶד
  choice: tapat na pag-ibig
  alternative: katapatan sa tipan; awa; wagas na pag-ibig
  rationale: Sinasaklaw ng “tapat na pag-ibig” kapwa ang pagmamahal at matatag na katapatan. Hindi nito isinasara ang mayamang kahulugan ng salita sa emosyon lamang o sa isang teknikal na konsepto ng tipan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang liturhikal na pag-uulit ng “sapagkat,” ang maramihang utos na “kayo,” at ang masaganang kahulugan ng חֶסֶד. Inilagay ang panandang [b] matapos ang buong sugnay upang hindi maputol ang daloy ng maikling talata.
