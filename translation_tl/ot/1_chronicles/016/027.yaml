id: 1CH.16.27
reference: 1 Chronicles 16:27
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: ה֤וֹד וְ/הָדָר֙ לְ/פָנָ֔י/ו עֹ֥ז וְ/חֶדְוָ֖ה בִּ/מְקֹמֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/027.yaml
  text: Splendor and majesty are before him[a]; strength and joy are in his place.
translation:
  language: tl
  text: Nasa harap niya ang karilagan at kamahalan; nasa kanyang lugar[a] ang lakas at kagalakan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa kanyang tahanan” o “sa kanyang santuwaryo.” Sa Hebreo, “sa kanyang lugar” ang nakasulat—isang pananalitang mas malawak kaysa sa katumbas na pananalita sa Awit 96:6.
    reason: alternative_reading
lexical_decisions:
- source_word: הוֹד
  choice: karilagan
  rationale: Ipinahahayag ng הוֹד ang maningning at maringal na kadakilaan. Ang “karilagan” ay likas sa makatang Filipino at naiiba sa kasunod na “kamahalan.”
- source_word: הָדָר
  choice: kamahalan
  rationale: Sa makatang tambalan, ang הָדָר ay tumutukoy sa maringal na dangal o kadakilaan. Pinananatili ng “kamahalan” ang maharlika at mataas na himig.
- source_word: לְפָנָיו
  choice: nasa harap niya
  rationale: Tuwirang pinananatili nito ang larawang panlunan at ugnayan ng Hebreong “sa harap niya,” nang hindi nagiging pilit sa Filipino.
- source_word: עֹז
  choice: lakas
  rationale: Karaniwang tumutukoy ang עֹז sa lakas o kapangyarihan. Ang “lakas” ang pinakasimple at tuwirang katumbas sa konteksto.
- source_word: חֶדְוָה
  choice: kagalakan
  rationale: Ang חֶדְוָה ay galak o kagalakan. Ang “kagalakan” ay dignified at angkop sa makatang pagtutumbas sa “lakas.”
- source_word: בִּמְקֹמוֹ
  choice: nasa kanyang lugar
  rationale: Malawak ang kahulugan ng מָקוֹם bilang “lugar.” Hindi ito tahasang nagsasabing santuwaryo, kaya pinananatili sa pangunahing teksto ang mas malawak na pananalita ng Hebreo.
theological_decisions:
- issue: Kung ang מְקוֹמוֹ ay dapat unawaing tiyak na santuwaryo o templo
  choice: kanyang lugar
  alternative: kanyang tahanan; kanyang santuwaryo
  rationale: Bagaman liturhikal ang konteksto at “sa kanyang santuwaryo” ang katumbas na pananalita sa Awit 96:6, מְקוֹמוֹ (“kanyang lugar”) ang ginamit sa Mga Cronica. Pinananatili ng salin ang mas malawak na salita at hindi ito itinutugma nang sapilitan sa Awit.
translation_notes:
  register: Makata, marangal, at malinaw na modernong Filipino. Pinanatili ang magkatambal ngunit magkaibang diwa ng “karilagan at kamahalan,” at ang malawak na kahulugan ng “kanyang lugar.”
