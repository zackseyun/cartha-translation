  text: וַ/יָּבִ֨יאוּ֙ אֶת אֲר֣וֹן הָֽ/אֱלֹהִ֔ים וַ/יַּצִּ֣יגוּ אֹת֔/וֹ בְּ/ת֣וֹךְ הָ/אֹ֔הֶל אֲשֶׁ֥ר נָֽטָה ל֖/וֹ דָּוִ֑יד וַ/יַּקְרִ֛יבוּ עֹל֥וֹת וּ/שְׁלָמִ֖ים לִ/פְנֵ֥י הָ/אֱלֹהִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/001.yaml
  text: So they brought in the ark of God and set it in the midst of the tent that David had pitched for it[b][a], and they offered burnt offerings and peace offerings before God.
translation:
  language: tl
  text: Dinala nila ang kaban ng Diyos at inilagay ito sa gitna ng tolda[a] na itinayo ni David para rito. Naghandog sila ng mga handog na sinusunog at mga handog pangkapayapaan[b] sa harap ng Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa loob ng tolda” o “sa loob ng tabing ng tolda”; ang pariralang Hebreo ay maaaring tumukoy sa pagiging nasa loob, bagaman mas tuwiran itong “sa gitna ng tolda.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “mga handog ng pakikisama” o “mga handog para sa kapakanan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבִיאוּ
  choice: dinala nila
  rationale: Ang Hiphil ng בוא ay nangangahulugang “dalhin” o “ipasok.” Likas sa Tagalog ang “dinala nila,” at malinaw sa kasunod na parirala na dinala ang kaban sa loob ng tolda.
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: ang kaban ng Diyos
  rationale: Pinananatili nito ang eksaktong pariralang Hebreo na “kaban ng Diyos” nang hindi idinaragdag ang “tipan,” na wala sa talata.
- source_word: וַיַּצִּיגוּ אֹתוֹ
  choice: inilagay iyon
  rationale: Sa kontekstong ito, ang pandiwa ay tumutukoy sa paglalagay ng isang bagay sa itinakdang kinalalagyan. Malinaw at natural ang “inilagay iyon.”
- source_word: בְּתוֹךְ הָאֹהֶל
  choice: sa gitna ng tolda
  rationale: Ang בְּתוֹךְ ay maaaring mangahulugang “sa gitna” o mas pangkalahatang “sa loob.” Pinananatili ng “sa gitna” ang kongkretong larawang spatial ng Hebreo.
- source_word: הָאֹהֶל
  choice: tolda
  rationale: Karaniwang salitang Hebreo ito para sa tolda. Ang “tabernakulo” ay maaaring magpahiwatig ng isang partikular na santuwaryo na hindi tahasang tinutukoy rito.
- source_word: אֲשֶׁר נָטָה לוֹ דָּוִיד
  choice: itinayo ni David para rito
  rationale: Kapag tolda ang tinutukoy, ang נטה ay nangangahulugang ilatag o itayo. Ang “para rito” ay tumutukoy sa kaban at nagpapahayag ng layunin ng pagtatayo.
- source_word: וַיַּקְרִיבוּ
  choice: naghandog sila
  rationale: Sa konteksto ng paghahain, ang Hiphil ng קרב ay nangangahulugang magharap o maghandog ng handog.
- source_word: עֹלוֹת
  choice: mga handog na sinusunog
  rationale: Tumutukoy ito sa handog na sinusunog nang buo sa altar. Ang salin ay malinaw sa makabagong Tagalog at pinananatili ang natatanging uri ng handog.
- source_word: שְׁלָמִים
  choice: mga handog pangkapayapaan
  rationale: Pinananatili nito ang kaugnayan ng termino sa kapayapaan at kagalingan, habang ang talababa ay nagsasaad ng iba pang posibleng paglalarawan sa handog.
- source_word: לִפְנֵי הָאֱלֹהִים
  choice: sa harap ng Diyos
  rationale: Malapit ito sa literal na “sa harap ng mukha/presensiya ng Diyos” at natural sa Tagalog.
theological_decisions:
- issue: Paglalarawan sa mga uri ng handog
  choice: Panatilihin ang magkahiwalay na “mga handog na sinusunog” at “mga handog pangkapayapaan.”
  alternative: Gamitin lamang ang pangkalahatang “mga hain,” o isalin ang שְׁלָמִים bilang “mga handog ng pakikisama” o “mga handog para sa kagalingan.”
  rationale: Binabanggit ng Hebreo ang dalawang tiyak na uri ng handog. Ang pagpapanatili sa pagkakaibang ito ay nag-iingat sa ritwal at teolohikal na detalye nang hindi nagdaragdag ng interpretasyong denominasyonal.
- issue: Pagkakakilanlan ng tolda
  choice: Isalin ang הָאֹהֶל bilang “tolda,” hindi “tabernakulo.”
  alternative: “tabernakulo”
  rationale: Karaniwang pangngalan para sa tolda ang ginamit, at sinasabi mismo ng talata na itinayo iyon ni David para sa kaban. Hindi tahasang kinikilala ng teksto ang toldang ito bilang tabernakulo ni Moises.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kaban” at “tolda” bilang karaniwang salitang madaling maunawaan; pinanatili ang tiyak na bokabularyo ng paghahandog at ang posibleng saklaw ng בְּתוֹךְ at שְׁלָמִים sa mga talababa.
