- from: Kaya dinala nila ang kaban ng Diyos at inilagay iyon sa gitna ng toldang itinayo ni David para rito[a]. Pagkatapos, naghandog sila sa harap ng Diyos ng mga handog na sinusunog at mga handog pangkapayapaan[b].
  to: Dinala nila ang kaban ng Diyos at inilagay ito sa gitna ng tolda[a] na itinayo ni David para rito. Naghandog sila ng mga handog na sinusunog at mga handog pangkapayapaan[b] sa harap ng Diyos.
  rationale: Inalis ang mga pang-ugnay na nagdaragdag ng inferensiyal o masidhing temporal na nuwes kaysa sa payak na salaysay ng Hebreo. Inayos ang ayos ng pangalawang pangungusap para sa likas na Tagalog, habang pinanatili ang dalawang tiyak na uri ng handog at ang ‘sa harap ng Diyos.’ Nilinaw ang pagkakaangkla ng talababa a at pinahusay ang naturalness ng alternatibo sa talababa b.
