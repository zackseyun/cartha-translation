base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/008.yaml
  text: Give thanks to Yahweh[a]; call on his name[b]; make his deeds known among the peoples.
translation:
  language: tl
  text: Magpasalamat kayo kay Yahweh; manawagan kayo sa kanyang pangalan; ipaalam ninyo sa mga bansa ang kanyang mga ginawa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הוֹד֤וּ
  choice: Magpasalamat kayo
  rationale: Ang Hiphil imperative plural ng ידה sa konteksto ng pagsamba ay likas na nangangahulugang magpasalamat o magpuri. Malinaw at natural sa modernong Filipino ang “Magpasalamat kayo.”
- source_word: לַֽיהוָה
  choice: kay Yahweh
  rationale: Tuwirang isinasalin ang pangalang tipan na יהוה bilang “Yahweh,” ayon sa ibinigay na patakaran, at ang “kay” ang natural na pananda sa Tagalog.
- source_word: קִרְא֣וּ בִשְׁמ֔וֹ
  choice: tumawag kayo sa kanyang pangalan
  rationale: Sa pariralang ito, ang קרא ay tumutukoy sa pananalangin o pagdulog sa Diyos. Pinananatili ng salin ang “pangalan,” na kumakatawan sa kanyang nahayag na pagkakakilanlan at reputasyon.
- source_word: הוֹדִ֥יעוּ
  choice: ipaalam ninyo
  rationale: 'Pinananatili ng “ipaalam” ang causative na diwa ng Hiphil: gumawa upang malaman ng iba.'
- source_word: בָעַמִּים
  choice: sa mga bayan
  rationale: Ang עַמִּים ay tumutukoy sa maraming pangkat ng mga tao. Ang “mga bayan” ay natural sa biblikal na Filipino at hindi nililimitahan ang kahulugan sa modernong mga estadong politikal.
- source_word: עֲלִילֹתָיו
  choice: ang kanyang mga ginawa
  rationale: Malawak na tumutukoy ang salita sa mga gawa o kilos. Ang “mga ginawa” ay malinaw at hindi nagdaragdag ng katangiang gaya ng “makapangyarihan” na wala sa mismong salita.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Hayagang ginagamit ng Hebreong teksto ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalang tipan sa halip na palitan ito ng titulo.
- issue: Kahulugan ng pagtawag sa pangalan
  choice: tumawag kayo sa kanyang pangalan
  alternative: ipahayag ninyo ang kanyang pangalan
  rationale: Sa anyong קרא בְּשֵׁם, malakas ang diwa ng pagtawag o pagdulog sa Diyos. Hindi ito tahimik na ginagawang utos lamang na ipahayag ang pangalan.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang maramihang “kayo/ninyo” upang maipakita ang plural na mga pautos sa Hebreo. Walang footnote dahil walang kinakailangang paliwanag na hindi kayang katawanin nang sapat ng pangunahing teksto.
