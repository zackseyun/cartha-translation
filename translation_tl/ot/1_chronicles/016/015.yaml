  yaml_path: translation/ot/1_chronicles/016/015.yaml
  text: Remember his covenant forever[a], the word he commanded for a thousand generations.
translation:
  language: tl
  text: Alalahanin ninyo magpakailanman ang kanyang tipan—ang salitang iniutos niya sa isang libong salinlahi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang pangakong iniutos niya sa isang libong salinlahi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: זִכְרוּ
  choice: Alalahanin ninyo
  rationale: Ang Qal imperative na panlalaking maramihan ay tuwirang panawagan sa pamayanan. Likas sa makabagong Filipino ang “Alalahanin ninyo” at pinananatili nito ang pautos na anyo.
- source_word: לְעוֹלָם
  choice: magpakailanman
  rationale: Ipinahahayag nito ang walang-hanggang o palagiang pag-alaala; ang “magpakailanman” ay natural at marangal na katumbas.
- source_word: בְּרִיתוֹ
  choice: ang kanyang tipan
  rationale: Ang בְּרִית ay tumutukoy sa tipan, lalo na sa nagbibigkis na pangako at ugnayang itinatag ng Diyos.
- source_word: דָּבָר
  choice: ang salita
  rationale: 'Malawak ang saklaw ng דָּבָר: salita, bagay, o sa kontekstong ito ay maaaring pangako. Pinananatili ng “salita” ang pangunahing leksikal na kahulugan nang hindi agad nilulutas ang covenantal na pahiwatig.'
- source_word: צִוָּה
  choice: iniutos niya
  rationale: Karaniwang kahulugan ng צוה ang mag-utos. Pinananatili ng “iniutos niya” ang lakas ng banal na atas sa halip na pakinisin ito bilang “itinatag.”
- source_word: לְאֶלֶף דּוֹר
  choice: sa isang libong salinlahi
  rationale: Ang parirala ay nagpapahayag ng abot o tagal sa magkakasunod na salinlahi. Ang “sa isang libong salinlahi” ay maikli at hindi nagpapasiya kung literal o idyomatiko ang bilang.
theological_decisions:
- issue: Kung isasalin ang דָּבָר bilang “salita” o bilang mas interpretatibong “pangako”
  choice: ang salita
  alternative: ang pangakong iniutos niya sa isang libong salinlahi
  rationale: Mas malawak ang Hebreong salita kaysa “pangako.” Pinananatili sa pangunahing teksto ang tunay na leksikal na lawak, habang inilalagay sa talababa ang covenantal na pagbasa bilang lehitimong alternatibo.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “salinlahi” kaysa “henerasyon” upang umangkop sa makatang himig ng awit, at em dash upang ipakita na ang ikalawang parirala ay nagpapaliwanag sa “kanyang tipan.”
