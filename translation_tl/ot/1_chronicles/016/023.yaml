  text: שִׁ֤ירוּ לַֽ/יהוָה֙ כָּל הָ/אָ֔רֶץ בַּשְּׂר֥וּ מִ/יּֽוֹם אֶל י֖וֹם יְשׁוּעָתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/023.yaml
  text: Sing to Yahweh[a], all the earth[b]; proclaim his salvation from day to day.
translation:
  language: tl
  text: Umawit kayo kay Yahweh[a], buong daigdig; ipahayag ninyo araw-araw ang mabuting balita ng kanyang pagliligtas.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: YHWH (יהוה), ang personal na pangalan ng Diyos; maaari ring isaling “PANGINOON” ayon sa tradisyon.'
    reason: alternative_reading
  - marker: b
    text: 'Maaari ring isalin: “ipahayag ninyo sa araw-araw ang kanyang pagliligtas.” Ang pandiwa ay may diwa ng paghahatid o pagpapahayag ng mabuting balita.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁירוּ
  choice: Umawit kayo
  rationale: Tuwirang salin ng pangmaramihang pautos ng שׁיר; likas at marangal sa makabagong Filipino nang hindi idinaragdag ang diwa ng pagpupuri.
- source_word: לַיהוָה
  choice: kay Yahweh
  rationale: Pinananatili ang personal na banal na pangalang יְהוָה bilang Yahweh; ang pang-ukol na לְ ay natural na isinasalin dito bilang “kay.”
- source_word: כָּל הָאָרֶץ
  choice: buong daigdig
  rationale: Bagaman maaaring mangahulugang “lupain” ang אֶרֶץ, ang pandaigdig na panawagan ng awit ay mas angkop sa “buong daigdig.”
- source_word: בַּשְּׂרוּ
  choice: ipahayag ninyo ang mabuting balita
  rationale: Ang Piel na pautos ng בשׂר ay hindi lamang pangkalahatang pagpapahayag kundi paghahatid ng mabuting balita; ginagawang hayag ng salin ang positibong diwang ito.
- source_word: מִיּוֹם אֶל יוֹם
  choice: araw-araw
  rationale: Natural na Filipino para sa patuloy at paulit-ulit na diwa ng Hebreong “mula sa araw hanggang sa araw.”
- source_word: יְשׁוּעָתוֹ
  choice: kanyang pagliligtas
  rationale: Saklaw ng יְשׁוּעָה ang pagliligtas o kaligtasan. Ang “pagliligtas” ay malinaw na tumutukoy sa gawa ng Diyos at maayos na kaugnay ng pagpapahayag ng mabuting balita.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Ginagamit mismo ng tekstong Hebreo ang Tetragrammaton. Pinananatili ng “Yahweh” ang pagkakakilanlan nito bilang personal na pangalan sa halip na palitan ng titulo.
- issue: Saklaw ng יְשׁוּעָתוֹ
  choice: kanyang pagliligtas
  alternative: kanyang kaligtasan; kanyang tagumpay
  rationale: Hindi nililimitahan ng konteksto ang salita sa militar na tagumpay lamang. Pinananatili ng “pagliligtas” ang malawak na saklaw at ang Diyos bilang pinagmumulan nito.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “buong daigdig” para sa pandaigdig na saklaw at “araw-araw” para sa natural na daloy. Ang “mabuting balita” ay pinanatili bilang leksikal na diwa ng בשׂר, hindi bilang pagpasok ng mas huling terminolohiyang denominasyonal.
