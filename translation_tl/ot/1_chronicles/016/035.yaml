base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/035.yaml
  text: And say[a], “Save us, O God of our salvation; gather us and deliver us from the nations[b], that we may give thanks to your holy name and glory in your praise.”
translation:
  language: tl
  text: At sabihin ninyo, “Iligtas mo kami, O Diyos ng aming kaligtasan; tipunin mo kami at sagipin mo kami mula sa mga bansa[a], upang magpasalamat kami sa iyong banal na pangalan at magbunyi sa pagpupuri sa iyo[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mula sa mga bayan”; maaari ring isaling “mula sa mga Hentil,” ngunit mas malawak dito ang diwa ng mga bansa o mga bayan.
    reason: lexical_alternative
  - marker: b
    text: O “magmalaki dahil sa iyong kapurihan” o “magmalaki sa papuri sa iyo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִמְרוּ
  choice: At sabihin ninyo
  rationale: Pinananatili ang pang-ugnay at ang maramihang pautos, na angkop sa sama-samang tugon ng bayan.
- source_word: הוֹשִׁיעֵנוּ
  choice: Iligtas mo kami
  rationale: Tuwirang katumbas ng Hiphil imperative ng ישׁע; likas at malinaw sa makabagong Tagalog.
- source_word: אֱלֹהֵי יִשְׁעֵנוּ
  choice: O Diyos ng aming kaligtasan
  rationale: Pinananatili ang construct phrase na “Diyos ng aming kaligtasan” at ang tuwirang pagtawag sa Diyos nang hindi ito ginagawang ibang titulong teolohikal.
- source_word: וְקַבְּצֵנוּ
  choice: tipunin mo kami
  rationale: Ipinahahayag ang pagtitipon ng mga nakakalat at pinananatili ang posibleng diwa ng pagpapanumbalik.
- source_word: וְהַצִּילֵנוּ
  choice: at sagipin mo kami
  rationale: Ang “sagipin” ay malinaw na tumutukoy sa pag-aalis sa panganib at naiiba sa naunang “iligtas,” gaya ng pagkakaiba ng mga pandiwang Hebreo.
- source_word: מִן־הַגּוֹיִם
  choice: mula sa mga bansa
  rationale: Ang גוים ay tumutukoy rito sa mga bansa o mga bayang kinaroroonan ng Israel; hindi kailangan ang mas huling kategoryang teolohikal na “mga Hentil.”
- source_word: לְהוֹדוֹת לְשֵׁם קָדְשֶׁךָ
  choice: upang magpasalamat kami sa iyong banal na pangalan
  rationale: Ginagawang malinaw ang layunin ng infinitive at pinananatili ang pormulang “banal na pangalan.”
- source_word: לְהִשְׁתַּבֵּחַ בִּתְהִלָּתֶךָ
  choice: at magbunyi sa pagpupuri sa iyo
  rationale: Ang “magbunyi” ay naghahatid ng positibong pagmamapuri o pagdiriwang sa Diyos, samantalang ang “pagpupuri sa iyo” ay natural na Tagalog para sa papuring nakatuon sa Diyos. Isinasaad sa talababa ang ibang posibleng pag-unawa sa parirala.
theological_decisions:
- issue: Kung isasalin ang הַגּוֹיִם bilang “mga Hentil” o “mga bansa”
  choice: mula sa mga bansa
  alternative: mula sa mga Hentil; mula sa mga bayan
  rationale: Sa konteksto, hinihiling ng Israel na tipunin at sagipin sila mula sa mga bansang kinaroroonan nila. Iniiwasan ng “mga bansa” ang pagpasok ng mas huling pagkakategoryang Hudyo/Hentil.
- issue: Ang diwa ng לְהִשְׁתַּבֵּחַ בִּתְהִלָּתֶךָ
  choice: magbunyi sa pagpupuri sa iyo
  alternative: ipagkapuri ang iyong kapurihan; magmalaki sa papuri sa iyo
  rationale: Maaaring ipahiwatig ng Hebreo ang pagbubunyi o positibong pagmamalaki sa papuri, kapurihan, o pagiging karapat-dapat purihin ng Diyos. Pinipili ng pangunahing teksto ang natural na pahayag ngunit pinananatili sa talababa ang tunay na lawak ng kahulugan.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang panalanging sama-sama sa mga anyong “ninyo” at “kami,” gayundin ang pagkakaiba ng “iligtas” at “sagipin.” Ginamit ang “O” bilang likas na pormal na pantawag sa panalangin.
