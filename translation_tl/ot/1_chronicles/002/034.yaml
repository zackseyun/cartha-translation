base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/034.yaml
  text: Sheshan had no sons[a], only daughters. And Sheshan had an Egyptian servant whose name was Jarha.
translation:
  language: tl
  text: Walang anak na lalaki si Sesan, kundi mga anak na babae lamang. May isang aliping Ehipsiyo rin si Sesan na ang pangalan ay Jarha.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָיָה לְשֵׁשָׁן
  choice: may … si Sesan
  rationale: Ang Hebreong idyoma na literal na ‘mayroon para kay Sesan’ ay nagpapahayag ng pag-aari o kaugnayan; ang ‘may … si Sesan’ ang likas na katumbas sa Tagalog.
- source_word: בָּנִים
  choice: anak na lalaki
  rationale: Tiyak na mga anak na lalaki ang tinutukoy dahil tuwirang itinatambal ang salita sa ‘mga anak na babae.’
- source_word: כִּי אִם
  choice: kundi … lamang
  rationale: Pagkatapos ng pagtanggi, ipinahahayag ng parirala ang diwang ‘kundi/tanging’; pinananatili ng salin ang malinaw na pagsalungat.
- source_word: בָּנוֹת
  choice: mga anak na babae
  rationale: Tuwirang katumbas ito at pinananatili ang pagkakaiba sa mga anak na lalaki sa talaangkanan.
- source_word: עֶבֶד
  choice: alipin
  rationale: Maaaring tumukoy ang salita sa lingkod o alipin, ngunit ang ‘alipin’ ay hindi nagpapalambot sa posibleng nakagapos na kalagayang ipinahihiwatig ng terminong Hebreo.
- source_word: מִצְרִי
  choice: Ehipsiyo
  rationale: Tinutukoy ng salita ang pinagmulan o lahi ng alipin; ‘Ehipsiyo’ ang karaniwang modernong katawagan.
- source_word: וּשְׁמוֹ
  choice: na ang pangalan ay
  rationale: Natural na inuugnay sa Tagalog ang sugnay tungkol sa pangalan sa naunang tinukoy na tao.
- source_word: יַרְחָע
  choice: Jarha
  rationale: Isinatinig ang pangalang pantangi ayon sa karaniwang anyong ginagamit sa Tagalog.
