base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/013.yaml
  text: And Jesse fathered his firstborn Eliab[a], Abinadab the second, and Shimea the third.
translation:
  language: tl
  text: At si Jesse ang naging ama ni Eliab na kanyang panganay, ni Abinadab na ikalawa, at ni Shimea na ikatlo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “Shimea”; sa kaugnay na talaan sa 1 Samuel 16:9 ay “Shammah.”
    reason: cross_reference
lexical_decisions:
- source_word: וְאִישַׁי
  choice: At si Jesse
  rationale: Ang וְ ay payak na pang-ugnay sa talaangkanan; pinanatili bilang “At.” Ang אִישַׁי ay isinalin sa nakaugaliang anyong “Jesse.”
- source_word: הוֹלִיד
  choice: ang naging ama
  rationale: Ang Hiphil ng ילד sa talaangkanan ay nangangahulugang magkaanak o maging ama. Ang “naging ama” ay natural sa makabagong Tagalog at pinananatili ang tiyak na ugnayang pang-ama.
- source_word: אֶת בְּכֹרוֹ אֶת אֱלִיאָב
  choice: ni Eliab na kanyang panganay
  rationale: Ang בְּכֹרוֹ ay “kanyang panganay,” at ang אֱלִיאָב ay pangalang “Eliab.” Inayos ang pagkakasunod upang maging malinaw at natural sa Tagalog.
- source_word: וַאֲבִינָדָב הַשֵּׁנִי
  choice: ni Abinadab na ikalawa
  rationale: Ang הַשֵּׁנִי ay panandang pamilang na “ikalawa.” Hindi na inulit ang pandiwa, gaya ng pinaikling ayos ng Hebreong talaangkanan.
- source_word: וְשִׁמְעָא הַשְּׁלִישִׁי
  choice: at ni Shimea na ikatlo
  rationale: Direktang sinusunod ng “Shimea” ang anyo ng pangalang שִׁמְעָא sa Mga Cronica; ang הַשְּׁלִישִׁי ay “ikatlo.”
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “naging ama” sa halip na arkaikong katumbas ng “begot,” at pinanatili ang maikli at sunod-sunod na anyo ng talaangkanan.
