  rationale: Pangalang pantangi; tinumbasan sa paraang transliterasyon at pinanatili ang anyong malapit sa Hebreo.
- source_word: אֲבִי
  choice: ang ama ng
  rationale: Pinananatili ang tuwirang pananalita ng Hebreo. Sa mga talaangkanan, maaari rin itong tumukoy sa ninuno o tagapagtatag ng isang angkan o bayan, kaya nililinaw ang saklaw sa talababa.
- source_word: בֵית לָחֶם
