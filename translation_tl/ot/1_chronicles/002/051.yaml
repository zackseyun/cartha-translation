    text: Ang “ama ng” ay maaari ding mangahulugang “ninuno ng” o “tagapagtatag ng.” Sa mga talaangkanan, hindi ito laging tumutukoy sa mismong biyolohikal na ama; maaari itong tumukoy sa pinagmulan ng isang angkan o bayan.
