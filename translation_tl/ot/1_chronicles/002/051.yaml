  rationale: Ginamit ang nakasanayang anyo ng pangalan ng lugar sa Filipino.
- source_word: חָרֵף
  choice: Haref
  rationale: Pangalang pantangi; ang 'Haref' ay natural na transliterasyong Filipino ng anyong Hebreo rito.
- source_word: בֵית גָּדֵר
  choice: Bet-gader
  rationale: Malamang na pangalan ng lugar; pinanatili ang anyong toponimiko sa halip na literal na isaling 'bahay ni Gader.'
