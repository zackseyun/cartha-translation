  source_fidelity: Tumpak na naihahatid ng draft ang tatlong anak, ang tahasang bilang na tatlo, ang kaugnayan sa anak na babae ni Shua, ang pagiging panganay ni Er, ang pagsusuring siya ay masama sa paningin ni Yahweh, at ang di-tahas na simuno ng pagpatay. Gayunman, sa kasalukuyang ayos, ang “ni Shua na Cananea” ay mas madaling mabasang si Shua, sa halip na ang kanyang anak na babae, ang Cananeo/Cananea. Ang Hebreong pang-uri ay tumutukoy sa babae.
  naturalness: Marangal at malinaw sa kabuuan. Mas natural at mas tiyak ang “anak na babaeng Cananea ni Shua,” at mas angkop ang “siya” kaysa “ito” para kay Er sa huling sugnay.
  terminology: Ang Juda, Er, Onan, Sela, at Yahweh ay pare-pareho at angkop sa makabagong Filipino Tagalog. Ang “panganay,” “masama sa paningin,” at “Cananea” ay angkop sa register ng talaangkanan.
