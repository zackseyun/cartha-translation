revisions:
- from: Ang mga anak ni Juda ay sina Er, Onan, at Sela. Ang tatlong ito ay isinilang sa kaniya ng anak na babae ni Shua na Cananea.[a] Si Er, ang panganay ni Juda, ay masama sa paningin ni Yahweh, at pinatay niya ito.[b]
  to: Ang mga anak ni Juda ay sina Er, Onan, at Sela. Ang tatlong ito ay isinilang sa kaniya ng anak na babaeng Cananea ni Shua.[a] Si Er, ang panganay ni Juda, ay masama sa paningin ni Yahweh, at pinatay niya siya.[b]
  rationale: Inayos ang pagkakasunod ng mga salita upang walang alinlangang ang anak na babae, hindi si Shua, ang tinutukoy na Cananea. Pinalitan din ang “ito” ng “siya” para sa mas likas na pagtukoy kay Er. Pinanatili ang ambigwidad ng di-tahas na simuno sa pangunahing teksto at ang paliwanag nito sa talababa.
