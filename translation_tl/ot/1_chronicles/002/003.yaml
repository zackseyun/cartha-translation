  text: בְּנֵ֣י יְהוּדָ֗ה עֵ֤ר וְ/אוֹנָן֙ וְ/שֵׁלָ֔ה שְׁלוֹשָׁה֙ נ֣וֹלַד ל֔/וֹ מִ/בַּת שׁ֖וּעַ הַֽ/כְּנַעֲנִ֑ית וַ/יְהִ֞י עֵ֣ר בְּכ֣וֹר יְהוּדָ֗ה רַ֛ע בְּ/עֵינֵ֥י יְהוָ֖ה וַ/יְמִיתֵֽ/הוּ־׀׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/003.yaml
  text: 'The sons of Judah: Er[a], Onan, and Shelah; three were born to him by Bath-shua the Canaanite. Er, Judah’s firstborn, was evil in the sight of Yahweh[b], and he put him to death.'
translation:
  language: tl
  text: Ang mga anak ni Juda ay sina Er, Onan, at Sela. Ang tatlong ito ay isinilang sa kaniya ng anak na babaeng Cananea ni Shua.[a] Si Er, ang panganay ni Juda, ay masama sa paningin ni Yahweh, at pinatay niya siya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O: “ni Bat-shua na Cananea.” Maaaring unawain dito ang Hebreong mga salita bilang pangalang Bat-shua sa halip na “anak na babae ni Shua.”'
    reason: lexical_alternative
  - marker: b
    text: 'O: “at pinatay siya ni Yahweh.” Hindi tahasang binanggit sa Hebreo ang simuno, ngunit pinakamalikas na tumutukoy ito kay Yahweh sa naunang sugnay.'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּנֵי יְהוּדָה
  choice: Ang mga anak ni Juda
  rationale: Likas na salin sa Filipino ng pariralang construct na tumutukoy sa mga anak o inapo ni Juda, at angkop sa estilong talaangkanan.
- source_word: שְׁלוֹשָׁה נוֹלַד לוֹ
  choice: Ang tatlong ito ay isinilang sa kaniya
  rationale: Pinananatili ang tahasang bilang na tatlo at ang pasibong diwa ng Niphal na נולד, sa halip na gawing aktibong 'naging anak niya.'
- source_word: מִבַּת שׁוּעַ הַכְּנַעֲנִית
  choice: ng anak na babae ni Shua na Cananea
  rationale: Sinusunod ang malinaw na pagbasa ng mga salita bilang 'anak na babae ni Shua' at inilalarawan ang babae bilang Cananea; inilalagay sa talababa ang posibleng pagbasa rito bilang pangalang Bat-shua.
- source_word: בְּכוֹר יְהוּדָה
  choice: ang panganay ni Juda
  rationale: Direkta at natural na katumbas ng ugnayang construct, habang pinananatili ang diin sa katayuan ni Er sa talaangkanan.
- source_word: רַע בְּעֵינֵי יְהוָה
  choice: ay masama sa paningin ni Yahweh
  rationale: Pinananatili ang Hebreong pormula ng banal na pagtataya at ang metaporang 'sa paningin,' na malinaw at dignificado rin sa Filipino.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang transliterasyon ng banal na personal na pangalan sa halip na palitan ito ng isang titulo.
- source_word: וַיְמִיתֵהוּ
  choice: at pinatay niya ito
  rationale: Ipinahahayag ang causative na diwa ng pandiwa sa natural na Filipino. Pinananatili ng panghalip ang di-binanggit na simuno sa Hebreo, habang ang konteksto ay pinakamalikas na tumutukoy kay Yahweh.
theological_decisions:
- issue: Hindi tahasang simuno ng וַיְמִיתֵהוּ
  choice: at pinatay niya ito, na ang 'niya' ay pinakamalikas na tumutukoy kay Yahweh
  alternative: at pinatay si Er ni Yahweh
  rationale: Hindi inuulit ng Hebreo ang simuno. Pinananatili sa pangunahing teksto ang daloy na may panghalip at hindi ginagawang tahas ang ipinahihiwatig lamang, habang nililinaw sa talababa ang pinakamalikas na sanggunian.
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Pinananatili ang personal na pangalan sa tekstong pinagmulan nang hindi ito pinapalitan ng titulong 'Panginoon.'
translation_notes:
  register: Makabago ngunit marangal na Filipino, na may payak na estruktura para sa talaangkanan. Ginamit ang karaniwang anyong Filipino ng mga pangalang Juda, Sela, at Cananea; pinanatili ang Yahweh bilang personal na banal na pangalan.
