  text: At ang anak ni Samai ay si Maon, at si Maon ang ama ng Bet-zur.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ninuno o tagapagtatag ng Bet-zur.” Sa mga talaangkanan, ang “ama ng” ay maaari ring tumukoy sa tagapagtatag o pangunahing ninuno ng isang angkan o pamayanan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בֶן
  choice: At ang anak ni
  rationale: Ipinagpapatuloy ng וּ ang talaangkanan, at ang בֶן ay likas na isinaling “anak” sa pormulang ito.
- source_word: שַׁמַּי
  choice: Samai
  rationale: Isinalin sa anyong transliterasyon na madaling basahin sa modernong Filipino.
- source_word: מָעוֹן
  choice: Maon
  rationale: Pangngalang pantangi ito sa pagkakasunod ng talaangkanan; pinanatili bilang transliterasyon.
- source_word: וּ/מָעוֹן
  choice: at si Maon
  rationale: Pinanatili ang pag-uulit ng pangalan gaya ng nasa Hebreo upang malinaw ang ugnayang pangangkanan.
- source_word: אֲבִי
  choice: ang ama ng
  rationale: Pinananatili nito ang karaniwang pormulang pangangkanan, habang kinikilala sa talababa na maaari rin itong tumukoy sa ninuno o tagapagtatag.
- source_word: בֵית צוּר
  choice: Bet-zur
  rationale: Itinuturing na pangalan ng pook o angkan at isinalin sa transliterasyon sa halip na literal na “bahay ni Zur.”
