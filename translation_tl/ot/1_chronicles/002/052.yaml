translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang karaniwang hulaping -eo para ipahiwatig ang pangkat ng mga taong kaugnay ng Manahat, ngunit pinanatili sa talababa ang heograpiko at pang-angkan na kalabuan ng Hebreo.
