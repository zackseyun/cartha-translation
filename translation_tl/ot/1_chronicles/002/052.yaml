base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/052.yaml
  text: 'And Shobal the father of Kiriath-jearim had sons: Haroeh[c][b][a], half of the Manahathites.'
translation:
  language: tl
  text: 'Nagkaroon ng mga anak si Shobal, ang ama[a] ng Kiriat-jearim: si Haroeh[b] at kalahati ng mga taga-Manahat.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “tagapagtatag ng Kiriat-jearim.” Sa mga talaangkanan, ang “ama” ay maaaring tumukoy sa ninuno o pangunahing tagapagtatag na kaugnay ng isang bayan.
    reason: lexical_alternative
  - marker: b
    text: Maaaring tumukoy ang Haroeh sa isang pangalang isinusulat ding “Reaiah” sa ilang tradisyon.
    reason: alternative_reading
  - marker: c
    text: Sa Hebreo, “kalahati ng Menuhot.” Maaaring tumukoy ito sa kalahati ng Menuhot o sa kalahati ng mga naninirahan o angkan ng Menuhot (Manahat).
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ בָנִים לְשׁוֹבָל
  choice: Nagkaroon ng mga anak si Shobal
  rationale: Natural na ipinapahayag sa modernong Tagalog ang idyomang Hebreo na literal na ‘nagkaroon ng mga anak kay Shobal,’ habang pinananatili ang diwang talaangkanan.
- source_word: אֲבִי קִרְיַת יְעָרִים
  choice: ang ama ng Kiriat-jearim
  rationale: Pinananatili ang literal na ‘ama’ para sa pagiging hayag sa pinagmulan; sa ganitong konteksto maaari rin itong tumukoy sa ninuno, tagapagtatag, o pinunong kaugnay ng bayan.
- source_word: קִרְיַת יְעָרִים
  choice: Kiriat-jearim
  rationale: Pangalang-pook ito, kaya isinalin sa pamamagitan ng transliterasyon sa anyong madaling basahin sa Filipino sa halip na isalin ang kahulugan nito.
- source_word: הָרֹאֶה
  choice: Haroeh
  rationale: Sa talaangkanang ito, malamang na gumaganap ang anyo bilang pangalang pantangi. Pinananatili ng transliterasyon ang anyong Hebreo nang hindi ito ipinapalagay na nangangahulugang ‘tagakita’ o tahimik na itinutumbas sa ibang pangalan.
- source_word: חֲצִי הַמְּנֻחוֹת
  choice: kalahati ng mga Manahateo
  rationale: Pinananatili ang ‘kalahati’ at ipinapahayag ang malamang na pagtukoy sa isang angkan o pangkat ng mga taong kaugnay ng Manahat/Menuhot. Inilalahad sa talababa ang tunay na kalabuan kung pangkat ng tao o lugar ang tinutukoy.
