revisions:
- from: At ang manugang niyang si Tamar ay nagsilang para sa kanya kina Perez[b] at Zera. Lima lahat ang mga anak na lalaki ni Juda.[a]
  to: Si Tamar, na manugang ni Juda, ay nagsilang kay Juda ng mga anak na sina Perez[b] at Zera. Lima ang lahat ng anak na lalaki ni Juda.[a]
  rationale: Pinalitan ang hindi idiomatikong “para sa kanya” ng “kay Juda” at inayos ang pangungusap upang maging malinaw at likas sa modernong Filipino, habang pinananatili ang genealogical na rehistro, ang mga pangalan, ang tiyak na ugnayang pampamilya, at ang kabuuang bilang sa Hebreo. Nanatili ang mga pananda ng talababa sa kanilang wastong mga saligan.
