base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/004.yaml
  text: Tamar[a], his daughter-in-law, bore Perez and Zerah to him[b]. All the sons of Judah were five.
translation:
  language: tl
  text: Si Tamar, na manugang ni Juda, ay nagsilang kay Juda ng mga anak na sina Perez[b] at Zera. Lima ang lahat ng anak na lalaki ni Juda.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Binubuod ng Hebreong “Lima ang lahat ng anak na lalaki ni Juda” ang kabuuang bilang matapos idagdag sina Perez at Zera sa naunang mga anak ni Juda.
    reason: cross_reference
  - marker: b
    text: Isinusulat din ang pangalang Perez bilang “Peretz” sa ilang sistema ng transliterasyon.
    reason: lexical_alternative
lexical_decisions:
- source_word: תָמָר
  choice: Tamar
  rationale: Pangalan ng tao; tinumbasan sa karaniwang transliterasyong ginagamit sa Filipino.
- source_word: כַּלָּתוֹ
  choice: manugang niya
  rationale: Ang כַּלָּה na may hulaping panlalaking ikatlong panauhan ay tumutukoy sa asawa ng anak na lalaki. Likas at tiyak sa Filipino ang “manugang niya.”
- source_word: יָלְדָה
  choice: nagsilang
  rationale: Qal perfect, ikatlong panauhang pambabae ng ילד, na tumutukoy sa panganganak; maikli, marangal, at angkop sa talaangkanan ang “nagsilang.”
- source_word: לוֹ
  choice: para sa kanya
  rationale: Pinananatili ang ugnayang ipinahihiwatig ng לְ sa pagitan ng mga isinilang at ni Juda, bagaman medyo mas literal kaysa sa karaniwang pananalita.
- source_word: פֶּרֶץ
  choice: Perez
  rationale: Pangalan ng tao; “Perez” ang nakaugaliang anyong biblikal sa Filipino. Inilalagay sa talababa ang mas malapit na transliterasyong “Peretz.”
- source_word: זָרַח
  choice: Zera
  rationale: Pangalan ng tao; “Zera” ang natural na anyong Filipino ng pangalang Hebreo.
- source_word: כָּל בְּנֵי יְהוּדָה
  choice: Lima lahat ang mga anak na lalaki ni Juda
  rationale: Pinananatili ang tahasang panlalaking בְּנֵי at inihaharap sa natural na ayos ng pangungusap sa Filipino ang kabuuang bilang.
- source_word: חֲמִשָּׁה
  choice: lima
  rationale: Tiyak na bilang na nagbubuod sa limang anak na lalaki ni Juda na nasa talaangkanan.
theological_decisions:
- issue: Pagbubuod ng talaangkanan matapos pangalanan sina Perez at Zera
  choice: 'Isinalin bilang tuwirang kabuuang bilang: “Lima lahat ang mga anak na lalaki ni Juda.”'
  alternative: “Ito ang lahat ng anak na lalaki ni Juda—lima sila.”
  rationale: Payak na pangungusap na nagbubuod ang Hebreo. Pinananatili ang malinaw na bilang nang hindi ito binibigyan ng dagdag na teolohikal na pakahulugan.
- issue: Mga katawagang may tiyak na kasarian at ugnayang pampamilya
  choice: Pinanatili ang “manugang” at “mga anak na lalaki.”
  alternative: “kamag-anak sa pamamagitan ng pag-aasawa” at “mga anak”
  rationale: Tiyak ang ugnayang pampamilya at kasarian sa mga salitang Hebreo; ang paglalahat sa mga ito ay mag-aalis ng impormasyong nasa teksto.
translation_notes:
  register: 'Makabago ngunit marangal na Filipino para sa isang talaangkanan. Ginamit ang “nagsilang” sa halip na mas mahabang “nanganak ng,” at pinanatili ang tahasang kabuuang bilang. Inilipat ang mga pananda ng talababa sa mga bahaging tunay nilang tinutukoy: [b] sa Perez at [a] sa pangungusap na nagbubuod.'
