  naturalness: Marangal at angkop ang rehistro, ngunit hindi likas ang “nagsilang para sa kanya kina Perez at Zera.” Mas malinaw at natural ang “nagsilang kay Juda ng mga anak na sina Perez at Zera.”
  terminology: Ang Tamar, Juda, Perez, at Zera ay katanggap-tanggap na mga anyong pangalan sa modernong Filipino. Ang “manugang” at “mga anak na lalaki” ay nagpapanatili sa tiyak na ugnayan at kasarian sa Hebreo. Inayos ang talababa tungkol sa Perez upang maging natural na Filipino.
