base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/039.yaml
  text: Azariah fathered Helez[a], and Helez fathered Eleasah.
translation:
  language: tl
  text: Si Azarias ang naging ama ni Helez, at si Helez ang naging ama ni Eleasa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Elasa”; mas tuwirang inililipat ng “Eleasa” ang anyong Hebreo rito.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲזַרְיָה
  choice: Si Azarias
  rationale: Isinalin ang pangalang Hebreo sa anyong natural at kinikilalang transliterasyon sa Filipino; ang prefixed waw ay naipahahayag ng daloy ng pangungusap at ng kasunod na “at.”
- source_word: הֹלִיד
  choice: ang naging ama ni
  rationale: Sa talaangkanan, ang Hiphil ng ילד ay nangangahulugang magkaanak o maging ama. Natural at marangal sa modernong Filipino ang “naging ama ni,” at pinananatili nito ang panlalaking ugnayang genealogical.
- source_word: אֶת
  choice: '[hindi hiwalay na isinalin]'
  rationale: Pananda ito ng tiyak na layon sa Hebreo at walang hiwalay na katumbas sa Filipino; naipakikita ang tungkulin nito sa karaniwang ayos ng pangungusap.
- source_word: חָלֶץ / וְחֶלֶץ
  choice: Heles / at si Heles
  rationale: Parehong personal na pangalan ang tinutukoy sa dalawang sugnay; pare-pareho itong isinalin bilang “Heles,” habang ang waw sa ikalawang anyo ay isinaling “at.”
- source_word: אֶלְעָשָׂה
  choice: Eleasa
  rationale: Malapit na inililipat ng “Eleasa” sa baybay-Filipino ang anyong Hebreo sa talatang ito; posibleng pasimplehin bilang “Elasa,” kaya inilagay ang alternatibo sa talababa.
theological_decisions: []
translation_notes:
  register: Gumamit ng malinaw, kasalukuyan, at marangal na Filipino. Pinili ang “naging ama ni” sa halip na arkaikong “ipinanganak” o isang teknikal na katumbas, at ginamit ang mga pangalang nakaangkop sa ortograpiyang Filipino.
