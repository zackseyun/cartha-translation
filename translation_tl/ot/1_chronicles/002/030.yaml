base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/030.yaml
  text: 'The sons of Nadab: Seled and Appaim[a]. Seled died without sons.'
translation:
  language: tl
  text: Ang mga anak ni Nadab ay sina Seled at Apaim. Namatay si Seled na walang mga anak na lalaki.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי
  choice: Ang mga anak ni
  rationale: Ang pangmaramihang construct ng בֵּן ay nagpapakilala ng talaangkanan. Likas sa Filipino ang “Ang mga anak ni”; hindi kailangang isalin nang hiwalay ang panimulang pangatnig.
- source_word: נָדָב
  choice: Nadab
  rationale: Pangalang pantangi; tinumbasan sa anyong karaniwang ginagamit sa Filipino.
- source_word: סֶלֶד
  choice: Seled
  rationale: Pangalang pantangi; pinanatili ang iisang transliterasyon sa dalawang paglitaw nito.
- source_word: וְאַפָּיִם
  choice: at Apaim
  rationale: Pangalang pantangi na may pangatnig. Bagaman kahawig nito ang karaniwang pangngalang Hebreo para sa “mga butas ng ilong/mukha,” malinaw sa konteksto ng talaangkanan na pangalan ito.
- source_word: וַיָּמָת
  choice: Namatay
  rationale: Ang wayyiqtol ng מוּת ay nagsasaad ng sumunod na pangyayari; natural itong ihayag sa Filipino bilang payak na “Namatay.”
- source_word: לֹא בָנִים
  choice: na walang mga anak na lalaki
  rationale: Literal itong “hindi mga anak na lalaki.” Pinananatili ng salin ang tiyak na kahulugan ng בָּנִים at hindi ito pinalalawak tungo sa lahat ng anak.
