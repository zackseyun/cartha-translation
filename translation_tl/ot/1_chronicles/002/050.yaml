  text: אֵ֤לֶּה הָיוּ֙ בְּנֵ֣י כָלֵ֔ב בֶּן ח֖וּר בְּכ֣וֹר אֶפְרָ֑תָה שׁוֹבָ֕ל אֲבִ֖י קִרְיַ֥ת יְעָרִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/050.yaml
  text: 'These were the sons of Caleb son of Hur[a], the firstborn of Ephrathah: Shobal, father of Kiriath-jearim.'
translation:
  language: tl
  text: 'Ito ang mga anak ni Caleb na anak ni Hur, na panganay ni Efrata: si Shobal, na ama ng Kiriat-jearim.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “tagapagtatag ng Kiriat-jearim” o “ninuno ng Kiriat-jearim.” Sa mga talaangkanan, ang Hebreong “ama ng” ay maaari ring tumukoy sa tagapagtatag ng isang angkan o pamayanan.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה הָיוּ
  choice: Ito ang
  rationale: Natural na pormulang Filipino para sa Hebreong demonstrative at perfect verb sa isang talaangkanan; ipinakikita ng konteksto ang nakaraang panahon nang hindi nangangailangan ng pilit na 'ang mga ito ay naging.'
- source_word: בְּנֵי
  choice: mga anak ni
  rationale: Pinananatili ang tuwirang kahulugan ng Hebreong 'mga anak,' bagaman maaari itong tumukoy nang mas malawak sa mga inapo sa mga talaangkanan.
- source_word: כָלֵב
  choice: Caleb
  rationale: Ginamit ang karaniwang anyo ng pangalan sa modernong Bibliyang Filipino.
- source_word: בֶּן חוּר
  choice: na anak ni Hur
  rationale: Pinananatili ang tahasang ugnayang 'anak ni' sa tekstong Hebreo at malinaw na iniuugnay kay Caleb.
- source_word: בְּכוֹר אֶפְרָתָה
  choice: na panganay ni Efrata
  rationale: 'Ang parirala ay pinakamalikas na naglalarawan kay Hur: si Hur ang panganay ni Efrata. Ang paglalagay nito kasunod ng ''Hur'' ay nagpapanatili sa ugnayang iyon.'
- source_word: שׁוֹבָל
  choice: Shobal
  rationale: Transliterasyon ng personal na pangalan sa anyong madaling basahin sa Filipino.
- source_word: אֲבִי
  choice: ama ng
  rationale: Pinananatili sa pangunahing teksto ang idyomang Hebreo, habang nililinaw sa talababa na maaari itong mangahulugang tagapagtatag o ninuno sa kontekstong angkan at pamayanan.
- source_word: קִרְיַת יְעָרִים
  choice: Kiriat-jearim
  rationale: Isinalin bilang pangalan ng lugar sa halip na literal na 'Lungsod ng mga Kagubatan'; ang baybay ay iniangkop sa Filipino habang napapanatili ang pagkakakilanlan ng toponimo.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na natural at marangal. Pinanatili ang anyo ng talaangkanan at ang posibleng di-tiyak na kahulugan ng 'ama ng' sa pamamagitan ng talababa. Ang panghalip na 'na' pagkatapos ng Hur ay sadyang inuugnay ang 'panganay ni Efrata' kay Hur, alinsunod sa pinakanatural na pagbasa ng Hebreong sintaks.
