base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/016.yaml
  text: 'Their sisters were Zeruiah and Abigail. The sons of Zeruiah: Abishai, Joab, and Asahel—three.'
translation:
  language: tl
  text: Ang kanilang mga kapatid na babae ay sina Zeruya at Abigail. Ang mga anak na lalaki ni Zeruya ay sina Abisai, Joab, at Asahel—tatlo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַאֲחֹתֵיהֶם
  choice: Ang kanilang mga kapatid na babae ay
  rationale: Pinananatili ang pangmaramihang “mga kapatid na babae” at ang panghalip na “kanilang,” habang likas na ipinahahayag sa modernong Tagalog ang dagdag na impormasyong pangangkanan.
- source_word: צְרוּיָה
  choice: Zeruya
  rationale: Isinalin sa baybay na madaling basahin sa Tagalog at malapit sa anyong Hebreo ng pangalan.
- source_word: וַאֲבִיגָיִל
  choice: at Abigail
  rationale: Pinanatili ang pang-ugnay at ginamit ang nakagawiang anyo ng pangalan sa Tagalog.
- source_word: וּבְנֵי צְרוּיָה
  choice: Ang mga anak na lalaki ni Zeruya
  rationale: Tuwirang ipinapakita ang construct phrase at nililinaw na mga anak na lalaki ang tinutukoy, gaya ng Hebreong בְנֵי.
- source_word: אַבְשַׁי
  choice: Abisai
  rationale: Ginamit ang anyong angkop sa ponolohiya at pagbabaybay ng Tagalog.
- source_word: וְיוֹאָב
  choice: Joab
  rationale: Pinanatili ang kinikilalang anyo ng personal na pangalan; ang pang-ugnay ay natural na inilagay bago ang huling pangalan sa talaan.
- source_word: וַעֲשָׂהאֵל
  choice: at Asahel
  rationale: Pinanatili ang pangalan at ang pang-ugnay sa huling bahagi ng listahan.
- source_word: שְׁלֹשָׁה
  choice: tatlo
  rationale: Pinanatili ang tahasang buod na bilang sa Hebreo kahit malinaw na ang dami mula sa listahan.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “sina” para sa mga pangalan ng tao at ang em dash upang natural na maihiwalay ang pangwakas na bilang na “tatlo.”
