translation_notes:
  register: Maikli, marangal, at likas na pormula ng talaangkanan sa modernong Filipino. Ginamit ang “ay sina” upang malinaw na ipakilala ang sunod-sunod na mga pangalan. Walang kailangang talababa sapagkat walang mahalagang tekstuwal o semantikong kalabuan sa talata.
