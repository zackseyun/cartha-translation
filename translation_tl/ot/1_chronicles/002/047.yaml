  text: 'The sons of Jahdai: Regem, Jotham, Geshan, Pelet, Ephah, and Shaaph.'
translation:
  language: tl
  text: Ang mga anak ni Jahdai ay sina Regem, Jotam, Geshan, Pelet, Efa, at Shaaf.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי
  choice: Ang mga anak ni
  rationale: Ang בְּנֵי ay pangmaramihang anyong construct ng “mga anak na lalaki” at karaniwang pormula sa talaangkanan. Sapat at likas sa Filipino ang “mga anak,” yamang malinaw sa kasunod na mga pangalan ang konteksto; hindi na isinama ang panimulang וּ (“at”) dahil nagsisimula rito ang isang hiwalay na pangungusap/tala sa talata at magiging alanganin ang “At ang” sa Filipino.
- source_word: יָהְדָּי
  choice: Jahdai
  rationale: Pangalang pantangi; pinanatili ang anyong madaling makilala at malapit sa nakaugaliang transliterasyon.
- source_word: רֶגֶם
  choice: Regem
  rationale: Direktang transliterasyon ng pangalang pantangi.
- source_word: יוֹתָם
  choice: Jotam
  rationale: Ang “Jotam” ay likas sa ortograpiyang Filipino at kumakatawan sa tunog ng unang Hebreong katinig bilang yod na tradisyonal ding isinusulat na J sa mga pangalang biblikal sa Filipino.
- source_word: גֵישָׁן
  choice: Gesan
  rationale: Transliterasyong inangkop sa malinaw at likas na bigkas sa Filipino; ang שׁ ay kinakatawan ng “s” sa halip na digrapong Ingles na “sh.”
- source_word: פֶלֶט
  choice: Pelet
  rationale: Direktang transliterasyon; pinanatili ang huling tunog na t.
- source_word: עֵיפָה
  choice: Efa
  rationale: Pangalang pantangi rito, hindi pangalan ng takalang tuyo. Ang “Efa” ay natural na anyong Filipino at kumakatawan sa Hebreong pangalan nang hindi ginagamit ang ortograpiyang Ingles na “ph.”
- source_word: שָׁעַף
  choice: Shaaf
  rationale: Transliterasyon ng pangalang pantangi; pinanatili ang “sh” upang hindi mapagkamalang karaniwang salitang Filipino at ang dobleng patinig upang ipahiwatig ang dalawang pantig na pinaghiwalay ng katinig na ע sa pinagmulan.
