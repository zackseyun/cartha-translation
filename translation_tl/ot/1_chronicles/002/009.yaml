  yaml_path: translation/ot/1_chronicles/002/009.yaml
  text: 'The sons of Hezron who were born to him: Jerahmeel[a], Ram, and Chelubai.'
translation:
  language: tl
  text: Ang mga anak ni Hezron na ipinanganak sa kaniya ay sina Jerahmeel, Ram, at Kelubai.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Malamang na si Kelubai rin ang tinatawag na Kaleb sa ibang bahagi ng talaangkanang ito.
    reason: alternative_reading
lexical_decisions:
- source_word: וּ/בְנֵי
  choice: Ang mga anak ni
  rationale: Ang anyong construct na maramihan ng בֵּן ay likas na isinasaling “mga anak ni” sa talaangkanan. Hindi na hiwalay na isinalin ang panimulang pangatnig dahil magiging alanganin ito sa makabagong Tagalog.
- source_word: חֶצְרוֹן
  choice: Hezron
  rationale: Pangalan ng tao; pinanatili ang karaniwang anyo ng pangalan sa mga saling Filipino.
- source_word: אֲשֶׁר נוֹלַד לוֹ
  choice: na ipinanganak sa kaniya
  rationale: Pinananatili nito ang pasibong anyo ng Niphal ng ילד at malinaw na tumutukoy si “kaniya” kay Hezron, nang hindi ginagawang aktibong “kaniyang naging anak.”
- source_word: אֶת
  choice: —
  rationale: Pananda ito ng tuwirang layon sa Hebreo at wala itong hiwalay na katumbas na kailangang ilagay sa Tagalog.
- source_word: יְרַחְמְאֵל
  choice: Jerahmeel
  rationale: Pangalan ng tao; tuwirang transliterasyon na nagpapanatili sa anyo ng pangalang Hebreo.
- source_word: רָם
  choice: Ram
  rationale: Pangalan ng tao; tuwirang transliterasyon.
- source_word: כְּלוּבָי
  choice: Kelubai
  rationale: Tuwirang kinakatawan ang pangalang כְּלוּבָי sa halip na itugma agad sa mas kilalang pangalang Kaleb. Ang posibleng pagkakakilanlan kay Kaleb ay inilagay sa talababa.
