base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/019.yaml
  text: Azubah died[a], and Caleb took Ephrath as his wife[b], and she bore Hur to him.
translation:
  language: tl
  text: Namatay si Azuba. Pagkatapos, kinuha ni Caleb si Efrat[b] bilang asawa[a], at ipinanganak niya kay Caleb si Hur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “pinakasalan ni Caleb si Efrat.” Literal na sinasabi sa Hebreo na “kinuha ni Caleb si Efrat,” isang idyoma para sa pag-aasawa.
    reason: lexical_alternative
  - marker: b
    text: Sa ibang kaugnay na anyo, maaari ring baybayin ang pangalan na “Efrata,” ngunit ang Hebreo rito ay gumagamit ng mas maikling anyong “Efrat.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּמָת
  choice: Namatay
  rationale: Tuwirang katumbas ng karaniwang pandiwang Hebreo para sa pagkamatay; iniwasan ang eupemismo.
- source_word: עֲזוּבָה
  choice: Azuba
  rationale: Transliterasyon ng pangalang pantangi sa anyong madaling basahin sa Filipino.
- source_word: וַיִּקַּח לוֹ
  choice: kinuha ... bilang asawa
  rationale: Pinananatili ang larawan ng idyomang Hebreo habang malinaw na ipinahahayag na pag-aasawa ang tinutukoy.
- source_word: כָלֵב
  choice: Caleb
  rationale: Ginamit ang nakagawiang anyo ng pangalan sa mga saling Filipino.
- source_word: אֶפְרָת
  choice: Efrat
  rationale: Tuwirang transliterasyon ng maikling anyong אֶפְרָת sa talatang ito.
- source_word: וַתֵּלֶד לוֹ
  choice: ipinanganak niya kay Caleb
  rationale: Natural na pahayag sa Filipino para sa panganganak ng isang anak para sa ama, habang pinananatili ang di-tuwirang layon na לּוֹ.
- source_word: חוּר
  choice: Hur
  rationale: Transliterasyon ng pangalang pantangi.
