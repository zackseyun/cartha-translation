  text: Shema fathered Raham[a], the father of Jorkeam; and Rekem fathered Shammai.
translation:
  language: tl
  text: Si Shema ay naging ama ni Raham,[a] na ama ni Jorkeam; at si Rekem ay naging ama ni Shammai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “si Raham, na tagapagtatag o ninuno ng Jorkeam.” Ang Hebreong pananalitang “ama ni” ay maaaring tumukoy sa tagapagtatag o ninuno, lalo na sa mga talaangkanang may kaugnayan sa mga angkan o pamayanan.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹלִיד
  choice: naging anak ni
  rationale: Sa talaangkanan, malinaw at likas sa modernong Tagalog ang pariralang ito para sa Hiphil ng ילד, nang hindi gumagamit ng masyadong lumang pananalitang “ipinanganak kay.”
- source_word: אֲבִי
  choice: ama ni
  rationale: Pinananatili nito ang tuwirang anyo ng Hebreo, habang inilalagay sa talababa ang posibleng kahulugang tagapagtatag o ninuno ng isang angkan o pamayanan.
- source_word: יָרְקֳעָם
  choice: Jorkeam
  rationale: Pangngalang pantangi; isina-Tagalog ang baybay ayon sa anyong Hebreo at sa ibinigay na kumbensiyon.
- source_word: שֶׁמַע
  choice: Sema
  rationale: Pangngalang pantangi; ang “sh” ng transliterasyong Ingles ay karaniwang kinakatawan ng “s” sa baybay-Filipino.
- source_word: רַחַם
  choice: Raham
  rationale: Pangngalang pantangi; transliterasyon ng Hebreong pangalan.
- source_word: רֶקֶם
  choice: Rekem
  rationale: Pangngalang pantangi; transliterasyon ng Hebreong pangalan.
- source_word: שַׁמָּי
  choice: Samai
  rationale: Pangngalang pantangi; modernong baybay-Filipino na kumakatawan sa Hebreong tunog.
