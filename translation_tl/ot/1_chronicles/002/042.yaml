base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/042.yaml
  text: 'And the sons of Caleb the brother of Jerahmeel: Mesha his firstborn[a], who was the father of Ziph[b], and the sons of Mareshah the father of Hebron.'
translation:
  language: tl
  text: At ang mga anak ni Caleb na kapatid ni Jerahmeel ay si Mesha na kanyang panganay, na siyang ama ng Ziph[b], at ang mga anak ni Mareshah na ama ng Hebron.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mahirap ang sintaks ng huling sugnay sa Hebreo. Literal na mababasa sa Masoretic Text: “at ang mga anak ni Mareshah, na ama ng Hebron.” Nauunawaan ito ng ilan bilang “si Mareshah na ama ng Hebron,” samantalang pinananatili naman ng iba ang pagkakasabi ng tekstong Hebreo gaya ng salin dito.'
    reason: alternative_reading
  - marker: b
    text: Sa Mga Cronica, ang “ama ng” ay maaaring tumukoy hindi lamang sa tunay na ama kundi pati sa isang ninuno, pinuno ng angkan, o tagapagtatag na kaugnay ng isang lugar.
    reason: cultural_note
lexical_decisions:
- source_word: וּבְנֵי
  choice: At ang mga anak ni
  rationale: Pinananatili ang karaniwang pormulang pangtalaan ng angkan na “mga anak ni.” Maaari itong tumukoy sa tuwirang mga anak o sa mas malawak na mga inapo, ngunit hindi nilalawak ang kahulugan sa pangunahing teksto.
- source_word: כָלֵב
  choice: Caleb
  rationale: Pangngalang pantangi na pinanatili sa karaniwang anyong biblikal.
- source_word: אֲחִי יְרַחְמְאֵל
  choice: na kapatid ni Jerahmeel
  rationale: Likas na Tagalog para sa pariralang konstruktong “kapatid ni Jerahmeel,” bilang paglalarawan kay Caleb.
- source_word: מֵישָׁע בְּכֹרוֹ
  choice: si Mesha na kanyang panganay
  rationale: Ang בְּכוֹר ay “panganay,” na nagpapanatili kapuwa sa pagkakasunod ng kapanganakan at sa katayuang kaugnay nito.
- source_word: הוּא אֲבִי זִיף
  choice: na siyang ama ng Ziph
  rationale: Ang הוּא ay nagsisilbing muling pagtukoy kay Mesha. Pinananatili ng “ama ng” ang malawak na saklaw ng אָב sa talaangkanan sa halip na ipasya kung literal na ama, ninuno, pinuno ng angkan, o tagapagtatag ang ibig sabihin.
- source_word: וּבְנֵי מָרֵשָׁה
  choice: at ang mga anak ni Mareshah
  rationale: Tuwirang pinananatili ang ikalawang pormulang “mga anak ni” sa Masoretic Text, sa halip na baguhin ang mahirap na sintaks.
- source_word: אֲבִי חֶבְרוֹן
  choice: na ama ng Hebron
  rationale: Pinananatili ang literal na “ama ng Hebron” at ang posibleng ugnayan nito kay Mareshah nang hindi ipinapalit ang mas tiyak na “tagapagtatag.”
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang pormulang pangtalaangkanan na “mga anak ni” at ang sadyang hindi tiyak na “ama ng.” Ang bahagyang alanganing huling sugnay ay hindi pinakinis sa paraang magpapasya sa mahirap na sintaks ng Hebreo; ipinaliwanag ito sa talababa.
