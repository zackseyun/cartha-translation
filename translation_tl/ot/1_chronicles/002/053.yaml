  naturalness: Ang inayos na pangungusap ay natural at malinaw sa makabagong Filipino. Ang isang “ang mga” para sa magkakasunod na talaan ng mga pangkat ay mas maayos kaysa paulit-ulit na pagtukoy.
  terminology: Ang “mga angkan” ay angkop para sa מִשְׁפְּחוֹת sa kontekstong talaangkanan. Ang “nagmula” ay wastong pagpapahayag ng genealogical na diwa ng יָצְאוּ, habang ipinapaliwanag ng talababa ang literal na pandiwang Hebreo.
