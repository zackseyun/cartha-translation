  yaml_path: translation/ot/1_chronicles/002/053.yaml
  text: 'And the clans of Kiriath-jearim: the Ithrites[a], the Puthites, the Shumathites, and the Mishraites[b]. From these came the Zorathites and the Eshtaolites.'
translation:
  language: tl
  text: 'At ang mga angkan[a] ng Kiriat-jearim: ang mga Itrita, Putita, Shumatita, at Misraita. Mula sa mga ito nagmula[b] ang mga Zoraita at Estaolita.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga pamilya.” Ang salitang Hebreo ay madalas tumukoy sa malalaking pangkat ng magkakamag-anak sa loob ng isang lipi o talaangkanan.
    reason: lexical_alternative
  - marker: b
    text: Literal na “lumabas.” Dito, tumutukoy ito sa pinagmulan o paglitaw ng mga pangkat mula sa mga naunang binanggit na angkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִשְׁפְּחוֹת
  choice: At ang mga angkan
  rationale: Sa talaangkanan, ang מִשְׁפָּחוֹת ay tumutukoy sa malalaking pangkat na magkakamag-anak, hindi lamang sa sambahayan o nuklear na pamilya.
- source_word: קִרְיַת יְעָרִים
  choice: Kiriat-jearim
  rationale: Pangalan ito ng lugar, kaya tinumbasan sa paraang transliterasyon na angkop sa modernong Filipino.
- source_word: הַיִּתְרִי וְהַפּוּתִי וְהַשֻּׁמָתִי וְהַמִּשְׁרָעִי
  choice: ang mga Itrita, mga Putita, mga Sumatita, at mga Misraita
  rationale: Mga katawagan ito sa mga angkan o pangkat; ginamit ang hulaping Filipino na -ita bilang likas na anyo para sa mga taong kaugnay ng isang pangalan o lugar.
- source_word: מֵאֵלֶּה
  choice: Sa mga ito
  rationale: Malinaw nitong itinuturo ang mga naunang binanggit na angkan bilang pinagmulan ng kasunod na mga pangkat.
- source_word: יָצְאוּ
  choice: nagmula
  rationale: Bagaman literal na nangangahulugang ‘lumabas,’ ipinahihiwatig dito ng konteksto ng talaangkanan ang pinagmulan o paglitaw ng mga pangkat.
- source_word: הַצָּרְעָתִי וְהָאֶשְׁתָּאֻלִי
  choice: ang mga Zoraita at mga Estaolita
  rationale: Mga katawagang hinango sa Zora at Estaol; pinanatili ang ugnayan sa mga pangalan ng lugar sa pamamagitan ng transliterasyon at hulaping Filipino na -ita.
