  verdict: revise
  source_fidelity: Ang "pinuntahan" ay masyadong pangkaraniwan at hindi sapat na nagpapahiwatig sa Hebreong idyomang בָּא אֶל, na sa kontekstong ito ay tumutukoy sa pagsiping o pagsasamang mag-asawa. Ang "sumiping" ay maingat ngunit mas tapat na salin. Ang "kinuha niya ito bilang asawa," edad ni Hezron, at ang pagsilang kay Hezron ni Segub ay tumutugon sa Hebreo.
  naturalness: Mas natural at malinaw sa makabagong Filipino ang "Kinuha niya ito bilang asawa" kaysa "Kinuha niya itong asawa." Ang tahasang pagbanggit muli kay Hezron sa huling sugnay ay umiiwas sa malabong pagtukoy ng "nito" at "kaniya."
  terminology: Ang mga pangalang Hezron, Makir, Gilead, at Segub ay angkop na mga transliterasyon. Pinananatili ang "ama ni Gilead," kasama ang talababa hinggil sa genealogical na lawak ng "ama."
  issues:
