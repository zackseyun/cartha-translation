    issue: Hindi sapat ang "pinuntahan" para sa בָּא אֶל.
    rationale: Maaari lamang itong mangahulugang pagbisita o paglapit, samantalang ang idyoma sa talatang ito ay maingat na tumutukoy sa seksuwal/marital na pagsasama.
