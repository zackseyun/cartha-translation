    rationale: Mas idiomatiko ang "Kinuha niya ito bilang asawa"; pinananatili nito ang leksikal na larawan ng Hebreo at ang implikasyong pag-aasawa.
  - severity: low
    issue: Malabo ang mga panghalip sa huling sugnay.
    rationale: Ang "ipinanganak nito sa kaniya" ay maaaring makalito sa modernong Filipino. Ang "nagsilang siya kay Hezron" ay malinaw at pinananatili ang datibong לוֹ.
