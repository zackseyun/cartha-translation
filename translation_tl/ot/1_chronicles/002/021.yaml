  register: Gumamit ng makabago ngunit marangal at payak na Filipino. Pinanatili ang maingat na pahiwatig ng idyomang Hebreo tungkol sa pagsiping at ang posibleng lawak ng kahulugang panggenealohiya ng “ama,” habang ginawang malinaw at natural ang edad at ugnayang pangkasal.
