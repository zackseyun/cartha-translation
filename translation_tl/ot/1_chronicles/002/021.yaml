  to: Pagkatapos nito, sumiping si Hezron[a] sa anak na babae ni Makir, na ama ni Gilead.[b] Kinuha niya ito bilang asawa[c] nang siya ay animnapung taong gulang, at nagsilang siya kay Hezron ng isang anak na si Segub.
