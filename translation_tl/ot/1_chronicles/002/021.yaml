base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/021.yaml
  text: Afterward Hezron went in to the daughter of Machir the father of Gilead[a], and he took her when he was sixty years old[c][b], and she bore Segub to him.
translation:
  language: tl
  text: Pagkatapos nito, sumiping si Hezron[a] sa anak na babae ni Makir, na ama ni Gilead.[b] Kinuha niya ito bilang asawa[c] nang siya ay animnapung taong gulang, at nagsilang siya kay Hezron ng isang anak na si Segub.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang idyomang Hebreo na literal na “pumunta sa” ay isang maingat na pagtukoy sa pagsasamang mag-asawa o seksuwal na pagsiping.
    reason: lexical_alternative
  - marker: b
    text: Sa mga talaangkanan, ang “ama” ay maaari ring mangahulugang ninuno o tagapagtatag.
    reason: lexical_alternative
  - marker: c
    text: Ang “kinuha niya ito bilang asawa” ay maaari ring isaling “pinakasalan niya ito” o, nang mas literal, “kinuha niya ito.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחַר
  choice: Pagkatapos nito
  rationale: Likas na panandang temporal sa Filipino na malinaw na nagpapatuloy sa kasunod na pangyayari sa talaangkanan.
- source_word: בָּא אֶל
  choice: pinuntahan
  rationale: Pinananatili ang di-tahasang paraan ng Hebreo sa pagtukoy sa paglapit sa babae; ipinapaliwanag sa talababa na maaari itong tumukoy sa pagsasamang mag-asawa o seksuwal na pagsiping.
- source_word: בַּת מָכִיר
  choice: ang anak na babae ni Makir
  rationale: Tuwirang inililipat ang pariralang konstruktong Hebreo at pinananatili ang estilong talaangkanan.
- source_word: אֲבִי גִלְעָד
  choice: ama ni Gilead
  rationale: Ito ang pinakadirektang salin ng אָב, habang kinikilala sa talababa ang mas malawak na gamit nitong ninuno o tagapagtatag sa mga talaangkanan.
- source_word: לְקָחָהּ
  choice: Kinuha niya itong asawa
  rationale: Ipinapahayag ang karaniwang kahulugang pangkasal ng לקח kapag babae ang layon, ngunit pinananatili ang larawang ‘kinuha’ sa halip na gawing payak lamang na ‘pinakasalan.’
- source_word: וְהוּא בֶּן שִׁשִּׁים שָׁנָה
  choice: noong siya ay animnapung taong gulang
  rationale: Natural na Filipino para sa idyomang Hebreo na literal na ‘anak ng animnapung taon.’
- source_word: וַתֵּלֶד לוֹ
  choice: ipinanganak nito sa kaniya
  rationale: Pinananatili ang diwang ipinanganak para o sa kaniya, kabilang ang tahasang datibong לוֹ.
- source_word: שְׂגוּב
  choice: Segub
  rationale: Karaniwang angkop na transliterasyon sa Filipino ng pangalang Hebreo.
