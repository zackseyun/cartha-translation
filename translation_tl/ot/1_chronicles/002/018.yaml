base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/018.yaml
  text: 'And Caleb son of Hezron fathered children by Azubah his wife[a], and by Jerioth; and these were her sons: Jesher, Shobab[b], and Ardon.'
translation:
  language: tl
  text: 'Nagkaanak si Caleb na anak ni Hezron kay Azuba, na kanyang asawa[a], at kay Jeriot. Ito ang mga anak niya: sina Jeser, Sobab, at Ardon.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mahirap unawain ang ayos ng Hebreo. Maaaring si Jeriot ay isa pang babaeng iniugnay kay Caleb, o maaaring appositional siyang kaugnay ni Azuba sa ilang pagpapakahulugan.
    reason: alternative_reading
  - marker: b
    text: Sa Hebreo, “mga anak niya,” na may hulaping pambabae at isahan. May ilang mungkahing ibang ayos ng talaangkanan, ngunit pambabae ang anyo sa Tekstong Masoretiko.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹלִיד
  choice: nagkaanak kay
  rationale: Ang Hiphil ng ילד ay nangangahulugang magkaanak o maging ama. Likas sa modernong Tagalog ang “nagkaanak kay” kapag sinusundan ng pangalan ng babae, at hindi nito ipinahihiwatig na si Azuba mismo ang ipinanganak ni Caleb.
- source_word: אֶת עֲזוּבָה אִשָּׁה וְאֶת יְרִיעוֹת
  choice: kay Azuba na kaniyang asawa, at kay Jeriot
  rationale: Mahirap at siksik ang Hebreong ayos. Itinuturing dito ang אִשָּׁה bilang paglalarawan kay Azuba at ang Jeriot bilang isa pang pangalang iniugnay kay Caleb, habang inilalahad sa talababa ang posibilidad na magkaiba ang ugnayan ng mga pangalan.
- source_word: אִשָּׁה
  choice: kaniyang asawa
  rationale: Bagaman walang tahasang hulaping paari, “asawa” ang likas na kahulugan sa kontekstong talaangkanan; kailangan sa Tagalog ang “kaniyang” upang malinaw ang kaugnayan kay Caleb.
- source_word: יְרִיעוֹת
  choice: Jeriot
  rationale: Pangalan ng tao; isinalin sa baybay na madaling bigkasin sa Filipino.
- source_word: וְאֵלֶּה בָנֶיהָ
  choice: Ito ang mga anak niya
  rationale: Ang hulapi ng בָנֶיהָ ay pambabae at isahan, kaya pinanatili ang “niya” na tumutukoy sa isang babae sa halip na baguhin tungo sa mga anak ni Caleb.
- source_word: יֵשֶׁר וְשׁוֹבָב וְאַרְדּוֹן
  choice: Jeser, Sobab, at Ardon
  rationale: Mga pangalan ng tao; ginamit ang makabagong baybay-Filipino na malapit sa mga tunog ng Hebreo.
theological_decisions:
- issue: Kalabuan sa talaangkanan tungkol kina Azuba at Jeriot
  choice: Inilahad si Azuba bilang asawa ni Caleb at si Jeriot bilang isa pang babaeng iniugnay sa pagkakaanak niya; pinanatili rin ang pambabaeng “mga anak niya.”
  alternative: Maaaring appositional ang Jeriot kay Azuba, o maaaring ibang pagkakaugnay ng mga pangalan ang nilalayon ng mahirap na sintaks.
  rationale: Hindi tiyak ang kayarian ng Hebreo. Pinananatili ng salin ang malinaw na anyong pambabae ng hulapi nang hindi itinatago ang mas malawak na sintaktikong kalabuan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “nagkaanak kay” sa halip na mas lumang “nagkaanak sa” o “naging anak” upang likas na maipahayag ang genealogical na relasyon. Ang mga pangalan ay binaybay sa paraang angkop sa Filipino.
