  text: Shallum fathered Jekamiah, and Jekamiah fathered Elishama.
translation:
  language: tl
  text: Naging anak ni Salum si Jecamias, at naging anak ni Jecamias si Elisama.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שַׁלּוּם
  choice: Salum
  rationale: Pangalan ng tao; ginamit ang anyong natural sa tradisyong Tagalog at malapit sa tunog ng Hebreo.
- source_word: הוֹלִיד / הֹלִיד
  choice: naging anak ni
  rationale: Sa talaangkanan, ipinahahayag ng Hiphil ng ילד na ang isang lalaki ang ama ng kasunod na tao. Ang hulma na “naging anak ni X si Y” ay natural at malinaw sa modernong Tagalog nang hindi gumagamit ng makalumang “ipinanganak.”
- source_word: אֶת
  choice: '[hindi hiwalay na isinalin]'
  rationale: Pananda ito ng tiyak na tuwirang layon sa Hebreo at walang hiwalay na katumbas sa Tagalog; naipahihiwatig ang tungkulin nito sa ayos ng pangungusap.
- source_word: יְקַמְיָה / וִיקַמְיָה
  choice: Jecamias / at si Jecamias
  rationale: Pangalan ng tao; pinanatili ang pag-uulit ng pangalan at isinalin ang prefixed na ו bilang “at.” Ginamit ang anyong pangalang natural sa Tagalog.
- source_word: אֱלִישָׁמָע
  choice: Elisama
  rationale: Pangalan ng tao; ginamit ang anyong natural sa tradisyong Tagalog at malapit sa Hebreong pangalan.
