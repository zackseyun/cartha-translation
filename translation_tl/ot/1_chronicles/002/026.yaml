base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/026.yaml
  text: Jerahmeel also had another wife, and her name was Atarah; she was the mother of Onam.
translation:
  language: tl
  text: Nagkaroon din si Jerameel ng isa pang asawa na ang pangalan ay Atara; siya ang ina ni Onam.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתְּהִי ... לִירַחְמְאֵל
  choice: Nagkaroon din si Jerameel
  rationale: Ang היה na may ל ay nagpapahayag dito ng pag-aari o kaugnayan; ang “nagkaroon” ang natural na katumbas sa Filipino. Ipinahihiwatig ng pang-ugnay at ng konteksto na karagdagang asawa ang tinutukoy, kaya ginamit ang “din.”
- source_word: אִשָּׁה אַחֶרֶת
  choice: isa pang asawa
  rationale: Sa talaangkanang konteksto, ang אִשָּׁה ay “asawa,” at ang אַחֶרֶת ay nagsasaad ng isa pang bukod sa naunang nabanggit.
- source_word: יְרַחְמְאֵל
  choice: Jerameel
  rationale: Isina-Filipino ang baybay ng pangalang Hebreo ayon sa malinaw at madaling bigkasing transliterasyon.
- source_word: וּשְׁמָהּ
  choice: na ang pangalan ay
  rationale: Natural na Filipino para sa pormulang Hebreo na literal na “at ang pangalan niya,” habang napapanatili ang kaugnayan sa “asawa.”
- source_word: עֲטָרָה
  choice: Atara
  rationale: Transliterasyon ng pangalang pantangi sa anyong madaling basahin sa Filipino.
- source_word: הִיא אֵם
  choice: siya ang ina
  rationale: Pinananatili ang tahasang panghalip na הִיא at ang payak na kahulugan ng אֵם sa pahayag na talaangkanan.
- source_word: אוֹנָם
  choice: Onam
  rationale: Direktang transliterasyon ng pangalang pantangi.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang natural na konstruksiyong “nagkaroon ... ng” sa halip na ang literal ngunit di-likas na “nagkaroon kay Jerameel,” at pinanatiling payak ang estilong talaangkanan.
