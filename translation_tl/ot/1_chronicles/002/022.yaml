  yaml_path: translation/ot/1_chronicles/002/022.yaml
  text: Segub fathered Jair, and he had twenty-three cities in the land of Gilead.
translation:
  language: tl
  text: At naging ama ni Jair si Segub, at nagkaroon si Jair ng dalawampu't tatlong lunsod sa lupain ng Gilead.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּשְׂגוּב הוֹלִיד אֶת־יָאִיר
  choice: At naging anak ni Segub si Jair
  rationale: Sa talaangkanan, ang Hiphil ng ילד ay nangangahulugang 'magkaanak' o 'maging ama ni.' Ang likas na pariralang Filipino na 'naging anak ni Segub si Jair' ay malinaw na naghahayag ng ugnayang ama-anak nang hindi gumagamit ng makalumang 'ipinanganak ni,' na maaari ring magpahiwatig na si Segub ang nanganak.
- source_word: יָאִיר
  choice: Jair
  rationale: Pinanatili ang karaniwang anyo ng pangalang biblikal sa Filipino.
- source_word: וַיְהִי לוֹ
  choice: at nagkaroon si Jair ng
  rationale: Ang idyomang היה + ל ay nagpapahayag ng pag-aari o pagkakaroon. Inulit ang pangalang Jair upang alisin ang posibleng kalituhan sa panghalip na 'siya.'
- source_word: עֶשְׂרִים וְשָׁלוֹשׁ
  choice: dalawampu't tatlo
  rationale: Likas na modernong Filipino ang ganitong pagsasaad ng bilang.
- source_word: עָרִים
  choice: lunsod
  rationale: Maaaring tumukoy ang עִיר sa lunsod o bayan; pinili ang 'lunsod' bilang karaniwang salin sa ganitong ulat tungkol sa mga nasasakupang pamayanan.
- source_word: בְּאֶרֶץ הַגִּלְעָד
  choice: sa lupain ng Gilead
  rationale: Pinananatili ng 'lupain' ang tahasang אֶרֶץ at ang heograpikong diwa ng parirala.
theological_decisions:
- issue: Ang tinutukoy ng panghalip sa וַיְהִי לוֹ
  choice: si Jair
  alternative: si Segub
  rationale: Ang pinakamalapit na antecedent ay si Jair, at pinatutunayan ng kasunod na konteksto (1 Cronica 2:23) na ang mga lunsod ay tinutukoy bilang mga lunsod ni Jair. Kaya ginawang tahasan ang pangalan upang maging malinaw sa Filipino.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at angkop sa maikling estilong talaangkanan. Ginamit ang 'naging anak ni' sa halip na mas teknikal o makalumang pananalita.
