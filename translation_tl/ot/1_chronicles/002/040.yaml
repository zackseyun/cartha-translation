  yaml_path: translation/ot/1_chronicles/002/040.yaml
  text: Eleasah fathered Sismai, and Sismai fathered Shallum.
translation:
  language: tl
  text: Si Eleasa ang ama ni Sismai, at si Sismai ang ama ni Shallum.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֶלְעָשָׂה
  choice: Eleasa
  rationale: Isinalin sa karaniwang anyong Filipino ang pangalang Hebreo, nang hindi binibigyan ng kahulugang wala sa teksto.
- source_word: הֹלִיד
  choice: naging anak ni
  rationale: Sa kontekstong talaangkanan, tumutukoy ang Hiphil ng ילד sa pagiging ama o pag-aanak. Ang likas na pariralang Filipino na “naging anak ni X si Y” ay malinaw na naghahayag ng ugnayang genealogical at hindi gumagamit ng makalumang “ipinanganak ni,” na maaari ring magpahiwatig ng ina.
- source_word: אֶת
  choice: '[hindi hiwalay na isinalin]'
  rationale: Pananda ito ng tiyak na layon sa Hebreo at walang hiwalay na katumbas sa Filipino; naipapakita ang tungkulin nito sa ayos ng pangungusap.
- source_word: סִסְמָי
  choice: Sismai
  rationale: Tuwirang transliterasyon ng pangalang Hebreo sa anyong madaling basahin sa Filipino.
- source_word: וְ
  choice: at
  rationale: Payak na pangatnig na nag-uugnay sa dalawang sugnay ng talaangkanan.
- source_word: שַׁלּוּם
  choice: Shallum
  rationale: Pinanatili ang nakaugaliang anyo ng pangalang Hebreo, kasama ang “sh” upang makilala ito at hindi maipagkamali sa ibang pangalan.
