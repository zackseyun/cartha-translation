  text: Si Hur ang naging ama ni Uri, at si Uri ang naging ama ni Bezalel.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חוּר
  choice: Hur
  rationale: Pangalan ng tao; tinumbasan sa karaniwang transliterasyong Filipino.
- source_word: הוֹלִיד
  choice: naging ama ni
  rationale: Sa kontekstong talaangkanan, ang Hiphil ng ילד ay nagsasaad ng pagiging ama o pag-aanak. Natural at marangal sa modernong Tagalog ang “naging ama ni,” at hindi ito kasing-arkaiko ng “ipinanganak.”
- source_word: אֶת
  choice: '[hindi hiwalay na isinalin]'
  rationale: Pananda ito ng tuwirang layon sa Hebreo at walang hiwalay na katumbas sa Tagalog.
- source_word: אוּרִי
  choice: Uri
  rationale: Pangalan ng tao; pinanatili sa transliterasyon.
- source_word: וְ
  choice: at
  rationale: Payak na pang-ugnay sa dalawang magkasunod na pahayag sa talaangkanan.
- source_word: בְּצַלְאֵל
  choice: Bezalel
  rationale: Pangalan ng tao; ginamit ang nakaugaliang transliterasyon sa Filipino.
