  text: 'At ang mga anak ni Etan: si Azarias.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, ang “mga anak ni Etan” ay sinusundan ng iisang pangalan, “Azarias.” Maaaring ito ay pormula sa talaangkanan na nagpapakilala sa angkan ni Etan, o maaaring ang “mga anak” ay ginagamit sa mas malawak na diwa na tumutukoy sa mga inapo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְנֵי
  choice: At ang mga anak ni
  rationale: Pinananatili ng “At” ang pagkakaugnay nito sa naunang talaangkanan. Ang “mga anak ni” ang likas at tuwirang katumbas ng construct plural na בְנֵי, kahit iisang pangalan lamang ang kasunod.
- source_word: אֵיתָן
  choice: Etan
  rationale: Pangalang pantangi na isinalin sa karaniwang anyong Tagalog mula sa Hebreo.
- source_word: עֲזַרְיָה
  choice: Azarias
  rationale: Pangalang pantangi na ibinigay sa kinagawiang anyong Tagalog. Hindi pinakinis ang di-pagkakatugma ng pangmaramihang “mga anak” at ng nag-iisang pangalang kasunod.
