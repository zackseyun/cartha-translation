  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/תֵּ֗לֶד שַׁ֚עַף אֲבִ֣י מַדְמַנָּ֔ה אֶת שְׁוָ֛א אֲבִ֥י מַכְבֵּנָ֖ה וַ/אֲבִ֣י גִבְעָ֑א וּ/בַת כָּלֵ֖ב עַכְסָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/049.yaml
  text: Shepha fathered Sheva, the father of Machbenah and the father of Gibea; and Caleb’s daughter was Acsah.
translation:
  language: tl
  text: Ipinanganak din niya si Saaf, na ama ng Madmana, at si Seva, na ama ng Macbena at ng Gibea. Ang anak na babae ni Caleb ay si Acsa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֵּלֶד
  choice: Ipinanganak din niya
  rationale: Ang pandiwa ay ikatlong panauhang pambabae na isahan, kaya ipinagpapatuloy nito ang babaeng simuno mula sa naunang talata; ang “din” ay natural na nag-uugnay sa pagpapatuloy ng talaan.
- source_word: שַׁעַף
  choice: Saaf
  rationale: Malapit na transliterasyon sa Hebreo at angkop sa makabagong baybay sa Filipino.
- source_word: שְׁוָא
  choice: Seva
  rationale: Malapit na transliterasyon sa Hebreo; pinananatiling bukod sa pangalang Saaf.
- source_word: אֲבִי
  choice: ama ng
  rationale: Tuwirang salin ng katawagang pangangkanan; maaari rin itong tumukoy sa ninuno o tagapagtatag ng isang pamayanan, ngunit hindi nilinaw nang higit sa sinasabi ng teksto.
- source_word: וּבַת־כָּלֵב עַכְסָה
  choice: Ang anak na babae ni Caleb ay si Acsa
  rationale: Pinananatili ang payak na nominal na pahayag ng Hebreo at ang likas na ayos sa Filipino.
theological_decisions:
- issue: Simuno ng וַתֵּלֶד at ugnayan nina Saaf at Seva
  choice: Ang di-pinangalanang babaeng simuno mula sa naunang talata ang nagsilang kina Saaf at Seva.
  alternative: Si Saaf ang naging ama ni Seva.
  rationale: Ang וַתֵּלֶד ay pambabaeng isahan (“siya ay nagsilang”), at minamarkahan ng אֶת sina Saaf at Seva bilang magkatumbas na layon. Kaya hindi sinunod ang ugnayang nasa English consultation layer na ginagawang ama ni Seva si Saaf.
translation_notes:
  register: Makabagong Filipino na malinaw at marangal, na may payak na estilong angkop sa talaangkanan. Ginamit ang “ama ng” nang hindi sapilitang nilulutas kung biyolohikal na ama, ninuno, o tagapagtatag ng lugar ang tinutukoy.
