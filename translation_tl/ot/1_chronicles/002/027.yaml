base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/027.yaml
  text: 'The sons of Ram: Jerahmeel the firstborn[a], Maaz, Jamin, and Eker.'
translation:
  language: tl
  text: Ang mga anak ni Ram ay sina Jerameel na panganay, Maaz, Jamin, at Eker.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: ay sina
  rationale: Ang pandiwa ay nagsisilbing panimula sa talaan ng angkan. Likas sa Filipino ang hulma na “Ang mga anak ni Ram ay sina...” at napananatili nito ang diwa ng Hebreong pagpapakilala sa listahan.
- source_word: בְנֵי
  choice: mga anak ni
  rationale: Sa kontekstong ito ng talaangkanan, tumutukoy ito sa mga lalaking anak na isa-isang pinangalanan. Ang “mga anak ni” ang tuwiran at likas na salin.
- source_word: רָם
  choice: Ram
  rationale: Isinalin sa baybay na karaniwang ginagamit sa mga saling Filipino ng Bibliya.
- source_word: בְּכוֹר
  choice: panganay
  rationale: Tinutukoy nito si Jerameel bilang panganay ni Ram. Sapat at natural sa Filipino ang “na panganay” nang hindi na inuulit ang salitang “anak.”
- source_word: יְרַחְמְאֵל
  choice: Jerameel
  rationale: Transliterasyong angkop sa bigkas at baybay ng modernong Filipino.
- source_word: מַעַץ
  choice: Maaz
  rationale: Pinanatili bilang pangalang pantangi sa isang malinaw at pamilyar na transliterasyon.
- source_word: יָמִין
  choice: Jamin
  rationale: Pangalan ito rito, hindi ang karaniwang kahulugan ng salitang Hebreo; kaya transliterasyon ang ginamit.
- source_word: עֵקֶר
  choice: Eker
  rationale: Pinanatili bilang pangalang pantangi sa transliterasyong malapit sa anyong Hebreo.
theological_decisions: []
