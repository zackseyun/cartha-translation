base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/054.yaml
  text: 'The sons of Salma: Bethlehem[a], the Netophathites, Atroth-beth-joab, half of the Manahathites[b], the Zorites.'
translation:
  language: tl
  text: 'Ang mga anak ni Salma: Bethlehem, ang mga Netofatita, Atrot-bet-Joab, kalahati ng mga Manahatita[a], at ang mga Zorita[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga Menuhotita.” Hindi tiyak kung sa aling pangalan ng lugar eksaktong kaugnay ang katawagang Hebreo.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “mga Zoreatita,” samakatuwid, mga taong kaugnay ng Zora.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: Ang mga anak ni
  rationale: Pinananatili nito ang pormal na pananalita ng talaangkanan. Sa ganitong konteksto, maaaring kabilang sa “mga anak” ang mas malalayong inapo o mga angkan.
- source_word: שַׂלְמָא
  choice: Salma
  rationale: Tuwirang transliterasyon ng pangalang pantangi ayon sa anyong Hebreo.
- source_word: בֵּית לֶחֶם
  choice: Bethlehem
  rationale: Ginamit ang nakaugaliang anyo ng pangalan ng lugar. Sa talaang ito, maaaring kumatawan ang pangalan sa pamayanan o angkang kaugnay nito, ngunit hindi iyon tahasang nilinaw sa salin.
- source_word: וּנְטוֹפָתִי
  choice: ang mga Netofatita
  rationale: Ang anyong gentilic ay tumutukoy sa mga taong o angkang kaugnay ng Netofa; ang maramihang anyo ay likas sa Filipino sa ganitong talaan.
- source_word: עַטְרוֹת בֵּית יוֹאָב
  choice: Atrot-bet-joab
  rationale: Itinuring itong tambalang pangalan ng lugar o angkan sa halip na isalin nang literal ang mga bahagi nito.
- source_word: וַחֲצִי
  choice: kalahati ng
  rationale: Tuwirang ipinahahayag ang bahaging tinutukoy ng Hebreo; ang pag-uugnay nito sa talaan ay malinaw sa bantas at sa “at” bago ang huling pangalan.
- source_word: הַמָּנַחְתִּי
  choice: ang mga Manahatita
  rationale: Ang anyong gentilic ay malamang na tumutukoy sa isang pangkat o angkan na kaugnay ng Manahat. Pinanatili sa talababa ang kawalan ng katiyakan sa tiyak na kaugnayan ng pangalan.
- source_word: הַצָּרְעִי
  choice: ang mga Zorita
  rationale: Ang gentilic ay malamang na tumutukoy sa mga taong kaugnay ng Zora. Ang maikling transliteradong anyo ay angkop sa talaan, habang ibinibigay sa talababa ang mas hayag na alternatibo.
