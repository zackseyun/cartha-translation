  rationale: Pangalang pantangi; pinanatili ang nakaugaliang anyo sa mga saling Filipino.
- source_word: הַשְּׁבִעִי
  choice: ang ikapito
  rationale: Katumbas at kaagapay ng “ang ikaanim,” na nagsasaad ng puwesto ni David sa pagkakasunod-sunod.
