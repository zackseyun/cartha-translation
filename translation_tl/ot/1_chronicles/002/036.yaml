  text: וְ/עַתַּי֙ הֹלִ֣יד אֶת נָתָ֔ן וְ/נָתָ֖ן הוֹלִ֥יד אֶת זָבָֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/036.yaml
  text: Attai fathered Nathan, and Nathan fathered Zabad.
translation:
  language: tl
  text: Si Atai ay naging ama ni Natan, at si Natan ay naging ama ni Zabad.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/עַתַּי
  choice: Atai
  rationale: Pangalan ng tao; tinumbasan sa karaniwang anyong Filipino, na walang pagdodoble ng katinig na hindi likas sa modernong baybay.
- source_word: הֹלִיד
  choice: naging anak ni Atai si
  rationale: Ang Hiphil ng ילד sa talaangkanan ay nangangahulugang nagkaanak o naging ama. Ang hulma na “Naging anak ni X si Y” ay likas, malinaw, at marangal sa Filipino, at hindi nagdaragdag ng pahiwatig tungkol sa ina.
- source_word: אֶת
  choice: '[hindi hiwalay na isinalin]'
  rationale: Pananda ito ng tiyak na tuwirang layon sa Hebreo at walang hiwalay na katumbas sa Filipino.
- source_word: נָתָן
  choice: Natan
  rationale: Pangalan ng tao; tuwirang transliterasyon na angkop sa palatunugang Filipino.
- source_word: וְ/נָתָן
  choice: at naging anak ni Natan si
  rationale: Isinalin ang וְ bilang “at”; inulit ang likas na hulma ng talaangkanan para sa kalinawan at pagkakapare-pareho.
- source_word: הוֹלִיד
  choice: naging anak ni Natan si
  rationale: Kaparehong pandiwa at gamit sa talaangkanan; pinanatili ang parehong salin.
- source_word: זָבָד
  choice: Zabad
  rationale: Pangalan ng tao; tuwirang transliterasyon na malinaw at natural sa Filipino.
