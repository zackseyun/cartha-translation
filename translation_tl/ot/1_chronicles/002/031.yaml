base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/031.yaml
  text: 'The sons of Appaim: Ishi[a]; and the sons of Ishi: Sheshan; and the sons of Sheshan: Ahlai.'
translation:
  language: tl
  text: At ang mga anak[a] ni Appaim ay si Ishi; at ang mga anak ni Ishi ay si Sheshan; at ang mga anak ni Sheshan ay si Ahlai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga inapo” sa bawat paglitaw ng “mga anak”; sa mga talaangkanan, ang Hebreong בְּנֵי ay maaaring tumukoy sa isang linya ng mga inapo, bagaman “mga anak” ang mas tuwirang salin dito.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי
  choice: at ang mga anak ni
  rationale: Ang בְּנֵי ay literal na “mga anak ni” at karaniwang pormula sa mga talaangkanan. Pinanatili ang maramihang anyo kahit iisang pangalan lamang ang kasunod, gaya ng nasa Hebreo; maaari rin itong tumukoy nang mas malawak sa mga inapo.
- source_word: אַפַּיִם
  choice: Apaim
  rationale: Isinalin-titik ang pangalang Hebreo ayon sa likas na baybay at bigkas sa Filipino.
- source_word: יִשְׁעִי
  choice: Isi
  rationale: Isinalin-titik ang pangalang Hebreo sa paraang malinaw at madaling bigkasin sa Filipino, nang hindi ito ipinagkakamali sa ibang pangalang biblikal.
- source_word: שֵׁשָׁן
  choice: Sesan
  rationale: Isinalin-titik ang pangalan sa makabagong ortograpiyang Filipino, kung saan ang tunog na Hebreong sh ay kinakatawan ng s.
- source_word: אַחְלָי
  choice: Ahlai
  rationale: Pinanatili ang malapit na transliterasyon ng pangalang Hebreo; ang h ay kumakatawan sa katinig na ח nang hindi nagdaragdag ng interpretasyon.
theological_decisions: []
translation_notes:
  register: Makabago, payak, at marangal na Filipino. Pinanatili ang paulit-ulit na pormula ng talaangkanan at ang bahagyang di-tiyak na saklaw ng “mga anak,” habang ginawang natural sa Filipino ang paggamit ng “si” bago ang bawat pangalan.
