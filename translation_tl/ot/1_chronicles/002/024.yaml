base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/024.yaml
  text: After Hezron died in Caleb-ephrathah[a], Hezron’s wife Abijah bore to him Ashhur[b], the father of Tekoa.
translation:
  language: tl
  text: Pagkamatay ni Hezron sa Caleb-Efrata[a], nagsilang para sa kanya ang asawa niyang si Abias ng isang anak na si Ashhur, ang ama ng Tekoa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mahirap unawain ang pariralang Hebreo na isinaling “sa Caleb-Efrata.” Maaaring tumukoy ito sa isang lugar o sa katawagan ng isang angkan.
    reason: alternative_reading
  - marker: b
    text: O “ang tagapagtatag ng Tekoa.” Sa mga talaangkanan, ang “ama ng” ay maaaring tumukoy sa tagapagtatag o pangunahing ninuno ng isang pamayanan o angkan, hindi lamang sa mismong ama.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחַר מוֹת חֶצְרוֹן
  choice: Pagkamatay ni Hezron
  rationale: Likas at malinaw na temporal na salin ng pariralang nangangahulugang ‘pagkatapos mamatay si Hezron.’
- source_word: בְּכָלֵב אֶפְרָתָה
  choice: sa Caleb-Efrata
  rationale: Pinanatili ang beth bilang lokatibong ‘sa’ at ang dalawang pangalan bilang iisang mahirap tiyaking katawagan sa lugar o angkan; ipinaliliwanag sa talababa ang tunay na kalabuan.
- source_word: וְאֵשֶׁת חֶצְרוֹן אֲבִיָּה
  choice: ng asawa niyang si Abias
  rationale: Natural na Filipino para sa ‘asawa ni Hezron, si Abijah,’ habang malinaw na si Abias ang simuno ng panganganak.
- source_word: וַתֵּלֶד לוֹ
  choice: ipinanganak ... para sa kanya
  rationale: Pinananatili ang di-tuwirang kaugnayang ipinahahayag ng לוֹ at ang tensiyong dulot ng pagbanggit sa panganganak matapos ang kamatayan ni Hezron, sa halip na ipaliwanag o ayusin ito.
- source_word: אַשְׁחוּר
  choice: Ashur
  rationale: Makikilalang anyong Filipino ng personal na pangalan; ang dobleng katinig sa Hebreo ay hindi kailangang katawanin ng dobleng ‘h’ sa modernong Tagalog.
- source_word: אֲבִי תְקוֹעַ
  choice: ang ama ng Tekoa
  rationale: Tuwirang pinananatili ang אָב bilang ‘ama’; ang posibleng diwang ‘tagapagtatag’ o pangunahing ninuno ng pamayanan o angkan ay inilagay sa talababa.
