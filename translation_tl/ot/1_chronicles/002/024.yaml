translation_notes:
  register: Gumamit ng makabago ngunit marangal at madaling maunawaang Filipino. Pinanatili ang mahirap na sintaks at pagkakasunod-sunod ng Hebreo nang hindi palihim na nilulutas ang posibilidad ng kapanganakang binanggit matapos ang kamatayan ni Hezron. Inihanay ang mga marker sa mismong mga pariralang ipinaliliwanag ng bawat talababa.
