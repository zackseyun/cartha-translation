  text: וּ/בֹ֨עַז֙ הוֹלִ֣יד אֶת עוֹבֵ֔ד וְ/עוֹבֵ֖ד הוֹלִ֥יד אֶת יִשָֽׁי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/012.yaml
  text: Boaz fathered Obed, and Obed fathered Jesse.
translation:
  language: tl
  text: Si Boaz ang naging ama ni Obed, at si Obed ang naging ama ni Jesse.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/בֹעַז
  choice: Si Boaz
  rationale: Pangngalang pantangi; ginamit ang nakaugaliang anyo sa mga Bibliyang Tagalog, at nilagyan ng pantukoy na “si” ayon sa likas na balarila ng Tagalog.
- source_word: הוֹלִיד
  choice: ang naging ama ni
  rationale: Sa talaangkanan, ang Hiphil ng ילד ay tumutukoy sa pagiging ama o pag-aanak sa isang anak. Ang “naging ama ni” ay malinaw, natural, at marangal sa modernong Tagalog nang hindi gumagamit ng makalumang pananalita.
- source_word: אֶת
  choice: '[hindi isinalin]'
  rationale: Pananda ito ng tiyak na tuwirang layon sa Hebreo at walang hiwalay na likas na katumbas sa Tagalog; naipahihiwatig ang tungkulin nito ng kayarian ng pangungusap.
- source_word: עוֹבֵד
  choice: Obed
  rationale: Pangngalang pantangi; pinanatili ang nakaugaliang anyo sa tradisyong biblikal sa Tagalog.
- source_word: וְ/עוֹבֵד
  choice: at si Obed
  rationale: Isinalin ang pangatnig na וְ bilang “at,” at ginamit ang pantukoy na “si” bago ang pangalan ayon sa natural na Tagalog.
- source_word: הוֹלִיד
  choice: ang naging ama ni
  rationale: Inulit nang pareho ang salin ng pandiwang pang-talaangkanan upang mapanatili ang malinaw na paralelismo ng dalawang sugnay.
- source_word: יִשָׁי
  choice: Jesse
  rationale: Ginamit ang nakaugaliang anyo ng pangalan sa mga saling Bibliya sa Tagalog, sa halip na ang mas tuwirang transliterasyong “Yishai.”
theological_decisions: []
translation_notes:
  register: Maikli, natural, at marangal na modernong Filipino. Pinili ang “naging ama ni” kaysa “ipinanganak” o “naging anak,” sapagkat pinananatili nito ang pananaw at aktibong genealogical na diwa ng pandiwang Hebreo. Walang talababa dahil walang mahalagang tekstuwal o semantikong kalabuan na kailangang ipaliwanag sa talatang ito.
