  text: וְ/עֵיפָה֙ פִּילֶ֣גֶשׁ כָּלֵ֔ב יָֽלְדָ֛ה אֶת חָרָ֥ן וְ/אֶת מוֹצָ֖א וְ/אֶת גָּזֵ֑ז וְ/חָרָ֖ן הֹלִ֥יד אֶת גָּזֵֽז־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/046.yaml
  text: And Ephah[a], Caleb’s concubine, bore Haran, Moza, and Gazez; and Haran fathered Gazez.
translation:
  language: tl
  text: At si Efa, ang kalunya ni Caleb, ay nagsilang kina Haran, Moza, at Gazez; at naging ama si Haran ni Gazez.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פִּילֶגֶשׁ
  choice: kalunya
  rationale: Ito ang maikli at karaniwang salin sa Filipino para sa isang babaeng kinikilalang kabiyak ngunit may mas mababang katayuan kaysa sa pangunahing asawa. Pinananatili nito ang pagkakaiba ng katayuan nang hindi nagdaragdag ng paliwanag sa teksto.
- source_word: יָלְדָה
  choice: nagsilang
  rationale: Kapag babae ang simuno sa talaangkanan, likas at tuwirang ipinahahayag ng “nagsilang” ang panganganak.
- source_word: הֹלִיד
  choice: naging ama
  rationale: Ipinahahayag nito ang ugnayang panlalaking angkan ng Hiphil ng ילד sa natural at hindi makalumang Filipino.
- source_word: עֵיפָה
  choice: Efa
  rationale: Pangalang pantangi; isinalin sa baybay na madaling bigkasin sa Filipino.
- source_word: כָּלֵב
  choice: Caleb
  rationale: Pangalang pantangi; pinanatili ang nakaugaliang anyo sa Filipino.
- source_word: חָרָן
  choice: Haran
  rationale: Pangalang pantangi; pareho ang baybay sa dalawang paglitaw nito sa talata.
- source_word: מוֹצָא
  choice: Moza
  rationale: Pangalang pantangi; transliterasyong malinaw at madaling basahin sa Filipino.
- source_word: גָּזֵז
  choice: Gazez
  rationale: Pangalang pantangi; pareho ang baybay sa dalawang paglitaw nito.
- source_word: וְ
  choice: at
  rationale: Natural na pang-ugnay sa talaan ng mga pangalan at sa kasunod na sugnay.
- source_word: אֶת
  choice: '[hindi hiwalay na isinalin]'
  rationale: Walang tuwirang katumbas sa Filipino ang pananda ng tiyak na layon; naipahihiwatig ito ng ayos ng pangungusap at ng “kina/ni.”
theological_decisions: []
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “kina” para sa likas na paglalahad ng magkakasunod na pangalan at ang “naging ama” sa halip na makalumang “ipinanganak kay” o “begot.” Hindi isinama ang footnote ng English consultation layer sapagkat hindi tumutugma ang marker nito sa nilalaman at walang tekstuwal o leksikal na kalabuan sa Hebreo na nangangailangan ng gayong tala.
