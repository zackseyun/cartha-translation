base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/028.yaml
  text: The sons of Onam were Shammai and Jada[a]. The sons of Shammai were Nadab and Abishur.
translation:
  language: tl
  text: Ang mga anak na lalaki ni Onam ay sina Samai at Jada. Ang mga anak na lalaki naman ni Samai ay sina Nadab at Abisur.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “At ang mga anak na lalaki ni Samai ay sina Nadab at Abisur.” Inuulit sa Hebreo ang pormula ng talaangkanan na may pang-ugnay.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: ay sina
  rationale: Sa pormulang talaangkanan, ang pandiwa ay nagsisilbing pang-ugnay na nagsasaad kung sinu-sino ang mga anak. Ang “ay sina” ang likas na katumbas sa Tagalog para sa maramihang pangalang pantangi.
- source_word: בְנֵי
  choice: mga anak na lalaki ni
  rationale: Mga tuwirang lalaking anak ang tinutukoy sa talaangkanang ito; pinananatili ng salin ang kasariang tahasang nasa Hebreo.
- source_word: אוֹנָם
  choice: Onam
  rationale: Transliterasyon ng pangalang pantangi ayon sa karaniwang bigkas at baybay sa Filipino.
- source_word: שַׁמַּי
  choice: Samai
  rationale: Transliterasyon ng pangalang pantangi; pareho ang anyo sa dalawang paglitaw nito.
- source_word: יָדָע
  choice: Jada
  rationale: Transliterasyon ng pangalang pantangi batay sa anyong Hebreo.
- source_word: וּבְנֵי
  choice: Ang mga anak na lalaki naman ni
  rationale: Ipinahihiwatig ng “naman” ang paglipat sa kasunod na sangay ng talaangkanan sa natural na Tagalog. Ang mas literal na panimulang “At” ay inilagay sa talababa.
- source_word: נָדָב
  choice: Nadab
  rationale: Transliterasyon ng pangalang pantangi.
- source_word: אֲבִישׁוּר
  choice: Abisur
  rationale: Transliterasyon ng pangalang pantangi, na inaangkop ang sh sa karaniwang tunog at baybay na s sa Filipino.
