  rationale: Pangalan ng tao; direktang transliterasyon ng anyong Hebreo, na ang dobleng katinig ay hindi kailangang katawanin sa karaniwang baybay-Tagalog.
- source_word: הַחֲמִישִׁי
  choice: na ikalima
  rationale: Kaagapay ng naunang ordinal at malinaw na nagsasaad ng puwesto sa magkakasunod na anak.
