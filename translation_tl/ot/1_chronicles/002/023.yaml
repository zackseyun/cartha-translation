  text: וַ/יִּקַּ֣ח גְּשֽׁוּר וַ֠/אֲרָם אֶת חַוֺּ֨ת יָאִ֧יר מֵ/אִתָּ֛/ם אֶת קְנָ֥ת וְ/אֶת בְּנֹתֶ֖י/הָ שִׁשִּׁ֣ים עִ֑יר כָּל אֵ֕לֶּה בְּנֵ֖י מָכִ֥יר אֲבִי גִלְעָֽד־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/023.yaml
  text: But Geshur and Aram took the villages of Jair from them[a], along with Kenath and its daughter towns—sixty cities. All these were the sons of Machir[c][b], the father of Gilead.
translation:
  language: tl
  text: Ngunit kinuha sa kanila ng Gesur at Aram ang mga nayon ni Jair[a], pati ang Kenat at ang mga bayang sakop nito[b]—animnapung lungsod. Ang lahat ng ito ay mga anak ni Makir[c], na ama ni Gilead.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Havot-Jair,” isang pangalang-pook na nangangahulugang “mga nayong-tolda ni Jair.”
    reason: lexical_alternative
  - marker: b
    text: Literal na “mga anak na babae nito,” na tumutukoy sa mga pamayanang nakapaligid at umaasa sa Kenat.
    reason: cultural_note
  - marker: c
    text: Ang “mga anak ni Makir” ay maaaring tumukoy sa mga inapo o mga kabilang sa kanyang angkan, at hindi lamang sa kanyang mga tuwirang anak.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: kinuha
  rationale: Pinananatili ang malawak na diwa ng pagkuha o pag-angkin ng teritoryo nang hindi tiyak na ipinapalagay ang paraan ng pagsakop.
- source_word: גְּשׁוּר וַאֲרָם
  choice: Gesur at Aram
  rationale: Mga pangalang pantangi ang mga ito; pinanatili ang Aram sa halip na gamitin ang mas huling pangalang Siria.
- source_word: חַוֺּת יָאִיר
  choice: mga nayon ni Jair
  rationale: Likas at malinaw sa modernong Tagalog, habang inilalagay sa talababa ang posibilidad na basahin ito bilang pangalang-pook.
- source_word: מֵאִתָּם
  choice: sa kanila
  rationale: Sa pariralang 'kinuha sa kanila,' malinaw na ipinahihiwatig ang pag-aalis mula sa kanilang pag-aari o kapangyarihan.
- source_word: קְנָת
  choice: Kenat
  rationale: Tuwirang transliterasyon ng pangalang-pook ayon sa bigkas ng Hebreo.
- source_word: בְּנֹתֶיהָ
  choice: mga bayang sakop nito
  rationale: 'Inihahatid ang idyomatikong kahulugan ng literal na ''mga anak na babae nito'': mga nakapaligid at nakaugnay na pamayanan ng Kenat.'
- source_word: שִׁשִּׁים עִיר
  choice: animnapung lungsod
  rationale: Tuwirang katumbas ng bilang at ng pangngalang עִיר, na maaaring tumukoy sa lungsod o bayan.
- source_word: כָּל אֵלֶּה
  choice: Ang lahat ng ito
  rationale: Pinananatili ang pormal na kalabuan ng tinutukoy ng parirala sa Hebreo.
- source_word: בְּנֵי מָכִיר
  choice: mga anak ni Makir
  rationale: Tuwirang salin na nagpapanatili sa pananalitang pangangkan; nililinaw sa talababa na maaari itong tumukoy sa mas malawak na mga inapo o kaangkan.
- source_word: אֲבִי גִלְעָד
  choice: ama ni Gilead
  rationale: Pinananatili ang idyomang Hebreo at ang ugnayang pangangkan nang hindi ito tahasang ginagawang 'ninuno' o 'tagapagtatag.'
