translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang 'mga bayang sakop nito' upang natural na maipahayag ang sinaunang idyoma, habang pinanatili sa talababa ang literal na larawan. Inilagay ang mga marker ayon sa pagkakasunod-sunod ng paglitaw sa teksto.
