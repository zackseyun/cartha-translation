  rationale: Tumutukoy rito sa mga lalaking anak mismo ni Israel, hindi sa mas malawak na mga inapo; sa Filipino, likas at sapat ang “mga anak ni” sa kontekstong ito.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Pinananatili ang pangalang ginamit sa tekstong Hebreo sa halip na palitan ito ng Jacob.
- source_word: רְאוּבֵן
