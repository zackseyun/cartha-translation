- source_word: אֵלֶּה
  choice: Ito ang
  rationale: Likas na panimulang pormula sa Filipino para sa deiktikong maramihan na nagpapakilala ng isang talaan; hindi kailangang gayahin ang bilang ng panghalip sa Hebreo.
- source_word: בְּנֵי
