  rationale: Karaniwang anyo sa Filipino; hindi hiwalay na isinalin ang pang-ugnay dito upang maging natural ang serye ng mga pangalan, habang nananatili ang huling “at.”
- source_word: יִשָׂשכָר
  choice: Isacar
  rationale: Karaniwang anyo ng pangalang biblikal sa Filipino.
- source_word: וּזְבֻלוּן
  choice: at Zebulun
  rationale: Pinananatili ang tahasang pang-ugnay sa dulo ng talaan at ginagamit ang kinikilalang anyong biblikal ng pangalan.
