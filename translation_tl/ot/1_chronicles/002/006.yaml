  terminology: Ang “mga anak ni” ay katanggap-tanggap at karaniwan sa mga talaangkanan sa Filipino, bagaman ang Hebreo ay literal na “mga anak na lalaki.” Ang mga transliterasyong Zera, Etan, Heman, Kalkol, at Dara ay magkakatugma at angkop. Tama at sapat ang talababa sa Dara/Darda; hindi kinakailangan ang talababa para sa isang tradisyonal na baybay sa Ingles ng Kalkol.
