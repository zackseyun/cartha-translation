base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/006.yaml
  text: 'And the sons of Zerah: Zimri[a], Ethan, Heman, Kalkol[b], and Dara—five in all.'
translation:
  language: tl
  text: 'At ang mga anak ni Zera: sina Zimri, Etan, Heman, Kalkol, at Dara[a]—lima silang lahat.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dara ang nasa Hebreo rito; Darda naman ang mababasa sa kaugnay na tala sa 1 Hari 4:31.
    reason: cross_reference
lexical_decisions:
- source_word: וּבְנֵי
  choice: At ang mga anak ni
  rationale: Ang בְּנֵי ay pangmaramihang anyong construct ng “mga anak na lalaki,” ngunit sa makabagong Tagalog, ang “mga anak ni” ang likas at sapat na malinaw sa talaangkanan. Pinanatili ng “At” ang dugtong sa naunang listahan.
- source_word: זֶרַח
  choice: Zera
  rationale: Pangalang pantangi; tinumbasan ayon sa likas na baybay at bigkas sa Filipino.
- source_word: זִמְרִי
  choice: Zimri
  rationale: Pangalang pantangi; tuwirang transliterasyon.
- source_word: וְאֵיתָן
  choice: Etan
  rationale: Pangalang pantangi; ang “Etan” ay likas na transliterasyon sa Filipino ng אֵיתָן.
- source_word: וְהֵימָן
  choice: Heman
  rationale: Pangalang pantangi; transliterasyong malinaw sa Filipino.
- source_word: וְכַלְכֹּל
  choice: Kalkol
  rationale: Tuwirang inilalarawan ng “Kalkol” ang mga katinig ng Hebreong כַלְכֹּל.
- source_word: וָדָרַע
  choice: Dara
  rationale: Sinusunod ang tekstong Hebreo ng talatang ito, na may Dara, sa halip na itugma sa Darda ng 1 Hari 4:31.
- source_word: כֻּלָּם חֲמִשָּׁה
  choice: lima silang lahat
  rationale: Likas na pariralang Tagalog na pinananatili ang bilang at ang diwa ng “lahat sila, lima.”
theological_decisions: []
translation_notes:
  register: Makabago, payak, at marangal na Filipino. Ginamit ang “sina” bago ang listahan ng mga pangalan para sa natural na balarilang Tagalog. Hindi na nilagyan ng talababa ang Kalkol sapagkat ang alternatibong “Calcol” ay tradisyong baybay sa Ingles at hindi makabuluhang alternatibo sa saling Filipino.
