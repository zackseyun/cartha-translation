  source_fidelity: 'Tumpak ang salin sa tekstong Masoretiko: nakalista ang limang anak ni Zera—Zimri, Etan, Heman, Kalkol, at Dara—at malinaw na naipahahayag ang kabuuang bilang na lima. Hindi nito hinihiram ang anyong “Darda” mula sa 1 Hari 4:31 sa pangunahing teksto.'
