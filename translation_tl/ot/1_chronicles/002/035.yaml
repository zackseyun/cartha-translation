  text: Sheshan gave his daughter to Jarha his servant as a wife[a], and she bore Attai to him.
translation:
  language: tl
  text: Ibinigay ni Sesan ang kaniyang anak na babae kay Yarha, na kaniyang alipin, upang maging asawa ni Yarha. Ipinanganak niya kay Yarha si Atai.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: Ibinigay
  rationale: Tuwirang katumbas ng נתן at malinaw sa konteksto ng pag-aasawa dahil kasunod ang pariralang “upang maging asawa nito.”
- source_word: שֵׁשָׁן
  choice: Sesan
  rationale: Transliterasyon ng pangalang Hebreo sa baybay na likas basahin sa Filipino.
- source_word: בִּתּוֹ
  choice: ang kanyang anak na babae
  rationale: Tahasang pinananatili ang ugnayang ama-anak at ang kasarian ng anak.
- source_word: לְיַרְחָע
  choice: kay Yarha
  rationale: Ang לְ ay nagpapakilala sa tumanggap; ang Yarha ay transliterasyon mula sa Hebreo.
- source_word: עַבְדּוֹ
  choice: kanyang alipin
  rationale: Maaaring mangahulugan ang עֶבֶד ng alipin o lingkod. Pinili ang “alipin” upang maipakita ang nakadependeng katayuan ni Yarha sa sambahayan ni Sesan, habang inilalahad sa talababa ang leksikal na alternatibo.
- source_word: לְאִשָּׁה
  choice: upang maging asawa nito
  rationale: Natural na Filipino para sa karaniwang Hebreong pahayag tungkol sa pag-aasawa; ang “nito” ay tumutukoy kay Yarha.
- source_word: וַתֵּלֶד
  choice: nagsilang
  rationale: Karaniwang kahulugan ng Qal na ילד kapag babae ang simuno; angkop sa maikling estilong talaangkanan.
- source_word: לוֹ
  choice: para kay Yarha
  rationale: Ginawang tahas ang tinutukoy ng panghalip upang maiwasan ang kalituhan sa Filipino, habang pinananatili ang ugnayang paternal ng pormula ng kapanganakan.
- source_word: עַתָּי
  choice: Atai
  rationale: Transliterasyon ng pangalang Hebreo sa likas na baybay sa Filipino.
