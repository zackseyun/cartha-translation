lexical_decisions:
- source_word: בְּנֵי
  choice: mga anak ni
  rationale: Ang construct plural ng בֵּן sa talaangkanan ay tumutukoy rito sa mga anak na lalaki ni Perez. Sa natural na modernong Tagalog, sapat ang “mga anak ni,” yamang ang mga pangalang kasunod ang nagpapakitang mga lalaki ang tinutukoy.
- source_word: פֶרֶץ
  choice: Perez
  rationale: Ginamit ang nakasanayang modernong anyo ng pangalang biblikal sa Tagalog, sa halip na isalin ang kahulugan ng pangalan.
- source_word: חֶצְרוֹן
  choice: Hezron
  rationale: Tuwirang transliterasyon ng pangalang Hebreo ayon sa karaniwang anyong ginagamit sa mga saling Tagalog.
- source_word: וְחָמוּל
  choice: at Hamul
  rationale: Isinalin ang וְ bilang “at,” at pinanatili ang karaniwang anyong Tagalog ng pangalang Hamul.
