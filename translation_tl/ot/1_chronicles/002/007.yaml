  text: וּ/בְנֵ֖י כַּרְמִ֑י עָכָר֙ עוֹכֵ֣ר יִשְׂרָאֵ֔ל אֲשֶׁ֥ר מָעַ֖ל בַּ/חֵֽרֶם׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/007.yaml
  text: 'And the sons of Karmi: Achar[a], the troubler of Israel[b], who acted unfaithfully regarding the devoted things.'
translation:
  language: tl
  text: 'At ang mga anak ni Karmi: si Akar[a], ang manggugulo ng Israel, na hindi naging tapat sa usapin ng bagay na itinalagang lipulin[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Acan.” Ginagamit ng Mga Cronica ang anyong “Akar,” na maaaring umalingawngaw sa salitang Hebreo para sa “manggugulo.” Tingnan ang Josue 7.
    reason: alternative_reading
  - marker: b
    text: Hebreo, “ang itinalagang bagay”; tumutukoy ito sa bagay na inilagay sa ilalim ng pagbabawal at itinalagang lipulin. Sa salaysay ng Josue 7, maaaring saklaw nito ang mga bagay na hindi dapat kunin.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי
  choice: At ang mga anak ni
  rationale: Pinananatili ang maramihang anyong konstruktong ginagamit sa talaangkanan, kahit iisang pangalan lamang ang kasunod.
- source_word: כַּרְמִי
  choice: Karmi
  rationale: Tuwirang transliterasyon ng Hebreong pangalan ayon sa bigkas ng tekstong Masoretiko.
- source_word: עָכָר
  choice: Akar
  rationale: Pinananatili ang anyong עָכָר sa Cronica sa halip na iayon sa mas kilalang Acan ng Josue 7; ipinahihiwatig din ng anyong ito ang paglalaro sa kasunod na salitang עוֹכֵר.
- source_word: עוֹכֵר יִשְׂרָאֵל
  choice: ang nanggulo sa Israel
  rationale: Inilalarawan ng pandiwaring Hebreo si Akar bilang nagdulot ng kaguluhan o kapahamakan sa Israel. Maikli at likas sa Filipino ang 'nanggulo,' bagaman hindi ganap na maililipat ang tunog na paglalaro sa pangalang Akar.
- source_word: אֲשֶׁר מָעַל
  choice: na nagtaksil
  rationale: Ipinahahayag ng מעל ang paglabag sa katapatan, lalo na kaugnay ng bagay na banal; pinananatili ng 'nagtaksil' ang bigat na moral at panrelihiyon.
- source_word: בַּחֵרֶם
  choice: tungkol sa mga bagay na itinalagang lipulin
  rationale: Ipinakikita ng חֵרֶם ang bagay na inilaan sa Diyos at, sa kontekstong ito, itinakdang lipulin at ipinagbabawal kunin. Ginamit ang maramihan upang ipahayag ang kolektibong kahulugan sa salaysay ng Josue 7.
theological_decisions:
- issue: Kahulugan ng חֵרֶם sa salaysay ng pagtataksil at hatol
  choice: mga bagay na itinalagang lipulin
  alternative: bagay na inilaan; mga bagay na nasa ilalim ng pagbabawal
  rationale: Kasama sa termino ang paglalaan sa Diyos, pagbabawal sa karaniwang paggamit, at sa kontekstong ito ay pagtalaga sa paglipol. Nililinaw ng salin ang kontekstuwal na diwa nang hindi ipinapakahulugan na karaniwang handog lamang ang mga bagay.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Pinanatili ang estilong talaangkanan at ang maigsi, mapanuring paglalarawan kay Akar. Ang di-pamilyar na konsepto ng חֵרֶם at ang pagkakaiba ng pangalang Akar/Acan ay ipinaliwanag sa mga talababa.
