  verdict: revise
  source_fidelity: Ang “nanggulo” ay malapit sa עוֹכֵר, ngunit mas idiomatiko at mas tumutugma sa appositional participle ang “manggugulo.” Ang “mga bagay” sa pangunahing teksto ay lumalampas sa tahasang isahang anyo ng בַּחֵרֶם. Maaaring kolektibo ang tinutukoy sa salaysay, ngunit dapat panatilihin sa salin ang isahang anyo at ipaliwanag ang saklaw sa talababa.
  naturalness: Hindi likas sa pormal na modernong Filipino ang “nagtaksil tungkol sa.” Ang “hindi naging tapat sa usapin ng” ay malinaw, natural, at naihahayag ang breach-of-faith na diwa ng מָעַל nang hindi nagdaragdag ng partikular na legal na pagpapakahulugan.
  terminology: Pinananatili ang Akar upang igalang ang anyong עָכָר sa Cronica, kasama ang talababa para sa mas pamilyar na Acan. Ang “bagay na itinalagang lipulin” ay naghahatid ng diwa ng חֵרֶם nang hindi itinatago ang gramatikal na isahan. Inayos ang pangalan ng aklat sa talababa bilang “Mga Cronica.”
  issues:
  - severity: medium
    issue: Ang pangunahing teksto ay gumagamit ng maramihang “mga bagay” para sa בַּחֵרֶם.
    rationale: Ang Hebreo ay may tiyak na isahang anyo, “ang devoted thing.” Bagaman maaaring kolektibo ang reperensiya sa konteksto ng Josue 7, hindi dapat palitan ng pangunahing salin ang bilang ng pinagmulan; maaaring ipaliwanag sa talababa ang kontekstuwal na saklaw.
  - severity: medium
    issue: Hindi natural at kulang sa tiyak na ugnayan ang “na nagtaksil tungkol sa.”
    rationale: Ang מָעַל ay paglabag sa katapatan kaugnay ng banal o ipinagbabawal na bagay. Ang iminungkahing parirala ay mas likas at pinananatili ang kahulugang ito.
  - severity: low
    issue: Mas akma ang “manggugulo” kaysa “nanggulo” para sa participial apposition.
    rationale: Ang עוֹכֵר ay participle na naglalarawan kay Akar bilang “troubler,” hindi lamang isang nakaraang kilos.
  revised_text: 'At ang mga anak ni Karmi: si Akar[a], ang manggugulo ng Israel, na hindi naging tapat sa usapin ng bagay na itinalagang lipulin[b].'
