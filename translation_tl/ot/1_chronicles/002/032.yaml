  text: וּ/בְנֵ֤י יָדָע֙ אֲחִ֣י שַׁמַּ֔י יֶ֖תֶר וְ/יוֹנָתָ֑ן וַ/יָּ֥מָת יֶ֖תֶר לֹ֥א בָנִֽים׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/032.yaml
  text: 'The sons of Jada[a], Shammai’s brother: Jether and Jonathan. Jether died without sons.'
translation:
  language: tl
  text: Ang mga anak ni Jada, na kapatid ni Shammai, ay sina Jeter at Jonatan. Namatay si Jeter na walang mga anak na lalaki.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “namatay si Jeter, walang mga anak na lalaki.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי
  choice: Ang mga anak ni
  rationale: Ipinakikilala nito ang isang bagong sangay ng talaangkanan. Hindi na tahasang isinalin ang pang-ugnay na וּ sapagkat likas sa makabagong Tagalog ang tuwirang pagsisimula sa “Ang mga anak ni.”
- source_word: יָדָע
  choice: Jada
  rationale: Transliterasyon ng pangalang Hebreo ayon sa likas na bigkas at baybay sa Tagalog.
- source_word: אֲחִי שַׁמַּי
  choice: na kapatid ni Shammai
  rationale: Pinananatili ang literal na ugnayang pampamilya na “kapatid ni Shammai,” sa malinaw at natural na ayos sa Tagalog.
- source_word: יֶתֶר
  choice: Jeter
  rationale: Transliterasyong angkop sa Tagalog ng pangalang Hebreo; pareho ang anyo sa dalawang paglitaw.
- source_word: וְיוֹנָתָן
  choice: at Jonatan
  rationale: Isinalin ang pang-ugnay at ginamit ang karaniwang anyong Tagalog ng pangalan.
- source_word: וַיָּמָת
  choice: Namatay
  rationale: Ang payak na aspektong naganap ay natural na naghahayag ng kasunod na pangyayari sa talaangkanan.
- source_word: לֹא בָנִים
  choice: na walang mga anak na lalaki
  rationale: Ang literal na “walang mga anak na lalaki” ang pinakamalinaw na nagpapahayag na walang anak na lalaking magpapatuloy sa linya, nang hindi ipinapalagay na wala siyang anak na babae.
theological_decisions:
- issue: Kung ang לֹא בָנִים ay nangangahulugang lubusang walang anak o walang anak na lalaki
  choice: walang mga anak na lalaki
  alternative: walang anak
  rationale: Ang בָּנִים ay maaaring tumukoy sa mga anak sa pangkalahatan ngunit sa konteksto ng talaangkanan ay partikular na mahalaga ang mga anak na lalaki. Pinananatili ng salin ang leksikal at kontekstuwal na diin nang hindi sinasabing tiyak na wala siyang mga anak na babae.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog para sa karaniwang mambabasa. Ginamit ang “sina” sa dalawang personal na pangalan at pinanatili ang maikli at pormal na estilo ng talaangkanan.
