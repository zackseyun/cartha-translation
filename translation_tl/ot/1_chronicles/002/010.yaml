base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/010.yaml
  text: Ram fathered Amminadab[a], and Amminadab fathered Nahshon, leader of the sons of Judah.
translation:
  language: tl
  text: Si Ram ay naging ama ni Aminadab, at si Aminadab ay naging ama ni Naason, na pinuno[a] ng mga anak ni Juda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “prinsipe” o “pinunò.”
    reason: Ipinakikita ang leksikal na lawak ng נְשִׂיא; ang “pinunò” ay malinaw na alternatibo para sa ‘chief’ sa modernong Filipino.
lexical_decisions:
- source_word: הוֹלִיד
  choice: naging ama ni
  rationale: Sa talaangkanan, ang Hiphil ng ילד ay tumutukoy sa pag-aanak o pagiging ama. Likas ito sa modernong Tagalog at pinananatili ang panig ng ama sa talaangkanan nang hindi gumagamit ng lipas na pananalita.
- source_word: נְשִׂיא
  choice: pinuno
  rationale: Ang נָשִׂיא ay maaaring tumukoy sa lider, puno, o prinsipe. Ang “pinuno” ay malinaw at natural, at hindi nagpapahiwatig nang di-kinakailangan na anak siya ng hari.
- source_word: בְּנֵי יְהוּדָה
  choice: mga anak ni Juda
  rationale: Tuwirang pinananatili nito ang pananalitang Hebreo at ang panlalaki at pangangkanang balangkas ng talata.
- source_word: רָם / עַמִּינָדָב / נַחְשׁוֹן
  choice: Ram / Aminadab / Naason
  rationale: Isinatinig ang mga pangalang pantangi ayon sa anyong malinaw at nakasanayan sa modernong Filipino.
theological_decisions: []
translation_notes:
  register: Modernong, marangal, at madaling maunawaang Filipino. Ginamit ang malinaw na pormula ng talaangkanan at pinanatili ang literal na “mga anak ni Juda.” Inilagay ang talababa sa “pinuno,” ang salitang tunay na may leksikal na mga alternatibo.
