  source_fidelity: Tumpak na isinasalin ng teksto ang dalawang Hiphil ng ילד bilang “naging ama ni” at ang נְשִׂיא bilang “pinuno.” Ang “mga anak ni Juda” ay malapit sa literal na בְּנֵי יְהוּדָה at pinananatili ang pangangkanang balangkas. Ang sugnay na “na pinuno ...” ay wastong tumutukoy kay Naason.
  naturalness: Malinaw at marangal ang pangungusap. Mas likas at di-gaanong mariin sa karaniwang modernong Filipino ang paggamit ng “ay” kaysa sa paulit-ulit na “ang” sa pormulang talaangkanan. Ang alternatibong “puno” sa talababa ay maaaring malito sa karaniwang kahulugang ‘tree’ o ‘full’; ang “pinunò” ay mas malinaw para sa ‘chief.’
  terminology: Ang mga anyong Ram, Aminadab, Naason, at Juda ay angkop na Filipino transliterasyon. Ang “pinuno” ay mahusay na pangunahing katumbas ng נְשִׂיא, habang ang talababa ay dapat magbigay ng malinaw na leksikal na alternatibo nang hindi ipinahihiwatig na monarkiya ang pangunahing diwa.
