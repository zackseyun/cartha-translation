base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/043.yaml
  text: 'The sons of Hebron: Korah[a], Tappuah, Rekem, and Shema.'
translation:
  language: tl
  text: At ang mga anak ni Hebron ay sina Korah, Tapuah, Rekem, at Sema.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי
  choice: At ang mga anak ni
  rationale: Ang בְנֵי ay pangmaramihang construct na nangangahulugang “mga anak ni.” Isinama ang prefixed conjunction וּ bilang “At” upang mapanatili ang ugnayan nito sa naunang talaangkanan.
- source_word: חֶבְרוֹן
  choice: Hebron
  rationale: Pangalang pantangi; ginamit ang nakasanayang anyong Filipino/Biblikal na “Hebron.”
- source_word: קֹרַח
  choice: Korah
  rationale: Pangalang pantangi; ang “Korah” ay malinaw at nakasanayang transliterasyon sa Filipino.
- source_word: תַּפּוּחַ
  choice: Tapuah
  rationale: Pangalang pantangi ito rito, kaya tinranslitera at hindi isinaling ayon sa kahulugan nitong karaniwang pangngalan.
- source_word: רֶקֶם
  choice: Rekem
  rationale: Pangalang pantangi; tuwirang transliterasyon ng anyong Hebreo.
- source_word: שָׁמַע
  choice: Sema
  rationale: 'Tinutumbasan ng “Sema” ang Hebreong Šemaʿ sa likas na ortograpiyang Filipino: “S” para sa שׁ at walang letrang kumakatawan sa pangwakas na ע, na hindi likas bigkasin sa Filipino.'
theological_decisions: []
translation_notes:
  register: Maikli at marangal na estilong talaangkanan. Ginamit ang “sina” upang likas na ipakilala sa modernong Filipino ang serye ng mga pangalan. Walang talababa dahil malinaw ang Hebreong pangalan sa WLC; ang talababa ng English consultation layer tungkol sa “Korah/Shema” ay hindi tumutugma sa aktuwal na pagkakasunod ng Hebreong teksto at hindi kailangang dalhin sa saling Filipino.
