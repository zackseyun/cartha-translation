  text: וַ/יִּהְי֧וּ בְנֵי יְרַחְמְאֵ֛ל בְּכ֥וֹר חֶצְר֖וֹן הַ/בְּכ֣וֹר רָ֑ם וּ/בוּנָ֥ה וָ/אֹ֛רֶן וָ/אֹ֖צֶם אֲחִיָּֽה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/025.yaml
  text: The sons of Jerahmeel[a], the firstborn of Hezron, were Ram his firstborn, Bunah, Oren, Ozem, and Ahijah.
translation:
  language: tl
  text: Ang mga anak na lalaki ni Jerameel[a], na panganay ni Hezron, ay sina Ram, ang panganay ni Jerameel, Buna, Oren, Ozem, at Ahias.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaaring basahin ang sintaks ng Hebreo bilang talaan ng limang anak na lalaki ni Jerameel, na si Ram ang tinukoy na “panganay.” Iminungkahi ng ilang tagapagpaliwanag na iba ang kaugnayan ng “Ahias” sa talaan, ngunit sa pinakatuwirang pagbasa, isa rin itong personal na pangalan sa serye.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: ay sina
  rationale: Sa talaangkanan, ipinakikilala ng anyong ito ang mga kasapi ng angkan; ang “ay sina” ang natural na paraang Filipino sa paglilista ng mga pangalan.
- source_word: בְנֵי
  choice: mga anak ni
  rationale: Tumutukoy ito sa mga lalaking anak sa konteksto ng talaangkanan. Likas sa Filipino ang “mga anak ni,” habang malinaw sa kasunod na mga pangalang panlalaki ang tinutukoy.
- source_word: יְרַחְמְאֵל
  choice: Jerameel
  rationale: Isinatinig ang personal na pangalan sa paraang madaling basahin sa modernong Filipino.
- source_word: בְּכוֹר חֶצְרוֹן
  choice: na panganay ni Hezron
  rationale: Pinananatili ang paglalarawan kay Jerameel bilang panganay ni Hezron at ang ugnayang appositional sa Hebreo.
- source_word: הַבְּכוֹר
  choice: na kanyang panganay
  rationale: Pinakamalamang na tumutukoy ito kay Ram bilang panganay ni Jerameel; nililinaw ng “kanyang” ang reperensiya nang hindi inaalis ang pag-uulit ng Hebreo.
- source_word: רָם
  choice: Ram
  rationale: Isinatinig ang personal na pangalan ayon sa anyong madaling makilala sa Filipino.
- source_word: וּבוּנָה
  choice: Buna
  rationale: Isinatinig ang personal na pangalan sa ortograpiyang Filipino.
- source_word: וָאֹרֶן
  choice: Oren
  rationale: Isinatinig ang personal na pangalan.
- source_word: וָאֹצֶם
  choice: Ozem
  rationale: Isinatinig ang personal na pangalan.
- source_word: אֲחִיָּה
  choice: Ahias
  rationale: Ginamit ang nakaugaliang anyong Filipino ng personal na pangalang Hebreo; itinuturing itong isa pang pangalan sa serye.
theological_decisions:
- issue: Ugnayan ng הַבְּכוֹר kay Ram
  choice: Si Ram ang tinukoy na panganay ni Jerameel.
  alternative: Basahin ang parirala nang hindi tahasang inuugnay kay Jerameel.
  rationale: Ang pagkakasunod at sintaks ng Hebreo ay pinakanatural na naglalarawan kay Ram bilang panganay ni Jerameel.
- issue: Papel ng אֲחִיָּה sa talaan
  choice: Ituring ang Ahias bilang ikalimang anak sa serye.
  alternative: Iugnay ang אֲחִיָּה sa talaan sa ibang paraan, gaya ng isang paglalarawang hindi hiwalay na anak.
  rationale: Ang payak at tuwirang pagbasa ng serye ay kumikilala rito bilang personal na pangalan, ngunit ipinababatid sa talababa ang umiiral na sintaktikong mungkahi.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang pag-uulit ng “panganay” sa Hebreo at gumamit ng “sina” para sa natural na paglilista ng mga pangalan.
