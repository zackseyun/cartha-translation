base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/055.yaml
  text: 'and the families of the scribes who lived at Jabez: the Tirathites[a], the Shimeathites, and the Sucathites. These are the Kenites who came from Hammath, the father of the house of Rechab.'
translation:
  language: tl
  text: 'At ang mga angkan ng mga tagapagsulat na nanirahan sa Jabez: ang mga Tiratita, mga Simeatita, at mga Sucatita. Sila ang mga Kenita na nagmula kay Hamat, na ama[a] ng angkan ni Recab.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ninuno” o “tagapagtatag ng angkan ni Recab.” Sa mga talaangkanan, ang Hebreong “ama” ay maaari ring tumukoy sa isang ninuno o tagapagtatag.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִשְׁפְּחוֹת
  choice: At ang mga angkan ng
  rationale: Pinanatili ang pang-ugnay na waw bilang “At” upang maipagpatuloy ang anyo ng talaangkanan. Ang מִשְׁפָּחוֹת ay tumutukoy sa mga angkan o malalaking pamilya; “mga angkan” ang mas angkop sa kontekstong ito.
- source_word: סֹפְרִים
  choice: mga tagapagsulat
  rationale: Tumutukoy ito sa mga taong nagsusulat o nag-iingat ng mga tala. Ang “mga tagapagsulat” ay malinaw sa karaniwang mambabasa at hindi nagpapasya nang lampas sa tiyak nilang tungkulin.
- source_word: ישבו יַעְבֵּץ
  choice: na nanirahan sa Jabez
  rationale: Ang pandiwa ay maramihang anyong nagsasaad ng paninirahan, at ang Jabez ang pook na kanilang tinirhan. Likas sa Filipino ang sugnay na “na nanirahan sa.”
- source_word: תִּרְעָתִים שִׁמְעָתִים שׂוּכָתִים
  choice: ang mga Tiratita, mga Simeatita, at mga Sucatita
  rationale: Mga pangalang pantukoy sa pangkat o angkan ang tatlong salita. Isinalin ang hulaping pangkat sa likas na anyong Filipino na “-ita” habang pinanatili ang pagkakakilanlan ng mga pangalang pantangi.
- source_word: הֵמָּה הַקִּינִים
  choice: Sila ang mga Kenita
  rationale: Ang malayang panghalip ay nagpapakilala sa mga naunang pangkat bilang mga Kenita. Ang “Sila ang” ay tuwiran at natural na identipikasyon sa Filipino.
- source_word: הַבָּאִים מֵחַמַּת
  choice: na nagmula kay Hamat
  rationale: Maaaring magpahiwatig ang pariralang ito ng pinagmulan nang hindi tiyak kung pagdating o pagkanuno ang diin. Ang “nagmula kay” ay angkop dahil inilalarawan si Hamat bilang ama sa kasunod na parirala at hindi labis na nilulutas ang uri ng pinagmulan.
- source_word: אֲבִי בֵית רֵכָב
  choice: na ama[a] ng sambahayan ni Recab
  rationale: Pinananatili ng “ama” ang Hebreong idyoma, habang ang “sambahayan” ay maaaring tumukoy sa angkan o linya ng lahi. Ipinaliliwanag sa talababa na ang “ama” ay maaari ring mangahulugang ninuno o tagapagtatag.
theological_decisions: []
translation_notes:
  register: Makabago at marangal na Filipino ang ginamit, na may payak na ayos ngunit pinananatili ang anyo ng talaangkanan. Isinalin sa anyong Filipino ang mga katawagang pangkat, samantalang itinira bilang mga pangalang pantangi ang Jabez, Hamat, at Recab. Inilipat ang pananda ng talababa sa “ama,” na siyang salitang aktuwal na ipinapaliwanag ng talababa.
