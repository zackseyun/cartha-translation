  text: Caleb’s concubine Maacah bore Sheber and Tirhanah[a].
translation:
  language: tl
  text: Si Maaca, ang babaing kinakasama ni Caleb, ay nagsilang kina Seber at Tirhana.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O maaaring, “Nagkaroon si Maaca, ang babaing kinakasama ni Caleb, ng mga anak na sina Seber at Tirhana.” Sa mga talaangkanan, maaaring mas pangkalahatan ang kahulugan ng יָלַד; ngunit dahil babae ang tahasang simuno rito, ginamit sa pangunahing teksto ang “nagsilang.”
    reason: lexical_alternative
lexical_decisions:
- source_word: פִּלֶגֶשׁ
  choice: kalaguyo
  rationale: Tumutukoy ito sa isang babaeng kinikilalang kabiyak ngunit mas mababa ang katayuan kaysa pangunahing asawa. Ang “kalaguyo” ang maikli at karaniwang katumbas sa saling Bibliya, bagaman hindi nito lubos na naipahahayag ang kinikilalang katayuan ng ugnayan.
- source_word: כָּלֵב
  choice: Caleb
  rationale: Pangalang pantangi; ginamit ang anyong karaniwan sa makabagong saling Filipino.
- source_word: מַעֲכָה
  choice: Maaca
  rationale: Pangalang pantangi; isinalin sa baybay na madaling bigkasin sa Filipino habang pinananatili ang tunog ng Hebreo.
- source_word: יָלַד
  choice: ipinanganak ni
  rationale: Maaaring gamitin ang pandiwa sa mga talaangkanan para sa pag-aanak o pagkakaroon ng supling. Dahil babae ang tahasang simuno, natural sa Filipino ang “ipinanganak ni,” na nagpapahayag na siya ang nagsilang.
- source_word: שֶׁבֶר
  choice: Seber
  rationale: Pangalang pantangi; transliterasyong angkop sa palabaybayang Filipino.
- source_word: וְאֶת
  choice: at
  rationale: Ang וְ ay pang-ugnay at ang אֶת ay pananda ng tiyak na layon na walang hiwalay na katumbas sa Filipino; sapat ang “at” upang ipakilala ang ikalawang pangalan.
- source_word: תִּרְחֲנָה
  choice: Tirhana
  rationale: Pangalang pantangi; transliterasyong malapit sa anyong Hebreo at madaling bigkasin sa Filipino.
