base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/011.yaml
  text: Nahshon fathered Salma[a], and Salma fathered Boaz.
translation:
  language: tl
  text: Si Nahshon ang naging ama ni Salma[a], at si Salma ang naging ama ni Boaz.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, Salma; ginagamit ng ilang salin ang Salmon upang iayon sa kaugnay na mga talaangkanan (halimbawa, Ruth 4:20–21; Mateo 1:4–5).
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/נַחְשׁוֹן
  choice: Si Nahshon
  rationale: Pangalan ng tao; ginamit ang karaniwang anyong Filipino ng transliterasyong Nahshon. Ang pang-ugnay na וְ ay likas na hindi na kailangang isalin nang hiwalay sa simula ng nakahiwalay na talata.
- source_word: הוֹלִיד
  choice: ang naging ama ni
  rationale: Sa talaangkanan, ang Hiphil ng ילד ay nangangahulugang ‘magkaanak bilang ama’ o ‘maging ama ni.’ Ang pariralang ito ay natural at marangal sa modernong Tagalog at pinananatili ang panig ng ama sa talaangkanan.
- source_word: אֶת
  choice: '[hindi tuwirang isinalin]'
  rationale: Pananda ito ng tiyak na tuwirang layon sa Hebreo at wala itong hiwalay na katumbas na salita sa Tagalog; ipinahihiwatig ito ng balangkas ng pangungusap.
- source_word: שַׂלְמָא
  choice: Salma
  rationale: Tuwirang kinakatawan ng ‘Salma’ ang anyong Hebreo sa talatang ito. Hindi ito ginawang ‘Salmon’ upang huwag iayon nang sapilitan sa kaugnay na mga talaangkanan.
- source_word: וְ/שַׂלְמָא
  choice: at si Salma
  rationale: Natural na isinalin ang וְ bilang ‘at’; inuulit ang pangalang Salma ayon sa malinaw na pagkakabuo ng tekstong Hebreo.
- source_word: בֹּעַז
  choice: Boaz
  rationale: Pangalan ng tao; ginamit ang nakaugaliang transliterasyong Boaz sa Filipino.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Pinili ang ‘naging ama ni’ sa halip na makaluma o hindi gaanong natural na ‘ipinanganak si’ o ‘nagkaanak ng,’ sapagkat mas malinaw nitong ipinapahayag ang pormulang panlalaki sa talaangkanan. Inilagay ang panandang talababa [a] kaagad pagkatapos ng Salma.
