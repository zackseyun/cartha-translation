  text: 'And the sons of Jonathan: Peleth and Zaza. These were the sons of Jerahmeel.'
translation:
  language: tl
  text: At ang mga anak ni Jonatan ay sina Pelet at Zaza. Ang mga ito ang mga anak ni Jerameel.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי
  choice: At ang mga anak ni
  rationale: Pinananatili ng “At” ang dugtong sa naunang talaangkanan, at likas sa Filipino ang “mga anak ni” para sa construct na בְּנֵי.
- source_word: יוֹנָתָן
  choice: Jonatan
  rationale: Isinatinig ang pangalang Hebreo ayon sa karaniwang anyong ginagamit sa Filipino.
- source_word: פֶּלֶת
  choice: Pelet
  rationale: Tuwirang pagsasatinig ng pangalang pantangi mula sa Hebreo.
- source_word: וְזָזָא
  choice: at Zaza
  rationale: Ang pang-ugnay ay nagdurugtong sa ikalawang anak na pinangalanan; tuwirang isinatinig ang pangalan.
- source_word: אֵלֶּה
  choice: Ang mga ito
  rationale: Malinaw at likas na pantukoy pabalik kina Pelet at Zaza.
- source_word: הָיוּ
  choice: ang
  rationale: Sa sugnay na nagpapakilala, likas sa Filipino na gumamit ng panaguring nominal at hindi na tahasang tumbasan ang Hebreong copula na “were.”
- source_word: בְּנֵי יְרַחְמְאֵל
  choice: mga anak ni Jerameel
  rationale: Pinananatili ang literal na ugnayang “mga anak” sa talaangkanan sa halip na palawakin ito bilang “mga inapo.”
