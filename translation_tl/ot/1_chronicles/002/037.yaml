  text: Si Zabad ay naging ama ni Eflal, at si Eflal ay naging ama ni Obed.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: זָבָד
  choice: Zabad
  rationale: Pangalang pantangi; tinumbasan ayon sa karaniwang anyo ng pangalan sa modernong saling Tagalog.
- source_word: הוֹלִיד
  choice: naging anak ni
  rationale: Sa talaangkanan, ang Hiphil ng ילד ay tumutukoy sa pagiging ama o pag-aanak. Ang hulmaing “naging anak ni X si Y” ay natural, malinaw, at marangal sa Tagalog, habang pinananatili ang ugnayang genealogical nang hindi gumagamit ng makaluma o hindi likas na “ipinanganak.”
- source_word: אֶפְלָל
  choice: Eflal
  rationale: Pangalang pantangi; transliterasyon na umaayon sa bigkas ng Hebreo at sa ortograpiyang Filipino.
- source_word: וְ
  choice: at
  rationale: Payak na pangatnig na nag-uugnay sa dalawang sugnay ng talaangkanan.
- source_word: עוֹבֵד
  choice: Obed
  rationale: Pangalang pantangi; hindi isinalin ang kahulugang kaugnay ng salitang Hebreo para sa paglilingkod.
- source_word: אֶת
  choice: '[hindi tuwirang isinalin]'
  rationale: Pananda ng tiyak na layon sa Hebreo na walang hiwalay na katumbas na salita sa Tagalog; ipinahihiwatig ng ayos ng pangungusap.
