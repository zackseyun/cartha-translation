  text: וַ/אֲבִיגַ֕יִל יָלְדָ֖ה אֶת עֲמָשָׂ֑א וַ/אֲבִ֣י עֲמָשָׂ֔א יֶ֖תֶר הַ/יִּשְׁמְעֵאלִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/017.yaml
  text: Abigail bore Amasa[a], and the father of Amasa was Jether the Ishmaelite.
translation:
  language: tl
  text: Ipinanganak ni Abigail si Amasa[a], at ang ama ni Amasa ay si Jeter na Ismaelita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa ilang manuskrito at sa katumbas na talata sa 2 Samuel 17:25, “Itra na Israelita” ang mababasa sa halip na “Jeter na Ismaelita.” “Jeter na Ismaelita” ang mababasa rito sa Tekstong Masoretiko.
    reason: textual_variant
lexical_decisions:
- source_word: יָלְדָה
  choice: Ipinanganak ni Abigail
  rationale: Sa qal na may babaeng simuno, ang ילד ay nangangahulugang “nagsilang” o “ipinanganak.” Ang ayos na “Ipinanganak ni Abigail” ay natural sa makabagong Filipino at malinaw na pinananatili ang ugnayang maternal.
- source_word: אֶת עֲמָשָׂא
  choice: si Amasa
  rationale: Ang אֶת ay pananda ng tiyak na tuwirang layon at hindi isinasalin nang hiwalay; ginagamit ang “si” bilang likas na pananda sa pangalang pantangi sa Filipino.
- source_word: וַאֲבִי עֲמָשָׂא
  choice: at ang ama ni Amasa
  rationale: Tuwirang pinananatili ang tahasang ugnayang genealogical ng pariralang construct na “ama ni Amasa.”
- source_word: יֶתֶר
  choice: Jeter
  rationale: Isinalin sa baybay-Filipino ang pangalang Hebreo ayon sa karaniwang pagbigkas ng titik j sa Filipino.
- source_word: הַיִּשְׁמְעֵאלִי
  choice: na Ismaelita
  rationale: Ang gentilic na may pantukoy ay ginagamit bilang pagkakakilanlan kay Jeter. Ang “na Ismaelita” ay likas sa Filipino at hindi nagpapahiwatig na isa lamang siya sa ilang posibleng taong tinutukoy.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino para sa karaniwang mambabasa. Pinanatili ang maikli at tuwirang anyo ng talaangkanan, at inilagay kaagad ang [a] pagkatapos ng “Amasa” upang tumugma sa ibinigay na lokasyon ng panandang talababa.
