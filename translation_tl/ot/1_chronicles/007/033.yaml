  yaml_path: translation/ot/1_chronicles/007/033.yaml
  text: 'The sons of Japhlet: Pasach[a], Bimhal, and Ashvath[b]. These were the sons of Japhlet.'
translation:
  language: tl
  text: Ang mga anak na lalaki ni Jaflet ay sina Pasak[a], Bimhal, at Asvat. Ito[b] ang mga anak na lalaki ni Jaflet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring baybayin ang pangalang ito na “Pasah”; nagkakaiba-iba ang transliterasyon ng mga pangalang Hebreo.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na, “Ang mga ito ay mga anak na lalaki ni Jaflet.” Walang tahasang panahunan ang pormulang Hebreo sa talaangkanang ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְנֵי
  choice: mga anak ni
  rationale: Sa tuwirang talaangkanang ito, ang construct plural ng בֵּן ay pinakamalinaw na tumutukoy sa mga anak na lalaki. Gayunman, sa natural na Filipino, ang kasunod na pangalang pantangi at ang panandang “sina” ay sapat upang ipakitang mga lalaki ang nakalista, kaya hindi na kailangang gawing mabigat ang pariralang “mga anak na lalaki ni.”
- source_word: יַפְלֵט
  choice: Jaflet
  rationale: 'Isinalin sa baybay na madaling basahin sa Filipino: ang yod ay kinakatawan ng J sa nakaugaliang biblikal na pagbaybay, at ang pe ay F dahil walang dagesh.'
- source_word: פָּסַךְ
  choice: Pasak
  rationale: Pangngalang pantangi na tinumbasan ayon sa tunog; ang pangwakas na כ ay kinakatawan ng k sa natural na baybay-Filipino.
- source_word: וּבִמְהָל
  choice: Bimhal
  rationale: Inihiwalay ang prefixed conjunction bilang “at,” at pinanatiling Bimhal ang pangalan, kasama ang h na kumakatawan sa ה.
- source_word: וְעַשְׁוָת
  choice: Asvat
  rationale: Pangngalang pantangi na isina-Filipinong baybay; ang שׁ ay s at ang ו sa pangkat-katinig ay kinakatawan ng v upang mapanatili ang anyong transliterado ng pangalan.
- source_word: אֵלֶּה
  choice: Ito ang
  rationale: Walang tahasang pandiwang panahunan sa Hebreo. Ang “Ito ang” ay natural na pormulang pangbuod sa Filipino at hindi sapilitang nagpapasya sa pagitan ng present at past tense.
- source_word: בְּנֵי יַפְלֵט
  choice: mga anak ni Jaflet
  rationale: Inulit nang buo ang parirala upang mapanatili ang pangwakas na pormula at paralelismong nasa Hebreo.
