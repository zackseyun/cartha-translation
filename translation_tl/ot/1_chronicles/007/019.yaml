  text: The sons of Shemida were Ahian[a], Shechem, Likhi, and Aniam.
translation:
  language: tl
  text: Ang mga anak na lalaki ni Semida ay sina Ahian[a], Shekem, Likhi, at Aniam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga lalaking inapo ni Semida.” Sa mga talaangkanan, ang “mga anak na lalaki” ay maaari ring tumukoy nang mas malawak sa mga lalaking inapo, bagaman ang agarang konteksto rito ay pumapabor sa “mga anak na lalaki.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: ay
  rationale: Sa talaangkanan, ang anyong ito ng היה ay natural na naghaharap ng listahan ng mga pangalan; ang pang-ugnay na “ay” ang malinaw at likas na katumbas sa Filipino.
- source_word: בְּנֵי
  choice: mga anak ni
  rationale: Bagaman maaaring tumukoy ang בנים sa mas malalayong inapo sa mga talaangkanan, ang agarang konteksto ay pumapabor sa tuwirang kahulugang mga anak na lalaki. Sa Filipino, natural ang “mga anak ni,” at malinaw na mga lalaki ang tinutukoy dahil sa mga pangalang nakalista.
- source_word: שְׁמִידָע
  choice: Semida
  rationale: Isinalin sa baybay na madaling bigkasin sa modernong Filipino habang malapit sa tunog ng Hebreo.
- source_word: אַחְיָן
  choice: Ahian
  rationale: Tuwirang transliterasyon sa baybay na natural basahin sa Filipino.
- source_word: שֶׁכֶם
  choice: Shekem
  rationale: Ginamit ang “sh” para sa Hebreong שׁ at “k” para sa כּ/כ na tunog /k/, alinsunod sa madaling basahing transliterasyon sa Filipino; personal na pangalan ito sa konteksto.
- source_word: לִקְחִי
  choice: Likhi
  rationale: Pinananatili ng “kh” ang naiibang katinig na Hebreo at nagbibigay ng mababasang anyo sa Filipino.
- source_word: אֲנִיעָם
  choice: Aniam
  rationale: Tuwirang transliterasyon ng personal na pangalan sa anyong madaling basahin sa Filipino.
theological_decisions: []
translation_notes:
  register: Maikli, marangal, at natural na modernong Filipino para sa isang talaangkanan. Pinanatili ang pormulang “Ang mga anak ni … ay sina …” at isinalin lamang sa baybay-Filipino ang mga pangalang Hebreo.
