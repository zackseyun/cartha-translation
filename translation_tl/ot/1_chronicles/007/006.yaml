lexical_decisions:
- source_word: בִּנְיָמִן
  choice: Benjamin
  rationale: Pangalan ng tao at lipi; ginamit ang nakaugaliang anyong Filipino. Ipinahiwatig ng konteksto ng talaangkanan ang ugnayang “mga anak ni.”
- source_word: בֶּלַע
