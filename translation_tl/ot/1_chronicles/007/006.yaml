  rationale: Inililipat nang malinaw sa baybay-Filipino ang katinig na כ bilang k; hindi kailangan ang tradisyonal na baybay-Ingles na “Becher.”
- source_word: יְדִיעֲאֵל
  choice: Jediael
  rationale: Pinanatili ang kinikilalang transliterasyon ng pangalan, na madaling basahin sa Filipino.
- source_word: שְׁלֹשָׁה
  choice: tatlo
  rationale: Buod ito ng bilang ng tatlong pangalang binanggit.
- source_word: '[implicit genealogical heading]'
  choice: 'Ang mga anak ni Benjamin:'
  rationale: Walang pandiwa at pinaikli ang Hebreo, gaya ng karaniwan sa mga talaangkanan. Ginawang tahasan ang ipinahihiwatig na ugnayan upang maging natural at malinaw sa Filipino.
