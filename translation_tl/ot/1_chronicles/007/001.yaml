base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/001.yaml
  text: 'The sons of Issachar: Tola[a], Puah, Jashub[b], and Shimron—four.'
translation:
  language: tl
  text: 'Ang mga anak ni Isacar: sina Tola, Pua[a], Jasub[b], at Simron—apat silang lahat.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: Pua. Sa ilang saling Ingles, “Puva” ang anyo batay sa katumbas na pangalan sa ibang mga talaangkanan.'
    reason: alternative_reading
  - marker: b
    text: 'Hebreo: Jasub. Sa Genesis 46:13, “Isvi” ang katumbas na anyo ng pangalan.'
    reason: cross_reference
lexical_decisions:
- source_word: וְ/לִ/בְנֵי
  choice: Ang mga anak ni
  rationale: Ipinakikilala ng parirala ang talaangkanan ng susunod na lipi. Likas sa modernong Tagalog ang pamagat na “Ang mga anak ni”; hindi kailangang isalin nang hiwalay ang panimulang pang-ugnay at pang-ukol.
- source_word: יִשָׂשכָר
  choice: Isacar
  rationale: Pangngalang pantangi na isinalin ayon sa karaniwang anyong Filipino ng pangalan.
- source_word: תּוֹלָע
  choice: Tola
  rationale: Pangngalang pantangi sa talaangkanan; tinumbasan sa likas na baybay Filipino.
- source_word: וּ/פוּאָה
  choice: Pua
  rationale: Sinusunod ang anyong binibigkas sa tekstong Hebreo ng Cronica; hindi ginamit sa pangunahing teksto ang alternatibong anyong mula sa ibang talaangkanan.
- source_word: ישיב
  choice: Jasub
  rationale: Sinusunod ang pangalan sa kasalukuyang tekstong Hebreo ng talatang ito. Ang naiibang anyo sa Genesis 46:13 ay inilagay sa talababa.
- source_word: וְ/שִׁמְרוֹן
  choice: at Simron
  rationale: Isinalin ang pang-ugnay at tinumbasan sa Filipino ang pangngalang pantangi bilang huling pangalan sa talaan.
- source_word: אַרְבָּעָה
  choice: apat silang lahat
  rationale: Ibinibigay ng bilang ang kabuuang dami ng mga anak na nakalista. Ginagawang malinaw at natural sa Tagalog ng “silang lahat” ang buod na bilang.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na payak ngunit marangal. Ginamit ang “sina” upang natural na ipakilala ang sunod-sunod na mga pangalan, at pinanatili ang maikli at pormulang estilo ng talaangkanan.
