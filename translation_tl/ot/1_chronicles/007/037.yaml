  text: Bezer[a], Hod, Shamma, Shilshah, Ithran[c][b], and Beera.
translation:
  language: tl
  text: Sina Betser, Hod, Shama[a], Shilsha, Yitran, at Beera.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang baybay sa Hebreo rito ay sumusuporta sa anyong “Shama”; may ilang salin na gumagamit ng “Shamah.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isulat na “Be’era” upang mas tahasang katawanin ang Hebreong aleph sa gitna ng pangalan.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּצֶר
  choice: Betser
  rationale: Pangalan ng tao sa talaangkanan. Ginamit ang “ts” upang likas na katawanin sa Filipino ang tunog ng Hebreong צ, sa halip na ang anyong Ingles na “Bezer.”
- source_word: הוֹד
  choice: Hod
  rationale: Bagaman maaaring mangahulugan ang karaniwang pangngalan na “karangalan” o “ningning,” malinaw sa konteksto na pangalan ito ng tao, kaya isinalin sa pamamagitan ng transliterasyon.
- source_word: שַׁמָּא
  choice: Shama
  rationale: Tuwirang transliterasyon ng anyong Hebreo; hindi dinagdagan ng pangwakas na “h” na wala sa baybay ng pangalang ito sa talata.
- source_word: שִׁלְשָׁה
  choice: Shilsha
  rationale: Transliterasyon ng pangalang Hebreo sa anyong madaling basahin sa Filipino; ang pangwakas na ה rito ay hindi nangangailangan ng binibigkas na “h.”
- source_word: יִתְרָן
  choice: Yitran
  rationale: Tuwirang kinakatawan ng “Y” ang panimulang Hebreong yod; iniiwasan nito ang tradisyonal na anyong Ingles na “Jethran.”
- source_word: בְאֵרָא
  choice: Beera
  rationale: Mababasa at likas na transliterasyon sa Filipino. Hindi minarkahan sa pangunahing teksto ang aleph sa gitna, ngunit ipinaliwanag ang mas tahasang anyo sa talababa.
theological_decisions: []
translation_notes:
  register: Gumamit ng makabago, marangal, at madaling basahing Filipino. Idinagdag ang “Sina” sapagkat isang talaan ito ng maraming pangalan at kailangan ito para sa likas na daloy ng Filipino; pinanatili ang payak na anyo ng talaangkanan. Ang mga pangalan ay transliterado mula sa Hebreo sa halip na sundan nang mekanikal ang mga anyong Ingles.
