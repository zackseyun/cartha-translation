  source_fidelity: 'Tapat ang salin sa Hebreo: ang pang-ugnay, pormulang talaangkanang “mga anak na lalaki ni,” lahat ng siyam na pangalan, at ang pangwakas na buod na “Lahat ng ito” ay naipahayag. Ang “Abias” ay isang kinikilalang tradisyonal na anyong Filipino ng אֲבִיָּה (Abijah), kaya hindi ito pagkawala ng kahulugan.'
