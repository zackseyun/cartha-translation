base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/008.yaml
  text: 'And the sons of Becher: Zemirah[a], Joash, Eliezer, Elioenai, Omri, Jeremoth, Abijah, Anathoth, and Alemeth. All these were the sons of Becher.'
translation:
  language: tl
  text: At ang mga anak na lalaki ni Beker ay sina Zemira, Joas, Eliezer, Elioenai, Omri, Jeremot[a], Abias, Anatot, at Alemet. Lahat ng ito ay mga anak na lalaki ni Beker.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Jeremot ay maaari ring baybaying “Jerimot.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי
  choice: At ang mga anak na lalaki ni
  rationale: Pinananatili ng “mga anak na lalaki” ang tiyak na kahulugan ng בְּנֵי sa talaangkanan, habang ang “At” ay nagpapakita ng pagpapatuloy ng listahan.
- source_word: בֶכֶר
  choice: Beker
  rationale: Isinalin sa baybay na angkop sa modernong Filipino, kung saan karaniwang kinakatawan ng k ang tunog ng כ.
- source_word: זְמִירָה
  choice: Zemira
  rationale: Malapit na transliterasyon sa Hebreo; hindi kailangang katawanin ng h ang pangwakas na ה sa baybay-Filipino.
- source_word: יוֹעָשׁ
  choice: Joas
  rationale: Ginamit ang pamilyar na anyong Filipino ng pangalang Joash.
- source_word: אֱלִיעֶזֶר
  choice: Eliezer
  rationale: Direkta at madaling makilalang transliterasyon ng pangalang Hebreo.
- source_word: אֶלְיוֹעֵינַי
  choice: Elioenai
  rationale: Pinananatili ang mga pangunahing tunog at pantig ng pangalang Hebreo sa likas na baybay-Filipino.
- source_word: עָמְרִי
  choice: Omri
  rationale: Karaniwan at tuwirang transliterasyon ng pangalan.
- source_word: יְרֵמוֹת
  choice: Jeremot
  rationale: Iniaangkop sa baybay-Filipino ang pangalang Hebreo; itinala sa talababa ang alternatibong anyong Jerimot.
- source_word: אֲבִיָּה
  choice: Abias
  rationale: Ginamit ang tradisyonal at madaling makilalang anyong Filipino ng pangalang biblikal.
- source_word: עֲנָתוֹת
  choice: Anatot
  rationale: Ang konteksto ay talaan ng mga tao, kaya itinuring itong personal na pangalan at isinalin ayon sa tunog sa Filipino.
- source_word: עָלָמֶת
  choice: Alemet
  rationale: Malapit na transliterasyon ng pangalang Hebreo na sumusunod sa baybay-Filipino.
- source_word: כָּל אֵלֶּה
  choice: Lahat ng ito
  rationale: Tuwiran at natural na salin ng pariralang nagbubuod sa listahan.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na malinaw at marangal ang himig. Ginamit ang “sina” upang natural na ipakilala ang listahan ng mga pangalan, ngunit pinanatili ang “mga anak na lalaki” upang maipahayag ang tiyak na wikang pangangkanan ng Hebreo.
