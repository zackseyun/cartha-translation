  text: 'And the sons of Ulam: Bedan. These were the sons of Gilead son of Machir[a], son of Manasseh.'
translation:
  language: tl
  text: At ang mga anak ni Ulam ay si Bedan. Ang mga ito ang mga anak ni Gilead, na anak ni Makir,[a] na anak ni Manases.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo: “Ang mga ito ang mga anak ni Gilead…” Maaaring nagsisilbi ang sugnay bilang buod ng talaangkanan na nag-uugnay sa linyang ito pabalik kina Gilead, Makir, at Manases.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי
  choice: At ang mga anak ni
  rationale: Pinananatili ang pang-ugnay na ו bilang “At” at ang karaniwang pormulang pangkanunu-nunuan na בְנֵי bilang “mga anak ni.”
- source_word: אוּלָם
  choice: Ulam
  rationale: Pangalang pantangi; tinumbasan sa paraang transliterasyon.
- source_word: בְּדָן
  choice: Bedan
  rationale: Pangalang pantangi; tinumbasan sa paraang transliterasyon.
- source_word: אֵלֶּה
  choice: Ang mga ito
  rationale: Walang tahasang pandiwang pang-ugnay sa Hebreo. Ang likas na pariralang Filipino na “Ang mga ito ang” ay hindi kailangang pumili sa pagitan ng “are” at “were,” kaya napapanatili ang anyo at bahagyang kalabuan ng pinagmulan.
- source_word: בְּנֵי גִלְעָד
  choice: ang mga anak ni Gilead
  rationale: Pinananatili ang literal at karaniwang idyomang pangkanunu-nunuan na “mga anak,” sa halip na gawing mas malawak na “mga inapo.”
- source_word: בֶּן מָכִיר
  choice: na anak ni Makir
  rationale: Karaniwang ugnayang pangkanunu-nunuan; ang pangalang מָכִיר ay isina-Filipino bilang Makir.
- source_word: בֶּן מְנַשֶּׁה
  choice: na anak ni Manases
  rationale: Karaniwang ugnayang pangkanunu-nunuan; ginamit ang nakaugaliang anyong Filipino na Manases.
theological_decisions:
- issue: Ang ugnayan ng pangungusap na “Ang mga ito ang mga anak ni Gilead” sa naunang talaan
  choice: Pinanatili ang pahayag bilang hiwalay na buod ng talaangkanan at nilagyan ng talababa.
  alternative: Tahasang sabihing ang angkan ni Ulam ay mga inapo ni Gilead, o baguhin ang teksto upang lutasin ang wari'y di-pagkakatugma.
  rationale: Maikli at maaaring buod na nag-uugnay pabalik ang sugnay sa Hebreo. Hindi nito tahasang ipinapaliwanag ang eksaktong saklaw ng “mga ito,” kaya hindi dapat dagdagan ng interpretasyong wala sa teksto.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang payak na estilo ng talaangkanan, ang “mga anak” bilang pormulang genealogical, at ang kalabuan ng sugnay na walang tahasang copula sa Hebreo.
