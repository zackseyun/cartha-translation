  text: וּ/בְנֵ֣י בְרִיעָ֔ה חֶ֖בֶר וּ/מַלְכִּיאֵ֑ל ה֖וּא אֲבִ֥י ברזות׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/031.yaml
  text: 'The sons of Beriah: Heber and Malchiel[b][a]; he was the father of Birzaith.'
translation:
  language: tl
  text: Ang mga anak ni Beria ay sina Heber at Malkiel. Siya ang ama[a] ni Birzait.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ninuno ni” o “tagapagtatag ng” Birzait. Sa mga talaan ng angkan, ang “ama” ay maaaring tumukoy sa ninuno o sa tagapagtatag ng isang angkan o pamayanan, hindi lamang sa mismong biyolohikal na ama.
    reason: lexical_alternative
  - marker: b
    text: Ang pangalang “Birzait” ay maaari ring isulat na “Birzot” o “Berazot.”
    reason: alternative_reading
lexical_decisions:
- source_word: וּבְנֵי
  choice: Ang mga anak ni
  rationale: Ang anyong construct na maramihan ng בֵּן ay likas na isinasalin sa modernong Tagalog bilang “ang mga anak ni.” Hindi na hiwalay na isinalin ang panimulang pang-ugnay dahil nagsisimula ito ng panibagong tala sa angkan.
- source_word: בְרִיעָה
  choice: Beria
  rationale: Pangalan ng tao; ginamit ang malinaw at karaniwang anyong Tagalog ng transliterasyon.
- source_word: חֶבֶר
  choice: Heber
  rationale: Pangalan ng tao; pinanatili ang nakaugaliang biblikal na anyong “Heber,” bagaman mas malapit sa tunog-Hebreo ang “Hever.”
- source_word: וּמַלְכִּיאֵל
  choice: at Malkiel
  rationale: Isinalin ang pang-ugnay bilang “at” at ginamit ang transliterasyong “Malkiel,” na angkop sa pagbabaybay at bigkas sa Filipino.
- source_word: הוּא
  choice: Siya
  rationale: Pinanatili ang malayang panghalip ng Hebreo sa halip na tahasang ulitin ang “Malkiel,” kaya hindi higit na nililinaw kaysa sa pinagmulan ang tinutukoy nito.
- source_word: אֲבִי
  choice: ang ama ni
  rationale: Pinanatili ang literal na idyomang pang-angkan. Maaari rin itong tumukoy sa ninuno o tagapagtatag, kaya inilagay ang mga posibilidad na iyon sa talababa.
- source_word: ברזות
  choice: Birzait
  rationale: Bihira at walang patinig sa anyong masoretiko ang pangalang ito; ginamit ang konserbatibong transliterasyong “Birzait” at itinala ang iba pang posibleng anyo.
