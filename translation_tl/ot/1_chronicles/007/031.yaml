translation_notes:
  register: Makabago, marangal, at payak na Filipino. Ginamit ang “sina” upang natural na ipakilala ang dalawang pangalan, at hinati sa dalawang pangungusap para sa malinaw na daloy habang pinananatili ang panghalip na “Siya” ng tekstong Hebreo.
