  text: וְ/שֻׁפִּ֤ם וְ/חֻפִּם֙ בְּנֵ֣י עִ֔יר חֻשִׁ֖ם בְּנֵ֥י אַחֵֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/012.yaml
  text: And Shuppim and Huppim were the sons of Ir[b][a]; Hushim was the son of Aher.
translation:
  language: tl
  text: Sina Shuppim at Huppim ay mga anak ni Ir[b]; si Hushim ay anak ni Aher.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “mga anak ni Aher.” Mahirap ang balangkas ng teksto dahil maramihan ang “mga anak” ngunit iisang pangalan lamang ang Hushim. Itinuturing ng ilan na pangalang pantangi ang “Aher”; inuunawa naman ito ng iba bilang “iba.”
    reason: lexical_alternative
  - marker: b
    text: Sa ilang salin at kaugnay na talaangkanan, ang mga pangalang ito ay may mga anyong Shephupham at Hupham.
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/שֻׁפִּם
  choice: Sina Shuppim
  rationale: Pangngalang pantangi; tinumbasan sa pamamagitan ng transliterasyon. Ang pang-ugnay na וְ ay likas na naipahayag sa tambalang paksa na “Sina Shuppim at Huppim.”
- source_word: וְ/חֻפִּם
  choice: at Huppim
  rationale: Pangngalang pantangi; direktang transliterasyon ng anyong Masoretiko, kasama ang pang-ugnay.
- source_word: בְּנֵי עִיר
  choice: ay mga anak ni Ir
  rationale: Sa talaangkanan, ang בְּנֵי ay karaniwang “mga anak ni.” Idinagdag ang “ay” upang maging likas sa Filipino ang sugnay na walang pandiwa sa Hebreo.
- source_word: חֻשִׁם
  choice: si Hushim
  rationale: Pangngalang pantangi; direktang transliterasyon mula sa Hebreo.
- source_word: בְּנֵי אַחֵר
  choice: ay anak ni Aher
  rationale: 'Pinakinis bilang isahan dahil iisa ang tahasang paksa na si Hushim, ngunit minarkahan sa talababa ang tunay na kahirapang sintaktiko: maramihan ang בְּנֵי sa Hebreo. Itinuring ang אַחֵר bilang pangalang Aher, hindi bilang “iba.”'
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “sina” para sa likas na pagpapakilala sa dalawang pangalan at pinanatili sa talababa ang tekstuwal at sintaktikong kalabuan sa hulí ng talata.
