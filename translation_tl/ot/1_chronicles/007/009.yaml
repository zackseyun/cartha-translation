base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/009.yaml
  text: 'They were enrolled by genealogy[a], according to their generations, as heads of their fathers’ houses[b], mighty men of valor: twenty thousand two hundred.'
translation:
  language: tl
  text: 'Nakatala sila ayon sa kani-kanilang salinlahi bilang mga pinuno ng mga sambahayan ng kanilang mga ninuno[b], mga magigiting na mandirigma: dalawampung libo at dalawang daan.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Ang “mga sambahayan ng kanilang mga ninuno” ay mga yunit ng pamilya batay sa iisang pinagmulang ninuno, hindi lamang mga pamilyang binubuo ng mga magulang at kanilang mga anak.
    reason: cultural_note
lexical_decisions:
- source_word: וְהִתְיַחְשָׂם
  choice: Ang bilang nila ayon sa talaan ng lahi
  rationale: Ang hitpael ng יחשׂ sa Mga Cronica ay tumutukoy sa pagkakatala o pagkakabilang sa isang rekord ng angkan. Likas sa modernong Filipino ang pariralang ito at pinananatili nito ang administratibo at genealogical na diwa ng pandiwa.
- source_word: לְתֹלְדוֹתָם
  choice: ayon sa kani-kanilang salinlahi
  rationale: Ang תולדות ay tumutukoy sa mga salinlahi o linya ng angkan. Ang “kani-kanilang salinlahi” ay malapit sa anyo ng Hebreo at angkop sa konteksto ng talaangkanan.
- source_word: רָאשֵׁי בֵּית אֲבוֹתָם
  choice: bilang mga pinuno ng mga angkan ng kanilang mga ninuno
  rationale: Ang בית אבות ay isang yunit ng lipunang nakabatay sa pinagmulang angkan, hindi lamang isang nuklear na pamilya. Mas malinaw sa karaniwang mambabasang Filipino ang “mga angkan ng kanilang mga ninuno” kaysa sa literal ngunit malabong “mga bahay ng kanilang mga ama.”
- source_word: גִּבּוֹרֵי חָיִל
  choice: magigiting na mandirigma
  rationale: Sa konteksto ng pagtatala ng mga kalalakihang may kakayahang militar, likas na ipinahahayag nito ang lakas, kagitingan, at kahusayan sa pakikipaglaban.
- source_word: עֶשְׂרִים אֶלֶף וּמָאתָיִם
  choice: dalawampung libo at dalawang daan
  rationale: Tuwirang paglilipat ng bilang sa Hebreo; ang pagsulat nito sa salita ay angkop sa marangal na estilong pampanitikan.
