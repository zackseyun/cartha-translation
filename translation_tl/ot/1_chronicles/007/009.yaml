  source_fidelity: Kailangang itama ang “Ang bilang nila,” sapagkat ang וְהִתְיַחְשָׂם ay tumutukoy sa pagkakatala/pagpapatala ayon sa talaangkanan, hindi sa bilang mismo. Ang bilang na 20,200 ay hiwalay na panapos na panaguri. Ang “mga sambahayan ng kanilang mga ninuno” ay pinananatiling malapit sa idiomang בֵּית־אָבוֹת habang ipinaliliwanag ng talababa ang kahulugang pang-angkan.
  naturalness: Mas natural at malinaw sa modernong Filipino ang “Nakatala sila ayon sa kani-kanilang salinlahi” kaysa “Ang bilang nila ayon sa talaan ng lahi.” Ang ayos ng binagong pangungusap ay malinaw na inilalarawan ang mga nakatala bago ibigay ang kabuuang bilang.
  terminology: Ginamit ang “nakatala” para sa administratibo at talaangkanang diwa ng Hebreo. Ang “mga pinuno ng mga sambahayan ng kanilang mga ninuno” ay pinananatili ang teknikal na estrukturang pang-angkan sa halip na ihalili lamang ang “mga angkan.” Ang “mga magigiting na mandirigma” ay katanggap-tanggap sa kontekstong ito para sa גִּבּוֹרֵי חָיִל.
