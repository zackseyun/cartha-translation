    rationale: Ang Hebreo ay nagsasaad na sila ay naitala o nairehistro ayon sa talaangkanan; hindi nito tinatawag na “bilang” ang mga taong tinutukoy.
  - severity: low
    issue: Ang “mga angkan ng kanilang mga ninuno” ay nagpapakinis at bahagyang nagpapalawak sa ‘mga sambahayan ng kanilang mga ama.’
    rationale: Bagaman tama ang pangkalahatang diwang pang-angkan, mas mainam na panatilihin ang imaheng sambahayan/household at linawin ito sa talababa.
