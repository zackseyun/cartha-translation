id: 1CH.7.15
reference: 1 Chronicles 7:15
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וּ/מָכִ֞יר לָקַ֤ח אִשָּׁה֙ לְ/חֻפִּ֣ים וּ/לְ/שֻׁפִּ֔ים וְ/שֵׁ֤ם אֲחֹת/וֹ֙ מַעֲכָ֔ה וְ/שֵׁ֥ם הַ/שֵּׁנִ֖י צְלָפְחָ֑ד וַ/תִּהְיֶ֥נָה לִ/צְלָפְחָ֖ד בָּנֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/015.yaml
  text: Machir took a wife for Huppim and for Shuppim. The name of his sister was Maacah[a], and the name of the second was Zelophehad; and Zelophehad had daughters.
translation:
  language: tl
  text: Kumuha si Makir ng asawa para kay Hupim at para kay Shupim. Maaca ang pangalan ng kanyang kapatid na babae, at Zelofehad ang pangalan ng ikalawa[a]; at nagkaroon ng mga anak na babae si Zelofehad.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “at Zelofehad ang pangalan ng ikalawang anak na lalaki.” Sa Hebreo, “ang ikalawa” lamang ang nakasaad, kaya hindi tahasang tinutukoy kung sino o ano ang ikalawa.
    reason: alternative_reading
lexical_decisions:
- source_word: לָקַח אִשָּׁה
  choice: kumuha ng asawa
  rationale: Pinananatili ang karaniwang idyomang Hebreo na tumutukoy sa pag-aasawa, habang ipinakikita ng kasunod na pariralang may לְ na ginawa ito ni Makir para kina Hupim at Shupim, hindi para sa kanyang sarili.
- source_word: לְחֻפִּים וּלְשֻׁפִּים
  choice: para kay Hupim at para kay Shupim
  rationale: Inuulit ang “para kay” upang maipakita ang inuulit na pang-ukol sa Hebreo at mapanatili ang di-pangkaraniwang kayarian ng teksto.
- source_word: וְשֵׁם אֲחֹתוֹ מַעֲכָה
  choice: Maaca ang pangalan ng kanyang kapatid na babae
  rationale: Likas na salin ng pormula sa pagbibigay-ngalan; ang “kanyang” ay pinakamalapit na tumutukoy kay Makir, bagaman siksik ang konteksto ng talaangkanan.
- source_word: וְשֵׁם הַשֵּׁנִי צְלָפְחָד
  choice: at Zelofehad ang pangalan ng ikalawa
  rationale: Ang Hebreo ay nagsasaad lamang ng “ang ikalawa” at hindi tahasang binabanggit kung anak o ibang kaugnayan ang tinutukoy; pinananatili ang tunay na kalabuan.
- source_word: וַתִּהְיֶנָה לִצְלָפְחָד בָּנוֹת
  choice: at nagkaroon ng mga anak na babae si Zelofehad
  rationale: Natural na Filipino para sa Hebreong konstruksiyon ng pag-iral at pag-aari, at malinaw na pinananatili na mga anak na babae ang mayroon si Zelofehad.
theological_decisions:
- issue: Kalabuan sa talaangkanan ng “ang ikalawa”
  choice: Panatilihin sa pangunahing teksto ang “ang ikalawa” nang hindi idinaragdag ang “anak na lalaki.”
  alternative: “ang ikalawang anak na lalaki” o “ang isa pa”
  rationale: Hindi tahasang ibinibigay ng Hebreo ang tinutukoy ng הַשֵּׁנִי. Ang pagdaragdag ng “anak na lalaki” ay maaaring magbigay ng mas tiyak na talaangkanan kaysa sa aktuwal na sinabi ng teksto, kaya inilalagay lamang ito bilang posibleng pagbasa sa talababa.
translation_notes:
  register: 'Makabago, malinaw, at marangal na Filipino. Ginamit ang “kumuha ng asawa” upang mapanatili ang anyo ng idyomang Hebreo, at inulit ang “para kay” upang katawanin ang di-pangkaraniwang sintaks. Ang mga pangalang pantangi ay isina-Filipino ang baybay: Makir, Hupim, Shupim, Maaca, at Zelofehad.'
