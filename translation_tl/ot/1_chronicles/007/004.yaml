  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “angkan ng kanilang mga ninuno” sa halip na literal na “bahay ng kanilang mga ama” upang ihatid ang sinaunang kaayusang panlipunan nang natural. Ang masinsing pariralang militar ay bahagyang nilinaw sa pangunahing teksto at ang mas literal na alternatibo ay inilagay sa talababa.
