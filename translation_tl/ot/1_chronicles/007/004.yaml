  to: Kasama nila, ayon sa kanilang mga salinlahi at sa mga sambahayan ng kanilang mga ninuno sa panig ng ama, ay may 36,000 kawal ng hukbo para sa digmaan,[a] sapagkat marami silang asawa[b] at anak na lalaki.
