base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/004.yaml
  text: And with them, by their generations, according to their fathers' houses, were 36,000 troops for the army of war, for they had many wives and sons.
translation:
  language: tl
  text: Kasama nila, ayon sa kanilang mga salinlahi at sa mga sambahayan ng kanilang mga ninuno sa panig ng ama, ay may 36,000 kawal ng hukbo para sa digmaan,[a] sapagkat marami silang asawa[b] at anak na lalaki.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, isang masinsing pariralang militar na maaari ring isaling “mga pangkat ng hukbo para sa labanan.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “mga babae”; maaaring taglayin ng Hebreong נָשִׁים ang alinmang kahulugan, ngunit mas angkop dito ang “mga asawa” dahil sa konteksto ng angkan at sambahayan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲלֵיהֶם
  choice: Kasama nila
  rationale: Sa konteksto ng talaan, ipinakikilala nito ang mga taong kaugnay o kabilang sa kanila, hindi ang nasa ibabaw nila.
- source_word: לְתֹלְדוֹתָם
  choice: ayon sa kanilang mga salinlahi
  rationale: Pinananatili ang diwang genealogical ng תּוֹלְדוֹת habang natural sa makabagong Tagalog.
- source_word: לְבֵית אֲבוֹתָם
  choice: mga angkan ng kanilang mga ninuno
  rationale: Tumutukoy ang parirala sa mga sambahayan o angkang inayos ayon sa linya ng ama; mas malinaw sa karaniwang mambabasa ang 'mga angkan ng kanilang mga ninuno.'
- source_word: גְּדוּדֵי צְבָא מִלְחָמָה
  choice: kawal na nakahanay para sa digmaan
  rationale: Likas na salin ng masinsing pariralang militar, habang pinananatili ang diwa ng organisadong mga pangkat ng hukbo para sa pakikipagdigma.
- source_word: שְׁלֹשִׁים וְשִׁשָּׁה אָלֶף
  choice: 36,000
  rationale: Tumpak na bilang na madaling basahin sa makabagong anyo.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala nito ang dahilan ng malaking bilang.
- source_word: הִרְבּוּ
  choice: marami silang
  rationale: Sa kasunod na mga layon, ang Hiphil ng רבה ay natural na ipinahahayag bilang pagkakaroon ng marami.
- source_word: נָשִׁים
  choice: asawa
  rationale: Bagaman maaari ring mangahulugang 'mga babae,' ang kahulugang 'mga asawa' ang higit na angkop sa kontekstong genealogical at sa pagkakapares nito sa mga anak na lalaki.
- source_word: וּבָנִים
  choice: at mga anak na lalaki
  rationale: Pinananatili ang tiyak na kahulugan ng בָּנִים bilang mga anak na lalaki sa talaangkanan.
