base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/013.yaml
  text: 'The sons of Naphtali: Jahziel[a], Guni, Jezer, and Shallum—the sons of Bilhah.'
translation:
  language: tl
  text: Ang mga anak ni Neftali ay sina Jahziel, Guni, Jezer, at Shallum[a]—ang mga anak ni Bilha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Genesis 46:24, “Shillem” ang nakasaad sa halip na “Shallum”; dito sa Cronica ay “Shallum.”
    reason: alternative_reading
lexical_decisions:
- source_word: בְּנֵי
  choice: mga anak ni
  rationale: Ang construct plural ng בן ay tuwirang tumutukoy sa mga anak na lalaki. Sa Filipino, natural sa talaangkanan ang “mga anak ni,” at malinaw na mga lalaki ang apat na pangalang kasunod.
- source_word: נַפְתָּלִי
  choice: Neftali
  rationale: Ginamit ang karaniwang anyong Filipino ng pangalang biblikal.
- source_word: יַחֲצִיאֵל
  choice: Jahziel
  rationale: Transliterasyon ng pangalang Hebreo na nagpapanatili sa anyo ng teksto sa Cronica.
- source_word: וְ/גוּנִי וְ/יֵצֶר וְ/שַׁלּוּם
  choice: Guni, Jezer, at Shallum
  rationale: Natural na paghahanay sa Filipino, na may “at” bago ang huling pangalan; pinanatili ang mga pangalan ayon sa tekstong Hebreo.
- source_word: בְּנֵי בִלְהָה
  choice: ang mga anak ni Bilha
  rationale: Ang pariralang nasa hulihan ay isang appositional na pagkakakilanlan sa angkan ni Bilha. Pinanatili ang pag-uulit at iniugnay sa pamamagitan ng gitling.
theological_decisions:
- issue: Saklaw ng pariralang בְּנֵי בִלְהָה
  choice: Pinanatili bilang “ang mga anak ni Bilha,” kasunod ng gitling.
  alternative: “mga inapo ni Bilha” o tahasang sabihing si Neftali lamang ang anak ni Bilha
  rationale: Hindi tahasang nililinaw ng maikling Hebreong tala ang eksaktong antas ng ugnayang genealogical. Ang literal na appositional na anyo ay nagpapanatili sa pagkakasabi at tensiyon ng pinagmulan nang hindi nagdaragdag ng interpretasyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “ay sina” para sa natural na pagpapakilala ng listahan ng mga pangalan, habang pinanatili ang maikli at talaangkanang anyo ng Hebreo.
