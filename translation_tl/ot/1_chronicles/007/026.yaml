lexical_decisions:
- source_word: לַעְדָּן
  choice: Ladan
  rationale: Pangalang pantangi na tinumbasan sa baybay na angkop sa Filipino; pinananatili ang anyong Ladan ng tekstong Hebreo.
- source_word: בְּנוֹ
  choice: anak niya
  rationale: Literal na nangangahulugang “anak niya.” Ito ang natural at malinaw na pahayag sa Filipino para sa talaangkanan, nang hindi pinalalawak sa “inapo.”
- source_word: עַמִּיהוּד
  choice: Amihud
  rationale: Pangalang pantangi na isinalin sa karaniwang baybay-Filipino, na hindi na dinodoble ang katinig na mem sa transliterasyon.
- source_word: אֱלִישָׁמָע
  choice: Elisama
  rationale: Pangalang pantangi na isinalin sa natural na baybay-Filipino, ayon sa bigkas ng Hebreo.
