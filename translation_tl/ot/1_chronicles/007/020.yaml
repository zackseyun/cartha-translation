  text: וּ/בְנֵ֥י אֶפְרַ֖יִם שׁוּתָ֑לַח וּ/בֶ֤רֶד בְּנ/וֹ֙ וְ/תַ֣חַת בְּנ֔/וֹ וְ/אֶלְעָדָ֥ה בְנ֖/וֹ וְ/תַ֥חַת בְּנֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/020.yaml
  text: 'The sons of Ephraim: Shuthelah[a], and Bered his son, and Tahath his son, and Eleadah his son, and Tahath his son.'
translation:
  language: tl
  text: 'Ang mga anak ni Efraim: si Sutela[a], si Bered na anak niya, si Tahat na anak nito, si Eleada na anak nito, at si Tahat na anak nito.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa mga talaangkanan, ang salitang Hebreo para sa “anak” ay maaari ring tumukoy sa isang inapo mula sa mas malayong salinlahi, ngunit literal na “anak niya” ang mababasa sa bawat yugto rito.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי אֶפְרַיִם
  choice: Ang mga anak ni Efraim
  rationale: Ginawang natural na pambungad ng talaangkanan sa Tagalog. Hindi na tahasang isinalin ang panimulang pangatnig na וּ, gaya ng karaniwang estilo ng mga heading sa talaangkanan.
- source_word: שׁוּתָלַח
  choice: Sutela
  rationale: Pangngalang pantangi; isina-Tagalog ang baybay upang maging natural at madaling bigkasin.
- source_word: וּבֶרֶד
  choice: si Bered
  rationale: Pangngalang pantangi sa kasunod na salinlahi; ang si ay angkop na pananda sa personal na pangalan.
- source_word: בְּנוֹ
  choice: anak niya / anak nito
  rationale: Ang בן na may hulaping panlalaking isahan ay literal na 'anak niya.' Sa sunud-sunod na talaangkanan, ginamit ang 'anak nito' pagkatapos ng unang banggit upang malinaw na tumutukoy sa pinakahuling pangalan nang hindi binabago ang ugnayang ipinahahayag ng teksto.
- source_word: וְתַחַת
  choice: si Tahat
  rationale: Pangngalang pantangi ito sa konteksto, hindi ang karaniwang salitang Hebreo na nangangahulugang 'sa ilalim.'
- source_word: וְאֶלְעָדָה
  choice: si Eleada
  rationale: Pangngalang pantangi; pinanatili sa transliterasyong angkop sa Tagalog.
- source_word: וְתַחַת בְּנוֹ
  choice: at si Tahat na anak nito
  rationale: Pinanatili ang inuulit na pormula at ang ikalawang paglitaw ng pangalang Tahat, ayon sa estruktura ng tekstong Hebreo.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang sunud-sunod na anyo ng talaangkanan at ang tunay na posibilidad na ang “anak” ay maaaring mangahulugan ng mas malayong inapo. Ginamit ang “niya” sa unang ugnayan at “nito” sa mga sumunod upang maiwasan ang kalituhan sa tinutukoy.
