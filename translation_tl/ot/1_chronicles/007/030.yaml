  text: 'The sons of Asher: Imnah[a], Ishvah, Ishvi, and Beriah, and Serah their sister.'
translation:
  language: tl
  text: Ang mga anak na lalaki ni Aser ay sina Imna[a], Isva, Isvi, at Beria; si Sera ang kanilang kapatid na babae.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ang mga pangalang Hebreo sa talatang ito ay may iba’t ibang nakaugaliang baybay sa mga salin: ang “Imna” ay maaari ring baybaying “Jimna,” ang “Isva” bilang “Isua,” at ang “Isvi” bilang “Isui.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: mga anak ni
  rationale: Ang anyong construct plural ay literal na “mga anak na lalaki ni,” ngunit dahil tahasang tinukoy si Sera bilang kapatid nilang babae, ang natural na “mga anak ni” ay malinaw at hindi nagpapahiwatig na kasama siya sa unang talaan ng mga lalaki.
- source_word: אָשֵׁר
  choice: Aser
  rationale: Ginamit ang nakaugaliang anyong Tagalog ng pangalang Asher.
- source_word: יִמְנָה
  choice: Imna
  rationale: Tuwirang transliterasyon ng Masoretikong anyo, na iniangkop sa baybay at bigkas ng Tagalog.
- source_word: יִשְׁוָה
  choice: Isva
  rationale: Sinusunod ang mga katinig at patinig ng tekstong Masoretiko; ang waw sa pangalang ito ay kinakatawan ng v upang mapanatili ang pagkakaiba nito sa Isvi.
- source_word: יִשְׁוִי
  choice: Isvi
  rationale: Tuwirang transliterasyon ng Masoretikong anyo at pinananatili ang pagkakaiba sa Isva.
- source_word: בְרִיעָה
  choice: Beria
  rationale: Transliterasyong natural sa modernong Tagalog.
- source_word: שֶׂרַח
  choice: Sera
  rationale: Pinananatili ang natatanging pangalang Hebreo at iniiwasang ipagkamali ito sa Sara, na ibang pangalan.
- source_word: אֲחוֹתָם
  choice: ang kapatid nilang babae
  rationale: Malinaw na ipinapakita ng hulaping pangmaramihan na si Sera ay kapatid ng lahat ng naunang binanggit; nilinaw ang kasarian dahil hindi ito likas na nakikita sa salitang Tagalog na “kapatid.”
