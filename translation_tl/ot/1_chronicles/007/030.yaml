translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “sina” para sa natural na pagpapakilala ng sunod-sunod na pangalan, at ang tuldok-kuwit upang maipakitang hiwalay sa listahan ng mga anak na lalaki ang kasunod na pagbanggit kay Sera.
