translation_notes:
  register: Modernong Filipino na maikli at marangal, angkop sa estilo ng talaangkanan. Ginamit ang “si” upang malinaw na ang Hamoleket ay pangalan, at “kina” para sa magkakasunod na pangalang pantangi.
