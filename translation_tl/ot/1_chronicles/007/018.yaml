  text: His sister Hammoleketh bore Ishhod[a], Abiezer, and Mahlah.
translation:
  language: tl
  text: Ang kapatid niyang babae na si Hamoleket[a] ay nagsilang kina Ishhod, Abiezer, at Mahla.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: Hamoleket; maaari ring isulat na Moleket. Kaugnay ng anyo ng pangalang ito ang salitang nangangahulugang “reyna” o “babaeng namamahala,” ngunit dito ay pinakamainam itong unawain bilang personal na pangalan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲחֹתוֹ
  choice: Ang kapatid niya
  rationale: Tuwirang ipinahahayag ng אֲחוֹת na babae ang kapatid, at ng hulaping 3ms ang “niya.” Hindi na kailangang isalin nang hiwalay ang waw sa natural na daloy ng talaangkanan sa Filipino.
- source_word: הַמֹּלֶכֶת
  choice: Hamoleket
  rationale: Sa konteksto ng talaangkanan, pinakamainam itong unawain bilang pangalang pantangi at hindi bilang titulong “reyna.” Pinananatili ng anyong Hamoleket ang artikulong Hebreo bilang bahagi ng pangalan.
- source_word: יָלְדָה
  choice: nagsilang kina
  rationale: Ang pambabaeng anyo ng pandiwa ay tahasang tumutukoy sa ina. Natural sa modernong Filipino ang “nagsilang,” at ang “kina” ay angkop sa tatlong pangalang pantangi na layon.
- source_word: אִישְׁהוֹד
  choice: Ishod
  rationale: Transliterasyon ng pangalang Hebreo ayon sa tunog, na walang kailangang gitling sa tuloy-tuloy na teksto.
- source_word: אֲבִיעֶזֶר
  choice: Abiezer
  rationale: Tuwirang transliterasyon ng pangalang pantangi at pamilyar na anyo sa tradisyong biblikal.
- source_word: מַחְלָה
  choice: Mahala
  rationale: Transliterasyong madaling bigkasin sa Filipino at kumakatawan sa mga katinig at patinig ng pangalang Hebreo.
