  source_fidelity: Kailangang ipakita sa Filipino na ang tinutukoy ay kapatid na babae, gaya ng malinaw na אֲחֹתוֹ sa Hebreo. Dapat ding panatilihin ang mas tumpak na transliterasyong Ishhod at Mahla; ang “Ishod” ay nawawalan ng h, at ang “Mahala” ay nagdaragdag ng patinig na wala sa pangalang Hebreo.
  naturalness: Natural at angkop sa modernong Filipino ang “Ang kapatid niyang babae na si Hamoleket ay nagsilang kina ...” Ang “kina” ay wastong gamit para sa magkakasunod na personal na pangalan bilang layon.
  terminology: Ang Hamoleket ay angkop na transliterasyon ng personal na pangalan sa talaangkanan. Pinananatili ng talababa ang leksikal na posibilidad na kaugnay ito ng “reyna” o “babaeng namamahala” nang hindi isinasalin ang pangalan bilang titulo.
  issues:
