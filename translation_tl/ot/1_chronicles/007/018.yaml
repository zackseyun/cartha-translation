    rationale: Ang אִישְׁהוֹד ay may h pagkatapos ng sh; ang “Ishhod” ang mas malapit na paglalapat at tugma sa audit trail.
  - severity: low
    issue: “Mahala” ang transliterasyon sa halip na “Mahla.”
    rationale: Ang מַחְלָה ay mas tumpak na Maisasalin/transliterate bilang “Mahla”; ang “Mahala” ay nagdaragdag ng patinig.
