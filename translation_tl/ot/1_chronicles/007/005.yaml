  text: And their brothers[a], throughout all the families of Issachar, were mighty men of valor, eighty-seven thousand in all[b], enrolled by genealogy.
translation:
  language: tl
  text: At ang kanilang mga kapatid[a] sa lahat ng angkan ni Isacar ay magigiting na mandirigma; ang kabuuang bilang ng mga nakatala sa talaangkanan ay walumpu’t pitong libo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga kaangkan” o “mga kamag-anak.” Sa mga kontekstong pang-angkan at talaangkanan, ang Hebreong “mga kapatid” ay maaari ring tumukoy sa mga kamag-anak na hindi tunay na magkakapatid.
    reason: lexical_alternative
  - marker: b
    text: O “ang kabuuang bilang nila, ayon sa talaangkanan, ay walumpu’t pitong libo.” Ang pandiwang Hebreo ay tumutukoy sa pagkakatala sa mga rekord ng talaangkanan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲחֵיהֶם
  choice: At ang kanilang mga kapatid
  rationale: Pinananatili ng “mga kapatid” ang karaniwang kahulugan ng Hebreong אָח, habang nililinaw sa talababa na maaari itong tumukoy nang mas malawak sa mga kaangkan sa kontekstong talaangkanan.
- source_word: לְכֹל מִשְׁפְּחוֹת יִשָׂשכָר
  choice: sa lahat ng angkan ni Isacar
  rationale: Natural itong nagpapahayag ng saklaw sa lahat ng mga pangkat-pamilya ng lipi ni Isacar.
- source_word: גִּבּוֹרֵי חֲיָלִים
  choice: magigiting na mandirigma
  rationale: Ipinahahayag nito ang lakas, tapang, at kakayahang militar ng nakapirming pariralang Hebreo sa malinaw at kasalukuyang Tagalog.
- source_word: שְׁמוֹנִים וְשִׁבְעָה אֶלֶף
  choice: walumpu't pitong libo
  rationale: Tuwirang salin ng bilang sa natural na anyo ng tuluyang Tagalog.
- source_word: הִתְיַחְשָׂם
  choice: nakatala ayon sa angkan
  rationale: Ipinahahayag ng parirala ang pagiging nakarehistro o naitala batay sa talaangkanan nang hindi nagiging labis na teknikal.
- source_word: לַכֹּל
  choice: silang lahat
  rationale: Malinaw na ipinakikitang ang bilang na walumpu't pitong libo ang kabuuang suma.
