  text: Rephah his son[a], Resheph, Telah his son, Tahan his son.
translation:
  language: tl
  text: Si Refah, na anak niya[a], si Reshep, si Telah, na anak niya, at si Tahan, na anak niya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa mga talaan ng lahi sa Hebreo, madalas na walang tahasang pandiwa; ang pagkakasunod-sunod dito ay isang listahan ng mga inapo: “Si Refah, na anak niya, si Reshep, si Telah, na anak niya, at si Tahan, na anak niya.”'
    reason: cultural_note
lexical_decisions:
- source_word: רֶפַח
  choice: Refa
  rationale: Pangalang pantangi; isinalin sa karaniwang anyong madaling basahin sa modernong Filipino, na kumakatawan sa mga katinig ng Hebreo.
- source_word: בְּנוֹ
  choice: anak niya
  rationale: Ang pangngalan na may hulaping panlalaking ikatlong panauhan ay likas na isinasalin sa Filipino bilang “anak niya.” Pinanatili ang paulit-ulit na pormulang pang-talaan ng lahi.
- source_word: רֶשֶׁף
  choice: Resef
  rationale: Ginagamit dito bilang pangalang pantangi sa isang talaan ng lahi, kaya tinumbasan ayon sa tunog at hindi isinalin bilang karaniwang pangngalan.
- source_word: תֶלַח
  choice: Tela
  rationale: Pangalang pantangi sa talaan ng lahi; ginamit ang payak at madaling basahing anyong Filipino.
- source_word: תַחַן
  choice: Tahan
  rationale: Pangalang pantangi sa talaan ng lahi; ginamit ang anyong Filipino na malapit sa Hebreong pangalan.
- source_word: וְ
  choice: si / at si
  rationale: Ang pang-ugnay na Hebreo ay nagdurugtong sa mga pangalan. Gumamit ng “si” sa bawat pangalan at “at” bago ang huling pangalan upang maging natural sa Filipino habang nananatiling malinaw ang anyong listahan.
