source:
  edition: WLC
  text: כָּל אֵ֣לֶּה בְנֵי אָ֠שֵׁר רָאשֵׁ֨י בֵית הָ/אָב֤וֹת בְּרוּרִים֙ גִּבּוֹרֵ֣י חֲיָלִ֔ים רָאשֵׁ֖י הַ/נְּשִׂיאִ֑ים וְ/הִתְיַחְשָׂ֤/ם בַּ/צָּבָא֙ בַּ/מִּלְחָמָ֔ה מִסְפָּרָ֣/ם אֲנָשִׁ֔ים עֶשְׂרִ֥ים וְ/שִׁשָּׁ֖ה אָֽלֶף־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/040.yaml
  text: All these were sons of Asher[a], heads of fathers’ houses, select men, mighty warriors, chief leaders; and they were enrolled for service in the army for war. Their number in men was twenty-six thousand.
translation:
  language: tl
  text: Ang lahat ng ito ay mga inapo ni Aser—mga pinuno ng mga angkan ng kanilang mga ninuno, mga piling lalaki, magigiting na mandirigma, at mga pangunahing pinuno. Nakatala sila ayon sa angkan[a] para maglingkod sa hukbo sa digmaan. Dalawampu’t anim na libo ang bilang ng mga lalaki.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “nakatala ang kanilang talaangkanan.” Sa Mga Cronica, ang pandiwang Hebreo ay madalas tumukoy sa pagpapatala ayon sa angkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְנֵי אָשֵׁר
  choice: mga inapo ni Aser
  rationale: Sa konteksto ng talaangkanan at ng bilang na 26,000, ang בְּנֵי ay tumutukoy sa mga kaapu-apuhan o inapo ni Aser, hindi lamang sa kaniyang mga tuwirang anak.
- source_word: רָאשֵׁי בֵית הָאָבוֹת
  choice: mga pinuno ng mga angkan ng kanilang mga ninuno
  rationale: Tumutukoy ang parirala sa mga pinuno ng mga yunit ng angkan o sambahayan ng ninuno. Pinananatili ng salin ang ugnayang pang-angkan habang iniiwasan ang di-likas na literal na ‘mga bahay ng mga ama.’
- source_word: בְּרוּרִים
  choice: mga piling lalaki
  rationale: Ipinahihiwatig ng anyong balintiyak na ang mga lalaking ito ay pinili o itinuring na pinakamainam para sa tungkulin.
- source_word: גִּבּוֹרֵי חֲיָלִים
  choice: magigiting na mandirigma
  rationale: Karaniwang katawagang militar ito para sa mga lalaking may tapang at kakayahan sa pakikipaglaban; natural at marangal ang ‘magigiting na mandirigma’ sa modernong Filipino.
- source_word: רָאשֵׁי הַנְּשִׂיאִים
  choice: mga pangunahing pinuno
  rationale: Siksik ang pariralang Hebreo at nagpapahiwatig ng mataas na katayuan sa hanay ng mga pinuno. Hindi ginagamit ang ‘mga prinsipe’ sapagkat maaari itong magpasok ng di-tiyak na monarkikal na kahulugan.
- source_word: וְהִתְיַחְשָׂם
  choice: Nakatala sila ayon sa angkan
  rationale: Sa Mga Cronica, ang ugat na יחס ay karaniwang tumutukoy sa pagpapatala batay sa talaangkanan. Ipinahahayag ng salin ang administratibong pagpapatala nang hindi ikinukubli ang aspektong pang-angkan.
- source_word: בַּצָּבָא בַּמִּלְחָמָה
  choice: para maglingkod sa hukbo sa digmaan
  rationale: 'Ipinakikita ng magkasunod na parirala ang layunin ng pagpapatala: organisadong paglilingkod-militar para sa digmaan.'
- source_word: מִסְפָּרָם אֲנָשִׁים
  choice: ang bilang ng mga lalaki
  rationale: Malinaw na mga lalaking kabilang sa puwersang militar ang binibilang; natural sa Filipino ang ganitong ayos.
- source_word: עֶשְׂרִים וְשִׁשָּׁה אָלֶף
  choice: Dalawampu’t anim na libo
  rationale: Karaniwang modernong Filipino na pagpapahayag ng bilang na 26,000.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang ‘inapo’ upang luminaw ang kontekstong talaangkanan, at inilagay ang talababa sa pariralang ‘Nakatala sila ayon sa angkan,’ na siyang tinutukoy ng leksikal na alternatibo.
