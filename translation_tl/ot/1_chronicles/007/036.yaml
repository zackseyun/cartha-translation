  text: בְּנֵ֖י צוֹפָ֑ח ס֧וּחַ וְ/חַרְנֶ֛פֶר וְ/שׁוּעָ֖ל וּ/בֵרִ֥י וְ/יִמְרָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/036.yaml
  text: 'The sons of Zophah: Suah[a], Harnepher, Shual, Beri, and Imrah.'
translation:
  language: tl
  text: 'Ang mga anak[a] ni Zofa: sina Sua, Harnefer, Sual, Beri, at Imra.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga inapo.” Sa mga talaangkanan, ang Hebreong בְּנֵי ay maaaring tumukoy sa mas malawak na angkan, bagaman “mga anak” ang mas tuwirang salin.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: mga anak
  rationale: Ito ang tuwirang kahulugan ng construct plural na בְּנֵי. Sa talaangkanan, maaari rin itong tumukoy sa mas malawak na mga inapo, kaya pinanatili sa talababa ang posibilidad na iyon.
- source_word: צוֹפָח
  choice: Zofa
  rationale: Pangalang pantangi na tinumbasan ayon sa tunog at sa likas na baybay sa makabagong Filipino.
- source_word: סוּחַ
  choice: Sua
  rationale: Pangalang pantangi na isinalin-titik sa paraang madaling bigkasin sa Filipino.
- source_word: חַרְנֶפֶר
  choice: Harnefer
  rationale: Tuwirang pagsasalin-titik ng pangalang Hebreo sa likas na anyong Filipino.
- source_word: שׁוּעָל
  choice: Sual
  rationale: Bagaman maaari itong maging karaniwang pangngalan sa ibang konteksto, malinaw na pangalan ito rito; kaya isinalin-titik at hindi isinalin ang kahulugan.
- source_word: בֵרִי
  choice: Beri
  rationale: Malapit na pagsasalin-titik ng anyong Masoretiko sa talatang ito.
- source_word: יִמְרָה
  choice: Imra
  rationale: Ang paunang yod ay kinatawan ng tunog na /i/ sa anyong angkop at natural sa Filipino.
theological_decisions: []
translation_notes:
  register: Gumamit ng maikli, marangal, at likas na wikang Filipino na angkop sa isang talaangkanan. Ginamit ang “sina” bago ang sunod-sunod na pangalan upang maging natural ang pangungusap nang hindi nagdaragdag ng impormasyong wala sa Hebreo.
