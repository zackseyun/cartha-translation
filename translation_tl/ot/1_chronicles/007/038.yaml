  text: 'And the sons of Jether: Jephunneh[a], Pispa, and Ara.'
translation:
  language: tl
  text: At ang mga anak na lalaki ni Jeter ay sina Jefune, Pispa[a], at Ara.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring baybayin na “Pispah,” na mas titik-sa-titik na transliterasyon dahil isinasama nito ang huling Hebreong letrang ה.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי
  choice: At ang mga anak ni
  rationale: Ang בְּנֵי ay construct plural ng “mga anak na lalaki,” ngunit sa natural na pormulang talaangkanan sa Filipino, sapat at karaniwan ang “mga anak.” Isinalin ang prefixed conjunction na וּ bilang “At” upang mapanatili ang pagkakaugnay sa naunang talaan.
- source_word: יֶתֶר
  choice: Jeter
  rationale: Isinalin bilang pangalang pantangi at tinumbasan ang Hebrew consonant na ת ng “t,” ayon sa natural na transliterasyon sa Filipino.
- source_word: יְפֻנֶּה
  choice: Jefune
  rationale: Transliterasyon ng pangalang pantangi sa paraang madaling basahin sa modernong Filipino; ang dobleng n sa anyong Hebreo ay hindi kailangang katawanin sa karaniwang baybay-Filipino.
- source_word: וּפִסְפָּה
  choice: Pispa
  rationale: Ang prefixed conjunction ay ipinahayag sa ayos ng listahan. Ang huling ה ay malamang na hindi binibigkas, kaya “Pispa” ang natural na pangunahing anyo; inilagay sa talababa ang mas literal na “Pispah.”
- source_word: וַאְרָא
  choice: at Ara
  rationale: Itinuring itong pangalang pantangi sa talaangkanan. Isinalin ang prefixed conjunction bilang “at” bago ang huling pangalan sa listahan.
