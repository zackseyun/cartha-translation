revisions:
- from: Ang mga anak ni Tola ay sina Uzi, Refaias, Jeriel, Jahmai, Ibsam, at Samuel. Sila ang mga pinuno[a] ng mga angkan ng kanilang mga ninuno na kabilang sa lipi ni Tola. Sila ay magigiting na mandirigma[b], ayon sa kanilang mga salinlahi[c]. Noong panahon ni David, 22,600 ang bilang nila.
  to: Ang mga anak ni Tola ay sina Uzi, Refaías, Jeriel, Jahmai, Ibsam, at Samuel. Sila ang mga pinuno[a] ng kani-kanilang sambahayan sa angkan ni Tola, mga magigiting na mandirigma[b] ayon sa kanilang mga talaangkanan[c]. Noong panahon ni David, 22,600 ang bilang nila.
  rationale: Inayos ang pariralang pang-pangkat-pamilya upang malinaw na ang mga lalaki ay mga pinuno ng kani-kanilang sambahayan sa loob ng angkan ni Tola. Pinalitan ang “salinlahi” sa pangunahing teksto ng “talaangkanan” upang mas maipakita ang genealogical na puwersa ng Hebreo, habang pinanatili ang “salinlahi” bilang lehitimong alternatibo sa talababa. Inayos din ang pagbaybay ng Refaías. Napanatili ang saklaw at pagkakasunod ng Hebreong teksto, pati ang di-tiyak na lawak ng גִּבּוֹרֵי חַיִל sa pamamagitan ng angkop na pangunahing salin at mga alternatibo.
