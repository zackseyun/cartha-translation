base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/002.yaml
  text: 'The sons of Tola: Uzzi[a], Rephaiah, Jeriel, Jahmai, Ibsam, and Samuel, heads of their fathers’ houses belonging to Tola, mighty men of valor according to their generations[c][b]. Their number in the days of David was twenty-two thousand six hundred.'
translation:
  language: tl
  text: Ang mga anak ni Tola ay sina Uzi, Refaías, Jeriel, Jahmai, Ibsam, at Samuel. Sila ang mga pinuno[a] ng kani-kanilang sambahayan sa angkan ni Tola, mga magigiting na mandirigma[b] ayon sa kanilang mga talaangkanan[c]. Noong panahon ni David, 22,600 ang bilang nila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “mga puno” o “mga lider.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “mga makapangyarihang mandirigma” o “magigiting na lalaki.”
    reason: lexical_alternative
  - marker: c
    text: Maaari ring isalin na “ayon sa kani-kanilang salinlahi” o “ayon sa kanilang mga linya ng lahi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי תוֹלָע
  choice: Ang mga anak ni Tola
  rationale: Sa kontekstong talaangkanan, ang בְּנֵי ay pinakanatural na tumutukoy sa “mga anak,” bagaman maaari rin itong sumaklaw sa mga inapo. Hindi hiwalay na isinalin ang panimulang pang-ugnay upang maging natural sa Tagalog.
- source_word: עֻזִּי וּרְפָיָה וִירִיאֵל וְיַחְמַי וְיִבְשָׂם וּשְׁמוּאֵל
  choice: Uzi, Refaias, Jeriel, Jahmai, Ibsam, at Samuel
  rationale: Isinalin ang mga pangalang pantangi sa mga anyong madaling basahin at bigkasin sa modernong Filipino, habang pinananatiling malapit sa mga anyong Hebreo.
- source_word: רָאשִׁים
  choice: mga pinuno
  rationale: Literal itong “mga ulo,” ngunit sa konteksto ay tumutukoy sa mga namumuno sa mga pangkat ng pamilya. Mas malinaw at natural sa Filipino ang “mga pinuno.”
- source_word: לְבֵית אֲבוֹתָם
  choice: ng mga angkan ng kanilang mga ninuno
  rationale: Ang בֵּית אָבוֹת ay isang yunit ng pagkakamag-anak. Inihahayag ng “angkan ng kanilang mga ninuno” ang diwa nito nang hindi gumagamit ng alanganing literal na “bahay ng mga ama.”
- source_word: לְתוֹלָע
  choice: na kabilang sa lipi ni Tola
  rationale: Ipinapakita ng parirala ang kaugnayan o pagkabilang ng mga angkan sa linya ni Tola. Ang “lipi” ay nilinaw mula sa kontekstong talaangkanan.
- source_word: גִּבּוֹרֵי חַיִל
  choice: magigiting na mandirigma
  rationale: Ang nakapirming pariralang Hebreo ay maaaring tumukoy sa katapangan, lakas, kakayahan, at katayuang militar. Sa kontekstong ito, pinananatili ng “magigiting na mandirigma” ang malamang na diwang militar.
- source_word: לְתֹלְדוֹתָם
  choice: ayon sa kanilang mga salinlahi
  rationale: Pinananatili nito ang diwa ng pag-uuri ayon sa mga linya ng angkan o talaangkanan nang hindi ipinapalagay na tahasang binabanggit ang isang nakasulat na talaan.
- source_word: מִסְפָּרָם בִּימֵי דָוִיד עֶשְׂרִים וּשְׁנַיִם אֶלֶף וְשֵׁשׁ מֵאוֹת
  choice: Noong panahon ni David, 22,600 ang bilang nila
  rationale: Direkta at natural na ipinapahayag sa Filipino ang panahon at kabuuang bilang.
