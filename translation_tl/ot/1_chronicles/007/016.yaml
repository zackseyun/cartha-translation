base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/016.yaml
  text: Maacah the wife of Machir bore a son[a], and she called his name Peresh; and the name of his brother was Sheresh[b], and his sons were Ulam and Rakem.
translation:
  language: tl
  text: Nagsilang si Maaka, na asawa ni Makir, ng isang anak na lalaki at pinangalanan niya itong Peresh. Sheresh naman ang pangalan ng kapatid nito, at ang mga anak niyang lalaki[a] ay sina Ulam at Rakem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaaring tumukoy ang “niyang” kay Sheresh, na siyang pinakamalapit na binanggit, ngunit hindi tahasang inuulit ng Hebreo ang pangalan.
    reason: textual_ambiguity
lexical_decisions:
- source_word: וַתֵּלֶד
  choice: Nagsilang
  rationale: Likas at maikli itong salin ng pandiwang ילד sa talaangkanan; malinaw na si Maaka ang nanganak.
- source_word: אֵשֶׁת מָכִיר
  choice: na asawa ni Makir
  rationale: Malinaw na ipinakikilala si Maaka ayon sa kaugnayan niya kay Makir, habang nananatiling natural sa modernong Tagalog.
- source_word: בֵּן
  choice: isang anak na lalaki
  rationale: Tiyak na lalaki ang tinutukoy ng Hebreong pangngalan, kaya hindi sapat dito ang mas malawak na salitang “anak” lamang.
- source_word: וַתִּקְרָא שְׁמוֹ
  choice: pinangalanan niya itong
  rationale: Ito ang natural na katumbas sa Tagalog ng Hebreong idyomang literal na “tinawag niya ang pangalan nito,” nang hindi binabago ang kahulugan.
- source_word: פֶּרֶשׁ
  choice: Peresh
  rationale: Isinatinig ang personal na pangalan mula sa Hebreo at pinanatili ang tunog na sh.
- source_word: וְשֵׁם אָחִיו
  choice: Sheresh naman ang pangalan ng kapatid nito
  rationale: Pinananatili ang ugnayang magkapatid at ang anyong genealogical, ngunit inayos sa likas na balangkas ng pangungusap sa Tagalog.
- source_word: שָׁרֶשׁ
  choice: Sheresh
  rationale: Isinatinig ang personal na pangalan mula sa Hebreo.
- source_word: וּבָנָיו
  choice: at ang mga anak niyang lalaki
  rationale: Ang בנים sa kontekstong ito ay tumutukoy sa mga lalaking anak. Pinananatili ng panghalip na “niyang” ang hindi ganap na tiyak na pinatutungkulan ng Hebreong hulapi.
- source_word: אוּלָם וָרָקֶם
  choice: sina Ulam at Rakem
  rationale: Isinatinig ang mga personal na pangalan; ginamit ang “sina” bilang likas na pananda sa Tagalog para sa dalawang taong pinangalanan.
theological_decisions:
- issue: Ang pinatutungkulan ng panghalip sa וּבָנָיו (“mga anak niyang lalaki”)
  choice: Pinanatili sa pangunahing teksto ang panghalip na “niyang” at ipinaliwanag ang kalabuan sa talababa.
  alternative: Tukuyin nang tahasan na mga anak ni Sheresh ang sina Ulam at Rakem.
  rationale: Pinakamalapit na posibleng tinutukoy si Sheresh, ngunit hindi inuulit ng Hebreo ang pangalan. Ang tahasang pagtukoy sa kanya ay magpapasya sa isang bagay na iniwang di-ganap na tiyak ng anyo ng teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog na angkop sa maikling talaangkanan. Ginamit ang “anak na lalaki” upang mapanatili ang kasarian sa Hebreo, at isinatinig ang mga pangalan nang malapit sa anyong Hebreo.
