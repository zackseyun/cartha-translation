base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/021.yaml
  text: Zabad his son[a], and Shuthelah his son, and Ezer and Elead; the men of Gath who were born in the land killed them[b], because they had gone down to take their livestock.
translation:
  language: tl
  text: Si Zabad, na anak niya, at si Sutela, na anak niya, at sina Ezer at Elead; pinatay sila ng mga lalaking taga-Gat na ipinanganak sa lupain[a], sapagkat bumaba sila[b] upang kunin ang mga alagang hayop ng mga taga-Gat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring “mga katutubong taga-Gat.” Literal sa Hebreo: “ang mga lalaki ng Gat, ang mga ipinanganak sa lupain.”'
    reason: lexical_alternative
  - marker: b
    text: Batay sa pinakamalapit na pangmaramihang tinutukoy sa konteksto, sina Ezer at Elead ang “bumaba.”
    reason: referent_clarification
lexical_decisions:
- source_word: בְּנוֹ
  choice: anak niya
  rationale: Tuwirang katumbas ng pangngalang may hulaping panauhan; inulit ayon sa Hebreo upang mapanatili ang anyo ng talaangkanan nang hindi ipinapasiya kung kanino tumutukoy ang bawat panghalip.
- source_word: וְעֵזֶר וְאֶלְעָד
  choice: at sina Ezer at Elead
  rationale: Isinalin ang mga pangalang pantangi sa karaniwang baybay-Filipino at ginamit ang “sina” para sa likas na daloy ng Tagalog.
- source_word: וַהֲרָגוּם
  choice: Pinatay sila
  rationale: Ang Qal na anyo ng הרג na may pangmaramihang layon ay tuwirang nangangahulugang pinatay sila.
- source_word: אַנְשֵׁי גַת
  choice: mga lalaking taga-Gat
  rationale: Pinananatili ang tiyak na kahulugang “mga lalaki ng Gat,” sa halip na gawing pangkalahatang “mga tao.”
- source_word: הַנּוֹלָדִים בָּאָרֶץ
  choice: na ipinanganak sa lupain
  rationale: Malapit sa literal na passive participle at hindi agad pinapalitan ng mas interpretatibong “mga katutubo.”
- source_word: כִּי
  choice: sapagkat
  rationale: Malinaw na nagpapakilala ng dahilan at angkop sa marangal na salaysay.
- source_word: יָרְדוּ
  choice: bumaba sila
  rationale: Pinananatili ang kilos na “bumaba” sa halip na gawing “pumunta”; ipinauunawa ng konteksto na nauna ito sa pagpatay.
- source_word: לָקַחַת
  choice: upang kunin
  rationale: Pinananatili ang malawak at di-labis na interpretatibong kahulugan ng לקח; hindi ito pinalakas tungo sa “agawin.”
- source_word: מִקְנֵיהֶם
  choice: mga alagang hayop ng mga taga-Gat
  rationale: Ang מִקְנֶה ay mga hayop na pag-aari o inaalagaan. Nilinaw sa natural na Tagalog ang tinutukoy ng hulaping “kanila,” na sa konteksto ay ang mga taga-Gat.
