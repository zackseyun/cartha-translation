base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/024.yaml
  text: His daughter was Sheerah[a], and she built Lower Beth-horon and Upper Beth-horon[b], and Uzzen-sheerah.
translation:
  language: tl
  text: Ang anak niyang babae ay si Seera[a], at itinayo niya ang Mababang Bet-horon at ang Mataas na Bet-horon[b], at ang Uzen-seera.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “At ang anak niyang babae, si Seera.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “at ang mataas”; ipinahihiwatig mula sa naunang parirala ang pangalang “Bet-horon.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִתּוֹ שֶׁאֱרָה
  choice: Ang anak niyang babae ay si Seera
  rationale: Ang וּבִתּוֹ ay literal na “at ang anak niyang babae,” at ang kasunod na pangalan ay nasa aposisyon. Ginawang likas sa modernong Tagalog ang pahayag habang pinananatili ang ugnayang pampamilya.
- source_word: שֶׁאֱרָה
  choice: Seera
  rationale: Isinalin sa baybay na madaling bigkasin sa Filipino ang pangalang Hebreo, sa halip na bigyan ito ng kahulugang hindi hinihingi ng teksto.
- source_word: וַתִּבֶן
  choice: itinayo nito
  rationale: Ang pandiwang בנה ay karaniwang nangangahulugang “magtayo” o “bumuo.” Hindi pinili ang “itinatag” o “muling itinayo” upang hindi magdagdag ng di-tiyak na detalye; ang “nito” ay malinaw na tumutukoy kay Seera.
- source_word: בֵּית חוֹרוֹן הַתַּחְתּוֹן
  choice: Mababang Bet-horon
  rationale: Pinanatili ang pangalang pook at natural na inilagay sa unahan ang panuring na הַתַּחְתּוֹן, “mababa.”
- source_word: הָעֶלְיוֹן
  choice: Mataas na Bet-horon
  rationale: Hindi inuulit sa Hebreo ang Bet-horon ngunit malinaw itong ipinahihiwatig ng magkatimbang na parirala. Inulit ito sa Tagalog para sa kalinawan.
- source_word: אֻזֵּן שֶׁאֱרָה
  choice: Uzen-seera
  rationale: Itinuring itong isang tambalang pangalan ng pook at ginamitan ng gitling upang hindi mapagkamalang dalawang magkahiwalay na pangalan.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na marangal at tuwiran. Ginamit ang “anak niyang babae” upang tahasang mapanatili ang kasarian na nakasaad sa Hebreo, at “pati” bago ang huling pook upang maging natural ang talaan.
