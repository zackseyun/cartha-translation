  terminology: Wasto at magkakatugma ang mga anyong Seera, Bet-horon, at Uzen-seera bilang mga transliterasyon. Ang “Mababang” at “Mataas na Bet-horon” ay malinaw na naghahatid ng mga panuring na Hebreo.
