base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/007.yaml
  text: 'And the sons of Bela: Ezbon[a], Uzzi, Uzziel, Jerimoth, and Iri—five heads of fathers’ houses, mighty men of valor; and their genealogical enrollment was twenty-two thousand and thirty-four.'
translation:
  language: tl
  text: At ang mga anak ni Bela ay sina Ezbon, Uzzi, Uziel, Jerimot, at Iri. Ang limang ito ay mga pinuno ng mga angkan at magigiting na mandirigma. Ang bilang nila ayon sa talaan ng kanilang angkan[a] ay 22,034.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang kanilang talaangkanan” o “ang kanilang pagkakatala ayon sa angkan.” Ang salitang Hebreo ay tumutukoy sa pagkakalista sa mga talaang pangangkanan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי בֶלַע
  choice: At ang mga anak ni Bela
  rationale: Pinananatili ang literal na “mga anak,” na angkop sa tuwirang talaan ng mga pangalan, bagaman maaari rin itong tumukoy sa mga inapo sa kontekstong pangangkan.
- source_word: אֶצְבּוֹן וְעֻזִּי וְעֻזִּיאֵל וִירִימוֹת וְעִירִי
  choice: Ezbon, Uzzi, Uziel, Jerimot, at Iri
  rationale: Isinalin sa baybay na malapit sa anyong Hebreo at madaling basahin sa modernong Filipino; “Jerimot” ang ginamit upang katawanin ang hulíng katinig ng pangalang Hebreo.
- source_word: רָאשֵׁי בֵּית אָבוֹת
  choice: mga pinuno ng mga angkan
  rationale: Ang “angkan” ay likas at malinaw na salin ng teknikal na pariralang tumutukoy sa mga sambahayang nakabatay sa pinagmulang ninuno, habang pinananatili ng “mga pinuno” ang diwa ng pamumuno.
- source_word: גִּבּוֹרֵי חֲיָלִים
  choice: magigiting na mandirigma
  rationale: Ipinahahayag ang karaniwang diwa ng parirala bilang mga lalaking may lakas, tapang, at kakayahang militar, sa natural na modernong Filipino.
- source_word: וְהִתְיַחְשָׂם
  choice: ang bilang nila ayon sa talaan ng kanilang angkan
  rationale: Ipinakikita na ang kasunod na bilang ay batay sa pagpapatala ayon sa angkan; hindi ito basta tala ng salinlahi kundi genealogical registration.
- source_word: עֶשְׂרִים וּשְׁנַיִם אֶלֶף וּשְׁלֹשִׁים וְאַרְבָּעָה
  choice: 22,034
  rationale: Ginamit ang mga numerong digit para sa malinaw at mabilis na pagbasa ng malaking bilang sa modernong Filipino.
