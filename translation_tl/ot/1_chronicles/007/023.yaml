base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/023.yaml
  text: Then he went in to his wife[a], and she conceived and bore a son, and he called his name Beriah[c][b], because disaster had been in his house.
translation:
  language: tl
  text: Pagkatapos, sumiping siya sa kanyang asawa. Naglihi ang kanyang asawa at nagsilang ng isang anak na lalaki. Pinangalanan niya itong Beria[a], sapagkat nagkaroon ng kalamidad sa kanyang sambahayan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang pangalang “Beria” ay may paglalaro ng tunog sa salitang Hebreo para sa “kalamidad” o “kasawian.”
    reason: wordplay
  - marker: b
    text: O “sapagkat nagkaroon ng kasawian sa kanyang sambahayan.” Ang “sambahayan” ay maaari ring tumukoy sa kanyang pamilya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא אֶל אִשְׁתּוֹ
  choice: nakipagtalik siya sa kanyang asawa
  rationale: Ang בוא אל kapag ang kasunod ay “asawa” ay isang karaniwang Hebreong eupemismo para sa pakikipagtalik. Tuwiran at likas sa modernong Tagalog ang salin nang hindi nagiging magaspang.
- source_word: וַתַּהַר
  choice: naglihi ito
  rationale: Maikli at karaniwang salin ng הרה sa mga salaysay ng kapanganakan; malinaw na ang asawa ang tinutukoy ng “ito.”
- source_word: וַתֵּלֶד בֵּן
  choice: nagsilang ng isang anak na lalaki
  rationale: Likas at marangal na salin ng Hebreong pormula ng panganganak.
- source_word: וַיִּקְרָא אֶת שְׁמוֹ בְּרִיעָה
  choice: pinangalanan niya itong Beria
  rationale: Ipinahahayag nang natural sa Tagalog ang karaniwang Hebreong pormula na literal na “tinawag niya ang pangalan nito.”
- source_word: בְּרִיעָה
  choice: Beria
  rationale: Transliterasyon ng pangalang pantangi ayon sa natural na baybay sa Filipino; pinananatili rin ang posibleng paglalaro ng tunog sa בְרָעָה sa pamamagitan ng talababa.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala nito ang dahilan ng pagpapangalan; marangal at malinaw ang “sapagkat” sa salaysay.
- source_word: בְרָעָה
  choice: kalamidad
  rationale: Sa konteksto, tumutukoy ito sa kasawian o kapahamakang sumapit sa pamilya, hindi sa moral na kasamaan.
- source_word: הָיְתָה בְבֵיתוֹ
  choice: may kalamidad sa kanyang sambahayan
  rationale: Malapit ito sa literal na “ang kalamidad ay nasa kanyang bahay,” habang ipinahahayag na ang בַּיִת dito ay ang pamilya o sambahayan, hindi lamang ang gusali.
theological_decisions:
- issue: Kahulugan ng רָעָה sa konteksto
  choice: kalamidad
  alternative: kasamaan
  rationale: Ang naunang salaysay tungkol sa pagkamatay ng mga anak ni Efraim ang nagpapakitang pisikal na kasawian ang tinutukoy, hindi moral na kasamaan.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginawang lantad ang Hebreong eupemismo sa unang sugnay upang maiwasan ang malabo o di-likas na literalismo. Hinati sa tatlong pangungusap para sa madaling pagbasa habang pinananatili ang sunod-sunod na kilos ng Hebreo.
