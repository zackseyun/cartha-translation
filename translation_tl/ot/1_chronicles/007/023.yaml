  to: Pagkatapos, sumiping siya sa kanyang asawa. Naglihi ang kanyang asawa at nagsilang ng isang anak na lalaki. Pinangalanan niya itong Beria[a], sapagkat nagkaroon ng kalamidad sa kanyang sambahayan.[b]
  rationale: Iningatan ng rebisyon ang eupemistikong antas ng Hebreo sa “sumiping,” nilinaw ang paksa ng paglilihi, at ibinalik ang dating-aspekto ng huling sugnay sa “nagkaroon ng kalamidad.” Pinanatili ang pangalang Beria at ang kontekstuwal na kahulugan ng רָעָה bilang kalamidad o kasawian.
