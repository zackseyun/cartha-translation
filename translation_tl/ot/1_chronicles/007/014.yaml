base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/014.yaml
  text: 'The sons of Manasseh: Asriel[a], whom his Aramean concubine bore[c][b]; she bore Machir the father of Gilead.'
translation:
  language: tl
  text: 'Ang mga anak ni Manases: si Asriel,[a] na isinilang ng kanyang Arameang kalunya.[b] Isinilang din niya si Makir, na ama ni Gilead.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga inapo ni Manases.” Sa mga talaangkanan, ang “mga anak” ay maaari ring tumukoy nang mas malawak sa mga inapo.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “kanyang kalunya, ang Arameang babae.” Tradisyonal ding isinasalin ang “Aramea” bilang “Siriana.”
    reason: lexical_alternative
  - marker: c
    text: Sa gamit ng mga talaangkanan, ang “ama” ay maaari ring mangahulugang “ninuno” o “tagapagtatag.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי מְנַשֶּׁה
  choice: Ang mga anak ni Manases
  rationale: Tuwirang katumbas ito ng anyong Hebreo na “mga anak ni Manases,” habang inilalagay sa talababa ang mas malawak na posibleng diwang “mga inapo.”
- source_word: אַשְׂרִיאֵל
  choice: Asriel
  rationale: Isinalin sa karaniwang anyo ng pangalan sa Filipino nang hindi binabago ang pagkakakilanlan ng tauhan.
- source_word: אֲשֶׁר יָלָדָה
  choice: na isinilang ng
  rationale: Likas sa Filipino ang balintiyak na anyo at malinaw nitong pinananatili na ang babaeng binanggit ang nagsilang kay Asriel.
- source_word: פִּילַגְשׁוֹ
  choice: pangalawahing asawa ni Manases
  rationale: Ipinahahayag nito sa malinaw at marangal na modernong Filipino ang katayuan ng פִּילֶגֶשׁ bilang asawang mas mababa ang katayuan, at ginagawang tiyak na si Manases ang tinutukoy ng hulaping “kanya.”
- source_word: הָאֲרַמִּיָּה
  choice: Arameang
  rationale: Mas tumpak sa kasaysayan ang “Aramea” kaysa sa tradisyonal na “Siriana,” at natural itong ginagamit bilang panuring sa Filipino.
- source_word: יָלְדָה אֶת מָכִיר
  choice: Isinilang din nito si Makir
  rationale: Inuulit ang pahayag ng pagsilang gaya sa Hebreo. Ang “nito” ay malinaw na tumutukoy sa nabanggit na Arameang babae, at ang “din” ay natural na nag-uugnay sa dalawang ulat ng pagsilang.
- source_word: אֲבִי גִלְעָד
  choice: ama ni Gilead
  rationale: Ito ang pinakadirekta at karaniwang kahulugan ng parirala; pinananatili sa talababa ang mas malawak na mga gamit nito sa talaangkanan.
theological_decisions:
- issue: Ang Arameang pangalawahing asawa ay inilalarawang nagsilang kapwa kay Asriel at kay Makir.
  choice: Pinanatili ang dalawang magkasunod na pahayag ng pagsilang ayon sa tekstong Hebreo.
  alternative: Ayusin o ipakahulugan ang talaangkanan upang si Asriel ay hindi ituring na anak ng babae.
  rationale: May tekstuwal at pang-talaangkanang tensiyon sa talata, ngunit hindi ito dapat lutasin nang walang malinaw na batayan sa saling pangunahing teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “pangalawahing asawa” sa pangunahing teksto upang maiwasan ang makabagong pahiwatig ng “kalaguyo” o “kerida,” habang inilalahad sa talababa ang mas literal na terminong “kalunya.” Inulit ang pahayag ng pagsilang upang mapanatili ang diin at tensiyon ng Hebreo.
