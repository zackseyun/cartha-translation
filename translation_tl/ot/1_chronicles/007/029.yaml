base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/029.yaml
  text: And along the borders of the sons of Manasseh were Beth-shean and its daughter towns[a], Taanach and its daughter towns, Megiddo and its daughter towns, Dor and its daughter towns[b]. In these lived the sons of Joseph son of Israel.
translation:
  language: tl
  text: Sa kahabaan ng hangganan ng mga anak ni Manases ay naroon ang Bet-sean at ang mga bayang sakop nito[a], Taanac at ang mga bayang sakop nito, Megido at ang mga bayang sakop nito, at Dor at ang mga bayang sakop nito. Sa mga lugar na ito nanirahan ang mga anak ni Jose, na anak ni Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal na “mga anak na babae nito,” isang karaniwang pahayag sa Hebreo para sa mga nayon o pamayanang sakop ng isang pangunahing lungsod.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל יְדֵי
  choice: Sa kahabaan ng hangganan ng
  rationale: Sa kontekstong heograpikal, ang idyoma ay tumutukoy sa pagiging katabi o nasa hangganan, hindi sa literal na “kamay.”
- source_word: בְנֵי מְנַשֶּׁה
  choice: mga anak ni Manases
  rationale: Pinananatili ang katawagang pangangkan na karaniwan sa talaang pantribo, bagaman tumutukoy ito sa mga inapo ni Manases.
- source_word: בֵּית שְׁאָן
  choice: Bet-sean
  rationale: Transliterasyong Filipino na malapit sa anyong Masoretiko ng pangalan ng lugar.
- source_word: וּבְנֹתֶיהָ / וּבְנוֹתֶיהָ
  choice: at ang mga bayang sakop nito
  rationale: Ang literal na “mga anak na babae nito” ay isang heograpikal na pahayag para sa mga pamayanang umaasa o nakapailalim sa pangunahing lungsod; malinaw at likas sa Filipino ang “mga bayang sakop.”
- source_word: תַּעְנַךְ
  choice: Taanac
  rationale: Karaniwang anyong Filipino ng pangalan ng lugar.
- source_word: מְגִדּוֹ
  choice: Megido
  rationale: Karaniwang anyong Filipino ng pangalan ng lugar.
- source_word: דּוֹר
  choice: Dor
  rationale: Tuwirang transliterasyon ng pangalan ng lugar.
- source_word: בְאֵלֶּה
  choice: Sa mga lugar na ito
  rationale: Nililinaw na ang panghalip ay tumutukoy sa mga kalilista pa lamang na bayan at pamayanan.
- source_word: יָשְׁבוּ
  choice: nanirahan
  rationale: Ipinapahayag ang paninirahan sa mga lugar nang hindi kinakailangang magpahiwatig ng unang pagsakop o pagtatatag.
- source_word: בְנֵי יוֹסֵף
  choice: mga anak ni Jose
  rationale: Pinananatili ang pormulang pangangkan at ang kaugnayan sa mga lipi ni Jose.
- source_word: בֶּן יִשְׂרָאֵל
  choice: na anak ni Israel
  rationale: Malinaw na ipinakikilalang si Jose ang anak ni Israel, ayon sa appositional na pariralang Hebreo.
