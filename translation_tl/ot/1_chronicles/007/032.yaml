base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/032.yaml
  text: Heber fathered Japhlet[a], Shomer, Hotham[b], and Shua their sister.
translation:
  language: tl
  text: Naging ama si Heber nina Jaflet, Shomer, Hotam, at ng kapatid nilang babae na si Shua.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חֶבֶר
  choice: Heber
  rationale: Pangalang pantangi; ginamit ang anyong transliterasyon na karaniwan at madaling makilala sa Filipino.
- source_word: הוֹלִיד
  choice: naging ama
  rationale: Sa talaangkanan, ang Hiphil ng ילד ay tumutukoy sa pagiging ama o pag-aanak; natural at marangal sa modernong Filipino ang “naging ama.”
- source_word: יַפְלֵט
  choice: Jaflet
  rationale: Pangalang pantangi; ang Hebrew pe na may dagesh ay kinakatawan ng “f,” at ang hulaping katinig ay pinanatili.
- source_word: שׁוֹמֵר
  choice: Shomer
  rationale: Tuwirang transliterasyon ng mga katinig at patinig ng Tekstong Masoretiko.
- source_word: חוֹתָם
  choice: Hotam
  rationale: Pangalang pantangi; ang ח ay isinapilipino bilang “h,” at pinanatili ang anyong may o-vowel ng Tekstong Masoretiko.
- source_word: שׁוּעָא
  choice: Shua
  rationale: Tuwirang transliterasyon ng pangalang Hebrew; hindi kailangan ang h sa hulihan sa ortograpiyang Filipino.
- source_word: אֲחוֹתָם
  choice: kapatid nilang babae
  rationale: Ang pangngalan ay “kapatid na babae” at ang hulaping ikatlong panauhang panlalaking maramihan ay “kanila”; tumutukoy ito nang pinakanatural sa mga lalaking naunang binanggit.
