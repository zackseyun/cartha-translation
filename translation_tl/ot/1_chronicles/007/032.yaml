translation_notes:
  register: Modernong Filipino na natural at marangal. Ginamit ang “nina” upang malinaw na ipakilala ang magkakapatid na anak, at ang “kapatid nilang babae na si Shua” upang maipahayag nang likas ang Hebrew na aposisyon nang hindi binabago ang maramihang hulapi ng אֲחוֹתָם.
