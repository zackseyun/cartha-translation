  text: 'And the sons of Shemer: Ahi[a], Rohgah, Jehubbah[b], and Aram.'
translation:
  language: tl
  text: At ang mga anak[a] ni Shamer ay sina Ahi, Rohgah, Jehubbah[b], at Aram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa mga talaangkanang Hebreo, ang “mga anak” ay maaari ring tumukoy sa mga lalaking inapo o kaanib ng angkan, hindi lamang sa mga tuwirang anak.
    reason: cultural_note
  - marker: b
    text: Maaari ring isatinig ang pangatlong pangalan bilang “Hubbah”; nagkakaiba ang mga salin sa pagsasatinig sa anyong Hebreo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְנֵי
  choice: At ang mga anak ni
  rationale: Ang pangmaramihang anyong construct ng בֵּן na may pang-ugnay ay likas na isinasalin sa Filipino bilang “At ang mga anak ni.” Sa talaangkanan, maaari rin itong tumukoy sa mga lalaking inapo o kaanib ng angkan.
- source_word: שָׁמֶר
  choice: Semer
  rationale: Isinatinig ang pangalang Hebreo ayon sa mga kumbensiyon ng modernong Filipino, kung saan ang שׁ ay karaniwang kinakatawan ng “s” sa mga pangalang biblikal.
- source_word: אֲחִי
  choice: Ahi
  rationale: Ginamit bilang personal na pangalan sa listahang ito; ang Hebreong ח ay tinumbasan ng “h” sa paraang madaling basahin sa Filipino.
- source_word: ו/רוהגה
  choice: Rohga
  rationale: Isinatinig ang personal na pangalan, habang ang prefixed conjunction ay naipahayag na sa balangkas ng pangungusap.
- source_word: יחבה
  choice: Jehuba
  rationale: Isinatinig ang pangalan sa anyong pamilyar at madaling bigkasin sa Filipino. Posible rin ang anyong “Huba” dahil sa pagkakaiba-iba ng transliterasyon.
- source_word: וַ/אֲרָם
  choice: at Aram
  rationale: Direktang isinatinig ang אֲרָם bilang “Aram”; ang pang-ugnay ay isinalin bilang “at.”
