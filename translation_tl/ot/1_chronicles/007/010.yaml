  source_fidelity: Tumpak na naipapasa ng draft ang dalawang pormulang talaangkanan at lahat ng pangalang Hebreo. Ang Jeush ay wastong may talababa sapagkat di-karaniwan ang anyong יעיש; hindi dapat ipilit ang isang tiyak na pagbasa nang walang pahiwatig ng kawalang-katiyakan.
  naturalness: 'Medyo putol at di-ganap sa modernong Filipino ang “At ang mga anak ni Jediael: si Bilhan.” Mas natural ang paggamit ng “ay” bago ang listahang pinangungunahan ng si/sina, habang napapanatili ang payak na hulma ng talaangkanan.'
  terminology: Ang “mga anak,” “talaangkanan,” at mga transliterasyon ay angkop. Ang Kenaanah ay makatwirang transliterasyon ng personal na pangalan at hindi dapat ipagkamaling Canaan. Pinanatili ang Jeush at ang talababa upang hindi itago ang suliraning tekstuwal/onomastiko.
  issues:
