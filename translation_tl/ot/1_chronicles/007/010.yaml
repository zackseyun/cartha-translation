  yaml_path: translation/ot/1_chronicles/007/010.yaml
  text: 'And the sons of Jediael: Bilhan. And the sons of Bilhan: Jeush[a], Benjamin, Ehud, Chenaanah, Zethan, Tarshish, and Ahishahar.'
translation:
  language: tl
  text: At ang mga anak ni Jediael ay si Bilhan. At ang mga anak ni Bilhan ay sina Jeush[a], Benjamin, Ehud, Kenaanah, Zethan, Tarshish, at Ahishahar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Di-karaniwan ang anyong Hebreo ng unang pangalan (יעיש). Ginamit ang “Jeush” ayon sa malamang na nilalayong pangalan sa talaangkanang ito; maaari rin itong baybayin na “Jaaish” o “Jaish.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי
  choice: At ang mga anak ni
  rationale: Sa tuwirang talaangkanang ito, ang בֵּן ay pinakamalinaw na tumutukoy sa mga anak; pinanatili rin ang paulit-ulit na pormula ng Hebreo.
- source_word: יְדִיעֲאֵל
  choice: Jediael
  rationale: Pangalang pantangi na isinalin sa baybay-Latin na malapit sa Hebreo at nakikilala sa tradisyong biblikal.
- source_word: בִּלְהָן
  choice: Bilhan
  rationale: Tuwirang transliterasyon ng pangalang pantangi.
- source_word: יעיש
  choice: Jeush
  rationale: Di-karaniwan ang anyong katinig sa talata, ngunit malamang na ito ang pangalang karaniwang kinikilalang Jeush; minarkahan ang kawalang-katiyakan sa talababa.
- source_word: וּבִנְיָמִן
  choice: Benjamin
  rationale: Ginamit ang nakasanayang anyong Filipino ng pangalang biblikal.
- source_word: וְאֵהוּד
  choice: Ehud
  rationale: Ginamit ang nakasanayang transliterasyon ng pangalang pantangi.
- source_word: וּכְנַעֲנָה
  choice: Kenaanah
  rationale: Isinatinig bilang pangalang pantangi at hindi bilang Canaan; ang dobleng patinig ay tumutulong ipakita ang pagkakaiba ng pangalan.
- source_word: וְזֵיתָן
  choice: Zethan
  rationale: Transliterasyon ng pangalang pantangi ayon sa karaniwang anyong biblikal.
- source_word: וְתַרְשִׁישׁ
  choice: Tarshish
  rationale: Pangalan ito ng tao sa konteksto ng talaangkanan, bagaman maaari itong tumukoy sa isang lugar sa ibang konteksto.
- source_word: וַאֲחִישָׁחַר
  choice: Ahishahar
  rationale: Tuwirang transliterasyon na nagpapanatili sa anyo ng pangalang Hebreo.
