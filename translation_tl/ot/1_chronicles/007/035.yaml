  text: 'The son of Helem his brother: Zophah[a], Imna, Shelesh, and Amal.'
translation:
  language: tl
  text: 'Ang mga anak ni Helem, na kapatid niya: sina Zofah[a], Imna, Seles, at Amal.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring baybayin na “Zofak,” depende sa paraan ng pagsasatitik ng pangwakas na titik Hebreo na ח.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבֶן
  choice: Ang mga anak ni
  rationale: Bagaman pang-isahan ang anyong Hebreo na בֶן, sinusundan ito ng apat na pangalan; sa kontekstong talaangkanan, natural sa Filipino ang kolektibong “mga anak ni” upang maipakita na ang apat ang inililista.
- source_word: הֵלֶם
  choice: Helem
  rationale: Pangalang pantangi; tinumbasan sa transliterasyong madaling basahin sa Filipino.
- source_word: אָחִיו
  choice: na kapatid niya
  rationale: Pinananatili ang literal na ugnayang pangkamag-anak at ang bahagyang kalabuan kung sino ang tinutukoy ng panghalip.
- source_word: צוֹפַח
  choice: Zofah
  rationale: Transliterasyong Filipino ng pangalan; ang צ ay kinakatawan ng z at ang pangwakas na ח ay ginawang h.
- source_word: וְיִמְנָע
  choice: Imna
  rationale: Pangalang pantangi sa listahan; ang pang-ugnay ay likas na kinakatawan ng kuwit at ng pangwakas na “at.”
- source_word: וְשֵׁלֶשׁ
  choice: Seles
  rationale: Transliterasyong angkop sa tunog at baybay ng modernong Filipino.
- source_word: וְעָמָל
  choice: at Amal
  rationale: Pinananatili ang pang-ugnay sa huling pangalan sa natural na anyo ng listahang Filipino.
