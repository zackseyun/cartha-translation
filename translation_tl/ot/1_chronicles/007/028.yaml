translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang mga anyong Betel, Shekem, at Aya na angkop sa baybay-Filipino, habang pinanatili ang Naaran at Gezer. Isinalin ang idyomang “mga anak na bayan” ayon sa kahulugan nito at ipinaliwanag ang literal na larawan sa talababa.
