base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/028.yaml
  text: Their holdings and settlements were Bethel and its daughter towns[a], and to the east Naaran, and to the west Gezer and its daughter towns, and Shechem and its daughter towns[c][b], as far as Ayyah and its daughter towns.
translation:
  language: tl
  text: Ang kanilang mga lupain at pamayanan ay ang Betel at ang mga bayang sakop nito[a], ang Naaran[b] sa silangan, ang Gezer at ang mga bayang sakop nito sa kanluran, at ang Sikem at ang mga bayang sakop nito, hanggang sa Aya[c] at sa mga bayang sakop nito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “mga anak na babae nito.” Idyoma ito para sa mas maliliit na bayan o nayong nasasakupan ng isang pangunahing lungsod.
    reason: cultural_note
  - marker: b
    text: Sa isang kaugnay na tradisyon ng pangalan ng lugar, lumilitaw ang anyong “Naara.”
    reason: alternative_reading
  - marker: c
    text: “Aya” ang mababasa sa tekstong Hebreo; “Gaza” naman ang makikita sa ilang sinaunang saksi at salin.
    reason: textual_variant
lexical_decisions:
- source_word: אֲחֻזָּתָם
  choice: kanilang mga pag-aaring lupain
  rationale: Tumutukoy ang salita sa pag-aaring teritoryo o lupain; nililinaw ng “mga pag-aaring lupain” ang heograpikong diwa sa talaan.
- source_word: מֹשְׁבוֹתָם
  choice: mga pamayanan
  rationale: Sa kontekstong panteritoryo, tumutukoy ito sa mga lugar na tinitirhan; natural at malinaw sa modernong Filipino ang “mga pamayanan.”
- source_word: בְנֹתֶיהָ
  choice: mga bayang sakop nito
  rationale: Literal itong “mga anak na babae nito,” ngunit idyoma ito para sa maliliit na bayan o pamayanang umaasa sa at nasasakupan ng pangunahing lungsod.
- source_word: לַמִּזְרָח / לַמַּעֲרָב
  choice: sa silangan / sa kanluran
  rationale: Malinaw at natural na ipinahahayag nito ang magkabilang direksiyon o hangganan ng teritoryo.
- source_word: נַעֲרָן
  choice: Naaran
  rationale: Sinusunod nito ang anyong katinig at pagbigkas ng tekstong Masoretiko; inilagay sa talababa ang kaugnay na tradisyong “Naara.”
- source_word: עַיָּה
  choice: Aya
  rationale: Direktang transliterasyon sa baybay-Filipino ng pagbasa sa tekstong Masoretiko; hindi tahimik na ipinalit ang variant na “Gaza.”
- source_word: עַד
  choice: hanggang sa
  rationale: Natural na Filipino para sa panandang nagsasaad ng lawak o hangganan ng teritoryo.
