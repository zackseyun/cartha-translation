base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/022.yaml
  text: And Ephraim their father mourned for many days[a], and his brothers came to comfort him.
translation:
  language: tl
  text: Nagluksa nang maraming araw si Efraim na kanilang ama, at dumating ang kanyang mga kapatid upang aliwin siya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “upang damayan siya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְאַבֵּל
  choice: nagluksa
  rationale: Ang Hitpael ng אבל ay tumutukoy sa pagdadalamhati, lalo na dahil sa pagkamatay; malinaw at angkop sa konteksto ang “nagluksa.”
- source_word: אֶפְרַיִם
  choice: Efraim
  rationale: Karaniwang makabagong anyong Tagalog ng pangalang Ephraim.
- source_word: אֲבִיהֶם
  choice: na kanilang ama
  rationale: Pinananatili nito ang tahasang 3mp na hulapi ng Hebreo at kinikilalang si Efraim ang ama ng mga anak na binanggit sa naunang talata.
- source_word: יָמִים רַבִּים
  choice: nang maraming araw
  rationale: Likas na pagpapahayag sa Tagalog ng tagal na tuwirang nakasaad sa Hebreo.
- source_word: וַיָּבֹאוּ
  choice: dumating
  rationale: Ang בוא sa salaysay ay likas na isaling “dumating” dito, habang papalapit kay Efraim ang kanyang mga kapatid.
- source_word: אֶחָיו
  choice: kanyang mga kapatid
  rationale: Ang payak na kahulugan ay mga kapatid niya; walang sapat na dahilan upang palawakin ito bilang mga kamag-anak.
- source_word: לְנַחֲמוֹ
  choice: upang aliwin siya
  rationale: Sa konteksto ng pagluluksa, ang נחם ay nangangahulugang magbigay-aliw o umaliw; natural at dignificado ang “upang aliwin siya.”
