    issue: Added conjunction “at”
    rationale: The Hebrew places the two formulae in sequence without a conjunction. Removing it more closely preserves the genealogical form and avoids implying simple coordination.
  - severity: low
    issue: No corresponding footnote for the retained genealogical repetition
    rationale: The English audit trail includes a note explaining the repeated “his son” formula. A Tagalog footnote anchored at the first occurrence preserves this explanatory support.
