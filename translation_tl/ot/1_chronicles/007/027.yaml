  text: Nun, ang kanyang anak[a]; Josue, ang kanyang anak.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Inuulit ng Hebreo ang pormulang “anak niya” pagkatapos ng bawat pangalan. Karaniwang estilo ito sa talaangkanan na nagpapahiwatig ng sunod-sunod na pagmamana o lahi: “Nun, ang kanyang anak; Josue, ang kanyang anak.”'
