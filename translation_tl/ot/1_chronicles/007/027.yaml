lexical_decisions:
- source_word: נ֥וֹן
  choice: Nun
  rationale: Pangngalang pantangi; pinanatili ang karaniwang anyo sa mga Bibliyang Tagalog.
- source_word: בְּנ֖/וֹ
  choice: na anak niya
  rationale: Ang בֵּן na may hulaping ikatlong panauhang panlalaki ay nangangahulugang “anak niya.” Ang pang-ugnay na “na” ay lumilikha ng natural na estilong talaangkanan sa Tagalog.
- source_word: יְהוֹשֻׁ֥עַ
  choice: Josue
  rationale: Pangngalang pantangi; ginamit ang nakasanayang anyong Tagalog ng Yehoshua/Joshua.
- source_word: בְּנֽ/וֹ
  choice: na anak niya
  rationale: Inulit upang mapanatili ang pormula at sunod-sunod na salinlahi sa Hebreong talaangkanan.
theological_decisions: []
translation_notes:
  register: Maikli, marangal, at natural na modernong Tagalog. Pinanatili ang pag-uulit ng “anak niya” dahil mahalaga ito sa estruktura ng Hebreong talaangkanan; hindi na kailangan ng talababa sapagkat malinaw ang ugnayan sa mismong salin.
