  register: Makabago, marangal, at madaling maunawaang Filipino. Pinananatili ang maikling anyo ng talaangkanan at ang kapansin-pansing tensiyon sa pagitan ng apat na nakalistang pangalan at ng bilang na lima, sa halip na tahimik itong ayusin.
