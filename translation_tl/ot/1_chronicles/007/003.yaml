base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/003.yaml
  text: 'And the sons of Uzzi: Izrahiah. And the sons of Izrahiah: Michael[a], Obadiah, Joel, and Isshiah—five, all of them heads.'
translation:
  language: tl
  text: 'At ang mga anak ni Uzi: si Izrahias. At ang mga anak ni Izrahias: sina Micael, Obadias, Joel, at Isias—lima silang lahat na mga pinuno.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal na Hebreo, “lima, mga ulo, silang lahat.” Maaari rin itong mangahulugang “limang pangunahing lalaki” o “limang pinuno ng angkan.” Apat lamang ang tahasang nakalistang anak ni Izrahias sa talatang ito.
    reason: lexical_alternative_and_textual_ambiguity
lexical_decisions:
- source_word: וּבְנֵי
  choice: At ang mga anak ni
  rationale: Karaniwang pormula sa talaangkanan ang construct plural na בְּנֵי, at pinananatili ng “At” ang pagkakaugnay sa naunang tala.
- source_word: עֻזִּי
  choice: Uzi
  rationale: Isinatinig ang pangalang Hebreo sa paraang likas basahin sa Filipino; hindi kailangan ang dobleng z upang katawanin ang pagbigkas.
- source_word: יִזְרַחְיָה
  choice: Izrahias
  rationale: Isinatinig ang pangalan sa anyong madaling basahin sa Filipino at pareho ang baybay sa dalawang paglitaw nito.
- source_word: מִיכָאֵל
  choice: Micael
  rationale: Filipinong transliterasyon ng pangalang Hebreo; pinananatili ang tunog at malinaw na kinikilalang pangalang pantangi.
- source_word: וְעֹבַדְיָה
  choice: Obadias
  rationale: Ginamit ang likas at pamilyar na anyong Filipino ng pangalang pantangi; naipahihiwatig na ng bantas at “at” ang ugnayan nito sa tala.
- source_word: וְיוֹאֵל
  choice: Joel
  rationale: Karaniwan at malinaw na anyo ng pangalan sa Filipino.
- source_word: יִשִּׁיָּה
  choice: Isias
  rationale: Isang nababasang anyong Filipino ng pangalang Hebreo, na umiiwas sa di-likas na dobleng katinig sa ortograpiyang Filipino.
- source_word: חֲמִשָּׁה
  choice: lima silang lahat
  rationale: Tuwirang pinananatili ang bilang na lima at iniuugnay rito ang emphatic na כֻּלָּם, kahit apat lamang ang tahasang nakalistang pangalan sa sugnay.
- source_word: רָאשִׁים
  choice: mga pinuno
  rationale: Sa konteksto ng talaangkanan, ang literal na “mga ulo” ay tumutukoy sa mga nangunguna o pinuno; mas natural at malinaw sa Filipino ang “mga pinuno.”
- source_word: כֻּלָּם
  choice: silang lahat
  rationale: Pinananatili ang mariing pagtukoy sa buong pangkat, hindi lamang ang payak na “lahat.”
