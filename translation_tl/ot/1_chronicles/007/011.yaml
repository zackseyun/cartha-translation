  verdict: revise
  source_fidelity: Tumpak ang pangunahing pagkilala sa mga anak ni Jediael, bilang na 17,200, at katangiang pandigma. Gayunman, ang “Ayon sa mga pinuno ng kanilang mga angkan” ay maaaring magpahiwatig na ang mga pinuno ang pinagmulan ng impormasyon, samantalang ang לְ ay nagmamarka ng pag-uuri/pagkabilang ayon sa mga ulo ng sambahayan ng mga ninuno. Ang “maaaring lumabas kasama ng hukbo” ay masyadong literal at hindi gaanong natural; ang idiomang Hebreo ay tumutukoy sa mga handang o maaaring maglingkod sa hukbo para sa digmaan.
  naturalness: Marangal at madaling maunawaan ang draft, ngunit mas natural ang “maaaring maglingkod sa hukbo sa digmaan” kaysa “maaaring lumabas kasama ng hukbo para sa digmaan.” Ang rebisyon ay nagpapanatili rin ng ugnayan ng pariralang pang-angkan sa talaangkanang estilo.
  terminology: Ang “mga anak,” “magigiting na mandirigma,” at “angkan” ay angkop sa modernong Filipino Tagalog. Sa pangunahing teksto, pinananatili ang “mga pinuno ng mga sambahayan ng kanilang mga ninuno” upang huwag gawing payak lamang na “mga angkan” ang tiyak na sinaunang estruktura; ipinaliliwanag ito ng talababa.
