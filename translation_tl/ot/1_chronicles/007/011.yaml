translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “angkan” sa pangunahing teksto upang maipaliwanag nang natural ang sinaunang yunit ng pamilya, samantalang pinanatili sa talababa ang mas literal na anyo. Inayos ang pangungusap upang maging malinaw na ang 17,200 ay ang mga magigiting na mandirigmang nakabilang ayon sa mga pinuno ng mga angkan.
