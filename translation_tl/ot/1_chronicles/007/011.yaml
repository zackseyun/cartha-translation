  text: כָּל אֵ֜לֶּה בְּנֵ֤י יְדִֽיעֲאֵל֙ לְ/רָאשֵׁ֣י הָ/אָב֔וֹת גִּבּוֹרֵ֖י חֲיָלִ֑ים שִׁבְעָֽה עָשָׂ֥ר אֶ֨לֶף֙ וּ/מָאתַ֔יִם יֹצְאֵ֥י צָבָ֖א לַ/מִּלְחָמָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/011.yaml
  text: All these were sons of Jediael[a], according to the heads of the fathers’ houses, mighty men of valor, seventeen thousand two hundred[d][c][b], able to go out in the army for war.
translation:
  language: tl
  text: Lahat ng ito ay mga anak ni Jediael[a], ayon sa mga pinuno ng mga sambahayan ng kanilang mga ninuno[b]—17,200 magigiting na mandirigma[c] na maaaring maglingkod sa hukbo sa digmaan[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga inapo ni Jediael.” Sa mga talaangkanan, maaaring mas malawak kaysa sa literal na mga anak ang saklaw ng salitang Hebreo.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “mga pinuno ng mga sambahayan ng mga ninuno,” ibig sabihin, mga pinuno ng angkan o pamilya.
    reason: cultural_note
  - marker: c
    text: O “mga makapangyarihang lalaking may tapang.” Ang pariralang Hebreo ay tumutukoy sa mahuhusay at magigiting na mandirigma.
    reason: lexical_alternative
  - marker: d
    text: Literal na “mga lumalabas upang maglingkod sa hukbo para sa digmaan,” isang idiomang tumutukoy sa mga lalaking maaaring maglingkod sa hukbo.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל אֵלֶּה
  choice: Ang lahat ng ito
  rationale: Pinananatili ang maikli at panlahatang parirala ng Hebreo nang hindi nagdaragdag ng pangngalang wala sa teksto.
- source_word: בְּנֵי יְדִיעֲאֵל
  choice: mga anak ni Jediael
  rationale: Ang literal na kahulugan ng בְּנֵי ay “mga anak,” bagaman maaari itong tumukoy nang mas malawak sa mga inapo sa talaangkanan; inilagay ang alternatibo sa talababa.
- source_word: לְרָאשֵׁי הָאָבוֹת
  choice: Ayon sa mga pinuno ng kanilang mga angkan
  rationale: Ipinahahayag ng לְ ang pag-uuri o pagbibilang ayon sa mga pinuno, at natural na inilalarawan ng “mga angkan” sa modernong Tagalog ang istrukturang panlipunang nakabatay sa sambahayan ng mga ninuno.
- source_word: גִּבּוֹרֵי חֲיָלִים
  choice: magigiting na mandirigma
  rationale: Natural at marangal na salin ito para sa mga lalaking kilala sa tapang at kakayahang pandigma, nang hindi gumagamit ng lipas na pananalita.
- source_word: שִׁבְעָה עָשָׂר אֶלֶף וּמָאתַיִם
  choice: 17,200
  rationale: Tumpak na pinananatili ang bilang sa malinaw at karaniwang anyong numerikal.
- source_word: יֹצְאֵי צָבָא לַמִּלְחָמָה
  choice: maaaring lumabas kasama ng hukbo para sa digmaan
  rationale: Malapit ito sa literal na larawan ng paglabas para sa hukbo at digmaan, habang ipinahihiwatig sa natural na Tagalog ang pagiging handa o karapat-dapat sa tungkuling militar.
