  text: 'The sons of Reuel: Nahath, Zerah, Shammah, and Mizzah.'
translation:
  language: tl
  text: Ang mga anak na lalaki ni Reuel ay sina Nahat, Zerah, Shamma, at Mizza.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי רְעוּאֵל
  choice: Ang mga anak ni Reuel
  rationale: Ang construct plural na בְּנֵי ay tuwirang tumutukoy sa mga anak na lalaki sa talaangkanang ito. Natural sa modernong Filipino ang hulma na “mga anak ni,” at hindi kailangang idagdag ang “na lalaki” dahil mga pangalang panlalaki ang kasunod.
- source_word: נַחַת
  choice: Nahat
  rationale: Pangalang pantangi na tinumbasan ayon sa tunog ng Hebreo at sa karaniwang ortograpiyang Filipino; ang Hebrew ח ay nilapitan ng “h.”
- source_word: זֶרַח
  choice: Zera
  rationale: Pangalang pantangi, kaya isinalin sa pamamagitan ng transliterasyon sa halip na ibigay ang leksikal na kahulugang kaugnay ng pagsikat o pagningning. Ang pangwakas na ח ay kinakatawan ng “h” sa ibang sistema, ngunit mas natural sa Filipino ang anyong Zera.
- source_word: שַׁמָּה
  choice: Shama
  rationale: Transliterasyon ng pangalang pantangi. Pinanatili ang “sh” upang malinaw na katawanin ang Hebrew שׁ, samantalang hindi na isinulat ang tahimik na pangwakas na h ng kumbensiyong Ingles.
- source_word: וּמִזָּה
  choice: at Miza
  rationale: Ang וּ ay isinaling “at.” Ang pangalang מִזָּה ay tinumbasan bilang Miza; hindi kailangang katawanin sa ortograpiyang Filipino ang pagdodoble ng z dahil hindi ito karaniwang palatandaan ng bigkas sa Filipino.
