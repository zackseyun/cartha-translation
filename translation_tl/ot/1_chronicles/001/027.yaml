lexical_decisions:
- source_word: אַבְרָם
  choice: Abram
  rationale: Pangngalang pantangi; ginamit ang karaniwang anyong Filipino ng pangalan.
- source_word: הוּא
  choice: na siya ring
  rationale: Ang nagsasariling panghalip ay literal na “siya,” ngunit sa sugnay na walang pandiwa na nag-uugnay sa dalawang pangalan, likas na ipinahahayag sa Filipino ng “na siya ring” ang pagkakakilanlan ng Abram at Abraham.
- source_word: אַבְרָהָם
  choice: Abraham
  rationale: Pangngalang pantangi; ginamit ang karaniwang anyong Filipino. Tinutukoy ng talata na ang Abram ding ito ay si Abraham.
theological_decisions:
- issue: Paglalahad sa pormulang pagkakakilanlan na walang pandiwa sa kontekstong talaangkanan
  choice: Abram—na siya ring Abraham.
  alternative: Abram, siya ay si Abraham; o Abram ay si Abraham.
  rationale: Binubuo ang Hebreo ng dalawang pangalang pantangi na pinag-uugnay ng panghalip na הוּא. Ang “na siya ring” ay natural sa makabagong Filipino at pinananatili ang tungkulin nitong kilalaning iisang tao ang tinutukoy ng dalawang pangalan, nang hindi nagdaragdag ng teolohikal na interpretasyon.
translation_notes:
  register: Maikli, marangal, at natural na modernong Filipino. Pinanatili ang em dash upang malinaw ang paliwanag sa pangalan, at inilagay ang panandang talababa sa mismong teksto.
