base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/019.yaml
  text: 'And to Eber were born two sons: the name of the one was Peleg[a], because in his days the earth was divided; and his brother’s name was Joktan.'
translation:
  language: tl
  text: 'At ipinanganak kay Eber ang dalawang anak na lalaki: Peleg[a] ang pangalan ng isa, sapagkat noong panahon niya ay nahati ang daigdig; at Joktan ang pangalan ng kapatid niya.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nahati ang lupain.” Ang salitang Hebreo ay maaaring tumukoy sa buong daigdig o sa isang lupain o nasasakupan; hindi tinutukoy ng teksto kung anong uri ng pagkakahati ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְעֵבֶר יֻלַּד שְׁנֵי בָנִים
  choice: At ipinanganak kay Eber ang dalawang anak na lalaki
  rationale: Pinananatili ang pasibong diwa ng יֻלַּד at ang daloy ng talaangkanan. Ang “anak na lalaki” ay tahasang nagpapahayag ng kasarian ng בָנִים sa kontekstong ito.
- source_word: שֵׁם הָאֶחָד פֶּלֶג
  choice: Peleg ang pangalan ng isa
  rationale: Natural sa modernong Tagalog at hindi ginagawang “panganay” o “una” ang הָאֶחָד, na tumutukoy lamang sa isa sa dalawa.
- source_word: כִּי בְיָמָיו
  choice: sapagkat noong panahon niya
  rationale: Ipinahahayag ang paliwanag na sanhi ng pangalang Peleg, habang ang “noong panahon niya” ay natural na katumbas ng idyomang Hebreo.
- source_word: נִפְלְגָה הָאָרֶץ
  choice: nahati ang daigdig
  rationale: Ang נִפְלְגָה ay pasibong “nahati,” at ang הָאָרֶץ ay maaaring tumukoy sa daigdig o lupain. Pinili ang mas malawak na “daigdig” sa teksto, ngunit itinatala sa talababa ang tunay na alternatibo.
- source_word: וְשֵׁם אָחִיו יָקְטָן
  choice: at Joktan ang pangalan ng kapatid niya
  rationale: Pinananatili ang ugnayang magkapatid at inihaharap sa natural na ayos ng pangungusap sa Tagalog.
theological_decisions:
- issue: Kahulugan ng pagkakahati ng הָאָרֶץ noong panahon ni Peleg
  choice: nahati ang daigdig
  alternative: nahati ang lupain; o isang tiyak na pagtukoy sa pagkakahati ng mga bayan, wika, o heograpiya
  rationale: Hindi sinasabi ng tekstong Hebreo kung anong uri ng pagkakahati ang naganap. Kaya hindi ipinapasok sa salin ang isang tiyak na paliwanag, at pinananatili sa talababa ang leksikal na posibilidad na “lupain.”
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang mga kinaugaliang anyo ng pangalang Eber, Peleg, at Joktan, at iniwasan ang sobrang literal ngunit alanganing ayos ng pangungusap.
