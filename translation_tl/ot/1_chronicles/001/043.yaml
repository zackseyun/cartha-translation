reference: 1 Chronicles 1:43
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/אֵ֣לֶּה הַ/מְּלָכִ֗ים אֲשֶׁ֤ר מָלְכוּ֙ בְּ/אֶ֣רֶץ אֱד֔וֹם לִ/פְנֵ֥י מְלָךְ מֶ֖לֶךְ לִ/בְנֵ֣י יִשְׂרָאֵ֑ל בֶּ֚לַע בֶּן בְּע֔וֹר וְ/שֵׁ֥ם עִיר֖/וֹ דִּנְהָֽבָה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/043.yaml
  text: 'And these are the kings who reigned in the land of Edom before any king reigned over the sons of Israel: Bela son of Beor, and the name of his city was Dinhabah.'
translation:
  language: tl
  text: At ito ang mga haring naghari sa lupain ng Edom bago naghari ang isang hari sa mga anak ni Israel:[a] si Bela na anak ni Beor, at Dinhaba ang pangalan ng kaniyang lungsod.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “bago naghari ang sinumang hari sa mga anak ni Israel” o “bago nagkaroon ng hari ang mga anak ni Israel.” Sa literal, “bago ang paghahari ng isang hari para sa/sa mga anak ni Israel.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: At ito ang
  rationale: Pinananatili ng “At” ang pagpapatuloy ng talaan, at natural na panimula sa Filipino ang “ito ang” para sa listahang kasunod.
- source_word: הַמְּלָכִים אֲשֶׁר מָלְכוּ
  choice: mga haring naghari
  rationale: Tuwirang inilalarawan ang mga taong gumampan ng paghahari; ang pag-uulit ng ugat sa Filipino ay malinaw at angkop sa pormal na estilong pangkasaysayan.
- source_word: בְּאֶרֶץ אֱדוֹם
  choice: sa lupain ng Edom
  rationale: Pinananatili ang tahasang “lupain” ng Hebreo sa natural na anyong Filipino.
- source_word: לִפְנֵי מְלָךְ מֶלֶךְ
  choice: bago naghari ang isang hari
  rationale: Malapit ito sa isahang di-tiyak na “hari” sa Hebreo at hindi nito tahasang ipinapasok ang mas interpretatibong “sinumang hari.”
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: sa mga anak ni Israel
  rationale: Pinananatili ang Hebreong katawagang “mga anak ni Israel”; sa konteksto ng paghahari, likas na nauunawaan ang ugnayang pamamahala, habang hindi labis na tinutukoy ang maaaring “para sa” o “sa ibabaw ng.”
- source_word: בֶּלַע בֶּן בְּעוֹר
  choice: si Bela na anak ni Beor
  rationale: Natural na anyo sa Filipino para sa pangalan at kaugnayang ama-anak.
- source_word: וְשֵׁם עִירוֹ דִּנְהָבָה
  choice: at Dinhaba ang pangalan ng kaniyang lungsod
  rationale: Malinaw at natural na nominal na pangungusap sa Filipino, habang pinananatili ang pagtukoy sa lungsod ng hari.
theological_decisions:
- issue: Kung tumutukoy ang parirala sa isang hari, sa sinumang hari, o sa pagsisimula ng monarkiya sa Israel
  choice: bago naghari ang isang hari sa mga anak ni Israel
  alternative: bago naghari ang sinumang hari sa mga anak ni Israel; bago nagkaroon ng hari ang mga anak ni Israel
  rationale: Ang Hebreo ay gumagamit ng isahang di-tiyak na מֶלֶךְ kasunod ng infinitive construct. Pinananatili ng pangunahing salin ang anyong iyon, at inilalahad sa talababa ang mga natural na pagbasa nang hindi nilulutas nang tahasan ang tunay na kalabuan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang estilong talaan ng Mga Cronica, ang salitang “lupain,” at ang katawagang “mga anak ni Israel,” habang iniwasang resolbahin nang palihim ang kalabuan ng Hebreong parirala tungkol sa unang paghahari sa Israel.
