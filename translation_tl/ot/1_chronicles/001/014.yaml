  text: ang mga Jebuseo[a], ang mga Amoreo, at ang mga Girgaseo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ang mga katawagang Hebreo rito ay nasa anyong pang-isahan ngunit kolektibong tumutukoy sa mga bayan: mga Jebuseo, mga Amoreo, at mga Girgaseo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַיְבוּסִי
  choice: ang mga Jebuseo
  rationale: Bagaman anyong pang-isahan ang katawagang Hebreo, kolektibo itong tumutukoy sa isang pangkat ng mga tao sa talaangkanan; natural sa modernong Filipino ang maramihang anyo.
- source_word: הָאֱמֹרִי
  choice: ang mga Amoreo
  rationale: Ang pang-isahang katawagang Hebreo ay gamit na kolektibo para sa bayan; pinananatili ng “mga Amoreo” ang kahulugan at natural na daloy ng listahan.
- source_word: הַגִּרְגָּשִׁי
  choice: ang mga Girgaseo
  rationale: Isinalin bilang maramihang pangalan ng pangkat sapagkat kolektibo ang gamit nito sa talaangkanan.
- source_word: וְאֶת / וְאֵת
  choice: at
  rationale: Hindi tahasang isinasalin sa Filipino ang panandang tuwirang layon; ang mga pang-ugnay ay natural na ipinahahayag sa pamamagitan ng mga kuwit at panghuling “at.”
