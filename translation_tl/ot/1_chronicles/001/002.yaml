lexical_decisions:
- source_word: קֵינָן
  choice: Kenan
  rationale: Pangalan ng tao; tuwirang isinalin-titik mula sa Hebreo sa halip na bigyan ng kahulugan. Ang “Kenan” ay malapit sa anyong Hebreo at pamilyar sa mga mambabasa ng Bibliya.
- source_word: מַהֲלַלְאֵל
  choice: Mahalalel
  rationale: Pangalan ng tao; pinanatili bilang transliterasyon ng Hebreo. Ang “Mahalalel” ay malinaw at mas malapit sa anyong Hebreo kaysa sa tradisyonal na “Mahalaleel.”
- source_word: יָרֶד
  choice: Jared
  rationale: Pangalan ng tao. Bagaman mas mahigpit na matutumbasan ng “Yered” ang bigkas sa Hebreo, pinili ang nakasanayan at madaling makilalang anyong “Jared” sa makabagong Filipino.
