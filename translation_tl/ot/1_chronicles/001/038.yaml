  text: 'And the sons of Seir: Lotan[a], Shobal, Zibeon, Anah, Dishon, Ezer, and Dishan.'
translation:
  language: tl
  text: At ang mga anak[a] ni Seir ay sina Lotan, Shobal, Zibeon, Anah, Dishon, Ezer, at Dishan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa mga talaangkanan, ang Hebreong “mga anak” ay maaaring tumukoy sa mga tuwirang anak o, sa mas malawak na diwa, sa mga inapo o kasapi ng angkan. Pinanatili rito ang pormal na pananalita ng talaangkanan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי
  choice: At ang mga anak ni
  rationale: Ang בְּנֵי ay anyong konstruktong maramihan na nangangahulugang “mga anak ni,” at pinanatili ang ו bilang “At” upang maipakita ang pagpapatuloy ng talaangkanan.
- source_word: שֵׂעִיר
  choice: Seir
  rationale: Pangngalang pantangi sa konteksto ng talaangkanan; tinumbasan ayon sa karaniwang anyong nababasa sa Filipino.
- source_word: לוֹטָן
  choice: Lotan
  rationale: Pangngalang pantangi; tuwirang transliterasyon.
- source_word: שׁוֹבָל
  choice: Shobal
  rationale: Pangngalang pantangi; transliterasyong nagpapanatili sa tunog ng Hebreo.
- source_word: צִבְעוֹן
  choice: Zibeon
  rationale: Pangngalang pantangi; malinaw at karaniwang transliterasyon.
- source_word: עֲנָה
  choice: Ana
  rationale: Pangngalang pantangi; ginamit ang likas na anyong Filipino na “Ana” para sa Hebreong ‘Anah.
- source_word: דִישֹׁן
  choice: Dishon
  rationale: Pangngalang pantangi; pinanatiling naiiba sa kasunod na pangalang דִישָׁן.
- source_word: אֵצֶר
  choice: Ezer
  rationale: Pangngalang pantangi; madaling basahin at malapit sa anyong Hebreo.
- source_word: דִישָׁן
  choice: Dishan
  rationale: Pangngalang pantangi; pinanatili ang pagkakaiba nito sa Dishon, ayon sa magkaibang anyo sa tekstong Hebreo.
