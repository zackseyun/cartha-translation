base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/041.yaml
  text: 'The sons of Anah: Dishon. And the sons of Dishon: Hamran[a], Eshban, Ithran, and Keran.'
translation:
  language: tl
  text: 'Ang mga anak ni Ana: si Dishon. At ang mga anak ni Dishon: sina Hamran[a], Esban, Itran, at Keran.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa katumbas na talaangkanan sa Genesis 36:26, “Hemdan” ang mababasa sa halip na “Hamran.” Sinusunod dito ng pangunahing teksto ang Masoretic Text ng 1 Cronica.
    reason: textual_variant
lexical_decisions:
- source_word: בְּנֵי
  choice: mga anak ni
  rationale: Sa talaangkanan, tuwirang tumutukoy ang panlalaking maramihang anyo sa mga anak na lalaki. Sa Filipino, natural at sapat ang “mga anak ni,” at nililinaw ng kasunod na “si/sina” na mga pangalang panlalaki ang nakatala.
- source_word: עֲנָה
  choice: Ana
  rationale: Pangngalang pantangi na itinumbas sa anyong madaling bigkasin sa Filipino.
- source_word: דִּישׁוֹן
  choice: Dishon
  rationale: Pinanatili ang parehong anyo sa dalawang paglitaw sapagkat ang anak ni Ana ang siya ring ama ng apat na kasunod na pangalan.
- source_word: וּבְנֵי
  choice: At ang mga anak ni
  rationale: Isinalin ang pang-ugnay na ו bilang “At” upang mapanatili ang sunod-sunod na balangkas ng talaangkanan.
- source_word: חַמְרָן
  choice: Hamran
  rationale: Sinusunod ng pangunahing teksto ang pagbasa ng Masoretic Text sa 1 Cronica; inilagay sa talababa ang naiibang anyo sa katumbas na talaangkanan.
- source_word: אֶשְׁבָּן
  choice: Esban
  rationale: Likas na transliterasyong Filipino ng pangalang Hebreo, na gumagamit ng “s” para sa tunog na shin sa halip na digrapong Ingles na “sh.”
- source_word: יִתְרָן
  choice: Itran
  rationale: Tuwirang transliterasyong Filipino ng pangalang Hebreo; ang yod sa simula ay naipahihiwatig ng patinig na “I” sa natural na bigkas.
- source_word: כְרָן
  choice: Keran
  rationale: Tuwirang transliterasyon sa Filipino; ang prefixed conjunction ay kinakatawan ng “at” bago ang huling pangalan.
