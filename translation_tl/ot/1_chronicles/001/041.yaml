translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “si/sina” upang maging natural ang pagtatala ng mga pangalan, habang pinanatili ang maikli at pormulang estruktura ng Hebreong talaangkanan.
