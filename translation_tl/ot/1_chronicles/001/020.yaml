  text: Joktan fathered Almodad[a], Sheleph, Hazarmaveth, and Jerah.
translation:
  language: tl
  text: Si Joktan ay naging ama[a] nina Almodad, Shelef, Hazarmavet, at Jera.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring, “si Joktan ang ama nina Almodad, Shelef, Hazarmavet, at Jera.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יָקְטָן
  choice: Joktan
  rationale: Pangalan ng tao; ginamit ang anyong karaniwan sa mga saling Filipino at malapit sa nakagawiang biblikal na baybay.
- source_word: יָלַד
  choice: naging ama
  rationale: Sa talaangkanan, tumutukoy ito sa pagiging ama o pinagmulan sa linyang angkan. Natural ito sa modernong Filipino at hindi ipinapalagay na kailangang tuwirang anak ang bawat nakatala.
- source_word: אֶת
  choice: hindi hiwalay na isinalin
  rationale: Pananda ito ng tiyak na layon sa Hebreo at naipahahayag na ng balarila ng Filipino.
- source_word: אַלְמוֹדָד
  choice: Almodad
  rationale: Pangalan; tinumbasan sa transliterasyong angkop sa Filipino.
- source_word: שָׁלֶף
  choice: Shelef
  rationale: Pangalan; pinanatili ang tunog na ipinahihiwatig ng Hebreong patinig at gumamit ng baybay na madaling basahin sa Filipino.
- source_word: חֲצַרְמָוֶת
  choice: Hazarmavet
  rationale: Pangalan; transliterasyong nakabatay sa Hebreo, na may huling t sa halip na tradisyonal na Ingles na th.
- source_word: יָרַח
  choice: Jera
  rationale: Pangalan; ginamit ang J para sa unang yod ayon sa karaniwang anyo ng maraming pangalang biblikal sa Filipino, at hindi isinama ang huling h na hindi binibigkas.
theological_decisions:
- issue: Saklaw ng ugnayang ipinahahayag ng יָלַד sa talaangkanan
  choice: naging ama
  alternative: ipinanganak ni / naging anak niya
  rationale: Pinananatili ng 'naging ama' ang panlalaking perspektiba ng pandiwa sa konteksto at ang posibilidad na genealogical ancestry ang tinutukoy, nang hindi pinipilit ang mas tiyak na ugnayang tuwirang ama-anak.
translation_notes:
  register: Modernong Filipino na simple at marangal. Ginamit ang “nina” upang natural na ipakilala ang serye ng mga pangalang tao. Ang marker na [a] ay inilagay pagkatapos ng Joktan upang maiugnay sa pariralang “naging ama,” alinsunod sa ibinigay na ayos ng konsultasyong teksto.
