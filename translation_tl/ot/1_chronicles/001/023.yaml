  text: וְ/אֶת אוֹפִ֥יר וְ/אֶת חֲוִילָ֖ה וְ/אֶת יוֹבָ֑ב כָּל אֵ֖לֶּה בְּנֵ֥י יָקְטָֽן־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/023.yaml
  text: and Ophir[a], Havilah, and Jobab. All these were the sons of Joktan.
translation:
  language: tl
  text: at sina Ofir, Havila, at Jobab. Lahat ng mga ito ay mga anak na lalaki ni Joktan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga inapo ni Joktan.” Sa Hebreo, “mga anak na lalaki ni Joktan,” ngunit sa mga talaangkanan, ang “mga anak na lalaki” ay maaari kung minsang tumukoy nang mas malawak sa angkan o mga inapo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֶת
  choice: at sina
  rationale: Ang וְ ay nag-uugnay sa nagpapatuloy na talaan, samantalang ang אֶת ay pananda ng tuwirang layon at hindi kailangang tumbasan nang hiwalay sa Tagalog. Ang “sina” ay likas na pananda para sa magkakasunod na pangalan ng mga tao.
- source_word: אוֹפִיר
  choice: Ofir
  rationale: Pangngalang pantangi; ginamit ang karaniwang anyong Filipino ng transliterasyon.
- source_word: חֲוִילָה
  choice: Havila
  rationale: Pangngalang pantangi; ginamit ang karaniwang anyong Filipino ng transliterasyon.
- source_word: יוֹבָב
  choice: Jobab
  rationale: Pangngalang pantangi; pinanatili ang nakikilalang anyong biblikal sa Filipino.
- source_word: כָּל אֵלֶּה
  choice: Lahat ng mga ito
  rationale: Malinaw at likas na buod ito ng mga pangalang naunang binanggit at pinananatili ang diin ng demonstratibo.
- source_word: בְּנֵי
  choice: mga anak na lalaki ni
  rationale: Tuwirang ipinahahayag ng Hebreo ang panlalaking pangmaramihang “mga anak na lalaki.” Pinanatili ito sa pangunahing teksto, habang inilagay sa talababa ang posibleng mas malawak na diwang pangangkanan.
- source_word: יָקְטָן
  choice: Joktan
  rationale: Pangngalang pantangi; pinanatili ang nakikilalang tradisyonal na anyong biblikal sa Filipino.
theological_decisions:
- issue: Saklaw ng genealogical na בְּנֵי
  choice: mga anak na lalaki ni Joktan
  alternative: mga inapo ni Joktan
  rationale: Ang literal na anyo ay “mga anak na lalaki,” ngunit sa talaangkanan maaari itong tumukoy nang mas malawak sa mga inapo. Hindi nilutas nang palihim ang posibilidad na ito; pinanatili ang literal na anyo sa teksto at ang alternatibo sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “sina” upang maging likas ang listahan ng mga pangalan, at pinanatili ang tahasang panlalaking anyo ng Hebreo nang hindi ikinukubli ang mas malawak na posibleng kahulugan nito sa kontekstong genealogical.
