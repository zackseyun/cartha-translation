  text: יְט֥וּר נָפִ֖ישׁ וָ/קֵ֑דְמָה אֵ֥לֶּה הֵ֖ם בְּנֵ֥י יִשְׁמָעֵֽאל׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/031.yaml
  text: Jetur[a], Naphish, and Kedemah. These were the sons of Ishmael.
translation:
  language: tl
  text: Jetur, Nafis, at Kedema.[a] Sila ang mga anak ni Ismael.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Kedema ay maaari ring baybayin na Qedema.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְטוּר
  choice: Jetur
  rationale: Pangngalang pantangi; ginamit ang anyong Jetur na pamilyar sa tradisyong biblikal sa Filipino at malapit sa karaniwang transliterasyon.
- source_word: נָפִישׁ
  choice: Nafis
  rationale: Pangngalang pantangi; tuwirang transliterasyon sa modernong baybay-Filipino, kung saan ang Hebrew שׁ ay kinakatawan ng s sa halip na English na sh.
- source_word: וָ/קֵדְמָה
  choice: at Kedema
  rationale: Isinalin ang pang-ugnay ו bilang “at”; ang pangalan ay isina-Filipinong transliterasyon bilang Kedema.
- source_word: אֵלֶּה הֵם
  choice: Sila ang
  rationale: Natural na pangungusap na pantukoy sa Filipino para sa Hebrew na resumptibong pahayag na “ang mga ito ay/sila ang,” habang malinaw na tumutukoy sa mga pangalang nauna.
- source_word: בְּנֵי
  choice: mga anak ni
  rationale: Bagaman literal na “mga anak na lalaki ni,” sa konteksto ng talaangkanan ay mga lalaking anak ang nakalista; ang natural na Filipino na “mga anak ni” ay tumpak at hindi mabigat.
- source_word: יִשְׁמָעֵאל
  choice: Ismael
  rationale: Ginamit ang kinagawiang anyo ng pangalan sa Filipino.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na dignificado at madaling maunawaan. Pinanatili ang anyong talaan ng mga pangalan at gumamit ng mga kinagawiang pangalang biblikal sa Filipino. Inilagay ang talababa pagkatapos ng Kedema, ang salitang tinutukoy nito.
