lexical_decisions:
- source_word: וְאֶת
  choice: at
  rationale: Ang וְ ay nag-uugnay sa mga pangalan sa talaan, samantalang ang אֶת ay pananda ng tuwirang layon at hindi kailangang isalin nang hiwalay sa Filipino. Ginamit ang kuwit at ang panghuling “at” bilang likas na ayos ng listahan.
- source_word: עֵיבָל
  choice: Ebal
  rationale: Isinatinig ang pangalang Hebreo bilang “Ebal,” ayon sa anyo nito sa tekstong WLC. Ang “Obal” sa kapantay na talaangkanan sa Genesis 10:28 ay pinanatili sa talababa bilang mahalagang ibang anyo.
- source_word: אֲבִימָאֵל
  choice: Abimael
  rationale: Isinatinig ang personal na pangalan mula sa Hebreo sa anyong madaling basahin sa Filipino, sa halip na isalin ang posibleng kahulugan nito.
- source_word: שְׁבָא
  choice: Sheba
  rationale: Ginamit ang nakasanayang anyong “Sheba” para sa שְׁבָא. Hindi ginamit ang “Seba,” na kumakatawan sa ibang kahawig na pangalan sa ibang talata.
