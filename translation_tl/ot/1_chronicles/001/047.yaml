base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/047.yaml
  text: Hadad died[a], and Samlah from Masrekah reigned in his place.
translation:
  language: tl
  text: Namatay si Hadad, at si Samla na mula sa Masreka ang naghari bilang kapalit niya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּמָת
  choice: Namatay
  rationale: Tuwirang katumbas ng pandiwang מוּת at natural sa makabagong Filipino; iniiwasan ang di-kinakailangang eupemismo.
- source_word: הֲדָד
  choice: Hadad
  rationale: Pangalang pantangi na tinumbasan sa karaniwang transliterasyong Filipino.
- source_word: וַיִּמְלֹךְ
  choice: naghari
  rationale: Ang מָלַךְ sa pormula ng sunod-sunod na mga hari ay tumutukoy sa paghahari; pinananatili ng 'naghari' ang maikli at pormal na estilo ng talaan.
- source_word: תַּחְתָּיו
  choice: bilang kapalit niya
  rationale: Sa kontekstong ito, ang תַּחַת na may hulaping panghalip ay nagpapahayag ng paghalili sa tungkulin. Likas sa Filipino ang 'bilang kapalit niya' at malinaw na tumutukoy sa paghalili bilang hari.
- source_word: שַׂמְלָה
  choice: Samla
  rationale: Pangalang pantangi; ang anyong 'Samla' ay madaling bigkasin sa Filipino at kumakatawan sa Hebreong שַׂמְלָה nang walang di-kailangang h sa hulihan.
- source_word: מִמַּשְׂרֵקָה
  choice: mula sa Masreka
  rationale: Karaniwang ipinahihiwatig ng pang-ukol na מִן ang pinagmulan o kaugnayan sa isang lugar; malinaw at natural sa Filipino ang 'mula sa Masreka.'
