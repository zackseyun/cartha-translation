base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/011.yaml
  text: Mizraim fathered the Ludites[a], the Anamites, the Lehabites, and the Naphtuhites.
translation:
  language: tl
  text: Naging ama si Mizraim ng mga Ludita[a], mga Anamita, mga Lehabita, at mga Naftuhita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O, kung mas tuwirang isasatitik: “Ludim, Anamim, Lehabim, at Naftuhim.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִצְרַיִם
  choice: Mizraim
  rationale: Ginamit bilang pantanging pangalan sa talaangkanan, kaya isinalin sa tunog sa halip na gawing pangalan ng bansang “Ehipto.”
- source_word: יָלַד
  choice: naging ama
  rationale: Sa konteksto ng talaangkanan, tumutukoy ito sa pagiging ama o pinagmulan ng mga inapo. Ang “naging ama” ay natural sa makabagong Tagalog at pinananatili ang panlalaking balangkas ng talaangkanan.
- source_word: אֶת
  choice: '[hindi hiwalay na isinalin]'
  rationale: Pananda ito ng tiyak na layon sa Hebreo at walang sariling katumbas sa Tagalog; ipinahahayag ang tungkulin nito sa ayos ng pangungusap.
- source_word: לודיים
  choice: mga Ludita
  rationale: Pangalan ito ng isang pangkat ng mga tao. Ang hulaping “-ita” at ang panandang “mga” ay nagbibigay ng natural na anyong etniko sa Tagalog.
- source_word: עֲנָמִים
  choice: mga Anamita
  rationale: Isinalin bilang pangalang etniko sa Tagalog, kaayon ng iba pang pangkat sa talaan.
- source_word: לְהָבִים
  choice: mga Lehabita
  rationale: Isinalin bilang pangalang etniko sa Tagalog upang maging malinaw at pare-pareho ang talaan.
- source_word: נַפְתֻּחִים
  choice: mga Naftuhita
  rationale: Isinalin bilang pangalang etniko sa Tagalog; ang “f” ay malinaw na kumakatawan sa katinig ng pangalang Hebreo sa makabagong Filipino.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “naging ama” sa halip na makalumang “ipinanganak” o “nagkaanak,” at ginawang natural na mga pangalang etniko sa Tagalog ang mga pangalan ng pangkat.
