translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang hulma na “ang mga anak ni … ay sina …” para maging natural ang talaangkanan. Ang mga pangalan ay inangkop sa palabaybayang Filipino habang pinananatili ang mga anyo ng tekstong Hebreo sa Mga Cronica.
