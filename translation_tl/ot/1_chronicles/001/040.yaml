base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/040.yaml
  text: 'The sons of Shobal: Alian[a], Manahath, Ebal, Shephi, and Onam[b]. And the sons of Zibeon: Aiah and Anah.'
translation:
  language: tl
  text: Ang mga anak ni Shobal ay sina Alian[a], Manahat, Ebal, Shefi[b], at Onam. At ang mga anak ni Zibeon ay sina Aya at Ana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo ng Mga Cronica, “Alian”; sa katumbas na talaangkanan sa Genesis 36:23, “Alvan.”
    reason: alternative_reading
  - marker: b
    text: Sa Mga Cronica, “Shefi”; sa katumbas na talaangkanan sa Genesis 36:23, “Shepo.”
    reason: alternative_reading
lexical_decisions:
- source_word: בְּנֵי
  choice: mga anak ni
  rationale: Tuwirang katumbas sa konteksto ng talaangkanan; ang kasunod ay listahan ng mga pinangalanang anak.
- source_word: שׁוֹבָל
  choice: Shobal
  rationale: Pangngalang pantangi; pinanatili sa anyong transliterado at karaniwang baybay sa Bibliyang Filipino.
- source_word: עַלְיָן
  choice: Alian
  rationale: Tuwirang transliterasyon ng anyo sa Hebreo ng Mga Cronica; hindi ito pinalitan ng anyong Alvan mula sa kahawig na tala sa Genesis.
- source_word: מָנַחַת
  choice: Manahat
  rationale: Transliterasyong angkop sa palabaybayang Filipino, kung saan ang pangwakas na titik na ח ay kinakatawan ng t sa nakaugaliang anyo ng pangalan.
- source_word: עֵיבָל
  choice: Ebal
  rationale: Tuwirang transliterasyon ng pangalang nasa tekstong Hebreo.
- source_word: שְׁפִי
  choice: Shefi
  rationale: Tuwirang transliterasyon ng anyo sa Mga Cronica; ang שׁ ay kinakatawan ng sh at ang פִ ng fi.
- source_word: אוֹנָם
  choice: Onam
  rationale: Tuwirang transliterasyon ng pangalang Hebreo.
- source_word: צִבְעוֹן
  choice: Zibeon
  rationale: Transliterasyong sumusunod sa nakaugaliang anyo ng pangalang biblikal.
- source_word: אַיָּה
  choice: Aya
  rationale: Likas na transliterasyon sa Filipino ng pangalang Hebreo, nang hindi gumagamit ng h na hindi karaniwang binibigkas sa Filipino.
- source_word: עֲנָה
  choice: Ana
  rationale: Likas na transliterasyon sa Filipino ng pangalang Hebreo.
- source_word: וְ / וּ / וַ
  choice: at
  rationale: Ang mga pang-ugnay ay nagdurugtong lamang sa mga pangalan at sa dalawang sugnay ng talaangkanan.
