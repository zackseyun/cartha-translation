  text: 'And the sons of Javan: Elishah[a], Tarshish, Kittim, and Rodanim.'
translation:
  language: tl
  text: 'Ang mga anak ni Javan: sina Elishah, Tarshish, Kittim, at Rodanim.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Dodanim” ang mababasa sa Genesis 10:4 sa halip na “Rodanim,” na nagpapakita ng pagkakaiba sa tekstuwal na anyo ng pangalan.
    reason: textual_variant
lexical_decisions:
- source_word: וּבְנֵי
  choice: Ang mga anak ni
  rationale: Ang בְּנֵי ay literal na “mga anak na lalaki ni,” ngunit sa talaangkanan ay natural at sapat na tumpak sa Filipino ang “mga anak ni”; hindi kailangang idagdag ang kasarian sapagkat mga pangalang pantangi ang kasunod.
- source_word: יָוָן
  choice: Javan
  rationale: Pangalang pantangi ito sa anyong talaangkanan, kaya tinumbasan sa pamamagitan ng transliterasyon sa halip na gawing “Gresya” o “mga Griyego.”
- source_word: אֱלִישָׁה
  choice: Elishah
  rationale: Pinanatili bilang transliteradong pangalang pantangi.
- source_word: תַרְשִׁישָׁה
  choice: Tarshish
  rationale: Ginamit ang kinikilalang anyo ng pangalang pantangi; ang hulihang he sa anyong Masoretiko rito ay hindi isinalin bilang hiwalay na sangkap.
- source_word: כִּתִּים
  choice: Kittim
  rationale: Transliterasyon ng etnonimo o pangalang pook, na nagpapanatili sa anyong Hebreo at umiiwas sa mas lumang baybay na “Chittim.”
- source_word: וְרוֹדָנִים
  choice: at Rodanim
  rationale: Sinusunod ng pangunahing teksto ang WLC/Masoretikong pagbasa na רוֹדָנִים; inilagay sa talababa ang ibang pagbasa sa Genesis 10:4.
theological_decisions: []
translation_notes:
  register: 'Makabago ngunit marangal na Filipino. Ginamit ang maikli at estilong talaan na pariralang “Ang mga anak ni Javan: sina …” upang mapanatili ang walang-pandiwang kayarian ng Hebreo habang maging natural sa karaniwang mambabasa. Inilipat ang talababa sa “Rodanim,” ang pangalang mismong tinutukoy ng tekstuwal na pagkakaiba.'
