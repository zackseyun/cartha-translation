- from: Namatay si Baal-hanan, at si Hadad ang naghari bilang kahalili niya. Pai ang pangalan ng lungsod niya,[a] at Mehetabel ang pangalan ng asawa niya. Si Mehetabel ay anak ni Matred, na anak naman ni Mezahab.[b]
  to: Namatay si Baal-hanan, at naghari si Hadad bilang kahalili niya. Pai ang pangalan ng lungsod ni Hadad,[a] at Mehetabel ang pangalan ng kanyang asawa. Si Mehetabel ay anak na babae ni Matred, anak na babae ni Mezahab.[b]
