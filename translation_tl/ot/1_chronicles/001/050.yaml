base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/050.yaml
  text: Baal-hanan died[a], and Hadad reigned in his place. The name of his city was Pai, and the name of his wife was Mehetabel daughter of Matred[b], daughter of Mezahab.
translation:
  language: tl
  text: Namatay si Baal-hanan, at naghari si Hadad bilang kahalili niya. Pai ang pangalan ng lungsod ni Hadad,[a] at Mehetabel ang pangalan ng kanyang asawa. Si Mehetabel ay anak na babae ni Matred, anak na babae ni Mezahab.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Genesis 36:39, “Pau” ang pangalan ng lungsod; “Pai” naman ang mababasa rito sa Mga Cronica.
    reason: textual_variant
  - marker: b
    text: Ang inuulit na “anak na babae ni” ay maaaring mangahulugang “apo na babae ni” sa gamit na panggenealohiya, ngunit pinananatili rito ang mas literal na pagkakasabi sa Hebreo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת בַּעַל חָנָן
  choice: Namatay si Baal-hanan
  rationale: Tuwirang isinasalin ang pandiwang מות sa likas na modernong Tagalog; pinananatili ang pangalang pantangi sa transliterasyon.
- source_word: וַיִּמְלֹךְ תַּחְתָּיו הֲדַד
  choice: si Hadad ang naghari bilang kahalili niya
  rationale: Ipinahahayag ng מלך ang paghahari at ng תחתיו ang paghalili sa naunang hari; malinaw at natural sa Tagalog ang buong parirala.
- source_word: וְשֵׁם עִירוֹ פָּעִי
  choice: Pai ang pangalan ng lungsod niya
  rationale: Nilalagyan ng ipinahihiwatig na copula ang sugnay na walang pandiwa. Sinusunod ang anyong Pai sa teksto ng Mga Cronica, at hindi ipinapalit ang Pau mula sa Genesis.
- source_word: וְשֵׁם אִשְׁתּוֹ מְהֵיטַבְאֵל
  choice: Mehetabel ang pangalan ng asawa niya
  rationale: Pinananatili ang pormula ng pagbibigay-pangalan sa malinaw at kasalukuyang Tagalog.
- source_word: בַּת מַטְרֵד בַּת מֵי זָהָב
  choice: anak ni Matred, na anak naman ni Mezahab
  rationale: Pinananatili ang dalawang ulit na בַּת nang hindi tahasang ginagawang ‘apo’; ang ‘na anak naman’ ay natural na Tagalog ngunit hindi nilulutas ang posibleng lawak ng ugnayang genealogical.
- source_word: מֵי זָהָב
  choice: Mezahab
  rationale: Itinuturing itong pangalang pantangi sa kontekstong genealogical at isinasatitik sa halip na isalin ang mga bahaging leksikal nito.
