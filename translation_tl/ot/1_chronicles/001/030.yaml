  text: Mishma[a], Dumah, Massa, Hadad, and Tema.
translation:
  language: tl
  text: Misma, Duma, Masa, Hadad[a], at Tema.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa katumbas na talaangkanan sa Genesis 25:15 ay “Hadar”; “Hadad” naman ang mababasa sa 1 Cronica.
    reason: textual_variant
lexical_decisions:
- source_word: מִשְׁמָע
  choice: Misma
  rationale: Pangalan sa talaangkanan; isina-Filipino ang transliterasyon ayon sa karaniwang tunog at baybay sa Tagalog.
- source_word: וְ/דוּמָה
  choice: Duma
  rationale: Pangalan ang דוּמָה at isina-Filipino bilang Duma. Hindi na hiwalay na isinalin dito ang וְ dahil natural sa Tagalog na ilagay ang pangatnig na “at” bago ang huling pangalan sa listahan.
- source_word: מַשָּׂא
  choice: Masa
  rationale: Sa kontekstong ito, tiyak na pangalan sa talaangkanan ang salita, hindi ang karaniwang pangngalang maaaring mangahulugang “pasan” o “pahayag”; kaya transliterasyon ang ginamit.
- source_word: חֲדַד
  choice: Hadad
  rationale: Pinanatili ang mismong anyo ng pangalan sa tekstong Hebreo ng 1 Cronica. Ang kaibang anyong Hadar sa Genesis 25:15 ay inilagay sa talababa.
- source_word: וְ/תֵימָא
  choice: at Tema
  rationale: Isinalin ang וְ bilang “at” bago ang huling pangalan, at isina-Filipino ang תֵימָא bilang Tema upang maging natural ang daloy ng listahan.
theological_decisions: []
translation_notes:
  register: Maikli at tuwirang talaan ng mga pangalan. Gumamit ng makabago at karaniwang baybay-Filipino ng mga pangalang Hebreo, nang hindi isinasalin ang posibleng kahulugan ng mga ito. Inilagay ang “at” bago lamang ang huling pangalan upang maging natural sa Tagalog.
