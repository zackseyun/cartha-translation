id: 1CH.1.45
reference: 1 Chronicles 1:45
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יָּ֖מָת יוֹבָ֑ב וַ/יִּמְלֹ֣ךְ תַּחְתָּ֔י/ו חוּשָׁ֖ם מֵ/אֶ֥רֶץ הַ/תֵּימָנִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/045.yaml
  text: And Yobab died[b][a], and Husham from the land of the Temanites reigned in his place.
translation:
  language: tl
  text: Namatay si Yobab[a], at si Husham na mula sa lupain ng mga Temanita[b] ang naghari bilang kahalili niya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tradisyonal na isinusulat na “Jobab” ang “Yobab.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “mula sa lupain ng Teman” o “mula sa lupain ng Temanita.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: Namatay
  rationale: Ang wayyiqtol ng מות ay nagsasalaysay ng kasunod na pangyayari; natural sa Filipino ang tahasang pagbanggit sa simuno na si Yobab.
- source_word: יוֹבָב
  choice: Yobab
  rationale: Tuwirang transliterasyon ito ng Hebreong pangalan at mas malinaw na kumakatawan sa unang tunog na yod kaysa sa tradisyonal na Jobab.
- source_word: וַיִּמְלֹךְ
  choice: naghari
  rationale: Sa pormula ng paghahalili ng mga hari, ipinahihiwatig ng מלך ang pag-upo at paghahari bilang hari; maikli at natural ang “naghari.”
- source_word: תַּחְתָּיו
  choice: bilang kahalili niya
  rationale: Sa konteksto ng paghahalili, tumutukoy ang תחתיו sa paghalili sa posisyon ng naunang hari. Likas sa modernong Filipino ang pariralang ito.
- source_word: חוּשָׁם
  choice: Husham
  rationale: Tuwirang transliterasyon ng Hebreong pangalang חוּשָׁם.
- source_word: מֵאֶרֶץ
  choice: mula sa lupain ng
  rationale: Pinananatili nito ang heograpikong pinagmulan na ipinahahayag ng מן at אֶרֶץ.
- source_word: הַתֵּימָנִי
  choice: mga Temanita
  rationale: Sa pagkakaugnay nito sa “lupain,” natural itong basahin bilang tawag sa mga taong taga-Teman, bagaman maaari ring unawain bilang Teman o isang Temanita; pinananatili sa talababa ang tunay na kalabuan.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “bilang kahalili niya” upang natural na maipahayag ang pormula ng paghalili, habang ang kalabuan ng gentiliko o pangalan ng lugar sa הַתֵּימָנִי ay inilagay sa talababa.
