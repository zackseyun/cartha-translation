base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/051.yaml
  text: 'Hadad died[a], and the chiefs of Edom were: Chief Timna, Chief Aliah[c][b], Chief Jetheth.'
translation:
  language: tl
  text: Namatay si Hadad, at ang mga pinuno[a] ng Edom ay ang pinunong si Timna[b], ang pinunong si Alia[c], at ang pinunong si Yetet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Hebreo ay tumutukoy rito sa isang pinuno ng angkan o lipi ng Edom. Isinasalin ito ng ilang mas matatandang salin bilang “duke.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ding baybayin ang pangalang ito na “Timnah.”
    reason: lexical_alternative
  - marker: c
    text: Sa katumbas na tala sa Genesis 36:40, “Alva” ang pangalan; “Alia” ang mababasa rito sa Mga Cronica.
    reason: textual_variant
lexical_decisions:
- source_word: וַיָּמָת
  choice: Namatay
  rationale: Ang wayyiqtol ng מוּת ay nagsasalaysay ng kasunod na pangyayari. Likas sa Tagalog ang payak na “Namatay”; ang kasunod na וַ ay ipinahayag sa “at” bago ang ikalawang sugnay.
- source_word: הֲדָד
  choice: Hadad
  rationale: Tuwirang transliterasyon ng pangalang Hebreo.
- source_word: וַיִּהְיוּ
  choice: at ... ay
  rationale: Dito, ipinakikilala ng היה ang sumusunod na talaan. Ang hulma na “at ang mga pinuno ... ay” ay natural sa Tagalog at nananatiling malapit sa estruktura ng Hebreo.
- source_word: אַלּוּפֵי / אַלּוּף
  choice: mga pinuno / pinunong
  rationale: Sa talaang Edomita, ang אַלּוּף ay tumutukoy sa pinuno ng angkan o lipi. Malinaw at makabago ang “pinuno,” at iniingatan ng pag-uulit ng “pinunong” ang anyo ng orihinal na listahan.
- source_word: אֱדוֹם
  choice: Edom
  rationale: Karaniwang anyo ng pangalan ng lugar at bayan sa Filipino.
- source_word: תִּמְנָע
  choice: Timna
  rationale: Malapit na transliterasyon ng anyong Hebreo sa talatang ito.
- source_word: עליה
  choice: Alia
  rationale: Isinasalin sa baybay-Filipino ang anyo sa Mga Cronica; hindi ito tahimik na pinapalitan ng “Alva” mula sa kahaliling tala sa Genesis 36:40.
- source_word: יְתֵת
  choice: Yetet
  rationale: Ang paunang י ay kinakatawan ng “Y,” at ang ת ng “t,” ayon sa bigkas ng Hebreo sa halip na sundin ang tradisyonal na baybay-Ingles na “Jetheth.”
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang paulit-ulit na titulong “pinunong” upang masalamin ang pormula ng listahang Hebreo, habang iniwasan ang lipas at banyagang titulong “duke.”
