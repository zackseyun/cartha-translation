base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/005.yaml
  text: 'The sons of Japheth: Gomer[a], Magog, Madai, Javan, Tubal, Meshech, and Tiras.'
translation:
  language: tl
  text: 'Ang mga anak ni Jafet[a]: sina Gomer, Magog, Madai, Javan, Tubal, Mesec, at Tiras.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, ang “mga anak ni” ay maaaring tumukoy sa mga tuwirang anak o, sa mas malawak na gamit sa talaangkanan, sa mga inapo. Dito, ipinakikilala nito ang linya ni Jafet sa anyong listahan.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: mga anak ni
  rationale: Ang construct plural ng בֵּן ay panimula sa talaangkanan. Pinananatili ng “mga anak ni” ang tuwirang genealogical na anyo, bagaman maaari itong tumukoy sa mas malawak na mga inapo sa ibang konteksto.
- source_word: יֶפֶת
  choice: Jafet
  rationale: Pangngalang pantangi; ginamit ang anyong karaniwan at madaling makilala sa makabagong saling Tagalog.
- source_word: גֹּמֶר
  choice: Gomer
  rationale: Pangngalang pantangi sa talaangkanan; tinumbasan sa pamamagitan ng transliterasyon.
- source_word: מָגוֹג
  choice: Magog
  rationale: Pangngalang pantangi; pinanatili bilang transliteradong pangalan.
- source_word: מָדַי
  choice: Madai
  rationale: Bagaman maaaring maiugnay sa mga Medo, pangalan ang gamit dito kaya hindi ito isinaling bilang pangalan ng isang pangkat-etniko.
- source_word: יָוָן
  choice: Javan
  rationale: Pangngalang pantangi sa talaangkanan; pinanatili bilang pangalan sa halip na ipakahulugang Gresya o Ionia.
- source_word: תֻבָל
  choice: Tubal
  rationale: Pangngalang pantangi; transliterasyon ang angkop.
- source_word: מֶשֶׁךְ
  choice: Mesec
  rationale: Pangngalang pantangi; ginamit ang anyong natural basahin sa ortograpiyang Filipino habang kumakatawan sa Hebreong pangalan.
- source_word: תִירָס
  choice: Tiras
  rationale: Pangngalang pantangi; transliterasyon ang angkop.
- source_word: וְ / וּ
  choice: mga kuwit at “at” bago ang huling pangalan
  rationale: Paulit-ulit ang pangatnig sa Hebreong talaan, ngunit natural sa modernong Tagalog ang mga kuwit at isang “at” bago ang huling aytem; napapanatili nito ang tungkulin ng listahan.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “sina” upang natural na ipakilala ang listahan ng mga pangalan. Inilagay ang talababa sa dulo ng buong tala dahil ang paliwanag ay tungkol sa pambungad na pariralang “mga anak ni,” hindi kay Gomer lamang.
