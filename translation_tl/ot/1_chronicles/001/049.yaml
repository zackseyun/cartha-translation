translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang karaniwang ayos na “si … ang naghari” upang natural na maipahayag ang paghalili, nang hindi dinaragdagan ang kahulugan ng tekstong Hebreo.
