  yaml_path: translation/ot/1_chronicles/001/049.yaml
  text: And Shaul died[a], and Baal-hanan son of Akbor reigned in his place.
translation:
  language: tl
  text: Namatay si Shaul[a], at si Baal-hanan na anak ni Akbor ang naghari bilang kapalit niya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa mga tradisyonal na salin, madalas baybayin ang mga pangalang Shaul at Akbor bilang “Saul” at “Achbor.” Gumagamit dito ng mga transliterasyong mas tuwirang batay sa Hebreo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: Namatay
  rationale: Ang Qal wayyiqtol ng מות ay karaniwang anyong pasalaysay na nangangahulugang “at namatay siya.” Natural sa Filipino na ang ugnayang “at” ay hindi na ulitin sa simula ng maikling talatang ito.
- source_word: שָׁאוּל
  choice: Shaul
  rationale: Tuwirang transliterasyon ng pangalang Hebreo; pinananatili ang tunog na sh sa halip na gamitin ang nakaugaliang anyong Saul.
- source_word: וַיִּמְלֹךְ
  choice: naghari
  rationale: Ang Qal wayyiqtol ng מלך sa pormula ng paghalili sa hari ay tumutukoy sa paghahari o pagiging hari. Ang “naghari” ay maikli, malinaw, at angkop sa salaysay.
- source_word: תַּחְתָּיו
  choice: bilang kapalit niya
  rationale: Ipinapahayag ng תַּחַת na may hulaping panghalip ang paghalili o pagkuha sa puwesto ng nauna; natural itong ipinapahayag sa Filipino bilang “bilang kapalit niya.”
- source_word: בַּעַל חָנָן
  choice: Baal-hanan
  rationale: Transliterasyon ng tambalang pangalang Hebreo; pinananatili ng gitling ang dalawang sangkap ng pangalan.
- source_word: בֶּן
  choice: anak ni
  rationale: Sa talaangkanan at pormula ng pagkakakilanlan, tuwirang tumutukoy ang בֶּן sa anak na lalaki. Sa Filipino, sapat at mas natural ang “anak ni” kaysa “anak na lalaki ni.”
- source_word: עַכְבּוֹר
  choice: Akbor
  rationale: Payak na transliterasyon mula sa Hebreo, kasuwato ng anyong ibinigay sa audited consultation layer.
