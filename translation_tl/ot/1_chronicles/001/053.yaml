lexical_decisions:
- source_word: אַלּוּף
  choice: pinuno
  rationale: Sa talaan ng mga Edomita, tumutukoy ito sa isang pinuno ng angkan o lipi. Natural at malinaw sa modernong Filipino ang “pinuno,” at hindi nito ipinapalagay na ang mga pangalan ay tiyak na mga indibidwal lamang.
- source_word: קְנַז
  choice: Kenaz
  rationale: Pangngalang pantangi; tinumbasan sa baybay na karaniwang ginagamit sa Filipino sa halip na isalin ang kahulugan.
- source_word: תֵּימָן
  choice: Teman
  rationale: Gumaganap dito bilang pangngalang pantangi sa talaan ng mga pinuno ng Edom, bagaman maaari rin itong maiugnay sa isang angkan o rehiyon.
- source_word: מִבְצָר
  choice: Mibzar
  rationale: Pangngalang pantangi; isinalin sa pamamagitan ng transliterasyon, alinsunod sa paghawak sa mga pangalan sa talaang ito.
