  yaml_path: translation/ot/1_chronicles/001/035.yaml
  text: 'The sons of Esau: Eliphaz[a], Reuel, Jeush, Jalam, and Korah.'
translation:
  language: tl
  text: 'Ang mga anak na lalaki ni Esau: sina Elifaz, Reuel[a], Jeus, Jalam, at Kora.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Reuel ay tinatawag ding “Raguel” sa ilang tradisyon. Magkaibang paraan lamang ito ng paglilipat ng iisang pangalan, hindi magkaibang pangalan.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: mga anak na lalaki ni
  rationale: Ang konstruktong maramihan ng בֵּן ay tumutukoy rito sa mga tunay na anak na lalaki na nakalista sa talaangkanan. Pinananatili ng parirala ang kasariang hayag sa Hebreo, samantalang natural pa rin ito sa modernong Filipino.
- source_word: עֵשָׂו
  choice: Esau
  rationale: Ginamit ang nakasanayang anyo ng pangalan sa Filipino at sa tradisyong biblikal.
- source_word: אֱלִיפַז
  choice: Elifaz
  rationale: Isinulat ang pangalan ayon sa tunog ng Hebreo at sa makabagong ortograpiyang Filipino.
- source_word: רְעוּאֵל
  choice: Reuel
  rationale: Tuwirang kumakatawan ito sa pangalang Hebreo; ang “Raguel” ay anyong nagmula sa ibang landas ng transliterasyon.
- source_word: וִיעוּשׁ
  choice: Jeus
  rationale: Inangkop sa makabagong ortograpiyang Filipino ang pangalang יְעוּשׁ, habang pinananatili ang nakikilalang anyong biblikal.
- source_word: וְיַעְלָם
  choice: Jalam
  rationale: Malapit na transliterasyon ng pangalang Hebreo na iniangkop sa karaniwang pagbasa sa Filipino.
- source_word: וְקֹרַח
  choice: at Kora
  rationale: Ang Kora ay natural na anyong Filipino ng pangalang Hebreo; isinalin ang pang-ugnay na וְ bilang “at” sa huling pangalan ng talaan.
theological_decisions: []
translation_notes:
  register: Maikli at marangal ang ayos, gaya ng isang talaangkanan. Ginamit ang “sina” upang maging natural sa Filipino ang pagpapakilala ng sunod-sunod na mga pangalan. Inilagay ang panandang [a] pagkatapos ng “Reuel,” ang pangalang tinutukoy ng talababa.
