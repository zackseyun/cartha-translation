base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/017.yaml
  text: 'The sons of Shem: Elam[a], Asshur, Arpachshad, Lud, and Aram; Uz, Hul, Gether, and Meshech.'
translation:
  language: tl
  text: Ang mga anak ni Sem ay sina Elam, Asur, Arpacsad, Lud, at Aram; Uz, Hul, Geter, at Mesec.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa kaparehong talaangkanan sa Genesis 10:23, “Mas” ang mababasa sa halip na “Mesec.”
    reason: textual_variant
lexical_decisions:
- source_word: בְּנֵי
  choice: mga anak ni
  rationale: Tuwirang katumbas ng construct plural na “mga anak ni” at angkop sa talaangkanan; hindi pinalawak sa “mga inapo” dahil mga anak ang tahasang anyo ng Hebreo.
- source_word: שֵׁם
  choice: Sem
  rationale: Ginamit ang nakasanayang anyong Filipino ng pangalang Shem.
- source_word: עֵילָם
  choice: Elam
  rationale: Karaniwang anyong Filipino ng pangalang pantangi.
- source_word: אַשּׁוּר
  choice: Asur
  rationale: Itinuring itong pangalan ng ninuno sa talaangkanan, hindi ang pangheograpiyang “Asiria.”
- source_word: אַרְפַּכְשַׁד
  choice: Arpacsad
  rationale: Nakikilalang anyong Filipino ng pangalan at malapit sa anyong Hebreo.
- source_word: לוּד
  choice: Lud
  rationale: Pinanatili ang isahang pangalang pantangi; hindi ginawang Ludim.
- source_word: אֲרָם
  choice: Aram
  rationale: Pangalan ng ninuno ang diwa rito, hindi ang mas huling katawagang heograpikal na Siria.
- source_word: עוּץ
  choice: Uz
  rationale: Maikli at nakikilalang transliterasyon ng pangalang pantangi.
- source_word: חוּל
  choice: Hul
  rationale: Tuwirang transliterasyon na madaling basahin sa Filipino.
- source_word: גֶתֶר
  choice: Geter
  rationale: Inangkop sa karaniwang baybay at bigkas sa Filipino.
- source_word: מֶשֶׁךְ
  choice: Mesec
  rationale: Isinalin ang mismong pagbasa ng tekstong Masoretiko sa talatang ito; ang naiibang “Mas” sa Genesis 10:23 ay inilagay sa talababa.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “ay sina” upang likas na ipakilala ang listahan ng mga pangalang pantangi, habang pinanatili ng tuldok-kuwit ang paghahati ng listahan sa tekstong Hebreo.
