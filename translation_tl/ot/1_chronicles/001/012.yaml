  yaml_path: translation/ot/1_chronicles/001/012.yaml
  text: and the Pathrusites[a], and the Casluhites (from whom the Philistines came), and the Caphtorites.
translation:
  language: tl
  text: at ang mga Patruseo, ang mga Casluheo (na mula roon ay lumabas ang mga Filisteo[a]), at ang mga Caftoreo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal na, “na mula roon ay lumabas ang mga Filisteo.” Sa Hebreo ng 1 Cronica, ang sugnay ay pinakanatural na nakakabit sa mga Casluheo, bagaman ang “mula roon” ay isang panlaping panlugar. Gayon din ang pagkakasabi sa Genesis 10:14, at iniuugnay rin ng ibang mga teksto ang mga Filisteo sa Caftor (tingnan ang Amos 9:7; Jeremias 47:4).
    reason: Nililinaw ang literal na anyo ng Hebreo at ang posibleng saklaw ng sugnay nang hindi ipinipilit sa pangunahing teksto ang isang higit na tiyak na pagpapakahulugan.
lexical_decisions:
- source_word: פַּתְרֻסִים
  choice: mga Patruseo
  rationale: Isinalin bilang katawagan sa pangkat ng mga tao na nagmula sa pangalang Patros, ayon sa likas na anyo ng mga etnonimo sa Filipino.
- source_word: כַּסְלֻחִים
  choice: mga Casluheo
  rationale: Hindi tiyak ang eksaktong pagkakakilanlan ng pangkat, kaya tinumbasan ito sa pamamagitan ng transliterasyon sa halip na bigyan ng mapagpalagay na kahulugan.
- source_word: אֲשֶׁר יָצְאוּ מִשָּׁם
  choice: na pinagmulan ng ...
  rationale: Ang literal na diwa ay ‘na mula roon ay lumabas.’ Sa talaangkanan, likas sa Filipino ang ‘na pinagmulan ng’ at malinaw nitong iniuugnay ang sugnay sa kaagad na naunang pangkat nang hindi ito ginagawang indibiduwal na ninuno.
- source_word: פְּלִשְׁתִּים
  choice: mga Filisteo
  rationale: Ito ang karaniwang katawagang Filipino sa kilalang pangkat ng mga Filisteo.
- source_word: כַּפְתֹּרִים
  choice: mga Caftoreo
  rationale: Tinumbasan bilang etnonimong kaugnay ng Caftor, gamit ang anyong likas sa tradisyon ng mga pangalang biblikal sa Filipino.
- source_word: וְאֶת
  choice: at ang
  rationale: Hindi hiwalay na isinasalin ang panandang layon; ang pangatnig at pantukoy ang natural na naghahayag ng pagkakahanay sa talaan.
theological_decisions:
- issue: Kung aling pangkat ang tinutukoy na pinagmulan ng mga Filisteo
  choice: Iniuugnay sa mga Casluheo sa pangunahing teksto
  alternative: Iugnay sa mga Caftoreo o panatilihin lamang ang literal na ‘mula roon’
  rationale: Sa ayos ng Hebreo sa 1 Cronica, ang sugnay ay pinakanatural na nakakabit sa kaagad na naunang ‘mga Casluheo.’ Gayunman, hindi ikinukubli ng talababa ang kaugnayan ng mga Filisteo sa Caftor sa iba pang mga teksto.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang ‘mga’ upang malinaw na ang mga pangalan ay tumutukoy sa mga pangkat ng tao, at pinanatili ang maikli at sunod-sunod na anyo ng talaangkanan.
