base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/048.yaml
  text: Samlah died[a], and Shaul from Rehoboth by the River reigned in his place.
translation:
  language: tl
  text: Namatay si Samla, at si Shaul na mula sa Rehobot sa tabi ng Ilog[a] ang naghari bilang kapalit niya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ilog”; ipinapalagay ng marami na ang tinutukoy ay ang Eufrates.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: Namatay
  rationale: Tuwirang isinasalin ang Qal wayyiqtol ng מות at iniiwasan ang hindi kailangang eupemismo.
- source_word: שַׂמְלָה
  choice: Samla
  rationale: Isinatinig ang pangalang Hebreo sa paraang natural basahin sa Filipino.
- source_word: וַיִּמְלֹךְ
  choice: naghari
  rationale: Ang מלך sa pormula ng paghalili ng hari ay likas na isaling “naghari”; ipinahahayag ng kasunod na parirala ang paghalili.
- source_word: תַּחְתָּיו
  choice: bilang kapalit niya
  rationale: Malinaw at natural nitong ipinahahayag ang kahulugan ng תחת sa konteksto ng paghalili sa trono.
- source_word: שָׁאוּל
  choice: Shaul
  rationale: Malapit na transliterasyon ito ng pangalang Hebreo at nakatutulong na huwag agad ipagkamali ang haring Edomita sa mas kilalang Saul ng Israel.
- source_word: מֵרְחֹבוֹת
  choice: mula sa Rehobot
  rationale: Isinasalin ng “mula sa” ang prefiks na מֵ, samantalang pinananatili bilang pangalan ng lugar ang Rehobot.
- source_word: הַנָּהָר
  choice: Ilog
  rationale: Literal itong “ang ilog,” ngunit maaaring nagsisilbing kilalang heograpikong pantukoy; ang malaking titik ay nagpapanatili sa posibilidad na ito nang hindi tahasang pinapangalanang Eufrates.
theological_decisions: []
translation_notes:
  register: Ginamit ang payak ngunit marangal na makabagong Filipino. Ang ayos na “sa tabi ng Ilog” ay natural na nag-uugnay sa Rehobot at sa heograpikong pantukoy, habang pinananatili ng talababa ang hindi ganap na tiyak na pagkakakilanlan ng ilog.
