translation:
  language: tl
  text: 'At ang mga anak na lalaki ni Gomer: sina Ashkenaz, Difat[a], at Togarma.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa katumbas na talaangkanan sa Genesis 10:3 ay “Rifat” ang mababasa; ngunit dito sa tekstong Hebreo ng 1 Cronica ay “Difat.”
    reason: textual_variant
lexical_decisions:
- source_word: וּבְנֵי
  choice: At ang mga anak na lalaki ni
  rationale: Isinasalin ang ו bilang “At” upang mapanatili ang daloy ng talaan, at ang בְּנֵי bilang “mga anak na lalaki” upang malinaw na maipahayag ang panlalaking anyo ng salitang Hebreo sa konteksto ng talaangkanan.
- source_word: גֹּמֶר
  choice: Gomer
  rationale: Pangngalang pantangi; tinumbasan sa baybay na natural at madaling basahin sa Filipino.
- source_word: אַשְׁכֲּנַז
  choice: Askenaz
  rationale: Pangngalang pantangi; nilapitan ang tunog ng Hebreo sa paraang natural sa ortograpiyang Filipino.
- source_word: דִיפַת
  choice: Difat
  rationale: Sinusunod ng pangunahing teksto ang anyong דִיפַת (Difat) sa tekstong Hebreo ng Mga Cronica; ang ibang anyo sa kapantay na talaangkanan ay inilagay sa talababa.
- source_word: תוֹגַרְמָה
  choice: Togarma
  rationale: Pangngalang pantangi; ang hulíng h ay hindi isinama sapagkat hindi ito binibigkas bilang katinig sa pangalang Hebreo, kaya “Togarma” ang mas natural na anyong Filipino.
theological_decisions: []
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “sina” bago ang sunod-sunod na pangalan ng mga tao para sa likas na daloy sa Tagalog, habang pinanatili ang tahasang “mga anak na lalaki” ng Hebreo. Inilagay ang pananda ng talababa pagkatapos ng “Difat,” ang mismong pangalang may tekstuwal na pagkakaiba.
