  text: 'The sons of Eliphaz: Teman[a], Omar, Zephi, Gatam, Kenaz, Timna[b], and Amalek.'
translation:
  language: tl
  text: Ang mga anak ni Elifaz ay sina Teman, Omar, Zefi[a], Gatam, Kenaz, Timna[b], at Amalek.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang pangalan sa Hebreo rito ay Zefi; nasa Genesis 36:11 ang ibang anyong Zefo.
    reason: textual_variant
  - marker: b
    text: Ayon sa Genesis 36:12, si Timna ay babaing kinakasama ni Elifaz, at si Amalek ang anak nila. Dito sa Mga Cronica, kapwa kasama ang kanilang mga pangalan sa talaan ng mga anak ni Elifaz.
    reason: cross_reference
lexical_decisions:
- source_word: בְּנֵי
  choice: Ang mga anak ni
  rationale: Ito ang tuwirang salin ng construct plural ng בֵּן sa isang talaangkanan. Hindi ginawang “mga inapo” sapagkat mas tiyak dito ang “mga anak.”
- source_word: אֱלִיפָז
  choice: Elifaz
  rationale: Isinatinig ang pangalang pantangi ayon sa karaniwang anyong Filipino.
- source_word: תֵּימָן
  choice: Teman
  rationale: Isinatinig ang pangalang pantangi sa likas at nakikilalang anyong Filipino.
- source_word: אוֹמָר
  choice: Omar
  rationale: Tuwirang pagsasatinig ng pangalang pantangi.
- source_word: צְפִי
  choice: Zefi
  rationale: Pinananatili ang anyo ng pangalan sa Mga Cronica, צְפִי, at ginagamit ang “Z” bilang natural na pagsasatinig sa Filipino. Ang ibang anyo sa Genesis 36:11 ay inilagay sa talababa.
- source_word: גַעְתָּם
  choice: Gatam
  rationale: Tuwirang pagsasatinig ng pangalang pantangi.
- source_word: קְנַז
  choice: Kenaz
  rationale: Isinatinig ang pangalang pantangi sa anyong madaling basahin sa Filipino.
- source_word: תִמְנָע
  choice: Timna
  rationale: Pinananatili ang anyo ng pangalan ayon sa pagbigkas sa talatang ito.
- source_word: עֲמָלֵק
  choice: Amalek
  rationale: Tuwirang pagsasatinig ng pangalan ng ninunong pantao o pantribo.
- source_word: וְ / וַ
  choice: mga kuwit at “at” bago ang huling pangalan
  rationale: Bagaman inuulit sa Hebreo ang pang-ugnay sa talaan, mas natural sa modernong Filipino ang mga kuwit at isang “at” bago ang huling pangalan.
theological_decisions:
- issue: Ugnayan nina Timna at Amalek kay Elifaz kung ihahambing sa Genesis 36
  choice: Kapwa isinama sina Timna at Amalek sa talaan ng “mga anak ni Elifaz,” ayon sa payak na anyo ng teksto sa Mga Cronica.
  alternative: Ituring si Timna bilang kinakasama ni Elifaz at si Amalek bilang anak nila, ayon sa Genesis 36:12.
  rationale: Inilalahad ng Hebreong teksto rito ang isang payak na talaan sa ilalim ng “mga anak ni Elifaz.” Hindi tahimik na pinagtutugma ang talata sa Genesis; sa halip, pinananatili sa pangunahing teksto ang anyo ng Mga Cronica at ipinapaliwanag ang pagkakaiba sa talababa.
translation_notes:
  register: 'Modernong Filipino na marangal at madaling maunawaan. Ginamit ang hulma na “Ang mga anak ni … ay sina …” upang maging natural sa Filipino habang pinananatili ang payak na estruktura ng talaangkanan. Inayos ang pagkakalagay ng mga pananda ng talababa ayon sa nilalaman: ang variant ng Zefi ay nasa [a], at ang usapin tungkol kay Timna at Amalek ay nasa [b].'
