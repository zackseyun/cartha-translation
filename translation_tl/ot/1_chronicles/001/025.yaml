lexical_decisions:
- source_word: עֵבֶר
  choice: Eber
  rationale: Pangalan ng tao sa talaangkanan; tinumbasan sa pamamagitan ng tuwirang transliterasyon mula sa Hebreo. Ang “Eber” ay malinaw at likas sa makabagong Filipino, samantalang ang “Heber” ay alternatibong anyo sa ilang tradisyon.
- source_word: פֶּלֶג
  choice: Peleg
  rationale: Ginagamit dito bilang pangalan ng tao, kaya hindi isinalin ayon sa karaniwang kahulugan nitong “pagkakahati” o “daluyan.” Pinanatili ang nakasanayang anyong “Peleg.”
- source_word: רְעוּ
  choice: Reu
  rationale: Pangalan ng tao; ang “Reu” ay payak at madaling basahing transliterasyon. Hindi na nilagyan ng kudlit upang manatiling natural sa tekstong Filipino.
