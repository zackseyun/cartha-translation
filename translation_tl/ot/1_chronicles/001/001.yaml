  rationale: Pantanging pangalan ito sa talaangkanan. Ginamit ang nakaugaliang anyong Filipino na “Enos,” na malinaw at pamilyar sa mga mambabasang Filipino.
theological_decisions:
- issue: Pagpapakahulugan sa אָדָם
  choice: Adan bilang pantanging pangalan
  alternative: tao o sangkatauhan
  rationale: Ang anyo at konteksto ng talata ay isang talaangkanan ng mga taong pinangalanan. Kaya ang אָדָם dito ay tumutukoy sa indibidwal na si Adan, bagaman maaari itong mangahulugang “tao” o “sangkatauhan” sa ibang konteksto.
