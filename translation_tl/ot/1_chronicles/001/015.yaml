  text: and the Hivites[a], and the Arkites, and the Sinites.
translation:
  language: tl
  text: at ang mga Hivita,[a] ang mga Arkita, at ang mga Sinita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, isahan ang anyo ng mga katawagang ito (“ang Hivita,” “ang Arkita,” at “ang Sinita”), ngunit sa konteksto ng talaangkanan ay tumutukoy ang mga ito sa mga pangkat ng tao o mga angkan; kaya ginamit sa salin ang maramihang anyo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת
  choice: at
  rationale: Isinalin ang pang-ugnay na ו bilang “at.” Hindi hiwalay na isinalin ang panandang tuwirang layon na אֵת sapagkat wala itong likas na katumbas sa Filipino sa ganitong talaan.
- source_word: הַחִוִּי
  choice: ang mga Hivita
  rationale: Bagaman anyong isahan ang katawagang gentiliko sa Hebreo, tumutukoy ito rito sa isang pangkat ng tao; natural sa Filipino ang maramihang “mga Hivita.”
- source_word: הָעַרְקִי
  choice: mga Arkita
  rationale: Katawagan ito sa isang pangkat o angkan sa talaangkanan. Ginamit ang maramihang anyo sa Filipino upang maipahayag ang kolektibong diwa.
- source_word: הַסִּינִי
  choice: mga Sinita
  rationale: Katawagan ito sa isang pangkat ng tao. Ang “mga Sinita” ay malinaw at natural na salin ng kolektibong gamit sa kontekstong ito.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang anyo ng isang nagpapatuloy na talaan sa pamamagitan ng panimulang “at,” at ginamit ang karaniwang hulaping -ita sa mga katawagang etniko.
