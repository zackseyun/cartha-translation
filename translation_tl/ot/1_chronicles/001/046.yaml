base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/046.yaml
  text: And Husham died[a], and Hadad son of Bedad reigned in his place, who struck Midian in the field of Moab; and the name of his city was Avith.
translation:
  language: tl
  text: At namatay si Husam. Si Hadad na anak ni Bedad ang naghari bilang kahalili niya, na siyang lumusob laban sa Midian sa kapatagan ng Moab. Avit[a] ang pangalan ng lungsod niya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Aiot,” isang alternatibong transliterasyon ng pangalan ng lungsod.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: namatay
  rationale: Tuwiran at karaniwang salin ng מות; iniiwasan ang eupemismo.
- source_word: חוּשָׁם
  choice: Husam
  rationale: Isinatinig ang pangalang Hebreo ayon sa likas na baybay sa Filipino.
- source_word: וַיִּמְלֹךְ תַּחְתָּיו
  choice: ang naghari bilang kahalili niya
  rationale: Ipinahahayag ang paghalili sa paghahari na nasa מלך at תחתיו, sa natural na Filipino.
- source_word: הֲדַד בֶּן בְּדַד
  choice: Hadad na anak ni Bedad
  rationale: Pinananatili ang mga pangalan at ang tuwirang ugnayang ama-anak ng Hebreo.
- source_word: הַמַּכֶּה אֶת־מִדְיָן
  choice: siya ang lumupig sa Midian
  rationale: Ang participle ng נכה ay tumutukoy sa bantog na tagumpay militar ni Hadad. Ang “lumupig” ay natural at marangal sa Filipino nang hindi dinaragdagan ang detalye ng labanan.
- source_word: בִּשְׂדֵה מוֹאָב
  choice: sa lupain ng Moab
  rationale: Maaaring tumukoy ang שׂדה sa bukid, kaparangan, o teritoryo; mas malinaw dito ang panrehiyong diwang “lupain” kaysa sa isang literal na bukid.
- source_word: וְשֵׁם עִירוֹ
  choice: ang pangalan ng lungsod niya
  rationale: Natural na salin ng pormulang Hebreo para sa pagbibigay ng pangalan ng lungsod.
- source_word: עיות
  choice: Avit
  rationale: Isinatinig ang pangalan ng lugar sa paraang madaling basahin sa Filipino; may kawalang-katiyakan sa anyo at pagbasa ng pangalan.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Hinati sa dalawang pangungusap ang mahabang Hebreong hanay upang maging madaling maunawaan, habang pinananatili ang pagkakasunod ng mga pangyayari. Inilagay ang talababa sa “Avit,” sapagkat iyon ang salitang tinutukoy ng alternatibong pagsasatinig.
