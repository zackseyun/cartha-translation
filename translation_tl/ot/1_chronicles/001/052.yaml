  text: Chief Oholibamah[a], chief Elah, chief Pinon.
translation:
  language: tl
  text: Pinunong Oholibama[a], pinunong Ela, pinunong Pinon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pinuno ng angkan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַלּוּף
  choice: pinuno
  rationale: Sa talaan ng mga Edomita, tumutukoy ang אַלּוּף sa isang pinuno ng lipi o angkan. Likas at maikli sa modernong Tagalog ang “pinuno,” at angkop ito sa paulit-ulit na pormula bago ang bawat pangalan.
- source_word: אָהֳלִיבָמָה
  choice: Oholibama
  rationale: Isinalin-titik ang pangalang Hebreo sa anyong madaling basahin sa Filipino, nang hindi isinasalin ang posibleng kahulugan nito.
- source_word: אֵלָה
  choice: Ela
  rationale: Isinalin-titik ang pangalan mula sa Hebreo ayon sa natural na baybay at bigkas sa Filipino.
- source_word: פִּינֹן
  choice: Pinon
  rationale: Isinalin-titik nang tuwiran ang pangalan mula sa Hebreo, gamit ang maikli at malinaw na anyong Filipino.
theological_decisions: []
translation_notes:
  register: Gumamit ng maikli, marangal, at likas na pormulang “Pinunong [pangalan]” upang mapanatili ang paulit-ulit na estruktura ng Hebreo. Ang mga pangalang pantangi ay isinalin-titik para sa modernong mambabasang Filipino.
