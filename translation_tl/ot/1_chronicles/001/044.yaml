base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/044.yaml
  text: Bela died[a], and Jobab son of Zerah from Bozrah reigned in his place.
translation:
  language: tl
  text: Namatay si Bela, at pumalit sa kanya bilang hari si Jobab na anak ni Zera, mula sa Bozra[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “taga-Bozra.” Maaaring ipahiwatig ng pang-ukol sa Hebreo ang pinagmulan o ang kaugnayan sa lungsod.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: Namatay
  rationale: Ang wayyiqtol ng מוּת ay nagsasalaysay ng kasunod na pangyayari. Natural sa Filipino na simulan ito sa “Namatay” nang hindi na isinasalin nang hiwalay ang waw bilang “at.”
- source_word: בָּלַע
  choice: Bela
  rationale: Pangalang pantangi; isina-Filipino ang transliterasyon nang simple at madaling basahin.
- source_word: וַיִּמְלֹךְ
  choice: ang naghari
  rationale: Ang Qal wayyiqtol ng מלך ay tumutukoy sa paghalili sa paghahari. Ang “naghari” ay maikli, natural, at angkop sa pormula ng paghalili ng mga hari.
- source_word: תַּחְתָּיו
  choice: bilang kahalili niya
  rationale: Sa konteksto ng paghalili, ipinahihiwatig ng תחת na pumalit si Jobab sa posisyon ni Bela. Mas natural sa modernong Filipino ang “bilang kahalili niya” kaysa literal na “sa lugar niya.”
- source_word: יוֹבָב
  choice: Jobab
  rationale: Pangalang pantangi; pinanatili ang kinikilalang anyo ng pangalan.
- source_word: בֶּן זֶרַח
  choice: anak ni Zera
  rationale: Tuwirang salin ng Hebreong patronimiko sa natural na Filipino.
- source_word: מִבָּצְרָה
  choice: mula sa Bozra
  rationale: Karaniwang ipinahihiwatig ng prefixed מִן ang pinagmulan, bagaman maaari rin itong tumukoy sa kaugnayan sa isang lungsod; pinanatili sa talababa ang alternatibong pagbasa.
