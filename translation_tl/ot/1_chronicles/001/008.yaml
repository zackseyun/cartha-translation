base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/008.yaml
  text: 'The sons of Ham: Cush[a], Mizraim, Put[b], and Canaan.'
translation:
  language: tl
  text: 'Ang mga anak ni Ham: Cus[a], Mizraim[b], Put, at Canaan.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga inapo ni Ham.” Sa mga talaangkanang Hebreo, ang “mga anak” ay maaaring tumukoy sa mismong mga anak o sa mas malalayong inapo.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “Mizraim,” ang pangalang karaniwang iniuugnay sa Ehipto. Pinanatili rito ang anyong pangalan dahil bahagi ito ng talaangkanan kasama nina Cus, Put, at Canaan.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: mga anak ni
  rationale: Ang construct plural ng בֵּן ay karaniwang pormula sa talaangkanan. Likas sa Filipino ang “mga anak ni,” ngunit maaari rin itong tumukoy sa mas malalayong inapo.
- source_word: חָם
  choice: Ham
  rationale: Pangalan ng tao; pinanatili sa anyong transliterado na karaniwan sa modernong saling Filipino.
- source_word: כּוּשׁ
  choice: Cus
  rationale: Pangalan sa talaangkanan; ginamit ang nakaugaliang anyong Filipino na “Cus,” na kumakatawan sa Hebreong כּוּשׁ.
- source_word: מִצְרַיִם
  choice: Mizraim
  rationale: Bagaman karaniwang katawagan ito sa Ehipto, gumaganap dito bilang pangalang eponimo sa hanay ng talaangkanan kaya pinanatili ang transliterasyon.
- source_word: פּוּט
  choice: Put
  rationale: Tuwirang transliterasyon ng pangalang Hebreo at malinaw sa modernong Filipino.
- source_word: כְנָעַן
  choice: Canaan
  rationale: Pinanatili ang nakaugaliang anyong Filipino ng pangalan; sa konteksto, ito ay pangalan sa talaangkanan.
theological_decisions: []
translation_notes:
  register: Maikli, marangal, at likas na modernong Filipino. Pinanatili ang pormula ng talaangkanan at ang mga pangalang eponimo, habang ipinaliliwanag sa talababa ang lawak ng kahulugan ng “mga anak” at ang kaugnayan ng Mizraim sa Ehipto.
