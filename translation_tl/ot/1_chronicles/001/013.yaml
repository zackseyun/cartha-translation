  yaml_path: translation/ot/1_chronicles/001/013.yaml
  text: And Canaan fathered Sidon his firstborn[b][a], and Heth.
translation:
  language: tl
  text: At naging ama si Canaan ni Sidon, na kanyang panganay, at ni Het.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Hebreong “Het” ay pangalan ng ninunong inuugnay sa mga Heteo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/כְנַעַן
  choice: At ... ni Canaan
  rationale: Isinalin ang pang-ugnay na וּ bilang “At” upang mapanatili ang daloy ng talaangkanan; ginamit ang karaniwang anyong Filipino ng pangalang Canaan.
- source_word: יָלַד
  choice: naging anak ni
  rationale: Sa kontekstong talaangkanan, ipinahahayag nito ang pagiging ama o pagkakaroon ng anak. Ang “naging anak ni Canaan” ay natural sa makabagong Filipino at malinaw na nagpapanatili sa ugnayang genealogical nang hindi gumagamit ng lipas na “ipinanganak.”
- source_word: אֶת
  choice: '[hindi hiwalay na isinalin]'
  rationale: Walang tuwirang katumbas sa Filipino ang pananda ng tuwirang layon; kinakatawan ito ng karaniwang ayos ng pangungusap.
- source_word: צִידוֹן
  choice: Sidon
  rationale: Ginamit ang karaniwang transliterasyon sa Filipino para sa pangalang pantangi.
- source_word: בְּכֹר/וֹ
  choice: kanyang panganay
  rationale: Tumpak na ipinahahayag ng “panganay” ang diin sa pagkakasunod ng kapanganakan, at ng “kanyang” ang panlaping panghalip na panlalaking isahan.
- source_word: וְ/אֶת
  choice: at si
  rationale: Likas na ipinakikilala ng “at si” ang ikalawang pangalang pantangi bilang isa pang anak sa talaan.
- source_word: חֵת
  choice: Het
  rationale: Pangalan ng isang ninuno ang חֵת dito, hindi ang pangmaramihang katawagan sa mga Heteo; kaya pinanatili itong personal na pangalang “Het.”
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinili ang natural na hulma na “naging anak ni” para sa genealogical na יָלַד, habang pinanatili ang mga personal na pangalan at ang tahasang pagkakakilanlan kay Sidon bilang panganay.
