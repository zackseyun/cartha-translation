base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/032.yaml
  text: 'And the sons of Keturah[a], Abraham’s concubine: she bore Zimran, Jokshan, Medan, Midian, Ishbak, and Shuah. And the sons of Jokshan: Sheba and Dedan.'
translation:
  language: tl
  text: 'At ang mga anak ni Ketura[a], na kalunya ni Abraham: nagsilang siya kina Zimran, Joksan, Medan, Midian, Isbak, at Suah. At ang mga anak ni Joksan: sina Seba at Dedan.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tinatawag si Ketura na asawa ni Abraham sa Genesis 25:1; ngunit dito ay tahasan siyang tinatawag na kalunya ni Abraham.
    reason: cross_reference
lexical_decisions:
- source_word: וּבְנֵי
  choice: At ang mga anak ni
  rationale: Pinananatili ng “At” ang sunod-sunod at listahang estilo ng talaangkanan; ang בְּנֵי ay construct plural na “mga anak ni.”
- source_word: קְטוּרָה
  choice: Ketura
  rationale: Pangngalang pantangi na isinalin sa baybay na natural sa Filipino.
- source_word: פִּילֶגֶשׁ
  choice: kinakasama
  rationale: Tumutukoy ito sa isang babaeng may kinikilalang ugnayan sa isang lalaki ngunit mas mababa ang katayuan kaysa pangunahing asawa. Ang “kinakasama” ay mas madaling maunawaan sa modernong Filipino kaysa “kalunya,” habang nililinaw ng talababa ang natatanging katayuan nito sa sinaunang konteksto.
- source_word: אַבְרָהָם
  choice: ni Abraham
  rationale: Ipinapahayag ng pariralang “ni Abraham” ang ugnayang genitibo sa פִּילֶגֶשׁ.
- source_word: יָלְדָה
  choice: ipinanganak niya
  rationale: Ang pandiwa ay pambabae at isahan, kaya si Ketura ang tinutukoy. Natural sa Filipino ang “ipinanganak niya” sa isang talaangkanan.
- source_word: אֶת
  choice: '[pananda ng tuwirang layon; hindi isinalin]'
  rationale: Walang tuwirang katumbas sa Filipino ang Hebreong pananda ng tiyak na tuwirang layon.
- source_word: זִמְרָן
  choice: Zimran
  rationale: Pangngalang pantangi; transliterasyon.
- source_word: יָקְשָׁן
  choice: Joksan
  rationale: Pangngalang pantangi; baybay na angkop sa karaniwang tunog at ortograpiyang Filipino.
- source_word: מְדָן
  choice: Medan
  rationale: Pangngalang pantangi; transliterasyon.
- source_word: מִדְיָן
  choice: Midian
  rationale: Pangngalang pantanti; pinanatili ang nakaugaliang anyo sa Filipino.
- source_word: יִשְׁבָּק
  choice: Isbak
  rationale: Pangngalang pantangi; isina-Filipinong transliterasyon nang hindi binabago ang pagkakakilanlan ng pangalan.
- source_word: שׁוּחַ
  choice: Sua
  rationale: Pangngalang pantangi; natural na transliterasyon sa ortograpiyang Filipino.
- source_word: שְׁבָא
  choice: Sheba
  rationale: Pangngalang pantangi; pinanatili ang kilalang anyong biblikal.
- source_word: דְדָן
  choice: Dedan
  rationale: Pangngalang pantangi; transliterasyon.
theological_decisions:
- issue: Katayuan ni Ketura kaugnay ni Abraham
  choice: kinakasama
  alternative: asawa; pangalawahing asawa; kalunya
  rationale: Tahasan ang פִּילֶגֶשׁ sa talata at hindi ito dapat ipantay nang tahimik sa “asawa” sa Genesis 25:1. Pinananatili ng salin at talababa ang pagkakaiba at tensiyon ng dalawang paglalarawan nang hindi ipinipilit ang isang denominasyonal na paliwanag.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang maikli at listahang anyo ng Hebreong talaangkanan. Ginamit ang “sina” bago ang mga pangalan bilang likas na pananda para sa mga tao sa Filipino.
