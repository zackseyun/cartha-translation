  text: and the Arvadites[a], and the Zemarites, and the Hamathites.
translation:
  language: tl
  text: at ang mga Arvadita[a], ang mga Zemarita, at ang mga Hamatita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ang mga gentiliko rito sa Hebreo ay nasa anyong isahan ayon sa gramatika ngunit kolektibo ang gamit, na tumutukoy sa mga bayan o angkan: Arvadita, Zemarita, at Hamatita.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת
  choice: at
  rationale: Sa talaang ito ng mga angkan at bayan, ang וְ ay nag-uugnay ng kasunod na pangkat sa serye; ang אֵת ay pananda ng tuwirang layon at hindi kailangang isalin nang hiwalay sa Tagalog.
- source_word: הָאַרְוָדִי
  choice: ang mga Arvadita
  rationale: Bagaman isahan ang anyong Hebreo, kolektibo ang gamit nito at tumutukoy sa mga taong kaugnay ng Arvad. Ang maramihang “mga Arvadita” ay likas at malinaw sa makabagong Tagalog.
- source_word: הַצְּמָרִי
  choice: ang mga Zemarita
  rationale: Ang gentiliko ay anyong isahan ngunit kolektibong tumutukoy sa bayan o angkang kaugnay ng Zemar. Pinananatili ng “Zemarita” ang pangalan habang ipinahahayag ng “mga” ang kolektibong diwa.
- source_word: הַחֲמָתִי
  choice: ang mga Hamatita
  rationale: Tumutukoy ang gentiliko sa mga tao o angkang kaugnay ng Hamat. Ang “mga Hamatita” ay malinaw na salin ng kolektibong gamit nito.
theological_decisions: []
translation_notes:
  register: Makabago, payak, at marangal na Tagalog. Ginamit ang mga anyong “Arvadita,” “Zemarita,” at “Hamatita,” na umaayon sa karaniwang hulaping -ita para sa mga taong nagmula o kaugnay ng isang lugar. Pinanatili ang anyo ng nagpapatuloy na talaan sa pamamagitan ng panimulang “at.”
