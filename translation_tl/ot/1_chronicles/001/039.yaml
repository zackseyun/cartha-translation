translation_notes:
  register: Gumamit ng natural, kasalukuyan, at marangal na Filipino. Ang hulma na “ay sina” at “ay si” ay nagbibigay-linaw sa maikling pahayag na talaangkanan nang hindi nagdaragdag ng interpretasyong teolohikal.
