base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/039.yaml
  text: 'The sons of Lotan: Hori and Homam[a]; and Lotan’s sister was Timna.'
translation:
  language: tl
  text: Ang mga anak ni Lotan ay sina Hori at Homam[a]; at ang kapatid na babae ni Lotan ay si Timna.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa kahalintulad na talaangkanan sa Genesis 36:22, Hemam ang anyo ng pangalan sa halip na Homam.
    reason: textual_variant
lexical_decisions:
- source_word: וּבְנֵי לוֹטָן
  choice: Ang mga anak ni Lotan
  rationale: Sa talaangkanan, malinaw at likas sa modernong Filipino ang “mga anak ni Lotan.” Bagaman literal na panlalaki ang בְּנֵי, tumutukoy ito rito sa mga lalaking anak na kasunod na pinangalanan. Hindi na kailangang ilantad ang panimulang pangatnig na וּ sa Filipino.
- source_word: חֹרִי
  choice: Hori
  rationale: Pangalang pantangi ito sa konteksto ng talaangkanan, kaya isinalin sa pamamagitan ng transliterasyon at hindi bilang katawagang etniko.
- source_word: וְהוֹמָם
  choice: at Homam
  rationale: Pinanatili ang anyong הוֹמָם ng tekstong Hebreo sa 1 Cronica. Ang ibang anyo sa Genesis 36:22 ay inilagay sa talababa sa halip na ipalit sa pagbasa rito.
- source_word: וַאֲחוֹת לוֹטָן
  choice: at ang kapatid na babae ni Lotan
  rationale: Ang אֲחוֹת ay “kapatid na babae.” Isinama ang “babae” upang maging tiyak sa Filipino, yamang hindi likas na ipinahihiwatig ng salitang “kapatid” lamang ang kasarian.
- source_word: תִּמְנָע
  choice: Timna
  rationale: Pangalang pantangi; ang “Timna” ay tuwirang kumakatawan sa anyong katinig ng pangalang Hebreo sa talatang ito.
