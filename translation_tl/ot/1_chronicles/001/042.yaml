lexical_decisions:
- source_word: בְּנֵי
  choice: mga anak ni
  rationale: Tuwirang salin ng construct plural ng בֵּן sa talaangkanan; mas tiyak dito kaysa “mga inapo ni.”
- source_word: אֵצֶר
  choice: Ezer
  rationale: Pangalang pantangi na isinalin sa baybay na madaling makilala sa modernong Filipino.
- source_word: בִּלְהָן
  choice: Bilhan
  rationale: Transliterasyon ng pangalang pantangi.
- source_word: זַעֲוָן
  choice: Zaavan
  rationale: Malapit sa anyong Hebreo ng Mga Cronica; ang ibang anyo sa Genesis 36:27 ay inilagay sa talababa.
- source_word: יַעֲקָן
  choice: Jaakan
  rationale: Transliterasyon ng anyong Hebreo sa Mga Cronica; pinanatili sa talababa ang ibang anyo sa Genesis 36:27.
- source_word: דִישׁוֹן
  choice: Dishon
  rationale: Transliterasyon ng pangalang pantangi, na ikinaiiba sa kahawig na pangalang Dishan.
- source_word: עוּץ
  choice: Uz
  rationale: Karaniwang anyo ng pangalan sa tradisyong biblikal at madaling makilala ng mga mambabasang Filipino.
- source_word: אֲרָן
  choice: Aran
  rationale: Transliterasyon ng pangalang pantangi.
