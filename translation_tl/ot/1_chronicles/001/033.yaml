base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/033.yaml
  text: 'The sons of Midian: Ephah[a], Epher, Hanoch, Abida, and Eldaah. All these were the sons of Keturah.'
translation:
  language: tl
  text: Ang mga anak ni Midian ay sina Efa, Efer, Hanok[a], Abida, at Eldaa. Ang lahat ng ito ay mga anak ni Ketura.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa ilang salin, tradisyonal na tinatawag na “Enoc” ang pangalang ito; sa Hebreo, Hanok.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי מִדְיָן
  choice: Ang mga anak ni Midian
  rationale: Likas na panimulang pormula sa makabagong Tagalog para sa talaangkanan. Hindi na hiwalay na isinalin ang pang-ugnay na וּ dahil pagpapatuloy ito ng listahan at magiging mabigat ang panimulang “At.”
- source_word: עֵיפָה
  choice: Efa
  rationale: Tuwirang pagsasatitik ng pangalang Hebreo sa baybay na angkop sa Filipino.
- source_word: וָעֵפֶר
  choice: Efer
  rationale: Isinulat ang pangalang pantangi ayon sa tunog ng Hebreo; ipinahayag ang mga pang-ugnay sa pamamagitan ng likas na bantas at “at” sa hulihan ng listahan.
- source_word: וַחֲנוֹךְ
  choice: Hanok[a]
  rationale: Mas malapit ito sa anyong Hebreo na Ḥănōk kaysa sa tradisyonal na anyong “Enoc.”
- source_word: וַאֲבִידָע
  choice: Abida
  rationale: Sinasalamin ng payak na baybay-Filipino ang pangalang Hebreo nang hindi dinaragdagan ang kahulugan nito.
- source_word: וְאֶלְדָּעָה
  choice: at Eldaa
  rationale: Ginamit ang “at” sa huling pangalan upang maging likas ang serye sa Tagalog; pinanatili ang mahabang hulíng patinig sa anyong “Eldaa.”
- source_word: כָּל אֵלֶּה
  choice: Ang lahat ng ito
  rationale: Tuwirang katumbas na malinaw na tumutukoy sa lahat ng pangalang nauna.
- source_word: בְּנֵי קְטוּרָה
  choice: ay mga anak ni Ketura
  rationale: Likas na pangungusap sa Tagalog na pinananatili ang ugnayang pampamilya ng pariralang Hebreo.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog para sa karaniwang mambabasa. Ginamit ang “sina” sa talaan ng mga pangalan at pinanatiling maigsi ang anyo ng talata. Inilipat ang marker sa Hanok, ang pangalang aktuwal na tinatalakay ng ibinigay na talababa.
