  source_fidelity: 'Tumpak na naipapahayag ng salin ang Hebreong talaangkanan: ang limang pangalang nakalista ay mga anak ni Midian, at ang kabuuan ay mga anak ni Ketura. Ang hindi hiwalay na pagsasalin ng paunang pang-ugnay na וּ ay katanggap-tanggap sa estilong talaangkanan ng makabagong Tagalog.'
