  yaml_path: translation/ot/1_chronicles/001/029.yaml
  text: 'These are their generations: the firstborn of Ishmael[a], Nebaioth, Kedar, Adbeel, and Mibsam.'
translation:
  language: tl
  text: 'Ito ang kanilang mga salinlahi: si Nebayot[a], na panganay ni Ismael, sina Kedar, Adbeel, at Mibsam.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Nebayot ay isinusulat ding Nebaiot sa ilang salin.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: Ito ang
  rationale: Likas na panimulang pormula sa Filipino para sa isang talaan; pinananatili ang deiktikong diwa ng Hebreo.
- source_word: תֹּלְדוֹתָם
  choice: kanilang mga salinlahi
  rationale: Pinananatili ang pormal na diwang panggenealohiya ng תּוֹלְדוֹת nang hindi ito nililimitahan sa ‘mga anak’ lamang.
- source_word: בְּכוֹר
  choice: panganay
  rationale: Tuwirang ipinapahayag ang katayuan bilang unang ipinanganak; hindi na kailangang idagdag ang ‘anak’ dahil malinaw ito sa konteksto.
- source_word: יִשְׁמָעֵאל
  choice: Ismael
  rationale: Karaniwang anyo ng pangalang ito sa makabagong Filipino.
- source_word: נְבָיוֹת
  choice: Nebayot
  rationale: Transliterasyong angkop sa Filipino na kumakatawan sa Hebreong pangalan; inilalahad sa talababa ang isa pang baybay.
- source_word: קֵדָר
  choice: Kedar
  rationale: Tuwirang transliterasyon ng pangalang Hebreo.
- source_word: אַדְבְּאֵל
  choice: Adbeel
  rationale: Tuwirang transliterasyon ng pangalang Hebreo.
- source_word: מִבְשָׂם
  choice: Mibsam
  rationale: Tuwirang transliterasyon ng pangalang Hebreo.
