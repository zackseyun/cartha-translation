  text: Arpachshad fathered Shelah[b][a], and Shelah fathered Eber.
translation:
  language: tl
  text: Si Arpakshad[b] ang naging ama ni Shelah[a], at si Shelah ang naging ama ni Eber.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, Shelah; ihambing ang tradisyonal na anyong “Sala” sa ilang salin at kaugnay na talaangkanan.
    reason: lexical_alternative
  - marker: b
    text: Sa ilang tradisyonal na salin, “Arfaxad” ang pangalan; ang anyong ito ay naimpluwensiyahan ng Griyego.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַרְפַּכְשַׁד
  choice: Arpacsad
  rationale: Tuwirang transliterasyon sa makabagong baybay-Filipino mula sa Hebreong pangalan; mas malapit ito sa anyong Hebreo kaysa sa tradisyonal na anyong Arfaxad na naimpluwensiyahan ng Griyego.
- source_word: יָלַד
  choice: ang naging ama ni
  rationale: Sa talaangkanang ito, ipinapahayag ng pandiwa ang ugnayan ng ama at inapo. Likas at malinaw sa modernong Filipino ang pariralang ito, samantalang ang mas literal na 'ipinanganak' ay maaaring magpahiwatig na lalaki mismo ang nanganak.
- source_word: אֶת
  choice: '[hindi isinalin nang hiwalay]'
  rationale: Pananda ito ng tiyak na layon sa Hebreo at walang hiwalay na katumbas na kailangan sa Filipino.
- source_word: שָׁלַח / שֶׁלַח
  choice: Sela
  rationale: Parehong tumutukoy sa iisang tao ang dalawang bahagyang magkaibang pagbigkas sa Masoretic pointing. Ginamit nang pare-pareho ang anyong Filipino na Sela, na nakabatay sa Hebreong Shelah.
- source_word: עֵבֶר
  choice: Eber
  rationale: Tuwirang transliterasyon ng Hebreong עבר; pinananatili nito ang unang patinig at mas malapit sa Hebreo kaysa sa alternatibong Heber.
