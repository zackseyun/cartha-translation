  register: Maikli, marangal, at natural na modernong Filipino para sa pormula ng talaangkanan. Inangkop sa ortograpiyang Filipino ang mga tunog ng pangalang Hebreo, at inilagay ang mga talababa kaagad pagkatapos ng pangalang tinutukoy.
