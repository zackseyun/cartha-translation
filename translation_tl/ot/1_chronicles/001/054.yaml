  yaml_path: translation/ot/1_chronicles/001/054.yaml
  text: Chief Magdiel[a], chief Iram. These were the chiefs of Edom.
translation:
  language: tl
  text: Ang pinunong si Magdiel, ang pinunong si Iram. Sila ang mga pinuno ng Edom.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga pinuno ng mga angkan ng Edom.” Ang salitang Hebreo ay maaaring tumukoy sa mga pinunong pantribo o pangangkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַלּוּף
  choice: pinuno
  rationale: Sa talaan ng mga Edomita, tumutukoy ang salita sa isang pinunong pantribo o pangangkan. Ang “pinuno” ay malinaw, likas, at marangal sa modernong Tagalog, at hindi nito labis na tinutukoy ang eksaktong uri ng katungkulan.
- source_word: מַגְדִּיאֵל
  choice: Magdiel
  rationale: Pangalang pantangi na isinalin sa karaniwang anyong transliterado sa Tagalog.
- source_word: עִירָם
  choice: Iram
  rationale: Pangalang pantangi na isinalin sa karaniwang anyong transliterado sa Tagalog.
- source_word: אֵלֶּה
  choice: Sila ang
  rationale: Ang Hebreo ay literal na “ang mga ito,” ngunit sa pagbubuod ng mga taong kababanggit lamang, mas natural sa Tagalog ang “Sila ang.”
- source_word: אַלּוּפֵי אֱדֹם
  choice: mga pinuno ng Edom
  rationale: Pinananatili nito ang maikli at paulit-ulit na katawagan sa talaan habang ipinahihiwatig ang mga pinunong Edomita nang hindi nililimitahan sa isang tiyak na sistemang pampolitika.
