  text: וַ/יּ֥וֹלֶד אַבְרָהָ֖ם אֶת יִצְחָ֑ק בְּנֵ֣י יִצְחָ֔ק עֵשָׂ֖ו וְ/יִשְׂרָאֵֽל־ס׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/034.yaml
  text: 'Abraham fathered Isaac[a]. The sons of Isaac: Esau and Israel.'
translation:
  language: tl
  text: 'Si Abraham ang ama ni Isaac. Ang mga anak na lalaki ni Isaac: sina Esau at Israel.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Israel na tinutukoy rito ay si Jacob.
    reason: Paglilinaw sa pagkakakilanlan ng taong pinangalanang Israel sa tekstong Hebreo.
lexical_decisions:
- source_word: וַיּוֹלֶד
  choice: Naging anak ni Abraham
  rationale: Sa talaangkanan, ang Hiphil ng ילד ay nagpapahayag na nagkaanak ang isang ama. Ang karaniwang hulma sa modernong Tagalog na “Naging anak ni Abraham si Isaac” ay likas at malinaw, samantalang ang “ipinanganak ni Abraham” ay maaaring magbigay ng maling pahiwatig na si Abraham ang nanganak.
- source_word: אֶת
  choice: '[hindi isinalin nang hiwalay]'
  rationale: Pananda ito ng tiyak na layon sa Hebreo at wala itong hiwalay na katumbas sa Tagalog; naipahahayag ang tungkulin nito sa ayos ng pangungusap.
- source_word: בְּנֵי
  choice: Ang mga anak ni
  rationale: Ang construct plural ng בן ang nagpapakilala sa susunod na salinlahi sa talaangkanan. Hindi kailangang tukuyin ang kasarian sa salitang “anak” dahil malinaw sa mga pangalang sumusunod at mas natural ito sa Tagalog.
- source_word: עֵשָׂו
  choice: Esau
  rationale: Karaniwang anyo ng personal na pangalang ito sa Tagalog na tradisyon ng Bibliya.
- source_word: וְיִשְׂרָאֵל
  choice: at Israel
  rationale: Tahasang “Israel” ang nasa tekstong Hebreo. Pinanatili ang pangalang iyon sa halip na palitan ng “Jacob,” kahit si Jacob ang tinutukoy.
theological_decisions:
- issue: Pagbibigay ng יִשְׂרָאֵל sa talaangkanan kung saan si Jacob ang tinutukoy
  choice: Israel
  alternative: Jacob
  rationale: Pinananatili ng salin ang mismong pangalang ginamit sa tekstong Hebreo at hindi ito itinutugma nang tahimik sa pangalang Jacob. Nililinaw ng talababa ang tinutukoy nang hindi binabago ang teksto.
translation_notes:
  register: Makabago, payak, at marangal na Tagalog para sa isang maikling talaangkanan. Ginamit ang “sina” upang natural na ipakilala ang dalawang personal na pangalan. Inilipat ang talababa sa “Israel,” ang salitang talagang nililinaw nito.
