base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/009.yaml
  text: 'The sons of Cush: Seba[a], Havilah, Sabta, Raama, and Sabteca[c][b]. And the sons of Raama: Sheba and Dedan.'
translation:
  language: tl
  text: Ang mga anak ni Kus ay sina Seba, Havila, Sabta[a], Raama[b], at Sabteca[c]. At ang mga anak ni Raama ay sina Sheba at Dedan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tradisyonal ding isinusulat ang pangalang ito na “Sabtah.”
    reason: lexical_alternative
  - marker: b
    text: Tradisyonal ding isinusulat ang pangalang ito na “Raamah”; naiiba ito sa pangalang Rama.
    reason: lexical_alternative
  - marker: c
    text: Tradisyonal ding isinusulat ang pangalang ito na “Sabtechah.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי כוּשׁ
  choice: Ang mga anak ni Kus
  rationale: Pinananatili ang pormulang pangangkanang “mga anak ni.” Hindi isinama bilang hiwalay na “at” ang panimulang waw sapagkat natural sa Filipino ang pagsisimula ng talaan sa “Ang,” samantalang malinaw pa rin ang ugnayan nito sa naunang konteksto. Ang כּוּשׁ ay itinumbas na “Kus” ayon sa bigkas at ortograpiyang Filipino.
- source_word: סְבָא
  choice: Seba
  rationale: Tuwirang transliterasyon ng pangalang Hebreo; pinananatili rin nitong naiiba ang pangalan sa שְׁבָא (Sheba) sa hulihan ng talata.
- source_word: חֲוִילָה
  choice: Havila
  rationale: Isina-Filipinong transliterasyon na kumakatawan sa mga katinig at patinig ng pangalang Hebreo nang walang tahimik na h sa hulihan.
- source_word: סַבְתָּא
  choice: Sabta
  rationale: Tuwirang transliterasyon; hindi kailangan sa ortograpiyang Filipino ang tradisyonal na h sa hulihan.
- source_word: רַעְמָא
  choice: Raama
  rationale: Pinananatili ang magkahiwalay na a upang maipahiwatig ang anyo ng pangalang Hebreo at maiwasang maipagkamali ito sa ibang pangalang Rama.
- source_word: סַבְתְּכָא
  choice: Sabteca
  rationale: Isina-Filipinong transliterasyon; ginamit ang c sa pamilyar na tradisyonal na anyo ng pangalang pantangi at hindi nagdagdag ng tahimik na h sa hulihan.
- source_word: וּבְנֵי רַעְמָא
  choice: At ang mga anak ni Raama
  rationale: Pinanatili ang pangatnig sapagkat ipinakikilala nito ang isang bagong sangay sa talaangkanan; “mga anak” ang pormal at tuwirang katumbas sa kontekstong ito.
- source_word: שְׁבָא
  choice: Sheba
  rationale: Ginamit ang “sh” upang mapanatili ang tunog ng titik שׁ at malinaw na maiba ito sa naunang סְבָא, “Seba.”
- source_word: דְדָן
  choice: Dedan
  rationale: Tuwirang transliterasyon ng pangalang pantangi; walang batayan sa teksto para palawakin ito bilang isang lipi o pangkat.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “ay sina” upang maging natural at madaling sundan ang talaan ng mga pangalan, habang pinananatili ang literal na ugnayang “mga anak ni.” Ang transliterasyon ay inangkop sa pagbasa ng Filipino ngunit pinanatili ang mahalagang pagkakaiba ng Seba at Sheba.
