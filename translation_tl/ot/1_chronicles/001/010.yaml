base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/010.yaml
  text: And Cush fathered Nimrod[a]; he began to be a mighty one in the land.
translation:
  language: tl
  text: At naging ama si Cus ni Nimrod. Nagsimula siyang maging isang makapangyarihang tao sa lupain.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “sa daigdig.” Ang salitang Hebreo ay maaaring tumukoy sa “lupain” o sa “daigdig.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כוּשׁ
  choice: At … ni Cus
  rationale: Ang וְ ay payak na pang-ugnay sa talaangkanan. Isinalin ang pangalang כּוּשׁ bilang “Cus,” ayon sa karaniwang anyong Filipino.
- source_word: יָלַד אֶת נִמְרֹד
  choice: naging anak ni Cus si Nimrod
  rationale: Sa konteksto ng talaangkanan, ang יָלַד ay tumutukoy sa pagiging ama o pag-aanak. Ang ayos na “naging anak ni Cus si Nimrod” ay natural sa modernong Filipino at malinaw na pinananatili ang ugnayang ama-anak, bagaman binabago nito ang gramatikal na pokus ng Hebreo upang maiwasan ang alanganing “ipinanganak ni Cus.”
- source_word: הוּא הֵחֵל לִהְיוֹת
  choice: Nagsimula siyang maging
  rationale: Tuwirang ipinapahayag nito ang karaniwang kahulugan ng Hiphil הֵחֵל kasama ng pawatas na לִהְיוֹת, nang hindi ipinapalagay na siya ang kauna-unahang naging gayon.
- source_word: גִּבּוֹר
  choice: isang makapangyarihang tao
  rationale: 'Malawak ang saklaw ng גִּבּוֹר: maaaring makapangyarihang tao, mandirigma, o bayani. Hindi tahasang militar ang konteksto, kaya pinili ang pangkalahatang “makapangyarihang tao.”'
- source_word: בָּאָרֶץ
  choice: sa lupain
  rationale: Maaaring mangahulugan ang אֶרֶץ ng isang lupain o ng buong lupa. Pinananatili sa pangunahing teksto ang mas di-tiyak at di-gaanong malawak na “lupain,” at inilalagay sa talababa ang ibang posibleng pagbasa.
theological_decisions:
- issue: Saklaw ng בָּאָרֶץ sa paglalarawan kay Nimrod
  choice: sa lupain
  alternative: sa buong lupa
  rationale: Hindi nililinaw ng talata kung isang partikular na lupain o ang buong daigdig ang tinutukoy. Hindi pinalalawak ng pangunahing salin ang saklaw, ngunit pinananatili sa talababa ang tunay na alternatibo.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang likas na ayos ng pangungusap sa talaangkanan at iniwasan ang makaluma o labis na teknikal na pananalita.
