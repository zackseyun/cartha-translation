  source_fidelity: 'Ang “naging anak ni Cus si Nimrod” ay nagpapahayag ng ugnayang ama-anak ngunit binabaligtad ang direksiyon ng Hebreong יָלַד, na ang paksa ay si Cus bilang ama. Mas tumpak ang “naging ama si Cus ni Nimrod.” Ang natitirang bahagi ay maayos na tumutugon sa Hebreo: ang “nagsimula siyang maging” ay hindi nagdaragdag ng ideyang siya ang una, at ang “makapangyarihang tao” ay angkop na malawak para sa גִּבּוֹר.'
  naturalness: Natural at marangal ang “Nagsimula siyang maging isang makapangyarihang tao sa lupain.” Ang rebisyong unang pangungusap ay karaniwang Filipino sa talaangkanan at mas malinaw na inilalahad ang kaugnayang ipinapahayag ng pinagmulan.
