  yaml_path: translation/ot/1_chronicles/023/008.yaml
  text: 'The sons of Ladan: Jehiel the head[a], and Zetham and Joel—three.'
translation:
  language: tl
  text: 'Ang mga anak ni Ladan: si Jehiel, ang pinuno[a], sina Zetam at Joel—tatlo silang lahat.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang nangunguna” o “ang ulo”; maaaring ipinakikilala nito si Jehiel bilang pangunahing anak o unang anak.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: Ang mga anak ni
  rationale: Tuwirang katumbas ng construct plural na “mga anak ni.” Bagaman maaari itong mangahulugang mga inapo sa talaangkanan, tatlong tuwirang pinangalanang anak ang inililista rito.
- source_word: לַעְדָּן
  choice: Ladan
  rationale: Transliterasyon ng pangalang Hebreo; pinananatili ang maikling anyong Ladan.
- source_word: הָרֹאשׁ
  choice: na pinuno
  rationale: Ang רֹאשׁ ay literal na “ulo” at maaari ring tumukoy sa pinuno o nangunguna. Ang “pinuno” ay natural sa Filipino at hindi nito ginagawang tiyak na panganay si Jehiel.
- source_word: יְחִיאֵל
  choice: Jehiel
  rationale: Transliterasyon ng pangalang pantangi ayon sa karaniwang anyo sa Bibliyang Filipino.
- source_word: וְזֵתָם
  choice: sina Zetam
  rationale: Isinasalin ang pang-ugnay sa natural na ayos ng listahan sa Filipino at tinutumbasan ang pangalan bilang Zetam.
- source_word: וְיוֹאֵל
  choice: at Joel
  rationale: Tuwirang salin ng pang-ugnay at transliterasyon ng pangalang pantangi.
- source_word: שְׁלֹשָׁה
  choice: tatlo silang lahat
  rationale: Malinaw at natural na ipinahahayag sa Filipino ang tahasang buod ng bilang sa Hebreo.
theological_decisions:
- issue: Kung ang הָרֹאשׁ ay tumutukoy sa katayuang pinuno o sa pagiging unang anak
  choice: na pinuno
  alternative: na una / panganay
  rationale: Hindi tahasang ordinal ang salitang Hebreo. Pinananatili ng “pinuno” ang pangunahing leksikal na diwa at iniiwasang tiyaking panganay si Jehiel, habang inilalagay sa talababa ang posibleng kahulugan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “sina” upang maging natural ang pagpapatuloy ng listahan, at pinanatili ang gitling bago ang tahasang buod na “tatlo silang lahat.”
