base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/022.yaml
  text: Eleazar died and had no sons[a], but only daughters; and the sons of Kish, their brothers[b], married them.
translation:
  language: tl
  text: Namatay si Eleazar. Wala siyang mga anak na lalaki, kundi mga anak na babae lamang; at pinakasalan sila ng mga anak ni Kish, na mga kapatid ng mga babaeng iyon.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “mga kapatid” dito ay malamang na tumutukoy sa malalapit na lalaking kamag-anak sa kaugnay na sangay ng angkan, hindi kinakailangang mga kapatid sa mahigpit na kahulugan.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּמָת אֶלְעָזָר
  choice: Namatay si Eleazar
  rationale: Tuwiran at natural na salin ng pandiwang מות at ng pangalang pantangi; iniiwasan ang eupemismong “pumanaw.”
- source_word: וְלֹא הָיוּ לוֹ בָּנִים
  choice: na walang mga anak na lalaki
  rationale: Dahil kasalungat nito ang “mga anak na babae,” ang בנים ay partikular na tumutukoy sa mga anak na lalaki, hindi sa lahat ng anak.
- source_word: כִּי אִם בָּנוֹת
  choice: kundi mga anak na babae lamang
  rationale: 'Ipinapahayag ng כִּי אִם ang pagbubukod at pagsalungat: wala siyang mga anak na lalaki, mga anak na babae lamang.'
- source_word: וַיִּשָּׂאוּם
  choice: Pinakasalan sila
  rationale: Sa kontekstong ang mga babae ang layon, ang נשׂא ay nangangahulugang kunin bilang asawa o pakasalan. Ang “pinakasalan” ang malinaw at likas na modernong Filipino.
- source_word: בְּנֵי קִישׁ
  choice: mga anak ni Kish
  rationale: Tapat na salin ng construct chain at angkop sa estilong talaangkanan ng Mga Cronica.
- source_word: אֲחֵיהֶם
  choice: na mga kapatid nila
  rationale: Pinananatili ang literal na “kanilang mga kapatid,” habang nililinaw sa talababa na maaari itong tumukoy sa malalapit na lalaking kamag-anak sa angkan.
theological_decisions:
- issue: Saklaw ng אֲחֵיהֶם (“kanilang mga kapatid”)
  choice: mga kapatid nila
  alternative: mga kamag-anak nila
  rationale: Hindi pinalalawak sa pangunahing teksto ang tiyak na salitang Hebreo. Gayunman, dahil maaaring gamitin ang terminong pangkamag-anakan para sa mas malawak na ugnayan sa angkan, inilalahad ang posibilidad na iyon sa talababa.
translation_notes:
  register: Makabago, tuwiran, at marangal na Filipino. Pinanatili ang payak na estilong talaangkanan at ang posibleng lawak ng terminong pangkamag-anakan. Hindi isinama ang ibinigay na English footnote a tungkol sa “took them as wives” dahil mali ang pagkakabit nito sa marker na kasunod ng “sons”; sa halip, ang tanging talababa ay inilagay sa tunay na nangangailangang linawin na “mga kapatid.”
