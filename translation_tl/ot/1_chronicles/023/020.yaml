  source_fidelity: 'Ang pangunahing pangungusap ay wastong sumasalamin sa Hebreo: ang mga anak ni Uziel ay si Mica, ang una, at ang ikalawa. Gayunman, ang pangalang וְיִשִּׁיָּה ay hindi ligtas na maisasatinig bilang “Isias,” sapagkat wala itong katumbas na pangwakas na -s sa anyong Hebreo. Ang “Yishiya” ay mas malapit sa anyong pinagmulan at pinananatili ang pagkakaiba ng pangalang ito sa iba pang magkakatulad na pangalan.'
  naturalness: 'Natural at malinaw ang hulma ng talaangkanan sa modernong Filipino: “Ang mga anak ni Uziel: si Mica ang una, at si Yishiya ang ikalawa.” Ang paggamit ng “si” sa mga personal na pangalan at ng “una/ikalawa” ay angkop.'
