lexical_decisions:
- source_word: בְּנֵי
  choice: Ang mga anak ni
  rationale: Tuwirang katumbas ng construct plural na nagpapakilala sa dalawang anak sa talaangkanan.
- source_word: עֻזִּיאֵל
  choice: Uziel
  rationale: Isinatinig ang pangalang Hebreo sa anyong natural at nakikilala sa Filipino.
- source_word: מִיכָה
  choice: Mica
  rationale: Isinatinig ang pangalang Hebreo ayon sa karaniwang baybay-Filipino, kung saan ang c bago ang a ay kumakatawan sa tunog na /k/.
- source_word: הָרֹאשׁ
  choice: ang una
  rationale: Bagaman literal na 'ang ulo' o maaaring 'ang pinuno,' ipinahihiwatig ng pagtapat nito sa 'ikalawa' ang pagkakasunod o primasiya; 'ang una' ang pinakanatural sa konteksto.
- source_word: וְיִשִּׁיָּה
  choice: at si Isias
  rationale: Isinatinig ang personal na pangalan sa isang natural na anyong Filipino; pinananatili sa talababa ang posibilidad ng mas malapit na transliterasyong Yishiya.
- source_word: הַשֵּׁנִי
  choice: ang ikalawa
  rationale: Tuwirang salin ng ordinal na tumutukoy sa ikalawang anak sa talaan.
