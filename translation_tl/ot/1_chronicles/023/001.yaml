  text: וְ/דָוִ֥יד זָקֵ֖ן וְ/שָׂבַ֣ע יָמִ֑ים וַ/יַּמְלֵ֛ךְ אֶת שְׁלֹמֹ֥ה בְנ֖/וֹ עַל יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/001.yaml
  text: David was old and full of days[a], and he made his son Solomon king over Israel.
translation:
  language: tl
  text: Matanda na si David at puspos ng mga araw[a], at ginawa niyang hari ng Israel ang anak niyang si Solomon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nasa katandaan na”; literal, “matanda at puspos ng mga araw.”
    reason: lexical_alternative
lexical_decisions:
- source_word: זָקֵן
  choice: Matanda na
  rationale: Likas at tuwirang Filipino para sa kalagayan ni David na nasa katandaan na; ipinahihiwatig ng “na” ang pag-abot niya sa yugtong ito nang hindi nagdaragdag ng hiwalay na panandang temporal.
- source_word: וְשָׂבַע יָמִים
  choice: at puspos na ng mga araw
  rationale: Pinananatili ang matalinghagang Hebreong idyoma ng pagiging ‘busog/puspos sa mga araw’ at ang marangal na himig nito, sa halip na lubusang gawing payak na ‘matanda na.’
- source_word: וַיַּמְלֵךְ
  choice: kaya ginawa niyang hari
  rationale: 'Ipinapahayag ang causative na anyo ng pandiwa: itinalaga o iniluklok ni David si Solomon bilang hari. Ang ‘ginawa niyang hari’ ay hindi nagdaragdag ng seremonyang hindi tahasang binanggit.'
- source_word: אֶת שְׁלֹמֹה בְנוֹ
  choice: ang anak niyang si Solomon
  rationale: Natural na ayos sa modernong Filipino habang malinaw na pinananatili ang ugnayang ama-anak.
- source_word: עַל יִשְׂרָאֵל
  choice: sa Israel
  rationale: Sa Filipino, ang ‘hari sa Israel’ ay likas na nagpapahayag ng paghahari sa bayan. Hindi idinagdag ang ‘buong’ sapagkat wala ito sa Hebreo.
- source_word: וְ / וַ
  choice: at / kaya
  rationale: Ang unang waw ay iniugnay sa ikalawang paglalarawan, samantalang ang wayyiqtol ay isinalin sa natural na daloy bilang kasunod na bunga o hakbang. Hindi ginamitan ng panimulang ‘Ngayon’ dahil walang tahasang temporal na salita sa pinagmulan.
theological_decisions:
- issue: Ang ugnayan ng katandaan ni David at ng paghirang kay Solomon
  choice: kaya
  alternative: at
  rationale: Sa konteksto, natural na ipinakikita ng sunod-sunod na sugnay na ang katandaan ni David ang kalagayang humahantong sa paglalagay kay Solomon bilang hari. Gayunman, hindi nito inaangkin ang mas tiyak na teolohikal na dahilan kaysa sa ipinahihiwatig ng salaysay.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Pinanatili ang Hebreong idyomang “puspos ng mga araw” sa pangunahing teksto at nilinaw sa talababa. Ang marker na [a] ay inilagay agad pagkatapos ng pariralang tinutukoy nito.
