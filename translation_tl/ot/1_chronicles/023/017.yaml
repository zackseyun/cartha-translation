base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/017.yaml
  text: 'The sons of Eliezer: Rehabiah was the chief[a], and Eliezer had no other sons; but the sons of Rehabiah became very many.'
translation:
  language: tl
  text: 'Ang mga anak ni Eliezer: si Rehabias ang pinuno[a]. Wala nang ibang anak na lalaki si Eliezer, ngunit lubhang dumami ang mga anak na lalaki ni Rehabias.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “ang una.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ בְנֵי אֱלִיעֶזֶר
  choice: Sa mga anak ni Eliezer
  rationale: Isinalin ang pormulang pangtalaan ng angkan sa natural na Filipino habang pinananatili ang pagpapakilala sa mga anak ni Eliezer.
- source_word: רְחַבְיָה
  choice: Rehabias
  rationale: Ginamit ang nakaugaliang anyong Filipino ng pangalang Hebreo.
- source_word: הָרֹאשׁ
  choice: ang pinuno[a]
  rationale: Ang רֹאשׁ ay maaaring tumukoy sa pinuno o pangunahing kinatawan ng angkan; ang “pinuno” ay malinaw at natural, habang inilagay sa talababa ang posibleng kahulugang “una.”
- source_word: וְלֹא הָיָה לֶאֱלִיעֶזֶר בָּנִים אֲחֵרִים
  choice: Wala nang ibang anak na lalaki si Eliezer
  rationale: Natural na pagsasalin ng Hebreong konstruksiyong nagsasaad ng pag-aari; nilinaw ng “anak na lalaki” ang kasarian ng בָּנִים sa talaangkanan.
- source_word: וּבְנֵי רְחַבְיָה
  choice: ngunit ... ang mga anak na lalaki ni Rehabias
  rationale: 'Ang “ngunit” ay naghahayag ng kaibahan: iisa lamang ang anak na lalaki ni Eliezer, samantalang marami ang naging mga anak na lalaki ni Rehabias.'
- source_word: רָבוּ לְמָעְלָה
  choice: lubhang dumami
  rationale: Pinagsama ang pandiwang nagsasaad ng pagdami at ang pananalitang nagpapalakas dito upang maipahayag nang maikli at natural ang napakalaking pagdami.
