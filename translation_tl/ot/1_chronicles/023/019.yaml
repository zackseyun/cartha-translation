  register: Makabagong Filipino na payak ngunit marangal. Ginamit ang “si” sa bawat pangalan para maging natural at malinaw ang talaan; pinanatili sa talababa ang literal na kahulugan at posibleng pahiwatig ng הָרֹאשׁ.
