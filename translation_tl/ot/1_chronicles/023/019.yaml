base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/019.yaml
  text: 'The sons of Hebron: Jeriah the first[a], Amariah the second, Jahaziel the third, and Jekameam the fourth.'
translation:
  language: tl
  text: 'Ang mga anak ni Hebron: si Jerias ang una[a], si Amarias ang ikalawa, si Jahaziel ang ikatlo, at si Jekameam ang ikaapat.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “ang ulo” o “ang pinuno”; ngunit dito ay tumutukoy ito sa una sa hanay, kasunod ng “ikalawa,” “ikatlo,” at “ikaapat.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי חֶבְרוֹן
  choice: Ang mga anak ni Hebron
  rationale: Tuwirang ipinakikilala ng construct plural na בְּנֵי ang talaan ng mga anak ni Hebron; mas tiyak dito ang “mga anak” kaysa “mga inapo.”
- source_word: יְרִיָּהוּ
  choice: Jerias
  rationale: Anyo ng pangalang angkop sa nakaugaliang baybay sa Filipino, habang kinakatawan ang Hebreong pangalan.
- source_word: הָרֹאשׁ
  choice: ang una
  rationale: Bagaman literal na “ang ulo” o “ang pinuno,” gumaganap ito rito bilang unang bilang sa hanay na sinusundan ng ikalawa, ikatlo, at ikaapat.
- source_word: אֲמַרְיָה
  choice: Amarias
  rationale: Likas at nakaugaliang anyong Filipino ng pangalang Hebreo.
- source_word: הַשֵּׁנִי
  choice: ang ikalawa
  rationale: Tuwirang katumbas ng ordinal na nagmamarka sa ikalawang pangalan sa hanay.
- source_word: יַחֲזִיאֵל
  choice: Jahaziel
  rationale: Malinaw na transliterasyon ng pangalang Hebreo na angkop sa modernong Filipino.
- source_word: הַשְּׁלִישִׁי
  choice: ang ikatlo
  rationale: Tuwirang katumbas ng ordinal na Hebreo.
- source_word: וִיקַמְעָם
  choice: at si Jekameam
  rationale: Isinasalin ang pangatnig at ginagamit ang malinaw na transliterasyon ng pangalang pantangi.
- source_word: הָרְבִיעִי
  choice: ang ikaapat
  rationale: Tuwirang katumbas ng ordinal na Hebreo.
