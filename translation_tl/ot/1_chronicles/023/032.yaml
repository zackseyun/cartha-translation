  naturalness: Marangal at malinaw ang rehistro. Ang “pananagutan” ay mas angkop dito kaysa “tungkulin” sapagkat naihahatid nito ang ideya ng iniatas na pagbabantay o pangangasiwa. Nilinaw ng kuwit ang apozisyong “mga kapatid nila.”
  terminology: Ang “Toldang Tipanan,” “banal na lugar,” “mga anak ni Aaron,” at “bahay ni Yahweh” ay angkop at pare-pareho sa terminolohiyang pangkulto at pampamilya ng Hebreo. Napanatili ang talababa para sa mas malawak na saklaw ng הַקֹּדֶשׁ.
