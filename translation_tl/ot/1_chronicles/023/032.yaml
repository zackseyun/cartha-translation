  text: וְ/שָׁמְר֞וּ אֶת מִשְׁמֶ֣רֶת אֹֽהֶל מוֹעֵ֗ד וְ/אֵת֙ מִשְׁמֶ֣רֶת הַ/קֹּ֔דֶשׁ וּ/מִשְׁמֶ֕רֶת בְּנֵ֥י אַהֲרֹ֖ן אֲחֵי/הֶ֑ם לַ/עֲבֹדַ֖ת בֵּ֥ית יְהוָֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/032.yaml
  text: And they were to keep charge of the tent of meeting[a], the charge of the holy place, and the charge of the sons of Aaron their brothers, for the service of the house of Yahweh.
translation:
  language: tl
  text: Tutuparin nila ang pananagutan sa Toldang Tipanan, ang pananagutan sa banal na lugar[a], at ang pananagutan ng mga anak ni Aaron, na mga kapatid nila, para sa paglilingkod sa bahay ni Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “santuwaryo.” Maaaring tumukoy ang salitang Hebreo sa banal na lugar o, sa mas malawak na diwa, sa sagradong nasasakupan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמְרוּ
  choice: Tutuparin nila
  rationale: Ang שׁמר ay maaaring mangahulugang mag-ingat, magbantay, o tumupad. Sa buod na ito ng mga atas sa mga Levita, ang “tutuparin nila” ay malinaw na nagpapahayag ng iniatas na patuloy na pananagutan, hindi lamang ng isang naganap na kilos.
- source_word: מִשְׁמֶרֶת
  choice: ang tungkulin
  rationale: Tumutukoy ang pangngalan sa iniatas na pagbabantay, pananagutan, o tungkulin. Inulit ang “tungkulin” nang tatlong beses upang mapanatili ang pormal na pag-uulit ng Hebreo.
- source_word: אֹהֶל מוֹעֵד
  choice: Toldang Tipanan
  rationale: Ang parirala ay literal na tolda ng itinakdang pakikipagtagpo. Ang “Toldang Tipanan” ay isang malinaw at kinikilalang katawagan sa makabagong Filipino para sa banal na toldang pinagtatagpuan ng Diyos at ng Israel.
- source_word: הַקֹּדֶשׁ
  choice: banal na lugar
  rationale: Sa kontekstong pangsamba, maaaring tumukoy ang הַקֹּדֶשׁ sa banal na lugar o sa santuwaryo/sagradong nasasakupan nang mas malawak. Pinili ang “banal na lugar” bilang tuwirang salin habang inilalagay sa talababa ang mas malawak na posibilidad.
- source_word: בְּנֵי אַהֲרֹן אֲחֵיהֶם
  choice: mga anak ni Aaron na kanilang mga kapatid
  rationale: Pinananatili ng “mga anak ni Aaron” ang pananalitang pampamilya at ang pagkakakilanlan ng mga paring mula kay Aaron. Ang “kanilang mga kapatid” ay nagpapanatili sa tahasang ugnayan nila sa mga Levita.
- source_word: לַעֲבֹדַת
  choice: para sa paglilingkod
  rationale: Sa konteksto ng templo, ang עֲבֹדָה ay gawain o paglilingkod na kaugnay ng pagsamba. Natural sa Filipino ang “para sa paglilingkod” at napapanatili nito ang kahulugang panrelihiyon.
- source_word: בֵּית יְהוָה
  choice: bahay ni Yahweh
  rationale: Tuwirang pinananatili ng “bahay” ang בֵּית, sa halip na ipakahulugang agad na “templo,” at isinasalin ang banal na pangalan na יְהוָה bilang “Yahweh.”
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Tahasang nasa tekstong Hebreo ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal at tipanang pangalan sa halip na palitan ito ng isang titulo.
- issue: Saklaw ng הַקֹּדֶשׁ
  choice: banal na lugar
  alternative: santuwaryo
  rationale: Hindi ganap na tiyak kung isang partikular na banal na bahagi o ang mas malawak na sagradong nasasakupan ang tinutukoy. Pinanatili sa pangunahing teksto ang mas tuwirang “banal na lugar” at kinilala sa talababa ang alternatibo.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang tatlong ulit na “tungkulin” upang maipakita ang istruktura at diin ng Hebreo; iniwasan ang labis na teknikal o denominasyonal na pananalita.
