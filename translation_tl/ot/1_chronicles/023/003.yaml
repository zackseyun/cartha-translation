base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/003.yaml
  text: The Levites were counted from thirty years old and upward[a], and their number by heads, man by man, was thirty-eight thousand.
translation:
  language: tl
  text: Binilang ang mga Levita mula sa edad na tatlumpung taon pataas, at ang bilang nila sa bawat lalaki ay tatlumpu't walong libo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסָּפְרוּ
  choice: Binilang
  rationale: Ipinahihiwatig ng anyong Niphal na ang mga Levita ang tumanggap ng kilos ng pagbibilang; natural at malinaw sa makabagong Tagalog ang “binilang.”
- source_word: הַלְוִיִּם
  choice: ang mga Levita
  rationale: Karaniwang katawagang Tagalog para sa mga kabilang sa lipi ni Levi.
- source_word: מִבֶּן שְׁלֹשִׁים שָׁנָה וָמָעְלָה
  choice: na tatlumpung taong gulang pataas
  rationale: Malinaw na ipinapahayag ang pinakamababang edad na saklaw ng pagbibilang habang sinusundan ang idyomang Hebreo.
- source_word: וַיְהִי מִסְפָּרָם
  choice: at ang bilang nila ... ay
  rationale: Tuwirang salin ng pariralang nagpapakilala sa kabuuang bilang.
- source_word: לְגֻלְגְּלֹתָם לִגְבָרִים
  choice: isa-isa ayon sa bawat lalaki
  rationale: Inihahatid nito ang diwa ng indibiduwal na pagbibilang at pinananatili ang espesipikong pagtukoy ng Hebreo sa mga lalaki, nang hindi gumagamit ng di-natural na literalismong “ayon sa kanilang mga bungo.”
- source_word: שְׁלֹשִׁים וּשְׁמוֹנָה אָלֶף
  choice: tatlumpu't walong libo
  rationale: Tuwirang salin ng kabuuang bilang.
