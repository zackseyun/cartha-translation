    issue: Hindi malinaw ang ugnayan ng “gawain” at “bahay ni Yahweh.”
    rationale: Ang “sa gawain sa bahay ni Yahweh” ay lokatibo sa karaniwang Tagalog (“work in the house”), ngunit עַל־מְלֶאכֶת בֵּית יְהוָה ay “over the work of the house of Yahweh.” Ang “gawain ng bahay ni Yahweh” ay nagpapanatili ng ugnayang ito.
  revised_text: Mula sa mga ito, dalawampu't apat na libo ang mamamahala sa gawain ng bahay ni Yahweh, at anim na libo ang magiging mga opisyal at hukom.
