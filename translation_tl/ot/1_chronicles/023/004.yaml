base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/004.yaml
  text: Of these, twenty-four thousand were to oversee the work of the house of Yahweh, and six thousand were officers and judges.
translation:
  language: tl
  text: Mula sa mga ito, dalawampu't apat na libo ang mamamahala sa gawain ng bahay ni Yahweh, at anim na libo ang magiging mga opisyal at hukom.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מֵאֵלֶּה
  choice: Sa mga ito
  rationale: 'Pinananatili ang partitive na diwa: ang mga tungkuling binanggit ay iniatas sa ilang kabilang sa naunang tinukoy na mga Levita.'
- source_word: לְנַצֵּחַ
  choice: ang mamamahala
  rationale: Sa kontekstong administratibo, ang piel infinitive ay tumutukoy sa pangangasiwa sa gawain, hindi sa pamumuno sa musika.
- source_word: עַל מְלֶאכֶת
  choice: sa gawain
  rationale: Likas itong katumbas ng pamamahala 'sa' gawain at hindi nililimitahan ang מְלָאכָה sa gawaing panritwal lamang.
- source_word: בֵּית יְהוָה
  choice: bahay ni Yahweh
  rationale: Pinananatili ang konkretong salitang 'bahay' sa Hebreo at isinasalin ang banal na pangalan bilang Yahweh.
- source_word: עֶשְׂרִים וְאַרְבָּעָה אָלֶף
  choice: dalawampu't apat na libo
  rationale: Tuwirang salin ng bilang, na isinulat sa mga salita para sa maayos na daloy.
- source_word: וְשֹׁטְרִים
  choice: mga opisyal
  rationale: Malawak at likas na katawagan para sa mga tagapangasiwang may tungkuling administratibo.
- source_word: וְשֹׁפְטִים
  choice: mga hukom
  rationale: Tuwirang katumbas para sa mga gumaganap ng tungkuling panghukuman.
- source_word: שֵׁשֶׁת אֲלָפִים
  choice: anim na libo
  rationale: Tuwirang salin ng bilang at kaayon ng anyo ng unang bilang.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tahasan ang Tetragrammaton sa tekstong Hebreo; pinananatili ng 'Yahweh' ang personal na pangalang tipan sa halip na palitan ito ng isang titulo.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang 'bahay ni Yahweh' sa halip na 'templo' upang mapanatili ang pormal na larawan ng Hebreo, at 'mamamahala' upang natural na ipahayag ang itinakdang tungkulin.
