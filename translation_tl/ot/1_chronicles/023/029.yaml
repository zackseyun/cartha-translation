  yaml_path: translation/ot/1_chronicles/023/029.yaml
  text: and for the bread of the arrangement[a], and for the fine flour for the grain offering, and for the wafers of unleavened bread, and for what is cooked on the griddle, and for what is well-mixed, and for every measure and size,
translation:
  language: tl
  text: at para sa tinapay na nakahanay[a], sa pinong harina para sa handog na butil, sa mga manipis na tinapay na walang pampaalsa, sa inihanda sa patag na kawali, sa hinalong mabuti, at sa lahat ng takal at sukat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “tinapay na pantanghal” o “tinapay ng Presensya.” Sa literal, “tinapay ng pagkakaayos.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לֶחֶם הַמַּעֲרֶכֶת
  choice: tinapay na nakahanay
  rationale: Tuwirang ipinahahayag ang ideya ng tinapay na maayos na inilalagay o inihahanay, ayon sa מַעֲרֶכֶת, nang hindi ipinapalit ang interpretatibong katawagang mula sa kaugnay na mga tekstong pangsaserdote.
- source_word: סֹלֶת
  choice: pinong harina
  rationale: Likas at malinaw na katumbas ng pinong harinang ginagamit sa mga handog.
- source_word: מִנְחָה
  choice: handog na butil
  rationale: Sa kontekstong pangritwal, tumutukoy ito sa handog na pagkaing mula sa butil, hindi lamang sa isang pangkalahatang kaloob.
- source_word: רְקִיקֵי הַמַּצּוֹת
  choice: manipis na tinapay na walang pampaalsa
  rationale: 'Pinananatili ang dalawang sangkap ng parirala: manipis na mga tinapay o wafer at ang pagiging walang pampaalsa.'
- source_word: מַחֲבַת
  choice: mga niluluto sa lapad na kawali
  rationale: Ang salita ay tumutukoy sa patag o lapad na kawaling ginagamit sa paghahanda; isinalin ang pagkaing niluluto rito upang umangkop sa talaan ng mga pagkaing pinangangasiwaan.
- source_word: מֻרְבָּכֶת
  choice: mga hinalo
  rationale: Pinananatiling malawak ang kahulugan ng pasibong anyo at hindi tinutukoy nang higit sa teksto ang eksaktong paraan o mga sangkap ng paghahalo.
- source_word: מְשׂוּרָה
  choice: takal
  rationale: Ang “takal” ay malinaw na tumutukoy sa pamantayan o dami ng laman at naihihiwalay ito sa mas malawak na “sukat.”
- source_word: מִדָּה
  choice: sukat
  rationale: Likas na katumbas para sa sukat, dimensiyon, o pamantayang kaagapay ng takal.
