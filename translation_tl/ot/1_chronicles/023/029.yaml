    issue: “mga niluluto sa lapad na kawali”
    rationale: Ang מַחֲבַת ay isahan at, sa ellipikal na listahang ito, tumutukoy sa pagkaing inihanda sa patag na kawali. Ang “mga niluluto” ay nagbibigay ng di-kailangang maramihan at maaaring magpahiwatig ng patuloy na pagluluto.
  - severity: medium
    issue: “mga hinalo”
    rationale: Ang מֻרְבָּכֶת ay isahang pasibong anyo para sa isang inihandang halo. Ang “ang hinalong mabuti” ay mas natural na Filipino at mas malapit sa anyo, nang hindi tinutukoy ang eksaktong sangkap o proseso.
  - severity: low
    issue: “manipis na tinapay”
    rationale: Maramihan ang רְקִיקֵי; ang pagdaragdag ng “mga” ay nagpapalinaw ng bilang nang hindi binabago ang kahulugan.
