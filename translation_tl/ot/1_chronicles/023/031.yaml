base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/031.yaml
  text: and for all the burnt offerings offered to Yahweh on the Sabbaths[a], at the new moons, and at the appointed feasts, by number according to the ordinance concerning them, continually before Yahweh.
translation:
  language: tl
  text: at sa lahat ng paghahandog[a] ng mga handog na sinusunog para kay Yahweh tuwing Sabbath, tuwing bagong buwan, at sa mga takdang kapistahan, ayon sa bilang, alinsunod sa tuntuning nauukol sa mga iyon, palagi sa harap ni Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “at sa lahat ng pag-aalay ng mga handog na sinusunog para kay Yahweh.” Gumagamit ang Hebreo ng infinitive kasama ng pangngalang “mga handog na sinusunog” upang ipahayag ang gawa ng paghahandog.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְכֹל
  choice: at sa lahat ng
  rationale: Ipinagpapatuloy nito ang talaan ng mga tungkulin at pinananatili ang diwa ng preposisyong nagpapakilala sa isa pang gawaing paglilingkod.
- source_word: הַעֲלוֹת עֹלוֹת
  choice: paghahandog ng mga handog na sinusunog
  rationale: 'Pinananatili nito ang kombinasyon ng infinitive at pangngalang kultiko: ang kilos ng paghahandog at ang mga handog na lubusang sinusunog.'
- source_word: לַיהוָה
  choice: para kay Yahweh
  rationale: Likas sa Filipino ang 'para kay' sa paghahandog na iniuukol sa Diyos, at tahasang pinananatili ang pangalang tipan na Yahweh.
- source_word: לַשַּׁבָּתוֹת
  choice: tuwing Sabbath
  rationale: Ipinahahayag nito ang paulit-ulit na pagganap sa bawat Sabbath at natural na naihahatid ang maramihang anyo ng Hebreo.
- source_word: לֶחֳדָשִׁים
  choice: tuwing bagong buwan
  rationale: Sa kontekstong pangkalendaryo at pangkulto, tumutukoy ito sa mga pagdiriwang sa pagsapit ng bagong buwan, hindi lamang sa mga buwan sa pangkalahatan.
- source_word: וְלַמּוֹעֲדִים
  choice: at sa mga takdang kapistahan
  rationale: Pinagsasama ng salin ang diwa ng itinakdang panahon at ng sagradong kapistahan.
- source_word: בְּמִסְפָּר כְּמִשְׁפָּט עֲלֵיהֶם
  choice: ayon sa bilang at tuntuning nauukol sa mga iyon
  rationale: Ipinapakita nito na kapuwa ang bilang at ang paraan ay itinakda, habang hindi labis na nililinaw kung ang 'mga iyon' ay tumutukoy sa mga handog o sa mga okasyon.
- source_word: תָּמִיד
  choice: palagi
  rationale: Naghahatid ito ng tuloy-tuloy at regular na paglilingkod nang hindi pinipili nang tiyak ang isa lamang sa dalawang bahaging iyon ng kahulugan.
- source_word: לִפְנֵי יְהוָה
  choice: sa harap ni Yahweh
  rationale: Malapit ito sa Hebreo at likas na pahayag para sa paglilingkod sa presensiya ng Diyos.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Pangngalang pantangi ang יהוה sa teksto. Ang 'Yahweh' ay tuwirang kumakatawan sa pangalan at hindi ito pinapalitan ng isang titulo.
- issue: Posibleng tinutukoy ng עֲלֵיהֶם
  choice: mga iyon
  alternative: mga handog; mga takdang okasyon
  rationale: Hindi tiyak sa Hebreo kung ang panghalip ay pangunahing bumabalik sa mga handog o sa mga araw ng pagdiriwang, kaya pinananatili ng salin ang tunay na kalabuan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang mga kinikilalang terminong pangkulto na “handog na sinusunog,” “Sabbath,” “bagong buwan,” at “takdang kapistahan,” habang iniwasan ang labis na teknikal o makalumang pananalita.
