translation:
  language: tl
  text: At tinipon niya ang lahat ng mga pinuno ng Israel[a], at ang mga pari at ang mga Levita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga prinsipe ng Israel,” “mga opisyal ng Israel,” o “mga puno ng Israel.”
