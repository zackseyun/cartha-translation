lexical_decisions:
- source_word: וַיֶּאֱסֹף
  choice: At tinipon niya
  rationale: Isinusulong ng waw-consecutive ang salaysay, at tuwirang ipinapahayag ng “tinipon” ang karaniwang diwa ng אסף sa natural na modernong Tagalog.
- source_word: כָּל
  choice: ang lahat ng
  rationale: Ipinahihiwatig ng pang-uring pamilang ang kabuuan ng pangkat; natural ito bago ang maramihang “mga pinuno.”
- source_word: שָׂרֵי יִשְׂרָאֵל
  choice: mga pinuno ng Israel
  rationale: Maaaring tumukoy ang שָׂרִים sa mga pinuno, prinsipe, opisyal, o puno. Ang “mga pinuno” ay malinaw at malawak, at hindi nagpapahiwatig na mga anak sila ng hari.
- source_word: וְהַכֹּהֲנִים
  choice: pati ang mga pari
  rationale: Tuwirang salin ito ng tiyak na pangngalang maramihan; ginamit ang “pati” upang natural na ipagpatuloy sa Tagalog ang talaan ng mga pangkat na tinipon.
- source_word: וְהַלְוִיִּם
  choice: at mga Levita
  rationale: Ang “mga Levita” ang nakasanayang malinaw na katawagan sa mga kabilang sa tribo o pangkat ni Levi.
