  text: 'Sa mga Gershonita: sina Ladan at Shimei.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isinusulat ding Laadan ang Ladan sa ilang salin sa Ingles at sa kaugnay na talaan.
