lexical_decisions:
- source_word: לַגֵּרְשֻׁנִּי
  choice: Sa mga Gershonita
  rationale: Ang unlaping לַ־ ay nagpapakilala rito ng pangkat sa loob ng talaan ng mga Levita. Likas sa modernong Tagalog ang “Sa mga Gershonita” bilang panimulang parirala para sa pangkat.
- source_word: לַעְדָּן
  choice: Ladan
  rationale: Pangalang pantangi ito kaya tinumbasan sa pamamagitan ng transliterasyon. Pinananatili ng “Ladan” ang anyong gamit sa tekstong Hebreo rito.
- source_word: וְשִׁמְעִי
  choice: at Shimei
  rationale: Ang וְ ay payak na pang-ugnay na “at,” at ang pangalang שִׁמְעִי ay isinalin sa anyong transliteradong “Shimei.”
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “sina” upang likas na ipakilala ang dalawang pangalan ng tao, habang pinanatili ang maikli at tila-ulong anyo ng genealogical na tala.
