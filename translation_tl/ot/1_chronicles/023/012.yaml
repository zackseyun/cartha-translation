  text: 'The sons of Kohath: Amram, Izhar, Hebron, and Uzziel—four.'
translation:
  language: tl
  text: Ang mga anak ni Kohat ay sina Amram, Izhar, Hebron, at Uziel—apat silang lahat.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: mga anak ni
  rationale: Tuwirang salin ng construct plural na nagpapakilala sa talaan ng apat na aktuwal na anak; hindi kailangang palawakin bilang “mga inapo.”
- source_word: קְהָת
  choice: Kohat
  rationale: Ginamit ang kinagawiang anyo ng pangalang biblikal sa Tagalog.
- source_word: עַמְרָם
  choice: Amram
  rationale: Malapit na transliterasyon at kinikilalang anyo ng pangalang pantangi.
- source_word: יִצְהָר
  choice: Izhar
  rationale: Malapit na transliterasyon ng pangalang pantangi, na angkop sa modernong Tagalog.
- source_word: חֶבְרוֹן
  choice: Hebron
  rationale: Kinikilalang anyo ng pangalan; sa kontekstong ito ay pangalan ng tao, hindi ng lugar.
- source_word: וְעֻזִּיאֵל
  choice: at Uziel
  rationale: Isinalin ang pang-ugnay na וְ bilang “at” at ginamit ang payak na Tagalog na transliterasyon ng pangalan.
- source_word: אַרְבָּעָה
  choice: apat silang lahat
  rationale: Ipinahahayag nang natural sa Tagalog ang pangwakas na bilang na nagbubuod sa apat na pangalang nakalista.
