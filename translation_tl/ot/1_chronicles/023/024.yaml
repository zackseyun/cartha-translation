base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/024.yaml
  text: These were the sons of Levi by their fathers’ houses[a], the heads of the fathers’ houses, according to those counted of them, by the number of names, head by head, doing the work for the service of the house of Yahweh, from twenty years old and upward.
translation:
  language: tl
  text: 'Ito ang mga anak ni Levi ayon sa mga sambahayan ng kanilang mga ninuno: ang mga pinuno ng mga sambahayan, ayon sa pagkakatala sa kanila, ayon sa bilang ng mga pangalan, isa-isa[a]. Sila ang gumagawa ng gawain para sa paglilingkod sa bahay ni Yahweh, mula dalawampung taong gulang pataas.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “ayon sa kanilang mga ulo,” na literal ding maaaring tumukoy sa “mga bungo”; isang idyoma ito na nangangahulugang hiwa-hiwalay na binilang ang bawat tao.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְבֵית אֲבֹתֵיהֶם
  choice: ayon sa kani-kanilang sambahayan ng mga ninuno
  rationale: Tumutukoy ito sa pag-uuri ng mga Levita batay sa kanilang angkan o yunit ng pamilyang nagmula sa isang ninuno. Ang “sambahayan ng mga ninuno” ay malinaw sa modernong Filipino at pinananatili ang panlipunang balangkas ng Hebreo.
- source_word: רָאשֵׁי הָאָבוֹת
  choice: ang mga pinuno ng mga sambahayan
  rationale: Sa konteksto, ang parirala ay tumutukoy sa mga kinatawan o pinuno ng mga sambahayan ng ninuno, hindi lamang sa mga ama sa literal na diwa.
- source_word: לִפְקוּדֵיהֶם
  choice: ayon sa pagkakatala sa kanila
  rationale: Ang anyo mula sa פקד ay may diwa ng pagbibilang o pagtatala. Pinananatili ng salin ang kaugnayan nito sa opisyal na talaan ng mga tao.
- source_word: בְּמִסְפַּר שֵׁמוֹת
  choice: Binilang ang kanilang mga pangalan
  rationale: Isa itong pormula ng sensus na nagpapahiwatig na ang mga indibidwal ay nakatala ayon sa pangalan. Ginawang likas na pangungusap sa Filipino nang hindi inaalis ang kongkretong larawan ng mga pangalang binibilang.
- source_word: לְגֻלְגְּלֹתָם
  choice: nang isa-isa
  rationale: Literal itong “ayon sa kanilang mga bungo/ulo,” isang idyoma para sa indibidwal na pagbibilang. Ang “isa-isa” ang natural at eksaktong katumbas sa modernong Filipino; ipinaliliwanag sa talababa ang literal na larawan.
- source_word: עֹשֵׂה הַמְּלָאכָה
  choice: Sila ang gumagawa ng mga gawain
  rationale: Bagaman pang-isahan ang participle sa Hebreo, kolektibo ang gamit nito para sa mga Levita. Ang maramihang Filipino ay umaayon sa tinutukoy na pangkat.
- source_word: לַעֲבֹדַת בֵּית יְהוָה
  choice: para sa paglilingkod sa bahay ni Yahweh
  rationale: Ang עֲבֹדָה ay tumutukoy sa paglilingkod at gawaing kaugnay ng santuwaryo. Sapat ang lawak ng “paglilingkod” upang masaklaw ang praktikal at ritwal na mga tungkulin nang hindi nagdaragdag ng kalaunang terminolohiyang pansimbahan.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: mula dalawampung taong gulang pataas
  rationale: Likas na Filipino ito para sa Hebreong idyomang nagtatakda ng pinakamababang edad ng mga kabilang sa paglilingkod.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehovah
  rationale: Tuwirang ginagamit sa talata ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalang Hebreo sa halip na palitan ito ng isang titulo.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “sambahayan ng mga ninuno” para sa sinaunang yunit ng angkan, “bahay ni Yahweh” para sa santuwaryo, at maiikling pangungusap upang luminaw ang masinsing estruktura ng Hebreo nang hindi binabago ang ugnayan ng mga sugnay.
