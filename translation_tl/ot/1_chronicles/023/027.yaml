  text: כִּ֣י בְ/דִבְרֵ֤י דָוִיד֙ הָ/אַ֣חֲרֹנִ֔ים הֵ֖מָּה מִסְפַּ֣ר בְּנֵי לֵוִ֑י מִ/בֶּ֛ן עֶשְׂרִ֥ים שָׁנָ֖ה וּ/לְ/מָֽעְלָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/027.yaml
  text: For by the last words of David[a], the sons of Levi were numbered from twenty years old and upward.
translation:
  language: tl
  text: Sapagkat ayon sa mga huling salita ni David[a], ang mga anak ni Levi ay binilang mula sa dalawampung taong gulang pataas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa pamamagitan ng mga huling salita ni David.” Maaaring ipahiwatig ng Hebreo na isinagawa ang pagbibilang batay sa huling tagubilin ni David.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Nagpapakilala ito ng paliwanag na kaugnay ng naunang pahayag; natural sa Filipino ang “Sapagkat” bilang panandang sanhi o paliwanag.
- source_word: בְּדִבְרֵי דָוִיד הָאַחֲרֹנִים
  choice: ayon sa mga huling salita ni David
  rationale: Maaaring ipahayag ng ב ang batayan o paraan. Pinananatili ng “ayon sa” ang diwa na ang pagbibilang ay batay sa huling tagubilin ni David, habang inilalahad sa talababa ang posibleng alternatibong pagkakaugnay.
- source_word: הָאַחֲרֹנִים
  choice: huling
  rationale: Tuwirang tumutukoy sa mga salita o tagubilin ni David sa huling yugto; hindi kinakailangang dagdagan ang teksto ng “tagubilin.”
- source_word: הֵמָּה מִסְפַּר
  choice: ay binilang
  rationale: Eliptikal ang Hebreo, ngunit sa konteksto ay tumutukoy ito sa pagkakasama ng mga Levita sa bilang o sensus. Ang “ay binilang” ay malinaw at hindi labis na nagpapaliwanag.
- source_word: בְּנֵי לֵוִי
  choice: ang mga anak ni Levi
  rationale: Pinananatili nito ang genealogical na pananalita ng Hebreo, bagaman kolektibong tumutukoy sa mga Levita.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וּלְמַעְלָה
  choice: mula sa dalawampung taong gulang pataas
  rationale: Natural na modernong Filipino para sa karaniwang Hebreong pormula ng edad, at malinaw na kabilang ang lahat ng mas matanda.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang “mga anak ni Levi” upang maipakita ang genealogical na anyo ng Hebreo, at ginamit ang “ayon sa” bilang natural na paglalahad ng batayan ng pagbibilang nang hindi isinasara ang tunay na kalabuan ng pang-ukol.
