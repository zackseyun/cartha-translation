base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/023.yaml
  text: 'The sons of Mushi: Mahli[a], Eder, and Jeremoth—three.'
translation:
  language: tl
  text: 'Ang mga anak ni Musi: sina Mahli, Eder, at Jeremot[a]—tatlo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring baybayin ang Jeremot na Jerimot.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: Ang mga anak ni
  rationale: Tuwirang salin ng construct plural na “mga anak ni,” na nagpapakilala sa talaan ng tatlong indibidwal.
- source_word: מוּשִׁי
  choice: Musi
  rationale: Pangalang pantangi; isinalin sa baybay na natural sa Filipino, kung saan ang שׁ ay kinakatawan ng “s.”
- source_word: מַחְלִי
  choice: Mahli
  rationale: Pangalang pantangi; pinanatili ang “hl” upang maipakita ang magkasunod na Hebreong katinig at maiwasang mapagkamalang “Mali.”
- source_word: וְעֵדֶר
  choice: Eder
  rationale: Pangalang pantangi na may pang-ugnay; ang “at” ay inilagay bago ang huling pangalan ayon sa natural na pag-uugnay ng isang listahan sa Filipino.
- source_word: וִירֵמוֹת
  choice: Jeremot
  rationale: Pangalang pantangi; ang paunang Hebreong yod ay kinakatawan ng tradisyonal na “J,” at ang hulihang ת ay “t” sa Filipino. Ang anyong Jerimot ay maaari ring gamitin dahil sa pagkakaiba ng nakaugaliang transliterasyon.
- source_word: שְׁלֹשָׁה
  choice: tatlo
  rationale: Bilang na nagbubuod sa kabuuang dami ng mga anak na nakalista; pinanatili bilang pangwakas na appositional summary pagkatapos ng gatlang.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “sina” bago ang talaan ng mga pangalan upang maging natural ang pangungusap, habang pinanatili ang maikli at genealogical na anyo ng Hebreo.
