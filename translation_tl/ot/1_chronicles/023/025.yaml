  text: כִּ֚י אָמַ֣ר דָּוִ֔יד הֵנִ֛יחַ יְהוָ֥ה אֱלֹהֵֽי יִשְׂרָאֵ֖ל לְ/עַמּ֑/וֹ וַ/יִּשְׁכֹּ֥ן בִּ/ירוּשָׁלִַ֖ם עַד לְ/עוֹלָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/025.yaml
  text: For David said[a], “Yahweh, the God of Israel, has given rest to his people, and he has dwelt in Jerusalem forever.”
translation:
  language: tl
  text: Sapagkat sinabi ni David[a], “Yahweh, ang Diyos ng Israel, ay nagbigay na ng kapahingahan sa kanyang bayan, at mananahan siya sa Jerusalem magpakailanman.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin ang huling bahagi: “at nananahan siya sa Jerusalem magpakailanman,” o “at nanahan na siya sa Jerusalem magpakailanman.” Maaaring ipahayag ng pandiwang Hebreo ang matatag at nagpapatuloy na paninirahan ni Yahweh roon.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikita ang paliwanag o dahilan para sa naunang tagubilin; likas at malinaw ito sa Filipino.
- source_word: אָמַר דָּוִיד
  choice: sinabi ni David
  rationale: Tuwirang salaysay sa nakaraan, na angkop sa anyo ng Hebreo.
- source_word: הֵנִיחַ
  choice: nagbigay na ng kapahingahan
  rationale: 'Ang hiphil ng נוח ay causative: pinagkalooban o binigyan ng kapahingahan. Ipinahihiwatig ng “na” ang natamong kalagayang mahalaga pa sa pagsasalita ni David.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos na nasa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ang Diyos ng Israel
  rationale: Likas na salin ng construct phrase at apposition kay Yahweh.
- source_word: לְעַמּוֹ
  choice: sa kanyang bayan
  rationale: Tinutukoy ng ל ang tumanggap o nakinabang sa ipinagkaloob na kapahingahan.
- source_word: וַיִּשְׁכֹּן
  choice: at mananahan siya
  rationale: Ang pandiwa ay mula sa שכן, “manahan.” Sa sunod-sunod na pahayag sa sipi, maaari itong unawain bilang kinahinatnan o nagpapatuloy na paninirahan; ang anyong hinaharap sa Filipino ay natural kasabay ng “magpakailanman,” habang itinatala sa talababa ang alternatibong aspektuwal na pagbasa.
- source_word: בִּירוּשָׁלַם
  choice: sa Jerusalem
  rationale: Tuwirang panlunan na salin.
- source_word: עַד לְעוֹלָם
  choice: magpakailanman
  rationale: Karaniwan, dignificado, at malinaw na katumbas ng pahayag na tumutukoy sa walang hanggang pagpapatuloy.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Personal na pangalan ang tahasang nasa pinagmulang Hebreo; pinananatili itong transliterasyon nang hindi pinapalitan ng titulo.
- issue: Panahunan o aspekto ng paninirahan ni Yahweh sa Jerusalem
  choice: mananahan siya sa Jerusalem magpakailanman
  alternative: nananahan siya sa Jerusalem magpakailanman; nanahan na siya sa Jerusalem magpakailanman
  rationale: Ang וַיִּשְׁכֹּן sa kontekstong ito ay maaaring ihayag bilang kinahinatnan o matatag at nagpapatuloy na paninirahan. Hindi lubos na itinatakda ng anyong Hebreo ang isang simpleng katumbas na panahunan sa Filipino, kaya pinananatili sa talababa ang tunay na posibilidad ng pagbasa bilang nakatatag nang kalagayan.
translation_notes:
  register: Makabago ngunit dignipikadong Filipino. Ginamit ang “bayan” para sa tipanang sambayanan at “kapahingahan” para mapanatili ang biblikal na diwa ng katiwasayan at pagkakalagay sa payapang kalagayan. Nasa pangunahing teksto ang marker na [a].
