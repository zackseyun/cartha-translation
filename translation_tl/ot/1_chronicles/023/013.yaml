  text: בְּנֵ֥י עַמְרָ֖ם אַהֲרֹ֣ן וּ/מֹשֶׁ֑ה וַ/יִּבָּדֵ֣ל אַהֲרֹ֡ן לְֽ/הַקְדִּישׁ/וֹ֩ קֹ֨דֶשׁ קָֽדָשִׁ֤ים הֽוּא וּ/בָנָי/ו֙ עַד עוֹלָ֔ם לְ/הַקְטִיר֩ לִ/פְנֵ֨י יְהוָ֧ה לְ/שָׁרְת֛/וֹ וּ/לְ/בָרֵ֥ךְ בִּ/שְׁמ֖/וֹ עַד עוֹלָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/013.yaml
  text: 'The sons of Amram: Aaron and Moses. And Aaron was set apart[a], he and his sons forever, to sanctify him as most holy, to burn incense before Yahweh, to minister to him, and to bless in his name forever.'
translation:
  language: tl
  text: 'Ang mga anak ni Amram: sina Aaron at Moises. Ibinukod si Aaron upang italaga siya bilang pinakabanal[a], siya at ang kanyang mga anak, magpakailanman, upang magsunog ng insenso sa harap ni Yahweh, maglingkod sa kanya, at magbasbas sa kanyang pangalan magpakailanman.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “kabanalan ng mga kabanalan,” isang pasukdol na nangangahulugang “pinakabanal” o “lubos na banal.” Hindi ito awtomatikong tumutukoy sa Kabanal-banalang Dako.
    reason: Ipinakikita ang literal na anyo at leksikal na alternatibo ng קֹדֶשׁ קָדָשִׁים, habang nililinaw na ang parirala rito ay naglalarawan sa katayuan ni Aaron.
lexical_decisions:
- source_word: בְּנֵי עַמְרָם
  choice: Ang mga anak ni Amram
  rationale: Tuwirang tumutukoy rito sa mga anak na sina Aaron at Moises, kaya hindi kailangang palawakin bilang “mga inapo.”
- source_word: וַיִּבָּדֵל
  choice: Ibinuod
  rationale: Ipinahahayag ng Nifal ng בדל ang paghihiwalay o pagbubukod para sa isang natatanging tungkulin; likas at angkop sa kontekstong saserdotal ang “ibinuod.”
- source_word: לְהַקְדִּישׁוֹ
  choice: upang italaga siya
  rationale: Ang Hifil ng קדש ay nangangahulugang gawing banal o italaga. Pinananatili ng “siya” ang panlalaking isahang hulapi na pinakamalapit na tumutukoy kay Aaron.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: kabanal-banalan
  rationale: Ang konstruksiyong “kabanalan ng mga kabanalan” ay pasukdol. Ang “kabanal-banalan” ay maikli, marangal, at hindi ito awtomatikong itinuturing na pangalan ng isang bahagi ng santuwaryo.
- source_word: הוּא וּבָנָיו עַד עוֹלָם
  choice: siya at ang kanyang mga anak magpakailanman
  rationale: Pinananatili ang tahasang pagtukoy kay Aaron at sa kanyang mga anak at ang patuloy na katangian ng kanilang tungkulin.
- source_word: לְהַקְטִיר
  choice: upang magsunog ng insenso
  rationale: Sa kontekstong saserdotal, karaniwang tumutukoy ang קטר sa pagpapausok ng insenso, bagaman maaari rin itong sumaklaw sa mga handog na pinauusok.
- source_word: לִפְנֵי יְהוָה
  choice: sa harap ni Yahweh
  rationale: Tapat na ipinahahayag ng “sa harap” ang presensiyang tinutukoy ng לִפְנֵי, at isinasalin ang banal na pangalan bilang Yahweh.
- source_word: לְשָׁרְתוֹ
  choice: maglingkod sa kanya
  rationale: Ang שרת ay paglilingkod na may natatanging diwang saserdotal; ang “maglingkod” ay malinaw at likas sa modernong Tagalog, habang ang “kanya” ay nagpapanatili sa panghalip ng Hebreo.
- source_word: וּלְבָרֵךְ בִּשְׁמוֹ
  choice: at magbasbas sa kanyang pangalan
  rationale: Pinananatili nito ang posibilidad na ang basbas ay binibigkas sa ilalim ng pangalan o awtoridad ni Yahweh nang hindi labis na nililinaw ang ugnayan.
theological_decisions:
- issue: Ang tinutukoy ng mga isahang hulapi sa “italaga siya” at “maglingkod sa kanya”
  choice: Ang “siya” ay tumutukoy kay Aaron; ang “kanya” ay tumutukoy kay Yahweh.
  alternative: Maaaring unawain ang una bilang pagtatalaga ng “kabanal-banalang mga bagay,” at ang ikalawa, kung susundin lamang ang anyo ng panghalip, ay maaaring pagtalunan ang referent.
  rationale: Si Aaron ang tahasang paksa at pinakamalapit na maaaring pag-ukulan ng hulapi sa לְהַקְדִּישׁוֹ, samantalang si Yahweh ang pinakamalapit at makatuwirang pinag-uukulan ng paglilingkod pagkatapos ng “sa harap ni Yahweh.” Pinananatili sa salin ang mga panghalip sa halip na palitan ang mga ito ng mga tahasang pangalan.
- issue: Saklaw ng “magpakailanman” sa tungkuling saserdotal
  choice: Pinanatili ang “magpakailanman” sa dalawang paglitaw nito.
  alternative: “Sa lahat ng panahon” o “palagi.”
  rationale: Sinasalamin nito ang עַד עוֹלָם nang hindi ipinapasok sa talata ang isang sistematikong paliwanag tungkol sa tagal o katuparan ng tungkuling ito.
translation_notes:
  register: Gumamit ng makabagong, marangal, at madaling maunawaang Tagalog. Ang gitling-pahaba sa “siya at ang kanyang mga anak magpakailanman” ay tumutulong na panatilihin ang pagkakasunod ng Hebreo habang nililinaw na kasama ang sambahayan ni Aaron sa pangmatagalang pagkakatalaga.
