  source_fidelity: 'Tapat ang salin sa Hebreo: ang בְּנֵי ay wastong “Ang mga anak ni,” pinananatili ang pagkakaiba ng Gershom (Gersom) sa Gershon, at ang שְׁבוּאֵל ay maayos na isinasatitik bilang Sebuel. Ang tiyak na הָרֹאשׁ ay naipahayag bilang “ang pinuno,” na angkop sa kontekstong pang-organisasyon at hindi ipinipilit ang kahulugang pagkakasunod-sunod na “una.”'
