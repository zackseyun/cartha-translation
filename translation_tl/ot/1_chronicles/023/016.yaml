  text: 'The sons of Gershom: Shebuel the chief[a].'
translation:
  language: tl
  text: 'Ang mga anak ni Gersom: si Sebuel ang pinuno.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang ulo.”
    reason: Pinananatili ang mas literal na kahulugang maaaring taglayin ng רֹאשׁ, bagaman “pinuno” ang mas angkop sa konteksto.
lexical_decisions:
- source_word: בְּנֵי
  choice: Ang mga anak ni
  rationale: Tuwirang isinasalin ang construct plural ng בֵּן at angkop ito sa talaan ng angkan; hindi pinalalawak sa “mga inapo” dahil walang malinaw na dahilan sa talata na gawin iyon.
- source_word: גֵרְשׁוֹם
  choice: Gersom
  rationale: Isinasatitik ang pangalang Hebreo sa anyong natural sa Filipino at pinananatiling iba sa Gershon.
- source_word: שְׁבוּאֵל
  choice: Sebuel
  rationale: Isinasatitik ang pangalang pantangi ayon sa karaniwang baybay at bigkas sa Filipino.
- source_word: הָרֹאשׁ
  choice: ang pinuno
  rationale: Sa konteksto ng talaang pang-organisasyon, ang רֹאשׁ na may pantukoy ay tumutukoy sa nangunguna o may pangunahing katungkulan; mas natural sa modernong Filipino ang “pinuno” kaysa literal na “ulo.”
theological_decisions: []
translation_notes:
  register: Maikli, marangal, at natural na Filipino para sa isang talaang pangangkan at pang-organisasyon. Ginamit ang “si” bago ang pangalan upang luminaw ang balangkas ng pangungusap sa Filipino.
