  yaml_path: translation/ot/1_chronicles/023/021.yaml
  text: 'The sons of Merari: Mahli and Mushi. The sons of Mahli: Eleazar and Kish.'
translation:
  language: tl
  text: Ang mga anak ni Merari ay sina Mahli at Musi. Ang mga anak ni Mahli ay sina Eleazar at Kis.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: mga anak ni
  rationale: Ang construct plural ng בֵּן ay nagpapakilala ng talaangkanan. Likas at tuwiran sa Filipino ang “mga anak ni” sa kontekstong ito; hindi kailangang palawakin bilang “mga inapo ni.”
- source_word: מְרָרִי
  choice: Merari
  rationale: Pangngalang pantangi na tinumbasan sa karaniwang anyong ginagamit sa mga saling Filipino.
- source_word: מַחְלִי
  choice: Mahli
  rationale: Pangngalang pantangi; pinanatili ang anyo nito sa dalawang paglitaw sa talata.
- source_word: וּמוּשִׁי
  choice: at Musi
  rationale: Isinalin ang pang-ugnay at ginamit ang natural na anyong Filipino ng pangalang pantangi.
- source_word: בְּנֵי מַחְלִי
  choice: Ang mga anak ni Mahli
  rationale: Inulit ang pormula ng talaangkanan upang mapanatili ang malinaw na estruktura ng Hebreo.
- source_word: אֶלְעָזָר
  choice: Eleazar
  rationale: Pangngalang pantangi na pinanatili sa karaniwang anyong biblikal sa Filipino.
- source_word: וְקִישׁ
  choice: at Kis
  rationale: Isinalin ang pang-ugnay at ginamit ang natural na transliterasyong Filipino ng pangalang pantangi.
