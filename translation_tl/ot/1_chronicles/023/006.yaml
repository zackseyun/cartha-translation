  source_fidelity: Ang “Hinati sila ni David” ay tumpak na nagsasalin ng pandiwang may hulaping layon na “sila,” at ang “mga pangkat” ay angkop para sa מַחְלְקוֹת. Gayunman, ang “ayon sa mga anak ni Levi” ay nagpapahiwatig ng batayan o pamantayan ng paghahati, samantalang ang לִבְנֵי לֵוִי ay mas tuwirang “para sa mga anak ni Levi” (o, ayon sa konteksto, kaugnay ng mga anak ni Levi).
  naturalness: Natural at malinaw ang pangungusap matapos palitan ang “ayon sa” ng “para sa.” Ang talaan ng mga pangalan kasunod ng tutuldok ay nananatiling maayos sa modernong Tagalog.
  terminology: Ang “mga anak ni Levi” ay wastong pinananatili bilang genealogical na pananalita. Ang mga pangalang Gershon, Kohat, at Merari ay angkop na anyo sa Tagalog. Ang “mga pangkat” ay neutral at hindi labis na interpretatibo.
