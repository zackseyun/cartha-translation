  text: 'David divided them into divisions for the sons of Levi: Gershon[a], Kohath, and Merari.'
translation:
  language: tl
  text: 'Hinati sila ni David sa mga pangkat para sa mga anak ni Levi: sina Gershon[a], Kohat, at Merari.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “para kina Gershon, Kohat, at Merari.”
    reason: Pinananatili ng alternatibo ang mas tahasang puwersa ng pang-ukol na לְ bago ang Gershon, na maaaring unawaing sumasaklaw rin sa Kohat at Merari.
lexical_decisions:
- source_word: וַיֶּחָלְקֵם
  choice: Hinati sila
  rationale: Ang piel na anyo ng חלק ay nangangahulugang hatiin o pangkatin, at pinananatili ng “sila” ang tahasang layon na nasa hulaping 3mp.
- source_word: מַחְלְקוֹת
  choice: sa mga pangkat
  rationale: Tumutukoy ang pangngalan sa mga dibisyon o organisadong pangkat. Mas natural sa makabagong Tagalog ang “mga pangkat” kaysa “mga dibisyon” sa kontekstong ito.
- source_word: לִבְנֵי לֵוִי
  choice: ayon sa mga anak ni Levi
  rationale: Pinananatili nito ang anyong talaangkanan na “mga anak ni Levi,” habang natural na ipinahahayag ang pag-aayos batay sa tatlong sangay ng angkan.
- source_word: לְגֵרְשׁוֹן קְהָת וּמְרָרִי
  choice: sina Gershon, Kohat, at Merari
  rationale: Ang tatlong pangalan ay inilalahad bilang mga anak ni Levi at pinagmulan ng pangunahing mga angkan ng mga Levita. Ang “sina” ay likas na pananda sa Tagalog para sa talaan ng mga pangalan.
