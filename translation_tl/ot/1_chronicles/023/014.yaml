  text: וּ/מֹשֶׁ֖ה אִ֣ישׁ הָ/אֱלֹהִ֑ים בָּנָ֕י/ו יִקָּרְא֖וּ עַל שֵׁ֥בֶט הַ/לֵּוִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/014.yaml
  text: And as for Moses, the man of God, his sons were counted among the tribe of Levi.
translation:
  language: tl
  text: Tungkol naman kay Moises, ang tao ng Diyos, ang mga anak niya ay ibinilang sa lipi ni Levi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִישׁ הָאֱלֹהִים
  choice: lingkod ng Diyos
  rationale: Bagaman literal na “tao ng Diyos,” ang parirala ay isang kinikilalang titulo para sa isang taong itinalaga at naglilingkod sa Diyos; mas likas at malinaw sa modernong Filipino ang “lingkod ng Diyos” sa kontekstong ito.
- source_word: יִקָּרְאוּ עַל
  choice: ibinilang sa
  rationale: Sa konteksto ng talaangkanan at pagkakaugnay sa lipi, ipinahihiwatig ng idyoma na ang mga anak ni Moises ay kinilala o itinala bilang kabilang sa lipi ni Levi, hindi lamang na “tinawag” sila rito.
- source_word: שֵׁבֶט הַלֵּוִי
  choice: lipi ni Levi
  rationale: Karaniwang natural na salin sa Filipino para sa tribal affiliation ng Israel.
theological_decisions:
- issue: Kahulugan ng titulong “man of God”
  choice: lingkod ng Diyos
  alternative: tao ng Diyos
  rationale: Pinananatili nito ang diwa ng banal na pagtatalaga at tungkulin ni Moises nang hindi nagdaragdag ng denominasyonal na interpretasyon.
- issue: Pagkabilang ng mga anak ni Moises kay Levi
  choice: ibinilang sa lipi ni Levi
  alternative: tinawag ayon sa lipi ni Levi
  rationale: Ang konteksto ng kabanata ay pag-uuri at pagtatala ng mga Levita; kaya ang “ibinilang” ang pinakamalinaw na pagpapahayag habang pinananatili ang kaugnayan sa tekstong Hebreo.
translation_notes:
  register: Modernong Filipino Tagalog na natural, marangal, at malinaw. Ginamit ang “Tungkol naman kay Moises” upang maipakita ang topical contrast ng וּמֹשֶׁה, at pinanatiling maikli ang pangungusap gaya ng Hebreo.
