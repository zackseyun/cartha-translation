id: 1CH.23.10
reference: 1 Chronicles 23:10
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וּ/בְנֵ֣י שִׁמְעִ֔י יַ֣חַת זִינָ֔א וִ/יע֖וּשׁ וּ/בְרִיעָ֑ה אֵ֥לֶּה בְנֵי שִׁמְעִ֖י אַרְבָּעָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/010.yaml
  text: 'And the sons of Shimei: Jahath[a], Zina, Jeush, and Beriah. These were the sons of Shimei—four.'
translation:
  language: tl
  text: At ang mga anak ni Simei ay sina Jahat, Zina[a], Jeus, at Beria. Ang mga ito ang mga anak ni Simei—apat silang lahat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa ibang mga salin, “Ziza” ang ikalawang pangalan (ihambing sa 1 Cronica 23:11); “Zina” ang mababasa sa tekstong Hebreo rito.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי
  choice: At ang mga anak ni
  rationale: Isinalin ang ו bilang payak na pang-ugnay na “At,” at ang בְנֵי bilang “mga anak ni,” na likas sa modernong Filipino at angkop sa talaangkanan.
- source_word: שִׁמְעִי
  choice: Simei
  rationale: Isinatinig ang pangalang Hebreo sa anyong pamilyar at madaling basahin sa Filipino.
- source_word: יַחַת
  choice: Jahat
  rationale: Isinatinig ang pangalang Hebreo ayon sa karaniwang pagbasa sa Filipino, kung saan ang unang katinig ay kinakatawan ng J at ang ח ng h.
- source_word: זִינָא
  choice: Zina
  rationale: Pinanatili ang anyong pangalan na tahasang mababasa sa tekstong Hebreo ng talatang ito; ang kaugnay na anyong “Ziza” ay inilagay sa talababa.
- source_word: וִיעוּשׁ
  choice: Jeus
  rationale: Isinatinig ang pangalang Hebreo sa maikli at likas na anyong Filipino; ang prefiks na pang-ugnay ay ipinahayag sa balangkas ng listahan.
- source_word: וּבְרִיעָה
  choice: at Beria
  rationale: Isinatinig ang pangalan bilang “Beria” at malinaw na isinalin ang pang-ugnay upang tapusin ang listahan.
- source_word: אֵלֶּה בְנֵי שִׁמְעִי
  choice: Ang mga ito ang mga anak ni Simei
  rationale: Pinanatili ang pag-uulit ng parirala sa Hebreo sa halip na paikliin ito, upang mapanatili ang resumptibong estilo at linaw ng talaan.
- source_word: אַרְבָּעָה
  choice: apat silang lahat
  rationale: Tuwirang ipinahayag ang kabuuang bilang na apat sa natural na Filipino, nang hindi nagdaragdag ng bagong impormasyon.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mga anak” sa halip na “mga anak na lalaki” upang huwag gawing mas tiyak kaysa sa malawak na gamit ng Hebreong בְנֵי sa konteksto ng talaangkanan. Pinanatili ang pag-uulit at ang pangwakas na bilang ng orihinal.
