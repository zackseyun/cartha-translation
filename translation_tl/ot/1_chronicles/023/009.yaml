base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/009.yaml
  text: 'The sons of Shimei: Shelomoth[a], Haziel, and Haran—three. These were the heads of the fathers’ houses of Ladan.'
translation:
  language: tl
  text: 'Ang mga anak ni Simei: sina Selomot[a], Haziel, at Haran—tatlo silang lahat. Sila ang mga pinuno ng mga sambahayan ng angkan ni Ladan.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Selomit,” isang karaniwang alternatibong transliterasyon ng pangalan.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי שִׁמְעִי
  choice: Ang mga anak ni Simei
  rationale: Sa talaangkanang ito, ang parirala ay likas na tumutukoy sa mga anak ni Simei, hindi lamang sa mas malalayong inapo.
- source_word: שלמות
  choice: Selomot
  rationale: Transliterasyon ng pangalang Hebreo ayon sa anyong nakatala rito; pinananatili sa talababa ang karaniwang alternatibong Selomit.
- source_word: וַחֲזִיאֵל
  choice: Haziel
  rationale: Tuwirang transliterasyon ng חֲזִיאֵל; hindi iniangkat ang kaugnay ngunit naiibang anyong Jahaziel.
- source_word: וְהָרָן
  choice: at Haran
  rationale: Payak na pang-ugnay at transliterasyon ng personal na pangalan.
- source_word: שְׁלֹשָׁה
  choice: tatlo silang lahat
  rationale: Malinaw na pinananatili ang tahasang bilang na ibinubuod ng Hebreo sa natural na Filipino.
- source_word: רָאשֵׁי הָאָבוֹת
  choice: mga pinuno ng mga angkan
  rationale: Sa kontekstong pangangkan at pang-administratibo ng Mga Cronica, tumutukoy ito sa mga ulong kinatawan ng mga sambahayang batay sa ninuno; mas malinaw sa karaniwang Filipino ang 'mga pinuno ng mga angkan' kaysa literal na 'mga ulo ng mga ama.'
- source_word: לְלַעְדָּן
  choice: ni Ladan
  rationale: Ipinahahayag ng ל ang kaugnayan o pagkalakip ng mga angkan sa linya ni Ladan.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang 'sina' para sa likas na paglilista ng mga pangalan at 'mga angkan' upang malinaw na maipahayag ang institusyong pampamilya nang hindi maging mekanikal ang salin.
