  naturalness: Kailangan ang rebisyon dahil hindi natural sa makabagong Filipino ang ayos na 'naging iisang angkan ng ama sila.' Mas malinaw at marangal ang 'itinuring silang iisang angkan sa panig ng ama para sa iisang pagtatala.'
  terminology: Pinanatili ang mga pangalang Jahat, Ziza, Jeus, at Beria. Ang 'angkan sa panig ng ama' ay mas malinaw na katumbas ng בית אב kaysa sa literal ngunit di-likas na 'angkan ng ama.' Ang 'iisang pagtatala' ay maingat na katumbas ng לִפְקֻדָּה אֶחָת sa kontekstong administratibo.
