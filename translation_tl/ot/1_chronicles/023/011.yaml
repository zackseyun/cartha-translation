translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang teknikal na diwa ng organisasyong pangangkan, ngunit ipinaliwanag sa talababa ang saklaw ng mga salitang maaaring mangahulugang sambahayan, angkan, pangkat, o yunit sa pagtatala.
