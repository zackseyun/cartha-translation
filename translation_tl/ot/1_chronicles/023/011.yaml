base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/011.yaml
  text: Jahath was the first and Zizah the second[a]; Jeush and Beriah did not have many sons[b], so they became one father’s house for one reckoning.
translation:
  language: tl
  text: Si Jahat ang una, at si Ziza ang ikalawa[a]. Hindi nagkaroon ng maraming anak na lalaki sina Jeus at Beria, kaya itinuring silang iisang angkan sa panig ng ama para sa iisang pagtatala[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang pangalang Ziza ay maaari ring baybaying “Zizah.”
    reason: lexical_alternative
  - marker: b
    text: O “iisang sambahayan ng ama para sa iisang pagtatala.” Ang Hebreo ay tumutukoy sa isang angkan sa panig ng ama na ibinilang bilang isang administratibong yunit.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי יַחַת הָרֹאשׁ
  choice: Si Jahat ang una
  rationale: Sa talaang ito, ang היה ay payak na panandang pagkakakilanlan, at ang רֹאשׁ, na katapat ng “ikalawa,” ay tumutukoy sa unang puwesto o ranggo.
- source_word: וְזִיזָה הַשֵּׁנִי
  choice: at si Ziza ang ikalawa
  rationale: Pinananatili ang ordinal na pagkakasunod. Ang “Ziza” ay malinaw at likas na transliterasyon sa Filipino.
- source_word: וִיעוּשׁ וּבְרִיעָה
  choice: sina Jeus at Beria
  rationale: Ginamit ang mga anyong pangalan na angkop sa makabagong baybay at bigkas sa Filipino.
- source_word: לֹא הִרְבּוּ בָנִים
  choice: Hindi nagkaroon ng maraming anak na lalaki
  rationale: Ang literal na “hindi nagparami ng mga anak na lalaki” ay ginawang likas sa Filipino habang pinananatili ang tiyak na panlalaking kahulugan ng בָנִים.
- source_word: וַיִּהְיוּ לְבֵית אָב
  choice: kaya naging iisang angkan ng ama sila
  rationale: Ipinahihiwatig ng pandiwa ang naging kalagayan bunga ng kakaunti nilang mga anak. Ang בֵּית אָב ay teknikal na katawagan sa angkan o sambahayang nakabatay sa ama; “angkan ng ama” ang maikli ngunit malinaw na katumbas.
- source_word: לִפְקֻדָּה אֶחָת
  choice: para sa iisang pagtatala
  rationale: Ang פְּקֻדָּה rito ay may administratibong diwa ng pagbibilang, pagtatala, o pag-uuring yunit, hindi lamang ng atas o gawain.
