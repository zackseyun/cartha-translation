  text: כִּ֣י מַעֲמָדָ֞/ם לְ/יַד בְּנֵ֣י אַהֲרֹ֗ן לַ/עֲבֹדַת֙ בֵּ֣ית יְהוָ֔ה עַל הַ/חֲצֵרוֹת֙ וְ/עַל הַ/לְּשָׁכ֔וֹת וְ/עַֽל טָהֳרַ֖ת לְ/כָל קֹ֑דֶשׁ וּ/מַֽעֲשֵׂ֔ה עֲבֹדַ֖ת בֵּ֥ית הָ/אֱלֹהִֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/028.yaml
  text: For their duty was to assist the sons of Aaron in the service of the house of Yahweh, concerning the courts and the chambers, and the purification of all that is holy, and the work of the service of the house of God.
translation:
  language: tl
  text: Sapagkat ang tungkulin nila[a] ay tumulong[b] sa mga anak ni Aaron sa paglilingkod sa bahay ni Yahweh, sa pangangasiwa ng mga bakuran at mga silid, sa paglilinis ng lahat ng banal na bagay[c], at sa mga gawain ng paglilingkod sa bahay ng Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang nakatalagang puwesto nila” o “ang katungkulan nila.”
    reason: lexical_alternative
  - marker: b
    text: Literal na “sa tabi ng” o “sa kamay ng mga anak ni Aaron”; ipinahihiwatig nito ang paglilingkod bilang mga katuwang nila.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “sa paglilinis ng bawat bagay na banal.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikilala nito ang paliwanag sa pagkatalaga sa mga Levita sa naunang konteksto.
- source_word: מַעֲמָדָם
  choice: ang tungkulin nila
  rationale: Tumutukoy ito sa itinakdang katayuan o gampanin sa paglilingkod; malinaw at likas sa modernong Tagalog ang “tungkulin.”
- source_word: לְיַד בְּנֵי אַהֲרֹן
  choice: tumulong sa mga anak ni Aaron
  rationale: Ang literal na “sa kamay/tabi ng” ay idyomang nagpapahiwatig ng katuwang na paglilingkod, nang hindi ipinipilit ang mas tiyak na ideya ng pamamahala o herarkiya.
- source_word: לַעֲבֹדַת בֵּית יְהוָה
  choice: sa paglilingkod sa bahay ni Yahweh
  rationale: Ang עֲבֹדָה ay tumutukoy sa paglilingkod na kaugnay ng santuwaryo; pinananatili rin ang templong katawagang “bahay” at ang banal na pangalang Yahweh.
- source_word: עַל הַחֲצֵרוֹת וְעַל הַלְּשָׁכוֹת
  choice: kaugnay ng mga bakuran at mga silid
  rationale: Dito, ang עַל ay nagpapakilala ng mga saklaw ng pananagutan. Iniiwasan ng “kaugnay ng” ang labis na pagtukoy na sila ang namamahala sa mga ito.
- source_word: וְעַל טָהֳרַת לְכָל קֹדֶשׁ
  choice: ng paglilinis ng lahat ng banal
  rationale: Pinananatili ang malawak na kolektibong diwa ng קֹדֶשׁ at hindi nililimitahan kung mga bagay lamang o lahat ng itinuturing na banal ang tinutukoy.
- source_word: וּמַעֲשֵׂה עֲבֹדַת בֵּית הָאֱלֹהִים
  choice: at ng mga gawain sa paglilingkod sa bahay ng Diyos
  rationale: Naipapahayag ang magkaugnay na mga ideya ng “gawain” at “paglilingkod” sa natural na Tagalog nang hindi pinapatag ang pormal na pananalita ng Hebreo.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehova
  rationale: Tuwirang ginagamit ng tekstong Hebreo ang Tetragrammaton; pinananatili ng “Yahweh” ang pagkakaiba nito sa titulong “Panginoon.”
- issue: Ugnayan ng mga Levita sa mga anak ni Aaron
  choice: tumulong sa mga anak ni Aaron
  alternative: nasa tabi ng mga anak ni Aaron; nasa ilalim ng pamamahala ng mga anak ni Aaron
  rationale: Ipinahihiwatig ng idyoma ang katuwang na paglilingkod, ngunit hindi nito tahasang tinutukoy ang buong saklaw ng awtoridad; kaya hindi dinaragdagan ng salin ang pahayag tungkol sa herarkiya.
- issue: Saklaw ng לְכָל קֹדֶשׁ
  choice: lahat ng banal
  alternative: bawat banal na bagay
  rationale: Maaaring kolektibo at malawak ang קֹדֶשׁ. Pinananatili ng pangunahing salin ang kalabuan kung ito ay tumutukoy lamang sa mga banal na bagay o sa lahat ng saklaw ng kabanalan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “bakuran” at “silid” bilang natural na katawagan sa mga bahagi ng templo. Pinanatili ang “bahay ni Yahweh/bahay ng Diyos” upang maipakita ang pag-uulit at pagpapalit ng banal na katawagan sa Hebreo.
