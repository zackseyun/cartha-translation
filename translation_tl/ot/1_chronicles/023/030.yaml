  yaml_path: translation/ot/1_chronicles/023/030.yaml
  text: and to stand every morning to give thanks and to praise Yahweh[a], and likewise at evening,
translation:
  language: tl
  text: at tumayo tuwing umaga upang magpasalamat at magpuri kay Yahweh, at gayundin sa gabi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/לַ/עֲמֹד
  choice: at tumayo
  rationale: Pinananatili ang konkretong diwa ng עמד at ang pormal na kalagayan ng paglilingkod; ang anyong pawatas ay nagpapahayag ng tungkuling kaugnay ng naunang konteksto.
- source_word: בַּ/בֹּקֶר בַּ/בֹּקֶר
  choice: tuwing umaga
  rationale: Ang pag-uulit ay distributibo at nagpapahiwatig ng palagian at araw-araw na tungkulin. Likas sa makabagong Tagalog ang “tuwing umaga.”
- source_word: לְ/הֹודוֹת
  choice: upang magpasalamat
  rationale: Sa konteksto ng pagsamba, ang Hiphil ng ידה ay tumutukoy sa pagpapasalamat o pagpupuri, hindi sa pagtatapat.
- source_word: וּ/לְ/הַלֵּל
  choice: at magpuri
  rationale: Tuwirang ipinapahayag ng Piel ng הלל ang pagpuri; hindi idinaragdag ang di-tiyak na ideya ng pag-awit.
- source_word: לַ/יהוָה
  choice: kay Yahweh
  rationale: Isinasalin ang Tetragrammaton bilang pangalang “Yahweh,” ayon sa tahasang anyo ng tekstong Hebreo.
- source_word: וְ/כֵן
  choice: at gayundin
  rationale: Malinaw na iniuugnay nito ang kaparehong tungkulin sa gabi sa ginagawa tuwing umaga.
- source_word: לָ/עָרֶב
  choice: sa gabi
  rationale: Natural at malinaw na panandang pamanahon sa Tagalog para sa katapat na paglilingkod sa gabi.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: ang PANGINOON
  rationale: Pangalan mismo ang nasa tekstong Hebreo; pinananatili ng “Yahweh” ang pagkakakilanlan nito bilang Tetragrammaton sa halip na palitan ng titulo.
translation_notes:
  register: Makabago, natural, at marangal na Filipino. Pinanatili ang “tumayo” bilang konkretong kilos sa pormal na paglilingkod, habang ang Hebreong pag-uulit na “umaga sa umaga” ay likas na ipinahayag bilang “tuwing umaga.”
