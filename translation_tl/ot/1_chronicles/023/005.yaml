base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/005.yaml
  text: and four thousand gatekeepers[a], and four thousand praising Yahweh with the instruments that I made to praise him.
translation:
  language: tl
  text: at apat na libong bantay sa mga pintuang-daan, at apat na libong nagpupuri kay Yahweh sa pamamagitan ng mga instrumentong ginawa ko para sa pagpupuri.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring unawain ang pangwakas na parirala bilang: “mga instrumentong ginawa ko upang magpuri.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: שֹׁעֲרִים
  choice: bantay sa mga pintuang-daan
  rationale: Tumutukoy ito sa mga taong nakatalaga sa mga pasukan. Mas malinaw ang “bantay sa mga pintuang-daan” kaysa simpleng “tagabukas ng pinto,” lalo na sa konteksto ng mga pasukan sa templo.
- source_word: מְהַלְלִים
  choice: nagpupuri
  rationale: Pinananatili ng anyong ito ang diwa ng Hebreong participle na naglalarawan sa patuloy na gawain o tungkulin ng pangkat.
- source_word: לַיהוָה
  choice: kay Yahweh
  rationale: Tuwirang tinutumbasan ng “Yahweh” ang banal na pangalang יהוה at hindi ito pinapalitan ng isang titulo.
- source_word: בַּכֵּלִים
  choice: sa pamamagitan ng mga instrumento
  rationale: Malawak ang kahulugan ng כֵּלִים, ngunit malinaw sa konteksto ng pagpupuri na mga instrumentong ginagamit sa musika ang tinutukoy. Ang “sa pamamagitan ng” ay natural na nagpapahayag ng gamit o paraan.
- source_word: אֲשֶׁר עָשִׂיתִי
  choice: na ginawa ko
  rationale: Tuwirang pinananatili ang unang panauhan at ang ugnayan ng sugnay sa mga instrumento.
- source_word: לְהַלֵּל
  choice: para sa pagpupuri
  rationale: Ipinapahayag nito ang layunin ng mga instrumento nang hindi nagdaragdag ng tahasang layon sa pandiwa, sapagkat walang nakasaad na pronominal na “siya” sa Hebreo.
- source_word: וְאַרְבַּעַת אֲלָפִים ... וְאַרְבַּעַת אֲלָפִים
  choice: at apat na libo ... at apat na libo
  rationale: Pinananatili ang pag-uulit sa Hebreo upang malinaw na maihiwalay at mabigyang-diin ang dalawang pangkat.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יהוה
  choice: Yahweh
  alternative: ang PANGINOON
  rationale: Pangngalang pantangi ang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang tipanang pangalan sa halip na palitan ito ng titulong “PANGINOON.”
- issue: Hindi tahasang layon ng לְהַלֵּל
  choice: para sa pagpupuri
  alternative: upang purihin siya
  rationale: Bagaman natural sa konteksto na si Yahweh ang pinatutungkulan ng papuri, walang tahasang panghalip na “siya” sa pariralang Hebreo. Pinananatili ng pangunahing salin ang anyo at bahagyang pagiging bukas ng orihinal.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “pintuang-daan” upang ipahiwatig ang mga pasukan ng isang malawak na gusali o bakuran, at iniwasan ang mas teknikal o lumang katawagang hindi agad malinaw sa karaniwang mambabasa.
