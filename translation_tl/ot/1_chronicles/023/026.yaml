base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/026.yaml
  text: And also[a], the Levites no longer need to carry the tabernacle and all its utensils for its service.
translation:
  language: tl
  text: At hindi na rin[a] kailangang buhatin ng mga Levita ang tabernakulo at ang lahat ng kagamitan nito para sa paglilingkod dito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “At para sa mga Levita, hindi na kailangang buhatin ang tabernakulo at ang lahat ng kagamitan nito para sa paglilingkod dito.”
    reason: Pinananatili ng alternatibo ang mas literal na pagkakabuo ng לַלְוִיִּם bilang “para sa mga Levita,” sa halip na gawing tagaganap sa sugnay.
lexical_decisions:
- source_word: וְגַם
  choice: At hindi na rin
  rationale: Ang “at” ay nagpapatuloy sa naunang pahayag, at ang “rin” ay naghahatid ng dagdag na diwa ng גַּם. Isinama sa pariralang “hindi na rin” upang maging natural sa modernong Tagalog.
- source_word: לַלְוִיִּם
  choice: ng mga Levita
  rationale: Bagaman literal na minamarkahan ng ל ang mga Levita bilang panig na apektado, sa natural na Tagalog sila ang gumaganap ng pagbubuhat kaya ang “ng mga Levita” ang malinaw na anyo.
- source_word: אֵין לָשֵׂאת
  choice: hindi na kailangang buhatin
  rationale: Sa konteksto ng permanenteng pagkakalagay ng tabernakulo at muling pagsasaayos ng tungkulin ng mga Levita, ipinahihiwatig nito na hindi na kinakailangan ang pagbubuhat, hindi na ipinagbabawal ito.
- source_word: הַמִּשְׁכָּן
  choice: ang tabernakulo
  rationale: Ang “tabernakulo” ang kinikilalang terminong biblikal para sa מִשְׁכָּן sa konteksto ng pagsamba ng Israel.
- source_word: וְאֶת כָּל כֵּלָיו
  choice: at ang lahat ng kagamitan nito
  rationale: Pinananatili ng “at ang lahat” ang tahasang koordinasyon at kabuuang saklaw ng Hebreo; sapat ang malawak na “kagamitan” para sa mga sisidlan, kasangkapan, at iba pang gamit.
- source_word: לַעֲבֹדָתוֹ
  choice: para sa paglilingkod dito
  rationale: Pinananatili nito ang kaugnayan ng mga kagamitan sa paglilingkod sa tabernakulo, na siyang pinakamalapit at likas na tinutukoy ng hulaping panghalip.
theological_decisions:
- issue: Kung ang אֵין לָשֵׂאת ay pagbabawal o kawalan na ng pangangailangan
  choice: hindi na kailangang buhatin
  alternative: hindi dapat buhatin
  rationale: Ang konteksto ay ang pananatili ng tabernakulo at ang pagbabago ng mga tungkuling Levitico; kaya kawalan na ng pangangailangan ang diwa, hindi isang moral o ritwal na pagbabawal.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang nakasanayang terminong biblikal na “tabernakulo,” habang iniwasan ang labis na teknikal o makalumang pananalita.
