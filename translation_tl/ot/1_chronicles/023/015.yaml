  text: Ang mga anak ni Moises ay sina Gersom at Eliezer.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: mga anak ni
  rationale: Ang construct plural ng בֵּן ay nagpapakilala rito ng talaangkanan. Ang “mga anak ni” ang tuwiran at natural na katumbas sa Filipino; hindi kailangang palawakin bilang “mga inapo.”
- source_word: מֹשֶׁה
  choice: Moises
  rationale: Ginamit ang nakaugaliang anyo ng pangalang ito sa makabagong Filipino.
- source_word: גֵּרְשֹׁם
  choice: Gersom
  rationale: Tuwirang transliterasyon sa paraang madaling basahin sa Filipino, habang pinananatiling naiiba sa Gershon, na ibang pangalan sa Hebreo.
- source_word: וֶ/אֱלִיעֶזֶר
  choice: at Eliezer
  rationale: Ang וְ ay payak na pang-ugnay na “at,” at ang אֱלִיעֶזֶר ay isinalin bilang Eliezer upang hindi maipagkamali sa Eleazar, na ibang pangalan.
