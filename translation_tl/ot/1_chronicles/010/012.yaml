revisions:
- from: Kaya tumindig ang lahat ng magigiting na lalaki. Kinuha nila ang bangkay ni Saul at ang mga bangkay ng kanyang mga anak at dinala ang mga iyon sa Jabes.[b] Inilibing nila ang kanilang mga buto sa ilalim ng punong ensina[a] sa Jabes, at nag-ayuno sila nang pitong araw.
  to: Pagkatapos, tumindig ang lahat ng magigiting na lalaki. Binuhat nila ang bangkay ni Saul at ang mga bangkay ng kanyang mga anak at dinala ang mga ito sa Jabes.[b] Inilibing nila ang kanilang mga buto sa ilalim ng punong ensina[a] sa Jabes, at nag-ayuno sila nang pitong araw.
  rationale: 'Pinalitan ang “Kaya” ng “Pagkatapos” upang huwag magdagdag ng ugnayang sanhi na wala sa teksto, at pinalitan ang “Kinuha nila” ng “Binuhat nila” upang maipahayag ang literal at kontekstuwal na kahulugan ng וַיִּשְׂאוּ. Pinanatili ang mga wastong talababa sa punong ensina at sa Jabes. Bagaman hindi tumutugma ang pagkakalagay ng marker a sa ibinigay na English audit text, tama ang pagkakaangkla nito sa Tagalog na salin: ang nilalaman ng talababa a ay tungkol sa אֵלָה, kaya dapat itong nakalagay sa “ensina.”'
