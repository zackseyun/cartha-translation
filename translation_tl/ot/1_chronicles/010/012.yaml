  - severity: low
    issue: Ang “Kaya” ay nagdaragdag ng bahagyang hinuha ng sanhi o bunga.
    rationale: Ang Hebreo ay pangunahing nagsasalaysay ng kasunod na pangyayari (“Then/And”), hindi tahasang nagbibigay ng dahilan. Ang “Pagkatapos” ay mas neutral.
