  source_fidelity: Kailangang iwasto ang “Kinuha nila,” dahil ang וַיִּשְׂאוּ ay tahasang tumutukoy sa pagbubuhat/pagdala ng mga bangkay. Mas tumpak ang “Binuhat nila ... at dinala.” Ang “Kaya” ay maaaring magpahiwatig ng dahilang hindi tahasang isinasaad ng wayyiqtol na sunod-sunod na salaysay; “Pagkatapos” ang mas ligtas na katumbas dito.
  naturalness: Malinaw at marangal ang kabuuang Tagalog. Ang rebisyon ay nagpapanatili ng natural na daloy habang ginagawang mas tiyak ang pisikal na pagkilos. “Punong ensina” at “nag-ayuno sila nang pitong araw” ay likas sa modernong Filipino.
  terminology: Ang “magigiting na lalaki,” “bangkay,” “mga buto,” at “Jabes” ay angkop. Ang “ensina” ay isang katanggap-tanggap na pangunahing salin para sa אֵלָה kung may talababa para sa “terebinto” at sa mas malawak na kawalang-katiyakan sa uri ng puno.
