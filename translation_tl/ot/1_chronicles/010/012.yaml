base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/010/012.yaml
  text: Then all the valiant men arose and carried away the body of Saul and the bodies of his sons[a], and brought them to Jabesh[b]. They buried their bones under the oak in Jabesh and fasted seven days.
translation:
  language: tl
  text: Pagkatapos, tumindig ang lahat ng magigiting na lalaki. Binuhat nila ang bangkay ni Saul at ang mga bangkay ng kanyang mga anak at dinala ang mga ito sa Jabes.[b] Inilibing nila ang kanilang mga buto sa ilalim ng punong ensina[a] sa Jabes, at nag-ayuno sila nang pitong araw.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa ilalim ng punong terebinto.” Ang salitang Hebreo na אֵלָה ay maaaring tumukoy sa isang malaking punongkahoy na gaya ng terebinto o ensina.
    reason: lexical_alternative
  - marker: b
    text: Ipinakikilala sa mas malawak na salaysay ang lugar bilang Jabes-gilead; “Jabes” lamang ang nakasulat dito sa tekstong Hebreo.
    reason: cross_reference
lexical_decisions:
- source_word: כָּל אִישׁ חַיִל
  choice: lahat ng magigiting na lalaki
  rationale: Ang parirala ay tumutukoy sa mga lalaking kilala sa tapang, lakas, at kakayahang militar. Likas at malinaw sa modernong Tagalog ang “magigiting na lalaki.”
- source_word: גּוּפַת ... גּוּפֹת
  choice: ang bangkay ni Saul at ang mga bangkay ng kanyang mga anak
  rationale: Tiyak na tumutukoy ang גּוּפָה sa patay na katawan. Ang “bangkay” ay tuwiran, malinaw, at angkop sa marangal ngunit masaklap na salaysay.
- source_word: וַיִּשְׂאוּ
  choice: kinuha nila
  rationale: Sa konteksto, binuhat at inalis ng mga lalaki ang mga bangkay. Ang “kinuha” ay natural sa Tagalog at saklaw ang pagkuha sa mga ito mula sa kinaroroonan, bagaman ang pisikal na pagbuhat ay ipinahihiwatig ng konteksto.
- source_word: וַיְבִיאוּם יָבֵישָׁה
  choice: dinala ang mga iyon sa Jabes
  rationale: Pinananatili ang pinaikling pangalan ng lugar na nasa talata mismo, sa halip na idagdag sa pangunahing teksto ang “Jabes-gilead.”
- source_word: עַצְמוֹתֵיהֶם
  choice: kanilang mga buto
  rationale: Pinananatili ang kongkretong kahulugan ng עֶצֶם na “buto” sa halip na gawing mas pangkalahatang “mga labi.”
- source_word: תַּחַת הָאֵלָה
  choice: sa ilalim ng punong ensina
  rationale: Ang אֵלָה ay maaaring tumukoy sa ensina o terebinto. Ang “punong ensina” ay maikli at mauunawaan, habang inilalahad sa talababa ang tunay na kawalang-katiyakan sa uri ng puno.
- source_word: וַיָּצֻמוּ שִׁבְעַת יָמִים
  choice: nag-ayuno sila nang pitong araw
  rationale: Tuwiran at natural na salin ng pag-aayuno bilang bahagi ng pagluluksa.
