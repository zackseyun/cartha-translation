revisions:
- from: Sinabi ni Saul sa tagapagdala ng kanyang mga sandata, “Bunutin mo ang iyong espada at saksakin mo ako nito,[a] baka dumating ang mga di-tuling ito[b] at pagmalupitan ako.” Ngunit ayaw gawin iyon ng tagapagdala ng kanyang mga sandata dahil takot na takot siya. Kaya kinuha ni Saul ang espada at bumagsak sa ibabaw nito.
  to: Sinabi ni Saul sa tagapagdala ng kanyang mga sandata, “Bunutin mo ang iyong espada at saksakin mo ako nito,[a] baka dumating ang mga hindi tuli na ito[b] at pagmalupitan ako.” Ngunit ayaw gawin iyon ng tagapagdala ng kanyang mga sandata dahil takot na takot siya. Kaya kinuha ni Saul ang espada at bumagsak sa espada.
  rationale: 'Ginawa ang dalawang ligtas na estilistikong pagwawasto: pinalitan ang “mga di-tuling ito” ng mas likas na “mga hindi tuli na ito,” at ang “bumagsak sa ibabaw nito” ng “bumagsak sa espada.” Hindi binago ang saklaw ng kinatatakutang pagmamalupit o ang hindi espesipikong paraan ng salaysay tungkol sa pagkamatay ni Saul.'
