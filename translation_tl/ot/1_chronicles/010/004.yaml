  text: וַ/יֹּ֣אמֶר שָׁאוּל֩ אֶל נֹשֵׂ֨א כֵלָ֜י/ו שְׁלֹ֥ף חַרְבְּ/ךָ֣ וְ/דָקְרֵ֣/נִי בָ֗/הּ פֶּן יָבֹ֜אוּ הָ/עֲרֵלִ֤ים הָ/אֵ֨לֶּה֙ וְ/הִתְעַלְּלוּ בִ֔/י וְ/לֹ֤א אָבָה֙ נֹשֵׂ֣א כֵלָ֔י/ו כִּ֥י יָרֵ֖א מְאֹ֑ד וַ/יִּקַּ֤ח שָׁאוּל֙ אֶת הַ/חֶ֔רֶב וַ/יִּפֹּ֖ל עָלֶֽי/הָ־׀־־ס־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/010/004.yaml
  text: Then Saul said to his armor-bearer[a], “Draw your sword and thrust me through with it, lest these uncircumcised men come and mistreat me.” But his armor-bearer was not willing, because he was very afraid[c][b]. So Saul took the sword and fell on it.
translation:
  language: tl
  text: Sinabi ni Saul sa tagapagdala ng kanyang mga sandata, “Bunutin mo ang iyong espada at saksakin mo ako nito,[a] baka dumating ang mga hindi tuli na ito[b] at pagmalupitan ako.” Ngunit ayaw gawin iyon ng tagapagdala ng kanyang mga sandata dahil takot na takot siya. Kaya kinuha ni Saul ang espada at bumagsak sa espada.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “itarak mo ito sa akin” o “tagusin mo ako gamit nito.”
    reason: lexical_alternative
  - marker: b
    text: Literal na “mga hindi tuli na ito.”
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹשֵׂא כֵלָיו
  choice: tagapagdala ng kanyang mga sandata
  rationale: Malapit ito sa literal na idyomang Hebreo na tumutukoy sa taong nagdadala ng kagamitang pandigma ni Saul, at mas madaling maunawaan kaysa sa teknikal na hiram na katawagan.
- source_word: שְׁלֹף
  choice: Bunutin
  rationale: Sa konteksto ng espada, likas na tumutukoy ito sa pagbunot ng sandata mula sa kaluban.
- source_word: וְדָקְרֵנִי בָהּ
  choice: at saksakin mo ako nito
  rationale: Ipinahahayag ng דקר ang pagtarak o pagbutas gamit ang sandata. Ang “saksakin” ay natural sa modernong Filipino at hindi nagdaragdag ng paraang wala sa teksto.
- source_word: פֶּן
  choice: baka
  rationale: Natural na ipinakikilala ng “baka” ang kinatatakutang mangyari na nais iwasan ni Saul.
- source_word: הָעֲרֵלִים הָאֵלֶּה
  choice: mga di-tuling ito
  rationale: Pinananatili nito ang tahasang katawagang etniko-relihiyoso ng Hebreo at hindi ipinapalit ang kontekstuwal ngunit hindi tahasang pangalang “mga Filisteo.”
- source_word: וְהִתְעַלְּלוּ בִי
  choice: at pagmalupitan ako
  rationale: 'Malawak ang saklaw ng parirala: maaari itong tumukoy sa marahas, mapanghamak, o mapaglarong pagmamaltrato. Ang “pagmalupitan” ay nagpapanatili sa bigat nang hindi tinutukoy ang eksaktong anyo.'
- source_word: וְלֹא אָבָה
  choice: ayaw gawin iyon
  rationale: Natural nitong ipinahahayag ang kawalan ng pagsang-ayon ng tagapagdala sa iniutos ni Saul.
- source_word: כִּי יָרֵא מְאֹד
  choice: dahil takot na takot siya
  rationale: Malinaw na pinananatili ang dahilan at ang matinding antas ng takot na ipinahahayag ng מְאֹד.
- source_word: וַיִּפֹּל עָלֶיהָ
  choice: bumagsak sa ibabaw nito
  rationale: Direktang sinusundan ang “nahulog/bumagsak sa ibabaw nito” ng Hebreo at iniiwasang dagdagan sa pangunahing teksto ang mas interpretibong “ibinagsak ang sarili.”
theological_decisions:
- issue: Ang eksaktong uri ng kinatatakutang gagawin kay Saul
  choice: pagmalupitan ako
  alternative: paglaruan ako; hamakin ako; tratuhin ako nang kahiya-hiya
  rationale: Ipinahihiwatig ng Hebreo ang mapang-abuso at nakahihiyang pagtrato ngunit hindi nililinaw ang tiyak na anyo nito. Pinananatili ng salin at talababa ang saklaw ng kahulugan nang hindi nag-aangkat ng mas espesipikong pangyayari.
- issue: Paglalarawan sa pagkamatay ni Saul
  choice: bumagsak sa ibabaw nito
  alternative: ibinagsak ang sarili sa ibabaw nito
  rationale: Ang literal na pandiwa ay “bumagsak,” bagaman malinaw sa daloy na sinadya ni Saul ang ginawa. Ang mas tuwirang anyo ay nagpapanatili sa paraan ng pagsasalaysay ng Hebreo.
translation_notes:
  register: Modernong Filipino na tuwiran at marangal. Ginamit ang malinaw na “tagapagdala ng kanyang mga sandata” sa halip na isang bihira o teknikal na katawagan. Ang mga panghalip ay nilinaw lamang kung kailangan upang maging natural ang daloy.
