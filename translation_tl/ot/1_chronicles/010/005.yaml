id: 1CH.10.5
reference: 1 Chronicles 10:5
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יַּ֥רְא נֹשֵֽׂא כֵלָ֖י/ו כִּ֣י מֵ֣ת שָׁא֑וּל וַ/יִּפֹּ֥ל גַּם ה֛וּא עַל הַ/חֶ֖רֶב וַ/יָּמֹֽת־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/010/005.yaml
  text: When his armor-bearer saw that Saul was dead[b][a], he too fell on the sword and died.
translation:
  language: tl
  text: Nang makita ng tagapagdala ng sandata ni Saul[a] na patay na si Saul, nagpatihulog din siya sa tabak[b] at namatay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “ang tagapagdala ng kaniyang mga sandata.”'
    reason: lexical_alternative
  - marker: b
    text: Ang “nagpatihulog sa tabak” ay tumutukoy sa pagpapakamatay sa pamamagitan ng tabak.
    reason: cultural_note
lexical_decisions:
- source_word: נֹשֵׂא כֵלָיו
  choice: tagapagdala ng sandata ni Saul
  rationale: Ipinahahayag nito ang tungkuling militar at ang literal na diwang ‘tagapagdala ng kaniyang mga sandata/kagamitan,’ habang malinaw sa Filipino kung kanino siya naglilingkod.
- source_word: כִּי
  choice: na
  rationale: 'Ipinakikilala nito ang nilalaman ng nakita ng tagapagdala: na patay na si Saul.'
- source_word: מֵת
  choice: patay na
  rationale: Natural itong paglalarawan sa kalagayan ni Saul nang makita siya, nang hindi pinapalitan ng tahasang pandiwang ‘namatay na.’
- source_word: וַיִּפֹּל
  choice: nagpatihulog
  rationale: Pinananatili ang larawan ng pagbagsak sa tabak ngunit ipinahihiwatig din ang kusang pagkilos na malinaw sa konteksto.
- source_word: גַּם הוּא
  choice: din siya
  rationale: 'Pinananatili ang dagdag at paghahambing na puwersa: sinundan din ng tagapagdala si Saul sa kamatayan.'
- source_word: עַל הַחֶרֶב
  choice: sa tabak
  rationale: Hindi dinaragdagan ng pag-aaring ‘kaniyang’ sapagkat artikulong pantukoy lamang ang nasa Hebreo; pinananatili rin ang kongkretong larawan ng idyoma.
- source_word: וַיָּמֹת
  choice: at namatay
  rationale: Tuwirang pinananatili ang maikli at sunod-sunod na daloy ng salaysay at ang naging bunga ng pagkilos.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “tabak” bilang karaniwang salin sa sandatang חֶרֶב at iniwasang idagdag na iyon ay sariling tabak ng tagapagdala, sapagkat hindi ito tahasang sinasabi ng Hebreo.
