base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/010/010.yaml
  text: They put his armor in the house of their gods[b][a], and they fastened his skull in the house of Dagon.
translation:
  language: tl
  text: Inilagay nila ang kanyang mga kagamitang pandigma sa templo ng kanilang mga diyos[a], at ikinabit nila ang kanyang bungo[b] sa templo ni Dagon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “bahay ng kanilang mga diyos.” Sa ganitong konteksto, ang “bahay” ay tumutukoy sa templo.
    reason: lexical_alternative
  - marker: b
    text: O “ulo.” Maaaring tumukoy ang salitang Hebreo sa bungo o sa ulo, ngunit mas tiyak na katumbas dito ang “bungo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשִׂימוּ
  choice: Inilagay nila
  rationale: Ang שׂים ay karaniwang nangangahulugang ilagay o ipuwesto; natural at tuwiran ang “inilagay” sa modernong Tagalog.
- source_word: כֵּלָיו
  choice: ang kanyang mga kagamitang pandigma
  rationale: Malawak ang saklaw ng כְּלִי—kagamitan, kasangkapan, sandata, o baluti. Pinananatili ng “mga kagamitang pandigma” ang lawak ng salita habang nililinaw ang konteksto ng labanan nang hindi ito nililimitahan sa sandata o baluti lamang.
- source_word: בֵּית אֱלֹהֵיהֶם
  choice: sa templo ng kanilang mga diyos[a]
  rationale: Literal na “bahay” ang בַּיִת, ngunit karaniwan itong tumutukoy sa templo sa kontekstong panrelihiyon. Mas malinaw at natural sa Tagalog ang “templo,” habang nasa talababa ang literal na anyo.
- source_word: גֻּלְגָּלְתּוֹ
  choice: ang kanyang bungo[b]
  rationale: Ang גֻּלְגֹּלֶת ay tumutukoy sa bungo at maaari ring gamitin para sa ulo. Mas tiyak sa anyong leksikal at akma sa konteksto ang “bungo,” habang pinananatili sa talababa ang “ulo” bilang posibleng salin.
- source_word: תָקְעוּ
  choice: ikinabit nila
  rationale: Maaaring mangahulugan ang תקע na itarak, ibaon, ipirmi, o ikabit. Ipinahahayag ng “ikinabit” ang paglalagay nito para itanghal nang hindi ipinapalagay ang mas tiyak ngunit di-tiyak na paraan gaya ng pagtuhog.
- source_word: בֵּית דָּגוֹן
  choice: sa templo ni Dagon
  rationale: Bagaman literal na “bahay ni Dagon,” tumutukoy ang parirala sa santuwaryo o templo ng diyos na si Dagon. Natural sa Tagalog ang “templo ni Dagon.”
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “templo” para sa natural na pagkaunawa sa kontekstong panrelihiyon, at “mga kagamitang pandigma” upang mapanatili ang lawak ng salitang Hebreo.
