  source_fidelity: Ang “Mahigpit na tinugis” ay tumpak para sa דבק na may אַחֲרֵי sa konteksto ng labanan at maayos na naipapakita ang matinding pagtugis. Gayunman, ang “Pinatay” ay mas tiyak kaysa sa Hebreong וַיַּכּוּ (“sinaktan/hinampas/pinabagsak; struck down”), kahit na ang kasunod na salaysay ay nagpapatunay ng kanilang pagkamatay. Mas maingat ang “pinabagsak,” na pinananatili ang saklaw ng pandiwa sa kontekstong pandigmaan.
  naturalness: Likas, malinaw, at marangal ang modernong Filipino Tagalog ng talata. Ang pag-uulit ng “mga Filisteo” ay angkop dahil inuulit din ito sa Hebreo. Natural ang “mga anak” at sapat na nililinaw ng mga nakatalang pangalan na mga lalaki ang tinutukoy.
  terminology: Ang “mga Filisteo,” “Saul,” “Jonatan,” “Abinadab,” at “Malki-Sua” ay angkop at pare-pareho ang anyo. Ang “mahigpit na tinugis” at ang talababa ay mahusay na nagsasaad ng idyomatikong puwersa ng pandiwang Hebreo nang hindi isinasalin nang mekanikal.
  issues:
