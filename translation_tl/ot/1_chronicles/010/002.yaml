  text: וַ/יַּדְבְּק֣וּ פְלִשְׁתִּ֔ים אַחֲרֵ֥י שָׁא֖וּל וְ/אַחֲרֵ֣י בָנָ֑י/ו וַ/יַּכּ֣וּ פְלִשְׁתִּ֗ים אֶת יוֹנָתָ֧ן וְ/אֶת אֲבִינָדָ֛ב וְ/אֶת מַלְכִּי שׁ֖וּעַ בְּנֵ֥י שָׁאֽוּל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/010/002.yaml
  text: And the Philistines pursued Saul and his sons[a], and the Philistines struck down Jonathan, Abinadab, and Malchi-shua, the sons of Saul.
translation:
  language: tl
  text: Mahigpit na tinugis ng mga Filisteo si Saul at ang kanyang mga anak[a]. Pinabagsak ng mga Filisteo sina Jonatan, Abinadab, at Malki-Sua, na mga anak ni Saul.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “walang-lubay na tinugis si Saul at ang kanyang mga anak.” Ang pandiwang Hebreo ay literal na may diwang “kumapit” at dito ay naglalarawan ng mahigpit at patuloy na pagtugis sa labanan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּדְבְּקוּ ... אַחֲרֵי
  choice: Mahigpit na tinugis
  rationale: Ang דבק na may אַחֲרֵי sa salaysay ng labanan ay tumutukoy sa walang-lubay at malapitang pagtugis. Likas sa modernong Tagalog ang “mahigpit na tinugis” at naipapahayag nito ang tindi ng kilos.
- source_word: פְלִשְׁתִּים
  choice: mga Filisteo
  rationale: Karaniwang anyong Tagalog para sa pangalan ng bayang ito; pinanatili ang pag-uulit sa ikalawang sugnay gaya ng Hebreo.
- source_word: בָנָיו / בְּנֵי שָׁאוּל
  choice: kanyang mga anak / mga anak ni Saul
  rationale: Mga lalaking anak ang tinutukoy, gaya ng nililinaw ng kasunod na mga pangalan. Sa Tagalog, natural na ginagamit ang “mga anak” nang hindi kailangang idagdag ang “na lalaki.”
- source_word: וַיַּכּוּ
  choice: Pinatay
  rationale: Bagaman malawak ang kahulugan ng נכה na “hampasin,” sa kontekstong ito ng pagkamatay sa labanan, malinaw at likas sa Tagalog ang “pinatay.”
- source_word: יוֹנָתָן
  choice: Jonatan
  rationale: Karaniwang transliterasyong Tagalog ng pangalang Hebreo.
- source_word: אֲבִינָדָב
  choice: Abinadab
  rationale: Karaniwang transliterasyon ng pangalang Hebreo.
- source_word: מַלְכִּי שׁוּעַ
  choice: Malki-Sua
  rationale: Transliterasyong angkop sa baybay at bigkas ng Tagalog; pinanatili ng gitling ang dalawang bahagi ng pangalang Hebreo.
