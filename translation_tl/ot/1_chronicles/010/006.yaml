base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/010/006.yaml
  text: So Saul died[a], and his three sons, and all his house died together.
translation:
  language: tl
  text: Namatay si Saul, ang kaniyang tatlong anak na lalaki, at ang buong sambahayan niya[a]; sama-sama silang namatay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “buong bahay niya.” Maaari itong tumukoy sa sambahayan, pamilya, o angkan, hindi sa isang gusali.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: Sa gayon, namatay
  rationale: Ang wayyiqtol ng מוּת ay nagpapatuloy sa salaysay at dito ay likas na maipahahayag sa Filipino bilang bunga ng naunang pangyayari. Pinananatili ng “namatay” ang payak na kahulugan ng pandiwa.
- source_word: שָׁאוּל
  choice: Saul
  rationale: Ito ang karaniwang anyo ng pangalan sa mga saling Filipino.
- source_word: וּשְׁלֹשֶׁת בָּנָיו
  choice: ang tatlo niyang anak na lalaki
  rationale: Tumutukoy ang pariralang Hebreo sa tatlong anak na lalaki ni Saul na nabanggit na sa konteksto, hindi lamang sa alinmang tatlo sa kaniyang mga anak.
- source_word: וְכָל בֵּיתוֹ
  choice: at ang buo niyang sambahayan[a]
  rationale: Maaaring mangahulugan ang בַּיִת ng bahay, sambahayan, pamilya, o angkan. Likas sa Filipino ang “sambahayan,” habang inilalahad sa talababa ang mas malawak na saklaw ng salitang Hebreo.
- source_word: יַחְדָּו
  choice: sama-sama
  rationale: Tuwirang ipinahahayag nito na magkakasamang namatay ang mga tinutukoy.
- source_word: מֵתוּ
  choice: silang namatay
  rationale: Pinananatili ang pag-uulit ng pandiwang “namatay” sa Hebreo upang maipakita ang diin at kolektibong pangyayari.
theological_decisions:
- issue: Saklaw ng “buo niyang sambahayan”
  choice: Panatilihin ang malawak na diwa ng “bahay” sa pamamagitan ng “sambahayan,” na may talababa tungkol sa “pamilya” at “angkan.”
  alternative: Isalin nang tahasan bilang “buo niyang pamilya” o “buo niyang angkan.”
  rationale: Hindi dapat ipakahulugan ng salin na walang pasubaling namatay ang bawat kamag-anak o lahat ng kabilang sa angkan ni Saul. Ang salitang Hebreo ay may malawak at nababagong saklaw, kaya pinananatili ang tunay na kalabuan nito.
translation_notes:
  register: Gumamit ng makabago, malinaw, at marangal na Filipino. Ang “Sa gayon” ay nagpapakita ng pag-usad at bunga sa salaysay; ang gitling na em ay nagpapalinaw sa inuulit na pangwakas na diin nang hindi inaalis ang estruktura ng Hebreo.
