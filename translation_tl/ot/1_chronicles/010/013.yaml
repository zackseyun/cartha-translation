  text: וַ/יָּ֣מָת שָׁא֗וּל בְּ/מַֽעֲל/וֹ֙ אֲשֶׁ֣ר מָעַ֣ל בַּֽ/יהוָ֔ה עַל דְּבַ֥ר יְהוָ֖ה אֲשֶׁ֣ר לֹא שָׁמָ֑ר וְ/גַם לִ/שְׁא֥וֹל בָּ/א֖וֹב לִ/דְרֽוֹשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/010/013.yaml
  text: So Saul died for his unfaithfulness by which he was unfaithful to Yahweh[a], because of the word of Yahweh, which he did not keep, and also because he asked counsel of a medium[b], to inquire.
translation:
  language: tl
  text: 'Kaya namatay si Saul dahil sa kanyang kawalang-katapatan, sapagkat hindi siya naging tapat kay Yahweh[a]: hindi niya sinunod ang salita ni Yahweh, at sumangguni rin siya sa isang espiritista[b] upang magtanong.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo, inuulit dito ang magkaugnay na pangngalan at pandiwa upang idiin ang kawalang-katapatan ni Saul. Maaari ring isalin: “dahil sa kawalang-katapatan niya—hindi siya naging tapat kay Yahweh.”'
    reason: lexical_alternative
  - marker: b
    text: Ang “espiritista” rito ay isang taong naghahanap ng impormasyon mula sa mga patay o sa mga espiritu; ihambing sa 1 Samuel 28:7.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּמָת
  choice: Kaya namatay
  rationale: Ipinagpapatuloy ng waw-consecutive ang salaysay at, sa konteksto, ipinakikita ang bunga ng mga naunang pangyayari. Likas sa Tagalog ang “Kaya namatay.”
- source_word: בְּמַעֲלוֹ אֲשֶׁר מָעַל
  choice: dahil sa kataksilang ginawa niya
  rationale: Ang pangngalan at pandiwa ay mula sa iisang ugat at tumutukoy sa malubhang kawalang-katapatan, lalo na sa ugnayang tipan. Pinananatili ng “kataksilan” ang bigat nito nang hindi nagiging artipisyal ang pag-uulit sa Tagalog.
- source_word: בַּיהוָה
  choice: kay Yahweh
  rationale: Ang pang-ukol kasama ng מָעַל ay tumutukoy sa Diyos na pinagtaksilan. Ginamit ang personal na pangalang “Yahweh” para sa יהוה.
- source_word: עַל דְּבַר יְהוָה אֲשֶׁר לֹא שָׁמָר
  choice: Hindi niya sinunod ang salita ni Yahweh
  rationale: Ang שָׁמַר dito ay pagtalima o pagsunod sa sinabi o iniutos ni Yahweh. Ang hiwalay na pangungusap ay malinaw at natural sa modernong Tagalog habang ipinapaliwanag ang kataksilan ni Saul.
- source_word: וְגַם לִשְׁאוֹל בָּאוֹב
  choice: at sumangguni rin siya sa isang espiritista
  rationale: Nagdaragdag ito ng ikalawang pagpapakita ng kataksilan. Ang “sumangguni” ay angkop sa paghahanap ng impormasyon o payo, at ang “espiritista” ay nililinaw sa talababa upang maiwasan ang kalabuan.
- source_word: לִדְרֹשׁ
  choice: upang humingi ng patnubay
  rationale: Ipinahahayag ng infinitive ang layunin ng pagsangguni. Mas natural sa Tagalog ang “humingi ng patnubay” kaysa sa paulit-ulit na “magtanong upang magtanong.”
theological_decisions:
- issue: Paglalarawan sa kasalanan ni Saul
  choice: kataksilan
  alternative: paglabag; kawalang-katapatan
  rationale: Ang מַעַל ay higit sa pangkalahatang pagkakasala; ipinakikita nito ang pagtataksil o pagsira ng katapatan kay Yahweh. Hindi nito binabawasan ang dimensiyong pangtipan ng salita.
- issue: Pangalan ng Diyos na יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Tuwirang ginagamit ng Hebreo ang pangalang tipan na יהוה. Pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng titulo.
- issue: Kalikasan ng pagsangguni ni Saul
  choice: sumangguni sa isang espiritista upang humingi ng patnubay
  alternative: nagtanong sa isang médyum upang magsiyasat
  rationale: Ipinahahayag nito ang ipinagbabawal na paghahanap ng kaalaman sa pamamagitan ng taong nakikipag-ugnayan sa mga patay o espiritu, nang hindi nagdaragdag ng detalye na wala sa talata.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Iniwasan ang lipas o sobrang teknikal na pananalita. Hinati sa dalawang pangungusap ang mahabang Hebreong sugnay para sa likas na daloy, habang pinananatili ang ugnayang sanhi at ang dalawang aspekto ng kataksilan ni Saul.
