  text: וַ֠/יִּרְאוּ כָּל אִ֨ישׁ יִשְׂרָאֵ֤ל אֲשֶׁר בָּ/עֵ֨מֶק֙ כִּ֣י נָ֔סוּ וְ/כִי מֵ֖תוּ שָׁא֣וּל וּ/בָנָ֑י/ו וַ/יַּעַזְב֤וּ עָרֵי/הֶם֙ וַ/יָּנֻ֔סוּ וַ/יָּבֹ֣אוּ פְלִשְׁתִּ֔ים וַ/יֵּשְׁב֖וּ בָּ/הֶֽם־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/010/007.yaml
  text: When all the men of Israel who were in the valley saw that they had fled and that Saul and his sons were dead[a], they abandoned their cities and fled[c][b]; then the Philistines came and lived in them.
translation:
  language: tl
  text: Nang makita ng lahat ng lalaking Israelita[b] na nasa lambak[a] na tumakas sila at namatay si Saul at ang kanyang mga anak, iniwan nila ang kanilang mga lungsod at tumakas. Pagkatapos, dumating ang mga Filisteo at tumira[c] sa mga iyon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “kapatagan.”
    reason: lexical_alternative
  - marker: b
    text: 'Tahasang panlalaki ang pananalita ng Hebreo: “lahat ng lalaki ng Israel.”'
    reason: lexical_alternative
  - marker: c
    text: O, “nanirahan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְאוּ
  choice: makita
  rationale: Pinananatili nito ang tuwirang diwa ng pandiwang ראה bilang aktuwal na pagkakita sa kinahinatnan ng labanan, sa halip na ang mas mapagpaliwanag na “mapagtanto.”
- source_word: כָּל אִישׁ יִשְׂרָאֵל
  choice: lahat ng lalaking Israelita
  rationale: Ang אִישׁ ay tahasang panlalaki at may pamahaging diwa pagkatapos ng כָּל. Likas sa makabagong Tagalog ang “lahat ng lalaking Israelita” at hindi nito ginagawang neutral ang pananalita ng Hebreo.
- source_word: אֲשֶׁר בָּעֵמֶק
  choice: na nasa lambak
  rationale: Karaniwang tumutukoy ang עֵמֶק sa lambak; posible rin ang “kapatagan,” kaya inilagay iyon sa talababa.
- source_word: כִּי נָסוּ
  choice: na tumakas sila
  rationale: Hindi tahasang binanggit sa Hebreo ang simuno ng pandiwa. Pinananatili ng “sila” ang pagiging di-tiyak nito sa halip na tukuyin kung sino ang tumakas.
- source_word: וְכִי מֵתוּ שָׁאוּל וּבָנָיו
  choice: at namatay si Saul at ang kanyang mga anak
  rationale: Tuwirang inilalahad ng “namatay” ang kinalabasan na nakita ng mga Israelita at natural ito sa salaysay na Tagalog.
- source_word: וַיַּעַזְבוּ עָרֵיהֶם
  choice: iniwan nila ang kanilang mga lungsod
  rationale: Ipinahihiwatig ng עזב ang pag-iwan sa mga lungsod dahil sa paglikas. Ang “iniwan” ay malinaw at hindi labis na nagpapatingkad kumpara sa posibleng “pinabayaan.”
- source_word: וַיָּנֻסוּ
  choice: at tumakas
  rationale: Ang “tumakas” ang karaniwan at tuwirang katumbas ng נוס sa konteksto ng pagkatalo sa digmaan.
- source_word: וַיָּבֹאוּ פְלִשְׁתִּים
  choice: Pagkatapos, dumating ang mga Filisteo
  rationale: Nililinaw ng “Pagkatapos” ang pagsulong ng magkakasunod na pangyayari na ipinahahayag ng waw-consecutive nang hindi nagdaragdag ng bagong impormasyon.
- source_word: וַיֵּשְׁבוּ בָּהֶם
  choice: at tumira sa mga iyon
  rationale: Malinaw na ipinahahayag ng “tumira” ang paninirahan ng mga Filisteo sa mga iniwang lungsod. Posible rin ang mas tiyak na “nanirahan,” na maaaring magpahiwatig ng pananatili o paninirahan bilang mga bagong residente.
