translation_notes:
  register: Makabago, malinaw, at marangal na salaysay sa Filipino. Pinanatili ang tahasang panlalaking pagtukoy ng Hebreo, ang di-tiyak na simuno ng “tumakas sila,” at ang mga posibleng kahulugan ng mga salitang pangheograpiya at paninirahan sa pamamagitan ng mga talababa.
