base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/010/009.yaml
  text: They stripped him[a], took his head and his weapons, and sent word throughout the land of the Philistines to proclaim the news to their idols and to the people.
translation:
  language: tl
  text: Hinubaran nila siya, kinuha ang kanyang ulo at mga sandata, at nagpadala sila ng balita sa buong lupain ng mga Filisteo upang ipahayag ito sa kanilang mga diyus-diyosan[a] at sa mga tao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga imahen.” Ang salitang Hebreo ay maaaring tumukoy sa mga imahen ng mga diyus-diyosan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּפְשִׁיטֻהוּ
  choice: Hinubaran nila siya
  rationale: Tuwirang ipinahahayag ng pandiwa ang paghuhubad sa kanya; hindi tahasang sinasabi sa sugnay kung kasuotan o baluti ang inalis.
- source_word: וַיִּשְׂאוּ אֶת רֹאשׁוֹ
  choice: kinuha ang kanyang ulo
  rationale: Sa konteksto ng samsam sa digmaan, ipinahihiwatig ng נשא ang pagkuha o pagdadala sa ulo; hindi na idinagdag ang detalye ng pagpugot na hindi tahasang nasa talata.
- source_word: כֵּלָיו
  choice: mga sandata
  rationale: Malawak ang saklaw ng כְּלִי, ngunit sa larangan ng digmaan ang 'mga sandata' ang likas at angkop na katumbas.
- source_word: וַיְשַׁלְּחוּ
  choice: nagpadala sila ng balita
  rationale: Ang pandiwa ay literal na 'nagpadala'; ipinakikita ng kasunod na infinitibo na ang ipinadala o ipinaabot ay balitang ipahahayag, nang hindi nagdaragdag ng tahasang mga mensahero.
- source_word: בְאֶרֶץ פְלִשְׁתִּים סָבִיב
  choice: sa buong lupain ng mga Filisteo
  rationale: Likas na Filipino itong nagpapahayag ng pagpapalaganap sa iba't ibang dako ng teritoryo ng mga Filisteo.
- source_word: לְבַשֵּׂר
  choice: upang ipahayag ito
  rationale: Ang בשר ay tumutukoy sa paghahayag ng balita, dito ay matagumpay na balita para sa mga Filisteo; ang 'ito' ay tumutukoy sa balitang ipinadala.
- source_word: עֲצַבֵּיהֶם
  choice: kanilang mga diyus-diyosan
  rationale: Ang עֶצֶב ay maaaring tumukoy sa imahen o idolo; ang 'diyus-diyosan' ay malinaw, likas, at nagpapanatili sa mapanuring himig ng kontekstong pangkulto.
- source_word: הָעָם
  choice: sa bayan
  rationale: Pinananatili nito ang tiyak at kolektibong anyo ng Hebreo; sa konteksto, tumutukoy ito sa sambayanang Filisteo.
theological_decisions:
- issue: Pagpapakahulugan sa עֲצַבֵּיהֶם sa kontekstong pangkulto
  choice: kanilang mga diyus-diyosan
  alternative: kanilang mga imahen
  rationale: Maaaring tukuyin ng salita ang mga rebultong kumakatawan sa mga diyos. Pinananatili ng 'mga diyus-diyosan' ang negatibong pagtataya ng terminong Hebreo, habang inilalahad sa talababa ang tunay na alternatibong leksikal.
translation_notes:
  register: Modernong Filipino na dignified at madaling maunawaan. Ginamit ang 'Filisteo,' 'sandata,' at 'diyus-diyosan' bilang karaniwang katawagang biblikal. Iniwasang idagdag ang 'mga mensahero' at ang tahasang 'baluti' dahil hindi nakasaad ang mga iyon sa Hebreo.
