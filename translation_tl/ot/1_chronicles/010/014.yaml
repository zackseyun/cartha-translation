  text: וְ/לֹֽא דָרַ֥שׁ בַּֽ/יהוָ֖ה וַ/יְמִיתֵ֑/הוּ וַ/יַּסֵּב֙ אֶת הַ/מְּלוּכָ֔ה לְ/דָוִ֖יד בֶּן יִשָֽׁי־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/010/014.yaml
  text: He did not seek Yahweh[b][a], so he put him to death and turned the kingdom over to David son of Jesse.
translation:
  language: tl
  text: Hindi niya hinanap si Yahweh[a], kaya pinatay siya ni Yahweh at inilipat niya ang paghahari kay David na anak ni Jesse.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sumangguni kay Yahweh” o “humingi ng patnubay kay Yahweh.”
    reason: lexical_alternative
  - marker: b
    text: Ang Hebreo ay maaari ring isaling “ang kaharian” o “ang pagiging hari.”
    reason: lexical_alternative
lexical_decisions:
- source_word: דָרַשׁ בַּיהוָה
  choice: hinanap si Yahweh
  rationale: Ang דָרַשׁ na may ב at banal na layon ay maaaring mangahulugang hanapin, sumangguni, o humingi ng patnubay. Pinananatili ng “hinanap” ang malawak na relasyonal at tipanang diwa, samantalang inilalahad sa talababa ang mas tiyak na kahulugan sa konteksto.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang transliterasyon ng personal na pangalan ng Diyos sa halip na palitan ito ng titulong “PANGINOON.”
- source_word: וַיְמִיתֵהוּ
  choice: pinatay siya ni Yahweh
  rationale: 'Ang Hiphil ng מות ay tahasang nagsasaad ng sanhi: “pinapangyaring mamatay” o “pinatay.” Inulit ang pangalang Yahweh upang luminaw sa natural na Tagalog ang paksa ng pandiwa nang hindi pinahihina ang banal na pagkilos na isinasaad ng Hebreo.'
- source_word: וַיַּסֵּב
  choice: ipinaubaya
  rationale: Ang Hiphil ng סבב dito ay nagpapahiwatig ng paglilipat o pagpapasa ng paghahari sa ibang tao. Natural sa Tagalog ang “ipinaubaya” at pinananatili nito ang aktibong paglilipat.
- source_word: הַמְּלוּכָה
  choice: ang paghahari
  rationale: Sa konteksto, ang מְלוּכָה ay tumutukoy sa pagiging hari o kapangyarihang maghari na inilipat mula kay Saul kay David, hindi lamang sa nasasakupang lupain.
- source_word: לְדָוִיד בֶּן־יִשַׁי
  choice: kay David na anak ni Jesse
  rationale: Ito ang natural at malinaw na makabagong Tagalog para sa Hebreong patronimiko.
theological_decisions:
- issue: Ang pagkilos sa pagkamatay ni Saul
  choice: Tahasan ngunit natural na iniugnay kay Yahweh ang pagpatay kay Saul.
  alternative: Pinahintulutan lamang ni Yahweh na mamatay si Saul.
  rationale: Sa konteksto, si Yahweh ang paksa ng magkakasunod na pandiwa, at ang causative na anyo ng מות ay hindi lamang nagsasaad ng pagpapahintulot. Pinanatili ang tensiyong teolohikal nang hindi nagdaragdag ng paliwanag tungkol sa mga pangalawang sanhi.
- issue: Kahulugan ng הַמְּלוּכָה
  choice: paghahari
  alternative: kaharian
  rationale: Maaaring tumukoy ang salita sa kaharian o sa pagiging hari. Mas angkop dito ang “paghahari” dahil ang royal rule ang ipinasa kay David, ngunit kinikilala sa talababa ang tunay na leksikal na alternatibo.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Inulit ang “Yahweh” sa ikalawang sugnay para maiwasan ang malabong panghalip sa Tagalog. Inilagay ang [a] kaagad sa pariralang tinutukoy nito at ang [b] sa hulihan ng pangungusap upang hindi maputol ang natural na daloy.
