base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/010/001.yaml
  text: The Philistines fought against Israel[a], and the men of Israel fled from before the Philistines and fell slain on Mount Gilboa.
translation:
  language: tl
  text: Nakipaglaban ang mga Filisteo laban sa Israel, at tumakas ang mga lalaki ng Israel[a] palayo sa mga Filisteo at nabuwal na patay sa Bundok Gilboa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, nasa anyong isahan ang pariralang “lalaki ng Israel”; ginagamit ito rito sa kolektibong kahulugan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפְלִשְׁתִּים
  choice: ang mga Filisteo
  rationale: Karaniwang katawagan sa modernong Filipino para sa pangkat na ito; hindi ginawang hiwalay na panimulang salita ang pang-ugnay na ו sapagkat likas nang naipahihiwatig ng daloy ng salaysay.
- source_word: נִלְחֲמוּ בְיִשְׂרָאֵל
  choice: nakipaglaban ... laban sa Israel
  rationale: Ang Niphal ng לחם na may ב ay tumutukoy rito sa pakikipaglaban sa isang kaaway. Nililinaw ng “laban sa” ang salungatang militar at iniiwasan ang posibilidad na unawaing kakampi ang Israel.
- source_word: וַיָּנָס אִישׁ יִשְׂרָאֵל
  choice: tumakas ang mga tauhan ng Israel
  rationale: Bagaman nasa anyong isahan ang אִישׁ, kolektibo ang gamit nito sa konteksto, gaya rin ng kasunod na pandiwang maramihan. Pinananatili ng “mga tauhan” ang pagtukoy sa mga lalaking mandirigma nang hindi nagiging mabigat ang Filipino.
- source_word: מִפְּנֵי פְלִשְׁתִּים
  choice: mula sa harap ng mga Filisteo
  rationale: Pinananatili nito ang larawang nasa idyomang Hebreo na “mula sa harap/presensiya ng,” na tumutukoy sa pag-urong sa harap ng kaaway.
- source_word: וַיִּפְּלוּ חֲלָלִים
  choice: nabuwal silang patay
  rationale: Karaniwang pahayag ito sa konteksto ng labanan. Ang “nabuwal silang patay” ay natural sa Filipino at pinananatili ang parehong larawan ng pagbagsak at ang resultang pagkamatay.
- source_word: בְּהַר גִּלְבֹּעַ
  choice: sa Bundok Gilboa
  rationale: Likas na anyong Filipino para sa pangalang heograpiko at naaangkop sa lokasyon ng labanan.
