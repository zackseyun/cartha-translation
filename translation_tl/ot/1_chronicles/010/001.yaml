  register: Gumamit ng modernong, malinaw, at marangal na Filipino. Pinanatili ang pag-uulit sa “mga Filisteo” at ang larawang “mula sa harap” upang manatiling malapit sa estruktura at imahe ng Hebreo, habang ginawang natural ang kolektibong אִישׁ sa Filipino.
