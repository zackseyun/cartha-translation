base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/010/003.yaml
  text: The battle grew heavy against Saul, and the archers found him, and he was badly wounded by the archers.
translation:
  language: tl
  text: Tumindi ang labanan laban kay Saul. Naabutan siya ng mga mamamana, at nasugatan siya ng mga ito.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “labis siyang nabalisa dahil sa mga mamamana.” Ang pandiwang Hebreo ay maaari ring tumukoy sa matinding paghihirap o pagkabalisa sa halip na pisikal na pagkasugat.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּכְבַּד
  choice: Tumindi
  rationale: Ang כבד ay literal na may diwang “bumigat,” ngunit sa konteksto ng labanan ay tumutukoy sa pagtindi o pag-igting nito. Natural at malinaw sa modernong Tagalog ang “tumindi.”
- source_word: הַמִּלְחָמָה עַל שָׁאוּל
  choice: ang labanan laban kay Saul
  rationale: Ang עַל ay may diwang pagkapoot o pagsalakay rito, kaya ang “laban kay Saul” ang natural na katumbas.
- source_word: וַיִּמְצָאֻהוּ
  choice: Naabutan siya
  rationale: Bagaman karaniwang nangangahulugang “natagpuan,” sa salaysay ng labanan ay ipinahihiwatig ng מצא na narating o naabutan ng mga mamamana si Saul.
- source_word: הַמּוֹרִים בַּקָּשֶׁת
  choice: mga mamamana
  rationale: Ang parirala ay literal na “mga pumapana gamit ang busog”; “mga mamamana” ang maikli at likas na tawag sa Tagalog.
- source_word: וַיָּחֶל
  choice: nasugatan siya
  rationale: Maaaring unawain ang mahirap na pandiwang ito bilang pisikal na pagkasugat o bilang matinding paghihirap at pangamba. Ang “nasugatan” ay angkop sa daloy ng salaysay, habang inilalahad sa talababa ang tunay na alternatibong pagbasa. Hindi idinagdag ang “malubha” dahil walang tahasang katumbas nito sa tekstong Hebreo ng talatang ito.
- source_word: מִן הַיּוֹרִים
  choice: ng mga ito
  rationale: Ang מִן ay nagpapahayag ng pinagmulan o gumagawa ng kilos. Ginamit ang “mga ito” upang maiwasan ang mabigat na pag-uulit ng “mga mamamana,” nang hindi nawawala ang tinutukoy.
theological_decisions:
- issue: Kung pisikal na sugat o matinding dalamhati ang tinutukoy ng וַיָּחֶל
  choice: Isinalin sa pangunahing teksto bilang “nasugatan siya,” na may talababa para sa alternatibong diwa.
  alternative: “Labis siyang nabalisa dahil sa mga mamamana.”
  rationale: Kapuwa may batayan sa anyo at konteksto ng Hebreo. Pinananatili ng talababa ang leksikal na tensiyon sa halip na itago o tuluyang lutasin ito.
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran, marangal, at madaling maunawaan. Ginamit ang “tumindi” sa halip na literal na “bumigat” para sa natural na paglalarawan ng labanan; pinanatili sa talababa ang mahalagang kalabuan ng pandiwang Hebreo.
