  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mga Filisteo” at “Bundok Gilboa” bilang mga natural at pamilyar na anyo. Hiniwalay sa dalawang pangungusap ang sugnay upang maging madaling basahin nang hindi binabago ang pagkakasunod ng mga pangyayari.
