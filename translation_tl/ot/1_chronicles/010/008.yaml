base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/010/008.yaml
  text: It happened on the next day that the Philistines came to strip the slain[b][a], and they found Saul and his sons fallen on Mount Gilboa.
translation:
  language: tl
  text: Nang sumunod na araw[a], dumating ang mga Filisteo upang hubaran ang mga napatay[b]. Natagpuan nila si Saul at ang kanyang mga anak na nakabulagta sa Bundok Gilboa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “nang kinabukasan.”
    reason: lexical_alternative
  - marker: b
    text: Ang “hubaran” dito ay tumutukoy sa pagkuha ng kasuotan, baluti, at iba pang samsam mula sa mga napatay sa labanan.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְהִי מִמָּחֳרָת
  choice: Nang sumunod na araw
  rationale: Natural na panandang temporal sa salaysay para sa araw pagkatapos ng laban; hindi na kailangang isalin nang hiwalay ang pormulang וַיְהִי sa Filipino.
- source_word: לְפַשֵּׁט
  choice: upang hubaran
  rationale: Sa konteksto ng labanan, tumutukoy ito sa pag-aalis ng kasuotan, baluti, at iba pang maaaring samsamin mula sa mga bangkay.
- source_word: הַחֲלָלִים
  choice: ang mga napatay
  rationale: Tumutukoy sa mga napatay sa labanan; mas malinaw at natural kaysa sa mas pangkalahatang “mga patay.”
- source_word: נֹפְלִים
  choice: nakabulagta
  rationale: Pinananatili ang larawan ng mga taong bumagsak at nakahandusay sa larangan ng digmaan, nang hindi tahasang dinaragdagan ang Hebreo ng “patay.”
- source_word: בְּהַר גִּלְבֹּעַ
  choice: sa Bundok Gilboa
  rationale: Karaniwang Filipino na anyo para sa pinangalanang bundok.
