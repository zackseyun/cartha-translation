  text: When all Jabesh-gilead heard all that the Philistines had done to Saul[b][a],
translation:
  language: tl
  text: Nang mabalitaan ng lahat ng taga-Jabes-gilead[a] ang lahat ng ginawa ng mga Filisteo kay Saul[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “buong Jabes-gilead.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “laban kay Saul.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמְעוּ
  choice: Nang mabalitaan
  rationale: Ang waw-consecutive at pandiwang שׁמע ay nagpapatuloy sa salaysay at, sa konteksto, bumubuo ng sugnay na panahunan na humahantong sa kilos sa kasunod na talata. Likas sa Tagalog ang “Nang mabalitaan” para rito.
- source_word: כֹּל יָבֵישׁ גִּלְעָד
  choice: ng lahat ng taga-Jabes-gilead
  rationale: Literal na “buong Jabes-gilead,” ngunit metonimikong tumutukoy sa mga tao ng lugar. Ang “lahat ng taga-” ay malinaw at natural sa modernong Tagalog habang pinananatili ang kabuuang saklaw ng כֹּל.
- source_word: אֵת כָּל אֲשֶׁר
  choice: ang lahat ng
  rationale: Tuwirang ipinahahayag nito ang kabuuan ng mga ginawa at likas ang anyong ito sa Tagalog.
- source_word: עָשׂוּ
  choice: ginawa
  rationale: Nauna na sa pagkarinig ang ginawa ng mga Filisteo. Hindi kailangang lagyan ng hiwalay na aspektong katumbas ng English past perfect sapagkat malinaw na ang ugnayang temporal sa “Nang mabalitaan.”
- source_word: פְלִשְׁתִּים
  choice: mga Filisteo
  rationale: Karaniwang anyong Tagalog para sa pangalan ng pangkat ng mga tao.
- source_word: לְשָׁאוּל
  choice: kay Saul
  rationale: Maaaring tukuyin ng לְ ang taong apektado ng ginawa. Pinananatili ng “kay Saul” ang neutralidad ng Hebreo at hindi nito pinatitindi tungo sa “laban kay Saul.”
