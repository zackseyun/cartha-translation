  text: From the wars and from the spoil they had dedicated things to strengthen the house of Yahweh.
translation:
  language: tl
  text: Mula sa mga digmaan at mula sa mga nasamsam ay nagbukod sila ng mga bagay[a] upang patatagin ang bahay ni Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hindi tahasang binabanggit sa Hebreo ang layon ng pandiwa; idinagdag ang “mga bagay” para sa linaw. Literal: “nagbukod sila.” Maaari ring isalin ang unang bahagi na “Mula sa mga labanan at mula sa mga dinambong.”'
    reason: Nililinaw ang pandagdag na layon sa Tagalog habang pinananatili ang pagkukulang nito sa Hebreo at ang mahahalagang alternatibong leksikal.
lexical_decisions:
- source_word: מִן הַמִּלְחָמוֹת
  choice: Mula sa mga digmaan
  rationale: Ang מִן ay nagpapahiwatig ng pinagmulan, at ang pangmaramihang מִלְחָמוֹת ay likas na maisasalin bilang “mga digmaan”; posible rin ang “mga labanan.”
- source_word: וּמִן הַשָּׁלָל
  choice: at sa mga nasamsam
  rationale: Ang שָׁלָל ay tumutukoy sa mga ari-ariang nakuha sa digmaan. Ang “mga nasamsam” ay malinaw at natural sa makabagong Filipino; posible rin ang “mga dinambong.”
- source_word: הִקְדִּישׁוּ
  choice: nagtalaga sila ng mga bagay
  rationale: Ang Hiphil ng קדשׁ ay nangangahulugang magbukod o magtalaga para sa banal na layunin. Idinagdag ang “mga bagay” upang maging natural sa Filipino, bagaman walang tahasang layon ang Hebreo.
- source_word: לְחַזֵּק
  choice: upang patatagin
  rationale: Pinananatili ng “patatagin” ang pangunahing diwa ng חזק na gawing matibay o malakas, habang maaari rin itong magpahiwatig ng pagsuporta o pagkukumpuni sa kontekstong ito.
- source_word: לְבֵית יְהוָה
  choice: ang bahay ni Yahweh
  rationale: Pinananatili ng “bahay” ang konkretong idyomang Hebreo para sa santuwaryo o templo, at ang pangalang יְהוָה ay isinaling “Yahweh.”
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Tuwirang ginagamit ng teksto ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalang tipan nang hindi ito pinapalitan ng isang titulo.
- issue: Diwa ng pagtatalaga sa הִקְדִּישׁוּ
  choice: nagtalaga
  alternative: naglaan; nagbukod bilang banal
  rationale: Ipinahahayag ng “nagtalaga” na ang mga bagay ay ibinukod para sa gamit ng bahay ni Yahweh, ngunit hindi nito labis na pinalalawak ang maikling pandiwang Hebreo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “bahay ni Yahweh” upang mapanatili ang idyomang Hebreo sa halip na agad itong ipaliwanag bilang “templo.”
