base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/011.yaml
  text: Hilkiah the second[a], Tebaliah the third, Zechariah the fourth. All the sons and brothers of Hosah were thirteen.
translation:
  language: tl
  text: Si Hilkias ang ikalawa, si Tebalias ang ikatlo, at si Zacarias ang ikaapat. Labintatlo lahat ang mga anak na lalaki at mga kapatid[a] ni Hosa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O maaaring “mga kamag-anak na lalaki,” kung mas malawak ang gamit ng salita para sa mga lalaking kamag-anak sa angkan ni Hosa.
    reason: lexical_alternative
lexical_decisions:
- source_word: חִלְקִיָּהוּ
  choice: Hilkias
  rationale: Ginamit ang nakaugaliang anyong Tagalog ng pangalang biblikal.
- source_word: הַשֵּׁנִי
  choice: ang ikalawa
  rationale: Tuwirang ipinapahayag ng ordinal na may pantukoy ang pagkakasunod-sunod sa talaan.
- source_word: טְבַלְיָהוּ
  choice: Tebalias
  rationale: Isinalin sa anyong pangalang natural at kaayon ng nakaugaliang ortograpiyang Tagalog para sa mga pangalang biblikal.
- source_word: הַשְּׁלִשִׁי
  choice: ang ikatlo
  rationale: Pinananatili ang ordinal at ang paralel na ayos ng talaan.
- source_word: זְכַרְיָהוּ
  choice: Zacarias
  rationale: Ginamit ang kilala at nakaugaliang anyong Tagalog ng pangalang biblikal.
- source_word: הָרְבִעִי
  choice: ang ikaapat
  rationale: Tuwirang salin ng ordinal ayon sa pagkakasunod-sunod ng listahan.
- source_word: כָּל
  choice: lahat
  rationale: Likas na salitang panlagom na nagpapakilala sa kabuuang bilang.
- source_word: בָּנִים
  choice: mga anak na lalaki
  rationale: Tiyak na lalaki ang tinutukoy ng Hebreo; mas malinaw ito kaysa sa pangkalahatang 'mga anak.'
- source_word: וְאַחִים
  choice: at mga kapatid
  rationale: Pinananatili ang pangunahing kahulugang 'mga kapatid,' habang inilalahad sa talababa ang posibleng mas malawak na kahulugang kamag-anak na lalaki.
- source_word: לְחֹסָה
  choice: ni Hosa
  rationale: Natural na ipinapahayag sa Tagalog ng panandang 'ni' ang ugnayan kay Hosa.
- source_word: שְׁלֹשָׁה עָשָׂר
  choice: labintatlo
  rationale: Karaniwang anyong Tagalog ng bilang na ibinigay sa Hebreo.
