  naturalness: Marangal at natural ang pangkalahatang Filipino. Mas idiomatiko at mas tumpak sa administratibong diwa ang “may pananagutan sa pangangasiwa sa Israel” kaysa “namahala sa Israel.” Ang “may-kakayahang lalaki” ay mas tuwiran para sa בני חיל sa kontekstong ito kaysa “mahuhusay na lalaki.”
  terminology: Pinanatili ang “PANGINOON” ayon sa ibinigay na kumbensiyon ng proyekto para sa יהוה. Pinanatili rin ang “Hashabias,” “mga Hebronita,” at “paglilingkod sa hari.” Nananatiling nakaangkla ang talababa sa pariralang heograpikal at malinaw nitong ipinapaliwanag ang mas literal na Hebreo.
