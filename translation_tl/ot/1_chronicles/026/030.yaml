base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/030.yaml
  text: 'For the Hebronites: Hashabiah and his brothers[a], 1,700 capable men, were in charge of the oversight of Israel west of the Jordan, for all the work of the LORD and for the service of the king.'
translation:
  language: tl
  text: 'Sa mga Hebronita: si Hashabias at ang kanyang mga kapatid, 1,700 may-kakayahang lalaki, ang may pananagutan sa pangangasiwa sa Israel sa kanluran ng Jordan[a], para sa lahat ng gawain ng PANGINOON at sa paglilingkod sa hari.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “mula sa kabilang panig ng Jordan, pakanluran,” na tumutukoy sa kanlurang panig ng Jordan.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַחֶבְרוֹנִי
  choice: Sa mga Hebronita
  rationale: Tumutukoy ito sa angkan o pangkat ng mga Levitang Hebronita, hindi lamang sa isang tao.
- source_word: חֲשַׁבְיָהוּ
  choice: Hashabias
  rationale: Ginamit ang karaniwang anyong Filipino ng pangalang biblikal.
- source_word: וְאֶחָיו
  choice: at ang kanyang mga kapatid
  rationale: Pinanatili ang tuwirang kahulugang pampamilya, bagaman maaari rin itong tumukoy sa mas malawak na mga kaanak sa konteksto ng angkan.
- source_word: בְּנֵי חַיִל
  choice: mahuhusay na lalaki
  rationale: Sa kontekstong administratibo, ipinahihiwatig ng parirala ang kakayahan at pagiging maaasahan, hindi kinakailangang kagitingang militar.
- source_word: אֶלֶף וּשְׁבַע מֵאוֹת
  choice: 1,700
  rationale: Malinaw at karaniwang modernong pagsulat ng bilang.
- source_word: עַל פְּקֻדַּת יִשְׂרָאֵל
  choice: ang namahala sa Israel
  rationale: Ipinapahayag ang pananagutan sa pangangasiwa o pamamahala nang hindi nagdaragdag ng makabagong kategoryang burukratiko.
- source_word: מֵעֵבֶר לַיַּרְדֵּן מַעְרָבָה
  choice: sa kanluran ng Jordan
  rationale: Ito ang natural at malinaw na Filipino para sa pook na tinutukoy; inilagay sa talababa ang mas literal na anyo.
- source_word: לְכֹל מְלֶאכֶת יְהוָה
  choice: para sa lahat ng gawain ng PANGINOON
  rationale: Pinananatili ang malawak na saklaw ng mga tungkuling nauukol sa banal na paglilingkod.
- source_word: יְהוָה
  choice: PANGINOON
  rationale: Sinusunod ang pinakahuling ibinigay na kumbensiyon ng proyekto para sa Tetragrammaton.
- source_word: וְלַעֲבֹדַת הַמֶּלֶךְ
  choice: at sa paglilingkod sa hari
  rationale: Pinananatili ang pagkakaiba ng mga tungkuling nauukol sa PANGINOON at sa hari.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יהוה
  choice: PANGINOON
  alternative: Yahweh
  rationale: Ginamit ang pamalit na pamagat ayon sa pinakahuling realignment ng proyekto, habang kinikilalang ang Hebreo ay mismong Tetragrammaton.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang em dash upang malinaw na iugnay ang bilang at paglalarawan kay Hashabias at sa kanyang mga kapatid; inilagay ang talababa sa pariralang heograpikal na aktuwal nitong ipinapaliwanag.
