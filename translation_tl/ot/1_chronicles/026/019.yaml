  text: These were the divisions of the gatekeepers for the sons of the Korahites and for the sons of Merari[a].
translation:
  language: tl
  text: Ito ang mga pangkat ng mga bantay ng mga pintuan na kabilang sa mga anak ni Korah at sa mga anak ni Merari.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵלֶּה
  choice: Ito ang
  rationale: Ang maramihang panturo ay nagpapakilala ng buod ng naunang talaan. Walang tahasang pandiwa sa Hebreo; likas sa Filipino ang “Ito ang” at hindi nito ipinipilit kung pangkasalukuyan o pangnagdaan ang diwa.
- source_word: מַחְלְקוֹת
  choice: mga pangkat
  rationale: Tumutukoy ito sa organisadong mga dibisyon o pangkat na may nakatalagang paglilingkod. Mas karaniwan at malinaw sa modernong Filipino ang “mga pangkat” kaysa “mga dibisyon” sa kontekstong ito.
- source_word: הַשֹּׁעֲרִים
  choice: mga bantay ng pintuang-daan
  rationale: Ang salita ay tumutukoy sa mga taong nagbabantay sa mga pasukan. Nililinaw ng “pintuang-daan” na mga tarangkahan o pasukan ng templo ang tinutukoy, hindi karaniwang pinto lamang.
- source_word: לִבְנֵי הַקָּרְחִי
  choice: mula sa mga anak ni Korah
  rationale: Ang לְ ay nagpapahiwatig ng kaugnayan o paglalaan ng mga pangkat sa angkan. Ang “mula sa” ay natural sa Filipino para tukuyin ang pinagmulan sa angkan, habang pinananatili ng “mga anak ni Korah” ang anyo ng Hebreo.
- source_word: וְלִבְנֵי מְרָרִי
  choice: at sa mga anak ni Merari
  rationale: Pinananatili ang tahasang pariralang “mga anak ni Merari” at ang paralelismo ng Hebreo, sa halip na paikliin bilang pangalan ng angkan.
