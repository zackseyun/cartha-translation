translation_notes:
  register: Modernong Filipino na payak ngunit marangal. Pinanatili ang pormulang pang-angkan na “mga anak ni,” at iniwasan ang mas teknikal na “mga dibisyon” at ang di-likas na literalismong “mga tagapagbantay ng pintuan.”
