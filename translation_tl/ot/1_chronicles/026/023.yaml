  text: For the Amramites[a], the Izharites, the Hebronites, and the Uzzielites.
translation:
  language: tl
  text: Para sa mga angkan nina Amram[a], Izhar, Hebron, at Uziel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Tungkol sa mga angkan nina Amram, Izhar, Hebron, at Uziel.” Sa Hebreo, apat lamang itong katawagang pangangkan na may pang-ukol na ל at nagsisilbing pamagat ng isang talaan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לַעַמְרָמִי
  choice: Para sa mga angkan ni Amram
  rationale: Ang prefiks na ל at ang anyong pangangkan ay nagsisilbing panimula ng isang talaan. Likas sa modernong Tagalog ang “Para sa,” habang malinaw na ipinapakita ng “mga angkan ni Amram” na pangkat ng mga inapo ang tinutukoy.
- source_word: לַיִּצְהָרִי
  choice: ni Izhar
  rationale: Kasunod ito ng pinagsasaluhang pariralang “mga angkan,” kaya ang maikling “ni Izhar” ay malinaw at hindi paulit-ulit.
- source_word: לַחֶבְרוֹנִי
  choice: ni Hebron
  rationale: Pinananatili ang anyong pangalan at ang pare-parehong estruktura ng listahan; tumutukoy ito sa angkan na nagmula kay Hebron.
- source_word: לָעָזִּיאֵלִי
  choice: at ni Uziel
  rationale: Ang “at” ay likas na idinagdag upang wakasan ang listahan. Ang “Uziel” ay tuwirang transliterasyon ng pangalang pinagmulan ng angkan.
