  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mga angkan ni” sa halip na mga hiniram na katawagang gaya ng “Amramita” upang madaling maunawaan ng karaniwang mambabasa, habang pinananatili ang maikli at heading-like na anyo ng Hebreo.
