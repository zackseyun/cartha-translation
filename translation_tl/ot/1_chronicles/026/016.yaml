base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/016.yaml
  text: For Shuppim and Hosah[a], the lot fell to the west, with the Gate of Shallecheth on the ascending highway, guard corresponding to guard.
translation:
  language: tl
  text: Para kina Shupim at Hosa, ang nabunot ay sa kanluran, kasama ang Tarangkahan ng Shaleketh[a] sa lansangang paakyat—bantay na katapat ng bantay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O maaaring “Tarangkahan ng Pagtatapon.” Malamang na pantanging pangalan ng tarangkahan ang “Shaleketh,” na nagmula sa pandiwang nangangahulugang “itapon” o “ihagis pababa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לְשֻׁפִּים וּלְחֹסָה
  choice: Para kina Shupim at Hosa
  rationale: Ipinahahayag ng ל ang pagtatalaga sa konteksto ng palabunutan. Ang “para kina” ay likas sa modernong Tagalog at angkop sa dalawang pangalan ng tao.
- source_word: לַמַּעֲרָב
  choice: sa kanluran
  rationale: Tumutukoy ito sa kanlurang panig na naitalaga; malinaw at natural ang “sa kanluran.”
- source_word: עִם
  choice: kasama ang
  rationale: Pinananatili nito ang payak na ugnayan ng nakatalagang lugar sa kasunod na palatandaan.
- source_word: שַׁעַר שַׁלֶּכֶת
  choice: ang Tarangkahan ng Shaleketh
  rationale: Malamang na pantanging pangalan ng tarangkahan ang שַׁלֶּכֶת, kaya isinalin lamang sa baybay-Filipino sa pangunahing teksto at inilagay sa talababa ang posibleng kahulugan nito.
- source_word: בַּמְסִלָּה הָעוֹלָה
  choice: sa lansangang paakyat
  rationale: Ang מְסִלָּה ay isang ginawang lansangan o daang mataas, at inilalarawan ng הָעוֹלָה na ito ay paakyat. Ang parirala ay natural at pinananatili ang topograpikong diwa.
- source_word: מִשְׁמָר לְעֻמַּת מִשְׁמָר
  choice: bantay na katapat ng bantay
  rationale: Pinananatili ang maikli at bahagyang malabong anyo ng Hebreo. Ang “katapat” ay maaaring tumukoy sa pagkakaharap o pagtutugma ng mga bantay nang hindi ipinahihiwatig na magkalaban sila.
theological_decisions: []
translation_notes:
  register: Gumamit ng makabago ngunit marangal na Filipino. Idinagdag ang “ang nabunot ay” bilang likas na pagpuno sa elipsis ng Hebreo ayon sa konteksto ng pamamahagi sa pamamagitan ng palabunutan. Pinanatiling maikli ang hulihang parirala upang hindi labis na tukuyin kung mga tao, pangkat, oras ng pagbabantay, o mga himpilan ang tinutukoy.
