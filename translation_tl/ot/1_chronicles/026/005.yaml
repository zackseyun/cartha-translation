  text: עַמִּיאֵ֤ל הַ/שִּׁשִּׁי֙ יִשָׂשכָ֣ר הַ/שְּׁבִיעִ֔י פְּעֻלְּתַ֖י הַ/שְּׁמִינִ֑י כִּ֥י בֵרֲכ֖/וֹ אֱלֹהִֽים׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/005.yaml
  text: Ammiel the sixth[a], Issachar the seventh, Peullethai the eighth; for God had blessed him.
translation:
  language: tl
  text: Si Amiel ang ikaanim, si Isacar ang ikapito, at si Peuletai ang ikawalo, sapagkat pinagpala siya ng Diyos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “dahil pinagpala siya ng Diyos.” Sa konteksto, malamang na si Obed-Edom ang tinutukoy ng “siya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עַמִּיאֵל
  choice: Amiel
  rationale: Pangalan ng tao; ginamit ang anyong transliterasyon na natural sa Filipino.
- source_word: הַשִּׁשִּׁי
  choice: ang ikaanim
  rationale: Ordinal na may pantukoy at nagpapatuloy sa pagkakasunod-sunod ng mga anak.
- source_word: יִשָׂשכָר
  choice: Isacar
  rationale: Pangalan ng isang anak sa kontekstong ito; ginamit ang kinagawiang anyong Filipino.
- source_word: הַשְּׁבִיעִי
  choice: ang ikapito
  rationale: Ordinal na kaagapay ng ibang bilang sa talaan.
- source_word: פְּעֻלְּתַי
  choice: Peuletai
  rationale: Transliterasyon ng pangalang pantangi na sumusunod sa Hebreong pagbigkas at natural basahin sa Filipino.
- source_word: הַשְּׁמִינִי
  choice: ang ikawalo
  rationale: Ordinal na nagtatapos sa pagkakasunod-sunod sa talata.
- source_word: כִּי
  choice: sapagkat
  rationale: Nagpapakilala sa paliwanag kung bakit marami ang mga anak; pinananatili ang tahasang ugnayang sanhi.
- source_word: בֵרֲכוֹ
  choice: pinagpala siya
  rationale: Ang pandiwang ברך na may hulaping ikatlong panauhang panlalaki ay tumutukoy, ayon sa konteksto, kay Obed-Edom. Hindi kinakailangang gawing past perfect sa Filipino.
- source_word: אֱלֹהִים
  choice: Diyos
  rationale: Karaniwang tawag sa Diyos; isahan ang diwa ayon sa pandiwa at konteksto.
theological_decisions:
- issue: Tinutukoy ng panghalip sa “pinagpala siya”
  choice: Si Obed-Edom, ang ama sa kagyat na konteksto
  alternative: Ang sambahayan o angkan niya sa mas pangkalahatang diwa
  rationale: Inililista sa 1 Cronica 26:4–8 ang mga anak at inapo ni Obed-Edom, kaya pinakamalamang na ang pagpapala ng Diyos sa kanya ang paliwanag sa dami ng mga anak. Hindi pinalitan ng pangalan ang panghalip sa pangunahing teksto upang mapanatili ang anyo at kaunting kalabuan ng Hebreo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “sapagkat” upang ipakita ang paliwanag na hatid ng כִּי, habang pinanatili ang panghalip sa halip na tahasang ipalit ang pangalang Obed-Edom.
