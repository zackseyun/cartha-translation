base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/010.yaml
  text: 'And Hosah[a], from the sons of Merari, had sons: Shimri the chief, though he was not the firstborn; his father made him chief.'
translation:
  language: tl
  text: 'At si Hosa, mula sa angkan ni Merari, ay may mga anak na lalaki: si Simri ang pinuno, bagaman hindi siya ang panganay.[a] Ginawa siyang pinuno ng kanyang ama.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sapagkat hindi siya ang panganay”; ang pang-ugnay sa Hebreo ay maaari ring unawain bilang nagpapaliwanag, at hindi lamang bilang nagsasaad ng pagsalungat.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְחֹסָה
  choice: At si Hosa
  rationale: Iniuugnay ng וּ ang pahayag sa naunang talaan, samantalang ang לְ sa kontekstong genealogical ay natural na ipinahahayag sa Filipino sa pamamagitan ng pagpakilala kay Hosa bilang siyang may mga anak.
- source_word: מִן בְּנֵי מְרָרִי
  choice: na mula sa mga anak ni Merari
  rationale: Pinananatili nito ang literal na pagkakaugnay ni Hosa sa angkan ni Merari nang hindi ito ginagawang pang-uri.
- source_word: בָּנִים
  choice: ay may mga anak na lalaki
  rationale: Bagaman nominal lamang ang Hebreo na 'mga anak na lalaki,' kailangan ng pandiwang panugnay sa natural na Filipino. Nililinaw ng 'lalaki' ang panlalaking anyong maramihan sa pinagmulan.
- source_word: שִׁמְרִי
  choice: Simri
  rationale: Isinatinig ang personal na pangalan ayon sa karaniwang anyong Filipino.
- source_word: הָרֹאשׁ
  choice: ang pinuno
  rationale: Ang רֹאשׁ dito ay tumutukoy sa ranggo o pamumuno sa pamilya, hindi sa literal na bahagi ng katawan.
- source_word: כִּי לֹא הָיָה בְכוֹר
  choice: bagaman hindi siya ang panganay
  rationale: Ipinahahayag ng 'bagaman' ang maliwanag na pagsalungat sa pagiging pinuno ni Simri kahit hindi siya ang panganay. Dahil maaari ring maging paliwanag ang כִּי, itinatala sa talababa ang alternatibo.
- source_word: וַיְשִׂימֵהוּ אָבִיהוּ לְרֹאשׁ
  choice: ginawa siyang pinuno ng kanyang ama
  rationale: Ang שׂים na may לְ ay nagpapahiwatig ng pagtatalaga sa katungkulan. Inuulit ang 'pinuno' upang mapanatili ang leksikal na ugnayan sa naunang הָרֹאשׁ.
