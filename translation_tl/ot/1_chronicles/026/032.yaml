    rationale: Dahil panlalaki ang anyo sa Hebreo at ang alternatibo ay saklaw ng mga lalaking kamag-anak sa kontekstong pangangkan, makatutulong ang “mga lalaking kamag-anak” upang hindi lumawak nang di-kailangan ang tinutukoy.
