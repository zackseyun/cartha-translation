base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/032.yaml
  text: And his brothers[a], valiant men, were two thousand seven hundred heads of fathers’ houses; and King David appointed them over the Reubenites, the Gadites, and the half-tribe of Manasseh for every matter of God and of the king.
translation:
  language: tl
  text: Ang mga kapatid[a] niyang lalaki—mga lalaking may kakayahan—ay 2,700 pinuno ng mga sambahayan ng kanilang angkan. Inatasan sila ni Haring David na mamahala sa mga Rubenita, mga Gadita, at kalahating lipi ni Manases sa bawat usapin ng Diyos at ng hari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga lalaking kamag-anak.”
    reason: Maaaring gamitin ang אחים para sa mga kapatid na lalaki o, sa kontekstong pangangkan, sa mas malawak na pangkat ng mga lalaking kamag-anak.
lexical_decisions:
- source_word: וְאֶחָיו
  choice: Ang mga kapatid niyang lalaki
  rationale: Tumutukoy ang hulapi kay Hashabias sa naunang talata. Pangunahing kahulugan ng אחים ang mga kapatid na lalaki, bagaman maaari rin itong tumukoy nang mas malawak sa mga lalaking kamag-anak sa loob ng angkan; pinanatili sa talababa ang posibilidad na iyon.
- source_word: בְּנֵי חַיִל
  choice: mga lalaking may kakayahan
  rationale: Maaaring magpahiwatig ang parirala ng lakas, kagitingan, o husay. Dahil tungkuling pangangasiwa ang konteksto, likas at sapat na malawak ang “may kakayahan” nang hindi nililimitahan ang diwa sa tapang sa digmaan.
- source_word: אַלְפַּיִם וּשְׁבַע מֵאוֹת
  choice: 2,700
  rationale: Tuwirang paglalahad ng bilang sa paraang madaling basahin sa modernong Filipino.
- source_word: רָאשֵׁי הָאָבוֹת
  choice: pinuno ng mga sambahayan ng kanilang mga ninuno
  rationale: Teknikal na pariralang tumutukoy sa mga pinuno ng mga yunit na pampamilya o pangangkan. Pinananatili ng salin ang konsepto ng sambahayang nagmula sa mga ninuno habang nagiging malinaw sa modernong mambabasa.
- source_word: וַיַּפְקִידֵם
  choice: Inatasan sila
  rationale: Sa Hiphil, ipinahihiwatig ng פקד ang opisyal na pagtatalaga o pagbibigay ng pananagutan. Ang “inatasan” ay natural at angkop sa konteksto ng pamamahala.
- source_word: עַל
  choice: na mamahala sa
  rationale: Sa kontekstong ito, minamarkahan ng עַל ang awtoridad o pananagutan sa mga grupong binanggit. Mas natural sa Filipino ang “mamahala sa” kaysa literal na “sa ibabaw ng.”
- source_word: הָראוּבֵנִי וְהַגָּדִי וַחֲצִי שֵׁבֶט הַמְנַשִּׁי
  choice: mga Rubenita, mga Gadita, at sa kalahating lipi ni Manases
  rationale: Bagaman nasa anyong isahan ang mga gentiliko sa Hebreo, kolektibo ang tinutukoy kaya ginamit ang pangmaramihang anyo sa Filipino.
- source_word: לְכָל דְּבַר הָאֱלֹהִים וּדְבַר הַמֶּלֶךְ
  choice: tungkol sa bawat gawain ng Diyos at ng hari
  rationale: Ang דָּבָר ay maaaring mangahulugang usapin, gawain, o kapakanan. Ang “gawain” ay natural sa Filipino at pinananatili ang magkatapat na larangan ng pananagutang may kaugnayan sa Diyos at sa hari nang hindi dinaragdagan ang detalye.
theological_decisions:
- issue: Saklaw ng pananagutan kaugnay ng Diyos at ng hari
  choice: May pananagutan sila sa bawat gawaing nauukol sa Diyos at sa hari.
  alternative: Maaaring isalin bilang “sa lahat ng usapin ng Diyos at sa gawain ng hari.”
  rationale: Malinaw na itinatambal ng Hebreo ang dalawang larangan ngunit hindi nito ipinapaliwanag ang eksaktong hangganan o ugnayan ng mga iyon. Iniwasang ipasok ang mga huling konsepto tungkol sa paghihiwalay ng relihiyon at pamahalaan.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “sambahayan ng kanilang mga ninuno” para sa teknikal na estrukturang pangangkan, at ang “mga lalaking may kakayahan” upang mapanatili ang lawak ng בְּנֵי חַיִל sa kontekstong administratibo.
