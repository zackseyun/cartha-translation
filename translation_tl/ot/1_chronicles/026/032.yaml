  verdict: revise
  source_fidelity: Tumpak ang pagtukoy sa mga kapatid ni Hashabias, ang bilang, ang mga pangkat na sakop, at ang pagtatalaga ni David. Gayunman, ang “tungkol sa bawat gawain” ay hindi sapat na naihahayag ang administratibong saklaw ng לְכָל דְּבַר (“sa bawat usapin/kapakanan”).
  naturalness: Marangal at malinaw ang pangkalahatang Filipino. Mas natural at mas malapit sa teknikal na kahulugan ng רָאשֵׁי הָאָבוֹת ang “mga pinuno ng mga sambahayan ng kanilang angkan” kaysa “mga sambahayan ng kanilang mga ninuno.”
  terminology: Ang “mga lalaking may kakayahan” ay katanggap-tanggap para sa בְּנֵי־חַיִל sa kontekstong administratibo. Ang “usapin ng Diyos at ng hari” ay pinananatili ang magkatapat na konstruksyon at hindi ipinapalagay ang mas tiyak na uri ng gawain.
