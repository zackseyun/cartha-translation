base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/020.yaml
  text: And of the Levites[b][a], Ahijah was over the treasuries of the house of God and the treasuries of the holy things.
translation:
  language: tl
  text: At sa mga Levita,[a] si Ahias ang namahala sa mga kabang-yaman ng bahay ng Diyos at sa mga kabang-yaman ng mga banal na bagay.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin, “At tungkol sa mga Levita: si Ahias ang namahala sa …” Bahagyang putol ang panimulang Hebreo at maaaring nagsisilbing paglipat na tulad ng isang pamagat.'
    reason: alternative_reading
  - marker: b
    text: Ang “mga banal na bagay” ay maaari ring isaling “mga bagay na itinalaga” o “mga bagay na inilaan,” na tumutukoy sa mga bagay na ibinukod para sa sagradong gamit.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַלְוִיִּם
  choice: At sa mga Levita
  rationale: Pinananatili ang bahagyang putol at panimulang-paksang anyo ng Hebreo. Maaaring ipakilala nito ang susunod na tungkulin ng isang Levita, sa halip na gawing payak na maramihang simuno ang “mga Levita.”
- source_word: אֲחִיָּה
  choice: Ahias
  rationale: Ginamit ang likas na anyong Filipino ng pangalang Hebreo, na tumutugma sa bigkas at sa nakaugaliang pag-aangkop ng mga pangalang biblikal sa Tagalog.
- source_word: עַל
  choice: ang namahala sa
  rationale: Sa kontekstong pang-administrasyon, ipinahihiwatig ng עַל ang pangangasiwa o pananagutan. Malinaw at natural sa modernong Tagalog ang “namahala sa.”
- source_word: אֹצְרוֹת
  choice: mga kabang-yaman
  rationale: Tumutukoy ang salita sa mga imbakan o kalipunan ng mahahalagang bagay at panustos. Ang “kabang-yaman” ay angkop sa konteksto ng bahay ng Diyos at pinananatili ang institusyonal na diwa ng salita.
- source_word: בֵּית הָאֱלֹהִים
  choice: bahay ng Diyos
  rationale: Tuwirang katumbas ito ng pariralang Hebreo. Bagaman tumutukoy sa santuwaryo o templo, hindi kailangang palitan ng mas interpretibong “templo ng Diyos.”
- source_word: וּלְאֹצְרוֹת
  choice: at sa mga kabang-yaman
  rationale: Inuugnay ng לְ ang ikalawang pangkat ng mga kabang-yaman sa saklaw ng pangangasiwa ni Ahias. Ang pag-uulit ng “sa” ay nagpapalinaw sa ugnayan sa Tagalog.
- source_word: הַקֳּדָשִׁים
  choice: mga banal na bagay
  rationale: Tuwirang ipinapahayag nito ang mga bagay na ibinukod bilang banal. Hindi nito nililimitahan ang kahulugan sa mga handog lamang, sapagkat maaaring kabilang ang iba pang mga bagay na itinalaga para sa sagradong gamit.
