translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang “bahay ng Diyos” at “mga banal na bagay” upang manatiling malapit sa Hebreo, habang ginamit ang “namahala sa” para sa likas na pagpapahayag ng tungkuling administratibo. Ang bahagyang elipsis sa simula ay pinanatili at ipinaliwanag sa talababa.
