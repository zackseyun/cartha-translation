base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/004.yaml
  text: 'And Obed-edom had sons: Shemaiah the firstborn[a], Jehozabad the second, Joah the third, and Sakar the fourth[b], and Nethanel the fifth.'
translation:
  language: tl
  text: At ang mga anak ni Obed-edom ay sina Semaias na panganay[a], Jehozabad na ikalawa, Joa na ikatlo, Sakar na ikaapat[b], at Netanel na ikalima.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “At kay Obed-edom, mga anak”; inayos sa likas na pormang Tagalog bilang “ang mga anak ni Obed-edom ay.”
    reason: lexical_alternative
  - marker: b
    text: Ang pangalang “Sakar” dito ay iba sa “Isacar” ayon sa anyong Hebreo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/עֹבֵד אֱדֹם בָּנִים
  choice: At ang mga anak ni Obed-edom ay
  rationale: Ang Hebreo ay isang eliptikong pormulang talaangkanan, literal na ‘at kay Obed-edom, mga anak.’ Ginawang likas sa Tagalog ang pagkakabuo nang hindi nagdaragdag ng ideyang wala sa teksto.
- source_word: שְׁמַעְיָה
  choice: Semaias
  rationale: Ginamit ang nakaugaliang anyong Filipino ng pangalang Hebreo.
- source_word: הַ/בְּכוֹר
  choice: na panganay
  rationale: Pinananatili ng ‘panganay’ ang diwang pampamilya ng בכור, hindi lamang ang pagkakasunod na ‘una.’
- source_word: יְהוֹזָבָד
  choice: Jehozabad
  rationale: Tuwirang transliterasyon ng personal na pangalan, na angkop sa makabagong Filipino.
- source_word: הַ/שֵּׁנִי ... הַ/שְּׁלִשִׁי ... הָ/רְבִיעִי ... הַ/חֲמִישִׁי
  choice: na ikalawa ... na ikatlo ... na ikaapat ... na ikalima
  rationale: Tuwirang isinalin ang mga ordinal na tumutukoy sa pagkakasunod ng mga anak.
- source_word: יוֹאָח
  choice: Joa
  rationale: Filipinong transliterasyon na malapit sa anyong Hebreo ng pangalan.
- source_word: וְ/שָׂכָר
  choice: Sakar
  rationale: Sinasalamin nito ang mismong anyong Hebreo rito at hindi ito ipinagkakamali sa pangalang Isacar.
- source_word: וּ/נְתַנְאֵל
  choice: Netanel
  rationale: Tuwirang transliterasyon mula sa Hebreo sa halip na anyong naimpluwensiyahan ng Griyego.
