base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/012.yaml
  text: For these divisions of the gatekeepers[a], the chief men had assigned duties corresponding to those of their brothers, to minister in the house of Yahweh.
translation:
  language: tl
  text: Para sa mga pangkat na ito ng mga bantay-pinto, ang mga pangunahing lalaki ay may mga tungkulin[a] na katumbas ng sa kanilang mga kapatid upang maglingkod sa bahay ni Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “mga pagbabantay” o “mga takdang paglilingkod.” Siksik ang Hebreo: maaari ring unawain ang parirala bilang “ang mga pangunahing lalaki ay may mga pagbabantay na katapat o kaugnay ng kanilang mga kapatid.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְאֵלֶּה מַחְלְקוֹת
  choice: Ang mga pangkat na ito
  rationale: Ipinakikita ng parirala ang mga organisadong pangkat o paghahati ng paglilingkod. Likas sa makabagong Tagalog ang “mga pangkat na ito” at hindi nito kailangan ang isang pilit na panimulang “para sa.”
- source_word: הַשֹּׁעֲרִים
  choice: mga bantay-pinto
  rationale: Tumutukoy ito sa mga naatasang magbantay at mangasiwa sa mga pintuan. Malinaw at karaniwan sa Tagalog ang “bantay-pinto.”
- source_word: לְרָאשֵׁי הַגְּבָרִים
  choice: sa ilalim ng kanilang mga pinuno
  rationale: Siksik ang sintaks ng Hebreo. Pinananatili ng salin ang diwa ng pamumuno ng רָאשֵׁי nang hindi binibigyan ang גְּבָרִים ng di-tiyak na militar na kahulugan.
- source_word: מִשְׁמָרוֹת
  choice: mga tungkulin
  rationale: Maaaring tumukoy ang salita sa mga pagbabantay, nakatalagang gawain, o mga takdang paglilingkod. Ang “mga tungkulin” ang pinakanatural sa kontekstong administratibo ng templo.
- source_word: לְעֻמַּת אֲחֵיהֶם
  choice: katulad ng sa kanilang mga kapatid
  rationale: Ipinahahayag ng לְעֻמַּת ang pagtutumbas o pagkakatugma. Pinananatili rin ang literal na ugnayang “mga kapatid,” na sa konteksto ay mga kapwa naglilingkod.
- source_word: לְשָׁרֵת
  choice: upang maglingkod
  rationale: Ipinahahayag ng pawatas ang layunin ng kanilang mga tungkulin. Sapat na naipahihiwatig ng “maglingkod” ang banal na paglilingkod dahil malinaw na nasa bahay ni Yahweh ang konteksto.
- source_word: בְּבֵית יְהוָה
  choice: sa bahay ni Yahweh
  rationale: Pinananatili ng “bahay” ang konkretong metapora ng Hebreo, at tuwirang isinasalin ang pangalang tipan na יהוה bilang “Yahweh.”
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Pangalan mismo ang nasa tekstong Hebreo, kaya pinanatili ang “Yahweh” sa halip na palitan ito ng isang titulo.
- issue: Pagpapakahulugan sa אֲחֵיהֶם
  choice: kanilang mga kapatid
  alternative: kanilang mga kamag-anak; kanilang mga kapwa Levita
  rationale: Pinananatili ang literal na katawagang pampamilya at hindi tahasang nililimitahan sa “mga Levita” ang hindi espesipikong sinabi ng talata.
- issue: Siksik at eliptikong ugnayan ng mga pinuno at mga tungkulin
  choice: sa ilalim ng kanilang mga pinuno, ay may mga tungkulin
  alternative: ang mga pinuno ng mga lalaki ay may mga pagbabantay; para sa mga pinuno ng mga lalaki, mga tungkulin
  rationale: Ginawang mababasa sa Tagalog ang elipsis nang hindi ipinapasok ang ideya na ang mga pinuno mismo ang nagtalaga ng mga tungkulin. Nasa talababa ang lehitimong alternatibong pagbasa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “bantay-pinto,” “mga tungkulin,” at “maglingkod” bilang mga salitang madaling maunawaan ngunit angkop sa konteksto ng paglilingkod sa templo. Iniwasan ang arkikong “mga pangkatin” at ang militar na “mga mandirigma.”
