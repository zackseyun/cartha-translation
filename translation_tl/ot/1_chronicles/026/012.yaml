  naturalness: Likas at malinaw sa makabagong Filipino ang “mga pangunahing lalaki ay may mga tungkulin.” Ang “Para sa mga pangkat na ito” ay nagbibigay ng katamtamang paglalapat sa panimulang לְ nang hindi nagpapanggap na ganap na malinaw ang eliptikong sintaks.
