base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/008.yaml
  text: All these were from the sons of Obed-edom—they and their sons and their brothers, able men with strength for the service—sixty-two belonging to Obed-edom.
translation:
  language: tl
  text: Ang lahat ng ito ay mula sa mga anak na lalaki ni Obed-edom—sila, ang kanilang mga anak, at ang kanilang mga kapatid[a]—na mga lalaking may kakayahan[b] at lakas para sa paglilingkod. Ang kabuuang bilang para kay Obed-edom ay animnapu’t dalawa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga kamag-anak nilang lalaki,” kung mas malawak ang gamit dito ng salitang Hebreo para sa mga lalaking kaanak sa angkan.
    reason: lexical_alternative
  - marker: b
    text: Ang pariralang Hebreo ay maaari ding isaling “mga magigiting na lalaki” o “mga lalaking mahusay.” Sa kontekstong ito, malamang na idiniriin nito na sila ay may kakayahan at lakas para sa paglilingkod.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִבְּנֵי
  choice: mula sa mga anak ni
  rationale: Pinananatili nito ang diwa ng pinagmulan o pagiging kabilang sa angkan na ipinahihiwatig ng מִן, nang hindi ginagawang mas malawak na “mga inapo” ang literal na “mga anak.”
- source_word: הֵמָּה וּבְנֵיהֶם וַאֲחֵיהֶם
  choice: sila, ang kanilang mga anak, at ang kanilang mga kapatid
  rationale: Tuwirang inilalahad ang tatlong pangkat at pinananatili sa pangunahing teksto ang karaniwang kahulugan ng אֲחֵיהֶם bilang mga lalaking kapatid.
- source_word: אִישׁ חַיִל
  choice: mga lalaking may kakayahan
  rationale: Sa konteksto ng tungkulin sa templo, ipinahihiwatig ng parirala ang pagiging mahusay at karapat-dapat sa gawain, hindi lamang ang kagitingang militar.
- source_word: בַּכֹּחַ
  choice: at lakas
  rationale: Pinananatili ang kongkretong diwa ng כֹּחַ at likas na iniuugnay sa “may kakayahan” sa Filipino.
- source_word: לַעֲבֹדָה
  choice: para sa paglilingkod
  rationale: Ang עֲבֹדָה rito ay tumutukoy sa iniatas na paglilingkod o tungkulin; hindi dinaragdagan ng salitang “templo” sapagkat hindi iyon tahasang nasa talata.
- source_word: שִׁשִּׁים וּשְׁנַיִם
  choice: animnapu’t dalawa
  rationale: Tuwirang salin ng bilang.
- source_word: לְעֹבֵד אֱדֹם
  choice: ang kay Obed-edom
  rationale: Natural na buod sa Filipino ng bilang na nauugnay sa sambahayan o pangkat ni Obed-edom, habang pinananatili ang maluwag na ugnayang ipinahihiwatig ng לְ.
