base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/021.yaml
  text: 'The sons of Ladan[b][a], the sons of the Gershonite belonging to Ladan: the heads of the fathers’ houses belonging to Ladan the Gershonite were Jehieli.'
translation:
  language: tl
  text: 'Ang mga anak[a] ni Laadan—ang mga anak ng Gershonita na kabilang kay Laadan—ang mga pinuno ng mga sambahayan ng angkan ni Laadan na Gershonita: Jehieli.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga inapo.” Sa mga talaan ng angkan, maaaring tumukoy ang “mga anak” sa mas malawak na linya ng mga inapo.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: mga anak
  rationale: Pinananatili ang karaniwang katawagang panggenealohiya; maaari rin itong tumukoy sa mas malawak na mga inapo, kaya nilinaw ang saklaw sa talababa.
- source_word: לַעְדָּן
  choice: Laadan
  rationale: Tuwirang transliterasyon ng pangalang Hebreo na angkop sa modernong baybay-Filipino.
- source_word: הַגֵּרְשֻׁנִּי
  choice: Gershonita
  rationale: Ipinahahayag ng anyong gentilic ang kaugnayan sa angkan ni Gershon; natural sa Filipino ang hulaping “-ita” para sa kasapi o inapo ng isang pangkat.
- source_word: לְלַעְדָּן
  choice: na kabilang kay Laadan
  rationale: Dito, ang לְ ay nagpapakita ng kaugnayan o pagkakabilang sa linya ni Laadan, hindi direksiyon.
- source_word: רָאשֵׁי הָאָבוֹת
  choice: mga pinuno ng mga sambahayan ng mga ninuno
  rationale: Inililipat ang sinaunang idyoma sa malinaw ngunit marangal na Filipino at pinananatili ang ideya ng mga yunit ng angkan na pinamumunuan.
- source_word: יְחִיאֵלִי
  choice: ang mga Jehieli
  rationale: Itinuturing ang pangalan bilang katawagan sa pangkat o sambahayan sa kontekstong panggenealohiya, na umaayon sa maramihang “mga pinuno” nang hindi nagdaragdag ng tiyak na indibiduwal na wala sa teksto.
