    text: O “mga inapo.” Sa mga talaan ng angkan, maaaring tumukoy ang “mga anak” sa mas malawak na linya ng mga inapo.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “mga pinuno ng mga sambahayan ng mga ama,” isang idyomang tumutukoy sa mga pinuno ng mga yunit ng angkan o malalaking pamilya.
    reason: cultural_note
  revision_rationale: Inalis ang di-sinusuportahang maramihang "mga" bago ang Jehieli at pinanatili ang pangalan nang walang dagdag na pagpapakahulugan, dahil masalimuot ang sintaks at posibleng kolektibo ang gamit nito. Pinalitan ang "mga sambahayan ng mga ninuno" ng "mga sambahayan ng angkan" para sa mas tumpak at likas na Filipino. Iningatan ang talaang panggenealohiya at ang kaugnayan kay Laadan.
