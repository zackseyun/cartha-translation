review_pass:
  verdict: revise
  source_fidelity: Ang "mga Jehieli" ay hindi ligtas na salin ng יחיאלי, na nasa anyong isahan at maaaring gumana bilang pangalan o katawagang pampamilya. Ang maramihang Tagalog ay nagdaragdag ng isang pagpapakahulugang hindi malinaw sa Hebreo. Ang "mga sambahayan ng mga ninuno" ay hindi rin tumpak na katumbas ng idyomang "mga sambahayan ng mga ama" (mga yunit ng angkan).
  naturalness: Marangal ang rehistro at kapaki-pakinabang ang mga gitling, ngunit mabigat at di-likas ang "mga sambahayan ng mga ninuno." Ang "ang mga Jehieli" ay tunog na maraming taong may iisang personal na pangalan.
  terminology: Ang Laadan at Gershonita ay katanggap-tanggap. Ang "mga sambahayan ng angkan" ay mas natural na katumbas ng "mga sambahayan ng mga ama," habang ipinapaliwanag ng talababa ang idyomang Hebreo. Pinananatili ang Jehieli nang walang pagmamarka ng maramihan upang hindi hatulan ang pinagtatalunang tungkuling pangangkan ng pangalan.
  issues:
  - severity: medium
    issue: Ang "mga Jehieli" ay nagpapamarami sa pangalang יחיאלי.
    rationale: Nasa anyong isahan ang Hebreo. Maaaring kolektibong katawagang pangangkan ang pangalan sa siksik na talaang ito, ngunit hindi dapat tahasang gawing maramihang personal na pangalan.
  - severity: medium
    issue: Ang "mga sambahayan ng mga ninuno" ay nagpapalit sa "mga ama" ng "mga ninuno."
    rationale: Ang אבות sa idyomang "mga sambahayan ng mga ama" ay tumutukoy sa mga yunit ng angkan; ang "mga ninuno" ay maaaring magmungkahi ng mga indibiduwal na ancestral persons sa halip na mga sambahayang pangangkan.
  revised_text: 'Ang mga anak[a] ni Laadan—ang mga anak ng Gershonita na kabilang kay Laadan—ang mga pinuno ng mga sambahayan ng angkan ni Laadan na Gershonita: Jehieli.'
  revised_footnotes:
