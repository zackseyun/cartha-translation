base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/022.yaml
  text: 'The sons of Jehieli: Zetham and Joel his brother were over the treasuries of the house of Yahweh[a].'
translation:
  language: tl
  text: Ang mga anak ni Jehieli—sina Zetam at ang kapatid niyang si Joel—ang namamahala sa mga kabang-yaman ng bahay ni Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “bahay ni Yahweh”; karaniwang isinasalin na “bahay ng PANGINOON.”
    reason: alternative_reading
lexical_decisions:
- source_word: בְּנֵי
  choice: Ang mga anak ni
  rationale: Tuwirang salin ng construct plural ng בֵּן; angkop sa talaangkanan at tala ng mga tungkulin.
- source_word: יְחִיאֵלִי
  choice: Jehieli
  rationale: Itinuring na pangalang pantangi na kasunod ng 'mga anak ni'; pinananatili rin nito ang posibleng anyong pangalang nasa tekstong Hebreo.
- source_word: זֵתָם
  choice: Zetam
  rationale: Transliterasyon ng pangalang Hebreo ayon sa likas na baybay sa Filipino.
- source_word: וְיוֹאֵל
  choice: at ... si Joel
  rationale: Pangalang pantangi na may pang-ugnay; ginamit ang panandang 'si' para sa natural na Filipino.
- source_word: אָחִיו
  choice: ang kapatid niyang
  rationale: Pinananatili ang pang-isahang panghalip na panlalaki; pinakamalapit na tumutukoy kay Zetam, kaya si Joel ang kapatid niya.
- source_word: עַל
  choice: ang namamahala sa
  rationale: Sa kontekstong administratibo, ipinahihiwatig ng עַל ang pananagutan o pangangasiwa; mas natural sa Filipino kaysa literal na 'nasa ibabaw ng.'
- source_word: אֹצְרוֹת
  choice: mga ingatang-yaman
  rationale: Tumutukoy sa mga imbakan o tanggapan ng mga kayamanang nasa pangangasiwa ng templo; iniiwasang ipakahulugan lamang bilang mismong mga kayamanan.
- source_word: בֵּית יְהוָה
  choice: bahay ni Yahweh
  rationale: Pinananatili ang literal na 'bahay' at ang personal na pangalang banal na YHWH bilang 'Yahweh,' sa halip na tahimik na gawing 'templo' o pamalit na titulo.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Ang tekstong Hebreo ay tahasang gumagamit ng Tetragrammaton. Ang 'Yahweh' ay mas malapit na representasyon ng pangalang tipan at hindi ito pinapalitan ng isang titulo.
- issue: Kahulugan ng בֵּית יְהוָה
  choice: bahay ni Yahweh
  alternative: templo ni Yahweh
  rationale: Pinananatili ng 'bahay' ang anyo ng Hebreo at ang teolohikal na talinghaga nito, samantalang malinaw sa konteksto na tumutukoy ito sa santuwaryo o templo.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang em dash upang luminaw ang apposition ng dalawang pangalan. Ang 'ingatang-yaman' ay piniling institusyonal na katawagan para sa mga treasury o kamalig ng mahahalagang pag-aari.
