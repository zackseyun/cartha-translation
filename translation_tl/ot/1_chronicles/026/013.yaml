  text: And they cast lots[a], small and great alike, according to their fathers’ houses, for each gate.
translation:
  language: tl
  text: Nagpalabunutan sila—maliit man o dakila—ayon sa kani-kanilang angkan, para sa bawat pintuang-daan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo, inuulit ang salitang isahan na “pintuang-daan” upang idiin ang pamamahagi: “para sa pintuang-daan at pintuang-daan,” ibig sabihin, isa-isa sa bawat pintuang-daan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּפִּילוּ גוֹרָלוֹת
  choice: Nagpalabunutan sila
  rationale: Ang Hiphil ng נפל kasama ng גוֹרָלוֹת ay idyomang tumutukoy sa pagpapasiya sa pamamagitan ng palabunutan. Natural at malinaw sa modernong Filipino ang “nagpalabunutan.”
- source_word: כַּקָּטֹן כַּגָּדוֹל
  choice: maliit man o dakila
  rationale: Pinananatili nito ang konkretong idyomang Hebreo at ipinahihiwatig na walang pagtatangi ayon sa katayuan; hindi ito nililimitahan sa edad gaya ng “bata man o matanda.”
- source_word: לְבֵית אֲבוֹתָם
  choice: ayon sa kani-kanilang sambahayan ng mga ninuno
  rationale: Tumutukoy ito sa mga pangkat-pamilya o angkan na nakaayos ayon sa sambahayan ng ama. Ipinakikita ng “kani-kanilang” ang distributibong diwa sa konteksto.
- source_word: לְשַׁעַר וָשָׁעַר
  choice: para sa bawat pintuang-daan
  rationale: 'Ang pag-uulit ng pangngalang isahan sa Hebreo ay may distributibong diin: isa-isa o bawat pintuang-daan.'
theological_decisions: []
translation_notes:
  register: Modernong Filipino na dignified at madaling maunawaan. Pinanatili ang idyomang “maliit man o dakila” upang hindi tahimik na ipakahulugan bilang pagkakaiba sa edad. Ginamit ang “sambahayan ng mga ninuno” para sa institusyong panlipunan ng בית אבות, nang hindi ito gawing simpleng nukleyar na pamilya.
