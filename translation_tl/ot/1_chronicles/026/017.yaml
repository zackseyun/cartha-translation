translation_notes:
  register: Gumamit ng maikli, marangal, at likas na modernong Filipino na angkop sa talaan ng mga takdang bantay. Ang semicolon ay nagpapanatili sa magkakaugnay ngunit magkakahiwalay na bahagi ng listahan. Inilagay ang talababa sa “mga silid-imbakan,” ang salitang talagang tinutukoy ng alternatibong pagbasa.
