base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/017.yaml
  text: On the east were six Levites; on the north[a], four a day; on the south, four a day; and at the storehouses, two by two.
translation:
  language: tl
  text: Sa silangan ay anim na Levita; sa hilaga, apat bawat araw; sa timog, apat bawat araw; at sa mga silid-imbakan[a], tigdalawa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: Asuppim. Maaaring pangalan ito ng isang tiyak na lugar o kalipunan ng mga silid, sa halip na karaniwang tawag lamang sa mga silid-imbakan.'
    reason: alternative_reading
lexical_decisions:
- source_word: לַמִּזְרָח
  choice: sa silangan
  rationale: Ang pang-ukol at pangngalang tumutukoy sa direksiyon ay nagsasaad ng puwesto o bahaging pinagdestinuhan.
- source_word: הַלְוִיִּם
  choice: mga Levita
  rationale: Tumutukoy ito sa mga Levitang bantay-pinto sa konteksto; likas sa modernong Filipino ang paggamit ng “mga” para sa pangkat.
- source_word: שִׁשָּׁה
  choice: anim
  rationale: Ito ang bilang ng mga Levitang nakatalaga sa silangan.
- source_word: לַצָּפוֹנָה
  choice: sa hilaga
  rationale: Isinalin bilang lokasyon, kaagapay ng silangan at timog.
- source_word: לַיּוֹם
  choice: bawat araw
  rationale: Sa kontekstong administratibo, ipinahihiwatig nito ang bilang ng mga nakatalaga sa araw-araw.
- source_word: אַרְבָּעָה
  choice: apat
  rationale: Ito ang bilang ng nakatalaga sa hilaga at sa timog.
- source_word: לַנֶּגְבָּה
  choice: sa timog
  rationale: Isinalin bilang lokasyon, kaagapay ng iba pang direksiyon.
- source_word: וְלָאֲסֻפִּים
  choice: at sa mga silid-imbakan[a]
  rationale: Malamang na tumutukoy ang אֲסֻפִּים sa mga silid o gusaling imbakan sa templo, ngunit maaaring pangalan ito ng isang tiyak na lugar o complex; pinanatili sa talababa ang kawalang-katiyakan.
- source_word: שְׁנַיִם שְׁנָיִם
  choice: tigdalawa
  rationale: Ang pag-uulit ng bilang ay distributibo; malinaw at natural sa Filipino ang “tigdalawa.”
