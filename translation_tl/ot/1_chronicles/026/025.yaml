base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/025.yaml
  text: 'And his brothers belonging to Eliezer: Rehabiah his son[a], and Jeshaiah his son, and Joram his son, and Zichri his son, and Shelomith his son.'
translation:
  language: tl
  text: At ang mga kamag-anak niya na kaugnay ni Eliezer:[a] si Rehabias na anak niya, si Jesaias na anak niya, si Joram na anak niya, si Zicri na anak niya, at si Selomot na anak niya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mas literal, “At ang mga kapatid niya, kay Eliezer.” Malamang na ipinakikilala ng ayos ng Hebreo ang sangay ng angkan na kaugnay ni Eliezer.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶחָיו לֶאֱלִיעֶזֶר
  choice: At ang mga kamag-anak niya na mula kay Eliezer
  rationale: Bagaman karaniwang nangangahulugang “mga kapatid niya” ang וְאֶחָיו, maaari itong tumukoy sa mas malawak na mga kaanak sa kontekstong talaangkanan. Ipinahihiwatig ng לֶאֱלִיעֶזֶר ang sangay na nagmula o nauugnay kay Eliezer; pinananatili sa talababa ang mas literal at hindi pangkaraniwang anyo.
- source_word: רְחַבְיָהוּ
  choice: Rehabias
  rationale: Ginamit ang nakaugaliang anyong Filipino ng pangalan, na umaangkop sa hulaping Hebreo at sa tradisyon ng mga pangalang biblikal.
- source_word: בְנוֹ
  choice: anak niya
  rationale: Inulit sa bawat pangalan upang mapanatili ang tahasang sunod-sunod na ugnayang ama-anak sa Hebreo.
- source_word: וִישַׁעְיָהוּ
  choice: si Jesaias
  rationale: Pinili ang tradisyonal na anyong Filipino para sa pangalang ito; hindi ito isinaling “Isaias” upang maiwasang ipagkamali sa mas kilalang propeta.
- source_word: וְיֹרָם
  choice: si Joram
  rationale: Tuwirang tinutumbasan ang maikling anyo ng pangalang Hebreo sa talata, sa halip na ang mas mahabang kaugnay na anyong Jehoram.
- source_word: וְזִכְרִי
  choice: si Zicri
  rationale: Malinaw na transliterasyong Filipino ng personal na pangalan.
- source_word: וּשְׁלֹמוֹת
  choice: si Selomot
  rationale: Malapit na transliterasyon ng anyong katinig at pagbasa ng pangalang Hebreo sa talatang ito, sa halip na ipasok ang tradisyonal na anyong Ingles na Shelomith.
theological_decisions: []
translation_notes:
  register: Makabagong Filipino na marangal at madaling maunawaan. Ginamit ang “mga kamag-anak” sa pangunahing teksto dahil ang sumusunod ay isang linya ng salinlahi, habang pinanatili sa talababa ang literal na “mga kapatid.” Ang paulit-ulit na “anak niya” ay sadyang pinanatili upang maipakita ang genealogical chain ng Hebreo.
