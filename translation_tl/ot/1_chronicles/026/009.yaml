  text: And Shelemiah had sons and brothers[a], valiant men[b], eighteen.
translation:
  language: tl
  text: At si Selemias ay may mga anak na lalaki at mga kapatid na lalaki[a]—lahat ay mga magigiting na lalaki[b], na labingwalo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal na “para kay Selemias,” isang Hebreong pagkakabuo na nagpapakilala sa taong kaugnay ng bilang.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “mga lalaking may kagitingan” o “mga lalaking may lakas at kakayahan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/לִ/מְשֶֽׁלֶמְיָ֗הוּ
  choice: At si Selemias ay may
  rationale: Ang לְ ay literal na “para kay,” ngunit sa kontekstong ito ng pagtatala ay ipinakikilala nito ang taong binibilang. Ang “si Selemias ay may” ay likas sa Tagalog at malinaw na naghahayag ng kaugnayan ng mga kasunod na lalaki sa kaniya.
- source_word: בָּנִים
  choice: mga anak na lalaki
  rationale: Tiyak na mga lalaking anak ang tinutukoy ng Hebreo, kaya mas eksakto ito kaysa sa pangkalahatang “mga anak.”
- source_word: וְ/אַחִים
  choice: at mga kapatid
  rationale: Karaniwang kahulugan ng אַחִים ang mga kapatid na lalaki. Sa Tagalog, maaaring gamitin ang “mga kapatid” sa pangkat na malinaw nang binubuo ng mga lalaki, habang pinananatili ang likas na daloy.
- source_word: בְּנֵי חָיִל
  choice: mga magigiting na lalaki
  rationale: Ang idyomang literal na “mga anak ng lakas/kagitingan” ay tumutukoy sa matatapang, malalakas, o mahuhusay na lalaki. Ang “mga magigiting na lalaki” ay marangal, malinaw, at angkop sa konteksto.
- source_word: שְׁמוֹנָה עָשָׂר
  choice: labingwalo silang lahat
  rationale: Isinasalin ang bilang bilang “labingwalo”; idinagdag ang “silang lahat” upang natural na maipahayag sa Tagalog na ito ang kabuuang bilang ng mga anak at kapatid, nang hindi binabago ang sanggunian.
