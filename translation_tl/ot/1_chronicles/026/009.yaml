  source_fidelity: 'Tumpak ang pangunahing diwa: si Selemias ang taong tinutukoy, at ang bilang na labingwalo ay para sa kaniyang mga anak at kapatid. Gayunman, ang Hebreong אַחִים ay panlalaki sa talatang ito at mas mainam na tahasang isalin bilang “mga kapatid na lalaki.”'
  naturalness: Likas at marangal ang pangungusap pagkatapos ng bahagyang pag-aayos. Ang “lahat ay” ay malinaw na nag-uugnay sa “mga magigiting na lalaki” at sa kabuuang bilang nang hindi binabago ang appositional na daloy ng Hebreo.
  terminology: Ang “mga magigiting na lalaki” ay angkop para sa בְּנֵי־חָיִל. Ang “mga anak na lalaki” at “mga kapatid na lalaki” ay pinananatili upang katawanin ang panlalaking mga anyo sa pinagmulan.
