- from: At si Selemias ay may mga anak na lalaki at mga kapatid[a]—mga magigiting na lalaki[b]—labingwalo silang lahat.
  to: At si Selemias ay may mga anak na lalaki at mga kapatid na lalaki[a]—lahat ay mga magigiting na lalaki[b], na labingwalo.
  rationale: Idinagdag ang “na lalaki” sa “mga kapatid” upang tumpak na maipakita ang panlalaking kahulugan ng אַחִים. Inayos din ang huling parirala upang maging mas malinaw sa Filipino na ang mga anak at kapatid ni Selemias ang mga magigiting na lalaki at na ang kabuuan nila ay labingwalo.
