  - severity: low
    issue: Ang “silang lahat” ay medyo maluwag ang pagkakabit sa naunang apposition.
    rationale: Mas malinaw ang “lahat ay magigiting na lalaki, na labingwalo” upang ipakita na ang mga anak at kapatid ang grupong inilalarawan at binibilang.
