base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/001.yaml
  text: 'For the divisions of the gatekeepers: of the Korahites[a], Meshelemiah son of Kore, from the sons of Asaph.'
translation:
  language: tl
  text: 'Tungkol sa mga pangkat ng mga bantay-pinto: sa mga Korahita, si Meselemias na anak ni Kore, mula sa mga anak ni Asaf.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin ang pambungad: “Ayon sa mga pangkat ng mga bantay-pinto.” Nagsisilbi itong pamagat na nagpapakilala sa talaan ng mga pangkat ng mga bantay-pinto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַחְלְקוֹת לְשֹׁעֲרִים
  choice: Tungkol sa mga pangkat ng mga bantay sa pintuang-bayan
  rationale: Ang unang dalawang pariralang may לְ ay nagsisilbing pamagat ng seksiyon at tumutukoy sa mga organisadong pangkat o takdang grupo ng mga bantay sa mga pintuang-bayan.
- source_word: לַקָּרְחִים
  choice: mula sa mga Korahita
  rationale: Tinutukoy nito ang angkan o pangkat na pinagmulan ni Meselemias; ang hulaping -ita ay likas na paraan sa Filipino upang tukuyin ang mga kaanib o inapo ni Korah.
- source_word: מְשֶׁלֶמְיָהוּ
  choice: Meselemias
  rationale: Isinalin sa anyong pangalang pamilyar at likas sa tradisyong Filipino habang kinakatawan ang pangalang Hebreo.
- source_word: בֶן קֹרֵא
  choice: anak ni Kore
  rationale: Ang בֶן ay tuwirang tumutukoy sa ugnayang ama at anak sa talaangkanang ito.
- source_word: מִן בְּנֵי אָסָף
  choice: mula sa mga anak ni Asaf
  rationale: Pinananatili ng 'mula sa' ang diwa ng מִן bilang pinagmulan o pagiging kabilang sa isang mas malawak na angkan, nang hindi ipinapalagay kung ang 'mga anak' ay tuwirang mga anak o mga inapo.
theological_decisions:
- issue: Pagkakakilanlan ni Asaf
  choice: Iniwan bilang personal na pangalan lamang
  alternative: Tukuyin siya bilang kilalang Levitang mang-aawit
  rationale: Hindi tahasang nililinaw ng talata ang pagkakakilanlan niya; ang pagdaragdag ng tungkulin o tiyak na identidad ay lalampas sa ebidensiya ng teksto.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “bantay sa pintuang-bayan” upang malinaw na tumukoy sa mga taong nakatalaga sa mga tarangkahan, at “mga pangkat” para sa organisadong mga dibisyon o takdang grupo. Inilagay ang panandang talababa [a] sa pangunahing teksto.
