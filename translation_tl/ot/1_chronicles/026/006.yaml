    issue: Ang katumbas ng גִּבּוֹרֵי חַיִל ay labis na pinalawak bilang “mga lalaking makapangyarihan at may kakayahan.”
    rationale: Maaaring tumukoy ang parirala sa kagitingan, lakas, o napatunayang husay, ngunit hindi tuwirang sinasabi ng teksto ang “makapangyarihan.” Mas mabuting panatilihin ang pangunahing diwa sa teksto at ilahad ang lawak sa talababa.
  - severity: low
    issue: Hindi gaanong natural ang ayos ng pangungusap na gumagamit ng “At kay Semaias ... ay ipinanganak.”
    rationale: Bagaman nauunawaan, mas idiomatiko sa modernong Filipino ang “Si Semaias, na anak niya, ay nagkaroon ng mga anak na lalaki,” nang hindi binabago ang kahulugan.
