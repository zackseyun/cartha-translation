translation:
  language: tl
  text: Si Semaias, na anak niya, ay nagkaroon ng mga anak na lalaki na namuno sa sambahayan ng kanilang mga ama, sapagkat sila ay mga magigiting na lalaki.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Hebreong pariralang isinaling “mga magigiting na lalaki” ay maaari ring tumukoy sa mga lalaking may napatunayang lakas, husay, o kakayahan; hindi ito kinakailangang tumukoy lamang sa mga mandirigma.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלִשְׁמַעְיָה
  choice: At kay Semaias
  rationale: Pinananatili ng “at” at “kay” ang pang-ugnay at ang Hebreong pormula ng kapanganakan na may לְ, habang natural sa Filipino.
- source_word: בְנוֹ
  choice: na anak niya
  rationale: Tumutukoy kay Semaias bilang anak ng naunang binanggit na si Obed-edom; “anak” ang tuwirang kahulugan dito.
- source_word: נוֹלַד בָּנִים
  choice: ay ipinanganak ang mga anak na lalaki
  rationale: Bagaman anyong isahan ang pandiwa sa Hebreo, maramihan ang paksa; ginamit ang natural na pormula sa Filipino at pinanatili ang tiyak na “mga anak na lalaki.”
- source_word: הַמִּמְשָׁלִים
  choice: na namahala
  rationale: Ipinahahayag ang aktuwal na paggamit ng pamamahala o awtoridad, hindi lamang ang paghawak ng isang titulo.
- source_word: לְבֵית אֲבִיהֶם
  choice: sa sambahayan ng kanilang ama
  rationale: Ang בֵּית אָב ay yunit ng angkan o sambahayan ng ama; ang isahang “sambahayan” ay malapit sa anyo ng Hebreo at malinaw sa modernong Filipino.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala ang dahilan ng kanilang pamamahala sa isang dignified ngunit madaling maunawaang paraan.
- source_word: גִּבּוֹרֵי חַיִל
  choice: mga lalaking makapangyarihan at may kakayahan
  rationale: Sinasaklaw ang lakas, husay, at kinikilalang kakayahan ng idyoma nang hindi ito nililimitahan sa kagitingang pandigma.
- source_word: הֵמָּה
  choice: sila ay
  rationale: Pinananatili ang tahasang panghalip at bahagyang diin ng Hebreo.
