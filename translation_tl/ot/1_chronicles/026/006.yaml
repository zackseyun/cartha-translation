  source_fidelity: Ang draft ay wastong kumikilala kay Semaias bilang anak ni Obed-edom at sa kaniyang mga anak bilang mga namuno sa בית אב. Gayunman, ang “makapangyarihan at may kakayahan” ay masyadong nagpapaliwanag at maaaring magpahiwatig ng kapangyarihang pampulitika; ang גִּבּוֹרֵי חַיִל ay mas tuwirang natutumbasan ng “mga magigiting na lalaki,” habang ang mas malawak na saklaw nito ay maaaring ilagay sa talababa.
  naturalness: Medyo mabigat at hindi likas ang “At kay Semaias na anak niya ay ipinanganak ang mga anak na lalaki.” Mas malinaw at modernong Filipino ang “Si Semaias, na anak niya, ay nagkaroon ng mga anak na lalaki.”
  terminology: Ang “sambahayan” ay angkop para sa בית אב. Ang “mga ama” ay mas tapat sa anyong pangmaramihan ng אֲבִיהֶם at nananatiling natural sa kontekstong angkan. Ang “mga magigiting na lalaki” ay pinananatili ang dignified na rehistro at ang karaniwang lakas ng Hebreong idyoma nang hindi ipinapalagay na pawang mandirigma sila.
  issues:
