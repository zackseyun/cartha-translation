  rationale: Inayos ang ayos ng pangungusap para sa natural na modernong Filipino, pinanatili ang “sambahayan” para sa בית אב, at ginawang mas tuwiran ang katumbas ng גִּבּוֹרֵי חַיִל. Inilagay sa talababa ang mas malawak at hindi eksklusibong pandigmang gamit ng idyoma.
