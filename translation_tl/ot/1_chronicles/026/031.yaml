  register: Modernong Filipino Tagalog na may marangal ngunit madaling maunawaang himig. Iniwasan ang sobrang teknikal na pananalita sa pangunahing teksto; ipinaliwanag sa talababa ang sinaunang estrukturang pangangkan at ang saklaw ng idyomang Hebreo.
