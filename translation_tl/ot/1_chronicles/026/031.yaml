base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/031.yaml
  text: For the Hebronites[a], Jeriah was the chief of the Hebronites according to his generations by fathers’ houses. In the fortieth year of David’s reign they were sought out[c][b], and among them mighty men of valor were found at Jazer of Gilead.
translation:
  language: tl
  text: Sa mga Hebronita,[a] si Jerias ang pinuno ng mga Hebronita ayon sa kanyang mga salinlahi at sa mga sambahayan ng mga ninuno.[b] Noong ikaapatnapung taon ng paghahari ni David, siniyasat sila, at natagpuan sa kanila sa Jazer ng Gilead ang mga lalaking magigiting at may kakayahan.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “Tungkol sa mga Hebronita, si Jerias ang pinuno.”
    reason: Pinananatili ang posibleng paksaing gamit ng unang לַחֶבְרוֹנִי.
  - marker: b
    text: Ang “mga sambahayan ng mga ninuno” ay tawag sa mas malalaking pangkat ng magkakamag-anak ayon sa kanilang angkan, hindi lamang sa mga pamilyang nakatira sa iisang bahay.
    reason: Nililinaw ang sinaunang katawagang panlipunan at pangangkan.
  - marker: c
    text: Maaari ring isalin, “mga makapangyarihang mandirigma” o “mga lalaking kilala sa lakas.” Ang pariralang Hebreo ay maaaring tumukoy sa katapangan, lakas, o subok na kakayahan.
    reason: Pinananatili ang lawak ng kahulugan ng גִּבּוֹרֵי חַיִל.
lexical_decisions:
- source_word: לַחֶבְרוֹנִי
  choice: Sa mga Hebronita
  rationale: Ginagamit ang pang-ukol bilang panandang paksa na nagpapakilala sa angkan ng mga Hebronita; natural sa Tagalog ang “Sa mga Hebronita.”
- source_word: יְרִיָּה הָרֹאשׁ
  choice: si Jerias ang pinuno
  rationale: Ang רֹאשׁ ay tumutukoy sa pangunahing pinuno sa kontekstong pangangkan at pangangasiwa; ang “pinuno” ay malinaw at marangal na katumbas.
- source_word: לְתֹלְדֹתָיו לְאָבוֹת
  choice: ayon sa kanyang mga salinlahi at sa mga sambahayan ng mga ninuno
  rationale: Pinananatili ng “mga salinlahi” ang ideya ng mga linya ng lahi, habang ang “mga sambahayan ng mga ninuno” ay naghahatid ng teknikal na kaayusang pangangkan. Pinananatili rin ng “kanyang” ang pang-isahang hulapi ng Hebreo nang hindi tiyakang nilulutas ang tinutukoy nito.
- source_word: בִּשְׁנַת הָאַרְבָּעִים לְמַלְכוּת דָּוִיד
  choice: Nang ikaapatnapung taon ng paghahari ni David
  rationale: Likas na anyong Tagalog ito para sa pormulang nagtatakda ng taon ng paghahari.
- source_word: נִדְרָשׁוּ
  choice: siniyasat sila
  rationale: Pinananatili nito ang balintiyak na anyo at ang diwa ng masusing pagtatanong o pagsusuri, nang hindi nagdaragdag na tiyak na talaangkanan lamang ang sinuri.
- source_word: וַיִּמָּצֵא בָהֶם
  choice: at natagpuan sa kanila
  rationale: Inihahatid ng likas na balintiyak na Tagalog ang idyomatikong diwa ng Hebreo at iniuugnay ito sa maramihang pangngalang sumusunod.
- source_word: גִּבּוֹרֵי חַיִל
  choice: mga lalaking magigiting at may kakayahan
  rationale: Sinasaklaw nito ang lakas ng loob at subok na kakayahan ng parirala nang hindi ito ipinapakahulugan na tiyak na mga mandirigma lamang.
- source_word: בְּיַעְזֵיר גִּלְעָד
  choice: sa Jazer ng Gilead
  rationale: Pinananatili ang lokasyon at ang kaugnayan ng Jazer sa rehiyon ng Gilead sa maikli at natural na Tagalog.
