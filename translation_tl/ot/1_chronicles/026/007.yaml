base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/007.yaml
  text: 'The sons of Shemaiah: Othni[a], Rephael, Obed, Elzabad, whose brothers were capable men, Elihu and Semakiah.'
translation:
  language: tl
  text: 'Ang mga anak ni Semaias: sina Otni, Rafael, Obed, at Elzabad. Ang mga kapatid niya, na mga lalaking may kakayahan[a], ay sina Elihu at Semakias.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga magigiting na lalaki” o “mga lalaking mahusay.” Ang pariralang Hebreo ay maaaring tumukoy sa lakas, kagitingan, o kakayahan; dito, malamang na binibigyang-diin nito ang kakayahan sa paglilingkod.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי שְׁמַעְיָה
  choice: Ang mga anak ni Semaias
  rationale: Tuwirang ipinapahayag ang ugnayang anak at ama at pinananatili ang estilong talaan ng angkan.
- source_word: עָתְנִי
  choice: Otni
  rationale: Transliterasyon ng pangalang Hebreo na likas bigkasin sa Filipino.
- source_word: וּרְפָאֵל
  choice: Rafael
  rationale: Ginamit ang nakaugaliang anyong Filipino ng pangalang tumutugma sa Hebreong Refael.
- source_word: וְעוֹבֵד
  choice: Obed
  rationale: Pinanatili ang karaniwang biblikal na transliterasyon.
- source_word: אֶלְזָבָד
  choice: Elzabad
  rationale: Tuwirang transliterasyon ng personal na pangalan.
- source_word: אֶחָיו
  choice: ang mga kapatid niya
  rationale: Pinananatili ang pang-isahang panlalaking hulaping Hebreo, na pinakamalapit na tumutukoy kay Elzabad, sa halip na gawing 'kanilang mga kapatid.'
- source_word: בְּנֵי חָיִל
  choice: mga lalaking may kakayahan
  rationale: Sinasaklaw nito ang lakas, kahusayan, at pagiging karapat-dapat sa paglilingkod nang hindi nililimitahan ang parirala sa kahulugang militar.
- source_word: אֱלִיהוּ
  choice: Elihu
  rationale: Pinanatili ang kilalang anyong biblikal ng pangalan.
- source_word: וּסְמַכְיָהוּ
  choice: Semakias
  rationale: Transliterasyong Filipino na malapit sa Masoretikong anyong Semakyahu.
