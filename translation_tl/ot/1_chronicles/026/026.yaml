base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/026.yaml
  text: Shelomoth and his brothers were over all the treasuries of the holy things that King David[a], the heads of the fathers’ houses, the commanders of thousands and of hundreds[b], and the commanders of the army had dedicated.
translation:
  language: tl
  text: Si Selomot at ang mga kapatid niya ang namamahala sa lahat ng kabang-yaman ng mga banal na bagay[a] na itinalaga ni Haring David at ng mga pinuno ng mga angkan[b], ng mga pinuno ng mga pangkat na tig-iisang libo at tig-iisang daan, at ng mga pinuno ng hukbo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga sagradong bagay” o “mga handog na itinalaga.”
    reason: lexical_alternative
  - marker: b
    text: Literal na “mga pinuno ng mga sambahayan ng mga ama,” isang katawagang administratibo para sa mga pinuno ng mga angkang nagmula sa iisang ninuno.
    reason: cultural_note
lexical_decisions:
- source_word: הוּא שְׁלֹמוֹת וְאֶחָיו
  choice: Si Selomot at ang mga kapatid niya
  rationale: Ginamit ang likas na tambalang simuno sa Filipino. Ang pangalang שְׁלֹמוֹת ay tinumbasan bilang “Selomot,” at pinanatili ng “mga kapatid” ang tuwirang kahulugan ng אֶחָיו nang hindi isinasara ang posibilidad na tumutukoy ito sa mga lalaking kamag-anak o kapuwa Levita.
- source_word: עַל
  choice: ang namamahala sa
  rationale: Sa kontekstong administratibo, ipinahihiwatig ng עַל ang pananagutan o pangangasiwa, kaya mas malinaw at natural ang “namamahala sa” kaysa sa literal na “nasa ibabaw ng.”
- source_word: כָּל אֹצְרוֹת
  choice: lahat ng kabang-yaman
  rationale: Maaaring tumukoy ang אֹצָר sa imbakan o sa yamang nakalagak doon. Ang “kabang-yaman” ay angkop sa mga institusyonal na imbakan ng mga itinalagang ari-arian.
- source_word: הַקֳּדָשִׁים
  choice: mga banal na bagay
  rationale: Pinananatili nito ang tuwirang diwa ng mga bagay na ibinukod bilang banal, habang inilalahad sa talababa ang mga posibleng salin ayon sa konteksto.
- source_word: אֲשֶׁר הִקְדִּישׁ
  choice: na itinalaga
  rationale: Ang Hiphil ng קדשׁ ay nangangahulugang magbukod o maghandog para sa banal na gamit. Ang “itinalaga” ay malinaw at dignified sa modernong Filipino.
- source_word: דָּוִיד הַמֶּלֶךְ
  choice: Haring David
  rationale: Ito ang natural na ayos ng titulo at pangalan sa Filipino.
- source_word: רָאשֵׁי הָאָבוֹת
  choice: mga pinuno ng mga angkan
  rationale: Isa itong teknikal na katawagang nakabatay sa sambahayan ng ninuno. Ang “mga angkan” ay mas madaling maunawaan kaysa sa literal na “mga sambahayan ng mga ama,” habang pinananatili sa talababa ang kulturang kahulugan.
- source_word: שָׂרֵי הָאֲלָפִים וְהַמֵּאוֹת
  choice: mga pinuno ng mga pangkat na tig-iisang libo at tig-iisang daan
  rationale: Nililinaw ng “mga pangkat” na ang libo at daan ay mga yunit ng organisasyong militar, hindi lamang bilang ng mga indibidwal na pinuno.
- source_word: שָׂרֵי הַצָּבָא
  choice: mga pinuno ng hukbo
  rationale: Sa talatang ito, ang צָבָא ay tumutukoy sa hukbong militar, at ang “mga pinuno ng hukbo” ay malinaw at pormal.
theological_decisions:
- issue: Saklaw ng mga nagtalaga ng mga banal na bagay
  choice: 'Itinuturing na magkakasamang nagtalaga ang lahat ng nakalistang pangkat: si Haring David, ang mga pinuno ng mga angkan, ang mga pinuno ng mga yunit na tig-iisang libo at tig-iisang daan, at ang mga pinuno ng hukbo.'
  alternative: Si David lamang ang nagtalaga, at ang kasunod na mga pinuno ay kaugnay sa ibang paraan o paliwanag lamang sa naunang parirala.
  rationale: Bagaman isahan ang pandiwang Hebreo, ang magkakasunod na pariralang pinag-uugnay ng וְ ay pinakamadaling unawain bilang pinagsamang simuno. Inulit sa Filipino ang mga panandang “ni/ng” upang luminaw ang pagkakaugnay nang hindi nagdaragdag ng doktrinal na kahulugan.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at angkop sa pampublikong pagbasa. Iniwasan ang sobrang literal na Hebraism, ngunit pinanatili ang administratibo at banal na bokabularyo ng talata.
