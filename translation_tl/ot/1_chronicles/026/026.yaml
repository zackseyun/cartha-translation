  to: Si Selomot at ang mga kapatid niya ang namamahala sa lahat ng kabang-yaman ng mga banal na bagay[a] na itinalaga ni Haring David at ng mga pinuno ng mga angkan[b], ng mga pinuno ng mga pangkat na tig-iisang libo at tig-iisang daan, at ng mga pinuno ng hukbo.
