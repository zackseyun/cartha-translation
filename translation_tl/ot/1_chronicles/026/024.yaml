  text: וּ/שְׁבֻאֵל֙ בֶּן גֵּרְשׁ֣וֹם בֶּן מֹשֶׁ֔ה נָגִ֖יד עַל הָ/אֹצָרֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/024.yaml
  text: And Shebuel son of Gershom[a], son of Moses[b], was chief over the treasuries.
translation:
  language: tl
  text: At si Sebuel na anak ni Gersom, na anak ni Moises, ang namamahala sa mga kabang-yaman.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga imbakan” o “mga kayamanan.” Maaaring tumukoy ang salitang Hebreo sa mga lugar na pinaglalagyan ng mahahalagang bagay o sa mga yamang naroon.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/שְׁבֻאֵל
  choice: At si Sebuel
  rationale: Pinananatili ng “At” ang pang-ugnay ng Hebreong ו sa talaan; isina-Tagalog ang baybay ng pangalang pantangi.
- source_word: בֶּן גֵּרְשׁוֹם בֶּן מֹשֶׁה
  choice: na anak ni Gersom, na anak ni Moises
  rationale: Tuwirang inilalarawan ng dalawang בֶּן ang ugnayang ama-anak sa talaangkanan, at nililinaw ng pag-uulit ang sunod-sunod na salinlahi.
- source_word: נָגִיד עַל
  choice: ang namamahala sa
  rationale: Sa kontekstong administratibo, ipinahihiwatig ng נָגִיד עַל ang taong inilagay na may awtoridad at pananagutan sa isang gawain; natural itong ipahayag sa modernong Tagalog bilang “namamahala sa.”
- source_word: הָאֹצָרוֹת
  choice: mga kabang-yaman
  rationale: Maaaring tumukoy ang אֹצָרוֹת sa mga imbakan o sa mga yamang iniingatan. Ang “mga kabang-yaman” ay angkop sa pangangasiwa sa mga ari-arian at inilaang yaman sa konteksto.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “namamahala” sa halip na mas literal ngunit hindi gaanong natural na “pinuno sa ibabaw ng,” habang pinananatili ang administratibong diwa ng Hebreo.
