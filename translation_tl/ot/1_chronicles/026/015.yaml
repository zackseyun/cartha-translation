  yaml_path: translation/ot/1_chronicles/026/015.yaml
  text: To Obed-edom[a], the south; and to his sons, the house of stores.
translation:
  language: tl
  text: Kay Obed-Edom ang gawing timog, at sa mga anak niyang lalaki ang bahay-imbakan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “bahay ng mga bodega” o “bahay ng mga tinipong bagay.” Ang salitang Hebreo ay tumutukoy sa isang lugar na imbakan o taguan ng mga bagay na tinipon.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְעֹבֵד אֱדֹם
  choice: Kay Obed-Edom
  rationale: Ang לְ ay nagmamarka ng tumanggap ng takdang bahagi sa konteksto ng pagbunot at paghahati ng mga tungkulin; likas sa Filipino ang pormulang “Kay Obed-Edom ang …”
- source_word: נֶגְבָּה
  choice: ang gawing timog
  rationale: Ang pangngalang may hulaping paturol ay tumutukoy sa direksiyon o bahaging nasa timog; malinaw itong tumutugma sa konteksto ng mga puwesto sa mga pintuang-bayan.
- source_word: וּלְבָנָיו
  choice: at sa kanyang mga anak
  rationale: Tumutukoy ito sa mga anak na lalaki ni Obed-Edom bilang tumanggap ng hiwalay na takdang tungkulin; sa Filipino, maaaring gamitin ang “mga anak” nang hindi nawawala ang ugnayang pampamilya sa konteksto.
- source_word: בֵּית הָאֲסֻפִּים
  choice: ang bahay-imbakan
  rationale: Pinagsasama ng “bahay-imbakan” ang arkitektural na diwa ng בֵּית at ang ideya ng mga bagay na tinipon o iniimbak sa הָאֲסֻפִּים, habang nananatiling natural at maikli sa modernong Filipino.
