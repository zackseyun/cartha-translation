base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/014.yaml
  text: The lot for the east fell to Shelemyahu. Then they cast lots for his son Zekaryahu[a], a counselor with insight, and his lot came out for the north.
translation:
  language: tl
  text: Ang palabunot para sa silangan ay napunta kay Selemias. Pagkatapos, nagpalabunutan sila para sa anak niyang si Zacarias[a], isang tagapayo na may unawa, at ang kanyang palabunot ay lumabas para sa hilaga.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “isang matalinong tagapayo.” Literal na inilalarawan ng pariralang Hebreo si Zacarias bilang “isang tagapayo na may unawa/katalinuhan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפֹּל הַגּוֹרָל
  choice: Ang palabunutan ... ay napunta
  rationale: Ipinahahayag nito ang idyomang Hebreo tungkol sa kinalabasan ng palabunutan sa natural na modernong Tagalog, habang pinananatili ang diwa ng pagkakatalaga.
- source_word: מִזְרָחָה
  choice: para sa silangan
  rationale: Ang directional he ay tumutukoy sa direksiyon o bahaging itinatalaga; malinaw sa konteksto ang 'para sa silangan.'
- source_word: לְשֶׁלֶמְיָהוּ
  choice: kay Selemias
  rationale: Ang lamed ay nagmamarka sa tumanggap ng atas. Ginamit ang pamilyar na anyong Tagalog ng pangalan.
- source_word: וּזְכַרְיָהוּ בְנוֹ
  choice: Pagkatapos, nagpalabunutan sila para sa anak niyang si Zacarias
  rationale: Nililinaw nito ang ugnayang ama-anak at ang pagsunod ng ikalawang palabunutan nang hindi dinaragdagan ang nilalaman.
- source_word: יוֹעֵץ בְּשֶׂכֶל
  choice: isang tagapayo na may karunungan
  rationale: 'Pinananatili ang dalawang sangkap ng Hebreo: ang papel bilang tagapayo at ang katangiang sekel, na maaaring tumukoy sa karunungan, unawa, o kahusayan ng pagpapasya.'
- source_word: הִפִּילוּ גּוֹרָלוֹת
  choice: nagpalabunutan sila
  rationale: Ito ang natural na idyomang Tagalog para sa paghahagis o paggamit ng mga palabunot upang magtakda ng atas.
- source_word: וַיֵּצֵא גוֹרָלוֹ
  choice: ang nabunot para sa kanya ay
  rationale: Natural nitong ipinapahayag sa Tagalog ang lumabas na resulta ng palabunutan at iniiwasang ulitin ang naunang idyoma.
- source_word: צָפוֹנָה
  choice: ang hilaga
  rationale: Tumutukoy ito sa direksiyong o bahaging naitalaga kay Zacarias, katumbas ng naunang 'para sa silangan.'
