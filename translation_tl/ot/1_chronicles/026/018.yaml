base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/018.yaml
  text: 'For the Parbar on the west: four at the road[b][a], and two at the Parbar.'
translation:
  language: tl
  text: 'Sa Parbar[a] sa gawing kanluran: apat sa daan[b], at dalawa sa Parbar.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “Parbar” ay isang bihirang salitang Hebreo. Maaaring tumukoy ito sa isang nasasakupan, patyo, karugtong na gusali, o—ayon sa tradisyonal na salin—“labas na pook.” Hindi tiyak ang eksaktong bahaging tinutukoy.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “mataas na daanan” o “daang pilapil.”
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּרְבָּר
  choice: Parbar
  rationale: Napakadalang ng salitang Hebreo at hindi tiyak kung anong bahagi o lugar sa templo ang tinutukoy nito. Pinanatili ang transliterasyon upang hindi magtakda ng isang kahulugang hindi tiyak.
- source_word: מַעֲרָב
  choice: gawing kanluran
  rationale: Tumutukoy ito sa direksiyon o bahaging nasa kanluran; natural sa Filipino ang “sa gawing kanluran” sa paglalarawan ng lokasyon.
- source_word: אַרְבָּעָה
  choice: apat
  rationale: Tuwirang bilang ng mga bantay o puwestong nakatalaga sa lokasyong ito.
- source_word: מְסִלָּה
  choice: daan
  rationale: Maaaring tumukoy sa daan, mataas na daanan, o causeway. Ang “daan” ang pinakanatural at hindi labis na tiyak, habang inilalahad sa talababa ang ibang posibilidad.
- source_word: שְׁנַיִם
  choice: dalawa
  rationale: Tuwirang bilang para sa ikalawang pangkat na nakatalaga.
- source_word: לְ
  choice: sa
  rationale: Ang inuulit na pang-ukol ay nagtatakda ng kinalalagyan o puwesto ng mga bantay; malinaw at natural itong ipinahahayag ng “sa” sa Filipino.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang maikling anyo ng talaan ng mga puwesto at bilang sa Hebreo, at hindi nilinaw nang labis ang hindi tiyak na terminong pang-arkitektura.
