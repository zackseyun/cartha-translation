  text: וְ/כֹ֨ל הַֽ/הִקְדִּ֜ישׁ שְׁמוּאֵ֤ל הָ/רֹאֶה֙ וְ/שָׁא֣וּל בֶּן קִ֔ישׁ וְ/אַבְנֵ֣ר בֶּן נֵ֔ר וְ/יוֹאָ֖ב בֶּן צְרוּיָ֑ה כֹּ֚ל הַ/מַּקְדִּ֔ישׁ עַ֥ל יַד שְׁלֹמִ֖ית וְ/אֶחָֽי/ו־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/028.yaml
  text: And all that Samuel the seer[a], Saul son of Kish, Abner son of Ner[b], and Joab son of Zeruiah had dedicated—everything that anyone had dedicated—was under the care of Shelomith and his brothers.
translation:
  language: tl
  text: At ang lahat ng iniukol ni Samuel na tagakita[a], ni Saul na anak ni Kis, ni Abner na anak ni Ner, at ni Joab na anak ni Zeruia—ang lahat ng iniukol ng sinuman—ay nasa pangangasiwa ni Selomit at ng mga kapatid niya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “tagakita” ay salin ng Hebreong רֹאֶה (ro’eh), isang sinaunang tawag sa isang propetikong tao.
    reason: cultural_note
lexical_decisions:
- source_word: וְכֹל
  choice: At ang lahat
  rationale: Pinananatili ang kabuuang saklaw ng כֹּל at likas itong pakinggan bilang panimula ng talaan sa Filipino.
- source_word: הַהִקְדִּישׁ / הַמַּקְדִּישׁ
  choice: iniukol / iniukol ng sinuman
  rationale: Ang Hiphil ng קדשׁ ay tumutukoy sa pag-uukol ng mga bagay para sa banal na gamit. Ang “iniukol” ay mas angkop dito kaysa “itinalaga,” na sa modernong Filipino ay madalas tumukoy sa paghirang sa isang tao o tungkulin. Ang ikalawang parirala ay kolektibo at sumasaklaw sa sinumang nag-ukol.
- source_word: שְׁמוּאֵל הָרֹאֶה
  choice: Samuel na tagakita
  rationale: Pinananatili ng “tagakita” ang tiyak at mas matandang titulong Hebreo na רֹאֶה sa halip na ipantay agad ito sa mas pangkalahatang “propeta.”
- source_word: בֶּן
  choice: anak ni
  rationale: Tuwirang salin ng pormulang pangangkan na likas sa Filipino.
- source_word: עַל יַד
  choice: nasa pangangasiwa ni
  rationale: Sa kontekstong administratibo, ang idyoma ay nagpapahiwatig ng pananagutan o pamamahala, hindi literal na lokasyon sa kamay.
- source_word: שְׁלֹמִית וְאֶחָיו
  choice: Selomit at ng mga kapatid niya
  rationale: Isinalin ang pangalang שְׁלֹמִית bilang Selomit at ang אֶחָיו sa tuwirang kahulugang “mga kapatid niya,” na akma sa konteksto ng pangangasiwa ng isang angkan.
theological_decisions: []
translation_notes:
  register: 'Modernong Filipino na marangal at malinaw. Ginamit ang “iniukol” upang ipahiwatig ang sagradong paglalaan nang hindi nagdaragdag ng tahasang layon na wala sa talata. Pinanatili ang resumptibong pag-uulit na “ang lahat ng iniukol ng sinuman” dahil binibigyang-diin nito ang kabuuan ng mga bagay na saklaw. Ang mga pangalang Hebreo ay isina-Filipino ang baybay: Kis, Ner, Zeruia, at Selomit.'
