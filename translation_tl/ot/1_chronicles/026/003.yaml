  text: Si Elam ang ikalima, si Jehohanan ang ikaanim, si Eliehoenai ang ikapito.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֵילָם
  choice: Elam
  rationale: Pangalan ng tao; tinumbasan sa karaniwang anyong ginagamit sa makabagong saling Filipino.
- source_word: הַחֲמִישִׁי
  choice: ang ikalima
  rationale: May tiyak na pantukoy ang ordinal sa Hebreo. Likas sa Filipino ang pariralang “ang ikalima” sa ganitong talaan.
- source_word: יְהוֹחָנָן
  choice: Jehohanan
  rationale: Pangalan ng tao; pinanatili ang nakikilalang biblikal na anyo habang malapit sa Hebreong pangalan.
- source_word: הַשִּׁשִּׁי
  choice: ang ikaanim
  rationale: Isinalin bilang tiyak na ordinal at pinanatili ang paralelismo ng talaan.
- source_word: אֶלְיְהוֹעֵינַי
  choice: Eliehoenai
  rationale: Pangalan ng tao; ginamit ang nakikilalang transliterasyon na kumakatawan sa Hebreong anyo.
- source_word: הַשְּׁבִיעִי
  choice: ang ikapito
  rationale: Isinalin bilang tiyak na ordinal, kaayon ng dalawang naunang bilang.
