base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/029.yaml
  text: For the Izharites[a], Chenaniah and his sons were assigned to the outside work over Israel, as officers and judges.
translation:
  language: tl
  text: Sa mga Izharita, si Kenanias at ang kanyang mga anak na lalaki ay itinalaga sa gawaing panlabas[a] na may pananagutan sa Israel bilang mga opisyal at mga hukom.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “gawaing nasa labas”—mga tungkuling nasa labas ng pangunahing paglilingkod sa santuwaryo, na malamang ay mga pananagutang administratibo at panghukuman sa Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַיִּצְהָרִי
  choice: Sa mga Izharita
  rationale: Ang ל na may pangalan ng angkan ay nagpapakilala ng isang pangkat sa talaan. Likas sa Filipino ang “Sa mga Izharita.”
- source_word: כְּנַנְיָהוּ
  choice: Kenanias
  rationale: Isinalin sa baybay na madaling bigkasin sa Filipino ang pangalang Hebreo, nang hindi isinasalin ang kahulugan nito.
- source_word: וּבָנָיו
  choice: at ang kanyang mga anak na lalaki
  rationale: Tiyak na panlalaking maramihan ang בנים sa kontekstong pangangkan, kaya pinanatili ang “mga anak na lalaki.”
- source_word: לַמְּלָאכָה הַחִיצוֹנָה
  choice: itinalaga sa gawaing panlabas
  rationale: Ang מְלָאכָה ay gawain o tungkulin, at ang הַחִיצוֹנָה ay panlabas. Ipinahihiwatig ng talaan ang pagkakatalaga, kaya ginawa itong hayag para sa natural na Filipino.
- source_word: עַל יִשְׂרָאֵל
  choice: para sa Israel
  rationale: Maaaring ipahiwatig ng עַל ang saklaw ng pananagutan o pangangasiwa. Mas natural sa Filipino ang “para sa Israel” at hindi nito labis na pinatitindi ang ideya ng pamumuno.
- source_word: לְשֹׁטְרִים
  choice: bilang mga tagapangasiwa
  rationale: Ang שֹׁטְרִים dito ay mga opisyal na may tungkuling administratibo; iniiwasan ng “tagapangasiwa” ang makabagong kahulugang pulis o militar ng “opisyal.”
- source_word: וּלְשֹׁפְטִים
  choice: at mga hukom
  rationale: Tuwirang tumutukoy ang salita sa mga gumaganap ng tungkuling panghukuman.
theological_decisions:
- issue: Saklaw ng “gawaing panlabas”
  choice: Pinanatili ang malawak na pariralang “gawaing panlabas.”
  alternative: Mga tungkuling administratibo at panghukuman sa labas ng santuwaryo
  rationale: Hindi tahasang binabanggit sa Hebreo ang santuwaryo o ang buong saklaw ng gawain. Pinananatili ng salin ang pagiging malawak ng pahayag at hindi nagdaragdag ng tiyak na institusyonal na paliwanag.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “gawaing panlabas” upang manatiling malapit sa anyo at lawak ng Hebreo; ang kasunod na mga tungkulin ang nagbibigay ng administratibo at panghukumang konteksto.
