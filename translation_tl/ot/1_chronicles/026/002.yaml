  text: וְ/לִ/מְשֶֽׁלֶמְיָ֖הוּ בָּנִ֑ים זְכַרְיָ֤הוּ הַ/בְּכוֹר֙ יְדִֽיעֲאֵ֣ל הַ/שֵּׁנִ֔י זְבַדְיָ֨הוּ֙ הַ/שְּׁלִישִׁ֔י יַתְנִיאֵ֖ל הָ/רְבִיעִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/002.yaml
  text: 'And Shelemiah had sons: Zechariah the firstborn[a], Jediael the second, Zebadiah the third[b], and Jathniel the fourth.'
translation:
  language: tl
  text: At ang mga anak ni Selemias ay sina Zacarias na panganay[a], Jediel na ikalawa, Zebadias na ikatlo, at Jatniel na ikaapat.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “At kay Selemias, mga anak,” isang paraan ng pagpapahayag sa talaangkanan na nangangahulugang “Ang mga anak ni Selemias ay.”
    reason: cultural_note
  - marker: b
    text: Maaari ring “Yatniel,” na mas tuwirang kumakatawan sa unang katinig ng pangalang Hebreo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלִמְשֶׁלֶמְיָהוּ בָּנִים
  choice: At ang mga anak ni Selemias ay
  rationale: Ang literal na Hebreo ay isang walang-pandiwang konstruksiyong genealogical, ‘at kay Selemias, mga anak.’ Likas sa makabagong Tagalog ang ‘ang mga anak ni Selemias ay,’ habang pinananatili ng ‘At’ ang kaugnayan sa naunang talaan.
- source_word: זְכַרְיָהוּ
  choice: Zacarias
  rationale: Ginamit ang nakasanayang anyo ng pangalang biblikal sa Tagalog.
- source_word: הַבְּכוֹר
  choice: na panganay
  rationale: Tiyak na tumutukoy ang salita sa unang isinilang na anak na lalaki, kaya mas eksakto ang ‘panganay’ kaysa ‘una.’
- source_word: יְדִיעֲאֵל
  choice: Jediel
  rationale: Malinaw at likas na transliterasyon sa ortograpiyang Filipino ng pangalang Hebreo.
- source_word: הַשֵּׁנִי
  choice: na ikalawa
  rationale: Tuwirang salin ng ordinal at angkop sa pormal na talaang genealogical.
- source_word: זְבַדְיָהוּ
  choice: Zebadias
  rationale: Ginamit ang nakasanayang anyong biblikal sa Tagalog.
- source_word: הַשְּׁלִישִׁי
  choice: na ikatlo
  rationale: Tuwirang salin ng ordinal.
- source_word: יַתְנִיאֵל
  choice: Jatniel
  rationale: Transliterasyong madaling basahin sa Filipino; ang paunang Hebreong yod ay maaari ring katawanin ng Y, kaya inilagay ang ‘Yatniel’ bilang alternatibo sa talababa.
- source_word: הָרְבִיעִי
  choice: na ikaapat
  rationale: Tuwirang salin ng ordinal.
theological_decisions: []
