  yaml_path: translation/ot/1_chronicles/022/017.yaml
  text: Then David commanded all the leaders of Israel to help Solomon his son.
translation:
  language: tl
  text: Pagkatapos, iniutos ni David sa lahat ng pinuno ng Israel na tulungan ang anak niyang si Solomon.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְצַו
  choice: Pagkatapos, iniutos ni David
  rationale: Ang wayyiqtol ng צוה ay nagsusulong sa salaysay at nagpapahayag ng may-awtoridad na utos. Likas sa modernong Filipino ang “Pagkatapos” upang ihayag ang pagkakasunod-sunod.
- source_word: שָׂרֵי
  choice: mga pinuno
  rationale: Ang שָׂרִים ay tumutukoy sa mga namumuno o opisyal. Malinaw, malawak, at hindi lipas ang “mga pinuno.”
- source_word: לְכָל שָׂרֵי יִשְׂרָאֵל
  choice: sa lahat ng pinuno ng Israel
  rationale: Pinananatili nito ang pagiging saklaw ng lahat at ang ugnayang ipinahahayag ng “ng Israel,” nang hindi nagdaragdag ng tiyak na tungkulin.
- source_word: לַעְזֹר
  choice: na tulungan
  rationale: Ang infinitive na עזר ay nangangahulugang tumulong. Ang “tulungan” ang pinakadirekta at pinakanatural dito matapos ang pandiwang “iniutos.”
- source_word: לִשְׁלֹמֹה בְנוֹ
  choice: ang anak niyang si Solomon
  rationale: Malinaw at natural sa Filipino ang ayos na ito at pinananatili ang pagkakakilanlan ni Solomon bilang anak ni David.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na dignified ngunit madaling maunawaan. Ginamit ang “iniutos” upang mapanatili ang lakas ng awtoritatibong direktiba, at “pinuno” bilang malawak at kasalukuyang katawagan sa mga namumuno sa Israel.
