  text: and cedar timbers without number[a], for the Sidonians and Tyrians had brought cedar timbers in abundance to David.
translation:
  language: tl
  text: at kahoy na sedro na hindi mabilang ang dami,[a] sapagkat ang mga taga-Sidon at taga-Tiro ay nagdala kay David ng napakaraming kahoy na sedro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O kaya, “mga trosong sedro.” Maaaring tumukoy ang Hebreo sa materyal na sedro sa pangkalahatan, ngunit sa kontekstong ito ng pagtatayo, malamang na tumutukoy ito sa mga trosong gagamitin sa konstruksiyon.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַ/עֲצֵי אֲרָזִים
  choice: at napakaraming kahoy na sedro
  rationale: Sa konteksto ng mga materyales para sa pagtatayo, ang עֲצֵי אֲרָזִים ay tumutukoy sa kahoy na sedro, hindi sa mga punong nakatayo. Isinama rito ang diwa ng kasunod na לְאֵין מִסְפָּר bilang “napakarami.”
- source_word: לְ/אֵין מִסְפָּר
  choice: napakarami
  rationale: Ang idyoma ay literal na nagsasaad na walang bilang. Ang “napakarami” ay natural sa makabagong Tagalog at malinaw na nagpapahayag na hindi na mabilang ang dami.
- source_word: כִּי
  choice: sapagkat
  rationale: Nagpapakilala ito ng paliwanag kung bakit napakarami ng kahoy na sedro. Ang “sapagkat” ay malinaw at angkop sa marangal na salaysay.
- source_word: הֵבִיאוּ
  choice: nagdala
  rationale: Ang Hiphil perfect ay nagsasaad na nagdala sila. Hindi kailangang tahasang markahan sa Tagalog ang past perfect; malinaw sa ugnayang sanhi at sa konteksto na nauna ang pagdadala.
- source_word: הַ/צִּידֹנִים
  choice: ang mga taga-Sidon
  rationale: Natural at madaling maunawaang Tagalog na katawagan sa mga naninirahan sa Sidon.
- source_word: וְ/הַ/צֹּרִים
  choice: at mga taga-Tiro
  rationale: Natural na Tagalog na katawagan sa mga naninirahan sa Tiro at maayos na kaparis ng “mga taga-Sidon.”
- source_word: לָ/רֹב
  choice: saganang
  rationale: Ipinapahayag nito ang malaking dami ng materyal. Ang “saganang kahoy” ay natural at pinananatili ang diin sa kasaganaan.
- source_word: לְ/דָוִד
  choice: kay David
  rationale: Minamarkahan ng ל ang tumanggap; ang “kay David” ang tuwirang katumbas sa Tagalog.
