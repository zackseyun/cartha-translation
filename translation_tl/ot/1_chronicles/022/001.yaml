id: 1CH.22.1
reference: 1 Chronicles 22:1
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר דָּוִ֔יד זֶ֣ה ה֔וּא בֵּ֖ית יְהוָ֣ה הָ/אֱלֹהִ֑ים וְ/זֶה מִּזְבֵּ֥חַ לְ/עֹלָ֖ה לְ/יִשְׂרָאֵֽל־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/001.yaml
  text: Then David said[a], “This is the house of Yahweh God[b], and this is the altar for burnt offering for Israel.”
translation:
  language: tl
  text: Pagkatapos ay sinabi ni David, “Ito ang bahay[a] ni Yahweh na Diyos, at ito ang altar para sa handog na sinusunog[b] para sa Israel.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “templo.” Sa Hebreo, “bahay.”
    reason: lexical_alternative
  - marker: b
    text: O “mga handog na sinusunog.” Maaaring unawain sa pangkalahatan o kolektibong diwa ang isahang anyo sa Hebreo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Pagkatapos ay sinabi
  rationale: Isinusulong ng waw-consecutive ang salaysay; natural sa modernong Filipino ang “Pagkatapos ay sinabi” at pinananatili nito ang pagkakasunod-sunod.
- source_word: דָּוִיד
  choice: David
  rationale: Karaniwang anyo ng pangalang ito sa Filipino.
- source_word: זֶה הוּא
  choice: Ito ang
  rationale: Pinananatili nito ang mariing pagtukoy ng demonstratibo at panghalip nang hindi idinaragdag ang interpretasyong “ito ang lugar.”
- source_word: בֵּית
  choice: bahay
  rationale: Literal na “bahay” ang Hebreo. Bagaman ang tinutukoy ay ang magiging templo, pinananatili ng “bahay” ang larawan at teolohikal na alingawngaw ng pinagmulang teksto.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ng personal na pangalang “Yahweh” ang Tetragrammaton sa halip na palitan ito ng isang titulo.
- source_word: הָאֱלֹהִים
  choice: na Diyos
  rationale: Ang pariralang “Yahweh na Diyos” ay natural na Filipino na nagpapakitang ang אֱלֹהִים ay kaugnay na katawagan sa banal na pangalan.
- source_word: מִּזְבֵּחַ
  choice: altar
  rationale: Ito ang karaniwan at malinaw na katawagan sa Filipino para sa estrukturang pinaghahandugan.
- source_word: לְעֹלָה
  choice: para sa handog na sinusunog
  rationale: Pinananatili ang isahang anyo ng Hebreo at ang natatanging uri ng handog, habang natural pa rin sa Filipino; maaari rin itong maunawaan bilang pangkalahatan o kolektibo.
- source_word: לְיִשְׂרָאֵל
  choice: para sa Israel
  rationale: Maikli at tapat itong nagpapahayag ng kaugnayan o layunin para sa bayang Israel nang hindi nagpapalawak nang hindi kailangan.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; ang PANGINOON
  rationale: Personal na banal na pangalan ang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang pangalan sa halip na palitan ito ng titulo.
- issue: Kung isasalin ang בֵּית bilang “bahay” o “templo”
  choice: bahay
  alternative: templo
  rationale: “Bahay” mismo ang salita sa Hebreo. Kahit tumutukoy ang konteksto sa magiging templo, iniiwasan nitong gawing tahasan sa salin ang isang kontekstuwal na interpretasyon.
- issue: Bilang ng עֹלָה
  choice: handog na sinusunog
  alternative: mga handog na sinusunog
  rationale: Isahan ang pangngalan sa Hebreo ngunit maaari itong gamitin sa pangkalahatan o kolektibong diwa. Pinananatili sa pangunahing teksto ang isahan at itinatala sa talababa ang posibleng kolektibong pagbasa.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Pinanatili ang “bahay” at “Yahweh” dahil mas malapit ang mga ito sa tekstong Hebreo; ginamit ang pamilyar na “altar” at ang malinaw na “handog na sinusunog.” Inilipat ang mga panandang talababa sa mismong mga salitang tinatalakay ng mga ito upang maiwasan ang maling pagkakaugnay.
