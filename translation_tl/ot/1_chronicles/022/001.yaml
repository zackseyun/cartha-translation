  source_fidelity: 'Tapat ang salin sa Hebreo: naipapahayag ang pagsulong ng salaysay sa וַיֹּאמֶר, ang mariing pagtukoy na “Ito ang,” ang literal na “bahay,” ang banal na pangalang “Yahweh,” at ang kaugnayan ng altar at handog na sinusunog sa Israel. Hindi nito idinadagdag ang “lugar” o tahasang “templo” sa pangunahing teksto.'
  naturalness: Natural at marangal ang modernong Filipino. Ang “bahay ni Yahweh na Diyos” ay katanggap-tanggap na paraan upang ipahayag ang appositional na “Yahweh God,” at ang pag-uulit ng “para sa” ay bahagyang pormal ngunit malinaw at malapit sa saklaw ng Hebreo.
  terminology: Ang “Yahweh,” “bahay,” “altar,” at “handog na sinusunog” ay magkakatugma sa target na register at sa lexical na mga pasya. Ang mga talababa ay wastong nakaangkla sa “bahay” at “handog na sinusunog,” at maayos na inilalahad ang alternatibong “templo” at ang generic/kolektibong gamit ng isahang עֹלָה.
