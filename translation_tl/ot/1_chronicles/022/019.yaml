base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/019.yaml
  text: Now set your heart and your soul to seek Yahweh your God[a]. Rise up and build the sanctuary of Yahweh God[b], to bring the ark of the covenant of Yahweh and the holy vessels of God into the house that is to be built for the name of Yahweh.
translation:
  language: tl
  text: Ngayon, ialay ninyo ang inyong puso at kaluluwa upang hanapin si Yahweh na inyong Diyos.[a] Tumindig kayo at itayo ang santuwaryo ni Yahweh, ang Diyos, upang dalhin ang kaban ng tipan ni Yahweh at ang mga banal na kagamitan ng Diyos sa bahay[b] na itatayo para sa pangalan ni Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “ibigay ninyo ang inyong puso at kaluluwa” upang hanapin si Yahweh na inyong Diyos.'
    reason: lexical_alternative
  - marker: b
    text: Ang “bahay” dito ay tumutukoy sa gusaling templo na itatayo para sa pangalan ni Yahweh.
    reason: cultural_note
lexical_decisions:
- source_word: עַתָּה
  choice: Kaya ngayon
  rationale: Nagsisilbi itong pananda sa kasalukuyang mahalagang panawagan; ipinahihiwatig ng “Kaya” ang ugnay sa naunang tagubilin, habang nananatili ang temporal na diin ng “ngayon.”
- source_word: תְּנוּ לְבַבְכֶם וְנַפְשְׁכֶם
  choice: ituon ninyo ang inyong puso at kaluluwa
  rationale: Literal itong “ibigay ninyo ang inyong puso at kaluluwa,” ngunit likas sa modernong Tagalog ang “ituon” para sa kusang-loob at buong pagpapasyang maghanap sa Diyos; pinanatili ang dalawang salitang antropolohikal.
- source_word: לִדְרוֹשׁ
  choice: sa paghahanap
  rationale: Ang דרשׁ kapag ang Diyos ang layon ay tumutukoy sa masigasig na paghahanap sa kanya, kalakip ang pagsangguni, pagtitiwala, at debosyon; hindi ito pinaliit sa intelektuwal na pagsisiyasat lamang.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ang pangalan ng Diyos sa Hebreo bilang “Yahweh,” sa halip na palitan ito ng titulong “PANGINOON.”
- source_word: וְקוּמוּ וּבְנוּ
  choice: Tumindig kayo at itayo ninyo
  rationale: Pinananatili ang dalawang magkaugnay na pautos at ang marangal ngunit makabagong himig; ang “tumindig” ay higit na angkop kaysa kolokyal na “bumangon” sa pampublikong panawagan.
- source_word: מִקְדַּשׁ
  choice: santuwaryo
  rationale: Tumutukoy sa banal na dako o gusaling inilaan sa Diyos. Naiiba ito sa kasunod na בַּיִת, kaya hindi kapwa isinaling “templo.”
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: kaban ng tipan ni Yahweh
  rationale: Malinaw at likas na Tagalog na nagpapanatili sa ugnayang genitibo ng kaban, tipan, at Yahweh.
- source_word: וּכְלֵי קֹדֶשׁ הָאֱלֹהִים
  choice: mga banal na kagamitan ng Diyos
  rationale: Ang כְּלֵי ay mga sisidlan o kagamitang ginagamit sa banal na paglilingkod; ang mas malawak na “kagamitan” ay nagpapanatili sa saklaw nang hindi nililimitahan sa mga sisidlan lamang.
- source_word: לַבַּיִת הַנִּבְנֶה לְשֵׁם יְהוָה
  choice: sa bahay na itatayo para sa pangalan ni Yahweh
  rationale: Pinanatili ang metapora ng “bahay” at ang teolohikal na pariralang “para sa pangalan,” sa halip na ipaliwanag ito bilang presensiya o karangalan lamang.
theological_decisions:
- issue: Paglalarawan sa pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON o Jehova
  rationale: Ang teksto ay gumagamit ng personal na pangalang tipan na יהוה. Pinananatili ng “Yahweh” ang pagkakaiba nito sa mga titulong אֱלֹהִים at אֲדֹנָי.
- issue: Ang pares na “puso at kaluluwa”
  choice: Pinanatili nang magkahiwalay ang “puso” at “kaluluwa”
  alternative: “buong pagkatao” o “isip at kalooban”
  rationale: Pinalalakas ng dalawang terminong Hebreo ang panawagan sa lubos na pagtatalaga, ngunit hindi kinakailangang magtakda ng teknikal na paghahati sa mga sangkap ng tao. Ang pagpapanatili sa dalawa ay umiiwas sa sobrang pagpapakahulugan.
- issue: Ang “pangalan ni Yahweh”
  choice: Pinanatili ang mismong idyomang “para sa pangalan ni Yahweh”
  alternative: “para sa karangalan ni Yahweh” o “kung saan mananahan si Yahweh”
  rationale: Mayaman at hindi lubusang nilulutas ng teksto ang kaugnayan ng pangalan, presensiya, pagsamba, at pag-aangkin ng Diyos; ang literal ngunit natural na anyo ay nagpapanatili sa teolohikal na saklaw nito.
- issue: Ugnayan ng “santuwaryo” at “bahay”
  choice: Isinalin bilang magkaibang ngunit magkaugnay na katawagan
  alternative: Parehong “templo”
  rationale: Ang מִקְדָּשׁ ay nagbibigay-diin sa kabanalan ng lugar, samantalang ang בַּיִת ay tumutukoy sa gusaling itatayo. Ang pagkakaiba ay nasa Hebreo at mahalagang mapanatili.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang maramihang “ninyo/kayo” ayon sa mga pautos na plural sa Hebreo. Pinanatili ang mga terminong “santuwaryo,” “kaban ng tipan,” at “para sa pangalan ni Yahweh” dahil pamilyar ang mga ito sa wikang biblikal ngunit nauunawaan pa rin ng karaniwang mambabasa.
