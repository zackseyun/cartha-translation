  text: הִנֵּה בֵ֞ן נוֹלָ֣ד לָ֗/ךְ ה֤וּא יִהְיֶה֙ אִ֣ישׁ מְנוּחָ֔ה וַ/הֲנִח֥וֹתִי ל֛/וֹ מִ/כָּל אוֹיְבָ֖י/ו מִ/סָּבִ֑יב כִּ֤י שְׁלֹמֹה֙ יִהְיֶ֣ה שְׁמ֔/וֹ וְ/שָׁל֥וֹם וָ/שֶׁ֛קֶט אֶתֵּ֥ן עַל יִשְׂרָאֵ֖ל בְּ/יָמָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/009.yaml
  text: Behold[a], a son will be born to you. He will be a man of rest, and I will give him rest from all his enemies all around; for Solomon will be his name[b], and I will give peace and quiet to Israel in his days.
translation:
  language: tl
  text: Narito, isisilang sa iyo ang isang anak na lalaki. Siya ay magiging isang taong may kapanatagan, at bibigyan ko siya ng kapanatagan mula sa lahat ng kanyang kaaway sa lahat ng panig. Sapagkat Solomon ang magiging pangalan niya,[a] at bibigyan ko ang Israel ng kapayapaan at katahimikan sa mga araw niya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang pangalang “Solomon” (Hebreo, Shelomoh) ay iniuugnay rito sa salitang shalom, “kapayapaan.” Iniuugnay rin ng talata ang kanyang mga araw sa kapanatagan.
    reason: cultural_note
lexical_decisions:
- source_word: הִנֵּה
  choice: Narito
  rationale: Pinananatili ang puwersang tumatawag-pansin ng Hebreo sa isang marangal at pamilyar na anyo sa makabagong Tagalog.
- source_word: בֵן נוֹלָד לָךְ
  choice: isang anak na lalaki ang isisilang sa iyo
  rationale: Ipinakikilala ang ipinangakong anak at ipinahahayag bilang pangyayari sa hinaharap ayon sa konteksto, kahit participle ang anyong Hebreo.
- source_word: אִישׁ מְנוּחָה
  choice: isang taong may kapanatagan
  rationale: Ang “kapanatagan” ay likas na Tagalog para sa kalagayang hindi ginugulo at pinananatiling bukod sa kasunod na שָׁלוֹם, “kapayapaan.”
- source_word: וַהֲנִחוֹתִי לוֹ
  choice: at bibigyan ko siya ng kapanatagan
  rationale: Inuulit ang “kapanatagan” upang mapanatili ang ugnayang leksikal sa אִישׁ מְנוּחָה at malinaw na Diyos ang magkakaloob nito.
- source_word: מִכָּל אוֹיְבָיו מִסָּבִיב
  choice: mula sa lahat ng kaaway niya sa palibot
  rationale: Pinananatili kapwa ang kabuuang saklaw ng “lahat” at ang diwa ng mga kaaway sa lahat ng panig.
- source_word: שְׁלֹמֹה יִהְיֶה שְׁמוֹ
  choice: Solomon ang magiging pangalan niya
  rationale: Pinananatili ang diin ng ayos-Hebreo sa pangalang Solomon habang nananatiling natural sa Tagalog.
- source_word: וְשָׁלוֹם וָשֶׁקֶט
  choice: kapayapaan at katahimikan
  rationale: 'Ginagawang magkahiwalay ang dalawang salitang Hebreo: ang shalom bilang kapayapaan at ang sheqet bilang tahimik at ligtas na kalagayan.'
- source_word: בְּיָמָיו
  choice: sa panahon niya
  rationale: Natural na idyomang Tagalog para sa panahong saklaw ng kanyang buhay at paghahari.
theological_decisions:
- issue: Ugnayan ng kapanatagan, pangalang Solomon, at kapayapaan
  choice: Gamitin ang “kapanatagan” para sa מְנוּחָה at kaugnay na pandiwa, at “kapayapaan” para sa שָׁלוֹם; panatilihin ang pangalang “Solomon” at ipaliwanag ang tunog-ugnayan sa talababa.
  alternative: Isalin ang אִישׁ מְנוּחָה bilang “taong mapayapa” upang gawing mas lantad ang tema ng kapayapaan.
  rationale: Pinananatili nito ang magkakaibang salitang Hebreo at ang pag-uulit ng ugat na may diwang “pahinga/kapanatagan,” nang hindi pinapantay ang lahat sa shalom. Hindi rin nito ginagawang etimolohikong pagsasalin ang personal na pangalan.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ang “Narito” ay bahagyang pormal upang mapanatili ang solemneng pagpapahayag; ang “kapanatagan” ay nagpapanatili sa temang pahinga at seguridad nang hindi ito hinahalo sa “kapayapaan.”
