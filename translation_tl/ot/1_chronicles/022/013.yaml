    issue: Hindi gaanong idiomatiko ang “iingatan mong tuparin.”
    rationale: Maaaring maunawaan ang “ingatan” bilang pag-iingat o pagprotekta sa mismong pagtupad, sa halip na maingat na pagsunod. Ang “maingat mong tutuparin” ay tuwirang naghahatid ng ‘mag-ingat upang gawin’ nang mas natural.
