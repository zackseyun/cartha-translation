  text: אָ֣ז תַּצְלִ֔יחַ אִם תִּשְׁמ֗וֹר לַ/עֲשׂוֹת֙ אֶת הַֽ/חֻקִּ֣ים וְ/אֶת הַ/מִּשְׁפָּטִ֔ים אֲשֶׁ֨ר צִוָּ֧ה יְהוָ֛ה אֶת מֹשֶׁ֖ה עַל יִשְׂרָאֵ֑ל חֲזַ֣ק וֶ/אֱמָ֔ץ אַל תִּירָ֖א וְ/אַל תֵּחָֽת־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/013.yaml
  text: Then you will prosper[a], if you are careful to do the statutes and the judgments that Yahweh commanded Moses for Israel. Be strong and courageous. Do not fear[b], and do not be dismayed.
translation:
  language: tl
  text: Kung magkagayon, magtatagumpay ka[a] kung maingat mong tutuparin ang mga tuntunin at mga hatol na iniutos ni Yahweh kay Moises para sa Israel. Magpakatatag ka at lakasan mo ang iyong loob. Huwag kang matakot at huwag panghinaan ng loob.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “uunlad ka.” Ang pandiwang Hebreo ay maaaring mangahulugang magtagumpay o umunlad.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: Kung magkagayon
  rationale: Ipinahahayag nito ang resultang kasunod ng naunang tagubilin; natural itong panandang bunga sa makabagong Tagalog.
- source_word: תַּצְלִיחַ
  choice: magtatagumpay ka
  rationale: Ang Hiphil ng צלח ay maaaring tumukoy sa pagtatagumpay o pag-unlad; ang “magtatagumpay” ay natural at hindi awtomatikong nagpapahiwatig ng materyal na kasaganaan.
- source_word: אִם תִּשְׁמֹר לַעֲשׂוֹת
  choice: kung iingatan mong tuparin
  rationale: Pinananatili ng “iingatan” ang diwa ng maingat na pagbabantay o pagsunod, habang malinaw na ipinahahayag ng “tuparin” ang aktuwal na paggawa.
- source_word: הַחֻקִּים
  choice: mga tuntunin
  rationale: Ang “mga tuntunin” ay dignidad ngunit madaling maunawaang legal na katawagan at naihihiwalay sa kasunod na מִשְׁפָּטִים.
- source_word: הַמִּשְׁפָּטִים
  choice: mga hatol
  rationale: Pinananatili nito ang legal at hudisyal na kulay ng salita at ang pagkakaiba nito sa חֻקִּים.
- source_word: אֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה עַל יִשְׂרָאֵל
  choice: na iniutos ni Yahweh kay Moises para sa Israel
  rationale: Tinatrato si Moises bilang tuwirang inutusan at ang Israel bilang saklaw o nilalayong tumanggap ng mga utos.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ang pangalang tipan na יהוה ayon sa pamantayan ng proyekto.
- source_word: חֲזַק וֶאֱמָץ
  choice: Magpakatatag ka at lakasan mo ang iyong loob
  rationale: Natural na modernong Tagalog para sa pares na panawagang maging malakas at matapang, nang hindi nawawala ang bigat nito.
- source_word: אַל תִּירָא
  choice: Huwag kang matakot
  rationale: Tuwiran, malinaw, at karaniwang salin ng pagbabawal.
- source_word: וְאַל תֵּחָת
  choice: at huwag panghinaan ng loob
  rationale: Ipinahahayag ang pagiging nasisiraan ng loob o nadudurog ang tapang sa natural na Tagalog.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Ginagamit ng tekstong Hebreo ang Tetragrammaton; pinananatili ang personal na pangalang tipan sa halip na palitan ng isang titulo.
- issue: Ugnayan ng tagumpay at pagsunod
  choice: 'Pinananatili ang kondisyonal na pahayag: “magtatagumpay ka ... kung iingatan mong tuparin”'
  alternative: Gawing ganap at walang kondisyon ang pangako ng tagumpay
  rationale: Malinaw sa אִם ang kondisyon; hindi dapat alisin ang tensiyon ng pangako at responsableng pagsunod.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang pagkakaiba ng dalawang legal na katawagang Hebreo sa “mga tuntunin” at “mga hatol,” at iniwasan ang “sasagana” upang hindi paliitin ang tagumpay sa materyal na kasaganaan.
