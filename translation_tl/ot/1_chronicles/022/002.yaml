  text: וַ/יֹּ֣אמֶר דָּוִ֔יד לִ/כְנוֹס֙ אֶת הַ/גֵּרִ֔ים אֲשֶׁ֖ר בְּ/אֶ֣רֶץ יִשְׂרָאֵ֑ל וַ/יַּעֲמֵ֣ד חֹֽצְבִ֗ים לַ/חְצוֹב֙ אַבְנֵ֣י גָזִ֔ית לִ/בְנ֖וֹת בֵּ֥ית הָ/אֱלֹהִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/002.yaml
  text: And David ordered the foreigners who were in the land of Israel to be gathered[c][b][a], and he appointed stonecutters to cut dressed stones for building the house of God.
translation:
  language: tl
  text: Iniutos ni David na tipunin ang mga dayuhang naninirahan[a] sa lupain ng Israel. Nagtalaga siya ng mga tagatabas ng bato upang tumabas ng mga batong tinabas[b] para sa pagtatayo ng bahay ng Diyos[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga dayuhan” o “mga naninirahang dayuhan.” Tumutukoy ang Hebreo sa mga hindi Israelitang naninirahan sa lupain.
    reason: lexical_alternative
  - marker: b
    text: O “mga batong inihugis.”
    reason: lexical_alternative
  - marker: c
    text: Ibig sabihin, ang templo.
    reason: cross_reference
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Iniutos
  rationale: Bagaman literal na “sinabi,” ang kasunod na pawatas na לִכְנוֹס ay nagpapahayag ng utos o tagubilin. Likas na ipinahihiwatig ng “iniutos” ang puwersa ng konstruksyon.
- source_word: לִכְנוֹס
  choice: na tipunin
  rationale: Ipinahahayag ng pawatas ang nilalaman ng utos ni David. Ang anyong balintiyak ay nagpapakitang ipinagagawa niya sa iba ang pagtitipon.
- source_word: הַגֵּרִים
  choice: mga dayuhang naninirahan
  rationale: Tumutukoy ang גֵּרִים sa mga hindi katutubong naninirahan sa lupain, hindi lamang sa mga panandaliang bisita. Malinaw at likas sa makabagong Filipino ang pariralang ito.
- source_word: בְּאֶרֶץ יִשְׂרָאֵל
  choice: sa lupain ng Israel
  rationale: Pinananatili ang tahasang אֶרֶץ (“lupain”) at ang teritoryal na diwa ng pahayag.
- source_word: וַיַּעֲמֵד
  choice: Nagtalaga siya
  rationale: Sa konteksto, nangangahulugan itong pag-aatas o paglalagay ng mga manggagawa sa isang gawain.
- source_word: חֹצְבִים
  choice: mga tagatabas ng bato
  rationale: Tumutukoy ang participle sa mga manggagawang pumuputol o tumatabas ng bato. Ang salin ay malinaw at angkop sa gawaing pagtatayo.
- source_word: לַחְצוֹב
  choice: upang tumabas
  rationale: Pinananatili ang layuning ipinahahayag ng pawatas at ang pag-uulit ng ugat na kaugnay ng חֹצְבִים.
- source_word: אַבְנֵי גָזִית
  choice: mga batong hinugisan
  rationale: Tumutukoy ang parirala sa mga batong tinabas at inihugis bilang materyales sa pagtatayo. Ipinahihiwatig ng “hinugisan” na ang mga ito ay inihanda, hindi basta kinuha lamang sa tibagan.
- source_word: לִבְנוֹת
  choice: para sa pagtatayo
  rationale: Likas na ipinapahayag sa Filipino ang layunin ng paghahanda ng mga bato.
- source_word: בֵּית הָאֱלֹהִים
  choice: bahay ng Diyos
  rationale: Pinananatili ang literal na larawan ng Hebreong parirala sa halip na agad itong palitan ng interpretatibong “templo,” bagaman iyon ang tinutukoy sa konteksto.
theological_decisions:
- issue: Pagkakasalin ng בֵּית הָאֱלֹהִים
  choice: bahay ng Diyos
  alternative: templo ng Diyos
  rationale: Ang proyekto ay ang templong itatayo, ngunit “bahay ng Diyos” ang mismong Hebreong pananalita. Pinananatili ito sa pangunahing teksto at nililinaw ang tinutukoy sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mga dayuhang naninirahan” upang maiwasan ang burukratikong tunog ng “residenteng dayuhan” at ang posibleng pansamantalang diwa ng “mga nakikipamayan.” Pinanatili ang “bahay ng Diyos” upang masundan ang Hebreong larawan habang nililinaw sa talababa ang tinutukoy.
