  to: Iniutos ni David na tipunin ang mga dayuhang naninirahan[a] sa lupain ng Israel. Nagtalaga siya ng mga tagatabas ng bato upang tumabas ng mga batong tinabas[b] para sa pagtatayo ng bahay ng Diyos[c].
  rationale: Pinalitan ang “mga batong hinugisan” ng “mga batong tinabas” upang maging natural at tiyak ang terminong pangkonstruksiyon, habang pinananatili ang pag-uulit ng ugat na nasa Hebreo sa “mga tagatabas ... tumabas.” Inayos din ang talababa b upang manatili itong tunay na alternatibong leksikal.
