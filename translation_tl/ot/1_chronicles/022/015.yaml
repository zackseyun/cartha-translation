base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/015.yaml
  text: 'And with you in abundance are workers for the task: stonecutters[a], and craftsmen of stone and wood, and every skilled man for every kind of work.'
translation:
  language: tl
  text: 'Kasama mo rin ang napakaraming manggagawa: mga tagatabas ng bato, mga bihasang manggagawa sa bato at kahoy, at lahat ng taong bihasa sa bawat uri ng gawain.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “bawat bihasang lalaki,” isang panlalaking isahang anyo na ginagamit dito bilang kinatawan ng mga bihasang manggagawa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעִמְּךָ לָרֹב
  choice: Kasama mo rin ang napakarami
  rationale: Pinananatili nito ang tuwirang pakikipag-usap kay Solomon at ang diwa ng napakaraming taong naroon at handang tumulong. Ang “rin” ay likas na naghuhugnay sa naunang talata.
- source_word: עֹשֵׂי מְלָאכָה
  choice: manggagawa
  rationale: Tumutukoy ito sa mga taong gumagawa ng kinakailangang gawain para sa proyekto; malinaw at natural sa makabagong Tagalog ang “manggagawa.”
- source_word: חֹצְבִים
  choice: mga tagatabas ng bato
  rationale: Ang pandiwa ay tumutukoy sa pagtabas o pagkuha ng matigas na materyal. Sa konteksto ng pagtatayo, bato ang ipinahihiwatig na layon.
- source_word: וְחָרָשֵׁי אֶבֶן וָעֵץ
  choice: mga bihasang manggagawa sa bato at kahoy
  rationale: Ipinahahayag ng חָרָשׁ ang sanay na manggagawa o artisan. Ang salin ay malinaw na tumutukoy sa dalawang materyales nang hindi gumagamit ng lipas o labis na teknikal na katawagan.
- source_word: וְכָל חָכָם בְּכָל מְלָאכָה
  choice: at lahat ng taong bihasa sa bawat uri ng gawain
  rationale: Sa kontekstong ito, ang חָכָם ay praktikal na kasanayan, hindi lamang karunungang pangkaisipan. Ang “bawat uri ng gawain” ay natural na nagpapahayag ng lawak ng mga kasanayang kailangan.
theological_decisions:
- issue: Kasariang ipinahihiwatig ng anyong panlalaking isahan na חָכָם
  choice: lahat ng taong bihasa
  alternative: bawat bihasang lalaki
  rationale: Panlalaking isahan ang anyong Hebreo ngunit ginagamit nang kumakatawan sa pangkat ng mga bihasang manggagawa. Ang “taong bihasa” ay likas sa Tagalog at hindi nagdaragdag ng eksklusibong pagtukoy sa mga lalaki; nililinaw sa talababa ang literal na anyo.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog. Iniwasan ang mga lipas na salitang panghanapbuhay, habang pinanatili ang tuwirang pakikipag-usap kay Solomon, ang kasaganaan ng mga manggagawa, at ang praktikal na diwa ng kasanayan.
