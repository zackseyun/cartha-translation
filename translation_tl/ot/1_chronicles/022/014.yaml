reference: 1 Chronicles 22:14
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/הִנֵּ֨ה בְ/עָנְיִ֜/י הֲכִינ֣וֹתִי לְ/בֵית יְהוָ֗ה זָהָ֞ב כִּכָּרִ֤ים מֵֽאָה אֶ֨לֶף֙ וְ/כֶ֗סֶף אֶ֤לֶף אֲלָפִים֙ כִּכָּרִ֔ים וְ/לַ/נְּחֹ֤שֶׁת וְ/לַ/בַּרְזֶל֙ אֵ֣ין מִשְׁקָ֔ל כִּ֥י לָ/רֹ֖ב הָיָ֑ה וְ/עֵצִ֤ים וַ/אֲבָנִים֙ הֲכִינ֔וֹתִי וַ/עֲלֵי/הֶ֖ם תּוֹסִֽיף־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/014.yaml
  text: Behold[a], in my affliction I have prepared for the house of Yahweh one hundred thousand talents of gold, and one million talents of silver; and for the bronze and the iron there is no weighing, for it was in abundance. I have prepared timber and stones[c][b], and you may add to them.
translation:
  language: tl
  text: Masdan, sa aking paghihirap[a] ay naghanda ako para sa bahay ni Yahweh ng isang daang libong talento ng ginto at isang milyong talento ng pilak[b]. Ang tanso at bakal naman ay hindi na matimbang, sapagkat napakarami ng mga ito. Naghanda rin ako ng mga kahoy at bato, at maaari ka pang magdagdag sa mga iyon[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa aking karalitaan.” Ang salitang Hebreo ay maaaring tumukoy sa paghihirap, pagdurusa, o karalitaan.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “isang libong libo.”
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “at magdagdag ka pa sa mga iyon.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Masdan
  rationale: Isinasalin nito ang pantawag-pansing הִנֵּה nang hindi nagdaragdag ng temporal na diwang gaya ng “ngayon.”
- source_word: בְעָנְיִי
  choice: sa gitna ng aking paghihirap
  rationale: Ang עֳנִי ay maaaring tumukoy sa paghihirap, pagdurusa, o karalitaan. Ang “paghihirap” ang pinakamalawak at pinakanatural sa konteksto, habang pinananatili sa talababa ang posibleng “karalitaan.”
- source_word: הֲכִינוֹתִי
  choice: naghanda ako
  rationale: Ang Hiphil ng כון ay nangangahulugang maghanda o ihanda; malinaw at natural ang aspektong nakumpleto sa Tagalog.
- source_word: לְבֵית יְהוָה
  choice: para sa bahay ni Yahweh
  rationale: Pinananatili ng “bahay” ang Hebreong metapora at teolohikal na diwa, bagaman templo ang tinutukoy sa konteksto.
- source_word: כִּכָּרִים
  choice: talento
  rationale: Ang כִּכָּר ay isang malaking sinaunang yunit ng timbang; “talento” ang nakaugaliang terminong biblikal sa Tagalog.
- source_word: אֶלֶף אֲלָפִים
  choice: isang milyong
  rationale: Ito ang malinaw na makabagong pagpapahayag ng bilang; inilalagay sa talababa ang literal na “isang libong libo.”
- source_word: וְלַנְּחֹשֶׁת וְלַבַּרְזֶל אֵין מִשְׁקָל
  choice: Ang tanso at bakal naman ay walang sukat na timbang
  rationale: Pinananatili nito ang pahayag na walang ibinigay o maisaad na timbang, nang hindi ipinahihiwatig na literal na walang bigat ang mga metal.
- source_word: כִּי לָרֹב הָיָה
  choice: sapagkat napakarami ng mga ito
  rationale: Ipinakikita nito na ang labis na dami ang dahilan kung bakit walang sukat na timbang na ibinigay.
- source_word: וְעֵצִים וַאֲבָנִים
  choice: mga kahoy at bato
  rationale: Sa konteksto ng pagtatayo, likas na tumutukoy ang עֵצִים sa kahoy na materyales, kasama ng mga bato.
- source_word: וַעֲלֵיהֶם תּוֹסִיף
  choice: at maaari mo pang dagdagan ang mga iyon
  rationale: Maaaring marinig ang imperfect bilang pahintulot o bilang tagubilin. Ang pangunahing salin ay banayad na pahintulot; pinananatili sa talababa ang mas mariing pagbasa.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang ginagamit ng Hebreo ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalang tipan nang hindi ito pinapalitan ng isang titulo.
- issue: Ang “bahay” bilang tawag sa templo
  choice: bahay ni Yahweh
  alternative: templo ni Yahweh
  rationale: Bagaman templo ang tinutukoy, pinananatili ng “bahay” ang mismong larawan at teolohikal na taginting ng בַּיִת.
translation_notes:
  register: Makabago ngunit marangal na Filipino ang ginamit. Pinanatili ang “bahay ni Yahweh” at “talento” bilang pamilyar na wikang biblikal, habang iniwasan ang labis na literal ngunit malabong pariralang magmumukhang walang pisikal na bigat ang tanso at bakal. Inayos ang mga pananda ng talababa ayon sa mismong pariralang tinutukoy ng bawat isa.
