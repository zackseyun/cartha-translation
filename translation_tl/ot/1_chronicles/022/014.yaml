revisions:
- from: Masdan, sa gitna ng aking paghihirap[a] ay naghanda ako para sa bahay ni Yahweh ng isang daang libong talento ng ginto at isang milyong talento ng pilak[b]. Ang tanso at bakal naman ay walang sukat na timbang, sapagkat napakarami ng mga ito. Naghanda rin ako ng mga kahoy at bato, at maaari mo pang dagdagan ang mga iyon.[c]
  to: Masdan, sa aking paghihirap[a] ay naghanda ako para sa bahay ni Yahweh ng isang daang libong talento ng ginto at isang milyong talento ng pilak[b]. Ang tanso at bakal naman ay hindi na matimbang, sapagkat napakarami ng mga ito. Naghanda rin ako ng mga kahoy at bato, at maaari ka pang magdagdag sa mga iyon[c].
  rationale: 'Pinalitan ang “walang sukat na timbang” ng “hindi na matimbang,” na natural na naghahatid ng kontekstuwal na saysay ng אֵין מִשְׁקָל: hindi na masusukat sa timbang ang dami ng tanso at bakal. Inayos din ang pangwakas na sugnay sa “maaari ka pang magdagdag sa mga iyon” upang mas malinaw na tumugma sa “add to them,” habang pinananatili sa talababa ang mas tagubilin na pagbasa. Walang binagong kahulugan o doktrinal na interpretasyon.'
