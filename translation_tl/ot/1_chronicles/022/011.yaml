base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/011.yaml
  text: Now[a], my son, may Yahweh be with you, and may you prosper and build the house of Yahweh your God[c][b], as he has spoken concerning you.
translation:
  language: tl
  text: Ngayon, anak ko, sumaiyo nawa si Yahweh, at magtagumpay ka nawa at maitayo mo ang bahay ni Yahweh na iyong Diyos,[a] gaya ng sinabi niya tungkol sa iyo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang templo ni Yahweh na iyong Diyos.” Literal na “ang bahay ni Yahweh na iyong Diyos.”
    reason: lexical_alternative
  - marker: b
    text: 'O “gaya ng ipinangako niya tungkol sa iyo.” Mas literal: “gaya ng sinabi niya tungkol sa iyo.”'
    reason: alternative_reading
lexical_decisions:
- source_word: עַתָּה
  choice: Ngayon
  rationale: Likas at tuwirang panandang temporal na nagpapasimula sa pagpapala at tagubilin ni David.
- source_word: בְנִי
  choice: anak ko
  rationale: Pinananatili ang tuwirang pagtawag at mapagkalingang tono ng isang ama.
- source_word: יְהִי יְהוָה עִמָּךְ
  choice: sumaiyo nawa si Yahweh
  rationale: Ipinahahayag ng jussive na יְהִי ang isang hangarin o pagpapala, hindi payak na prediksiyon; natural sa marangal na Filipino ang 'sumaiyo nawa.'
- source_word: וְהִצְלַחְתָּ
  choice: at magtagumpay ka nawa
  rationale: Maaaring mangahulugan ang Hiphil ng צלח na 'magtagumpay' o 'umunlad.' Ang 'magtagumpay' ay angkop sa gawaing pagtatayo at hindi nagpapahiwatig lamang ng materyal na kasaganaan.
- source_word: וּבָנִיתָ
  choice: at maitayo mo
  rationale: Iniuugnay sa naunang pagpapala bilang inaasam at inaasahang katuparan. Ang 'maitayo mo' ay natural sa Filipino at pinananatili ang modal na diwa ng pagkakasunod ng mga pandiwa.
- source_word: בֵּית יְהוָה אֱלֹהֶיךָ
  choice: ang bahay ni Yahweh na iyong Diyos
  rationale: Pinananatili ang literal at teolohikal na makabuluhang larawang 'bahay'; ang 'templo' ay wastong paliwanag ngunit mas interpretatibo.
- source_word: כַּאֲשֶׁר דִּבֶּר עָלֶיךָ
  choice: ayon sa sinabi niya tungkol sa iyo
  rationale: Tapat sa karaniwang kahulugan ng דבר + על nang hindi tahasang ginagawang 'ipinangako,' bagaman maaaring pahiwatig iyon ng konteksto.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang transliterasyon ng banal na pangalan sa halip na palitan ito ng isang titulo.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Personal na pangalan ang nasa tekstong Hebreo; pinananatili ito bilang 'Yahweh' sa halip na palitan ng titulong 'PANGINOON.'
- issue: Lakas ng pagkakasunod ng mga pandiwa sa pagpapahayag ni David kay Solomon
  choice: 'Pagpapala o hangarin: ''sumaiyo nawa ... at magtagumpay ka nawa at maitayo mo'''
  alternative: 'Prediksiyon: ''sasaiyo ... at magtatagumpay ka at itatayo mo'''
  rationale: Malinaw na jussive ang יְהִי, kaya pinakamalamang na ang kasunod na mga pandiwa ay kabahagi ng pagpapala at inaasahang katuparan, bagaman maaari rin silang basahin bilang prediksiyon.
- issue: Kahulugan ng 'bahay ni Yahweh'
  choice: bahay
  alternative: templo
  rationale: Ang 'bahay' ang tuwirang katumbas ng בֵּית at pinananatili ang Hebreong larawan; nililinaw sa talababa na ang tinutukoy ay ang templo.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang 'sumaiyo nawa' upang mapanatili ang himig ng pagpapala, at 'magtagumpay' sa halip na 'umunlad' upang hindi makitid na maiugnay sa materyal na kasaganaan. Ang mga talababa ay minarkahan sa mismong teksto bilang [a] at [b].
