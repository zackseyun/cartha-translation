base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/010.yaml
  text: He will build a house for my name[a], and he will be a son to me, and I will be a father to him, and I will establish the throne of his kingdom over Israel forever.
translation:
  language: tl
  text: Siya ang magtatayo ng isang bahay para sa aking pangalan.[a] Siya ay magiging anak ko, at ako ay magiging ama niya. At itatatag ko magpakailanman ang trono ng kanyang kaharian sa Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “isang templo para sa aking pangalan.” Literal sa Hebreo: “isang bahay para sa aking pangalan.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַיִת
  choice: bahay
  rationale: Pinananatili ang pangunahing kahulugan ng salitang Hebreo at ang pahayag na 'bahay para sa aking pangalan'; sa konteksto, tumutukoy ito sa templo.
- source_word: לִשְׁמִי
  choice: para sa aking pangalan
  rationale: Tuwirang pinananatili ang idyomang Hebreo tungkol sa bahay na nakatalaga sa pangalan at presensiya ng Diyos.
- source_word: לְבֵן
  choice: magiging anak ko
  rationale: Natural sa modernong Tagalog at tuwirang ipinapahayag ang tipanang ugnayan, nang hindi ito pinahihinang gawing paghahambing lamang.
- source_word: לְאָב
  choice: magiging ama niya
  rationale: Pinananatili ang tuwirang paralelismo ng ugnayang ama-anak sa tekstong Hebreo.
- source_word: וַהֲכִינוֹתִי
  choice: itatatag ko
  rationale: Ipinapahayag ang Hiphil ng כון bilang pagpapatibay o matatag na pagtatatag.
- source_word: כִּסֵּא מַלְכוּתוֹ
  choice: ang trono ng kanyang kaharian
  rationale: Pinananatili kapwa ang larawang 'trono' at ang dinastiko at makaharing diwa ng 'kaharian.'
- source_word: עַל יִשְׂרָאֵל
  choice: sa Israel
  rationale: Sa Tagalog, natural ang 'trono ... sa Israel' para sa paghaharing sumasaklaw sa Israel; ang mas literal na 'sa ibabaw ng Israel' ay hindi likas.
- source_word: עַד עוֹלָם
  choice: magpakailanman
  rationale: Natural at marangal na katumbas sa Tagalog ng pangakong walang hanggan.
theological_decisions:
- issue: Ang pormulang tipan na ama-anak ay tuwirang tumutukoy kay Solomon at may mas malawak na kabuluhan sa pangakong Davidiko.
  choice: Siya ay magiging anak ko, at ako ay magiging ama niya.
  alternative: Ituturing ko siyang parang anak, at ituturing niya akong parang ama.
  rationale: Tuwirang isinasaad ng Hebreo ang ugnayan. Pinananatili ng salin ang agarang pagtukoy kay Solomon at ang mas malawak na tensiyong kanonikal nang hindi nagdaragdag ng tiyak na doktrinal na interpretasyon.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, dignified, at angkop sa pagbasa ng karaniwang mambabasa. Pinanatili ang idyomang 'para sa aking pangalan' at ang tuwirang pormulang ama-anak.
