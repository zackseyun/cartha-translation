base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/007.yaml
  text: And David said to Solomon his son[a], “As for me[b], it was in my heart to build a house for the name of Yahweh my God.”
translation:
  language: tl
  text: At sinabi ni David sa anak niyang si Solomon, “Ako naman, nasa puso ko noon[a] ang magtayo ng isang bahay[b] para sa pangalan ni Yahweh na aking Diyos.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “May layunin akong magtayo.” Ang idyomang Hebreo ay tumutukoy sa panloob na hangarin o matibay na pasiya ni David.
    reason: lexical_alternative
  - marker: b
    text: O “templo.” Literal na “bahay” para sa pangalan ni Yahweh.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: At sinabi
  rationale: Pinananatili ng “At” ang pagpapatuloy ng salaysay na ipinahihiwatig ng waw-consecutive nang hindi dinaragdagan ang ugnayan ng mga pangyayari.
- source_word: לִשְׁלֹמֹה בְנוֹ
  choice: sa anak niyang si Solomon
  rationale: Likas sa modernong Tagalog ang ayos na ito at malinaw nitong pinananatili na si Solomon ay anak ni David.
- source_word: אֲנִי
  choice: Ako naman
  rationale: Ipinakikita ng “naman” ang bahagyang pagdiriin ng tahasang panghalip na אֲנִי nang hindi labis na pinatitindi ang pahayag.
- source_word: הָיָה עִם לְבָבִי
  choice: nasa puso ko
  rationale: Pinananatili nito ang larawang Hebreo tungkol sa puso habang likas na ipinahahayag sa Tagalog ang panloob na hangarin o pasiya ni David.
- source_word: לִבְנוֹת בַּיִת
  choice: magtayo ng isang bahay
  rationale: Ang בַּיִת ay literal na “bahay.” Bagaman templo ang tinutukoy, pinananatili ng “bahay” ang mismong pananalita at teolohikal na larawan ng Hebreo.
- source_word: לְשֵׁם
  choice: para sa pangalan ni
  rationale: Pinananatili nito ang mahalagang pormulang “para sa pangalan” sa halip na gawing mas malayang “bilang parangal kay” o “para kay.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin ang Tetragrammaton bilang personal na pangalang “Yahweh,” hindi pinapalitan ng isang titulo.
- source_word: אֱלֹהָי
  choice: aking Diyos
  rationale: 'Malinaw na pinananatili ang unang panauhang hulaping paari: personal na tinutukoy ni David si Yahweh bilang kanyang Diyos.'
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Tuwirang ginagamit sa talata ang Tetragrammaton; pinananatili ng “Yahweh” ang personal at tipanang pangalan sa halip na palitan ito ng titulong “PANGINOON.”
- issue: Kung ang בַּיִת ay isasaling “bahay” o “templo”
  choice: bahay
  alternative: templo
  rationale: “Bahay” ang tuwirang kahulugan ng salitang Hebreo at pinananatili nito ang ekspresyong “bahay para sa pangalan ni Yahweh.” Nililinaw sa talababa na templo ang tinutukoy.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang idyomang “nasa puso ko,” ang teolohikal na pariralang “para sa pangalan,” at ang literal na “bahay,” habang inilagay sa wastong salita ang bawat panandang talababa.
