base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/003.yaml
  text: And David prepared iron in abundance for the nails for the doors of the gates and for the fastenings[b][a], and bronze in abundance without weight.
translation:
  language: tl
  text: At naghanda si David ng napakaraming bakal para sa mga pako ng mga pinto ng mga tarangkahan at para sa mga pangkabit,[a] at napakaraming bronse—hindi na matimbang sa dami.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga bisagra.” Mas malawak ang salitang Hebreo at tumutukoy sa mga piyesang nagdurugtong o nagkakabit.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “walang timbang”; isang idyoma ito para sa daming hindi na matimbang.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַרְזֶל
  choice: bakal
  rationale: Tuwirang tumutukoy sa bakal bilang materyales sa pagtatayo.
- source_word: לָרֹב
  choice: napakarami
  rationale: Likas sa modernong Tagalog at malinaw na naghahayag ng lubhang malaking dami ng mga materyales.
- source_word: מִּסְמְרִים
  choice: mga pako
  rationale: Karaniwang tawag sa mga metal na pirasong ginagamit sa pagkakabit; hindi nito labis na tinutukoy ang laki o anyo.
- source_word: דַלְתוֹת הַשְּׁעָרִים
  choice: mga pinto ng mga tarangkahan
  rationale: Pinananatili ang ugnayang konstrakto ng Hebreo at nililinaw na ang tinutukoy ay mga pinto o panel ng mga tarangkahan.
- source_word: מְחַבְּרוֹת
  choice: mga pangkabit
  rationale: Malawak na terminong angkop sa mga piyesang nagdurugtong o nagkakabit, nang hindi nililimitahan ang kahulugan sa bisagra.
- source_word: הֵכִין
  choice: naghanda
  rationale: Tumpak sa paghahanda o paglalaan ni David ng mga materyales para sa pagtatayo.
- source_word: נְחֹשֶׁת
  choice: bronse
  rationale: Sa talaan ng sinaunang materyales sa pagtatayo, karaniwang tumutukoy ito sa bronse, bagaman maaari ring sabihing tanso.
- source_word: אֵין מִשְׁקָל
  choice: hindi na matimbang sa dami
  rationale: Ipinahahayag ang idyomatikong diwa na napakarami nito upang timbangin, sa halip na sabihing literal na walang bigat.
