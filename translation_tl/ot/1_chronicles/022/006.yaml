  yaml_path: translation/ot/1_chronicles/022/006.yaml
  text: Then he called for Solomon his son and commanded him to build a house for Yahweh[a], the God of Israel.
translation:
  language: tl
  text: Pagkatapos, ipinatawag niya ang anak niyang si Solomon at inutusan niya itong magtayo ng isang bahay[a] para kay Yahweh, ang Diyos ng Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “isang templo.” Literal sa Hebreo: “isang bahay.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא לִשְׁלֹמֹה
  choice: ipinatawag niya ... si Solomon
  rationale: Ang קרא na sinusundan ng ל at isang tao ay maaaring mangahulugang ipatawag o papuntahin ang taong iyon. Ang “ipinatawag” ay natural sa makabagong Tagalog at angkop sa pagsulong ng salaysay na ipinahihiwatig ng וַ.
- source_word: בְנוֹ
  choice: ang anak niyang
  rationale: Tuwirang pinananatili nito ang ugnayan ni Solomon sa ama niya at natural itong idugtong bago sa pangalan sa Tagalog.
- source_word: וַיְצַוֵּהוּ
  choice: at inutusan itong
  rationale: Pinananatili ng “inutusan” ang awtoritatibong puwersa ng צוה. Nililinaw ng “itong” na si Solomon ang tumanggap ng utos nang hindi inuulit ang pangalan.
- source_word: לִבְנוֹת
  choice: magtayo
  rationale: Ipinapahayag ng infinitibong בנה ang nilalaman ng utos. Ang “magtayo” ang karaniwang pandiwa sa Tagalog para sa pagtatayo ng gusali.
- source_word: בַּיִת
  choice: isang bahay
  rationale: Literal na “bahay” ang בַּיִת. Bagaman templo ang tinutukoy sa konteksto, pinananatili sa pangunahing teksto ang larawan at salita ng Hebreo; inilalagay sa talababa ang mas tahasang kahulugan.
- source_word: לַיהוָה
  choice: para kay Yahweh
  rationale: Ang ל ay nagpapahiwatig na ang bahay ay itatayo para o ilalaan kay Yahweh. Ang “para kay” ay natural sa Tagalog kapag isang personal na pangalan ang kasunod.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ang Diyos ng Israel
  rationale: Tumpak at karaniwang salin ito ng pariralang konstrukto na kumikilala kay Yahweh bilang Diyos ng Israel.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Personal na banal na pangalan ang tahasang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang katangian nito bilang pangalan sa halip na palitan ito ng isang titulo.
- issue: Kahulugan ng בַּיִת sa konteksto ng pagsamba
  choice: bahay
  alternative: templo
  rationale: Pinananatili ng “bahay” ang literal na salita ng Hebreo at ang teolohikal na larawan ng isang bahay para kay Yahweh, samantalang kinikilala sa talababa na templo ang tinutukoy sa konteksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “ipinatawag” para sa natural na daloy ng salaysay at “bahay” upang mapanatili ang kongkretong pananalita ng Hebreo nang hindi ikinukubli ang kontekstuwal na alternatibong “templo.”
