  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יְהִ֨י עָלַ֤/י דְּבַר יְהוָה֙ לֵ/אמֹ֔ר דָּ֤ם לָ/רֹב֙ שָׁפַ֔כְתָּ וּ/מִלְחָמ֥וֹת גְּדֹל֖וֹת עָשִׂ֑יתָ לֹֽא תִבְנֶ֥ה בַ֨יִת֙ לִ/שְׁמִ֔/י כִּ֚י דָּמִ֣ים רַבִּ֔ים שָׁפַ֥כְתָּ אַ֖רְצָ/ה לְ/פָנָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/008.yaml
  text: But the word of Yahweh came to me[a], saying, ‘You have shed much blood and fought great wars. You shall not build a house for my name[d][c][b], because you have shed much blood on the earth before me.’
translation:
  language: tl
  text: 'Ngunit dumating sa akin ang salita ni Yahweh: “Nagpadanak ka ng napakaraming dugo[a] at nakipagdigma ka sa malalaking digmaan[b]. Hindi ka magtatayo ng bahay para sa aking pangalan[c], sapagkat nagpadanak ka ng napakaraming dugo sa lupa[d] sa harapan ko.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “dugo nang sagana.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “nagsagawa ng malalaking digmaan.”
    reason: lexical_alternative
  - marker: c
    text: Ang tinutukoy ay ang templo; literal sa Hebreo, “bahay para sa aking pangalan.”
    reason: cultural_note
  - marker: d
    text: Maaari ring “patungo sa lupa” o “sa lupain.”
    reason: lexical_alternative
lexical_decisions:
- source_word: דְּבַר יְהוָה
  choice: ang salita ni Yahweh
  rationale: Pinananatili ng “salita” ang tuwirang diwa ng דְּבַר at ang karaniwang pormula ng banal na pahayag; isinasalin ang pangalang tipan na יְהוָה bilang “Yahweh.”
- source_word: וַיְהִי עָלַי
  choice: dumating sa akin
  rationale: Likas na salin sa modernong Tagalog ng idyomang Hebreo na literal na “napasa akin” o “sumasa akin,” na tumutukoy sa pagtanggap ng banal na pahayag.
- source_word: דָּם לָרֹב
  choice: napakaraming dugo
  rationale: Pinananatili ang kongkretong larawan ng dugo at ipinahahayag ang malaking dami na saklaw ng לָרֹב.
- source_word: שָׁפַכְתָּ
  choice: nagbuhos ka
  rationale: Kapag dugo ang layon, ang pandiwa ay tumutukoy sa pagbubuhos ng dugo; ang aspektong naganap ay angkop sa pagbabalik-tanaw sa mga ginawa ni David.
- source_word: וּמִלְחָמוֹת גְּדֹלוֹת עָשִׂיתָ
  choice: at nakipagdigma sa malalaking digmaan
  rationale: Idyomatikong ipinapahayag ang literal na “gumawa ng malalaking digmaan” nang hindi inaalis ang aktibong pakikibaka ni David.
- source_word: לֹא תִבְנֶה בַיִת לִשְׁמִי
  choice: Hindi ka magtatayo ng bahay para sa aking pangalan
  rationale: Pinananatili ang “bahay” at “para sa aking pangalan” upang mapanatili ang talinghaga at wikang tipan ng Hebreo, habang nililinaw sa talababa na ang tinutukoy ay ang templo.
- source_word: כִּי
  choice: sapagkat
  rationale: Malinaw na nagpapakilala sa dahilan kung bakit hindi si David ang magtatayo ng bahay.
- source_word: דָּמִים רַבִּים
  choice: napakaraming dugo
  rationale: Ang maramihang anyo ay maaaring tumukoy sa pagdanak ng dugo o pananagutan dahil dito; pinananatili ng salin ang kongkretong salita at ang pag-uulit sa talata.
- source_word: אַרְצָה
  choice: sa lupa
  rationale: Likas sa Tagalog at naipapahiwatig ang direksiyon ng dugong ibinuhos patungo sa lupa, nang hindi tiyakang nililimitahan sa “lupain” o pinalalawak sa buong daigdig.
- source_word: לְפָנַי
  choice: sa harapan ko
  rationale: Pinananatili ang teolohikal na diin na ang pagdanak ng dugo ay naganap sa paningin at presensiya ng Diyos.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang ginagamit ng talata ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalang tipan sa halip na palitan ito ng isang titulo.
- issue: Kung isasalin ang בַיִת bilang “bahay” o bilang “templo”
  choice: bahay
  alternative: templo
  rationale: Bagaman templo ang tinutukoy sa konteksto, “bahay” ang mismong salita sa Hebreo at pinananatili nito ang mahalagang temang bahay-templo. Nililinaw ang kahulugan sa talababa nang hindi ito ipinapasok sa pangunahing teksto.
- issue: Kung gagawing abstrakto ang דָּמִים bilang “pagdanak ng dugo” o pananagutan sa dugo
  choice: napakaraming dugo
  alternative: matinding pagdanak ng dugo; malaking pananagutan sa dugo
  rationale: Pinananatili ang kongkretong larawan at pag-uulit ng Hebreo. Hindi tiyakang nilulutas ng konteksto kung ang diin ay dami lamang, marahas na pagdanak, o kaakibat na pananagutan.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “sapagkat” at “sa harapan ko” upang mapanatili ang solemneng himig, habang iniwasan ang lipas o labis na teknikal na pananalita. Inilagay ang bawat talababa sa mismong pariralang tinutukoy nito.
