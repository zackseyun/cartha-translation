  to: 'Ngunit dumating sa akin ang salita ni Yahweh: “Nagpadanak ka ng napakaraming dugo[a] at nakipagdigma ka sa malalaking digmaan[b]. Hindi ka magtatayo ng bahay para sa aking pangalan[c], sapagkat nagpadanak ka ng napakaraming dugo sa lupa[d] sa harapan ko.”'
