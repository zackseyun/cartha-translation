revisions:
- from: Hindi ba kasama ninyo si Yahweh na inyong Diyos? At hindi ba niya kayo binigyan ng kapahingahan sa lahat ng dako? Sapagkat ibinigay niya sa aking kamay ang mga naninirahan sa lupain, at ang lupain ay nasakop sa harap ni Yahweh at sa harap ng kanyang bayan[a].
  to: Hindi ba kasama ninyo si Yahweh, ang inyong Diyos, at binigyan niya kayo ng kapahingahan sa lahat ng panig? Sapagkat ibinigay niya sa aking kamay ang mga naninirahan sa lupain, at ang lupain ay nasakop sa harap ni Yahweh at sa harap ng kanyang bayan[a].
  rationale: Inayos ang saklaw ng retorikal na tanong, ginawang mas likas ang pagpapakilala kay Yahweh bilang Diyos ng mga kausap, at pinalitan ang “sa lahat ng dako” ng “sa lahat ng panig” upang mas malapit sa מִסָּבִיב. Pinanatili ang metaporang “sa aking kamay,” ang balintiyak na “nasakop,” at ang kalabuan ng “kanyang bayan.”
