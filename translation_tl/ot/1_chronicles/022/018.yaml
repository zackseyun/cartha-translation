  terminology: Ang “Yahweh,” “Diyos,” “kapahingahan,” “sa aking kamay,” “mga naninirahan sa lupain,” at “kanyang bayan” ay angkop. Nananatiling hindi nilulutas ng “kanyang bayan” ang posibleng reperensiya ng panghalip, at wastong ipinapaliwanag ito ng talababa.
