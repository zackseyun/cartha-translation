id: 1CH.22.18
reference: 1 Chronicles 22:18
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: הֲ/לֹ֨א יְהוָ֤ה אֱלֹֽהֵי/כֶם֙ עִמָּ/כֶ֔ם וְ/הֵנִ֥יחַ לָ/כֶ֖ם מִ/סָּבִ֑יב כִּ֣י נָתַ֣ן בְּ/יָדִ֗/י אֵ֚ת יֹשְׁבֵ֣י הָ/אָ֔רֶץ וְ/נִכְבְּשָׁ֥ה הָ/אָ֛רֶץ לִ/פְנֵ֥י יְהוָ֖ה וְ/לִ/פְנֵ֥י עַמּֽ/וֹ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/018.yaml
  text: Is not Yahweh your God with you? And has he not given you rest on every side? For he has given the inhabitants of the land into my hand[a], and the land has been subdued before Yahweh and before his people.
translation:
  language: tl
  text: Hindi ba kasama ninyo si Yahweh, ang inyong Diyos, at binigyan niya kayo ng kapahingahan sa lahat ng panig? Sapagkat ibinigay niya sa aking kamay ang mga naninirahan sa lupain, at ang lupain ay nasakop sa harap ni Yahweh at sa harap ng kanyang bayan[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “kanyang” ay pinakamalamang na tumutukoy kay Yahweh, ngunit maaari rin itong unawain na tumutukoy kay David.
    reason: Pinananatili ang posibleng kalabuan ng pinagmulan tungkol sa tinutukoy ng panghalip.
lexical_decisions:
- source_word: הֲלֹא
  choice: Hindi ba
  rationale: Pinananatili ang retorikal na tanong na umaasang sasang-ayon ang mga kausap.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ang personal na pangalang nasa tekstong Hebreo, sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֵיכֶם
  choice: inyong Diyos
  rationale: Bagaman anyong maramihan ang pangngalan, tumutukoy ito sa iisang Diyos ng Israel at nakaugnay kay Yahweh.
- source_word: עִמָּכֶם
  choice: kasama ninyo
  rationale: Ipinahahayag dito ang presensya at pagtulong ng Diyos; likas at malinaw ito sa makabagong Tagalog.
- source_word: וְהֵנִיחַ לָכֶם מִסָּבִיב
  choice: At hindi ba niya kayo binigyan ng kapahingahan sa lahat ng dako
  rationale: Ang pandiwa ay tumutukoy sa pagkakaloob ng pahinga o katiwasayan mula sa mga kaaway sa paligid. Inulit ang anyong patanong upang maging malinaw at natural sa Tagalog.
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikilala nito ang dahilan o batayan ng naunang pahayag.
- source_word: נָתַן בְּיָדִי
  choice: ibinigay niya sa aking kamay
  rationale: Pinananatili ang larawang Hebreo ng pagbibigay sa kapangyarihan ng isang tao, na nauunawaan din sa Tagalog.
- source_word: יֹשְׁבֵי הָאָרֶץ
  choice: ang mga naninirahan sa lupain
  rationale: Tuwirang ipinahahayag ang mga taong nakatira sa lupain nang hindi dinaragdagan ang kahulugan.
- source_word: וְנִכְבְּשָׁה הָאָרֶץ
  choice: at ang lupain ay nasakop
  rationale: Ipinahahayag ng anyong balintiyak na ang lupain ay napasailalim o nalupig; maikli at natural ang 'nasakop'.
- source_word: לִפְנֵי יְהוָה וְלִפְנֵי עַמּוֹ
  choice: sa harap ni Yahweh at sa harap ng kanyang bayan
  rationale: Pinananatili ang magkatulad na estruktura at ang diwang nangyari ito sa presensya o ilalim ng kapangyarihan ni Yahweh at ng tinutukoy na bayan.
theological_decisions:
- issue: Paglalahad sa pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehova
  rationale: Personal na pangalan ang tahasang nasa pinagmulang Hebreo, kaya pinananatili ito bilang Yahweh.
- issue: Tinutukoy ng panghalip sa עַמּוֹ (“kanyang bayan”)
  choice: Pinanatili sa teksto ang “kanyang bayan,” na pinakamalamang na tumutukoy kay Yahweh
  alternative: Maaaring tumukoy kay David
  rationale: Likas na magkaugnay ang 'Yahweh' at 'kanyang bayan,' ngunit maaari ring iugnay sa nagsasalitang si David ang panghalip ayon sa balarila at konteksto. Hindi tahasang nilutas sa pangunahing teksto ang tunay na kalabuan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kasama ninyo” sa halip na mas makalumang “sumasainyo,” at pinanatili ang mga larawang “kapahingahan” at “sa aking kamay” dahil malinaw pa rin ang mga ito sa konteksto.
