base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/012.yaml
  text: Only[a], may Yahweh give you insight and understanding, and command you concerning Israel[b], that you may keep the law of Yahweh your God.
translation:
  language: tl
  text: Higit sa lahat, ipagkaloob nawa sa iyo ni Yahweh ang karunungan at pang-unawa, at pagbilinan ka niya tungkol sa Israel,[a] upang masunod mo ang kautusan[b] ni Yahweh na iyong Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ipagkatiwala sa iyo ang pamamahala sa Israel.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “tagubilin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Higit sa lahat
  rationale: Ginagawang natural sa Tagalog ang panlimita at pantـuon na diwa ng partikula sa pagpapahayag ng pangunahing hangarin ni David.
- source_word: יִתֶּן
  choice: ipagkaloob nawa
  rationale: Ipinahahayag ng imperfect sa konteksto ang isang hangarin o pagpapala, kaya ang “nawa” angkop sa Tagalog.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal at tipanang pangalan ng Diyos na nasa tekstong Hebreo.
- source_word: שֵׂכֶל וּבִינָה
  choice: karunungan at pang-unawa
  rationale: Pinananatiling magkaiba ngunit magkakaugnay ang praktikal na mabuting pagpapasya at kakayahang umunawa.
- source_word: וִיצַוְּךָ עַל יִשְׂרָאֵל
  choice: pagbilinan ka niya tungkol sa Israel
  rationale: Malapit ito sa karaniwang kahulugan ng צוה na “mag-utos/magbilin” at pinananatili ang ugnayan ng עַל na “tungkol sa,” nang hindi ipinapasok sa pangunahing teksto ang mas tiyak na ideya ng paghirang.
- source_word: וְלִשְׁמוֹר
  choice: upang masunod mo
  rationale: Malinaw at natural na ipinakikita ang layuning ipinahahayag ng waw at infinitive; ang “masunod” ay angkop sa kautusan.
- source_word: תּוֹרַת
  choice: kautusan
  rationale: Angkop sa tipanang konteksto at madaling maunawaan, habang inilalahad sa talababa ang posibleng mas malawak na diwang “tagubilin.”
- source_word: אֱלֹהֶיךָ
  choice: iyong Diyos
  rationale: Tuwirang inililipat ang ikalawang panauhang panlalaking hulapi at ang tipanang pagtukoy.
theological_decisions:
- issue: Paglilipat sa pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Pinananatili ang banal na pangalang tahasang nasa tekstong Hebreo nang hindi ito pinapalitan ng isang titulo.
- issue: Kahulugan ng וִיצַוְּךָ עַל יִשְׂרָאֵל sa konteksto ng paghahari
  choice: pagbilinan ka niya tungkol sa Israel
  alternative: ilagay ka niya sa pamamahala sa Israel
  rationale: Inuuna ang karaniwang leksikal na diwa ng pandiwa at pinananatili ang tunay na kalabuan sa pamamagitan ng talababa tungkol sa posibleng kahulugan ng pagkakatiwala ng pamamahala.
- issue: Saklaw ng תּוֹרָה
  choice: kautusan
  alternative: tagubilin
  rationale: Ang “kautusan” ay angkop sa tipanang konteksto, ngunit hindi ikinukubli ang mas malawak na leksikal na posibilidad na “tagubilin.”
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Higit sa lahat” sa halip na literal ngunit alanganing “Tanging,” at pinanatili ang dalawang posibleng pagbasa sa mahirap na pariralang Hebreo sa pamamagitan ng talababa.
