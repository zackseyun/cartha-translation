base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/016.yaml
  text: For the gold[a], the silver, the bronze, and the iron, there is no number. Rise up and work[c][b], and may Yahweh be with you.
translation:
  language: tl
  text: Kung tungkol sa ginto, pilak, tanso[b], at bakal, hindi mabilang ang mga ito.[a] Bumangon ka at kumilos, at nawa’y sumaiyo si Yahweh.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “walang bilang” o “napakarami upang bilangin.”
    reason: lexical_alternative
  - marker: b
    text: Ang salitang Hebreo ay maaaring tumukoy sa bronse o sa purong tanso, depende sa konteksto.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring unawain na “at sasaiyo si Yahweh” o “at sumaiyo si Yahweh.” Ang anyong Hebreo ay maaaring magpahayag ng hangarin o pagpapala.
    reason: alternative_reading
lexical_decisions:
- source_word: לַזָּהָב לַכֶּסֶף וְלַנְּחֹשֶׁת וְלַבַּרְזֶל
  choice: Kung tungkol sa ginto, pilak, tanso, at bakal
  rationale: Ang ל na inuulit sa bawat materyal ay nauunawaan bilang panandang paksa o pagtukoy sa mga materyal na nabanggit sa naunang konteksto. Likas sa modernong Tagalog ang “Kung tungkol sa” at napapanatili nito ang puwersang resumptibo ng Hebreo.
- source_word: נְחֹשֶׁת
  choice: tanso
  rationale: Ang salitang Hebreo ay maaaring tumukoy sa bronze o copper ayon sa konteksto. Ang “tanso” ang karaniwang salitang Filipino sa ganitong talaan ng mga metal, habang inilalahad sa talababa ang saklaw ng orihinal.
- source_word: אֵין מִסְפָּר
  choice: hindi mabilang ang mga ito
  rationale: Idyoma ito para sa napakaraming dami. Mas natural sa Tagalog ang “hindi mabilang” kaysa sa literal na “walang bilang,” ngunit pinananatili nito ang diwa ng kawalan ng kakayahang bilangin.
- source_word: קוּם
  choice: Bumangon ka
  rationale: Ang pautos ay panawagan na tumindig at kumilos. Pinananatili ng “Bumangon ka” ang larawan at marangal na himig ng Hebreo.
- source_word: וַעֲשֵׂה
  choice: at gawin mo ang gawain
  rationale: Sa konteksto ng paghahanda para sa pagtatayo ng templo, ang pangkalahatang pandiwang עשה ay tumutukoy sa pagsasagawa ng gawaing iniatas. Nililinaw ng pariralang ito ang likas na ipinahihiwatig ng konteksto nang hindi dinaragdagan ang uri ng gawain.
- source_word: וִיהִי יְהוָה עִמָּךְ
  choice: at sumaiyo nawa si Yahweh
  rationale: Ang anyong jussive ay pinakamalamang na nagpapahayag ng hangarin o pagpapala. Ang “sumaiyo nawa” ay likas at marangal na pormula sa Tagalog, at ang pangalang יְהוָה ay isinasalin bilang “Yahweh.”
theological_decisions:
- issue: Paglalarawan sa jussive na וִיהִי
  choice: sumaiyo nawa si Yahweh
  alternative: sasaiyo si Yahweh / sumaiyo si Yahweh
  rationale: Pinananatili ng “nawa” ang malamang na kahulugang hangarin o pagpapala sa halip na tahimik itong gawing tiyak na pangako o payak na utos.
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehova
  rationale: Tuwirang ginagamit ng tekstong Hebreo ang Tetragrammaton. Ang “Yahweh” ay nagpapanatili rito bilang personal na pangalang tipan nang hindi ito pinapalitan ng titulo.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “Kung tungkol sa” upang maipakita ang paksang pagbabalik sa talaan ng materyales, at “sumaiyo nawa” upang mapanatili ang tradisyonal na himig ng pagpapala nang hindi nagiging lipas o labis na pormal.
