  - severity: low
    issue: Hindi angkop ang “mura” sa talababa para sa רַךְ.
    rationale: Ang רַךְ ay “malambot,” “maselan,” o “mahina/tender,” at sa kontekstong ito ay tumutukoy sa kawalan ng kahustuhan o kahandaan; hindi ito literal na “mura.”
  - severity: low
