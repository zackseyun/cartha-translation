  source_fidelity: Tumpak ang pangunahing diwa at maayos ang pagsasalin ng Yahweh, “bahay,” kabataan/kawalan ng karanasan ni Solomon, at saganang paghahanda. Gayunman, ang “kailangang maging lubhang dakila, bantog, at maringal” ay bahagyang nagpapalabo sa infinitive na “gawing napakadakila” at sa layuning “para sa katanyagan at karilagan.”
  naturalness: Likás at marangal ang Tagalog sa kabuuan. Mas idiomatiko at mas akma sa natapos na salaysay ang “bago siya namatay” kaysa “bago siya mamatay.”
  terminology: Ang “Yahweh” ay angkop sa יהוה, at ang “bahay” ay wastong pagpapanatili ng terminong Hebreo; sapat ang talababa para sa “templo.” Ang talababa sa רַךְ ay kailangang ayusin sapagkat ang “mura” ay hindi wastong literal na alternatibo rito.
