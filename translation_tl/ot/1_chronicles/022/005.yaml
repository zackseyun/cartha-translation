reference: 1 Chronicles 22:5
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר דָּוִ֗יד שְׁלֹמֹ֣ה בְנִ/י֮ נַ֣עַר וָ/רָךְ֒ וְ/הַ/בַּ֜יִת לִ/בְנ֣וֹת לַ/יהוָ֗ה לְ/הַגְדִּ֨יל לְ/מַ֜עְלָ/ה לְ/שֵׁ֤ם וּ/לְ/תִפְאֶ֨רֶת֙ לְ/כָל הָ֣/אֲרָצ֔וֹת אָכִ֥ינָה נָּ֖א ל֑/וֹ וַ/יָּ֧כֶן דָּוִ֛יד לָ/רֹ֖ב לִ/פְנֵ֥י מוֹתֽ/וֹ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/005.yaml
  text: And David said[a], “My son Solomon is young and inexperienced, and the house to be built for Yahweh must be made exceedingly great in fame and splendor in all lands[c][b]. I will now make preparation for it.” So David made abundant preparations before his death.
translation:
  language: tl
  text: At sinabi ni David, “Ang anak kong si Solomon ay bata pa at wala pang karanasan[a], at ang bahay[b] na itatayo para kay Yahweh ay kailangang gawing napakadakila, upang magkaroon ng katanyagan at karilagan sa lahat ng lupain[c]. Maghahanda ako ngayon para rito[d].” Kaya naghanda si David nang sagana bago siya namatay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “bata at malambot/maselan.” Ang ikalawang salita ay maaaring magpahiwatig ng pagiging maselan, mahina, o hindi pa handa; sa kontekstong ito, malamang na tumutukoy ito sa kakulangan ni Solomon sa karanasan o kahandaan.
    reason: lexical_alternative
  - marker: b
    text: O “templo.” Sa Hebreo, “bahay.”
    reason: lexical_alternative
  - marker: c
    text: 'Maaari ring isalin: “para sa katanyagan at para sa karilagan sa lahat ng lupain.”'
    reason: lexical_alternative
  - marker: d
    text: O “para sa kanya,” na maaaring tumukoy kay Solomon. Ang panghalip sa Hebreo ay maaari ring tumukoy sa bahay o sa proyektong pagtatayo.
    reason: referential_ambiguity
lexical_decisions:
- source_word: נַעַר וָרָךְ
  choice: bata pa at wala pang karanasan
  rationale: Ang נַעַר ay tumutukoy sa kamusmusan o kabataan ni Solomon, samantalang ang רַךְ ay literal na ‘malambot’ o ‘maselan’ ngunit dito ay nagpapahiwatig ng kakulangan sa gulang at kahandaan. Natural sa modernong Tagalog ang pinagsamang pariralang ito.
- source_word: הַבַּיִת
  choice: ang bahay
  rationale: Pinananatili ang literal na ‘bahay’ sa Hebreo sa halip na agad itong ipakahulugang ‘templo’; malinaw naman sa konteksto na santuwaryo ni Yahweh ang tinutukoy.
- source_word: לַיהוָה
  choice: para kay Yahweh
  rationale: Isinasalin ang banal na pangalang יהוה bilang ‘Yahweh,’ alinsunod sa tuwirang anyo nito sa tekstong Hebreo.
- source_word: לְהַגְדִּיל לְמַעְלָה
  choice: kailangang maging lubhang dakila
  rationale: Ipinahahayag ng tambalang parirala ang napakataas na antas ng kadakilaan ng gusali. Ang ‘lubhang dakila’ ay marangal ngunit madaling maunawaan.
- source_word: לְשֵׁם וּלְתִפְאֶרֶת
  choice: bantog, at maringal
  rationale: Saklaw ng שֵׁם ang pagkakaroon ng pangalan o katanyagan, at ng תִּפְאֶרֶת ang karilagan o kaluwalhatian. Ang ‘bantog at maringal’ ay natural at pinananatili ang dalawang aspekto.
- source_word: לְכָל הָאֲרָצוֹת
  choice: sa lahat ng lupain
  rationale: Ang maramihang אֲרָצוֹת ay tumutukoy sa mga lupain o bansa; pinananatili ng salin ang malawak at pandaigdigang saklaw.
- source_word: אָכִינָה נָּא לוֹ
  choice: Maghahanda ako ngayon para rito
  rationale: Ipinahahayag ng cohortative ang pasiya ni David. Malamang na tumutukoy ang hulaping לוֹ sa bahay o proyektong pagtatayo, kaya ‘para rito’ ang pangunahing salin, habang itinatala sa talababa ang gramatikal na posibilidad na tumukoy ito kay Solomon.
- source_word: לָרֹב
  choice: naghanda ... nang sagana
  rationale: Ipinahahayag ng parirala ang napakaraming inihanda ni David. Ang pang-abay na ‘nang sagana’ ay natural sa Tagalog at hindi nagdaragdag ng tiyak na uri ng paghahanda.
- source_word: לִפְנֵי מוֹתוֹ
  choice: bago siya mamatay
  rationale: Tuwiran at natural na pagsasalin ng temporal na parirala.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON o Jehovah
  rationale: Pangalang pantangi ang יהוה sa pinagmulan; pinananatili ng ‘Yahweh’ ang tahasang pangalang tipan nang hindi ito pinapalitan ng titulo.
- issue: Kung ‘bahay’ o ‘templo’ ang הַבַּיִת
  choice: bahay
  alternative: templo
  rationale: Ang ‘bahay’ ang pormal na katumbas ng salitang Hebreo at pinananatili ang teolohikal na larawan ng bahay para kay Yahweh; sapat ang konteksto upang makilala itong santuwaryo.
- issue: Referente ng לוֹ sa paghahanda ni David
  choice: para rito, tumutukoy sa bahay o proyekto
  alternative: para sa kanya, tumutukoy kay Solomon
  rationale: Parehong panlalaki ang posibleng referente sa Hebreo. Mas malapit sa daloy ng pangungusap ang bahay na itatayo, ngunit hindi ganap na isinasara ang posibilidad na si Solomon ang tinutukoy, kaya inilalahad ang alternatibo sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit karaniwan ang bokabularyo. Ginamit ang ‘bata pa,’ ‘wala pang karanasan,’ at ‘bago siya mamatay’ para sa likas na daloy; pinanatili naman ang ‘bahay,’ ‘Yahweh,’ ‘lubhang dakila,’ at ‘maringal’ upang mapanatili ang dignidad at mahahalagang larawan ng tekstong Hebreo.
