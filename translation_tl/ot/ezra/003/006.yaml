id: EZR.3.6
reference: Ezra 3:6
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: מִ/יּ֤וֹם אֶחָד֙ לַ/חֹ֣דֶשׁ הַ/שְּׁבִיעִ֔י הֵחֵ֕לּוּ לְ/הַעֲל֥וֹת עֹל֖וֹת לַ/יהוָ֑ה וְ/הֵיכַ֥ל יְהוָ֖ה לֹ֥א יֻסָּֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/003/006.yaml
  text: From the first day of the seventh month they began to offer burnt offerings to Yahweh[a], though the foundation of the temple of Yahweh had not been laid.
translation:
  language: tl
  text: Mula sa unang araw ng ikapitong buwan, nagsimula silang maghandog ng mga handog na sinusunog para kay Yahweh, kahit hindi pa nailalatag ang pundasyon ng templo ni Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “at hindi pa nailalatag ang pundasyon ng templo ni Yahweh,” o “ngunit hindi pa nailalatag…” Ang pang-ugnay sa Hebreo ay maaaring isaling “at” o, ayon sa konteksto, “ngunit/kahit.” Nagsimula ang paghahandog bago nailatag ang pundasyon ng templo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִיּוֹם אֶחָד לַחֹדֶשׁ הַשְּׁבִיעִי
  choice: Mula sa unang araw ng ikapitong buwan
  rationale: Ang מִן ay tumutukoy sa panimulang punto sa panahon. Pinananatili ng “mula sa” ang diwa na doon nagsimula ang gawaing binanggit.
- source_word: הֵחֵלּוּ
  choice: nagsimula sila
  rationale: Tuwirang katumbas ng pandiwang nangangahulugang “magsimula,” sa natural na ayos ng modernong Tagalog.
- source_word: לְהַעֲלוֹת עֹלוֹת
  choice: maghandog ng mga handog na sinusunog
  rationale: Ang parirala ay isang terminong pangsakripisyo. Malinaw na ipinahihiwatig ng “mga handog na sinusunog” ang uri ng handog nang hindi labis na literal sa ideya ng “pagpapaakyat.”
- source_word: לַיהוָה
  choice: para kay Yahweh
  rationale: Ang לְ ay nagmamarka sa pinag-uukulan ng mga handog, at ang pangalan ng Diyos na יהוה ay isinaling “Yahweh.”
- source_word: וְהֵיכַל יְהוָה
  choice: kahit ... ang pundasyon ng templo ni Yahweh
  rationale: 'Sa konteksto, ang וְ ay maaaring magpahayag ng pagsalungat o pagpap concessive: nagsimula ang mga handog bago naitayo ang pundasyon. Ang הֵיכָל ay ang templo o santuwaryo rito.'
- source_word: לֹא יֻסָּד
  choice: hindi pa nailalatag ang pundasyon
  rationale: Ang pasibong anyo ng יסד ay tumutukoy sa paglalatag ng pundasyon. Ang “pa” ay natural na naghahayag na hindi pa ito nagaganap sa puntong iyon.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Ginagamit ng Hebreo ang Tetragrammaton bilang mismong pangalan ng Diyos; pinananatili ng “Yahweh” ang katangian nito bilang pangalan nang hindi umaasa sa pamalit na titulo.
- issue: Ugnayan ng paghahandog at ng hindi pa nailalatag na pundasyon
  choice: kahit
  alternative: at; ngunit
  rationale: Ipinakikita ng konteksto ang tensiyon na nagsimula ang mga handog bago nailatag ang pundasyon. Gayunman, tunay na malawak ang gamit ng Hebreong וְ, kaya itinala sa talababa ang mas payak na mga posibilidad.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang karaniwang bokabularyong panrelihiyon nang hindi nagiging makaluma; pinanatili rin ang posibleng kahulugan ng Hebreong pang-ugnay sa talababa.
