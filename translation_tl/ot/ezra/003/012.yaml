  to: Ngunit marami sa mga pari, mga Levita, at mga pinuno ng mga angkan[a]—ang matatandang lalaking nakakita sa unang bahay[b]—ang umiiyak nang malakas nang ilatag ang pundasyon ng bahay na ito sa harap ng kanilang mga mata, samantalang marami naman ang nagtaas ng tinig sa masayang sigawan.
