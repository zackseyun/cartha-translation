  text: וְ/רַבִּ֡ים מֵ/הַ/כֹּהֲנִ֣ים וְ/הַ/לְוִיִּם֩ וְ/רָאשֵׁ֨י הָ/אָב֜וֹת הַ/זְּקֵנִ֗ים אֲשֶׁ֨ר רָא֜וּ אֶת הַ/בַּ֤יִת הָֽ/רִאשׁוֹן֙ בְּ/יָסְד֔/וֹ זֶ֤ה הַ/בַּ֨יִת֙ בְּ/עֵ֣ינֵי/הֶ֔ם בֹּכִ֖ים בְּ/ק֣וֹל גָּד֑וֹל וְ/רַבִּ֛ים בִּ/תְרוּעָ֥ה בְ/שִׂמְחָ֖ה לְ/הָרִ֥ים קֽוֹל־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/003/012.yaml
  text: But many of the priests and the Levites and the heads of the fathers’ houses[a], the old men who had seen the first house, were weeping with a loud voice when this house was founded before their eyes[c][b], while many were raising their voice with a shout of joy.
translation:
  language: tl
  text: Ngunit marami sa mga pari, mga Levita, at mga pinuno ng mga angkan[a]—ang matatandang lalaking nakakita sa unang bahay[b]—ang umiiyak nang malakas nang ilatag ang pundasyon ng bahay na ito sa harap ng kanilang mga mata, samantalang marami naman ang nagtaas ng tinig sa masayang sigawan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “mga pinuno ng mga angkan” ay mga lider ng mga pangkat ng pamilyang nagmula sa iisang ninuno.
    reason: cultural_note
  - marker: b
    text: O “naunang bahay.” Ang “bahay” dito ay tumutukoy sa naunang templo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרַבִּים
  choice: Ngunit marami
  rationale: Ipinahihiwatig ng ו ang pagsalungat sa masayang pagsigaw sa naunang talata; natural itong naipapahayag ng “ngunit,” habang tuwirang isinasalin ng “marami” ang רַבִּים.
- source_word: מֵהַכֹּהֲנִים וְהַלְוִיִּם וְרָאשֵׁי הָאָבוֹת
  choice: sa mga pari, mga Levita, at mga pinuno ng mga angkan
  rationale: Partitibo ang מִן, kaya “marami sa.” Ang רָאשֵׁי הָאָבוֹת ay tumutukoy sa mga lider ng mga pangkat ng pamilyang nagmula sa iisang ninuno; mas malinaw sa modernong Tagalog ang “mga pinuno ng mga angkan.”
- source_word: הַזְּקֵנִים
  choice: ang matatandang lalaki
  rationale: Edad ang pangunahing diwa rito sapagkat nakita nila ang naunang templo; iniiwasan ng saling ito ang posibleng institusyonal na kahulugan ng “mga matanda.”
- source_word: אֲשֶׁר רָאוּ אֶת הַבַּיִת הָרִאשׁוֹן
  choice: nakakita sa unang bahay
  rationale: Pinananatili ng “bahay” ang literal na בַּיִת at ng “una” ang הָרִאשׁוֹן, bagaman templo ang malinaw na tinutukoy.
- source_word: בְּיָסְדוֹ זֶה הַבַּיִת
  choice: nang itatag ang bahay na ito
  rationale: Ang infinitibong יסד ay tumutukoy sa pagtatatag o paglalagay ng pundasyon. Ang “itatag” ay natural at pinananatili ang saklaw ng anyong Hebreo; inilalagay sa talababa ang mas tahasang alternatibo.
- source_word: בְּעֵינֵיהֶם
  choice: sa harap ng kanilang mga mata
  rationale: Pinananatili nito ang matingkad na idyoma ng tuwirang pagkakita.
- source_word: בֹּכִים בְּקוֹל גָּדוֹל
  choice: humagulgol nang malakas
  rationale: Ang participle ay naglalarawan ng nagpapatuloy na pag-iyak. Likas at marubdob sa Tagalog ang “humagulgol nang malakas” para sa pag-iyak na may malakas na tinig.
- source_word: וְרַבִּים
  choice: samantalang marami naman
  rationale: Ipinakikita nito ang magkasabay ngunit magkasalungat na tugon nang hindi idinaragdag ang tahasang “iba,” na wala sa Hebreo.
- source_word: בִּתְרוּעָה בְשִׂמְחָה לְהָרִים קוֹל
  choice: nagsigawan sa tuwa
  rationale: Pinagsasama ng natural na pariralang Tagalog ang pagtaas ng tinig, ang malakas na sigaw, at ang kagalakang tahasang isinasaad ng Hebreo.
