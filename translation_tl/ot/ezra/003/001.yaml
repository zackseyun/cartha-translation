base_translation:
  language: en
  yaml_path: translation/ot/ezra/003/001.yaml
  text: When the seventh month arrived[a], and the sons of Israel were in the cities[b], the people gathered as one man to Jerusalem.
translation:
  language: tl
  text: Nang sumapit ang ikapitong buwan at ang mga anak ni Israel ay nasa mga lungsod, nagtipon ang bayan sa Jerusalem na parang iisang tao.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “gaya ng isang lalaki”; isang idyomang Hebreo na nangangahulugang nagkakaisa sila sa pagkilos.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגַּע
  choice: sumapit
  rationale: Sa pariralang tumutukoy sa panahon, ang נגע ay idyomatikong nangangahulugang dumating o sumapit; natural sa Filipino ang “sumapit” para sa buwan.
- source_word: הַחֹדֶשׁ הַשְּׁבִיעִי
  choice: ang ikapitong buwan
  rationale: Tuwirang pinananatili ang Hebreong bilang ng buwan sa halip na palitan ito ng mas huling pangalan ng buwan.
- source_word: וּבְנֵי יִשְׂרָאֵל
  choice: ang mga anak ni Israel
  rationale: Malapit ito sa Hebreong ekspresyon at natural na katawagan sa Filipino para sa mga kabilang sa bayang Israel; hindi kailangang gawing “mga lalaki” ang kolektibong idyoma.
- source_word: בֶּעָרִים
  choice: nasa mga lungsod
  rationale: Ipinahahayag ang ipinahihiwatig na pang-ugnay ng eliptikong Hebreo. Hindi idinagdag ang “kanilang” sapagkat wala ito sa teksto.
- source_word: וַיֵּאָסְפוּ הָעָם
  choice: nagtipon ang buong bayan
  rationale: Ang Niphal ng אסף ay tumutukoy sa pagtitipon. Nililinaw ng “buong bayan” ang kolektibong הָעָם nang hindi ito ginagawang pormal na kapulungan.
- source_word: כְּאִישׁ אֶחָד
  choice: na parang iisang tao
  rationale: Pinananatili ang matingkad na literal na larawan ng Hebreong idyoma, na nagpapahiwatig ng nagkakaisang pagkilos.
- source_word: אֶל יְרוּשָׁלִָם
  choice: sa Jerusalem
  rationale: Sa Filipino, natural na ipinahahayag ng “nagtipon ... sa Jerusalem” ang pagkilos patungo at pagdating sa destinasyon; ang “papunta sa” ay maaaring magmukhang nasa biyahe pa lamang sila.
theological_decisions:
- issue: Masculine corporate language sa בְּנֵי יִשְׂרָאֵל at כְּאִישׁ אֶחָד
  choice: Gamitin ang “mga anak ni Israel” at “parang iisang tao”
  alternative: “mga Israelita” at “nagkakaisa”
  rationale: Pinananatili ng salin ang mga larawang pangkamag-anakan at pang-isahang tao sa pinagmulan, ngunit gumagamit ng natural na Filipino. Hindi nito nililimitahan ang bayan sa mga lalaking indibidwal, ni inaalis ang panlalaking anyo ng Hebreong idyoma.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang “ikapitong buwan” at ang larawan ng “iisang tao,” habang iniwasan ang di-likas na ayos ng pangungusap at ang pagdaragdag ng “kanilang” na wala sa Hebreo.
