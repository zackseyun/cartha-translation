reference: Ezra 3:10
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/יִסְּד֥וּ הַ/בֹּנִ֖ים אֶת הֵיכַ֣ל יְהוָ֑ה וַ/יַּעֲמִידוּ֩ הַ/כֹּהֲנִ֨ים מְלֻבָּשִׁ֜ים בַּ/חֲצֹֽצְר֗וֹת וְ/הַ/לְוִיִּ֤ם בְּנֵֽי אָסָף֙ בַּֽ/מְצִלְתַּ֔יִם לְ/הַלֵּל֙ אֶת יְהוָ֔ה עַל יְדֵ֖י דָּוִ֥יד מֶֽלֶךְ יִשְׂרָאֵֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/003/010.yaml
  text: When the builders laid the foundation of the temple of Yahweh[a], they stationed the priests, clothed in their vestments, with trumpets, and the Levites, the sons of Asaph, with cymbals, to praise Yahweh according to the directions of David king of Israel.
translation:
  language: tl
  text: Nang ilatag ng mga tagapagtayo ang pundasyon ng templo ni Yahweh, pinuwesto nila ang mga pari, na nakadamit at may mga trumpeta, at ang mga Levita, na mga anak ni Asaf at may mga pompiyang, upang purihin si Yahweh ayon sa tagubilin ni David, na hari ng Israel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa literal na Hebreo: “sa pamamagitan ng kamay ni David na hari ng Israel,” isang idyomang maaaring tumukoy sa tagubilin o kaayusang nagmula kay David.'
    reason: Ipinapakita ang literal na anyo ng Hebreong idyoma at ang batayan ng pagsasaling “ayon sa tagubilin.”
lexical_decisions:
- source_word: וְיִסְּדוּ הַבֹּנִים
  choice: Nang mailagay ng mga tagapagtayo ang pundasyon
  rationale: Ang יסד sa konteksto ng pagtatayo ay tumutukoy sa paglalagay ng pundasyon. Ginawang sugnay na panahunan ang Hebreong ayos upang maging likas sa Tagalog.
- source_word: הֵיכַל יְהוָה
  choice: templo ni Yahweh
  rationale: Sa kontekstong panrelihiyon ng Ezra, malinaw na tumutukoy ang הֵיכַל sa templo; pinanatili ang personal na pangalang Yahweh para sa יהוה.
- source_word: וַיַּעֲמִידוּ
  choice: inilagay nila sa kani-kanilang puwesto
  rationale: Ang Hifil ng עמד ay pagpapuwesto sa mga taong gaganap ng tungkuling panliturhiya, hindi lamang pagpapapatayo sa kanila.
- source_word: הַכֹּהֲנִים מְלֻבָּשִׁים
  choice: ang mga pari, na nakasuot ng kanilang kasuotan
  rationale: Literal na nangangahulugang ‘mga paring nakasuot.’ Hindi tinukoy ng Hebreo na espesyal o seremonyal ang kasuotan, kaya hindi iyon idinagdag sa pangunahing teksto.
- source_word: בַּחֲצֹצְרוֹת
  choice: may mga trumpeta
  rationale: Ang חצצרות ay mga trumpetang ginagamit sa seremonyal na pagsamba; likas sa Tagalog ang ‘may mga trumpeta’ para sa kagamitan ng mga pari.
- source_word: וְהַלְוִיִּם בְּנֵי אָסָף
  choice: at ang mga Levita na mga anak ni Asaf
  rationale: Pinananatili ng ‘mga anak ni Asaf’ ang katawagang pampamilya o pangangkan sa Hebreo nang hindi nililimitahan kung literal na mga anak o mga inapo ang tinutukoy.
- source_word: בַּמְצִלְתַּיִם
  choice: na may mga pompiyang
  rationale: Ang מצלתים ay mga cymbal na ginagamit sa musikang pantemplo; ‘pompiyang’ ang malinaw at karaniwang salitang Filipino.
- source_word: לְהַלֵּל אֶת יְהוָה
  choice: upang purihin si Yahweh
  rationale: Ipinahahayag ng infinitive ang layunin ng pagpapuwesto sa mga pari at Levita.
- source_word: עַל יְדֵי דָּוִיד
  choice: ayon sa tagubilin ni David
  rationale: Ang idyomang literal na ‘sa pamamagitan ng kamay ni David’ ay tumutukoy rito sa kaayusan o tagubiling nagmula kay David.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: na hari ng Israel
  rationale: Tuwirang isinasalin ang titulong maharlika at malinaw na ikinakabit kay David.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON o Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo sa dalawang pagkakataon. Pinananatili ng ‘Yahweh’ ang pagkakaiba nito sa isang titulong gaya ng ‘Panginoon.’
- issue: Kahulugan ng עַל יְדֵי דָּוִיד sa pagsambang pantemplo
  choice: ayon sa tagubilin ni David
  alternative: sa pamamagitan ng kamay ni David
  rationale: Posible ang literal na anyo, ngunit sa konteksto ay kaayusan o tagubiling iniugnay kay David ang diwa. Inilalahad sa talababa ang literal na Hebreo upang mapanatili ang idyomatikong anyo at posibleng saklaw nito.
translation_notes:
  register: Gumamit ng moderno, marangal, at madaling maunawaang Tagalog. Pinanatili ang mga terminong ‘templo,’ ‘pari,’ ‘Levita,’ ‘trumpeta,’ at ‘pompiyang’ bilang pamilyar na bokabularyong panrelihiyon. Iniwasang tukuying ‘seremonyal’ ang kasuotan sapagkat hindi iyon tahasang sinasabi ng Hebreo.
