  terminology: Ang “templo,” “Yahweh,” “pari,” “Levita,” “trumpeta,” at “pompiyang” ay angkop sa modernong Filipino Tagalog at pinananatili ang mahahalagang katawagan. Ang “nakadamit” ay hindi nagdaragdag ng di-tahasang uri ng kasuotan.
