  to: Nang ilatag ng mga tagapagtayo ang pundasyon ng templo ni Yahweh, pinuwesto nila ang mga pari, na nakadamit at may mga trumpeta, at ang mga Levita, na mga anak ni Asaf at may mga pompiyang, upang purihin si Yahweh ayon sa tagubilin ni David, na hari ng Israel.[a]
