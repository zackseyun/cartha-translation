  naturalness: Natural at angkop sa modernong Filipino ang pangungusap. Ang “mga kapatid na mga pari” ay maaaring pasimplehin bilang “mga kapatid na pari” nang hindi nagbabago ang kahulugan.
  terminology: Ang “altar,” “mga handog na sinusunog,” at “Kautusan ni Moises” ay tumpak at angkop sa rehistrong biblikal. Dapat panatilihin ang tradisyonal ngunit malinaw na titulong “tao ng Diyos” para sa אִישׁ הָאֱלֹהִים.
