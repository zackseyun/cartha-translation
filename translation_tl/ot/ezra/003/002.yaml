id: EZR.3.2
reference: Ezra 3:2
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יָּקָם֩ יֵשׁ֨וּעַ בֶּן יֽוֹצָדָ֜ק וְ/אֶחָ֣י/ו הַ/כֹּהֲנִ֗ים וּ/זְרֻבָּבֶ֤ל בֶּן שְׁאַלְתִּיאֵל֙ וְ/אֶחָ֔י/ו וַ/יִּבְנ֕וּ אֶת מִזְבַּ֖ח אֱלֹהֵ֣י יִשְׂרָאֵ֑ל לְ/הַעֲל֤וֹת עָלָי/ו֙ עֹל֔וֹת כַּ/כָּת֕וּב בְּ/תוֹרַ֖ת מֹשֶׁ֥ה אִישׁ הָ/אֱלֹהִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/003/002.yaml
  text: Then Jeshua son of Jozadak arose with his brothers the priests[a], and Zerubbabel son of Shealtiel with his brothers, and they built the altar of the God of Israel to offer burnt offerings on it, as it is written in the Law of Moses[b], the man of God.
translation:
  language: tl
  text: Pagkatapos, tumindig si Jesua na anak ni Jozadak, kasama ang kanyang mga kapatid na pari[a], at si Zerubabel na anak ni Sealtiel, kasama ang kanyang mga kapatid. Itinayo nila ang altar ng Diyos ng Israel upang maghandog doon ng mga handog na sinusunog, ayon sa nakasulat sa Kautusan ni Moises[b], ang tao ng Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga kamag-anak niya” o “mga kasamahan niya.” Sa Hebreo, “mga kapatid niya”; nililinaw ng kasunod na parirala na ang pangkat ni Jesua ay ang mga pari.
    reason: lexical_alternative
  - marker: b
    text: Ang salitang isinaling “Kautusan” ay torah sa Hebreo, na maaari ring mangahulugang “tagubilin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: tumindig
  rationale: Ipinahihiwatig ng pandiwa ang pagsisimula ng tiyak at sama-samang pagkilos; pinananatili ng “tumindig” ang galaw ng salaysay nang hindi ito nililimitahan sa literal na pagtayo lamang.
- source_word: יֵשׁוּעַ
  choice: Jesua
  rationale: Transliterasyon ng Hebreong pangalan sa anyong natural basahin sa Filipino.
- source_word: וְאֶחָיו הַכֹּהֲנִים
  choice: ang kanyang mga kapatid na mga pari
  rationale: Pinananatili ang literal na ugnayang “mga kapatid,” habang ipinakikilala ng kasunod na parirala ang pangkat bilang mga pari.
- source_word: זְרֻבָּבֶל
  choice: Zerubabel
  rationale: Karaniwang anyong transliterado at natural sa ortograpiyang Filipino.
- source_word: שְׁאַלְתִּיאֵל
  choice: Sealtiel
  rationale: Transliterasyon ng Hebreong pangalan sa anyong madaling basahin sa Filipino.
- source_word: וַיִּבְנוּ
  choice: itinayo nila
  rationale: Tuwirang salin ng “nagtayo/nagtayo sila”; hindi idinagdag ang ideya ng muling pagtatayo na hindi tahasang nasa pandiwa.
- source_word: מִזְבַּח אֱלֹהֵי יִשְׂרָאֵל
  choice: ang altar ng Diyos ng Israel
  rationale: Tuwiran at natural na salin ng pariralang konstrukto.
- source_word: לְהַעֲלוֹת עָלָיו עֹלוֹת
  choice: upang maghandog doon ng mga handog na sinusunog
  rationale: Ipinahahayag ang sakripisyal na idyoma at pinananatili ang pagtukoy sa altar bilang lugar ng paghahandog.
- source_word: כַּכָּתוּב
  choice: ayon sa nakasulat
  rationale: Natural na pormulang Filipino para sa pagsunod sa isang nasusulat na tuntunin.
- source_word: בְּתוֹרַת מֹשֶׁה
  choice: sa Kautusan ni Moises
  rationale: Sa konteksto ng nakasulat na alituntunin tungkol sa paghahandog, malinaw na naihahatid ng “Kautusan” ang bisa ng torah, habang itinatala sa talababa ang mas malawak nitong kahulugan.
- source_word: אִישׁ הָאֱלֹהִים
  choice: ang lingkod ng Diyos
  rationale: Ang Hebreong titulong literal na “tao ng Diyos” ay tumutukoy kay Moises bilang kinatawan at lingkod ng Diyos; “lingkod ng Diyos” ang natural at marangal na katumbas sa Filipino.
theological_decisions:
- issue: Kahulugan ng אחים sa pangkat na kinakatawan ng mga pinuno
  choice: mga kapatid
  alternative: mga kamag-anak; mga kasamahan
  rationale: Pinananatili ang pangunahing kahulugan ng salitang Hebreo at ang panlalaking pangkat sa konteksto, ngunit inilalahad sa talababa ang posibleng pinalawak na kahulugan.
- issue: Pagpapakahulugan sa תּוֹרָה sa kontekstong panghandog
  choice: Kautusan ni Moises
  alternative: tagubilin ni Moises; Torah ni Moises
  rationale: Ang konteksto ay pagsunod sa nasusulat na tuntunin sa paghahandog. Ang “Kautusan” ay malinaw sa karaniwang mambabasa ngunit hindi itinatanggi ang mas malawak na saklaw ng salita, na binabanggit sa talababa.
- issue: Paglalarawan kay Moises bilang אִישׁ הָאֱלֹהִים
  choice: ang lingkod ng Diyos
  alternative: ang tao ng Diyos
  rationale: Iniiwasan ng literal na “tao ng Diyos” ang paliwanag ngunit maaari itong maging malabo o di-likas sa modernong Filipino. Ang “lingkod ng Diyos” ay naghahatid sa kinikilalang tungkulin ng titulong Hebreo nang hindi nagdaragdag ng denominasyonal na pakahulugan.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang takbo ng Hebreong salaysay at ang mga terminong panghandog nang hindi ginagawang sobrang teknikal. Ginamit ang mga transliterasyong Jesua, Jozadak, Zerubabel, at Sealtiel na natural basahin sa Filipino.
