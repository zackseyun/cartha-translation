base_translation:
  language: en
  yaml_path: translation/ot/ezra/003/004.yaml
  text: They kept the Festival of Booths as it is written, and offered the daily burnt offerings by number according to the ordinance, as each day required.
translation:
  language: tl
  text: Ipinagdiwang nila ang Pista ng mga Kubol ayon sa nakasulat, at araw-araw nilang inihandog ang itinakdang bilang ng mga handog na sinusunog, ayon sa tuntunin para sa bawat araw.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חַג הַסֻּכּוֹת
  choice: Pista ng mga Kubol
  rationale: Tuwirang inilalarawan ang kapistahan sa paraang natural at madaling maunawaan sa modernong Filipino.
- source_word: עֹלַת
  choice: mga handog na sinusunog
  rationale: Ipinahahayag ang uri ng handog na lubusang sinusunog nang hindi gumagamit ng di-pamilyar na teknikal na katawagan.
- source_word: בְמִסְפָּר
  choice: ang itinakdang bilang
  rationale: Ipinapakita na ang bilang ng mga handog ay ayon sa nakasaad na tuntunin, hindi lamang basta binilang.
- source_word: כְּמִשְׁפַּט
  choice: ayon sa tuntunin
  rationale: Ang konteksto ay rituwal na regulasyon o itinakdang kaayusan.
- source_word: דְּבַר יוֹם בְּיוֹמוֹ
  choice: para sa bawat araw
  rationale: Natural na Filipino para sa kinakailangan o takdang bahagi ng bawat araw.
theological_decisions:
- issue: Kalikasan ng pagsunod sa nakasulat na kautusan
  choice: ayon sa nakasulat
  alternative: gaya ng nasusulat
  rationale: Parehong posible, ngunit mas karaniwan at malinaw sa modernong Filipino ang 'ayon sa nakasulat' habang pinananatili ang pagtukoy sa awtoritatibong teksto.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling basahin. Pinanatili ang paulit-ulit na diwa ng araw-araw at bawat araw, ngunit inayos ang sintaks upang maging natural at malinaw.
