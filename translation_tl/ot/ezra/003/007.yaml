  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יִּ֨תְּנוּ כֶ֔סֶף לַ/חֹצְבִ֖ים וְ/לֶ/חָרָשִׁ֑ים וּ/מַאֲכָ֨ל וּ/מִשְׁתֶּ֜ה וָ/שֶׁ֗מֶן לַ/צִּֽדֹנִים֙ וְ/לַ/צֹּרִ֔ים לְ/הָבִיא֩ עֲצֵ֨י אֲרָזִ֤ים מִן הַ/לְּבָנוֹן֙ אֶל יָ֣ם יָפ֔וֹא כְּ/רִשְׁי֛וֹן כּ֥וֹרֶשׁ מֶֽלֶךְ פָּרַ֖ס עֲלֵי/הֶֽם־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/003/007.yaml
  text: So they gave money to the stonecutters and to the craftsmen[a], and food and drink and oil to the Sidonians and the Tyrians, to bring cedar timber from Lebanon to the sea at Joppa[c][b], according to the authorization of Cyrus king of Persia upon them.
translation:
  language: tl
  text: Kaya nagbigay sila ng salapi sa mga tagatabas ng bato at sa mga bihasang manggagawa,[a] at ng pagkain, inumin, at langis sa mga taga-Sidon at taga-Tiro upang magdala ng mga kahoy na sedro mula sa Lebanon hanggang sa baybayin ng Joppa,[b] ayon sa pahintulot na ibinigay sa kanila ni Ciro na hari ng Persia.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga artisano.” Hindi tinutukoy ng salitang Hebreo kung anong uri ng gawain ang kanilang ginagawa.
    reason: lexical_alternative
  - marker: b
    text: Literal na “sa dagat ng Joppa”; maaari ring isalin na “sa daungan ng Joppa.”
    reason: lexical_alternative
  - marker: c
    text: Maaari ring isalin na “ayon sa pahintulot ni Ciro na hari ng Persia para sa kanila.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ
  choice: Kaya nagbigay sila
  rationale: Ang wayyiqtol ay nagpapatuloy sa salaysay; natural sa Tagalog ang “Kaya” bilang ugnay sa naunang pangyayari.
- source_word: כֶסֶף
  choice: salapi
  rationale: Maaaring tumukoy sa pilak o sa perang pambayad; ang konteksto ng pagbabayad sa mga manggagawa ay pumapabor sa “salapi.”
- source_word: לַחֹצְבִים
  choice: sa mga tagatabas ng bato
  rationale: Tumutukoy ang חצב sa mga pumuputol o kumukuha ng bato; malinaw at angkop sa pagtatayo ang salin.
- source_word: וְלֶחָרָשִׁים
  choice: at sa mga bihasang manggagawa
  rationale: Ang חָרָשׁ ay pangkalahatang katawagan sa sanay na manggagawa o artisano at hindi tiyak ang materyal na kanilang ginagawa rito.
- source_word: וּמַאֲכָל וּמִשְׁתֶּה וָשֶׁמֶן
  choice: at ng pagkain, inumin, at langis
  rationale: Tuwirang inilalarawan ang mga panustos na ibinigay; hindi tinukoy bilang langis ng olibo sapagkat “langis” lamang ang nasa Hebreo.
- source_word: לַצִּדֹנִים וְלַצֹּרִים
  choice: sa mga taga-Sidon at taga-Tiro
  rationale: Natural na modernong Tagalog para sa mga gentiliko ng Sidon at Tiro.
- source_word: עֲצֵי אֲרָזִים
  choice: mga kahoy na sedro
  rationale: Ipinahihiwatig ng parirala ang materyales na kahoy na sedro para sa pagtatayo, nang hindi ipinapalagay na tiyak na anyo nitong mga troso.
- source_word: אֶל יָם יָפוֹא
  choice: hanggang sa baybayin ng Joppa
  rationale: Literal na “sa dagat ng Joppa”; ang “baybayin ng Joppa” ay malinaw habang hindi tahasang nagdaragdag ng salitang “daungan.”
- source_word: כְּרִשְׁיוֹן כּוֹרֶשׁ מֶלֶךְ פָּרַס עֲלֵיהֶם
  choice: ayon sa pahintulot na ibinigay sa kanila ni Ciro na hari ng Persia
  rationale: Natural na ipinapahayag ang royal authorization idiom at ang kaugnayan ng עֲלֵיהֶם sa mga tumanggap ng pahintulot.
theological_decisions: []
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “salapi” sa konteksto ng bayad, “bihasang manggagawa” upang huwag labis na tukuyin ang hanapbuhay, at “baybayin ng Joppa” upang mapanatili ang larawan ng Hebreong “dagat ng Joppa.”
