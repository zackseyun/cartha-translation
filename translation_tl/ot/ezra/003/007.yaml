  source_fidelity: 'Tapat ang salin sa Hebreo: ang salapi ay para sa mga tagatabas ng bato at bihasang manggagawa, samantalang ang pagkain, inumin, at langis ay para sa mga taga-Sidon at taga-Tiro upang magdala sila ng kahoy na sedro mula Lebanon patungo sa dagat/baybayin ng Joppa. Ang "ayon sa pahintulot na ibinigay sa kanila ni Ciro" ay wastong nagpapahayag ng royal-authorization idiom nang hindi nagdaragdag ng kahulugan.'
