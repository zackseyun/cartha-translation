base_translation:
  language: en
  yaml_path: translation/ot/ezra/003/009.yaml
  text: Then Jeshua[a], his sons and his brothers, and Kadmiel and his sons, the sons of Judah, stood together as one to oversee those doing the work in the house of God, along with the sons of Henadad, their sons and their brothers, the Levites.
translation:
  language: tl
  text: At si Jesua, ang kanyang mga anak na lalaki at mga kapatid, si Kadmiel at ang kanyang mga anak na lalaki—ang mga anak ni Juda[a]—ay magkakasamang tumayo upang pangasiwaan ang mga gumagawa ng gawain sa bahay ng Diyos, kasama ang mga anak ni Henadad, ang kanilang mga anak na lalaki at mga kapatid—ang mga Levita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: “ang mga anak ni Juda.” Sa ilang sinaunang salin at makabagong salin, “ang mga anak ni Hodavias.”'
    reason: textual_variant
lexical_decisions:
- source_word: וַיַּעֲמֹד
  choice: tumayo
  rationale: Pinananatili nito ang konkretong diwa ng pandiwang עמד, habang ipinahihiwatig ng konteksto na pumuwesto sila upang mangasiwa.
- source_word: יֵשׁוּעַ
  choice: Jesua
  rationale: Ang pangalang Hebreo ay isinalin sa karaniwang anyong Filipino sa halip na bigyan ng kahulugang salin.
- source_word: בָּנָיו וְאֶחָיו
  choice: kanyang mga anak na lalaki at mga kapatid
  rationale: Pinananatili ang tahasang panlalaking katawagang pampamilya sa Hebreo.
- source_word: קַדְמִיאֵל וּבָנָיו
  choice: si Kadmiel at ang kanyang mga anak na lalaki
  rationale: Tuwirang pinananatili ang ikalawang magkakaugnay na pangkat ng pamilya.
- source_word: בְּנֵי יְהוּדָה
  choice: ang mga anak ni Juda
  rationale: Tuwirang isinasalin ang Masoretikong pagbasa na יְהוּדָה, habang inilalagay sa talababa ang ibang sinaunang pagbasa.
- source_word: כְּאֶחָד
  choice: sama-samang ... bilang isa
  rationale: Ipinapahayag nito kapwa ang sama-samang pagkilos at pagkakaisa ng pangkat.
- source_word: לְנַצֵּחַ
  choice: upang pangasiwaan
  rationale: Sa kontekstong ito, tumutukoy ang piel infinitive sa pamamahala o superbisyon sa mga manggagawa, hindi sa pamumuno sa musika.
- source_word: עַל עֹשֵׂה הַמְּלָאכָה
  choice: ang mga gumagawa ng gawain
  rationale: Pinananatili ang pandiwang katangian ng kolektibong participle nang hindi nililimitahan ang uri ng mga manggagawa.
- source_word: בְּבֵית הָאֱלֹהִים
  choice: sa bahay ng Diyos
  rationale: Natural at marangal na salin ito ng karaniwang katawagan sa templo nang pinananatili ang larawan ng 'bahay.'
- source_word: בְּנֵי חֵנָדָד בְּנֵיהֶם וַאֲחֵיהֶם הַלְוִיִּם
  choice: Kasama rin nila ang mga anak ni Henadad, ang kanilang mga anak na lalaki at mga kapatid—ang mga Levita
  rationale: Nililinaw ng 'Kasama rin nila' ang pagsama ng huling pangkat, habang pinananatili ang sunod-sunod na listahan at ang pangwakas na pagkakakilanlan sa kanila bilang mga Levita.
theological_decisions:
- issue: Posibleng tekstuwal na kawalang-katiyakan sa בְּנֵי יְהוּדָה
  choice: Isalin ang Masoretikong Teksto bilang “ang mga anak ni Juda.”
  alternative: “ang mga anak ni Hodavias”
  rationale: Juda ang tahasang pagbasa ng ibinigay na WLC. Hindi ito tahimik na pinapalitan, ngunit itinatala sa talababa ang pagbasa ng ilang sinaunang salin upang mapanatili ang tekstuwal na katibayan.
translation_notes:
  register: Makabagong Filipino na marangal at madaling maunawaan. Ginamit ang “pangasiwaan” para sa gawaing superbisyon, “bahay ng Diyos” upang mapanatili ang templong idyoma, at em dash upang malinaw ang mga pariralang nagpapakilala sa mga pangkat.
