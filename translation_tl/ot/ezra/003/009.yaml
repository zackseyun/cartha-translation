revisions:
- from: At si Jesua, kasama ang kanyang mga anak na lalaki at mga kapatid, at si Kadmiel at ang kanyang mga anak na lalaki—ang mga anak ni Juda[a]—ay sama-samang tumayo bilang isa upang pangasiwaan ang mga gumagawa ng gawain sa bahay ng Diyos. Kasama rin nila ang mga anak ni Henadad, ang kanilang mga anak na lalaki at mga kapatid—ang mga Levita.
  to: At si Jesua, ang kanyang mga anak na lalaki at mga kapatid, si Kadmiel at ang kanyang mga anak na lalaki—ang mga anak ni Juda[a]—ay magkakasamang tumayo upang pangasiwaan ang mga gumagawa ng gawain sa bahay ng Diyos, kasama ang mga anak ni Henadad, ang kanilang mga anak na lalaki at mga kapatid—ang mga Levita.
  rationale: Pinakinis ang idyomang Filipino para sa nagkakaisang pagkilos at pinagdikit ang huling pangkat sa pangunahing sugnay upang mas malinaw na sila rin ay kabilang sa mga tumayo upang mangasiwa. Hindi binago ang Masoretikong pagbasa na “mga anak ni Juda”; ang alternatibong “Hodavias” ay nananatili lamang sa talababa.
