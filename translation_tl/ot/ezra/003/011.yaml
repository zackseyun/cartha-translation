base_translation:
  language: en
  yaml_path: translation/ot/ezra/003/011.yaml
  text: 'And they sang responsively praising and giving thanks to Yahweh: “For he is good[c][b][a], for his steadfast love toward Israel is forever.” And all the people shouted a great shout in praise to Yahweh because the house of Yahweh had been founded.'
translation:
  language: tl
  text: 'At sila ay umaawit nang tugunan[a], na nagpupuri at nagpapasalamat kay Yahweh: “Sapagkat siya ay mabuti; sapagkat ang kanyang tapat na pag-ibig para sa Israel ay magpakailanman.”[b] At ang buong bayan ay nagtaas ng napakalakas na sigaw bilang papuri kay Yahweh, sapagkat naitatag na ang bahay ni Yahweh.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sumagot sila.” Ang pandiwang Hebreo ay maaaring tumukoy sa pagsagot, malamang sa tugunang pag-awit o pagpupuri.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin, “sapagkat ang kanyang tapat na pag-ibig para sa Israel ay nananatili magpakailanman.”
    reason: lexical_alternative
  - marker: c
    text: Sa konteksto, ang “naitatag na ang bahay ni Yahweh” ay tumutukoy sa pagkakalagay ng pundasyon ng templo.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעֲנוּ
  choice: nag-awitan nang salitan
  rationale: Sa kontekstong panliturhiya, ipinahihiwatig ng pandiwa ang pagsagot o pag-awit nang tugunan. Likas sa modernong Tagalog ang pariralang ito habang pinananatili sa talababa ang mas literal na posibilidad.
- source_word: בְּהַלֵּל וּבְהוֹדֹת
  choice: na nagpupuri at nagpapasalamat
  rationale: Pinananatili ang dalawang magkaibang kilos ng pagsamba sa malinaw at likas na anyong pandiwa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang personal na pangalang tipan na tuwirang kinakatawan ng Tetragrammaton sa tekstong Hebreo.
- source_word: כִּי טוֹב
  choice: Sapagkat siya ay mabuti
  rationale: Likas at tuwirang salin ng nakaugaliang pormula ng pagpupuri; ipinahihiwatig ng Hebreo ang panghalip at pandiwang panaguri.
- source_word: כִּי לְעוֹלָם חַסְדּוֹ עַל יִשְׂרָאֵל
  choice: sapagkat magpakailanman ang kanyang tapat na pag-ibig sa Israel
  rationale: Ang “tapat na pag-ibig” ay nagpapahayag ng matibay at mapagkakatiwalaang kabutihang-loob ng חֶסֶד nang hindi ito nililimitahan sa iisang doktrinal na paliwanag. Ang ayos ay nagpapanatili sa ugnayan nito sa Israel.
- source_word: הֵרִיעוּ תְרוּעָה גְדוֹלָה
  choice: nagtaas ng napakalakas na sigaw
  rationale: Inihahatid nito sa likas na Tagalog ang diin ng magkaugnay na pandiwa at pangngalan sa Hebreo.
- source_word: בְּהַלֵּל לַיהוָה
  choice: bilang papuri kay Yahweh
  rationale: Nililinaw na ang sigaw ay isang kilos ng pagpupuri, alinsunod sa gamit ng pang-ukol sa Hebreo.
- source_word: עַל הוּסַד בֵּית יְהוָה
  choice: sapagkat naitatag na ang bahay ni Yahweh
  rationale: Pinananatili ang anyong balintiyak ng Hophal at ang literal na “bahay ni Yahweh,” habang ipinapaliwanag sa talababa na tumutukoy ito sa pagkakalagay ng pundasyon ng templo.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Pinananatili ng “Yahweh” ang personal na pangalang nasa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- issue: Kahulugan ng חַסְדּוֹ sa pormula ng pagpupuri
  choice: kanyang tapat na pag-ibig
  alternative: kanyang habag / kanyang pag-ibig na may katapatan sa tipan
  rationale: Sinasaklaw ng “tapat na pag-ibig” ang pag-ibig, kabutihang-loob, at katapatan ng salita nang hindi labis na pinapakitid ang mayamang kahulugan ng terminong Hebreo.
- issue: Kahulugan ng pagkakatatag ng bahay ni Yahweh
  choice: naitatag na ang bahay ni Yahweh
  alternative: nailagay na ang pundasyon ng templo ni Yahweh
  rationale: Mas malapit ang piniling salin sa gramatikal na anyo ng Hebreo; ang kontekstuwal na kahulugan tungkol sa pundasyon ng templo ay inilagay sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Iniwasan ang labis na arkaikong pananalita; pinanatili ang “bahay ni Yahweh” dahil ito ang tuwirang larawan ng Hebreo, na nililinaw sa talababa bilang templo.
