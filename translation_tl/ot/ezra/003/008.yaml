revisions:
- from: Nang ikalawang taon matapos silang dumating sa bahay ng Diyos sa Jerusalem, sa ikalawang buwan, nagsimula sina Zerubabel na anak ni Sealtiel at Jeshua na anak ni Jozadak, kasama ang iba pa nilang mga kapatid na pari at Levita at ang lahat ng dumating sa Jerusalem mula sa pagkabihag.[a] Inatasan nila ang mga Levitang dalawampung taong gulang pataas upang pangasiwaan ang gawain sa bahay ni Yahweh.
  to: Nang ikalawang taon matapos silang dumating sa bahay ng Diyos sa Jerusalem, sa ikalawang buwan, nagsimula sina Zerubabel na anak ni Sealtiel at Jeshua na anak ni Jozadak, kasama ang iba pa nilang mga kapatid—ang mga pari at mga Levita—at ang lahat ng dumating mula sa pagkabihag sa Jerusalem, at itinalaga nila ang mga Levitang dalawampung taong gulang pataas upang pangasiwaan ang gawain sa bahay ni Yahweh.[a]
  rationale: Pinalitan ang “Inatasan nila” ng “itinalaga nila” upang maihatid ang kahulugang paglalagay sa tungkulin. Pinagdugtong ang dalawang pandiwa upang maging natural ang Tagalog nang hindi nagdaragdag ng hayag na layon sa “nagsimula.” Nilinaw rin sa bantas na ang “mga pari at mga Levita” ay pagpapaliwanag sa “iba pa nilang mga kapatid.”
