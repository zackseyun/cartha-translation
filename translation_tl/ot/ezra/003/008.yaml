  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וּ/בַ/שָּׁנָ֣ה הַ/שֵּׁנִ֗ית לְ/בוֹאָ֞/ם אֶל בֵּ֤ית הָֽ/אֱלֹהִים֙ לִ/יר֣וּשָׁלִַ֔ם בַּ/חֹ֖דֶשׁ הַ/שֵּׁנִ֑י הֵחֵ֡לּוּ זְרֻבָּבֶ֣ל בֶּן שְׁ֠אַלְתִּיאֵל וְ/יֵשׁ֨וּעַ בֶּן יֽוֹצָדָ֜ק וּ/שְׁאָ֥ר אֲחֵי/הֶ֣ם הַ/כֹּהֲנִ֣ים וְ/הַ/לְוִיִּ֗ם וְ/כָל הַ/בָּאִים֙ מֵ/הַ/שְּׁבִ֣י יְרֽוּשָׁלִַ֔ם וַ/יַּעֲמִ֣ידוּ אֶת הַ/לְוִיִּ֗ם מִ/בֶּ֨ן עֶשְׂרִ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה לְ/נַצֵּ֖חַ עַל מְלֶ֥אכֶת בֵּית יְהוָֽה־־־׀־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/003/008.yaml
  text: And in the second year after their coming to the house of God at Jerusalem[a], in the second month, Zerubbabel son of Shealtiel and Jeshua son of Jozadak, and the rest of their brothers the priests and the Levites, and all who had come from the captivity to Jerusalem, began and appointed the Levites from twenty years old and upward to oversee the work of the house of Yahweh.
translation:
  language: tl
  text: Nang ikalawang taon matapos silang dumating sa bahay ng Diyos sa Jerusalem, sa ikalawang buwan, nagsimula sina Zerubabel na anak ni Sealtiel at Jeshua na anak ni Jozadak, kasama ang iba pa nilang mga kapatid—ang mga pari at mga Levita—at ang lahat ng dumating mula sa pagkabihag sa Jerusalem, at itinalaga nila ang mga Levitang dalawampung taong gulang pataas upang pangasiwaan ang gawain sa bahay ni Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mula sa pagkatapon.”
    reason: Pinahihintulutan ng הַשְּׁבִי ang paglalarawan sa kalagayan bilang pagkabihag o pagkatapon.
lexical_decisions:
- source_word: לְבוֹאָם
  choice: matapos silang dumating
  rationale: Ang infinitive construct na may ל at hulaping 3mp ay temporal dito; malinaw at natural sa modernong Tagalog ang “matapos silang dumating.”
- source_word: בֵּית הָאֱלֹהִים
  choice: bahay ng Diyos
  rationale: Pinananatili nito ang kongkretong pananalita ng Hebreo at hindi agad pinapalitan ng mas interpretibong “templo.”
- source_word: הֵחֵלּוּ
  choice: nagsimula
  rationale: Tuwirang katumbas ng pandiwa; hindi dinaragdagan ng tahasang layon na wala sa Hebreo.
- source_word: וַיַּעֲמִידוּ
  choice: inatasan nila
  rationale: Sa kontekstong administratibo, tumutukoy ito sa paglalagay o pagtatalaga sa mga Levita para sa isang tungkulin.
- source_word: אֶת הַלְוִיִּם
  choice: ang mga Levita
  rationale: Karaniwang katawagang pantribo at pangkultong malinaw sa Tagalog.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: dalawampung taong gulang pataas
  rationale: Natural na modernong Tagalog para sa pormulang nagtatakda ng pinakamababang edad.
- source_word: לְנַצֵּחַ
  choice: upang pangasiwaan
  rationale: Dito ay tumutukoy sa pamamahala o superbisyon ng gawain, hindi sa pamumunong musikal.
- source_word: מְלֶאכֶת בֵּית יְהוָה
  choice: ang gawain sa bahay ni Yahweh
  rationale: Malinaw na tumutukoy sa gawaing kaugnay ng bahay ni Yahweh habang hindi nililimitahan nang tahasan sa konstruksiyon lamang.
- source_word: אֲחֵיהֶם
  choice: kanilang mga kapatid
  rationale: Pinananatili ang tuwirang larawang pampamilya ng Hebreo sa halip na palitan ng “mga kababayan” o “mga kamag-anak.”
- source_word: מֵהַשְּׁבִי
  choice: mula sa pagkabihag
  rationale: Pormal na malapit sa pangngalang Hebreo; inilalagay sa talababa ang maaari ring kahulugang “pagkatapon.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasatinig ang pantanging pangalan ng Diyos na nasa tekstong Hebreo.
theological_decisions:
- issue: Paglalarawan sa banal na pangalan na יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Pantanging pangalan ang tuwirang nasa Hebreo; ang “Yahweh” ay nagpapanatili rito bilang pangalan sa halip na palitan ng titulo.
- issue: Kahulugan ng בֵּית הָאֱלֹהִים
  choice: bahay ng Diyos
  alternative: templo ng Diyos
  rationale: Ang “bahay” ay mas malapit sa anyo ng Hebreo at hindi ipinapalagay sa pangunahing teksto ang interpretibong katawagang “templo,” bagaman iyon ang tinutukoy sa konteksto.
translation_notes:
  register: Makabagong, marangal, at madaling maunawaang Filipino. Hinati sa dalawang pangungusap ang mahabang Hebreong sugnay para luminaw ang kilos nang hindi nilulutas ang di-binanggit na layon ng “nagsimula.” Ginamit ang tradisyonal at madaling kilalaning anyo ng mga pangalang Zerubabel, Sealtiel, Jeshua, at Jozadak.
