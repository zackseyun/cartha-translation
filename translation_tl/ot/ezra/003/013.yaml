  to: Hindi makilala ng mga tao ang tunog ng sigaw ng kagalakan mula sa tunog ng pagtangis ng mga tao,[a] sapagkat ang mga tao ay sumisigaw nang malakas,[b] at ang tunog ay narinig hanggang sa malayo.
