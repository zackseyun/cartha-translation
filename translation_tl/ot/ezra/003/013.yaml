  yaml_path: translation/ot/ezra/003/013.yaml
  text: And the people could not distinguish the sound of the shout of joy from the sound of the people’s weeping[a], for the people were shouting with a great shout[b], and the sound was heard far away.
translation:
  language: tl
  text: Hindi makilala ng mga tao ang tunog ng sigaw ng kagalakan mula sa tunog ng pagtangis ng mga tao,[a] sapagkat ang mga tao ay sumisigaw nang malakas,[b] at ang tunog ay narinig hanggang sa malayo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Hindi makilala ng mga tao ang tunog ng masayang sigawan mula sa tunog ng pagtangis ng mga tao.”'
    reason: lexical_alternative
  - marker: b
    text: 'Sa Hebreo, “sumisigaw ng isang malaking sigaw”; maaari ring isalin: “sumisigaw nang napakalakas.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַכִּירִים
  choice: Hindi matukoy
  rationale: Sa Hiphil, ipinahihiwatig dito ng נכר ang kawalan ng kakayahang makilala o maibukod ang isang tunog sa isa pa. Likas sa modernong Filipino ang “matukoy” sa kontekstong ito.
- source_word: קוֹל
  choice: tunog
  rationale: Tumutukoy ang קוֹל sa naririnig na penomenon, hindi sa nilalaman ng pananalita; kaya mas angkop ang “tunog” kaysa “tinig.”
- source_word: תְּרוּעַת הַשִּׂמְחָה
  choice: sigaw ng kagalakan
  rationale: Pinananatili nito ang pangngalang תְּרוּעָה bilang malakas na sigaw at ang kaugnayan nito sa הַשִּׂמְחָה, habang nananatiling natural at marangal sa Filipino.
- source_word: לְקוֹל בְּכִי הָעָם
  choice: sa gitna ng tunog ng pagtangis ng mga tao
  rationale: Ang לְ ay nag-uugnay sa dalawang tunog na hindi mapag-iba. Ang “sa gitna ng” ay natural na ipinakikitang natatabunan o nahahalo ang masayang sigaw sa pagtangis nang hindi labis na nilulutas ang sintaktikong ugnayan.
- source_word: כִּי
  choice: sapagkat
  rationale: Nagbibigay ang כִּי ng paliwanag kung bakit hindi matukoy ang dalawang tunog; malinaw at marangal ang “sapagkat.”
- source_word: מְרִיעִים תְּרוּעָה גְדוֹלָה
  choice: napakalakas ng kanilang sigawan
  rationale: Ang Hebreo ay may cognate construction, literal na “sumisigaw ng isang malaking sigaw.” Isinasalin ito nang natural sa Filipino habang pinananatili ang tindi at kolektibong ingay.
- source_word: נִשְׁמַע
  choice: narinig
  rationale: Pinananatili ng “narinig” ang pasibong diwa ng Niphal ng שׁמע.
- source_word: עַד לְמֵרָחוֹק
  choice: hanggang sa malayo
  rationale: Tahasang ipinahihiwatig ng parirala na umabot sa malayong lugar ang tunog; malapit ito sa anyo ng Hebreo at natural sa Filipino.
