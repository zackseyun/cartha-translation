translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang “pagtangis” upang panatilihin ang bigat ng damdamin, at iniwasan ang labis na literal na cognate construction na magiging asiwa sa Filipino.
