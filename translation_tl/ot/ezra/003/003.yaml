source:
  edition: WLC
  text: וַ/יָּכִ֤ינוּ הַ/מִּזְבֵּ֨חַ֙ עַל מְכ֣וֹנֹתָ֔י/ו כִּ֚י בְּ/אֵימָ֣ה עֲלֵי/הֶ֔ם מֵ/עַמֵּ֖י הָ/אֲרָצ֑וֹת ו/יעל עָלָ֤י/ו עֹלוֹת֙ לַֽ/יהוָ֔ה עֹל֖וֹת לַ/בֹּ֥קֶר וְ/לָ/עָֽרֶב־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/003/003.yaml
  text: They set up the altar on its foundations[a], for fear was upon them because of the peoples of the lands, and they offered up burnt offerings on it to Yahweh[b], burnt offerings morning and evening.
translation:
  language: tl
  text: Itinayo nila ang altar sa mga pundasyon nito[a], sapagkat natatakot sila dahil sa mga mamamayan ng mga lupain.[b] At sa altar ay naghandog sila para kay Yahweh ng mga handog na sinusunog, umaga at gabi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa patungan nito” o “sa dati nitong kinalalagyan.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “sapagkat ang takot ay nasa kanila mula sa mga mamamayan ng mga lupain,” ibig sabihin, natatakot sila dahil sa mga nakapaligid na mamamayan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּכִינוּ
  choice: Itinayo nila
  rationale: Ang Hiphil ng כון ay tumutukoy rito sa paglalagay at paghahanda sa altar upang magamit. Likas sa modernong Tagalog ang “itinayo” para sa muling paglalagay ng altar.
- source_word: הַמִּזְבֵּחַ
  choice: ang altar
  rationale: Karaniwang salin ng מזבח sa konteksto ng paghahandog.
- source_word: עַל מְכֹנוֹתָיו
  choice: sa mga pundasyon nito
  rationale: Pinananatili ang maramihang anyo at konkretong larawan ng מְכוֹנוֹת bilang mga pundasyon o pirming patungan ng altar.
- source_word: כִּי בְּאֵימָה עֲלֵיהֶם
  choice: sapagkat nababalot sila ng takot
  rationale: Natural na ipinahahayag sa Tagalog ang Hebreong idyoma na literal na “ang takot ay nasa ibabaw nila,” habang pinananatili ang matinding diwa ng אֵימָה.
- source_word: מֵעַמֵּי הָאֲרָצוֹת
  choice: dahil sa mga bayan ng mga lupain
  rationale: Maaaring magpahiwatig ang מִן ng pinagmulan o sanhi ng takot. Pinananatili ng “mga bayan ng mga lupain” ang mga maramihang anyo ng tekstong Hebreo.
- source_word: וַיַּעַל עָלָיו עֹלוֹת
  choice: At naghandog sila roon ... ng mga handog na sinusunog
  rationale: Ang Hiphil ng עלה kasama ng עֹלוֹת ay karaniwang pormula para sa paghahandog ng handog na lubusang sinusunog. Ang “roon” ay tumutukoy nang natural sa altar.
- source_word: לַיהוָה
  choice: kay Yahweh
  rationale: Isinasalin ang mismong pangalang tipan na יהוה bilang “Yahweh,” sa halip na palitan ito ng isang titulo.
- source_word: עֹלוֹת לַבֹּקֶר וְלָעָרֶב
  choice: mga handog na sinusunog, umaga at gabi
  rationale: Malinaw at natural na ipinahahayag ang palagiang dalawang oras ng paghahandog, habang naiiwasan ang mabigat na pag-uulit sa Tagalog.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang ginagamit ng talata ang Tetragrammaton. Ang “Yahweh” ay nagpapanatili rito bilang pangalan at hindi bilang titulo.
- issue: Ugnayan ng takot at pagtatayo ng altar
  choice: Pinanatiling sanhi ng kanilang pagkilos ang takot dahil sa mga nakapaligid na bayan
  alternative: Unawaing sa kabila ng kanilang takot itinayo nila ang altar
  rationale: Maaaring ipakahulugan ang כִּי bilang pagbibigay-dahilan sa agarang pagtatayo ng altar. Hindi dinaragdagan ng salin ang hindi tahasang “sa kabila ng,” kaya nananatili ang tensiyon ng teksto.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang pamilyar na “altar” at ang malinaw na pariralang “mga handog na sinusunog.” Pinanatili sa talababa ang literal na Hebreong idyoma at ang mga posibleng kahulugan ng pundasyon o pirming kinalalagyan.
