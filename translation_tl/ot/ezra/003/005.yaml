  to: Pagkatapos nito, inihandog nila ang palagiang handog na sinusunog[a], ang mga handog para sa mga bagong buwan[b] at para sa lahat ng banal na itinalagang kapistahan ni Yahweh[c], at ang kusang-loob na handog ng bawat taong bukal sa loob na maghandog kay Yahweh.
