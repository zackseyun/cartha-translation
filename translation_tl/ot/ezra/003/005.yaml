reference: Ezra 3:5
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/אַחֲרֵי כֵ֞ן עֹלַ֤ת תָּמִיד֙ וְ/לֶ֣/חֳדָשִׁ֔ים וּ/לְ/כָל מוֹעֲדֵ֥י יְהוָ֖ה הַ/מְקֻדָּשִׁ֑ים וּ/לְ/כֹ֛ל מִתְנַדֵּ֥ב נְדָבָ֖ה לַ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/003/005.yaml
  text: And after that came the regular burnt offering[a], and the offerings for the new moons and for all the appointed feasts of Yahweh that were consecrated[c][b], and for everyone who willingly offered a freewill offering to Yahweh.
translation:
  language: tl
  text: Pagkatapos nito, inihandog nila ang palagiang handog na sinusunog[a], ang mga handog para sa mga bagong buwan[b] at para sa lahat ng banal na itinalagang kapistahan ni Yahweh[c], at ang kusang-loob na handog ng bawat taong bukal sa loob na maghandog kay Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “tuluy-tuloy na handog na sinusunog” o “araw-araw na handog na sinusunog.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “mga bagong buwan,” na tumutukoy sa mga banal na pagdiriwang sa pasimula ng bawat buwan.
    reason: cultural_note
  - marker: c
    text: Maaari ring “lahat ng banal na takdang panahon ni Yahweh” o “lahat ng kapistahan ni Yahweh na ibinukod bilang banal.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחֲרֵי כֵן
  choice: Pagkatapos nito
  rationale: Likas na temporal na panandang nag-uugnay sa talata sa naunang paghahandog habang pinananatili ang pagkakasunod-sunod.
- source_word: עֹלַת תָּמִיד
  choice: ang palagiang handog na sinusunog
  rationale: Ang עֹלָה ay handog na lubusang sinusunog, at ang תָּמִיד ay nagsasaad ng tuloy-tuloy o regular na pag-uulit. Hindi labis na nililimitahan ng “palagian” ang kahulugan sa “araw-araw,” bagaman iyon ang tinutukoy na gawaing pangkulto.
- source_word: וְלֶחֳדָשִׁים
  choice: ang mga handog para sa mga bagong buwan
  rationale: Sa kontekstong pangkulto, ang חֹדֶשׁ ay tumutukoy sa pagdiriwang sa pasimula ng buwan, na minamarkahan ng bagong buwan. Idinagdag ang “mga handog” bilang likas na ellipsis mula sa konteksto.
- source_word: וּלְכָל מוֹעֲדֵי יְהוָה הַמְקֻדָּשִׁים
  choice: para sa lahat ng itinalagang kapistahan ni Yahweh
  rationale: Ang מוֹעֵד ay takdang panahon o kapistahang itinakda, at ang passive participle na הַמְקֻדָּשִׁים ay nagpapahiwatig na ang mga ito ay ibinukod bilang banal. Ang “itinalagang kapistahan” ay maikli at natural sa modernong Tagalog.
- source_word: וּלְכֹל מִתְנַדֵּב נְדָבָה
  choice: ang kusang-loob na handog ng bawat taong kusang naghandog
  rationale: Pinananatili ang pagbanggit kapwa sa taong boluntaryong naghahandog at sa handog na kusang ibinigay, pati ang sadyang pag-uulit ng magkaugnay na salita sa Hebreo.
- source_word: לַיהוָה
  choice: kay Yahweh
  rationale: Ginagamit ang personal na pangalang Yahweh upang katawanin nang tuwiran ang Tetragrammaton na יְהוָה.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehova
  rationale: Ang tekstong Hebreo ay tuwirang gumagamit ng Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalang tipan nang hindi ito pinapalitan ng isang titulo.
- issue: Saklaw ng מוֹעֵד at הַמְקֻדָּשִׁים
  choice: itinalagang kapistahan
  alternative: banal na takdang panahon / mga kapistahang ibinukod bilang banal
  rationale: Sa konteksto ng kalendaryong pansamba, ang mga takdang panahon ay mga kapistahan. Gayunman, hindi ipinapalagay na likas lamang ang kabanalan ng mga ito; ipinahihiwatig ng passive participle na itinalaga o ibinukod ang mga ito.
translation_notes:
  register: Modernong Filipino Tagalog na dignified ngunit madaling maunawaan. Ginamit ang “inihandog nila” at inulit ang “mga handog” upang buuin sa Tagalog ang eliptikong serye ng Hebreo ayon sa konteksto ng naunang talata. Iniwasan ang makalumang bokabularyo at pinanatili ang pangalang Yahweh.
