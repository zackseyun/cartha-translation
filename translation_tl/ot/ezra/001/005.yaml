base_translation:
  language: en
  yaml_path: translation/ot/ezra/001/005.yaml
  text: Then the heads of the fathers’ houses of Judah and Benjamin[a], and the priests and the Levites[b], arose—everyone whose spirit God had stirred—to go up to build the house of Yahweh that is in Jerusalem.
translation:
  language: tl
  text: Pagkatapos, tumindig ang mga pinuno ng mga angkan ng Juda at Benjamin, pati na ang mga pari at mga Levita—lahat ng pinukaw ng Diyos ang kanilang espiritu[a]—upang umahon at itayo ang bahay ni Yahweh[b] na nasa Jerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “lahat ng ginising ng Diyos ang kanilang espiritu” o “lahat ng inudyukan ng Diyos sa kanilang kalooban.”
    reason: lexical_alternative
  - marker: b
    text: Ang “bahay ni Yahweh” ay tumutukoy sa templo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּק֜וּמוּ
  choice: tumindig
  rationale: Ipinahihiwatig ng Qal wayyiqtol ng קום ang pagsisimula ng kanilang pagtugon. Pinananatili ng “tumindig” ang galaw ng salaysay nang hindi agad ipinakahulugang lumisan sila.
- source_word: רָאשֵׁי הָאָבוֹת
  choice: mga pinuno ng mga angkan
  rationale: Tumutukoy ito sa mga namumuno sa mga sambahayan o angkang nagmula sa iisang ninuno. Mas likas at malinaw sa makabagong Filipino ang “mga pinuno ng mga angkan” kaysa sa literal ngunit malabong “mga pinuno ng mga sambahayan ng mga ama.”
- source_word: לִיהוּדָה וּבִנְיָמִן
  choice: ng Juda at Benjamin
  rationale: Ang לְ ay nagpapahayag dito ng kaugnayan o pagkabilang sa mga lipi, hindi ng direksiyon.
- source_word: הַכֹּהֲנִים וְהַלְוִיִּם
  choice: mga pari at mga Levita
  rationale: Karaniwang katawagan sa mga pangkat na may tungkuling panrelihiyon at pangangkan.
- source_word: לְכֹל הֵעִיר הָאֱלֹהִים אֶת רוּחוֹ
  choice: ang lahat ng pinukaw ng Diyos sa kanilang espiritu
  rationale: Ipinapakita ng parirala na ang pagkilos nila ay bunga ng panloob na pagpukaw ng Diyos. Ang “kanilang” ay likas na distributibong anyo sa Filipino para sa Hebreong isahang רוּחוֹ, samantalang pinananatili ng “espiritu” ang salita at teolohikal na himig ng Hebreo.
- source_word: לַעֲלוֹת
  choice: upang umahon
  rationale: Karaniwang inilalarawan ng עלה ang paglalakbay paakyat sa Jerusalem; pinananatili ng “umahon” ang topograpiko at tradisyonal na diwa nito.
- source_word: לִבְנוֹת
  choice: itayo
  rationale: Ang pandiwa ay payak na “magtayo/magpatayo,” hindi tahasang “muling itayo.” Hindi idinaragdag sa salin ang ideya ng muling pagtatayo kahit ipinahihiwatig iyon ng konteksto.
- source_word: בֵּית יְהוָה
  choice: bahay ni Yahweh
  rationale: Pinananatili ang literal na larawan ng “bahay” sa halip na agad itong ipakahulugang “templo.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin ang Tetragrammaton bilang pangalang “Yahweh,” hindi bilang titulong “PANGINOON.”
- source_word: אֲשֶׁר בִּירוּשָׁלִָם
  choice: na nasa Jerusalem
  rationale: Tinutukoy ng sugnay ang kinaroroonan ng bahay nang hindi nagpapasya kung dapat ilarawan ang wasak na gusali sa nakaraang panahunan.
theological_decisions:
- issue: Paglalahad sa pagkilos ng Diyos sa espiritu ng mga tao
  choice: pinukaw ng Diyos sa kanilang espiritu
  alternative: inudyukan ng Diyos / binigyang-inspirasyon ng Diyos
  rationale: Tahasang iniuugnay ng Hebreo sa Diyos ang panloob na pagpukaw, ngunit hindi nito ipinapaliwanag ang paraan. Pinananatili ng salin ang ugnayan ng pagkilos ng Diyos at pagtugon ng tao nang hindi nagdaragdag ng tiyak na doktrinal o karanasang paliwanag.
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah / ang PANGINOON
  rationale: Pangalan mismo ang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang pagkakaiba ng banal na pangalan sa karaniwang titulong “Panginoon.”
- issue: “Bahay” o “templo” para sa בֵּית יְהוָה
  choice: bahay ni Yahweh
  alternative: templo ni Yahweh
  rationale: Ang “bahay” ang tuwirang larawan sa Hebreo, samantalang ang “templo” ay tama ayon sa konteksto ngunit mas interpretibo. Nililinaw ito sa talababa upang manatiling madaling maunawaan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “angkan” para sa sinaunang yunit ng pamilya, “umahon” para mapanatili ang pananalitang ginagamit sa paglalakbay patungong Jerusalem, at “bahay ni Yahweh” upang mapanatili ang konkretong larawan ng Hebreo habang nililinaw sa talababa na templo ang tinutukoy.
