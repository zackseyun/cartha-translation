  terminology: Ang “mga pinuno ng mga angkan,” “mga pari,” “mga Levita,” “bahay ni Yahweh,” at “Jerusalem” ay angkop. Ang “espiritu” ay pinanatili para sa רוּחַ, habang nililinaw ng talababa na maaari rin itong tumukoy sa kalooban.
