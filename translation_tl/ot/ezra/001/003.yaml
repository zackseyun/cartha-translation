base_translation:
  language: en
  yaml_path: translation/ot/ezra/001/003.yaml
  text: Whoever among all his people is among you[a], may his God be with him, and let him go up to Jerusalem, which is in Judah, and rebuild the house of Yahweh[b], the God of Israel—he is the God who is in Jerusalem.
translation:
  language: tl
  text: Sinuman sa inyo na kabilang sa kanyang buong bayan, sumakanya nawa ang kanyang Diyos. Pumunta siya sa Jerusalem na nasa Juda at itayo niyang muli[a] ang bahay ni Yahweh, ang Diyos ng Israel—siya ang Diyos na nasa Jerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “itayo ang bahay ni Yahweh.” Ang pandiwang Hebreo ay payak na nangangahulugang “itayo”; nililinaw ng “muling itayo” ang konteksto ng pagpapanumbalik.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי בָכֶם מִכָּל עַמּוֹ
  choice: Sinuman sa inyo na kabilang sa lahat ng kanyang bayan
  rationale: Ginagawang paanyayang walang-tiyak na tao ang מִי sa konteksto, habang pinananatili ang hulaping ikatlong panauhan sa “kanyang bayan” nang hindi tahasang tinutukoy kung kanino ang bayan.
- source_word: יְהִי אֱלֹהָיו עִמּוֹ
  choice: sumakanya nawa ang kanyang Diyos
  rationale: Pinananatili ng “nawa” ang diwang jussive na basbas o mabuting hangarin.
- source_word: וְיַעַל
  choice: Pumunta siya
  rationale: Natural ito sa makabagong Tagalog; hindi ginamit ang literal na “umakyat” dahil hindi iyon karaniwang idyoma sa Tagalog para sa paglalakbay patungong Jerusalem.
- source_word: לִירוּשָׁלַם אֲשֶׁר בִּיהוּדָה
  choice: sa Jerusalem na nasa Juda
  rationale: Direkta at natural na pinananatili ang heograpikong paglilinaw ng sugnay na may אֲשֶׁר.
- source_word: וְיִבֶן
  choice: at muling itayo
  rationale: Bagaman “itayo” ang payak na kahulugan ng בנה, ipinahihiwatig ng konteksto ng pagpapanumbalik matapos ang pagkawasak na muling pagtatayo ang tinutukoy.
- source_word: בֵּית יְהוָה
  choice: bahay ni Yahweh
  rationale: Pinananatili ang Hebreong metapora na “bahay” at isinasalin ang pangalang tipan na יהוה bilang “Yahweh.”
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ang Diyos ng Israel
  rationale: Tuwirang salin ng pariralang construct at malinaw sa modernong Tagalog.
- source_word: הוּא הָאֱלֹהִים אֲשֶׁר בִּירוּשָׁלָם
  choice: siya ang Diyos na nasa Jerusalem
  rationale: Pinananatili ang mariing panghalip, ang tiyak na anyo ng אֱלֹהִים, at ang lokatibong sugnay nang hindi ito pinapaliwanag o pinahihina.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Pangngalang pantangi ang Tetragrammaton sa teksto; ang “Yahweh” ay tuwirang kumakatawan sa pangalang tipan nang hindi ito pinapalitan ng titulo.
- issue: Sugnay na nag-uugnay sa Diyos sa Jerusalem
  choice: siya ang Diyos na nasa Jerusalem
  alternative: siya ang Diyos, na nasa Jerusalem; siya ang Diyos ng Jerusalem
  rationale: Pinananatili ang sinaunang lokatibong pananalita ng pahayag ni Ciro at ang teolohikal na tensiyon nito, nang hindi ipinapalagay na saklaw lamang ng Diyos ang Jerusalem o binabago ang sugnay tungo sa pagmamay-ari.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “bahay ni Yahweh” upang mapanatili ang konkretong Hebreong larawan, sa halip na agad itong gawing “templo.”
