    issue: Hindi malinaw ang “kabilang sa lahat ng kanyang bayan.”
    rationale: Ang מִכָּל עַמּוֹ ay tumutukoy sa kabuuan ng “kanyang bayan”; sa Tagalog, ang “kabilang sa lahat ng” ay madaling mabasa na kabilang sa bawat indibidwal, sa halip na kabilang sa bayang iyon bilang kabuuan.
  - severity: medium
    issue: Hindi magkatugma ang anyo ng pandiwa sa “Pumunta siya ... at muling itayo.”
    rationale: Ang ikalawang pandiwa ay kailangang iugnay nang malinaw sa paksa. Ang “at itayo niyang muli” ay nagpapanatili ng magkasunod na jussive na diwa nang likas sa modernong Filipino.
  - severity: low
    issue: Nasa dulo ng talata ang angkla ng talababa bagaman ang tinutukoy nito ay “muling itayo.”
    rationale: Dapat idikit ang angkla sa mismong salitang may lexical na alternatibo upang malinaw ang saklaw ng talababa.
