revisions:
- from: Sinuman sa inyo na kabilang sa lahat ng kanyang bayan, sumakanya nawa ang kanyang Diyos. Pumunta siya sa Jerusalem na nasa Juda at muling itayo ang bahay ni Yahweh, ang Diyos ng Israel—siya ang Diyos na nasa Jerusalem.[a]
  to: Sinuman sa inyo na kabilang sa kanyang buong bayan, sumakanya nawa ang kanyang Diyos. Pumunta siya sa Jerusalem na nasa Juda at itayo niyang muli[a] ang bahay ni Yahweh, ang Diyos ng Israel—siya ang Diyos na nasa Jerusalem.
  rationale: Inayos ang pambungad upang maging malinaw sa Tagalog na ang tao ay kabilang sa buong bayan na tinutukoy, hindi sa bawat tao sa bayan. Inayos din ang pagkakaugnay ng mga pandiwa at inilipat ang angkla ng talababa sa “muli,” ang salitang nagpapahayag ng interpretatibong paglilinaw sa literal na “itayo.”
