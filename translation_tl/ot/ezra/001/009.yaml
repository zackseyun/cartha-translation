  text: 'And this was their number: 30 gold basins[a], 1,000 silver basins, and 29 knives.'
translation:
  language: tl
  text: 'At ito ang bilang ng mga iyon: 30 gintong palanggana, 1,000 pilak na palanggana, at 29 na kutsilyo.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O maaaring “29 na iba pang sisidlan,” “29 na kaparehong sisidlan,” o “29 na pamalit na sisidlan”; hindi tiyak ang kahulugan ng salitang Hebreo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה מִסְפָּרָם
  choice: At ito ang bilang ng mga iyon
  rationale: Ipinakikilala nito ang talaan ng mga sisidlan. Pinananatili ang diwa ng panghalip na tumutukoy sa mga bagay na nabanggit, habang natural ang ayos sa modernong Tagalog.
- source_word: אֲגַרְטְלֵי
  choice: mga palanggana
  rationale: Tumutukoy ang salita sa isang uri ng sisidlan sa templo. Ang “palanggana” ay malinaw at angkop sa konteksto ng imbentaryo, bagaman maaari ring isiping mangkok o sisidlan.
- source_word: זָהָב / כֶסֶף
  choice: gintong / pilak na
  rationale: Likas na mga panuring sa Tagalog para sa materyal na yari sa ginto at pilak.
- source_word: שְׁלֹשִׁים / אָלֶף / תִּשְׁעָה וְעֶשְׂרִים
  choice: 30 / 1,000 / 29
  rationale: Ginamit ang mga numerong Arabe upang madaling mabasa ang talaan.
- source_word: מַחֲלָפִים
  choice: mga kutsilyo
  rationale: Malabo at pinagtatalunan ang kahulugan ng salitang Hebreo. Ang “mga kutsilyo” ay matagal nang ginagamit at posibleng tumukoy sa mga kagamitang kaugnay ng paglilingkod sa templo; inilalahad sa talababa ang iba pang maaaring kahulugan.
