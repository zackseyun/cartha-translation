  text: וַ/יּֽוֹצִיאֵ֗/ם כּ֚וֹרֶשׁ מֶ֣לֶךְ פָּרַ֔ס עַל יַ֖ד מִתְרְדָ֣ת הַ/גִּזְבָּ֑ר וַֽ/יִּסְפְּרֵ/ם֙ לְ/שֵׁשְׁבַּצַּ֔ר הַ/נָּשִׂ֖יא לִ/יהוּדָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/001/008.yaml
  text: King Cyrus of Persia brought them out by the hand of Mithredath the treasurer[a], and counted them out to Sheshbazzar[b], the prince of Judah.
translation:
  language: tl
  text: Inilabas ni Haring Ciro ng Persia ang mga iyon sa pamamagitan ni Mitredat na ingat-yaman[a], at isa-isa niyang binilang ang mga iyon para kay Sesbazar, ang pinuno[b] ng Juda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal na, “sa kamay ni Mitredat.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “prinsipe ng Juda.” Ang salitang Hebreo ay maaaring tumukoy sa isang pinuno o tagapamahala sa pangkalahatan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹצִיאֵם
  choice: Inilabas ... ang mga iyon
  rationale: Ang Hiphil ng יצא ay causative, ‘ilabas’ o ‘ipakuha palabas.’ Tumutukoy ang panghalip sa mga kagamitan ng templo sa naunang talata, kaya malinaw na bagay ang inilabas, hindi mga tao.
- source_word: כּוֹרֶשׁ מֶלֶךְ פָּרַס
  choice: Haring Ciro ng Persia
  rationale: Likas na ayos sa modernong Tagalog para sa pangalan, titulong maharlika, at kaharian.
- source_word: עַל יַד
  choice: sa pamamagitan ni
  rationale: Ipinapahayag ng idyomang Hebreo na literal na ‘sa pamamagitan ng kamay ni’ ang ahensiya o tagapamagitan; natural at malinaw sa Tagalog ang ‘sa pamamagitan ni.’
- source_word: מִתְרְדָת
  choice: Mitredat
  rationale: Transliterasyon ng pangalang Persiano sa anyong madaling basahin at bigkasin sa Tagalog.
- source_word: הַגִּזְבָּר
  choice: ingat-yaman
  rationale: Tumutukoy sa opisyal na nangangasiwa sa kabang-yaman; ang ‘ingat-yaman’ ay maikli, dignified, at angkop sa konteksto.
- source_word: וַיִּסְפְּרֵם
  choice: isa-isa niyang binilang ang mga iyon
  rationale: Ang ספר dito ay pagbilang o pagtatala ng bilang. Ipinahihiwatig ng ‘isa-isa’ ang maingat na pagbilang ng mga kagamitang ibinibigay, nang hindi dinaragdagan ang kilos ng teksto.
- source_word: לְשֵׁשְׁבַּצַּר
  choice: para kay Sesbazar
  rationale: Ang לְ ay nagpapakita ng tatanggap. Ang pangalan ay isinalin sa transliterasyong angkop sa baybay at bigkas ng Tagalog.
- source_word: הַנָּשִׂיא
  choice: ang pinuno
  rationale: 'Malawak ang saklaw ng נָשִׂיא: pinuno, prinsipe, o namamahala. Pinananatili ng ‘pinuno’ ang pangkalahatang kahulugan nang hindi ipinapalagay ang tiyak na titulong administratibong ‘gobernador.’'
- source_word: לִיהוּדָה
  choice: ng Juda
  rationale: Iniuugnay nito si Sesbazar sa Juda; natural sa Tagalog ang ‘pinuno ng Juda.’
theological_decisions:
- issue: Tiyak na katungkulan ni Sesbazar
  choice: pinuno ng Juda
  alternative: prinsipe ng Juda; gobernador ng Juda
  rationale: Hindi tiyak sa נָשִׂיא ang isang partikular na maharlika o administratibong katungkulan. Pinananatili ng ‘pinuno’ ang leksikal na lawak at iniiwasang magpasok ng higit na espesipikong interpretasyon.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang ‘mga iyon’ upang malinaw na tumukoy sa mga kagamitan sa naunang talata. Mas natural ang ‘sa pamamagitan ni’ kaysa sa literal na ‘sa kamay ni,’ habang itinatala sa talababa ang Hebreong idyoma.
