id: EZR.1.2
reference: Ezra 1:2
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: כֹּ֣ה אָמַ֗ר כֹּ֚רֶשׁ מֶ֣לֶךְ פָּרַ֔ס כֹּ֚ל מַמְלְכ֣וֹת הָ/אָ֔רֶץ נָ֣תַן לִ֔/י יְהוָ֖ה אֱלֹהֵ֣י הַ/שָּׁמָ֑יִם וְ/הֽוּא פָקַ֤ד עָלַ/י֙ לִ/בְנֽוֹת ל֣/וֹ בַ֔יִת בִּ/ירוּשָׁלִַ֖ם אֲשֶׁ֥ר בִּֽ/יהוּדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/001/002.yaml
  text: 'Thus says Cyrus king of Persia: Yahweh[a], the God of heaven, has given me all the kingdoms of the earth, and he has appointed me to build a house for him in Jerusalem[b], which is in Judah.'
translation:
  language: tl
  text: 'Ganito ang sabi ni Ciro, hari ng Persia: “Ibinigay sa akin ni Yahweh, ang Diyos ng langit, ang lahat ng kaharian sa daigdig. At inatasan niya ako[a] na magtayo para sa kanya ng isang bahay[b] sa Jerusalem, na nasa Juda.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “iniutos niya sa akin.”
    reason: lexical_alternative
  - marker: b
    text: Ibig sabihin, ang templo sa Jerusalem.
    reason: cultural_note
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: Ganito ang sabi
  rationale: Likas at marangal na pormula sa Filipino para sa pormal na pagpapahayag ng isang hari, habang pinananatili ang himig ng Hebreong pahayag.
- source_word: כֹּרֶשׁ מֶלֶךְ פָּרַס
  choice: Ciro, hari ng Persia
  rationale: Ginamit ang karaniwang anyong Filipino ng pangalan at tahasang pinanatili ang maharlikang katungkulan at kaharian.
- source_word: כֹּל מַמְלְכוֹת הָאָרֶץ
  choice: ang lahat ng kaharian sa daigdig
  rationale: Pinanatili ang pangmaramihang “mga kaharian” at ang malawak na saklaw ng הָאָרֶץ na angkop sa pahayag tungkol sa kapangyarihang imperyal.
- source_word: נָתַן לִי
  choice: Ibinigay sa akin
  rationale: Malinaw na ipinapahayag ang naganap na pagkakaloob na siyang batayan ng kasalukuyang paghahari ni Ciro.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinumbasan ang banal na pangalang YHWH sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֵי הַשָּׁמַיִם
  choice: ang Diyos ng langit
  rationale: Ito ang natural na anyong Filipino ng titulong Hebreo; hindi kailangang gawing maramihan ang “langit” sa pariralang ito.
- source_word: פָקַד עָלַי
  choice: inatasan niya ako
  rationale: Ipinahahayag ng “inatasan” ang pagbibigay ng pananagutan o utos nang hindi labis na pinatitindi ang posibleng kahulugan ng pandiwa.
- source_word: לִבְנוֹת לוֹ בַיִת
  choice: na magtayo para sa kanya ng isang bahay
  rationale: Pinanatili ang literal na “bahay” at ang benepaktibong diwa ng לוֹ; ipinaliliwanag sa talababa na templo ang tinutukoy sa konteksto.
- source_word: בִּירוּשָׁלִַם אֲשֶׁר בִּיהוּדָה
  choice: sa Jerusalem, na nasa Juda
  rationale: Tahasan at natural na pinanatili ang sugnay na tumutukoy sa kinalalagyan ng Jerusalem.
theological_decisions:
- issue: Pagtutumbas sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehovah
  rationale: Personal na pangalan ang tuwirang nasa tekstong Hebreo; ang transliterasyong “Yahweh” ang nagpapanatili rito sa halip na palitan ng titulo.
- issue: Kung isasalin ang בַיִת bilang “bahay” o “templo”
  choice: bahay
  alternative: templo
  rationale: “Bahay” ang tuwirang leksikal na kahulugan. Malinaw sa konteksto na templo ang tinutukoy, kaya inilagay ang paliwanag sa talababa sa halip na ipalit ito sa pangunahing teksto.
- issue: Lakas ng kahulugan ng פָקַד עָלַי
  choice: inatasan niya ako
  alternative: iniutos niya sa akin
  rationale: Maaaring mangahulugan ang pandiwa ng pag-aatas o mahigpit na pag-uutos. Pinili ang “inatasan” upang panatilihin ang diwa ng pagkakatiwala ng tungkulin nang hindi nilulutas nang labis ang antas ng puwersa nito.
translation_notes:
  register: Modernong Filipino na pormal at marangal ngunit madaling maunawaan. Ginamit ang “Ganito ang sabi” para sa himig ng maharlikang proklamasyon; iniwasan ang lipas o labis na teknikal na pananalita. Ang paghahati sa dalawang pangungusap ay nagpapalinaw sa pahayag nang hindi binabago ang ugnayang ipinahihiwatig ng Hebreo.
