base_translation:
  language: en
  yaml_path: translation/ot/ezra/001/011.yaml
  text: All the articles of gold and silver were five thousand four hundred in all[c][b][a]. Sheshbazzar brought them up with the exiles when they were brought up from Babylon to Jerusalem.
translation:
  language: tl
  text: Ang kabuuang bilang ng lahat ng kagamitang yari sa ginto at pilak ay limang libo at apat na raan.[a] Iniakyat ni Sesbazar ang lahat ng ito kasama ng mga ipinatapon nang iakyat ang mga ipinatapon mula sa Babilonia patungong Jerusalem.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa kabuuan ng tala sa mga talata 9–10 ay 2,499 ang bilang; gayunman, 5,400 ang kabuuang bilang na nakasaad dito sa tekstong Hebreo. Maaaring kabilang sa kabuuan ang iba pang kagamitang hindi isa-isang binanggit.
    reason: textual_or_numerical_note
  - marker: b
    text: Dalawang ulit ginagamit sa Hebreo ang ugat na may diwang “umahon” o “magpaahon,” ayon sa nakaugaliang pagsasabing umaahon patungong Jerusalem.
    reason: cultural_note
lexical_decisions:
- source_word: כָּל כֵּלִים לַזָּהָב וְלַכֶּסֶף
  choice: Ang lahat ng kagamitang ginto at pilak
  rationale: Ang כֵּלִים ay malawak na katawagan sa mga kagamitan o bagay, at ang mga unlaping ל ay nag-uuri rito ayon sa materyal. Ang “kagamitang ginto at pilak” ay natural sa Filipino at akma sa mga kagamitan ng templo.
- source_word: חֲמֵשֶׁת אֲלָפִים וְאַרְבַּע מֵאוֹת הַכֹּל
  choice: limang libo at apatnaraan lahat
  rationale: Tuwirang isinasalin ang bilang at pinananatili ang pangwakas na pagbubuod na הַכֹּל sa natural na pariralang “lahat.”
- source_word: הֶעֱלָה
  choice: Dinala pataas
  rationale: Pinananatili ang diwa ng Hiphil ng עלה, “magdala paakyat,” pati ang nakaugaliang paglalarawan sa pagpunta sa Jerusalem bilang pag-ahon.
- source_word: שֵׁשְׁבַּצַּר
  choice: Sesbazar
  rationale: Isinulat ang pangalang Hebreo sa anyong madaling basahin at bigkasin sa Filipino.
- source_word: הַגּוֹלָה
  choice: mga ipinatapon
  rationale: Sa konteksto, tumutukoy ito sa pangkat ng mga taong ipinatapon na bumabalik, hindi lamang sa kalagayan ng pagkakatapon.
- source_word: הֵעָלוֹת הַגּוֹלָה
  choice: nang iahon sila
  rationale: Ang infinitive construct na Hiphil ay inihayag bilang sugnay na pangyayari, habang pinananatili ang causative/passive na anyo at ang ikalawang paggamit ng wikang pag-ahon.
- source_word: מִבָּבֶל לִירוּשָׁלִָם
  choice: mula sa Babilonia patungong Jerusalem
  rationale: Tuwirang paglalahad ng pinagmulan at patutunguhan.
theological_decisions:
- issue: Wikang pag-ahon patungong Jerusalem sa עלה
  choice: Panatilihin ang “pataas” at “iaahon”
  alternative: Isalin lamang na “dinala” at “dinala” o “pumunta”
  rationale: Dalawang ulit ginagamit ng Hebreo ang ugat עלה. Ang pagpapanatili sa diwa ng pag-ahon ay nag-iingat sa heograpiko at pampanitikang himig nang hindi nagdaragdag ng doktrinang wala sa teksto.
- issue: Tinutukoy ng הַגּוֹלָה
  choice: mga ipinatapon, bilang mga tao
  alternative: pagkakatapon o sambayanan ng mga ipinatapon
  rationale: Ang konteksto ay ang nagbabalik na pangkat ng mga tao mula sa Babilonia, bagaman maaaring mas malawak ang saklaw ng salitang Hebreo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kagamitan” bilang malawak na katawagan sa mga bagay ng templo, at pinanatili ang dalawang pahiwatig ng pag-ahon sa Jerusalem. Ang “mga ipinatapon” ay mas natural at tiyak kaysa sa abstraktong “pagkakatapon.”
