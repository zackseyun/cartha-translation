  terminology: Ang “kagamitan,” “mga ipinatapon,” “Babilonia,” at “Jerusalem” ay angkop. Pinananatili ng “iniakyat” at “iakyat” ang paulit-ulit na wikang pag-ahon ng Hebreo nang hindi dinaragdagan ang kahulugan.
