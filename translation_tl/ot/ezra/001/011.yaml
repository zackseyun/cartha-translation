- from: Ang lahat ng kagamitang ginto at pilak ay limang libo at apatnaraan lahat.[a] Dinala pataas ni Sesbazar ang mga ito kasama ng mga ipinatapon nang iahon sila mula sa Babilonia patungong Jerusalem.[b]
  to: Ang kabuuang bilang ng lahat ng kagamitang yari sa ginto at pilak ay limang libo at apat na raan.[a] Iniakyat ni Sesbazar ang lahat ng ito kasama ng mga ipinatapon nang iakyat ang mga ipinatapon mula sa Babilonia patungong Jerusalem.[b]
  rationale: Inayos ang pagbubuod ng bilang upang maging natural sa modernong Filipino, ginawang tahasan ang ugnayan ng mga kagamitan sa ginto at pilak, at inalis ang kalabuan ng panghalip sa huling sugnay. Pinanatili ang dalawang paggamit ng wikang pag-ahon at ang kahulugang ang mga ipinatapon ang bumabalik mula Babilonia.
