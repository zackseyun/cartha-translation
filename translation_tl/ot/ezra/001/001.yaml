  terminology: Ang “Yahweh,” “Ciro,” “Persia,” “Jeremias,” “salita,” at “espiritu” ay angkop at pare-pareho. Pinananatili ng “espiritu” ang saklaw ng רוח nang hindi ito ginagawang “kalooban” o “isip.”
