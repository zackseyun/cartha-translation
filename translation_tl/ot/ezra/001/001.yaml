  text: וּ/בִ/שְׁנַ֣ת אַחַ֗ת לְ/כ֨וֹרֶשׁ֙ מֶ֣לֶךְ פָּרַ֔ס לִ/כְל֥וֹת דְּבַר יְהוָ֖ה מִ/פִּ֣י יִרְמְיָ֑ה הֵעִ֣יר יְהוָ֗ה אֶת ר֨וּחַ֙ כֹּ֣רֶשׁ מֶֽלֶךְ פָּרַ֔ס וַ/יַּֽעֲבֶר קוֹל֙ בְּ/כָל מַלְכוּת֔/וֹ וְ/גַם בְּ/מִכְתָּ֖ב לֵ/אמֹֽר־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/001/001.yaml
  text: 'In the first year of Cyrus king of Persia[a], so that the word of Yahweh from the mouth of Jeremiah might be fulfilled, Yahweh stirred up the spirit of Cyrus king of Persia, and he sent a proclamation throughout all his kingdom, and also in writing[c][b], saying:'
translation:
  language: tl
  text: 'Noong unang taon ng paghahari ni Ciro, hari ng Persia, upang matupad[a] ang salita ni Yahweh na ipinahayag sa pamamagitan ni Jeremias[b], pinukaw ni Yahweh ang espiritu ni Ciro, hari ng Persia. At nagpalaganap si Ciro ng isang pahayag sa buong kaharian niya, at gayundin sa pamamagitan ng sulat[c], na nagsasabi:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “upang malubos” o “upang makumpleto ang salita ni Yahweh.” Sa konteksto, tumutukoy ito sa pagsasakatuparan ng ipinahayag na salita.'
    reason: lexical_alternative
  - marker: b
    text: 'Literal: “mula sa bibig ni Jeremias,” isang Hebreong paraan ng pagsasabing si Jeremias ang taong tagapagsalita na pinagdaanan ng salita ni Yahweh.'
    reason: lexical_alternative
  - marker: c
    text: Ang Hebreo ay maaaring isaling, “nagpalaganap siya ng isang pahayag sa buong kaharian niya, at gayundin sa pamamagitan ng sulat.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִשְׁנַת אַחַת לְכוֹרֶשׁ
  choice: Noong unang taon ng paghahari ni Ciro
  rationale: Ang parirala ay pormula ng pagtakda ng panahon batay sa unang taon ng paghahari ng hari. Likas sa modernong Tagalog ang pagdaragdag ng “paghahari” upang luminaw ang kahulugan nang hindi nagdaragdag ng bagong pangyayari.
- source_word: לִכְלוֹת דְּבַר יְהוָה
  choice: upang matupad ang salita ni Yahweh
  rationale: Ang לִכְלוֹת ay tumutukoy sa pagdadala sa kaganapan o katuparan ng salita. Ang “matupad” ang likas na salin sa konteksto ng katuparan ng pahayag na propetiko.
- source_word: מִפִּי יִרְמְיָה
  choice: na ipinasabi sa pamamagitan ni Jeremias
  rationale: Literal itong “mula sa bibig ni Jeremias.” Ipinahahayag ng salin ang papel ni Jeremias bilang taong tagapagsalita habang pinananatiling kay Yahweh nagmula ang salita.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin sa pamamagitan ng transliterasyon ang personal na pangalang banal sa halip na palitan ito ng isang titulo.
- source_word: הֵעִיר יְהוָה אֶת רוּחַ כֹּרֶשׁ
  choice: pinukaw ni Yahweh ang espiritu ni Ciro
  rationale: Ang pandiwa ay nagsasaad ng pag-udyok o pagpukaw tungo sa pagkilos. Pinananatili ng “espiritu” ang lawak ng רוּחַ, na maaaring tumukoy sa panloob na disposisyon o saloobin.
- source_word: וַיַּעֲבֶר קוֹל
  choice: ipinalaganap ni Ciro ang isang pahayag
  rationale: Ang Hebreong idyoma ay literal na pagpaparaan ng isang tinig o pahayag at tumutukoy sa pagpapalaganap ng isang opisyal na proklamasyon.
- source_word: בְּכָל מַלְכוּתוֹ
  choice: sa buong kaharian niya
  rationale: Ipinahahayag nito na umabot ang proklamasyon sa saklaw ng buong kaharian.
- source_word: וְגַם בְּמִכְתָּב
  choice: at ipinasulat din ito
  rationale: Ipinakikita ng parirala na bukod sa ipinahayag sa madla, inilabas din ang proklamasyon sa nakasulat na anyo.
- source_word: לֵאמֹר
  choice: 'Ganito ang sabi:'
  rationale: Likas na pambungad ito sa Tagalog para sa tuwirang sipi na kasunod.
theological_decisions:
- issue: Paglalahad sa pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Personal na pangalan ang nasa tekstong Hebreo; pinananatili ng “Yahweh” ang pagkakaibang ito sa isang titulo.
- issue: Kahulugan ng לִכְלוֹת sa kaugnayan ng salita ni Yahweh
  choice: upang matupad
  alternative: upang malubos / upang makumpleto
  rationale: Ipinapakita ng konteksto ang pagsasakatuparan sa kasaysayan ng salitang ipinahayag sa pamamagitan ni Jeremias. Hindi nito nilulutas kung aling tiyak na pahayag ni Jeremias ang tinutukoy.
- issue: Saklaw ng רוּחַ כֹּרֶשׁ
  choice: espiritu ni Ciro
  alternative: kalooban ni Ciro
  rationale: Pinananatili ng “espiritu” ang leksikal at teolohikal na lawak ng רוּחַ at hindi ito nililimitahan sa isip, damdamin, o pasiya lamang.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “Ciro” at “Jeremias,” mga nakaugaliang anyo sa Tagalog. Iniwasan ang sobrang literal na mga idyomang magiging malabo, ngunit nilagay sa talababa ang mahahalagang anyong literal at pinanatili ang “espiritu” upang huwag paliitin ang ambigwidad ng Hebreo.
