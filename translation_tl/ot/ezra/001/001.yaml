    rationale: Ang parirala ay nagsasabing ang proklamasyon ay ginawa rin sa nakasulat na anyo; hindi nito kinakailangang idiin na ipinag-utos ni Ciro na isulat ito. Mas ligtas ang “at gayundin sa pamamagitan ng sulat.”
