    rationale: Ang “ibang uri” ay maaaring tumukoy lamang sa isang naiibang klase, samantalang ang mahirap na Hebreong termino ay maaaring magpahiwatig ng “ikalawang uri,” “doble,” o mga kopya. Ang “ikalawang uri,” na may talababa, ay mas malapit sa audit trail at nananatiling maingat.
  - severity: low
