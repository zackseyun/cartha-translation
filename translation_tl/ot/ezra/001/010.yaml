translation:
  language: tl
  text: 30 mangkok na ginto, 410 mangkok na pilak na ikalawang uri,[a] at 1,000 iba pang sisidlan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “410 dobleng mangkok na pilak.” Hindi tiyak ang kahulugan sa imbentaryong ito ng salitang Hebreo na isinaling “na ikalawang uri”; maaaring tumukoy ito sa ikalawang pangkat, mga dobleng sisidlan, o isang dobleng anyo.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּפוֹרֵי
  choice: mangkok
  rationale: Tumutukoy ang salita sa isang uri ng sisidlan. Ang “mangkok” ay malinaw at natural sa makabagong Filipino nang hindi labis na tinutukoy ang eksaktong hugis.
- source_word: זָהָב
  choice: ginto
  rationale: Karaniwang katawagan sa materyal; inilalarawan dito ang mga mangkok.
- source_word: שְׁלֹשִׁים
  choice: '30'
  rationale: Ginamit ang numero para sa malinaw at pare-parehong paglalahad ng imbentaryo.
- source_word: כְּפוֹרֵי כֶסֶף
  choice: mangkok na pilak
  rationale: Pinanatiling pareho ang salin sa naunang כְּפוֹרֵי, at ang pilak ang materyal ng sisidlan.
- source_word: מִשְׁנִים
  choice: na ibang uri
  rationale: Hindi tiyak ang kahulugan sa konteksto ng imbentaryo. Ipinahihiwatig ng saling ito ang pagkakaiba ng pangkat nang hindi ipinipilit ang kahulugang “doble” o “mga kopya.”
- source_word: אַרְבַּע מֵאוֹת וַעֲשָׂרָה
  choice: '410'
  rationale: Ginamit ang numero para sa madaling pagbasa sa talaan.
- source_word: כֵּלִים
  choice: sisidlan
  rationale: Malawak na katawagan ito para sa mga kagamitan o bagay, lalo na sa konteksto ng mga gamit sa templo. Ang “sisidlan” ay angkop sa kalapit na mga mangkok.
- source_word: אֲחֵרִים
  choice: iba pang
  rationale: Direktang ipinakikita ang pagkakaiba ng mga ito sa mga naunang nakatalang bagay.
- source_word: אָלֶף
  choice: 1,000
  rationale: Ginamit ang numero upang maging pare-pareho ang anyo ng mga bilang sa imbentaryo.
