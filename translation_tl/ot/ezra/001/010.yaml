    rationale: Ang “mga kaparehong sisidlan” ay hindi gaanong tuwirang katumbas ng posibleng “duplicates.” Ang “mga dobleng sisidlan” ay mas malinaw, habang kinikilala pa rin ang kawalang-katiyakan.
