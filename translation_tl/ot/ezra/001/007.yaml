  text: וְ/הַ/מֶּ֣לֶךְ כּ֔וֹרֶשׁ הוֹצִ֖יא אֶת כְּלֵ֣י בֵית יְהוָ֑ה אֲשֶׁ֨ר הוֹצִ֤יא נְבֽוּכַדְנֶצַּר֙ מִ/יר֣וּשָׁלִַ֔ם וַֽ/יִּתְּנֵ֖/ם בְּ/בֵ֥ית אֱלֹהָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/001/007.yaml
  text: And King Cyrus brought out the vessels of the house of Yahweh[b][a], which Nebuchadnezzar had brought out from Jerusalem and had put in the house of his god.
translation:
  language: tl
  text: At inilabas ni Haring Ciro ang mga kagamitan ng bahay ni Yahweh[a], na inilabas ni Nebucadnezar mula sa Jerusalem at inilagay niya sa bahay ng kaniyang diyos.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “templo ni Yahweh.”
    reason: lexical_alternative
  - marker: b
    text: O “kinuha mula sa Jerusalem at inilagay sa bahay ng kaniyang diyos.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמֶּלֶךְ כּוֹרֶשׁ
  choice: Haring Ciro
  rationale: Karaniwang ayos sa modernong Tagalog ang titulong “Hari” bago ang pangalan; ginamit ang nakaugaliang anyong Filipino na “Ciro.”
- source_word: הוֹצִיא
  choice: inilabas
  rationale: Tuwirang ipinapahayag ng Hiphil ng יצא ang pagpapalabas o paglalabas. Inulit ang parehong salin para mapanatili ang ugnayang pandiwa sa ginawa nina Ciro at Nebucadnezar.
- source_word: כְּלֵי
  choice: mga kagamitan
  rationale: Sa konteksto ng templo, saklaw nito ang iba’t ibang sagradong kasangkapan o sisidlan nang hindi labis na tinutukoy ang eksaktong anyo ng mga ito.
- source_word: בֵית יְהוָה
  choice: bahay ni Yahweh
  rationale: Pinananatili ang literal na talinghagang “bahay” at ang personal na pangalan ng Diyos; maaaring unawain sa konteksto bilang templo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ang Tetragrammaton bilang personal na pangalan sa halip na palitan ito ng isang titulo.
- source_word: אֲשֶׁר
  choice: na
  rationale: Natural na pang-ugnay sa Tagalog para sa sugnay na tumutukoy sa mga kagamitan.
- source_word: הוֹצִיא ... מִירוּשָׁלִַם
  choice: inilabas ... mula sa Jerusalem
  rationale: Pinananatili ang pag-uulit ng הוֹצִיא at malinaw na ipinahahayag ang pinagmulan.
- source_word: וַיִּתְּנֵם
  choice: inilagay
  rationale: Bagaman pangunahing kahulugan ng נתן ang “ibinigay,” ang pariralang lokatibo na kasunod nito ay nagpapahiwatig ng paglalagay o pagdeposito.
- source_word: בְּבֵית אֱלֹהָיו
  choice: sa bahay ng kaniyang diyos
  rationale: Pinananatili ang isahan at ang leksikal na pagkakatulad sa “bahay ni Yahweh,” pati ang hayag na pagkakaiba ng Diyos ng Israel at ng diyos ni Nebucadnezar.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Personal na pangalan ang nasa tekstong Hebreo, kaya pinanatili ito bilang “Yahweh” sa halip na palitan ng titulo.
- issue: Bilang ng diyos na tinutukoy sa אֱלֹהָיו
  choice: kaniyang diyos
  alternative: kaniyang mga diyos
  rationale: Isahan ang kahulugan ng anyong Hebreo sa kontekstong ito, kaya hindi ito pinalawak tungo sa panteon ng Babilonia.
- issue: Pagpapakahulugan sa בֵית bilang gusaling panrelihiyon
  choice: bahay
  alternative: templo
  rationale: Ang “bahay” ang mas pormal na katumbas at pinananatili ang pagkakapantay ng dalawang parirala; nililinaw sa talababa na “templo” ang posibleng kontekstuwal na salin.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang pag-uulit ng “inilabas” at ang magkatapat na “bahay ni Yahweh” at “bahay ng kaniyang diyos.”
