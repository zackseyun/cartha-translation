translation_notes:
  register: Makabagong Filipino na marangal at madaling maunawaan. Isinalin sa natural na paraan ang idyomang Hebreo sa pangunahing teksto, habang pinanatili sa talababa ang literal na larawan. Ang talaan ng mga ipinagkaloob ay malinaw at ritmo ng pangungusap ay angkop sa pampublikong pagbasa.
