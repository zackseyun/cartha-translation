- from: At ang lahat ng nakapaligid sa kanila ay tumulong sa kanila[a] sa pamamagitan ng mga kagamitang pilak, ginto, mga ari-arian, mga alagang hayop, at mahahalagang bagay[b], bukod pa sa lahat ng kusang-loob na handog.
  to: At lahat ng nasa paligid nila ay tumulong sa kanila[a] sa mga kagamitang yari sa pilak, ginto, mga pag-aari, mga alagang hayop, at mahahalagang bagay[b], bukod pa sa lahat ng kusang inihandog.
