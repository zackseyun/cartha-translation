  naturalness: Nauunawaan ang draft, ngunit mas natural ang “lahat ng nasa paligid nila” kaysa “ang lahat ng nakapaligid sa kanila,” na maaaring magtunog na tumutukoy sa mga bagay na nakapaligid. Mas malinaw rin ang “mga kagamitang yari sa pilak.”
  terminology: Napananatili ang angkop na malawak na kahulugan ng mga kagamitang pilak, ginto, mga pag-aari, alagang hayop, at mahahalagang bagay. Ang “kusang inihandog” ay hindi nagpapataw ng partikular na teknikal o sektaryang pakahulugan sa הִתְנַדֵּב.
