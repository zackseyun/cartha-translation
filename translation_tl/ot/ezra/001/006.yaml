base_translation:
  language: en
  yaml_path: translation/ot/ezra/001/006.yaml
  text: And all those around them strengthened their hands with vessels of silver[a], with gold, with goods, with livestock, and with precious things[b], besides all that was freely offered.
translation:
  language: tl
  text: At lahat ng nasa paligid nila ay tumulong sa kanila[a] sa mga kagamitang yari sa pilak, ginto, mga pag-aari, mga alagang hayop, at mahahalagang bagay[b], bukod pa sa lahat ng kusang inihandog.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “pinalakas ang kanilang mga kamay,” isang idyomang nangangahulugang sinuportahan o tinulungan sila.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “mga piling regalo”; maaari ring tumukoy sa mga masasarap na pagkain.
    reason: lexical_alternative
lexical_decisions:
- source_word: סְבִיבֹתֵיהֶם
  choice: lahat ng nakapaligid sa kanila
  rationale: Tumutukoy ito sa mga taong nasa paligid nila nang hindi nililimitahan ang kahulugan sa pormal na mga kapitbahay.
- source_word: חִזְּקוּ בִידֵיהֶם
  choice: tumulong sa kanila
  rationale: Ang literal na idyomang Hebreo ay “pinalakas ang kanilang mga kamay,” na sa kontekstong ito ay nangangahulugang nagbigay ng praktikal at materyal na tulong.
- source_word: בִּכְלֵי כֶסֶף
  choice: sa pamamagitan ng mga kagamitang pilak
  rationale: Malawak ang saklaw ng כְּלִי—sisidlan, kagamitan, o bagay. Ang “mga kagamitang pilak” ay natural at hindi labis na nagpapakitid sa uri ng mga ipinagkaloob.
- source_word: בַּזָּהָב
  choice: ginto
  rationale: Ipinagpapatuloy ng pang-ukol ang talaan ng mga ambag; hindi kailangang ulitin sa Filipino ang “mga kagamitan” bago ang ginto.
- source_word: בָּרְכוּשׁ
  choice: mga ari-arian
  rationale: Ang רְכוּשׁ ay tumutukoy sa pag-aari o mga gamit na may halaga. Sa konteksto, ang “mga ari-arian” ay sapat na malawak at hindi kinakailangang tumukoy sa lupa.
- source_word: וּבַבְּהֵמָה
  choice: mga alagang hayop
  rationale: Kolektibong tumutukoy ang בְּהֵמָה sa mga domestikadong hayop na bahagi ng kabuhayan at pag-aari.
- source_word: וּבַמִּגְדָּנוֹת
  choice: mahahalagang bagay
  rationale: Maaaring tumukoy ang מִגְדָּנוֹת sa mahahalaga o piling bagay, regalo, at kung minsan ay masasarap na pagkain. Pinananatili ng salin ang malawak na kahulugan.
- source_word: לְבַד
  choice: bukod pa sa
  rationale: Ipinahihiwatig nito na ang kasunod ay karagdagan sa mga bagay na nauna nang itinala.
- source_word: עַל כָּל הִתְנַדֵּב
  choice: lahat ng kusang-loob na handog
  rationale: Ang anyo ng נדב ay nagpapahayag ng boluntaryong pagbibigay. Ang pariralang Hebreo ay siksik, kaya inilalarawan ito bilang mga handog nang hindi nagdaragdag ng tahasang tagapagbigay.
