language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/כָל הַ/נִּשְׁאָ֗ר מִֽ/כָּל הַ/מְּקֹמוֹת֮ אֲשֶׁ֣ר ה֣וּא גָֽר שָׁם֒ יְנַשְּׂא֨וּ/הוּ֙ אַנְשֵׁ֣י מְקֹמ֔/וֹ בְּ/כֶ֥סֶף וּ/בְ/זָהָ֖ב וּ/בִ/רְכ֣וּשׁ וּ/בִ/בְהֵמָ֑ה עִם הַ֨/נְּדָבָ֔ה לְ/בֵ֥ית הָ/אֱלֹהִ֖ים אֲשֶׁ֥ר בִּ/ירוּשָׁלִָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/001/004.yaml
  text: And everyone who remains[a], in any place where he is living, let the men of his place support him with silver and gold, with goods and with livestock[c][b], together with the freewill offering for the house of God that is in Jerusalem.
translation:
  language: tl
  text: At ang bawat isa na naiwan, saanman siya naninirahan[a], ay tulungan[c] ng mga lalaki sa kanyang lugar[b] sa pamamagitan ng pilak at ginto, mga ari-arian, at mga alagang hayop, kasama ng kusang-loob na handog para sa bahay ng Diyos na nasa Jerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “saanman siya nakikipamayan” o “saanman siya pansamantalang naninirahan.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebrew, “mga lalaki sa kanyang lugar”; maaari ring mas malawak na tumukoy sa mga tagaroon o mga kapitbahay niya.
    reason: lexical_alternative
  - marker: c
    text: O “alalayan”; literal na “buhatin/dalhin” ang pandiwang Hebrew, ngunit dito ay tumutukoy sa pagbibigay ng praktikal na tulong.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנִּשְׁאָר
  choice: bawat nalalabi
  rationale: Ang Niphal participle ng שׁאר ay tumutukoy sa taong nananatili o naiiwan; pinananatili ng “nalalabi” ang diwang ito sa konteksto ng mga hindi agad sasama sa pagbabalik.
- source_word: מִכָּל הַמְּקֹמוֹת אֲשֶׁר הוּא גָר שָׁם
  choice: saanman siya naninirahan
  rationale: Likas sa modernong Tagalog at ipinahahayag ang alinmang lugar na tinitirhan niya; maaaring mangahulugan ang גָר ng paninirahan o pansamantalang pakikipamayan.
- source_word: יְנַשְּׂאֻהוּ
  choice: ay tulungan
  rationale: Bagaman literal na “buhatin/dalhin,” sa talaan ng pilak, ginto, ari-arian, at hayop ay tumutukoy ito sa praktikal at materyal na pagtulong.
- source_word: אַנְשֵׁי מְקֹמוֹ
  choice: mga lalaki sa lugar niya
  rationale: Pinananatili ang tahasang panlalaking anyo ng Hebrew, habang nililinaw sa talababa na maaaring mas malawak ang saklaw ng tinutukoy.
- source_word: בְּכֶסֶף וּבְזָהָב
  choice: sa pamamagitan ng pilak at ginto
  rationale: Tapat sa karaniwang katawagan sa mahahalagang metal at hindi nililimitahan ang pilak sa salapi lamang.
- source_word: וּבִרְכוּשׁ
  choice: mga ari-arian
  rationale: Ang רְכוּשׁ ay mga pag-aari o naililipat na kagamitan; malinaw at natural ang “mga ari-arian.”
- source_word: וּבִבְהֵמָה
  choice: mga alagang hayop
  rationale: Kolektibong tumutukoy ang בְהֵמָה sa domestikadong mga hayop na maaaring ari-arian o gamitin sa paglalakbay.
- source_word: עִם הַנְּדָבָה
  choice: kasama ng kusang-loob na handog
  rationale: Ipinahahayag ng נְדָבָה ang kusang ibinigay na handog nang hindi ipinapalagay na sapilitan ito.
- source_word: לְבֵית הָאֱלֹהִים
  choice: para sa bahay ng Diyos
  rationale: Pinananatili ang literal na larawang “bahay ng Diyos” sa halip na gawing “templo,” bagaman iyon ang tinutukoy sa konteksto.
- source_word: אֲשֶׁר בִּירוּשָׁלָם
  choice: na nasa Jerusalem
  rationale: Payak at natural na sugnay na tumutukoy sa kinaroroonan ng bahay ng Diyos.
theological_decisions:
- issue: Kasariang ipinahahayag ng אַנְשֵׁי מְקֹמוֹ
  choice: mga lalaki sa lugar niya
  alternative: mga tao sa lugar niya; mga kapitbahay niya
  rationale: Tahasan ang panlalaking pangngalan sa Hebrew. Pinanatili ito sa teksto, ngunit hindi ipinagkakait ang posibilidad na ang panlipunang tinutukoy ay mas malawak na mga tagaroon.
- issue: Kahulugan ng יְנַשְּׂאֻהוּ sa konteksto
  choice: tulungan
  alternative: alalayan; buhatin; tustusan
  rationale: Ang literal na “buhatin” ay maaaring magbigay ng maling larawan. Dahil inilalarawan agad ang materyal na ibibigay, ang “tulungan” ang malinaw na kontekstuwal na kahulugan nang hindi labis na nililimitahan ito sa pananalaping pagtustos.
- issue: Ugnayan ng kusang-loob na handog sa materyal na tulong
  choice: kasama ng kusang-loob na handog
  alternative: bukod pa sa kusang-loob na handog
  rationale: Ang עִם ay karaniwang “kasama ng.” Hindi tahasang nilulutas ng teksto kung ang handog ay dagdag na hiwalay na ambag o bahagi ng kabuuang ipinagkakaloob.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “bahay ng Diyos” upang mapanatili ang Hebreong larawan, at ang “kusang-loob na handog” bilang malinaw na katawagang panrelihiyon. Inayos ang mga talababa ayon sa pagkakasunod ng mga pananda sa pangunahing teksto.
