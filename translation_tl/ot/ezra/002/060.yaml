  text: ang mga anak ni Delaias, ang mga anak ni Tobias, at ang mga anak ni Nekoda—652 lahat.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: ang mga anak ni
  rationale: Sa talaangkanan at listahang ito, tumutukoy ang parirala sa mga kabilang sa angkan o sambahayan ng taong pinangalanan. Pinananatili ng “mga anak ni” ang anyo ng Hebreo at likas ito sa marangal na wikang biblikal sa Filipino.
- source_word: דְלָיָה
  choice: Delaias
  rationale: Isinalin sa baybay na madaling bigkasin sa Filipino habang pinananatili ang pagkakakilanlan ng pangalang Hebreo.
- source_word: טוֹבִיָּה
  choice: Tobias
  rationale: Ginamit ang pamilyar at likas na anyo ng pangalan sa Filipino.
- source_word: נְקוֹדָא
  choice: Nekoda
  rationale: Tuwirang transliterasyon na malapit sa anyong Hebreo at madaling basahin sa Filipino.
- source_word: שֵׁשׁ מֵאוֹת חֲמִשִּׁים וּשְׁנָיִם
  choice: 652 lahat
  rationale: Tumpak na inilalahad ang bilang; nililinaw ng “lahat” na ito ang kabuuang bilang ng tatlong grupong nakalista.
