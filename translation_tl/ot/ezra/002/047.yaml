  yaml_path: translation/ot/ezra/002/047.yaml
  text: the sons of Giddel[a], the sons of Gahar, the sons of Reaiah.
translation:
  language: tl
  text: ang mga anak ni Gidel, ang mga anak ni Gahar, at ang mga anak ni Reaya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring baybayin na “Raaya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: ang mga anak ni
  rationale: Ang anyong construct plural ng בֵּן ay literal na tumutukoy sa “mga anak ni” at karaniwang ginagamit sa mga talaan ng angkan; maaari rin nitong saklawin ang mga inapo o kaangkan.
- source_word: גִדֵּל
  choice: Gidel
  rationale: Pangalang pantangi; tinumbasan ayon sa bigkas ng Hebreo at sa likas na baybay sa modernong Filipino.
- source_word: גַחַר
  choice: Gahar
  rationale: Pangalang pantangi; pinanatili sa transliterasyong madaling basahin sa Filipino.
- source_word: רְאָיָה
  choice: Reaya
  rationale: Pangalang pantangi; ang baybay na “Reaya” ay kumakatawan sa mga patinig at katinig ng anyong Hebreo. Ang “Raaya” ay maaari ring maging transliterasyon.
theological_decisions: []
translation_notes:
  register: Ginamit ang payak ngunit marangal na anyo ng talaang pangangkan. Ang paulit-ulit na “ang mga anak ni” ay pinanatili upang masundan ang estruktura ng Hebreo; idinagdag ang “at” bago ang huling pangkat bilang likas na pang-ugnay sa Filipino. Ang mga pangalan ay binaybay ayon sa tunog ng Hebreo, hindi ayon sa kumbensiyong Ingles.
