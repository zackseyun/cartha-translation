base_translation:
  language: en
  yaml_path: translation/ot/ezra/002/002.yaml
  text: 'who came with Zerubbabel: Jeshua[a], Nehemiah, Seraiah, Reelaiah, Mordecai, Bilshan, Mispar, Bigvai, Rehum, and Baanah[d][c][b]. The number of the men of the people of Israel:'
translation:
  language: tl
  text: 'na dumating kasama ni Zerubabel: sina Jeshua, Nehemias, Seraias, Reelaia[a], Mardokeo, Bilsan, Mispar[b], Bigvai, Rehum[c], at Baana. Ang bilang ng mga lalaki ng sambayanan ng Israel ay:[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa katumbas na talaan sa Nehemias 7:7, ang “Reelaia” ay lumilitaw bilang “Raamia.”
    reason: alternative_reading
  - marker: b
    text: Sa katumbas na talaan sa Nehemias 7:7, ang “Mispar” ay lumilitaw bilang “Misperet.”
    reason: alternative_reading
  - marker: c
    text: Sa katumbas na talaan sa Nehemias 7:7, ang “Rehum” ay lumilitaw bilang “Nehum.”
    reason: alternative_reading
  - marker: d
    text: Ipinakikilala ng pariralang ito ang pagbilang na nagsisimula sa kasunod na talata.
    reason: cross_reference
lexical_decisions:
- source_word: אֲשֶׁר בָּאוּ
  choice: na dumating
  rationale: Ipinagpapatuloy ng panghalip na pamanggit ang talaan mula sa naunang talata. Ang בוא ay payak na “dumating”; hindi ito isinaling “bumalik” upang hindi idagdag sa mismong pandiwa ang konteksto ng pagbabalik mula sa pagkakatapon.
- source_word: עִם
  choice: kasama ni
  rationale: Likas na pahayag sa Filipino para sa pagsama sa isang taong pinangalanan.
- source_word: זְרֻבָּבֶל
  choice: Zerubabel
  rationale: Karaniwang anyo ng pangalang ito sa modernong Filipino.
- source_word: יֵשׁוּעַ
  choice: Jeshua
  rationale: Tuwirang kumakatawan sa postexilic na Hebreong anyo ng pangalan at naihihiwalay ito sa karaniwang anyong “Josue.”
- source_word: נְחֶמְיָה
  choice: Nehemias
  rationale: Karaniwan at madaling makilalang anyo ng pangalan sa Filipino.
- source_word: שְׂרָיָה
  choice: Seraias
  rationale: Sinusunod ang pangalan sa Masoretic Text; hindi ipinalit ang ibang anyong nasa ilang kaagapay na tradisyon.
- source_word: רְעֵלָיָה
  choice: Reelaia
  rationale: Malapit na transliterasyon ng anyo sa WLC; ang naiibang anyo sa Nehemias 7:7 ay inilagay sa talababa.
- source_word: מָרְדֳּכַי
  choice: Mordecai
  rationale: Karaniwan at nakikilalang transliterasyon sa modernong Filipino.
- source_word: בִּלְשָׁן
  choice: Bilshan
  rationale: Tuwirang transliterasyon ng pangalang pantangi.
- source_word: מִסְפָּר
  choice: Mispar
  rationale: Pangalang pantangi ito rito, hindi ang karaniwang pangngalang “bilang”; ang naiibang anyo sa Nehemias 7:7 ay itinala sa talababa.
- source_word: בִּגְוַי
  choice: Bigvai
  rationale: Tuwirang transliterasyon ng pangalang pantangi.
- source_word: רְחוּם
  choice: Rehum
  rationale: Sinusunod ang anyo ng pangalan sa WLC; ang anyong “Nehum” sa kaagapay na talaan ay inilagay sa talababa.
- source_word: בַּעֲנָה
  choice: Baana
  rationale: Tuwirang transliterasyon na inangkop sa karaniwang baybay sa Filipino.
- source_word: מִסְפַּר אַנְשֵׁי עַם יִשְׂרָאֵל
  choice: 'Ang bilang ng mga lalaki ng sambayanan ng Israel ay:'
  rationale: Pinananatili ang kahulugan ng parirala at ang tungkulin nito bilang pambungad sa mga bilang na kasunod, habang gumagamit ng natural na ayos sa Filipino.
