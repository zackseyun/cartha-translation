lexical_decisions:
- source_word: כָּל הַקָּהָל
  choice: ang buong kapulungan
  rationale: Ipinahahayag ng כָּל kasama ng tiyak na pangngalan ang kabuuan ng nagkatipong pamayanan. Ang “kapulungan” ay natural at marangal na salin ng קָהָל nang hindi nagdadala ng di-kinakailangang eklesiastikong kahulugan.
- source_word: כְּאֶחָד
  choice: na magkakasama
  rationale: Literal itong “bilang isa,” ngunit sa konteksto ay inilalahad ang pinagsamang bilang ng buong pangkat. Pinananatili ng “na magkakasama” ang kolektibong diwa sa natural na Tagalog; nasa talababa ang mas literal na anyo.
- source_word: אַרְבַּע רִבּוֹא אַלְפַּיִם שְׁלֹשׁ מֵאוֹת שִׁשִּׁים
  choice: apatnapu't dalawang libo tatlong daan at animnapu
  rationale: 'Tuwirang binubuo ng Hebreong mga bilang ang kabuuang 42,360: apat na sampung libo, dalawang libo, tatlong daan, at animnapu.'
