lexical_decisions:
- source_word: בְּנֵי
  choice: ang mga anak ng
  rationale: Sa talaang pangangkanan at sensus, tumutukoy ang construct plural ng בֵּן sa mga kabilang sa isang angkan. Pinananatili ng “mga anak ng” ang pormal na anyo ng Hebreo at ang estilo ng listahan.
- source_word: עֵילָם
  choice: Elam
  rationale: Pangngalang pantangi ito, kaya tinumbasan sa pamamagitan ng transliterasyong angkop sa modernong Filipino.
- source_word: אַחֵר
  choice: isa pang
  rationale: Ipinakikita ng אַחֵר na ang pangkat na ito ng Elam ay bukod sa naunang Elam na binanggit sa kabanata. Natural sa Filipino ang “isa pang” habang pinananatili ang posibleng ugnayan ng salita sa pangalan o sa pangkat.
- source_word: אֶלֶף מָאתַיִם חֲמִשִּׁים וְאַרְבָּעָה
  choice: 1,254
  rationale: Ang kabuuan ng bilang sa Hebreo ay 1,254. Ginamit ang mga digit upang madaling mabasa sa isang talaang pansensus.
