base_translation:
  language: en
  yaml_path: translation/ot/ezra/002/040.yaml
  text: 'The Levites: the sons of Jeshua and Kadmiel[a], of the sons of Hodaviah, seventy-four.'
translation:
  language: tl
  text: 'Ang mga Levita: ang mga anak nina Jeshua at Kadmiel, na kabilang sa mga anak ni Hodaviah[a]—pitumpu’t apat.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo ay “Hodaviah”; sa katulad na tala sa Nehemias 7:43 ay “Hodevah.”
    reason: textual_variant
lexical_decisions:
- source_word: הַלְוִיִּם
  choice: Ang mga Levita
  rationale: Ang tiyak na pantukoy at katawagang pangkat ay nagpapakilala sa susunod na pangkat sa talaan; likas at malinaw sa Filipino ang “Ang mga Levita.”
- source_word: בְּנֵי
  choice: ang mga anak ni
  rationale: Sa talaangkanan at senso, maaari itong tumukoy sa mga anak o mga kaanib ng angkan. Pinananatili ng “mga anak ni” ang pormal at malinaw na anyo ng Hebreo.
- source_word: יֵשׁוּעַ
  choice: Jeshua
  rationale: Isinalin sa baybay na “Jeshua” bilang pangalan ng tao sa panahong pagkatapos ng pagpapatapon, upang maiba sa karaniwang anyong “Josue.”
- source_word: וְקַדְמִיאֵל
  choice: at ni Kadmiel
  rationale: Payak na pang-ugnay at pangalan; idinagdag ang “ni” ayon sa likas na balarilang Filipino.
- source_word: לִבְנֵי
  choice: mula sa mga anak ni
  rationale: Ang prefiks na ל ay nauunawaan dito bilang ugnayang pangangkan o pang-uri. Ipinahahayag ng “mula sa” na kabilang sina Jeshua at Kadmiel sa angkan na kasunod nang hindi labis na nilulutas ang eksaktong estruktura ng talaan.
- source_word: הוֹדַוְיָה
  choice: Hodaviah
  rationale: Ito ang anyo ng pangalan sa tekstong Masoretiko ng Ezra 2:40; ang naiibang anyo sa Nehemias 7:43 ay inilagay sa talababa.
- source_word: שִׁבְעִים וְאַרְבָּעָה
  choice: pitumpu't apat
  rationale: Ito ang likas na makabagong Filipino para sa bilang na 74.
