translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang anyong talaan at ang pormal na katawagang “mga anak ni,” habang ginawang likas ang ugnayang pangangkan sa pamamagitan ng “mula sa.”
