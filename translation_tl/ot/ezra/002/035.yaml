  text: 'Ang mga anak ni Senaah: tatlong libo anim na raan at tatlumpu.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: ang mga anak ni
  rationale: Ang anyong maramihan na construct ng בֵּן ay literal na “mga anak ni” at tumutukoy rito sa pangkat ng angkan sa talaan. Pinananatili nito ang maikli at pormal na estilo ng sensus habang natural sa Filipino.
- source_word: סְנָאָה
  choice: Senaa
  rationale: Pangngalang pantangi ito kaya tinumbasan sa pamamagitan ng transliterasyon. Ang “Senaa” ay malinaw na kumakatawan sa mga katinig at patinig ng anyong Hebreo sa makabagong baybay-Filipino.
- source_word: שְׁלֹשֶׁת אֲלָפִים
  choice: tatlong libo
  rationale: Tuwirang katumbas ito ng bilang na “tatlong libo.”
- source_word: וְשֵׁשׁ מֵאוֹת
  choice: anim na raan
  rationale: Isinalin ang pinagsamang bilang ayon sa likas na ayos ng pagbilang sa Filipino; hindi na kailangang ulitin ang pangatnig sa pagitan ng libo at daan.
- source_word: וּשְׁלֹשִׁים
  choice: at tatlumpu
  rationale: Pinananatili ng “at” ang panghuling pagdaragdag sa bilang at natural itong pakinggan sa Filipino.
