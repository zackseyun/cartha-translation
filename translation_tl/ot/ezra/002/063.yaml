revisions:
- from: At sinabi sa kanila ng gobernador[a] na huwag silang kumain mula sa mga pinakabanal na handog[b] hanggang sa magkaroon ng isang pari na makapagsasangguni sa pamamagitan ng Urim at Tumim.[c]
  to: At sinabi sa kanila ng gobernador[a] na huwag silang kumain ng mga pinakabanal na handog[b] hanggang sa lumitaw ang isang pari na may Urim at Tumim.[c]
  rationale: Pinalitan ang “hanggang sa magkaroon ng isang pari na makapagsasangguni sa pamamagitan ng” ng “hanggang sa lumitaw ang isang pari na may” upang maipakita ang hinaharap na paglitaw ng pari sa Hebreo at mapanatili ang teknikal at hindi ganap na tiyak na ugnayan ng pari sa Urim at Tumim. Hindi binago ang kahulugan ng pagbabawal o ang paglilinaw tungkol sa mga pinakabanal na handog.
