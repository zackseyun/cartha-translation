  naturalness: Malinaw at marangal ang Filipino. Mas natural at mas malapit sa pinagmulan ang “hanggang sa lumitaw ang isang pari na may Urim at Tumim” kaysa “hanggang sa magkaroon ng isang pari na makapagsasangguni.”
  terminology: Ang “gobernador,” “mga pinakabanal na handog,” at “Urim at Tumim” ay angkop. Nananatiling malinaw sa talababa na ang mga handog, hindi ang Kabanal-banalang Dako, ang tinutukoy.
