base_translation:
  language: en
  yaml_path: translation/ot/ezra/002/063.yaml
  text: And the governor said to them that they should not eat from the most holy things until a priest should arise with Urim and Thummim[a][b][c].
translation:
  language: tl
  text: At sinabi sa kanila ng gobernador[a] na huwag silang kumain ng mga pinakabanal na handog[b] hanggang sa lumitaw ang isang pari na may Urim at Tumim.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Tirshata,” isang titulong administratibong Persiano.
    reason: lexical_alternative
  - marker: b
    text: Ibig sabihin, ang mga bahagi ng mga handog na itinuturing na pinakabanal at nakalaan sa mga pari; hindi ang Kabanal-banalang Dako sa loob ng santuwaryo.
    reason: cultural_note
  - marker: c
    text: Ang Urim at Tumim ay mga sagradong kasangkapan sa pagsangguni ng pari; hindi tiyak ang eksaktong anyo at paraan ng paggamit sa mga ito.
    reason: cultural_note
lexical_decisions:
- source_word: הַתִּרְשָׁתָא
  choice: gobernador
  rationale: Isinasalin ang titulong administratibong Persiano sa karaniwang salitang Filipino; inilalagay sa talababa ang transliterasyong “Tirshata.”
- source_word: אֲשֶׁר לֹא יֹאכְלוּ
  choice: na huwag silang kumain
  rationale: Likas na ipinapahayag sa Filipino ang nilalaman ng di-tuwirang utos nang hindi dinaragdagan ang tindi nito.
- source_word: מִקֹּדֶשׁ הַקֳּדָשִׁים
  choice: mula sa mga pinakabanal na handog
  rationale: Sa konteksto, ang tinutukoy ay nakakain na mga bahaging banal na nauukol sa mga pari, hindi ang lugar na Kabanal-banalang Dako. Ang “pinakabanal” ay nagpapanatili sa Hebreong superlatibo.
- source_word: עַד עֲמֹד כֹּהֵן
  choice: hanggang sa magkaroon ng isang pari
  rationale: Ipinahihiwatig ng parirala ang isang hinaharap na kalagayan kung kailan maaaring alisin ang pagbabawal; natural sa Filipino ang “magkaroon” sa ganitong konteksto.
- source_word: לְאוּרִים וּלְתֻמִּים
  choice: na makapagsasangguni sa pamamagitan ng Urim at Tumim
  rationale: 'Pinananatili ang mga teknikal na pangalan habang nililinaw ang gamit ng pang-ukol: isang paring makapagsasangguni sa pamamagitan ng mga ito. Hindi tinutukoy nang higit sa ebidensiya ang eksaktong anyo o pamamaraan.'
theological_decisions:
- issue: Kahulugan ng קֹדֶשׁ הַקֳּדָשִׁים sa kontekstong ito
  choice: Mga pinakabanal na handog o bahaging pagkain ng mga pari
  alternative: Ang Kabanal-banalang Dako bilang isang lugar
  rationale: Ang usapin ay ang karapatan ng mga taong may pinagtatalunang talaangkanan na kumain ng pagkaing nakalaan sa mga pari. Dahil pagkain ang ipinagbabawal, hindi pagpasok sa santuwaryo ang tinutukoy.
- issue: Pagbibigay-kahulugan sa Urim at Tumim
  choice: Panatilihin bilang mga transliteradong teknikal na katawagan at ilarawan lamang bilang paraan ng pagsangguni
  alternative: Isalin nang interpretatibo bilang “mga liwanag at mga kasakdalan”
  rationale: Hindi tiyak ang kanilang eksaktong anyo at pamamaraan. Iniiwasan ng transliterasyon ang pag-aangkin ng katiyakang wala sa teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “gobernador” bilang madaling maunawaang katumbas ng titulong Persiano. Ang “makapagsasangguni sa pamamagitan ng” ay mas natural at malinaw kaysa sa literal na “may Urim at Tumim,” ngunit hindi nilulutas ang kawalang-katiyakan tungkol sa eksaktong pamamaraan.
