  text: the sons of Shephatiah[a], the sons of Hattil, the sons of Pokereth-hazzebaim, the sons of Ami.
translation:
  language: tl
  text: ang mga anak ni Sefatias, ang mga anak ni Hatil, ang mga anak ni Pokeret-hazebaim[a], at ang mga anak ni Ami.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Pokeret ng Zebaim”; maaaring basahin ang Hebreo bilang tambalang pangalan ng angkan o bilang isang pangalan na sinusundan ng panuring.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: ang mga anak ni
  rationale: Sa talaang pangangkan o pangangkaning ito, ipinakikilala ng בְּנֵי ang mga pangkat ng pamilya o angkan. Pinananatili ng “mga anak ni” ang pormal na ayos ng Hebreo at karaniwan itong nauunawaan sa ganitong konteksto bilang mga inapo o kasapi ng angkan.
- source_word: שְׁפַטְיָה
  choice: Sefatias
  rationale: Pangalan ng tao o angkan; ginamit ang anyong madaling basahin at nakasanayan sa Filipino habang kinakatawan ang pangalang Hebreo.
- source_word: חַטִּיל
  choice: Hatil
  rationale: Pangalan ng tao o angkan; isinalin sa baybay na angkop sa Filipino.
- source_word: פֹּכֶרֶת הַצְּבָיִים
  choice: Pokeret-hazebaim
  rationale: Maaaring gumaganap bilang tambalang pangalang pantangi. Pinananatili ng gitling ang malapit na ugnayan ng dalawang sangkap nang hindi tiyakang ipinapakahulugang ang ikalawa ay hiwalay na panuring.
- source_word: אָמִי
  choice: Ami
  rationale: Pangalan ng tao o angkan; tinumbasan sa tuwirang transliterasyon na natural basahin sa Filipino.
