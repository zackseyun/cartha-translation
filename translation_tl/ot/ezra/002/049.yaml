  text: the sons of Uzza[a], the sons of Paseah, the sons of Besai.
translation:
  language: tl
  text: ang mga anak ni Uza[a], ang mga anak ni Paseah, ang mga anak ni Besai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, ang “mga anak ni” ay maaari ring tumukoy sa mas malawak na angkan o sa mga inapo, hindi lamang sa tuwirang mga anak.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: ang mga anak ni
  rationale: Ang construct plural ng בֵּן ay inuulit sa talaan. Pinananatili ng “mga anak ni” ang maikli at pormal na hulma ng Hebreo, habang maaaring tumukoy sa mas malawak na angkan o mga inapo, hindi lamang sa tuwirang mga anak.
- source_word: עֻזָּא
  choice: Uza
  rationale: Isinalin sa baybay na likas basahin sa Filipino at malapit sa tunog ng pangalang Hebreo.
- source_word: פָסֵחַ
  choice: Paseah
  rationale: Tinumbasan bilang pangalang pantangi; pinananatili ng “Paseah” ang pagkakakilanlan ng pangalang Hebreo at ang nakasanayang anyo nito sa mga talaang biblikal.
- source_word: בֵסָי
  choice: Besai
  rationale: Tinumbasan bilang pangalang pantangi; ang hulaping -ai ay angkop na representasyon ng pangwakas na yod sa pangalang Hebreo.
theological_decisions: []
translation_notes:
  register: Makabagong Filipino na maikli at marangal, na angkop sa anyo ng isang talaan. Iningatan ang tatlong-ulit na estruktura ng Hebreo at nilinaw sa talababa ang malawak na saklaw ng “mga anak ni.”
