lexical_decisions:
- source_word: בְּנֵי
  choice: ang mga anak ni
  rationale: Sa talaan ng mga angkan, ang בְּנֵי ay tuwirang tumutukoy sa mga kabilang sa linya o angkan ng isang ninuno. Pinananatili ng “mga anak ni” ang karaniwang pormang biblikal nang hindi nililimitahan ang diwa sa mga agarang anak lamang.
- source_word: זַכָּי
  choice: Zakkai
  rationale: Ang pangalan ay tinumbasan ayon sa transliterasyon ng Hebreo, kasama ang dobleng katinig na kaf.
- source_word: שְׁבַע מֵאוֹת וְשִׁשִּׁים
  choice: '760'
  rationale: Ang kabuuang bilang na “pitong daan at animnapu” ay malinaw at natural na inilalahad sa anyong numero sa isang maikling talaan.
