translation_notes:
  register: Maikli at pormal ang anyo upang mapanatili ang ritmo ng talaan. Pinili ang “mga inapo” bilang natural at tumpak na panumbas sa kontekstong pangangkan, habang inilagay sa talababa ang mas literal na “mga anak.”
