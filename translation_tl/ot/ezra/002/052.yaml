  text: the sons of Bazluth[a], the sons of Mehida, the sons of Harsha—
translation:
  language: tl
  text: ang mga inapo ni Bazlut[a], ang mga inapo ni Mehida, ang mga inapo ni Harsa—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa bawat paglitaw, maaari ring isaling “mga anak ni”; ang Hebreong pormula na בְּנֵי ay madalas tumukoy sa isang angkan, hindi lamang sa mga tuwirang anak.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: ang mga inapo ni
  rationale: Sa talaan ng mga bumalik, ang בְּנֵי ay pormulang tumutukoy sa mga kabilang sa isang angkan, hindi lamang sa mga tuwirang anak na lalaki. Likas at malinaw sa modernong Filipino ang “mga inapo ni.”
- source_word: בַצְלוּת
  choice: Bazlut
  rationale: Tinumbasan ang pangalang Hebreo sa baybay na madaling basahin sa Filipino; ang huling taw ay kinakatawan ng “t.”
- source_word: מְחִידָא
  choice: Mehida
  rationale: Transliterasyon ng pangalang pantangi ayon sa bigkas na angkop sa Filipino; ang titik het ay pinagaan bilang “h.”
- source_word: חַרְשָׁא
  choice: Harsa
  rationale: Transliterasyon sa natural na baybay-Filipino; ginamit ang “s” para sa shin at hindi na kinatawan nang hiwalay ang huling aleph.
