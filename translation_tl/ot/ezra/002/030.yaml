lexical_decisions:
- source_word: בְּנֵי
  choice: ang mga anak ni
  rationale: Sa talaan ng mga bumalik, ipinakikilala ng בְּנֵי ang isang pangkat ng pamilya o angkan. Pinananatili ng “mga anak ni” ang anyo ng Hebreo at likas din itong nauunawaan sa Filipino bilang mga inapo o kasapi ng angkan.
- source_word: מַגְבִּישׁ
  choice: Magbis
  rationale: Isinalin sa baybay-Filipino ang pangalang Hebreo sa halip na bigyan ng kahulugan. Hindi tiyak kung tao o lugar ang tinutukoy, kaya pinanatili itong pangalan.
- source_word: מֵאָה חֲמִשִּׁים וְשִׁשָּׁה
  choice: isang daan at limampu't anim
  rationale: Tuwirang kabuuan ng mga bilang sa Hebreo ang 156. Ang pagsulat nito sa salita ay angkop sa marangal at madaling basahing talaan.
