lexical_decisions:
- source_word: בְּנֵי
  choice: ang mga anak ni
  rationale: Sa talaan ng mga bumalik, ipinakikilala ng בְּנֵי ang isang pangkat na nagmula sa iisang pamilya o angkan. Likas at malinaw sa Filipino ang “mga anak ni,” at maaari rin itong unawain sa mas malawak na diwang mga inapo.
- source_word: בֵצָי
  choice: Bezai
  rationale: Isinalin sa anyong transliterasyon ang pangalang pantangi, kasunod ng karaniwang baybay na ginagamit sa mga saling Filipino.
- source_word: שְׁלֹשׁ מֵאוֹת עֶשְׂרִים וּשְׁלֹשָׁה
  choice: tatlong daan at dalawampu't tatlo
  rationale: Tuwiran at likas na pagpapahayag sa modernong Filipino ng bilang na 323.
