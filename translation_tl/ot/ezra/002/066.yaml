  text: Their horses were seven hundred thirty-six; their mules, two hundred forty-five.
translation:
  language: tl
  text: Ang kanilang mga kabayo ay 736, at ang kanilang mga mula ay 245.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: סוּסֵיהֶם
  choice: kanilang mga kabayo
  rationale: Ang סוּס ay nangangahulugang “kabayo”; ang anyong maramihan na may hulaping panlalaking pangatlong panauhan ay likas na isinasaling “kanilang mga kabayo.”
- source_word: שְׁבַע מֵאוֹת שְׁלֹשִׁים וְשִׁשָּׁה
  choice: '736'
  rationale: Tuwirang ipinapahayag ng sunod-sunod na bilang sa Hebreo ang kabuuang 736; malinaw at madaling basahin ang paggamit ng mga digit sa talaan.
- source_word: פִּרְדֵיהֶם
  choice: kanilang mga mula
  rationale: Ang פֶּרֶד ay tiyak na tumutukoy sa “mula,” hindi lamang sa pangkalahatang hayop na tagapagdala ng karga.
- source_word: מָאתַיִם אַרְבָּעִים וַחֲמִשָּׁה
  choice: '245'
  rationale: Ibinibigay ng pariralang pamilang ang kabuuang 245; ang mga digit ay angkop sa konteksto ng talaan at madaling maunawaan.
