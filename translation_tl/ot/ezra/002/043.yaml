  register: Maikli at pormal ang rehistro upang mapanatili ang anyo ng talaan, ngunit gumagamit ng malinaw at kasalukuyang Filipino. Inulit ang “ang mga anak ni” upang maipakita ang estruktura ng tekstong Hebreo.
