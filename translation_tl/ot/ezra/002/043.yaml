base_translation:
  language: en
  yaml_path: translation/ot/ezra/002/043.yaml
  text: 'The temple servants: the sons of Ziha[a], the sons of Hasupha[c][b], the sons of Tabbaoth.'
translation:
  language: tl
  text: 'Ang mga lingkod sa templo[a]: ang mga anak ni Ziha, ang mga anak ni Hasufa, at ang mga anak ni Tabbaot.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “ang mga Netinim,” isang katawagang tradisyonal na tina-transliterate. Tumutukoy ito sa isang pangkat ng mga lingkod na nakatalaga sa paglilingkod sa santuwaryo.
    reason: lexical_alternative
  - marker: b
    text: Ang bawat “mga anak ni” ay maaari ring isaling “mga inapo ni”; sa ganitong talaangkanan, maaaring tumukoy ang pormulang Hebreo sa isang angkan at hindi lamang sa mga tuwirang anak.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנְּתִינִים
  choice: ang mga lingkod sa templo
  rationale: Tumutukoy ang katawagan sa isang kinikilalang pangkat na nakatalaga sa paglilingkod sa santuwaryo. Mas malinaw sa makabagong mambabasang Tagalog ang saling tumutukoy sa kanilang tungkulin kaysa sa di-pamilyar na transliterasyong “Netinim.”
- source_word: בְּנֵי
  choice: ang mga anak ni
  rationale: Pinananatili nito ang paulit-ulit na pormula ng talaangkanan sa Hebreo. Gayunman, sa ganitong listahan maaari itong tumukoy sa mga inapo o angkan, hindi lamang sa mga tuwirang anak; nililinaw ito sa talababa.
- source_word: צִיחָא
  choice: Ziha
  rationale: Transliterasyon ng pangalang pantangi sa paraang natural basahin sa Filipino.
- source_word: חֲשׂוּפָא
  choice: Hasufa
  rationale: Transliterasyon ng pangalang pantangi; ang שׂ ay kinakatawan ng “s,” at ang pangwakas na anyo ay ginawang madaling basahin sa Filipino.
- source_word: טַבָּעוֹת
  choice: Tabbaot
  rationale: Itinuturing itong pangalang pantangi sa konteksto ng listahan at tinutumbasan sa transliterasyong Filipino, sa halip na isalin na parang karaniwang pangngalan.
