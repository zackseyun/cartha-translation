base_translation:
  language: en
  yaml_path: translation/ot/ezra/002/055.yaml
  text: 'the sons of Solomon’s servants: the sons of Sotai[a], the sons of Hassophereth, the sons of Peruda.'
translation:
  language: tl
  text: 'Ang mga anak ng mga lingkod ni Solomon: ang mga anak ni Sotai, ang mga anak ni Hasoferet, at ang mga anak ni Peruda.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa katumbas na tala sa Nehemias 7:57, “Perida” ang pangalan.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּנֵי
  choice: ang mga anak ni/ng
  rationale: Pinananatili nito ang paulit-ulit na anyo at indayog ng talaangkanan sa Hebreo. Sa ganitong listahan, ang “mga anak” ay maaaring tumukoy sa mga inapo o kabilang sa angkan, hindi lamang sa tuwirang mga anak.
- source_word: עַבְדֵי
  choice: mga lingkod
  rationale: Maaaring mangahulugan ang עֶבֶד ng “alipin” o “lingkod,” ngunit dito ay bahagi ito ng kinikilalang katawagang administratibo na “mga lingkod ni Solomon.” Hindi binibigyang-diin ng konteksto ang kalagayang pagkaalipin.
- source_word: שְׁלֹמֹה
  choice: Solomon
  rationale: Ginamit ang nakasanayang anyo ng pangalang ito sa modernong Filipino.
- source_word: סֹטַי
  choice: Sotai
  rationale: Tuwirang transliterasyon ng pangalang Hebreo na iniangkop sa karaniwang baybay sa Filipino.
- source_word: הַסֹּפֶרֶת
  choice: Hasoferet
  rationale: Itinuring itong pangalan ng isang angkan at tinransliterasyon, kasama ang paunang pantukoy na nakadikit sa anyong Hebreo. Iniangkop sa malinaw na makabagong baybay sa Filipino.
- source_word: פְרוּדָא
  choice: Peruda
  rationale: Sinusunod ng pangunahing teksto ang pagbasa ng Hebreong teksto ng Ezra. Inilagay sa talababa ang naiibang anyo sa katumbas na tala sa Nehemias.
theological_decisions: []
translation_notes:
  register: Makabago, payak, at marangal na Filipino. Pinanatili ang paulit-ulit na hulma ng talaan sa Hebreo, habang idinagdag ang “at” bago ang huling pangalan para sa likas na daloy sa Filipino. Inilagay ang pananda ng talababa pagkatapos ng “Peruda,” ang salitang tinutukoy ng naiibang pagbasa.
