  text: וּ/מֵ/רָאשֵׁי֙ הָֽ/אָב֔וֹת בְּ/בוֹאָ֕/ם לְ/בֵ֥ית יְהוָ֖ה אֲשֶׁ֣ר בִּ/ירוּשָׁלִָ֑ם הִֽתְנַדְּבוּ֙ לְ/בֵ֣ית הָֽ/אֱלֹהִ֔ים לְ/הַעֲמִיד֖/וֹ עַל מְכוֹנֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/002/068.yaml
  text: And some of the heads of the fathers’ houses[a], when they came to the house of Yahweh that is in Jerusalem, gave freewill offerings for the house of God[c][b], to set it up on its foundation.
translation:
  language: tl
  text: Nang dumating sa bahay ni Yahweh sa Jerusalem ang ilan sa mga pinuno ng mga angkan[a], kusang-loob silang nagbigay para sa bahay ng Diyos[b], upang maitayo ito sa kinalalagyan nito[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, isang pariralang tumutukoy sa mga pinuno ng mga pangkat ng pamilyang nagmula sa iisang ninuno; maaari ring isaling “mga pinuno ng mga sambahayan ng mga ama.”
    reason: lexical_alternative
  - marker: b
    text: O “kusang-loob silang naghandog para sa bahay ng Diyos.” Binibigyang-diin ng pandiwa ang boluntaryong pagbibigay.
    reason: lexical_alternative
  - marker: c
    text: O “sa pundasyon nito” o “sa itinakdang lugar nito.” Maaaring tumukoy ang Hebreo sa pundasyon ng templo o sa tiyak na lugar na kinatatayuan nito.
    reason: alternative_reading
lexical_decisions:
- source_word: וּמֵרָאשֵׁי הָאָבוֹת
  choice: ang ilan sa mga pinuno ng mga angkan
  rationale: Ang מִן ay partitivo, kaya 'ilan sa.' Ang רָאשֵׁי הָאָבוֹת ay tumutukoy sa mga pinuno ng mga yunit ng pamilyang nagmula sa iisang ninuno; mas natural sa modernong Tagalog ang 'mga pinuno ng mga angkan' kaysa literal na 'mga pinuno ng mga sambahayan ng mga ama.'
- source_word: בְּבוֹאָם
  choice: Nang dumating
  rationale: 'Ang ב na sinusundan ng infinitive construct at hulaping panghalip ay may temporal na diwa: ''nang dumating sila.'''
- source_word: לְבֵית יְהוָה
  choice: sa bahay ni Yahweh
  rationale: Pinananatili ng 'bahay' ang literal at teolohikal na larawan ng בַּיִת, habang tahasang inililipat ang pangalang tipan na יהוה bilang Yahweh.
- source_word: הִתְנַדְּבוּ
  choice: kusang-loob silang nagbigay
  rationale: Ang Hitpael ng נדב ay nagbibigay-diin sa boluntaryo at bukal-sa-loob na pagbibigay; hindi kailangang idagdag sa pangunahing teksto ang isang teknikal na katawagan para sa handog.
- source_word: לְבֵית הָאֱלֹהִים
  choice: para sa bahay ng Diyos
  rationale: Ang ל ay nagpapahayag ng pinag-uukulan ng kusang pagbibigay, at pinananatili ng 'bahay ng Diyos' ang leksikal na pag-uugnay sa naunang 'bahay ni Yahweh.'
- source_word: לְהַעֲמִידוֹ
  choice: upang maitayo iyon
  rationale: Ang Hiphil ng עמד ay 'patayuin' o 'itayo/itatag.' Sa konteksto ng muling pagtatayo, natural ang 'maitayo' nang hindi labis na tinutukoy ang paraan ng pagpapanumbalik.
- source_word: עַל מְכוֹנוֹ
  choice: sa dating kinalalagyan nito
  rationale: Maaaring tumukoy ang מָכוֹן sa matatag na lugar, kinatatayuan, o pundasyon. Pinananatili ng 'dating kinalalagyan' ang pangunahing lokatibong diwa nang hindi ipinipilit na pundasyon lamang ang tinutukoy.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Ang tekstong Hebreo ay tahasang gumagamit ng Tetragrammaton. Ang 'Yahweh' ay nagpapanatili sa banal na pangalang pantangi sa halip na palitan ito ng isang titulo.
- issue: Paglalarawan sa estrukturang pampamilya na רָאשֵׁי הָאָבוֹת
  choice: mga pinuno ng mga angkan
  alternative: mga pinuno ng mga sambahayan ng mga ama
  rationale: Ang parirala ay tumutukoy sa mga kinikilalang pinuno ng mga pangkat na nakabatay sa ninuno. Ang saling 'angkan' ay malinaw sa karaniwang mambabasa at hindi nagdaragdag ng isang partikular na doktrinang panlipunan.
- issue: Saklaw ng מְכוֹנוֹ
  choice: dating kinalalagyan nito
  alternative: pundasyon nito
  rationale: Maaaring tumukoy ang salita sa pundasyon o sa itinakdang lugar. Pinananatili sa talababa ang tunay na leksikal na kalabuan sa halip na tahimik na lutasin ito.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang 'angkan' para sa sinaunang yunit ng pagkakamag-anak, 'bahay' upang mapanatili ang pag-uulit sa Hebreo, at 'kinalalagyan' upang hindi mawala ang kalabuan sa pagitan ng lugar at pundasyon.
