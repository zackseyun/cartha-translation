base_translation:
  language: en
  yaml_path: translation/ot/ezra/002/042.yaml
  text: 'The sons of the gatekeepers: the sons of Shallum, the sons of Ater, the sons of Talmon, the sons of Akkub, the sons of Hatita, the sons of Shobai, all together one hundred thirty-nine.'
translation:
  language: tl
  text: 'Ang mga anak ng mga bantay sa pintuan: ang mga anak ni Salum, ang mga anak ni Ater, ang mga anak ni Talmon, ang mga anak ni Akub, ang mga anak ni Hatita, at ang mga anak ni Sobai—isang daan at tatlumpu’t siyam lahat.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: ang mga anak ni/ng
  rationale: Pinananatili nito ang paulit-ulit na anyo ng tekstong Hebreo at ang wika ng talaangkanan. Sa kontekstong ito, maaari rin itong tumukoy sa mga inapo o kaanib ng angkan, ngunit hindi iyon tahasang nililinaw sa salin.
- source_word: הַשֹּׁעֲרִים
  choice: mga bantay sa pintuan
  rationale: Tumutukoy ito sa mga nakatalagang magbantay at mangasiwa sa mga pintuan, lalo na sa paglilingkod sa templo. Likas at malinaw ito sa makabagong Filipino.
- source_word: שַׁלּוּם
  choice: Salum
  rationale: Isinalin sa baybay na angkop sa Filipino mula sa pangalang Hebreo.
- source_word: אָטֵר
  choice: Ater
  rationale: Tuwirang transliterasyon ng pangalang Hebreo sa baybay na angkop sa Filipino.
- source_word: טַלְמוֹן
  choice: Talmon
  rationale: Tuwirang transliterasyon ng pangalang Hebreo.
- source_word: עַקּוּב
  choice: Akub
  rationale: Isinasaad ng dobleng k sa transliterasyong teknikal ang diin sa katinig, ngunit sapat at mas likas sa Filipino ang baybay na Akub.
- source_word: חֲטִיטָא
  choice: Hatita
  rationale: Tuwirang transliterasyon ng pangalang Hebreo ayon sa tunog nito.
- source_word: שֹׁבָי
  choice: Sobai
  rationale: Sinusunod ang pagbasa ng Masoretikong paglalagay ng patinig at ginagamit ang baybay na angkop sa Filipino.
- source_word: הַכֹּל
  choice: lahat
  rationale: Sa talaan ng bilang, nilalagom nito ang kabuuang dami ng mga grupong nabanggit.
- source_word: מֵאָה שְׁלֹשִׁים וְתִשְׁעָה
  choice: isang daan at tatlumpu’t siyam
  rationale: Likas na pagbigkas sa Filipino ng bilang na 139.
