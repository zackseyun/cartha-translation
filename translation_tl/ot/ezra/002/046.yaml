lexical_decisions:
- source_word: בְּנֵי
  choice: ang mga anak ni
  rationale: Sa talaan ng mga angkan at nagbalik mula sa pagkatapon, ito ang paulit-ulit na pormulang tumutukoy sa mga anak o kaanib ng isang angkan. Pinananatili ng “mga anak ni” ang anyong genealogical ng Hebreo at natural ito sa Filipino.
- source_word: חָגָב
  choice: Hagab
  rationale: Pangalan ng tao o angkan; tinumbasan sa pamamagitan ng transliterasyon.
- source_word: שמלי
  choice: Shamlai
  rationale: Pangalan ng tao o angkan. Ang “Shamlai” ay malapit na kumakatawan sa anyong katinig ng tekstong Hebreo; inilalagay sa talababa ang “Shalmai” bilang alternatibong anyo.
- source_word: חָנָן
  choice: Hanan
  rationale: Pangalan ng tao o angkan; tuwirang isinalin sa pamamagitan ng transliterasyon.
