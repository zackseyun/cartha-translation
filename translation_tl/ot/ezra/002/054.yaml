lexical_decisions:
- source_word: בְּנֵי
  choice: ang mga anak ni
  rationale: Sa talaan ng mga bumalik, ipinakikilala ng בְּנֵי ang mga pangkat na nakaugnay sa isang ninuno o pinuno. Pinananatili ng “ang mga anak ni” ang pormal at paulit-ulit na ayos ng Hebreo at natural ito sa ganitong talaang angkan.
- source_word: נְצִיחַ
  choice: Neziah
  rationale: Pangngalang pantangi ito, kaya isinatitik sa halip na isalin. Pinananatili ang anyong “Neziah” upang maging kaayon ng karaniwang gamit sa mga Bibliyang Tagalog.
- source_word: חֲטִיפָא
  choice: Hatipha
  rationale: Pangngalang pantangi rin ito at isinatitik nang hindi binibigyan ng di-tiyak na kahulugan. Pinananatili ang “Hatipha” bilang kinikilalang anyo ng pangalan sa tradisyong biblikal.
