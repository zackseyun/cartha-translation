translation:
  language: tl
  text: ang mga anak ni Paros[a]—2,172.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang mga inapo ni Paros.” Literal sa Hebreo, “ang mga anak ni Paros,” isang karaniwang katawagan sa angkan sa ganitong uri ng talaan.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: ang mga anak ni
  rationale: Literal itong “mga anak ni,” ngunit sa talaang ito ay nagsisilbing katawagan sa angkan. Pinananatili ng salin ang anyo ng Hebreo, habang nililinaw sa talababa ang mas malawak na diwa.
- source_word: פַרְעֹשׁ
  choice: Paros
  rationale: Pangalang pantangi ng isang tao o angkan; isina-Tagalog ang transliterasyon ayon sa karaniwang pagbigkas, yamang ang panghuling שׁ ay /sh/ na karaniwang kinakatawan ng “s” sa mga pangalang biblikal sa Filipino.
- source_word: אַלְפַּיִם מֵאָה שִׁבְעִים וּשְׁנָיִם
  choice: 2,172
  rationale: Eksaktong 2,172 ang kabuuan ng bilang sa Hebreo. Ginamit ang mga numero para madaling basahin sa isang talaan ng sensus.
