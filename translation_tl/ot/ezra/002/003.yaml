translation_notes:
  register: Maikli at pormal ang pagkakabuo upang umayon sa talaan ng mga pamilya sa sensus. Ginamit ang natural na modernong Filipino, habang pinanatili ang literal na katawagang pang-angkan at ang eksaktong bilang.
