lexical_decisions:
- source_word: בְּנֵי
  choice: ang mga anak ni
  rationale: Sa talaang ito, ang בְּנֵי ay tumutukoy sa isang pangkat ng pamilya o angkan. Pinananatili ng “mga anak ni” ang karaniwang anyo ng Hebreo, habang nililinaw sa talababa na maaari itong sumaklaw sa mga inapo.
- source_word: חָרִם
  choice: Harim
  rationale: Pangalan ito ng tao o angkan, kaya tinumbasan sa pamamagitan ng transliterasyong angkop sa Filipino.
- source_word: אֶלֶף וְשִׁבְעָה עָשָׂר
  choice: 1,017
  rationale: Tuwirang nangangahulugang “isang libo at labimpito.” Ginamit ang mga digit upang madaling mabasa sa isang talaan ng bilang.
