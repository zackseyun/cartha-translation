  text: the sons of Keros[a], the sons of Siaha, the sons of Padon.
translation:
  language: tl
  text: ang mga anak ni Keros[a], ang mga anak ni Siaha, ang mga anak ni Padon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa mga talaangkanan, ang “mga anak ni” ay maaari ring mangahulugang “mga inapo ni” o mga kabilang sa isang angkan, hindi lamang mga tuwirang anak na lalaki.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: ang mga anak ni
  rationale: Pinananatili nito ang paulit-ulit na pormula ng talaangkanan sa Hebreo. Sa kontekstong ito, maaari itong tumukoy hindi lamang sa tuwirang mga anak na lalaki kundi sa mga inapo o kasapi ng angkan.
- source_word: קֵרֹס
  choice: Keros
  rationale: Pangalang pantangi ito, kaya tinumbasan sa pamamagitan ng transliterasyon ayon sa anyong Hebreo.
- source_word: סִיעֲהָא
  choice: Siaha
  rationale: Pangalang pantangi ito sa talaan ng mga pangkat ng pamilya; pinananatili ng “Siaha” ang anyo ng pangalang nasa tekstong Masoretiko.
- source_word: פָדוֹן
  choice: Padon
  rationale: Pangalang pantangi ito, at ang “Padon” ay malapit sa bigkas na ipinahihiwatig ng bokalisasyon sa Hebreo.
