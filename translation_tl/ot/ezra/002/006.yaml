  text: the sons of Pahath-moab, of the sons of Jeshua and Joab, 2,812.
translation:
  language: tl
  text: 'Ang mga anak ni Pahat-Moab, kabilang sa mga anak nina Jeshua at Joab[a]: 2,812.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mula sa mga anak nina Jeshua at Joab.”
    reason: Maaaring ipahiwatig ng לִבְנֵי ang pagiging kabilang o ang pinagmulang linya ng angkan; hindi ganap na tiyak ang eksaktong ugnayan sa maikling pormula ng talaan.
lexical_decisions:
- source_word: בְּנֵי
  choice: mga anak ni/nina
  rationale: Sa talaan ng mga bumalik, ang בְּנֵי ay tumutukoy sa isang pamilya o angkan. Pinananatili ng “mga anak” ang pormal na paraang pangangkan sa Hebreo at malinaw pa rin sa modernong Tagalog.
- source_word: פַחַת מוֹאָב
  choice: Pahat-Moab
  rationale: Pangngalang pantangi ito kaya tinumbasan sa pamamagitan ng transliterasyon. Ginamit ang gitling upang ipakitang tambalang pangalan ito.
- source_word: לִבְנֵי
  choice: kabilang sa mga anak nina
  rationale: Ikinakabit ng unlaping ל ang angkan ni Pahat-Moab sa mga linya nina Jeshua at Joab. Ang “kabilang sa” ay likas sa Tagalog, ngunit nilalagyan ng talababa dahil maaari rin itong maunawaan bilang pinagmulan o kaugnayang pangangkan.
- source_word: יֵשׁוּעַ
  choice: Jeshua
  rationale: Transliterasyon ng maikling anyo ng pangalang Hebreo na ginagamit sa kontekstong pagkatapos ng pagkatapon; pinananatili rin nitong naiiba ang pangalang ito sa karaniwang anyong Josue.
- source_word: יוֹאָב
  choice: Joab
  rationale: Karaniwang transliterasyon sa Tagalog ng pangalang pantangi.
- source_word: אַלְפַּיִם שְׁמֹנֶה מֵאוֹת וּשְׁנֵים עָשָׂר
  choice: 2,812
  rationale: Tuwiran ang bilang sa Hebreo. Ang paggamit ng mga numero ay mas madaling basahin sa isang talaan at hindi nagbabago ng kahulugan.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na maikli at marangal, angkop sa anyo ng talaan. Pinanatili ang paulit-ulit na idyomang “mga anak” upang maipakita ang estrukturang pangangkan ng Hebreo, habang ginawang natural ang pang-ugnay.
