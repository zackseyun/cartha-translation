  footnotes:
  - marker: a
    text: O maaaring “ang mga inapo ng Rama at Geba.” Sa talaang ito, ang idyomang Hebreo na “mga anak ng” ay maaaring tumukoy sa mas malawak na angkan o pangkat ng pamayanan, hindi lamang sa tuwirang mga anak.
