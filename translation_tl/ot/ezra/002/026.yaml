lexical_decisions:
- source_word: בְּנֵי
  choice: ang mga anak ng
  rationale: Pinananatili nito ang pormal na idyomang Hebreo sa talaan, bagaman maaaring tumukoy ito sa mga inapo o sa isang mas malawak na pangkat, hindi lamang sa tuwirang mga anak.
- source_word: הָרָמָה
  choice: Rama
  rationale: Pangalan ito ng lugar; ginamit ang karaniwang anyong Tagalog ng biblikal na pangalang Ramah.
- source_word: וָגָבַע
  choice: at Geba
  rationale: Pangalan ito ng lugar na pinag-ugnay ng waw; pinanatili ang transliterasyong Geba upang maiba sa Gibeah.
- source_word: שֵׁשׁ מֵאוֹת עֶשְׂרִים וְאֶחָד
  choice: animnaraan at dalawampu't isa
  rationale: Tuwirang salin ng kabuuang bilang sa natural at kasalukuyang Filipino.
