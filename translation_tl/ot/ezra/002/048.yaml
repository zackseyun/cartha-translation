lexical_decisions:
- source_word: בְּנֵי
  choice: ang mga anak ni
  rationale: Ang paulit-ulit na pariralang construct plural ng בֵּן ay literal na “mga anak ni” at karaniwang pormula sa listahan para sa mga kabilang sa isang angkan o sambahayan. Pinananatili nito ang anyo ng Hebreo habang natural sa Filipino; maaari rin itong tumukoy sa mga inapo, hindi lamang sa tuwirang mga anak na lalaki.
- source_word: רְצִין
  choice: Rezin
  rationale: Pangngalang pantangi na tinumbasan sa pamamagitan ng transliterasyon.
- source_word: נְקוֹדָא
  choice: Nekoda
  rationale: Pangngalang pantangi; ang “Nekoda” ay malapit na kumakatawan sa anyong Hebreo.
- source_word: גַזָּם
  choice: Gazzam
  rationale: Pangngalang pantangi; pinanatili ang dobleng z upang katawanin ang dagesh at mas malapit na maipakita ang anyong ponetiko ng Hebreo.
