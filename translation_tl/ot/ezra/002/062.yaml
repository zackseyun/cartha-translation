base_translation:
  language: en
  yaml_path: translation/ot/ezra/002/062.yaml
  text: These sought their record among those enrolled by genealogy[a], but they were not found, and they were excluded from the priesthood.
translation:
  language: tl
  text: Hinahanap ng mga taong ito ang kanilang katibayang nakasulat sa talaang pangangkanan, ngunit hindi sila natagpuan doon; kaya ibinukod sila mula sa pagkapari.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “itinuring silang marumi” o “itinuring silang hindi karapat-dapat sa pagkapari.” Ipinahihiwatig ng pandiwang Hebreo ang pagtrato sa kanila bilang hindi angkop sa katayuang pagkasaserdote dahil hindi mapatunayan ang kanilang angkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: mga ito
  rationale: Tumutukoy ang pangmaramihang pamatlig sa mga nag-aangking kabilang sa angkan ng mga pari na binanggit sa naunang talata.
- source_word: בִּקְשׁוּ
  choice: Hinanap
  rationale: Tuwirang ipinapahayag ang masusing paghahanap sa hinihinging katibayang nakasulat.
- source_word: כְתָבָם
  choice: kanilang kasulatan
  rationale: Ang כְּתָב ay isang nakasulat na dokumento o katibayan. Hindi nito tiyak na sinasabi ang anyo ng dokumento, kaya hindi ito labis na tinukoy.
- source_word: הַמִּתְיַחְשִׂים
  choice: sa talaan ng mga nakatala ayon sa angkan
  rationale: Ipinahihiwatig ng anyong Hitpael ng יחס ang pagpapatala o pagpapatunay batay sa angkan. Ginawang malinaw sa Filipino ang administratibong konteksto nang hindi ipinapalagay ang eksaktong anyo ng talaan.
- source_word: וְלֹא נִמְצָאוּ
  choice: ngunit hindi sila natagpuan doon
  rationale: 'Pinanatili ang pangmaramihang paksa ng pandiwang Hebreo. Ang “doon” ay nilinaw mula sa konteksto: hindi nakita sa talaang pangangkanan ang mga taong ito.'
- source_word: וַיְגֹאֲלוּ
  choice: itinuring silang hindi karapat-dapat
  rationale: Saklaw ng bihirang anyo ng pandiwa ang pagiging itinuring na marumi o hindi kuwalipikado. Ipinahahayag ng salin ang hatol sa kanilang katayuan nang hindi labis na nililimitahan ito sa ritwal na karumihan.
- source_word: מִן הַכְּהֻנָּה
  choice: sa pagkapari
  rationale: Natural at tuwirang katumbas ito ng katayuan o tungkulin bilang pari.
theological_decisions:
- issue: Kahulugan ng וַיְגֹאֲלוּ kaugnay ng katayuan bilang pari
  choice: itinuring silang hindi karapat-dapat sa pagkapari
  alternative: itinuring silang marumi at inalis sa pagkapari
  rationale: Maaaring magpahiwatig ang pandiwa ng karumihan o pagkakait ng karapatang maglingkod. Pinananatili ng pangunahing salin ang parehong paghatol at praktikal na resulta, habang inilalahad sa talababa ang mas literal na alternatibo upang hindi mapawi ang leksikal at teolohikal na tensiyon.
translation_notes:
  register: Makabago at marangal na Filipino, na may malinaw na wikang administratibo. Ginamit ang “kasulatan” para sa dokumentong hinahanap at “talaan” para sa kalipunan ng mga nakatala, upang mapanatili ang pagkakaiba ng dalawang konsepto sa Hebreo.
