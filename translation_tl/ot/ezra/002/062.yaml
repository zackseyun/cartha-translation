revisions:
- from: Hinanap ng mga ito ang kanilang kasulatan sa talaan ng mga nakatala ayon sa angkan, ngunit hindi sila natagpuan doon. Kaya itinuring silang hindi karapat-dapat sa pagkapari.[a]
  to: Hinahanap ng mga taong ito ang kanilang katibayang nakasulat sa talaang pangangkanan, ngunit hindi sila natagpuan doon; kaya ibinukod sila mula sa pagkapari.[a]
  rationale: Pinalitan ang malabong “kasulatan” ng “katibayang nakasulat” at pinasimple ang pariralang tumutukoy sa genealogikal na rehistro. Ginawang “ibinukod sila mula sa pagkapari” ang pangunahing salin upang malinaw na maipahayag ang resulta ng pasibong pandiwang Hebreo, habang pinananatili ng talababa ang mahalagang saklaw na defilement/disqualification. Walang idinagdag na doktrinal na pagpapakahulugan.
  reviewer_model: gpt-5.6-terra
