lexical_decisions:
- source_word: בְּנֵי
  choice: ang mga anak ni
  rationale: Sa talaan ng mga bumalik, ipinakikilala ng בְּנֵי ang isang angkan o pangkat ng mga inapo na inuugnay sa isang lalaking ninuno. Pinananatili ng “mga anak ni” ang anyong pangangkan ng Hebreo at natural ito sa ganitong talaan sa Tagalog.
- source_word: חָשֻׁם
  choice: Hashum
  rationale: Isinalin sa baybay na “Hashum” bilang karaniwang transliterasyon ng pangalang Hebreo, nang hindi binabago ang pangalan.
- source_word: מָאתַיִם עֶשְׂרִים וּשְׁלֹשָׁה
  choice: '223'
  rationale: Ang bilang sa Hebreo ay dalawang daan, dalawampu, at tatlo. Ang numerong “223” ay malinaw, maikli, at angkop sa anyo ng isang mahabang talaan.
