lexical_decisions:
- source_word: בְּנֵי
  choice: ang mga anak ni
  rationale: Tuwirang isinasalin ang construct plural ng בֵּן na nagpapakilala sa pangkat ng pamilya o angkan sa talaan. Natural sa Tagalog ang “mga anak ni” at pinananatili nito ang anyong genealogical ng Hebreo.
- source_word: עֵילָם
  choice: Elam
  rationale: Isinalin sa baybay na “Elam” ang pangalang pantangi, alinsunod sa karaniwang anyo nito sa Tagalog at sa prinsipyong hindi isalin ang kahulugan ng pangalan.
- source_word: אֶלֶף מָאתַיִם חֲמִשִּׁים וְאַרְבָּעָה
  choice: 1,254
  rationale: Ang sunod-sunod na bilang sa Hebreo ay may kabuuang 1,254. Ginamit ang mga digit upang maging malinaw at madaling basahin sa talaang sensus.
