translation_notes:
  register: Maikli at dignified na modernong Tagalog na angkop sa isang talaang sensus. Pinanatili ang literal na ugnayang pampamilya na “mga anak ni,” na maaari ring tumukoy sa mas malawak na pangkat ng mga inapo o angkan.
