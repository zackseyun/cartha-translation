lexical_decisions:
- source_word: בְּנֵי
  choice: ang mga anak ni
  rationale: Sa talaan ng mga bumalik, ang construct plural ng בֵּן ay tumutukoy sa mga kabilang sa angkan o sambahayan ng isang ninuno. Pinananatili ng “mga anak ni” ang pormal na anyo ng Hebreo at natural ito sa ganitong talaang genealogical sa Tagalog.
- source_word: עַזְגָּד
  choice: Azgad
  rationale: Pangalan ito ng tao o angkan, kaya tinumbasan sa pamamagitan ng transliterasyong karaniwan sa Tagalog sa halip na isalin ang pangalan.
- source_word: אֶלֶף מָאתַיִם עֶשְׂרִים וּשְׁנָיִם
  choice: 1,222
  rationale: Ang sunod-sunod na bilang sa Hebreo ay kabuuang 1,222. Ginamit ang mga numerong Arabe dahil malinaw at angkop ang mga ito sa anyo ng talaan.
