  text: וַ/יֵּשְׁב֣וּ הַ/כֹּהֲנִ֣ים וְ֠/הַ/לְוִיִּם וּֽ/מִן הָ/עָ֞ם וְ/הַ/מְשֹׁרְרִ֧ים וְ/הַ/שּׁוֹעֲרִ֛ים וְ/הַ/נְּתִינִ֖ים בְּ/עָרֵי/הֶ֑ם וְ/כָל יִשְׂרָאֵ֖ל בְּ/עָרֵי/הֶֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/002/070.yaml
  text: So the priests[a], the Levites, some of the people, the singers, the gatekeepers, and the temple servants lived in their cities, and all Israel lived in their cities.
translation:
  language: tl
  text: Kaya nanirahan sa kani-kanilang mga lungsod ang mga pari, ang mga Levita, ang ilan sa bayan, ang mga mang-aawit, ang mga bantay-pinto, at ang mga lingkod sa templo[a]. Nanirahan din ang buong Israel sa kani-kanilang mga lungsod.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: “mga Netinim,” isang teknikal na katawagan para sa isang uring itinalaga sa paglilingkod sa templo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשְׁבוּ
  choice: nanirahan
  rationale: Sa kontekstong ito, ang pandiwang יָשַׁב ay tumutukoy sa paninirahan o pagtira sa isang lugar. Natural at marangal sa modernong Filipino ang “nanirahan.”
- source_word: הַכֹּהֲנִים
  choice: ang mga pari
  rationale: Karaniwang salin ng katawagang tumutukoy sa mga paring naglilingkod sa kontekstong pangtemplo.
- source_word: הַלְוִיִּם
  choice: ang mga Levita
  rationale: Pinananatili ang nakaugaliang katawagan sa grupong mula sa lipi ni Levi, na ipinakikitang naiiba rito sa mga pari.
- source_word: וּמִן הָעָם
  choice: ang ilan sa bayan
  rationale: Partitibo ang מִן, kaya isang bahagi lamang ng karaniwang mamamayan ang tinutukoy, hindi ang buong bayan.
- source_word: הַמְשֹׁרְרִים
  choice: ang mga mang-aawit
  rationale: Tuwirang ipinahahayag ang tungkulin ng grupong nakatalaga sa pag-awit, lalo na sa paglilingkod sa templo.
- source_word: הַשּׁוֹעֲרִים
  choice: ang mga bantay-pinto
  rationale: Malinaw na inilalarawan ang mga taong nagbabantay o nangangasiwa sa mga pintuan, lalo na sa templo.
- source_word: הַנְּתִינִים
  choice: ang mga lingkod sa templo
  rationale: Teknikal itong katawagan para sa isang uring nakatalaga sa paglilingkod sa templo. Isinalin ang tungkulin para madaling maunawaan, habang inilalagay sa talababa ang transliterasyong Hebreo.
- source_word: בְּעָרֵיהֶם
  choice: sa kani-kanilang mga lungsod
  rationale: Ipinahahayag ng “kani-kanilang” ang distributibong diwa ng paninirahan ng mga pangkat sa mga lungsod na nauukol sa kanila.
- source_word: וְכָל יִשְׂרָאֵל
  choice: ang buong Israel
  rationale: Pinananatili ang kolektibong katawagang biblikal para sa kabuuan ng sambayanang Israel.
theological_decisions:
- issue: Pagbibigay-kahulugan sa teknikal na katawagang הַנְּתִינִים
  choice: ang mga lingkod sa templo
  alternative: ang mga Netinim
  rationale: Mas nauunawaan ng karaniwang mambabasa ang saling batay sa tungkulin. Dahil hindi lubos na nahuhuli ng salin ang teknikal na katangian ng katawagan, pinananatili sa talababa ang transliterasyon.
translation_notes:
  register: Modernong Filipino na natural ngunit marangal. Inulit ang pandiwang “nanirahan” sa ikalawang pangungusap upang maging malinaw ang elipsis sa Hebreo. Inilagay ang panandang talababa sa “mga lingkod sa templo,” ang mismong katumbas ng הַנְּתִינִים.
