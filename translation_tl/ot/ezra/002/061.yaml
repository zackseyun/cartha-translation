translation_notes:
  register: Makabago at marangal na Filipino, na pinananatili ang anyong talaangkanan. Ginamit ang “mga anak ni” sa halip na lubusang interpretibong “mga inapo ni,” at ang gitling ay tumutulong upang malinaw na iugnay ang kasunod na sugnay kay Barzilai na kabilang sa pangkat ng mga pari.
