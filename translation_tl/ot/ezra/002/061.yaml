  to: 'At mula sa mga anak ng mga pari: ang mga anak ni Hobaya, ang mga anak ni Hakoz, at ang mga anak ni Barzilai—na kumuha bilang asawa ng isa sa mga anak na babae ni Barzilai na taga-Gilead at siya ay tinawag ayon sa pangalan nila.[a]'
