base_translation:
  language: en
  yaml_path: translation/ot/ezra/002/061.yaml
  text: 'And from among the sons of the priests: the sons of Hobaiah[a], the sons of Hakkoz, the sons of Barzillai, who had taken a wife from the daughters of Barzillai the Gileadite and was called by their name.'
translation:
  language: tl
  text: 'At mula sa mga anak ng mga pari: ang mga anak ni Hobaya, ang mga anak ni Hakoz, at ang mga anak ni Barzilai—na kumuha bilang asawa ng isa sa mga anak na babae ni Barzilai na taga-Gilead at siya ay tinawag ayon sa pangalan nila.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “at siya ay tinawag sa pangalan nila.” Maaari ring isalin, “at siya ay pinangalanan ayon sa kanila.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִבְּנֵי הַכֹּהֲנִים
  choice: At mula sa mga anak ng mga pari
  rationale: Pinananatili ang partitive na diwa ng מִן at ang anyong pangangkan ng בְּנֵי, habang natural pa rin sa makabagong Tagalog.
- source_word: בְּנֵי חֳבַיָּה ... בְּנֵי הַקּוֹץ ... בְּנֵי בַרְזִלַּי
  choice: ang mga anak ni Hobaya ... ang mga anak ni Hakoz ... ang mga anak ni Barzilai
  rationale: Inulit ang “mga anak ni” upang mapanatili ang estruktura at genealogical na rehistro ng Hebreo; isinalin sa baybay-Tagalog ang mga pangalang pantangi.
- source_word: אֲשֶׁר לָקַח מִבְּנוֹת ... אִשָּׁה
  choice: siya na kumuha bilang asawa ng isa sa mga anak na babae ni
  rationale: Ipinahahayag ang idyomang “kumuha ng babae bilang asawa” at nililinaw ng “isa sa” ang partitive na מִן nang hindi binabago ang kahulugan.
- source_word: בַּרְזִלַּי הַגִּלְעָדִי
  choice: Barzilai na Gileadita
  rationale: Tuwirang katumbas ng gentilic na הַגִּלְעָדִי at karaniwang anyo sa Tagalog.
- source_word: וַיִּקָּרֵא עַל שְׁמָם
  choice: at tinawag sa pangalan ng kanilang angkan
  rationale: Pinananatili ang pasibong “tinawag” ng Niphal. Idinagdag ang “angkan” upang maging likas at maunawaan sa Tagalog ang pangmaramihang hulaping “kanila,” na tumutukoy sa pamilya ni Barzilai, habang inilalahad sa talababa ang mas literal na anyo.
