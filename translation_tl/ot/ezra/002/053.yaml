  text: the sons of Barkos[a], the sons of Sisera, the sons of Temah.
translation:
  language: tl
  text: ang mga anak ni Barkos, ang mga anak ni Sisera, at ang mga anak ni Tamah.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa ilang salin, “Temah,” isang tradisyonal na ibang transliterasyon ng pangalang Hebreo.
