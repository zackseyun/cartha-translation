lexical_decisions:
- source_word: בְּנֵי
  choice: ang mga anak ni
  rationale: Ito ang tuwirang salin ng pormulang pangkanunu-nunuan. Sa konteksto ng talaan, maaaring tumukoy ang “mga anak” sa mas malawak na pangkat ng mga inapo o angkan.
- source_word: בַרְקוֹס
  choice: Barkos
  rationale: Pangngalang pantangi ito, kaya tinumbasan sa pamamagitan ng transliterasyon na madaling basahin sa Filipino.
- source_word: סִיסְרָא
  choice: Sisera
  rationale: Pinanatili ang nakasanayang anyo ng pangalang pantangi. Dito, pangalan ito ng pinagmulan ng isang pangkat sa talaan.
- source_word: תָמַח
  choice: Temah
  rationale: Isinalin sa titik ang pangalang Hebreo ayon sa patinig ng tekstong Masoretiko; pinanatili ang h upang katawanin ang huling katinig na ח.
theological_decisions: []
translation_notes:
  register: Gumamit ng payak ngunit marangal na modernong Filipino. Pinanatili ang paulit-ulit na hulma ng tekstong Hebreo bilang angkop sa isang talaang pangkanunu-nunuan, at idinagdag ang “at” bago ang huling pangkat para sa likas na daloy sa Filipino. Inilipat ang panandang talababa sa “Temah,” ang pangalang aktuwal na tinutukoy ng paliwanag.
