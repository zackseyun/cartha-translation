lexical_decisions:
- source_word: בְּנֵי
  choice: mga anak ng
  rationale: Literal itong nangangahulugang “mga anak ng,” ngunit sa talaang ito maaari rin itong tumukoy sa mga kabilang sa angkan o sa mga taong nagmula sa isang lugar. Pinananatili ng “mga anak ng” ang maikli at pormal na estilo at ang likas na lawak ng kahulugan ng Hebreo.
- source_word: בֵית לָחֶם
  choice: Bethlehem
  rationale: Pangalan ito ng lugar. Ginamit ang karaniwang anyo sa Filipino sa halip na literal na isalin ang mga bahagi ng pangalan.
- source_word: מֵאָה עֶשְׂרִים וּשְׁלֹשָׁה
  choice: isang daan at dalawampu't tatlo
  rationale: Malinaw at likas na pagpapahayag sa modernong Filipino ng bilang na 123; ang pangatnig sa Hebreo ay naipapahayag nang idyomatiko sa anyong Filipino.
