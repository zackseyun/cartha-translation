lexical_decisions:
- source_word: בְּנֵי
  choice: ang mga anak ni
  rationale: Sa konteksto ng talaan ng Ezra 2, ipinakikilala nito ang isang pangkat ng pamilya o angkan. Pinananatili ng “mga anak ni” ang anyo ng Hebreo at likas din sa Filipino bilang pagtukoy sa mga inapo o kasapi ng angkan.
- source_word: בִגְוָי
  choice: Bigvai
  rationale: Pangalan ng tao o angkan; tinumbasan sa pamamagitan ng transliterasyon sa halip na isalin.
- source_word: אַלְפַּיִם
  choice: 2,000
  rationale: Tuwirang bilang na nangangahulugang dalawang libo; isinama sa karaniwang modernong pagsulat ng kabuuang bilang.
- source_word: חֲמִשִּׁים
  choice: '50'
  rationale: Bilang na limampu, na idinaragdag sa kasunod na anim.
- source_word: וְשִׁשָּׁה
  choice: '6'
  rationale: Ang pang-ugnay at bilang na “at anim” ay likas na pinagsama sa kabuuang 2,056 sa isang talaang sensus.
