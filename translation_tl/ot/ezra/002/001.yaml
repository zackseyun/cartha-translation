  text: וְ/אֵ֣לֶּה בְּנֵ֣י הַ/מְּדִינָ֗ה הָֽ/עֹלִים֙ מִ/שְּׁבִ֣י הַ/גּוֹלָ֔ה אֲשֶׁ֥ר הֶגְלָ֛ה נבוכדנצור מֶֽלֶךְ בָּבֶ֖ל לְ/בָבֶ֑ל וַ/יָּשׁ֛וּבוּ לִ/ירוּשָׁלִַ֥ם וִֽ/יהוּדָ֖ה אִ֥ישׁ לְ/עִירֽ/וֹ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/002/001.yaml
  text: These are the sons of the province who came up from the captivity of the exiles[a], whom Nebuchadnezzar king of Babylon had carried away to Babylon, and they returned to Jerusalem and Judah[c][b], each to his own city.
translation:
  language: tl
  text: At ito ang mga mamamayan ng lalawigan[a] na umahon mula sa pagkabihag ng mga ipinatapon[b], na ipinatapon ni Nebucadnezar[c], na hari ng Babilonia, patungong Babilonia. Bumalik sila sa Jerusalem at Juda, bawat isa sa sarili niyang lungsod.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “mga anak ng lalawigan,” isang idyomang Hebreo para sa mga kabilang sa lalawigan.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isaling “mula sa pagkabihag ng mga nasa pagkatapon.” Pinagsasama ng Hebreo ang mga ideya ng pagkabihag at ng pamayanang ipinatapon.
    reason: lexical_alternative
  - marker: c
    text: May iba’t ibang anyo ng baybay ng pangalang Nebucadnezar sa tekstong Hebreo.
    reason: textual_or_transliteration_note
lexical_decisions:
- source_word: בְּנֵי הַמְּדִינָה
  choice: mga mamamayan ng lalawigan
  rationale: Ang literal na “mga anak ng lalawigan” ay isang idyomang Hebreo para sa mga kabilang o naninirahan sa lalawigan. Ang “mga mamamayan ng lalawigan” ay malinaw at likas sa modernong Tagalog habang pinananatili ang administratibong kahulugan ng מְדִינָה.
- source_word: הָעֹלִים
  choice: na umahon
  rationale: Pinananatili ng “umahon” ang larawan ng pag-akyat patungong Juda at Jerusalem at hindi ito ipinagpapalit sa “bumalik,” sapagkat tahasang ginagamit ang pandiwang שׁוּב sa kasunod na sugnay.
- source_word: מִשְּׁבִי הַגּוֹלָה
  choice: mula sa pagkabihag ng mga ipinatapon
  rationale: Kapuwa isinasalin ang שְׁבִי, “pagkabihag,” at גּוֹלָה, “mga ipinatapon/pamayanang ipinatapon,” upang hindi paikliin ang mas buong pananalita ng Hebreo.
- source_word: הֶגְלָה
  choice: ipinatapon
  rationale: Ang Hiphil ng גלה ay tumutukoy sa sapilitang pagpapatapon. Ang “ipinatapon” ay tuwiran, makasaysayang angkop, at karaniwan sa Tagalog.
- source_word: נבוכדנצור
  choice: Nebucadnezar
  rationale: Ginamit ang nakaugaliang anyo ng pangalan sa mga saling Bibliya sa Filipino; nililinaw sa talababa na may pagkakaiba-iba ang baybay ng pangalan sa tekstong Hebreo.
- source_word: וַיָּשׁוּבוּ
  choice: Bumalik sila
  rationale: Tuwirang ipinahahayag nito ang aktuwal na pagbabalik at inihihiwalay ito sa naunang larawan ng pag-ahon.
- source_word: לִירוּשָׁלַם וִיהוּדָה
  choice: sa Jerusalem at Juda
  rationale: Tuwiran at likas na isinasalin ang magkatambal na patutunguhan.
- source_word: אִישׁ לְעִירוֹ
  choice: bawat isa sa sarili niyang lungsod
  rationale: Ang אִישׁ ay distributibo rito. Ang “bawat isa” ay likas sa Tagalog, at ang “sarili niyang lungsod” ay nagpapanatili sa isahang pagmamay-ari nang hindi nagdaragdag ng di-kinakailangang paliwanag.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinili ang malinaw na kahulugan ng idyomang “mga anak ng lalawigan” sa pangunahing teksto at inilagay ang literal na anyo sa talababa. Napanatili ang pagkakaiba ng “umahon” at “bumalik,” gayundin ang mas buong pariralang tumutukoy kapuwa sa pagkabihag at sa mga ipinatapon.
