  text: 'The priests: the sons of Jedaiah[a], of the house of Jeshua[b], 973.'
translation:
  language: tl
  text: 'Ang mga pari: ang mga anak ni Jedaias[a], sa sambahayan ni Jesua[b]—973.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga inapo ni Jedaias.” Literal sa Hebreo ang “mga anak ni Jedaias,” isang karaniwang pananalita sa mga talaan ng angkan.
    reason: lexical_alternative
  - marker: b
    text: Ang Jesua ay isang personal na pangalang ginamit pagkaraan ng pagkakatapon at kaugnay ng pangalang Josue.
    reason: cultural_note
lexical_decisions:
- source_word: הַכֹּהֲנִים
  choice: Ang mga pari
  rationale: Tuwirang salin ng tiyak na pangngalang maramihan; ipinakikilala nito ang pangkat ng mga pari sa talaan.
- source_word: בְּנֵי
  choice: ang mga anak ni
  rationale: Pinananatili ang literal na anyong genealogical ng Hebreo, bagaman maaari rin itong tumukoy sa mga inapo o kaanib ng angkan.
- source_word: יְדַעְיָה
  choice: Jedaias
  rationale: Transliterasyon ng pangalang Hebreo na angkop sa nakagawiang anyo ng pangalan sa Tagalog na Bibliya.
- source_word: לְבֵית
  choice: mula sa sambahayan ni
  rationale: Ipinahahayag ang kaugnayan sa isang linya ng pamilya o angkan; mas natural sa modernong Tagalog kaysa sa literal na 'sa bahay ni'.
- source_word: יֵשׁוּעַ
  choice: Jesua
  rationale: Transliterasyon ng postexilic na personal na pangalan; kaugnay ito ng pangalang Josue ngunit pinananatili ang anyong nasa tekstong Hebreo.
- source_word: תְּשַׁע מֵאוֹת שִׁבְעִים וּשְׁלֹשָׁה
  choice: '973'
  rationale: Ang bilang sa Hebreo ay siyam na raan at pitumpu't tatlo; ginamit ang mga digit para madaling basahin sa talaan.
