  text: All the temple servants and the sons of Solomon’s servants were three hundred ninety-two[a].
translation:
  language: tl
  text: Ang lahat ng mga tagapaglingkod sa templo[a] at ng mga anak ng mga lingkod ni Solomon ay 392.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: Netinim, isang teknikal na katawagan para sa pangkat na itinalaga sa paglilingkod sa templo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל
  choice: Ang lahat ng
  rationale: Tumutukoy ito sa kabuuang bilang ng dalawang kasunod na pangkat at natural na naihahayag sa modernong Tagalog.
- source_word: הַנְּתִינִים
  choice: mga tagapaglingkod sa templo
  rationale: Teknikal itong katawagan sa isang pangkat na itinalaga sa paglilingkod sa templo. Mas malinaw sa karaniwang mambabasa ang paglalarawan sa kanilang tungkulin kaysa transliterasyong “Netinim.”
- source_word: וּבְנֵי
  choice: at ng mga anak ng
  rationale: Pinananatili nito ang literal na anyong “mga anak ng” bilang pangalan ng isang pangkat ayon sa angkan.
- source_word: עַבְדֵי
  choice: mga lingkod ni
  rationale: Maaaring mangahulugan ang עֶבֶד ng lingkod o alipin. Sa administratibo at pangkatang talaang ito, hindi tahasang itinatampok ang kalagayang pagkaalipin, kaya ang “mga lingkod” ang mas angkop nang hindi lubusang nilulutas ang saklaw ng termino.
- source_word: שְׁלֹמֹה
  choice: Solomon
  rationale: Ito ang karaniwang anyo ng pangalan sa modernong saling Tagalog.
- source_word: שְׁלֹשׁ מֵאוֹת תִּשְׁעִים וּשְׁנָיִם
  choice: '392'
  rationale: Tuwirang inilalahad ng mga numerong Arabe ang kardinal na bilang at madaling basahin sa isang talaan.
