  yaml_path: translation/ot/ezra/002/065.yaml
  text: besides their male and female servants[a], these were 7,337; and they had 200 male and female singers.
translation:
  language: tl
  text: Bukod pa sa kanilang mga aliping lalaki at babae[a], na 7,337 lahat, mayroon din silang 200 mang-aawit na lalaki at babae.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga lingkod na lalaki at babae.” Maaaring tumukoy ang mga salitang Hebreo sa mga lingkod sa sambahayan sa mas malawak na diwa, ngunit sa konteksto ng sensus, mas malinaw na naihahayag ng “mga alipin” ang kanilang nakapailalim na katayuan.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִלְּבַד
  choice: Bukod pa sa
  rationale: Likas na ipinahahayag sa Filipino na ang kasunod na bilang ay hiwalay at dagdag sa naunang kabuuan.
- source_word: עַבְדֵיהֶם וְאַמְהֹתֵיהֶם
  choice: kanilang mga aliping lalaki at babae
  rationale: Pinananatili ang tahasang pagkakaiba ng kasarian at ipinakikita ang nakapailalim na katayuang panlipunan ng mga taong binibilang; inilalahad sa talababa ang mas malawak na posibleng diwang 'mga lingkod.'
- source_word: אֵלֶּה
  choice: na ... lahat
  rationale: Inihahatid nang natural sa Filipino ang diwang ang tinutukoy na mga alipin ang bumubuo sa ibinigay na kabuuan.
- source_word: שִׁבְעַת אֲלָפִים שְׁלֹשׁ מֵאוֹת שְׁלֹשִׁים וְשִׁבְעָה
  choice: 7,337
  rationale: Ginamit ang mga numero upang maging madaling basahin sa talaan ng sensus habang eksaktong pinananatili ang bilang.
- source_word: וְלָהֶם
  choice: mayroon din silang
  rationale: Natural na katumbas sa Filipino ng Hebreong konstruksiyong nagpapahayag ng pag-aari o kaugnayan; ang 'din' ay angkop sa idinagdag na pangkat.
- source_word: מְשֹׁרְרִים וּמְשֹׁרְרוֹת
  choice: mang-aawit na lalaki at babae
  rationale: Pinananatili ang tahasang panlalaki at pambabaeng anyo ng Hebreo sa malinaw at kasalukuyang Filipino.
- source_word: מָאתָיִם
  choice: '200'
  rationale: Mga numero ang ginamit para sa malinaw at pare-parehong paglalahad ng bilang.
