  yaml_path: translation/ot/ezra/002/045.yaml
  text: the sons of Lebanah[a], the sons of Hagabah, the sons of Akkub.
translation:
  language: tl
  text: ang mga anak ni Lebana[a], ang mga anak ni Hagaba, at ang mga anak ni Akub.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Hebreong “mga anak ni” ay maaaring tumukoy sa isang angkan o pangkat ng pamilya, hindi lamang sa mga tuwirang anak na lalaki.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: ang mga anak ni
  rationale: Literal itong nangangahulugang “mga anak ni,” ngunit sa talaang ito maaari rin itong tumukoy sa mga inapo o mga kabilang sa isang angkan. Pinananatili ng salin ang paulit-ulit na anyo ng Hebreo at inililinaw sa talababa ang mas malawak na gamit nito.
- source_word: לְבָנָה
  choice: Lebana
  rationale: Pangalan itong isinalin sa baybay na likas basahin sa Filipino at malapit sa bigkas ng Hebreo; hindi binibigkas bilang hiwalay na katinig ang pangwakas na he.
- source_word: חֲגָבָה
  choice: Hagaba
  rationale: Pangalan itong tinumbasan sa baybay na angkop sa Filipino at malapit sa Masoretikong bigkas.
- source_word: עַקּוּב
  choice: Akub
  rationale: Pangalan itong isinalin ayon sa bigkas ng Hebreo, gamit ang payak at likas na baybay sa Filipino.
theological_decisions: []
translation_notes:
  register: Gumamit ng payak ngunit marangal na anyo para sa talaan. Pinanatili ang tatlong ulit na “ang mga anak ni” upang maipakita ang estruktura ng Hebreo; idinagdag ang “at” bago ang huling pangkat bilang likas na pag-uugnay sa modernong Filipino.
