base_translation:
  language: en
  yaml_path: translation/ot/ezra/002/059.yaml
  text: And these were the ones who came up from Tel-melah[a], Tel-harsha, Kerub, Addan, and Immer, but they were not able to declare their fathers’ house and their offspring, whether they were from Israel.
translation:
  language: tl
  text: At ito ang mga umahon mula sa Tel-melah, Tel-harsha, Kerub, Addan, at Immer. Ngunit hindi nila mapatunayan ang angkan sa panig ng kanilang ama at ang kanilang lahi[a], kung sila nga ay mula sa Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “bahay ng kanilang mga ama at kanilang binhi.” Tumutukoy ang pananalitang Hebreo sa angkan o sambahayan at salinlahing karaniwang sinusundan sa panig ng ama.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעֹלִים
  choice: mga umahon
  rationale: Pinananatili nito ang karaniwang heograpikong paglalarawan sa pagpunta o pagbabalik sa lupain nang hindi ito agad ipinapakahulugang “mga bumalik.”
- source_word: מִתֵּל מֶלַח תֵּל חַרְשָׁא כְּרוּב אַדָּן אִמֵּר
  choice: mula sa Tel-melah, Tel-harsha, Kerub, Addan, at Immer
  rationale: Mga pangalang pantangi ang mga ito, kaya tinumbasan sa pamamagitan ng transliterasyon sa halip na isalin ang kahulugan ng mga pangalan.
- source_word: לֹא יָכְלוּ לְהַגִּיד
  choice: hindi nila maipahayag
  rationale: Likas itong pahayag sa Filipino para sa kawalan nila ng kakayahang maipabatid o maipakita ang hinihinging impormasyong pangangkan sa kontekstong administratibo.
- source_word: בֵּית אֲבוֹתָם
  choice: ang sambahayan ng kanilang mga ninuno
  rationale: Pinananatili ng “sambahayan” ang larawan ng Hebrew na “bahay,” habang nililinaw ng “mga ninuno” na tumutukoy ito sa minanang pangkat ng pamilya.
- source_word: וְזַרְעָם
  choice: at ang kanilang lahi
  rationale: Sa kontekstong ito, ang זרע ay tumutukoy sa pinagmulang angkan o linya ng salinlahi, hindi lamang sa agarang mga anak.
- source_word: אִם מִיִּשְׂרָאֵל הֵם
  choice: kung sila ay mula sa Israel
  rationale: Pinananatili nito ang kawalang-katiyakan sa teksto tungkol sa kanilang Israelitang pinagmulan.
