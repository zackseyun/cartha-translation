- from: At ito ang mga umahon mula sa Tel-melah, Tel-harsha, Kerub, Addan, at Immer. Ngunit hindi nila maipahayag ang sambahayan ng kanilang mga ninuno at ang kanilang lahi[a], kung sila ay mula sa Israel.
  to: At ito ang mga umahon mula sa Tel-melah, Tel-harsha, Kerub, Addan, at Immer. Ngunit hindi nila mapatunayan ang angkan sa panig ng kanilang ama at ang kanilang lahi[a], kung sila nga ay mula sa Israel.
