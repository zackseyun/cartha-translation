lexical_decisions:
- source_word: בְּנֵי
  choice: ang mga anak ni
  rationale: Sa konteksto ng talaangkanan at talaan ng mga bumalik, maaari itong tumukoy sa mga inapo o kaanib ng angkan. Pinananatili ng “mga anak ni” ang pormal na anyo ng Hebreo at likas ito sa ganitong listahan.
- source_word: אָטֵר
  choice: Ater
  rationale: Pangalan ng tao o angkan; tinumbasan sa pamamagitan ng transliterasyon.
- source_word: לִיחִזְקִיָּה
  choice: mula sa angkan ni Hezekias
  rationale: Ang לְ ay nagpapahiwatig dito ng kaugnayan o mas tiyak na sangay sa loob ng angkan ni Ater. Nililinaw ng parirala ang ugnayan nang hindi ito ginagawang hiwalay na bilang o pangalan.
- source_word: תִּשְׁעִים וּשְׁמֹנָה
  choice: '98'
  rationale: Likas at malinaw na modernong Filipino na anyo ng bilang na siyamnapu't walo sa isang talaan.
