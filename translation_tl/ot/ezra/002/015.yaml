lexical_decisions:
- source_word: בְּנֵי
  choice: ang mga anak ni
  rationale: Sa talaan ng mga bumalik sa Ezra, ipinakikilala ng בְּנֵי ang isang pangkat ng pamilya o angkan. Pinananatili ng “mga anak ni” ang anyong genealogical ng Hebreo at natural itong pakinggan sa Filipino.
- source_word: עָדִין
  choice: Adin
  rationale: Pangalan ito ng tao, kaya tinumbasan sa pamamagitan ng transliterasyon sa halip na isalin ang posibleng kahulugan nito.
- source_word: אַרְבַּע מֵאוֹת חֲמִשִּׁים וְאַרְבָּעָה
  choice: '454'
  rationale: Tuwirang bilang itong apat na raan at limampu't apat. Ginamit ang numerong 454 dahil bahagi ito ng mahabang talaan at mas madaling basahin sa makabagong Filipino.
