id: EZR.2.69
reference: Ezra 2:69
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: כְּ/כֹחָ֗/ם נָתְנוּ֮ לְ/אוֹצַ֣ר הַ/מְּלָאכָה֒ זָהָ֗ב דַּרְכְּמוֹנִים֙ שֵׁשׁ רִבֹּ֣אות וָ/אֶ֔לֶף וְ/כֶ֕סֶף מָנִ֖ים חֲמֵ֣שֶׁת אֲלָפִ֑ים וְ/כָתְנֹ֥ת כֹּהֲנִ֖ים מֵאָֽה־ס׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/002/069.yaml
  text: 'According to their ability they gave to the treasury for the work: 61,000 gold darics[a], 5,000 minas of silver[b], and 100 priests’ tunics.'
translation:
  language: tl
  text: 'Ayon sa kanilang kakayahan, nagbigay sila sa kabang-yaman para sa gawain: 61,000 darikong ginto[a], 5,000 mina ng pilak[b], at 100 tunika ng mga pari.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga baryang ginto”; ang salitang Hebreo ay partikular na tumutukoy sa mga dariko ng Persia.
    reason: lexical_alternative
  - marker: b
    text: Ang mina ay isang sinaunang yunit ng timbang at halaga ng salapi.
    reason: cultural_note
lexical_decisions:
- source_word: כְכֹחָם
  choice: Ayon sa kanilang kakayahan
  rationale: Ipinahahayag ng כְ kasama ng כֹּחַ ang pagbibigay na naaayon sa kapasidad; natural ito sa modernong Tagalog at hindi nililimitahan sa pisikal na lakas.
- source_word: נָתְנוּ
  choice: nagbigay sila
  rationale: Tuwirang katumbas ng karaniwang pandiwang נתן at hindi nagdaragdag ng diwa na wala sa pinagmulan.
- source_word: לְאוֹצַר הַמְּלָאכָה
  choice: sa kabang-yaman para sa gawain
  rationale: Pinananatili ang kahulugan ng אוֹצָר bilang imbakan ng kayamanan o pondo, habang ipinakikitang nakalaan ito sa proyekto o gawain.
- source_word: דַּרְכְּמוֹנִים
  choice: darikong ginto
  rationale: Pinananatili ang tiyak na makasaysayang tawag sa gintong baryang Persiano sa halip na gawing pangkalahatang 'mga baryang ginto.'
- source_word: שֵׁשׁ רִבֹּאות וָאֶלֶף
  choice: 61,000
  rationale: Tumpak na bilang para sa literal na 'anim na sampung libo at isang libo,' at madaling basahin sa talaan.
- source_word: מָנִים
  choice: mina
  rationale: Pinananatili ang sinaunang yunit ng timbang at halaga sa halip na palitan ng di-eksaktong modernong yunit.
- source_word: חֲמֵשֶׁת אֲלָפִים
  choice: 5,000
  rationale: Tumpak at malinaw na paglalahad ng bilang.
- source_word: וְכָתְנֹת כֹּהֲנִים
  choice: at 100 tunika ng mga pari
  rationale: Ang כָּתְנֹת ay tumutukoy sa mga tunika o mahabang panloob na kasuotan; pinananatili ng pariralang ito ang posibilidad na ang mga iyon ay pag-aari o para sa mga pari nang hindi pinalalawak sa lahat ng kasuotang makapari.
- source_word: מֵאָה
  choice: '100'
  rationale: Tumpak na bilang at kaayon ng estilong numerikal ng iba pang halaga sa talata.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang 'kabang-yaman' bilang pamilyar ngunit dignified na termino, at pinanatili ang mga makasaysayang yunit na 'dariko' at 'mina' na may maiikling talababa.
