  rationale: Pinananatili nito ang pormulang Hebreo sa talaan ng mga bumalik. Sa konteksto, maaari itong tumukoy sa mga inapo o sa pangkat na kaugnay ng isang angkan o lugar, ngunit ang “mga anak ni” ay likas at sapat na bukas sa Filipino.
- source_word: נְבוֹ
  choice: Nebo
  rationale: Pangngalang pantangi ito, kaya tinumbasan sa pamamagitan ng transliterasyon. Maaaring pangalan ito ng lugar o angkan sa talaang ito.
- source_word: חֲמִשִּׁים וּשְׁנָיִם
