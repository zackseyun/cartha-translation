translation_notes:
  register: Gumamit ng natural, kasalukuyan, at marangal na Filipino. Pinanatili ang maikling anyo ng talaan at ang pormal na “mga anak,” habang inilagay sa talababa ang mas malawak na posibleng kahulugan nito. Inayos ang mga pananda ng talababa upang ang [a] ay tumukoy sa “mga anak” at ang [b] ay tumukoy sa Lod.
