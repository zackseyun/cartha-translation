  text: 'The sons of Lod[a], Hadid[b], and Ono: seven hundred twenty-five.'
translation:
  language: tl
  text: 'Ang mga anak[a] ng Lod[b], Hadid, at Ono: pitong daan at dalawampu’t lima.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Ang mga inapo ng Lod, Hadid, at Ono.” Sa talaang ito ng mga nagbalik, ang “mga anak” ay maaaring tumukoy sa isang mas malawak na angkan o pangkat ng pamayanan, hindi lamang sa tuwirang mga anak na lalaki.
    reason: lexical_alternative
  - marker: b
    text: Ang Lod ay nakilala nang bandang huli bilang Lydda.
    reason: cross_reference
lexical_decisions:
- source_word: בְּנֵי
  choice: Ang mga anak
  rationale: Pinananatili nito ang pormal na larawan ng Hebreong בְּנֵי. Sa ganitong talaan, maaari itong tumukoy hindi lamang sa tuwirang mga anak na lalaki kundi sa mga inapo, angkan, o pangkat na kaugnay ng mga binanggit na lugar; nililinaw ang lawak na ito sa talababa.
- source_word: לֹד
  choice: Lod
  rationale: Pangalan ito ng lugar at tuwirang tinumbasan ayon sa anyong Hebreo; ang Lydda ay mas huling anyo ng pangalan.
- source_word: חָדִיד
  choice: Hadid
  rationale: Pangalan ng lugar; pinanatili sa transliterasyong natural sa Filipino.
- source_word: וְאוֹנוֹ
  choice: at Ono
  rationale: Ang pangatnig na waw ay isinaling “at,” at pinanatili ang pangalan ng lugar bilang Ono.
- source_word: שְׁבַע מֵאוֹת עֶשְׂרִים וַחֲמִשָּׁה
  choice: pitong daan at dalawampu’t lima
  rationale: Natural na makabagong Filipino para sa eksaktong bilang na 725.
