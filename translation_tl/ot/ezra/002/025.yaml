  text: 'The sons of Kiriath-arim[a], Kephirah, and Beeroth: 743.'
translation:
  language: tl
  text: Mga taga-Kiryat-Arim, Kefira, at Beerot[a]—743.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa literal: “Ang mga anak ng Kiryat-Arim, Kefira, at Beerot.”'
    reason: Nililinaw ang pormal na anyo ng בְּנֵי habang ginagamit sa pangunahing teksto ang mas likas na kahulugang tumutukoy sa mga taga-roon.
lexical_decisions:
- source_word: בְּנֵי
  choice: Mga taga-
  rationale: Sa talaang ito, ipinakikilala ng בְּנֵי ang mga taong kaugnay ng mga bayang binanggit. Mas likas at malinaw sa modernong Tagalog ang “mga taga-” kaysa sa literal na “mga anak ng,” lalo na dahil tatlong pook ang kasunod.
- source_word: קִרְיַת עָרִים
  choice: Kiryat-Arim
  rationale: Pangalan ito ng pook, kaya tinumbasan sa paraang malapit sa anyong Hebreo at hindi isinalin ang kahulugan.
- source_word: כְּפִירָה
  choice: Kefira
  rationale: Isinatinig ang pangalang Hebreo ayon sa bigkas nitong may tunog na k at f, gamit ang baybay na madaling basahin sa Filipino.
- source_word: וּבְאֵרוֹת
  choice: at Beerot
  rationale: Hayag na isinalin ang pang-ugnay na וּ bilang “at,” at pinanatili bilang transliterasyon ang pangalan ng pook.
- source_word: שְׁבַע מֵאוֹת וְאַרְבָּעִים וּשְׁלֹשָׁה
  choice: '743'
  rationale: Eksaktong inilalahad ng modernong numerong ito ang bilang at angkop ito sa maikling anyo ng talaan.
