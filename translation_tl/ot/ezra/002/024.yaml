lexical_decisions:
- source_word: בְּנֵי
  choice: Ang mga anak ni
  rationale: Tuwirang pinananatili ang anyong Hebreo, ngunit sa talaang pangangkanan o sensus maaari rin itong tumukoy sa mga inapo o kasapi ng angkan.
- source_word: עַזְמָוֶת
  choice: Azmavet
  rationale: Isinalin sa baybay na madaling bigkasin sa Filipino ang pangalang Hebreo; maaaring tumukoy rito sa ninuno o sa pook na kaugnay ng pangkat.
- source_word: אַרְבָּעִים וּשְׁנָיִם
  choice: apatnapu't dalawa
  rationale: Likas at makabagong anyo sa Filipino ng bilang na apatnapu at dalawa.
