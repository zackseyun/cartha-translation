lexical_decisions:
- source_word: בְּנֵי
  choice: ang mga anak ni
  rationale: Sa talaang ito ng mga angkan, ang בְּנֵי ay tumutukoy sa mga kabilang sa linya o angkan ng isang ninuno. Pinananatili ng “mga anak ni” ang payak at pormal na anyo ng Hebreo at likas din itong maunawaan sa Filipino bilang mga inapo o kaangkan.
- source_word: פַשְׁחוּר
  choice: Pashur
  rationale: Isinalin sa karaniwang anyong Filipino ng pangalan, na malapit sa bigkas ng Hebreong פַשְׁחוּר.
- source_word: אֶלֶף מָאתַיִם אַרְבָּעִים וְשִׁבְעָה
  choice: 1,247
  rationale: Eksaktong bilang itong “isang libo, dalawang daan, apatnapu at pito.” Ang paggamit ng numerong 1,247 ay malinaw at natural sa isang talaan ng populasyon o angkan.
