  register: Maikli at dignified ang pananalita, ayon sa anyo ng talaan. Ginamit ang “mga anak ni” bilang natural na ekspresyong Filipino na maaari ring tumukoy sa mas malawak na angkan, hindi lamang sa tuwirang mga anak.
