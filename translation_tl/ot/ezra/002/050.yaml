  text: the sons of Asnah[a], the sons of Meunim[b], the sons of Nephisim.
translation:
  language: tl
  text: ang mga anak ni Asna, ang mga anak ni Meunim[a], at ang mga anak ni Nefisim.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring baybayin ang Meunim na “Maonim.”
