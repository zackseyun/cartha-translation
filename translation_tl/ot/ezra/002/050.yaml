lexical_decisions:
- source_word: בְּנֵי
  choice: ang mga anak ni
  rationale: Pinananatili nito ang pormal na hulma ng talaangkanan. Sa konteksto, maaaring tumukoy ang “mga anak” sa mga inapo o kasapi ng angkan, hindi lamang sa tuwirang mga anak.
- source_word: אַסְנָה
  choice: Asna
  rationale: Isinalin sa baybay-Filipino ang pangalang pantangi ayon sa anyong Hebreo.
- source_word: מעינים
  choice: Meunim
  rationale: Pangalan ito ng isang pangkat o angkan. Pinanatili ang karaniwang anyong Meunim, habang inilagay sa talababa ang ibang posibleng transliterasyon.
- source_word: נפיסים
  choice: Nefisim
  rationale: Isinalin sa baybay-Filipino ang pangalang pangkat ayon sa Masoretikong anyo; ginagamit ang “f” para sa Hebreong pe na walang dagesh. Nasa talababa ang alternatibong anyo.
