- source_word: אַנְשֵׁי
  choice: ang mga lalaki ng
  rationale: Ang construct plural ng אִישׁ sa talaang ito ay tumutukoy sa mga lalaking kabilang sa o kumakatawan sa isang pamayanan. Pinananatili ng “mga lalaki ng” ang tahasang panlalaking anyo at likas ito sa modernong Tagalog.
- source_word: נְטֹפָה
  choice: Netofa
  rationale: Pangalan ito ng isang lugar, kaya tinumbasan sa karaniwang anyong madaling bigkasin at basahin sa Tagalog.
- source_word: חֲמִשִּׁים וְשִׁשָּׁה
  choice: limampu't anim
  rationale: Likas na modernong Tagalog na pagpapahayag ng bilang na 56; ang pang-ugnay na וְ ay wastong naipapakita ng pinaikling “at” sa “limampu't.”
