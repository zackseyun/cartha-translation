lexical_decisions:
- source_word: בְּנֵי
  choice: ang mga anak ni
  rationale: Sa talaan ng mga bumalik sa Ezra, ipinakikilala ng בְּנֵי ang isang pangkat ng pamilya o angkan. Pinananatili ng “ang mga anak ni” ang tuwirang anyong genealogical ng Hebreo at natural itong nauunawaan sa Filipino bilang mga kabilang sa sambahayan o angkan.
- source_word: זַתּוּא
  choice: Zatu
  rationale: Isinalin ang pangalang Hebreo ayon sa karaniwang baybay at bigkas sa Filipino, na may iisang t sapagkat hindi karaniwang ipinakikita sa baybay-Filipino ang pagdodoble ng katinig sa transliterasyong Zattu.
- source_word: תְּשַׁע מֵאוֹת וְאַרְבָּעִים וַחֲמִשָּׁה
  choice: '945'
  rationale: Ang bilang sa Hebreo ay 900 + 40 + 5. Ang paggamit ng numerong “945” ay malinaw at natural sa isang mahabang talaan, at eksaktong pinananatili ang bilang ng pinagmulang teksto.
