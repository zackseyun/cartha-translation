  text: 'The singers: the sons of Asaph, one hundred twenty-eight.'
translation:
  language: tl
  text: 'Ang mga mang-aawit: ang mga anak ni Asaf, 128.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַמְשֹׁרְרִים
  choice: ang mga mang-aawit
  rationale: Ang participle mula sa שׁיר ay tumutukoy sa mga taong umaawit. Tuwiran at natural ang “mga mang-aawit”; ang “mga musikero” ay masyadong malawak, at ang “mga mang-aawit sa templo” ay nagdaragdag ng detalyeng hindi tahasang nasa talata.
- source_word: בְּנֵי
  choice: ang mga anak ni
  rationale: Sa talaan ng angkan o pangkat, maaaring tumukoy ang בְּנֵי sa mga anak o mga kabilang sa linyang nagmula sa isang ninuno. Pinananatili ng “mga anak ni” ang pormal na anyo ng Hebreo at karaniwan itong nauunawaan sa ganitong talaan bilang pangkat ng angkan.
- source_word: אָסָף
  choice: Asaf
  rationale: Ginamit ang karaniwang anyong Tagalog ng pangalang Hebreo.
- source_word: מֵאָה עֶשְׂרִים וּשְׁמֹנָה
  choice: '128'
  rationale: Ang bilang sa Hebreo ay 100 + 20 + 8. Ang pagsulat sa numero ay malinaw at angkop sa maikling talaang sensus.
theological_decisions: []
translation_notes:
  register: Maikli at dignified ang estilo upang tularan ang anyo ng talaan. Ginamit ang likas na modernong Filipino na “mang-aawit” at pinanatili ang genealogical na “mga anak ni” nang hindi dinaragdagan ng paliwanag sa mismong teksto.
