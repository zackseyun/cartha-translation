    text: Literal na, “na nasa kanilang mga ulo,” isang idyomang tumutukoy sa mga nangunguna sa kanila.
    reason: lexical_alternative
  revision_rationale: 'Inayos ang sintaks upang maging likas na modernong Filipino at upang malinaw na maipahayag ang dalawang layuning kaugnay ng pagtatanong: ang pagpapaalam sa kausap at ang pagtatala ng mga pangalan. Pinanatili ang diwa ng idyoma tungkol sa mga lalaking nangunguna, at inayos ang talang-paanan para sa mas tumpak na anyo at paliwanag.'
