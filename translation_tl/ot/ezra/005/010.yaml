revisions:
- from: Tinanong din namin sila tungkol sa kanilang mga pangalan upang maipaalam namin sa iyo ang mga ito, at nang maisulat namin ang mga pangalan ng mga lalaking namumuno sa kanila.[a]
  to: Tinanong din namin sa kanila ang kanilang mga pangalan upang maipaalam namin sa iyo ang mga ito at maisulat namin ang mga pangalan ng mga lalaking namumuno sa kanila.[a]
  rationale: 'Inayos ang sintaks upang maging likas na modernong Filipino at upang malinaw na maipahayag ang dalawang layuning kaugnay ng pagtatanong: ang pagpapaalam sa kausap at ang pagtatala ng mga pangalan. Pinanatili ang diwa ng idyoma tungkol sa mga lalaking nangunguna, at inayos ang talang-paanan para sa mas tumpak na anyo at paliwanag.'
