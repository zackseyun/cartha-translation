translation:
  language: tl
  text: Tinanong din namin sa kanila ang kanilang mga pangalan upang maipaalam namin sa iyo ang mga ito at maisulat namin ang mga pangalan ng mga lalaking namumuno sa kanila.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal na, “na nasa kanilang mga ulo,” isang idyomang tumutukoy sa mga nangunguna sa kanila.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַף
  choice: Tinanong din namin
  rationale: Ang וְאַף ay nagdaragdag ng isa pang ginawa ng mga opisyal sa kanilang ulat; likas sa Filipino ang paglalagay ng “din” kasunod ng pandiwa.
- source_word: שְׁמָהָתְהֹם
  choice: kanilang mga pangalan
  rationale: Tuwirang ipinahahayag ang maramihang pangngalan na may hulaping tumutukoy sa ikatlong panauhang maramihan.
- source_word: שְׁאֵלְנָא לְּהֹם
  choice: Tinanong ... namin sila tungkol sa
  rationale: Ang pandiwa ay nangangahulugang magtanong o magsiyasat; kailangan sa natural na Filipino ang “tungkol sa” bago ang bagay na itinatanong.
- source_word: לְהוֹדָעוּתָךְ
  choice: upang maipaalam namin sa iyo ang mga ito
  rationale: Pinananatili nito ang layunin at ang causative na diwa ng ידע, habang malinaw na ang “mga ito” ay ang kanilang mga pangalan.
- source_word: דִּי נִכְתֻּב
  choice: at nang maisulat namin
  rationale: Ipinahahayag ang kasunod na layunin ng pagtatanong at ang dokumentaryong kilos ng pagsulat; ang “at” ay nilinaw ang koordinasyon ng magkakaugnay na layunin sa natural na Filipino.
- source_word: שֻׁם גֻּבְרַיָּא
  choice: ang mga pangalan ng mga lalaki
  rationale: Bagaman anyong isahan ang שֻׁם, kolektibo ang gamit nito rito dahil maramihan ang tinutukoy na mga lalaki.
- source_word: דִּי בְרָאשֵׁיהֹם
  choice: namumuno sa kanila
  rationale: Likas na salin ito ng idyomang literal na “nasa kanilang ulo,” na tumutukoy sa mga lalaking nangunguna sa pangkat.
