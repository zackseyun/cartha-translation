translation_notes:
  register: Makabagong Filipino na malinaw at marangal. Ginamit ang “maipaalam” at “maisulat” upang mapanatili ang layunin ng mga opisyal, at isinalin nang idyomatiko ang larawang “nasa kanilang ulo.”
