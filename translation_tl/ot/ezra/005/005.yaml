base_translation:
  language: en
  yaml_path: translation/ot/ezra/005/005.yaml
  text: But the eye of their God was on the elders of the Jews[a], and they did not make them stop until a decree should go to Darius[c][b]; then they would send back a letter concerning this matter.
translation:
  language: tl
  text: Ngunit ang mata ng kanilang Diyos ay nasa mga nakatatanda ng mga Judio[a], at hindi sila pinatigil hanggang sa makarating kay Dario ang isang pasiya[b]; pagkatapos ay magpapadala sila pabalik ng isang liham tungkol dito.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ay nagbabantay sa mga nakatatanda ng mga Judio.”
    reason: lexical_alternative
  - marker: b
    text: O “isang utos” o “isang dekreto.”
    reason: lexical_alternative
  - marker: c
    text: O “pagkatapos ay magpapadala sila ng tugon sa pamamagitan ng liham tungkol dito.” Ang pandiwa ay maaaring mangahulugang magbalik o magpadala pabalik; hindi tahasang pinangalanan ang tinutukoy ng “sila.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעֵין אֱלָהֲהֹם הֲוָת עַל
  choice: Ngunit ang mata ng kanilang Diyos ay nakatuon sa
  rationale: Pinananatili ang tahasang metaporang “mata” at ang hulaping “kanilang,” habang likas na ipinahahayag sa Filipino ang mapagmatyag na pagkalinga. Ang “Ngunit” ay nagpapakita ng kaibahan sa banta ng mga opisyal sa naunang konteksto.
- source_word: שָׂבֵי יְהוּדָיֵא
  choice: matatandang pinuno ng mga Judio
  rationale: Ang שָׂבֵי ay tumutukoy sa mga elder na may tungkuling mamuno; ang “matatandang pinuno” ay mas malinaw sa modernong Filipino kaysa sa “matatanda” lamang.
- source_word: וְלָא בַטִּלוּ הִמּוֹ
  choice: kaya hindi sila pinatigil
  rationale: Ipinahahayag ng pasibong anyo ang causative na diwa ng Pael, nang hindi kailangang ulitin o tahasang pangalanan ang mga opisyal bilang simuno.
- source_word: עַד טַעְמָא לְדָרְיָוֶשׁ יְהָךְ
  choice: hanggang makarating kay Dario ang ulat tungkol sa usapin
  rationale: Sa kontekstong administratibo, ang טַעְמָא ay ang usapin o opisyal na ulat na ihaharap sa hari. Ang “ulat tungkol sa usapin” ay umaangkop sa kilos na “makarating kay Dario” at iniiwasan ang di-likas na larawan ng isang utos na ipinadadala sa hari.
- source_word: וֶאֱדַיִן יְתִיבוּן נִשְׁתְּוָנָא עַל דְּנָה
  choice: at maibalik ang isang nakasulat na sagot tungkol dito
  rationale: Ang pandiwa ay may diwang pagbabalik o pagpapabalik, at ang נִשְׁתְּוָנָא ay isang opisyal na kasulatan. Sa konteksto, natural itong tumutukoy sa nakasulat na tugon hinggil sa usapin.
theological_decisions:
- issue: Antropomorpikong paglalarawan sa pagbabantay ng Diyos
  choice: Pinanatili ang “ang mata ng kanilang Diyos ay nakatuon sa” sa pangunahing teksto.
  alternative: “binabantayan sila ng kanilang Diyos”
  rationale: Ang konkretong larawan ng “mata” ay bahagi ng lakas-panitikan ng teksto at nagpapahiwatig ng mapag-ingat na pagbabantay nang hindi nagdaragdag ng sistematikong paliwanag tungkol sa providencia.
- issue: Ugnayan ng pagbabantay ng Diyos at hindi pagpapatigil sa gawain
  choice: Ginamit ang “kaya” upang ipakita ang ugnayang kontekstuwal.
  alternative: “at”
  rationale: Bagaman וְ ay karaniwang pang-ugnay, ipinakikita ng daloy na ang pagbabantay ng Diyos ang kontekstuwal na dahilan kung bakit hindi agad napahinto ang mga pinuno; hindi nito tinutukoy ang eksaktong paraan ng pagkilos ng Diyos.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Pinanatili ang metaporang “mata,” ngunit gumamit ng karaniwang administratibong mga salitang “ulat,” “usapin,” at “nakasulat na sagot.” Ang lahat ng panandang talababa [a]–[c] ay nasa pangunahing teksto.
