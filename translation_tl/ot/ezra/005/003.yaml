  to: Nang panahong iyon, dumating sa kanila si Tatenai, ang gobernador ng Kabila ng Ilog[b], si Setar-bozenai, at ang kanilang mga kasamahan. Sinabi nila sa kanila, “Sino ang nagbigay sa inyo ng utos[a] na itayo ang bahay na ito at tapusin ang gusaling ito[c]?”
