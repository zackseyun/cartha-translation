  text: בֵּ/הּ זִמְנָ/א֩ אֲתָ֨א עֲלֵי/ה֜וֹן תַּ֠תְּנַי פַּחַ֧ת עֲבַֽר נַהֲרָ֛/ה וּ/שְׁתַ֥ר בּוֹזְנַ֖י וּ/כְנָוָתְ/ה֑וֹן וְ/כֵן֙ אָמְרִ֣ין לְ/הֹ֔ם מַן שָׂ֨ם לְ/כֹ֜ם טְעֵ֗ם בַּיְתָ֤/א דְנָה֙ לִ/בְּנֵ֔א וְ/אֻשַּׁרְנָ֥/א דְנָ֖ה לְ/שַׁכְלָלָֽה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/005/003.yaml
  text: 'At that time Tattenai[a], the governor of Beyond the River[c][b], and Shethar-bozenai and their associates came to them and spoke thus to them: “Who gave you a decree to build this house and to complete this structure?”'
translation:
  language: tl
  text: Nang panahong iyon, dumating sa kanila si Tatenai, ang gobernador ng Kabila ng Ilog[b], si Setar-bozenai, at ang kanilang mga kasamahan. Sinabi nila sa kanila, “Sino ang nagbigay sa inyo ng utos[a] na itayo ang bahay na ito at tapusin ang gusaling ito[c]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “kautusan” o “opisyal na pasiya.” Ang salitang Aramaic na טְעֵם ay maaaring tumukoy sa isang opisyal na utos o atas.
    reason: lexical_alternative
  - marker: b
    text: Ang “Kabila ng Ilog” ang tawag ng pamahalaang Persia sa rehiyon sa kanluran ng Ilog Eufrates.
    reason: cultural_note
  - marker: c
    text: Maaaring mas tiyak na tumukoy ang salitang isinaling “gusali” sa gawaing pagtatayo ng templo; inuunawa rin ito ng ilan bilang “pader” o “balangkas.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּהּ זִמְנָא
  choice: Nang panahong iyon
  rationale: Likas na salin ng panandang temporal sa Aramaic at malinaw na nagtatakda ng tagpo sa salaysay.
- source_word: אֲתָא עֲלֵיהוֹן
  choice: pumunta sa kanila
  rationale: Tuwirang ipinahahayag ang paglapit ng mga opisyal sa mga tagapagtayo nang hindi dinaragdagan ang diwa.
- source_word: תַּתְּנַי
  choice: Tatenai
  rationale: Transliterasyon ng pangalang pantangi na angkop sa baybay at bigkas sa Filipino.
- source_word: פַּחַת עֲבַר נַהֲרָה
  choice: ang gobernador ng Kabila ng Ilog
  rationale: Ang פַּחַת ay isang gobernador ng lalawigan, at ang עֲבַר נַהֲרָה ay opisyal na tawag ng Persia sa rehiyon sa kanluran ng Eufrates. Pinananatili ng malaking titik ang gamit nito bilang pangalang panrehiyon.
- source_word: וּשְׁתַר בּוֹזְנַי
  choice: kasama si Setar-bozenai
  rationale: Transliterasyon ng pangalang pantangi; ipinakikita ng “kasama” ang pagkakaugnay nito sa naunang tauhan sa pangungusap.
- source_word: וּכְנָוָתְהוֹן
  choice: at ang kanilang mga kasamahan
  rationale: Malawak at natural na salin para sa mga taong kaugnay o kapanig ng dalawang opisyal.
- source_word: וְכֵן אָמְרִין לְהֹם
  choice: Sinabi nila sa mga ito
  rationale: Natural na panimula sa tuwirang pananalita sa modernong Filipino, nang hindi pinananatili ang alanganing literal na “ganito.”
- source_word: מַן שָׂם לְכֹם טְעֵם
  choice: Sino ang nagbigay sa inyo ng utos
  rationale: Sa Imperial Aramaic, ang טְעֵם ay maaaring tumukoy sa opisyal na utos o kautusan. Ang “nagbigay ... ng utos” ay natural sa Filipino at ipinahihiwatig ang awtorisadong pasiya.
- source_word: בַּיְתָא דְנָה לִבְנֵא
  choice: na itayo ang bahay na ito
  rationale: Pinananatili ng “bahay” ang mismong salita sa Aramaic at ang pagtukoy nito sa templo sa konteksto, nang hindi ipinapasok sa pandiwa ang mas tiyak na “muling itayo.”
- source_word: וְאֻשַּׁרְנָא דְנָה
  choice: ang gusaling ito
  rationale: Malawak na salin para sa hindi ganap na tiyak na pangngalang tumutukoy sa itinayong bahagi o kayarian, nang hindi ito nililimitahan sa “pader” o “balangkas.”
- source_word: לְשַׁכְלָלָה
  choice: tapusin
  rationale: Karaniwan at malinaw na pandiwang Filipino para sa pagdadala ng isang gawa sa ganap na pagkakatapos.
theological_decisions:
- issue: Pagkilala sa בַּיְתָא bilang templo
  choice: bahay na ito
  alternative: templong ito
  rationale: Pinananatili ang leksikal na anyong “bahay” at hinahayaang ang konteksto ang magpakilalang templo ang tinutukoy, sa halip na tahasang lutasin iyon sa salin.
- issue: Saklaw ng אֻשַּׁרְנָא
  choice: gusaling ito
  alternative: pader na ito / balangkas na ito
  rationale: Hindi tiyak ang eksaktong sangkap ng pagtatayo na tinutukoy; pinananatili ng mas malawak na “gusali” ang tunay na kalabuan ng teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang payak na ayos ng salaysay at natural na tuwirang tanong. Pinanatili ang “bahay” para sa templo at ang malawak na “gusali” upang hindi ikubli ang leksikal na kalabuan ng Aramaic.
