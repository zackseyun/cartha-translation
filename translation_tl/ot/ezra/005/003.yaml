  source_fidelity: Tumpak na naihahatid ng salin ang tagpong pagdating ng mga opisyal, ang titulong panlalawigan ni Tatenai, ang mga kasamahan nila, at ang tanong tungkol sa awtorisadong utos na magtayo at magtapos ng gawaing pagtatayo. Ang “bahay” at “gusali” ay maingat na pinananatili ang saklaw at kalabuan ng Aramaic.
  naturalness: May bahagyang di-likas at posibleng malabong pagtukoy sa paksa sa “pumunta sa kanila si Tatenai ... kasama si Setar-bozenai at ang kanilang mga kasamahan,” sapagkat ang orihinal ay naglilista ng magkakaugnay na maramihang paksa. Ang “Sinabi nila sa mga ito” ay mas deiktiko at hindi gaanong natural kaysa “sinabi sa kanila.”
