  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/הִתְנַבִּ֞י חַגַּ֣י נביא/ה וּ/זְכַרְיָ֤ה בַר עִדּוֹא֙ נביאי/א עַל יְה֣וּדָיֵ֔/א דִּ֥י בִ/יה֖וּד וּ/בִ/ירוּשְׁלֶ֑ם בְּ/שֻׁ֛ם אֱלָ֥הּ יִשְׂרָאֵ֖ל עֲלֵי/הֽוֹן־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/005/001.yaml
  text: Haggai the prophet and Zechariah son of Iddo[a], the prophets, prophesied to the Jews who were in Judah and in Jerusalem[b], in the name of the God of Israel who was over them.
translation:
  language: tl
  text: Nagpropesiya sina Hagai na propeta at Zacarias na anak ni Iddo—ang mga propeta—sa mga Judio[a] na nasa Juda at Jerusalem, sa pangalan[b] ng Diyos ng Israel na namamahala sa kanila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “mga taga-Juda.” Ang salitang Aramaiko ay maaaring tumukoy sa mga Judio bilang isang bayan o, sa mas heograpikong diwa, sa mga taga-Juda.
    reason: lexical_alternative
  - marker: b
    text: O, “sa awtoridad ng Diyos ng Israel.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִתְנַבִּי
  choice: Nagpropesiya
  rationale: Ang Peal perfect ng נבא ang pangunahing kilos sa salaysay. Hindi dinagdagan ng “ngayon” sapagkat walang tahasang salitang panahunan na katumbas nito sa pinagmulan.
- source_word: חַגַּי נביאה
  choice: Hagai na propeta
  rationale: Pinanatili ang pangalan ayon sa karaniwang anyong Filipino at isinalin ang determined apposition bilang “na propeta.”
- source_word: וּזְכַרְיָה בַר עִדּוֹא
  choice: at Zacarias na anak ni Iddo
  rationale: Ang בַר ay tuwirang nangangahulugang “anak ni.” Ginamit ang karaniwang Filipino na anyo ng Zacarias at pinanatili ang Iddo bilang pangalan.
- source_word: נביאיא
  choice: ang mga propeta
  rationale: Pinanatili ang maramihang apposition na tumutukoy kina Hagai at Zacarias, kahit tila inuulit nito ang naunang paglalarawan.
- source_word: עַל יְהוּדָיֵא
  choice: sa mga Judio
  rationale: Sa kasamang pandiwang “magpropesiya,” ang עַל ay tumutukoy sa mga taong pinatutungkulan. Maaaring mangahulugan ang יְהוּדָיֵא ng mga Judio o mga taga-Juda; pinili ang mas pamilyar na “mga Judio” at inilagay sa talababa ang heograpikong alternatibo.
- source_word: דִּי בִיהוּד וּבִירוּשְׁלֶם
  choice: na nasa Juda at Jerusalem
  rationale: Ang דִּי ay nagpapakilala ng sugnay na naglalarawan sa mga Judio; ang Juda ay angkop sa kontekstong panlalawigan at panteritoryo pagkatapos ng pagkabihag.
- source_word: בְּשֻׁם
  choice: sa pangalan
  rationale: Karaniwang idyoma ito para sa pagsasalita bilang kinatawan at sa ilalim ng awtoridad ng Diyos. Pinanatili ang pormal na “sa pangalan,” habang nililinaw sa talababa ang diwang awtoridad.
- source_word: אֱלָהּ יִשְׂרָאֵל
  choice: Diyos ng Israel
  rationale: Tuwirang salin ng construct chain, na tiyak ang kahulugan sa konteksto.
- source_word: עֲלֵיהוֹן
  choice: na namamahala sa kanila
  rationale: Ang panghalip ay pinakamalamang na tumutukoy pabalik sa mga Judio, at ang parirala ay naglalarawan sa Diyos bilang nasa ibabaw nila sa diwa ng pamamahala o awtoridad. Ang “namamahala” ay mas natural sa modernong Filipino kaysa sa literal na “nasa ibabaw.”
theological_decisions:
- issue: Ang tinutukoy at diwa ng pangwakas na עֲלֵיהוֹן
  choice: Iniugnay ito sa “Diyos ng Israel” at isinaling “na namamahala sa kanila,” na nagpapahayag ng banal na pamamahala o awtoridad sa mga Judio.
  alternative: Maaari itong panatilihing mas literal bilang “na nasa ibabaw nila,” o unawain bilang pagbibigay-diin sa presensiya ng Diyos sa kanila.
  rationale: Pinakamalinaw sa sintaks na inilalarawan ng parirala ang Diyos ng Israel. Iniiwasan ng “namamahala” ang pisikal na dating ng “nasa ibabaw” nang hindi nililimitahan ang parirala sa pangangalaga lamang.
translation_notes:
  register: Modernong Filipino na natural ngunit marangal. Pinanatili ang inuulit na katawagang “ang mga propeta” dahil nasa tekstong Aramaiko ito. Ginamit ang gitling-pahaba upang malinaw na maipakita ang apposition nang hindi nagiging mabigat ang pangungusap.
