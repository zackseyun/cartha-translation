base_translation:
  language: en
  yaml_path: translation/ot/ezra/005/008.yaml
  text: Let it be known to the king that we went to the province of Judah[a], to the house of the great God. It is being built with great stones, and timber is being laid in the walls[b]. This work is being done diligently and is prospering in their hands.
translation:
  language: tl
  text: Ipaalam sa hari na pumunta kami sa lalawigan ng Juda, sa bahay ng dakilang Diyos. Itinatayo ito gamit ang malalaking bato[a], at inilalagay ang kahoy sa mga pader. Ang gawaing ito ay masigasig na isinasagawa at matagumpay na umuunlad sa kanilang mga kamay[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga napakalaking bato.” Ang pariralang Aramaic ay maaaring tumukoy sa pangkalahatan sa napakalalaking batong ginagamit sa pagtatayo.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “maingat” o posibleng “mabilis” para sa “masigasig.” Pinagtatalunan ang eksaktong diwa ng pang-abay, ngunit malinaw na inilalarawan nito ang mabisang pagpapatuloy ng gawain.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְדִיעַ לֶהֱוֵא
  choice: Ipinababatid
  rationale: Pinananatili nito ang pormal na pormula ng isang ulat na pang-administratibo at natural ito sa makabagong Filipino.
- source_word: לִיהוּד מְדִינְתָּא
  choice: sa lalawigan ng Juda
  rationale: Ang מְדִינְתָּא ay isang lalawigang administratibo sa ilalim ng imperyo; malinaw at angkop sa kasaysayan ang salin.
- source_word: לְבֵית אֱלָהָא רַבָּא
  choice: sa bahay ng dakilang Diyos
  rationale: Tuwirang pinananatili ang larawang 'bahay,' bagaman ang tinutukoy ay ang templo, pati ang mapitagang paglalarawan sa Diyos bilang dakila.
- source_word: אֶבֶן גְּלָל
  choice: malalaking bato
  rationale: Tumutukoy ang parirala sa malalaki o mabibigat na batong ginagamit sa pagtatayo; iniiwasan ang sobrang literal ngunit mapanlinlang na 'mga ginulong bato.'
- source_word: וְאָע
  choice: mga troso
  rationale: Sa konteksto ng pagtatayo, mas tiyak at natural ang 'mga troso' kaysa sa pangkalahatang 'kahoy.'
- source_word: מִתְּשָׂם בְּכֻתְלַיָּא
  choice: naglalagay ... sa mga pader
  rationale: Malinaw na inilalarawan ang patuloy na paglalagay ng troso sa kayarian ng mga pader nang hindi pinipilit ang isang tiyak na teknikal na paraan ng pagkakabit.
- source_word: אָסְפַּרְנָא
  choice: masikap
  rationale: Ipinahihiwatig ng pinagtatalunang pang-abay ang mahusay at masigasig na pagsasagawa; hindi nito ipinapalagay na bilis lamang ang diin.
- source_word: וּמַצְלַח בְּיֶדְהֹם
  choice: matagumpay na sumusulong sa kanilang mga kamay
  rationale: Pinananatili ang ideya ng patuloy na tagumpay ng gawain at ang idyomatikong pagtukoy sa mga kamay ng mga gumagawa, nang hindi tahasang pinapalitan ito ng 'pamamahala.'
