translation_notes:
  register: Pormal at marangal ang himig upang tumugma sa opisyal na ulat, ngunit gumagamit ng pangkaraniwan at makabagong Filipino. Pinanatili ang 'bahay' sa halip na ipaliwanag agad bilang 'templo,' at ang larawang 'sa kanilang mga kamay' upang hindi alisin ang anyo at posibleng diin ng Aramaic.
