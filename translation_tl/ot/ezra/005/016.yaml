base_translation:
  language: en
  yaml_path: translation/ot/ezra/005/016.yaml
  text: Then this Sheshbazzar came and laid the foundations of the house of God that is in Jerusalem[a]; and from then until now it has been being built[b], but it is not finished.
translation:
  language: tl
  text: Pagkatapos, dumating ang Sheshbazar na ito at inilagay ang mga pundasyon ng bahay ng Diyos na nasa Jerusalem.[a] Mula noon hanggang ngayon ay patuloy itong itinatayo,[b] ngunit hindi pa ito tapos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O, sa mas pormal na pananalita, “itinatag ang mga pundasyon.” Literal sa Aramaico: “ibinigay ang mga pundasyon.”'
    reason: lexical_alternative
  - marker: b
    text: O “ito ay itinatayo.” Maaaring ipahayag ng pandiwang Aramaico ang isang nagpapatuloy na prosesong balintiyak.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱדַיִן
  choice: Pagkatapos
  rationale: Minamarkahan nito ang kasunod na pangyayari sa salaysay; natural at malinaw ang “Pagkatapos” sa modernong Filipino.
- source_word: שֵׁשְׁבַּצַּר דֵּךְ
  choice: ang Sheshbazar na ito
  rationale: Isinasalin ang pangalang pantangi at pinananatili ang demonstratibong tumutukoy sa taong kababanggit lamang.
- source_word: אֲתָא
  choice: dumating
  rationale: Tuwirang salin ng pandiwang nagsasaad ng pagdating sa lugar.
- source_word: יְהַב אֻשַּׁיָּא
  choice: inilagay ang mga pundasyon
  rationale: Ang idyoma ay literal na “nagbigay ng mga pundasyon,” ngunit ang natural na katumbas sa Filipino para sa gawaing pagtatayo ay “inilagay ang mga pundasyon.”
- source_word: בֵית אֱלָהָא
  choice: bahay ng Diyos
  rationale: Pinananatili ang tahasang katawagang Aramaico sa halip na gawing mas interpretatibong “templo ng Diyos.”
- source_word: דִּי בִירוּשְׁלֶם
  choice: na nasa Jerusalem
  rationale: Natural na lokatibong sugnay sa Filipino na tapat sa kaugnay na parirala.
- source_word: וּמִן אֱדַיִן וְעַד כְּעַן
  choice: Mula noon hanggang ngayon
  rationale: Malinaw na ipinahahayag ang panahong nagsimula sa paglalagay ng pundasyon at umaabot sa kasalukuyan ng nagsasalita.
- source_word: מִתְבְּנֵא
  choice: patuloy itong itinatayo
  rationale: Pinananatili ang tinig na balintiyak at ang nagpapatuloy na proseso sa konteksto.
- source_word: וְלָא שְׁלִם
  choice: ngunit hindi pa ito natatapos
  rationale: Ipinahahayag ang hindi pa pagkakumpleto hanggang sa kasalukuyang punto; ang “pa” ay likas sa Filipino para sa aspektong ito.
