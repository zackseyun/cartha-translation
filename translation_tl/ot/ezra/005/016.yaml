translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “bahay ng Diyos” upang panatilihin ang anyo ng pinagmulan, at “patuloy itong itinatayo” upang maipakita ang duratibo at balintiyak na diwa nang hindi nagiging asiwa sa Filipino.
