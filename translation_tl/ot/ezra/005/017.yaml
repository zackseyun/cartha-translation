  text: וּ/כְעַ֞ן הֵ֧ן עַל מַלְכָּ֣/א טָ֗ב יִ֠תְבַּקַּר בְּ/בֵ֨ית גִּנְזַיָּ֜/א דִּי מַלְכָּ֣/א תַמָּה֮ דִּ֣י בְּ/בָבֶל֒ הֵ֣ן אִיתַ֗י דִּֽי מִן כּ֤וֹרֶשׁ מַלְכָּ/א֙ שִׂ֣ים טְעֵ֔ם לְ/מִבְנֵ֛א בֵּית אֱלָהָ֥/א דֵ֖ךְ בִּ/ירוּשְׁלֶ֑ם וּ/רְע֥וּת מַלְכָּ֛/א עַל דְּנָ֖ה יִשְׁלַ֥ח עֲלֶֽי/נָא־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/005/017.yaml
  text: And now[a], if it seems good to the king, let a search be made in the royal treasury there in Babylon, whether it is so that a decree was issued by King Cyrus to rebuild this house of God in Jerusalem[b]; and let the king send to us his pleasure concerning this matter.
translation:
  language: tl
  text: Kaya ngayon, kung mamarapatin ng hari, ipasaliksik sa imbakan ng mga kayamanan ng hari doon sa Babilonia kung totoong nagpalabas si Haring Ciro ng isang utos na muling itayo[a] ang bahay na ito ng Diyos sa Jerusalem. At ipagbigay-alam sa amin ng hari ang kaniyang pasiya tungkol sa bagay na ito.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “itayo.” Ang pandiwang Aramaiko ay literal na tumutukoy sa pagtatayo; ipinahihiwatig ng konteksto ang muling pagtatayo.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “at ipadala sa amin ng hari ang kaniyang kalooban tungkol dito.”
    reason: translation_clarity
lexical_decisions:
- source_word: וּכְעַן
  choice: Kaya ngayon
  rationale: Pinananatili ang pang-ugnay at pangwakas na puwersa ng Aramaikong panandang pandiskurso sa natural na Filipino.
- source_word: הֵן עַל מַלְכָּא טָב
  choice: kung mamarapatin ng hari
  rationale: Magalang na pananalita sa korte na natural at marangal sa modernong Filipino.
- source_word: יִתְבַּקַּר
  choice: ipasaliksik
  rationale: Ipinapahayag ang diwang pasibo/jusibo ng utos na magsagawa ng paghahanap sa mga opisyal na talaan.
- source_word: בְּבֵית גִּנְזַיָּא
  choice: sa imbakan ng mga kayamanan ng hari
  rationale: Malapit sa literal na 'bahay ng mga kayamanan' at hindi lubusang ipinagpapalagay na purong arkibo lamang ang tinutukoy.
- source_word: הֵן אִיתַי דִּי
  choice: kung totoong
  rationale: Likas na Filipino para sa pagsisiyasat kung umiiral nga o tunay na naipalabas ang nasabing utos.
- source_word: מִן כּוֹרֶשׁ מַלְכָּא שִׂים טְעֵם
  choice: nagpalabas si Haring Ciro ng isang utos
  rationale: Ang טְעֵם ay opisyal na kautusan o pasiya; malinaw sa Filipino ang aktibong pormulasyon habang nananatili ang diin sa opisyal na utos.
- source_word: לְמִבְנֵא
  choice: muling itayo
  rationale: Literal na 'itayo,' ngunit ipinahihiwatig ng konteksto ang pagpapanumbalik matapos ang pagkawasak; inilalahad sa talababa ang mas literal na alternatibo.
- source_word: בֵּית אֱלָהָא דֵךְ
  choice: ang bahay na ito ng Diyos
  rationale: Pinananatili ang literal na larawang 'bahay ng Diyos' at ang demonstratibong 'ito,' sa halip na agad gawing 'templo.'
- source_word: וּרְעוּת מַלְכָּא
  choice: ang kaniyang pasiya
  rationale: Sa kontekstong administratibo, natural na tumutukoy sa kalooban o opisyal na pasiya ng hari; iniiwasan ang di-likas na literal na 'kaluguran.'
- source_word: יִשְׁלַח עֲלֵינָא
  choice: ipagbigay-alam sa amin ng hari
  rationale: Ipinahahayag nang natural sa Filipino ang pagpapadala ng pasiya o sagot, na siyang ipinahihiwatig na layon ng pandiwa.
theological_decisions: []
translation_notes:
  register: Makabago ngunit marangal na Filipino, na may magalang na himig ng isang opisyal na liham sa hari. Ginamit ang “Ciro,” ang karaniwang anyong Filipino ng Cyrus. Inilagay ang [b] sa hulihan ng pangungusap sapagkat tumutukoy ito sa buong pariralang nagsasaad ng pasiya at pagpapadala nito.
