  source_fidelity: 'Tapat ang salin sa Aramaiko: naipapahayag ang pandagdag na pang-ugnay, ang mga kagamitang ginto at pilak ng bahay ng Diyos, ang pagkuha ni Nebucadnezar mula sa templo sa Jerusalem at pagdadala sa Babilonia, at ang muling pagkuha at pagbibigay ni Ciro kay Sesbazar. Ang panumbalik na “ang mga iyon” ay angkop na kumakatawan sa muling pagtukoy sa mga kagamitan.'
