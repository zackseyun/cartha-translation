  text: וְ֠/אַף מָאנַיָּ֣/א דִֽי בֵית אֱלָהָ/א֮ דִּ֣י דַהֲבָ֣/ה וְ/כַסְפָּ/א֒ דִּ֣י נְבוּכַדְנֶצַּ֗ר הַנְפֵּק֙ מִן הֵֽיכְלָ/א֙ דִּ֣י בִֽ/ירוּשְׁלֶ֔ם וְ/הֵיבֵ֣ל הִמּ֔וֹ לְ/הֵיכְלָ֖/א דִּ֣י בָבֶ֑ל הַנְפֵּ֨ק הִמּ֜וֹ כּ֣וֹרֶשׁ מַלְכָּ֗/א מִן הֵֽיכְלָ/א֙ דִּ֣י בָבֶ֔ל וִ/יהִ֨יבוּ֙ לְ/שֵׁשְׁבַּצַּ֣ר שְׁמֵ֔/הּ דִּ֥י פֶחָ֖ה שָׂמֵֽ/הּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/005/014.yaml
  text: Also[a], the gold and silver vessels of the house of God, which Nebuchadnezzar had taken out from the temple that was in Jerusalem and brought them to the temple of Babylon—Cyrus the king took them out from the temple of Babylon and gave them to one named Sheshbazzar, whom he had appointed governor.
translation:
  language: tl
  text: Bukod dito, ang mga kagamitang ginto at pilak ng bahay ng Diyos, na inilabas ni Nebucadnezar mula sa templong nasa Jerusalem at dinala sa templo sa Babilonia—ang mga iyon ay inilabas ni Haring Ciro mula sa templo sa Babilonia at ibinigay sa isang nagngangalang Sesbazar[a], na itinalaga niyang gobernador.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa mas literal na anyo: “at ibinigay ang mga iyon kay Sesbazar—iyon ang pangalan niya—na ginawa niyang gobernador.”'
    reason: Pinananatili sa talababa ang mas pormal na anyo ng Aramaikong pormula ng pagpapangalan at pagtatalaga.
lexical_decisions:
- source_word: וְאַף
  choice: Bukod dito
  rationale: Ipinahahayag ang pandagdag na diwa ng Aramaikong pang-ugnay sa natural at marangal na Filipino.
- source_word: מָאנַיָּא
  choice: mga kagamitan
  rationale: Tumutukoy sa mga bagay o kasangkapang ginagamit sa templo; mas malawak at mas natural ito kaysa sa “mga sisidlan.”
- source_word: בֵית אֱלָהָא
  choice: bahay ng Diyos
  rationale: Pinananatili ang literal na “bahay ng Diyos” at ang pagkakaiba nito sa הֵיכְלָא, na isinaling “templo.”
- source_word: דִּי דַהֲבָה וְכַסְפָּא
  choice: ginto at pilak
  rationale: Inilalarawan ang materyales ng mga kagamitan sa natural na ayos ng Filipino.
- source_word: הַנְפֵּק
  choice: inilabas
  rationale: Tumpak na inilalarawan ang pagkuha o paglalabas mula sa templo nang hindi nagdaragdag ng diwang wala sa pandiwa.
- source_word: הֵיכְלָא
  choice: templo
  rationale: Sa kontekstong ito, tumutukoy sa templong nasa Jerusalem at sa templong nasa Babilonia.
- source_word: וְהֵיבֵל הִמּוֹ
  choice: at dinala
  rationale: Natural na salin ng pandiwa; malinaw mula sa naunang sugnay na ang mga kagamitan ang dinala.
- source_word: כּוֹרֶשׁ מַלְכָּא
  choice: Haring Ciro
  rationale: Karaniwan at natural na ayos ng titulo at pangalan sa Filipino.
- source_word: וִיהִיבוּ לְשֵׁשְׁבַּצַּר שְׁמֵהּ
  choice: at ibinigay sa isang nagngangalang Sesbazar
  rationale: Natural na ipinahahayag ang Aramaikong pormula ng pagpapangalan habang pinananatili ang kahulugan nito.
- source_word: פֶחָה
  choice: gobernador
  rationale: Malinaw at karaniwang katumbas ng Persiyanong titulong administratibo.
- source_word: שָׂמֵהּ
  choice: itinalaga niyang
  rationale: Ipinahahayag ang opisyal na paglalagay kay Sesbazar sa tungkulin at nililinaw na si Ciro ang gumagawa ng kilos.
