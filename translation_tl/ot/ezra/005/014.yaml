translation_notes:
  register: Makabagong Filipino na marangal at madaling maunawaan. Pinanatili ang pagkakaiba ng “bahay ng Diyos” (בֵית אֱלָהָא) at “templo” (הֵיכְלָא), at ginamit ang panumbalik na “ang mga iyon” upang katawanin ang muling pagbanggit sa mga kagamitan sa Aramaiko.
