translation:
  language: tl
  text: 'Pagkatapos ay ganito ang sinabi namin sa kanila: “Ano ang mga pangalan ng mga lalaking nagtatayo ng gusaling ito?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O, mas pormal: “Nang magkagayon, sinabi namin sa kanila nang ganito: ‘Ano ang mga pangalan ng mga lalaking nagtatayo ng gusaling ito?’”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱדַיִן
  choice: Pagkatapos ay
  rationale: Ipinahihiwatig ng pang-abay ang kasunod na pangyayari sa salaysay; natural at malinaw ang “Pagkatapos ay” sa modernong Filipino.
- source_word: כְּנֵמָא
  choice: nang ganito
  rationale: Tumutukoy ito sa mismong pananalitang kasunod at pinananatili ang diwang “ganito” o “sa ganitong paraan.”
- source_word: אֲמַרְנָא לְּהֹם
  choice: sinabi namin sa kanila
  rationale: Malapit ito sa karaniwang pandiwang Aramaiko na “magsabi” at hindi pinapalitan ng mas tiyak na “tinanong,” kahit patanong ang nilalaman ng sinabi.
- source_word: מַן אִנּוּן שְׁמָהָת
  choice: Ano ang mga pangalan
  rationale: Ito ang natural na paraan sa Filipino ng pagtatanong tungkol sa mga pangalan o pagkakakilanlan ng mga tao.
- source_word: גֻּבְרַיָּא
  choice: mga lalaki
  rationale: Tiyak na panlalaki ang katawagang Aramaiko, kaya hindi ito ginawang neutral na “mga tao.”
- source_word: דִּי
  choice: na
  rationale: Natural na pang-ugnay sa Filipino para iugnay ang “mga lalaki” sa kanilang ginagawang pagtatayo.
- source_word: דְנָה בִנְיָנָא
  choice: gusaling ito
  rationale: Natural na ayos sa Filipino para sa demonstratibong pariralang “this building.”
- source_word: בָּנַיִן
  choice: nagtatayo
  rationale: Ang participle ay nagpapahayag ng patuloy na kilos; hindi idinagdag ang ideya ng “muling pagtatayo,” na hindi tahasang nasa salita.
