  text: However[a], in the first year of Cyrus king of Babylon, Cyrus the king issued a decree to rebuild this house of God.
translation:
  language: tl
  text: Ngunit sa unang taon ni Ciro, na hari ng Babilonia, nagpalabas si Haring Ciro ng utos na muling itayo[a] ang bahay na ito ng Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “itayo.” Ang pandiwang Aramaiko ay nangangahulugang “itayo”; ipinahihiwatig naman ng konteksto ng pagpapanumbalik ang “muling itayo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּרַם
  choice: Ngunit
  rationale: Likas at marangal na panandang pasalungat sa makabagong Tagalog; malinaw nitong ipinakikita ang paglihis mula sa naunang pahayag.
- source_word: בִּשְׁנַת חֲדָה
  choice: nang unang taon
  rationale: Karaniwang anyo sa Tagalog para sa pormula ng pagtatakda ng taon ng paghahari.
- source_word: לְכוֹרֶשׁ מַלְכָּא דִּי בָבֶל
  choice: ni Ciro, na hari ng Babilonia
  rationale: Pinananatili ang pagtukoy sa unang taon ng paghahari ni Ciro bilang hari ng Babilonia, habang gumagamit ng natural na ayos sa Tagalog.
- source_word: שָׂם טְעֵם
  choice: nagpalabas ... ng utos
  rationale: Ang literal na 'naglagay/nagtakda ng utos' ay isang administratibong idyoma; ang 'nagpalabas ng utos' ang malinaw at likas na katumbas sa Tagalog.
- source_word: בֵּית אֱלָהָא דְנָה
  choice: ang bahay na ito ng Diyos
  rationale: Pinananatili ang literal na larawang 'bahay ng Diyos' sa halip na gawing tahasang 'templo,' bagaman templo ang tinutukoy.
- source_word: לִבְנֵא
  choice: muling itayo
  rationale: Ang pandiwang Aramaiko ay literal na 'itayo,' ngunit ipinahihiwatig ng konteksto ang pagpapanumbalik ng nawasak na templo; minamarkahan sa talababa ang tunay na leksikal na alternatibo.
