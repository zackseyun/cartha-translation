base_translation:
  language: en
  yaml_path: translation/ot/ezra/005/006.yaml
  text: This is a copy of the letter that Tattenai[a], the governor of Beyond the River, and Shethar-bozenai and his associates, the officials who were in Beyond the River, sent to King Darius.
translation:
  language: tl
  text: Ito ang kopya ng liham na ipinadala kay Haring Dario ni Tatenai, na gobernador ng Kabila ng Ilog, ni Setar-bozenai, at ng mga kasamahan niya, ang mga opisyal[a] na nasa Kabila ng Ilog.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga Afarsakita,” kung ang salita ay pangalan ng isang pangkat ng mga tao o pangkat na administratibo sa halip na tawag sa kanilang tungkulin.
    reason: alternative_reading
lexical_decisions:
- source_word: פַּרְשֶׁגֶן
  choice: sipi
  rationale: Tumutukoy ito sa kopya ng isang nakasulat na dokumento; natural at malinaw ang “sipi” sa konteksto ng isang opisyal na liham.
- source_word: אִגַּרְתָּא
  choice: liham
  rationale: Isa itong opisyal na nakasulat na komunikasyon, at ang “liham” ang pinakakaraniwan at malinaw na katumbas.
- source_word: שְׁלַח
  choice: ipinadala
  rationale: Tumpak nitong ipinahahayag ang pagpapadala ng liham at natural ang ayos na “ipinadala kay … ni …” sa Filipino.
- source_word: תַּתְּנַי
  choice: Tatenai
  rationale: Isinalin-titik ang pangalang pantangi ayon sa bigkas na angkop sa modernong Filipino.
- source_word: פַּחַת
  choice: gobernador
  rationale: Tumutukoy ito sa pinunong panlalawigan sa pamahalaang Persiano; pamilyar at angkop sa karaniwang mambabasa ang “gobernador.”
- source_word: עֲבַר נַהֲרָה
  choice: Kabila ng Ilog
  rationale: Pinananatili ang anyo nito bilang opisyal na tawag sa rehiyong nasa kanluran ng Eufrates, kaya ginamitan ng malalaking titik.
- source_word: וּשְׁתַר בּוֹזְנַי
  choice: ni Setar-bozenai
  rationale: Isinalin-titik ang pangalang pantangi at ginamit ang “ni” upang malinaw na kabilang siya sa mga nagpadala.
- source_word: וּכְנָוָתֵהּ
  choice: at ng kanyang mga kasamahan
  rationale: Pinananatili ang pang-isahang hulaping paari bilang “kanyang,” habang ang “mga kasamahan” ay natural sa opisyal na konteksto.
- source_word: אֲפַרְסְכָיֵא
  choice: ang mga opisyal
  rationale: Hindi tiyak kung tungkulin o pangalan ng isang pangkat ang salita. Ang “mga opisyal” ay angkop sa administratibong konteksto, habang inilalahad sa talababa ang ibang posibleng pagbasa.
- source_word: עַל דָּרְיָוֶשׁ מַלְכָּא
  choice: kay Haring Dario
  rationale: Natural sa Filipino ang ganitong ayos para sa tumanggap ng liham, at pinananatili nito ang maharlikang titulo.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang opisyal na himig ng dokumento at ang “Kabila ng Ilog” bilang pangalang administratibo. Inilagay ang panandang [a] sa “mga opisyal,” sapagkat doon tumutukoy ang hindi tiyak na salitang Aramaic.
