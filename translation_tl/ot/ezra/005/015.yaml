base_translation:
  language: en
  yaml_path: translation/ot/ezra/005/015.yaml
  text: And he said to him[a], ‘Take these vessels, go and put them in the temple that is in Jerusalem, and let the house of God be rebuilt on its site.’
translation:
  language: tl
  text: At sinabi niya sa kanya, “Kunin mo ang mga kagamitang ito, pumunta ka at ilagay ang mga ito sa templo na nasa Jerusalem, at muling maitayo[a] ang bahay ng Diyos sa kinalalagyan nito.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “maitayo.” Ang pandiwang Aramaiko ay literal na tumutukoy sa pagtatayo; ipinahihiwatig ng konteksto na muling itatayo ang bahay ng Diyos.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲמַר לֵהּ
  choice: At sinabi niya sa kanya
  rationale: Pinananatili ang karaniwang panimulang salaysay at ang tahasang panlalaking isahang simuno at layon ng Aramaiko.
- source_word: אֵלֶּה מָאנַיָּא
  choice: ang mga kagamitang ito
  rationale: Tumutukoy sa sari-saring sagradong kagamitan ng templo; mas malawak at mas likas sa modernong Filipino kaysa “mga sisidlan.”
- source_word: שֵׂא אֵזֶל אֲחֵת הִמּוֹ
  choice: Kunin mo ... pumunta ka at ilagay ang mga ito
  rationale: 'Inihahayag nang natural ang sunod-sunod na mga utos: kunin, pumunta, at ilagay.'
- source_word: בְּהֵיכְלָא דִּי בִירוּשְׁלֶם
  choice: sa templo na nasa Jerusalem
  rationale: Ang הֵיכְלָא ay templo sa kontekstong ito, at pinananatili ng sugnay na “na nasa Jerusalem” ang ugnayang ipinahihiwatig ng דִּי.
- source_word: וּבֵית אֱלָהָא
  choice: ang bahay ng Diyos
  rationale: Pinananatili ang konkretong metapora ng orihinal sa halip na palitan agad ng “templo.”
- source_word: יִתְבְּנֵא
  choice: muling maitayo
  rationale: Ang anyo ay di-tiyak/passive na “maitayo”; ipinahihiwatig ng kasaysayang konteksto ang muling pagtatayo, habang nililinaw sa talababa ang payak na kahulugang leksikal.
- source_word: עַל אַתְרֵהּ
  choice: sa kinalalagyan nito
  rationale: Likas na Filipino para sa pagtatayo ng gusali sa mismong lugar nito at pinananatili ang panghalip na tumutukoy sa bahay ng Diyos.
