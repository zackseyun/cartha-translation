language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: בֵּ/אדַ֡יִן קָ֠מוּ זְרֻבָּבֶ֤ל בַּר שְׁאַלְתִּיאֵל֙ וְ/יֵשׁ֣וּעַ בַּר יֽוֹצָדָ֔ק וְ/שָׁרִ֣יו לְ/מִבְנֵ֔א בֵּ֥ית אֱלָהָ֖/א דִּ֣י בִ/ירֽוּשְׁלֶ֑ם וְ/עִמְּ/ה֛וֹן נביאי/א דִֽי אֱלָהָ֖/א מְסָעֲדִ֥ין לְ/הֽוֹן־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/005/002.yaml
  text: Then Zerubbabel son of Shealtiel and Jeshua son of Jozadak arose and began to build the house of God that is in Jerusalem[a], and with them were the prophets of God[c][b], supporting them.
translation:
  language: tl
  text: Nang magkagayon, tumindig sina Zerubabel na anak ni Sealtiel at Jeshua[b] na anak ni Jozadak, at sinimulan nilang itayo ang bahay ng Diyos na nasa Jerusalem.[a] Kasama nila ang mga propeta ng Diyos, na tumutulong sa kanila.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “templo ng Diyos.” Literal sa Aramaiko: “bahay ng Diyos.”'
    reason: lexical_alternative
  - marker: b
    text: Jeshua ang anyo ng personal na pangalan dito; ihambing ang kaugnay na anyong “Josue” sa ibang mga talata.
    reason: lexical_alternative
  - marker: c
    text: O “sumusuporta sa kanila” o “umaalalay sa kanila.” Ipinahihiwatig ng pandiwari ang aktibong pagtulong.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּאדַיִן
  choice: Nang magkagayon
  rationale: Panandang Aramaiko ito ng kasunod na pangyayari. Likas sa salaysay ang “Nang magkagayon” at naipapakita nito ang pag-usad ng pangyayari.
- source_word: קָמוּ
  choice: tumindig
  rationale: Pinananatili nito ang payak na diwang “tumayo/tumindig,” na sa konteksto ay nagpapahiwatig ng pagkilos upang simulan ang gawain.
- source_word: זְרֻבָּבֶל
  choice: Zerubabel
  rationale: Karaniwang anyo ng pangalan sa modernong saling Tagalog.
- source_word: בַּר
  choice: anak ni
  rationale: Tuwirang katumbas ng Aramaikong panandang patronimiko na nangangahulugang “anak ni.”
- source_word: שְׁאַלְתִּיאֵל
  choice: Sealtiel
  rationale: Likas na transliterasyon sa Tagalog ng pangalang pinagmulan.
- source_word: יֵשׁוּעַ
  choice: Jeshua
  rationale: Pinananatili ang maikling anyo ng pangalan na nasa tekstong Aramaiko, sa halip na palitan ito ng kaugnay na anyong “Josue.”
- source_word: יוֹצָדָק
  choice: Jozadak
  rationale: Inililipat sa Tagalog ang mismong anyo ng pangalan sa talata, nang hindi ito pinapalitan ng mas mahabang kaugnay na anyo.
- source_word: וְשָׁרִיו לְמִבְנֵא
  choice: at sinimulan nilang itayo
  rationale: Likas na pagsasama sa Tagalog ng pandiwang “nagsimula” at ng pawatas na “magtayo,” habang malinaw na ang dalawang pinuno ang gumagawa.
- source_word: בֵּית אֱלָהָא
  choice: ang bahay ng Diyos
  rationale: Tuwirang pinananatili ang idyomang Aramaiko na “bahay ng Diyos”; ang “templo ng Diyos” ay wastong paliwanag ayon sa konteksto ngunit mas interpretatibo.
- source_word: דִּי בִירוּשְׁלֶם
  choice: na nasa Jerusalem
  rationale: Natural na sugnay sa Tagalog na tumutukoy sa kinaroroonan ng bahay ng Diyos.
- source_word: מְסָעֲדִין לְהוֹן
  choice: na tumutulong sa kanila
  rationale: Ipinahahayag nito ang patuloy at aktibong pagtulong ng mga propeta na ipinahihiwatig ng pandiwaring Aramaiko.
theological_decisions:
- issue: Pagtukoy sa בֵּית אֱלָהָא
  choice: bahay ng Diyos
  alternative: templo ng Diyos
  rationale: Literal na “bahay ng Diyos” ang Aramaiko. Pinananatili ito sa pangunahing teksto upang hindi agad palitan ng kontekstuwal ngunit mas interpretatibong katawagang “templo.”
- issue: Uri ng tulong ng mga propeta
  choice: tumutulong sa kanila
  alternative: sumusuporta sa kanila
  rationale: Hindi tinutukoy ng pinagmulan ang eksaktong paraan ng pag-alalay. Ang “tumutulong” ay malawak at natural, kaya hindi nito nililimitahan ang gawain ng mga propeta sa pisikal, pampolitika, o espirituwal na suporta lamang.
translation_notes:
  register: Modernong Filipino Tagalog na may marangal na himig sa salaysay. Ginamit ang “Nang magkagayon” at “tumindig” upang mapanatili ang pormal na galaw ng orihinal, ngunit inayos ang pandiwang “sinimulan nilang itayo” at ang huling sugnay upang maging malinaw at natural sa karaniwang mambabasa. Pinanatili ang mga pangalang transliterado at ang literal na idyomang “bahay ng Diyos.”
