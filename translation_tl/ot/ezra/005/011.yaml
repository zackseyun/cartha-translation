  text: וּ/כְנֵ֥מָא פִתְגָמָ֖/א הֲתִיב֣וּ/נָא לְ/מֵמַ֑ר אֲנַ֣חְנָא הִמּ֡וֹ עַבְדוֹ/הִי֩ דִֽי אֱלָ֨הּ שְׁמַיָּ֜/א וְ/אַרְעָ֗/א וּ/בָנַ֤יִן בַּיְתָ/א֙ דִּֽי הֲוָ֨א בְנֵ֜ה מִ/קַּדְמַ֤ת דְּנָה֙ שְׁנִ֣ין שַׂגִּיאָ֔ן וּ/מֶ֤לֶךְ לְ/יִשְׂרָאֵל֙ רַ֔ב בְּנָ֖/הִי וְ/שַׁכְלְלֵֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/005/011.yaml
  text: 'And this is the answer they returned to us[a], saying: We are the servants of the God of heaven and earth, and we are rebuilding the house that was built many years ago[b], which a great king of Israel built and completed.'
translation:
  language: tl
  text: 'At ito ang sagot na ibinalik nila sa amin[a]: “Kami ay mga lingkod ng Diyos ng langit at lupa, at muli[b] naming itinatayo ang bahay na itinayo maraming taon na ang nakalipas. Itinayo at tinapos ito ng isang dakilang hari ng Israel.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “At ganito ang mensaheng ibinalik nila sa amin.”
    reason: lexical_alternative
  - marker: b
    text: O, “at itinatayo namin ang bahay.” Ang anyong Aramaic ay maaaring tumukoy sa nagpapatuloy na gawain; nililinaw ng “muli naming itinatayo” na dati nang nakatayo ang templong ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְנֵמָא פִתְגָמָא הֲתִיבוּנָא
  choice: At ito ang sagot na ibinalik nila sa amin
  rationale: Ipinakikilala ng parirala ang nilalaman ng tugon. Pinananatili ng “ibinalik ... ang sagot” ang larawan ng Aramaic na pandiwang ‘magbalik’ habang natural pa rin sa Filipino.
- source_word: לְמֵמַר
  choice: sumusunod na tuwirang sipi, na ipinakilala sa pamamagitan ng tutuldok
  rationale: Karaniwang panandang Aramaic ito sa pagsisimula ng tuwirang pananalita. Mas natural sa modernong Filipino ang tutuldok kaysa sa tahasang “na nagsasabi.”
- source_word: עַבְדוֹהִי
  choice: mga lingkod
  rationale: Bagaman maaari itong tumukoy sa mga alipin, dito ay ipinahahayag nito ang paglilingkod at katapatan sa Diyos.
- source_word: אֱלָהּ שְׁמַיָּא וְאַרְעָא
  choice: Diyos ng langit at lupa
  rationale: Natural at tuwirang salin ng banal na titulong nagpapahayag ng pamamahala ng Diyos sa buong sangnilikha.
- source_word: וּבָנַיִן
  choice: muli naming itinatayo
  rationale: Nagsasaad ang participle ng nagpapatuloy na gawain. Ipinahihiwatig ng konteksto na dating nakatayo ang bahay at muli itong itinatayo; inilalahad sa talababa ang mas literal na alternatibo.
- source_word: בַּיְתָא
  choice: bahay
  rationale: Pinananatili ang literal na salita ng Aramaic; malinaw sa konteksto na ang tinutukoy ay ang templo.
- source_word: מִקַּדְמַת דְּנָה שְׁנִין שַׂגִּיאָן
  choice: maraming taon na ang nakalipas
  rationale: Natural na Filipino para sa literal na diwang ‘bago nito, maraming taon.’
- source_word: וּמֶלֶךְ לְיִשְׂרָאֵל רַב
  choice: isang dakilang hari ng Israel
  rationale: Ipinahahayag ng רַב ang kadakilaan o katanyagan ng hari, na hindi pinapangalanan sa talata.
- source_word: בְּנָהִי וְשַׁכְלְלֵהּ
  choice: nagtayo at tumapos nito
  rationale: 'Pinananatili ang dalawang kilos: ang pagtatayo at ang pagdadala sa gusali sa ganap na pagkakatapos.'
theological_decisions:
- issue: Banal na titulo sa sulat na ipinadala sa imperyo
  choice: Diyos ng langit at lupa
  alternative: Diyos ng mga langit at ng lupa
  rationale: Tuwirang pinananatili ang pangkalahatang saklaw ng titulo at hindi inilalarawan ang Diyos bilang isang lokal o pampolitikang diyos lamang.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “bahay” upang mapanatili ang kongkretong salita ng Aramaic, at ang “muli naming itinatayo” upang natural na maipahayag ang nagpapatuloy na muling pagtatayo nang hindi itinatago ang mas literal na pagbasa sa talababa.
