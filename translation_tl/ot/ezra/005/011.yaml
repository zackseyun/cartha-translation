  to: 'At ito ang sagot na ibinalik nila sa amin[a]: “Kami ay mga lingkod ng Diyos ng langit at lupa, at muli[b] naming itinatayo ang bahay na itinayo maraming taon na ang nakalipas. Itinayo at tinapos ito ng isang dakilang hari ng Israel.”'
