  source_fidelity: 'Tapat ang salin sa Aramaic: napananatili ang sunod na pangyayari, ang pagtatanong sa mga nakatatanda, ang pormula ng pagpapakilala sa tuwirang sipi, ang pagtukoy sa opisyal na utos, at ang dalawang layuning magtayo at tapusin. Ang “bahay” ay hindi pinalitan ng “templo” sa pangunahing teksto, at ang “gusali” ay angkop na malawak na salin ng hindi ganap na tiyak na אֻשַּׁרְנָא.'
