  text: אֱדַ֗יִן שְׁאֵ֨לְנָא֙ לְ/שָׂבַיָּ֣/א אִלֵּ֔ךְ כְּנֵ֖מָא אֲמַ֣רְנָא לְּ/הֹ֑ם מַן שָׂ֨ם לְ/כֹ֜ם טְעֵ֗ם בַּיְתָ֤/א דְנָה֙ לְ/מִבְנְיָ֔ה וְ/אֻשַּׁרְנָ֥/א דְנָ֖ה לְ/שַׁכְלָלָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/005/009.yaml
  text: 'Then we asked those elders and said to them as follows: “Who gave you a decree to build this house and to complete this structure?”[a][b]'
translation:
  language: tl
  text: 'Pagkatapos, tinanong namin ang mga nakatatandang iyon. Ganito ang sinabi namin sa kanila: “Sino ang nagbigay sa inyo ng utos na itayo ang bahay na ito at tapusin ang gusaling ito?”[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “ang bahay na ito at ang kayariang ito.” Ang “bahay” ay tumutukoy sa templo.
    reason: lexical_alternative
  - marker: b
    text: Ang salitang Aramaic na isinaling “gusali” ay maaaring tumukoy nang mas tiyak sa kayarian, balangkas, o iba pang bahagi ng konstruksyon nito.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱדַיִן
  choice: Pagkatapos
  rationale: Minamarkahan nito ang kasunod na pangyayari sa salaysay; natural at malinaw ang “Pagkatapos” sa makabagong Tagalog.
- source_word: שְׁאֵלְנָא
  choice: tinanong namin
  rationale: Direktang inilalarawan ang pagtatanong at pinananatili ang unang panauhang maramihan.
- source_word: לְשָׂבַיָּא אִלֵּךְ
  choice: ang mga nakatatandang iyon
  rationale: Tumutukoy sa mga pinunong Judio na nabanggit sa konteksto; pinananatili ng “iyon” ang deiktikong diwa.
- source_word: כְּנֵמָא אֲמַרְנָא לְּהֹם
  choice: Ganito ang sinabi namin sa kanila
  rationale: Natural na panimula sa tuwirang sipi at tapat sa pormula ng Aramaic.
- source_word: מַן
  choice: Sino
  rationale: Karaniwang panghalip na pananong para sa taong nagbigay ng awtorisasyon.
- source_word: שָׂם לְכֹם טְעֵם
  choice: nagbigay sa inyo ng utos
  rationale: Ang טְעֵם ay tumutukoy sa opisyal na pasiya, kautusan, o atas; malinaw sa ordinaryong mambabasa ang “utos” habang napapanatili ang administratibong diwa.
- source_word: בַּיְתָא דְנָה
  choice: ang bahay na ito
  rationale: Literal na “bahay” ang salita. Bagaman templo ang tinutukoy sa konteksto, hindi iyon tahasang ipinapalit sa pangunahing teksto.
- source_word: לְמִבְנְיָה
  choice: itayo
  rationale: Isinasalin ang simpleng pandiwang “magtayo/magtayo ng gusali” nang hindi idinaragdag ang di-tahasang diwang “muling itayo.”
- source_word: וְאֻשַּׁרְנָא דְנָה
  choice: ang gusaling ito
  rationale: Malawak ngunit natural na salin para sa di-karaniwang pangngalang maaaring tumukoy sa kayarian, balangkas, o mismong bahagi ng konstruksyon.
- source_word: לְשַׁכְלָלָה
  choice: tapusin
  rationale: Ipinahahayag ang pagdadala sa gawain tungo sa ganap na pagkakumpleto sa tuwiran at natural na Tagalog.
