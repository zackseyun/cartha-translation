revisions:
- from: Ngunit dahil ginalit ng aming mga ninuno ang Diyos ng langit, ibinigay niya sila sa kamay ni Nebucadnezar na Caldeo, na hari ng Babilonia. Giniba niya ang bahay na ito[a] at ipinatapon ang mga tao sa Babilonia.[b]
  to: Kaya, dahil ginalit ng aming mga ninuno ang Diyos ng langit, ibinigay niya sila sa kamay ni Nebucadnezar, hari ng Babilonia, na Caldeo. Giniba niya ang bahay na ito[a] at ipinatapon ang mga tao sa Babilonia.[b]
  rationale: Pinalitan ang “Ngunit” ng “Kaya” upang maipakita ang inferensiyal na gamit ng לָהֵן, at inayos ang paglalarawan kay Nebucadnezar ayon sa pagkakasunod ng Aramaiko. Walang binagong kahulugan sa hatol ng Diyos, sa literal na “bahay,” o sa sapilitang pagdadala ng mga tao sa Babilonia.
