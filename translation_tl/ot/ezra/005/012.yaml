source:
  edition: WLC
  text: לָהֵ֗ן מִן דִּ֨י הַרְגִּ֤זוּ אֲבָהֳתַ֨/נָא֙ לֶ/אֱלָ֣הּ שְׁמַיָּ֔/א יְהַ֣ב הִמּ֔וֹ בְּ/יַ֛ד נְבוּכַדְנֶצַּ֥ר מֶֽלֶךְ בָּבֶ֖ל כסדי/א וּ/בַיְתָ֤/ה דְנָה֙ סַתְרֵ֔/הּ וְ/עַמָּ֖/ה הַגְלִ֥י לְ/בָבֶֽל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/005/012.yaml
  text: Therefore[a], because our fathers provoked the God of heaven to wrath, he gave them into the hand of Nebuchadnezzar king of Babylon, the Chaldean[c][b], and he destroyed this house and carried the people away to Babylon.
translation:
  language: tl
  text: Kaya, dahil ginalit ng aming mga ninuno ang Diyos ng langit, ibinigay niya sila sa kamay ni Nebucadnezar, hari ng Babilonia, na Caldeo. Giniba niya ang bahay na ito[a] at ipinatapon ang mga tao sa Babilonia.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “bahay na ito” ay tumutukoy sa templo.
    reason: cultural_note
  - marker: b
    text: O, “at dinalang bihag ang mga tao sa Babilonia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לָהֵן מִן דִּי
  choice: Ngunit dahil
  rationale: Sa konteksto, ang לָהֵן ay nagpapakilala ng pagsalungat sa naunang pahayag tungkol sa pagtatayo ng templo, at ang מִן דִּי ay nagbibigay ng sanhi. Likas at malinaw sa Filipino ang “Ngunit dahil.”
- source_word: הַרְגִּזוּ
  choice: ginalit
  rationale: Ang causative na anyo ay nangangahulugang nagdulot ng galit. Tuwiran at natural na katumbas nito ang “ginalit,” nang hindi pinahihina ang pahayag tungkol sa banal na galit.
- source_word: אֲבָהֳתַנָא
  choice: aming mga ninuno
  rationale: Bagaman literal na “aming mga ama,” ang “aming mga ninuno” ang karaniwang modernong Filipino para sa kolektibong pagtukoy sa mga salinlahing nauna.
- source_word: לֶאֱלָהּ שְׁמַיָּא
  choice: ang Diyos ng langit
  rationale: Pinananatili nito ang tiyak at kilalang titulong Aramaiko para sa Diyos.
- source_word: יְהַב הִמּוֹ בְּיַד
  choice: ibinigay niya sila sa kamay ni
  rationale: Pinananatili ang idyomang biblikal na tumutukoy sa paghahatid sa kapangyarihan ng iba, at hindi ginagawang simpleng pagpapahintulot lamang.
- source_word: נְבוּכַדְנֶצַּר מֶלֶךְ בָּבֶל כסדיא
  choice: Nebucadnezar na Caldeo, na hari ng Babilonia
  rationale: Ang “Caldeo” ay panuring na singular kay Nebucadnezar, at ang ikalawang “na” ay malinaw na nag-uugnay sa kaniyang titulong maharlika.
- source_word: וּבַיְתָה דְנָה סַתְרֵהּ
  choice: Giniba niya ang bahay na ito
  rationale: Ang “bahay” ang literal na salita, samantalang ang tinutukoy ay ang templo. Ang “giniba” ay angkop sa pisikal na pagbagsak ng gusali.
- source_word: וְעַמָּה הַגְלִי לְבָבֶל
  choice: at ipinatapon ang mga tao sa Babilonia
  rationale: Ang causative na pandiwa ay tumutukoy sa sapilitang pagdadala sa pagkatapon. Malinaw at maikli itong naipapahayag ng “ipinatapon.”
theological_decisions:
- issue: Tuwirang pag-uugnay ng paghatol ng Diyos sa pagkatalo ng mga ninuno
  choice: ibinigay niya sila sa kamay ni Nebucadnezar
  alternative: hinayaan niyang mapunta sila sa kamay ni Nebucadnezar
  rationale: Tahasan sa Aramaiko na ang Diyos ang nagbigay sa kanila sa kapangyarihan ni Nebucadnezar. Hindi ito dapat palambutin bilang pagpapahintulot lamang.
- issue: Pagtukoy sa templo bilang bahay
  choice: ang bahay na ito
  alternative: ang templong ito
  rationale: “Bahay” ang mismong salita ng teksto at nagpapanatili sa teolohikal na pananalita tungkol sa bahay ng Diyos; ipinapaliwanag sa talababa na templo ang tinutukoy.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mga ninuno” sa halip na literal na “mga ama” para sa likas na kolektibong pagtukoy sa mga naunang salinlahi. Pinanatili ang biblikal na idyomang “sa kamay ni” at ang literal na “bahay,” na nilinaw sa talababa.
