base_translation:
  language: en
  yaml_path: translation/ot/ezra/005/007.yaml
  text: 'They sent a report to him[b][a], and this was what was written in it: “To Darius the king: all peace.”'
translation:
  language: tl
  text: 'Ipinadala nila sa kanya ang ulat[a], at ganito ang nakasulat dito: “Para kay Haring Dario: lubos na kapayapaan.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “opisyal na mensahe” o “kasulatan.” Ang Aramaic na פִּתְגָמָא ay maaaring tumukoy sa isang opisyal na mensahe, ulat, o dokumento.
    reason: lexical_alternative
  - marker: b
    text: Ang “lubos na kapayapaan” ay isang pormal na pagbati sa liham na humihiling ng ganap na kapayapaan o mabuting kalagayan.
    reason: cultural_note
lexical_decisions:
- source_word: פִּתְגָמָא
  choice: ulat
  rationale: Maaari itong tumukoy sa isang opisyal na mensahe, ulat, o kasulatan; ang “ulat” ay angkop sa kontekstong administratibo.
- source_word: שְׁלַחוּ
  choice: ipinadala nila
  rationale: Tuwirang inilalarawan ang tapos na kilos ng pagpapadala sa natural na modernong Tagalog.
- source_word: עֲלֹוהִי
  choice: sa kanya
  rationale: Kasama ng pandiwang “ipinadala,” ipinahihiwatig nito ang taong pinadalhan; sa konteksto, si Dario ang tatanggap.
- source_word: וְכִדְנָה
  choice: at ganito
  rationale: Ipinakikilala nito ang mismong anyo o nilalaman ng kasulatan.
- source_word: כְּתִיב
  choice: ang nakasulat
  rationale: Pinananatili ang pasibong diwa ng Aramaic habang natural sa Tagalog.
- source_word: בְּגַוֵּהּ
  choice: dito
  rationale: Tumutukoy sa nilalamang nakasulat sa ulat; ang “dito” ay likas na katumbas ng “sa loob nito” sa pangungusap.
- source_word: לְדָרְיָוֶשׁ
  choice: Para kay ... Dario
  rationale: Ang pang-ukol ay nagmamarka sa pinatutungkulan ng sulat; “Para kay” ang likas na pormula sa Tagalog.
- source_word: מַלְכָּא
  choice: Haring
  rationale: Ginamit bilang titulong kasama ng pangalan; natural sa Tagalog ang “Haring Dario.”
- source_word: שְׁלָמָא
  choice: kapayapaan
  rationale: Pinananatili ang pangunahing leksikal na diwa ng kapayapaan at mabuting kalagayan sa pormal na pagbati.
- source_word: כֹלָּא
  choice: lubos na
  rationale: Intensipikador ito na nagpapahayag ng kabuuan o kapuspusan; mas natural sa Tagalog ang “lubos na kapayapaan” kaysa “lahat ng kapayapaan.”
theological_decisions: []
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “Haring Dario” bilang likas na ayos ng titulo at pangalan, at pinanatili ang pormal na tunog ng sinaunang pagbati nang hindi ito ginawang karaniwang “mabuhay” o “pagbati.”
