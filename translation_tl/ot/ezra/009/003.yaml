base_translation:
  language: en
  yaml_path: translation/ot/ezra/009/003.yaml
  text: As soon as I heard this matter[a], I tore my garment and my robe, pulled out some of the hair of my head and my beard[b], and sat appalled.
translation:
  language: tl
  text: Nang marinig ko ang bagay na ito[a], pinunit ko ang aking kasuotan at balabal, binunot ko ang ilan sa buhok sa aking ulo at balbas[b], at naupo akong tulala sa pagkagimbal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Nang marinig ko ang ulat na ito.”
    reason: lexical_alternative
  - marker: b
    text: Ang pagpunit ng mga kasuotan at pagbunot ng buhok ay kinaugaliang mga pagpapahayag ng matinding dalamhati, pagkasindak, o pagluluksa.
    reason: cultural_note
lexical_decisions:
- source_word: וּכְשָׁמְעִי
  choice: Nang marinig ko
  rationale: Likas na temporal na sugnay ito sa Tagalog. Hindi ginawang tahasang “Pagkarinig na pagkarinig ko” sapagkat ang כְּ ay tiyak na nagpapakilala ng panahon ngunit hindi kinakailangang idiin ang agarang sandali.
- source_word: הַדָּבָר הַזֶּה
  choice: ang bagay na ito
  rationale: Pinananatili nito ang malawak na kahulugan ng דָּבָר bilang bagay, usapin, salita, o ulat; sa konteksto, tumutukoy ito sa kalagayang iniulat kay Ezra.
- source_word: קָרַעְתִּי אֶת־בִּגְדִי וּמְעִילִי
  choice: pinunit ko ang aking kasuotan at balabal
  rationale: Ang “kasuotan” ay pangkalahatang katawagan para sa בֶּגֶד, samantalang ang “balabal” ay malinaw na panlabas na kasuotan para sa מְעִיל.
- source_word: וָאֶמְרְטָה
  choice: binunot ko
  rationale: Ipinahahayag nito ang sapilitang pag-aalis ng buhok sa natural at tuwirang modernong Tagalog.
- source_word: מִשְּׂעַר רֹאשִׁי וּזְקָנִי
  choice: ang ilan sa buhok sa aking ulo at balbas
  rationale: 'Ginagawang malinaw ng “ang ilan sa” ang partitive na diwa ng מִן: buhok mula sa ulo at balbas, hindi kinakailangang lahat ng buhok.'
- source_word: וָאֵשְׁבָה מְשׁוֹמֵם
  choice: at naupo akong sakdal sa pagkagimbal
  rationale: Ang מְשׁוֹמֵם ay nagsasaad ng matinding pagkasindak o pagkawasak ng kalooban. Ang parirala ay mas dignified at mas matindi kaysa simpleng “nagulat,” habang inilalarawan ang pagiging tulala sa sindak.
