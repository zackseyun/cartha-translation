  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: מִ/ימֵ֣י אֲבֹתֵ֗י/נוּ אֲנַ֨חְנוּ֙ בְּ/אַשְׁמָ֣ה גְדֹלָ֔ה עַ֖ד הַ/יּ֣וֹם הַ/זֶּ֑ה וּ/בַ/עֲוֺנֹתֵ֡י/נוּ נִתַּ֡נּוּ אֲנַחְנוּ֩ מְלָכֵ֨י/נוּ כֹהֲנֵ֜י/נוּ בְּ/יַ֣ד מַלְכֵ֣י הָ/אֲרָצ֗וֹת בַּ/חֶ֜רֶב בַּ/שְּׁבִ֧י וּ/בַ/בִּזָּ֛ה וּ/בְ/בֹ֥שֶׁת פָּנִ֖ים כְּ/הַ/יּ֥וֹם הַ/זֶּֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/009/007.yaml
  text: From the days of our fathers until this day[a], we have been in great guilt. Because of our iniquities, we, our kings, and our priests have been given into the hand of the kings of the lands, to the sword, to captivity, to plunder, and to shame of face, as it is this day.
translation:
  language: tl
  text: Mula pa sa panahon ng aming mga ninuno hanggang sa araw na ito, mabigat ang aming pagkakasala. Dahil sa aming mga kasamaan, kami, ang aming mga hari, at ang aming mga pari ay ibinigay sa kamay ng mga hari ng mga lupain—sa tabak, sa pagkabihag, sa pandarambong, at sa hayagang kahihiyan[a]—gaya ng kalagayan namin sa araw na ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa pagkapahiya”; literal, “sa kahihiyan ng mukha.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִימֵי אֲבֹתֵינוּ
  choice: Mula pa sa panahon ng aming mga ninuno
  rationale: Ipinahahayag ng מִן kasama ng יָמִים ang simula ng isang panahong nagpapatuloy. Mas natural sa makabagong Tagalog ang “mula pa sa panahon” kaysa sa literal na “mula sa mga araw,” habang napapanatili ang historikal na pagpapatuloy.
- source_word: אֲנַחְנוּ בְּאַשְׁמָה גְדֹלָה
  choice: mabigat ang aming pagkakasala
  rationale: Ang אַשְׁמָה ay tumutukoy sa tunay na pagkakasala o pananagutan, hindi lamang sa damdamin ng hiya. Ang “mabigat” ay likas na Tagalog para sa tindi ng pagkakasala at angkop sa tuloy-tuloy na kalagayang ipinahahayag ng sugnay na walang tahasang pandiwa.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: hanggang sa araw na ito
  rationale: Pinananatili nito ang tahasang hangganang temporal at ang marangal na himig ng Hebreo.
- source_word: וּבַעֲוֹנֹתֵינוּ
  choice: Dahil sa aming mga kasamaan
  rationale: Ang בְּ ay may puwersang sanhi sa konteksto, at ang עָוֹן ay tumutukoy sa baluktot o masamang gawa na nagdudulot ng pananagutan at kaparusahan. Naiiba ang “mga kasamaan” sa אַשְׁמָה na isinaling “pagkakasala.”
- source_word: נִתַּנּוּ
  choice: ay ibinigay
  rationale: Pinananatili ang balintiyak na anyo ng Niphal ng נָתַן at hindi dinaragdagan ang talata ng isang tahasang tagaganap na wala sa Hebreo.
- source_word: בְּיַד
  choice: sa kamay ng
  rationale: Pinananatili ang malinaw at nauunawaang Hebreong idyoma para sa pagkakalagay sa kapangyarihan o kontrol ng iba.
- source_word: מַלְכֵי הָאֲרָצוֹת
  choice: mga hari ng ibang mga lupain
  rationale: Ang אֲרָצוֹת ay tumutukoy sa mga bansang lupain, hindi sa buong daigdig. Idinagdag ang “ibang” upang maging malinaw sa Tagalog na mga dayuhang lupain ang tinutukoy, nang hindi tinutukoy ang partikular na mga bansa.
- source_word: בַּחֶרֶב
  choice: sa tabak
  rationale: Pinananatili ang maikli at kongkretong pormula ng paghatol na tumutukoy sa kamatayan o pagkawasak sa digmaan.
- source_word: בַּשְּׁבִי
  choice: sa pagkabihag
  rationale: Tuwirang inilalarawan ang kalagayan ng pagiging bihag; hindi ito nililimitahan sa mas makitid na konsepto ng pagkakatapon.
- source_word: וּבַבִּזָּה
  choice: sa pandarambong
  rationale: Ang בִּזָּה ay samsam o pandarambong ng kaaway. Ang “pandarambong” ay natural at malinaw sa kasalukuyang Tagalog.
- source_word: וּבְבֹשֶׁת פָּנִים
  choice: sa hayagang kahihiyan[a]
  rationale: Ipinahahayag ng parirala ang lantad at pampublikong pagkapahiya. Mas natural sa pangunahing teksto ang “hayagang kahihiyan,” habang itinatala sa talababa ang kongkretong larawang “kahihiyan ng mukha.”
- source_word: כְּהַיּוֹם הַזֶּה
  choice: gaya ng kalagayan namin sa araw na ito
  rationale: Nililinaw sa natural na Tagalog na ang kasalukuyang kalagayan ang inihahambing sa mga paghatol na kababanggit, habang pinananatili ang demonstratibong diin ng Hebreo.
theological_decisions:
- issue: Pag-iiba sa mga salitang moral na אַשְׁמָה at עָוֹן
  choice: Isalin ang אַשְׁמָה bilang “pagkakasala” at ang עָוֹן bilang “mga kasamaan.”
  alternative: Isalin ang dalawang salita nang pareho bilang “kasalanan” o “mga kasalanan.”
  rationale: 'Pinananatili ng pagkakaiba ang suson ng salaysay: kinikilala muna ang mabigat na pananagutan ng bayan, saka ang masasamang gawang naging dahilan ng paghatol. Hindi nito dinaragdagan ang teksto ng isang natatanging sistemang doktrinal.'
- issue: Sama-samang pakikiisa sa pagpapahayag ng pagkakasala
  choice: Panatilihin ang “kami, ang aming mga hari, at ang aming mga pari.”
  alternative: Baguhin ang ayos upang ihiwalay o bawasan ang pagkakaugnay ng bayan at mga pinuno.
  rationale: Tahasang pinagsasama ng Hebreo ang pamayanan, mga hari, at mga pari bilang mga dumanas ng paghatol. Pinananatili nito ang kolektibong saklaw ng panalangin ni Ezra.
- issue: Tagaganap ng paghatol sa balintiyak na נִתַּנּוּ
  choice: Panatilihin ang balintiyak na “ibinigay” nang hindi tahasang pinapangalanan ang Diyos bilang tagaganap.
  alternative: Isaling “ibinigay kami ng Diyos” o “ipinaubaya kami ng Diyos.”
  rationale: Bagaman ipinahihiwatig ng konteksto ang banal na paghatol, hindi tahasang binabanggit ng mismong sugnay ang tagaganap. Pinananatili ng salin ang pormal na kalabuan ng pinagmulan.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Gumamit ng “mga ninuno” sa halip na literal na “mga ama,” at ng mga katagang “pagkabihag” at “pandarambong” upang mapanatili ang historikal na bigat nang hindi nagiging lipas ang pananalita. Ang mga pag-uulit ng “sa” sa hanay ng mga paghatol ay sadyang pinanatili upang tumbasan ang ritmo at diin ng Hebreo.
