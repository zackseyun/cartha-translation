id: EZR.9.15
reference: Ezra 9:15
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: יְהוָ֞ה אֱלֹהֵ֤י יִשְׂרָאֵל֙ צַדִּ֣יק אַ֔תָּה כִּֽי נִשְׁאַ֥רְנוּ פְלֵיטָ֖ה כְּ/הַ/יּ֣וֹם הַ/זֶּ֑ה הִנְ/נ֤וּ לְ/פָנֶ֨י/ךָ֙ בְּ/אַשְׁמָתֵ֔י/נוּ כִּ֣י אֵ֥ין לַ/עֲמ֛וֹד לְ/פָנֶ֖י/ךָ עַל זֹֽאת־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/009/015.yaml
  text: O Yahweh[a], God of Israel, you are righteous, for we have been left as a remnant, as it is this day. Here we are before you in our guilt[c][b], for no one can stand before you because of this.
translation:
  language: tl
  text: O Yahweh, Diyos ng Israel, ikaw ay matuwid, sapagkat kami ay naiwang nalabi[a], gaya ng kalagayan namin ngayon. Narito kami sa harapan mo, taglay ang aming pagkakasala, sapagkat walang sinumang makatatayo sa harapan mo dahil dito.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “mga nakaligtas” o “isang nalabi ng mga nakaligtas.”
    reason: Ipinapakita ng פְלֵיטָה ang mga taong nakaligtas at naiwan matapos ang paghatol.
  - marker: b
    text: Sa Hebreo, “walang pagtayo sa harapan mo dahil dito,” isang idyomang nagpapahiwatig na walang makapananatili o makatatagal sa presensiya ng Diyos dahil sa pagkakasala.
    reason: Ipinapaliwanag ang impersonal na Hebreong idyoma at pinananatili ang larawan ng pagtayo sa harapan ng Diyos.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ang banal na pangalang YHWH, sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Diyos ng Israel
  rationale: Likas at tuwirang salin ng pariralang konstruktibo at ng tipanang pagtawag.
- source_word: צַדִּיק
  choice: matuwid
  rationale: Saklaw nito kapwa ang moral na katuwiran at pagiging makatarungan ng Diyos nang hindi nililimitahan ang kahulugan sa paghatol lamang.
- source_word: כִּי
  choice: sapagkat
  rationale: Pinananatili ang paliwanag o batayang ibinibigay ng dalawang sugnay sa konteksto.
- source_word: נִשְׁאַרְנוּ
  choice: kami ay naiwan
  rationale: 'Pinananatili ang pasibong diwa ng Niphal: sila ay natirang buháy o naiwan matapos ang paghatol.'
- source_word: פְלֵיטָה
  choice: isang naligtas na nalabi
  rationale: Pinagsasama ang diwa ng mga nakaligtas at ng nalabing pangkat; iniiwasang gawing abstraktong 'pagtakas' ang tinutukoy na mga tao.
- source_word: כְּהַיּוֹם הַזֶּה
  choice: gaya ng kalagayan namin ngayon
  rationale: Likas na Filipino para sa Hebreong idyoma na tumutukoy sa kasalukuyang kalagayang hayag sa araw na iyon.
- source_word: הִנְנוּ לְפָנֶיךָ
  choice: Narito kami sa harapan mo
  rationale: Naipahahayag ang presentatibong diin ng הִנְנוּ nang hindi gumagamit ng makalumang pananalita.
- source_word: בְּאַשְׁמָתֵינוּ
  choice: taglay ang aming pagkakasala
  rationale: Ipinapakita ang kanilang kalagayang may sala sa harapan ng Diyos, hindi lamang ang isang damdamin ng pagkakasala.
- source_word: כִּי אֵין לַעֲמוֹד לְפָנֶיךָ
  choice: sapagkat ... hindi kami makatatayo sa harapan mo
  rationale: Ginagawang natural sa Filipino ang impersonal na Hebreong konstruksyon habang inuugnay sa nagsasalitang 'kami'; ang 'makatatayo' ay nagpapanatili sa larawang hudisyal at presensiyal.
- source_word: עַל זֹאת
  choice: dahil dito
  rationale: Pinananatili ang sanhi at ang sadyang di-tiyak na pagtukoy pabalik sa kasalanang ipinahayag sa konteksto.
theological_decisions:
- issue: Pagbibigay ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Pangalan mismo ang nasa Hebreo; pinananatili ito sa salin sa halip na palitan ng titulo.
- issue: Kahulugan ng צַדִּיק tungkol sa Diyos
  choice: matuwid
  alternative: makatarungan
  rationale: Ang 'matuwid' ay mas malawak at naiiwang magkasama ang katuwiran ng Diyos sa paghatol at ang awa niyang nagpapanatili ng nalabi.
- issue: Paksa ng אֵין לַעֲמוֹד
  choice: hindi kami makatatayo
  alternative: walang sinumang makatatayo; hindi maaaring makatayo
  rationale: Impersonal ang Hebreo, ngunit ang agarang konteksto ay ang nagsasalitang pamayanan. Natural sa Filipino ang 'kami' at hindi nito binabago ang praktikal na saklaw ng pag-amin.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “O Yahweh” bilang taimtim na tuwirang pagtawag. Iniwasan ang labis na teknikal o denominasyonal na pananalita; pinanatili ang pag-igting sa pagitan ng katuwiran ng Diyos, pagkaligtas ng nalabi, at kawalang-kakayahan nilang tumayo sa harapan niya.
