revisions:
- from: O Yahweh, Diyos ng Israel, ikaw ay matuwid. Sapagkat kami ay naiwang isang naligtas na nalabi[a], gaya ng kalagayan namin ngayon. Narito kami sa harapan mo, taglay ang aming pagkakasala, sapagkat dahil dito ay hindi kami makatatayo sa harapan mo.[b]
  to: O Yahweh, Diyos ng Israel, ikaw ay matuwid, sapagkat kami ay naiwang nalabi[a], gaya ng kalagayan namin ngayon. Narito kami sa harapan mo, taglay ang aming pagkakasala, sapagkat walang sinumang makatatayo sa harapan mo dahil dito.[b]
  rationale: Inayos ang salin upang hindi mapaliit ang impersonal na pahayag na “walang sinumang makatatayo,” at ginawang mas natural ang paglalarawan sa nalabi nang hindi nawawala ang diwa ng pagkaligtas at pag-iiwan. Pinanatili ang sanhi, ang kasalukuyang kalagayan, at ang marangal na panalanginang rehistro ng talata.
