  text: וְ/אֵלַ֣/י יֵאָסְפ֗וּ כֹּ֤ל חָרֵד֙ בְּ/דִבְרֵ֣י אֱלֹהֵֽי יִשְׂרָאֵ֔ל עַ֖ל מַ֣עַל הַ/גּוֹלָ֑ה וַ/אֲנִי֙ יֹשֵׁ֣ב מְשׁוֹמֵ֔ם עַ֖ד לְ/מִנְחַ֥ת הָ/עָֽרֶב־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/009/004.yaml
  text: Then everyone who trembled at the words of the God of Israel because of the unfaithfulness of the exiles gathered to me[b][a], while I sat appalled until the evening offering.
translation:
  language: tl
  text: Pagkatapos, nagtipon sa akin ang lahat ng may takot sa mga salita ng Diyos ng Israel dahil sa kawalang-katapatan ng pamayanan ng mga ipinatapon[a]. Nanatili akong nakaupo, lubhang nabigla, hanggang sa handog sa gabi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kawalang-katapatan ng mga ipinatapon.”
    reason: lexical_alternative
  - marker: b
    text: Ang “handog” ay salin ng minḥah, na madalas tumukoy lalo na sa handog na butil. Dito, ang regular na handog sa gabi ang nagsisilbing palatandaan ng oras.
    reason: cultural_note
lexical_decisions:
- source_word: יֵאָסְפוּ
  choice: nagtipon
  rationale: Ang Niphal ng אסף ay tumutukoy rito sa sama-samang paglapit ng mga tao kay Ezra. Likas sa Tagalog ang “nagtipon” at hindi nito labis na itinatakda kung pasibo o kusang-loob ang anyo.
- source_word: כֹּל חָרֵד
  choice: ang lahat ng nanginginig
  rationale: Kolektibo ang pang-isahang חָרֵד kasunod ng כֹּל. Pinananatili ng “nanginginig” ang taimtim na takot at pagkabahalang ipinahihiwatig ng Hebreo.
- source_word: בְּדִבְרֵי אֱלֹהֵי יִשְׂרָאֵל
  choice: sa mga salita ng Diyos ng Israel
  rationale: Maaaring ituro ng ב ang bagay o sanhi ng panginginig. Pinananatili ng “mga salita” ang anyong maramihan ng Hebreo.
- source_word: עַל מַעַל הַגּוֹלָה
  choice: dahil sa pagtataksil ng mga ipinatapon
  rationale: Ang מַעַל ay paglabag sa katapatan, lalo na sa ugnayan sa Diyos; malinaw at may wastong bigat ang “pagtataksil.” Ang הַגּוֹלָה ay tumutukoy sa pamayanan ng mga ipinatapon, kabilang sa kontekstong ito ang mga nakabalik.
- source_word: יֹשֵׁב מְשׁוֹמֵם
  choice: nanatili akong nakaupo, nasindak
  rationale: Ipinahahayag ng participle na יֹשֵׁב ang nagpapatuloy na kalagayan, samantalang ang מְשׁוֹמֵם ay matinding pagkabigla at pagkasindak. Natural sa modernong Tagalog ang pariralang ito nang hindi pinahihina ang damdamin.
- source_word: עַד לְמִנְחַת הָעָרֶב
  choice: hanggang sa oras ng handog sa gabi
  rationale: Maaaring tumukoy ang מִנְחָה sa handog na butil, ngunit dito ay nagsisilbi rin itong palatandaan ng oras ng regular na paghahandog. Nililinaw ng “oras ng” ang gamit nito sa pangungusap nang hindi inaalis ang kultikong sanggunian.
theological_decisions:
- issue: Kahulugan ng מַעַל sa konteksto ng paglabag sa katapatan sa Diyos
  choice: pagtataksil
  alternative: paglabag; kawalang-katapatan
  rationale: Ipinahihiwatig ng salita ang pagsira sa pananagutan at katapatan sa Diyos, hindi lamang pangkalahatang pagkakamali. Hindi ito nilalagyan ng mas makitid na katawagang doktrinal.
- issue: Saklaw ng הַגּוֹלָה
  choice: mga ipinatapon
  alternative: pamayanan ng mga ipinatapon; mga bumalik mula sa pagkakatapon
  rationale: Pinananatili ng “mga ipinatapon” ang katawagang nakaugat sa karanasan ng pagkakatapon, habang iniiwasang tahasang idagdag sa pangunahing teksto ang “mga bumalik,” bagaman iyon ang ipinahihiwatig ng konteksto.
translation_notes:
  register: Modernong Filipino Tagalog na dignified ngunit madaling maunawaan. Ginamit ang “Diyos ng Israel,” “pagtataksil,” at “handog” bilang malinaw at pormal na mga salitang angkop sa tekstong biblikal. Ang mga panandang [a] at [b] ay inilagay mismo sa kaugnay na bahagi ng pangunahing teksto.
