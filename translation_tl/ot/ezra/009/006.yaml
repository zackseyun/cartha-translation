base_translation:
  language: en
  yaml_path: translation/ot/ezra/009/006.yaml
  text: And I said[a], “My God, I am ashamed and humiliated to lift up my face to you, my God, because our iniquities have multiplied above our heads, and our guilt has grown as high as the heavens.”
translation:
  language: tl
  text: At sinabi ko, “Diyos ko, nahihiya ako at napapahiya na itaas ang aking mukha sa iyo, Diyos ko, sapagkat dumami ang aming mga kasamaan at lumampas na sa aming mga ulo,[a] at ang aming pagkakasala ay lumaki hanggang sa langit.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “sa itaas ng aming ulo.” Singular ang “ulo” sa idyomang Hebreo ngunit kolektibo ang diwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמְרָה
  choice: At sinabi ko
  rationale: Pinananatili ang payak na daloy ng salaysay na ipinahihiwatig ng waw-consecutive.
- source_word: בֹּשְׁתִּי
  choice: nahihiya ako
  rationale: Likas na modernong Tagalog para sa kasalukuyang kalagayan ng personal na hiya, bagaman perfect ang anyong Hebreo.
- source_word: וְנִכְלַמְתִּי
  choice: at napapahiya
  rationale: Pinatitindi nito ang naunang pahayag ng hiya at ipinahahayag ang pagkadusta nang hindi gumagamit ng lipas o labis na teknikal na salita.
- source_word: לְהָרִים ... פָּנַי אֵלֶיךָ
  choice: na itaas ang aking mukha sa iyo
  rationale: Pinananatili ang tahasang larawan ng mukha sa Hebreo at ang diwa ng pagharap nang hayagan sa Diyos.
- source_word: עֲוֺנֹתֵינוּ
  choice: aming mga kasamaan
  rationale: Ipinahahayag ang mabigat na moral na diwa ng עָוֹן at inihihiwalay ito sa kasunod na terminong tumutukoy sa pagkakasala o pananagutan.
- source_word: רָבוּ
  choice: dumami
  rationale: Sinasalamin ang pandiwang diwa ng pagdami, hindi lamang ang pagiging marami.
- source_word: לְמַעְלָה רֹאשׁ
  choice: lumampas na sa aming mga ulo
  rationale: Natural na Tagalog na pinananatili ang patayong larawan ng mga kasamaang umapaw o tumaas lampas sa ulo; inilalahad sa talababa ang singular na idyomang Hebreo.
- source_word: אַשְׁמָתֵנוּ
  choice: aming pagkakasala
  rationale: Sa konteksto, tumutukoy ito sa salang nagdudulot ng pananagutan, hindi sa handog para sa pagkakasala.
- source_word: גָדְלָה עַד לַשָּׁמָיִם
  choice: lumaki hanggang sa langit
  rationale: Pinananatili ang eksaheradong patayong larawan sa maikli at natural na Tagalog.
- source_word: אֱלֹהַי
  choice: Diyos ko
  rationale: Direktang tawag ito sa Diyos; pinananatili ang dalawang paglitaw para sa diin.
