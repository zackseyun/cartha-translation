base_translation:
  language: en
  yaml_path: translation/ot/ezra/009/002.yaml
  text: For they have taken some of their daughters for themselves and for their sons[a], and the holy seed has mixed itself with the peoples of the lands[c][b]. And the hand of the officials and the deputies has been foremost in this unfaithfulness.
translation:
  language: tl
  text: Sapagkat kumuha sila ng ilan sa mga anak na babae ng mga ito para sa kanilang sarili at para sa kanilang mga anak na lalaki[a], at ang banal na binhi[b] ay nahalo sa mga mamamayan ng mga lupain. At ang mga pinuno at mga opisyal ang nanguna sa pagtataksil na ito.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nag-asawa sila ng ilan sa mga anak na babae ng mga ito.” Sa literal, “kumuha sila mula sa kanilang mga anak na babae.”
    reason: lexical_alternative
  - marker: b
    text: Ang “banal na binhi” ay maaari ding isaling “banal na supling.” Pinananatili ng Hebreo ang wikang tumutukoy sa lahing kabilang sa tipan.
    reason: lexical_alternative
  - marker: c
    text: Sa literal, “ang kamay ng mga pinuno at mga opisyal ang nauna sa pagtataksil na ito,” isang idyomang nagsasaad na sila ang pangunahing sangkot at nanguna rito.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָשְׂאוּ מִבְּנֹתֵיהֶם
  choice: kumuha sila ng ilan sa mga anak na babae ng mga ito
  rationale: Pinananatili ng “kumuha” ang konkretong pananalita ng Hebreo, habang ipinahihiwatig ng konteksto na pag-aasawa ang tinutukoy. Ipinakikita ng “ilan sa” ang partitive na gamit ng מִן.
- source_word: לָהֶם וְלִבְנֵיהֶם
  choice: para sa kanilang sarili at para sa kanilang mga anak na lalaki
  rationale: Malinaw na kapuwa ang mga lalaki at ang kanilang mga anak na lalaki ang kumuha ng mga babae bilang asawa.
- source_word: וְהִתְעָרְבוּ
  choice: ay nahalo
  rationale: Likas na salin sa Filipino para sa hitpael na nagpapahayag ng paghahalo o pakikihalo.
- source_word: זֶרַע הַקֹּדֶשׁ
  choice: ang banal na binhi
  rationale: Pinananatili ang matibay na pangtipan at pangkanunu-nunuang talinghaga ng Hebreo, sa halip na gawin itong tahasang lahi o biyolohikal na kategorya.
- source_word: בְּעַמֵּי הָאֲרָצוֹת
  choice: sa mga bayan ng mga lupain
  rationale: Pinananatili ang mga pangmaramihang anyo at ang post-exilic na larawan ng nakapaligid na mga bayan at lupain.
- source_word: הַשָּׂרִים וְהַסְּגָנִים
  choice: ang mga pinuno at mga opisyal
  rationale: Natural at makabagong katawagan para sa dalawang uri ng mga namamahala, nang hindi nagpapahiwatig ng ranggong maharlika.
- source_word: מַּעַל
  choice: pagtataksil
  rationale: Ipinahahayag nito ang paglabag sa katapatan, lalo na ang pangtipang diwa ng מעל, nang higit kaysa sa pangkalahatang “kasalanan.”
- source_word: וְיַד ... רִאשׁוֹנָה
  choice: ang ... ang nanguna
  rationale: Isinasalin nang idiomatiko ang Hebreong larawan ng “kamay” na naging una, upang malinaw na ang mga lider ang pangunahing sangkot at nanguna sa pagkakasala.
theological_decisions:
- issue: Kahulugan ng “banal na binhi” sa konteksto ng pakikipag-asawa sa mga nakapaligid na bayan
  choice: Panatilihin ang pangtipang katawagang “banal na binhi” nang hindi ito pinalalawak bilang teoryang panlahi.
  alternative: “banal na supling” o isang pagpapakahulugang nakatuon sa etnikong kadalisayan
  rationale: Hayaan ang matinding pangtipang pananalita ng teksto na manatili sa konteksto ng banal na sambayanan, nang hindi nagdaragdag ng mga makabagong kategoryang panlahi.
- issue: Pananagutan ng mga pinuno
  choice: “ang mga pinuno at mga opisyal ang nanguna sa pagtataksil na ito”
  alternative: “ang kamay ng mga pinuno at mga opisyal ang nauna sa pagtataksil na ito”
  rationale: Ipinakikita ng idiomang Hebreo ang aktibong pakikilahok at pangunahing pananagutan. Ang idiomatikong Filipino ay mas malinaw habang pinananatili ang diin.
translation_notes:
  register: Makabago, dignified, at madaling maunawaang Filipino. Ginamit ang “kumuha” upang mapanatili ang anyo ng Hebreo, kalakip ang talababa para sa malinaw na diwang pag-aasawa. Isinalin nang idiomatiko ang huling sugnay upang hindi maging alanganin sa Filipino, habang inilagay sa talababa ang literal na larawan ng “kamay.”
