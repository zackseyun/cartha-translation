  text: וּ/בְ/מִנְחַ֣ת הָ/עֶ֗רֶב קַ֚מְתִּי מִ/תַּֽעֲנִיתִ֔/י וּ/בְ/קָרְעִ֥/י בִגְדִ֖/י וּ/מְעִילִ֑/י וָֽ/אֶכְרְעָ/ה֙ עַל בִּרְכַּ֔/י וָ/אֶפְרְשָׂ֥/ה כַפַּ֖/י אֶל יְהוָ֥ה אֱלֹהָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/009/005.yaml
  text: At the evening offering I rose from my fasting[a], with my garment and my robe torn, and I fell on my knees and spread out my hands to Yahweh my God.
translation:
  language: tl
  text: Sa oras ng handog sa gabi[a], bumangon ako mula sa aking pag-aayuno, habang punit ang aking kasuutan at balabal. Lumuhod ako at iniunat ko ang aking mga kamay kay Yahweh, aking Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas tiyak, “handog na butil sa gabi.” Ang salitang Hebreo ay madalas tumukoy sa handog na butil, ngunit dito maaari rin itong tumukoy sa oras ng panggabing paghahandog sa pangkalahatan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְמִנְחַת הָעֶרֶב
  choice: Nang oras ng handog sa gabi
  rationale: Ang מִנְחָה ay maaaring tumukoy sa handog, lalo na sa handog na butil, ngunit sa pariralang ito maaari rin nitong tukuyin ang takdang panahon ng panggabing paghahandog. Ang “oras ng handog sa gabi” ay natural sa Filipino at pinananatili sa talababa ang mas tiyak na kahulugan.
- source_word: קַמְתִּי מִתַּעֲנִיתִי
  choice: bumangon ako mula sa aking pag-aayuno
  rationale: Ang קום ay “bumangon,” at ang תַּעֲנִית ay karaniwang tumutukoy sa pag-aayuno bilang pagpapakumbaba o pagpapahirap sa sarili. Ang parirala ay malinaw at tuwirang naglalarawan sa kilos ni Ezra.
- source_word: וּבְקָרְעִי בִגְדִי וּמְעִילִי
  choice: habang punit pa rin ang aking kasuutan at balabal
  rationale: Ipinahihiwatig ng konteksto na napunit na ni Ezra ang mga ito bilang tanda ng pagluluksa. Nililinaw ng “pa rin” ang nagpapatuloy na kalagayan, samantalang pinananatili ng “kasuutan” at “balabal” ang pagkakaiba ng בֶּגֶד at מְעִיל.
- source_word: וָאֶכְרְעָה עַל בִּרְכַּי
  choice: lumuhod ako
  rationale: Ang כרע ay yumukod o lumuhod. Hindi na kailangang ulitin ang literal na “sa aking mga tuhod” sa Filipino dahil likas na itong saklaw ng pandiwang “lumuhod.”
- source_word: וָאֶפְרְשָׂה כַפַּי
  choice: iniunat ang aking mga kamay
  rationale: Ang פרשׂ na kasama ng כַּפַּיִם ay naglalarawan ng pagbubukas o pag-uunat ng mga kamay sa panalangin. Ang “iniunat ang aking mga kamay” ay natural at pinananatili ang pisikal na larawan.
- source_word: אֶל יְהוָה אֱלֹהָי
  choice: kay Yahweh na aking Diyos
  rationale: Tuwirang isinasalin ang pangalang tipan na יהוה bilang “Yahweh.” Ang “na aking Diyos” ay likas na Filipino para sa אֱלֹהָי habang pinananatili ang personal na ugnayang ipinahahayag ni Ezra.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: ang PANGINOON
  rationale: Ginagamit ng Hebreong teksto ang Tetragrammaton bilang sariling pangalan ng Diyos. Ang “Yahweh” ay nagpapanatili rito bilang pangalan sa halip na palitan ng isang titulo.
- issue: Kahulugan ng תַּעֲנִיתִי
  choice: aking pag-aayuno
  alternative: aking pagpapakumbaba sa sarili
  rationale: Maaaring magtaglay ang salita ng ideya ng pagpapahirap o pagpapakumbaba sa sarili, ngunit sa kontekstong ito ang pag-aayuno ang malamang na kongkretong gawain. Hindi nito inaalis ang kaugnay na diwa ng pagluluksa at pagpapakumbaba.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kasuutan” at “balabal” upang mapanatili ang dalawang magkaibang katawagang Hebreo, at hinati sa dalawang pangungusap ang mahabang pagkakasunod-sunod upang maging natural basahin nang hindi binabago ang daloy ng mga kilos.
