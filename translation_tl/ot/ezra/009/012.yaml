  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ֠/עַתָּה בְּֽנוֹתֵי/כֶ֞ם אַל תִּתְּנ֣וּ לִ/בְנֵי/הֶ֗ם וּ/בְנֹֽתֵי/הֶם֙ אַל תִּשְׂא֣וּ לִ/בְנֵי/כֶ֔ם וְ/לֹֽא תִדְרְשׁ֧וּ שְׁלֹמָ֛/ם וְ/טוֹבָתָ֖/ם עַד עוֹלָ֑ם לְמַ֣עַן תֶּחֶזְק֗וּ וַ/אֲכַלְתֶּם֙ אֶת ט֣וּב הָ/אָ֔רֶץ וְ/הוֹרַשְׁתֶּ֥ם לִ/בְנֵי/כֶ֖ם עַד עוֹלָֽם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/009/012.yaml
  text: So now[a], do not give your daughters to their sons, and do not take their daughters for your sons. Never seek their peace or their prosperity[b], so that you may be strong and eat the good of the land and leave it as an inheritance to your sons forever.
translation:
  language: tl
  text: Kaya ngayon, huwag ninyong ibigay ang inyong mga anak na babae sa kanilang mga anak na lalaki, at huwag ninyong kunin ang kanilang mga anak na babae para sa inyong mga anak na lalaki. Huwag ninyong hangarin kailanman ang kanilang kapayapaan o kapakanan[a], upang lumakas kayo, makain ang mabubuting bagay ng lupain, at ipamana ninyo ito sa inyong mga anak na lalaki magpakailanman.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa literal: “Huwag ninyong hanapin ang kanilang kapayapaan at ang kanilang kabutihan magpakailanman.”'
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring: “at ipamana ninyo sa inyong mga anak na lalaki ang mabuti ng lupain magpakailanman.”'
    reason: referential_ambiguity
lexical_decisions:
- source_word: וְעַתָּה
  choice: Kaya ngayon
  rationale: Ipinag-uugnay nito ang utos sa naunang pahayag at natural na isinasalin ang Hebreong panandang pangwakas o pangbunga.
- source_word: בְּנוֹתֵיכֶם ... לִבְנֵיהֶם
  choice: ibigay ang inyong mga anak na babae sa kanilang mga anak na lalaki
  rationale: Pinananatili ang konkretong Hebreong pahayag; malinaw sa kaparis na sugnay na pag-aasawa ang tinutukoy.
- source_word: וּבְנֹתֵיהֶם אַל תִּשְׂאוּ לִבְנֵיכֶם
  choice: huwag ninyong kunin ang kanilang mga anak na babae para sa inyong mga anak na lalaki
  rationale: Ang נשׂא ay idyoma rito para sa pagkuha bilang asawa; ang salin ay nagpapanatili sa paralelismo at hindi nagdaragdag nang di-kailangan.
- source_word: תִדְרְשׁוּ
  choice: hangarin
  rationale: Ipinahihiwatig ng דרש ang aktibong paghahanap o pagtataguyod; ang “hangarin” ay likas sa Filipino kasama ng kapayapaan at kapakanan.
- source_word: שְׁלֹמָם
  choice: kanilang kapayapaan
  rationale: Pinananatili ang tuwirang kahulugan ng שָׁלוֹם at ang kaibhan nito sa kasunod na טוֹבָה.
- source_word: וְטוֹבָתָם
  choice: o kapakanan
  rationale: Saklaw ng טוֹבָה ang kabutihan, kagalingan, at kasaganaan; “kapakanan” ang natural at sapat na malawak na katumbas sa konteksto.
- source_word: עַד עוֹלָם
  choice: kailanman
  rationale: Sa negatibong utos, natural na ipinapahayag ng “huwag ... kailanman” ang tuloy-tuloy at ganap na pagbabawal.
- source_word: לְמַעַן תֶּחֶזְקוּ
  choice: upang lumakas kayo
  rationale: Pinananatili ang layuning ipinakikilala ng לְמַעַן at ang Qal na diwang ‘maging o lumakas.’
- source_word: וַאֲכַלְתֶּם אֶת טוּב הָאָרֶץ
  choice: makain ang mabubuting bunga ng lupain
  rationale: Pinananatili ang konkretong larawan ng pagkain, samantalang nililinaw na ang “mabuti ng lupain” ay ang biyaya o ani nitong napakikinabangan.
- source_word: וְהוֹרַשְׁתֶּם
  choice: maipamana ito
  rationale: 'Ipinapahayag ang causative na Hiphil ng ירש: ipasa bilang mana. Ang “ito” ay tumutukoy sa lupain ayon sa konteksto, bagaman maaaring iugnay sa kabutihan nito.'
- source_word: לִבְנֵיכֶם
  choice: sa inyong mga anak na lalaki
  rationale: Tiyak na panlalaking maramihan ang Hebreo; pinananatili ito sa halip na gawing pangkalahatang “mga anak.”
- source_word: עַד עוֹלָם
  choice: magpakailanman
  rationale: Sa hulihan, inilalarawan nito ang pangmatagalang pagpasa ng mana sa mga salinlahi.
theological_decisions:
- issue: Pagbabawal sa pakikipag-asawa at paghahangad ng kapakanan ng mga nakapaligid na bayan sa konteksto pagkatapos ng pagpapatapon
  choice: Tuwirang isinalin ang mahigpit na pagbabawal sa pag-aasawa at sa paghahangad ng kanilang kapayapaan o kapakanan sa partikular na tagpong pangtipan ng Ezra.
  alternative: Gawing pangkalahatang babala lamang laban sa masasamang impluwensiya, o palawakin bilang walang-hanggang utos tungkol sa lahat ng tagalabas.
  rationale: Hindi dapat pahupain ang tindi ng talata, ngunit hindi rin dapat magpasok ang salin ng aplikasyon o doktrinang lampas sa tahasang sinasabi nito.
- issue: Maaaring sanggunian ng panghalip sa וְהוֹרַשְׁתֶּם
  choice: Ginamit ang “ito” na likas na tumutukoy sa lupain bilang mana.
  alternative: Iugnay ang panghalip sa “mabubuting bunga/kabutihan ng lupain.”
  rationale: Sa konteksto ng pagmamana, lupain ang pinakanatural na ipinapamana, ngunit hindi ganap na tinutukoy ng anyong Hebreo ang layon kaya binanggit ang posibilidad sa talababa.
translation_notes:
  register: Makabagong, marangal, at madaling maunawaang Filipino. Pinanatili ang simetrikong mga utos, ang konkretong larawan ng pagkain mula sa lupain, at ang tiyak na “mga anak na lalaki.” Ang mga talababa ay tumutugon sa literal na anyo at sa tunay na kalabuan ng layon ng pandiwang “maipamana.”
