revisions:
- from: Kaya ngayon, huwag ninyong ibigay ang inyong mga anak na babae sa kanilang mga anak na lalaki, at huwag ninyong kunin ang kanilang mga anak na babae para sa inyong mga anak na lalaki. Huwag ninyong hangarin kailanman ang kanilang kapayapaan o kapakanan[a], upang lumakas kayo, makain ang mabubuting bunga ng lupain, at maipamana ito sa inyong mga anak na lalaki magpakailanman.[b]
  to: Kaya ngayon, huwag ninyong ibigay ang inyong mga anak na babae sa kanilang mga anak na lalaki, at huwag ninyong kunin ang kanilang mga anak na babae para sa inyong mga anak na lalaki. Huwag ninyong hangarin kailanman ang kanilang kapayapaan o kapakanan[a], upang lumakas kayo, makain ang mabubuting bagay ng lupain, at ipamana ninyo ito sa inyong mga anak na lalaki magpakailanman.[b]
  rationale: Pinalawak ang “bunga” tungo sa “mabubuting bagay” upang huwag limitahan ang saklaw ng טוּב הָאָרֶץ sa ani lamang. Ginawang aktibo ang “ipamana ninyo” upang maipakita ang causative na anyo ng Hebreo. Pinanatili ang “ito” at ang talababa dahil hindi tahasang pinapangalanan ng pandiwang Hebreo ang layon; maaari itong tumukoy sa lupain, sa kabutihan nito, o sa mana/ari-ariang ipinapasa sa konteksto.
