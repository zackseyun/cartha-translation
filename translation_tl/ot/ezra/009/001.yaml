  source_fidelity: Kailangang alisin ang idinagdag na salungatang “kundi namuhay sila,” na wala sa Hebreo at nagiging hiwalay na pahayag ang pariralang כְּתוֹעֲבֹתֵיהֶם. Ang binagong salin ay mas malapit na ikinakabit ang pariralang ito sa paratang na hindi nila ibinukod ang kanilang sarili. Pinalitan din ang “mga bayan” ng “mga mamamayan,” sapagkat ang עַמֵּי ay tumutukoy sa mga pangkat o mamamayan, hindi sa mga pamayanan.
  naturalness: Ang dating “Hindi ibinukod ng bayang Israel—pati ng mga pari at mga Levita—ang kanilang sarili” ay mabigat at ang “pati ng” ay hindi malinaw na koordinasyon. Mas malinaw at likas ang magkatabing talaan ng tatlong pangkat. Ang “mga mamamayan ng mga lupain” ay natural na Filipino sa kontekstong etniko-heograpikal.
  terminology: Pinanatili ang “mga pinuno,” “mga Levita,” at ang matinding “kasuklam-suklam na mga gawain.” Pinanatili rin ang mga karaniwang Filipino anyo ng mga pangalang-etniko. Hindi tinutukoy ng salin ang mga gawaing ito bilang idolatriya lamang, bagaman binabanggit iyon bilang karaniwang saklaw sa talababa.
