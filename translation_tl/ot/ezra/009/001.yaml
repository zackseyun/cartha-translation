  text: וּ/כְ/כַלּ֣וֹת אֵ֗לֶּה נִגְּשׁ֨וּ אֵלַ֤/י הַ/שָּׂרִים֙ לֵ/אמֹ֔ר לֹֽא נִבְדְּל֞וּ הָ/עָ֤ם יִשְׂרָאֵל֙ וְ/הַ/כֹּהֲנִ֣ים וְ/הַ/לְוִיִּ֔ם מֵ/עַמֵּ֖י הָ/אֲרָצ֑וֹת כְּ֠/תוֹעֲבֹֽתֵי/הֶם לַ/כְּנַעֲנִ֨י הַ/חִתִּ֜י הַ/פְּרִזִּ֣י הַ/יְבוּסִ֗י הָֽ/עַמֹּנִי֙ הַ/מֹּ֣אָבִ֔י הַ/מִּצְרִ֖י וְ/הָ/אֱמֹרִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/009/001.yaml
  text: When these things were finished[a], the officials approached me, saying, “The people of Israel, and the priests and the Levites, have not separated themselves from the peoples of the lands, according to their abominations—the Canaanites, the Hittites, the Perizzites, the Jebusites, the Ammonites, the Moabites, the Egyptians, and the Amorites.”
translation:
  language: tl
  text: Nang matapos ang mga bagay na ito, lumapit sa akin ang mga pinuno at sinabi, “Hindi ibinukod ng bayang Israel, ng mga pari, at ng mga Levita ang kanilang sarili mula sa mga mamamayan ng mga lupain, ayon sa kasuklam-suklam na mga gawain ng mga ito[a]—ang mga Cananeo, Heteo, Perezeo, Jebuseo, Ammonita, Moabita, Ehipsiyo, at Amoreo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “kasama ng kanilang kasuklam-suklam na mga gawain.” Matindi ang salitang Hebreo at madalas tumutukoy sa mga gawaing kasuklam-suklam sa Diyos, lalo na sa larangan ng pagsamba.'
    reason: Pinananatili ang posibleng pagkakaiba sa ugnayang ipinahihiwatig ng כְּ at ang matinding moral-panrelihiyong diwa ng תּוֹעֵבוֹת.
lexical_decisions:
- source_word: וּכְכַלּוֹת אֵלֶּה
  choice: Nang matapos ang mga bagay na ito
  rationale: Ipinapahayag ng pang-ukol at infinitive construct ang panahong kaugnayan. Natural sa Filipino ang “Nang matapos” at hindi nagdaragdag ng tahasang salitang katumbas ng “ngayon.”
- source_word: נִגְּשׁוּ אֵלַי
  choice: lumapit sa akin
  rationale: Tuwirang ipinapahayag ang paglapit kay Ezra at natural sa modernong Filipino.
- source_word: הַשָּׂרִים
  choice: ang mga pinuno
  rationale: Ang שׂרים ay mga namumuno o opisyal. Ang “mga pinuno” ay malinaw at hindi nagpapahiwatig na mga anak sila ng hari.
- source_word: לֵאמֹר
  choice: at sinabi
  rationale: Ginawang likas na pambungad sa tuwirang pananalita sa Filipino ang Hebreong quotative infinitive.
- source_word: לֹא נִבְדְּלוּ
  choice: Hindi ibinukod ... ang kanilang sarili
  rationale: 'Pinananatili ang reflexive na diwa ng Niphal: ang mga grupong tinutukoy mismo ang hindi humiwalay o nagbukod sa kanilang sarili.'
- source_word: הָעָם יִשְׂרָאֵל וְהַכֹּהֲנִים וְהַלְוִיִּם
  choice: ang bayang Israel—pati ng mga pari at mga Levita—
  rationale: Saklaw ng iisang paratang ang bayan, mga pari, at mga Levita. Nililinaw ng gitling at “pati” ang koordinasyon nang hindi nililimitahan ang saklaw.
- source_word: מֵעַמֵּי הָאֲרָצוֹת
  choice: mula sa mga bayan ng mga lupain
  rationale: Pinananatili ang kapwa maramihang anyo ng “mga bayan” at “mga lupain,” bagaman bahagyang pormal ang parirala.
- source_word: כְּתוֹעֲבֹתֵיהֶם
  choice: namuhay sila ayon sa kasuklam-suklam na mga gawain ng mga ito
  rationale: Ang prefixed כ ay nagpapahiwatig ng pakikiayon o pagtulad. Ginagawang malinaw sa Filipino ang ugnayan, habang pinananatili ng “kasuklam-suklam” ang matinding moral at panrelihiyong bigat ng תועבות.
- source_word: לַכְּנַעֲנִי ... וְהָאֱמֹרִי
  choice: ng mga Cananeo, Heteo, Perezeo, Jebuseo, Ammonita, Moabita, Ehipsiyo, at Amoreo
  rationale: Ang mga isahang pang-etnikong anyo sa Hebreo ay tumutukoy sa mga pangkat; kaya maramihan ang panandang “mga” sa Filipino. Ginamit ang karaniwang anyong Filipino ng mga pangalan.
theological_decisions:
- issue: Lakas at saklaw ng תועבות
  choice: kasuklam-suklam na mga gawain
  alternative: mga karumaldumal na bagay
  rationale: Pinananatili nito ang matinding paghatol sa mga gawaing moral at panrelihiyon nang hindi nililimitahan ang salita sa idolatriya lamang.
- issue: Ugnayan ng כְּתוֹעֲבֹתֵיהֶם sa hindi pagbubukod
  choice: kundi namuhay sila ayon sa kasuklam-suklam na mga gawain ng mga ito
  alternative: kasama ng kanilang mga kasuklam-suklam na gawain
  rationale: Ang Hebreong כ ay maaaring magpahayag ng pagkakatulad o pakikiayon. Ipinahihiwatig ng pangunahing salin ang pagtulad sa mga gawain, ngunit itinatala sa talababa ang mas pormal na alternatibo upang hindi ikubli ang sintaktikong kalabuan.
- issue: Saklaw ng paratang
  choice: ang bayang Israel—pati ng mga pari at mga Levita—
  alternative: ang bayang Israel, ang mga pari, at ang mga Levita
  rationale: Magkakapantay na saklaw ng pandiwang paratang ang tatlong grupo. Hindi ipinapalagay na pangalawa lamang o di-gaanong sangkot ang mga pari at Levita.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinili ang “mga pinuno” sa halip na “mga prinsipe,” at “kasuklam-suklam na mga gawain” upang mapanatili ang tindi nang hindi maging lipas o labis na teknikal. Ang gitling ay tumutulong upang malinaw na saklaw ng paratang ang bayan, mga pari, at mga Levita.
