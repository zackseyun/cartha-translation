  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/עַתָּ֡ה כִּ/מְעַט רֶגַע֩ הָיְתָ֨ה תְחִנָּ֜ה מֵ/אֵ֣ת יְהוָ֣ה אֱלֹהֵ֗י/נוּ לְ/הַשְׁאִ֥יר לָ֨/נוּ֙ פְּלֵיטָ֔ה וְ/לָ/תֶת לָ֥/נוּ יָתֵ֖ד בִּ/מְק֣וֹם קָדְשׁ֑/וֹ לְ/הָאִ֤יר עֵינֵ֨י/נוּ֙ אֱלֹהֵ֔י/נוּ וּ/לְ/תִתֵּ֛/נוּ מִֽחְיָ֥ה מְעַ֖ט בְּ/עַבְדֻתֵֽ/נוּ־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/009/008.yaml
  text: But now[a], for a brief moment, favor has come from Yahweh our God, to leave us a remnant that has escaped and to give us a peg in his holy place[c][b], so that our God may brighten our eyes and give us a little reviving in our slavery.
translation:
  language: tl
  text: 'Ngunit ngayon, sa maikling sandali, nagkaloob si Yahweh na ating Diyos ng lingap: nag-iwan siya para sa atin ng isang nalabi ng mga nakaligtas at nagbigay siya sa atin ng isang tulos[a] sa kanyang banal na lugar, upang paliwanagin[b] ng ating Diyos ang ating mga mata at bigyan tayo ng kaunting bagong sigla habang nasa pagkaalipin[c] tayo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “matibay na kapit.” Pinananatili ng Hebreo ang kongkretong larawan ng isang tulos na matatag na nakabaon.
    reason: lexical_alternative
  - marker: b
    text: Ang “paliwanagin ang ating mga mata” ay idyomang tumutukoy sa pagbabalik ng sigla o pag-asa.
    reason: idiom_explanation
  - marker: c
    text: O “pagkabusabos” o “kalagayang alipin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תְחִנָּה
  choice: lingap
  rationale: Sa pariralang הָיְתָה ... מֵאֵת יְהוָה, tumutukoy ito sa pabor o habag na ipinagkaloob ng Diyos, hindi sa pagsusumamo ng Israel. Ang “lingap” ay natural at marangal nang hindi nagdaragdag ng partikular na sistematikong pakahulugan.
- source_word: פְּלֵיטָה
  choice: nalabing nakatakas
  rationale: Pinananatili nito kapuwa ang diwa ng mga nakaligtas o nakatakas at ang pagiging nalabi ng pamayanang iningatan matapos ang pagkatapon.
- source_word: יָתֵד
  choice: tulos
  rationale: Ang literal at kongkretong larawan ay isang tulos o peg na matatag na nakabaon. Pinanatili ito sa teksto sa halip na palitan agad ng abstraktong “matatag na lugar.”
- source_word: בִּמְקוֹם קָדְשׁוֹ
  choice: sa kanyang banal na lugar
  rationale: Tuwirang sinasalamin nito ang Hebreo at maaaring tumukoy sa santuwaryo o templong sentro nang hindi labis na nililimitahan ang kahulugan.
- source_word: לְהָאִיר עֵינֵינוּ
  choice: paliwanagin ang ating mga mata
  rationale: Pinananatili ang idyomang Hebreo tungkol sa pagbabalik ng sigla at pag-asa, habang malinaw pa rin sa modernong Filipino.
- source_word: מִחְיָה
  choice: panibagong-buhay
  rationale: Ipinahahayag nito ang pagpapanatili o pagpapanumbalik ng buhay at lakas sa kalagayan ng bayan pagkatapos ng pagkatapon.
- source_word: בְּעַבְדֻתֵנוּ
  choice: habang nasa pagkaalipin tayo
  rationale: Pinananatili ang bigat ng kalagayang nasa ilalim ng kapangyarihan ng ibang imperyo; mas matindi ito kaysa karaniwang paglilingkod.
- source_word: כִּמְעַט רֶגַע
  choice: sa maikling sandali
  rationale: Inihahatid nito ang kaiklian at kaliitan ng panahong ipinagkaloob na ginhawa.
- source_word: הָיְתָה ... מֵאֵת יְהוָה אֱלֹהֵינוּ
  choice: pinagkalooban tayo ng lingap ni Yahweh na ating Diyos
  rationale: Natural na Filipino ito para sa eksistensiyal na sugnay at malinaw na ipinakikitang si Yahweh ang pinagmulan ng lingap.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tahasang ginagamit ng Hebreo ang Tetragrammaton. Ang “Yahweh” ay transliterasyong nagpapanatili sa personal na pangalang tipan nang hindi ito pinapalitan ng titulo.
- issue: Metapora ng יָתֵד sa banal na lugar
  choice: panatilihin ang kongkretong larawang “tulos”
  alternative: matatag na lugar; matibay na kapit
  rationale: Hindi tahasang nilulutas ng teksto kung ang larawan ay pangunahing tumutukoy sa matatag na paninirahan, seguridad, o pananatili kaugnay ng templo. Pinananatili ng salin ang teolohikal at matalinghagang lawak nito.
- issue: Kalagayan ng bayan sa בְּעַבְדֻתֵנוּ
  choice: pagkaalipin
  alternative: paglilingkod; pagkabusabos
  rationale: Kahit nakabalik ang ilan mula sa pagkatapon, nananatili silang sakop ng kapangyarihang imperyal. Hindi pinapawi ng salin ang tensiyon sa pagitan ng pagpapanumbalik at patuloy na pagkaalipin.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “lingap,” “nalabing nakatakas,” at “panibagong-buhay” upang maging natural ngunit malapit sa Hebreo. Pinanatili ang mga kongkretong metapora at ang tensiyon ng bahagyang pagpapanumbalik habang nananatiling sakop ng ibang kapangyarihan.
