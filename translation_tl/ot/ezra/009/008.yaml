revisions:
- from: 'Ngunit ngayon, sa maikling sandali, pinagkalooban tayo ng lingap ni Yahweh na ating Diyos: nag-iwan siya sa atin ng nalabing nakatakas at nagbigay sa atin ng isang tulos[a] sa kanyang banal na lugar, upang paliwanagin[b] ng ating Diyos ang ating mga mata at bigyan tayo ng kaunting panibagong-buhay habang nasa pagkaalipin[c] tayo.'
  to: 'Ngunit ngayon, sa maikling sandali, nagkaloob si Yahweh na ating Diyos ng lingap: nag-iwan siya para sa atin ng isang nalabi ng mga nakaligtas at nagbigay siya sa atin ng isang tulos[a] sa kanyang banal na lugar, upang paliwanagin[b] ng ating Diyos ang ating mga mata at bigyan tayo ng kaunting bagong sigla habang nasa pagkaalipin[c] tayo.'
  rationale: Ginawa ang maliliit na pagbabago para sa natural na modernong Filipino at mas malinaw na sintaks, nang hindi binabago ang saklaw ng Hebreo. Pinanatili ang temporal na “sa maikling sandali,” ang literal na “tulos,” ang idyoma tungkol sa mga mata, at ang tensiyon ng bahagyang pagsigla sa patuloy na pagkaalipin.
