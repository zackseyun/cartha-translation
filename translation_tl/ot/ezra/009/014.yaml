  text: הֲ/נָשׁוּב֙ לְ/הָפֵ֣ר מִצְוֺתֶ֔י/ךָ וּ֨/לְ/הִתְחַתֵּ֔ן בְּ/עַמֵּ֥י הַ/תֹּעֵב֖וֹת הָ/אֵ֑לֶּה הֲ/ל֤וֹא תֶֽאֱנַף בָּ֨/נוּ֙ עַד כַּלֵּ֔ה לְ/אֵ֥ין שְׁאֵרִ֖ית וּ/פְלֵיטָֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/009/014.yaml
  text: Shall we again break your commandments and intermarry with the peoples of these abominations? Would you not be angry with us until you had consumed us[b][a], leaving no remnant or survivor?
translation:
  language: tl
  text: Muli ba kaming lalabag sa iyong mga utos at makikipag-asawa sa mga bayang gumagawa ng mga kasuklam-suklam na ito[a]? Hindi ka ba magagalit sa amin hanggang sa lubos mo kaming lipulin, anupat wala nang nalabi o nakaligtas[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “sa mga bayan ng mga kasuklam-suklam na ito.” Malamang na inilalarawan ng Hebreo ang mga bayan ayon sa kanilang kasuklam-suklam na mga gawain.'
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring isalin: “anupat wala nang nalabi ni isang nakatakas.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲנָשׁוּב
  choice: Muli ba naming
  rationale: Ang literal na diwang “babalik ba kami” ay tumutukoy rito sa muling paggawa ng kasalanan; natural itong ipinahahayag sa Filipino sa pamamagitan ng “muli.”
- source_word: לְהָפֵר
  choice: lalabagin
  rationale: Sa kontekstong legal at tipan, ang pandiwa ay nangangahulugang sumuway o lumabag. Ang “lalabagin” ay malinaw at angkop sa “mga utos.”
- source_word: מִצְוֺתֶיךָ
  choice: ang iyong mga utos
  rationale: Pinananatili nito ang tuwirang pakikipag-usap sa Diyos at ang maramihang anyo ng salitang Hebreo.
- source_word: וּלְהִתְחַתֵּן
  choice: at makikipag-asawa
  rationale: Ipinahahayag ng anyong Hitpael ang pagpasok sa ugnayang pag-aasawa sa ibang pangkat; likas at malinaw ang “makikipag-asawa” sa modernong Filipino.
- source_word: בְּעַמֵּי הַתֹּעֵבוֹת הָאֵלֶּה
  choice: sa mga bayang gumagawa ng mga kasuklam-suklam na ito
  rationale: Ang siksik na pariralang Hebreo ay literal na “sa mga bayan ng mga kasuklam-suklam na ito.” Ipinakikita ng salin na mga gawain ang tinutukoy na kasuklam-suklam, hindi ang kanilang etnisidad; inilalagay sa talababa ang mas literal na anyo.
- source_word: הֲלוֹא תֶאֱנַף בָּנוּ
  choice: Hindi ka ba magagalit sa amin
  rationale: Pinananatili nito ang retorikal na tanong at ang tuwirang kahulugan ng galit ng Diyos nang hindi pinalalabis ang tindi.
- source_word: עַד כַּלֵּה
  choice: hanggang sa lubos mo kaming lipulin
  rationale: Ang כלה ay nagpapahiwatig ng pagdadala sa ganap na wakas o lubos na pag-ubos; malinaw na naihahatid ito ng “lubos ... lipulin.”
- source_word: לְאֵין
  choice: nang wala nang
  rationale: 'Ipinakikilala nito ang resulta ng lubos na paglipol: wala nang natitira.'
- source_word: שְׁאֵרִית
  choice: nalabi
  rationale: Pinananatili ng “nalabi” ang mahalagang biblikal na diwa ng isang remnant na nananatili matapos ang paghatol.
- source_word: וּפְלֵיטָה
  choice: o nakaligtas
  rationale: Sa pagkakaparis nito sa “nalabi,” ang konkretong diwang isang nakatakas o nakaligtas ang pinakaangkop sa konteksto.
theological_decisions:
- issue: Paglalarawan sa nakapaligid na mga bayan kaugnay ng “mga kasuklam-suklam”
  choice: Iugnay ang mga kasuklam-suklam sa ginagawa ng mga bayan, hindi sa kanilang likas na etnikong pagkatao.
  alternative: “sa mga bayan ng mga kasuklam-suklam na ito”
  rationale: Maikli at maaaring magkaroon ng higit sa isang ugnayan ang konstruksiyong Hebreo. Sa konteksto, ang pagbabawal ay nakaugnay sa kasuklam-suklam na mga gawa; iniiwasan ng pangunahing salin ang pahiwatig na ang etnisidad mismo ang kasuklam-suklam, habang pinananatili sa talababa ang literal na anyo.
- issue: Pagpapanatili sa terminong “nalabi”
  choice: Gamitin ang “nalabi” sa pangunahing teksto.
  alternative: “mga natira” o “mga nakaligtas”
  rationale: Bagaman mas biblikal ang tunog nito, nauunawaan pa rin ang “nalabi” at pinananatili nito ang mahalagang temang biblikal tungkol sa mga naiiwan matapos ang paghatol.
translation_notes:
  register: Modernong Filipino na magalang at marangal ngunit madaling maunawaan. Ginamit ang “lalabagin,” “makikipag-asawa,” at “lipulin” upang mapanatili ang bigat ng panalangin; pinanatili ang “nalabi” dahil mahalaga ang biblikal na ugnay nito.
