  text: וְ/עַתָּ֛ה מַה נֹּאמַ֥ר אֱלֹהֵ֖י/נוּ אַֽחֲרֵי זֹ֑את כִּ֥י עָזַ֖בְנוּ מִצְוֺתֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/009/010.yaml
  text: And now[a], what shall we say, our God, after this? For we have forsaken your commandments.
translation:
  language: tl
  text: At ngayon, aming Diyos, ano ang masasabi namin pagkatapos nito? Sapagkat tinalikuran namin ang iyong mga utos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: At ngayon
  rationale: Pinananatili ang pang-ugnay na וְ at ang panandang panahong עַתָּה bilang likas na paglipat sa kasunod na bahagi ng panalangin.
- source_word: מַה נֹּאמַר
  choice: ano ang masasabi namin
  rationale: 'Ipinahahayag nito sa natural na Tagalog ang deliberatibo at retorikal na diwa ng imperfect: hindi lamang pag-iisip kung ano ang susunod na sasabihin, kundi pagkawalang-masabi dahil sa pagkakasala.'
- source_word: אֱלֹהֵינוּ
  choice: aming Diyos
  rationale: Ang anyong may unang panauhang maramihang panlapi ay tuwirang pagtawag sa Diyos. Ang “aming” ay angkop sapagkat kausap ang Diyos at hindi siya kabilang sa pangkat na nagsasalita.
- source_word: אַחֲרֵי זֹאת
  choice: pagkatapos nito
  rationale: Likas at maikling panumbas sa temporal na pariralang tumutukoy sa naunang inilahad na kasalanan at krisis.
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikita ang paliwanag o dahilan kung bakit walang maihaharap na salita si Ezra at ang bayan.
- source_word: עָזַבְנוּ
  choice: tinalikuran namin
  rationale: 'Pinananatili ang bigat ng עזב sa konteksto ng tipan: sadyang pagtalikod o pag-abandona sa hinihingi ng Diyos, hindi simpleng pag-iwan lamang.'
- source_word: מִצְוֺתֶיךָ
  choice: iyong mga utos
  rationale: Malinaw at karaniwang modernong Tagalog para sa mga kautusang mula sa Diyos, nang hindi pinagaan ang awtoridad ng mga ito.
theological_decisions:
- issue: Himig ng pagpapahayag ni Ezra
  choice: Retorikal na pagtatapat ng pagkakasala at kawalang-masabi sa harap ng Diyos
  alternative: Payak na pagtatanong kung ano ang susunod na sasabihin
  rationale: Ang kasunod na dahilan—“Sapagkat tinalikuran namin ang iyong mga utos”—ay nagpapakitang ang tanong ay bahagi ng pagsisisi, hindi neutral na paghingi ng patnubay. Hindi dinaragdagan ng salin ang anumang paliwanag na wala sa Hebreo.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “namin,” hindi “natin,” dahil ang Diyos ang tuwirang kausap at hindi kabilang sa pangkat na umamin na tumalikod sa mga utos.
