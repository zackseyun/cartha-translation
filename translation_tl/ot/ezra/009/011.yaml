base_translation:
  language: en
  yaml_path: translation/ot/ezra/009/011.yaml
  text: which you commanded by the hand of your servants the prophets[a], saying, ‘The land that you are entering to possess is a land of impurity because of the impurity of the peoples of the lands[b], because of their abominations with which they have filled it from end to end with their uncleanness.’
translation:
  language: tl
  text: 'na iniutos mo sa pamamagitan ng iyong mga lingkod na propeta: “Ang lupaing papasukan ninyo upang angkinin ay lupaing marumi dahil sa karumihan ng mga mamamayan ng mga lupaing iyon, dahil sa kanilang kasuklam-suklam na mga gawain. Pinuno nila ito mula sa isang dulo hanggang sa kabila[a] ng kanilang karumihan.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “mula sa bibig hanggang sa bibig,” isang idyomang nangangahulugang lubusang napuno ang lupain, mula sa isang dulo hanggang sa kabila.
    reason: lexical_alternative
  - marker: b
    text: Ang mga salitang isinaling “marumi” at “karumihan” ay maaaring magpahiwatig kapwa ng ritwal na pagkadungis at moral na kasamaan.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּיַד
  choice: sa pamamagitan ng
  rationale: Likas na Filipino para sa Hebreong idyoma ng ahensiya; ipinapakita nitong ipinarating ng Diyos ang utos sa pamamagitan ng mga propeta nang hindi pilit na isinasalin ang “kamay.”
- source_word: עֲבָדֶיךָ הַנְּבִיאִים
  choice: iyong mga lingkod na propeta
  rationale: Pinananatili ang marangal na tawag sa mga propeta bilang mga lingkod ng Diyos.
- source_word: לְרִשְׁתָּהּ
  choice: upang angkinin
  rationale: Ipinahahayag ang pagkuha at pananatiling pag-aari ng lupain, na siyang diwa ng ירשׁ sa kontekstong ito.
- source_word: אֶרֶץ נִדָּה
  choice: lupaing marumi
  rationale: Natural at malinaw sa Filipino habang pinananatili ang wika ng pagkadungis; hindi nito nililimitahan ang diwa sa ritwal o moral na karumihan lamang.
- source_word: בְּנִדַּת עַמֵּי הָאֲרָצוֹת
  choice: dahil sa karumihan ng mga bayan sa mga lupain
  rationale: Binabasa ang בְּ bilang sanhi at pinananatili ang mga pangmaramihang “mga bayan” at “mga lupain.”
- source_word: בְּתוֹעֲבֹתֵיהֶם
  choice: at sa kanilang kasuklam-suklam na mga gawain
  rationale: Ipinapakita ang matinding moral-relihiyosong pagtutol ng תועבה at nililinaw na tumutukoy ito sa kanilang mga gawain.
- source_word: מִפֶּה אֶל־פֶּה
  choice: mula sa isang dulo hanggang sa kabila
  rationale: Isinasalin ang kahulugan ng Hebreong idyoma bilang ganap na paglaganap sa buong lupain.
- source_word: בְּטֻמְאָתָם
  choice: ng kanilang karumihan
  rationale: Pinananatili ang paulit-ulit na temang pagkadungis at ang posibleng magkasamang ritwal at moral na pahiwatig.
theological_decisions:
- issue: Kalikasan ng karumihan ng lupain
  choice: Gumamit ng “marumi/karumihan” nang hindi tinutukoy kung ritwal lamang o moral lamang ang pagkadungis.
  alternative: Isalin ang buong talata bilang ritwal na karumihan lamang o bilang moral na katiwalian lamang.
  rationale: Ang נִדָּה, טֻמְאָה, at תּוֹעֵבָה ay may magkakaugnay na ritwal, moral, at tipanang pahiwatig; dapat mapanatili ang saklaw at tensiyong ito.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “sa pamamagitan ng” sa halip na literal na “sa kamay ng,” at “kasuklam-suklam na mga gawain” upang maging malinaw ang tinutukoy na mga karumal-dumal na kaugalian. Ang mga panandang [a] at [b] ay kapwa nasa pangunahing teksto.
