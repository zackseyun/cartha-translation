    issue: Hindi gaanong likas ang “nalabing pangkat na gaya nito.”
    rationale: Ang pariralang ito ay tunog salin-singaw at maaaring magmukhang ang ‘gaya nito’ ay tumutukoy sa isang di-tiyak na pangkat. Ang “isang nalabing pangkat na tulad nito” ay mas natural, pinananatili ang isahang kolektibong anyo ng פְּלֵיטָה, at naihahatid ang diin ng כָּזֹאת.
