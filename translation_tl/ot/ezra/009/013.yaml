source:
  edition: WLC
  text: וְ/אַֽחֲרֵי֙ כָּל הַ/בָּ֣א עָלֵ֔י/נוּ בְּ/מַעֲשֵׂ֨י/נוּ֙ הָ/רָעִ֔ים וּ/בְ/אַשְׁמָתֵ֖/נוּ הַ/גְּדֹלָ֑ה כִּ֣י אַתָּ֣ה אֱלֹהֵ֗י/נוּ חָשַׂ֤כְתָּֽ לְ/מַ֨טָּה֙ מֵֽ/עֲוֺנֵ֔/נוּ וְ/נָתַ֥תָּה לָּ֛/נוּ פְּלֵיטָ֖ה כָּ/זֹֽאת־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/009/013.yaml
  text: And after all that has come upon us because of our evil deeds and our great guilt—though you, our God, have punished us less than our iniquities deserve and have given us such a remnant as this—
translation:
  language: tl
  text: At pagkatapos ng lahat ng sinapit namin dahil sa aming masasamang gawa at sa mabigat naming pagkakasala—gayong ikaw, aming Diyos, ay nagparusa sa amin nang mas magaan kaysa sa nararapat sa aming mga kasamaan[a] at binigyan mo kami ng isang nalabing pangkat na tulad nito[b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaaring isalin ang buong parirala: “mas marami pang hatol ang pinigil mo kaysa sa nararapat sa aming mga kasamaan.” Literal na inilalarawan ng idyomang Hebreo ang pagpigil ng Diyos sa hatol upang hindi ito umabot sa sukat ng kanilang sala. Ang “gayong” ay maaari ring unawaing “yamang.”'
    reason: lexical_and_syntactic_alternative
  - marker: b
    text: O “mga nakaligtas na tulad nito.” Ang salitang Hebreo ay maaaring tumukoy sa pagtakas o sa mga taong nakaligtas sa hatol.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחֲרֵי
  choice: At matapos
  rationale: Pinananatili ang pang-ugnay at ang pagpapatuloy ng panalangin mula sa naunang talata.
- source_word: כָּל הַבָּא עָלֵינוּ
  choice: ang lahat ng sinapit namin
  rationale: Natural na Filipino para sa lahat ng kapahamakang dumating sa bayan, habang pinananatili ang diwang sila ang dumanas nito.
- source_word: בְּמַעֲשֵׂינוּ הָרָעִים
  choice: dahil sa aming masasamang gawa
  rationale: Ipinahahayag ang sanhi na ipinahihiwatig ng בְּ sa konteksto at pinananatili ang moral na bigat ng mga gawa.
- source_word: וּבְאַשְׁמָתֵנוּ הַגְּדֹלָה
  choice: at sa mabigat naming pagkakasala
  rationale: Ang אַשְׁמָה ay tumutukoy sa tunay na pagkakasala o pananagutan, hindi lamang sa damdaming nagkasala; ang “mabigat” ay likas na Filipino para sa tindi nito.
- source_word: כִּי
  choice: gayong
  rationale: 'Binabasa itong may pagpap concessive: sa kabila ng kanilang malaking sala at sinapit na kapahamakan, naging maawain ang Diyos. Hindi nito inaalis na maaari ring maunawaan ang pang-ugnay bilang panumbas sa “yamang,” kaya itinatala ang posibilidad na iyon.'
- source_word: חָשַׂכְתָּ לְמַטָּה מֵעֲוֺנֵנוּ
  choice: nagparusa sa amin nang mas magaan kaysa sa nararapat sa aming mga kasamaan
  rationale: 'Ipinapahayag nang malinaw ang diwa ng idyomang Hebreo: may ipinagkait o hindi lubos na ipinatupad na hatol, kaya mas magaan ang tinanggap nila kaysa sa nararapat sa kanilang sala.'
- source_word: עָוֺן
  choice: mga kasamaan
  rationale: Sinasaklaw nito ang salang moral at pananagutang taglay ng עָוֺן, at iniiwasang ulitin nang magkalapit ang “pagkakasala.”
- source_word: וְנָתַתָּה לָּנוּ
  choice: at binigyan mo kami
  rationale: Tuwirang inilalarawan ang maawaing kilos ng Diyos na nananatiling mahalaga sa kasalukuyang kalagayan ng mga nananalangin.
- source_word: פְּלֵיטָה
  choice: nalabing pangkat
  rationale: Ang salita ay maaaring tumukoy sa pagtakas, mga nakaligtas, o nalabi. Sa kontekstong matapos ang pagkakatapon, ang “nalabing pangkat” ay malinaw na tumutukoy sa pamayanang nakaligtas nang hindi ipinapalagay na abstraktong “kaligtasan” lamang.
- source_word: כָּזֹאת
  choice: na gaya nito
  rationale: Pinananatili ang demonstratibong diin sa partikular na nalabing pamayanang naroon.
theological_decisions:
- issue: Ugnayan ng awa ng Diyos at ng hatol na nararapat sa kasalanan
  choice: nagparusa sa amin nang mas magaan kaysa sa nararapat sa aming mga kasamaan
  alternative: higit mo kaming kinaawaan kaysa sa ipinahihintulot ng aming mga kasamaan
  rationale: 'Pinananatili ng salin ang dalawang panig ng pahayag: tunay ang hatol, ngunit hindi ito umabot sa buong bigat na nararapat sa sala. Hindi ito nagdaragdag ng isang sistematikong paliwanag hinggil sa parusa.'
- issue: Kahulugan ng פְּלֵיטָה sa kalagayang matapos ang pagkakatapon
  choice: nalabing pangkat
  alternative: mga nakaligtas
  rationale: Ipinakikita ng pangunahing salin na isang napanatiling pamayanan ang tinutukoy, samantalang kinikilala sa talababa ang mas tuwirang kahulugang “mga nakaligtas.”
- issue: Gamit ng כִּי sa daloy ng pangungusap
  choice: gayong
  alternative: yamang
  rationale: Ang concessive na pagbasa ay nagpapakita ng awa sa kabila ng sala; gayunman, tunay na posible rin sa Hebreo ang causal na daloy. Inilalahad ang alternatibo sa talababa sa halip na burahin ang sintaktikong kalabuan.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “mabigat na pagkakasala,” “mas magaan,” at “nalabing pangkat” upang maging natural sa karaniwang mambabasa habang pinananatili ang moral at makasaysayang bigat ng Hebreo. Ang pangwakas na gitling ay sadyang pinanatili sapagkat nagpapatuloy ang pangungusap sa kasunod na talata.
