revisions:
- from: At matapos ang lahat ng sinapit namin dahil sa aming masasamang gawa at sa mabigat naming pagkakasala—gayong ikaw, aming Diyos, ay nagparusa sa amin nang mas magaan kaysa sa nararapat sa aming mga kasamaan[a] at binigyan mo kami ng nalabing pangkat na gaya nito[b]—
  to: At pagkatapos ng lahat ng sinapit namin dahil sa aming masasamang gawa at sa mabigat naming pagkakasala—gayong ikaw, aming Diyos, ay nagparusa sa amin nang mas magaan kaysa sa nararapat sa aming mga kasamaan[a] at binigyan mo kami ng isang nalabing pangkat na tulad nito[b]—
  rationale: Pinalitan ang “At matapos” ng mas natural na “At pagkatapos ng” at inayos ang pangwakas na parirala upang maging idiomatiko sa modernong Filipino, habang pinananatili ang kolektibong isahan ng ‘remnant.’ Inayos din ang ayos ng alternatibong salin sa talababa a para sa linaw. Walang pagbabagong semantiko o doktrinal na ginawa.
