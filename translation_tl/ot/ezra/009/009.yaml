source:
  edition: WLC
  text: כִּֽי עֲבָדִ֣ים אֲנַ֔חְנוּ וּ/בְ/עַבְדֻ֔תֵ/נוּ לֹ֥א עֲזָבָ֖/נוּ אֱלֹהֵ֑י/נוּ וַֽ/יַּט עָלֵ֣י/נוּ חֶ֡סֶד לִ/פְנֵי֩ מַלְכֵ֨י פָרַ֜ס לָֽ/תֶת לָ֣/נוּ מִֽחְיָ֗ה לְ/רוֹמֵ֞ם אֶת בֵּ֤ית אֱלֹהֵ֨י/נוּ֙ וּ/לְ/הַעֲמִ֣יד אֶת חָרְבֹתָ֔י/ו וְ/לָֽ/תֶת לָ֣/נוּ גָדֵ֔ר בִּֽ/יהוּדָ֖ה וּ/בִ/ירוּשָׁלִָֽם־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/009/009.yaml
  text: For we are servants[a]; yet in our slavery our God has not forsaken us, but has extended covenant faithfulness to us before the kings of Persia, to give us reviving, to raise up the house of our God, to set up its ruins[b], and to give us a wall in Judah and in Jerusalem.
translation:
  language: tl
  text: Sapagkat mga alipin kami; ngunit sa aming pagkaalipin ay hindi kami pinabayaan ng aming Diyos. Sa halip, ipinadama niya sa amin ang kanyang tapat na pag-ibig[a] sa harap ng mga hari ng Persia, upang bigyan niya kami ng panibagong buhay, muling itayo ang bahay ng aming Diyos, ibangon ang mga guho nito, at bigyan kami ng pader[b] sa Juda at Jerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “matatag na pag-ibig,” “kabutihan,” “paglingap,” o “katapatan sa tipan.” Ang salitang Hebreo na חֶסֶד (hesed) ay tumutukoy sa matapat, mapagbiyaya, at matibay na pag-ibig, lalo na sa ugnayan ng tipan.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “bakod” o “pananggalang.” Maaaring mas malawak na tumukoy ang larawan sa katiwasayan at proteksiyon sa Juda at Jerusalem, hindi lamang sa isang literal na pader.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲבָדִים / וּבְעַבְדֻתֵנוּ
  choice: mga alipin / sa aming pagkaalipin
  rationale: Pinananatili ang magkaugat na mga salita at ang diwa ng pagkakagapos at pagpapasakop sa kapangyarihang imperyal, sa halip na palambutin bilang karaniwang paglilingkod.
- source_word: עֲזָבָנוּ
  choice: hindi kami pinabayaan
  rationale: Likas sa makabagong Tagalog at angkop sa panalangin; saklaw nito ang diwa ng hindi pag-iwan o pagtatakwil ng Diyos.
- source_word: וַיַּט עָלֵינוּ חֶסֶד
  choice: ipinadama niya sa amin ang kanyang tapat na pag-ibig
  rationale: Ang 'tapat na pag-ibig' ay malinaw at likas na salin ng חֶסֶד na nagpapahiwatig ng matatag, mapagbiyaya, at matapat na pakikitungo ng Diyos. Ang 'ipinadama' ay naghahatid ng aktibong pagkakaloob, bagaman hindi literal na inuulit ang larawang 'iniunat' ng נטה.
- source_word: לִפְנֵי מַלְכֵי פָרַס
  choice: sa harap ng mga hari ng Persia
  rationale: Tuwirang pinananatili ang kaugnayang ipinahihiwatig ng לִפְנֵי—sa presensiya o paningin ng mga hari ng Persia.
- source_word: מִחְיָה
  choice: panibagong-buhay
  rationale: Ipinahahayag ang kapuwa pagpapanatili at pagpapanumbalik ng buhay ng pamayanan pagkatapos ng pagkatapon.
- source_word: לְרוֹמֵם אֶת בֵּית אֱלֹהֵינוּ
  choice: muling itayo ang bahay ng aming Diyos
  rationale: Sa konteksto ng templo, ang 'muling itayo' ay likas na Tagalog para sa literal na ideya ng pagtataas o muling pagtatindig. Pinananatili ng 'bahay ng aming Diyos' ang Hebreong katawagan sa templo.
- source_word: וּלְהַעֲמִיד אֶת חָרְבֹתָיו
  choice: ibangon ang mga guho nito
  rationale: Ang pandiwa ay causative na 'patayuin'; ang 'ibangon' ay nagpapanatili sa larawang muling pagpapatayo habang malinaw na tumutukoy sa pagpapanumbalik ng mga nawasak na bahagi.
- source_word: גָדֵר
  choice: pader
  rationale: Pinananatili ang kongkretong larawan ng isang harang o bakod. Inilalahad sa talababa ang posibleng mas malawak na diwa ng proteksiyon.
- source_word: בִּיהוּדָה וּבִירוּשָׁלִָם
  choice: sa Juda at Jerusalem
  rationale: Tuwirang lokatibong salin na hindi ipinapalagay na literal na nakapalibot ang pader sa buong Juda at Jerusalem.
theological_decisions:
- issue: Kahulugan ng חֶסֶד
  choice: tapat na pag-ibig
  alternative: katapatan sa tipan; matatag na pag-ibig; kabutihan; paglingap
  rationale: Nananatiling mabigat sa teolohiya ngunit likas at mauunawaan sa modernong Tagalog. Hindi nito nililimitahan ang salita sa isang abstraktong 'katapatan' lamang; pinananatili sa talababa ang kaugnayan nito sa matapat at mapagbiyayang pag-ibig sa loob ng tipan.
- issue: Kongkreto o metaporikal na kahulugan ng גָדֵר
  choice: pader
  alternative: bakod; pananggalang; proteksiyon
  rationale: Pinananatili ng pangunahing teksto ang kongkretong larawan, habang kinikilala ng talababa na maaaring tumukoy ito nang mas malawak sa katiwasayan at proteksiyong ipinagkaloob sa Juda at Jerusalem.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “mga alipin” at “pagkaalipin” upang mapanatili ang lakas at pag-uulit ng Hebreo; iniwasan ang mas mahinang “mga lingkod.” Ang mga sugnay na may “upang” ay inayos bilang magkahanay na layunin para sa malinaw at natural na daloy.
