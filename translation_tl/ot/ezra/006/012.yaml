revisions:
- from: At pabagsakin nawa ng Diyos na nagpatahan ng kanyang pangalan doon ang sinumang hari o bayan na magtatangkang baguhin ito[a] o gibain ang bahay na ito ng Diyos na nasa Jerusalem. Ako, si Dario, ang naglabas ng utos na ito; isagawa ito nang buong sigasig.[b]
  to: At pabagsakin nawa ng Diyos na nagpatahan ng kanyang pangalan doon ang sinumang hari o bayan na kikilos upang baguhin ito[a] at gibain ang bahay na ito ng Diyos na nasa Jerusalem. Ako, si Dario, ay naglabas ng utos na ito; isagawa ito nang buong pagsisikap.[b]
  rationale: Pinalitan ang pananalitang nagpapahiwatig lamang ng pagtatangka ng isang pananalitang naghahatid ng aktuwal na pagkilos laban sa ipinag-uutos. Pinino rin ang pangwakas na pang-abay upang masaklaw ang masikap na pagsunod, habang pinananatili ng talababa ang posibleng diin sa agarang pagpapatupad. Walang pagbabagong ginawa sa kahulugan ng talata o sa idyomang teolohikal tungkol sa pangalan ng Diyos.
