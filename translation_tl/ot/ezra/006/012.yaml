  source_fidelity: 'Ang pangunahing diwa ay tapat sa Aramaic: ang Diyos ang nagpatahan ng kanyang pangalan doon, ang parusang pagpapabagsak ay para sa sinumang hari o bayan, at ang kautusan ay dapat ipatupad nang may kasigasigan. Gayunman, ang “magtatangkang” ay nagpapahina sa יִשְׁלַח יְדֵהּ, na tumutukoy sa aktuwal na pagkilos laban sa kautusan/templo, hindi lamang sa isang hindi natupad na pagtatangka.'
  naturalness: Marangal at malinaw ang register. Mas natural at mas tumpak ang “kikilos upang” kaysa “magtatangkang,” at ang “nang buong pagsisikap” ay mas angkop na katumbas ng masigasig at maingat na pagpapatupad kaysa “nang buong sigasig,” na maaaring magpahiwatig ng damdaming sigla.
  terminology: Ang “Diyos na nagpatahan ng kanyang pangalan doon” ay pinananatili ang causative na idyoma tungkol sa pangalan ng Diyos. Ang “bahay na ito ng Diyos” ay wastong literal na katawagan para sa templo. Ang “utos” ay angkop para sa imperyal na טְעֵם.
