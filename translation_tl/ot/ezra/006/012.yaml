  text: וֵֽ/אלָהָ֞/א דִּ֣י שַׁכִּ֧ן שְׁמֵ֣/הּ תַּמָּ֗ה יְמַגַּ֞ר כָּל מֶ֤לֶךְ וְ/עַם֙ דִּ֣י יִשְׁלַ֣ח יְדֵ֗/הּ לְ/הַשְׁנָיָ֛ה לְ/חַבָּלָ֛ה בֵּית אֱלָהָ֥/א דֵ֖ךְ דִּ֣י בִ/ירוּשְׁלֶ֑ם אֲנָ֤ה דָרְיָ֨וֶשׁ֙ שָׂ֣מֶת טְעֵ֔ם אָסְפַּ֖רְנָא יִתְעֲבִֽד־׀־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/012.yaml
  text: And may the God who has caused his name to dwell there overthrow any king or people who stretches out his hand to alter this[a], to destroy this house of God that is in Jerusalem. I, Darius, have issued a decree[b]; let it be done with all diligence.
translation:
  language: tl
  text: At pabagsakin nawa ng Diyos na nagpatahan ng kanyang pangalan doon ang sinumang hari o bayan na kikilos upang baguhin ito[a] at gibain ang bahay na ito ng Diyos na nasa Jerusalem. Ako, si Dario, ay naglabas ng utos na ito; isagawa ito nang buong pagsisikap.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “baguhin ang utos na ito.” Hindi tahasang binabanggit sa Aramaiko ang bagay na babaguhin.
    reason: textual_ambiguity
  - marker: b
    text: O “isagawa ito agad.” Maaaring idiin ng pang-abay ang mabilis na pagpapatupad.
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׁכִּן שְׁמֵהּ תַּמָּה
  choice: nagpatahan ng kanyang pangalan doon
  rationale: Pinananatili nito ang causative na diwa at ang natatanging idyoma tungkol sa pangalan ng Diyos at sa templo, nang hindi ipinahihiwatig na nalilimitahan sa isang lugar ang Diyos.
- source_word: יְמַגַּר
  choice: pabagsakin
  rationale: Ang pandiwa ay nagsasaad ng pagpapabagsak bilang hatol at angkop sa anyo ng sumpa sa utos ng hari.
- source_word: כָּל מֶלֶךְ וְעַם
  choice: ang sinumang hari o bayan
  rationale: Natural itong Filipino para sa pangkalahatang babala laban sa alinmang hari o bayan na susuway.
- source_word: יִשְׁלַח יְדֵהּ
  choice: magtatangkang
  rationale: Inihahatid nito sa natural na Filipino ang Semitikong idyoma ng pag-uunat ng kamay, ibig sabihin ay pagkilos laban sa isang bagay.
- source_word: לְהַשְׁנָיָה
  choice: baguhin ito
  rationale: Malinaw at angkop sa legal at administratibong konteksto ang “baguhin,” habang ang “ito” ay nagpapanatili sa hindi tahasang tinutukoy na bagay sa Aramaic.
- source_word: לְחַבָּלָה בֵּית אֱלָהָא
  choice: gibain ang bahay na ito ng Diyos
  rationale: Ipinahahayag ng “gibain” ang matinding kapinsalaang nakatuon sa gusali ng templo.
- source_word: דֵךְ
  choice: ito
  rationale: Tumutukoy ang demonstratibo sa mismong templo na paksa ng utos.
- source_word: שָׂמֶת טְעֵם
  choice: naglabas ng utos na ito
  rationale: Natural na modernong pahayag ito para sa pormal na pormulang administratibo ng hari.
- source_word: אָסְפַּרְנָא
  choice: nang buong sigasig
  rationale: Saklaw nito ang masigasig, maagap, at maingat na pagtupad; maaaring idiin din ng salita ang bilis.
- source_word: יִתְעֲבִד
  choice: isagawa ito
  rationale: Pinananatili ng pautos na anyo ang awtoritatibong tono ng pangwakas na pormula.
theological_decisions:
- issue: Teolohiya ng pangalan ng Diyos kaugnay ng templo
  choice: “nagpatahan ng kanyang pangalan doon”
  alternative: “naglagay ng kanyang pangalan doon” o “naninirahan doon”
  rationale: Pinananatili ng salin ang biblikal na idyoma ng pakikipag-ugnayan ng Diyos sa templo sa pamamagitan ng kanyang pangalan, nang hindi ito pinapantay sa payak na pagmamay-ari o sa ideyang nalilimitahan doon ang kanyang presensya.
translation_notes:
  register: Modernong Filipino na marangal at malinaw. Ginamit ang “bahay ng Diyos” upang mapanatili ang kongkretong katawagan ng Aramaic sa templo, at ang “nagpatahan ng kanyang pangalan” upang mapanatili ang mahalagang idyomang teolohikal.
