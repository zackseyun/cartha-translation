  revised_text: 'Bukod dito, ipinag-uutos ko kung ano ang dapat ninyong gawin para sa mga pinunong Judiong ito habang muli nilang itinatayo ang bahay na ito ng Diyos: Ang kanilang mga gastusin ay dapat bayaran agad mula sa mga kita ng hari—ang buwis na nalilikom sa Kabila ng Ilog[a]—upang hindi maantala ang gawain.'
