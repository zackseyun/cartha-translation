base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/008.yaml
  text: 'Moreover, I issue a decree concerning what you are to do for these Jewish elders as they rebuild this house of God: Their expenses are to be paid promptly from the royal revenues—the tribute collected in Beyond the River[a]—so that the work is not interrupted.'
translation:
  language: tl
  text: 'Bukod dito, ipinag-uutos ko kung ano ang dapat ninyong gawin para sa mga pinunong Judiong ito habang muli nilang itinatayo ang bahay na ito ng Diyos: Ang kanilang mga gastusin ay dapat bayaran agad mula sa mga kita ng hari—ang buwis na nalilikom sa Kabila ng Ilog[a]—upang hindi maantala ang gawain.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “Kabila ng Ilog” ay Persyanong tawag na pampamahalaan para sa mga lupaing nasa kanluran ng Ilog Eufrates.
    reason: cultural_note
lexical_decisions:
- source_word: וּמִנִּי שִׂים טְעֵם
  choice: Bukod dito, ipinag-uutos ko
  rationale: Ang Aramaikong idyoma ay tumutukoy sa pagpapalabas ng isang opisyal na utos. Pinananatili ng aktibong anyo ang hari bilang nagsasalita at ang administratibong lakas ng pahayag.
- source_word: שָׂבֵי יְהוּדָיֵא אִלֵּךְ
  choice: mga pinunong Judiong ito
  rationale: Ang שָׂבֵי ay literal na matatandang lalaki ngunit dito ay tumutukoy sa kinikilalang mga lider ng pamayanang Judio; mas likas sa makabagong Filipino ang “mga pinuno.”
- source_word: לְמִבְנֵא בֵּית אֱלָהָא דֵךְ
  choice: habang muli nilang itinatayo ang bahay na ito ng Diyos
  rationale: Ang דֵךְ ay demonstratibong “ito,” hindi panghalip na “inyong.” Ipinahihiwatig ng konteksto na muling itinatayo ang naunang bahay ng Diyos.
- source_word: מִנִּכְסֵי מַלְכָּא דִּי מִדַּת עֲבַר נַהֲרָה
  choice: mula sa mga kita ng hari—ang buwis na nalilikom sa Lalawigan sa Kabila ng Ilog
  rationale: Ang נִכְסֵי ay mga ari-arian o yamang maharlika, at ang מִדַּת ay buwis o tributo. Ang salin ay malinaw na ipinapakitang ang buwis mula sa nasabing teritoryo ang pinagmumulan ng pambayad.
- source_word: אָסְפַּרְנָא
  choice: agad
  rationale: Sa kontekstong administratibo at pampinansiyal, ipinahihiwatig ng salita ang maagap at masusing pagsasagawa; “agad” ang malinaw at likas na katumbas dito.
- source_word: נִפְקְתָא תֶּהֱוֵא מִתְיַהֲבָא לְגֻבְרַיָּא אִלֵּךְ
  choice: Ang kanilang mga gastusin ay dapat bayaran
  rationale: Pinananatili nito ang pasibong obligasyon na tustusan ang mga gastusin sa proyekto para sa mga lalaking nabanggit.
- source_word: דִּי לָא לְבַטָּלָא
  choice: upang hindi maantala ang gawain
  rationale: Ang sugnay ay naglalayong pigilan ang paghinto o pagkaantala. Nililinaw ng “ang gawain” ang di-binanggit ngunit kontekstuwal na layon.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “bahay ng Diyos” sa halip na “templo” upang mapanatili ang leksikal na anyo ng Aramaiko, at “mga pinuno” para sa natural na pagpapahayag ng tungkuling ginagampanan ng mga matatanda sa pamayanan.
