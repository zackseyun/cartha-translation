  verdict: revise
  source_fidelity: 'May isang mahalagang kamalian sa heograpiko-singaw na termino: ang עֲבַר נַהֲרָה ay ang administratibong tawag na “Beyond the River”/“Kabila ng Ilog,” samantalang ang מִדַּת ay “buwis” o “tributo.” Ang pagdaragdag ng “Lalawigan” sa pangalan ay maaaring magpahiwatig na ang מִדַּת mismo ay isang lalawigan, na hindi sinasabi ng Aramaiko. Ang iba pang mahahalagang elemento—utos ng hari, mga pinunong Judio, “bahay na ito ng Diyos,” agarang paglalaan ng gastos, at layuning maiwasan ang pagkaantala—ay tapat sa pinagmulan.'
  naturalness: Malinaw, makabago, at marangal ang Filipino. Likas ang “ipinag-uutos ko,” “mga pinunong Judiong ito,” at “upang hindi maantala ang gawain.” Mas natural at mas eksakto ang “Kabila ng Ilog” nang walang “Lalawigan.”
  terminology: Ang “bahay na ito ng Diyos” ay wastong tumutugon sa demonstratibong דֵךְ. Ang “mga pinuno” ay katanggap-tanggap na kontekstuwal na salin ng mga elder. Ang “buwis” ay angkop para sa מִדַּת. Dapat iwasan ang “Lalawigan” upang hindi mapagpalit ang buwis at ang administratibong teritoryong pinanggagalingan nito.
