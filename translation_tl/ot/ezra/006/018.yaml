  text: וַ/הֲקִ֨ימוּ כָהֲנַיָּ֜/א בִּ/פְלֻגָּתְ/ה֗וֹן וְ/לֵוָיֵ/א֙ בְּ/מַחְלְקָ֣תְ/ה֔וֹן עַל עֲבִידַ֥ת אֱלָהָ֖/א דִּ֣י בִ/ירוּשְׁלֶ֑ם כִּ/כְתָ֖ב סְפַ֥ר מֹשֶֽׁה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/018.yaml
  text: And they set up the priests in their divisions and the Levites in their divisions for the service of God that is in Jerusalem[b][a], as it is written in the Book of Moses.
translation:
  language: tl
  text: At itinalaga nila ang mga pari ayon sa kani-kanilang pangkat at ang mga Levita ayon sa kani-kanilang pangkat[a] para sa paglilingkod sa Diyos sa Jerusalem, ayon sa nakasulat sa Aklat ni Moises.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalawang magkaiba ngunit magkalapit na kahulugan na salitang Aramaiko ang ginamit para sa pagkakapangkat ng mga pari at ng mga Levita; kapwa maaaring isaling “mga pangkat” o “mga pangkat ng tungkulin.”
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring isalin: “gaya ng nakasulat sa Aklat ni Moises.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲקִימוּ
  choice: itinalaga nila
  rationale: Ang causative ng קום ay tumutukoy sa pagpapuwesto o pagtatalaga. Ang “itinalaga” ay natural sa konteksto ng pag-aayos ng mga tauhan para sa paglilingkod sa templo.
- source_word: כָהֲנַיָּא
  choice: ang mga pari
  rationale: Karaniwang katumbas ng salitang Aramaico para sa mga paring naglilingkod sa templo.
- source_word: בִּפְלֻגָּתְהוֹן
  choice: ayon sa kani-kanilang pangkat
  rationale: Tumutukoy ang pangngalan sa mga organisadong pangkat o hati. Malinaw sa makabagong Tagalog ang “kani-kanilang pangkat.”
- source_word: וְלֵוָיֵא
  choice: at ang mga Levita
  rationale: Tuwirang katawagan sa mga kabilang sa lipi ni Levi na may mga tungkulin sa templo.
- source_word: בְּמַחְלְקָתְהוֹן
  choice: ayon sa kani-kanilang pangkat
  rationale: Tumutukoy rin ito sa organisadong paghahati o pagpapangkat. Pinananatili ng magkatulad na salin ang malapit na kahulugan ng dalawang terminong Aramaico nang hindi nagpapahiwatig ng di-tiyak na pagkakaiba.
- source_word: עַל עֲבִידַת אֱלָהָא
  choice: para sa paglilingkod sa Diyos
  rationale: Ipinahihiwatig ng parirala ang gawaing ipinagkatiwala sa kanila. Natural sa Tagalog ang “para sa paglilingkod” at nananatili ang pokus sa paglilingkod sa Diyos.
- source_word: דִּי בִירוּשְׁלֶם
  choice: sa Jerusalem
  rationale: Iniuugnay ng pariralang Aramaico ang paglilingkod sa lokasyon nitong Jerusalem. Hindi na kailangang gawing tahasang relative clause sa natural na Tagalog.
- source_word: כִּכְתָב
  choice: ayon sa nakasulat
  rationale: Ipinapahayag ng idyoma ang pagsunod sa nakasulat na tuntunin o tagubilin.
- source_word: סְפַר מֹשֶׁה
  choice: Aklat ni Moises
  rationale: Maaaring tumukoy ang סְפַר sa aklat, kasulatan, o balumbon. Ang “Aklat ni Moises” ay malinaw at hindi nagdaragdag ng paliwanag na wala sa teksto.
theological_decisions:
- issue: Kaugnayan ng kaayusan sa templo at ng nakasulat na tagubilin ni Moises
  choice: Ipinakikitang ang pagkakapangkat at paglilingkod ng mga pari at Levita ay alinsunod sa nakasulat sa Aklat ni Moises.
  alternative: Maaaring unawain ang pangwakas na parirala bilang mas pangkalahatang pagtukoy sa kaugaliang nagmula kay Moises.
  rationale: Tahasang iniuugnay ng כִּכְתָב ang kaayusan sa nakasulat na batayan. Pinananatili ito ng salin nang hindi nagdaragdag ng mga doktrina tungkol sa saklaw, anyo, o pagkakalikha ng aklat.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “itinalaga” para sa opisyal na pagpapuwesto at “kani-kanilang pangkat” para sa organisadong kaayusan, habang iniwasan ang teknikal o denominasyonal na bokabularyo.
