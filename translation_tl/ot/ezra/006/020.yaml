base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/020.yaml
  text: For the priests and the Levites had purified themselves as one; all of them were clean. And they slaughtered the Passover lamb for all the sons of the exile, and for their brothers the priests, and for themselves.
translation:
  language: tl
  text: Sapagkat ang mga pari at ang mga Levita ay nagdalisay ng kanilang sarili nang magkakaisa; silang lahat ay malinis. At kinatay nila ang handog ng Paskuwa para sa lahat ng taong mula sa pagkabihag, para sa mga kapatid nilang pari, at para sa kanilang sarili.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כְּאֶחָד
  choice: na parang iisang tao
  rationale: Pinananatili ang diwa ng sama-sama at pagkakaisa na higit sa payak na “sabay-sabay,” nang hindi ipinahihiwatig na literal silang isang tao.
- source_word: בְּנֵי הַגּוֹלָה
  choice: mga bumalik mula sa pagkabihag
  rationale: Sa konteksto ng Ezra, tumutukoy ito sa pamayanang dating ipinatapon at ngayo'y nakabalik; mas likas ito sa Filipino kaysa literal na “mga anak ng pagkatapon.”
- source_word: הַפֶּסַח
  choice: handog na pampaskuwa
  rationale: Dito ang pandiwang “kinatay” ay nagpapakitang ang tinutukoy ay ang hayop na handog para sa Paskuwa, hindi lamang ang kapistahan.
- source_word: טְהוֹרִים
  choice: malinis
  rationale: Tumutukoy sa ritwal na kalinisan sa konteksto, habang pinananatili ang payak na salitang ginamit sa Hebreo.
theological_decisions:
- issue: Kahulugan ng כְּאֶחָד sa paglilinis ng mga pari at Levita
  choice: na parang iisang tao
  alternative: sabay-sabay
  rationale: Ang piniling salin ay nagpapanatili sa larawan ng nagkakaisang pagkilos at hindi ito pinapaliit sa pagkakasabay lamang.
- issue: Pagpapakahulugan sa הַפֶּסַח
  choice: handog na pampaskuwa
  alternative: kordero ng Paskuwa
  rationale: Hindi tahasang binanggit sa Hebreo ang “kordero”; ang mas malawak na “handog na pampaskuwa” ay tumpak sa bagay na kinatay nang hindi nagdaragdag ng espesipikong uri ng hayop.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “mga Levita” bilang karaniwang katawagan sa Bibliya at “Paskuwa” para sa kapistahang Pesach. Ang unang pangungusap ay bahagyang pormal upang mapanatili ang diin ng Hebreong כְּאֶחָד.
