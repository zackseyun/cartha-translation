revisions:
- from: Sapagkat ang mga pari at ang mga Levita ay naglinis ng kanilang sarili na parang iisang tao; silang lahat ay malinis. At kinatay nila ang handog na pampaskuwa para sa lahat ng mga bumalik mula sa pagkabihag, para sa mga kapatid nilang pari, at para sa kanilang sarili.
  to: Sapagkat ang mga pari at ang mga Levita ay nagdalisay ng kanilang sarili nang magkakaisa; silang lahat ay malinis. At kinatay nila ang handog ng Paskuwa para sa lahat ng taong mula sa pagkabihag, para sa mga kapatid nilang pari, at para sa kanilang sarili.
  rationale: Itinuwid ang salin ng כְּאֶחָד upang maipahayag ang pagkakaisa nang walang di-umiiral na paghahambing. Pinili ang "mga taong mula sa pagkabihag" bilang mas malapit at di-labis na interpretasyon ng בְּנֵי הַגּוֹלָה. Pinanatili ang saklaw ng הַפֶּסַח bilang "handog ng Paskuwa," dahil ang teksto ay nagsasabing ito ay kinatay ngunit hindi tinutukoy ang uri ng hayop.
