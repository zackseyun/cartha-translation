  text: And the sons of the exile kept the Passover on the fourteenth day of the first month[a].
translation:
  language: tl
  text: Ipinagdiwang ng mga ipinatapon[a] ang Paskuwa noong ika-labing-apat na araw ng unang buwan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “mga anak ng pagkakatapon”; maaari ring isaling “mga ipinatapon.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: Ipinagdiwang
  rationale: Bagaman literal na nangangahulugang “ginawa” ang pandiwa, kapag ang Paskuwa ang layon nito, tumutukoy ito sa pagsasagawa o pagdiriwang ng itinakdang ritwal.
- source_word: בְנֵי הַגּוֹלָה
  choice: mga kabilang sa sambayanan ng mga ipinatapon
  rationale: Ang literal na idyomang Hebreo ay “mga anak ng pagkatapon,” ngunit kolektibo itong tumutukoy sa mga kabilang sa komunidad na ipinatapon. Pinananatili ng salin ang pagkakakilanlang pangkomunidad nang hindi ipinahihiwatig na mga lalaki lamang sila.
- source_word: הַפָּסַח
  choice: ang Paskuwa
  rationale: Malawak na katawagan ito para sa pagdiriwang ng Paskuwa at hindi nito labis na nililimitahan ang kahulugan sa hain, pagkain, o kapistahan lamang.
- source_word: בְּאַרְבָּעָה עָשָׂר
  choice: nang ikalabing-apat na araw
  rationale: Ang bilang na labing-apat ay bahagi ng pormula ng petsa; idinagdag ang “araw” ayon sa likas na gamit sa Filipino.
- source_word: לַחֹדֶשׁ הָרִאשׁוֹן
  choice: ng unang buwan
  rationale: Likas at malapit sa Hebreo ang pariralang ito bilang karugtong ng “ikalabing-apat na araw.”
