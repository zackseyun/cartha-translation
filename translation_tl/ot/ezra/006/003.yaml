base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/003.yaml
  text: 'In the first year of King Cyrus[a], Cyrus the king issued a decree: Concerning the house of God in Jerusalem, let the house be rebuilt, the place where they offer sacrifices, and let its foundations be laid. Its height shall be sixty cubits, and its width sixty cubits,'
translation:
  language: tl
  text: 'Noong unang taon ni Haring Ciro, nagpalabas si Haring Ciro ng isang utos: “Tungkol sa bahay ng Diyos sa Jerusalem: itayo ang bahay bilang lugar ng paghahain ng mga handog, at ilagay ang mga pundasyon nito.[a] Ang taas nito ay animnapung siko, at ang lapad nito ay animnapung siko.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “panatilihin/itaas ang mga pundasyon nito.” Mahirap unawain ang pariralang Aramaiko, kaya iba-iba ang salin dito; ang “ilagay ang mga pundasyon nito” ang pinakaangkop sa konteksto ng pagtatayo.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּשְׁנַת חֲדָה לְכוֹרֶשׁ מַלְכָּא
  choice: Nang unang taon ng paghahari ni Haring Ciro
  rationale: Ipinahahayag nang natural sa modernong Tagalog ang pormulang pangkronolohiya na literal na ‘sa unang taon ni Ciro na hari.’
- source_word: שָׂם טְעֵם
  choice: nagpalabas ... ng isang utos
  rationale: Ang idyomang Aramaiko na literal na ‘naglagay ng utos’ ay tumutukoy sa opisyal na pagpapahayag ng isang kautusan.
- source_word: בֵּית אֱלָהָא
  choice: bahay ng Diyos
  rationale: Pinananatili ang literal na ‘bahay ng Diyos’ at ang pag-uulit ng salitang ‘bahay’ sa kasunod na parirala, bagaman templo ang tinutukoy.
- source_word: יִתְבְּנֵא
  choice: muling itayo
  rationale: Ang anyong pandiwa ay may puwersa ng utos sa kontekstong ito. Bagaman payak na ‘itayo’ ang pandiwa, ipinahihiwatig ng makasaysayang konteksto ang muling pagtatayo matapos itong mawasak.
- source_word: אֲתַר דִּי דָבְחִין דִּבְחִין
  choice: ang lugar na pinaghahandugan ng mga handog
  rationale: Isinasalin nang natural ang magkaugnay na pandiwa at pangngalan sa Aramaiko habang pinananatili ang diwa ng paghahandog sa lugar na iyon.
- source_word: וְאֻשּׁוֹהִי מְסוֹבְלִין
  choice: at ilagay ang mga pundasyon nito
  rationale: Mahirap at pinagtatalunang parirala ito. Ang paglalagay ng mga pundasyon ang pinakaangkop sa konteksto ng mga tagubilin sa pagtatayo, ngunit inilalahad sa talababa ang ibang posibleng kahulugan.
- source_word: רוּמֵהּ
  choice: Ang taas nito
  rationale: Tuwirang terminong pang-arkitektura para sa taas ng gusali.
- source_word: אַמִּין שִׁתִּין
  choice: animnapung siko
  rationale: Pinananatili ang sinaunang yunit na siko sa halip na tantiyahin ito sa modernong sukat.
- source_word: פְּתָיֵהּ
  choice: ang lapad
  rationale: Natural na makabagong terminong Tagalog para sa breadth o width ng gusali.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog ang ginamit. Pinanatili ang administratibong himig ng atas, ang literal na ‘bahay ng Diyos,’ at ang sinaunang sukat na ‘siko.’ Inilagay ang talababa sa mismong mahirap na parirala tungkol sa mga pundasyon, sa halip na sa pangalan ni Ciro.
