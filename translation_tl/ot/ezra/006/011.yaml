id: EZR.6.11
reference: Ezra 6:11
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וּ/מִנִּ/י֮ שִׂ֣ים טְעֵם֒ דִּ֣י כָל אֱנָ֗שׁ דִּ֤י יְהַשְׁנֵא֙ פִּתְגָמָ֣/א דְנָ֔ה יִתְנְסַ֥ח אָע֙ מִן בַּיְתֵ֔/הּ וּ/זְקִ֖יף יִתְמְחֵ֣א עֲלֹ֑/הִי וּ/בַיְתֵ֛/הּ נְוָל֥וּ יִתְעֲבֵ֖ד עַל דְּנָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/011.yaml
  text: 'And from me a decree is issued: if any man alters this edict[a], a beam shall be pulled out from his house, and he shall be impaled on it[c][b]; and his house shall be made a refuse heap because of this.'
translation:
  language: tl
  text: 'Naglalabas din ako ng isang utos: Ang sinumang magbago sa kautusang ito, bubunutin ang isang biga[a] mula sa kanyang bahay, at itutuhog siya rito[b]. Dahil dito, gagawing tambakan ng basura[c] ang kanyang bahay.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, isang malaking piraso ng kahoy.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring, “ibibitin siya rito.”
    reason: alternative_reading
  - marker: c
    text: Ayon sa tradisyon, “tambakan ng dumi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׂים טְעֵם
  choice: naglalabas ... ng isang utos
  rationale: Likas na pahayag sa makabagong Filipino para sa pormal na paglalabas ng isang maharlikang utos, habang pinananatili ang administratibong diwa ng idyoma.
- source_word: כָל אֱנָשׁ
  choice: ang sinuman
  rationale: Ipinahahayag ang pangkalahatang saklaw ng parirala nang natural sa Filipino; hindi kailangang tukuyin ang kasarian upang maipakita ang generic na diwa.
- source_word: יְהַשְׁנֵא
  choice: magbago
  rationale: Sa konteksto, tumutukoy ito sa pagbabago o pakikialam sa opisyal na kautusan, hindi lamang sa pagsuway rito.
- source_word: פִּתְגָמָא דְנָה
  choice: kautusang ito
  rationale: Ang terminong Aramaiko ay tumutukoy sa opisyal na pahayag o edikto; malinaw at marangal sa karaniwang Filipino ang “kautusan.”
- source_word: יִתְנְסַח אָע מִן בַּיְתֵהּ
  choice: bubunutin ang isang biga mula sa kanyang bahay
  rationale: Pinananatili ang kongkretong larawan ng kahoy na bahagi ng bahay na sapilitang aalisin upang gamitin sa parusa.
- source_word: וּזְקִיף יִתְמְחֵא עֲלֹהִי
  choice: itutuhog siya rito
  rationale: Ipinakikita ang marahas na sinaunang parusa at iniiwasan ang makabagong larawan ng pagbitay sa lubid, habang inilalagay sa talababa ang lehitimong alternatibo.
- source_word: נְוָלוּ
  choice: tambakan ng basura
  rationale: Natural at malinaw na katumbas ng isang kahiya-hiyang tambakan o maruming guho; pinananatili sa talababa ang tradisyonal na “tambakan ng dumi.”
- source_word: יִתְעֲבֵד
  choice: gagawing
  rationale: 'Pinananatili ang pasibong/legal na diwa: ipapataw sa bahay ang kalagayang ito bilang bunga ng paglabag.'
theological_decisions:
- issue: Eksaktong uri ng parusang inilalarawan ng wikang imperyal
  choice: Itutuhog siya rito
  alternative: Ibibitin siya rito
  rationale: Maaaring ilarawan ng Aramaiko ang pagtataas o pagkakabit ng tao sa kahoy. Mas angkop sa sinaunang konteksto ang “itutuhog” kaysa sa salitang maaaring magpahiwatig ng pagbitay sa lubid, ngunit pinananatili ang tunay na leksikal na posibilidad sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino na angkop sa isang pormal na utos ng hari. Pinanatili ang matinding larawan ng kaparusahan at ang legal na himig nang hindi gumagamit ng labis na arkaiko o denominasyonal na pananalita.
