base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/017.yaml
  text: And they offered for the dedication of this house of God one hundred bulls[a], two hundred rams, four hundred lambs, and twelve male goats as a sin offering for all Israel[b], according to the number of the tribes of Israel.
translation:
  language: tl
  text: At naghandog sila para sa pagtatalaga ng bahay na ito ng Diyos ng isang daang toro, dalawang daang lalaking tupa, apat na raang kordero, at labindalawang lalaking kambing bilang handog para sa kasalanan alang-alang sa buong Israel[a]—ayon sa bilang ng mga lipi ng Israel.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “para sa buong Israel.”
    reason: lexical_alternative
  - marker: b
    text: Ang labindalawang lalaking kambing ay katumbas ng bilang ng labindalawang lipi ng Israel, kaya kinakatawan ng handog ang buong Israel.
    reason: cultural_note
lexical_decisions:
- source_word: וְהַקְרִבוּ
  choice: At naghandog sila
  rationale: Ang causative na anyo ng קרב ay tumutukoy sa paghahandog ng mga hayop sa kontekstong panritwal; natural at tiyak sa Filipino ang “naghandog.”
- source_word: לַחֲנֻכַּת
  choice: para sa pagtatalaga
  rationale: Ang חנכה ay seremonyal na pagtatalaga o pagpapasinaya. Pinananatili ng “para sa pagtatalaga” ang layuning ipinahihiwatig ng pang-ukol.
- source_word: בֵּית אֱלָהָא דְנָה
  choice: ng bahay na ito ng Diyos
  rationale: Pinananatili ang literal na larawang “bahay ng Diyos” sa halip na gawing “templo,” habang malinaw sa modernong Filipino ang pagtukoy na “ito.”
- source_word: תּוֹרִין
  choice: toro
  rationale: Sa talaan ng mga hain, tumutukoy ito sa mga lalaking baka; “toro” ang malinaw at karaniwang salin.
- source_word: דִּכְרִין
  choice: lalaking tupa
  rationale: Tiyak na tumutukoy ang salita sa mga lalaking tupa; mas madaling maunawaan ito ng karaniwang mambabasa kaysa sa hiram o teknikal na katawagan.
- source_word: אִמְּרִין
  choice: kordero
  rationale: Tumutukoy ito sa mga batang tupa; “kordero” ang natural na katawagang panhain sa Filipino.
- source_word: וּצְפִירֵי עִזִּין
  choice: lalaking kambing
  rationale: Malinaw na ipinahihiwatig ng parirala ang kasarian at uri ng hayop.
- source_word: לחטיא
  choice: bilang handog para sa kasalanan
  rationale: Isa itong terminong panhain na kaugnay ng kasalanan o paglilinis. Pinananatili ng salin ang tradisyonal na kategorya nang hindi inaalis ang posibleng aspektong panlinis.
- source_word: עַל כָּל יִשְׂרָאֵל
  choice: alang-alang sa buong Israel
  rationale: Ipinahihiwatig ng עַל dito ang kapakinabangan o kinatawang saklaw ng hain; malinaw itong naipapahayag ng “alang-alang sa.”
- source_word: לְמִנְיָן שִׁבְטֵי יִשְׂרָאֵל
  choice: ayon sa bilang ng mga lipi ng Israel
  rationale: Tuwirang pinananatili nito ang paliwanag kung bakit labindalawa ang mga kambing.
theological_decisions:
- issue: Saklaw ng “buong Israel” sa kalagayang pagkatapos ng pagpapatapon
  choice: buong Israel
  alternative: ang mga bumalik lamang mula sa pagpapatapon
  rationale: Tahasang sinasabi ng teksto ang “buong Israel” at iniuugnay ang labindalawa sa bilang ng mga lipi. Hindi nililimitahan ng salin ang saklaw sa mga aktuwal na nakabalik.
- issue: Kahulugan ng handog na חטיא
  choice: handog para sa kasalanan
  alternative: handog para sa paglilinis
  rationale: Pinananatili ang kinikilalang kahulugang panhain habang hindi nagdaragdag ng paliwanag na magpapasya sa buong teolohikal na ugnayan ng kasalanan at paglilinis.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at angkop sa pampublikong pagbasa. Pinanatili ang “bahay ng Diyos” bilang malapit sa Aramaic, at ginamit ang karaniwang katawagan sa mga hayop upang madaling maunawaan.
