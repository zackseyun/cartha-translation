base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/021.yaml
  text: The sons of Israel who had returned from the exile ate, together with everyone who had separated himself from the uncleanness of the peoples of the land to join them, to seek Yahweh, the God of Israel.
translation:
  language: tl
  text: Kumain ang mga Israelita[a] na bumalik mula sa pagkakatapon, kasama ang lahat ng humiwalay sa karumihan[b] ng mga mamamayan ng lupain upang makiisa sa kanila[c] at hanapin si Yahweh, ang Diyos ng Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “mga anak ni Israel.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “sa kawalang-kalinisan” o “sa pagkarumi ng mga mamamayan ng lupain.”
    reason: lexical_alternative
  - marker: c
    text: Sa literal, “sa kanila”; ipinahihiwatig nito ang pakikiisa sa pamayanang bumalik mula sa pagkakatapon.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאכְלוּ
  choice: Kumain
  rationale: Payak na nangangahulugang “kumain” ang pandiwa. Nauunawaan mula sa naunang talata na ang pagkaing pampaskuwa ang tinutukoy, kaya hindi na kailangang idagdag ang layon.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: ang mga Israelita
  rationale: Likas at malinaw ito sa modernong Tagalog; ang literal na idyomang Hebreo na “mga anak ni Israel” ay inilagay sa talababa.
- source_word: הַשָּׁבִים מֵהַגּוֹלָה
  choice: na bumalik mula sa pagkakatapon
  rationale: Tumpak nitong inilalarawan ang mga nagsibalik mula sa pagkatapon nang hindi ipinahihiwatig na sila ay mga bihag pa noon.
- source_word: וְכֹל הַנִּבְדָּל
  choice: kasama ang lahat ng humiwalay
  rationale: Ipinakikita ng Niphal participle ang mga taong nagbukod o humiwalay ng sarili; ipinahahayag ng “kasama” na nakibahagi rin sila sa pagkain.
- source_word: מִטֻּמְאַת גּוֹיֵי הָאָרֶץ
  choice: sa karumihan ng mga bayan sa lupain
  rationale: Pinananatili ng “karumihan” ang maaaring ritwal at moral na diwa ng טֻמְאָה. Ang maramihang “mga bayan” ay hindi nililimitahan sa iisang bansa.
- source_word: אֲלֵהֶם
  choice: upang makiisa sa kanila
  rationale: Literal itong “sa kanila.” Sa konteksto, ipinahihiwatig nito ang paglapit at pakikiugnay sa pamayanang bumalik, ngunit itinatala sa talababa ang literal na anyo.
- source_word: לִדְרֹשׁ
  choice: hanapin
  rationale: Pinananatili nito ang malawak na diwa ng taimtim na pagbaling at paglapit sa Diyos, sa halip na paliitin ito sa pagsamba o pagsangguni lamang.
- source_word: לַיהוָה
  choice: si Yahweh
  rationale: Tuwirang inililipat sa Tagalog ang personal na pangalang nasa tekstong Hebreo.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ang Diyos ng Israel
  rationale: Karaniwan at tumpak na anyo ng pariralang tumutukoy sa Diyos ng Israel.
theological_decisions:
- issue: Pagkakakilanlan ng mga karagdagang nakibahagi sa Paskuwa
  choice: Inilalarawan sila nang malawak bilang lahat ng humiwalay sa karumihan ng mga bayan sa lupain at nakiisa sa mga bumalik upang hanapin si Yahweh.
  alternative: Maaaring unawain sila bilang mga taong mula sa ibang bayan na yumakap sa pananampalataya ng Israel, o bilang mga Israelitang nanatili sa lupain ngunit humiwalay sa karumihan ng mga nakapaligid na bayan.
  rationale: Hindi tahasang tinatawag ng Hebreo ang grupong ito na mga proselita ni nililimitahan sila sa mga etnikong Israelita. Kaya pinananatili ng salin ang pagiging bukas ng pagkakakilanlan nila.
- issue: Ugnayan ng אֲלֵיהֶם sa pangungusap
  choice: Isinalin bilang “upang makiisa sa kanila,” kasunod ng paglalarawan sa kanilang paghiwalay sa karumihan.
  alternative: Maaaring panatilihing literal bilang “sa kanila,” o iugnay lamang ang layunin sa “upang hanapin si Yahweh.”
  rationale: Ang “makiisa sa kanila” ay likas na naghahayag sa Tagalog ng direksiyon ng אֲלֵיהֶם patungo sa pamayanang bumalik, habang kinikilala sa talababa na mas maikli at hindi gaanong tiyak ang literal na Hebreo.
translation_notes:
  register: Gumamit ng moderno, malinaw, at marangal na Tagalog. Pinili ang “mga Israelita” kaysa sa literal ngunit hindi gaanong likas na “mga anak ni Israel,” at pinanatili ang “karumihan” upang madama ang ritwal at moral na bigat ng salita sa konteksto ng Paskuwa.
