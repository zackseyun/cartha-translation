  source_fidelity: Tumpak ang pangunahing diwa, kabilang ang mga nagsibalik, ang karumihan, pakikiisa sa kanila, at paghahanap kay Yahweh. Gayunman, ang “mga bayan sa lupain” ay karaniwang tumutukoy sa mga settlement/bayan sa modernong Tagalog, samantalang ang גּוֹיֵי הָאָרֶץ ay mga pangkat ng tao o mamamayan ng lupain.
  naturalness: Malinaw at marangal ang pangungusap. Mas likas at mas tiyak ang “mga mamamayan ng lupain” kaysa “mga bayan sa lupain.”
  terminology: Ang “karumihan” ay angkop para sa ritwal at moral na bigat ng טֻמְאָה. Ang “Yahweh” at “Diyos ng Israel” ay pare-pareho at angkop. Ang talababa b ay kailangang iayon sa binagong pangunahing teksto at iwasan ang “karumaldumal,” na mas malakas at mas makitid kaysa sa Hebreo.
  issues:
