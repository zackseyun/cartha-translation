revisions:
- from: At ang matatandang pinuno ng mga Judio ay patuloy na nagtatayo at umuunlad[a] sa pamamagitan ng panghuhula nina propetang Hagai at Zacarias na anak ni Iddo. Natapos nila ang pagtatayo ayon sa utos[b] ng Diyos ng Israel at ayon sa mga utos nina Ciro, Dario, at Artajerjes, na hari ng Persia.[c]
  to: At ang matatandang pinuno ng mga Judio ay patuloy na nagtatayo at umuunlad[a] sa pamamagitan ng propesiya nina propetang Hagai at Zacarias na anak ni Iddo. Natapos nila ang pagtatayo ayon sa utos[b] ng Diyos ng Israel at ayon sa utos nina Ciro, Dario, at Artajerjes, na hari ng Persia.[c]
  rationale: Pinalitan ang “panghuhula” ng “propesiya” upang tapat na maipahayag ang propetikong diwa nang hindi nagpapahiwatig ng dibinasyon. Ibinalik sa singular ang “utos” sa ikalawang parirala upang sundin ang anyo ng Aramaic at mapanatili ang saklaw nitong maaaring tumukoy sa sama-samang maharlikang awtorisasyon nang hindi labis na tinutukoy ang bilang ng mga kautusan. Inayos din ang talababa c upang tumugma sa salin.
