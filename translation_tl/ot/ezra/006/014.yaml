  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/שָׂבֵ֤י יְהוּדָיֵ/א֙ בָּנַ֣יִן וּ/מַצְלְחִ֔ין בִּ/נְבוּאַת֙ חַגַּ֣י נביא/ה וּ/זְכַרְיָ֖ה בַּר עִדּ֑וֹא וּ/בְנ֣וֹ וְ/שַׁכְלִ֗לוּ מִן טַ֨עַם֙ אֱלָ֣הּ יִשְׂרָאֵ֔ל וּ/מִ/טְּעֵם֙ כּ֣וֹרֶשׁ וְ/דָרְיָ֔וֶשׁ וְ/אַרְתַּחְשַׁ֖שְׂתְּא מֶ֥לֶךְ פָּרָֽס־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/014.yaml
  text: And the elders of the Jews were building and prospering through the prophecy of Haggai the prophet and Zechariah son of Iddo[c][b][a]. They finished building by the decree of the God of Israel and by the decree of Cyrus and Darius and Artaxerxes king of Persia.
translation:
  language: tl
  text: At ang matatandang pinuno ng mga Judio ay patuloy na nagtatayo at umuunlad[a] sa pamamagitan ng propesiya nina propetang Hagai at Zacarias na anak ni Iddo. Natapos nila ang pagtatayo ayon sa utos[b] ng Diyos ng Israel at ayon sa utos nina Ciro, Dario, at Artajerjes, na hari ng Persia.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nagtatagumpay” o “sumusulong.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “ayon sa atas” o “ayon sa pasiya.”
    reason: lexical_alternative
  - marker: c
    text: Iniuugnay ng talata ang pagkakatapos kapuwa sa utos ng Diyos at sa utos nina Ciro, Dario, at Artajerjes; unang binabanggit ang utos ng Diyos.
    reason: theological_clarification
lexical_decisions:
- source_word: שָׂבֵי יְהוּדָיֵא
  choice: matatandang pinuno ng mga Judio
  rationale: Ang parirala ay tumutukoy sa mga elder o kinikilalang pinuno ng pamayanan, hindi lamang sa matatanda ang edad. Nililinaw ito ng “pinuno” habang pinananatili ang tawag na “mga Judio.”
- source_word: בָּנַיִן
  choice: patuloy na nagtatayo
  rationale: Ang participle ay nagpapahayag ng nagpapatuloy na gawain. Hindi idinagdag ang mas tiyak na “muling nagtatayo,” sapagkat hindi iyon tahasang nasa pandiwa.
- source_word: וּמַצְלְחִין
  choice: umuunlad
  rationale: Ipinahihiwatig ng pandiwa na nagtatagumpay o maayos na sumusulong ang gawain. Ang “umuunlad” ay likas sa Filipino at hindi labis na nagpapahiwatig ng materyal na kasaganaan.
- source_word: בִּנְבוּאַת
  choice: sa pamamagitan ng panghuhula
  rationale: 'Pinananatili nito ang instrumental na diwa ng pang-ukol: ang ministeryo o pagpapahayag ng mga propeta ang naging paraan ng pag-unlad ng gawain.'
- source_word: חַגַּי נביאה
  choice: propetang Hagai
  rationale: Likas na appositional na ayos sa Filipino para sa pangalan at titulo.
- source_word: וּזְכַרְיָה בַּר עִדּוֹא
  choice: at Zacarias na anak ni Iddo
  rationale: Tuwirang isinasalin ang Aramaic na panandang pagkaanak na “bar.”
- source_word: וּבְנוֹ וְשַׁכְלִלוּ
  choice: Natapos nila ang pagtatayo
  rationale: Pinagsasama sa likas na Filipino ang pagtatayo at pagdadala nito sa ganap na katapusan, ayon sa daloy ng dalawang pandiwa at sa naunang gawain ng mga tagapagtayo.
- source_word: מִן טַעַם
  choice: ayon sa utos
  rationale: Ang salita sa Imperial Aramaic ay maaaring tumukoy sa opisyal na utos, pasiya, o atas. Ang “ayon sa utos” ay angkop kapuwa sa Diyos at sa mga hari at pinananatili ang magkatulad na pagkakabuo ng mga parirala.
- source_word: אֱלָהּ יִשְׂרָאֵל
  choice: Diyos ng Israel
  rationale: Tuwirang salin ng titulong nasa teksto.
- source_word: וּמִטְּעֵם כּוֹרֶשׁ וְדָרְיָוֶשׁ וְאַרְתַּחְשַׁשְׂתְּא
  choice: at ayon sa mga utos nina Ciro, Dario, at Artajerjes
  rationale: Ginawang maramihan ang “mga utos” sa natural na Filipino upang malinaw na tumukoy sa magkakahiwalay na pahintulot ng tatlong hari, nang hindi binabago ang sabayang pagbanggit sa kanila.
- source_word: מֶלֶךְ פָּרָס
  choice: na hari ng Persia
  rationale: Pinananatili ang singular na anyo ng titulong pinakamalapit sa huling pangalang Artajerjes, sa halip na ipalagay na tahasang maramihan ang titulo.
theological_decisions:
- issue: Ugnayan ng utos ng Diyos at ng mga utos ng mga haring Persiano
  choice: Iniuugnay ang pagkakatapos sa utos ng Diyos ng Israel at sa mga utos ng mga hari, na unang binabanggit ang Diyos.
  alternative: Ituring ang mga utos ng mga hari bilang mga pagpapahayag lamang ng iisang utos ng Diyos.
  rationale: Tahasan at magkahiwalay na binabanggit ng talata ang banal at maharlikang awtorisasyon. Pinananatili ng salin ang dalawang antas ng pagkilos nang hindi ipinapaliwanag ang ugnayan nang higit sa sinasabi ng teksto.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “matatandang pinuno” upang maiwasang mapagkamalang edad lamang ang tinutukoy ng “elders.” Pinanatili ang singular na “hari ng Persia” dahil singular ang source form, bagaman maaaring sa konteksto ay maiugnay ang pagiging haring Persiano sa buong talaan.
