  text: בֵּ/אדַ֛יִן דָּרְיָ֥וֶשׁ מַלְכָּ֖/א שָׂ֣ם טְעֵ֑ם וּ/בַקַּ֣רוּ בְּ/בֵ֣ית סִפְרַיָּ֗/א דִּ֧י גִנְזַיָּ֛/א מְהַחֲתִ֥ין תַּמָּ֖ה בְּ/בָבֶֽל׀׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/001.yaml
  text: Then King Darius issued a decree[a], and they searched in the house of the archives, where the treasures were stored[c][b], there in Babylon.
translation:
  language: tl
  text: Nang magkagayon, nagpalabas ng utos si Haring Dario[a], at naghanap sila sa bahay ng mga kasulatan[b], kung saan nakalagak ang mga kayamanan[c], doon sa Babilonia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “Nagtakda ng utos si Dario na hari, at nagsagawa ng paghahanap sa bahay ng mga kasulatan.” Mas literal na “nagtakda ng utos” ang Aramaiko at gumagamit ito ng pandiwang nasa ikatlong panauhang maramihan (“naghanap sila”), na maaari ring gamiting impersonal.
    reason: alternative_reading
  - marker: b
    text: Ang “bahay ng mga kasulatan” ay literal na “bahay ng mga aklat/dokumento” at tumutukoy sa opisyal na imbakan ng mga tala o arkibo.
    reason: lexical_alternative
  - marker: c
    text: Ang “mga kayamanan” ay maaari ring unawain nang mas malawak bilang mahahalagang bagay o mga depositong nakaimbak sa gusali ng arkibo.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּאדַיִן
  choice: Nang magkagayon
  rationale: Panandang Aramaiko ito ng kasunod na pangyayari sa salaysay. Likas at marangal sa Filipino ang “Nang magkagayon” at malinaw nitong ipinagpapatuloy ang pagkakasunod-sunod ng mga pangyayari.
- source_word: דָּרְיָוֶשׁ מַלְכָּא
  choice: Haring Dario
  rationale: Isinalin ang titulo ayon sa natural na ayos sa Filipino at ginamit ang karaniwang anyong Filipino ng pangalan.
- source_word: שָׂם טְעֵם
  choice: nagpalabas ng utos
  rationale: Literal itong “nagtakda/naglagay ng utos.” Ang “nagpalabas ng utos” ay likas na pahayag para sa opisyal na atas ng hari at hindi nagpapalagay ng higit sa pinagmulan.
- source_word: וּבַקַּרוּ
  choice: at naghanap sila
  rationale: Aktibong pandiwa sa ikatlong panauhang maramihan ang nasa Aramaiko. Pinanatili ang “sila,” bagaman maaaring di-tiyak o impersonal ang tinutukoy na mga nagsagawa ng paghahanap.
- source_word: בְּבֵית סִפְרַיָּא
  choice: sa bahay ng mga kasulatan
  rationale: Literal itong “bahay ng mga aklat/kasulatan” at tumutukoy sa opisyal na imbakan ng mga dokumento. Pinananatili ng salin ang kongkretong larawan ng orihinal; nililinaw ng talababa ang tungkulin nito bilang arkibo.
- source_word: דִּי
  choice: kung saan
  rationale: Ipinahahayag ng pang-ugnay ang ugnayang panlunan sa pagitan ng bahay ng mga kasulatan at ng kasunod na sugnay.
- source_word: גִנְזַיָּא
  choice: ang mga kayamanan
  rationale: Ang salita ay tumutukoy sa mga kayamanan, mahahalagang bagay, o mga depositong itinago. Pinili ang tuwirang kahulugang “mga kayamanan” habang pinananatili sa talababa ang mas malawak na posibilidad.
- source_word: מְהַחֲתִין
  choice: nakalagak
  rationale: Ang pasibo o resultang anyo ay naglalarawan sa mga bagay na inilagay at nananatili sa imbakan. Ang “nakalagak” ay natural at angkop sa kontekstong pang-arkibo o pangkabuhayan.
- source_word: תַּמָּה
  choice: doon
  rationale: Pinanatili ang tahasang panandang panlunan ng Aramaiko kahit may “kung saan” na, sapagkat nagbibigay ito ng diin sa lokasyon.
- source_word: בְּבָבֶל
  choice: sa Babilonia
  rationale: Karaniwang anyong Filipino ng pangalan ng lugar na may natural na pang-ukol.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na dignified ngunit madaling maunawaan. Pinanatili ang aktibong maramihang “naghanap sila,” ang larawan ng “bahay ng mga kasulatan,” at ang bahagyang pag-uulit na panlunan sa “kung saan… doon sa Babilonia” upang maipakita ang anyo at diin ng Aramaiko nang hindi nagiging lubhang mekanikal.
