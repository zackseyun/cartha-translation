base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/013.yaml
  text: Then Tattenai[a], the governor of Beyond the River, Shethar-bozenai, and their associates did exactly so[b], in accordance with what King Darius had sent.
translation:
  language: tl
  text: Nang magkagayon, sina Tatenai, na gobernador ng Kabilang-Ilog[a], Setar-bozenai, at ang kanilang mga kasamahan ay kumilos nang buong pag-iingat at katumpakan[b], ayon sa ipinadala ni Haring Dario.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “Kabilang-Ilog” ay katawagang administratibo ng Imperyong Persia para sa rehiyon sa kanluran ng Ilog Eufrates.
    reason: cultural_note
  - marker: b
    text: Maaari ring isalin na “ginawa iyon nang buong ingat” o “isinagawa iyon nang buong katumpakan.” Binibigyang-diin ng ekspresyong Aramaiko ang maingat at eksaktong pagsunod sa ipinadalang tagubilin ng hari.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱדַיִן
  choice: Nang magkagayon
  rationale: Karaniwang panandang Aramaiko ito para sa kasunod na pangyayari sa salaysay. Likas sa makabagong Filipino ang “Nang magkagayon” at napananatili nito ang daloy ng pangyayari.
- source_word: פַּחַת עֲבַר נַהֲרָה
  choice: gobernador ng Kabilang-Ilog
  rationale: Ang פַּחַת ay gobernador ng isang lalawigan, at ang עֲבַר נַהֲרָה ay opisyal na katawagang Persiano sa rehiyon sa kanluran ng Eufrates. Pinanatili ang anyong tila pantanging pangalan ng rehiyon.
- source_word: שְׁתַר בּוֹזְנַי
  choice: Setar-bozenai
  rationale: Isinalin-titik ang pangalang pantangi sa paraang madaling bigkasin ng mambabasang Filipino.
- source_word: וּכְנָוָתְהוֹן
  choice: at ang kanilang mga kasamahan
  rationale: Tumutukoy ito sa mga taong kasama o kaugnay nila sa opisyal na gawain; natural at sapat ang “mga kasamahan” sa konteksto.
- source_word: לָקֳבֵל דִּי
  choice: ayon sa
  rationale: Ipinahahayag ng parirala ang pagsunod o pag-ayon sa ipinadalang tagubilin.
- source_word: שְׁלַח
  choice: ipinadala
  rationale: Pinanatili ang literal na diwa ng pandiwang “nagpadala” nang hindi tahasang dinaragdagan ang di-binanggit na layon gaya ng “kautusan” o “dekreto.”
- source_word: כְּנֵמָא אָסְפַּרְנָא
  choice: nang buong ingat at eksakto
  rationale: Ang magkatambal na ekspresyon ay nagbibigay-diin sa maingat at tumpak na pagtupad. Ang dalawang katangian ay pinanatili upang hindi paliitin ang saklaw ng Aramaiko.
- source_word: עֲבַדוּ
  choice: kumilos
  rationale: Malawak ang kahulugan ng pandiwa na “gumawa/kumilos.” Ang “kumilos” ay natural kasama ng pariralang “ayon sa ipinadala” at hindi nagdaragdag ng tahasang layon na wala sa teksto.
theological_decisions: []
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang opisyal na katawagang heograpiko na “Kabilang-Ilog,” at iniwasang idagdag sa pangunahing teksto ang “kautusan” o “dekreto” dahil hindi tahasang binanggit ang layon ng “ipinadala” sa Aramaiko.
