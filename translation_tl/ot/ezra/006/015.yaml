  yaml_path: translation/ot/ezra/006/015.yaml
  text: And this house was finished by the third day of the month Adar[b][a], which was the sixth year of the reign of King Darius.
translation:
  language: tl
  text: At natapos ang bahay[a] na ito pagsapit ng ikatlong araw ng buwan ng Adar[b], na noon ay ikaanim na taon ng paghahari ni Haring Dario.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “templong ito.” Literal sa Aramaiko ang “bahay na ito,” isang karaniwang tawag sa templo sa Ezra.
    reason: lexical_alternative
  - marker: b
    text: O, “noong ikatlong araw ng buwan ng Adar.” Maaaring unawain ang parirala bilang mismong petsa kung kailan natapos ang gawain.
    reason: alternative_reading
lexical_decisions:
- source_word: וְשֵׁיצִיא
  choice: At natapos
  rationale: Ipinahihiwatig ng pandiwang Aramaiko sa kontekstong ito ang pagdadala sa isang proyektong gusali hanggang sa ganap na pagkakatapos. Pinananatili ng pasibong “natapos” ang pokus sa bahay sa halip na tukuyin ang mga nagtayo.
- source_word: בַּיְתָה דְנָה
  choice: ang bahay na ito
  rationale: Literal itong “ang bahay na ito.” Sa Ezra, karaniwang tawag ang “bahay” sa templo; pinananatili ng salin ang kongkretong salita ng pinagmulan habang malinaw pa rin sa konteksto.
- source_word: עַד יוֹם תְּלָתָה
  choice: pagsapit ng ikatlong araw
  rationale: Maaaring itakda ng עַד ang hangganang panahong inabot ng gawain. Likas na ipinapahayag sa Filipino ng “pagsapit ng” na natapos na ang gawain sa puntong iyon, habang hindi lubusang isinasara ang posibilidad na mismong araw iyon natapos.
- source_word: לִירַח אֲדָר
  choice: ng buwan ng Adar
  rationale: Tuwirang katumbas ito ng pariralang Aramaiko at natural na paraan ng pagbibigay ng petsa sa Filipino.
- source_word: דִּי הִיא
  choice: na siyang
  rationale: Iniuugnay ng pariralang ito ang petsang kababanggit sa taon ng paghahari; natural at malinaw ang “na siyang” sa Filipino.
- source_word: שְׁנַת שֵׁת
  choice: ikaanim na taon
  rationale: Ito ang karaniwang Filipino para sa ordinal na pormula ng taon ng paghahari.
- source_word: לְמַלְכוּת
  choice: ng paghahari ni
  rationale: Sa pormulang kronolohikal na ito, tumutukoy ang salita sa panahon ng pamumuno ng hari, kaya ang “paghahari” ang likas na katumbas.
- source_word: דָּרְיָוֶשׁ מַלְכָּא
  choice: Haring Dario
  rationale: Pinananatili nito ang tahasang titulong maharlika at ginagamit ang natural na ayos at nakaugaliang anyo ng pangalan sa Filipino.
