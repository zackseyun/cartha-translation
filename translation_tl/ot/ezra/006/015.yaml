translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang literal na “bahay” sa pangunahing teksto at inilagay sa talababa ang mas tahasang “templo.” Ginamit ang “pagsapit ng” upang maipakita ang temporal na hangganan ng עַד nang hindi ikinukubli ang posibleng pagbasa na tumutukoy sa mismong araw ng pagkakatapos.
