  verdict: revise
  source_fidelity: 'Malapit ang salin sa tekstong Aramaiko: naipapahayag ang pagkakatagpo ng balumbon sa Ecbatana, sa tanggulan sa lalawigan ng Media. Gayunman, ang “doon” ay hindi tiyak na tumutukoy sa balumbon, samantalang ang בְּגַוַּהּ ay “sa loob/nito.” Ang “opisyal” ay isang pagpapalawak na hindi tuwirang sinasabi ng termino, kahit naaayon ito sa kontekstong pansinupan.'
  naturalness: Natural at marangal ang “Ecbatana,” “tanggulan,” at “balumbon.” Mas malinaw at mas malapit sa pinagmulan ang “nakasulat dito” kaysa “nakasulat doon,” at ang pangwakas na “Isang tala:” ay mas maayos na nagpapakita sa pambungad na dokumentaryong katawagan.
  terminology: Ang “tanggulan” ay angkop para sa בִּירְתָא. Ang “tala” ay sapat at hindi labis na nagpapakahulugan para sa דִּכְרוֹנָה; maaaring ilahad sa talababa ang “memorandum” at “talang pansinupan” bilang mga alternatibo. Napananatili ang karaniwang makasaysayang pangalang “Ecbatana,” kasama ang “Achmetha” bilang alternatibong transliterasyon.
