    rationale: Ang Aramaikong בְּגַוַּהּ ay tumutukoy sa natagpuang balumbon (“sa loob nito”). Ang “dito” sa kasunod na sugnay ay mas malinaw na tumutukoy sa dokumentong binabanggit.
  - severity: low
    issue: Ang “opisyal” sa “opisyal na tala” ay interpretibong dagdag.
    rationale: Ang דִּכְרוֹנָה ay tumutukoy sa tala o memorandum; maaaring opisyal ang uri nito sa konteksto, ngunit hindi kailangang ipasok ang katangiang ito sa pangunahing teksto.
  - severity: low
    issue: Kailangang iayon ang talababa b sa binagong pangunahing katawagan.
    rationale: Kapag “tala” ang pangunahing salin, dapat ilahad ng talababa ang mga leksikal na alternatibo nang hindi ipinapalit ang isang mas tiyak na kahulugan sa teksto.
  revised_text: 'At sa Ecbatana[a], sa tanggulan na nasa lalawigan ng Media, ay natagpuan ang isang balumbon. At ganito ang nakasulat dito: Isang tala:[b]'
