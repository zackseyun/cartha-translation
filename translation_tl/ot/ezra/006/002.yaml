base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/002.yaml
  text: 'And in Ecbatana[a], the fortress that is in the province of Media, a scroll was found[c][b], and this was written in it as a record:'
translation:
  language: tl
  text: 'At sa Ecbatana[a], sa tanggulan na nasa lalawigan ng Media, ay natagpuan ang isang balumbon. At ganito ang nakasulat dito: Isang tala:[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Achmetha,” na mas malapit na transliterasyon ng pangalang Aramaiko para sa Ecbatana.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isaling “memorandum” o “talang pansinupan.” Ang termino ay tumutukoy sa isang dokumentaryong tala o alaala.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִשְׁתְּכַח
  choice: natagpuan
  rationale: Tuwirang ipinapahayag ang pasibong diwa ng pandiwang Aramaiko at natural sa konteksto ng paghahanap sa mga sinupan.
- source_word: אַחְמְתָא
  choice: Ecbatana
  rationale: Ginamit ang kinikilalang makasaysayang pangalan ng kabisera ng Media; inilagay sa talababa ang mas malapit na transliterasyong Aramaiko.
- source_word: בִּירְתָא
  choice: tanggulan
  rationale: Tumutukoy sa isang pinatibay na maharlika o administratibong kompleks; malinaw at marangal ang salitang Filipino nang hindi ipinapalagay na karaniwang kuta lamang.
- source_word: דִּי בְּמָדַי מְדִינְתָּה
  choice: na nasa lalawigan ng Media
  rationale: Pinananatili ang sugnay na panuring at ang administratibong katawagang 'lalawigan.'
- source_word: מְגִלָּה חֲדָה
  choice: ang isang balumbon
  rationale: Natural na isinasalin ang חֲדָה bilang panandang di-tiyak dito, habang malinaw na tinutukoy ang isang natagpuang balumbon.
- source_word: וְכֵן כְּתִיב בְּגַוַּהּ
  choice: Ganito ang nakasulat doon
  rationale: Natural na pambungad sa siping dokumentaryo at pinananatili ang pagtukoy sa nilalaman ng balumbon.
- source_word: דִּכְרוֹנָה
  choice: bilang isang opisyal na tala
  rationale: Ipinahihiwatig ng kontekstong pansinupan ang isang memorandum o tala ng pamahalaan; nililinaw ng 'opisyal' ang gamit nang hindi binabago ang pangunahing diwang 'tala.'
