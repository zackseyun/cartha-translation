translation_notes:
  register: Makabago ngunit marangal na Filipino na angkop sa isang maharlikang kautusan. Pinanatili ang pagkakaiba ng “bahay ng Diyos” at “templo,” gayundin ang tunay na hirap ng Aramaic sa pamamagitan ng talababa.
