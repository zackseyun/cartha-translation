base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/005.yaml
  text: And also let the gold and silver vessels of the house of God[a], which Nebuchadnezzar took out of the temple that was in Jerusalem and brought to Babylon, be returned and brought to the temple that is in Jerusalem, each to its place; and you shall put them in the house of God.
translation:
  language: tl
  text: Bukod dito, isauli at dalhin sa templong nasa Jerusalem, bawat isa sa lugar nito, ang mga sisidlang ginto at pilak ng bahay ng Diyos[a] na inilabas ni Nebucadnezar mula sa templong nasa Jerusalem at dinala sa Babilonia; at ilagay mo ang mga iyon sa bahay ng Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Isauli ang mga ito, at hayaang makarating ang bawat isa sa templo sa Jerusalem, sa lugar nito.” Medyo mahirap ang pagkakabuo ng Aramaic sa bahaging “at dalhin/pumaroon,” ngunit malinaw na ipinag-uutos na isauli ang mga sisidlan ng templo sa kani-kanilang lugar sa Jerusalem.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְאַף
  choice: Bukod dito
  rationale: Ipinakikilala nito ang isa pang bahagi ng utos at likas pakinggan sa isang pormal na kautusan.
- source_word: מָאנֵי
  choice: mga sisidlan
  rationale: Malawak na katawagan ito para sa mga kagamitang sagrado sa templo; pinananatili ng “mga sisidlan” ang tradisyonal at marangal na diwa.
- source_word: בֵית אֱלָהָא
  choice: bahay ng Diyos
  rationale: Tuwirang pinananatili ang literal na parirala at ang pagkakaiba nito sa הֵיכְלָא, na isinaling “templo.”
- source_word: דִּי דַהֲבָה וְכַסְפָּא
  choice: ginto at pilak
  rationale: Likas sa Tagalog ang “mga sisidlang ginto at pilak” upang ipahayag ang materyales ng mga ito.
- source_word: הַנְפֵּק
  choice: inilabas
  rationale: Ipinahihiwatig ng pandiwa ang pagpapalabas o pag-aalis sa loob ng templo.
- source_word: הֵיכְלָא
  choice: templo
  rationale: Sa konteksto, malinaw na tumutukoy ito sa templo sa Jerusalem at hindi sa palasyo.
- source_word: וְהֵיבֵל
  choice: dinala
  rationale: Natural na inilalarawan nito ang paglilipat ng mga sisidlan patungong Babilonia.
- source_word: יַהֲתִיבוּן
  choice: dapat ibalik
  rationale: Ipinahahayag nito ang utos na isauli ang mga bagay sa dati nilang lugar; ang “dapat” ay angkop sa estilo ng atas.
- source_word: וִיהָךְ
  choice: at dalhin
  rationale: Mahirap ang anyo, ngunit sa konteksto ay ipinagpapatuloy nito ang utos na maibalik ang mga sisidlan patungong Jerusalem, nang hindi labis na nilulutas ang kalabuan.
- source_word: לְאַתְרֵהּ
  choice: bawat isa sa kinalalagyan nito
  rationale: Ipinakikita ng isahang hulapi ang kaukulang lugar ng bawat sisidlan sa templo.
- source_word: וְתַחֵת
  choice: at ilagay mo
  rationale: Pinananatili ang ikalawang panauhang isahan at ang tuwirang puwersa ng utos sa opisyal.
