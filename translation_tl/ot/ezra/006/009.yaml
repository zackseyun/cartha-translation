  - severity: low
    issue: Hindi eksakto ang puwesto ng talababa a.
    rationale: Ang talababa ay nagpapaliwanag sa “tagubilin,” ngunit ang marka ay nakadikit sa “Jerusalem.” Inilipat ito sa “tagubilin” upang tumpak ang footnote anchor.
