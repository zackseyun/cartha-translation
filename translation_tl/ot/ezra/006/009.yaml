  text: וּ/מָ֣ה חַשְׁחָ֡ן וּ/בְנֵ֣י תוֹרִ֣ין וְ/דִכְרִ֣ין וְ/אִמְּרִ֣ין לַ/עֲלָוָ֣ן לֶ/אֱלָ֪הּ שְׁמַיָּ֟/א חִנְטִ֞ין מְלַ֣ח חֲמַ֣ר וּ/מְשַׁ֗ח כְּ/מֵאמַ֨ר כָּהֲנַיָּ֤/א דִי בִ/ירֽוּשְׁלֶם֙ לֶהֱוֵ֨א מִתְיְהֵ֥ב לְ/הֹ֛ם י֥וֹם בְּ/י֖וֹם דִּי לָ֥א שָׁלֽוּ׀׀׀־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/009.yaml
  text: And whatever is needed—young bulls[a], rams, and lambs for burnt offerings to the God of heaven, wheat, salt, wine, and oil, according to the word of the priests who are in Jerusalem—let it be given to them day by day without fail[b],
translation:
  language: tl
  text: At ang anumang kinakailangan—mga batang toro, mga lalaking tupa, at mga kordero para sa mga handog na sinusunog para sa Diyos ng langit, gayundin ang trigo, asin, alak, at langis—ay ibigay sa kanila ayon sa tagubilin[a] ng mga pari na nasa Jerusalem, araw-araw nang walang pagkukulang[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “ayon sa salita ng mga pari na nasa Jerusalem.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “nang hindi pumapalya”; idiniriin ng huling parirala na hindi dapat maputol o may makaligtaan sa pang-araw-araw na paglalaan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמָה חַשְׁחָן
  choice: At anumang kailangan
  rationale: Pinagsama ang pang-ugnay, di-tiyak na panghalip, at pangngalang tumutukoy sa pangangailangan upang maging natural sa Tagalog habang nananatili ang bukás na saklaw ng mga kinakailangang panustos.
- source_word: בְנֵי תוֹרִין
  choice: mga batang toro
  rationale: Ang idyomang Aramaic na literal na 'mga anak ng mga toro/baka' ay tumutukoy sa mga batang torong angkop sa paghahandog.
- source_word: דִכְרִין
  choice: mga lalaking tupa
  rationale: Tiyak nitong tinutukoy ang adultong lalaking tupa; mas malinaw ito sa karaniwang Tagalog kaysa sa hiram na terminong 'ram'.
- source_word: אִמְּרִין
  choice: mga kordero
  rationale: Karaniwan at tumpak na katawagan sa mga batang tupa sa konteksto ng paghahandog.
- source_word: לַעֲלָוָן
  choice: para sa mga handog na sinusunog
  rationale: Ipinahahayag ang uri ng handog na lubusang sinusunog; malinaw ito sa modernong Tagalog at hindi umaasa sa teknikal na terminong hindi pamilyar sa lahat.
- source_word: לֶאֱלָהּ שְׁמַיָּא
  choice: sa Diyos ng langit
  rationale: Pinananatili ang karaniwang titulong Aramaic sa Ezra at ang ugnayan nito sa mga handog.
- source_word: חִנְטִין
  choice: trigo
  rationale: Tiyak na trigo ang salita, hindi lamang butil sa pangkalahatan.
- source_word: מְלַח
  choice: asin
  rationale: Tuwirang katumbas sa Tagalog.
- source_word: חֲמַר
  choice: alak
  rationale: Sa konteksto ng mga panustos, alak ang tinutukoy.
- source_word: וּמְשַׁח
  choice: at langis
  rationale: Hindi tahasang tinutukoy ng teksto na langis ng olibo, kaya pinanatili ang mas malawak na 'langis'.
- source_word: כְּמֵאמַר כָּהֲנַיָּא
  choice: ayon sa tagubilin ng mga pari
  rationale: Literal itong 'ayon sa salita ng mga pari,' ngunit sa atas na administratibo ang 'tagubilin' ang natural na pagpapahayag ng awtoritatibong sinasabi nila; inilagay sa talababa ang literal na anyo.
- source_word: יֹום בְּיֹום דִּי לָא שָׁלוּ
  choice: araw-araw ... nang walang pagkukulang
  rationale: Pinananatili ang diin na tuluy-tuloy ang pang-araw-araw na paglalaan at walang dapat makaligtaan o maputol.
