  yaml_path: translation/ot/ezra/006/016.yaml
  text: And the sons of Israel[a], the priests, the Levites, and the rest of the sons of the exile celebrated the dedication of this house of God with joy.
translation:
  language: tl
  text: Ipinagdiwang ng mga anak ni Israel, ng mga pari, ng mga Levita, at ng natitirang mga anak ng pagkakatapon[a] ang pagtatalaga ng bahay na ito ng Diyos nang may kagalakan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O mas natural, “ng natitirang mga ipinatapon.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲבַדוּ
  choice: ipinagdiwang
  rationale: Sa kontekstong seremonyal, tumutukoy ang pandiwa sa pagsasagawa o pagdiriwang ng pagtatalaga; mas natural sa Tagalog ang “ipinagdiwang” kaysa sa literal na “ginawa.”
- source_word: בְנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Pinananatili nito ang anyo ng pariralang Aramaiko at ang marangal na estilong ginagamit sa talaan ng mga pangkat.
- source_word: כָּהֲנַיָּא
  choice: mga pari
  rationale: Karaniwan at malinaw na katawagan sa pangkat ng mga pari.
- source_word: וְלֵוָיֵא
  choice: mga Levita
  rationale: Karaniwang katawagan sa mga kabilang sa pangkat ni Levi na naglilingkod sa templo.
- source_word: וּשְׁאָר בְּנֵי גָלוּתָא
  choice: at ng iba pang mga anak ng pagkatapon
  rationale: Malapit ito sa literal na “nalabi sa mga anak ng pagkatapon” at pinananatili ang kolektibong katawagan sa pamayanang nagmula sa pagkakatapon. Inilalagay sa talababa ang mas natural na pagbasa.
- source_word: חֲנֻכַּת
  choice: pagtatalaga
  rationale: Tuwirang tumutukoy sa seremonyal na pagtatalaga ng bahay ng Diyos; hindi kailangang idagdag ang salitang “seremonya.”
- source_word: בֵּית אֱלָהָא דְנָה
  choice: bahay na ito ng Diyos
  rationale: Pinananatili ang literal at teolohikal na mahalagang katawagang “bahay ng Diyos” sa halip na gawing “templo.”
- source_word: בְּחֶדְוָה
  choice: nang may kagalakan
  rationale: Natural na Tagalog para sa pang-ukol at pangngalang nangangahulugang “may kagalakan.”
