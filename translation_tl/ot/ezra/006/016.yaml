translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang mga gitling na pahaba upang luminaw na ang mga pari, mga Levita, at iba pang mula sa pagkatapon ang bumubuo sa binanggit na mga anak ni Israel, nang hindi binabago ang pagkakasunod ng mga pangkat sa pinagmulan.
