  text: Leave the work on this house of God alone[a]; let the governor of the Jews and the elders of the Jews rebuild this house of God on its site.
translation:
  language: tl
  text: Huwag ninyong pakialaman ang gawain sa bahay na ito ng Diyos.[a] Hayaan ninyong muling itayo ng gobernador ng mga Judio at ng mga matatanda ng mga Judio ang bahay na ito ng Diyos sa lugar nito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga taga-Juda” sa halip na “mga Judio.” Ang salitang Aramaiko ay maaaring tumukoy sa mga mamamayan ng Juda sa kahulugang etniko o panrehiyon.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁבֻקוּ לַעֲבִידַת
  choice: Huwag ninyong pakialaman ang gawain
  rationale: Ang maramihang pautos mula sa שׁבק ay nag-uutos na tumigil sa panghihimasok. Likas sa modernong Tagalog ang “huwag ninyong pakialaman” at malinaw nitong naipapahayag ang puwersa ng utos.
- source_word: בֵּית אֱלָהָא דֵךְ
  choice: bahay na ito ng Diyos
  rationale: Tinutukoy ng דֵךְ ang partikular na templo sa usapan. Pinananatili ng “bahay na ito ng Diyos” ang demonstratibong diwa at ang karaniwang biblikal na larawan ng templo bilang bahay ng Diyos.
- source_word: פַּחַת
  choice: gobernador
  rationale: Ang פַּחַת ay isang gobernador o pinunong panlalawigan. Ang “gobernador” ang pinakakaraniwan at malinaw na katumbas sa Tagalog.
- source_word: יְהוּדָיֵא
  choice: mga Judio
  rationale: Maaaring tumukoy ang salitang Aramaiko sa mga Judio bilang bayan o sa mga taga-Juda bilang pangkat na panrehiyon. “Mga Judio” ang malinaw at kinagawiang pangunahing salin, habang inilalahad sa talababa ang lehitimong alternatibo.
- source_word: וּלְשָׂבֵי יְהוּדָיֵא
  choice: at ng matatandang pinuno ng mga Judio
  rationale: Ang שָׂבֵי ay mga elder na gumaganap bilang mga pinuno ng pamayanan. Nililinaw ng “matatandang pinuno” ang tungkuling pampamayanan at iniiwasan ang pag-unawang edad lamang ang tinutukoy.
- source_word: יִבְנוֹן
  choice: Hayaan ninyong muling itayo
  rationale: Ang imperfect plural sa wika ng kautusan ay may pahintulot o jussive na puwersa. Ang “hayaan ninyong” ay angkop pagkatapos ng utos na huwag manghimasok, at ipinahihiwatig ng “muling itayo” ang pagpapanumbalik ng templo.
- source_word: עַל אַתְרֵהּ
  choice: sa dati nitong kinaroroonan
  rationale: Ang אַתַר ay lugar o kinatatayuan. Sa konteksto ng muling pagtatayo, natural na ipinahahayag ng parirala na itatayo ang templo sa orihinal nitong lugar.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang maramihang “ninyo” dahil maramihan ang pautos sa Aramaiko. Ang “matatandang pinuno” ay mas madaling maunawaan ng karaniwang mambabasa kaysa sa payak na “matatanda,” nang hindi nagdaragdag ng natatanging posisyong panrelihiyon.
