  naturalness: Natural at marangal ang pangungusap, ngunit mas malinaw at mas malapit sa “be far from there” ang “manatili kayong malayo roon” kaysa “lumayo kayo roon.” Iniiwasan din nito ang bahagyang implikasyong paggalaw na wala sa Aramaico.
