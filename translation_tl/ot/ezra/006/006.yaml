translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog. Pinanatili ang pormal na himig ng utos ng hari, ang katawagang administratibo, at ang kalabuan ng אֲפַרְסְכָיֵא. Ginamit ang “nila” dahil ikatlong panauhang maramihan ang tahasang hulapi sa tekstong Aramaico.
