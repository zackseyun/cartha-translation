base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/006.yaml
  text: Now Tattenai[a], governor of the province Beyond the River, Shethar-bozenai, and your associates, the officials of Persia who are in Beyond the River[c][b], keep far away from there.
translation:
  language: tl
  text: Ngayon, Tatenai na gobernador ng Kabila ng Ilog[a], Setar-Bozenai, at ang mga kasamahan nila—ang mga Afarsakita[b] na nasa Kabila ng Ilog—manatili kayong malayo roon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “Kabila ng Ilog” ay katawagang administratibo ng Imperyo ng Persia para sa rehiyon sa kanluran ng Ilog Eufrates.
    reason: cultural_note
  - marker: b
    text: Maaaring tumukoy ang salitang Aramaico sa mga opisyal ng Persia; maaari rin itong isalin sa pamamagitan ng transliterasyong “mga Afarsakita.”
    reason: alternative_reading
lexical_decisions:
- source_word: כְּעַן
  choice: Ngayon
  rationale: Isang panandang pandiskurso sa Aramaico na nagpapasimula sa utos ng hari. Likas sa makabagong Tagalog ang “Ngayon” at hindi nito labis na binibigyang-kahulugang sanhi o bunga ang ugnayan sa naunang pahayag.
- source_word: תַּתְּנַי
  choice: Tatenai
  rationale: Isinatinig ang pangalang pantangi ayon sa karaniwang baybay at bigkas sa Tagalog.
- source_word: פַּחַת עֲבַר נַהֲרָה
  choice: gobernador ng Kabila ng Ilog
  rationale: Ang פַּחַת ay isang gobernador sa ilalim ng pamahalaang imperyal. Ang עֲבַר נַהֲרָה ay katawagang administratibo para sa teritoryo sa kanluran ng Eufrates mula sa pananaw ng imperyo.
- source_word: שְׁתַר בּוֹזְנַי
  choice: Setar-Bozenai
  rationale: Isinatinig ang tambalang pangalang pantangi sa paraang madaling basahin sa Tagalog.
- source_word: וּכְנָוָתְהוֹן
  choice: at ang mga kasamahan nila
  rationale: Ang pangngalan ay tumutukoy sa mga kasama o katuwang, at ang hulaping -הוֹן ay ikatlong panauhang panlalaking maramihan, kaya pinanatili ang literal na “nila” sa halip na gawing “ninyo.”
- source_word: אֲפַרְסְכָיֵא
  choice: mga Afarsakita
  rationale: Hindi tiyak kung ito ay katawagang etniko-administratibo o tumutukoy sa mga opisyal na Persiano. Pinanatili sa pangunahing teksto ang transliterasyon upang hindi sapilitang lutasin ang tunay na kalabuan.
- source_word: דִּי בַּעֲבַר נַהֲרָה
  choice: na nasa Kabila ng Ilog
  rationale: Tinutukoy ng sugnay ang kinaroroonan ng mga Afarsakita sa nasabing distritong imperyal.
- source_word: רַחִיקִין הֲוֹו מִן תַּמָּה
  choice: lumayo kayo roon
  rationale: Ang literal na “maging malayo kayo mula roon” ay isang utos na nangangahulugang huwag makialam o manatiling malayo. Ang “lumayo kayo roon” ay malinaw at natural na utos sa Tagalog nang hindi nagdaragdag ng tiyak na gawaing hindi binanggit.
