lexical_decisions:
- source_word: נִדְבָּכִין / נִדְבָּךְ
  choice: mga hanay / isang hanay
  rationale: Tumutukoy sa magkakapatong na hanay o course sa isang estruktura. Ang “hanay” ay malinaw at likas sa makabagong Filipino.
- source_word: אֶבֶן גְּלָל
  choice: tinabas na bato
  rationale: Sa konteksto ng pagtatayo, malamang na tumutukoy ito sa mga batong hinubog o inayos para sa pagmamason; iniiwasan ang literal ngunit di-likas na “iginulong na bato.”
- source_word: תְּלָתָא
  choice: tatlo
  rationale: Pangunahing bilang na naglalarawan sa dami ng mga hanay.
- source_word: אָע חֲדַת
  choice: bagong kahoy
  rationale: Ang אָע ay kahoy o troso. Ang “bagong kahoy” ay natural at madaling maunawaan habang pinananatili ang חֲדַת, “bago.”
- source_word: נִפְקְתָא
  choice: ang gastos
  rationale: Tumutukoy sa gastusin o halagang ilalabas para sa proyekto; “gastos” ang pinakanatural at maikli sa Filipino.
- source_word: מִן בֵּית מַלְכָּא
  choice: mula sa sambahayan ng hari
  rationale: Pinananatili ang literal na larawan ng “bahay ng hari” nang hindi agad ipinapalit ang interpretasyong “kabang-yaman”; ipinapaliwanag sa talababa ang malamang na administratibong kahulugan.
- source_word: תִּתְיְהִב
  choice: ay ibigay
  rationale: Pinananatili ang pasibong anyo at ang atas-administratibong diwa ng pandiwa.
