  text: וַ/יַּֽעֲשׂ֧וּ חַג מַצּ֛וֹת שִׁבְעַ֥ת יָמִ֖ים בְּ/שִׂמְחָ֑ה כִּ֣י שִׂמְּחָ֣/ם יְהוָ֗ה וְֽ/הֵסֵ֞ב לֵ֤ב מֶֽלֶךְ אַשּׁוּר֙ עֲלֵי/הֶ֔ם לְ/חַזֵּ֣ק יְדֵי/הֶ֔ם בִּ/מְלֶ֥אכֶת בֵּית הָ/אֱלֹהִ֖ים אֱלֹהֵ֥י יִשְׂרָאֵֽל־׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/022.yaml
  text: And they kept the Feast of Unleavened Bread for seven days with joy[a], because Yahweh had made them joyful and had turned the heart of the king of Assyria toward them, to strengthen their hands in the work of the house of God[c][b], the God of Israel.
translation:
  language: tl
  text: Ipinagdiwang nila nang may kagalakan ang Pista ng Tinapay na Walang Pampaalsa sa loob ng pitong araw, sapagkat pinagalak sila[a] ni Yahweh at ibinaling niya sa kanila ang puso[b] ng hari ng Asiria[c], upang palakasin sila sa gawain para sa bahay ng Diyos, ang Diyos ng Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “ginawa silang magalak.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “inihilig niya sa kanila ang puso ng hari ng Asiria.”
    reason: lexical_alternative
  - marker: c
    text: 'Hebreo: “hari ng Asiria.” Bagaman hari ng Persia ang namumuno noong panahon ni Ezra, ginagamit dito ang mas matandang katawagang imperyal, marahil para sa kahariang sumasaklaw sa dating teritoryo ng Asiria.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: Ipinagdiwang nila
  rationale: Kapag kapistahan ang layon, ang עשה ay nangangahulugang ipagdiwang o ganapin, hindi literal na “gawin.” Likas at malinaw sa makabagong Tagalog ang “ipinagdiwang.”
- source_word: חַג מַצּוֹת
  choice: ang Pista ng Tinapay na Walang Pampaalsa
  rationale: Kinikilalang pangalan ito ng kapistahan sa Israel. Pinananatili ng salin ang tiyak na pagtukoy sa tinapay na walang pampaalsa.
- source_word: שִׁבְעַת יָמִים
  choice: sa loob ng pitong araw
  rationale: Natural na paraan sa Tagalog upang ipahayag ang tagal ng pagdiriwang.
- source_word: בְּשִׂמְחָה
  choice: nang may kagalakan
  rationale: Pinananatili ang pangngalang “kagalakan” at malinaw na inilalarawan kung paano nila ipinagdiwang ang pista.
- source_word: שִׂמְּחָם
  choice: pinagalak sila
  rationale: Ipinapahayag ng Piel na pandiwa na si Yahweh ang dahilan ng kanilang kagalakan. Ang “pinagalak sila” ay maikli, natural, at may malinaw na diwang sanhi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ng personal na pangalang “Yahweh” ang Tetragrammaton sa halip na palitan ito ng isang titulo.
- source_word: וְהֵסֵב לֵב
  choice: at ibinaling niya ... ang puso
  rationale: Pinananatili ang larawan ng pagbaling o pagbabago ng disposisyon nang hindi tahasang dinaragdagan ng salitang “pabor.”
- source_word: מֶלֶךְ אַשּׁוּר
  choice: hari ng Asiria
  rationale: Eksaktong pinananatili ang katawagang nasa tekstong Hebreo kahit hari ng Persia ang pinuno sa panahong inilalarawan.
- source_word: עֲלֵיהֶם
  choice: sa kanila
  rationale: Sa pariralang “ibinaling ... ang puso,” ipinahihiwatig nito ang direksiyon ng disposisyon ng hari patungo sa kanila, nang hindi labis na ipinapaliwanag iyon bilang tahasang pabor.
- source_word: לְחַזֵּק יְדֵיהֶם
  choice: upang palakasin sila
  rationale: Ang literal na “palakasin ang kanilang mga kamay” ay idyomang Hebreo para sa pagbibigay-lakas o suporta. “Palakasin sila” ang natural at malinaw na katumbas sa Tagalog.
- source_word: בִּמְלֶאכֶת בֵּית הָאֱלֹהִים
  choice: sa gawain sa bahay ng Diyos
  rationale: Tumutukoy ito sa gawaing kaugnay ng bahay ng Diyos. Pinananatili ang konkretong katawagang “bahay ng Diyos” sa halip na ipalit agad ang interpretatibong “templo.”
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehova
  rationale: Personal na pangalan ang mismong nasa tekstong Hebreo; pinananatili ito bilang “Yahweh” sa halip na palitan ng titulo.
- issue: Ang katawagang “hari ng Asiria” para sa isang pinuno noong panahon ng Persia
  choice: Panatilihin ang “hari ng Asiria” sa pangunahing teksto
  alternative: hari ng Persia o haring namamahala sa Asiria
  rationale: Malinaw na “hari ng Asiria” ang mababasa sa Hebreo. Hindi ito binabago upang ipagkasundo sa kontekstong pangkasaysayan; inilalagay sa talababa ang maikling paliwanag.
- issue: Ang pagbaling sa puso ng hari
  choice: ibinaling niya sa kanila ang puso
  alternative: ginawa niyang pumanig sa kanila ang puso
  rationale: Pinananatili ng salin ang metapora at hindi tahasang nagpapasok ng “pumanig” o “pabor,” bagaman ipinahihiwatig iyon ng konteksto.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “Pista ng Tinapay na Walang Pampaalsa” bilang pormal na pangalan ng kapistahan, “bahay ng Diyos” upang mapanatili ang konkretong pananalita ng Hebreo, at “palakasin sila” upang maipahayag nang natural ang idyomang “palakasin ang kanilang mga kamay.”
