    issue: Hindi tugma ang mga panandang talababa sa mga salitang nililinaw nila.
    rationale: Ang talababa a ay alternatibo para sa “pinagalak sila” ngunit nakalagay pagkatapos ng “Yahweh”; ang b ay alternatibo para sa “ibinaling ... ang puso” ngunit nakalagay pagkatapos ng “Asiria.” Dapat ilagay ang a pagkatapos ng “pinagalak sila” at ang b pagkatapos ng pariralang “ibinaling niya sa kanila ang puso.”
  - severity: low
    issue: Maaaring malabo ang “sa gawain sa bahay ng Diyos.”
    rationale: Ang בִּמְלֶאכֶת ay tumutukoy sa gawaing para sa/ukol sa bahay ng Diyos, hindi lamang sa gawaing nagaganap sa loob nito. Ang “para sa” ay mas malinaw nang hindi lumalayo sa kahulugan.
