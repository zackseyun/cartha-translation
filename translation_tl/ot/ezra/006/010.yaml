  text: so that they may offer pleasing aromas to the God of heaven and pray for the life of the king and his sons[a][b].
translation:
  language: tl
  text: upang maghandog sila ng mga kalugod-lugod na samyo[a] sa Diyos ng langit at manalangin para sa buhay ng hari at ng kanyang mga anak na lalaki[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mababangong samyo” o “mga samyong nakalulugod.” Ang salitang Aramaiko ay tumutukoy sa kalugod-lugod na samyo ng mga handog na katanggap-tanggap.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “para sa kapakanan ng hari at ng kanyang mga anak na lalaki.” Sa literal, “para sa buhay ng hari at ng kanyang mga anak na lalaki.”
    reason: lexical_alternative
lexical_decisions:
- source_word: דִּי
  choice: upang
  rationale: Ipinakikilala ng katagang Aramaiko ang layunin ng ipinagkaloob ng hari; malinaw at likas sa Filipino ang “upang.”
- source_word: לֶהֱוֺן מְהַקְרְבִין
  choice: makapaghandog sila
  rationale: Ang anyo ng pandiwa at kasunod na participle ay nagpapahayag ng layunin o posibilidad, at sa kontekstong pansakripisyo ang קרב ay nangangahulugang maghandog.
- source_word: נִיחוֹחִין
  choice: mga kalugod-lugod na samyo
  rationale: Pinananatili nito ang larawan ng samyo ng mga handog na katanggap-tanggap, sa halip na gawing pangkalahatang “mga handog” lamang.
- source_word: לֶאֱלָהּ שְׁמַיָּא
  choice: sa Diyos ng langit
  rationale: Ang lamed ay angkop isaling “sa” bilang tumatanggap ng handog, at pinananatili ang titulong karaniwan sa Ezra.
- source_word: וּמְצַלַּיִן
  choice: at manalangin
  rationale: Tuwirang ipinahahayag nito ang pananalangin at maayos na kaagapay ng layuning “makapaghandog.”
- source_word: לְחַיֵּי
  choice: para sa buhay ng
  rationale: Malapit ito sa literal na kahulugang “para sa buhay,” habang ang mas malawak na diwang kapakanan o kaligtasan ay inilalagay sa talababa.
- source_word: מַלְכָּא
  choice: hari
  rationale: Ito ang karaniwang katumbas ng salitang Aramaiko at hindi kailangang gawing “emperador” kahit hari ng Persia ang tinutukoy.
- source_word: וּבְנוֹהִי
  choice: at ng kanyang mga anak na lalaki
  rationale: Tiyak na panlalaki ang pangngalang Aramaiko; pinananatili ng salin ang espesipikong kahulugang “mga anak na lalaki.”
theological_decisions:
- issue: Ang kultikong diwa ng נִיחוֹחִין sa utos ng hari tungkol sa mga handog sa templo
  choice: mga kalugod-lugod na samyo
  alternative: mga handog na katanggap-tanggap
  rationale: Pinananatili ang kongkretong larawan ng samyo ng sakripisyo nang hindi nagdaragdag ng doktrinal na paliwanag sa pangunahing teksto.
- issue: Ang saklaw ng לְחַיֵּי sa panalangin para sa hari
  choice: para sa buhay ng hari
  alternative: para sa kapakanan ng hari
  rationale: Pinananatili ang literal na “buhay” at ang posibleng mas malawak na diwa ng kapakanan sa talababa, kaya hindi tahimik na nilulutas ang leksikal na saklaw.
- issue: Ang tiyak na kasarian ng mga supling ng hari
  choice: mga anak na lalaki
  alternative: mga anak
  rationale: Tiyak na masculine plural ang pinagmulan, kaya hindi ito ginawang neutral sa kasarian.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “samyo” upang mapanatili ang imaheng pansakripisyo; ang talababa ang nagpapaliwanag sa posibleng kahulugang “kapakanan.”
