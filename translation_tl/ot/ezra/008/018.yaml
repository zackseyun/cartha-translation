revisions:
- from: At dahil ang mabuting kamay ng aming Diyos ay nasa amin[a], dinalhan nila kami ng isang lalaking may pang-unawa mula sa mga anak ni Mahli, na anak ni Levi, na anak ni Israel—si Serebias[b]—kasama ang kanyang mga anak at mga kapatid, labingwalo silang lahat.
  to: Sa pamamagitan ng mabuting kamay ng aming Diyos na nasa amin[a], dinalhan nila kami ng isang lalaking may pang-unawa mula sa mga anak ni Mahli, na anak ni Levi, na anak ni Israel—si Serebias[b]—kasama ang kanyang mga anak na lalaki at mga kapatid na lalaki, labingwalo silang lahat.
  rationale: Pinalitan ang “dahil” ng “Sa pamamagitan ng” upang mas tapat na maipakita ang puwersa at larawan ng כְּיַד, nang hindi ginagawang abstraktong paliwanag ang idyoma. Ginawang hayag ang mga anak at kapatid na lalaki upang tumugma sa panlalaking pangmaramihang anyo sa Hebreo. Pinanatili ang talababa tungkol kay Serebias dahil may tunay na sintaktikong alternatibo ang pangatnig, kahit ang apposition ang mas malamang na pagbasa.
