base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/018.yaml
  text: And by the good hand of our God upon us[a], they brought to us a man of insight from the sons of Mahli son of Levi, son of Israel—namely Sherebiah, and his sons and his brothers, eighteen.
translation:
  language: tl
  text: Sa pamamagitan ng mabuting kamay ng aming Diyos na nasa amin[a], dinalhan nila kami ng isang lalaking may pang-unawa mula sa mga anak ni Mahli, na anak ni Levi, na anak ni Israel—si Serebias[b]—kasama ang kanyang mga anak na lalaki at mga kapatid na lalaki, labingwalo silang lahat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “ayon sa mabuting kamay ng aming Diyos na nasa amin.” Ang idyomang Hebreo ay tumutukoy sa pabor at mapagkalingang pagkilos ng Diyos.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “at si Serebias.” Malamang na si Serebias ang lalaking may pang-unawa, ngunit maaari ring basahin ang parirala na para bang isa pa siyang taong kasama sa pangkat.
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: וַיָּבִיאוּ לָנוּ
  choice: dinalhan nila kami
  rationale: Ang Hiphil ng בוא ay nangangahulugang ‘dalhin’ o ‘papuntahin.’ Natural sa Filipino ang ‘dinalhan nila kami’ para sa pagdadala ng isang tao sa pangkat ni Ezra.
- source_word: כְּיַד אֱלֹהֵינוּ הַטּוֹבָה עָלֵינוּ
  choice: dahil ang mabuting kamay ng aming Diyos ay nasa amin
  rationale: Pinananatili ang larawang Hebreo ng ‘mabuting kamay’ bilang tanda ng pabor at mapagkalingang pagkilos ng Diyos, habang ginagawang malinaw sa Filipino ang pangyayaring ipinahihiwatig ng parirala.
- source_word: אִישׁ שֶׂכֶל
  choice: isang lalaking may pang-unawa
  rationale: Ang שׂכל ay tumutukoy sa pagkaunawa at matinong pagkilatis, hindi lamang sa teknikal na kasanayan. Pinananatili rin ng ‘lalaki’ ang isahang panlalaking anyo.
- source_word: מִבְּנֵי מַחְלִי
  choice: mula sa mga anak ni Mahli
  rationale: Pinananatili ang literal na anyong pangangkanan ng בני; sa kontekstong ito maaari itong tumukoy sa mga inapo o angkan ni Mahli.
- source_word: בֶּן לֵוִי בֶּן יִשְׂרָאֵל
  choice: na anak ni Levi, na anak ni Israel
  rationale: Pinananatili ang inuulit na pormulang pangangkanan at ang tuwirang pagkakaugnay ng linya ng lahi.
- source_word: וְשֵׁרֵבְיָה
  choice: —si Serebias—
  rationale: Itinuturing si Serebias bilang pagpapakilala sa lalaking kababanggit lamang, ngunit nilalagyan ng talababa dahil ang payak na waw ay maaari ring basahing ‘at si Serebias.’
- source_word: וּבָנָיו וְאֶחָיו
  choice: kasama ang kanyang mga anak at mga kapatid
  rationale: Likas sa Filipino ang ‘kasama’ upang ipakita na kabilang sa pangkat ang mga anak at kapatid ni Serebias.
- source_word: שְׁמֹנָה עָשָׂר
  choice: labingwalo silang lahat
  rationale: Ang bilang sa Hebreo ay walang inuulit na pangngalan. Nililinaw ng Filipino na kabuuang bilang ito ng pangkat nang hindi dinaragdagan ng ‘lalaki.’
theological_decisions:
- issue: Ang idyoma tungkol sa mabuting kamay ng Diyos
  choice: dahil ang mabuting kamay ng aming Diyos ay nasa amin
  alternative: ayon sa mabuting kamay ng aming Diyos na nasa amin
  rationale: Pinananatili ng napiling salin ang konkretong metapora ng kamay ng Diyos at ipinahihiwatig ang kanyang paborableng pagkilos, nang hindi ito ginagawang isang tiyak na sistematikong pahayag tungkol sa providensiya.
- issue: Pagkakaugnay ni Serebias sa ‘lalaking may pang-unawa’
  choice: 'binasa bilang pagpapakilala o apposition: ‘—si Serebias—’'
  alternative: ‘at si Serebias,’ na maaaring magpahiwatig ng isa pang tao
  rationale: Sa konteksto, malamang na si Serebias ang lalaking inilalarawan, ngunit ang waw sa Hebreo ay literal na ‘at’; kaya hindi lubusang ikinukubli ang posibleng ibang pagbasa at inilalahad ito sa talababa.
translation_notes:
  register: Makabago at marangal na Filipino, na may payak na estruktura at bokabularyong madaling maunawaan. Pinanatili ang biblikal na larawang ‘mabuting kamay’ at ang anyong pangangkanan, habang ginamit ang natural na ‘kasama’ at ‘labingwalo silang lahat’ para sa malinaw na daloy.
