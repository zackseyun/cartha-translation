  text: מִ/בְּנֵ֣י יוֹאָ֔ב עֹבַדְיָ֖ה בֶּן יְחִיאֵ֑ל וְ/עִמּ֕/וֹ מָאתַ֛יִם וּ/שְׁמֹנָ֥ה עָשָׂ֖ר הַ/זְּכָרִֽים־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/009.yaml
  text: 'From the sons of Joab: Obadiah son of Jehiel[a], and with him 218 males.'
translation:
  language: tl
  text: 'Mula sa mga anak ni Joab: si Obadias na anak ni Jehiel, at kasama niya ang 218 lalaki.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִ/בְּנֵי יוֹאָב
  choice: Sa mga anak ni Joab
  rationale: Ipinakikilala ng מִן kasama ng בְּנֵי ang isang pangkat sa talaan. Ang “Sa mga anak ni Joab” ay likas sa Filipino at pinananatili ang anyong pangangkan ng Hebreo nang hindi ipinapalagay na pawang tuwirang mga anak sila.
- source_word: עֹבַדְיָה
  choice: Obadias
  rationale: Ginamit ang nakaugaliang anyong Filipino ng pangalang biblikal.
- source_word: בֶּן יְחִיאֵל
  choice: na anak ni Jehiel
  rationale: Tuwirang ipinahahayag ng בֶּן ang ugnayang anak; natural sa Filipino ang pang-ugnay na “na” sa ganitong talaan.
- source_word: וְ/עִמּוֹ
  choice: at kasama niya
  rationale: Pinananatili ang pangatnig at ang diwa ng mga taong sumama sa pinunong binanggit.
- source_word: מָאתַיִם וּ/שְׁמֹנָה עָשָׂר
  choice: '218'
  rationale: Ang bilang sa Hebreo ay “dalawang daan at labingwalo.” Ginamit ang mga digit para sa malinaw at madaling basahing talaan.
- source_word: הַ/זְּכָרִים
  choice: lalaki
  rationale: Partikular na tumutukoy ang Hebreo sa mga taong kasariang lalaki, hindi kinakailangang pawang nasa hustong gulang; sa konteksto, malinaw at natural ang “lalaki.”
theological_decisions: []
translation_notes:
  register: Modernong Filipino na malinaw at marangal, habang pinananatili ang maikli at paulit-ulit na estilo ng talaang pangangkan. Walang talababa sapagkat ang ibinigay na English footnote ay tila maling naiuugnay sa pangalang Jehiel; ang nilalaman nitong alternatibong anyo ng bilang ay wala namang tunay na tekstuwal o leksikal na ambiguwidad.
