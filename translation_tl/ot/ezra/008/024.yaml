lexical_decisions:
- source_word: וָאַבְדִּילָה
  choice: Pagkatapos, ibinukod ko
  rationale: Ang Hiphil ng בדל ay nangangahulugang ihiwalay o ibukod. Ang “ibinukod” ay natural sa Filipino at angkop sa pagtatalaga sa kanila para sa isang natatanging tungkulin; ipinahahayag ng “Pagkatapos” ang pagsulong ng salaysay.
- source_word: מִשָּׂרֵי הַכֹּהֲנִים
  choice: mula sa mga pinuno ng mga pari
  rationale: 'Ang שָׂרִים ay mga pinuno o pangunahing opisyal, at pinananatili ng “mula sa” ang partitive na diwa ng מִן: ang labindalawa ay kinuha mula sa pangkat na ito.'
- source_word: שְׁנֵים עָשָׂר
  choice: ang labindalawa
  rationale: Tuwirang salin ng bilang; ang pantukoy na “ang” ay kailangan sa natural na pangungusap sa Filipino.
- source_word: לְשֵׁרֵבְיָה חֲשַׁבְיָה
  choice: sina Serebias at Hasabias
  rationale: Mga pangalang pantangi ang mga ito. Ginamit ang anyong madaling basahin at nakasanayan sa Filipino; ipinakikilala sila ng “sina” bilang mga taong kabilang sa labindalawa.
- source_word: וְעִמָּהֶם
  choice: at kasama nila
  rationale: Pinananatili ang pang-ugnay at ang tahasang ideya ng pagiging kasama, gaya ng kayarian ng Hebreo.
- source_word: מֵאֲחֵיהֶם
  choice: sa kanilang mga kapatid
  rationale: Ang אָח ay literal na “kapatid,” ngunit maaari ring tumukoy sa mas malawak na mga kamag-anak o kapwa kasapi ng pangkat. Pinanatili sa teksto ang tuwirang katawagang pampamilya at inilagay sa talababa ang lawak ng posibleng kahulugan.
- source_word: עֲשָׂרָה
  choice: ang sampu
  rationale: Tuwirang salin ng bilang, sa natural na ayos ng Filipino.
