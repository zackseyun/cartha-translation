source:
  edition: WLC
  text: וּ/מִן הַ/נְּתִינִ֗ים שֶׁ/נָּתַ֨ן דָּוִ֤יד וְ/הַ/שָּׂרִים֙ לַ/עֲבֹדַ֣ת הַ/לְוִיִּ֔ם נְתִינִ֖ים מָאתַ֣יִם וְ/עֶשְׂרִ֑ים כֻּלָּ֖/ם נִקְּב֥וּ בְ/שֵׁמֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/020.yaml
  text: And from the temple servants whom David and the officials had assigned to the service of the Levites[a], there were 220 temple servants[b]; all of them were designated by name.
translation:
  language: tl
  text: At mula sa mga lingkod sa templo[a] na itinalaga ni David at ng mga pinuno para sa paglilingkod ng mga Levita, 220 ang mga lingkod sa templo. Silang lahat ay tinukoy ayon sa pangalan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: נְתִינִים (Netinim), isang teknikal na tawag sa isang pangkat ng mga lingkod sa templo.'
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “Silang lahat ay itinala ayon sa pangalan.”
    reason: alternative_reading
lexical_decisions:
- source_word: הַנְּתִינִים / נְתִינִים
  choice: mga lingkod sa templo
  rationale: Teknikal itong tawag sa isang kinikilalang pangkat na nakatalaga sa gawain sa templo. Malinaw sa makabagong mambabasa ang saling ito nang hindi gumagamit ng malabong transliterasyon.
- source_word: שֶׁנָּתַן
  choice: na itinalaga
  rationale: Literal na nangangahulugang ‘ibinigay,’ ngunit sa kontekstong administratibo ng pagtatalaga ng mga tao sa paglilingkod, natural at tumpak ang ‘itinalaga.’
- source_word: וְהַשָּׂרִים
  choice: at ng mga pinuno
  rationale: Ipinahihiwatig ng salita ang mga taong may mataas na katungkulan o pamumuno; ang ‘mga pinuno’ ay dignified at madaling maunawaan nang hindi ipinapalagay na mga prinsipe sila.
- source_word: לַעֲבֹדַת הַלְוִיִּם
  choice: para sa paglilingkod ng mga Levita
  rationale: Pinananatili nito ang ugnayan sa paglilingkod o gawain ng mga Levita nang hindi tiyak na nilulutas kung ang mga lingkod ay tumutulong sa kanila, naglilingkod sa ilalim nila, o nakikibahagi sa gawaing nakatalaga sa kanila.
- source_word: מָאתַיִם וְעֶשְׂרִים
  choice: '220'
  rationale: Ang numerong anyo ay malinaw at eksaktong kumakatawan sa bilang sa Hebreo.
- source_word: כֻּלָּם
  choice: Silang lahat
  rationale: Pinananatili nito ang tahasang pagdidiin na bawat isa sa buong pangkat ay tinukoy.
- source_word: נִקְּבוּ בְשֵׁמוֹת
  choice: tinukoy ayon sa pangalan
  rationale: Sinasalamin nito ang pormal na pagkilala sa bawat tao habang pinananatiling bukas ang posibilidad na ang tinutukoy ay pagtatala o tahasang pagbanggit sa pangalan.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘mga lingkod sa templo’ upang maipaliwanag ang teknikal na katawagan, at ‘paglilingkod ng mga Levita’ upang mapanatili ang bahagyang kalabuan ng ugnayang ipinahihiwatig ng Hebreo.
