base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/013.yaml
  text: 'And from the sons of Adonikam[a], the last ones, and these were their names: Eliphelet, Jeiel, and Shemaiah, and with them sixty males.'
translation:
  language: tl
  text: 'At mula sa mga anak ni Adonikam, ang mga huli[a]: ito ang kanilang mga pangalan—Elifelet, Jeiel, at Semaias—at kasama nila ang animnapung lalaki.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang mga nahuli” o “ang mga panghuli.” Maaaring tumukoy ito sa huling pangkat mula sa angkan ni Adonikam, marahil bilang pagkakaiba sa naunang pangkat na binanggit sa Ezra 2:13.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִבְּנֵי
  choice: At mula sa mga anak ni
  rationale: Pinananatili ang literal na anyong “mga anak ni,” na sa talaangkanan ay maaari ring tumukoy sa mga inapo o angkan.
- source_word: אֲדֹנִיקָם
  choice: Adonikam
  rationale: Isinalin-titik ang pangalang pantangi sa anyong madaling basahin sa Filipino.
- source_word: אַחֲרֹנִים
  choice: ang mga huli
  rationale: Sinasalamin ang kahulugang “mga huli” o “mga nahuli,” nang hindi tiyakang nilulutas kung ito ang panghuling pangkat o isang sumunod na pangkat.
- source_word: וְאֵלֶּה שְׁמוֹתָם
  choice: ito ang kanilang mga pangalan
  rationale: Likas na pormula sa Filipino para sa pagpapakilala ng listahan; ipinahihiwatig na ng konteksto ang koordinasyon.
- source_word: אֱלִיפֶלֶט
  choice: Elifelet
  rationale: Isinalin-titik ang pangalang pantangi ayon sa bigkas na angkop sa Filipino.
- source_word: יְעִיאֵל
  choice: Jeiel
  rationale: Isinalin-titik ang pangalang pantangi sa nakikilalang anyong Filipino.
- source_word: וּשְׁמַעְיָה
  choice: at Semaias
  rationale: Isinalin-titik ang pangalang pantangi at pinanatili ang pang-ugnay sa talaan.
- source_word: וְעִמָּהֶם
  choice: at kasama nila
  rationale: Tuwirang ipinahahayag ang pagsama at pinananatili ang koordinasyon ng Hebreo.
- source_word: שִׁשִּׁים
  choice: animnapu
  rationale: Karaniwang salin ng bilang na animnapu.
- source_word: הַזְּכָרִים
  choice: lalaki
  rationale: Ang Hebreo ay tahasang tumutukoy sa mga lalaking kasarian; sa Filipino, ang “animnapung lalaki” ay natural at tumpak.
