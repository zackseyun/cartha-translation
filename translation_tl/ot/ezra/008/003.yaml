  text: 'From the sons of Shecaniah[a], from the sons of Parosh: Zechariah, and with him were enrolled by genealogy 150 males.'
translation:
  language: tl
  text: 'Mula sa mga anak ni Secanias, mula sa mga anak ni Paros: si Zacarias; at kasama niya ang 150 lalaking itinala ayon sa talaangkanan.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “nairehistro batay sa talaangkanan.” Ang pandiwang Hebreo ay tumutukoy sa pormal na pagtatala o pagkakabilang batay sa talaangkanan.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִבְּנֵי
  choice: Mula sa mga anak ni
  rationale: Ipinananatili nito ang anyo ng talaan at ang ideya ng isang pangkat na nagmula sa mas malaking angkan; sa kontekstong ito, maaaring tumukoy ang “mga anak” sa mga inapo.
- source_word: שְׁכַנְיָה
  choice: Secanias
  rationale: Ginamit ang karaniwang anyong Filipino ng pangalang Hebreo.
- source_word: פַרְעֹשׁ
  choice: Paros
  rationale: Ginamit ang likas at nakikilalang anyong Filipino ng pangalan ng angkan.
- source_word: זְכַרְיָה
  choice: Zacarias
  rationale: Ginamit ang karaniwang anyong Filipino ng personal na pangalan.
- source_word: וְעִמּוֹ
  choice: at kasama niya
  rationale: Tuwirang ipinahahayag ang kaugnayan ng mga lalaking sumama kay Zacarias habang pinananatili ang maikling ayos ng Hebreo.
- source_word: הִתְיַחֵשׂ
  choice: itinala ayon sa talaangkanan
  rationale: Ang pandiwa ay tumutukoy sa pormal na pagtatala o pagbibilang batay sa angkan, hindi lamang sa pagiging likas na inapo.
- source_word: לִזְכָרִים
  choice: lalaki
  rationale: Tiyak na tinutukoy ng Hebreo ang kasariang lalaki, kaya mas eksakto ito kaysa sa salitang maaaring mangahulugang mga tao sa pangkalahatan.
- source_word: מֵאָה וַחֲמִשִּׁים
  choice: '150'
  rationale: Pinananatili ang eksaktong bilang sa madaling basahing anyo na angkop sa isang talaan.
