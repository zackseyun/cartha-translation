  source_fidelity: 'Tumpak na naihahatid ng draft ang ayos ng Hebreo: isang pangkat na tinukoy bilang “mga anak ni” Shephatiah, si Zebadiah na anak ni Michael, at walumpung lalaking kasama niya. Ang “mga lalaki” ay angkop na katumbas ng הַזְּכָרִים at hindi nagpapasok ng di-nasa-tekstong paghihigpit sa edad.'
  naturalness: Natural at malinaw ang “At mula sa mga anak ni …” at “kasama niya ang walumpung lalaki.” Mas karaniwan at higit na natural sa Filipino ang baybay na “Sefatias” kaysa “Shefatias.”
  terminology: Ang “anak ni” at “mga anak ni” ay wasto sa talaang pangangkan. Iningatan ng talababa ang mas malawak na kahulugang pangangkan ng בְּנֵי. Ang mga pangalang “Zebadias” at “Micael” ay katanggap-tanggap na mga baybay-Filipino; “Sefatias” ang dapat na baybay ng unang pangalan para sa pagkakatugma sa modernong Filipino.
  issues:
