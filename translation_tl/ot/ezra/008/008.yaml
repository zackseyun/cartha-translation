  text: 'And from the sons of Shephatiah: Zebadiah son of Michael[a], and with him eighty males.'
translation:
  language: tl
  text: 'At mula sa mga anak ni Sefatias[a]: si Zebadias na anak ni Micael, at kasama niya ang walumpung lalaki.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Hebreong “mga anak” ay maaari ring tumukoy sa mas malawak na linya ng angkan, samakatuwid, “mga inapo,” at hindi lamang sa mga tuwirang anak.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מִ/בְּנֵי
  choice: At mula sa mga anak ni
  rationale: Pinananatili ang literal na anyong Hebreo at ang daloy ng talaan. Sa kontekstong angkan, ang “mga anak” ay maaari ring tumukoy sa mas malawak na mga inapo.
- source_word: שְׁפַטְיָה
  choice: Shefatias
  rationale: Isinalin sa baybay na natural sa Filipino habang tinutumbasan ang Hebreong pangalan.
- source_word: זְבַדְיָה
  choice: Zebadias
  rationale: Isinalin sa baybay na natural sa Filipino habang tinutumbasan ang Hebreong pangalan.
- source_word: בֶּן
  choice: anak ni
  rationale: Sa tuwirang pagkakabit sa pangalan ng ama, ito ang pinakanatural at karaniwang kahulugang pangangkan.
- source_word: מִיכָאֵל
  choice: Micael
  rationale: Isinalin sa karaniwang baybay-Filipino ng pangalan.
- source_word: וְ/עִמּוֹ
  choice: at kasama niya
  rationale: 'Pinananatili ang pang-ugnay at ang padron ng talaan: ang pinuno at ang bilang ng mga kasama niya.'
- source_word: שְׁמֹנִים
  choice: walumpu
  rationale: Tuwirang katumbas ng bilang na Hebreo.
- source_word: הַזְּכָרִים
  choice: mga lalaki
  rationale: Tiyak na tumutukoy ang Hebreo sa mga lalaking kasarian. Mas natural sa modernong Filipino ang “mga lalaki” kaysa sa teknikal na “mga lalaking tao,” habang pinananatili ang pagtukoy sa kasarian.
