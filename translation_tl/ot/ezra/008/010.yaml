  yaml_path: translation/ot/ezra/008/010.yaml
  text: And from the sons of Shelomith[a], the son of Josiphiah, and with him 160 males.
translation:
  language: tl
  text: At mula sa mga anak[a] ni Selomit, na anak ni Josifias, kasama niya ang 160 lalaki.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga inapo ni Selomit”; literal sa Hebreo, “mga anak ni Selomit.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מִ/בְּנֵי
  choice: At mula sa mga anak
  rationale: Pinananatili ang literal at karaniwang katawagang pangangkan na “mga anak,” habang ang “mula sa” ay nagpapakita na bahagi ito ng patuloy na talaan.
- source_word: שְׁלוֹמִית
  choice: Selomit
  rationale: Isinalin sa baybay na likas sa Filipino ang pangalang Hebreo.
- source_word: בֶּן
  choice: na anak ni
  rationale: Ipinakikilala ng pariralang ito si Selomit bilang anak ni Josifias; natural sa Filipino ang hulma na “na anak ni.”
- source_word: יוֹסִפְיָה
  choice: Josifias
  rationale: Ginamit ang anyong Filipino ng transliterasyon ng pangalang Hebreo.
- source_word: וְ/עִמּוֹ
  choice: kasama niya
  rationale: Tuwirang ipinahahayag nito na ang bilang na kasunod ay ang mga kasama ng pinunong binanggit.
- source_word: מֵאָה וְשִׁשִּׁים
  choice: '160'
  rationale: Malinaw at natural sa makabagong talaan ang paggamit ng mga numero.
- source_word: הַזְּכָרִים
  choice: lalaki
  rationale: Tiyak na mga taong lalaki ang tinutukoy ng Hebreo; hindi nito kailangang ipahiwatig na pawang nasa hustong gulang sila.
