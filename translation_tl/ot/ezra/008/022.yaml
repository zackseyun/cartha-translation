revisions:
- from: Sapagkat nahiya akong humingi sa hari ng mga kawal at mga mangangabayo upang tulungan kami laban sa kaaway habang naglalakbay kami,[a] dahil sinabi namin sa hari, “Ang kamay ng aming Diyos ay gumagawa ng mabuti sa lahat ng humahanap sa kanya,[b] ngunit ang kanyang lakas at galit ay laban sa lahat ng tumatalikod sa kanya.”
  to: Sapagkat nahiya akong humingi sa hari ng mga kawal at mga mangangabayo upang tulungan kami laban sa kaaway sa daan,[a] dahil sinabi namin sa hari, “Ang kamay ng aming Diyos ay kumikilos para sa ikabubuti ng lahat ng humahanap sa kanya,[b] ngunit ang kanyang lakas at galit ay laban sa lahat ng tumatalikod sa kanya.”
  rationale: Pinalitan ang “ay gumagawa ng mabuti sa” ng “ay kumikilos para sa ikabubuti ng” upang maipahayag nang mas malapit ang l’tovah (‘para sa ikabubuti’) at manatiling buhay ang Hebreong metapora ng kamay bilang aktibong pagkilos. Pinasimple rin ang pangyayari ng paglalakbay sa “sa daan,” na mas malapit sa בַּדָּרֶךְ. Hindi binago ang kahulugan ng proteksiyong militar, ang dalawang magkahiwalay na katangian—lakas at galit—o ang metaporang kamay.
