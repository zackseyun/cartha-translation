base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/022.yaml
  text: For I was ashamed to ask the king for troops and horsemen to help us against the enemy on the way[a], because we had said to the king, “The hand of our God is for good on all who seek him[b], but his strength and his anger are against all who forsake him.”
translation:
  language: tl
  text: Sapagkat nahiya akong humingi sa hari ng mga kawal at mga mangangabayo upang tulungan kami laban sa kaaway sa daan,[a] dahil sinabi namin sa hari, “Ang kamay ng aming Diyos ay kumikilos para sa ikabubuti ng lahat ng humahanap sa kanya,[b] ngunit ang kanyang lakas at galit ay laban sa lahat ng tumatalikod sa kanya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “mula sa kaaway sa daan” o “mula sa kaaway sa paglalakbay.” Mas literal ito sa Hebreo, ngunit ang “laban sa kaaway sa daan” ay angkop sa konteksto ng hinihinging proteksiyong militar.
    reason: lexical_alternative
  - marker: b
    text: Ang “kamay ng aming Diyos” ay isang Hebreong pananalita para sa kanyang aktibong kapangyarihan o pabor.
    reason: cultural_note
lexical_decisions:
- source_word: בֹשְׁתִּי
  choice: nahiya ako
  rationale: Ipinahahayag nito ang tunay na kahihiyan, hindi lamang panandaliang pagkaasiwa, at natural ito sa makabagong Tagalog.
- source_word: חַיִל
  choice: mga kawal
  rationale: Sa konteksto, tumutukoy ito sa armadong puwersang maaaring ibigay ng hari; malinaw at karaniwan ang “mga kawal” sa Tagalog.
- source_word: פָרָשִׁים
  choice: mga mangangabayo
  rationale: Tuwirang tinutukoy nito ang mga mandirigmang nakasakay sa kabayo at pinananatili ang kongkretong larawan ng Hebreo.
- source_word: מֵאוֹיֵב בַּדָּרֶךְ
  choice: laban sa kaaway habang naglalakbay kami
  rationale: Inihahayag nito ang layunin ng hinihinging proteksiyong militar at nililinaw na ang panganib ay haharapin sa paglalakbay, habang kinikilala sa talababa ang mas literal na ayos.
- source_word: יַד אֱלֹהֵינוּ
  choice: Ang kamay ng aming Diyos
  rationale: Pinananatili ang Hebreong metapora para sa aktibong kapangyarihan o pabor ng Diyos sa halip na paliitin ito sa iisang abstraktong kahulugan.
- source_word: עַל כָּל מְבַקְשָׁיו לְטוֹבָה
  choice: ay gumagawa ng mabuti sa lahat ng humahanap sa kanya
  rationale: Natural sa Tagalog at malinaw na ipinahahayag ang mapagpalang pagkilos ng Diyos, bagaman bahagyang ginagawang pandiwa ang Hebreong pariralang “para sa ikabubuti.”
- source_word: וְעֻזּוֹ וְאַפּוֹ
  choice: ang kanyang lakas at galit
  rationale: 'Pinananatiling magkahiwalay ang dalawang magkatugmang pangngalan: aktibong lakas at galit.'
- source_word: עַל כָּל עֹזְבָיו
  choice: laban sa lahat ng tumatalikod sa kanya
  rationale: Ang “tumatalikod” ay likas sa Tagalog at nagpapanatili sa relasyonal at tipanang bigat ng pag-iwan sa Diyos.
theological_decisions:
- issue: Ang antropomorpikong pahayag na יַד אֱלֹהֵינוּ
  choice: Panatilihin bilang “Ang kamay ng aming Diyos.”
  alternative: “Ang kapangyarihan ng aming Diyos” o “Ang pabor ng aming Diyos.”
  rationale: Sadyang gumagamit ang Hebreo ng larawang-katawan para sa pagkilos ng Diyos. Ang pagpapanatili nito ay hindi naglilimita sa kahulugan sa kapangyarihan lamang o pabor lamang.
- issue: Ang dalawang bahagi ng banal na pagsalungat sa וְעֻזּוֹ וְאַפּוֹ
  choice: Isalin nang magkahiwalay bilang “ang kanyang lakas at galit.”
  alternative: “Ang kanyang makapangyarihang galit.”
  rationale: Dalawang magkatugmang pangngalan ang nasa Hebreo, kaya hindi sila pinagsama sa iisang konsepto; kapwa ipinahahayag ang kakayahang kumilos at ang galit ng Diyos.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang metaporang “kamay ng aming Diyos,” habang ginawang natural ang pariralang nagsasaad ng mabuting pagkilos niya. Ginamit ang “mga kawal” at “mga mangangabayo” bilang madaling maunawaang mga katawagang militar.
