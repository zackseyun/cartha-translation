    rationale: Ang Hebreo ay hindi tuwirang gumagamit ng pandiwang ‘gumawa.’ Maaaring gumamit ng ‘ay kumikilos para sa ikabubuti’ upang mapanatili ang metaporang kamay at maipahayag ang l’tovah nang mas tumpak at natural.
