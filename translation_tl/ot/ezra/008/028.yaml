base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/028.yaml
  text: And I said to them, “You are holy to Yahweh, and the vessels are holy; and the silver and the gold are a freewill offering to Yahweh, the God of your fathers.”
translation:
  language: tl
  text: At sinabi ko sa kanila, “Kayo ay banal kay Yahweh, at banal din ang mga kagamitan. Ang pilak at ang ginto ay kusang-loob na handog kay Yahweh, ang Diyos ng inyong mga ama.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאֹמְרָה
  choice: At sinabi ko
  rationale: Pinananatili ang sunod-sunod na daloy ng salaysay na ipinahihiwatig ng wayyiqtol nang hindi dinaragdagan ang ugnayang lohikal.
- source_word: קֹדֶשׁ לַיהוָה
  choice: banal kay Yahweh
  rationale: Ipinahahayag nito ang kalagayang itinalaga at nauukol kay Yahweh; ang “kay” ay likas sa Filipino at hindi inaalis ang kultikong diwa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ang banal na pangalang YHWH sa pamamagitan ng karaniwang transliterasyon, sa halip na palitan ito ng isang titulo.
- source_word: הַכֵּלִים
  choice: ang mga sisidlan
  rationale: Sa konteksto ng templo, tumutukoy ito sa mga sagradong kagamitang sisidlan; ang salitang ito ay malinaw at marangal sa modernong Filipino.
- source_word: הַכֶּסֶף וְהַזָּהָב
  choice: Ang pilak at ang ginto
  rationale: Pinananatili ang tiyak na pantukoy sa bawat pangngalan at ang balanseng anyo ng Hebreo.
- source_word: נְדָבָה
  choice: kusang-loob na handog
  rationale: Malinaw na ipinahahayag na ang handog ay ibinigay nang bukal at hindi sapilitan.
- source_word: אֱלֹהֵי אֲבֹתֵיכֶם
  choice: ang Diyos ng inyong mga ninuno
  rationale: Likas at madaling maunawaang salin ng pormulang tipan; tumutukoy ito sa mga naunang salinlahi nang hindi nilalabo ang ugnayang pampamilya.
theological_decisions:
- issue: Paglalarawan sa mga tao at kagamitan bilang קֹדֶשׁ
  choice: banal kay Yahweh / banal din ang mga sisidlan
  alternative: itinalaga kay Yahweh / sagrado ang mga sisidlan
  rationale: Pinananatili ng “banal” ang pag-uulit at teolohikal na bigat ng קֹדֶשׁ, habang ipinahihiwatig ng “kay Yahweh” ang pagtatalaga at pag-aari nang hindi pinapaliit ang kahulugan sa ritwal lamang.
- issue: Pagbaybay sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Nasa tekstong Hebreo ang personal na pangalang YHWH; pinananatili ito bilang pangalan sa halip na palitan ng titulo.
- issue: Pormulang אֱלֹהֵי אֲבֹתֵיכֶם
  choice: ang Diyos ng inyong mga ninuno
  alternative: ang Diyos ng inyong mga ama
  rationale: Ang “mga ninuno” ay natural sa kasalukuyang Filipino at tapat sa kolektibong pagtukoy sa mga naunang salinlahi; hindi nito ipinapasok ang isang denominasyonal na pagbasa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mga sisidlan” para sa mga kagamitang sagrado sa templo at “kusang-loob na handog” para sa teknikal na diwa ng נְדָבָה. Ang pangungusap ay hinati sa dalawa sa loob ng sipi upang maging natural basahin nang hindi binabago ang mga ugnayan ng mga sugnay.
