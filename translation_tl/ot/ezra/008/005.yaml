  text: From the sons of Shecaniah[a], the son of Jahaziel, and with him three hundred males.
translation:
  language: tl
  text: 'Mula sa mga anak ni Secanias, na anak ni Jahaziel: kasama niya ang tatlong daang lalaki.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga kalalakihan.” Espesipikong tumutukoy ang Hebreo sa kasariang lalaki, hindi sa edad o katayuang panlipunan.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִ/בְּנֵי
  choice: Mula sa mga anak ni
  rationale: Pinananatili ang pormulang pangangkanan at ang diwa ng מִן na nagpapakilala ng isang pangkat mula sa mas malaking talaan.
- source_word: שְׁכַנְיָה
  choice: Secanias
  rationale: Ginamit ang anyong pangalang karaniwan at madaling bigkasin sa tradisyong Tagalog, habang malinaw na tinutukoy ang pangalang Hebreo.
- source_word: בֶּן יַחֲזִיאֵל
  choice: na anak ni Jahaziel
  rationale: Likas na Tagalog na pagpapahayag ng ugnayang ama-anak; inuugnay ito kay Secanias ayon sa pinakamalapit na tuwirang pagbasa ng tekstong Masoretiko.
- source_word: וְ/עִמּוֹ
  choice: at kasama niya
  rationale: Pinananatili ang koordinasyon ng Hebreo at ang pagtukoy sa pinunong pinangalanan bago ang bilang ng pangkat.
- source_word: שְׁלֹשׁ מֵאוֹת
  choice: tatlong daan
  rationale: Tuwirang katumbas ng bilang sa Hebreo.
- source_word: הַזְּכָרִים
  choice: lalaki
  rationale: Ang זְכָרִים ay espesipikong tumutukoy sa mga taong kasariang lalaki, hindi lamang sa mga nasa hustong gulang o may partikular na katayuang panlipunan.
