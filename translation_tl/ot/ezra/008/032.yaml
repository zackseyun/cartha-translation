  text: So we came to Jerusalem and stayed there three days.
translation:
  language: tl
  text: Kaya nakarating kami sa Jerusalem at nanatili roon nang tatlong araw.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַ/נָּב֖וֹא
  choice: Kaya nakarating kami
  rationale: Ang wayyiqtol ng בוא ay nagsasalaysay ng kasunod na pangyayari. Sa konteksto ng paglalakbay, natural na ipinahahayag ng “nakarating” ang pagdating sa destinasyon, at ng “Kaya” ang pagpapatuloy at kinalabasan ng naunang salaysay.
- source_word: יְרוּשָׁלִָ֑ם
  choice: sa Jerusalem
  rationale: Ginamit ang karaniwang anyo ng pangalan ng lungsod sa makabagong Tagalog, na may panandang “sa” para sa destinasyon.
- source_word: וַ/נֵּ֥שֶׁב
  choice: at nanatili
  rationale: Malawak ang saklaw ng ישב—maaaring umupo, manirahan, o manatili. Dahil pansamantalang paghinto ito matapos ang paglalakbay, “nanatili” ang malinaw at angkop na salin.
- source_word: שָׁ֖ם
  choice: roon
  rationale: Karaniwang pang-abay na pamatlig ito na tumutukoy pabalik sa Jerusalem.
- source_word: יָמִ֥ים שְׁלֹשָֽׁה
  choice: nang tatlong araw
  rationale: Ipinahahayag ng parirala ang tagal ng pananatili. Natural sa Tagalog ang “nang tatlong araw” upang markahan ang haba ng panahon.
