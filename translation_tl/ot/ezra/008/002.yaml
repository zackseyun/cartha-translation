- source_word: מִבְּנֵי
  choice: mula sa mga anak ni
  rationale: Pinananatili nito ang paulit-ulit na pormulang pangangkanan sa Hebreo. Sa konteksto, maaaring tumukoy ang “mga anak” sa mas malalayong inapo, ngunit hindi iyon tahasang nililinaw sa salin.
- source_word: פִינְחָס
  choice: Finehas
  rationale: Ginamit ang kinagawiang anyo ng pangalang ito sa mga saling Tagalog.
- source_word: גֵּרְשֹׁם
  choice: Gersom
  rationale: Isinatinig ang pangalang Hebreo sa anyong natural at nakikilala sa Tagalog.
- source_word: אִיתָמָר
  choice: Itamar
  rationale: Isinatinig ang pangalang pantangi nang hindi isinasalin ang kahulugan nito.
- source_word: דָּנִיֵּאל
  choice: Daniel
  rationale: Ginamit ang nakagawiang anyo ng pangalan sa Tagalog.
- source_word: דָוִיד
  choice: David
  rationale: Ginamit ang nakagawiang anyo ng pangalan sa Tagalog; dito ay tumutukoy ito sa linya ng angkan ni David.
- source_word: חַטּוּשׁ
  choice: Hatus
  rationale: Isinatinig ang pangalang Hebreo sa anyong nababasa nang natural sa Tagalog.
