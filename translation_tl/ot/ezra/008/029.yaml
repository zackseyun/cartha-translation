  text: שִׁקְד֣וּ וְ/שִׁמְר֗וּ עַֽד תִּשְׁקְל֡וּ לִ/פְנֵי֩ שָׂרֵ֨י הַ/כֹּהֲנִ֧ים וְ/הַ/לְוִיִּ֛ם וְ/שָׂרֵֽי הָ/אָב֥וֹת לְ/יִשְׂרָאֵ֖ל בִּ/ירוּשָׁלִָ֑ם הַ/לִּשְׁכ֖וֹת בֵּ֥ית יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/029.yaml
  text: Be watchful and guard them until you weigh them out before the chief priests and the Levites and the heads of the fathers’ houses of Israel in Jerusalem[c][b][a], in the chambers of the house of Yahweh.
translation:
  language: tl
  text: Maging mapagmatyag kayo at ingatan ninyo ang mga ito[a] hanggang sa timbangin ninyo ang mga ito sa harap ng mga nakatataas na pari at mga Levita, at ng mga pinuno ng mga angkan ng Israel[b] sa Jerusalem, sa mga silid ng bahay ni Yahweh.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “Mag-ingat kayong mabuti at bantayan ninyo ang mga ito.” Idiniriin ng dalawang pautos sa Hebreo ang maingat at patuloy na pagbabantay sa mga ipinagkatiwalang bagay.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “mga pinuno ng mga ama ng Israel,” isang idyomang tumutukoy sa mga pinuno ng mga angkan o sambahayang nagmula sa iisang ninuno.
    reason: cultural_note
  - marker: c
    text: Ang “bahay ni Yahweh” ay ang templo.
    reason: cultural_note
lexical_decisions:
- source_word: שִׁקְדוּ וְשִׁמְרוּ
  choice: Maging mapagmatyag kayo at ingatan ninyo ang mga ito
  rationale: Ang dalawang pautos ay nagpapahayag ng masusing pagbabantay at pag-iingat sa mga ipinagkatiwalang mahahalagang bagay. Isiningit ang “mga ito” mula sa malinaw na konteksto ng naunang talata.
- source_word: עַד תִּשְׁקְלוּ
  choice: hanggang sa timbangin ninyo ang mga ito
  rationale: Tumutukoy ang שקל sa aktuwal na pagtitimbang ng pilak, ginto, at mga kagamitan bilang bahagi ng pananagutan sa paghahatid.
- source_word: לִפְנֵי
  choice: sa harap ng
  rationale: Likas na salin ng pagkilos sa presensiya ng mga opisyal na sasaksi sa pagtitimbang.
- source_word: שָׂרֵי הַכֹּהֲנִים וְהַלְוִיִּם
  choice: mga pinuno ng mga pari at mga Levita
  rationale: Iniiwasan ng “mga pinuno ng mga pari” ang posibleng maling pagkaunawa sa “mga punong pari” bilang isang tiyak na teknikal na pangkat; pinananatili rin nitong maaaring saklawin ng “mga pinuno” ang mga pari at mga Levita.
- source_word: שָׂרֵי הָאָבוֹת לְיִשְׂרָאֵל
  choice: mga pinuno ng mga angkan ng Israel
  rationale: Ang idyomang Hebreo ay tumutukoy sa mga pinuno ng mga sambahayan o angkang nagmula sa iisang ninuno. Ang “angkan” ay malinaw at likas sa modernong Filipino.
- source_word: הַלִּשְׁכוֹת
  choice: mga silid
  rationale: Tumutukoy sa mga silid sa loob ng kompleks ng templo; hindi ipinapalagay na ang lahat ay tiyak na mga bodega.
- source_word: בֵּית יְהוָה
  choice: bahay ni Yahweh
  rationale: Pinananatili ang konkretong Hebreong ekspresyong “bahay” at isinasalin ang banal na pangalang יהוה bilang “Yahweh.”
theological_decisions:
- issue: Paglalahad sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Hayagang taglay ng tekstong Hebreo ang Tetragrammaton; ang “Yahweh” ay tuwirang kumakatawan sa personal na pangalang tipan nang hindi ito pinapalitan ng isang titulo.
- issue: Saklaw ng pariralang “mga pinuno” sa שָׂרֵי הַכֹּהֲנִים וְהַלְוִיִּם
  choice: mga pinuno ng mga pari at mga Levita
  alternative: mga pinuno ng mga pari, at ang mga Levita
  rationale: Maaaring maunawaan ang kayariang Hebreo na ang mga pinuno ay mula sa mga pari at mga Levita. Pinananatili ng napiling ayos ang posibilidad na ito at hindi ipinipilit ang pagbasa na mga pari lamang ang may mga pinunong tinutukoy.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “maging mapagmatyag” at “ingatan” upang maging malinaw sa karaniwang mambabasa ang dobleng diin sa pagbabantay. Ang “mga silid” at “bahay ni Yahweh” ay nagpapanatili ng anyong arkitektural ng Hebreo nang hindi nagiging lipas o labis na teknikal.
