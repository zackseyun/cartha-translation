  text: ו/אוצא/ה אוֹתָ/ם֙ עַל אִדּ֣וֹ הָ/רֹ֔אשׁ בְּ/כָסִפְיָ֖א הַ/מָּק֑וֹם וָ/אָשִׂימָ/ה֩ בְּ/פִי/הֶ֨ם דְּבָרִ֜ים לְ֠/דַבֵּר אֶל אִדּ֨וֹ אָחִ֤י/ו ה/נתונים בְּ/כָסִפְיָ֣א הַ/מָּק֔וֹם לְ/הָֽבִיא לָ֥/נוּ מְשָׁרְתִ֖ים לְ/בֵ֥ית אֱלֹהֵֽי/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/017.yaml
  text: And I sent them to Iddo[a], the chief at the place Casiphia, and I put in their mouths words to speak to Iddo and his brothers, the temple servants at the place Casiphia[b], to bring us ministers for the house of our God.
translation:
  language: tl
  text: At isinugo ko sila kay Ido, ang pinuno sa lugar ng Casifia. Ipinasabi ko sa kanila ang dapat nilang sabihin kay Ido at sa kanyang mga kapatid, ang mga lingkod sa templo[a] sa lugar ng Casifia, upang magdala sila sa amin ng mga tagapaglingkod[b] para sa bahay ng aming Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga Nethinim,” isang kinikilalang pangkat ng mga lingkod na nakatalaga sa paglilingkod sa santuwaryo.
    reason: lexical_alternative
  - marker: b
    text: Ang “mga tagapaglingkod” dito ay mga taong maglilingkod sa templo; hindi ito kinakailangang tumukoy sa mga may pormal na katungkulang panrelihiyon na nabuo noong mas huling panahon.
    reason: cultural_note
lexical_decisions:
- source_word: וָאֹוצִיאָה אוֹתָם
  choice: At isinugo ko sila
  rationale: Ang Hiphil ng יצא ay literal na ‘pinalabas,’ ngunit sa konteksto ng pagpapadala ng mga kinatawan, ang natural at tumpak na diwa ay ‘isinugo.’
- source_word: אִדּוֹ הָרֹאשׁ
  choice: Ido, ang pinuno
  rationale: Ang רֹאשׁ, literal na ‘ulo,’ ay titulo rito para sa taong namumuno. Malinaw at kasalukuyang Tagalog ang ‘pinuno.’
- source_word: בְּכָסִפְיָא הַמָּקוֹם
  choice: sa lugar ng Casifia
  rationale: Pinananatili ng ‘lugar’ ang tahasang מָקוֹם sa Hebreo, habang natural sa Tagalog ang ‘lugar ng Casifia.’
- source_word: וָאָשִׂימָה בְּפִיהֶם דְּבָרִים לְדַבֵּר
  choice: Ipinasabi ko sa kanila ang dapat nilang sabihin
  rationale: Ang literal na larawan na ‘naglagay ako ng mga salita sa kanilang mga bibig’ ay idyomang nangangahulugang ibinigay ang mensaheng ihahatid. Ang salin ay natural ngunit pinananatili ang layunin ng pahayag.
- source_word: אֶל אִדּוֹ אָחִיו
  choice: kay Ido at sa kanyang mga kapatid
  rationale: Bagaman maaaring magmukhang isahan ang anyo nang walang konteksto, sinusuportahan ng kasunod na maramihang panuring at ng daloy ng pangungusap ang kolektibong ‘mga kapatid.’
- source_word: הַנְּתוּנִים
  choice: ang mga lingkod sa templo
  rationale: Ito ang kinikilalang pangkat ng mga Nethinim na nakatalaga sa paglilingkod sa santuwaryo. Mas malinaw sa karaniwang mambabasa ang pagsasalin sa tungkulin kaysa simpleng transliterasyon.
- source_word: מְשָׁרְתִים
  choice: mga maglilingkod
  rationale: Tumutukoy ang salita sa mga taong magsasagawa ng paglilingkod sa bahay ng Diyos. Naiiba ito sa teknikal na katawagang הַנְּתוּנִים nang hindi nagpapahiwatig ng isang mas huling pormal na katungkulang panrelihiyon.
- source_word: לְבֵית אֱלֹהֵינוּ
  choice: para sa bahay ng aming Diyos
  rationale: Pinananatili nito ang Hebreong metapora at teolohikal na taginting ng ‘bahay,’ sa halip na agad itong gawing ‘templo.’
theological_decisions:
- issue: Pagpapakahulugan sa הַנְּתוּנִים sa konteksto ng paglilingkod sa templo
  choice: ang mga lingkod sa templo
  alternative: ang mga Nethinim
  rationale: Ang saling batay sa tungkulin ay madaling maunawaan at angkop sa makasaysayang konteksto; inilalagay sa talababa ang tradisyonal na katawagan upang hindi mawala ang pagkakakilanlan ng natatanging pangkat.
- issue: Pagpapanatili ng pagkakaiba ng מְשָׁרְתִים at הַנְּתוּנִים
  choice: mga maglilingkod
  alternative: mga lingkod / mga tagapaglingkod
  rationale: Ang magkaibang katawagan ay nagpapanatili sa posibleng pagkakaiba ng kinikilalang pangkat ng mga lingkod sa templo at ng mas malawak na mga tauhang hinahanap para sa paglilingkod, nang hindi ipinapalagay ang isang mas huling eklesiastikong katungkulan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘ipinasabi’ para natural na ihatid ang Hebreong idyoma, ngunit pinanatili ang ‘bahay ng aming Diyos’ upang mapangalagaan ang larawan at taginting ng orihinal. Ang mga pangalang pantangi ay isina-Filipino bilang Ido at Casifia.
