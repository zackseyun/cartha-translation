base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/004.yaml
  text: 'From the sons of Pahath-moab: Eliehoenai son of Zerahiah[a], and with him two hundred males.'
translation:
  language: tl
  text: 'Mula sa mga anak ni Pahat-moab: si Eliehoenai na anak ni Zerahias, at kasama niya ang dalawang daang lalaki.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Lit. “ang mga lalaki.” Sa Hebreo, partikular na tumutukoy ang salita sa kasariang lalaki, hindi sa mas pangkalahatang katawagan para sa mga tao.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִ/בְּנֵי
  choice: Mula sa mga anak ni
  rationale: Pinananatili ang literal at pormularyong katawagang pangangkan na “mga anak ni,” habang malinaw na isinasalin ang prefiks na מִן bilang “mula sa.”
- source_word: פַּחַת מוֹאָב
  choice: Pahat-moab
  rationale: Pangalan ito ng angkan kaya tinutumbasan sa baybay-Tagalog sa halip na isalin ang mga bahagi nito; ipinakikita ng gitling na iisang tambalang pangalan ito.
- source_word: אֶלְיְהוֹעֵינַי
  choice: Eliehoenai
  rationale: Transliterasyon ng personal na pangalan na malapit sa anyong Hebreo at naaayon sa ibinigay na konsultasyong anyo.
- source_word: בֶּן זְרַחְיָה
  choice: na anak ni Zerahias
  rationale: Tuwirang ipinahahayag ang ugnayang ama-anak; natural sa modernong Tagalog ang “na anak ni” sa ganitong talaan.
- source_word: וְ/עִמּוֹ
  choice: at kasama niya
  rationale: Pinananatili ang pangatnig at malinaw na ipinakikitang ang bilang ay tumutukoy sa mga kasama ng pinunong binanggit.
- source_word: מָאתַיִם
  choice: dalawang daan
  rationale: Tuwirang salin ng kardinal na bilang.
- source_word: הַזְּכָרִים
  choice: lalaki
  rationale: Sa Tagalog, ang “lalaki” ang natural na katawagang tumutukoy sa kasariang lalaki; pinananatili nito ang espesipikong diin ng Hebreo nang hindi gumagamit ng di-natural na klinikal na pananalita.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog para sa talaang pangangkan. Ginamit ang “mga anak ni” upang mapanatili ang pormularyong Hebreo, at “lalaki” bilang likas ngunit tumpak na katumbas ng terminong tumutukoy sa kasarian.
