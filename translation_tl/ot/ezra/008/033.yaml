  text: וּ/בַ/יּ֣וֹם הָ/רְבִיעִ֡י נִשְׁקַ֣ל הַ/כֶּסֶף֩ וְ/הַ/זָּהָ֨ב וְ/הַ/כֵּלִ֜ים בְּ/בֵ֣ית אֱלֹהֵ֗י/נוּ עַ֠ל יַד מְרֵמ֤וֹת בֶּן אֽוּרִיָּה֙ הַ/כֹּהֵ֔ן וְ/עִמּ֖/וֹ אֶלְעָזָ֣ר בֶּן פִּֽינְחָ֑ס וְ/עִמָּ/הֶ֞ם יוֹזָבָ֧ד בֶּן יֵשׁ֛וּעַ וְ/נֽוֹעַדְיָ֥ה בֶן בִּנּ֖וּי הַ/לְוִיִּֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/033.yaml
  text: And on the fourth day[a], the silver and the gold and the vessels were weighed out in the house of our God into the hand of Meremoth son of Uriah the priest, and with him was Eleazar son of Phinehas, and with them were Jozabad son of Jeshua and Noadiah son of Binnui[b], the Levites.
translation:
  language: tl
  text: Sa ikaapat na araw, tinimbang sa bahay ng aming Diyos ang pilak, ang ginto, at ang mga kagamitan[a], at ipinagkatiwala ang mga ito kay Meremot na anak ni Urias, ang pari.[b] Kasama niya si Eleazar na anak ni Finehas; at kasama nila sina Jozabad na anak ni Jesua at Noadias na anak ni Binui, na mga Levita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tumutukoy ito sa mga sisidlan o iba pang kagamitang ginagamit sa templo.
    reason: cultural_note
  - marker: b
    text: Sa literal, “sa kamay ni Meremot.” Ipinahihiwatig ng idyomang Hebreo na inilagay ang mga ito sa kanyang pangangalaga o pananagutan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַיּוֹם הָרְבִיעִי
  choice: Sa ikaapat na araw
  rationale: Likas na panandang temporal sa salaysay; ipinagpapatuloy ng konteksto ang pagkakasunod-sunod nang hindi nagdaragdag ng hindi tahasang detalye.
- source_word: נִשְׁקַל
  choice: tinimbang
  rationale: Pinananatili ang pasibong diwa ng Niphal sa pamamagitan ng pangungusap na nakatuon sa mga bagay na tinimbang, habang natural ang ayos sa modernong Tagalog.
- source_word: הַכֶּסֶף וְהַזָּהָב וְהַכֵּלִים
  choice: ang pilak, ang ginto, at ang mga kagamitan
  rationale: Ang כֵּלִים ay malawak na tumutukoy sa mga sisidlan o iba pang kagamitang ginagamit sa templo; ang “mga kagamitan” ay malinaw at hindi labis na nagpapakitid sa kahulugan.
- source_word: בְּבֵית אֱלֹהֵינוּ
  choice: sa bahay ng aming Diyos
  rationale: Pinananatili ang literal at tipanang pananalitang “bahay ng aming Diyos,” bagaman ang tinutukoy ay ang templo.
- source_word: עַל יַד
  choice: ipinagkatiwala ... kay
  rationale: Ang idyoma ay nagsasaad ng paglilipat sa pangangalaga o pananagutan ng isang tao. Natural ito sa Tagalog, samantalang inilalagay sa talababa ang literal na larawang “sa kamay.”
- source_word: מְרֵמוֹת בֶּן אֽוּרִיָּה הַכֹּהֵן
  choice: Meremot na anak ni Urias at isang pari
  rationale: Ipinakikilala si Meremot bilang anak ni Urias at bilang pari, alinsunod sa pinakanatural na pagbasa sa konteksto, nang hindi gumamit ng alanganing pagkakabit ng pariralang “ang pari.”
- source_word: וְעִמּוֹ ... וְעִמָּהֶם
  choice: Kasama niya ... at kasama nila
  rationale: Sinusundan ang koordinasyon at pagbabago mula isahan tungo sa maramihang panghalip sa Hebreo.
- source_word: יוֹזָבָד בֶּן יֵשׁוּעַ וְנֽוֹעַדְיָה בֶן בִּנּוּי הַלְוִיִּם
  choice: Jozabad na anak ni Jesua at Noadias na anak ni Binui, na mga Levita
  rationale: Malinaw na iniuugnay ang pangmaramihang “mga Levita” sa huling dalawang lalaking binanggit, gaya ng balarila ng Hebreo.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa pampublikong pagbasa. Pinanatili ang “bahay ng aming Diyos” upang maipahayag ang larawan ng Hebreo, habang ginawang natural ang idyoma ng paglilipat sa pangangalaga. Inilagay ang mga pananda ng talababa sa mismong mga pariralang ipinapaliwanag nila.
