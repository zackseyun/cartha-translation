  naturalness: Malinaw at natural ang kabuuang daloy sa modernong Filipino Tagalog. Ang “si Meremot na anak ni Urias, ang pari” ay mas natural at mas tapat na paraan upang ilahad ang apposition kaysa “at isang pari.”
