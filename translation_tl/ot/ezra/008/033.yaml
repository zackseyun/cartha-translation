revisions:
- from: Sa ikaapat na araw, tinimbang sa bahay ng aming Diyos ang pilak, ang ginto, at ang mga kagamitan[a], at ipinagkatiwala ang mga ito kay Meremot na anak ni Urias at isang pari.[b] Kasama niya si Eleazar na anak ni Finehas; at kasama nila sina Jozabad na anak ni Jesua at Noadias na anak ni Binui, na mga Levita.
  to: Sa ikaapat na araw, tinimbang sa bahay ng aming Diyos ang pilak, ang ginto, at ang mga kagamitan[a], at ipinagkatiwala ang mga ito kay Meremot na anak ni Urias, ang pari.[b] Kasama niya si Eleazar na anak ni Finehas; at kasama nila sina Jozabad na anak ni Jesua at Noadias na anak ni Binui, na mga Levita.
