source:
  edition: WLC
  text: הַ֠/בָּאִים מֵֽ/הַ/שְּׁבִ֨י בְנֵֽי הַ/גּוֹלָ֜ה הִקְרִ֥יבוּ עֹל֣וֹת לֵ/אלֹהֵ֣י יִשְׂרָאֵ֗ל פָּרִ֨ים שְׁנֵים עָשָׂ֤ר עַל כָּל יִשְׂרָאֵל֙ אֵילִ֣ים תִּשְׁעִ֣ים וְ/שִׁשָּׁ֗ה כְּבָשִׂים֙ שִׁבְעִ֣ים וְ/שִׁבְעָ֔ה צְפִירֵ֥י חַטָּ֖את שְׁנֵ֣ים עָשָׂ֑ר הַ/כֹּ֖ל עוֹלָ֥ה לַ/יהוָֽה־׀־־־׀׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/035.yaml
  text: 'Those who had come from the captivity[a], the sons of the exile, offered burnt offerings to the God of Israel: twelve bulls for all Israel, ninety-six rams, seventy-seven lambs, and twelve male goats as a sin offering[c][b]. All of it was a burnt offering to Yahweh.'
translation:
  language: tl
  text: 'Ang mga dumating mula sa pagkabihag—ang mga kabilang sa mga ipinatapon[a]—ay naghandog sa Diyos ng Israel ng mga handog na sinusunog: labindalawang toro para sa buong Israel[b], siyamnapu''t anim na lalaking tupa, pitumpu''t pitong kordero, at labindalawang lalaking kambing bilang handog para sa kasalanan. Lahat ng iyon ay handog na sinusunog para kay Yahweh.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literal: “ang mga anak ng pagkakatapon,” isang Hebreong idyoma para sa pamayanan ng mga ipinatapon na nagbalik.'
    reason: cultural_note
  - marker: b
    text: 'Maaari ring isalin: “alang-alang sa buong Israel.”'
    reason: lexical_alternative
  - marker: c
    text: Ganito ang literal na buod ng Hebreo, kahit kababanggit lamang sa mga lalaking kambing bilang handog para sa kasalanan.
    reason: textual_tension
lexical_decisions:
- source_word: הַבָּאִים מֵהַשְּׁבִי
  choice: ang mga dumating mula sa pagkabihag
  rationale: Ang substantival participle ay tumutukoy sa tiyak na pangkat na nakarating na, at pinananatili ng “pagkabihag” ang kongkretong diwa ng שְׁבִי.
- source_word: בְנֵי הַגּוֹלָה
  choice: ang mga kabilang sa mga ipinatapon
  rationale: Isinasalin sa likas na modernong Tagalog ang Hebreong idyomang literal na “mga anak ng pagkakatapon,” habang pinananatili ang pagkakakilanlan nila bilang pamayanan ng mga ipinatapon.
- source_word: הִקְרִיבוּ עֹלוֹת
  choice: naghandog ... ng mga handog na sinusunog
  rationale: Ang “naghandog” ang natural na katumbas sa kontekstong pansakripisyo, at ang “handog na sinusunog” ay malinaw na katawagan para sa עֹלָה.
- source_word: עַל כָּל יִשְׂרָאֵל
  choice: para sa buong Israel
  rationale: Maikli at natural ito, at naipahihiwatig ang kinatawang diwa ng עַל sa konteksto ng paghahandog.
- source_word: אֵילִים
  choice: mga lalaking tupa
  rationale: Tiyak at madaling maunawaang katumbas ng mga tupang lalaki na ginagamit sa paghahandog.
- source_word: כְּבָשִׂים
  choice: mga kordero
  rationale: Karaniwang katawagang Tagalog para sa mga batang tupa sa listahan ng mga handog.
- source_word: צְפִירֵי חַטָּאת
  choice: mga lalaking kambing bilang handog para sa kasalanan
  rationale: Ginagawang malinaw kapwa ang kasarian ng mga kambing at ang uri ng handog na tinutukoy ng חַטָּאת.
- source_word: הַכֹּל עוֹלָה לַיהוָה
  choice: Lahat ng iyon ay handog na sinusunog para kay Yahweh
  rationale: Pinananatili ang tahasang buod ng Hebreo nang hindi pinapawi ang tensiyon nito sa naunang pagbanggit sa handog para sa kasalanan.
- source_word: יהוה
  choice: Yahweh
  rationale: Tuwirang inililipat ang tipanang pangalan ng Diyos sa halip na palitan ito ng isang titulo.
theological_decisions:
- issue: Ang tila tensiyon sa pagitan ng mga kambing bilang handog para sa kasalanan at ng pangwakas na pahayag na lahat ay handog na sinusunog
  choice: Panatilihin ang pangwakas na pahayag ng Hebreo at ipaliwanag ang tensiyon sa talababa
  alternative: Limitahan sa paraphrase ang “lahat” sa mga hayop na inihandog bilang handog na sinusunog
  rationale: Hindi tahasang nililimitahan ng tekstong Hebreo ang הַכֹּל; ang pagpapaliwanag o pag-aayos nito sa pangunahing teksto ay tahimik na lulutas sa tunay na tensiyon ng pinagmulan.
- issue: Paglalahad sa pangalang יהוה
  choice: Yahweh
  alternative: ang PANGINOON
  rationale: Pangngalang pantangi ang Tetragrammaton sa talata; pinananatili ng “Yahweh” ang katangian nito bilang inihayag na tipanang pangalan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang mga buong anyo ng bilang at malinaw na katawagang pansakripisyo. Pinanatili sa talababa ang literal na Hebreong idyoma at ang hindi nalutas na tensiyon sa pangwakas na sugnay.
