  yaml_path: translation/ot/ezra/008/014.yaml
  text: 'And from the sons of Bigvai: Uthai and Zabbud[b][a], and with them seventy males.'
translation:
  language: tl
  text: 'At mula sa mga anak ni Bigvai: sina Utai at Zabud[b], at kasama niya[a] ang pitumpung lalaki.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo ay “kasama niya” (isahan), bagaman ginagamit ng ilang salin ang “kasama nila” dahil dalawang pangalan ang nabanggit.
    reason: lexical_alternative
  - marker: b
    text: Ibang pangalan ang makikita rito sa ilang tradisyong tekstuwal at sinaunang salin; “Zabud” ang nasa Masoretic Text.
    reason: textual_variant
lexical_decisions:
- source_word: וּ/מִ/בְּנֵי
  choice: At mula sa mga anak ni
  rationale: Tuwirang pinananatili ang pananalitang pangangkanan sa Hebreo; sa konteksto ng talaan, ang “mga anak” ay maaari ring tumukoy sa mas malawak na mga inapo o angkan.
- source_word: בִגְוַי
  choice: Bigvai
  rationale: Isinalin sa baybay-Filipino bilang pangalang pantangi ng tao o angkan.
- source_word: עוּתַי
  choice: Utai
  rationale: Isinalin sa natural na baybay-Filipino ang pangalang pantangi.
- source_word: ו/זבוד
  choice: at Zabud
  rationale: Sinusunod ang pangalang זבוד sa Masoretic Text at pinananatili ang pang-ugnay na “at.”
- source_word: וְ/עִמּ/וֹ
  choice: at kasama niya
  rationale: Ang hulaping panghalip sa Hebreo ay panlalaking isahan, kaya pinanatili ang “niya” sa halip na pakinisin bilang maramihang “nila.”
- source_word: שִׁבְעִים
  choice: pitumpu
  rationale: Tuwirang katumbas ng bilang sa Hebreo.
- source_word: הַ/זְּכָרִים
  choice: lalaki
  rationale: Ang זְכָרִים ay tiyak na tumutukoy sa mga lalaking kasarian; ang “lalaki” ay natural at malinaw sa konteksto ng talaan.
