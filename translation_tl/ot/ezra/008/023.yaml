  text: So we fasted and sought our God concerning this[a], and he answered our plea.
translation:
  language: tl
  text: Kaya nag-ayuno kami at nagsumamo sa aming Diyos tungkol dito, at dininig niya kami.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “at siya ay napakiusapan namin”; o, “at tumugon siya sa aming panalangin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנָּצוּמָה
  choice: nag-ayuno kami
  rationale: Ang pandiwang צום ay tuwirang nagsasaad ng pag-aayuno ng pangkat; hindi nito tahasang sinasabing nagpahayag sila ng isang pag-aayuno.
- source_word: וַנְּבַקְשָׁה מֵאֱלֹהֵינוּ
  choice: nagsumamo sa aming Diyos
  rationale: Sa konteksto ng panalangin, ang בקשׁ na may מן ay tumutukoy sa taimtim na paghingi sa Diyos. Natural sa Filipino ang “nagsumamo sa” at pinananatili nito ang diwa ng paghiling nang hindi ginagawang simpleng paghahanap sa Diyos.
- source_word: עַל זֹאת
  choice: tungkol dito
  rationale: Tumutukoy ito sa bagay na kababanggit lamang at malinaw na inilalarawan ang ugnayang “hinggil sa bagay na ito.”
- source_word: וַיֵּעָתֵר לָנוּ
  choice: dininig niya kami
  rationale: Ang Niphal ng עתר ay nagsasaad ng kanais-nais na pagtugon sa pagsamo. Ang “dininig niya kami” ay natural at marangal na Filipino, habang hindi ipinapahiwatig ang higit pa sa tugon ng Diyos sa kanilang panalangin.
theological_decisions:
- issue: Ang kahulugan ng kanais-nais na tugon ng Diyos sa וַיֵּעָתֵר
  choice: dininig niya kami
  alternative: pinakinggan niya ang aming pagsamo; pumayag siyang pakiusapan namin
  rationale: Ipinahihiwatig ng anyo ng pandiwa na tumugon ang Diyos sa kanilang pagsamo. Iniiwasan ng salin ang malabong literal na balintiyak ngunit pinananatili ang teolohikal na punto na tumugon siya nang may pagsang-ayon.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “nagsumamo” upang natural na katawanin ang בקשׁ sa konteksto ng panalangin, at ang “dininig” bilang karaniwang biblikal ngunit nauunawaang salita para sa kanais-nais na tugon ng Diyos.
