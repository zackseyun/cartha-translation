id: EZR.8.21
reference: Ezra 8:21
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וָ/אֶקְרָ֨א שָׁ֥ם צוֹם֙ עַל הַ/נָּהָ֣ר אַהֲוָ֔א לְ/הִתְעַנּ֖וֹת לִ/פְנֵ֣י אֱלֹהֵ֑י/נוּ לְ/בַקֵּ֤שׁ מִמֶּ֨/נּוּ֙ דֶּ֣רֶךְ יְשָׁרָ֔ה לָ֥/נוּ וּ/לְ/טַפֵּ֖/נוּ וּ/לְ/כָל רְכוּשֵֽׁ/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/021.yaml
  text: Then I proclaimed a fast there[a], at the Ahava River, that we might humble ourselves before our God, to seek from him a straight path for us, for our little ones[b], and for all our possessions.
translation:
  language: tl
  text: Pagkatapos ay nagpahayag ako roon, sa tabi ng Ilog Ahava, ng isang pag-aayuno upang magpakumbaba kami[a] sa harap ng aming Diyos at humiling sa kanya ng isang tuwid na daan[b] para sa amin, sa aming maliliit na anak, at sa lahat ng aming ari-arian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “pagkaitan o pighatiin ang aming sarili.” Sa konteksto ng pag-aayuno, tumutukoy ang idyomang Hebreo sa pagpapakumbaba at pagkakait sa sarili.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “wastong daan” o “ligtas na paglalakbay.” Literal sa Hebreo ang “tuwid na daan.”
    reason: alternative_reading
lexical_decisions:
- source_word: וָאֶקְרָא
  choice: Pagkatapos ay nagpahayag ako
  rationale: Sa kontekstong ito, ang קרא ay pampublikong pagpapahayag, hindi simpleng pagtawag. Ipinahihiwatig ng “Pagkatapos ay” ang pagsulong ng salaysay.
- source_word: צוֹם
  choice: isang pag-aayuno
  rationale: Tumutukoy ang pangngalan sa itinakdang gawain ng pag-aayuno; malinaw at likas ito sa makabagong Tagalog.
- source_word: עַל הַנָּהָר אַהֲוָא
  choice: sa tabi ng Ilog Ahava
  rationale: Maaaring tumukoy ang עַל sa lokasyon sa tabi o malapit sa isang ilog. Pinanatili ang Ahava bilang pangalang pantangi.
- source_word: לְהִתְעַנּוֹת
  choice: upang magpakumbaba kami
  rationale: Sa konteksto ng pag-aayuno, ang anyong hitpael ng ענה ay nagpapahayag ng kusang pagpapakumbaba o pagkakait sa sarili; iniiwasan ng saling ito ang maling pahiwatig ng pananakit sa sarili.
- source_word: לִפְנֵי אֱלֹהֵינוּ
  choice: sa harap ng aming Diyos
  rationale: Pinananatili nito ang karaniwang Hebreong pahayag ng paninindigan at kaugnayan sa presensiya ng Diyos.
- source_word: לְבַקֵּשׁ מִמֶּנּוּ
  choice: humiling sa kanya
  rationale: Dito, ang בקש ay paghahanap o paghiling mula sa Diyos. Mas likas sa Tagalog ang “humiling sa kanya” habang malinaw na nananalangin sila para sa patnubay.
- source_word: דֶּרֶךְ יְשָׁרָה
  choice: isang tuwid na daan
  rationale: Pinananatili ang literal na larawan ng isang tuwid na daan, na maaaring saklawin kapuwa ang wastong patnubay at ligtas na paglalakbay.
- source_word: לָנוּ וּלְטַפֵּנוּ וּלְכָל רְכוּשֵׁנוּ
  choice: para sa amin, sa aming maliliit na anak, at sa lahat ng aming ari-arian
  rationale: Ang טף ay karaniwang tumutukoy sa maliliit na anak o mga batang kasama ng sambahayan, at ang רְכוּשׁ ay mga pag-aari o dalang kayamanan.
theological_decisions:
- issue: Pagpapakahulugan sa idyoma ng pag-aayuno na לְהִתְעַנּוֹת
  choice: upang magpakumbaba kami sa harap ng aming Diyos
  alternative: upang pighatiin namin ang aming sarili sa harap ng aming Diyos
  rationale: May literal na diwa ng pagpapahirap o pagkakait sa sarili ang Hebreo, ngunit sa kontekstong ito ay pagpapakumbaba sa pamamagitan ng pag-aayuno ang tinutukoy. Pinananatili ng pangunahing salin ang espirituwal na tindig nang hindi ipinapalagay ang pananakit sa sarili.
- issue: Saklaw ng דֶּרֶךְ יְשָׁרָה
  choice: isang tuwid na daan
  alternative: isang wastong daan; isang ligtas na paglalakbay
  rationale: Maaaring konkreto itong tumukoy sa ligtas na paglalakbay at maaari ring magpahiwatig ng wastong patnubay. Pinananatili ng “tuwid na daan” ang larawan at hindi nililimitahan ang kahulugan sa kaligtasang pisikal.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “pag-aayuno,” “sa harap ng aming Diyos,” at “tuwid na daan” upang mapanatili ang relihiyosong tono at ang konkretong larawang Hebreo nang hindi nagiging lipas o labis na teknikal.
