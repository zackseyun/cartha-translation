  source_fidelity: 'Tumpak na naipapahayag ng salin ang mga pangunahing bahagi ng Hebreo: ang pagtitimbang ni Ezra ng pilak, ginto, at mga kagamitan para sa mga tatanggap; ang mga ito bilang handog/abuloy para sa bahay ng kanilang Diyos; at ang mga naghandog—ang hari, kanyang mga tagapayo, mga opisyal, at lahat ng Israelitang naroon. Ang "para sa kanila" ay katanggap-tanggap na pagsasalin ng לָהֶם sa kontekstong pormal na pagtitiwala ng mga natimbang na yaman.'
