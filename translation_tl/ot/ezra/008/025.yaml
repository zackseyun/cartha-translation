base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/025.yaml
  text: And I weighed out to them the silver[a], the gold, and the vessels—the contribution for the house of our God that the king, his counselors, his officials, and all Israel who were present had offered.
translation:
  language: tl
  text: At tinimbang ko para sa kanila ang pilak, ang ginto, at ang mga kagamitan—ang handog para sa bahay ng ating Diyos na inihandog ng hari, ng kanyang mga tagapayo at mga opisyal, at ng lahat ng Israelitang naroon.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאֶשְׁקֳלָה לָהֶם
  choice: At tinimbang ko para sa kanila
  rationale: Ang שקל ay tuwirang nangangahulugang “timbangin,” at ipinahihiwatig ng לָהֶם na ang mga mahahalagang bagay ay tinimbang upang ipagkatiwala sa kanila. Likas sa Filipino ang “para sa kanila” sa ganitong konteksto.
- source_word: הַכֶּסֶף
  choice: ang pilak
  rationale: Bagaman maaari rin itong mangahulugang salapi, materyal na pilak ang tinutukoy dahil nakatala ito kasama ng ginto at mga kagamitan.
- source_word: הַזָּהָב
  choice: ang ginto
  rationale: Tuwirang tumutukoy sa mahalagang metal.
- source_word: הַכֵּלִים
  choice: ang mga kagamitan
  rationale: Malawak ang saklaw ng כֵּלִים bilang mga bagay o kasangkapan. Ang “mga kagamitan” ay natural at hindi nililimitahan ang mga ito sa isang tiyak na uri ng sisidlan.
- source_word: תְּרוּמַת
  choice: ang handog
  rationale: Tumutukoy ito sa ambag na ibinukod at ibinigay para sa banal na gamit. Sa Filipino, malinaw at natural ang “handog” sa konteksto ng bahay ng Diyos.
- source_word: בֵּית אֱלֹהֵינוּ
  choice: bahay ng ating Diyos
  rationale: Pinananatili ang kongkretong larawang “bahay” sa Hebreo sa halip na tahasang ipalit ang interpretatibong “templo.”
- source_word: הֵרִימוּ
  choice: inihandog
  rationale: Ang literal na diwang “itinaas” ay isang idyoma para sa paghahandog o pagbibigay ng banal na ambag; “inihandog” ang likas na katumbas sa Filipino.
- source_word: יֹעֲצָיו
  choice: kanyang mga tagapayo
  rationale: Tuwirang tumutukoy sa mga nagbibigay ng payo sa hari.
- source_word: שָׂרָיו
  choice: mga opisyal
  rationale: Sa kontekstong administratibo ng Persia, mas angkop ang “mga opisyal” kaysa “mga prinsipe,” na maaaring magpahiwatig ng dugong maharlika.
- source_word: וְכָל יִשְׂרָאֵל הַנִּמְצָאִים
  choice: at ng lahat ng Israelitang naroon
  rationale: Ginagawang natural sa Filipino ang kolektibong “buong Israel” habang pinananatili ang paglilimita sa mga Israelitang naroon o matatagpuan sa lugar.
theological_decisions:
- issue: Kultikong kahulugan ng תְּרוּמָה
  choice: ang handog
  alternative: ang ambag
  rationale: Ang “handog” ay natural sa modernong Filipino at nagpapahayag na ang mga bagay ay ibinukod para sa banal na gamit, nang hindi ipinapalagay na isa itong tiyak na uri ng haing ritwal.
- issue: Pagpapakahulugan sa בֵּית אֱלֹהֵינוּ
  choice: bahay ng ating Diyos
  alternative: templo ng ating Diyos
  rationale: Pinananatili ng “bahay” ang mismong metapora ng Hebreo. Templo ang tinutukoy, ngunit hindi kailangang tahasang lutasin iyon sa pangunahing teksto.
translation_notes:
  register: Modernong Filipino na marangal at malinaw. Pinanatili ang “bahay ng ating Diyos” bilang pormal na paglalapit sa Hebreong idyoma, samantalang ginamit ang “mga kagamitan,” “mga tagapayo,” at “mga opisyal” para sa likas at madaling maunawaang pananalita.
