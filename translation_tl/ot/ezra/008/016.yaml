    issue: “ipinatawag ko” para sa וָאֶשְׁלְחָה
    rationale: Ang pandiwang שׁלח ay “magpadala/magsugo,” hindi simpleng “magpatawag.” Ang konteksto ng susunod na talata ay sumusuporta sa pagpapadala sa mga taong ito para sa isang atas.
  - severity: low
    issue: “mga lalaking may unawa”
    rationale: Katanggap-tanggap ito, ngunit mas natural ang “mga taong may kabatiran” para sa paglalarawang participial na מְבִינִים, at hindi nito ino-over-specify ang tungkulin nila.
