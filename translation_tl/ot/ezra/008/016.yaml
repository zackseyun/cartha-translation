  register: Gumamit ng makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang tatlong paglitaw ng Elnatan at ang pagkakahati sa mga pinuno at sa dalawang lalaking may unawa. Isinalin ang mga pangalan sa payak na transliterasyong angkop sa Filipino.
