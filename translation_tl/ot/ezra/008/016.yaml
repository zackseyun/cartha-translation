base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/016.yaml
  text: Then I sent for Eliezer[a], Ariel, Shemaiah, Elnathan, Jarib, Elnathan, Nathan, Zechariah, and Meshullam, heads, and for Joiarib and Elnathan[b], men of understanding.
translation:
  language: tl
  text: Kaya isinugo ko sina Eliezer, Ariel, Semaya, Elnatan, Jarib, Elnatan, Natan, Zacarias, at Mesulam, na mga pinuno,[a] at sina Joiarib at Elnatan, na mga taong may kabatiran.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “mga ulo”; maaari ring isaling “mga pangunahing tao.”
    reason: lexical_alternative
  - marker: b
    text: Ang “mga taong may kabatiran” ay maaari ring isaling “mga taong may unawa,” “mga taong may pag-unawa,” o “mga taong marunong.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶשְׁלְחָה
  choice: Kaya ipinatawag ko
  rationale: Ang wayyiqtol ng שׁלח ay nagpapatuloy sa salaysay. Ipinahihiwatig ng konteksto na ipinatawag ni Ezra ang mga taong nakalista, kaya mas likas at tiyak sa Filipino ang “ipinatawag” kaysa “nagpadala ako.”
- source_word: לֶאֱלִיעֶזֶר ... וּלְאֶלְנָתָן
  choice: sina Eliezer ... at Elnatan
  rationale: Ang inuulit na ל ay tumutukoy sa mga taong pinadalhan o ipinatawag; sa konstruksiyong Filipino na “ipinatawag,” likas itong katawanin ng pantukoy na “sina” nang hindi inuulit ang pang-ukol.
- source_word: רָאשִׁים
  choice: mga pinuno
  rationale: Literal itong “mga ulo,” ngunit sa konteksto ay tumutukoy sa mga taong may pangunahing katayuan o pamumuno. Ang “mga pinuno” ang malinaw at likas na katumbas sa modernong Filipino, habang inilalagay sa talababa ang literal na larawan.
- source_word: מְבִינִים
  choice: mga lalaking may unawa
  rationale: Ang participle ng בין ay naglalarawan sa mga taong may pang-unawa o pagkilala. Pinananatili ng “may unawa” ang malawak na kahulugan nang hindi sila tiyakang tinatawag na mga guro o iskolar.
- source_word: וּלְיוֹיָרִיב וּלְאֶלְנָתָן מְבִינִים
  choice: at sina Joiarib at Elnatan, na mga lalaking may unawa
  rationale: Pinakanatural na tumutukoy ang hulíng pariralang appositional sa hulíng dalawang pangalan. Nililinaw ito ng “na” habang pinananatili ang pagkakaiba nila sa naunang pangkat ng mga pinuno.
- source_word: אֶלְנָתָן
  choice: Elnatan
  rationale: Tatlong ulit lumilitaw ang pangalang ito sa talata. Pinananatili ang bawat paglitaw dahil maaaring magkakaibang tao ang tinutukoy na may iisang pangalan.
