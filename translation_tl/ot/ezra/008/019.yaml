base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/019.yaml
  text: and Hashabiah[a], and with him Jeshaiah, from the sons of Merari, his brothers and their sons, twenty[b];
translation:
  language: tl
  text: at si Hasabias, at kasama niya si Jesaias, mula sa mga anak ni Merari[a], ang mga kapatid niya[b] at ang kanilang mga anak na lalaki—dalawampu;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “mula sa mga inapo ni Merari” o “mula sa angkan ni Merari.” Literal sa Hebreo: “mula sa mga anak ni Merari.”'
    reason: lexical_alternative
  - marker: b
    text: Sa kontekstong ito, ang “mga kapatid” ay maaaring tumukoy sa mga lalaking kaangkan o malalapit na kamag-anak sa angkan ni Merari, hindi lamang sa mga kapatid sa laman.
    reason: cultural_note
lexical_decisions:
- source_word: וְאֶת חֲשַׁבְיָה
  choice: at si Hasabias
  rationale: Ipinagpapatuloy ng וְ ang talaan mula sa naunang talata, samantalang hindi kailangang katawanin nang hiwalay sa Tagalog ang pantukoy sa tuwirang layon na אֶת. Ginamit ang nakaugaliang anyong Tagalog ng pangalan.
- source_word: וְאִתּוֹ יְשַׁעְיָה
  choice: at kasama niya si Jesaias
  rationale: Tuwirang ipinahahayag ng אִתּוֹ ang pagsama ng isang lalaki sa naunang binanggit. Pinananatili ng 'niya' ang ugnayang nasa Hebreo nang hindi nililinaw nang higit sa teksto.
- source_word: מִבְּנֵי מְרָרִי
  choice: mula sa mga anak ni Merari
  rationale: Pinananatili nito ang literal na idyomang pangangkan na 'mula sa mga anak ni Merari'; sa konteksto, maaari itong tumukoy sa mga inapo o angkan ni Merari.
- source_word: אֶחָיו
  choice: ang mga kapatid niya
  rationale: Ang אָח sa maramihan ay karaniwang 'mga kapatid na lalaki,' ngunit sa talaang pangangkan maaari ring tumukoy sa mga lalaking kamag-anak o kaangkan. Ang 'mga kapatid niya' ang pinakamalapit at hindi labis na nagpapakahulugan.
- source_word: וּבְנֵיהֶם
  choice: at ang kanilang mga anak
  rationale: Literal itong 'at ang kanilang mga anak na lalaki.' Sa ganitong talaang panlalaki, likas sa Tagalog ang 'mga anak' at sapat na ipinahihiwatig ng konteksto ang kasarian.
- source_word: עֶשְׂרִים
  choice: dalawampu lahat
  rationale: Ang bilang ay natural na kabuuan ng mga kapatid at kanilang mga anak na kababanggit. Nililinaw ng 'lahat' ang tungkulin ng bilang nang hindi nagdaragdag ng bagong nilalaman.
theological_decisions:
- issue: Kung sino ang tinutukoy ng hulaping isahan sa אֶחָיו ('mga kapatid niya')
  choice: Pinanatili ang panghalip na 'niya' nang walang tahasang pangalan.
  alternative: ang mga kapatid ni Jesaias / ang mga kapatid ni Hasabias
  rationale: Bagaman pinakamalapit sa gramatika ang Jesaias, hindi tahasang inuulit ng Hebreo ang pangalan. Pinananatili ng salin ang tunay na posibleng kalabuan ng reperensiya.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Pinanatili ang anyo ng isang nagpapatuloy na talaan sa pamamagitan ng panimulang 'at' at pangwakas na tuldok-kuwit. Ginamit ang mga nakaugaliang anyong Tagalog na Hasabias at Jesaias. Inilipat ang mga panandang talababa sa mismong mga pariralang kanilang ipinapaliwanag upang maging malinaw ang ugnayan.
