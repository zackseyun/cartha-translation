  text: וּ/כְפֹרֵ֤י זָהָב֙ עֶשְׂרִ֔ים לַ/אֲדַרְכֹנִ֖ים אָ֑לֶף וּ/כְלֵ֨י נְחֹ֜שֶׁת מֻצְהָ֤ב טוֹבָה֙ שְׁנַ֔יִם חֲמוּדֹ֖ת כַּ/זָּהָֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/027.yaml
  text: and twenty bowls of gold worth a thousand darics[a], and two vessels of fine gleaming bronze[b], precious as gold.
translation:
  language: tl
  text: at dalawampung mangkok na ginto na nagkakahalaga ng isang libong dariko[a], at dalawang sisidlang yari sa pinong kumikislap na tanso[b], na kasinghalaga ng ginto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “dalawampung mangkok na ginto, na nagkakahalaga sa kabuuan ng isang libong dariko.” Maaaring unawain ang Hebreo bilang pagbibigay ng kabuuang halaga ng mga mangkok.
    reason: lexical_alternative
  - marker: b
    text: O “dalawang sisidlang yari sa mahusay na pinakintab na tanso.” Malamang na inilalarawan ng pambihirang pananalita sa Hebreo ang napinong tanso na may maningning na pagkakagawa.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְפֹרֵי
  choice: mangkok
  rationale: Tumutukoy sa mga sisidlang hugis-mangkok; natural at malinaw ito sa modernong Filipino sa konteksto ng talaan ng mahahalagang kagamitan.
- source_word: זָהָב
  choice: ginto
  rationale: Tuwirang katumbas ng materyal na tinutukoy.
- source_word: לַאֲדַרְכֹנִים אָלֶף
  choice: na nagkakahalaga ng isang libong dariko
  rationale: Malamang na ipinapahayag ng ל ang halaga ng dalawampung mangkok bilang kabuuan. Pinananatili ang makasaysayang katawagang dariko.
- source_word: כְלֵי
  choice: sisidlan
  rationale: Malawak na termino ito para sa mga kagamitang lalagyan; ang 'sisidlan' ay angkop at dignificado sa talaan ng mga kagamitan sa templo.
- source_word: נְחֹשֶׁת
  choice: tanso
  rationale: Maaaring tumukoy sa copper o bronze. Sa Filipino, 'tanso' ang pinakanatural na pangkalahatang tawag para sa metal na ginamit sa sinaunang kagamitang ito.
- source_word: מֻצְהָב טוֹבָה
  choice: pinong kumikislap
  rationale: Mahirap at pambihira ang paglalarawan. Ipinahihiwatig nito ang mataas na kalidad at maningning na anyo nang hindi tiyak na nagsasabing binalutan ng ginto ang tanso.
- source_word: שְׁנַיִם
  choice: dalawa
  rationale: Tuwirang salin ng bilang.
- source_word: חֲמוּדֹת כַּזָּהָב
  choice: na kasinghalaga ng ginto
  rationale: Ipinapahayag ang pagiging kanais-nais o mahalaga ng mga sisidlan at pinananatili ang tahasang paghahambing sa ginto.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na malinaw at dignificado. Ginamit ang 'dariko' bilang makasaysayang yunit at nilagyan ng talababa ang posibleng pagbasa sa halaga at ang di-tiyak na paglalarawan sa tanso.
