translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang makasaysayang terminong “satrapa” at ang teknikal na pangalang “Kabilang-Ilog,” na kapwa sinusuportahan ng konteksto; ipinaliwanag sa talababa ang hindi pamilyar na katawagang heograpiko.
