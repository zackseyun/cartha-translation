base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/036.yaml
  text: And they delivered the king’s decrees to the king’s satraps and the governors Beyond the River[c][b][a], and they supported the people and the house of God.
translation:
  language: tl
  text: Ibinigay nila ang mga utos ng hari sa mga satrapa ng hari at sa mga gobernador sa Kabila ng Ilog[a], at tinulungan[b] ng mga ito ang bayan at ang bahay ng Diyos.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “Kabila ng Ilog” ay katawagang administratibo ng Persia para sa rehiyon sa kanluran ng Ilog Eufrates.
    reason: cultural_note
  - marker: b
    text: O “sinuportahan.” Literal na ang pandiwang Hebreo ay “binuhat” o “pinasan,” ngunit dito ay may diwang pagbibigay ng tulong.
    reason: lexical_alternative
  - marker: c
    text: O “templo ng Diyos.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ
  choice: Ibinigay nila
  rationale: Ang נתן ay pangunahing nangangahulugang “magbigay.” Sa konteksto, tumutukoy ito sa pormal na pagbibigay ng mga dokumentong hari sa mga opisyal; natural at sapat ang “ibinigay” sa Tagalog.
- source_word: דָּתֵי הַמֶּלֶךְ
  choice: mga utos ng hari
  rationale: Sa kontekstong Persiano, ang דָּת ay opisyal na kautusan o atas. Ang “mga utos” ay malinaw sa karaniwang mambabasa at hindi nagpapahiwatig ng isang buong kodigo ng batas.
- source_word: אֲחַשְׁדַּרְפְּנֵי
  choice: mga satrapa
  rationale: Ito ang tumpak na makasaysayang katawagan sa mga pinunong panlalawigan ng Imperyong Persiano.
- source_word: פַחֲוֹת
  choice: mga gobernador
  rationale: Ang פחה ay tumutukoy sa mga gobernador o tagapangasiwa ng rehiyon; “mga gobernador” ang malinaw at natural na katumbas.
- source_word: עֵבֶר הַנָּהָר
  choice: Kabilang-Ilog
  rationale: Isa itong teknikal na katawagang administratibo ng Persia para sa rehiyon sa kanluran ng Eufrates. Pinanatili bilang pantanging katawagan upang huwag gawing pangkaraniwang lokatibong parirala lamang.
- source_word: וְנִשְּׂאוּ
  choice: tinulungan ng mga ito
  rationale: Literal na may diwang “buhatin” o “pasanin,” ngunit dito ay idyomatikong nangangahulugang magbigay ng tulong o suporta. Nilinaw ng “mga ito” na ang mga opisyal ang paksa, gaya ng ipinahihiwatig ng Hebreong maramihang pandiwa.
- source_word: הָעָם
  choice: ang bayan
  rationale: Pinananatili ang pangkalahatang pagtukoy ng Hebreo at hindi tahasang dinaragdagan ng “Israel.”
- source_word: בֵּית הָאֱלֹהִים
  choice: ang bahay ng Diyos
  rationale: Literal at likas na salin ng parirala; bagaman tumutukoy sa templo, pinananatili nito ang larawan at pananalita ng Hebreo.
