  to: Tinipon ko sila sa ilog na patungo sa Ahava[a], at nagkampo kami roon nang tatlong araw. Pagkatapos, sinuri ko ang mga tao at ang mga pari, ngunit wala akong natagpuang sinuman mula sa mga anak ni Levi roon[b].
