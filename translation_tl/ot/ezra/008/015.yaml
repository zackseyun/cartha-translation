base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/015.yaml
  text: I gathered them to the river that comes to Ahava[a], and we camped there three days. Then I examined the people and the priests[b], but I found none of the sons of Levi there.
translation:
  language: tl
  text: Tinipon ko sila sa ilog na patungo sa Ahava[a], at nagkampo kami roon nang tatlong araw. Pagkatapos, sinuri ko ang mga tao at ang mga pari, ngunit wala akong natagpuang sinuman mula sa mga anak ni Levi roon[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa kanal na patungong Ahava.” Sa kontekstong ito, ang salitang Hebreo ay maaaring tumukoy sa ilog o sa kanal na ginawa ng tao.
    reason: lexical_alternative
  - marker: b
    text: Ang “mga anak ni Levi” ay tumutukoy sa mga Levita.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶקְבְּצֵם
  choice: Tinipon ko sila
  rationale: Tuwirang ipinahahayag ang aktibong pagtitipon ni Ezra; natural at malinaw sa makabagong Filipino.
- source_word: הַנָּהָר הַבָּא אֶל אַהֲוָא
  choice: sa ilog na umaagos patungong Ahava
  rationale: Karaniwang kahulugan ng נָהָר ang “ilog,” habang ipinahahayag ng “umaagos patungo” ang direksiyonal na diwa ng הַבָּא אֶל. Nananatili sa talababa ang posibleng kahulugang kanal.
- source_word: וַנַּחֲנֶה
  choice: nagkampo kami
  rationale: Natural na makabagong katumbas ng pandiwang חנה, nang hindi gumagamit ng lipas o labis na pormal na pananalita.
- source_word: יָמִים שְׁלֹשָׁה
  choice: nang tatlong araw
  rationale: Karaniwang ayos at gamit sa Filipino para sa tagal ng panahon.
- source_word: וָאָבִינָה
  choice: sinuri ko
  rationale: Sa konteksto, tumutukoy ito sa maingat na pagtingin o pagsusuri sa bumubuo sa pangkat, hindi lamang sa pag-unawa.
- source_word: בָעָם וּבַכֹּהֲנִים
  choice: ang mga tao at ang mga pari
  rationale: Pinananatili ang dalawang pangkat na tahasang binanggit sa Hebreo at ang payak na katawagan sa bawat isa.
- source_word: וּמִבְּנֵי לֵוִי לֹא מָצָאתִי שָׁם
  choice: wala akong natagpuang sinuman doon mula sa mga anak ni Levi
  rationale: Ipinapakita ng “mula sa” ang מִן at pinananatili ng “mga anak ni Levi” ang literal at genealogical na anyo ng parirala.
