- from: Kaya umalis kami mula sa Ilog Ahava nang ikalabindalawang araw ng unang buwan upang pumunta sa Jerusalem. Sumaatin ang kamay ng ating Diyos, at iniligtas niya tayo mula sa kamay ng kaaway at mula sa mga nag-aabang sa daan.[a]
  to: Pagkatapos, umalis kami mula sa Ilog Ahava noong ikalabindalawang araw ng unang buwan upang pumunta sa Jerusalem. Ang kamay ng aming Diyos ay sumaamin, at iniligtas niya kami mula sa kamay ng kaaway at mula sa nakaabang sa daan.[a]
  rationale: Inalis ang di-makatwirang pahiwatig ng sanhi, ginawang magkakatugma ang mga panghalip para sa pangkat na nagsasalaysay, at ibinalik sa isahan ang nakaabang na kaayon ng Hebreong participle. Pinanatili ang literal at mahalagang idyoma ng kamay ng Diyos at ang alternatibong abstraktong pagbasa sa talababa.
