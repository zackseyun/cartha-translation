  text: וַֽ/נִּסְעָ֞/ה מִ/נְּהַ֣ר אַֽהֲוָ֗א בִּ/שְׁנֵ֤ים עָשָׂר֙ לַ/חֹ֣דֶשׁ הָ/רִאשׁ֔וֹן לָ/לֶ֖כֶת יְרוּשָׁלִָ֑ם וְ/יַד אֱלֹהֵ֨י/נוּ֙ הָיְתָ֣ה עָלֵ֔י/נוּ וַ/יַּ֨צִּילֵ֔/נוּ מִ/כַּ֥ף אוֹיֵ֛ב וְ/אוֹרֵ֖ב עַל הַ/דָּֽרֶךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/031.yaml
  text: Then we set out from the river Ahava on the twelfth day of the first month to go to Jerusalem[a], and the hand of our God was upon us, and he delivered us from the hand of the enemy and the ambushes along the way.
translation:
  language: tl
  text: Pagkatapos, umalis kami mula sa Ilog Ahava noong ikalabindalawang araw ng unang buwan upang pumunta sa Jerusalem. Ang kamay ng aming Diyos ay sumaamin, at iniligtas niya kami mula sa kamay ng kaaway at mula sa nakaabang sa daan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mula sa pagtambang sa daan.” Ang salitang Hebreo ay maaaring tumukoy sa isang taong nakaabang upang manambang o, sa diwang mas abstrakto, sa panganib ng pagtambang.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנִּסְעָה
  choice: Kaya umalis kami
  rationale: Sa konteksto ng paglalakbay, ang נסע ay tumutukoy sa pag-alis ng kampo at pagsisimula ng paglalakbay. Natural sa modernong Tagalog ang “umalis kami,” at ipinahihiwatig ng “Kaya” ang pagsunod nito sa naunang pangyayari.
- source_word: מִנְּהַר אֲהֲוָא
  choice: mula sa Ilog Ahava
  rationale: Tuwirang isinasalin ang נָהָר bilang “ilog,” at pinananatiling transliterado ang pangalang Ahava.
- source_word: בִּשְׁנֵים עָשָׂר לַחֹדֶשׁ הָרִאשׁוֹן
  choice: nang ikalabindalawang araw ng unang buwan
  rationale: Bagaman ipinahihiwatig lamang sa Hebreo ang “araw,” kailangan itong hayagang sabihin sa Tagalog upang maging malinaw at natural.
- source_word: לָלֶכֶת יְרוּשָׁלִָם
  choice: upang pumunta sa Jerusalem
  rationale: Ang infinitive ay nagpapahayag ng layunin; malinaw at tuwiran itong naihahayag ng “upang pumunta.”
- source_word: וְיַד אֱלֹהֵינוּ הָיְתָה עָלֵינוּ
  choice: Sumaatin ang kamay ng ating Diyos
  rationale: Pinananatili ang mahalagang larawang Hebreo ng kamay ng Diyos bilang tanda ng kanyang aktibong pagkalinga at proteksiyon. Dignified at nauunawaan sa Tagalog ang “sumaatin.”
- source_word: וַיַּצִּילֵנוּ
  choice: at iniligtas niya tayo
  rationale: Ang נצל ay nangangahulugang iligtas o sagipin mula sa panganib. Ang “iniligtas” ay natural at angkop sa rehistro ng salaysay.
- source_word: מִכַּף אוֹיֵב
  choice: mula sa kamay ng kaaway
  rationale: Pinananatili ang literal na “kamay” upang maipakita ang paralelismo sa kamay ng Diyos; dito ay tumutukoy ito sa kapangyarihan o kontrol ng kaaway.
- source_word: וְאוֹרֵב
  choice: at mula sa mga nag-aabang
  rationale: Ang participle ay maaaring tumukoy sa isang taong nag-aabang upang manambang. Ang maramihang “mga nag-aabang” ay natural sa Tagalog bilang pangkalahatang banta, habang ang posibleng abstraktong kahulugang “pagtambang” ay inilalagay sa talababa.
- source_word: עַל הַדָּרֶךְ
  choice: sa daan
  rationale: Tuwiran at natural na katumbas ng lugar kung saan nag-aabang ang banta.
theological_decisions:
- issue: Antropomorpikong idyoma para sa proteksiyon ng Diyos
  choice: Panatilihin sa pangunahing teksto ang “Sumaatin ang kamay ng ating Diyos”
  alternative: Pinrotektahan tayo ng ating Diyos
  rationale: Hayagang ginagamit ng Hebreo ang larawan ng kamay ng Diyos, isang mahalagang paulit-ulit na tema sa Ezra-Nehemias para sa banal na pagkalinga at proteksiyon. Hindi ito kailangang gawing tahasang paliwanag sa salin.
- issue: Pagkakaiba ng mga panghalip sa Tagalog
  choice: “ating Diyos” at “iniligtas niya tayo”
  alternative: “aming Diyos” at “iniligtas niya kami”
  rationale: Hindi tinutukoy ng Hebreo kung kabilang o hindi ang kausap sa unang panauhang maramihan. Ginamit ang inklusibong anyo ayon sa karaniwang biblikal na pagpapahayag sa Tagalog, ngunit tunay na posible rin ang eksklusibong anyo depende sa tinutukoy na tagapakinig.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Pinanatili ang larawang “kamay ng Diyos” at ang katapat na “kamay ng kaaway.” Ang talababa [a] ay inilagay pagkatapos ng buong pariralang nauugnay rito.
