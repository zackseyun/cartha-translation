  text: 'And from the sons of Azgad: Johanan son of Hakkatan[b][a], and with him 110 males.'
translation:
  language: tl
  text: 'At mula sa mga anak ni Azgad[a]: si Johanan na anak ni Hakkatan[b], at kasama niya ang 110 lalaki.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga inapo ni Azgad.” Sa Hebreo, ang “mga anak” ay maaari ring tumukoy sa mas malawak na angkan, hindi lamang sa tuwirang mga anak.
    reason: lexical_alternative
  - marker: b
    text: O “anak ng nakababata,” kung ang הַקָּטָן (haqqatan) ay inuunawang paglalarawan sa halip na pangalang Hakkatan.
    reason: alternative_reading
lexical_decisions:
- source_word: וּ/מִ/בְּנֵי
  choice: At mula sa mga anak ni
  rationale: Pinananatili nito ang pormang pangangkanan ng Hebreo at ang pagkakasunod-sunod ng talaan; maaaring tumukoy ang “mga anak” sa mas malawak na mga inapo.
- source_word: עַזְגָּד
  choice: Azgad
  rationale: Pangalan ng tao o angkan; tinumbasan sa karaniwang transliterasyong Filipino.
- source_word: יוֹחָנָן
  choice: Johanan
  rationale: Direktang transliterasyon ng pangalang Hebreo na angkop sa konteksto ng talaang pangangkanan.
- source_word: בֶּן הַ/קָּטָן
  choice: anak ni Hakatan
  rationale: Sa talaang ito, pinakamalamang na patronimiko at pangalang pantangi ang Hakatan; inilalahad sa talababa ang posibleng deskriptibong pagbasa.
- source_word: וְ/עִמּוֹ
  choice: at kasama niya
  rationale: Likas na Filipino para sa pormulang nagpapakilala sa bilang ng mga kasamang nasa ilalim ng pinunong binanggit.
- source_word: מֵאָה וַ/עֲשָׂרָה
  choice: '110'
  rationale: Tumpak at madaling basahing modernong anyo ng bilang na isang daan at sampu.
- source_word: הַ/זְּכָרִים
  choice: lalaki
  rationale: Ipinahahayag ang tiyak na pagtukoy ng Hebreo sa kasariang lalaki nang mas natural sa Filipino kaysa sa “mga lalaking nilalang”; hindi nito kinakailangang ipasiya na pawang nasa hustong gulang sila.
