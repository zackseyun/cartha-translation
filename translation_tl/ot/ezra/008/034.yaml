translation:
  language: tl
  text: Ang lahat ay binilang at tinimbang, at ang kabuuang timbang ay itinala noong panahong iyon.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּמִסְפָּר
  choice: binilang
  rationale: Ang מִסְפָּר ay tumutukoy sa bilang. Sa konteksto ng pagsusuri sa mga mahahalagang bagay, likas na ipinapahayag ng “binilang” ang paraang nakasaad sa Hebreo.
- source_word: בְּמִשְׁקָל
  choice: tinimbang
  rationale: Ang מִשְׁקָל ay “timbang.” Ang pandiwang “tinimbang” ay natural sa modernong Tagalog at kaagapay ng “binilang” sa paglalarawan ng isinagawang pagsusuri.
- source_word: לַכֹּל
  choice: ang lahat
  rationale: Ipinahihiwatig ng parirala na saklaw ng pagbibilang at pagtitimbang ang buong ipinagkatiwalang kalakal.
- source_word: וַיִּכָּתֵב
  choice: ay itinala
  rationale: Ang Niphal ng כתב ay pasibo, “isinulat.” Sa kontekstong administratibo, malinaw at natural ang “itinala” para sa pormal na pagtatala.
- source_word: כָּל הַמִּשְׁקָל
  choice: ang kabuuang timbang
  rationale: Bagaman literal na “lahat ng timbang,” ang “kabuuang timbang” ang likas na Tagalog para sa pinagsamang halagang naitala.
- source_word: בָּעֵת הַהִיא
  choice: nang panahong iyon
  rationale: Pinananatili nito ang tiyak na pagtukoy ng Hebreo sa panahon ng paghahatid at pagsusuri.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at natural. Ginawang magkatambal ang “binilang at tinimbang” upang maihatid nang maikli ang dalawang pamamaraang nasa Hebreo, habang pinanatili ang pasibong “itinala.”
