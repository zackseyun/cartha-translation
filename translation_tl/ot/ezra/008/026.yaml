base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/026.yaml
  text: And I weighed out into their hands six hundred and fifty talents of silver[a], and one hundred talents worth of silver vessels, and one hundred talents of gold.
translation:
  language: tl
  text: At tinimbang ko at ipinagkatiwala ko sa kanila ang 650 talento ng pilak, ang mga kagamitang pilak na nagkakahalaga ng 100 talento[a], at ang 100 talento ng ginto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang mga kagamitang pilak na tumitimbang ng 100 talento.” Pahapyaw ang pagkakahayag ng Hebreo sa bahaging ito; malamang na tumutukoy ito sa mga kagamitang pilak na ang kabuuang halaga ay katumbas ng 100 talento.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶשְׁקֲלָה
  choice: tinimbang ko
  rationale: Tuwirang ipinapahayag ng pandiwa ang pagtitimbang sa mga mahahalagang metal; ang kasunod na parirala ang nagpapakita na ang mga ito ay ipinagkatiwala rin.
- source_word: עַל יָדָם
  choice: ipinagkatiwala sa kanila
  rationale: Ang literal na larawan ay ‘sa kanilang kamay,’ ngunit sa konteksto ay tumutukoy ito sa paglalagay ng mga bagay sa kanilang pangangalaga.
- source_word: כֶּסֶף
  choice: pilak
  rationale: Timbang na mahalagang metal ang tinutukoy, hindi salaping barya.
- source_word: כִּכָּרִים
  choice: talento
  rationale: Karaniwang katawagan sa malaking sinaunang yunit ng timbang; pinananatili ito upang hindi magtakda ng di-tiyak na modernong katumbas.
- source_word: שֵׁשׁ מֵאוֹת וַחֲמִשִּׁים
  choice: '650'
  rationale: Tuwirang bilang na tumutukoy sa mga talento ng pilak.
- source_word: וּכְלֵי כֶסֶף
  choice: mga kagamitang pilak
  rationale: Malawak ang kahulugan ng כְּלִי at maaaring tumukoy sa mga sisidlan o iba pang kagamitan; natural at hindi labis na tiyak ang ‘mga kagamitan’ sa Filipino.
- source_word: מֵאָה לְכִכָּרִים
  choice: na tumitimbang ng 100 talento
  rationale: Pahapyaw o eliptikal ang Hebreo. Ipinapakahulugan dito na ang pinagsamang timbang ng mga kagamitang pilak ay 100 talento, nang hindi itinuturing na bilang ng mga kagamitan ang ‘isang daan.’
- source_word: זָהָב
  choice: ginto
  rationale: Karaniwang katumbas ng mahalagang metal na tinutukoy.
- source_word: מֵאָה כִכָּר
  choice: 100 talento
  rationale: Tuwirang bilang at yunit ng timbang para sa ginto.
