  text: 'And from the sons of Adin: Ebed son of Jonathan[a], and with him fifty males.'
translation:
  language: tl
  text: 'At mula sa mga anak ni Adin: si Ebed na anak ni Jonatan, at kasama niya ang limampung lalaki.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “limampung kalalakihan.” Partikular na tumutukoy ang salitang Hebreo sa mga lalaki.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מִ/בְּנֵי
  choice: At mula sa mga anak ni
  rationale: Pinananatili ang pang-ugnay at ang pormal na pananalitang pangangkan na בני, habang natural pa rin sa isang talaan sa Tagalog.
- source_word: עָדִין
  choice: Adin
  rationale: Pangngalang pantangi; tinumbasan sa transliterasyong karaniwang ginagamit sa Tagalog.
- source_word: עֶבֶד
  choice: Ebed
  rationale: Pangalan ito rito, hindi ang karaniwang pangngalang nangangahulugang alipin o lingkod; direktang sinasalamin ng “Ebed” ang Hebreong pangalan.
- source_word: בֶּן
  choice: anak ni
  rationale: Karaniwang panandang pangangkan sa Tagalog at angkop sa maikling anyo ng talaan.
- source_word: יוֹנָתָן
  choice: Jonatan
  rationale: Natural na transliterasyong Tagalog ng pangalang Hebreo.
- source_word: וְ/עִמּוֹ
  choice: at kasama niya
  rationale: Pinananatili ang pang-ugnay na וְ at malinaw na iniuugnay ang bilang sa pinunong pinangalanan.
- source_word: חֲמִשִּׁים
  choice: limampu
  rationale: Tuwirang katumbas ng bilang na limampu; ginawang “limampung” bago ang pangngalan ayon sa gramatikang Tagalog.
- source_word: הַזְּכָרִים
  choice: lalaki
  rationale: Sa konteksto ng talaan ng mga taong kasama niya, ang “lalaki” ay natural at dignified sa Tagalog habang ipinahihiwatig ang tiyak na kasariang panlalaki ng Hebreo; nililinaw ng talababa ang mas literal na alternatibo.
theological_decisions: []
translation_notes:
  register: Makabagong Filipino Tagalog na maikli at angkop sa anyo ng talaang pangangkan. Ginamit ang “mga anak ni” upang mapanatili ang pormal na larawan ng Hebreo, at “lalaki” sa pangunahing teksto dahil mas natural ito kaysa “mga panlalaki” sa pagtukoy sa mga tao.
