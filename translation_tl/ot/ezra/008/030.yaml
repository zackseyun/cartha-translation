translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang administratibong diwa ng pagtimbang at ang literal na larawan ng “bahay ng ating Diyos,” habang gumamit ng natural na ayos ng pangungusap.
