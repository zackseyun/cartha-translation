base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/030.yaml
  text: So the priests and the Levites received the weighed amount of the silver[a], the gold, and the vessels, to bring them to Jerusalem[b], to the house of our God.
translation:
  language: tl
  text: Kaya tinanggap ng mga pari at mga Levita ang tinimbang na dami ng pilak, ginto, at mga kagamitan[a] upang dalhin ang mga iyon sa Jerusalem, sa bahay ng ating Diyos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang bigat ng pilak, ginto, at mga kagamitan.” Ang salitang Hebreo ay maaaring tumukoy sa mismong timbang o sa daming natukoy sa pagtimbang.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “sa templo ng ating Diyos.” Literal na, “sa bahay ng ating Diyos.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקִבְּלוּ
  choice: tinanggap
  rationale: Ang Qal perfect ay tumutukoy sa pagtanggap ng mga mahahalagang bagay upang pangalagaan at dalhin; natural at tumpak ang “tinanggap” sa kontekstong ito.
- source_word: הַכֹּהֲנִים וְהַלְוִיִּם
  choice: ang mga pari at mga Levita
  rationale: Tuwirang salin ng dalawang tiyak na pangkat; ginagamit ang karaniwang anyong Filipino na “Levita.”
- source_word: מִשְׁקַל
  choice: ang timbang na halaga
  rationale: Ipinahahayag nito ang dami o halagang tiniyak sa pamamagitan ng pagtimbang, sa halip na gawing simpleng panuring lamang ang “timbang.”
- source_word: הַכֶּסֶף וְהַזָּהָב וְהַכֵּלִים
  choice: ng pilak, ginto, at mga kagamitan
  rationale: Literal ang “pilak” at “ginto.” Malawak ang saklaw ng כֵּלִים, kaya mas natural at hindi labis na tiyak ang “mga kagamitan” sa Filipino.
- source_word: לְהָבִיא
  choice: upang dalhin ang mga iyon
  rationale: Ipinakikita ng infinitive na may לְ ang layunin. Idinagdag ang “mga iyon” bilang likas na panghalip na tumutukoy sa pilak, ginto, at mga kagamitan.
- source_word: לִירוּשָׁלִַם
  choice: sa Jerusalem
  rationale: Karaniwang salin ng pangalang pantangi at ng direksiyonal na pang-ukol.
- source_word: לְבֵית אֱלֹהֵינוּ
  choice: sa bahay ng ating Diyos
  rationale: Pinananatili ang literal na Hebreong larawan na “bahay ng ating Diyos”; ang “templo” ay malinaw sa konteksto ngunit mas interpretatibo.
