    issue: Hindi natural at hindi tumpak ang talababa na “Sa literal, ‘pitumpung mga lalaking kasarian.’”
    rationale: Hindi sinasabi ng Hebreo ang “lalaking kasarian”; ang termino ay tumutukoy sa mga lalaki/male persons. Bukod dito, hindi idiomatiko ang pariralang ito sa Filipino. Dahil malinaw na ang pangunahing teksto, pinakamainam na alisin ang talababa at ang pananda nito.
