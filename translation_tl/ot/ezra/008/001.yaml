base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/001.yaml
  text: 'These are the heads of their fathers’ houses[a], and their genealogy, of those who went up with me from Babylon in the reign of King Artaxerxes:'
translation:
  language: tl
  text: 'Ito ang mga pinuno ng kanilang mga angkan at ang kanilang talaangkanan[a]—ang mga umahon kasama ko mula sa Babilonia noong naghahari si Haring Artajerjes:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang tala ng kanilang mga angkan” o “ang mga nakatalang ayon sa angkan.” Ang salitang Hebreo ay tumutukoy sa pagpapatala o rekord ayon sa angkan, hindi lamang sa ninuno o lahi sa pangkalahatan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Ito ang
  rationale: Likas na panimula ito sa isang bagong talaan sa Filipino; hindi na kailangang isalin nang hiwalay ang pang-ugnay na וְ bilang “At.”
- source_word: רָאשֵׁי אֲבֹתֵיהֶם
  choice: mga pinuno ng kanilang mga angkan
  rationale: Ang literal na “mga ulo ng kanilang mga ama” ay isang idyomang tumutukoy sa mga pangunahing kinatawan ng mga sambahayan o angkan. Pinananatili ng “mga pinuno” ang tungkulin, at malinaw sa karaniwang mambabasa ang “mga angkan.”
- source_word: וְהִתְיַחְשָׂם
  choice: at ang kanilang talaangkanan[a]
  rationale: Tumutukoy ang salita sa tala o pagpapatala batay sa angkan, hindi lamang sa lahi bilang abstraktong konsepto. Ang “talaangkanan” ay maikli at natural, habang inilalahad sa talababa ang administratibong diwa at mga posibleng pagbasa.
- source_word: הָעֹלִים
  choice: ang mga umahon
  rationale: Pinananatili ng “umahon” ang karaniwang biblikal na paglalarawan sa pagpunta mula sa Babilonia patungong Juda o Jerusalem, sa halip na gawing pangkalahatang “pumunta.”
- source_word: עִמִּי
  choice: kasama ko
  rationale: Tuwirang pinananatili ang unang panauhang tinig ni Ezra.
- source_word: בְּמַלְכוּת אַרְתַּחְשַׁסְתְּא הַמֶּלֶךְ
  choice: noong naghahari si Haring Artajerjes
  rationale: Natural na Filipino para sa panahong saklaw ng paghahari ng hari, habang pinananatili ang pangalan at titulo.
- source_word: מִבָּבֶל
  choice: mula sa Babilonia
  rationale: Karaniwang salin ng pinanggalingang lugar at sumusunod sa lohikal na ayos ng pangungusap sa Filipino.
theological_decisions: []
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “angkan” sa halip na literal na “mga ama” upang maipahayag ang yunit na panlipunan at pampamilyang tinutukoy ng idyomang Hebreo. Ang gitling na mahaba ay nililinaw na ang sumusunod na parirala ay tumutukoy sa mga taong umahon kasama ni Ezra, nang hindi inaalis ang bahagyang siksik na estruktura ng orihinal.
