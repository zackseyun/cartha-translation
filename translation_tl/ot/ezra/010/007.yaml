  text: And they made a proclamation throughout Judah and Jerusalem to all the sons of the exile[a], that they should gather in Jerusalem.
translation:
  language: tl
  text: At nagpalabas sila ng isang pahayag sa buong Juda at Jerusalem para sa lahat ng mga anak ng pagkakatapon,[a] na magtipon sila sa Jerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “lahat ng mga anak ng pagkakatapon.” Maaari ring isalin na “lahat ng mga ipinatapon” o “lahat ng mga nakabalik mula sa pagkakatapon.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲבִירוּ קוֹל
  choice: nagpalabas sila ng isang pahayag
  rationale: Ang Hiphil ng עבר kasama ng קוֹל ay isang idyomang tumutukoy sa pagpapalaganap ng isang pampublikong pabatid. Likas sa modernong Filipino ang “nagpalabas ng isang pahayag” at napananatili nito ang pormal at pasanhing diwa.
- source_word: בִּיהוּדָה וִירוּשָׁלִַם
  choice: sa buong Juda at Jerusalem
  rationale: Ipinahihiwatig ng ב ang saklaw na pinaglaganapan ng pahayag; ipinapakita ng “sa buong” ang distributibong diwa nang natural sa Filipino.
- source_word: לְכֹל בְּנֵי הַגּוֹלָה
  choice: para sa lahat ng kabilang sa pamayanan ng mga ipinatapon
  rationale: Literal itong “sa lahat ng mga anak ng pagkakatapon,” ngunit ang parirala ay katawagan sa pamayanang nabuo ng mga ipinatapon, sa konteksto ay yaong mga nakabalik. Iniiwasan ng salin ang di-likas at maaaring mapanlinlang na literalismong “mga anak,” habang hindi tahasang idinaragdag sa pangunahing teksto ang “nakabalik.”
- source_word: לְהִקָּבֵץ
  choice: na magtipon sila
  rationale: Ang Niphal infinitive na may ל ay nagpapahayag ng nilalaman o layunin ng pahayag. Ang “na magtipon sila” ay malinaw at natural na panawagan sa Filipino.
- source_word: יְרוּשָׁלִָם
  choice: sa Jerusalem
  rationale: Bagaman walang tahasang pang-ukol sa Hebreo, hinihingi ng pandiwang “magtipon” sa Filipino ang lokatibong “sa” para sa lugar ng pagtitipon.
