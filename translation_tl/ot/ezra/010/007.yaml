translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “pamayanan ng mga ipinatapon” upang maipahayag ang kolektibong diwa ng בני הגולה nang hindi ipinalalagay na literal na mga anak lamang ang tinutukoy; pinanatili sa talababa ang literal na anyo at ang posibleng paglilinaw na sila ay mga nakabalik mula sa pagkakatapon.
