base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/021.yaml
  text: 'And from the sons of Harim: Maaseiah[a], Elijah, Shemaiah, Jehiel, and Uzziah.'
translation:
  language: tl
  text: 'At mula sa mga anak ni Harim: sina Maaseias[a], Elias, Semaias, Jehiel, at Uzias.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, sa mas pormal na pagkakasalin, “At sa mga anak ni Harim.” Ipinakikita ng kayariang Hebreo na isa pa itong pangkat ng pamilya sa talaan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מִ/בְּנֵי
  choice: At mula sa mga anak ni
  rationale: Pinananatili nito ang pang-ugnay na ו at ang diwang partitivo ng מִן, habang natural na ipinakikilalang isa itong panibagong pangkat ng pamilya sa talaan.
- source_word: חָרִם
  choice: Harim
  rationale: Pangalan ng tao o angkan; pinanatili sa anyong transliterado na pamilyar sa modernong saling Filipino.
- source_word: מַעֲשֵׂיָה
  choice: Maaseias
  rationale: Ginamit ang tradisyonal at madaling makilalang anyong Filipino ng pangalang Hebreo.
- source_word: וְ/אֵלִיָּה
  choice: Elias
  rationale: Ginamit ang nakasanayang anyong Filipino ng pangalang biblikal; ang pang-ugnay ay likas na kinakatawan sa pagkakasunod ng talaan.
- source_word: וּֽ/שְׁמַֽעְיָה
  choice: Semaias
  rationale: Ginamit ang tradisyonal na anyong Filipino upang maging malinaw at madaling bigkasin.
- source_word: וִ/יחִיאֵל
  choice: Jehiel
  rationale: Pinanatili ang karaniwang anyong biblikal ng pangalan, na malinaw sa mambabasang Filipino.
- source_word: וְ/עֻזִיָּה
  choice: Uzias
  rationale: Ginamit ang nakasanayang anyong Filipino ng pangalang Uzziah; inilagay ang “at” bago ang huling pangalan ayon sa natural na talaan sa Filipino.
theological_decisions: []
translation_notes:
  register: Makabago, marangal, at payak na Filipino. Ginamit ang “sina” upang natural na ipakilala ang talaan ng mga pangalan, at pinanatili ang diwang partitivo ng Hebreo sa “mula sa mga anak ni.”
