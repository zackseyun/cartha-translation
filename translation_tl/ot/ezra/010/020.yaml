- source_word: וּ/מִ/בְּנֵי
  choice: At mula sa mga anak ni
  rationale: Pinananatili nito ang pang-ugnay, ang diwa ng pinagmulan o pangkat na ipinahihiwatig ng מִן, at ang pormulang pangangkanan ng בְּנֵי sa talaan.
- source_word: אִמֵּר
  choice: Imer
  rationale: Isinalin sa karaniwang anyong Tagalog ang pangalan ng angkan ng mga pari, na may iisang m ayon sa likas na baybay sa Filipino.
- source_word: חֲנָנִי
  choice: Hanani
  rationale: Tuwirang transliterasyon ng pangalang pantangi na angkop sa baybay ng Filipino.
- source_word: וּ/זְבַדְיָה
  choice: at Zebadias
  rationale: Ang prefiks na וּ ay isinaling “at,” at ang pangalan ay ginamit sa nakaugaliang anyong Tagalog na Zebadias.
