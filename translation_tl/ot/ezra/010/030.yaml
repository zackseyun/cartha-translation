base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/030.yaml
  text: 'And from the sons of Pahath-moab: Adna, Chelal, Benaiah, Maaseiah, Mattaniah, Bezalel, Binnui, and Manasseh.'
translation:
  language: tl
  text: 'At mula sa mga anak ni Pahat-Moab: sina Adna, Kelal, Benaya, Maaseya, Matanias, Bezalel, Binui, at Manases.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/מִ/בְּנֵי
  choice: At mula sa mga anak ni
  rationale: Tuwirang ipinapakita ang pang-ugnay, ang kahulugang “mula sa,” at ang anyong pangangkan ng בְּנֵי; natural din ito bilang panimula ng isang pangkat sa talaan.
- source_word: פַּחַת מוֹאָב
  choice: Pahat-Moab
  rationale: Isinalin-titik bilang pangalan ng angkan; pinanatili ang gitling upang ipakita ang tambalang pangalan.
- source_word: עַדְנָא
  choice: Adna
  rationale: Malapit na transliterasyon ng pangalang Hebreo na angkop sa baybay at bigkas sa Filipino.
- source_word: וּ/כְלָל
  choice: Kelal
  rationale: Ang unang katinig na כ ay kinakatawan ng K sa modernong Filipino, sa halip na ng Ingles na “Ch.”
- source_word: בְּנָיָה
  choice: Benaya
  rationale: Filipinong transliterasyon na malinaw na kumakatawan sa Hebreong pangalan.
- source_word: מַעֲשֵׂיָה
  choice: Maaseya
  rationale: Pinananatili ang magkahiwalay na mga patinig at ang hulaping -ya ng pangalang Hebreo nang hindi ginagamit ang kumbensiyong Ingles na -iah.
- source_word: מַתַּנְיָה
  choice: Matanias
  rationale: Ginamit ang pamilyar na anyong Filipino ng pangalan habang nananatiling makikilala ang Hebreong מַתַּנְיָה.
- source_word: בְצַלְאֵל
  choice: Bezalel
  rationale: Malapit at madaling bigkasing transliterasyon sa Filipino.
- source_word: וּ/בִנּוּי
  choice: Binui
  rationale: Malapit na transliterasyon; hindi kailangang katawanin sa baybay-Filipino ang pagdodoble ng katinig sa Ingles.
- source_word: וּ/מְנַשֶּׁה
  choice: at Manases
  rationale: Ginamit ang pamilyar na anyong Filipino at isinalin ang pang-ugnay na וּ bilang “at” sa huling pangalan.
theological_decisions: []
translation_notes:
  register: Makabagong, marangal, at payak na Filipino. Pinanatili ang estruktura ng talaang pangangkan at ginamit ang “sina” bago ang hanay ng mga pangalan upang maging natural sa Tagalog. Walang idinagdag na paliwanag na wala sa tekstong Hebreo.
