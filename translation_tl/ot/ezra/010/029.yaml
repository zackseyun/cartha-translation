  yaml_path: translation/ot/ezra/010/029.yaml
  text: 'And from the sons of Bani: Meshullam[a], Malluk, Adaiah, Jashub, Sheal[b], and Jeremoth.'
translation:
  language: tl
  text: 'At mula sa mga anak ni Bani: sina Meshulam, Maluk[a], Adaya, Jashub, Sheal, at Jeremot.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang pangalang Maluk ay binabaybay ding Maluch sa ilang salin.
    reason: lexical_alternative
  - marker: b
    text: Ang Jeremot ay maaaring ibang pagbigkas o anyo ng pangalan sa ilang tradisyon; maaari rin itong basahin bilang Ramot.
    reason: textual_variant
lexical_decisions:
- source_word: וּ/מִ/בְּנֵי בָּנִי
  choice: Mula naman sa mga anak ni Bani
  rationale: Pinananatili ng “mga anak” ang pormal na pananalita ng talaangkanan, habang likas sa Filipino ang “mula naman sa” bilang pambungad sa kasunod na pangkat sa listahan.
- source_word: מְשֻׁלָּם
  choice: Meshulam
  rationale: Transliterasyon ng pangalang pantangi ayon sa bigkas ng Hebreo.
- source_word: מַלּוּךְ
  choice: Maluk
  rationale: Tuwirang transliterasyon sa baybay na madaling basahin sa Filipino; binanggit sa talababa ang alternatibong anyo ng pangalan.
- source_word: וַ/עֲדָיָה
  choice: Adaya
  rationale: Ang pangalang pantangi ay tinransliterasyon, at ang pangatnig ay isinama sa natural na bantas ng listahang Filipino.
- source_word: יָשׁוּב
  choice: Jashub
  rationale: Pinananatili ang kinikilalang anyo ng pangalang Hebreo sa halip na ituring itong karaniwang pandiwa.
- source_word: וּ/שְׁאָל
  choice: Sheal
  rationale: Sinusunod ang Masoretikong pagbigkas ng pangalang pantangi; ang pangatnig ay ipinahayag sa daloy ng listahan.
- source_word: ירמות
  choice: Jeremot
  rationale: Tinutumbasan ang anyong-pangalan na Jeremoth sa baybay na angkop sa Filipino. Dahil walang mga tanda ng patinig ang anyo rito at may ibang tradisyon ng pagbasa o anyo ng pangalan, pinananatili ang pag-aalinlangan sa talababa.
