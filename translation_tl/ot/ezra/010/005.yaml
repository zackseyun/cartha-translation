  source_fidelity: 'Tumpak ang salin sa Hebreo: ang וַיַּקָם ay naipahayag bilang “tumayo,” ang Hiphil ng שׁבע bilang “pinanumpa,” at ang pangwakas na Niphal bilang “nanumpa sila.” Wasto ring saklaw ng “mga pinuno ng mga pari, ang mga Levita, at ang buong Israel” ang tatlong pangkat na nasa teksto. Ang “bagay na ito” ay isang angkop na kontekstuwal na salin ng כַּדָּבָר הַזֶּה nang hindi ipinipilit na ito ay salita lamang.'
  naturalness: Malinaw, makabago, at marangal ang Filipino. Natural ang ayos ng mga pangkat at ang konstruksyong “pinanumpa niya ... na gawin.” Ang “Kaya” ay katanggap-tanggap sa pagsulong ng salaysay sa konteksto ng naunang panawagan.
  terminology: Ang “mga pinuno ng mga pari” ay tumpak at hindi walang-batay na teknikal na titulo para sa שָׂרֵי הַכֹּהֲנִים. Wasto ang “mga Levita” at “buong Israel.” Ang talababa ay maayos na nagpapakita ng saklaw na leksikal ng דָּבָר.
