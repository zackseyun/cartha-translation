base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/005.yaml
  text: So Ezra arose and made the chief priests[a], the Levites, and all Israel swear to do according to this word, and they swore.
translation:
  language: tl
  text: Kaya tumayo si Ezra at pinanumpa niya ang mga pinuno ng mga pari, ang mga Levita, at ang buong Israel na gawin ang bagay na ito[a]. At nanumpa sila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ayon sa salitang ito” o “ayon sa panukalang ito.” Ang salitang Hebreo ay maaaring tumukoy sa salitang sinabi o sa usaping tinatalakay.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: tumayo
  rationale: Ang wayyiqtol ng קום ay nagsasaad ng pagtayo ni Ezra upang kumilos; natural at tuwiran ang “tumayo” sa salaysay.
- source_word: וַיַּשְׁבַּע
  choice: pinanumpa niya
  rationale: 'Pinananatili ng causative na anyong Filipino ang Hiphil: si Ezra ang nagpapanumpa sa kanila.'
- source_word: שָׂרֵי הַכֹּהֲנִים
  choice: mga pinuno ng mga pari
  rationale: Tuwirang inilalarawan ang mga pangunahing lider sa hanay ng mga pari, nang hindi ipinapantay ang parirala sa isang posibleng teknikal na titulong panrelihiyon.
- source_word: הַלְוִיִּם
  choice: mga Levita
  rationale: Karaniwang katawagang Filipino para sa pangkat na לְוִיִּם.
- source_word: וְכָל יִשְׂרָאֵל
  choice: at ang buong Israel
  rationale: Pinananatili ang kolektibong katawagang pangtipan sa halip na gawing “lahat ng Israelita.”
- source_word: לַעֲשׂוֹת
  choice: na gawin
  rationale: Simple at malapit sa malawak na diwa ng עשה sa konteksto ng pagsasakatuparan ng napag-usapan.
- source_word: כַּדָּבָר הַזֶּה
  choice: ang bagay na ito
  rationale: Sa konteksto, tumutukoy ang דָּבָר sa panukala o usaping naunang sinabi. Natural sa Filipino ang “bagay na ito,” habang inilalahad sa talababa ang leksikal na lawak.
- source_word: וַיִּשָּׁבֵעוּ
  choice: At nanumpa sila
  rationale: Pinananatili ang tahasang pag-uulit ng ugat שׁבע at ang solemneng tugon ng mga pinanumpa.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mga pinuno ng mga pari” upang maging tumpak at maiwasan ang posibleng teknikal na pakahulugan ng “mga punong pari.”
