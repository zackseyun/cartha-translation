base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/008.yaml
  text: And everyone who does not come within three days[a], according to the counsel of the officials and the elders, all his property shall be forfeited, and he himself shall be separated from the assembly of the exiles.
translation:
  language: tl
  text: At ang sinumang hindi dumating sa loob ng tatlong araw, ayon sa pasiya ng mga pinuno at ng mga matatanda, ang lahat ng kanyang ari-arian ay itatalaga sa paglipol[a], at siya mismo ay ihihiwalay sa kapulungan ng mga ipinatapon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kukumpiskahin” o “isasailalim sa pagbabawal.” Ang pandiwang Hebreo ay tumutukoy sa paglalagay sa ilalim ng חרם, isang pagbabawal o pagtatalagang hindi na mababawi na maaaring mangahulugan ng paglipol o pagkumpiska.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֹל אֲשֶׁר לֹא יָבוֹא
  choice: At ang sinumang hindi dumating
  rationale: Ipinahahayag nito ang pangkalahatang kundisyon at pinananatili ang diwa ng pagdating bilang pagtugon sa ipinatawag na pagtitipon.
- source_word: לִשְׁלֹשֶׁת הַיָּמִים
  choice: sa loob ng tatlong araw
  rationale: Malinaw na ipinahihiwatig ng parirala ang takdang panahon para sa pagsunod.
- source_word: כַּעֲצַת
  choice: ayon sa pasiya ng
  rationale: Maaaring mangahulugan ang עֵצָה ng payo o pasiya; sa kontekstong administratibo, ang “pasiya” ay natural at nagpapakita ng awtoridad ng mga namumuno.
- source_word: הַשָּׂרִים וְהַזְּקֵנִים
  choice: mga pinuno at ng mga matatanda
  rationale: Ang “mga pinuno” ay malinaw na katumbas sa kontekstong pampamahalaan, samantalang ang “mga matatanda” ay nagpapanatili sa kinikilalang pangkat ng mga nakatatanda sa pamayanan.
- source_word: יָחֳרַם
  choice: ilalaan sa paglipol
  rationale: Pinananatili nito ang teknikal at matinding diwa ng חרם—ang di-mababawing pagtatalaga sa ilalim ng pagbabawal, na maaaring humantong sa paglipol o pagkumpiska—sa halip na paliitin agad ang kahulugan sa modernong legal na pagkumpiska.
- source_word: כָּל רְכוּשׁוֹ
  choice: ang lahat ng kanyang ari-arian
  rationale: Ang רְכוּשׁ ay tumutukoy sa mga pag-aari o ari-arian; ang piniling salita ay angkop sa legal na kaparusahan.
- source_word: וְהוּא יִבָּדֵל
  choice: at siya mismo ay ihihiwalay
  rationale: Pinananatili ng “siya mismo” ang tahasang panghalip at diin ng Hebreo, at hindi ipinapasok ang mas huling institusyonal na konsepto ng ekskomunikasyon.
- source_word: מִקְּהַל הַגּוֹלָה
  choice: sa kapulungan ng mga ipinatapon
  rationale: Ang “kapulungan” ay tuwirang katumbas ng קהל at ang “mga ipinatapon” ay nagpapanatili sa pagtukoy sa pamayanang nagmula sa pagkakatapon.
theological_decisions:
- issue: Kahulugan ng kaparusahang חרם sa ari-arian
  choice: ilalaan sa paglipol
  alternative: kukumpiskahin; ilalagay sa ilalim ng pagbabawal
  rationale: Teknikal ang חרם at nagpapahiwatig ng di-mababawing pagtatalaga sa ilalim ng pagbabawal, na maaaring magsangkot ng paglipol o pagkumpiska. Pinananatili ng pangunahing salin ang bigat at tensiyong ito, habang inilalahad sa talababa ang posibleng praktikal na kahulugan.
- issue: Uri ng pagkakahiwalay sa pamayanan
  choice: ihihiwalay sa kapulungan
  alternative: aalisin sa pamayanan; ititiwalag
  rationale: Pagkakahiwalay lamang sa kapulungan ng mga ipinatapon ang tahasang sinasabi ng teksto. Iniiwasan ng salin ang pagpasok ng mas huling terminong panrelihiyon o institusyonal.
translation_notes:
  register: Makabago at marangal na Filipino, na may malinaw na wikang legal-pampamayanan. Pinanatili ang teknikal na bigat ng חרם sa pangunahing teksto at ipinaliwanag ang saklaw nito sa talababa.
