revisions:
- from: At ang sinumang hindi dumating sa loob ng tatlong araw, ayon sa pasiya ng mga pinuno at ng mga matatanda, ang lahat ng kanyang ari-arian ay ilalaan sa paglipol[a], at siya mismo ay ihihiwalay sa kapulungan ng mga ipinatapon.
  to: At ang sinumang hindi dumating sa loob ng tatlong araw, ayon sa pasiya ng mga pinuno at ng mga matatanda, ang lahat ng kanyang ari-arian ay itatalaga sa paglipol[a], at siya mismo ay ihihiwalay sa kapulungan ng mga ipinatapon.
  rationale: Isang limitadong paglilinaw ang ginawa sa salin ng יָחֳרַם upang ang ari-arian, hindi isang ipinahihiwatig na gamit nito, ang malinaw na siyang itinalaga sa paglipol. Pinanatili ng pangunahing teksto ang literal at mabigat na diwa ng חרם; hindi nito isinasara ang posibilidad ng pagkumpiska, na nasa talababa. Walang binagong kahulugan sa iba pang bahagi ng talata.
