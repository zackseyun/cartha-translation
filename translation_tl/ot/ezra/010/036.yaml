- source_word: וַנְיָה
  choice: Vania
  rationale: Pangalang pantangi; tinumbasan ayon sa bigkas at baybay na natural sa Filipino. Ang unang waw ay kinakatawan ng V, at ang hulíng -yah ay pinasimple bilang -ia.
- source_word: מְרֵמוֹת
  choice: Meremot
  rationale: Pangalang pantangi; ginamit ang t para sa hulíng taw, alinsunod sa mas tuwirang transliterasyon at karaniwang baybay sa Filipino.
- source_word: אֶלְיָשִׁיב
  choice: Eliashib
  rationale: Pangalang pantangi; pinanatili ang nakikilalang anyong Eliashib, na malapit sa Hebreong pangalan at madaling basahin sa Filipino.
