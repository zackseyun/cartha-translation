base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/015.yaml
  text: Only Jonathan son of Asahel and Jahzeiah son of Tikvah stood against this[b][a], and Meshullam and Shabbethai the Levite supported them.
translation:
  language: tl
  text: Tanging sina Jonatan na anak ni Asahel at Yahzeya[a] na anak ni Tikva ang tumutol dito,[b] at sinuportahan sila nina Mesulam at Sabtai na Levita.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Yahazeya.”
    reason: lexical_alternative
  - marker: b
    text: O, “ang nangasiwa sa bagay na ito.”
    reason: textual_or_lexical_ambiguity
  - marker: c
    text: O, “tinulungan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Tanging
  rationale: Naglilimita ito sa mga eksepsiyon sa naunang pangkalahatang pagsang-ayon; natural na ipinahahayag ng “tanging” ang puwersang ito.
- source_word: יוֹנָתָן בֶּן עֲשָׂהאֵל
  choice: Jonatan na anak ni Asahel
  rationale: Isinalin nang tuwiran ang ugnayang ipinahahayag ng בֶּן at ginamit ang karaniwang anyong Filipino ng mga pangalan.
- source_word: יַחְזְיָה בֶן תִּקְוָה
  choice: Yahzeya na anak ni Tikva
  rationale: Malapit ang “Yahzeya” sa anyong Masoretiko ng pangalan; inilagay sa talababa ang pamilyar na alternatibong baybay.
- source_word: עָמְדוּ עַל זֹאת
  choice: ang tumutol dito
  rationale: Sa konteksto, pinakamalamang na tumutukoy ang idyoma sa paninindigan laban sa panukala. Ginamit ang malinaw at natural na “tum tutol dito” habang pinananatili sa talababa ang ibang posibleng pagbasa.
- source_word: וּמְשֻׁלָּם וְשַׁבְּתַי הַלֵּוִי
  choice: at ... nina Mesulam at Sabtai na Levita
  rationale: Sa pagkakasunod ng Hebreo, ang titulong “Levita” ay pinakamalapit at pinakaangkop na tumutukoy kay Sabtai lamang.
- source_word: עֲזָרֻם
  choice: sinuportahan sila
  rationale: Ang pandiwa ay nangangahulugang tumulong o umalalay sa kanila; ipinahahayag ng “sinuportahan” ang pagpanig sa kanilang tindig sa kontekstong ito.
theological_decisions:
- issue: Kung ang dalawang lalaki ay tumutol sa panukala o nangasiwa sa usapin
  choice: tum tutol dito
  alternative: nangasiwa sa bagay na ito
  rationale: Mas angkop sa daloy ng konteksto ang pagsalungat, ngunit maaaring unawain ang עמד על bilang pagtayo sa ibabaw o pangangasiwa sa isang bagay; kaya hindi inalis ang alternatibo.
translation_notes:
  register: 'Makabago, malinaw, at marangal na Filipino. Ginamit ang “sina/nina” para sa natural na pagbanggit sa magkakasamang pangalan at pinanatiling maikli ang pangungusap. Itama sa pinal na teksto ang di-sinasadyang espasyo sa lexical at theological rationale: ang wastong anyo ay “tumutol dito.”'
