  source_fidelity: 'Ang pangunahing salin ay tumpak: ang אַךְ ay wastong naipahayag sa “Tanging,” ang עָמְדוּ עַל־זֹאת ay natural na “tumutol dito” sa konteksto, at ang עֲזָרֻם ay wastong naipahayag bilang pagsuporta/pagtulong. Napananatili rin ng talababa ang makabuluhang alternatibong pagkaunawa sa idyoma. Gayunman, ang alternatibong baybay na “Yahazias” ay hindi angkop na alternatibo sa Yahzeya/Jahzeiah na nasa Hebreo at audit trail.'
