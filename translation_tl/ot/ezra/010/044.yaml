translation:
  language: tl
  text: Lahat ng ito ay nag-asawa ng mga banyagang babae, at ang ilan sa kanila ay nagkaroon ng mga anak sa mga asawang iyon.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “at may mga asawa sa kanila, at naglagay sila ng mga anak.” Maikli at medyo mahirap unawain ang Hebreo sa dulo ng talata.'
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “mga anak na lalaki”; maaari rin itong tumukoy sa mga anak o supling sa pangkalahatan.
    reason: lexical_alternative
lexical_decisions:
- source_word: נשא/י
  choice: nag-asawa
  rationale: Sa pariralang may layong נָשִׁים, ang נשׂא ay tumutukoy sa pagkuha ng babae bilang asawa. Likas at malinaw sa makabagong Tagalog ang “nag-asawa.”
- source_word: נָשִׁים נָכְרִיּוֹת
  choice: mga banyagang babae
  rationale: Ipinahihiwatig ng נָכְרִיּוֹת na ang mga babae ay mula sa labas ng sambayanan. Pinananatili ng “mga banyagang babae” ang pagkakaibang ito nang hindi gumagamit ng lipas o mapanghusgang pananalita.
- source_word: וְיֵשׁ מֵהֶם
  choice: at ang ilan sa kanila
  rationale: Natural na katumbas sa Tagalog ng eksistensiyal na יֵשׁ kasama ng מֵהֶם, at malinaw na tumutukoy sa isang bahagi ng naunang pangkat.
- source_word: נָשִׁים
  choice: mga asawang iyon
  rationale: Bagaman “mga babae” ang payak na kahulugan, hinihingi ng konteksto rito ang relasyong pangmag-asawa. Idinagdag ang “iyon” upang malinaw na tumukoy sa mga banyagang babaeng nabanggit na.
- source_word: וַיָּשִׂימוּ בָּנִים
  choice: nagkaroon ng mga anak
  rationale: Mahirap at maikli ang Hebreong pananalita; hindi natural ang literal na “naglagay ng mga anak.” Ipinahahayag ng salin ang malamang na diwa na nagkaroon ng supling ang ilan sa mga pag-aasawang ito, habang inilalahad sa talababa ang kahirapan ng teksto.
- source_word: בָּנִים
  choice: mga anak
  rationale: Literal itong “mga anak na lalaki,” ngunit maaari itong tumukoy sa mga anak o supling sa pangkalahatan. Ang “mga anak” ang natural na salin sa konteksto; nasa talababa ang mas literal na anyo.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang “mga banyagang babae” upang sundan ang anyo ng unang parirala, at gumamit ng “mga asawang iyon” sa ikalawang sugnay para sa likas na daloy. Hindi itinago ang tekstuwal at leksikal na hirap ng huling parirala; ipinaliwanag ito sa talababa.
