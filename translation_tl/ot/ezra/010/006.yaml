  text: וַ/יָּ֣קָם עֶזְרָ֗א מִ/לִּ/פְנֵי֙ בֵּ֣ית הָֽ/אֱלֹהִ֔ים וַ/יֵּ֕לֶךְ אֶל לִשְׁכַּ֖ת יְהוֹחָנָ֣ן בֶּן אֶלְיָשִׁ֑יב וַ/יֵּ֣לֶךְ שָׁ֗ם לֶ֤חֶם לֹֽא אָכַל֙ וּ/מַ֣יִם לֹֽא שָׁתָ֔ה כִּ֥י מִתְאַבֵּ֖ל עַל מַ֥עַל הַ/גּוֹלָֽה־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/006.yaml
  text: Then Ezra rose from before the house of God and went to the chamber of Jehohanan son of Eliashib[a]. He went there and ate no bread and drank no water[c][b], because he was mourning over the unfaithfulness of the exiles.
translation:
  language: tl
  text: Pagkatapos, tumindig si Ezra mula sa harap ng bahay ng Diyos at pumunta sa silid ni Jehohanan na anak ni Eliasib.[a] Pumunta siya roon at hindi kumain ng tinapay ni uminom ng tubig, sapagkat nagluluksa siya dahil sa pagtataksil[b] ng mga bumalik mula sa pagkabihag.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Johanan na anak ni Eliasib.”
    reason: lexical_alternative
  - marker: b
    text: Ang “pagtataksil” ay maaari ring isaling “kawalang-katapatan.”
    reason: lexical_alternative
  - marker: c
    text: Tumutukoy ito sa pamayanan ng mga dating ipinatapon na nakabalik na sa lupain.
    reason: cultural_note
lexical_decisions:
- source_word: מִלִּפְנֵי בֵּית הָאֱלֹהִים
  choice: mula sa harap ng bahay ng Diyos
  rationale: Pinananatili ang spatial na idyoma at ang literal na katawagang “bahay ng Diyos,” na malinaw namang tumutukoy sa templo sa konteksto.
- source_word: לִשְׁכַּת
  choice: silid
  rationale: Natural sa modernong Filipino at angkop sa isang kuwarto sa loob ng templong kompleks; iniiwasan ang mas arkaikong “bulwagan.”
- source_word: יְהוֹחָנָן בֶּן אֶלְיָשִׁיב
  choice: Jehohanan na anak ni Eliasib
  rationale: Ang “Jehohanan” ay malapit sa anyong Hebreo, samantalang ang “Eliasib” ay natural na transliterasyon sa Filipino.
- source_word: וַיֵּלֶךְ שָׁם
  choice: Pumunta siya roon
  rationale: Pinananatili ang kapansin-pansing pag-uulit ng pandiwang “pumunta” nang hindi ipinapalagay na “nanatili” o “pumasok” ang kahulugan.
- source_word: לֶחֶם לֹא אָכַל וּמַיִם לֹא שָׁתָה
  choice: hindi kumain ng tinapay ni uminom ng tubig
  rationale: Pinananatili ang kongkretong mga layon na “tinapay” at “tubig” at ang pormulang nagpapahiwatig ng ganap na pag-aayuno.
- source_word: מִתְאַבֵּל
  choice: nagluluksa
  rationale: Ipinahahayag ang taimtim at nakikitang pagdadalamhati na kaugnay ng pag-aayuno.
- source_word: מַעַל
  choice: pagtataksil
  rationale: Ipinakikita ang mabigat na diwa ng paglabag sa katapatan, kabilang ang kontekstong tipan, nang hindi nililimitahan sa legal na pagkakasala lamang.
- source_word: הַגּוֹלָה
  choice: mga bumalik mula sa pagkabihag
  rationale: Sa Ezra, tumutukoy ito sa pamayanang dating ipinatapon at nakabalik na; nililinaw ito sa Filipino sa halip na sabihing “mga bihag,” na maaaring magpahiwatig na bihag pa rin sila.
theological_decisions:
- issue: Kahulugan ng מַעַל bilang paglabag sa katapatan sa konteksto ng tipan
  choice: pagtataksil
  alternative: kawalang-katapatan; pagtataksil sa tipan
  rationale: Ang “pagtataksil” ay nagpapanatili sa bigat ng sadyang paglabag sa katapatan. Hindi idinaragdag sa teksto ang salitang “tipan,” bagaman mahalaga ang gayong konteksto.
- issue: Kung isasalin ang בֵּית הָאֱלֹהִים bilang “bahay ng Diyos” o “templo ng Diyos”
  choice: bahay ng Diyos
  alternative: templo ng Diyos
  rationale: Nauunawaan ang literal na ekspresyon sa Filipino at pinananatili nito ang pormulasyon ng Hebreo nang hindi ikinukubli na templo ang tinutukoy.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang bahagyang pag-uulit at kongkretong pananalita ng Hebreo, habang nilinaw ang historikal na kahulugan ng הַגּוֹלָה sa mismong teksto at talababa.
