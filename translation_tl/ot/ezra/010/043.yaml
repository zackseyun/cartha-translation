  text: מִ/בְּנֵ֖י נְב֑וֹ יְעִיאֵ֤ל מַתִּתְיָה֙ זָבָ֣ד זְבִינָ֔א ידו וְ/יוֹאֵ֖ל בְּנָיָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/043.yaml
  text: 'From the sons of Nebo: Jeiel[a], Mattithiah, Zabad, Zebina, Jaddai, Joel, and Benaiah.'
translation:
  language: tl
  text: 'Mula sa mga anak ni Nebo: sina Jeiel, Matitias, Zabad, Zebina, Ido[a], Joel, at Benaias.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hindi tiyak ang pangalang Hebreo na isinaling “Ido”; maaari rin itong baybayin na Jadai o Jedo.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִ/בְּנֵי
  choice: Mula sa mga anak ni
  rationale: Ipinahahayag ng מִן na ang mga pangalang kasunod ay kabilang sa isang pangkat sa mas malaking talaan; natural sa Filipino ang “Mula sa mga anak ni.”
- source_word: נְבוֹ
  choice: Nebo
  rationale: Isinalin bilang transliterasyon ng pangalang pantangi.
- source_word: יְעִיאֵל
  choice: Jeiel
  rationale: Malapit na transliterasyon ng pangalang Hebreo at nakikilala sa tradisyong Filipino.
- source_word: מַתִּתְיָה
  choice: Matitias
  rationale: Ginamit ang natural at nakikilalang anyong Filipino ng pangalang Hebreo.
- source_word: זָבָד
  choice: Zabad
  rationale: Tuwirang transliterasyon ng pangalang pantangi.
- source_word: זְבִינָא
  choice: Zebina
  rationale: Tuwirang transliterasyon na angkop sa bigkas at baybay sa Filipino.
- source_word: ידו
  choice: Ido[a]
  rationale: Hindi tiyak ang anyo ng pangalang ito. Ang “Ido” ay malapit sa nakasulat na mga katinig at natural na transliterasyon sa Filipino; inilalahad sa talababa ang ibang posibleng anyo.
- source_word: וְ/יוֹאֵל
  choice: Joel
  rationale: Isinalin ang pangalang pantangi sa nakagawiang anyong Filipino; ang pang-ugnay ay inilapat nang natural sa huling pangalan sa talaan.
- source_word: בְּנָיָה
  choice: Benaias
  rationale: Ginamit ang nakikilalang anyong Filipino ng pangalang Hebreo.
theological_decisions: []
translation_notes:
  register: Payak ngunit marangal na modernong Filipino. Ginamit ang “sina” upang natural na ipakilala ang talaan ng mga tao. Inilipat ang pang-ugnay sa huling pangalan alinsunod sa natural na pagbibilang sa Filipino, nang hindi binabago ang mga kasapi ng talaan.
