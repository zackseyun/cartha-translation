reference: Ezra 10:9
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יִּקָּבְצ֣וּ כָל אַנְשֵֽׁי יְהוּדָה֩ וּ/בִנְיָמִ֨ן יְרוּשָׁלִַ֜ם לִ/שְׁלֹ֣שֶׁת הַ/יָּמִ֗ים ה֛וּא חֹ֥דֶשׁ הַ/תְּשִׁיעִ֖י בְּ/עֶשְׂרִ֣ים בַּ/חֹ֑דֶשׁ וַ/יֵּשְׁב֣וּ כָל הָ/עָ֗ם בִּ/רְחוֹב֙ בֵּ֣ית הָ/אֱלֹהִ֔ים מַרְעִידִ֥ים עַל הַ/דָּבָ֖ר וּ/מֵ/הַ/גְּשָׁמִֽים־־׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/009.yaml
  text: So all the men of Judah and Benjamin gathered in Jerusalem within the three days[a]. It was the ninth month, on the twentieth day of the month. And all the people sat in the open square of the house of God[c][b], trembling because of this matter and because of the heavy rain.
translation:
  language: tl
  text: Kaya nagtipon sa Jerusalem ang lahat ng kalalakihan ng Juda at Benjamin sa loob ng tatlong araw[a]. Iyon ay ikadalawampung araw ng ikasiyam na buwan. Umupo ang buong bayan[b] sa liwasan ng bahay ng Diyos[c], na nanginginig dahil sa usaping ito at sa ulan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa itinakdang tatlong araw.”
    reason: Ipinapakita ng konteksto na palugit o takdang panahon ang tatlong araw.
  - marker: b
    text: Sa Hebreo, “lahat ng bayan.” Ang naunang pananalita ay tahasang tumutukoy sa “lahat ng kalalakihan ng Juda at Benjamin,” kaya malamang na sila o ang mga lalaking kinatawan ang tinutukoy rito.
    reason: Nililinaw ang pagbabago mula sa panlalaking parirala tungo sa kolektibong katawagan nang hindi inaalis ang posibilidad ng kontekstuwal na saklaw.
  - marker: c
    text: Maaari ring “sa liwasan sa harap ng bahay ng Diyos.” Ang Hebreo ay tumutukoy sa isang maluwang at bukas na lugar, hindi kinakailangang sa panloob na patyo.
    reason: Pinananatili ang posibleng lokasyong ipinahihiwatig ng רְחוֹב nang hindi labis na tinutukoy ang arkitektura.
lexical_decisions:
- source_word: וַיִּקָּבְצוּ
  choice: nagtipon
  rationale: Ang Niphal ng קבץ ay tumutukoy sa sama-samang pagtitipon; natural at tuwiran sa modernong Tagalog ang “nagtipon.”
- source_word: כָל אַנְשֵׁי יְהוּדָה וּבִנְיָמִן
  choice: ang lahat ng kalalakihan ng Juda at Benjamin
  rationale: Tahasan ang panlalaking anyo ng אַנְשֵׁי (“mga lalaki ng”), kaya pinanatili ang kasarian sa halip na gawing pangkalahatang “mga tao.”
- source_word: לִשְׁלֹשֶׁת הַיָּמִים
  choice: sa loob ng tatlong araw
  rationale: Ipinahihiwatig ng parirala ang pagsunod sa naunang itinakdang palugit na tatlong araw.
- source_word: הוּא חֹדֶשׁ הַתְּשִׁיעִי בְּעֶשְׂרִים בַּחֹדֶשׁ
  choice: Iyon ay ikadalawampung araw ng ikasiyam na buwan
  rationale: Natural na pormula ng petsa sa Tagalog na tumpak na pinagsasama ang araw at buwan.
- source_word: וַיֵּשְׁבוּ
  choice: Umupo
  rationale: Tuwirang salin ng ישׁב sa sunod-sunod na salaysay.
- source_word: בִּרְחוֹב בֵּית הָאֱלֹהִים
  choice: sa liwasan ng bahay ng Diyos
  rationale: Ang רְחוֹב ay maluwang at bukás na lugar o liwasan, hindi tiyak na panloob na patyo; pinanatili rin ang karaniwang metaporang “bahay ng Diyos.”
- source_word: מַרְעִידִים
  choice: na nanginginig
  rationale: Ipinapahayag nito ang pisikal na panginginig na maaaring bunga kapuwa ng pagkabalisa at ng masamang panahon.
- source_word: עַל הַדָּבָר
  choice: dahil sa usaping ito
  rationale: Ang tiyak na הַדָּבָר ay tumutukoy sa kasalukuyang krisis na pinag-uusapan; natural sa Tagalog ang “usaping ito.”
- source_word: וּמֵהַגְּשָׁמִים
  choice: at sa malakas na ulan
  rationale: Ang pangmaramihang גְּשָׁמִים ay maaaring tumukoy sa tuloy-tuloy o pana-panahong pag-ulan; ang “malakas na ulan” ay natural na pagpapahayag ng sanhi ng panginginig sa konteksto.
theological_decisions:
- issue: Saklaw ng “lahat ng kalalakihan” at “buong bayan”
  choice: Pinanatili ang panlalaking paglalarawan sa unang sugnay at ang kolektibong “buong bayan” sa ikalawa.
  alternative: Gawing “lahat ng mga tao” ang dalawang pagtukoy.
  rationale: 'Magkaiba ang anyong Hebreo: אַנְשֵׁי ay tahasang panlalaki, samantalang הָעָם ay kolektibong “bayan.” Hindi dapat pag-isahin ang dalawang pahayag o tiyaking mga kinatawan lamang ang tinutukoy.'
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “liwasan” para sa bukás na pampublikong espasyo, “bahay ng Diyos” upang mapanatili ang Hebreong katawagan sa templo, at “kalalakihan” upang tumpak na ihatid ang gramatikal na kasarian. Inilagay ang mga talababa sa mismong kaugnay na salita o parirala.
