  text: They pledged themselves to send away their wives[a], and being guilty[b], they offered a ram from the flock for their guilt.
translation:
  language: tl
  text: Nangako silang paalisin ang kanilang mga asawa[a], at bilang mga may-sala, naghandog sila ng isang lalaking tupa mula sa kawan para sa kanilang pagkakasala.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal na salin, “ibinigay nila ang kanilang kamay,” isang idyomang Hebreo para sa taimtim na pangako o kasunduang may-bisa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ יָדָם
  choice: Nangako sila
  rationale: Literal itong “ibinigay nila ang kanilang kamay,” isang idyomang Hebreo para sa taimtim na pangako o may-bisang kasunduan. Likas at malinaw sa modernong Tagalog ang “nangako sila,” habang pinananatili ng talababa ang kongkretong larawan ng orihinal.
- source_word: לְהוֹצִיא
  choice: paalisin
  rationale: Ang Hiphil infinitive ng יצא ay nangangahulugang “papalabasin” o “paalisin.” Sa konteksto, ang “paalisin” ay tuwiran at hindi nagdaragdag ng teknikal na terminong wala sa parirala.
- source_word: נְשֵׁיהֶם
  choice: ang kanilang mga asawa
  rationale: Sa kontekstong pangmag-asawa, “mga asawa” ang malinaw na kahulugan, hindi ang mas malawak na “mga babae.”
- source_word: וַאֲשֵׁמִים
  choice: at dahil nagkasala sila
  rationale: Ipinahahayag ng salita ang kanilang pagiging may-sala. Ang “dahil nagkasala sila” ay natural sa Tagalog at malinaw na iniuugnay ang kanilang sala sa kasunod na handog.
- source_word: אֵיל צֹאן
  choice: isang lalaking tupa mula sa kawan
  rationale: Tumutukoy ito sa isang barakong tupa bilang hayop na ihahandog. Ang “lalaking tupa mula sa kawan” ay malinaw at kongkreto sa modernong Tagalog.
- source_word: עַל אַשְׁמָתָם
  choice: para sa kanilang pagkakasala
  rationale: Ipinahahayag ng parirala ang dahilan o batayan ng paghahandog. Pinananatili nitong magkaugnay ang kanilang pagkakasala at ang handog nang hindi awtomatikong ipinapasok sa pangunahing teksto ang buong teknikal na katawagang “handog para sa kasalanan.”
theological_decisions:
- issue: Kung tahasang tatawaging “handog para sa kasalanan” ang lalaking tupa sa pangunahing teksto
  choice: Isinalin bilang “naghandog sila ng isang lalaking tupa mula sa kawan para sa kanilang pagkakasala.”
  alternative: “naghandog sila ng isang lalaking tupa mula sa kawan bilang handog para sa kanilang pagkakasala.”
  rationale: Binabanggit ng Hebreo ang lalaking tupa at ang kanilang sala, ngunit walang hiwalay na pangngalan para sa “handog” sa sugnay. Isinusuplay ang pandiwang “naghandog” upang maging malinaw ang gawaing pansakripisyo, ngunit inilalagay sa talababa ang mas tahasang teknikal na pagbasa upang hindi sumobra sa mismong pagkakasabi ng teksto.
translation_notes:
  register: Gumamit ng moderno, dignificado, at madaling maunawaang Tagalog. Pinili ang “nangako” sa halip na literal ngunit di-likas na “ibinigay ang kanilang kamay,” at pinanatili sa talababa ang idyomang Hebreo. Ang “lalaking tupa” ay mas madaling maunawaan ng karaniwang mambabasa kaysa sa mas bihirang “barakong tupa.”
