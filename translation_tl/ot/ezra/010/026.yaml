translation_notes:
  register: Maikli at dignidadong estilo ng talaan. Ginamit ang “sina” bago ang magkakasunod na pangalan upang maging likas sa modernong Filipino, habang pinanatili ang pormulang “mga anak ni” at ang posibleng genealogical na lawak nito.
