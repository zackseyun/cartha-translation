base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/026.yaml
  text: 'And from the sons of Elam: Mattaniah, Zechariah, Jehiel, Abdi, Jeremoth, and Elijah.'
translation:
  language: tl
  text: 'At mula sa mga anak ni Elam: sina Matanias, Zacarias, Jehiel, Abdi, Jeremot, at Elias.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/מִ/בְּנֵי
  choice: At mula sa mga anak ni
  rationale: Pinananatili ang pormula ng Hebreo para sa pagkakabilang sa angkan. Sa konteksto ng talaan, ang “mga anak ni” ay malinaw at likas sa Filipino, bagaman maaari rin itong tumukoy sa mas malalayong inapo.
- source_word: עֵילָם
  choice: Elam
  rationale: Pangalan ng ninuno o angkan; tinumbasan sa karaniwang anyong ginagamit sa mga saling Filipino.
- source_word: מַתַּנְיָה
  choice: Matanias
  rationale: Ginamit ang nakikilalang tradisyonal na anyo ng pangalang biblikal sa Filipino.
- source_word: זְכַרְיָה
  choice: Zacarias
  rationale: Ginamit ang karaniwang anyong Filipino ng pangalang biblikal.
- source_word: וִ/יחִיאֵל
  choice: Jehiel
  rationale: Isinalin bilang pangalang pantangi at pinanatili ang malapit na transliterasyon dahil walang higit na matatag na katutubong anyo.
- source_word: וְ/עַבְדִּי
  choice: Abdi
  rationale: Itinuring na pangalang pantangi ayon sa balangkas ng talaan, hindi bilang pariralang “aking lingkod.”
- source_word: וִ/ירֵמוֹת
  choice: Jeremot
  rationale: Malapit na transliterasyon ng pangalang Hebreo, na may hulaping -t upang katawanin ang ת.
- source_word: וְ/אֵלִיָּה
  choice: Elias
  rationale: Ginamit ang karaniwang tradisyonal na anyo ng pangalang Elijah sa Filipino.
