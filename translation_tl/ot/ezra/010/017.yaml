  yaml_path: translation/ot/ezra/010/017.yaml
  text: And they finished with all the men who had taken foreign wives by the first day of the first month[a].
translation:
  language: tl
  text: At natapos nila ang pagsisiyasat sa lahat ng lalaking kumuha ng mga dayuhang asawa pagsapit ng unang araw ng unang buwan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “hanggang sa unang araw ng unang buwan.” Maaaring ipahayag ng pariralang Hebreo ang petsang inabot o ang hangganang panahong pinagtapusan ng pagsisiyasat.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְכַלּוּ
  choice: natapos nila ang pagsisiyasat
  rationale: Ang pandiwang mula sa כלה ay nagsasaad ng pagtatapos. Idinagdag ang “pagsisiyasat” mula sa malinaw na konteksto ng proseso sa Ezra 10:16 upang maging natural sa Tagalog at maiwasan ang alanganing “natapos sila sa lahat ng lalaki.”
- source_word: בַכֹּל אֲנָשִׁים
  choice: sa lahat ng lalaking
  rationale: Ipinahihiwatig ng בַכֹּל ang kabuuang saklaw ng mga kasong hinarap, at ang אֲנָשִׁים ay tahasang panlalaking maramihan.
- source_word: הַהֹשִׁיבוּ
  choice: kumuha
  rationale: Literal itong may diwang “nagpatira,” ngunit sa konteksto ay isang idyoma para sa pagkuha ng babae bilang asawa. Pinananatili ng “kumuha” ang idyomatikong anyo nang hindi tahasang ipinapalit ang mas interpretibong “nag-asawa.”
- source_word: נָשִׁים נָכְרִיּוֹת
  choice: mga dayuhang asawa
  rationale: Sa konteksto, ang נָשִׁים ay tumutukoy sa mga babaeng kinuha bilang asawa; ang נָכְרִיּוֹת ay nangangahulugang dayuhan. Natural at tiyak sa modernong Tagalog ang pariralang ito.
- source_word: עַד יוֹם אֶחָד
  choice: pagsapit ng unang araw
  rationale: Itinatakda ng עַד ang hangganang temporal ng natapos na proseso. Ang “pagsapit ng” ay likas sa Tagalog at maaaring magpahayag ng petsang inabot o hangganang pinagtapusan.
- source_word: לַחֹדֶשׁ הָרִאשׁוֹן
  choice: ng unang buwan
  rationale: Tuwirang salin ito ng pahayag na pangkalendaryo at hindi nito ipinapalagay ang pangalan ng buwan.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “pagsisiyasat” bilang kontekstuwal na layon ng “natapos” upang maging natural ang pangungusap, habang pinanatili sa “kumuha ng mga dayuhang asawa” ang bahagyang idyomatikong anyo ng Hebreo.
