  text: וּ/מִֽן הַ/לְוִיִּ֑ם יוֹזָבָ֣ד וְ/שִׁמְעִ֗י וְ/קֵֽלָיָה֙ ה֣וּא קְלִיטָ֔א פְּתַֽחְיָ֥ה יְהוּדָ֖ה וֶ/אֱלִיעֶֽזֶר־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/023.yaml
  text: 'And from the Levites: Jozabad[a], Shimei, Keliah (that is, Kelita), Pethahiah, Judah, and Eliezer.'
translation:
  language: tl
  text: 'At mula sa mga Levita: sina Jozabad, Simei, Kelaya (na siya ring Kelita)[a], Petahias, Juda, at Eliezer.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “Kelaya, siya ay Kelita,” na nagpapahiwatig na ang Kelita ay isa pang pangalan o anyo ng pangalan ng taong ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִן הַלְוִיִּם
  choice: At mula sa mga Levita
  rationale: Pinananatili ang panandang nag-uugnay na וּ at ang diwang partitivo ng מִן, habang gumagamit ng natural na katawagan sa Filipino.
- source_word: יוֹזָבָד
  choice: Jozabad
  rationale: Ginamit ang nakaugaliang anyo ng pangalang ito sa Filipino upang maging madaling makilala.
- source_word: וְשִׁמְעִי
  choice: Simei
  rationale: Ginamit ang karaniwang anyong Filipino ng personal na pangalang Hebreo.
- source_word: וְקֵלָיָה הוּא קְלִיטָא
  choice: Kelaya (na siya ring Kelita)[a]
  rationale: Ang הוּא ay nauunawaan dito bilang paliwanag o pagtukoy na ang Kelita ay isa pang anyo o pangalan ng taong tinawag na Kelaya; hindi ito ginawang dalawang magkahiwalay na tao.
- source_word: פְּתַחְיָה
  choice: Petahias
  rationale: Ginamit ang natural at nakaugaliang anyong Filipino ng pangalan.
- source_word: יְהוּדָה
  choice: Juda
  rationale: Ang konteksto ay tumutukoy sa isang tao, at ang Juda ang karaniwang anyong Filipino ng pangalan.
- source_word: וֶאֱלִיעֶזֶר
  choice: at Eliezer
  rationale: Ang anyo at pagbigkas sa tekstong Hebreo ay tumutugma sa Eliezer, hindi Eleazar; pinanatili rin ang pangwakas na pang-ugnay.
