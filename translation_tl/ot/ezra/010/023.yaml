translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “sina” upang natural na ipakilala ang talaan ng mga tao, bagaman wala itong tuwirang katumbas na hiwalay na salita sa Hebreo. Inilagay ang talababa sa Kelaya/Kelita, ang pariralang talagang tinutukoy nito.
