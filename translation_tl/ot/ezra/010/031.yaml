base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/031.yaml
  text: 'And from the sons of Harim: Eliezer[a], Isshijah, Malkijah, Shemaiah[c][b], and Shimeon.'
translation:
  language: tl
  text: 'At mula sa mga anak ni Harim[a]: sina Eliezer, Yishiya[b], Malkiya, Semaya, at Shimeon[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “At ang mga anak ni Harim,” kung ituturing ang parirala bilang simpleng pamagat ng talaan sa halip na tahasang idagdag ang “mula sa.”
    reason: lexical_alternative
  - marker: b
    text: Ang Yishiya ay maaari ring isulat na “Yeshia” o “Ishiya.”
    reason: lexical_alternative
  - marker: c
    text: Ang Shimeon ay tradisyonal ding isinasalin bilang “Simeon.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְנֵי
  choice: At mula sa mga anak ni
  rationale: Ang וּ ay nag-uugnay sa naunang talaan, at ang בְנֵי ay literal na “mga anak ni.” Ipinahihiwatig ng konteksto na ang mga pinangalanan ay ilan mula sa angkan ni Harim, kaya likas sa Filipino ang “mula sa mga anak ni,” habang inilalagay sa talababa ang mas literal na pagbasa bilang simpleng pamagat ng pangkat.
- source_word: חָרִם
  choice: Harim
  rationale: Pangalan ng tao o angkan; tuwirang transliterasyon na malinaw sa Filipino.
- source_word: אֱלִיעֶזֶר
  choice: Eliezer
  rationale: Karaniwang anyo ng pangalang Hebreo at likas basahin sa Filipino.
- source_word: יִשִּׁיָּה
  choice: Yishiya
  rationale: Transliterasyong malapit sa tunog at anyo ng Hebreo; pinananatili ang paunang yod bilang Y at ang tunog na sh bilang “sh.”
- source_word: מַלְכִּיָּה
  choice: Malkiya
  rationale: Malapit sa Hebreong bigkas at madaling basahin sa Filipino; ang כ dito ay kinakatawan ng k.
- source_word: שְׁמַעְיָה
  choice: Semaya
  rationale: Filipinisadong transliterasyon na madaling bigkasin, habang sapat na kinakatawan ang Hebreong pangalan.
- source_word: שִׁמְעוֹן
  choice: Shimeon
  rationale: Pinananatili ng “Shimeon” ang paunang tunog na שׁ (sh); ang tradisyonal na “Simeon” ay inilalagay bilang alternatibo sa talababa.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “sina” upang natural na ipakilala ang sunod-sunod na mga pangalan, at pinanatili sa mga talababa ang tunay na kalabuan ng panimulang parirala at ang mahahalagang alternatibong transliterasyon.
