base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/018.yaml
  text: 'And among the sons of the priests who had taken foreign wives[a], there were found from the sons of Jeshua son of Jozadak and his brothers: Maaseiah, Eliezer, Jarib, and Gedaliah.'
translation:
  language: tl
  text: At kabilang sa mga anak ng mga pari na nag-asawa ng mga dayuhang babae[a], ang mga natagpuan mula sa mga anak ni Jeshua, na anak ni Jozadak, at ng kanyang mga kapatid ay sina Maaseias, Eliezer, Jarib, at Gedalias.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O kaya, “kumuha ng mga dayuhang asawa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמָּצֵא
  choice: natagpuan
  rationale: Pinananatili ang di-personal at pormang pasibo ng Hebreo. Bagaman isahan ang pandiwa sa Hebreo, isang pangkat ng mga lalaki ang ipinakikilala nito, at likas sa Tagalog na hindi markahan sa pandiwa ang bilang.
- source_word: מִבְּנֵי הַכֹּהֲנִים
  choice: kabilang sa mga anak ng mga pari
  rationale: Ipinahahayag ng מִן ang pagiging bahagi ng pangkat, samantalang pinananatili ng “mga anak” ang pananalitang pangangkanan ng Hebreo.
- source_word: אֲשֶׁר הֹשִׁיבוּ נָשִׁים נָכְרִיּוֹת
  choice: na nag-asawa ng mga dayuhang babae
  rationale: Sa konteksto ng Ezra 10, tumutukoy ang idyoma sa pakikipag-asawa. Mas natural at malinaw ito sa modernong Tagalog kaysa sa literal na “kumuha,” habang ang alternatibong anyo ay inilagay sa talababa.
- source_word: נָשִׁים נָכְרִיּוֹת
  choice: mga dayuhang babae
  rationale: Pinananatili nito ang pangunahing leksikal na kahulugan ng parirala, habang nililinaw ng pandiwang “nag-asawa” ang ugnayang marital.
- source_word: מִבְּנֵי יֵשׁוּעַ בֶּן יוֹצָדָק
  choice: mula sa mga anak ni Jeshua na anak ni Jozadak
  rationale: Pinananatili ang paulit-ulit na wikang pangangkanan at ang ugnayan ng ama at anak sa tekstong Hebreo.
- source_word: וְאֶחָיו
  choice: at sa kanyang mga kapatid
  rationale: Ang “mga kapatid” ang tuwirang katumbas ng אֶחָיו; hindi ito pinalawak tungo sa “mga kamag-anak.”
- source_word: מַעֲשֵׂיָה וֶאֱלִיעֶזֶר וְיָרִיב וּגְדַלְיָה
  choice: Maaseias, Eliezer, Jarib, at Gedalias
  rationale: Isinalin sa baybay-Tagalog ang mga pangalang pantangi sa paraang malinaw at madaling bigkasin, nang hindi isinasalin ang kahulugan ng mga pangalan.
theological_decisions: []
translation_notes:
  register: Makabago at marangal na Tagalog ang ginamit. Pinanatili ang wikang pangangkanan na “mga anak” at ang bahagyang siksik na pagkakabuo ng talaan, ngunit ginawang natural ang idyoma tungkol sa pag-aasawa. Ang tandang talababa [a] ay nasa pangunahing teksto.
