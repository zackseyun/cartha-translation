  source_fidelity: Tumpak na naipapahayag ng draft ang pangkat ng mga paring nasangkot sa pag-aasawa sa mga dayuhang babae at ang talaan ng mga pangalan. Gayunman, ang ayos na “natagpuan mula sa” ay hindi natural sa Tagalog at nagpapalabo sa ugnayan ng pandiwang Hebreo sa kasunod na talaan.
  naturalness: Kailangan ng maliit ngunit mahalagang pag-aayos sa sintaks upang ang “mga natagpuan” ay malinaw na tumukoy sa mga lalaking pinangalanan at ang “mula sa” ay maayos na magpakilala sa kanilang pangkat.
  terminology: Ang “nag-asawa ng mga dayuhang babae” ay natural at sapat na nagpapahiwatig ng kontekstong pag-aasawa. Ang talababa ay wastong nagbibigay ng mas malapit na alternatibong idyomatiko. Pinanatili ang mga pangalan gaya ng nasa draft.
