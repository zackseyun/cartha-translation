  to: At kabilang sa mga anak ng mga pari na nag-asawa ng mga dayuhang babae[a], ang mga natagpuan mula sa mga anak ni Jeshua, na anak ni Jozadak, at ng kanyang mga kapatid ay sina Maaseias, Eliezer, Jarib, at Gedalias.
