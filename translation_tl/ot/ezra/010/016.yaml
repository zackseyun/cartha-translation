  naturalness: Mas natural at malinaw ang “Ginawa nga ito ng...” kaysa “Kaya gayon ang ginawa...”. Ang “lalaki, na mga pinuno ng mga angkan” ay malinaw na naghahatid ng appositional na Hebreong parirala. Ang “isa-isang nakilala ayon sa pangalan” ay natural na paraan upang ipahayag ang indibiduwal na pagtukoy nang hindi tahasang nagdaragdag ng pagkakatala sa isang listahan.
  terminology: Napanatili ang “mga anak ng pagkabihag” bilang pormal na katawagang pangkorporasyon, na may paliwanag sa talababa. “Ezra na pari,” “mga angkan,” at “siyasatin ang usapin” ay angkop sa modernong Filipino Tagalog at sa administratibong konteksto.
