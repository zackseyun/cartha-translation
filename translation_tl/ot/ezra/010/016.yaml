base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/016.yaml
  text: So the sons of the exile did so. And Ezra the priest set apart men, heads of fathers’ houses according to their fathers’ houses, all of them by name; and they sat down on the first day of the tenth month to investigate the matter.
translation:
  language: tl
  text: Ginawa nga ito ng mga anak ng pagkabihag.[a] At ibinukod sina Ezra na pari at ang mga lalaki, na mga pinuno ng mga angkan ayon sa kani-kanilang angkan, na lahat ay isa-isang nakilala ayon sa pangalan.[b] Umupo sila noong unang araw ng ikasampung buwan upang siyasatin ang usapin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “mga anak ng pagkabihag,” isang katawagang pangkorporasyon para sa pamayanang bumalik mula sa pagkabihag.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring unawain na sina Ezra na pari at ang mga lalaking pinuno ang “nagbukod” o “humihiwalay” bilang isang pangkat. Maramihan ang pandiwang Hebreo; hindi lubos na tiyak kung pasibo itong “ibinukod” o reflexive na “nagbukod ng sarili.”
    reason: alternative_reading
lexical_decisions:
- source_word: בְּנֵי הַגּוֹלָה
  choice: mga anak ng pagkabihag
  rationale: Pinananatili ang kongkretong Hebreong idyoma at ang katawagang pangkalahatan para sa pamayanang bumalik mula sa pagkabihag; nililinaw ng talababa ang diwa.
- source_word: וַיִּבָּדְלוּ
  choice: humiwalay si Ezra na pari, kasama ang ilang lalaki
  rationale: Ang Niphal ng בדל ay pangunahing tumutukoy sa paghiwalay o pagbukod. Dahil maramihan ang pandiwa at sinusundan ito ni Ezra at ng mga lalaki, pinananatili ang posibleng reflexive na pagbasa sa halip na tahimik na gawing 'pumili si Ezra.'
- source_word: עֶזְרָא הַכֹּהֵן
  choice: si Ezra na pari
  rationale: Isinasalin lamang ang tahasang titulo sa talata at hindi idinaragdag ang 'eskriba' mula sa kalapit na konteksto.
- source_word: אֲנָשִׁים רָאשֵׁי הָאָבוֹת לְבֵית אֲבֹתָם
  choice: ilang lalaking pinuno ng mga angkan ayon sa kani-kanilang angkan
  rationale: Pinananatili ang tahasang 'mga lalaki' at inilalarawan ang mga pinunong nakaayos ayon sa kanilang mga sambahayang ninuno; 'angkan' ang natural na modernong katumbas ng yunit na tinutukoy.
- source_word: וְכֻלָּם בְּשֵׁמוֹת
  choice: na pawang itinala sa pangalan
  rationale: Ipinahahayag ang indibiduwal na pagkakilala o pagtatala ng lahat, sa natural na Filipino.
- source_word: וַיֵּשְׁבוּ
  choice: umupo sila
  rationale: Pinananatili ang literal na larawan ng pag-upo, na sa konteksto ay pag-upo bilang lupon upang magsiyasat.
- source_word: בְּיוֹם אֶחָד לַחֹדֶשׁ הָעֲשִׂירִי
  choice: noong unang araw ng ikasampung buwan
  rationale: Natural na Filipino para sa Hebreong idyomang 'araw na isa' ng buwan.
- source_word: לְדַרְיוֹשׁ הַדָּבָר
  choice: upang siyasatin ang usapin
  rationale: Ang דרש ay tumutukoy sa masusing pag-usisa o pagsisiyasat; ang 'usapin' ay angkop sa administratibo at hudisyal na konteksto.
theological_decisions:
- issue: Kung si Ezra ba ang pumili ng mga lalaki o kung si Ezra at ang mga lalaki ang humiwalay/bukod na pangkat
  choice: Humiwalay si Ezra kasama ang mga lalaki
  alternative: Pumili o nagbukod si Ezra ng mga lalaki
  rationale: Maramihan ang Hebreong וַיִּבָּדְלוּ, kaya natural na maaaring maging simuno sina Ezra at ang kasunod na mga lalaki. Hindi inaayos ang sintaks upang gawing tahasang appointment ang isang tekstong may tunay na gramatikal na tensiyon.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang 'angkan' sa halip na literal ngunit mabigat na 'mga sambahayan ng mga ama.' Pinanatili sa pangunahing teksto ang Hebreong idyomang 'mga anak ng pagkabihag' at ang literal na 'umupo sila,' habang ipinaliwanag sa talababa ang pinakamahalagang leksikal at sintaktikong kalabuan.
