revisions:
- from: Kaya gayon ang ginawa ng mga anak ng pagkabihag.[a] At humiwalay si Ezra na pari, kasama ang ilang lalaking pinuno ng mga angkan ayon sa kani-kanilang angkan, na pawang itinala sa pangalan.[b] Noong unang araw ng ikasampung buwan, umupo sila upang siyasatin ang usapin.
  to: Ginawa nga ito ng mga anak ng pagkabihag.[a] At ibinukod sina Ezra na pari at ang mga lalaki, na mga pinuno ng mga angkan ayon sa kani-kanilang angkan, na lahat ay isa-isang nakilala ayon sa pangalan.[b] Umupo sila noong unang araw ng ikasampung buwan upang siyasatin ang usapin.
