lexical_decisions:
- source_word: שֶׁלֶמְיָה
  choice: Selemias
  rationale: Pangalang pantangi; ginamit ang anyong madaling basahin at pamilyar sa makabagong Tagalog habang malapit sa Hebreong pangalan.
- source_word: נָתָן
  choice: Natan
  rationale: Tuwirang pagsasalin-titik ng pangalang Hebreo sa baybay na likas sa Tagalog.
- source_word: עֲדָיָה
  choice: Adaya
  rationale: Pagsasalin-titik ng pangalang Hebreo ayon sa tunog at baybay na madaling basahin sa Tagalog.
- source_word: וְ / וַ
  choice: at si
  rationale: Ang bawat waw ay pinanatili bilang “at,” at idinagdag ang pantukoy na “si” na likas gamitin sa Tagalog bago ang pangalan ng tao.
