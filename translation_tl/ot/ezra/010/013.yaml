base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/013.yaml
  text: But the people are many[a], and it is the rainy season, and there is no strength to stand outside. And the work is not for one day or for two[c][b], for we have greatly transgressed in this matter.
translation:
  language: tl
  text: Ngunit napakarami ng mga tao, at panahon ito ng mga ulan[a], at hindi natin kayang manatili sa labas. Hindi matatapos ang gawain sa isa o dalawang araw[b], sapagkat lubha tayong sumuway sa bagay na ito.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa literal: “panahon ng mga ulan.”'
    reason: lexical_alternative
  - marker: b
    text: 'Sa literal: “ang gawain ay hindi para sa isang araw o para sa dalawa.”'
    reason: literal_rendering
  - marker: c
    text: Maaari ring isalin na “nagkasala tayo nang malubha sa bagay na ito.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲבָל
  choice: Ngunit
  rationale: Malinaw na naghuhudyat ng pagsalungat sa mungkahi sa naunang talata at angkop sa marangal na makabagong Tagalog.
- source_word: הָעָם רָב
  choice: napakarami ng mga tao
  rationale: Pinananatili ang diwang napakarami ng nagkakatipong bayan; mas natural ito sa Tagalog kaysa sa literal na ay marami.
- source_word: וְהָעֵת גְּשָׁמִים
  choice: at tag-ulan ngayon
  rationale: Likas na katumbas sa Tagalog ng literal na panahon ng mga ulan at malinaw na tumutukoy sa kasalukuyang kalagayan.
- source_word: וְאֵין כֹּחַ לַעֲמוֹד בַּחוּץ
  choice: kaya hindi natin kayang manatili sa labas
  rationale: Sa konteksto ng ulan, ang לַעֲמוֹד ay hindi lamang pisikal na pagtayo kundi pananatili sa labas. Ginawang tahasan ang ipinahihiwatig na unang panauhang maramihan.
- source_word: וְהַמְּלָאכָה
  choice: ang gawaing ito
  rationale: Tumutukoy sa praktikal na gawaing kailangang siyasatin at ayusin, hindi lamang sa manwal na paggawa.
- source_word: לֹא לְיוֹם אֶחָד וְלֹא לִשְׁנַיִם
  choice: Hindi matatapos ... sa loob lamang ng isa o dalawang araw
  rationale: Natural na ipinahahayag sa Tagalog ang kahulugan ng Hebreong pormang nagsasaad na hindi pang-isa o dalawang araw ang gawain.
- source_word: כִּי הִרְבִּינוּ לִפְשֹׁעַ
  choice: sapagkat lubha tayong sumuway
  rationale: Ang hiphil ng רבה kasama ng infinitive ay nagpapalakas sa antas ng pagsuway. Ang sumuway ay nagpapanatili sa seryosong diwa ng פשׁע nang hindi ito labis na nililinaw bilang isang tiyak na uring doktrinal.
- source_word: בַּדָּבָר הַזֶּה
  choice: sa bagay na ito
  rationale: Direkta at likas na tumutukoy sa usaping tinatalakay sa konteksto.
theological_decisions:
- issue: Uri ng paglabag na ipinahahayag ng לִפְשֹׁעַ
  choice: lubha tayong sumuway
  alternative: nagkasala tayo nang malubha; kumilos tayo nang mapaghimagsik
  rationale: Ang פשׁע ay maaaring magpahiwatig ng pagsuway, paglabag, o paghihimagsik. Pinananatili ng sumuway ang bigat ng paglabag sa tipan ngunit hindi nagpapasok ng mas tiyak na doktrinal o pampolitikang kahulugan kaysa sa sinasabi ng talata.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino Tagalog. Ginamit ang natural na mga parirala gaya ng “tag-ulan” at “manatili sa labas,” habang inilagay sa talababa ang mas literal na anyo at ang mahalagang alternatibong salin.
