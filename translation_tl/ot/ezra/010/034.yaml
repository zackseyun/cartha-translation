  rationale: Ang מִן na ikinabit sa construct na בְּנֵי ay nagpapakilala ng mga taong kabilang sa isang angkan. Ang “Sa mga anak ni” ay natural sa modernong Tagalog at pinananatili ang partitive na diwa sa talaan.
- source_word: בָנִי
  choice: Bani
  rationale: Pangalang pantangi; tinumbasan sa karaniwang anyong transliterado.
- source_word: מַעֲדַי
  choice: Maadai
  rationale: Pangalang pantangi; pinanatili sa isang tuwirang transliterasyon mula sa Hebreo.
- source_word: עַמְרָם
  choice: Amram
  rationale: Pangalang pantangi; ginamit ang nakasanayang anyong Amram sa Filipino.
- source_word: וְאוּאֵל
  choice: at Uel
  rationale: Isinalin ang pang-ugnay na וְ bilang “at,” at tinranslitera ang pangalang אוּאֵל bilang “Uel.”
