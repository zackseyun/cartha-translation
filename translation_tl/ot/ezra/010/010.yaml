  text: וַ/יָּ֨קָם עֶזְרָ֤א הַ/כֹּהֵן֙ וַ/יֹּ֣אמֶר אֲלֵ/הֶ֔ם אַתֶּ֣ם מְעַלְתֶּ֔ם וַ/תֹּשִׁ֖יבוּ נָשִׁ֣ים נָכְרִיּ֑וֹת לְ/הוֹסִ֖יף עַל אַשְׁמַ֥ת יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/010.yaml
  text: Then Ezra the priest stood up and said to them[a], “You have acted unfaithfully and have taken foreign women as wives, adding to the guilt of Israel.”
translation:
  language: tl
  text: Pagkatapos, tumayo ang paring si Ezra at sinabi sa kanila, “Hindi kayo naging tapat at kumuha kayo ng mga dayuhang babae bilang mga asawa[a]; sa gayon, dinagdagan ninyo ang pagkakasala ng Israel.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “kumuha kayo ng mga dayuhang asawa.” Literal sa Hebreo, “pinatira ninyo ang mga dayuhang babae”; sa kontekstong ito, tumutukoy ito sa pagkuha sa kanila bilang mga asawa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: tumayo
  rationale: Ipinapahayag ng pandiwa ang hayagang pagtayo ni Ezra upang magsalita sa kapulungan; natural at tuwiran ang “tumayo” sa makabagong Tagalog.
- source_word: הַכֹּהֵן
  choice: ang paring
  rationale: Pinananatili ang titulong kumikilala kay Ezra bilang pari, sa likas na ayos ng parirala sa Tagalog.
- source_word: מְעַלְתֶּם
  choice: Hindi kayo naging tapat
  rationale: Ipinahihiwatig ng מעל ang pagsira sa katapatan, lalo na sa kontekstong tipan. Malinaw ito nang hindi nagdaragdag ng tiyak na denominasyonal na paliwanag.
- source_word: וַתֹּשִׁיבוּ
  choice: kumuha kayo
  rationale: Ang Hiphil ng ישב ay literal na “pinatira,” ngunit sa konteksto ay tumutukoy sa pagkuha sa mga babae bilang asawa at pagpasok sa kanila sa sambahayan. Ang “kumuha ... bilang asawa” ay natural at hindi labis na nagpapaliwanag.
- source_word: נָשִׁים נָכְרִיּוֹת
  choice: mga dayuhang babae bilang asawa
  rationale: Pinananatili ang literal na “mga dayuhang babae” habang nililinaw mula sa konteksto na ang tinutukoy ay pag-aasawa. Inilalagay sa talababa ang mas maikling alternatibong “mga dayuhang asawa.”
- source_word: לְהוֹסִיף
  choice: sa gayon, dinagdagan
  rationale: Ipinapakita ng parirala ang bunga o kalalabasan ng naunang ginawa. Ang “sa gayon” ay nagpapanatili ng ugnayan nang hindi labis na nagtatakda kung layunin o resulta ang diin.
- source_word: אַשְׁמַת
  choice: ang pagkakasala
  rationale: Dito ang אַשְׁמָה ay tumutukoy sa sala o pananagutang dulot nito, hindi sa handog para sa pagkakasala. Ang “pagkakasala” ay malinaw at karaniwan sa Tagalog.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Pinananatili ang pangalan para sa bayang tipan bilang isang kabuuang pamayanan.
theological_decisions:
- issue: Sama-samang pananagutan ng bayang tipan
  choice: dinagdagan ninyo ang pagkakasala ng Israel
  alternative: pinalaki ninyo ang sala ng Israel
  rationale: Ipinakikita ng Hebreo na ang ginawa ng mga kausap ay nakaragdag sa pananagutan ng buong Israel, hindi lamang sa kanilang pansariling sala. Pinananatili ito nang walang dagdag na doktrinal na pagpapakahulugan.
- issue: Likas na katangian ng kawalang-katapatan
  choice: Hindi kayo naging tapat
  alternative: Nagtaksil kayo
  rationale: Pinananatili ng napiling salin ang moral at tipanang diwa ng מעל, ngunit iniiwasan ang posibilidad na ang “nagtaksil” ay unawain lamang bilang pagtataksil sa asawa.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “paring si Ezra” bilang likas na appositional na anyo, at pinanatili ang tuwirang pananalita at ang kolektibong pananagutan ng Israel.
