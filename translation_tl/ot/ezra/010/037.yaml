  rationale: Pangalan ng tao; ginamit ang anyong likas at nakasanayan sa Filipino para sa pangalang Hebreo na Mattanyah.
- source_word: מַתְּנַי
  choice: Matenai
  rationale: Pangalan ng tao; inililipat sa baybay-Filipino habang pinananatili ang hulaping tunog na -ai.
- source_word: ו/יעשו
  choice: at Jaasai
  rationale: Isinalin ang ו bilang “at.” Sa konteksto ng talaan, ang kasunod na anyo ay pangalan ng tao; ginamit ang “Jaasai” bilang transliterasyon, bagaman hindi tiyak at iba-iba ang pagkakabasa sa bihirang pangalang ito.
