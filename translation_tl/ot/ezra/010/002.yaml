revisions:
- from: Sumagot si Secanias na anak ni Jehiel, mula sa angkan ni Elam, at sinabi kay Ezra, “Nagtaksil kami sa ating Diyos[a] nang mag-asawa kami ng mga dayuhang babae mula sa mga bayan ng lupaing ito[b]. Ngunit ngayon ay may pag-asa pa ang Israel tungkol dito[c].”
  to: Sumagot si Secanias na anak ni Jehiel, mula sa angkan ni Elam, at sinabi kay Ezra, “Naging di-tapat kami sa ating Diyos[a] nang mag-asawa kami ng mga dayuhang babae mula sa mga mamamayan ng lupain[b]. Ngunit ngayon ay may pag-asa ang Israel tungkol dito[c].”
  rationale: Pinalinaw ang pagtukoy sa עַמֵּי הָאָרֶץ bilang “mga mamamayan ng lupain,” inalis ang di-tiyak na dagdag na “ito” at ang hindi kailangang “pa,” at inayos ang talababa a upang maging natural na Filipino. Ang “tungkol dito” ay pinanatili upang huwag ipilit ang mas interpretatibong “sa kabila nito.”
