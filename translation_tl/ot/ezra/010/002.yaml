source:
  edition: WLC
  text: וַ/יַּעַן֩ שְׁכַנְיָ֨ה בֶן יְחִיאֵ֜ל מִ/בְּנֵ֤י עולם וַ/יֹּ֣אמֶר לְ/עֶזְרָ֔א אֲנַ֨חְנוּ֙ מָעַ֣לְנוּ בֵ/אלֹהֵ֔י/נוּ וַ/נֹּ֛שֶׁב נָשִׁ֥ים נָכְרִיּ֖וֹת מֵ/עַמֵּ֣י הָ/אָ֑רֶץ וְ/עַתָּ֛ה יֵשׁ מִקְוֶ֥ה לְ/יִשְׂרָאֵ֖ל עַל זֹֽאת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/002.yaml
  text: Then Shecaniah son of Jehiel[a], from the sons of Elam, answered and said to Ezra, “We have acted unfaithfully against our God and have married foreign women from the peoples of the land[c][b]. Yet now there is hope for Israel concerning this.
translation:
  language: tl
  text: Sumagot si Secanias na anak ni Jehiel, mula sa angkan ni Elam, at sinabi kay Ezra, “Naging di-tapat kami sa ating Diyos[a] nang mag-asawa kami ng mga dayuhang babae mula sa mga mamamayan ng lupain[b]. Ngunit ngayon ay may pag-asa ang Israel tungkol dito[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “Nagtaksil kami sa ating Diyos.”'
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring: “kinuha naming asawa ang mga dayuhang babae mula sa mga mamamayan ng lupain.”'
    reason: lexical_alternative
  - marker: c
    text: 'Maaari ring: “may pag-asa ang Israel sa kabila nito.”'
    reason: ambiguity
lexical_decisions:
- source_word: וַיַּעַן
  choice: Sumagot
  rationale: Karaniwang pandiwang pasalaysay para sa pagtugon; natural sa Filipino at tapat sa tungkulin nito sa usapan.
- source_word: שְׁכַנְיָה בֶן יְחִיאֵל
  choice: si Secanias na anak ni Jehiel
  rationale: Isinalin ang ugnayang pampamilya at ginamit ang anyong pangalang madaling basahin sa Filipino.
- source_word: מִבְּנֵי עוֹלָם
  choice: mula sa angkan ni Elam
  rationale: Ang parirala ay tumutukoy sa pangkat na nagmula kay Elam; mas likas sa Filipino ang 'angkan' kaysa literal na 'mga anak.'
- source_word: מָעַלְנוּ בֵאלֹהֵינוּ
  choice: Nagtaksil kami sa ating Diyos
  rationale: Ipinahahayag ng מעל ang malubhang paglabag sa katapatan, lalo na sa ugnayan sa Diyos; pinananatili ng 'nagtaksil' ang bigat nito.
- source_word: וַנֹּשֶׁב נָשִׁים נָכְרִיּוֹת
  choice: nang mag-asawa kami ng mga dayuhang babae
  rationale: Malinaw na ipinahihiwatig ng gamit ng pandiwa sa konteksto ang pagkuha sa mga babae bilang asawa; natural at tuwiran ang 'mag-asawa' sa modernong Filipino.
- source_word: מֵעַמֵּי הָאָרֶץ
  choice: mula sa mga bayan ng lupaing ito
  rationale: Pinananatili ang maramihang mga pangkat ng tao at iniiwasang ipakahulugan ang הָאָרֶץ bilang buong daigdig.
- source_word: יֵשׁ מִקְוֶה לְיִשְׂרָאֵל
  choice: may pag-asa pa ang Israel
  rationale: Ang מִקְוֶה ay pag-asa o batayan ng pag-asa; ipinahahayag ng 'pa' ang likas na kaibahan sa naunang pagtatapat nang hindi binabago ang diwa.
- source_word: עַל זֹאת
  choice: tungkol dito
  rationale: Pinananatili ang malawak at bahagyang di-tiyak na kaugnayan ng parirala sa kasalukuyang suliranin, sa halip na tahasang ipakahulugang 'sa kabila nito.'
theological_decisions:
- issue: Bigat ng מָעַלְנוּ bilang paglabag sa katapatan sa Diyos
  choice: Nagtaksil kami sa ating Diyos
  alternative: Nagkasala kami laban sa ating Diyos
  rationale: Ang 'nagtaksil' ay nagpapanatili sa ugnayang katapatan na taglay ng Hebreo; mas pangkalahatan at mas patag ang 'nagkasala.'
- issue: Paglalarawan sa נָשִׁים נָכְרִיּוֹת
  choice: mga dayuhang babae
  alternative: mga dayuhang asawa
  rationale: Ang pangngalan ay literal na 'mga dayuhang babae,' samantalang ang pandiwa at konteksto ang nagpapakita ng pag-aasawa. Hindi nito dinaragdagan ang etniko o teolohikal na pahayag ng talata.
- issue: Saklaw ng pag-asa sa עַל זֹאת
  choice: tungkol dito
  alternative: sa kabila nito
  rationale: Maaaring tumukoy ang parirala sa usaping kinakaharap o magpahiwatig ng pag-asa sa kabila ng nangyari. Pinili ang mas pormal at hindi gaanong mapagpasiyang pagbasa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang 'angkan' para sa pangkat na nagmula kay Elam at 'mga bayan' para sa maramihang pangkat ng mga tao. Pinanatili sa talababa ang tunay na kalabuan ng עַל זֹאת.
