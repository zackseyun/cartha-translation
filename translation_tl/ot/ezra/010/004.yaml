base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/004.yaml
  text: Rise up[a], for this matter is on you, and we are with you. Be strong and do it.
translation:
  language: tl
  text: Bumangon ka[a], sapagkat pananagutan mo ang bagay na ito, at kasama mo kami. Magpakatatag ka at gawin mo ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “Tumindig ka.” Ang kasunod na idyoma sa Hebreo ay literal na “nasa iyo ang bagay,” na nangangahulugang kay Ezra nakasalalay ang pananagutang harapin ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: קוּם
  choice: Bumangon ka
  rationale: Tuwirang pautos na nananawagan ng agarang pagkilos; natural ito sa makabagong Filipino at pinananatili ang larawan ng pagtindig.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala nito ang dahilan ng naunang utos sa isang maikli at marangal na paraan.
- source_word: עָלֶיךָ הַדָּבָר
  choice: pananagutan mo ang bagay na ito
  rationale: Ang idyomang may עַל at isang tao ay nagsasaad na nasa kaniya ang pasanin o pananagutan. Mas natural sa Filipino ang ganitong pahayag kaysa sa literal na 'nasa iyo ang bagay,' habang inilalahad sa talababa ang anyong mas malapit sa Hebreo.
- source_word: וַאֲנַחְנוּ עִמָּךְ
  choice: at kasama mo kami
  rationale: Payak at natural na pagpapahayag ng pakikiisa at pagsuporta.
- source_word: חֲזַק
  choice: Magpakatatag ka
  rationale: Pinananatili ang lakas ng pautos at, sa kontekstong nangangailangan ng matibay na pagpapasiya at pagkilos, mas natural kaysa sa literal na 'magpakalakas ka.'
- source_word: וַעֲשֵׂה
  choice: at gawin mo ito
  rationale: Hinihingi ang kongkretong pagsasagawa ng bagay na tinutukoy; ang 'ito' ay malinaw na ipinahihiwatig ng konteksto.
theological_decisions: []
