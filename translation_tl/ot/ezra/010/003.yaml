- from: Kaya ngayon, gumawa tayo ng tipan sa ating Diyos na paalisin ang lahat ng babaeng ito at ang mga anak nila, ayon sa payo ng aking panginoon at ng mga nanginginig sa utos ng ating Diyos. Gawin ito ayon sa Kautusan.
  to: Kaya ngayon, gumawa tayo ng tipan sa ating Diyos na paalisin ang lahat ng babae at ang mga ipinanganak sa kanila, ayon sa payo ng aking panginoon at ng mga nanginginig sa utos ng ating Diyos; at gawin ito ayon sa Kautusan.
  rationale: Inalis ang demonstratibong “ito” upang hindi magdagdag sa saklaw ng Hebreo. Pinalitan ang “mga anak nila” ng “mga ipinanganak sa kanila” upang mas malapit na maipakita ang anyo ng orihinal, habang nananatiling natural at malinaw. Pinanatili ang “aking panginoon,” ang masidhing “mga nanginginig,” at ang “Kautusan.”
