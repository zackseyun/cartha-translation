base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/003.yaml
  text: So now let us make a covenant with our God to send away all the women and what has been born from them, according to the counsel of my lord and of those who tremble at the commandment of our God; and let it be done according to the law.
translation:
  language: tl
  text: Kaya ngayon, gumawa tayo ng tipan sa ating Diyos na paalisin ang lahat ng babae at ang mga ipinanganak sa kanila, ayon sa payo ng aking panginoon at ng mga nanginginig sa utos ng ating Diyos; at gawin ito ayon sa Kautusan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נִכְרָת בְּרִית
  choice: gumawa tayo ng tipan
  rationale: Ang literal na idyomang Hebreo ay ‘pumutol ng tipan,’ ngunit ang likas at tumpak na katumbas sa modernong Tagalog ay ‘gumawa ng tipan.’
- source_word: לְהוֹצִיא כָל נָשִׁים
  choice: paalisin ang lahat ng babaeng ito
  rationale: 'Ang causative na לְהוֹצִיא ay nangangahulugang palabasin o paalisin. Ang ‘ito’ ay nilinaw ng konteksto: ang tinutukoy ay ang mga dayuhang babaeng nasa usapin, hindi lahat ng babae sa pangkalahatan.'
- source_word: וְהַנּוֹלָד מֵהֶם
  choice: at ang mga anak nila
  rationale: Literal itong ‘at ang ipinanganak mula sa kanila’; sa konteksto, natural na tumutukoy ito sa kanilang mga anak.
- source_word: אֲדֹנָי
  choice: aking panginoon
  rationale: May panlaping unang panauhan ang anyo sa teksto at tumutukoy sa taong kinakausap, kaya pinanatili ang ‘aking panginoon’ sa halip na gawing banal na titulong ‘Panginoon.’
- source_word: הַחֲרֵדִים
  choice: mga nanginginig
  rationale: Pinananatili ang matingkad na larawang Hebreo para sa mga may taimtim na paggalang at takot sa utos ng Diyos.
- source_word: כַתּוֹרָה
  choice: ayon sa Kautusan
  rationale: Dito, ang תּוֹרָה ay tumutukoy sa umiiral na Kautusan bilang pamantayan ng gagawin; ang malaking titik ay nagpapakilalang ito ang Kautusan ng Diyos.
theological_decisions:
- issue: Kung ang אֲדֹנָי ay banal na titulo o paggalang kay Ezra
  choice: aking panginoon
  alternative: Panginoon
  rationale: Ang Masoretikong anyo at sintaks ay sumusuporta sa pagbasa na tumutukoy ito kay Ezra bilang taong kinakausap. Hindi ito ginawang pagtukoy sa Diyos.
- issue: Saklaw ng ‘lahat ng babae’
  choice: lahat ng babaeng ito
  alternative: lahat ng babae
  rationale: Ang demonstratibong ‘ito’ ay kontekstuwal na paglilinaw upang maiwasang ipahiwatig na lahat ng babae nang walang pagtatangi ang paaalisin; tinutukoy ng kabanata ang partikular na mga dayuhang asawa.
- issue: Tindi ng הַחֲרֵדִים
  choice: mga nanginginig sa utos
  alternative: mga gumagalang sa utos
  rationale: Pinananatili ang teolohikal at emosyonal na tindi ng orihinal sa halip na pahinain ito bilang pangkalahatang paggalang.
translation_notes:
  register: Modernong Filipino Tagalog na may dignidad at malinaw na daloy. Pinanatili ang pormal na ‘tipan’ at ‘Kautusan,’ habang ginawang natural ang Hebreong mga idyoma. Walang footnote marker dahil walang footnote na kailangan sa publikasyong draft.
