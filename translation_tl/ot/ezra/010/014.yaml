revisions:
- from: Nawa’y tumayo ang ating mga pinuno bilang kinatawan ng buong kapulungan. Ang bawat isa sa ating mga lungsod na nag-asawa ng mga babaeng banyaga[a] ay pumarito sa mga itinakdang panahon, kasama ang matatandang pinuno at mga hukom ng kani-kanilang lungsod, hanggang sa maalis sa atin ang nag-aalab na galit ng ating Diyos dahil sa bagay na ito.[b]
  to: Nawa’y tumayo ang ating mga pinuno para sa buong kapulungan, at nawa’y humarap sa mga itinakdang panahon ang bawat isa sa ating mga lungsod na nag-asawa ng mga babaeng banyaga[a], kasama ang mga nakatatanda at mga hukom ng bawat lungsod, hanggang sa maalis sa atin ang nag-aalab na galit ng ating Diyos sa usaping ito.[b]
  rationale: Inayos ang saklaw ng dalawang jussive na panukala sa pamamagitan ng pag-uulit ng “nawa’y,” inalis ang di-iniatas na “pinuno” mula sa katumbas ng mga elder, at ginawang mas neutral ang pangwakas na parirala upang mapanatili ang sintaktikong kalabuan ng Hebreo. Hindi binago ang kahulugan ng talata o ang mga anchor ng talababa.
