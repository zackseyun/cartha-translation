  text: יַֽעֲמְדוּ נָ֣א שָׂ֠רֵי/נוּ לְֽ/כָל הַ/קָּהָ֞ל וְ/כֹ֣ל אֲשֶׁ֣ר בֶּ/עָרֵ֗י/נוּ הַ/הֹשִׁ֞יב נָשִׁ֤ים נָכְרִיּוֹת֙ יָבֹא֙ לְ/עִתִּ֣ים מְזֻמָּנִ֔ים וְ/עִמָּ/הֶ֛ם זִקְנֵי עִ֥יר וָ/עִ֖יר וְ/שֹׁפְטֶ֑י/הָ עַ֠ד לְ/הָשִׁ֞יב חֲר֤וֹן אַף אֱלֹהֵ֨י/נוּ֙ מִמֶּ֔/נּוּ עַ֖ד לַ/דָּבָ֥ר הַ/זֶּֽה־־׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/014.yaml
  text: Please let our leaders stand for the whole assembly[a], and let everyone in our cities who has taken foreign wives come at appointed times, with them the elders of each city and its judges[b], until the burning anger of our God is turned back from us in this matter.
translation:
  language: tl
  text: Nawa’y tumayo ang ating mga pinuno para sa buong kapulungan, at nawa’y humarap sa mga itinakdang panahon ang bawat isa sa ating mga lungsod na nag-asawa ng mga babaeng banyaga[a], kasama ang mga nakatatanda at mga hukom ng bawat lungsod, hanggang sa maalis sa atin ang nag-aalab na galit ng ating Diyos sa usaping ito.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kumuha ng mga asawang banyaga.” Literal na tumutukoy ang Hebreong idyoma sa pagpapatira sa kanila sa sambahayan bilang mga asawa.
    reason: lexical_alternative
  - marker: b
    text: O “hanggang sa maalis sa atin ang nag-aalab na galit ng ating Diyos tungkol sa usaping ito.”
    reason: alternative_reading
lexical_decisions:
- source_word: יַעֲמְדוּ נָא
  choice: Nawa’y tumayo
  rationale: Ipinapanatili ng “nawa’y” ang magalang na mungkahi ng jussive na may נָא, samantalang pinananatili ng “tumayo” ang pangunahing larawan ng pandiwa.
- source_word: שָׂרֵינוּ לְכָל הַקָּהָל
  choice: ang ating mga pinuno bilang kinatawan ng buong kapulungan
  rationale: Ang שָׂרִים ay mga pinuno o opisyal, at ipinahihiwatig ng לְכָל הַקָּהָל na kikilos sila para sa buong nagkakatipong pamayanan.
- source_word: הַהֹשִׁיב נָשִׁים נָכְרִיּוֹת
  choice: nag-asawa ng mga babaeng banyaga
  rationale: Sa kontekstong ito, ang idyomang literal na tumutukoy sa pagpapatira ng mga babaeng banyaga sa sambahayan ay nangangahulugang pagtanggap sa kanila bilang mga asawa. Natural at malinaw ito sa makabagong Tagalog; nasa talababa ang mas literal na anyo.
- source_word: לְעִתִּים מְזֻמָּנִים
  choice: sa mga itinakdang panahon
  rationale: Ipinahahayag nito ang mga tiyak at opisyal na oras na itinalaga para dinggin ang bawat kaso.
- source_word: זִקְנֵי עִיר וָעִיר וְשֹׁפְטֶיהָ
  choice: ang matatandang pinuno at mga hukom ng kani-kanilang lungsod
  rationale: Distributibo ang עִיר וָעִיר. Nililinaw ng “kani-kanilang lungsod” na ang mga lokal na matatandang pinuno at hukom ay sasama sa taong mula sa kanilang lungsod.
- source_word: חֲרוֹן אַף אֱלֹהֵינוּ
  choice: ang nag-aalab na galit ng ating Diyos
  rationale: Pinananatili ng “nag-aalab na galit” ang matinding larawan ng Hebreong idyoma sa halip na gawing mas abstrakto ang kahulugan.
- source_word: עַד לְהָשִׁיב ... מִמֶּנּוּ
  choice: hanggang sa maalis sa atin
  rationale: Ipinahahayag nito ang pagtalikod o pag-aalis ng galit mula sa buong pamayanan nang hindi tinutukoy nang higit sa teksto kung sino ang tahasang tagaganap.
- source_word: עַד לַדָּבָר הַזֶּה
  choice: dahil sa bagay na ito
  rationale: Iniuugnay nito ang galit ng Diyos sa usaping nililitis. May bahagyang hirap ang Hebreong pagkakabuo, kaya binanggit sa talababa ang alternatibong mas neutral na ugnayan.
theological_decisions:
- issue: Paglalarawan sa galit ng Diyos
  choice: ang nag-aalab na galit ng ating Diyos
  alternative: ang matinding galit ng ating Diyos
  rationale: Hayagang inilalarawan ng Hebreo ang banal na galit bilang nag-aalab. Pinananatili ito nang hindi pinahihina ang pananalita o nilalagyan ng sistematikong paliwanag na wala sa talata.
- issue: Kaugnayan ng galit ng Diyos sa “bagay na ito”
  choice: dahil sa bagay na ito
  alternative: tungkol sa bagay na ito
  rationale: Malamang na itinuturo ng pangwakas na parirala ang paglabag na sanhi o paksa ng galit, ngunit hindi lubos na tiyak ang sintaktikong ugnayan; kaya inilalahad ang alternatibo sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “kapulungan,” “matatandang pinuno,” at “mga hukom” upang mapanatili ang pampamayanan at administratibong himig, habang iniwasan ang lipas o lubhang teknikal na pananalita.
