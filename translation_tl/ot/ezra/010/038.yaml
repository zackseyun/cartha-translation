lexical_decisions:
- source_word: וּ/בָנִי
  choice: at sina Bani
  rationale: Ang וּ ay pang-ugnay na “at,” at ang בָנִי ay pangalan ng tao. Ginamit ang “sina” bilang likas na panandang Filipino para sa magkakasunod na pangalan.
- source_word: וּ/בִנּוּי
  choice: Binui
  rationale: Pangalan ng tao ang בִנּוּי. Isinatinig itong “Binui,” na malinaw at madaling basahin sa modernong Filipino; ang ugnayang ipinahihiwatig ng וּ ay likas nang naipapakita sa ayos ng listahan.
- source_word: שִׁמְעִי
  choice: Simei
  rationale: Pangalan ng tao ang שִׁמְעִי. Isinatinig itong “Simei,” isang pamilyar na anyo sa mga saling Filipino.
