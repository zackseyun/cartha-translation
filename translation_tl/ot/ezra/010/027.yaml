  yaml_path: translation/ot/ezra/010/027.yaml
  text: 'And from the sons of Zattu: Elioenai, Eliashib, Mattaniah, Jeremoth, Zabad, and Aziza.'
translation:
  language: tl
  text: 'At mula sa mga anak ni Zatu: Elioenai, Eliasib, Matania, Jeremot, Zabad, at Aziza.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/מִ/בְּנֵי
  choice: At mula sa mga anak ni
  rationale: Pinananatili ng “At” ang pagpapatuloy ng talaan, habang tuwirang isinasalin ng “mula sa mga anak ni” ang pang-ukol at construct plural ng בֵּן. Sa ganitong talaangkanan, maaari rin itong tumukoy nang mas malawak sa mga inapo o angkan, ngunit likas at sapat na maluwag sa Filipino ang “mga anak ni.”
- source_word: זַתּוּא
  choice: Zatu
  rationale: Pangalan ng tao o angkan na tinumbasan ayon sa natural na baybay sa Filipino; hindi kailangan ang dobleng katinig na “tt” upang katawanin ang bigkas.
- source_word: אֶלְיוֹעֵנַי
  choice: Elioenai
  rationale: Isinalin sa titik ang pangalang Hebreo sa anyong madaling makilala at bigkasin sa Filipino.
- source_word: אֶלְיָשִׁיב
  choice: Eliasib
  rationale: Ginamit ang “s” para sa tunog na שׁ, alinsunod sa karaniwang ortograpiya at bigkas sa Filipino.
- source_word: מַתַּנְיָה
  choice: Matania
  rationale: Malapit na transliterasyon ng pangalang Hebreo; ipinakikita ng hulaping “-ia” ang elementong יָה nang hindi umaasa sa baybay na hinango sa Ingles.
- source_word: וִֽ/ירֵמוֹת
  choice: Jeremot
  rationale: Transliterasyon sa ortograpiyang Filipino; ang prefixed conjunction ay natural na isinama sa ayos ng listahan sa halip na ulitin bago ang bawat pangalan.
- source_word: וְ/זָבָד
  choice: Zabad
  rationale: Tuwirang transliterasyon ng pangalan; ang conjunction ay kinakatawan ng normal na bantas at pang-ugnay sa listahang Filipino.
- source_word: וַ/עֲזִיזָא
  choice: at Aziza
  rationale: Tuwirang transliterasyon ng pangalan, at ang prefixed waw ay ipinahayag bilang “at” bago ang huling pangalan sa natural na anyo ng isang listahan.
