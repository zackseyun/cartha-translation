  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/עַתָּ֗ה תְּנ֥וּ תוֹדָ֛ה לַ/יהוָ֥ה אֱלֹהֵֽי אֲבֹתֵי/כֶ֖ם וַ/עֲשׂ֣וּ רְצוֹנ֑/וֹ וְ/הִבָּֽדְלוּ֙ מֵ/עַמֵּ֣י הָ/אָ֔רֶץ וּ/מִן הַ/נָּשִׁ֖ים הַ/נָּכְרִיּֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/011.yaml
  text: So now give praise to Yahweh[a], the God of your fathers, and do his will[b]. Separate yourselves from the peoples of the land and from the foreign women.
translation:
  language: tl
  text: Kaya ngayon, magbigay kayo ng papuri kay Yahweh[a], ang Diyos ng inyong mga ninuno, at gawin ninyo ang kanyang kalooban. Ihiwalay ninyo ang inyong mga sarili sa mga mamamayan ng lupain at sa mga banyagang babae.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “magpahayag kayo ng pagkakasala kay Yahweh.” Ang idyomang Hebreo ay maaaring mangahulugang magbigay ng papuri o pasasalamat, o magpahayag ng pagkakasala, depende sa konteksto.
    reason: alternative_reading
  - marker: b
    text: O “sa mga banyagang asawa.” Mga pag-aasawa ang paksa ng mas malawak na konteksto, bagaman “mga banyagang babae” ang literal na sinasabi rito ng Hebreo.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּנוּ תוֹדָה
  choice: magbigay kayo ng papuri
  rationale: Ang idyomang Hebreo ay maaaring tumukoy sa pagpupuri o pagpapahayag ng pagkakasala. Pinananatili ng pangunahing salin ang tuwirang diwa ng pagbibigay ng papuri, habang inilalagay sa talababa ang kontekstuwal na posibilidad na pagpapahayag ng kasalanan.
- source_word: לַיהוָה
  choice: kay Yahweh
  rationale: Tuwirang inililipat ang personal na pangalan ng Diyos upang mapanatili ang pagkakaiba nito sa mga titulong gaya ng Panginoon.
- source_word: אֱלֹהֵי אֲבֹתֵיכֶם
  choice: ang Diyos ng inyong mga ninuno
  rationale: Likas at inklusibong modernong Tagalog ito para sa ancestral language ng Hebreo, nang hindi nawawala ang ugnayang tipan at salinlahi.
- source_word: וַעֲשׂוּ רְצוֹנוֹ
  choice: at gawin ninyo ang kanyang kalooban
  rationale: Malinaw at natural na katumbas ng utos na isagawa ang nais o kalooban ng Diyos.
- source_word: וְהִבָּדְלוּ
  choice: Ihiwalay ninyo ang inyong sarili
  rationale: Ipinakikita nito ang reflexive na puwersa ng Niphal imperative at ang aktibong pananagutan ng pamayanan.
- source_word: מֵעַמֵּי הָאָרֶץ
  choice: sa mga bayan ng lupain
  rationale: Pinananatili ang plural na 'mga bayan' at ang hindi tiyak na Hebreong pariralang 'ng lupain' nang hindi dinaragdagan ang heograpikong kahulugan.
- source_word: וּמִן הַנָּשִׁים הַנָּכְרִיּוֹת
  choice: at sa mga banyagang babae
  rationale: Ang mismong talata ay nagsasabing 'mga banyagang babae,' bagaman ipinakikita ng mas malawak na konteksto na mga asawang babae ang tinutukoy; ang kontekstuwal na alternatibo ay nasa talababa.
theological_decisions:
- issue: Kung ang תּוֹדָה ay papuri/pasalamat o pagpapahayag ng kasalanan
  choice: magbigay kayo ng papuri
  alternative: ipahayag ninyo ang inyong kasalanan kay Yahweh
  rationale: Saklaw ng idyoma ang papuri o pasasalamat at, sa ilang konteksto, ang pagpapahayag ng kasalanan. Dahil sumusunod ang mga utos ng pagsunod at paghihiwalay, kapani-paniwala ang huling diwa, ngunit hindi ito dapat ipalit nang walang pahiwatig sa leksikal na ambiguwidad.
- issue: Kung ang הַנָּשִׁים הַנָּכְרִיּוֹת ay dapat gawing tahasang 'mga banyagang asawa'
  choice: mga banyagang babae
  alternative: mga banyagang asawang babae
  rationale: Hindi tahasang gumagamit ang talata ng salita para sa 'asawa,' kahit malinaw sa konteksto ng kabanata na pag-aasawa ang usapin. Pinananatili sa pangunahing teksto ang pormal na saklaw at inilalagay sa talababa ang kontekstuwal na pagbasa.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang 'mga ninuno' sa halip na mas makitid at maaaring malabong 'mga ama,' at pinanatili ang personal na pangalang Yahweh. Ang mga utos ay tuwiran at natural ang anyo.
