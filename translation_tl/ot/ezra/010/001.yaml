  text: וּ/כְ/הִתְפַּלֵּ֤ל עֶזְרָא֙ וּ/כְ֨/הִתְוַדֹּת֔/וֹ בֹּכֶה֙ וּ/מִתְנַפֵּ֔ל לִ/פְנֵ֖י בֵּ֣ית הָ/אֱלֹהִ֑ים נִקְבְּצוּ֩ אֵלָ֨י/ו מִ/יִּשְׂרָאֵ֜ל קָהָ֣ל רַב מְאֹ֗ד אֲנָשִׁ֤ים וְ/נָשִׁים֙ וִֽ/ילָדִ֔ים כִּֽי בָכ֥וּ הָ/עָ֖ם הַרְבֵּה בֶֽכֶה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/001.yaml
  text: While Ezra was praying and making confession[a], weeping and falling down before the house of God, a very large assembly from Israel gathered to him—men, women, and children—for the people wept bitterly.
translation:
  language: tl
  text: Habang nananalangin at nagpapahayag ng kasalanan si Ezra, umiiyak at nagpapatirapa sa harap ng bahay ng Diyos, nagtipon sa kaniya ang isang napakalaking kapulungan mula sa Israel—mga lalaki, babae, at bata—sapagkat labis ang pag-iyak ng mga tao.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “sapagkat umiyak nang husto ang mga tao.”
    reason: Ipinapakita ang tuwirang pandiwang paraan ng pagsasalin sa Hebreong pariralang הַרְבֵּה בֶכֶה, na literal na nagbibigay-diin sa dami o tindi ng pag-iyak.
lexical_decisions:
- source_word: וּכְהִתְפַּלֵּל עֶזְרָא
  choice: Habang nananalangin ... si Ezra
  rationale: Ipinahihiwatig ng וּכְ ang kasabay at nagpapatuloy na kilos; natural itong ipinahahayag sa Tagalog sa pamamagitan ng “habang.”
- source_word: וּכְהִתְוַדֹּתוֹ
  choice: at ipinahahayag ni Ezra ang kasalanan
  rationale: Ang hitpael ng ידה ay tumutukoy sa pagpapahayag o pagtatapat ng kasalanan. Nilinaw ang ipinahahayag bilang “kasalanan” ayon sa penitensiyal na diwa, nang hindi tinutukoy kung sariling kasalanan lamang ni Ezra o kasalanan ng bayan.
- source_word: בֹּכֶה וּמִתְנַפֵּל
  choice: habang umiiyak at nakahandusay
  rationale: Ang mga anyong ito ay naglalarawan ng nagpapatuloy at kasabay na mga kilos. Ang “nakahandusay” ay nagpapahayag ng pagbagsak o paglapag ng sarili sa lupa nang hindi tiyak na ipinapalagay ang isang partikular na ritwal na posisyon.
- source_word: לִפְנֵי בֵּית הָאֱלֹהִים
  choice: sa harap ng bahay ng Diyos
  rationale: Pinanatili ang Hebreong katawagang “bahay ng Diyos” sa halip na palitan ito ng “templo,” bagaman iyon ang tinutukoy sa konteksto.
- source_word: נִקְבְּצוּ אֵלָיו
  choice: nagtipon sa kaniya
  rationale: Malapit ito sa direksiyon ng אֵלָיו at hindi idinaragdag ang mas interpretibong ideya na pumalibot sila sa kaniya.
- source_word: מִיִּשְׂרָאֵל קָהָל רַב מְאֹד
  choice: ang napakaraming tao mula sa Israel
  rationale: Ang קָהָל ay isang nagkakatipong kapulungan; sa modernong Tagalog, malinaw at natural ang “napakaraming tao” at iniiwasan nito ang posibleng institusyonal o eklesiyastikong dating ng ibang katawagan.
- source_word: אֲנָשִׁים וְנָשִׁים וִילָדִים
  choice: mga lalaki, babae, at bata
  rationale: Tahasang pinanatili ang tatlong pangkat na binanggit sa Hebreo.
- source_word: כִּי בָכוּ הָעָם הַרְבֵּה בֶכֶה
  choice: sapagkat humagulgol nang matindi ang mga tao
  rationale: Pinananatili ng “sapagkat” ang paliwanag na ugnayan. Ang “humagulgol nang matindi” ay natural na naghahatid ng mariing Hebreong pariralang literal na “umiyak nang maraming pag-iyak,” nang hindi nagdaragdag ng tiyak na damdaming gaya ng kapaitan.
theological_decisions:
- issue: Saklaw ng ipinahahayag na kasalanan
  choice: “ipinahahayag ni Ezra ang kasalanan”
  alternative: “ipinagtatapat ni Ezra ang kaniyang kasalanan”
  rationale: Hindi tahasang sinasabi ng talata na sariling kasalanan lamang ni Ezra ang ipinahahayag niya; ang mas bukas na pananalita ay nagpapanatili sa kontekstuwal na posibilidad ng sama-samang pagpapahayag ng kasalanan.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “bahay ng Diyos” upang mapanatili ang larawan ng Hebreo, at “humagulgol nang matindi” upang natural na maipahayag ang matinding pag-iyak nang hindi magdagdag ng teolohikal o emosyonal na pagpapakahulugan.
