  text: Then all the assembly answered and said with a loud voice[a], “Yes, according to your words, so it is upon us to do.”
translation:
  language: tl
  text: Sumagot ang buong kapulungan at sinabi nang malakas, “Oo, ayon sa iyong mga sinabi, tungkulin naming gawin iyon.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲנוּ
  choice: Sumagot
  rationale: Sa kontekstong ito, ipinakikilala ng ענה ang tugon ng kapulungan sa panawagan ni Ezra; natural at tuwiran ang “sumagot” sa Filipino.
- source_word: כָל הַקָּהָל
  choice: ang buong kapulungan
  rationale: Ang קָהָל ay ang nagkakatipong pamayanan. Pinananatili ng “kapulungan” ang kolektibo at pampublikong diwa, at ipinahahayag ng “buong” ang כָל.
- source_word: וַיֹּאמְרוּ
  choice: at sinabi
  rationale: Karaniwang pandiwa ng pagsasalita ang אמר. Ang “sumagot ... at sinabi” ay sadyang nagpapanatili sa magkatambal na pandiwa ng Hebreo, bagaman may bahagyang pag-uulit sa Filipino.
- source_word: קוֹל גָּדוֹל
  choice: nang malakas
  rationale: Literal itong “malakas/dakilang tinig.” Ang “nang malakas” ang mas likas na modernong Filipino at malinaw na naghahatid ng hayagan at mariing tugon ng lahat.
- source_word: כֵּן
  choice: Oo
  rationale: Dito, ang כֵּן ay nagpapahayag ng tuwirang pagsang-ayon sa iminungkahi ni Ezra; likas itong tumbasan ng “Oo.”
- source_word: כִּדְבָרֶיךָ
  choice: ayon sa iyong mga sinabi
  rationale: Pinananatili nito ang diwa ng pangmaramihang דְבָרֶיךָ, “iyong mga salita,” habang mas natural sa Filipino ang “mga sinabi” sa kontekstong tumutukoy sa naunang pahayag.
- source_word: עָלֵינוּ
  choice: tungkulin naming
  rationale: Ang literal na “nasa ibabaw namin” ay idyoma ng pananagutang nakaatang sa mga nagsasalita. Ang “tungkulin naming” ay malinaw at natural na naghahatid ng obligasyon nang hindi dinaragdagan ang uri o pinagmulan nito.
- source_word: לַעֲשׂוֹת
  choice: gawin iyon
  rationale: Malawak ang kahulugan ng עשה na “gawin.” Idinagdag ang “iyon” bilang likas na layon sa Filipino, na tumutukoy sa mga sinabi ni Ezra at hindi nagdaragdag ng bagong nilalaman.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang pormal na kolektibong katawagang “kapulungan” at ang dobleng pandiwa na “sumagot ... at sinabi,” ngunit ginawang natural ang Hebreong idyoma ng obligasyon bilang “tungkulin naming gawin iyon.”
