  text: 'From the sons of Hashum: Mattenai[a], Mattattah, Zabad, Eliphelet, Jeremai, Manasseh, and Shimei.'
translation:
  language: tl
  text: 'Mula sa mga anak ni Hashum: Matenai, Matata[a], Zabad, Elifelet, Jeremai, Manases, at Shimei.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring baybayin ang pangalang ito na “Mattattah” sa mas mahigpit na transliterasyon mula sa Hebreo.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִ/בְּנֵי
  choice: Mula sa mga anak ni
  rationale: Ipinakikilala ng מִן kasama ng בְּנֵי ang mga kasaping nagmula sa isang angkan; pinananatili ng “Mula sa mga anak ni” ang diwa ng talaang pampamilya.
- source_word: חָשֻׁם
  choice: Hashum
  rationale: Isinalin-titik ang pangalan at pinanatili ang tunog na sh ng Hebreo sa paraang madaling kilalanin sa modernong Filipino.
- source_word: מַתְּנַי
  choice: Matenai
  rationale: Isinalin-titik ang pangalan ayon sa natural na baybay sa Filipino, nang hindi na pinananatili ang dobleng katinig na hindi kailangan sa pagbigkas.
- source_word: מַתַּתָּה
  choice: Matata
  rationale: Isinalin-titik sa payak at natural na baybay-Filipino; inilagay sa talababa ang mas mahigpit na alternatibong transliterasyon.
- source_word: זָבָד
  choice: Zabad
  rationale: Tuwirang transliterasyon ng pangalang Hebreo.
- source_word: אֱלִיפֶלֶט
  choice: Elifelet
  rationale: Ginamit ang natural na anyong Filipino, kung saan ang p/tunog na ph ay isinusulat na f.
- source_word: יְרֵמַי
  choice: Jeremai
  rationale: Tuwirang transliterasyon na pinananatili ang hulaping tunog ng pangalang Hebreo.
- source_word: מְנַשֶּׁה
  choice: Manases
  rationale: Ginamit ang nakikilalang anyong Filipino ng pangalan habang malapit pa rin sa bigkas ng Hebreo.
- source_word: שִׁמְעִי
  choice: Shimei
  rationale: Pinanatili ang sh at ang karaniwang transliterasyong Shimei upang maipakita nang mas malinaw ang anyong Hebreo.
