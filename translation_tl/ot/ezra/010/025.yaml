base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/025.yaml
  text: 'And from Israel[a], from the sons of Parosh: Ramiah, Izziah, Malkijah, Mijamin, Eleazar, Malkijah, and Benaiah.'
translation:
  language: tl
  text: 'At mula sa Israel—mula sa mga anak ni Paros: sina Ramias, Izias, Malquias, Mijamin, Eleazar, Malquias[a], at Benaias.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalawang ulit na binabanggit sa tekstong Hebreo ang pangalang Malquias sa talaang ito, malamang na tumutukoy sa dalawang magkaibang lalaking magkapangalan.
    reason: Nililinaw na sinadya ang pagpapanatili sa inuulit na pangalan sa Hebreo at hindi ito pagkakamali sa pagkopya ng salin.
lexical_decisions:
- source_word: וּמִיִּשְׂרָאֵל
  choice: At mula sa Israel
  rationale: Pinananatili ang pangatnig at ang pariralang nagpapakilalang nagmula sa Israel, bilang pagpapatuloy ng naunang talaan.
- source_word: מִבְּנֵי
  choice: mula sa mga anak ni
  rationale: Ang literal na “mga anak ni” ay angkop sa anyo ng talaang angkan at maaari ring tumukoy sa mga inapo o kasapi ng sambahayan.
- source_word: פַרְעֹשׁ
  choice: Paros
  rationale: Isinalin sa baybay na natural sa Filipino ang pangalang Hebreo.
- source_word: רַמְיָה
  choice: Ramias
  rationale: Ginamit ang nakaugaliang anyong Filipino ng pangalang Hebreo.
- source_word: יִזִּיָּה
  choice: Izias
  rationale: Ginamit ang malinaw at natural na transliterasyon sa Filipino.
- source_word: מַלְכִּיָּה
  choice: Malquias
  rationale: Parehong anyo ang pinanatili sa dalawang paglitaw ng pangalan upang katawanin nang tapat ang pag-uulit sa tekstong Hebreo.
- source_word: מִיָּמִן
  choice: Mijamin
  rationale: Malapit na transliterasyon ng pangalang Hebreo na madaling basahin sa Filipino.
- source_word: אֶלְעָזָר
  choice: Eleazar
  rationale: Ito ang matatag at kilalang anyo ng pangalan sa Filipino.
- source_word: בְנָיָה
  choice: Benaias
  rationale: Ginamit ang natural na anyong Filipino ng pangalang Hebreo.
