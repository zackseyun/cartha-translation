base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/022.yaml
  text: 'And from the sons of Pashhur: Elioenai, Maaseiah, Ishmael, Nethanel, Jozabad, and Elasah.'
translation:
  language: tl
  text: 'At mula sa mga anak ni Pashur: sina Elioenai, Maaseias, Ismael, Netanel, Jozabad, at Elasa.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/מִ/בְּנֵי
  choice: At mula sa mga anak ni
  rationale: Pinananatili ng “At” ang pang-ugnay, at ng “mula sa mga anak ni” ang diwang partitibo ng parirala habang natural sa makabagong Tagalog.
- source_word: פַּשְׁחוּר
  choice: Pashur
  rationale: Isinalin sa baybay na madaling basahin sa Tagalog at malapit sa anyong Hebreo.
- source_word: אֶלְיוֹעֵינַי
  choice: Elioenai
  rationale: Transliterasyon ng pangalang pantangi na malinaw at madaling makilala.
- source_word: מַעֲשֵׂיָה
  choice: Maaseias
  rationale: Ginamit ang nakaugaliang anyong biblikal sa Tagalog, na kumakatawan sa pangalang Hebreo.
- source_word: יִשְׁמָעֵאל
  choice: Ismael
  rationale: Ginamit ang pamilyar na anyong Tagalog ng pangalang Hebreo.
- source_word: נְתַנְאֵל
  choice: Netanel
  rationale: Transliterasyong malapit sa bigkas ng Hebreo at natural basahin sa Tagalog.
- source_word: יוֹזָבָד
  choice: Jozabad
  rationale: Pinanatili ang kinikilalang anyong biblikal ng pangalang pantangi.
- source_word: וְ/אֶלְעָשָׂה
  choice: at Elasa
  rationale: Hayagang isinalin ang pang-ugnay na וְ bilang “at,” at tinumbasan ang pangalan sa payak na transliterasyong Tagalog.
