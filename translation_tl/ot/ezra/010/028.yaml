  text: 'And from the sons of Bebai: Jehohanan[a], Hananiah, Zabbai[b], Athlai.'
translation:
  language: tl
  text: 'Mula naman sa mga anak ni Bebai[a]: Jehohanan[b], Hanania, Zabbai, at Atlai.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Hebreong “mga anak” ay maaari ring tumukoy nang mas malawak sa mga inapo o mga kabilang sa angkan ni Bebai.
    reason: lexical_alternative
  - marker: b
    text: Ang Jehohanan ay tinatawag ding Johanan o Yohanan sa ilang salin.
    reason: alternative_reading
lexical_decisions:
- source_word: וּ/מִ/בְּנֵי
  choice: Mula naman sa mga anak ni
  rationale: Pinananatili ng “mga anak” ang anyong Hebreo, habang ang “mula naman sa” ay natural na naghuhudyat ng kasunod na pangkat sa isang talaan. Sa kontekstong ito, maaaring mas malawak ang saklaw nito kaysa sa mga tuwirang anak lamang.
- source_word: בֵּבָי
  choice: Bebai
  rationale: Pangalan ng tao o angkan; isinalin sa baybay na malapit sa Hebreo at madaling basahin sa Filipino.
- source_word: יְהוֹחָנָן
  choice: Jehohanan
  rationale: Pinananatili ang buong anyo ng pangalang Hebreo, kasama ang bahaging teoporiko, sa halip na paikliin ito bilang Johanan o Yohanan.
- source_word: חֲנַנְיָה
  choice: Hanania
  rationale: Transliterasyong angkop sa bigkas at baybay sa Filipino; hindi kailangan ang hulíng h upang katawanin ang hulíng pantig ng pangalang Hebreo.
- source_word: זַבַּי
  choice: Zabbai
  rationale: Direktang transliterasyon ng pangalang Hebreo, na pinananatili ang dobleng b at karaniwang anyong Zabbai.
- source_word: עַתְלָי
  choice: Atlai
  rationale: Direktang transliterasyon sa natural na baybay-Filipino; ang Hebreong titik na tav ay kinakatawan ng t, hindi ng English na th.
theological_decisions: []
translation_notes:
  register: Makabagong Filipino na malinaw at marangal. Ginamit ang “mula naman sa” upang maging natural ang pagpapatuloy ng talaan, ngunit pinanatili ang “mga anak” at ipinaliwanag sa talababa ang mas malawak na kahulugan nito bilang katawagan sa angkan. Ang mga pangalan ay inilapit sa anyong Hebreo habang sinusunod ang nababasang baybay sa Filipino.
