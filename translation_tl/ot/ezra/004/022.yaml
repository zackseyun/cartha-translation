translation:
  language: tl
  text: At mag-ingat kayong huwag magpabaya sa pagsasagawa nito.[a] Bakit lalaki ang pinsala sa kapinsalaan ng mga hari?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Maging maingat kayo na huwag magpabaya sa pagtupad nito.”'
    reason: lexical_alternative
  - marker: b
    text: “Mga hari” ang tahasang anyong maramihan sa Aramaiko. Maaaring mas malawak itong tumukoy sa kapakanan ng mga naghahari o ng dinastiya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּזְהִירִין הֱווֹ
  choice: mag-ingat kayo
  rationale: Ang pang-uri na may pantulong na pandiwa ay bumubuo ng utos na maging maingat o mapagbantay; natural at malinaw sa modernong Tagalog ang “mag-ingat kayo.”
- source_word: שָׁלוּ לְמֶעְבַּד
  choice: huwag magpabaya sa pagsasagawa
  rationale: Ipinahihiwatig ng parirala ang kapabayaan o pagpapabaya sa pagtupad sa iniutos, hindi lamang isang di-sinasadyang pagkakamali.
- source_word: עַל דְּנָה
  choice: nito
  rationale: Tumutukoy ito sa utos ng hari na binanggit sa naunang konteksto; sapat at likas sa Tagalog ang panghalip na “nito.”
- source_word: לְמָה יִשְׂגֵּא
  choice: Bakit hahayaang lumaki
  rationale: Pinananatili nito ang retorikal na tanong at ang diwa na hindi dapat pahintulutang lumubha ang pinsala.
- source_word: חֲבָלָא
  choice: ang pinsala
  rationale: Ang salita ay tumutukoy sa kapinsalaan o perhuwisyong bunga ng hindi pagsunod; ang “pinsala” ay malinaw sa karaniwang Tagalog.
- source_word: לְהַנְזָקַת
  choice: sa kapahamakan ng
  rationale: Ipinapahayag ng anyo ang masamang bunga o disbentaha para sa mga hari; pinananatili ng “sa kapahamakan ng” ang diin nang hindi inuulit ang “pinsala.”
- source_word: מַלְכִין
  choice: mga hari
  rationale: Tahasan ang anyong maramihan sa Aramaiko, kaya hindi ito pinasimple bilang “hari.”
