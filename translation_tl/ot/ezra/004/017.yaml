  text: פִּתְגָמָ֞/א שְׁלַ֣ח מַלְכָּ֗/א עַל רְח֤וּם בְּעֵל טְעֵם֙ וְ/שִׁמְשַׁ֣י סָֽפְרָ֔/א וּ/שְׁאָר֙ כְּנָוָ֣תְ/ה֔וֹן דִּ֥י יָתְבִ֖ין בְּ/שָֽׁמְרָ֑יִן וּ/שְׁאָ֧ר עֲבַֽר נַהֲרָ֛/ה שְׁלָ֖ם וּ/כְעֶֽת־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/017.yaml
  text: 'The king sent a reply to Rehum the commander[a], Shimshai the scribe, and the rest of their associates who live in Samaria, and the rest beyond the River: Peace[c][b]. And now—'
translation:
  language: tl
  text: 'Nagpadala ang hari ng sagot kay Rehum na punong opisyal[a], kay Simsai na kalihim, at sa iba pa nilang mga kasamahan na naninirahan sa Samaria at sa iba pa sa Kabila ng Ilog[b]: Kapayapaan[c]. At ngayon—'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “kansilyer” o “opisyal na namamahala.” Hindi tiyak ang eksaktong katumbas ng titulong Aramaiko.
    reason: lexical_alternative
  - marker: b
    text: Ang “Kabila ng Ilog” ay tawag sa rehiyong pinamamahalaan ng Persia sa kanluran ng Ilog Eufrates.
    reason: cultural_note
  - marker: c
    text: O “Pagbati.”
    reason: lexical_alternative
lexical_decisions:
- source_word: פִּתְגָמָא
  choice: sagot
  rationale: Tumutukoy ito rito sa opisyal na tugon ng hari sa naunang liham; natural at malinaw sa makabagong Tagalog ang “sagot.”
- source_word: שְׁלַח
  choice: nagpadala
  rationale: Karaniwang kahulugan ng pandiwa ang pagpapadala; ang aspektong naganap ay angkop sa salaysay.
- source_word: מַלְכָּא
  choice: ang hari
  rationale: Tiyak ang anyo at tumutukoy sa hari ng Persia na nabanggit na sa konteksto.
- source_word: עַל
  choice: kay
  rationale: Sa pormulang ito ng liham, ipinakikilala ng pang-ukol ang mga tumanggap ng sagot.
- source_word: בְּעֵל טְעֵם
  choice: punong opisyal
  rationale: Hindi tiyak ang eksaktong katungkulan. Iniiwasan ng “punong opisyal” ang sobrang tiyak na “kumandante” o “kansilyer” habang ipinahihiwatig ang mataas na tungkuling administratibo.
- source_word: סָפְרָא
  choice: kalihim
  rationale: Sa kontekstong administratibo, ang opisyal na tagapagsulat o sekretaryo ang tinutukoy; mas natural sa makabagong Tagalog ang “kalihim” kaysa “eskriba.”
- source_word: שְׁאָר כְּנָוָתְהוֹן
  choice: iba pa nilang mga kasamahan
  rationale: Malawak ang katawagan sa mga taong kaugnay o kapanig ng dalawang opisyal; pinananatili ng “mga kasamahan” ang lawak na iyon.
- source_word: דִּי יָתְבִין בְּשָׁמְרָיִן
  choice: na naninirahan sa Samaria
  rationale: Tuwirang ipinapahayag ng participle ang paninirahan o pagkakatira.
- source_word: וּשְׁאָר עֲבַר נַהֲרָה
  choice: at sa iba pa sa Kabila ng Ilog
  rationale: Walang tahasang salitang “lalawigan” sa Aramaiko. Ang “Kabila ng Ilog” ay pinanatili bilang pangalang administratibo at ipinaliwanag sa talababa.
- source_word: שְׁלָם
  choice: Kapayapaan
  rationale: Pormula ito ng pagbati sa liham, ngunit pinananatili ng salin ang literal na diwang “kapayapaan”; ibinibigay sa talababa ang natural na alternatibo.
- source_word: וּכְעֶת
  choice: At ngayon—
  rationale: Pormula itong nagbubukas sa nilalaman ng tugon. Ipinakikita ng gitling na nagpapatuloy ang pangungusap sa susunod na talata.
theological_decisions: []
translation_notes:
  register: Makabagong Filipino na pormal ngunit madaling maunawaan. Ginamit ang “Simsai” ayon sa karaniwang pagbabaybay na Filipino, “kalihim” para sa administratibong סָפְרָא, at “punong opisyal” upang hindi magtakda ng sobrang tiyak na katungkulan para sa malabong titulong בְּעֵל טְעֵם. Ang lahat ng marker ng talababa ay nasa mismong teksto.
