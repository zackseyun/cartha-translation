  yaml_path: translation/ot/ezra/004/014.yaml
  text: Because we eat the salt of the palace, and it is not fitting for us to see the king’s dishonor, therefore we have sent and informed the king,
translation:
  language: tl
  text: Sapagkat kumakain kami ng asin ng palasyo, at hindi nararapat para sa amin na makita ang kahihiyan ng hari, kaya nagpadala kami at nagbigay-alam sa hari,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מְלַח הֵיכְלָא מְלַחְנָא
  choice: kumakain kami ng asin ng palasyo
  rationale: Pinananatili ang kongkretong idyomang Aramaiko na tumutukoy sa pagtanggap ng panustos o kabuhayan mula sa palasyo, nang hindi nililimitahan ang kahulugan sa isang paliwanag lamang.
- source_word: עַרְוַת מַלְכָּא
  choice: malapastangan ang hari
  rationale: Ang עַרְוָה ay literal na kahubaran ngunit dito ay tumutukoy sa kahihiyan, kapintasan, o paglapastangan sa dangal ng hari; natural sa Filipino ang pandiwang ayos.
- source_word: לְמֶחֱזֵא
  choice: makita
  rationale: Tuwirang katumbas ng pandiwang 'makakita'; hindi pinalalakas tungo sa 'masaksihan' kung hindi kailangan.
- source_word: שְׁלַחְנָא וְהוֹדַעְנָא
  choice: ipinadala namin ang liham na ito upang ipaalam
  rationale: Sa konteksto ng liham, ipinahihiwatig ng 'nagpadala kami at nagpaalam kami' na ang ipinadala ay ang mensaheng ito; ginawang likas sa Filipino habang pinananatili ang dalawang kilos.
theological_decisions: []
translation_notes:
  register: Makabagong Filipino na magalang at angkop sa isang opisyal na liham. Pinanatili ang sinaunang idyomang “kumakain ng asin ng palasyo” sa halip na tahasang ipakahulugang “tumatanggap ng suweldo,” upang hindi mawala ang kulay at lawak ng orihinal.
