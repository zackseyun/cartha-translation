  text: וּ/מִנִּ/י֮ שִׂ֣ים טְעֵם֒ וּ/בַקַּ֣רוּ וְ/הַשְׁכַּ֔חוּ דִּ֚י קִרְיְתָ֣/א דָ֔ךְ מִן יוֹמָת֙ עָֽלְמָ֔/א עַל מַלְכִ֖ין מִֽתְנַשְּׂאָ֑ה וּ/מְרַ֥ד וְ/אֶשְׁתַּדּ֖וּר מִתְעֲבֶד בַּֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/019.yaml
  text: And a decree was issued by me[a], and they searched and found that this city has from ancient days risen up against kings[b], and rebellion and sedition have been carried out in it.
translation:
  language: tl
  text: At nagpalabas ako ng utos, at nagsiyasat sila at natuklasang mula pa noong unang panahon ay bumabangon ang lunsod na ito laban sa mga hari[a], at ginagawa rito ang paghihimagsik at pag-aaklas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nagmamataas laban sa mga hari.” Maaaring magpahiwatig ang pandiwang Aramaiko ng pagtataas sa sarili, ngunit sa kontekstong ito ay tumutukoy ito sa pagbangon upang sumalungat.
    reason: lexical_alternative
  - marker: b
    text: O “rebelyon at sedisyon.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִנִּי שִׂים טְעֵם
  choice: nagpalabas ako ng utos
  rationale: Likas na pahayag sa Filipino para sa Aramaikong idyomang literal na ‘magtakda ng utos’; malinaw rin na ang hari ang pinagmulan ng utos.
- source_word: וּבַקַּרוּ וְהַשְׁכַּחוּ
  choice: nagsiyasat sila at natuklasan
  rationale: Ipinahihiwatig ng konteksto ang opisyal na pagsusuri sa mga tala at ang naging resulta nito.
- source_word: קִרְיְתָא דָךְ
  choice: ang lunsod na ito
  rationale: Tinutukoy ng demonstratibo ang lunsod na kasalukuyang pinag-uusapan; dignified at madaling maunawaan ang ‘lunsod.’
- source_word: מִן יוֹמָת עָלְמָא
  choice: mula pa noong unang panahon
  rationale: Natural na katumbas ng idyomang tumutukoy sa matagal nang nakaraan.
- source_word: עַל מַלְכִין מִתְנַשְּׂאָה
  choice: bumabangon ... laban sa mga hari
  rationale: Pinananatili ang larawan ng pagbangon o pagtataas ng sarili sa pagsalungat, nang hindi ito lubusang ipinapantay sa kasunod na tahasang ‘paghihimagsik.’
- source_word: וּמְרַד וְאֶשְׁתַּדּוּר
  choice: paghihimagsik at pag-aaklas
  rationale: Dalawang magkaugnay ngunit hindi ganap na magkaparehong terminong pampolitika ang ginamit upang katawanin ang pagrebeldeng laban sa pamahalaan at ang mapanghimagsik na pagkilos.
- source_word: מִתְעֲבֶד בַּהּ
  choice: ginagawa rito
  rationale: Tuwirang pinananatili ang impersonal/passive na diwa na ang gayong mga gawain ay isinasagawa sa lunsod.
