translation_notes:
  register: Modernong Filipino na may dignidad at malinaw na himig ng opisyal na liham. Pinanatili ang bahagyang pagkakaiba ng dalawang terminong pampolitika at ang maaaring diwa ng pagtataas sa sarili sa pandiwang ‘bumabangon.’
