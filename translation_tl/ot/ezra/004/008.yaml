translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “pinunong opisyal” upang ihayag ang administratibong awtoridad habang pinananatili sa talababa ang kawalang-katiyakan sa eksaktong titulo. Ang ayos ng pangungusap ay bahagyang inayos para sa likas na daloy sa Filipino.
