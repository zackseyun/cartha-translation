  yaml_path: translation/ot/ezra/004/008.yaml
  text: Rehum the commander and Shimshai the scribe wrote a letter against Jerusalem to King Artaxerxes as follows:[a]
translation:
  language: tl
  text: 'Si Rehum, ang punong opisyal,[a] at si Shimshai, ang eskriba, ay sumulat ng isang liham laban sa Jerusalem para kay Haring Artajerjes. Ganito ang nilalaman nito:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “tagapamahala.” Ang Aramaikong titulong בְּעֵל טְעֵם ay tumutukoy sa isang opisyal, ngunit hindi tiyak ang eksaktong katumbas na tungkulin nito sa pamahalaang Persiano.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּעֵל טְעֵם
  choice: pinunong opisyal
  rationale: Isang opisyal na titulong Aramaiko na nagpapahiwatig ng kapangyarihang administratibo, ngunit hindi tiyak ang eksaktong katumbas na katungkulan sa pamahalaang Persiano. Likas at malinaw sa modernong Filipino ang “pinunong opisyal” nang hindi labis na nililimitahan ang kahulugan.
- source_word: סָפְרָא
  choice: eskriba
  rationale: Tumutukoy sa isang opisyal na tagasulat o kalihim. Pinananatili ng “eskriba” ang kaugnayang leksikal at pamilyar ito sa kontekstong biblikal.
- source_word: כְּתַבוּ
  choice: sumulat
  rationale: Tuwirang inilalahad ang kilos ng pagsulat at natural sa Filipino.
- source_word: אִגְּרָה חֲדָה
  choice: isang liham
  rationale: Maaaring mangahulugan ang חֲדָה ng “isa,” ngunit maaari rin itong magsilbing panandang di-tiyak sa Aramaikong Imperyal. Ang “isang liham” ay natural at hindi nagbibigay ng di-kinakailangang diin sa bilang.
- source_word: עַל יְרוּשְׁלֶם
  choice: laban sa Jerusalem
  rationale: Bagaman maaari itong mangahulugang “tungkol sa,” ipinakikita ng konteksto na ang liham ay mapanumbat at salungat sa Jerusalem; kaya ang “laban sa” ang angkop na kontekstuwal na diwa.
- source_word: לְאַרְתַּחְשַׁשְׂתְּא מַלְכָּא
  choice: kay Haring Artajerjes
  rationale: Natural na ayos sa Filipino na pinananatili kapwa ang titulong maharlika at ang pangalan.
- source_word: כְּנֵמָא
  choice: 'Ganito ang nilalaman nito:'
  rationale: Nagsisilbing panandang diskurso na nagpapakilala sa mismong nilalaman ng liham sa susunod na talata.
- source_word: רְחוּם
  choice: Rehum
  rationale: Transliterasyon ng pangalang pantangi.
- source_word: שִׁמְשַׁי
  choice: Shimshai
  rationale: Transliterasyon ng pangalang pantangi.
- source_word: אַרְתַּחְשַׁשְׂתְּא
  choice: Artajerjes
  rationale: Ginamit ang nakagawiang anyong Filipino ng pangalan ng hari.
