language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וּ/בִ/ימֵ֣י אַרְתַּחְשַׁ֗שְׂתָּא כָּתַ֨ב בִּשְׁלָ֜ם מִתְרְדָ֤ת טָֽבְאֵל֙ וּ/שְׁאָ֣ר כנות/ו עַל ארתחששתא מֶ֣לֶךְ פָּרָ֑ס וּ/כְתָב֙ הַֽ/נִּשְׁתְּוָ֔ן כָּת֥וּב אֲרָמִ֖ית וּ/מְתֻרְגָּ֥ם אֲרָמִֽית־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/007.yaml
  text: And in the days of Artaxerxes[a], Bishlam, Mithredath, Tabeel, and the rest of his associates wrote to Artaxerxes king of Persia[b]. The text of the letter was written in Aramaic and translated from Aramaic.
translation:
  language: tl
  text: Noong panahon ni Artajerjes, sumulat sina Bislam, Mitredat, Tabeel, at ang iba pa niyang mga kasamahan[a] kay Artajerjes, na hari ng Persiya. Ang teksto ng liham ay nakasulat sa Aramaiko at isinalin sa Aramaiko.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kanilang mga kasamahan.” Pang-isahan ang anyo ng hulapi sa “niyang,” ngunit maaaring kolektibo ang tinutukoy na pangkat.
    reason: lexical_alternative
  - marker: b
    text: O “Ang dokumento ay isinulat sa sulat-Aramaiko at ipinaliwanag sa wikang Aramaiko.” Mahirap ang pananalita sa orihinal, at hindi tiyak kung ipinag-iiba nito ang uri ng sulat at ang wika, o ang pagsulat at ang pagsasalin/pagpapaliwanag.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִימֵי
  choice: Noong panahon ni
  rationale: Natural na modernong Tagalog para sa temporal na idyomang “sa mga araw ni,” nang hindi ito ginagawang teknikal na pormula tungkol sa paghahari.
- source_word: אַרְתַּחְשַׁשְׂתָּא
  choice: Artajerjes
  rationale: Karaniwang anyong Filipino ng pangalan ng hari.
- source_word: כָּתַב
  choice: sumulat
  rationale: Pinananatili ang payak na kahulugan ng pandiwa; hindi idinaragdag ang “sakdal” o “paratang,” na hindi tahasang binanggit sa talata.
- source_word: בִּשְׁלָם מִתְרְדָת טָבְאֵל
  choice: Bislam, Mitredat, Tabeel
  rationale: Mga transliterasyong angkop sa tunog at baybay ng modernong Filipino.
- source_word: וּשְׁאָר כנותו
  choice: at ang iba pa niyang mga kasamahan
  rationale: Ang שְׁאָר ay “ang iba pa/nalalabi,” at ang mahirap na כנותו ay nauunawaang “mga kasamahan.” Pinanatili sa pangunahing teksto ang pang-isahang hulaping “niya.”
- source_word: עַל
  choice: kay
  rationale: Sa kontekstong administratibo kasama ng “sumulat,” likas itong tumutukoy sa pinadalhan, nang hindi ipinapasok ang diwa ng “laban kay” mula sa konteksto.
- source_word: מֶלֶךְ פָּרָס
  choice: na hari ng Persia
  rationale: Malinaw at natural na panandang appositional sa Tagalog.
- source_word: וּכְתָב הַנִּשְׁתְּוָן
  choice: Ang teksto ng liham
  rationale: Ipinahahayag na ang tinutukoy ay ang nakasulat na nilalaman ng dokumento o liham.
- source_word: כָּתוּב אֲרָמִית
  choice: ay nakasulat sa Aramaico
  rationale: Malawak at mababasang salin na maaaring tumukoy sa wikang ginamit; inilalahad sa talababa ang posibleng pagtukoy sa sulat o mga titik-Aramaico.
- source_word: וּמְתֻרְגָּם אֲרָמִית
  choice: at isinalin sa Aramaico
  rationale: Pinananatili ang karaniwang diwa ng ugat na “isalin/ipaliwanag” at ang pag-uulit ng “Aramaico,” kahit mahirap ang eksaktong ugnayan ng dalawang parirala.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “Noong panahon ni” sa halip na ang mas literal ngunit hindi gaanong natural na “sa mga araw ni.” Pinanatili ang kakaibang pag-uulit ng “Aramaico” sa pangunahing teksto upang hindi tahimik na lutasin ang tunay na kalabuan ng pinagmulan.
