  text: The document that you sent to us has been read plainly before me[a].
translation:
  language: tl
  text: Ang kasulatang ipinadala ninyo sa amin ay binasa nang malinaw sa harapan ko.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Ang liham na ipinadala ninyo sa amin ay malinaw na binasa sa harapan ko.”
    reason: lexical_alternative
lexical_decisions:
- source_word: נִשְׁתְּוָנָא
  choice: kasulatan
  rationale: Tumutukoy ito sa isang opisyal na nakasulat na komunikasyon sa kontekstong administratibo. Sapat ang lawak ng “kasulatan,” samantalang nananatiling posible ang “liham.”
- source_word: דִּי
  choice: -ng
  rationale: Ang kaugnayang ipinahihiwatig ng relatibong partikulo ay likas na naipapahayag sa Filipino sa pamamagitan ng pang-angkop sa “kasulatang ipinadala ninyo.”
- source_word: שְׁלַחְתּוּן
  choice: ipinadala ninyo
  rationale: Ikalawang panauhang maramihan at ganap na aspekto; natural sa Filipino ang “ipinadala ninyo” para sa natapos na kilos.
- source_word: עֲלֶינָא
  choice: sa amin
  rationale: Sa konteksto ng liham sa hukuman, ang kahulugan ay ang pagpapadala patungo sa hari at sa kaniyang korte, hindi “laban sa amin.”
- source_word: מְפָרַשׁ
  choice: nang malinaw
  rationale: Pinananatili nito ang diwa ng malinaw o tahasang pagbasa nang hindi ipinapalagay kung may kasamang pagsasalin o pagpapaliwanag.
- source_word: קֱרִי
  choice: ay binasa
  rationale: 'Ang konteksto ay nangangailangan ng balintiyak na diwa: binasa ang kasulatan sa presensiya ng hari.'
- source_word: קָדָמָי
  choice: sa harapan ko
  rationale: Likas at marangal na katumbas ito ng pormulang panghukuman na nangangahulugang ginawa sa presensiya ng hari.
theological_decisions: []
translation_notes:
  register: Gumamit ng makabagong ngunit marangal na Filipino. Ang “kasulatan” ay angkop sa opisyal na dokumento, at ang “sa harapan ko” ay nagpapanatili sa pormal na himig ng pahayag ng hari.
