  naturalness: Pormal at likas ang kabuuang himig. Mas malinaw at mas natural sa kontekstong pagtatayo ang 'makumpleto ang mga pader nito' kaysa 'matapos ang mga pader nito.'
  terminology: Ang 'tributo, buwis, o singil sa pagdaan' ay malinaw at angkop na magkakaibang katumbas ng tatlong terminong piskal. Ang 'pinsala' sa pangunahing teksto ay pinananatiling malawak, at ang 'pagkalugi' ay ligtas na inilalagay bilang alternatibo sa talababa.
