  text: כְּעַ֗ן יְדִ֨יעַ֙ לֶהֱוֵ֣א לְ/מַלְכָּ֔/א דִּ֠י הֵ֣ן קִרְיְתָ֥/א דָךְ֙ תִּתְבְּנֵ֔א וְ/שׁוּרַיָּ֖/ה יִֽשְׁתַּכְלְל֑וּן מִנְדָּֽה בְל֤וֹ וַ/הֲלָךְ֙ לָ֣א יִנְתְּנ֔וּן וְ/אַפְּתֹ֥ם מַלְכִ֖ים תְּהַנְזִֽק־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/013.yaml
  text: Now let it be known to the king that if this city is rebuilt and its walls are completed, they will not pay tribute, tax, or toll, and in the end it will damage the revenue of the kings.
translation:
  language: tl
  text: Ngayon, ipaalam sa hari na kung muling maitayo ang lungsod na ito at makumpleto ang mga pader nito, hindi sila magbabayad ng tributo, buwis, o singil sa pagdaan, at sa bandang huli ay magdudulot ito ng pinsala sa mga hari.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “at sa bandang huli ay magdudulot ito ng pagkalugi sa mga hari.” Maikli ang pahayag sa Aramaico, at hindi nito tahasang sinasabi kung ang tinutukoy ay pagkawala ng kita o mas pangkalahatang pinsala.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּעַן
  choice: Ngayon
  rationale: Panandang pandiskurso ito na nagpapasok sa babala o kongklusyon; pinananatili ng “Ngayon” ang transisyon nang hindi ito ginagawang tahasang sanhi o bunga.
- source_word: יְדִיעַ לֶהֱוֵא לְמַלְכָּא
  choice: ipaalam sa hari
  rationale: Likas at marangal na katumbas sa modernong Tagalog ng pormal na pormula sa liham na “maging alam sa hari.”
- source_word: דִּי הֵן
  choice: na kung
  rationale: Ipinapasok nito ang nilalaman ng pabatid sa pamamagitan ng isang kondisyong sugnay.
- source_word: קִרְיְתָא דָךְ
  choice: ang lungsod na ito
  rationale: Tuwirang pinananatili ang demonstratibong pagtukoy sa Jerusalem mula sa pananaw ng mga sumulat.
- source_word: תִּתְבְּנֵא
  choice: muling maitayo
  rationale: Ipinahihiwatig ng konteksto ang pagpapanumbalik ng nawasak na lungsod; ang anyong may “ma-” ay angkop sa kondisyong sugnay.
- source_word: וְשׁוּרַיָּה יִשְׁתַּכְלְלוּן
  choice: at matapos ang mga pader nito
  rationale: Inihahayag ang pagdadala sa mga pader sa ganap na pagkakagawa, habang malinaw ang kaugnayan ng mga ito sa lungsod.
- source_word: מִנְדָּה
  choice: tributo
  rationale: Tumutukoy sa isang uri ng bayaring ipinapataw ng pamahalaan at pinananatiling naiiba sa dalawa pang terminong piskal.
- source_word: בְלוֹ
  choice: buwis
  rationale: Malinaw at pangkalahatang katawagan para sa ikalawang bayaring piskal sa tatluhang administratibo.
- source_word: הֲלָךְ
  choice: singil sa pagdaan
  rationale: Malamang na tumutukoy sa bayaring kaugnay ng paglalakbay, pagdaan, o paghahatid; mas malinaw ito sa karaniwang mambabasa kaysa sa hiram na salitang “toll.”
- source_word: לָא יִנְתְּנוּן
  choice: hindi na sila magbabayad
  rationale: Bagaman literal na “hindi sila magbibigay,” hinihingi ng kontekstong piskal ang “magbabayad”; ang “sila” ay tumutukoy sa mga naninirahan.
- source_word: וְאַפְּתֹם מַלְכִים תְּהַנְזִק
  choice: at sa bandang huli ay malulugi ang mga hari
  rationale: Pinananatili ang maikli at medyo malabong pahayag hinggil sa pinsala o pagkalugi ng mga hari, nang hindi tiyak na idinaragdag sa pangunahing teksto ang “kita.”
theological_decisions: []
translation_notes:
  register: Makabagong Filipino na may pormal at marangal na himig na angkop sa isang opisyal na liham. Ginamit ang “tributo, buwis, o singil sa pagdaan” upang mapanatiling magkakaiba ang tatlong katawagang piskal; nilagyan ng talababa ang maikli at tunay na malabong hulíng parirala.
