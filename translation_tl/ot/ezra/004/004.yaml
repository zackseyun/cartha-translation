translation:
  language: tl
  text: Noon, patuloy na pinanghihinaan ng mga tao sa lupain ang loob ng mga taga-Juda at tinatakot sila upang hindi sila makapagtayo.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “pinanghihina ang mga kamay,” isang idyoma para sa pagpapahina ng loob o determinasyon.
    reason: lexical_alternative
  - marker: b
    text: O, “at tinatakot sila upang hadlangan sila sa pagtatayo.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  choice: Kaya
  rationale: Ipinagpapatuloy ng waw-consecutive ang salaysay at ikinakabit ang pangyayari sa naunang konteksto; natural sa makabagong Filipino ang “Kaya.”
- source_word: עַם הָאָרֶץ
  choice: mga tao sa lupain
  rationale: Pinananatili nito ang Hebreong pahayag habang malinaw na tumutukoy sa mga naninirahan sa paligid na sumasalungat sa mga bumalik.
- source_word: מְרַפִּים יְדֵי
  choice: patuloy na pinanghihina ... ang loob
  rationale: Ang literal na “pinanghihina ang mga kamay” ay isang idyoma para sa pagsira ng tapang o determinasyon. Ang “pinanghihina ang loob” ay natural na katumbas sa Filipino, at ipinahihiwatig ng participle ang nagpapatuloy na kilos.
- source_word: עַם יְהוּדָה
  choice: mga taga-Juda
  rationale: Natural at tuwirang tumutukoy sa pamayanang mula sa Juda na gumagawa ng pagtatayo.
- source_word: וּמְבַלְהִים
  choice: at tinatakot
  rationale: Ang pandiwa ay nagpapahayag ng pagdudulot ng matinding takot o pagkataranta; malinaw at natural ang “tinatakot.”
- source_word: אוֹתָם
  choice: sila
  rationale: Ang panghalip na tuwirang layon ay tumutukoy sa mga taga-Juda.
- source_word: לִבְנוֹת
  choice: upang hindi makapagtayo
  rationale: Sa konteksto, ang infinitive ay tumutukoy sa gawaing hinahadlangan sa pamamagitan ng pananakot. Nililinaw ng salin ang layon o bunga nang hindi tinutukoy rito kung ano ang itinatayo, gaya ng Hebreo.
