base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/011.yaml
  text: 'This is a copy of the letter that they sent to King Artaxerxes: “Your servants[a], the men of Beyond the River[b], and now—”'
translation:
  language: tl
  text: 'Ito ang sipi ng liham na ipinadala nila kay Haring Artaxerxes: “Ang iyong mga lingkod, ang mga tao sa Kabila ng Ilog[a], at ngayon—[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mula sa Kabila ng Ilog.” Ang parirala ay katawagang panlalawigan ng Persia na tumutukoy sa lupain sa kanluran ng Ilog Eufrates, na tinatawag ding “Trans-Euphrates.”
    reason: lexical_alternative
  - marker: b
    text: Ang Aramaikong pananalita sa hulihan ay isang pormal na pormula sa liham. Maaari itong unawain bilang “at ngayon”; ayon sa tradisyon, isinasalin din itong “at sa gayong panahon” o inuunawang “at iba pa.” Nagpapatuloy ang teksto sa susunod na talata.
    reason: lexical_alternative
lexical_decisions:
- source_word: דְּנָה פַּרְשֶׁגֶן
  choice: Ito ang sipi
  rationale: Inihaharap ng demonstratibo ang dokumentong sisipiin, at ang פַּרְשֶׁגֶן ay tumutukoy sa sipi o transkripsiyon ng isang opisyal na kasulatan.
- source_word: אִגַּרְתָּא
  choice: ng liham
  rationale: Ang salita ay tumutukoy sa isang opisyal na nakasulat na komunikasyon; natural at malinaw sa makabagong Filipino ang “liham.”
- source_word: דִּי שְׁלַחוּ
  choice: na ipinadala nila
  rationale: Pinananatili nito ang payak na diwa ng kaugnay na sugnay at ng pandiwang “ipadala.”
- source_word: עֲלוֹהִי עַל אַרְתַּחְשַׁשְׂתְּא מַלְכָּא
  choice: kay Haring Artaxerxes
  rationale: Sa pormulang pangliham na ito, ang mga pang-ukol ay nagpapakilala sa tatanggap; natural sa Filipino ang “kay Haring Artaxerxes.”
- source_word: עַבְדָיךְ
  choice: Ang iyong mga lingkod
  rationale: Pinananatili ang magalang at mapagpakumbabang pagtukoy ng mga nasasakupan sa kanilang sarili sa harap ng hari, sa halip na ipakahulugang “mga opisyal.”
- source_word: אֱנָשׁ
  choice: ang mga tao
  rationale: Bagaman kolektibong anyong panlalaki ang Aramaic, ang “mga tao” ay likas na Filipino para sa pangkat ng mga nagpapadala at hindi nagdaragdag ng hindi tiyak na pagkakakilanlan.
- source_word: עֲבַר נַהֲרָה
  choice: sa Kabila ng Ilog
  rationale: Pinananatili ang literal na anyo ng opisyal na heograpikong katawagan ng Persia para sa lalawigan sa kanluran ng Eufrates; ipinapaliwanag sa talababa ang alternatibong “mula” at ang gamit na panlalawigan.
- source_word: וּכְעֶנֶת
  choice: at ngayon—
  rationale: Malapit ito sa anyo ng pormal na pormulang pangliham. Ang gitling ay nagpapakitang hindi pa tapos ang sipi at nagpapatuloy ito sa susunod na talata.
