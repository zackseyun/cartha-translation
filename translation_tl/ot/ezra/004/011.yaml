translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang pormal na himig ng liham sa hari at ang bahagyang putol na pormulang pangliham sa dulo. Ginamit ang “Kabila ng Ilog” bilang pantanging katawagang heograpiko at ipinaliwanag ito sa talababa.
