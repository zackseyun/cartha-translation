  text: וַֽ/יִּשְׁמְע֔וּ צָרֵ֥י יְהוּדָ֖ה וּ/בִנְיָמִ֑ן כִּֽי בְנֵ֤י הַ/גּוֹלָה֙ בּוֹנִ֣ים הֵיכָ֔ל לַ/יהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/001.yaml
  text: The adversaries of Judah and Benjamin heard that the sons of the exile were building a temple for Yahweh[a], the God of Israel.
translation:
  language: tl
  text: Narinig ng mga kaaway ng Juda at Benjamin na ang pamayanan ng mga ipinatapon[a] ay nagtatayo ng templo para kay Yahweh, ang Diyos ng Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “mga anak ng pagkakatapon”; tumutukoy ito sa pamayanan ng mga ipinatapon, kabilang ang mga nagbalik mula sa pagkakatapon.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמְעוּ
  choice: Narinig
  rationale: Tuwirang inilalarawan ng pandiwa ang isang pangyayaring naganap sa salaysay; hindi na dinagdagan ng panandang tulad ng “Ngayon” na wala naman sa Hebreo.
- source_word: צָרֵי
  choice: mga kaaway
  rationale: Ipinahihiwatig ng anyong maramihan ang mga taong salungat o mapanlaban sa Juda at Benjamin, nang hindi nililimitahan ang diwa sa pakikidigma.
- source_word: יְהוּדָה וּבִנְיָמִן
  choice: Juda at Benjamin
  rationale: Ginamit ang karaniwang anyong Filipino ng mga pangalang pantribo at panrehiyon.
- source_word: כִּי
  choice: na
  rationale: Dito, ipinakikilala ng כִּי ang nilalaman ng kanilang narinig, hindi ang sanhi nito.
- source_word: בְנֵי הַגּוֹלָה
  choice: ang pamayanan ng mga ipinatapon
  rationale: Ang literal na idyomang “mga anak ng pagkakatapon” ay tumutukoy sa pangkat na nakaugnay sa mga ipinatapon. Ang “pamayanan ng mga ipinatapon” ay natural sa Filipino at hindi tahasang nagdaragdag ng ideyang “nagbalik,” bagaman malinaw iyon sa mas malawak na konteksto.
- source_word: בּוֹנִים
  choice: ay nagtatayo
  rationale: Ipinakikita ng participle ang nagpapatuloy na kilos sa panahong narinig ito ng mga kaaway; hindi idinagdag ang “muling” sapagkat wala iyon sa mismong pandiwa.
- source_word: הֵיכָל
  choice: templo
  rationale: Bagaman maaari ring mangahulugang palasyo ang salita sa ibang konteksto, ang gusaling itinatayo para kay Yahweh ay malinaw na templo rito.
- source_word: לַיהוָה
  choice: para kay Yahweh
  rationale: Natural na ipinahahayag ng “para kay” ang layon o pinag-uukulan ng pagtatayo, at pinananatili ang personal na pangalang banal.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ang Diyos ng Israel
  rationale: Tuwirang salin ng pariralang naglalarawan kay Yahweh bilang Diyos ng Israel.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Personal na pangalang יְהוָה ang tahasang nasa tekstong Hebreo. Pinananatili itong “Yahweh” sa halip na palitan ng isang titulo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “pamayanan” upang maipahayag nang natural ang kolektibong Hebreong idyoma, habang inilagay sa talababa ang literal na anyo. Pinanatili ang bahagyang pormal na ayos na “ang ... ay nagtatayo” upang maging malinaw ang nilalaman ng kanilang narinig.
