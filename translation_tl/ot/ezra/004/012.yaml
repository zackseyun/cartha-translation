  to: Ipaalam sa hari na ang mga Judio[a] na umakyat mula sa inyo patungo sa amin ay dumating sa Jerusalem. Itinatayo nilang muli ang mapanghimagsik at masamang lungsod, tinatapos ang mga pader, at inaayos ang mga pundasyon[b].
