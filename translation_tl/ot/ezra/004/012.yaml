base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/012.yaml
  text: Let it be known to the king that the Jews who came up from you to us have come to Jerusalem[a]. They are rebuilding the rebellious and wicked city[b], finishing the walls and repairing the foundations.
translation:
  language: tl
  text: Ipaalam sa hari na ang mga Judio[a] na umakyat mula sa inyo patungo sa amin ay dumating sa Jerusalem. Itinatayo nilang muli ang mapanghimagsik at masamang lungsod, tinatapos ang mga pader, at inaayos ang mga pundasyon[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga taga-Juda.” Ang salitang Aramaiko ay maaaring tumukoy sa mga taga-Juda o Judea, gayundin sa mga Judio sa mas malawak na diwa.
    reason: lexical_alternative
  - marker: b
    text: O “inilalagay” o “itinatakda ang mga pundasyon.” Medyo mahirap unawain ang pariralang Aramaiko at maaaring tumukoy sa pag-aayos ng dati nang mga pundasyon o sa paglalagay ng mga ito sa puwesto.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְדִיעַ לֶהֱוֵא לְמַלְכָּא
  choice: Ipaalam sa hari
  rationale: Likas at pormal na salin ng karaniwang pormulang Aramaiko sa isang liham o ulat na ipinadadala sa hari.
- source_word: יְהוּדָיֵא
  choice: mga Judio
  rationale: Karaniwang katawagan sa modernong Filipino; maaari rin itong tumukoy sa mga taga-Juda o Judea, kaya nilinaw sa talababa ang alternatibo.
- source_word: סְלִקוּ מִן לְוָתָךְ עֲלֶינָא
  choice: umalis sa inyong kinaroroonan at pumunta rito sa amin
  rationale: Pinananatili ang pinagmulan, patutunguhan, at pananaw ng mga sumulat. Ang 'inyong kinaroroonan' ay nagpapahayag ng magalang na pagtukoy sa hari nang hindi nagmumukhang maramihan ang kausap.
- source_word: אֲתוֹ לִירוּשְׁלֶם
  choice: ay dumating sa Jerusalem
  rationale: Pinananatili ang ikalawang pandiwa ng pagdating, na higit na tiyak na tumutukoy sa Jerusalem.
- source_word: קִרְיְתָא מָרָדְתָּא וּבִאישְׁתָּא
  choice: ang mapanghimagsik at masamang lungsod
  rationale: Ipinapakita ang mapanumbat at politikal-moral na paglalarawan ng mga nag-aakusa nang hindi pinahihina o pinalalabis ang mga pang-uri.
- source_word: בָּנַיִן
  choice: Muli nilang itinatayo
  rationale: Ang konteksto ay pagpapanumbalik sa dati nang umiiral na Jerusalem; natural sa Filipino ang pariralang ito at malinaw na hindi unang pagtatayo ang tinutukoy.
- source_word: וְשׁוּרַיָּא אֶשְׁכְּלָלוּ
  choice: tinatapos ang mga pader
  rationale: Ang pandiwa ay nagpapahiwatig ng pagkumpleto o paggawa upang maging buo, at 'tinatapos' ang tuwiran at natural na katumbas sa konteksto.
- source_word: וְאֻשַּׁיָּא יַחִיטוּ
  choice: inaayos ang mga pundasyon
  rationale: Mahirap ang eksaktong diwa ng parirala. Ang 'inaayos' ay angkop sa konteksto ng pagpapanumbalik ngunit hindi ganap na isinasara ang posibilidad na inilalagay o itinatakda ang mga pundasyon.
