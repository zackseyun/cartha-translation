  source_fidelity: Ang "umalis" ay hindi naipapahayag ang pandiwang Aramaiko na סְלִקוּ, na karaniwang may diwang "umakyat" o "pumaitaas." Ang ibang pangunahing ugnayan—mula sa hari patungo sa mga sumulat, pagdating sa Jerusalem, at kasalukuyang gawaing pagtatayo—ay wastong naipapahayag.
  naturalness: Pormal at malinaw ang Filipino ng draft. Gayunman, ang "umakyat mula sa inyo patungo sa amin" ay kapwa mas tapat sa pandiwa at natural pa rin sa pormal na ulat. Ang "Itinatayo nilang muli" ay mas maayos na ayos ng pangungusap kaysa "Muli nilang itinatayo."
  terminology: Ang "mga Judio," "mapanghimagsik," "masamang lungsod," "mga pader," at "mga pundasyon" ay angkop sa modernong Filipino Tagalog at pinananatili ang mapanirang pananalita bilang paratang ng mga sumulat. Nananatiling angkop ang talababa para sa malawak na saklaw ng יְהוּדָיֵא at sa pinagtatalunang diwa ng huling pariralang Aramaiko.
