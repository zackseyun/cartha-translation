reference: Ezra 4:3
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יֹּאמֶר֩ לָ/הֶ֨ם זְרֻבָּבֶ֜ל וְ/יֵשׁ֗וּעַ וּ/שְׁאָ֨ר רָאשֵׁ֤י הָֽ/אָבוֹת֙ לְ/יִשְׂרָאֵ֔ל לֹֽא לָ֣/כֶם וָ/לָ֔/נוּ לִ/בְנ֥וֹת בַּ֖יִת לֵ/אלֹהֵ֑י/נוּ כִּי֩ אֲנַ֨חְנוּ יַ֜חַד נִבְנֶ֗ה לַֽ/יהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל כַּ/אֲשֶׁ֣ר צִוָּ֔/נוּ הַ/מֶּ֖לֶךְ כּ֥וֹרֶשׁ מֶֽלֶךְ פָּרָֽס־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/003.yaml
  text: But Zerubbabel[a], Jeshua, and the rest of the heads of the fathers’ houses of Israel said to them, “You have no part with us in building a house for our God, for we alone will build it for Yahweh, the God of Israel, just as King Cyrus, the king of Persia[b], commanded us.”
translation:
  language: tl
  text: Ngunit sinabi sa kanila nina Zerubabel, Jesua, at ng iba pang mga pinuno ng mga angkan ng Israel, “Hindi kayo makikibahagi sa amin sa pagtatayo ng isang bahay[a] para sa aming Diyos, sapagkat kami lamang[b] ang magtatayo nito para kay Yahweh, ang Diyos ng Israel, gaya ng iniutos sa amin ni Haring Ciro, ang hari ng Persia.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “bahay” ay tumutukoy rito sa templo.
    reason: cultural_note
  - marker: b
    text: Mas literal, “kami ay magkakasamang magtatayo.” Sa konteksto, ang “magkakasama” ay tumutukoy sa kanila mismo bilang isang pangkat, nang hindi kasama ang mga nag-alok na tumulong.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר לָהֶם
  choice: Ngunit sinabi sa kanila
  rationale: Ang וַיֹּאמֶר ay karaniwang pandiwang pasalaysay na ‘sinabi’; ginamit ang ‘Ngunit’ upang ihayag ang pagsalungat ng tugon sa alok sa naunang konteksto.
- source_word: זְרֻבָּבֶל וְיֵשׁוּעַ
  choice: Zerubabel, Jesua
  rationale: Isinalin sa baybay na madaling basahin sa modernong Filipino habang malapit sa mga anyong Hebreo.
- source_word: וּשְׁאָר רָאשֵׁי הָאָבוֹת לְיִשְׂרָאֵל
  choice: at ng iba pang mga pinuno ng mga angkan ng Israel
  rationale: Ang parirala ay tumutukoy sa mga pinuno ng mga pangkat-pamilya o angkan; mas natural sa Filipino ang ‘mga pinuno ng mga angkan’ kaysa literal na ‘mga ulo ng mga ama.’
- source_word: לֹא לָכֶם וָלָנוּ
  choice: Hindi kayo makikibahagi sa amin
  rationale: Ipinahahayag ng idyoma ang pagtanggi sa sama-samang paglahok o karapatan sa gawain, nang hindi ginagawang di-natural ang Filipino.
- source_word: לִבְנוֹת בַּיִת לֵאלֹהֵינוּ
  choice: sa pagtatayo ng isang bahay para sa aming Diyos
  rationale: Pinanatili ang literal na ‘bahay’ ng בַּיִת, habang nililinaw sa talababa na templo ang tinutukoy sa konteksto.
- source_word: כִּי אֲנַחְנוּ יַחַד נִבְנֶה
  choice: Kami-kami lamang ang magtatayo nito
  rationale: Literal na ‘magkakasama’ ang יַחַד, ngunit sa kontras na ito ay tumutukoy sa pangkat ng mga Israelita na magtatayo nang hindi kasama ang nag-alok; ipinakita sa talababa ang literal na anyo at kontekstuwal na diwa.
- source_word: לַיהוָה אֱלֹהֵי יִשְׂרָאֵל
  choice: para kay Yahweh, ang Diyos ng Israel
  rationale: Pinangalanan ang Tetragrammaton bilang ‘Yahweh’ at tuwirang pinanatili ang titulong ‘Diyos ng Israel.’
- source_word: כַּאֲשֶׁר צִוָּנוּ הַמֶּלֶךְ כּוֹרֶשׁ מֶלֶךְ פָּרָס
  choice: gaya ng iniutos sa amin ni Haring Ciro, ang hari ng Persia
  rationale: Pinanatili ang lakas ng opisyal na utos at ang inuulit na maharlikang titulo sa Hebreo.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang ginagamit ng talata ang Tetragrammaton; ang ‘Yahweh’ ay mas malapit na paglilipat sa pangalang Hebreo at hindi pinapalitan ito ng isang titulo.
- issue: Saklaw ng pagtanggi sa pakikibahagi sa pagtatayo
  choice: Hindi kayo makikibahagi sa amin
  alternative: Hindi para sa inyo at sa amin ang magtayo
  rationale: Ipinahahayag ng konteksto ang pagtanggi sa pinagsamang proyekto, ngunit hindi dinaragdagan ang talata ng dahilan o teolohikal na paghatol na hindi nito tahasang sinasabi.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang ‘angkan’ para sa sinaunang kaayusang pampamilya, at pinanatili ang ‘bahay’ na may paliwanag sa talababa sa halip na agad palitan ng ‘templo.’
