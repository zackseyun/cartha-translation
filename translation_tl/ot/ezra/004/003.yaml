  to: Ngunit sinabi sa kanila nina Zerubabel, Jesua, at ng iba pang mga pinuno ng mga angkan ng Israel, “Hindi kayo makikibahagi sa amin sa pagtatayo ng isang bahay[a] para sa aming Diyos, sapagkat kami lamang[b] ang magtatayo nito para kay Yahweh, ang Diyos ng Israel, gaya ng iniutos sa amin ni Haring Ciro, ang hari ng Persia.”
