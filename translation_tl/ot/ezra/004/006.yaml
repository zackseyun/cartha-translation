  text: וּ/בְ/מַלְכוּת֙ אֲחַשְׁוֵר֔וֹשׁ בִּ/תְחִלַּ֖ת מַלְכוּת֑/וֹ כָּתְב֣וּ שִׂטְנָ֔ה עַל יֹשְׁבֵ֥י יְהוּדָ֖ה וִ/ירוּשָׁלִָֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/006.yaml
  text: And in the reign of Ahasuerus[a], at the beginning of his reign, they wrote an accusation against the inhabitants of Judah and Jerusalem.
translation:
  language: tl
  text: At sa paghahari ni Ahasuerus, sa pasimula ng kanyang paghahari, sumulat sila ng paratang[a] laban sa mga naninirahan sa Juda at Jerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “reklamo” o “mapanlabang paratang.” Ang salitang Hebreo ay tumutukoy sa pagsalungat na ipinahayag bilang isang pormal na sakdal.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְ/מַלְכוּת
  choice: At sa paghahari ni
  rationale: Ipinakikita ng pang-ugnay at pang-ukol ang panahong pinangyarihan; natural at pormal sa Filipino ang “sa paghahari ni.” Pinanatili ang “At” upang katawanin ang ugnayan sa naunang salaysay.
- source_word: אֲחַשְׁוֵרוֹשׁ
  choice: Ahasuerus
  rationale: Tuwirang transliterasyon ito ng pangalang Hebreo; hindi ito pinalitan ng historikal na pagkakakilanlang “Xerxes.”
- source_word: בִּ/תְחִלַּת מַלְכוּת/וֹ
  choice: sa pasimula ng kanyang paghahari
  rationale: Tumutukoy ang parirala sa unang yugto ng kanyang pamamahala. Dignificado at malinaw sa modernong Filipino ang “sa pasimula.”
- source_word: כָּתְבוּ
  choice: sumulat sila
  rationale: Payak na nangangahulugang “sumulat” ang pandiwa. Pinanatiling hindi tiyak ang tinutukoy ng panghalip na maramihan, gaya sa Hebreo.
- source_word: שִׂטְנָה
  choice: paratang
  rationale: Nagpapahiwatig ang pangngalan ng salungat o mapanlabang pormal na sakdal. Sapat na malawak ang “paratang” upang hindi tukuyin nang labis ang eksaktong anyo ng sulat.
- source_word: עַל
  choice: laban sa
  rationale: Sa konteksto ng pagsulat ng paratang, tinutukoy nito ang mga taong pinatutungkulan ng mapanlabang sakdal.
- source_word: יֹשְׁבֵי יְהוּדָה וִ/ירוּשָׁלִָם
  choice: mga naninirahan sa Juda at Jerusalem
  rationale: Tinutumbasan nito ang substantibong participle na “mga naninirahan” at malinaw na tumutukoy sa mga taong nakatira sa Juda at Jerusalem.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na pormal ngunit madaling maunawaan. Pinanatili ang pag-uulit ng “paghahari” dahil naroon ito sa Hebreo at nagbibigay-diin sa maagang panahon ng pamumuno. Ginamit ang “Juda” bilang karaniwang anyong Filipino ng pangalang biblikal.
