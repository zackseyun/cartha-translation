    text: Ang “Kabila ng Ilog” ang opisyal na tawag ng Persia sa lalawigan sa kanluran ng Ilog Eufrates.
    reason: cultural_note
  revision_rationale: Inalis ang dalawang dagdag na kahulugang hindi tahasang nasa Aramaiko (“muling” at “na”), ginawang mas malinaw ang pasibong pagkumpleto ng mga pader, at pinanatili ang pormal na rehistro, ang di-tiyak na saklaw ng “bahagi,” at ang mga umiiral na talababa.
