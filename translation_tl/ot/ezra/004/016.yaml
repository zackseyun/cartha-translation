base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/016.yaml
  text: We make known to the king that if this city is rebuilt and its walls are completed[b][a], then because of this you will have no possession in the province Beyond the River.
translation:
  language: tl
  text: Ipinababatid namin sa hari na kung itatayo ang lunsod na ito at makukumpleto ang mga pader nito, dahil dito ay wala kayong magiging bahagi[a] sa Kabila ng Ilog[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Aramaiko para sa “bahagi” ay maaari ring mangahulugang “parte” o, ayon sa konteksto, “kita.”
    reason: lexical_alternative
  - marker: b
    text: Ang “Kabila ng Ilog” ang opisyal na tawag ng Persia sa lalawigan sa kanluran ng Ilog Eufrates.
    reason: cultural_note
lexical_decisions:
- source_word: מְהוֹדְעִין אֲנַחְנָה
  choice: Ipinababatid namin
  rationale: Ang pandiwaring Aramaiko ay gumaganap bilang pandiwa sa pormal na liham. Pinananatili ng “ipinababatid namin” ang opisyal at magalang na himig.
- source_word: לְמַלְכָּא
  choice: sa hari
  rationale: Tuwirang ipinakikita ng pariralang ito kung kanino ipinababatid ang ulat.
- source_word: דִּי הֵן
  choice: na kung
  rationale: Ipinakikilala ng dalawang kataga ang nilalaman ng ulat bilang isang kondisyon.
- source_word: קִרְיְתָא דָךְ
  choice: ang lunsod na ito
  rationale: Pinananatili ang deiktikong “ito” at ginagamit ang dignified ngunit karaniwang salitang “lunsod.”
- source_word: תִּתְבְּנֵא
  choice: muling itatayo
  rationale: Ipinahahayag ang pasibong diwa at ang hinaharap na kondisyon; ipinakikita ng “muli” na muling pagtatayo ang tinutukoy.
- source_word: וְשׁוּרַיָּה יִשְׁתַּכְלְלוּן
  choice: at matatapos ang mga pader nito
  rationale: Ang pandiwa ay tumutukoy sa pagdadala ng mga pader sa ganap na pagkakatapos; nililinaw ng “nito” na mga pader ng lunsod ang tinutukoy.
- source_word: לָקֳבֵל דְּנָה
  choice: dahil dito
  rationale: Natural na ipinahahayag sa Filipino ang bunga o lohikal na kahihinatnan habang pinananatili ang tahasang demonstratibo.
- source_word: חֲלָק
  choice: bahagi
  rationale: Ang “bahagi” ang pinakamalapit at hindi labis na tiyak na katumbas ng “portion/share,” kaya hindi nito agad nililimitahan ang kahulugan sa buwis, kita, o pag-aari.
- source_word: בַּעֲבַר נַהֲרָא
  choice: sa Kabila ng Ilog
  rationale: Pinananatili ang literal na anyo ng opisyal na tawag-Persiano sa rehiyon nang hindi idinaragdag sa pangunahing teksto ang salitang “lalawigan.”
- source_word: לָא אִיתַי לָךְ
  choice: wala na kayong magiging
  rationale: Natural na salin ng eksistensiyal na konstruksiyong nagpapahayag ng pag-aari o pagkakaroon; ang magalang na “kayo” ay angkop sa pakikipag-usap sa hari.
theological_decisions: []
translation_notes:
  register: Pormal at marangal ang himig bilang angkop sa isang opisyal na liham sa hari, ngunit gumagamit ng malinaw at kasalukuyang Filipino. Pinanatili ang malawak na kahulugan ng חֲלָק sa “bahagi” at ipinaliwanag sa talababa ang posibleng administratibo o pampinansiyal na diwa. Inilagay ang mga panandang [a] at [b] sa mismong mga pariralang nililinaw ng kani-kanilang talababa.
