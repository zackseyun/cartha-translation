  text: וַ/יִּגְּשׁ֨וּ אֶל זְרֻבָּבֶ֜ל וְ/אֶל רָאשֵׁ֣י הָֽ/אָב֗וֹת וַ/יֹּאמְר֤וּ לָ/הֶם֙ נִבְנֶ֣ה עִמָּ/כֶ֔ם כִּ֣י כָ/כֶ֔ם נִדְר֖וֹשׁ לֵֽ/אלֹהֵי/כֶ֑ם ו/לא אֲנַ֣חְנוּ זֹבְחִ֗ים מִ/ימֵי֙ אֵסַ֤ר חַדֹּן֙ מֶ֣לֶךְ אַשּׁ֔וּר הַ/מַּעֲלֶ֥ה אֹתָ֖/נוּ פֹּֽה־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/002.yaml
  text: Then they approached Zerubbabel and the heads of the fathers’ houses and said to them[a], “Let us build with you, for like you we seek your God, and we have been sacrificing to him since the days of Esar-haddon king of Assyria[b], who brought us up here.”
translation:
  language: tl
  text: Kaya lumapit sila kay Zerubabel at sa mga pinuno ng mga angkan at sinabi sa kanila, “Hayaan ninyo kaming magtayo kasama ninyo, sapagkat tulad ninyo ay hinahanap namin ang inyong Diyos[b], at naghahandog kami sa kanya[a] mula pa noong panahon ni Esar-hadon na hari ng Asiria, na nagdala sa amin dito.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa nakasulat na tekstong Hebreo: “at hindi kami naghahandog.” Marami ang nagpapalagay na anyong pansulat ito para sa “at sa kanya kami naghahandog,” o inuunawa ito sa positibong diwa batay sa konteksto.'
    reason: textual_variant
  - marker: b
    text: Ang “hinahanap namin ang inyong Diyos” ay maaari ring isaling “sinasamba namin ang inyong Diyos” o “sumasangguni kami sa inyong Diyos.” May panrelihiyong diwa ang pandiwang Hebreo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְּשׁוּ
  choice: lumapit sila
  rationale: Likas na salaysay sa modernong Tagalog at malinaw na ipinahahayag ang paglapit nila kay Zerubabel at sa mga pinuno.
- source_word: רָאשֵׁי הָאָבוֹת
  choice: mga pinuno ng mga angkan
  rationale: Ipinahahayag ang mga pinuno ng mga sambahayang ninuno sa paraang madaling maunawaan ngayon; mas angkop dito ang 'angkan' kaysa literal ngunit malabong 'mga ama.'
- source_word: נִבְנֶה עִמָּכֶם
  choice: Hayaan ninyong magtayo rin kami kasama ninyo
  rationale: Pinananatili ang kusang mungkahi ng unang panauhang maramihan at ang diwa ng pakikibahagi, nang hindi ipinapalagay na tulong lamang ang kanilang papel.
- source_word: כִּי כָכֶם
  choice: sapagkat tulad ninyo
  rationale: Pinananatili ang tahasang paghahambing na ipinagpapatuloy ng kasunod na pandiwa.
- source_word: נִדְרֹשׁ לֵאלֹהֵיכֶם
  choice: hinahanap namin ang inyong Diyos
  rationale: Ang דרשׁ ay maaaring mangahulugang hanapin, sumangguni, o sumamba sa kontekstong panrelihiyon. Ang 'hinahanap' ang pinakamalapit at nagpapanatili ng lawak ng kahulugan.
- source_word: וְלֹא אֲנַחְנוּ זֹבְחִים
  choice: at naghahandog kami sa kanya
  rationale: Isinasalin ang positibong diwang hinihingi ng konteksto at ng tradisyonal na pagbasa na לו ('sa kanya'), habang inilalahad sa talababa ang suliranin sa nakasulat na לא ('hindi').
- source_word: מִימֵי אֵסַר חַדֹּן
  choice: mula pa noong panahon ni Esar-hadon
  rationale: Natural na Tagalog para sa isang gawaing sinasabing nagsimula noon at nagpapatuloy hanggang sa kasalukuyan ng tagapagsalita.
- source_word: הַמַּעֲלֶה אֹתָנוּ פֹּה
  choice: na nagdala sa amin dito
  rationale: Malinaw na ipinapakitang si Esar-hadon ang naglipat sa kanila. Hindi pinilit ang Hebreong direksiyonal na 'pataas,' na hindi natural o makabuluhan sa karaniwang Tagalog dito.
theological_decisions:
- issue: Ang panrelihiyong pahayag ng mga naninirahan
  choice: Iniulat nang walang paghatol bilang 'hinahanap namin ang inyong Diyos' at 'naghahandog kami sa kanya.'
  alternative: Sinasamba namin ang inyong Diyos / sumasangguni kami sa inyong Diyos
  rationale: Hindi dapat patunayan o pasinungalingan ng salin ang katapatan o pagiging wasto ng kanilang pahayag. Nananatili ang teolohikal na tensiyon para sa konteksto ng salaysay.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang 'mga angkan' para sa estrukturang pampamilya, 'naghahandog' para sa paghahandog ng hain, at 'Asiria' bilang karaniwang anyong Filipino. Inilagay ang [a] sa mismong sugnay na may suliraning tekstuwal at ang [b] sa hulihan ng pangungusap bilang talababa sa pananalitang 'hinahanap namin ang inyong Diyos.'
