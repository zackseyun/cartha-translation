  terminology: Ang “mga pinuno ng mga angkan,” “naghahandog,” “Esar-hadon,” at “Asiria” ay angkop. Ang “hinahanap namin ang inyong Diyos” ay literal at pinananatili ang malawak na panrelihiyong saklaw ng pandiwa; ang mga posibleng mas interpretibong kahulugan ay wastong inilalagay sa talababa.
