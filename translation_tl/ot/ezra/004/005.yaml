  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/סֹכְרִ֧ים עֲלֵי/הֶ֛ם יוֹעֲצִ֖ים לְ/הָפֵ֣ר עֲצָתָ֑/ם כָּל יְמֵ֗י כּ֚וֹרֶשׁ מֶ֣לֶךְ פָּרַ֔ס וְ/עַד מַלְכ֖וּת דָּרְיָ֥וֶשׁ מֶֽלֶךְ פָּרָֽס־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/005.yaml
  text: And they hired counselors against them to frustrate their plan all the days of Cyrus king of Persia[a], even until the reign of Darius king of Persia.
translation:
  language: tl
  text: At umupa sila ng mga tagapayo laban sa kanila upang hadlangan ang kanilang balak[a] sa buong panahon ni Ciro na hari ng Persia, hanggang sa paghahari ni Dario na hari ng Persia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “upang biguin ang kanilang payo.” Ang Hebreong עֲצָה ay maaaring mangahulugang “payo,” “balak,” o “layunin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסֹכְרִים
  choice: At umupa sila
  rationale: Ang pandiwang mula sa שׂכר ay tumutukoy dito sa pagbabayad para sa serbisyo; hindi nito tahasang sinasabing nanuhol sila.
- source_word: עֲלֵיהֶם
  choice: laban sa kanila
  rationale: Dahil sa kontekstong mapanlaban at sa layuning hadlangan ang balak, adversatibo ang diwa ng עַל.
- source_word: יוֹעֲצִים
  choice: mga tagapayo
  rationale: Likas at malinaw na katumbas ito ng mga taong nagbibigay ng payo sa isang kontekstong pampamahalaan o pampolitika.
- source_word: לְהָפֵר
  choice: upang hadlangan
  rationale: Sa bagay na עֲצָתָם, ipinahihiwatig ng הפר ang pagpigil o pagbigo sa pagsasakatuparan ng isang balak.
- source_word: עֲצָתָם
  choice: kanilang balak
  rationale: Maaaring mangahulugan ang עֵצָה ng payo, balak, o layunin; ang “balak” ang pinakamalinaw sa konteksto ng muling pagtatayo habang pinananatili sa talababa ang leksikal na saklaw.
- source_word: כָּל יְמֵי
  choice: sa buong panahon ni
  rationale: Natural na modernong Tagalog ito para sa temporal na idyomang literal na “lahat ng mga araw ni.”
- source_word: כּוֹרֶשׁ מֶלֶךְ פָּרַס
  choice: Ciro na hari ng Persia
  rationale: Isinalin ang pangalan ayon sa karaniwang anyong Filipino at ang titulong maharlika nang tuwiran.
- source_word: וְעַד
  choice: hanggang sa
  rationale: Malinaw nitong ipinakikita ang pagpapatuloy ng pagsalungat mula sa panahon ni Ciro hanggang sa paghahari ni Dario.
- source_word: מַלְכוּת
  choice: paghahari
  rationale: Sa temporal na pariralang ito, tumutukoy ang salita sa panahon ng pamumuno, hindi sa nasasakupang kaharian.
- source_word: דָּרְיָוֶשׁ מֶלֶךְ פָּרָס
  choice: Dario na hari ng Persia
  rationale: Ginamit ang karaniwang anyong Filipino ng pangalan at tuwirang isinalin ang titulo.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “umupa” sa halip na “nanuhol” upang hindi magdagdag ng katiwaliang hindi tahasang nakasaad, at “sa buong panahon” bilang natural na katumbas ng Hebreong temporal na idyoma.
