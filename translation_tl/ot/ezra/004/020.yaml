  source_fidelity: 'Tumpak ang mga pangunahing diwa: maraming makapangyarihang hari ang may kapangyarihan sa Jerusalem at sa buong opisyal na teritoryong “Beyond the River,” at ang tatlong uri ng bayaring pampamahalaan ay ibinibigay sa kanila. Ang “Lupain sa Kabila ng Ilog” at ang paliwanag nito ay angkop na pagpapahayag ng opisyal na katawagan.'
  naturalness: Natural sa pangkalahatan ang salin, ngunit ang “binabayaran sila ng tributo” ay maaaring magpahiwatig na ang mga hari mismo ang binabayaran gamit ang tributo bilang ahente. Mas malinaw at mas malapit sa pasibong Aramaic ang “ibinibigay sa kanila ang tributo, buwis, at bayad sa pagdaan.” Ang “Noon ay may” ay mas maayos ding ayos ng pangungusap.
  terminology: Ang “makapangyarihang hari,” “tributo,” “buwis,” at “bayad sa pagdaan” ay angkop sa modernong Filipino at pinananatili ang pagkakaiba ng tatlong terminong pangkita. Ang kapitalisasyon sa “Lupain sa Kabila ng Ilog” ay kapaki-pakinabang upang ipakitang ito ay opisyal na heograpikong katawagan.
