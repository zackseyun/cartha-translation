translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “makapangyarihan” sa halip na mas lumang “makapangyarihan/malakas” na pormulang maaaring malabo, at “bayad sa pagdaan” upang malinaw ang administratibong kahulugan. Ang malaking titik sa “Lupain sa Kabila ng Ilog” ay nagpapakitang opisyal itong katawagang heograpiko.
