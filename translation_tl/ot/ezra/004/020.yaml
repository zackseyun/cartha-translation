  yaml_path: translation/ot/ezra/004/020.yaml
  text: And mighty kings were over Jerusalem, ruling over all the region Beyond the River, and tribute, tax, and toll were paid to them.
translation:
  language: tl
  text: Noon ay may mga makapangyarihang hari na namahala sa Jerusalem at naghari sa buong Lupain sa Kabila ng Ilog[a], at ibinibigay sa kanila ang tributo, buwis, at bayad sa pagdaan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “Lupain sa Kabila ng Ilog” ay opisyal na tawag sa nasasakupang teritoryo sa kanluran ng Ilog Eufrates.
    reason: cultural_note
  - marker: b
    text: Ang “tributo, buwis, at bayad sa pagdaan” ay tatlong magkakaibang uri ng kita ng imperyo. Maaari ring isalin ang huling dalawa bilang “buwis sa kalakal” at “singil sa pagdaan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְכִין תַּקִּיפִין
  choice: mga makapangyarihang hari
  rationale: Tuwirang ipinahahayag ang maramihang pangngalan at ang lakas o kapangyarihang taglay ng mga hari.
- source_word: הֲווֹ עַל יְרוּשְׁלֶם
  choice: noon na namahala sa Jerusalem
  rationale: Ang עַל ay nagpapahiwatig ng awtoridad sa Jerusalem, hindi lamang ng paninirahan doon; idinagdag ang “noon” upang natural na maipahayag ang nakaraang pag-iral.
- source_word: וְשַׁלִּיטִין
  choice: at naghari
  rationale: Ipinahahayag ang patuloy na paggamit ng kapangyarihan o pamumuno; ang “naghari” ay natural sa konteksto ng mga hari.
- source_word: בְּכֹל עֲבַר נַהֲרָה
  choice: sa buong Lupain sa Kabila ng Ilog
  rationale: Pinananatili ang opisyal na heograpikong katawagan, habang ginagawang malinaw sa modernong Filipino na tumutukoy ito sa isang nasasakupang lupain.
- source_word: מִדָּה
  choice: tributo
  rationale: Karaniwang tawag sa halagang ipinapataw at ibinibigay sa nakatataas na kapangyarihang pampamahalaan.
- source_word: בְלוֹ
  choice: buwis
  rationale: Malinaw na pangkalahatang katawagan sa isang hiwalay na uri ng kita ng pamahalaan sa tatluhang pormulang administratibo.
- source_word: הֲלָךְ
  choice: bayad sa pagdaan
  rationale: Malamang na tumutukoy sa singil sa biyahe, transportasyon, o pagdaan; mas madaling maunawaan kaysa sa hiram na “toll.”
- source_word: מִתְיְהֵב לְהוֹן
  choice: binabayaran sila
  rationale: Natural na Filipino para sa pasibong diwang ang mga halagang ito ay ibinibigay sa mga hari.
