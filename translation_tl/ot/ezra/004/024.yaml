  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: בֵּ/אדַ֗יִן בְּטֵלַת֙ עֲבִידַ֣ת בֵּית אֱלָהָ֔/א דִּ֖י בִּ/ירוּשְׁלֶ֑ם וַ/הֲוָת֙ בָּֽטְלָ֔א עַ֚ד שְׁנַ֣ת תַּרְתֵּ֔ין לְ/מַלְכ֖וּת דָּרְיָ֥וֶשׁ מֶֽלֶךְ פָּרָֽס־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/024.yaml
  text: Then the work on the house of God that is in Jerusalem stopped[c][b][a], and it remained stopped until the second year of the reign of Darius king of Persia.
translation:
  language: tl
  text: Nang magkagayon, natigil[a] ang gawain sa bahay ng Diyos[b] na nasa Jerusalem, at nanatili itong nakatigil[c] hanggang sa ikalawang taon ng paghahari ni Dario, hari ng Persia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “huminto” o “pinatigil.” Ang ugat na Aramaiko na בטל ay may diwang pagtigil, pagkahinto, o pagkaputol.
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring “templo ng Diyos.” Literal: “bahay ng Diyos.”'
    reason: lexical_alternative
  - marker: c
    text: Ang pariralang “nanatili itong nakatigil” ay nagsasaad ng nagpapatuloy na kalagayan, hindi lamang pag-uulit na natigil ang gawain.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּאדַיִן
  choice: Nang magkagayon
  rationale: Panandang Aramaiko ito ng pagkakasunod-sunod sa salaysay. Likas sa marangal na modernong Tagalog ang “Nang magkagayon” at malinaw nitong iniuugnay ang pangyayari sa naunang talata.
- source_word: בְּטֵלַת
  choice: natigil
  rationale: Ang ugat na Aramaiko na בטל ay nangangahulugang tumigil, mahinto, o maputol. Ang “natigil” ay likas sa Tagalog at hindi tahasang nagpapasiya kung kusang tumigil o sapilitang pinatigil ang gawain.
- source_word: עֲבִידַת
  choice: ang gawain
  rationale: Tumutukoy ang pangngalang ito sa gawain o paggawa. Sapat na nililinaw ng kasunod na parirala na ito ang gawaing nauukol sa bahay ng Diyos, kaya hindi idinagdag sa pangunahing teksto ang salitang “pagtatayo.”
- source_word: בֵּית אֱלָהָא
  choice: sa bahay ng Diyos
  rationale: Pinananatili nito ang literal at teolohikong mahalagang larawang “bahay ng Diyos.” Ang “templo ng Diyos” ay wastong paliwanag ayon sa konteksto ngunit mas interpretatibo.
- source_word: דִּי בִּירוּשְׁלֶם
  choice: na nasa Jerusalem
  rationale: Natural na Tagalog ito para sa pariralang naglalarawan at nagtuturo sa kinaroroonan ng bahay ng Diyos.
- source_word: וַהֲוָת בָּטְלָא
  choice: at nanatili itong nakatigil
  rationale: Ipinahahayag ng anyong ito ang nagpapatuloy na kalagayan. Ibinubukod ng “nanatili itong nakatigil” ang patuloy na paghinto mula sa unang sandali ng pagkakatigil.
- source_word: עַד שְׁנַת תַּרְתֵּין
  choice: hanggang sa ikalawang taon
  rationale: Ito ang malinaw at karaniwang anyo ng pagtukoy sa taon ng paghahari sa Tagalog.
- source_word: לְמַלְכוּת דָּרְיָוֶשׁ
  choice: ng paghahari ni Dario
  rationale: Malinaw nitong ipinakikita na ang petsa ay ibinabatay sa taon ng paghahari ni Dario.
- source_word: מֶלֶךְ פָּרָס
  choice: hari ng Persia
  rationale: Tuwirang pinananatili nito ang maharlikang titulo at ang ayos ng pinagmulan.
theological_decisions:
- issue: Paglalarawan sa gusali bilang “bahay ng Diyos” o “templo ng Diyos”
  choice: bahay ng Diyos
  alternative: templo ng Diyos
  rationale: Ang “bahay ng Diyos” ang mas pormal na katumbas ng Aramaiko at pinananatili ang larawang ginamit ng teksto; inilagay sa talababa ang mas malinaw ngunit interpretatibong “templo ng Diyos.”
- issue: Kung aktibo o pasibo ang unang pagtigil ng gawain
  choice: natigil
  alternative: itinigil / pinatigil
  rationale: Maaaring dalhin ng anyo at konteksto ang diwang tumigil o pinatigil. Hindi hayagang tinutukoy ng pandiwa rito ang gumagawa, kaya pinananatili ng “natigil” ang puwang na iyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Nang magkagayon” bilang angkop na panandang pasalaysay, “bahay ng Diyos” upang mapanatili ang larawan ng orihinal, at “nanatili itong nakatigil” upang maipahayag ang duratibong puwersa nang natural.
