  text: Now issue a decree to make these men stop[b][a], and this city shall not be rebuilt until a decree is issued by me.
translation:
  language: tl
  text: Kaya ngayon, magpalabas kayo ng utos[a] na patigilin ang mga lalaking ito, at huwag itayo ang lungsod na ito hanggang sa magpalabas ako ng utos.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “magtakda kayo ng kautusan.” Literal na “maglagay/magtakda ng pasiya” ang idyomang Aramaiko.
    reason: lexical_alternative
  - marker: b
    text: Literal na “hanggang sa mula sa akin ay maitakda ang isang utos.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּעַן
  choice: Kaya ngayon
  rationale: Ipinahihiwatig ng pariralang Aramaiko ang agarang utos na sumusunod sa naunang pangangatwiran; likas sa Filipino ang “Kaya ngayon.”
- source_word: שִׂימוּ טְּעֵם
  choice: magpalabas kayo ng utos
  rationale: Ang idyoma ay literal na “maglagay/magtakda ng pasiya.” Ang “magpalabas ng utos” ay malinaw at angkop sa kontekstong maharlika at administratibo.
- source_word: לְבַטָּלָא
  choice: na patigilin
  rationale: 'Pinananatili nito ang causative na diwa: uutusan silang kumilos upang mapahinto ang mga tinutukoy na lalaki.'
- source_word: גֻּבְרַיָּא אִלֵּךְ
  choice: ang mga lalaking ito
  rationale: Tuwirang tinutumbasan ang espesipikong “mga lalaking ito” sa Aramaiko.
- source_word: וְקִרְיְתָא דָךְ לָא תִתְבְּנֵא
  choice: Huwag muling itayo ang lungsod na ito
  rationale: Malinaw na ipinahahayag sa Filipino ang administratibong pagbabawal at pinananatili ang pasibong ideya ng muling pagtatayo.
- source_word: עַד מִנִּי טַעְמָא יִתְּשָׂם
  choice: hanggang sa magpalabas ako ng utos
  rationale: Likas na Filipino para sa literal na “hanggang sa mula sa akin ay maitakda ang isang utos,” at malinaw na ang hari ang pinagmumulan ng susunod na utos.
