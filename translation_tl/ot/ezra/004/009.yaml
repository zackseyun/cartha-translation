base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/009.yaml
  text: Then Rehum the commander[a], Shimshai the scribe, and the rest of their associates—the judges, the officials, the Tarpelites, the Persians, the Erechites, the Babylonians, the men of Susa (that is[b], the Elamites)—
translation:
  language: tl
  text: Nang panahong iyon, si Rehum na mataas na opisyal[a], si Simsai na kalihim, at ang iba pa nilang mga kasamahan—ang mga Dineo[b], mga Afarsatakeo[c], mga Tarpaleo, mga Persiano, mga Arkeveo, mga Babilonio, mga Susanita, mga Dehita, at mga Elamita—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “tagapangasiwa,” “kansilyer,” o “pinuno ng mga kautusan.” Hindi tiyak ang eksaktong tungkulin ng titulong Aramaiko.
    reason: lexical_ambiguity
  - marker: b
    text: Maaari ring “mga hukom.” Tradisyonal na binabasa ang salitang Aramaiko bilang pangalan ng isang pangkat, ngunit maaari rin itong tumukoy sa tungkuling administratibo.
    reason: alternative_reading
  - marker: c
    text: Maaari ring isang katawagang administratibo para sa “mga opisyal.” Hindi tiyak ang kahulugan ng salitang Aramaiko.
    reason: alternative_reading
lexical_decisions:
- source_word: אֱדַיִן
  choice: Nang panahong iyon
  rationale: Hudyat ito ng kasunod na yugto sa salaysay o dokumento; natural ito sa Filipino at pinananatili ang pagkakasunod-sunod.
- source_word: רְחוּם
  choice: Rehum
  rationale: Pangalang pantangi; isinalin sa baybay na madaling basahin sa Filipino.
- source_word: בְּעֵל טְעֵם
  choice: mataas na opisyal
  rationale: Pinagtatalunang titulong administratibo na literal na may diwang may kapangyarihan sa utos o pasiya. Ang malawak na saling ito ay malinaw sa modernong Filipino nang hindi nagtatakda ng tiyak na tungkuling hindi tiyak sa pinagmulan.
- source_word: שִׁמְשַׁי
  choice: Simsai
  rationale: Pangalang pantangi; ginamit ang makabagong baybay-Filipino.
- source_word: סָפְרָא
  choice: kalihim
  rationale: Sa kontekstong burukratiko, tumutukoy ito sa tagasulat o sekretaryong opisyal; mas natural dito ang “kalihim.”
- source_word: שְׁאָר כְּנָוָתְהוֹן
  choice: ang iba pa nilang mga kasamahan
  rationale: Ipinahahayag ang nalalabing mga kaanib o kasama ng pangkat sa paraang natural sa Filipino.
- source_word: דִּינָיֵא
  choice: mga Dineo
  rationale: Ang anyong maramihan ay maaaring pangalan ng isang pangkat. Dahil hindi tiyak ang pagkakakilanlan, mas malinaw na panatilihin ang pangalan kaysa tiyaking opisyal na titulo ito.
- source_word: אֲפַרְסַתְכָיֵא
  choice: mga Afarsatakeo
  rationale: Mahirap tukuying pangalan o katawagang administratibo; pinanatili bilang transliteradong pangalan ng pangkat upang huwag magdagdag ng di-tiyak na ranggo.
- source_word: טַרְפְּלָיֵא
  choice: mga Tarpaleo
  rationale: Hindi tiyak na pangalan ng pangkat; transliterasyon ang pinakamaingat na salin.
- source_word: אֲפָרְסָיֵא
  choice: mga Persiano
  rationale: Karaniwang kinikilalang katawagan sa mga Persiano.
- source_word: ארכוי
  choice: mga Arkeveo
  rationale: Katawagan sa mga taong mula sa Erek o Uruk; pinanatili ang anyong pangkat.
- source_word: בָבְלָיֵא
  choice: mga Babilonio
  rationale: Malinaw na katawagan sa mga taga-Babilonia.
- source_word: שׁוּשַׁנְכָיֵא
  choice: mga taga-Susa
  rationale: Tumutukoy sa mga naninirahan sa Susa; mas malinaw sa Filipino ang anyong “taga-” kaysa sa di-pamilyar na etnonimo.
- source_word: ד הוא עֵלְמָיֵא
  choice: samakatuwid ay mga Elamita
  rationale: Maaaring unawain ang parirala bilang pagpapaliwanag na ang mga taga-Susa ay mga Elamita. Pinananatili sa talababa ang tradisyonal na alternatibong pagbasa bilang dalawang hiwalay na pangkat.
theological_decisions: []
translation_notes:
  register: Makabago at marangal na Filipino ang ginamit. Pinanatili ang anyong di-ganap na pangungusap at ang pangwakas na gitling sapagkat nagpapatuloy ang talaan at pormula ng liham sa kasunod na mga talata. Ang mga di-tiyak na etnonimo ay isinabaybay sa paraang madaling bigkasin ng mambabasang Filipino, samantalang ang tunay na mga alternatibong pagbasa ay inilagay sa mga talababa.
