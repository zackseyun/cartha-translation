source:
  edition: WLC
  text: אֱדַ֗יִן מִן דִּ֞י פַּרְשֶׁ֤גֶן נִשְׁתְּוָנָ/א֙ דִּ֚י ארתחששתא מַלְכָּ֔/א קֱרִ֧י קֳדָם רְח֛וּם וְ/שִׁמְשַׁ֥י סָפְרָ֖/א וּ/כְנָוָתְ/ה֑וֹן אֲזַ֨לוּ בִ/בְהִיל֤וּ לִ/ירֽוּשְׁלֶם֙ עַל יְה֣וּדָיֵ֔/א וּ/בַטִּ֥לוּ הִמּ֖וֹ בְּ/אֶדְרָ֥ע וְ/חָֽיִל־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/023.yaml
  text: Then[a], as soon as the copy of the letter of King Artaxerxes was read before Rehum and Shimshai the scribe and their associates, they went in haste to Jerusalem, to the Jews[b], and made them stop by force and power.
translation:
  language: tl
  text: Pagkatapos, nang mabasa sa harap nina Rehum at Shimshai na tagasulat, at ng kanilang mga kasamahan, ang sipi ng liham ni Haring Artaxerxes, dali-dali silang pumunta sa Jerusalem, sa mga Judio[a], at sapilitan nilang pinatigil ang mga ito sa pamamagitan ng lakas at kapangyarihan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “laban sa mga Judio.” Maaaring may mapanlabang diwa ang pang-ukol sa Aramaic, gaya ng ipinahihiwatig ng sumunod nilang sapilitang pagpapatigil.
    reason: lexical_alternative
  - marker: b
    text: O “pinatigil nila ang mga ito sa lakas ng bisig at puwersa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱדַיִן
  choice: Pagkatapos
  rationale: Nagmamarka ito ng sumunod na pangyayari sa salaysay; natural at malinaw ang “Pagkatapos” sa makabagong Filipino.
- source_word: פַּרְשֶׁגֶן נִשְׁתְּוָנָא
  choice: ang sipi ng liham
  rationale: Ang unang salita ay tumutukoy sa sipi o kopya, at ang ikalawa sa isang opisyal na liham o kasulatan.
- source_word: קֱרִי קֳדָם
  choice: mabasa sa harap nina
  rationale: Pinananatili nito ang diwang ang dokumento ay binasa sa presensiya ng mga opisyal, pati ang anyong pasibo ng pahayag.
- source_word: רְחוּם וְשִׁמְשַׁי סָפְרָא וּכְנָוָתְהוֹן
  choice: Rehum, Shimsai na tagasulat, at ang kanilang mga kasamahan
  rationale: Isinalin ang סָפְרָא bilang “tagasulat,” isang malinaw at malawak na katawagang maaaring tumukoy sa eskriba o opisyal na kalihim; ang כְנָוָתְהוֹן ay “kanilang mga kasamahan.”
- source_word: אֲזַלוּ בִבְהִילוּ
  choice: dali-dali silang pumunta
  rationale: Naipahahayag nito kapwa ang pagkilos patungo sa lugar at ang matinding pagmamadali.
- source_word: עַל יְהוּדָיֵא
  choice: sa mga Judio
  rationale: Maaaring tumukoy ang עַל sa paglapit “sa” kanila o sa paglusob “laban sa” kanila. Pinili ang natural na pariralang “sa mga Judio,” habang inilalahad sa talababa ang posibleng mapanlabang diwa.
- source_word: וּבַטִּלוּ הִמּוֹ
  choice: pinatigil ang mga ito
  rationale: 'Pinananatili ng “pinatigil” ang tahasang causative na diwa: sapilitan nilang ipinahinto ang mga Judio.'
- source_word: בְּאֶדְרָע וְחָיִל
  choice: sapilitan … sa pamamagitan ng lakas at kapangyarihan
  rationale: Ipinahahayag ng idyoma ang marahas o mapuwersang pamimilit. Ang “sapilitan” ay nilinaw sa pangungusap, samantalang pinanatili ang dalawang magkatuwang na salitang “lakas at kapangyarihan.”
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “tagasulat” sa halip na mas teknikal na “eskriba,” at ang “dali-dali” upang likas na maipahayag ang pagmamadali. Ang mga pangalan ay tinumbasan ayon sa karaniwang anyong Filipino.
