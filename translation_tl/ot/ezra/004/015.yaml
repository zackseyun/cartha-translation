source:
  edition: WLC
  text: דִּ֡י יְבַקַּר֩ בִּֽ/סְפַר דָּכְרָ֨נַיָּ֜/א דִּ֣י אֲבָהָתָ֗/ךְ וּ֠/תְהַשְׁכַּח בִּ/סְפַ֣ר דָּכְרָנַיָּ/א֮ וְ/תִנְדַּע֒ דִּי֩ קִרְיְתָ֨/א דָ֜ךְ קִרְיָ֣א מָֽרָדָ֗א וּֽ/מְהַנְזְקַ֤ת מַלְכִין֙ וּ/מְדִנָ֔ן וְ/אֶשְׁתַּדּוּר֙ עָבְדִ֣ין בְּ/גַוַּ֔/הּ מִן יוֹמָ֖ת עָלְמָ֑/א עַ֨ל דְּנָ֔ה קִרְיְתָ֥/א דָ֖ךְ הָֽחָרְבַֽת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/015.yaml
  text: so that a search may be made in the book of records of your fathers[a], and you may find in the book of records and know that this city is a rebellious city, harmful to kings and provinces, and that sedition has been made within it from ancient days[b]; for this reason this city was laid waste.
translation:
  language: tl
  text: upang siyasatin ang aklat ng mga tala ng iyong mga ninuno[a]. Matutuklasan mo sa aklat ng mga tala at malalaman mong ang lungsod na ito ay isang mapaghimagsik na lungsod, na nakapipinsala sa mga hari at mga lalawigan, at na mula pa noong unang panahon ay may nagaganap na paghihimagsik sa loob nito[b]. Dahil dito, winasak ang lungsod na ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal na “iyong mga ama”; maaari ring tumukoy sa mga nauna sa iyo bilang mga hari o tagapamahala.
    reason: lexical_alternative
  - marker: b
    text: Mahirap ang pananalitang Aramaiko. Tumutukoy ito sa sedisyon o paghihimagsik na ginagawa o nagaganap sa loob ng lungsod; hindi malinaw na tinutukoy ang mga gumagawa nito.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְבַקַּר
  choice: saliksikin
  rationale: Ang masidhing anyo ng pandiwa ay ginagamit dito bilang pormal na kahilingang magsagawa ng pagsisiyasat. Likas sa Filipino ang pawatas na pasibo kasunod ng “upang.”
- source_word: סְפַר דָּכְרָנַיָּא
  choice: aklat ng mga tala
  rationale: Tumutukoy ito sa opisyal na nakasulat na rehistro o arkibo; pinananatili ng salin ang konkretong larawan ng isang aklat ng mga rekord.
- source_word: אֲבָהָתָךְ
  choice: iyong mga ninuno
  rationale: Literal itong “iyong mga ama,” ngunit sa konteksto ay tumutukoy sa mga naunang hari o tagapamahala. Ang “mga ninuno” ay malinaw at marangal, samantalang itinatala sa talababa ang posibleng diwang “mga nauna sa iyo.”
- source_word: וּתְהַשְׁכַּח
  choice: matutuklasan mo
  rationale: Ipinagpapatuloy nito ang inaasahang bunga ng hiniling na pagsasaliksik. Ang anyong panghinaharap ay natural sa Filipino at hindi labis na nagpapasya kung ito ay pahintulot o katiyakan.
- source_word: וְתִנְדַּע
  choice: at malalaman
  rationale: Direktang ipinahahayag ang pagdating sa kaalaman bilang bunga ng pagsasaliksik sa talaan.
- source_word: קִרְיְתָא דָךְ
  choice: ang lungsod na ito
  rationale: Tumutukoy ang demonstratibo sa Jerusalem, ang lungsod na pinag-uusapan sa liham.
- source_word: קִרְיָא מָרָדָא
  choice: isang mapaghimagsik na lungsod
  rationale: Ipinahahayag nito ang paratang na palagiang sumusuway ang lungsod sa kapangyarihan ng imperyo.
- source_word: מְהַנְזְקַת
  choice: nakapipinsala sa
  rationale: Saklaw nito ang pampolitika at pangkabuhayang pinsalang ipinaparatang nang hindi nililimitahan ang kahulugan.
- source_word: מַלְכִין וּמְדִנָן
  choice: mga hari at mga lalawigan
  rationale: Ang “mga lalawigan” ang malinaw at karaniwang katawagan sa mga rehiyong administratibo ng imperyo.
- source_word: אֶשְׁתַּדּוּר עָבְדִין
  choice: nag-uudyok sila ng paghihimagsik
  rationale: Mahirap at di-karaniwan ang kolokasyong Aramaiko. Ipinahihiwatig nito ang paggawa o pagpapasimula ng sedisyon; pinananatili ng “nag-uudyok” ang aktibong diwa ng pag foment ng pag-aalsa.
- source_word: בְּגַוַּהּ
  choice: sa loob nito
  rationale: Tumutukoy sa gawaing nagaganap sa loob ng lungsod o ng pamayanang naroon.
- source_word: מִן יוֹמָת עָלְמָא
  choice: mula pa noong unang panahon
  rationale: Idyoma ito para sa matagal nang nakalipas, hindi sa walang-hanggang panahon sa mahigpit na metapisikal na diwa.
- source_word: הָחָרְבַת
  choice: winasak
  rationale: Ang pasibong anyo ay nagsasaad na ang lungsod ay ginawang guho o inilagay sa kalagayang wasak; likas at tuwiran ang “winasak” sa Filipino.
theological_decisions:
- issue: Ang mahirap na pariralang אֶשְׁתַּדּוּר עָבְדִין
  choice: nag-uudyok sila ng paghihimagsik
  alternative: gumagawa sila ng sedisyon / may ginagawang paghihimagsik
  rationale: Walang partikular na doktrinang nakataya, ngunit mahalagang huwag gawing mas tiyak kaysa sa Aramaiko ang uri ng pag-aalsa. Pinili ang isang likas na saling nagpapakita ng pagpapasimula ng rebelyon, at inilalahad sa talababa ang kahirapan at mga kalapit na kahulugan.
translation_notes:
  register: Modernong Filipino na pormal at angkop sa isang liham na administratibo. Ginamit ang “lungsod,” “lalawigan,” at “aklat ng mga tala” upang mapanatili ang dignidad at historikal na konteksto nang madaling maunawaan ng karaniwang mambabasa.
