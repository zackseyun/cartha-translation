base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/010.yaml
  text: 'and the rest of the peoples whom the great and noble Osnappar deported and settled in the city of Samaria[c][b][a], and in the rest of Beyond the River—and now:'
translation:
  language: tl
  text: at ang iba pang mga pangkat ng tao na ipinatapon at pinatira ng dakila at marangal na si Osnappar[a] sa lungsod ng Samaria, at ang iba pa sa Kabilang-Ilog[b]—at ngayon:[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Madalas na ipinapalagay na si Osnappar ay ang hari ng Asiria na si Ashurbanipal, ngunit pinananatili rito ang anyo ng pangalang Aramaiko na nasa teksto.
    reason: cross_reference
  - marker: b
    text: Maaari ring “sa kabila ng Ilog.” Katawagang administratibo ito ng Persia para sa rehiyon sa kanluran ng Ilog Eufrates.
    reason: cultural_note
  - marker: c
    text: Ang huling pananalita ay isang pormulang Aramaiko sa liham. Maaari din itong unawain na “at iba pa” o “sa panahong ito.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁאָר אֻמַּיָּא
  choice: ang iba pang mga bayan
  rationale: Tumutukoy ito sa nalalabing mga pangkat ng tao sa pagpapatuloy ng talaan. Ang “mga bayan” ay likas sa Filipino at pinananatili ang kolektibo at etnikong diwa.
- source_word: הַגְלִי
  choice: ipinatapon
  rationale: Ipinahihiwatig ng pandiwa ang sapilitang paglilipat sa pagkakatapon, gaya ng ginagawa ng isang imperyo.
- source_word: אָסְנַפַּר
  choice: Osnapar
  rationale: Pinananatili ang anyo ng pangalang Aramaiko sa teksto sa halip na palitan ito ng ipinapalagay na historikal na pagkakakilanlan.
- source_word: רַבָּא וְיַקִּירָא
  choice: dakila at marangal
  rationale: Pinananatili ng pares na ito ang mataas at magalang na titulong ibinibigay kay Osnapar.
- source_word: וְהוֹתֵב הִמּוֹ
  choice: at pinatira
  rationale: Ang causative na anyo ay tumutukoy sa planadong pagpapatira o resettlement sa mga ipinatapon.
- source_word: בְּקִרְיָה דִּי שָׁמְרָיִן
  choice: sa lungsod ng Samaria
  rationale: Pinananatili ang tahasang isahan na “lungsod” sa tekstong Aramaiko.
- source_word: וּשְׁאָר עֲבַר נַהֲרָה
  choice: at sa iba pang bahagi ng Lalawigan sa Kabilang-Ilog
  rationale: Ang “Kabilang-Ilog” ay pangalang administratibo ng Persia para sa rehiyon sa kanluran ng Eufrates. Idinagdag ang “Lalawigan” upang maging malinaw sa karaniwang mambabasa ang gamit nito bilang katawagang heograpiko-administratibo.
- source_word: וּכְעֶנֶת
  choice: 'at ngayon:'
  rationale: Isa itong pormulang Aramaiko sa liham na naghuhudyat ng paglipat tungo sa pangunahing nilalaman.
