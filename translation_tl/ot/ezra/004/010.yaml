translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang anyong pira-piraso ng talata sapagkat bahagi ito ng mahabang pagpapakilala sa liham na nagsimula sa naunang talata. Inayos ang mga talababa ayon sa pagkakasunod ng mga marker sa pangunahing teksto.
