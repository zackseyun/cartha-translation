  terminology: Ang “sipi ng dokumento,” “Haring Artaxerxes,” “pari,” “eskriba,” “mga tuntunin,” at “Yahweh” ay angkop sa konteksto at rehistro. Ang “eskriba” ay mas tapat kaysa sa interpretatibong “dalubhasa.”
