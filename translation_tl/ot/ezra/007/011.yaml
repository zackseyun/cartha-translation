source:
  edition: WLC
  text: וְ/זֶ֣ה פַּרְשֶׁ֣גֶן הַֽ/נִּשְׁתְּוָ֗ן אֲשֶׁ֤ר נָתַן֙ הַ/מֶּ֣לֶךְ אַרְתַּחְשַׁ֔סְתְּא לְ/עֶזְרָ֥א הַ/כֹּהֵ֖ן הַ/סֹּפֵ֑ר סֹפֵ֞ר דִּבְרֵ֧י מִצְוֺת יְהוָ֛ה וְ/חֻקָּ֖י/ו עַל יִשְׂרָאֵֽל׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/011.yaml
  text: 'This is the copy of the document that King Artaxerxes gave to Ezra the priest[a], the scribe[b], a scribe of the words of the commandments of Yahweh and of his statutes for Israel:'
translation:
  language: tl
  text: Ito ang sipi ng dokumento[a] na ibinigay ni Haring Artaxerxes kay Ezra na pari, ang eskriba, isang eskriba ng mga salita ng mga utos ni Yahweh at ng kanyang mga tuntunin para sa Israel:[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “teksto ng liham” o “kopya ng opisyal na kasulatan.”
    reason: lexical_alternative
  - marker: b
    text: Ang “para sa Israel” ay maaari ring isaling “tungkol sa Israel” o “may kinalaman sa Israel”; maaari ring maunawaan ang parirala bilang nagpapahiwatig ng kapamahalaan sa Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזֶה
  choice: Ito ang
  rationale: Ipinakikilala ng parirala ang dokumentong susunod. Hindi na kailangang tumbasan nang hiwalay ang וְ sa Filipino dahil natural na naipahihiwatig ng konteksto ang paglipat ng diskurso.
- source_word: פַּרְשֶׁגֶן הַנִּשְׁתְּוָן
  choice: sipi ng dokumento
  rationale: Ang פַּרְשֶׁגֶן ay sipi o transcript, at ang הַנִּשְׁתְּוָן ay isang opisyal na sulat o dokumento. Ang “sipi ng dokumento” ay malinaw, natural, at hindi labis na nagpapasya kung liham o kautusang maharlika ang uri nito.
- source_word: נָתַן
  choice: ibinigay
  rationale: Pinananatili nito ang payak na kahulugan ng pandiwa sa halip na gawing mas interpretatibong “ipinalabas” o “iginawad.”
- source_word: הַמֶּלֶךְ אַרְתַּחְשַׁסְתְּא
  choice: Haring Artaxerxes
  rationale: Isinalin ang titulo at isinalin-titik ang pangalang pantangi sa anyong kilala sa Filipino.
- source_word: הַכֹּהֵן הַסֹּפֵר
  choice: pari at eskriba
  rationale: Tuwirang inilalahad ang dalawang tungkulin ni Ezra. Ang “eskriba” ay nagpapanatili sa opisyal at tekstuwal na diwa ng סֹפֵר.
- source_word: סֹפֵר דִּבְרֵי מִצְוֺת יְהוָה
  choice: isang eskriba ng mga salita ng mga utos ni Yahweh
  rationale: Pinananatili ang appositional na paglalarawan at ang diin ng Hebreo sa mga nakasulat na salita ng mga utos, nang hindi ito pinapakahulugang “dalubhasa” o “bihasa.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinalin-titik ang personal na pangalang banal sa halip na palitan ito ng isang titulo.
- source_word: וְחֻקָּיו
  choice: at ng kanyang mga tuntunin
  rationale: Ang “mga tuntunin” ay natural na Filipino para sa mga itinakdang legal o panrelihiyong alituntunin at pinananatili ng “kanyang” ang reperensiya kay Yahweh.
- source_word: עַל יִשְׂרָאֵל
  choice: para sa Israel
  rationale: Natural nitong ipinapahayag na ang mga utos at tuntunin ay nauukol o inilalapat sa Israel, habang inilalagay sa talababa ang iba pang posibleng ugnayan ng עַל.
theological_decisions:
- issue: Paglalarawan kay Ezra bilang סֹפֵר
  choice: eskriba
  alternative: dalubhasa sa mga utos
  rationale: Hindi ginagawang tahasang pahayag ng kahusayan ang katawagan; pinananatili ang posibleng opisyal at tekstuwal na diwa nito.
- issue: Pagpapakahulugan sa עַל יִשְׂרָאֵל
  choice: para sa Israel
  alternative: tungkol sa Israel; may kapamahalaan sa Israel
  rationale: Ang “para sa Israel” ang pinakanatural sa konteksto ng mga utos at tuntunin, ngunit hindi ganap na isinasara ang leksikal na posibilidad ng reperensiya o awtoridad, kaya binabanggit ang mga iyon sa talababa.
- issue: Pagsasalin sa pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; PANGINOON
  rationale: Pinananatili ang personal na pangalan sa tekstong Hebreo sa halip na palitan ito ng titulo.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “dokumento” para sa malinaw na opisyal na konteksto at “eskriba” upang mapanatili ang historikal na tungkulin. Ang tutuldok sa dulo ay pinanatili sapagkat ipinakikilala ng talata ang dokumentong sisipiin sa kasunod na mga talata.
