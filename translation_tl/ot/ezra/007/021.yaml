base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/021.yaml
  text: 'And from me, I, King Artaxerxes, issue a decree to all the treasurers in Beyond the River: whatever Ezra the priest, the scribe of the law of the God of heaven, asks of you, let it be done diligently.'
translation:
  language: tl
  text: 'At ito ang utos mula sa akin—ako, si Haring Artaxerxes—para sa lahat ng ingat-yaman sa Kabila ng Ilog[b]: Anuman ang hingin sa inyo ni Ezra na pari, ang eskriba ng Kautusan ng Diyos ng langit, ay gawin nang buong ingat.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “gawin nang eksakto” o “gawin kaagad.” Idiniriin ng salitang Aramaiko ang maingat at ganap na pagsunod.
    reason: lexical_alternative
  - marker: b
    text: Ang “Kabila ng Ilog” ang tawag ng pamahalaang Persiano sa rehiyon sa kanluran ng Ilog Eufrates.
    reason: cultural_note
lexical_decisions:
- source_word: וּמִנִּי אֲנָה
  choice: At mula sa akin—ako
  rationale: Pinananatili ang mariing, tahasang personal na awtorisasyon ng hari habang ginagawang mababasa sa makabagong Tagalog.
- source_word: אַרְתַּחְשַׁסְתְּא מַלְכָּא
  choice: si Haring Artaxerxes
  rationale: Likas na ayos sa Tagalog para sa pangalan at titulong maharlika.
- source_word: שִׂים טְעֵם
  choice: inilalabas ang utos na ito
  rationale: Ipinahahayag ang pormal na pagpapalabas ng isang utos ng hari; ang “na ito” ay tumutukoy sa mismong pahayag nang hindi dinaragdagan ang nilalaman nito.
- source_word: לְכֹל גִּזַּבְרַיָּא
  choice: sa lahat ng ingat-yaman
  rationale: Ang “ingat-yaman” ay malinaw at maikling katawagan sa mga opisyal na nangangasiwa sa kabang-yaman.
- source_word: דִּי בַּעֲבַר נַהֲרָה
  choice: sa Kabila ng Ilog
  rationale: Pinananatili bilang pangalang administratibo ng rehiyon, kaya ginamitan ng malaking titik at ipinaliwanag sa talababa.
- source_word: כָל דִּי יִשְׁאֲלֶנְכוֹן
  choice: Anuman ang hingin sa inyo
  rationale: Likas na salin ng di-tiyak na sugnay at ng pandiwang nangangahulugang humingi o humiling, nang hindi pinalalakas tungo sa “ipag-utos.”
- source_word: עֶזְרָא כָהֲנָה
  choice: ni Ezra na pari
  rationale: Malinaw na ipinakikilala ang tungkulin ni Ezra sa natural na balangkas ng pangungusap sa Tagalog.
- source_word: סָפַר דָּתָא
  choice: ang tagapagsulat ng Kautusan
  rationale: Pinananatili ang opisyal at iskolar na diwa ng סָפַר; ang “Kautusan” ay tumutukoy sa kinikilalang banal na kautusan sa konteksto.
- source_word: דִּי אֱלָהּ שְׁמַיָּא
  choice: ng Diyos ng langit
  rationale: Tuwirang pinananatili ang titulong ginagamit para sa Diyos sa panahong imperyal.
- source_word: אָסְפַּרְנָא יִתְעֲבִד
  choice: ay gawin nang buong ingat
  rationale: Ipinapakita ang maingat at ganap na pagsunod, habang kinikilala sa talababa ang saklaw na “eksakto” o “kaagad.”
