base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/023.yaml
  text: Whatever is commanded by the God of heaven[a], let it be done diligently for the house of the God of heaven[b], lest wrath come upon the kingdom of the king and his sons.
translation:
  language: tl
  text: Anuman ang iutos ng Diyos ng langit ay gawin nang buong sikap para sa bahay ng Diyos ng langit[a], upang hindi dumating ang poot sa kaharian ng hari at sa kaniyang mga anak na lalaki.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “bahay ng Diyos ng langit” ay tumutukoy sa templo.
    reason: cultural_note
  - marker: b
    text: 'O, mas literal: “sapagkat bakit magkakaroon ng poot laban sa kaharian ng hari at sa kaniyang mga anak na lalaki?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל דִּי
  choice: Anuman ang
  rationale: Likas na Filipino para sa pangkalahatang di-tiyak na sugnay at pinananatili ang saklaw na ‘lahat ng anumang.’
- source_word: מִן טַעַם
  choice: iutos ng
  rationale: Ang Aramaic na טַעַם ay maaaring tumukoy sa utos, pasiya, o atas; sa kontekstong administratibo, malinaw at natural ang ‘iutos,’ at ipinahihiwatig ng מִן ang pinagmulan.
- source_word: אֱלָהּ שְׁמַיָּא
  choice: Diyos ng langit
  rationale: Karaniwang titulo ito sa Aramaic ng Ezra at natural sa modernong Filipino.
- source_word: יִתְעֲבֵד
  choice: ay gawin
  rationale: Pinananatili ang pasibong anyo at ang puwersa ng tagubilin nang hindi labis na tinutukoy kung pahintulot o obligasyon ang modal na diwa.
- source_word: אַדְרַזְדָּא
  choice: nang buong sikap
  rationale: Ipinahahayag ang masigasig, maingat, at maagap na pagtupad na hinihingi ng bihirang administratibong pang-abay.
- source_word: לְבֵית
  choice: para sa bahay ng
  rationale: Pinananatili ang literal na metaporang ‘bahay’; sa konteksto, ito ang templo.
- source_word: דִּי לְמָה
  choice: upang hindi
  rationale: Natural na Filipino para sa babalang layunin o kinalabasan ng idyoma, habang inilalagay sa talababa ang mas literal na retorikal na tanong.
- source_word: לֶהֱוֵא קְצַף
  choice: bumagsak ang poot
  rationale: Ang pandiwa ay literal na ‘magkaroon/mangyari’; ang ‘bumagsak ang poot’ ay likas na paglalarawan sa Filipino ng kapahamakang dulot ng poot nang hindi tinutukoy nang higit sa teksto ang anyo nito.
- source_word: עַל מַלְכוּת מַלְכָּא
  choice: sa kaharian ng hari
  rationale: Pinananatili ang pagtukoy sa nasasakupan o kaharian, hindi lamang sa mismong hari.
- source_word: וּבְנוֹהִי
  choice: at sa kaniyang mga anak
  rationale: Ang literal na kahulugan ay mga anak na lalaki, ngunit sa Filipino ang ‘mga anak’ ay mas natural sa konteksto ng sambahayan o dinastiya; ipinapaliwanag sa talababa ang mas tiyak na anyo.
theological_decisions:
- issue: Pagbibigay-kahulugan sa בֵית אֱלָהּ שְׁמַיָּא
  choice: bahay ng Diyos ng langit
  alternative: templo ng Diyos ng langit
  rationale: Pinananatili sa pangunahing teksto ang metaporang ‘bahay’ ng orihinal at nililinaw sa talababa na templo ang tinutukoy.
- issue: Anyo ng babala sa דִּי לְמָה לֶהֱוֵא קְצַף
  choice: upang hindi bumagsak ang poot
  alternative: sapagkat bakit magkakaroon ng poot?
  rationale: Ipinahahayag ng pangunahing teksto ang puwersa ng babala, ngunit pinananatili sa talababa ang tunay na posibilidad ng mas literal na retorikal na tanong nang hindi nagdaragdag ng tiyak na doktrinal na paliwanag.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang ‘kaniyang’ para sa pormal na biblikal na daloy. Iniwasan ang sobrang teknikal na ‘atas’ at ang lipas na ‘nang buong kasipagan.’
