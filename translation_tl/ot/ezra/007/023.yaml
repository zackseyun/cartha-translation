  source_fidelity: Tumpak ang pangkalahatang diwa ng utos at babala. Gayunman, ang “bumagsak ang poot” ay mas matalinghaga kaysa sa payak na diwang ‘magkaroon/dumating ang poot,’ at ang וּבְנוֹהִי ay tiyak na ‘mga anak na lalaki,’ hindi lamang ‘mga anak.’
  naturalness: Marangal at madaling maunawaan ang Filipino. Mas natural at mas malapit sa Aramaic ang “dumating ang poot” kaysa “bumagsak ang poot.”
  terminology: Ang “Diyos ng langit,” “bahay ng Diyos ng langit,” at “kaharian ng hari” ay angkop at pinananatili ang mahahalagang termino ng pinagmulan. Ang talababa tungkol sa ‘bahay’ bilang templo ay wastong nakaangkla.
