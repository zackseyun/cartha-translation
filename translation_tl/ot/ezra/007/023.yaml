revisions:
- from: Anuman ang iutos ng Diyos ng langit ay gawin nang buong sikap para sa bahay ng Diyos ng langit[a], upang hindi bumagsak ang poot sa kaharian ng hari at sa kaniyang mga anak.[b]
  to: Anuman ang iutos ng Diyos ng langit ay gawin nang buong sikap para sa bahay ng Diyos ng langit[a], upang hindi dumating ang poot sa kaharian ng hari at sa kaniyang mga anak na lalaki.[b]
  rationale: Pinalitan ang “bumagsak ang poot” ng “dumating ang poot” upang mas malapit sa diwa ng Aramaic na lĕhewē qĕṣap at upang iwasan ang dagdag na matalinghagang larawan. Ginawang “mga anak na lalaki” ang “mga anak” upang maipakita ang tiyak na kasarian ng bĕnôhî. Pinanatili ang anyo ng babala sa pangunahing teksto at ang mas literal na retorikal na tanong sa talababa.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T04:15:36Z'
