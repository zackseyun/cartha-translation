translation_notes:
  register: Pormal ngunit natural na modernong Filipino, angkop sa isang opisyal na kautusan. Ginamit ang “bahay ng Diyos” upang panatilihin ang larawan ng orihinal, at hindi idinagdag ang “iba pang” bago ang huling pangkat.
