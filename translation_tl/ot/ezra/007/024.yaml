base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/024.yaml
  text: And we make known to you that it is not permitted to impose tribute[a], tax, or toll on any of the priests, Levites, singers, gatekeepers, temple servants[b], or servants of this house of God.
translation:
  language: tl
  text: At ipinababatid namin sa inyo na hindi ipinahihintulot na patawan ng tributo, buwis, o bayad sa pagdaan[a] ang sinuman sa mga pari, Levita, mang-aawit, bantay-pinto, tagapaglingkod sa templo[b], o tagapaglingkod sa bahay na ito ng Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang tatlong terminong piskal ay malamang na tumutukoy sa magkakaibang uri ng pataw ng imperyo. Maaari ring isalin ang mga ito na “tributo, buwis sa kalakal, o bayad sa pagbiyahe.”
    reason: lexical_alternative
  - marker: b
    text: O “mga Netinim,” ang tradisyonal na transliterasyon ng נְתִינַיָּא.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְהוֹדְעִין
  choice: ipinababatid namin
  rationale: Ang Aramaikong participle ay pormula ng opisyal na pagpapahayag; pinananatili ng “ipinababatid namin” ang pormal at administratibong tono.
- source_word: כָל
  choice: ang sinuman sa
  rationale: Sa konteksto ng negatibong legal na pahayag, likas itong nagpapahayag na walang sinuman sa mga nakalistang pangkat ang maaaring patawan.
- source_word: כָהֲנַיָּא
  choice: mga pari
  rationale: Karaniwang tawag sa uring pari.
- source_word: לֵוָיֵא
  choice: mga Levita
  rationale: Karaniwang katawagang Filipino para sa uring Levitico.
- source_word: זַמָּרַיָּא
  choice: mga mang-aawit
  rationale: Tuwirang tumutukoy sa mga gumaganap ng musikal na pagpupuri sa templo.
- source_word: תָרָעַיָּא
  choice: mga bantay-pinto
  rationale: Malinaw na tumutukoy sa mga nagbabantay o nangangasiwa sa mga pintuan.
- source_word: נְתִינַיָּא
  choice: mga tagapaglingkod sa templo
  rationale: Inihahayag ang gawain ng pangkat sa halip na gumamit ng di-pamilyar na transliterasyong “Netinim.”
- source_word: פָלְחֵי בֵּית אֱלָהָא דְנָה
  choice: mga tagapaglingkod sa bahay na ito ng Diyos
  rationale: Pinananatili ang malawak na kahulugan ng mga naglilingkod sa bahay ng Diyos nang hindi idinaragdag ang salitang “iba pang,” na wala sa teksto.
- source_word: מִנְדָּה
  choice: buwis
  rationale: Tumutukoy sa ipinapataw na buwis o tributo; “buwis” ang pinakanatural na pangkalahatang katawagan sa Filipino.
- source_word: בְלוֹ
  choice: singil
  rationale: Pinananatiling naiiba sa pangkalahatang buwis at sa bayad sa pagdaan, bagaman hindi tiyak ang eksaktong pagkakaiba ng tatlong terminong piskal.
- source_word: וַהֲלָךְ
  choice: bayad sa pagdaan
  rationale: Malamang na tumutukoy sa bayad sa daan, pagbiyahe, o adwana; malinaw sa karaniwang mambabasa ang “bayad sa pagdaan.”
- source_word: לָא שַׁלִּיט לְמִרְמֵא עֲלֵיהֹם
  choice: hindi ipinahihintulot na patawan
  rationale: Natural na ipinapahayag sa Filipino ang legal na kawalan ng pahintulot o awtoridad na magpataw ng mga singil.
