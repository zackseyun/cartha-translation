base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/014.yaml
  text: because you are sent from before the king and his seven counselors to inquire concerning Judah and Jerusalem according to the law of your God that is in your hand[a][b].
translation:
  language: tl
  text: sapagkat isinugo ka mula sa harap ng hari at ng pito niyang tagapayo upang magsiyasat tungkol sa Juda at Jerusalem ayon sa kautusan ng iyong Diyos na nasa iyong kamay[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mula sa presensiya ng hari.” Binibigyang-diin ng idyomang Aramaiko sa maharlikang korte na ang atas kay Ezra ay nagmula sa mismong presensiya ng hari.
    reason: lexical_alternative
  - marker: b
    text: O “na nasa iyong pag-iingat” o “na ipinagkatiwala sa iyo.” Sa literal, “na nasa iyong kamay.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל־קֳבֵל דִּי
  choice: sapagkat
  rationale: Ipinahahayag ng idyomang Aramaiko ang dahilan ng atas; likas at marangal sa Filipino ang “sapagkat.”
- source_word: מִן קֳדָם מַלְכָּא
  choice: mula sa harapan ng hari
  rationale: Pinananatili nito ang literal na idyomang panghukuman at ipinahihiwatig na nagmula sa presensiya at awtoridad ng hari ang pagsusugo.
- source_word: וְשִׁבְעַת יָעֲטֹהִי
  choice: at ng pito niyang tagapayo
  rationale: Tumutukoy ito sa pitong opisyal na nagbibigay ng payo sa hari; malinaw at kasalukuyang Filipino ang “tagapayo.”
- source_word: שְׁלִיחַ
  choice: isinugo ka
  rationale: Tumpak nitong inilalahad ang pasibong anyo at ang opisyal na pagpapadala kay Ezra nang hindi dinaragdagan ang kahulugan.
- source_word: לְבַקָּרָא
  choice: upang siyasatin
  rationale: Saklaw ng pandiwa ang masusing pag-usisa o pagsusuri sa kontekstong administratibo; higit na angkop dito ang “siyasatin” kaysa karaniwang “magtanong.”
- source_word: עַל יְהוּד וְלִירוּשְׁלֶם
  choice: ang tungkol sa Juda at Jerusalem
  rationale: Ipinakikita ng parirala ang paksa o saklaw ng pagsisiyasat nang hindi ipinapalagay na pamamahala “sa ibabaw” ng mga ito.
- source_word: בְּדָת אֱלָהָךְ
  choice: ayon sa kautusan ng iyong Diyos
  rationale: Ipinahahayag ng pang-ukol na ang kautusan ng Diyos ang pamantayan ng pagsisiyasat.
- source_word: דִּי בִידָךְ
  choice: na nasa iyong kamay
  rationale: Pinananatili ang konkretong idyoma ng orihinal, na maaaring tumukoy sa aktuwal na paghawak, pag-iingat, o ipinagkatiwalang kapamahalaan sa kautusan.
