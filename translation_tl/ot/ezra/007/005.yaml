  text: son of Abishua[a], son of Phinehas, son of Eleazar[b], son of Aaron the chief priest.
translation:
  language: tl
  text: anak ni Abisua,[a] na anak ni Finehas, na anak ni Eleazar, na anak ni Aaron, ang punong pari.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa mga talaangkanang Hebreo, ang “anak ni” ay maaari ring mangahulugang “inapo ni,” sapagkat kung minsan ay hindi binabanggit ang bawat salinlahi.
    reason: lexical_alternative
  - marker: b
    text: 'Tradisyonal na “dakilang pari.” Literal sa Hebreo: “ang pari, ang ulo/puno”; hindi ito ang mas karaniwang pariralang Hebreo para sa “dakilang pari.”'
    reason: alternative_reading
lexical_decisions:
- source_word: בֶּן
  choice: anak ni
  rationale: Pinananatili ang paulit-ulit na pormula ng talaangkanan. Maaari rin itong tumukoy sa mas malayong inapo kapag may mga salinlahing hindi binanggit.
- source_word: אֲבִישׁוּעַ
  choice: Abisua
  rationale: Isinatitik ang pangalang Hebreo sa likas at nakagawiang anyong Filipino.
- source_word: פִּינְחָס
  choice: Finehas
  rationale: Ginamit ang pamilyar na anyong Filipino ng pangalang biblikal.
- source_word: אֶלְעָזָר
  choice: Eleazar
  rationale: Pinanatili ang nakagawiang anyong Filipino ng pangalan.
- source_word: אַהֲרֹן
  choice: Aaron
  rationale: Pinanatili ang nakagawiang anyong Filipino ng pangalan.
- source_word: הַכֹּהֵן הָרֹאשׁ
  choice: ang punong pari
  rationale: Ang רֹאשׁ ay literal na “ulo” at sa titulong ito ay nangangahulugang nangunguna o puno. Ang “punong pari” ay natural sa Filipino at mas malapit sa mismong parirala kaysa sa tradisyonal na “dakilang pari.”
theological_decisions:
- issue: Pagtukoy sa titulong pangpari ni Aaron
  choice: punong pari
  alternative: dakilang pari
  rationale: Ang Hebreo ay הַכֹּהֵן הָרֹאשׁ, “ang pari, ang puno/ulo,” hindi ang mas karaniwang pariralang הַכֹּהֵן הַגָּדוֹל para sa “dakilang pari.” Pinananatili ng “punong pari” ang pagkakaibang leksikal nang hindi itinatanggi ang pangunahing katayuan ni Aaron.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ang pagdaragdag ng “na” sa mga sumunod na kawing ay nagpapalinaw sa sunod-sunod na angkan nang hindi binabago ang istruktura ng Hebreo.
