  naturalness: Pormal ang himig ng draft, ngunit mas likas sa modernong Filipino ang “Ito ang aking utos” at “magboluntaryong pumunta.” Ang tahasang paghahanay sa mga pangkat sa pamamagitan ng mga gitling at “o” ay malinaw at hindi mabigat basahin.
  terminology: Ang “bayan ng Israel,” “mga pari nito,” “mga Levita,” at “Jerusalem” ay angkop. Pinananatili ang “nito” bilang pinapaborang pagtukoy sa Israel, habang ang talababang alternatibo ay wasto at hindi nagtatakda nang lampas sa tekstuwal na ambigwidad.
