- from: Naglalabas ako ng utos na sinuman sa aking kaharian na mula sa bayan ng Israel—kabilang ang mga pari nito[b] at mga Levita—na kusang-loob na naghahandog ng sarili[a] upang pumunta sa Jerusalem kasama mo ay maaaring pumunta.
  to: 'Ito ang aking utos: ang sinuman sa aking kaharian—mula sa bayan ng Israel, sa mga pari nito[b], o sa mga Levita—na magboluntaryong pumunta[a] sa Jerusalem kasama mo ay maaaring pumunta.'
  rationale: Inayos ang sintaks upang malinaw na maipakita ang tatlong pangkat sa pinagmulan, at pinalitan ang literal ngunit potensiyal na nakalilitong “naghahandog ng sarili” ng natural na “magboluntaryong pumunta.” Napanatili ang pahintulot ng utos, ang pagsama kay Ezra, at ang tekstuwal na ambigwidad ng hulaping panghalip sa talababa.
