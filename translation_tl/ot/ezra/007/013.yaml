  text: מִנִּ/י֮ שִׂ֣ים טְעֵם֒ דִּ֣י כָל מִתְנַדַּ֣ב בְּ/מַלְכוּתִ/י֩ מִן עַמָּ֨/ה יִשְׂרָאֵ֜ל וְ/כָהֲנ֣וֹ/הִי וְ/לֵוָיֵ֗/א לִ/מְהָ֧ךְ לִֽ/ירוּשְׁלֶ֛ם עִמָּ֖/ךְ יְהָֽךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/013.yaml
  text: A decree is issued by me that anyone in my kingdom from the people of Israel[a], and their priests and Levites, who freely offers himself to go to Jerusalem with you[b], may go.
translation:
  language: tl
  text: 'Ito ang aking utos: ang sinuman sa aking kaharian—mula sa bayan ng Israel, sa mga pari nito[b], o sa mga Levita—na magboluntaryong pumunta[a] sa Jerusalem kasama mo ay maaaring pumunta.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “na kusang-loob na magpasiyang pumunta.” Binibigyang-diin ng participle sa Aramaiko na ang pagkilos ay bukal sa loob at hindi sapilitan.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “mga pari niya” kung iba ang pagtukoy sa hulaping panghalip; mas pinapaboran ng konteksto ang “mga pari nito,” na tumutukoy sa Israel.
    reason: alternative_reading
lexical_decisions:
- source_word: מִנִּי שִׂים טְעֵם
  choice: Naglalabas ako ng utos
  rationale: Likas na pormulang administratibo sa modernong Filipino; malinaw na ang hari ang pinagmumulan ng opisyal na utos habang pinananatili ang pormal na himig.
- source_word: דִּי
  choice: na
  rationale: Ipinakikilala nito ang nilalaman ng utos sa paraang natural sa Filipino.
- source_word: כָל מִתְנַדַּב
  choice: sinuman ... na kusang-loob na naghahandog ng sarili
  rationale: Pinananatili ang boluntaryo at pansariling diwa ng Hitpael participle, hindi lamang ang pangkalahatang kahulugang ‘nagnanais.’
- source_word: בְּמַלְכוּתִי
  choice: sa aking kaharian
  rationale: Tuwirang tumutukoy sa nasasakupan ng hari at malinaw sa karaniwang mambabasa.
- source_word: מִן עַמָּה יִשְׂרָאֵל
  choice: mula sa bayan ng Israel
  rationale: Natural na Filipino para sa pangkat na etniko at pambansa na tinutukoy ng teksto.
- source_word: וְכָהֲנוֹהִי
  choice: kabilang ang mga pari nito
  rationale: Ang hulaping panghalip ay pinakamalamang na tumutukoy sa Israel; ginamit ang ‘nito’ upang hindi mapagkamalang mga pari ng hari.
- source_word: וְלֵוָיֵא
  choice: at mga Levita
  rationale: Karaniwang katawagan sa Filipino para sa pangkat na ito ng mga tagapaglingkod sa templo.
- source_word: לִמְהָךְ לִירוּשְׁלֶם עִמָּךְ
  choice: upang pumunta sa Jerusalem kasama mo
  rationale: Malinaw na ipinapahayag ang layunin, patutunguhan, at pagsama kay Ezra.
- source_word: יְהָךְ
  choice: ay maaaring pumunta
  rationale: Ipinahahayag ang pahintulot na ipinagkakaloob ng utos, sa halip na isang payak na panghinaharap.
theological_decisions:
- issue: Tinutuon ng hulaping panghalip sa וְכָהֲנוֹהִי
  choice: mga pari nito, na tumutukoy sa Israel
  alternative: mga pari niya
  rationale: Pinapaboran ng kalapit na antecedent at konteksto ang Israel, ngunit tunay na maaaring basahin sa ibang paraan ang anyong Aramaiko kaya inilagay ang alternatibo sa talababa.
translation_notes:
  register: Pormal at marangal ang himig bilang isang utos ng hari, ngunit gumagamit ng kasalukuyan at madaling maunawaang Filipino. Ang mga gitling na pahaba ay naglilinaw na ang mga pari at Levita ay kabilang sa mga maaaring kusang sumama.
