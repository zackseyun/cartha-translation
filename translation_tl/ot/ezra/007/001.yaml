  source_fidelity: Tumpak na naihahatid ng salin ang pagkakasunod sa panahon, ang panahon ng paghahari ni Artajerjes, at ang pormulang talaangkanan. Ang “anak” at ang talababa ay wastong nag-iingat sa posibilidad na ang בן ay maaaring tumukoy sa mas malayong inapo.
  naturalness: Nauunawaan ang draft, ngunit mas natural at malinaw sa makabagong Filipino ang appositional na “si Ezra, anak ni …” kaysa sa paulit-ulit na “na anak ni …”. Ang paglalagay ng kuwit sa “Artajerjes, hari ng Persia” ay mas malinaw na nagpapakitang pagpapakilala ito sa hari.
  terminology: Ang Artajerjes, Ezra, Seraias, Azarias, at Hilkias ay magkakatugma at katanggap-tanggap na mga anyong Filipino ng mga pangalan. Ang “paghahari” at “talaangkanan” ay angkop sa rehistro at diwa ng Hebreo.
