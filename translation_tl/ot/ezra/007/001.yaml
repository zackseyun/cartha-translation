base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/001.yaml
  text: After these things[a], in the reign of Artaxerxes king of Persia, Ezra son of Seraiah, son of Azariah, son of Hilkiah—
translation:
  language: tl
  text: Pagkatapos ng mga pangyayaring ito, sa paghahari ni Artajerjes, hari ng Persia, si Ezra, anak[a] ni Seraias, anak ni Azarias, anak ni Hilkias—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa mga talaangkanan, ang Hebreong salitang isinaling “anak” ay maaari ring tumukoy sa isang mas malayong inapo, hindi lamang sa tuwirang anak.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַחַר
  choice: Pagkatapos
  rationale: Ipinakikilala nito ang kasunod na yugto ng salaysay habang iniuugnay iyon sa naunang pangyayari. Likas sa Filipino ang “Pagkatapos” at hindi na kailangang dagdagan ng tahasang katumbas ng pang-ugnay na וְ.
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: ng mga pangyayaring ito
  rationale: Sa konteksto, ang דְּבָרִים ay tumutukoy sa mga naunang pangyayari o usapin. Mas natural at malinaw dito ang “mga pangyayari” kaysa sa literal na “mga bagay.”
- source_word: בְּ/מַלְכוּת
  choice: sa paghahari ni
  rationale: Tumutukoy ang parirala sa panahon ng pamumuno ng hari, hindi sa teritoryo ng kaharian.
- source_word: אַרְתַּחְשַׁסְתְּא
  choice: Artajerjes
  rationale: Ginamit ang nakaugaliang anyong Filipino ng pangalan ng haring Persiano.
- source_word: מֶלֶךְ פָּרָס
  choice: na hari ng Persia
  rationale: Malinaw at natural na panuring ito kay Artajerjes at pinananatili ang pagkakakilanlan niya bilang hari ng Persia.
- source_word: עֶזְרָא
  choice: Ezra
  rationale: Ginamit ang karaniwang anyo ng pangalang ito sa modernong Filipino.
- source_word: בֶּן
  choice: anak ni
  rationale: Pinananatili nito ang pormulang ginagamit sa talaangkanan. Maaari rin itong tumukoy sa mas malayong inapo, kaya nilinaw ang saklaw sa talababa sa halip na gawing “inapo” ang pangunahing teksto.
- source_word: שְׂרָיָה
  choice: Seraias
  rationale: Ginamit ang natural at nakaugaliang anyong Filipino ng pangalan.
- source_word: עֲזַרְיָה
  choice: Azarias
  rationale: Ginamit ang natural at nakaugaliang anyong Filipino ng pangalan.
- source_word: חִלְקִיָּה
  choice: Hilkias
  rationale: Ginamit ang natural at nakaugaliang anyong Filipino ng pangalan.
