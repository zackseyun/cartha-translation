  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/אַ֣נְתְּ עֶזְרָ֗א כְּ/חָכְמַ֨ת אֱלָהָ֤/ךְ דִּֽי בִ/ידָ/ךְ֙ מֶ֣נִּי שָׁפְטִ֞ין וְ/דַיָּנִ֗ין דִּי לֶהֱוֺ֤ן דאנין לְ/כָל עַמָּ/ה֙ דִּ֚י בַּ/עֲבַ֣ר נַהֲרָ֔/ה לְ/כָל יָדְעֵ֖י דָּתֵ֣י אֱלָהָ֑/ךְ וְ/דִ֧י לָ֦א יָדַ֖ע תְּהוֹדְעֽוּן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/025.yaml
  text: And you[a], Ezra, according to the wisdom of your God that is in your hand, appoint magistrates and judges who may judge all the people who are beyond the River—all who know the laws of your God; and those who do not know them[b], you shall teach.
translation:
  language: tl
  text: At ikaw, Ezra, ayon sa karunungan ng iyong Diyos na nasa iyong kamay[a], magtalaga ka ng mga mahistrado at mga hukom upang humatol sa lahat ng mamamayan sa Kabilang-Ilog[b]—lahat ng nakaaalam ng mga kautusan ng iyong Diyos. At ang mga hindi nakaaalam ng mga ito, turuan ninyo sila.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “na taglay mo” o “na ipinagkatiwala sa iyo.” Ang idyomang Aramaiko na “nasa iyong kamay” ay maaaring magpahiwatig ng pag-aari o ng ipinagkatiwalang kapangyarihan.
    reason: lexical_alternative
  - marker: b
    text: Ang “Kabilang-Ilog” ay katawagang administratibo ng Persia para sa teritoryo sa kanluran ng Ilog Eufrates.
    reason: cultural_note
  - marker: c
    text: Maramihan ang “ninyo” sa Aramaiko; maaaring tinutukoy nito si Ezra kasama ng mga opisyal na itatalaga niya.
    reason: textual_grammar
lexical_decisions:
- source_word: כְּחָכְמַת אֱלָהָךְ
  choice: ayon sa karunungan ng iyong Diyos
  rationale: Ipinahahayag ng כְּ ang pagsunod o pag-ayon sa isang pamantayan; natural at tumpak sa Filipino ang “ayon sa.”
- source_word: דִּי בִידָךְ
  choice: na nasa iyong kamay
  rationale: Pinananatili ang larawang Aramaiko, na maaaring tumukoy sa taglay na karunungan o sa ipinagkatiwalang kapangyarihan nang hindi pinipili nang tahasan ang isa.
- source_word: מֶנִּי
  choice: magtalaga ka
  rationale: Sa kontekstong administratibo, tumutukoy ito sa pormal na paghirang ng mga opisyal.
- source_word: שָׁפְטִין וְדַיָּנִין
  choice: mga mahistrado at mga hukom
  rationale: Pinananatiling magkahiwalay ang dalawang uri o katawagan sa mga opisyal ng hukuman sa halip na pagsamahin ang mga ito.
- source_word: דִּי לֶהֱוֺן דאנין
  choice: upang humatol
  rationale: Malinaw na ipinakikita ang layunin o tungkulin ng mga itatalaga.
- source_word: לְכָל עַמָּה
  choice: sa lahat ng taong
  rationale: Natural na salin sa Filipino ng kolektibong parirala habang pinananatili ang saklaw na lahat.
- source_word: דִּי בַּעֲבַר נַהֲרָה
  choice: nasa Kabilang-Ilog
  rationale: Itinuturing ang parirala bilang katawagang administratibo para sa rehiyon sa kanluran ng Eufrates, at pinananatili ang pananaw ng pamahalaang Persiano.
- source_word: לְכָל יָדְעֵי דָּתֵי אֱלָהָךְ
  choice: sa lahat ng nakaaalam ng mga kautusan ng iyong Diyos
  rationale: Pinananatili ng “mga kautusan” ang maramihang anyo at ang legal-relihiyosong konteksto ng דָּתֵי.
- source_word: וְדִי לָא יָדַע
  choice: At ang mga hindi nakaaalam
  rationale: Natural na ipinakikita ang kaibahan sa mga nakaaalam ng mga kautusang kababanggit lamang; nauunawaan sa konteksto ang layon ng pandiwa.
- source_word: תְּהוֹדְעוּן
  choice: turuan ninyo
  rationale: Ang causative na anyo ng ידע ay “ipaalam” o “gawing nakaaalam”; sa konteksto ng mga kautusan, “turuan” ang pinakanatural. Pinananatili rin ang maramihang kausap ng pandiwa.
theological_decisions:
- issue: Ang “karunungan ng iyong Diyos” na “nasa iyong kamay”
  choice: Pinanatili ang idyomang “nasa iyong kamay.”
  alternative: “na taglay mo” o “na ipinagkatiwala sa iyo”
  rationale: Maaaring tumukoy ang idyoma sa pag-aari, kakayahan, o ipinagkatiwalang awtoridad. Hindi nilutas ng salin ang tunay na lawak ng kahulugan.
- issue: Paglipat mula sa isahang utos tungo sa maramihang utos
  choice: “magtalaga ka” ngunit “turuan ninyo”
  alternative: 'Gawing isahan ang dalawang utos: “magtalaga ka” at “turuan mo”'
  rationale: Isahan ang kausap sa simula at sa utos na magtalaga, ngunit maramihan ang anyo ng pangwakas na pandiwa sa tekstong Aramaiko. Pinanatili ang paglipat, na maaaring magsama kay Ezra at sa mga itinalagang opisyal, nang hindi ito tahasang ipinapakahulugan sa pangunahing teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mahistrado” bilang pamilyar na terminong administratibo-hudisyal, at ang “Kabilang-Ilog” bilang pantanging katawagan na ipinaliliwanag sa talababa. Sinadyang panatilihin ang paglipat mula sa isahang “ka” tungo sa maramihang “ninyo” upang katawanin ang gramatika ng Aramaiko.
