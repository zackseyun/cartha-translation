revisions:
- from: At ikaw, Ezra, ayon sa karunungan ng iyong Diyos na nasa iyong kamay[a], magtalaga ka ng mga mahistrado at mga hukom upang humatol sa lahat ng taong nasa Kabilang-Ilog[b]—sa lahat ng nakaaalam ng mga kautusan ng iyong Diyos. At ang mga hindi nakaaalam, turuan ninyo.[c]
  to: At ikaw, Ezra, ayon sa karunungan ng iyong Diyos na nasa iyong kamay[a], magtalaga ka ng mga mahistrado at mga hukom upang humatol sa lahat ng mamamayan sa Kabilang-Ilog[b]—lahat ng nakaaalam ng mga kautusan ng iyong Diyos. At ang mga hindi nakaaalam ng mga ito, turuan ninyo sila.[c]
  rationale: Nilinaw ang hindi tahasang layon ng pangwakas na sugnay bilang mga kautusan ng Diyos, habang pinanatili ang maramihang “ninyo,” na mahalagang katangian ng tekstong Aramaiko. Inayos din ang sintaks ng saklaw na Kabilang-Ilog at ng appositional na “lahat ng nakaaalam” para maging mas natural ang Filipino nang hindi binabago ang kahulugan o nilulutas ang anumang interpretatibong usapin.
