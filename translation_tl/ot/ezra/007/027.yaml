  naturalness: Marangal at malinaw ang rehistro. Ang pagdaragdag ng “nawa” ay ginagawang likas ang panimulang pormula sa Tagalog na panalanging papuri. Ang “bagay na ito” ay mas idiomatiko at mas malinaw kaysa sa panghalip na “nito” sa konstruksiyong ito.
  terminology: Ang “Yahweh,” “Diyos,” “puso,” at “bahay ni Yahweh” ay naaangkop at pare-pareho. Ang “pagandahin” ay isang mabuting kongkretong salin ng לְפָאֵר; ang mga alternatibo sa talababa ay katanggap-tanggap.
