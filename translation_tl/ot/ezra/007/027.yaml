  text: בָּר֥וּךְ יְהוָ֖ה אֱלֹהֵ֣י אֲבוֹתֵ֑י/נוּ אֲשֶׁ֨ר נָתַ֤ן כָּ/זֹאת֙ בְּ/לֵ֣ב הַ/מֶּ֔לֶךְ לְ/פָאֵ֕ר אֶת בֵּ֥ית יְהוָ֖ה אֲשֶׁ֥ר בִּ/ירוּשָׁלִָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/027.yaml
  text: Blessed be Yahweh[a], the God of our fathers, who put this into the king’s heart, to beautify the house of Yahweh that is in Jerusalem,
translation:
  language: tl
  text: Purihin nawa si Yahweh, ang Diyos ng ating mga ninuno, na naglagay ng bagay na ito sa puso ng hari upang pagandahin[a] ang bahay ni Yahweh na nasa Jerusalem,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “palamutian” o “luwalhatiin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרוּךְ
  choice: Purihin
  rationale: Sa pormulang Hebreo ng pagpupuri sa Diyos, natural at marangal sa modernong Tagalog ang “Purihin,” at naipapahayag nito ang diwang doksolohikal ng passive participle.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֵי אֲבוֹתֵינוּ
  choice: ang Diyos ng ating mga ninuno
  rationale: Ang “mga ninuno” ay natural sa kasalukuyang Tagalog at malinaw na tumutukoy sa mga naunang salinlahi sa pormulang tipan.
- source_word: אֲשֶׁר נָתַן כָּזֹאת בְּלֵב הַמֶּלֶךְ
  choice: na naglagay nito sa puso ng hari
  rationale: Ang “naglagay ... sa puso” ay nagpapanatili sa larawang Hebreo ng panloob na pagkikintal ng layunin; ang “nito” ay payak na tumutukoy sa binanggit na balak ng hari.
- source_word: לְפָאֵר
  choice: upang pagandahin
  rationale: Sa konteksto, ang piel infinitive ay tumutukoy sa pagpapaganda o pagpaparingal sa templo; “pagandahin” ang pinakakongkreto at natural na pangunahing salin.
- source_word: בֵּית יְהוָה
  choice: ang bahay ni Yahweh
  rationale: Pinananatili ng “bahay” ang literal at teolohikal na larawan ng Hebreo, bagaman ang tinutukoy ay ang templo.
- source_word: אֲשֶׁר בִּירוּשָׁלִָם
  choice: na nasa Jerusalem
  rationale: Ito ay natural at tuwirang salin ng sugnay na nagtatakda sa kinaroroonan ng bahay ni Yahweh.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang ginagamit sa talata ang Tetragrammaton. Ang “Yahweh” ay nagpapanatili sa personal na pangalan sa halip na palitan ito ng titulong “PANGINOON.”
- issue: Saklaw ng לְפָאֵר kaugnay ng bahay ni Yahweh
  choice: pagandahin
  alternative: palamutian; luwalhatiin
  rationale: Maaaring saklawin ng pandiwa ang pisikal na pagpapaganda at ang pagpaparingal. Pinili ang kongkretong kahulugan sa konteksto, habang pinananatili sa talababa ang mga tunay na alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang tradisyonal na larawang “puso” at “bahay ni Yahweh” nang hindi ginagawang teknikal o sektaryan ang pananalita.
