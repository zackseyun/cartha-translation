base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/028.yaml
  text: and who extended steadfast love to me before the king and his counselors and all the king’s mighty officials[a]. And I took courage, because the hand of Yahweh my God was upon me[c][b], and I gathered leading men from Israel to go up with me.
translation:
  language: tl
  text: at nagkaloob sa akin ng tapat na pag-ibig[a] sa paningin ng hari, ng kanyang mga tagapayo, at ng lahat ng makapangyarihang opisyal ng hari. Kaya lumakas ang loob ko[b], dahil ang kamay ni Yahweh na aking Diyos ay nasa akin; at tinipon ko ang mga pinuno[c] mula sa Israel upang umahon na kasama ko.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nagpakita sa akin ng kagandahang-loob.”
    reason: lexical_alternative
  - marker: b
    text: 'Mas literal: “Pinalakas ko ang aking sarili ayon sa kamay ni Yahweh na aking Diyos na nasa akin.”'
    reason: lexical_alternative
  - marker: c
    text: Sa Hebreo, “mga ulo”; ibig sabihin, mga pinuno o pangunahing tao ng Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִטָּה חֶסֶד
  choice: nagkaloob sa akin ng tapat na pag-ibig
  rationale: Ipinahahayag nito nang natural sa modernong Tagalog ang pagkilos ng pagpapakita o pagpapaabot ng חֶסֶד, habang pinananatili ng “tapat na pag-ibig” ang katapatan at kagandahang-loob na saklaw ng salita.
- source_word: לִפְנֵי
  choice: sa harap ng
  rationale: Tuwirang katumbas ito na angkop sa konteksto ng hari at ng kanyang korte.
- source_word: יֹעֲצָיו
  choice: kanyang mga tagapayo
  rationale: Natural at malinaw na katawagan sa mga tagapayo ng hari.
- source_word: שָׂרֵי הַמֶּלֶךְ הַגִּבֹּרִים
  choice: makapangyarihang opisyal ng hari
  rationale: Ang “opisyal” ay angkop sa administrasyong Persiano, at pinananatili ng “makapangyarihan” ang diin ng הַגִּבֹּרִים.
- source_word: הִתְחַזַּקְתִּי
  choice: lumakas ang loob ko
  rationale: Natural na idyomang Filipino para sa pagiging matatag o pagkakaroon ng tapang; hindi nito ipinahihiwatig na nagmula lamang kay Ezra ang lakas sapagkat kasunod agad ang kamay ng Diyos bilang batayan.
- source_word: כְּיַד ... עָלַי
  choice: dahil ang kamay ... ay nasa akin
  rationale: Pinananatili ang metapora ng kamay ng Diyos at ipinahahayag ang kontekstuwal na sanhi ng paglakas ng loob, habang ang mas pormal na pagbasa ay inilalagay sa talababa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transliterasyon ito ng personal na pangalang banal sa tekstong Hebreo, sa halip na palitan iyon ng isang titulo.
- source_word: וָאֶקְבְּצָה
  choice: tinipon ko
  rationale: Tuwiran at natural na salaysay ng pagtitipon ni Ezra sa mga sasama sa kanya.
- source_word: רָאשִׁים
  choice: mga pinuno
  rationale: Literal na “mga ulo,” ngunit tumutukoy rito sa mga kinikilalang pangunahing tao o lider ng Israel.
- source_word: לַעֲלוֹת
  choice: umahon
  rationale: Pinananatili nito ang pananalitang Hebreo tungkol sa pag-ahon patungong Jerusalem at natural pa rin sa Filipino.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehova
  rationale: Tuwirang ginagamit ng talata ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng titulo.
- issue: Ugnayan ng lakas ng loob ni Ezra at ng kamay ng Diyos
  choice: Kaya lumakas ang loob ko, dahil ang kamay ni Yahweh na aking Diyos ay nasa akin
  alternative: Pinalakas ko ang aking sarili ayon sa kamay ni Yahweh na aking Diyos na nasa akin
  rationale: Ipinakikita ng pangunahing salin ang likas na ugnayang sanhi sa konteksto, ngunit hindi itinatago ang mas pormal at posibleng pagbasa, na nakatala sa talababa [b].
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang metapora ng “kamay” ng Diyos at ang pananalitang “umahon” patungong Jerusalem. Ginamit ang “Yahweh” para sa יְהוָה. Ang pambungad na “at” ay sadyang pinanatili sapagkat karugtong ang talata ng naunang pagpapala.
