  source_fidelity: 'Ang pangunahing diwa ay tapat sa Hebreo: ang Diyos ang nagkaloob ng ḥesed kay Ezra sa harap/sa paningin ng hari at ng mga opisyal nito; lumakas ang loob ni Ezra dahil sa kamay ni Yahweh na nasa kanya; at nagtipon siya ng mga pangunahing tao mula sa Israel upang umahon na kasama niya. Gayunman, ang “upang umahong kasama ko” ay hindi lubos na likas sa modernong Tagalog. Ang “sa paningin ng” ay mas angkop din dito kaysa “sa harap ng,” sapagkat inilalarawan nito ang pagpapakitang-pabor sa harap ng korte.'
