base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/015.yaml
  text: and to bring the silver and gold that the king and his counselors have freely offered to the God of Israel[a], whose dwelling is in Jerusalem,
translation:
  language: tl
  text: at dalhin ang pilak at ginto na kusang-loob na inihandog ng hari at ng kaniyang mga tagapayo sa Diyos ng Israel[a], na ang kaniyang tirahan ay nasa Jerusalem,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “na naninirahan sa Jerusalem.” Mas literal sa Aramaiko ang “na ang kaniyang tirahan ay nasa Jerusalem.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְהֵיבָלָה
  choice: at dalhin
  rationale: Ang Aramaikong pawatas na may pang-ugnay at pang-ukol ay nagpapahayag ng layunin sa atas ng hari. Likas sa makabagong Tagalog ang “dalhin” at hindi nito labis na tinutukoy ang paraan ng paghahatid.
- source_word: כְּסַף וּדְהַב
  choice: ang pilak at ginto
  rationale: Ginamit ang tiyak na pananda sapagkat nililinaw ng kasunod na sugnay kung aling pilak at ginto ang tinutukoy.
- source_word: דִּי
  choice: na
  rationale: Ang katagang Aramaiko ay nagpapakilala sa sugnay na naglalarawan sa pilak at ginto; “na” ang likas na katumbas sa Tagalog.
- source_word: מַלְכָּא
  choice: ang hari
  rationale: Tuwirang salin ng pangngalang Aramaiko sa emphatic state, na may tiyak na kahulugan.
- source_word: וְיָעֲטוֹהִי
  choice: at ng kaniyang mga tagapayo
  rationale: Tinutukoy ng salita ang mga tagapayo ng hari. Pinananatili ng “mga tagapayo” ang konteksto ng maharlikang hukuman.
- source_word: הִתְנַדַּבוּ
  choice: kusang-loob na inihandog
  rationale: Ipinahahayag ng pandiwa ang malaya at bukal-sa-loob na pagbibigay. Nahuhuli ng “kusang-loob na inihandog” kapwa ang pagiging boluntaryo at ang paghahandog sa Diyos.
- source_word: לֶאֱלָהּ יִשְׂרָאֵל
  choice: sa Diyos ng Israel
  rationale: Karaniwang salin ng banal na katawagan sa Ezra; ipinakikita ng “sa” na inialay sa Diyos ang handog.
- source_word: דִּי בִירוּשְׁלֶם מִשְׁכְּנֵהּ
  choice: na ang tahanan ay nasa Jerusalem
  rationale: Pinananatili nito ang pangngalang pahayag ng Aramaiko tungkol sa tahanan ng Diyos, sa halip na tahasang gawing pandiwang “naninirahan.” Hindi rin nito ipinapalagay na nakakulong ang Diyos sa isang lugar.
theological_decisions:
- issue: Ang kaugnayan ng Diyos sa Jerusalem sa מִשְׁכְּנֵהּ
  choice: na ang tahanan ay nasa Jerusalem
  alternative: na naninirahan sa Jerusalem
  rationale: Pangngalan para sa tahanan o tirahan ang gamit ng Aramaiko, hindi payak na pandiwang panaguri. Pinananatili ng salin ang diin sa templong nasa Jerusalem at ang likas na tensiyong teolohikal nang hindi ipinahihiwatig na nalilimitahan doon ang presensiya ng Diyos.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “kaniyang” upang maging pormal ngunit madaling maunawaan, at pinanatili ang daloy bilang bahagi ng mas mahabang pangungusap ng atas ng hari.
