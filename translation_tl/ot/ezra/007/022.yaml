  text: עַד כְּסַף֮ כַּכְּרִ֣ין מְאָה֒ וְ/עַד חִנְטִין֙ כֹּרִ֣ין מְאָ֔ה וְ/עַד חֲמַר֙ בַּתִּ֣ין מְאָ֔ה וְ/עַד בַּתִּ֥ין מְשַׁ֖ח מְאָ֑ה וּ/מְלַ֖ח דִּי לָ֥א כְתָֽב־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/022.yaml
  text: up to one hundred talents of silver[a], and up to one hundred cors of wheat, and up to one hundred baths of wine, and up to one hundred baths of oil, and salt without limit.
translation:
  language: tl
  text: hanggang sa isang daang talento ng pilak, hanggang sa isang daang kor ng trigo, hanggang sa isang daang bat ng alak, hanggang sa isang daang bat ng langis, at asin na walang itinakdang dami.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa mas literal na salin, “na hindi nakasulat,” ibig sabihin, walang tinukoy na dami.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַד
  choice: hanggang sa
  rationale: Sa talaang administratibong ito, ipinapahiwatig ng salita ang pinakamataas na daming maaaring ibigay; natural itong naipahahayag sa Filipino bilang “hanggang sa.”
- source_word: כְּסַף
  choice: pilak
  rationale: Tumutukoy ito sa mismong metal na sinusukat sa talento, kaya mas tiyak ang “pilak” kaysa “salapi.”
- source_word: כַּכְּרִין
  choice: talento
  rationale: Pinananatili ang sinaunang yunit ng timbang sa halip na gumamit ng hindi tiyak na makabagong katumbas.
- source_word: חִנְטִין
  choice: trigo
  rationale: Partikular na trigo ang tinutukoy, hindi lamang butil sa pangkalahatan.
- source_word: כֹּרִין
  choice: kor
  rationale: Pinananatili ang sinaunang yunit para sa tuyong sangkap nang walang mapanganib na modernong conversion.
- source_word: חֲמַר
  choice: alak
  rationale: Karaniwang salitang Filipino para sa alak na tinutukoy sa talaan; hindi na dinagdagan ng uri na hindi tahasang nasa teksto.
- source_word: בַּתִּין
  choice: bat
  rationale: Pinananatili ang sinaunang yunit para sa likido upang maging tapat sa tiyak na sukat ng teksto.
- source_word: מְשַׁח
  choice: langis
  rationale: Hindi tinukoy ng teksto na langis ng olibo, kaya hindi iyon idinagdag.
- source_word: מְלַח
  choice: asin
  rationale: Tuwirang katumbas ng kalakal na huling binanggit.
- source_word: דִּי לָא כְתָב
  choice: na walang itinakdang dami
  rationale: Ipinahahayag nito ang administratibong diwa na walang nakasulat o itinakdang dami para sa asin, habang inilalagay sa talababa ang literal na anyo.
theological_decisions: []
translation_notes:
  register: Makabago at marangal na Filipino ang ginamit. Pinanatili ang mga sinaunang yunit na “talento,” “kor,” at “bat,” pati ang paulit-ulit na estruktura ng atas. Inilagay ang talababa sa parirala tungkol sa asin, na siyang tinutukoy ng alternatibong literal na salin.
