base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/026.yaml
  text: And anyone who will not obey the law of your God and the law of the king[a], let judgment be executed on him promptly, whether for death, or for banishment, or for confiscation of goods, or for imprisonment.
translation:
  language: tl
  text: At ang sinumang hindi susunod sa kautusan ng iyong Diyos at sa kautusan ng hari ay agad na isagawa ang hatol laban sa kanya—maging kamatayan, pagpapatapon[a], pagkumpiska ng mga ari-arian, o pagkabilanggo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “pagpapaalis,” o mas literal, “pagbubunot.” Bihira ang terminong Aramaiko at maaaring tumukoy sa pagpapatapon mula sa lugar o pamayanan ng isang tao.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל דִּי
  choice: At ang sinumang
  rationale: Likas na Filipino para sa di-tiyak ngunit pamahaging pagtukoy sa bawat taong saklaw ng kondisyon.
- source_word: לָא לֶהֱוֵא עָבֵד
  choice: hindi susunod
  rationale: Bagaman literal na tumutukoy sa hindi paggawa o pagtupad, ang kaugnayan nito sa דָּתָא ay nagpapahayag ng hindi pagsunod sa kautusan.
- source_word: דָּתָא
  choice: kautusan
  rationale: Saklaw ng salitang Aramaiko ang batas, atas, o tuntuning legal; pinananatili ng 'kautusan' ang magkatulad na pahayag tungkol sa Diyos at sa hari.
- source_word: אֱלָהָךְ
  choice: iyong Diyos
  rationale: Tuwirang ikalawang panauhang isahan na paari, na tumutukoy sa Diyos ni Ezra.
- source_word: וְדָתָא דִּי מַלְכָּא
  choice: at sa kautusan ng hari
  rationale: Pinananatili ang koordinasyon at pagkakapantay ng gramatikal na anyo sa 'kautusan ng iyong Diyos.'
- source_word: אָסְפַּרְנָא
  choice: agad
  rationale: Ipinahahayag ang mabilis o maagap na pagpapatupad sa kontekstong panghukuman.
- source_word: דִּינָה לֶהֱוֵא מִתְעֲבֵד מִנֵּהּ
  choice: siyang hatulan
  rationale: Natural at malinaw sa Filipino bilang utos na ipataw at isagawa ang hatol laban sa lumabag.
- source_word: הֵן ... הֵן ... הֵן ... וְ
  choice: —… man, …, …, o …
  rationale: Natural na anyong Filipino para sa talaan ng mga alternatibong parusa.
- source_word: לְמוֹת
  choice: kamatayan
  rationale: Tuwirang pangalan ng parusang kamatayan nang hindi dinaragdagan ang antas ng interpretasyon.
- source_word: לשרשו
  choice: pagpapatapon
  rationale: Ang bihirang terminong Aramaiko ay literal na nauugnay sa pagbunot at malamang na tumutukoy sa pagpapaalis sa lugar o pamayanan; inilalagay sa talababa ang tunay na kawalang-katiyakan.
- source_word: לַעֲנָשׁ נִכְסִין
  choice: pagkumpiska ng mga ari-arian
  rationale: Malinaw na legal na pagpapahayag ng parusang may kinalaman sa pagkawala ng mga pag-aari.
- source_word: וְלֶאֱסוּרִין
  choice: pagkabilanggo
  rationale: Sa talaan ng mga parusang legal, ito ang natural na kahulugan ng pagkagapos o pagkakulong.
theological_decisions:
- issue: Ugnayan ng kautusan ng Diyos at kautusan ng hari sa atas
  choice: 'Ihayag ang dalawa nang tuwiran at magkaugnay: ''sa kautusan ng iyong Diyos at sa kautusan ng hari.'''
  alternative: Gawing nakapailalim ang isa sa isa, o ipakahulugang ang kautusan ng hari ay pagpapatupad lamang ng kautusan ng Diyos.
  rationale: Magkatabing inilalahad ng talata ang dalawang awtoridad na legal sa loob ng atas ng Persia. Hindi nilulutas ng salin ang teolohikal na tensiyong hindi tahasang nilulutas ng teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino na angkop sa tekstong legal. Ginamit ang mas natural na 'siyang hatulan' sa halip na isang mabigat na literal na pasibong anyo, habang pinanatili ang agarang pagpapatupad at ang apat na posibleng parusa.
