id: EZR.7.10
reference: Ezra 7:10
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: כִּ֤י עֶזְרָא֙ הֵכִ֣ין לְבָב֔/וֹ לִ/דְר֛וֹשׁ אֶת תּוֹרַ֥ת יְהוָ֖ה וְ/לַ/עֲשֹׂ֑ת וּ/לְ/לַמֵּ֥ד בְּ/יִשְׂרָאֵ֖ל חֹ֥ק וּ/מִשְׁפָּֽט־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/010.yaml
  text: For Ezra had set his heart to seek the Law of Yahweh[a], and to do it[d][c][b], and to teach statutes and judgments in Israel.
translation:
  language: tl
  text: Sapagkat buong-pusong nagpasiya si Ezra[a] na saliksikin[b] ang Kautusan ni Yahweh[c], isagawa ito, at ituro sa Israel ang mga tuntunin at mga pasiya[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “inihanda/itinatag niya ang kanyang puso.” Ipinahahayag ng Hebreong idyoma ang sinadya at matatag na panloob na pagpapasiya.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “hanapin,” “siyasatin,” o “pag-aralan.”
    reason: lexical_alternative
  - marker: c
    text: Ang “Yahweh” ay kumakatawan sa banal na pangalang Hebreo na YHWH.
    reason: alternative_reading
  - marker: d
    text: Maaari ring “tuntunin at kahatulan,” “mga batas at mga pasiya,” o “mga tuntunin at mga alituntunin.” Pang-isahan sa Hebreo ang dalawang salita ngunit maaaring gamitin sa kolektibong diwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikita ang paliwanag o dahilan para sa pabor at tagumpay ni Ezra na binanggit sa naunang konteksto.
- source_word: הֵכִין לְבָבוֹ
  choice: buong-pusong nagpasiya
  rationale: Natural na ipinahahayag sa modernong Tagalog ang Hebreong idyoma ng sinadya at matatag na panloob na pagpapasiya, habang pinananatili ang larawan ng puso.
- source_word: לִדְרוֹשׁ
  choice: saliksikin
  rationale: Saklaw nito ang maingat na paghahanap, pagsisiyasat, at pag-aaral; hindi nito nililimitahan ang salita sa akademikong pag-aaral lamang.
- source_word: תּוֹרַת יְהוָה
  choice: ang Kautusan ni Yahweh
  rationale: Sa kontekstong pari at eskriba ni Ezra, tumutukoy ang תּוֹרָה sa tipanang Kautusan, hindi lamang sa pangkalahatang pagtuturo.
- source_word: וְלַעֲשֹׂת
  choice: isagawa ito
  rationale: Ang di-binanggit ngunit malinaw na layon ay ang Kautusan. Pinananatili ng 'isagawa' ang tuwirang diwa ng paggawa nang hindi tahasang pinapalitan ng interpretatibong 'sundin.'
- source_word: וּלְלַמֵּד
  choice: at ituro
  rationale: Tuwirang katumbas ng Piel na anyo ng למד at natural sa sunod-sunod na layunin ni Ezra.
- source_word: בְּיִשְׂרָאֵל
  choice: sa Israel
  rationale: Ipinahahayag ang saklaw o pamayanang pinagtuturuan ni Ezra.
- source_word: חֹק וּמִשְׁפָּט
  choice: mga tuntunin at mga pasiya
  rationale: Tinatrato ang mga pang-isahang pangngalan bilang kolektibo, gaya ng gamit sa konteksto. Pinananatili ng 'pasiya' ang legal at hudisyal na kulay ng מִשְׁפָּט.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Tuwirang pangalan ang nasa tekstong Hebreo; pinananatili ng 'Yahweh' ang pagkakakilanlan nito bilang tipanang pangalan nang hindi ito pinapalitan ng titulo.
- issue: Saklaw ng תּוֹרָה sa gawain ni Ezra
  choice: Kautusan
  alternative: tagubilin; Torah
  rationale: Sa kontekstong pagkatapos ng pagkakatapon at sa tungkulin ni Ezra bilang pari at eskriba, pangunahing tumutukoy ito sa tipanang Kautusan, bagaman taglay pa rin ng salitang Hebreo ang mas malawak na diwa ng pagtuturo.
- issue: Ugnayan ng pag-aaral, pagsasagawa, at pagtuturo
  choice: Pinanatili bilang tatlong magkakaugnay ngunit magkakahiwalay na layunin
  alternative: Pagsamahin bilang pangkalahatang pagsunod o ministeryo
  rationale: Inililista ng Hebreo ang saliksikin, gawin, at ituro; pinananatili ng salin ang pagkakasunod at tensiyon ng kaalaman, pagsasagawa, at pagtuturo nang walang idinadagdag na doktrinal na hirarkiya.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Ginamit ang “buong-pusong nagpasiya” upang maiwasan ang matigas na literalismong “inihanda ang puso,” at inilagay sa talababa ang literal na idyoma. Pinanatili ang pangalan na “Yahweh,” ang kinikilalang terminong “Kautusan,” at ang tatluhang ayos na saliksikin–isagawa–ituro.
