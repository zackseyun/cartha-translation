  source_fidelity: Tumpak na naipapahayag ng salin ang karagdagang hindi tinukoy na pangangailangan, ang “bahay ng iyong Diyos,” ang obligasyong nakaatang kay Ezra na maglaan, at ang utos na kunin ang panustos mula sa kabang-yaman ng hari. Ang “tustusan” ay angkop sa kontekstong administratibo at pinansiyal, nang hindi nililimitahan ang חַשְׁחוּת sa isang tiyak na uri ng gastusin.
