base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/020.yaml
  text: And whatever other need of the house of your God falls to you to provide[a], you shall provide it from the house of the king’s treasuries.
translation:
  language: tl
  text: At anumang iba pang pangangailangan ng bahay ng iyong Diyos na kailangan mong tustusan, tustusan mo mula sa kabang-yaman ng hari.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “mula sa bahay ng mga kabang-yaman ng hari.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁאָר חַשְׁחוּת
  choice: At anumang iba pang pangangailangan
  rationale: Ipinahihiwatig ng parirala ang karagdagang pangangailangang hindi pa natutukoy; natural ito sa makabagong Tagalog at hindi nililimitahan sa gastos lamang.
- source_word: בֵּית אֱלָהָךְ
  choice: bahay ng iyong Diyos
  rationale: Pinananatili ang kongkretong idyomang Aramaiko para sa templo nang hindi tahasang pinapalitan ng salitang “templo.”
- source_word: יִפֶּל לָךְ לְמִנְתַּן
  choice: na kailangan mong tustusan
  rationale: Ang literal na ideyang “mahulog sa iyo upang ibigay” ay tumutukoy sa pananagutan o obligasyong maglaan; malinaw at likas sa kontekstong pinansiyal ang “kailangan mong tustusan.”
- source_word: תִּנְתֵּן
  choice: tustusan mo
  rationale: Inilalahad ang direktibang puwersa ng pandiwa at pinananatili ang pag-uulit ng ideya ng paglalaan.
- source_word: מִן בֵּית גִּנְזֵי מַלְכָּא
  choice: mula sa kabang-yaman ng hari
  rationale: Ito ang natural na katumbas sa Tagalog ng royal treasury complex; inilalagay sa talababa ang higit na literal na anyo.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “tustusan” dahil administratibo at materyal ang konteksto, ngunit pinanatili ang “bahay ng iyong Diyos” upang maingatan ang idyoma ng pinagmulan.
