  to: Kaya, gamitin mo nang buong ingat ang pilak na ito sa pagbili ng mga toro, mga lalaking tupa, at mga kordero, pati ng mga handog na butil at mga handog na inumin para sa mga iyon. Ihandog mo ang mga iyon sa altar ng bahay ng inyong Diyos na nasa Jerusalem.
