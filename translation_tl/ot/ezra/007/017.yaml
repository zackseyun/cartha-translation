base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/017.yaml
  text: Therefore you shall diligently buy with this silver bulls[a], rams, lambs, along with their grain offerings and their drink offerings[c][b], and you shall offer them on the altar of the house of your God that is in Jerusalem.
translation:
  language: tl
  text: Kaya, gamitin mo nang buong ingat ang pilak na ito sa pagbili ng mga toro, mga lalaking tupa, at mga kordero, pati ng mga handog na butil at mga handog na inumin para sa mga iyon. Ihandog mo ang mga iyon sa altar ng bahay ng inyong Diyos na nasa Jerusalem.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּל קֳבֵל דְּנָה
  choice: Kaya
  rationale: Likas at maikli itong katumbas ng Aramaikong idyomang naghahayag ng bunga o pasiya batay sa naunang sinabi.
- source_word: אָסְפַּרְנָא
  choice: nang buong ingat
  rationale: Ipinahahayag ng pang-abay ang maingat at eksaktong pagsasagawa; natural ito sa modernong Tagalog nang hindi nagdaragdag ng diwa ng pagmamadali.
- source_word: תִקְנֵא
  choice: sa pagbili
  rationale: Tuwirang ipinapahayag ang kahulugang bumili, habang ang pariralang 'gamitin ... sa pagbili' ay malinaw na inuugnay ang pilak sa transaksiyon.
- source_word: בְּכַסְפָּא דְנָה
  choice: ang pilak na ito
  rationale: Pinananatili ang literal na 'pilak,' na sa kontekstong administratibo ay nagsisilbing salapi o pondong pambayad.
- source_word: תּוֹרִין
  choice: mga toro
  rationale: Angkop na katawagan sa mga lalaking baka sa konteksto ng paghahandog.
- source_word: דִּכְרִין
  choice: mga lalaking tupa
  rationale: Mas madaling maunawaan ng karaniwang mambabasa kaysa 'mga barakong tupa' at tiyak na ipinapakita ang kasarian.
- source_word: אִמְּרִין
  choice: mga kordero
  rationale: Karaniwan at marangal na terminong Filipino para sa mga batang tupa sa konteksto ng paghahandog.
- source_word: מִנְחָתְהוֹן
  choice: mga handog na pagkaing butil para sa mga iyon
  rationale: Tinutukoy ang mga handog na butil na kasama ng mga hayop; nililinaw ng 'para sa mga iyon' ang hulaping panghalip na tumutukoy sa naunang mga hayop.
- source_word: נִסְכֵּיהוֹן
  choice: mga handog na inumin para sa mga iyon
  rationale: Malinaw at madaling maunawaang katumbas ng ritwal na likidong handog, habang pinananatili ang kaugnayan nito sa mga hayop.
- source_word: וּתְקָרֵב הִמּוֹ
  choice: Ihandog mo ang mga iyon
  rationale: Sa konteksto ng altar, ang pandiwa ay tumutukoy sa ritwal na paglapit o paghahandog; 'ihandog' ang pinakanatural na salin.
- source_word: עַל מַדְבְּחָה
  choice: sa altar
  rationale: Natural na pariralang Tagalog para sa lugar ng pagsasagawa ng handog.
- source_word: בֵּית אֱלָהֲכֹם
  choice: bahay ng inyong Diyos
  rationale: Pinananatili ang literal at biblikal na larawang 'bahay' sa halip na tahasang gawing 'templo'; ang maramihang 'inyong' ay kumakatawan sa Aramaikong panghalip na plural.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Pinanatili ang 'pilak' at 'bahay ng inyong Diyos' upang manatiling malapit sa Aramaiko, ngunit inayos ang sintaks upang maging natural sa Tagalog. Ginamit ang 'inyong' dahil plural ang hulaping panghalip sa אֱלָהֲכֹם.
