id: EZR.7.12
reference: Ezra 7:12
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: אַ֨רְתַּחְשַׁ֔סְתְּא מֶ֖לֶךְ מַלְכַיָּ֑/א לְ/עֶזְרָ֣א כָ֠הֲנָ/א סָפַ֨ר דָּתָ֜/א דִּֽי אֱלָ֧הּ שְׁמַיָּ֛/א גְּמִ֖יר וּ/כְעֶֽנֶת־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/012.yaml
  text: 'Artaxerxes[a], king of kings, to Ezra the priest, the scribe of the law of the God of heaven: complete peace[b]. And now—'
translation:
  language: tl
  text: 'Si Artajerjes, hari ng mga hari, kay Ezra na pari at tagapagsulat ng batas[a] ng Diyos ng langit: Lubos na kapayapaan[b]. At ngayon—'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “tagapagsulat ng kautusan ng Diyos ng langit” o “tagapagsulat ng dekreto ng Diyos ng langit.” Maaaring mangahulugan ang salitang Arameo ng batas, kautusan, o dekreto.
    reason: lexical_alternative
  - marker: b
    text: Pormularyong pagbati ito sa Arameo. Maaari ring isaling “ganap na kapayapaan” o, sa mas malayang pananalita, “mga pagbati.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַ֨רְתַּחְשַׁ֔סְתְּא
  choice: Artajerjes
  rationale: Ginamit ang nakaugaliang anyong Filipino ng pangalan ng hari sa halip na panatilihin ang baybay-Ingles.
- source_word: מֶ֖לֶךְ מַלְכַיָּא
  choice: hari ng mga hari
  rationale: Tuwirang isinasalin ang titulong maharlika at natural itong pakinggan sa Filipino.
- source_word: לְעֶזְרָא
  choice: kay Ezra
  rationale: Ang lamed ay tumutukoy sa pinadalhan ng liham; ang “kay” ang likas na pananda sa Filipino para sa pangalang pantangi.
- source_word: כָהֲנָא
  choice: pari
  rationale: Karaniwan at malinaw na katumbas ng tungkuling panrelihiyon; inuunawa itong appositive na paglalarawan kay Ezra.
- source_word: סָפַר דָּתָא
  choice: tagapagsulat ng batas
  rationale: Pinananatili ng “tagapagsulat” ang pangunahing diwa ng סָפַר, habang ang “batas” ang pinakaangkop dito sa banal na kautusang pinag-aaralan at pinaglilingkuran ni Ezra. Nasa talababa ang posibleng administratibong kahulugang “kautusan” o “dekreto.”
- source_word: דִּי אֱלָהּ שְׁמַיָּא
  choice: ng Diyos ng langit
  rationale: Tuwirang pinananatili ang kilalang titulong biblikal at ang ugnayang genitibo.
- source_word: גְּמִיר
  choice: lubos
  rationale: Ang “lubos” ay natural na Filipino para sa diwang ganap, buo, o lubos sa pormularyong pagbati.
- source_word: וּכְעֶנֶת
  choice: At ngayon—
  rationale: Ito ang pormularyong paglipat mula sa pagbati tungo sa nilalaman ng utos; ipinahihiwatig ng gitling na nagpapatuloy ang pangungusap sa susunod na talata.
theological_decisions:
- issue: Kahulugan ng דָּתָא sa paglalarawan kay Ezra
  choice: batas
  alternative: dekreto o kautusan
  rationale: Bagaman maaaring tumukoy ang salita sa isang opisyal na dekreto, mas angkop sa papel ni Ezra at sa pariralang “ng Diyos ng langit” ang banal na batas. Hindi lubusang inaalis ang administratibong posibilidad kaya inilalahad ito sa talababa.
- issue: Paglalahad sa pormularyong גְּמִיר וּכְעֶנֶת
  choice: Lubos na kapayapaan. At ngayon—
  alternative: Ganap na kapayapaan; at ngayon— / Mga pagbati. At ngayon—
  rationale: Pinananatili nito kapwa ang literal na diwa ng kapayapaan at ang paglipat sa katawan ng liham, sa halip na gawing mas malayang “mga pagbati” lamang.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang anyo ng pamagat ng liham at ang bahagyang putol na paglipat sa susunod na talata. Ginamit ang “tagapagsulat” sa halip na mas teknikal na “eskriba,” at inilagay ang [a] sa salitang “batas,” na siyang aktuwal na tinutukoy ng talababa.
