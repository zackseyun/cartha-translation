base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/019.yaml
  text: And the vessels that are given to you for the service of the house of your God[b][a], deliver in full before the God of Jerusalem.
translation:
  language: tl
  text: At ang mga kagamitang ibinibigay sa iyo para sa paglilingkod sa bahay ng iyong Diyos[a], ibigay mo nang buo[b] sa harap ng Diyos ng Jerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “para sa pagsamba sa bahay ng iyong Diyos.”
    reason: lexical_alternative
  - marker: b
    text: O “iharap mo nang buo sa harap ng Diyos ng Jerusalem.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמָאנַיָּא
  choice: ang mga kagamitan
  rationale: Sa konteksto ng templo, tumutukoy ang salitang Aramaiko sa mga sisidlan o kasangkapang ginagamit doon. Mas natural at malawak sa makabagong Filipino ang “mga kagamitan.”
- source_word: דִּי
  choice: na
  rationale: Likas na pang-ugnay sa Filipino para ipakilala ang sugnay na naglalarawan sa mga kagamitan.
- source_word: מִתְיַהֲבִין לָךְ
  choice: ibinibigay sa iyo
  rationale: Pinananatili ang pasibong diwa ng participle at ang kasalukuyan o nagpapatuloy na aspekto nang hindi ipinagpapalagay na tapos na ang pagbibigay.
- source_word: לְפָלְחָן
  choice: para sa paglilingkod
  rationale: Saklaw nito ang paglilingkod na kaugnay ng templo nang hindi nililimitahan ang kahulugan sa pagsamba lamang.
- source_word: בֵּית אֱלָהָךְ
  choice: sa bahay ng iyong Diyos
  rationale: Ang “bahay” ay tuwirang tumutugma sa בית at malinaw sa konteksto bilang templo; ang pariralang Filipino ay natural at pinananatili ang kaugnayan nito sa Diyos ni Ezra.
- source_word: הַשְׁלֵם
  choice: ibigay mo nang buo
  rationale: Ipinahihiwatig ng pandiwa ang ganap na paghahatid o pagsasalin ng lahat ng kagamitan. Ang “ibigay mo nang buo” ay natural at hindi nagpapahiwatig ng pagbabayad.
- source_word: קֳדָם
  choice: sa harap ng
  rationale: Tuwirang inilalarawan ang pagiging nasa harapan o presensya ng Diyos.
- source_word: אֱלָהּ יְרוּשְׁלֶם
  choice: Diyos ng Jerusalem
  rationale: Pinananatili ang tuwirang anyo at ang administratibong paraan ng pagkakaugnay ng Diyos sa Jerusalem.
theological_decisions:
- issue: Terminong kaugnay ng gawain sa templo
  choice: paglilingkod sa bahay ng iyong Diyos
  alternative: pagsamba sa bahay ng iyong Diyos
  rationale: Maaaring tumukoy ang Aramaikong פָלְחָן sa kultikong paglilingkod o pagsamba. Mas malawak ang “paglilingkod” at hindi nito sinasadyang paliitin ang kahulugan.
- issue: Pagkakakilanlan ng Diyos kaugnay ng Jerusalem
  choice: Diyos ng Jerusalem
  alternative: Diyos na nasa Jerusalem
  rationale: Pinananatili ng pangunahing salin ang maikli at tunay na malabong ugnayan ng pariralang Aramaiko; inilalagay sa talababa ang posibleng lokatibong pagbasa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mga kagamitan” sa halip na mas teknikal na “mga sisidlan,” at pinanatili ang “bahay ng iyong Diyos” upang maging malapit sa anyo ng Aramaiko habang malinaw na tumutukoy sa templo.
