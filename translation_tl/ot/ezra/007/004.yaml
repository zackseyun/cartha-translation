lexical_decisions:
- source_word: בֶּן
  choice: na anak ni
  rationale: Sa talaangkanan, ang בֶּן ay likas na isinasaling “anak ni.” Pinananatili nito ang anyo ng sunod-sunod na angkan sa Hebreo, kahit maaaring may nilalaktawang salinlahi ang ilang talaangkanan.
- source_word: זְרַחְיָה
  choice: Zeraias
  rationale: Ginamit ang nakasanayang anyong Filipino ng pangalang biblikal na Zerahiah.
- source_word: עֻזִּי
  choice: Uzi
  rationale: Tuwirang transliterasyon sa makabagong ortograpiyang Filipino; hindi karaniwang ipinakikita sa Filipino ang dobleng katinig ng Hebreo.
- source_word: בֻּקִּי
  choice: Buki
  rationale: Tuwirang transliterasyon sa makabagong ortograpiyang Filipino; ang dobleng katinig sa Hebreo ay hindi kailangang panatilihin sa baybay-Filipino.
