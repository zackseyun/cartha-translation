base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/007.yaml
  text: And some of the sons of Israel[a], and some of the priests, and the Levites, and the singers, and the gatekeepers[b], and the temple servants went up to Jerusalem in the seventh year of King Artaxerxes.
translation:
  language: tl
  text: Umakyat patungong Jerusalem ang ilang Israelita[a], ilang pari, mga Levita, mga mang-aawit, mga tagapagbantay ng pintuan, at mga lingkod sa templo[b] noong ikapitong taon ni Haring Artaxerxes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “mula sa mga anak ni Israel.” Ipinahihiwatig ng Hebreo na ilan lamang sa pangkat ang umakyat.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “mga Nethinim,” isang natatanging pangkat ng mga lingkod sa templo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: Umakyat patungo
  rationale: Pinananatili ng “umakyat” ang heograpikal at panrelihiyong pahiwatig ng paglalakbay patungong Jerusalem; nililinaw ng “patungo” ang direksiyon.
- source_word: מִבְּנֵי יִשְׂרָאֵל
  choice: ang ilan sa mga Israelita
  rationale: Ipinahahayag ng “ilan sa” ang partitive na diwa ng מִן, samantalang natural at malinaw sa modernong Filipino ang “mga Israelita.”
- source_word: הַכֹּהֲנִים
  choice: mga pari
  rationale: Karaniwang katawagan sa Filipino para sa mga pari sa kontekstong pangtemplo.
- source_word: הַלְוִיִּם
  choice: mga Levita
  rationale: Pamantayang katawagan para sa pangkat na nagmula kay Levi at naglilingkod kaugnay ng templo.
- source_word: הַמְשֹׁרְרִים
  choice: mga mang-aawit
  rationale: Tiyak nitong inilalarawan ang mga umaawit sa paglilingkod sa templo, sa halip na ang mas malawak na “mga musikero.”
- source_word: הַשֹּׁעֲרִים
  choice: mga bantay ng pintuan
  rationale: Malinaw na inilalarawan ang mga tauhang nangangasiwa at nagbabantay sa mga pintuan ng templo.
- source_word: הַנְּתִינִים
  choice: mga lingkod sa templo
  rationale: Isinasalin ang tungkulin ng natatanging pangkat sa paraang mauunawaan ng karaniwang mambabasa; inilalagay sa talababa ang teknikal na katawagang Nethinim.
- source_word: אֶל יְרוּשָׁלִָם
  choice: patungong Jerusalem
  rationale: Natural na pagpapahayag sa Filipino ng direksiyon ng paglalakbay.
- source_word: בִּשְׁנַת שֶׁבַע
  choice: noong ikapitong taon ng paghahari
  rationale: Ang idinagdag na “ng paghahari” ay likas sa Filipino at nililinaw na ang taon ay binibilang ayon sa paghahari ng hari.
- source_word: לְאַרְתַּחְשַׁסְתְּא הַמֶּלֶךְ
  choice: ni Haring Artaxerxes
  rationale: Natural na ayos sa modernong Filipino habang pinananatili ang titulong maharlika.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang tuwirang “umakyat” upang mapanatili ang pahiwatig ng tekstong Hebreo, ngunit pinasimple ang sunod-sunod na pangatnig ayon sa natural na daloy ng Filipino. Ang “ilan sa” sa simula ng talaan ay nauunawaang sumasaklaw sa mga nakalistang pangkat.
