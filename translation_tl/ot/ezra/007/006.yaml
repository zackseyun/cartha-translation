base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/006.yaml
  text: This Ezra went up from Babylon[a], and he was a skilled scribe in the Law of Moses, which Yahweh, the God of Israel, had given. And the king granted him all his request, according to the hand of Yahweh his God upon him.
translation:
  language: tl
  text: Ang Ezra na ito ay umakyat mula sa Babilonia. Siya ay isang bihasang eskriba sa Kautusan ni Moises, na ibinigay ni Yahweh, ang Diyos ng Israel. Ipinagkaloob sa kanya ng hari ang lahat ng kanyang kahilingan, ayon sa kamay ni Yahweh na kanyang Diyos na nakapatong sa kanya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “kamay ni Yahweh na kanyang Diyos na nakapatong sa kanya” ay isang idyoma na maaaring tumukoy sa pabor, kapangyarihan, o mapagkalingang pagtulong ni Yahweh.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלָה מִבָּבֶל
  choice: umahon mula sa Babilonia
  rationale: Pinananatili ng “umahon” ang karaniwang Hebreong paglalarawan sa paglalakbay patungo sa Jerusalem at hindi ito pinapantay lamang sa “umalis” o “nagmula.”
- source_word: סֹפֵר מָהִיר
  choice: bihasang eskriba
  rationale: Ang “eskriba” ay nagpapanatili sa papel ni Ezra bilang tagapag-ingat at dalubhasa sa mga kasulatan, samantalang ang “bihasa” ay likas na nagsasaad ng kahusayan sa kontekstong ito.
- source_word: בְּתוֹרַת מֹשֶׁה
  choice: sa Kautusan ni Moises
  rationale: Sa kontekstong legal at tipan ng Ezra, “Kautusan” ang malinaw at angkop na salin ng תּוֹרָה para sa pangkalahatang mambabasa.
- source_word: אֲשֶׁר נָתַן יְהוָה אֱלֹהֵי יִשְׂרָאֵל
  choice: na ibinigay ni Yahweh, ang Diyos ng Israel
  rationale: Malinaw na iniuugnay ng sugnay ang Kautusan kay Yahweh bilang tagapagbigay nito; pinananatili rin ang personal na banal na pangalan.
- source_word: וַיִּתֶּן לוֹ הַמֶּלֶךְ
  choice: Ipinagkaloob sa kanya ng hari
  rationale: Ang “ipinagkaloob” ay natural na Filipino para sa pagbibigay o pagpayag sa isang kahilingan.
- source_word: כֹּל בַּקָּשָׁתוֹ
  choice: ang lahat ng kanyang kahilingan
  rationale: Ipinapahayag nito na buong ipinagkaloob ang hiniling ni Ezra habang pinananatili ang marangal na himig ng teksto.
- source_word: כְּיַד יְהוָה אֱלֹהָיו עָלָיו
  choice: ayon sa kamay ni Yahweh na kanyang Diyos na nasa kanya
  rationale: Pinananatili ang kongkretong talinghaga ng “kamay” at ang כְּ na “ayon sa,” sa halip na paliitin ang posibleng diwa nito sa pabor, kapangyarihan, o patnubay lamang.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin ang Tetragrammaton bilang personal na pangalang “Yahweh,” hindi bilang isang pamagat.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang ginagamit ng Hebreo ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalan ng Diyos ng Israel.
- issue: Pagpapakahulugan sa idyomang “kamay ni Yahweh ... na nasa kanya”
  choice: Panatilihin sa pangunahing teksto ang talinghaga ng kamay
  alternative: dahil kinalugdan siya ni Yahweh; dahil tinulungan siya ng kapangyarihan ni Yahweh
  rationale: Maaaring saklawin ng idyoma ang pabor, kapangyarihan, at mapagkalingang pagkilos ng Diyos. Ang pagpapanatili sa larawan ng kamay ay hindi tahimik na nagpapasya sa iisang kahulugan.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “eskriba” at “Kautusan” bilang malinaw na mga terminong angkop sa kontekstong biblikal. Sadyang pinanatili ang bahagyang di-karaniwang larawan ng kamay dahil mahalaga ang talinghaga at hindi tiyak sa teksto kung pabor, kapangyarihan, o providensiyal na tulong ang pangunahing diin.
