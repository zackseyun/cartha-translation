base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/009.yaml
  text: For on the first day of the first month he began the journey up from Babylon, and on the first day of the fifth month he came to Jerusalem, according to the good hand of his God upon him.
translation:
  language: tl
  text: Sapagkat noong unang araw ng unang buwan ay nagsimula siyang maglakbay paahon mula sa Babilonia, at noong unang araw ng ikalimang buwan ay dumating siya sa Jerusalem, ayon sa mabuting kamay ng kanyang Diyos na nasa kanya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְסֻד הַמַּעֲלָה
  choice: sinimulan niya ang paglalakbay paahon
  rationale: Ang יְסֻד ay literal na nauugnay sa pagtatatag o paglalagay ng pundasyon, ngunit sa kontekstong ito ay idyomatikong tumutukoy sa pagsisimula ng pag-ahon o paglalakbay mula sa Babilonia. Pinananatili ng “paahon” ang karaniwang biblikal na paglalarawan sa pagpunta sa Jerusalem.
- source_word: כְּיַד אֱלֹהָיו הַטּוֹבָה עָלָיו
  choice: sapagkat ang mabuting kamay ng kanyang Diyos ay nasa kanya
  rationale: Pinananatili ang Hebreong metapora ng “kamay” bilang larawan ng mapagpalang paggabay at kapangyarihan ng Diyos. Sa konteksto, ang כְּ ay nagpapahayag ng batayan o dahilan ng matagumpay na pagdating, kaya natural ang “sapagkat.”
theological_decisions:
- issue: Ang kaugnayan ng mabuting kamay ng Diyos sa matagumpay na paglalakbay ni Ezra
  choice: sapagkat ang mabuting kamay ng kanyang Diyos ay nasa kanya
  alternative: ayon sa mabuting kamay ng kanyang Diyos na nasa kanya
  rationale: Ang “sapagkat” ay malinaw na naghahayag ng sanhi nang hindi dinaragdagan ang teksto ng tiyak na doktrinal na paliwanag; nananatili rin ang metapora at personal na katawagang “kanyang Diyos.”
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Babilonia” at “Jerusalem” bilang pamilyar na anyo ng mga pangalang pantangi, at pinanatili ang paulit-ulit na pagtukoy sa eksaktong mga araw at buwan.
