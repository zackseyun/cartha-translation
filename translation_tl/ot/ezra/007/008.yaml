  text: And he came to Jerusalem in the fifth month[a], which was the seventh year of the king.
translation:
  language: tl
  text: At dumating siya sa Jerusalem noong ikalimang buwan[a], sa ikapitong taon ng hari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “At dumating siya sa Jerusalem noong ikalimang buwan; iyon ang ikapitong taon ng hari.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: At dumating siya
  rationale: Ang waw-consecutive ay nagpapatuloy sa salaysay, kaya pinanatili ang “At.” Ang “dumating” ang likas na salin ng בוא sa konteksto ng paglalakbay at hindi nagdaragdag ng diwa na wala sa teksto.
- source_word: יְרוּשָׁלִַם
  choice: Jerusalem
  rationale: Ginamit ang karaniwang anyo ng pangalan ng lungsod sa makabagong Filipino.
- source_word: בַּחֹדֶשׁ הַחֲמִישִׁי
  choice: noong ikalimang buwan
  rationale: Temporal ang gamit ng ב; malinaw at natural sa Filipino ang “noong ikalimang buwan” para sa takdang panahon sa kalendaryo.
- source_word: הִיא
  choice: nang
  rationale: Ikinabit sa natural na Filipino ang pahayag tungkol sa buwan at ang pagtatakda ng taon. Hindi pinilit ang hiwalay na panghalip na “iyon,” ngunit kinikilala sa talababa ang maaaring mas hiwalay na pagbasa ng sugnay.
- source_word: שְׁנַת הַשְּׁבִיעִית
  choice: ikapitong taon
  rationale: Tuwirang ipinapahayag ng pariralang construct at ordinal ang taon ng paghahari.
- source_word: לַמֶּלֶךְ
  choice: ng hari
  rationale: Ang ל ay nagpapahayag dito ng kaugnayan sa pagbilang ng taon ng paghahari. Hindi idinagdag ang pangalang Artaxerxes dahil “hari” lamang ang nasa talata.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang panghalip na “siya” at ang pangkalahatang “hari” ayon sa Hebreo, nang hindi ipinapasok ang pangalan mula sa konteksto. Ginamit ang natural na ayos ng panahong parirala sa Filipino habang inilalagay sa talababa ang mas hiwalay na pagbasa ng הִיא.
