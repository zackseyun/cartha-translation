id: EZR.7.16
reference: Ezra 7:16
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/כֹל֙ כְּסַ֣ף וּ/דְהַ֔ב דִּ֣י תְהַשְׁכַּ֔ח בְּ/כֹ֖ל מְדִינַ֣ת בָּבֶ֑ל עִם֩ הִתְנַדָּב֨וּת עַמָּ֤/א וְ/כָֽהֲנַיָּ/א֙ מִֽתְנַדְּבִ֔ין לְ/בֵ֥ית אֱלָהֲ/הֹ֖ם דִּ֥י בִ/ירוּשְׁלֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/016.yaml
  text: and all the silver and gold that you find in all the province of Babylon[a], together with the freewill offering of the people and the priests[b], who are freely offering for the house of their God that is in Jerusalem.
translation:
  language: tl
  text: at ang lahat ng pilak at ginto na makukuha mo sa buong lalawigan ng Babilonia, kasama ang kusang-loob na handog[a] ng mga tao at mga pari, na kusang-loob nilang inihahandog para sa bahay ng kanilang Diyos[b] na nasa Jerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “boluntaryong handog.” Ang salitang Aramaiko ay tumutukoy sa kaloob na kusang ibinigay, lalo na kaugnay ng templo.
    reason: lexical_alternative
  - marker: b
    text: Ang “bahay ng kanilang Diyos” ay tumutukoy sa templo sa Jerusalem.
    reason: cultural_note
lexical_decisions:
- source_word: וְכֹל
  choice: at ang lahat ng
  rationale: Ikinakabit nito ang talata sa naunang pahayag at pinananatili ang malawak na saklaw ng כֹל.
- source_word: כְּסַף וּדְהַב
  choice: pilak at ginto
  rationale: Karaniwan at likas na salin ng magkatambal na katawagan sa mahahalagang metal.
- source_word: דִּי תְהַשְׁכַּח
  choice: na makukuha mo
  rationale: Tuwirang tumutukoy kay Ezra at likas sa Filipino para sa pondong mahahanap o malilikom niya; hindi nito ipinahihiwatig na basta lamang nakapulot siya ng mga metal.
- source_word: בְּכֹל מְדִינַת בָּבֶל
  choice: sa buong lalawigan ng Babilonia
  rationale: Ang מְדִינָה ay tumutukoy rito sa isang administratibong lalawigan sa konteksto ng imperyo.
- source_word: עִם
  choice: kasama ang
  rationale: Malinaw na idinaragdag nito ang isa pang pinagmumulan ng pondo.
- source_word: הִתְנַדָּבוּת
  choice: kusang-loob na handog
  rationale: Ipinahahayag nito ang isang handog na kusang ibinigay at pinananatili ang kaugnayan nito sa pagsamba.
- source_word: עַמָּא וְכָהֲנַיָּא
  choice: ng mga tao at mga pari
  rationale: Likas na Filipino para sa dalawang pangkat na nagbibigay ng handog.
- source_word: מִתְנַדְּבִין
  choice: na kusang-loob nilang inihahandog
  rationale: Pinananatili ang participial na kilos at ang pag-uugnay nito sa naunang pangngalang mula sa parehong ugat.
- source_word: לְבֵית אֱלָהֲהֹם
  choice: para sa bahay ng kanilang Diyos
  rationale: Pinananatili ang literal na idyomang 'bahay ng kanilang Diyos,' habang ang 'para sa' ay malinaw na nagsasaad ng layon ng handog.
- source_word: דִּי בִירוּשְׁלֶם
  choice: na nasa Jerusalem
  rationale: Likas at maikling panuring na tumutukoy sa kinaroroonan ng bahay ng Diyos.
theological_decisions:
- issue: Kahulugan ng “bahay ng kanilang Diyos”
  choice: Pinanatili sa pangunahing teksto ang “bahay ng kanilang Diyos,” na may paliwanag sa talababa na templo ang tinutukoy.
  alternative: “templo ng kanilang Diyos”
  rationale: Pinananatili nito ang konkretong idyoma ng Aramaic nang hindi inililihim sa karaniwang mambabasa ang tinutukoy nito.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang “bahay ng kanilang Diyos” bilang biblikal na idyoma, at ginamit ang “kusang-loob” sa magkaugnay na pangngalan at kilos upang maipakita ang pag-uulit ng iisang ugat sa Aramaic. Inilipat ang mga pananda ng talababa sa mga salitang aktuwal na ipinapaliwanag ng bawat talababa.
