  yaml_path: translation/ot/ezra/007/018.yaml
  text: And whatever seems good to you and your brothers to do with the rest of the silver and the gold[b][a], do according to the will of your God.
translation:
  language: tl
  text: At anumang sa palagay mo at ng iyong mga kapatid ay mabuting[b] gawin sa natitirang pilak at ginto, gawin ninyo ayon sa kalooban[a] ng inyong Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “hangarin.”
    reason: lexical_alternative
  - marker: b
    text: O, “anumang mabuti para sa iyo at sa iyong mga kapatid.” Maaaring isalin nang mas literal na “mabuti” ang idyomang Aramaiko, o mas idyomatiko bilang “sa palagay ... ay mabuti.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמָה דִי
  choice: At anumang
  rationale: Ipinakikilala ng pariralang Aramaiko ang isang di-tiyak at bukás na sugnay; natural itong naipahahayag sa Filipino bilang “anumang.”
- source_word: עֲלָיִךְ וְעַל אַחַיִךְ יֵיטַב
  choice: sa palagay mo at ng iyong mga kapatid ay mabuti
  rationale: Ang idyomang may יטב at עַל ay tumutukoy sa kung ano ang minamabuti o inaakalang mabuti ng isang tao. Pinananatili ng “sa palagay … ay mabuti” ang deliberatibong diwa ng ipinagkaloob na pahintulot.
- source_word: אַחַיִךְ
  choice: iyong mga kapatid
  rationale: Literal na “mga kapatid” ang katawagan. Bagaman maaaring tumukoy sa mga kapwa Judio o kasamahan ni Ezra, hindi nililinaw ng salin ang mas malawak na kahulugang hindi tahasang sinabi ng teksto.
- source_word: בִּשְׁאָר כַּסְפָּא וְדַהֲבָה
  choice: sa natitirang pilak at ginto
  rationale: Ang שְׁאָר ay yaong nalabi o natira; malinaw at natural sa Filipino ang “natitirang pilak at ginto” para sa mga pondong naunang binanggit.
- source_word: לְמֶעְבַּד
  choice: gawin
  rationale: Malawak ang gamit dito ng pandiwang עבד para sa pagsasagawa ng anumang pasiya tungkol sa mga pondo. Hindi ito nilimitahan sa “gamitin” lamang.
- source_word: כִּרְעוּת
  choice: ayon sa kalooban
  rationale: Maaaring mangahulugan ang רְעוּת ng kalooban, hangarin, o kagustuhan. Ang “kalooban” ay angkop sa marangal na tono ng kautusan habang pinananatili ang pagtukoy sa layunin ng Diyos.
- source_word: אֱלָהֲכֹם
  choice: inyong Diyos
  rationale: Maramihan ang hulaping panghalip sa Aramaiko, kaya “inyong” ang ginamit. Tiyak na tumutukoy ito sa Diyos na sinasamba ni Ezra at ng kaniyang mga kasama.
- source_word: תַּעַבְדוּן
  choice: gawin ninyo
  rationale: Maramihan ang pandiwa at gumaganap dito bilang pahintulot na may bisa ring tagubilin. Ang “gawin ninyo” ay natural na naglalahad ng direktiba.
theological_decisions:
- issue: Pagkilala sa tinutukoy ng אֱלָהֲכֹם
  choice: inyong Diyos
  alternative: inyong diyos
  rationale: Partikular na Diyos ni Ezra at ng kaniyang mga kasama ang tinutukoy, hindi isang di-tiyak na diyos. Ang malaking titik ay tanda ng tiyak na reperensiya at hindi pagdaragdag ng doktrina.
- issue: Saklaw ng כִּרְעוּת
  choice: kalooban
  alternative: hangarin o kagustuhan
  rationale: 'Hindi nilulutas nang labis ang semantikong saklaw: inilalagay sa pangunahing teksto ang karaniwang saling “kalooban,” habang itinatala sa talababa ang lehitimong alternatibong “hangarin.”'
translation_notes:
  register: Makabago ngunit marangal na Filipino ang ginamit. Pinanatili ang literal na katawagang “mga kapatid,” ang pangmaramihang “inyong/gawin ninyo,” at ang pangkalahatang pandiwang “gawin” upang hindi paliitin ang ipinahihintulot ng teksto.
