  register: Makabago at dignified na Filipino ang ginamit, na may magalang na wikang angkop sa korte. Pinanatili ang paglipat mula sa pagsasalaysay na “sa kanya” tungo sa tuwirang pananalitang “aking panginoong hari” at “iyong dibdib.”
