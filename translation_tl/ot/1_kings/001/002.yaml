base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/002.yaml
  text: So his servants said to him[a], “Let them seek for my lord the king a young virgin woman, and let her attend the king and be his caregiver, and let her lie in your bosom[c][b], so that my lord the king may be warm.”
translation:
  language: tl
  text: Kaya sinabi sa kanya ng kanyang mga lingkod, “Humanap sila para sa aking panginoong hari ng isang dalagang birhen. Maglingkod siya sa harap ng hari[a] at maging tagapag-alaga nito[b]. Humiga siya sa iyong kandungan[c] upang uminit ang aking panginoong hari.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “tumayo siya sa harap ng hari”; maaari itong mangahulugang maglingkod o mag-asikaso sa isang tao.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “tagapaglingkod” o “tagapag-asikaso.” Bihira ang salitang Hebreo at tumutukoy sa isang taong naglilingkod o nag-aalaga sa iba.
    reason: lexical_alternative
  - marker: c
    text: Sa literal, “sa iyong dibdib/bosom”; maaari rin itong tumukoy sa kandungan.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲבָדָיו
  choice: kanyang mga lingkod
  rationale: Sa konteksto ng palasyo, tumutukoy ito sa mga lingkod o tauhan ng hari; hindi kailangang ipahiwatig dito ang katayuang alipin.
- source_word: יְבַקְשׁוּ
  choice: Maghanap sila
  rationale: Pinananatili ang aktibong ikatlong panauhang maramihan at ang diwang mungkahi o utos ng anyong Hebreo.
- source_word: לַאדֹנִי הַמֶּלֶךְ
  choice: para sa aking panginoong hari
  rationale: Pinananatili ang magalang na pormulang ginagamit sa korte at ang unang-panauhang pagmamay-ari sa “aking panginoon.”
- source_word: נַעֲרָה בְתוּלָה
  choice: isang dalagang birhen
  rationale: Ang “dalaga” ay naghahayag na bata pa ang babae, at ang “birhen” ay tahasang nagpapanatili sa ikalawang paglalarawan ng tekstong Hebreo.
- source_word: וְעָמְדָה לִפְנֵי הַמֶּלֶךְ
  choice: Maglingkod siya sa harap ng hari
  rationale: Ang literal na “tumayo sa harap” ay isang idyomang pangkorte para sa paglilingkod o pag-aasikaso; pinananatili rin ng salin ang larawan ng pagiging nasa harap ng hari.
- source_word: סֹכֶנֶת
  choice: tagapag-alaga
  rationale: Bihira ang salitang Hebreo at malamang na tumutukoy sa isang taong naglilingkod at nag-aalaga; hindi nito kusang ipinahihiwatig ang seksuwal na papel.
- source_word: וְשָׁכְבָה בְחֵיקֶךָ
  choice: Mahiga siya sa iyong dibdib
  rationale: Pinananatili ang kongkretong larawan ng חֵיק at ang pisikal na paglalapit na nilalayon upang mabigyan ng init ang hari.
- source_word: וְחַם
  choice: upang mainitan
  rationale: Likas na ipinapahayag sa Filipino ang nilalayong bunga ng mungkahi nang hindi nagdaragdag ng paliwanag sa teksto.
