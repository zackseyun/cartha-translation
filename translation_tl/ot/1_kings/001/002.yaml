revisions:
- from: Kaya sinabi sa kanya ng kanyang mga lingkod, “Maghanap sila para sa aking panginoong hari ng isang dalagang birhen. Maglingkod siya sa harap ng hari[a] at maging tagapag-alaga nito[b]. Mahiga siya sa iyong dibdib[c] upang mainitan ang aking panginoong hari.”
  to: Kaya sinabi sa kanya ng kanyang mga lingkod, “Humanap sila para sa aking panginoong hari ng isang dalagang birhen. Maglingkod siya sa harap ng hari[a] at maging tagapag-alaga nito[b]. Humiga siya sa iyong kandungan[c] upang uminit ang aking panginoong hari.”
  rationale: 'Ginawa ang maliliit na pagbabago para sa mas natural at mas tiyak na Filipino: “Humanap sila,” “upang uminit,” at “kandungan.” Napanatili ang mga panauhan at ang paggalang ng pananalitang pangkorte, pati ang maingat na di-seksuwalisadong pag-unawa sa bihirang סֹכֶנֶת.'
