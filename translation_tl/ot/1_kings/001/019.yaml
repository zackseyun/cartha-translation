revisions:
- from: Nagkatay siya bilang handog ng napakaraming baka, pinatabang hayop, at mga tupa[a]. Inanyayahan[b] niya ang lahat ng anak na lalaki ng hari, si Abiatar na pari, at si Joab na kumander ng hukbo; ngunit hindi niya inanyayahan si Solomon na iyong lingkod.
  to: Naghandog siya ng mga baka, mga pinatabang hayop, at tupa[a] nang napakarami. Inanyayahan[b] niya ang lahat ng anak na lalaki ng hari, ang paring si Abiatar, at si Joab na kumander ng hukbo; ngunit hindi niya inanyayahan si Solomon na iyong lingkod.
