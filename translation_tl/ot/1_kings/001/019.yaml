base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/019.yaml
  text: And he sacrificed oxen[a], fattened cattle, and sheep in abundance, and he invited all the king’s sons, Abiathar the priest, and Joab the commander of the army[b]; but he did not invite Solomon your servant.
translation:
  language: tl
  text: Naghandog siya ng mga baka, mga pinatabang hayop, at tupa[a] nang napakarami. Inanyayahan[b] niya ang lahat ng anak na lalaki ng hari, ang paring si Abiatar, at si Joab na kumander ng hukbo; ngunit hindi niya inanyayahan si Solomon na iyong lingkod.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Hebreo ay maaaring tumukoy nang mas malawak sa maliliit na hayop ng kawan, kabilang ang mga kambing.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “tinawag.” Ginamit dito ang “inanyayahan” dahil ang tinutukoy ay pagdalo sa handaang kaugnay ng paghahandog. Gayundin sa ikalawang paglitaw ng pandiwa sa talata.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְבַּח
  choice: Nagkatay siya bilang handog
  rationale: Tinutukoy ng זבח sa kontekstong ito ang ritwal na pagkatay bilang handog, hindi lamang karaniwang pagkatay. Malinaw at natural sa Filipino ang pariralang ito.
- source_word: שׁוֹר
  choice: baka
  rationale: Pangkalahatang katawagan ito para sa bovine at hindi nito labis na tinutukoy ang kasarian ng hayop.
- source_word: מְרִיא
  choice: pinatabang hayop
  rationale: Tumutukoy ito sa hayop na sadyang pinataba. Pinananatili ng salin ang kaibahan nito sa naunang pangkalahatang katawagang 'baka' nang hindi nagpapalagay ng tiyak na uri o bilang.
- source_word: צֹאן
  choice: mga tupa
  rationale: Natural itong katawagan sa listahan ng mga hayop na inihahandog, bagaman maaaring mas malawak ang Hebreo at isama ang mga kambing; ipinaliwanag iyon sa talababa.
- source_word: לָרֹב
  choice: napakaraming
  rationale: Ipinahahayag nito ang napakalaking dami ng mga hayop at natural itong inilapat sa buong talaan.
- source_word: וַיִּקְרָא ... לֹא קָרָא
  choice: Inanyayahan ... hindi niya inanyayahan
  rationale: Bagaman pangunahing kahulugan ng קרא ang 'tumawag,' ang konteksto ay pag-anyaya sa isang handaan kaugnay ng paghahandog. Pareho ang salin sa dalawang paglitaw ng pandiwa.
- source_word: לְכָל בְּנֵי הַמֶּלֶךְ
  choice: lahat ng anak na lalaki ng hari
  rationale: Pinananatili ang tiyak na panlalaking kahulugan ng בנים at malinaw na ipinakikitang mga prinsipe ang tinutukoy.
- source_word: אֶבְיָתָר הַכֹּהֵן
  choice: si Abiatar na pari
  rationale: Isinalin ang titulo at ginamit ang karaniwang anyong Filipino ng pangalan.
- source_word: יֹאָב שַׂר הַצָּבָא
  choice: si Joab na kumander ng hukbo
  rationale: Malinaw at makabagong katumbas ito ng opisyal na tungkuling militar na שַׂר הַצָּבָא.
- source_word: וְלִשְׁלֹמֹה עַבְדְּךָ
  choice: ngunit hindi niya inanyayahan si Solomon na iyong lingkod
  rationale: Ginawang hayag ng 'ngunit' ang kontrast na likas sa konteksto, at pinanatili ang magalang na pagtukoy ni Batseba kay Solomon bilang lingkod ng hari.
