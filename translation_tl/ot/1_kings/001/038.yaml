  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang ‘sina’ para sa magkakasamang taong pinangalanan at pinanatili ang mga pangalang-pangkat sa halip na palitan agad ng pagpapakahulugang ‘mga bantay ng hari.’
