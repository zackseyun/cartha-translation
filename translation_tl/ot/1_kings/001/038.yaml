  source_fidelity: 'Tumpak sa kabuuan ang mga pangunahing elemento: ang pagbaba ng pangkat, ang pagpapasakay kay Solomon sa mola ni David, at ang pagdadala sa kanya sa Gihon. Gayunman, ang “Kaya” ay nagbibigay ng inferensiyal o resultang ugnayan na wala sa simpleng sunod-sunod na waw ng Hebreo; mas tapat ang payak na “Bumaba.”'
  naturalness: Natural ang karamihan ng pananalita, kabilang ang “pinasakay nila” at “dinala nila siya.” Mas maayos ang pagtukoy sa magkakahalong pangkat ng mga indibidwal at grupo kung gagamitin ang “kasama ang mga Kereteo at Peleteo,” sa halip na iugnay ang “sina” nang direkta sa “ang mga.”
  terminology: Ang “pari,” “propeta,” “anak ni Joiada,” “Kereteo,” “Peleteo,” “mola,” at “Gihon” ay angkop. Pinananatili ng mga talababa ang hindi tiyak na katangian ng mga pangalang-pangkat at ang kasariang gramatikal ng Hebreong salita para sa mola. Kailangang iwasto ang talababa b upang literal nitong ilarawan ang construct phrase na “ang mola ni Haring David,” hindi ang buong pariralang may pang-ukol na “sa.”
  issues:
