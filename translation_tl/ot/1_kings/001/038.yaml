    issue: Ang “Kaya” ay idinagdag na inferensiyal na koneksiyon.
    rationale: Ang וַיֵּרֶד ay karaniwang sunod-sunod na pandiwang “bumaba”; hindi nito mismong ipinapahayag ang “kaya.”
  - severity: low
    issue: Medyo hindi makinis ang “sina ... at ang mga Kereteo at Peleteo.”
    rationale: Ang “sina” ay para sa mga taong pinangalanan, samantalang ang huling dalawang pangkat ay may “ang mga.” Ang “kasama ang” ay mas likas at hindi nagbabago ng kahulugan.
  - severity: low
    issue: Hindi eksakto ang pahayag ng talababa b tungkol sa literal na Hebreo.
    rationale: Ang tinutukoy ng lexical note ay ang construct phrase na “the mule of King David”; sa Filipino ito ay “ang mola ni Haring David.”
