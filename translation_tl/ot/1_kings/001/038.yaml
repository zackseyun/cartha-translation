base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/038.yaml
  text: So Zadok the priest[a], Nathan the prophet, Benaiah son of Jehoiada, and the Cherethites and the Pelethites went down and had Solomon ride on King David’s mule[c][b], and they brought him to Gihon.
translation:
  language: tl
  text: Bumaba sina Zadok na pari, Natan na propeta, at Benaias na anak ni Joiada, kasama ang mga Kereteo at Peleteo.[a] Pinasakay nila si Solomon sa mola ni Haring David,[b][c] at dinala nila siya sa Gihon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O maaaring “mga bantay ng hari.” Ginagamit mismo sa Hebreo ang mga pangalang “Kereteo” at “Peleteo.”
    reason: lexical_alternative
  - marker: b
    text: Sa literal na Hebreo, “ang mola ni Haring David.”
    reason: lexical_alternative
  - marker: c
    text: Ang salitang Hebreo para sa “mola” ay nasa anyong pambabae at maaaring tumukoy sa isang babaeng mola.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרֶד
  choice: bumaba
  rationale: Pinananatili ang direksiyonal na diwa ng ירד (‘bumaba’) at natural ito sa daloy ng salaysay.
- source_word: הַכֹּהֵן
  choice: pari
  rationale: Karaniwan at malinaw na salin ng כהן; ang pariralang ‘Zadok na pari’ ay likas sa modernong Filipino.
- source_word: הַנָּבִיא
  choice: propeta
  rationale: Pamantayang salin ng נביא at pinananatili ang titulong ibinigay kay Natan.
- source_word: בֶן יְהוֹיָדָע
  choice: anak ni Joiada
  rationale: Tuwirang inilalarawan ang patronimiko sa natural na anyong Filipino.
- source_word: הַכְּרֵתִי וְהַפְּלֵתִי
  choice: ang mga Kereteo at Peleteo
  rationale: Pinananatili bilang mga pangalan ng pangkat sapagkat hindi tiyak kung etniko o pantungkulin ang eksaktong diin; ang ‘mga bantay ng hari’ ay posibleng pagpapakahulugan ngunit hindi mismong anyong leksikal.
- source_word: וַיַּרְכִּבוּ
  choice: pinasakay nila
  rationale: 'Ipinapahayag ang causative na anyo ng רכב: sila ang nagpasakay kay Solomon.'
- source_word: פִּרְדַּת
  choice: mola
  rationale: Ang pangngalan ay tumutukoy sa mule; ginamit ang karaniwang pangkalahatang katawagang Filipino, habang inilagay sa talababa ang posibleng espesipikong kasariang babae.
- source_word: הַמֶּלֶךְ דָּוִד
  choice: ni Haring David
  rationale: Natural na ipinapahayag sa Filipino ang pagmamay-ari sa construct chain na ‘mola ng Haring David.’
- source_word: וַיֹּלִכוּ אֹתוֹ
  choice: dinala nila siya
  rationale: Ang causative ng הלך ay maaaring ‘pinapunta,’ ‘inakay,’ o ‘dinala’; ang ‘dinala’ ay angkop dahil nakasakay si Solomon at kasama niya ang pangkat sa pagpunta sa Gihon.
- source_word: עַל גִּחוֹן
  choice: sa Gihon
  rationale: Sa kontekstong may kilos patungo sa isang lugar, natural na ipinapahayag ng ‘sa’ ang destinasyon sa Filipino.
