  text: Now come[a], please let me advise you[c][b], and save your life and the life of your son Solomon.
translation:
  language: tl
  text: Ngayon, halika[a], hayaan mong payuhan kita, pakiusap[b], at iligtas mo ang buhay mo[c] at ang buhay ng anak mong si Solomon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal na “pumunta” o “lumakad”; dito ay isang idyomatikong panawagan, kaya isinaling “halika.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, literal na “payuhan kita ng payo,” isang magkaugnay na pag-uulit na nangangahulugang magbigay ng payo. Ang “pakiusap” ay nagsasaad ng magalang na puwersa ng Hebreong na.
    reason: lexical_alternative
  - marker: c
    text: Ang salitang Hebreo na נֶפֶשׁ (nefesh) ay nangangahulugang “buhay” sa kontekstong ito, hindi “kaluluwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Kaya ngayon
  rationale: Nagpapahiwatig ito ng agarang paglipat mula sa paglalarawan ng panganib tungo sa panukalang pagkilos; natural sa Tagalog ang “Kaya ngayon” sa kontekstong ito.
- source_word: לְכִי
  choice: halika
  rationale: Bagaman literal na mula sa pandiwang “pumunta/lumakad,” ginagamit ito rito bilang tuwirang panawagan o pag-anyaya; “halika” ang likas na katumbas sa modernong Tagalog.
- source_word: אִיעָצֵךְ נָא עֵצָה
  choice: pakinggan mo sana ang payo ko
  rationale: Ang Hebreo ay may magkaugnay na pandiwa at pangngalang “payuhan—payo.” Sa Tagalog, malinaw at natural na naihahatid ng pariralang ito ang pakiusap na tanggapin ang payo, habang ang “sana” ay kumakatawan sa magalang at mapilit na נָא.
- source_word: וּמַלְּטִי
  choice: at iligtas mo
  rationale: Ang pautos na anyo ay humihiling kay Batseba na kumilos upang makaligtas sa bantang panganib; “iligtas mo” ang malinaw na katumbas sa konteksto.
- source_word: נַפְשֵׁךְ
  choice: ang buhay mo
  rationale: Ang נֶפֶשׁ dito ay tumutukoy sa buhay ng tao, hindi sa “kaluluwa” bilang hiwalay na espirituwal na sangkap.
- source_word: וְאֶת נֶפֶשׁ בְּנֵךְ שְׁלֹמֹה
  choice: at ang buhay ng anak mong si Solomon
  rationale: Pinananatili nito ang pagkakapantay ng dalawang buhay na nanganganib at tahasang binabanggit si Solomon gaya ng nasa Hebreo.
