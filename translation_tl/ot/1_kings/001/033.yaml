base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/033.yaml
  text: And the king said to them[a], “Take with you the servants of your lord, and have my son Solomon ride on the mule that is mine, and bring him down to Gihon.”
translation:
  language: tl
  text: At sinabi ng hari sa kanila, “Isama ninyo ang mga lingkod ng inyong panginoon. Pasakayin ninyo[a] ang anak kong si Solomon sa mula na pag-aari ko, at dalhin ninyo siya pababa sa Gihon.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ang pandiwang Hebreo ay nasa sanhiang anyo: sila ang magpapasakay kay Solomon sa mula.'
    reason: lexical_clarification
lexical_decisions:
- source_word: עַבְדֵי
  choice: mga lingkod
  rationale: Sa konteksto ng palasyo, tumutukoy ito sa mga taong naglilingkod sa hari; hindi kailangang tukuyin sila bilang mga alipin.
- source_word: אֲדֹנֵיכֶם
  choice: inyong panginoon
  rationale: Pinananatili nito ang pormal na pananalita sa korte at ang pagtukoy ng hari sa sarili niya sa ikatlong panauhan.
- source_word: וְהִרְכַּבְתֶּם
  choice: Pasakayin ninyo
  rationale: 'Likas sa modernong Tagalog ang pandiwang ito at malinaw na ipinapahayag ang sanhiang diwa ng Hiphil: sila ang magpapasakay kay Solomon.'
- source_word: הַפִּרְדָּה
  choice: sa mola
  rationale: Ang “mola” ang karaniwang salitang Filipino para sa hayop; hindi mahalaga rito ang kasariang pambabae na nasa anyong Hebreo.
- source_word: אֲשֶׁר לִי
  choice: na pag-aari ko
  rationale: Pinananatili ang tahasang sugnay ng pag-aari, na nagbibigay-diin na mismong mola ng hari ang gagamitin bilang tanda ng kaniyang pahintulot.
- source_word: וְהוֹרַדְתֶּם
  choice: dalhin ninyo siya pababa
  rationale: Ipinapahayag nito kapwa ang sanhiang kilos at ang heograpikong diwa ng pagbaba patungong Gihon.
- source_word: גִּחוֹן
  choice: Gihon
  rationale: Isinatinig ang pangalang pantangi sa halip na isalin.
- source_word: בְנִי
  choice: ang anak kong si Solomon
  rationale: Pinananatili ang tahasang ugnayang ama-anak at ginagamit ang likas na ayos ng pangalan sa Tagalog.
- source_word: וַיֹּאמֶר הַמֶּלֶךְ
  choice: At sinabi ng hari
  rationale: Pinananatili ang pasulong na daloy ng salaysay na ipinahihiwatig ng waw-consecutive.
