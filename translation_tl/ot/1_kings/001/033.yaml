  to: At sinabi ng hari sa kanila, “Isama ninyo ang mga lingkod ng inyong panginoon. Pasakayin ninyo[a] ang anak kong si Solomon sa mula na pag-aari ko, at dalhin ninyo siya pababa sa Gihon.”
