base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/052.yaml
  text: And Solomon said[a], “If he proves to be a worthy man, not one of his hairs will fall to the ground; but if evil is found in him[b], he shall die.”
translation:
  language: tl
  text: Sinabi ni Solomon, “Kung mapatunayan siyang isang taong marangal[a], ni isang hibla ng buhok niya ay hindi malalaglag sa lupa[b]. Ngunit kung may masumpungang kasamaan sa kanya, mamamatay siya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literal: “anak ng lakas/kagitingan.” Ang idyomang Hebreo ay maaaring mangahulugang taong may dangal, kakayahan, o tapang, ayon sa konteksto.'
    reason: lexical_alternative
  - marker: b
    text: Ang “ni isang hibla ng buhok niya ay hindi malalaglag sa lupa” ay isang idyomang nangangahulugang hindi siya mapapahamak.
    reason: idiom_explanation
lexical_decisions:
- source_word: בֶן־חַיִל
  choice: taong karapat-dapat
  rationale: Literal itong ‘anak ng lakas/kakayahan,’ isang idyomang maaaring tumukoy sa taong may halaga, kakayahan, o tapang. Sa kontekstong ito, sinusuri ang magiging asal ni Adonias, kaya ang ‘taong karapat-dapat’ ay natural at hindi labis na nagbibigay ng kahulugang militar.
- source_word: יִהְיֶה
  choice: mapatunayan siyang
  rationale: Bagaman karaniwang ‘magiging’ o ‘siya ay,’ ipinahihiwatig ng pasubaling pangungusap na makikita sa susunod niyang asal kung anong uri siyang tao. Ipinahahayag ito nang natural ng ‘mapatunayan siyang.’
- source_word: מִשַּׂעֲרָתוֹ
  choice: isa man sa mga buhok niya
  rationale: Ang anyong Hebreo ay tumutukoy sa buhok bilang kolektibo. Ang pariralang Filipino ay nagpapanatili sa larawan ng kahit isang hibla nang hindi nagdaragdag ng ‘sa ulo,’ na hindi tahasang nasa teksto.
- source_word: לֹא יִפֹּל ... אָרְצָה
  choice: walang isa man ... ang malalaglag sa lupa
  rationale: Pinananatili nito ang matalinghagang larawan sa Hebreo at ang diin sa lubos na pag-iingat sa kanya laban sa kapahamakan.
- source_word: רָעָה
  choice: kasamaan
  rationale: Malawak ang salitang Hebreo at maaaring tumukoy sa masamang asal o gawa. Pinananatili ng ‘kasamaan’ ang moral at hudisyal na bigat nito nang hindi nililimitahan sa isang partikular na paglabag.
- source_word: תִמָּצֵא בוֹ
  choice: may masumpungang ... sa kanya
  rationale: Ipinahahayag ng konstruksyon na matutuklasang ang kasamaan ay nasa kanya o nauugnay sa kanya. Natural sa Filipino ang ‘may masumpungang kasamaan sa kanya.’
- source_word: וָמֵת
  choice: mamamatay siya
  rationale: Tiyak at mariing inilalahad ng sugnay ang kahihinatnan kapag napatunayang may kasamaan siya, nang hindi pinipilit kung ito ay hula o pormal na hatol.
theological_decisions:
- issue: Kung ang kamatayan ay hula o hudisyal na hatol
  choice: mamamatay siya
  alternative: dapat siyang mamatay
  rationale: Hindi tahasang tinutukoy ng maikling Hebreong sugnay kung hula o pormal na sentensiya ang diin. Pinananatili ng ‘mamamatay siya’ ang ganitong kaluwagan.
translation_notes:
  register: Makabago at marangal na Filipino, na may malinaw na pananalita para sa karaniwang mambabasa. Pinanatili ang matalinghagang larawan ng buhok na nalalaglag sa lupa at ipinaliwanag ito sa talababa.
