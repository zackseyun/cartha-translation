  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/הַֽ/נַּעֲרָ֖ה יָפָ֣ה עַד מְאֹ֑ד וַ/תְּהִ֨י לַ/מֶּ֤לֶךְ סֹכֶ֨נֶת֙ וַ/תְּשָׁ֣רְתֵ֔/הוּ וְ/הַ/מֶּ֖לֶךְ לֹ֥א יְדָעָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/004.yaml
  text: The young woman was very beautiful[a], and she became the king’s attendant and served him, but the king did not know her.
translation:
  language: tl
  text: Napakaganda ng dalaga. Siya ang naging tagapag-alaga ng hari at naglingkod sa kanya, ngunit hindi siya sinipingan ng hari.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “hindi siya nakilala ng hari,” isang eupemismo na nangangahulugang hindi nakipagtalik sa kanya ang hari.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנַּעֲרָה
  choice: ang dalaga
  rationale: Ang נַעֲרָה ay tumutukoy sa isang batang babae o kabataang babae. Natural at marangal sa modernong Filipino ang “dalaga” sa kontekstong ito, nang hindi kasing-impormal ng “bata” o “batang babae.”
- source_word: יָפָה עַד מְאֹד
  choice: napakaganda
  rationale: Ang עַד מְאֹד ay matinding pagpapalakas sa יָפָה. Maikli, natural, at sapat na mariin ang “napakaganda.”
- source_word: סֹכֶנֶת
  choice: tagapag-alaga
  rationale: Tumutukoy ito sa babaeng nakatalaga sa hari upang alagaan at tulungan siya. Ang “tagapag-alaga” ay akma sa agarang konteksto at hindi nagpapahiwatig ng isang tiyak na tungkuling medikal o romantiko.
- source_word: וַתְּשָׁרְתֵהוּ
  choice: at naglingkod sa kanya
  rationale: Karaniwang nangangahulugan ang שׁרת ng paglilingkod o pag-aasikaso. Malinaw at natural ang “naglingkod sa kanya,” at naiiwasan nito ang tunog-eklesiastiko ng “nagministeryo.”
- source_word: יְדָעָהּ
  choice: hindi siya sinipingan
  rationale: Ginagamit dito ang ידע bilang eupemismo para sa pakikipagtalik. Sa Filipino, ang literal na “hindi siya nakilala” ay hindi natural na naghahatid ng kahulugang seksuwal, kaya ginamit ang dignified at malinaw na eupemismong “hindi siya sinipingan.”
theological_decisions:
- issue: Seksuwal na eupemismo sa salaysay
  choice: Gamitin sa pangunahing teksto ang “hindi siya sinipingan ng hari,” na nagpapanatili ng marangal na eupemismo habang malinaw ang kahulugan.
  alternative: “Hindi siya nakilala ng hari” o “hindi nakipagtalik sa kanya ang hari.”
  rationale: Ang literal na katumbas na “nakilala” ay malamang na mapagkamalang ordinaryong pagkakilala sa modernong Filipino, samantalang ang “nakipagtalik” ay mas tahas kaysa sa Hebreong eupemismo. Pinananatili ng “sinipingan” ang pagpipigil ng salaysay at ang mahalagang pahayag na walang naganap na pagsasamang seksuwal.
translation_notes:
  register: Modernong Filipino na natural, marangal, at madaling maunawaan. Pinili ang “dalaga,” “tagapag-alaga,” at “sinipingan” upang mapanatili ang salaysay na dignified at ang seksuwal na pahiwatig ng Hebreo nang hindi nagiging malabo o labis na tahas.
