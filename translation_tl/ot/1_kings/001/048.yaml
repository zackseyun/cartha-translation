    issue: Naging nakaraang panahon ang pangwakas na sugnay.
    rationale: Ang “nakita ito” ay tumutukoy sa natapos na pagkakita, ngunit ang וְעֵינַי רֹאוֹת ay literal na “at ang aking mga mata ay nakakakita,” na nagbibigay-diin sa kasalukuyang pagsaksi ni David.
  - severity: low
    issue: May dagdag na diin sa “sarili kong.”
    rationale: Ang unang panauhang panlapi sa “aking mga mata” ay sapat upang katawanin ang עֵינַי; hindi kinakailangan ang dagdag na “sarili kong.”
  - severity: low
    issue: Hindi minarkahan ang idinagdag na layon na “ito.”
    rationale: Walang tahasang layon ang Hebreong רֹאוֹת. Dahil kailangang magbigay ang Tagalog ng layon para maging natural ang pangungusap, mainam na itala sa talababa na ito ay hinango sa konteksto.
