  text: וְ/גַם כָּ֖כָה אָמַ֣ר הַ/מֶּ֑לֶךְ בָּר֨וּךְ יְהוָ֜ה אֱלֹהֵ֣י יִשְׂרָאֵ֗ל אֲשֶׁ֨ר נָתַ֥ן הַ/יּ֛וֹם יֹשֵׁ֥ב עַל כִּסְאִ֖/י וְ/עֵינַ֥/י רֹאֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/048.yaml
  text: 'And the king also said thus: ‘Blessed be Yahweh[a], the God of Israel, who today has given one to sit on my throne, and my eyes see it.’'
translation:
  language: tl
  text: At sinabi rin ng hari, “Purihin si Yahweh, ang Diyos ng Israel, na nagbigay ngayon ng isang uupo sa aking trono, at nakikita ito[a] ng aking mga mata.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Walang tahasang layon ang pandiwang Hebreo; ang “ito” ay inilaan mula sa konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם כָּכָה אָמַר הַמֶּלֶךְ
  choice: At sinabi rin ng hari
  rationale: Likas na salaysay sa modernong Tagalog; ipinahihiwatig ng kasunod na tuwirang sipi ang pasulong na pagtukoy ng כָּכָה, kaya hindi na kailangan ang matigas na “ganito.”
- source_word: בָּרוּךְ יְהוָה
  choice: Purihin si Yahweh
  rationale: Ang “Purihin” ay likas at marangal na pormulang doksolohikal sa Tagalog, at pinananatili ang personal na pangalang Yahweh.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ang Diyos ng Israel
  rationale: Tuwiran at karaniwang salin ng pariralang construct.
- source_word: אֲשֶׁר נָתַן הַיּוֹם
  choice: na nagbigay ngayon
  rationale: Pinananatili ang payak na diwa ng נתן at ang temporal na diin ng הַיּוֹם nang hindi dinaragdagan ng “humirang.”
- source_word: יֹשֵׁב עַל כִּסְאִי
  choice: ng isang uupo sa aking trono
  rationale: Ang substantibong participle ay tumutukoy sa isang taong inilagay upang umupo sa trono; hindi idinaragdag ang pangalang Solomon na wala sa talata.
- source_word: וְעֵינַי רֹאוֹת
  choice: at nakita ito ng sarili kong mga mata
  rationale: Idyomatikong Tagalog na nagpapahayag na personal na nasaksihan ng hari ang pangyayari. Ang “ito” ay inilalaan mula sa konteksto dahil walang tahasang layon sa Hebreo.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; PANGINOON
  rationale: Tahasang ginagamit ng tekstong Hebreo ang Tetragrammaton; pinananatili rito ang personal na pangalan sa halip na palitan ng titulo.
- issue: Pagkakakilanlan ng uupo sa trono
  choice: isang uupo
  alternative: si Solomon
  rationale: Hindi binabanggit sa mismong talata ang pangalan; pinananatili ng salin ang pagkalahatang pahayag ng Hebreo at iniiwasang magdagdag mula sa konteksto.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Ginamit ang “Purihin si Yahweh” bilang malinaw na doksolohikal na pahayag. Hindi nilagyan ng talababa sapagkat ang di-tahasang layon ng רֹאוֹת ay likas na maihahayag sa Tagalog bilang “ito” nang hindi nagdudulot ng mahalagang alternatibong pagbasa.
