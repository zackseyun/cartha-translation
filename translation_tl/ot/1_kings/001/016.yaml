base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/016.yaml
  text: Bathsheba bowed down and prostrated herself before the king[a], and the king said, “What do you want?”
translation:
  language: tl
  text: Yumukod si Batseba at nagpatirapa sa harap ng hari. Sinabi ng hari, “Ano ang kailangan mo?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “Ano ang sa iyo?” Isang idyoma na maaari ring mangahulugang “Ano ang nais mo?” o “Ano ang bumabagabag sa iyo?”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּקֹּד
  choice: Yumukod
  rationale: Ipinapahayag ng קָדַד ang pagyuko nang mababa; pinananatili ng “yumukod” ang pisikal na kilos nang hindi ipinapalagay na lumuhod siya.
- source_word: בַּת שֶׁבַע
  choice: Batseba
  rationale: Ginamit ang karaniwang anyo ng pangalang ito sa makabagong saling Tagalog.
- source_word: וַתִּשְׁתַּחוּ
  choice: nagpatirapa
  rationale: Ang anyo ng שׁחה ay tumutukoy sa malalim na pagpapatirapa o pagpupugay. Naiiba ito sa naunang “yumukod” at napapanatili ang pagkakasunod ng dalawang kilos.
- source_word: לַמֶּלֶךְ
  choice: sa harap ng hari
  rationale: Sa konteksto ng pagpupugay, natural na ipinahahayag nito ang kilos na ginawa sa harapan ng hari.
- source_word: וַיֹּאמֶר הַמֶּלֶךְ
  choice: Sinabi ng hari
  rationale: Likas at tuwirang salin ng karaniwang pagkakasunod-sunod sa salaysay na Hebreo.
- source_word: מַה לָּךְ
  choice: Ano ang kailangan mo?
  rationale: Literal itong “Ano [ang] sa iyo?” ngunit isang idyomang nagtatanong tungkol sa kailangan, kahilingan, o ikinababahala ng kausap. Ang salin ay magalang at natural sa konteksto ng pakikipagharap sa hari.
