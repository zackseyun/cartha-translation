revisions:
- from: Naghandog si Adonias ng mga tupa, mga baka, at pinatabang hayop sa tabi ng Bato ng Zohelet[a], na malapit sa En-rogel. Inanyayahan niya ang lahat ng kapatid niyang mga anak ng hari, at ang lahat ng kalalakihan ng Juda na mga lingkod ng hari.[b][c]
  to: Naghandog si Adonias ng mga tupa, mga baka, at mga pinatabang hayop sa tabi ng bato ng Zohelet[a], na malapit sa En-rogel. Inanyayahan[b] niya ang lahat ng kanyang mga kapatid—ang mga anak ng hari—at ang lahat ng kalalakihan ng Juda, na mga lingkod ng hari.[c]
  rationale: Inayos ang apposition ng “mga kapatid” at “mga anak ng hari” upang maiwasan ang maling pagbasa sa Filipino, ginawang malinaw ang pangmaramihang “mga pinatabang hayop,” at inilagay ang mga talababa sa mga kaugnay na salita. Hindi binago ang kahulugan o ang umiiral na pag-iingat sa mga posibleng saklaw ng mga katagang Hebreo.
