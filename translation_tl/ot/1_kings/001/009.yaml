  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יִּזְבַּ֣ח אֲדֹנִיָּ֗הוּ צֹ֤אן וּ/בָקָר֙ וּ/מְרִ֔יא עִ֚ם אֶ֣בֶן הַזֹּחֶ֔לֶת אֲשֶׁר אֵ֖צֶל עֵ֣ין רֹגֵ֑ל וַ/יִּקְרָ֗א אֶת כָּל אֶחָי/ו֙ בְּנֵ֣י הַ/מֶּ֔לֶךְ וּ/לְ/כָל אַנְשֵׁ֥י יְהוּדָ֖ה עַבְדֵ֥י הַ/מֶּֽלֶךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/009.yaml
  text: Adonijah sacrificed sheep[a], cattle, and fattened animals by the stone of Zoheleth, which is beside En-rogel, and he invited all his brothers, the king’s sons, and all the men of Judah[e][d][c][b], the king’s servants.
translation:
  language: tl
  text: Naghandog si Adonias ng mga tupa, mga baka, at mga pinatabang hayop sa tabi ng bato ng Zohelet[a], na malapit sa En-rogel. Inanyayahan[b] niya ang lahat ng kanyang mga kapatid—ang mga anak ng hari—at ang lahat ng kalalakihan ng Juda, na mga lingkod ng hari.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Zohelet ay pangalan ng isang lugar; hindi tiyak ang kahulugan ng pangalan.
    reason: cultural_note
  - marker: b
    text: Ang “inanyayahan” ay maaari ring isaling “tinawag” o “ipinatawag.”
    reason: lexical_alternative
  - marker: c
    text: Ang “mga lingkod ng hari” ay maaaring tumukoy sa mga tauhan o opisyal ng palasyo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְבַּח
  choice: Naghandog
  rationale: Ipinahihiwatig ng זבח ang ritwal na pagkatay bilang handog at kaugnay na piging, hindi lamang ordinaryong pagkatay.
- source_word: צֹאן
  choice: mga tupa
  rationale: Maaaring tumukoy ang salita sa maliliit na alagang hayop, kabilang ang tupa at kambing; ang “mga tupa” ay natural na kinatawang salin sa talaang ito.
- source_word: וּבָקָר
  choice: mga baka
  rationale: Malawak itong katawagan para sa mga hayop na bovine at hindi kailangang limitahan sa mga barakong baka.
- source_word: וּמְרִיא
  choice: pinatabang hayop
  rationale: Tumutukoy ito sa pinatabang alagang hayop na inihanda para sa natatanging pagkain; hindi tiyak sa orihinal na mga guya ang mga ito.
- source_word: עִם אֶבֶן הַזֹּחֶלֶת
  choice: sa tabi ng Bato ng Zohelet
  rationale: Lokasyonal ang gamit ng pang-ukol dito. Pinanatili ang Zohelet bilang pangalang pantangi dahil hindi tiyak ang kahulugan nito.
- source_word: אֲשֶׁר אֵצֶל עֵין רֹגֵל
  choice: na malapit sa En-rogel
  rationale: Natural na ipinapahayag ang lokasyon, habang transliterado ang kilalang pangalan ng lugar.
- source_word: וַיִּקְרָא
  choice: Inanyayahan
  rationale: Sa konteksto ng handaan at pagtitipon, ang pagtawag ay isang paanyayang dumalo, bagaman maaari rin itong isaling “tinawag.”
- source_word: אֶת כָּל אֶחָיו בְּנֵי הַמֶּלֶךְ
  choice: ang lahat ng kapatid niyang mga anak ng hari
  rationale: 'Pinananatili ang appositional na pagkakakilanlan: ang mga kapatid na tinutukoy ay mga anak ng hari.'
- source_word: אַנְשֵׁי יְהוּדָה
  choice: ang lahat ng kalalakihan ng Juda
  rationale: Tahasang panlalaki ang Hebreong anyo; hindi ito ginawang neutral, bagaman maaaring tumukoy sa pangkat ng mga taga-Juda sa kontekstong pampamahalaan.
- source_word: עַבְדֵי הַמֶּלֶךְ
  choice: mga lingkod ng hari
  rationale: Direktang salin ito na nakapagpapanatili sa posibilidad na ang tinutukoy ay mga tagapaglingkod, tauhan, o opisyal ng palasyo.
theological_decisions:
- issue: Kasariang ipinahihiwatig ng אַנְשֵׁי יְהוּדָה
  choice: kalalakihan ng Juda
  alternative: mga taga-Juda
  rationale: Pinananatili ang tahasang panlalaking kahulugan ng Hebreo nang hindi ipinapalagay na lahat ng mamamayan ng Juda ang tinutukoy.
- issue: Ugnayan ng “mga lingkod ng hari” sa “mga kalalakihan ng Juda”
  choice: itinuring na naglalarawan sa mga kalalakihan ng Juda
  alternative: maaaring basahing hiwalay na pangkat ng mga lingkod ng hari
  rationale: Walang pang-ugnay bago ang עַבְדֵי הַמֶּלֶךְ, kaya malamang na nililinaw nito kung sinu-sino ang mga kalalakihan ng Juda; gayunman, may bahagyang sintaktikong posibilidad ng mas maluwag na pagbasa.
translation_notes:
  register: Makabago at dignified na Filipino; ginamit ang “naghandog” upang maipakita ang ritwal na kahulugan, at pinanatili ang mga pangalang Zohelet at En-rogel sa transliteradong anyo.
