base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/039.yaml
  text: Then Zadok the priest took the horn of oil from the tent and anointed Solomon[a]. Then they blew the ram’s horn, and all the people said[b], “Long live King Solomon!”
translation:
  language: tl
  text: Kinuha ni Zadok na pari ang sungay na may langis mula sa tolda at pinahiran niya ng langis si Solomon. Pagkatapos, hinipan nila ang shofar[a], at sinabi ng buong bayan, “Mabuhay si Haring Solomon!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “trumpeta.” Ang Hebreong shofar ay isang instrumentong hinihipan na yari sa sungay, karaniwan ay sungay ng lalaking tupa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: Kinuha
  rationale: Likas at tuwirang salin ng sunod na kilos sa salaysay.
- source_word: צָדוֹק הַכֹּהֵן
  choice: ni Zadok na pari
  rationale: Pinananatili ang pangalan at malinaw na inilalahad ang kaniyang katungkulan sa natural na Tagalog.
- source_word: קֶרֶן הַשֶּׁמֶן
  choice: ang sungay na lalagyan ng langis
  rationale: Pinananatili ang kongkretong larawan ng sungay bilang sisidlan, habang nililinaw ang ugnayan nito sa langis.
- source_word: מִן הָאֹהֶל
  choice: mula sa tolda
  rationale: Ang Hebrew ay karaniwang salitang 'tolda'; hindi ito ginawang mas tiyak na 'tabernakulo' sa pangunahing teksto.
- source_word: וַיִּמְשַׁח
  choice: pinahiran niya ng langis
  rationale: Malinaw at karaniwang Tagalog para sa rituwal na pagpapahid; ipinahihiwatig ng konteksto ang pagtatalaga bilang hari.
- source_word: וַיִּתְקְעוּ בַּשּׁוֹפָר
  choice: hinipan nila ang tambuling sungay
  rationale: Ipinakikita na ang shofar ay instrumentong hinihipang yari sa sungay, nang hindi ipinapalagay na tiyak na sungay ng lalaking tupa sa pangunahing teksto.
- source_word: כָּל הָעָם
  choice: ang buong bayan
  rationale: Natural na kolektibong pahayag sa Tagalog na nagpapanatili sa pampublikong pagbubunyi.
- source_word: יְחִי הַמֶּלֶךְ שְׁלֹמֹה
  choice: Mabuhay si Haring Solomon!
  rationale: Karaniwang pormula ng pagbubunyi sa Tagalog na tumpak na naghahayag ng hangarin ng jussive.
theological_decisions:
- issue: Katiyakan ng הָאֹהֶל sa konteksto ng pagpapahid sa hari
  choice: tolda
  alternative: tabernakulo / banal na tolda
  rationale: Karaniwang pangngalang 'tolda' ang ginamit sa Hebrew. Pinananatili ng salin ang di-tiyak na katawagan sa halip na magdagdag ng teknikal na pagkakakilanlan.
- issue: Kahulugan ng rituwal na משׁח
  choice: pinahiran ng langis
  alternative: itinalaga bilang hari
  rationale: Isinasalin ang mismong rituwal na kilos at hindi isinasama sa pandiwa ang interpretatibong bunga nito, bagaman malinaw sa konteksto ang maharlikang pagtatalaga.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “tambuling sungay” upang maging malinaw ang gamit ng shofar bilang instrumentong hinihipan; pinanatili ang payak na “tolda” upang hindi gawing mas tiyak kaysa sa Hebrew ang lugar.
