revisions:
- from: Kinuha ni Zadok na pari ang sungay na lalagyan ng langis mula sa tolda at pinahiran niya ng langis si Solomon. Pagkatapos, hinipan nila ang tambuling sungay[a], at sinabi ng buong bayan, “Mabuhay si Haring Solomon!”
  to: Kinuha ni Zadok na pari ang sungay na may langis mula sa tolda at pinahiran niya ng langis si Solomon. Pagkatapos, hinipan nila ang shofar[a], at sinabi ng buong bayan, “Mabuhay si Haring Solomon!”
  rationale: Pinalitan ang dalawang pariralang may alinman sa dagdag na pagpapakahulugan o di-likas na katawagan. Pinananatili ng “sungay na may langis” ang kongkretong larawan ng Hebreo, at pinangangalagaan ng “shofar” kasama ng talababa ang katumpakan ng katawagang pangkultura nang hindi nagpapataw ng mas tiyak na pagbasa.
