  yaml_path: translation/ot/1_kings/001/006.yaml
  text: His father had never displeased him at any time by saying[a], “Why have you done thus?” He was also very handsome[b], and his mother had borne him after Absalom.
translation:
  language: tl
  text: Hindi kailanman pinasama ng kanyang ama ang loob niya[a] sa pagsasabing, “Bakit mo ginawa iyan?” Napakakisig din niya, at ipinanganak siya ng kanyang ina kasunod ni Absalom.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “hindi kailanman sinaway siya” o “hindi kailanman kinompronta siya.” Ang pandiwang Hebreo ay maaaring mangahulugang magdulot ng sakit, lungkot, o sama ng loob; sa kontekstong ito, tumutukoy ito sa hindi pagsaway o pagpigil ni David kay Adonias.
    reason: lexical_alternative
  - marker: b
    text: Literal na “mula sa kanyang mga araw,” isang idyomang nangangahulugang hindi kailanman o sa anumang panahon ng kanyang buhay.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲצָבוֹ
  choice: sinaway siya
  rationale: Maaaring tumukoy ang pandiwa sa pagpapasakit o pagpapayamot. Dahil sinusundan ito ng tanong na mapanuligsa, ang diwa sa konteksto ay hindi kailanman kinompronta o pinigil ni David si Adonias. Ang “sinaway” ay likas sa konteksto ng pagpapalaki, habang inilalagay sa talababa ang mas literal na saklaw.
- source_word: מִיָּמָיו
  choice: kailanman
  rationale: Ang literal na “mula sa kanyang mga araw” ay isang idyomang nangangahulugang hindi ito nangyari sa anumang panahon ng kanyang buhay.
- source_word: לֵאמֹר
  choice: sa pagsasabing
  rationale: Ipinakikilala nito ang nilalaman ng koreksiyong hindi kailanman sinabi ng ama.
- source_word: מַדּוּעַ כָּכָה עָשִׂיתָ
  choice: Bakit mo ginawa iyan?
  rationale: Natural at tuwirang tanong sa modernong Tagalog; pinananatili nito ang parental na pagkuwestiyon nang hindi nagiging lipas ang pananalita.
- source_word: טוֹב תֹּאַר מְאֹד
  choice: napakakisig
  rationale: Ang parirala ay tumutukoy sa kaaya-ayang pisikal na anyo ng isang lalaki; “napakakisig” ang malinaw at natural na katumbas.
- source_word: וְאֹתוֹ יָלְדָה
  choice: ipinanganak siya ng kanyang ina
  rationale: Nakapaloob sa anyong pambabae ng pandiwa ang di-tahasang simuno. Ginagawang malinaw sa Tagalog ang ina bilang nagsilang, nang walang idinaragdag na bagong impormasyon.
- source_word: אַחֲרֵי אַבְשָׁלוֹם
  choice: kasunod ni Absalom
  rationale: Pinakamalamang na tumutukoy ito sa pagkakasunod ng kapanganakan; mas malinaw ito kaysa sa simpleng “pagkatapos ni Absalom,” na maaaring magpahiwatig ng panahon lamang.
