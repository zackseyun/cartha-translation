base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/028.yaml
  text: Then King David answered and said[a], “Call Bathsheba to me.” So she came before the king and stood before the king.
translation:
  language: tl
  text: Sumagot[a] si Haring David at sinabi niya, “Ipatawag ninyo sa akin si Batseba.” Kaya dumating siya sa harapan ng hari at tumayo sa harapan ng hari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “tumugon.” Madalas gamitin sa salaysay na Hebreo ang “sumagot” bilang pambungad sa pananalita.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן
  choice: Sumagot
  rationale: Pinananatili nito ang karaniwang Hebreong pormula sa pagsisimula ng pananalita, kahit walang tahasang tanong na kaagad na nauna.
- source_word: הַמֶּלֶךְ דָּוִד
  choice: Haring David
  rationale: Likas sa modernong Tagalog ang pagsasama ng titulo at pangalan sa anyong “Haring David.”
- source_word: וַיֹּאמֶר
  choice: at sinabi niya
  rationale: Tuwirang isinasalin ang karaniwang pandiwa ng pagsasalita at pinananatili ang magkasunod na וַיַּעַן at וַיֹּאמֶר ng Hebreo.
- source_word: קִרְאוּ לִי
  choice: Ipatawag ninyo sa akin
  rationale: Ipinahahayag nito ang maramihang pautos at ang diwa ng pagpapapunta sa isang tao sa harapan ng hari.
- source_word: לְבַת שָׁבַע
  choice: si Batseba
  rationale: Ginagamit ang nakaugaliang anyo ng pangalang Bathsheba sa Tagalog, kasama ang angkop na pantukoy sa personal na pangalan.
- source_word: וַתָּבֹא לִפְנֵי הַמֶּלֶךְ
  choice: pumasok siya sa harapan ng hari
  rationale: Inilalarawan nito ang pagpasok niya sa presensiya ng hari nang hindi dinaragdagan ang teksto.
- source_word: וַתַּעֲמֹד לִפְנֵי הַמֶּלֶךְ
  choice: tumayo sa harapan ng hari
  rationale: Pinananatili ang literal na kilos at ang pag-uulit ng “sa harapan ng hari,” na nagpapahiwatig ng pormal na pagharap sa korte.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Pinanatili ang bahagyang pormal na pag-uulit ng “sa harapan ng hari” dahil makahulugan ito sa tagpong pangkorte.
