source:
  edition: WLC
  text: וְ/גַם בָּ֜אוּ עַבְדֵ֣י הַ/מֶּ֗לֶךְ לְ֠/בָרֵךְ אֶת אֲדֹנֵ֜י/נוּ הַ/מֶּ֣לֶךְ דָּוִד֮ לֵ/אמֹר֒ יֵיטֵ֨ב אלהי/ך אֶת שֵׁ֤ם שְׁלֹמֹה֙ מִ/שְּׁמֶ֔/ךָ וִֽ/יגַדֵּ֥ל אֶת כִּסְא֖/וֹ מִ/כִּסְאֶ֑/ךָ וַ/יִּשְׁתַּ֥חוּ הַ/מֶּ֖לֶךְ עַל הַ/מִּשְׁכָּֽב־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/047.yaml
  text: And the king’s servants also came to bless our lord King David[a], saying, ‘May your God make Solomon’s name better than your name[b], and may he make his throne greater than your throne.’ And the king bowed himself on the bed.
translation:
  language: tl
  text: Dumating din ang mga lingkod ng hari upang basbasan ang aming panginoon, si Haring David, at sinabi nila, “Nawa’y gawing mas marangal ng iyong Diyos ang pangalan ni Solomon kaysa sa iyong pangalan[a], at nawa’y gawin niyang higit na dakila ang trono ni Solomon kaysa sa iyong trono.” At yumukod ang hari sa higaan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “pangalan” dito ay tumutukoy rin sa reputasyon o katanyagan.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “sumamba ang hari sa higaan.” Ang pandiwang Hebreo ay maaaring mangahulugang “yumukod” o “sumamba,” depende sa konteksto.
    reason: alternative_reading
lexical_decisions:
- source_word: וְגַם בָּאוּ
  choice: Dumating din
  rationale: Likas na naipahahayag sa Tagalog ang pandagdag na diwa ng וְגַם at ang naganap na kilos ng בָּאוּ.
- source_word: עַבְדֵי הַמֶּלֶךְ
  choice: mga lingkod ng hari
  rationale: Sapat ang “mga lingkod” upang saklawin ang mga tagapaglingkod o opisyal sa maharlikang sambahayan nang hindi ipinipilit ang diwa ng pagkaalipin.
- source_word: לְבָרֵךְ
  choice: upang basbasan
  rationale: Pinananatili ng “basbasan” ang pormal at panrelihiyong diwa ng ברך, sa halip na paliitin ito sa simpleng pagbati.
- source_word: אֶת אֲדֹנֵינוּ הַמֶּלֶךְ דָּוִד
  choice: ang aming panginoon, si Haring David
  rationale: Pinananatili nito ang magalang na katawagang panghukuman at malinaw na ipinakikilala si David bilang hari.
- source_word: יֵיטֵב אֱלֹהֶיךָ אֶת שֵׁם שְׁלֹמֹה מִשְּׁמֶךָ
  choice: Nawa’y gawing mas marangal ng iyong Diyos ang pangalan ni Solomon kaysa sa pangalan mo
  rationale: Ang “mas marangal” ay natural na Tagalog para sa causative at comparative na diwa ng יטב kapag “pangalan” ang layon; pinananatili ang larawang “pangalan” habang ipinahihiwatig ang reputasyon o katanyagan.
- source_word: וִיגַדֵּל אֶת כִּסְאוֹ מִכִּסְאֶךָ
  choice: at nawa’y gawin niyang higit na dakila ang trono ni Solomon kaysa sa trono mo
  rationale: Tuwirang pinananatili ang paghahambing at ang larawang dinastiko at maharlika ng “trono.” Inulit ang “ni Solomon” upang maiwasan ang malabong reperensiya ng panghalip sa Tagalog.
- source_word: וַיִּשְׁתַּחוּ הַמֶּלֶךְ
  choice: At yumukod ang hari
  rationale: Ang pandiwa ay maaaring tumukoy sa pagyukod o pagsamba. Ang “yumukod” ay nagpapanatili sa pisikal na kilos nang hindi tahasang nilulutas ang hindi binanggit na layon ng kilos.
- source_word: עַל הַמִּשְׁכָּב
  choice: sa ibabaw ng higaan
  rationale: Malapit ito sa literal na parirala at hindi nagdaragdag ng tahasang pang-angkin na wala sa Hebreo.
theological_decisions:
- issue: Kung ang וַיִּשְׁתַּחוּ ay tahasang nangangahulugang pagsamba o pisikal na pagyukod
  choice: yumukod ang hari
  alternative: sumamba ang hari
  rationale: Maaaring ipakahulugan ang pandiwa bilang pagyukod nang may paggalang o bilang pagsamba. Dahil walang tahasang layon ang pandiwa sa sugnay at binibigyang-diin ang kilos ng hari sa higaan, pinananatili sa pangunahing teksto ang pisikal na kilos at inilalagay sa talababa ang posibleng diwa ng pagsamba.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “basbasan,” “panginoon,” at “trono” upang mapanatili ang pormal na himig ng korte at ang teolohikal at dinastikong larawan ng teksto. Ang mga talababa ay inilagay mismo sa mga bahaging kanilang nililinaw.
