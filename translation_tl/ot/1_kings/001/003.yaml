  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יְבַקְשׁוּ֙ נַעֲרָ֣ה יָפָ֔ה בְּ/כֹ֖ל גְּב֣וּל יִשְׂרָאֵ֑ל וַֽ/יִּמְצְא֗וּ אֶת אֲבִישַׁג֙ הַ/שּׁ֣וּנַמִּ֔ית וַ/יָּבִ֥אוּ אֹתָ֖/הּ לַ/מֶּֽלֶךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/003.yaml
  text: So they searched throughout all the territory of Israel for a beautiful young woman[b][a], and they found Abishag the Shunammite and brought her to the king.
translation:
  language: tl
  text: Kaya naghanap sila ng isang magandang dalaga sa buong nasasakupan ng Israel[a]. Natagpuan nila si Abisag na Sunamita[b] at dinala siya sa hari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa buong lupain ng Israel.”
    reason: lexical_alternative
  - marker: b
    text: Ang “Sunamita” ay nangangahulugang isang babaeng mula sa Sunem.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְבַקְשׁוּ
  choice: naghanap sila
  rationale: Ang בּקשׁ ay nangangahulugang humanap o maghanap. Likas sa makabagong Tagalog ang “naghanap sila” at malinaw na nagpapahiwatig ng aktibong paghahanap.
- source_word: נַעֲרָה יָפָה
  choice: isang magandang dalaga
  rationale: Ang נַעֲרָה ay isang batang babae o kabataang babae, kadalasan ay nasa edad na maaaring mag-asawa. Ang “dalaga” ay maikli, natural, at marangal; tuwirang isinasalin ng “maganda” ang יָפָה.
- source_word: בְּכֹל גְּבוּל יִשְׂרָאֵל
  choice: sa buong nasasakupan ng Israel
  rationale: Dito, ang גְּבוּל ay tumutukoy sa saklaw ng lupain o teritoryo, hindi lamang sa mga hangganang guhit. Naipahihiwatig ng “buong nasasakupan” na sa lahat ng bahagi ng Israel isinagawa ang paghahanap.
- source_word: וַיִּמְצְאוּ
  choice: natagpuan nila
  rationale: Payak at tuwiran itong katumbas ng karaniwang pandiwang Hebreo para sa pagkakatagpo o pagkakita matapos maghanap.
- source_word: אֲבִישַׁג הַשּׁוּנַמִּית
  choice: Abisag na Sunamita
  rationale: Isinaangkop ang personal na pangalan at gentiliko sa karaniwang baybay at anyong Filipino. Pinananatili ng “Sunamita” ang katawagang nagsasaad ng pinagmulan niya.
- source_word: וַיָּבִאוּ אֹתָהּ לַמֶּלֶךְ
  choice: dinala siya sa hari
  rationale: Ang anyong hiphil ng בוא ay karaniwang nangangahulugang “dalhin.” Malinaw na ipinakikita ng parirala ang pagdadala kay Abisag patungo sa hari nang walang idinagdag na diwa.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “dalaga” sa halip na mas teknikal o makalumang katawagan, at “nasasakupan” upang ipakita na ang paghahanap ay ginawa sa buong teritoryo ng Israel.
