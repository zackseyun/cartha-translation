translation_notes:
  register: Makabago at marangal na Filipino ang ginamit, na may malinaw na ayos ng pangungusap para sa karaniwang mambabasa. Hinati sa tatlong pangungusap ang sunod-sunod na mga sugnay ng Hebreo upang maging natural sa Tagalog habang pinananatili ang pagkakasunod-sunod at ugnayang sanhi-paliwanag ng mga pangyayari.
