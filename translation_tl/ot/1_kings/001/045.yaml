base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/045.yaml
  text: And Zadok the priest and Nathan the prophet have anointed him king at Gihon[a], and they have come up from there rejoicing, and the city is in an uproar. That is the sound that you heard.
translation:
  language: tl
  text: At pinahiran siyang hari sa Gihon ni Zadok na pari at ni Natan na propeta. Umahon sila mula roon na nagagalak, at nagkagulo ang lungsod.[a] Iyon ang tunog na narinig ninyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “umalingawngaw ang lungsod” o “nabulabog ang lungsod”; ipinahihiwatig ng pandiwang Hebreo ang maingay na pagkilos o pagkakagulo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמְשְׁחוּ אֹתוֹ
  choice: Pinahiran siya
  rationale: Sa konteksto ng paghahari, ang משׁח ay tumutukoy sa ritwal na pagpapahid ng langis upang italaga ang isang tao sa tungkulin. Ang aspektong perpektibo ng Tagalog ay natural sa pagsasalaysay ng naganap na pangyayari.
- source_word: צָדוֹק הַכֹּהֵן וְנָתָן הַנָּבִיא
  choice: nina Zadok na pari at Natan na propeta
  rationale: Isinalin nang tuwiran ang mga titulo, at ginamit ang “nina” upang natural na ipahayag sa Tagalog ang mga gumaganap sa pandiwang balintiyak.
- source_word: לְמֶלֶךְ
  choice: bilang hari
  rationale: Malinaw nitong ipinapakita ang katungkulan na layon ng pagpapahid nang hindi nagdaragdag ng paliwanag na wala sa Hebreo.
- source_word: בְּגִחוֹן
  choice: sa Gihon
  rationale: Pinanatili ang pangalang-pook at ginamit ang karaniwang pang-ukol sa Tagalog para sa lokasyon.
- source_word: וַיַּעֲלוּ מִשָּׁם
  choice: umahon sila mula roon
  rationale: Pinananatili ng “umahon” ang direksiyong ipinahihiwatig ng עלה, samantalang natural na tinutukoy ng “mula roon” ang pinanggalingang lugar.
- source_word: שְׂמֵחִים
  choice: na nagagalak
  rationale: Inilalarawan nito ang kalagayan o paraan ng kanilang pag-ahon at pinananatili ang masayang diwa ng salitang Hebreo.
- source_word: וַתֵּהֹם הַקִּרְיָה
  choice: umugong sa ingay ang buong lungsod
  rationale: Ang הום ay nagpapahiwatig ng maingay na pagkilos o pagkakagulo. Pinili ang “umugong sa ingay” upang maipahayag ang naririnig na dagundong na kaugnay ng kasunod na הַקּוֹל; ang “buong” ay idiomatikong nagpapahiwatig na ang lungsod bilang pamayanan ang umalingawngaw, hindi isang teknikal na pagdaragdag sa saklaw.
- source_word: הוּא הַקּוֹל אֲשֶׁר שְׁמַעְתֶּם
  choice: Iyon ang ingay na narinig ninyo
  rationale: Ang הוּא ay gumaganap na panturo, at ang קוֹל ay maaaring “tunog,” “ingay,” o “tinig.” Ang “ingay” ang pinakanatural dito dahil ipinaliliwanag ng nagsasalita ang malakas na kaguluhang narinig ng marami.
