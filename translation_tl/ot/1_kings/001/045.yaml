revisions:
- from: Pinahiran siya bilang hari sa Gihon nina Zadok na pari at Natan na propeta. Pagkatapos, umahon sila mula roon na nagagalak, at umugong sa ingay ang buong lungsod.[a] Iyon ang ingay na narinig ninyo.
  to: At pinahiran siyang hari sa Gihon ni Zadok na pari at ni Natan na propeta. Umahon sila mula roon na nagagalak, at nagkagulo ang lungsod.[a] Iyon ang tunog na narinig ninyo.
  rationale: Inayos ang unang sugnay upang mauna ang kilos at malinaw na maipahayag ang dalawang gumaganap, gaya ng daloy ng Hebreo. Inalis ang hindi kinakailangang “buong” at pinalitan ang redundant na “umugong sa ingay” ng natural na “nagkagulo,” habang pinananatili ng talababa ang saklaw ng leksikal na kahulugan. Pinalitan ang panghuling “ingay” ng mas malawak na “tunog,” na angkop sa קול at sa paliwanag ng naunang kaguluhan.
