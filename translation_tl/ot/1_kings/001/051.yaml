language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יֻּגַּ֤ד לִ/שְׁלֹמֹה֙ לֵ/אמֹ֔ר הִנֵּה֙ אֲדֹ֣נִיָּ֔הוּ יָרֵ֖א אֶת הַ/מֶּ֣לֶךְ שְׁלֹמֹ֑ה וְ֠/הִנֵּה אָחַ֞ז בְּ/קַרְנ֤וֹת הַ/מִּזְבֵּ֨חַ֙ לֵ/אמֹ֔ר יִשָּֽׁבַֽע לִ֤/י כַ/יּוֹם֙ הַ/מֶּ֣לֶךְ שְׁלֹמֹ֔ה אִם יָמִ֥ית אֶת עַבְדּ֖/וֹ בֶּ/חָֽרֶב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/051.yaml
  text: And it was reported to Solomon, saying, “Look, Adonijah fears King Solomon, and look, he has taken hold of the horns of the altar, saying, ‘Let King Solomon swear to me today that he will not put his servant to death with the sword.’”
translation:
  language: tl
  text: Ipinaalam kay Solomon, “Narito, natatakot si Adonias kay Haring Solomon. Narito, nakakapit siya sa mga sungay ng altar at nagsasabi, ‘Manumpa sa akin ngayon si Haring Solomon na hindi niya papatayin sa tabak ang kanyang lingkod.’”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֻּגַּד לִשְׁלֹמֹה
  choice: May nagbalita kay Solomon
  rationale: Natural na Filipino para sa Hebreong impersonal passive na ‘ipinaalam/iniulat kay Solomon,’ nang hindi nagdaragdag kung sino ang nagbalita.
- source_word: הִנֵּה
  choice: Tingnan mo
  rationale: Pinananatili ang dalawang marker ng pagkuha ng pansin sa Hebreo; sa ikalawang paglitaw, natural itong naipahihiwatig ng kasunod na pangungusap sa Filipino upang maiwasan ang mabigat na pag-uulit.
- source_word: יָרֵא אֶת הַמֶּלֶךְ שְׁלֹמֹה
  choice: natatakot si Adonias kay Haring Solomon
  rationale: Tuwirang ipinapahayag ang takot na nasa ירא at pinananatili ang titulong hari.
- source_word: קַרְנוֹת הַמִּזְבֵּחַ
  choice: mga sungay ng altar
  rationale: Pormal at kongkretong salin ng sinaunang bahagi ng altar; hindi ito pinapalitan ng paliwanag sa pangunahing teksto.
- source_word: יִשָּׁבַע לִי כַיּוֹם
  choice: Sumumpa sana sa akin ngayon
  rationale: Ang jussive na kahilingan ay likas na naipapahayag sa ‘sana’; ang כַיּוֹם ay inililipat bilang ‘ngayon’ ayon sa idiomatikong diwa.
- source_word: אִם יָמִית אֶת עַבְדּוֹ בֶּחָרֶב
  choice: na hindi niya papatayin sa tabak ang kanyang lingkod
  rationale: Sa pormula ng panunumpa, ang אִם ay may negatibong puwersa; pinananatili ang ikatlong-panauhang pagtukoy ni Adonias sa sarili bilang ‘kanyang lingkod’ at ang instrumentong ‘tabak.’
theological_decisions:
- issue: Kahulugan ng pagkapit sa mga sungay ng altar
  choice: Iniwan bilang kilos na isinalaysay lamang
  alternative: Ipaliwanag sa teksto bilang paghingi ng santuwaryo o legal na proteksiyon
  rationale: Hindi tahasang binibigyang-kahulugan ng talata ang kilos; ang pagpapaliwanag nito sa pangunahing teksto ay magdaragdag ng interpretasyon.
- issue: Puwersa ng אִם sa pormula ng panunumpa
  choice: Isinalin bilang ‘hindi niya papatayin’
  alternative: Literal na ‘kung papatayin niya’
  rationale: Sa Hebreong panunumpa, ang אִם sa ganitong sugnay ay karaniwang nagpapahayag ng mariing pagtanggi, kaya ang negatibong salin ang naghahatid ng aktuwal na kahilingan ni Adonias.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang tradisyonal at karaniwang anyong Tagalog na ‘Adonias,’ habang pinanatili ang ‘Solomon,’ ‘altar,’ at ‘tabak.’ Walang idinagdag na paliwanag na teolohikal o denominasyonal.
