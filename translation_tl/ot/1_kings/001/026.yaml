base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/026.yaml
  text: But me—your servant—and Zadok the priest[a], and Benaiah son of Jehoiada, and Solomon your servant, he did not call.
translation:
  language: tl
  text: Ngunit ako, ang inyong lingkod, si Zadok na pari, si Benaias na anak ni Joiada, at si Solomon, ang inyong lingkod, ay hindi niya inanyayahan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “hindi niya tinawag” o “hindi niya ipinatawag.” Ang pandiwang Hebreo ay maaaring tumukoy sa pagtawag, pagpapatawag, o pag-anyaya; ang “inanyayahan” ang pinakanababagay sa agarang konteksto ng handaan ni Adonias.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלִי אֲנִי עַבְדֶּךָ
  choice: Ngunit ako na lingkod ninyo
  rationale: Ang וְלִי ay nagpapakita ng pagtutol o paghahambing sa mga naunang inanyayahan, at ang אֲנִי עַבְדֶּךָ ay magalang at madiing pagtukoy sa sarili. Likas sa modernong Tagalog ang 'Ngunit ako na lingkod ninyo.'
- source_word: צָדֹק הַכֹּהֵן
  choice: si Zadok na pari
  rationale: Pinananatili ang pangalang pantangi at malinaw na isinasalin ang tiyak na katungkulan niyang pari.
- source_word: בְנָיָהוּ בֶן יְהוֹיָדָע
  choice: si Benaias na anak ni Joiada
  rationale: Ginamit ang nakaugaliang anyong Filipino ng mga pangalang biblikal at natural na anyo ng patronimiko.
- source_word: שְׁלֹמֹה עַבְדְּךָ
  choice: si Solomon na lingkod ninyo
  rationale: Pinananatili ang magalang na katawagang panghukuman at ang kaugnayan ni Solomon sa hari.
- source_word: לֹא קָרָא
  choice: hindi niya inanyayahan
  rationale: Bagaman maaaring mangahulugang 'tinawag' o 'ipinatawag' ang קרא, ang agarang konteksto ng handaan at paghahain ni Adonias ay pabor sa likas na saling 'inanyayahan.'
