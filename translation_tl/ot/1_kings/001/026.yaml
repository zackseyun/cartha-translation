translation_notes:
  register: Makabagong Filipino na marangal at madaling maunawaan. Ginamit ang magalang na panghalip na 'ninyo' sa pakikipag-usap sa hari, at pinanatili ang madiing pagkakauna ng mga hindi inanyayahan.
