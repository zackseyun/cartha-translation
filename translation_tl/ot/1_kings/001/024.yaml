  yaml_path: translation/ot/1_kings/001/024.yaml
  text: Then Nathan said[a], “My lord the king, have you said, ‘Adonijah will reign after me, and he will sit on my throne’?”
translation:
  language: tl
  text: Sinabi ni Natan, “Panginoon kong hari, sinabi po ba ninyo[a], ‘Maghahari si Adonias pagkatapos ko, at siya ang uupo sa aking trono’?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “sinabi po ba ninyo noon.” Ang perpektong anyo sa Hebreo ay maaaring tumukoy sa isang sinabi na nananatiling mahalaga sa kasalukuyan o sa isang natapos na pagsasalita noong nakaraan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Sinabi
  rationale: Isinusulong ng waw-consecutive ang salaysay. Likas sa modernong Filipino ang payak na “Sinabi” sa ganitong konteksto; malinaw na ang pagkakasunod mula sa daloy ng salaysay.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: Panginoon kong hari
  rationale: Pinananatili nito ang magalang na katawagan at ang titulong maharlika. Ang “kong” ay natural na katumbas ng unang panauhang panaglay sa Hebreo.
- source_word: אַתָּה אָמַרְתָּ
  choice: sinabi po ba ninyo
  rationale: Ang perpektong anyo ay gumaganap bilang tanong kung talagang ipinahayag ng hari ang pasyang ito. Ang “po” at “ninyo” ay likas na nagpapahayag ng paggalang sa modernong Filipino.
- source_word: אֲדֹנִיָּהוּ
  choice: Adonias
  rationale: Ginamit ang nakaugaliang anyo ng pangalang biblikal sa Filipino.
- source_word: יִמְלֹךְ
  choice: ang maghahari
  rationale: Tuwirang ipinapahayag ng pandiwa ang paghahari o pagiging hari, lalo na sa konteksto ng paghalili.
- source_word: אַחֲרָי
  choice: kasunod ko
  rationale: Malinaw nitong ipinahihiwatig ang paghalili nang hindi dinaragdagan ang maikling pahayag ng Hebreo.
- source_word: יֵשֵׁב עַל כִּסְאִי
  choice: siya ang uupo sa aking trono
  rationale: Pinananatili ang kongkretong larawan ng pag-upo sa trono at ang kahulugan nitong paghalili sa paghahari.
