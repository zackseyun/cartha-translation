translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “po” at maramihang panghalip na “ninyo” bilang likas na paggalang sa hari, habang pinanatili ang anyong tanong at ang bahagyang tensiyon kung ang tanong ni Natan ay humihingi ng kumpirmasyon.
