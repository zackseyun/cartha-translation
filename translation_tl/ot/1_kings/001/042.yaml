translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal ang himig. Ginamit ang “biglang” sa halip na literal na “narito” upang maipahayag nang malinaw ang pansin at pagkabigla na dala ng הִנֵּה. Inilipat ang talababa sa pariralang “taong may dangal,” na siyang aktuwal na salitang may leksikal na kalabuan.
