base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/042.yaml
  text: While he was still speaking[a], behold, Jonathan son of Abiathar the priest came. And Adonijah said, “Come in, for you are a worthy man and bring good news.”
translation:
  language: tl
  text: Habang nagsasalita pa siya, dumating si Jonatan, ang anak ng paring si Abiatar. Sinabi ni Adonias, “Tumuloy ka, sapagkat ikaw ay isang taong kagalang-galang[a] at magdadala ka ng mabuting balita.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “matapang na tao,” “taong may kakayahan,” o “taong may mataas na katayuan.” Ang pariralang Hebreo na אִישׁ חַיִל ay maaaring tumukoy sa tapang, kakayahan, o katayuan, depende sa konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: עוֹדֶנּוּ מְדַבֵּר
  choice: Habang nagsasalita pa siya
  rationale: Likas na salin ng idyomang Hebreo na nagsasaad na nagpapatuloy pa ang pagsasalita nang mangyari ang kasunod na pangyayari.
- source_word: וְהִנֵּה
  choice: biglang
  rationale: Ipinahahayag ng הִנֵּה ang isang kapansin-pansin at di-inaasahang pagdating; pinananatili ng “biglang” ang sigla ng salaysay sa natural na modernong Tagalog.
- source_word: יוֹנָתָן
  choice: Jonatan
  rationale: Karaniwang anyong Tagalog ng pangalang Hebreo.
- source_word: בֶּן אֶבְיָתָר הַכֹּהֵן
  choice: anak ng paring si Abiatar
  rationale: Malinaw na si Abiatar ang tinutukoy na pari, hindi si Jonatan.
- source_word: בָּא
  choice: dumating
  rationale: Tuwirang inilalahad ang pagdating ni Jonatan sa tagpo.
- source_word: בֹּא
  choice: Tumuloy ka
  rationale: Sa konteksto, inaanyayahan ni Adonias si Jonatan na pumasok o lumapit sa pagtitipon; natural sa Tagalog ang “Tumuloy ka.”
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala nito ang dahilan ng paanyaya at ang inaasahan ni Adonias tungkol sa mensahe ni Jonatan.
- source_word: אִישׁ חַיִל
  choice: isang taong may dangal
  rationale: Sinasalamin nito ang pagpapahalaga sa pagkatao o katayuan ni Jonatan nang hindi nililimitahan ang parirala sa tapang sa digmaan; inilalahad sa talababa ang tunay na lawak ng kahulugan.
- source_word: וְטוֹב תְּבַשֵּׂר
  choice: at mabuting balita ang ibabalita mo
  rationale: Pinananatili ang inaasahang pahayag ni Adonias na mabuti ang balitang ihahatid ni Jonatan, at ginagawang natural sa Tagalog ang pandiwang בשר.
