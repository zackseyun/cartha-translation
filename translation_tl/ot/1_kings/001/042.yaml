  terminology: Wasto at matatag ang mga pangalang Jonatan, Abiatar, at Adonias. Ang “paring si Abiatar” ay malinaw na si Abiatar, hindi si Jonatan, ang pari. Pinalitan ang pangunahing salin ng אִישׁ חַיִל ng “taong kagalang-galang” upang hindi ito labis na iugnay sa dangal bilang moral na katangian lamang.
