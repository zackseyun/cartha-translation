  to: Habang nagsasalita pa siya, dumating si Jonatan, ang anak ng paring si Abiatar. Sinabi ni Adonias, “Tumuloy ka, sapagkat ikaw ay isang taong kagalang-galang[a] at magdadala ka ng mabuting balita.”
