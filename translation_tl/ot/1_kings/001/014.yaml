  text: הִנֵּ֗ה עוֹדָ֛/ךְ מְדַבֶּ֥רֶת שָׁ֖ם עִם הַ/מֶּ֑לֶךְ וַ/אֲנִי֙ אָב֣וֹא אַחֲרַ֔יִ/ךְ וּ/מִלֵּאתִ֖י אֶת דְּבָרָֽיִ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/014.yaml
  text: Look[a], while you are still speaking there with the king, I will come in after you and confirm your words.
translation:
  language: tl
  text: Tingnan mo, habang nakikipag-usap ka pa roon sa hari, papasok ako kasunod mo at pagtitibayin ko ang mga sinabi mo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “bubuuin ko ang mga sinabi mo” o “daragdagan ko ang sasabihin mo.” Ang idyomang Hebreo ay maaaring mangahulugang magdagdag ng mga detalyeng nagpapatibay sa pahayag ng iba.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Tingnan mo
  rationale: Pantawag-pansin ito na nagbibigay-diin sa agarang pagkakasunod ng plano; natural sa makabagong Filipino nang hindi gumagamit ng makalumang anyo.
- source_word: עוֹדָךְ מְדַבֶּרֶת
  choice: habang nakikipag-usap ka pa
  rationale: Ipinahahayag ng pang-abay na may hulaping pambabae at ng participle ang patuloy na pagsasalita ni Batseba sa sandaling kikilos si Natan.
- source_word: שָׁם עִם הַמֶּלֶךְ
  choice: roon sa hari
  rationale: Pinananatili ang lokatibong שָׁם, samantalang ang pakikipag-usap 'sa hari' ang pinakanatural na pagpapahayag sa Filipino ng usapang nagaganap sa presensiya niya.
- source_word: וַאֲנִי אָבוֹא אַחֲרַיִךְ
  choice: papasok ako kasunod mo
  rationale: Sa tagpong nasa palasyo, ipinahihiwatig ng בוא ang pagpasok sa kinaroroonan ng hari; malinaw at natural ang 'papasok ... kasunod mo.'
- source_word: וּמִלֵּאתִי אֶת־דְּבָרָיִךְ
  choice: pagtitibayin ko ang mga sinabi mo
  rationale: Sa konteksto, ang idyoma ay tumutukoy sa pagdaragdag ng patunay o detalye upang pagtibayin ang pahayag ng iba, bagaman maaari rin itong unawaing 'bubuuin' o 'daragdagan.'
