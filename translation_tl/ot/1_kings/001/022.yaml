base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/022.yaml
  text: And behold[a], while she was still speaking with the king, Nathan the prophet came in.
translation:
  language: tl
  text: At narito[a], habang nakikipag-usap pa siya sa hari, pumasok ang propetang si Natan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “masdan.” Ang salitang Hebreo ay isang panandang pansalaysay na tumatawag ng pansin sa biglang pag-usad ng tagpo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: At narito
  rationale: Ginagawang lantad ang Hebreong panandang pansalaysay na humihila ng pansin sa bagong pangyayari, habang pinananatili ang marangal at pamilyar na himig sa Filipino.
- source_word: עוֹדֶנָּה מְדַבֶּרֶת
  choice: habang nakikipag-usap pa siya
  rationale: Ipinahahayag ng pang-abay na may hulaping pambabae at ng participle ang nagpapatuloy na kilos ni Batseba; natural na ipinakikita ng “habang ... pa” ang magkasabay na pangyayari.
- source_word: עִם הַמֶּלֶךְ
  choice: sa hari
  rationale: Bagaman literal na “kasama ng hari,” ang “nakikipag-usap ... sa hari” ang natural na Filipino para sa tuwirang pakikipag-usap at hindi nito inaalis ang diwa ng interaksiyon.
- source_word: וְנָתָן הַנָּבִיא
  choice: ang propetang si Natan
  rationale: Natural na ayos sa Filipino para sa pangalang may kasunod na tungkuling nagpapakilala rito.
- source_word: בָּא
  choice: pumasok
  rationale: Sa tagpong may pakikipagharap sa hari, ipinahihiwatig ng pandiwa ang pagdating ni Natan sa kinaroroonan nila; malinaw at maikli itong naipahahayag ng “pumasok.”
