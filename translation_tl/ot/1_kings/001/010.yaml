  text: But he did not invite Nathan the prophet[a], Benaiah, the mighty men, or Solomon his brother.
translation:
  language: tl
  text: Ngunit hindi niya inanyayahan si Natan, ang propeta,[a] si Benaya, ang magigiting na mandirigma, o ang kapatid niyang si Solomon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Ngunit hindi niya tinawag si Natan, ang propeta, si Benaya, ang magigiting na mandirigma, o ang kapatid niyang si Solomon.” Literal na nangangahulugang “tumawag” ang pandiwang Hebreo; dito, tumutukoy ito sa pag-anyaya o pagpapatawag sa handaan ni Adonias.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת
  choice: Ngunit
  rationale: Ipinagpapatuloy ng pang-ugnay ang talaan mula sa naunang talata, ngunit ang konteksto ay nagpapakita ng malinaw na pagsalungat sa mga inanyayahan ni Adonias sa talata 9 at sa mga hindi niya inanyayahan dito.
- source_word: נָתָן הַנָּבִיא
  choice: si Natan na propeta
  rationale: Likas sa makabagong Tagalog ang hulma na pangalan na sinusundan ng tungkulin; tuwirang isinasalin ang נָבִיא bilang “propeta.”
- source_word: וּבְנָיָהוּ
  choice: si Benaya
  rationale: Isinalin ang pangalang Hebreo ayon sa karaniwang anyong ginagamit sa Tagalog; ang pang-ugnay ay likas na isinama sa serye.
- source_word: הַגִּבּוֹרִים
  choice: ang magigiting na mandirigma
  rationale: Sa kontekstong maharlika at militar, tumutukoy ang גִּבּוֹרִים sa mga bantog o piling mandirigma ni David; pinananatili ng salin ang katapangan at papel nilang militar.
- source_word: שְׁלֹמֹה אָחִיו
  choice: ang kapatid niyang si Solomon
  rationale: Mas natural ito sa Tagalog kaysa mahigpit na pagsunod sa ayos ng Hebreo, habang malinaw na si Solomon ang kapatid ni Adonias.
- source_word: לֹא קָרָא
  choice: hindi niya inanyayahan
  rationale: Literal na “hindi tinawag,” ngunit sa konteksto ng handaan sa mga talata 9–10, ang kilos na tinutukoy ay pag-anyaya.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “magigiting na mandirigma” upang maging tiyak at madaling maunawaan ang pangkat militar, at ang “inanyayahan” bilang natural na kahulugan ng pandiwa sa konteksto ng handaan.
