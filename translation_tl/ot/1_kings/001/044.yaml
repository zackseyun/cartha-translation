revisions:
- from: Isinugo ng hari na kasama niya si Zadok na pari, si Natan na propeta, si Benaya na anak ni Jehoiada, at ang mga Kereteo at Peleteo. Pinasakay nila siya sa mola ng hari.[a]
  to: At isinugo ng hari, kasama niya, sina Zadok na pari, Natan na propeta, Benaya na anak ni Jehoiada, at ang mga Kereteo at Peleteo. Pinasakay nila siya sa mola ng hari.[a]
  rationale: Inayos lamang ang sintaks upang malinaw na ang hari ang nagsugo sa lahat ng nakalistang tao kasama ng tinutukoy na “siya,” at ginawang “sina” ang pantukoy para sa magkakasunod na personal na pangalan. Idinagdag ang “At” upang katawanin ang pang-ugnay na waw sa salaysay. Pinanatili ang kahulugan, mga pangalan, mga titulo, at talababa.
