translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “si” sa mga personal na pangalan at “ang mga” sa dalawang pangkat. Hinati sa dalawang pangungusap upang maging madaling basahin nang hindi binabago ang pagkakasunod-sunod ng salaysay.
