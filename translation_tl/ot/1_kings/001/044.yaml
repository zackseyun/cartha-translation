base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/044.yaml
  text: And the king sent with him Zadok the priest[a], Nathan the prophet, Benaiah son of Jehoiada, and the Cherethites and the Pelethites; and they mounted him on the king’s mule.
translation:
  language: tl
  text: At isinugo ng hari, kasama niya, sina Zadok na pari, Natan na propeta, Benaya na anak ni Jehoiada, at ang mga Kereteo at Peleteo. Pinasakay nila siya sa mola ng hari.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas tiyak, “sa babaeng mola ng hari.” Maaaring tumukoy ang pangngalang Hebreo sa isang babaeng mola.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח אִתּוֹ הַמֶּלֶךְ
  choice: Isinugo ng hari na kasama niya
  rationale: Pinananatili nito ang karaniwang salaysay na diwa ng שׁלח at ang accompaniment na ipinahahayag ng אִתּוֹ, sa natural na ayos ng pangungusap sa Filipino.
- source_word: צָדוֹק הַכֹּהֵן
  choice: si Zadok na pari
  rationale: Isinasalin ang appositional na titulo bilang natural na pariralang Filipino habang pinananatili ang pangalan.
- source_word: נָתָן הַנָּבִיא
  choice: si Natan na propeta
  rationale: Direktang isinasalin ang נָבִיא bilang “propeta” at ginagamit ang anyong “Natan,” na malapit sa Hebreo.
- source_word: בְּנָיָהוּ בֶּן יְהוֹיָדָע
  choice: si Benaya na anak ni Jehoiada
  rationale: Natural na Filipino ang “anak ni” para sa patronimikong Hebreo; ang mga pangalan ay inililipat sa madaling basahing anyo.
- source_word: הַכְּרֵתִי וְהַפְּלֵתִי
  choice: ang mga Kereteo at Peleteo
  rationale: Mga katawagan ito sa mga pangkat, kaya isinalin bilang mga pangalang pantangi sa halip na bigyan ng mapagpalagay na paliwanag; ipinahahayag ng “mga” ang kolektibong kahulugan.
- source_word: וַיַּרְכִּבוּ אֹתוֹ
  choice: Pinasakay nila siya
  rationale: Malinaw na ipinahahayag ng “pinasakay” ang causative na Hiphil ng רכב at natural ito sa makabagong Filipino.
- source_word: עַל פִּרְדַּת הַמֶּלֶךְ
  choice: sa mola ng hari
  rationale: Ang “mola” ang karaniwang salin para sa mule. Hindi itinampok sa pangunahing teksto ang kasarian ng hayop, ngunit inilagay ang mas tiyak na posibilidad sa talababa.
