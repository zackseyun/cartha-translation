  text: And when my lord the king lies down with his fathers[a], I and my son Solomon will be counted as offenders.
translation:
  language: tl
  text: At kapag nahimlay na ang panginoon kong hari kasama ng kanyang mga ninuno, ako at ang anak kong si Solomon ay ituturing na mga maysala.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga makasalanan.” Ang salitang Hebreo ay maaaring tumukoy sa mga itinuturing na maysala o mananagot; sa kontekstong ito, malamang na katayuang legal at pampolitika ang tinutukoy sa halip na pangkalahatang paglalarawan sa moralidad.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: At mangyayari
  rationale: Pinananatili ang panandang Hebreo sa magiging bunga ng sitwasyon, habang nananatiling natural sa marangal na salaysay.
- source_word: כִּשְׁכַב
  choice: kapag nahimlay na
  rationale: Ang שׁכב kasama ng pariralang tungkol sa mga ninuno ay isang idyoma para sa pagkamatay. Ipinahihiwatig ng “nahimlay” ang kamatayan nang hindi lubusang inaalis ang larawang Hebreo.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: ang panginoon kong hari
  rationale: Nagpapahayag ito ng magalang at mapagpakumbabang pananalita ni Batseba sa hari; natural din ito sa modernong Filipino.
- source_word: עִם אֲבֹתָיו
  choice: kasama ng kanyang mga ninuno
  rationale: Inihahatid ang idyomang tumutukoy sa pagsama sa mga namatay na nauna sa kanya. Mas malinaw sa Filipino ang “mga ninuno” kaysa literal na “mga ama.”
- source_word: וְהָיִיתִי אֲנִי
  choice: ako ... ay ituturing
  rationale: Ginagawang hayag ang ipinahihiwatig na katayuang ibibintang o ipapalagay sa kanila sa kontekstong pampolitika at legal.
- source_word: וּבְנִי שְׁלֹמֹה
  choice: at ang anak kong si Solomon
  rationale: Natural na ayos sa Filipino na nagpapanatili sa ugnayang mag-ina at sa pangalan.
- source_word: חַטָּאִים
  choice: mga nagkasala
  rationale: Pinananatili ang pangunahing diwa ng חטא bilang pagiging may sala, ngunit hindi ito nililimitahan sa pangkalahatang moral na “makasalanan.” Sa konteksto, maaari itong tumukoy sa mga ituturing na maysala o mananagot sa bagong pamahalaan.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “nahimlay” upang mapanatili ang idyomatikong larawan ng kamatayan, at “panginoon kong hari” upang ihatid ang magalang na pananalita sa korte. Ang talababa ay nagpapanatili sa saklaw at tensiyon ng חַטָּאִים.
