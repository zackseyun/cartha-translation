  text: וַ/יִּשָּׁבַ֥ע הַ/מֶּ֖לֶךְ וַ/יֹּאמַ֑ר חַי יְהוָ֕ה אֲשֶׁר פָּדָ֥ה אֶת נַפְשִׁ֖/י מִ/כָּל צָרָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/029.yaml
  text: And the king swore and said[a], “As Yahweh lives, who has redeemed my life from every distress,”
translation:
  language: tl
  text: At sumumpa ang hari at sinabi, “Buhay si Yahweh, na siyang tumubos sa aking buhay[a] mula sa bawat kagipitan,”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa sarili ko” o “sa kaluluwa ko.” Maaaring mangahulugan ang Hebreong nefesh ng buhay, sarili, o kaluluwa; dito, pinakamalamang na tumutukoy ito sa buhay ni David na iniligtas mula sa panganib.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׁבַע
  choice: sumumpa
  rationale: Tuwirang ipinahahayag ng Niphal ng שׁבע ang panunumpa; natural at maikli ang “sumumpa” sa salaysay.
- source_word: הַמֶּלֶךְ
  choice: ang hari
  rationale: Pinananatili ang tiyak na titulong ginamit sa Hebreo sa halip na palitan ito ng pangalang David.
- source_word: וַיֹּאמַר
  choice: at sinabi
  rationale: Karaniwang panimulang pahayag sa salaysay; hindi dinaragdagan ng diin na wala sa אמר.
- source_word: חַי יְהוָה
  choice: Buhay si Yahweh
  rationale: Pinananatili ang anyo ng karaniwang pormula ng panunumpa sa Hebreo at gumagamit ng natural na pahayag sa Filipino.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin ang Tetragrammaton bilang personal na pangalang Yahweh, hindi bilang titulong “Panginoon.”
- source_word: אֲשֶׁר
  choice: na siyang
  rationale: Malinaw na iniuugnay ang kasunod na ginawa kay Yahweh bilang personal na tinutukoy.
- source_word: פָּדָה
  choice: tumubos
  rationale: Pinananatili ang diwa ng pagtubos o pagliligtas sa pamamagitan ng mapagpalayang pagkilos, sa halip na patagin ito bilang “nagligtas” lamang.
- source_word: נַפְשִׁי
  choice: sa buhay ko
  rationale: Sa konteksto ng pagkaligtas mula sa panganib, ang נֶפֶשׁ ay tumutukoy sa buhay o mismong sarili ni David, hindi kinakailangang sa hiwalay na di-materyal na kaluluwa.
- source_word: מִכָּל צָרָה
  choice: mula sa bawat kagipitan
  rationale: Ang “kagipitan” ay natural na tumutukoy sa sari-saring panganib at matinding suliranin; ipinananatili ng “bawat” ang malawak na saklaw ng כָּל.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo; ang “Yahweh” ay mas tuwirang transliterasyon at hindi pinapalitan ang pangalan ng isang titulo.
- issue: Kahulugan ng נַפְשִׁי sa kontekstong ito
  choice: sa buhay ko
  alternative: sa kaluluwa ko o sa sarili ko
  rationale: Ang tinutukoy ay ang buhay ni David na iningatan sa mga panganib. Iniiwasan nito ang pagpasok ng mas huling dualistikong kahulugan na hindi hinihingi ng konteksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang pormula ng panunumpa at ang kuwit sa hulihan dahil nagpapatuloy ang pangungusap sa kasunod na talata.
