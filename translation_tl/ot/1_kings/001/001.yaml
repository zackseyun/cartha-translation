  text: King David was old[a], advanced in days; and they covered him with garments, but he could not get warm.
translation:
  language: tl
  text: Si Haring David ay matanda na[a], malayo na ang narating sa edad; tinakpan nila siya ng mga kasuotan, ngunit hindi siya uminit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “dumating sa mga araw,” isang idyoma na nangangahulugang lubhang matanda na o malayo na ang narating sa edad.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/הַ/מֶּלֶךְ דָּוִד
  choice: Si Haring David
  rationale: Likas na ayos sa modernong Tagalog para sa tiyak na titulong sinusundan ng pangalang pantangi. Hindi ginawang hiwalay na “At” ang panimulang וְ sapagkat nagsisilbi itong pang-ugnay sa salaysay.
- source_word: זָקֵן
  choice: ay matanda na
  rationale: Direkta at natural na paglalarawan sa kalagayan ni David sa katandaan.
- source_word: בָּא בַּ/יָּמִים
  choice: may edad na
  rationale: Ang literal na idyomang “dumating sa mga araw” ay tumutukoy sa pagiging lubhang matanda o malayo na sa edad. Pinananatili ito bilang ikalawang paglalarawan nang hindi gumagamit ng salitang makaluma.
- source_word: וַ/יְכַסֻּ/הוּ
  choice: at tinatakpan nila siya
  rationale: Pinananatili ang di-tiyak na maramihang gumagawa at ang payak na pagkakasunod ng mga sugnay, nang hindi nagdaragdag ng tahasang konsesibong diwa.
- source_word: בַּ/בְּגָדִים
  choice: ng mga kasuotan
  rationale: Ang בְּגָדִים ay karaniwang nangangahulugang mga damit o kasuotan; hindi ito ginawang “mga kumot,” na magiging mas interpretatibo.
- source_word: וְ/לֹא יִחַם ל/וֹ
  choice: ngunit hindi siya mainitan
  rationale: Natural na Tagalog para sa hindi niya pag-init sa kabila ng pagtatakip. Ang “mainitan” ay nagpapahayag ng hindi pagkamit ng init nang hindi tinutukoy kung sino ang nagpapainit.
