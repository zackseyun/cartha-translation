  to: Si Haring David ay matanda na[a], malayo na ang narating sa edad; tinakpan nila siya ng mga kasuotan, ngunit hindi siya uminit.
  rationale: Pinalitan ang “may edad na” ng isang modernong Filipino na mas malinaw na nagpapahayag ng idyoma para sa napakatandang edad. Pinalitan din ang “hindi siya mainitan” ng “hindi siya uminit” upang maipahayag nang natural ang kabiguang magkaroon ng init, nang hindi nagdaragdag ng tiyak na ahente. Pinanatili ang di-tiyak na maramihang “nila,” ang “mga kasuotan,” at ang payak na pagkakasunod ng salaysay.
