translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang pag-uulit tungkol sa katandaan bilang katangian ng tekstong Hebreo, at iniwasan ang “kumot” dahil “mga kasuotan” ang mas tuwirang kahulugan.
