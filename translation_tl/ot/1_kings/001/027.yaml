id: 1KI.1.27
reference: 1 Kings 1:27
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: אִ֗ם מֵ/אֵת֙ אֲדֹנִ֣/י הַ/מֶּ֔לֶךְ נִהְיָ֖ה הַ/דָּבָ֣ר הַ/זֶּ֑ה וְ/לֹ֤א הוֹדַ֨עְתָּ֙ אֶֽת עבדי/ך מִ֗י יֵשֵׁ֛ב עַל כִּסֵּ֥א אֲדֹנִֽ/י הַ/מֶּ֖לֶךְ אַחֲרָֽי/ו־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/027.yaml
  text: If this thing has come from my lord the king[a], have you not made known to your servants who will sit on the throne of my lord the king after him?
translation:
  language: tl
  text: Kung ang bagay na ito[a] ay nagmula sa aking panginoong hari, hindi mo ba ipinaalam sa iyong mga lingkod kung sino ang uupo sa trono ng aking panginoong hari pagkatapos niya?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “usaping ito” o “pangyayaring ito.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Kung
  rationale: Pinananatili ang anyong kondisyonal ng Hebreo habang hinahayaan ang buong pangungusap na magtaglay ng retorikal na tanong.
- source_word: מֵאֵת ... נִהְיָה
  choice: ay nagmula sa
  rationale: Ipinahahayag ang pinagmulan o pahintulot ng pasiya nang hindi nililinaw nang higit sa sinasabi ng Hebreo.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: aking panginoong hari
  rationale: Likas at magalang na pananalita sa harap ng hari, na pinananatili ang titulong mapagpakumbaba.
- source_word: הַדָּבָר הַזֶּה
  choice: ang bagay na ito
  rationale: Malawak ang saklaw ng דָּבָר; ang 'bagay' ay hindi labis na nagpapakahulugan kung ito ay pasiya, usapin, o pangyayari.
- source_word: וְלֹא הוֹדַעְתָּ
  choice: hindi mo ba ipinaalam
  rationale: Ang Hiphil ng ידע ay nangangahulugang magbigay-alam; ang 'ba' ay malinaw na naghahatid ng retorikal na tanong sa natural na Tagalog.
- source_word: עֲבָדֶיךָ
  choice: iyong mga lingkod
  rationale: Sa konteksto ng palasyo, ito ay magalang na pagtukoy sa mga opisyal na nasa ilalim ng hari, hindi pagdidiin sa kalagayang alipin.
- source_word: מִי יֵשֵׁב עַל כִּסֵּא
  choice: kung sino ang uupo sa trono
  rationale: Pinananatili ang tahasang larawan ng pag-upo sa trono sa halip na palitan ito ng mas interpretibong 'maghahari.'
- source_word: אַחֲרָיו
  choice: pagkatapos niya
  rationale: Tuwirang inilalahad ang pagkakasunod matapos ang kasalukuyang hari nang hindi pinapalitan ng mas interpretibong 'bilang kahalili niya.'
theological_decisions:
- issue: Kahulugan ng עבד sa magalang na pananalita sa palasyo
  choice: iyong mga lingkod
  alternative: iyong mga alipin
  rationale: Dito, ang salita ay karaniwang katawagan ng pagpapakumbaba ng mga opisyal sa hari; hindi pangunahing paksa ang legal o panlipunang kalagayan ng pagkaalipin.
- issue: Kondisyonal o retorikal na puwersa ng אִם
  choice: Kung ... hindi mo ba
  alternative: Nagmula ba ... at hindi mo ipinaalam
  rationale: Pinananatili ng napiling anyo ang kondisyonal na pananda sa Hebreo at kasabay nito ang matalim na retorikal na tanong, nang hindi tiyak na nilulutas ang ugnayan ng dalawang sugnay.
translation_notes:
  register: Makabago ngunit marangal na Filipino, na angkop sa magalang na pananalita sa korte. Ginamit ang 'panginoong hari' upang mapanatili ang paulit-ulit na titulong Hebreo, at hindi pinakinis ang pag-uulit na ito dahil mahalaga ito sa himig ng paggalang.
