  yaml_path: translation/ot/1_kings/001/023.yaml
  text: And they told the king, saying, “Look, Nathan the prophet is here.” And he came before the king and bowed down to the king with his face to the ground.
translation:
  language: tl
  text: At iniulat nila sa hari, “Narito po si Natan na propeta.” Humarap siya sa hari at nagpatirapa sa hari nang nakasubsob ang mukha sa lupa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּגִּידוּ
  choice: iniulat nila
  rationale: Ipinahahayag ang pag-uulat o pagsasabi sa hari sa natural at marangal na Filipino.
- source_word: הִנֵּה
  choice: Narito po
  rationale: Ang “narito” ay tuwirang nagpapahiwatig ng pagdating o presensiya ni Natan; idinagdag ang “po” bilang likas na paggalang sa hari.
- source_word: נָתָן הַנָּבִיא
  choice: si propeta Natan
  rationale: Natural na ayos sa modernong Filipino habang pinananatili ang titulo at pangalang Hebreo.
- source_word: וַיִּשְׁתַּחוּ
  choice: yumukod
  rationale: Tumutukoy sa kilos ng malalim na pagyukod bilang paggalang sa hari, na nililinaw ng kasunod na parirala.
- source_word: עַל־אַפָּיו אָרְצָה
  choice: na ang mukha niya ay nakasubsob sa lupa
  rationale: Pinananatili ang kongkretong larawan ng mukha na nakaharap at nakadikit o halos nakadikit sa lupa.
