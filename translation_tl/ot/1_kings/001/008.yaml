translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “pumanig” upang natural na ihayag ang pampolitikang diwa ng “kasama,” habang iniingatan sa talababa ang literal at bahagyang maluwag na ugnayan ng mga magigiting na tauhan kay David.
