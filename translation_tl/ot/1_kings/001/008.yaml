base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/008.yaml
  text: But Zadok the priest[a], Benaiah son of Jehoiada, Nathan the prophet, Shimei, Rei, and the mighty men who belonged to David were not with Adonijah.
translation:
  language: tl
  text: Ngunit si Zadok na pari, si Benaias na anak ni Joiada, si Natan na propeta, si Simei, si Rei, at ang mga magigiting na tauhan ni David[a] ay hindi kasama ni Adonias.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “ang mga mandirigma ni David.” Sa literal, “ang mga magigiting na tao na kay David.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְצָדוֹק הַכֹּהֵן
  choice: Ngunit si Zadok na pari
  rationale: Ang וְ ay may diwang pasalungat sa naunang talaan ng mga kumampi kay Adonias, kaya natural ang “Ngunit.” Pinananatili ng “pari” ang katungkulan ni Zadok.
- source_word: וּבְנָיָהוּ בֶן־יְהוֹיָדָע
  choice: si Benaias na anak ni Joiada
  rationale: Isinalin nang tuwiran ang patronimikong pariralang בֶן־ bilang “anak ni,” at ginamit ang mga anyo ng pangalang madaling makilala sa tradisyong Filipino.
- source_word: וְנָתָן הַנָּבִיא
  choice: si Natan na propeta
  rationale: Pinananatili ang appositional na titulo ni Natan; ang “propeta” ang karaniwan at tumpak na katumbas ng נָבִיא.
- source_word: וְשִׁמְעִי וְרֵעִי
  choice: si Simei, si Rei
  rationale: Mga pangalang pantangi ang dalawa. Gumamit ng kuwit sa modernong talaan sa halip na ulitin ang pangatnig sa bawat pangalan.
- source_word: וְהַגִּבּוֹרִים אֲשֶׁר לְדָוִד
  choice: at ang magigiting na tauhang kay David[a]
  rationale: Ang גִּבּוֹרִים ay tumutukoy sa magigiting o makapangyarihang mandirigma. Ang “mga tauhang kay David” ay nagpapanatili sa maluwag na ugnayang ipinahahayag ng אֲשֶׁר לְדָוִד nang hindi ito labis na nililinaw bilang pag-aari lamang.
- source_word: לֹא הָיוּ עִם אֲדֹנִיָּהוּ
  choice: ay hindi pumanig kay Adonias
  rationale: Literal itong “hindi kasama ni Adonias,” ngunit sa konteksto ng tunggaliang pampolitika, malinaw na tumutukoy ang עִם sa pagsuporta o pagpanig. Ang “hindi pumanig” ay natural sa Filipino at pinananatili ang kontekstuwal na diwa.
