- from: Ngunit si Zadok na pari, si Benaias na anak ni Joiada, si Natan na propeta, si Simei, si Rei, at ang magigiting na tauhang kay David[a] ay hindi pumanig kay Adonias.
  to: Ngunit si Zadok na pari, si Benaias na anak ni Joiada, si Natan na propeta, si Simei, si Rei, at ang mga magigiting na tauhan ni David[a] ay hindi kasama ni Adonias.
  rationale: Inayos ang pariralang tumutukoy sa mga magigiting na tauhan upang maging natural na Filipino at malinaw na pangmaramihan. Pinalitan ang mas matibay na interpretasyong “hindi pumanig” ng “hindi kasama” upang mapanatili ang literal na pagpipigil at ang lawak ng Hebreong עִם sa orihinal.
