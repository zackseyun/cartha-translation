- from: Kung paanong si Yahweh ay kasama ng aking panginoong hari, gayon din nawa siya makasama ni Solomon[a] at gawin niyang higit na dakila ang trono nito kaysa sa trono ng aking panginoong Haring David.
  to: Kung paanong si Yahweh ay kasama ng aking panginoong hari, nawa’y makasama rin niya si Solomon[a] at gawin niyang higit na dakila ang kanyang trono kaysa sa trono ng aking panginoon, si Haring David.
  rationale: Ginawang mas natural ang mga panghalip at ang pagtukoy kay David nang hindi binabago ang kahulugan, ang paggalang sa pananalita sa korte, o ang implicit na simuno ng Hebreong jussive. Ang talababa ay iniayon sa binagong pangungusap at nananatiling tapat sa obserbasyong panggramatika.
