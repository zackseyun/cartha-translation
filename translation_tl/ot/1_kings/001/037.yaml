  text: כַּ/אֲשֶׁ֨ר הָיָ֤ה יְהוָה֙ עִם אֲדֹנִ֣/י הַ/מֶּ֔לֶךְ כֵּ֖ן יהי עִם שְׁלֹמֹ֑ה וִֽ/יגַדֵּל֙ אֶת כִּסְא֔/וֹ מִ֨/כִּסֵּ֔א אֲדֹנִ֖/י הַ/מֶּ֥לֶךְ דָּוִֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/037.yaml
  text: Just as Yahweh has been with my lord the king[a], so may he be with Solomon and make his throne greater than the throne of my lord King David.
translation:
  language: tl
  text: Kung paanong si Yahweh ay kasama ng aking panginoong hari, nawa’y makasama rin niya si Solomon[a] at gawin niyang higit na dakila ang kanyang trono kaysa sa trono ng aking panginoon, si Haring David.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nawa’y si Yahweh ay makasama rin ni Solomon.” Hindi tahasang binanggit sa Hebreo ang simuno ng “nawa’y ... makasama”; tumutukoy ito pabalik kay Yahweh sa naunang sugnay.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang transliterasyon ng personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
- source_word: כַּאֲשֶׁר ... כֵּן
  choice: Kung paanong ... gayon din
  rationale: Pinananatili nito ang paghahambing sa pagitan ng pagsama ni Yahweh kay David at ng kahilingan para kay Solomon, sa natural na Filipino.
- source_word: הָיָה ... עִם
  choice: ay kasama
  rationale: Ipinahahayag nito ang banal na pagsama kay David nang hindi ipinipilit sa Filipino ang aspektong temporal na hindi kailangang tahasang tukuyin sa konteksto.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: aking panginoong hari
  rationale: Pinananatili ang magalang na pormula sa korte at ang titulong maharlika.
- source_word: יהי
  choice: nawa siya makasama
  rationale: Ang jussive ay isang kahilingan o pagpapala; pinananatiling pahiwatig ang simuno na tumutukoy kay Yahweh.
- source_word: וִיגַדֵּל
  choice: at gawin niyang higit na dakila
  rationale: Isinasalin ang causative na diwa ng גדל at ang paghahambing na nililikha ng kasunod na מִן.
- source_word: כִּסְאוֹ
  choice: ang trono nito
  rationale: Pinananatili ang kongkretong larawan ng trono; ang “nito” ay malinaw na tumutukoy kay Solomon at umiiwas sa sunod-sunod na malabong panghalip.
- source_word: מִכִּסֵּא
  choice: kaysa sa trono ng
  rationale: Tahasan at likas na ipinahahayag sa Filipino ang paghahambing na minamarkahan ng מִן.
- source_word: אֲדֹנִי הַמֶּלֶךְ דָּוִד
  choice: aking panginoong Haring David
  rationale: Likas sa Filipino ang “Haring David,” habang pinananatili ng “aking panginoon” ang paggalang ng nagsasalita.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Tuwirang ginagamit ng tekstong Hebreo ang Tetragrammaton; pinananatili ang personal na pangalan sa transliterasyong Yahweh.
- issue: Hindi tahasang simuno ng יהי
  choice: Pinanatili bilang panghalip na “siya,” na tumutukoy pabalik kay Yahweh
  alternative: Ulitin nang tahasan ang “Yahweh” sa ikalawang sugnay
  rationale: Pinananatili nito ang daloy at bahagyang pagiging implicit ng Hebreo nang hindi nilulutas nang labis ang estruktura; ipinaliliwanag sa talababa ang reperensiya.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang pormal na pananalita sa korte, ang paralelismong “kung paanong ... gayon din,” at ang kongkretong larawan ng trono.
