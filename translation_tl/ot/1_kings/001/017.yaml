base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/017.yaml
  text: She said to him, “My lord, you swore by the LORD your God to your female servant, ‘Surely Solomon your son will reign after me, and he will sit on my throne.’”
translation:
  language: tl
  text: Sinabi niya sa kanya, “Panginoon ko, ikaw mismo ang sumumpa sa PANGINOON[a] mong Diyos sa iyong lingkod na babae, ‘Tiyak na ang anak mong si Solomon ang maghahari kasunod ko, at siya ang uupo sa aking trono.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, YHWH, ang personal na pangalan ng Diyos, na karaniwang isinasaling PANGINOON.
    reason: Nililinaw ang nasa pinagmulang teksto nang hindi ginagawang di-pamilyar ang pangunahing salin.
lexical_decisions:
- source_word: אֲדֹנִי
  choice: Panginoon ko
  rationale: Magalang na pantawag kay Haring David; pinananatili ang pagkakaiba nito sa banal na pangalang YHWH.
- source_word: אַתָּה
  choice: ikaw mismo
  rationale: Ang hayag na panghalip ay nagbibigay-diin sa taong sumumpa.
- source_word: נִשְׁבַּעְתָּ בַּיהוָה
  choice: sumumpa sa pangalan ng PANGINOON
  rationale: Likas na Filipino para sa panunumpang ginagawang saksi o garantiya si YHWH; ang ‘sa pangalan ng’ ay nagpapalinaw sa idyomang Hebreo nang hindi binabago ang diwa.
- source_word: אֲמָתֶךָ
  choice: iyong lingkod na babae
  rationale: Pinananatili ang pambabaeng anyo ng mapagpakumbabang tawag ni Batseba sa sarili.
- source_word: כִּי
  choice: Tiyak na
  rationale: Sa loob ng siniping panunumpa, ipinahahayag nito ang katiyakan ng ipinangako, bagaman maaari rin itong unawain bilang panandang ‘na’ sa nilalaman ng sumpa.
- source_word: יִמְלֹךְ אַחֲרָי
  choice: maghahari kasunod ko
  rationale: Tuwirang inilalarawan ang paghalili kay David sa paghahari.
- source_word: יֵשֵׁב עַל־כִּסְאִי
  choice: uupo sa aking trono
  rationale: Pinananatili ang konkretong larawan ng pag-upo sa trono bilang paghahari.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יהוה
  choice: PANGINOON na may talababa
  alternative: Yahweh
  rationale: Sinusunod ang pamilyar na tradisyon ng pagsasaling PANGINOON habang hayagang ipinababatid sa talababa na personal na banal na pangalan ang nasa tekstong Hebreo.
- issue: Lakas ng כִּי sa siniping sumpa
  choice: Tiyak na
  alternative: na
  rationale: Ang konteksto ng taimtim na panunumpa ay nagpapahintulot sa mariing pagbasa, ngunit kinikilala sa leksikal na tala ang mas payak na pagbasa bilang pananda sa nilalaman.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘Panginoon ko’ bilang magalang na tawag sa hari at ang all-caps na ‘PANGINOON’ para malinaw na maiba ang banal na pangalan.
