  source_fidelity: Ang pangunahing diwa ay tapat sa Hebreo. Gayunman, ang בַּיהוָה ay tuwirang “sa/pamamagitan ng PANGINOON,” hindi “sa pangalan ng PANGINOON.” Ang dagdag na “pangalan ng” ay isang pagpapaliwanag na wala sa teksto at hindi kailangan upang maging natural sa Filipino.
  naturalness: Marangal at malinaw ang rehistro. Mas tuwiran at likas sa makabagong Filipino ang “sumumpa sa PANGINOON mong Diyos” kaysa “sumumpa sa pangalan ng PANGINOON mong Diyos.” Ang “ikaw mismo” ay katanggap-tanggap na paglalapat ng hayag na panghalip na nagbibigay-diin.
  terminology: Wasto ang “Panginoon ko” para sa אֲדֹנִי at ang “PANGINOON” na may talababa para sa YHWH. Wasto rin ang “lingkod na babae,” “maghahari,” at “trono.”
