  source_fidelity: 'Tumpak ang pangunahing diwa: ang kausap na maramihan ay inuutusang umahon kasunod ni Solomon; siya ay darating, uupo sa trono ni David, maghahari bilang kahalili niya, at itinalaga upang maging pinuno ng Israel at Juda. Gayunman, mas tuwiran at pangkalahatan ang “umakyat” para sa וַעֲלִיתֶם kaysa “umahon,” na mas madalas magpahiwatig ng pag-ahon mula sa tubig o isang mababang kinalalagyan.'
  naturalness: Marangal at malinaw ang karamihan ng salin. Ang “Pagkatapos ay umahon kayong kasunod niya” ay medyo hindi natural sa modernong Filipino; mas maayos ang “Pagkatapos, umakyat kayo kasunod niya.”
  terminology: Ang “trono,” “maghahari,” “kahalili,” at “pinuno” ay angkop. Napananatili ng “pinuno” ang pagkakaiba ng נָגִיד mula sa pandiwang מלך. Ang talababa ay wastong nagsasaad ng leksikal na alternatibo para sa צִוִּיתִי at נָגִיד.
