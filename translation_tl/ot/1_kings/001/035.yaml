source:
  edition: WLC
  text: וַ/עֲלִיתֶ֣ם אַחֲרָ֗י/ו וּ/בָא֙ וְ/יָשַׁ֣ב עַל כִּסְאִ֔/י וְ/ה֥וּא יִמְלֹ֖ךְ תַּחְתָּ֑/י וְ/אֹת֤/וֹ צִוִּ֨יתִי֙ לִֽ/הְי֣וֹת נָגִ֔יד עַל יִשְׂרָאֵ֖ל וְ/עַל יְהוּדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/035.yaml
  text: Then you shall go up after him[a], and he shall come and sit on my throne, and he shall reign in my place; and I have appointed him to be ruler over Israel and over Judah.
translation:
  language: tl
  text: Pagkatapos, umakyat kayo kasunod niya. Darating siya at uupo sa aking trono, at siya ang maghahari bilang kahalili ko. Siya ang itinalaga ko[a] na maging pinuno ng Israel at ng Juda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Siya ang inutusan kong maging prinsipe [o pinuno] ng Israel at ng Juda.” Madalas mangahulugang “mag-utos” ang pandiwang Hebreo, at maaari ring isaling “prinsipe” o “pinuno” ang נָגִיד (nagid).
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲלִיתֶם
  choice: umahon kayo
  rationale: Karaniwang nangangahulugang ‘umahon’ o ‘pumaitaas’ ang עלה. Pinananatili ng salin ang direksiyonal na diwa ng prusisyon nang hindi idinaragdag ang ideya ng pag-eeskort.
- source_word: אַחֲרָיו
  choice: kasunod niya
  rationale: Tumutukoy ang parirala sa pagsunod sa kanya sa prusisyon. Natural sa modernong Tagalog ang ‘kasunod niya’ at malinaw ang ayos ng pangyayari.
- source_word: וּבָא
  choice: darating siya
  rationale: 'Malawak ang saklaw ng בוא: ‘dumating,’ ‘pumarito,’ o ‘pumasok.’ Ang ‘darating’ ang pinakahindi mapagpasiyang salin bago banggitin ang pag-upo sa trono.'
- source_word: וְיָשַׁב עַל כִּסְאִי
  choice: uupo sa aking trono
  rationale: Karaniwang pananalita ito para sa pagluklok. Malinaw at marangal sa Tagalog ang ‘uupo sa aking trono.’
- source_word: וְהוּא יִמְלֹךְ תַּחְתָּי
  choice: siya ang maghahari bilang kahalili ko
  rationale: Ipinapahiwatig dito ng תַּחְתָּי ang paghalili o pagkuha sa tungkulin ng nagsasalita. Ipinapahayag ng ‘bilang kahalili ko’ ang paghalili sa paghahari nang hindi ito ginagawang simpleng temporal na ‘pagkatapos ko.’
- source_word: צִוִּיתִי
  choice: itinalaga ko
  rationale: Madalas mang mangahulugang ‘inutusan’ ang צוה, sa kontekstong ito ang pahayag ni David ay gumaganap bilang pagtatalaga kay Solomon sa isang katungkulan. Nasa talababa ang mas literal na alternatibo.
- source_word: לִהְיוֹת נָגִיד
  choice: na maging pinuno
  rationale: Ang נָגִיד ay maaaring tumukoy sa pinuno, prinsipe, o tagapamahala. Madaling maunawaan ang ‘pinuno’ at hindi nito ipinapantay ang termino sa pandiwang ‘maghari’ na ginamit sa naunang sugnay.
- source_word: עַל יִשְׂרָאֵל וְעַל יְהוּדָה
  choice: ng Israel at ng Juda
  rationale: 'Sa Tagalog, likas na ipinahahayag ng ‘pinuno ng’ ang awtoridad sa nasasakupan. Ang pag-uulit ng ‘ng’ ay hindi kailangan upang mapanatili ang dalawang saklaw: Israel at Juda.'
theological_decisions:
- issue: Ang katawagang maharlika na נָגִיד kaugnay ng paghahari
  choice: Isinalin bilang ‘pinuno,’ samantalang ‘maghahari’ ang ginamit para sa מלך.
  alternative: prinsipe; tagapamahala
  rationale: Magkaibang salita ang ginamit ng Hebreo para sa paghahari at sa itinalagang pinuno. Pinananatili ng magkaibang salin ang kanilang pagkakaiba at hindi ipinapantay ang dalawang termino sa ‘hari.’
- issue: Ang puwersa ng צִוִּיתִי sa konteksto ng paghalili sa trono
  choice: itinalaga ko
  alternative: inutusan ko
  rationale: Maaaring basahin ang pandiwa bilang tuwirang ‘inutusan,’ ngunit ang konteksto ay maaari ring magpahiwatig ng makapangyarihang pagtatalaga sa tungkulin. Pinili sa teksto ang kontekstuwal na ‘itinalaga,’ habang tahasang pinananatili sa talababa ang leksikal na alternatibo.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa pampublikong pagbasa. Ginamit ang ‘kasunod niya’ para sa natural na paglalarawan ng prusisyon at ‘bilang kahalili ko’ upang malinaw na maipahayag ang paghalili sa katungkulan. Inilagay ang panandang [a] kaagad sa ‘itinalaga ko,’ na siyang bahaging tinatalakay ng talababa.
