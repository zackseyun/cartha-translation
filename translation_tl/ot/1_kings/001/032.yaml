  source_fidelity: 'Tumpak ang pagsasalin ng mga pangunahing elemento ng Hebreo: ang pagsulong ng salaysay, utos na maramihan na ipatawag ang tatlong tao sa hari, mga titulo nina Zadok at Natan, pagkakakilanlan ni Benaias bilang anak ni Joiada, at ang pagdating nila sa harap ng hari. Ang “humarap sila sa hari” ay isang natural na Tagalog na pagpapahayag ng pagdating sa presensiya ng hari.'
  naturalness: Malinaw, natural, at angkop sa modernong Filipino Tagalog ang daloy. Ang “Ipatawag ninyo sa akin” ay maayos na maramihang utos, at ang mga pantanging pangalan ay mahusay na naiaangkop sa karaniwang anyong Filipino.
  terminology: Ang “Haring David,” “pari,” “propeta,” at “anak ni” ay wasto at angkop sa rehistro. Ang mga anyong “Benaias” at “Joiada” ay katanggap-tanggap na Filipino biblical name forms, basta manatiling pare-pareho sa buong salin.
