base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/032.yaml
  text: Then King David said, “Call Zadok the priest, Nathan the prophet, and Benaiah son of Jehoiada to me.” And they came before the king.
translation:
  language: tl
  text: Pagkatapos, sinabi ni Haring David, “Ipatawag ninyo sa akin si Zadok na pari, si Natan na propeta, at si Benaias na anak ni Joiada.” At humarap sila sa hari.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Pagkatapos, sinabi
  rationale: Isinusulong ng waw-consecutive ang salaysay; natural na ipinahahayag ng “Pagkatapos” ang pagkakasunod-sunod ng pangyayari.
- source_word: הַמֶּלֶךְ דָּוִד
  choice: Haring David
  rationale: Likas at marangal na anyo sa modernong Tagalog para sa pangalang may titulong maharlika.
- source_word: קִרְאוּ לִי
  choice: Ipatawag ninyo sa akin
  rationale: Ipinahahayag ng maramihang pautos at ng לִי ang utos na dalhin ang mga tinukoy na tao sa presensiya ng nagsasalita.
- source_word: לְצָדוֹק הַכֹּהֵן
  choice: si Zadok na pari
  rationale: Isinalin ang pangalang pantangi ayon sa karaniwang transliterasyon at ang tiyak na katungkulan bilang “pari.”
- source_word: וּלְנָתָן הַנָּבִיא
  choice: si Natan na propeta
  rationale: Tuwirang isinasalin ang pangalang pantangi at ang tiyak na titulong נביא.
- source_word: וְלִבְנָיָהוּ בֶּן יְהוֹיָדָע
  choice: at si Benaias na anak ni Joiada
  rationale: Pinananatili ang karaniwang anyong Filipino ng mga pangalan at ang genealogical na pagkakakilanlang “anak ni.”
- source_word: וַיָּבֹאוּ
  choice: At humarap sila
  rationale: Ang pandiwa ay literal na “dumating sila,” ngunit kasama ng לִפְנֵי, natural na ipinahahayag sa Tagalog bilang pagharap sa hari habang pinananatili ang payak na pagsulong ng salaysay.
- source_word: לִפְנֵי הַמֶּלֶךְ
  choice: sa hari
  rationale: Sa pariralang “humarap ... sa hari,” naipahahayag nang natural ang kahulugang pagdating sa presensiya ng hari.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa pampublikong pagbasa. Ginamit ang “ipatawag” upang maging natural ang utos, at “humarap sila sa hari” bilang idiomatikong katumbas ng pagdating sa presensiya ng hari.
