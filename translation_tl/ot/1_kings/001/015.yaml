translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “taga-Sunem” sa halip na teknikal na anyong “Sunamita,” at pinanatili ang malawak na kahulugan ng paglilingkod ni Abisag.
