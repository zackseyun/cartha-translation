  text: So Bathsheba went in to the king in the chamber[a]. Now the king was very old[b], and Abishag the Shunammite was attending the king.
translation:
  language: tl
  text: Pumasok si Batseba sa silid ng hari.[a] Napakatanda na ng hari, at si Abisag na taga-Sunem ay naglilingkod[b] sa hari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Pumasok si Batseba sa silid kung saan naroon ang hari.”
    reason: lexical_alternative
  - marker: b
    text: O, “nag-aasikaso sa hari.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּבֹא
  choice: pumasok
  rationale: Ang wayyiqtol ng בוא ay nagpapatuloy sa salaysay, at likas sa Tagalog ang “pumasok” para sa pagpasok ni Batseba sa pribadong silid.
- source_word: בַת־שֶׁבַע
  choice: Batseba
  rationale: Ginamit ang nakasanayang anyong Tagalog ng pangalang Bathsheba.
- source_word: אֶל־הַמֶּלֶךְ הַחַדְרָה
  choice: sa silid na kinaroroonan ng hari
  rationale: Pinagsama sa likas na Tagalog ang paglapit sa hari at ang patungong diwa ng הַחַדְרָה. Ipinahihiwatig ng חֶדֶר ang isang panloob o pribadong silid.
- source_word: וְהַמֶּלֶךְ זָקֵן מְאֹד
  choice: Napakatanda na ng hari
  rationale: Ang sugnay ay nagbibigay ng pangkaligirang impormasyon. Ang “napakatanda na” ay natural at tapat sa זָקֵן מְאֹד.
- source_word: וַאֲבִישַׁג הַשּׁוּנַמִּית
  choice: at si Abisag na taga-Sunem
  rationale: Isinalin ang gentilic bilang “taga-Sunem,” na mas madaling maunawaan sa modernong Tagalog kaysa sa transliterasyong “Sunamita.”
- source_word: מְשָׁרַת
  choice: naglilingkod
  rationale: Ang participle ay nagpapahayag ng nagpapatuloy na gawain. Pinananatili ng “naglilingkod” ang malawak na diwa ng paglilingkod nang hindi agad nililimitahan ito sa pag-aalaga.
- source_word: אֶת־הַמֶּלֶךְ
  choice: sa kanya
  rationale: Tumutukoy ang tuwirang layon sa hari; ginamit ang panghalip upang maiwasan ang di-likas na pag-uulit sa Tagalog.
