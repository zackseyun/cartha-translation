  text: Jonathan answered and said to Adonijah[a], “On the contrary, our lord King David has made Solomon king.”
translation:
  language: tl
  text: Sumagot si Jonatan at sinabi kay Adonias[a], “Ngunit ginawa ng ating panginoon, si Haring David, na hari si Solomon.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Sa halip, ginawa ng ating panginoon, si Haring David, na hari si Solomon.” Ang salitang Hebreo na אֲבָל ay maaari ring isaling “sa halip” upang idiin ang puwersa nitong panawasto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן וַיֹּאמֶר
  choice: Sumagot ... at sinabi
  rationale: Pinananatili ang dalawang pandiwang Hebreo na karaniwang pormula sa pagsasalaysay ng tugon, habang nananatiling natural sa Tagalog.
- source_word: לַאֲדֹנִיָּהוּ
  choice: kay Adonias
  rationale: Isinasalin ang pang-ukol na ל sa “kay”; ginagamit ang karaniwang anyong Tagalog ng pangalan.
- source_word: אֲבָל
  choice: Sa halip
  rationale: Dito ay itinatama ni Jonatan ang inaakala ni Adonias; malinaw na ipinahahayag ng “Sa halip” ang puwersang pasalungat at panawasto.
- source_word: אֲדֹנֵינוּ הַמֶּלֶךְ דָּוִד
  choice: ating panginoong si Haring David
  rationale: Ang “panginoon” ay angkop sa wikang maharlikang korte, at natural sa Tagalog ang pamagat na “Haring David.”
- source_word: הִמְלִיךְ אֶת שְׁלֹמֹה
  choice: ginawa ... na hari si Solomon
  rationale: Ang Hiphil ng מלך ay nangangahulugang maging sanhi upang maging hari o italaga bilang hari. Hindi ginamit ang “pinahiran” sapagkat mas tiyak iyon kaysa sa mismong pandiwa.
