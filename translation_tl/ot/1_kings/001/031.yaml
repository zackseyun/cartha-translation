base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/031.yaml
  text: Then Bathsheba bowed with her face to the ground and prostrated herself before the king[a], and said, “May my lord King David live forever.”
translation:
  language: tl
  text: Pagkatapos, yumukod si Batseba nang nakasubsob ang mukha sa lupa at nagpatirapa sa harap ng hari. Sinabi niya, “Mabuhay nawa magpakailanman ang panginoon kong si Haring David!”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתִּקֹּד
  choice: yumukod
  rationale: Ang קָדַד ay tumutukoy sa pagyuko o pagyukod nang mababa; likas at malinaw sa Filipino ang “yumukod.”
- source_word: אַפַּיִם אֶרֶץ
  choice: nang nakasubsob ang mukha sa lupa
  rationale: Inilalarawan ng idyoma ang mukha na nakaharap o halos nakadikit sa lupa bilang tanda ng matinding pagpapakumbaba; pinananatili ng salin ang kongkretong larawan.
- source_word: וַתִּשְׁתַּחוּ
  choice: nagpatirapa
  rationale: Ang anyo ng שׁחה ay nagpapahayag ng malalim na pagyukod o pagpapatirapa bilang paggalang; ibinubukod ng “nagpatirapa” ang kilos na ito sa naunang “yumukod.”
- source_word: לַמֶּלֶךְ
  choice: sa harap ng hari
  rationale: Bagaman literal na “sa hari,” natural sa Filipino ang “sa harap ng hari” para sa kilos ng pagpapatirapa o pagbibigay-galang.
- source_word: יְחִי
  choice: Mabuhay nawa
  rationale: Ang jussive ay nagpapahayag ng hangarin o basbas; malinaw itong naihahatid ng “Mabuhay nawa.”
- source_word: אֲדֹנִי
  choice: ang panginoon ko
  rationale: Magalang na katawagan ito sa hari. Sa pangungusap, ginamit ang natural na anyong “ang panginoon kong.”
- source_word: הַמֶּלֶךְ דָּוִד
  choice: Haring David
  rationale: Likas na pinagsasama sa Filipino ang titulo at pangalan bilang “Haring David.”
- source_word: לְעֹלָם
  choice: magpakailanman
  rationale: Ipinahahayag dito ng עוֹלָם ang pangmatagalang hangarin sa isang pormal na pagbubunyi sa hari; angkop at marangal ang “magpakailanman.”
theological_decisions: []
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang dalawang magkaugnay ngunit magkaibang kilos—pagyukod at pagpapatirapa—at ang pormal na pananalita sa hari. Walang talababa dahil tuwiran at likas sa Filipino ang “Mabuhay nawa,” kaya hindi kailangan ang alternatibong idyomatikong pahayag.
