  source_fidelity: 'Tumpak na naihahatid ng salin ang magkahiwalay na kilos na nasa Hebreo: unang pagyukod na may mukha sa lupa, saka pagpapatirapa sa harap ng hari. Wasto rin ang pagsasalin ng jussive na pagbati/hiling na «Mabuhay nawa» at ng לְעוֹלָם bilang «magpakailanman.»'
  naturalness: Likas at malinaw ang modernong Filipino. Ang «nang nakasubsob ang mukha sa lupa» ay matingkad ngunit angkop na paraan upang ihatid ang idyomang Hebreo ng malalim na pagpupugay. Ang pormal na tono ng direktang pananalita ay nababagay sa tagpong panghukuman.
  terminology: Ang «Batseba,» «hari,» «panginoon kong,» at «Haring David» ay angkop at magkakatugma sa marangal na rehistro. Hindi ipinapataw ng salin ang anumang doktrinal o interpretatibong dagdag.
