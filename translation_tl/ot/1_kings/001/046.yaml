  yaml_path: translation/ot/1_kings/001/046.yaml
  text: And Solomon has also sat on the royal throne.
translation:
  language: tl
  text: At nakaupo na rin si Solomon sa trono ng kaharian.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְגַם
  choice: At ... na rin
  rationale: Ipinahahayag ang karagdagang pangyayari sa naunang ulat; natural sa modernong Tagalog ang paghahati nito sa “At” at “rin.”
- source_word: יָשַׁב
  choice: nakaupo na
  rationale: Ang qal perfect ay naglalahad ng pangyayaring naganap na at may kasalukuyang bisa sa konteksto ng balita; ang “nakaupo na” ay likas at hindi labis na nagpapakahulugan.
- source_word: עַל כִּסֵּא הַמְּלוּכָה
  choice: sa trono ng kaharian
  rationale: Pinananatili ang genitive na anyo ng Hebreo at ang ideya ng paghaharing maharlika, nang hindi pinapaliit sa pisikal na upuan lamang.
theological_decisions:
- issue: Kung ang pag-upo sa trono ay dapat tahasang ipakahulugang pormal na pagluklok bilang hari
  choice: Panatilihin ang konkretong larawang “nakaupo ... sa trono ng kaharian.”
  alternative: “Naghahari na si Solomon” o “naluklok na si Solomon bilang hari.”
  rationale: Maaaring ipinahihiwatig ng parirala ang aktuwal na pagluklok, ngunit hindi ito dapat palitan ng interpretasyong mas tahasan kaysa sa Hebreo.
translation_notes:
  register: Maikli, marangal, at natural na modernong Filipino. Ginamit ang “trono ng kaharian” upang sundan ang Hebreong konstruksiyon at mapanatili ang bahagyang lawak ng kahulugan nito.
