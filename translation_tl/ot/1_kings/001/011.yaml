base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/011.yaml
  text: Then Nathan said to Bathsheba[a], Solomon’s mother, “Have you not heard that Adonijah son of Haggith has become king, and our lord David does not know it?”
translation:
  language: tl
  text: Pagkatapos, sinabi ni Natan kay Batseba, na ina ni Solomon, “Hindi mo ba nabalitaan na naging hari[a] si Adonias na anak ni Hagit, at hindi ito alam ng ating panginoon, si David?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “naghari.” Sa literal, sinasabi ng Hebreo na “naging hari/naghari.” Maaaring ipahiwatig ng konteksto na itinanghal ni Adonias ang sarili bilang hari, ngunit hindi iyon tahasang sinasabi rito.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Pagkatapos, sinabi
  rationale: Isinusulong ng waw-consecutive ang salaysay; natural sa makabagong Filipino ang “Pagkatapos, sinabi” upang ipakita ang pagkakasunod-sunod.
- source_word: בַּת שֶׁבַע אֵם שְׁלֹמֹה
  choice: kay Batseba, na ina ni Solomon
  rationale: Pinananatili ang mga pangalang pantangi at malinaw na ipinakikilala ang kaugnayan ni Batseba kay Solomon.
- source_word: הֲלוֹא שָׁמַעַתְּ
  choice: Hindi mo ba nabalitaan
  rationale: Ang הֲלוֹא ay naghuhudyat ng retorikal na tanong na umaasang sasang-ayon ang kausap; ang “nabalitaan” ay natural sa konteksto ng pagtanggap ng balita.
- source_word: מָלַךְ
  choice: naging hari
  rationale: Ipinahahayag nito ang pagluklok o pagsisimulang maghari nang hindi tahasang idinaragdag na si Adonias mismo ang nagluklok sa sarili.
- source_word: אֲדֹנִיָּהוּ בֶן חַגִּית
  choice: si Adonias na anak ni Hagit
  rationale: Tuwirang inilalarawan ang ugnayang anak-magulang sa natural na ayos ng Filipino.
- source_word: וַאֲדֹנֵינוּ דָוִד
  choice: at ... ng ating panginoong si David
  rationale: Ang “panginoon” dito ay magalang na titulong pantao para sa hari, hindi banal na titulo; ginagamit ang maliit na titik upang luminaw iyon.
- source_word: לֹא יָדָע
  choice: hindi ito alam
  rationale: Ang “ito” ay natural na tumutukoy sa naunang balita, bagaman pahiwatig lamang ang layon sa Hebreo.
theological_decisions:
- issue: Pagpapakahulugan sa אֲדֹנֵינוּ bilang titulo ni David
  choice: ating panginoong si David
  alternative: ating among si David
  rationale: Pinananatili ng “panginoon” ang magalang at maharlikang tono ng korte. Ang maliit na titik ay nagpapakitang titulo ito para sa taong hari, hindi pangalan o titulong banal.
- issue: Kung tahasang sasabihing nagluklok si Adonias sa sarili
  choice: naging hari
  alternative: ginawa ang sarili niyang hari
  rationale: Maaaring ipahiwatig ng konteksto ang sariling pag-aangkin ni Adonias, ngunit hindi iyon tahasang sinasabi ng pandiwang מָלַךְ sa talatang ito; kaya pinananatili sa pangunahing teksto ang mas malawak na kahulugan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang natural na anyo ng retorikal na tanong at pinanatili ang magalang na pananalita sa konteksto ng palasyo. Inilagay ang panandang [a] kaagad pagkatapos ng pariralang tinatalakay ng talababa.
