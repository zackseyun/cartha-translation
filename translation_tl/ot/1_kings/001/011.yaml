  to: Pagkatapos, sinabi ni Natan kay Batseba, na ina ni Solomon, “Hindi mo ba nabalitaan na naging hari[a] si Adonias na anak ni Hagit, at hindi ito alam ng ating panginoon, si David?”
  rationale: Inayos ang hindi idiomatikong pag-uugnay ng titulong “panginoon” at ng pangalang David sa pamamagitan ng apposition. Pinakinis din ang pangungusap sa talababa tungkol sa posibleng sariling pag-aangkin ni Adonias, habang pinanatili ang tekstuwal na pag-iingat at ang kahulugan ng salin.
