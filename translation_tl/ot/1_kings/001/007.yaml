base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/007.yaml
  text: And he conferred with Joab son of Zeruiah and with Abiathar the priest[a], and they helped Adonijah.
translation:
  language: tl
  text: At nakipagsangguni siya kay Joab na anak ni Zeruias at kay Abiatar na pari, at sinuportahan nila si Adonias.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “tumulong sila kasunod ni Adonias,” ibig sabihin, pumanig o sumunod sila sa kaniya.
    reason: lexical_alternative
lexical_decisions:
- source_word: דְבָרָיו עִם
  choice: nakipagsangguni siya kay
  rationale: Ang literal na 'ang kaniyang mga salita ay kasama ni' ay isang idyomang tumutukoy rito sa pakikipag-usap o pagsangguni tungkol sa balak; natural itong ipinahahayag sa modernong Tagalog bilang 'nakipagsangguni siya kay.'
- source_word: יוֹאָב בֶּן צְרוּיָה
  choice: Joab na anak ni Zeruias
  rationale: Pinananatili ang mga pangalang pantangi sa anyong karaniwang ginagamit sa Tagalog at malinaw na isinasalin ang ugnayang 'anak ni.'
- source_word: אֶבְיָתָר הַכֹּהֵן
  choice: Abiatar na pari
  rationale: Tuwirang inilalahad ang pangalan at katungkulan; ang tiyak na artikulo sa Hebreo ay hindi kailangang tumbasan ng 'ang' sa ganitong Tagalog na pariralang pantukoy.
- source_word: וַיַּעְזְרוּ
  choice: sinuportahan nila
  rationale: Bagaman pangunahing kahulugan ng עזר ang 'tumulong,' sa kontekstong pampolitika ay malinaw na tumutukoy ito sa pagbibigay ng suporta kay Adonias.
- source_word: אַחֲרֵי אֲדֹנִיָּה
  choice: si Adonias
  rationale: Literal na 'sa likod/pagkatapos ni Adonias,' ngunit sa idyomang ito ay ipinahihiwatig ang pagsunod o pagpanig sa kaniya. Isinama sa talababa ang mas literal na anyo.
theological_decisions: []
translation_notes:
  register: Makabago, natural, at marangal na Filipino. Ginamit ang 'nakipagsangguni' para sa idyomang pampolitika at 'sinuportahan' para malinaw ang uri ng tulong. Inilagay ang marker [a] kaagad pagkatapos ng sugnay na nililinaw nito.
