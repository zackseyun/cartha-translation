  text: וְ/אַתָּה֙ אֲדֹנִ֣/י הַ/מֶּ֔לֶךְ עֵינֵ֥י כָל יִשְׂרָאֵ֖ל עָלֶ֑י/ךָ לְ/הַגִּ֣יד לָ/הֶ֔ם מִ֗י יֵשֵׁ֛ב עַל כִּסֵּ֥א אֲדֹנִֽ/י הַ/מֶּ֖לֶךְ אַחֲרָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/020.yaml
  text: And you[a], my lord the king, the eyes of all Israel are on you[b], to tell them who will sit on the throne of my lord the king after him.
translation:
  language: tl
  text: At ikaw, panginoon kong hari—sa iyo nakatuon ang mga mata ng buong Israel—ang magsasabi sa kanila kung sino ang uupo sa trono ng panginoon kong hari pagkatapos niya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ibig sabihin, pagkatapos ni Haring David.
    reason: Nililinaw ang tinutukoy ng panghalip na “niya” sa konteksto ng paghalili sa trono.
lexical_decisions:
- source_word: וְאַתָּה
  choice: At ikaw
  rationale: Pinananatili ang mariing pagtukoy sa hari na ipinahihiwatig ng hiwalay na panghalip na אַתָּה at ang pang-ugnay na וְ.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: panginoon kong hari
  rationale: Magalang na katawagan ito sa hari. Likas sa Filipino ang ayos na “panginoon kong hari” at napapanatili nito ang kapuwa paggalang at titulong maharlika.
- source_word: עֵינֵי כָל יִשְׂרָאֵל עָלֶיךָ
  choice: sa iyo nakatuon ang mga mata ng buong Israel
  rationale: Pinananatili ang konkretong larawan ng Hebreong idyoma habang malinaw na ipinahahayag ang paghihintay at pag-asang nakatuon sa hari.
- source_word: לְהַגִּיד לָהֶם
  choice: ang magsasabi sa kanila
  rationale: Ang Hiphil infinitive ng נגד ay tumutukoy sa pagpapabatid. Sa balangkas ng pangungusap, natural sa Filipino ang “ang magsasabi sa kanila,” na inilalahad ang inaasahang gagawin ng hari.
- source_word: מִי יֵשֵׁב
  choice: kung sino ang uupo
  rationale: Sa konteksto ng trono, ang ישׁב ay literal na “uupo” at tumutukoy rin sa paghalili bilang hari; pinananatili ng salin ang parehong larawan at diwa.
- source_word: עַל כִּסֵּא
  choice: sa trono
  rationale: Ang כִּסֵּא ay “trono”; “sa trono” ang likas na katumbas sa Filipino para sa pag-upo at paghahari.
- source_word: אַחֲרָיו
  choice: pagkatapos niya
  rationale: Pinananatili ang ikatlong-panauhang panlalaking hulapi at ang temporal na diwa ng paghalili nang hindi labis na pinalalawak ang pangunahing teksto.
theological_decisions:
- issue: Tinutukoy ng panghalip sa אַחֲרָיו
  choice: pagkatapos niya, na tumutukoy kay Haring David
  alternative: pagkatapos nito / pagkatapos
  rationale: Ang anyo ay may ikatlong-panauhang panlalaking hulapi at pinakamalapit na tumutukoy sa haring kinakausap. Nililinaw ito ng konteksto ng paghalili sa trono, ngunit pinananatili sa pangunahing teksto ang mismong panghalip ng Hebreo.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Pinanatili ang magalang na pananalita sa korte at ang Hebreong larawang “mga mata ng buong Israel,” habang inayos ang sintaks upang maging malinaw at natural sa karaniwang mambabasa.
