revisions:
- from: Sapagkat bumaba siya ngayon at naghandog ng mga baka, mga pinatabang hayop, at napakaraming tupa. Inanyayahan niya ang lahat ng anak na lalaki ng hari, ang mga pinuno ng hukbo, at ang paring si Abiatar. At naroon sila, kumakain at umiinom sa harap niya, at sinasabi nila, “Mabuhay si Haring Adonias!”[a]
  to: Sapagkat bumaba siya ngayong araw at naghandog ng mga toro, mga alagang hayop na pinataba, at mga tupa nang sagana. Inanyayahan niya ang lahat ng anak na lalaki ng hari, ang mga pinuno ng hukbo, at ang paring si Abiatar. At naroon sila, kumakain at umiinom sa harap niya, at sinasabi nila, “Mabuhay si Haring Adonias!”[a]
  rationale: Nilinaw ang pagtukoy sa araw, pinahusay ang likas na paglalarawan sa pinatabang hayop nang hindi nagpapasya sa eksaktong uri o edad nito, at inayos ang talababa upang hindi magpanggap na ganap na literal ang isang idyomatikong pormula. Walang idinagdag na paghatol tungkol sa pagiging lehitimo ni Adonias bilang hari.
