base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/025.yaml
  text: For he has gone down today and sacrificed oxen[a], fattened calves, and sheep in abundance, and he has invited all the king’s sons, the commanders of the army, and Abiathar the priest. And look, they are eating and drinking before him, and they are saying[b], ‘Long live King Adonijah!’
translation:
  language: tl
  text: Sapagkat bumaba siya ngayong araw at naghandog ng mga toro, mga alagang hayop na pinataba, at mga tupa nang sagana. Inanyayahan niya ang lahat ng anak na lalaki ng hari, ang mga pinuno ng hukbo, at ang paring si Abiatar. At naroon sila, kumakain at umiinom sa harap niya, at sinasabi nila, “Mabuhay si Haring Adonias!”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas malapit sa literal: “Mabuhay ang hari—si Adonias!” Ang “Mabuhay si Haring Adonias!” ay ang likas na anyo ng pagbubunyi sa Filipino.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Nagpapakilala ito ng paliwanag sa naunang ulat o babala at natural na nag-uugnay sa konteksto.
- source_word: יָרַד הַיּוֹם
  choice: bumaba siya ngayon
  rationale: Pinananatili ang direksiyonal na diwa ng יָרַד at ang tahasang pagtukoy sa araw na iyon.
- source_word: וַיִּזְבַּח
  choice: naghandog
  rationale: Sa konteksto ng handaan, tumutukoy ito sa ritwal na pagkatay bilang handog, hindi lamang sa karaniwang pagkatay.
- source_word: שׁוֹר וּמְרִיא וְצֹאן
  choice: mga baka, mga pinatabang hayop, at ... tupa
  rationale: Ibinubukod ang tatlong kategorya habang iniiwasang gawing mas tiyak kaysa sa Hebreo ang malawak na katawagang מְרִיא.
- source_word: לָרֹב
  choice: napakaraming
  rationale: Natural na Filipino para sa malaking dami ng mga inihandog na hayop.
- source_word: וַיִּקְרָא
  choice: Inanyayahan niya
  rationale: Ang קרא na may ל sa konteksto ng piging ay tumutukoy sa pagpapatawag o pag-anyaya.
- source_word: לְכָל בְּנֵי הַמֶּלֶךְ
  choice: ang lahat ng anak na lalaki ng hari
  rationale: Tiyak na mga lalaking anak ang tinutukoy ng בְּנֵי, kaya hindi ginamit ang mas malawak na “mga anak.”
- source_word: שָׂרֵי הַצָּבָא
  choice: ang mga pinuno ng hukbo
  rationale: Malinaw at kasalukuyang Filipino para sa mga opisyal o kumander ng militar.
- source_word: וְהִנָּם
  choice: At naroon sila
  rationale: Ipinapakita ang agarang eksena at pinananatili ang pansin na hinihingi ng הִנֵּה nang hindi gumagamit ng makalumang “masdan.”
- source_word: יְחִי הַמֶּלֶךְ אֲדֹנִיָּהוּ
  choice: Mabuhay si Haring Adonias!
  rationale: Ito ang natural na anyo ng pampublikong pagbubunyi sa Filipino habang pinananatili ang kahulugan ng Hebreong pormula.
theological_decisions:
- issue: Katangian ng pag-aangkin ni Adonias bilang hari
  choice: Inilahad ang sigaw bilang pagbubunyi ng mga panauhin nang hindi kinikilalang lehitimo ang paghahari niya.
  alternative: Ipahiwatig sa salin na siya ay huwad o nagpapanggap na hari.
  rationale: Ang talata ay nag-uulat ng kanilang sinabi; ang paghuhusga sa pagiging lehitimo niya ay nananatili sa mas malawak na salaysay at hindi dapat idagdag sa mismong pananalita.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “naghandog” upang mapanatili ang sakripisyal na diwa, at “mga pinatabang hayop” upang hindi labis na tukuyin kung anong uri o edad ng hayop ang מְרִיא. Ang tanging talababa ay para sa Hebreong anyo ng pagbubunyi; nasa pangunahing teksto ang marker na [a].
