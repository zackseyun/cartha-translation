base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/030.yaml
  text: As I swore to you by Yahweh[a], the God of Israel, saying, ‘Surely Solomon your son will reign after me[b], and he will sit on my throne in my place,’ so I will do this today.
translation:
  language: tl
  text: Kung paanong nanumpa ako sa iyo sa pamamagitan ni Yahweh, ang Diyos ng Israel, na, ‘Si Solomon na anak mo ang maghahari kasunod ko, at siya ang uupo sa trono ko sa halip ko[a],’ gayon ang gagawin ko ngayong araw na ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “bilang kahalili ko.” Ang Hebreo ay maaaring tumukoy sa paghalili o sa pag-upo sa lugar ng isang tao.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי כַּאֲשֶׁר ... כִּי כֵן
  choice: Kung paanong ... gayon nga
  rationale: 'Pinananatili nito ang magkatugmang balangkas ng Hebreo: kung paano nanumpa si David, gayon din niya iyon tutuparin.'
- source_word: נִשְׁבַּעְתִּי לָךְ
  choice: isinumpa ko sa iyo
  rationale: Tumutukoy ang ganap na anyo ng pandiwa sa nauna nang panunumpa ni David kay Batseba.
- source_word: בַּיהוָה
  choice: sa pangalan ni Yahweh
  rationale: Ang pang-ukol ay nagpapakilala kung kanino ibinatay ang panunumpa. Likas sa Filipino ang “sa pangalan ni” para sa panunumpa, at pinananatili ang pangalang Yahweh.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ang Diyos ng Israel
  rationale: Tuwirang salin ng pariralang kumikilala kay Yahweh bilang Diyos ng Israel.
- source_word: כִּי שְׁלֹמֹה בְנֵךְ יִמְלֹךְ אַחֲרַי
  choice: Tiyak na ang anak mong si Solomon ang maghahari kasunod ko
  rationale: Ipinahahayag ng “Tiyak” ang mariing katiyakan ng sumpa, habang malinaw na ipinakikita ng “kasunod ko” ang paghahali sa paghahari.
- source_word: וְהוּא יֵשֵׁב עַל כִּסְאִי תַּחְתָּי
  choice: at siya ang uupo sa trono ko bilang kahalili ko
  rationale: Pinananatili ang larawan ng pag-upo sa trono at natural na ipinahahayag ang harihang paghalili na maaaring taglayin ng תַּחְתָּי.
- source_word: הַיּוֹם הַזֶּה
  choice: sa araw ding ito
  rationale: Ipinahahayag nito ang diin at agarang katuparan ng deiktikong parirala sa Hebreo.
theological_decisions:
- issue: Paglalarawan sa banal na pangalan יהוה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Tuwirang ginagamit sa Hebreo ang tipanang pangalan ng Diyos; pinananatili itong Yahweh sa halip na palitan ng isang titulo.
- issue: Kahulugan ng תַּחְתָּי sa konteksto ng trono
  choice: bilang kahalili ko
  alternative: kapalit ko
  rationale: Sa konteksto, pangunahing tinutukoy nito ang paghalili ni Solomon kay David, ngunit hindi lubos na inaalis ang literal na diwa ng pag-upo sa lugar niya; kaya itinala ang alternatibo sa talababa.
translation_notes:
  register: Makabago at marangal na Filipino; ginamit ang malinaw na balangkas na “Kung paanong ... gayon nga” upang mapanatili ang lohika ng panunumpa at pagtupad.
