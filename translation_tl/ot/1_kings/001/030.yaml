revisions:
- from: Kung paanong isinumpa ko sa iyo sa pangalan ni Yahweh, ang Diyos ng Israel, na, ‘Tiyak na ang anak mong si Solomon ang maghahari kasunod ko, at siya ang uupo sa trono ko bilang kahalili ko[a],’ gayon nga ang gagawin ko sa araw ding ito.
  to: Kung paanong nanumpa ako sa iyo sa pamamagitan ni Yahweh, ang Diyos ng Israel, na, ‘Si Solomon na anak mo ang maghahari kasunod ko, at siya ang uupo sa trono ko sa halip ko[a],’ gayon ang gagawin ko ngayong araw na ito.
  rationale: Pinalitan ang salitang maaaring mangahulugang ‘cursed’ ng malinaw na “nanumpa ako,” at inayos ang parirala ng panunumpa upang mas tapat sa Hebreo at mas natural sa Filipino. Pinanatili ang balangkas na “Kung paanong … gayon,” ang banal na pangalang Yahweh, at ang maingat na talababa para sa תַּחְתָּי.
