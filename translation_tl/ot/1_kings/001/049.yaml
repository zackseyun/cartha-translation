  text: Then all Adonijah’s invited guests trembled and rose[a], and each man went his way.
translation:
  language: tl
  text: Nanginig at nagsitayuan ang lahat ng panauhing inanyayahan ni Adonias, at ang bawat isa ay nagpunta sa kani-kaniyang daan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “bawat lalaki tungo sa kaniyang daan,” isang idyomang nangangahulugang umalis ang bawat isa nang magkakahiwalay.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּחֶרְדוּ
  choice: nanginig sa takot
  rationale: Ang pandiwang חרד ay tumutukoy sa panginginig dahil sa takot o pagkabigla. Pinananatili ng “nanginig sa takot” ang pisikal at emosyonal na diwa nito nang hindi pinalalabis.
- source_word: וַיָּקֻמוּ
  choice: nagsitayo
  rationale: Ang קום ay nangangahulugang bumangon o tumayo. Ang “nagsitayo” ay likas sa salaysay at ipinahihiwatig na sabay-sabay na kumilos ang maraming panauhin.
- source_word: כָּל הַקְּרֻאִים אֲשֶׁר לַאֲדֹנִיָּהוּ
  choice: ang lahat ng panauhing inanyayahan ni Adonias
  rationale: Ang הַקְּרֻאִים ay pasibong participle na “mga inanyayahan.” Sa konteksto ng handaan, malinaw at natural sa Tagalog ang “mga panauhing inanyayahan.”
- source_word: וַיֵּלְכוּ
  choice: nagkanya-kanya silang lakad
  rationale: Ang pangunahing diwa ng הלך ay pag-alis o paglakad; kasama ng kasunod na idyoma, natural itong isinalin bilang pag-alis ng bawat isa sa magkakahiwalay na direksiyon.
- source_word: אִישׁ לְדַרְכּוֹ
  choice: nagkanya-kanya silang lakad
  rationale: Literal itong “bawat lalaki sa kaniyang daan,” isang idyomang nagsasaad na isa-isang nag-alisan o naghiwa-hiwalay ang mga lalaki. Ang “nagkanya-kanya silang lakad” ay natural at pinananatili ang distributibong diwa.
