base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/053.yaml
  text: Then King Solomon sent[a], and they brought him down from the altar. And he came and bowed down to King Solomon, and Solomon said to him, “Go to your house.”
translation:
  language: tl
  text: Kaya nagsugo si Haring Solomon, at pinababa nila si Adonias mula sa altar. Dumating siya at yumukod kay Haring Solomon. Sinabi ni Solomon sa kanya, “Pumunta ka sa iyong bahay.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: nagsugo
  rationale: Tuwirang inilalarawan ng pandiwa ang pagpapadala o pag-aatas ni Solomon; hindi tahasang binabanggit sa Hebreo kung sino ang isinugo.
- source_word: וַיֹּרִדֻהוּ
  choice: pinababa nila siya
  rationale: 'Pinananatili nito ang causative na diwa ng anyong Hophal at ang di-tiyak na maramihang tagaganap: may mga taong nagpababa kay Adonias.'
- source_word: מֵעַל הַמִּזְבֵּחַ
  choice: mula sa altar
  rationale: Natural sa Tagalog at sapat sa konteksto, kung saan nakakapit si Adonias sa mga sungay ng altar; hindi nito ipinapalagay na nakatayo siya sa ibabaw nito.
- source_word: וַיָּבֹא
  choice: lumapit siya
  rationale: Sa konteksto, ang karaniwang pandiwang בוא ay tumutukoy sa pagpunta o paglapit niya kay Solomon; mas natural ito kaysa sa literal na “dumating siya.”
- source_word: וַיִּשְׁתַּחוּ
  choice: yumukod
  rationale: Ipinahahayag ang kilos ng pagpugay nang hindi tiyak na ipinapalagay kung simpleng pagyuko o lubos na pagpapatirapa ang ginawa.
- source_word: לֵךְ לְבֵיתֶךָ
  choice: Umuwi ka na
  rationale: Natural at dignified na modernong Tagalog para sa utos na “pumunta ka sa iyong bahay”; ipinahihiwatig ng “na” ang pagpapauwi o pagpapaalis nang hindi nagdaragdag ng doktrina.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na salaysay. Ginamit ang “Adonias,” ang karaniwang anyong Tagalog ng pangalang Adonijah, upang maging malinaw ang di-tahasang panghalip sa Hebreo. Hindi nilagyan ng talababa dahil ang posibleng literal na “mula sa ibabaw ng altar” ay maaaring magbigay ng maling larawang nakatayo siya sa ibabaw nito, samantalang ipinakikita ng naunang konteksto na nakakapit siya sa mga sungay ng altar.
