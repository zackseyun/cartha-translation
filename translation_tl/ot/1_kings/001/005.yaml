base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/005.yaml
  text: Adonijah the son of Haggith exalted himself[a], saying, “I will reign.” So he made for himself a chariot, horsemen[b], and fifty men running before him.
translation:
  language: tl
  text: Si Adonias na anak ni Haguit ay nagmataas[a] at nagsabi, “Ako ang maghahari.”[b] At naghanda siya para sa sarili niya ng isang karwahe, mga mangangabayo, at limampung lalaking tumatakbo sa unahan niya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “itinaas ang kanyang sarili” o “itinanghal ang kanyang sarili.” Ang pandiwang Hebreo ay nagpapahiwatig ng sariling pagtataas o pagpapadakila.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “Ako ang magiging hari.”
    reason: alternative_reading
lexical_decisions:
- source_word: מִתְנַשֵּׂא
  choice: nagmataas
  rationale: 'Ipinahahayag nito ang reflexive at negatibong diwa ng Hitpael: kusang itinataas o itinatanghal ni Adonias ang kanyang sarili. Natural din ito sa makabagong Tagalog.'
- source_word: לֵאמֹר אֲנִי אֶמְלֹךְ
  choice: at nagsabi, “Ako ang maghahari.”
  rationale: Pinananatili ng “maghahari” ang pandiwang diwa ng מלך, habang ang “Ako ang” ay nagpapakita ng tahasang pag-angkin ni Adonias sa paghahari.
- source_word: וַיַּעַשׂ לוֹ
  choice: Kaya naghanda siya para sa sarili
  rationale: Sa konteksto ng maharlikang pagpapakitang-gilas at pangkat na kasama niya, natural na ipinahahayag ng “naghanda” ang paglalaan o pagsasaayos nang hindi ipinapalagay kung paano niya nakuha ang mga ito.
- source_word: רֶכֶב
  choice: isang karwahe
  rationale: Pinananatili ang isahang anyo ng pangngalang Hebreo at ang konkretong larawan ng sasakyang maharlika.
- source_word: פָרָשִׁים
  choice: mga mangangabayo
  rationale: Tuwirang tumutukoy ito sa maramihang mga nakasakay sa kabayo at hindi nagpapasok ng mas teknikal na ideya ng isang organisadong yunit ng kabalyeriya.
- source_word: חֲמִשִּׁים אִישׁ
  choice: limampung lalaki
  rationale: Pinananatili ang tiyak na bilang at ang panlalaking katawagan ng tekstong Hebreo.
- source_word: רָצִים לְפָנָיו
  choice: tumatakbo sa unahan niya
  rationale: Pinananatili ang participial na paglalarawan sa kanilang gawain bilang mga mananakbong nauuna sa kanyang prusisyon.
- source_word: וַ
  choice: at / Kaya
  rationale: Ang unang waw ay likas na isinanib sa pangungusap sa pamamagitan ng “at,” sa halip na magdagdag ng tahasang panandang panahong wala sa Hebreo. Ang kasunod na waw ay isinaling “Kaya” upang natural na ipakita ang pagsunod ng kanyang maharlikang paghahanda sa ipinahayag niyang ambisyon.
theological_decisions:
- issue: Paglalarawan sa ginawa ni Adonias
  choice: nagmataas
  alternative: itinaas ang kanyang sarili; itinanghal ang kanyang sarili
  rationale: Pinananatili nito ang ipinahihiwatig na puna ng teksto sa sariling pagtataas ni Adonias, ngunit hindi nagdaragdag ng tahasang moral na hatol na wala sa talata.
- issue: Ang kahulugan ng pag-angkin ni Adonias
  choice: Ako ang maghahari.
  alternative: Ako ang magiging hari.
  rationale: Maaaring tukuyin ng מלך ang paghahari o pagiging hari. Pinili ang pandiwang “maghahari” upang mapanatili ang anyo ng Hebreo, habang inilagay sa talababa ang likas na alternatibo.
- issue: Panlalaking katawagan sa maharlikang pangkat
  choice: limampung lalaki
  alternative: limampung tao; limampung mananakbo
  rationale: Ang אִישׁ ay tahasang panlalaki sa kontekstong ito, kaya hindi ito ginawang neutral o pinalitan lamang ng tawag sa tungkulin.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang kinikilalang mga anyong pangalang “Adonias” at “Haguit.” Ang mga talababa ay inilagay mismo sa mga salitang tinutukoy ng mga ito, at iniwasan ang panimulang “Ngayon” sapagkat walang tahasang katumbas nito sa Hebreo.
