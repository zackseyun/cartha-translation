- from: At umahong kasunod niya ang buong bayan. Tumutugtog ng mga plauta[a] ang mga tao at lubos silang nagagalak, at nabiyak ang lupa[b] sa ingay nila.
  to: At umakyat ang buong bayan kasunod niya. Tumutugtog ng mga plauta[a] ang mga tao at nagdiriwang nang may malaking kagalakan, at nabiyak ang lupa[b] sa ingay nila.
