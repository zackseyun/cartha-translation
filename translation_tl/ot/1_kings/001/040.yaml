  text: And all the people went up after him[a], and the people were playing flutes and rejoicing with great joy[b], and the earth split apart at their sound.
translation:
  language: tl
  text: At umakyat ang buong bayan kasunod niya. Tumutugtog ng mga plauta[a] ang mga tao at nagdiriwang nang may malaking kagalakan, at nabiyak ang lupa[b] sa ingay nila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga instrumentong hinihipan”; ang salitang Hebreo ay maaaring tumukoy sa iba’t ibang instrumentong tulad ng plauta.
    reason: lexical_alternative
  - marker: b
    text: Malamang na pagmamalabis ang paglalarawang “nabiyak ang lupa,” upang ipakita ang napakalakas na ingay ng pagdiriwang.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: umahon
  rationale: Pinananatili ang konkretong diwa ng עלה na pag-akyat o pag-ahon, na angkop sa paglakad ng prusisyon.
- source_word: כָל הָעָם
  choice: ang buong bayan
  rationale: Likas na kolektibong tawag sa lahat ng taong kasama sa pampublikong prusisyon; mas marangal at natural kaysa sa literal na paulit-ulit na “lahat ng mga tao.”
- source_word: אַחֲרָיו
  choice: kasunod niya
  rationale: Malinaw na ipinahihiwatig ang pagsunod sa kaniya sa isang prusisyon, nang hindi nagdaragdag ng ibang kahulugan.
- source_word: מְחַלְּלִים בַּחֲלִלִים
  choice: tumutugtog ng mga plauta
  rationale: Ang pandiwa at pangngalan ay tumutukoy sa pagtugtog ng mga instrumentong hinihipan; ang “plauta” ay malinaw at karaniwang katawagan sa Filipino.
- source_word: וּשְׂמֵחִים שִׂמְחָה גְדוֹלָה
  choice: lubos silang nagagalak
  rationale: Natural na Filipino para sa Hebreong masidhing cognate construction, habang pinananatili ang diin sa napakalaking kagalakan.
- source_word: וַתִּבָּקַע הָאָרֶץ
  choice: nabiyak ang lupa
  rationale: Pinananatili ang matingkad na aktibong larawan ng Hebreo at hindi ito pinapahina sa pangunahing teksto bilang simpleng “umalingawngaw.”
- source_word: בְּקוֹלָם
  choice: sa ingay nila
  rationale: Saklaw ng קוֹל ang sama-samang tunog ng mga tao at mga instrumento; natural na ipinapahayag ng “ingay” ang maingay na pagdiriwang.
