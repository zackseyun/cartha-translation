  yaml_path: translation/ot/1_kings/001/018.yaml
  text: And now, look, Adonijah has become king, and now, my lord the king, you do not know it.
translation:
  language: tl
  text: 'At ngayon, narito: naghari na si Adonias; at ngayon, panginoon kong hari, hindi ninyo ito alam.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: At ngayon
  rationale: Pinananatili ang panandang diskurso at agarang paglipat sa kasalukuyang kalagayan.
- source_word: הִנֵּה
  choice: tingnan ninyo
  rationale: Likas na panawag-pansin sa makabagong Tagalog; hindi lamang ito pahayag na 'narito' kundi pagtuon sa nakakabahalang pangyayari.
- source_word: מָלָךְ
  choice: naghari na
  rationale: Ipinahahayag ng pandiwa ang pag-angkin o pagsisimula ng paghahari ni Adonias; ang 'na' ay likas na naghahatid ng natupad nang pangyayari nang hindi nagpapasya kung lehitimo ito.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: panginoon kong hari
  rationale: Pinananatili ang magalang na tuwirang pagtawag kay David bilang sariling panginoon at hari.
- source_word: לֹא יָדָעְתָּ
  choice: hindi ninyo ito alam
  rationale: Ginagamit ang magalang na pangmaramihang panghalip sa Tagalog habang pinananatili ang tahasang pahayag ng kawalan ng kaalaman.
theological_decisions:
- issue: Katayuan ng paghahari ni Adonias
  choice: naghari na si Adonias
  alternative: naging hari na si Adonias
  rationale: Mas malapit ang pandiwang 'naghari' sa Hebrew מָלָךְ at hindi nito ipinahihiwatig na lehitimo o kinilala ng Diyos ang kanyang pagiging hari.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang 'ninyo' bilang magalang na pagtukoy sa hari. Inayos ang ikalawang וְעַתָּה ayon sa likas na daloy ng Tagalog sa halip na ulitin nang alanganin ang 'at ngayon'.
