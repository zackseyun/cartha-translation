  to: Doon, papahiran siya nina Zadok na pari at Natan na propeta bilang hari ng Israel. Pagkatapos, hipan ninyo ang tambuli[a] at sabihin ninyo, “Mabuhay si Haring Solomon!”
  rationale: Nilinaw ang saklaw ng maharlikang katungkulan sa “hari ng Israel” at ibinalik ang neutral na pandiwang “sabihin ninyo” upang hindi magdagdag ng paraang hindi tahasang nasa Hebreo. Hindi binago ang natural na maharlikang aklamasyon o ang tala tungkol sa shofar.
