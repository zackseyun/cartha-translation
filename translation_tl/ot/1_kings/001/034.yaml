base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/034.yaml
  text: There Zadok the priest and Nathan the prophet shall anoint him king over Israel[a], and you shall blow the trumpet and say, ‘Long live King Solomon!’
translation:
  language: tl
  text: Doon, papahiran siya nina Zadok na pari at Natan na propeta bilang hari ng Israel. Pagkatapos, hipan ninyo ang tambuli[a] at sabihin ninyo, “Mabuhay si Haring Solomon!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: shofar, isang sungay na hinihipan bilang hudyat o sa pampublikong pagpapahayag.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמָשַׁח אֹתוֹ
  choice: papahiran siya
  rationale: Ang pandiwang משׁח ay tumutukoy sa rituwal na pagpapahid ng langis upang italaga ang isang hari. Ang anyong may waw sa sunod-sunod na tagubilin ay likas na naipapahayag sa Filipino bilang utos na nasa aspektong magaganap.
- source_word: שָׁם
  choice: Doon
  rationale: Tumutukoy ito sa lugar na binanggit sa naunang talata at sapat na malinaw ang karaniwang salitang “Doon.”
- source_word: צָדוֹק הַכֹּהֵן וְנָתָן הַנָּבִיא
  choice: nina Zadok na pari at Natan na propeta
  rationale: Ginamit ang “nina” upang natural na markahan sa Filipino ang dalawang taong gagawa ng pagpapahid; isinalin nang tuwiran ang kanilang mga katungkulan.
- source_word: לְמֶלֶךְ עַל יִשְׂרָאֵל
  choice: bilang hari sa Israel
  rationale: Ipinahihiwatig ng לְמֶלֶךְ ang katungkulang bunga ng pagpapahid, samantalang ang עַל יִשְׂרָאֵל ay tumutukoy sa saklaw ng kanyang paghahari. Ang “bilang hari sa Israel” ay natural at hindi nagpapasok ng dagdag na paliwanag.
- source_word: וּתְקַעְתֶּם בַּשּׁוֹפָר
  choice: hipan ninyo ang tambuli
  rationale: Ang שׁוֹפָר ay sungay na hinihipan bilang hudyat o sa pampublikong pagpapahayag. Ang “tambuli” ang malinaw at nakaugaliang salin sa kontekstong biblikal; pinananatili ng “ninyo” ang pangmaramihang ikalawang panauhan.
- source_word: וַאֲמַרְתֶּם
  choice: at isigaw
  rationale: Pormal na nangangahulugang “at sabihin ninyo,” ngunit sa konteksto ng paghihip ng tambuli at pampublikong aklamasyon, likas sa Filipino ang “isigaw” at malinaw nitong naipapahayag ang kilos nang hindi binabago ang mensahe.
- source_word: יְחִי הַמֶּלֶךְ שְׁלֹמֹה
  choice: Mabuhay si Haring Solomon!
  rationale: Ang jussive na יְחִי ay isang nakaugaliang aklamasyon para sa hari. Ang “Mabuhay si Haring Solomon!” ang natural at tumpak na katumbas nito sa modernong Filipino.
