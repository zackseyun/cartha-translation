source:
  edition: WLC
  text: לְכִ֞י וּ/בֹ֣אִי אֶל הַ/מֶּ֣לֶךְ דָּוִ֗ד וְ/אָמַ֤רְתְּ אֵלָי/ו֙ הֲ/לֹֽא אַתָּ֞ה אֲדֹנִ֣/י הַ/מֶּ֗לֶךְ נִשְׁבַּ֤עְתָּ לַ/אֲמָֽתְ/ךָ֙ לֵ/אמֹ֔ר כִּֽי שְׁלֹמֹ֤ה בְנֵ/ךְ֙ יִמְלֹ֣ךְ אַחֲרַ֔/י וְ/ה֖וּא יֵשֵׁ֣ב עַל כִּסְאִ֑/י וּ/מַדּ֖וּעַ מָלַ֥ךְ אֲדֹנִיָֽהוּ׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/013.yaml
  text: Please go in to King David and say to him[a], ‘My lord the king, did you not swear to your servant, saying, “Solomon your son shall reign after me, and he shall sit on my throne”? Why then has Adonijah become king?’
translation:
  language: tl
  text: Pumunta ka ngayon kay Haring David at sabihin mo sa kanya, ‘Panginoon kong hari, hindi ba't sumumpa ka sa iyong lingkod[a] at sinabi, “Ang anak mong si Solomon ang maghahari kasunod ko, at siya ang uupo sa aking trono”? Kung gayon, bakit naging hari si Adonias?’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “babaeng lingkod.” Pambabae ang salitang Hebreo at ito ang mapagpakumbabang pagtukoy ni Batseba sa sarili sa harap ng hari.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְכִי וּבֹאִי
  choice: Pumunta ka ngayon
  rationale: Ang dalawang pautos na pambabaeng isahan ay literal na ‘humayo ka at pumasok ka.’ Sa konteksto, likas sa Tagalog ang ‘Pumunta ka ngayon,’ na naghahatid ng agarang utos nang hindi pilit ang pag-uulit.
- source_word: אֶל הַמֶּלֶךְ דָּוִד
  choice: kay Haring David
  rationale: Likas na anyo sa modernong Tagalog para sa titulo at pangalan.
- source_word: וְאָמַרְתְּ אֵלָיו
  choice: at sabihin mo sa kanya
  rationale: Ipinagpapatuloy nito bilang utos ang naunang mga pautos, sa natural na anyong Tagalog.
- source_word: הֲלֹא
  choice: hindi ba't
  rationale: Naghuhudyat ito ng retorikal na tanong na umaasang sasang-ayon ang kausap.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: Panginoon kong hari
  rationale: Pinananatili ang magalang na pananalita sa korte; ang ‘panginoon’ dito ay pantawag sa taong may kapangyarihan, hindi pangalan ng Diyos.
- source_word: נִשְׁבַּעְתָּ
  choice: sumumpa ka
  rationale: Tiyak na tumutukoy ang pandiwa sa panunumpa, hindi lamang sa karaniwang pangako.
- source_word: לַאֲמָתְךָ
  choice: sa iyong lingkod
  rationale: Natural itong mapagpakumbabang pagtukoy ni Batseba sa sarili sa Tagalog; ang tiyak na pambabaeng anyo ng Hebreo ay inililinaw sa talababa.
- source_word: לֵאמֹר כִּי
  choice: at sinabi
  rationale: Ipinakikilala nito ang nilalaman ng sumpa. Hindi dinagdagan ng ‘tiyak’ o ‘tunay’ sapagkat hindi kailangan ang gayong diin sa sugnay.
- source_word: שְׁלֹמֹה בְנֵךְ
  choice: Ang anak mong si Solomon
  rationale: Natural at malinaw na ayos sa Tagalog, habang pinananatili ang ugnayan ni Solomon bilang anak ng hari.
- source_word: יִמְלֹךְ אַחֲרַי
  choice: ang maghahari kasunod ko
  rationale: Pinananatili ang ideya ng paghahari at ng paghalili kay David nang hindi pinalalawak sa ‘sa aking lugar.’
- source_word: וְהוּא יֵשֵׁב עַל כִּסְאִי
  choice: at siya ang uupo sa aking trono
  rationale: Tuwirang inililipat ang larawan ng pagluklok at ang tahasang panghalip na ‘siya.’
- source_word: וּמַדּוּעַ מָלַךְ אֲדֹנִיָהוּ
  choice: Kung gayon, bakit naging hari si Adonias?
  rationale: Ipinahahayag ng ‘Kung gayon’ ang lohikal na hamon kasunod ng sumpa. Ang ganap na pandiwa ay inililipat bilang ‘naging hari,’ na tumutukoy sa pag-angkin o pagkakaluklok bilang hari.
