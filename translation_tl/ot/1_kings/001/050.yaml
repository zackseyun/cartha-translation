  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/אֲדֹ֣נִיָּ֔הוּ יָרֵ֖א מִ/פְּנֵ֣י שְׁלֹמֹ֑ה וַ/יָּ֣קָם וַ/יֵּ֔לֶךְ וַֽ/יַּחֲזֵ֖ק בְּ/קַרְנ֥וֹת הַ/מִּזְבֵּֽחַ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/050.yaml
  text: And Adonijah was afraid because of Solomon[a], so he arose and went and took hold of the horns of the altar.
translation:
  language: tl
  text: At natakot si Adonias dahil kay Solomon,[a] kaya tumayo siya, pumunta, at kumapit sa mga sungay ng altar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang pagkapit sa mga sungay ng altar ay isang kilos ng paghingi ng kanlungan o awa sa santuwaryo.
    reason: cultural_note
lexical_decisions:
- source_word: יָרֵא מִפְּנֵי
  choice: natakot ... dahil kay
  rationale: Ipinahahayag nito nang natural sa modernong Tagalog ang kalagayan ni Adonias at ang sanhi o pinatutungkulan ng kanyang takot, habang pinananatili ang diwa ng pariralang Hebreo.
- source_word: וַיָּקָם
  choice: tumayo siya
  rationale: Tuwirang katumbas ng karaniwang pandiwang pasalaysay; malinaw at natural sa Tagalog.
- source_word: וַיֵּלֶךְ
  choice: pumunta
  rationale: Pinananatili ang payak na kilos ng pagpunta nang hindi nagdaragdag ng tiyak na destinasyong hindi binanggit sa talata.
- source_word: וַיַּחֲזֵק
  choice: kumapit
  rationale: Ang 'kumapit' ay natural na paglalarawan sa mahigpit na paghawak sa mga sungay ng altar at hindi nagpapahiwatig ng karahasang maaaring idulot ng ibang salita.
- source_word: קַרְנוֹת
  choice: mga sungay
  rationale: Pinananatili ang literal at kinikilalang katawagang kultiko para sa nakausling mga bahagi sa mga sulok ng altar.
- source_word: הַמִּזְבֵּחַ
  choice: altar
  rationale: Ang 'altar' ang karaniwan, malinaw, at dignified na katawagan sa modernong Filipino para sa dambanang pinaghahandugan.
- source_word: וַאֲדֹנִיָּהוּ
  choice: At ... si Adonias
  rationale: Ang pang-ugnay na 'At' ay nagpapanatili sa daloy ng salaysay na ipinahihiwatig ng waw; ginamit ang nakaugaliang anyong Tagalog ng pangalan.
theological_decisions:
- issue: Paghingi ng kanlungan o awa sa altar
  choice: Literal na isinalin ang pisikal na kilos bilang 'kumapit sa mga sungay ng altar.'
  alternative: Parapraseng 'nanganlong sa altar' o 'humingi ng awa sa altar.'
  rationale: Ang tekstong Hebreo ay tahasang nagsasaad ng kilos ngunit hindi direktang nagpapaliwanag ng legal o simbolikong kahulugan nito. Inilagay sa talababa ang kontekstong pangkultura upang hindi lumampas ang pangunahing teksto sa pinagmulan.
translation_notes:
  register: Modernong Filipino na payak ngunit marangal. Pinanatili ang sunod-sunod na kilos ng salaysay at ang literal na imahen ng mga sungay ng altar; iniwasan ang pagpapaliwanag ng ipinahihiwatig na paghingi ng kanlungan sa pangunahing teksto.
