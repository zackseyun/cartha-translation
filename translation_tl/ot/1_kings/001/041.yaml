base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/041.yaml
  text: Adonijah and all the invited guests who were with him heard it as they finished eating[a]. And when Joab heard the sound of the trumpet, he said[b], “Why is the sound of the city in an uproar?”
translation:
  language: tl
  text: Narinig ito ni Adonias at ng lahat ng mga panauhing kasama niya nang katatapos lamang nilang kumain.[a] Nang marinig ni Joab ang tunog ng tambuli,[b] sinabi niya, “Bakit nagkakagulo ang lunsod?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “habang patapos na silang kumain.” Maaaring ipahiwatig ng Hebreo na patapos pa lamang ang pagkain o na katatapos lamang nila.
    reason: lexical_alternative
  - marker: b
    text: 'Hebreo: shofar, isang tambuling yari sa sungay na ginagamit sa pagbibigay ng hudyat sa madla.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: Narinig ito
  rationale: Ang pandiwa ay nangangahulugang “narinig.” Idinagdag ang “ito” bilang likas na layon sa Tagalog, na tumutukoy sa ingay na binabanggit sa konteksto.
- source_word: הַקְּרֻאִים
  choice: mga panauhin
  rationale: Ang pasibong participle ng קרא ay tumutukoy sa mga inanyayahan; sa konteksto ng handaan, malinaw at natural ang “mga panauhin.”
- source_word: וְהֵם כִּלּוּ לֶאֱכֹל
  choice: habang patapos silang kumain
  rationale: Ipinahahayag nito ang oras ng pagkarinig habang nasa pagtatapos ang pagkain, ngunit maaaring tumukoy rin sa sandaling katatapos lamang nila; pinananatili sa talababa ang tunay na kalabuan.
- source_word: קוֹל הַשּׁוֹפָר
  choice: tunog ng tambuli
  rationale: Ang שׁוֹפָר ay isang tambuling sungay na ginagamit sa pagbibigay ng hudyat sa madla. Ang “tambuli” ay natural na salitang Filipino at hindi nangangailangang hiramin ang “shofar.”
- source_word: מַדּוּעַ
  choice: Bakit
  rationale: Tuwiran at likas na katumbas ng salitang pananong.
- source_word: קוֹל הַקִּרְיָה הוֹמָה
  choice: nagkakagulo ang lunsod
  rationale: Natural nitong ipinahahayag sa Tagalog ang maingay na kaguluhan ng lunsod, sa halip na piliting gayahin ang estrukturang “tunog ng lunsod.”
- source_word: אֲדֹנִיָּהוּ
  choice: Adonias
  rationale: Ginamit ang nakaugaliang anyo ng pangalang biblikal sa modernong Tagalog.
- source_word: יוֹאָב
  choice: Joab
  rationale: Ginamit ang karaniwang anyo ng pangalang biblikal sa Tagalog.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at natural. Pinili ang “lunsod” para sa dignified biblical register at “nagkakagulo” upang maipahayag nang idiomatiko ang maingay na pagkakagulo ng הוֹמָה.
