  to: Narinig ito ni Adonias at ng lahat ng mga panauhing kasama niya nang katatapos lamang nilang kumain.[a] Nang marinig ni Joab ang tunog ng tambuli,[b] sinabi niya, “Bakit nagkakagulo ang lunsod?”
