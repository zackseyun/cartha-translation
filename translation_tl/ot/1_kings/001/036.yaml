base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/036.yaml
  text: Benaiah son of Jehoiada answered the king and said[a], “Amen! May Yahweh, the God of my lord the king, say so.”
translation:
  language: tl
  text: Sumagot si Benaias na anak ni Joiada sa hari, “Amen! Nawa’y sabihin ni Yahweh na gayon nga, ang Diyos ng aking panginoon, ang hari.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “Amen! Gayon nawa ang sabihin ni Yahweh, ang Diyos ng aking panginoon, ang hari.” Ang pandiwang Hebreo ay literal na “sabihin,” ngunit sa konteksto maaari itong magpahiwatig ng pagpapatibay o pag-aatas sa hangarin ng hari.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן
  choice: Sumagot
  rationale: Karaniwang gamit ng ענה sa salaysay upang ipakilala ang tugon; tuwiran at natural ito sa Filipino.
- source_word: בְּנָיָהוּ בֶן יְהוֹיָדָע
  choice: si Benaias na anak ni Joiada
  rationale: Ginamit ang nakaugaliang anyo ng mga pangalang biblikal sa Filipino at pinanatili ang patronimikong pariralang “anak ni.”
- source_word: אֶת הַמֶּלֶךְ
  choice: sa hari
  rationale: Bagaman tuwirang layon sa Hebreo, hinihingi ng pandiwang Filipino na “sumagot” ang pang-ukol na “sa.”
- source_word: וַיֹּאמֶר
  choice: hindi hiwalay na isinalin
  rationale: Ang literal na “sumagot ... at sinabi” ay hindi likas sa modernong Filipino; naipahihiwatig na ng “sumagot” at ng tuwirang sipi ang kilos ng pagsasalita.
- source_word: אָמֵן
  choice: Amen!
  rationale: Pinananatili ang pamilyar na pahayag ng pagsang-ayon at taimtim na paghiling.
- source_word: כֵּן יֹאמַר
  choice: Nawa’y gayon ang sabihin
  rationale: Pinananatili ang literal na larawang “sabihin” at ang optatibong diwa ng imperfect pagkatapos ng “Amen,” nang hindi tahasang ginagawang “pagtibayin” o “itakda.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ang banal na pangalang יהוה sa transliterasyong Yahweh sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֵי אֲדֹנִי הַמֶּלֶךְ
  choice: ang Diyos ng panginoon kong hari
  rationale: Pinananatili ang ugnayang genitibo at ang magalang na pananalita ni Benaias tungkol sa hari.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Personal na pangalan ang nasa tekstong Hebreo, kaya transliterasyon ang ginamit sa halip na pamalit na titulo.
- issue: Diwa ng יֹאמַר sa panalangin ni Benaias
  choice: Nawa’y ... sabihin
  alternative: Pagtibayin nawa
  rationale: Ang “pagtibayin” ay maaaring magpaliwanag sa ipinahihiwatig na pagpayag o pag-aatas ng Diyos, ngunit pinanatili ng pangunahing teksto ang tunay na pandiwang “sabihin” at ang bahagyang di-tiyak na lakas nito.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Inalis ang Hebreong dobleng pormulang “sumagot ... at sinabi” dahil magiging paulit-ulit ito sa Filipino, ngunit pinanatili ang pormal na tono ng usapan sa maharlikang hukuman.
