  naturalness: Natural at malinaw ang modernong Tagalog, na may angkop na marangal na rehistro para sa pakikipag-usap sa hari. Ang “Kung ano ang sinabi ng panginoon kong hari, iyon ang gagawin ng inyong lingkod” ay nauunawaan at maayos na naghahayag ng pangakong susunod.
