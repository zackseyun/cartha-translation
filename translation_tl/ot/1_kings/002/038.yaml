base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/038.yaml
  text: Shimei said to the king[a], “The word is good. Just as my lord the king has spoken, so your servant will do.” And Shimei lived in Jerusalem many days.
translation:
  language: tl
  text: Sinabi ni Simei sa hari, “Mabuti ang sinabi ninyo.[a] Kung ano ang sinabi ng panginoon kong hari, iyon ang gagawin ng inyong lingkod.” At nanirahan si Simei sa Jerusalem nang maraming araw.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Mabuti ang utos,” o “Mabuti ang bagay na ito.”
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב הַדָּבָר
  choice: Mabuti ang sinabi ninyo
  rationale: Ang דָּבָר ay maaaring tumukoy sa salita, sinabi, o usapin. Sa kontekstong ito, sumasagot si Simei sa ipinahayag na utos o kondisyon ng hari; natural sa modernong Tagalog ang “Mabuti ang sinabi ninyo,” habang pinananatili sa talababa ang ibang posibleng diwa.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: panginoon kong hari
  rationale: Pinananatili nito ang magalang na pormula ng pagsasalita sa hari. Ang “panginoon” dito ay pantawag-galang sa nakatataas at hindi banal na titulo.
- source_word: כֵּן יַעֲשֶׂה עַבְדֶּךָ
  choice: iyon ang gagawin ng inyong lingkod
  rationale: Ang עַבְדֶּךָ ay mapagpakumbabang pagtukoy sa sarili sa harap ng hari, kaya mas angkop ang “inyong lingkod” kaysa “inyong alipin.” Ang imperfect na יַעֲשֶׂה ay pangakong gagawin sa hinaharap.
- source_word: וַיֵּשֶׁב
  choice: nanirahan
  rationale: Sa konteksto ng paninirahan sa isang lugar, ang יָשַׁב ay nangangahulugang manirahan o tumira. Dignified at natural sa salaysay ang “nanirahan.”
- source_word: יָמִים רַבִּים
  choice: nang maraming araw
  rationale: Tuwirang pinananatili ang Hebreong idyomang “maraming araw,” na nagpapahiwatig ng mahabang panahon nang hindi tinutukoy ang eksaktong tagal.
- source_word: שִׁמְעִי
  choice: Simei
  rationale: Ginamit ang karaniwang anyong Tagalog ng pangalang biblikal.
- source_word: בִּירוּשָׁלִַם
  choice: sa Jerusalem
  rationale: Ginamit ang kinikilalang anyo ng pangalan ng lugar sa Tagalog, kasama ang payak na salin ng pang-ukol.
