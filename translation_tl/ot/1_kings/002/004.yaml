revisions:
- from: 'upang tuparin ni Yahweh ang kanyang salita na sinabi niya tungkol sa akin[a]: “Kung iingatan ng iyong mga anak ang kanilang lakad sa pamamagitan ng pamumuhay sa harapan ko nang tapat[b], nang buong puso at buong kaluluwa,” at sinabi rin niya, “Hindi ka mawawalan ng lalaking uupo sa trono ng Israel.”'
  to: 'upang tuparin ni Yahweh ang kanyang salita na sinabi niya tungkol sa akin[a], na nagsasabi: “Kung iingatan ng iyong mga anak na lalaki ang kanilang landas sa paglakad sa harapan ko nang tapat[b], nang buong puso at nang buong kaluluwa,” na nagsasabi: “Hindi ka mawawalan ng lalaking nasa trono ng Israel.”'
  rationale: Inayos ang kasarian ng “mga anak na lalaki,” pinalitan ang hindi gaanong likas na “lakad” ng “landas,” at inalis ang idinagdag na “uupo.” Pinanatili ang dalawang pangpakilala sa pagsipi (“na nagsasabi”) upang ipakita ang paulit-ulit na לֵאמֹר sa WLC, nang hindi ipinipilit ang isang solusyong tekstuwal o interpretatibo sa mahirap na sintaks.
