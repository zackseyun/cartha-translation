base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/004.yaml
  text: so that Yahweh may establish his word that he spoke concerning me[a], saying, ‘If your sons keep their way by walking before me in truth with all their heart and with all their soul,’ saying[c][b], ‘A man of yours shall not be cut off from upon the throne of Israel.’
translation:
  language: tl
  text: 'upang tuparin ni Yahweh ang kanyang salita na sinabi niya tungkol sa akin[a], na nagsasabi: “Kung iingatan ng iyong mga anak na lalaki ang kanilang landas sa paglakad sa harapan ko nang tapat[b], nang buong puso at nang buong kaluluwa,” na nagsasabi: “Hindi ka mawawalan ng lalaking nasa trono ng Israel.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “na sinabi niya sa akin.” Ang Hebreo ay karaniwang nauunawaan dito bilang “na sinabi niya tungkol sa akin.”
    reason: alternative_reading
  - marker: b
    text: Ang salitang Hebreo ay maaari ring isaling “sa katotohanan” o “nang may integridad.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן
  choice: upang
  rationale: Likas na panandang Filipino para sa layunin o bunga.
- source_word: יָקִים
  choice: tuparin
  rationale: Sa konteksto ng ipinangakong salita, ipinahahayag ng Hiphil ng קום ang pagpapatibay o pagsasakatuparan nito; mas natural dito ang “tuparin” kaysa literal na “patatagin.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos sa tekstong Hebreo sa halip na palitan ng isang titulo.
- source_word: דְּבָרוֹ
  choice: kanyang salita
  rationale: Pinananatili ang literal na “salita,” habang nauunawaan sa konteksto bilang pangako.
- source_word: דִּבֶּר עָלַי
  choice: sinabi niya tungkol sa akin
  rationale: Karaniwang ipinahihiwatig ng עַל kasama ng דבר ang “tungkol sa” o “hinggil sa”; hindi ito tahimik na ginawang “sinabi niya sa akin.”
- source_word: יִשְׁמְרוּ בָנֶיךָ אֶת דַּרְכָּם
  choice: iingatan ng iyong mga anak ang kanilang lakad
  rationale: Pinananatili ang tipanang diwa ng שׁמר at ang metapora ng “lakad” bilang paraan ng pamumuhay. Ang “mga anak” ay natural sa Filipino at tumutukoy rito sa mga lalaking dinastikong inapo.
- source_word: לָלֶכֶת לְפָנַי
  choice: sa pamamagitan ng pamumuhay sa harapan ko
  rationale: Ipinakikita ang paraang tinutukoy ng infinitive; ang “pamumuhay” ay likas na Filipino para sa metaporikal na paglakad, samantalang nananatili ang “sa harapan ko.”
- source_word: בֶּאֱמֶת
  choice: nang tapat
  rationale: Sa kontekstong moral at tipanan, ang אֱמֶת ay maaaring tumukoy sa katapatan o integridad. Ang “nang tapat” ay natural ngunit ang saklaw ng kahulugan ay inilalahad sa talababa.
- source_word: בְּכָל לְבָבָם וּבְכָל נַפְשָׁם
  choice: nang buong puso at buong kaluluwa
  rationale: Natural at marangal na katumbas ng ganap na panloob at pansariling pagtatalaga.
- source_word: לֹא יִכָּרֵת לְךָ אִישׁ מֵעַל כִּסֵּא יִשְׂרָאֵל
  choice: Hindi ka mawawalan ng lalaking uupo sa trono ng Israel
  rationale: Isinasalin nang idiomatiko ang Hebreong pormulang “hindi mapuputol sa iyo ang isang lalaki mula sa ibabaw ng trono,” na ang diwa ay patuloy na pagkakaroon ng lalaking inapo sa trono.
theological_decisions:
- issue: Kondisyonal na anyo ng pangako kay David
  choice: Pinanatili ang tahasang “Kung” at ang kondisyon tungkol sa tapat na pamumuhay ng mga inapo ni David.
  alternative: Palabuin ang kondisyon upang magmukhang ganap na walang kondisyon ang pangako.
  rationale: Malinaw na may kondisyon ang sugnay na Hebreo; hindi dapat lutasin sa pagsasalin ang tensiyon nito sa ibang pahayag tungkol sa tipan kay David.
- issue: Saklaw ng דִּבֶּר עָלַי
  choice: “sinabi niya tungkol sa akin”
  alternative: “sinabi niya sa akin”
  rationale: Pinananatili ang pinakaagarang puwersa ng pang-ukol עַל habang kinikilala sa talababa ang alternatibong pagbasa.
translation_notes:
  register: Makabagong Filipino na marangal at madaling maunawaan. Ginamit ang “pamumuhay” upang maging natural ang metapora ng paglakad, at isinalin nang idiomatiko ang huling Hebreong pormula nang hindi binabago ang dinastikong diwa nito.
