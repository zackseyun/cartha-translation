base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/035.yaml
  text: And the king appointed Benaiah son of Jehoiada in his place over the army[a], and the king appointed Zadok the priest in place of Abiathar.
translation:
  language: tl
  text: At itinalaga ng hari si Benaias na anak ni Joiada bilang kapalit niya na mamuno sa hukbo[a]. Itinalaga naman ng hari ang paring si Sadoc bilang kapalit ni Abiatar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “bilang kapalit niya.” Ang “niya” ay tumutukoy kay Joab, ang pinunong inalis sa tungkulin sa naunang konteksto.
    reason: cross_reference
lexical_decisions:
- source_word: וַיִּתֵּן / נָתַן
  choice: itinalaga
  rationale: Bagaman ang saligang diwa ng pandiwa ay “ibinigay/ilagay,” tumutukoy ito rito sa pagtatalaga ng isang tao sa katungkulan.
- source_word: בְּנָיָהוּ בֶן יְהוֹיָדָע
  choice: Benaias na anak ni Joiada
  rationale: Likas na anyong Filipino para sa Hebreong patronimiko; ginamit ang nakaugaliang Tagalog na baybay ng mga pangalan.
- source_word: תַּחְתָּיו
  choice: bilang kapalit niya
  rationale: Pinananatili ang panghalip ng Hebreo at ang diwa ng paghalili sa katungkulan; nililinaw sa talababa na si Joab ang tinutukoy ayon sa konteksto.
- source_word: עַל הַצָּבָא
  choice: sa pamumuno sa hukbo
  rationale: Ipinahahayag ang pamamahala ni Benaias sa puwersang militar, hindi lamang ang lokasyong “nasa ibabaw” nito.
- source_word: צָדוֹק הַכֹּהֵן
  choice: ang paring si Sadoc
  rationale: Natural na ayos sa modernong Filipino habang pinananatili ang pangalan at katungkulan.
- source_word: תַּחַת אֶבְיָתָר
  choice: bilang kapalit ni Abiatar
  rationale: Tumpak na naghahatid ng paghalili kay Abiatar sa katungkulan.
- source_word: הַמֶּלֶךְ
  choice: ang hari
  rationale: Tuwirang salin ng tiyak na titulo; pinanatili ang pag-uulit nito sa ikalawang sugnay.
