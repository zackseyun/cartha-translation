  register: Modernong Filipino na malinaw at marangal. Ginamit ang “hukbo” para sa puwersang militar at ang “sa pamumuno” upang natural na maipahayag ang saklaw ng katungkulan. Pinanatili ang bahagyang di-tiyak na panghalip sa pangunahing teksto at ipinaliwanag ito sa talababa.
