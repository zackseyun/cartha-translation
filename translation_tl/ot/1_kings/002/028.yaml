id: 1KI.2.28
reference: 1 Kings 2:28
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/הַ/שְּׁמֻעָה֙ בָּ֣אָה עַד יוֹאָ֔ב כִּ֣י יוֹאָ֗ב נָטָה֙ אַחֲרֵ֣י אֲדֹנִיָּ֔ה וְ/אַחֲרֵ֥י אַבְשָׁל֖וֹם לֹ֣א נָטָ֑ה וַ/יָּ֤נָס יוֹאָב֙ אֶל אֹ֣הֶל יְהוָ֔ה וַֽ/יַּחֲזֵ֖ק בְּ/קַרְנ֥וֹת הַ/מִּזְבֵּֽחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/028.yaml
  text: And the report came to Joab[a], for Joab had turned after Adonijah, though he had not turned after Absalom[b]. So Joab fled to the tent of Yahweh and took hold of the horns of the altar.
translation:
  language: tl
  text: Nakarating kay Joab ang balita, sapagkat pumanig si Joab kay Adonias, ngunit hindi siya pumanig kay Absalom.[a] Kaya tumakas si Joab patungo sa tolda ni Yahweh at kumapit sa mga sungay ng altar.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “lumihis kasunod ni Adonias … hindi lumihis kasunod ni Absalom.” Sa konteksto, ang parirala ay nangangahulugang pumanig o kumampi sa kanila.
    reason: lexical_alternative
  - marker: b
    text: Ang “mga sungay” ay mga nakausling bahaging hugis-sungay sa mga sulok ng altar. Ang pagkapit sa mga ito ay paghiling ng kanlungan o awa.
    reason: cultural_note
lexical_decisions:
- source_word: הַשְּׁמֻעָה
  choice: ang balita
  rationale: Ang pangngalan ay tumutukoy sa balita o ulat na nakarating sa isang tao. Likas at malinaw sa salaysay ang “balita,” samantalang ang “tsismis” o “alingasngas” ay magdaragdag ng di-tiyak na himig na wala sa teksto.
- source_word: בָּאָה עַד
  choice: nakarating kay
  rationale: Likas na katumbas sa Tagalog ng idyomang literal na “dumating hanggang kay,” at pinananatili ang diwa ng impormasyong umabot kay Joab.
- source_word: נָטָה אַחֲרֵי
  choice: pumanig kay
  rationale: Literal itong “lumihis/sumunod sa likuran ni,” ngunit sa konteksto ay tumutukoy sa pampolitikang pagkampi. Ang “pumanig kay” ay natural sa modernong Tagalog at inuulit sa dalawang sugnay upang mapanatili ang retorikal na pag-uulit ng Hebreo.
- source_word: אֲדֹנִיָּה
  choice: Adonias
  rationale: Ginamit ang nakaugaliang anyong Filipino ng pangalang Adonijah.
- source_word: וְאַחֲרֵי אַבְשָׁלוֹם לֹא נָטָה
  choice: ngunit hindi siya pumanig kay Absalom
  rationale: Pinananatili ng “ngunit” ang tahasang pagsalungat ng sugnay at ng inulit na “pumanig” ang pagkakatulad ng dalawang parirala sa Hebreo.
- source_word: וַיָּנָס
  choice: tumakas
  rationale: Karaniwan at angkop na salaysay na katumbas ng pandiwang nagsasaad ng agarang pagtakas.
- source_word: אֹהֶל יְהוָה
  choice: tolda ni Yahweh
  rationale: Tuwirang isinasalin ang “tolda” nang hindi ipinapasok ang mas teknikal na “tabernakulo,” at natural sa Tagalog ang anyong paari.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang banal na nasa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: וַיַּחֲזֵק בְּקַרְנוֹת הַמִּזְבֵּחַ
  choice: kumapit sa mga sungay ng altar
  rationale: Inilalarawan nito ang kongkretong pagkilos ni Joab. Natural ang “kumapit” sa Tagalog at hindi nito tahasang ipinapasok sa pangunahing teksto ang ipinahihiwatig na paghingi ng kanlungan o awa.
- source_word: קַרְנוֹת הַמִּזְבֵּחַ
  choice: mga sungay ng altar
  rationale: Pinananatili ang kongkretong larawang Hebreo; ipinapaliwanag sa talababa ang anyo at kabuluhan nito para sa makabagong mambabasa.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Ang pinagmulan ay tahasang gumagamit ng Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng titulong “PANGINOON.”
- issue: Pagpapanatili o pagpapakahulugan sa idyomang נָטָה אַחֲרֵי
  choice: pumanig kay
  alternative: lumihis kasunod ni; sumunod kay
  rationale: Sa konteksto, ang idyoma ay tumutukoy sa katapatan o pagkampi sa isang naghahabol ng trono. Ang “pumanig” ay malinaw at natural, habang itinatala sa talababa ang literal na larawan upang hindi maitago ang anyo ng Hebreo.
- issue: Kahulugan ng pagkapit sa mga sungay ng altar
  choice: Iniwan sa pangunahing teksto bilang kongkretong kilos at ipinaliwanag sa talababa
  alternative: Isalin nang tahasan bilang paghingi ng kanlungan o awa
  rationale: Hindi tahasang sinasabi ng talata ang layunin ni Joab. Ang literal na kilos ay nagpapanatili ng naratibong pagpipigil at hindi ginagawang tiyak sa teksto ang ipinahihiwatig na kahulugang pangkultura.
translation_notes:
  register: Modernong Filipino Tagalog na may marangal ngunit madaling maunawaang himig. Ginamit ang karaniwang “balita,” “pumanig,” “tolda,” at “kumapit”; pinanatili ang “altar” bilang malawak na kilalang terminong panrelihiyon. Ang mga pangungusap ay malapit sa ayos at lohika ng Hebreo ngunit inayos nang sapat upang maging natural sa Tagalog.
