  text: So King Solomon sent Benaiah son of Jehoiada[a], and he struck him down, and he died.
translation:
  language: tl
  text: Kaya isinugo ni Haring Solomon si Benaias na anak ni Joiada[a]. Sinalakay niya ito, at namatay ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “Nagsugo si Haring Solomon sa pamamagitan ng kamay ni Benaias na anak ni Joiada,” isang idyomang nangangahulugang isinugo niya ito bilang kinatawan ng hari.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: isinugo
  rationale: Ang שׁלח ay karaniwang nangangahulugang ‘magpadala’ o ‘magsugo.’ Pinili ang ‘isinugo’ dahil malinaw nitong ipinahihiwatig na kumilos si Benaias bilang inatasang kinatawan ng hari.
- source_word: הַמֶּלֶךְ שְׁלֹמֹה
  choice: Haring Solomon
  rationale: Ito ang natural at marangal na anyo sa modernong Tagalog para sa titulong maharlika na sinusundan ng pangalan.
- source_word: בְּיַד
  choice: isinugo ... si Benaias
  rationale: Literal itong ‘sa pamamagitan ng kamay ni,’ isang idyoma ng ahensiya. Sa natural na Tagalog, ipinapahayag ang diwa sa pamamagitan ng paglalagay kay Benaias bilang tuwirang layon ng ‘isinugo’; pinanatili sa talababa ang literal na larawan.
- source_word: בְּנָיָהוּ בֶן יְהוֹיָדָע
  choice: Benaias na anak ni Joiada
  rationale: Malinaw at natural na Tagalog na pagpapahayag ng patronimiko, gamit ang nakaugaliang Tagalog na anyo ng mga pangalang ito.
- source_word: וַיִּפְגַּע בּוֹ
  choice: Pinabagsak niya ito
  rationale: Sa kontekstong ito ng paglalapat ng hatol, ang פגע ב ay tumutukoy sa marahas at nakamamatay na pagsalakay. Hindi ginamit ang tuwirang ‘pinatay’ upang mapanatiling hiwalay ang kasunod na tahasang pahayag na namatay siya.
- source_word: וַיָּמֹת
  choice: at namatay ito
  rationale: Pinananatili ang payak na sunod-sunod na daloy ng salaysay at ang hiwalay na tahasang pagbanggit sa kamatayan.
