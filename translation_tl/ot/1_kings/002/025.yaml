translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang ‘isinugo’ upang ipakita ang awtorisadong atas, at ang mga panghalip na ‘niya/ito’ upang maiwasan ang hindi likas na paulit-ulit na pangalan.
