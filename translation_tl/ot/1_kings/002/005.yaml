translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang mariing pag-uulit ng paratang at ang tensiyon sa pagitan ng digmaan at kapayapaan; bahagyang ginawang mas natural ang ikalawang larawang Hebreo sa pamamagitan ng 'dinungisan.'
