  text: וְ/גַ֣ם אַתָּ֣ה יָדַ֡עְתָּ אֵת֩ אֲשֶׁר עָ֨שָׂה לִ֜/י יוֹאָ֣ב בֶּן צְרוּיָ֗ה אֲשֶׁ֣ר עָשָׂ֣ה לִ/שְׁנֵֽי שָׂרֵ֣י צִבְא֣וֹת יִ֠שְׂרָאֵל לְ/אַבְנֵ֨ר בֶּן נֵ֜ר וְ/לַ/עֲמָשָׂ֤א בֶן יֶ֨תֶר֙ וַ/יַּ֣הַרְגֵ֔/ם וַ/יָּ֥שֶׂם דְּמֵֽי מִלְחָמָ֖ה בְּ/שָׁלֹ֑ם וַ/יִּתֵּ֞ן דְּמֵ֣י מִלְחָמָ֗ה בַּ/חֲגֹֽרָת/וֹ֙ אֲשֶׁ֣ר בְּ/מָתְנָ֔י/ו וּֽ/בְ/נַעֲל֖/וֹ אֲשֶׁ֥ר בְּ/רַגְלָֽי/ו־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/005.yaml
  text: 'And you also know what Joab son of Zeruiah did to me[a], what he did to the two commanders of the armies of Israel, to Abner son of Ner and to Amasa son of Jether: he killed them and put the blood of war in peace[b], and put the blood of war on the belt that was around his waist and on the sandals that were on his feet.'
translation:
  language: tl
  text: Alam mo rin ang ginawa sa akin ni Joab na anak ni Zeruia, at ang ginawa niya sa dalawang pinuno ng mga hukbo ng Israel—kina Abner na anak ni Ner at Amasa na anak ni Jeter. Pinatay niya sila at pinadanak ang dugo ng digmaan sa panahon ng kapayapaan.[a] Inilagay niya ang dugo ng digmaan sa sinturong nasa baywang niya at sa mga sandalyas na nasa mga paa niya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “inilagay niya ang dugo ng digmaan sa kapayapaan.” Ang Hebreong pananalita ay tumutukoy sa pagdanak niya ng dugong karaniwan sa digmaan samantalang mapayapa ang kalagayan.'
    reason: lexical_alternative
  - marker: b
    text: Ang larawan ng dugo sa sinturon at sandalyas ni Joab ay nagpapahiwatig na ang pananagutan sa mga pagpatay ay waring nakakapit at hayag sa kaniya.
    reason: cultural_note
lexical_decisions:
- source_word: וְגַם אַתָּה יָדַעְתָּ
  choice: Alam mo rin
  rationale: Natural na modernong Tagalog na nagpapanatili sa tuwirang pakikipag-usap at sa dagdag na diin ng וְגַם.
- source_word: אֵת אֲשֶׁר עָשָׂה לִי
  choice: ang ginawa sa akin
  rationale: Ipinahihiwatig ng לִי sa konteksto ang ginawang laban o pinsala kay David; hindi ito isinaling 'para sa akin.'
- source_word: לִשְׁנֵי שָׂרֵי צִבְאוֹת יִשְׂרָאֵל
  choice: sa dalawang pinuno ng mga hukbo ng Israel
  rationale: Ang שָׂרֵי ay mga pinunong militar, at pinanatili ng 'mga hukbo' ang anyong maramihan ng צִבְאוֹת.
- source_word: וַיַּהַרְגֵם
  choice: Pinatay niya sila
  rationale: Tuwiran at malinaw na katumbas ng pandiwa at ng hulaping tumutukoy sa dalawang biktima.
- source_word: וַיָּשֶׂם דְּמֵי מִלְחָמָה בְּשָׁלֹם
  choice: nagpadanak ng dugong gaya sa digmaan sa panahon ng kapayapaan
  rationale: Inihahatid nito ang sagupaan ng 'digmaan' at 'kapayapaan' at ang diwa ng pagpatay na pangdigma sa mapayapang kalagayan, habang nililinaw sa talababa ang mas literal na larawan.
- source_word: וַיִּתֵּן דְּמֵי מִלְחָמָה בַּחֲגֹרָתוֹ ... וּבְנַעֲלוֹ
  choice: Dinungisan niya ng dugo ng digmaan ang sinturong ... at ang sandalyas
  rationale: Ang 'dinungisan' ay natural na Filipino para sa konkretong larawan ng dugo sa kasuotan at kagamitan, nang hindi inaalis ang paratang ng pagkakasala sa pagdanak ng dugo.
