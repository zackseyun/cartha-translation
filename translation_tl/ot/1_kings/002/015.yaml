base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/015.yaml
  text: And he said[a], “You know that the kingdom was mine, and that all Israel had set their faces on me to reign; but the kingdom turned and became my brother’s[b], for it was his from Yahweh.”
translation:
  language: tl
  text: Sinabi niya, “Alam mong akin noon ang paghahari, at sa akin nakatuon ang buong Israel[a] upang ako ang maghari. Ngunit nabaling ang paghahari at napunta sa kapatid ko, sapagkat mula kay Yahweh ito napunta sa kanya.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “sa akin itinuon ng buong Israel ang kanilang mga mukha”; ipinahihiwatig ng idyoma na sa kanya sila tumitingin o umaasa bilang magiging hari.
    reason: lexical_alternative
  - marker: b
    text: O, “sapagkat mula kay Yahweh ito ay naging kanya.”
    reason: alternative_reading
lexical_decisions:
- source_word: הַמְּלוּכָה
  choice: ang paghahari
  rationale: Tumutukoy rito sa pagiging hari o pamamahalang maharlika na ipinagpapalagay na mapupunta sa isang tao, hindi pangunahin sa teritoryo ng isang kaharian.
- source_word: לִי הָיְתָה הַמְּלוּכָה
  choice: akin noon ang paghahari
  rationale: Pinananatili ang pag-aangkin ni Adonias at ipinahihiwatig ng “noon” ang kalagayang sinasabi niyang umiral bago nabaling ang paghahari, nang hindi idinaragdag ang di-tiyak na “sana.”
- source_word: וְעָלַי שָׂמוּ כָל־יִשְׂרָאֵל פְּנֵיהֶם
  choice: sa akin nakatuon ang buong Israel
  rationale: Natural sa modernong Tagalog at pinananatili ang larawan ng Hebreong idyoma tungkol sa pagbaling ng mukha, na nagpapahiwatig ng pag-asa o pagtutuon sa isang tao.
- source_word: לִמְלֹךְ
  choice: upang ako ang maghari
  rationale: 'Malinaw na ipinahahayag ang layunin o inaasahang resulta: si Adonias ang mamumuno bilang hari.'
- source_word: וַתִּסֹּב
  choice: nabaling
  rationale: Pinananatili ang metapora ng pagbabago ng direksiyon o pagbaligtad ng takbo ng paghahari.
- source_word: וַתְּהִי לְאָחִי
  choice: naging sa kapatid ko
  rationale: Ipinapakita ang paglipat ng paghahari sa kapatid niya nang hindi nagdaragdag ng tahasang pandiwang “ibinigay.”
- source_word: כִּי מֵיְהוָה הָיְתָה לּוֹ
  choice: sapagkat naging kanya iyon mula kay Yahweh
  rationale: Pinananatili ang di-karaniwang ngunit mahalagang ugnayan ng “mula kay Yahweh” at “naging kanya,” nang hindi ginagawang tahasan na “ibinigay” ni Yahweh ang paghahari.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat sa Tagalog ang personal na pangalang nasa Hebreo sa halip na palitan ito ng isang titulo.
- source_word: אָחִי
  choice: kapatid ko
  rationale: Tuwirang katumbas ng katawagang pampamilya na ginagamit ni Adonias para kay Solomon.
theological_decisions:
- issue: Paglalahad sa pinagmulan ng paghahari kay Solomon
  choice: sapagkat naging kanya iyon mula kay Yahweh
  alternative: sapagkat napunta iyon sa kanya mula kay Yahweh
  rationale: Ang Hebreo ay hindi gumagamit ng pandiwang “magbigay.” Pinananatili ng pangunahing salin ang pahayag na kay Yahweh nagmula ang pagiging kay Solomon ng paghahari, ngunit hindi ipinapaliwanag nang higit sa sinasabi ng teksto ang paraan ng banal na pagkatalaga.
- issue: Pagsasalin sa pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Personal na pangalan ang tuwirang nasa pinagmulang teksto; ang “Yahweh” ay nagpapanatili nito sa halip na gumamit ng pamalit na titulo.
translation_notes:
  register: Makabago at marangal na Filipino ang ginamit. Ang “paghahari” ay mas angkop kaysa “kaharian” dahil ang usapan ay tungkol sa karapatan o tungkulin ng hari. Bahagyang pinanatili ang Hebreong larawan sa “nakatuon” at “nabaling,” habang ipinaliliwanag sa talababa ang mas literal na idyoma.
