  text: Bathsheba said[a], “Good; I will speak to the king for you.”
translation:
  language: tl
  text: Sinabi ni Batseba, “Mabuti. Kakausapin ko ang hari para sa iyo.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “tungkol sa iyo” o “alang-alang sa iyo.” Ang pariralang Hebreo ay maaaring tumukoy sa pagsasalita tungkol sa isang tao; sa konteksto, malamang na ipinahihiwatig nito ang pakikiusap ni Batseba para kay Adonias.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Sinabi
  rationale: Karaniwang pasalaysay na salin ng wayyiqtol ng אמר na nagpapakilala ng tuwirang pananalita.
- source_word: בַּת שֶׁבַע
  choice: Batseba
  rationale: Ginamit ang nakasanayang anyo ng pangalang ito sa modernong saling Tagalog sa halip na isalin ang posibleng literal na kahulugan nito.
- source_word: טוֹב
  choice: Mabuti
  rationale: Maikli itong tugon ng pagsang-ayon; pinananatili ng “Mabuti” ang maigsi at tuwirang dating ng Hebreo.
- source_word: אָנֹכִי אֲדַבֵּר
  choice: Kakausapin ko
  rationale: Likas na Tagalog para sa pangakong makikipag-usap o magsasalita sa hari; taglay na ng anyong pandiwa ang tahasang unang panauhan.
- source_word: עָלֶיךָ
  choice: para sa iyo
  rationale: Sa konteksto, malamang na tumutukoy ito sa pagsasalita alang-alang kay Adonias, ngunit maaaring mangahulugan ang pariralang Hebreo ng “tungkol sa iyo”; pinanatili sa talababa ang tunay na saklaw ng kahulugan.
- source_word: אֶל הַמֶּלֶךְ
  choice: ang hari
  rationale: Sa konstruksiyong “kakausapin,” ang layon na may “ang” ang natural na Tagalog na katumbas ng pagsasalita sa hari.
