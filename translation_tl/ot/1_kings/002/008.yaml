revisions:
- from: At narito, kasama mo si Simei na anak ni Gera, ang Benjaminita mula sa Bahurim. Isinumpa niya ako ng matinding sumpa noong araw na pumunta ako sa Mahanaim. Ngunit bumaba siya upang salubungin ako sa Jordan, at sumumpa ako sa kanya sa pangalan ni Yahweh, na sinasabi, “Hindi kita papatayin sa pamamagitan ng tabak.”[a]
  to: At narito, kasama mo si Simei na anak ni Gera, ang Benjaminita mula sa Bahurim. Binigkas niya laban sa akin ang isang napakatinding sumpa noong araw na pumunta ako sa Mahanaim. Ngunit bumaba siya upang salubungin ako sa Jordan, at nanumpa ako sa kanya sa pangalan ni Yahweh, na sinasabi, “Hindi kita papatayin sa pamamagitan ng tabak.”[a]
  rationale: Pinakinis ang pagpapahayag ng matinding sumpa ni Simei para sa natural na modernong Tagalog nang hindi inaalis ang diin o kahulugan ng Hebreo. Pinalitan din ang “sumumpa” ng “nanumpa” sa pangunahing salin at nilinaw ang terminolohiya sa dahilan ng talababa upang hindi mapaghalo ang curse at oath.
