    issue: Medyo di-likas ang “Isinumpa niya ako ng matinding sumpa.”
    rationale: Nauunawaan ito at tapat sa diwa, ngunit mas idiomatiko sa modernong Filipino ang pagbanggit na binigkas ang sumpa laban kay David.
  - severity: low
    issue: Ang dahilan ng talababa ay tumutukoy sa “negatibong bisa ng sumpa.”
    rationale: Ang tinutukoy rito ay isang eliptikong pormula ng panunumpa, hindi ang sumpang ibinato ni Simei; mas malinaw ang “negatibong kahulugan ng panunumpa.”
