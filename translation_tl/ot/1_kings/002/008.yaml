source:
  edition: WLC
  text: וְ/הִנֵּ֣ה עִ֠מְּ/ךָ שִֽׁמְעִ֨י בֶן גֵּרָ֥א בֶן הַ/יְמִינִי֮ מִ/בַּחֻרִים֒ וְ/ה֤וּא קִֽלְלַ֨/נִי֙ קְלָלָ֣ה נִמְרֶ֔צֶת בְּ/י֖וֹם לֶכְתִּ֣/י מַחֲנָ֑יִם וְ/הֽוּא יָרַ֤ד לִ/קְרָאתִ/י֙ הַ/יַּרְדֵּ֔ן וָ/אֶשָּׁ֨בַֽע ל֤/וֹ בַֽ/יהוָה֙ לֵ/אמֹ֔ר אִם אֲמִֽיתְ/ךָ֖ בֶּ/חָֽרֶב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/008.yaml
  text: And behold[a], with you is Shimei son of Gera, the Benjaminite from Bahurim, and he cursed me with a grievous curse on the day I went to Mahanaim. But he came down to meet me at the Jordan, and I swore to him by Yahweh, saying, ‘I will not put you to death with the sword.’
translation:
  language: tl
  text: At narito, kasama mo si Simei na anak ni Gera, ang Benjaminita mula sa Bahurim. Binigkas niya laban sa akin ang isang napakatinding sumpa noong araw na pumunta ako sa Mahanaim. Ngunit bumaba siya upang salubungin ako sa Jordan, at nanumpa ako sa kanya sa pangalan ni Yahweh, na sinasabi, “Hindi kita papatayin sa pamamagitan ng tabak.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal na Hebreo, “Kung papatayin kita sa pamamagitan ng tabak.” Isa itong pinaikling pormula ng panunumpa na ang ibig sabihin ay, “Hindi kita papatayin sa pamamagitan ng tabak.”
    reason: Pinananatili ang literal na kayarian at ipinapaliwanag ang eliptikong negatibong kahulugan ng panunumpa.
lexical_decisions:
- source_word: וְהִנֵּה
  choice: At narito
  rationale: Pinananatili ang panawag-pansin ng Hebreo sa isang natural ngunit marangal na anyong Tagalog.
- source_word: עִמְּךָ
  choice: kasama mo
  rationale: Ipinahihiwatig na si Simei ay nasa saklaw o piling ni Solomon nang hindi dinaragdagan ang kahulugan.
- source_word: שִׁמְעִי בֶן גֵּרָא בֶן הַיְמִינִי
  choice: Simei na anak ni Gera, ang Benjaminita
  rationale: Natural na inilalahad sa Tagalog ang pangalan, angkan, at pagkakabilang sa lipi ni Benjamin.
- source_word: מִבַּחֻרִים
  choice: mula sa Bahurim
  rationale: Malinaw na ipinapahayag ang pinagmulan o tirahan.
- source_word: קִלְלַנִי קְלָלָה נִמְרֶצֶת
  choice: Isinumpa niya ako ng matinding sumpa
  rationale: Pinananatili ang magkaugnay na pandiwa at pangngalan ng Hebreo para sa diin, habang ang “matindi” ay naghahatid ng bigat ng נִמְרֶצֶת nang hindi labis na nililimitahan ang kahulugan.
- source_word: בְּיוֹם לֶכְתִּי מַחֲנָיִם
  choice: noong araw na pumunta ako sa Mahanaim
  rationale: Tuwirang temporal na salin na natural sa modernong Tagalog.
- source_word: יָרַד לִקְרָאתִי
  choice: bumaba siya upang salubungin ako
  rationale: Pinananatili kapwa ang pababang kilos at ang layuning salubungin si David.
- source_word: וָאֶשָּׁבַע לוֹ בַיהוָה
  choice: sumumpa ako sa kanya sa pangalan ni Yahweh
  rationale: Natural na pormula ng panunumpa sa Tagalog na malinaw na si Yahweh ang tinawag na saksi o batayan ng sumpa.
- source_word: אִם אֲמִיתְךָ בֶּחָרֶב
  choice: Hindi kita papatayin sa pamamagitan ng tabak
  rationale: Ipinahahayag ang aktuwal na negatibong bisa ng eliptikong pormula ng panunumpa; inilalagay sa talababa ang literal na anyo upang mapanatili ang katangiang pangwika ng Hebreo.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Ginagamit ng talata ang mismong pangalang tipan; ang “Yahweh” ay tuwirang transliterasyon at hindi nagpapalit dito ng titulo.
- issue: Kahulugan ng eliptikong sumpang אִם אֲמִיתְךָ בֶּחָרֶב
  choice: 'Negatibong pangako: “Hindi kita papatayin sa pamamagitan ng tabak.”'
  alternative: Literal na “Kung papatayin kita sa pamamagitan ng tabak,”
  rationale: Sa Hebreo, iniiwan na di-binibigkas ang kapahamakang sasapitin ng nanunumpa kung lalabag siya. Kaya ang pormulang may אִם ay gumaganap bilang mariing pagtanggi, ngunit ipinaliliwanag sa talababa ang literal na kayarian.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Pinanatili ang diin ng Hebreong pag-uulit sa “isinumpa… ng matinding sumpa,” ang pababang kilos sa Jordan, at ang pangalang Yahweh. Inilagay ang talababa sa mismong pahayag ng sumpa na ipinaliliwanag nito.
