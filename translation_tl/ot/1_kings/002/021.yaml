  yaml_path: translation/ot/1_kings/002/021.yaml
  text: And she said, “Let Abishag the Shunammite be given to Adonijah your brother as a wife.”
translation:
  language: tl
  text: Sinabi niya, “Ibigay nawa si Abisag na Sunamita kay Adonias na iyong kapatid bilang asawa.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Sinabi niya
  rationale: Isinusulong ng waw-consecutive ang salaysay. Likas sa modernong Tagalog ang payak na “Sinabi niya”; hindi kailangang isalin nang hiwalay ang pang-ugnay.
- source_word: יֻתַּן
  choice: Ibigay nawa
  rationale: Ang passive jussive ay nagpapahayag ng magalang na kahilingan o mungkahi. Pinananatili ng “nawa” ang bolitibong diwa, samantalang ang aktibong anyo ay mas natural sa Tagalog at hindi binibigyang-tiyak ang tagaganap.
- source_word: אֶת אֲבִישַׁג
  choice: si Abisag
  rationale: Ang אֶת ay pananda ng tiyak na tuwirang layon; ginagamitan sa Tagalog ng personal na panandang “si” ang pangalang Abisag.
- source_word: הַשֻּׁנַמִּית
  choice: na Sunamita
  rationale: Ang katawagan ay nagpapakilala kay Abisag ayon sa kaniyang pinagmulan sa Sunem. Ang “Sunamita” ay maikli, marangal, at umaayon sa anyo ng Hebreo.
- source_word: לַאֲדֹנִיָּהוּ
  choice: kay Adonias
  rationale: Tinutukoy ng ל ang tatanggap; “kay” ang likas na pananda sa Tagalog para sa personal na di-tuwirang layon.
- source_word: אָחִיךָ
  choice: na iyong kapatid
  rationale: Pinananatili nito ang ikalawang panauhang panlalaking isahan na tuwirang tumutukoy kay Solomon at ang retorikal na diin sa kanilang ugnayan.
- source_word: לְאִשָּׁה
  choice: bilang asawa
  rationale: Malinaw na ipinahahayag nito ang pormal na layuning pagpapakasal, hindi lamang ang pagiging kasama o babae sa sambahayan.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Pinili ang “Ibigay nawa” upang mapanatili ang pakiusap ng Hebreong jussive nang hindi nagpapasok ng hindi tahasang tagaganap. Ginamit ang mga anyong pangalang “Abisag,” “Sunamita,” at “Adonias,” na angkop sa tradisyong Tagalog.
