  text: וּ/מַדּ֕וּעַ לֹ֣א שָׁמַ֔רְתָּ אֵ֖ת שְׁבֻעַ֣ת יְהוָ֑ה וְ/אֶת הַ/מִּצְוָ֖ה אֲשֶׁר צִוִּ֥יתִי עָלֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/043.yaml
  text: Why then have you not kept the oath of Yahweh and the command that I commanded you?[a][b]
translation:
  language: tl
  text: Kaya bakit hindi mo tinupad ang panunumpa kay Yahweh[a] at ang utos na iniutos ko sa iyo?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring unawain na “ang panunumpa sa pangalan ni Yahweh”—ibig sabihin, panunumpang ginawa sa kanyang pangalan o sa ilalim ng kanyang kapangyarihan.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “ang utos na iniutos ko sa ibabaw mo,” na may diwang isang obligasyong ipinataw sa iyo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמַדּוּעַ
  choice: Kaya bakit
  rationale: Ang וּ ay nag-uugnay sa naunang paratang, at ang מַדּוּעַ ay nangangahulugang “bakit.” Likas sa modernong Tagalog ang “Kaya bakit” sa ganitong konteksto.
- source_word: לֹא שָׁמַרְתָּ
  choice: hindi mo tinupad
  rationale: Ang שׁמר ay maaaring mangahulugang ingatan, sundin, o tuparin. Ang “tinupad” ay angkop kapuwa sa panunumpa at sa utos at malinaw na naghahayag ng obligasyong hindi isinagawa.
- source_word: אֵת שְׁבֻעַת יְהוָה
  choice: ang panunumpa kay Yahweh
  rationale: Sa konteksto, ito ay panunumpang ginawa kay Yahweh o sa kanyang pangalan at kapangyarihan, hindi panunumpang si Yahweh mismo ang gumawa. Iniiwasan ng “kay Yahweh” ang maling pagkaunawang iyon habang itinatala sa talababa ang saklaw ng parirala.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin ang tetragrammaton bilang personal na pangalang “Yahweh,” sa halip na palitan ito ng isang titulo.
- source_word: וְאֶת הַמִּצְוָה
  choice: at ang utos
  rationale: Ang מִצְוָה ay isang ipinag-uutos o tagubilin. Ang “utos” ay natural, malinaw, at marangal sa modernong Tagalog.
- source_word: אֲשֶׁר צִוִּיתִי עָלֶיךָ
  choice: na iniutos ko sa iyo
  rationale: Pinananatili ng “iniutos” ang tahasang pandiwang צוה at ang pag-uulit na kaugnay ng “utos.” Ang “sa iyo” ay natural na Tagalog para sa taong pinatawan ng utos, samantalang ang literal na diwang “ipinataw sa iyo” ay inilalagay sa talababa.
theological_decisions:
- issue: Pagpapakahulugan sa “panunumpa ni/kay Yahweh”
  choice: panunumpa kay Yahweh
  alternative: panunumpa ni Yahweh; panunumpa sa pangalan ni Yahweh
  rationale: Maaaring ipahiwatig ng anyong construct ang kaugnayan ng panunumpa kay Yahweh nang hindi eksaktong tinutukoy ang uri ng kaugnayan. Ipinakikita ng konteksto na si Shimei ang nanumpa sa harap o sa pangalan ni Yahweh, kaya iniiwasan ang Tagalog na “ni Yahweh,” na karaniwang magpapahiwatig na si Yahweh ang nanumpa. Pinananatili sa talababa ang posibleng diwa ng panunumpa sa pangalan o sa ilalim ng kapangyarihan niya.
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Nasa Hebreong teksto ang personal na banal na pangalan. Ang “Yahweh” ay tuwirang transliterasyon at hindi nagpapalit dito ng titulo.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “tinupad” upang natural na saklawin ang panunumpa at utos, samantalang pinanatili ang Hebreong pag-uulit sa “ang utos na iniutos ko sa iyo.”
