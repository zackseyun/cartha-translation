  terminology: Tama at pare-pareho ang “Yahweh” para sa tetragrammaton. Ang “panunumpa,” “utos,” at “ipinataw” sa talababa ay angkop na mga terminong Tagalog at hindi nagpapasok ng doktrinal na pagpapakahulugan.
