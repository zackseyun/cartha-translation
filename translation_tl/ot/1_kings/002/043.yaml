  source_fidelity: 'Tapat ang salin sa Hebreo: naipapahayag ng “Kaya bakit hindi mo tinupad” ang ugnay na tanong, negasyon, at obligasyong hindi tinupad. Ang “panunumpa kay Yahweh” ay isang ligtas at kontekstuwal na paglalahad ng שְׁבֻעַת יְהוָה, nang hindi maling ipinahihiwatig na si Yahweh ang mismong nanumpa. Ang “utos na iniutos ko sa iyo” ay pinananatili ang pag-uulit ng מִצְוָה / צִוִּיתִי; ang diwa ng עָלֶיךָ ay wastong naitala sa talababa.'
