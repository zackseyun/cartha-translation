base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/034.yaml
  text: Then Benaiah son of Jehoiada went up[a], struck him down, and put him to death[b]; and he was buried at his house in the wilderness.
translation:
  language: tl
  text: Pagkatapos, umakyat[a] si Benaias na anak ni Joiada, sinalakay niya si Joab at pinatay niya ito. Inilibing si Joab sa tahanan niya[b] sa ilang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “pumunta.” Karaniwang nangangahulugang “umahon” o “umakyat” ang salitang Hebreo, ngunit sa salaysay maaari lamang nitong ipahiwatig ang pagpunta ni Benaias upang isagawa ang utos.
    reason: lexical_alternative
  - marker: b
    text: Ang “tahanan” ay maaari ring tumukoy nang mas malawak sa lupain o ari-arian ng kanyang sambahayan sa ilang.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַל
  choice: umakyat
  rationale: Pinananatili nito ang karaniwang diwang “umahon/umakyat” ng עלה, bagaman sa daloy ng salaysay maaari rin itong tumukoy sa pagpunta ni Benaias upang isagawa ang utos.
- source_word: וַיִּפְגַּע בּוֹ
  choice: sinalakay niya si Joab
  rationale: Sa kontekstong ito, ang פגע na may בְּ ay tumutukoy sa marahas na pagsalakay. Pinananatili itong hiwalay sa kasunod na tahasang pandiwang nagsasaad ng pagpatay.
- source_word: וַיְמִתֵהוּ
  choice: at pinatay
  rationale: Ang Hiphil ng מות ay causative, “pinatay/ipinapatay.” Ang “pinatay” ay malinaw at likas sa Filipino at angkop sa pagsasagawa ng utos ng hari.
- source_word: וַיִּקָּבֵר
  choice: Inilibing si Joab
  rationale: Ipinahahayag ng anyong Niphal ang pasibong pangyayari. Ang muling pagbanggit kay Joab ay natural sa Filipino at iniiwasan ang malabong reperensiya ng panghalip.
- source_word: בְּבֵיתוֹ
  choice: sa tahanan niya
  rationale: Ang בַּיִת ay maaaring tumukoy sa bahay, sambahayan, o ari-arian. Ang “tahanan” ay dignidad at natural, habang nililinaw ng talababa ang mas malawak na posibleng kahulugan sa konteksto ng paglilibing.
- source_word: בַּמִּדְבָּר
  choice: sa ilang
  rationale: Ang “ilang” ang natural at tradisyonal na salin ng מִדְבָּר at hindi nito labis na tinutukoy kung disyerto, pastulan, o liblib na lupain ang lugar.
