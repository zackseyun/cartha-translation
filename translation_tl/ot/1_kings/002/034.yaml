translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatiling magkahiwalay ang pagsalakay at ang pagpatay, gaya ng dalawang pandiwa sa Hebreo; ginamit ang mga pangalang Benaias at Joiada ayon sa karaniwang anyong Filipino.
