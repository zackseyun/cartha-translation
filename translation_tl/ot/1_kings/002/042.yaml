revisions:
- from: Kaya ipinatawag ng hari si Simei at sinabi sa kanya, “Hindi ba't pinasumpa kita sa pangalan ni Yahweh at taimtim na binalaan,[a] ‘Sa araw na lumabas ka at pumunta saanman,[b] tiyak na mamamatay ka’? At sinabi mo sa akin, ‘Mabuti ang sinabi mo;[c] narinig ko.’”
  to: Kaya nagsugo ang hari at ipinatawag si Simei. Sinabi niya rito, “Hindi ba’t pinasumpa kita sa ngalan ni Yahweh at taimtim na binalaan,[a] ‘Sa araw na lumabas ka at pumunta saanman,[b] alamin mong tiyak na mamamatay ka’? At sinabi mo sa akin, ‘Mabuti ang sinabi mo;[c] narinig ko.’”
