base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/042.yaml
  text: Then the king sent and called for Shimei and said to him[a], “Did I not make you swear by Yahweh and warn you, saying, ‘On the day you go out and go anywhere at all, know for certain that you shall surely die’? And you said to me, ‘The word is good[c][b]; I have heard.’”
translation:
  language: tl
  text: Kaya nagsugo ang hari at ipinatawag si Simei. Sinabi niya rito, “Hindi ba’t pinasumpa kita sa ngalan ni Yahweh at taimtim na binalaan,[a] ‘Sa araw na lumabas ka at pumunta saanman,[b] alamin mong tiyak na mamamatay ka’? At sinabi mo sa akin, ‘Mabuti ang sinabi mo;[c] narinig ko.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mahigpit na tinagubilinan” o “nagpatotoo laban sa iyo.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, literal na “pumunta rito o roon,” isang idyomang nangangahulugang pumunta kahit saan.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “Mabuti ang salitang iyon” o “Mabuti ang usapin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הִשְׁבַּעְתִּיךָ בַיהוָה
  choice: pinasumpa kita sa pangalan ni Yahweh
  rationale: Ipinapahayag ng Hiphil ng שבע ang pagpapasumpa sa isang tao. Likas sa Filipino ang “pinasumpa kita,” at nililinaw ng “sa pangalan ni Yahweh” na ang banal na pangalan ang batayan ng panunumpa.
- source_word: וָאָעִד בְּךָ
  choice: taimtim na binalaan
  rationale: Maaaring mangahulugang magbabala, magpatotoo laban sa, o taimtim na magtagubilin ang Hiphil ng עוד. Ang “taimtim na binalaan” ay natural at nagpapanatili sa pormal at mabigat na himig ng utos.
- source_word: וְהָלַכְתָּ אָנֶה וָאָנָה
  choice: pumunta saanman
  rationale: Ang pares na adberbyo ay literal na tumutukoy sa pagpunta rito o roon, ngunit idyomatikong nangangahulugang pagpunta kahit saan.
- source_word: יָדֹעַ תֵּדַע
  choice: tiyak na
  rationale: Ang infinitive absolute kasama ng finite verb ay nagbibigay-diin sa katiyakan. Sa Filipino, ang diin ay natural na naihahatid ng “tiyak na” kaugnay ng kasunod na parusang kamatayan.
- source_word: מוֹת תָּמוּת
  choice: mamamatay ka
  rationale: Ang infinitive absolute ay nagpapalakas sa katiyakan ng kamatayan; ang buong pariralang “tiyak na mamamatay ka” ang malinaw at natural na katumbas.
- source_word: טוֹב הַדָּבָר
  choice: Mabuti ang sinabi mo
  rationale: Ang דָּבָר ay maaaring “salita,” “sinabi,” o “bagay/usapin.” Dito, tugon ito sa ipinahayag na kondisyon ng hari, kaya natural ang “Mabuti ang sinabi mo,” habang itinatala sa talababa ang mas literal na alternatibo.
- source_word: שָׁמָעְתִּי
  choice: narinig ko
  rationale: Pinananatili nito ang literal na diwa ng pandiwa nang hindi tahimik na dinaragdagan ng mas malakas na kahulugang “sinunod ko” o “tinanggap ko.”
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang ginagamit ng tekstong Hebreo ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalang tipan sa halip na palitan ito ng isang titulo.
translation_notes:
  register: Makabago at dignified na Filipino, na may pormal na himig na angkop sa panunumpa at hatol ng hari. Ginamit ang “Hindi ba't” at “tiyak na mamamatay ka” para sa natural ngunit mariing legal na pananalita. Ang lahat ng marker ng talababa ay nakalagay sa pangunahing teksto.
