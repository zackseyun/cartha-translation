  - severity: low
    issue: Ang 'Pagkalipas ng tatlong taon' ay mas maluwag kaysa sa 'sa pagtatapos ng tatlong taon.'
    rationale: Ang מִקֵּץ ay tumutukoy sa dulo o pagtatapos ng tatlong-taóng yugto; mas tuwirang napapanatili ito ng 'Sa pagtatapos.'
  revised_text: Sa pagtatapos ng tatlong taon, tumakas patungo kay Aquis, anak ni Maaca, na hari ng Gat, ang dalawa sa mga alipin ni Simei. At may mga nagsabi kay Simei, “Tingnan mo, nasa Gat ang mga alipin mo.”
