  verdict: revise
  source_fidelity: Kailangang panatilihin ang pangmaramihang tagaganap ng וַיַּגִּידוּ ('ipinaalam/nagsabi sila'). Ang 'May nagsabi' ay isahan at nawawala ang aspektong ito. Ang 'Sa pagtatapos ng tatlong taon' ay mas malapit din sa temporal na contour ng מִקֵּץ kaysa sa 'Pagkalipas ng tatlong taon.'
  naturalness: Natural at malinaw ang rebisyong Tagalog. Ang 'patungo kay' ay mas maayos na salin ng kilos na may direksiyong אֶל kaysa sa bahagyang kolokyal na 'papunta kay.'
  terminology: Ang 'mga alipin' ay angkop sa kontekstong tumakas sila mula sa kanilang amo. Ang mga anyong Simei, Aquis, Maaca, at Gat ay pinanatili nang pare-pareho.
  issues:
