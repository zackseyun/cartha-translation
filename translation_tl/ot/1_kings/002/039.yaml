  text: וַ/יְהִ֗י מִ/קֵּץ֙ שָׁלֹ֣שׁ שָׁנִ֔ים וַ/יִּבְרְח֤וּ שְׁנֵֽי עֲבָדִים֙ לְ/שִׁמְעִ֔י אֶל אָכִ֥ישׁ בֶּֽן מַעֲכָ֖ה מֶ֣לֶךְ גַּ֑ת וַ/יַּגִּ֤ידוּ לְ/שִׁמְעִי֙ לֵ/אמֹ֔ר הִנֵּ֥ה עֲבָדֶ֖י/ךָ בְּ/גַֽת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/039.yaml
  text: At the end of three years[a], two servants of Shimei ran away to Achish son of Maacah, king of Gath. And they told Shimei, saying, “Look, your servants are in Gath.”
translation:
  language: tl
  text: Sa pagtatapos ng tatlong taon, tumakas patungo kay Aquis, anak ni Maaca, na hari ng Gat, ang dalawa sa mga alipin ni Simei. At may mga nagsabi kay Simei, “Tingnan mo, nasa Gat ang mga alipin mo.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִקֵּץ שָׁלֹשׁ שָׁנִים
  choice: Pagkalipas ng tatlong taon
  rationale: Likas na modernong Tagalog para sa pagtatapos o pagkalipas ng tatlong-taóng yugto; hindi nagdaragdag ng hiwalay na panandang tulad ng “ngayon.”
- source_word: וַיִּבְרְחוּ
  choice: tumakas
  rationale: Malinaw na ipinahihiwatig ang paglayo nang walang pahintulot, hindi lamang pagpunta sa ibang lugar.
- source_word: עֲבָדִים / עֲבָדֶיךָ
  choice: mga alipin
  rationale: Maaaring mangahulugang lingkod o alipin ang עבד, ngunit nangingibabaw rito ang nakatali nilang kalagayan dahil tumakas sila mula sa kanilang amo.
- source_word: אֶל אָכִישׁ
  choice: papunta kay Aquis
  rationale: Ipinapakita ng אֶל ang kilos patungo sa isang tao; natural sa Tagalog ang “papunta kay.”
- source_word: בֶּן מַעֲכָה
  choice: anak ni Maaca
  rationale: Tuwirang salin ng pagkakakilanlan ayon sa ama o magulang, habang pinananatili ang pangalang pantangi.
- source_word: מֶלֶךְ גַּת
  choice: hari ng Gat
  rationale: Tuwirang salin ng pariralang tumutukoy sa katungkulan at nasasakupan ni Aquis.
- source_word: וַיַּגִּידוּ לְשִׁמְעִי לֵאמֹר
  choice: May nagsabi kay Simei
  rationale: Ang pandiwa ay nasa pangmaramihang anyo na may di-tiyak na tagaganap. Sa natural na Tagalog, ang “may nagsabi” ay nagpapanatili sa di-tiyak na pinagmulan ng ulat; hindi kailangang tularan ang Hebreong idyomang “na sinasabi.”
- source_word: הִנֵּה
  choice: Tingnan mo
  rationale: Makabagong panawag-pansin na pinananatili ang agarang diin ng הִנֵּה nang hindi gumagamit ng makalumang pananalita.
- source_word: בְּגַת
  choice: nasa Gat
  rationale: Natural na Tagalog para sa lokasyon sa loob o kinaroroonan sa lungsod ng Gat.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “alipin” sa halip na “lingkod” sapagkat mahalaga sa tagpo ang kanilang pagtakas mula sa amo. Isinalin ang mga pangalan bilang Simei, Aquis, Maaca, at Gat ayon sa karaniwang anyong Filipino.
