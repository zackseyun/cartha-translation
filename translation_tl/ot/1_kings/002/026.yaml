    rationale: Ang magkapares na anyo ng ענה ay nag-uugnay sa pagdurusa ni Abiatar at sa mismong mga dinanas ni David. Maaaring ipahayag ito sa Tagalog nang hindi pinipilit ang eksaktong pag-uulit ng pandiwa.
