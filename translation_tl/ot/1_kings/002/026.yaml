  naturalness: Marangal at natural ang pangkalahatang Tagalog. Mas direkta at likas sa utos ng pagpapaalis ang “Pumunta ka sa Anatot, sa iyong bukid.” Ang “nakibahagi ka sa lahat ng paghihirap ng aking ama” ay maaaring basahing pakikibahagi sa paghihirap sa pangkalahatan; ang binagong anyo ay mas tahasang nag-uugnay nito sa mga dinanas ni David.
  terminology: Ang “Abiatar,” “Anatot,” “pari,” at “Panginoong Yahweh” ay angkop. Pinananatili ng “Panginoong Yahweh” ang dalawang bahagi ng אֲדֹנָי יְהוִה. Ang “Kaban” ay angkop na terminong ginagamit para sa arka ng Diyos.
