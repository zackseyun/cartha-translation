  text: וּ/לְ/אֶבְיָתָ֨ר הַ/כֹּהֵ֜ן אָמַ֣ר הַ/מֶּ֗לֶךְ עֲנָתֹת֙ לֵ֣ךְ עַל שָׂדֶ֔י/ךָ כִּ֛י אִ֥ישׁ מָ֖וֶת אָ֑תָּה וּ/בַ/יּ֨וֹם הַ/זֶּ֜ה לֹ֣א אֲמִיתֶ֗/ךָ כִּֽי נָשָׂ֜אתָ אֶת אֲר֨וֹן אֲדֹנָ֤/י יְהֹוִה֙ לִ/פְנֵי֙ דָּוִ֣ד אָבִ֔/י וְ/כִ֣י הִתְעַנִּ֔יתָ בְּ/כֹ֥ל אֲשֶֽׁר הִתְעַנָּ֖ה אָבִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/026.yaml
  text: And to Abiathar the priest the king said[a], “Go to Anathoth, to your field, for you are a man deserving death; but on this day I will not put you to death, because you carried the ark of the Lord GOD before David my father, and because you shared in all the affliction with which my father was afflicted.”
translation:
  language: tl
  text: At sinabi ng hari kay Abiatar na pari, “Pumunta ka sa Anatot, sa iyong bukid. Karapat-dapat kang mamatay,[a] ngunit hindi kita ipapapatay sa araw na ito, sapagkat dinala mo ang Kaban ng Panginoong Yahweh sa harap ng aking amang si David, at sapagkat nakibahagi ka sa lahat ng paghihirap na dinanas ng aking ama.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “isa kang tao ng kamatayan,” isang idyomang nangangahulugang karapat-dapat mamatay o maaaring hatulan ng kamatayan.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲנָתֹת
  choice: Anatot
  rationale: Isinalin sa karaniwang anyong Tagalog ng pangalang Hebreo na Anathoth.
- source_word: עַל שָׂדֶיךָ
  choice: sa sarili mong lupain
  rationale: Ang parirala ay literal na tumutukoy sa bukid o lupain ni Abiatar; mas natural sa konteksto ng pagpapaalis sa kaniya pabalik sa kaniyang pag-aari ang “sarili mong lupain.”
- source_word: אִישׁ מָוֶת
  choice: Karapat-dapat kang mamatay
  rationale: Ang literal na idyomang “tao ng kamatayan” ay nangangahulugang nararapat sa kamatayan o maaaring hatulan ng kamatayan; malinaw at natural ang napiling salin.
- source_word: אֲמִיתֶךָ
  choice: hindi kita ipapapatay
  rationale: Ang Hiphil ng מות ay “magpapatay” o “ilagay sa kamatayan”; ipinakikita ng “ipapapatay” ang judicial at royal na konteksto.
- source_word: נָשָׂאתָ אֶת אֲרוֹן אֲדֹנָי יְהוִה
  choice: dinala mo ang Kaban ng Panginoong Yahweh
  rationale: Ang נשא ay tumutukoy sa pagbuhat o pagdadala. Pinananatili ng “Panginoong Yahweh” ang dalawang elemento ng banal na titulong אֲדֹנָי יְהוִה nang hindi inuulit ang “Panginoon.”
- source_word: לִפְנֵי דָוִד אָבִי
  choice: sa harap ng aking amang si David
  rationale: Direktang pinananatili ang spatial at relational na diwa ng לִפְנֵי at gumagamit ng natural na ayos sa Tagalog.
- source_word: הִתְעַנִּיתָ ... הִתְעַנָּה
  choice: nakibahagi ka sa lahat ng paghihirap ng aking ama
  rationale: Ipinahahayag nito ang pakikiisa ni Abiatar sa mga dinanas ni David. Hindi man inuulit ang parehong pandiwa gaya sa Hebreo, natural at malinaw itong Tagalog.
- source_word: כִּי ... וְכִי
  choice: sapagkat ... at sapagkat
  rationale: Parehong sugnay ang nagbibigay ng dahilan sa hindi agarang pagpatay kay Abiatar, kaya pinananatili ang magkatugmang causal construction.
theological_decisions:
- issue: Paglalarawan sa pananagutan ni Abiatar sa kamatayan
  choice: Karapat-dapat kang mamatay
  alternative: Isa kang taong ukol sa kamatayan
  rationale: Hindi nito ipinapakahulugang tiyak nang patay si Abiatar; ipinapahayag nitong may sapat na dahilan upang hatulan siya ng kamatayan, habang hindi nilulutas nang higit sa teksto ang juridical na tensiyon.
- issue: Pagsasalin sa tambalang banal na titulo אֲדֹנָי יְהוִה
  choice: Panginoong Yahweh
  alternative: Panginoong DIYOS
  rationale: Pinananatili nito kapwa ang titulong Adonai at ang personal na pangalang YHWH, nang walang pag-aangkat ng denominasyonal na paliwanag.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “pari,” “lupain,” at “ipapapatay” bilang natural na mga salita sa kasalukuyang gamit; pinanatili ang pormal na bigat ng pahayag ng hari at ang pag-uulit na “sapagkat ... at sapagkat.”
