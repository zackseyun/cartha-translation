  to: At sinabi ng hari kay Abiatar na pari, “Pumunta ka sa Anatot, sa iyong bukid. Karapat-dapat kang mamatay,[a] ngunit hindi kita ipapapatay sa araw na ito, sapagkat dinala mo ang Kaban ng Panginoong Yahweh sa harap ng aking amang si David, at sapagkat nakibahagi ka sa lahat ng paghihirap na dinanas ng aking ama.”
