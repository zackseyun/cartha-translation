source:
  edition: WLC
  text: וְ/הֵשִׁיב֩ יְהוָ֨ה אֶת דָּמ֜/וֹ עַל רֹאשׁ֗/וֹ אֲשֶׁ֣ר פָּגַ֣ע בִּ/שְׁנֵֽי אֲ֠נָשִׁים צַדִּקִ֨ים וְ/טֹבִ֤ים מִמֶּ֨/נּוּ֙ וַ/יַּהַרְגֵ֣/ם בַּ/חֶ֔רֶב וְ/אָבִ֥/י דָוִ֖ד לֹ֣א יָדָ֑ע אֶת אַבְנֵ֤ר בֶּן נֵר֙ שַׂר צְבָ֣א יִשְׂרָאֵ֔ל וְ/אֶת עֲמָשָׂ֥א בֶן יֶ֖תֶר שַׂר צְבָ֥א יְהוּדָֽה־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/032.yaml
  text: 'And Yahweh will return his blood on his own head[a], because he struck down two men more righteous and better than he, and killed them with the sword while my father David did not know it: Abner son of Ner, commander of Israel’s army, and Amasa son of Jether, commander of Judah’s army.'
translation:
  language: tl
  text: 'At ibabalik ni Yahweh sa sarili niyang ulo ang dugong kanyang ibinubo[a], sapagkat sinalakay niya ang dalawang lalaking higit na matuwid at mabuti kaysa sa kanya at pinatay sila sa pamamagitan ng espada, samantalang hindi ito nalalaman ng aking amang si David: si Abner na anak ni Ner, ang pinuno ng hukbo ng Israel, at si Amasa na anak ni Jeter, ang pinuno ng hukbo ng Juda.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “ang pananagutan niya sa pagdanak ng dugo sa sarili niyang ulo.” Ang idyomang Hebreo ay tumutukoy sa pananagutang bumabalik sa taong nagbubo ng dugo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵשִׁיב
  choice: ibabalik
  rationale: 'Pinananatili ang larawan ng Hiphil ng שוב: ang bunga o pananagutan sa pagdanak ng dugo ay ibinabalik sa gumawa nito.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang transliterasyon ng banal na pangalan sa tekstong Hebreo, sa halip na palitan ito ng isang titulo.
- source_word: דָּמוֹ ... עַל רֹאשׁוֹ
  choice: sa sarili niyang ulo ang dugong kanyang ibinubo
  rationale: Pinananatili ang idyomang may 'dugo' at 'ulo,' habang nililinaw sa natural na Tagalog na ang tinutukoy ay ang dugong ibinubo niya at ang pananagutang bumabalik sa kanya.
- source_word: פָּגַע
  choice: sinalakay
  rationale: Sa marahas na kontekstong ito, tumutukoy ang pandiwa sa paglusob o pananakit na humantong sa pagpatay; hindi nito inuulit agad ang kasunod na tahasang 'pinatay.'
- source_word: שְׁנֵי אֲנָשִׁים
  choice: dalawang lalaking
  rationale: Tumpak sa kasarian at sa dalawang pinunong militar na pinapangalanan sa hulihan ng talata.
- source_word: צַדִּקִים וְטֹבִים מִמֶּנּוּ
  choice: higit na matuwid at mabuti kaysa sa kanya
  rationale: Pinananatili ang kapwa paghahambing na moral at legal ng צדיקים at ang mas malawak na pagtatasa ng טובים.
- source_word: וַיַּהַרְגֵם בַּחֶרֶב
  choice: at pinatay sila sa pamamagitan ng espada
  rationale: Tuwiran at malinaw na salin ng tahasang pagpatay at ng instrumentong ginamit.
- source_word: וְאָבִי דָוִד לֹא יָדָע
  choice: nang hindi nalalaman ng aking amang si David
  rationale: 'Binabasa ang pang-ugnay bilang pangyayaring kasabay: ginawa ang mga pagpatay nang walang kaalaman ni David.'
- source_word: שַׂר צְבָא יִשְׂרָאֵל
  choice: ang pinuno ng hukbo ng Israel
  rationale: Natural at marangal na modernong Tagalog para sa titulong militar.
- source_word: שַׂר צְבָא יְהוּדָה
  choice: ang pinuno ng hukbo ng Juda
  rationale: Pare-parehong salin ng kaparehong titulong militar.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehova
  rationale: Personal na pangalan ang nasa tekstong Hebreo; pinananatili ito sa transliterasyong Yahweh sa halip na palitan ng titulo.
- issue: Kahulugan ng idyomang דָּמוֹ ... עַל רֹאשׁוֹ
  choice: Ang pananagutan sa dugong ibinubo niya ay ibabalik sa sarili niyang ulo
  alternative: Literal na 'ang kanyang dugo sa kanyang ulo' o tahasang 'ang kanyang pagkakasala sa dugo'
  rationale: Ang idyoma ay tungkol sa pananagutan at makatarungang pagganti dahil sa pagdanak ng dugo. Pinananatili ng salin ang kongkretong larawan, at ipinapaliwanag ng talababa ang diwa nang hindi inaalis ang idyoma sa pangunahing teksto.
translation_notes:
  register: Makabago ngunit marangal na Filipino Tagalog. Ginamit ang “espada” at “hukbo” bilang karaniwang nauunawaang mga salitang militar. Ang ayos ng pangungusap ay nananatiling malapit sa Hebreo ngunit inayos upang maging malinaw at natural sa mga karaniwang mambabasa.
