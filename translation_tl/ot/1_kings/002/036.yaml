base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/036.yaml
  text: Then the king sent and called for Shimei and said to him[a], “Build yourself a house in Jerusalem and live there, and do not go out from there anywhere.”
translation:
  language: tl
  text: Pagkatapos, nagsugo ang hari upang ipatawag si Simei. Sinabi niya rito, “Magtayo ka ng bahay para sa sarili mo sa Jerusalem at doon ka manirahan. Huwag kang umalis mula roon patungo saanman.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלַח הַמֶּלֶךְ וַיִּקְרָא לְשִׁמְעִי
  choice: nagsugo ang hari upang ipatawag si Simei
  rationale: Ipinananatili ng “nagsugo” ang unang pandiwa, habang likas na ipinahahayag ng “upang ipatawag” ang layunin ng pagsusugo at ang kahulugan ng קרא ל bilang pagpapatawag sa harapan ng hari.
- source_word: בְּנֵה לְךָ בַיִת
  choice: Magtayo ka ng bahay para sa sarili mo
  rationale: Tuwirang utos ang בְּנֵה, at ang לְךָ ay nagsasaad na ang bahay ay para sa mismong kausap. Pinananatili ng “bahay” ang konkretong tirahan na tinutukoy.
- source_word: בִּירוּשָׁלִַם
  choice: sa Jerusalem
  rationale: Karaniwang lokatibong salin ng pangalan ng lugar.
- source_word: וְיָשַׁבְתָּ שָׁם
  choice: at doon ka manirahan
  rationale: Sa kontekstong ito, ang ישׁב ay tumutukoy sa patuloy na paninirahan, kaya natural at malinaw ang “manirahan” sa modernong Tagalog.
- source_word: וְלֹא תֵצֵא מִשָּׁם
  choice: Huwag kang umalis mula roon
  rationale: Ipinahahayag nito ang pagbabawal na lumabas o umalis sa itinakdang lugar. Ang “mula roon” ay nagpapanatili sa tahasang pinagmulan sa Hebreo.
- source_word: אָנֶה וָאָנָה
  choice: upang pumunta saanman
  rationale: Ang idyomang Hebreo ay literal na may diwang “paroo't parito” o “dito at doon,” ngunit sa negatibong utos ay natural na nangangahulugang huwag pumunta saanman. Idinagdag ang “upang pumunta” para maging malinaw at likas ang ugnayan nito sa “umalis.”
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at natural. Ginamit ang “Simei,” ang karaniwang anyong Tagalog ng pangalang Shimei. Hindi kailangan ang talababa sapagkat naipapahayag nang malinaw sa pangunahing teksto ang idyomang אָנֶה וָאָנָה.
