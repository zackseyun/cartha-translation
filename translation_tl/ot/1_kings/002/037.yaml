base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/037.yaml
  text: For on the day you go out and cross the Kidron Valley[a], know for certain that you shall surely die[b]; your blood shall be on your own head.
translation:
  language: tl
  text: Sapagkat sa araw na lumabas ka at tumawid sa Lambak ng Kidron[a], tandaan mong tiyak na mamamatay ka; ang dugo mo ay mapapatong sa sarili mong ulo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Batis ng Kidron” o “wadi ng Kidron.” Ang salitang Hebreo ay maaaring tumukoy sa lambak, bangin, o pana-panahong daluyan ng tubig.
    reason: lexical_alternative
  - marker: b
    text: Idyomang Hebreo ito na nangangahulugang ikaw mismo ang mananagot sa sarili mong kamatayan.
    reason: cultural_note
lexical_decisions:
- source_word: וְהָיָה בְּיוֹם
  choice: Sapagkat sa araw na
  rationale: Ipinakikilala ng parirala ang takdang pagkakataon at bunga ng paglabag. Pinananatili ng “sa araw na” ang taimtim at legal na himig ng Hebreo.
- source_word: צֵאתְךָ
  choice: lumabas ka
  rationale: Tumutukoy ito sa paglabas ni Simei mula sa itinakdang hangganan; tuwiran at natural ang salin.
- source_word: וְעָבַרְתָּ אֶת נַחַל קִדְרוֹן
  choice: at tumawid sa Lambak ng Kidron
  rationale: Ang נחל ay maaaring tumukoy sa lambak, wadi, o pana-panahong daluyan ng tubig. Ang “Lambak ng Kidron” ay likas na katawagang heograpiko sa Filipino, habang malinaw na naihahayag ng “tumawid” ang עבר.
- source_word: יָדֹעַ תֵּדַע
  choice: tandaan mong tiyak
  rationale: Ang infinitive absolute na kasunod ng pandiwa ay nagbibigay-diin sa katiyakan. Inihahatid ng parirala ang mariing babala sa natural na Filipino.
- source_word: כִּי מוֹת תָּמוּת
  choice: na mamamatay ka
  rationale: Kasama ng “tiyak,” ipinahahayag nito ang mariing katiyakan ng kamatayan nang hindi ginagaya nang mekanikal ang pag-uulit sa Hebreo.
- source_word: דָּמְךָ יִהְיֶה בְרֹאשֶׁךָ
  choice: ang dugo mo ay mapapasa sarili mong ulo
  rationale: Pinananatili ang larawang Hebreo ng dugo sa ulo, na nagpapahiwatig na siya mismo ang mananagot sa sarili niyang kamatayan.
theological_decisions:
- issue: Legal na idyoma tungkol sa dugo at pananagutan
  choice: Panatilihin sa pangunahing teksto ang “ang dugo mo ay mapapasa sarili mong ulo.”
  alternative: ikaw mismo ang mananagot sa iyong kamatayan
  rationale: Pinananatili nito ang legal at moral na bigat ng orihinal na larawan, habang nililinaw sa talababa ang kahulugan ng personal na pananagutan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang taimtim na himig ng legal na babala at ang matalinghagang pahayag ng Hebreo, na may mga talababa para sa leksikal at kultural na paglilinaw.
