  text: And now I am asking one request of you; do not turn away my face. And she said to him[a], “Speak.”
translation:
  language: tl
  text: At ngayon, may isa akong hinihiling sa iyo. Huwag mo akong tanggihan.[a] Sinabi niya sa kanya, “Magsalita ka.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal na Hebreo, “Huwag mong ibalik ang aking mukha,” isang idyomang nangangahulugang “Huwag mo akong tanggihan” o “Huwag mong ipagkait ang aking kahilingan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: At ngayon
  rationale: Pinananatili nito ang pang-ugnay na וְ at ang panandang diskurso at panahon na עַתָּה sa natural na Tagalog.
- source_word: שְׁאֵלָה אַחַת
  choice: may isa akong kahilingan
  rationale: Ang שְׁאֵלָה ay kahilingan o pakiusap; natural sa Tagalog ang ayos na ito at malinaw na napapanatili ang bilang na 'isa.'
- source_word: אָנֹכִי שֹׁאֵל מֵאִתָּךְ
  choice: may isa akong kahilingan sa iyo
  rationale: Isinasama sa natural na pangungusap ang tahasang unang panauhan, ang kasalukuyang paghingi, at ang taong hinihingan.
- source_word: אַל תָּשִׁיבִי אֶת פָּנָי
  choice: Huwag mo akong tanggihan
  rationale: Ito ang natural na kahulugan sa modernong Tagalog ng Hebreong idyomang literal na nagsasabing huwag ibalik o itaboy ang mukha ng nagsusumamo. Inilalagay sa talababa ang literal na larawan.
- source_word: וַתֹּאמֶר אֵלָיו
  choice: Sinabi niya sa kanya
  rationale: Tuwirang isinasalin ang kasunod na kilos sa salaysay; ang pambabaeng simuno ay nauunawaan mula sa konteksto bagaman walang kasariang gramatikal ang Tagalog na 'niya.'
- source_word: דַּבֵּר
  choice: Magsalita ka
  rationale: Maikli at tuwirang pautos na nag-aanyaya sa kanya na sabihin ang kahilingan.
