source:
  edition: WLC
  text: וְ/עַתָּ֗ה חַי יְהוָה֙ אֲשֶׁ֣ר הֱכִינַ֗/נִי ו/יושיבי/ני עַל כִּסֵּא֙ דָּוִ֣ד אָבִ֔/י וַ/אֲשֶׁ֧ר עָֽשָׂה לִ֛/י בַּ֖יִת כַּ/אֲשֶׁ֣ר דִּבֵּ֑ר כִּ֣י הַ/יּ֔וֹם יוּמַ֖ת אֲדֹנִיָּֽהוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/024.yaml
  text: And now[a], as Yahweh lives, who has established me and seated me on the throne of David my father, and who has made for me a house as he promised, surely Adonijah shall be put to death today.
translation:
  language: tl
  text: Ngayon nga, buhay si Yahweh, na nagpatatag sa akin at nagluklok sa akin sa trono ng aking amang si David, at gumawa para sa akin ng isang bahay[a] gaya ng ipinangako niya, tiyak na papatayin si Adonias sa araw na ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nagtatag para sa akin ng isang dinastiya.” Ang “bahay” dito ay malamang na tumutukoy sa nagpapatuloy na angkan ng hari, hindi lamang sa isang gusali.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַי יְהוָה
  choice: habang buháy si Yahweh
  rationale: Karaniwang pormula ng panunumpa sa Hebreo. Likas ito sa Filipino at pinananatili ang tahasang pagtukoy sa buhay na Diyos at ang personal na pangalang Yahweh.
- source_word: הֱכִינַנִי
  choice: nagtatag sa akin
  rationale: Ipinahahayag ng Hiphil ng כון ang pagpapatatag o matibay na pagkakalagay kay Solomon bilang hari.
- source_word: וַיּוֹשִׁיבֵנִי עַל כִּסֵּא
  choice: nagluklok sa akin sa trono
  rationale: Ang 'nagluklok' ay natural na salitang Filipino para sa causative na pagpapaupo sa trono at malinaw na tumutukoy sa paghahari.
- source_word: כִּסֵּא דָּוִד אָבִי
  choice: trono ng aking amang si David
  rationale: Natural at marangal sa modernong Filipino habang tapat sa ugnayang ipinahahayag ng Hebrew construct chain.
- source_word: עָשָׂה לִי בַּיִת
  choice: gumawa para sa akin ng isang sambahayan
  rationale: Ang 'sambahayan' ay nakapag-iingat sa larawang 'bahay' ngunit mas malinaw na maaaring tumukoy sa angkan o dinastiya, hindi lamang sa gusali.
- source_word: כַּאֲשֶׁר דִּבֵּר
  choice: gaya ng ipinangako niya
  rationale: Bagaman literal na 'gaya ng sinabi niya,' ang konteksto ng banal na pangako ay natural na naihahayag ng 'ipinangako.'
- source_word: כִּי
  choice: tiyak na
  rationale: Dito ay pinatitibay ng כִּי ang nilalaman ng panunumpa; malinaw itong naihahayag ng 'tiyak na.'
- source_word: הַיּוֹם
  choice: sa araw na ito
  rationale: Natural at bahagyang marangal na katumbas ng 'today' na akma sa pormal na hatol.
- source_word: יוּמַת
  choice: papatayin
  rationale: 'Pinananatili nito ang passive-causative na diwa ng Hophal ng מות: si Adonias ay ipapapatay o lalapatan ng kamatayan, hindi basta mamamatay.'
- source_word: אֲדֹנִיָּהוּ
  choice: Adonias
  rationale: Ginamit ang nakaugaliang anyong Filipino ng pangalang biblikal.
theological_decisions:
- issue: Kahulugan ng בַּיִת sa kontekstong maharlika
  choice: Panatilihin sa pangunahing teksto ang larawang 'sambahayan' at ipaliwanag sa talababa ang dinastikong diwa.
  alternative: Isalin nang tuwiran bilang 'dinastiya' o panatilihing literal bilang 'bahay.'
  rationale: Sa konteksto ng paghahari at pangako kay David, ang בַּיִת ay maaaring mangahulugang nagpapatuloy na angkan o dinastiya. Ang 'sambahayan' ay nagpapanatili sa metapora at intertekstuwal na ugnayan nang hindi ito nililimitahan sa pisikal na gusali o lubusang pinapakahulugan sa mismong teksto.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang 'Yahweh' bilang personal na pangalan ng Diyos, 'nagluklok' para sa maharlikang konteksto, at 'sambahayan' upang mapanatili ang tunay na lawak ng בַּיִת. Nilagyan ng tuldik ang 'buháy' upang maiwasan ang maling pagbasa.
