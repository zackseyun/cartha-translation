revisions:
- from: At ngayon, habang buháy si Yahweh, na nagtatag sa akin at nagluklok sa akin sa trono ng aking amang si David, at gumawa para sa akin ng isang sambahayan[a] gaya ng ipinangako niya, tiyak na papatayin si Adonias sa araw na ito.
  to: Ngayon nga, buhay si Yahweh, na nagpatatag sa akin at nagluklok sa akin sa trono ng aking amang si David, at gumawa para sa akin ng isang bahay[a] gaya ng ipinangako niya, tiyak na papatayin si Adonias sa araw na ito.
