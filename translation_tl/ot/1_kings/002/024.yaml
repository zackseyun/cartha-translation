    rationale: Ang “magtatag” ay karaniwang nangangailangan ng tuwirang bagay na institusyon, tahanan, o katulad nito. Sa kontekstong ito, ang Hiphil ng כון ay mas tumpak at natural na “nagpatatag sa akin” o “nagpatibay sa akin.”
  - severity: medium
    issue: Ang “gumawa para sa akin ng isang sambahayan” ay hindi pinakamalapit na katumbas ng עָשָׂה לִי בַּיִת.
    rationale: Ang “sambahayan” ay mas tiyak na household at ang pariralang “gumawa ... ng sambahayan” ay hindi natural. Ang “bahay” ay pinananatili ang leksikal na larawan at ang dinastikong pakahulugan nang hindi inaagaw ang ambigwidad ng teksto.
