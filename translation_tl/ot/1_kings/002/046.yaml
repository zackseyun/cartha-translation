revisions:
- from: Nag-utos ang hari kay Benaias na anak ni Joiada. Lumabas si Benaias, pinabagsak niya ang taong iyon, at namatay ito. Sa gayon, naging matatag ang kaharian sa kamay ni Solomon.[a]
  to: Nag-utos ang hari kay Benaias na anak ni Joiada. Lumabas si Benaias at sinaktan niya ito, kaya namatay ito. Sa gayon, naging matatag ang kaharian sa kamay ni Solomon.[a]
  rationale: Pinalitan ang hindi tiyak na “ang taong iyon” at ang medyo mahina o artipisyal na “pinabagsak” ng “sinaktan niya ito.” Napananatili nito ang ambigwidad ng פגע, ang sunod-sunod na kilos at resulta sa Hebreo, at ang natural na modernong Tagalog. Pinanatili ang footnote anchor at nilalaman nito.
