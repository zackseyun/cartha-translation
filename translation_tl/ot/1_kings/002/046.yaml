base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/046.yaml
  text: Then the king commanded Benaiah son of Jehoiada[a], and he went out and struck him down, and he died. So the kingdom was established in the hand of Solomon.
translation:
  language: tl
  text: Nag-utos ang hari kay Benaias na anak ni Joiada. Lumabas si Benaias at sinaktan niya ito, kaya namatay ito. Sa gayon, naging matatag ang kaharian sa kamay ni Solomon.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “naging matatag sa ilalim ng pamamahala ni Solomon.” Ang literal na “sa kamay ni Solomon” ay isang idyomang Hebreo na nagpapahayag ng kapangyarihan o pamamahala.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו הַמֶּלֶךְ
  choice: Nag-utos ang hari
  rationale: Tuwirang ipinapahayag ng צוה ang makapangyarihang utos ng hari; likas sa makabagong Tagalog ang “nag-utos ... kay” kahit ipinahihiwatig lamang ng konteksto ang nilalaman ng utos.
- source_word: בְּנָיָהוּ בֶן יְהוֹיָדָע
  choice: Benaias na anak ni Joiada
  rationale: Ginamit ang nakaugaliang anyo ng mga pangalang biblikal sa Tagalog at natural na ipinahayag ang ugnayang ama-anak.
- source_word: וַיֵּצֵא
  choice: Lumabas si Benaias
  rationale: Literal na nangangahulugang “lumabas.” Inulit ang pangalan upang malinaw sa Tagalog kung sino ang gumagawa ng kilos.
- source_word: וַיִּפְגַּע בּוֹ
  choice: pinabagsak niya ang taong iyon
  rationale: Sa konteksto ng paglalapat ng hatol, ang פגע בּ ay tumutukoy sa marahas na pananakit o pagpabagsak. Hindi ito isinaling simpleng “pinatay” upang mapanatili ang kasunod at hiwalay na pahayag na namatay ang tao.
- source_word: וַיָּמֹת
  choice: at namatay ito
  rationale: Pinananatili ang tahasang resulta at ang sunod-sunod na daloy ng salaysay sa Hebreo.
- source_word: וְהַמַּמְלָכָה
  choice: Sa gayon, ... ang kaharian
  rationale: Ang ממלכה ay maaaring tumukoy sa kaharian o paghahari. Ang “kaharian” ay malawak at natural, habang inilalabas ng “Sa gayon” ang bunga ng naunang pangyayari.
- source_word: נָכוֹנָה
  choice: naging matatag
  rationale: Ang Niphal ng כון ay nagsasaad ng pagiging matatag, tiyak, o lubos na naitatag. Likas at malinaw sa Tagalog ang “naging matatag.”
- source_word: בְּיַד שְׁלֹמֹה
  choice: sa kamay ni Solomon
  rationale: Pinananatili ang larawang Hebreo ng “kamay,” na nagpapahayag ng kapangyarihan, pamamahala, o pag-aari; ipinaliliwanag sa talababa ang diwa ng idyoma.
theological_decisions:
- issue: Kung ang מַמְלָכָה ay tumutukoy sa nasasakupang kaharian o sa paghahari ni Solomon
  choice: kaharian
  alternative: paghahari
  rationale: Parehong posible sa leksikon at konteksto, ngunit ang “kaharian” ang mas tuwirang katumbas at hindi nito isinasara ang mas malawak na diwa ng matatag na kapangyarihang maharlika.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Iniwasan ang lipas na pananalita ngunit pinanatili ang idyomang “sa kamay” dahil nauunawaan ito at mahalaga ang larawan sa tekstong Hebreo. Inulit ang “Benaias” at ginamit ang “ang taong iyon” upang maiwasan ang nakalilitong sunod-sunod na panghalip sa Tagalog nang hindi nagdaragdag ng pangalan na wala sa mismong talata.
