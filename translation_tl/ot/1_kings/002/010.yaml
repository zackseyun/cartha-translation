  yaml_path: translation/ot/1_kings/002/010.yaml
  text: Then David slept with his fathers and was buried in the city of David[a].
translation:
  language: tl
  text: Pagkatapos, nahimlay si David kasama ng kanyang mga ninuno[a] at inilibing sa Lungsod ni David.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “nahiga o natulog kasama ng kanyang mga ninuno,” isang karaniwang pahayag na nangangahulugang namatay.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: nahimlay
  rationale: Ang שׁכב ay literal na ‘humiga’ o ‘matulog,’ ngunit sa pormulang ito ng pagkamatay ng hari ay tumutukoy sa pagpanaw. Pinananatili ng ‘nahimlay’ ang marangal na larawang may kaugnayan sa paghiga at pamamahinga, habang likas na ipinahihiwatig sa makabagong Filipino ang kamatayan.
- source_word: עִם אֲבֹתָיו
  choice: kasama ng kanyang mga ninuno
  rationale: Ang אבות sa pormulang ito ay tumutukoy sa mga naunang salinlahi. Mas natural at mas tumpak sa saklaw ang ‘mga ninuno’ kaysa literal na ‘mga ama,’ nang hindi nawawala ang ugnayang angkan.
- source_word: וַיִּקָּבֵר
  choice: inilibing
  rationale: 'Ang Niphal na anyo ay pasibo: siya ay inilibing. Ang ‘inilibing’ ang payak at natural na katumbas sa Filipino.'
- source_word: בְּעִיר דָּוִד
  choice: sa Lungsod ni David
  rationale: Itinuturing itong nakatatag na pantanging katawagan sa kuta at pook ni David sa Jerusalem; kaya ginamit ang malaking titik sa ‘Lungsod.’
- source_word: וַ
  choice: Pagkatapos
  rationale: Isinusulong ng waw ang pagkakasunod-sunod ng salaysay. Likas na ipinahahayag ng ‘Pagkatapos’ ang transisyong ito sa Filipino.
theological_decisions:
- issue: Ang ‘nahimlay kasama ng kanyang mga ninuno’ bilang pormula ng kamatayan
  choice: Pinanatili ang larawang pampanitikan sa halip na palitan lamang ng ‘namatay.’
  alternative: Pumanaw si David
  rationale: Ang pormula ay isang karaniwang pahayag ng kamatayan sa Hebreo, ngunit hindi nito sa talatang ito lamang nililinaw ang anumang partikular na doktrina tungkol sa kalagayan pagkatapos mamatay. Ang salin ay nagpapanatili sa larawan at sa likas nitong pahiwatig nang hindi nagdaragdag ng paliwanag na teolohikal.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘nahimlay’ bilang likas na pahayag sa salaysay ng pagkamatay, ‘mga ninuno’ para sa pang-angkan at kolektibong diwa ng אבות, at ‘Lungsod ni David’ bilang pantanging katawagan.
