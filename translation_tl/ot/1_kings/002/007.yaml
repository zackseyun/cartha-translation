  naturalness: Marangal at madaling unawain ang rehistro. Mas natural sa makabagong Filipino ang “taga-Gilead” kaysa “Gileadita,” at ang inayos na ayos ng sugnay para sa כִּי כֵן ay mas maayos na Tagalog.
  terminology: Ang “tapat na kabutihan” ay katanggap-tanggap para sa חֶסֶד at hindi ipinipilit ang teknikal na pagpapakahulugang pangtipan. Napananatili ang “hapag” at ang literal na “lumapit,” na may angkop na paliwanag sa talababa.
