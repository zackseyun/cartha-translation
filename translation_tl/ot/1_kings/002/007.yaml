  text: וְ/לִ/בְנֵ֨י בַרְזִלַּ֤י הַ/גִּלְעָדִי֙ תַּֽעֲשֶׂה חֶ֔סֶד וְ/הָי֖וּ בְּ/אֹכְלֵ֣י שֻׁלְחָנֶ֑/ךָ כִּי כֵן֙ קָרְב֣וּ אֵלַ֔/י בְּ/בָרְחִ֕/י מִ/פְּנֵ֖י אַבְשָׁל֥וֹם אָחִֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/007.yaml
  text: But show kindness to the sons of Barzillai the Gileadite[a], and let them be among those who eat at your table[c][b], for this is how they came near to me when I fled from Absalom your brother.
translation:
  language: tl
  text: Ngunit magpakita ka ng tapat na kabutihan sa mga anak ni Barzilai na taga-Gilead[a], at ibilang mo sila sa mga kumakain sa iyong hapag[b], sapagkat sa gayong paraan sila lumapit sa akin[c] nang tumakas ako mula kay Absalom na iyong kapatid.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “gumawa ka ng kabutihan sa mga anak ni Barzilai.” Ang pariralang Hebreo ay maaaring magpahiwatig ng kabutihang may katapatan, hindi lamang mabuting damdamin.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “mapabilang sila sa mga kumakain sa iyong hapag”—isang larawan ng patuloy na pagtustos at pabor ng hari.
    reason: cultural_note
  - marker: c
    text: Maaari ring “pumanig sila sa akin” o “dumating sila sa akin.” Sa literal, “lumapit sila sa akin,” na sa kontekstong ito ay nagpapahiwatig na sinuportahan nila si David habang tumatakas siya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלִבְנֵי
  choice: Ngunit ... sa mga anak ni
  rationale: Ang waw ay nagpapatuloy sa mga tagubilin ni David ngunit may bahagyang panalungat na diwa kasunod ng naunang utos. Ang “mga anak ni” ay likas sa Tagalog at angkop sa mga lalaking anak o inapo ni Barzilai.
- source_word: בַרְזִלַּי הַגִּלְעָדִי
  choice: Barzilai na Gileadita
  rationale: Isinalin sa baybay-Tagalog ang pangalang pantangi at ginamit ang kinagisnang anyong “Gileadita” para sa katawagang heograpiko.
- source_word: תַּעֲשֶׂה חֶסֶד
  choice: magpakita ka ng tapat na kabutihan
  rationale: Ang pariralang עשה חסד ay tumutukoy sa aktuwal na pagkilos na may kabutihan at katapatan. Iningatan ng “tapat na kabutihan” ang mas malalim na diwa ng חֶסֶד nang hindi awtomatikong nililimitahan ito sa isang teknikal na tipan.
- source_word: וְהָיוּ
  choice: at ibilang mo sila
  rationale: Sa kontekstong pautos, ang anyo ay may diwang jussive. Ang “ibilang mo sila” ay natural na nagpapahayag na dapat silang mapasama sa tinutukoy na pangkat.
- source_word: בְּאֹכְלֵי שֻׁלְחָנֶךָ
  choice: sa mga kumakain sa iyong hapag
  rationale: Pinananatili nito ang konkretong larawan ng mga regular na kumakain sa hapag ng hari, na nagpapahiwatig ng patuloy na pagtustos at pagpapahalaga.
- source_word: כִּי כֵן
  choice: sapagkat gayon
  rationale: Pinananatili ng “sapagkat” ang pagbibigay-dahilan at ng “gayon” ang pagtutumbas sa paraan ng kabutihang ipinakita nila kay David.
- source_word: קָרְבוּ אֵלַי
  choice: sila lumapit sa akin
  rationale: Ang salitang-ugat קרב ay literal na “lumapit.” Hindi isinara ng salin ang pahiwatig na sila ay lumapit upang sumuporta o tumulong.
- source_word: בְּבָרְחִי מִפְּנֵי
  choice: nang tumakas ako mula kay
  rationale: Ang infinitive construct ay temporal, kaya natural ang “nang tumakas ako”; ang מִפְּנֵי sa konteksto ng pagtakas ay malinaw na naipahahayag ng “mula kay.”
- source_word: אַבְשָׁלוֹם אָחִיךָ
  choice: Absalom na iyong kapatid
  rationale: Pinanatili ang katawagang pampamilya dahil mahalaga ito sa pampamilya at pampolitikang konteksto ng bilin ni David kay Solomon.
theological_decisions:
- issue: Saklaw ng חֶסֶד
  choice: tapat na kabutihan
  alternative: kabutihan; katapatan sa tipan
  rationale: Ipinahihiwatig ng konteksto ang kabutihang may katapatan at pagganti sa naunang suporta, ngunit hindi kinakailangang gawing teknikal na terminong “katapatan sa tipan.”
- issue: Diwa ng קָרְבוּ אֵלַי
  choice: lumapit sa akin
  alternative: pumanig sa akin; tumulong sa akin
  rationale: Pinanatili ang literal at posibleng malawak na diwa ng Hebreo habang ipinapaliwanag sa talababa ang malinaw na pahiwatig ng pagsuporta.
translation_notes:
  register: Makabago ngunit marangal na Tagalog. Ginamit ang “hapag” upang mapanatili ang maharlikang larawan nang hindi nagiging lipas o mahirap unawain; iniwasan ang sobrang teknikal na pananalitang teolohiko.
