id: 1KI.2.12
reference: 1 Kings 2:12
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וּ/שְׁלֹמֹ֕ה יָשַׁ֕ב עַל כִּסֵּ֖א דָּוִ֣ד אָבִ֑י/ו וַ/תִּכֹּ֥ן מַלְכֻת֖/וֹ מְאֹֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/012.yaml
  text: And Solomon sat on the throne of David his father[a], and his kingdom was firmly established.
translation:
  language: tl
  text: At naupo si Solomon sa trono ng kanyang amang si David, at lubos na naging matatag ang kanyang paghahari.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “at lubos na naging matatag ang kanyang kaharian” o “at naging lubhang panatag ang kanyang paghahari.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשַׁב
  choice: naupo
  rationale: Sa pariralang עַל כִּסֵּא at sa konteksto ng paghalili sa hari, tumutukoy ito sa pag-upo at paghahari mula sa trono; pinananatili ng “naupo” ang larawan ng Hebreo nang natural sa Filipino.
- source_word: כִּסֵּא
  choice: trono
  rationale: Malinaw na maharlikang luklukan ang tinutukoy sa konteksto ng paghalili ni Solomon kay David.
- source_word: אָבִיו
  choice: kanyang amang si David
  rationale: Literal na ama ni Solomon si David; ang ayos na ito ay natural at malinaw sa Filipino.
- source_word: וַתִּכֹּן
  choice: naging matatag
  rationale: Ang Niphal ng כון ay nagsasaad ng pagiging matatag, tiyak, o ligtas bilang kalagayang natamo.
- source_word: מַלְכֻתוֹ
  choice: kanyang paghahari
  rationale: Maaaring mangahulugan ang מַלְכוּת ng kaharian, pagkamaharlika, o paghahari. Dito, ang katatagan ng pamumuno ni Solomon matapos siyang maluklok ang tuwirang diin, kaya mas natural at tumpak ang “paghahari.”
- source_word: מְאֹד
  choice: lubos
  rationale: Pinananatili nito ang tahasang pagpapalakas ng מְאֹד nang hindi inilalagay ang diin sa paraang hindi natural sa Filipino.
theological_decisions:
- issue: Wika ng paghalili sa trono ni David
  choice: Isinalin bilang makasaysayang pahayag tungkol sa pagluklok ni Solomon at sa pagiging matatag ng kanyang paghahari.
  alternative: Gumamit ng mas teolohikal na pananalitang tahasang nagbibigay-diin sa lehitimong dinastiya o sa mesiyanikong kahulugan.
  rationale: Inilalahad mismo ng talata ang paghalili ni Solomon kay David ngunit hindi nito tahasang binabanggit ang mas malawak na mesiyanikong kahulugan; kaya hindi iyon idinagdag sa salin.
- issue: Saklaw ng מַלְכֻתוֹ
  choice: paghahari
  alternative: kaharian
  rationale: Kapuwa posible sa Hebreo. Mas angkop sa agarang konteksto ang katatagan ng paghahari o pamamahala ni Solomon, ngunit pinananatili sa talababa ang lehitimong alternatibong “kaharian.”
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang konkretong larawan ng pag-upo sa trono, samantalang ginamit ang “paghahari” upang natural na ipahayag ang katatagan ng pamumuno. Inilagay ang talababa matapos ang sugnay na tinutukoy nito.
