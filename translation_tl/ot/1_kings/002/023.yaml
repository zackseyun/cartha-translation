  to: Pagkatapos, sumumpa si Haring Solomon sa pangalan ni Yahweh[a], na sinabi, “Gayon nawa ang gawin ng Diyos sa akin, at lalo pa, sapagkat sinabi ni Adonias ang bagay na ito sa ikapapahamak ng sarili niyang buhay.”[b]
