base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/023.yaml
  text: Then King Solomon swore by Yahweh[a], saying, “May God do so to me, and more also[b], for Adonijah has spoken this word against his own life.”
translation:
  language: tl
  text: Pagkatapos, sumumpa si Haring Solomon sa pangalan ni Yahweh[a], na sinabi, “Gayon nawa ang gawin ng Diyos sa akin, at lalo pa, sapagkat sinabi ni Adonias ang bagay na ito sa ikapapahamak ng sarili niyang buhay.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Hebreong banal na pangalan ay יהוה (YHWH), na karaniwan ding isinasalin bilang “ang PANGINOON.”
    reason: alternative_reading
  - marker: b
    text: 'Idyoma sa Hebreo: “sinabi ang bagay na ito sa/kasama ng kanyang buhay.” Ibig sabihin, nagsalita siya sa paraang nagsapanganib o maaaring magpahamak sa kanyang buhay.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׁבַע
  choice: sumumpa
  rationale: Likas at tuwirang salin ng pandiwang nangangahulugang manumpa o gumawa ng panata.
- source_word: בַּיהוָה
  choice: sa pangalan ni Yahweh
  rationale: Ang בְּ kasama ng banal na pangalan ay tumutukoy sa Diyos na pinanunumpaan. Nilinaw ng karaniwang ekspresyong Filipino na 'sa pangalan ni' ang gamit nito sa panunumpa, habang pinananatili ang pangalang Yahweh.
- source_word: כֹּה יַעֲשֶׂה לִּי אֱלֹהִים וְכֹה יוֹסִיף
  choice: Gayon ang gawin sa akin ng Diyos, at dagdagan pa niya
  rationale: Pinananatili ang tradisyonal na pormula ng sumpang nagpapahiwatig ng di-tiyak na kaparusahan, sa natural ngunit marangal na Filipino.
- source_word: אֱלֹהִים
  choice: Diyos
  rationale: Bagaman anyong maramihan sa Hebreo, tumutukoy ito rito sa iisang Diyos at nangangailangan ng pang-isahang salin.
- source_word: כִּי
  choice: sapagkat
  rationale: Sa kontekstong ito, ipinakikilala nito ang dahilan o mariing batayan ng sumpa, hindi isang kondisyong may di-hayag na pagtanggi.
- source_word: בְנַפְשׁוֹ
  choice: kapalit ng sarili niyang buhay
  rationale: Ipinahihiwatig ng idyoma na ang sinabi ni Adonias ay magdudulot ng pagkawala ng kanyang buhay; pinananatili nito ang bigat ng kapalit o kabayaran nang hindi labis na ipinapaliwanag sa teksto.
- source_word: דִּבֶּר ... אֶת־הַדָּבָר הַזֶּה
  choice: sinabi ... ang bagay na ito
  rationale: Natural na Filipino para sa literal na 'nagsalita ng bagay/salitang ito,' habang pinananatili ang pagtukoy sa mismong kahilingan.
- source_word: אֲדֹנִיָּהוּ
  choice: Adonias
  rationale: Ginamit ang nakaugaliang anyong Filipino ng pangalang biblikal.
theological_decisions:
- issue: Paglalarawan sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: ang PANGINOON
  rationale: Tuwirang ginagamit ng talata ang Tetragrammaton; pinananatili ng 'Yahweh' ang personal na pangalan sa halip na palitan ito ng titulo.
- issue: Lakas ng pahayag tungkol sa buhay ni Adonias
  choice: kapalit ng sarili niyang buhay
  alternative: laban sa sarili niyang buhay
  rationale: Ipinakikita ng konteksto na itinuring ni Solomon ang kahilingan bilang bagay na nagkakahalaga ng buhay ni Adonias, ngunit hindi dinaragdagan ang teksto ng mas tiyak na doktrinal o legal na paliwanag.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang pormal at mabigat na himig ng panunumpa, ngunit gumamit ng natural na ayos ng pangungusap. Ang mga talababa ay minarkahan sa pangunahing teksto.
