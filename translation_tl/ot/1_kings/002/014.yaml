  text: Pagkatapos ay sinabi niya[a], “May sasabihin ako sa iyo.” At sinabi niya, “Magsalita ka.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “May isang salita/bagay ako para sa iyo.” Ang idyoma ay nangangahulugang “May sasabihin ako sa iyo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Pagkatapos ay sinabi niya
  rationale: Ang wayyiqtol ng אָמַר ay nagsasaad ng kasunod na kilos sa salaysay; natural na ipinahahayag ito ng “Pagkatapos ay sinabi niya.”
- source_word: דָּבָר לִי אֵלָיִךְ
  choice: May sasabihin ako sa iyo
  rationale: Literal itong tumutukoy sa isang “salita/bagay” na nasa tagapagsalita para sa kausap, ngunit isa itong idyomang nangangahulugang may nais siyang sabihin. Ang saling ito ay likas at malinaw sa modernong Tagalog.
- source_word: וַתֹּאמֶר
  choice: Sumagot siya
  rationale: Bagaman literal na “at sinabi niya,” tugon ito sa naunang pahayag. Ang “Sumagot siya” ay natural na pagpapatuloy ng usapan at hindi nagdaragdag ng nilalaman.
- source_word: דַּבֵּר
  choice: Magsalita ka
  rationale: Tuwirang katumbas ito ng panlalaking isahan na pautos ng דָּבַר at pinananatili ang maikli at tuwirang tugon.
