id: 1KI.2.45
reference: 1 Kings 2:45
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/הַ/מֶּ֥לֶךְ שְׁלֹמֹ֖ה בָּר֑וּךְ וְ/כִסֵּ֣א דָוִ֗ד יִהְיֶ֥ה נָכ֛וֹן לִ/פְנֵ֥י יְהוָ֖ה עַד עוֹלָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/045.yaml
  text: But King Solomon will be blessed[a], and the throne of David will be established before Yahweh forever.
translation:
  language: tl
  text: Ngunit pagpapalain si Haring Solomon[a], at ang trono ni David ay magiging matatag sa harap ni Yahweh magpakailanman.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “pinagpala si Haring Solomon.” Maaaring basahin ang panaguri sa Hebreo bilang pangkasalukuyang pahayag, bagaman sinusuportahan din ng konteksto ang saling nakatuon sa hinaharap na ginamit sa teksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/הַ/מֶּלֶךְ שְׁלֹמֹה
  choice: Ngunit ... si Haring Solomon
  rationale: Ang וְ ay nagpapakita rito ng pagsalungat sa kapahamakang ipinahayag kay Shimei sa naunang talata, kaya natural ang “Ngunit.” Ang מֶלֶךְ שְׁלֹמֹה ay isinaling “Haring Solomon,” ang karaniwang ayos sa modernong Filipino.
- source_word: בָּרוּךְ
  choice: pagpapalain
  rationale: Ang anyo ay maaaring unawain bilang “pinagpala” o bilang pahayag na nakatuon sa hinaharap. Dahil kaagapay nito ang susunod na sugnay na may hinaharap na diwa, “pagpapalain” ang ginamit sa pangunahing teksto, habang pinananatili sa talababa ang tunay na posibilidad ng pangkasalukuyang pagbasa.
- source_word: וְ/כִסֵּא דָוִד
  choice: at ang trono ni David
  rationale: Tuwirang tinutumbasan ng “trono” ang כִּסֵּא, at natural na ipinapahayag sa Filipino ang construct na may pangalang pantangi sa pamamagitan ng “ni David.”
- source_word: יִהְיֶה נָכוֹן
  choice: ay magiging matatag
  rationale: Ang parirala ay nagsasaad na ang trono ay matibay, tiyak, o matatag na nakatatag. Ang “magiging matatag” ay natural sa Filipino at pinananatili ang hinaharap na diwa at ang dinastikong larawan.
- source_word: לִ/פְנֵי יְהוָה
  choice: sa harap ni Yahweh
  rationale: Ang לִפְנֵי ay literal na “sa harap ng” o “sa presensiya ng.” Ang “sa harap ni Yahweh” ay maikli, natural, at malapit sa Hebreo.
- source_word: עַד עוֹלָם
  choice: magpakailanman
  rationale: Karaniwang marangal at malinaw na salin ito ng pariralang nangangahulugang “habang panahon” o “magpakailanman.”
theological_decisions:
- issue: Pagbigkas at pagsasalin ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehovah
  rationale: Ginamit ang pangalang “Yahweh” upang katawanin nang tuwiran ang Tetragrammaton at hindi ito palitan ng isang titulo.
- issue: Panahunan o puwersa ng בָּרוּךְ
  choice: 'nakatuon sa hinaharap: “pagpapalain”'
  alternative: 'pangkasalukuyan: “pinagpala”'
  rationale: Walang hayag na pandiwa ang sugnay sa Hebreo, kaya kapuwa posible ang pangkasalukuyan at hinaharap na pagbasa. Pinili sa teksto ang hinaharap dahil sa konteksto at sa kasunod na יִהְיֶה, ngunit tahasang inilalahad sa talababa ang alternatibo.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “trono,” “sa harap ni Yahweh,” at “magpakailanman” upang mapanatili ang maharlika at tipanang himig nang hindi nagiging lipas o labis na teknikal.
