  text: I am going the way of all the earth. So be strong[a], and be a man,
translation:
  language: tl
  text: “Ako'y patungo na sa landas ng lahat ng nasa lupa. Kaya magpakatatag ka at maging lalaki[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “magpakalalaki” o “ipakita mong lalaki ka.” Pinagsasama ng Hebreong pananalita ang pagiging lalaki at ang pagkilos nang may tapang at pananagutan.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָנֹכִי
  choice: Ako'y
  rationale: Ang malayang panghalip na unang panauhan ay likas na isinasalin bilang “ako”; ang pinaikling “Ako'y” ay marangal at natural sa pangungusap.
- source_word: הֹלֵךְ
  choice: patungo na
  rationale: Ang Qal participle kasama ng panghalip ay nagpapahiwatig ng nalalapit na pagpanaw. Ipinahahayag ng “patungo na” ang kilos at nalalapit na panahon nang hindi tahasang pinapalitan ang talinghaga ng “mamamatay na.”
- source_word: בְּדֶרֶךְ כָּל הָאָרֶץ
  choice: sa hantungan ng lahat ng tao sa lupa
  rationale: Literal itong “sa daan ng buong lupa,” isang idyoma para sa karaniwang hantungan ng mga tao, ang kamatayan. Mas malinaw sa makabagong Tagalog ang “hantungan ng lahat ng tao sa lupa” habang pinananatili ang matalinghagang pahayag.
- source_word: וְחָזַקְתָּ
  choice: Kaya magpakatatag ka
  rationale: Bagaman anyong perfect na may waw, gumaganap itong paghihikayat sa konteksto. Ang “magpakatatag” ay natural na utos na sumasaklaw sa lakas ng loob at paninindigan.
- source_word: וְהָיִיתָ לְאִישׁ
  choice: at magpakalalaki
  rationale: Ang Hebreo ay literal na “at maging isang lalaki,” ngunit sa Tagalog ang “magpakalalaki” ay mas likas na exhortasyon sa isang anak na lalaki at maaaring magpahiwatig ng matapang at responsableng pagkilos. Nililinaw ng talababa ang literal at mga posibleng diwa.
theological_decisions:
- issue: Panlalaking pahayag sa paghihikayat
  choice: magpakalalaki
  alternative: maging lalaki; ipakita mong isa kang lalaki
  rationale: Partikular na lalaki si Solomon at tahasang panlalaki ang אִישׁ. Pinananatili ang kasarian at puwersa ng ama-sa-anak na bilin, ngunit nililinaw na ang konteksto ay katatagan at pananagutan, hindi isang makabagong stereotype tungkol sa pagkalalaki.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang talinghaga tungkol sa kamatayan ngunit ginawang madaling maunawaan ang idyomang Hebreo; iniwasan ang kolokyal na “magpakalalake” at ginamit ang pamantayang baybay na “magpakalalaki.”
