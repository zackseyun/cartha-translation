  text: וַ/יָּבֹ֞א אֲדֹנִיָּ֣הוּ בֶן חַגֵּ֗ית אֶל בַּת שֶׁ֨בַע֙ אֵם שְׁלֹמֹ֔ה וַ/תֹּ֖אמֶר הֲ/שָׁל֣וֹם בֹּאֶ֑/ךָ וַ/יֹּ֖אמֶר שָׁלֽוֹם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/013.yaml
  text: Then Adonijah son of Haggith came to Bathsheba[a], the mother of Solomon, and she said, “Do you come in peace?” And he said, “In peace.”
translation:
  language: tl
  text: Pagkatapos, pumunta kay Batsheba na ina ni Solomon si Adonias na anak ni Haguit. Tinanong siya ni Batsheba, “Mapayapa ba ang pagparito mo?”[a] Sumagot siya, “Mapayapa.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas literal, “Kapayapaan ba ang pagparito mo?”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: pumunta
  rationale: Ang בוא ay maaaring mangahulugang ‘pumarito’ o ‘pumunta’ ayon sa pananaw. Dito, likas sa salaysay na sabihing pumunta si Adonias kay Batsheba.
- source_word: אֲדֹנִיָּהוּ
  choice: Adonias
  rationale: Ginamit ang nakaugaliang makabagong anyo ng pangalan sa Filipino.
- source_word: בֶן חַגֵּית
  choice: anak ni Haguit
  rationale: Likas na salin sa Filipino ng pariralang nagpapakilala kay Adonias sa pamamagitan ng pangalan ng kanyang ina.
- source_word: בַּת שֶׁבַע
  choice: Batsheba
  rationale: Isinalin sa karaniwang anyong Filipino ang personal na pangalan habang pinananatiling malapit sa Hebreo.
- source_word: אֵם שְׁלֹמֹה
  choice: ina ni Solomon
  rationale: Pinananatili ang tahasang pagkakakilanlan kay Batsheba bilang ina ni Solomon, na mahalaga sa tagpo.
- source_word: הֲשָׁלוֹם בֹּאֶךָ
  choice: Mapayapa ba ang pagparito mo?
  rationale: Ipinahahayag ng שָׁלוֹם ang tanong kung mapayapa ang layunin ng pagdating. Pinananatili ng salin ang anyo at bahagyang pag-iingat ng tanong nang hindi dinaragdagan ang kahulugan.
- source_word: שָׁלוֹם
  choice: Mapayapa.
  rationale: Maikli at eliptikal ang tugon sa Hebreo at inuulit nito ang mahalagang salita sa tanong; gayon din ang ginawa sa Filipino.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang maikling tugon at ang pag-uulit ng ‘mapayapa’ upang maipakita ang anyo at tensiyon ng usapan sa Hebreo.
