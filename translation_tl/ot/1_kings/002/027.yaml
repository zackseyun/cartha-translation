  text: וַ/יְגָ֤רֶשׁ שְׁלֹמֹה֙ אֶת אֶבְיָתָ֔ר מִ/הְי֥וֹת כֹּהֵ֖ן לַֽ/יהוָ֑ה לְ/מַלֵּא֙ אֶת דְּבַ֣ר יְהוָ֔ה אֲשֶׁ֥ר דִּבֶּ֛ר עַל בֵּ֥ית עֵלִ֖י בְּ/שִׁלֹֽה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/027.yaml
  text: So Solomon drove Abiathar out from being priest to Yahweh[b][a], fulfilling the word of Yahweh that he had spoken concerning the house of Eli in Shiloh.
translation:
  language: tl
  text: Kaya pinalayas ni Solomon si Abiatar sa pagiging pari ni Yahweh, at sa gayon ay natupad[a] ang salita ni Yahweh na sinabi ni Yahweh tungkol sa sambahayan ni Eli sa Shilo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “upang tuparin ang salita ni Yahweh.” Maaaring magpahayag ng layunin o bunga ang Hebreo.
    reason: alternative_reading
  - marker: b
    text: Tingnan ang 1 Samuel 2:27–36 at 3:11–14 tungkol sa salitang sinabi laban sa sambahayan ni Eli.
    reason: cross_reference
lexical_decisions:
- source_word: וַיְגָרֶשׁ
  choice: pinalayas
  rationale: Malinaw nitong ipinahahayag ang sapilitang pag-aalis kay Abiatar sa tungkulin, ayon sa lakas ng pandiwang גרשׁ.
- source_word: מִהְיוֹת כֹּהֵן
  choice: sa pagiging pari
  rationale: Kasama ng 'pinalayas,' natural nitong ipinahahayag ang pag-aalis sa isang kalagayan o tungkulin.
- source_word: כֹּהֵן לַיהוָה
  choice: pari ni Yahweh
  rationale: Natural sa modernong Tagalog at malinaw na tumutukoy sa paring naglilingkod kay Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos sa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: לְמַלֵּא
  choice: at sa gayon ay natupad
  rationale: Ipinapakita ang bunga ng ginawa ni Solomon nang hindi tiyak na ipinapalagay na ang pagtupad sa propesiya ang kaniyang sinadyang motibo.
- source_word: דְּבַר יְהוָה
  choice: ang salita ni Yahweh
  rationale: Tumpak at pamilyar na pananalita para sa naunang pahayag ng Diyos.
- source_word: אֲשֶׁר דִּבֶּר
  choice: na sinabi niya
  rationale: Natural sa Tagalog; malinaw sa konteksto na si Yahweh ang tinutukoy ng panghalip.
- source_word: עַל בֵּית עֵלִי
  choice: tungkol sa sambahayan ni Eli
  rationale: Pinananatili ang malawak na kahulugan ng עַל bilang 'tungkol sa'; makikita sa konteksto at cross-reference na ito ay pahayag ng hatol.
- source_word: בְּשִׁלֹה
  choice: sa Shilo
  rationale: Karaniwang locative na anyo sa Tagalog para sa pangalang pook.
theological_decisions:
- issue: Ugnayan ng ginawa ni Solomon at ng naunang salita ni Yahweh
  choice: Inilalahad ang pagpapaalis kay Abiatar bilang pangyayaring nagbunga sa katuparan ng naunang salita ni Yahweh.
  alternative: 'Maaaring layunin ang diin: ''upang tuparin ang salita ni Yahweh.'''
  rationale: Ang לְמַלֵּא ay maaaring magpahayag ng layunin o bunga. Ang 'at sa gayon ay natupad' ay nag-iingat sa ugnayang teolohikal nang hindi ipinapasya ang panloob na layunin ni Solomon.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang 'sambahayan' para sa dinastiko at pampamilyang diwa ng בֵּית, at pinanatili ang pangalang Yahweh.
