base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/022.yaml
  text: King Solomon answered and said to his mother[a], “Why are you asking for Abishag the Shunammite for Adonijah? Ask for the kingship for him as well, since he is my older brother—and for him, for Abiathar the priest, and for Joab son of Zeruiah!”
translation:
  language: tl
  text: Sumagot si Haring Solomon at sinabi sa kanyang ina, “Bakit mo hinihingi si Abisag na Sunamita para kay Adonias? Hingin mo na rin para sa kanya ang paghahari[a], sapagkat siya ang kuya ko—at para sa kanya, para kay Abiatar na pari, at para kay Joab na anak ni Zeruia!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “kaharian” o “trono.” Ang salitang Hebreo ay maaaring tumukoy nang mas malawak sa kapangyarihan o pamamahalang hari; dito, itinatampok ng “paghahari” na may dinastikong kahulugan ang kahilingan ni Adonias.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן הַמֶּלֶךְ שְׁלֹמֹה וַיֹּאמֶר לְאִמּוֹ
  choice: Sumagot si Haring Solomon at sinabi sa kanyang ina
  rationale: Pinananatili ang dalawang pandiwang Hebreo at ang pagtukoy lamang sa “kanyang ina,” nang hindi idinaragdag ang pangalang Batseba mula sa konteksto.
- source_word: אֲבִישַׁג הַשֻּׁנַמִּית
  choice: Abisag na Sunamita
  rationale: Likas na anyong Tagalog para sa pangalan at katawagang nag-uugnay kay Abisag sa Sunem.
- source_word: שֹׁאֶלֶת ... לַאֲדֹנִיָּהוּ
  choice: hinihingi ... para kay Adonias
  rationale: Ang “hinihingi” ay angkop sa kahilingang ibigay si Abisag kay Adonias at pinananatili ang benepisyaryong ipinahihiwatig ng pang-ukol.
- source_word: וְשַׁאֲלִי לוֹ אֶת הַמְּלוּכָה
  choice: Hingin mo na rin para sa kanya ang paghahari
  rationale: Ipinahahayag ng “na rin” ang mapanuya at papataas na diin ng sagot; ang “paghahari” ay tumutukoy sa karapatan o kapangyarihang maharlika, hindi lamang sa lupain.
- source_word: כִּי הוּא אָחִי הַגָּדוֹל מִמֶּנִּי
  choice: sapagkat siya ang kapatid kong nakatatanda sa akin
  rationale: Tumpak na pinananatili ang diin sa pagkakasunod ng kapanganakan sa marangal at malinaw na modernong Tagalog.
- source_word: וְלוֹ וּלְאֶבְיָתָר הַכֹּהֵן וּלְיוֹאָב בֶּן צְרוּיָה
  choice: —para sa kanya, para kay Abiatar na pari, at para kay Joab na anak ni Zeruia!
  rationale: Pinananatili ang eliptikal at biglang pangwakas na talaan sa Hebreo, pati ang pag-uulit ng ugnayang “para,” nang hindi tahasang ipinapaliwanag ang papel ng mga kaalyado.
theological_decisions:
- issue: Pampolitika at dinastikong kahulugan ng kahilingan kay Abisag
  choice: Isinalin ang הַמְּלוּכָה bilang “paghahari,” kaya lantad na ang tingin ni Solomon sa kahilingan ay kaugnay ng pag-angkin sa kapangyarihang maharlika.
  alternative: “kaharian” o “trono”
  rationale: Ang mismong Hebreo ang nag-uugnay sa kahilingan kay Abisag sa royal rule. Ang “paghahari” ay nagpapanatili ng ugnayang iyon nang hindi nililimitahan ang salita sa teritoryo o sa literal na luklukan.
- issue: Ugnayan nina Adonias, Abiatar, at Joab sa pangwakas na sugnay
  choice: 'Pinanatili ang eliptikal na pagkakahanay: “para sa kanya, para kay Abiatar ... at para kay Joab.”'
  alternative: Ipaliwanag silang mga kaalyado ni Adonias o sabihing para rin sa kanila ang kaharian.
  rationale: Hindi ganap na nililinaw ng sintaks ng Hebreo ang eksaktong saklaw ng kahilingan. Ang literal ngunit likas na pagkakahanay ay nagpapanatili sa tunay na kalabuan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “nakatatanda sa akin” sa halip na mas kolokyal na “kuya,” at pinanatili ang matalim at mapanuyang himig ng tugon ni Solomon. Ang talababa [a] ay inilagay mismo sa “paghahari,” na siyang salitang tinatalakay nito.
