  naturalness: Marangal at madaling maunawaan ang kabuuan. Mas likas at malinaw sa modernong Tagalog ang "kuya ko" para sa "my older brother."
  terminology: Ang "paghahari" ay angkop para sa הַמְּלוּכָה sa kontekstong ito. Sa talababa, gayunman, ang "pamamahalang maharlika" ay maaaring mangahulugang pamamahala ng mga maharlika/aristokrata, hindi royal rule; dapat itong palitan ng "kapangyarihan o pamamahalang hari."
