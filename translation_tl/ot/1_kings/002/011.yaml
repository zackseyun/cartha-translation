  text: וְ/הַ/יָּמִ֗ים אֲשֶׁ֨ר מָלַ֤ךְ דָּוִד֙ עַל יִשְׂרָאֵ֔ל אַרְבָּעִ֖ים שָׁנָ֑ה בְּ/חֶבְר֤וֹן מָלַךְ֙ שֶׁ֣בַע שָׁנִ֔ים וּ/בִ/ירוּשָׁלִַ֣ם מָלַ֔ךְ שְׁלֹשִׁ֥ים וְ/שָׁלֹ֖שׁ שָׁנִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/011.yaml
  text: The days that David reigned over Israel were forty years. In Hebron he reigned seven years, and in Jerusalem he reigned thirty-three years.
translation:
  language: tl
  text: Apatnapung taon ang ipinaghari ni David sa Israel. Pitong taon siyang naghari sa Hebron, at tatlumpu't tatlong taon siyang naghari sa Jerusalem.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהַיָּמִים אֲשֶׁר מָלַךְ
  choice: ang ipinaghari ni David
  rationale: Ang Hebreong idyomang literal na ‘ang mga araw na naghari’ ay tumutukoy sa haba ng paghahari. Mas natural sa makabagong Tagalog ang ‘ang ipinaghari’ habang pinananatili ang kahulugan ng tagal.
- source_word: מָלַךְ
  choice: naghari
  rationale: Tuwirang ipinapahayag ng ‘naghari’ ang pamumuno bilang hari at angkop sa buod ng paghahari.
- source_word: עַל יִשְׂרָאֵל
  choice: sa Israel
  rationale: Kasama ng pandiwang ‘naghari,’ natural sa Tagalog ang ‘sa Israel’ upang tukuyin ang bayang pinamunuan; ang ‘sa ibabaw ng Israel’ ay hindi idiomatiko.
- source_word: אַרְבָּעִים שָׁנָה
  choice: apatnapung taon
  rationale: Karaniwang anyong Tagalog para sa eksaktong bilang na apatnapung taon.
- source_word: בְּחֶבְרוֹן
  choice: sa Hebron
  rationale: Ang בְּ ay panandang lokatibo rito; ‘sa Hebron’ ang natural na katumbas sa Tagalog.
- source_word: מָלַךְ שֶׁבַע שָׁנִים
  choice: pitong taon siyang naghari
  rationale: Pinananatili ang tahasang pag-uulit ng paghahari at ang eksaktong tagal, sa natural na ayos ng Tagalog.
- source_word: וּבִירוּשָׁלִַם
  choice: at ... sa Jerusalem
  rationale: Pinananatili ang pang-ugnay at lokatibong diwa ng Hebreo.
- source_word: שְׁלֹשִׁים וְשָׁלֹשׁ שָׁנִים
  choice: tatlumpu't tatlong taon
  rationale: Natural na makabagong Tagalog para sa eksaktong kabuuang tatlumpu at tatlong taon.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang ‘ipinaghari’ upang natural na maipahayag ang Hebreong idyoma tungkol sa haba ng paghahari, at inulit ang ‘naghari’ sa dalawang lungsod upang mapanatili ang balangkas ng talata.
