  text: 'Nang nalalapit na ang panahon ng pagkamatay ni David,[a] iniutos niya sa anak niyang si Solomon:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “Nang nalalapit na ang mga araw ni David upang siya ay mamatay”; isang idyomang Hebreo na nangangahulugang nalalapit na ang oras ng kanyang kamatayan.
