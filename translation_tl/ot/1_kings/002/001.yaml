lexical_decisions:
- source_word: וַיִּקְרְבוּ יְמֵי דָוִד לָמוּת
  choice: Nang nalalapit na ang panahon ng pagkamatay ni David
  rationale: Isinasalin nang likas sa modernong Tagalog ang idyomang Hebreo na literal na tumutukoy sa paglapit ng ‘mga araw ni David’ upang mamatay, habang pinananatili ang larawan ng nalalapit na kamatayan.
- source_word: וַיְצַו
  choice: iniutos
  rationale: Ipinakikita ng צוה ang bigat ng isang utos o taimtim na habilin; ang ‘iniutos’ ay malinaw at kasalukuyang gamit sa Tagalog.
- source_word: אֶת־שְׁלֹמֹה בְנוֹ
  choice: sa anak niyang si Solomon
  rationale: Likas na ayos sa Tagalog para sa tuwirang layon at sa kaugnayang ama-anak na tahasang nasa Hebreo.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Ang infinitibong ito ay nagpapakilala sa tuwirang pananalitang kasunod; natural itong kinakatawan sa Tagalog ng tutuldok sa halip na ng mabigat na ‘na sinasabi.’
