  text: וַ/יֹּ֨אמֶר הַ/מֶּ֜לֶךְ אֶל שִׁמְעִ֗י אַתָּ֤ה יָדַ֨עְתָּ֙ אֵ֣ת כָּל הָ/רָעָ֗ה אֲשֶׁ֤ר יָדַע֙ לְבָ֣בְ/ךָ֔ אֲשֶׁ֥ר עָשִׂ֖יתָ לְ/דָוִ֣ד אָבִ֑/י וְ/הֵשִׁ֧יב יְהוָ֛ה אֶת רָעָתְ/ךָ֖ בְּ/רֹאשֶֽׁ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/044.yaml
  text: Then the king said to Shimei[a], “You know all the evil that your heart knows, which you did to David my father[b]; and Yahweh has returned your evil on your own head.”
translation:
  language: tl
  text: Pagkatapos, sinabi ng hari kay Simei, “Alam mo mismo ang lahat ng kasamaang nalalaman ng puso mo, na ginawa mo kay David na aking ama. Ibinalik ni Yahweh ang iyong kasamaan sa sarili mong ulo.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר הַמֶּלֶךְ אֶל שִׁמְעִי
  choice: Pagkatapos, sinabi ng hari kay Simei
  rationale: Isinusulong ng waw-consecutive ang salaysay; natural sa modernong Filipino ang “Pagkatapos.” Ang שִׁמְעִי ay isinaling “Simei,” ang karaniwang anyong Tagalog ng pangalan.
- source_word: אַתָּה יָדַעְתָּ
  choice: Alam mo mismo
  rationale: Ipinahihiwatig ng tahasang panghalip na אַתָּה ang diin; ipinapahayag ito ng “mismo” nang hindi nagiging mabigat.
- source_word: כָּל הָרָעָה
  choice: ang lahat ng kasamaan
  rationale: Ang רָעָה rito ay tumutukoy sa moral na kasamaan o maling ginawa, hindi lamang sa pinsala o kapahamakan.
- source_word: אֲשֶׁר יָדַע לְבָבְךָ
  choice: na nalalaman ng puso mo
  rationale: Pinananatili ang personipikasyon at Hebreong idyoma na ang puso ang nakaaalam, na nagbibigay-diin sa panloob na pagkabatid ni Simei sa kaniyang sala.
- source_word: אֲשֶׁר עָשִׂיתָ לְדָוִד אָבִי
  choice: ang ginawa mo kay David na aking ama
  rationale: Direkta at natural na salin ng sugnay; pinananatili ang personal at marangal na “aking ama.”
- source_word: וְהֵשִׁיב יְהוָה אֶת רָעָתְךָ
  choice: Ibinalik ni Yahweh ... ang iyong kasamaan
  rationale: Ang Hiphil ng שׁוב ay naglalarawan sa pagpapabalik ng kasamaan sa gumawa nito. Ang perpektibo ay natural na naihahayag sa aspektong naganap ng “ibinalik.”
- source_word: בְּרֹאשֶׁךָ
  choice: sa sarili mong ulo
  rationale: Pinananatili ang matinding idyoma ng kaparusahan o pananagutang bumabalik sa mismong gumawa.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehova
  rationale: Personal na pangalan ang tuwirang nasa Hebreo; ang “Yahweh” ay malapit na transliterasyon at hindi ito pinapalitan ng isang titulo.
- issue: Ang pagkilos ng Diyos sa pagganti
  choice: Ibinalik ni Yahweh ... ang iyong kasamaan
  alternative: Ginantihan ni Yahweh ang iyong kasamaan
  rationale: Hayagang iniuugnay ng teksto kay Yahweh ang pagpapabalik ng kasamaan ni Simei. Pinananatili ng “ibinalik” ang larawan ng orihinal at iniiwasang palawakin ito sa higit na interpretatibong “ginantihan.”
- issue: Panloob na pagkabatid ni Simei sa sala
  choice: nalalaman ng puso mo
  alternative: alam mo sa puso mo
  rationale: Pinananatili ang tunay na Hebreong pagpapahayag na ang puso ang nakaaalam, nang hindi nilulutas o pinapaliwanag sa mismong talata ang pahiwatig nitong moral na kamalayan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang Hebreong idyomang “nalalaman ng puso mo” at “sa sarili mong ulo.” Walang talababa sapagkat sapat na malinaw sa teksto ang mga piniling anyo at hindi kailangan ng alternatibong pagbasa para sa publikasyong ito.
