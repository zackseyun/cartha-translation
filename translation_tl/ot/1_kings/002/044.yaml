  to: Pagkatapos, sinabi ng hari kay Simei, “Alam mo mismo ang lahat ng kasamaang nalalaman ng puso mo, na ginawa mo kay David na aking ama. Ibinalik ni Yahweh ang iyong kasamaan sa sarili mong ulo.”
