source:
  edition: WLC
  text: וְ/שָׁ֤בוּ דְמֵי/הֶם֙ בְּ/רֹ֣אשׁ יוֹאָ֔ב וּ/בְ/רֹ֥אשׁ זַרְע֖/וֹ לְ/עֹלָ֑ם וּ/לְ/דָוִ֡ד וּ֠/לְ/זַרְע/וֹ וּ/לְ/בֵית֨/וֹ וּ/לְ/כִסְא֜/וֹ יִהְיֶ֥ה שָׁל֛וֹם עַד עוֹלָ֖ם מֵ/עִ֥ם יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/033.yaml
  text: So their blood shall return on the head of Joab and on the head of his offspring forever[a], but for David and for his offspring and for his house and for his throne, there shall be peace forever from Yahweh.
translation:
  language: tl
  text: Sa gayon, babalik ang kanilang dugo sa ulo ni Joab at sa ulo ng kanyang mga supling magpakailanman[a]. Ngunit para kay David, sa kanyang mga supling, sa kanyang sambahayan, at sa kanyang trono ay magkakaroon ng kapayapaan magpakailanman mula kay Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “ang kanilang dugo ay babalik sa ulo ni Joab at sa ulo ng kanyang mga supling.” Idyoma ito ng pananagutan ni Joab sa dugong ibinubo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁבוּ דְמֵיהֶם בְּרֹאשׁ
  choice: ang pananagutan sa kanilang dugo ay babalik kay
  rationale: Pinananatili ang larawan ng pagbabalik ng dugong ibinubo sa may sala, ngunit ipinahahayag sa likas na Filipino ang hudisyal na diwa ng idyomang Hebreo na literal na 'babalik ang kanilang dugo sa ulo.'
- source_word: זַרְעוֹ
  choice: kanyang mga supling
  rationale: Tumutukoy nang kolektibo sa salinlahi o mga inapo ni Joab at ni David; natural at marangal sa modernong Filipino.
- source_word: לְעֹלָם / עַד עוֹלָם
  choice: magpakailanman
  rationale: Pinananatili ang matibay at pangmatagalang pahayag ng עוֹלָם sa hatol at pangakong pandinastiya.
- source_word: לְדָוִד וּלְזַרְעוֹ וּלְבֵיתוֹ וּלְכִסְאוֹ
  choice: para kay David, sa kanyang mga supling, sa kanyang sambahayan, at sa kanyang trono
  rationale: Ipinakikita ng mga pariralang may ל ang pakinabang o kaugnayan. Pinanatili ang 'trono' dahil mahalaga ang pandinastiyang kahulugan; 'sambahayan' ang likas na salin ng 'bahay' kapag tumutukoy sa angkan o dinastiya.
- source_word: יִהְיֶה שָׁלוֹם
  choice: magkakaroon ng kapayapaan
  rationale: Natural na existential na pahayag sa Filipino at pinananatili ang malawak na diwa ng שָׁלוֹם nang hindi nililimitahan sa kasaganaan lamang.
- source_word: מֵעִם יְהוָה
  choice: mula kay Yahweh
  rationale: Malinaw na ipinakikita na si Yahweh ang pinagmumulan ng kapayapaan, at inililipat ang banal na pangalan ayon sa anyong Yahweh.
theological_decisions:
- issue: Ang kaibahan ng hatol sa angkan ni Joab at ng kapayapaan para sa angkan ni David
  choice: Ngunit para kay David...
  alternative: At para kay David...
  rationale: Bagaman karaniwang pang-ugnay ang ו, malinaw na magkasalungat dito ang hatol kay Joab at ang kapayapaan para kay David. Ginagawang hayag ng 'Ngunit' ang ugnayang ito nang hindi nagdaragdag ng bagong teolohiya.
- issue: Saklaw ng שָׁלוֹם sa kontekstong pandinastiya
  choice: kapayapaan
  alternative: kaginhawahan / kasaganaan
  rationale: Pinananatili ng 'kapayapaan' ang masaklaw na diwa ng seguridad, kaayusan, at kabutihang nagmumula kay Yahweh, sa halip na paliitin ito sa materyal na kasaganaan.
- issue: Pagdadala ng kasalanan sa dugo ng mga supling ni Joab
  choice: Panatilihin ang pahayag na umaabot ito sa kanyang mga supling nang hindi ipinapaliwanag ang mekanismo
  alternative: Ipaliwanag bilang personal na pagkakasala ng bawat inapo o bilang epekto lamang ng ginawa ni Joab
  rationale: Mismong teksto ang nag-uugnay ng pangmatagalang hatol sa mga supling ni Joab, ngunit hindi nito nililinaw rito kung paano ito gumagana. Hindi dapat tahimik na lutasin ng salin ang teolohikal na tensiyon.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang 'pananagutan sa kanilang dugo' upang maging likas sa Filipino habang pinananatili sa talababa ang literal na idyomang Hebreo. Pinanatili ang 'Yahweh,' 'trono,' at 'kapayapaan' dahil sa kanilang mahalagang teolohikal at pandinastiyang bigat.
