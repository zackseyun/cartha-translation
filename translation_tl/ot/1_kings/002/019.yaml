base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/019.yaml
  text: So Bathsheba went to King Solomon to speak to him on behalf of Adonijah. The king rose to meet her and bowed down before her. Then he sat on his throne and had a throne placed for the king's mother, and she sat at his right hand.
translation:
  language: tl
  text: Kaya pumunta si Batseba kay Haring Solomon upang kausapin siya hinggil kay Adonias. Tumayo ang hari upang salubungin siya at yumukod sa harap niya. Pagkatapos, umupo ang hari sa kanyang trono at nagpalagay ng isang trono para sa ina ng hari, at umupo ang ina ng hari sa kanan niya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עַל אֲדֹנִיָּהוּ
  choice: hinggil kay Adonias
  rationale: Ang עַל ay maaaring mangahulugang “tungkol sa” o, sa kontekstong ito, “alang-alang sa.” Pinananatili ng “hinggil kay” ang saklaw ng orihinal nang hindi labis na nililinaw ang papel ni Batseba bilang tagapamagitan.
- source_word: וַיִּשְׁתַּחוּ לָהּ
  choice: yumukod sa harap niya
  rationale: Ipinahahayag nito ang kilos ng malalim na paggalang na nakatuon kay Batseba, nang hindi ipinapalagay na pagsamba ang ibig sabihin.
- source_word: כִּסֵּא
  choice: trono
  rationale: Sa maharlikang tagpo, ang “trono” ang likas at tiyak na katumbas, kapwa para sa upuan ni Solomon at sa marangal na upuang inilagay para sa ina ng hari.
- source_word: לִימִינוֹ
  choice: sa kanan niya
  rationale: Pinananatili ang konkretong posisyon sa kanan ng hari at ang pahiwatig nitong marangal na katayuan.
theological_decisions:
- issue: Kung ang pagyukod ni Solomon kay Batseba ay dapat tawaging pagsamba
  choice: yumukod sa harap niya
  alternative: sumamba sa kanya
  rationale: Malawak ang gamit ng Hebrew na חוה para sa pagyukod bilang paggalang o pagpupugay. Sa kontekstong pantao at maharlika rito, hindi dapat ipasok ang kahulugang teolohikal na pagsamba.
- issue: Kung tahasang sasabihing namamagitan si Batseba para kay Adonias
  choice: hinggil kay Adonias
  alternative: alang-alang kay Adonias
  rationale: Ipinahihiwatig ng konteksto ang pakikiusap para kay Adonias, ngunit ang pariralang Hebrew mismo ay maaari ring basahing “tungkol kay Adonias.” Pinananatili ng salin ang tunay na lawak ng pahayag.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Kaya” upang iugnay ang talata sa naunang pangyayari, at hinati ang mahabang serye ng mga sugnay upang maging natural sa Tagalog habang pinananatili ang pagkakasunod-sunod ng lahat ng kilos.
