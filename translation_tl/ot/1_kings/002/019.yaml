    issue: Malabong panghalip sa “at umupo ito sa kanan niya.”
    rationale: Ang וַתֵּשֶׁב ay malinaw na tumutukoy kay Batseba/sa ina ng hari. Sa Tagalog, ang “ito” ay maaaring maling maiugnay sa naunang “isang trono.” Ang pag-uulit ng “ang ina ng hari” ay nag-aalis ng kalabuan nang walang pagbabago sa kahulugan.
  revised_text: Kaya pumunta si Batseba kay Haring Solomon upang kausapin siya hinggil kay Adonias. Tumayo ang hari upang salubungin siya at yumukod sa harap niya. Pagkatapos, umupo ang hari sa kanyang trono at nagpalagay ng isang trono para sa ina ng hari, at umupo ang ina ng hari sa kanan niya.
