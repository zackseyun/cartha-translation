  text: וַ/יָּבֹ֨א בְנָיָ֜הוּ אֶל אֹ֣הֶל יְהוָ֗ה וַ/יֹּ֨אמֶר אֵלָ֜י/ו כֹּֽה אָמַ֤ר הַ/מֶּ֨לֶךְ֙ צֵ֔א וַ/יֹּ֥אמֶר לֹ֖א כִּ֣י פֹ֣ה אָמ֑וּת וַ/יָּ֨שֶׁב בְּנָיָ֤הוּ אֶת הַ/מֶּ֨לֶךְ֙ דָּבָ֣ר לֵ/אמֹ֔ר כֹּֽה דִבֶּ֥ר יוֹאָ֖ב וְ/כֹ֥ה עָנָֽ/נִי־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/030.yaml
  text: 'Then Benaiah came to the tent of Yahweh and said to him[a], “Thus says the king: ‘Come out.’” But he said, “No, for I will die here.” And Benaiah brought word back to the king, saying, “Thus Joab spoke, and thus he answered me.”'
translation:
  language: tl
  text: 'Pagkatapos, pumunta si Benaias sa tolda ni Yahweh at sinabi kay Joab, “Ganito ang sabi ng hari: ‘Lumabas ka.’” Ngunit sinabi niya, “Hindi! Dito ako mamamatay.” Kaya bumalik si Benaias sa hari at iniulat, “Ganito ang sinabi ni Joab, at ganito ang sagot niya sa akin.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֹהֶל יְהוָה
  choice: tolda ni Yahweh
  rationale: Tuwirang isinasalin ng “tolda” ang אֹהֶל at hindi ipinapasok ang mas interpretatibong tradisyonal na katawagang “tabernakulo.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng titulong “PANGINOON.”
- source_word: כֹּה אָמַר הַמֶּלֶךְ
  choice: Ganito ang sabi ng hari
  rationale: Natural na makabagong Tagalog para sa pormulang ginagamit ng isang mensahero, habang pinananatili ang pormal na pagpapahayag.
- source_word: צֵא
  choice: Lumabas ka
  rationale: Tuwirang utos mula sa יצא at natural sa Tagalog kapag kinakausap ang isang taong nasa loob.
- source_word: לֹא כִּי פֹה אָמוּת
  choice: Hindi! Dito ako mamamatay.
  rationale: Pinananatili ang mariing pagtanggi at ang pasiya o inaasahan ni Joab na doon siya mamamatay, nang hindi labis na nililinaw ang gamit ng כִּי.
- source_word: וַיָּשֶׁב ... דָּבָר
  choice: bumalik ... at iniulat
  rationale: Natural na ipinahahayag sa Tagalog ang idyomang Hebreo tungkol sa pagbabalik dala ang ulat.
- source_word: כֹּה דִבֶּר יוֹאָב וְכֹה עָנָנִי
  choice: Ganito ang sinabi ni Joab, at ganito ang sagot niya sa akin
  rationale: Pinananatili ang pag-uulit ng כֹּה at ang pormal na estilo ng pag-uulat sa Hebreo.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Ang tekstong Hebreo ay tahasang gumagamit ng Tetragrammaton. Ang “Yahweh” ay nagpapanatili sa personal na pangalan sa halip na palitan ito ng titulo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Benaias,” ang karaniwang anyong Filipino ng Benaiah, at tahasang pinangalanan si Joab sa unang pangungusap upang maging malinaw ang reperente ng Hebreong panghalip nang hindi binabago ang kahulugan.
