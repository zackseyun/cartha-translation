translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Isinalin ang paulit-ulit na idyomang Hebreo sa magkatulad na pariralang ‘tanggihan’ upang mapanatili ang retorikal na pagtutugma ng dalawang pahayag.
