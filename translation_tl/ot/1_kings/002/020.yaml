  text: She said, “I am asking one small request of you; do not turn away my face.” And the king said to her, “Ask, my mother, for I will not turn away your face.”
translation:
  language: tl
  text: Sinabi niya, “May isang munting kahilingan ako sa iyo. Huwag mo akong tanggihan.” Sinabi sa kanya ng hari, “Humiling ka, ina ko, sapagkat hindi kita tatanggihan.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שְׁאֵלָה אַחַת קְטַנָּה
  choice: isang munting kahilingan
  rationale: Likas at malinaw sa modernong Tagalog; pinananatili ang diwa ng literal na ‘isang maliit na kahilingan.’
- source_word: אַל תָּשֵׁב אֶת פָּנָי
  choice: Huwag mo akong tanggihan
  rationale: Ang idyomang Hebreo na literal na ‘huwag mong ibalik ang aking mukha’ ay nangangahulugang huwag tanggihan ang humihiling; ang literal na salin ay hindi natural at maaaring malabo sa Tagalog.
- source_word: שַׁאֲלִי
  choice: Sabihin mo
  rationale: Sa kontekstong hinihiling ng hari na ilahad ng kanyang ina ang kahilingan, mas natural ito kaysa sa ‘Humiling ka,’ habang nananatili ang pragmatikong diwa.
- source_word: אִמִּי
  choice: ina ko
  rationale: Direktang salin na marangal at angkop sa pakikipag-usap ng hari sa kanyang ina.
