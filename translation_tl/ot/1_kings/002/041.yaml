base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/041.yaml
  text: And it was reported to Solomon that Shimei had gone from Jerusalem to Gath and had returned.
translation:
  language: tl
  text: At ibinalita kay Solomon na umalis si Shimei mula sa Jerusalem, pumunta sa Gat, at bumalik.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֻּגַּד
  choice: ibinalita
  rationale: Pinananatili ang di-tiyak na tagapaghatid ng balita ng Hebreong pasibo, habang natural sa makabagong Tagalog ang konstruksiyong “ibinalita kay Solomon.”
- source_word: לִשְׁלֹמֹה
  choice: kay Solomon
  rationale: Ang לְ ay tumutukoy sa tumanggap ng balita; “kay” ang likas na pananda para sa personal na pangalang tumatanggap.
- source_word: כִּי
  choice: na
  rationale: Ipinapakilala nito ang nilalaman ng ibinalita sa di-tuwirang pagsasalaysay.
- source_word: הָלַךְ
  choice: umalis … pumunta
  rationale: Ang הלך ay pagpunta o paglalakbay. Sa kontekstong may pinagmulan at patutunguhan, malinaw at natural sa Tagalog ang “umalis … pumunta.”
- source_word: שִׁמְעִי
  choice: Shimei
  rationale: Isinalin sa karaniwang transliterasyon ng personal na pangalan.
- source_word: מִירוּשָׁלִַם
  choice: mula sa Jerusalem
  rationale: Ang מִן ay nagpapahayag ng pinagmulan ng kilos.
- source_word: גַּת
  choice: sa Gat
  rationale: Bagaman walang tahasang pang-ukol sa Hebreo, ang Gat ang patutunguhan ng pagpunta; kailangan ang “sa” sa natural na Tagalog.
- source_word: וַיָּשֹׁב
  choice: at bumalik
  rationale: Ang שׁוב ay nangangahulugang bumalik. Sapat ang aspektong naganap sa Tagalog upang ipahayag ang natapos na kilos sa loob ng ulat.
