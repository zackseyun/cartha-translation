  text: וְ/עַתָּה֙ אַל תְּנַקֵּ֔/הוּ כִּ֛י אִ֥ישׁ חָכָ֖ם אָ֑תָּה וְ/יָֽדַעְתָּ֙ אֵ֣ת אֲשֶׁ֣ר תַּֽעֲשֶׂה לּ֔/וֹ וְ/הוֹרַדְתָּ֧ אֶת שֵׂיבָת֛/וֹ בְּ/דָ֖ם שְׁאֽוֹל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/009.yaml
  text: But now[a], do not hold him guiltless, for you are a wise man, and you will know what you should do to him; and you shall bring his gray head down to Sheol with blood.
translation:
  language: tl
  text: Ngunit ngayon, huwag mo siyang hayaang hindi maparusahan, sapagkat ikaw ay isang matalinong lalaki at malalaman mo kung ano ang dapat mong gawin sa kanya; ibababa mo sa Sheol[a] ang kaniyang ulong ubanin sa pagdanak ng dugo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “libingan” o “daigdig ng mga patay.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּנַקֵּהוּ
  choice: huwag mo siyang hayaang hindi maparusahan
  rationale: Ipinahahayag nito ang diwang hudisyal ng Piel ng נקה—huwag ituring na walang sala o palampasin nang walang parusa—sa natural na modernong Tagalog.
- source_word: אִישׁ חָכָם
  choice: isa kang marunong na lalaki
  rationale: Pinananatili ang pagtukoy kay Solomon bilang isang lalaking may karunungan, nang hindi ginagawang neutral ang kasarian ng Hebreo.
- source_word: וְיָדַעְתָּ אֵת אֲשֶׁר תַּעֲשֶׂה לוֹ
  choice: at malalaman mo kung ano ang dapat mong gawin sa kanya
  rationale: Ipinapakita ang pagtitiwala ni David sa magiging wastong pagpapasiya ni Solomon; ang “dapat” ay angkop sa kontekstong maharlika at hudisyal.
- source_word: וְהוֹרַדְתָּ
  choice: Ibababa mo
  rationale: Pinananatili ang causative na diwa ng Hiphil ng ירד, “pangyayaring bumaba” o “ibaba,” at ang puwersa nitong tagubilin.
- source_word: שֵׂיבָתוֹ
  choice: ang kaniyang ulong ubanin
  rationale: Pinananatili ang larawang Hebreo ng ulong may uban bilang metonimiya para sa matandang lalaki o katandaan.
- source_word: בְּדָם
  choice: sa pagdanak ng dugo
  rationale: Natural na ipinahahayag sa Tagalog ang marahas at madugong kamatayan habang pinananatili ang tindi ng parirala.
- source_word: שְׁאוֹל
  choice: Sheol
  rationale: Ang transliterasyon ay hindi nagpapakitid sa salita tungo lamang sa pisikal na libingan at pinananatili ang saklaw ng sinaunang konseptong Hebreo.
theological_decisions:
- issue: Pagpapakahulugan sa שְׁאוֹל
  choice: Sheol
  alternative: libingan; daigdig ng mga patay
  rationale: Pinananatili ng “Sheol” ang kosmolohikal at teolohikal na lawak ng salitang Hebreo nang hindi ipinipilit na ito ay libingan lamang o isang mas tiyak na doktrinal na konsepto.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang matinding larawang “ulong ubanin” at ang ambiguwidad ng Sheol; iniwasan ang labis na legalistiko o denominasyonal na pananalita.
