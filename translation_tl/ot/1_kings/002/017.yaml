  source_fidelity: 'Tumpak ang pangunahing diwa ng talata: magalang na pakiusap kay Batseba na magsalita kay Haring Solomon, sa dahilang hindi siya tatanggihan, upang maibigay si Abisag kay Adonias bilang asawa. Gayunman, ang “bilang asawa” ay hindi tahasang nagpapakita ng unang panauhang “sa akin,” at ang literal na pagpapaliwanag sa talababa ay hindi maaasahan.'
  naturalness: Likas at angkop sa makabagong Filipino Tagalog ang pangunahing pangungusap. Ang “Pakisuyo” at “kausapin mo” ay magalang at malinaw. Mas natural at mas tiyak ang “upang maging asawa ko” para sa layon ng kahilingan.
  terminology: Maayos ang “Haring Solomon” at “Abisag na Sunamita.” Ang “asawa ko” ay kinakailangan upang maipakita nang malinaw ang לִי (“sa akin”) kasama ng לְאִשָּׁה (“bilang/as a wife”).
