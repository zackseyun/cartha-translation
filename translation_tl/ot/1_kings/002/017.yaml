base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/017.yaml
  text: And he said[a], “Please speak to King Solomon, for he will not refuse you, and let him give me Abishag the Shunammite as a wife.”
translation:
  language: tl
  text: Sinabi niya, “Pakisuyo, kausapin mo si Haring Solomon, sapagkat hindi ka niya tatanggihan,[a] at hilingin mong ibigay niya sa akin si Abisag na Sunamita upang maging asawa ko.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “hindi niya ibabalik ang iyong mukha,” isang idyomang Hebreo na nangangahulugang hindi ka niya tatanggihan o hindi niya ipagkakait ang iyong kahilingan.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִמְרִי נָא
  choice: Pakisuyo, kausapin mo
  rationale: Ang pambabaeng isahang pautos na may נָא ay magalang na pakiusap. Likas sa makabagong Tagalog ang “Pakisuyo, kausapin mo” sa paghiling kay Batseba na mamagitan.
- source_word: לִשְׁלֹמֹה הַמֶּלֶךְ
  choice: si Haring Solomon
  rationale: Karaniwang ayos sa Tagalog ang titulong “Haring” bago ang pangalang Solomon.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala nito ang dahilan kung bakit kay Batseba ipinadaraan ang kahilingan.
- source_word: לֹא יָשִׁיב אֶת פָּנָיִךְ
  choice: hindi ka niya tatanggihan
  rationale: Idyoma ito na literal na tumutukoy sa hindi pagpapabalik ng mukha; sa konteksto, nangangahulugan itong hindi tatanggihan ang taong nakikiusap o ang kaniyang kahilingan.
- source_word: וְיִתֶּן לִי
  choice: at hilingin mong ibigay niya sa akin
  rationale: Ang anyong pandiwa ay nagpapahayag ng nilalaman ng ipapakiusap kay Solomon. Nilinaw ng “hilingin mong” ang ugnayan nito sa naunang utos nang hindi binabago ang hinihinging kilos.
- source_word: אֲבִישַׁג הַשּׁוּנַמִּית
  choice: si Abisag na Sunamita
  rationale: Isinalin ang pangalan sa karaniwang anyong Filipino at ang katawagang heograpiko bilang “Sunamita.”
- source_word: לְאִשָּׁה
  choice: bilang asawa
  rationale: Ang parirala ay tumutukoy sa pagkuha kay Abisag sa pag-aasawa; natural at tuwiran sa Tagalog ang “bilang asawa.”
