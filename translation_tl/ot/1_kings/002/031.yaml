base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/031.yaml
  text: Then the king said to him[a], “Do as he has said, and strike him down and bury him[b], and remove from me and from my father’s house the innocent blood that Joab shed.”
translation:
  language: tl
  text: Sinabi ng hari sa kanya, “Gawin mo ang sinabi niya. Patayin mo siya[a] at ilibing mo siya. Sa gayon, aalisin mo sa akin at sa sambahayan ng aking ama ang dugong walang-sala[b] na ibinuhos ni Joab.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal na maaaring unawain ang Hebreong idyoma bilang “lusubin mo siya,” ngunit sa kontekstong ito ay tumutukoy ito sa pagpatay sa kanya.
    reason: lexical_alternative
  - marker: b
    text: Ang “dugong walang-sala” ay isang Hebreong pahayag para sa dugong ibinuhos nang walang matuwid na dahilan; kalakip nito ang pananagutan sa di-makatarungang pagpatay.
    reason: cultural_note
lexical_decisions:
- source_word: עֲשֵׂה כַּאֲשֶׁר דִּבֶּר
  choice: Gawin mo ang sinabi niya
  rationale: Tuwirang ipinapahayag ng pautos na pandiwa ang pagsunod sa sinabi ni Joab, at natural ito sa makabagong Tagalog.
- source_word: וּפְגַע בּוֹ
  choice: Patayin mo siya
  rationale: Ang פגע na may ב ay literal na tumutukoy sa marahas na pagsalakay, ngunit sa kontekstong ito ay malinaw na utos ng pagpatay; iniiwasan ng saling ito ang malabong literalismo.
- source_word: וּקְבַרְתּוֹ
  choice: at ilibing
  rationale: Pinananatili ang kasunod na utos na ilibing si Joab nang hindi nagdaragdag ng di-hayag na detalye.
- source_word: וַהֲסִירֹתָ
  choice: Sa gayon, aalisin mo
  rationale: Ipinakikita ang bunga ng pagsasagawa sa mga naunang utos habang pinananatili ang ugnayang maaaring basahin bilang pagpapatuloy o resulta.
- source_word: דְּמֵי חִנָּם
  choice: ang dugong walang-sala
  rationale: Pinananatili ang kongkretong Hebreong idyoma at ang legal-moral na bigat ng dugong ibinuhos nang walang matuwid na dahilan.
- source_word: מֵעָלַי וּמֵעַל בֵּית אָבִי
  choice: sa akin at sa sambahayan ng aking ama
  rationale: Natural na ipinahahayag sa Tagalog ang pag-aalis ng pananagutang nakapatong sa hari at sa sambahayan ng kanyang ama.
theological_decisions:
- issue: Pananagutan sa dugong ibinuhos at ang sambahayan ng hari
  choice: Panatilihin ang kongkretong larawan ng pag-aalis ng “dugong walang-sala” mula kay Solomon at sa sambahayan ng kanyang ama.
  alternative: Isalin nang tahasan bilang pag-aalis ng “pananagutan sa dugo.”
  rationale: Ang Hebreo ay nagsasalita ng dugo na inaalis mula sa ibabaw ng mga tao o sambahayan. Pinananatili ng salin ang legal at teolohikal na pahiwatig ng pananagutan nang hindi ginagawang abstrakto ang orihinal.
- issue: Ugnayan ng pagpatay at pag-aalis ng pananagutan
  choice: Gamitin ang “Sa gayon” upang ipahiwatig ang bunga nang hindi ito gawing isang mas mahigpit na pormulang teolohikal.
  alternative: Simpleng “at aalisin mo” o mas tahasang “upang alisin mo.”
  rationale: Maaaring magpahiwatig ang anyong Hebreo ng pagpapatuloy at resulta. Pinananatili ng salin ang bahagyang tensiyon sa halip na itakda lamang bilang layunin.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “sambahayan” para sa dinastiko at pampamilyang saklaw ng בֵּית, at pinanatili ang kongkretong idyomang “dugong walang-sala” upang hindi mawala ang legal-teolohikal na bigat ng talata.
