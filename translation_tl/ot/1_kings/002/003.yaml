source:
  edition: WLC
  text: וְ/שָׁמַרְתָּ֞ אֶת מִשְׁמֶ֣רֶת יְהוָ֣ה אֱלֹהֶ֗י/ךָ לָ/לֶ֤כֶת בִּ/דְרָכָי/ו֙ לִ/שְׁמֹ֨ר חֻקֹּתָ֤י/ו מִצְוֺתָי/ו֙ וּ/מִשְׁפָּטָ֣י/ו וְ/עֵדְוֺתָ֔י/ו כַּ/כָּת֖וּב בְּ/תוֹרַ֣ת מֹשֶׁ֑ה לְמַ֣עַן תַּשְׂכִּ֗יל אֵ֚ת כָּל אֲשֶׁ֣ר תַּֽעֲשֶׂ֔ה וְ/אֵ֛ת כָּל אֲשֶׁ֥ר תִּפְנֶ֖ה שָֽׁם־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/003.yaml
  text: And keep the charge of Yahweh your God by walking in his ways and by keeping his statutes[a], his commandments, his judgments, and his testimonies, as it is written in the Law of Moses, so that you may act wisely in all that you do and wherever you turn.
translation:
  language: tl
  text: 'Tuparin mo ang tungkuling ibinigay sa iyo ni Yahweh na iyong Diyos: mamuhay ka ayon sa kanyang mga daan at sundin ang kanyang mga tuntunin, mga utos, mga kahatulan, at mga patotoo, gaya ng nakasulat sa Kautusan ni Moises, upang kumilos ka nang may karunungan[a] sa lahat ng iyong gagawin at saan ka man bumaling.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “upang magtagumpay ka.” Ang pandiwang Hebreo ay maaaring magdiin sa matalinong pagkilos o sa tagumpay na bunga nito.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמַרְתָּ אֶת־מִשְׁמֶרֶת
  choice: Tuparin mo ang tungkuling ibinigay sa iyo
  rationale: Ang pandiwa sa kontekstong ito ay nagpapatuloy sa panghihikayat ni David, at ang מִשְׁמֶרֶת ay isang ipinagkatiwalang tungkulin o pananagutan. Natural sa modernong Tagalog ang 'tuparin ang tungkulin'.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: ni Yahweh na iyong Diyos
  rationale: Pinananatili ang personal na pangalang Yahweh at ang tuwirang kahulugan ng hulaping pangalawang panauhan sa 'iyong Diyos'.
- source_word: לָלֶכֶת בִּדְרָכָיו
  choice: mamuhay ka ayon sa kanyang mga daan
  rationale: Pinananatili ang metapora ng 'mga daan' habang ang 'mamuhay ayon sa' ay malinaw at likas na Tagalog para sa etikong diwa ng Hebreong 'lumakad sa'.
- source_word: לִשְׁמֹר
  choice: sundin
  rationale: Sa listahan ng mga tuntuning legal at tipan, mas natural sa Tagalog ang 'sundin' kaysa paulit-ulit na 'ingatan,' ngunit pinananatili nito ang diwa ng masusing pagsunod.
- source_word: חֻקֹּתָיו
  choice: kanyang mga tuntunin
  rationale: Ang 'mga tuntunin' ay malinaw na katumbas ng mga itinakdang batas at naiiba pa rin sa mga utos at kahatulan.
- source_word: מִצְוֺתָיו
  choice: mga utos
  rationale: Tuwiran at karaniwang salin ng mga kautusan.
- source_word: מִשְׁפָּטָיו
  choice: mga kahatulan
  rationale: Pinananatili ang legal at hudisyal na kulay ng salita at ang pagkakaiba nito sa 'mga tuntunin' at 'mga utos'.
- source_word: עֵדְוֺתָיו
  choice: mga patotoo
  rationale: Bagaman pormal, pinananatili ng 'mga patotoo' ang natatanging tipan at saksi na diwa ng terminong Hebreo.
- source_word: בְּתוֹרַת מֹשֶׁה
  choice: sa Kautusan ni Moises
  rationale: Sa konteksto, tumutukoy ito sa nakasulat na kalipunan ng pagtuturo at batas ni Moises; ang 'Kautusan ni Moises' ang malinaw at kinikilalang tawag.
- source_word: לְמַעַן תַּשְׂכִּיל
  choice: upang kumilos ka nang may karunungan
  rationale: Ipinahahayag nito ang matalinong pagkilos, habang kinikilala sa talababa na maaari ring idiin ng pandiwa ang tagumpay na bunga nito.
- source_word: בְּכֹל אֲשֶׁר תַּעֲשֶׂה וְאֵת כָּל־אֲשֶׁר תִּפְנֶה שָׁם
  choice: sa lahat ng iyong gagawin at saan ka man bumaling
  rationale: Pinananatili ang malawak na saklaw at ang metapora ng pagbaling sa anumang direksiyon o gawain.
theological_decisions:
- issue: Paglalapat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehovah
  rationale: Ang tekstong Hebreo ay tahasang gumagamit ng Tetragrammaton; pinananatili ng 'Yahweh' ang personal na pangalan sa halip na palitan ito ng isang titulo.
- issue: Saklaw ng kahulugan ng תַּשְׂכִּיל
  choice: kumilos nang may karunungan
  alternative: magtagumpay / umunlad
  rationale: Maaaring tumukoy ang pandiwa sa maingat at matalinong pagkilos o sa tagumpay na kalimitang bunga nito. Inilalagay sa pangunahing teksto ang diwa ng matalinong pagkilos at pinananatili sa talababa ang alternatibo.
- issue: Ugnayan ng pagsunod at magandang kalalabasan
  choice: Layunin o resultang ipinahahayag nang hindi ginagawang garantiya ng materyal na kasaganaan
  alternative: Tiyak na materyal na pag-unlad bilang gantimpala
  rationale: Iniuugnay ng talata ang katapatan sa Kautusan sa matalino at matagumpay na pamumuno, ngunit hindi nito pinatutunayan ang isang pangkalahatang doktrina ng materyal na kasaganaan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang ikalawang panauhang isahan upang tumbasan ang mga anyong Hebreo. Pinanatili ang mga natatanging terminong legal sa listahan, kahit bahagyang pormal ang 'mga kahatulan' at 'mga patotoo,' upang hindi pag-isahin ang magkakaibang salitang Hebreo.
