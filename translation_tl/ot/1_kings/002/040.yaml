- from: Kaya bumangon si Simei, siniyahan niya ang kanyang asno, at pumunta sa Gat, kay Akis, upang hanapin ang kanyang mga alipin.[a] Pumunta nga si Simei at dinala niya pabalik mula sa Gat ang kanyang mga alipin.
  to: At bumangon si Simei, siniyahan niya ang kanyang asno, at pumunta sa Gat, kay Akis, upang hanapin ang kanyang mga alipin.[a] At pumunta si Simei at dinala niya mula sa Gat ang kanyang mga alipin.
  rationale: Pinalitan ang interpretatibong “Kaya” ng “At,” inalis ang “nga,” at inalis ang “pabalik” upang huwag magdagdag ng kilos o patutunguhan na hindi hayagang isinasaad ng Hebreo. Pinanatili ang likas na Filipino, ang pag-uulit sa salaysay, at ang talababa para sa leksikal na saklaw ng עֲבָדָיו.
