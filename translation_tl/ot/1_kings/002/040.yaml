base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/040.yaml
  text: Then Shimei arose[a], saddled his donkey, and went to Gath, to Achish, to look for his servants. Shimei went and brought his servants back from Gath.
translation:
  language: tl
  text: At bumangon si Simei, siniyahan niya ang kanyang asno, at pumunta sa Gat, kay Akis, upang hanapin ang kanyang mga alipin.[a] At pumunta si Simei at dinala niya mula sa Gat ang kanyang mga alipin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga lingkod.” Ang salitang Hebreo na עֲבָדָיו ay maaaring tumukoy sa mga lingkod o mga alipin; “mga alipin” ang ginamit dito dahil ipinakikita ng konteksto na tumakas sila at hinanap ni Simei upang mabawi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: bumangon
  rationale: Karaniwang kahulugan ng קום ang “bumangon.” Pinananatili nito ang pagkakasunod-sunod ng salaysay nang hindi ginagawang tahasang “umalis,” bagaman iyon ang kasunod na kilos.
- source_word: וַיַּחֲבֹשׁ אֶת חֲמֹרוֹ
  choice: siniyahan niya ang kanyang asno
  rationale: Sa konteksto ng paghahanda sa paglalakbay, ang חבש na may kasamang asno ay tumutukoy sa pagsisiyá o paghahanda rito upang sakyan. Ang “siniyahan” ang tiyak at likas na salin.
- source_word: גַּתָה
  choice: sa Gat
  rationale: Ang hulaping lokatibong ה ay nagpapahiwatig ng patungong direksiyon. Likas itong ipinahahayag sa Filipino sa pamamagitan ng “sa Gat” kasunod ng “pumunta.”
- source_word: אָכִישׁ
  choice: Akis
  rationale: Isinalin sa baybay-Filipino ang personal na pangalang Hebreo ayon sa karaniwang pagbigkas.
- source_word: לְבַקֵּשׁ
  choice: upang hanapin
  rationale: Ang בקש ay nangangahulugang humanap o maghanap. Ang “hanapin” ay malinaw at natural sa konkretong tagpong ito.
- source_word: עֲבָדָיו
  choice: kanyang mga alipin
  rationale: Maaaring mangahulugan ang עבד ng lingkod o alipin. Dahil tumakas ang mga taong ito at sinundan sila ni Simei upang kunin, higit na inililitaw ng “mga alipin” ang kanilang nakagapos na kalagayan, habang inilalagay sa talababa ang tunay na leksikal na alternatibo.
- source_word: וַיָּבֵא אֶת עֲבָדָיו מִגַּת
  choice: dinala niya pabalik mula sa Gat ang kanyang mga alipin
  rationale: Ang Hiphil ng בוא ay “dalhin.” Hindi hiwalay na salita sa Hebreo ang “pabalik,” ngunit malinaw itong ipinahihiwatig ng pagkuha niya sa mga tumakas at ng kanyang pagbabalik; ginagawa nitong natural at malinaw ang salaysay sa Filipino.
