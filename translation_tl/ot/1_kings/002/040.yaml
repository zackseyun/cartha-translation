translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Kaya” upang iugnay ang talata sa naunang pangyayari, at ang “pumunta nga” upang mapanatili ang muling pagbanggit ng pagpunta ni Simei sa tekstong Hebreo. Inilipat ang talababa sa “mga alipin,” ang salitang talagang tinutukoy ng paliwanag.
