id: 1KI.2.29
reference: 1 Kings 2:29
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יֻּגַּ֞ד לַ/מֶּ֣לֶךְ שְׁלֹמֹ֗ה כִּ֣י נָ֤ס יוֹאָב֙ אֶל אֹ֣הֶל יְהוָ֔ה וְ/הִנֵּ֖ה אֵ֣צֶל הַ/מִּזְבֵּ֑חַ וַ/יִּשְׁלַ֨ח שְׁלֹמֹ֜ה אֶת בְּנָיָ֧הוּ בֶן יְהוֹיָדָ֛ע לֵ/אמֹ֖ר לֵ֥ךְ פְּגַע בּֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/029.yaml
  text: And it was reported to King Solomon that Joab had fled to the tent of Yahweh[a], and behold, he was beside the altar. So Solomon sent Benaiah son of Jehoiada, saying, “Go[b], strike him down.”
translation:
  language: tl
  text: At ibinalita kay Haring Solomon na tumakas si Joab papunta sa tolda ni Yahweh[a], at naroon siya sa tabi ng altar. Kaya isinugo ni Solomon si Benaias na anak ni Joiada at sinabi, “Pumunta ka at sugurin mo siya.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “tabernakulo ni Yahweh.” Literal na “tolda ni Yahweh” ang Hebreo.
    reason: lexical_alternative
  - marker: b
    text: O “salakayin mo siya” o “pabagsakin mo siya.” Ang pandiwang Hebreo ay maaaring tumukoy sa pananakit o pagsalakay; sa kontekstong ito, marahas ang ipinag-uutos na pagkilos.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֻּגַּד
  choice: ibinalita
  rationale: Likas na modernong Tagalog para sa Hophal na nagsasaad na ang impormasyon ay ipinaalam sa hari, habang pinananatili ang di-tiyak na tagapagbalita.
- source_word: לַמֶּלֶךְ שְׁלֹמֹה
  choice: kay Haring Solomon
  rationale: Karaniwang ayos sa Tagalog para sa titulo at pangalan ng tumanggap ng balita.
- source_word: נָס
  choice: tumakas
  rationale: Tuwirang ipinapahayag ang pagtakas ni Joab; malinaw na nauna ito sa pagbabalita kahit walang natatanging pluperfect sa Tagalog.
- source_word: אֶל אֹהֶל יְהוָה
  choice: patungo sa tolda ni Yahweh
  rationale: Ang אֹהֶל ay literal na tolda, at ang pangalang tipan na יְהוָה ay isinaling Yahweh.
- source_word: וְהִנֵּה
  choice: at naroon siya
  rationale: Natural na Tagalog na nagpapanatili sa pansin at biglang paglalarawan na dulot ng הִנֵּה nang hindi gumagamit ng lipas na ekspresyon.
- source_word: אֵצֶל הַמִּזְבֵּחַ
  choice: sa tabi ng altar
  rationale: Malinaw na ipinahahayag ang kalapitan sa altar nang hindi ipinapalagay na nakahawak siya sa mga sungay nito.
- source_word: וַיִּשְׁלַח
  choice: Kaya isinugo ni Solomon
  rationale: Ipinakikita ng “Kaya” ang bunga ng natanggap na balita at pinananatili ng “isinugo” ang diwang may tiyak na atas.
- source_word: בְּנָיָהוּ בֶן יְהוֹיָדָע
  choice: si Benaias na anak ni Joiada
  rationale: Ginamit ang nakaugaliang anyong Filipino ng mga pangalang ito at natural na patronimiko.
- source_word: לֵאמֹר
  choice: na sinasabi
  rationale: Pormal ngunit malinaw na salin ng infinitive na nagpapakilala sa tuwirang pananalita.
- source_word: לֵךְ
  choice: Humayo ka
  rationale: Tuwirang utos na angkop sa marangal na salaysay; mas pormal kaysa “Pumunta ka” ngunit nauunawaan pa rin.
- source_word: פְּגַע בּוֹ
  choice: patayin mo siya
  rationale: Bagaman maaaring mangahulugang saktan o salakayin ang pandiwa, malinaw sa konteksto ng ipinag-utos na pagbitay na nakamamatay ang suntok; ang talababa ay nagpapanatili sa mas literal na saklaw.
theological_decisions:
- issue: Pagsasalin sa pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Pinananatili ang personal na pangalang tipan na nasa tekstong Hebreo sa halip na palitan ito ng titulo.
- issue: Kalagayan ni Joab sa altar
  choice: nasa tabi ng altar
  alternative: nakahawak sa mga sungay ng altar
  rationale: Ang talata ay nagsasaad lamang ng kalapitan; hindi dapat ipasok mula sa konteksto ang kilos na hindi tahasang sinabi rito.
- issue: Lakas ng utos na פְּגַע בּוֹ
  choice: patayin mo siya
  alternative: salakayin mo siya; pabagsakin mo siya
  rationale: Ipinahihiwatig ng konteksto ang utos na pagbitay, ngunit itinatala sa talababa na mas malawak ang literal na saklaw ng pandiwa.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Pinili ang “tolda” kaysa mas teknikal na “tabernakulo,” habang inilagay ang tradisyonal na alternatibo sa talababa. Ginamit ang “Humayo” bilang maikli at marangal na pautos; iniwasan ang labis na kolokyal na pananalita.
