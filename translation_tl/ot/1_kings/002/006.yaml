  yaml_path: translation/ot/1_kings/002/006.yaml
  text: Act according to your wisdom[b][a], and do not let his gray head go down to Sheol in peace.
translation:
  language: tl
  text: Kumilos ka ayon sa iyong karunungan, at huwag mong hayaang bumaba[a] nang payapa sa Sheol[b] ang kaniyang ulong may uban.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “huwag mong ibaba.”
    reason: lexical_alternative
  - marker: b
    text: Ang “Sheol” ay katawagang Hebreo para sa dako ng mga patay; maaari ring isalin na “libingan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Kumilos ka
  rationale: Malawak ang kahulugan ng עשה (“gawin, kumilos”). Sa habilin ni David kay Solomon, ipinahahayag ng “Kumilos ka” ang praktikal at pautos na puwersa nang hindi dinaragdagan ang tiyak na kilos.
- source_word: כְּחָכְמָתֶךָ
  choice: ayon sa iyong karunungan
  rationale: Ipinahihiwatig ng כְּ ang pagkilos na naaayon sa sariling karunungan o pagpapasiya ni Solomon.
- source_word: וְלֹא תוֹרֵד
  choice: huwag mong hayaang bumaba
  rationale: Ang Hiphil ng ירד ay causative, “pangyarihing bumaba.” Natural sa Tagalog ang “huwag mong hayaang bumaba,” habang nananatili ang diwang si Solomon ang mananagot sa kahihinatnan.
- source_word: שֵׂיבָתוֹ
  choice: ang ulo niyang may uban
  rationale: Ang שֵׂיבָה ay tumutukoy sa uban o katandaan. Pinananatili ng salin ang matingkad na larawang Hebreo ng isang matandang taong bumababa sa dako ng mga patay.
- source_word: בְּשָׁלֹם
  choice: nang payapa
  rationale: Dito, ang שָׁלוֹם ay tumutukoy sa mapayapang kalagayan o wakas—isang kamatayang walang kaparusahang paghatol.
- source_word: שְׁאֹל
  choice: Sheol
  rationale: Pinananatili ang katawagang Hebreo sapagkat maaari itong tumukoy nang mas malawak sa dako o daigdig ng mga patay, hindi lamang sa isang libingan.
theological_decisions:
- issue: Kahulugan ng שְׁאֹל
  choice: Sheol
  alternative: libingan; dako ng mga patay
  rationale: Hindi pinakikitid ng transliterasyong “Sheol” ang salita sa pisikal na libingan lamang at hindi rin nito dinaragdagan ang teksto ng isang tiyak na doktrina tungkol sa kabilang-buhay. Ipinakikita ng konteksto na hindi dapat mamatay si Joab nang payapa at walang pananagutan.
- issue: Puwersang causative ng וְלֹא תוֹרֵד
  choice: huwag mong hayaang bumaba
  alternative: huwag mong ibaba
  rationale: Kapuwa posible ang pagpapahintulot at tuwirang pagpapababa bilang pagpapahayag sa causative na anyo. Pinili ang mas natural na parirala sa Tagalog, habang inilalagay sa talababa ang mas tuwirang alternatibo upang mapanatili ang saklaw ng Hebreo.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “Kumilos ka” bilang malinaw na habilin, at pinanatili ang larawang “ulo niyang may uban” at ang katawagang “Sheol” upang hindi mawala ang imahen at saklaw ng tekstong Hebreo.
