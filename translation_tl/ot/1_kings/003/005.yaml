id: 1KI.3.5
reference: 1 Kings 3:5
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: בְּ/גִבְע֗וֹן נִרְאָ֧ה יְהֹוָ֛ה אֶל שְׁלֹמֹ֖ה בַּ/חֲל֣וֹם הַ/לָּ֑יְלָה וַ/יֹּ֣אמֶר אֱלֹהִ֔ים שְׁאַ֖ל מָ֥ה אֶתֶּן לָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/005.yaml
  text: At Gibeon Yahweh appeared to Solomon in a dream at night[a], and God said, “Ask what I should give you.”
translation:
  language: tl
  text: Sa Gibeon, nagpakita si Yahweh kay Solomon sa isang panaginip sa gabi[a], at sinabi ng Diyos, “Hingin mo kung ano ang ibibigay ko sa iyo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “sa panaginip ng gabi”; ibig sabihin, sa isang panaginip na naganap sa gabi.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּ/גִבְעוֹן
  choice: Sa Gibeon
  rationale: Ang בְּ ay panandang panlunan; natural sa Filipino ang “sa” para sa tagpuan.
- source_word: נִרְאָה
  choice: nagpakita
  rationale: Ang nifal ng ראה sa kontekstong ito ay karaniwang tumutukoy sa pagpapakita ng Diyos; malinaw at likas sa Filipino ang “nagpakita” nang hindi tinutukoy ang eksaktong anyo ng pagpapakita.
- source_word: יְהֹוָה
  choice: Yahweh
  rationale: Tuwirang isinasalin ang natatanging pangalang banal na יהוה bilang “Yahweh.”
- source_word: אֶל שְׁלֹמֹה
  choice: kay Solomon
  rationale: Ang אֶל ay nagpapakilala sa taong pinakitaan; “kay Solomon” ang natural na anyong Filipino.
- source_word: בַּ/חֲל֣וֹם הַ/לָּיְלָה
  choice: sa isang panaginip sa gabi
  rationale: Ipinahahayag nito nang natural ang diwang “sa panaginip ng gabi,” samakatuwid ay isang panaginip na naganap sa gabi.
- source_word: וַ/יֹּאמֶר
  choice: at sinabi
  rationale: Pinananatili ng “at” ang payak na pagsulong ng salaysay na ipinahihiwatig ng waw-consecutive.
- source_word: אֱלֹהִים
  choice: Diyos
  rationale: Pinananatili ang leksikal na pagbabago mula יהוה tungo sa אֱלֹהִים sa halip na pagtugmain ang dalawang katawagan.
- source_word: שְׁאַל
  choice: Humingi ka
  rationale: Ang pautos ay tuwiran at bukás; sa kontekstong may ipagkakaloob ang Diyos, mas natural ang “humingi” kaysa sa payak na “magtanong.”
- source_word: מָה אֶתֶּן לָךְ
  choice: ano ang ibibigay ko sa iyo?
  rationale: Malapit ito sa anyo ng Hebreo at pinananatili ang bukás na tanong tungkol sa ipagkakaloob ng Diyos. Ang gatlang pandamdam ay nag-uugnay rito sa naunang pautos nang hindi nagdaragdag ng bagay na hindi tahasang binanggit.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Ang paggamit ng “Yahweh” ay nagpapanatili sa natatanging pangalang nasa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- issue: Pagpapanatili sa pagbabago mula יהוה tungo sa אֱלֹהִים
  choice: Yahweh … Diyos
  alternative: Gawing “Diyos” o “Yahweh” ang dalawang katawagan
  rationale: Magkaiba ang dalawang katawagang ginamit ng tekstong Hebreo sa iisang talata; pinananatili ang pagkakaibang iyon at hindi ito pinapakinis.
- issue: Ugnayan ng שְׁאַל at מָה אֶתֶּן לָךְ
  choice: “Humingi ka—ano ang ibibigay ko sa iyo?”
  alternative: “Hilingin mo kung ano ang dapat kong ibigay sa iyo.”
  rationale: Ang Hebreo ay maaaring unawain bilang pautos na sinusundan ng tanong o bilang “hingin mo kung ano ang ibibigay ko.” Pinananatili ng napiling anyo ang tuwirang tanong at iniiwasang ipasok ang modal na “dapat,” na hindi tahasang nakasaad.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “nagpakita,” “panaginip sa gabi,” at “humingi ka” bilang mga karaniwang salitang madaling maunawaan, habang pinananatili ang pangalang Yahweh at ang pagkakaiba nito sa “Diyos.”
