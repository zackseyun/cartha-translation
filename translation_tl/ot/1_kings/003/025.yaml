  text: Then the king said[a], “Cut the living child in two, and give half to the one and half to the other.”
translation:
  language: tl
  text: Pagkatapos, sinabi ng hari, “Hatiin ninyo sa dalawa ang buhay na bata at ibigay ninyo ang kalahati sa isa[a] at ang kalahati sa isa pa.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “sa isa ... at sa isa,” na may mga anyong pambabae na tumutukoy sa dalawang babae sa salaysay.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Pagkatapos ay sinabi
  rationale: Ang waw-consecutive ay nagpapatuloy sa salaysay; natural sa modernong Filipino ang “Pagkatapos ay sinabi” at malinaw ang pagkakasunod-sunod.
- source_word: הַמֶּלֶךְ
  choice: ang hari
  rationale: Tuwirang salin ng tiyak na pangngalan.
- source_word: גִּזְרוּ
  choice: Hatiin ninyo
  rationale: Maramihang pautos ang anyo at tumutukoy rito sa pisikal na pagputol. Sa Filipino, ang “hatiin ninyo sa dalawa” ay natural at malinaw sa konteksto.
- source_word: הַיֶּלֶד הַחַי
  choice: ang batang buhay
  rationale: Ipinag-iiba ng pang-uring “buhay” ang batang ito sa patay na bata sa nakapaligid na salaysay.
- source_word: לִשְׁנָיִם
  choice: sa dalawa
  rationale: Pinananatili ang tahasang ideya ng paghahati sa dalawang bahagi.
- source_word: וּתְנוּ
  choice: at ibigay
  rationale: Pinananatili ang ikalawang maramihang pautos at ang pagkakaugnay nito sa unang utos.
- source_word: הַחֲצִי
  choice: ang kalahati
  rationale: Natural na katumbas sa Filipino ng kalahating bahagi.
- source_word: לְאַחַת ... לְאֶחָת
  choice: sa isa ... sa isa pa
  rationale: Natural na ipinahahayag sa Filipino ang pamamahagi sa dalawang babaeng tinutukoy, nang hindi inuulit o idinaragdag ang salitang “babae” sa pangunahing teksto.
