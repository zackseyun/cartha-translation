  text: Then the king answered and said[a], “Give her the living child, and by no means put him to death; she is his mother.”
translation:
  language: tl
  text: Sumagot ang hari at sinabi, “Ibigay ninyo sa kanya ang batang buhay, at huwag na huwag ninyo siyang patayin[a]; siya ang ina niya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo, mariin ang pagbabawal: “huwag na huwag ninyo siyang patayin” o “tiyak na huwag ninyo siyang patayin.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן הַמֶּלֶךְ וַיֹּאמֶר
  choice: Sumagot ang hari at sinabi
  rationale: Pinananatili ang karaniwang pormulang pasalaysay na ‘sumagot at nagsabi,’ pati ang pormal na himig ng paghatol ng hari.
- source_word: תְּנוּ לָהּ
  choice: Ibigay ninyo sa kanya
  rationale: Ang pandiwa ay pautos na maramihan; malinaw na ipinahihiwatig ng ‘ninyo’ na higit sa isang tagapagpatupad ang kinakausap.
- source_word: הַיָּלוּד הַחַי
  choice: ang batang buháy
  rationale: Sa konteksto, ang יָלוּד ay ang ipinanganak na sanggol o bata, at ang חַי ay ‘buháy.’ Natural at maikli sa modernong Tagalog ang ‘batang buháy.’
- source_word: וְהָמֵת לֹא תְמִיתֻהוּ
  choice: at huwag na huwag ninyo itong papatayin
  rationale: Ang magkaugnay na infinitive absolute at pandiwang Hiphil ng מות ay nagbibigay ng mariing pagbabawal. Ang ‘huwag na huwag’ ay natural na katumbas ng diin sa Tagalog.
- source_word: הִיא אִמּוֹ
  choice: siya ang ina nito
  rationale: Ang sugnay na walang tahasang pandiwang ‘maging’ ay tuwirang nagpapakilala sa tunay na ina. Ang ‘nito’ ay malinaw na tumutukoy sa bata at umiiwas sa di-kinakailangang pagdiin sa kasarian.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Pinanatili ang pormulang ‘sumagot … at sinabi’ dahil ang bahagyang pag-uulit ay makabuluhan sa estilong pasalaysay at hudisyal. Ginamit ang ‘ito/nito’ para sa bata, na karaniwan at hindi mapanghamak sa Tagalog.
