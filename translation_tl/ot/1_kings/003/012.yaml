  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: הִנֵּ֥ה עָשִׂ֖יתִי כִּ/דְבָרֶ֑י/ךָ הִנֵּ֣ה נָתַ֣תִּי לְ/ךָ֗ לֵ֚ב חָכָ֣ם וְ/נָב֔וֹן אֲשֶׁ֤ר כָּמ֨וֹ/ךָ֙ לֹא הָיָ֣ה לְ/פָנֶ֔י/ךָ וְ/אַחֲרֶ֖י/ךָ לֹא יָק֥וּם כָּמֽוֹ/ךָ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/012.yaml
  text: Behold[a], I have done according to your words. Behold, I have given you a wise and discerning heart, such that no one like you has been before you, and no one like you shall arise after you.
translation:
  language: tl
  text: Narito, ginawa ko ayon sa iyong mga sinabi. Narito, binigyan kita ng pusong[a] marunong at may pang-unawa, anupa’t wala pang naging tulad mo bago ka, at wala ring lilitaw na tulad mo pagkatapos mo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, ang “puso” ay sumasaklaw sa panloob na kakayahang mag-isip, humatol, at kumilatis, hindi lamang sa damdamin. Maaari ring isalin ang diwa bilang “isip na nakauunawa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Narito
  rationale: Pinananatili ang pantawag-pansing kataga at ang maringal na himig ng pahayag ng Diyos; mas angkop dito kaysa sa kolokyal na “Tingnan mo.”
- source_word: עָשִׂיתִי כִּדְבָרֶיךָ
  choice: ginawa ko ang ayon sa iyong mga sinabi
  rationale: Tuwirang ipinahahayag ang natapos na pagkilos ng Diyos bilang tugon sa mga sinabi ni Solomon, nang hindi pinapalitan ang “mga sinabi” ng mas interpretibong “kahilingan.”
- source_word: נָתַתִּי לְךָ
  choice: binigyan kita
  rationale: Natural na Filipino ito para sa natapos nang pagkakaloob na ipinahahayag ng pandiwang Hebreo.
- source_word: לֵב
  choice: puso
  rationale: Pinananatili ang larawang Hebreo, kung saan ang puso ay sentro hindi lamang ng damdamin kundi pati ng pag-iisip, pagpapasiya, at paghatol.
- source_word: חָכָם וְנָבוֹן
  choice: marunong at may pang-unawa
  rationale: Ibinubukod ng pares ang karunungan sa kakayahang umunawa at kumilatis, at angkop ito sa konteksto ng pamamahala at paghatol ni Solomon.
- source_word: אֲשֶׁר כָּמוֹךָ לֹא הָיָה לְפָנֶיךָ
  choice: anupa’t wala pang naging tulad mo bago ka
  rationale: Ang “anupa’t” ay naghahayag ng bunga o paglalarawan, hindi ng layunin; natural din nitong pinananatili ang paghahambing sa mga nauna kay Solomon.
- source_word: וְאַחֲרֶיךָ לֹא יָקוּם כָּמוֹךָ
  choice: at wala ring lilitaw na tulad mo pagkatapos mo
  rationale: Ang “lilitaw” ay nagpapahayag ng pagdating o paglitaw ng isang tao sa kasaysayan at naiiwasan ang posibleng maling pahiwatig ng literal na pagtayo o muling pagkabuhay sa “babangon.”
theological_decisions:
- issue: Saklaw ng ipinangakong pagiging walang kapantay ni Solomon
  choice: Iniuugnay ang paghahambing sa pusong marunong at may pang-unawa na ipinagkaloob sa konteksto.
  alternative: Unawain ito bilang ganap na pagiging higit ni Solomon sa lahat ng tao at sa lahat ng bagay.
  rationale: Ang agarang paksa ng talata ay ang ipinagkaloob na karunungan at pang-unawa. Hindi pinalalawak ng salin ang pangako tungo sa isang ganap na pag-aangkin na hindi tahasang sinasabi ng teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang pag-uulit ng “Narito” at ang metaporang “puso,” habang ginawang natural ang sintaks sa Tagalog.
