base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/022.yaml
  text: But the other woman said[a], “No! My son is the living one, and your son is the dead one.” And this one said, “No! Your son is the dead one, and my son is the living one.” So they spoke before the king.
translation:
  language: tl
  text: Ngunit sinabi ng kabilang babae[a], “Hindi! Ang anak ko ang buhay, at ang anak mo ang patay.” Ngunit sinabi naman ng babaeng ito, “Hindi! Ang anak mo ang patay, at ang anak ko ang buhay.” Kaya nagsalita sila sa harap ng hari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O, sa mas karaniwang pananalita: “Buhay ang anak ko, at patay ang anak mo … Patay ang anak mo, at buhay ang anak ko.” Pinananatili sa pangunahing teksto ang pagsasalungat sa Hebreo na “ang buhay / ang patay.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: sinabi
  rationale: Karaniwang pandiwang pasalaysay para sa pagsasalita; natural at tuwiran sa makabagong Filipino.
- source_word: הָאִשָּׁה הָאַחֶרֶת
  choice: ang isa pang babae
  rationale: Tumutukoy sa kabilang babae sa dalawang nag-aagawan; hindi ipinapasok ang posibleng kahulugang ‘asawa’ na hindi hinihingi ng konteksto.
- source_word: לֹא כִי
  choice: Hindi!
  rationale: Nagpapahayag ng mariing pagtutol; pinananatili ng tandang padamdam ang talas ng pagsalungat.
- source_word: בְּנִי הַחַי
  choice: ang anak ko ang buhay
  rationale: Pinananatili ang tahasang pagkokontrast ng Hebreo sa ‘ang buhay’ at ‘ang patay,’ sa halip na gawing simpleng ‘buhay ang anak ko.’
- source_word: וּבְנֵךְ הַמֵּת
  choice: at ang anak mo ang patay
  rationale: Kaayon ng paralelismong Hebreo at malinaw na tinutukoy kung alin sa dalawang bata ang patay.
- source_word: וְזֹאת אֹמֶרֶת
  choice: Sinabi naman ng isang ito
  rationale: Ang ‘isang ito’ ay nagpapanatili sa deiktikong lakas ng זֹאת, habang ang ‘naman’ ay natural na nagpapakita ng salitang sagutan.
- source_word: הֶחָי
  choice: ang buhay
  rationale: Pare-parehong salin ng anyong may pantukoy at pinananatili ang antitesis sa ‘ang patay.’
- source_word: וַתְּדַבֵּרְנָה
  choice: Ganito sila nagtalo
  rationale: Bagaman literal na ‘nagsalita sila,’ ipinakikita ng konteksto at ng ipinakitang salitang sagutan na isa itong pagtatalo; ang ‘ganito’ ay nagsisilbing likas na buod ng eksena.
- source_word: לִפְנֵי הַמֶּלֶךְ
  choice: sa harap ng hari
  rationale: Tuwiran at likas na katumbas na hindi nagdaragdag ng pangalang Solomon.
