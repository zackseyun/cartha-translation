translation:
  language: tl
  text: At namatay noong gabi ang anak na lalaki ng babaeng ito, dahil nahigaan niya ito.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaaring mas literal: “noong/nang nakahiga siya sa ibabaw niya.” Ang pang-ugnay ay maaari ring unawaing relatibo o temporal, ngunit ipinahihiwatig ng konteksto ang sanhi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: At namatay
  rationale: Ang wayyiqtol ng מוּת ay nagsasalaysay ng naganap na pangyayari; natural itong isalin sa payak na aspektong naganap sa Tagalog.
- source_word: בֶּן הָאִשָּׁה הַזֹּאת
  choice: ang anak na lalaki ng babaeng ito
  rationale: Pinananatili ng “anak na lalaki” ang tiyak na kasariang ipinahahayag ng בֶּן, at malinaw na inilalahad ang kaugnayang paari.
- source_word: לָיְלָה
  choice: nang gabing iyon
  rationale: Ipinahahayag nito ang panahon ng pagkamatay sa natural na salaysay na Tagalog. Ang “iyon” ay tumutukoy sa gabing isinasalaysay sa konteksto.
- source_word: אֲשֶׁר
  choice: dahil
  rationale: Bagaman maaari itong maging pang-ugnay na “nang” o “na,” ipinahihiwatig ng konteksto na ang pagkakahiga sa bata ang sanhi ng pagkamatay.
- source_word: שָׁכְבָה עָלָיו
  choice: nahigaan niya ito
  rationale: Natural at eksaktong ipinahahayag ng “nahigaan” ang di-sinasadyang pagkakahiga sa ibabaw ng bata at ang pisikal na presyur na tinutukoy ng שָׁכַב עַל.
theological_decisions:
- issue: Ugnayan ng אֲשֶׁר sa pagkamatay
  choice: 'Isinalin bilang sanhi: “dahil.”'
  alternative: “nang” o mas literal na “na”
  rationale: Hindi ganap na tiyak sa anyong gramatikal lamang ang ugnayang sanhi, ngunit malinaw sa konteksto na namatay ang bata dahil nahigaan siya ng ina; pinananatili sa talababa ang pormal na alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “anak na lalaki” upang mapanatili ang kasariang nasa Hebreo, at “nahigaan” bilang natural na salin ng pisikal na pagkakahiga sa ibabaw ng bata.
