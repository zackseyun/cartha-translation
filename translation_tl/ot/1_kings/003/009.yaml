revisions:
- from: Kaya bigyan mo ang iyong lingkod ng pusong nakikinig[a] upang humatol sa iyong bayan at kumilala sa pagitan ng mabuti at masama. Sapagkat sino ang may kakayahang humatol sa dakilang bayan mong ito?[b]
  to: Kaya bigyan mo ang iyong lingkod ng pusong nakikinig[a] upang humatol sa iyong bayan, upang makilala ang pagkakaiba ng mabuti at masama. Sapagkat sino ang may kakayahang humatol sa dakilang bayan[b] mong ito?
  rationale: Pinalitan ang hindi gaanong likas na «kumilala sa pagitan ng» ng «makilala ang pagkakaiba ng,» na mas idiomatiko sa modernong Filipino at akma sa diwang panghukuman ng לְהָבִין בֵּין. Inilipat ang marker b upang tuwirang nakaangkla sa «dakilang bayan.» Walang binagong kahulugan o idinagdag na interpretasyong doktrinal.
