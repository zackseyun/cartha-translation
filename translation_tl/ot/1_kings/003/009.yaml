base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/009.yaml
  text: So give your servant a listening heart to judge your people[a], to discern between good and evil[b], for who is able to judge this great people of yours?
translation:
  language: tl
  text: Kaya bigyan mo ang iyong lingkod ng pusong nakikinig[a] upang humatol sa iyong bayan, upang makilala ang pagkakaiba ng mabuti at masama. Sapagkat sino ang may kakayahang humatol sa dakilang bayan[b] mong ito?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “pusong nakauunawa”; literal, “pusong nakikinig.”
    reason: lexical_alternative
  - marker: b
    text: Ang “dakila” ay salin ng salitang Hebreo na literal na nangangahulugang “mabigat” o “may bigat,” na dito ay nagpapahayag ng kahalagahan ng bayan o ng bigat ng pamamahala rito.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתָּ
  choice: Kaya bigyan mo
  rationale: Ang waw na sinusundan ng pandiwang ganap ay gumaganap dito bilang pakiusap na bunga ng naunang sinabi ni Solomon. Likas sa Filipino ang “Kaya bigyan mo” at malinaw na ipinahahayag ang pagsusumamo.
- source_word: לְעַבְדְּךָ
  choice: ang iyong lingkod
  rationale: Ito ang karaniwang mapagpakumbabang pagtukoy ng hari sa sarili sa harap ng Diyos. Ang “lingkod” ay higit na angkop dito kaysa “alipin.”
- source_word: לֵב שֹׁמֵעַ
  choice: pusong nakikinig
  rationale: Pinananatili nito ang literal na larawan ng Hebreo—isang pusong nakikinig—na nagpapahiwatig ng pagiging handang tumanggap, umunawa, at tumugon.
- source_word: לִשְׁפֹּט
  choice: upang humatol
  rationale: Pinananatili ng “humatol” ang pangunahing diwang hudisyal ng שׁפט, habang maaari pa rin nitong saklawin sa konteksto ang tungkulin ng hari sa pamamahala.
- source_word: עַמְּךָ
  choice: iyong bayan
  rationale: Ang “bayan” ay likas na salin sa Filipino para sa isang sambayanang nasa ilalim ng pamumuno at pinananatili ang kaugnayang ang bayan ay sa Diyos.
- source_word: לְהָבִין
  choice: kumilala
  rationale: Sa kontekstong panghukuman, ipinahahayag ng “kumilala” ang kakayahang makita at matukoy nang may wastong pagkakaiba.
- source_word: בֵּין טוֹב לְרָע
  choice: sa pagitan ng mabuti at masama
  rationale: Tuwirang pinananatili ang moral at mapagpahalagang pananalita ng Hebreo sa halip na paliitin ito sa “tama at mali.”
- source_word: כִּי מִי יוּכַל
  choice: Sapagkat sino ang may kakayahang
  rationale: Ipinakikita nito na ang retorikal na tanong ang dahilan ng pakiusap ni Solomon at binibigyang-diin ang bigat ng tungkulin.
- source_word: הַכָּבֵד
  choice: dakila
  rationale: Ang salitang Hebreo ay literal na “mabigat” at maaari ring mangahulugang mahalaga, makabuluhan, o dakila. Ang “dakila” ay marangal at likas sa konteksto, habang inilalahad sa talababa ang literal na larawan.
theological_decisions:
- issue: Ang idyoma tungkol sa “puso” sa kahilingan ni Solomon
  choice: pusong nakikinig
  alternative: pusong nakauunawa
  rationale: Sa Hebreo, ang puso ay sentro hindi lamang ng damdamin kundi pati ng pag-iisip, pagpapasya, at kalooban. Pinananatili ng “pusong nakikinig” ang biblikal na larawan at ang pagiging bukás at masunurin, nang hindi ito nililimitahan sa talino lamang.
- issue: Saklaw ng tungkuling ipinahahayag ng שׁפט
  choice: humatol
  alternative: mamuno / mangasiwa ng katarungan
  rationale: Maaaring saklawin ng pandiwa ang pamamahala at paggagawad ng katarungan. Pinananatili ng “humatol” ang tuwirang kahulugan at ang kaugnayan nito sa pagkilala sa mabuti at masama, nang hindi ikinakaila ang mas malawak na tungkulin ng hari.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang Hebreong larawan ng “pusong nakikinig” at ang moral na pares na “mabuti at masama.” Inilipat ang marker tungkol sa הַכָּבֵד sa “dakilang bayan,” na siyang wastong salitang tinutukoy nito.
