  text: Then the king said, “Bring me a sword.” So they brought the sword before the king.
translation:
  language: tl
  text: Pagkatapos ay sinabi ng hari, “Dalhan ninyo ako ng isang tabak.” Kaya dinala nila ang tabak sa harap ng hari.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Pagkatapos ay sinabi
  rationale: Isinusulong ng waw-consecutive ang salaysay; likas sa modernong Tagalog ang “Pagkatapos ay sinabi” at malinaw nitong ipinapakita ang pagkakasunod-sunod.
- source_word: הַמֶּלֶךְ
  choice: ang hari
  rationale: Tuwirang salin ng tiyak na pangngalang may pantukoy.
- source_word: קְחוּ לִי
  choice: Dalhan ninyo ako
  rationale: Bagaman ang לקח ay literal na “kumuha,” sa kontekstong ito ay utos itong kunin at dalhin ang isang bagay sa nagsasalita. Pinananatili rin ng “ninyo” ang anyong maramihan ng pautos.
- source_word: חָרֶב
  choice: isang tabak
  rationale: Walang pantukoy ang unang pagbanggit, kaya ang “isang tabak” ang likas na pagpapahayag ng di-tiyak na kahulugan.
- source_word: וַיָּבִאוּ
  choice: Kaya dinala nila
  rationale: Ang pandiwang maramihan na may narrative waw ay nagsasaad ng sumunod na kilos bilang tugon sa utos; natural itong ipinahahayag ng “Kaya dinala nila.”
- source_word: הַחֶרֶב
  choice: ang tabak
  rationale: May pantukoy ang ikalawang pagbanggit at tumutukoy pabalik sa tabak na iniutos na dalhin.
- source_word: לִפְנֵי הַמֶּלֶךְ
  choice: sa harap ng hari
  rationale: Karaniwan at malinaw na salin ng לִפְנֵי sa kontekstong panghukuman, na nagpapahiwatig na dinala ito sa presensiya ng hari.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na simple ngunit marangal. Ginamit ang “tabak” sa halip na “espada” upang mapanatili ang tradisyonal at biblikal na himig nang hindi nagiging mahirap unawain; ang “Dalhan ninyo ako” ay natural at pinananatili ang maramihang pautos.
