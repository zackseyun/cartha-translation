revisions:
- from: At kung mamumuhay ka ayon sa aking mga daan, na sinusunod ang aking mga tuntunin at mga utos, gaya ng ginawa ng iyong amang si David, pahahabain ko ang iyong buhay.[a]
  to: At kung mamumuhay ka ayon sa aking mga daan at susundin mo ang aking mga tuntunin at mga utos, gaya ng pamumuhay ng iyong amang si David, pahahabain ko ang iyong buhay.[a]
  rationale: Pinalinaw ang kaugnayan ng pagsunod sa mga tuntunin at utos sa kondisyonal na pamumuhay ayon sa mga daan ng Diyos. Pinalitan ang pangkalahatang “gaya ng ginawa” ng “gaya ng pamumuhay” upang maipakita ang etikal na diwa at ang pag-uulit ng Hebreong הָלַךְ, habang nananatiling natural ang Filipino. Hindi binago ang kondisyonal na katangian ng pangako o ang kahulugan ng idyoma tungkol sa pagpapahaba ng buhay.
