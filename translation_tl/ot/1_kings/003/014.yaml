base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/014.yaml
  text: And if you walk in my ways[a], keeping my statutes and my commandments, as David your father walked, then I will lengthen your days.
translation:
  language: tl
  text: At kung mamumuhay ka ayon sa aking mga daan at susundin mo ang aking mga tuntunin at mga utos, gaya ng pamumuhay ng iyong amang si David, pahahabain ko ang iyong buhay.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa literal: “pahahabain ko ang iyong mga araw.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: At kung
  rationale: Pinananatili ang dugtong sa naunang sinabi at malinaw na ipinakikilala ang kondisyon.
- source_word: תֵּלֵךְ בִּדְרָכַי
  choice: mamumuhay ka ayon sa aking mga daan
  rationale: Ang literal na larawan ay paglakad, ngunit sa kontekstong tipanan tumutukoy ito sa asal at paraan ng pamumuhay; ang salin ay natural sa modernong Filipino habang pinananatili ang 'mga daan.'
- source_word: לִשְׁמֹר
  choice: na sinusunod
  rationale: Ipinapakita ang nilalaman o paraan ng pamumuhay ayon sa mga daan ng Diyos.
- source_word: חֻקַּי
  choice: aking mga tuntunin
  rationale: Karaniwang legal at tipanang termino; malinaw at naihihiwalay sa 'mga utos.'
- source_word: וּמִצְוֺתַי
  choice: at mga utos
  rationale: Tuwirang katumbas na nagpapanatili sa tipanang rehistro at sa pagkakaiba nito sa mga tuntunin.
- source_word: כַּאֲשֶׁר הָלַךְ
  choice: gaya ng ginawa
  rationale: Iniiwasan ang di-likas na pag-uulit ng metaporang 'lumakad' sa Filipino, ngunit pinananatili ang malinaw na paghahambing sa asal ni David.
- source_word: דָּוִיד אָבִיךָ
  choice: iyong amang si David
  rationale: Natural at marangal na ayos sa Filipino.
- source_word: וְהַאַרַכְתִּי אֶת יָמֶיךָ
  choice: pahahabain ko ang iyong buhay
  rationale: Natural na paglilipat ng Hebreong idyomang literal na 'pahahabain ko ang iyong mga araw,' na malinaw na nangangahulugang pagpapahaba ng buhay.
theological_decisions:
- issue: Kondisyonal na pangako ng mahabang buhay kaugnay ng pagsunod sa tipan
  choice: Tuwirang pinanatili ang kondisyong 'kung' at ang pangakong pahahabain ang buhay.
  alternative: Unawain bilang walang-kondisyong pangakong dinastiko o gawing pangkalahatang pagpapala lamang.
  rationale: Malinaw na iniuugnay ng Hebreo ang pangako kay Solomon sa kondisyon ng pamumuhay ayon sa mga daan ng Diyos at pagsunod sa kanyang mga tuntunin at utos.
translation_notes:
  register: Modernong Filipino na natural, marangal, at madaling maunawaan. Ginamit ang 'mamumuhay ayon sa aking mga daan' upang mapanatili ang tipanang diwa ng Hebreong metapora nang hindi nagiging alanganin ang Filipino. Ang talababa ay minarkahan sa pangunahing teksto.
