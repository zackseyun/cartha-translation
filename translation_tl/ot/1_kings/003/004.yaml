  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יֵּ֨לֶךְ הַ/מֶּ֤לֶךְ גִּבְעֹ֨נָ/ה֙ לִ/זְבֹּ֣חַ שָׁ֔ם כִּ֥י הִ֖יא הַ/בָּמָ֣ה הַ/גְּדוֹלָ֑ה אֶ֤לֶף עֹלוֹת֙ יַעֲלֶ֣ה שְׁלֹמֹ֔ה עַ֖ל הַ/מִּזְבֵּ֥חַ הַ/הֽוּא׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/004.yaml
  text: And the king went to Gibeon to sacrifice there[a], for that was the great high place. Solomon offered a thousand burnt offerings on that altar.
translation:
  language: tl
  text: Pumunta ang hari sa Gibeon upang maghandog doon, sapagkat iyon ang dakilang dambana sa mataas na lugar.[a] Naghandog si Solomon ng sanlibong handog na sinusunog sa altar na iyon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “pangunahing dambana sa mataas na lugar.” Ang salitang Hebreo na isinaling “dakila” ay maaaring tumukoy sa laki o sa pagiging tanyag o pangunahin.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: Pumunta
  rationale: Payak at likas na salin ng pandiwang הלך sa daloy ng salaysay; hindi likas sa pandiwa mismo ang diwang “umakyat.”
- source_word: גִּבְעֹנָה
  choice: sa Gibeon
  rationale: Ang hulaping lokatibong ה ay nagpapahiwatig ng patungong direksiyon; natural itong ipinahahayag sa Filipino sa pamamagitan ng “sa Gibeon.”
- source_word: לִזְבֹּחַ
  choice: upang maghandog
  rationale: Ipinahahayag ng infinitive na זבח ang layunin ng pagpunta at ang gawaing paghahain; ang “maghandog” ay malinaw at likas sa modernong Filipino.
- source_word: כִּי הִיא הַבָּמָה הַגְּדוֹלָה
  choice: sapagkat iyon ang dakilang dambana sa mataas na lugar
  rationale: Ang בָּמָה ay isang pook ng pagsamba at paghahandog, karaniwang nasa mataas na lugar. Pinananatili ng “dakilang” ang posibilidad na tumukoy ang הַגְּדוֹלָה sa laki o sa katanyagan/pangunahing katayuan.
- source_word: אֶלֶף עֹלוֹת
  choice: sanlibong handog na sinusunog
  rationale: Ang עֹלוֹת ay mga handog na ganap na sinusunog; pinananatili nang tuwiran ang bilang na isang libo.
- source_word: יַעֲלֶה
  choice: Naghandog
  rationale: Ang Hiphil ng עלה kasama ng עֹלוֹת ay idyomang nangangahulugang mag-alay ng handog na sinusunog. Sa kontekstong pasalaysay, natural itong ilahad bilang payak na naganap na kilos nang hindi ipinipilit ang diwang nakagawian.
- source_word: עַל הַמִּזְבֵּחַ הַהוּא
  choice: sa altar na iyon
  rationale: Likas na salin ng pariralang pang-ukol habang pinananatili ang diin ng demonstratibong “iyon.”
theological_decisions:
- issue: Paglalarawan sa בָּמָה sa konteksto ng pagsamba bago maitayo ang templo
  choice: dambana sa mataas na lugar
  alternative: pook-sambahan
  rationale: Pinananatili ng napiling salin ang tiyak na makasaysayan at panrelihiyong katangian ng בָּמָה, pati ang tensiyon tungkol sa paghahandog sa gayong mga pook, sa halip na gawing pangkalahatan lamang ang katawagan.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “dambana sa mataas na lugar” upang maging malinaw sa karaniwang mambabasa ang terminong kultiko, at “altar” bilang karaniwan at kinikilalang katawagan sa Filipino.
