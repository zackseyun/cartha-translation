base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/020.yaml
  text: She got up in the middle of the night and took my son from beside me while your servant was sleeping[a], and she laid him in her bosom, and laid her dead son in my bosom.
translation:
  language: tl
  text: Bumangon siya sa kalagitnaan ng gabi at kinuha ang anak ko mula sa tabi ko habang natutulog ang inyong lingkod na babae. Inihiga niya ito sa kanyang kandungan[a], at ang patay niyang anak ay inihiga niya sa kandungan ko.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring ‘sa kanyang dibdib … sa dibdib ko.’ Ang Hebreong חֵיק ay maaaring tumukoy sa kandungan o sa bahaging malapit sa dibdib.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּ/ת֨וֹךְ הַ/לַּ֜יְלָה
  choice: sa kalagitnaan ng gabi
  rationale: Ipinahahayag nito ang diwa ng בְּתוֹךְ bilang nasa gitna o kaloob-looban ng yugto ng gabi, hindi lamang basta ‘sa gabi.’
- source_word: מֵֽ/אֶצְלִ֗/י
  choice: mula sa tabi ko
  rationale: Ang אֵצֶל ay tumutukoy sa malapit na kinalalagyan sa tabi ng isang tao; natural at tiyak sa tagpong natutulog sila.
- source_word: וַ/אֲמָֽתְ/ךָ֙
  choice: ang inyong lingkod
  rationale: Pinananatili ang magalang at mapagpakumbabang pagtukoy ng babae sa sarili habang nakikipag-usap sa hari. Ang ‘inyong’ ay angkop sa marangal na pakikipag-usap sa modernong Filipino.
- source_word: יְשֵׁנָ֔ה
  choice: natutulog
  rationale: Inilalarawan ng anyo ang nagpapatuloy na kalagayan ng nagsasalita nang kunin ang bata.
- source_word: וַ/תַּשְׁכִּיבֵ֖/הוּ
  choice: inihiga niya ito
  rationale: Ang Hiphil ng שׁכב ay ‘pinahiga’ o ‘inihiga’; ang ‘inihiga’ ay natural sa konteksto ng pagtulog at malinaw na tumutukoy sa bata.
- source_word: בְּ/חֵיקָ֑/הּ … בְ/חֵיקִֽ/י
  choice: sa kanyang kandungan … sa kandungan ko
  rationale: Ang חֵיק ay maaaring tumukoy sa kandungan o dibdib. Ang ‘kandungan’ ay natural sa kasalukuyang Filipino at nagpapanatili sa malapit at mapag-arugang paglalagay sa bata nang hindi nagdaragdag ng ideya ng pagkarga sa mga bisig.
- source_word: הַ/מֵּ֖ת
  choice: patay niyang anak
  rationale: Ang participle ay gumaganap bilang panuring sa ‘anak’; ito ang tuwiran at natural na ayos sa Filipino.
theological_decisions: []
translation_notes:
  register: Makabagong Filipino na may marangal na himig. Ginamit ang ‘inyong lingkod’ upang mapanatili ang magalang na pananalita sa hari, at ‘kandungan’ bilang natural ngunit tumpak na katumbas ng חֵיק.
