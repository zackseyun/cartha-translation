  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יֶּאֱהַ֤ב שְׁלֹמֹה֙ אֶת יְהוָ֔ה לָ/לֶ֕כֶת בְּ/חֻקּ֖וֹת דָּוִ֣ד אָבִ֑י/ו רַ֚ק בַּ/בָּמ֔וֹת ה֥וּא מְזַבֵּ֖חַ וּ/מַקְטִֽיר־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/003.yaml
  text: Solomon loved Yahweh[a], walking in the statutes of David his father; only[b], he was sacrificing and burning incense at the high places.
translation:
  language: tl
  text: Minahal ni Solomon si Yahweh at namuhay ayon sa mga tuntunin ng kanyang amang si David. Ngunit[a] naghahandog siya at nagsusunog ng insenso sa matataas na dako.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “maliban lamang na naghahandog siya at nagsusunog ng insenso sa matataas na dako.”
    reason: alternative_reading
  - marker: b
    text: Ang “matataas na dako” ay mga lokal na lugar ng pagsamba, na karaniwang nasa mataas na lugar.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֶּאֱהַב
  choice: Minahal
  rationale: Tuwirang ipinahahayag ng אהב ang pag-ibig ni Solomon kay Yahweh at pinananatili ang positibong pagtataya ng tagapagsalaysay.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang transliterasyon ng personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
- source_word: לָלֶכֶת בְּחֻקּוֹת
  choice: namuhay ayon sa mga tuntunin
  rationale: Ang literal na paglakad ay idyoma para sa patuloy na asal o pamumuhay; natural itong naipahahayag sa modernong Tagalog bilang “namuhay ayon,” habang ang חֻקּוֹת ay tumutukoy sa itinakdang mga tuntunin.
- source_word: דָּוִד אָבִיו
  choice: kanyang amang si David
  rationale: Natural na ayos sa Tagalog na malinaw na pinananatili ang kaugnayan ni David bilang ama ni Solomon.
- source_word: רַק
  choice: Gayunman
  rationale: Ipinakikilala nito ang isang limitasyon o pasubali sa naunang positibong pahayag nang hindi ginagawang lubusang negatibo ang pagtataya.
- source_word: בַּבָּמוֹת
  choice: sa matataas na dako
  rationale: Tumutukoy ang בָּמוֹת sa mga lokal na lugar ng pagsamba, karaniwang nasa mataas na lugar; pinananatili ng salin ang tradisyonal na katawagan at nililinaw ito sa talababa.
- source_word: מְזַבֵּחַ
  choice: naghahandog
  rationale: Ang participle ay nagpapahiwatig ng nakagawian o nagpapatuloy na gawain; ipinahahayag ito ng aspektong imperpektibo sa Tagalog.
- source_word: וּמַקְטִיר
  choice: at nagsusunog ng insenso
  rationale: Sa konteksto ng pagsamba, ang Hiphil ng קטר ay maaaring tumukoy sa pagsusunog ng insenso o pagpapausok ng handog; ang “nagsusunog ng insenso” ang malinaw at natural na salin dito habang pinananatiling hiwalay sa paghahandog.
theological_decisions:
- issue: Pagtataya sa paraan ng pagsamba ni Solomon
  choice: Pinagtitibay muna ang tunay na pag-ibig ni Solomon kay Yahweh, saka nililimitahan ang papuri sa pamamagitan ng “Gayunman” dahil naghahandog siya sa matataas na dako.
  alternative: Maaaring unawain ang רַק bilang “maliban lamang na,” na mas mahigpit na nag-uugnay sa pasubali sa naunang papuri; maaari ring labis na bigyang-diin ang talata bilang ganap na pagsang-ayon o ganap na pagpuna.
  rationale: Ang pagkakasunod ng Hebreo ay positibong pahayag muna, kasunod ang limitasyong ipinakikilala ng רַק. Pinananatili ng salin ang tensiyon sa halip na magpasya para sa lubos na pagsang-ayon o lubos na paghatol.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “namuhay ayon” upang natural na maipahayag ang Hebreong idyoma ng paglakad, at “mga tuntunin” upang mapanatili ang legal at tipanang diwa ng חֻקּוֹת. Inilagay ang mga pananda ng talababa sa mismong bahaging kanilang nililinaw.
