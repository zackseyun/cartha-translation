base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/018.yaml
  text: And on the third day after I gave birth[a], this woman also gave birth. And we were together; there was no stranger with us in the house, only the two of us were in the house.
translation:
  language: tl
  text: At nang ikatlong araw matapos akong manganak, nanganak din ang babaeng ito. Magkasama kami noon; walang ibang taong kasama namin sa bahay[a]. Kaming dalawa lamang ang nasa bahay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “walang estranghero o tagalabas na kasama namin sa bahay.” Ang salitang Hebreo ay maaaring tumukoy sa isang taong hindi kabilang sa grupo o sambahayan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַּיּוֹם הַשְּׁלִישִׁי לְלִדְתִּי
  choice: At nang ikatlong araw matapos akong manganak
  rationale: Inihahayag ng parirala ang sumunod na pangyayari at ang panahong binibilang mula sa panganganak ng nagsasalita. Natural at malinaw sa modernong Tagalog ang “matapos akong manganak.”
- source_word: וַתֵּלֶד גַּם הָאִשָּׁה הַזֹּאת
  choice: nanganak din ang babaeng ito
  rationale: Pinananatili ng “babaeng ito” ang tuwirang pagtukoy ng demonstratibong Hebrew, at ng “din” ang diwa ng גַּם.
- source_word: וַאֲנַחְנוּ יַחְדָּו
  choice: Magkasama kami noon
  rationale: Ang יַחְדָּו ay nangangahulugang “magkasama.” Idinagdag ang natural na panandang “noon” upang malinaw na tumukoy sa kalagayan sa panahong iyon nang hindi nagdaragdag ng ideyang wala sa teksto.
- source_word: אֵין זָר אִתָּנוּ בַּבַּיִת
  choice: walang ibang taong kasama namin sa bahay
  rationale: Sa konteksto, ang זָר ay isang taong hindi kabilang sa dalawang babae—isang estranghero o tagalabas. Mas natural sa Tagalog ang “ibang tao,” habang inilalahad sa talababa ang mas literal na alternatibo.
- source_word: זוּלָתִי שְׁתַּיִם אֲנַחְנוּ בַּבָּיִת
  choice: Kaming dalawa lamang ang nasa bahay
  rationale: Malinaw at idiomatikong ipinapahayag nito ang eksklusibong diwa ng זוּלָתִי at pinananatili ang inulit na pagbanggit sa bahay.
