revisions:
- from: Nakipag-alyansa si Solomon sa pamamagitan ng pag-aasawa sa Faraon na hari ng Ehipto[a]. Kinuha niya bilang asawa ang anak na babae ng Faraon at dinala ito sa Lunsod ni David. Doon muna ito nanatili hanggang sa matapos ni Solomon ang pagtatayo ng sarili niyang palasyo, ng bahay ni Yahweh[b], at ng pader sa palibot ng Jerusalem.
  to: Nakipag-alyansa si Solomon sa pamamagitan ng pag-aasawa kay Faraon, hari ng Ehipto[a]. Kinuha niya bilang asawa ang anak na babae ni Faraon at dinala niya siya sa Lunsod ni David. Nanatili siya roon hanggang sa matapos ni Solomon ang pagtatayo ng sarili niyang bahay, ng bahay ni Yahweh[b], at ng pader sa palibot ng Jerusalem.
  rationale: Pinalitan ang “palasyo” ng “bahay” upang huwag lumampas sa saklaw ng Hebreo, at pinalitan ang impersonal na “ito” ng “siya.” Pinanatili ang paghahati sa mga pangungusap at ang pagpapahayag ng pansamantalang pananatili, na malinaw na iniuugnay ng “hanggang” sa konteksto nang walang pagtukoy sa susunod niyang tirahan.
