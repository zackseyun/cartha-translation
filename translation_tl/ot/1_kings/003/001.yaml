base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/001.yaml
  text: Solomon formed a marriage alliance with Pharaoh king of Egypt[a], and he took Pharaoh’s daughter and brought her into the city of David until he had finished building his own house, and the house of Yahweh[b], and the wall around Jerusalem.
translation:
  language: tl
  text: Nakipag-alyansa si Solomon sa pamamagitan ng pag-aasawa kay Faraon, hari ng Ehipto[a]. Kinuha niya bilang asawa ang anak na babae ni Faraon at dinala niya siya sa Lunsod ni David. Nanatili siya roon hanggang sa matapos ni Solomon ang pagtatayo ng sarili niyang bahay, ng bahay ni Yahweh[b], at ng pader sa palibot ng Jerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “Nakipagkamag-anak si Solomon kay Faraon sa pamamagitan ng pag-aasawa.” Ang pandiwang Hebreo ay tumutukoy sa pagpasok sa isang ugnayang pampamilya dahil sa pag-aasawa at, sa kontekstong ito, malamang na may pahiwatig ding pampolitika.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin, “templo ni Yahweh.” Literal itong “bahay ni Yahweh.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְחַתֵּן
  choice: Nakipag-alyansa ... sa pamamagitan ng pag-aasawa
  rationale: Ipinahahayag ng hitpael ng חתן ang pagpasok sa ugnayang dulot ng pag-aasawa; sa kontekstong maharlika, may malinaw ding pampolitikang pahiwatig. Pinananatili ng salin ang dalawang dimensiyon.
- source_word: אֶת פַּרְעֹה מֶלֶךְ מִצְרָיִם
  choice: sa Faraon na hari ng Ehipto
  rationale: Likas sa modernong Tagalog ang pariralang ito at malinaw nitong ipinakikilalang ang Faraon ang hari ng Ehipto.
- source_word: וַיִּקַּח אֶת בַּת פַּרְעֹה
  choice: Kinuha niya bilang asawa ang anak na babae ng Faraon
  rationale: Ang לקח na may babaeng tuwirang layon ay karaniwang idyoma para sa pag-aasawa. Idinagdag ang 'bilang asawa' upang maging malinaw at natural sa Tagalog.
- source_word: וַיְבִיאֶהָ אֶל עִיר דָּוִד
  choice: dinala ito sa Lunsod ni David
  rationale: Tuwirang inililipat ang kilos at patutunguhan. Ginamit ang 'ito' bilang pormal at malinaw na panghalip sa salaysay.
- source_word: עַד כַּלֹּתוֹ לִבְנוֹת
  choice: hanggang sa matapos ni Solomon ang pagtatayo
  rationale: Ipinakikita ng עַד ang hangganang temporal. Inulit ang pangalang Solomon upang maiwasan ang kalabuan ng panghalip sa Tagalog.
- source_word: אֶת בֵּיתוֹ
  choice: sarili niyang palasyo
  rationale: Bagaman literal na 'bahay niya,' sa kontekstong maharlika ay tumutukoy ito sa tirahan o kompleks ng hari. Ang 'palasyo' ay malinaw sa karaniwang mambabasa, samantalang ang 'sarili niyang' ay pinananatili ang kaibahan nito sa bahay ni Yahweh.
- source_word: וְאֶת בֵּית יְהוָה
  choice: ng bahay ni Yahweh
  rationale: Pinananatili ang konkretong metaporang 'bahay' ng Hebreo sa halip na agad itong gawing 'templo,' at isinasalin ang banal na pangalan bilang Yahweh.
- source_word: וְאֶת חוֹמַת יְרוּשָׁלִַם סָבִיב
  choice: at ng pader sa palibot ng Jerusalem
  rationale: Natural na Tagalog ito para sa iisang pader o muog na nakapalibot sa lungsod.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Personal na pangalan ang nasa tekstong Hebreo, kaya pinananatili ito bilang 'Yahweh' sa halip na palitan ng isang titulo.
- issue: Paglilipat ng בֵּית יְהוָה
  choice: bahay ni Yahweh
  alternative: templo ni Yahweh
  rationale: Ang 'bahay ni Yahweh' ang mas pormal na katumbas at pinananatili ang bokabularyo at larawan ng pinagmulang teksto; ipinaliliwanag sa talababa ang mas kontekstuwal na 'templo.'
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling basahin. Hinati sa tatlong pangungusap ang mahabang Hebreong pangungusap upang maging natural sa Tagalog. Ang 'Doon muna ito nanatili' ay nagpapaliwanag sa ipinahihiwatig na pansamantalang paninirahan hanggang matapos ang mga gusali, nang hindi tinutukoy kung saan siya lumipat pagkatapos.
