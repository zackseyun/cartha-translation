lexical_decisions:
- source_word: אָז
  choice: Pagkatapos
  rationale: Panandang temporal na nagbubukas ng kasunod na tagpo; natural ito sa makabagong salaysay at pinananatili ang pagkakasunod-sunod.
- source_word: תָּבֹאנָה
  choice: lumapit
  rationale: Ang Qal imperfect na 3fp ng בוא, kasunod ng אָז sa salaysay, ay tumutukoy sa pagpunta ng mga babae sa kinaroroonan ng hari; mas natural dito ang “lumapit” kaysa literal na “dumating.”
- source_word: שְׁתַּיִם נָשִׁים
  choice: dalawang babae
  rationale: Tuwirang salin ng bilang at pangngalan sa natural na ayos ng Tagalog.
- source_word: זֹנוֹת
  choice: nagbebenta ng aliw
  rationale: Ipinahahayag ang hanapbuhay na tinutukoy ng participle sa dignified at madaling maunawaang modernong Filipino, nang hindi gumagamit ng lipas o mapanlait na katawagan.
- source_word: אֶל הַמֶּלֶךְ
  choice: sa hari
  rationale: Pinananatili ang direksiyon ng pagkilos patungo sa hari; kasama ng “lumapit,” malinaw ang ugnayang ito.
- source_word: וַתַּעֲמֹדְנָה
  choice: at tumayo
  rationale: Tuwirang ipinagpapatuloy ang kilos sa salaysay nang hindi dinaragdagan ng interpretasyong legal.
- source_word: לְפָנָיו
  choice: sa harap niya
  rationale: Natural na katumbas ng Hebreong idyoma para sa pagtayo sa presensiya ng isang pinuno o hukom.
