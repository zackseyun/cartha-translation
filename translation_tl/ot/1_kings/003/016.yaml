  text: Noon, lumapit sa hari ang dalawang babaeng prostituta at tumayo sila sa harap niya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O kaya: “Noon, lumapit sa hari ang dalawang patutot at tumayo sila sa harap niya.”'
