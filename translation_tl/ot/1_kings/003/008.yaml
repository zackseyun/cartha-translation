base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/008.yaml
  text: And your servant is in the midst of your people whom you have chosen[a], a great people[b], too numerous to be counted or numbered.
translation:
  language: tl
  text: At ang lingkod mo ay nasa gitna ng bayan mo na pinili mo, isang bayang napakarami[a], na hindi mabibilang at hindi matutuos dahil sa napakaraming bilang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “isang malaking bayan.”
    reason: Maaaring ipahiwatig ng רָב ang kadakilaan o laki sa pangkalahatan, bagaman ang kasunod na parirala ay nagbibigay-diin sa napakaraming bilang.
lexical_decisions:
- source_word: וְעַבְדְּךָ
  choice: At ang lingkod mo
  rationale: Ang “lingkod” ay natural at marangal sa mapagpakumbabang pananalita ni Solomon sa Diyos, habang pinananatili ang diwa ng pagpapasakop ng עֶבֶד.
- source_word: בְּתוֹךְ עַמְּךָ
  choice: ay nasa gitna ng bayan mo
  rationale: Tuwirang ipinapahayag ng “nasa gitna” ang kalagayan ni Solomon sa piling ng sambayanang pag-aari ng Diyos; ang “bayan” ay angkop sa kolektibong עַם.
- source_word: אֲשֶׁר בָּחָרְתָּ
  choice: na pinili mo
  rationale: Pinananatili nito nang walang pagpapalawak ang tahasang pahayag na ang Diyos ang pumili sa bayang tinutukoy.
- source_word: עַם רָב
  choice: isang napakaraming bayan
  rationale: Sa konteksto, ang רָב ay pangunahing tumutukoy sa laki ng bilang, gaya ng nililinaw ng kasunod na kawalang-kakayahang bilangin ang bayan. Itinatala sa talababa ang posibleng mas malawak na saling “malaking bayan.”
- source_word: לֹא יִמָּנֶה וְלֹא יִסָּפֵר
  choice: na hindi mabibilang at hindi matutuos
  rationale: Pinananatili ang magkatulad ngunit dobleng pandiwa ng Hebreo sa pamamagitan ng dalawang natural na salitang Filipino para sa pagbilang o pagtatala ng dami.
- source_word: מֵרֹב
  choice: dahil sa sobrang dami
  rationale: 'Tahasan nitong pinananatili ang sanhi: hindi sila mabibilang dahil sa napakalaking dami.'
theological_decisions:
- issue: Ang Israel bilang bayang pinili at pag-aari ng Diyos
  choice: bayan mo na pinili mo
  alternative: ang iyong piniling bayan
  rationale: Pinananatili ng napiling ayos ang dalawang magkahiwalay na diin ng Hebreo—pag-aari ng Diyos ang bayan at siya ang pumili rito—nang hindi nagdaragdag ng kalaunang doktrinal na paliwanag.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “mo” sa halip na “iyong” upang maging natural sa kasalukuyang pananalita, habang nananatiling angkop sa panalangin. Pinanatili ang pag-uulit na “hindi mabibilang at hindi matutuos” upang katawanin ang parallelism ng Hebreo.
