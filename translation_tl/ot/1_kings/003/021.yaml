  source_fidelity: Ang draft ay wastong naghahatid ng pagbangon, pagpapasuso, pagkamatay ng sanggol, at masusing pagtingin. Gayunman, ang huling sugnay ay nawawalan ng tahasang pagtukoy na ang bata ay ang nagsasalita's son, samantalang may 'bᵉnî' sa Hebreo kapwa sa una at huling pagtukoy.
