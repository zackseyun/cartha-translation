  terminology: Ang 'pasusuhin' ay angkop para sa לְהֵינִיק, at ang 'anak kong lalaki' ay wastong naghahayag ng kasarian ng בְּנִי. Dapat panatilihin ang 'anak kong lalaki' sa huling sugnay rin.
