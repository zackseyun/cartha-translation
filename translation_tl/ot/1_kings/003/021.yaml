base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/021.yaml
  text: When I got up in the morning to nurse my son[a], behold, he was dead. But when I looked closely at him in the morning, behold, he was not my son[b], whom I had borne.
translation:
  language: tl
  text: Noong umaga, bumangon ako upang pasusuhin ang anak kong lalaki, at nakita kong patay na siya. Ngunit nang masusi ko siyang tingnan noong umagang iyon, nakita kong hindi pala siya ang anak kong lalaki na isinilang ko.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאָקֻם בַּבֹּקֶר
  choice: Kinaumagahan, bumangon ako
  rationale: Likas na salaysay sa modernong Tagalog para sa pagbangon sa umaga; pinananatili ang temporal na pagkakasunod ng Hebreo.
- source_word: לְהֵינִיק
  choice: para pasusuhin
  rationale: Ang Hiphil infinitive ng ינק ay tumutukoy sa pagpapasuso sa sanggol. Ang “pasusuhin” ay tuwiran at karaniwang salita sa Tagalog.
- source_word: אֶת־בְּנִי
  choice: ang anak kong lalaki
  rationale: Tiyak na lalaki ang בן; nililinaw ito sa Tagalog sapagkat hindi nagpapakita ng kasarian ang salitang “anak” lamang.
- source_word: וְהִנֵּה מֵת
  choice: ngunit patay na pala siya
  rationale: Ipinahahayag ng “pala” ang biglaang pagkatuklas na hudyat ng וְהִנֵּה, samantalang malinaw na inilalarawan ng “patay na” ang kalagayan ng sanggol.
- source_word: וָאֶתְבּוֹנֵן אֵלָיו
  choice: Nang tingnan ko siyang mabuti
  rationale: Ipinahahayag ng anyong Hitpolel ang masusi at sinadyang pagtingin, hindi isang pahapyaw na sulyap.
- source_word: בַּבֹּקֶר
  choice: nang umagang iyon
  rationale: Pinananatili ang ikalawang pagbanggit sa umaga sa Hebreo, ngunit isinasadula ito nang natural sa Tagalog.
- source_word: וְהִנֵּה לֹא הָיָה בְנִי
  choice: nakita kong hindi pala siya ang anak
  rationale: Muling ipinahahayag ng “pala” ang pagkilala o pagkatuklas na minamarkahan ng וְהִנֵּה; pinananatiling personal ang pagtukoy sa bata sa pamamagitan ng “siya.”
- source_word: אֲשֶׁר יָלָדְתִּי
  choice: na isinilang ko
  rationale: Tuwirang tumutukoy ang ילד sa sariling panganganak ng nagsasalita. Ang “isinilang ko” ay maikli, marangal, at natural sa konteksto.
