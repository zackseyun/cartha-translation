  to: Noong umaga, bumangon ako upang pasusuhin ang anak kong lalaki, at nakita kong patay na siya. Ngunit nang masusi ko siyang tingnan noong umagang iyon, nakita kong hindi pala siya ang anak kong lalaki na isinilang ko.
