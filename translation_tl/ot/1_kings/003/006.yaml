id: 1KI.3.6
reference: 1 Kings 3:6
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר שְׁלֹמֹ֗ה אַתָּ֨ה עָשִׂ֜יתָ עִם עַבְדְּ/ךָ֙ דָוִ֣ד אָבִ/י֮ חֶ֣סֶד גָּדוֹל֒ כַּ/אֲשֶׁר֩ הָלַ֨ךְ לְ/פָנֶ֜י/ךָ בֶּ/אֱמֶ֧ת וּ/בִ/צְדָקָ֛ה וּ/בְ/יִשְׁרַ֥ת לֵבָ֖ב עִמָּ֑/ךְ וַ/תִּשְׁמָר ל֗/וֹ אֶת הַ/חֶ֤סֶד הַ/גָּדוֹל֙ הַ/זֶּ֔ה וַ/תִּתֶּן ל֥/וֹ בֵ֛ן יֹשֵׁ֥ב עַל כִּסְא֖/וֹ כַּ/יּ֥וֹם הַ/זֶּֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/006.yaml
  text: And Solomon said[a], “You have shown great covenant faithfulness to your servant David my father, because he walked before you in faithfulness, in righteousness, and in uprightness of heart with you; and you have kept for him this great covenant faithfulness and have given him a son sitting on his throne[c][b], as it is this day.”
translation:
  language: tl
  text: At sinabi ni Solomon, “Nagpakita ka ng dakilang tapat na pag-ibig[a] sa lingkod mong si David na aking ama, sapagkat namuhay siya sa iyong harapan nang may katapatan[b] at katuwiran, at may pusong matuwid sa iyo. Iningatan mo para sa kanya ang dakilang tapat na pag-ibig na ito at binigyan mo siya ng isang anak na nakaupo sa kanyang trono, tulad ng nakikita ngayon.”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “katapatan sa tipan,” “matatag na pag-ibig,” o “tapat na kagandahang-loob.”
    reason: lexical_alternative
  - marker: b
    text: Ang salitang Hebreo ay maaari ring mangahulugang “katotohanan” o “integridad.”
    reason: lexical_alternative
  - marker: c
    text: Literal na “gaya sa araw na ito,” isang Hebreong idyoma na nagsasabing ang kasalukuyang kalagayan ay hayag na katibayan nito.
    reason: cultural_note
lexical_decisions:
- source_word: חֶסֶד
  choice: tapat na pag-ibig
  rationale: Ipinahahayag nito ang matatag at tapat na pag-ibig ng Diyos kay David sa konteksto ng pangako at tipan, nang hindi nililimitahan ang salita sa damdamin lamang o sa isang teknikal na terminong teolohikal.
- source_word: עָשִׂיתָ עִם
  choice: nagpakita ka ... sa
  rationale: Likas sa modernong Tagalog ang pariralang “magpakita ng tapat na pag-ibig sa” at tumpak nitong inihahatid ang Hebreong idyoma.
- source_word: עַבְדְּךָ
  choice: lingkod mo
  rationale: Sa panalangin ng hari sa Diyos, ang “lingkod” ang natural na kahulugan at malinaw na nagpapahayag ng pagpapasakop ni David sa Diyos.
- source_word: כַּאֲשֶׁר
  choice: sapagkat
  rationale: Sa konteksto, ipinakikita ng kasunod na sugnay ang batayan ng pahayag ni Solomon; natural itong ipinahahayag ng “sapagkat.”
- source_word: הָלַךְ לְפָנֶיךָ
  choice: namuhay siya sa iyong harapan
  rationale: Inihahatid nito sa karaniwang Tagalog ang Hebreong talinghaga tungkol sa paraan ng pamumuhay sa harapan ng Diyos.
- source_word: בֶּאֱמֶת
  choice: nang may katapatan
  rationale: Maaaring mangahulugan ang אֱמֶת ng katotohanan, katapatan, o integridad. Ang “may katapatan” ay angkop sa paglalarawan sa pamumuhay ni David ngunit pinananatili sa talababa ang ibang posibilidad.
- source_word: בִּצְדָקָה
  choice: katuwiran
  rationale: Tuwirang ipinahahayag nito ang moral na pagiging matuwid na tinutukoy sa talata.
- source_word: וּבְיִשְׁרַת לֵבָב
  choice: pusong matuwid
  rationale: Pinananatili nito ang larawan ng Hebreo at natural na tumutukoy sa panloob na integridad at katapatan.
- source_word: עִמָּךְ
  choice: sa pakikisama sa iyo
  rationale: Ipinananatili nito ang ugnayang ipinahahayag ng literal na “kasama mo,” habang ginagawa itong malinaw at natural sa Tagalog.
- source_word: וַתִּשְׁמָר לוֹ
  choice: iningatan mo para sa kanya
  rationale: Inihahatid nito ang pagpapanatili ng Diyos sa naunang tapat na pag-ibig at pangako para kay David.
- source_word: בֵן יֹשֵׁב עַל כִּסְאוֹ
  choice: isang anak na nakaupo sa kanyang trono
  rationale: Pinananatili ng “nakaupo” ang kasalukuyang kalagayang ipinahahayag ng Hebreong participle at ang konkretong katuparan kay Solomon.
- source_word: כַּיּוֹם הַזֶּה
  choice: gaya ng nakikita sa araw na ito
  rationale: Nililinaw nito ang Hebreong idyoma bilang pagtukoy sa kasalukuyan at hayag na katibayan ng katuparan.
theological_decisions:
- issue: Kahulugan ng חֶסֶד sa konteksto ng tipan at paghahari
  choice: tapat na pag-ibig
  alternative: katapatan sa tipan; matatag na pag-ibig; kagandahang-loob
  rationale: Ang “tapat na pag-ibig” ay natural sa Tagalog at pinagsasama ang pagmamahal at matatag na katapatan ng Diyos. Itinatala sa talababa ang malinaw na kaugnayan nito sa tipan nang hindi ginagawang mas teknikal ang pangunahing teksto kaysa sa Hebreo.
- issue: Ugnayan ng katapatan ni David at ng tapat na pag-ibig ng Diyos
  choice: sapagkat namuhay siya
  alternative: ayon sa paraan ng pamumuhay niya; kung paanong namuhay siya
  rationale: Pinahihintulutan ng כַּאֲשֶׁר ang isang causal na pagbasa sa kontekstong ito. Hindi pinalalawak ng salin ang pahayag tungo sa isang sistematikong doktrina tungkol sa merito o kondisyon ng tipan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “namuhay sa iyong harapan” upang mapanatili ang biblikal na diwa ng Hebreong idyoma nang hindi maging lipas o malabo. Ang “tapat na pag-ibig” ay mas likas sa pangunahing teksto kaysa sa teknikal na “katapatan sa tipan,” na inilagay bilang leksikal na alternatibo sa talababa.
