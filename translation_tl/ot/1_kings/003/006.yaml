  - severity: low
    issue: Ang “gaya ng nakikita sa araw na ito” ay medyo mabigat sa modernong Tagalog.
    rationale: Ang “tulad ng nakikita ngayon” ay pinananatili ang deiktikong idiom at ang diwa ng hayag na kasalukuyang katuparan.
