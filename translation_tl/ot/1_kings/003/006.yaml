revisions:
- from: At sinabi ni Solomon, “Nagpakita ka ng dakilang tapat na pag-ibig[a] sa lingkod mong si David na aking ama, sapagkat namuhay siya sa iyong harapan nang may katapatan[b], katuwiran, at pusong matuwid sa pakikisama sa iyo. Iningatan mo para sa kanya ang dakilang tapat na pag-ibig na ito at binigyan mo siya ng isang anak na nakaupo sa kanyang trono, gaya ng nakikita sa araw na ito.”[c]
  to: At sinabi ni Solomon, “Nagpakita ka ng dakilang tapat na pag-ibig[a] sa lingkod mong si David na aking ama, sapagkat namuhay siya sa iyong harapan nang may katapatan[b] at katuwiran, at may pusong matuwid sa iyo. Iningatan mo para sa kanya ang dakilang tapat na pag-ibig na ito at binigyan mo siya ng isang anak na nakaupo sa kanyang trono, tulad ng nakikita ngayon.”[c]
  rationale: Inayos ang di-likas na “sa pakikisama sa iyo” upang maipahayag nang malinaw ang Hebreong paglalarawan sa matuwid na puso ni David sa kanyang ugnayan sa Diyos, nang hindi ipinapalit ang “kasama mo” sa isang mas makitid na doktrinal na pahayag. Pinakinis din ang huling idyoma para sa modernong Tagalog. Ang lahat ng footnote marker ay nananatiling nakalapat sa kanilang tinutukoy na salita o parirala.
