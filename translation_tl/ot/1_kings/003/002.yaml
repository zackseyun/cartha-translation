id: 1KI.3.2
reference: 1 Kings 3:2
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: רַ֣ק הָ/עָ֔ם מְזַבְּחִ֖ים בַּ/בָּמ֑וֹת כִּ֠י לֹא נִבְנָ֥ה בַ֨יִת֙ לְ/שֵׁ֣ם יְהוָ֔ה עַ֖ד הַ/יָּמִ֥ים הָ/הֵֽם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/002.yaml
  text: Only the people were sacrificing at the high places[a], because no house had yet been built for the name of Yahweh in those days.
translation:
  language: tl
  text: Ngunit ang mga tao ay naghahandog noon sa matataas na lugar[a], sapagkat wala pang naitatayong bahay para sa pangalan ni Yahweh nang mga panahong iyon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “matataas na lugar” ay mga lokal na pook-sambahan o dambana, na madalas ay nasa mataas na lugar.
    reason: Nililinaw ang panrelihiyong kahulugan ng terminong Hebreo nang hindi ito pinapalitan ng mas makitid na pakahulugan sa pangunahing teksto.
lexical_decisions:
- source_word: רַק
  choice: Ngunit
  rationale: Dito, ang salita ay nagpapakilala ng isang limitasyon sa naunang positibong paglalarawan kay Solomon; natural na ipinahahayag ito ng “Ngunit” sa Tagalog.
- source_word: הָעָם
  choice: ang mga tao
  rationale: Tumutukoy ito sa sambayanang nagsasagawa ng pagsamba, nang hindi ipinapalagay na teknikal na kaiba sila sa mga pinuno.
- source_word: מְזַבְּחִים
  choice: naghahandog pa noon
  rationale: Ang participle ay nagpapahiwatig ng nagpapatuloy o nakaugaliang gawain; naipahahayag ito ng pariralang ito sa natural na Tagalog.
- source_word: בַּבָּמוֹת
  choice: sa matataas na lugar
  rationale: Pinananatili nito ang karaniwang katawagan para sa mga pook-sambahan o dambanang madalas, bagaman hindi palaging, nasa mataas na lugar.
- source_word: כִּי
  choice: sapagkat
  rationale: Malinaw nitong ipinakikita na ang kasunod na sugnay ang dahilan ng paghahandog sa mga matataas na lugar.
- source_word: לֹא נִבְנָה בַיִת
  choice: wala pang naitatayong bahay
  rationale: Pinananatili ang literal na “bahay” at ang pasibong diwa, habang ipinahihiwatig ng “pa” na hindi pa ito naitatayo hanggang sa panahong tinutukoy.
- source_word: לְשֵׁם יְהוָה
  choice: para sa pangalan ni Yahweh
  rationale: Pinananatili ang mahalagang teolohikal na pahayag tungkol sa pangalan ni Yahweh sa halip na gawing simpleng “para kay Yahweh.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang isinasalin ang pangalang tipan na kinakatawan ng Tetragrammaton.
- source_word: עַד הַיָּמִים הָהֵם
  choice: hanggang sa mga araw na iyon
  rationale: Malapit ito sa Hebreong temporal na pahayag at malinaw na tumutukoy sa kalagayang nagpatuloy hanggang sa panahong iyon.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Nasa teksto ang mismong pangalang tipan; ang “Yahweh” ay pinananatili ito sa halip na palitan ng isang titulo.
- issue: Kung isasalin ang בַיִת bilang “bahay” o tahasang “templo”
  choice: bahay sa pangunahing teksto, na nililinaw bilang templo sa talababa
  alternative: templo
  rationale: Ang leksikal na kahulugan ay “bahay,” samantalang ang pariralang “para sa pangalan ni Yahweh” at ang konteksto ang tumutukoy sa templo. Pinananatili nito ang anyo ng pinagmulan nang hindi iniiwan na malabo ang kahulugan.
- issue: Pagsusuri sa paghahandog sa matataas na lugar
  choice: Hindi tahasang tinawag na kasalanan sa talatang ito
  alternative: Isaling may lantad na paghatol sa gawain
  rationale: Ang רַק ay naglalagay ng limitasyon o kaibahan, ngunit ang ibinigay na dahilan ay hindi pa naitatayo ang templo. Hindi dapat dagdagan ang talata ng mas tiyak na hatol kaysa sa mismong sinabi nito.
translation_notes:
  register: Makabagong, marangal, at madaling maunawaang Filipino. Ginamit ang “sapagkat” at “naitatayong bahay” upang mapanatili ang dignidad at katapatan sa Hebreo, habang ang “pa noon” ay nagpapahayag ng nakaugaliang kilos.
