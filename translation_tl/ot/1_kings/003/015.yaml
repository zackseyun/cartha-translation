  to: Nagising si Solomon, at panaginip pala iyon. Pumunta siya sa Jerusalem at tumayo sa harap ng kaban ng tipan ng Panginoon. Naghandog siya ng mga handog na sinusunog at mga handog pangkapayapaan[a], at nagdaos siya ng handaan para sa lahat ng kanyang mga lingkod[b].
