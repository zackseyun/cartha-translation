    rationale: Hindi binabanggit ng Hebreo ang pang-abay na ito. Maliit lamang ang dagdag dahil malinaw ang tagpuan, ngunit hindi ito kailangan upang maging natural ang salin.
  - severity: medium
    issue: Ang “naghanda siya ng isang handaan” ay hindi ganap na tumutugma sa וַיַּעַשׂ מִשְׁתֶּה.
    rationale: Ang pandiwang עשה rito ay nagsasaad na siya ay gumawa/nagdaos ng piging, hindi lamang na inihanda niya ito. Ang “nagdaos ng handaan” ay mas malapit at natural.
  - severity: low
    issue: Ang paliwanag sa talababa a ay masyadong tiyak sa anyong “isang salu-salong pinagsasaluhan.”
    rationale: Ang שְׁלָמִים ay kategorya ng handog na may kaugnayan sa kapayapaan/kagalingan at maaaring may pagkaing pinagsasaluhan. Mainam na ipahayag ito bilang posibleng diin, hindi bilang kumpletong depinisyon ng termino.
