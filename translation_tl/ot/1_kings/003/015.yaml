base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/015.yaml
  text: Then Solomon awoke[a], and behold, it was a dream. And he came to Jerusalem and stood before the ark of the covenant of the LORD, and offered up burnt offerings and made peace offerings, and made a feast for all his servants.
translation:
  language: tl
  text: Nagising si Solomon, at panaginip pala iyon. Pumunta siya sa Jerusalem at tumayo sa harap ng kaban ng tipan ng Panginoon. Naghandog siya ng mga handog na sinusunog at mga handog pangkapayapaan[a], at nagdaos siya ng handaan para sa lahat ng kanyang mga lingkod[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga handog para sa mabuting ugnayan” o “mga handog ng pakikisalo.” Ang terminong ito ay maaari ring magdiin sa pakikisalo sa pagkaing kaugnay ng handog.
    reason: Pinananatili ang lawak ng kahulugan ng שְׁלָמִים nang hindi ginagawang iisang tiyak na kahulugan ang pakikisalo.
  - marker: b
    text: O “mga tauhan” o “mga opisyal.”
    reason: Sa maharlikang konteksto, ang עֲבָדָיו ay maaari ring tumukoy sa mga naglilingkod sa hari bilang tauhan o opisyal.
lexical_decisions:
- source_word: וַיִּקַץ
  choice: Nagising
  rationale: Tuwirang ipinapahayag ng pandiwa ang paggising mula sa pagkakatulog at likas ito sa makabagong salaysay sa Filipino.
- source_word: וְהִנֵּה חֲלוֹם
  choice: at napagtanto niyang panaginip pala iyon
  rationale: Ipinahihiwatig ng הִנֵּה ang bigla o mariing pagkilala sa kalagayan. Ang “pala” ay natural na Filipino para sa natuklasang katotohanan, habang ang “napagtanto” ay ginagawang malinaw ang eliptikong Hebreo nang hindi binabago ang diwa.
- source_word: וַיָּבוֹא יְרוּשָׁלִַם
  choice: Pumunta siya sa Jerusalem
  rationale: Ang בוא ay pagdating o pagpasok. Ang “pumunta” ay natural mula sa pananaw ng salaysay; hindi ginamit ang “bumalik” sapagkat hindi iyon tahasang sinasabi rito.
- source_word: וַיַּעֲמֹד לִפְנֵי
  choice: tumayo sa harap ng
  rationale: Pinananatili nito ang karaniwang idyomang Hebreo ng pagharap o paglitaw sa presensya ng isang tao o banal na bagay.
- source_word: אֲרוֹן בְּרִית אֲדֹנָי
  choice: kaban ng tipan ng Panginoon
  rationale: Malinaw at natural nitong pinananatili ang ugnayan ng magkakasunod na pangngalan sa Hebreo. Ang אֲדֹנָי sa ibinigay na teksto ay titulong tumutukoy sa Diyos at angkop na isinalin na “Panginoon.”
- source_word: וַיַּעַל עֹלוֹת
  choice: Naghandog siya roon ng mga handog na sinusunog
  rationale: Ang עֹלוֹת ay mga haing inihahandog sa pamamagitan ng ganap na pagsunog. Ang “roón” ay likas na tumutukoy sa lugar sa harap ng kaban at nililinaw ang daloy nang hindi nagdaragdag ng bagong pangyayari.
- source_word: שְׁלָמִים
  choice: mga handog pangkapayapaan
  rationale: Ito ang tuwirang katawagan sa uring ito ng handog at iniiwasang paliitin ang kahulugan sa pakikisalo lamang; ipinapaliwanag sa talababa ang posibleng diin sa mabuting ugnayan at sama-samang pagkain.
- source_word: מִשְׁתֶּה
  choice: isang handaan
  rationale: Ang salita ay tumutukoy sa piging o salu-salong may pagkain at inumin. Ang “handaan” ay pangkaraniwan, malinaw, at angkop sa pagdiriwang.
- source_word: לְכָל עֲבָדָיו
  choice: para sa lahat ng kanyang mga lingkod
  rationale: Ang עֲבָדָיו ay literal na mga lingkod ngunit sa kontekstong maharlika ay maaari ring tumukoy sa mga opisyal o tauhan ng hari; pinananatili sa teksto ang mas malawak na salin at inilalahad sa talababa ang alternatibo.
theological_decisions:
- issue: Pagpapangalan sa Diyos sa pariralang אֲרוֹן בְּרִית אֲדֹנָי
  choice: kaban ng tipan ng Panginoon
  alternative: kaban ng tipan ng PANGINOON
  rationale: Ang anyong nasa ibinigay na WLC source ay אֲדֹנָי, “Panginoon,” hindi ang tahasang tetragrammaton יהוה. Kaya ginamit ang karaniwang titulong “Panginoon” sa halip na palimbaging “PANGINOON,” na karaniwang nakalaan sa YHWH.
- issue: Kahulugan ng שְׁלָמִים
  choice: mga handog pangkapayapaan
  alternative: mga handog para sa mabuting ugnayan / mga handog ng pakikisalo
  rationale: Ang terminong panghain ay may kaugnayan sa kapayapaan, kabuuan, at pakikisalo sa pagkaing mula sa handog. Hindi nilutas ang lawak ng kahulugan sa iisang paliwanag lamang; pinanatili ang tradisyonal at malawak na katawagan, na may talababa tungkol sa ibang diin.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang sunod-sunod na kilos ng salaysay, ngunit inayos ang mga pangungusap upang maging natural sa pagbasa. Ginamit ang “panaginip pala iyon” upang maihatid ang biglang pagkilala na ipinahihiwatig ng הִנֵּה.
