base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/007.yaml
  text: And now[a], O Yahweh my God, you have made your servant king in place of David my father, though I am a little child[b]; I do not know how to go out or come in.
translation:
  language: tl
  text: At ngayon, Yahweh na aking Diyos, ginawa mong hari ang iyong lingkod bilang kahalili ni David na aking ama. Ngunit ako’y isa lamang batang-bata[a]; hindi ko alam kung paano lumabas at pumasok[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “isang munting bata” o “isang binata.” Ang Hebreong pananalita ay mapagpakumbabang paglalarawan sa kanyang kabataan at kawalan ng karanasan.
    reason: lexical_alternative
  - marker: b
    text: Ang “lumabas at pumasok” ay idyomang Hebreo para sa pagsasagawa ng mga tungkulin, lalo na sa pampublikong pamumuno.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה אֱלֹהָי
  choice: Yahweh na aking Diyos
  rationale: Tuwirang pinananatili ang pangalang tipan na Yahweh at ang paari na “aking Diyos,” sa natural na anyong Tagalog ng panawagan.
- source_word: הִמְלַכְתָּ אֶת־עַבְדְּךָ
  choice: ginawa mo akong iyong lingkod na hari
  rationale: Ipinahahayag ang causative na diwa ng Hiphil ng מלך, habang pinananatili ang mapagpakumbabang pagtukoy ni Solomon sa sarili bilang lingkod ng Diyos.
- source_word: תַּחַת דָּוִד אָבִי
  choice: kapalit ni David na aking ama
  rationale: Ang תַּחַת ay tumutukoy rito sa paghalili sa paghahari; malinaw itong naihahatid ng “kapalit.”
- source_word: נַעַר קָטֹן
  choice: isang musmos na kabataan
  rationale: Pinananatili ang kabataan at kawalan ng karanasan sa mapagpakumbabang paglalarawan sa sarili, nang hindi nagtatakda ng tiyak na edad.
- source_word: לֹא אֵדַע צֵאת וָבֹא
  choice: hindi ko alam kung paano lumabas at pumasok
  rationale: Pinananatili sa pangunahing teksto ang konkretong idyomang Hebreo at ipinaliliwanag sa talababa ang diwa nitong pagtupad sa mga tungkulin, lalo na sa pamumuno.
theological_decisions:
- issue: Pagbanggit sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Dahil tahasang nasa tekstong Hebreo ang Tetragrammaton, pinananatili ang pangalang Yahweh sa halip na palitan ito ng titulo.
- issue: Pag-unawa sa נַעַר קָטֹן
  choice: isang musmos na kabataan
  alternative: isang munting bata; napakabata ko pa
  rationale: Pinananatili ang tunay na lawak ng kahulugan ng נַעַר at ang mapagpakumbabang diin ng קָטֹן, nang hindi ipinapalagay na literal na munting bata si Solomon.
- issue: Pag-unawa sa “lumabas at pumasok”
  choice: Panatilihin ang idyoma sa pangunahing teksto
  alternative: hindi ko alam kung paano mamuno
  rationale: Hindi tahasang ginagamit ng Hebreo ang pandiwang “mamuno.” Ang literal na larawan ay pinananatili, habang inilalagay sa talababa ang malamang na kahulugan nito sa konteksto ng pampublikong pamumuno.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang pangalang Yahweh at ang idyomang Hebreo, ngunit gumamit ng natural na ayos ng pangungusap. Ang “musmos na kabataan” ay sadyang nagpapanatili sa kabataan at kawalan ng karanasan nang hindi nagpapasya sa eksaktong edad ni Solomon.
