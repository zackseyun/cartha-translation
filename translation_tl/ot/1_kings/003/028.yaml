base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/028.yaml
  text: And all Israel heard of the judgment that the king had rendered[a], and they feared the king[b], because they saw that the wisdom of God was within him to administer justice.
translation:
  language: tl
  text: Nang mabalitaan ng buong Israel ang hatol na iginawad ng hari, natakot sila sa hari[a], sapagkat nakita nilang nasa kanya ang karunungan ng Diyos upang magpatupad ng katarungan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “namangha sila at nagpitagan sa hari.” Ang salitang Hebreo ay maaaring tumukoy sa takot, pagpipitagan, o pagkamangha sa kinikilalang awtoridad.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “upang gumawa ng katarungan” o “upang maggawad ng hatol.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמְעוּ
  choice: Nang mabalitaan
  rationale: Bagaman pangunahing nangangahulugang “narinig,” natural na ipinahihiwatig dito ang pagkarinig ng balita tungkol sa hatol.
- source_word: כָל יִשְׂרָאֵל
  choice: buong Israel
  rationale: Pinananatili ang kolektibong pagtukoy sa sambayanan bilang isang kabuuan sa natural na Tagalog.
- source_word: הַמִּשְׁפָּט אֲשֶׁר שָׁפַט הַמֶּלֶךְ
  choice: ang hatol na iginawad ng hari
  rationale: Ipinahahayag ang legal na pasya ng hari nang hindi ginagamit ang alanganing pag-uulit na “hatol na inihatol.”
- source_word: וַיִּרְאוּ מִפְּנֵי הַמֶּלֶךְ
  choice: natakot sila sa hari
  rationale: Tuwirang pinananatili ang pangunahing diwa ng ירא, habang inilalagay sa talababa ang posibleng saklaw na paggalang at paghanga.
- source_word: חָכְמַת אֱלֹהִים
  choice: ang karunungan ng Diyos
  rationale: Pinananatili ang tahasang pagtukoy sa Diyos at ang ugnayang ipinahahayag ng pariralang Hebreo.
- source_word: בְּקִרְבּוֹ
  choice: nasa kanya
  rationale: Natural na Tagalog para sa karunungang nasa loob o taglay ng hari, nang hindi labis na pinipilit ang metaporang lokatibo.
- source_word: לַעֲשׂוֹת מִשְׁפָּט
  choice: upang magpatupad ng katarungan
  rationale: Natural na paglalarawan sa gawaing panghukuman ng hari; pinananatili sa talababa ang mas literal at mas tiyak na mga alternatibo.
theological_decisions:
- issue: Ang pagtukoy ng אֱלֹהִים sa pinagmulan o katangian ng karunungan
  choice: karunungan ng Diyos
  alternative: banal na karunungan
  rationale: Tahasan ang אֱלֹהִים sa Hebreo, kaya hindi ito ginawang impersonal na pang-uri.
- issue: Ang saklaw ng takot sa וַיִּרְאוּ מִפְּנֵי הַמֶּלֶךְ
  choice: natakot sila sa hari
  alternative: namangha sila at nagpitagan sa hari
  rationale: Pinananatili ng pangunahing teksto ang literal na lakas ng ירא, ngunit kinikilala sa talababa na maaari rin itong magpahiwatig ng pagpipitagan o paghanga sa awtoridad ng hari.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “buong Israel” bilang karaniwang kolektibong katawagan at iniwasan ang sobrang teknikal o makalumang pananalita.
