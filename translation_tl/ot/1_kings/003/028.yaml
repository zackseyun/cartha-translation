  source_fidelity: 'Tumpak ang salin sa Hebreo: naibalita sa buong Israel ang hatol ng hari; natakot sila sa hari; at nakita nilang taglay niya ang karunungan ng Diyos para sa pagganap ng katarungan. Ang “natakot sila sa hari” ay tuwirang katumbas ng וַיִּרְאוּ מִפְּנֵי הַמֶּלֶךְ, habang ang talababa ay angkop na kumikilala sa saklaw na pagpipitagan/paghanga.'
  naturalness: Natural at malinaw ang modernong Filipino. Ang “Nang mabalitaan ng buong Israel” ay idiomatiko para sa pagkarinig ng balita hinggil sa isang hatol, at ang legal na rehistro ng “iginawad,” “hatol,” at “magpatupad ng katarungan” ay magkakatugma.
  terminology: 'Wasto at pare-pareho ang mahahalagang termino: “Diyos” para sa אֱלֹהִים, “karunungan” para sa חָכְמָה, at “katarungan” para sa מִשְׁפָּט sa pangwakas na parirala. Maayos ang mga talababa at tama ang mga anchor: [a] para sa “natakot sila sa hari” at [b] para sa “upang magpatupad ng katarungan.”'
