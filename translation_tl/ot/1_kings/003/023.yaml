base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/023.yaml
  text: Then the king said[a], “This one says, ‘This is my son, the living one, and your son is the dead one,’ and this one says, ‘No, for your son is the dead one, and my son is the living one.’”
translation:
  language: tl
  text: Pagkatapos ay sinabi ng hari[a], “Sinasabi ng babaeng ito, ‘Ito ang anak kong lalaki, ang buhay, at ang anak mong lalaki ang patay,’ at sinasabi ng babaeng ito, ‘Hindi! Ang anak mong lalaki ang patay, at ang anak kong lalaki ang buhay.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal na “ang isang ito ... at ang isang ito.” Pambabae ang mga demonstratibo sa Hebreo at tumutukoy sa dalawang babae.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Pagkatapos ay sinabi
  rationale: Isinusulong ng waw-consecutive ang pagkakasunod-sunod ng salaysay; natural sa modernong Tagalog ang “Pagkatapos ay sinabi.”
- source_word: הַמֶּלֶךְ
  choice: ang hari
  rationale: Tuwirang salin ng tiyak na pangngalan; pinananatili ang titulong ginamit sa Hebreo.
- source_word: זֹאת ... וְזֹאת
  choice: isang ito ... isang ito
  rationale: Ang pambabaeng mga demonstratibo ay tumutukoy sa dalawang babaeng naroon. Pinananatili ng salin ang deiktiko at magkatunggaling presentasyon nang hindi tahasang idinaragdag ang “babae” sa pangunahing teksto.
- source_word: אֹמֶרֶת
  choice: Sinasabi
  rationale: Ang participle ay gumaganap bilang masiglang kasalukuyan sa pagbubuod ng hari sa kani-kanilang pahayag.
- source_word: זֶה בְּנִי הַחַי
  choice: Ito ang anak kong lalaki, ang buháy
  rationale: 'Pinananatili ang demonstratibong pagkakakilanlan at ang appositional na ayos ng Hebreo: “ito—ang anak ko—ang buháy.”'
- source_word: בְּנִי / בְּנֵךְ
  choice: anak kong lalaki / anak mong lalaki
  rationale: Ang בֵּן ay “anak na lalaki”; malinaw at likas ito sa konteksto ng sanggol, at mas eksakto kaysa sa walang-kasariang “anak.”
- source_word: הַחַי
  choice: ang buháy
  rationale: Ginagamit nang substantibo ang may-artikulong salita at tuwirang itinatapat sa “ang patay.” Nilagyan ng tuldik ang “buháy” upang luminaw ang bigkas.
- source_word: הַמֵּת
  choice: ang patay
  rationale: Pinananatili ang substantibong anyo at ang tuwirang pagsalungat sa “ang buháy.”
- source_word: לֹא כִי
  choice: Hindi!
  rationale: Sa kontekstong ito, malinaw na pagtutol at pagtatama ang parirala. Mas natural sa Tagalog ang mariing “Hindi!”; ang kasunod na sugnay mismo ang naghahayag ng salungat na pag-aangkin.
