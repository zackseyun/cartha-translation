translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang pormal na pag-uulit at simetrikong pagtutunggali ng dalawang pahayag. Ginamit ang “isang ito” upang maipahiwatig ang Hebreong זֹאת ... וְזֹאת, bagaman mas idyomatiko ang alternatibong nasa talababa.
