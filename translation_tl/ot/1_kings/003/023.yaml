  to: Pagkatapos ay sinabi ng hari[a], “Sinasabi ng babaeng ito, ‘Ito ang anak kong lalaki, ang buhay, at ang anak mong lalaki ang patay,’ at sinasabi ng babaeng ito, ‘Hindi! Ang anak mong lalaki ang patay, at ang anak kong lalaki ang buhay.’”
