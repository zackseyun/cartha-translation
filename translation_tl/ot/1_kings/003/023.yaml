  terminology: Ang “hari,” “anak kong/ mong lalaki,” “buhay,” at “patay” ay angkop. Hindi kailangan ang tuldik sa “buhay” sa karaniwang modernong ortograpiya; malinaw ang kahulugan sa konteksto.
