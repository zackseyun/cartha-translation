base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/011.yaml
  text: And God said to him, “Because you have asked for this thing, and have not asked for yourself many days, nor have asked for yourself riches, nor have asked for the life of your enemies, but have asked for yourself understanding to hear justice,”
translation:
  language: tl
  text: At sinabi ng Diyos sa kanya, “Dahil ito ang hiniling mo, at hindi ka humiling para sa iyong sarili ng mahabang buhay, ni humiling para sa iyong sarili ng kayamanan, ni humiling ng buhay ng iyong mga kaaway, kundi humiling ka para sa iyong sarili ng pagkaunawang makapaghatol nang makatarungan,”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יָמִים רַבִּים
  choice: mahabang buhay
  rationale: Literal na ‘maraming araw,’ ngunit sa konteksto ay likas na tumutukoy sa mahabang buhay.
- source_word: נֶפֶשׁ אֹיְבֶיךָ
  choice: buhay ng iyong mga kaaway
  rationale: Ang נֶפֶשׁ dito ay tumutukoy sa buhay ng mga kaaway, hindi lamang sa abstraktong ‘kaluluwa.’
- source_word: הָבִין
  choice: pang-unawa
  rationale: Inilalarawan ng infinitive ang kakayahang umunawa na hiniling ni Solomon.
- source_word: לִשְׁמֹעַ
  choice: makinig
  rationale: Pinananatili ang konkretong pandiwang Hebreo na ‘makinig/dinggin,’ nang hindi tahasang pinapalitan ng ‘humatol.’
- source_word: מִשְׁפָּט
  choice: katarungan
  rationale: Sa konteksto ng pamamahala at paghatol, saklaw nito ang makatarungang pasiya at pagsasagawa ng katarungan.
theological_decisions:
- issue: Kahulugan ng ‘makinig sa katarungan’
  choice: Pinanatili ang ‘pang-unawang makinig sa katarungan.’
  alternative: ‘pang-unawang humatol nang makatarungan’
  rationale: Ang alternatibo ay mas idiomatiko ngunit nilulutas nito ang siksik at bahagyang malabong ugnayan ng לִשְׁמֹעַ מִשְׁפָּט. Pinananatili ng salin ang pandiwang ‘makinig’ at ang legal-etikal na ‘katarungan.’
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Pinanatili ang paulit-ulit na estruktura ng Hebreo upang maipakita ang diin, habang ginawang likas ang ‘maraming araw’ bilang ‘mahabang buhay.’
