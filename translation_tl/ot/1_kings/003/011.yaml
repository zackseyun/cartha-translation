    issue: Hindi malinaw ang “pang-unawang makinig sa katarungan.”
    rationale: Bagaman sinusubukan nitong panatilihin ang literal na “makinig/dinggin,” hindi nito naipahahayag nang natural sa Tagalog ang legal na diwa ng לִשְׁמֹעַ מִשְׁפָּט. Sa konteksto ng kahilingan ni Solomon para sa karunungang mamahala at humatol, ang parirala ay tumutukoy sa pagkaunawang kailangan upang makapaghatol nang makatarungan.
