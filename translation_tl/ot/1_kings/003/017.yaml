  text: Sinabi ng isang babae, “Pakiusap, panginoon ko, kami ng babaeng ito ay nakatira sa iisang bahay, at nanganak ako habang nasa bahay siya.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּי אֲדֹנִי
  choice: Pakiusap, panginoon ko
  rationale: Ang בִּי ay magalang na panawagan upang humingi ng pahintulot na magsalita, at ang אֲדֹנִי ay karaniwang pantawag na may paggalang sa hari, hindi pangalan ng Diyos.
- source_word: יֹשְׁבֹת
  choice: ay nakatira
  rationale: Ang anyong participle ay naglalarawan sa kanilang paninirahan sa iisang bahay; natural sa modernong Tagalog ang “nakatira.”
- source_word: וָאֵלֵד עִמָּהּ בַּבָּיִת
  choice: at nanganak ako habang kasama ko siya sa bahay
  rationale: Pinananatili ang diwa na naroon ang isa pang babae sa bahay nang manganak ang nagsasalita, nang hindi dinaragdagan ang detalye.
