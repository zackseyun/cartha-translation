translation_notes:
  register: Makabagong Filipino na magalang at angkop sa paglilitis sa harap ng hari. Ginamit ang maliit na titik sa “panginoon” sapagkat ang tinutukoy ay ang hari. Pinanatili ang kasalukuyang/aspektong di-ganap sa “nakatira,” kasunod ng Hebreong participle at ng konteksto.
