  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/גַ֨ם אֲשֶׁ֤ר לֹֽא שָׁאַ֨לְתָּ֙ נָתַ֣תִּי לָ֔/ךְ גַּם עֹ֖שֶׁר גַּם כָּב֑וֹד אֲ֠שֶׁר לֹא הָיָ֨ה כָמ֥וֹ/ךָ אִ֛ישׁ בַּ/מְּלָכִ֖ים כָּל יָמֶֽי/ךָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/013.yaml
  text: And I have also given you what you did not ask for[a], both riches and honor, so that there has been no man like you among the kings all your days.
translation:
  language: tl
  text: Ibinigay ko rin sa iyo ang hindi mo hiningi—kapwa kayamanan at karangalan—kaya sa buong buhay mo ay walang lalaking magiging tulad mo sa mga hari.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “kaya wala pang naging lalaking tulad mo sa mga hari sa buong buhay mo.”
    reason: Pinananatili ng alternatibo ang mas literal na aspektong perpekto ng לֹא הָיָה, samantalang ipinahahayag ng pangunahing teksto ang panghinaharap na puwersa ng pangako sa konteksto.
lexical_decisions:
- source_word: וְגַם
  choice: rin
  rationale: Ipinagpapatuloy nito ang sinabi ng Diyos at idinaragdag ang mga kaloob na hindi hiningi ni Solomon. Likas sa Tagalog ang hulihang “rin” pagkatapos ng pandiwa.
- source_word: אֲשֶׁר לֹא שָׁאַלְתָּ
  choice: ang hindi mo hiningi
  rationale: Natural at tuwirang katumbas ito ng kaugnay na sugnay na tumutukoy sa mga bagay na hindi hiniling ni Solomon.
- source_word: נָתַתִּי לָךְ
  choice: Ibinigay ko sa iyo
  rationale: Pinananatili ng aspektong naganap ang anyong perpekto ng Hebreo, habang ang konteksto ng banal na pahayag ay nagpapakitang tiyak na ipinagkaloob na ang mga bagay na ito.
- source_word: גַּם עֹשֶׁר גַּם כָּבוֹד
  choice: kapwa kayamanan at karangalan
  rationale: Kinakatawan ng “kapwa … at …” ang inuulit na גַּם. Sa konteksto ng katayuang maharlika, mas angkop ang “karangalan” kaysa “kaluwalhatian” para sa כָּבוֹד.
- source_word: אֲשֶׁר לֹא הָיָה כָמוֹךָ אִישׁ
  choice: kaya … walang lalaking magiging tulad mo
  rationale: Binabasa ang אֲשֶׁר bilang nagpapahayag ng bunga. Ginamit ang “lalaki” upang mapanatili ang tahasang panlalaking אִישׁ, at ang “magiging” ay natural sa pangakong sumasaklaw sa nalalabing buhay ni Solomon.
- source_word: בַּמְּלָכִים
  choice: sa mga hari
  rationale: Ipinahahayag nito ang pangkat na pinaghahambingan kay Solomon.
- source_word: כָּל יָמֶיךָ
  choice: sa buong buhay mo
  rationale: Ito ang natural na modernong Tagalog para sa idyomang Hebreo na literal na “lahat ng iyong mga araw.”
theological_decisions:
- issue: Ang saklaw at kasarian ng אִישׁ sa paghahambing
  choice: walang lalaking magiging tulad mo sa mga hari
  alternative: walang sinumang magiging tulad mo sa mga hari; walang haring magiging tulad mo
  rationale: Tahasan sa Hebreo ang אִישׁ, “lalaki,” kaya hindi ito ginawang ganap na neutral. Hindi rin ito pinalitan ng “hari,” sapagkat ang “mga hari” ay nasa kasunod na pariralang nagsasaad ng pangkat na pinaghahambingan.
- issue: Ang panahon/aspekto ng לֹא הָיָה kasama ng כָּל יָמֶיךָ
  choice: walang … magiging … sa buong buhay mo
  alternative: wala pang naging … sa mga hari sa buong buhay mo
  rationale: Bagaman anyong perpekto ang הָיָה, ang pangakong ibinibigay sa simula ng paghahari ni Solomon at ang pariralang “sa buong buhay mo” ay natural na tumutukoy sa patuloy at panghinaharap na pagiging natatangi niya. Itinatala sa talababa ang mas mahigpit na pagbasa sa aspektong perpekto.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “kayamanan,” “karangalan,” at “sa buong buhay mo” bilang natural na pananalita; iniwasan ang lipas o labis na pormal na mga anyo.
