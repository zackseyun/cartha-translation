base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/026.yaml
  text: Then the woman whose son was alive said to the king[a], because her compassion was stirred for her son, and she said, "Please, my lord, give her the living child, and do not put him to death." But the other said, "It shall be neither mine nor yours[b]; cut him in two."
translation:
  language: tl
  text: At sinabi ng babaeng buháy ang anak sa hari, sapagkat nag-umapaw ang habag niya sa kaniyang anak[a], “Nakikiusap po ako, Panginoon ko! Ibigay ninyo sa kaniya ang batang buháy. Huwag na huwag ninyo siyang patayin[b].” Ngunit sinabi ng isa pang babae, “Hindi siya magiging akin ni magiging iyo. Hatiin ninyo siya!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, isang idyoma ito na literal na naglalarawan sa matinding habag na umiinit o kumikilos sa kaloob-looban ng isang tao.
    reason: cultural_note
  - marker: b
    text: 'Mariin ang anyo sa Hebreo: “Huwag na huwag ninyo siyang patayin.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: נִכְמְרוּ רַחֲמֶיהָ
  choice: nag-umapaw ang habag niya
  rationale: Likas sa makabagong Tagalog ang pariralang ito at naipahahayag nito ang matinding pagkabagabag at habag ng ina, nang hindi literal na isinasalin ang Hebreong idyoma tungkol sa pag-init o pagkilos ng kaloob-looban.
- source_word: בִּי אֲדֹנִי
  choice: Nakikiusap po ako, mahal na hari!
  rationale: Ang בִּי ay pakiusap na apela, at ang אֲדֹנִי ay magalang na pagtawag sa hari. Ipinahahayag ng “po” at ng padamdam ang paggalang at matinding pagmamadali nang hindi ipinagkakamaling banal na titulo ang tawag.
- source_word: הַיָּלוּד הַחַי
  choice: ang batang buháy
  rationale: Ang יָלוּד ay tumutukoy sa ipinanganak na bata. Ang “batang buháy” ay malinaw, natural, at hindi higit na nagtatakda ng eksaktong edad kaysa sa Hebreo.
- source_word: וְהָמֵת אַל תְּמִיתֻהוּ
  choice: Huwag na huwag ninyo siyang patayin.
  rationale: Ang pag-uulit na “huwag na huwag” ay natural na paraan sa Tagalog upang katawanin ang mariing pagbabawal na nililikha ng infinitive absolute at finite verb sa Hebreo.
- source_word: וְזֹאת אֹמֶרֶת
  choice: Ngunit sinabi ng isa pang babae
  rationale: Ginagawang malinaw ng “isa pang babae” ang contrastive na demonstrative na tumutukoy sa kabilang babae; ang “ngunit” ay angkop sa tahasang pagsalungat ng kaniyang tugon.
- source_word: גַּם לִי גַם לָךְ לֹא יִהְיֶה
  choice: Hindi siya magiging akin ni magiging iyo.
  rationale: Pinananatili nito ang sanggol bilang ipinahihiwatig na simuno at ang timbang na pagkakahanay ng dalawang nag-aagawang pag-aangkin.
- source_word: גְּזֹרוּ
  choice: Hatiin ninyo siya!
  rationale: Ang maikli at biglang pautos ay nagpapanatili sa marahas na puwersa ng Hebreo. Malinaw mula sa naunang utos ng hari na ang ibig sabihin ay hatiin sa dalawa ang bata.
theological_decisions: []
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “ninyo” at “po” bilang likas na magalang na pananalita sa hari, habang pinanatili ang bigla at malupit na tono ng huling utos. Inilagay ang mga talababa sa mismong mga pariralang ipinaliliwanag ng mga ito.
