revisions:
- from: At sinabi sa hari ng babaeng ang anak ay buháy—sapagkat nag-umapaw ang habag niya sa kaniyang anak[a]—“Nakikiusap po ako, mahal na hari! Ibigay ninyo sa kaniya ang batang buháy. Huwag na huwag ninyo siyang patayin.[b]” Ngunit sinabi ng isa pang babae, “Hindi siya magiging akin ni magiging iyo. Hatiin ninyo siya!”
  to: At sinabi ng babaeng buháy ang anak sa hari, sapagkat nag-umapaw ang habag niya sa kaniyang anak[a], “Nakikiusap po ako, Panginoon ko! Ibigay ninyo sa kaniya ang batang buháy. Huwag na huwag ninyo siyang patayin[b].” Ngunit sinabi ng isa pang babae, “Hindi siya magiging akin ni magiging iyo. Hatiin ninyo siya!”
