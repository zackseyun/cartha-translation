language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: עַל חטאת/ו אֲשֶׁ֣ר חָטָ֔א לַ/עֲשׂ֥וֹת הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה לָ/לֶ֨כֶת֙ בְּ/דֶ֣רֶךְ יָרָבְעָ֔ם וּ/בְ/חַטָּאת/וֹ֙ אֲשֶׁ֣ר עָשָׂ֔ה לְ/הַחֲטִ֖יא אֶת יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/019.yaml
  text: because of his sins that he committed[a], doing what was evil in the eyes of Yahweh, walking in the way of Jeroboam and in the sin that he caused Israel to commit.
translation:
  language: tl
  text: dahil sa mga kasalanang ginawa niya—sa paggawa ng masama sa paningin ni Yahweh, sa paglakad sa landas ni Jeroboam, at sa kasalanang ginawa niya na naging dahilan upang magkasala ang Israel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo, mas literal: “at sa kasalanan niyang ginawa upang magkasala ang Israel.” Ang pandiwang “magkasala” ay nasa anyong causative sa Hebreo: siya ang nagdulot na magkasala ang Israel.'
    reason: Ipinakikita ang literal na ayos at nililinaw ang tahasang causative na anyo ng Hebreo nang hindi gumagamit ng di-natural na salitang Filipino.
lexical_decisions:
- source_word: עַל חטאתו אֲשֶׁר חָטָא
  choice: dahil sa mga kasalanang ginawa niya
  rationale: Ang עַל ay nagsasaad ng dahilan ng naunang hatol. Bagaman pang-isahan ang חטאתו, maaari itong tumukoy sa kabuuan ng kaniyang makasalanang mga gawa; natural sa Tagalog ang maramihang “mga kasalanan” sa kontekstong ito.
- source_word: לַעֲשׂוֹת הָרַע בְּעֵינֵי יְהוָה
  choice: sa paggawa ng masama sa paningin ni Yahweh
  rationale: Pinananatili ang Hebreong metapora ng pagsusuri “sa paningin” at ang personal na pangalang Yahweh.
- source_word: לָלֶכֶת בְּדֶרֶךְ יָרָבְעָם
  choice: sa paglakad sa landas ni Jeroboam
  rationale: Pinananatili ang metapora ng paglakad bilang paraan o huwaran ng pamumuhay, na malinaw rin sa modernong Tagalog.
- source_word: וּבְחַטָּאתוֹ אֲשֶׁר עָשָׂה לְהַחֲטִיא אֶת־יִשְׂרָאֵל
  choice: at sa kasalanang ginawa niya na naging dahilan upang magkasala ang Israel
  rationale: Ipinahahayag nang natural ang causative na Hiphil ng חטא habang pinananatiling si Israel ang pinapangyaring magkasala. Hindi nito labis na tinutukoy kung anong tiyak na paraan ang ginamit niya.
theological_decisions:
- issue: Paglalapat ng pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Personal na pangalan ang nasa tekstong Hebreo; ang “Yahweh” ay tuwirang transliterasyon at hindi pagpapalit nito ng isang titulo.
- issue: Ugnayan ng kasalanan ng hari at pagkakasala ng Israel
  choice: naging dahilan upang magkasala ang Israel
  alternative: ipinagawa niya sa Israel ang kasalanan
  rationale: Pinananatili nito ang causative na diwa ng לְהַחֲטִיא nang hindi nagdaragdag ng partikular na doktrinal na paliwanag tungkol sa antas o paraan ng kaniyang pananagutan.
translation_notes:
  register: Makabago at marangal na Filipino. Pinanatili ang mga biblikal na metaporang “sa paningin” at “paglakad sa landas,” sapagkat malinaw pa rin ang mga ito sa ordinaryong mambabasa. Ginamit ang gitling na mahaba upang ipakitang ang sumusunod na mga parirala ay nagpapaliwanag sa mga kasalanang binanggit.
