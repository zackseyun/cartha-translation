source:
  edition: WLC
  text: אָ֧ז יֵחָלֵ֛ק הָ/עָ֥ם יִשְׂרָאֵ֖ל לַ/חֵ֑צִי חֲצִ֨י הָ/עָ֜ם הָ֠יָה אַחֲרֵ֨י תִבְנִ֤י בֶן גִּינַת֙ לְ/הַמְלִיכ֔/וֹ וְ/הַ/חֲצִ֖י אַחֲרֵ֥י עָמְרִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/021.yaml
  text: 'Then the people of Israel were divided into two parts: half of the people followed Tibni son of Ginath[a], to make him king, and half followed Omri.'
translation:
  language: tl
  text: 'Pagkatapos, nahati sa dalawa ang bayang Israel: kalahati ng bayan ay pumanig kay Tibni na anak ni Ginat upang gawin siyang hari, at ang kalahati naman ay pumanig kay Omri.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יֵחָלֵק
  choice: nahati
  rationale: Ang Nifal na anyo ng חלק ay nagpapahayag na ang bayan ay nahati o nagkabaha-bahagi; natural at tuwiran sa Filipino ang “nahati.”
- source_word: הָעָם יִשְׂרָאֵל
  choice: ang bayang Israel
  rationale: Ang parirala ay tumutukoy sa sambayanan ng Israel. Ang “bayang Israel” ay natural, marangal, at hindi nagpapahiwatig na lupain lamang ang tinutukoy.
- source_word: לַחֵצִי
  choice: sa dalawa
  rationale: Kasama ng “nahati,” malinaw nitong ipinahahayag ang paghahati sa dalawang panig; iniiwasan nito ang mas di-natural na literal na “sa kalahati.”
- source_word: חֲצִי הָעָם
  choice: kalahati ng bayan
  rationale: Pinananatili nito ang timbang at pag-uulit ng dalawang magkatapat na pangkat sa Hebreo.
- source_word: הָיָה אַחֲרֵי
  choice: pumanig kay
  rationale: Sa kontekstong pampolitika, ang idyomang “nasa likod/kasunod ni” ay nagsasaad ng pagsuporta sa isang naghahari-harian. Mas tiyak sa modernong Filipino ang “pumanig kay” kaysa “sumunod kay.”
- source_word: תִבְנִי בֶן גִּינַת
  choice: Tibni na anak ni Ginat
  rationale: Isinalin ang ugnayang ben bilang “anak ni” at tinumbasan sa karaniwang baybay-Filipino ang mga pangalang Hebreo.
- source_word: לְהַמְלִיכוֹ
  choice: upang gawin siyang hari
  rationale: Ang Hifil infinitive ng מלך ay nangangahulugang maging sanhi upang maghari ang isang tao. Hindi dinaragdagan ng seremonya ng pagpuputong na wala sa teksto.
- source_word: וְהַחֲצִי אַחֲרֵי עָמְרִי
  choice: at ang kalahati naman ay pumanig kay Omri
  rationale: Ipinahihiwatig ng ikalawang sugnay ang pandiwa mula sa naunang sugnay. Ang “naman” ay natural na naghahayag ng pagtutulad at pagsalungat ng dalawang panig.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “pumanig” upang ihayag ang pampolitikang katapatan, at pinanatili ang simetrikong pagkakahati ng bayan nang hindi nagdaragdag ng teolohikal o denominasyonal na paliwanag.
