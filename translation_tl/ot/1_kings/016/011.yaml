source:
  edition: WLC
  text: וַ/יְהִ֨י בְ/מָלְכ֜/וֹ כְּ/שִׁבְתּ֣/וֹ עַל כִּסְא֗/וֹ הִכָּה֙ אֶת כָּל בֵּ֣ית בַּעְשָׁ֔א לֹֽא הִשְׁאִ֥יר ל֖/וֹ מַשְׁתִּ֣ין בְּ/קִ֑יר וְ/גֹאֲלָ֖י/ו וְ/רֵעֵֽ/הוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/011.yaml
  text: And it happened that when he became king[a], as soon as he sat on his throne, he struck down all the house of Baasha. He did not leave him a single male[b], or any of his kinsmen or his friends.
translation:
  language: tl
  text: Nang maluklok siya bilang hari, pagkaluklok niya sa kanyang trono, pinatay niya ang buong angkan ni Baasa. Wala siyang iniwang buhay para kay Baasa—kahit isang lalaki[a], ni isa man sa kanyang mga kamag-anak[b] o mga kaibigan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “umiihi sa pader,” isang magaspang na idyoma para sa lalaki.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “mga tagapaghiganti niya” o “mga manunubos niya.” Ang salitang Hebreo ay tumutukoy sa mga kamag-anak na may mga pananagutan sa angkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Nang
  rationale: Sa tuloy-tuloy na salaysay ng Hebreo, nagsisilbi itong panandang nag-uugnay sa kasunod na pangyayari. Ang likas na sugnay na “Nang” ay malinaw sa modernong Tagalog nang hindi gumagamit ng makalumang “At nangyari.”
- source_word: בְמָלְכוֹ
  choice: maghari siya
  rationale: Ipinapahiwatig ng ב na temporal ang parirala. Sa konteksto, tumutukoy ito sa pagsisimula ng kanyang paghahari.
- source_word: כְשִׁבְתּוֹ עַל־כִּסְאוֹ
  choice: pagkaluklok na pagkaluklok niya sa kanyang trono
  rationale: Natural na idyomang Tagalog ito para sa agarang pagkakasunod ng pangyayari at pinananatili ang larawan ng pag-upo o pagluklok sa trono.
- source_word: הִכָּה
  choice: pinatay
  rationale: Bagaman pangunahing nangangahulugang humampas o manakit ang נכה, malinaw na nakamamatay ang kilos sa kontekstong ito. Direktang ipinahahayag ng “pinatay” ang diwa nang hindi gumagamit ng di-likas na literalismo.
- source_word: אֶת כָּל בֵּית בַּעְשָׁא
  choice: ang buong angkan ni Baasa
  rationale: Ang “bahay” dito ay tumutukoy sa sambahayan o dinastikong angkan, hindi sa gusali. Pinakamalinaw sa ordinaryong mambabasa ang “angkan.”
- source_word: לֹא הִשְׁאִיר לוֹ
  choice: Wala siyang itinirang ... para kay Baasa
  rationale: Pinananatili nito ang datibong panghalip ng Hebreo at nililinaw na walang naiwang buhay upang magpatuloy ang linya ni Baasa.
- source_word: מַשְׁתִּין בְּקִיר
  choice: kahit isang lalaki
  rationale: Magaspang na idyomang Hebreo ito na literal na tumutukoy sa umiihi sa pader. Ang “kahit isang lalaki” ay malinaw at natural, habang inilalagay sa talababa ang mahalagang literal na anyo.
- source_word: וְגֹאֲלָיו
  choice: mga kamag-anak
  rationale: Ang גֹּאֵל ay kaanak na may mga pananagutang pampamilya, kabilang ang pagtubos o paghihiganti. Hindi ipinipilit ng konteksto ang iisang tungkulin, kaya pinananatili sa talababa ang mga posibleng diwa.
- source_word: וְרֵעֵהוּ
  choice: mga kaibigan nito
  rationale: Maaaring mangahulugan ang רֵעַ na kaibigan, kasama, o kasamahan. Ang “mga kaibigan” ang pinakapayak at natural dito, at nauunawaan ang anyong isahan bilang kolektibo sa konteksto.
theological_decisions:
- issue: Saklaw ng גֹאֲלָיו
  choice: mga kamag-anak
  alternative: mga tagapaghiganti / mga manunubos
  rationale: Hindi tiyak sa talata kung aling partikular na pananagutang pampamilya ng go’el ang nangingibabaw. Iniiwasan ng pangunahing teksto ang paglutas sa tunay na leksikal na kalabuan, at itinatala sa talababa ang mga alternatibo.
translation_notes:
  register: Modernong Filipino Tagalog na dignified ngunit madaling maunawaan. Ginamit ang “pagkaluklok na pagkaluklok” upang natural na ihatid ang agarang pagkilos, “angkan” para sa dinastikong בית, at malinaw na mga panghalip upang mabawasan ang kalituhan nang hindi binabago ang diwa.
