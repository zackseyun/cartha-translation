  naturalness: Ang “Ang iba pang mga ginawa ni Baasa, ang kanyang mga ginawa” ay mabigat at tautolohikal sa makabagong Filipino. Ang “iba pang mga pangyayari tungkol kay Baasa” ay natural na katumbas ng pormulang pang-annal na “the rest of the acts/matters of Baasha,” habang hiwalay na pinananatili ang “ang kanyang ginawa.”
  terminology: Ang “Kronika” ay angkop na tuwirang katawagan para sa דִּבְרֵי הַיָּמִים sa pamagat ng annalistikong aklat. Nililinaw ng talababa ang alternatibong “mga talaang pangkasaysayan” nang hindi ipinagpapalagay na ito ang kanonikal na aklat ng Mga Kronika.
