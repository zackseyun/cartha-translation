  text: The rest of the acts of Baasha[a], and what he did, and his might—are they not written in the Book of the Chronicles of the Kings of Israel?
translation:
  language: tl
  text: Ang iba pang mga pangyayari tungkol kay Baasa, ang kanyang ginawa, at ang kanyang kapangyarihan—hindi ba nakasulat ang mga iyon sa Aklat ng mga Kronika ng mga Hari ng Israel?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Aklat ng mga Talaang Pangkasaysayan ng mga Hari ng Israel.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי בַעְשָׁא
  choice: Ang iba pang mga ginawa ni Baasa
  rationale: Sa pormulang panghari, ang דִּבְרֵי ay tumutukoy sa mga gawa o pangyayari tungkol sa hari, hindi lamang sa kanyang mga salita. Pinananatili ng “iba pang” ang diwa ng יֶתֶר nang hindi nagdaragdag ng temporal na panandang wala sa Hebreo.
- source_word: וַאֲשֶׁר עָשָׂה
  choice: ang kanyang mga ginawa
  rationale: Tuwirang isinasalin ang sugnay na “kung ano ang ginawa niya” sa natural na Tagalog at hindi idinaragdag ang “lahat,” na hindi tahasang nasa Hebreo.
- source_word: וּגְבוּרָתוֹ
  choice: at ang kanyang kapangyarihan
  rationale: Pinananatili ang abstraktong kahulugan ng גְּבוּרָה bilang lakas o kapangyarihan, sa halip na tukuyin ito nang mas interpretatibo bilang “mga dakilang gawa.”
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: hindi ba nakasulat ang mga iyon
  rationale: Pinananatili ang pormulang retorikal na tanong sa Mga Hari at ang literal na konsepto ng pagkakasulat.
- source_word: עַל סֵפֶר
  choice: sa Aklat
  rationale: Sa idyomang ito, ang עַל ay tumutukoy sa pagkakatala sa isang dokumento; natural sa Tagalog ang “sa Aklat.”
- source_word: סֵפֶר דִּבְרֵי הַיָּמִים
  choice: Aklat ng mga Kasaysayan
  rationale: Ipinahihiwatig ng parirala ang isang talaang historikal o mga annal; malinaw sa karaniwang mambabasa ang “mga Kasaysayan,” habang inilalahad sa talababa ang mas teknikal na alternatibo.
- source_word: לְמַלְכֵי יִשְׂרָאֵל
  choice: ng mga Hari ng Israel
  rationale: 'Ang לְ ay nagpapakita rito ng kaugnayan: ang talaang nauukol sa mga hari ng Israel.'
