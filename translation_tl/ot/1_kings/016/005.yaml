    issue: Hindi sapat ang “mga Kasaysayan” bilang pamagat ng annalistikong talaan.
    rationale: Ang “Kasaysayan” ay maaaring tumukoy sa history sa pangkalahatan. Ang “mga Kronika,” na nililinawan ng talababa bilang mga talaang pangkasaysayan, ay mas tiyak sa idyomang Hebreo.
  - severity: low
