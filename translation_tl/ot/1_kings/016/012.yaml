id: 1KI.16.12
reference: 1 Kings 16:12
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יַּשְׁמֵ֣ד זִמְרִ֔י אֵ֖ת כָּל בֵּ֣ית בַּעְשָׁ֑א כִּ/דְבַ֤ר יְהוָה֙ אֲשֶׁ֣ר דִּבֶּ֣ר אֶל בַּעְשָׁ֔א בְּ/יַ֖ד יֵה֥וּא הַ/נָּבִֽיא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/012.yaml
  text: So Zimri destroyed all the house of Baasha[b][a], according to the word of Yahweh that he had spoken against Baasha through Jehu the prophet.
translation:
  language: tl
  text: Kaya nilipol ni Zimri ang buong sambahayan ni Baasa[b], ayon sa salita ni Yahweh na sinabi niya laban kay Baasa[a] sa pamamagitan ni propetang Jehu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kay Baasa.” Literal na “kay” ang pang-ukol sa Hebreo, ngunit dito ay ipinakikilala nito ang isang pahayag ng hatol na nakatuon laban sa kaniya.
    reason: lexical_alternative
  - marker: b
    text: Ang “sambahayan ni Baasa” ay tumutukoy sa maharlikang angkan o dinastiya ni Baasa, hindi lamang sa mga taong nakatira sa kaniyang bahay.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּשְׁמֵד
  choice: nilipol
  rationale: Ang Hiphil ng שׁמד ay nagpapahayag ng lubusang pagwasak o pagpuksa. Ang “nilipol” ay malinaw at natural sa salaysay, at angkop sa pag-ubos sa dinastiya.
- source_word: כָּל בֵּית בַּעְשָׁא
  choice: ang buong sambahayan ni Baasa
  rationale: Sa konteksto ng paghahari, ang בַּיִת ay tumutukoy sa maharlikang sambahayan o dinastiya, hindi lamang sa gusali o mga kasambahay. Pinananatili ng “sambahayan” ang lawak ng kahulugan sa natural na Filipino.
- source_word: כִּדְבַר
  choice: ayon sa salita ni
  rationale: Ipinahihiwatig ng parirala ang pagtupad o pagkakatugma ng pangyayari sa naunang pahayag.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat ang banal na pangalang YHWH sa halip na palitan ito ng isang titulo.
- source_word: אֲשֶׁר דִּבֶּר
  choice: na sinabi niya
  rationale: Natural ito sa modernong Filipino; ipinakikita ng konteksto na nauna nang sinabi ang salita bago ito natupad.
- source_word: אֶל בַּעְשָׁא
  choice: laban kay Baasa
  rationale: Bagaman karaniwang nangangahulugang “kay” ang אֶל, ang pahayag dito ay hatol na nakatuon laban kay Baasa. Inilalagay sa talababa ang mas literal na alternatibo.
- source_word: בְּיַד יֵהוּא הַנָּבִיא
  choice: sa pamamagitan ni propetang Jehu
  rationale: Ang idyomang “sa kamay ni” ay nagsasaad ng tagapamagitan o kasangkapan; natural na ipinahahayag ito sa Filipino bilang “sa pamamagitan ni.”
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Pangalan mismo ang nasa tekstong Hebreo, kaya pinananatili itong pangalan at hindi pinapalitan ng titulong “Panginoon.”
- issue: Diwa ng אֶל sa pahayag kay Baasa
  choice: laban kay Baasa
  alternative: kay Baasa
  rationale: Hatol ang pahayag sa konteksto, kaya malinaw ang “laban kay”; gayunman, pinananatili sa talababa ang tunay na leksikal na posibilidad na “kay Baasa.”
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “sambahayan” upang maipahayag ang dinastikong diwa nang hindi maging labis na teknikal; ginamit ang “nilipol” para sa lubusang pagwasak na ipinahihiwatig ng pandiwang Hebreo.
