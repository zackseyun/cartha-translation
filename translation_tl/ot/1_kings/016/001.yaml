  text: וַ/יְהִ֤י דְבַר יְהוָה֙ אֶל יֵה֣וּא בֶן חֲנָ֔נִי עַל בַּעְשָׁ֖א לֵ/אמֹֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/001.yaml
  text: Then the word of Yahweh came to Jehu son of Hanani against Baasha[a], saying,
translation:
  language: tl
  text: 'Pagkatapos, dumating kay Jehu na anak ni Hanani ang salita ni Yahweh laban kay Baasa[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “tungkol kay Baasa.” Maaaring mas malawak ang kahulugan ng pang-ukol sa Hebreo, ngunit dito ay ipinakikilala nito ang isang pahayag ng paghatol, kaya ginamit ang “laban kay.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Pagkatapos, dumating
  rationale: Ipinakikita ng waw-consecutive ng היה ang kasunod na pangyayari sa salaysay. Natural sa modernong Filipino ang “Pagkatapos,” habang ang “dumating” ay angkop sa pormulang tumutukoy sa pagtanggap ng pahayag ng Diyos.
- source_word: דְבַר יְהוָה
  choice: ang salita ni Yahweh
  rationale: Pinananatili ng “salita” ang pormal at teolohikal na bigat ng karaniwang pormula ng propesiya, sa halip na ang mas mapagpaliwanag na “mensahe.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ng “Yahweh” ang banal na pangalang YHWH sa halip na palitan ito ng isang titulo.
- source_word: אֶל
  choice: kay
  rationale: Minamarkahan ng אֶל ang taong tumanggap ng salita; “kay” ang likas na katumbas sa Filipino para sa pangalan ng tao.
- source_word: יֵהוּא בֶן חֲנָנִי
  choice: Jehu na anak ni Hanani
  rationale: Malinaw at natural na Filipino ang “na anak ni Hanani” para sa Hebreong ugnayang pang-anak.
- source_word: עַל
  choice: laban kay
  rationale: Sa konteksto ng isang propetikong paghatol, ipinahihiwatig ng עַל na ang pahayag ay nakatuon laban kay Baasa, bagaman maaari rin itong mangahulugang “tungkol kay.”
- source_word: בַּעְשָׁא
  choice: Baasa
  rationale: Karaniwang anyong Filipino ng pangalang Baasha, na umaayon sa baybay at bigkas ng Filipino.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Ipinakikilala ng infinitive ang mismong sasabihin sa susunod na talata. Sa modernong Filipino, natural na ginagampanan ng tutuldok ang tungkuling ito at iniiwasan ang mabigat na “na sinasabi.”
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Ginagamit mismo ng tekstong Hebreo ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng titulong “PANGINOON.”
- issue: Diwa ng עַל sa pormula ng propesiya
  choice: laban kay Baasa
  alternative: tungkol kay Baasa
  rationale: Ang kasunod na pahayag ay isang hatol, kaya ang “laban kay” ang mas angkop sa konteksto. Gayunman, tunay na mas malawak ang saklaw ng pang-ukol, kaya inilalahad sa talababa ang alternatibo.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at angkop sa pampublikong pagbasa. Ginamit ang natural na ayos ng pangungusap at tutuldok upang ipakilala ang pahayag sa susunod na talata; pinanatili ang pormal na terminong “salita” at ang pangalang “Yahweh.”
