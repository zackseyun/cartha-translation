    issue: Mas maluwag ang “mga ninuno” kaysa sa “mga ama.”
    rationale: Ang אֲבֹתָיו ay literal na “kanyang mga ama” at bahagi ng nakapirming pormula sa mga salaysay ng mga hari. Maaaring unawain bilang mga ninuno, ngunit mas mabuting panatilihin ang pormula sa teksto at ipaliwanag ito sa talababa.
  - severity: low
    issue: Ang “bilang kapalit niya” ay medyo hindi tuwiran para sa תַּחְתָּיו.
    rationale: Ang parirala ay nangangahulugang paghalili “sa kanyang lugar.” Ang ganitong anyo ay natural din sa Tagalog at mas malapit sa pormula ng pinagmulan.
  revised_text: At natulog si Omri kasama ng kanyang mga ama[a], at inilibing siya sa Samaria. Ang anak niyang si Ahab ay naghari sa kanyang lugar.
