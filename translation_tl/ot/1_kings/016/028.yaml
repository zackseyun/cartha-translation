  text: And Omri slept with his fathers and was buried in Samaria[a], and Ahab his son reigned in his place.
translation:
  language: tl
  text: At natulog si Omri kasama ng kanyang mga ama[a], at inilibing siya sa Samaria. Ang anak niyang si Ahab ay naghari sa kanyang lugar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “natulog kasama ng kanyang mga ama,” isang karaniwang pahayag para sa pagkamatay sa mga salaysay tungkol sa mga hari.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב עָמְרִי עִם אֲבֹתָיו
  choice: natulog si Omri kasama ng kanyang mga ninuno
  rationale: Pinananatili ang pormulang Hebreo sa mga salaysay tungkol sa mga hari. Bagaman tumutukoy ito sa pagkamatay, hindi ito tahasang pinapalitan ng “namatay,” upang mapanatili ang paulit-ulit at dinastikong himig ng orihinal; nililinaw ito sa talababa.
- source_word: וַיִּקָּבֵר
  choice: inilibing siya
  rationale: Likas at malinaw na salin ng pandiwang Niphal na nasa anyong balintiyak; ang panghalip ay idinagdag para sa natural na daloy sa Tagalog.
- source_word: בְּשֹׁמְרוֹן
  choice: sa Samaria
  rationale: Ang בְּ ay tumutukoy sa lokasyon ng paglilibing, at “sa Samaria” ang karaniwang anyo sa Tagalog.
- source_word: וַיִּמְלֹךְ
  choice: ang naghari
  rationale: Tumpak at maikli para sa pormula ng paghalili sa trono, nang hindi labis na tinutukoy kung kailan nagsimula ang paghahari.
- source_word: אַחְאָב בְּנוֹ
  choice: ang anak niyang si Ahab
  rationale: Natural na ayos sa modernong Tagalog habang malinaw na pinananatili ang ugnayan ni Ahab kay Omri.
- source_word: תַּחְתָּיו
  choice: bilang kapalit niya
  rationale: Ipinahahayag ang paghalili ni Ahab sa posisyon ni Omri; mas natural ito sa Tagalog kaysa sa literal na “sa kanyang lugar.”
