  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “nagsabwatan” para sa politikal na pagtataksil, “karwahe” para sa kagamitang pandigma, at “sambahayan” upang mapanatili ang idyomang administratibo nang hindi ito nililimitahan sa gusali ng palasyo.
