base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/009.yaml
  text: But his servant Zimri[a], commander of half the chariots, conspired against him while he was in Tirzah, drinking himself drunk in the house of Arza[b], who was over the household in Tirzah.
translation:
  language: tl
  text: Ngunit nagsabwatan laban sa kanya ang lingkod niyang si Zimri, na pinuno ng kalahati ng mga karwahe. Samantala, nasa Tirza si Ela at umiinom hanggang malasing[a] sa bahay ni Arza, na namamahala sa sambahayan[b] sa Tirza.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “umiinom hanggang sa malasing.” Masigla ang pananalita sa Hebreo at inilalarawan ang patuloy na pag-inom na nauwi sa pagkalasing.
    reason: lexical_alternative
  - marker: b
    text: Ang “namamahala sa sambahayan” ay isang katungkulang administratibo, malamang ang opisyal na nangangasiwa sa sambahayan ng hari o sa palasyo.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּקְשֹׁר עָלָיו
  choice: nagsabwatan laban sa kanya
  rationale: Ang קָשַׁר na may עַל sa salaysay tungkol sa hari ay tumutukoy sa pagbuo ng sabwatan laban sa isang pinuno. Likas sa modernong Filipino ang “nagsabwatan laban sa kanya” at pinananatili nito ang politikal na diwa.
- source_word: עַבְדּוֹ
  choice: ang lingkod niya
  rationale: Ang עֶבֶד ay literal na “lingkod,” bagaman maaari itong tumukoy sa isang opisyal sa konteksto ng palasyo. Pinananatili ng “lingkod” ang katawagan ng Hebreo nang hindi isinasara ang mas malawak nitong gamit.
- source_word: זִמְרִי
  choice: Zimri
  rationale: Isinalin sa karaniwang transliterasyon sa Filipino ang pangalan ng tao.
- source_word: שַׂר מַחֲצִית הָרָכֶב
  choice: pinuno ng kalahati ng mga karwahe
  rationale: Ang שַׂר ay pinuno o kumandante, at ang רֶכֶב dito ay tumutukoy sa mga karwaheng pandigma o hukbo ng mga ito. Malapit sa anyo ng Hebreo at malinaw sa karaniwang mambabasa ang napiling salin.
- source_word: וְהוּא
  choice: Noon, ... siya
  rationale: Ipinakikilala ng parirala ang kalagayang kasabay ng sabwatan. Ang “Noon” at panghalip na “siya” ay natural sa Filipino at hindi dinaragdagan ng pangalang wala sa mismong talata.
- source_word: בְתִרְצָה
  choice: sa Tirza
  rationale: Tuwirang isinalin ang pang-ukol at ginamit ang karaniwang transliterasyon ng pangalan ng lugar.
- source_word: שֹׁתֶה שִׁכּוֹר
  choice: umiinom hanggang malasing
  rationale: Ipinahahayag ng participle at pang-uri ang patuloy na pag-inom na humahantong sa pagkalasing. Natural at malinaw sa Filipino ang “umiinom hanggang malasing,” habang pinananatili ang masiglang kilos ng Hebreo.
- source_word: בֵּית אַרְצָא
  choice: sa bahay ni Arza
  rationale: Ang בֵּית na sinusundan ng pangalan ay likas na isinasaling “bahay ni” sa Filipino.
- source_word: אֲשֶׁר עַל הַבַּיִת
  choice: na namamahala sa sambahayan
  rationale: Ang idyomang עַל־הַבַּיִת ay katawagang administratibo para sa opisyal na nangangasiwa sa sambahayan o palasyo. Pinananatili ng “namamahala sa sambahayan” ang saklaw ng Hebreo nang hindi labis na tinutukoy ang gusali lamang.
- source_word: בְּתִרְצָה
  choice: sa Tirza
  rationale: Inulit ang lokasyon gaya ng Hebreo upang malinaw na maiugnay sa sambahayan o tungkulin ni Arza.
