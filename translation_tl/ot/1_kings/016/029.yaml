base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/029.yaml
  text: And Ahab son of Omri became king over Israel in the thirty-eighth year of Asa king of Judah, and Ahab son of Omri reigned over Israel in Samaria twenty-two years.
translation:
  language: tl
  text: At si Ahab na anak ni Omri ay naging hari ng Israel noong ikatatlumpu't walong taon ng paghahari ni Asa na hari ng Juda. Naghari si Ahab na anak ni Omri sa Israel sa Samaria sa loob ng dalawampu't dalawang taon.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מָלַךְ
  choice: naging hari
  rationale: Sa pormulang panghari, tumutukoy ito sa pagluklok ni Ahab, kaya inihiwalay sa kasunod na pahayag tungkol sa haba ng kanyang paghahari.
- source_word: בִּשְׁנַת שְׁלֹשִׁים וּשְׁמֹנֶה שָׁנָה
  choice: noong ikatatlumpu't walong taon ng paghahari
  rationale: Natural na Filipino para sa ordinal na pormula ng pagpepetsa; idinagdag ang 'ng paghahari' upang luminaw na ang taon ay binibilang sa pamumuno ni Asa.
- source_word: לְאָסָא מֶלֶךְ יְהוּדָה
  choice: ni Asa na hari ng Juda
  rationale: Malinaw at likas na pagpapahayag sa Filipino ng batayang paghaharing ginagamit sa pagtutugma ng petsa.
- source_word: וַיִּמְלֹךְ
  choice: Naghari
  rationale: Ipinakikilala rito ang tagal at saklaw ng pamumuno, hindi lamang ang pagluklok.
- source_word: בְּשֹׁמְרוֹן
  choice: mula sa Samaria
  rationale: Bagaman literal na lokatibo ang ב, ipinahahayag ng konteksto na ang Samaria ang luklukan kung saan pinamahalaan ni Ahab ang Israel; natural ito sa Filipino at hindi ipinahihiwatig na sa lungsod lamang siya naghari.
- source_word: עֶשְׂרִים וּשְׁתַּיִם שָׁנָה
  choice: sa loob ng dalawampu't dalawang taon
  rationale: Karaniwang Filipino para sa tagal ng paghahari.
- source_word: וְ
  choice: At
  rationale: Pinananatili ang ugnayan ng talata sa naunang sunod-sunod na salaysay tungkol sa mga hari.
