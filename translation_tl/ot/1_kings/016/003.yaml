base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/003.yaml
  text: Behold[a], I am sweeping away Baasha and his house, and I will make your house like the house of Jeroboam son of Nebat.
translation:
  language: tl
  text: Narito,[a] lilipulin ko si Baasa at ang kanyang sambahayan, at gagawin kong tulad ng sambahayan ni Jeroboam na anak ni Nebat ang iyong sambahayan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas literal, “sinusunog ko ang nasa hulihan ni Baasa.” Ang idyomang Hebreo ay nagpapahayag ng ganap na paglipol kay Baasa at sa kanyang angkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנְנִי
  choice: Tingnan mo
  rationale: Naghuhudyat ito ng isang taimtim at mariing pahayag ng Diyos. Likas sa makabagong Tagalog ang “Tingnan mo” at napapanatili nito ang puwersang pantawag-pansin.
- source_word: מַבְעִיר אַחֲרֵי
  choice: lilipulin
  rationale: Ang idyoma ay tumutukoy sa ganap na pag-aalis o pagpuksa kay Baasa at sa mga susunod sa kanya, hindi kinakailangang sa literal na pagsunog. Malinaw na naihahatid ng “lilipulin” ang tindi at kabuuan ng hatol.
- source_word: בַעְשָׁא
  choice: Baasa
  rationale: Karaniwang anyong Tagalog ng pangalang Baasha.
- source_word: בֵיתוֹ
  choice: ang kanyang sambahayan
  rationale: Sa konteksto ng hari, ang בַּיִת ay maaaring tumukoy sa pamilya, sambahayan, o dinastiya. Ang “sambahayan” ay natural sa Tagalog at hindi labis na nililimitahan ang kahulugan sa gusali.
- source_word: וְנָתַתִּי
  choice: at gagawin kong
  rationale: Bagaman literal na “ibibigay ko,” sa konstruksiyong ito ay nangangahulugang gagawing maging katulad ng iba.
- source_word: בֵיתְךָ
  choice: ang iyong sambahayan
  rationale: Tumutukoy sa angkan o maharlikang linya ni Baasa; pinananatili ng “sambahayan” ang pampamilya at dinastikong saklaw.
- source_word: כְּבֵית
  choice: tulad ng sambahayan ni
  rationale: Natural na paghahambing sa Tagalog na tapat sa gamit ng כְּ.
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: Jeroboam na anak ni Nebat
  rationale: Karaniwang anyong Tagalog ng pangalan at patronimiko.
theological_decisions:
- issue: Kalikasan ng hatol sa angkan ni Baasa
  choice: Ipinahayag bilang ganap na paglipol kay Baasa at sa kanyang sambahayan, nang hindi tinutukoy ang literal na apoy bilang paraan.
  alternative: Mas literal na “susunugin ko ang nasa likuran ni Baasa” o “tutupukin ko ang sumusunod kay Baasa.”
  rationale: Ang Hebreong idyoma ay nagpapahayag ng ganap na hatol ng Diyos sa maharlikang linya ni Baasa. Ang literal na salin ay magiging malabo sa Tagalog at maaaring magbigay ng maling diin sa paraan ng paghatol sa halip na sa ganap na pag-aalis.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “sambahayan” upang maipahiwatig ang pamilya at dinastiya nang hindi tuwirang nagpapaliit o nagpapalawak sa saklaw ng Hebreong בַּיִת.
