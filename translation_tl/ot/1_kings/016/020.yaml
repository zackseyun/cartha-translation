base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/020.yaml
  text: The rest of the acts of Zimri[a], and his conspiracy that he carried out—are they not written in the Book of the Chronicles of the Kings of Israel?
translation:
  language: tl
  text: Ang iba pang mga ginawa ni Zimri, at ang sabwatang ginawa niya[a]—hindi ba nakasulat ang mga iyon sa Aklat ng mga Kasaysayan ng mga Hari ng Israel?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, inuulit ang salitang-ugat para sa “sabwatan” at “magsabwatan” upang magbigay-diin.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי זִמְרִי
  choice: Ang iba pang mga ginawa ni Zimri
  rationale: Sa pormulang panghari, ang דִּבְרֵי ay tumutukoy sa mga ginawa o gawain ng hari, hindi lamang sa kaniyang mga salita. Likas sa modernong Tagalog ang “iba pang mga ginawa.”
- source_word: וְקִשְׁרוֹ אֲשֶׁר קָשָׁר
  choice: pati ang ginawa niyang pakikipagsabwatan[a]
  rationale: Ang קֶשֶׁר ay isang sabwatan laban sa namumuno. Ipinahihiwatig ng “ginawa niyang” kapwa ang panlalaking isahang hulapi na “kaniya” at ang kasunod na kaugnay na pandiwa, nang hindi nagiging pilit ang pag-uulit sa Tagalog.
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: hindi ba nakasulat ang mga iyon
  rationale: Pinananatili nito ang anyo at puwersa ng retorikal na tanong sa Hebreo.
- source_word: עַל סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יִשְׂרָאֵל
  choice: sa Aklat ng mga Kasaysayan ng mga Hari ng Israel
  rationale: Sa pormulang ito, ang סֵפֶר ay nakasulat na talaan at ang דִּבְרֵי הַיָּמִים ay mga salaysay o annal. Ang pamagat na ito ay malinaw at dignified sa Tagalog.
