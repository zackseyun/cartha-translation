  to: Ang iba pang mga ginawa ni Zimri, at ang sabwatang ginawa niya[a]—hindi ba nakasulat ang mga iyon sa Aklat ng mga Kasaysayan ng mga Hari ng Israel?
  rationale: Pinalitan ang “pati” ng “at” upang mapanatili ang payak na pagkakaugnay ng Hebreo, at inayos ang parirala tungkol sa sabwatan upang maging mas tuwiran at idiomatiko sa Tagalog. Ginawang paliwanag ang talababa sa pag-uulit ng magkaugnay na pangngalan at pandiwa sa Hebreo, sapagkat ang pilit na literal na katumbas nito ay hindi natural sa Tagalog.
