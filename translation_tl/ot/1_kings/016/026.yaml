language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יֵּ֗לֶךְ בְּ/כָל דֶּ֨רֶךְ֙ יָרָבְעָ֣ם בֶּן נְבָ֔ט ו/ב/חטאתי/ו אֲשֶׁ֥ר הֶחֱטִ֖יא אֶת יִשְׂרָאֵ֑ל לְ/הַכְעִ֗יס אֶת יְהוָ֛ה אֱלֹהֵ֥י יִשְׂרָאֵ֖ל בְּ/הַבְלֵי/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/026.yaml
  text: For he walked in all the way of Jeroboam son of Nebat[a], and in his sins by which he caused Israel to sin, provoking Yahweh, the God of Israel, with their idols.
translation:
  language: tl
  text: Sapagkat namuhay siya ayon sa buong landas ni Jeroboam na anak ni Nebat, at ayon sa mga kasalanan nito na ipinagkasala niya sa Israel, upang galitin si Yahweh, ang Diyos ng Israel, sa pamamagitan ng kanilang mga diyus-diyosan[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “kanilang mga bagay na hungkag” o “kanilang mga bagay na walang kabuluhan”—isang mapanuyang katawagan sa mga diyus-diyosan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ בְּכָל דֶּרֶךְ
  choice: tinahak niya ang buong landas
  rationale: Ang הלך ... בדרך ay talinghaga para sa asal o paraan ng pamumuhay. Pinananatili ng “tinahak ... ang landas” ang larawan habang natural sa modernong Tagalog; ipinahihiwatig ng “buong” ang ganap na pagsunod sa huwaran.
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: Jeroboam na anak ni Nebat
  rationale: Karaniwang anyong Tagalog para sa pangalan at patronimiko.
- source_word: וּבְחַטֹּאתָיו אֲשֶׁר הֶחֱטִיא אֶת־יִשְׂרָאֵל
  choice: at sumunod siya sa mga kasalanang ipinasunod nito sa Israel
  rationale: Ang hulaping panlalaki sa “mga kasalanan niya” ay tumutukoy kay Jeroboam, kaya ginamit ang “nito” upang hindi mapagkamalang tumutukoy sa kasalukuyang hari. Pinananatili ng “ipinasunod ... sa Israel” ang causative na puwersa ng Hiphil הֶחֱטִיא.
- source_word: לְהַכְעִיס
  choice: ginalit nila
  rationale: Ipinahahayag ang bunga ng kanilang gawain. Ginawang tahasang sugnay para sa likas na daloy sa Tagalog.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang transliterasyon ng personal na pangalang יהוה, sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ang Diyos ng Israel
  rationale: Tuwirang salin ng pariralang konstruktibo.
- source_word: בְּהַבְלֵיהֶם
  choice: sa pamamagitan ng kanilang mga diyus-diyosan
  rationale: Sa konteksto, ang הֶבֶל ay mapanuyang tawag sa mga diyus-diyosan bilang mga bagay na hungkag at walang halaga. Malinaw ang pangunahing salin, habang inilalahad sa talababa ang literal na talinghaga.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON / Jehova
  rationale: Personal na pangalan ang nasa tekstong Hebreo; pinananatili ito bilang “Yahweh” nang hindi pinapalitan ng titulo.
- issue: Pagpapakahulugan sa הֲבָלִים bilang polemikong katawagan
  choice: mga diyus-diyosan
  alternative: mga bagay na hungkag / mga bagay na walang kabuluhan
  rationale: Malinaw sa kontekstong panrelihiyon na mga huwad na bagay ng pagsamba ang tinutukoy, ngunit pinananatili sa talababa ang Hebreong larawan ng kahungkagan at kawalang-halaga.
- issue: Paksa ng panggagalit sa huling sugnay
  choice: ginalit nila
  alternative: upang galitin niya
  rationale: Ang maramihang hulapi sa בְּהַבְלֵיהֶם (“kanilang”) ay nagpapahintulot na ilarawan ang sama-samang pagkakasala ng hari at Israel. Hindi nito inaalis ang pananagutan ng hari na ipinahayag sa naunang sugnay.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang biblikal na talinghaga ng paglakad sa isang landas, ngunit inayos ang mga panghalip upang malinaw kung alin ang tumutukoy kay Jeroboam at alin ang tumutukoy sa hari at sa Israel.
