revisions:
- from: Sapagkat tinahak niya ang buong landas ni Jeroboam na anak ni Nebat, at sumunod siya sa mga kasalanang ipinasunod nito sa Israel. Sa pamamagitan ng kanilang mga diyus-diyosan[a], ginalit nila si Yahweh, ang Diyos ng Israel.
  to: Sapagkat namuhay siya ayon sa buong landas ni Jeroboam na anak ni Nebat, at ayon sa mga kasalanan nito na ipinagkasala niya sa Israel, upang galitin si Yahweh, ang Diyos ng Israel, sa pamamagitan ng kanilang mga diyus-diyosan[a].
  rationale: 'Inayos ang huling pandiwa upang tumugma sa isahang paksa ng Hebreo at upang maipakita ang ugnayang layon/bunga ng infinitive na “upang galitin.” Pinalitan ang hindi gaanong likas na “ipinasunod” ng “ipinagkasala,” na malinaw na pinananatili ang causative na diwa: si Jeroboam ang nagdulot na magkasala ang Israel. Napanatili ang pangmaramihang “kanilang” sa huling parirala, gaya ng Hebreo, nang hindi nagdaragdag ng tiyak na paliwanag tungkol sa eksaktong antecedent nito.'
