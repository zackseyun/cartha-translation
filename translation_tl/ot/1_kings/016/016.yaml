revisions:
- from: At narinig ng mga taong nagkakampo roon ang balitang, “Nagpakana si Zimri ng paghihimagsik at pinatay din niya ang hari.” Kaya nang araw ding iyon, sa kampo, ginawa ng buong Israel na hari si Omri, ang pinuno ng hukbo ng Israel.
  to: 'Narinig ng mga taong nakahimpil ang ulat: “Nagsabwatan si Zimri at pinatay din niya ang hari.” Kaya, nang araw ding iyon, sa kampo, ginawang hari ng buong Israel si Omri, ang kumandante ng hukbo ng Israel.'
  rationale: 'Inayos ang pagpapakilala sa iniulat na pananalita upang maging wastong modernong Filipino, at ginawang mas tuwiran ang salin ng "nagsabwatan." Pinanatili ang lahat ng mahahalagang elemento ng Hebreo: ang mga nakahimpil, ang ulat, ang pagsasabwatan at pagpatay sa hari, ang buong Israel, si Omri bilang kumandante ng hukbo ng Israel, at ang panahon at lugar ng pagtatalaga.'
