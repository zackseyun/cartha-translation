  source_fidelity: 'Tumpak sa kabuuan ang pangunahing diwa: narinig ng mga nakahimpil na tao ang ulat tungkol sa pagsasabwatan ni Zimri at sa pagpatay niya sa hari, at itinalaga ng buong Israel si Omri bilang hari nang araw ding iyon sa kampo. Ang "pinatay" ay wastong contextual rendering ng הִכָּה sa talatang ito. Gayunman, ang "balitang," ay hindi maayos na pagkakaugnay sa Filipino at hindi malinaw na naipakikilala ang iniulat na pananalita.'
  naturalness: Kailangan ng maliit ngunit kinakailangang pag-aayos. Mas natural ang "Narinig ... ang ulat:" kaysa "narinig ... ang balitang,". Ang "nakahimpil" ay dignified at likas para sa mga taong nasa kampo. Ang "nagsabwatan" ay tuwirang katumbas ng pandiwang Hebreo sa kontekstong ito.
  terminology: Ang mga pangalang Zimri at Omri ay wasto. Ang "kumandante ng hukbo ng Israel" ay malinaw at angkop na modernong Filipino para sa שַׂר־צָבָא עַל־יִשְׂרָאֵל. Walang isyung teolohikal o kailangang talababa.
