base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/016.yaml
  text: And the people who were camped there heard it said, “Zimri has conspired and has also struck down the king.” So all Israel made Omri, the commander of the army over Israel, king that day in the camp.
translation:
  language: tl
  text: 'Narinig ng mga taong nakahimpil ang ulat: “Nagsabwatan si Zimri at pinatay din niya ang hari.” Kaya, nang araw ding iyon, sa kampo, ginawang hari ng buong Israel si Omri, ang kumandante ng hukbo ng Israel.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָעָם הַחֹנִים
  choice: mga taong nagkakampo roon
  rationale: Likas at malinaw na Filipino para sa bayang nakahimpil sa kampo; ang “roon” ay ipinahihiwatig ng konteksto bagaman walang hiwalay na katumbas sa Hebreo.
- source_word: קָשַׁר
  choice: nagpakana ... ng paghihimagsik
  rationale: Sa kontekstong pampolitika, tumutukoy ito sa pagsasabwatan o pag-aaklas laban sa hari; pinananatili ng “nagpakana” ang diwa ng sinadyang sabwatan.
- source_word: הִכָּה אֶת־הַמֶּלֶךְ
  choice: pinatay ... ang hari
  rationale: Bagaman literal na “sinaktan/hinampas,” sa salaysay ay malinaw na nakamamatay ang kilos at karaniwang gamit ng pandiwa rito ang pagpaslang.
- source_word: וַיַּמְלִכוּ ... אֶת־עָמְרִי
  choice: ginawa ... na hari si Omri
  rationale: 'Tumpak na nagpapahayag ng causative royal acclamation: itinalaga o kinilalang hari si Omri.'
- source_word: שַׂר צָבָא עַל־יִשְׂרָאֵל
  choice: pinuno ng hukbo ng Israel
  rationale: Natural na Filipino para sa opisyal na kumandante ng hukbo; ang עַל ay nagpapahiwatig ng pamumuno o awtoridad sa hukbo ng Israel.
