language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: יַ֗עַן אֲשֶׁ֤ר הֲרִימֹתִ֨י/ךָ֙ מִן הֶ֣/עָפָ֔ר וָ/אֶתֶּנְ/ךָ֣ נָגִ֔יד עַ֖ל עַמִּ֣/י יִשְׂרָאֵ֑ל וַ/תֵּ֣לֶךְ בְּ/דֶ֣רֶךְ יָרָבְעָ֗ם וַֽ/תַּחֲטִא֙ אֶת עַמִּ֣/י יִשְׂרָאֵ֔ל לְ/הַכְעִיסֵ֖/נִי בְּ/חַטֹּאתָֽ/ם־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/002.yaml
  text: Because I raised you up from the dust and made you ruler over my people Israel[a], and you walked in the way of Jeroboam and caused my people Israel to sin, provoking me to anger by their sins,
translation:
  language: tl
  text: “Dahil iniangat kita mula sa alabok at ginawa kitang pinuno ng bayan kong Israel, at lumakad ka sa daan ni Jeroboam at naging dahilan ka upang magkasala ang bayan kong Israel[a], anupat ginalit nila ako sa pamamagitan ng kanilang mga kasalanan,”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O kaya, “at inakay mo sa pagkakasala ang bayan kong Israel.” Causative ang anyo ng pandiwang Hebreo.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעַן אֲשֶׁר
  choice: Dahil
  rationale: Likas na panandang sanhi sa makabagong Tagalog at ipinakikitang ang talata ang batayan ng hatol na kasunod.
- source_word: הֲרִימֹתִיךָ מִן הֶעָפָר
  choice: iniangat kita mula sa alabok
  rationale: Pinananatili ang larawan ng pag-angat mula sa abang kalagayan at ang pahiwatig ng pagtataas sa katungkulan.
- source_word: וָאֶתֶּנְךָ נָגִיד
  choice: ginawa kitang pinuno
  rationale: Malinaw at kasalukuyang katumbas ng נָגִיד sa konteksto ng pamamahala; hindi ipinipilit ang mas teknikal o makalumang ‘prinsipe.’
- source_word: עַל עַמִּי יִשְׂרָאֵל
  choice: ng bayan kong Israel
  rationale: Sa Tagalog, natural na ipinahahayag ng ‘pinuno ng’ ang pamamahala sa bayan habang pinananatili ang diin sa ‘bayan ko.’
- source_word: וַתֵּלֶךְ בְּדֶרֶךְ יָרָבְעָם
  choice: ngunit lumakad ka sa daan ni Jeroboam
  rationale: Pinananatili ang biblikal na talinghaga ng paglakad sa isang daan bilang paraan ng pamumuhay. Ang ‘ngunit’ ay likas na naghahayag ng matinding pagsalungat ng tugon ng hari sa ginawa ng Diyos, bagaman ang Hebreo ay gumagamit ng karaniwang pang-ugnay.
- source_word: וַתַּחֲטִא אֶת עַמִּי יִשְׂרָאֵל
  choice: at naging dahilan ka upang magkasala ang bayan kong Israel
  rationale: Tuwirang ipinahahayag ang causative na anyo ng pandiwang Hebreo nang hindi ipinahihiwatig na walang sariling pananagutan ang bayan.
- source_word: לְהַכְעִיסֵנִי
  choice: anupat ginalit nila ako
  rationale: Ang ‘anupat’ ay natural na naglalahad ng bunga, habang ang ‘ginalit nila ako’ ay nagpapanatili sa personal na pagkapukaw ng galit ng Diyos.
- source_word: בְּחַטֹּאתָם
  choice: sa kanilang mga kasalanan
  rationale: Pinananatili ang maramihang pangngalan at ang panghalip na tumutukoy, ayon sa pinakamalapit na antecedent, sa bayang Israel.
theological_decisions:
- issue: Tinutukoy ng hulaping maramihan sa בְּחַטֹּאתָם
  choice: Ang ‘kanilang mga kasalanan’ ay tumutukoy sa mga kasalanang ginawa ng bayang Israel bunga ng pamumuno ni Baasha.
  alternative: Maaari itong unawain nang mas malawak bilang mga makasalanang gawaing kaugnay ng daan ni Jeroboam, kasama ang pakikibahagi ni Baasha.
  rationale: Ang pinakamalapit na antecedent ay ‘ang bayan kong Israel.’ Napananatili nito kapuwa ang pananagutan ng haring umakay at ang pananagutan ng bayang aktuwal na nagkasala.
- issue: Ugnayan ng וַתֵּלֶךְ sa naunang ginawa ng Diyos
  choice: Isinalin ang pang-ugnay bilang ‘ngunit’ upang ihayag ang malinaw na kontekstuwal na pagsalungat.
  alternative: Maaaring isalin bilang ‘at,’ na mas tuwirang tumutugma sa karaniwang Hebreong waw at hindi tahasang nagdaragdag ng adversative na ugnayan.
  rationale: Bagaman hindi natatanging adversative ang anyong Hebreo, malinaw sa daloy ang pagsalungat ng pagtaas ng Diyos kay Baasha at ng sumunod niyang pagkilos. Hindi nito binabago ang teolohikal na nilalaman.
- issue: Layon o bunga ng לְהַכְעִיסֵנִי
  choice: ‘anupat ginalit nila ako,’ na naghahayag ng bunga
  alternative: ‘upang galitin ako,’ na maaaring magpahiwatig ng layon o intensiyon
  rationale: Maaaring magpahayag ng layon o bunga ang infinitive construction. Pinili ang bungang pagbasa upang hindi ipalagay na sadyang layunin ng buong bayan na galitin ang Diyos, habang pinananatili ang tunay na epekto ng kanilang mga kasalanan.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang larawang ‘mula sa alabok’ at ang idyomang ‘lumakad sa daan,’ ngunit ginawang natural ang sintaks para sa karaniwang mambabasang Filipino. Nagtatapos sa kuwit dahil nagpapatuloy ang pangungusap at ang hatol sa kasunod na talata.
