    rationale: Ang waw sa sunod-sunod na salaysay ay pinakamaligtas na isalin bilang “at.” Maaaring makita ang kontrast sa konteksto nang hindi ito ipinapasok bilang tahasang pang-ugnay.
  - severity: low
