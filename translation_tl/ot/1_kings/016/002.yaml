  naturalness: Ang rebisyong pangungusap ay nananatiling natural, makabago, at marangal na Tagalog. Ang “anupat ginalit nila ako sa pamamagitan ng kanilang mga kasalanan” ay malinaw na naghahayag ng resultang kaugnay ng pagkakasala ng bayan.
  terminology: Ang “iniangat ... mula sa alabok,” “pinuno,” “lumakad ... sa daan ni Jeroboam,” at “magkasala” ay angkop. Ang “naging dahilan ka upang magkasala” ay wastong naghahayag ng causative na anyo nang hindi inaalis ang pananagutan ng bayan.
