  text: בִּ/שְׁנַ֨ת עֶשְׂרִ֤ים וָ/שֵׁשׁ֙ שָׁנָ֔ה לְ/אָסָ֖א מֶ֣לֶךְ יְהוּדָ֑ה מָ֠לַךְ אֵלָ֨ה בֶן בַּעְשָׁ֧א עַל יִשְׂרָאֵ֛ל בְּ/תִרְצָ֖ה שְׁנָתָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/008.yaml
  text: In the twenty-sixth year of Asa king of Judah, Elah son of Baasha became king over Israel in Tirzah for two years.
translation:
  language: tl
  text: Nang ikadalawampu't anim na taon ng paghahari ni Asa na hari ng Juda, naging hari ng Israel sa Tirza si Ela na anak ni Baasa. Naghari siya nang dalawang taon.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּשְׁנַת עֶשְׂרִים וָשֵׁשׁ שָׁנָה
  choice: Nang ikadalawampu't anim na taon ng paghahari
  rationale: Likas na salin sa modernong Tagalog ng pormulang Hebreo para sa pagtukoy sa taon ng paghahari; iniiwasan nito ang di-likas na literal na pag-uulit ng salitang 'taon'.
- source_word: לְאָסָא מֶלֶךְ יְהוּדָה
  choice: ni Asa na hari ng Juda
  rationale: Ang לְ ay tumutukoy sa taon ng paghahari ni Asa. Nililinaw ng 'na hari ng Juda' ang kaniyang titulo nang walang idinaragdag sa teksto.
- source_word: מָלַךְ
  choice: naging hari
  rationale: Sa pormula ng pagluklok, ipinahihiwatig ng pandiwa ang pagsisimula ng pagiging hari. Ang 'naging hari' ay tuwiran at natural sa Tagalog.
- source_word: אֵלָה
  choice: Ela
  rationale: Transliterasyon ng pangalang Hebreo sa anyong madaling basahin sa Tagalog.
- source_word: בֶן בַּעְשָׁא
  choice: anak ni Baasa
  rationale: Natural na katumbas sa Tagalog ng karaniwang konstruksiyong Hebreo para sa ugnayang ama at anak.
- source_word: עַל יִשְׂרָאֵל
  choice: ng Israel
  rationale: Kasunod ng 'naging hari,' natural na ipinahahayag sa Tagalog ang nasasakupan sa pamamagitan ng 'hari ng Israel'; pinananatili nito ang diwa ng pamamahala sa Israel nang hindi idinaragdag ang salitang 'kaharian.'
- source_word: בְּתִרְצָה
  choice: sa Tirza
  rationale: Ang בְּ ay pananda ng lokasyon dito; ang 'sa Tirza' ang natural na anyo sa Tagalog.
- source_word: שְׁנָתָיִם
  choice: nang dalawang taon
  rationale: Ang dual na anyo ay nangangahulugang 'dalawang taon.' Ginamit ang 'nang' upang malinaw na ipahayag ang tagal ng paghahari.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Hinati sa dalawang pangungusap upang maiwasan ang posibleng maling pagbasa na ang 'dalawang taon' ay tumutukoy sa paninirahan sa Tirza sa halip na sa haba ng paghahari.
