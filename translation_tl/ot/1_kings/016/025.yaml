  text: וַ/יַּעֲשֶׂ֥ה עָמְרִ֛י הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה וַ/יָּ֕רַע מִ/כֹּ֖ל אֲשֶׁ֥ר לְ/פָנָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/025.yaml
  text: Omri did what was evil in the eyes of Yahweh[a], and he did more evil than all who were before him.
translation:
  language: tl
  text: Ginawa ni Omri ang masama sa paningin ni Yahweh, at gumawa siya ng higit pang masama kaysa sa lahat ng nauna sa kanya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O kaya, “at mas masama siya kaysa sa lahat ng nauna sa kanya.” Maaaring unawain ang pandiwang Hebreo bilang paglalarawan kay Omri mismo o sa kanyang mga ginawa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשֶׂה
  choice: Ginawa
  rationale: Sa pariralang עשה הרע, natural sa modernong Tagalog ang “ginawa ang masama,” na tumutukoy sa paggawa ng masasamang bagay.
- source_word: הָרַע
  choice: ang masama
  rationale: Ginagamit ang may-artikulong pang-uri bilang pangngalan sa nakaugaliang pormulang Hebreo; malinaw at likas sa Tagalog ang “ang masama.”
- source_word: בְּעֵינֵי
  choice: sa paningin ng
  rationale: Pinananatili nito ang larawang Hebreo ng pagsusuri ayon sa pananaw ng isang tao, habang natural sa Tagalog.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasatitik nito ang personal na pangalang יְהוָה sa halip na palitan iyon ng isang titulo.
- source_word: וַיָּרַע
  choice: gumawa siya ng higit na masama
  rationale: Ipinahahayag nito ang paghahambing sa konteksto at pinananatili ang ugnayan sa unang sugnay; maaari ring unawain ang pandiwa bilang paglalarawan kay Omri mismo.
- source_word: מִכֹּל אֲשֶׁר לְפָנָיו
  choice: kaysa sa lahat ng nauna sa kanya
  rationale: Tapat ito sa hindi tahasang pagtukoy ng Hebreo sa “lahat ng nauna sa kanya,” nang hindi idinaragdag sa pangunahing teksto ang salitang “mga hari.”
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehova
  rationale: Pangalan mismo ang nasa tekstong Hebreo, kaya pinananatili itong personal na pangalan sa halip na palitan ng isang titulo.
- issue: Kung ang וַיָּרַע ay tumutukoy sa mga gawa o sa pagkatao ni Omri
  choice: gumawa siya ng higit na masama
  alternative: mas masama siya
  rationale: Mas angkop sa nakapaligid na pormula ng pagsusuri sa mga gawa ang pangunahing salin, ngunit tunay na posible sa gramatika ang pagbasa na inilalarawan si Omri mismo; kaya pinanatili ang alternatibo sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Pinanatili ang idyomang “sa paningin ni Yahweh” at iniwasang idagdag ang “mga hari,” na ipinahihiwatig lamang ng konteksto.
