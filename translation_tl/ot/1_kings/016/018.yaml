base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/018.yaml
  text: And when Zimri saw that the city had been captured[a], he went into the citadel of the king’s house and burned the king’s house over himself with fire[b], and died.
translation:
  language: tl
  text: Nang makita ni Zimri na nasakop na ang lungsod, pumasok siya sa muog ng palasyo ng hari[a]. Sinunog niya sa paligid niya ang palasyo ng hari gamit ang apoy[b], at namatay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Hebreo na isinaling “muog” ay maaari ring tumukoy sa isang kuta o pinatibay na bahagi ng palasyo.
    reason: lexical_alternative
  - marker: b
    text: 'Literal: “sinunog niya sa ibabaw niya ang palasyo ng hari sa apoy.” Ipinahihiwatig nito na sinunog niya ang maharlikang tirahan sa/sa paligid ng kaniyang sarili.'
    reason: cultural_note
lexical_decisions:
- source_word: כִּרְאוֹת
  choice: Nang makita
  rationale: Ang כ na sinusundan ng infinitive construct ay panahong pangyayari rito; natural sa makabagong Tagalog ang “Nang makita.”
- source_word: נִלְכְּדָה הָעִיר
  choice: nasakop na ang lungsod
  rationale: Ang Nifal ng לכד ay nangangahulugang mahuli o masakop. Ipinahihiwatig ng “na” na naganap na ang pagsakop bago ito nakita ni Zimri.
- source_word: אַרְמוֹן בֵּית הַמֶּלֶךְ
  choice: muog ng palasyo ng hari
  rationale: Maaaring tumukoy ang אַרְמוֹן sa isang pinatibay na gusaling maharlika. Pinananatili ng “muog” ang ideya ng panloob na matibay na bahagi at iniiwasang ipantay lamang ito sa kasunod na “palasyo ng hari.”
- source_word: בֵּית הַמֶּלֶךְ / בֵּית מֶלֶךְ
  choice: palasyo ng hari
  rationale: Bagaman literal na “bahay ng hari,” ang “palasyo ng hari” ang natural at malinaw na katumbas sa konteksto ng tirahan at gusaling maharlika.
- source_word: וַיִּשְׂרֹף עָלָיו ... בָּאֵשׁ
  choice: Sinunog niya ang palasyo habang nasa loob siya
  rationale: Ipinahahayag nito nang natural sa Tagalog na sinilaban ni Zimri ang gusali sa paligid niya habang siya ay nasa loob, nang hindi idinaragdag na gumuho ito.
- source_word: וַיָּמֹת
  choice: at namatay
  rationale: Payak na pagpapatuloy ng salaysay na nagsasaad ng bunga ng ginawa niya.
