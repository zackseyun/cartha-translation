  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “muog” upang mapanatili ang pagkakaiba ng אַרְמוֹן at בֵּית הַמֶּלֶךְ, at inilagay ang mga panandang talababa sa mismong teksto.
