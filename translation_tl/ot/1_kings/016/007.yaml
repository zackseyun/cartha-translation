id: 1KI.16.7
reference: 1 Kings 16:7
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/גַ֡ם בְּ/יַד יֵה֨וּא בֶן חֲנָ֜נִי הַ/נָּבִ֗יא דְּבַר יְהוָ֡ה הָיָה֩ אֶל בַּעְשָׁ֨א וְ/אֶל בֵּית֜/וֹ וְ/עַ֥ל כָּל הָ/רָעָ֣ה אֲשֶׁר עָשָׂ֣ה בְּ/עֵינֵ֣י יְהוָ֗ה לְ/הַכְעִיס/וֹ֙ בְּ/מַעֲשֵׂ֣ה יָדָ֔י/ו לִ/הְי֖וֹת כְּ/בֵ֣ית יָרָבְעָ֑ם וְ/עַ֥ל אֲשֶׁר הִכָּ֖ה אֹתֽ/וֹ־־־־־־׀־׀־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/007.yaml
  text: And also through Jehu son of Hanani the prophet[a], the word of Yahweh came against Baasha and against his house, both because of all the evil that he did in the sight of Yahweh, provoking him to anger by the work of his hands, by becoming like the house of Jeroboam, and because he struck him down.
translation:
  language: tl
  text: At sa pamamagitan din ng propetang si Jehu na anak ni Hanani, dumating ang salita ni Yahweh laban kay Baasa at sa sambahayan niya dahil sa lahat ng kasamaang ginawa niya sa paningin ni Yahweh—sa pagpukaw niya sa galit ni Yahweh sa pamamagitan ng gawa ng kanyang mga kamay, sa pagiging tulad ng sambahayan ni Jeroboam, at dahil nilipol niya iyon.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “at dahil pinatay niya siya.” Panlalaking isahan ang hulapi sa Hebreo at maaaring tumukoy kay Jeroboam mismo o, na mas malamang ayon sa konteksto, sa kanyang sambahayan o dinastiya bilang isang kabuuan.
    reason: Pinananatili ang tunay na kalabuan ng reperente ng Hebreong panghalip.
lexical_decisions:
- source_word: וְגַם
  choice: At ... din
  rationale: Pinananatili ang dugtong at karagdagang diin mula sa naunang konteksto nang natural sa modernong Tagalog.
- source_word: בְּיַד יֵהוּא
  choice: sa pamamagitan ... ni Jehu
  rationale: 'Ang idyomang Hebreo ay tumutukoy sa ahensiya: si Jehu ang tagapamagitan ng mensahe.'
- source_word: דְּבַר יְהוָה
  choice: ang salita ni Yahweh
  rationale: Pinananatili ang pormulang propetiko at direktang isinasalin ang pangalang tipan na יהוה bilang Yahweh.
- source_word: אֶל בַּעְשָׁא וְאֶל בֵּיתוֹ
  choice: laban kay Baasa at sa sambahayan niya
  rationale: Sa konteksto ng paghatol, ang אֶל ay may diwang laban o pagsalungat; ang 'sambahayan' ay maaaring sumaklaw sa pamilya at dinastiya.
- source_word: וְעַל כָּל הָרָעָה
  choice: dahil sa lahat ng kasamaang
  rationale: Ipinapahayag ng עַל ang batayan ng hatol sa kontekstong ito.
- source_word: בְּעֵינֵי יְהוָה
  choice: sa paningin ni Yahweh
  rationale: Natural na Tagalog na nagpapanatili sa karaniwang Hebreong metapora ng pagsusuri ng Diyos.
- source_word: לְהַכְעִיסוֹ
  choice: sa pagpukaw niya sa galit ni Yahweh
  rationale: Malinaw na naihahatid ang causative na diwa nang hindi nagmumukhang si Baasa ang nagalit kay Yahweh.
- source_word: בְּמַעֲשֵׂה יָדָיו
  choice: sa pamamagitan ng gawa ng kanyang mga kamay
  rationale: Pinananatili ang kongkretong idyoma ng Hebreo, na maaaring tumukoy sa kanyang mga ginawa at posibleng may pahiwatig sa idolatriya.
- source_word: לִהְיוֹת כְּבֵית יָרָבְעָם
  choice: sa pagiging tulad ng sambahayan ni Jeroboam
  rationale: Pinananatili ang ugnayan nito sa dahilan o paraan ng pagpukaw sa galit ni Yahweh nang hindi pinasisimple ang sintaks.
- source_word: וְעַל אֲשֶׁר הִכָּה אֹתוֹ
  choice: at dahil nilipol niya iyon
  rationale: Ang 'iyon' ay maaaring tumukoy sa sambahayan o dinastiya bilang isang kabuuan. Ang talab ng הִכָּה sa konteksto ay higit sa simpleng pananakit at tumutukoy sa marahas na pagpuksa.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Ginagamit ng talata ang Tetragrammaton; pinananatili ng 'Yahweh' ang personal na pangalang tipan.
- issue: Tinutukoy ng hulaping panlalaking isahan sa אֹתוֹ
  choice: iyon, na tumutukoy sa sambahayan o dinastiya ni Jeroboam bilang kabuuan
  alternative: siya, na tumutukoy kay Jeroboam bilang tao
  rationale: Mas malapit sa konteksto ang kolektibong pagtukoy sa sambahayan ni Jeroboam, ngunit tunay na malabo sa gramatika ang reperente kaya itinatala ang alternatibo.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang 'sambahayan' upang mapanatili ang lawak ng בַּיִת bilang pamilya, sambahayan, o dinastiya. Inilagay ang talababa sa mismong malabong panghalip sa hulihan ng talata.
