  text: וַ/יַּ֥עַשׂ אַחְאָ֖ב אֶת הָ/אֲשֵׁרָ֑ה וַ/יּ֨וֹסֶף אַחְאָ֜ב לַ/עֲשׂ֗וֹת לְ/הַכְעִיס֙ אֶת יְהֹוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל מִ/כֹּ֨ל מַלְכֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁ֥ר הָי֖וּ לְ/פָנָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/033.yaml
  text: Ahab also made the Asherah[a], and Ahab went on to do more to provoke Yahweh, the God of Israel, than all the kings of Israel who were before him.
translation:
  language: tl
  text: Gumawa rin si Ahab ng Ashera[a]. At lalo pang gumawa si Ahab upang pukawin sa galit si Yahweh, ang Diyos ng Israel, kaysa sa lahat ng hari ng Israel na nauna sa kanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “poste ni Ashera.” Maaaring tumukoy ang salitang Hebreo na אֲשֵׁרָה sa diyosang Ashera o sa bagay na ginagamit sa pagsamba na kaugnay niya.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Gumawa
  rationale: Tuwirang ipinapahayag ang karaniwang diwa ng עשה na “gumawa.” Hindi ito pinakitid sa “nagtayo,” sapagkat mas malawak ang pandiwang Hebreo.
- source_word: הָאֲשֵׁרָה
  choice: ang Ashera
  rationale: Pinananatili ang katawagang Hebreo upang hindi pagpasyahan sa pangunahing teksto kung ang tinutukoy ay ang diyosang Ashera o ang bagay na ginagamit sa pagsamba na kaugnay niya.
- source_word: וַיּוֹסֶף ... לַעֲשׂוֹת
  choice: higit pa ang ginawa
  rationale: Sa pagkakaugnay nito sa paghahambing na kasunod, ipinahihiwatig ng יסף + pawatas ang pagdaragdag o paglampas sa ginawa ng mga naunang hari.
- source_word: לְהַכְעִיס
  choice: pagpukaw ... sa galit
  rationale: 'Ipinapakita nito ang causative na diwa ng Hiphil ng כעס: gumawa upang magalit ang tahasang layon, si Yahweh.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tinutumbasan ang personal na banal na pangalan sa pamamagitan ng transliterasyon sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ang Diyos ng Israel
  rationale: Likas at tuwirang salin ng construct chain na nagpapakilala kay Yahweh bilang Diyos ng Israel.
- source_word: מִכֹּל מַלְכֵי יִשְׂרָאֵל
  choice: kaysa sa lahat ng hari ng Israel
  rationale: 'Ipinahahayag ng מן ang paghahambing: nilampasan ni Ahab ang lahat ng naunang hari sa pagpukaw kay Yahweh sa galit.'
- source_word: אֲשֶׁר הָיוּ לְפָנָיו
  choice: na nauna sa kanya
  rationale: Malinaw at likas na Filipino para sa idyomang tumutukoy sa mga haring nabuhay at naghari bago si Ahab.
theological_decisions:
- issue: Tinutukoy ng אֲשֵׁרָה
  choice: Panatilihin bilang “Ashera” nang hindi pinagpapasyahan ang tiyak na tinutukoy.
  alternative: “poste ni Ashera” o “ang diyosang Ashera”
  rationale: Maaaring tumukoy ang salitang Hebreo sa diyosa o sa bagay na ginagamit sa kulto na kaugnay niya. Hindi tahasang nilulutas ng talata ang pagkakaibang ito, kaya pinananatili ang tunay na kalabuan sa pangunahing teksto.
translation_notes:
  register: Modernong Filipino na dignified at madaling maunawaan. Ginamit ang “kanya” sa halip na mas pormal na “kaniya,” at pinanatili ang pangalang Yahweh at ang teknikal na pangalang Ashera.
