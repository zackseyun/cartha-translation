reference: 1 Kings 16:31
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יְהִי֙ הֲ/נָקֵ֣ל לֶכְתּ֔/וֹ בְּ/חַטֹּ֖אות יָרָבְעָ֣ם בֶּן נְבָ֑ט וַ/יִּקַּ֨ח אִשָּׁ֜ה אֶת אִיזֶ֗בֶל בַּת אֶתְבַּ֨עַל֙ מֶ֣לֶךְ צִידֹנִ֔ים וַ/יֵּ֨לֶךְ֙ וַֽ/יַּעֲבֹ֣ד אֶת הַ/בַּ֔עַל וַ/יִּשְׁתַּ֖חוּ לֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/031.yaml
  text: And as if it were a light thing for him to walk in the sins of Jeroboam son of Nebat[a], he took Jezebel daughter of Ethbaal, king of the Sidonians, as his wife, and went and served Baal and bowed down to him.
translation:
  language: tl
  text: At para bang maliit na bagay lamang para sa kanya ang mamuhay sa mga kasalanan ni Jeroboam na anak ni Nebat[a], pinakasalan niya si Jezebel, na anak ni Etbaal, hari ng mga taga-Sidon. Pagkatapos, naglingkod siya kay Baal at yumukod sa kanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Maliit na bagay ba para sa kanya ang mamuhay sa mga kasalanan ni Jeroboam na anak ni Nebat...?” Retorikal ang pambungad sa Hebreo at idiniriin na itinuring ni Ahab na hindi gaanong mahalaga ang mga kasalanang iyon.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲנָקֵל
  choice: para bang maliit na bagay lamang sa kanya
  rationale: 'Pinananatili nito ang retorikal at mapanuring diin ng idyomang Hebreo: itinuring ni Ahab na hindi gaanong mahalaga ang mga kasalanan ni Jeroboam, bago ilahad ang lalo pa niyang pagtalikod.'
- source_word: לֶכְתּוֹ בְּחַטֹּאות
  choice: mamuhay sa mga kasalanan
  rationale: Ang literal na metaporang 'lumakad sa' ay tumutukoy sa asal o takbo ng pamumuhay. Ang 'mamuhay sa' ay malinaw at likas sa makabagong Tagalog habang pinananatili ang diwa ng patuloy na paggawi.
- source_word: וַיִּקַּח אִשָּׁה אֶת אִיזֶבֶל
  choice: kinuha niyang asawa si Jezebel
  rationale: Malapit ito sa estrukturang Hebreo na 'kumuha ng asawa' at natural din sa Tagalog; hindi nito pinalalawak ang pahayag nang higit sa teksto.
- source_word: אֶתְבַּעַל
  choice: Etbaal
  rationale: Transliterasyon ito ng pangalang Fenicio batay sa anyong Hebreo.
- source_word: צִידֹנִים
  choice: mga Sidonio
  rationale: Tumutukoy ang maramihang katawagang Hebreo sa bayan ng Sidon; ang 'mga Sidonio' ay maikli at malinaw sa Tagalog.
- source_word: וַיֵּלֶךְ
  choice: humayo siya
  rationale: Pinananatili ang hiwalay na pandiwa at ang pasulong na pagkakasunod-sunod ng salaysay, nang hindi ito isinasama lamang sa 'naglingkod.'
- source_word: וַיַּעֲבֹד אֶת הַבַּעַל
  choice: naglingkod kay Baal
  rationale: Sa kontekstong panrelihiyon, ang pandiwa ay nagsasaad ng paglilingkod o debosyong pangkulto. Pinananatili ng 'naglingkod' ang kaibhan nito sa kasunod na pisikal na pagyukod.
- source_word: וַיִּשְׁתַּחוּ לוֹ
  choice: yumukod sa kanya
  rationale: Tiyak na inilalarawan ng pandiwa ang pagyukod o pagpapatirapa. Ang 'yumukod' ay natural at pinananatili ang pisikal na kilos nang hindi ito ipinapantay lamang sa pangkalahatang 'sumamba.'
theological_decisions:
- issue: Ang pagtalikod ni Ahab kaugnay ng mga kasalanan ni Jeroboam at ng paglilingkod kay Baal
  choice: 'Inilalarawan ang mga ginawa ni Ahab bilang paglala: para bang maliit na bagay lamang ang pamumuhay sa mga kasalanan ni Jeroboam, kaya nag-asawa pa siya kay Jezebel at naglingkod kay Baal.'
  alternative: 'Maaaring basahin ang pambungad bilang tuwirang tanong: ''Maliit na bagay ba sa kanya ang mamuhay sa mga kasalanan ni Jeroboam...?'''
  rationale: Ang anyong Hebreo ay maaaring ipahayag bilang retorikal na tanong o bilang idyomatikong pahayag. Pinananatili ng pangunahing salin ang mapanuring diin at paglala sa salaysay, samantalang inilalagay sa talababa ang tunay na alternatibong anyo.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang 'mamuhay sa mga kasalanan' sa halip na mas literal ngunit di-gaanong likas na 'lumakad sa mga kasalanan.' Pinanatiling magkahiwalay ang paglilingkod kay Baal at ang pagyukod sa kanya.
