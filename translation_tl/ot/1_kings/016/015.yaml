  text: בִּ/שְׁנַת֩ עֶשְׂרִ֨ים וָ/שֶׁ֜בַע שָׁנָ֗ה לְ/אָסָא֙ מֶ֣לֶךְ יְהוּדָ֔ה מָלַ֥ךְ זִמְרִ֛י שִׁבְעַ֥ת יָמִ֖ים בְּ/תִרְצָ֑ה וְ/הָ/עָ֣ם חֹנִ֔ים עַֽל גִּבְּת֖וֹן אֲשֶׁ֥ר לַ/פְּלִשְׁתִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/015.yaml
  text: In the twenty-seventh year of Asa king of Judah[a], Zimri became king for seven days in Tirzah, while the people were camped against Gibbethon, which belonged to the Philistines.
translation:
  language: tl
  text: Sa ikadalawampu’t pitong taon ng paghahari ni Asa, hari ng Juda, naghari si Zimri nang pitong araw sa Tirza, samantalang nakahimpil ang mga tao laban sa Gibeton[a], na pag-aari ng mga Filisteo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa Gibeton.” Sa kontekstong militar, malamang na ipinahihiwatig ng “laban sa Gibeton” na nakahimpil ang mga tao bilang pagsalungat sa lungsod.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּשְׁנַת עֶשְׂרִים וָשֶׁבַע שָׁנָה לְאָסָא מֶלֶךְ יְהוּדָה
  choice: Nang ikadalawampu’t pitong taon ng paghahari ni Asa na hari ng Juda
  rationale: Isinasalin ang karaniwang pormula ng pagtutugma ng mga taon ng paghahari sa natural na Filipino; nililinaw ng “ng paghahari” ang ipinahihiwatig ng Hebreong pormula.
- source_word: מָלַךְ זִמְרִי שִׁבְעַת יָמִים
  choice: pitong araw na naghari si Zimri
  rationale: Ang מָלַךְ ay maaaring tumukoy sa pagiging o paghahari bilang hari. Dahil tahasang kasunod ang haba ng panahon, natural at tuwiran sa Filipino ang “pitong araw na naghari,” nang hindi kinakailangang ipilit ang ingressive na “naging hari.”
- source_word: בְּתִרְצָה
  choice: sa Tirza
  rationale: Payak na lokatibong parirala para sa pangalan ng lugar.
- source_word: וְהָעָם חֹנִים
  choice: Samantala, nakahimpil ang mga tao
  rationale: Ipinapakita ng participle ang nagpapatuloy na kalagayan ng pagkakampo. Ang “Samantala” ay natural na naghahayag ng kasabay na pangyayari, at pinananatili ng “mga tao” ang pangkalahatang katawagang הָעָם nang hindi ito ginagawang tahasang “hukbo.”
- source_word: עַל גִּבְּתוֹן
  choice: laban sa Gibeton
  rationale: Sa kontekstong militar, ang עַל ay malamang na nagpapahiwatig ng pagharap o pakikipaglaban sa lungsod. Hindi ginamit ang “kinukubkob” sapagkat mas tiyak iyon kaysa sa mismong Hebreo; inilakip sa talababa ang posibleng lokatibong pagbasa.
- source_word: אֲשֶׁר לַפְּלִשְׁתִּים
  choice: na pag-aari ng mga Filisteo
  rationale: Malinaw na ipinahahayag nito ang pag-aari o pagkakaugnay na tinutukoy ng לְ, nang hindi dinaragdagan ng mas tiyak na ideya ng pansamantalang pagkontrol ng militar.
theological_decisions: []
translation_notes:
  register: Makabago at marangal na Filipino na madaling maunawaan. Ginamit ang “nakahimpil” para sa kampong militar at iniwasan ang mas teknikal o sobrang tiyak na “kinukubkob.” Inilagay ang panandang [a] kaagad pagkatapos ng “Gibeton,” ang pariralang tinutukoy ng talababa.
