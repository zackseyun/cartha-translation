base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/010.yaml
  text: Then Zimri came in, struck him down, and killed him, in the twenty-seventh year of Asa king of Judah; and he reigned in his place.
translation:
  language: tl
  text: Pagkatapos, pumasok si Zimri, sinaktan niya ito at pinatay niya ito. Nangyari ito noong ikadalawampu’t pitong taon ng paghahari ni Asa, hari ng Juda. At naghari si Zimri bilang kahalili niya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא
  choice: Pagkatapos, pumasok
  rationale: Ang בוא ay maaaring mangahulugang ‘dumating’ o ‘pumasok.’ Sa tagpong ito ng pagpaslang, natural ang ‘pumasok,’ at ipinahihiwatig ng ‘Pagkatapos’ ang sunod-sunod na salaysay ng waw.
- source_word: זִמְרִי
  choice: Zimri
  rationale: Pinanatili ang kinagawiang transliterasyon ng pangalan.
- source_word: וַיַּכֵּהוּ
  choice: pinabagsak siya
  rationale: Ang נכה ay ‘humampas’ o ‘manakit.’ Ang ‘pinabagsak’ ay naglalarawan sa marahas na pag-atake habang hindi inuulit ang kasunod na tahasang ‘pinatay.’
- source_word: וַיְמִיתֵהוּ
  choice: at pinatay
  rationale: Ang Hiphil ng מות ay tuwirang nangangahulugang ‘pumatay’ o ‘maging sanhi ng kamatayan.’
- source_word: בִּשְׁנַת עֶשְׂרִים וָשֶׁבַע
  choice: nang ikadalawampu't pitong taon ng paghahari
  rationale: Natural na Filipino ang ganitong pormula para sa pagtukoy ng taon batay sa paghahari ng isang hari.
- source_word: לְאָסָא מֶלֶךְ יְהוּדָה
  choice: ni Asa na hari ng Juda
  rationale: Ipinakikita ng ל ang paghahari ni Asa bilang batayan ng petsa; malinaw at marangal ang anyong Filipino.
- source_word: וַיִּמְלֹךְ
  choice: At naghari si Zimri
  rationale: Ang מלך ay maaaring ‘maghari’ o ‘maging hari.’ Pinanatili ng ‘naghari’ ang payak na pandiwa ng Hebreo; inulit ang pangalang Zimri upang maiwasan ang malabong reperensiya ng panghalip sa Filipino.
- source_word: תַּחְתָּיו
  choice: bilang kahalili niya
  rationale: Sa konteksto ng paghalili sa trono, ang תחתיו ay nangangahulugang ‘sa lugar niya’ o ‘bilang kahalili niya.’ Ang napiling anyo ay natural at malinaw sa modernong Filipino.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na natural, dignificado, at madaling maunawaan. Hinati sa maiikling pangungusap ang mahabang Hebreong pagkakasunod-sunod upang luminaw ang petsa at paghalili sa trono, nang hindi dinaragdagan ang nilalaman.
