base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/023.yaml
  text: In the thirty-first year of Asa king of Judah[a], Omri became king over Israel for twelve years; he reigned in Tirzah six years.
translation:
  language: tl
  text: Sa ikatatlumpu’t isang taon ng paghahari ni Asa, na hari ng Juda, naging hari si Omri sa Israel at naghari nang labindalawang taon.[a] Sa Tirza siya naghari nang anim na taon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa mas literal na ayos: “Naghari si Omri sa Israel nang labindalawang taon; sa Tirza siya naghari nang anim na taon.” Ibinubukod ng talata ang kabuuang labindalawang taon ng kanyang paghahari sa anim na taon na naghari siya sa Tirza.'
    reason: Nililinaw ang ugnayan ng kabuuang labindalawang taong paghahari at ng anim na taong paghahari sa Tirza, nang hindi nagdaragdag ng ideyang wala sa teksto.
lexical_decisions:
- source_word: בִּ/שְׁנַת שְׁלֹשִׁים וְ/אַחַת שָׁנָה
  choice: Nang ikatatlumpu’t isang taon
  rationale: Likas na salin ito ng pormulang Hebreo sa pagtukoy sa taon ng paghahari.
- source_word: לְ/אָסָא מֶלֶךְ יְהוּדָה
  choice: ng paghahari ni Asa na hari ng Juda
  rationale: Ipinahihiwatig ng לְ ang taon ng paghahari na kaugnay kay Asa; nilinaw ang ipinapahiwatig na ‘paghahari’ upang maging natural sa Tagalog.
- source_word: מָלַךְ עַל יִשְׂרָאֵל
  choice: naging hari si Omri sa Israel
  rationale: Sa pormulang ito ng pagsisimula ng paghahari, ang unang מָלַךְ ay tumutukoy sa pagluklok o pagiging hari ni Omri; natural sa Tagalog ang ‘naging hari … sa Israel.’
- source_word: שְׁתֵּים עֶשְׂרֵה שָׁנָה
  choice: naghari nang labindalawang taon
  rationale: Malinaw nitong ipinapahayag ang kabuuang tagal ng paghahari ni Omri.
- source_word: בְּ/תִרְצָה מָלַךְ שֵׁשׁ שָׁנִים
  choice: Sa Tirza siya naghari nang anim na taon
  rationale: Pinananatili ang diin ng Hebreo sa Tirza bilang lugar kung saan ginugol ang anim na taon ng kabuuang paghahari.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “naghari nang … taon” ayon sa wastong gamit ng “nang” para sa tagal, at pinanatili ang tradisyonal na baybay na Juda at Tirza.
