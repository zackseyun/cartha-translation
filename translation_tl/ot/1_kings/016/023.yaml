revisions:
- from: Nang ikatatlumpu’t isang taon ng paghahari ni Asa na hari ng Juda, naging hari si Omri sa Israel at naghari nang labindalawang taon.[a] Sa Tirza siya naghari nang anim na taon.
  to: Sa ikatatlumpu’t isang taon ng paghahari ni Asa, na hari ng Juda, naging hari si Omri sa Israel at naghari nang labindalawang taon.[a] Sa Tirza siya naghari nang anim na taon.
  rationale: Inayos ang pambungad upang maging likas na pormula ng petsang pangpaghahari sa Filipino, at ginawang payak na panlunan ang paliwanag sa talababa upang manatili sa saklaw ng Hebreo. Hindi binago ang kahulugan, mga pangalan, o ang pagkakaiba ng kabuuang paghahari at ng panahong nasa Tirza.
