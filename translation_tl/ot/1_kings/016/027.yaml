translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “mga Kasaysayan” bilang malinaw na katawagan sa taunang talaan, habang ipinaliliwanag sa talababa na hindi ito ang kanonikal na Mga Cronica.
