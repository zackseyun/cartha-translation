  source_fidelity: 'Tapat ang salin sa pormulang Hebreo: ang “iba pang mga ginawa” ay wastong pagsasalin ng יֶתֶר דִּבְרֵי at kasama na rito ang kaugnay na “na ginawa niya”; ang “lakas na ipinamalas” ay pinananatili ang sinadyang lawak ng גְּבוּרָה at ang kasunod na sugnay. Napanatili rin ang retorikal na tanong at ang reperensiya sa talaang panghari.'
