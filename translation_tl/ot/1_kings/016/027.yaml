  text: וְ/יֶ֨תֶר דִּבְרֵ֤י עָמְרִי֙ אֲשֶׁ֣ר עָשָׂ֔ה וּ/גְבוּרָת֖/וֹ אֲשֶׁ֣ר עָשָׂ֑ה הֲ/לֹֽא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/027.yaml
  text: The rest of the acts of Omri[a], what he did[b], and his might that he showed—are they not written in the Book of the Chronicles of the Kings of Israel?
translation:
  language: tl
  text: Ang iba pang mga ginawa ni Omri at ang kanyang lakas na ipinamalas[a]—hindi ba nakasulat ang mga iyon sa Aklat ng mga Kasaysayan ng mga Hari ng Israel?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “at ang kanyang makapangyarihang mga gawa.” Ang salitang Hebreo ay maaaring tumukoy sa lakas o kapangyarihan, o sa mga gawang nagpapamalas nito.
    reason: lexical_alternative
  - marker: b
    text: Ang “Aklat ng mga Kasaysayan ng mga Hari ng Israel” ay isang talaang maharlika, hindi ang biblikal na aklat ng Mga Cronica.
    reason: cultural_note
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי עָמְרִי אֲשֶׁר עָשָׂה
  choice: Ang iba pang mga ginawa ni Omri
  rationale: Sa karaniwang buod tungkol sa paghahari, ang דִּבְרֵי ay tumutukoy sa mga gawa o pangyayari sa pamumuno, hindi lamang sa mga salita. Likas sa modernong Tagalog ang “iba pang mga ginawa” at naipapaloob dito ang sugnay na אֲשֶׁר עָשָׂה.
- source_word: וּגְבוּרָתוֹ אֲשֶׁר עָשָׂה
  choice: at ang kanyang lakas na ipinamalas
  rationale: Maaaring tumukoy ang גְּבוּרָה sa lakas o kapangyarihan, gayundin sa mga gawang nagpapakita nito. Pinananatili ng “lakas na ipinamalas” ang abstraktong pangngalan at ang kasunod na sugnay nang hindi inaalis ang likas na kalabuan.
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: hindi ba nakasulat ang mga iyon
  rationale: Pinananatili nito ang retorikal na tanong na umaasang sasang-ayon ang mambabasa.
- source_word: עַל סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יִשְׂרָאֵל
  choice: sa Aklat ng mga Kasaysayan ng mga Hari ng Israel
  rationale: Ang parirala ay pamagat ng mga talaang maharlika hinggil sa mga hari ng Israel. Ang “sa Aklat” ay natural na Tagalog para sa bagay na nakasulat sa isang aklat o talaan.
