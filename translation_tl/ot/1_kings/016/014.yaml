  text: וְ/יֶ֛תֶר דִּבְרֵ֥י אֵלָ֖ה וְ/כָל אֲשֶׁ֣ר עָשָׂ֑ה הֲ/לֽוֹא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יִשְׂרָאֵֽל־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/014.yaml
  text: The rest of the acts of Elah[a], and all that he did—are they not written in the Book of the Chronicles of the Kings of Israel?
translation:
  language: tl
  text: Ang iba pang mga ginawa ni Ela at ang lahat ng kanyang ginawa—hindi ba nakasulat ang mga iyon sa Aklat ng mga Kasaysayan ng mga Hari ng Israel?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “mga talaan ng mga hari ng Israel.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר
  choice: Ang iba pang
  rationale: Ipinapahayag nito ang natitirang bahagi ng ulat; likas sa modernong Tagalog ang “iba pang” at hindi ito nagdaragdag ng tahasang panandang temporal.
- source_word: דִּבְרֵי
  choice: mga ginawa
  rationale: Bagaman maaaring mangahulugang “mga salita” o “mga bagay,” sa pormulang panghari na ito tumutukoy ito sa mga gawa o pangyayari sa paghahari.
- source_word: אֵלָה
  choice: Ela
  rationale: Karaniwang transliterasyon sa Filipino ng pangalang Hebreo.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: at ang lahat ng kanyang ginawa
  rationale: Tuwirang pinananatili ang malawak na kahulugan ng עשה at ang bahagyang pag-uulit ng pormulang Hebreo.
- source_word: הֲלוֹא
  choice: hindi ba
  rationale: Pinananatili ang retorikal na tanong na umaasang sasang-ayon ang mambabasa.
- source_word: הֵם כְּתוּבִים
  choice: nakasulat ang mga iyon
  rationale: Pinananatili ang pasibong diwa at malinaw na iniuugnay ang maramihang panghalip sa naunang mga ginawa.
- source_word: עַל סֵפֶר
  choice: sa Aklat
  rationale: Ang “sa” ang likas na Filipino para sa nilalamang nakatala sa isang dokumento; ang malaking titik ay nagpapakitang tiyak na sangguniang aklat ito.
- source_word: דִּבְרֵי הַיָּמִים
  choice: mga Kasaysayan
  rationale: Sa kontekstong ito, tumutukoy ang parirala sa opisyal na kronika o annalistikong tala; pamilyar at marangal ang “mga Kasaysayan.”
- source_word: לְמַלְכֵי יִשְׂרָאֵל
  choice: ng mga Hari ng Israel
  rationale: Ipinapakita ng “ng” ang ugnayan ng talaan sa mga hari ng Israel, gaya ng gamit ng לְ sa pamagat na ito.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Pinanatili ang pormulang pangkasaysayan at ang retorikal na tanong ng Hebreo, habang ginawang likas ang ayos ng pangungusap. Inilipat ang talababa sa dulo ng pamagat na tinutukoy nito.
