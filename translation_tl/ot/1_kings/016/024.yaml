base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/024.yaml
  text: He bought the hill of Samaria from Shemer for two talents of silver[a], built on the hill, and called the name of the city that he built Samaria, after the name of Shemer[b], the owner of the hill.
translation:
  language: tl
  text: Binili niya kay Semer ang burol ng Samaria sa halagang dalawang talento ng pilak.[a] Nagtayo siya sa burol, at pinangalanan niyang Samaria ang lungsod na itinayo niya, ayon sa pangalan ni Semer, ang may-ari ng burol.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “talento” ay isang malaking yunit ng timbang na ginagamit sa pagtimbang ng mahahalagang metal.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּקֶן
  choice: Binili niya
  rationale: Ang קנה sa kontekstong ito ay tumutukoy sa pagkuha ng lupain kapalit ng bayad; natural at tuwiran ang “binili” sa modernong Tagalog.
- source_word: הָהָר
  choice: ang burol
  rationale: Maaaring mangahulugang bundok o burol ang הַר; ang “burol” ang mas angkop at natural para sa mataas na lugar na pagtatayuan ng lungsod.
- source_word: שֹׁמְרוֹן
  choice: Samaria
  rationale: Ito ang nakaugaliang anyo ng pangalan ng lugar sa Filipino; sa talata, pangalan muna ito ng burol at pagkatapos ay ng lungsod.
- source_word: מֵאֵת שֶׁמֶר
  choice: kay Semer
  rationale: Tinutukoy ng parirala ang taong pinagbilan o pinagmulan ng ari-ariang binili; natural sa Tagalog ang “binili niya kay Semer.”
- source_word: בְּכִכְּרַיִם כָּסֶף
  choice: sa halagang dalawang talento ng pilak
  rationale: Ang dual na כִּכְּרַיִם ay “dalawang talento,” isang malaking yunit ng timbang; hindi ito siklo.
- source_word: וַיִּבֶן אֶת הָהָר
  choice: Nagtayo siya roon
  rationale: Literal na “itinayo niya ang burol,” ngunit ang diwa ay nagtayo siya sa burol. Iniiwasan ng “roon” ang di-natural na pahayag at hindi nito labis na tinutukoy kung ano ang mga itinayo.
- source_word: וַיִּקְרָא אֶת שֵׁם הָעִיר
  choice: ang lungsod ... ay pinangalanan niyang
  rationale: Natural na katumbas sa Tagalog ng Hebreong idyoma para sa pormal na pagbibigay ng pangalan.
- source_word: אֲשֶׁר בָּנָה
  choice: na itinayo niya
  rationale: Pinananatili ang tuwirang ugnayan ng sugnay sa lungsod at ang pagkakasunod-sunod ng salaysay.
- source_word: עַל שֵׁם
  choice: ayon sa pangalan ni
  rationale: Malapit nitong pinananatili ang tahasang ideya na ang pangalan ng lungsod ay ibinatay sa pangalan ni Semer.
- source_word: אֲדֹנֵי הָהָר
  choice: ang may-ari ng burol
  rationale: Ang אֲדֹנֵי dito ay tumutukoy sa pagmamay-ari ng lupa, hindi sa titulong maharlika o banal.
theological_decisions: []
translation_notes:
  register: 'Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “burol” sa halip na “bundok,” “lungsod” para sa עִיר, at “may-ari” upang malinaw ang kahulugang pang-ari-arian. Inayos ang mali ang pagkakatapat ng mga footnote sa English consultation layer: ang tala tungkol sa dalawang talento ang siyang inilakip sa presyo; hindi kinailangan ang iminungkahing lexical alternative sapagkat iyon na ang diwa ng pangunahing salin.'
