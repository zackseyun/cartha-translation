base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/004.yaml
  text: Whoever belonging to Baasha dies in the city[a], the dogs will eat; and whoever belonging to him dies in the field[b], the birds of the heavens will eat.
translation:
  language: tl
  text: Ang sinumang kabilang kay Baasa na mamatay sa lungsod[a] ay kakainin ng mga aso; at ang sinumang kabilang sa kanya na mamatay sa parang[b] ay kakainin ng mga ibon sa himpapawid.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kay Baasa” o “pag-aari ni Baasa.” Gumagamit ang Hebreo ng panandang kaugnayan na tumutukoy sa mga kabilang kay Baasa, malamang sa kanyang sambahayan o dinastiya.
    reason: lexical_alternative
  - marker: b
    text: O “sa bukid” o “sa lantad na lupain.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמֵּת
  choice: ang sinumang ... na mamatay
  rationale: Ang pang-isahang participle ay ginagamit sa pangkalahatang diwa para sa sinumang kabilang sa sambahayan o angkan ni Baasa; natural sa Filipino ang konstruksiyong “ang sinumang ... na mamatay.”
- source_word: לְבַעְשָׁא
  choice: kabilang kay Baasa
  rationale: Ang lamed ay nagpapahayag ng kaugnayan o pag-aari. Iniiwasan nitong tahasang tukuyin ang “sambahayan” o “dinastiya,” na ipinahihiwatig ngunit hindi binabanggit sa Hebreo.
- source_word: בָּעִיר
  choice: sa lungsod
  rationale: Tuwirang lokatibong salin na nagpapanatili sa kaibahan ng lungsod at parang.
- source_word: יֹאכְלוּ הַכְּלָבִים
  choice: kakainin ng mga aso
  rationale: Pinananatili ang karaniwang kahulugan ng אָכַל na “kumain.” Ang balintiyak na ayos ay mas natural sa Filipino at malinaw na ang namatay ang kakainin.
- source_word: וְהַמֵּת לוֹ
  choice: at ang sinumang kabilang sa kanya na mamatay
  rationale: Pinananatili ang paglipat mula sa pangalang Baasa tungo sa panghalip na tumutukoy pa rin sa kanya, pati ang paralelismo ng dalawang sugnay.
- source_word: בַּשָּׂדֶה
  choice: sa parang
  rationale: Ang שׂדה ay maaaring tumukoy sa bukid o lantad na lupain. Ang “parang” ay natural na nagpapakita ng kaibahan sa lungsod nang hindi nagmumungkahing sinasakang bukid lamang.
- source_word: עוֹף הַשָּׁמָיִם
  choice: mga ibon sa langit
  rationale: Natural at dignified na katumbas sa Filipino ng kolektibong עוֹף at ng Hebreong pariralang “mga ibon ng kalangitan.”
