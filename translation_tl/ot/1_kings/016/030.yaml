  text: וַ/יַּ֨עַשׂ אַחְאָ֧ב בֶּן עָמְרִ֛י הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה מִ/כֹּ֖ל אֲשֶׁ֥ר לְ/פָנָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/030.yaml
  text: Ahab son of Omri did what was evil in the sight of Yahweh[b][a], more than all who were before him.
translation:
  language: tl
  text: Gumawa si Ahab, anak ni Omri, ng masama sa paningin ni Yahweh, higit kaysa sa lahat ng nauna sa kanya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ ... הָרַע
  choice: ginawa ... ang masama
  rationale: Pinananatili nito ang karaniwang Hebreong parirala na עשה הרע, at likas at malinaw ito sa modernong Tagalog.
- source_word: בְּעֵינֵי יְהוָה
  choice: sa paningin ni Yahweh
  rationale: Ang “sa paningin” ay natural na katumbas ng Hebreong idyoma at nagpapahayag ng paghatol ayon sa pananaw ni Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasatitik nito ang personal na pangalang banal na tahasang nasa tekstong Hebreo, sa halip na palitan iyon ng isang titulo.
- source_word: מִכֹּל אֲשֶׁר לְפָנָיו
  choice: higit kaysa sa lahat ng nauna sa kanya
  rationale: Ipinahahayag ng pahambing na מִן na nalampasan ni Ahab sa paggawa ng masama ang lahat ng nauna sa kanya, nang hindi tahasang idinaragdag ang salitang “hari,” na wala sa talata.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Ginagamit ng Hebreong teksto ang Tetragrammaton bilang personal na pangalan. Pinananatili ng “Yahweh” ang pangalang iyon at hindi ito ginagawang titulo.
translation_notes:
  register: Modernong Filipino Tagalog na simple, marangal, at madaling maunawaan. Pinanatili ang Hebreong idyomang “sa paningin” at ang pangkalahatang “lahat ng nauna sa kanya” upang hindi magdagdag ng tahasang pantukoy na wala sa talata.
