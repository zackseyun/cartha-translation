  terminology: Ang mga pangalang “Baasa,” “Tirza,” at “Ela” ay pare-pareho at katanggap-tanggap na anyong Filipino. Ang “mga ninuno” ay maayos na semantikong katumbas ng Hebreong “mga ama” sa ganitong nakaugaliang pormula, at ang talababa ay sapat na nagtatala ng literal na pananalita.
