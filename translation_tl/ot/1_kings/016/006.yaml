  source_fidelity: 'Tumpak na naihahatid ng salin ang sunod-sunod na pormulang Hebreo: ang pagpanaw ni Baasa, ang paglilibing sa Tirza, at ang paghalili ng anak niyang si Ela. Ang “nahimlay ... kasama ng kanyang mga ninuno” ay isang angkop na modernong Filipino na katumbas ng pormalang “slept with his fathers,” at nililinaw ng talababa ang literal na anyo nang hindi ipinipilit na literal na pagtulog ang tinutukoy.'
