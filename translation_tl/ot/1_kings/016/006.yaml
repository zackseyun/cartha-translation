  text: וַ/יִּשְׁכַּ֤ב בַּעְשָׁא֙ עִם אֲבֹתָ֔י/ו וַ/יִּקָּבֵ֖ר בְּ/תִרְצָ֑ה וַ/יִּמְלֹ֛ךְ אֵלָ֥ה בְנ֖/וֹ תַּחְתָּֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/006.yaml
  text: Baasha slept with his fathers and was buried in Tirzah[a], and Elah his son reigned in his place.
translation:
  language: tl
  text: Nahimlay si Baasa kasama ng kanyang mga ninuno[a] at inilibing siya sa Tirza. Ang anak niyang si Ela ang naghari bilang kahalili niya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal, “natulog kasama ng kanyang mga ama.” Isa itong nakaugaliang pahayag sa Hebreo para sa pagkamatay ng isang hari.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: nahimlay
  rationale: Literal na “natulog,” ngunit sa pormulang ito ng pagkamatay ng isang hari, ang “nahimlay” ay natural at marangal sa Filipino habang pinananatili ang larawan ng pamamahinga.
- source_word: עִם אֲבֹתָיו
  choice: kasama ng kanyang mga ninuno
  rationale: Ang אֲבֹתָיו ay literal na “kanyang mga ama,” ngunit ang “mga ninuno” ang malinaw at likas na katumbas sa modernong Filipino sa pormulang tumutukoy sa mga naunang salinlahi.
- source_word: וַיִּקָּבֵר
  choice: inilibing siya
  rationale: Malinaw at natural na Filipino para sa pasibong anyong Hebreo na nangangahulugang siya ay inilibing.
- source_word: בְּתִרְצָה
  choice: sa Tirza
  rationale: Karaniwang gamit sa Filipino ang “sa” para sa lokasyon sa loob o sa isang lungsod; ang pangalan ng lugar ay tinumbasan bilang Tirza.
- source_word: וַיִּמְלֹךְ
  choice: naghari
  rationale: Pinananatili nito ang maikli at nakaugaliang pormula tungkol sa paghahari sa mga ulat ng paghalili ng hari.
- source_word: אֵלָה בְנוֹ
  choice: ang anak niyang si Ela
  rationale: Natural na ayos sa Filipino na malinaw na nagpapakilala kay Ela bilang anak ni Baasa.
- source_word: תַּחְתָּיו
  choice: bilang kahalili niya
  rationale: Sa konteksto ng paghalili sa trono, malinaw nitong ipinahahayag na pumalit si Ela kay Baasa, hindi lamang na naghari siya pagkaraan nito.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “nahimlay” upang mapanatili ang larawang nasa idyomang Hebreo nang hindi nagiging alanganin ang literal na “natulog”; ipinaliwanag sa talababa ang eksaktong anyo ng pahayag.
