id: 1KI.16.13
reference: 1 Kings 16:13
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: אֶ֚ל כָּל חַטֹּ֣אות בַּעְשָׁ֔א וְ/חַטֹּ֖אות אֵלָ֣ה בְנ֑/וֹ אֲשֶׁ֣ר חָטְא֗וּ וַ/אֲשֶׁ֤ר הֶחֱטִ֨יאוּ֙ אֶת יִשְׂרָאֵ֔ל לְ/הַכְעִ֗יס אֶת יְהוָ֛ה אֱלֹהֵ֥י יִשְׂרָאֵ֖ל בְּ/הַבְלֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/013.yaml
  text: because of all the sins of Baasha and the sins of Elah his son[a], which they committed and by which they caused Israel to sin, provoking Yahweh, the God of Israel, with their idols.
translation:
  language: tl
  text: dahil sa lahat ng kasalanan ni Baasa at sa mga kasalanan ng anak niyang si Ela, na ginawa nila at naging dahilan upang magkasala ang Israel. Ginalit nila si Yahweh, ang Diyos ng Israel, sa pamamagitan ng kanilang mga diyos-diyosan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “sa pamamagitan ng kanilang mga bagay na walang kabuluhan.” Ang salitang Hebreo ay nangangahulugang “singaw” o “hininga” at karaniwang ginagamit bilang mapanuyang tawag sa mga diyos-diyosan.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶל
  choice: dahil sa
  rationale: Sa pormulang ito ng paghatol, ipinakikilala ng אֶל ang sanhi o batayan ng naunang hatol; likas itong ipinahahayag sa Filipino bilang “dahil sa.”
- source_word: כָּל חַטֹּאות
  choice: lahat ng kasalanan
  rationale: Tuwirang pinananatili ang maramihang “mga kasalanan” at ang kabuuang saklaw ng כָּל.
- source_word: בַּעְשָׁא
  choice: Baasa
  rationale: Karaniwang transliterasyon sa Filipino ng pangalang Hebreo.
- source_word: וְחַטֹּאות אֵלָה בְנוֹ
  choice: at sa mga kasalanan ng anak niyang si Ela
  rationale: Malinaw at natural na ipinahahayag ang ugnayang ama-anak habang pinananatili ang hiwalay na pagbanggit sa mga kasalanan ni Ela.
- source_word: אֲשֶׁר חָטְאוּ
  choice: na ginawa nila
  rationale: Ang panghalip na “na” ay tumutukoy sa mga kasalanang naunang binanggit; idiomatiko sa Filipino ang “ginawa” kaugnay ng kasalanan.
- source_word: וַאֲשֶׁר הֶחֱטִיאוּ אֶת יִשְׂרָאֵל
  choice: at naging dahilan upang magkasala ang Israel
  rationale: Pinananatili ang causative na anyo ng חטא nang hindi labis na tinutukoy kung pamimilit, pag-uudyok, o halimbawang masama ang paraan.
- source_word: לְהַכְעִיס
  choice: Ginalit nila
  rationale: Ipinahahayag ang bunga o layunin ng kanilang mga gawa sa isang malinaw na sugnay sa Filipino. Hindi nito ipinahihiwatig na pabigla-bigla ang galit ng Diyos, kundi na pinukaw nila ito sa kanilang kasalanan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin bilang personal na pangalan ng Diyos, hindi pinapalitan ng titulong “PANGINOON.”
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ang Diyos ng Israel
  rationale: Karaniwang salin ng pariralang construct na kumikilala sa Diyos na kanilang ginalit.
- source_word: בְּהַבְלֵיהֶם
  choice: sa pamamagitan ng kanilang mga diyus-diyosan
  rationale: Ang הֶבֶל ay literal na “singaw” at metaporikal na “walang kabuluhan”; sa kontekstong ito, polemikal itong tumutukoy sa mga diyus-diyosan. Nililinaw ng pangunahing teksto ang tinutukoy, habang nasa talababa ang literal na larawan.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; ang PANGINOON
  rationale: Tahasang ginagamit ng tekstong Hebreo ang Tetragrammaton. Pinananatili ng “Yahweh” ang katangian nito bilang personal na pangalan sa halip na palitan ito ng isang titulo.
- issue: Kahulugan ng בְּהַבְלֵיהֶם sa konteksto ng idolatriya
  choice: kanilang mga diyus-diyosan
  alternative: kanilang mga bagay na walang kabuluhan
  rationale: Ang salita ay sadyang mapanuyang paglalarawan sa mga diyus-diyosan bilang hungkag at walang halaga. Nililinaw sa teksto ang reperente ngunit pinananatili sa talababa ang literal at polemikal na kahulugan.
translation_notes:
  register: Makabagong, dignified, at madaling maunawaang Filipino. Hinati sa dalawang pangungusap upang maiwasan ang mabigat at malabong pagkakabit ng mga sugnay, ngunit pinanatili ang ugnayang sanhi at bunga. Inilipat ang pananda ng talababa sa “mga diyus-diyosan,” na siyang salitang ipinaliliwanag nito.
