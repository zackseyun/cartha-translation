base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/032.yaml
  text: He set up an altar for Baal in the house of Baal[a], which he had built in Samaria.
translation:
  language: tl
  text: Nagtayo siya ng isang altar para kay Baal sa bahay ni Baal[a] na itinayo niya sa Samaria.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “templo ni Baal.” Sa literal na Hebreo, “bahay ni Baal.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֶם
  choice: Nagtayo siya
  rationale: Ang Hiphil wayyiqtol ng קום ay nangangahulugang magpatayo o magtatag. Likas sa Filipino ang “nagtayo” para sa pagtatayo o paglalagay ng altar.
- source_word: מִזְבֵּחַ
  choice: isang altar
  rationale: Karaniwang salin ng מזבח at malinaw na tumutukoy sa altar na ginagamit sa paghahandog.
- source_word: לַבָּעַל
  choice: para kay Baal
  rationale: Ipinapakita ng ל ang pag-aalay o pagtatalaga; natural sa Filipino ang “para kay Baal” para sa altar na nakatalaga sa kaniya.
- source_word: בֵּית הַבַּעַל
  choice: bahay ni Baal
  rationale: Pinananatili nito ang literal na larawang Hebreo na “bahay ni Baal,” habang nililinaw sa talababa na templo ang tinutukoy.
- source_word: אֲשֶׁר בָּנָה
  choice: na itinayo niya
  rationale: Ang sugnay na ito ay tumutukoy sa bahay ni Baal. Hindi kailangang tahasang markahan ang past perfect sa Filipino; malinaw sa konteksto na nauna ang pagtatayo ng gusali.
- source_word: בְּשֹׁמְרוֹן
  choice: sa Samaria
  rationale: Karaniwang anyo ng pangalang-lugar na שֹׁמְרוֹן, at lokasyon ang ipinahihiwatig ng ב.
theological_decisions:
- issue: Pagkasalin sa בֵּית הַבַּעַל
  choice: bahay ni Baal
  alternative: templo ni Baal
  rationale: Pinananatili ng “bahay ni Baal” ang pormal na larawan at leksikal na ugnayan ng Hebreo. Dahil maaaring unang maunawaan ito bilang ordinaryong bahay sa modernong Filipino, ibinigay sa talababa ang mas tahasang alternatibong “templo ni Baal.”
translation_notes:
  register: Modernong Filipino na natural ngunit marangal. Ginamit ang “kay” sa personal na pangalang Baal at pinanatili ang konkretong ekspresyong “bahay ni Baal,” na may talababa upang maiwasan ang kalituhan.
