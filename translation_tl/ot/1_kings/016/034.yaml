reference: 1 Kings 16:34
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: בְּ/יָמָ֞י/ו בָּנָ֥ה חִיאֵ֛ל בֵּ֥ית הָאֱלִ֖י אֶת יְרִיחֹ֑ה בַּ/אֲבִירָ֨ם בְּכֹר֜/וֹ יִסְּדָ֗/הּ ו/ב/שגיב צְעִיר/וֹ֙ הִצִּ֣יב דְּלָתֶ֔י/הָ כִּ/דְבַ֣ר יְהוָ֔ה אֲשֶׁ֣ר דִּבֶּ֔ר בְּ/יַ֖ד יְהוֹשֻׁ֥עַ בִּן נֽוּן־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/034.yaml
  text: In his days Hiel of Bethel rebuilt Jericho[a]. At the cost of Abiram his firstborn he laid its foundation, and at the cost of Segub his youngest he set up its gates[b], according to the word of Yahweh that he had spoken through Joshua son of Nun.
translation:
  language: tl
  text: Noong panahon niya, muling itinayo ni Hiel na taga-Bethel ang Jerico[a]. Sa halaga ng buhay ng panganay niyang si Abiram ay inilagay niya ang pundasyon nito, at sa halaga ng buhay ng bunso niyang si Segub ay itinayo niya ang mga pintuang-bayan nito[b], ayon sa salita ni Yahweh na sinalita niya sa pamamagitan ni Josue na anak ni Nun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “itinayo ang Jerico.” Ipinahihiwatig ng “muling itinayo” na nawasak na noon ang lungsod.'
    reason: lexical_alternative
  - marker: b
    text: 'Literal na Hebreo: “sa Abiram na panganay niya ... at sa Segub na bunso niya.” Maaari rin itong unawaing “kasama ni Abiram ... at kasama ni Segub.” Ipinahihiwatig ng konteksto at ng Josue 6:26 na namatay ang mga anak niya bilang katuparan ng sumpa.'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּיָמָיו
  choice: Noong panahon niya
  rationale: Likas na temporal na pananalita sa modernong Tagalog; tumutukoy sa panahon ng paghahari ng naunang binanggit na hari nang hindi iyon tahasang idinaragdag.
- source_word: בָּנָה
  choice: muling itinayo
  rationale: Ang pandiwa ay literal na 'itinayo,' ngunit dati nang nawasak ang Jerico; ipinahahayag ng 'muling itinayo' ang kontekstuwal na diwa, habang itinatala sa talababa ang mas literal na anyo.
- source_word: חִיאֵל בֵּית הָאֱלִי
  choice: Hiel na taga-Bethel
  rationale: Ang gentilic ay malinaw at natural na naipahahayag sa Tagalog bilang pinagmulan o kaugnayan sa Bethel.
- source_word: בַּאֲבִירָם בְּכֹרוֹ
  choice: Sa halaga ng buhay ni Abiram, ang panganay niya
  rationale: Ipinahihiwatig ng ב sa pormula ng katuparan ng sumpa ang kapalit na pagkawala ng anak. Idinagdag ang 'buhay' upang maging malinaw at natural sa Tagalog, ngunit pinananatili sa talababa ang literal na kalabuan.
- source_word: יִסְּדָהּ
  choice: inilagay niya ang pundasyon nito
  rationale: Tumpak na inilalarawan ang pagsisimula ng pagtatayo ng lungsod at likas sa Tagalog.
- source_word: וּבִשְׂגוּב צְעִירוֹ
  choice: at sa halaga ng buhay ni Segub, ang bunso niya
  rationale: Kaagapay ng naunang parirala; sa konteksto ng pagkakasunod-sunod ng mga anak, ang צעיר ay 'bunso.'
- source_word: הִצִּיב דְּלָתֶיהָ
  choice: itinayo niya ang mga pintuang-bayan nito
  rationale: Sa konteksto ng lungsod, ang דְּלָתוֹת ay mga pintuang-bayan, hindi karaniwang mga pinto ng bahay.
- source_word: כִּדְבַר יְהוָה
  choice: ayon sa salita ni Yahweh
  rationale: Pinananatili ang pormulang tumutukoy sa katuparan ng ipinahayag na salita at tahasang inililipat ang banal na pangalan.
- source_word: אֲשֶׁר דִּבֶּר בְּיַד
  choice: na sinabi niya sa pamamagitan ni
  rationale: Ang בְּיַד ay idyomang nagsasaad ng ahensiya; natural itong isalin bilang 'sa pamamagitan ni.'
- source_word: יְהוֹשֻׁעַ בִּן נוּן
  choice: Josue na anak ni Nun
  rationale: Ginagamit ang kinikilalang modernong anyong Tagalog ng pangalan at malinaw na patronymic.
theological_decisions:
- issue: Ang likas na kaugnayan ng pagtatayo sa sinapit ng mga anak ni Hiel
  choice: Ang pagtatayo ay naganap sa halaga ng buhay ng panganay at bunsong anak ni Hiel, bilang katuparan ng salita ni Yahweh.
  alternative: Maaaring isalin nang mas literal na 'kay/kasama ni Abiram ... at kay/kasama ni Segub,' na hindi tahasang nagsasabing namatay sila.
  rationale: Ang pananalita ay malinaw na umaalingawngaw sa Josue 6:26 at pinakamalamang na nagsasaad ng kamatayan ng mga anak. Gayunman, dahil hindi tahasang ginagamit sa Hebreo ang salitang 'buhay' o 'namatay,' inilalahad sa talababa ang literal na anyo at ang taglay nitong kalabuan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang 'pintuang-bayan' upang maiwasang mapagkamalang karaniwang pinto, at ang 'sa halaga ng buhay' upang maipahayag ang malamang na diwa ng pormula nang may talababa para sa literal na kalabuan.
