  verdict: revise
  source_fidelity: Ang pangunahing diwa ay tapat sa Hebreo at wastong naipapakita ang pahiwatig ng katuparan ng sumpa sa Josue 6:26. Gayunman, ang pangwakas na “Nangyari ito” ay isang dagdag na pangungusap na wala sa teksto; mas tapat at mas tuwiran ang iugnay ang pariralang “ayon sa salita ni Yahweh” sa buong pangyayari. Ang “sa halaga ng buhay” ay katanggap-tanggap na pagpapahayag ng pinakalamang na diwa, kung may talababa na nag-iingat sa mas literal na kalabuan.
  naturalness: Moderno at marangal ang register. Mas natural ang magkatulad na ayos na “ng panganay niyang si Abiram” at “ng bunso niyang si Segub,” at mas malinaw ang tuwirang pangwakas na sugnay kaysa sa “Nangyari ito.”
  terminology: Ang Hiel, Bethel, Jerico, Abiram, Segub, Yahweh, Josue, at Nun ay pare-pareho at angkop. Ang “mga pintuang-bayan” ay angkop para sa mga tarangkahan ng isang lungsod. Pinananatili ang “muling itinayo,” na may talababa para sa literal na “itinayo.”
