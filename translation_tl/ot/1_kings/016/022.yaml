base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/022.yaml
  text: But the people who followed Omri prevailed over the people who followed Tibni son of Ginath. So Tibni died[a], and Omri became king.
translation:
  language: tl
  text: Ngunit nanaig[a] ang mga taong pumanig kay Omri laban sa mga taong pumanig kay Tibni na anak ni Ginat. At namatay si Tibni, at naging hari si Omri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “naging mas malakas kaysa” o “lalong lumakas laban sa.” Ang pandiwang Hebreo ay maaaring tumukoy sa lakas o pagiging nakahihigit; dito, ipinahihiwatig nitong nakalamang ang pangkat ni Omri sa tunggaliang sibil.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּחֱזַק
  choice: nanaig
  rationale: Sa konstruksyong may אֶת, ipinahihiwatig ng חזק na nalampasan o nagapi ng isang pangkat ang kalabang pangkat. Ang “nanaig” ay natural sa Filipino at angkop sa tunggaliang pampolitika sa konteksto.
- source_word: הָעָם אֲשֶׁר אַחֲרֵי עָמְרִי
  choice: ang mga taong pumanig kay Omri
  rationale: Bagaman literal na “nasa likod ni Omri,” ang אַחֲרֵי rito ay tumutukoy sa pagsunod o pagsuporta sa isang pinuno. Malinaw na ipinahahayag ng “pumanig kay” ang katapatan ng pangkat.
- source_word: אֶת הָעָם אֲשֶׁר אַחֲרֵי תִּבְנִי
  choice: laban sa mga taong pumanig kay Tibni
  rationale: Ang אֶת bilang pananda ng layon kasunod ng חזק ay tumutukoy sa pangkat na dinaig. Pinananatili ng “pumanig kay Tibni” ang paralelismo ng dalawang pangkat.
- source_word: תִּבְנִי בֶן גִּינַת
  choice: Tibni na anak ni Ginat
  rationale: Isinalin ang בֶן sa likas na pariralang Filipino na “anak ni,” at tinumbasan sa transliterasyon ang mga pangalang pantangi.
- source_word: וַיָּמָת תִּבְנִי
  choice: Kaya namatay si Tibni
  rationale: Isinusulong ng waw-consecutive ang salaysay. Ipinakikita ng “kaya” ang bunga sa daloy ng pangyayari nang hindi tinutukoy kung paano namatay si Tibni.
- source_word: וַיִּמְלֹךְ עָמְרִי
  choice: at naging hari si Omri
  rationale: Sa kontekstong kasunod ng pagkamatay ng karibal, ang מלך ay tumutukoy sa pagluklok ni Omri bilang hari, hindi lamang sa pagpapatuloy ng paghahari.
theological_decisions:
- issue: Ugnayan ng pagkamatay ni Tibni at pananagumpay ng pangkat ni Omri
  choice: Hindi tinukoy ang sanhi o paraan ng pagkamatay ni Tibni.
  alternative: Ipahiwatig na pinatay si Tibni sa labanan.
  rationale: Ang Hebreo ay nagsasabi lamang na namatay si Tibni; hindi nito tahasang sinasabing pinatay siya ng pangkat ni Omri. Pinananatili ng salin ang puwang na ito.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “pumanig kay” para sa pampolitikang katapatan at “nanaig” para sa pagkakaroon ng kalamangan sa tunggalian. Inilagay ang talababa kaagad pagkatapos ng salitang tinutukoy nito.
