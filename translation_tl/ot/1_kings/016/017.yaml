  yaml_path: translation/ot/1_kings/016/017.yaml
  text: Then Omri and all Israel with him went up from Gibbethon[a], and they laid siege to Tirzah.
translation:
  language: tl
  text: Pagkatapos, umakyat si Omri mula sa Gibeton, kasama ang buong Israel, at kinubkob nila ang Tirza.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲלֶה
  choice: umalis
  rationale: Ang pandiwang עלה ay literal na tumutukoy sa pag-akyat o pagpunta paitaas, ngunit sa salaysay na ito ay natural na ipinahahayag sa Filipino bilang pag-alis mula sa Gibeton. Hindi tinukoy ang topograpiya o paraan ng pagmamartsa.
- source_word: עָמְרִי
  choice: Omri
  rationale: Karaniwang anyong Filipino ng pangalang pantangi.
- source_word: וְכָל יִשְׂרָאֵל עִמּוֹ
  choice: kasama ang buong Israel
  rationale: Pinananatili ang kolektibong katawagang “Israel” at ang saklaw ng כָל, nang hindi tahasang nililimitahan ito sa hukbo bagaman iyon ang ipinahihiwatig ng konteksto.
- source_word: מִגִּבְּתוֹן
  choice: mula sa Gibeton
  rationale: Tuwirang isinasalin ang pang-ukol na מן bilang “mula sa” at ginagamit ang likas na transliterasyong Filipino ng pangalan ng lugar.
- source_word: וַיָּצֻרוּ
  choice: kinubkob nila
  rationale: Ang צור sa kontekstong militar ay nangangahulugang palibutan at salakayin ang isang lugar sa pamamagitan ng pagkubkob. Ang “kinubkob” ay maikli, natural, at tiyak sa modernong Filipino.
- source_word: עַל
  choice: ang
  rationale: Sa Filipino, ang puntirya ng pandiwang “kinubkob” ay tuwirang layon at minamarkahan ng “ang,” sa halip na tumbasan nang hiwalay ang Hebreong עַל.
- source_word: תִּרְצָה
  choice: Tirza
  rationale: Likas na transliterasyong Filipino ng pangalan ng lugar.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “buong Israel” upang mapanatili ang kolektibong pananalita ng Hebreo; sa konteksto, tumutukoy ito sa mga taong o puwersang kasama ni Omri. Walang footnote dahil walang mahalagang tekstuwal o semantikong alternatibong kailangang ilahad sa mambabasa.
