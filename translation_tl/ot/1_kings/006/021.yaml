base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/021.yaml
  text: Solomon overlaid the inside of the house with pure gold[a], and he drew gold chains across the front of the inner sanctuary[c][b], and overlaid it with gold.
translation:
  language: tl
  text: Tinakpan ni Solomon ng purong ginto[a] ang loob ng bahay. Ipinadaan niya ang mga tanikalang ginto sa harap ng pinakaloob na santuwaryo[b][c], at tinakpan niya iyon ng ginto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “dinalisay na ginto.” Literal sa Hebreo, “gintong sarado,” isang idyoma para sa mataas na uri ng ginto.
    reason: lexical_alternative
  - marker: b
    text: O “sa unahan ng pinakaloob na santuwaryo.” Maaaring inilalarawan ng Hebreo ang mga tanikalang ginto na inilagay sa harapan ng pinakaloob na santuwaryo; ang “ipinadaan” ay nagpapahiwatig ng posibleng pag-uunat o pagpapadaan patawid.
    reason: alternative_reading
  - marker: c
    text: Ang “pinakaloob na santuwaryo” ay ang debir, ang pinakaloob na silid ng templo, na nang maglaon ay tinawag na Kabanal-banalang Lugar.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְצַף
  choice: binalutan
  rationale: Sa konteksto ng pagtatayo ng templo, tumutukoy ang צפה sa pagtatakip sa isang ibabaw ng suson ng metal. Likas at malinaw sa Filipino ang “binalutan” para sa paglalagay ng ginto sa ibabaw.
- source_word: הַבַּיִת
  choice: ang bahay
  rationale: Literal na “bahay” ang Hebreo. Bagaman templo ang tinutukoy sa konteksto, pinananatili nito ang katawagan ng aklat para sa gusali.
- source_word: מִפְּנִימָה
  choice: ang loob ng
  rationale: Ipinahihiwatig ng anyong pang-abay ang panloob na bahagi ng bahay; tuwiran at natural ang “ang loob ng” sa modernong Filipino.
- source_word: זָהָב סָגוּר
  choice: purong ginto
  rationale: Ang idyoma ay tumutukoy sa mataas na uri o dinalisay na ginto. Malinaw ang “purong ginto,” habang inilalahad sa talababa ang posibleng “dinalisay na ginto.”
- source_word: וַיְעַבֵּר
  choice: iniunat
  rationale: Ang causative na anyo ng עבר ay literal na nagpaparaan o nagpapatawid. Kasama ng mga tanikala at ng lokasyon, ipinahihiwatig nito ang pag-uunat o pagpapadaan sa harapan.
- source_word: בְּרַתּוּקוֹת
  choice: ang mga tanikala
  rationale: Bihira ang pangngalan, ngunit ang “mga tanikala” ang pinakamatibay na kahulugang akma sa mga bagay na ginto sa harap ng pinakaloob na silid.
- source_word: לִפְנֵי הַדְּבִיר
  choice: sa harap ng pinakaloob na santuwaryo
  rationale: Ang לִפְנֵי ay “sa harap ng/bago sa,” at ang דְּבִיר ay ang pinakaloob na silid ng templo. Hindi idinagdag sa pangunahing teksto ang “patawid sa harapan” upang hindi labis na tukuyin ang ayos na hindi ganap na tahasang sinasabi.
- source_word: הַדְּבִיר
  choice: pinakaloob na santuwaryo
  rationale: Tumutukoy ito sa pinakaloob na silid ng templo. Naiintindihan ang “pinakaloob na santuwaryo” nang hindi agad ipinapalit ang mas huling teknikal na katawagang “Kabanal-banalang Lugar.”
- source_word: וַיְצַפֵּהוּ
  choice: binalutan niya iyon
  rationale: Pinananatili ng “iyon” ang panlalaking isahang hulapi ng Hebreo at ang tunay na kalabuan ng tinutukoy nito, sa halip na tahasang ipasiya kung ang pinakaloob na santuwaryo o ang kaugnay na bahagi sa harapan ang binalutan.
theological_decisions:
- issue: Pagkatawag sa דְּבִיר
  choice: pinakaloob na santuwaryo
  alternative: Kabanal-banalang Lugar
  rationale: Pinananatili ng piniling salin ang arkitektural na kahulugan sa talata at iniiwasang ipasok sa pangunahing teksto ang mas huling katawagan, habang ipinaliliwanag iyon sa talababa.
- issue: Tinutukoy ng hulapi sa וַיְצַפֵּהוּ
  choice: iyon
  alternative: ang pinakaloob na santuwaryo
  rationale: Malabo sa Hebreo ang tiyak na tinutukoy ng isahang hulapi. Ang “iyon” ay sadyang nagpapanatili sa kalabuan sa halip na lutasin ito nang walang katiyakan.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Pinanatili ang “bahay” bilang literal at kontekstuwal na katawagan sa templo. Ginamit ang “tanikalang ginto” sa halip na mas kolokyal na “kadena,” at pinanatili sa “iyon” ang kalabuan ng huling panghalip sa Hebreo.
