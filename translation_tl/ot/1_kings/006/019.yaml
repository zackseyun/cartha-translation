base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/019.yaml
  text: And he prepared the inner sanctuary within the house[a], to place there the ark of the covenant of Yahweh.
translation:
  language: tl
  text: Inihanda niya ang pinakaloob na santuwaryo sa loob ng bahay[a] upang ilagay roon ang kaban ng tipan ni Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: debir, na tradisyonal na isinasaling “orakulo”; dito, tumutukoy ito sa pinakaloob na santuwaryo, ang pinakaloob na silid ng templo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דְבִיר
  choice: pinakaloob na santuwaryo
  rationale: Sa konteksto ng templo, tumutukoy ito sa pinakaloob na silid, ang Dakong Kabanal-banalan. Malinaw at likas sa modernong Tagalog ang “pinakaloob na santuwaryo,” samantalang magiging malabo ang tradisyonal na literal na katumbas na “orakulo.”
- source_word: בְּתוֹךְ הַבַּיִת מִפְּנִימָה
  choice: sa loob ng bahay
  rationale: Pinananatili ng “bahay” ang mismong salitang בַּיִת, habang ipinahihiwatig na ng “pinakaloob” sa naunang parirala ang diin ng מִפְּנִימָה sa panloob na lokasyon.
- source_word: הֵכִין
  choice: Inihanda
  rationale: Ipinapahayag ng pandiwa ang paghahanda o pagsasaayos para sa isang tiyak na layunin, nang hindi dinaragdagan ng detalye tungkol sa paraan ng pagtatayo.
- source_word: לְתִתֵּן שָׁם
  choice: upang ilagay roon
  rationale: Malinaw na ipinapakita ng pawatas ang layunin; natural at marangal sa Tagalog ang “upang ilagay roon.”
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: ang kaban ng tipan ni Yahweh
  rationale: Natural na inililipat sa Tagalog ang ugnayang construct bilang “kaban ng tipan ni Yahweh,” habang pinananatili ang personal na banal na pangalan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang transliterasyon ng Tetragrammaton upang mapanatili ang personal na pangalan sa tekstong Hebreo sa halip na palitan ito ng isang titulo.
theological_decisions:
- issue: Pagpapahayag sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Tuwirang ginagamit sa talata ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalang Hebreo nang hindi ito pinapalitan ng titulong “PANGINOON.”
- issue: Kahulugan ng דְבִיר
  choice: pinakaloob na santuwaryo
  alternative: orakulo
  rationale: Sa kontekstong arkitektural ng templo, ang tinutukoy ay ang pinakaloob na silid. Hindi ipinahihiwatig ng salin na may bagong pahayag o orakulong ibinibigay rito.
translation_notes:
  register: Modernong Filipino Tagalog na may marangal na himig. Pinanatili ang “bahay” para sa בַּיִת dahil malinaw sa konteksto na templo ang tinutukoy; ginamit ang “santuwaryo” upang malinaw na maipahayag ang tungkulin ng pinakaloob na silid.
