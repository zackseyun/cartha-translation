base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/007.yaml
  text: The house[a], when it was built, was built of finished stone quarried in advance; and no hammer or axe or any iron tool was heard in the house while it was being built.
translation:
  language: tl
  text: Nang itinatayo ang bahay, mga batong yari na na inihanda bago dalhin[a] ang ginamit sa pagtatayo nito. Walang narinig na martilyo, palakol, o anumang kasangkapang bakal sa bahay habang itinatayo ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “mga batong inihanda sa tibagan.” Ang Hebreong מַסָּע ay isang di-karaniwang teknikal na salita na maaaring tumukoy sa tibagan o sa pagdadala ng mga batong naihanda na roon.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבַּיִת
  choice: ang bahay
  rationale: Pinananatili ang karaniwang kahulugan ng Hebreong salita at ang biblikal na katawagang “bahay” para sa templong itinatayo, nang hindi nagdaragdag ng salitang wala sa talata.
- source_word: בְּהִבָּנֹתוֹ
  choice: habang itinatayo
  rationale: Ang infinitive construct na may בְּ ay nagsasaad ng panahong kasabay ng pagtatayo. Ang “habang itinatayo” ay natural sa modernong Tagalog at angkop sa dalawang paglitaw nito.
- source_word: אֶבֶן שְׁלֵמָה
  choice: mga batong yari na
  rationale: Sa konteksto ng konstruksiyon, ipinahihiwatig ng שְׁלֵמָה na kumpleto o tapos na ang paghahanda sa mga bato. Ginawang maramihan sa Tagalog dahil kolektibo ang diwa ng isahang Hebreo.
- source_word: מַסָּע
  choice: bago pa dalhin doon
  rationale: Ang teknikal at bihirang termino ay maaaring tumukoy sa tibagan o sa pagdadala ng mga batong naihanda na. Ipinahahayag ng salin ang malinaw na praktikal na diwa—handa na ang mga bato bago makarating sa lugar—habang inilalagay sa talababa ang leksikal na alternatibo.
- source_word: נִבְנָה
  choice: ay binuo
  rationale: Ang Nifal perfect ay nagsasaad kung paano itinayo ang gusali. Ang “binuo” ay natural kasama ng mga batong dati nang inihanda at hindi nagpapahiwatig na hinugis ang mga ito sa mismong lugar.
- source_word: מַקָּבוֹת
  choice: martilyo
  rationale: Bagaman maramihan ang anyong Hebreo, nakalista rito ang mga uri ng kasangkapan; natural sa Tagalog ang isahang pangkalahatang katawagan.
- source_word: הַגַּרְזֶן
  choice: palakol
  rationale: Ito ang tuwiran at karaniwang katumbas. Posible ang isang mas espesipikong kasangkapang tulad ng daras, ngunit hindi sapat ang katiyakan upang paliitin ang kahulugan.
- source_word: כָּל כְּלִי בַרְזֶל
  choice: anumang kasangkapang bakal
  rationale: Ang “anumang” ay naghahatid ng distributibo at komprehensibong diwa ng כָּל, at ang parirala ay natural sa Tagalog.
- source_word: לֹא נִשְׁמַע
  choice: walang narinig
  rationale: Pinananatili nito ang pasibong diwa ng Nifal at likas na inilalapat ang pagtanggi sa buong talaan ng mga kasangkapan.
theological_decisions: []
translation_notes:
  register: Makabago at malinaw na Filipino na may marangal na himig. Pinanatili ang “bahay” sa halip na “templo” upang sundan ang mismong katawagang Hebreo at ang biblikal na idyomang “bahay” para sa santuwaryo. Iniwasan ang sobrang teknikal na bokabularyo sa pangunahing teksto; ang tunay na kalabuan ng מַסָּע ay pinanatili sa talababa.
