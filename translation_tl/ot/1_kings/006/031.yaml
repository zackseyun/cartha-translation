  text: For the entrance of the inner sanctuary he made doors of olivewood[a]; the doorposts and jambs were five-sided.
translation:
  language: tl
  text: Para sa pasukan ng pinakaloob na santuwaryo, gumawa siya ng mga pintong yari sa kahoy ng olibo; ang balangkas ng pinto at ang mga poste sa gilid ay may limang panig.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang balangkas at ang mga poste ng pinto ay ikalimang bahagi.” Tradisyonal ang saling ito, ngunit hindi malinaw ang tinutukoy nitong anyo o sukat sa arkitektura.
    reason: alternative_reading
lexical_decisions:
- source_word: פֶּתַח
  choice: pasukan
  rationale: Tumutukoy ito sa bukana o daanan papasok, hindi sa mismong mga pinto, na kasunod na binanggit.
- source_word: הַדְּבִיר
  choice: loob na santuwaryo
  rationale: Sa konteksto ng templo, ito ang pinakaloob na banal na silid. Malinaw ito sa makabagong Tagalog nang hindi nagpapasok ng mas tiyak na katawagang liturhikal.
- source_word: דַּלְתּוֹת
  choice: mga pinto
  rationale: Pinananatili ang pangmaramihang anyo, malamang na tumutukoy sa magkapares na mga panel ng pinto.
- source_word: עֲצֵי שָׁמֶן
  choice: kahoy ng olibo
  rationale: Ang literal na idyoma ay kahoy ng punong nagbibigay-langis; sa konteksto, natural itong tumutukoy sa olivewood.
- source_word: הָאַיִל
  choice: balangkas ng pinto
  rationale: Ang terminong pang-arkitektura ay maaaring tumukoy sa balangkas o pangunahing suportang bahagi ng bukana. Pinili ang mas malawak na 'balangkas' upang maiba sa kasunod na מְזוּזוֹת.
- source_word: מְזוּזוֹת
  choice: mga haligi sa gilid
  rationale: Tumutukoy sa mga patayong poste o jamb sa magkabilang gilid ng pintuan; ang salin ay malinaw sa karaniwang mambabasa.
- source_word: חֲמִשִׁית
  choice: may limang panig
  rationale: Napakaikli at eliptikal ng Hebreo. Malamang na inilalarawan nito ang hugis ng kayarian ng pintuan, ngunit dapat kilalanin sa talababa ang tradisyonal na alternatibong tumutukoy sa ikalimang bahagi.
