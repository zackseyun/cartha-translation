translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang ‘templo’ sa halip na literal na ‘bahay’ dahil iyon ang malinaw na tinutukoy sa konteksto. Hinati sa tatlong pangungusap ang mahabang Hebreong pangungusap para sa likas at malinaw na daloy.
