  source_fidelity: Kailangang panatilihin sa pangunahing salin ang pandiwang בנה (“itinayo/ginawa”) sa unang sugnay. Ang “Nilagyan niya” ay nagpapahiwatig lamang ng pagkakabit ng tabla at hindi sapat na naihahayag ang kilos na nasa Hebreo. Ang pagpapalinaw ng di-karaniwang “mga dingding ng kisame” bilang “kisame” sa teksto, na may talababa, ay katanggap-tanggap.
  naturalness: Malinaw at natural ang daloy sa makabagong Filipino. Ang “mga panloob na dingding” at “tablang sedro” ay mas tuwiran at mas maayos kaysa “loob ng mga dingding.”
  terminology: Wasto ang “templo,” “sedro,” at “sipres” sa kontekstong ito. Gayunman, ang tradisyonal na “fir” ay hindi “pino” kundi “abeto”; kailangang itama ang talababa upang hindi magbigay ng maling lexical equivalent.
