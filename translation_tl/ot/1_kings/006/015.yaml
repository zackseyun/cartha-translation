base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/015.yaml
  text: He built the walls of the house on the inside with cedar boards[a]; from the floor of the house to the walls of the ceiling he covered them with wood on the inside[b], and he overlaid the floor of the house with boards of cypress.
translation:
  language: tl
  text: Itinayo niya ang mga panloob na dingding ng templo gamit ang mga tablang sedro. Mula sa sahig ng templo hanggang sa kisame[a], binalutan niya ng kahoy ang loob. Tinakpan din niya ng mga tabla ng sipres[b] ang sahig ng templo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal na “hanggang sa mga dingding ng kisame.” Malamang na tumutukoy ito sa panloob na kisame o sa sapin ng bubong.
    reason: Nililinaw ang di-pangkaraniwang pariralang Hebreo nang hindi itinatago ang anyo at kawalang-katiyakan nito.
  - marker: b
    text: Maaaring tumukoy ang salitang Hebreo sa isang punong conifer gaya ng sipres o enebro; ayon sa tradisyon, “abeto.”
    reason: Hindi tiyak ang eksaktong uri ng punong tinutukoy ng בְּרוֹשִׁים; itinatama rin ang tradisyonal na katumbas ng “fir.”
lexical_decisions:
- source_word: וַיִּבֶן ... קִירוֹת הַבַּיִת מִבַּיְתָה
  choice: Nilagyan niya ... ang loob ng mga dingding ng templo
  rationale: Ang בנה ay karaniwang ‘magtayo/gumawa,’ ngunit sa kontekstong ito ay inilalarawan nito ang paglalagay ng panloob na tablang dingding. Ang ‘nilagyan’ ay natural sa Filipino at iniiwasang ipahiwatig na ang buong dingding ay purong kahoy. Isinalin ang הַבַּיִת bilang ‘templo’ ayon sa malinaw na konteksto.
- source_word: בְּצַלְעוֹת אֲרָזִים
  choice: ng mga tablang sedro
  rationale: Sa kontekstong panggusali, ang צלעות ay mga tabla o pirasong kahoy, hindi literal na ‘mga tadyang.’ Ang אֲרָזִים ay sedro.
- source_word: מִקַּרְקַע הַבַּיִת
  choice: Mula sa sahig ng templo
  rationale: Ang קַרְקַע ay tumutukoy sa sahig o ibabang ibabaw ng gusali.
- source_word: עַד קִירוֹת הַסִּפֻּן
  choice: hanggang sa kisame[a]
  rationale: Hindi pangkaraniwan ang literal na ‘mga dingding ng kisame.’ Ipinahihiwatig ng parirala ang itaas na hangganan ng panloob na pagkakahoy, malamang ang kisame o sapin ng bubong; inilagay sa talababa ang tunay na hirap ng Hebreo.
- source_word: צִפָּה עֵץ מִבָּיִת
  choice: binalutan niya ng kahoy ang loob
  rationale: Ang צפה ay ‘takpan/balutan.’ Natural na ipinahahayag sa Filipino na kahoy ang ipinantakip sa panloob na bahagi.
- source_word: וַיְצַף אֶת קַרְקַע הַבַּיִת
  choice: Tinakpan din niya ... ang sahig ng templo
  rationale: Pinananatili nito ang sunod na kilos at ang diwa ng paglalatag ng kahoy sa ibabaw ng sahig.
- source_word: בְּצַלְעוֹת בְּרוֹשִׁים
  choice: ng mga tabla ng sipres[b]
  rationale: Muling tumutukoy ang צלעות sa mga tabla. Hindi tiyak ang eksaktong punong tinutukoy ng בְּרוֹשׁ; pinili ang ‘sipres’ bilang karaniwang makabagong katumbas at itinala ang ibang posibilidad.
