id: 1KI.6.2
reference: 1 Kings 6:2
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/הַ/בַּ֗יִת אֲשֶׁ֨ר בָּנָ֜ה הַ/מֶּ֤לֶךְ שְׁלֹמֹה֙ לַֽ/יהוָ֔ה שִׁשִּֽׁים אַמָּ֥ה אָרְכּ֖/וֹ וְ/עֶשְׂרִ֤ים רָחְבּ֑/וֹ וּ/שְׁלֹשִׁ֥ים אַמָּ֖ה קוֹמָתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/002.yaml
  text: The house that King Solomon built for Yahweh was sixty cubits long[a], twenty cubits wide[c][b], and thirty cubits high.
translation:
  language: tl
  text: Ang bahay na itinayo ni Haring Solomon para kay Yahweh ay animnapung siko ang haba, dalawampung siko ang lapad, at tatlumpung siko ang taas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהַבַּיִת
  choice: Ang bahay
  rationale: Ang בַּיִת ay literal na “bahay.” Bagaman tumutukoy ito rito sa templo, pinananatili ng “bahay” ang konkretong pananalita at teolohikal na himig ng Hebreo. Hindi tahasang isinalin ang וְ sapagkat hindi kailangan ang pang-ugnay sa natural na daloy ng modernong Tagalog.
- source_word: אֲשֶר בָּנָה
  choice: na itinayo
  rationale: Natural na relasyong sugnay sa Tagalog; ang Qal perfect na בָּנָה ay tumutukoy sa natapos na pagtatayo.
- source_word: הַמֶּלֶךְ שְׁלֹמֹה
  choice: ni Haring Solomon
  rationale: Ito ang likas na ayos sa Tagalog para sa titulong maharlika at pangalang pantangi.
- source_word: לַיהוָה
  choice: para kay Yahweh
  rationale: Ang לְ ay nagpapahayag dito ng layunin o pag-aalay, kaya “para kay”; pinananatili ang personal na pangalang Yahweh.
- source_word: שִׁשִּׁים אַמָּה אָרְכּוֹ
  choice: animnapung siko ang haba
  rationale: Tumpak at natural na paglalahad sa Tagalog ng bilang, yunit, at sukat ng haba.
- source_word: וְעֶשְׂרִים רָחְבּוֹ
  choice: dalawampung siko ang lapad
  rationale: Hindi inuulit sa Hebreo ang אַמָּה, ngunit malinaw na ipinagpapatuloy ang parehong yunit mula sa naunang sukat. Ang paglalagay ng “siko” ay kailangan para sa malinaw at likas na Tagalog.
- source_word: וּשְׁלֹשִׁים אַמָּה קוֹמָתוֹ
  choice: tatlumpung siko ang taas
  rationale: Ang קוֹמָה ay taas; pinananatili ang bilang at yunit sa natural na pormang Tagalog.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Tuwirang ginagamit ng talata ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalang nasa tekstong Hebreo nang hindi ipinapalit ang isang titulo.
- issue: Pagpapakahulugan sa בַּיִת sa konteksto ng templo
  choice: bahay
  alternative: templo
  rationale: Ang “bahay” ang tuwirang kahulugan at pinananatili ang teolohikal na paglalarawan sa gusali bilang bahay para kay Yahweh; hindi kailangang tahasang gawing “templo” dahil malinaw ito sa konteksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “siko,” ang nakasanayang salin ng cubit, at inulit ito sa bawat dimensiyon para maiwasan ang kalabuan sa Tagalog. Walang footnote dahil walang alternatibong kailangang ilahad upang maunawaan nang tumpak ang talata.
