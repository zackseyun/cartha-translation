  text: He built the side structure against the whole house[a], five cubits high[b], and it was fastened to the house with cedar timbers.
translation:
  language: tl
  text: Itinayo niya ang karugtong na gusali sa kahabaan ng buong templo[a]. Limang siko ang taas nito, at ikinabit ito sa templo sa pamamagitan ng mga kahoy na sedro.[b]
