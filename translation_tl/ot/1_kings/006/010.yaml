translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “templo” sa halip na literal na “bahay” dahil malinaw sa konteksto na gusali ng templo ang tinutukoy. Pinanatili sa talababa ang leksikal at sintaktikong kalabuan.
