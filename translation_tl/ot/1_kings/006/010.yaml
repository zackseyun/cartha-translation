  to: Itinayo niya ang karugtong na gusali sa kahabaan ng buong templo[a]. Limang siko ang taas nito, at ikinabit ito sa templo sa pamamagitan ng mga kahoy na sedro.[b]
  rationale: Pinalitan ang aktibong pagbanggit sa ahente ng pasibong “ikinabit ito” upang hindi higit na tukuyin ang paksa kaysa sa kinakailangan at upang mapanatili ang sintaktikong kalabuan. Pinalitan din ang “mga bigang sedro” ng mas malawak na “mga kahoy na sedro,” habang inililipat ang “mga bigang sedro” sa talababa bilang katanggap-tanggap ngunit mas tiyak na alternatibo.
