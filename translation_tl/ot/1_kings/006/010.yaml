  terminology: Ang “karugtong na gusali,” “templo,” at “siko” ay angkop. Pinanatili ang “mga silid sa gilid” bilang alternatibong leksikal sa talababa. Ang “mga kahoy na sedro” ay sumasaklaw sa timbers/beams nang hindi labis na pinipili ang isang tiyak na anyo.
