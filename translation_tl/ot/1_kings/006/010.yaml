  footnotes:
  - marker: a
    text: O “mga silid sa gilid.” Malamang na tumutukoy ang salitang Hebreo sa karugtong na estrukturang nasa tabi ng templo.
    reason: lexical_alternative
  - marker: b
    text: O “at nakakabit ito sa templo sa pamamagitan ng mga bigang sedro.”
    reason: syntactic_and_lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶן
  choice: Itinayo niya
  rationale: Karaniwang salaysay na naglalarawan ng kasunod na kilos; natural sa modernong Tagalog ang pandiwang nasa unahan.
- source_word: היצוע
  choice: ang karugtong na gusali
  rationale: Tumutukoy sa estrukturang nakakabit sa gilid ng templo; sapat itong malawak upang hindi ipalagay na iisang silid lamang o tiyak na plataporma.
- source_word: עַל כָּל הַבַּיִת
  choice: sa tabi ng buong templo
  rationale: Ang עַל ay ginagamit dito sa diwang panlunan, ukol sa estrukturang nakalapat o nakakabit sa kahabaan ng gusali; pinanatili ng “buong” ang כָּל, at nilinaw ng “templo” ang tinutukoy na bahay sa konteksto.
- source_word: חָמֵשׁ אַמּוֹת קוֹמָתוֹ
  choice: Limang siko ang taas nito
  rationale: Natural na Tagalog para sa sukat, habang ang “nito” ay tahasang tumutukoy sa karugtong na gusali.
- source_word: וַיֶּאֱחֹז אֶת הַבַּיִת
  choice: ikinabit niya ito sa templo
  rationale: Ang literal na diwang “humawak” ay tumutukoy sa matibay na pagkakaugnay sa kontekstong panggusali. Aktibong anyo ang pinili sapagkat maaaring ang paksa ng pandiwa ay si Solomon, bagaman posible ring unawain ang estruktura bilang siyang nakakabit.
- source_word: בַּעֲצֵי אֲרָזִים
  choice: sa pamamagitan ng mga bigang sedro
  rationale: Sa kontekstong panggusali, ang עֲצֵי ay mga elementong kahoy; ang “mga biga” ay malinaw at natural ngunit inilalahad sa talababa ang mas malawak na “mga kahoy.”
