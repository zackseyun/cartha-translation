id: 1KI.6.12
reference: 1 Kings 6:12
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: הַ/בַּ֨יִת הַ/זֶּ֜ה אֲשֶׁר אַתָּ֣ה בֹנֶ֗ה אִם תֵּלֵ֤ךְ בְּ/חֻקֹּתַ/י֙ וְ/אֶת מִשְׁפָּטַ֣/י תַּֽעֲשֶׂ֔ה וְ/שָׁמַרְתָּ֥ אֶת כָּל מִצְוֺתַ֖/י לָ/לֶ֣כֶת בָּ/הֶ֑ם וַ/הֲקִמֹתִ֤י אֶת דְּבָרִ/י֙ אִתָּ֔/ךְ אֲשֶׁ֥ר דִּבַּ֖רְתִּי אֶל דָּוִ֥ד אָבִֽי/ךָ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/012.yaml
  text: As for this house that you are building[a], if you walk in my statutes, carry out my judgments, and keep all my commandments by walking in them, then I will establish my word with you, which I spoke to David your father.
translation:
  language: tl
  text: 'Tungkol sa bahay na ito na itinatayo mo: kung mamumuhay ka ayon sa aking mga tuntunin, isasagawa mo ang aking mga pasiya, at susundin mo ang lahat ng aking mga utos sa pamamagitan ng pamumuhay ayon sa mga iyon, pagtitibayin ko sa iyo ang aking salita[a] na sinabi ko kay David na iyong ama.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “itatatag ko sa iyo ang aking salita” o “tutuparin ko sa iyo ang aking pangako.” Ang Hebreong idyoma ay literal na tumutukoy sa pagtatatag o pagpapatibay sa naunang sinabi.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבַּיִת הַזֶּה
  choice: bahay na ito
  rationale: Ang בַּיִת ay literal na “bahay.” Bagaman tumutukoy ito rito sa templo, pinananatili ng “bahay” ang Hebreong pananalita at malinaw naman ang kahulugan sa konteksto.
- source_word: אֲשֶׁר אַתָּה בֹנֶה
  choice: na itinatayo mo
  rationale: Ang participle na בֹנֶה ay nagpapahiwatig ng gawaing nagpapatuloy; natural itong ipinapahayag sa Filipino bilang “itinatayo mo.”
- source_word: אִם תֵּלֵךְ בְּחֻקֹּתַי
  choice: kung mamumuhay ka ayon sa aking mga tuntunin
  rationale: Ang הלך na may ב ay tumutukoy sa asal o paraan ng pamumuhay. Inihahatid ng “mamumuhay ayon sa” ang idyomatikong diwa nang natural sa modernong Filipino.
- source_word: מִשְׁפָּטַי תַּעֲשֶׂה
  choice: isasagawa mo ang aking mga pasiya
  rationale: Ang מִשְׁפָּטִים ay maaaring tumukoy sa mga pasiya, hatol, o alituntuning may legal at tipanang bisa. Ang “mga pasiya” ay malinaw at naiiba sa “mga tuntunin” at “mga utos.”
- source_word: וְשָׁמַרְתָּ אֶת כָּל מִצְוֺתַי
  choice: at susundin mo ang lahat ng aking mga utos
  rationale: Kapag mga utos ang layon, ang שׁמר ay nangangahulugang ingatan, tuparin, o sundin. “Susundin” ang pinakanatural na pahayag ng aktuwal na pagsunod sa Filipino.
- source_word: לָלֶכֶת בָּהֶם
  choice: sa pamamagitan ng pamumuhay ayon sa mga iyon
  rationale: Ipinapakita ng infinitive ang praktikal na paraan ng pagtupad sa mga utos. Inuulit ng “pamumuhay ayon” ang larawan ng הלך mula sa unang kondisyon nang hindi gumagamit ng di-natural na “lumakad sa mga iyon.”
- source_word: וַהֲקִמֹתִי אֶת דְּבָרִי אִתָּךְ
  choice: pagtitibayin ko sa iyo ang aking salita
  rationale: Ang idyomang הקים דבר ay tumutukoy sa pagpapatibay o pagsasakatuparan ng naunang sinabi. Pinananatili ng “sa iyo” ang אִתָּךְ, at ng “salita” ang kaugnayan sa kasunod na pandiwang “sinabi.”
- source_word: אֲשֶׁר דִּבַּרְתִּי אֶל דָּוִד אָבִיךָ
  choice: na sinabi ko kay David na iyong ama
  rationale: Ang דִּבַּרְתִּי ay literal na “sinabi ko.” Pinananatili nito ang ugnayang leksikal sa “aking salita” at hindi agad nililimitahan ang kahulugan sa “ipinangako.”
theological_decisions:
- issue: Kondisyonal na kaugnayan ng pagtatayo ng templo, pagsunod ni Solomon, at salita ng Diyos kay David
  choice: 'Pinananatili ang malinaw na kayariang kung–kung gayon: ang pagpapatibay ng salita ng Diyos kay Solomon ay iniuugnay sa kanyang tipanang pagsunod.'
  alternative: Ituring itong basta muling pagpapatunay ng isang ganap na walang-kondisyong pangako, o ituring itong ganap na kondisyong nagpapawalang-bisa sa anumang naunang walang-kondisyong aspeto.
  rationale: Malinaw sa Hebreong syntax ang kondisyon at ang kasunod nitong resulta. Hindi nilulutas ng salin ang mas malawak na tensiyong teolohikal tungkol sa kondisyunal at di-kondisyunal na mga aspeto ng tipan kay David.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “bahay” sa halip na “templo” upang mapanatili ang konkretong Hebreong salita; ginawang natural na “mamumuhay ayon sa” ang metaporang paglakad. Inilagay ang [a] pagkatapos ng “aking salita,” na siyang pariralang ipinaliliwanag ng talababa.
