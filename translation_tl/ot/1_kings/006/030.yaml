  yaml_path: translation/ot/1_kings/006/030.yaml
  text: He overlaid the floor of the house with gold[b][a], on the inside and on the outside.
translation:
  language: tl
  text: Binalutan niya ng ginto ang sahig ng bahay[a], sa loob at sa labas.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sahig ng templo.” Sa Hebreo, literal na “sahig ng bahay.”
    reason: lexical_alternative
  - marker: b
    text: Malamang na ang pariralang “sa loob at sa labas” ay nangangahulugang nabalutan ng ginto ang buong sahig, mula sa panloob na bahagi hanggang sa panlabas na bahagi.
    reason: cultural_note
lexical_decisions:
- source_word: קַרְקַע
  choice: sahig
  rationale: Sa konteksto ng pagtatayo ng templo, tumutukoy ito sa ibabaw na nilalakaran sa loob ng gusali; ang “sahig” ang pinakanatural na katumbas sa makabagong Tagalog.
- source_word: הַבַּיִת
  choice: bahay
  rationale: Pinananatili nito ang literal na katawagan ng Hebreo para sa gusali, bagaman ang tinutukoy sa konteksto ay ang templo.
- source_word: צִפָּה
  choice: binalutan
  rationale: Ipinahihiwatig ng pandiwa ang pagtatakip o paglalapat ng isang materyal sa ibabaw ng iba; natural ang “binalutan” para sa paglalagay ng ginto sa sahig.
- source_word: זָהָב
  choice: ginto
  rationale: Tuwiran at karaniwang katumbas ng materyal na binanggit.
- source_word: לִפְנִימָה
  choice: sa loob
  rationale: Malinaw na ipinapahayag ang panloob na bahagi o saklaw at pinananatili ang kaibahan nito sa kasunod na salita.
- source_word: וְלַחִיצוֹן
  choice: at sa labas
  rationale: Pinananatili ang maikli at bahagyang malabong spatial na paghahambing sa Hebreo nang hindi dinaragdagan ang paliwanag sa pangunahing teksto.
