translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “templo” sa halip na literal na “bahay” dahil iyon ang malinaw na referent sa konteksto. Iniwasan ang teknikal o lipas na katawagan para sa mga palamuting inukit.
