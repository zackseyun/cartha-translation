  text: The cedar on the inside of the house was carved with gourds and open flowers[a]. Everything was cedar[b]; no stone was visible.
translation:
  language: tl
  text: Ang panloob na bahagi ng templo ay binalutan ng sedro na inukitan ng mga palamuting hugis-kalabasa[a] at mga bulaklak na nakabuka[b]. Pawang sedro ang lahat; walang batong nakikita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga usbong.” Ang salitang Hebreo ay tumutukoy sa mga bilugang palamuti at maaaring mangahulugan ng mga ukit na hugis-kalabasa sa kontekstong ito.
    reason: lexical_alternative
  - marker: b
    text: O “mga bulaklak na namumukadkad.” Malamang na inilalarawan ng Hebreo ang mga inukit na bulaklak.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶרֶז אֶל־הַבַּיִת פְּנִימָה
  choice: Ang loob ng templo ay nalalatagan ng sedro
  rationale: Ipinahihiwatig ng parirala ang panloob na takip o paneling na sedro. Ginamit ang “templo” para maging malinaw ang tinutukoy na bahay sa konteksto, at ang “nalalatagan” upang ipakita na natatakpan ng sedro ang panloob na bahagi.
- source_word: מִקְלַעַת
  choice: inukitan
  rationale: Tumutukoy ito sa palamuting nililok o inuukit sa kahoy; natural at malinaw sa Filipino ang “inukitan.”
- source_word: פְּקָעִים
  choice: mga hugis-kalabasa
  rationale: Ang salita ay maaaring tumukoy sa mga bilugang palamuting wari'y kalabasa o usbong. Ang “mga hugis-kalabasa” ay malinaw sa konteksto ng dekorasyong pangtemplo habang pinananatili sa talababa ang ibang posibilidad.
- source_word: וּפְטוּרֵי צִצִּים
  choice: mga bulaklak na namumukadkad
  rationale: Inilalarawan nito ang mga anyong bulaklak na nakabuka o namumukadkad. Ang parirala ay natural at marangal sa modernong Filipino.
- source_word: הַכֹּל אֶרֶז
  choice: Pawang sedro ang nakikita
  rationale: Ipinahihiwatig ng buod na sedro ang bumabalot sa lahat ng nakikitang panloob na ibabaw. Iniugnay ito sa kasunod na pahayag tungkol sa kawalan ng nakikitang bato.
- source_word: אֵין אֶבֶן נִרְאָה
  choice: walang batong nakalitaw
  rationale: Pinananatili nito ang diwa na ang batong estruktura ay hindi nakikita dahil natatakpan ng sedro.
