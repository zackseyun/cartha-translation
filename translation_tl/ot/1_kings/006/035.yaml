  text: He carved cherubim and palm trees and open flowers, and overlaid them with gold, fitted over the carved work.
translation:
  language: tl
  text: Inukitan niya ang mga ito ng mga kerubin, mga palma, at mga bulaklak na nakabuka, at binalutan niya ng ginto ang mga inukit na disenyo; ang ginto ay maayos na inilapat sa ibabaw ng mga ukit.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְקָלַע
  choice: Inukitan niya
  rationale: Ang pandiwa ay tumutukoy sa pag-ukit o pag-anyo ng dekorasyong nakaumbok; natural sa Filipino ang konstruksiyong “inukitan ... ng.”
- source_word: כְרוּבִים
  choice: mga kerubin
  rationale: Karaniwang transliterasyon sa Filipino para sa mga nilalang na kerubim; hindi ito pinantayan sa ordinaryong “anghel.”
- source_word: תִמֹרוֹת
  choice: mga puno ng palma
  rationale: Tumutukoy sa mga disenyong palma o palm tree; malinaw at madaling maunawaan ang anyong ito.
- source_word: פְטֻרֵי צִצִּים
  choice: mga bulaklak na nakabuka
  rationale: Ang parirala ay naglalarawan ng mga bulaklak na bukás o namumukadkad.
- source_word: וְצִפָּה זָהָב
  choice: binalutan niya ng ginto
  rationale: Karaniwang paglalarawan sa paglalapat ng manipis na ginto sa ibabaw ng kahoy o ukit.
- source_word: מְיֻשָּׁר עַל הַמְחֻקֶּה
  choice: na maingat na inilapat sa mga iyon
  rationale: Ipinahihiwatig ng מְיֻשָּׁר ang pantay o angkop na paglalapat ng ginto sa ibabaw ng inukit; iniiwasan ang sobrang teknikal na pananalita habang pinananatili ang diwa.
