  text: Ang taas ng isang kerubin ay sampung siko[a], at gayundin ang taas ng ikalawang kerubin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang siko ay sinaunang yunit ng haba, humigit-kumulang sa distansiya mula sa siko ng braso hanggang sa dulo ng mga daliri.
