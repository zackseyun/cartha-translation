lexical_decisions:
- source_word: קוֹמַת
  choice: Ang taas ng
  rationale: Ang קוֹמָה ay tumutukoy sa taas o tindig; sa konteksto ng sukat ng mga kagamitan sa templo, natural at tiyak ang “taas.”
- source_word: הַכְּרוּב
  choice: kerubin
  rationale: Isahan ang anyong Hebreo at tumutukoy sa isang kerubin. Karaniwang salitang biblikal sa Filipino ang “kerubin.”
- source_word: הָאֶחָד
  choice: isang
  rationale: Literal na “ang isa”; natural sa Filipino ang “isang kerubin” bilang pagtukoy sa isa sa dalawang inilalarawan, nang hindi ito ginagawang “una.”
- source_word: עֶשֶׂר בָּאַמָּה
  choice: sampung siko
  rationale: Direktang ibinibigay ng parirala ang sukat. Hindi na kailangang ulitin ang “ang taas” sapagkat naipahayag na ito sa simula.
- source_word: וְכֵן
  choice: at gayundin
  rationale: Malinaw at natural nitong ipinahahayag na magkapareho ang taas ng dalawang kerubin.
- source_word: הַכְּרוּב הַשֵּׁנִי
  choice: ang ikalawang kerubin
  rationale: Tahasang “ikalawa” ang Hebreo, kaya pinanatili ito sa halip na gawing “isa pang kerubin.”
