  text: And he built the inner court with three rows of cut stone and a row of cedar beams[a].
translation:
  language: tl
  text: At itinayo niya ang panloob na looban na may tatlong hanay ng mga tinabas na bato at isang hanay ng mga bigang gawa sa sedro.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “tatlong patong ng mga batong tinabas at isang patong ng mga bigang gawa sa sedro.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶן
  choice: At itinayo niya
  rationale: Pinananatili ng “At” ang sunod-sunod na daloy ng salaysay na ipinahihiwatig ng wayyiqtol, nang hindi dinaragdagan ng mas tiyak na ugnayang pamanahon.
- source_word: הֶחָצֵר הַפְּנִימִית
  choice: ang panloob na looban
  rationale: Ang חָצֵר ay looban o courtyard, at ang פְּנִימִית ay tumutukoy sa panloob na bahagi; natural at malinaw ito sa konteksto ng templo.
- source_word: שְׁלֹשָׁה טוּרֵי
  choice: tatlong hanay ng
  rationale: Ang טוּר ay maaaring tumukoy sa hanay o patong sa konstruksiyon. Ang “hanay” ay madaling maunawaan sa modernong Filipino, habang ang alternatibong “patong” ay inilagay sa talababa.
- source_word: גָזִית
  choice: mga tinabas na bato
  rationale: Tumutukoy ang גָזִית sa batong hinugis o tinabas para sa pagtatayo. Malinaw at likas sa Filipino ang “tinabas na bato.”
- source_word: וְטוּר
  choice: at isang hanay ng
  rationale: Bagaman walang tahasang bilang na “isa” sa Hebreo, ang pang-isahang טוּר kasunod ng “tatlong hanay” ay likas na nagpapahiwatig ng isang karagdagang hanay; kailangan din ang “isang” sa natural na gramatikang Filipino.
- source_word: כְּרֻתֹת אֲרָזִים
  choice: mga bigang sedro
  rationale: Ang parirala ay tumutukoy sa mga pinutol o hinubog na piraso ng sedro na gamit sa konstruksiyon. Ipinahahayag ng “mga bigang sedro” ang malamang na gamit ng mga ito nang natural at maikli.
