translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “looban,” “hanay,” at “tinabas na bato” sa halip na mas teknikal o makalumang mga salita; pinanatili sa talababa ang arkitektural na alternatibong “patong.”
