id: 1KI.6.1
reference: 1 Kings 6:1
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יְהִ֣י בִ/שְׁמוֹנִ֣ים שָׁנָ֣ה וְ/אַרְבַּ֣ע מֵא֣וֹת שָׁנָ֡ה לְ/צֵ֣את בְּנֵֽי יִשְׂרָאֵ֣ל מֵ/אֶֽרֶץ מִצְרַיִם֩ בַּ/שָּׁנָ֨ה הָ/רְבִיעִ֜ית בְּ/חֹ֣דֶשׁ זִ֗ו ה֚וּא הַ/חֹ֣דֶשׁ הַ/שֵּׁנִ֔י לִ/מְלֹ֥ךְ שְׁלֹמֹ֖ה עַל יִשְׂרָאֵ֑ל וַ/יִּ֥בֶן הַ/בַּ֖יִת לַ/יהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/001.yaml
  text: And it came about in the four hundred eightieth year after the sons of Israel came out from the land of Egypt[a], in the fourth year, in the month of Ziv (that is, the second month), of Solomon’s reign over Israel[c][b], that he built the house for Yahweh.
translation:
  language: tl
  text: Noong ika-480 taon mula nang lumabas ang mga anak ni Israel sa lupain ng Ehipto[a]—noong ikaapat na taon ng paghahari ni Solomon sa Israel, sa buwan ng Ziv, na siyang ikalawang buwan[b]—itinayo niya ang bahay para kay Yahweh.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “mga anak ni Israel”; kolektibong tumutukoy ito sa bayang Israel.
    reason: lexical_alternative
  - marker: b
    text: Ang Ziv ang sinaunang pangalan ng ikalawang buwan sa kalendaryong Hebreo.
    reason: cultural_note
  - marker: c
    text: 'Maaari ring unawain sa konteksto: “sinimulan niyang itayo ang bahay para kay Yahweh.” Payak na “itinayo” ang kahulugan ng pandiwang Hebreo, ngunit tinutukoy rito ang taon nang magsimula ang pagtatayo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Nang
  rationale: Sa mahabang pahayag na kronolohikal, likas sa makabagong Tagalog ang “Nang” upang ipakilala ang takdang panahon; hindi kailangang tumbasan nang hiwalay ang pormulang pasalaysay na וַיְהִי.
- source_word: בִשְׁמוֹנִים שָׁנָה וְאַרְבַּע מֵאוֹת שָׁנָה
  choice: ika-480 taon
  rationale: Tinutukoy ng Hebreo ang isang tiyak na taon sa pagbibilang, hindi lamang ang lumipas na 480 taon.
- source_word: לְצֵאת בְּנֵי יִשְׂרָאֵל
  choice: mula nang lumabas ang mga anak ni Israel
  rationale: Inilalahad ng לְצֵאת ang pinagbabatayang pangyayari sa pagkalkula ng panahon; pinananatili ng “mga anak ni Israel” ang pampamilya at pangtipang idyoma ng Hebreo.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: sa lupain ng Ehipto
  rationale: Pinananatili ang tahasang אֶרֶץ, “lupain,” at natural ang “lumabas ... sa lupain” sa Tagalog.
- source_word: בַּשָּׁנָה הָרְבִיעִית ... לִמְלֹךְ שְׁלֹמֹה עַל יִשְׂרָאֵל
  choice: noong ikaapat na taon ng paghahari ni Solomon sa Israel
  rationale: Malinaw at likas na regnal dating sa Tagalog, habang pinananatili ang kaugnayan ng ikaapat na taon sa paghahari ni Solomon.
- source_word: בְּחֹדֶשׁ זִו
  choice: sa buwan ng Ziv
  rationale: Pinananatili ang sinaunang pangalang pantangi ng buwan.
- source_word: הוּא הַחֹדֶשׁ הַשֵּׁנִי
  choice: na siyang ikalawang buwan
  rationale: Tuwirang ipinahahayag ang paliwanag na apposisyon ng Hebreo.
- source_word: וַיִּבֶן
  choice: itinayo niya
  rationale: Tinutumbasan nang tuwiran ang payak na pandiwang “nagtayo/itinayo”; hindi idinaragdag sa pangunahing teksto ang “sinimulang,” na ipinahihiwatig lamang ng konteksto.
- source_word: הַבַּיִת
  choice: ang bahay
  rationale: Pinananatili ang literal at teolohikal na katawagang “bahay” sa halip na palitan agad ng “templo.”
- source_word: לַיהוָה
  choice: para kay Yahweh
  rationale: Pinananatili ang personal na pangalang tipan na יהוה bilang “Yahweh”; ang “kay” ay angkop sa pangalang pantangi sa Tagalog.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יהוה
  choice: Yahweh
  alternative: ang PANGINOON
  rationale: Pangalan mismo ang nasa tekstong Hebreo; ang transliterasyong “Yahweh” ay nagpapanatili sa pagkakakilanlan nito bilang pangalang tipan nang hindi ito pinapalitan ng titulo.
- issue: Paglalahad sa בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  alternative: mga Israelita
  rationale: Pinananatili nito ang tunay na pampamilya at pangtipang anyo ng Hebreo, bagaman kolektibong tumutukoy ang parirala sa bayang Israel.
- issue: Kung gagawing tahas ang pagsisimula ng pagtatayo
  choice: itinayo niya
  alternative: sinimulan niyang itayo
  rationale: Ang וַיִּבֶן ay payak na “nagtayo/itinayo.” Ipinahihiwatig ng kronolohiya na ito ang pagsisimula ng proyekto, ngunit hindi tahasang sinasabi iyon ng pandiwa, kaya inilalagay ang alternatibo sa talababa.
translation_notes:
  register: Makabago, marangal, at madaling basahing Filipino. Ginamit ang mga gitling upang luminaw ang magkakaugnay na pagtukoy sa panahon. Pinanatili ang “bahay,” “mga anak ni Israel,” at “Yahweh” dahil mahalaga ang anyo at teolohikal na kulay ng mga salitang Hebreo.
