  text: וְ/שָׁ֣כַנְתִּ֔י בְּ/ת֖וֹךְ בְּנֵ֣י יִשְׂרָאֵ֑ל וְ/לֹ֥א אֶעֱזֹ֖ב אֶת עַמִּ֥/י יִשְׂרָאֵֽל־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/013.yaml
  text: And I will dwell among the children of Israel[a], and I will not forsake my people Israel.
translation:
  language: tl
  text: At mananahan ako sa gitna ng mga anak ni Israel[a], at hindi ko pababayaan ang aking bayang Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga Israelita.” Sa Hebreo, literal na “mga anak ni Israel.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁכַנְתִּי
  choice: At mananahan ako
  rationale: Ang שׁכן ay tumutukoy sa paninirahan o pananahan, lalo na sa presensiya ng Diyos sa piling ng kanyang bayan. Pinananatili ng “mananahan” ang bigat na tipan at teolohikal habang nananatiling marangal at nauunawaan.
- source_word: בְּתוֹךְ
  choice: sa gitna ng
  rationale: Tuwirang ipinahahayag nito ang presensiya sa loob ng pamayanan at natural itong kaugnay ng “mga anak ni Israel.”
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Malapit ito sa literal na Hebreong “mga anak ni Israel” at pinananatili ang tradisyonal na katawagan sa bayang sakop ng tipan. Maaari rin itong idiomatikong isalin na “mga Israelita.”
- source_word: וְלֹא אֶעֱזֹב
  choice: at hindi ko pababayaan
  rationale: Sa konteksto ng tipan, ang עזב ay may diwang hindi pagtalikod o pag-abandona. Ang “pababayaan” ay natural sa modernong Tagalog at malinaw na nagpapahayag ng patuloy na katapatan.
- source_word: עַמִּי
  choice: aking bayan
  rationale: Ang “aking bayan” ay natural at maringal na salin ng pormulang pangtipan na “my people.”
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Karaniwang transliterasyon sa Tagalog ng pangalang pantangi.
theological_decisions:
- issue: Wika ng pananahan ng Diyos sa konteksto ng templo
  choice: “mananahan ako sa gitna ng mga anak ni Israel”
  alternative: “titira ako kasama ng mga Israelita”
  rationale: Ipinahahayag ng talata ang presensiya ng Diyos sa kanyang bayan kaugnay ng templo, ngunit hindi nito nililimitahan ang Diyos sa isang gusali. Pinananatili ng salin ang tensiyong ito nang hindi nagdaragdag ng isang tiyak na doktrinang wala sa mismong pananalita.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “mananahan” upang mapanatili ang bigat ng presensiya ng Diyos at ang “pababayaan” bilang natural na pagpapahayag ng hindi pagtalikod sa bayang sakop ng tipan.
