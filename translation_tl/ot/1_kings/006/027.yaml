  text: וַ/יִּתֵּ֨ן אֶת הַ/כְּרוּבִ֜ים בְּ/ת֣וֹךְ הַ/בַּ֣יִת הַ/פְּנִימִ֗י וַֽ/יִּפְרְשׂוּ֮ אֶת כַּנְפֵ֣י הַ/כְּרֻבִים֒ וַ/תִּגַּ֤ע כְּנַף הָֽ/אֶחָד֙ בַּ/קִּ֔יר וּ/כְנַף֙ הַ/כְּר֣וּב הַ/שֵּׁנִ֔י נֹגַ֖עַת בַּ/קִּ֣יר הַ/שֵּׁנִ֑י וְ/כַנְפֵי/הֶם֙ אֶל תּ֣וֹךְ הַ/בַּ֔יִת נֹגְעֹ֖ת כָּנָ֥ף אֶל כָּנָֽף־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/027.yaml
  text: He placed the cherubim inside the inner house[a], and the cherubim spread out their wings, so that the wing of the one touched the wall, and the wing of the second cherub touched the other wall; and their wings toward the middle of the house were touching wing to wing.
translation:
  language: tl
  text: Inilagay niya ang mga kerubin sa loob ng pinakaloob na bahagi ng templo[a]. Iniunat ng mga kerubin ang kanilang mga pakpak, kaya ang pakpak ng isa ay sumayad sa pader, at ang pakpak ng ikalawang kerubin ay sumayad sa kabilang pader. Ang kanilang mga pakpak na nakaharap sa gitna ng templo ay magkakadikit, pakpak sa pakpak.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin na “sa loob ng panloob na santuwaryo.” Literal sa Hebreo: “sa loob ng panloob na bahay,” na tumutukoy sa pinakaloob na bahagi ng templo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: Inilagay niya
  rationale: Ang נתן ay maaaring mangahulugang ‘ibigay,’ ‘ilagay,’ o ‘itakda.’ Sa paglalarawan ng pagpoposisyon sa loob ng templo, natural at tumpak ang ‘inilagay niya.’
- source_word: הַכְּרוּבִים
  choice: ang mga kerubin
  rationale: Pinananatili ng ‘mga kerubin’ ang kinaugaliang katawagan sa mga nilalang na ito at ang marangal na kultikong himig ng teksto.
- source_word: בְּתוֹךְ הַבַּיִת הַפְּנִימִי
  choice: sa loob ng pinakaloob na bahagi ng templo
  rationale: Literal na tumutukoy ang parirala sa ‘loob ng panloob na bahay.’ Dito, ang בַּיִת ay ang templo, at ang ‘pinakaloob na bahagi’ ay malinaw at natural sa Filipino nang hindi pinapangalanan agad ang silid bilang santuwaryo.
- source_word: וַיִּפְרְשׂוּ אֶת כַּנְפֵי הַכְּרֻבִים
  choice: Iniunat ng mga kerubin ang kanilang mga pakpak
  rationale: Bagaman pormal na mababasa ang Hebreo bilang ‘iniunat nila ang mga pakpak ng mga kerubin,’ natural sa konteksto na ang mga kerubin mismo ang paksa. Ang ‘iniunat’ ay malinaw na nagpapahayag ng pagbuka o paglawak ng mga pakpak.
- source_word: וַתִּגַּע / נֹגַעַת
  choice: sumayad
  rationale: Ang נגע ay nagsasaad ng pagdikit o paghipo. Ang ‘sumayad’ ay angkop sa pisikal na pag-abot ng dulo ng pakpak sa pader.
- source_word: כְּנַף הָאֶחָד
  choice: ang pakpak ng isa
  rationale: Malapit ito sa Hebreong ‘pakpak ng isa’ at hindi ipinapalit ang ‘una,’ na hindi tahasang sinasabi ng teksto.
- source_word: הַכְּרוּב הַשֵּׁנִי
  choice: ang ikalawang kerubin
  rationale: Tuwirang pinananatili nito ang ordinal na ‘ikalawa’ sa Hebreo.
- source_word: הַקִּיר הַשֵּׁנִי
  choice: kabilang pader
  rationale: Literal na ‘ikalawang pader,’ ngunit sa pagtutulad ng dalawang magkatapat na pader, mas natural sa Filipino ang ‘kabilang pader.’
- source_word: וְכַנְפֵיהֶם אֶל תּוֹךְ הַבַּיִת
  choice: ang kanilang mga pakpak na nakaharap sa gitna ng templo
  rationale: Ang תּוֹךְ ay maaaring tumukoy sa loob o gitna. Nililinaw ng kasunod na pagdidikit ng mga pakpak na ang tinutukoy ay ang direksiyon patungo sa gitna.
- source_word: נֹגְעֹת כָּנָף אֶל כָּנָף
  choice: nagdikit, pakpak sa pakpak
  rationale: Pinananatili nito ang matingkad at halos literal na larawang ‘pakpak sa pakpak,’ habang natural ang pandiwang ‘nagdikit’ sa Filipino.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang ‘templo’ para sa בַּיִת ayon sa konteksto, habang pinanatili sa talababa ang literal na ‘bahay’ at ang alternatibong ‘panloob na santuwaryo.’
