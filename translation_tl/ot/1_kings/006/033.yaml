  text: And so he made for the entrance of the nave doorposts of olivewood[a], four-sided.
translation:
  language: tl
  text: Gayon din, gumawa siya ng mga hamba ng pinto na yari sa kahoy ng olibo para sa pasukan ng bulwagan ng templo; ang mga ito ay may apat na panig.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O maaaring “may kuwadradong balangkas” o “parisukat.” Mahirap tiyakin ang kahulugan ng pariralang Hebreo, na literal na “mula sa ikaapat na bahagi”; maaaring inilalarawan nito ang hugis ng pasukan.
    reason: alternative_reading
lexical_decisions:
- source_word: וְכֵן
  choice: Gayon din
  rationale: Ipinahihiwatig ang pagkakatulad sa naunang paglalarawan at pinananatili ang tuloy-tuloy na ugnayan ng salaysay.
- source_word: עָשָׂה
  choice: gumawa siya
  rationale: Payak at likas na salin sa konteksto ng pagtatayo.
- source_word: לְפֶתַח הַהֵיכָל
  choice: para sa pasukan ng bulwagan ng templo
  rationale: Ang פתח ay pasukan o bukana, at ang היכל dito ay ang pangunahing bulwagan ng templo, na naiiba sa pinakaloob na santuwaryo.
- source_word: מְזוּזוֹת
  choice: mga haligi ng pinto
  rationale: Tumutukoy sa mga patayong poste sa magkabilang gilid ng pintuan; mas madaling maunawaan ito ng karaniwang mambabasang Filipino kaysa sa teknikal na katawagan.
- source_word: עֲצֵי שָׁמֶן
  choice: kahoy ng olibo
  rationale: Karaniwang pagkaunawa sa idyomatikong pariralang Hebreo, bagaman literal itong may kaugnayan sa 'punongkahoy ng langis.'
- source_word: מֵאֵת רְבִעִית
  choice: na may apat na panig
  rationale: Mahirap at hindi tiyak ang pariralang Hebreo. Ang saling ito ay nagbibigay ng malamang na paglalarawang pang-arkitektura, habang inilalahad sa talababa ang ibang posibilidad.
