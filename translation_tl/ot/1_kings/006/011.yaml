  text: And the word of Yahweh came to Solomon[a], saying[b],
translation:
  language: tl
  text: 'At dumating kay Solomon ang salita ni Yahweh:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: At dumating
  rationale: Karaniwang panandang pasalaysay dito ang waw-consecutive ng היה. Likas sa makabagong Tagalog ang “At dumating” at napapanatili nito ang daloy nang hindi ginagamit ang mas literal ngunit mabigat na “At nangyari.”
- source_word: דְּבַר
  choice: ang salita
  rationale: Sa pormulang דְּבַר יְהוָה, ang “salita” ang pormal at kinagawiang katumbas para sa mensaheng mula sa Diyos.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat sa Tagalog ang pantanging banal na pangalan sa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: אֶל שְׁלֹמֹה
  choice: kay Solomon
  rationale: Natural na ipinahahayag ng “kay” ang taong tumanggap ng banal na salita.
- source_word: לֵאמֹר
  choice: na nagsasabi
  rationale: Pinananatili nito ang pormal na kawing patungo sa nilalaman ng pahayag sa kasunod na talata; ipinahihiwatig ng tutuldok na susunod ang mismong sinabi.
theological_decisions:
- issue: Paglalapat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: ang PANGINOON; Jehova
  rationale: Pantanging pangalan ang יְהוָה sa pinagmulan. Pinananatili ng “Yahweh” ang pagkakakilanlan nito bilang pangalan, samantalang ang “ang PANGINOON” ay tradisyonal na pamalit na titulo at ang “Jehova” ay ibang anyo ng transliterasyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang pormulang “ang salita ni Yahweh” at ang pambungad na “na nagsasabi” upang maikawing ang talata sa banal na pahayag na sumusunod.
