base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/003.yaml
  text: The portico in front of the nave of the house was twenty cubits long[a], across the width of the house[c][b], and ten cubits deep in front of the house.
translation:
  language: tl
  text: Ang portiko[a] sa harap ng pangunahing bulwagan[b] ng bahay ay dalawampung siko ang haba, na kasinlapad ng bahay, at sampung siko ang lalim nito sa harap ng bahay.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “beranda” o “bulwagan sa pasukan.”
    reason: lexical_alternative
  - marker: b
    text: Tumutukoy ito sa pangunahing bulwagan ng gusali ng templo.
    reason: lexical_alternative
  - marker: c
    text: Sa Hebreo, “lapad nito.” Dahil ang portiko ay nasa harap ng bahay, ang sukat na ito ay tumutukoy sa lalim nito mula sa harapan ng bahay palabas.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָאוּלָם
  choice: ang portiko
  rationale: Tumutukoy ang אוּלָם sa estruktura sa pasukan sa harap ng pangunahing bulwagan. Ang “portiko” ay malinaw na terminong pang-arkitektura; inilalahad sa talababa ang mas karaniwang alternatibo.
- source_word: עַל־פְּנֵי
  choice: sa harap ng
  rationale: Likas nitong ipinahahayag ang puwesto at ugnayang pang-arkitektura ng portiko sa gusali.
- source_word: הֵיכַל הַבַּיִת
  choice: pangunahing bulwagan ng bahay
  rationale: Sa kontekstong ito, ang הֵיכַל ay ang pangunahing silid ng gusali, na naiiba sa portiko at sa pinakaloob na santuwaryo. Mas madaling maunawaan ang “pangunahing bulwagan” kaysa sa teknikal na “nabe.”
- source_word: הַבַּיִת
  choice: bahay
  rationale: Pinananatili ang literal na larawan ng Hebreong בַּיִת; malinaw sa konteksto na ito ang gusali ng templo.
- source_word: עֶשְׂרִים אַמָּה
  choice: dalawampung siko
  rationale: Pinananatili ang sinaunang yunit ng sukat sa halip na palitan ng makabagong katumbas.
- source_word: אָרְכּוֹ
  choice: ang haba
  rationale: Natural na Filipino ang konstruksiyong “dalawampung siko ang haba” at tumpak na kumakatawan sa pangngalang Hebreo na may hulaping paari.
- source_word: עַל־פְּנֵי רֹחַב הַבָּיִת
  choice: saklaw ang lapad ng bahay
  rationale: Ipinahahayag nitong ang haba ng portiko ay tumatawid o tumutugma sa buong lapad ng harapan ng bahay nang hindi dinaragdagan ang teksto.
- source_word: עֶשֶׂר בָּאַמָּה
  choice: sampung siko
  rationale: Idyomatiko ang prefixed ב sa pahayag ng sukat; hindi kailangang isalin nang salita-sa-salita.
- source_word: רָחְבּוֹ
  choice: ang luwang
  rationale: Pinananatili ang karaniwang kahulugan na “lapad/luwang” sa pangunahing teksto upang huwag tahimik na lutasin ang oryentasyon ng sukat. Nililinaw sa talababa na sa plano ng portiko maaari itong tumukoy sa lalim mula harap patalikod.
- source_word: עַל־פְּנֵי הַבָּיִת
  choice: sa harap ng bahay
  rationale: Malinaw at natural na inilalarawan ang kinalalagyan ng sampung-sikong dimensiyon.
theological_decisions: []
translation_notes:
  register: Makabago at marangal na Filipino na madaling maunawaan. Pinanatili ang “bahay” bilang konkretong katawagan sa templo at ang “siko” bilang sinaunang yunit. Ginamit ang teknikal ngunit kilalang “portiko,” na may mga alternatibo sa talababa. Pinanatili sa teksto ang literal na “luwang” para sa רָחְבּוֹ at inilagay sa talababa ang posibleng arkitekturang diwang “lalim,” upang mapanatili ang tunay na ambiguity ng Hebreo.
