    rationale: Ang salitang ito ay karaniwang tumutukoy sa pagiging maluwag o espasyo, hindi sa isang sukat na “width.” Dahil ang portiko ay nasa harap ng bahay, ang inilalarawang sukat ay likas na lalim nito; ang literal na “lapad nito” ay dapat itala sa talababa.
