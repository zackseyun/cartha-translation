  verdict: revise
  source_fidelity: Tumpak ang pangunahing pagtukoy sa portiko, pangunahing bulwagan, bahay, at mga sukat. Gayunman, ang “luwang” para sa רָחְבּוֹ ay hindi ang karaniwang neutral na katumbas ng “lapad” sa Filipino at nagiging hindi malinaw sa pangungusap. Sa kontekstong pang-arkitektura, ang dimensiyong ito ay ang lalim ng portiko, habang dapat panatilihin ng talababa ang literal na Hebreong “lapad nito.”
  naturalness: Ang “saklaw ang lapad ng bahay” ay medyo pilit at maaaring magpahiwatig ng pagsasakop sa halip na pagtutugma ng sukat. Ang “na kasinlapad ng bahay” ay mas likas at malinaw. Mas natural din ang “lalim nito” kaysa “luwang” para sa sukat na umaabot palabas sa harap ng gusali.
  terminology: Ang “portiko,” “pangunahing bulwagan,” “bahay,” at “siko” ay angkop sa makabagong Filipino Tagalog at sa rehistrong pang-arkitektura/biblikal. Ang “beranda” bilang alternatibo ay katanggap-tanggap, bagaman ang “portiko” ang mas tiyak sa kontekstong ito.
