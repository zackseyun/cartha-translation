revisions:
- from: Ang portiko[a] sa harap ng pangunahing bulwagan[b] ng bahay ay dalawampung siko ang haba, saklaw ang lapad ng bahay, at sampung siko ang luwang[c] sa harap ng bahay.
  to: Ang portiko[a] sa harap ng pangunahing bulwagan[b] ng bahay ay dalawampung siko ang haba, na kasinlapad ng bahay, at sampung siko ang lalim nito sa harap ng bahay.[c]
  rationale: Inayos ang dalawang parirala upang maging likas na Filipino at malinaw ang relasyong pangsukat ng portiko sa bahay. Isinalin ang arkitekturang bisa ng רָחְבּוֹ bilang “lalim nito,” ngunit malinaw na itinatala sa talababa ang literal na Hebreong “lapad nito,” kaya hindi itinatago ang anyo ng pinagmulan.
