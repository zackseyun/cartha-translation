base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/025.yaml
  text: And the second cherub was ten cubits[a]; both cherubim had one measure and one form.
translation:
  language: tl
  text: At ang ikalawang kerubin ay sampung siko rin; iisa ang sukat at iisa ang anyo ng dalawang kerubin.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעֶשֶׂר בָּאַמָּה
  choice: ay sampung siko rin
  rationale: Ang parirala ay literal na nagbibigay ng sukat na sampung siko. Ipinahihiwatig ng וְ at ng konteksto na gayon din ang sukat ng ikalawang kerubin, kaya natural sa Tagalog ang “rin.” Hindi idinagdag ang “taas” dahil hindi iyon tahasang nakasaad sa Hebreo.
- source_word: הַכְּרוּב הַשֵּׁנִי
  choice: ang ikalawang kerubin
  rationale: Tuwirang katumbas ng tiyak na pangngalan at ordinal na pang-uri; pinanatili ang isahan.
- source_word: מִדָּה אַחַת
  choice: iisa ang sukat
  rationale: Ang מִדָּה ay tumutukoy sa sukat o dimensiyon. Ang “iisa ang sukat” ay natural sa Tagalog at malinaw na nagsasaad ng pagkakapareho ng dalawa.
- source_word: וְקֶצֶב אֶחָד
  choice: at iisa ang anyo
  rationale: Sa kontekstong ito, ang קֶצֶב ay maaaring tumukoy sa anyo, hugis, o proporsiyon. Pinili ang “anyo” dahil malawak ito at hindi labis na nililimitahan ang kahulugan.
- source_word: לִשְׁנֵי הַכְּרֻבִים
  choice: ng dalawang kerubin
  rationale: Ang literal na diwa ay “para sa dalawang kerubin.” Isinaayos bilang pariralang paari upang maging natural sa Tagalog habang pinananatiling parehong kerubin ang tinutukoy.
theological_decisions: []
translation_notes:
  register: Makabagong, dignipikado, at madaling maunawaang Filipino. Ginamit ang tradisyonal at pamilyar na “siko” para sa cubit at “kerubin” bilang anyong isahan; ang “dalawang kerubin” ay malinaw nang maramihan dahil sa pamilang.
