base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/016.yaml
  text: He built twenty cubits at the rear of the house with cedar boards[a], from the floor to the walls, and he built it within as an inner sanctuary[c][b], as the Most Holy Place.
translation:
  language: tl
  text: Sa hulihang bahagi ng templo, gumawa siya ng isang bahaging dalawampung siko, gamit ang mga tablang sedro mula sa sahig hanggang sa mga dingding.[a] Sa loob nito ay gumawa siya ng isang pinakaloob na santuwaryo, ang Kabanal-banalang Lugar.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mula sa sahig hanggang sa mga biga/bubong.” “Hanggang sa mga dingding” ang literal na mababasa sa tekstong Hebreo at siyang pinanatili rito.
    reason: alternative_reading
  - marker: b
    text: Hebreo debir, ang pinakaloob na santuwaryo o silid ng templo.
    reason: cultural_note
  - marker: c
    text: 'Tradisyonal ding salin: “Banal ng mga Banal.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִירְכְּתֵי הַבַּיִת
  choice: sa hulihang bahagi ng templo
  rationale: Ipinahahayag ang malayo o likurang bahagi ng gusali. Ginamit ang “templo” para luminaw na ang tinutukoy na bahay ay ang bahay ni Yahweh sa konteksto.
- source_word: אֶת עֶשְׂרִים אַמָּה
  choice: isang dalawampung siko ang haba
  rationale: Pinananatili ang sinaunang yunit na siko; idinagdag ang “ang haba” upang maging natural sa Filipino ang eliptikong paglalarawan sa bahaging itinayo.
- source_word: בְּצַלְעוֹת אֲרָזִים
  choice: gamit ang mga tablang sedro
  rationale: Ang צלעות ay maaaring tumukoy sa mga tadyang, gilid, o tabla sa kontekstong arkitektural. Ang “mga tablang sedro” ang malinaw at likas na paglalarawan sa materyal ng partisyon.
- source_word: מִן הַקַּרְקַע עַד הַקִּירוֹת
  choice: mula sa sahig hanggang sa mga dingding
  rationale: Mahigpit na sinusunod ang tekstong Masoretiko na may “mga dingding,” kahit mahirap ang detalyeng arkitektural; inilalagay sa talababa ang karaniwang alternatibong “mga biga/bubong.”
- source_word: וַיִּבֶן לוֹ מִבַּיִת
  choice: Itinayo niya ito sa loob
  rationale: Isinasalin nang natural ang siksik na idyoma bilang pagtatayo ng panloob na espasyo sa loob ng templo, nang hindi labis na tinutukoy ang eksaktong anyo nito.
- source_word: לִדְבִיר
  choice: bilang pinakaloob na santuwaryo
  rationale: Ang דביר ay teknikal na tawag sa pinakaloob na silid o dambanang bahagi ng templo. Ang salin ay naghahatid ng lokasyon at sagradong gamit nito.
- source_word: לְקֹדֶשׁ הַקֳּדָשִׁים
  choice: bilang ang Kabanal-banalang Lugar
  rationale: Isinasalamin nito ang Hebreong superlatibong parirala at gumagamit ng malinaw, dignidadong katawagan sa Filipino.
theological_decisions:
- issue: Ugnayan ng דביר at קֹדֶשׁ הַקֳּדָשִׁים
  choice: 'Dalawang magkaugnay na katawagan sa iisang panloob na espasyo: “pinakaloob na santuwaryo” at “Kabanal-banalang Lugar.”'
  alternative: Pagsamahin bilang iisang pariralang “pinakaloob na santuwaryo, ang Kabanal-banalang Lugar.”
  rationale: Pinananatili ng salin ang dalawang lamed phrase at ang bahagyang pag-uulit ng Hebreo, nang hindi nagdaragdag ng denominasyonal na pagpapakahulugan.
translation_notes:
  register: Modernong Filipino na may dignidadong estilong angkop sa salin ng Kasulatan. Ginamit ang “templo” sa halip na literal na “bahay” dahil iyon ang malinaw na referent sa konteksto. Pinanatili ang “siko” bilang sinaunang sukat at ang hirap ng MT na “hanggang sa mga dingding,” na may alternatibo sa talababa.
