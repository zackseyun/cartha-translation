  to: Sa hulihang bahagi ng templo, gumawa siya ng isang bahaging dalawampung siko, gamit ang mga tablang sedro mula sa sahig hanggang sa mga dingding.[a] Sa loob nito ay gumawa siya ng isang pinakaloob na santuwaryo, ang Kabanal-banalang Lugar.[b][c]
