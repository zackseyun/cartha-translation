translation_notes:
  register: Modernong Filipino na dignified at madaling maunawaan. Ginamit ang “templo” bilang malinaw na kontekstuwal na katumbas ng “bahay,” at pinanatili sa talababa ang posibleng lawak ng dalawang pariralang tumutukoy sa mga detalye at itinakdang kaayusan ng gusali.
