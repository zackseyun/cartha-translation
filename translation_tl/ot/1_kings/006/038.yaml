  text: וּ/בַ/שָּׁנָה֩ הָ/אַחַ֨ת עֶשְׂרֵ֜ה בְּ/יֶ֣רַח בּ֗וּל ה֚וּא הַ/חֹ֣דֶשׁ הַ/שְּׁמִינִ֔י כָּלָ֣ה הַ/בַּ֔יִת לְ/כָל דְּבָרָ֖י/ו וּ/לְ/כָל משפט/ו וַ/יִּבְנֵ֖/הוּ שֶׁ֥בַע שָׁנִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/038.yaml
  text: And in the eleventh year[a], in the month of Bul (that is, the eighth month), the house was finished in all its parts and according to all its specifications[b]. So he built it in seven years.
translation:
  language: tl
  text: Noong ikalabing-isang taon, sa buwan ng Bul[a]—iyon ay ang ikawalong buwan—natapos ang templo sa lahat ng detalye nito at ayon sa lahat ng itinakdang tuntunin nito.[b] Itinayo niya ito sa loob ng pitong taon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Bul ang sinaunang pangalan ng ikawalong buwan sa kalendaryo ng Israel.
    reason: cultural_note
  - marker: b
    text: Maaari ring isalin na “sa lahat ng bahagi nito at ayon sa buong itinakdang plano nito.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּשָּׁנָה הָאַחַת עֶשְׂרֵה
  choice: nang ikalabing-isang taon
  rationale: Likas na anyong ordinal sa modernong Filipino para sa pabatid na kronolohikal.
- source_word: בְּיֶרַח בּוּל
  choice: sa buwan ng Bul
  rationale: Isinalin ang יֶרַח bilang “buwan” at pinanatili sa transliterasyon ang sinaunang pantanging pangalan na Bul.
- source_word: הוּא הַחֹדֶשׁ הַשְּׁמִינִי
  choice: iyon ay ang ikawalong buwan
  rationale: Malinaw at natural na ipinahahayag ang paliwanag ng Hebreong apposition.
- source_word: כָּלָה הַבַּיִת
  choice: natapos ang templo
  rationale: Ang כָּלָה ay tumutukoy sa pagkakumpleto ng pagtatayo; sa konteksto, ang הַבַּיִת ay ang templong itinatayo, kaya “templo” ang pinakamalinaw na tawag para sa karaniwang mambabasa.
- source_word: לְכָל דְּבָרָיו
  choice: sa lahat ng detalye nito
  rationale: Sa konteksto ng pagtatayo, ang דְּבָרָיו ay tumutukoy sa mga detalye o sangkap ng gusali, hindi sa mga salita.
- source_word: וּלְכָל מִשְׁפָּטוֹ
  choice: ayon sa lahat ng itinakdang tuntunin nito
  rationale: Dito ang מִשְׁפָּט ay tumutukoy sa itinakdang kaayusan, pamantayan, o espesipikasyon ng konstruksiyon; pinananatili ng “tuntunin” ang lawak ng termino nang hindi ito ginagawang legal na hatol.
- source_word: וַיִּבְנֵהוּ שֶׁבַע שָׁנִים
  choice: Kaya pitong taon niya itong itinayo
  rationale: Ipinahahayag ng ayos na ito ang buod at tagal ng pagtatayo habang pinananatili ang tuwirang pahayag na “pitong taon.”
