base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/005.yaml
  text: He built against the wall of the house a structure all around[a], against the walls of the house all around, around both the nave and the inner sanctuary[c][b]; and he made side rooms all around.
translation:
  language: tl
  text: Nagtayo siya ng isang estrukturang nakapalibot[a] na nakadikit sa pader ng templo, sa palibot ng mga pader ng templo—sa palibot ng pangunahing bulwagan[b] at ng panloob na santuwaryo[c]—at gumawa siya ng mga silid sa gilid sa buong palibot.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “isang nakapalibot na karugtong ng gusali.” Bihira ang salitang Hebreo na יצוע at tumutukoy rito sa estrukturang itinayo sa palibot ng mga pader ng templo.
    reason: lexical_alternative
  - marker: b
    text: Ang salitang Hebreo na הֵיכָל ay tumutukoy sa pangunahing bulwagan ng templo, na naiiba sa panloob na santuwaryo.
    reason: cultural_note
  - marker: c
    text: O “Kabanal-banalang Lugar.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶן
  choice: Nagtayo siya
  rationale: Likas na salaysay sa Filipino para sa wayyiqtol ng בנה; malinaw na tumutukoy kay Solomon mula sa konteksto.
- source_word: עַל קִיר הַבַּיִת
  choice: sa tabi ng pader ng templo
  rationale: Sa kontekstong panggusali, ang עַל ay nagpapahiwatig ng pagtatayong nakadikit o katabi ng pader, hindi sa ibabaw nito. Ginamit ang “templo” upang maging malinaw ang tinutukoy na bahay.
- source_word: יצוע
  choice: isang gusaling nakapalibot
  rationale: Bihira at hindi tiyak ang terminong pang-arkitektura; inilalarawan ito bilang nakapalibot na gusali nang hindi ipinapalagay agad na binubuo ito ng mga silid.
- source_word: סָבִיב
  choice: nakapalibot / sa palibot
  rationale: Pinananatili ang diwa at pag-uulit ng ayos na pumapalibot sa templo, ngunit iniangkop sa natural na Filipino.
- source_word: אֶת קִירוֹת הַבַּיִת
  choice: sa mga pader ng templo
  rationale: Pinananatili ang tahasang maramihang “mga pader” at ang pagkakabit ng gusali sa paligid ng mga ito.
- source_word: לַהֵיכָל
  choice: sa pangunahing bulwagan
  rationale: Ang הֵיכָל ay ang pangunahing silid ng templo at naiiba sa panloob na santuwaryo; mas madaling maunawaan ito kaysa sa teknikal na “nave.”
- source_word: וְלַדְּבִיר
  choice: at sa loob na santuwaryo
  rationale: Ipinahihiwatig ng דְּבִיר ang pinakaloob na banal na silid; pinananatili ng salin ang pagkakaiba nito sa pangunahing bulwagan nang hindi ipinapasok sa talata ang mas interpretatibong katawagan.
- source_word: וַיַּעַשׂ צְלָעוֹת
  choice: at gumawa siya ng mga silid sa gilid
  rationale: Bagaman literal na maaaring mangahulugang “mga tagiliran” o “mga tadyang,” sa kontekstong pang-arkitektura ay tumutukoy ito sa mga silid na nasa gilid ng templo.
theological_decisions:
- issue: Pagkatawag sa דְּבִיר
  choice: loob na santuwaryo
  alternative: Kabanal-banalang Lugar
  rationale: Mas malapit sa katawagang pang-arkitektura ng konteksto at hindi labis na tinutukoy ang termino sa pamamagitan ng mas pamilyar ngunit mas interpretatibong katawagan; ibinigay ang alternatibo sa talababa.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “templo” sa halip na literal na “bahay” dahil iyon ang malinaw na tinutukoy sa konteksto. Iniwasan ang teknikal at di-pamilyar na “nave,” habang pinanatili ang pagkakaiba ng pangunahing bulwagan at panloob na santuwaryo. Ang mga markang talababa [a], [b], at [c] ay lahat nasa pangunahing teksto.
