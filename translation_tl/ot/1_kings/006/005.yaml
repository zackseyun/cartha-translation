  terminology: Ang “templo,” “pangunahing bulwagan,” “panloob na santuwaryo,” at “mga silid sa gilid” ay angkop na modernong Filipino. Ginamit ang “estrukturang nakapalibot” para sa bihira at hindi tiyak na יצוע, nang hindi ito napaagang ipinapantay sa mga silid sa gilid.
