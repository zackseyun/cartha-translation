base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/037.yaml
  text: In the fourth year[a], the house of Yahweh was founded in the month of Ziv.
translation:
  language: tl
  text: Noong ikaapat na taon, inilatag ang pundasyon[a] ng bahay ni Yahweh, sa buwan ng Ziv.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “naitatag ang bahay ni Yahweh.”
    reason: Mas malapit itong sumasalamin sa pasibong pandiwang Hebreo na יֻסַּד, na maaaring isaling “naitatag” o “naipundar.”
lexical_decisions:
- source_word: בַּשָּׁנָה הָרְבִיעִית
  choice: Nang ikaapat na taon
  rationale: Tuwirang temporal na parirala ito. Hindi idinagdag ang “ng paghahari ni Solomon” dahil hindi iyon inuulit sa talata, bagaman malinaw sa konteksto.
- source_word: יֻסַּד
  choice: itinatag
  rationale: Ang pasibong anyo ng יסד ay tumutukoy sa pagtatatag o paglalatag ng pundasyon. Ang “itinatag” ay maikli at natural sa Filipino, habang inilalagay sa talababa ang mas kongkretong paglalarawan sa gawaing pagtatayo.
- source_word: בֵּית יְהוָה
  choice: ang bahay ni Yahweh
  rationale: Pinananatili ng “bahay” ang konkretong larawan ng Hebreong בַּיִת; sa konteksto, ito ang templong itinayo para kay Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang personal na pangalan ng Diyos bilang katumbas ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: בְּיֶרַח זִו
  choice: sa buwan ng Ziv
  rationale: Tuwirang isinasalin ang יֶרַח bilang “buwan” at pinananatili ang Ziv bilang pangalan nito. Hindi idinagdag ang “ikalawang buwan,” sapagkat wala iyon sa talatang ito.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Personal na pangalan ang nasa tekstong Hebreo, kaya pinanatili itong “Yahweh” sa halip na gumamit ng pamalit na titulo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang Hebreong larawang “bahay ni Yahweh” sa halip na gawing “templo,” at iniwasang magdagdag ng impormasyong mula lamang sa nakapaligid na konteksto.
