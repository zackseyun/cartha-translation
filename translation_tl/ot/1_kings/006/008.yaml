base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/008.yaml
  text: The entrance to the middle side chamber was on the right side of the house[a], and by winding stairs they went up to the middle story[b], and from the middle to the third.
translation:
  language: tl
  text: Ang pasukan sa gitnang silid sa gilid ay nasa kanang bahagi ng templo, at umaakyat sila sa paikot na hagdan[a] patungo sa gitnang palapag, at mula sa gitnang palapag patungo sa ikatlo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “paikot-ikot na hagdan.” Hindi tiyak ang eksaktong anyo ng salitang Hebreo, ngunit malamang na tumutukoy ito sa paikot o pilipit na hagdanan.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “mula sa gitna patungo sa ikatlo,” ibig sabihin, mula sa gitnang palapag patungo sa ikatlong palapag.
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּתַח
  choice: pasukan
  rationale: Tumutukoy sa bukasan o daanan papasok; natural at malinaw ang “pasukan” sa paglalarawan ng gusali.
- source_word: הַצֵּלָע הַתִּיכֹנָה
  choice: gitnang silid sa gilid
  rationale: Sa konteksto ng templo, ang צֵלָע ay silid o estruktura sa gilid, hindi literal na “tadyang”; pinananatili ng “gitna” ang anyong isahan ng Hebreo.
- source_word: אֶל כֶּתֶף הַבַּיִת הַיְמָנִית
  choice: nasa kanang bahagi ng templo
  rationale: Ang כֶּתֶף ay literal na “balikat” ngunit nangangahulugang gilid sa arkitektura; ang יְמָנִית ay pinanatiling “kanan” sa halip na ipakahulugang “timog.” Ginamit ang “templo” para luminaw ang tinutukoy na bahay sa konteksto.
- source_word: וּבְלוּלִּים
  choice: sa paikot na hagdan
  rationale: Malamang na tumutukoy sa paikot o pilipit na hagdanan; natural sa modernong Filipino ang “paikot na hagdan.”
- source_word: יַעֲלוּ
  choice: umaakyat sila
  rationale: Ang pandiwa ay ikatlong panauhang maramihan at naglalarawan kung paano umaakyat ang mga tao sa gusali.
- source_word: עַל הַתִּיכֹנָה
  choice: patungo sa gitnang palapag
  rationale: Ipinahihiwatig ng pagkakasunod-sunod ng mga antas na ang תִּיכֹנָה rito ay gitnang palapag.
- source_word: וּמִן הַתִּיכֹנָה אֶל הַשְּׁלִשִׁים
  choice: at mula sa gitnang palapag patungo sa ikatlo
  rationale: Malapit ito sa literal na “mula sa gitna patungo sa ikatlo,” habang nililinaw sa pangunahing teksto na mga palapag ang tinutukoy.
