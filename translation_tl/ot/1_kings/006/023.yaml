base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/023.yaml
  text: In the inner sanctuary he made two cherubim of olivewood[b][a], each ten cubits high.
translation:
  language: tl
  text: Sa pinakaloob na santuwaryo[b], gumawa siya ng dalawang kerubin na yari sa kahoy ng olibo. Sampung siko ang taas ng bawat isa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “sampung siko ang taas nito”; ang anyong isahan ay nauunawaang tumutukoy sa bawat isa sa dalawang kerubin.
    reason: lexical_alternative
  - marker: b
    text: O “sa Kabanal-banalang Lugar.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּדְּבִיר
  choice: sa pinakaloob na santuwaryo
  rationale: Tumutukoy ang דְּבִיר sa pinakaloob na silid ng templo. Malinaw at likas sa modernong Filipino ang “pinakaloob na santuwaryo,” nang hindi labis na nagpapasok ng teknikal na katawagan.
- source_word: כְרוּבִים
  choice: mga kerubin
  rationale: Pinananatili ng “kerubin” ang natatanging katawagang biblikal para sa mga nilalang na ito at likas na ginagamitan ng “mga” bilang panandang maramihan sa Filipino.
- source_word: עֲצֵי שָׁמֶן
  choice: kahoy ng olibo
  rationale: Ang parirala ay tumutukoy sa kahoy mula sa punong olibo. Ang “kahoy ng olibo” ay malinaw at natural na katumbas sa Filipino.
- source_word: עֶשֶׂר אַמּוֹת
  choice: sampung siko
  rationale: Ang אַמָּה ay sinaunang yunit na karaniwang tinutumbasan ng “siko” sa mga saling Filipino ng Bibliya.
- source_word: קוֹמָתוֹ
  choice: ang taas ng bawat isa
  rationale: Literal na isahan ang hulaping “taas nito,” ngunit sa konteksto ay distributibo at tumutukoy sa bawat isa sa dalawang kerubin. Ipinahahayag ito nang malinaw sa natural na Filipino.
- source_word: וַיַּעַשׂ
  choice: gumawa siya
  rationale: Ang עשה ay karaniwang pandiwang “gumawa.” Tuwiran at likas ang pagkakasaling ito sa Filipino.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at angkop sa pagbasa ng karaniwang mambabasa. Ginamit ang “santuwaryo” upang maipakita ang kontekstong panrelihiyon ng pinakaloob na silid, at pinanatili ang sinaunang sukat na “siko.”
