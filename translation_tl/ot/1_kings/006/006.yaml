base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/006.yaml
  text: The lowest story was five cubits wide[a], the middle one six cubits wide, and the third seven cubits wide; for he made offsets around the outside of the temple[b], so that the beams would not be inserted into the walls of the temple.
translation:
  language: tl
  text: Ang pinakamababang palapag ng gusaling nasa gilid ay limang siko ang lapad, ang gitnang palapag ay anim na siko ang lapad, at ang ikatlong palapag ay pitong siko ang lapad. Sapagkat gumawa siya ng mga nakaurong na bahagi[a] sa palibot ng labas ng templo, upang hindi maikabit ang mga biga sa mga pader ng templo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga pasamano,” “mga uka,” o “mga urong” para sa bahaging ito ng pader.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “upang hindi kumapit sa mga pader ng bahay.” Hindi tahasang binabanggit sa Hebreo ang “mga biga”; ipinahihiwatig ang mga ito ng pagkakagawa ng gusaling nasa gilid.
    reason: lexical_alternative
lexical_decisions:
- source_word: היצוע
  choice: palapag ng gusaling nasa gilid
  rationale: Sa konteksto ng pagtatayo ng templo, tumutukoy ito sa bahaging gusali sa gilid na may magkakapatong na antas. Nililinaw ng parirala ang estruktura nang hindi ito ipinagkakamaling palapag ng mismong pangunahing santuwaryo.
- source_word: הַתַּחְתֹּנָה
  choice: pinakamababang
  rationale: Ang superlatibong anyo ay angkop sa sunod-sunod na pinakamababa, gitna, at ikatlong palapag.
- source_word: בָּאַמָּה
  choice: siko
  rationale: Pinananatili ang sinaunang yunit ng sukat sa halip na gawing makabagong sukat.
- source_word: רָחְבָּהּ
  choice: ang lapad
  rationale: Natural sa Filipino ang hulma na 'limang siko ang lapad' at tumpak nitong ipinapahayag ang sukat.
- source_word: הַתִּיכֹנָה
  choice: gitnang palapag
  rationale: Tumutukoy pabalik sa antas ng estruktura; inuulit ang 'palapag' upang maging malinaw sa Filipino.
- source_word: הַשְּׁלִישִׁית
  choice: ikatlong palapag
  rationale: Pinananatili ang ordinal na paglalarawan ng ikatlong antas.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala nito ang paliwanag kung bakit palapad nang palapad ang mga antas.
- source_word: מִגְרָעוֹת
  choice: mga paurong na baytang
  rationale: Inilalarawan nito ang sunod-sunod na pag-urong o sapin sa panlabas na pader na nagsisilbing tuntungan ng estruktura. Ang talababa ay nagpapanatili ng iba pang posibleng terminong pang-arkitektura.
- source_word: נָתַן לַבַּיִת סָבִיב חוּצָה
  choice: gumawa siya ... sa palibot ng labas ng templo
  rationale: Idyomatikong isinasalin ang literal na 'naglagay/nagbigay sa bahay sa palibot sa labas'; ang 'templo' ang malinaw na tinutukoy ng bahay sa konteksto.
- source_word: לְבִלְתִּי אֲחֹז
  choice: upang hindi maikabit ang mga biga
  rationale: Ang infinitibo ay nagsasaad ng layunin. Ipinahihiwatig ng kontekstong pang-arkitektura na ang mga biga ang hindi dapat kumapit o maikabit, ngunit itinatala sa talababa na hindi tahasang binabanggit ang mga ito sa Hebreo.
- source_word: בְּקִירוֹת הַבָּיִת
  choice: sa mga pader ng templo
  rationale: Ang 'templo' ang referent ng 'bahay,' at natural sa Filipino ang 'maikabit ... sa mga pader.'
