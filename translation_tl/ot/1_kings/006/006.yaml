  naturalness: Malinaw at marangal ang kabuuang Filipino. Ang “nakaurong na bahagi” ay mas natural at hindi gaanong mapanlinlang kaysa “paurong na baytang.”
  terminology: Ang “palapag,” “siko,” “templo,” at “mga biga” ay angkop sa konteksto. Pinananatili ng talababa ang katotohanang ipinahihiwatig lamang ng konteksto ang “mga biga.”
