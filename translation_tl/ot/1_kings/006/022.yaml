base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/022.yaml
  text: He overlaid the whole house with gold[a], until the whole house was finished[b]; and he overlaid with gold the whole altar that belonged to the inner sanctuary.
translation:
  language: tl
  text: Binalutan niya ng ginto ang buong templo, hanggang sa ganap na matapos ang buong templo; at binalutan din niya ng ginto ang buong altar na kaugnay ng kaloob-loobang santuwaryo.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “na para sa kaloob-loobang santuwaryo,” “na nasa kaloob-loobang santuwaryo,” o “nasa harap ng kaloob-loobang santuwaryo.” Maaaring tumukoy ang Hebreo sa kaugnayan o sa kinalalagyan ng altar.
    reason: lexical_alternative
  - marker: b
    text: 'Hebreo: debir, ang pinakaloob na santuwaryo; ayon sa tradisyon, “Kabanal-banalang Lugar.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבַּיִת
  choice: templo
  rationale: Literal itong “bahay,” ngunit sa konteksto ng pagtatayo ni Solomon, malinaw na ang tinutukoy ay ang templo. Mas natural at agad mauunawaan sa modernong Filipino ang “templo.”
- source_word: צִפָּה
  choice: binalutan
  rationale: Tumutukoy ang pandiwa sa paglalagay ng isang materyal bilang sapin sa ibabaw, dito ay ginto. Ang “binalutan” ay likas na Filipino para sa pag-o-overlay o paglalapat ng ginto.
- source_word: זָהָב
  choice: ginto
  rationale: Tuwiran at karaniwang katumbas ng materyal na tinutukoy.
- source_word: עַד תֹּם
  choice: hanggang sa ganap na matapos
  rationale: Ipinahahayag ng parirala ang pag-abot sa lubos na pagkakatapos ng gawain sa buong templo.
- source_word: כָּל
  choice: buong
  rationale: Pinananatili ang paulit-ulit na diin sa kabuuan ng templo at ng altar.
- source_word: הַמִּזְבֵּחַ
  choice: altar
  rationale: Karaniwan, malinaw, at tanggap na salin sa Filipino para sa altar na ginagamit sa pagsamba.
- source_word: אֲשֶׁר לַדְּבִיר
  choice: na kaugnay ng kaloob-loobang santuwaryo
  rationale: Hindi tiyak na lokasyon lamang ang ipinahihiwatig ng ל; maaari itong tumukoy sa kaugnayan, pag-aari, o kinalalagyan. Hindi labis na nililinaw ng “kaugnay ng” ang tunay na kalabuan.
- source_word: דְּבִיר
  choice: kaloob-loobang santuwaryo
  rationale: Malinaw na katawagan sa pinakaloob na banal na silid ng templo at mas madaling maunawaan kaysa sa isang transliterasyon o makalumang termino.
theological_decisions:
- issue: Ugnayan ng altar sa דְּבִיר
  choice: na kaugnay ng kaloob-loobang santuwaryo
  alternative: na nasa kaloob-loobang santuwaryo / na para sa kaloob-loobang santuwaryo / nasa harap ng kaloob-loobang santuwaryo
  rationale: Maaaring ipahiwatig ng Hebreong ל ang pag-uugnay, pag-aari, o kaugnayang panlunan. Pinananatili ng pangunahing salin ang kalabuan sa halip na magtakda ng tiyak na lokasyon o gamit.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “templo” sa halip na literal na “bahay” upang maging likas at tiyak sa konteksto, at “kaloob-loobang santuwaryo” upang ilarawan ang debir nang hindi umaasa sa makaluma o denominasyonal na katawagan.
