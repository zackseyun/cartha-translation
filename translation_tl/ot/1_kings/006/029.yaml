  to: Nililok niya sa lahat ng dingding ng templo[a], sa buong palibot, ang mga inukit na larawan ng mga kerubin, mga puno ng palma, at namumukadkad na mga bulaklak[b], kapwa sa panloob at panlabas na bahagi[c].
