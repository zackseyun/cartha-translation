base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/029.yaml
  text: He carved all the walls of the house all around with engraved figures of cherubim[a], palm trees, and open flowers[c][b], on the inner and outer walls.
translation:
  language: tl
  text: Nililok niya sa lahat ng dingding ng templo[a], sa buong palibot, ang mga inukit na larawan ng mga kerubin, mga puno ng palma, at namumukadkad na mga bulaklak[b], kapwa sa panloob at panlabas na bahagi[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal na “bahay,” isang karaniwang tawag dito sa gusali ng templo.
    reason: cultural_note
  - marker: b
    text: Maaari ring “mga bukás na bulaklak” o “mga bulaklak na nagbubukadkad.” Tumutukoy ang Hebreo sa palamuting hugis-bulaklak, ngunit hindi tiyak ang eksaktong anyo nito.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring unawain na “sa loob at sa labas.” Sa kontekstong ito, malamang na tumutukoy ito sa panloob at panlabas na mga bahagi ng santuwaryo.
    reason: alternative_reading
lexical_decisions:
- source_word: קִירוֹת הַבַּיִת
  choice: mga dingding ng templo
  rationale: Literal na “mga dingding ng bahay,” ngunit sa konteksto ang בַּיִת ay ang templong itinatayo ni Solomon. Mas malinaw sa karaniwang mambabasang Filipino ang “templo,” habang itinatala sa talababa ang literal na salita.
- source_word: מֵסַב
  choice: sa buong palibot
  rationale: Ipinahihiwatig nito na ang palamuti ay nakapalibot o nasa lahat ng panig; natural at malinaw ang pariralang Filipino.
- source_word: קָלַע פִּתּוּחֵי מִקְלְעוֹת
  choice: nililok ... ng mga larawan
  rationale: Ang magkakaugnay na mga salitang Hebreo ay tumutukoy sa masining na pag-ukit. Iniiwasan ng salin ang mabigat na pag-uulit ng “ukit na mga ukit” ngunit pinananatili ang kilos at ang anyong inilalarawan.
- source_word: כְּרוּבִים
  choice: mga kerubin
  rationale: Karaniwang saling-transliterasyon sa Filipino para sa mga makalangit na nilalang na inilalarawan sa santuwaryo; pinananatili ng “mga” ang anyong maramihan.
- source_word: תִמֹרֹת
  choice: mga puno ng palma
  rationale: Tumutukoy ito sa mga anyo o motif ng punong palma sa palamuting nililok. Ang tuwirang katawagan ay malinaw at likas sa Filipino.
- source_word: פְטוּרֵי צִצִּים
  choice: namumukadkad na mga bulaklak
  rationale: Ipinahihiwatig ng parirala ang mga palamuting bulaklak na bukás o nagbubukadkad. Dahil hindi tiyak ang eksaktong masining o botanikal na anyo, inilalahad ang kawalang-katiyakan sa talababa.
- source_word: מִלִּפְנִים וְלַחִיצוֹן
  choice: kapwa sa panloob at panlabas na bahagi
  rationale: Pinananatili nito ang pagtutunggali ng panloob at panlabas nang hindi sapilitang tinutukoy kung “mga silid,” “mga dingding,” o pangkalahatang mga bahagi ang ibig sabihin. Ang talababa ay nagbibigay ng malamang na kahulugang pang-arkitektura.
