translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “templo” sa pangunahing teksto para sa linaw, at pinanatili sa talababa ang literal na “bahay.” Hindi ginawang mas tiyak kaysa sa Hebreo ang huling parirala; “mga bahagi” ang ginamit upang mapanatili ang tunay na kalabuan nito.
