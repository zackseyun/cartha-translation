translation_notes:
  register: Modernong Filipino na malinaw at marangal, na angkop sa paglalarawan ng sukat sa gusali. Ginamit ang “haba” at “kabuuang haba” upang maging likas sa Filipino ang mga sugnay na nominal sa Hebreo. Inilagay ang talababa sa pariralang mismong nililinaw nito.
