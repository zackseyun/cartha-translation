base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/024.yaml
  text: And five cubits was the one wing of the cherub[a], and five cubits the second wing of the cherub; ten cubits from the end of its wings to the end of its wings.
translation:
  language: tl
  text: Limang siko ang haba ng isang pakpak ng kerubin, at limang siko ang haba ng ikalawang pakpak nito. Sampung siko ang sukat mula sa dulo ng isang pakpak nito hanggang sa dulo ng kabila.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa literal: “mula sa dulo ng mga pakpak nito hanggang sa dulo ng mga pakpak nito,” ibig sabihin, ang buong layo mula sa dulo ng isang pakpak hanggang sa dulo ng kabila.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חָמֵשׁ אַמּוֹת
  choice: limang siko
  rationale: Ang “siko” ang nakasanayang katumbas sa Filipino ng sinaunang yunit na אַמָּה (cubit); pinananatili nito ang yunit ng pinagmulang teksto sa halip na tantiyahin sa modernong sukat.
- source_word: כְּנַף
  choice: pakpak
  rationale: Sa paglalarawan sa inukit na kerubin, malinaw na pakpak ang tinutukoy ng כָּנָף.
- source_word: הַכְּרוּב
  choice: ang kerubin
  rationale: Tumutukoy ang anyong isahan sa bawat isa sa mga inukit na makalangit na nilalang; “kerubin” ang pamilyar at marangal na terminong biblikal sa Filipino.
- source_word: הָאֶחָת
  choice: isang pakpak
  rationale: Ang Hebreo ay literal na “ang isa,” hindi tahasang “ang una”; natural na naipapahayag ito sa Filipino bilang “isang pakpak.”
- source_word: הַשֵּׁנִית
  choice: ikalawang pakpak
  rationale: Tuwirang isinasalin ang ordinal na pambabaeng anyo na tumutugma sa “pakpak.”
- source_word: עֶשֶׂר אַמּוֹת
  choice: sampung siko ang kabuuang haba
  rationale: Ipinahahayag ng parirala ang kabuuang sukat ng nakabukang dalawang pakpak; idinagdag ang “kabuuang haba” upang maging malinaw at natural ang sukat sa Filipino.
- source_word: מִקְצוֹת כְּנָפָיו וְעַד קְצוֹת כְּנָפָיו
  choice: mula sa dulo ng isang pakpak nito hanggang sa dulo ng kabila
  rationale: Natural nitong ipinahahayag sa Filipino ang lawak mula sa isang dulo ng mga pakpak hanggang sa kabilang dulo, nang hindi binabago ang sukat.
- source_word: כְּנָפָיו
  choice: mga pakpak nito
  rationale: Ang “nito” ay angkop sa inukit na larawan at hindi nagpapahiwatig ng kasariang hindi mahalaga sa konteksto.
