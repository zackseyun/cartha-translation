  text: He made for the house windows with recessed frames[a].
translation:
  language: tl
  text: Gumawa siya ng mga bintana para sa templo, na may nakalubog na mga hamba at nakasara[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bihira at hindi tiyak ang mga terminong Hebreo rito na tumutukoy sa anyo ng mga bintana. Maaari ring unawain ang parirala bilang “mga bintanang may pahilis o tabas na mga balangkas,” “mga bintanang papakitid ang mga hamba,” o “mga bintanang maluwang sa loob at makitid sa labas.” Ang huling salita ay maaari ring mangahulugang nakapirmi, nasarhan, o may takip.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Gumawa siya
  rationale: Ang wayyiqtol ng עשה ay karaniwang pandiwang pasalaysay na nangangahulugang “at gumawa siya”; hindi na isinama ang pangatnig upang maging natural sa Filipino.
- source_word: לַבָּיִת
  choice: para sa templo
  rationale: Ang ל ay tumutukoy sa layon ng paggawa, “para sa,” at ang בַּיִת sa kontekstong ito ay ang templong itinatayo ni Solomon. Mas malinaw sa karaniwang mambabasa ang “templo” kaysa literal na “bahay.”
- source_word: חַלּוֹנֵי
  choice: mga bintana
  rationale: Karaniwang kahulugan ng pangmaramihang construct ng חַלּוֹן.
- source_word: שְׁקֻפִים
  choice: may palubog na mga hamba
  rationale: Bihira at di-tiyak ang teknikal na terminong pang-arkitektura. Ipinahihiwatig nito ang mga hamba o balangkas na pahilis, papakitid, o nakalubog; pinili ang nababasang “palubog na mga hamba” nang hindi nag-aangking tiyak ang rekonstruksiyon.
- source_word: אֲטֻמִים
  choice: hindi tahasang ibinukod bilang hiwalay na parirala
  rationale: Ang passive participle mula sa אטם ay maaaring mangahulugang sarado, nakapirmi, o nasarhan, ngunit mahirap tiyakin ang eksaktong ugnayan nito sa naunang bihirang terminong pang-arkitektura. Isinama ang pangkalahatang ideya sa paglalarawan ng mga hamba at inilahad ang mga alternatibo sa talababa.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “templo” upang linawin ang kontekstuwal na kahulugan ng “bahay,” habang pinanatili sa talababa ang tunay na kawalang-katiyakan ng bihirang paglalarawang pang-arkitektura.
