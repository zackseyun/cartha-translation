base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/020.yaml
  text: In front of the inner sanctuary was twenty cubits in length[a], twenty cubits in width, and twenty cubits in its height. He overlaid it with pure gold[b], and he overlaid the cedar altar.
translation:
  language: tl
  text: Ang pinakaloob na santuwaryo[a] ay dalawampung siko ang haba, dalawampung siko ang lapad, at dalawampung siko ang taas. Binalutan niya ito ng dalisay na ginto,[b] at binalutan din niya ang altar na yari sa sedro.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “At sa harap ng pinakaloob na santuwaryo.” Siksik ang pagkakabuo ng Hebreo; maaari ring unawaing ang bahaging nasa harap nito ang inilalarawan.
    reason: textual_ambiguity
  - marker: b
    text: Maaari ring “pinong ginto.” Ang pariralang Hebreo ay tumutukoy sa mataas na uri at dinalisay na ginto.
    reason: lexical_alternative
  - marker: c
    text: O “altar na sedro.” Ibig sabihin, altar na yari sa kahoy na sedro.
    reason: lexical_clarification
lexical_decisions:
- source_word: וְלִפְנֵי הַדְּבִיר
  choice: Ang pinakaloob na santuwaryo
  rationale: Ang דְּבִיר ay tumutukoy sa pinakaloob na banal na silid ng templo. Siksik at eliptikal ang pariralang may לִפְנֵי; ayon sa konteksto, ang mga sukat at ang kasunod na panghalip ay tumutukoy sa pinakaloob na santuwaryo. Inilagay sa talababa ang mas literal na pagbasa upang mapanatili ang tunay na sintaktikong kalabuan.
- source_word: עֶשְׂרִים אַמָּה ... אֹרֶךְ / רֹחַב / קוֹמָתוֹ
  choice: dalawampung siko ang haba, dalawampung siko ang lapad, at dalawampung siko ang taas
  rationale: Natural itong pormula ng pagsukat sa modernong Tagalog. Pinanatili ang sinaunang yunit na 'siko' sa halip na gumawa ng di-tiyak na modernong konbersiyon.
- source_word: וַיְצַפֵּהוּ
  choice: Binalutan niya ito
  rationale: Sa paglalarawan ng templo, ang צפה ay paglalapat o pagbabalot ng mamahaling metal sa ibabaw ng kahoy. Ang 'binalutan' ay malinaw at likas sa Tagalog.
- source_word: זָהָב סָגוּר
  choice: dalisay na ginto
  rationale: Ang parirala ay tumutukoy sa mataas na uri o pinong ginto. Ang 'dalisay na ginto' ay dignificado at madaling maunawaan; ang 'pinong ginto' ay inilagay bilang leksikal na alternatibo sa talababa.
- source_word: וַיְצַף מִזְבֵּחַ אָרֶז
  choice: at binalutan din niya ang altar na yari sa sedro
  rationale: Ang pagkakasunod ng mga pangngalan ay likas na mauunawaan bilang altar na gawa sa kahoy na sedro. Hindi muling tahasang binanggit ang ginto sapagkat hindi rin ito inuulit sa sugnay na Hebreo, bagaman ipinahihiwatig ito ng naunang sugnay.
theological_decisions:
- issue: Pagkakakilanlan ng sinusukat sa eliptikal na pariralang וְלִפְנֵי הַדְּבִיר
  choice: Ang pinakaloob na santuwaryo ang tuwirang inilagay na sinusukat sa pangunahing teksto.
  alternative: Ang nasa harap ng pinakaloob na santuwaryo ang sinusukat.
  rationale: Ang mga sukat na kubiko at ang kasunod na pagbabalot nito ng ginto ay pinakamalinaw na tumutukoy sa דְּבִיר sa konteksto. Gayunman, hindi itinago ang literal na puwersa ng לִפְנֵי; nakasaad ang alternatibo sa talababa sa halip na lubusang lutasin ang siksik na sintaks.
translation_notes:
  register: Modernong Filipino Tagalog na dignificado ngunit madaling maunawaan. Ginamit ang 'pinakaloob na santuwaryo' para sa teknikal na bahagi ng templo, 'siko' para mapanatili ang sinaunang yunit, at 'sedro' bilang karaniwang anyong Filipino ng cedar. Iniwasan ang sobrang teknikal o denominasyonal na terminolohiya.
