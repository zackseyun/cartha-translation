base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/034.yaml
  text: and two doors of cypress wood[a]; the one door had two folding leaves[b], and the second door had two folding leaves.
translation:
  language: tl
  text: at dalawang pinto na yari sa kahoy na sipres.[a] Ang unang pinto ay may dalawang natitiklop na panel,[b] at ang ikalawang pinto ay may dalawang natitiklop na panel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ayon sa tradisyon, “kahoy na fir”; malamang na tumutukoy ang salitang Hebreo sa sipres o sa isang kahawig na punong conifer.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “dalawang bahaging umiikot.” Bihira ang mga terminong pang-arkitektura sa Hebreo, at hindi tiyak kung natitiklop o umiikot ang mga panel ng pinto.
    reason: lexical_alternative
lexical_decisions:
- source_word: דַלְתוֹת
  choice: mga pinto
  rationale: Tumutukoy ang pangmaramihang anyo sa dalawang buháy o kabuuang pinto; natural at malinaw sa modernong Filipino ang “mga pinto.”
- source_word: עֲצֵי בְרוֹשִׁים
  choice: kahoy na sipres
  rationale: Malamang na sipres o isang kahawig na punong conifer ang בְּרוֹשׁ; pinananatili ng salin ang karaniwang makabagong pagkilala habang inilalagay sa talababa ang tradisyonal na alternatibo.
- source_word: צְלָעִים / קְלָעִים
  choice: mga panel
  rationale: Bihira at teknikal ang mga salitang pang-arkitekturang ito. Sa konteksto, tumutukoy ang mga ito sa dalawang seksiyon o leaf ng bawat pinto; mas madaling maunawaan sa Filipino ang “mga panel.”
- source_word: גְּלִילִים
  choice: natitiklop
  rationale: Ipinahihiwatig ng salita ang pag-ikot o pagtiklop ng mga bahagi ng pinto. Ang “natitiklop” ay natural na paglalarawan sa malamang na gamit ng magkakabit na panel, ngunit kinikilala sa talababa ang alternatibong “umiikot.”
- source_word: הַדֶּלֶת הָאַחַת / הַדֶּלֶת הַשֵּׁנִית
  choice: ang unang pinto / ang ikalawang pinto
  rationale: Malinaw na ipinapakita nito ang paghahambing ng dalawang pinto at natural itong basahin sa Filipino.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang pag-uulit ng paglalarawan sa dalawang pinto upang masalamin ang Hebreo, habang ginamit ang “panel” bilang karaniwang salitang nauunawaan para sa teknikal na mga bahagi ng pinto.
