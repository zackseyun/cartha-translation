translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kahoy ng olibo” sa halip na teknikal na anyo, at pinanatili ang “kerubin” bilang nakaugaliang terminong biblikal. Hinati sa tatlong pangungusap ang mahabang sugnay na Hebreo upang maging madaling basahin nang hindi binabago ang pagkakasunod ng mga kilos.
