  text: Also[a], the two doors were of olivewood, and he carved on them engravings of cherubim and palm trees and open flowers, and overlaid them with gold[b]; and he spread the gold over the cherubim and over the palm trees.
translation:
  language: tl
  text: Ang dalawang pinto ay yari rin sa kahoy ng olibo. Inukitan niya ang mga ito ng mga kerubin, mga puno ng palma, at mga bulaklak na nakabuka[a], at binalutan niya ng ginto ang mga ito. Inilapat niya ang ginto sa ibabaw ng mga kerubin at ng mga puno ng palma.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga ukit ng kerubin, mga puno ng palma, at mga bulaklak na namumukadkad.”
    reason: lexical_alternative
  - marker: b
    text: Ang pandiwang Hebreo ay literal na “pinababa” o “ipinababa,” na dito ay naglalarawan sa paglalapat ng ginto sa ibabaw ng mga inukit na larawan.
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּלְתוֹת עֲצֵי שֶׁמֶן
  choice: mga pinto ... yari sa kahoy ng olibo
  rationale: Ang דַּלְתוֹת ay mga pinto o panel ng pinto, at ang עֲצֵי שֶׁמֶן ay tumutukoy sa kahoy ng olibo. Likas at malinaw sa modernong Filipino ang pariralang ito.
- source_word: וּשְׁתֵּי
  choice: Ang dalawang ... ay ... rin
  rationale: Ipinahahayag ng “rin” ang pandagdag na ugnayan ng ו sa naunang paglalarawan nang hindi nagiging pilit ang pangungusap.
- source_word: וְקָלַע ... מִקְלְעוֹת
  choice: Inukitan ... ng mga larawan
  rationale: Tumutukoy ang pandiwa at pangngalan sa pag-ukit ng mga disenyong pandekorasyon sa kahoy. Iniwasan nito ang mabigat na pag-uulit na “inukitan ng mga ukit.”
- source_word: כְּרוּבִים
  choice: mga kerubin
  rationale: Pinananatili ang nakaugaliang transliterasyon para sa mga nilalang na kaugnay ng banal na trono at templo; hindi ito inilalarawan bilang maliliit na anghel.
- source_word: תִמֹרוֹת
  choice: mga puno ng palma
  rationale: Sa konteksto ng dekorasyon sa templo, tumutukoy ito sa mga larawang anyong puno ng palma.
- source_word: פְּטוּרֵי צִצִּים
  choice: mga bulaklak na nakabuka
  rationale: Ipinahahayag nito ang mga disenyong bulaklak na bukadkad nang hindi tinutukoy ang isang uri ng halaman na hindi naman binanggit sa Hebreo.
- source_word: וְצִפָּה זָהָב
  choice: binalutan ... ng ginto
  rationale: Ang צפה sa konstruksiyong ito ay paglalagay ng sapin o balot na metal sa isang bagay; natural at tiyak sa Filipino ang “binalutan ng ginto.”
- source_word: וַיָּרֶד ... אֶת־הַזָּהָב
  choice: Inilapat niya ang ginto
  rationale: Di-karaniwan ang konstruksiyon ng ירד, na literal na may diwang “pinababa.” Sa konteksto, inilalarawan nito ang maingat na paglalapat ng ginto sa ibabaw ng mga inukit.
- source_word: עַל הַכְּרוּבִים וְעַל הַתִּמֹרוֹת
  choice: sa mga kerubin at sa mga puno ng palma
  rationale: Ang pag-uulit ng “sa” ay sumasalamin sa inuulit na עַל at nililinaw ang dalawang uring ukit na nilagyan ng ginto.
