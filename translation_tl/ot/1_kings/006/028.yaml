  text: And he overlaid the cherubim with gold[a].
translation:
  language: tl
  text: At binalutan niya ng ginto ang mga kerubin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring, “tinakpan niya ng ginto ang mga kerubin” o “kinalupkupan niya ng ginto ang mga kerubin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַף
  choice: binalutan
  rationale: Sa konteksto ng pagtatayo ng templo, ang צפה ay tumutukoy sa pagtatakip sa isang bagay ng isang suson ng materyal, dito ay ginto. Likas at malinaw sa modernong Filipino ang “binalutan” para sa ganitong paglalagay ng panlabas na takip.
- source_word: אֶת
  choice: hindi isinalin bilang hiwalay na salita
  rationale: Pananda ito ng tiyak na layon sa Hebreo; ipinahahayag na ng ayos at mga pananda sa pangungusap na Filipino ang tungkulin nito.
- source_word: הַכְּרוּבִים
  choice: ang mga kerubin
  rationale: Ang “mga kerubin” ang kinikilalang katawagang biblikal sa Filipino at pinananatili nito ang sagradong konteksto ng mga nilalang na inilalarawan sa templo.
- source_word: זָהָב
  choice: ng ginto
  rationale: Tinutukoy nito ang materyal na ipinambalot. Ang pariralang “binalutan ... ng ginto” ay natural na katumbas ng konstruksyong Hebreo.
theological_decisions: []
translation_notes:
  register: Maikli, marangal, at likas sa modernong Filipino. Ginamit ang “kerubin” bilang nakaugaliang katawagang biblikal at pinanatili sa talababa ang mga posibleng alternatibo para sa paraan ng paglalagay ng ginto.
