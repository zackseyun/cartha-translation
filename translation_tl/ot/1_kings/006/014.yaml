  text: So Solomon built the house and finished it[a].
translation:
  language: tl
  text: Itinayo ni Solomon ang bahay at tinapos niya ito.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang templo.” Literal na “ang bahay” ang nasa Hebreo, isang karaniwang katawagan sa templo sa kontekstong ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶן
  choice: itinayo
  rationale: Ang Qal wayyiqtol ng בנה ay nagsasalaysay ng natapos na kilos sa sunod-sunod na salaysay. Likas sa Filipino ang “itinayo” para sa pagtatayo ng isang gusali.
- source_word: שְׁלֹמֹה
  choice: Solomon
  rationale: Ginamit ang nakasanayang anyo ng pangalan sa mga saling Filipino.
- source_word: הַבַּיִת
  choice: ang bahay
  rationale: Literal na nangangahulugang “bahay” ang בַּיִת. Sa kontekstong ito, tumutukoy ito sa templo, ngunit pinanatili sa pangunahing teksto ang mismong katawagan ng Hebreo.
- source_word: וַיְכַלֵּהוּ
  choice: at tinapos niya ito
  rationale: Ang Piel ng כלה na may hulaping panghalip na panlalaking isahan ay nangangahulugang tapusin o lubusang buuin ang isang bagay; ang “ito” ay tumutukoy pabalik sa bahay.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang literal na “bahay” upang masalamin ang katawagan sa Hebreo, habang nililinaw sa talababa na templo ang tinutukoy.
