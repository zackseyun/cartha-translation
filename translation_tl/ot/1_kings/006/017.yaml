  text: And the house[a], that is, the nave before the inner sanctuary, was forty cubits long.
translation:
  language: tl
  text: At ang bahay[a]—iyon ay, ang pangunahing bulwagan sa harap ng santuwaryo sa loob—ay apatnapung siko ang haba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang pangunahing bulwagan sa harap nito.” Mas tiyak na tinutukoy ng Hebreo ang “bahay” bilang ang הֵיכָל, ang pangunahing silid sa harap ng santuwaryo sa loob.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַרְבָּעִים
  choice: At ... apatnapu
  rationale: Pinag-uugnay ng וְ ang talata sa naunang paglalarawan ng gusali, at tuwirang isinasalin ang bilang na אַרְבָּעִים bilang “apatnapu.”
- source_word: בָּ/אַמָּה
  choice: siko ang haba
  rationale: Ang אַמָּה ay karaniwang sukat na “siko.” Idinagdag ang “ang haba” upang likas na maipahayag sa Tagalog ang dimensiyong tinutukoy ng konteksto.
- source_word: הָיָה
  choice: ay
  rationale: Ang payak na panandang panaguri ay natural na katumbas sa Tagalog ng pandiwang Hebreo na nagsasaad ng kalagayan o sukat.
- source_word: הַ/בָּיִת
  choice: ang bahay
  rationale: Pinananatili ng “bahay” ang literal at karaniwang katawagan ng Hebreo para sa templo, habang nililinaw ng kasunod na parirala ang partikular na bahagi ng gusali.
- source_word: ה֖וּא
  choice: samakatuwid
  rationale: Dito, ang panghalip ay nagpapakilala o nagpapaliwanag sa “bahay” bilang ang הֵיכָל; ipinahahayag ng “samakatuwid” ang puwersang ito nang natural.
- source_word: הַ/הֵיכָל
  choice: ang pangunahing bulwagan
  rationale: Sa kontekstong ito, ang הֵיכָל ay ang pangunahing silid ng templo na hiwalay sa santuwaryo sa loob. Mas madaling maunawaan ng karaniwang mambabasa ang “pangunahing bulwagan” kaysa sa teknikal na katawagang arkitektural.
- source_word: לִ/פְנָֽ/י
  choice: sa harap ng santuwaryo sa loob
  rationale: Ang anyo ay nangangahulugang “sa harap ng” o “bago sumapit sa,” at ayon sa naunang talata ay tumutukoy sa santuwaryo sa loob. Nililinaw ang tinutukoy nang hindi binabago ang ugnayang spatial.
theological_decisions: []
translation_notes:
  register: Makabago at marangal na Filipino. Pinanatili ang literal na “bahay” bilang katawagan sa templo, ngunit ginamit ang malinaw na “pangunahing bulwagan” para sa terminong arkitektural. Ang “santuwaryo sa loob” ay nagbibigay ng sapat na kontekstuwal na paglilinaw nang hindi gumagamit ng katawagang maaaring magpasok ng mas huling teknikal na kahulugan.
