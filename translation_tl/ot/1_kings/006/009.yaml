  text: So he built the house and finished it, and he covered the house with beams and rows of cedar.
translation:
  language: tl
  text: Kaya itinayo niya ang templo at tinapos ito. Tinakpan niya ang templo ng mga biga at mga hanay, na kapuwa gawa sa sedro.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַבַּיִת
  choice: templo
  rationale: Bagaman literal na “bahay,” ang tinutukoy sa konteksto ay ang templong itinayo ni Solomon; “templo” ang natural at malinaw na katawagan sa modernong Tagalog.
- source_word: וַיְכַלֵּהוּ
  choice: tinapos ito
  rationale: Tuwirang ipinahahayag ang pagkumpleto sa gusali at pinananatili ang panghalip na tumutukoy sa templo.
- source_word: וַיִּסְפֹּן
  choice: Tinakpan niya
  rationale: Ang pandiwa ay tumutukoy sa pagtatakip o paglalagay ng sapin sa gusali, malamang sa bahaging bubong o kisame; hindi dinaragdagan ng salin ang espesipikong bahaging hindi tahasang sinabi.
- source_word: גֵּבִים וּשְׂדֵרֹת
  choice: mga biga at mga hanay
  rationale: Ang unang termino ay tumutukoy sa mga biga o kasangkapang pang-estruktura; ang ikalawa ay literal na mga hanay. Pinananatili ang bihirang arkitektural na paglalarawan nang hindi ito ginagawang “tabla” nang walang katiyakan.
- source_word: בָּאֲרָזִים
  choice: na yari sa sedro
  rationale: Ipinahahayag na sedro ang materyal ng mga biga at hanay sa natural na Tagalog.
