    issue: Hindi malinaw ang saklaw ng “na yari sa sedro.”
    rationale: Sa Tagalog, ang modifier pagkatapos ng huling bahagi ng tambalang pangngalan ay madaling mabasa bilang para lamang sa “mga hanay.” Sa Hebreo, ang pariralang “sa/mula sa mga sedro” ay sumasaklaw sa mga biga at mga hanay.
  revised_text: Kaya itinayo niya ang templo at tinapos ito. Tinakpan niya ang templo ng mga biga at mga hanay, na kapuwa gawa sa sedro.
