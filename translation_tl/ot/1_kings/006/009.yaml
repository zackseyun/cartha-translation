translation_notes:
  register: Modernong Filipino Tagalog na payak ngunit marangal. Ginamit ang “templo” para sa kontekstuwal na kahulugan ng הַבַּיִת, habang pinanatili ang maikli at magkahanay na pagkakabuo ng Hebreo.
