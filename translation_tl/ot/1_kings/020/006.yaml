  to: “Ngunit sa ganito ring oras bukas, ipadadala ko sa iyo ang aking mga lingkod. Hahalughugin nila ang bahay mo at ang mga bahay ng iyong mga lingkod. Anumang mahalaga sa iyo[a] ay kukunin nila at tatangayin.”[b]
