  yaml_path: translation/ot/1_kings/020/006.yaml
  text: No[a], but about this time tomorrow I will send my servants to you, and they will search your house and the houses of your servants; and whatever is desirable in your eyes[b], they will put into their hands and take away.
translation:
  language: tl
  text: “Ngunit sa ganito ring oras bukas, ipadadala ko sa iyo ang aking mga lingkod. Hahalughugin nila ang bahay mo at ang mga bahay ng iyong mga lingkod. Anumang mahalaga sa iyo[a] ay kukunin nila at tatangayin.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “lahat ng kinalulugdan ng iyong mga mata,” ibig sabihin, lahat ng lubos mong pinahahalagahan.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “ilalagay nila sa kanilang kamay at kukunin”; inilalarawan ng pananalita ang pagsamsam at pagtangay.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: Hindi!
  rationale: Sa konteksto, itinatanggi at nilalampasan ng parirala ang naunang hangganan ng kahilingan. Ang “Hindi!” ay natural na nagpapahayag ng mariing pagtutuwid bago ang mas mabigat na banta.
- source_word: כָּעֵת מָחָר
  choice: sa ganito ring oras bukas
  rationale: Natural na katumbas sa Tagalog ng pananalitang tumutukoy sa humigit-kumulang kaparehong oras kinabukasan.
- source_word: עֲבָדַי
  choice: aking mga lingkod
  rationale: Tumutukoy rito sa mga tauhan o sugo ng hari. Pinananatili ng “mga lingkod” ang malawak na kahulugan at ang pagkakatulad nito sa mga lingkod ng kausap.
- source_word: וְחִפְּשׂוּ
  choice: Hahalughugin nila
  rationale: Ipinahihiwatig ng pandiwa ang masusing paghahanap. Mas angkop sa bantang pagsamsam ang “hahalughugin” kaysa sa payak na “hahanapin,” nang hindi tahasang nagdaragdag ng karahasan.
- source_word: בֵּיתְךָ ... בָּתֵּי עֲבָדֶיךָ
  choice: ang bahay mo at ang mga bahay ng iyong mga lingkod
  rationale: Pinananatili ang karaniwang kahulugan ng בַּיִת at ang paralelismo sa pagitan ng bahay ng hari at ng mga bahay ng kanyang mga lingkod; maaaring palasyo ang tinutukoy ng unang gamit, ngunit hindi kailangang lutasin iyon sa salin.
- source_word: כָּל מַחְמַד עֵינֶיךָ
  choice: lahat ng mahalaga sa iyong paningin
  rationale: Natural ngunit malapit sa idyomang Hebreo para sa anumang itinuturing na kanais-nais, kaibig-ibig, o mahalaga ng isang tao.
- source_word: יָשִׂימוּ בְיָדָם וְלָקָחוּ
  choice: kukunin nila at tatangayin
  rationale: Isinasalin ang kabuuang kilos bilang sapilitang pagkuha at pagdadala. Ang literal na pagtukoy sa paglalagay sa kanilang kamay ay inilalahad sa talababa dahil magiging asiwa sa pangunahing tekstong Tagalog.
theological_decisions: []
translation_notes:
  register: Makabagong Filipino na marangal at tuwiran. Ginamit ang “hahalughugin” upang ihatid ang masusing paghahanap sa konteksto ng banta, at “tatangayin” upang malinaw na ipakita ang pag-aalis ng mga ari-arian. Ang mga idyomang Hebreo ay pinanatili hangga't natural, at nilinaw sa mga talababa kung saan magiging asiwa ang literal na anyo.
