- from: Nagpadala si Ben-hadad ng mensahe sa kanya at sinabi[a], “Parusahan nawa ako ng mga diyos, at lalo pang dagdagan iyon, kung magkakasya ang alabok ng Samaria bilang tig-iisang dakot para sa lahat ng taong sumusunod sa akin.”
  to: Nagpadala si Ben-hadad ng mensahe sa kanya at sinabi[a], “Gawin nawa sa akin ng mga diyos ang gayon, at higit pa, kung ang alabok ng Samaria ay sapat na maging tig-iisang dakot para sa lahat ng taong nasa aking paanan.”
  rationale: Binago ang panunumpa upang mapanatili ang di-tiyak na pormula ng Hebreo sa halip na tahasang tukuyin itong parusa. Ibinabalik ang literal na idyomang “nasa aking paanan” at inilalagay ang paliwanag sa talababa, kaya napananatili ang saklaw ng orihinal. Inayos din ang parirala tungkol sa mga dakot upang maging natural na Tagalog nang hindi binabago ang hiperbola.
