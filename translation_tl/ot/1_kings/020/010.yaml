base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/010.yaml
  text: Ben-hadad sent to him and said[a], “May the gods do so to me, and more also, if the dust of Samaria will be enough for handfuls for all the people who are at my feet.”
translation:
  language: tl
  text: Nagpadala si Ben-hadad ng mensahe sa kanya at sinabi[a], “Gawin nawa sa akin ng mga diyos ang gayon, at higit pa, kung ang alabok ng Samaria ay sapat na maging tig-iisang dakot para sa lahat ng taong nasa aking paanan.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal na Hebreo, “kung ang alabok ng Samaria ay sasapat para sa mga dakot para sa lahat ng taong nasa aking mga paa.” Ang “nasa aking mga paa” ay idyomang tumutukoy sa mga taong nasa ilalim ng kanyang kapangyarihan o kabilang sa kanyang pangkat. Ipinagyayabang ni Ben-hadad na napakarami ng kanyang mga tauhan kaya hindi sasapat ang alabok ng Samaria na tig-iisang dakot para sa kanila.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח אֵלָיו
  choice: Nagpadala ... ng mensahe sa kanya
  rationale: Bagaman walang tahasang layon na ‘mensahe’ sa Hebreo, malinaw na diplomatikong pakikipag-ugnayan ang konteksto; likas at malinaw ito sa modernong Tagalog.
- source_word: בֶּן הֲדַד
  choice: Ben-hadad
  rationale: Isinalin sa karaniwang transliterasyon ang pangalang pantangi.
- source_word: כֹּה יַעֲשׂוּן לִי אֱלֹהִים וְכֹה יוֹסִפוּ
  choice: Parusahan nawa ako ng mga diyos, at lalo pang dagdagan iyon
  rationale: Ipinahahayag nito ang lakas ng pormulang panunumpa at sumpa sa natural na Tagalog, habang pinananatili ang di-tiyak na kapahamakang tinutukoy ng ‘gawin ... at dagdagan.’
- source_word: אִם
  choice: kung
  rationale: Pinananatili ang anyong kondisyonal ng Hebreo; sa loob ng sumpang panunumpa, ipinahihiwatig nitong maparusahan siya kung hindi matutupad ang kanyang pagyayabang.
- source_word: יִשְׂפֹּק
  choice: magkakasya
  rationale: Natural na katumbas ng ideya ng pagiging sapat.
- source_word: עֲפַר שֹׁמְרוֹן
  choice: ang alabok ng Samaria
  rationale: Tuwirang ipinapakita ang ugnayang construct ng Hebreo.
- source_word: לִשְׁעָלִים
  choice: bilang tig-iisang dakot
  rationale: Inihahatid ang kontekstuwal na kahulugang ‘mga dakot’ o ‘laman ng lukob na kamay,’ at nililinaw ang pamamahagi sa bawat tauhan.
- source_word: לְכָל הָעָם אֲשֶׁר בְּרַגְלָי
  choice: para sa lahat ng taong sumusunod sa akin
  rationale: Ang literal na ‘nasa aking mga paa’ ay idyoma para sa mga tauhang nasa ilalim ng utos o kasama sa hukbo; malinaw itong naihahatid ng ‘sumusunod sa akin.’
theological_decisions:
- issue: Pagpapakahulugan sa אֱלֹהִים sa panunumpa ng isang paganong hari
  choice: mga diyos
  alternative: Diyos
  rationale: Si Ben-hadad ay isang di-Israelitang hari, at ang anyong maramihan ay angkop na tumutukoy sa kanyang mga diyos; hindi ipinapasok ang pagtukoy sa Diyos ng Israel.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang ‘nagpadala ng mensahe’ para sa likas na diplomatikong pahayag, at ‘sumusunod sa akin’ upang maipahayag nang malinaw ang idyomang militar na ‘nasa aking mga paa.’
