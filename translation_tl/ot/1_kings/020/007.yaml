base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/007.yaml
  text: Then the king of Israel called all the elders of the land and said, “Please know and see that this man is seeking trouble, for he sent to me for my wives, my sons, my silver, and my gold, and I did not withhold them from him.”
translation:
  language: tl
  text: Pagkatapos, ipinatawag ng hari ng Israel ang lahat ng matatandang pinuno ng lupain at sinabi, “Alamin ninyo at unawain na naghahanap ng gulo ang taong ito. Sapagkat nagpadala siya ng mga sugo sa akin upang hingin ang aking mga asawa, mga anak, pilak, at ginto, at hindi ko ipinagkait sa kanya ang mga iyon.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: זִקְנֵי הָאָרֶץ
  choice: matatandang pinuno ng lupain
  rationale: Ang זקנים ay hindi lamang tumutukoy sa matatanda sa edad kundi sa kinikilalang mga pinuno ng pamayanan; nililinaw ito sa likas na modernong Tagalog.
- source_word: דְּעוּ נָא וּרְאוּ
  choice: Alamin ninyo at unawain
  rationale: Pinananatili ang dalawang utos habang ginagamit ang “unawain” para sa idyomatikong gamit ng “tingnan” bilang pagkilala o pag-unawa sa sitwasyon.
- source_word: רָעָה זֶה מְבַקֵּשׁ
  choice: naghahanap ng gulo ang taong ito
  rationale: Sa konteksto, ang רעה ay kasamaang kapahamakan o kaguluhang sinasadyang idulot; ang “naghahanap ng gulo” ay natural at hindi labis na nagpapasiya sa moral o militar na uri nito.
- source_word: שָׁלַח אֵלַי לְנָשַׁי
  choice: ipinasundo na niya sa akin ang aking mga asawa
  rationale: Ang שלח אל ... ל־ ay nagpapahiwatig ng pagpapadala ng mga sugo upang hingin o kunin ang mga tinukoy na bagay at tao; “ipinasundo” ang maikli at likas na katumbas sa konteksto.
- source_word: וְלֹא מָנַעְתִּי מִמֶּנּוּ
  choice: hindi ko ipinagkait sa kanya ang mga iyon
  rationale: Tuwirang pinananatili ang diwa ng “hindi ko pinigil/ikinait mula sa kaniya,” at malinaw ang panghalip na tumutukoy sa mga naunang binanggit.
theological_decisions:
- issue: Saklaw ng naunang pagsang-ayon ng hari
  choice: Pinananatiling kasama sa pahayag ang mga asawa, anak, pilak, at ginto
  alternative: Ipahiwatig na mga kayamanan lamang ang aktuwal niyang ibinigay o hindi ipinagkait
  rationale: Gramatikal na sumasaklaw ang pahayag sa buong listahan; hindi dapat lutasin ng salin ang posibleng tensiyon sa pagitan ng sinabi rito at ng takbo ng salaysay.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “matatandang pinuno” upang maiwasang mapagkamalang edad lamang ang tinutukoy, at “naghahanap ng gulo” upang ihatid ang kontekstuwal na puwersa ng רעה nang hindi nagdaragdag ng denominasyonal o doktrinal na paliwanag.
