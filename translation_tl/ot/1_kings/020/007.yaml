  to: Pagkatapos, ipinatawag ng hari ng Israel ang lahat ng matatandang pinuno ng lupain at sinabi, “Alamin ninyo at unawain na naghahanap ng gulo ang taong ito. Sapagkat nagpadala siya ng mga sugo sa akin upang hingin ang aking mga asawa, mga anak, pilak, at ginto, at hindi ko ipinagkait sa kanya ang mga iyon.”
