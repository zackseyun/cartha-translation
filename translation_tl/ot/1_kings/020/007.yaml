  terminology: Ang “matatandang pinuno,” “naghahanap ng gulo,” at “hindi ko ipinagkait” ay angkop. Pinananatili ng “naghahanap ng gulo” ang kontekstuwal na puwersa ng רָעָה nang hindi labis na itinatakda kung anong uri ng kapahamakan ang tinutukoy.
