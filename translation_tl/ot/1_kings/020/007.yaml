  source_fidelity: Kailangang iwasto ang “ipinasundo na niya sa akin.” Ang Hebreong שָׁלַח אֵלַי לְ... ay nagsasabing nagpadala siya sa hari upang hingin/kunin ang mga bagay na ito; ang kasalukuyang anyo ay maaaring mangahulugang ipinakuha niya ang mga ito sa pamamagitan ng isang ipinadala, ngunit hindi malinaw na naihahatid ang kaniyang pagpapadala ng kahilingan o mga sugo. Ang “na” ay wala ring katapat na kailangang idagdag sa Hebreo. Ang iba pang bahagi ay tapat sa diwa ng talata.
