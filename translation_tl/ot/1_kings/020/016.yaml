base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/016.yaml
  text: They went out at noon[a], while Ben-hadad was drinking himself drunk in the booths, he and the thirty-two kings who were helping him.
translation:
  language: tl
  text: Lumabas sila nang katanghalian, habang umiinom si Ben-hadad hanggang malasing sa mga kubol[a], kasama ang tatlumpu’t dalawang haring tumutulong sa kanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga silungan” o “mga tolda.” Literal sa Hebreo ang “mga kubol.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצְאוּ
  choice: Lumabas sila
  rationale: Payak na pasulong na salaysay ng Qal wayyiqtol ng יצא; ipinahihiwatig ng konteksto ang paglabas nila mula sa lungsod nang hindi dinaragdagan ng diwang wala sa Hebreo.
- source_word: בַּצָּהֳרָיִם
  choice: nang katanghalian
  rationale: Tumutukoy sa kalagitnaan ng araw; likas at tiyak na panandang-panahon ito sa modernong Tagalog.
- source_word: וּבֶן הֲדַד
  choice: habang ... si Ben-hadad
  rationale: Isinalin ang waw bilang pang-ugnay na nagpapakita ng kasabay na kalagayan ni Ben-hadad nang lumabas sila.
- source_word: שֹׁתֶה שִׁכּוֹר
  choice: umiinom at nagpapakalasing
  rationale: Ipinahahayag ng participle ang nagpapatuloy na pag-inom at ng predicative adjective ang kalagayan o bungang pagkalasing; pinananatili ng parirala ang dalawang diwa nang hindi nagdaragdag ng inuming hindi tahasang binanggit.
- source_word: בַּסֻּכּוֹת
  choice: sa mga kubol
  rationale: Ang סֻכּוֹת ay literal na mga kubol o pansamantalang silungan. Pinananatili ng “kubol” ang konkretong larawan ng Hebreo.
- source_word: הוּא וְהַמְּלָכִים
  choice: kasama ang ... mga hari
  rationale: Likas na ipinakikita sa Tagalog na kabilang kay Ben-hadad ang mga kasamang hari, habang nananatili ang ugnayang ipinahahayag ng tahasang panghalip sa Hebreo.
- source_word: שְׁלֹשִׁים וּשְׁנַיִם מֶלֶךְ
  choice: tatlumpu’t dalawang hari
  rationale: Ibinibigay ang eksaktong bilang at ginagamit ang likas na anyong Tagalog pagkatapos ng pamilang.
- source_word: עֹזֵר אֹתוֹ
  choice: tumutulong sa kanya
  rationale: Ang participle ng עזר ay nagpapahiwatig ng nagpapatuloy na pagtulong o pagsuporta; ang sugnay na ito ay likas na naglalarawan sa mga hari.
