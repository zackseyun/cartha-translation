translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “nagpapakalasing” upang maipakita ang resultang kalagayan ng שִׁכּוֹר, at inilagay ang talababa sa “mga kubol,” ang salitang aktuwal na may leksikal na alternatibo.
