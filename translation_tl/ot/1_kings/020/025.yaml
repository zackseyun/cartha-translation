  yaml_path: translation/ot/1_kings/020/025.yaml
  text: And you, muster for yourself an army like the army that fell from you, and horse for horse and chariot for chariot; then let us fight against them on the plain. Surely we will be stronger than they are.” So he listened to their voice and did so.
translation:
  language: tl
  text: Ikaw naman, magtipon ka para sa iyong sarili ng isang hukbong kasinglaki ng hukbong nawala sa iyo, kabayo sa kabayo at karwahe sa karwahe. Pagkatapos, labanan natin sila sa kapatagan. Tiyak na magiging mas malakas tayo kaysa sa kanila.” Pinakinggan niya ang kanilang sinabi at ginawa niya iyon.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תִמְנֶה לְךָ חַיִל
  choice: magtipon ka ng hukbo
  rationale: Ang מנה sa kontekstong militar ay tumutukoy sa pagbuo o pagtipon ng itinakdang hukbo; mas natural ito kaysa literal na “bilangin mo.”
- source_word: כַחַיִל הַנֹּפֵל מֵאוֹתָךְ
  choice: na katulad ng hukbong nawala sa iyo
  rationale: Ang נפל ay literal na “bumagsak,” ngunit dito ay tumutukoy sa hukbong natalo at nawala sa hari; pinananatili ng “nawala sa iyo” ang idiomatikong diwa nang hindi nililimitahan sa mga napatay lamang.
- source_word: וְסוּס כַּסּוּס וְרֶכֶב כָּרֶכֶב
  choice: kabayo kapalit ng kabayo at karwahe kapalit ng karwahe
  rationale: Inihahayag ng inuulit na כ ang katumbas na pagpapalit ng bawat nawalang sangkap ng hukbo.
- source_word: בַּמִּישׁוֹר
  choice: sa kapatagan
  rationale: Tuwirang katumbas ng terminong tumutukoy sa patag at maluwang na lupain.
- source_word: אִם לֹא נֶחֱזַק מֵהֶם
  choice: Tiyak na magiging mas malakas tayo kaysa sa kanila
  rationale: Ang pormulang אִם־לֹא sa ganitong panunumpa o mariing pahayag ay nagpapahayag ng matibay na katiyakan, hindi payak na kondisyon.
- source_word: וַיִּשְׁמַע לְקוֹלָם
  choice: Pinakinggan niya ang kanilang sinabi
  rationale: Natural na Filipino para sa Hebreong idyomang “nakinig sa kanilang tinig,” na nagpapahiwatig ng pagsunod sa payo.
