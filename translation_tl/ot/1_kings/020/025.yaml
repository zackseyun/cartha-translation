translation_notes:
  register: Modernong Filipino na natural at marangal. Ginamit ang “karwahe” para sa sasakyang pandigma at “hukbo” para sa חַיִל. Pinanatili ang tiwala ng mga tagapayo bilang mariing pahayag, nang hindi ito ginagawang pahayag ng tagapagsalaysay.
