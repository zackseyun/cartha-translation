- from: At ikaw, magtipon ka ng hukbo na katulad ng hukbong nawala sa iyo—kabayo kapalit ng kabayo at karwahe kapalit ng karwahe. Pagkatapos, labanan natin sila sa kapatagan. Tiyak na magiging mas malakas tayo kaysa sa kanila.” Pinakinggan niya ang kanilang sinabi at ginawa niya iyon.
  to: Ikaw naman, magtipon ka para sa iyong sarili ng isang hukbong kasinglaki ng hukbong nawala sa iyo, kabayo sa kabayo at karwahe sa karwahe. Pagkatapos, labanan natin sila sa kapatagan. Tiyak na magiging mas malakas tayo kaysa sa kanila.” Pinakinggan niya ang kanilang sinabi at ginawa niya iyon.
