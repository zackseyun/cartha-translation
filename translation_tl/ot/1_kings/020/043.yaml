  text: So the king of Israel went to his house sullen and angry[a], and he came to Samaria.
translation:
  language: tl
  text: Kaya umuwi ang hari ng Israel na may sama ng loob at galit[a], at dumating siya sa Samaria.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “na mabigat ang loob at galit.” Ang dalawang salitang Hebreo ay magkasamang naglalarawan ng panloob na sama ng loob at hayag na pagkayamot.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: umuwi
  rationale: Sa pagsama ng patutunguhang עַל בֵּיתוֹ, likas sa makabagong Tagalog ang pandiwang “umuwi”; malinaw nitong ipinahihiwatig ang pagpunta sa sariling tahanan nang hindi kailangang ulitin ang “sa kanyang bahay.”
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: ang hari ng Israel
  rationale: Tuwirang katumbas at karaniwang parirala sa Tagalog para sa Hebreong construct chain.
- source_word: עַל בֵּיתוֹ
  choice: umuwi
  rationale: Ang idyomatikong gamit ng עַל bilang direksiyon tungo sa בֵּיתוֹ ay isinama sa “umuwi.” Hindi ginawang “palasyo” upang hindi dagdagan ang espesipikong wala sa teksto.
- source_word: סַר
  choice: mabigat ang loob
  rationale: Inihahayag nito sa natural na Tagalog ang panloob at nagkukubling sama ng loob na ipinahihiwatig ng salita sa tambalan, habang iniiwasan ang hindi natural na literalismo.
- source_word: וְזָעֵף
  choice: at galit
  rationale: Malinaw at kasalukuyang salita ang “galit” para sa hayag na yamot o poot, at napapanatili ang dalawang magkahiwalay na paglalarawan.
- source_word: וַיָּבֹא
  choice: at dumating siya
  rationale: Ang “dumating” ay natural na salaysay na katumbas ng בוא at malinaw na minamarkahan ang pagdating sa patutunguhan.
- source_word: שֹׁמְרוֹנָה
  choice: sa Samaria
  rationale: Natural na ipinapahayag ng “sa” kasama ng “dumating” ang direksiyonal na he sa pangalang Samaria.
