translation_notes:
  register: Makabagong Filipino Tagalog na natural, marangal, at madaling maunawaan. Pinili ang “umuwi” para sa idyomatikong daloy, ngunit hindi tinukoy na “palasyo” ang tahanan ng hari. Napanatili ang dalawang bahagi ng paglalarawan sa kanyang damdamin at ang footnote marker na [a].
