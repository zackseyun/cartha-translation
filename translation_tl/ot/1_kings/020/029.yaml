  source_fidelity: Tumpak ang pangunahing daloy at bilang, pati ang pagpapanatili sa “Aram.” Gayunman, ang “nagsimula ang labanan” ay mas interpretibong salin ng וַתִּקְרַב הַמִּלְחָמָה (“lumapit/dumating ang labanan”) kaysa kinakailangan. Ang “lumapit ang labanan” ay nakapagpapanatili sa imahen at aspekto ng Hebreo nang hindi ipinipilit na ang simula ng labanan ang tanging diwa.
  naturalness: Ang ayos ng unang pangungusap ay natural. Ang “kawal na naglalakad” ay maaaring magpahiwatig lamang na nagmamartsa ang mga kawal, hindi ang teknikal na pagkakaibang infantry laban sa kabalyerya. Ang “mga kawal na nasa paa” ay mas malapit sa literal na pormulasyon at nililinaw ng talababa ang terminong “impanterya.”
  terminology: Ang “mga anak ni Israel” at “Aram” ay angkop at sinusuportahan ng mga talababa. Ang “pinabagsak” ay katanggap-tanggap para sa malawak na pandiwang נכה sa kontekstong pandigma; hindi nito labis na itinatakda ang kahulugan bilang “pinatay.”
