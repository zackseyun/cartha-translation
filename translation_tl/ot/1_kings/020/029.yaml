revisions:
- from: Pitong araw na nagkampo ang magkabilang panig na magkaharap. Nang ikapitong araw, nagsimula ang labanan, at pinabagsak ng mga anak ni Israel[a] ang Aram[b]—sandaang libong kawal na naglalakad[c]—sa loob ng isang araw.
  to: Nagkampo ang magkabilang panig na magkaharap sa loob ng pitong araw. Nang ikapitong araw, lumapit ang labanan, at pinabagsak ng mga anak ni Israel[a] ang Aram[b]—sandaang libong kawal na nasa paa[c]—sa loob ng isang araw.
  rationale: Iningatan ng rebisyon ang temporal na daloy, ang dalawang hukbong magkaharap, ang pangalang Aram, at ang lawak ng “pinabagsak.” Pinalitan ang interpretibong “nagsimula” ng “lumapit” upang masundan ang pandiwang Hebreo nang hindi inaalis ang natural na daloy ng salaysay. Inayos din ang paglalarawan sa רַגְלִי upang maiwasan ang kahulugang simpleng paglalakad o pagmamartsa.
