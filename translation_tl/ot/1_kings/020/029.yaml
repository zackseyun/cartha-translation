  - severity: low
    issue: “kawal na naglalakad” para sa רַגְלִי
    rationale: Sa makabagong Filipino, maaari itong unawaing mga kawal na kasalukuyang naglalakad. Ang terminong Hebreo ay tumutukoy sa mga kawal na nasa paa, samakatuwid ay impanterya, bilang kaiba sa mga nakasakay.
