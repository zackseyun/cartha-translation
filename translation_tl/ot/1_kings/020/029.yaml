id: 1KI.20.29
reference: 1 Kings 20:29
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַֽ/יַּחֲנ֧וּ אֵ֦לֶּה נֹ֥כַח אֵ֖לֶּה שִׁבְעַ֣ת יָמִ֑ים וַ/יְהִ֣י בַּ/יּ֣וֹם הַ/שְּׁבִיעִ֗י וַ/תִּקְרַב֙ הַ/מִּלְחָמָ֔ה וַ/יַּכּ֨וּ בְנֵֽי יִשְׂרָאֵ֧ל אֶת אֲרָ֛ם מֵאָה אֶ֥לֶף רַגְלִ֖י בְּ/י֥וֹם אֶחָֽד׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/029.yaml
  text: And these camped opposite those for seven days[a]. Then on the seventh day the battle drew near[c][b], and the sons of Israel struck down Aram—one hundred thousand foot soldiers in one day.
translation:
  language: tl
  text: Nagkampo ang magkabilang panig na magkaharap sa loob ng pitong araw. Nang ikapitong araw, lumapit ang labanan, at pinabagsak ng mga anak ni Israel[a] ang Aram[b]—sandaang libong kawal na nasa paa[c]—sa loob ng isang araw.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga Israelita.” Literal sa Hebreo, “mga anak ni Israel.”
    reason: lexical_alternative
  - marker: b
    text: O “ang mga Arameo.” Ang “Aram” sa Hebreo ay maaaring tumukoy sa kaharian o sa mga mamamayan nito.
    reason: lexical_alternative
  - marker: c
    text: O “impanterya.” Literal na tumutukoy ang Hebreo sa mga kawal na “nasa paa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחֲנוּ
  choice: nagkampo
  rationale: Likas at makabagong salin ito ng pandiwang tumutukoy sa pagtatayo o pananatili sa kampo.
- source_word: אֵלֶּה נֹכַח אֵלֶּה
  choice: ang magkabilang panig na magkaharap
  rationale: Pinananatili nito ang larawan ng dalawang hukbong nakapuwesto sa tapat ng isa’t isa, ngunit mas natural kaysa sa literal na “ang mga ito sa tapat ng mga iyon.”
- source_word: שִׁבְעַת יָמִים
  choice: Pitong araw
  rationale: Tuwirang ipinapahayag ang tagal; inilagay sa unahan upang maging natural ang daloy sa Tagalog.
- source_word: וַיְהִי בַּיּוֹם הַשְּׁבִיעִי
  choice: Nang ikapitong araw
  rationale: Natural na salaysay sa Tagalog na nagpapanatili sa malinaw na palatandaan ng panahon nang hindi gumagamit ng lipas na pormula.
- source_word: וַתִּקְרַב הַמִּלְחָמָה
  choice: nagsimula ang labanan
  rationale: Literal na “lumapit ang labanan,” ngunit sa kontekstong militar ang diwa ay sumapit o nagsimula ang aktuwal na sagupaan.
- source_word: וַיַּכּוּ
  choice: pinabagsak
  rationale: Pinananatili ang marahas na puwersa ng pandiwang נכה nang hindi tahasang nililimitahan ang kahulugan sa “pinatay” o pinalalabo bilang “tinalo” lamang.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Malapit sa literal na pananalitang Hebreo at angkop sa konteksto ng hukbong binubuo ng mga lalaking mandirigma; nililinaw sa talababa ang karaniwang alternatibo.
- source_word: אֲרָם
  choice: Aram
  rationale: Pinananatili ang sinaunang pangalang pantangi sa halip na gamitin ang mas huling katawagang “Siria”; maaari rin itong tumukoy sa bayan o mga Arameo.
- source_word: מֵאָה אֶלֶף
  choice: sandaang libo
  rationale: Tuwirang katumbas ng bilang at natural sa makabagong Tagalog.
- source_word: רַגְלִי
  choice: kawal na naglalakad
  rationale: Malinaw nitong inilalantad ang literal na ideya ng mga mandirigmang “nasa paa,” samantalang ibinibigay sa talababa ang terminong militar na “impanterya.”
- source_word: בְּיוֹם אֶחָד
  choice: sa loob ng isang araw
  rationale: Natural na ipinahahayag sa Tagalog ang panahong saklaw ng pagkatalo.
theological_decisions:
- issue: Masculinong anyo ng בְנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  alternative: mga Israelita
  rationale: Pinananatili ang anyong nasa pinagmulang teksto at ang posibleng pagtukoy sa mga lalaking mandirigma, nang hindi ginagawang pangkalahatang katawagan lamang.
- issue: Pangalan o katawagan sa bayan sa אֲרָם
  choice: Aram
  alternative: mga Arameo
  rationale: Ang Hebreo ay gumagamit ng pangalang Aram, na maaaring kumatawan sa kaharian o sa bayan nito. Pinananatili ng salin ang pangalang iyon at inilalahad ang alternatibo sa talababa.
- issue: Lakas at kinalabasan ng וַיַּכּוּ
  choice: pinabagsak
  alternative: pinatay; tinalo
  rationale: Hindi tahasang nilulutas kung ang pandiwa mismo ay dapat unawaing “pinatay” o mas malawak na “tinalo,” bagaman malubha at malamang na nakamamatay ang kinalabasan sa konteksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Inayos ang unang sugnay ayon sa natural na ayos ng Tagalog ngunit pinanatili ang larawan ng dalawang kampong magkaharap. Ginamit ang “pinabagsak” upang mapanatili ang lakas at bahagyang lawak ng pandiwang Hebreo. Ang lahat ng marker ng talababa ay inilagay sa mismong salin sa kaugnay na salita.
