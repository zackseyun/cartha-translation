  text: 'These went out from the city: the young men of the commanders of the provinces[a], and the army that was behind them.'
translation:
  language: tl
  text: 'Ang mga ito ay lumabas mula sa lungsod: ang mga kabataang lalaki ng mga pinuno ng mga lalawigan[a], at ang hukbong nasa likuran nila.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga tauhan” o “mga tagapaglingkod ng mga pinuno ng mga lalawigan.” Ang Hebreong נַעֲרֵי ay maaaring tumukoy sa mga kabataang lalaki o sa mga personal na tauhan o tagapaglingkod; maaaring kapuwa saklaw ng konteksto ang dalawang diwang ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Ang mga ito
  rationale: Tumutukoy sa pangkat na binanggit at binilang sa naunang talata; hindi na kailangang isalin nang hiwalay ang pang-ugnay upang maging natural sa Tagalog.
- source_word: יָצְאוּ מִן הָעִיר
  choice: ay lumabas mula sa lungsod
  rationale: Tuwirang ipinahahayag ang pagkilos at ang pinanggalingan nang hindi idinaragdag ang di-tiyak na diwang militar ng ‘nagmartsa.’
- source_word: נַעֲרֵי
  choice: mga kabataang tauhan
  rationale: Pinananatili ang posibleng diwa ng kabataan at ng pagiging tauhan o tagapaglingkod; ipinapaliwanag sa talababa ang tunay na leksikal na kalabuan.
- source_word: שָׂרֵי הַמְּדִינוֹת
  choice: mga pinuno ng mga lalawigan
  rationale: Ang שַׂר ay maaaring pinuno, opisyal, o kumander. Ang ‘pinuno’ ay angkop sa mga namamahala sa mga administratibong lalawigan at hindi labis na nagtatakda ng tungkuling militar.
- source_word: וְהַחַיִל
  choice: at ang hukbo
  rationale: Sa kontekstong ito, ang חַיִל ay tumutukoy sa puwersang militar; ‘hukbo’ ang malinaw at marangal na katumbas.
- source_word: אֲשֶׁר אַחֲרֵיהֶם
  choice: na nasa likuran nila
  rationale: Pinananatili ang literal na ugnayang pangposisyon at maaari ring magpahiwatig na sumusunod ang hukbo sa kanila.
