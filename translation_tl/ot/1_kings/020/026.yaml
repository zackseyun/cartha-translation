base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/026.yaml
  text: At the turn of the year[c][b][a], Ben-hadad mustered Aram and went up to Aphek for battle with Israel.
translation:
  language: tl
  text: Nang muling sumapit ang taon[a], tinipon ni Ben-hadad ang hukbo ng Aram[b] at umakyat patungong Afek upang makipagdigma sa Israel.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “sa pagbabalik ng taon,” isang idyoma para sa muling pagsapit ng taunang panahon; maaari ring isaling “pagsapit ng tagsibol.”
    reason: lexical_alternative
  - marker: b
    text: O “ang mga Arameo.” Ang “Aram” sa Hebreo ay maaaring tumukoy sa kaharian o sa mga mamamayan at hukbo nito.
    reason: lexical_alternative
  - marker: c
    text: O “laban sa Israel.” Literal na “kasama ng Israel” ang preposisyon sa Hebreo, ngunit ginamit ito rito sa konteksto ng labanan.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִתְשׁוּבַת הַשָּׁנָה
  choice: Nang sumapit muli ang panahong iyon ng taon
  rationale: Ipinahahayag nito ang literal na diwang ‘sa pagbabalik ng taon’ bilang muling pagsapit ng taunang panahon, nang hindi tiyak na ipinapakahulugang tagsibol.
- source_word: וַיִּפְקֹד
  choice: tinipon
  rationale: Sa kontekstong militar, ang pandiwa ay tumutukoy sa pagtitipon o pagrerepaso sa mga hukbo; natural sa Filipino ang ‘tinipon ang hukbo.’
- source_word: אֶת אֲרָם
  choice: ang hukbo ng Aram
  rationale: Ang ‘Aram’ ay maaaring tumukoy sa kaharian, bayan, o hukbo nito. Nililinaw ng ‘hukbo ng Aram’ ang kontekstong militar habang pinananatili ang sinaunang pangalang Aram.
- source_word: וַיַּעַל
  choice: umahon
  rationale: Pinananatili nito ang pangunahing kahulugan ng עלה na ‘umakyat/umahon’ at ang posibleng topograpiko o militar na himig.
- source_word: אֲפֵקָה
  choice: patungong Afek
  rationale: Ang directional he ay nagpapahiwatig ng kilos tungo sa Afek; likas itong ipinahahayag sa Filipino sa pamamagitan ng ‘patungong.’
- source_word: לַמִּלְחָמָה
  choice: upang makipagdigma
  rationale: Natural na Filipino ito para sa layuning ipinahahayag ng ‘para sa labanan/digmaan.’
- source_word: עִם יִשְׂרָאֵל
  choice: sa Israel
  rationale: Bagaman literal na ‘kasama ng Israel,’ sa konteksto ng pakikipagdigma ay natural na nangangahulugang pakikipaglaban laban sa Israel; ang pandiwang ‘makipagdigma sa’ ay nagpapanatili ng ugnayang ipinahahayag ng preposisyon.
