translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘Afek’ ayon sa karaniwang pagsasalin ng Hebrew pe bilang f sa mga pangalang biblikal. Pinanatili ang ‘Aram’ sa halip na ang mas huling heopolitikal na katawagang ‘Siria.’
