  source_fidelity: 'Ang pangunahing diwa ay wastong naihahatid: nakatagpo siya ng ibang lalaki, nakiusap na hampasin siya, at ginawa ito ng lalaki na nagdulot ng sugat. Gayunman, ang “nasugatan siya” ay nakatuon lamang sa resulta at maaaring magtunog na hindi tuwirang pagkilos ng lalaki. Mas malinaw at mas malapit sa וּפָצֹעַ ang “sinugatan siya.”'
  naturalness: Likas at angkop sa makabagong Filipino ang “isa pang lalaki,” “Pakiusap,” at “hampasin mo ako.” Mas maayos ang tuwirang aktibong “sinugatan siya” kaysa sa paulit-ulit na pasibong “nasugatan siya.”
  terminology: Ang “hampasin” ay angkop na pangkalahatang salin ng נכה at hindi nagpapataw ng partikular na paraan ng pananakit. Wasto ring mapanatili ang “lalaki” para sa אִישׁ.
