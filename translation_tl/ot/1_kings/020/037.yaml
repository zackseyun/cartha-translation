  text: Then he found another man and said[a], “Please strike me.” So the man struck him and wounded him.
translation:
  language: tl
  text: Pagkatapos, nakakita siya ng isa pang lalaki at sinabi rito, “Pakiusap, hampasin mo ako.” Kaya hinampas siya ng lalaki at sinugatan siya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, inuulit ang pandiwang “hampasin” bilang pagdidiin; mas literal, “hinampas siya ng lalaki—talagang hinampas at sinugatan siya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמְצָא
  choice: Pagkatapos, nakakita siya
  rationale: Ang wayyiqtol ay nagpapatuloy sa salaysay. Likas sa modernong Tagalog ang “Pagkatapos” upang ipakita ang kasunod na pangyayari, habang pinananatili ng “nakakita” ang payak na diwa ng מצא.
- source_word: אִישׁ אַחֵר
  choice: isa pang lalaki
  rationale: Tuwirang ipinahahayag nito ang isahang panlalaking אִישׁ at ang diwa ng אַחֵר na isa pang tao bukod sa nauna.
- source_word: הַכֵּינִי נָא
  choice: Pakiusap, hampasin mo ako
  rationale: Ang pautos na anyo ng נכה na may hulaping unang panauhan ay “hampasin mo ako.” Ipinahahayag ng “Pakiusap” ang pakiusap o magalang na diin ng נָא.
- source_word: וַיַּכֵּהוּ הָאִישׁ
  choice: Kaya hinampas siya ng lalaki
  rationale: Pinananatili ng “hinampas siya” ang tahasang layon na “siya,” at ng “ang lalaki” ang hayag na simuno. Ang “Kaya” ay natural na nag-uugnay sa pagsunod ng lalaki sa kahilingan.
- source_word: הַכֵּה וּפָצֹעַ
  choice: at nasugatan siya
  rationale: Natural na inilalahad sa Tagalog ang kinalabasan ng paghampas. Ang masinsing Hebreong pag-uulit at pagkakasunod ng mga anyong pandiwa ay itinatala sa talababa sa halip na gayahin sa paraang magiging alanganin sa pangunahing teksto.
theological_decisions: []
translation_notes:
  register: Makabago at dignified na Filipino ang ginamit. Pinili ang “hampasin” kaysa mas kolokyal na “suntukin” dahil hindi tinutukoy ng Hebreo ang partikular na paraan ng pananakit. Inilagay ang panandang [a] sa pangwakas na sugnay na mismong tinutukoy ng talababa.
