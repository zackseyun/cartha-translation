  text: So the prophet went and stood by the road for the king[a], and disguised himself with a bandage over his eyes.
translation:
  language: tl
  text: Pagkatapos, pumunta ang propeta at pumuwesto sa tabi ng daan para abangan ang hari. Nagbalatkayo siya sa pamamagitan ng isang benda[a] na nakatakip sa kanyang mga mata.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “abo sa ibabaw ng kanyang mga mata.” Maaaring tumukoy ang parirala sa literal na abo o, ayon sa konteksto, sa isang pantakip o benda na ginamit niya sa pagbabalatkayo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: Kaya pumunta
  rationale: Isinusulong ng waw-consecutive ang salaysay. Likas sa modernong Tagalog ang “Kaya” bilang pagpapakita ng kasunod na ginawa bunga ng naunang pangyayari.
- source_word: הַנָּבִיא
  choice: ang propeta
  rationale: Tuwirang salin ng tiyak na pangngalan.
- source_word: וַיַּעֲמֹד
  choice: pumuwesto
  rationale: Sa konteksto, hindi lamang siya tumayo kundi sadyang naglagay ng sarili sa lugar kung saan daraan ang hari. Inihahatid ito ng “pumuwesto” nang hindi labis na nagpapakahulugan.
- source_word: לַמֶּלֶךְ
  choice: upang hintayin ang hari
  rationale: Ipinahihiwatig ng parirala ang layunin ng kanyang pagpuwesto kaugnay ng pagdating ng hari; mas malinaw at likas ito sa Tagalog kaysa sa literal na “para sa hari.”
- source_word: עַל הַדָּרֶךְ
  choice: sa tabi ng daan
  rationale: Ang עַל ay maaaring mangahulugang “sa” o “sa tabi ng” ayon sa konteksto. Ang “sa tabi ng daan” ay angkop sa eksenang naghihintay siya sa daraanan ng hari.
- source_word: וַיִּתְחַפֵּשׂ
  choice: Nagbalatkayo siya
  rationale: Ang hitpael na anyo ay nangangahulugang ginawa niyang hindi makilala ang sarili; natural at tumpak dito ang “nagbalatkayo.”
- source_word: בָּאֲפֵר
  choice: sa pamamagitan ng benda[a]
  rationale: Karaniwang nangangahulugang “abo” ang אֵפֶר, ngunit ang pagkakalagay nito sa ibabaw ng mga mata at ang kasunod na pagtanggal ng pantakip sa 1 Hari 20:41 ay umaayon sa di-karaniwang diwang “benda” o “pantakip.” Minarkahan ng talababa ang tunay na leksikal na kalabuan.
- source_word: עַל עֵינָיו
  choice: na nakatakip sa kanyang mga mata
  rationale: Inihahatid nito ang literal na lokasyon ng bagay sa ibabaw ng kanyang mga mata sa natural na Tagalog.
