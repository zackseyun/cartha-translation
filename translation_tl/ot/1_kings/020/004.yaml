  yaml_path: translation/ot/1_kings/020/004.yaml
  text: The king of Israel answered and said[a], “According to your word, my lord the king, I am yours, and all that is mine.”
translation:
  language: tl
  text: Sumagot ang hari ng Israel, “Gaya ng sinabi mo, panginoon kong hari, ako at ang lahat ng pag-aari ko ay sa iyo.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: Sumagot
  rationale: Ang dalawang pandiwang Hebreo ay magkasamang karaniwang panimulang pormula sa tugon. Sapat at likas sa makabagong Tagalog ang “Sumagot,” nang hindi inuulit ang di-natural na “sumagot at nagsabi.”
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: ang hari ng Israel
  rationale: Tuwiran, malinaw, at natural na salin ng ugnayang konstruktong Hebreo.
- source_word: כִּדְבָרְךָ
  choice: Gaya ng sinabi mo
  rationale: Ipinahahayag nito ang diwa ng “ayon sa iyong salita” sa natural na Tagalog habang pinananatili ang mapagpasakop na tugon.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: panginoon kong hari
  rationale: Magalang na pantawag ito sa isang taong hari, hindi banal na titulo. Pinananatili ng “panginoon kong hari” ang pagmamay-aring hulapi at tonong panghukuman.
- source_word: לְךָ אֲנִי
  choice: ako ... ay sa iyo
  rationale: Ang datibong panghalip ay nagpapahayag ng pag-aari o pagpapasakop; malinaw at maikli ang “ako ay sa iyo.”
- source_word: וְכָל אֲשֶׁר לִי
  choice: at ang lahat ng pag-aari ko
  rationale: Saklaw nito ang lahat ng nasa hari o pag-aari niya at natural itong kaagapay ng “ako ... ay sa iyo.”
theological_decisions:
- issue: Kahulugan ng אֲדֹנִי bilang pantawag
  choice: panginoon kong hari
  alternative: amo kong hari
  rationale: Tao at monarka ang tinutukoy, kaya magalang na titulong panlipunan ang gamit at walang ipinapasok na banal na kahulugan.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinagsama ang Hebreong dobleng pormula ng pagsasalita sa natural na “Sumagot,” at pinanatili ang pormal at mapagpasakop na tono ng hari ng Israel.
