revisions:
- from: Sinabi sa kanya ng kanyang mga lingkod, “Narinig po namin na maawain ang mga hari ng sambahayan ng Israel. Magsuot po tayo ng damit-sako sa ating mga baywang at maglagay ng mga lubid sa ating mga ulo, at lumabas tayo upang humarap sa hari ng Israel. Baka sakaling iligtas niya ang buhay mo.”
  to: Sinabi ng kanyang mga lingkod sa kanya, “Tingnan po ninyo, narinig namin na ang mga hari ng sambahayan ng Israel ay mga haring maawain. Magbigkis po tayo ng mga sako sa ating mga baywang at maglagay ng mga lubid sa ating mga ulo, at humarap tayo sa hari ng Israel. Marahil ay pahihintulutan niyang mabuhay kayo.”
  rationale: Idinagdag ang katumbas ng הִנֵּה נָא upang maibalik ang nawawalang pambungad na pakiusap. Inayos ang ayos ng unang sugnay para sa likas na Tagalog, at ginawang magalang na isahan ang pagtukoy sa hari sa pamamagitan ng “ninyo/kayo,” nang hindi binabago ang Hebreong kausap na ikalawang panauhang isahan. Ang “pahihintulutan niyang mabuhay kayo” ay tapat sa idiomang יְחַיֶּה אֶת־נַפְשֶׁךָ, na tumutukoy sa pagligtas o pagpapahintulot na manatiling buhay.
