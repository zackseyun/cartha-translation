  text: וַ/יֹּאמְר֣וּ אֵלָי/ו֮ עֲבָדָי/ו֒ הִנֵּֽה נָ֣א שָׁמַ֔עְנוּ כִּ֗י מַלְכֵי֙ בֵּ֣ית יִשְׂרָאֵ֔ל כִּֽי מַלְכֵ֥י חֶ֖סֶד הֵ֑ם נָשִׂ֣ימָה נָּא֩ שַׂקִּ֨ים בְּ/מָתְנֵ֜י/נוּ וַ/חֲבָלִ֣ים בְּ/רֹאשֵׁ֗/נוּ וְ/נֵצֵא֙ אֶל מֶ֣לֶךְ יִשְׂרָאֵ֔ל אוּלַ֖י יְחַיֶּ֥ה אֶת נַפְשֶֽׁ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/031.yaml
  text: And his servants said to him, “Look, please, we have heard that the kings of the house of Israel are merciful kings. Please let us put sackcloth around our waists and ropes on our heads, and let us go out to the king of Israel; perhaps he will let you live.”
translation:
  language: tl
  text: Sinabi ng kanyang mga lingkod sa kanya, “Tingnan po ninyo, narinig namin na ang mga hari ng sambahayan ng Israel ay mga haring maawain. Magbigkis po tayo ng mga sako sa ating mga baywang at maglagay ng mga lubid sa ating mga ulo, at humarap tayo sa hari ng Israel. Marahil ay pahihintulutan niyang mabuhay kayo.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַלְכֵי חֶסֶד
  choice: maawain ang mga hari
  rationale: Ang חֶסֶד dito ay tumutukoy sa awa o mapagkalingang pakikitungo ng mga hari sa sumusuko; natural at malinaw sa modernong Tagalog ang “maawain.”
- source_word: שַׂקִּים בְּמָתְנֵינוּ
  choice: damit-sako sa ating mga baywang
  rationale: Pinananatili ang sagisag ng pagpapakumbaba at pagdadalamhati, habang nililinaw na ang sako ay isinusuot sa palibot ng baywang.
- source_word: חֲבָלִים בְּרֹאשֵׁנוּ
  choice: mga lubid sa ating mga ulo
  rationale: Tuwirang pinananatili ang di-karaniwang larawan sa Hebreo nang hindi ipinapalagay kung paano eksaktong inilagay ang mga lubid.
- source_word: יְחַיֶּה אֶת נַפְשֶׁךָ
  choice: iligtas niya ang buhay mo
  rationale: Idyomatikong ipinapahayag ang kahulugang pahintulutan siyang manatiling buhay, hindi ang literal na “buhayin ang iyong kaluluwa.”
theological_decisions:
- issue: Kahulugan ng חֶסֶד sa paglalarawan sa mga hari ng Israel
  choice: maawain
  alternative: matapat sa tipan / mapagmahal
  rationale: Sa konteksto ng pagsuko at paghingi ng buhay, awa ang aktuwal na katangiang inaasahan; walang sapat na batayan upang ipasok dito ang mas teknikal na diwa ng tipan.
- issue: Antas ng katiyakan sa אוּלַי
  choice: Baka sakaling
  alternative: marahil
  rationale: Pinananatili ang pag-aalinlangan at pag-asa ng mga lingkod nang hindi tinitiyak ang magiging tugon ng hari.
translation_notes:
  register: Modernong Filipino Tagalog na magalang at marangal. Ginamit ang “po” upang natural na maipakita ang Hebreong pakiusap na נָא at ang paggalang ng mga lingkod sa kanilang hari, nang hindi inuulit ito nang labis. Pinanatili ang kongkretong mga larawang damit-sako at mga lubid.
