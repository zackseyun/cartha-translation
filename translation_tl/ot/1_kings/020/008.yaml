  text: Then all the elders and all the people said to him[a], “Do not listen, and do not consent.”
translation:
  language: tl
  text: Sinabi sa kanya ng lahat ng nakatatandang pinuno at ng buong bayan, “Huwag kang makinig, at huwag kang pumayag.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Huwag kang sumunod, at huwag kang sumang-ayon.” Ang mga pandiwang Hebreo ay maaaring mangahulugang makinig o sumunod (שׁמע), at maging handa o pumayag (אבה).'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Sinabi
  rationale: Ang wayyiqtol ng אמר ay nagpapatuloy sa salaysay; likas sa modernong Tagalog ang payak na “Sinabi” nang hindi kailangang lagyan ng tahasang “Pagkatapos.”
- source_word: אֵלָיו
  choice: sa kanya
  rationale: Panghalip ang nasa Hebreo. Bagaman ang hari ang tinutukoy ayon sa konteksto, pinananatili ng salin ang panghalip ng talata.
- source_word: כָּל הַזְּקֵנִים
  choice: lahat ng matatandang pinuno
  rationale: Ang זְקֵנִים dito ay mga kinikilalang nakatatandang lider ng pamayanan, hindi lamang matatandang lalaki. Nililinaw ito ng “matatandang pinuno” sa pangkaraniwang modernong Tagalog.
- source_word: וְכָל הָעָם
  choice: at ng buong bayan
  rationale: Ang עָם ay tumutukoy sa kabuuan ng mga tao na binabanggit kasama ng mga pinuno; natural sa kontekstong ito ang “buong bayan.”
- source_word: אַל תִּשְׁמַע
  choice: Huwag kang makinig
  rationale: Maaaring mangahulugan ang שׁמע ng makinig o sumunod. Pinananatili ng “makinig” ang mas malawak na leksikal na diwa nang hindi agad nilulutas bilang pagsunod.
- source_word: וְלֹא תֹאבֶה
  choice: at huwag kang pumayag
  rationale: Ang אבה ay nagpapahayag ng pagiging handa o pagsang-ayon. Ang “pumayag” ay natural at akma sa pagtanggi sa hinihingi sa konteksto.
