translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “matatandang pinuno” upang maipakita ang tungkulin ng mga זְקֵנִים, at pinanatili ang pagkakaiba ng “makinig” at “pumayag.”
