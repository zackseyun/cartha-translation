id: 1KI.20.28
reference: 1 Kings 20:28
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יִּגַּ֞שׁ אִ֣ישׁ הָ/אֱלֹהִ֗ים וַ/יֹּאמֶר֮ אֶל מֶ֣לֶךְ יִשְׂרָאֵל֒ וַ/יֹּ֜אמֶר כֹּֽה אָמַ֣ר יְהוָ֗ה יַ֠עַן אֲשֶׁ֨ר אָמְר֤וּ אֲרָם֙ אֱלֹהֵ֤י הָרִים֙ יְהוָ֔ה וְ/לֹֽא אֱלֹהֵ֥י עֲמָקִ֖ים ה֑וּא וְ֠/נָתַתִּי אֶת כָּל הֶ/הָמ֨וֹן הַ/גָּ֤דוֹל הַ/זֶּה֙ בְּ/יָדֶ֔/ךָ וִֽ/ידַעְתֶּ֖ם כִּֽי אֲנִ֥י יְהוָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/028.yaml
  text: 'Then the man of God came near and said to the king of Israel[a], “Thus says Yahweh: Because Aram has said, ‘Yahweh is a god of the mountains, but he is not a god of the valleys,’ I will give all this great multitude into your hand[c][b], and you shall know that I am Yahweh.”'
translation:
  language: tl
  text: 'Lumapit ang tao ng Diyos at sinabi sa hari ng Israel, “Ganito ang sinasabi ni Yahweh: Dahil sinabi ng Aram, ‘Diyos ng mga bundok si Yahweh, ngunit hindi siya Diyos ng mga libis,’ ibibigay ko sa iyong kamay ang buong napakalaking hukbong ito, at malalaman ninyo[a] na ako si Yahweh.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “malalaman ninyo” ay maramihan sa Hebreo. Bagaman sa hari sinabi ang mensahe, saklaw nito ang Israel bilang isang bayan.
    reason: Nililinaw ang gramatikal na bilang na madaling hindi mapansin sa salin.
lexical_decisions:
- source_word: אִישׁ הָאֱלֹהִים
  choice: ang lingkod ng Diyos
  rationale: Literal itong ‘tao ng Diyos,’ ngunit sa konteksto ay kinikilalang katawagang propetiko. Ang ‘lingkod ng Diyos’ ay natural at marangal sa modernong Filipino nang hindi pinanganganlang propeta ang tauhan.
- source_word: וַיִּגַּשׁ
  choice: lumapit
  rationale: Tuwirang ipinahahayag ang kilos ng paglapit at natural sa Filipino.
- source_word: כֹּה אָמַר יְהוָה
  choice: Ganito ang sinabi ni Yahweh
  rationale: Pinananatili ang pormulang mensaherong propetiko sa malinaw at kasalukuyang Filipino.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin ang tetragrammaton bilang personal na pangalang Yahweh, hindi pinapalitan ng isang titulo.
- source_word: אֲרָם
  choice: Aram
  rationale: Pinananatili ang pangalang Hebreo ng bayan o estadong tinutukoy, sa halip na ang mas huling katawagang Syria.
- source_word: אֱלֹהֵי הָרִים ... וְלֹא אֱלֹהֵי עֲמָקִים
  choice: Diyos ng mga bundok ... hindi siya Diyos ng mga libis
  rationale: Tuwirang pinananatili ang paghahambing ng matataas at mabababang lupain. Sa Filipino, hindi kailangan ang artikulong di-tiyak upang maipahayag ang predikatibong diwa; nililinaw ng konteksto ang maling paniniwalang inilalagay si Yahweh sa isang sakop lamang.
- source_word: כָּל הֶהָמוֹן הַגָּדוֹל הַזֶּה
  choice: ang buong napakalaking hukbong ito
  rationale: Bagaman malawak ang kahulugan ng הָמוֹן bilang malaking pulutong, malinaw na hukbo ang tinutukoy sa kontekstong pandigma.
- source_word: בְּיָדֶךָ
  choice: sa kamay mo
  rationale: Pinananatili ang larawang Hebreo ng pagbibigay ng kaaway sa kapangyarihan ng isang tao; nauunawaan din ang idyoma sa Filipino.
- source_word: וִידַעְתֶּם
  choice: malalaman ninyo
  rationale: Ipinakikita ng ‘ninyo’ ang ikalawang panauhang maramihan ng pandiwang Hebreo, kaya lumalampas sa hari ang resulta at sumasaklaw sa Israel.
- source_word: כִּי אֲנִי יְהוָה
  choice: na ako si Yahweh
  rationale: Natural na anyo ito ng pagkakakilanlan sa Filipino at pinananatili ang personal na pangalan.
theological_decisions:
- issue: Pagpapahayag sa maling pagkaunawa ng Aram kay Yahweh bilang diyos na saklaw lamang ang isang uri ng lupain
  choice: “Diyos ng mga bundok si Yahweh, ngunit hindi siya Diyos ng mga libis”
  alternative: “Isang diyos ng mga bundok si Yahweh, ngunit hindi siya diyos ng mga libis”
  rationale: Ang walang-artikulong predikato ay mas natural sa Filipino at hindi nagpapasya nang higit sa Hebreo, samantalang malinaw pa rin sa pagtutol ni Yahweh na mali at mapaglimita ang pahayag ng Aram.
- issue: Bilang ng mga makakakilala kay Yahweh sa וִידַעְתֶּם
  choice: 'maramihan: “malalaman ninyo”'
  alternative: 'isahan: “malalaman mo” para lamang sa hari'
  rationale: Tahasan ang anyong maramihan sa Hebreo, kahit sa hari direktang inihahatid ang mensahe; kaya Israel bilang kalipunan ang saklaw ng pahayag.
- issue: Pagpapangalan sa יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Pinananatili ang personal na pangalang nasa tekstong Hebreo at ang puwersa ng pahayag na nagpapakilala sa sarili.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at angkop sa pagbasa ng karaniwang mambabasa. Ginamit ang ‘lingkod ng Diyos’ bilang natural na katawagang propetiko; iniwasan ang lipas o labis na teknikal na pananalita. Ang footnote marker [a] ay inilagay mismo pagkatapos ng sugnay na nililinaw nito.
