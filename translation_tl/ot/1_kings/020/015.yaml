base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/015.yaml
  text: So he mustered the young men of the provincial commanders[a], and they were two hundred and thirty-two; and after them he mustered all the people, all the sons of Israel, seven thousand.
translation:
  language: tl
  text: At tinipon niya ang mga kabataang lalaki ng mga pinuno ng mga lalawigan; 232 sila. Pagkatapos nila, tinipon niya ang buong bayan—ang lahat ng mga anak ni Israel[a]—na 7,000.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang lahat ng mga Israelita.” Sa Hebreo, “ang lahat ng mga anak ni Israel,” isang panlalaking pampamilyang pananalitang tumutukoy sa bayan ng Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְקֹד / פָּקַד
  choice: tinipon
  rationale: Sa kontekstong militar, tumutukoy ang pandiwa sa pagtitipon at pagtatala ng mga lalaking ihahanda sa labanan; natural sa Filipino ang “tinipon” at hindi nito nililimitahan ang diwa sa simpleng pagbibilang.
- source_word: נַעֲרֵי
  choice: mga kabataang tauhan
  rationale: Maaaring mangahulugang mga kabataan, lingkod, o tauhan ang נַעַר. Pinananatili ng parirala ang pahiwatig ng kabataan at ang kaugnayan nila sa mga pinuno nang hindi tiyak na tinatawag silang sundalo.
- source_word: שָׂרֵי הַמְּדִינוֹת
  choice: mga pinuno ng mga lalawigan
  rationale: Malawak ang kahulugan ng שַׂר bilang pinuno o opisyal, at administratibong lalawigan ang מְדִינָה. Mas tuwirang sinasalamin nito ang Hebreo kaysa sa pagtiyak na mga kumander sila.
- source_word: מָאתַיִם שְׁנַיִם וּשְׁלֹשִׁים
  choice: '232'
  rationale: Tumpak at madaling basahing modernong anyo ng bilang.
- source_word: וְאַחֲרֵיהֶם
  choice: Pagkatapos nila
  rationale: Pinananatili ang konkretong pagkakasunod-sunod ng dalawang pangkat sa Hebreo.
- source_word: כָּל הָעָם
  choice: ang buong bayan
  rationale: Ang עָם ay bayan o sambayanan; hindi ito pinalitan ng mas makitid na “hukbo” kahit militar ang konteksto.
- source_word: כָּל בְּנֵי יִשְׂרָאֵל
  choice: ang lahat ng mga anak ni Israel
  rationale: Pinananatili ang panlalaking pampamilyang ekspresyon ng Hebreo at ang posibleng kaugnayan nito sa naunang “buong bayan.”
- source_word: שִׁבְעַת אֲלָפִים
  choice: 7,000
  rationale: Tuwirang katumbas ng bilang at malinaw sa modernong Filipino.
