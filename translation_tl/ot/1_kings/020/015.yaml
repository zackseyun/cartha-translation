revisions:
- from: Kaya tinipon niya ang mga kabataang tauhan ng mga pinuno ng mga lalawigan. Sila ay 232. Pagkatapos nila, tinipon niya ang buong bayan—ang lahat ng mga anak ni Israel[a]—na 7,000.
  to: At tinipon niya ang mga kabataang lalaki ng mga pinuno ng mga lalawigan; 232 sila. Pagkatapos nila, tinipon niya ang buong bayan—ang lahat ng mga anak ni Israel[a]—na 7,000.
  rationale: Pinalitan ang pangatnig na may diwang sanhi ng payak na pangatnig na tumutugma sa daloy ng salaysay. Ginawang mas tuwiran ang katumbas ng נַעֲרֵי at bahagyang pinakinis ang sintaks, habang pinanatili ang pagkakasunod ng pagtitipon, ang mga bilang, ang administratibong “mga lalawigan,” at ang literal na “mga anak ni Israel.”
