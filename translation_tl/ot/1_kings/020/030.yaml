base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/030.yaml
  text: The survivors fled to Aphek[a], into the city, and the wall fell on twenty-seven thousand of the remaining men. Ben-hadad also fled and entered the city, into an inner room.
translation:
  language: tl
  text: Tumakas patungong Afek at pumasok sa lungsod ang mga nakaligtas. Bumagsak ang pader sa ibabaw ng dalawampu't pitong libong lalaking natitira. Tumakas din si Ben-hadad at pumasok sa lungsod, sa isang silid sa loob ng isa pang silid.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo: “isang silid sa loob ng isang silid,” isang idyomang maaaring tumukoy sa isang panloob o pinakaloob na silid.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנּוֹתָרִים
  choice: ang mga nakaligtas / mga lalaking natitira
  rationale: Tumutukoy ito sa mga naiwan matapos ang labanan. Likas sa Filipino ang “mga nakaligtas” sa unang paglitaw; sa ikalawa, pinananatili ng “mga lalaking natitira” ang pag-uulit ng ideya nang hindi nagiging mabigat ang estilo.
- source_word: אֲפֵקָה
  choice: patungong Afek
  rationale: Ipinahihiwatig ng directional he ang pagkilos patungo sa Afek; isinalin ang pangalan ayon sa karaniwang baybay-Filipino.
- source_word: הָעִיר
  choice: sa lungsod
  rationale: Tuwirang salin ng עִיר. Pinanatili ang dalawang paglitaw upang maipakita ang pagkakasunod ng pagtakas ng mga natira at ni Ben-hadad.
- source_word: וַתִּפֹּל הַחוֹמָה
  choice: Bumagsak ang pader
  rationale: May tiyak na pantukoy ang “pader” sa Hebreo. Hindi tinukoy kung buong pader ng lungsod o bahagi lamang nito.
- source_word: עַל עֶשְׂרִים וְשִׁבְעָה אֶלֶף אִישׁ
  choice: sa dalawampu't pitong libong lalaki
  rationale: Ang עַל ay angkop na isaling “sa” dito, at ang אִישׁ ay “lalaki” sa kontekstong militar.
- source_word: וּבֶן הֲדַד נָס
  choice: Tumakas din si Ben-hadad
  rationale: Pinananatili ng “tumakas” ang ugnayang leksikal sa unang pandiwa, at natural na ipinahahayag ng “din” ang magkatulad na kilos.
- source_word: חֶדֶר בְּחָדֶר
  choice: sa isang silid na nasa kaloob-looban
  rationale: Ang literal na “silid sa loob ng silid” ay tumutukoy sa isang panloob o pinakaloob na silid. Ang salin ay malinaw at likas sa Filipino habang ang literal na anyo ay inilagay sa talababa.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Iniwasang idagdag ang “nagtago,” bagaman maaaring iyon ang ipinahihiwatig ng konteksto, sapagkat ang pandiwang iyon ay wala sa tekstong Hebreo. Inilagay ang talababa sa pariralang חֶדֶר בְּחָדֶר, hindi sa pangalang Afek.
