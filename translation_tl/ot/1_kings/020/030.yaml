  to: Tumakas patungong Afek at pumasok sa lungsod ang mga nakaligtas. Bumagsak ang pader sa ibabaw ng dalawampu't pitong libong lalaking natitira. Tumakas din si Ben-hadad at pumasok sa lungsod, sa isang silid sa loob ng isa pang silid.[a]
