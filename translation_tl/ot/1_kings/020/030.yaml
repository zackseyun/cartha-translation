  terminology: Ang mga pangalang Afek at Ben-hadad ay angkop na transliterasyon. Ang “mga nakaligtas,” “pader,” at “mga lalaking natitira” ay angkop sa kontekstong pandigmaan. Ang talababa ay nananatiling nakaangkla sa pariralang para sa silid-sa-loob-ng-silid.
