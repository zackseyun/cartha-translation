base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/012.yaml
  text: And when he heard this word[a], while he and the kings were drinking in the booths, he said to his servants[c][b], “Take your positions.” So they took their positions against the city.
translation:
  language: tl
  text: Nang marinig niya ang mensaheng ito[a], habang umiinom siya at ang mga hari sa mga silungan[b], sinabi niya sa kanyang mga lingkod, “Pumuwesto kayo.”[c] Kaya pumuwesto sila laban sa lungsod.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “salitang ito” o “bagay na ito.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “sa mga kubol” o, ayon sa tradisyonal na salin, “sa mga pabilyon.”
    reason: lexical_alternative
  - marker: c
    text: Sa Hebreo, literal na “Maglagay kayo!” ang maikling utos. Malamang na isa itong utos-militar na pumuwesto laban sa lungsod.
    reason: cultural_note
lexical_decisions:
- source_word: הַדָּבָר הַזֶּה
  choice: ang mensaheng ito
  rationale: Malawak ang kahulugan ng דָּבָר—maaaring salita, bagay, o mensahe. Sa konteksto, tugon ni Ahab na ipinaabot kay Ben-hadad ang tinutukoy, kaya natural at tumpak ang “mensaheng ito.”
- source_word: שֹׁתֶה הוּא וְהַמְּלָכִים
  choice: habang umiinom siya at ang mga hari
  rationale: Ipinahihiwatig ng participle ang nagpapatuloy na pag-inom noong marinig niya ang mensahe. Pinananatili ng ayos na ito ang tahasang “siya at ang mga hari” ng Hebreo.
- source_word: בַּסֻּכּוֹת
  choice: sa mga silungan
  rationale: Ang סֻכּוֹת ay mga pansamantala o magagaan na silungan. Mas malinaw sa karaniwang mambabasang Filipino ang “mga silungan” kaysa “mga pabilyon,” nang hindi nagdaragdag ng detalye.
- source_word: שִׂימוּ
  choice: Pumuwesto kayo
  rationale: Tahas at maikli ang utos na Hebreo, literal na “Ilagay!” Sa kontekstong militar, ipinahihiwatig nito ang pagkuha ng kani-kanilang posisyon, ngunit hindi tahasang sinasabing simulan na ang pagsalakay.
- source_word: וַיָּשִׂימוּ עַל הָעִיר
  choice: pumuwesto sila laban sa lungsod
  rationale: Elliptical ang Hebreo. Ang עַל kasunod ng lungsod sa kontekstong militar ay nagpapahiwatig ng mapanalakay na pagpoposisyon laban dito. Pinananatili ng salin ang kaiklian at hindi nagdaragdag ng kagamitang pansalakay o ibang di-binanggit na detalye.
