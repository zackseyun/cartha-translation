translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “lungsod” sa halip na “siyudad” para sa dignified biblical register; maikli ang utos upang mapanatili ang bagsik at kaiklian ng Hebreo.
