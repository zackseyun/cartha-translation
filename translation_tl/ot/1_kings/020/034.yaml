  text: וַ/יֹּ֣אמֶר אֵלָ֡י/ו הֶ/עָרִ֣ים אֲשֶׁר לָֽקַח אָבִ/י֩ מֵ/אֵ֨ת אָבִ֜י/ךָ אָשִׁ֗יב וְ֠/חוּצוֹת תָּשִׂ֨ים לְ/ךָ֤ בְ/דַמֶּ֨שֶׂק֙ כַּ/אֲשֶׁר שָׂ֤ם אָבִ/י֙ בְּ/שֹׁ֣מְר֔וֹן וַ/אֲנִ֖י בַּ/בְּרִ֣ית אֲשַׁלְּחֶ֑/ךָּ וַ/יִּכְרָת ל֥/וֹ בְרִ֖ית וַֽ/יְשַׁלְּחֵֽ/הוּ־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/034.yaml
  text: Then he said to him[a], “The cities that my father took from your father I will restore, and you may establish streets for yourself in Damascus, as my father established them in Samaria.” And I, in the treaty[c][b], will let you go.” So he made a treaty with him and let him go.
translation:
  language: tl
  text: Sinabi ni Ben-hadad sa kanya, “Ibabalik ko ang mga lunsod na kinuha ng aking ama sa iyong ama. Maaari kang magtatag ng mga lansangan[a] para sa sarili mo sa Damasco, gaya ng itinatag ng aking ama sa Samaria.” Sinabi naman ni Ahab, “At ako naman, sa ilalim ng isang kasunduan[b], ay palalayain kita.” Kaya gumawa si Ahab ng kasunduan[c] kay Ben-hadad at pinalaya niya siya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga pamilihan” o “mga purok.” Literal na tumutukoy ang salitang Hebreo sa mga lansangan o lantad na lugar, ngunit dito ay maaaring mangahulugan ng mga pook na pangkalakalan na ipinagkaloob sa pamamagitan ng kasunduan.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “sa isang tipan.” Ang salitang Hebreo ay maaari ring isaling “tipan,” ngunit dito ay tumutukoy ito sa isang pampolitikang kasunduan.
    reason: alternative_reading
  - marker: c
    text: Literal na “pumutol siya ng kasunduan/tipan,” isang karaniwang idyomang Hebreo para sa pormal na paggawa ng isang kasunduang may bisa.
    reason: cultural_note
lexical_decisions:
- source_word: הֶעָרִים
  choice: mga lunsod
  rationale: Karaniwang tumutukoy ang עִיר sa isang lunsod o bayan; ang “mga lunsod” ay angkop sa konteksto ng pagbabalik ng nasakop na teritoryo.
- source_word: לָקַח ... אָשִׁיב
  choice: kinuha ... ibabalik ko
  rationale: Ipinahahayag ng pares ang pagkuha at ang pagbabalik ng dating pag-aari; malinaw at natural ito sa makabagong Tagalog.
- source_word: וְחוּצוֹת
  choice: mga lansangan
  rationale: Ang חוּצוֹת ay literal na mga lansangan o lantad na lugar, bagaman sa kasunduang ito ay maaaring tumukoy sa mga pook na pangkalakalan; pinanatili sa teksto ang kongkretong kahulugan at inilagay sa talababa ang ibang posibilidad.
- source_word: תָּשִׂים לְךָ בְדַמֶּשֶׂק
  choice: maaari ka ring magtatag para sa iyong sarili ... sa Damasco
  rationale: Ang שׂים ay nangangahulugang maglagay o magtatag. Ang “magtatag” ay nababagay sa pagkakaloob ng kinikilalang pook o karapatan sa loob ng isang lunsod.
- source_word: כַּאֲשֶׁר שָׂם אָבִי בְּשֹׁמְרוֹן
  choice: gaya ng itinatag ng aking ama sa Samaria
  rationale: Iniuugnay nito ang ipinapangakong kaayusan sa dating kaayusang ginawa ng ama ni Ben-hadad sa Samaria.
- source_word: בַּבְּרִית
  choice: sa kasunduang ito
  rationale: Ang בְּרִית dito ay isang pampolitikang kasunduan ng mga hari. Ang “kasunduan” ay malinaw sa Tagalog at hindi inaalis ang posibilidad ng saling “tipan.”
- source_word: אֲשַׁלְּחֶךָּ
  choice: palalayain kita
  rationale: Sa konteksto, nangangako si Ahab na pakakawalan si Ben-hadad matapos ang kasunduan; mas tiyak dito ang “palalayain” kaysa “paaalisin.”
- source_word: וַיִּכְרָת לוֹ בְרִית
  choice: nakipagkasundo siya rito
  rationale: Ang כרת ברית ay idyomang Hebreo para sa pormal na paggawa ng isang tipan o kasunduan. Natural na naihahayag ito ng “nakipagkasundo.”
- source_word: וַיְשַׁלְּחֵהוּ
  choice: pinalaya niya ito
  rationale: Inilalahad ng pandiwa ang pagtupad sa naunang pangako at pinananatili ang pag-uulit ng diwa ng אֲשַׁלְּחֶךָּ.
theological_decisions:
- issue: Pagpapakahulugan sa בְּרִית bilang pampolitikang ugnayan ng dalawang hari
  choice: kasunduan
  alternative: tipan
  rationale: Bagaman madalas isalin ang בְּרִית na “tipan,” ang agarang konteksto ay isang napagkasunduang kaayusang pampolitika sa pagitan ng mga hari. Pinananatili sa talababa ang leksikal na alternatibong “tipan.”
- issue: Pagkilala sa nagpapalit na tagapagsalita sa diyalogo
  choice: Tahasan ang “Sinabi ni Ben-hadad” at “Sinabi naman ni Ahab”
  alternative: Panatilihin lamang ang mga panghalip na “siya” at “ako”
  rationale: Sa Hebreo, lumilipat ang tagapagsalita mula kay Ben-hadad tungo kay Ahab sa gitna ng talata. Ang pagbanggit sa mga pangalan ay paglilinaw na kailangan sa Tagalog at hindi nagbabago sa kahulugan ng konteksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “lunsod,” “lansangan,” at “kasunduan” bilang mga salitang madaling maunawaan ngunit angkop sa salaysay na diplomatiko. Tahasang pinangalanan sina Ben-hadad at Ahab upang luminaw ang pagbabago ng tagapagsalita na nakapaloob lamang sa mga panghalip ng Hebreo.
