revisions:
- from: Sinabi ni Ben-hadad sa kanya, “Ibabalik ko ang mga lunsod na kinuha ng aking ama sa iyong ama. Maaari ka ring magtatag para sa iyong sarili ng mga lansangan[a] sa Damasco, gaya ng itinatag ng aking ama sa Samaria.” Sinabi naman ni Ahab, “Sa kasunduang ito[b], palalayain kita.” Kaya nakipagkasundo[c] siya rito at pinalaya niya ito.
  to: Sinabi ni Ben-hadad sa kanya, “Ibabalik ko ang mga lunsod na kinuha ng aking ama sa iyong ama. Maaari kang magtatag ng mga lansangan[a] para sa sarili mo sa Damasco, gaya ng itinatag ng aking ama sa Samaria.” Sinabi naman ni Ahab, “At ako naman, sa ilalim ng isang kasunduan[b], ay palalayain kita.” Kaya gumawa si Ahab ng kasunduan[c] kay Ben-hadad at pinalaya niya siya.
  rationale: Inayos ang maling pantukoy na “rito” upang maipakita na ang kasunduan ay ginawa kay Ben-hadad, hindi “sa” kasunduan. Ginawang mas maingat ang salin ng בַּבְּרִית sa pamamagitan ng pag-aalis ng demonstratibong “ito,” at pinakinis ang ayos ng parirala tungkol sa pagtatatag ng mga lansangan. Hindi binago ang kahulugan, ang politikal na katangian ng בְּרִית, o ang mga leksikal na alternatibong nasa talababa.
