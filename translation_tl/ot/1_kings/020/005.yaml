  to: 'Bumalik ang mga sugo at sinabi, “Ganito ang sabi ni Ben-hadad: ‘Bagaman[a] nagsugo ako sa iyo upang ipasabi, “Ibigay mo sa akin ang iyong pilak at ginto, ang iyong mga asawa at mga anak na lalaki,”’”'
