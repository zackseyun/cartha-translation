base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/005.yaml
  text: 'The messengers returned and said[a], “Thus says Ben-hadad: ‘Though I sent to you, saying, “You shall give me your silver and your gold and your wives and your sons,”’”'
translation:
  language: tl
  text: 'Bumalik ang mga sugo at sinabi, “Ganito ang sabi ni Ben-hadad: ‘Bagaman[a] nagsugo ako sa iyo upang ipasabi, “Ibigay mo sa akin ang iyong pilak at ginto, ang iyong mga asawa at mga anak na lalaki,”’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Sapagkat nagsugo ako sa iyo upang ipasabi …” Maraming posibleng gamit ang salitang Hebreo na כִּי (ki); dito ay itinuring itong pasubali dahil sa paglala ng kahilingan na makukumpleto sa kasunod na talata.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֻׁבוּ
  choice: Bumalik
  rationale: Isinasalaysay ng anyong pandiwa ang sumunod na pangyayari at pinananatili ang diwang muling pagdating ng mga sugo.
- source_word: הַמַּלְאָכִים
  choice: ang mga sugo
  rationale: Sa kontekstong pampolitika at pangmilitar, tumutukoy ito sa mga taong ipinadala bilang tagapagdala ng mensahe, hindi sa mga anghel.
- source_word: כֹּה אָמַר
  choice: Ganito ang sabi
  rationale: Likas at marangal itong katumbas sa modernong Tagalog ng pormulang ginagamit ng isang sugo sa paghahatid ng mismong mensahe.
- source_word: בֶּן הֲדַד
  choice: Ben-hadad
  rationale: Isinalin sa karaniwang transliterasyon ang pangalang pantangi.
- source_word: כִּי
  choice: Bagaman
  rationale: Binabasa itong panandang pasubali dahil ang naunang kahilingan ay pinalulubha pa sa kasunod na talata; pinananatili rin nito ang pangungusap na hindi pa ganap sa dulo ng talatang ito.
- source_word: שָׁלַחְתִּי אֵלֶיךָ
  choice: nagsugo ako sa iyo
  rationale: Tumutukoy ang ganap na pandiwa sa nauna nang pagpapadala ni Ben-hadad ng mga sugo; hindi na kailangang idagdag ang salitang “mensahe.”
- source_word: כַּסְפְּךָ וּזְהָבְךָ
  choice: ang iyong pilak at ginto
  rationale: Pinananatili ang kongkretong katawagan sa mahahalagang metal at iniiwasang gawing mas malawak na “salapi” ang pilak.
- source_word: וְנָשֶׁיךָ
  choice: ang iyong mga asawa
  rationale: Sa konteksto, ang pangmaramihang anyo ay tumutukoy sa mga asawa ni Ahab, hindi lamang sa mga babae sa pangkalahatan.
- source_word: וּבָנֶיךָ
  choice: mga anak na lalaki
  rationale: Tiyak na mga anak na lalaki ang tinutukoy ng anyong Hebreo, kaya hindi ito pinalawak bilang lahat ng anak.
- source_word: לִי תִתֵּן
  choice: Ibigay mo sa akin
  rationale: Inihahayag ng di-ganap na pandiwa ang mariing kahilingan o utos; natural sa Tagalog ang pautos na anyo at pinananatili nito ang lakas ng ultimatum.
