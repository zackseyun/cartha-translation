  text: And he sent messengers into the city[a], to Ahab king of Israel.
translation:
  language: tl
  text: At nagsugo siya ng mga mensahero kay Ahab, na hari ng Israel, patungo sa lungsod[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa lungsod.” Ang anyong Hebreo ng “lungsod” ay may hulaping nagpapahiwatig ng pagkilos patungo roon.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: At nagsugo siya
  rationale: Isinusulong ng wayyiqtol ng שׁלח ang salaysay bilang naganap na kilos. Likas sa Tagalog ang “At nagsugo siya” at hindi nito labis na tinutukoy kung temporal o bunga ang ugnayan.
- source_word: מַלְאָכִים
  choice: mga mensahero
  rationale: Sa kontekstong pampolitika at pangmilitar, mga taong tagapagdala ng mensahe ang tinutukoy, hindi mga anghel.
- source_word: אֶל
  choice: kay
  rationale: Ipinakikilala ng pang-ukol ang taong pinatutunguhan ng mga isinugo; “kay” ang likas na anyo sa Tagalog para sa pangalang pantangi.
- source_word: אַחְאָב
  choice: Ahab
  rationale: Ginamit ang nakagawiang anyo ng pangalan sa mga saling Tagalog.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: na hari ng Israel
  rationale: Malinaw at likas na ipinapahayag ng pariralang ito ang katungkulan ni Ahab bilang hari ng Israel.
- source_word: הָעִירָה
  choice: papasok sa lungsod
  rationale: Ang hulaping pantunguhin na ה ay nagpapahiwatig ng pagkilos patungo sa lungsod; ipinahihiwatig ng “papasok sa lungsod” ang direksiyong iyon sa natural na Tagalog.
