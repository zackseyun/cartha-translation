  to: Tinipon at binigyan ng mga panustos[b] ang mga anak ni Israel[a], at lumakad sila upang salubungin sila. Nagkampo ang mga anak ni Israel sa tapat nila, na parang dalawang munting kawan ng mga kambing[c], ngunit pinuno ng Aram ang lupain.
