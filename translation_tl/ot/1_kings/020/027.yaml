base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/027.yaml
  text: And the sons of Israel were mustered and supplied[a], and they went to meet them. The sons of Israel camped opposite them like two little flocks of goats[c][b], but Aram filled the land.
translation:
  language: tl
  text: Tinipon at binigyan ng mga panustos[b] ang mga anak ni Israel[a], at lumakad sila upang salubungin sila. Nagkampo ang mga anak ni Israel sa tapat nila, na parang dalawang munting kawan ng mga kambing[c], ngunit pinuno ng Aram ang lupain.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga Israelita.” Sa Hebreo, “mga anak ni Israel,” isang tradisyonal na katawagan sa sambayanan.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “pinaglaanan ng mga panustos” o “sinustentuhan.” Malamang na tumutukoy ang pandiwa sa pagbibigay ng mga panustos para sa kampanya o digmaan.
    reason: lexical_alternative
  - marker: c
    text: Di-pangkaraniwan at hindi ganap na tiyak ang salitang Hebreo rito. Ang larawan ay yaong dalawang napakaliit na pangkat ng mga kambing, bilang paghahambing sa napakalaking hukbo ng Aram.
    reason: textual_or_lexical_uncertainty
lexical_decisions:
- source_word: הָתְפָּקְדוּ
  choice: Tinipon
  rationale: Sa kontekstong militar, tumutukoy ang anyo ng פקד sa pagtitipon o paghahanda ng mga kawal, hindi lamang sa pagbilang sa kanila.
- source_word: וְכָלְכְּלוּ
  choice: tinustusan
  rationale: Ang כלכל ay tumutukoy sa paglalaan ng kailangan o panustos. Likas sa modernong Filipino ang “tinustusan” at hindi nito nililimitahan ang kahulugan sa pagkain lamang.
- source_word: לִקְרָאתָם
  choice: upang salubungin ang mga iyon
  rationale: Pinananatili ng “salubungin” ang payak na diwa ng paglabas upang makipagtagpo, habang ipinahihiwatig ng konteksto ang pakikipaglaban.
- source_word: נֶגְדָּם
  choice: sa tapat nila
  rationale: Malinaw na ipinapahayag nito ang magkatapat na puwesto ng dalawang hukbo.
- source_word: כִּשְׁנֵי חֲשִׂפֵי עִזִּים
  choice: na parang dalawang munting kawan ng mga kambing
  rationale: Natural nitong naihahatid ang larawan ng dalawang napakaliit na pangkat, bagaman di-pangkaraniwan at hindi ganap na tiyak ang salitang חֲשִׂפֵי.
- source_word: וַאֲרָם מִלְאוּ אֶת־הָאָרֶץ
  choice: ngunit pinuno ng Aram ang lupain
  rationale: Pinananatili ang larawang “pinuno ang lupain” at ginagamit ang “ngunit” upang ihayag ang malinaw na paghahambing sa napakaliit na hukbo ng Israel. Ang pangalang “Aram” ay kolektibong tumutukoy sa mga Arameo.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Pinananatili nito ang tradisyonal at kolektibong katawagan sa Hebreo habang nananatiling malinaw sa Filipino.
