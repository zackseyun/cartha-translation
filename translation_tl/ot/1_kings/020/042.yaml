base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/042.yaml
  text: 'And he said to him[a], “Thus says Yahweh: Because you have let go from your hand the man I had devoted to destruction, your life shall be for his life, and your people for his people.”'
translation:
  language: tl
  text: 'At sinabi niya sa kanya, “Ganito ang sabi ni Yahweh: Dahil pinakawalan mo mula sa iyong kamay ang lalaking itinalaga ko sa pagkapuksa[a], ang buhay mo ang magiging kapalit ng buhay niya, at ang bayan mo ang kapalit ng bayan niya.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “ang lalaking nasa ilalim ng aking pagbabawal.” Ang salitang Hebreo ay tumutukoy sa isang taong itinalaga sa pagkapuksa sa ilalim ng hatol ng Diyos.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal at tipanang pangalan ng Diyos sa paraang malinaw sa makabagong mambabasang Tagalog.
- source_word: יַעַן
  choice: Dahil
  rationale: Likas at tuwirang ipinapahayag ang sanhi ng hatol.
- source_word: שִׁלַּחְתָּ ... מִיָּד
  choice: pinakawalan mo mula sa iyong kamay
  rationale: Pinananatili ang diwa ng pagpapalaya at ang Hebreong larawan ng kamay bilang pag-iingat o kapangyarihan, nang hindi idinaragdag na tumakas ang lalaki.
- source_word: אִישׁ חֶרְמִי
  choice: ang lalaking itinalaga ko sa pagkapuksa
  rationale: Ipinahahayag ang חֵרֶם bilang pagtatalaga sa pagkapuksa sa ilalim ng hatol ng Diyos, at malinaw na kinakatawan ang unang-panauhang hulapi na 'ko'.
- source_word: וְהָיְתָה נַפְשְׁךָ תַּחַת נַפְשׁוֹ
  choice: ang buhay mo ang magiging kapalit ng buhay niya
  rationale: Ang נֶפֶשׁ ay tumutukoy rito sa buhay, at ang 'kapalit' ay malinaw na naghahatid ng pamalit na diwa ng תַּחַת.
- source_word: וְעַמְּךָ תַּחַת עַמּוֹ
  choice: at ang bayan mo ang kapalit ng bayan niya
  rationale: Pinananatili ang mahigpit na paralelismo at ang diwa ng katumbas na hatol sa naunang sugnay.
- source_word: כֹּה אָמַר
  choice: Ganito ang sinabi
  rationale: Isang natural ngunit marangal na salin ng pormulang ginagamit sa paghahayag ng mensaheng mula sa Diyos.
theological_decisions:
- issue: Paglalarawan sa חֵרֶם sa isang pahayag ng hatol
  choice: itinalaga ko sa pagkapuksa
  alternative: nasa ilalim ng aking pagbabawal; itinakda kong lipulin
  rationale: Pinananatili nito ang bigat ng banal na pagtatalaga at hatol, sa halip na ipakahulugang simpleng personal na pagkapoot o karaniwang parusa.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang anyong pahayag ng propeta at ang paralelismo ng hatol, habang iniwasan ang pagdaragdag ng ideyang 'tumakas,' na hindi tahasang nakasaad sa pandiwang Hebreo.
