  to: 'At sinabi niya sa kanya, “Ganito ang sabi ni Yahweh: Dahil pinakawalan mo mula sa iyong kamay ang lalaking itinalaga ko sa pagkapuksa[a], ang buhay mo ang magiging kapalit ng buhay niya, at ang bayan mo ang kapalit ng bayan niya.”'
