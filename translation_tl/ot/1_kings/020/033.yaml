base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/033.yaml
  text: The men were watching for an omen[a], and they quickly seized on it from him and said, “Ben-hadad is your brother.” And he said, “Come, take him.” Then Ben-hadad came out to him[c][b], and he had him come up into the chariot.
translation:
  language: tl
  text: Nag-aabang ang mga lalaki ng isang tanda[a], at agad nilang sinunggaban ang sinabi niya[b] at nagsabi, “Si Ben-hadad ay kapatid mo.” Sinabi niya, “Halikayo, kunin ninyo siya.” Lumabas si Ben-hadad at lumapit sa kanya, at pinasakay niya si Ben-hadad sa karwahe[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “naghuhula mula sa mga palatandaan” o “itinuturing itong isang tanda.” Ang pandiwang Hebreo ay maaaring tumukoy sa paghahanap o pagbibigay-kahulugan sa mga omen; dito, malamang na nag-aabang sila ng paborableng pahiwatig sa mga salita ni Ahab.
    reason: lexical_alternative
  - marker: b
    text: Mahirap ang pananalitang Hebreo. Ang diwa ay mabilis nilang pinanghawakan ang sinabi ni Ahab bilang isang paborableng pagkilala o pagsang-ayon.
    reason: lexical_alternative
  - marker: c
    text: 'Sa Hebreo, causative ang pandiwa: pinapangyari ni Ahab na sumakay si Ben-hadad sa karwahe. Maaari ring isalin, “at isinakay niya si Ben-hadad sa karwahe.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְנַחֲשׁוּ
  choice: nag-aabang ng isang tanda
  rationale: Ang Piel ng נחשׁ ay maaaring tumukoy sa paghahanap o pagbasa ng omen. Sa tagpong ito, hinihintay ng mga tauhan ang anumang paborableng pahiwatig sa mga salita ni Ahab; pinananatili ng “tanda” ang diwa nang hindi ipinapalagay na nagsasagawa sila ng pormal na ritwal.
- source_word: וַיְמַהֲרוּ
  choice: agad
  rationale: Likas na ipinapahayag sa modernong Tagalog ang mabilis nilang pagtugon sa napansin nilang pahiwatig.
- source_word: וַיַּחְלְטוּ הֲמִמֶּנּוּ
  choice: agad nilang sinunggaban ang sinabi niya
  rationale: Mahirap ang pariralang Hebreo, ngunit malamang na inilalarawan nitong mabilis nilang pinanghawakan bilang tiyak at kapaki-pakinabang ang salitang binitiwan ni Ahab. Ang bagay na sinunggaban—ang sinabi niya—ay ipinahihiwatig lamang sa Hebreo ngunit malinaw sa konteksto.
- source_word: אָחִיךָ
  choice: kapatid mo
  rationale: Tuwirang pinananatili ang diplomatikong katawagang “kapatid,” na siyang agad na sinamantala ng mga tauhan.
- source_word: בֹּאוּ קָחֻהוּ
  choice: Halika, kunin ninyo siya
  rationale: Pinananatili ang dalawang pautos. Bagaman maramihan ang unang pandiwa sa Hebreo, hindi karaniwang minamarkahan sa Tagalog ang bilang sa “halika”; nililinaw ng “ninyo” na higit sa isa ang kausap.
- source_word: וַיַּעֲלֵהוּ עַל הַמֶּרְכָּבָה
  choice: pinasakay niya ito sa karwahe
  rationale: Ipinahahayag ng “pinasakay” ang causative na anyo ng עלה nang natural, nang hindi nagpapahiwatig na pisikal niyang binuhat si Ben-hadad.
- source_word: הַמֶּרְכָּבָה
  choice: ang karwahe
  rationale: May tiyak na pantukoy ang Hebreo ngunit walang tahasang panghalip na paari, kaya hindi idinagdag ang “kanyang.”
