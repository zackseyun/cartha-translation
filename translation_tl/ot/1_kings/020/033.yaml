revisions:
- from: Ang mga lalaki ay nag-aabang ng isang tanda[a], at agad nilang sinunggaban ang sinabi niya[b] at sinabi, “Kapatid mo si Ben-hadad.” Sinabi niya, “Halika, kunin ninyo siya.” Kaya lumabas si Ben-hadad papunta sa kanya, at pinasakay niya ito sa karwahe.[c]
  to: Nag-aabang ang mga lalaki ng isang tanda[a], at agad nilang sinunggaban ang sinabi niya[b] at nagsabi, “Si Ben-hadad ay kapatid mo.” Sinabi niya, “Halikayo, kunin ninyo siya.” Lumabas si Ben-hadad at lumapit sa kanya, at pinasakay niya si Ben-hadad sa karwahe[c].
  rationale: Inayos ang maramihang pautos, pinalinaw ang paglapit ni Ben-hadad, at pinalitan ang maling “pangitain” sa talababa ng paliwanag na tumutugma sa omen-seeking na saklaw ng pandiwang Hebreo. Pinanatili ang maingat na “tanda” sa pangunahing teksto at ang causative na “pinasakay.”
