  yaml_path: translation/ot/1_kings/020/024.yaml
  text: 'And do this thing: remove the kings[a], each from his place, and put governors in their place.'
translation:
  language: tl
  text: 'At gawin mo ito: alisin mo ang mga hari, bawat isa mula sa kani-kanilang puwesto, at maglagay ka ng mga gobernador bilang kapalit nila.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “magtalaga ka ng mga gobernador ng lalawigan bilang kapalit nila.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת הַדָּבָר הַזֶּה ... עֲשֵׂה
  choice: At gawin mo ito
  rationale: Likas at tuwirang utos sa modernong Tagalog; ipinahihiwatig ng “ito” ang ‘bagay na ito’ nang hindi nagiging mabigat ang pananalita.
- source_word: הָסֵר
  choice: alisin mo
  rationale: Ipinapahayag ng Hiphil imperative ang pagpapaaalis o pagtanggal, nang hindi nagpapasiya kung ganap silang pinatalsik sa paghahari o inalis lamang sa kanilang tungkulin sa hukbo.
- source_word: הַמְּלָכִים אִישׁ מִמְּקֹמוֹ
  choice: ang mga hari, ang bawat isa sa kanyang puwesto
  rationale: Pinananatili ang maramihang “mga hari” at ang distributibong diwa ng אִישׁ. Ang “puwesto” ay maaaring tumukoy sa kinalalagyan o katungkulan, gaya ng posibleng saklaw ng מָקוֹם sa konteksto.
- source_word: וְשִׂים
  choice: at maglagay ka
  rationale: Malapit sa literal na diwa ng שׂים na ‘ilagay/italaga,’ at malinaw sa konteksto na sila ang ipapalit.
- source_word: פַּחוֹת
  choice: mga gobernador
  rationale: Tumutukoy sa mga opisyal na tagapangasiwa, karaniwang mga gobernador; hindi ito nilimitahan sa ranggong militar lamang.
- source_word: תַּחְתֵּיהֶם
  choice: bilang kapalit nila
  rationale: Bagaman literal na maaaring ‘sa ilalim nila,’ malinaw na ang idyoma rito ay nagpapahayag ng pagpapalit sa kanila.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran at marangal. Ginamit ang “puwesto” upang mapanatili ang posibilidad na tumutukoy ito sa lugar o tungkulin; iniwasan ang mas tiyak na “patalsikin” upang hindi lampasan ang sinasabi ng Hebreo.
