  source_fidelity: 'Tumpak ang pangunahing diwa: sagot ng hari, utos sa mga mensahero, at ang kasabihang nagbabawal sa maagang pagmamataas. Ngunit ang “sandata” ay karaniwang armas na hawak, hindi bagay na isinusuot at hinuhubad; mas angkop ang “baluti” sa ipinahihiwatig na larawang pandigma. Ang “pa lamang” ay katanggap-tanggap na pagpapalinaw ng kontrast ngunit hindi dapat magpahiwatig ng higit pa kaysa sa kasabihan.'
  naturalness: Natural ang karamihan ng pangungusap, ngunit hindi idiomatiko ang “naghuhubad na nito,” sapagkat ang “maghubad” ay karaniwang walang tuwirang pantukoy sa baluti/suot na bagay sa ganitong anyo. Ang “nagtatanggal na nito” ay mas malinaw at likas.
  terminology: Ang “magmalaki” ay mahusay na katumbas ng יִתְהַלֵּל. Ginamit ang “baluti” upang maging likas ang magkatapat na kilos ng pagsusuot at pagtatanggal, nang hindi itinatakda ang eksaktong uri ng kagamitang pandigma. Sa talababa, pinanatili ang mas malapit na mga pandiwang “nagbibigkis” at “nagkakalag.”
