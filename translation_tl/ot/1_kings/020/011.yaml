  text: And the king of Israel answered and said[a], “Tell him, ‘Let not the one who girds on his armor boast like the one who takes it off.’”
translation:
  language: tl
  text: At sumagot ang hari ng Israel, “Sabihin ninyo sa kanya, ‘Ang nagsusuot pa lamang ng baluti ay huwag magmalaki na gaya ng nagtatanggal na nito.’”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo, mas literal: “Huwag magmalaki ang nagbibigkis na gaya ng nagkakalag.” Inihahambing ng kasabihan ang naghahanda pa lamang sa labanan sa nag-aalis na ng baluti pagkatapos nito.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן מֶלֶךְ יִשְׂרָאֵל וַיֹּאמֶר
  choice: At sumagot ang hari ng Israel
  rationale: Ang ענה sa pormulang pambanghay ay nangangahulugang ‘sumagot.’ Hindi na inulit ang literal na ‘sumagot at sinabi’ sapagkat labis itong paulit-ulit sa natural na modernong Tagalog, ngunit nananatili ang tungkulin nitong magpakilala ng tugon.
- source_word: דַּבְּרוּ
  choice: Sabihin ninyo sa kanya
  rationale: Pautos na pangalawang panauhang maramihan ito, na nakatuon sa mga mensahero. Ang ‘sa kanya’ ay ipinahihiwatig ng konteksto at nililinaw ang patutunguhan ng mensahe.
- source_word: אַל יִתְהַלֵּל
  choice: huwag magmalaki
  rationale: Ang Hitpael ng הלל dito ay tumutukoy sa pagyayabang o pagmamalaki sa sarili; natural at angkop sa salawikaing Filipino ang ‘huwag magmalaki.’
- source_word: חֹגֵר
  choice: ang nagsusuot pa lamang ng sandata
  rationale: Literal itong ‘ang nagbibigkis/nagsusuot.’ Ipinahihiwatig ng kontekstong pandigma ang sandata o kagamitang pandigma. Ang ‘pa lamang’ ay malinaw na naghahatid ng yugto ng paghahanda bago ang labanan.
- source_word: כִּמְפַתֵּחַ
  choice: na gaya ng naghuhubad na nito
  rationale: Ang פתח dito ay ‘magluwag/magkalag.’ Kabaligtaran ng pagsusuot, tumutukoy ito sa pag-aalis ng kagamitang pandigma matapos ang labanan; ang ‘nito’ ay tumutukoy sa sandata.
