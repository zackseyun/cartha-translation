base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/017.yaml
  text: Then the young men of the commanders of the provinces went out first[a], and Ben-hadad sent, and they reported to him, saying, “Men have come out from Samaria.”
translation:
  language: tl
  text: Unang lumabas ang mga kabataan ng mga pinuno ng mga lalawigan. Nagsugo naman si Ben-hadad[a], at iniulat nila sa kanya, “May mga lalaking lumabas mula sa Samaria.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “nagsugo” lamang; hindi tahasang sinasabi kung sino ang isinugo, bagaman ipinahihiwatig ng sumunod na ulat na nagpadala siya ng mga tao upang magmasid o magsiyasat.
    reason: Pinananatili ang di-tiyak na layon ng pandiwang Hebreo habang nililinaw ang posibleng kahulugan nito ayon sa konteksto.
lexical_decisions:
- source_word: נַעֲרֵי
  choice: mga kabataang tauhan
  rationale: Maaaring tumukoy ang נַעַר sa kabataan, lingkod, tagapaglingkod, o ayudant. Pinananatili ng “kabataang tauhan” ang pangunahing diwa ng kabataan at ang kaugnayan nila sa mga pinuno sa kontekstong militar.
- source_word: שָׂרֵי הַמְּדִינוֹת
  choice: mga pinuno ng mga lalawigan
  rationale: Ang שָׂרִים ay maaaring mga pinuno, opisyal, o kumandante, at ang מְדִינוֹת ay mga lalawigan o distritong administratibo. Ang salin ay malapit sa anyo ng Hebreo nang hindi labis na nililimitahan sa tungkuling militar.
- source_word: בָּרִאשֹׁנָה
  choice: unang lumabas
  rationale: Ipinahihiwatig nito ang pagkauna sa pagkakasunod-sunod; hindi ipinapasok ang mas tiyak ngunit hindi tahasang ideya ng “unang pangkat” o “unang bugso.”
- source_word: וַיִּשְׁלַח
  choice: Nagsugo
  rationale: Tahasan lamang na “nagsugo” ang pandiwang Hebreo at walang binanggit na layon. Likas sa Tagalog ang “nagsugo” kahit ipinauunawa lamang sa konteksto kung sino ang isinugo.
- source_word: וַיַּגִּידוּ לוֹ לֵאמֹר
  choice: at iniulat nila sa kanya
  rationale: Ang Hiphil ng נגד ay nangangahulugang magpahayag, magsabi, o mag-ulat. Ang “iniulat” ay angkop sa ulat-militar, at ang tuwirang sipi ay sapat nang nagpapakilala sa nilalaman ng sinabi.
- source_word: אֲנָשִׁים
  choice: mga lalaki
  rationale: Masculine plural ang salita at sa konteksto ay malamang na tumutukoy sa mga lalaking mandirigma o sugo na lumalabas sa lungsod.
- source_word: יָצְאוּ מִשֹּׁמְרוֹן
  choice: lumabas mula sa Samaria
  rationale: Inilalarawan ng ganap na pandiwa ang nangyari nang paglabas nila sa lungsod; natural at tapat dito ang “lumabas mula sa Samaria.”
- source_word: בֶּן הֲדַד
  choice: Ben-hadad
  rationale: Karaniwang transliterasyon sa Filipino ng personal na pangalang Hebreo.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kabataang tauhan” upang maipahayag kapwa ang edad at ang tungkulin ng נַעֲרֵי, at iniwasang idagdag sa pangunahing teksto ang “mga espiya” o “mga tagapagmanman,” na hindi tahasang nasa Hebreo.
