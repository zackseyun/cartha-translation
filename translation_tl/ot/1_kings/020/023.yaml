base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/023.yaml
  text: And the servants of the king of Aram said to him[a], “Their gods are gods of the hills; therefore they were stronger than we were. But if we fight against them on the plain, surely we will be stronger than they are.”
translation:
  language: tl
  text: At sinabi sa kanya ng mga lingkod ng hari ng Aram, “Ang kanilang mga diyos[a] ay mga diyos ng kabundukan; kaya mas malakas sila kaysa sa atin. Ngunit makipaglaban tayo sa kanila sa kapatagan, at tiyak na magiging mas malakas tayo kaysa sa kanila.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Ang kanilang Diyos ay diyos ng kabundukan …” Gumagamit ang Hebreo ng mga anyong maramihan (“mga diyos”), na sumasalamin sa paganong paraan ng pagsasalita ng mga Arameo tungkol sa Diyos ng Israel.'
    reason: alternative_reading
lexical_decisions:
- source_word: עַבְדֵי
  choice: mga lingkod
  rationale: Tuwirang katumbas ito ng salita sa konteksto ng maharlikang sambahayan, habang maaari ring saklawin ang mga tauhan o opisyal ng hari.
- source_word: אֲרָם
  choice: Aram
  rationale: Pinanatili ang sinaunang pangalang pantangi sa halip na gamitin ang mas huling katawagang heograpiko na Siria.
- source_word: אֱלֹהֵי הָרִים אֱלֹהֵיהֶם
  choice: Mga diyos ng kabundukan ang kanilang mga diyos
  rationale: Pinananatili ang mga anyong maramihan sa Hebreo at ang politeistikong pananaw ng mga Arameong nagsasalita. Ang “kabundukan” ay likas na kasalungat ng “kapatagan” sa kasunod na sugnay.
- source_word: עַל כֵּן
  choice: kaya
  rationale: Natural at malinaw na ipinapahayag ang ugnayang sanhi at bunga.
- source_word: חָזְקוּ מִמֶּנּוּ
  choice: mas malakas sila kaysa sa atin
  rationale: Pinananatili ang paghahambing ng lakas at iniiwasang gawing mas interpretatibong “nanaig.”
- source_word: וְאוּלָם
  choice: Ngunit
  rationale: Dignified at karaniwang panandang nagpapakita ng pagsalungat sa naunang paliwanag.
- source_word: נִלָּחֵם אִתָּם
  choice: makipaglaban tayo sa kanila
  rationale: Ipinahahayag ang mungkahing kumilos na taglay ng unang panauhang maramihan sa kontekstong militar.
- source_word: בַּמִּישׁוֹר
  choice: sa kapatagan
  rationale: Tumpak na tumutukoy sa patag na lupain at malinaw na ikinokontra ito sa kabundukan.
- source_word: אִם לֹא
  choice: tiyak na
  rationale: Sa konteksto, isa itong idyomatikong mariing pagpapatibay, hindi isang literal na kondisyong pasalungat.
- source_word: נֶחֱזַק מֵהֶם
  choice: magiging mas malakas tayo kaysa sa kanila
  rationale: Pinananatili ang paghahambing at ang pag-uulit ng salitang-ugat na חזק mula sa naunang sugnay.
theological_decisions:
- issue: Paglalarawan ng mga Arameo sa Diyos ng Israel
  choice: “Mga diyos ng kabundukan ang kanilang mga diyos”
  alternative: “Diyos ng kabundukan ang kanilang Diyos”
  rationale: Ang pangungusap ay iniulat na pananalita ng mga paganong Arameo, hindi pagpapatibay ng tagapagsalaysay. Pinananatili ng maramihang anyo ang kanilang maling pagkaunawa at ang ironiya ng salaysay nang hindi tahimik na itinutuwid ang tensiyong teolohikal.
translation_notes:
  register: Makabagong Filipino na malinaw at marangal. Pinanatili ang pag-uulit ng paghahambing na “mas malakas” at ang kontrast ng “kabundukan” at “kapatagan.”
