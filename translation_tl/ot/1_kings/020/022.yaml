  text: וַ/יִּגַּ֤שׁ הַ/נָּבִיא֙ אֶל מֶ֣לֶךְ יִשְׂרָאֵ֔ל וַ/יֹּ֤אמֶר ל/וֹ֙ לֵ֣ךְ הִתְחַזַּ֔ק וְ/דַ֥ע וּ/רְאֵ֖ה אֵ֣ת אֲשֶֽׁר תַּעֲשֶׂ֑ה כִּ֚י לִ/תְשׁוּבַ֣ת הַ/שָּׁנָ֔ה מֶ֥לֶךְ אֲרָ֖ם עֹלֶ֥ה עָלֶֽי/ךָ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/022.yaml
  text: Then the prophet came near to the king of Israel and said to him[a], “Go, strengthen yourself, and know and see what you should do[c][b], because at the turn of the year the king of Aram will come up against you.”
translation:
  language: tl
  text: Pagkatapos, lumapit ang propeta sa hari ng Israel at sinabi sa kanya, “Humayo ka, magpakalakas ka, at alamin at tingnan mo kung ano ang dapat mong gawin[a], sapagkat sa pag-ikot ng taon[b] ay sasalakay sa iyo ang hari ng Aram[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “kung ano ang gagawin mo.” Anyong panghinaharap ang pandiwa sa Hebreo, ngunit sa kontekstong ito ay malamang na tumutukoy sa nararapat gawin ng hari bilang paghahanda.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “sa pagbalik/pag-ikot ng taon,” isang idyomang madalas tumukoy sa panahong muling sinisimulan ang mga kampanyang militar; mas malayang isinasalin ito ng ilan na “sa susunod na tagsibol.”
    reason: cultural_note
  - marker: c
    text: Tradisyonal na “Siria”; “Aram” ang nasa Hebreo.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּגַּשׁ
  choice: lumapit
  rationale: Tuwirang ipinapahayag ang paglapit ng propeta at likas sa salaysay na Tagalog.
- source_word: הִתְחַזַּק
  choice: magpakalakas ka
  rationale: 'Pinananatili ang reflexive na diwa ng Hitpael: ihanda at palakasin ng hari ang kanyang sarili, hindi lamang magkaroon ng tapang.'
- source_word: וְדַע וּרְאֵה
  choice: alamin at tingnan mo
  rationale: Pinananatili ang dalawang magkaugnay ngunit magkahiwalay na utos sa Hebreo sa halip na pagsamahin sa iisang pandiwa.
- source_word: אֵת אֲשֶׁר תַּעֲשֶׂה
  choice: kung ano ang dapat mong gawin
  rationale: Bagaman anyong panghinaharap ang pandiwa, ang konteksto ay payo tungkol sa nararapat na paghahanda; inilalahad sa talababa ang mas literal na alternatibo.
- source_word: לִתְשׁוּבַת הַשָּׁנָה
  choice: sa pag-ikot ng taon
  rationale: Pinananatili ang larawang Hebreo ng pag-ikot o pagbabalik ng taon habang ipinapaliwanag sa talababa ang kaugnayan nito sa panahon ng mga kampanyang militar.
- source_word: מֶלֶךְ אֲרָם
  choice: hari ng Aram
  rationale: Tuwirang tinutumbasan ang pangalang Hebreo na אֲרָם sa halip na palitan ito ng mas huling katawagang heograpiko na Siria.
- source_word: עֹלֶה עָלֶיךָ
  choice: sasalakay sa iyo
  rationale: Sa kontekstong militar, ang pariralang עלה על ay tumutukoy sa pagmartsa o pagsalakay laban sa isang kalaban; ang panghinaharap ay likas na nagpapahayag ng babala sa Tagalog.
