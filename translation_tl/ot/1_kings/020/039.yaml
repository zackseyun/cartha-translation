  text: וַ/יְהִ֤י הַ/מֶּ֨לֶךְ֙ עֹבֵ֔ר וְ/ה֖וּא צָעַ֣ק אֶל הַ/מֶּ֑לֶךְ וַ/יֹּ֜אמֶר עַבְדְּ/ךָ֣ יָצָ֣א בְ/קֶֽרֶב הַ/מִּלְחָמָ֗ה וְ/הִנֵּֽה אִ֨ישׁ סָ֜ר וַ/יָּבֵ֧א אֵלַ֣/י אִ֗ישׁ וַ/יֹּ֨אמֶר֙ שְׁמֹר֙ אֶת הָ/אִ֣ישׁ הַ/זֶּ֔ה אִם הִפָּקֵד֙ יִפָּקֵ֔ד וְ/הָיְתָ֤ה נַפְשְׁ/ךָ֙ תַּ֣חַת נַפְשׁ֔/וֹ א֥וֹ כִכַּר כֶּ֖סֶף תִּשְׁקֽוֹל־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/039.yaml
  text: As the king was passing by[a], he cried out to the king and said, “Your servant went out into the midst of the battle, and behold, a man turned aside and brought a man to me and said, ‘Guard this man. If he is ever missing, then your life shall be for his life[b], or you shall weigh out a talent of silver.’”
translation:
  language: tl
  text: Habang dumaraan ang hari, may sumigaw sa hari at nagsabi, “Ang lingkod ninyo ay pumunta sa gitna ng labanan. At narito, may isang lalaking humiwalay at nagdala sa akin ng isa pang lalaki. Sinabi niya, ‘Bantayan mo ang lalaking ito. Kung talagang mawala siya,[a] ang buhay mo ang magiging kapalit ng buhay niya;[b] o magtimbang ka ng isang talento ng pilak.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo, inuulit sa magkaugnay na anyo ang pandiwang “mawala” upang bigyang-diin ang kondisyon: “kung talagang mawala” o “kung sa anumang paraan ay hindi siya matagpuan.”'
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “ang buhay mo sa ilalim ng buhay niya,” isang pormulang legal na nangangahulugang ang buhay ng isa ang ipapalit sa buhay ng iba.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹבֵר
  choice: dumaraan
  rationale: Ang participle kasunod ng ויהי ay naglalarawan ng nagpapatuloy na kilos sa likuran; natural itong ipinahahayag sa Filipino bilang “habang dumaraan.”
- source_word: צָעַק
  choice: sumigaw
  rationale: Ipinahihiwatig ng pandiwa ang malakas at apurahang pagtawag; malinaw at natural ang “sumigaw” sa konteksto.
- source_word: עַבְדְּךָ
  choice: Ang lingkod ninyo
  rationale: Ito ay magalang na pagtukoy ng nagsasalita sa sarili sa harap ng hari. Ang “ninyo” ay angkop na magalang na panghalip sa modernong Filipino.
- source_word: בְּקֶרֶב הַמִּלְחָמָה
  choice: sa gitna ng labanan
  rationale: Pinananatili nito ang diwa ng קֶרֶב bilang kaloob-looban o gitna ng nagaganap na labanan.
- source_word: וְהִנֵּה
  choice: At narito
  rationale: Pinananatili nito ang masiglang pagpapakilala sa bigla o kapansin-pansing pangyayari nang may bahagyang marangal na himig.
- source_word: אִישׁ סָר
  choice: may isang lalaking humiwalay
  rationale: Ang סוּר ay tumutukoy sa paglihis o paghiwalay; sa tagpong militar, malamang na humiwalay ang lalaki mula sa labanan o hanay, ngunit hindi tinutukoy sa salin kung saan siya humiwalay.
- source_word: וַיָּבֵא אֵלַי אִישׁ
  choice: nagdala sa akin ng isa pang lalaki
  rationale: Nililinaw ng “isa pang lalaki” na magkaiba ang lalaking lumapit at ang lalaking iniwan sa pangangalaga ng nagsasalita.
- source_word: שְׁמֹר
  choice: Bantayan mo
  rationale: Ang pautos ay tumutukoy sa pag-iingat sa isang taong ipinagkatiwala; karaniwan at angkop sa kustodiyal na konteksto ang “bantayan.”
- source_word: אִם הִפָּקֵד יִפָּקֵד
  choice: Kung sakaling mawala nga siya
  rationale: Ang “nga” ay naghahatid ng diin ng infinitive absolute kasama ng finite verb, habang ang “mawala” ay nagpapanatili sa posibilidad na hindi na siya matagpuan o maipakita nang hindi sinasabi kung paano iyon nangyari.
- source_word: נַפְשְׁךָ תַּחַת נַפְשׁוֹ
  choice: ang buhay mo ang ipapalit sa buhay niya
  rationale: Ang נֶפֶשׁ dito ay “buhay,” at ang תַּחַת ay nagpapahayag ng legal na pagpapalit o pagsubstitusyon.
- source_word: כִּכַּר כֶּסֶף
  choice: isang talento ng pilak
  rationale: Ang כִּכַּר ay sinaunang yunit ng timbang na karaniwang tinatawag na “talento”; hindi ito ginawang tiyak na modernong timbang dahil pabago-bago ang katumbas nito.
- source_word: תִּשְׁקוֹל
  choice: magtimbang
  rationale: Literal na tumutukoy ang pandiwa sa pagtimbang, na angkop sa pagbabayad ng pilak ayon sa timbang; pinananatili nito ang kongkretong larawan ng Hebreo.
theological_decisions:
- issue: Kahulugan ng נֶפֶשׁ sa pormulang kaparusahan
  choice: buhay
  alternative: kaluluwa
  rationale: Sa kontekstong legal at militar, ang nakataya ay buhay ng tagapagbantay kapalit ng buhay ng bilanggo, hindi isang pahayag tungkol sa hiwalay na kaluluwa.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang magalang na “ninyo” sa pakikipag-usap sa hari, samantalang karaniwang isahan na “mo” ang nasa siniping utos. Pinanatili ang masiglang “At narito” at ang sinaunang yunit na “talento” upang hindi mawala ang kulay at konkretong anyo ng tekstong Hebreo.
