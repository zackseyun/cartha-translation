  source_fidelity: 'Tumpak sa kabuuan ang pagsasalin ng pangunahing mga parirala: ang hari ay dumaraan, may tumawag sa hari, ang lingkod ay nasa gitna ng labanan, may lalaking lumihis at nagdala ng ibang lalaki, at ang kaparusahan ay buhay kapalit ng buhay o isang talento ng pilak. Gayunman, ang “sumigaw siya rito” ay may hindi kanais-nais na kalabuan sa Filipino dahil ang pinakamalapit na tinutukoy ng “siya” ay ang hari mismo. Ang binagong anyo ay ginagawang malinaw ang ugnayan nang hindi nagdaragdag ng kahulugan.'
