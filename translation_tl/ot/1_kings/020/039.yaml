    rationale: Nais nitong ipahayag ang diin ng infinitive absolute at finite verb, ngunit ang pagsasamang “sakaling” at “nga” ay medyo mabigat. Ang “Kung talagang mawala siya” ay mas malinaw at may sapat na diin.
