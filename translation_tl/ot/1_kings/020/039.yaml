  to: Habang dumaraan ang hari, may sumigaw sa hari at nagsabi, “Ang lingkod ninyo ay pumunta sa gitna ng labanan. At narito, may isang lalaking humiwalay at nagdala sa akin ng isa pang lalaki. Sinabi niya, ‘Bantayan mo ang lalaking ito. Kung talagang mawala siya,[a] ang buhay mo ang magiging kapalit ng buhay niya;[b] o magtimbang ka ng isang talento ng pilak.’”
