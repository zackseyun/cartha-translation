  terminology: Ang “lingkod ninyo,” “bantayan,” “buhay,” at “talento ng pilak” ay angkop. Ang “buhay mo ang magiging kapalit ng buhay niya” ay malinaw na Filipino at pinananatili ang legal na pormula ng pagpapalit nang hindi ipinapataw ang isang doktrinal na pagbasa sa נפשׁ.
