  source_fidelity: 'Tumpak na naisasalin ang mga pangunahing elemento ng Hebreo: telang sako sa baywang, mga lubid sa ulo, ang mapagpakumbabang pagtukoy na “lingkod mo,” ang pakiusap na mabuhay, at ang tanong kung buhay pa si Ben-hadad. Ang “Kapatid ko siya” ay wastong pinananatiling literal at hindi nilulutas ang sinadyang kalabuan ng אָחִי.'
  naturalness: Malinaw at marangal ang pangkalahatang register. Mas tuwiran at mas malapit sa payak na sunod-sunod na salaysay ng Hebreo ang pagsisimula sa “Nagbigkis sila” kaysa “Kaya nagbigkis sila,” dahil ang “Kaya” ay nagdaragdag ng isang ipinahiwatig na lohikal na ugnayan. Ang “baywang” at “ulo” ay maaaring gamitin nang walang “mga” sa pangkalahatang distributibong kahulugang ito.
  terminology: Ang “telang sako,” “lubid,” at “lingkod” ay angkop sa modernong Filipino Tagalog at sa konteksto ng diplomatikong pagpapakumbaba. Ang “kapatid” ay wastong terminong pinanatiling bukás ang saklaw na pampolitika o pakikipagtipan.
