base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/032.yaml
  text: So they tied sackcloth around their waists and ropes on their heads[a], and they came to the king of Israel and said, “Your servant Ben-hadad says, ‘Please let me live.’” And he said[b], “Is he still alive? He is my brother.”
translation:
  language: tl
  text: 'Nagbigkis sila ng telang sako sa kanilang baywang at naglagay ng mga lubid sa kanilang ulo. Pumunta sila sa hari ng Israel at sinabi, “Ganito ang sabi ng lingkod mong si Ben-hadad: ‘Nakikiusap ako, hayaan mo akong mabuhay.’” Sumagot ang hari, “Buhay pa ba siya? Kapatid ko siya.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “kapatid” dito ay malamang na tumutukoy sa pagkakapatirang pampolitika o bunga ng isang kasunduan, hindi sa literal na magkapatid sa pamilya.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּחְגְּרוּ
  choice: nagbigkis sila
  rationale: Ipinapahayag ng חגר ang pagbibigkis o pagtatali sa katawan; ang “nagbigkis” ay dignificado ngunit malinaw sa makabagong Filipino.
- source_word: שַׂקִּים בְּמָתְנֵיהֶם
  choice: telang-sako sa kanilang mga baywang
  rationale: Ang שַׂקִּים ay magaspang na telang ginagamit bilang tanda ng pagluluksa o pagpapakumbaba, at ang מָתְנַיִם ay tumutukoy sa baywang.
- source_word: וַחֲבָלִים בְּרָאשֵׁיהֶם
  choice: mga lubid sa kanilang mga ulo
  rationale: Pinananatili nito ang konkretong larawan at hindi ipinapalagay kung paano eksaktong inilagay o itinali ang mga lubid.
- source_word: עַבְדְּךָ
  choice: lingkod mo
  rationale: Sa diplomatikong pananalita sa hari, ito ay pormula ng pagpapakumbaba; mas angkop dito ang “lingkod” kaysa “alipin.”
- source_word: תְּחִי נָא נַפְשִׁי
  choice: Nakikiusap ako, hayaan mo akong mabuhay
  rationale: Literal itong “mabuhay sana ang aking buhay/kaluluwa”; ang salin ay natural na pakiusap na iligtas ang nagsasalita sa kamatayan.
- source_word: הַעוֹדֶנּוּ חַי
  choice: Buhay pa ba siya?
  rationale: Direkta at likas na Filipino para sa tanong kung nananatili pa siyang buhay.
- source_word: אָחִי הוּא
  choice: Kapatid ko siya
  rationale: Pinananatili ang payak na katawagang pangkamag-anak at ang sadyang kalabuan ng konteksto.
theological_decisions:
- issue: Kahulugan ng “kapatid” sa sagot ng hari
  choice: Panatilihin nang literal ang “Kapatid ko siya.”
  alternative: “Kakampi ko siya” o “Para ko siyang kapatid.”
  rationale: Ginagamit ng Hebreo ang karaniwang salitang אָחִי, “kapatid ko.” Malamang na pampolitika o pakikipagtipang pagkakapatiran ito sa konteksto, ngunit hindi iyon tahasang nililinaw ng teksto; pinananatili ng literal na salin ang tensiyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “telang-sako” upang ipakita ang materyal na tanda ng pagpapakumbaba, at iniwasang linawin nang lampas sa Hebreo ang ayos ng mga lubid at ang diwa ng “kapatid.”
