  to: 'Nagbigkis sila ng telang sako sa kanilang baywang at naglagay ng mga lubid sa kanilang ulo. Pumunta sila sa hari ng Israel at sinabi, “Ganito ang sabi ng lingkod mong si Ben-hadad: ‘Nakikiusap ako, hayaan mo akong mabuhay.’” Sumagot ang hari, “Buhay pa ba siya? Kapatid ko siya.”[a]'
