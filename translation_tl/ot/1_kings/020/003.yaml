base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/003.yaml
  text: 'And he said to him[a], “Thus says Ben-hadad: Your silver and your gold are mine; your wives and your sons, the best, are mine.”'
translation:
  language: tl
  text: 'At sinabi niya sa kanya, “Ganito ang sabi ni Ben-hadad: Akin ang iyong pilak at ginto; ang iyong mga asawa at mga anak mong lalaki—ang pinakamaiinam[a]—ay akin.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “mabubuti,” “pinakamahuhusay,” o “pinakapili.” Maaari ring unawain ang parirala bilang “ang iyong mga asawa at ang pinakamaiinam mong anak na lalaki ay akin.”
    reason: Ipinapakita ang lawak ng kahulugan ng הַטּוֹבִים at ang posibleng pagkakaugnay nito sa “mga anak na lalaki,” nang hindi lubusang nilulutas ang sintaktikong diin ng Hebreo.
lexical_decisions:
- source_word: וַיֹּאמֶר לוֹ
  choice: At sinabi niya sa kanya
  rationale: Pinananatili ang karaniwang anyo ng salaysay na may pandiwang ‘sinabi’ at di-tuwirang layon na ‘sa kanya.’
- source_word: כֹּה אָמַר
  choice: Ganito ang sabi
  rationale: Likas at marangal na pormula sa Filipino para sa pormal na pagpapahayag ng mensahero.
- source_word: בֶּן הֲדַד
  choice: Ben-hadad
  rationale: Transliterasyon ng pangalang pantangi, na may gitling upang ipakita ang dalawang sangkap ng pangalan.
- source_word: כַּסְפְּךָ וּזְהָבְךָ
  choice: iyong pilak at ginto
  rationale: Pinananatili ang tiyak na mahahalagang bagay na binanggit sa Hebreo sa halip na gawing pangkalahatang ‘salapi.’
- source_word: לִי הוּא
  choice: Akin
  rationale: Maikli at likas na pahayag ng pag-aangkin sa Filipino na sumasaklaw sa pilak at ginto.
- source_word: וְנָשֶׁיךָ
  choice: iyong mga asawa
  rationale: Sa kontekstong pampamilya, ang נָשִׁים ay tumutukoy sa mga asawa, hindi sa mga babae sa pangkalahatan.
- source_word: וּבָנֶיךָ
  choice: mga anak na lalaki
  rationale: Tiyak na isinasalin ang panlalaking kahulugan ng בָּנִים sa halip na gamitin ang mas malawak na ‘mga anak.’
- source_word: הַטּוֹבִים
  choice: ang pinakamainam
  rationale: Ipinahihiwatig ng konteksto ng sapilitang pagkuha ang mga pinakamabuti o pinakapili, hindi lamang ang moral na ‘mabubuti.’ Ang pagkakalagay bilang kasunod na paglalarawan ay malapit sa ayos ng Hebreo at hindi tahasang nagpapasya na ilan lamang sa mga anak ang tinutukoy.
- source_word: לִי הֵם
  choice: ay akin
  rationale: Inuulit ang tuwirang pag-aangkin upang mapanatili ang diin at paralelismo ng Hebreo.
