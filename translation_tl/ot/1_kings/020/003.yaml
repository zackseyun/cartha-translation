translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang payak na ‘Ganito ang sabi’ bilang pormal na pormula ng mensahero, at pinanatili ang inuulit na ‘akin’ at ang ayos-apposisyon ng hulíng parirala upang maihatid ang diin ng Hebreo.
