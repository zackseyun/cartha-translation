base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/020.yaml
  text: And each man struck down his man[a], and Aram fled, and Israel pursued them[b]. But Ben-hadad king of Aram escaped on a horse with horsemen.
translation:
  language: tl
  text: At pinabagsak ng bawat isa ang lalaking kaharap niya[a]. Tumakas ang mga Arameo, at hinabol sila ng Israel. Ngunit nakatakas si Ben-hadad na hari ng Aram sakay ng kabayo, kasama ang mga mangangabayo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “bawat lalaki ay pinabagsak ang kanyang lalaki,” ibig sabihin, bawat isa ay pinabagsak ang lalaking kaharap niya.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “nakatakas sakay ng kabayo at kasama ng mga mangangabayo.” Maaaring inilalarawan ng Hebreo si Ben-hadad na tumatakas nang nakasakay at may kasamang mga mangangabayo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכּוּ
  choice: pinabagsak
  rationale: Sa konteksto ng labanan, ipinahihiwatig ng נכה ang malakas na pananakit at pagkatalo. Ang “pinabagsak” ay hindi tiyak na nagsasabing napatay sila.
- source_word: אִישׁ אִישׁוֹ
  choice: bawat isa ang lalaking kaharap niya
  rationale: Ang literal na “bawat lalaki ang kanyang lalaki” ay hindi likas sa Tagalog; malinaw na ipinahahayag ng salin ang idyomatikong diwang bawat mandirigma ay tumama sa katapat niyang kalaban.
- source_word: אֲרָם
  choice: ang mga Arameo / Aram
  rationale: Sa unang gamit, ang pangmaramihang pandiwa at konteksto ay tumutukoy sa hukbo o mga tao ng Aram, kaya “mga Arameo”; sa titulo ng hari, pinanatili ang pangalang “Aram.”
- source_word: וַיָּנֻסוּ
  choice: tumakas
  rationale: Karaniwan at natural na pandiwa para sa pagtakas mula sa labanan.
- source_word: וַיִּרְדְּפֵם
  choice: hinabol sila
  rationale: Direkta at natural na katumbas ng militar na paghabol na tinutukoy ng רדף.
- source_word: וַיִּמָּלֵט
  choice: nakatakas
  rationale: Angkop sa pagkaligtas ni Ben-hadad mula sa panganib nang hindi nagdaragdag ng tahasang teolohikal na ahensiya.
- source_word: בֶּן הֲדַד
  choice: Ben-hadad
  rationale: Transliterasyon ng personal na pangalan.
- source_word: עַל סוּס
  choice: sakay ng kabayo
  rationale: Likas na Tagalog na tuwirang kumakatawan sa isahang סוּס, “kabayo.”
- source_word: וּפָרָשִׁים
  choice: kasama ang mga mangangabayo
  rationale: Tumutukoy ang פָרָשִׁים sa mga nakasakay na mandirigma; binasa ang waw bilang pagpapahayag ng kasama sa pagtakas.
