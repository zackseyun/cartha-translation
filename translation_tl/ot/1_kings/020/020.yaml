translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “pinabagsak” upang mapanatili ang puwersa ng tagpo nang hindi tiyak na ipinapalagay na napatay ang bawat kalaban. Pinanatili ang bahagyang kalabuan ng huling parirala sa pamamagitan ng talababa.
