  text: Then he said to him, “Because you have not listened to the voice of the LORD, look, when you depart from me, the lion will strike you down.” And when he departed from him, the lion found him and struck him down.
translation:
  language: tl
  text: Sinabi niya sa kanya, “Dahil hindi mo sinunod ang tinig ng PANGINOON, kapag umalis ka sa piling ko, sasaktan ka ng leon.” Pagkaalis niya sa piling nito, natagpuan siya ng leon at sinaktan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֹא שָׁמַעְתָּ בְּקוֹל
  choice: hindi mo sinunod ang tinig
  rationale: Ang idyomang Hebreo ay hindi lamang tumutukoy sa pandinig kundi sa pakikinig na may pagsunod; pinananatili ng “tinig” ang anyo ng pahayag.
- source_word: הִנְּךָ הוֹלֵךְ מֵאִתִּי
  choice: pag-alis mo sa piling ko
  rationale: Likas sa Tagalog at malinaw na tumutukoy sa nalalapit na paglayo mula sa nagsasalita; hindi kailangang isalin nang hiwalay ang הִנֵּה bilang “tingnan mo.”
- source_word: וְהִכְּךָ הָאַרְיֵה
  choice: lalapain ka ng leon
  rationale: Ang נכה ay literal na “hahampasin/sasaktan,” ngunit sa leon at sa konteksto ng nakamamatay na paglusob, ang “lalapain” ang natural at tumpak na salin sa Tagalog nang hindi tahasang idinaragdag ang kamatayan.
- source_word: וַיַּכֵּהוּ
  choice: nilapa
  rationale: Inuulit ang parehong pandiwang ginamit sa hula upang mapanatili ang malinaw na katuparan nito.
theological_decisions:
- issue: Ang dahilan ng hatol
  choice: Dahil hindi mo sinunod ang tinig ng PANGINOON
  alternative: Dahil hindi ka nakinig sa tinig ng PANGINOON
  rationale: Ipinahahayag ng idyomang Hebreo ang hindi pagsunod sa utos ng Diyos, ngunit nananatili ang larawang “tinig” at hindi dinaragdagan ang teksto ng paliwanag.
- issue: Pangalan ng Diyos
  choice: PANGINOON
  alternative: Yahweh
  rationale: Ginagamit ang nakaugaliang anyong malalaking titik upang katawanin ang tetragrammaton יהוה nang hindi nag-aangkat ng denominasyonal na pagtatangi.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Gumamit ng tuwirang salaysay at natural na ayos ng pangungusap habang pinananatili ang sanhi, hula, at eksaktong katuparan nito.
