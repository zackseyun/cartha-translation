base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/014.yaml
  text: 'And Ahab said[a], “By whom?” And he said, “Thus says Yahweh: By the young men of the provincial officials.” Then he said, “Who will begin the battle?” And he said, “You.”'
translation:
  language: tl
  text: 'Sinabi ni Ahab, “Kanino?” Sumagot siya, “Ganito ang sabi ni Yahweh: Sa pamamagitan ng mga kabataang lalaki[a] ng mga pinuno ng mga lalawigan.” Pagkatapos ay nagtanong si Ahab, “Sino ang magsisimula ng labanan?” Sumagot siya, “Ikaw.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga lingkod” o “mga alalay.” Ang salitang Hebreo ay maaaring tumukoy sa mga kabataang lalaki o sa mga tauhang naglilingkod sa mga pinuno ng mga lalawigan.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּמִי
  choice: Sa pamamagitan kanino?
  rationale: Ipinahahayag ng בְּ ang ahensiya o kasangkapang gagamitin; malinaw na itinatanong ni Ahab kung sino ang gagamitin upang maisagawa ang ipinangakong tagumpay.
- source_word: כֹּה אָמַר יְהוָה
  choice: Ganito ang sinabi ni Yahweh
  rationale: Pinananatili nito ang pormal na pormula ng mensaherong propetiko at ang personal na pangalang nasa tekstong Hebreo.
- source_word: בְּנַעֲרֵי
  choice: Sa pamamagitan ng mga kabataang lalaki
  rationale: Ang נַעַר ay maaaring tumukoy sa kabataang lalaki o sa isang lingkod, tagapaglingkod, o alalay. Pinananatili sa pangunahing teksto ang payak na leksikal na diwa, habang inilalagay sa talababa ang posibleng tungkuling opisyal.
- source_word: שָׂרֵי הַמְּדִינוֹת
  choice: ng mga pinuno ng mga lalawigan
  rationale: Ang שָׂרִים ay mga pinuno o opisyal, at ang מְדִינוֹת ay mga lalawigan o distritong administratibo. Likas at sapat na malawak ang saling ito nang hindi nagpapalagay ng tiyak na ranggong militar.
- source_word: מִי יֶאְסֹר הַמִּלְחָמָה
  choice: Sino ang magsisimula ng labanan?
  rationale: Bagaman literal na nangangahulugang ‘magtali’ ang אָסַר, ang idyoma rito ay tumutukoy sa pagpapasimula o pagsabak sa labanan.
- source_word: אָתָּה
  choice: Ikaw
  rationale: Tuwiran at mariing tinutukoy ng panghalip na ikalawang panauhang panlalaki na si Ahab mismo ang magsisimula.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Personal na pangalang YHWH ang tuwirang nasa tekstong Hebreo. Ang ‘Yahweh’ ay transliterasyong nagpapanatili rito bilang pangalan sa halip na palitan ng isang titulo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Sa pamamagitan kanino?” upang mapanatili ang diwa ng ahensiya, at nilinaw ang nagpapalit-palit na tagapagsalita sa ikalawang tanong nang hindi nagdaragdag ng interpretasyong wala sa konteksto.
