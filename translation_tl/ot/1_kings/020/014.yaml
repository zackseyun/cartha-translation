  to: 'Sinabi ni Ahab, “Kanino?” Sumagot siya, “Ganito ang sabi ni Yahweh: Sa pamamagitan ng mga kabataang lalaki[a] ng mga pinuno ng mga lalawigan.” Pagkatapos ay nagtanong si Ahab, “Sino ang magsisimula ng labanan?” Sumagot siya, “Ikaw.”'
