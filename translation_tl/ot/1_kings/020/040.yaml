base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/040.yaml
  text: And as your servant was busy here and there[a], he was gone. Then the king of Israel said to him, “So shall your judgment be[c][b]; you yourself have decided it.”
translation:
  language: tl
  text: Habang abala ang iyong lingkod sa kung saan-saan[a], wala na siya[b]. Sinabi sa kanya ng hari ng Israel, “Iyan ang magiging hatol sa iyo[c]; ikaw mismo ang nagpasiya nito.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “abala sa kung anu-ano.” Ang idyomang Hebreo ay tumutukoy sa pagiging abala sa sari-saring direksiyon o gawain.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “at wala siya,” na nangangahulugang wala na roon ang lalaking binabantayan.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “pasya” o “sentensiya.” Ipinataw ng hari sa nagsasalita ang pamantayan ng paghatol na siya mismo ang nagsabi.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַבְדְּךָ
  choice: inyong lingkod
  rationale: Magalang at mapagpakumbabang pagtukoy ng nagsasalita sa sarili sa harap ng hari; hindi kailangang ipakahulugang alipin sa kontekstong ito.
- source_word: עֹשֵׂה הֵנָּה וָהֵנָּה
  choice: abala ... sa kung saan-saan
  rationale: Likas na Filipino para sa idyomang nagsasaad na abala siya sa sari-saring direksiyon o gawain, habang pinananatili ang pahiwatig ng pagkagambala.
- source_word: וְהוּא אֵינֶנּוּ
  choice: bigla na lamang siyang nawala
  rationale: Ang literal na diwa ay ‘at wala na siya.’ Ipinahahayag nito ang pagkawala ng taong binabantayan nang hindi tahasang dinaragdagan kung paano siya nakaalis.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: hari ng Israel
  rationale: Tuwirang salin ng karaniwang titulong maharlika.
- source_word: כֵּן מִשְׁפָּטְךָ
  choice: Iyan ang magiging hatol sa iyo
  rationale: Ipinapahayag ang pormal na pasiyang legal na ang pamantayang sinabi ng lalaki ang siya ring ilalapat sa kanya.
- source_word: אַתָּה חָרָצְתָּ
  choice: ikaw na rin ang nagpasiya nito
  rationale: Pinananatili ang diin ng tahasang panghalip אַתָּה at ang legal na diwa ng חרץ bilang pagpapasiya o pagtatalaga ng hatol.
