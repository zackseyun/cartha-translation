  to: Habang abala ang iyong lingkod sa kung saan-saan[a], wala na siya[b]. Sinabi sa kanya ng hari ng Israel, “Iyan ang magiging hatol sa iyo[c]; ikaw mismo ang nagpasiya nito.”
  rationale: Inalis ang “bigla na lamang” dahil wala itong katumbas sa Hebreo, at pinalitan ang “inyong lingkod” ng “iyong lingkod” upang maging pare-pareho ang isahang panghalip at mas malapit sa עַבְדְּךָ. Walang pagbabago sa legal at retorikal na diwa ng huling pahayag.
