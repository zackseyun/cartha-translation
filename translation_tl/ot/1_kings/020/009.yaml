base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/009.yaml
  text: So he said to the messengers of Ben-hadad[a], “Say to my lord the king, ‘All that you sent to your servant the first time, I will do; but this thing I cannot do.’” And the messengers went and brought back word to him.
translation:
  language: tl
  text: Kaya sinabi niya sa mga sugo ni Ben-hadad, “Sabihin ninyo sa aking panginoon, ang hari, ‘Gagawin ko ang lahat ng ipinadala mo sa iyong lingkod noong una, ngunit hindi ko magagawa ang bagay na ito[a].’” Umalis ang mga sugo at nagbalik kay Ben-hadad ng sagot.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “usaping ito.” Ang Hebreong דָּבָר ay maaaring mangahulugang “bagay,” “usapin,” o “salita/mensahe,” ayon sa konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאֲכֵי
  choice: mga sugo
  rationale: Sa kontekstong diplomatiko, tumutukoy ito sa mga kinatawan ng hari, hindi sa mga espirituwal na nilalang.
- source_word: בֶן הֲדַד
  choice: Ben-hadad
  rationale: Isinalin sa karaniwang anyong transliterado ang pangalang pantangi.
- source_word: אִמְרוּ
  choice: Sabihin ninyo
  rationale: Tuwirang pautos ito sa maramihang tagapakinig at natural ang anyong ito sa modernong Tagalog.
- source_word: לַאדֹנִי הַמֶּלֶךְ
  choice: sa panginoon kong hari
  rationale: Pinananatili nito ang magalang at pormal na titulong ginagamit sa pakikipag-usap sa hari, nang hindi tumutukoy sa pagka-Diyos.
- source_word: כֹּל אֲשֶׁר שָׁלַחְתָּ
  choice: ang lahat ng ipinasabi mo
  rationale: Literal na may diwang ‘ipinadala mo,’ ngunit sa konteksto ay mensaheng may kahilingan ang ipinadala; malinaw at likas sa Tagalog ang ‘ipinasabi mo’ nang hindi pa tahasang ginagawa itong ‘ipinag-utos’ o ‘hiningi.’
- source_word: עַבְדְּךָ
  choice: iyong lingkod
  rationale: Ito ay nakaugaliang mapagpakumbabang pagtukoy sa sarili sa diplomatikong pananalita; ang ‘alipin’ ay maaaring magpalabis sa katayuang ipinahihiwatig dito.
- source_word: בָרִאשֹׁנָה
  choice: noong una
  rationale: Malinaw nitong itinuturo ang naunang mensahe ni Ben-hadad at likas itong pakinggan sa Tagalog.
- source_word: אֶעֱשֶׂה
  choice: Gagawin ko
  rationale: Tuwiran nitong pinananatili ang payak na pandiwang עשׂה at ang pangakong pagsunod.
- source_word: וְהַדָּבָר הַזֶּה
  choice: ngunit ... ang bagay na ito
  rationale: Pinananatili ang malawak na kahulugan ng דָּבָר at hindi ito tahasang binibigyang-kahulugang ‘kahilingan’ o ‘utos.’
- source_word: לֹא אוּכַל לַעֲשׂוֹת
  choice: hindi ko magagawa
  rationale: Natural na Tagalog para sa ipinahahayag na kawalan ng kakayahang gawin ang hinihingi.
- source_word: וַיְשִׁבֻהוּ דָּבָר
  choice: ibinalik sa kanya ang sagot
  rationale: Likas na salin ng Hebreong idyoma ng pagbabalik ng salita o ulat; sa konteksto, ang dinala pabalik ay ang sagot ng hari.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Pinanatili ang pormal na diplomatikong himig sa ‘panginoon kong hari’ at ‘iyong lingkod,’ habang ginawang likas sa Tagalog ang paglalahad ng ipinadalang mensahe at ibinalik na sagot.
