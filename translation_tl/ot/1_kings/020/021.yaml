  naturalness: Mas natural at tuwiran sa modernong Filipino ang “hinampas ang mga kabayo at mga karwahe” at “nagbigay ng malaking dagok sa Aram.” Pinananatili nito ang maigsi at mabilis na daloy ng salaysay.
