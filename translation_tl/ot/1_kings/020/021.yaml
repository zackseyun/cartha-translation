  text: Then the king of Israel went out and struck the horses and the chariots[a], and inflicted a great blow on Aram.
translation:
  language: tl
  text: Pagkatapos, lumabas ang hari ng Israel at hinampas ang mga kabayo at mga karwahe, at nagbigay siya ng malaking dagok sa Aram.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa mga Arameo.” Ang “Aram” sa Hebreo ay maaaring tumukoy sa kaharian o sa mga hukbo nito. “Aram” ang mismong pangalang Hebreo, bagaman “Siria” ang ginagamit sa ilang tradisyonal na salin.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: lumabas
  rationale: Karaniwang kahulugan ng יצא sa daloy ng salaysay; hindi idinagdag ang mas tiyak na diwang militar ng “humayo upang makipaglaban.”
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: ang hari ng Israel
  rationale: Tuwirang salin ng pariralang tumutukoy sa simuno.
- source_word: וַיַּךְ
  choice: sinalakay
  rationale: Malawak ang saklaw ng נכה, mula sa paghampas hanggang sa pagdaig. Ang “sinalakay” ay natural sa kontekstong militar at hindi agad nagpapahiwatig na lubusang nalipol ang mga ito.
- source_word: הַסּוּס
  choice: ang mga kabayo
  rationale: Bagaman anyong isahan sa Hebreo, kolektibo ang gamit nito rito para sa mga kabayo ng hukbo.
- source_word: הָרָכֶב
  choice: ang mga karwahe
  rationale: Ang רכב ay kolektibong tumutukoy sa mga karwaheng pandigma o puwersang gumagamit ng mga ito; natural sa Filipino ang maramihang “mga karwahe.”
- source_word: וְהִכָּה
  choice: nagpasapit
  rationale: Ikalawang gamit ito ng נכה at may kasamang kaugnay na pangngalang מַכָּה. Ang “nagpasapit” ay bumubuo ng natural na pariralang Filipino nang hindi inuulit ang “sinalakay.”
- source_word: בַאֲרָם
  choice: sa Aram
  rationale: Pinanatili ang pangalang Hebreo na Aram sa halip na gamitin ang tradisyonal ngunit di-eksaktong “Siria”; maaari itong tumukoy sa kaharian o sa hukbo nito.
- source_word: מַכָּה גְדוֹלָה
  choice: matinding dagok
  rationale: Pinananatili nito ang konkretong talinghaga ng “malaking hampas/dagok” at hindi labis na tinutukoy kung ito ay pagkatay, pinsala, o pagkatalo.
