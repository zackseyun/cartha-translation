  yaml_path: translation/ot/1_kings/020/018.yaml
  text: And he said[a], “If they have come out for peace, seize them alive; and if they have come out for battle, seize them alive.”
translation:
  language: tl
  text: At sinabi niya, “Kung lumabas sila para sa kapayapaan[a], hulihin ninyo sila nang buhay; at kung lumabas sila para makipagdigma, hulihin ninyo sila nang buhay.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Kung mapayapa silang lumabas … kung lumabas sila upang makidigma.”
    reason: Ipinakikita ang alternatibong pagsasalin ng mga pariralang Hebreong לְשָׁלוֹם at לְמִלְחָמָה bilang paraan o layunin, nang hindi inaalis ang pangunahing mas literal na pagbasa.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: At sinabi niya
  rationale: Karaniwang panandang pasalaysay na nagpapakilala sa tuwirang sinabi; pinananatili ng “At sinabi niya” ang payak na daloy ng Hebreo.
- source_word: אִם
  choice: Kung
  rationale: Likas at tuwirang panumbas sa kondisyunal na kataga na nagpapakilala sa bawat posibilidad.
- source_word: לְשָׁלוֹם
  choice: para sa kapayapaan
  rationale: Ipinahahayag ang mapayapang layunin at pinananatili ang anyong pangngalan at ang paralelismo sa “para makipagdigma.”
- source_word: יָצָאוּ
  choice: lumabas sila
  rationale: Ang pandiwa ay tumutukoy sa paglabas ng mga tao patungo sa kinaroroonan ng nagsasalita; natural sa Filipino ang simpleng aspektong naganap sa kondisyunal na sugnay.
- source_word: תִּפְשׂוּם
  choice: hulihin ninyo sila
  rationale: Ang תפשׂ sa kontekstong militar ay nangangahulugang hulihin o bihagin; malinaw at likas sa karaniwang Filipino ang “hulihin.”
- source_word: חַיִּים
  choice: nang buhay
  rationale: Naglalarawan sa kalagayan nila kapag hinuli at tuwirang tumutumbas sa adberbiyal na gamit ng Hebreo.
- source_word: וְאִם
  choice: at kung
  rationale: Pinananatili ang payak na pag-uugnay ng dalawang kondisyon nang hindi nagdaragdag ng kontrast na wala sa teksto.
- source_word: לְמִלְחָמָה
  choice: para makipagdigma
  rationale: Ipinahahayag nang natural sa Filipino ang layuning pandigma ng kanilang paglabas.
- source_word: חַיִּים תִּפְשׂוּם
  choice: hulihin pa rin ninyo sila nang buhay
  rationale: Pinananatili ang inuulit na utos; ang “pa rin” ay nililinaw ang kapansin-pansing katotohanang iisa ang utos sa dalawang magkaibang kalagayan, nang hindi binabago ang kahulugan.
