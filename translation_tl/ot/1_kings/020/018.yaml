translation_notes:
  register: Modernong Filipino na malinaw, marangal, at madaling maunawaan. Pinanatili ang dalawang magkatulad na utos at ang kanilang retorikal na diin; hindi nilagyan ng talababa sapagkat sapat na naihahayag ng pangunahing teksto ang mapayapa at pandigmang layunin.
