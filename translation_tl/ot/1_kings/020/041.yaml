  text: Then he quickly removed the bandage from over his eyes[a], and the king of Israel recognized him, that he was one of the prophets.
translation:
  language: tl
  text: Agad niyang inalis ang pantakip mula sa ibabaw ng kaniyang mga mata[a], at nakilala siya ng hari ng Israel na isa siya sa mga propeta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Hebreo na הָאֲפֵר ay tradisyonal na inuunawa ng ilan bilang “abo,” ngunit sa kontekstong ito ay malamang na tumutukoy ito sa isang pantakip sa mga mata na ginamit bilang pagkukunwari.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמַהֵר
  choice: Pagdaka'y
  rationale: Ipinahahayag ng מהר ang pagmamadali o agarang pagkilos; natural sa marangal na salaysay ang “Pagdaka'y.”
- source_word: וַיָּסַר
  choice: inalis niya
  rationale: Tuwirang ipinapahayag ng anyong hiphil ang pag-aalis ng bagay.
- source_word: הָאֲפֵר
  choice: ang benda
  rationale: Bagaman karaniwang nangangahulugang “abo” ang אֵפֶר, ipinakikita ng konteksto ng 1 Hari 20:38, 41 na ito ay isang pantakip sa mga mata na ginamit bilang pagkukunwari; malinaw na naihahatid ng “benda” ang gamit nito.
- source_word: מֵעַל עֵינָיו
  choice: sa ibabaw ng kaniyang mga mata
  rationale: Pinananatili nito ang puwestong ipinahahayag ng tambalang pang-ukol מן־על, na ang bagay ay nasa ibabaw ng mga mata.
- source_word: וַיַּכֵּר אֹתוֹ
  choice: nakilala siya
  rationale: Ang hiphil ng נכר ay nangangahulugang makilala o matukoy ang isang tao; idiomatiko sa Filipino ang “nakilala siya.”
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: ang hari ng Israel
  rationale: Tuwirang salin ng pariralang konstrakto.
- source_word: כִּי
  choice: bilang
  rationale: Dito ay ipinakikilala ng כִּי ang nilalaman o resulta ng pagkilala. Mas natural sa Filipino ang “nakilala siya ... bilang” kaysa sa literal na “nakilala ... na siya ay.”
- source_word: מֵהַנְּבִאִים
  choice: isa sa mga propeta
  rationale: Partitibo ang מן at nagsasaad na kabilang siya sa pangkat ng mga propeta.
- source_word: הוּא
  choice: siya
  rationale: Tahasan ang paksa sa Hebreo; isinama ang diwa nito sa natural na pariralang Filipino na “nakilala siya ... bilang.”
