source:
  edition: WLC
  text: וְ/הִנֵּ֣ה נָבִ֣יא אֶחָ֗ד נִגַּשׁ֮ אֶל אַחְאָ֣ב מֶֽלֶךְ יִשְׂרָאֵל֒ וַ/יֹּ֗אמֶר כֹּ֚ה אָמַ֣ר יְהוָ֔ה הְֽ/רָאִ֔יתָ אֵ֛ת כָּל הֶ/הָמ֥וֹן הַ/גָּד֖וֹל הַ/זֶּ֑ה הִנְ/נִ֨י נֹתְנ֤/וֹ בְ/יָֽדְ/ךָ֙ הַ/יּ֔וֹם וְ/יָדַעְתָּ֖ כִּֽי אֲנִ֥י יְהוָֽה׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/013.yaml
  text: 'And behold[a], a certain prophet came near to Ahab king of Israel and said, “Thus says Yahweh: Have you seen all this great multitude? Behold, I am giving it into your hand today, and you shall know that I am Yahweh.”'
translation:
  language: tl
  text: 'At narito, isang propeta ang lumapit kay Ahab na hari ng Israel at nagsabi, “Ganito ang sabi ni Yahweh: ‘Nakita mo ba ang buong malaking hukbong ito?[a] Narito, ibinibigay ko ito sa kamay mo sa araw na ito, at malalaman mong ako si Yahweh.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “buong malaking pulutong na ito” o “buong malaking karamihang ito.” Ang salitang Hebreo ay maaaring tumukoy sa malaking pulutong o hukbo; dito, tumutukoy ito sa mga puwersa ng kaaway.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: At narito
  rationale: Pinananatili ang biglang pagtawag-pansin at pagiging masigla ng salaysay, habang nananatiling malinaw sa modernong Tagalog.
- source_word: נָבִיא אֶחָד
  choice: isang propeta
  rationale: Ipinakikilala nito ang isang propetang hindi pinangalanan. Ang literal na ‘isang propeta’ ay natural din sa Tagalog at hindi nagdaragdag ng pagkakakilanlan.
- source_word: נִגַּשׁ אֶל
  choice: lumapit kay
  rationale: Tuwirang ipinapahayag ang paglapit ng propeta kay Ahab at natural ang parirala sa Tagalog.
- source_word: כֹּה אָמַר יְהוָה
  choice: Ganito ang sinabi ni Yahweh
  rationale: Pinananatili ang pormal na pormula ng mensahero ng propeta nang hindi nagiging lipas o mabigat ang wika.
- source_word: הֲרָאִיתָ
  choice: Nakita mo ba
  rationale: Sinasalamin ang anyong patanong at ang pagtukoy sa puwersang militar na nakikita na ni Ahab.
- source_word: כָּל הֶהָמוֹן הַגָּדוֹל הַזֶּה
  choice: ang buong napakalaking hukbong ito
  rationale: Sa konteksto, ang malaking pulutong ay ang puwersa ng kaaway. Ginagawang malinaw ng ‘hukbo’ ang konteksto, habang itinatala sa talababa ang mas malawak na saklaw ng salitang Hebreo.
- source_word: הִנְנִי
  choice: Narito, ibinibigay ko
  rationale: Pinananatili ang diin at ang agarang katiyakan ng ipinangakong pagkilos ni Yahweh.
- source_word: נֹתְנוֹ בְיָדְךָ
  choice: ibinibigay ko ito sa kamay mo
  rationale: Pinananatili ang larawang Hebreo ng paglalagay sa kamay ng isang tao, na nauunawaan sa Tagalog bilang pagpapasailalim sa kanyang kapangyarihan.
- source_word: הַיּוֹם
  choice: ngayon
  rationale: Natural na katumbas ng temporal na pahayag na tumutukoy sa araw na iyon.
- source_word: וְיָדַעְתָּ כִּי אֲנִי יְהוָה
  choice: at malalaman mong ako si Yahweh
  rationale: Pinananatili ang resultang pagkilala kay Yahweh sa pamamagitan ng kanyang pagliligtas, nang hindi pinalalawak ang kahulugan lampas sa sinabi ng teksto.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang ginagamit ng tekstong Hebreo ang Tetragrammaton. Pinananatili ng ‘Yahweh’ ang personal at tipanang pangalan sa halip na palitan ito ng titulo.
- issue: Saklaw ng pormulang וְיָדַעְתָּ כִּי אֲנִי יְהוָה
  choice: malalaman ni Ahab na ang kumikilos ay si Yahweh
  alternative: mararanasan at kikilalanin ni Ahab ang ganap na paghahari ni Yahweh
  rationale: Maaaring may mas malalim na diwang karanasan at pagkilala ang pandiwang ‘malaman,’ ngunit hindi tahasang nililinaw rito ang antas o uri ng pagkilalang iyon. Kaya pinananatili ang payak at bukas na pahayag.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang ‘At narito’ at ‘Narito’ upang maipakita ang dalawang pantawag-pansing pahayag sa Hebreo. Ginamit ang ‘hukbo’ dahil malinaw na militar ang konteksto, ngunit inilagay sa talababa ang mas malawak na kahulugan ng הָמוֹן.
