  to: 'At narito, isang propeta ang lumapit kay Ahab na hari ng Israel at nagsabi, “Ganito ang sabi ni Yahweh: ‘Nakita mo ba ang buong malaking hukbong ito?[a] Narito, ibinibigay ko ito sa kamay mo sa araw na ito, at malalaman mong ako si Yahweh.’”'
