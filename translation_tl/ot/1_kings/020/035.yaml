  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/אִ֨ישׁ אֶחָ֜ד מִ/בְּנֵ֣י הַ/נְּבִיאִ֗ים אָמַ֧ר אֶל רֵעֵ֛/הוּ בִּ/דְבַ֥ר יְהוָ֖ה הַכֵּ֣י/נִי נָ֑א וַ/יְמָאֵ֥ן הָ/אִ֖ישׁ לְ/הַכֹּתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/035.yaml
  text: A certain man from the sons of the prophets said to his companion by the word of Yahweh[b][a], “Please strike me.” But the man refused to strike him.
translation:
  language: tl
  text: Isang lalaki mula sa mga anak ng mga propeta[a] ang nagsabi sa kaniyang kasama ayon sa salita ni Yahweh[b], “Saktan mo ako, pakiusap.” Ngunit tumanggi ang kaniyang kasama na saktan siya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mula sa samahan ng mga propeta” o “mula sa mga alagad ng mga propeta.” Sa Hebreo, “mula sa mga anak ng mga propeta,” isang karaniwang katawagan para sa isang pangkat ng mga propeta.
    reason: lexical_alternative
  - marker: b
    text: O “sa salita ni Yahweh” o “sa utos ni Yahweh.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ אֶחָד
  choice: Isang lalaki
  rationale: Likas na panimulang pagsasalaysay sa Tagalog; hindi na kailangang dagdagan ng temporal na “Ngayon.”
- source_word: מִבְּנֵי הַנְּבִיאִים
  choice: mula sa mga anak ng mga propeta
  rationale: Pinananatili ang anyong Hebreo upang hindi tiyakang ipakahulugan kung ito ay samahan, pangkat, o mga alagad ng mga propeta.
- source_word: רֵעֵהוּ
  choice: kaniyang kasama
  rationale: Sapat na ipinahihiwatig ang ugnayan nang hindi ipinapalagay ang malapit na pagkakaibigang maaaring ipahiwatig ng “kaibigan.”
- source_word: בִּדְבַר יְהוָה
  choice: ayon sa salita ni Yahweh
  rationale: Ipinapakita ang batayan o awtoridad ng pahayag at pinananatili ang idyomang “salita” sa halip na agad itong gawing “utos.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat ang banal na pangalang YHWH sa halip na palitan ito ng isang titulo.
- source_word: הַכֵּינִי נָא
  choice: Saktan mo ako, pakiusap
  rationale: Ang נכה ay nangangahulugang humampas o manakit; ang “saktan” ay natural sa utos na ito at hindi pa tahasang nagsasabing sugatan. Isinasalin ng “pakiusap” ang נָא.
- source_word: וַיְמָאֵן ... לְהַכֹּתוֹ
  choice: Ngunit tumanggi ... na saktan siya
  rationale: Malinaw na pagtanggi ang ipinahahayag ng pandiwa; inuulit ang parehong salitang “saktan” para sa leksikal na pagkakaugnay.
theological_decisions:
- issue: Pagbibigay-kahulugan sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo; pinananatili ito bilang “Yahweh” sa halip na palitan ng titulo.
- issue: Pagbibigay-kahulugan sa בְּנֵי הַנְּבִיאִים
  choice: mga anak ng mga propeta
  alternative: samahan ng mga propeta o mga alagad ng mga propeta
  rationale: Malamang na tumutukoy ito sa isang pangkat ng mga propeta, ngunit hindi nilulutas ng salin ang eksaktong kaayusang panlipunan na hindi tahasang tinutukoy ng parirala.
- issue: Lakas ng בִּדְבַר bilang awtoridad
  choice: ayon sa salita ni Yahweh
  alternative: sa utos ni Yahweh
  rationale: Pinananatili ang “salita” at ang saklaw nitong maaaring magpahiwatig ng pahayag o utos, sa halip na paliitin agad sa “utos.”
translation_notes:
  register: Modernong Filipino Tagalog na payak ngunit marangal. Pinanatili ang Hebreong ekspresyong “mga anak ng mga propeta” sa pangunahing teksto, samantalang inilagay sa talababa ang mas interpretibong mga katumbas. Inilagay ang bawat marker kaagad pagkatapos ng pariralang tinutukoy nito.
