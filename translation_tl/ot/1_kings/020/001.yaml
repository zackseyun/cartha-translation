base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/001.yaml
  text: Ben-hadad king of Aram gathered all his army[a], and thirty-two kings with him, and horses and chariots[b]; then he went up and besieged Samaria and fought against it.
translation:
  language: tl
  text: Tinipon ni Ben-hadad, na hari ng Aram,[a] ang buong hukbo niya, kasama ang tatlumpu't dalawang hari, mga kabayo, at mga karwahe. Pagkatapos, umahon siya, kinubkob ang Samaria, at nakipagdigma rito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “Aram” ang pangalang ginamit sa Hebreo; tradisyonal itong isinasaling “Siria.”
    reason: alternative_reading
lexical_decisions:
- source_word: וּ/בֶן הֲדַד
  choice: ni Ben-hadad
  rationale: Pinanatili ang transliterasyon ng pangalang Hebreo. Hindi isinalin nang tahasan ang panimulang ו dahil likas sa modernong Tagalog na simulan ang bagong yunit ng salaysay nang walang “at”; naipahihiwatig ng daloy ng konteksto ang pagkakaugnay.
- source_word: מֶלֶךְ אֲרָם
  choice: na hari ng Aram
  rationale: Ginamit ang “Aram,” ang mismong pangalang Hebreo, sa halip na ang tradisyonal na “Siria.” Ang pang-angkop na “na” ay nagbibigay ng natural na apposisyon sa Tagalog.
- source_word: קָבַץ אֶת כָּל חֵילוֹ
  choice: Tinipon ... ang buo niyang hukbo
  rationale: Ang קבץ ay “tipunin,” at ang חַיִל sa kontekstong militar ay kolektibong tumutukoy sa hukbo. Natural at malinaw sa Tagalog ang “buo niyang hukbo.”
- source_word: וּשְׁלֹשִׁים וּשְׁנַיִם מֶלֶךְ אִתּוֹ
  choice: kasama ang tatlumpu't dalawang hari
  rationale: Ipinahahayag ng אִתּוֹ ang pagsama sa kaniya. Iniiwasan ng “kasama” ang alanganing pag-uulit ngunit pinananatili ang ugnayan ng mga kaalyadong hari kay Ben-hadad.
- source_word: וְסוּס וָרָכֶב
  choice: mga kabayo, at mga karwahe
  rationale: Bagaman kolektibong isahan ang Hebreo, karaniwang maramihan ang natural na anyo sa Tagalog. Pinanatili ang kongkretong “mga kabayo” sa halip na ipakahulugang “kabalyerya.”
- source_word: וַיַּעַל
  choice: Pagkatapos, umahon siya
  rationale: Ang עלה ay literal na “umahon/pumaitaas” at sa konteksto ay militar na pagsulong. Ang “Pagkatapos” ay naghahatid ng sunud-sunod na kilos na ipinahihiwatig ng narrative waw.
- source_word: וַיָּצַר עַל שֹׁמְרוֹן
  choice: kinubkob ang Samaria
  rationale: Ang צור על ay terminong militar para sa pagkubkob sa isang lungsod.
- source_word: וַיִּלָּחֶם בָּהּ
  choice: nakipagdigma rito
  rationale: Ang לחם na may ב ay pakikipaglaban laban sa tinutukoy na lugar. Ang “rito” ay malinaw na tumutukoy sa Samaria at hindi nagpapalabis tungo sa mas tiyak na “nilusob.”
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “hukbo,” “karwahe,” “umahon,” at “kinubkob” bilang malinaw na bokabularyong militar. Inilipat ang tala sa “Aram” sa hulihan ng unang pangungusap at minarkahan sa pangunahing teksto.
