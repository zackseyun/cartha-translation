base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/015.yaml
  text: He cast the two bronze pillars; the height of the one pillar was eighteen cubits[a], and a line of twelve cubits measured around it.
translation:
  language: tl
  text: Ibinubo niya ang dalawang haliging tanso. Labingwalong siko[a] ang taas ng unang haligi, at isang pising labindalawang siko ang haba ang nakapalibot sa ikalawang haligi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang isang siko ay humigit-kumulang 45 sentimetro.
    reason: measurement_clarification
lexical_decisions:
- source_word: וַיָּצַר
  choice: Ibinubo
  rationale: Sa konteksto ng paggawa ng kagamitang tanso, tumutukoy ito sa paghubog ng metal sa pamamagitan ng pagbububo; mas tiyak ito kaysa sa pangkalahatang “hinubog.”
- source_word: שְׁנֵי הָעַמּוּדִים
  choice: dalawang haligi
  rationale: Ang “haligi” ang natural at karaniwang tawag sa malalaking patayong elementong arkitektural sa Tagalog.
- source_word: נְחֹשֶׁת
  choice: tanso
  rationale: Ang “tanso” ang nakasanayang salin sa kontekstong biblikal para sa metal na malamang ay bronze; iniiwasan nito ang anachronistic na “brass.”
- source_word: שְׁמֹנֶה עֶשְׂרֵה אַמָּה
  choice: labingwalong siko
  rationale: Pinananatili ang sinaunang yunit sa halip na magbigay ng tiyak na modernong conversion.
- source_word: קוֹמַת הָעַמּוּד הָאֶחָד
  choice: ang taas ng unang haligi
  rationale: Natural na Tagalog ito para sa literal na “taas ng isang/ang isang haligi” at malinaw na itinatambal sa “ikalawang haligi” sa hulihan.
- source_word: וְחוּט
  choice: at ... ang pisi
  rationale: Ang “pisi” ay tuwirang tumutukoy sa cord o line na ginamit upang palibutan at sukatin ang haligi.
- source_word: שְׁתֵּים עֶשְׂרֵה אַמָּה
  choice: labindalawang siko
  rationale: Tuwirang pinananatili ang bilang at sinaunang yunit.
- source_word: יָסֹב
  choice: nakapalibot
  rationale: Pinananatili nito ang konkretong larawan ng pising pumapalibot sa haligi nang hindi labis na ipinapaliwanag ang gamit nito sa pagsukat.
- source_word: הָעַמּוּד הַשֵּׁנִי
  choice: sa ikalawang haligi
  rationale: Tuwirang isinasalin ang Masoretic Text, na tahasang nagsasabing “ikalawang haligi,” sa halip na palitan ito ng panghalip.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang teknikal ngunit madaling maunawaang “ibinubo” para sa metal casting, at pinanatili ang “siko” bilang sinaunang yunit. Ang bahagyang di-pangkaraniwang pagtukoy muna sa unang haligi at saka sa ikalawa ay pinanatili dahil iyon ang malinaw na pagbasa ng tekstong Hebreo.
