base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/035.yaml
  text: And on the top of the stand there was a round rim all around[a], half a cubit high[b]; and on the top of the stand its supports and its panels were of one piece with it.
translation:
  language: tl
  text: Sa tuktok ng patungan ay may bilog na gilid na nakapalibot dito, kalahating siko ang taas; at sa tuktok ng patungan, ang mga pansuporta nito[a] at mga panel nito[b] ay bahagi mismo nito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga hawakan nito.” Literal na “mga kamay nito” ang Hebreo at maaaring tumukoy sa mga nakausling bahagi ng patungan.
    reason: lexical_alternative
  - marker: b
    text: O “mga balangkas nito.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְרֹאשׁ הַמְּכוֹנָה
  choice: Sa ibabaw ng patungan
  rationale: Ang רֹאשׁ ay “ulo” o “itaas,” at sa kontekstong pangkayarian ay natural na “ibabaw.” Ang מְכוֹנָה ay tumutukoy sa tansong patungang may mga gulong.
- source_word: חֲצִי הָאַמָּה קוֹמָה
  choice: kalahating siko ang taas
  rationale: Tuwirang inilalahad ang sukat ng taas sa natural na modernong Tagalog.
- source_word: עָגֹל סָבִיב
  choice: may pabilog na bahagi sa palibot
  rationale: Ipinahihiwatig ng Hebreo ang isang pabilog na katangian ngunit walang tahasang pangngalan para rito; ang “bahagi” ay hindi labis na nagtatakda kung ito ay gilid, argolya, o sinturon.
- source_word: יְדֹתֶיהָ
  choice: mga pansuporta nito
  rationale: Literal itong “mga kamay nito,” ngunit sa paglalarawan ng isang kayarian ay maaaring tumukoy sa nakausling mga pansuporta o hawakan. Pinili ang “pansuporta” dahil angkop ito sa konteksto, habang inilagay sa talababa ang tunay na alternatibo.
- source_word: וּמִסְגְּרֹתֶיהָ
  choice: mga panel nito
  rationale: Maaaring tumukoy ang salita sa mga nakabalangkas na seksiyon o sa mismong mga kuwadro. Malinaw sa karaniwang mambabasa ang “panel,” at pinanatili sa talababa ang “kuwadro.”
- source_word: מִמֶּנָּה
  choice: ay bahagi mismo nito
  rationale: Ipinapahayag na ang mga elementong ito ay nagmumula sa patungan at integral dito, sa halip na hiwalay na ikinabit.
