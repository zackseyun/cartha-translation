translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “siko” bilang tradisyonal at madaling makilalang yunit sa Bibliya. Inilipat ang mga talababa sa mga salitang talagang tinutukoy ng mga alternatibong pagbasa, sa halip na sundin ang hindi tugmang puwesto ng mga marker sa English consultation layer.
