base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/026.yaml
  text: Its thickness was a handbreadth[a], and its rim was made like the rim of a cup, like a lily blossom[b]. It could hold two thousand baths.
translation:
  language: tl
  text: Ang kapal nito ay isang lapad ng kamay[a], at ang labi nito ay hinubog na gaya ng labi ng isang tasa, tulad ng bulaklak ng liryo. Kaya nitong maglaman ng dalawang libong bat[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Hebreong tefaḥ ay sukat na kasinlapad ng kamay, humigit-kumulang 7–9 sentimetro.
    reason: measurement_clarification
  - marker: b
    text: Sa 2 Cronica 4:5, sinasabing tatlong libong bat ang kayang ilaman ng malaking palanggana. Maaaring bunga ito ng pagkakaiba sa teksto o pagkakasalin nito, o ng pagkakaiba sa sukdulang kapasidad at karaniwang laman; hindi tiyak ang paliwanag.
    reason: cross_reference
lexical_decisions:
- source_word: עָבְיוֹ
  choice: ang kapal nito
  rationale: Tumutukoy ang pangngalan sa kapal ng materyal ng malaking palanggana; malinaw at natural sa modernong Filipino ang “ang kapal nito.”
- source_word: טֶפַח
  choice: isang dangkal
  rationale: Ang tefaḥ ay sukat na handbreadth. “Dangkal” ang pinakamalapit na karaniwang katawagang Filipino, bagaman maaaring mag-iba ang eksaktong gamit nito sa kasalukuyan; nililinaw ito sa talababa.
- source_word: שְׂפָתוֹ
  choice: ang gilid nito
  rationale: Sa sisidlan, ang שׂפה ay ang itaas na gilid o labi. Mas natural at madaling maunawaan dito ang “gilid” kaysa “labi.”
- source_word: כְּמַעֲשֵׂה
  choice: ay hinubog na gaya ng
  rationale: Ipinahihiwatig ng parirala ang pagkakayari o anyo; inihahatid ng “hinubog na gaya ng” ang paghahambing nang natural.
- source_word: שְׂפַת כּוֹס
  choice: gilid ng isang kopa
  rationale: Pinananatili ang pag-uulit ng larawang “gilid” at ang paghahambing sa bunganga ng isang inumang sisidlan.
- source_word: פֶּרַח שׁוֹשָׁן
  choice: bulaklak ng liryo
  rationale: Tuwirang inilalarawan ang anyong tila namukadkad na liryo nang hindi dinaragdagan ang detalye ng Hebreo.
- source_word: אַלְפַּיִם בַּת
  choice: dalawang libong bat
  rationale: Ang bat ay sinaunang yunit ng panukat sa likido. Pinanatili ang transliterasyon sa halip na magbigay ng di-tiyak na makabagong conversion.
- source_word: יָכִיל
  choice: ang kayang ilaman nito
  rationale: Ang anyong pandiwa ay nagpapahayag ng kapasidad ng sisidlan, hindi kinakailangang ng aktuwal na laman nito sa isang pagkakataon.
theological_decisions:
- issue: Pagkakaiba ng kapasidad sa 2 Cronica 4:5
  choice: Pinanatili sa pangunahing teksto ang “dalawang libong bat” ayon sa WLC ng 1 Hari 7:26.
  alternative: Iayon sa “tatlong libong bat” ng 2 Cronica 4:5 o ipaliwanag ang isa bilang karaniwang laman at ang isa bilang sukdulang kapasidad.
  rationale: Hindi dapat tahimik na pagtugmain ang magkaibang bilang o tiyaking kapasidad laban sa karaniwang laman ang paliwanag. Ang pagkakaiba ay tapat na binabanggit sa talababa.
translation_notes:
  register: 'Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “kopa” para sa כּוֹס at “bat” bilang transliterasyon ng sinaunang yunit. Ang mga talababa ay inilagay sa mismong bahaging nililinaw: [a] sa sukat na dangkal at [b] sa pangungusap tungkol sa kapasidad, sa halip na sa larawang liryo.'
