  text: 'And this was the construction of the stand: they had frames[b][a], and there were frames between the supports.'
translation:
  language: tl
  text: 'At ganito ang pagkakayari ng patungan: mayroon itong mga balangkas[a], at may mga balangkas sa pagitan ng mga tukod[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga panel.” Ang salitang Hebreo ay maaaring tumukoy sa mga seksiyong may balangkas o sa mismong mga bahaging bumabalangkas sa patungan.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin ang salitang Hebreo bilang “mga pahalang na biga,” “mga patayong haligi,” o “mga rehas.” Hindi tiyak ang eksaktong bahaging tinutukoy.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזֶה
  choice: At ganito
  rationale: Ipinagpapatuloy nito ang daloy ng salaysay at ipinakikilala ang paglalarawan sa anyo ng patungan.
- source_word: מַעֲשֵׂה
  choice: pagkakayari
  rationale: Sa kontekstong pang-arkitektura, tumutukoy ito sa paraan o anyo ng pagkakagawa, hindi lamang sa pangkalahatang gawain.
- source_word: הַמְּכוֹנָה
  choice: patungan
  rationale: Tumutukoy ito sa ginawang patungang may mga gulong para sa hugasan; natural at malinaw ang “patungan” sa modernong Filipino.
- source_word: מִסְגְּרֹת
  choice: mga balangkas
  rationale: Pinananatili nito ang diwa ng mga bahaging nakabalangkas o framing elements; inilalagay sa talababa ang posibleng “mga panel.”
- source_word: לָהֶם
  choice: mayroon itong
  rationale: Ipinahahayag nang likas sa Filipino ang pag-aaring ipinakikita ng Hebreong pang-ukol na may hulaping panghalip.
- source_word: וּמִסְגְּרֹת
  choice: at may mga balangkas
  rationale: Inuulit ang pangngalan gaya sa Hebreo at ginagawang maayos ang pangungusap sa Filipino.
- source_word: בֵּין
  choice: sa pagitan ng
  rationale: Tuwirang ipinahahayag ang lokasyon sa gitna ng mga bahaging estruktural.
- source_word: הַשְׁלַבִּים
  choice: mga tukod
  rationale: Isang maingat at madaling maunawaang katawagan para sa di-tiyak na mga bahaging nagdurugtong o sumusuporta sa estruktura.
