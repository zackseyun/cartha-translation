  text: עֹמֵ֞ד עַל שְׁנֵ֧י עָשָׂ֣ר בָּקָ֗ר שְׁלֹשָׁ֣ה פֹנִ֣ים צָפ֡וֹנָ/ה וּ/שְׁלֹשָׁה֩ פֹנִ֨ים יָ֜מָּ/ה וּ/שְׁלֹשָׁ֣ה פֹּנִ֣ים נֶ֗גְבָּ/ה וּ/שְׁלֹשָׁה֙ פֹּנִ֣ים מִזְרָ֔חָ/ה וְ/הַ/יָּ֥ם עֲלֵי/הֶ֖ם מִ/לְ/מָ֑עְלָ/ה וְ/כָל אֲחֹֽרֵי/הֶ֖ם בָּֽיְתָ/ה־׀׀׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/025.yaml
  text: 'It stood on twelve oxen: three facing north[a], three facing west, three facing south, and three facing east; and the Sea was on them above[b], and all their rear parts were inward.'
translation:
  language: tl
  text: 'Nakatayo ang Dagat sa ibabaw ng labindalawang baka: tatlo ang nakaharap sa hilaga, tatlo sa kanluran[a], tatlo sa timog, at tatlo sa silangan. Nasa ibabaw ng mga ito ang Dagat, at ang lahat ng likurang bahagi ng mga baka ay nakaharap paloob.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, ang “kanluran” ay literal na “patungo sa dagat,” isang karaniwang paraan sa Bibliya ng pagtukoy sa kanluran.
    reason: lexical_alternative
  - marker: b
    text: O “ang lahat ng hulihan ng mga ito ay nasa dakong loob.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹמֵד
  choice: Nakatayo
  rationale: Ang Qal participle ay naglalarawan sa posisyon ng Dagat. Ang “nakatayo” ay natural sa Filipino at nananatiling malapit sa Hebreo.
- source_word: בָּקָר
  choice: mga baka
  rationale: Ang salita ay tumutukoy sa mga anyong-bakang sumusuporta sa malaking sisidlan. Hindi tiyak sa anyong leksikal lamang kung dapat itong tukuying mga toro, kaya pinanatili ang mas malawak na “mga baka.”
- source_word: פֹנִים
  choice: nakaharap
  rationale: Bagaman literal na kaugnay ng “mukha,” inilalarawan dito ng salita ang direksiyon ng pagkakaharap ng mga anyo.
- source_word: יָמָּה
  choice: kanluran
  rationale: Literal itong “patungo sa dagat,” ngunit karaniwang pantukoy ito sa kanluran sa biblikal na Hebreo at bahagi rito ng talaan ng apat na pangunahing direksiyon.
- source_word: הַיָּם
  choice: ang Dagat
  rationale: Ito ang natatanging tawag sa malaking hinulmang sisidlan sa templo. Ginamit ang malaking titik upang ipakitang pangalan ito ng kagamitang iyon.
- source_word: עֲלֵיהֶם מִלְמָעְלָה
  choice: Nasa ibabaw ng mga ito
  rationale: Tuwirang ipinahahayag ng parirala na ang Dagat ay nasa ibabaw ng labindalawang anyong-baka, nang hindi idinaragdag ang pandiwang “inilagay” na wala sa Hebreo.
- source_word: אֲחֹרֵיהֶם
  choice: likurang bahagi ng mga baka
  rationale: Tumutukoy ito sa kanilang mga bahaging nasa likuran. Ang “likurang bahagi” ay malinaw at marangal, at hindi labis na tiyak sa anatomiya.
- source_word: בָּיְתָה
  choice: nakaharap paloob
  rationale: Ang directional form ay nagsasaad na ang mga likuran ng mga baka ay patungo sa loob o gitna sa ilalim ng Dagat.
theological_decisions: []
translation_notes:
  register: Makabago ngunit marangal na Filipino. Pinanatili ang “Dagat” bilang natatanging pangalan ng malaking sisidlan sa templo. Iniwasan ang “mga toro” dahil hindi tahasang nililimitahan ng בָּקָר ang kasarian, at ginawang malinaw ang tinutukoy ng mga panghalip kung saan kailangan sa Filipino.
