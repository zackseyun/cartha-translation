  register: Makabago, marangal, at madaling maunawaang Tagalog. Ginamit ang “koronang bahagi” sa halip na ang mas teknikal na “kapitel,” at pinanatili ang kawalang-tiyak ng mga terminong pang-arkitektura at ng sukat.
