base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/031.yaml
  text: Its opening projected upward from within the capital by a cubit[a], and its opening was round, like the work of a pedestal, a cubit and a half; and also on its opening were carvings, and their panels were square[c][b], not round.
translation:
  language: tl
  text: Ang bukana[a] nito ay nakausli nang isang siko paitaas mula sa loob ng koronang bahagi. Bilog ang bukana nito, tulad ng pagkakayari ng isang patungan[b], at may sukat na isa’t kalahating siko. May mga ukit[c] din sa bukana nito, at ang kanilang mga panel ay parisukat, hindi bilog.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “bibig nito”; ginagamit sa Hebreo ang “bibig” bilang larawang pang-arkitektura para sa bukana.
    reason: lexical_alternative
  - marker: b
    text: Teknikal at mahirap tiyakin ang pariralang Hebreo; maaari rin itong isaling “gaya ng gawa ng isang tuntungan” o “gaya ng pagkakayari ng isang base.”
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “inukit na palamuti,” “mga korona,” o “mga girlanda”; hindi tiyak ang anyo ng dekorasyong tinutukoy.
    reason: lexical_alternative
lexical_decisions:
- source_word: פִיהוּ / פִיהָ
  choice: bukana
  rationale: Sa kontekstong pang-arkitektura, ang literal na “bibig” ay tumutukoy sa bukas na bahagi ng kayarian. Likas at malinaw sa modernong Tagalog ang “bukana.”
- source_word: מִבֵּית לַכֹּתֶרֶת
  choice: mula sa loob ng koronang bahagi
  rationale: Ipinahihiwatig ng מִבֵּית ang loob o interyor, at ang כֹּתֶרֶת ay ang itaas na bahaging tulad ng korona o capital. Iniiwasan ng salin ang di-pamilyar na teknikal na terminong “kapitel.”
- source_word: וָמַעְלָה בָּאַמָּה
  choice: nakausli nang isang siko paitaas
  rationale: Ang parirala ay nagsasaad ng isang sikong pag-angat o pag-usli paitaas; ang “nakausli” ay nagbibigay ng kinakailangang pandiwang diwa nang hindi labis na nagpapaliwanag.
- source_word: עָגֹל
  choice: bilog
  rationale: Tuwirang katumbas ito ng salitang tumutukoy sa hugis at natural sa karaniwang Tagalog.
- source_word: מַעֲשֵׂה כֵן
  choice: tulad ng pagkakayari ng isang patungan
  rationale: Pinananatili nito ang teknikal at bahagyang malabong paghahambing sa pagkakayari ng isang stand, base, o pedestal.
- source_word: אַמָּה וַחֲצִי הָאַמָּה
  choice: may sukat na isa’t kalahating siko
  rationale: Hindi tinutukoy ng Hebreo kung diyametro o ibang dimensiyon ang sukat, kaya hindi iyon idinagdag sa salin.
- source_word: מִקְלָעוֹת
  choice: mga ukit
  rationale: Tumutukoy ang salita sa palamuting nililok o iniuukit, ngunit hindi tiyak ang mismong disenyo; hindi ito labis na tinutukoy ng “mga ukit.”
- source_word: מִסְגְּרֹתֵיהֶם
  choice: kanilang mga panel
  rationale: Sa paglalarawan ng mga kagamitang ito, ang מִסְגֶּרֶת ay maaaring tumukoy sa mga seksiyong may balangkas o mga panel. Pinananatili ng “kanilang” ang pangmaramihang hulapi ng Hebreo.
- source_word: מְרֻבָּעוֹת לֹא עֲגֻלּוֹת
  choice: parisukat, hindi bilog
  rationale: Tuwirang pinananatili ang hayagang paghahambing ng apat-na-panig na hugis at bilog na hugis.
