  text: כָּל אֵ֜לֶּה אֲבָנִ֤ים יְקָרֹת֙ כְּ/מִדֹּ֣ת גָּזִ֔ית מְגֹרָר֥וֹת בַּ/מְּגֵרָ֖ה מִ/בַּ֣יִת וּ/מִ/ח֑וּץ וּ/מִ/מַּסָּד֙ עַד הַ/טְּפָח֔וֹת וּ/מִ/ח֖וּץ עַד הֶ/חָצֵ֥ר הַ/גְּדוֹלָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/009.yaml
  text: All these were costly stones[a], cut according to measure, sawed with a saw on the inside and on the outside, from the foundation to the coping[b], and on the outside as far as the great court.
translation:
  language: tl
  text: Ang lahat ng ito ay mamahaling mga bato[a], tinabas ayon sa sukat at nilagari sa panloob at panlabas na mga panig, mula sa pundasyon hanggang sa pinakatuktok[b], at sa labas hanggang sa malaking looban.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mahahalagang bato.” Malamang na ang tinutukoy rito ay mamahalin at de-kalidad na mga batong pantayo, hindi mga hiyas.
    reason: lexical_alternative
  - marker: b
    text: Hebreo, “hanggang sa mga tefaḥot.” Hindi tiyak ang eksaktong bahaging arkitektural na tinutukoy; maaaring ito ang pang-itaas na pangwakas na bahagi o pinakamataas na hanay ng mga bato.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲבָנִים יְקָרֹת
  choice: mamahaling mga bato
  rationale: Sa konteksto ng pagtatayo, tumutukoy ito sa mamahalin at de-kalidad na batong pantayo, hindi sa mga hiyas.
- source_word: כְּמִדֹּת גָּזִית
  choice: tinabas ayon sa sukat
  rationale: Ipinahahayag nito kapwa ang maingat na pagtabas at ang pagsunod sa tiyak na sukat.
- source_word: מְגֹרָרוֹת בַּמְּגֵרָה
  choice: nilagari
  rationale: Likas sa Filipino ang pandiwang ito at malinaw nitong ipinahahayag ang paggamit ng lagari, kahit hindi na inuulit ang kasangkapang likas nang kasama sa kahulugan.
- source_word: מִבַּיִת וּמִחוּץ
  choice: sa panloob at panlabas na mga panig
  rationale: Sa arkitekturang konteksto, malamang na tumutukoy ito sa pagkakayari ng magkabilang mukha o panig ng mga bato.
- source_word: מִמַּסָּד
  choice: mula sa pundasyon
  rationale: Ang מַסָּד ay tumutukoy sa pundasyon o pinakailalim na saligan ng gusali.
- source_word: עַד הַטְּפָחוֹת
  choice: hanggang sa pinakatuktok
  rationale: Hindi tiyak ang tinutukoy na bahaging arkitektural; pinananatili ng pangkalahatang salin ang ideya ng pang-itaas na hangganan nang hindi labis na tinutukoy kung anong sangkap iyon.
- source_word: וּמִחוּץ עַד הֶחָצֵר הַגְּדוֹלָה
  choice: at sa labas hanggang sa malaking bulwagan
  rationale: Inilalarawan nito ang lawak palabas hanggang sa malaking חָצֵר; gayunman, mas angkop sa konteksto ang 'malaking looban' kaysa 'bulwagan' at iyon ang dapat gamitin sa pinal na teksto.
