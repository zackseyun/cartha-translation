  source_fidelity: Kailangang itama ang “ipinagawa ni Haring Solomon,” dahil ang Hebreong עָשָׂה ay “ginawa,” hindi ang tahasang causative na “ipinagawa.” Bagama’t maaaring ipahiwatig ng konteksto na mga manggagawa ang nagsagawa ng proyekto, hindi ito dapat idagdag sa salin. Ang natitirang diwa—pagkakatapos ng gawain, pagdadala ng mga bagay na itinalaga ni David, at paglalagay ng mga ito sa mga kabang-yaman—ay tapat sa Hebreo.
  naturalness: Marangal at likas ang pangkalahatang Tagalog. Ang “mga kabang-yaman” ay mas tuwiran at mas natural na katumbas ng אֹצְרוֹת kaysa “mga imbakan ng kayamanan,” habang pinananatili ang plural.
  terminology: Ang “Yahweh” ay wastong pagsasalin ng Tetragrammaton ayon sa ibinigay na patakaran. Ang “mga banal na bagay na inilaan” ay angkop para sa קָדְשֵׁי, at nililinaw ng talababa ang alternatibong “mga bagay na inilaan.” Ang “mga kagamitan” ay sapat na malawak para sa כֵּלִים.
