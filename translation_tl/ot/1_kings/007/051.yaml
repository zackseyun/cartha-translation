  text: וַ/תִּשְׁלַם֙ כָּל הַ/מְּלָאכָ֔ה אֲשֶׁ֥ר עָשָׂ֛ה הַ/מֶּ֥לֶךְ שְׁלֹמֹ֖ה בֵּ֣ית יְהוָ֑ה וַ/יָּבֵ֨א שְׁלֹמֹ֜ה אֶת קָדְשֵׁ֣י דָּוִ֣ד אָבִ֗י/ו אֶת הַ/כֶּ֤סֶף וְ/אֶת הַ/זָּהָב֙ וְ/אֶת הַ/כֵּלִ֔ים נָתַ֕ן בְּ/אֹצְר֖וֹת בֵּ֥ית יְהוָֽה־־׀־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/051.yaml
  text: So all the work that King Solomon did for the house of Yahweh was finished. And Solomon brought in the holy things of David his father—the silver[a], the gold, and the vessels—and put them in the treasuries of the house of Yahweh.
translation:
  language: tl
  text: Kaya natapos ang lahat ng gawaing ginawa ni Haring Solomon para sa bahay ni Yahweh. At ipinasok ni Solomon ang mga banal na bagay na inilaan ng kanyang amang si David[a]—ang pilak, ang ginto, at ang mga kagamitan—at inilagay niya ang mga iyon sa mga kabang-yaman ng bahay ni Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “ang mga bagay na inilaan ni David, na kanyang ama.” Tumutukoy ang Hebreo sa mga bagay na ibinukod bilang banal para kay Yahweh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּשְׁלַם כָּל הַמְּלָאכָה
  choice: natapos ang lahat ng gawain
  rationale: Ipinahahayag ng שלם ang pagkakumpleto ng buong gawaing may kaugnayan sa pagtatayo at paghahanda ng templo; natural sa Tagalog ang resultative na “natapos.”
- source_word: אֲשֶׁר עָשָׂה הַמֶּלֶךְ שְׁלֹמֹה
  choice: ipinagawa ni Haring Solomon
  rationale: Bagaman literal na “ginawa ni Haring Solomon,” maaaring tumukoy ang עשה sa gawaing isinagawa sa ilalim ng kanyang pamamahala. Iniiwasan ng “ipinagawa” ang di-natural na pahiwatig na siya mismo ang gumawa ng lahat.
- source_word: בֵּית יְהוָה
  choice: bahay ni Yahweh
  rationale: Pinananatili ang konkretong Hebreong “bahay” at ang personal na pangalang tipan na Yahweh, sa halip na gawing “templo” o palitan ng isang titulo.
- source_word: וַיָּבֵא
  choice: ipinasok
  rationale: Ang hiphil ng בוא ay “magpasok/dalhin papasok.” Ang “ipinasok” ay malinaw at natural dahil ang hantungan ay ang mga imbakan sa bahay ni Yahweh.
- source_word: קָדְשֵׁי דָּוִד אָבִיו
  choice: mga banal na bagay na inilaan ng kanyang amang si David
  rationale: Sinasaklaw ng קָדְשֵׁי ang mga bagay na ibinukod bilang banal o inialay. Pinagsasama ng salin ang ugnayan sa kabanalan at ang ideya ng paglalaan nang hindi nililimitahan sa isang partikular na uri ng handog.
- source_word: הַכֶּסֶף וְאֶת הַזָּהָב וְאֶת הַכֵּלִים
  choice: ang pilak, ang ginto, at ang mga kagamitan
  rationale: Malawak ang כֵּלִים at maaaring tumukoy sa sari-saring sisidlan, kasangkapan, o kagamitan. Ang “mga kagamitan” ay hindi labis na nagtatakda ng anyo o gamit.
- source_word: נָתַן בְּאֹצְרוֹת
  choice: inilagay niya ang mga iyon sa mga imbakan ng kayamanan
  rationale: Ang נתן ay idiomatikong “ilagay” dito, at ang plural na אֹצְרוֹת ay mga silid o lugar na imbakan ng mahahalagang bagay.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Tuwirang ginagamit ng Hebreo ang Tetragrammaton; pinananatili ng “Yahweh” ang banal na pangalang nasa teksto sa halip na palitan ito ng titulong “PANGINOON.”
- issue: Kahulugan ng קָדְשֵׁי
  choice: mga banal na bagay na inilaan
  alternative: mga inialay na bagay
  rationale: Pinananatili ng pangunahing salin ang parehong kabanalan at pagkakabukod ng mga bagay. Ang mas maikling alternatibo ay posible, ngunit maaaring hindi gaanong makita ang leksikal na kaugnayan sa kabanalan.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “bahay ni Yahweh” upang mapanatili ang larawan ng Hebreo, at “mga imbakan ng kayamanan” upang maging malinaw ang plural na mga silid o lugar na taguan.
