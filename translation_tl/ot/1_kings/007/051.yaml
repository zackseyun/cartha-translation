revisions:
- from: Kaya natapos ang lahat ng gawaing ipinagawa ni Haring Solomon para sa bahay ni Yahweh. At ipinasok ni Solomon ang mga banal na bagay na inilaan ng kanyang amang si David[a]—ang pilak, ang ginto, at ang mga kagamitan—at inilagay niya ang mga iyon sa mga imbakan ng kayamanan sa bahay ni Yahweh.
  to: Kaya natapos ang lahat ng gawaing ginawa ni Haring Solomon para sa bahay ni Yahweh. At ipinasok ni Solomon ang mga banal na bagay na inilaan ng kanyang amang si David[a]—ang pilak, ang ginto, at ang mga kagamitan—at inilagay niya ang mga iyon sa mga kabang-yaman ng bahay ni Yahweh.
  rationale: Pinalitan ang causative na “ipinagawa” ng “ginawa” upang maipakita ang pandiwang Hebreo nang hindi nagdaragdag ng ahensiyang wala sa teksto. Ginawang “mga kabang-yaman” ang “mga imbakan ng kayamanan” bilang mas direktang katumbas ng mga treasury/storage chambers. Inayos ang talababa upang ang alternatibo ay malinaw na tumutukoy sa mga bagay na inilaan ni David.
