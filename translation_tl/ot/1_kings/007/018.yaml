base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/018.yaml
  text: He made the pillars[a], and two rows all around on the one latticework, to cover the capitals that were on top of the pomegranates[b]; and so he did for the second capital.
translation:
  language: tl
  text: Ginawa niya ang mga haligi at dalawang hanay na nakapalibot sa isang sala-salang palamuti, upang takpan ang mga kapitel na nasa ibabaw ng mga granada;[b] gayon din ang ginawa niya para sa ikalawang kapitel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Mahirap unawain ang Hebreo ng talatang ito. Ang “mga granada” ay malamang na mga palamuting hugis-granada. Ayon sa ibang pagkaunawa, ang dalawang hanay ng mga palamuting granada ay nakapalibot sa sala-salang palamuti ng bawat kapitel.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Ginawa niya
  rationale: Tuwirang salin ng karaniwang pandiwang עשה sa sunod-sunod na salaysay.
- source_word: הָעַמּוּדִים
  choice: ang mga haligi
  rationale: Karaniwan at malinaw na terminong Filipino para sa mga pillar o column sa kontekstong pang-arkitektura; pinananatili ang literal na pagbasa kahit mahirap ang Hebreo.
- source_word: שְׁנֵי טוּרִים
  choice: ang dalawang hanay
  rationale: Ang טוּר ay tumutukoy sa magkakasunod na ayos o hanay, na angkop sa palamuti.
- source_word: סָבִיב
  choice: sa palibot
  rationale: Natural na nagpapahayag ng pagkakalagay na nakapaligid sa estruktura.
- source_word: הַשְּׂבָכָה הָאֶחָת
  choice: ng isang gawaing sala-sala
  rationale: Ang שׂבכה ay parang lambat o sala-salang palamuti; ang הָאֶחָת ay pinanatiling 'isang' sa halip na ipakahulugang 'una.'
- source_word: לְכַסּוֹת
  choice: upang takpan
  rationale: Pinananatili ang layuning ipinahihiwatig ng infinitive at ang payak na kahulugang 'takpan.'
- source_word: הַכֹּתָרֹת
  choice: ang mga kapitel
  rationale: Ang 'kapitel' ang terminong pang-arkitektura para sa pandekorasyong pinakatuktok ng haligi.
- source_word: אֲשֶׁר עַל רֹאשׁ
  choice: na nasa ibabaw ng
  rationale: Natural na Filipino para sa lokasyong ipinapahayag ng idyomang Hebreo.
- source_word: הָרִמֹּנִים
  choice: mga granada
  rationale: Pinananatili ang literal na 'mga granada'; malamang na tumutukoy ito sa mga palamuting hugis-granada, na nililinaw sa talababa.
- source_word: וְכֵן עָשָׂה
  choice: gayon din ang ginawa niya
  rationale: Malinaw na ipinahahayag ang pag-uulit ng parehong paggawa sa katapat na kapitel.
- source_word: לַכֹּתֶרֶת הַשֵּׁנִית
  choice: sa ikalawang kapitel
  rationale: Tuwirang tumutukoy sa katumbas na kapitel ng ikalawang haligi nang hindi dinaragdagan ang Hebreo.
