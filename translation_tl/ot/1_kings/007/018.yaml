revisions:
- from: Ginawa niya ang mga haligi,[a] at ang dalawang hanay sa palibot ng isang gawaing sala-sala, upang takpan ang mga kapitel na nasa ibabaw ng mga granada;[b] gayon din ang ginawa niya sa ikalawang kapitel.
  to: Ginawa niya ang mga haligi at dalawang hanay na nakapalibot sa isang sala-salang palamuti, upang takpan ang mga kapitel na nasa ibabaw ng mga granada;[b] gayon din ang ginawa niya para sa ikalawang kapitel.
  rationale: Inalis ang maling talababa sa “mga haligi,” dahil walang leksikal na batayan sa Hebreo upang ituring itong “mga palamuting hugis-granada.” Pinanatili ang literal na “mga granada” sa teksto at inilagay sa isang talababa ang tunay na sintaktikong hirap at ang alternatibong pagkaunawa. Pinakinis din ang katawagang pang-arkitektura nang hindi binabago ang kahulugan.
