translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang teknikal na salitang “kapitel” dahil ito ang tiyak na terminong pang-arkitektura, samantalang ang “gawaing sala-sala” ay mas malinaw sa karaniwang mambabasa kaysa sa mas teknikal o di-pamilyar na katawagan. Pinanatili sa teksto at mga talababa ang sintaktikong hirap at tunay na kalabuan ng Hebreo.
