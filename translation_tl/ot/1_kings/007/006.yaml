  text: וְ/אֵ֨ת אוּלָ֤ם הָֽ/עַמּוּדִים֙ עָשָׂ֔ה חֲמִשִּׁ֤ים אַמָּה֙ אָרְכּ֔/וֹ וּ/שְׁלֹשִׁ֥ים אַמָּ֖ה רָחְבּ֑/וֹ וְ/אוּלָם֙ עַל פְּנֵי/הֶ֔ם וְ/עַמֻּדִ֥ים וְ/עָ֖ב עַל פְּנֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/006.yaml
  text: He made the Hall of Pillars fifty cubits long and thirty cubits wide[a], with a porch in front of them[b], and pillars and a threshold in front of them.
translation:
  language: tl
  text: Ginawa rin niya ang Bulwagan ng mga Haligi, na limampung siko ang haba at tatlumpung siko ang lapad. Sa harap ng mga iyon ay may isang portiko[a], at sa harap ng mga iyon ay may mga haligi at isang pantakip[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Iisang salitang Hebreo (אוּלָם) ang isinaling “Bulwagan” at “portiko” sa talatang ito. Maaari rin itong isaling “bulwagan,” “portiko,” o “pasukan” sa dalawang paglitaw nito.
    reason: lexical_alternative
  - marker: b
    text: Hindi tiyak ang kahulugan ng salitang Hebreo na עָב sa kontekstong arkitektural. Maaari itong tumukoy sa isang pasamano, mga biga, makapal na balangkas, o ibang nakatakip na bahagi ng estruktura.
    reason: lexical_alternative
lexical_decisions:
- source_word: אוּלָם הָעַמּוּדִים
  choice: Bulwagan ng mga Haligi
  rationale: Ang unang אוּלָם ay tumutukoy sa malaking gusali o bulwagan na kinikilala sa mga haligi nito; malinaw at likas sa modernong Tagalog ang pariralang ito.
- source_word: עָשָׂה
  choice: Ginawa
  rationale: Pinananatili nito ang karaniwang kahulugan ng pandiwang עשה nang hindi tahasang pinapalitan ng mas espesipikong “itinayo.” Idinagdag ang “rin” upang katawanin ang panimulang pang-ugnay na וְ sa daloy ng konteksto.
- source_word: חֲמִשִּׁים אַמָּה אָרְכּוֹ וּשְׁלֹשִׁים אַמָּה רָחְבּוֹ
  choice: limampung siko ang haba at tatlumpung siko ang lapad
  rationale: Natural na pormula ito sa Tagalog para sa eksaktong sukat at pinananatili ang sinaunang yunit na siko.
- source_word: וְאוּלָם עַל־פְּנֵיהֶם
  choice: Sa harap ng mga iyon ay may isang portiko
  rationale: Ang ikalawang אוּלָם ay waring isang pasukan o nakausling bahagi sa harap ng naunang estruktura. Ang “mga iyon” ay nagpapanatili sa maramihang panghalip ng Hebreo nang hindi sapilitang tinutukoy ang antecedent nito.
- source_word: וְעַמֻּדִים
  choice: may mga haligi
  rationale: Tahasan nitong pinananatili ang mga haliging binanggit sa maikli at putol-putol na sintaks ng Hebreo.
- source_word: וְעָב
  choice: at isang pantakip
  rationale: Hindi tiyak ang kahulugan ng עָב sa kontekstong arkitektural. Ang “pantakip” ay sadyang malawak at nababagay sa maaaring bubong o ibang nakatakip na elementong pang-istruktura, habang inilalahad sa talababa ang ibang posibilidad.
- source_word: עַל־פְּנֵיהֶם
  choice: sa harap ng mga iyon
  rationale: Pinananatili nito ang ugnayang pang-espasyo at ang maramihang anyo ng Hebreo.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na may dignidad at payak na sintaks. Pinanatili ang “siko” bilang tradisyonal na yunit. Hindi nilutas nang sapilitan ang hindi malinaw na tinutukoy ng maramihang panghalip o ang alanganing terminong arkitektural na עָב.
