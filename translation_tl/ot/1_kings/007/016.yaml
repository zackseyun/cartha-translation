  verdict: revise
  source_fidelity: Tumpak ang estruktura at mga sukat, at naipapahayag ang layunin ng paggawa sa pamamagitan ng “upang ilagay.” Gayunman, ang “tanso” sa makabagong Filipino ay karaniwang copper, samantalang ang נְחֹשֶׁת sa kontekstong ito ng hinulmang malalaking elementong pang-arkitektura ay mas angkop na isalin bilang “bronse,” alinsunod din sa English audit trail. Ang “hinulma sa bronse” ay nagpapanatili sa diwa ng מֻצָק.
