  terminology: Panatilihin ang “kapitel,” “haligi,” at “siko.” Palitan ang “tanso” ng “bronse” upang maiwasan ang mas tiyak na modernong kahulugang copper at upang tumugma sa karaniwang kahulugan ng termino sa ganitong konteksto.
