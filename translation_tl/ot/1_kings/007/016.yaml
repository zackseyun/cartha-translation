translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang teknikal na salitang “kapitel” dahil ito ang tiyak na tawag sa pandekorasyong tuktok ng haligi; ipinaliliwanag ng konteksto ang kahulugan nito. Ang “rin” ay idinagdag upang natural na maipahayag sa Filipino ang magkaparehong sukat ng dalawang kapitel.
