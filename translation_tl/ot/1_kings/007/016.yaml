base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/016.yaml
  text: He made two capitals of cast bronze to set on the tops of the pillars. The height of the one capital was five cubits[a], and the height of the second capital was five cubits.
translation:
  language: tl
  text: Gumawa siya ng dalawang kapitel na hinulma sa bronse upang ilagay sa ibabaw ng mga haligi. Limang siko[a] ang taas ng isang kapitel, at limang siko rin ang taas ng ikalawang kapitel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang isang siko ay humigit-kumulang 45 sentimetro; kaya ang limang siko ay mga 2.25 metro.
    reason: measurement_clarification
lexical_decisions:
- source_word: כֹתָרֹת / הַכֹּתֶרֶת
  choice: mga kapitel / kapitel
  rationale: Sa kontekstong pang-arkitektura, tumutukoy ito sa pandekorasyong bahaging nasa tuktok ng haligi. Ang “kapitel” ang tiyak at ginagamit na terminong Filipino sa arkitektura; mas malinaw ito rito kaysa sa literal na “mga korona.”
- source_word: עָשָׂה
  choice: gumawa
  rationale: Karaniwan at tuwirang katumbas ito ng pandiwa, nang hindi nagdaragdag ng diwa na wala sa Hebreo.
- source_word: לָתֵת
  choice: upang ilagay
  rationale: Ipinahahayag ng pawatas ang layunin ng paggawa sa mga kapitel.
- source_word: רָאשֵׁי הָעַמּוּדִים
  choice: sa ibabaw ng mga haligi
  rationale: Likas na Filipino ito para sa literal na “mga ulo ng mga haligi” at malinaw na tumutukoy sa kinalalagyan ng mga kapitel.
- source_word: מֻצַק נְחֹשֶׁת
  choice: hinulma sa tanso
  rationale: Pinananatili nito kapwa ang materyal at ang proseso ng pagbubuhos o paghuhulma ng tunaw na metal. Sa kontekstong biblikal, ang נְחֹשֶׁת ay tumutukoy rito sa tanso/bronse.
- source_word: חָמֵשׁ אַמּוֹת
  choice: limang siko
  rationale: Pinananatili ang sinaunang yunit ng sukat sa halip na magtakda ng isang di-tiyak na modernong conversion.
- source_word: קוֹמַת
  choice: ang taas ng
  rationale: Ito ang natural at eksaktong katumbas sa konteksto ng sukat pang-arkitektura.
- source_word: הָאֶחָת
  choice: isang
  rationale: Pinananatili ang pagkakaiba ng Hebreong “isa” sa tahasang “una.”
- source_word: הַשֵּׁנִית
  choice: ikalawang
  rationale: Tahasang tinutukoy ng Hebreo ang ikalawa sa pares.
