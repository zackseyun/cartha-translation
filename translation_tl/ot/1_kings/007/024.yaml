base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/024.yaml
  text: And gourds were under its rim all around[a], encircling it, ten to the cubit, surrounding the Sea all around. The gourds were in two rows, cast in one piece with it.
translation:
  language: tl
  text: Sa ilalim ng labi nito ay may mga palamuting hugis-bunga sa buong palibot[a], na nakapalibot dito—sampu sa bawat siko—at nakapalibot sa Dagat sa buong paligid. Ang mga palamuting iyon ay nasa dalawang hanay at hinulma kasama nito bilang iisang piraso.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga kalabasa,” “mga usbong,” o “mga umbok”; ang salitang Hebreo ay tumutukoy sa mga palamuting anyong kahawig ng bunga.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפְקָעִים
  choice: mga palamuting hugis-bunga
  rationale: Ang פְקָעִים ay tumutukoy sa mga anyong palamuting kahawig ng bunga, marahil mga kalabasa, usbong, o umbok. Pinananatili ng salin ang kongkretong hugis nang hindi labis na tinutukoy ang uri ng halaman.
- source_word: מִתַּחַת לִשְׂפָתוֹ
  choice: sa ilalim ng labi nito
  rationale: Literal na 'labi' o gilid ang שָׂפָה. Ang 'labi' ay natural ding gamitin sa sisidlan at pinananatili ang larawan ng Hebreo.
- source_word: סָבִיב סֹבְבִים אֹתוֹ ... מַקִּפִים אֶת הַיָּם סָבִיב
  choice: sa buong palibot ... na nakapalibot sa Dagat
  rationale: Pinananatili ang inuulit na diwa ng pag-ikot at lubos na pagpalibot, ngunit sa maayos na modernong Tagalog.
- source_word: עֶשֶׂר בָּאַמָּה
  choice: sampu sa bawat siko
  rationale: Ipinahihiwatig ng parirala ang bilang o densidad na sampung palamuti sa bawat siko ng paikot na sukat.
- source_word: הַיָּם
  choice: Dagat
  rationale: Tanging pangalan ito ng malaking hinulmang palanggana sa templo, kaya ginamit ang malaking titik.
- source_word: שְׁנֵי טוּרִים
  choice: nasa dalawang hanay
  rationale: Direktang katumbas ng טוּרִים ang 'mga hanay' at malinaw ang ayos ng mga palamuti.
- source_word: יְצֻקִים בִּיצֻקָתוֹ
  choice: hinulmang kasama ng Dagat bilang iisang piraso
  rationale: Ang pag-uulit ng ugat na יצק ay nagpapakitang kasabay at kabahagi ng mismong paghuhulma sa sisidlan ang mga palamuti, hindi ikinabit pagkaraan.
