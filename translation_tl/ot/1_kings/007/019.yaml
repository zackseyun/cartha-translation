  text: וְ/כֹֽתָרֹ֗ת אֲשֶׁר֙ עַל רֹ֣אשׁ הָ/עַמּוּדִ֔ים מַעֲשֵׂ֖ה שׁוּשַׁ֣ן בָּֽ/אוּלָ֑ם אַרְבַּ֖ע אַמּֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/019.yaml
  text: And the capitals that were on the tops of the pillars were made like a lily blossom in the portico[c][b][a], four cubits.
translation:
  language: tl
  text: At ang mga kapitel sa tuktok ng mga haligi ay ginawang hugis bulaklak ng liryo[b] sa portiko[a], at apat na siko ang sukat ng mga ito.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa bulwagang pasukan” o “sa beranda.” Ang salitang Hebreo ay tumutukoy sa bulwagang pasukan o portiko ng templo.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “hugis liryo.” Ipinapalagay ng ilan na ang tinutukoy rito ay disenyong bulaklak na hugis lotus sa mga kapitel ng haligi.
    reason: lexical_alternative
  - marker: c
    text: Sa Hebreo, “apat na siko.” Malamang na ang sukat na ito ay tumutukoy sa taas ng bahaging hugis-liryo ng mga kapitel.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹתָרֹת
  choice: mga kapitel
  rationale: Ang “kapitel” ang tiyak na katawagang pang-arkitektura para sa pandekorasyong pinakatuktok ng isang haligi; mas eksakto ito kaysa sa pangkalahatang “mga tuktok” o “mga korona.”
- source_word: רֹאשׁ הָעַמּוּדִים
  choice: sa tuktok ng mga haligi
  rationale: Likas sa modernong Filipino ang “tuktok” para sa literal na “ulo” sa kontekstong pang-arkitektura, at malinaw na tinutukoy ng עַמּוּדִים ang mga haligi.
- source_word: מַעֲשֵׂה שׁוּשַׁן
  choice: ginawang hugis bulaklak ng liryo
  rationale: Ipinahahayag nito ang anyo o disenyong floral ng mga kapitel. Pinananatili ng “liryo” ang karaniwang kahulugan ng שׁוּשַׁן, habang nililinaw ng “bulaklak” na ang tinutukoy ay ang hugis nito.
- source_word: בָּאוּלָם
  choice: sa portiko
  rationale: Ang אוּלָם ay ang pasukan o bulwagang nasa harap ng gusali ng templo. Ang “portiko” ay isang malinaw at angkop na katawagang pang-arkitektura sa Filipino.
- source_word: אַרְבַּע אַמּוֹת
  choice: apat na siko ang sukat ng mga ito
  rationale: Pinananatili ang sinaunang yunit na “siko.” Hindi idinagdag ang “taas” dahil sukat lamang ang tahasang binabanggit sa Hebreo, bagaman malamang na taas ang tinutukoy.
theological_decisions: []
translation_notes:
  register: Gumamit ng moderno ngunit marangal na Filipino. Pinili ang teknikal na salitang “kapitel” at ang pamilyar na “haligi.” Isinaad ang sukat nang hindi tahasang dinaragdagan ng “taas,” upang mapanatili ang di-tiyak na anyo ng Hebreo; ipinaliwanag sa talababa ang malamang na kahulugan.
