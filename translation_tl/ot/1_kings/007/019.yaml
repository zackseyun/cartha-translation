  terminology: Ang “mga kapitel” ay eksaktong terminong pang-arkitektura para sa כֹּתָרֹת. Ang “bulaklak ng liryo” ay nagpapanatili sa pangunahing kahulugan ng שׁוּשַׁן nang hindi ipinipilit ang alternatibong “lotus.” Hindi idinagdag sa pangunahing teksto ang “taas,” kaya nananatiling bukás ang saklaw ng “apat na siko.”
