  source_fidelity: 'Tapat ang salin sa Hebreo: ang mga kapitel ay nasa tuktok ng mga haligi, may anyong/disenyong liryo, kaugnay ng portiko, at may sukat na apat na siko. Ang idinagdag na “ang sukat ng mga ito” ay likas na paraan sa Filipino upang maipahayag ang elliptical na sukat sa Hebreo at hindi tahasang itinatakda na taas ito.'
