  text: 'Thus he made the ten stands: one casting[a], one measure, one form for all of them.'
translation:
  language: tl
  text: 'Ganito niya ginawa ang sampung patungan: iisa ang pagkakahulma[a], iisa ang sukat, at iisa ang anyo ng lahat ng iyon.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “iisa ang pagkakayari sa hulma, iisa ang laki, at iisa ang disenyo ng lahat ng iyon.” Gumagamit ang Hebreo ng tatlong maiikli at magkahanay na pahayag upang idiin na pare-pareho ang pagkakagawa ng lahat ng sampung patungan.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּזֹאת
  choice: Ganito
  rationale: Tumutukoy pabalik sa naunang paglalarawan ng disenyo at pagkakagawa; maikli at natural sa modernong Tagalog.
- source_word: עָשָׂה
  choice: niya ginawa
  rationale: Karaniwang salin sa konteksto ng paggawa ng kagamitang metal at hindi labis na espesipiko.
- source_word: עֶשֶׂר הַמְּכֹנוֹת
  choice: ang sampung patungan
  rationale: Sa konteksto ng mga kagamitan sa templo, ang מְכֹנוֹת ay mga patungan o base ng mga palanggana; malinaw ang 'patungan' nang hindi labis na ipinapalagay ang anyo nito.
- source_word: מוּצָק אֶחָד
  choice: iisa ang pagkakahulma
  rationale: Pinananatili ang diwa ng metal na hinulma sa pamamagitan ng pagbubuhos at ipinahahayag ang pagkakapare-pareho ng pagkakagawa.
- source_word: מִדָּה אַחַת
  choice: iisa ang sukat
  rationale: Natural na Tagalog para sa literal na 'isang sukat' at malinaw na nagsasaad ng magkakatulad na dimensiyon.
- source_word: קֶצֶב אֶחָד
  choice: iisa ang anyo
  rationale: Ang קֶצֶב dito ay maaaring tumukoy sa anyo, disenyo, o proporsiyon; pinananatili ng 'anyo' ang maikli at magkahanay na pahayag.
- source_word: לְכֻלָּהְנָה
  choice: ng lahat ng iyon
  rationale: Tumutukoy sa lahat ng sampung patungan at natural na inuugnay sa tatlong magkakatulad na katangian.
