base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/045.yaml
  text: and the pots[a], the shovels, the basins[c][b], and all these vessels that Hiram made for King Solomon for the house of Yahweh were of burnished bronze.
translation:
  language: tl
  text: Pati ang mga palayok, mga pala, mga palanggana,[a] at lahat ng kagamitang ito na ginawa ni Hiram para kay Haring Solomon, para sa bahay ni Yahweh, ay yari sa pinakintab na bronse.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “mga mangkok.”
    reason: lexical_alternative
  - marker: b
    text: O, “pinakintab na tanso.” Maaaring tumukoy ang salitang Hebreo sa tanso o bronse.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַסִּירוֹת
  choice: mga palayok
  rationale: Karaniwang tumutukoy ang salita sa mga palayok o kaldero. Ang “mga palayok” ay malinaw at hindi labis na nagtatakda ng tiyak na gamit.
- source_word: הַיָּעִים
  choice: mga pala
  rationale: Tumutukoy ito sa mga kagamitang ginagamit sa pag-aalis ng abo o paghawak ng materyal sa altar; natural at angkop ang “mga pala.”
- source_word: הַמִּזְרָקוֹת
  choice: mga mangkok
  rationale: Mga sisidlan itong ginagamit sa pagtanggap o pagwisik ng likido. Natural sa modernong Filipino ang “mga mangkok,” habang posible rin ang “mga palanggana.”
- source_word: כָּל הַכֵּלִים הָאֵלֶּה
  choice: ang lahat ng kagamitang ito
  rationale: Malawak ang kahulugan ng כֵּלִים at maaaring tumukoy sa mga kagamitan, sisidlan, o kasangkapan. Pinananatili ng “kagamitan” ang lawak nito sa konteksto ng templo.
- source_word: בֵּית יְהוָה
  choice: para sa bahay ni Yahweh
  rationale: Pinananatili ang literal na larawang “bahay” sa halip na gawing “templo,” at ipinahahayag ang layunin ng mga kagamitang ginawa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin sa baybay na “Yahweh” ang personal na pangalang nasa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: נְחֹשֶׁת מְמֹרָט
  choice: pinakintab na bronse
  rationale: Ipinahihiwatig ng מְמֹרָט ang metal na pinakinis o pinakintab. Ang “bronse” ay ang malamang na materyal sa konteksto ng mga kagamitang pangtemplo, bagaman maaaring mas malawak ang saklaw ng נְחֹשֶׁת.
theological_decisions:
- issue: Paglalarawan sa banal na pangalan na יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Personal na pangalan ang tahasang nasa tekstong Hebreo. Ang “Yahweh” ay nagpapanatili rito sa halip na palitan ng titulong “PANGINOON,” nang hindi nagdaragdag ng paliwanag na denominasyonal.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Pati” upang maipagpatuloy ang talaan mula sa naunang talata. Pinanatili ang “bahay ni Yahweh” bilang malapit sa Hebreo, at nilinaw sa natural na Filipino ang ipinahiwatig na panaguring “ay yari sa.”
