base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/032.yaml
  text: And the four wheels were underneath the panels[a], and the axles of the wheels were on the stand[b]; and the height of each wheel was a cubit and a half.
translation:
  language: tl
  text: At ang apat na gulong ay nasa ilalim ng mga panel[a], at ang mga ehe ng mga gulong ay nasa patungan[b]. Ang taas ng bawat gulong ay isang siko at kalahati.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring “mga balangkas” o “mga hangganan” (Hebreo: מִסְגְּרוֹת).'
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, literal na “mga kamay ng mga gulong”; sa kontekstong ito, malamang na tumutukoy ito sa mga ehe o suportang baras ng mga gulong.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֹפַנִּים / הָאוֹפַן
  choice: mga gulong / gulong
  rationale: Tumutukoy ang אוֹפַן sa literal na mga gulong ng tansong patungan; ang “gulong” ang natural at malinaw na katumbas sa Tagalog.
- source_word: לְמִתַּחַת
  choice: nasa ilalim
  rationale: Malinaw nitong ipinapahayag ang posisyon sa ibaba ng mga panel sa natural na Tagalog.
- source_word: הַמִּסְגְּרוֹת
  choice: mga panel
  rationale: Sa paglalarawan ng pagkakayari, tumutukoy ito sa nakabalangkas na mga bahagi sa tagiliran. Pinananatili ng “mga panel” ang pagiging malinaw, habang kinikilala sa talababa ang posibleng “mga balangkas” o “mga hangganan.”
- source_word: וִידוֹת
  choice: mga ehe
  rationale: Bagaman literal na kaugnay ng “mga kamay,” sa mekanikal na kontekstong ito ay tumutukoy ito sa mga bahaging nagdurugtong o sumusuporta sa mga gulong; “mga ehe” ang pinakamalinaw na katumbas.
- source_word: בַּמְּכוֹנָה
  choice: nakakabit sa patungan
  rationale: Ang מְכוֹנָה ay ang tansong patungan o base. Ginagawang tahasan ng “nakakabit sa” ang ugnayang mekanikal na ipinahihiwatig ng konteksto, nang hindi binabago ang pangunahing diwa.
- source_word: קוֹמַת
  choice: ang taas ng
  rationale: Tumutukoy ito sa patayong sukat, kaya ang “taas” ang tuwiran at karaniwang katumbas.
- source_word: הָאֶחָד
  choice: bawat
  rationale: Bagaman literal na “ang isa,” distributibo ang gamit nito sa pagsukat ng mga gulong; natural sa Tagalog ang “bawat gulong.”
- source_word: אַמָּה וַחֲצִי הָאַמָּה
  choice: isang siko at kalahati
  rationale: Pinananatili ang sinaunang yunit na “siko” at ang anyo ng sukat sa Hebreo; karaniwan at madaling maunawaan ang pariralang ito sa salin-Bibliyang Tagalog.
