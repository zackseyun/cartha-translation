translation_notes:
  register: Makabagong, malinaw, at marangal na Filipino. Ginamit ang “patungan” para sa tansong stand/base at “siko” para sa cubit. Ang mga teknikal na terminong may tunay na leksikal na kalabuan ay ipinaliwanag sa mga talababa.
