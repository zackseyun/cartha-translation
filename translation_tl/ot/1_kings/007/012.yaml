language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/חָצֵ֨ר הַ/גְּדוֹלָ֜ה סָבִ֗יב שְׁלֹשָׁה֙ טוּרִ֣ים גָּזִ֔ית וְ/ט֖וּר כְּרֻתֹ֣ת אֲרָזִ֑ים וְ/לַ/חֲצַ֧ר בֵּית יְהוָ֛ה הַ/פְּנִימִ֖ית וּ/לְ/אֻלָ֥ם הַ/בָּֽיִת־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/012.yaml
  text: And the great court all around had three rows of cut stone and a row of cedar beams[c][b][a], like the inner court of the house of Yahweh and the vestibule of the house.
translation:
  language: tl
  text: At ang malaking looban sa palibot ay may tatlong hanay ng mga tinabas na bato at isang hanay ng mga bigang sedro,[a] gaya ng panloob na looban ng bahay ni Yahweh at ng bulwagan sa pasukan ng bahay.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “tatlong patong ng tinabas na bato at isang patong ng mga bigang sedro.”
    reason: lexical_alternative
  - marker: b
    text: O “at para sa panloob na looban ng bahay ni Yahweh at para sa bulwagan ng bahay.” Maaaring ipahiwatig ng pang-ukol sa Hebreo ang paghahambing o kaugnayan; dito ay isinaling pahambing bilang “gaya ng.”
    reason: alternative_reading
  - marker: c
    text: Ibig sabihin, ang bulwagan sa pasukan ng gusali ng templo.
    reason: cultural_note
lexical_decisions:
- source_word: חָצֵר הַגְּדוֹלָה
  choice: malaking looban
  rationale: Ang חָצֵר ay isang napaliligirang looban o courtyard; natural at malinaw sa modernong Filipino ang “looban” sa kontekstong panggusali.
- source_word: סָבִיב
  choice: sa palibot
  rationale: Pinananatili nito ang diwang nakapaligid o nasa buong paligid nang hindi nagiging mabigat ang pananalita.
- source_word: שְׁלֹשָׁה טוּרִים גָּזִית
  choice: tatlong hanay ng mga tinabas na bato
  rationale: Sa konstruksiyon, ang טוּר ay hanay o patong ng masonerya, at ang גָּזִית ay batong hinubog o tinabas para sa pagtatayo.
- source_word: וְטוּר כְּרֻתֹת אֲרָזִים
  choice: at isang hanay ng mga bigang sedro
  rationale: Ang כְּרֻתֹת ay literal na mga pinutol na piraso; sa kontekstong pang-arkitektura, natural na ipinahihiwatig nito ang mga bigang yari sa sedro.
- source_word: וְלַחֲצַר בֵּית יְהוָה הַפְּנִימִית
  choice: gaya ng panloob na looban ng bahay ni Yahweh
  rationale: Maaaring gamiting pahambing ang לְ sa eliptikong paglalarawang ito. Ginawang hayag ang paghahambing sa “gaya ng,” habang inilalagay sa talababa ang mas literal na ugnayang “para sa.”
- source_word: אֻלָם
  choice: bulwagan sa pasukan
  rationale: Tumutukoy ito sa porch, portico, o entrance hall ng gusali. Mas madaling maunawaan ng karaniwang mambabasa ang “bulwagan sa pasukan” kaysa sa teknikal na terminong arkitektural.
- source_word: הַבָּיִת
  choice: bahay
  rationale: Pinananatili ang Hebreong katawagan sa templo bilang “bahay,” at malinaw sa konteksto na ang tinutukoy ay ang gusali ng templo.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Tuwirang taglay ng Hebreo ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalang tipan sa halip na palitan ito ng isang titulo.
- issue: Gamit ng לְ sa huling dalawang parirala
  choice: 'pahambing: “gaya ng”'
  alternative: 'ugnayan o pagtukoy: “at para sa panloob na looban... at para sa bulwagan...”'
  rationale: Ang sintaks ay eliptiko at maaaring magpahiwatig ng pagkakatulad ng pagkakayari o simpleng paglalapat sa mga bahaging nabanggit. Ang pahambing na pagbasa ang mas natural sa daloy, ngunit hindi tiyak kaya pinanatili ang alternatibo sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “looban,” “hanay,” at “bulwagan sa pasukan” sa halip na mas teknikal o lipas na mga terminong pang-arkitektura. Iningatan ang eliptiko at bahagyang hindi tiyak na sintaks ng hulihan sa pamamagitan ng talababa.
