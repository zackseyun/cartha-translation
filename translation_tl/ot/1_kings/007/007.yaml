translation_notes:
  register: Makabago at marangal na Filipino ang ginamit. Pinanatili ang pormal na mga katawagang “Bulwagan ng Trono” at “Bulwagan ng Paghatol,” habang iniwasan ang mas teknikal o di-karaniwang bokabularyong pang-arkitektura. Inilipat ang talababa sa pariralang aktuwal nitong ipinapaliwanag.
