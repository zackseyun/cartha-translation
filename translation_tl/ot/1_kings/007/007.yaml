- from: At ginawa niya ang Bulwagan ng Trono, kung saan siya hahatol—ang Bulwagan ng Paghatol. Nilagyan iyon ng mga panel na sedro mula sahig hanggang sahig.[a]
  to: At ginawa niya ang Bulwagan ng Trono, kung saan siya hahatol—ang Bulwagan ng Paghatol—at binalutan ito ng sedro mula sahig hanggang sahig.[a]
  rationale: Pinalitan ang hindi gaanong natural na paglalarawan sa cedar paneling ng “binalutan ito ng sedro,” na nananatiling malapit sa saklaw ng Hebreong pandiwang סָפוּן. Pinag-isa rin ang pangungusap upang mapanatili ang ugnayan ng mga sugnay at ang appositional na “Bulwagan ng Paghatol.” Hindi binago ang literal na “mula sahig hanggang sahig,” at nananatili ang talababa upang ilahad ang karaniwang interpretibong pagbasa nang hindi nilulutas ang tekstuwal na kahirapan sa pangunahing teksto.
