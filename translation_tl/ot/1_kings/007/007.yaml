  yaml_path: translation/ot/1_kings/007/007.yaml
  text: And he made the Hall of the Throne[a], where he was to judge—the Hall of Judgment—and it was paneled with cedar from floor to floor.
translation:
  language: tl
  text: At ginawa niya ang Bulwagan ng Trono, kung saan siya hahatol—ang Bulwagan ng Paghatol—at binalutan ito ng sedro mula sahig hanggang sahig.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O, ayon sa mas interpretibong salin, “mula sahig hanggang kisame.” Literal sa Hebreo: “mula sa sahig hanggang sa sahig.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאוּלָם הַכִּסֵּא
  choice: At ... ang Bulwagan ng Trono
  rationale: Ang אוּלָם ay isang malaki at pormal na bulwagan o portiko. Ang “Bulwagan” ay angkop sa konteksto ng palasyo, at pinananatili ng “Trono” ang maharlikang diwa ng כִּסֵּא.
- source_word: אֲשֶׁר יִשְׁפָּט שָׁם
  choice: kung saan siya hahatol
  rationale: Maaaring tumukoy ang imperfect na יִשְׁפָּט sa nilayon o karaniwang gawain. Likas sa Tagalog ang “kung saan siya hahatol” at malinaw nitong ipinapakita ang gamit ng bulwagan nang hindi labis na nagpapaliwanag.
- source_word: אֻלָם הַמִּשְׁפָּט
  choice: ang Bulwagan ng Paghatol
  rationale: Tuwirang inilalarawan ng pariralang construct ang silid ayon sa gamit nito. Ang “Paghatol” ay mas malapit sa מִשְׁפָּט kaysa sa mas interpretibong “Katarungan.”
- source_word: עָשָׂה
  choice: ginawa niya
  rationale: Malawak ang kahulugan ng עָשָׂה na “gumawa.” Ang “ginawa niya” ay malapit sa Hebreo at natural sa talaan ng mga gusaling ipinagawa ni Solomon.
- source_word: וְסָפוּן בָּאֶרֶז
  choice: Nilagyan iyon ng mga panel na sedro
  rationale: Ang סָפוּן ay nagpapahiwatig ng pagtakip o paglalagay ng sapin/panel. Malinaw na naipapahayag ng salin ang natapos na panloob na kahoy na sapin.
- source_word: מֵהַקַּרְקַע עַד הַקַּרְקָע
  choice: mula sahig hanggang sahig
  rationale: Literal na inuulit ng tekstong Hebreo ang קַרְקַע, “sahig/lupa.” Pinananatili sa pangunahing teksto ang kakaibang pag-uulit at inilalagay sa talababa ang karaniwang interpretibong pagbasa.
