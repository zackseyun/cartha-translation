id: 1KI.7.14
reference: 1 Kings 7:14
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: בֶּן אִשָּׁה֩ אַלְמָנָ֨ה ה֜וּא מִ/מַּטֵּ֣ה נַפְתָּלִ֗י וְ/אָבִ֣י/ו אִישׁ צֹרִי֮ חֹרֵ֣שׁ נְחֹשֶׁת֒ וַ֠/יִּמָּלֵא אֶת הַ/חָכְמָ֤ה וְ/אֶת הַ/תְּבוּנָה֙ וְ/אֶת הַ/דַּ֔עַת לַ/עֲשׂ֥וֹת כָּל מְלָאכָ֖ה בַּ/נְּחֹ֑שֶׁת וַ/יָּבוֹא֙ אֶל הַ/מֶּ֣לֶךְ שְׁלֹמֹ֔ה וַ/יַּ֖עַשׂ אֶת כָּל מְלַאכְתּֽ/וֹ־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/014.yaml
  text: He was the son of a widow from the tribe of Naphtali[a], and his father was a man of Tyre, a worker in bronze. He was filled with wisdom, understanding, and knowledge to do every kind of work in bronze[b]. So he came to King Solomon and did all his work.
translation:
  language: tl
  text: Anak siya ng isang balo mula sa lipi ni Neftali, at ang kanyang ama ay isang lalaking taga-Tiro[a], isang manggagawa sa bronse. Puspos siya ng karunungan, pang-unawa, at kaalaman upang gawin ang bawat uri ng gawain sa bronse[b]. Kaya pumunta siya kay Haring Solomon at ginawa niya ang lahat ng kanyang gawain.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “isang lalaking mula sa Tiro.”
    reason: lexical_alternative
  - marker: b
    text: Ang salitang Hebreo na neḥoshet ay maaaring tumukoy sa purong tanso o sa bronse; mas angkop dito ang “bronse” dahil sa konteksto ng mga kagamitang ginawa para sa templo.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אִשָּׁה אַלְמָנָה
  choice: Anak siya ng isang balo
  rationale: Likas at malinaw na Filipino ito, at pinananatili ang diin ng Hebreo sa kalagayan ng kanyang ina bilang balo.
- source_word: מִמַּטֵּה נַפְתָּלִי
  choice: mula sa lipi ni Neftali
  rationale: Sa kontekstong etniko at angkan, ang מַטֶּה ay tumutukoy sa isang lipi ng Israel.
- source_word: אִישׁ צֹרִי
  choice: isang lalaking taga-Tiro
  rationale: Ang צֹרִי ay katawagang heograpiko para sa taong mula sa Tiro; malinaw at natural sa Filipino ang “taga-Tiro.”
- source_word: חֹרֵשׁ נְחֹשֶׁת
  choice: isang manggagawa sa bronse
  rationale: Ang חֹרֵשׁ ay bihasang manggagawa o artesano. Ang “manggagawa sa bronse” ay natural at hindi labis na nagpapakahulugan sa tiyak na paraan ng paggawa.
- source_word: וַיִּמָּלֵא
  choice: Puspos siya
  rationale: 'Pinananatili nito ang pasibong diwa ng Hebreo: ang mga kakayahan ay ipinagkaloob o taglay niya, hindi basta sariling natamo.'
- source_word: הַחָכְמָה וְאֶת הַתְּבוּנָה וְאֶת הַדַּעַת
  choice: karunungan, pang-unawa, at kaalaman
  rationale: Pinananatili ang tatlong magkakaugnay ngunit magkakaibang kakayahan para sa masining at teknikal na gawain.
- source_word: לַעֲשׂוֹת כָּל מְלָאכָה בַּנְּחֹשֶׁת
  choice: upang gawin ang bawat uri ng gawain sa bronse
  rationale: Ipinahahayag ng “bawat uri” ang lawak ng כָּל מְלָאכָה, habang tinutukoy ng “sa bronse” ang materyal ng kanyang gawain.
- source_word: וַיָּבוֹא אֶל הַמֶּלֶךְ שְׁלֹמֹה
  choice: Kaya pumunta siya kay Haring Solomon
  rationale: Ang “kaya” ay natural na nag-uugnay sa pagkakaroon niya ng kakayahan at sa pagpunta niya sa hari, habang pinananatili ang pagsulong ng salaysay.
- source_word: וַיַּעַשׂ אֶת כָּל מְלַאכְתּוֹ
  choice: at ginawa niya ang lahat ng kanyang gawain
  rationale: Malapit ito sa Hebreo at hindi nagdaragdag ng ideya ng pagkumpleto o ng pormal na pag-aatas na hindi tahasang sinabi.
theological_decisions:
- issue: Pinagmulan ng pagkakapuspos sa karunungan, pang-unawa, at kaalaman
  choice: Hindi tahasang pinangalanan kung sino ang nagpuno sa kanya
  alternative: Idagdag na ang Diyos ang nagpuno sa kanya
  rationale: Pasibo ang pandiwa sa Hebreo at walang tahasang binanggit na gumagawa. Pinananatili ng salin ang pahiwatig nang hindi nagdaragdag ng paksa.
- issue: Tinutukoy ng hulaping panlalaki sa “kanyang gawain”
  choice: Panatilihin ang karaniwang pagbasa na tumutukoy ito sa gawain ng manggagawa, ngunit huwag dagdagan ng “iniatas” o “tinapos”
  alternative: Tukuyin itong gawain para kay Solomon o gawaing iniatas sa kanya
  rationale: Ang hulapi ay maaaring magbunga ng bahagyang kalabuan sa antas ng gramatika, bagaman pinakamalapit sa daloy ng pangungusap ang manggagawang dumating kay Solomon. Ang payak na “kanyang gawain” ang hindi labis na nagpapasiya.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “puspos” bilang pamilyar ngunit dignified na pananalita, at “bronse” para sa mas tiyak na materyal sa konteksto. Inilagay ang mga panandang [a] at [b] sa mismong mga salitang nililinaw ng mga talababa.
