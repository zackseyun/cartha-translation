  naturalness: Ang “kasya sa apatnapung bat” ay hindi gaanong likas para sa hayag na paglalarawan ng kapasidad; mas malinaw ang “may kapasidad na apatnapung bat.” Ang “May tig-isang palanggana sa bawat isa sa sampung patungan” ay mas tuwiran at natural kaysa “Tig-iisang palanggana ang nakapatong...,” habang pinananatili ang relasyong lokatibo at distributibo.
  terminology: Ang “palanggana,” “bronse,” “bat,” “siko,” at “patungan” ay angkop sa modernong Filipino Tagalog at sa kontekstong pangkagamitang templo. Ang “bat” ay maayos na ipinaliwanag sa talababa.
