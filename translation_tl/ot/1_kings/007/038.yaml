base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/038.yaml
  text: He made ten bronze basins[a]. Each basin held forty baths, and each basin was four cubits across[c][b]. One basin stood on each of the ten stands.
translation:
  language: tl
  text: Gumawa siya ng sampung palangganang bronse. Ang bawat palanggana ay may kapasidad na apatnapung bat[a] at may sukat na apat na siko[b]. May tig-isang palanggana sa bawat isa sa sampung patungan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “bat” ay isang Hebreong yunit ng panukat sa likido.
    reason: cultural_note
  - marker: b
    text: Hindi tahasang sinasabi ng Hebreo kung ang apat na siko ay lapad o diyametro ng palanggana.
    reason: source_ambiguity
lexical_decisions:
- source_word: כִיֹּרוֹת
  choice: mga palanggana
  rationale: Tumutukoy sa malalaking sisidlang hugasan sa mga kagamitan ng templo. Karaniwan at madaling maunawaan ang “palanggana” sa modernong Filipino.
- source_word: נְחֹשֶׁת
  choice: bronse
  rationale: Sa konteksto ng mga kagamitan ng templo, karaniwang tumutukoy ito sa metal o haluang metal na isinasaling “bronse.”
- source_word: בַּת
  choice: bat
  rationale: Pinanatili ang Hebreong yunit ng panukat sa likido upang maiwasan ang huwad na eksaktong conversion; ipinaliwanag ito sa talababa.
- source_word: יָכִיל
  choice: kasya sa
  rationale: Ipinahihiwatig ng pandiwa ang kapasidad ng sisidlan. Likas sa Filipino ang “kasya sa” sa ganitong paglalarawan.
- source_word: אַרְבַּע בָּאַמָּה
  choice: may sukat na apat na siko
  rationale: Apat na siko lamang ang tahasang sinasabi ng Hebreo at hindi nito tinutukoy kung aling dimensiyon. Pinananatili ng salin ang kakulangang iyon sa pagtukoy.
- source_word: מְכוֹנָה
  choice: patungan
  rationale: Tumutukoy ito sa mga suportang estrukturang inilalarawan sa konteksto. Malinaw ang gamit ng “patungan” nang hindi nagdaragdag sa talata ng detalyeng hindi nito tahasang inuulit.
- source_word: כִּיּוֹר אֶחָד עַל הַמְּכוֹנָה הָאַחַת לְעֶשֶׂר הַמְּכֹנוֹת
  choice: Tig-iisang palanggana ang nakapatong sa bawat isa sa sampung patungan
  rationale: 'Ginagawang malinaw sa natural na Filipino ang distributibong diwa: isang palanggana para sa bawat patungan, sampu lahat.'
