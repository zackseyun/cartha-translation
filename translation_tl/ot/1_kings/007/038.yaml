translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “palanggana,” “bronse,” at “patungan” bilang madaling maunawaang mga katawagan. Pinanatili ang “bat” at “siko” bilang sinaunang yunit, at hindi tinukoy sa pangunahing teksto ang dimensiyong hindi tahasang binanggit ng Hebreo.
