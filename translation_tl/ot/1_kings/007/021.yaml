  text: וַ/יָּ֨קֶם֙ אֶת הָֽ/עַמֻּדִ֔ים לְ/אֻלָ֖ם הַֽ/הֵיכָ֑ל וַ/יָּ֜קֶם אֶת הָ/עַמּ֣וּד הַ/יְמָנִ֗י וַ/יִּקְרָ֤א אֶת שְׁמ/וֹ֙ יָכִ֔ין וַ/יָּ֨קֶם֙ אֶת הָ/עַמּ֣וּד הַ/שְּׂמָאלִ֔י וַ/יִּקְרָ֥א אֶת שְׁמ֖/וֹ בֹּֽעַז־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/021.yaml
  text: He set up the pillars at the portico of the temple[a]. He set up the right pillar and called its name Jachin; then he set up the left pillar and called its name Boaz.
translation:
  language: tl
  text: Itinayo niya ang mga haligi sa portiko ng templo.[a] Itinayo niya ang haligi sa kanan at pinangalanan itong Jakin; pagkatapos, itinayo niya ang haligi sa kaliwa at pinangalanan itong Boaz.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Jakin at Boaz ay mga transliterasyon ng Hebreong pangalan ng mga haligi, hindi mga salin ng posibleng kahulugan ng mga ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֶם
  choice: itinayo
  rationale: Sa Hiphil, nangangahulugan itong ‘patayuin’ o ‘ilagay nang nakatayo.’ Ang “itinayo” ay natural sa Filipino at angkop sa paglalagay ng malalaking haligi.
- source_word: הָעַמֻּדִים
  choice: mga haligi
  rationale: Ang עַמּוּד ay tumutukoy sa mga haligi o kolum; “haligi” ang karaniwan at malinaw na salitang Filipino sa konteksto ng templo.
- source_word: לְאֻלָם הַהֵיכָל
  choice: sa portiko ng templo
  rationale: Ang אוּלָם ay ang beranda o portiko sa harap ng gusali ng templo. Dito, natural na unawain ang לְ bilang lokatibo, kaya “sa portiko.”
- source_word: הָעַמּוּד הַיְמָנִי
  choice: ang haligi sa kanan
  rationale: Literal na tumutukoy ang יְמָנִי sa kanang panig. Pinananatili ng salin ang relatibong direksiyon nang hindi ito ginagawang tiyak na direksiyong heograpikal.
- source_word: וַיִּקְרָא אֶת שְׁמוֹ
  choice: pinangalanan itong
  rationale: Ang literal na Hebreong idyoma ay ‘tinawag ang pangalan nito,’ ngunit “pinangalanan itong” ang natural at tumpak na katumbas sa modernong Filipino.
- source_word: יָכִין
  choice: Jakin
  rationale: Pangalan ito ng haligi at tinutumbasan sa baybay na madaling basahin sa Filipino, hindi isinasalin ang posibleng kahulugan nito.
- source_word: הָעַמּוּד הַשְּׂמָאלִי
  choice: ang haligi sa kaliwa
  rationale: Ang שְׂמָאלִי ay nangangahulugang nasa kaliwang panig; natural itong kaparis ng “haligi sa kanan.”
- source_word: בֹּעַז
  choice: Boaz
  rationale: Pangalan ito ng haligi; pinananatili ang kinagawiang anyong “Boaz” sa Filipino.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “portiko” bilang maikli at tumpak na tawag sa harapang bahaging may bubong ng templo; pinanatili ang kanan/kaliwa sa halip na magtakda ng mga direksiyong heograpikal.
