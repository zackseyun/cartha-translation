translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang mga karaniwang katawagan para sa mga kagamitan, habang inilagay sa mga talababa ang teknikal o tradisyonal na mga alternatibo. Inayos nang bahagya ang appositional na sintaks ng Hebreo upang maging natural sa Filipino nang hindi binabago ang pagkakaiba ng panloob na silid at pangunahing bulwagan.
