base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/050.yaml
  text: and the basins[a], the snuffers, the bowls, the cups, and the firepans, of pure gold; and the hinges for the doors of the inner house, for the Most Holy Place, and for the doors of the house, that is, the nave[d][c][b], of gold.
translation:
  language: tl
  text: at ang mga palanggana, mga panggupit ng mitsa, mga mangkok[a], mga tasa, at mga sisidlan para sa nagbabagang uling—pawang yari sa purong ginto; gayundin ang mga kabit[b] na ginto para sa mga pinto ng panloob na silid ng templo, na siyang Pinakabanal na Lugar[c], at para sa mga pinto ng pangunahing bulwagan ng templo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga mangkok na pangwisik.”
    reason: lexical_alternative
  - marker: b
    text: Malamang na mga puwesto o piyesang pinaiikutan ng patayong pivot ng pinto ang tinutukoy, hindi mga makabagong bisagra.
    reason: cultural_note
  - marker: c
    text: 'Tradisyonal na salin: “Banal ng mga Banal.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַסִּפּוֹת
  choice: mga palanggana
  rationale: Sa talaan ng mga kagamitan sa templo, tumutukoy ito sa isang sisidlan o palanggana. Naiiba ito sa מִזְרָקוֹת na isinaling “mga mangkok.”
- source_word: הַמְזַמְּרוֹת
  choice: mga panggupit ng mitsa
  rationale: Bagaman maaaring tumukoy ang salitang-ugat sa panggupit ng halaman, sa konteksto ng santuwaryo ay kagamitan ito sa paggupit o pag-aayos ng mitsa ng ilawan.
- source_word: הַמִּזְרָקוֹת
  choice: mga mangkok
  rationale: Ito ay mga sisidlang ginagamit sa ritwal, malamang para sa paghawak o pagwisik ng likido. Ang “mga mangkok” ay malinaw at hindi labis na nagpapakipot sa gamit.
- source_word: הַכַּפּוֹת
  choice: mga tasa
  rationale: Tumutukoy ang pangngalan sa maliliit at malukong na sisidlan. Pinananatili ng “mga tasa” ang anyo nang hindi tiyak na ginagawang kutsara o insensaryo.
- source_word: הַמַּחְתּוֹת
  choice: mga lalagyan ng baga
  rationale: Tumutukoy ito sa mga sisidlan o kawaling ginagamit sa pagdadala ng nagbabagang uling. Mas malinaw ito sa karaniwang mambabasa kaysa sa teknikal na katawagan.
- source_word: זָהָב סָגוּר
  choice: purong ginto
  rationale: Ang parirala ay tumutukoy sa mataas na uri o pinong ginto; natural at tumpak sa Filipino ang “purong ginto.”
- source_word: הַפֹּתוֹת
  choice: mga kabit
  rationale: Tumutukoy ito sa mga piyesang kinasasandalan o iniikutan ng mga pinto, marahil mga pivot-socket. Ang malawak na “mga kabit” ay umiiwas sa maling larawan ng makabagong bisagra, habang nililinaw sa talababa ang posibleng anyo.
- source_word: הַבַּיִת הַפְּנִימִי
  choice: panloob na silid ng templo
  rationale: Sa konteksto, ang “panloob na bahay” ay ang pinakaloob na silid ng templo. Ang saling ito ay likas sa Filipino at pinananatili ang kaibahan nito sa pangunahing bulwagan.
- source_word: לְקֹדֶשׁ הַקֳּדָשִׁים
  choice: ang Pinakabanal na Lugar
  rationale: Inihahayag nito nang malinaw ang Hebreong superlatibong parirala nang hindi ginagamit ang di-likas na literal na anyo.
- source_word: לְדַלְתֵי הַבַּיִת לַהֵיכָל
  choice: para sa mga pinto ng pangunahing bulwagan ng templo
  rationale: Ang הֵיכָל dito ay ang malaking pangunahing silid ng templo, na naiiba sa pinakaloob na santuwaryo. Malinaw sa modernong Filipino ang “pangunahing bulwagan.”
- source_word: זָהָב
  choice: mga kabit na ginto
  rationale: Muling tinutukoy ng panghuling “ginto” ang materyal ng mga kabit ng pinto; natural na isinama ito sa pariralang Filipino.
