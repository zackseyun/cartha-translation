  text: וַ/יִּ֜בֶן אֶת בֵּ֣ית יַ֣עַר הַ/לְּבָנ֗וֹן מֵאָ֨ה אַמָּ֤ה אָרְכּ/וֹ֙ וַ/חֲמִשִּׁ֤ים אַמָּה֙ רָחְבּ֔/וֹ וּ/שְׁלֹשִׁ֥ים אַמָּ֖ה קוֹמָת֑/וֹ עַ֗ל אַרְבָּעָה֙ טוּרֵי֙ עַמּוּדֵ֣י אֲרָזִ֔ים וּ/כְרֻת֥וֹת אֲרָזִ֖ים עַל הָ/עַמּוּדִֽים־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/002.yaml
  text: He built the House of the Forest of Lebanon[a], one hundred cubits long, fifty cubits wide, and thirty cubits high, on four rows of cedar pillars[c][b], with cedar beams on the pillars.
translation:
  language: tl
  text: Itinayo niya ang Bahay ng Gubat ng Lebanon, na isang daang siko ang haba, limampung siko ang lapad, at tatlumpung siko ang taas. Nakatayo ito sa apat na hanay ng mga haliging sedro[a], at may mga bigang sedro[b] sa ibabaw ng mga haligi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “may apat na hanay ng mga haliging sedro”; ang pang-ukol sa Hebreo ay maaaring tumukoy sa kinatatayuan o suporta (“sa ibabaw ng”) o sa pagkakaayos (“may”).
    reason: lexical_alternative
  - marker: b
    text: Ang salitang Hebreo ay literal na tumutukoy sa “mga pinutol” na piraso ng sedro; maaaring mga biga, tahilan, o iba pang tinabas na bahaging panggusali ang tinutukoy.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶן
  choice: Itinayo niya
  rationale: Ang waw-consecutive ay nagpapatuloy sa salaysay at natural na isinasalin sa payak na naganap na kilos; hindi kailangang panatilihin ang panimulang “At” sa modernong Tagalog.
- source_word: בֵּית יַעַר הַלְּבָנוֹן
  choice: ang Bahay ng Gubat ng Lebanon
  rationale: Pinananatili ang literal na “bahay” at ang anyo ng pangalan ng gusali, sa halip na tukuyin itong “palasyo,” sapagkat hindi tahasang sinasabi rito ng Hebreo ang gamit nito.
- source_word: מֵאָה אַמָּה אָרְכּוֹ וַחֲמִשִּׁים אַמָּה רָחְבּוֹ וּשְׁלֹשִׁים אַמָּה קוֹמָתוֹ
  choice: isang daang siko ang haba, limampung siko ang lapad, at tatlumpung siko ang taas
  rationale: Natural itong paraan ng paglalahad ng mga sukat sa Tagalog at pinananatili ang sinaunang yunit na “siko” nang hindi gumagawa ng di-tiyak na modernong conversion.
- source_word: עַל אַרְבָּעָה טוּרֵי עַמּוּדֵי אֲרָזִים
  choice: Nakatayo ito sa apat na hanay ng mga haliging sedro
  rationale: Ang טוּרֵי ay mga hanay at ang עַמּוּדִים ay mga haligi. Ipinahihiwatig ng עַל na ang gusali ay nakapatong o nakasalalay sa mga hanay, ngunit inilalahad sa talababa ang posibleng kahulugang pagsasaayos.
- source_word: וּכְרֻתוֹת אֲרָזִים עַל הָעַמּוּדִים
  choice: at may mga bigang sedro sa ibabaw ng mga haligi
  rationale: Ang כְרֻתוֹת ay literal na mga pinutol o tinabas na piraso. Sa kontekstong panggusali, ang “mga biga” ang malinaw at malamang na katumbas, habang pinananatili sa talababa ang leksikal na di-katiyakan.
