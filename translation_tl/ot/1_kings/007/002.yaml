translation_notes:
  register: Gumamit ng moderno, malinaw, at marangal na Tagalog. Itinuring na pantanging pangalan ng gusali ang “Bahay ng Gubat ng Lebanon.” Pinanatili ang “siko” bilang yunit sa Bibliya at ang “sedro” bilang karaniwang katawagang Filipino sa cedar.
