base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/039.yaml
  text: He placed five stands on the right side of the house and five on the left side of the house[a], and he placed the Sea on the southeast side of the house.
translation:
  language: tl
  text: Inilagay niya ang limang patungan sa kanang panig ng Templo at limang patungan sa kaliwang panig nito. Inilagay din niya ang Dagat sa gawing kanan ng Templo, sa dakong silangan, katapat ng timog.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang siksik na paglalarawan sa Hebreo ay maaaring maunawaan bilang lokasyon sa timog-silangang panig ng Templo.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמְּכֹנוֹת
  choice: mga patungan
  rationale: Tumutukoy ito sa mga de-gulong na estrukturang tanso na pinapatungan ng mga palanggana. Ang “mga patungan” ay malinaw at hindi labis na nagtatakda kung tatawagin itong kariton o simpleng base.
- source_word: כֶּתֶף
  choice: panig
  rationale: Literal itong “balikat,” ngunit sa paglalarawan ng gusali ay nangangahulugang gilid o panig.
- source_word: הַבַּיִת
  choice: Templo
  rationale: Bagaman literal na “bahay,” malinaw sa konteksto na ang gusaling tinutukoy ay ang Templo. Mas likas at malinaw ito sa modernong Tagalog.
- source_word: מִיָּמִין / מִשְּׂמֹאלוֹ
  choice: sa kanang panig / sa kaliwang panig
  rationale: Pinananatili ang orihinal na paglalarawang nakabatay sa kanan at kaliwa sa halip na agad itong gawing mga direksiyon ng kompas.
- source_word: הַיָּם
  choice: ang Dagat
  rationale: Ito ang katawagan sa malaking hinulmang imbakan ng tubig sa bakuran ng Templo; ang malaking titik ay nagpapakitang pangalan ito ng isang kagamitang panrelihiyon, hindi likas na dagat.
- source_word: הַיְמָנִית קֵדְמָה מִמּוּל נֶגֶב
  choice: sa gawing kanan ng Templo, sa dakong silangan, sa tapat ng timog
  rationale: Pinananatili ang siksik at medyo di-tiyak na pagkakasunod-sunod ng mga pahiwatig sa lokasyon sa Hebreo, sa halip na tahimik itong ibuod bilang “timog-silangan.”
theological_decisions: []
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “Templo” para sa kalinawan ng konteksto, habang pinanatili sa pangunahing teksto ang mga salitang kanan, silangan, at timog upang hindi maitago ang anyo at posibleng tensiyon ng orihinal na paglalarawang heograpikal.
