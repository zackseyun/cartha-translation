- from: Inilagay niya ang lima sa mga patungan sa kanang panig ng Templo at ang lima naman sa kaliwang panig nito. Inilagay din niya ang Dagat sa gawing kanan ng Templo, sa dakong silangan, sa tapat ng timog.[a]
  to: Inilagay niya ang limang patungan sa kanang panig ng Templo at limang patungan sa kaliwang panig nito. Inilagay din niya ang Dagat sa gawing kanan ng Templo, sa dakong silangan, katapat ng timog.[a]
  rationale: Inayos ang ayos ng bilang at isang pariralang panglokasyon upang maging likas na modernong Filipino. Pinanatili ang kanan, silangan, at timog sa pangunahing teksto upang hindi takpan ang siksik at bahagyang pinagtatalunang spatial na paglalarawan ng Hebreo; inilalagay sa talababa ang pag-unawang “timog-silangan.”
