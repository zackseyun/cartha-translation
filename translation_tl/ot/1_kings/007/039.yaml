  - severity: low
    issue: Medyo di-likas ang “sa tapat ng timog.”
    rationale: Ang “katapat ng timog” ay mas idiomatiko sa Filipino para sa spatial na parirala, at nananatiling hindi labis na tiyak ang mahirap na Hebreong parirala.
