base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/033.yaml
  text: The workmanship of the wheels was like the workmanship of a chariot wheel[a]; their axles, their rims, their spokes[b], and their hubs were all cast metal.
translation:
  language: tl
  text: Ang pagkakayari ng mga gulong ay gaya ng pagkakayari ng gulong ng karwahe; ang mga ehe, mga rim, mga rayos,[b] at mga sentro ng mga gulong ay pawang hinulma sa metal.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga hawakan” o “mga suporta” para sa “mga ehe.” Ang salitang Hebreo ay literal na kaugnay ng “mga kamay,” ngunit sa konteksto ng gulong ay malamang na tumutukoy sa mga ehe o kaugnay na pansuportang bahagi.
    reason: lexical_alternative
  - marker: b
    text: O “mga bigkis” para sa “mga rayos”; ang salitang isinaling “mga sentro” ay maaari ring tumukoy sa mga tukod o kabit. Bihira ang dalawang terminong Hebreo, kaya hindi tiyak ang eksaktong teknikal na kahulugan ng mga ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַעֲשֵׂה
  choice: pagkakayari
  rationale: Tumutukoy sa anyo at paraan ng pagkakagawa; natural at marangal sa modernong Filipino.
- source_word: הָאֹפַנִּים / אוֹפַן
  choice: mga gulong / gulong
  rationale: Karaniwang kahulugan ng salitang Hebreo at angkop sa paglalarawan ng mga bahagi ng patungan.
- source_word: כְּמַעֲשֵׂה
  choice: ay gaya ng pagkakayari ng
  rationale: Pinananatili ang tahasang paghahambing na ipinahihiwatig ng prefiks na כְּ.
- source_word: הַמֶּרְכָּבָה
  choice: karwahe
  rationale: Tumutukoy sa sinaunang sasakyang hila ng kabayo; ang 'karwahe' ay malinaw at angkop sa kontekstong biblikal.
- source_word: יְדוֹתָם
  choice: mga ehe nito
  rationale: Bagaman literal na kaugnay ng 'mga kamay,' sa konteksto ng gulong ay malamang na tumutukoy sa mga ehe o bahaging sumusuporta rito.
- source_word: גַבֵּיהֶם
  choice: mga gilid
  rationale: Sa talaan ng mga bahagi ng gulong, tumutukoy ito sa panlabas na bilog o rim; 'mga gilid' ang madaling maunawaan sa Filipino.
- source_word: חִשֻּׁקֵיהֶם
  choice: mga rayos
  rationale: Malamang na tumutukoy sa mga bahaging nag-uugnay sa sentro at panlabas na gilid ng gulong; pinananatili sa talababa ang kawalang-katiyakan ng teknikal na termino.
- source_word: חִשֻּׁרֵיהֶם
  choice: mga sentro
  rationale: Bihirang teknikal na salita na sa konteksto ay malamang na tumutukoy sa sentrong piyesa o hub ng gulong.
- source_word: הַכֹּל
  choice: pawang
  rationale: Likas na panlahatang pahayag sa Filipino na sumasaklaw sa lahat ng nakalistang bahagi.
- source_word: מוּצָק
  choice: hinulmang metal
  rationale: Ipinahihiwatig ng anyong pasibo mula sa יצק na ang mga bahagi ay ginawang metal sa pamamagitan ng pagbubuhos sa hulma.
