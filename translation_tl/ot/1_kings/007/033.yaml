translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang mga karaniwang salitang teknikal na 'ehe' at 'rayos,' habang ang mga tunay na di-tiyak na kahulugan ng bihirang mga terminong Hebreo ay pinanatili sa mga talababa.
