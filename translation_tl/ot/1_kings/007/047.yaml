lexical_decisions:
- source_word: וַיַּנַּח
  choice: hindi na ipinabilang ... sa timbang
  rationale: Sa konteksto, ipinahihiwatig ng pandiwa na itinigil o hindi na ipinagawa ni Solomon ang pagtitimbang. Ginagawang malinaw ng salin ang gawaing hindi na itinuloy, ayon sa kasunod na pahayag tungkol sa bigat.
- source_word: כָּל הַכֵּלִים
  choice: ang lahat ng kagamitang iyon
  rationale: Malawak ang saklaw ng כֵּלִים at tumutukoy rito sa mga kagamitang kaugnay ng templo; natural at sapat na malawak ang “mga kagamitan” sa Filipino.
- source_word: מֵרֹב מְאֹד מְאֹד
  choice: dahil napakarami ng mga iyon
  rationale: Ipinapahayag ng מִן ang dahilan, at matinding diin ang dobleng מְאֹד. Likas na naihahatid ng “napakarami” ang diin sa dami.
- source_word: לֹא נֶחְקַר
  choice: hindi natukoy
  rationale: Ang Niphal ng חקר ay tumutukoy sa hindi pagtiyak o hindi pag-alam matapos siyasatin o kalkulahin. Sa konteksto ng timbang, tuwirang ipinahahayag ng “hindi natukoy” ang resulta.
- source_word: מִשְׁקַל
  choice: ang bigat
  rationale: Ito ang tuwiran at natural na katumbas ng pangngalang tumutukoy sa timbang o dami ayon sa timbang.
- source_word: הַנְּחֹשֶׁת
  choice: ang tanso
  rationale: Ang נְחֹשֶׁת sa mga kagamitang pangtemplo ay karaniwang bronze. Sa pangkaraniwang modernong Filipino, “tanso” ang nakagawiang katawagan, bagaman maaari rin itong tumukoy sa copper.
