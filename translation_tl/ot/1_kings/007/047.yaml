  naturalness: Hindi idiomatiko sa modernong Filipino ang “ipinabilang ... sa timbang.” Ang “nang hindi tinitimbang” ay malinaw, maikli, at angkop sa marangal na rehistro. Mas karaniwan rin ang “mga ito” kaysa sa paulit-ulit na “mga iyon” kapag tumutukoy sa kagagamit lamang na binanggit.
  terminology: Mas tumpak ang “bronse” para sa נְחֹשֶׁת sa kontekstong ito, alinsunod sa pinagmulang teksto at English POB audit trail. Ang “tanso” sa modernong Filipino ay mas pangunahing tumutukoy sa copper at maaaring lumabo ang pagkakaiba.
