  text: Solomon built his own house for thirteen years[a], and he finished all his house.
translation:
  language: tl
  text: Itinayo ni Solomon ang sarili niyang bahay sa loob ng labintatlong taon, at natapos niya ang buong bahay niya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “palasyo.” Ang salitang Hebreo para sa “bahay” ay maaaring tumukoy rito sa tirahan ng hari o sa kompleks ng palasyo.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּיתוֹ
  choice: sarili niyang bahay
  rationale: Karaniwang nangangahulugang “bahay” ang בַּיִת, ngunit sa kontekstong maharlika maaari itong tumukoy sa tirahan ng hari o sa kabuuang kompleks ng palasyo. Pinananatili ng “bahay” ang salita at lawak ng Hebreo, samantalang ipinahihiwatig ng “sarili niyang” ang paghahambing sa naunang pagtatayo ng templo.
- source_word: בָּנָה
  choice: itinayo
  rationale: Ang Qal perfect 3ms ay nagsasaad dito ng payak na nakaraang pagkilos. Natural sa Filipino ang “itinayo” para sa pagtatayo ng isang gusali.
- source_word: שְׁלֹשׁ עֶשְׂרֵה שָׁנָה
  choice: Labintatlong taon ... na
  rationale: Ipinahahayag ng parirala ang tagal ng proyekto. Ang hulmaing “Labintatlong taon na itinayo” ay natural at malinaw sa modernong Filipino.
- source_word: וַיְכַל
  choice: natapos niya
  rationale: Ang wayyiqtol mula sa כלה ay nagpapasulong sa salaysay at nagsasaad na dinala ni Solomon sa katapusan ang proyekto.
- source_word: כָּל בֵּיתוֹ
  choice: ang buong bahay
  rationale: Ang כָּל ay nagsasaad ng kabuuan. Pinananatili ng “buong bahay” ang leksikal na ugnayan sa unang בֵּיתוֹ at maaaring saklawin ang buong tirahan o kompleks.
- source_word: וְאֶת
  choice: '[ipinahayag sa ayos ng pangungusap at sa “sarili niyang”]'
  rationale: Ang וְ kasama ng pananda sa layon ay nagbubukas ng kaugnay ngunit kontrastibong paksa pagkatapos ng ulat tungkol sa templo. Hindi kailangang tumbasan nang hiwalay sa Filipino; naihahatid ang puwersa nito sa ayos ng pangungusap at sa “sarili niyang.”
