  text: the two pillars[a], and the two bowls of the capitals that were on the tops of the pillars, and the two latticeworks to cover the two bowls of the capitals that were on the tops of the pillars[c][b];
translation:
  language: tl
  text: ang dalawang haligi, ang dalawang bilugang bahagi[a] ng mga kapitel[b] na nasa tuktok ng mga haligi, at ang dalawang sala-sala[c] na pantakip sa dalawang bilugang bahagi ng mga kapitel na nasa tuktok ng mga haligi;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga globong bahagi” o “mga bahaging hugis-mangkok.” Tumutukoy ang salitang Hebreo sa mga bilugang bahagi ng mga kapitel, ngunit hindi tiyak ang eksaktong hugis ng mga ito.
    reason: lexical_alternative
  - marker: b
    text: Ang “kapitel” ay ang pandekorasyong bahaging nasa tuktok ng isang haligi.
    reason: lexical_clarification
  - marker: c
    text: O “mga kayariang parang lambat.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עַמֻּדִים
  choice: mga haligi
  rationale: Karaniwang katawagang pang-arkitektura sa Filipino at angkop sa dalawang malalaking haligi ng templo.
- source_word: גֻלֹּת
  choice: mga bilugang bahagi
  rationale: Tumutukoy sa mga bilog o malamang na hugis-mangkok na bahagi ng kapitel; pinananatili ng pangkalahatang paglalarawan ang kawalang-katiyakan sa eksaktong anyo.
- source_word: כֹּתָרֹת
  choice: mga kapitel
  rationale: Teknikal ngunit ginagamit na katawagang pang-arkitektura para sa pandekorasyong bahaging nasa itaas ng haligi; mas tiyak kaysa literal na 'mga korona.'
- source_word: רֹאשׁ
  choice: tuktok
  rationale: Likas na katumbas sa kontekstong pang-arkitektura ng literal na 'ulo.'
- source_word: שְּׂבָכוֹת
  choice: mga sala-sala
  rationale: Malinaw at likas na Filipino para sa palamuting anyong lambat o magkakrus na balangkas.
- source_word: לְכַסּוֹת
  choice: na pantakip
  rationale: Ipinahahayag ang layunin ng infinitibo at umaangkop sa anyo ng isang talaan.
- source_word: שְׁנַיִם / שְׁתָּיִם / שְׁתֵּי
  choice: dalawa / dalawang
  rationale: Pinananatili ang paulit-ulit na bilang na bumubuo sa talaan.
- source_word: אֲשֶׁר עַל רֹאשׁ הָעַמּוּדִים
  choice: na nasa tuktok ng mga haligi
  rationale: Tumpak at natural na paglalahad ng lokasyon, habang pinananatili ang pag-uulit ng Hebreo.
