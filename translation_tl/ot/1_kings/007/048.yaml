  text: וַ/יַּ֣עַשׂ שְׁלֹמֹ֔ה אֵ֚ת כָּל הַ/כֵּלִ֔ים אֲשֶׁ֖ר בֵּ֣ית יְהוָ֑ה אֵ֚ת מִזְבַּ֣ח הַ/זָּהָ֔ב וְ/אֶת הַ/שֻּׁלְחָ֗ן אֲשֶׁ֥ר עָלָ֛י/ו לֶ֥חֶם הַ/פָּנִ֖ים זָהָֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/048.yaml
  text: 'And Solomon made all the vessels that were in the house of Yahweh: the golden altar[a], and the table on which was the bread of the Presence[b], of gold.'
translation:
  language: tl
  text: 'Ginawa ni Solomon ang lahat ng kagamitan na nasa bahay ni Yahweh[a]: ang gintong altar at ang gintong mesa na kinalalagyan ng tinapay ng Presensya[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “templo ni Yahweh.” Literal na “bahay ni Yahweh.”
    reason: lexical_alternative
  - marker: b
    text: O “showbread.” Literal na “tinapay ng Presensya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Ginawa
  rationale: Ang עשה ay malawak na pandiwang nangangahulugang “gumawa.” Ang “ginawa” ay tuwiran at natural, nang hindi nagdaragdag kung si Solomon mismo o ang mga manggagawang nasa ilalim niya ang aktuwal na humubog sa mga kagamitan.
- source_word: כָּל הַכֵּלִים
  choice: ang lahat ng kagamitan
  rationale: Maaaring tumukoy ang כֵּלִים sa mga sisidlan, kasangkapan, o iba’t ibang gamit. Dahil kabilang sa talaan ang altar at mesa, mas angkop at masaklaw ang “mga kagamitan” kaysa “mga sisidlan.”
- source_word: בֵּית יְהוָה
  choice: bahay ni Yahweh
  rationale: Pinananatili nito ang literal na larawang “bahay” sa Hebrew at isinasalin ang pangalang יְהוָה bilang “Yahweh.” Ipinaliliwanag sa talababa ang natural na alternatibong “templo ni Yahweh.”
- source_word: מִזְבַּח הַזָּהָב
  choice: gintong altar
  rationale: Ito ang malinaw at natural na katumbas ng pariralang tumutukoy sa altar na yari o nababalutan ng ginto.
- source_word: הַשֻּׁלְחָן אֲשֶׁר עָלָיו
  choice: ang ... mesa na pinaglalagyan
  rationale: Ipinahahayag ng “pinaglalagyan” ang lokatibong diwa ng “na nasa ibabaw nito” sa natural na modernong Tagalog.
- source_word: לֶחֶם הַפָּנִים
  choice: tinapay ng Presensya
  rationale: Pinananatili nito ang natatanging panrelihiyong katawagan at ang diwa ng tinapay na inilalagay sa banal na presensya, sa halip na gumamit ng tradisyonal ngunit hindi gaanong malinaw na hiram na termino.
- source_word: זָהָב
  choice: gintong mesa
  rationale: Ang huling זָהָב ay tumutukoy sa mesa. Inilagay ang “gintong” bago ang “mesa” upang maging malinaw at natural sa Tagalog.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Tahasang ginagamit sa teksto ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng isang titulo.
- issue: Kahulugan ng לֶחֶם הַפָּנִים
  choice: tinapay ng Presensya
  alternative: tinapay na handog; tinapay na nasa harap ng Diyos
  rationale: Hindi tahasang binabanggit sa parirala ang “handog” o “Diyos.” Ang mas literal na anyo ay nagpapanatili sa sagradong terminolohiya at sa bahagyang tensiyon ng Hebrew, habang nililinaw ng talababa ang gamit nito.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “kagamitan” bilang masaklaw na tawag sa mga bagay sa templo, at inayos ang huling “ginto” bilang panuring sa mesa upang maiwasan ang kalituhan.
