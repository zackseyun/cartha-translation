  text: And on the top of the pillars was lily-work[b][a], and the work of the pillars was finished.
translation:
  language: tl
  text: Sa tuktok ng mga haligi ay may palamuting hugis-liryo[a], at natapos ang pagkakagawa ng mga haligi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “palamuting liryo” o “disenyong liryo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹאשׁ
  choice: ibabaw
  rationale: Sa kontekstong arkitektural, tumutukoy ito sa itaas na bahagi ng mga haligi. Natural sa modernong Filipino ang “ibabaw” at hindi nito labis na tinutukoy ang teknikal na bahaging tinatawag na kapitel.
- source_word: הָעַמּוּדִים
  choice: mga haligi
  rationale: Karaniwan at malinaw na katumbas ng mga estruktural na pillar o column sa konteksto ng pagtatayo ng templo.
- source_word: מַעֲשֵׂה שׁוֹשָׁן
  choice: palamuting hugis-liryo
  rationale: Ang parirala ay tumutukoy sa gawang pandekorasyon na anyong liryo. Mas natural at malinaw ito sa Filipino kaysa sa literal na “gawang liryo.”
- source_word: וַתִּתֹּם
  choice: natapos
  rationale: Ipinahahayag ng pandiwa mula sa תמם ang pagkakumpleto; ang “natapos” ay tuwiran at natural.
- source_word: מְלֶאכֶת הָעַמּוּדִים
  choice: ang paggawa sa mga haligi
  rationale: Pinananatili nitong malawak ang kahulugan ng מְלָאכָה bilang gawain o pagkakagawa, at maayos na ipinahahayag sa Filipino ang pagkumpleto ng mga haligi at ng dekorasyon ng mga ito.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na natural, malinaw, at marangal. Ginamit ang “palamuting hugis-liryo” upang maipahayag ang ornamental na diwa ng pariralang Hebreo nang hindi gumagamit ng di-natural na literalismo.
