base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/049.yaml
  text: and the lampstands[a], five on the right and five on the left, before the inner sanctuary, of pure gold; and the flowers, the lamps, and the tongs[c][b], of gold.
translation:
  language: tl
  text: at ang mga patungan ng ilawan na yari sa dalisay na ginto[b]—lima sa kanan at lima sa kaliwa—sa harap ng pinakaloob na santuwaryo[a]; at ang mga palamuting hugis-bulaklak, mga ilawan, at mga sipit[c], na yari sa ginto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa harap ng Kabanal-banalang Lugar.” Ang salitang Hebreo ay tumutukoy sa pinakaloob na silid ng templo.
    reason: lexical_alternative
  - marker: b
    text: O “pinadalisay na ginto.”
    reason: lexical_alternative
  - marker: c
    text: O “mga pantabas ng mitsa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מְּנֹרוֹת
  choice: mga patungan ng ilawan
  rationale: Tumutukoy ang salita sa mga tayuang pinaglalagyan ng mga ilawang de-langis, hindi sa mga ilawan mismo; malinaw ito at hindi nagpapahiwatig ng kandila.
- source_word: מִיָּמִין ... מִשְּׂמֹאול
  choice: sa kanan ... sa kaliwa
  rationale: Pinananatili nito ang tahasang pananalitang pangpuwesto ng Hebreo sa halip na ipakahulugang timog at hilaga.
- source_word: לִפְנֵי הַדְּבִיר
  choice: sa harap ng pinakaloob na santuwaryo
  rationale: Ang דְּבִיר ay ang pinakaloob na silid ng templo; likas at malinaw sa modernong Tagalog ang saling ito.
- source_word: זָהָב סָגוּר
  choice: dalisay na ginto
  rationale: Ipinahihiwatig ng parirala ang mataas na uri o pinadalisay na ginto; natural sa Tagalog ang 'dalisay na ginto.'
- source_word: הַפֶּרַח
  choice: mga bulaklak
  rationale: Bagaman isahan ang anyong Hebreo, maaari itong gamiting kolektibo para sa mga palamuting hugis-bulaklak ng mga patungan.
- source_word: הַנֵּרֹת
  choice: mga ilawan
  rationale: Ito ang mga indibiduwal na ilawang nakalagay sa mga patungan.
- source_word: הַמֶּלְקַחַיִם
  choice: mga sipit
  rationale: Tumutukoy ito sa kasangkapang pansipit na ginagamit sa pag-aasikaso ng mga ilawan; hindi nito labis na tinutukoy ang eksaktong gamit.
- source_word: זָהָב
  choice: na yari sa ginto
  rationale: Malinaw nitong inilalapat ang materyal sa mga bulaklak, ilawan, at sipit habang pinananatili ang estilong imbentaryo.
