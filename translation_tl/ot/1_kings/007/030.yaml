base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/030.yaml
  text: And the one stand had four bronze wheels and bronze axles[a], and its four corners had supports for them; beneath the basin the supports were cast[c][b], each beside wreathwork.
translation:
  language: tl
  text: Ang bawat patungan ay may apat na gulong na bronse at mga ehe na bronse. Ang apat na paa nito ay may mga balikat[a] na pansuporta. Sa ilalim ng palanggana, ang mga balikat na ito ay hinulma, bawat isa ay katabi ng palamuting tila girnalda[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “mga balikat”; tumutukoy rito sa mga nakausling bahaging sumusuporta sa palanggana.
    reason: lexical_alternative
  - marker: b
    text: Hindi tiyak ang bihirang salitang Hebreo; maaari rin itong tumukoy sa mga girnalda o nakalaylay na palamuti.
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹפַנֵּי נְחֹשֶׁת
  choice: mga gulong na tanso
  rationale: Ang אוֹפַנִּים ay mga gulong. Sa makabagong Filipino, karaniwang tawag ang “tanso” sa metal na tinutukoy ng נְחֹשֶׁת sa mga kasangkapang ito, bagaman maaari itong tumukoy sa bronse.
- source_word: לַמְּכוֹנָה הָאַחַת
  choice: ang bawat patungan
  rationale: Ang מְכוֹנָה ay ang gumugulong na istrukturang sumusuporta sa palanggana. Distributibo ang “bawat” sa paglalarawan sa isang patungan sa bawat pagkakataon.
- source_word: סַרְנֵי נְחֹשֶׁת
  choice: mga ehe na tanso
  rationale: Sa konteksto ng mga gulong, ang סַרְנִים ay pinakamalamang na mga ehe o piyesang ehe.
- source_word: פַעֲמֹתָיו
  choice: apat na sulok nito
  rationale: Bagaman may literal na ugnayan ang salita sa paa o hakbang, dito ay tumutukoy ito sa apat na mababang bahaging kinaroroonan ng mga pansuporta; “mga sulok” ang malinaw na paglalarawang estruktural.
- source_word: כְּתֵפֹת
  choice: mga balikat na pansuporta
  rationale: Literal itong “mga balikat,” ngunit sa kagamitang ito ay mga nakausling bahaging sumusuporta. Pinananatili ng salin ang larawan at nililinaw ang tungkulin.
- source_word: מִתַּחַת לַכִּיֹּר
  choice: sa ilalim ng palanggana
  rationale: Ang כִּיּוֹר ay isang malaking palanggana o hugasan; natural at malinaw ang “palanggana.”
- source_word: יְצֻקוֹת
  choice: hinulmang kasama
  rationale: Ang anyong pasibo mula sa יצק ay tumutukoy sa paghuhulma o pagbubuhos ng metal; ipinahihiwatig ng konteksto na integral ang pagkakahulma sa palamuti.
- source_word: מֵעֵבֶר אִישׁ
  choice: isa sa tabi ng bawat isa
  rationale: Distributibo ang parirala at inilalarawan ang pagkakalagay ng bawat pansuporta kaugnay ng palamuti nang hindi labis na tinutukoy ang heometriya.
- source_word: לֹיוֹת
  choice: mga palamuting tila kuwintas
  rationale: Bihira at hindi tiyak ang terminong ito; malamang na tumutukoy ito sa palamuting nakalaylay o magkakawing gaya ng kuwintas o girnalda.
