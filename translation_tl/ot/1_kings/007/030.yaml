  register: Makabago at dignified na Filipino. Ginamit ang “patungan,” “palanggana,” at “ehe” para sa malinaw na paglalarawan ng estruktura. Pinanatili sa talababa ang literal na “mga balikat” at ang kawalang-katiyakan ng huling terminong pandekorasyon.
