  text: At sa ibabaw ay may mamahaling mga bato[a], tinabas ayon sa sukat, at kahoy na sedro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga mamahaling bato ayon sa mga sukat ng tinabas na bato.”
    reason: Pinananatili ang posibleng mas literal na ugnayan ng כְּמִדּוֹת sa גָּזִית; maaaring tumukoy ang parirala sa mga sukat ng tinabas na bato, hindi lamang sa paraan ng pagtabas.
lexical_decisions:
- source_word: וּמִלְמַעְלָה
  choice: At sa ibabaw
  rationale: Likas na panandang panlarawan sa arkitektura na tumutukoy sa bahaging nasa itaas ng mga patong na naunang binanggit.
- source_word: אֲבָנִים יְקָרוֹת
  choice: mamahaling mga bato
  rationale: Ang יְקָרוֹת ay tumutukoy rito sa mahalaga o mataas ang halagang batong panggusali, hindi kinakailangang mga batong-hiyas.
- source_word: כְּמִדּוֹת גָּזִית
  choice: tinabas ayon sa sukat
  rationale: Pinagsasama nito ang ideya ng mga itinakdang sukat at ng batong tinabas o hinubog para sa pagtatayo, habang nananatiling natural sa Filipino.
- source_word: וָאָרֶז
  choice: at kahoy na sedro
  rationale: Bagaman 'sedro' lamang ang tahasang nasa Hebreo, nilinaw ng 'kahoy' ang materyales na tinutukoy sa kontekstong panggusali.
