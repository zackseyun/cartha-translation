translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “hamba” bilang tiyak ngunit madaling makilalang terminong panggusali. Pinanatili sa pangunahing teksto ang “tatlong ulit” upang hindi tahimik na lutasin ang kalabuan ng Hebreo; ipinaliwanag sa talababa ang posibleng ayos sa tatlong hanay o antas.
