translation:
  language: tl
  text: Ang lahat ng mga bukasan at mga hamba ay may parisukat na balangkas[a], at ang bintana ay katapat ng bintana nang tatlong ulit.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Ang lahat ng bukasan at mga hamba ay may parisukat na mga biga sa itaas.” Maaaring mas partikular na tumukoy ang terminong Hebreo sa itaas na bahagi ng balangkas o sa biga sa ibabaw ng pintuan.
    reason: lexical_alternative
  - marker: b
    text: Literal na “bintana sa tapat ng bintana, tatlong ulit”; maaaring tumukoy ito sa magkakatapat na mga bintanang nakaayos sa tatlong hanay o antas.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּתָחִים
  choice: mga pintuan
  rationale: Tumutukoy ang salita sa mga bukasan o pasukan; natural sa kontekstong panggusali ang “mga pintuan,” na dito ay nangangahulugang mga daanan ng pinto, hindi ang naigagalaw na panel.
- source_word: מְּזוּזוֹת
  choice: mga hamba nito
  rationale: Ang מְזוּזָה ay mga patayong poste o gilid ng pintuan. Ang “hamba” ang tiyak at karaniwang terminong arkitektural sa Filipino.
- source_word: רְבֻעִים
  choice: parisukat
  rationale: Nagsasaad ito ng hugis na may apat na sulok; malinaw at maikli ang “parisukat.”
- source_word: שָׁקֶף
  choice: balangkas
  rationale: Hindi ganap na tiyak ang bihirang terminong arkitektural na ito at maaaring tumukoy nang mas partikular sa itaas na bahagi o biga sa ibabaw ng pintuan. Hindi labis na nililimitahan ng “balangkas” ang kahulugan.
- source_word: מ֧וּל מֶחֱזָ֛ה אֶל מֶחֱזָ֖ה
  choice: magkakatapat ang mga bintana
  rationale: Ipinahahayag ng מוּל ang pagkakatapat, at sa paglalarawan ng gusali, pinakamalamang na bintana o bukasang tanawan ang מֶחֱזָה.
- source_word: שָׁלֹשׁ פְּעָמִים
  choice: nang tatlong ulit
  rationale: Pinananatili nito ang literal na “tatlong ulit” at ang tunay na kalabuan kung tumutukoy iyon sa tatlong hanay, palapag, o ibang paulit-ulit na ayos.
