base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/023.yaml
  text: Then he made the cast sea[a], ten cubits from brim to brim, round all around; its height was five cubits[c][b], and a line of thirty cubits went around it all around.
translation:
  language: tl
  text: Pagkatapos, ginawa niya ang Dagat na hinulma mula sa tunaw na metal[a]. Sampung siko ito mula sa labi hanggang labi, at bilog sa buong palibot. Limang siko ang taas nito, at isang pisi na tatlumpung siko ang haba[b][c] ang umikot sa buong palibot nito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “malaking palanggana.” Tinatawag sa Hebreo na “Dagat” ang malaking sisidlang ito sa templo; pinanatili sa teksto ang pormal na tawag na iyon.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “isang pising tatlumpung siko”; ibig sabihin, tatlumpung siko ang sukat ng palibot nito.
    reason: cultural_note
  - marker: c
    text: Ang nakasulat na anyo rito ay קוה; ayon sa tradisyon ng pagbasa, inuunawa ito bilang “pisi” o “panukat na pisi.” Ihambing ang 2 Cronica 4:2.
    reason: textual_variant
lexical_decisions:
- source_word: הַיָּם
  choice: ang Dagat
  rationale: Tumutukoy ito sa malaking sisidlan sa templo. Pinanatili ang pormal at matalinghagang tawag ng Hebreo sa halip na gawing “palanggana” lamang.
- source_word: מוּצָק
  choice: hinulma sa metal
  rationale: Ipinahihiwatig ng anyo ng salita na ginawa ang sisidlan sa pamamagitan ng pagbubuhos ng tunaw na metal sa hulma; malinaw at natural ito sa modernong Tagalog.
- source_word: עֶשֶׂר בָּאַמָּה מִשְּׂפָתוֹ עַד שְׂפָתוֹ
  choice: Sampung siko ang luwang nito mula sa isang labi hanggang sa kabila
  rationale: Ipinapahayag nito ang sukat patawid sa bunganga ng sisidlan. Ang “mula sa isang labi hanggang sa kabila” ay natural na Tagalog at tumpak sa diwa.
- source_word: עָגֹל סָבִיב
  choice: bilog ito sa palibot
  rationale: Pinananatili ang pagdidiin ng Hebreo sa pabilog na hugis ng sisidlan.
- source_word: קוֹמָתוֹ
  choice: ang taas nito
  rationale: Ito ang tuwiran at angkop na salin sa kontekstong pang-arkitektura.
- source_word: וקוה
  choice: isang pisi
  rationale: Ang salita ay nauunawaan bilang pisi o panukat na pising iniikot sa bagay upang sukatin ang palibot nito.
- source_word: יָסֹב אֹתוֹ סָבִיב
  choice: ang nakapalibot dito
  rationale: Natural itong Tagalog para sa kilos ng pising umiikot at lubos na pumapalibot sa sisidlan.
- source_word: אַמָּה
  choice: siko
  rationale: Ang “siko” ang nakaugaliang katawagan sa Tagalog para sa sinaunang yunit na cubit at hindi nito ipinipilit ang isang tiyak na makabagong conversion.
