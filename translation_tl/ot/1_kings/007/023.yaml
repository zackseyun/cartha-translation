    rationale: Maaaring basahin ito bilang isang uri ng pisi sa halip na isang pisi na may habang tatlumpung siko. Ang Hebreo ay tumutukoy sa panukat na pisi/linya na tatlumpung siko at umiikot sa sisidlan.
  - severity: low
    issue: Ang “nakapalibot dito” ay hindi gaanong naipapakita ang pagkilos ng pisi.
    rationale: Ang pandiwang Hebreo ay naglalarawan ng pag-ikot o pagpalibot. Ang “umabot/umikot sa buong palibot nito” ay mas tuwiran at natural.
