translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “Dagat” bilang natatanging katawagan sa sisidlan, “siko” para sa sinaunang sukat, at maikli at malinaw na pangungusap upang maiwasan ang mabigat o makalumang ayos.
