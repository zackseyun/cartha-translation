  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/כֹתָרֹ֗ת עַל שְׁנֵי֙ הָֽ/עַמּוּדִ֔ים גַּם מִ/מַּ֨עַל֙ מִ/לְּ/עֻמַּ֣ת הַ/בֶּ֔טֶן אֲשֶׁ֖ר לְ/עֵ֣בֶר שבכה וְ/הָ/רִמּוֹנִ֤ים מָאתַ֨יִם֙ טֻרִ֣ים סָבִ֔יב עַ֖ל הַ/כֹּתֶ֥רֶת הַ/שֵּׁנִֽית־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/020.yaml
  text: And the capitals were on the two pillars[a], also above, opposite the bulge that was beside the latticework; and the pomegranates were two hundred, in rows all around[c][b], on the second capital.
translation:
  language: tl
  text: Ang mga ulong palamuti sa dalawang haligi ay nasa itaas din, katapat ng umbok[a] na nasa tabi ng kayariang sala-sala.[b] May dalawang daang palamuting hugis-granada, na nakahanay sa buong palibot ng ikalawang ulong palamuti.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal na “tiyan”; malamang na tumutukoy sa bilugan at nakaumbok na bahagi ng ulong palamuti.
    reason: lexical_alternative
  - marker: b
    text: Ito ay pandekorasyong kayarian na parang lambat o sala-sala na nakakabit sa mga ulong palamuti.
    reason: cultural_note
  - marker: c
    text: Maaari ring “kabilang ulong palamuti.” Maaaring ginagamit dito ang Hebreong “ikalawa” upang tukuyin ang katugmang ulong palamuti ng ikalawang haligi.
    reason: alternative_reading
lexical_decisions:
- source_word: כֹתָרֹת / הַכֹּתֶרֶת
  choice: mga ulong palamuti / ulong palamuti
  rationale: Sa kontekstong pang-arkitektura, tumutukoy ito sa pandekorasyong bahagi sa tuktok ng haligi. Mas madaling maunawaan ng karaniwang mambabasa ang “ulong palamuti” kaysa sa teknikal na “kapitel.”
- source_word: עַל שְׁנֵי הָעַמּוּדִים
  choice: sa dalawang haligi
  rationale: Likas na Filipino para sa lokasyon ng mga ulong palamuti kaugnay ng dalawang haligi.
- source_word: גַּם מִמַּעַל
  choice: ay nasa itaas din
  rationale: Pinananatili ang dagdag na diwa ng גַּם at ang patayong posisyon ng מִמַּעַל nang hindi dinaragdagan ang kahulugan.
- source_word: מִלְעֻמַּת הַבֶּטֶן
  choice: katapat ng umbok
  rationale: Ang לְעֻמַּת ay “katapat” o “nakaharap sa,” at ang literal na “tiyan” ay malinaw na tumutukoy rito sa bilugang nakaumbok na bahagi ng palamuti.
- source_word: אֲשֶׁר לְעֵבֶר שבכה
  choice: na nasa tabi ng kayariang sala-sala
  rationale: Ang שבכה ay isang dekorasyong parang lambat o sala-sala. Dahil hindi tiyak ang eksaktong ugnayang pangpuwang ng לְעֵבֶר sa mahirap na pangungusap na ito, ang “nasa tabi” ay malinaw ngunit hindi labis na tiyak.
- source_word: הָרִמּוֹנִים
  choice: mga palamuting hugis-granada
  rationale: Mga disenyong pandekorasyon ang tinutukoy, hindi aktuwal na mga bunga; ipinahahayag iyon upang maiwasan ang maling pagkaunawa.
- source_word: מָאתַיִם
  choice: dalawang daan
  rationale: Tuwirang salin ng bilang.
- source_word: טֻרִים סָבִיב
  choice: nakahanay sa buong palibot
  rationale: Natural na Filipino na nagpapahayag kapuwa ng pagkakaayos sa mga hanay at ng paikot na pagkakalagay.
- source_word: עַל הַכֹּתֶרֶת הַשֵּׁנִית
  choice: ng ikalawang ulong palamuti
  rationale: Pinananatili ang tuwirang kahulugan ng הַשֵּׁנִית na “ikalawa,” habang inilalagay sa talababa ang posibleng kontekstuwal na kahulugang “kabilang.”
theological_decisions: []
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang deskriptibong “ulong palamuti” sa halip na ang teknikal at di-gaanong karaniwang “kapitel.” Pinanatili sa pangunahing teksto ang mahirap at bahagyang malabong paglalarawang pang-arkitektura, at inilagay sa mga talababa ang literal na idyoma at mahahalagang alternatibong pagbasa.
