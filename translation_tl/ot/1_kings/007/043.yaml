  text: and the ten stands[a], and the ten basins on the stands,
translation:
  language: tl
  text: ang sampung patungan[a], at ang sampung palanggana sa ibabaw ng mga patungan;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga tuntungan” o “mga base.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֶת
  choice: at ang
  rationale: Ang אֵת ay pananda ng tiyak na layon at hindi tuwirang isinasalin; ang וְ ay isinalin bilang “at” upang mapanatili ang dugtong-dugtong na talaan.
- source_word: הַ/מְּכֹנוֹת
  choice: mga patungan
  rationale: Sa konteksto ng mga kagamitan ng templo, tumutukoy ito sa mga suportang may gulong na pinagpapatungan ng mga palanggana. Likas at malinaw sa modernong Filipino ang “patungan” nang hindi labis na itinatampok ang pagkakaroon ng gulong.
- source_word: עָשֶׂר
  choice: sampung
  rationale: Karaniwang anyo ng bilang na sampu kapag tuwirang sinusundan ng pangngalan.
- source_word: הַ/כִּיֹּרֹת
  choice: mga palanggana
  rationale: Ang כִּיּוֹר ay malaking sisidlang ginagamit sa paghuhugas. Ang “palanggana” ay kasalukuyan at madaling maunawaang katumbas sa Filipino.
- source_word: עֲשָׂרָה
  choice: sampung
  rationale: Karaniwang anyo ng bilang na sampu kapag tuwirang sinusundan ng pangngalan.
- source_word: עַל
  choice: sa ibabaw ng
  rationale: Ipinahihiwatig ng pang-ukol ang pagkakalagay ng mga palanggana sa ibabaw ng mga suportang iyon.
- source_word: הַ/מְּכֹנוֹת
  choice: mga patungan
  rationale: Pinanatili ang parehong salin para sa inulit na terminong Hebreo.
