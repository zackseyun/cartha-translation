  text: and the four hundred pomegranates for the two latticeworks[a], two rows of pomegranates for each latticework[b], to cover the two bowl-shaped capitals that were on the tops of the pillars.
translation:
  language: tl
  text: at ang apatnaraang granada para sa dalawang palamuting sala-sala[a]—dalawang hanay ng granada para sa bawat palamuting sala-sala—upang takpan ang dalawang bahaging mala-mangkok ng mga kapitel[b] na nasa ibabaw ng mga haligi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga palamuting lambat.” Tumutukoy ang salitang Hebreo sa pandekorasyong gawang sala-sala na nasa mga kapitel.
    reason: lexical_alternative
  - marker: b
    text: Literal na “ang dalawang mangkok ng mga kapitel.”
    reason: lexical_alternative
lexical_decisions:
- source_word: רִמֹּנִים
  choice: mga granada
  rationale: Tuwirang tumutukoy ang pangngalan sa mga granada. Sa kontekstong ito, mga palamuting hugis-granada ang mga ito, ngunit pinananatili ng salin ang konkretong katawagan ng Hebreo.
- source_word: שְׂבָכוֹת
  choice: lambat-lambat na palamuti
  rationale: Tumutukoy ito sa pandekorasyong openwork na anyong lambat o sala-sala. Ang parirala ay malinaw sa karaniwang mambabasang Filipino at ipinahihiwatig na bahagi ito ng dekorasyon.
- source_word: טוּרִים
  choice: mga hanay
  rationale: Ito ang natural at tiyak na katawagan sa maayos na pagkakaayos ng mga granada.
- source_word: לַשְּׂבָכָה הָאֶחָת
  choice: sa bawat palamuti
  rationale: Bagaman literal na 'sa isang lambat-lambat na palamuti,' distributibo ang diwa dahil dalawang palamuti ang tinutukoy.
- source_word: לְכַסּוֹת
  choice: upang takpan
  rationale: Ipinapahayag ng infinitive ang layunin ng mga hanay ng granada; ang 'takpan' ang payak at tuwirang katumbas.
- source_word: גֻּלֹּת
  choice: bilugang bahagi
  rationale: Ang salita ay tumutukoy sa bilog o mala-mangkok na anyo. Pinananatili ng 'bilugang bahagi' ang hugis nang hindi ipinapalagay na ang buong kapitel mismo ang tinutukoy.
- source_word: כֹּתָרֹת
  choice: mga kapitel
  rationale: Sa arkitektura, ito ang bahagi sa tuktok ng haligi. Ang 'kapitel' ang tiyak na terminong Filipino sa kontekstong ito.
- source_word: עַל פְּנֵי הָעַמּוּדִים
  choice: nasa ibabaw ng mga haligi
  rationale: Sa paglalarawang pang-arkitektura, ipinahihiwatig ng parirala ang kinalalagyan ng mga kapitel sa ibabaw ng mga haligi.
theological_decisions: []
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang teknikal na terminong 'kapitel' dahil ito ang tiyak na tawag sa pang-itaas na bahagi ng haligi, habang nilinaw ng konteksto at talababa ang hindi karaniwang larawang pang-arkitektura.
