  to: at ang apatnaraang granada para sa dalawang palamuting sala-sala[a]—dalawang hanay ng granada para sa bawat palamuting sala-sala—upang takpan ang dalawang bahaging mala-mangkok ng mga kapitel[b] na nasa ibabaw ng mga haligi.
