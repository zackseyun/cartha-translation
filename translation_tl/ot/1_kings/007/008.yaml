  text: וּ/בֵית/וֹ֩ אֲשֶׁר יֵ֨שֶׁב שָׁ֜ם חָצֵ֣ר הָ/אַחֶ֗רֶת מִ/בֵּית֙ לָֽ/אוּלָ֔ם כַּ/מַּֽעֲשֶׂ֥ה הַ/זֶּ֖ה הָיָ֑ה וּ/בַ֜יִת יַעֲשֶׂ֤ה לְ/בַת פַּרְעֹה֙ אֲשֶׁ֣ר לָקַ֣ח שְׁלֹמֹ֔ה כָּ/אוּלָ֖ם הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/008.yaml
  text: His house where he was to live[a], in the other court farther back from the Hall, was of the same workmanship. He also made a house like this Hall for Pharaoh’s daughter[b], whom Solomon had taken as wife.
translation:
  language: tl
  text: Ang bahay niya na titirhan niya[a], na nasa kabilang looban sa gawing likuran ng Bulwagan, ay ginawa rin sa gayong paraan. Nagpagawa rin siya ng isang bahay na tulad ng Bulwagang ito para sa anak na babae ng Paraon[b], na kinuha ni Solomon bilang asawa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “na nasa isa pang looban, sa dakong paloob mula sa Bulwagan.” Mahirap tiyakin ang pariralang panlunan sa Hebreo, kaya nagkakaiba ang mga salin sa paglalarawan ng kinaroroonan ng tirahan kaugnay ng Bulwagan.'
    reason: alternative_reading
  - marker: b
    text: Sa Hebreo, “na kinuha ni Solomon”; ibig sabihin, kinuha niya bilang asawa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבֵיתוֹ
  choice: Ang bahay niya
  rationale: Likas na salin ng pangngalang may hulaping panghalip; ang panimulang pang-ugnay ay isinama sa maayos na daloy ng Filipino.
- source_word: אֲשֶׁר יֵשֶׁב שָׁם
  choice: na titirhan niya
  rationale: Ang יָשַׁב ay maaaring mangahulugang ‘manirahan’; ipinahihiwatig dito ang nilalayong gamit ng bahay bilang tirahan.
- source_word: חָצֵר הָאַחֶרֶת
  choice: kabilang looban
  rationale: Ang חָצֵר ay looban o patyo. Ipinahihiwatig ng tiyak na anyo na isa itong ibang bahagi ng kompleks, kaya ang ‘kabilang looban’ ay angkop.
- source_word: מִבֵּית לָאוּלָם
  choice: sa gawing likuran ng Bulwagan
  rationale: Mahirap at di-ganap na tiyak ang pariralang panlunan. Ipinahahayag ng salin ang posisyong higit na paloob o nasa likuran ng Bulwagan nang hindi gumagamit ng teknikal na rekonstruksiyon.
- source_word: כַּמַּעֲשֶׂה הַזֶּה הָיָה
  choice: ay ginawa rin sa gayong paraan
  rationale: Ang מַעֲשֶׂה rito ay tumutukoy sa paraan o uri ng pagkakagawa, hindi lamang sa isang gawa.
- source_word: וּבַיִת יַעֲשֶׂה
  choice: Nagpagawa rin siya ng isang bahay
  rationale: Sa buod ng mga gusali, ang yiqtol ay nagsasaad ng naganap na pagpapatayo. Mas natural ang ‘nagpagawa’ para sa haring nag-utos ng konstruksiyon.
- source_word: לְבַת פַּרְעֹה
  choice: para sa anak na babae ng Paraon
  rationale: Tuwirang salin ng ugnayang konstruktong Hebreo; malinaw at marangal sa modernong Filipino.
- source_word: אֲשֶׁר לָקַח שְׁלֹמֹה
  choice: na kinuha ni Solomon bilang asawa
  rationale: Ang לָקַח na ang layon ay isang babae ay karaniwang tumutukoy sa pagkuha sa pag-aasawa; pinanatili ang literal na pandiwa at nilinaw ang idyomatikong diwa.
- source_word: כָּאוּלָם הַזֶּה
  choice: na tulad ng Bulwagang ito
  rationale: Ang אוּלָם ay malaking portiko o bulwagan; ‘Bulwagan’ ang mas angkop sa maharlikang arkitektura at pinananatili ang tahasang paghahambing.
