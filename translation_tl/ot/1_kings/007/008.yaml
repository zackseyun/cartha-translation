translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang ‘looban’ para sa korte ng palasyo at ‘Bulwagan’ para sa אוּלָם. Pinanatili sa talababa ang tunay na kawalang-katiyakan ng pariralang panlunan.
