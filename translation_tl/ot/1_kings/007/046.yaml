base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/046.yaml
  text: In the plain of the Jordan the king cast them[c][b][a], in the clay ground between Sukkoth and Zarethan.
translation:
  language: tl
  text: Sa kapatagan ng Jordan[a] inihulma ng hari ang mga iyon[b] sa makapal na lupang luwad[c], sa pagitan ng Sukot at Zaretan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Lambak ng Jordan.” Literal na tumutukoy ang Hebreo sa distrito o kapatagan ng Jordan.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “ibinuhos ang mga iyon”; tumutukoy ang pandiwa sa pagbubuhos ng tunaw na metal upang mahulma.
    reason: lexical_alternative
  - marker: c
    text: Literal na “sa kapal ng lupa,” na malamang ay tumutukoy sa siksik na lupang luwad na angkop sa paggawa ng mga hulmahan.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּכִכַּר הַיַּרְדֵּן
  choice: Sa Kapatagan ng Jordan
  rationale: Sa heograpikong gamit, ang כִּכָּר ay tumutukoy sa malawak na kapatagan o distrito sa Jordan. Natural sa modernong Tagalog ang “Kapatagan ng Jordan,” habang pinananatili ang anyo ng Hebreo kaysa sa mas mapagpaliwanag na “Lambak ng Jordan.”
- source_word: יְצָקָם
  choice: ipinahulma ng hari ang mga iyon
  rationale: Ang יצק ay maaaring mangahulugang ibuhos o ihulma ang metal. Sa konteksto ng mga kagamitang tanso, malinaw na ipinahihiwatig ng “ipinahulma” ang paghuhulma sa pamamagitan ng pagbubuhos ng tunaw na metal. Ang hulaping panghalip ay isinalin bilang “ang mga iyon,” na tumutukoy sa naunang binanggit na mga bagay.
- source_word: הַמֶּלֶךְ
  choice: ng hari
  rationale: Pinananatili ang karaniwang pangngalang may tiyak na pantukoy sa Hebreo, sa halip na tahasang idagdag ang pangalang Solomon.
- source_word: בְּמַעֲבֵה הָאֲדָמָה
  choice: sa makapal na lupang luwad
  rationale: Ang מַעֲבֶה ay tumutukoy sa kapal o siksik na katangian ng lupa. Ang “makapal na lupang luwad” ay nagpapanatili ng literal na larawan at ipinakikita ang malamang na materyal na angkop sa paggawa ng mga hulmahan.
- source_word: בֵּין סֻכּוֹת וּבֵין צָרְתָן
  choice: sa pagitan ng Sukot at Zaretan
  rationale: 'Isinalin sa karaniwang baybay-Filipino ang mga pangalang Hebreo: Sukot para sa סֻכּוֹת at Zaretan para sa צָרְתָן.'
