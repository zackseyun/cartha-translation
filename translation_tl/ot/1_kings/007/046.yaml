translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “ipinahulma” upang maging likas ang paglalarawan sa paghahagis ng metal, ngunit inilagay sa talababa ang alternatibong “ipinabuhos.” Pinanatili ang “hari” sa halip na idagdag ang pangalang Solomon, at isina-Filipino ang baybay ng mga pangalan ng lugar.
