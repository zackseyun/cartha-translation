  source_fidelity: Kailangang ituwid ang pandiwang “ipinahulma,” na may diwang sanhi o pag-uutos (“pinahulma sa iba”), samantalang ang Hebreong יְצָקָם ay tuwirang nagsasabing ang hari ang nagbuhos/naghulma ng mga bagay. Ang natitirang nilalaman—kapatagan ng Jordan, lupang luwad, at mga pangalang-lugar—ay wasto at napapanatili ang kontekstwalisadong kahulugan nang hindi labis na nagpapaliwanag.
  naturalness: Natural at marangal ang pangungusap sa modernong Filipino. Ang “inihulma” ay mas tuwiran at mas tapat sa anyo ng pandiwa kaysa “ipinahulma.” Ginawang maliit na titik ang “kapatagan,” sapagkat karaniwang pangngalan ito sa loob ng parirala.
  terminology: Ang “Kapatagan ng Jordan,” “lupang luwad,” “Sukot,” at “Zaretan” ay katanggap-tanggap na modernong baybay at gamit. Pinanatili ang “hari,” hindi “Haring Solomon,” sapagkat ito ang nasa Hebreo. Ang “inihulma” ay angkop sa konteksto ng paghuhulma ng mga kagamitang metal; ibinibigay ng talababa ang mas literal na alternatibong “ibinuhos.”
  issues:
