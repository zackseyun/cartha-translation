  text: וַ/יַּ֧עַשׂ אֶת הַ/מְּכֹנ֛וֹת עֶ֖שֶׂר נְחֹ֑שֶׁת אַרְבַּ֣ע בָּ/אַמָּ֗ה אֹ֚רֶךְ הַ/מְּכוֹנָ֣ה הָֽ/אֶחָ֔ת וְ/אַרְבַּ֤ע בָּֽ/אַמָּה֙ רָחְבָּ֔/הּ וְ/שָׁלֹ֥שׁ בָּ/אַמָּ֖ה קוֹמָתָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/027.yaml
  text: He made ten bronze stands. The length of each stand was four cubits[a], its width four cubits, and its height three cubits.
translation:
  language: tl
  text: Gumawa siya ng sampung patungang[a] bronse. Ang bawat patungan ay apat na siko ang haba, apat na siko ang lapad, at tatlong siko ang taas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga tuntungan” o “mga base.” Ang salitang Hebreo ay tumutukoy rito sa mga suportang bronse para sa mga hugasan sa bakuran ng templo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Gumawa siya
  rationale: Ang wayyiqtol ng עשה ay nagpapatuloy sa salaysay. Likas sa modernong Tagalog ang payak na “Gumawa siya” nang hindi kailangang idagdag ang “at” o “pagkatapos.”
- source_word: הַמְּכֹנוֹת
  choice: mga patungan
  rationale: Sa kontekstong ito, tumutukoy ang מְכוֹנוֹת sa mga suportang bronse na lalagyan ng mga hugasan. Malinaw na ipinahahayag ng “mga patungan” ang gamit ng mga ito nang hindi ipinahihiwatig na karaniwang kariton lamang ang mga ito.
- source_word: עֶשֶׂר
  choice: sampu
  rationale: Tuwirang salin ng bilang na naglalarawan sa dami ng mga patungan.
- source_word: נְחֹשֶׁת
  choice: bronse
  rationale: Sa talaan ng mga kagamitan sa templo, malamang na bronse ang tinutukoy na metal. Mas tiyak ang “bronse” kaysa “tanso,” bagaman maaaring mas malawak ang saklaw ng salitang Hebreo sa tanso at mga haluang metal nito.
- source_word: הַמְּכוֹנָה הָאֶחָת
  choice: bawat patungan
  rationale: Ang literal na “ang isang patungan” ay may diwang pamamahagi rito; natural at malinaw itong naipahahayag ng “bawat patungan.”
- source_word: אַמָּה
  choice: siko
  rationale: Pinananatili ang sinaunang yunit ng sukat sa halip na gawing modernong sukat, sapagkat tinatayang halaga lamang ang eksaktong katumbas nito ngayon.
- source_word: אֹרֶךְ ... רָחְבָּהּ ... קוֹמָתָהּ
  choice: haba ... lapad ... taas
  rationale: Ito ang tuwiran at karaniwang mga katawagan sa Tagalog para sa tatlong dimensiyong ibinigay sa teksto.
