translation:
  language: tl
  text: May tatlong hanay ng mga balangkas ng bintana[a], at ang mga bintana ay magkakatapat nang tatlong ulit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “May mga bintanang magkakatapat sa tatlong antas.” Literal sa Hebreo: “bintana sa bintana nang tatlong ulit,” na malamang ay naglalarawan ng kaayusang inulit sa tatlong palapag o antas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁקֻפִים
  choice: mga balangkas ng bintana
  rationale: Tumutukoy ang salita sa mga nakabalangkas na siwang o casement sa gusali, kaya mas tiyak ito kaysa sa payak na “mga bintana”; posible rin ang kahulugang “mga tahilan,” ngunit hindi iyon ang pinakamalamang dito.
- source_word: שְׁלֹשָׁה טוּרִים
  choice: tatlong hanay
  rationale: Karaniwang tumutukoy ang טוּר sa magkakasunod na hanay. Natural at malinaw sa paglalarawang arkitektural ang “tatlong hanay,” habang maaaring ipinahihiwatig din nito ang tatlong antas.
- source_word: מֶחֱזָה
  choice: bintana
  rationale: Tumutukoy ito sa isang siwang na dinaraanan ng tanaw o liwanag. Dahil sa kontekstong arkitektural at sa naunang שְׁקֻפִים, “bintana” ang pinakamalinaw na salin.
- source_word: מֶחֱזָה אֶל מֶחֱזָה
  choice: ang mga bintana ay magkakatapat
  rationale: Ipinahihiwatig ng אֶל dito ang pagtutugma o pagkakaharap ng mga siwang. Ang “magkakatapat” ay natural sa Filipino at pinananatili ang ugnayang magkaharap.
- source_word: שָׁלֹשׁ פְּעָמִים
  choice: nang tatlong ulit
  rationale: Literal itong “tatlong ulit.” Pinananatili sa pangunahing teksto ang pormal na pahayag, samantalang inilalahad sa talababa ang posibleng arkitektural na diwang “sa tatlong antas.”
theological_decisions: []
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “balangkas ng bintana” para sa katumpakang arkitektural at “magkakatapat” para sa natural na paglalarawan ng ayos; pinanatili sa teksto at talababa ang kalabuan kung ang “tatlong ulit” ay bilang ng pag-uulit o tatlong antas.
