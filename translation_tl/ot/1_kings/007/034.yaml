  text: And there were four supports at the four corners of the one stand; its supports were part of the stand itself.
translation:
  language: tl
  text: May apat na pansuporta sa apat na sulok ng iisang patungan; ang mga pansuporta nito ay kabahagi mismo ng patungan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כְתֵפוֹת / כְתֵפֶיהָ
  choice: mga pansuporta
  rationale: Bagaman literal na “mga balikat,” tumutukoy dito ang salita sa mga bahaging nakausli at sumusuporta sa estruktura; mas malinaw sa kontekstong teknikal ang “mga pansuporta.”
- source_word: מְכֹנָה
  choice: patungan
  rationale: Tumutukoy sa naililipat na base o stand ng palanggana; ang “patungan” ay likas at madaling maunawaang tawag sa Filipino.
- source_word: הָאֶחָת
  choice: iisang
  rationale: Pinananatili ang tahasang anyong singular na “the one” sa tekstong Masoretiko, sa halip na gawing distributibong “bawat” nang walang pahiwatig.
- source_word: מִן הַמְּכֹנָה
  choice: kabahagi mismo ng patungan
  rationale: Ipinahihiwatig ng parirala na ang mga pansuporta ay nagmula sa o integral na bahagi ng mismong patungan, hindi hiwalay na nakakabit lamang.
