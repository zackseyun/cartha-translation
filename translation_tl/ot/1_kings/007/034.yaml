  source_fidelity: 'Tumpak ang salin sa Hebreo: ang אַרְבַּע כְּתֵפוֹת ay apat na pansuporta sa apat na sulok, at ang מִן הַמְּכֹנָה כְּתֵפֶיהָ ay maayos na naipahahayag bilang integral na kabahagi ng patungan ang mga ito. Napananatili rin ang singular na “the one stand” sa “iisang patungan,” alinsunod sa Masoretikong teksto at English POB audit trail.'
