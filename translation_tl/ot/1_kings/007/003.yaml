  text: It was paneled with cedar above[a], over the side chambers that were on the pillars, forty-five in all, fifteen to a row.
translation:
  language: tl
  text: Tinakpan ito ng sedro sa itaas[a], sa ibabaw ng mga bahaging nasa gilid na nasa ibabaw ng mga haligi—apatnapu't lima lahat, tig-labinlima sa bawat hanay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari rin na “Tinakpan ito ng sedro mula sa itaas, sa ibabaw ng mga estrukturang nasa gilid na nasa ibabaw ng mga haligi.” Mahirap tiyakin ang kahulugan ng ilang terminong pang-arkitektura sa Hebreo, lalo na ang צלעות, na maaaring tumukoy sa “mga tagiliran,” “mga tadyang,” “mga silid sa gilid,” o “mga estruktura sa gilid.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסָפֻן
  choice: Nilagyan iyon ng mga tabla
  rationale: Ang pasibong anyo ng ספן ay tumutukoy sa pagtakip o paglalapat ng materyal sa isang gusali. Likas sa Filipino ang “nilagyan ng mga tabla” at malinaw na ipinahihiwatig ng kasunod na “sedro” ang materyal na pantakip, nang hindi ipinapalagay na bubong lamang ang tinutukoy.
- source_word: בָּאֶרֶז
  choice: ng mga tablang sedro
  rationale: Ang בְּ ay nagpapakilala ng materyal. Ang “mga tablang sedro” ay natural na paglalarawan sa gamit ng kahoy na sedro bilang pantakip o panel.
- source_word: מִמַּעַל
  choice: sa itaas
  rationale: Pinananatili nito ang lokatibong diwa ng salitang Hebreo nang hindi nililinaw nang lampas sa teksto kung kisame o bubong ang tinutukoy.
- source_word: עַל הַצְּלָעוֹת
  choice: sa ibabaw ng mga bahaging nasa gilid
  rationale: Ang צלעות ay maaaring mangahulugang mga tagiliran, tadyang, o mga silid/estrukturang nasa gilid. Pinananatili ng “mga bahaging nasa gilid” ang tunay na kalabuan ng terminong pang-arkitektura.
- source_word: אֲשֶׁר עַל הָעַמּוּדִים
  choice: na nakapatong sa mga haligi
  rationale: Ipinahahayag nito ang pisikal na ugnayang tinutukoy ng עַל sa konteksto ng konstruksiyon, sa natural na modernong Filipino.
- source_word: אַרְבָּעִים וַחֲמִשָּׁה
  choice: apatnapu't lima lahat
  rationale: Maliwanag na ipinakikita ng “lahat” na ito ang kabuuang bilang ng mga elementong binanggit, alinsunod sa kasunod na paghahating tig-labinlima.
- source_word: חֲמִשָּׁה עָשָׂר הַטּוּר
  choice: tig-labinlima sa bawat hanay
  rationale: Ang טוּר ay “hanay” o “hilera.” Ang distributibong “tig-labinlima” ay malinaw at natural na nagpapakita ng labinlima sa bawat hanay.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mga bahaging nasa gilid” sa pangunahing teksto upang hindi gawing tiyak ang hindi tiyak na katawagang pang-arkitektura; inilagay sa talababa ang mas tiyak na posibleng pagbasa. Pinanatili ang maikli at teknikal na daloy ng paglalarawan sa gusali.
