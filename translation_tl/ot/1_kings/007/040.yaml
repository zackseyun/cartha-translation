  text: וַ/יַּ֣עַשׂ חִיר֔וֹם אֶת הַ֨/כִּיֹּר֔וֹת וְ/אֶת הַ/יָּעִ֖ים וְ/אֶת הַ/מִּזְרָק֑וֹת וַ/יְכַ֣ל חִירָ֗ם לַֽ/עֲשׂוֹת֙ אֶת כָּל הַ/מְּלָאכָ֔ה אֲשֶׁ֥ר עָשָׂ֛ה לַ/מֶּ֥לֶךְ שְׁלֹמֹ֖ה בֵּ֥ית יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/040.yaml
  text: And Hiram made the basins[a], the shovels, and the bowls. So Hiram finished doing all the work that he did for King Solomon for the house of Yahweh.
translation:
  language: tl
  text: Ginawa ni Hiram ang mga palanggana, mga pala, at mga mangkok.[a] Kaya natapos ni Hiram ang lahat ng gawaing ginawa niya para kay Haring Solomon para sa bahay ni Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “mga mangkok na pangwisik,” na ginagamit sa mga ritwal ng paghahandog.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּיֹּרוֹת
  choice: mga palanggana
  rationale: Tumutukoy ito sa malalaking sisidlang hugasan sa mga kagamitan ng templo. Ang “mga palanggana” ay malinaw at karaniwan sa makabagong Filipino.
- source_word: יָּעִים
  choice: mga pala
  rationale: Mga kasangkapang ginagamit sa pag-aalis ng abo o baga ang tinutukoy. Ang “mga pala” ang tuwiran at natural na katumbas sa kontekstong ito.
- source_word: מִּזְרָקוֹת
  choice: mga mangkok
  rationale: Tumutukoy ito sa mga sisidlang ginagamit sa ritwal ng paghahandog, kabilang ang pagsalo o pagwisik ng dugo o ibang likido. Pinananatili ng “mga mangkok” ang malawak na kahulugan, habang inilalagay sa talababa ang mas tiyak na gamit.
- source_word: וַיְכַל
  choice: natapos
  rationale: Ipinahihiwatig ng pandiwa ang pagkumpleto sa gawain; natural at maikli sa Filipino ang “natapos.”
- source_word: כָּל הַמְּלָאכָה
  choice: lahat ng gawain
  rationale: Malawak ang saklaw ng מְלָאכָה at maaaring tumukoy sa gawain o pagkakayari. Hindi labis na nililimitahan ng “lahat ng gawain” ang kahulugan.
- source_word: בֵּית יְהוָה
  choice: bahay ni Yahweh
  rationale: Pinananatili ng “bahay” ang tuwirang larawang Hebreo, bagaman templo ang tinutukoy, at isinasalin ang banal na pangalan bilang “Yahweh.”
- source_word: חִירוֹם / חִירָם
  choice: Hiram
  rationale: Iisang tao ang tinutukoy ng dalawang anyo ng baybay sa Hebreo; ginagamit ang nakaugaliang anyong “Hiram.”
- source_word: עָשָׂה ... לַמֶּלֶךְ שְׁלֹמֹה
  choice: ginawa niya para kay Haring Solomon
  rationale: Pinananatili nito ang diwa ng paggawa ni Hiram para sa hari at ang tahasang pagbanggit sa kanyang pagkilos.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Tahasang lumilitaw sa talata ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalang tipan sa halip na palitan ito ng isang titulo.
- issue: Kaugnayan ng gawain sa bahay ni Yahweh
  choice: para sa bahay ni Yahweh
  alternative: sa bahay ni Yahweh
  rationale: Ang Hebreong לַבֵּית ay nagpapahiwatig na ginawa ang gawain para sa templo, hindi lamang na isinagawa ito sa loob ng templo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang “bahay ni Yahweh” upang katawanin ang Hebreong parirala, at iniwasan ang mga salitang lipas gaya ng “lavadero” o labis na teknikal na katawagan sa mga kagamitang panritwal.
