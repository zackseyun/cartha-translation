translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang pamilyar na terminong teknikal na “panel,” ngunit iniwasan ang labis na teknikal na paglalarawan. Pinanatili sa talababa ang tunay na kawalang-katiyakan ng כְּמַעַר אִישׁ at לֹיֹת.
