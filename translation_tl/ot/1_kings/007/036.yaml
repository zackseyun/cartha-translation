base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/036.yaml
  text: On the panels of its supports and on its frames he engraved cherubim[a], lions, and palm trees, according to the space on each[b], with wreaths all around.
translation:
  language: tl
  text: Sa mga panel ng mga tukod nito at sa mga balangkas nito, inukitan niya ng mga kerubin, leon, at mga puno ng palma ayon sa puwang para sa bawat isa,[a] at ng mga girnalda sa buong paligid.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “saanman may puwang para sa bawat larawan.” Mahirap unawain ang pariralang Hebreo at malamang na inilalarawan nito ang pagkakaayos ng mga ukit ayon sa puwang na magagamit.
    reason: lexical_alternative
  - marker: b
    text: O, “mga palamuting nakapulupot.” Malamang na tumutukoy ang salitang Hebreo sa mga pandekorasyong nakapalibot sa mga larawan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְפַתַּח
  choice: inukitan niya
  rationale: Sa konteksto ng pandekorasyong gawa sa mga patungan, tumutukoy ang pandiwa sa pag-ukit ng mga larawan sa ibabaw.
- source_word: הַלֻּחֹת
  choice: mga panel
  rationale: Mga patag na bahaging pandekorasyon ng kayarian ang tinutukoy, hindi mga tapyas na sulatan; karaniwan at malinaw sa makabagong Filipino ang “panel.”
- source_word: יְדֹתֶיהָ
  choice: mga pansuporta nito
  rationale: Bagaman literal na “mga kamay nito,” tumutukoy ito rito sa mga nakausling bahaging sumusuporta sa kayarian.
- source_word: מַסְגְּרֹתֶיהָ
  choice: mga balangkas nito
  rationale: Ipinahihiwatig ng salita ang mga bahaging nakapalibot o nagsisilbing frame sa patungan.
- source_word: כְּרוּבִים
  choice: mga kerubin
  rationale: Pinananatili ang nakaugaliang transliterasyon para sa mga nilalang na kaugnay ng presensya at trono ng Diyos, nang hindi ipinapahiwatig ang makabagong larawan ng batang anghel.
- source_word: אֲרָיוֹת
  choice: mga leon
  rationale: Tuwirang katumbas para sa hayop na ginamit bilang disenyong inukit.
- source_word: תִמֹרֹת
  choice: mga puno ng palma
  rationale: Sa dekorasyong pangtemplo, tumutukoy ito sa mga disenyong hugis puno ng palma.
- source_word: כְּמַעַר אִישׁ
  choice: ayon sa puwang na nakalaan sa bawat isa
  rationale: Mahirap at hindi tiyak ang pariralang Hebreo; malamang na inilalarawan nito ang pagkakaayos ng bawat larawang inukit ayon sa magagamit na puwang.
- source_word: לֹיֹת
  choice: mga girnalda
  rationale: Malamang na tumutukoy ang pangngalan sa mga palamuting tulad ng festoon o nakapulupot na dekorasyon; ang “girnalda” ay maikli at angkop sa konteksto ng ornamental na disenyo.
- source_word: סָבִיב
  choice: sa buong paligid
  rationale: Natural na Filipino para sa palamuting nakapalibot sa mga inukit na larawan.
