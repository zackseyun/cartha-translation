  text: And the foundation was of costly stones[a], large stones, stones of ten cubits and stones of eight cubits.
translation:
  language: tl
  text: At ang pundasyon ay yari sa mamahaling mga bato[a]—malalaking bato, mga batong may sukat na sampung siko at mga batong may sukat na walong siko.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mahahalagang mga bato.” Binibigyang-diin ng Hebreo ang mataas na halaga o kalidad ng mga bato; sa kontekstong ito ng pagtatayo, hindi malamang na tumutukoy ito sa mga hiyas.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמְיֻסָּד
  choice: At ang pundasyon ay yari
  rationale: Ang passive participle ng יסד ay tumutukoy sa pagkakayari o pagkakatatag ng pundasyon. Natural sa modernong Tagalog ang “ang pundasyon ay yari” at hindi nito dinaragdagan ang detalye ng Hebreo.
- source_word: אֲבָנִים יְקָרוֹת
  choice: sa mamahaling mga bato
  rationale: Ang יְקָרוֹת ay nagsasaad ng mataas na halaga o kalidad. Sa konteksto ng pagtatayo, mas malinaw ang “mamahaling mga bato” kaysa “mahahalagang bato,” na maaaring mapagkamalang mga hiyas.
- source_word: אֲבָנִים גְּדֹלוֹת
  choice: malalaking bato
  rationale: Tumutukoy ang גְּדֹלוֹת sa pisikal na laki; ito ang natural at tuwirang katumbas sa Tagalog.
- source_word: אַבְנֵי עֶשֶׂר אַמּוֹת
  choice: mga bato na sampung siko ... ang sukat
  rationale: Ipinahahayag ng construct chain ang dimensiyon ng mga bato. Hindi tinutukoy ng Hebreo kung haba, lapad, o taas iyon, kaya “ang sukat” ang ginamit nang hindi nagpapasya sa eksaktong axis.
- source_word: וְאַבְנֵי שְׁמֹנֶה אַמּוֹת
  choice: at walong siko ang sukat
  rationale: Pinananatili ang parallel na paglalarawan sa naunang sukat habang iniiwasan ang hindi kailangang pag-uulit sa natural na Tagalog.
- source_word: אַמּוֹת
  choice: siko
  rationale: Ang “siko” ang nakaugaliang salin sa Tagalog para sa sinaunang yunit na אַמָּה at pinananatili nito ang yunit ng pinagmulang teksto sa halip na sapilitang i-convert.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na natural, marangal, at madaling maunawaan. Ginamit ang em dash upang malinaw na ipakilala ang paglalarawan sa laki ng mga bato. Pinanatili ang sinaunang yunit na “siko” at hindi tinukoy kung aling dimensiyon ng bato ang sinusukat.
