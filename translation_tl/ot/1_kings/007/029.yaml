base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/029.yaml
  text: And on the panels that were between the frames were lions[a], oxen, and cherubim; and on the frames likewise above, and beneath the lions and the oxen were wreaths[b], a work of hanging relief.
translation:
  language: tl
  text: Sa mga panel na nasa pagitan ng mga balangkas ay may mga leon, mga baka, at mga kerubin. Sa mga balangkas naman ay may patungang nasa itaas; at sa ilalim ng mga leon at mga baka ay may mga palamuting tulad ng kuwintas[a], na gawaing ukit na nakalaylay[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga girlanda” o “mga feston.” Bihira ang salitang Hebreo, kaya hindi tiyak ang eksaktong anyo ng palamuti.
    reason: lexical_alternative
  - marker: b
    text: Mahirap tiyakin ang pariralang Hebreo na isinaling “gawaing ukit na nakalaylay.” Maaaring tumukoy ito sa palamuting nakausli, nakabitin, o bumababa sa ilalim ng mga pigura ng leon at baka.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִּסְגְּרוֹת
  choice: mga panel
  rationale: Sa paglalarawan ng mga patungan, tumutukoy ito sa mga bahaging nilagyan ng palamuti sa loob ng estruktura. Ang “mga panel” ay malinaw na naiiba sa שְׁלַבִּים, na isinaling “mga balangkas.”
- source_word: שְׁלַבִּים
  choice: mga balangkas
  rationale: Tumutukoy ito sa mga kasaping pang-estruktura na nakapalibot sa mga panel. Likas at malinaw sa modernong Filipino ang “mga balangkas” sa kontekstong ito.
- source_word: אֲרָיוֹת
  choice: mga leon
  rationale: Tuwirang salin ng pangmaramihang katawagan sa hayop na ginamit bilang disenyong pampalamuti.
- source_word: בָּקָר
  choice: mga baka
  rationale: Pangkalahatang tawag ito sa mga bovine; hindi ito nilimitahan sa “mga toro,” sapagkat hindi ganoon katiyak ang Hebreo.
- source_word: כְרוּבִים
  choice: mga kerubin
  rationale: Ginamit ang nakaugaliang biblikal na katawagan para sa natatanging uri ng mga makalangit na nilalang, sa halip na isang katawagang maaaring magmukhang diminutibo.
- source_word: כֵּן
  choice: gayon din
  rationale: Sa kontekstong ito, ipinahihiwatig nito ang pagkakatulad ng palamuti sa mga panel at sa ibabaw ng mga balangkas. Pinananatili ng “gayon din” ang paghahambing nang hindi dinaragdagan ang detalye.
- source_word: מִמָּעַל
  choice: sa ibabaw
  rationale: Payak na panandang panlunan na tumutukoy sa kinalalagyan ng palamuti.
- source_word: מִתַּחַת
  choice: sa ilalim
  rationale: Payak na panandang panlunan na katapat ng “sa ibabaw.”
- source_word: לֹיוֹת
  choice: mga palamuting parang kuwintas
  rationale: Bihira ang salitang Hebreo at waring tumutukoy sa mga feston, girlanda, o kahawig na palamuting nakakurba. Ang paglalarawang ito ay madaling maunawaan at hindi nagkukunwaring tiyak ang anyo.
- source_word: מַעֲשֵׂה מוֹרָד
  choice: ginawang nakalaylay na ukit
  rationale: Mahirap tiyakin ang parirala; malamang na inilalarawan nito ang palamuting nakausli o nakaukit na pababa. Inihahatid ng salin ang artistiko at panlunang diwa habang inilalahad sa talababa ang kawalang-katiyakan.
