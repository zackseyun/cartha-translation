  register: Modernong Filipino na marangal ngunit madaling maunawaan. Pinanatili ang mga terminong “panel” at “kerubin” dahil pamilyar at mas tiyak ang mga ito sa kontekstong arkitektural at biblikal. Ang dalawang talababa ay nag-iingat sa tunay na leksikal na kawalang-katiyakan ng mga bihirang pariralang Hebreo.
