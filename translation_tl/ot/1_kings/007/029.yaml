revisions:
- from: Sa mga panel na nasa pagitan ng mga balangkas ay may mga leon, mga baka, at mga kerubin. Gayon din ang palamuti sa ibabaw ng mga balangkas; at sa ilalim ng mga leon at mga baka ay may mga palamuting parang kuwintas[a], na ginawang nakalaylay na ukit[b].
