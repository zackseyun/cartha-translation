  register: Makabago at marangal na Filipino, na pinananatili ang anyong talaan ng mga kagamitan. Ginamit ang “Dagat” bilang kinikilalang pangalan ng malaking sisidlan sa templo, habang nililinaw sa talababa ang kahulugan nito.
