  text: and the one Sea[a], and the twelve oxen under the Sea;
translation:
  language: tl
  text: at ang isang Dagat[a], at ang labindalawang baka sa ilalim ng Dagat;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “malaking imbakan ng tubig.” Sa Hebreo, ang “Dagat” ay tawag sa malaking sisidlan ng tubig.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַיָּם
  choice: Dagat
  rationale: Sa konteksto ng mga kagamitan ng templo, tumutukoy ito sa malaking imbakan ng tubig na yari sa hinulmang metal. Pinananatili ng malaking titik ang tradisyonal na katawagan dito bilang isang natatanging kagamitan.
- source_word: הָאֶחָד
  choice: nag-iisang
  rationale: Ipinahahayag nito na iisa ang Dagat, bilang kaibahan sa maramihang mga patungan at palanggana sa nakapaligid na talaan.
- source_word: הַבָּקָר
  choice: mga baka
  rationale: Tumutukoy ito sa labindalawang anyong-bakang nasa ilalim at nagsisilbing suporta sa Dagat. Hindi tinutukoy ng salitang Hebreo rito ang kasarian, kaya hindi ito isinaling 'mga toro.'
- source_word: שְׁנֵים עָשָׂר
  choice: labindalawa
  rationale: Tuwirang katumbas ng bilang sa Hebreo.
- source_word: תַּחַת
  choice: sa ilalim ng
  rationale: Likas na salin para sa pisikal na kinalalagyan ng mga baka kaugnay ng Dagat.
- source_word: וְאֶת
  choice: at ang
  rationale: Ang pang-ugnay na וְ ay ipinapahayag bilang 'at,' samantalang walang hiwalay na katumbas sa Tagalog ang pananda ng tuwirang layon na אֶת.
