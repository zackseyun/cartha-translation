base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/017.yaml
  text: 'There were lattices of latticework and twisted cords of chainwork for the capitals that were on the tops of the pillars: seven for the one capital[a], and seven for the second capital.'
translation:
  language: tl
  text: May mga lambat na may disenyong sala-sala at mga pinilipit na lubid na yari sa anyong tanikala para sa mga kapitel na nasa tuktok ng mga haligi—pito para sa isang kapitel[a] at pito para sa ikalawang kapitel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “mga sala-sala na gawa sa lambat at mga tinirintas na hiblang gawa sa tanikala.” Gumagamit ang Hebreo ng magkapares na katawagang pansining upang ilarawan ang pandekorasyong metal sa mga kapitel ng mga haligi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂבָכִים מַעֲשֵׂה שְׂבָכָה
  choice: mga sala-salang palamuti na yari sa anyong lambat
  rationale: Pinananatili nito ang kongkretong larawan ng magkakrus o magkakawing na pandekorasyong metal at ang pag-uulit ng magkaugnay na salitang Hebreo, ngunit inihahayag ito sa likas na modernong Tagalog.
- source_word: גְּדִלִים מַעֲשֵׂה שַׁרְשְׁרוֹת
  choice: mga pinilipit na taling yari sa anyong tanikala
  rationale: Ang גְּדִלִים ay tumutukoy sa pinilipit o tinirintas na mga hibla, samantalang ang kasunod na parirala ay naglalarawan sa mga ito bilang gawaing tila tanikala. Hindi nito ipinapalagay na mga koronang bulaklak ang tinutukoy.
- source_word: כֹּתָרֹת
  choice: mga kapitel
  rationale: Ang 'kapitel' ang tiyak na katawagang pang-arkitektura para sa pandekorasyong ulunan ng haligi. Nililinaw rin ng kasunod na pariralang 'nasa tuktok ng mga haligi' ang kahulugan para sa karaniwang mambabasa.
- source_word: אֲשֶׁר עַל רֹאשׁ הָעַמּוּדִים
  choice: na nasa tuktok ng mga haligi
  rationale: Ang literal na 'ulo' ay likas na isinasalin bilang 'tuktok' sa kontekstong pang-arkitektura.
- source_word: שִׁבְעָה לַכֹּתֶרֶת הָאֶחָת וְשִׁבְעָה לַכֹּתֶרֶת הַשֵּׁנִית
  choice: pito para sa isang kapitel at pito para sa ikalawang kapitel
  rationale: Tapat nitong pinananatili ang tahasang pamamahagi ng tigpipito sa dalawang kapitel nang hindi nagdaragdag ng hindi binanggit na yunit gaya ng 'hanay.'
theological_decisions: []
translation_notes:
  register: Makabago at marangal na Tagalog. Ginamit ang teknikal na salitang 'kapitel' dahil ito ang eksaktong katawagang pang-arkitektura, ngunit agad itong nilinaw ng pariralang 'nasa tuktok ng mga haligi.' Iniwasan ang mga lumang salitang mahirap maunawaan at ang pagdaragdag ng espesipikong anyo o bilang ng mga hanay na hindi tahasang nakasaad sa Hebreo.
