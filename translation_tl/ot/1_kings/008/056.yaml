source:
  edition: WLC
  text: בָּר֣וּךְ יְהוָ֗ה אֲשֶׁ֨ר נָתַ֤ן מְנוּחָה֙ לְ/עַמּ֣/וֹ יִשְׂרָאֵ֔ל כְּ/כֹ֖ל אֲשֶׁ֣ר דִּבֵּ֑ר לֹֽא נָפַ֞ל דָּבָ֣ר אֶחָ֗ד מִ/כֹּל֙ דְּבָר֣/וֹ הַ/טּ֔וֹב אֲשֶׁ֣ר דִּבֶּ֔ר בְּ/יַ֖ד מֹשֶׁ֥ה עַבְדּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/056.yaml
  text: Blessed be Yahweh[a], who has given rest to his people Israel, according to all that he spoke. Not one word has failed of all his good words that he spoke by the hand of Moses his servant.
translation:
  language: tl
  text: Purihin si Yahweh[a], na nagbigay ng kapahingahan sa kanyang bayang Israel, ayon sa lahat ng sinabi niya. Walang isa mang salita sa lahat ng mabubuting salitang sinabi niya sa pamamagitan ng kanyang lingkod na si Moises ang nabigo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O kaya, “Wala ni isa man sa mabubuti niyang pangako ang nabigo,” sapagkat ang “salita” rito ay maaari ring tumukoy sa isang ipinahayag na pangako.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרוּךְ
  choice: Purihin
  rationale: Isang pormulang pagpapala at pagpupuri ito. Ang “Purihin” ay likas at marangal sa modernong Tagalog at pinananatili ang doxological na puwersa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang isinalin ang banal na pangalang nasa tekstong Hebreo, sa halip na palitan ito ng isang titulo.
- source_word: נָתַן מְנוּחָה
  choice: nagbigay ng kapahingahan
  rationale: Tumutukoy ito sa ipinagkaloob na katiwasayan mula sa mga kaaway at kaguluhan, hindi lamang sa panloob na kapanatagan.
- source_word: לְעַמּוֹ יִשְׂרָאֵל
  choice: sa kanyang bayang Israel
  rationale: Natural na Tagalog ito para sa appositional na parirala at pinananatili ang ugnayang tipan sa katawagang “kanyang bayan.”
- source_word: כְּכֹל אֲשֶׁר דִּבֵּר
  choice: ayon sa lahat ng sinabi niya
  rationale: Pinananatili ang pangkalahatang pandiwang “sinabi” sa Hebreo at hindi ito tahasang ginagawang “ipinangako,” bagaman pangako ang diwa sa konteksto.
- source_word: לֹא נָפַל דָּבָר אֶחָד
  choice: Walang isa mang salita ... ang nabigo
  rationale: Ang literal na “nahulog” ay isang idyomang nangangahulugang walang sinabi ang hindi natupad o nawalan ng bisa. Malinaw na ipinahahayag ng “nabigo” ang diwa nito.
- source_word: מִכֹּל דְּבָרוֹ הַטּוֹב
  choice: sa lahat ng mabubuting salitang
  rationale: Ginamit ang maramihang “mabubuting salita” upang maipahayag nang natural ang kolektibong diwa ng singular na Hebreo habang pinananatili ang salitang “salita.”
- source_word: בְּיַד מֹשֶׁה
  choice: sa pamamagitan ng ... si Moises
  rationale: Ang Hebreong pormula ng ahensiya ay natural na ipinahahayag sa Tagalog bilang “sa pamamagitan ng,” nang hindi pilit na pinananatili ang idyomang “sa kamay ni.”
- source_word: עַבְדּוֹ
  choice: kanyang lingkod
  rationale: Sa marangal na pagtukoy kay Moises bilang inatasang tagapaglingkod ni Yahweh, “lingkod” ang angkop at natural na salin.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehovah
  rationale: Personal na pangalan ang tahasang nasa Hebreo; pinananatili ng “Yahweh” ang pangalan sa halip na palitan ito ng titulo.
- issue: Kung isasalin ang דָּבָר / דְּבָרוֹ bilang “salita” o “pangako”
  choice: salita
  alternative: pangako
  rationale: Bagaman malinaw na tumutukoy sa natupad na pangako ang konteksto, “salita” ang leksikal na anyo sa Hebreo. Pinananatili ito sa pangunahing teksto at inilalahad sa talababa ang diwang “pangako.”
translation_notes:
  register: Modernong Filipino Tagalog na marangal at malinaw. Ginamit ang “kapahingahan” para sa ipinagkaloob na katiwasayan at ang “sa pamamagitan ni Moises” para sa natural na pagpapahayag ng Hebreong pormula ng ahensiya. Ang marker na [a] ay inilagay sa pangunahing teksto.
