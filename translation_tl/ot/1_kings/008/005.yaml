reference: 1 Kings 8:5
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/הַ/מֶּ֣לֶךְ שְׁלֹמֹ֗ה וְ/כָל עֲדַ֤ת יִשְׂרָאֵל֙ הַ/נּוֹעָדִ֣ים עָלָ֔י/ו אִתּ֖/וֹ לִ/פְנֵ֣י הָֽ/אָר֑וֹן מְזַבְּחִים֙ צֹ֣אן וּ/בָקָ֔ר אֲשֶׁ֧ר לֹֽא יִסָּפְר֛וּ וְ/לֹ֥א יִמָּנ֖וּ מֵ/רֹֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/005.yaml
  text: And King Solomon[a], and all the assembly of Israel who had assembled before him, were with him before the ark, sacrificing sheep and cattle that could not be counted or numbered because of their great number.
translation:
  language: tl
  text: At si Haring Solomon, kasama ang buong kapulungan ng Israel na nagtipon sa harap niya,[a] ay nasa harap ng kaban. Naghahandog sila ng mga tupa at baka na hindi kayang bilangin o tantiyahin dahil sa napakarami ng mga iyon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “na nagtipon sa kanya.” Maaaring idiin ng pananalitang Hebreo na nagtipon ang mga tao kaugnay ni Solomon.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲדַת
  choice: kapulungan
  rationale: Ang “kapulungan” ay natural at marangal na tawag sa buong bayang nagtipon para sa pampublikong gawaing panrelihiyon, nang hindi nag-aangkat ng mas makitid na kahulugang pangdenominasyon.
- source_word: הַנּוֹעָדִים עָלָיו
  choice: na nagtipon sa harap niya
  rationale: Ipinahahayag nito ang pagtitipon ng bayan kaugnay ni Solomon at pinananatili ang posibleng diwang direksiyon o pagharap ng עָלָיו; inilalagay sa talababa ang isa pang natural na pagbasa.
- source_word: אִתּוֹ
  choice: kasama
  rationale: Maikli at natural nitong ipinahahayag na ang kapulungan ay kasama ni Solomon, gaya ng predikatibong ugnayan sa tekstong Hebreo.
- source_word: לִפְנֵי הָאָרוֹן
  choice: nasa harap ng kaban
  rationale: Ang “sa harap ng kaban” ay malinaw na pananalitang panlunan, at ang “kaban” ang nakaugaliang salin ng אָרוֹן sa kontekstong ito.
- source_word: מְזַבְּחִים
  choice: naghahandog
  rationale: Ipinahahayag ng aspektong nagpapatuloy ang kasalukuyang ritwal na paghahandog; malinaw sa kasunod na mga hayop na hain ang tinutukoy.
- source_word: צֹאן וּבָקָר
  choice: mga tupa at baka
  rationale: Konkreto at madaling maunawaan itong katumbas ng maliliit na hayop ng kawan at mga baka sa konteksto ng paghahandog.
- source_word: אֲשֶׁר לֹא יִסָּפְרוּ וְלֹא יִמָּנוּ
  choice: na hindi kayang bilangin o tantiyahin
  rationale: Pinananatili ang magkatambal na pandiwa ng Hebreo at ang retorikal na diin sa dami, habang iniiwasan ang hindi natural na pag-uulit ng dalawang halos magkaparehong salitang Filipino.
- source_word: מֵרֹב
  choice: dahil sa napakarami ng mga iyon
  rationale: Malinaw nitong ipinahahayag ang dahilan kung bakit hindi mabilang ang mga inihahandog na hayop.
theological_decisions:
- issue: Pagtukoy sa “kaban”
  choice: Isinalin lamang na “kaban.”
  alternative: “kaban ng tipan”
  rationale: “Ang kaban” lamang ang nasa Hebreo sa talatang ito; ang pagdaragdag ng “ng tipan” ay kukuha ng impormasyon mula sa mas malawak na konteksto sa halip na sa mismong pananalita ng talata.
- issue: Ugnayan ng nagtipong kapulungan kay Solomon sa הַנּוֹעָדִים עָלָיו
  choice: “na nagtipon sa harap niya”
  alternative: “na nagtipon sa kanya”
  rationale: Maaaring ipahiwatig ng parirala ang pagtitipon sa harap ni Solomon o ang pagkakatipon kaugnay/patungo sa kanya. Pinili sa teksto ang natural na pagbasa sa konteksto, ngunit pinanatili sa talababa ang tunay na ambiguwidad.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Hinati sa dalawang pangungusap ang mahabang estrukturang Hebreo para sa likas na daloy, habang pinananatili ang kasama ni Solomon, ang lokasyon sa harap ng kaban, at ang patuloy na paghahandog.
