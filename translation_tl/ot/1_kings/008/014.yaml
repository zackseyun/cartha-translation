  text: Then the king turned around and blessed all the assembly of Israel[b][a], while all the assembly of Israel was standing.
translation:
  language: tl
  text: Pagkatapos, bumaling ang hari at binasbasan ang buong kapulungan ng Israel[a], habang nakatayo ang buong kapulungan ng Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “buong sambayanan ng Israel.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּסֵּב ... אֶת־פָּנָיו
  choice: humarap
  rationale: Literal na inilalarawan ng Hebreo ang pagpihit ng hari sa kaniyang mukha. Ang “humarap” ay natural sa modernong Tagalog at malinaw na nagpapahiwatig ng pag-ikot upang mapaharap sa kapulungan, nang hindi nagdaragdag ng direksiyong hindi tahasang binanggit.
- source_word: וַיְבָרֶךְ
  choice: binasbasan
  rationale: Karaniwang salin ng ברך sa ganitong pampublikong konteksto; maaari itong tumukoy sa pagbigkas ng pagpapala nang hindi kinakailangang palawakin ang teksto.
- source_word: כָּל־קְהַל יִשְׂרָאֵל
  choice: ang buong kapulungan ng Israel
  rationale: Ang קהל ay tumutukoy sa mga taong natipon bilang isang katawan. Pinananatili ng “kapulungan” ang kolektibo at pormal na diwa nito, samantalang natural pa rin sa marangal na Tagalog.
- source_word: וְכָל־קְהַל יִשְׂרָאֵל עֹמֵד
  choice: habang nakatayo ang buong kapulungan ng Israel
  rationale: Ang sugnay na may participle na עֹמֵד ay naglalarawan ng nagpapatuloy na kalagayan o postura ng kapulungan habang nagaganap ang pagbabasbas. Ang “habang nakatayo” ay natural na naghahatid ng ganitong pangyayaring nasa likuran.
