  text: בַּ/יּ֤וֹם הַ/שְּׁמִינִי֙ שִׁלַּ֣ח אֶת הָ/עָ֔ם וַֽ/יְבָרֲכ֖וּ אֶת הַ/מֶּ֑לֶךְ וַ/יֵּלְכ֣וּ לְ/אָהֳלֵי/הֶ֗ם שְׂמֵחִים֙ וְ/ט֣וֹבֵי לֵ֔ב עַ֣ל כָּל הַ/טּוֹבָ֗ה אֲשֶׁ֨ר עָשָׂ֤ה יְהוָה֙ לְ/דָוִ֣ד עַבְדּ֔/וֹ וּ/לְ/יִשְׂרָאֵ֖ל עַמּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/066.yaml
  text: On the eighth day he sent the people away[a], and they blessed the king and went to their tents, rejoicing and glad of heart because of all the good that Yahweh had done for David his servant and for Israel his people.
translation:
  language: tl
  text: Sa ikawalong araw, pinauwi niya ang mga tao. [a] Binasbasan nila ang hari at umuwi sa kani-kanilang tolda, na nagagalak at masaya ang kanilang kalooban dahil sa lahat ng kabutihang ginawa ni Yahweh para kay David na kanyang lingkod at para sa Israel na kanyang bayan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa kani-kanilang tahanan”; literal na “sa kani-kanilang tolda.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַשְּׁמִינִי
  choice: Nang ikawalong araw
  rationale: Tuwirang temporal na parirala; hindi idinagdag ang ‘ng kapistahan’ sapagkat ipinahihiwatig lamang iyon ng konteksto at wala sa mismong talata.
- source_word: שִׁלַּח אֶת הָעָם
  choice: pinauwi niya ang mga tao
  rationale: Ang piel ng שלח ay tumutukoy rito sa pagpapaalis o pagbibigay-pahintulot na umalis. Likas sa modernong Tagalog ang ‘pinauwi’ at akma sa kasunod na pagpunta nila sa kanilang mga tolda.
- source_word: וַיְבָרֲכוּ אֶת הַמֶּלֶךְ
  choice: Binasbasan nila ang hari
  rationale: Pinananatili ang karaniwang kahulugan ng ברך na ‘basbasan.’ Maaaring may diwa rin ito ng pamamaalam, ngunit hindi iyon ginawang pangunahing salin.
- source_word: לְאָהֳלֵיהֶם
  choice: sa kani-kanilang tolda
  rationale: Pinananatili ang literal na larawan ng Hebreong ‘kanilang mga tolda’; maaaring idiomatikong tumukoy ito sa kanilang mga tahanan, na inilagay sa talababa.
- source_word: שְׂמֵחִים וְטוֹבֵי לֵב
  choice: na nagagalak at may pusong masaya
  rationale: Inilalarawan ang masiglang kagalakan at panloob na kasiyahan habang pinananatili ang Hebreong larawan ng puso.
- source_word: עַל כָּל הַטּוֹבָה
  choice: dahil sa lahat ng kabutihang
  rationale: Ang עַל ay nagpapahayag dito ng dahilan ng kanilang kagalakan; sapat ang lawak ng ‘kabutihan’ upang saklawin ang mabubuting ginawa at mga pagpapalang tinanggap.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang transliterasyon ng personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
- source_word: לְדָוִד עַבְדּוֹ
  choice: para kay David na kanyang lingkod
  rationale: Sa kontekstong maharlika at tipanan, ang עבד ay likas na isinasaling ‘lingkod.’
- source_word: וּלְיִשְׂרָאֵל עַמּוֹ
  choice: at para sa Israel na kanyang bayan
  rationale: Tuwirang pinananatili ang pagtukoy sa Israel bilang bayan ni Yahweh.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Personal na pangalan ang tahasang nasa tekstong Hebreo; pinananatili ito bilang ‘Yahweh’ sa halip na palitan ng titulong ‘PANGINOON.’
- issue: Kahulugan ng pagbabasbas sa hari
  choice: Binasbasan nila ang hari
  alternative: Nagpaalam sila sa hari
  rationale: Maaaring kabilang sa konteksto ang isang pagbating pamamaalam, ngunit ang pangunahing leksikal na diwa ng ברך ay ‘basbasan’; pinananatili ng salin ang posibleng pampublikong paghiling ng kabutihan para sa hari.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang ‘pinauwi’ bilang natural na katumbas ng pagpapaalis sa kapulungan, at pinanatili ang ‘tolda’ at ‘puso’ upang mapanatili ang mahahalagang larawang Hebreo.
