  source_fidelity: 'Tapat ang salin sa Hebreo. Ang “Nasa puso” ay wastong katumbas ng idyomang וַיְהִי עִם לְבַב at pinananatili ang metapora nang hindi ipinipilit ang isang mas makitid na kahulugang gaya ng “binalak.” Nasa salin din ang lahat ng pangunahing sangkap: si David bilang ama ng nagsasalita, ang layuning magtayo, ang “bahay,” ang pariralang “para sa pangalan,” at si Yahweh bilang Diyos ng Israel.'
