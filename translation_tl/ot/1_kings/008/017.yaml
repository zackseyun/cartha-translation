source:
  edition: WLC
  text: וַ/יְהִ֕י עִם לְבַ֖ב דָּוִ֣ד אָבִ֑/י לִ/בְנ֣וֹת בַּ֔יִת לְ/שֵׁ֥ם יְהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/017.yaml
  text: It was in the heart of David my father to build a house for the name of Yahweh[a], the God of Israel.
translation:
  language: tl
  text: Nasa puso ng aking amang si David ang magtayo ng isang bahay para sa pangalan ni Yahweh,[a] ang Diyos ng Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “magtayo ng isang templo para sa pangalan ni Yahweh.” Literal na “bahay” ang Hebreo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי עִם לְבַב
  choice: Nasa puso
  rationale: Ang pormulang Hebreo ay nagsasaad na ang balak o hangaring ito ay nasa puso ni David. Pinananatili ng salin ang metapora ng puso sa natural na Filipino, nang hindi dinaragdagan ng tahasang panandang panahong wala sa teksto.
- source_word: דָּוִד אָבִי
  choice: aking amang si David
  rationale: Ito ang natural at marangal na ayos sa Filipino para sa Hebreong “David, my father,” at malinaw na ipinapakita ang ugnayan ng nagsasalita kay David.
- source_word: לִבְנוֹת
  choice: ang magtayo
  rationale: Karaniwang salin ng pandiwang בנה at angkop sa pagtatayo ng gusaling inilaan sa Diyos.
- source_word: בַּיִת
  choice: isang bahay
  rationale: Literal na “bahay” ang Hebreo. Pinananatili ito upang mapanatili ang larawan ng templo bilang bahay, habang inilalagay sa talababa ang mas interpretatibong “templo.”
- source_word: לְשֵׁם
  choice: para sa pangalan ni
  rationale: Pinananatili nito ang mahalagang biblikal na pariralang “para sa pangalan,” sa halip na paliitin iyon sa “para sa karangalan” o ibang pagpapakahulugan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ang personal na pangalang יהוה bilang Yahweh, sa halip na palitan ito ng titulong “PANGINOON.”
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ang Diyos ng Israel
  rationale: Natural na Filipino para sa pariralang konstruktong Hebreo at malinaw na appositive na pagkakakilanlan kay Yahweh.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON o Jehovah
  rationale: Personal na pangalan ang nasa Hebreong teksto; pinananatili ng “Yahweh” ang pangalang iyon sa halip na palitan ng isang titulo.
- issue: Kung isasalin ang בַּיִת bilang “bahay” o “templo”
  choice: bahay
  alternative: templo
  rationale: “Bahay” ang mismong salita sa Hebreo at mahalaga ang larawang ito sa konteksto. Totoo sa tinutukoy na gusali ang “templo,” ngunit mas interpretatibo iyon kaya inilagay bilang alternatibo sa talababa.
- issue: Kung papatagin ang idyoma bilang tahasang “binalak”
  choice: Nasa puso
  alternative: binalak o hinangad
  rationale: Pinananatili ng “nasa puso” ang metapora at ang saklaw nitong maaaring tumukoy sa balak o hangarin, sa halip na pumili nang tahasan sa isa lamang.
translation_notes:
  register: Modernong Filipino na natural, malinaw, at marangal. Ginamit ang “aking amang si David” bilang likas na ayos sa Filipino, pinanatili ang metapora ng puso at ang “bahay” ng Hebreo, at iniwasan ang di-kailangang panandang diskurso gaya ng “Ngayon.”
