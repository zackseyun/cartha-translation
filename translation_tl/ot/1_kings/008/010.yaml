id: 1KI.8.10
reference: 1 Kings 8:10
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יְהִ֕י בְּ/צֵ֥את הַ/כֹּהֲנִ֖ים מִן הַ/קֹּ֑דֶשׁ וְ/הֶ/עָנָ֥ן מָלֵ֖א אֶת בֵּ֥ית יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/010.yaml
  text: And when the priests came out from the holy place[a], the cloud filled the house of Yahweh.
translation:
  language: tl
  text: Nang lumabas ang mga pari mula sa banal na lugar[a], napuno ng ulap ang bahay ni Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mula sa santuwaryo” o “mula sa Dakong Banal.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בְּצֵאת
  choice: Nang lumabas
  rationale: Ang וַיְהִי ay nag-uugnay sa kasunod na pangyayari sa salaysay, at ang בְּצֵאת ay isang temporal na parirala. Likas sa modernong Tagalog ang “Nang lumabas” at naipahahayag nito ang buong temporal na diwa nang hindi gumagamit ng mabigat na literal na “At nangyari.”
- source_word: הַכֹּהֲנִים
  choice: ang mga pari
  rationale: Tuwirang salin ng tiyak na pangngalang maramihan.
- source_word: מִן הַקֹּדֶשׁ
  choice: mula sa banal na lugar
  rationale: Ang קֹדֶשׁ ay tumutukoy rito sa sagradong bahagi ng templo na pinanggalingan ng mga pari. Pinananatili ng “banal na lugar” ang payak na diwa ng Hebreo nang hindi ito ginagawang mas tiyak kaysa sa pinagmulan.
- source_word: וְהֶעָנָן
  choice: ang ulap
  rationale: Ang pang-ugnay na waw ay likas nang naipapakita ng ayos ng pangungusap matapos ang sugnay na temporal; hindi kailangan ang hiwalay na “at” sa Tagalog.
- source_word: מָלֵא
  choice: napuno
  rationale: Ang Qal perfect ay nagsasaad ng naganap na kilos. Sa Tagalog, ang “napuno ng ulap ang bahay” ay natural na konstruksiyong nagsasaad na ang bahay ang lubos na nilaganapan ng ulap.
- source_word: בֵּית יְהוָה
  choice: ang bahay ni Yahweh
  rationale: Pinananatili ng “bahay” ang kongkretong larawan ng בֵּית, samantalang ang personal na pangalang יְהוָה ay isinasaling “Yahweh.”
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Personal na pangalang tipan ang יְהוָה sa tekstong Hebreo. Ang “Yahweh” ay tuwirang kumakatawan sa pangalan sa halip na palitan ito ng titulong “PANGINOON.”
- issue: Saklaw ng הַקֹּדֶשׁ sa templo
  choice: banal na lugar
  alternative: santuwaryo; Dakong Banal
  rationale: Hindi tahasang nililinaw ng salita lamang kung dapat itong ituring na pormal na teknikal na pangalan. Kaya pinananatili sa pangunahing teksto ang mas malawak na “banal na lugar,” at inilalagay sa talababa ang mga posibleng alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang natural na ayos na “Nang …, napuno …” habang pinananatili ang konkretong larawang “bahay ni Yahweh” at ang leksikal na kalabuan ng הַקֹּדֶשׁ sa pamamagitan ng talababa.
