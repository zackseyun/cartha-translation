  text: לְ/הַטּ֥וֹת לְבָבֵ֖/נוּ אֵלָ֑י/ו לָ/לֶ֣כֶת בְּ/כָל דְּרָכָ֗י/ו וְ/לִ/שְׁמֹ֨ר מִצְוֺתָ֤י/ו וְ/חֻקָּי/ו֙ וּ/מִשְׁפָּטָ֔י/ו אֲשֶׁ֥ר צִוָּ֖ה אֶת אֲבֹתֵֽי/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/058.yaml
  text: that he may incline our hearts to himself[a], to walk in all his ways and to keep his commandments, his statutes, and his judgments, which he commanded our fathers.
translation:
  language: tl
  text: upang ibaling niya ang ating puso tungo sa kanya, upang lumakad tayo sa lahat ng kanyang mga daan at tuparin ang kanyang mga utos, mga tuntunin, at mga hatol na iniutos niya sa ating mga ninuno.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “ating mga ama.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לְהַטּוֹת
  choice: ikiling
  rationale: Pinananatili nito ang sanhiang diwa ng Hiphil at ang larawang ang puso ay itinuturo o ibinabaling sa Diyos.
- source_word: לְבָבֵנוּ אֵלָיו
  choice: ang ating mga puso sa kanya
  rationale: Ang “puso” ay natural na salin ng sentro ng isip, kalooban, at damdamin; malinaw rin ang direksiyong ipinahihiwatig ng אֵלָיו.
- source_word: לָלֶכֶת בְּכָל דְּרָכָיו
  choice: lumakad tayo sa lahat ng kanyang mga daan
  rationale: Pinananatili ang tipanang metapora ng paglakad bilang pamumuhay ayon sa mga daan ng Diyos.
- source_word: וְלִשְׁמֹר
  choice: tuparin
  rationale: Sa kaugnayan ng mga utos, natural na ipinahahayag ng “tuparin” ang maingat na pagsunod, sa halip na literal na pagbabantay.
- source_word: מִצְוֺתָיו
  choice: kanyang mga utos
  rationale: Tuwirang tumutukoy sa mga obligasyong iniutos ng Diyos.
- source_word: וְחֻקָּיו
  choice: mga tuntunin
  rationale: Tumutukoy sa mga itinakdang alituntunin o batas at nananatiling naiiba sa “mga utos” at “mga hatol.”
- source_word: וּמִשְׁפָּטָיו
  choice: mga hatol
  rationale: Pinananatili ang legal na diwa ng מִשְׁפָּט at ang tatluhang pagkakaiba ng mga terminong pambatas.
- source_word: אֶת אֲבֹתֵינוּ
  choice: ating mga ninuno
  rationale: Sa kontekstong ito, ang pangmaramihang אָבוֹת ay tumutukoy sa mga naunang salinlahi ng Israel; “mga ninuno” ang natural at tumpak na modernong Tagalog, habang maitatala ang mas literal na anyo.
theological_decisions:
- issue: Tatlong katawagang kaugnay ng tipanang kautusan
  choice: mga utos, mga tuntunin, at mga hatol
  alternative: mga kautusan, mga palatuntunan, at mga tuntuning legal
  rationale: Pinananatiling magkakaiba ang מִצְוֹת, חֻקִּים, at מִשְׁפָּטִים sa halip na pagsamahin ang mga ito sa iisang pangkalahatang salita.
- issue: Pagkilos ng Diyos at pagtugon ng tao
  choice: upang ikiling niya ang ating mga puso ... para lumakad tayo ... at tuparin
  alternative: ibaling niya ang ating kalooban ... upang mamuhay tayo ... at sundin
  rationale: 'Pinananatili ang tensiyon sa teksto: ang Diyos ang kumikiling sa puso, ngunit ang bayan ang lumalakad at tumutupad.'
- issue: Pangalan sa mga naunang salinlahi ng Israel
  choice: ating mga ninuno
  alternative: ating mga ama
  rationale: Ang “mga ninuno” ay natural na kolektibong pagtukoy sa mga προgenitor ng Israel sa modernong Tagalog; inilalagay sa talababa ang literal na anyong panlalaki ng Hebreo.
translation_notes:
  register: Makabago ngunit marangal na Filipino; pinanatili ang biblikal na metapora ng puso, paglakad, at mga daan. Ginamit ang “kanya” sa halip na kapitalisadong panghalip, at iniwasan ang labis na teknikal o makalumang mga terminong pambatas.
