  source_fidelity: Tumpak na naipapahayag ng draft ang layuning ang Diyos ang kumilos upang ang bayan ay lumakad sa kanyang mga daan at tumupad sa tatlong uri ng kautusan. Gayunman, ang “ikiling ... sa kanya” ay hindi likas na Tagalog para sa metapora ng Hebreo at maaaring magmukhang pisikal na pagkiling.
  naturalness: Mas natural sa modernong Filipino ang “ibaling niya ang ating puso tungo sa kanya.” Pinananatili nito ang sanhiang diwa at direksyon ng Hebreong pananalita nang hindi nagdadagdag ng kahulugang doktrinal.
  terminology: Ang “mga utos, mga tuntunin, at mga hatol” ay maayos na nagpapanatili sa tatlong magkakaibang terminong legal. Ang “mga ninuno” ay natural na kolektibong salin sa Tagalog; nililinaw ng talababa ang literal na “mga ama.”
