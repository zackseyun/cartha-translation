revisions:
- from: Kung ang isang tao ay magkasala laban sa kaniyang kapwa, at atangan siya ng isang sumpang panunumpa upang pasumpain siya, at ang sumpang panunumpa ay dumating sa harap ng iyong altar sa bahay na ito,
  to: Kung ang isang tao ay magkasala laban sa kaniyang kapwa, at isang panunumpa[a] ang ipataw sa kaniya upang siya'y pasumpain, at ang panunumpa ay iharap sa iyong altar sa bahay na ito,
  rationale: Pinalitan ang hindi likas na “sumpang panunumpa” ng “panunumpa” at ibinalik sa talababa ang kahulugang “sumpa,” alinsunod sa gamit ng אָלָה at sa ambigwidad nito. Pinalitan din ang “atangan siya ng” ng mas likas na pasibong “isang panunumpa ang ipataw sa kaniya.” Ang “iharap sa iyong altar” ay malinaw na Filipino para sa legal na pagdadala ng panunumpa sa harap ng altar, habang pinananatili ang simuno bilang panunumpa.
